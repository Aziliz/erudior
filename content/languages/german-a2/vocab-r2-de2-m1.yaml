# German A2, module 1, round 2: words introduced by the honors lessons 04h1 and 04h2.
# Checked against every vocab file of German A1, A2 and B1 (term + part of speech, first meaning).

# --- 04h1 Lebensgeschichten: reading and writing a short biography ---
- id: de2-m1-r2-w01
  lesson: de2-m1-h-biographies
  term: heimlich
  pos: adjective
  meanings: [secretly, secret, in secret, without telling anyone]
  example: Sie ist heimlich mit dem Auto losgefahren.
  exampleEn: She set off in the car secretly.
  note: 'Used as an adverb (heimlich losfahren) and as an adjective (ein heimliches Treffen).'
- id: de2-m1-r2-w02
  lesson: de2-m1-h-biographies
  term: das Benzin
  pos: noun
  plural: —
  meanings: [petrol, gasoline, gas (fuel), fuel]
  example: Das Benzin ist heute wieder teurer.
  exampleEn: Petrol is more expensive again today.
- id: de2-m1-r2-w03
  lesson: de2-m1-h-biographies
  term: tanken
  pos: verb
  meanings: [to fill up (with fuel), to fill up, to get petrol, to get gas, to refuel]
  example: Wir müssen vor der Autobahn noch tanken.
  exampleEn: We still need to fill up before the motorway.
- id: de2-m1-r2-w04
  lesson: de2-m1-h-biographies
  term: die Bremse
  pos: noun
  plural: die Bremsen
  meanings: [brake, brakes]
  example: Die Bremsen an meinem Fahrrad sind kaputt.
  exampleEn: The brakes on my bike are broken.
- id: de2-m1-r2-w05
  lesson: de2-m1-h-biographies
  term: der Motor
  pos: noun
  plural: die Motoren
  meanings: [engine, motor]
  example: Der Motor ist sehr laut.
  exampleEn: The engine is very loud.
  note: 'Stress: MO-tor, plural mo-TO-ren.'
- id: de2-m1-r2-w06
  lesson: de2-m1-h-biographies
  term: das Pferd
  pos: noun
  plural: die Pferde
  meanings: [horse]
  example: Früher hat man mit Pferden gearbeitet.
  exampleEn: In the past people worked with horses.
- id: de2-m1-r2-w07
  lesson: de2-m1-h-biographies
  term: der Kilometer
  pos: noun
  plural: die Kilometer
  meanings: [kilometre, kilometer, km]
  example: Bis Pforzheim sind es rund 100 Kilometer.
  exampleEn: It's about 100 kilometres to Pforzheim.
- id: de2-m1-r2-w08
  lesson: de2-m1-h-biographies
  term: die Rückfahrt
  pos: noun
  plural: die Rückfahrten
  meanings: [return journey, return trip, journey back, way back]
  example: Auf der Rückfahrt haben wir im Zug geschlafen.
  exampleEn: We slept on the train on the way back.
- id: de2-m1-r2-w09
  lesson: de2-m1-h-biographies
  term: die Berufserfahrung
  pos: noun
  plural: die Berufserfahrungen
  meanings: [work experience, professional experience, job experience]
  example: Für die Stelle braucht man drei Jahre Berufserfahrung.
  exampleEn: You need three years of work experience for the job.

# --- 04h2 Passing it on: reporting what people said and asked ---
- id: de2-m1-r2-w10
  lesson: de2-m1-h-reported-speech
  term: weitersagen
  pos: verb
  meanings: [to pass on (tell others), to pass on, to tell others, to tell anyone, to spread]
  example: Das ist ein Geheimnis, sag es bitte nicht weiter!
  exampleEn: It's a secret, please don't tell anyone!
  note: 'Separable: ich sage es weiter. Perfect: hat weitergesagt.'
- id: de2-m1-r2-w11
  lesson: de2-m1-h-reported-speech
  term: flüstern
  pos: verb
  meanings: [to whisper]
  example: Im Kino flüstert sie mir etwas ins Ohr.
  exampleEn: In the cinema she whispers something in my ear.
- id: de2-m1-r2-w12
  lesson: de2-m1-h-reported-speech
  term: das Gerücht
  pos: noun
  plural: die Gerüchte
  meanings: [rumour, rumor]
  example: Das stimmt nicht, das ist nur ein Gerücht.
  exampleEn: That's not true, it's just a rumour.
- id: de2-m1-r2-w13
  lesson: de2-m1-h-reported-speech
  term: versprechen
  pos: verb
  meanings: [to promise]
  example: Ich verspreche dir, dass ich pünktlich komme.
  exampleEn: I promise you that I'll be on time.
  note: 'Inseparable, stem change: du versprichst, er verspricht. Past: versprach. Perfect: hat versprochen.'
- id: de2-m1-r2-w14
  lesson: de2-m1-h-reported-speech
  term: verraten
  pos: verb
  meanings: [to give away (a secret), to give away, to reveal, to tell, to betray]
  example: Verrat ihr bitte nicht, was wir ihr schenken!
  exampleEn: Please don't tell her what we're giving her!
  note: 'Inseparable, stem change: du verrätst, er verrät. Past: verriet. Perfect: hat verraten.'
- id: de2-m1-r2-w15
  lesson: de2-m1-h-reported-speech
  term: das Geheimnis
  pos: noun
  plural: die Geheimnisse
  meanings: [secret]
  example: Kannst du ein Geheimnis für dich behalten?
  exampleEn: Can you keep a secret?
- id: de2-m1-r2-w16
  lesson: de2-m1-h-reported-speech
  term: der Zettel
  pos: noun
  plural: die Zettel
  meanings: [note (slip of paper), note, slip of paper, piece of paper]
  example: Ich habe dir einen Zettel auf den Tisch gelegt.
  exampleEn: I've left you a note on the table.
- id: de2-m1-r2-w17
  lesson: de2-m1-h-reported-speech
  term: die Mailbox
  pos: noun
  plural: die Mailboxen
  meanings: [voicemail, mailbox (on a phone), voice mail]
  example: Ich habe dir auf die Mailbox gesprochen.
  exampleEn: I left you a voicemail.
