# German A2, module 2, round 2: words introduced by the honors lessons.
# Checked against A1-WORDS.tsv, every German A2 vocab file and every German B1 vocab file
# (B1 requires A2, so a word here must not appear in B1 either).

# --- 08h1 Verbs with a dative reflexive (de2-m2-h-dative-reflexive) ---
- id: de2-m2-r2-w01
  lesson: de2-m2-h-dative-reflexive
  term: sich merken
  pos: verb
  meanings: [to remember (make a mental note of), to remember, to make a note of, to memorize, to memorise, to bear in mind, to keep in mind]
  example: Merk dir bitte meine neue Nummer.
  exampleEn: Please remember my new number.
  note: 'Dative reflexive: ich merke mir etwas. Perfect: hat sich gemerkt. Merk dir das! = Remember that!'
- id: de2-m2-r2-w02
  lesson: de2-m2-h-dative-reflexive
  term: sich ansehen
  pos: verb
  meanings: [to have a look at, to look at, to take a look at, to watch, to view]
  example: Am Samstag sehen wir uns die Wohnung an.
  exampleEn: On Saturday we're having a look at the flat.
  note: 'Separable, dative reflexive: ich sehe mir den Film an; du siehst dir, er sieht sich … an. Perfect: hat sich angesehen.'
- id: de2-m2-r2-w03
  lesson: de2-m2-h-dative-reflexive
  term: sich anschauen
  pos: verb
  meanings: [to take a look at (southern German, Austrian), to have a look at, to look at, to watch]
  example: Schau dir mal dieses Foto an!
  exampleEn: Take a look at this photo!
  note: 'Separable, dative reflexive. Means the same as sich ansehen; more usual in southern Germany, Austria and Switzerland. Perfect: hat sich angeschaut.'
- id: de2-m2-r2-w04
  lesson: de2-m2-h-dative-reflexive
  term: sich ausdenken
  pos: verb
  meanings: [to make up (invent), to make up, to invent, to think up, to come up with, to dream up]
  example: Die Geschichte hat er sich nur ausgedacht.
  exampleEn: He just made the story up.
  note: 'Separable, dative reflexive: ich denke mir etwas aus. Perfect: hat sich ausgedacht (mixed verb like denken).'
- id: de2-m2-r2-w05
  lesson: de2-m2-h-dative-reflexive
  term: sich gönnen
  pos: verb
  meanings: [to treat yourself to, to treat oneself to, to allow yourself, to allow oneself, to indulge in]
  example: Nach der Prüfung gönne ich mir ein Wochenende am See.
  exampleEn: After the exam I'm treating myself to a weekend at the lake.
  note: 'Dative reflexive: ich gönne mir etwas. Perfect: hat sich gegönnt. Gönn dir was! = Treat yourself!'
- id: de2-m2-r2-w06
  lesson: de2-m2-h-dative-reflexive
  term: brechen
  pos: verb
  meanings: [to break, to fracture]
  example: Ich habe mir beim Skifahren das Bein gebrochen.
  exampleEn: I broke my leg skiing.
  note: 'du brichst, er bricht; perfect: hat gebrochen. For your own body part: sich (Dativ) den Arm brechen.'
- id: de2-m2-r2-w07
  lesson: de2-m2-h-dative-reflexive
  term: sich verstauchen
  pos: verb
  meanings: [to sprain, to twist (an ankle, a wrist)]
  example: Er hat sich beim Joggen den Fuß verstaucht.
  exampleEn: He sprained his ankle jogging.
  note: 'Used with a body part and a dative reflexive: ich verstauche mir den Fuß. Perfect: hat sich verstaucht.'
- id: de2-m2-r2-w08
  lesson: de2-m2-h-dative-reflexive
  term: einander
  pos: pronoun
  meanings: [each other, one another]
  example: Die zwei Schwestern helfen einander.
  exampleEn: The two sisters help each other.
  note: 'Never changes. Joins a preposition as one word: miteinander, voneinander, aneinander.'
- id: de2-m2-r2-w09
  lesson: de2-m2-h-dative-reflexive
  term: miteinander
  pos: adverb
  meanings: [with each other, with one another, together]
  example: Wir sprechen jeden Abend miteinander.
  exampleEn: We talk to each other every evening.
- id: de2-m2-r2-w10
  lesson: de2-m2-h-dative-reflexive
  term: das Gedächtnis
  pos: noun
  plural: '—'
  meanings: [memory (the ability to remember), memory]
  example: Mein Opa hat ein sehr gutes Gedächtnis.
  exampleEn: My grandpa has a very good memory.
- id: de2-m2-r2-w11
  lesson: de2-m2-h-dative-reflexive
  term: vergesslich
  pos: adjective
  meanings: [forgetful]
  example: In letzter Zeit bin ich ein bisschen vergesslich.
  exampleEn: Lately I've been a bit forgetful.
- id: de2-m2-r2-w12
  lesson: de2-m2-h-dative-reflexive
  kind: phrase
  term: Stell dir vor!
  alt: [Stell dir vor]
  meanings: [Guess what!, imagine!, just imagine, guess what]
  example: Stell dir vor, ich habe eine neue Stelle!
  exampleEn: Guess what, I've got a new job!

# --- 08h2 Du or Sie? (de2-m2-h-du-or-sie) ---
- id: de2-m2-r2-w13
  lesson: de2-m2-h-du-or-sie
  term: duzen
  pos: verb
  meanings: [to say du to, to address as du, to use du with, to be on first-name terms with]
  example: Im Sportverein duzen sich alle.
  exampleEn: In the sports club everyone says du to each other.
  note: 'Often reciprocal: wir duzen uns. Perfect: hat geduzt.'
- id: de2-m2-r2-w14
  lesson: de2-m2-h-du-or-sie
  term: siezen
  pos: verb
  meanings: [to say Sie to, to address as Sie, to use Sie with]
  example: Meine Nachbarn und ich siezen uns.
  exampleEn: My neighbours and I say Sie to each other.
  note: 'Perfect: hat gesiezt.'
- id: de2-m2-r2-w15
  lesson: de2-m2-h-du-or-sie
  term: das Du
  pos: noun
  plural: '—'
  meanings: [the informal "you" (du), the du form, the informal form of address, du]
  example: Meine Chefin hat mir das Du angeboten.
  exampleEn: My boss suggested we say du to each other.
  note: 'Written with a capital D as a noun: das Du anbieten (to offer the du). The opposite is das Sie.'
- id: de2-m2-r2-w16
  lesson: de2-m2-h-du-or-sie
  term: anbieten
  pos: verb
  meanings: [to offer]
  example: Darf ich Ihnen einen Kaffee anbieten?
  exampleEn: May I offer you a coffee?
  note: 'Separable, with a dative person: ich biete dir etwas an. Perfect: hat angeboten.'
- id: de2-m2-r2-w17
  lesson: de2-m2-h-du-or-sie
  term: die Höflichkeit
  pos: noun
  plural: '—'
  meanings: [politeness, courtesy]
  example: Das Sie ist oft eine Frage der Höflichkeit.
  exampleEn: Sie is often a matter of politeness.
- id: de2-m2-r2-w18
  lesson: de2-m2-h-du-or-sie
  term: unhöflich
  pos: adjective
  meanings: [impolite, rude]
  example: Es ist unhöflich, einen Fremden einfach zu duzen.
  exampleEn: It's rude to simply say du to a stranger.
- id: de2-m2-r2-w19
  lesson: de2-m2-h-du-or-sie
  term: förmlich
  pos: adjective
  meanings: [formal, formally]
  example: In der Bank ist der Ton eher förmlich.
  exampleEn: At the bank the tone is rather formal.
- id: de2-m2-r2-w20
  lesson: de2-m2-h-du-or-sie
  term: locker
  pos: adjective
  meanings: [relaxed (informal, casual), relaxed, casual, laid-back, easy-going, loose]
  example: In unserem Team ist alles sehr locker.
  exampleEn: In our team everything is very relaxed.
- id: de2-m2-r2-w21
  lesson: de2-m2-h-du-or-sie
  term: üblich
  pos: adjective
  meanings: [usual, normal, customary, common]
  example: In vielen Firmen ist das Du heute üblich.
  exampleEn: In many companies du is usual today.
- id: de2-m2-r2-w22
  lesson: de2-m2-h-du-or-sie
  term: der Nachname
  pos: noun
  plural: die Nachnamen
  meanings: [last name, family name]
  example: Wie ist Ihr Nachname, bitte?
  exampleEn: What is your last name, please?
  note: 'Means the same as der Familienname (A1). Weak-type ending: des Nachnamens.'
- id: de2-m2-r2-w23
  lesson: de2-m2-h-du-or-sie
  term: der Spitzname
  pos: noun
  plural: die Spitznamen
  meanings: [nickname]
  example: Alle nennen ihn Toni, das ist sein Spitzname.
  exampleEn: Everyone calls him Toni, that's his nickname.
- id: de2-m2-r2-w24
  lesson: de2-m2-h-du-or-sie
  term: die Dame
  pos: noun
  plural: die Damen
  meanings: [lady]
  example: Meine Damen und Herren, herzlich willkommen!
  exampleEn: Ladies and gentlemen, a warm welcome!
- id: de2-m2-r2-w25
  lesson: de2-m2-h-du-or-sie
  term: der Titel
  pos: noun
  plural: die Titel
  meanings: [title, academic title]
  example: Sie hat einen Doktortitel, also sagen viele „Frau Doktor Weber“.
  exampleEn: She has a doctorate, so many people say "Frau Doktor Weber".
- id: de2-m2-r2-w26
  lesson: de2-m2-h-du-or-sie
  kind: phrase
  term: Hallo zusammen!
  alt: [Hallo zusammen]
  meanings: [Hello everyone!, hi everyone, hello all, hi all, hello everybody]
  example: Hallo zusammen! Schön, dass ihr alle da seid.
  exampleEn: Hello everyone! Great that you're all here.
