# German A2, module 2, round 2: words introduced by the honors lessons.
# Checked against A1-WORDS.tsv, every German A2 vocab file and every German B1 vocab file
# (B1 requires A2, so a word here must not appear in B1 either).

# --- 08h1 Verbs with a dative reflexive (de2-m2-h-dative-reflexive) ---
- id: de2-m2-r2-w01
  lesson: de2-m2-h-dative-reflexive
  term: sich merken
  pos: verb
  meanings: [to remember (make a mental note of), to remember, to make a note of, to memorize, to memorise, to bear in mind, to keep in mind]
  example: Merk dir bitte meine neue Nummer.
  exampleEn: Please remember my new number.
  note: 'Dative reflexive: ich merke mir etwas. Perfect: hat sich gemerkt. Merk dir das! = Remember that!'
- id: de2-m2-r2-w02
  lesson: de2-m2-h-dative-reflexive
  term: sich ansehen
  pos: verb
  meanings: [to have a look at, to look at, to take a look at, to watch, to view]
  example: Am Samstag sehen wir uns die Wohnung an.
  exampleEn: On Saturday we're having a look at the flat.
  note: 'Separable, dative reflexive: ich sehe mir den Film an; du siehst dir, er sieht sich … an. Perfect: hat sich angesehen.'
- id: de2-m2-r2-w03
  lesson: de2-m2-h-dative-reflexive
  term: sich anschauen
  pos: verb
  meanings: [to take a look at (southern German, Austrian), to have a look at, to look at, to watch]
  example: Schau dir mal dieses Foto an!
  exampleEn: Take a look at this photo!
  note: 'Separable, dative reflexive. Means the same as sich ansehen; more usual in southern Germany, Austria and Switzerland. Perfect: hat sich angeschaut.'
- id: de2-m2-r2-w04
  lesson: de2-m2-h-dative-reflexive
  term: sich ausdenken
  pos: verb
  meanings: [to make up (invent), to make up, to invent, to think up, to come up with, to dream up]
  example: Die Geschichte hat er sich nur ausgedacht.
  exampleEn: He just made the story up.
  note: 'Separable, dative reflexive: ich denke mir etwas aus. Perfect: hat sich ausgedacht (mixed verb like denken).'
- id: de2-m2-r2-w05
  lesson: de2-m2-h-dative-reflexive
  term: sich gönnen
  pos: verb
  meanings: [to treat yourself to, to treat oneself to, to allow yourself, to allow oneself, to indulge in]
  example: Nach der Prüfung gönne ich mir ein Wochenende am See.
  exampleEn: After the exam I'm treating myself to a weekend at the lake.
  note: 'Dative reflexive: ich gönne mir etwas. Perfect: hat sich gegönnt. Gönn dir was! = Treat yourself!'
- id: de2-m2-r2-w06
  lesson: de2-m2-h-dative-reflexive
  term: brechen
  pos: verb
  meanings: [to break, to fracture]
  example: Ich habe mir beim Skifahren das Bein gebrochen.
  exampleEn: I broke my leg skiing.
  note: 'du brichst, er bricht; perfect: hat gebrochen. For your own body part: sich (Dativ) den Arm brechen.'
- id: de2-m2-r2-w07
  lesson: de2-m2-h-dative-reflexive
  term: sich verstauchen
  pos: verb
  meanings: [to sprain, to twist (an ankle, a wrist)]
  example: Er hat sich beim Joggen den Fuß verstaucht.
  exampleEn: He sprained his ankle jogging.
  note: 'Used with a body part and a dative reflexive: ich verstauche mir den Fuß. Perfect: hat sich verstaucht.'
- id: de2-m2-r2-w08
  lesson: de2-m2-h-dative-reflexive
  term: einander
  pos: pronoun
  meanings: [each other, one another]
  example: Die zwei Schwestern helfen einander.
  exampleEn: The two sisters help each other.
  note: 'Never changes. Joins a preposition as one word: miteinander, voneinander, aneinander.'
- id: de2-m2-r2-w09
  lesson: de2-m2-h-dative-reflexive
  term: miteinander
  pos: adverb
  meanings: [with each other, with one another, together]
  example: Wir sprechen jeden Abend miteinander.
  exampleEn: We talk to each other every evening.
- id: de2-m2-r2-w10
  lesson: de2-m2-h-dative-reflexive
  term: das Gedächtnis
  pos: noun
  plural: '—'
  meanings: [memory (the ability to remember), memory]
  example: Mein Opa hat ein sehr gutes Gedächtnis.
  exampleEn: My grandpa has a very good memory.
- id: de2-m2-r2-w11
  lesson: de2-m2-h-dative-reflexive
  term: vergesslich
  pos: adjective
  meanings: [forgetful]
  example: In letzter Zeit bin ich ein bisschen vergesslich.
  exampleEn: Lately I've been a bit forgetful.
- id: de2-m2-r2-w12
  lesson: de2-m2-h-dative-reflexive
  kind: phrase
  term: Stell dir vor!
  alt: [Stell dir vor]
  meanings: [Guess what!, imagine!, just imagine, guess what]
  example: Stell dir vor, ich habe eine neue Stelle!
  exampleEn: Guess what, I've got a new job!

# --- 08h2 Feelings with the dative (de2-m2-h-dative-feelings) ---
- id: de2-m2-r2-w13
  lesson: de2-m2-h-dative-feelings
  term: leidtun
  pos: verb
  meanings: [to feel sorry for (dative), to be sorry, to feel sorry, to regret]
  example: Der kleine Hund tut mir leid.
  exampleEn: I feel sorry for the little dog.
  note: 'Thing or person as subject, the one who is sorry in the dative: Es tut mir leid. Du tust mir leid. Perfect: hat leidgetan.'
- id: de2-m2-r2-w14
  lesson: de2-m2-h-dative-feelings
  term: einfallen
  pos: verb
  meanings: [to occur to (an idea, a name), to think of, to come to mind, to remember]
  example: Mir fällt sein Name nicht ein.
  exampleEn: I can't think of his name.
  note: 'Separable; the idea is the subject, the person dative: es fällt mir ein. Perfect: ist eingefallen.'
- id: de2-m2-r2-w15
  lesson: de2-m2-h-dative-feelings
  term: auffallen
  pos: verb
  meanings: [to strike (be noticed by), to notice, to be noticeable, to stand out]
  example: Mir ist aufgefallen, dass du sehr ruhig bist.
  exampleEn: I've noticed that you're very quiet.
  note: 'Separable; the thing noticed is the subject, the person dative. Perfect: ist aufgefallen.'
- id: de2-m2-r2-w16
  lesson: de2-m2-h-dative-feelings
  term: vorkommen
  pos: verb
  meanings: [to seem (to someone), to seem, to appear, to happen, to occur]
  example: Das kommt mir komisch vor.
  exampleEn: That seems strange to me.
  note: 'Separable, with a dative person and usually an adjective. Perfect: ist vorgekommen. Without a dative: to happen (Das kommt vor).'
- id: de2-m2-r2-w17
  lesson: de2-m2-h-dative-feelings
  term: leichtfallen
  pos: verb
  meanings: [to be easy for, to find easy, to come easily]
  example: Sprachen fallen mir leicht.
  exampleEn: I find languages easy.
  note: 'Separable, dative person: Es fällt mir leicht. Perfect: ist leichtgefallen.'
- id: de2-m2-r2-w18
  lesson: de2-m2-h-dative-feelings
  term: schwerfallen
  pos: verb
  meanings: [to be hard for, to find hard, to find difficult, to be difficult for]
  example: Das frühe Aufstehen fällt mir schwer.
  exampleEn: I find getting up early hard.
  note: 'Separable, dative person: Es fällt mir schwer. Perfect: ist schwergefallen.'
- id: de2-m2-r2-w19
  lesson: de2-m2-h-dative-feelings
  term: schwindlig
  pos: adjective
  meanings: [dizzy, giddy]
  example: Nach dem Karussell ist mir schwindlig.
  exampleEn: After the merry-go-round I feel dizzy.
  note: 'Usually with the dative: mir ist schwindlig. Also spelled schwindelig.'
  alt: [schwindelig]
- id: de2-m2-r2-w20
  lesson: de2-m2-h-dative-feelings
  term: übel
  pos: adjective
  meanings: [sick (nauseous), nauseous, queasy, sick, bad]
  example: Im Bus ist mir oft übel.
  exampleEn: I often feel sick on the bus.
  note: 'mir ist übel = I feel sick. Also "bad" in phrases: nicht übel (not bad).'
- id: de2-m2-r2-w21
  lesson: de2-m2-h-dative-feelings
  term: unangenehm
  pos: adjective
  meanings: [unpleasant, awkward, uncomfortable, embarrassing]
  example: Die Frage war mir sehr unangenehm.
  exampleEn: The question made me very uncomfortable.
- id: de2-m2-r2-w22
  lesson: de2-m2-h-dative-feelings
  term: angenehm
  pos: adjective
  meanings: [pleasant, agreeable, comfortable]
  example: Das Wasser ist angenehm warm.
  exampleEn: The water is pleasantly warm.
- id: de2-m2-r2-w23
  lesson: de2-m2-h-dative-feelings
  term: recht
  pos: adjective
  meanings: [all right (with someone), all right, OK, convenient]
  example: Ist es dir recht, wenn ich später komme?
  exampleEn: Is it all right with you if I come later?
  note: 'Usually with a dative person: Das ist mir recht. Not the same as recht haben (to be right).'
- id: de2-m2-r2-w24
  lesson: de2-m2-h-dative-feelings
  term: komisch
  pos: adjective
  meanings: [strange (odd), strange, odd, weird, funny, peculiar]
  example: Das Essen schmeckt komisch.
  exampleEn: The food tastes strange.
- id: de2-m2-r2-w25
  lesson: de2-m2-h-dative-feelings
  term: lieb haben
  pos: verb
  alt: [liebhaben]
  meanings: [to love (family, friends; not romantic), to love, to be fond of, to care about]
  example: Ich hab dich lieb, Oma!
  exampleEn: I love you, Grandma!
  note: 'Separable: ich habe dich lieb. Also written liebhaben. Warm but not romantic; in messages hdl = hab dich lieb.'
- id: de2-m2-r2-w26
  lesson: de2-m2-h-dative-feelings
  term: das Heimweh
  pos: noun
  plural: '—'
  meanings: [homesickness]
  example: In der ersten Woche hatte ich Heimweh.
  exampleEn: In the first week I was homesick.
  note: 'Heimweh haben = to be homesick.'
- id: de2-m2-r2-w27
  lesson: de2-m2-h-dative-feelings
  kind: phrase
  term: Schluss machen
  meanings: [to break up, to split up, to end it]
  example: Sie hat mit ihrem Freund Schluss gemacht.
  exampleEn: She broke up with her boyfriend.
  note: 'mit + dative: mit jemandem Schluss machen.'
- id: de2-m2-r2-w28
  lesson: de2-m2-h-dative-feelings
  term: der Schwarm
  pos: noun
  plural: die Schwärme
  meanings: [crush (a person you are in love with), crush, heartthrob, swarm]
  example: Der neue Schüler ist ihr Schwarm.
  exampleEn: The new student is her crush.
  note: 'Also means a swarm (of bees, fish).'
