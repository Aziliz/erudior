# German A2, module 3 glossary terms (lessons 09–12)
- term: adjective ending
  aliases: [adjective endings, Adjektivendung, Adjektivendungen]
  definition: 'The ending an adjective takes when it stands before a noun: ein neuer Rock, die neue Jacke, mit frischem Brot. It depends on the gender, case and number of the noun and on the article in front. There are five possible endings: -e, -en, -er, -es and -em.'
  topic: Adjectives
- term: predicative adjective
  aliases: [predicative adjectives, predicative]
  definition: 'An adjective that comes after a verb such as sein or werden rather than before a noun: Der Mantel ist warm. In German it never takes an ending.'
  topic: Adjectives
- term: attributive adjective
  aliases: [attributive adjectives, attributive]
  definition: 'An adjective that stands directly before a noun: ein warmer Mantel. In German it always takes an adjective ending.'
  topic: Adjectives
- term: signal ending
  aliases: [signal endings, signal rule]
  definition: 'The idea behind German adjective endings: a noun phrase shows its gender and case once. If the article already shows it (der, dem, einen), the adjective takes -e or -en; if it does not (ein, or no article at all), the adjective takes the ending of der/die/das instead: ein kurzer Rock, ein rotes Kleid, frischer Fisch.'
  topic: Adjectives
- term: ein-word
  aliases: [ein-words, ein word, ein words]
  definition: 'A word that takes the same endings as ein: ein, kein and the possessives mein, dein, sein, ihr, unser, euer and Ihr. After an ein-word the adjective ends in -er (masculine nominative), -es (neuter nominative and accusative), -e (feminine nominative and accusative) or -en (everywhere else).'
  topic: Articles
- term: der-word
  aliases: [der-words, der word, der words]
  definition: 'A word that takes the same endings as der, die, das: dieser, jeder, welcher and, in the plural, alle. After a der-word the adjective ends in -e (masculine nominative, feminine and neuter nominative and accusative) or -en (everywhere else): der neue Rock, mit dem neuen Rock.'
  topic: Articles
- term: adjectival noun
  aliases: [adjectival nouns, nominalized adjective, nominalised adjective]
  definition: 'An adjective used as a noun and written with a capital letter. It keeps its adjective endings: der Kleine, ein Kleiner (a little boy), das Neue (the new thing), der Bekannte, ein Bekannter (an acquaintance).'
  topic: Adjectives
- term: comparative
  aliases: [comparatives, Komparativ]
  definition: 'The form of an adjective that compares two things, made with -er: schnell, schneller (faster). Short adjectives often add an umlaut (alt, älter), and a few are irregular (gut, besser; viel, mehr). The thing compared with follows als: größer als. Before a noun it also takes an ending: eine größere Wohnung.'
  topic: Comparison
- term: superlative
  aliases: [superlatives, Superlativ]
  definition: 'The form of an adjective that says something is the most: after a verb, am + -sten (am schnellsten, am ältesten); before a noun, -st- plus the normal ending (der schnellste Zug, die höchsten Berge). Irregular: am besten, am meisten, am liebsten, am höchsten, am nächsten.'
  topic: Comparison
- term: umlaut
  aliases: [umlauts]
  definition: 'The two dots over a, o or u (ä, ö, ü), which change the vowel sound. Many short adjectives add an umlaut in the comparative and superlative: alt, älter, am ältesten; groß, größer; jung, jünger.'
  topic: Spelling and sounds
