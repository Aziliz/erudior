id: lang-german-a2
title: German A2
description: >-
  The second step in German, from A1 to CEFR level A2, the level of the
  Goethe-Zertifikat A2. Lessons cover talking about the past, reasons and opinions with
  weil and dass, reflexive verbs, verbs with prepositions, adjective endings, comparisons,
  two-way prepositions, polite requests with würde and könnte, and writing short
  messages and e-mails. About 600 new words build on the 700 from German A1 for roughly
  1,300 in all, and a reading list suggests graded readers for this level. Unlocks when
  German A1 is complete.
