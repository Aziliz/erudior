# German A2, honors module de2-h1 (round 2): cards for lessons 90-93.
- front: Skimming (globales Lesen)
  back: Reading very fast for the topic, the text type and who it is for. Headline, first sentences, big print; don't stop at unknown words.
  topic: Reading strategies
- front: Scanning (selektives Lesen)
  back: 'Hunting for one fact by its shape: Uhr or a colon for a time, Euro or € for a price, a month or a dot for a date. Then read only that line.'
  topic: Reading strategies
- front: Detailed reading (detailliertes Lesen)
  back: Reading one part slowly and completely, small words included. Use it for rules, conditions and instructions.
  topic: Reading strategies
- front: The efficient order for a reading task
  back: Read the question → skim the text → scan for the right place → read that part in detail.
  topic: Reading strategies
- front: erst vs nur
  back: 'erst = not until, later than expected (erst um 10: not before 10). nur = only, limits an amount (nur zwei Tickets).'
  topic: Reading strategies
- front: außer
  back: 'except: täglich außer montags = every day except Mondays (closed on Mondays).'
  topic: Reading strategies
- front: ab 18 Jahren / bis spätestens Freitag
  back: ab = from … onwards (17-year-olds can't). bis spätestens = by … at the latest (Saturday is too late).
  topic: Reading strategies
- front: der Aushang vs die Anzeige
  back: 'Aushang: a notice from someone in charge (An alle Mieter …). Anzeige: a small ad that offers or wants something (Zu verkaufen, Suche …).'
  topic: Text types
- front: Clues of a lost-pet note (Zettel)
  back: entlaufen or vermisst, a description of the animal, Belohnung (reward), where to ring or call.
  topic: Text types
- front: The lead of a news report
  back: 'The first sentence or paragraph: Wer? Was? Wann? Wo? Quotes, details and Warum? come later.'
  topic: Text types
- front: bald sollen es 200 sein
  back: 'A plan, not a fact: sollen and bald point to the future. Don''t answer as if it has already happened.'
  topic: Text types
- front: Reading a compound
  back: 'From the back: the head word says what it is; the modifier says what kind. der Hausschuh = a shoe for the house (slipper).'
  topic: Word formation
- front: Gender and plural of a compound
  back: 'Both come from the head word: das Haus + die Tür = die Haustür, plural die Haustüren.'
  topic: Word formation
- front: Linking sounds in compounds
  back: '-s-, -n-/-en-, -e- (Wohnungsschlüssel, Sonnenbrille, Hundeleine) carry no meaning. After -ung, -heit, -keit: -s-.'
  topic: Word formation
- front: Verb as modifier
  back: 'The verb drops -en: schreiben + Tisch = der Schreibtisch; warten + Zimmer = das Wartezimmer.'
  topic: Word formation
- front: -bar, -los, un-
  back: '-bar: can be done (essbar). -los: without (arbeitslos, kostenlos). un-: the opposite (unbekannt).'
  topic: Word formation
- front: -er, -ung, -heit/-keit
  back: '-er: person or machine (der Fahrer, der Drucker). -ung: action or result (die Lösung). -heit/-keit: a quality (die Sicherheit, die Sauberkeit).'
  topic: Word formation
- front: False friends (1)
  back: das Gift = poison; bekommen = to get; also = so, therefore; der Chef = the boss.
  topic: Guessing meaning
- front: False friends (2)
  back: aktuell = current; eventuell = possibly; sensibel = sensitive; das Handy = mobile phone.
  topic: Guessing meaning
- front: unheimlich
  back: creepy, eerie; in speech also "incredibly" (unheimlich nett). A reminder to check every guess from word parts.
  topic: Guessing meaning
- front: Before you look a word up
  back: Verb → infinitive (kauft … ein → einkaufen; fand → finden). Noun → singular (Bäume → der Baum). Adjective → no ending (neuen → neu).
  topic: Guessing meaning
- front: Common reductions
  back: hab (habe), ham (haben), is (ist), nich/net (nicht), 'n/'ne/'nen (ein/eine/einen), mal (einmal), grad (gerade), vorm (vor dem), fürs (für das).
  topic: Spoken German
- front: Modal particles
  back: 'ja, doch, mal, halt, eben, denn: they add attitude, not facts. Komm doch mit! Kannst du mal helfen? Das ist halt so.'
  topic: Spoken German
- front: Tag questions
  back: ne? (north), gell?/gelt? (south, Austria), oder? (everywhere, especially Switzerland), nicht wahr? (careful speech).
  topic: Spoken German
- front: Filler words
  back: 'also, na ja, ähm, tja, sozusagen: time to think, no information.'
  topic: Spoken German
- front: Corrections in speech
  back: 'The last version counts: um sieben, nee, warte, um halb acht → 7:30. Listen for nee, warte, Moment, sondern.'
  topic: Listening strategies
- front: The shape of a station announcement
  back: Attention (Achtung an Gleis 7) → train (number, destination, time) → what's different → what to do / apology.
  topic: Listening strategies
- front: fällt aus / hat Verspätung / heute von Gleis 2
  back: is cancelled / is delayed / leaves from platform 2 today.
  topic: Listening strategies
- front: Writing numbers you hear
  back: 'Units before tens: vierundsechzig = 64; write the 4, then put the 6 in front. siebzehn 17 vs siebzig 70.'
  topic: Listening strategies
- front: halb drei
  back: 2:30, half way to three. Not 3:30.
  topic: Listening strategies
- front: Taking notes in Stichworte
  back: Only nouns, numbers, times, places. Prepare wer? was? wann? wo? before you listen.
  topic: Listening strategies
- front: Narrator vs characters
  back: The narrator uses the simple past (Sie nahm den Vogel); characters speak in the present and perfect (Du hast mir geholfen).
  topic: Reading stories
- front: Fairy-tale first and last lines
  back: Es war einmal … / Und wenn sie nicht gestorben sind, dann leben sie noch heute.
  topic: Reading stories
- front: Story words
  back: eines Tages (one day), plötzlich (suddenly), da (then), zum Glück (luckily), am Ende (in the end).
  topic: Reading stories
- front: The Grimms' fairy tales
  back: Kinder- und Hausmärchen by Jacob and Wilhelm Grimm; the first volume appeared in 1812.
  topic: Reading stories
- front: Story past forms (1)
  back: hieß (heißen), trug (tragen), flog (fliegen), sang (singen), grub (graben), half (helfen).
  topic: Reading stories
- front: Story past forms (2)
  back: rief (rufen), fiel (fallen), schlief (schlafen), hielt (halten), zog (ziehen), schwieg (schweigen).
  topic: Reading stories
- front: flog vs floh
  back: flog = flew (fliegen); floh = fled (fliehen).
  topic: Reading stories
- front: Goethe's Wandrers Nachtlied
  back: '"Über allen Gipfeln ist Ruh …": by most accounts written in 1780 on a hut wall on the Kickelhahn near Ilmenau; first printed 1815.'
  topic: Reading poems
- front: Old forms in Wandrers Nachtlied
  back: Ruh = Ruhe; spürest = spürst; im Walde = im Wald; balde = bald; ruhest = ruhst.
  topic: Reading poems
- front: Diminutives
  back: '-chen or -lein, usually with an umlaut, always neuter: das Vögelein, das Büchlein, das Mädchen.'
  topic: Reading poems
- front: Rhyme scheme of Wandrers Nachtlied
  back: 'abab cddc: Gipfeln/Wipfeln, Ruh/du; Hauch/auch, Walde/balde.'
  topic: Reading poems
- front: Capital letters in older poems
  back: Every line starts with a capital letter. It doesn't mark a noun.
  topic: Reading poems
