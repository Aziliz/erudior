# German A2, module 2: People and relationships (lessons 05–08)
- term: reflexive verb
  aliases: [reflexive verbs, reflexives, reflexives Verb]
  definition: 'A verb whose object is the same person as its subject, used with a reflexive pronoun: sich waschen, sich anziehen, sich freuen. Many German verbs are reflexive where English is not: Ich freue mich (I am pleased), Ich habe mich erkältet (I caught a cold). Reflexive verbs always form the perfect with haben.'
  topic: Verbs
- term: reflexive pronoun
  aliases: [reflexive pronouns, Reflexivpronomen]
  definition: 'The pronoun that points back to the subject. Accusative: mich, dich, sich, uns, euch, sich. Dative (used when the sentence has another accusative object): mir, dir, sich, uns, euch, sich. Ich wasche mich, but Ich wasche mir die Hände. sich is used for all third persons and for formal Sie, and is never capitalised.'
  topic: Pronouns
- term: reciprocal
  aliases: [reciprocal pronoun, reciprocal use, each other]
  definition: 'Meaning "each other". In the plural, uns, euch and sich can be reciprocal: Wir sehen uns morgen (we will see each other tomorrow), Sie kennen sich seit der Schule (they have known each other since school).'
  topic: Pronouns
- term: prepositional verb
  aliases: [prepositional verbs, verb with a preposition, verbs with prepositions, verb with a fixed preposition]
  definition: 'A verb that is used with one fixed preposition, which decides the case of the noun after it: warten auf + accusative (to wait for), denken an + accusative (to think of), teilnehmen an + dative (to take part in), Angst haben vor + dative (to be afraid of). The preposition often differs from English, so learn verb, preposition and case together.'
  topic: Verbs
- term: prepositional object
  aliases: [prepositional objects, Präpositionalobjekt]
  definition: 'The noun or pronoun that follows the fixed preposition of a prepositional verb: in Ich warte auf den Bus, auf den Bus is the prepositional object. Ask about it with a wo-word for things (Worauf wartest du?) or preposition + wen/wem for people (Auf wen wartest du?).'
  topic: Verbs
- term: wo-word
  aliases: [wo-words, wo-compound, wo-compounds, wo(r)-word, Fragewort mit wo]
  definition: 'A question word made of wo + a preposition, used to ask about a thing in a prepositional object: worauf, woran, worüber, wofür, wovon, womit, worum. An r is added before a preposition that starts with a vowel: wo + auf = worauf. For people use preposition + wen or wem instead: Mit wem sprichst du?'
  topic: Questions
- term: da-word
  aliases: [da-words, da-compound, da-compounds, da(r)-word, Pronominaladverb]
  definition: 'A word made of da + a preposition that replaces a preposition + thing, like English "about it, for it": darauf, daran, darüber, dafür, davon, damit. An r is added before a vowel: da + an = daran. Freust du dich auf den Urlaub? – Ja, ich freue mich darauf. For people, use the preposition + a pronoun: auf ihn, mit ihr.'
  topic: Pronouns
- term: dative verb
  aliases: [dative verbs, verb with the dative, verbs with the dative]
  definition: 'A verb whose only object is in the dative instead of the accusative: helfen, danken, antworten, gratulieren, vertrauen, verzeihen, glauben, and verbs where the thing is the subject and the person is in the dative: gefallen, schmecken, gehören, passen, stehen (to suit), fehlen, wehtun. Ich helfe dir. Die Kette gefällt mir.'
  topic: Cases
- term: dative object
  aliases: [dative objects, Dativobjekt]
  definition: 'An object in the dative case. It is usually the person who receives something or benefits from it (Ich gebe dem Kind ein Buch), or the only object of a dative verb (Ich danke dir).'
  topic: Cases
- term: indirect object
  aliases: [indirect objects]
  definition: 'The person who receives the direct object or for whom something is done, in the dative case: Ich schenke meiner Mutter Blumen. Order with two objects: two nouns, dative first (dem Kind den Ball); a pronoun before a noun (ihm den Ball, ihn dem Kind); two pronouns, accusative first (ihn ihm).'
  topic: Word order
- term: indefinite pronoun
  aliases: [indefinite pronouns, Indefinitpronomen]
  definition: 'A pronoun that does not point to a particular person or thing: etwas, nichts, alles, jemand, niemand, jeder, alle, einige, viele, man. etwas, nichts and alles never change; jemand and niemand can take the endings jemanden, jemandem. After etwas, nichts, viel and wenig an adjective becomes a noun with -es: etwas Neues, nichts Besonderes.'
  topic: Pronouns
