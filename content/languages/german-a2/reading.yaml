# Reading list for German A2. Checked 2026-10-17 (publisher pages or listings; see RESEARCH.md).
- title: Nicos Weg (A2)
  publisher: Deutsche Welle
  level: A2
  url: https://learngerman.dw.com/en/nicos-weg/c-36519797
  free: true
  note: The second part of the free video story course, following Nico through work, friendships and everyday problems in Germany.
- title: Leo & Co. – In Gefahr (Stufe 2)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A2
  isbn: 978-3-12-674081-4
  url: https://www.klett-sprachen.de/in-gefahr-stufe-2/t-1/9783126740814
  note: A relaxing boat holiday turns into something much more dangerous. Short chapters with audio.
- title: Leo & Co. – Liebe im Mai (Stufe 2)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A2
  isbn: 978-3-12-674082-1
  url: https://www.klett-sprachen.de/liebe-im-mai-stufe-2/t-1/9783126740821
  note: Spring brings romance, and complications, to several members of one family.
- title: Leo & Co. – Schöne Ferien (Stufe 2)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A2
  isbn: 978-3-12-674080-7
  url: https://www.klett-sprachen.de/schoene-ferien-stufe-2/t-0/9783126740807
  note: A road trip to an old-car auction in Switzerland doesn't go to plan.
- title: Leichte Literatur – Die Bremer Stadtmusikanten
  author: retold by Urs Luger
  publisher: Hueber
  level: A2
  isbn: 978-3-19-921673-5
  url: https://shop.hueber.de/en/reihen-und-lehrwerke/niveaustufe-a2.html
  note: The Grimm tale of four old animals who set off to become musicians, simplified for A2, with audio.
- title: Leichte Literatur – Siegfrieds Tod
  author: Franz Specht
  publisher: Hueber
  level: A2
  isbn: 978-3-19-001673-0
  url: https://shop.hueber.de/en/reihen-und-lehrwerke/niveaustufe-a2.html
  note: The dragon-slayer's story from the medieval Nibelungenlied, retold in easy German.
- title: Short Stories in German for Beginners
  author: Olly Richards and Alex Rawlings
  publisher: Teach Yourself
  level: A2–B1
  isbn: 978-1-4736-8337-2
  url: https://www.hachette.co.uk/titles/olly-richards/short-stories-in-german-for-beginners/9781473683396/
  note: Eight longer stories in different genres, each with a summary, word list and questions. Good for the second half of the course.
- title: Die DaF-Bibliothek – Familie Schall series (e.g. Großstadtliebe)
  publisher: Cornelsen
  level: A2/B1
  isbn: 978-3-06-120752-6
  note: Short everyday-life stories about one family, with online audio. The same series has crime stories such as Gefährlicher Einkauf.
- title: Deutsch – warum nicht? Series 2 and 3
  publisher: Deutsche Welle and Goethe-Institut
  level: A2
  url: https://tunein.com/podcasts/Language-Learning/Deutsch---warum-nicht-Series-2--Learning-German--Deutsche-Welle-p411563/
  free: true
  note: The older free audio course continues; listen and read along with the episode scripts.
- title: Das Deutschlandlabor
  publisher: Goethe-Institut and Deutsche Welle
  level: from A2
  url: https://www.goethe.de/de/m/spr/ueb/dlb.html
  free: true
  note: Twenty short videos that test clichés about everyday life in Germany, with exercises.
- title: Goethe-Zertifikat A2 model and practice tests
  publisher: Goethe-Institut
  level: A2
  url: https://www.goethe.de/pro/relaunch/prf/materialien/A2/A2_Modellsatz_Erwachsene.pdf
  free: true
  note: The official model test; its reading part is exactly the kind of text the exam uses. Save it for the end of the course.
- title: nachrichtenleicht
  publisher: Deutschlandfunk
  level: A2–B1
  url: https://www.nachrichtenleicht.de/
  free: true
  note: Weekly news in plain German with audio and a glossary. A good weekly habit from the middle of this course.
- title: Klexikon
  publisher: ZUM (children's encyclopedia)
  level: A2–B1
  url: https://klexikon.zum.de/
  free: true
  note: Short encyclopedia articles written for children aged 8–13; look up any topic you're curious about.
- title: Top-Thema mit Vokabeln
  publisher: Deutsche Welle
  level: B1 (a stretch)
  free: true
  note: Short current-affairs texts with audio and a glossary. Try one at the end of the course as a first step toward B1.
