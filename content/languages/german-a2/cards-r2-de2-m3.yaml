# German A2, module 3 round 2: cards for the honors lessons 12h1 and 12h2
# --- 12h1 ---
- {front: 'Weak, mixed and strong declension', back: 'Weak = after der-words (-e/-en); mixed = after ein-words; strong = no article (endings of der/die/das/dem/den).', topic: Adjective endings}
- {front: 'kochendes Wasser vs gekochtes Wasser', back: 'kochend (present participle) = boiling now; gekocht (past participle) = boiled, already done.', topic: Adjective endings}
- {front: 'How is the present participle formed?', back: 'Infinitive + -d: kochen → kochend, lachen → lachend, folgen → folgend.', topic: Adjective endings}
- {front: 'The water is boiling.', back: 'Das Wasser kocht. (Not: Das Wasser ist kochend.)', topic: Adjective endings}
- {front: 'frisch gepresster Orangensaft: why no ending on frisch?', back: 'frisch is an adverb describing the participle gepresst, so only the participle takes the ending.', topic: Adjective endings}
- {front: 'mit Schweizer Käse / der Kölner Dom', back: 'Place-name adjectives in -er are capitalized and never take an ending.', topic: Adjective endings}
- {front: 'ein Berliner (food)', back: 'A jam doughnut in much of Germany; in Berlin usually ein Pfannkuchen, in the south and Austria ein Krapfen.', topic: Adjective endings}
- {front: 'der Erwachsene / ein Erwachsener / zwei Erwachsene / die Erwachsenen', back: 'An adjectival noun: weak after der, mixed after ein, strong after a number, weak -en after die.', topic: Adjectival nouns}
- {front: 'Er ist Deutscher. vs Er ist Österreicher.', back: 'Deutsche is an adjectival noun (ein Deutscher, zwei Deutsche); Österreicher and Schweizer are ordinary nouns.', topic: Adjectival nouns}
- {front: 'meine Verwandten', back: 'my relatives: after a possessive in the plural, the adjectival noun ends in -en.', topic: Adjectival nouns}
# --- 12h2 ---
- {front: 'much bigger', back: 'viel größer (never sehr größer)', topic: Comparison}
- {front: 'even higher', back: 'noch höher', topic: Comparison}
- {front: 'twice as big as / half as big as', back: 'doppelt so groß wie / halb so groß wie', topic: Comparison}
- {front: '836 metres higher than', back: 'um 836 Meter höher als', topic: Comparison}
- {front: 'the second-biggest city', back: 'die zweitgrößte Stadt (one word)', topic: Comparison}
- {front: 'one of the highest mountains / one of the biggest cities', back: 'einer der höchsten Berge / eine der größten Städte (plural noun, adjective in -en)', topic: Comparison}
- {front: 'die meisten vs am meisten', back: 'die meisten + noun = most (die meisten Schweizer); am meisten after a verb = the most (Er isst am meisten).', topic: Comparison}
- {front: 'as early as possible', back: 'so früh wie möglich', topic: Comparison}
- {front: 'Highest mountains: Germany, Austria, Switzerland', back: 'Zugspitze 2,962 m; Großglockner 3,798 m; Dufourspitze 4,634 m', topic: Landscape}
- {front: 'Bern', back: 'The Swiss "Bundesstadt" (federal city), seat of government and parliament; officially Switzerland has no capital.', topic: Landscape}
- {front: 'Österreich and die Schweiz: size', back: 'Österreich ist ungefähr doppelt so groß wie die Schweiz, but both have about 9 million inhabitants.', topic: Landscape}
