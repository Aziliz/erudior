# Round 2, module de2-m4: words introduced by the honors lessons 16h1–16h3.

# --- 16h1 Finding a flat ---
- id: de2-m4-r2-w01
  lesson: de2-m4-h-wohnen
  term: die Kaltmiete
  pos: noun
  plural: die Kaltmieten
  meanings: [cold rent (without extra costs), basic rent, rent without utilities, net rent, cold rent]
  example: Die Kaltmiete beträgt 690 Euro.
  exampleEn: The cold rent is 690 euros.
  note: 'Abbreviated KM in adverts.'
- id: de2-m4-r2-w02
  lesson: de2-m4-h-wohnen
  term: die Warmmiete
  pos: noun
  plural: die Warmmieten
  meanings: [warm rent (including extra costs), rent including utilities, total rent, gross rent, warm rent]
  example: Die Warmmiete ist Kaltmiete plus Nebenkosten.
  exampleEn: The warm rent is the cold rent plus the extra costs.
  note: 'Abbreviated WM in adverts.'
- id: de2-m4-r2-w03
  lesson: de2-m4-h-wohnen
  term: die Heizung
  pos: noun
  plural: die Heizungen
  meanings: [heating, heater, radiator, central heating]
  example: Ist die Heizung in den Nebenkosten enthalten?
  exampleEn: Is the heating included in the extra costs?
- id: de2-m4-r2-w04
  lesson: de2-m4-h-wohnen
  term: die Einbauküche
  pos: noun
  plural: die Einbauküchen
  meanings: [fitted kitchen, built-in kitchen]
  example: Die Wohnung hat eine Einbauküche.
  exampleEn: The flat has a fitted kitchen.
  note: 'Abbreviated EBK in adverts.'
- id: de2-m4-r2-w05
  lesson: de2-m4-h-wohnen
  term: das Obergeschoss
  pos: noun
  plural: die Obergeschosse
  meanings: [upper floor, upper storey, upper story]
  example: Die Wohnung liegt im zweiten Obergeschoss.
  exampleEn: The flat is on the second floor (two floors above the ground floor).
  note: 'Abbreviated OG. das erste Obergeschoss = der erste Stock (US: second floor). Austrian spelling also Obergeschoß.'
- id: de2-m4-r2-w06
  lesson: de2-m4-h-wohnen
  term: das Dachgeschoss
  pos: noun
  plural: die Dachgeschosse
  meanings: [attic floor (top floor under the roof), attic floor, attic, loft, top floor, attic storey]
  example: Im Dachgeschoss ist es im Sommer sehr warm.
  exampleEn: On the attic floor it's very warm in summer.
  note: 'Abbreviated DG.'
- id: de2-m4-r2-w07
  lesson: de2-m4-h-wohnen
  term: der Quadratmeter
  pos: noun
  plural: die Quadratmeter
  meanings: [square metre, square meter, sq m]
  example: Die Wohnung hat 58 Quadratmeter.
  exampleEn: The flat is 58 square metres.
  note: 'Written m² or qm.'
- id: de2-m4-r2-w08
  lesson: de2-m4-h-wohnen
  term: die Wohnfläche
  pos: noun
  plural: die Wohnflächen
  meanings: [living space (floor area), living space, living area, floor space, floor area]
  example: Die Wohnfläche ist 74 Quadratmeter.
  exampleEn: The living space is 74 square metres.
- id: de2-m4-r2-w09
  lesson: de2-m4-h-wohnen
  term: die Besichtigung
  pos: noun
  plural: die Besichtigungen
  meanings: [viewing (of a flat or house), viewing, visit, tour, inspection]
  example: Die Besichtigung ist am Samstag um zehn.
  exampleEn: The viewing is on Saturday at ten.
- id: de2-m4-r2-w10
  lesson: de2-m4-h-wohnen
  term: der Mietvertrag
  pos: noun
  plural: die Mietverträge
  meanings: [lease, rental contract, tenancy agreement, rental agreement]
  example: Morgen unterschreibe ich den Mietvertrag.
  exampleEn: Tomorrow I'm signing the lease.
- id: de2-m4-r2-w11
  lesson: de2-m4-h-wohnen
  term: möbliert
  pos: adjective
  meanings: [furnished]
  example: Das Zimmer ist möbliert.
  exampleEn: The room is furnished.
- id: de2-m4-r2-w12
  lesson: de2-m4-h-wohnen
  term: der Makler
  pos: noun
  plural: die Makler
  meanings: [estate agent, real estate agent, realtor, letting agent, broker]
  example: Wir haben die Wohnung ohne Makler gefunden.
  exampleEn: We found the flat without an estate agent.
  note: 'Female: die Maklerin.'
- id: de2-m4-r2-w13
  lesson: de2-m4-h-wohnen
  term: der Altbau
  pos: noun
  plural: die Altbauten
  meanings: [old building (usually built before about 1950), old building, period building]
  example: Sie wohnt in einem schönen Altbau mit hohen Decken.
  exampleEn: She lives in a lovely old building with high ceilings.
- id: de2-m4-r2-w14
  lesson: de2-m4-h-wohnen
  term: der Neubau
  pos: noun
  plural: die Neubauten
  meanings: [new building, newly built building, new build]
  example: Der Neubau hat einen Aufzug.
  exampleEn: The new building has a lift.
- id: de2-m4-r2-w15
  lesson: de2-m4-h-wohnen
  kind: phrase
  term: ab sofort
  pos: phrase
  meanings: [available immediately (from now on), from now on, immediately, available now, as of now, starting now]
  example: Die Wohnung ist ab sofort frei.
  exampleEn: The flat is available immediately.
- id: de2-m4-r2-w16
  lesson: de2-m4-h-wohnen
  term: enthalten
  pos: verb
  meanings: [to contain, to include]
  example: Die Heizung ist in der Miete enthalten.
  exampleEn: Heating is included in the rent.
  note: 'Irregular: es enthält, hat enthalten. Very common as ist … enthalten = is included.'
- id: de2-m4-r2-w17
  lesson: de2-m4-h-wohnen
  term: die Rate
  pos: noun
  plural: die Raten
  meanings: [instalment, installment, payment, part payment]
  example: Ich zahle die Kaution in drei Raten.
  exampleEn: I'm paying the deposit in three instalments.
- id: de2-m4-r2-w18
  lesson: de2-m4-h-wohnen
  term: der Hof
  pos: noun
  plural: die Höfe
  meanings: [courtyard, yard, back yard]
  example: Die Fahrräder stehen im Hof.
  exampleEn: The bikes are in the courtyard.

# --- 16h2 By train ---
- id: de2-m4-r2-w19
  lesson: de2-m4-h-bahn
  term: der Bahnsteig
  pos: noun
  plural: die Bahnsteige
  meanings: [platform (the place where you stand), platform, railway platform]
  example: Bitte warten Sie auf dem Bahnsteig.
  exampleEn: Please wait on the platform.
  note: 'Signs and announcements usually say Gleis (track) instead.'
- id: de2-m4-r2-w20
  lesson: de2-m4-h-bahn
  term: der Anschluss
  pos: noun
  plural: die Anschlüsse
  meanings: [connection (to another train or bus), connection, connecting train]
  example: In Hannover habe ich zehn Minuten für meinen Anschluss.
  exampleEn: In Hanover I have ten minutes for my connection.
- id: de2-m4-r2-w21
  lesson: de2-m4-h-bahn
  term: ausfallen
  pos: verb
  meanings: [to be cancelled, to be canceled, to be called off, to not take place]
  example: Der Zug fällt heute aus.
  exampleEn: The train is cancelled today.
  note: 'Separable: fällt … aus. Perfect with sein: ist ausgefallen.'
- id: de2-m4-r2-w22
  lesson: de2-m4-h-bahn
  term: voraussichtlich
  pos: adverb
  meanings: [expected (probably), expected, probably, likely, presumably, expectedly]
  example: Der Zug hat voraussichtlich zehn Minuten Verspätung.
  exampleEn: The train is expected to be ten minutes late.
- id: de2-m4-r2-w23
  lesson: de2-m4-h-bahn
  term: die Störung
  pos: noun
  plural: die Störungen
  meanings: [fault (technical problem), fault, disruption, problem, malfunction, breakdown, disturbance]
  example: Wegen einer Störung fährt die S-Bahn nicht.
  exampleEn: Because of a fault the S-Bahn isn't running.
- id: de2-m4-r2-w24
  lesson: de2-m4-h-bahn
  term: der Ersatzverkehr
  pos: noun
  plural: —
  meanings: [replacement service (buses instead of trains), replacement service, replacement buses, rail replacement service]
  example: Zwischen Kassel und Göttingen gibt es Ersatzverkehr mit Bussen.
  exampleEn: There are replacement buses between Kassel and Göttingen.
- id: de2-m4-r2-w25
  lesson: de2-m4-h-bahn
  term: der Wagen
  pos: noun
  plural: die Wagen
  meanings: [carriage (of a train), carriage, coach, car, wagon]
  example: Mein Platz ist in Wagen 7.
  exampleEn: My seat is in carriage 7.
  note: 'In everyday speech der Wagen can also mean a car (das Auto).'
- id: de2-m4-r2-w26
  lesson: de2-m4-h-bahn
  term: die Entschädigung
  pos: noun
  plural: die Entschädigungen
  meanings: [compensation]
  example: Bei 60 Minuten Verspätung gibt es eine Entschädigung.
  exampleEn: With a 60-minute delay you get compensation.
- id: de2-m4-r2-w27
  lesson: de2-m4-h-bahn
  term: erstatten
  pos: verb
  meanings: [to refund, to reimburse, to pay back]
  example: Die Bahn erstattet 25 Prozent.
  exampleEn: The railway refunds 25 percent.
  note: 'Regular: hat erstattet.'
- id: de2-m4-r2-w28
  lesson: de2-m4-h-bahn
  term: der Fahrgast
  pos: noun
  plural: die Fahrgäste
  meanings: [passenger]
  example: Alle Fahrgäste bitte aussteigen!
  exampleEn: All passengers please get off!
- id: de2-m4-r2-w29
  lesson: de2-m4-h-bahn
  term: verpassen
  pos: verb
  meanings: [to miss (a train, a chance), to miss]
  example: Ich habe den Bus verpasst.
  exampleEn: I missed the bus.
  note: 'Regular, inseparable: hat verpasst.'
- id: de2-m4-r2-w30
  lesson: de2-m4-h-bahn
  term: die Strecke
  pos: noun
  plural: die Strecken
  meanings: [line (railway route), line, route, stretch, track, distance]
  example: Auf der Strecke nach Berlin gibt es eine Störung.
  exampleEn: There's a fault on the line to Berlin.
- id: de2-m4-r2-w31
  lesson: de2-m4-h-bahn
  term: planmäßig
  pos: adjective
  meanings: [scheduled, as scheduled, on schedule, as planned, according to plan]
  example: Die planmäßige Abfahrt ist um 9:12 Uhr.
  exampleEn: The scheduled departure is at 9:12.
- id: de2-m4-r2-w32
  lesson: de2-m4-h-bahn
  term: der Abschnitt
  pos: noun
  plural: die Abschnitte
  meanings: [section, part, segment]
  example: Die erste Klasse hält im Abschnitt A.
  exampleEn: First class stops in section A.

# --- 16h3 Rubbish and Pfand ---
- id: de2-m4-r2-w33
  lesson: de2-m4-h-muell
  term: die Tonne
  pos: noun
  plural: die Tonnen
  meanings: [bin (wheelie bin), bin, rubbish bin, wheelie bin, trash can, garbage can, dustbin]
  example: Die Tonnen stehen im Hof.
  exampleEn: The bins are in the courtyard.
  note: 'Also: tonne (1,000 kg).'
- id: de2-m4-r2-w34
  lesson: de2-m4-h-muell
  term: das Altpapier
  pos: noun
  plural: —
  meanings: [waste paper (for recycling), waste paper, used paper, old paper, paper for recycling]
  example: Altpapier kommt in die blaue Tonne.
  exampleEn: Waste paper goes in the blue bin.
- id: de2-m4-r2-w35
  lesson: de2-m4-h-muell
  term: das Altglas
  pos: noun
  plural: —
  meanings: [waste glass (for recycling), waste glass, used glass, old glass, glass for recycling]
  example: Altglas bringen wir zum Container.
  exampleEn: We take waste glass to the bottle bank.
- id: de2-m4-r2-w36
  lesson: de2-m4-h-muell
  term: der Biomüll
  pos: noun
  plural: —
  meanings: [organic waste, food waste, biowaste, compost waste, kitchen waste]
  example: Kaffeefilter gehören in den Biomüll.
  exampleEn: Coffee filters go in the organic waste.
- id: de2-m4-r2-w37
  lesson: de2-m4-h-muell
  term: der Restmüll
  pos: noun
  plural: —
  meanings: [general waste (not recyclable), general waste, residual waste, non-recyclable waste, other rubbish]
  example: Ein kaputter Teller ist Restmüll.
  exampleEn: A broken plate is general waste.
- id: de2-m4-r2-w38
  lesson: de2-m4-h-muell
  term: die Verpackung
  pos: noun
  plural: die Verpackungen
  meanings: [packaging, wrapping, package]
  example: Verpackungen aus Plastik kommen in die gelbe Tonne.
  exampleEn: Plastic packaging goes in the yellow bin.
- id: de2-m4-r2-w39
  lesson: de2-m4-h-muell
  term: das Pfand
  pos: noun
  plural: —
  meanings: [deposit (on bottles and cans), bottle deposit, deposit]
  example: Auf der Flasche sind 25 Cent Pfand.
  exampleEn: There's a 25-cent deposit on the bottle.
  note: 'The deposit on a flat is die Kaution.'
- id: de2-m4-r2-w40
  lesson: de2-m4-h-muell
  term: die Dose
  pos: noun
  plural: die Dosen
  meanings: [can (tin), can, tin]
  example: Leere Dosen ohne Pfand kommen in die gelbe Tonne.
  exampleEn: Empty tins without a deposit go in the yellow bin.
- id: de2-m4-r2-w41
  lesson: de2-m4-h-muell
  term: die Batterie
  pos: noun
  plural: die Batterien
  meanings: [battery]
  example: Alte Batterien bringe ich in den Supermarkt.
  exampleEn: I take old batteries to the supermarket.
  note: 'Stress on the last syllable: bat-te-RIE.'
- id: de2-m4-r2-w42
  lesson: de2-m4-h-muell
  term: der Sperrmüll
  pos: noun
  plural: —
  meanings: [bulky rubbish (old furniture and the like), bulky rubbish, bulky waste, bulky trash, large items]
  example: Das alte Sofa ist Sperrmüll.
  exampleEn: The old sofa is bulky rubbish.
- id: de2-m4-r2-w43
  lesson: de2-m4-h-muell
  term: werfen
  pos: verb
  meanings: [to throw, to toss]
  example: Er wirft die Dose in die gelbe Tonne.
  exampleEn: He throws the can into the yellow bin.
  note: 'Stem change: du wirfst, er wirft. Perfect: hat geworfen.'
- id: de2-m4-r2-w44
  lesson: de2-m4-h-muell
  term: wegwerfen
  pos: verb
  meanings: [to throw away, to throw out, to discard, to bin]
  example: Wirf die Flasche nicht weg, da ist Pfand drauf!
  exampleEn: Don't throw the bottle away, there's a deposit on it!
  note: 'Separable: wirft … weg. Perfect: hat weggeworfen.'
- id: de2-m4-r2-w45
  lesson: de2-m4-h-muell
  term: zurückbringen
  pos: verb
  meanings: [to bring back, to take back, to return (something)]
  example: Ich bringe die Flaschen in den Supermarkt zurück.
  exampleEn: I'm taking the bottles back to the supermarket.
  note: 'Separable, mixed verb: bringt … zurück, hat zurückgebracht.'
- id: de2-m4-r2-w46
  lesson: de2-m4-h-muell
  term: der Container
  pos: noun
  plural: die Container
  meanings: [container (large bin in the street), container, bottle bank, skip]
  example: Der Container für Altglas steht an der Ecke.
  exampleEn: The bottle bank is on the corner.
- id: de2-m4-r2-w47
  lesson: de2-m4-h-muell
  term: leer
  pos: adjective
  meanings: [empty]
  example: Die Flasche ist leer.
  exampleEn: The bottle is empty.
- id: de2-m4-r2-w48
  lesson: de2-m4-h-muell
  term: leeren
  pos: verb
  meanings: [to empty]
  example: Die Stadt leert die Tonnen am Montag.
  exampleEn: The town empties the bins on Monday.
  note: 'Regular: hat geleert.'
- id: de2-m4-r2-w49
  lesson: de2-m4-h-muell
  term: der Kasten
  pos: noun
  plural: die Kästen
  meanings: [crate (for bottles), crate, box, case]
  example: Ein Kasten Wasser kostet sechs Euro plus Pfand.
  exampleEn: A crate of water costs six euros plus deposit.
