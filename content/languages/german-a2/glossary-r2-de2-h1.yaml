# German A2, honors module de2-h1 (round 2): reading and listening terms.
- term: skimming
  aliases: [skim, skim reading, gist reading, globales Lesen]
  definition: 'Reading very fast to find out what a text is about, what type it is and who it is for, without stopping at unknown words.'
  topic: Reading strategies
- term: scanning
  aliases: [scan, scan reading, selective reading, selektives Lesen]
  definition: 'Searching a text for one piece of information, such as a time, a price or a place, by looking for its typical shape and reading only that part.'
  topic: Reading strategies
- term: detailed reading
  aliases: [close reading, intensive reading, detailliertes Lesen]
  definition: 'Reading a part of a text slowly and completely, including small words like nur, erst and außer, to understand exactly what it says.'
  topic: Reading strategies
- term: text type
  aliases: [text types, Textsorte, Textsorten, genre]
  definition: 'A kind of text with its own purpose and typical form, for example a notice (Aushang), a small ad (Anzeige), a poster (Plakat) or a news report (Meldung).'
  topic: Text types
- term: lead
  aliases: [lede, news lead, Vorspann, Lead]
  definition: 'The first sentence or paragraph of a news report, which answers the most important questions: who, what, when and where.'
  topic: Text types
- term: head word
  aliases: [head words, head, Grundwort, base word]
  definition: 'The last part of a compound. It says what the thing is and gives the whole compound its gender and plural: der Wohnungsschlüssel is a kind of Schlüssel.'
  topic: Word formation
- term: modifier
  aliases: [modifiers, Bestimmungswort, determining word]
  definition: 'The part of a compound in front of the head word. It says what kind: in die Haustür, Haus tells you which door.'
  topic: Word formation
- term: word family
  aliases: [word families, Wortfamilie]
  definition: 'A group of words built on the same root, such as fahren, die Fahrt, der Fahrer and die Abfahrt.'
  topic: Word formation
- term: prefix
  aliases: [prefixes, Präfix, Vorsilbe]
  definition: 'A building block added to the front of a word that changes its meaning, such as un- in unbekannt (unknown).'
  topic: Word formation
- term: suffix
  aliases: [suffixes, Suffix, Nachsilbe]
  definition: 'A building block added to the end of a word, such as -keit in Sauberkeit or -bar in essbar. Many suffixes have a fairly regular meaning, and noun suffixes also show the gender.'
  topic: Word formation
- term: false friend
  aliases: [false friends, falscher Freund, falsche Freunde]
  definition: 'A word that looks like a word in another language but means something different, such as das Gift (poison) or bekommen (to get).'
  topic: Guessing meaning
- term: context
  aliases: [Kontext, Zusammenhang]
  definition: 'The words and sentences around a word, which often show what it means.'
  topic: Guessing meaning
- term: reduction
  aliases: [reductions, reduced form, reduced forms]
  definition: 'A shortened spoken form of a word, such as hab for habe, nich for nicht or nen for einen. Normal in relaxed speech, but not used in formal writing.'
  topic: Spoken German
- term: modal particle
  aliases: [modal particles, Modalpartikel, Abtönungspartikel]
  definition: 'A small unstressed word such as ja, doch, mal, halt, eben or denn that adds the speaker''s attitude or tone to a sentence but no new facts.'
  topic: Spoken German
- term: filler word
  aliases: [filler words, filler, fillers, Füllwort]
  definition: 'A word like also, na ja or ähm that gives a speaker time to think and carries no information.'
  topic: Spoken German
- term: tag question
  aliases: [tag questions, question tag]
  definition: 'A short question added to the end of a statement to ask for agreement, like English "right?": ne?, gell?, oder? or nicht wahr?'
  topic: Spoken German
- term: narrator
  aliases: [narrators, Erzähler, Erzählerin]
  definition: 'The voice that tells a story. In German stories the narrator normally uses the simple past.'
  topic: Reading stories
- term: diminutive
  aliases: [diminutives, Diminutiv, Verkleinerungsform]
  definition: 'A form that makes something small or dear, made with -chen or -lein and usually an umlaut: das Vögelchen, das Büchlein. Diminutives are always neuter.'
  topic: Reading poems
- term: rhyme
  aliases: [rhymes, Reim]
  definition: 'Two words whose endings sound the same from the last stressed vowel on, such as Gipfeln and Wipfeln.'
  topic: Reading poems
- term: rhyme scheme
  aliases: [rhyme schemes, Reimschema]
  definition: 'The pattern of rhymes in a poem, shown with letters: abab means lines 1 and 3 rhyme, and lines 2 and 4.'
  topic: Reading poems
