# German A2 glossary, module 5 honors lessons (round 2)
# (nominal style and passive are defined in glossary-r2-de2-m6.yaml)
- term: compound noun
  aliases: [compound nouns, compound, compounds, Kompositum, Komposita]
  definition: 'A noun made of two or more words joined into one: die Packung + die Beilage = die Packungsbeilage (package insert). The last part says what the thing is and decides the gender: der Schmerz but das Schmerzmittel. Read long compounds from the back. A linking -s- or -n- often joins the parts (Arbeitsvertrag).'
  topic: Medicine
- term: sein + zu + infinitive
  aliases: [sein + zu, haben + zu + infinitive, haben + zu, modal infinitive]
  definition: 'An official way of saying that something must (or can) be done: Der Betrag ist bis zum 15. März zu zahlen = the amount must be paid by 15 March. The person who has to act is not mentioned. With a person as subject, haben + zu means müssen: Sie haben die Unterlagen vorzulegen. Typical of official letters; recognize it at A2.'
  topic: Official letters
