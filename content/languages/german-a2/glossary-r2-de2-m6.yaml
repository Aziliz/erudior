# German A2 glossary, module 6 honors lessons (round 2)
- term: nominal style
  aliases: [Nominalstil, noun style]
  definition: 'Writing with nouns made from verbs instead of the verbs themselves, typical of headlines and official German: Eröffnung im Mai (from eröffnen) for Die Brücke wird im Mai eröffnet. Headlines also drop articles and the verb sein.'
  topic: News German
- term: passive
  aliases: [passive voice, Passiv]
  definition: 'A sentence form that puts the action, not the person doing it, in focus: werden + past participle. Zwei Menschen wurden verletzt (two people were injured). At A2 you only need to recognize it; B1 teaches it in full.'
  topic: News German
- term: hearsay
  aliases: [hearsay sollen, reported sollen]
  definition: 'The use of sollen to pass on what others say without vouching for it: Das Handy soll 900 Euro kosten (the phone is said to cost 900 euros). Very common in news reports.'
  topic: News German
- term: relative adverb
  aliases: [relative adverbs]
  definition: 'A word like wo that starts a relative clause about a place: die Stadt, wo der Unfall passierte (= in der der Unfall passierte). Like any relative clause, it sends the verb to the end.'
  topic: Relative clauses
- term: ellipsis
  aliases: [elliptical, elliptical sentence, Ellipse]
  definition: 'Leaving out words that everyone understands. Wishes are ellipses of Ich wünsche dir …, which is why they are accusative: Herzlichen Glückwunsch! Guten Rutsch! Schönes Wochenende!'
  topic: Wishes and cards
