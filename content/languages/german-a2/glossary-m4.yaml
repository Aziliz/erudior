- term: two-way preposition
  aliases: [two-way prepositions, Wechselpräposition, Wechselpräpositionen, dual prepositions]
  definition: 'One of the nine prepositions in, an, auf, über, unter, vor, hinter, neben and zwischen, which take the dative for a position (Wo? Das Buch liegt auf dem Tisch) and the accusative for movement to a new place (Wohin? Ich lege das Buch auf den Tisch).'
  topic: Prepositions
- term: dative
  aliases: [dative case, Dativ]
  definition: 'The case of the indirect object (the person who receives something) and the case after prepositions such as mit, bei, zu, aus and seit. After a two-way preposition it shows position (Wo?). Articles: dem (masculine and neuter), der (feminine), den + -n (plural).'
  topic: Cases
- term: accusative
  aliases: [accusative case, Akkusativ]
  definition: 'The case of the direct object and the case after prepositions such as für, ohne and durch. After a two-way preposition it shows movement to a new place (Wohin?). Only the masculine article changes from the nominative: den, einen.'
  topic: Cases
- term: direct object
  aliases: [direct objects, object]
  definition: 'The thing or person the verb acts on directly, in the accusative: Ich stelle die Lampe in die Ecke. Verbs like stellen and legen need one; stehen and liegen never have one.'
  topic: Sentence structure
- term: time preposition
  aliases: [time prepositions, temporal preposition, temporal prepositions]
  definition: 'A preposition that places something in time or gives a length of time: vor (ago), seit (since, for), ab (from … on), bis (until), in (in, from now), für (for a planned period), nach (after). vor, seit, ab, in and nach take the dative; für takes the accusative.'
  topic: Prepositions
- term: present tense
  aliases: [Präsens, present]
  definition: 'The basic verb form (ich wohne, du fährst). German uses it for now, for habits, for the future with a time word (Morgen fahre ich nach Wien), and with seit for something that started in the past and is still going on (Ich wohne seit 2020 hier).'
  topic: Verbs
- term: future tense
  aliases: [future, Futur, future with werden]
  definition: 'A form of werden in position 2 and the infinitive at the end: Es wird morgen regnen. Ich werde dich anrufen. Germans use it mainly for predictions and promises; for plans with a time word the present tense is more usual.'
  topic: Verbs
- term: Konjunktiv II
  aliases: [subjunctive, subjunctive II, conditional, Konjunktiv]
  definition: 'The "would" forms of the verb, used for polite requests, wishes, advice and things that are not real: würde + infinitive, and the one-word forms hätte, wäre, könnte, müsste, dürfte, sollte and möchte. Most come from the simple past plus an umlaut (hatte → hätte, konnte → könnte).'
  topic: Verbs
- term: linking adverb
  aliases: [linking adverbs, connecting adverb, connecting adverbs, conjunctional adverb, conjunctional adverbs]
  definition: 'A word like deshalb, trotzdem, außerdem, sonst, dann or danach that links a sentence to the one before. It counts as part of the sentence, so in position 1 it is followed directly by the verb and then the subject: Es regnet, trotzdem gehe ich spazieren.'
  topic: Sentence structure
