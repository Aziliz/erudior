# Module 6 glossary (lessons 21–24)
- term: relative clause
  aliases: [relative clauses, Relativsatz]
  definition: 'A subordinate clause that describes a noun, like English "the laptop that I bought". In German it starts with a relative pronoun, ends with the conjugated verb and is set off by commas: der Laptop, den ich gekauft habe.'
  topic: Relative clauses
- term: relative pronoun
  aliases: [relative pronouns, Relativpronomen]
  definition: 'The word that starts a relative clause and stands for the noun it describes. In German it looks like the definite article (der, die, das, die; accusative den; dative dem, der, dem, denen). Its gender and number come from the noun before it; its case comes from its job inside the relative clause.'
  topic: Relative clauses
- term: antecedent
  aliases: [antecedents, Bezugswort]
  definition: 'The noun that a relative clause describes and that the relative pronoun refers back to. In "die Frau, die neben mir wohnt", the antecedent is "die Frau".'
  topic: Relative clauses
- term: subordinate clause
  aliases: [subordinate clauses, dependent clause, Nebensatz]
  definition: 'A clause that cannot stand alone and depends on a main clause, for example one starting with weil, dass, wenn, ob or a relative pronoun. In German the conjugated verb goes to the end of a subordinate clause: …, weil ich arbeiten muss.'
  topic: Word order
- term: main clause
  aliases: [main clauses, independent clause, Hauptsatz]
  definition: 'A clause that can stand alone as a sentence. In a German main clause (a statement), the conjugated verb is in position 2: Ich habe einen Laptop.'
  topic: Word order
- term: dative
  aliases: [dative case, Dativ]
  definition: 'The case of the indirect object, usually the person who receives something or benefits from it, and the case after prepositions like mit, bei, zu, seit and von. Verbs like gratulieren, helfen and danken take a dative object: Ich gratuliere dir.'
  topic: Cases
- term: ordinal number
  aliases: [ordinal numbers, ordinal, ordinals, Ordinalzahl]
  definition: 'A number that gives a position in a row: first, second, third. In German, add -te up to 19 (zweite, vierte) and -ste from 20 (zwanzigste); irregular are erste, dritte, siebte and achte. Written with a full stop (der 3. Mai), and it takes adjective endings: am dritten Mai.'
  topic: Numbers and dates
- term: indefinite pronoun
  aliases: [indefinite pronouns, einer, keiner, meiner]
  definition: 'A pronoun that stands for a person or thing without naming exactly which. At A2 this includes ein-words used on their own (einer, eine, eins; keiner; meiner, meins), which take the ending of the der-article so that the gender shows: Ich habe einen. Das ist meins. Also jemand, niemand, etwas, nichts.'
  topic: Pronouns
- term: register
  aliases: [formality, level of formality]
  definition: 'The level of formality you choose for a reader or listener. German messages have three registers: informal (du, Liebe/Hallo …, Viele Grüße), semi-formal (Sie, Liebe Frau …, Viele Grüße) and formal (Sie, Sehr geehrte/r …, Mit freundlichen Grüßen).'
  topic: Writing messages
- term: CEFR
  aliases: [Common European Framework of Reference, GER, Gemeinsamer Europäischer Referenzrahmen]
  definition: 'The Common European Framework of Reference for Languages, which describes six levels of language ability from A1 (beginner) to C2 (near-native). A2 is the second level: you can handle simple, routine everyday situations.'
  topic: Exams
