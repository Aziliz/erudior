# German A2, module 1, round 2: cards for the honors lessons 04h1 (biographies) and 04h2 (reported speech).

# --- 04h1 Lebensgeschichten ---
- {front: 'Which past tense does a written biography use?', back: 'The simple past (Präteritum): Sie wuchs in Pforzheim auf. Er studierte Chemie. Only what is still true today goes in the present.', topic: Biographies}
- {front: 'Principal parts', back: 'Infinitive – simple past – participle: fahren – fuhr – gefahren. Learn every verb with all three.', topic: Simple past}
- {front: 'Simple past of a weak verb (er/sie)', back: 'Stem + -te: heiratete, gründete, studierte. Stems in -t/-d add -ete. Plural: -ten (sie heirateten).', topic: Simple past}
- {front: 'Simple past of a strong verb (er/sie)', back: 'New vowel (ablaut), no ending: er fuhr, sie starb, er blieb, sie fand. Plural adds -en: sie fuhren.', topic: Simple past}
- {front: 'Ablaut patterns: bleiben, fliegen, finden', back: 'bleiben – blieb – geblieben (ei–ie–ie); fliegen – flog – geflogen (ie–o–o); finden – fand – gefunden (i–a–u)', topic: Simple past}
- {front: 'Ablaut patterns: sprechen, geben, fahren, schlafen', back: 'sprechen – sprach – gesprochen; geben – gab – gegeben; fahren – fuhr – gefahren; schlafen – schlief – geschlafen', topic: Simple past}
- {front: 'aufwachsen in the simple past', back: 'Sie wuchs in Pforzheim auf. (main clause: prefix at the end) / als sie in Pforzheim aufwuchs (subordinate clause: joined up)', topic: Simple past}
- {front: 'Born and died in a biography', back: 'Sie wurde 1849 in Pforzheim geboren. Sie starb 1944 im Alter von 95 Jahren.', topic: Biographies}
- {front: 'der Lebenslauf: order of entries', back: 'Usually newest first in each section (seit 06/2025 at the top). A biography tells the story oldest first.', topic: Biographies}
- {front: 'Sections of a German Lebenslauf', back: 'Persönliche Daten, Berufserfahrung, Ausbildung, Sprachkenntnisse (often also Kenntnisse, Interessen); place, date and signature at the end. A photo is optional.', topic: Biographies}
- {front: 'Bertha Benz, 5 August 1888', back: 'Drove the Benz motor car about 100 km from Mannheim to Pforzheim with her sons Eugen and Richard, without telling Carl; bought ligroin fuel at the pharmacy in Wiesloch.', topic: Biographies}

# --- 04h2 Reported speech ---
- {front: 'Direct vs reported speech', back: 'Direct: Anna sagt: „Ich bin krank.“ Reported: Anna sagt, dass sie krank ist.', topic: Reported speech}
- {front: 'Reporting a statement', back: 'sagen, dass + verb at the end (Er hat gesagt, dass er keine Zeit hat) or without dass in main-clause order (Er hat gesagt, er hat keine Zeit).', topic: Reported speech}
- {front: 'Reporting a W-question', back: 'Keep the question word, verb to the end: Sie hat gefragt, wann der Kurs anfängt.', topic: Indirect questions}
- {front: 'Reporting a yes/no question', back: 'ob + verb at the end: Er hat gefragt, ob ich Hunger habe. End with a full stop.', topic: Indirect questions}
- {front: 'Reporting a command', back: 'Use sollen: „Ruf mich an!“ → Sie hat gesagt, ich soll sie anrufen.', topic: Reported speech}
- {front: 'Tense in everyday reported speech', back: 'Keep the speaker''s tense: „Ich komme morgen.“ → Er hat gesagt, dass er morgen kommt (he said he would come).', topic: Reported speech}
- {front: 'What changes in reported speech?', back: 'Pronouns and possessives (ich → er/sie, mein → sein/ihr, said to you: du → ich) and place and time words (hier → dort, morgen → am nächsten Tag).', topic: Reported speech}
- {front: 'Kann ich etwas ausrichten?', back: 'Can I take a message? (ausrichten = to pass on a message)', topic: Reported speech}
- {front: 'Konjunktiv I in the news', back: 'Der Minister sagte, er sei krank / er habe keine Zeit. Recognise sei, habe, werde, könne, müsse; don''t use it in conversation.', topic: Reported speech}
- {front: 'Stille Post', back: 'The German name for the whispering game known in English as telephone (or Chinese whispers): a message changes as it is passed on.', topic: Reported speech}
