# German A2, module 6 honors lessons (round 2): news words and family celebrations.
# Checked against every vocab file in German A1 and German A2: none of these terms exists elsewhere
# with the same part of speech (laut, adjective "loud", is in de2-m4; this is the preposition).

# --- 24h1 Die Nachrichten (de2-m6-h-news) ---
- id: de2-m6-r2-w01
  lesson: de2-m6-h-news
  term: die Schlagzeile
  pos: noun
  plural: die Schlagzeilen
  meanings: [headline, newspaper headline]
  example: Die Schlagzeile ist sehr kurz.
  exampleEn: The headline is very short.
- id: de2-m6-r2-w02
  lesson: de2-m6-h-news
  term: die Meldung
  pos: noun
  plural: die Meldungen
  meanings: [news item, short news report, news report, report, announcement]
  example: Ich habe die Meldung im Radio gehört.
  exampleEn: I heard the news item on the radio.
- id: de2-m6-r2-w03
  lesson: de2-m6-h-news
  term: der Journalist
  pos: noun
  plural: die Journalisten
  meanings: [journalist (male), journalist, reporter]
  example: Der Journalist schreibt für eine Zeitung in Wien.
  exampleEn: The journalist writes for a newspaper in Vienna.
  note: 'Takes -en in every case but the nominative singular: den Journalisten, dem Journalisten.'
- id: de2-m6-r2-w04
  lesson: de2-m6-h-news
  term: die Journalistin
  pos: noun
  plural: die Journalistinnen
  meanings: [journalist (female), journalist, reporter]
  example: Die Journalistin macht ein Interview mit der Bürgermeisterin.
  exampleEn: The journalist is interviewing the mayor.
- id: de2-m6-r2-w05
  lesson: de2-m6-h-news
  term: berichten
  pos: verb
  meanings: [to report (on the news), to report, to tell about]
  example: Die Zeitung berichtet über den Streik.
  exampleEn: The newspaper is reporting on the strike.
  note: 'berichten über + accusative. Simple past: berichtete; perfect: hat berichtet.'
- id: de2-m6-r2-w06
  lesson: de2-m6-h-news
  term: die Umfrage
  pos: noun
  plural: die Umfragen
  meanings: [survey, poll, opinion poll]
  example: Laut einer Umfrage lesen viele junge Leute Nachrichten online.
  exampleEn: According to a survey, many young people read the news online.
- id: de2-m6-r2-w07
  lesson: de2-m6-h-news
  term: laut
  pos: preposition
  meanings: [according to]
  example: Laut Polizei war niemand im Haus.
  exampleEn: According to the police, nobody was in the building.
  note: 'With the dative (laut einer Umfrage); a noun without an article stays as it is (laut Polizei). Formal writing also uses the genitive.'
- id: de2-m6-r2-w08
  lesson: de2-m6-h-news
  term: der Streik
  pos: noun
  plural: die Streiks
  meanings: [strike (stopping work), strike]
  example: Heute gibt es einen Streik bei der Bahn.
  exampleEn: There's a rail strike today.
- id: de2-m6-r2-w09
  lesson: de2-m6-h-news
  term: streiken
  pos: verb
  meanings: [to strike (stop work), to strike, to go on strike, to be on strike]
  example: Die Busfahrer streiken heute.
  exampleEn: The bus drivers are on strike today.
- id: de2-m6-r2-w10
  lesson: de2-m6-h-news
  term: die Regierung
  pos: noun
  plural: die Regierungen
  meanings: [government]
  example: Die Regierung hat einen neuen Plan.
  exampleEn: The government has a new plan.
- id: de2-m6-r2-w11
  lesson: de2-m6-h-news
  term: die Politik
  pos: noun
  plural: —
  meanings: [politics, policy]
  example: Interessierst du dich für Politik?
  exampleEn: Are you interested in politics?
- id: de2-m6-r2-w12
  lesson: de2-m6-h-news
  term: die Wirtschaft
  pos: noun
  plural: —
  meanings: [economy, business, the economy]
  example: Die Wirtschaft in der Region wächst.
  exampleEn: The economy in the region is growing.
- id: de2-m6-r2-w13
  lesson: de2-m6-h-news
  term: die Wettervorhersage
  pos: noun
  plural: die Wettervorhersagen
  meanings: [weather forecast, forecast]
  example: Laut Wettervorhersage regnet es morgen.
  exampleEn: According to the weather forecast it will rain tomorrow.
- id: de2-m6-r2-w14
  lesson: de2-m6-h-news
  term: die Quelle
  pos: noun
  plural: die Quellen
  meanings: [source]
  example: Woher kommt die Information? Nenn bitte die Quelle.
  exampleEn: Where does the information come from? Please name the source.
- id: de2-m6-r2-w15
  lesson: de2-m6-h-news
  term: prüfen
  pos: verb
  alt: [pruefen]
  meanings: [to check, to examine, to test, to verify]
  example: Die Polizei prüft die Information noch.
  exampleEn: The police are still checking the information.
- id: de2-m6-r2-w16
  lesson: de2-m6-h-news
  term: aktuell
  pos: adjective
  meanings: [current, up to date, up-to-date, latest]
  example: Hier finden Sie die aktuellen Nachrichten.
  exampleEn: Here you'll find the latest news.
  note: 'A false friend: aktuell means current, not actual (actual = tatsächlich).'
- id: de2-m6-r2-w17
  lesson: de2-m6-h-news
  term: der Leser
  pos: noun
  plural: die Leser
  meanings: [reader (male), reader]
  example: Die Zeitung hat viele Leser.
  exampleEn: The newspaper has many readers.
- id: de2-m6-r2-w18
  lesson: de2-m6-h-news
  term: die Leserin
  pos: noun
  plural: die Leserinnen
  meanings: [reader (female), reader]
  example: Eine Leserin hat einen Brief an die Zeitung geschrieben.
  exampleEn: A reader has written a letter to the newspaper.
- id: de2-m6-r2-w19
  lesson: de2-m6-h-news
  term: der Zuschauer
  pos: noun
  plural: die Zuschauer
  meanings: [viewer, spectator, member of the audience]
  example: Die Sendung hatte fünf Millionen Zuschauer.
  exampleEn: The programme had five million viewers.
- id: de2-m6-r2-w20
  lesson: de2-m6-h-news
  term: der Sender
  pos: noun
  plural: die Sender
  meanings: [broadcaster, channel, station, TV channel, radio station]
  example: Auf welchem Sender kommt das Spiel?
  exampleEn: Which channel is the match on?
- id: de2-m6-r2-w21
  lesson: de2-m6-h-news
  term: die Feuerwehr
  pos: noun
  plural: die Feuerwehren
  meanings: [fire brigade, fire department, fire service]
  example: Ruf sofort die Feuerwehr!
  exampleEn: Call the fire brigade at once!
- id: de2-m6-r2-w22
  lesson: de2-m6-h-news
  term: erscheinen
  pos: verb
  meanings: [to come out (be published), to appear, to be published, to come out]
  example: Die Zeitung erscheint jeden Morgen.
  exampleEn: The newspaper comes out every morning.
  note: 'Perfect with sein: ist erschienen. Simple past: erschien.'
- id: de2-m6-r2-w23
  lesson: de2-m6-h-news
  term: die Wahl
  pos: noun
  plural: die Wahlen
  meanings: [election, vote, choice]
  example: Am Sonntag ist die Wahl.
  exampleEn: The election is on Sunday.

# --- 24h2 Familienfeste (de2-m6-h-family-festivals) ---
- id: de2-m6-r2-w24
  lesson: de2-m6-h-family-festivals
  term: die Einschulung
  pos: noun
  plural: die Einschulungen
  meanings: [first day of school, school enrolment, school enrollment, starting school]
  example: Zur Einschulung kommen auch die Großeltern.
  exampleEn: The grandparents are coming to the first day of school too.
- id: de2-m6-r2-w25
  lesson: de2-m6-h-family-festivals
  term: die Schultüte
  pos: noun
  plural: die Schultüten
  alt: [die Schultuete]
  meanings: [school cone (cone of sweets for the first school day), school cone, schultüte]
  example: In meiner Schultüte waren Süßigkeiten und Stifte.
  exampleEn: There were sweets and pens in my school cone.
- id: de2-m6-r2-w26
  lesson: de2-m6-h-family-festivals
  term: die Taufe
  pos: noun
  plural: die Taufen
  meanings: [christening, baptism]
  example: Die Taufe ist am Sonntag in der Kirche.
  exampleEn: The christening is on Sunday in church.
- id: de2-m6-r2-w27
  lesson: de2-m6-h-family-festivals
  term: die Konfirmation
  pos: noun
  plural: die Konfirmationen
  meanings: [confirmation (Protestant), confirmation]
  example: Zur Konfirmation hat er Geld bekommen.
  exampleEn: He got money for his confirmation.
- id: de2-m6-r2-w28
  lesson: de2-m6-h-family-festivals
  term: der Polterabend
  pos: noun
  plural: die Polterabende
  meanings: [Polterabend (pre-wedding party where china is smashed), polterabend, pre-wedding party, eve-of-wedding party]
  example: Beim Polterabend haben wir alte Teller kaputt gemacht.
  exampleEn: At the Polterabend we smashed old plates.
- id: de2-m6-r2-w29
  lesson: de2-m6-h-family-festivals
  term: die Scherbe
  pos: noun
  plural: die Scherben
  meanings: [broken piece (of china or glass), shard, fragment, broken piece, piece]
  example: Scherben bringen Glück.
  exampleEn: Broken china brings luck.
- id: de2-m6-r2-w30
  lesson: de2-m6-h-family-festivals
  term: der Junggesellenabschied
  pos: noun
  plural: die Junggesellenabschiede
  alt: [der JGA]
  meanings: [stag or hen party, stag party, hen party, bachelor party, bachelorette party]
  example: Zum Junggesellenabschied tragen alle Kostüme.
  exampleEn: Everyone wears costumes for the stag party.
- id: de2-m6-r2-w31
  lesson: de2-m6-h-family-festivals
  term: das Standesamt
  pos: noun
  plural: die Standesämter
  meanings: [registry office, register office, civil registry]
  example: Wir heiraten im Mai auf dem Standesamt.
  exampleEn: We're getting married at the registry office in May.
- id: de2-m6-r2-w32
  lesson: de2-m6-h-family-festivals
  term: die Trauung
  pos: noun
  plural: die Trauungen
  meanings: [wedding ceremony, marriage ceremony, ceremony]
  example: Die Trauung dauert nur zwanzig Minuten.
  exampleEn: The wedding ceremony only takes twenty minutes.
- id: de2-m6-r2-w33
  lesson: de2-m6-h-family-festivals
  term: das Brautpaar
  pos: noun
  plural: die Brautpaare
  meanings: [bride and groom, bridal couple, wedding couple, newlyweds]
  example: Alle stoßen auf das Brautpaar an.
  exampleEn: Everyone raises a glass to the bride and groom.
- id: de2-m6-r2-w34
  lesson: de2-m6-h-family-festivals
  term: die Braut
  pos: noun
  plural: die Bräute
  meanings: [bride]
  example: Die Braut trägt ein langes Kleid.
  exampleEn: The bride is wearing a long dress.
- id: de2-m6-r2-w35
  lesson: de2-m6-h-family-festivals
  term: der Bräutigam
  pos: noun
  plural: die Bräutigame
  alt: [der Braeutigam]
  meanings: [groom, bridegroom]
  example: Der Bräutigam ist sehr nervös.
  exampleEn: The groom is very nervous.
- id: de2-m6-r2-w36
  lesson: de2-m6-h-family-festivals
  term: die Ehe
  pos: noun
  plural: die Ehen
  meanings: [marriage]
  example: Ihre Ehe ist sehr glücklich.
  exampleEn: Their marriage is very happy.
- id: de2-m6-r2-w37
  lesson: de2-m6-h-family-festivals
  term: das Jubiläum
  pos: noun
  plural: die Jubiläen
  alt: [das Jubilaeum]
  meanings: [anniversary, jubilee]
  example: Die Firma feiert ihr 100-jähriges Jubiläum.
  exampleEn: The company is celebrating its 100th anniversary.
- id: de2-m6-r2-w38
  lesson: de2-m6-h-family-festivals
  term: die Einweihungsparty
  pos: noun
  plural: die Einweihungspartys
  meanings: [housewarming party, housewarming, house-warming party]
  example: Wir laden euch zu unserer Einweihungsparty ein.
  exampleEn: We're inviting you to our housewarming party.
- id: de2-m6-r2-w39
  lesson: de2-m6-h-family-festivals
  term: der Tod
  pos: noun
  plural: die Tode
  meanings: [death]
  example: Nach seinem Tod hat sie das Haus verkauft.
  exampleEn: After his death she sold the house.
  note: 'The plural is rare.'
- id: de2-m6-r2-w40
  lesson: de2-m6-h-family-festivals
  term: die Beerdigung
  pos: noun
  plural: die Beerdigungen
  meanings: [funeral, burial]
  example: Die Beerdigung ist am Freitag.
  exampleEn: The funeral is on Friday.
- id: de2-m6-r2-w41
  lesson: de2-m6-h-family-festivals
  kind: phrase
  pos: phrase
  term: Herzliches Beileid!
  alt: [Herzliches Beileid]
  meanings: [My condolences!, my condolences, condolences, sincere condolences, my sympathy]
- id: de2-m6-r2-w42
  lesson: de2-m6-h-family-festivals
  kind: phrase
  pos: phrase
  term: Alles Gute!
  alt: [Alles Gute]
  meanings: [All the best!, all the best, best wishes]
