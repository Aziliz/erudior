# Round 2, module de2-m4: terms bolded in the honors lessons 16h1–16h2.
- term: figurative meaning
  aliases: [figurative, figurative use, figurative uses, figuratively, übertragene Bedeutung]
  definition: 'A meaning carried over from the physical, literal meaning of a word to something abstract. In der Zeitung steht … (it says in the paper) is a figurative use of stehen: nothing is standing anywhere. With a figurative two-way preposition, Wo?/Wohin? no longer decides the case.'
  topic: Prepositions
- term: fixed expression
  aliases: [fixed expressions, set phrase, set phrases, idiom, idioms, Redewendung, feste Wendung]
  definition: 'A group of words used together with a set form and meaning, learned as one unit: vor allem (above all), auf Deutsch (in German), liegen an + dative (to be because of). The case after the preposition belongs to the expression and must be learned with it.'
  topic: Prepositions
- term: impersonal verb
  aliases: [impersonal verbs, unpersönliches Verb]
  definition: 'A verb (or a use of a verb) whose only subject is the empty es, which stands for nothing: es regnet, es schneit, es hagelt, es donnert. The es stays even when another word is in position 1 (Morgen regnet es), and weather verbs form the perfect with haben (Es hat geregnet).'
  topic: Verbs
