# German A2, module 3 round 2: words from the honors lessons 12h1 and 12h2

# --- 12h1 Participles, place names and adjectives as nouns ---
- id: de2-m3-r2-w01
  lesson: de2-m3-h-participles
  term: der Erwachsene
  pos: noun
  plural: die Erwachsenen
  alt: [ein Erwachsener]
  meanings: [adult (male), adult, grown-up]
  example: Ein Erwachsener zahlt zwölf Euro.
  exampleEn: An adult pays twelve euros.
  note: 'An adjective used as a noun: der Erwachsene, but ein Erwachsener; zwei Erwachsene.'
- id: de2-m3-r2-w02
  lesson: de2-m3-h-participles
  term: die Erwachsene
  pos: noun
  plural: die Erwachsenen
  alt: [eine Erwachsene]
  meanings: [adult (female), adult, grown-up]
  example: Meine Tochter ist jetzt eine Erwachsene.
  exampleEn: My daughter is an adult now.
- id: de2-m3-r2-w03
  lesson: de2-m3-h-participles
  term: der Jugendliche
  pos: noun
  plural: die Jugendlichen
  alt: [ein Jugendlicher]
  meanings: [young person (male), young person, teenager, youth, adolescent]
  example: Der Kurs ist für Jugendliche ab vierzehn.
  exampleEn: The course is for young people aged fourteen and over.
  note: 'An adjective used as a noun: der Jugendliche, but ein Jugendlicher.'
- id: de2-m3-r2-w04
  lesson: de2-m3-h-participles
  term: die Jugendliche
  pos: noun
  plural: die Jugendlichen
  alt: [eine Jugendliche]
  meanings: [young person (female), young person, teenager, teenage girl, adolescent]
  example: Eine Jugendliche hat mir den Weg gezeigt.
  exampleEn: A teenage girl showed me the way.
- id: de2-m3-r2-w05
  lesson: de2-m3-h-participles
  term: der Verwandte
  pos: noun
  plural: die Verwandten
  alt: [ein Verwandter]
  meanings: [relative (male), relative, relation]
  example: Er ist ein Verwandter von meiner Mutter.
  exampleEn: He's a relative of my mother's.
  note: 'An adjective used as a noun: der Verwandte, but ein Verwandter; meine Verwandten.'
- id: de2-m3-r2-w06
  lesson: de2-m3-h-participles
  term: die Verwandte
  pos: noun
  plural: die Verwandten
  alt: [eine Verwandte]
  meanings: [relative (female), relative, relation]
  example: Am Sonntag besuchen uns meine Verwandten aus Wien.
  exampleEn: My relatives from Vienna are visiting us on Sunday.
- id: de2-m3-r2-w07
  lesson: de2-m3-h-participles
  term: der Deutsche
  pos: noun
  plural: die Deutschen
  alt: [ein Deutscher]
  meanings: [German (man), German, German person]
  example: Mein Mann ist Deutscher, ich bin Österreicherin.
  exampleEn: My husband is German; I'm Austrian.
  note: 'An adjective used as a noun: der Deutsche, ein Deutscher, zwei Deutsche. (But der Österreicher, ein Österreicher are ordinary nouns.)'
- id: de2-m3-r2-w08
  lesson: de2-m3-h-participles
  term: die Deutsche
  pos: noun
  plural: die Deutschen
  alt: [eine Deutsche]
  meanings: [German (woman), German, German person]
  example: Sie ist Deutsche, aber sie wohnt in der Schweiz.
  exampleEn: She's German, but she lives in Switzerland.
- id: de2-m3-r2-w09
  lesson: de2-m3-h-participles
  term: fließend
  pos: adjective
  meanings: [fluent (also running, of water), fluent, fluently, running, flowing]
  example: Sie spricht fließend Deutsch und Englisch.
  exampleEn: She speaks fluent German and English.
  note: 'Present participle of fließen (to flow): fließendes Wasser = running water.'
- id: de2-m3-r2-w10
  lesson: de2-m3-h-participles
  term: folgend
  pos: adjective
  meanings: [following, the following]
  example: Bitte beantworten Sie die folgenden Fragen.
  exampleEn: Please answer the following questions.
- id: de2-m3-r2-w11
  lesson: de2-m3-h-participles
  term: geöffnet
  pos: adjective
  alt: [geoeffnet]
  meanings: [open (of a shop or office), open, opened]
  example: Die Bäckerei ist sonntags von 8 bis 11 Uhr geöffnet.
  exampleEn: The bakery is open on Sundays from 8 to 11.
- id: de2-m3-r2-w12
  lesson: de2-m3-h-participles
  term: geschlossen
  pos: adjective
  meanings: [closed, shut]
  example: Heute ist das Museum geschlossen.
  exampleEn: The museum is closed today.
- id: de2-m3-r2-w13
  lesson: de2-m3-h-participles
  term: hausgemacht
  pos: adjective
  meanings: [homemade, home-made]
  example: Die Marmelade ist hausgemacht.
  exampleEn: The jam is homemade.
- id: de2-m3-r2-w14
  lesson: de2-m3-h-participles
  term: gefüllt
  pos: adjective
  alt: [gefuellt]
  meanings: [stuffed (food), stuffed, filled]
  example: Heute gibt es gefüllte Paprika mit Reis.
  exampleEn: Today there are stuffed peppers with rice.
- id: de2-m3-r2-w15
  lesson: de2-m3-h-participles
  term: die Paprika
  pos: noun
  plural: die Paprikas
  meanings: [pepper (the vegetable), pepper, bell pepper, capsicum, paprika]
  example: Ich schneide die rote Paprika in kleine Stücke.
  exampleEn: I'm cutting the red pepper into small pieces.
  note: 'Also the spice paprika. In Austria the vegetable is often der Paprika.'
- id: de2-m3-r2-w16
  lesson: de2-m3-h-participles
  term: das Würstchen
  pos: noun
  plural: die Würstchen
  alt: [das Wuerstchen]
  meanings: [small sausage, sausage, frankfurter, hot dog sausage]
  example: Die Kinder essen gern Würstchen mit Senf.
  exampleEn: The children like eating sausages with mustard.

# --- 12h2 Comparing the German-speaking countries ---
- id: de2-m3-r2-w17
  lesson: de2-m3-h-records
  term: die Fläche
  pos: noun
  plural: die Flächen
  alt: [die Flaeche]
  meanings: [area (size of a surface), area, surface]
  example: Die Schweiz hat eine Fläche von etwa 41.000 Quadratkilometern.
  exampleEn: Switzerland has an area of about 41,000 square kilometres.
- id: de2-m3-r2-w18
  lesson: de2-m3-h-records
  term: die Bevölkerung
  pos: noun
  plural: die Bevölkerungen
  alt: [die Bevoelkerung]
  meanings: [population]
  example: Die Bevölkerung der Stadt wird immer älter.
  exampleEn: The town's population is getting older and older.
- id: de2-m3-r2-w19
  lesson: de2-m3-h-records
  term: der Meter
  pos: noun
  plural: die Meter
  meanings: [metre, meter, metres]
  example: Der Turm ist hundert Meter hoch.
  exampleEn: The tower is a hundred metres high.
- id: de2-m3-r2-w20
  lesson: de2-m3-h-records
  term: doppelt
  pos: adjective
  meanings: [double, twice, doubly]
  example: Unsere neue Wohnung ist doppelt so groß wie die alte.
  exampleEn: Our new flat is twice as big as the old one.
- id: de2-m3-r2-w21
  lesson: de2-m3-h-records
  term: mindestens
  pos: adverb
  meanings: [at least]
  example: Du musst mindestens eine Stunde warten.
  exampleEn: You have to wait at least an hour.
- id: de2-m3-r2-w22
  lesson: de2-m3-h-records
  term: höchstens
  pos: adverb
  alt: [hoechstens]
  meanings: [at most, at the most, no more than]
  example: Der Weg ist höchstens zwei Kilometer lang.
  exampleEn: The path is two kilometres long at most.
- id: de2-m3-r2-w23
  lesson: de2-m3-h-records
  term: deutschsprachig
  pos: adjective
  meanings: [German-speaking]
  example: Liechtenstein ist auch ein deutschsprachiges Land.
  exampleEn: Liechtenstein is also a German-speaking country.
- id: de2-m3-r2-w24
  lesson: de2-m3-h-records
  term: insgesamt
  pos: adverb
  meanings: [in total, altogether, overall]
  example: Insgesamt waren wir zwölf Personen.
  exampleEn: There were twelve of us altogether.
- id: de2-m3-r2-w25
  lesson: de2-m3-h-records
  term: knapp
  pos: adjective
  meanings: [just under (with numbers), just under, barely, almost, scarce, tight]
  example: Die Fahrt dauert knapp zwei Stunden.
  exampleEn: The journey takes just under two hours.
- id: de2-m3-r2-w26
  lesson: de2-m3-h-records
  term: übrigens
  pos: adverb
  alt: [uebrigens]
  meanings: [by the way, incidentally]
  example: Übrigens, hast du morgen Zeit?
  exampleEn: By the way, are you free tomorrow?
- id: de2-m3-r2-w27
  lesson: de2-m3-h-records
  kind: phrase
  term: mit Abstand
  meanings: [by far]
  example: Das ist mit Abstand der beste Kuchen der Stadt.
  exampleEn: That's by far the best cake in town.
