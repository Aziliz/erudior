# German A2, module 1, round 2: grammar terms bolded in the honors lessons 04h1 and 04h2.
- term: principal parts
  aliases: [principal part, Stammformen, three forms of a verb]
  definition: 'The three forms a dictionary gives for a verb: infinitive, simple past and past participle, as in fahren – fuhr – gefahren or heiraten – heiratete – geheiratet. Learning them together lets you build every past tense.'
  topic: Simple past
- term: ablaut
  aliases: [Ablaut, vowel gradation]
  definition: 'The change of stem vowel in strong verbs: finden – fand – gefunden, sprechen – sprach – gesprochen. Most strong verbs follow a few patterns (ei – ie – ie, ie – o – o, i – a – u …). English has it too: sing – sang – sung.'
  topic: Simple past
- term: direct speech
  aliases: [direkte Rede, quoted speech]
  definition: 'Someone''s exact words, in quotation marks: Anna sagt: „Ich bin krank.“ German quotation marks open low and close high.'
  topic: Reported speech
- term: reported speech
  aliases: [indirect speech, indirekte Rede]
  definition: 'Passing on what someone said in your own sentence: Anna sagt, dass sie krank ist. In everyday German, statements take dass, questions a question word or ob, commands sollen; the pronouns change to fit the new speaker and the tense usually stays.'
  topic: Reported speech
- term: Konjunktiv I
  aliases: [Konjunktiv 1, subjunctive I, present subjunctive, reported-speech subjunctive]
  definition: 'The verb form that news reports use for reported speech, to show they are only passing on what someone said: Der Minister sagte, er sei krank / er habe keine Zeit. Recognise er sei, habe, werde, könne, müsse and the -e ending (er komme); in conversation use normal forms. Taught fully at B1.'
  topic: Reported speech
