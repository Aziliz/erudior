# German A2, module 6 honors lessons (round 2): notecards
# --- 24h1 Die Nachrichten ---
- {front: 'Parts of a news article', back: 'die Schlagzeile (headline), der Vorspann (lead), das Foto, die Bildunterschrift (caption), der Text.', topic: News German}
- {front: 'How is a news report built?', back: 'Most important first: headline, then the lead with wer? was? wann? wo?, then wie? and warum?, then background and quotes.', topic: News German}
- {front: 'Nominal style in headlines', back: 'Nouns instead of verbs, no articles, no sein: Eröffnung im Mai = Die Stadt will die Brücke im Mai eröffnen.', topic: News German}
- {front: 'Feuerwehr rettet Katze: when did it happen?', back: 'In the past. Headlines use the present tense for events that already happened.', topic: News German}
- {front: 'Simple past in reports: sein, haben, geben, kommen, sagen', back: 'war, hatte, gab (es gab), kam, sagte.', topic: News German}
- {front: 'Zwei Menschen wurden verletzt.', back: 'Two people were injured. werden + past participle = the passive (recognize only at A2).', topic: News German}
- {front: 'laut Polizei / laut einer Umfrage', back: 'according to the police / according to a survey. laut + dative; not the adjective laut (loud).', topic: News German}
- {front: 'Das Handy soll 900 Euro kosten.', back: 'The phone is said to cost 900 euros. Hearsay sollen: reported, not confirmed.', topic: News German}
- {front: 'After a quote: „Wir sind froh“, ___ die Besitzerin.', back: 'sagte die Besitzerin: the quote fills position 1, so the verb comes next.', topic: News German}
- {front: 'die Firma, ___ er arbeitet (bei)', back: 'bei der: the preposition comes first and decides the case (bei + dative, feminine).', topic: Relative clauses}
- {front: 'die Stadt, in der der Unfall passierte = ?', back: 'die Stadt, wo der Unfall passierte. wo is the relative adverb for places.', topic: Relative clauses}
- {front: 'aktuell: false friend', back: 'aktuell = current, up to date. "Actual" is tatsächlich.', topic: News German}
- {front: 'Checking a story', back: 'Source (Quelle)? Date (aktuell)? Other media? Does the headline match the text? Watch soll, angeblich, laut.', topic: News German}
# --- 24h2 Familienfeste ---
- {front: 'die Schultüte', back: 'A big decorated paper cone of sweets and school things that children carry on their first school day (Einschulung). Zuckertüte in parts of the east.', topic: Family celebrations}
- {front: 'Taufe, Erstkommunion, Konfirmation, Jugendweihe', back: 'christening; Catholic first communion (about 9); Protestant confirmation (about 14); non-religious coming-of-age ceremony (about 14, mostly eastern Germany).', topic: Family celebrations}
- {front: 'Birthday rule: when do you congratulate?', back: 'On the day or after (Alles Gute nachträglich!), never before: many Germans think that brings bad luck.', topic: Family celebrations}
- {front: 'Who pays at a German birthday?', back: 'Often the birthday person: they invite friends and bring cake to work.', topic: Family celebrations}
- {front: 'Where does a marriage become legal?', back: 'Only at das Standesamt (registry office), in Germany, Austria and Switzerland. A church wedding is optional.', topic: Family celebrations}
- {front: 'der Polterabend', back: 'A party before the wedding: guests smash old china (not glass) for luck, and the couple sweep up the Scherben together. Scherben bringen Glück.', topic: Family celebrations}
- {front: 'das Brautpaar', back: 'die Braut (bride) + der Bräutigam (groom).', topic: Family celebrations}
- {front: 'Silberhochzeit, Goldene Hochzeit', back: '25 and 50 years of marriage.', topic: Family celebrations}
- {front: 'Housewarming in German, and a classic present', back: 'die Einweihungsparty; bread and salt (Brot und Salz).', topic: Family celebrations}
- {front: 'Why Herzlichen Glückwunsch with -en?', back: 'It is an ellipsis of a sentence with a direct object (Ich spreche dir meinen herzlichen Glückwunsch aus): masculine accusative, no article, so -en.', topic: Wishes and cards}
- {front: 'Guten Rutsch, Gute Besserung, Schönes Wochenende, Frohe Ostern', back: 'Accusative wishes with strong endings: masculine -en, feminine -e, neuter -es, plural -e.', topic: Wishes and cards}
- {front: 'Condolences in German', back: 'Herzliches Beileid! / Mein aufrichtiges Beileid. Closing: In stiller Anteilnahme.', topic: Wishes and cards}
- {front: 'Happy 40th birthday!', back: 'Herzlichen Glückwunsch zum 40. Geburtstag! (zum vierzigsten)', topic: Wishes and cards}
