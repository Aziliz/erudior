# German A2, module 2, round 2: cards for the honors lessons.
# --- Verbs with a dative reflexive ---
- {front: 'When is a reflexive pronoun dative (mir, dir)?', back: 'When the sentence has another accusative object: Ich wasche mir die Hände. Ich kaufe mir ein Buch. Without one it is accusative: Ich wasche mich (but dative verbs keep the dative: Wir helfen uns).', topic: Dative reflexive}
- {front: 'sich etwas vorstellen', back: 'to imagine something (dative): Ich kann mir das gut vorstellen.', topic: Dative reflexive}
- {front: 'sich vorstellen (accusative)', back: 'to introduce yourself: Darf ich mich vorstellen?', topic: Dative reflexive}
- {front: 'sich etwas merken', back: 'to remember, make a note of: Merk dir die Adresse!', topic: Dative reflexive}
- {front: 'sich etwas ansehen / anschauen', back: 'to have a look at, watch: Ich sehe mir den Film an. Perfect: hat sich angesehen.', topic: Dative reflexive}
- {front: 'sich etwas leisten (können)', back: 'to (be able to) afford: Ich kann mir kein Auto leisten.', topic: Dative reflexive}
- {front: 'sich etwas gönnen', back: 'to treat yourself to: Gönn dir eine Pause!', topic: Dative reflexive}
- {front: 'sich etwas ausdenken', back: 'to make up, invent: Er hat sich eine Ausrede ausgedacht.', topic: Dative reflexive}
- {front: 'Two pronouns with a dative reflexive: which order?', back: 'Accusative first: Ich sehe ihn mir an. Merk es dir!', topic: Dative reflexive}
- {front: 'I broke my arm.', back: 'Ich habe mir den Arm gebrochen. (dative reflexive + article, not mein)', topic: Dative reflexive}
- {front: 'Stell dir vor!', back: 'Guess what! (literally: imagine!)', topic: Dative reflexive}
- {front: 'How do you make "each other" unambiguous?', back: 'einander or sich gegenseitig: Sie helfen einander. Sie helfen sich gegenseitig. Not both together.', topic: Each other}
- {front: 'miteinander, voneinander, aneinander', back: 'with each other, from/about each other, of each other: Wir sprechen miteinander.', topic: Each other}
# --- Feelings with the dative ---
- {front: 'I am cold. / I feel sick. / I feel dizzy.', back: 'Mir ist kalt. / Mir ist schlecht (übel). / Mir ist schwindlig. No subject, always ist.', topic: Dative of feeling}
- {front: 'Ich bin kalt vs Mir ist kalt', back: 'Ich bin kalt = I am a cold person. Mir ist kalt = I feel cold.', topic: Dative of feeling}
- {front: 'Das ist mir egal / wichtig / recht', back: 'I don''t mind / that matters to me / that''s all right with me', topic: Dative of feeling}
- {front: 'Es tut mir leid. vs Du tust mir leid.', back: 'I''m sorry (apology or sympathy). vs I feel sorry for you (pity).', topic: Dative of feeling}
- {front: 'einfallen', back: 'to occur to: Mir fällt sein Name nicht ein. Perfect: Mir ist nichts eingefallen.', topic: Dative of feeling}
- {front: 'auffallen', back: 'to strike, be noticed: Mir ist aufgefallen, dass … = I noticed that …', topic: Dative of feeling}
- {front: 'vorkommen (+ Dat + adjective)', back: 'to seem: Das kommt mir komisch vor.', topic: Dative of feeling}
- {front: 'leichtfallen / schwerfallen', back: 'to be easy / hard for: Deutsch fällt mir leicht. Mathe fällt mir schwer.', topic: Dative of feeling}
- {front: 'Which auxiliary do einfallen, auffallen and vorkommen take?', back: 'sein: Mir ist nichts eingefallen. Das ist mir aufgefallen.', topic: Dative of feeling}
- {front: 'Mir fallen die Wörter nicht ein: why fallen?', back: 'The subject is die Wörter (plural); the verb agrees with the thing, not with mir.', topic: Dative of feeling}
- {front: 'Ich hab dich lieb', back: 'I love you, warm but not romantic: family, close friends (hdl in messages)', topic: Liking and love}
- {front: 'The liking scale (rough)', back: 'nett finden → mögen → gern haben → lieb haben → verliebt sein → lieben', topic: Liking and love}
- {front: 'Du gefällst mir. vs Du bist mir sympathisch.', back: 'You attract me / I like how you are. vs I find you likeable.', topic: Liking and love}
