# German A2, module 2, round 2: terms bolded in the honors lessons.
- term: dative reflexive
  aliases: [dative reflexive pronoun, dative reflexive pronouns, dative reflexives, Reflexivpronomen im Dativ]
  definition: 'A reflexive pronoun in the dative case: mir, dir, sich, uns, euch, sich. It is used when the sentence also has an accusative object and the person who gets, wants or experiences that thing is the subject: Ich kaufe mir ein Buch (I buy myself a book), Ich kann mir das vorstellen (I can imagine that), Ich putze mir die Zähne. Without another object the accusative is used instead: Ich stelle mich vor (I introduce myself).'
  topic: Pronouns
- term: experiencer
  aliases: [experiencers, dative experiencer, experiencer dative, dative of feeling]
  definition: 'The person who feels or experiences something. In German the experiencer of many feelings and sensations is in the dative: Mir ist kalt (I am cold), Das ist mir egal (I do not mind), Mir fällt nichts ein (I cannot think of anything), Die Suppe schmeckt mir. The thing that causes the feeling is the subject, and the verb agrees with it.'
  topic: Cases
