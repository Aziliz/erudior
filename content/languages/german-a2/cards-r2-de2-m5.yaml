# German A2, module 5 honors lessons (round 2): notecards
# --- 20h1 Applying for a job ---
- {front: 'What goes into a German job application?', back: 'das Anschreiben (cover letter, one page), der Lebenslauf (CV), die Zeugnisse (certificates and references).', topic: Job applications}
- {front: 'die Zusage vs die Absage', back: 'die Zusage = a yes (you get the job); die Absage = a no, a rejection.', topic: Job applications}
- {front: 'einstellen (at work)', back: 'to hire: Die Firma stellt neue Mitarbeiter ein. Separable; hat eingestellt.', topic: Job applications}
- {front: 'A German Lebenslauf: three habits', back: 'A table with dates on the left, newest first; no unexplained gaps; traditionally place, date and signature at the bottom. A photo is common but optional.', topic: Job applications}
- {front: 'die Probezeit', back: 'Probation period at the start of a job, up to six months; either side can end the job with two weeks'' notice.', topic: Job applications}
- {front: 'Nominal style: Ich habe Kunden betreut. → ?', back: 'Kundenbetreuung / Betreuung von Kunden. -ung nouns are feminine.', topic: Nominal style}
- {front: 'Nominal style: Ich habe Besprechungen organisiert. → ?', back: 'Organisation von Besprechungen. -ieren verbs make feminine nouns in -ation.', topic: Nominal style}
- {front: 'First line of a cover letter', back: 'Hiermit bewerbe ich mich um die Stelle als … (hiermit = hereby).', topic: Job applications}
- {front: 'Last line of a cover letter', back: 'Über eine Einladung zu einem Vorstellungsgespräch würde ich mich sehr freuen.', topic: Job applications}
- {front: 'I''m looking forward to meeting you (in a letter)', back: 'Ich freue mich darauf, Sie kennenzulernen. (darauf points forward to the zu-infinitive)', topic: Job applications}
- {front: 'Arbeitszeugnis: stets zu unserer vollsten Zufriedenheit', back: 'The top grade (sehr gut) in the usual reading of reference formulas. Without stets and with vollen: befriedigend.', topic: Job applications}
- {front: 'Arbeitszeugnis: Er war stets bemüht.', back: 'Sounds kind, reads as a bad grade: he tried but didn''t succeed.', topic: Job applications}
# --- 20h2 At the pharmacy ---
- {front: 'verschreibungspflichtig, apothekenpflichtig, freiverkäuflich', back: 'prescription only; pharmacy only (no prescription); on general sale. The last two are rezeptfrei.', topic: Medicine}
- {front: 'die Zuzahlung', back: 'The share adults with statutory insurance pay for a prescription medicine: 10 percent, at least 5 and at most 10 euros per pack.', topic: Medicine}
- {front: 'die Packungsbeilage / der Beipackzettel: the six sections', back: '1 what it is for, 2 before taking it (warnings), 3 how to take it, 4 side effects, 5 storage, 6 contents and more information.', topic: Medicine}
- {front: 'Side effects: häufig, gelegentlich, selten', back: 'häufig = 1 to 10 in 100; gelegentlich = 1 to 10 in 1,000; selten = 1 to 10 in 10,000.', topic: Medicine}
- {front: 'einnehmen', back: 'to take (a medicine). Separable: Nehmen Sie die Tablette nach dem Essen ein. hat eingenommen.', topic: Medicine}
- {front: 'wirken / der Wirkstoff', back: 'to work, have an effect / active ingredient.', topic: Medicine}
- {front: 'Passive: how to recognize it', back: 'werden in position 2 + past participle at the end: Die Tabletten werden nach dem Essen eingenommen. (are taken)', topic: Passive (recognition)}
- {front: 'werden: three jobs', back: '+ adjective/noun = become (Er wird Arzt); + infinitive = future (Ich werde anrufen); + past participle = passive (Es wird eingenommen).', topic: Passive (recognition)}
- {front: 'Compound nouns: which part decides the gender?', back: 'The last part: der Schmerz but das Schmerzmittel; die Packung + die Beilage = die Packungsbeilage.', topic: Medicine}
- {front: 'die Arbeitsunfähigkeitsbescheinigung', back: 'Doctor''s certificate that you can''t work (die AU, die Krankschreibung). Needed if you''re ill for more than three calendar days.', topic: Medicine}
# --- 20h3 Letters from the authorities ---
- {front: 'Parts of an official letter', back: 'Absender, Anschrift, Aktenzeichen and Datum, Betreff (bold), Anrede, text, Mit freundlichen Grüßen, i. A. + signature, Anlagen.', topic: Official letters}
- {front: 'das Aktenzeichen (Az.)', back: 'The file number of your case. Quote it whenever you write or call.', topic: Official letters}
- {front: 'der Bescheid vs die Mahnung', back: 'der Bescheid = official decision on your case; die Mahnung = reminder that a payment is overdue.', topic: Official letters}
- {front: 'der Widerspruch', back: 'An objection to a Bescheid, usually within one month; the Rechtsbehelfsbelehrung at the end of the letter says how and by when.', topic: Official letters}
- {front: 'Der Betrag ist bis zum 15. März zu zahlen.', back: 'The amount must be paid by 15 March. sein + zu + infinitive = must be done.', topic: Official letters}
- {front: 'Sie haben die Unterlagen vorzulegen.', back: 'You must present the documents. haben + zu + infinitive = müssen, in a strict tone.', topic: Official letters}
- {front: 'nach Eingang Ihrer Zahlung', back: 'when your payment has arrived (nominal style: Eingang ← eingehen).', topic: Nominal style}
- {front: 'bei Nichtzahlung / vor Ablauf der Frist', back: 'if you don''t pay / before the deadline runs out.', topic: Nominal style}
- {front: 'z. B., d. h., bzw., ggf., u. a., usw.', back: 'zum Beispiel, das heißt, beziehungsweise, gegebenenfalls, unter anderem, und so weiter. Say them in full.', topic: Official letters}
- {front: 'i. A. before a signature', back: 'im Auftrag: the person signs on behalf of the office or company.', topic: Official letters}
