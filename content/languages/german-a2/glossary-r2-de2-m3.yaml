# German A2, module 3 round 2: grammar terms from the honors lessons 12h1 and 12h2
- term: weak declension
  aliases: [weak declensions, weak adjective ending, weak adjective endings, weak ending, weak endings, schwache Deklination]
  definition: 'The name grammar books give to adjective endings after a der-word (der, dieser, jeder, welcher, alle). The article always shows gender and case, so the adjective only takes -e or -en: der neue Rock, mit dem neuen Rock.'
  topic: Adjectives
- term: mixed declension
  aliases: [mixed declensions, mixed adjective ending, mixed adjective endings, mixed ending, mixed endings, gemischte Deklination]
  definition: 'The name grammar books give to adjective endings after an ein-word (ein, kein, mein …). Where ein shows nothing (masculine nominative, neuter nominative and accusative) the adjective takes the strong ending (-er, -es); everywhere else it takes -e or -en: ein neuer Rock, einen neuen Rock.'
  topic: Adjectives
- term: strong declension
  aliases: [strong declensions, strong adjective ending, strong adjective endings, strong ending, strong endings, starke Deklination]
  definition: 'The name grammar books give to adjective endings with no article (also after numbers, ein paar, viele, einige). The adjective shows gender and case itself with the endings of der, die, das, dem and den: frischer Fisch, mit frischem Brot, zwei Erwachsene. Not the same idea as a strong verb.'
  topic: Adjectives
- term: present participle
  aliases: [present participles, Partizip I, Partizip Präsens]
  definition: 'The infinitive plus -d: kochend, lachend, folgend. Used mainly before a noun, with normal adjective endings, to mean "-ing": kochendes Wasser (boiling water), die folgenden Fragen. German does not use it to make "is doing": the water is boiling = Das Wasser kocht.'
  topic: Adjectives
- term: place-name adjective
  aliases: [place-name adjectives, place name adjective, place name adjectives, city adjective, city adjectives]
  definition: 'An adjective made from the name of a town, region or country with -er: Berliner, Wiener, Kölner, Schweizer. It is written with a capital letter and never takes an ending: der Kölner Dom, mit Schweizer Käse.'
  topic: Adjectives
- term: positive
  aliases: [positive degree, Positiv]
  definition: 'The plain form of an adjective, the first of the three degrees of comparison: groß (positive), größer (comparative), am größten (superlative).'
  topic: Comparison
- term: intensifier
  aliases: [intensifiers]
  definition: 'A word that makes a comparison stronger or weaker. Before a comparative German uses viel (much), noch (even), etwas or ein bisschen (a little): viel größer, noch höher. Sehr goes only with the plain adjective: sehr groß.'
  topic: Comparison
