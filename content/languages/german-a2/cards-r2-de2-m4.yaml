# German A2, module 4 round 2: cards for the honors lessons 16h1 and 16h2
# --- 16h1 Beyond the room: figurative German ---
- {front: 'Two-way preposition with no real place: who decides the case?', back: 'Not Wo?/Wohin?: the fixed expression does. Learn it with its case (liegen an + Dat, denken an + Akk).', topic: Prepositions in fixed expressions}
- {front: 'am Montag, im Juli, vor einer Woche: which case?', back: 'Dative: two-way prepositions in time expressions take the dative. Exception: über + Akk for a stretch (übers Wochenende).', topic: Prepositions in fixed expressions}
- {front: 'It says in the paper that …', back: 'In der Zeitung steht, dass … (stehen in + dative)', topic: Figurative position verbs}
- {front: 'to be stuck in traffic', back: 'im Stau stehen: Ich stehe seit einer Stunde im Stau.', topic: Figurative position verbs}
- {front: 'Das liegt am Wetter.', back: 'That''s because of the weather. (liegen an + dative; question: Woran liegt das?)', topic: Figurative position verbs}
- {front: 'It''s up to you.', back: 'Das liegt bei dir. / Die Entscheidung liegt bei dir.', topic: Figurative position verbs}
- {front: 'Mathe liegt mir nicht.', back: 'Maths isn''t my thing. (jemandem liegen = to suit someone, be good at)', topic: Figurative position verbs}
- {front: 'Ich hänge an meiner Wohnung. (perfect?)', back: 'Ich habe an meiner Wohnung gehangen. (hängen an + Dat = be attached to; being verb, so gehangen)', topic: Figurative position verbs}
- {front: 'Wo steckst du?', back: 'Where (on earth) are you? (stecken = to be somewhere, often hidden)', topic: Figurative position verbs}
- {front: 'auf etwas stehen', back: 'Colloquial: to be into something (+ accusative). Ich stehe auf alte Filme.', topic: Figurative position verbs}
- {front: 'vor allem / unter uns / im Moment', back: 'above all / between you and me / at the moment (all fixed datives)', topic: Prepositions in fixed expressions}
- {front: 'auf dem Land vs aufs Land', back: 'auf dem Land (Dat) = in the countryside; aufs Land (Akk) = to the countryside.', topic: Prepositions in fixed expressions}
# --- 16h2 Weather talk ---
- {front: 'es hagelt / es donnert / es blitzt / es nieselt', back: 'it''s hailing / thundering / there''s lightning / it''s drizzling (impersonal verbs, perfect with haben)', topic: Weather and forecasts}
- {front: 'Does the weather es disappear after Morgen?', back: 'No: Morgen regnet es. Gestern hat es gehagelt.', topic: Weather and forecasts}
- {front: 'Morgen regnet es. / Morgen wird es regnen. / Morgen soll es regnen.', back: 'plain statement / prediction / the forecast says so (reporting)', topic: Weather and forecasts}
- {front: 'rainy', back: 'regnerisch (not regnig): the exception to sonnig, windig, neblig, wolkig', topic: Weather and forecasts}
- {front: 'Celsius → Fahrenheit', back: 'F = C × 9/5 + 32. Quick estimate: double it and add 30.', topic: Temperatures}
- {front: 'Fahrenheit → Celsius', back: 'C = (F − 32) × 5/9. Example: 68 °F = 20 °C.', topic: Temperatures}
- {front: 'It''s minus five.', back: 'Es sind minus fünf Grad. / Es sind fünf Grad unter null.', topic: Temperatures}
- {front: 'I''m cold.', back: 'Mir ist kalt. / Ich friere. (Not: Ich bin kalt.)', topic: Weather and forecasts}
- {front: 'der Föhn', back: 'A warm, dry wind coming down the north side of the Alps; also a hairdryer.', topic: Weather and forecasts}
- {front: 'die Eisheiligen', back: '11–15 May: in folk tradition, frost is possible until then, so gardeners wait to plant.', topic: Weather and forecasts}
- {front: 'Es gibt kein schlechtes Wetter …', back: '… nur falsche Kleidung. (There''s no bad weather, only the wrong clothes.)', topic: Weather and forecasts}
- {front: 'Es regnet in Strömen. / Es gießt wie aus Eimern.', back: 'It''s pouring. / It''s bucketing down (informal).', topic: Weather and forecasts}
