# German A2, module 3: Describing things (lessons 09–12)

# --- 09 Adjective endings after ein, kein and mein ---
- id: de2-q-0901
  lesson: de2-adj-indef
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Ich suche einen ___ Mantel." (warm)'
  choices: ['warmer', 'warmen', 'warme', 'warmes']
  answer: 1
  explanation: |-
    Mantel is masculine and the object of suchen, so it is accusative. "einen" already shows masculine accusative, so the adjective just takes -en: einen warmen Mantel. "warmer" is the masculine nominative ending (ein warmer Mantel).
- id: de2-q-0902
  lesson: de2-adj-indef
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Das ist ein ___ Kleid." (rot)'
  choices: ['rote', 'roter', 'roten', 'rotes']
  answer: 3
  explanation: |-
    Kleid is neuter (das Kleid). "ein" doesn't show that it's neuter, so the adjective takes the -es of "das": ein rotes Kleid. "roter" would be masculine, and "rote" is the ending after "das" (das rote Kleid), not after "ein".
- id: de2-q-0903
  lesson: de2-adj-indef
  topic: Adjective endings
  stem: 'Complete: "Sie trägt eine ___ Bluse." (gestreift)'
  choices: ['gestreifte', 'gestreiften', 'gestreifter', 'gestreiftes']
  answer: 0
  explanation: |-
    Bluse is feminine, and after "eine" in the nominative or accusative the adjective ends in -e: eine gestreifte Bluse. "gestreiften" would be right in the dative (mit einer gestreiften Bluse).
- id: de2-q-0904
  lesson: de2-adj-indef
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Mein ___ Pullover ist kaputt." (alt)'
  choices: ['alte', 'alten', 'alter', 'altes']
  answer: 2
  explanation: |-
    Pullover is masculine and the subject, so nominative. "mein" looks like "ein" and doesn't show the gender, so the adjective takes the -er of "der": mein alter Pullover. "alten" would be the accusative (meinen alten Pullover).
- id: de2-q-0905
  lesson: de2-adj-indef
  topic: Adjective endings
  stem: 'Complete: "Er geht mit seiner ___ Freundin ins Kino." (neu)'
  choices: ['neue', 'neuer', 'neues', 'neuen']
  answer: 3
  explanation: |-
    "mit" takes the dative, and after any dative ein-word (seiner, einem, meinen …) the adjective always ends in -en: mit seiner neuen Freundin. "neue" would be the nominative or accusative.
- id: de2-q-0906
  lesson: de2-adj-indef
  topic: Adjective endings
  stem: 'Complete: "Das sind keine ___ Schuhe." (bequem)'
  choices: ['bequemen', 'bequeme', 'bequemer', 'bequemes']
  answer: 0
  explanation: |-
    In the plural after keine, meine, unsere and the other ein-words, the adjective ends in -en: keine bequemen Schuhe. "bequeme" is the ending with no article at all (bequeme Schuhe).
- id: de2-q-0907
  lesson: de2-adj-indef
  module_quiz: true
  topic: Adjective endings
  stem: 'Which sentence is correct?'
  choices: ['Der Rock ist kurzer.', 'Der Rock ist kurz.', 'Der kurz Rock ist neu.', 'Ein kurz Rock ist neu.']
  answer: 1
  explanation: |-
    After sein, an adjective has no ending: Der Rock ist kurz. Before a noun it always needs one: der kurze Rock, ein kurzer Rock. "Der Rock ist kurzer" adds an ending where none belongs (and kürzer would mean "shorter").
- id: de2-q-0908
  lesson: de2-adj-indef
  topic: Adjective endings
  stem: 'Which sentence has a mistake?'
  choices: ['Ich trage einen dunklen Anzug.', 'Sie hat eine dunkle Jacke.', 'Er kauft eine dunkele Hose.', 'Das ist ein dunkles Hemd.']
  answer: 2
  explanation: |-
    Adjectives ending in -el drop the e before an ending: dunkel becomes dunkle, dunklen, dunkles. So it must be "eine dunkle Hose". The other three sentences drop the e correctly.
- id: de2-q-0909
  lesson: de2-adj-indef
  topic: Clothes
  stem: 'What does "Die Hose ist zu eng." mean?'
  choices: ['The trousers are too long.', 'The trousers are too tight.', 'The trousers are too loose.', 'The trousers are too expensive.']
  answer: 1
  explanation: |-
    eng means tight (or narrow). Too loose would be "zu weit", too long "zu lang", and too expensive "zu teuer". Note that die Hose is singular in German: one pair of trousers.
- id: de2-q-0910
  lesson: de2-adj-indef
  topic: Clothes
  stem: 'Read the message: "Hallo Mia! Ich gehe am Samstag zu Tims Party. Ich trage mein neues blaues Kleid und meine schwarzen Stiefel. Leihst du mir deinen warmen Schal? Es ist so kalt! Lena" What does Lena want from Mia?'
  choices: ['her blue dress', 'her black boots', 'her warm scarf', 'her woolly hat']
  answer: 2
  explanation: |-
    "Leihst du mir deinen warmen Schal?" means "Will you lend me your warm scarf?" The blue dress and the black boots are Lena's own (mein, meine), and a woolly hat (eine Mütze) isn't mentioned.
- id: de2-q-0911
  lesson: de2-adj-indef
  topic: Verbs
  stem: 'The sales assistant asks: "Möchten Sie die Jacke anprobieren?" Which answer is correct?'
  choices: ['Ja, ich anprobiere sie.', 'Ja, ich probiere an sie.', 'Ja, ich habe sie anprobieren.', 'Ja, gern. Ich probiere sie an.']
  answer: 3
  explanation: |-
    anprobieren is separable: the prefix an goes to the end of the sentence, after the object: Ich probiere sie an. "Ich anprobiere sie" forgets to separate the prefix, and "an sie" treats it like a preposition.
- id: de2-q-0912
  lesson: de2-adj-indef
  topic: Verbs
  stem: 'Complete: "Du ___ heute einen schönen Hut." (tragen)'
  choices: ['trägst', 'trägt', 'tragst', 'tragt']
  answer: 0
  explanation: |-
    tragen changes a to ä in the du and er/sie/es forms, like fahren: du trägst, er trägt. "tragst" forgets the umlaut, and "trägt" is the er/sie/es form.

# --- 10 Adjective endings after der, dieser and welcher ---
- id: de2-q-1001
  lesson: de2-adj-def
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Der ___ Pullover ist reduziert." (blau)'
  choices: ['blauer', 'blaue', 'blauen', 'blaues']
  answer: 1
  explanation: |-
    After der, die, das in the nominative singular, the adjective ends in -e: der blaue Pullover. "der" already shows masculine nominative, so the adjective doesn't need -er. "blauer" is correct only after ein (ein blauer Pullover).
- id: de2-q-1002
  lesson: de2-adj-def
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Ich nehme das ___ Hemd." (weiß)'
  choices: ['weißes', 'weißen', 'weiß', 'weiße']
  answer: 3
  explanation: |-
    Hemd is neuter, and neuter accusative after "das" takes -e: das weiße Hemd. "weißes" is the ending after "ein" (ein weißes Hemd), where the article doesn't show the gender.
- id: de2-q-1003
  lesson: de2-adj-def
  topic: Adjective endings
  stem: 'Complete: "Wir fahren mit dem ___ Aufzug." (neu)'
  choices: ['neuen', 'neue', 'neuem', 'neuer']
  answer: 0
  explanation: |-
    "mit" takes the dative, and after dem, der and den in the dative the adjective always ends in -en: mit dem neuen Aufzug. "neuem" copies the -em of dem, but the article already shows the case, so the adjective doesn't repeat it.
- id: de2-q-1004
  lesson: de2-adj-def
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Alle ___ Jacken sind im zweiten Stock." (reduziert)'
  choices: ['reduzierte', 'reduzierter', 'reduzierten', 'reduziertes']
  answer: 2
  explanation: |-
    alle is a der-word, and after der-words every plural adjective ends in -en: alle reduzierten Jacken. "reduzierte" would be correct with no article (reduzierte Jacken).
- id: de2-q-1005
  lesson: de2-adj-def
  topic: Adjective endings
  stem: 'Complete: "Kann ich diesen ___ Rock umtauschen?" (kurz)'
  choices: ['kurze', 'kurzer', 'kurzes', 'kurzen']
  answer: 3
  explanation: |-
    Rock is masculine and the object, so accusative: diesen. Masculine accusative always has -en on the adjective: diesen kurzen Rock. "kurze" is the nominative (dieser kurze Rock).
- id: de2-q-1006
  lesson: de2-adj-def
  topic: Adjective endings
  stem: 'Complete the answer: "Welche Hose nehmen Sie?" – "Die ___." (schwarz)'
  choices: ['schwarze', 'schwarzen', 'schwarz', 'schwarzes']
  answer: 0
  explanation: |-
    When the noun is left out, the adjective keeps its ending: die schwarze (Hose), feminine accusative after die, so -e. "Die schwarz" drops the ending, which German never does before an understood noun.
- id: de2-q-1007
  lesson: de2-adj-def
  module_quiz: true
  topic: Shopping
  stem: 'How do you say "a bag made of leather"?'
  choices: ['eine Tasche von Leder', 'eine Tasche aus Leder', 'eine Tasche mit Leder', 'eine Tasche für Leder']
  answer: 1
  explanation: |-
    German uses aus + the material, with no article: aus Leder, aus Holz, aus Baumwolle. "von Leder" is a literal translation of English "of" and sounds wrong.
- id: de2-q-1008
  lesson: de2-adj-def
  topic: Verbs
  stem: 'Which sentence is correct?'
  choices: ['Ich tausche um die Schuhe.', 'Ich umtausche die Schuhe.', 'Ich tausche die Schuhe um.', 'Ich habe die Schuhe umtauscht.']
  answer: 2
  explanation: |-
    umtauschen is separable: the prefix um goes to the very end: Ich tausche die Schuhe um. In the perfect the ge- goes between prefix and verb: Ich habe die Schuhe umgetauscht, so "umtauscht" is wrong.
- id: de2-q-1009
  lesson: de2-adj-def
  topic: Shopping
  stem: 'Read the sign in a department store: "Erdgeschoss: Kasse, Kundenservice. 1. Stock: Damenmode. 2. Stock: Herrenmode, Schuhe. 3. Stock: Spielzeug. Rolltreppe und Aufzug in der Mitte." Where do you find men''s clothes?'
  choices: ['on the ground floor', 'on the first floor', 'on the third floor', 'on the second floor']
  answer: 3
  explanation: |-
    Herrenmode (men's fashion) is in the 2. Stock, the second floor. Damenmode (women's fashion) is on the first floor, and the Erdgeschoss (ground floor) has the tills and customer service.
- id: de2-q-1010
  lesson: de2-adj-def
  topic: Shopping
  stem: 'At the till you hear: "Brauchen Sie eine Tüte?" What does it mean?'
  choices: ['Do you need a bag?', 'Do you need a receipt?', 'Do you need a discount?', 'Do you need a changing room?']
  answer: 0
  explanation: |-
    die Tüte is a paper or plastic bag from a shop. A receipt is die Quittung or der Kassenzettel, a discount der Rabatt, and a changing room die Umkleidekabine.
- id: de2-q-1011
  lesson: de2-adj-def
  topic: Adjective endings
  stem: 'Which sentence has a mistake?'
  choices: ['Der neue Mantel ist warm.', 'Die neuen Stiefel sind bequem.', 'Das schwarzes Kleid ist zu eng.', 'Welche rote Jacke meinst du?']
  answer: 2
  explanation: |-
    After "das" the adjective ends in -e, not -es: das schwarze Kleid. The -es ending belongs after "ein" (ein schwarzes Kleid), where the article doesn't show that the noun is neuter.
- id: de2-q-1012
  lesson: de2-adj-def
  topic: Shopping
  stem: 'You want to exchange a jumper. The assistant asks: "Haben Sie den Kassenzettel?" Which answer fits?'
  choices: ['Nein, ich habe die Marke.', 'Ja, hier ist die Quittung.', 'Ja, ich habe einen Rabatt.', 'Ja, die Garantie ist kaputt.']
  answer: 1
  explanation: |-
    der Kassenzettel is the till receipt, and die Quittung also means receipt, so "Ja, hier ist die Quittung" answers the question. die Marke is the brand, der Rabatt a discount, and die Garantie a guarantee.

# --- 11 Adjectives without an article ---
- id: de2-q-1101
  lesson: de2-adj-no-article
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Ich trinke gern ___ Wasser." (kalt)'
  choices: ['kalte', 'kalten', 'kaltes', 'kalter']
  answer: 2
  explanation: |-
    There's no article, so the adjective takes the ending of the article: Wasser is neuter (das Wasser), so kaltes Wasser. "kalten" is a common mistake: neuter accusative stays -es, just like das.
- id: de2-q-1102
  lesson: de2-adj-no-article
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Sie trinkt Kaffee mit ___ Milch." (warm)'
  choices: ['warmer', 'warme', 'warmen', 'warmem']
  answer: 0
  explanation: |-
    "mit" takes the dative. Milch is feminine, and the feminine dative article is "der", so with no article the adjective ends in -er: mit warmer Milch. "warmem" would be masculine or neuter dative.
- id: de2-q-1103
  lesson: de2-adj-no-article
  module_quiz: true
  topic: Adjective endings
  stem: 'Complete: "Wir brauchen ___ Eier." (frisch)'
  choices: ['frischen', 'frischer', 'frisches', 'frische']
  answer: 3
  explanation: |-
    Plural with no article in the accusative takes -e, like the article "die": frische Eier. "frischen" is the ending after die (die frischen Eier) or in the dative (mit frischen Eiern).
- id: de2-q-1104
  lesson: de2-adj-no-article
  topic: Adjective endings
  stem: 'Complete: "Brot mit ___ Käse ist lecker." (frisch)'
  choices: ['frischen', 'frischem', 'frischer', 'frisches']
  answer: 1
  explanation: |-
    Käse is masculine (der Käse) and "mit" takes the dative. The masculine dative article is "dem", so with no article the adjective ends in -em: mit frischem Käse.
- id: de2-q-1105
  lesson: de2-adj-no-article
  topic: Adjective endings
  stem: 'Complete the sign at the market: "___ Fisch aus der Nordsee!" (frisch)'
  choices: ['Frische', 'Frischen', 'Frischer', 'Frisches']
  answer: 2
  explanation: |-
    Fisch is masculine (der Fisch) and the phrase is nominative. With no article, the adjective takes the -er of "der": Frischer Fisch.
- id: de2-q-1106
  lesson: de2-adj-no-article
  topic: Adjective endings
  stem: 'Complete: "Ich koche gern mit ein paar ___ Freunden." (gut)'
  choices: ['gute', 'guter', 'gutes', 'guten']
  answer: 3
  explanation: |-
    "ein paar" never changes and doesn't count as an article, so the adjective takes the no-article ending. Here it's dative plural after "mit", so -en: mit ein paar guten Freunden.
- id: de2-q-1107
  lesson: de2-adj-no-article
  module_quiz: true
  topic: Verbs
  stem: 'Complete: "Er ___ das Fleisch in der Pfanne." (braten)'
  choices: ['bratet', 'brät', 'bratt', 'brätet']
  answer: 1
  explanation: |-
    braten has a vowel change a to ä in the du and er forms, and the er form has no extra ending: du brätst, er brät. "bratet" is a common mistake that forgets the stem change.
- id: de2-q-1108
  lesson: de2-adj-no-article
  topic: Verbs
  stem: 'What is the perfect of "Ich schneide die Tomaten"?'
  choices: ['Ich habe die Tomaten geschneidet.', 'Ich bin die Tomaten geschnitten.', 'Ich habe die Tomaten geschnitten.', 'Ich habe die Tomaten geschnitt.']
  answer: 2
  explanation: |-
    schneiden is irregular: hat geschnitten. It uses haben because it has an object. "geschneidet" treats it as a regular verb.
- id: de2-q-1109
  lesson: de2-adj-no-article
  topic: Food and cooking
  stem: 'There is a lot of chilli in your soup. Which sentence describes it?'
  choices: ['Die Suppe ist sehr scharf.', 'Die Suppe ist sehr sauer.', 'Die Suppe ist sehr süß.', 'Die Suppe ist sehr frisch.']
  answer: 0
  explanation: |-
    scharf means spicy (and also sharp). sauer is sour, like a lemon; süß is sweet; frisch is fresh. Don't use heiß for spicy: it only means a high temperature.
- id: de2-q-1110
  lesson: de2-adj-no-article
  topic: Food and cooking
  stem: 'You have finished eating in a restaurant and want to pay. What do you say?'
  choices: ['Die Speisekarte, bitte.', 'Die Rechnung, bitte.', 'Die Vorspeise, bitte.', 'Das Trinkgeld, bitte.']
  answer: 1
  explanation: |-
    die Rechnung is the bill. die Speisekarte is the menu, die Vorspeise the starter, and das Trinkgeld the tip, which you give, rather than ask for.
- id: de2-q-1111
  lesson: de2-adj-no-article
  topic: Food and cooking
  stem: 'Read the menu: "Vorspeise: Tomatensuppe. Hauptspeisen: gebratener Fisch mit frischem Gemüse; Schnitzel mit Pommes; Nudeln mit scharfer Soße. Nachtisch: Apfelkuchen mit warmer Vanillesoße." Anna eats no meat and no fish, and she loves spicy food. Which main course is best for her?'
  choices: ['the fried fish', 'the schnitzel', 'the tomato soup', 'the pasta with spicy sauce']
  answer: 3
  explanation: |-
    "Nudeln mit scharfer Soße" is pasta with a spicy sauce, with no meat or fish. The schnitzel is meat, the fish is fish, and the tomato soup is a starter, not a main course.
- id: de2-q-1112
  lesson: de2-adj-no-article
  topic: Adjective endings
  stem: 'Which sentence has a mistake?'
  choices: ['Alle frische Tomaten sind weg.', 'Ich kaufe frisches Brot.', 'Wir essen gern scharfes Essen.', 'Sie trinkt heiße Schokolade.']
  answer: 0
  explanation: |-
    alle is a der-word, so the adjective after it ends in -en: alle frischen Tomaten. Without alle it would be "frische Tomaten". The other three are correct no-article endings.

# --- 12 Comparing: bigger, the biggest ---
- id: de2-q-1201
  lesson: de2-comparison
  module_quiz: true
  topic: Comparison
  stem: 'Complete: "Die Stadt ist lauter ___ das Dorf."'
  choices: ['wie', 'als', 'dann', 'so']
  answer: 1
  explanation: |-
    After a comparative (lauter = louder), "than" is als: lauter als. wie is for things that are the same: so laut wie (as loud as). "größer wie" is heard in casual speech but isn't standard.
- id: de2-q-1202
  lesson: de2-comparison
  module_quiz: true
  topic: Comparison
  stem: 'Complete: "Mein Bruder ist so groß ___ ich."'
  choices: ['als', 'dass', 'wie', 'von']
  answer: 2
  explanation: |-
    so + adjective + wie means "as … as": so groß wie (as tall as). als goes with a comparative: größer als.
- id: de2-q-1203
  lesson: de2-comparison
  module_quiz: true
  topic: Comparison
  stem: 'What is the comparative of "alt"?'
  choices: ['alter', 'mehr alt', 'ältest', 'älter']
  answer: 3
  explanation: |-
    Many short adjectives add an umlaut: alt, älter, am ältesten. "alter" forgets the umlaut, and German never uses "mehr" to make a comparative.
- id: de2-q-1204
  lesson: de2-comparison
  topic: Comparison
  stem: 'Complete: "Dieses Café ist gut, aber das Café am Markt ist ___."'
  choices: ['besser', 'guter', 'mehr gut', 'am besten']
  answer: 0
  explanation: |-
    gut is irregular: gut, besser, am besten. You're comparing two cafés, so you need the comparative besser. "am besten" is the superlative (the best of all).
- id: de2-q-1205
  lesson: de2-comparison
  module_quiz: true
  topic: Comparison
  stem: 'Complete: "Die Zugspitze ist der ___ Berg in Deutschland." (hoch, superlative)'
  choices: ['höchster', 'hohe', 'höchste', 'höchsten']
  answer: 2
  explanation: |-
    The superlative of hoch is höchst-. Before a noun it takes the normal ending after der: masculine nominative, so -e: der höchste Berg. "hohe" is not a superlative, and "höchster" is the ending after ein, not der.
- id: de2-q-1206
  lesson: de2-comparison
  topic: Comparison
  stem: 'Complete: "Wir suchen eine ___ Wohnung." (groß, comparative)'
  choices: ['größer', 'größere', 'größte', 'größeren']
  answer: 1
  explanation: |-
    A comparative before a noun still takes an adjective ending. Wohnung is feminine accusative after eine, so -e: größer + e = eine größere Wohnung. "eine größer Wohnung" leaves out the ending.
- id: de2-q-1207
  lesson: de2-comparison
  topic: Comparison
  stem: 'Complete: "Im Sommer ist es hier am ___." (schön)'
  choices: ['schöner', 'schönste', 'schönen', 'schönsten']
  answer: 3
  explanation: |-
    After a verb, the superlative is am + adjective + -sten: am schönsten. "schönste" is the form before a noun (die schönste Jahreszeit).
- id: de2-q-1208
  lesson: de2-comparison
  topic: Comparison
  stem: 'Which superlative is spelled correctly?'
  choices: ['am ältesten', 'am ältsten', 'am altesten', 'am älteren']
  answer: 0
  explanation: |-
    After -t (and -d, -s, -ß, -z, -sch) the superlative adds an extra e so that you can say it: am ältesten. alt also takes an umlaut, so "am altesten" is wrong, and "am älteren" mixes in the comparative.
- id: de2-q-1209
  lesson: de2-comparison
  topic: Comparison
  stem: 'What does "Immer mehr Leute wohnen auf dem Land." mean?'
  choices: ['More and more people live in the country.', 'People always live in the city.', 'Most people live in the country.', 'People always lived in the country.']
  answer: 0
  explanation: |-
    immer + comparative means that something keeps growing: immer mehr = more and more. Most people would be "die meisten Leute".
- id: de2-q-1210
  lesson: de2-comparison
  topic: Landscape
  stem: 'Read: "Lukas wohnt in Hamburg, Sara in einem Dorf an der Küste. Saras Dorf hat nur 600 Einwohner. Sara findet das Leben auf dem Land ruhiger, aber Lukas sagt, die Großstadt ist interessanter." Which statement is true?'
  choices: ['Lukas lives on the coast.', 'Sara thinks country life is quieter.', 'Sara lives in a big city.', 'Lukas finds the village more interesting.']
  answer: 1
  explanation: |-
    "Sara findet das Leben auf dem Land ruhiger" means Sara finds life in the country quieter. Sara lives in a village on the coast; Lukas lives in Hamburg and finds the big city more interesting.
- id: de2-q-1211
  lesson: de2-comparison
  topic: Comparison
  stem: 'Complete: "Welcher Supermarkt ist am ___?" (nah)'
  choices: ['nahsten', 'nähesten', 'nächsten', 'nahesten']
  answer: 2
  explanation: |-
    nah is irregular: nah, näher, am nächsten. The superlative has a ch: am nächsten, which also gives the adjective nächste (next, nearest).
- id: de2-q-1212
  lesson: de2-comparison
  topic: Comparison
  stem: 'Which sentence has a mistake?'
  choices: ['Berlin hat mehr Einwohner als Hamburg.', 'Mein Bruder ist älter als ich.', 'Das Dorf ist nicht so laut wie die Stadt.', 'Der Wald ist mehr schön als der Park.']
  answer: 3
  explanation: |-
    German always forms the comparative with -er, even for longer adjectives: schöner, not "mehr schön". mehr is only the comparative of viel: mehr Einwohner.
