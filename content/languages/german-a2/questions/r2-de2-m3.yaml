# German A2, module 3 (Describing things), round 2: new question types for lessons 09–12 and the
# honors lessons 12h1 (de2-m3-h-participles) and 12h2 (de2-m3-h-records).

# --- 09 Adjective endings after ein, kein and mein ---
- id: de2-m3-r2-q01
  lesson: de2-adj-indef
  module_quiz: true
  type: label
  topic: Clothes
  stem: 'Name the numbered clothes.'
  image: {src: images/de2-m3-outfit-blank.svg, alt: 'A person dressed for winter with six numbered items of clothing, from head to feet.'}
  labels:
    - {x: 50.0, y: 13.5, text: die Mütze}
    - {x: 48.4, y: 29.3, text: der Schal}
    - {x: 46.2, y: 47.8, text: die Jacke}
    - {x: 61.9, y: 61.3, text: die Handschuhe}
    - {x: 53.4, y: 71.7, text: die Hose}
    - {x: 46.9, y: 91.3, text: die Stiefel}
  distractors: [der Rock, der Gürtel]
  explanation: |-
    1 die Mütze (the woolly hat with a bobble; a hat with a brim would be der Hut), 2 der Schal (scarf), 3 die Jacke (jacket), 4 die Handschuhe (gloves, literally "hand shoes"), 5 die Hose (trousers, singular in German), 6 die Stiefel (boots). There is no skirt (der Rock) or belt (der Gürtel) in the picture.
- id: de2-m3-r2-q02
  lesson: de2-adj-indef
  type: text
  topic: Adjective endings
  stem: 'Type the adjective with its ending: "Zur Party trägt sie ein ___ Kleid." (rot)'
  accept: [rotes]
  explanation: |-
    das Kleid is neuter, and "ein" doesn't show that, so the adjective takes the -es of "das": ein rotes Kleid. It's the same in the nominative and the accusative (here it's the object of trägt).
- id: de2-m3-r2-q03
  lesson: de2-adj-indef
  type: match
  topic: Adjective endings
  stem: 'Match each phrase to the ending the adjective needs.'
  pairs:
    - ['Ein warm___ Mantel hängt hier. (subject)', '-er']
    - ['Ich kaufe einen warm___ Mantel. (object)', '-en']
    - ['Ich kaufe eine warm___ Jacke.', '-e']
    - ['Ich kaufe ein warm___ Hemd.', '-es']
    - ['Ich gehe mit einem warm___ Schal.', '-en']
  distractors: ['-em']
  explanation: |-
    After ein-words: masculine nominative -er (ein warmer Mantel), masculine accusative -en (einen warmen Mantel), feminine -e (eine warme Jacke), neuter nominative and accusative -es (ein warmes Hemd), and every dative -en (mit einem warmen Schal). -em never follows an ein-word: einem already shows the dative.
- id: de2-m3-r2-q04
  lesson: de2-adj-indef
  module_quiz: true
  topic: Adjective endings
  stem: 'Which phrases are correct? Select all that apply.'
  choices: ['mein alter Mantel', 'eine gestreifte Bluse', 'mit einem roter Schal', 'ein kariertes Hemd', 'keine bequeme Schuhe']
  answer: [0, 1, 3]
  explanation: |-
    "mein alter Mantel" (masculine nominative, -er), "eine gestreifte Bluse" (feminine, -e) and "ein kariertes Hemd" (neuter, -es) are right. After a dative article the ending is always -en: mit einem roten Schal. And in the plural after keine the ending is -en: keine bequemen Schuhe.
- id: de2-m3-r2-q05
  lesson: de2-adj-indef
  type: order
  topic: Clothes
  stem: 'Put the words in order to ask: "Can I try on the blue jacket?"'
  items: [Kann, ich, die, blaue, Jacke, anprobieren?]
  explanation: |-
    Kann ich die blaue Jacke anprobieren? In a yes/no question the modal verb comes first, then the subject, and the infinitive goes to the end. With a modal, anprobieren stays in one piece at the end.

# --- 10 Adjective endings after der, dieser and welcher ---
- id: de2-m3-r2-q06
  lesson: de2-adj-def
  module_quiz: true
  type: label
  topic: Shopping
  stem: 'Name the numbered things in the department store.'
  image: {src: images/de2-m3-kaufhaus-blank.svg, alt: 'A department store in cross-section with three floors and four numbered things: a lift on the left, an escalator, a changing room with a curtain, and a till counter.'}
  labels:
    - {x: 13.9, y: 84.0, text: der Aufzug}
    - {x: 39.7, y: 81.7, text: die Rolltreppe}
    - {x: 33.3, y: 54.9, text: die Umkleidekabine}
    - {x: 81.1, y: 89.8, text: die Kasse}
  distractors: [die Tüte, der Ausgang]
  explanation: |-
    1 der Aufzug (the lift, which goes to every floor), 2 die Rolltreppe (the escalator), 3 die Umkleidekabine (the changing room, with a curtain), 4 die Kasse (the till, where you pay and get your Kassenzettel). A Tüte is a bag, and der Ausgang is the exit.
- id: de2-m3-r2-q07
  lesson: de2-adj-def
  type: text
  topic: Adjective endings
  stem: 'Type the adjective with its ending: "Welchen Pullover nehmen Sie?" – "Den ___, bitte." (blau)'
  accept: [blauen]
  explanation: |-
    The noun (Pullover) is left out, but the ending stays: den blauen (masculine accusative after "den", so -en). "Den blau" without an ending is a common mistake.
- id: de2-m3-r2-q08
  lesson: de2-adj-def
  type: match
  topic: Shopping
  stem: 'Match each verb to the situation.'
  pairs:
    - [umtauschen, You swap the shirt for a bigger size.]
    - [zurückgeben, You bring the shoes back and get your money.]
    - [reklamieren, You complain that the toaster is broken.]
    - [anprobieren, You put the coat on in the changing room.]
  distractors: [You pay at the till.]
  explanation: |-
    umtauschen = to exchange for something else; zurückgeben = to give back (for a refund); reklamieren = to complain about a faulty product; anprobieren = to try on. Paying at the till would be bezahlen.
- id: de2-m3-r2-q09
  lesson: de2-adj-def
  module_quiz: true
  topic: Adjective endings
  stem: 'Which phrases are correct? Select all that apply.'
  choices: ['der neue Rock', 'das schwarze Kleid', 'die neue Schuhe', 'mit dem neuen Aufzug', 'dieser blauer Pullover']
  answer: [0, 1, 3]
  explanation: |-
    After der-words the adjective ends in -e in the five special boxes (der neue Rock, das schwarze Kleid) and -en everywhere else (mit dem neuen Aufzug). In the plural after die it's -en: die neuen Schuhe. And dieser shows masculine nominative itself, so the adjective needs only -e: dieser blaue Pullover.
- id: de2-m3-r2-q10
  lesson: de2-adj-def
  type: text
  topic: Adjective endings
  stem: 'Type the ordinal number with its ending: "Die Damenabteilung ist im ___ Stock." (zweit-)'
  accept: [zweiten]
  explanation: |-
    im = in dem, a dative der-word, so the ordinal takes -en: im zweiten Stock. Ordinal numbers take adjective endings like any other adjective.

# --- 11 Adjectives without an article; food and cooking ---
- id: de2-m3-r2-q11
  lesson: de2-adj-no-article
  module_quiz: true
  type: label
  topic: Food and cooking
  stem: 'Name the numbered kitchen things.'
  image: {src: images/de2-m3-kitchen-blank.svg, alt: 'Six numbered kitchen things on a worktop: a saucepan with a lid, a frying pan, a plate, and a fork, a knife and a spoon standing upright.'}
  labels:
    - {x: 14.3, y: 63.3, text: der Topf}
    - {x: 35.0, y: 71.3, text: die Pfanne}
    - {x: 65.0, y: 73.3, text: der Teller}
    - {x: 77.9, y: 50.0, text: die Gabel}
    - {x: 84.3, y: 35.0, text: das Messer}
    - {x: 90.7, y: 30.7, text: der Löffel}
  distractors: [die Tasse, das Glas]
  explanation: |-
    1 der Topf (saucepan), 2 die Pfanne (frying pan), 3 der Teller (plate), 4 die Gabel (fork), 5 das Messer (knife), 6 der Löffel (spoon). There is no cup (die Tasse) or glass (das Glas) in the picture.
- id: de2-m3-r2-q12
  lesson: de2-adj-no-article
  type: text
  topic: Adjective endings
  stem: 'Type the adjective with its ending: "Sie trinkt Kaffee mit ___ Milch." (warm)'
  accept: [warmer]
  explanation: |-
    mit takes the dative, die Milch is feminine, and there's no article, so the adjective takes the ending of the dative article "der": mit warmer Milch.
- id: de2-m3-r2-q13
  lesson: de2-adj-no-article
  type: match
  topic: Adjective endings
  stem: 'Which table does each adjective follow?'
  pairs:
    - [frischer Fisch, no article]
    - [der frische Fisch, after a der-word]
    - [ein frischer Fisch, after an ein-word]
    - [alle frischen Eier, after a der-word]
    - [zwei frische Eier, no article]
  explanation: |-
    With no article the adjective shows the case itself (frischer Fisch). After der and alle (der-words) it takes -e or -en (der frische Fisch, alle frischen Eier). After ein it takes -er here (ein frischer Fisch). A number like zwei doesn't count as an article, so zwei frische Eier follows the no-article table.
- id: de2-m3-r2-q14
  lesson: de2-adj-no-article
  module_quiz: true
  topic: Adjective endings
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Ich trinke kaltes Wasser.', 'Brot mit frischem Käse ist lecker.', 'Frischen Eier sind teuer.', 'Wir brauchen braunen Zucker.', 'Sie trinkt Tee mit warm Milch.']
  answer: [0, 1, 3]
  explanation: |-
    kaltes Wasser (neuter accusative, -es), mit frischem Käse (masculine dative, -em) and braunen Zucker (masculine accusative, -en) are right. Plural with no article in the nominative takes -e: Frische Eier sind teuer. And with no article the adjective must show the case: mit warmer Milch.
- id: de2-m3-r2-q15
  lesson: de2-adj-no-article
  type: order
  topic: Food and cooking
  stem: 'Put the steps of Grandma''s pancake recipe from the lesson in order.'
  items: ['Mehl, Salz und Zucker in eine Schüssel geben', 'Die Eier und die Milch dazugeben und mischen', 'Den Teig zehn Minuten stehen lassen', 'Öl in der Pfanne heiß machen', 'Die Pfannkuchen auf beiden Seiten braten', 'Mit frischem Obst servieren']
  explanation: |-
    The recipe starts with the dry ingredients in a bowl, adds the eggs and milk, then the batter rests for ten minutes. Only then is the oil heated, the pancakes are fried on both sides, and they're served with fresh fruit (or sugar and cinnamon).

# --- 12 Comparing ---
- id: de2-m3-r2-q16
  lesson: de2-comparison
  module_quiz: true
  type: label
  topic: Landscape
  stem: 'Name the numbered parts of the landscape.'
  image: {src: images/de2-m3-landscape-blank.svg, alt: 'A landscape with six numbered parts: trees on a hill, the hill itself, a meadow with flowers, a river, a striped field, and a farmhouse with a barn. A snowy mountain stands in the background.'}
  labels:
    - {x: 19.1, y: 35.2, text: der Wald}
    - {x: 35.3, y: 46.6, text: der Hügel}
    - {x: 19.1, y: 84.1, text: die Wiese}
    - {x: 54.7, y: 78.4, text: der Fluss}
    - {x: 86.8, y: 89.8, text: das Feld}
    - {x: 86.8, y: 61.4, text: der Bauernhof}
  distractors: [die Küste, das Dorf]
  explanation: |-
    1 der Wald (the trees, a forest), 2 der Hügel (hill), 3 die Wiese (meadow, with flowers), 4 der Fluss (river), 5 das Feld (a ploughed field), 6 der Bauernhof (farm). There's no coast (die Küste) and no village (das Dorf), only one farm.
- id: de2-m3-r2-q17
  lesson: de2-comparison
  type: text
  topic: Comparison
  stem: 'Type the missing word: "Berlin hat ___ Einwohner als Hamburg." (viel)'
  accept: [mehr]
  explanation: |-
    viel is irregular: viel, mehr, am meisten. mehr never takes an ending: mehr Einwohner. "vieler" doesn't exist.
- id: de2-m3-r2-q18
  lesson: de2-comparison
  type: match
  topic: Comparison
  stem: 'Match each adjective to its comparative.'
  pairs:
    - [gut, besser]
    - [hoch, höher]
    - [nah, näher]
    - [alt, älter]
    - [viel, mehr]
  distractors: [guter, hocher]
  explanation: |-
    gut – besser and viel – mehr are irregular. hoch loses its c and adds an umlaut: höher. nah and alt just add an umlaut: näher, älter. "guter" is gut with an adjective ending, not a comparative.
- id: de2-m3-r2-q19
  lesson: de2-comparison
  module_quiz: true
  topic: Comparison
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Das Dorf ist ruhiger als die Stadt.', 'Mein Bruder ist so groß wie ich.', 'Die Stadt ist lauter wie das Dorf.', 'Hier ist der Fluss am breitesten.', 'Das ist der höher Berg.']
  answer: [0, 1, 3]
  explanation: |-
    After a comparative use als (ruhiger als), for equality so … wie (so groß wie), and after a verb the superlative is am …-sten, with an extra e after t (am breitesten). "lauter wie" should be "lauter als", and before a noun the comparative needs an ending, with hoch becoming höher-: der höhere Berg.
- id: de2-m3-r2-q20
  lesson: de2-comparison
  type: text
  topic: Comparison
  stem: 'Type the superlative with its ending: "Die Zugspitze ist der ___ Berg in Deutschland." (hoch)'
  accept: [höchste, hoechste]
  explanation: |-
    hoch is irregular: hoch, höher, am höchsten. Before a noun after "der" (masculine nominative) the superlative takes -e: der höchste Berg.

# --- 12h1 Honors: participles, place names and adjectives as nouns ---
- id: de2-m3-r2-h01
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'Grammar books call the endings of adjectives with no article (frischer Fisch, kaltes Wasser) the …'
  choices: ['weak declension', 'strong declension', 'mixed declension', 'strong verbs']
  answer: 1
  explanation: |-
    With no article the adjective does all the work itself with the endings of der, das, dem: that's the strong declension. Weak endings (-e/-en) come after der-words, and mixed ones after ein-words. Strong verbs are a different idea (fahren, fuhr, gefahren).
- id: de2-m3-r2-h02
  lesson: de2-m3-h-participles
  type: match
  topic: Adjective endings
  stem: 'Which declension does each adjective follow?'
  pairs:
    - [der neue Rock, weak]
    - [ein neuer Rock, mixed]
    - [neuer Wein, strong]
    - [mit meinen neuen Schuhen, mixed]
    - [alle neuen Jacken, weak]
  explanation: |-
    After der-words (der, alle) the declension is weak; after ein-words (ein, meinen) it's mixed; with no article (neuer Wein) it's strong. The ending alone doesn't tell you: neuer is mixed in "ein neuer Rock" and strong in "neuer Wein". Look at the word in front.
- id: de2-m3-r2-h03
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'What does "Vorsicht, kochendes Wasser!" warn you about?'
  choices: ['water that has been boiled and cooled', 'water for cooking', 'water that is boiling right now', 'water that must not be boiled']
  answer: 2
  explanation: |-
    kochend is the present participle of kochen: the water is boiling at this moment. Water that has been boiled is gekochtes Wasser (past participle), and it may be cold by now.
- id: de2-m3-r2-h04
  lesson: de2-m3-h-participles
  type: text
  topic: Adjective endings
  stem: 'Type the present participle with its ending: "Ich höre die ___ Kinder im Garten." (lachen)'
  accept: [lachenden]
  explanation: |-
    The present participle is the infinitive + d: lachend. Before a noun it takes the normal ending; after die in the plural that's -en: die lachenden Kinder (the laughing children).
- id: de2-m3-r2-h05
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'How do you say "The soup is boiling"?'
  choices: ['Die Suppe kocht.', 'Die Suppe ist kochend.', 'Die Suppe ist kochen.', 'Die Suppe ist gekocht.']
  answer: 0
  explanation: |-
    German has no "is …-ing" form: use the plain present tense, Die Suppe kocht. The present participle (kochend) mostly stands before a noun: die kochende Suppe. "Die Suppe ist gekocht" means it has been cooked.
- id: de2-m3-r2-h06
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'A café menu: "Frisch ___ Orangensaft" (gepresst). Which form is right?'
  choices: ['gepresst', 'gepresste', 'gepressten', 'gepresster']
  answer: 3
  explanation: |-
    der Saft is masculine, the menu item is nominative and there's no article, so the participle takes the strong ending -er: frisch gepresster Orangensaft. frisch is an adverb describing gepresst, so it has no ending.
- id: de2-m3-r2-h07
  lesson: de2-m3-h-participles
  type: text
  topic: Adjective endings
  stem: 'Type the adjective made from "die Schweiz": "Ich esse gern Brot mit ___ Käse." (Swiss)'
  accept: [Schweizer]
  explanation: |-
    The place-name adjective is Schweizer: capital letter, and no ending in any case: mit Schweizer Käse. "Schweizerem" is a common mistake. (The normal adjective schweizerisch would take an ending: mit schweizerischem Käse.)
- id: de2-m3-r2-h08
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'Which phrases are correct? Select all that apply.'
  choices: ['der Kölner Dom', 'mit Wienerem Schnitzel', 'in der Berliner U-Bahn', 'ein schweizerischer Käse', 'die Frankfurtern Würstchen']
  answer: [0, 2, 3]
  explanation: |-
    Place-name adjectives in -er never change: der Kölner Dom, in der Berliner U-Bahn, mit Wiener Schnitzel, die Frankfurter Würstchen. schweizerisch is an ordinary adjective, so it takes the normal ending: ein schweizerischer Käse.
- id: de2-m3-r2-h09
  lesson: de2-m3-h-participles
  topic: Adjectival nouns
  stem: 'John F. Kennedy said "Ich bin ein Berliner" in 1963. What is true?'
  choices: ['It meant "I am a doughnut", and Berliners laughed at him.', 'It was correct German, and his audience understood what he meant.', 'He should have said "Ich bin ein Berlin".', 'In Berlin, a Berliner is the usual word for a doughnut.']
  answer: 1
  explanation: |-
    The doughnut story is a popular myth: the sentence is correct German for "I am a Berliner" (here in a figurative sense), and the crowd understood it that way. In Berlin itself a doughnut is usually called a Pfannkuchen, not a Berliner.
- id: de2-m3-r2-h10
  lesson: de2-m3-h-participles
  topic: Adjectival nouns
  stem: 'At the museum desk: "Zwei ___ und ein Kind, bitte."'
  choices: ['Erwachsener', 'Erwachsenen', 'Erwachsene', 'Erwachsenes']
  answer: 2
  explanation: |-
    Erwachsene is an adjectival noun. After a number there's no article, so it takes the strong plural ending -e: zwei Erwachsene. "Erwachsenen" is right after die or in the dative (mit zwei Erwachsenen).
- id: de2-m3-r2-h11
  lesson: de2-m3-h-participles
  type: text
  topic: Adjectival nouns
  stem: 'Type the noun with its ending: "Mein Nachbar kommt aus Hamburg. Er ist ein ___." (German, a man)'
  accept: [Deutscher]
  explanation: |-
    der Deutsche is an adjectival noun, so after ein (masculine nominative) it takes the mixed ending -er: ein Deutscher. A German woman is eine Deutsche.
- id: de2-m3-r2-h12
  lesson: de2-m3-h-participles
  topic: Adjectival nouns
  stem: 'Which sentence has a mistake?'
  choices: ['Zwei Deutsche wohnen hier.', 'Zwei Österreicher wohnen hier.', 'Meine Verwandten wohnen hier.', 'Zwei Erwachsenen wohnen hier.']
  answer: 3
  explanation: |-
    After a number an adjectival noun takes the strong ending -e in the nominative: zwei Erwachsene (like zwei Deutsche). Meine Verwandten is right: after a possessive in the plural, -en. Österreicher is an ordinary noun, so zwei Österreicher has no ending.
- id: de2-m3-r2-h13
  lesson: de2-m3-h-participles
  topic: Adjectival nouns
  stem: 'Read the sign. What is free?'
  image: {src: images/de2-m3-market-board.svg, alt: 'A market stall sign for Marktstand Huber listing orange juice, potato soup, stuffed peppers, sausages and Swiss cheese with prices, then coffee for adults, cocoa for children, and the Saturday opening hours.'}
  choices: ['coffee for adults', 'cocoa for children', 'Swiss cheese', 'orange juice']
  answer: 1
  explanation: |-
    "Kakao für Kinder gratis": cocoa is free for children. Coffee for adults (Kaffee für Erwachsene) costs 2,00 €, and the orange juice and cheese have prices too.
- id: de2-m3-r2-h14
  lesson: de2-m3-h-participles
  topic: Adjective endings
  stem: 'On the same sign: "Gefüllte Paprika mit Reis". Why does gefüllt end in -e?'
  image: {src: images/de2-m3-market-board.svg, alt: 'A market stall sign for Marktstand Huber listing orange juice, potato soup, stuffed peppers, sausages and Swiss cheese with prices, then coffee for adults, cocoa for children, and the Saturday opening hours.'}
  choices: ['Paprika is masculine and accusative.', 'All participles end in -e.', 'Paprika is feminine, nominative, with no article.', 'It follows a der-word.']
  answer: 2
  explanation: |-
    die Paprika is feminine. The menu item stands alone (nominative) with no article, so the participle takes the strong ending of "die": -e. Participles don't have a fixed ending; they take whatever ending an adjective would take there.

# --- 12h2 Honors: comparing the German-speaking countries ---
- id: de2-m3-r2-h15
  lesson: de2-m3-h-records
  topic: Comparison
  stem: 'How do you say "Switzerland is much smaller than Germany"?'
  choices: ['Die Schweiz ist sehr kleiner als Deutschland.', 'Die Schweiz ist viel kleiner als Deutschland.', 'Die Schweiz ist viel kleiner wie Deutschland.', 'Die Schweiz ist mehr klein als Deutschland.']
  answer: 1
  explanation: |-
    With a comparative, "much" is viel: viel kleiner als. sehr only goes with the plain adjective (sehr klein), the comparative is followed by als, not wie, and German never uses mehr + adjective for a comparative.
- id: de2-m3-r2-h16
  lesson: de2-m3-h-records
  type: text
  topic: Comparison
  stem: 'Austria is about 83,900 km², Switzerland about 41,300 km². Complete: "Österreich ist ungefähr ___ so groß wie die Schweiz."'
  accept: [doppelt, zweimal]
  explanation: |-
    83,900 ÷ 41,300 ≈ 2, so Austria is about twice as big: doppelt (or zweimal) so groß wie die Schweiz.
- id: de2-m3-r2-h17
  lesson: de2-m3-h-records
  topic: Comparison
  stem: '"Der Großglockner ist hoch, aber die Dufourspitze ist noch höher." What does "noch höher" mean?'
  choices: ['not as high', 'still not high', 'just as high', 'even higher']
  answer: 3
  explanation: |-
    noch + comparative means "even …" or "… still": noch höher = even higher. It suggests that the first mountain is already high.
- id: de2-m3-r2-h18
  lesson: de2-m3-h-records
  type: match
  topic: Comparison
  stem: 'Match the German to the English.'
  pairs:
    - [doppelt so groß wie, twice as big as]
    - [halb so groß wie, half as big as]
    - [die zweitgrößte Stadt, the second-biggest city]
    - [mit Abstand der größte, by far the biggest]
    - [mindestens, at least]
  distractors: [at most]
  explanation: |-
    doppelt so … wie = twice as … as; halb so … wie = half as … as; zweit- + superlative = second-…; mit Abstand = by far; mindestens = at least. "At most" would be höchstens.
- id: de2-m3-r2-h19
  lesson: de2-m3-h-records
  type: text
  topic: Comparison
  stem: 'Type the superlative with its ending: "Der Bodensee ist einer der ___ Seen in Mitteleuropa." (groß)'
  accept: [größten, groessten]
  explanation: |-
    In "one of the …" the noun is plural and the superlative after der ends in -en: einer der größten Seen. einer is masculine because der See is masculine.
- id: de2-m3-r2-h20
  lesson: de2-m3-h-records
  topic: Comparison
  stem: 'How do you say "one of the highest mountains"?'
  choices: ['einer der höchsten Berge', 'eine der höchsten Berge', 'einer der höchste Berg', 'einer der höheren Berge']
  answer: 0
  explanation: |-
    der Berg is masculine, so "one" is einer; the noun is plural (Berge) and the superlative ends in -en: einer der höchsten Berge. "eine" would be for a feminine noun (eine der größten Städte), and "höheren" is the comparative.
- id: de2-m3-r2-h21
  lesson: de2-m3-h-records
  type: order
  topic: Landscape
  stem: 'Put the mountains in order from the lowest to the highest.'
  items: [Zugspitze, Großglockner, Dufourspitze]
  explanation: |-
    Zugspitze (Germany) 2,962 m, Großglockner (Austria) 3,798 m, Dufourspitze (Switzerland) 4,634 m. Germany is the biggest of the three countries, but it has the lowest highest mountain.
- id: de2-m3-r2-h22
  lesson: de2-m3-h-records
  topic: Landscape
  stem: 'Which statements are true, according to the lesson? Select all that apply.'
  choices: ['Deutschland hat ungefähr neunmal so viele Einwohner wie Österreich.', 'Die Schweiz ist größer als Österreich.', 'Österreich hat etwas mehr Einwohner als die Schweiz.', 'Die Zugspitze ist höher als der Großglockner.', 'Berlin ist mit Abstand die größte Stadt Deutschlands.']
  answer: [0, 2, 4]
  explanation: |-
    Germany has about 83 million people against Austria's 9.2 million (about nine times as many); Austria (9.2 million) has slightly more than Switzerland (9.1 million); and Berlin is by far Germany's biggest city. But Switzerland is only about half the size of Austria, and the Zugspitze (2,962 m) is lower than the Großglockner (3,798 m).
- id: de2-m3-r2-h23
  lesson: de2-m3-h-records
  topic: Landscape
  stem: 'What is special about Bern?'
  choices: ['It is the biggest city in Switzerland.', 'It is officially called the "Bundesstadt": Switzerland has no official capital.', 'It is the capital of Austria.', 'It lies on Lake Constance.']
  answer: 1
  explanation: |-
    Bern is the seat of the Swiss government and parliament, but officially it's the Bundesstadt (federal city); Switzerland has no official capital. The biggest Swiss city is Zürich, Austria's capital is Wien, and Bern isn't on Lake Constance.
- id: de2-m3-r2-h24
  lesson: de2-m3-h-records
  topic: Landscape
  stem: 'Lake Constance (der Bodensee) is shared by three countries. Which is the largest lake lying entirely inside Germany?'
  choices: ['der Genfersee', 'der Bodensee', 'die Nordsee', 'die Müritz']
  answer: 3
  explanation: |-
    The Müritz in Mecklenburg is the largest lake entirely inside Germany. The Bodensee is far bigger but shared with Austria and Switzerland, the Genfersee (Lake Geneva) lies in Switzerland and France, and the Nordsee is a sea.
- id: de2-m3-r2-h25
  lesson: de2-m3-h-records
  topic: Comparison
  stem: 'Complete: "___ Schweizer sprechen Deutsch." (Most Swiss people speak German.)'
  choices: ['Am meisten', 'Die meisten', 'Die mehr', 'Meistens']
  answer: 1
  explanation: |-
    Before a noun, "most" is die meisten: die meisten Schweizer. am meisten goes after a verb (Wer hat am meisten gegessen?), and meistens means "usually, mostly".
- id: de2-m3-r2-h26
  lesson: de2-m3-h-records
  type: text
  topic: Comparison
  stem: 'The Großglockner is 3,798 m high and the Zugspitze 2,962 m. Complete: "Der Großglockner ist um ___ Meter höher als die Zugspitze." Give only the number.'
  accept: ['836']
  explanation: |-
    3,798 − 2,962 = 836, so: um 836 Meter höher. um + amount gives the exact difference.
- id: de2-m3-r2-h27
  lesson: de2-m3-h-records
  topic: Comparison
  stem: 'Which sentence has a mistake?'
  choices: ['Wien ist die zweitgrößte Stadt im deutschsprachigen Raum.', 'Wir fahren so früh wie möglich los.', 'Der Rhein ist sehr länger als der Main.', 'Die Fahrt dauert mindestens drei Stunden.']
  answer: 2
  explanation: |-
    sehr can't go with a comparative: it must be viel länger. The other sentences are correct: zweitgrößte is one word, so … wie möglich means "as … as possible", and mindestens means "at least".
- id: de2-m3-r2-h28
  lesson: de2-m3-h-records
  topic: Comparison
  stem: 'Complete: "Hamburg hat nicht so ___ Einwohner wie Berlin."'
  choices: ['viel', 'mehr', 'viele', 'meisten']
  answer: 2
  explanation: |-
    Einwohner are things you count, so use viele: nicht so viele Einwohner wie Berlin. viel is for amounts you don't count (so viel Zeit), and mehr belongs with als (mehr Einwohner als).
