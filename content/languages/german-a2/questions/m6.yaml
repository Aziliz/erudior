# German A2, module 6: Media, celebrations and the A2 exam (lessons 21–24)

# --- 21 Media, technology and relative clauses ---
- id: de2-q-2101
  lesson: de2-media-relative
  module_quiz: true
  topic: Relative clauses
  stem: 'Complete: "Das ist der Kollege, ___ unsere Webseite macht."'
  choices: ['der', 'den', 'die', 'dem']
  answer: 0
  explanation: |-
    Kollege is masculine, and inside the relative clause he is the subject (he makes the website), so the nominative "der" is right. "den" would be correct only if he were the object, as in "den ich kenne".
- id: de2-q-2102
  lesson: de2-media-relative
  module_quiz: true
  topic: Relative clauses
  stem: 'Complete: "Der Laptop, ___ ich gekauft habe, war nicht teuer."'
  choices: ['der', 'die', 'den', 'das']
  answer: 2
  explanation: |-
    Laptop is masculine, and in the relative clause "ich" is the subject: I bought the laptop, so the laptop is the direct object and takes the accusative "den". "der" is the tempting choice if you take the case from "Der Laptop" at the start of the sentence, but case comes from inside the relative clause.
- id: de2-q-2103
  lesson: de2-media-relative
  topic: Relative clauses
  stem: 'Complete: "Wo sind die Fotos, ___ wir im Urlaub gemacht haben?"'
  choices: ['den', 'das', 'der', 'die']
  answer: 3
  explanation: |-
    Fotos is plural, and the plural relative pronoun is "die" in both nominative and accusative. "das" agrees with the singular "das Foto", but here the antecedent is plural.
- id: de2-q-2104
  lesson: de2-media-relative
  topic: Relative clauses
  stem: 'Which sentence is correct?'
  choices: ['Die Sendung, die um acht Uhr anfängt, ist sehr gut.', 'Die Sendung, die fängt um acht Uhr an, ist sehr gut.', 'Die Sendung, die um acht Uhr fängt an, ist sehr gut.', 'Die Sendung die um acht Uhr anfängt ist sehr gut.']
  answer: 0
  explanation: |-
    A relative clause sends the verb to the end, and a separable verb joins up again there: "die um acht Uhr anfängt". The relative clause also needs a comma on both sides. The second choice keeps main-clause order; the third splits the verb; the fourth has no commas.
- id: de2-q-2105
  lesson: de2-media-relative
  module_quiz: true
  topic: Relative clauses
  stem: 'Complete: "Kennst du die Frau, ___ das Video hochgeladen hat?"'
  choices: ['das', 'die', 'den', 'der']
  answer: 1
  explanation: |-
    The relative pronoun agrees with the antecedent "die Frau" (feminine), and the woman is the subject of the relative clause, so "die". "das" is the tempting mistake of agreeing with "das Video", which is only the object inside the clause.
- id: de2-q-2106
  lesson: de2-media-relative
  topic: Relative clauses
  stem: 'Complete: "Das ist der Freund, mit ___ ich das Programm installiert habe."'
  choices: ['der', 'den', 'dem', 'denen']
  answer: 2
  explanation: |-
    "mit" always takes the dative, and Freund is masculine, so the relative pronoun is "dem". The preposition comes first, before the relative pronoun. "den" is accusative; "denen" is the dative plural.
- id: de2-q-2107
  lesson: de2-media-relative
  topic: Relative clauses
  stem: 'Complete: "Das ist alles, ___ ich über das Programm weiß."'
  choices: ['das', 'der', 'wer', 'was']
  answer: 3
  explanation: |-
    After alles, etwas and nichts German uses "was" as the relative pronoun: "alles, was ich weiß". "das" follows a neuter noun, but "alles" is not a noun; "wer" asks about people.
- id: de2-q-2108
  lesson: de2-media-relative
  topic: Media and technology
  stem: 'What does "Ich lade die App herunter" mean?'
  choices: ['I''m uploading the app.', 'I''m deleting the app.', 'I''m downloading the app.', 'I''m saving the app.']
  answer: 2
  explanation: |-
    "herunterladen" (separable: ich lade … herunter) means to download. To upload is "hochladen", to delete "löschen", to save "speichern".
- id: de2-q-2109
  lesson: de2-media-relative
  topic: Media and technology
  stem: 'Which word completes the sentence? "Ich habe mein ___ vergessen und kann mich nicht einloggen."'
  choices: ['Passwort', 'Bildschirm', 'Kommentar', 'Radio']
  answer: 0
  explanation: |-
    You need a password to log in: "Ich habe mein Passwort vergessen" means I've forgotten my password. "mein" also fits only a masculine or neuter noun, but a screen, a comment or a radio make no sense here.
- id: de2-q-2110
  lesson: de2-media-relative
  topic: Reading
  stem: 'Read: "Morgens höre ich im Auto Radio. Eine Zeitung kaufe ich nicht mehr; die Artikel, die mich interessieren, lese ich online. Die Sendungen, die ich mag, kommen sehr spät, deshalb nehme ich sie auf." How does the writer watch the late programmes?'
  choices: ['Live, late at night.', 'In the car, on the radio.', 'In the newspaper.', 'Later, because the writer records them.']
  answer: 3
  explanation: |-
    "deshalb nehme ich sie auf" means "so I record them": "aufnehmen" is to record. The radio in the car is for the mornings, and the writer no longer buys a newspaper.
- id: de2-q-2111
  lesson: de2-media-relative
  topic: Relative clauses
  stem: 'Find the mistake: "Ich kenne einen Mann, den in Wien wohnt und Videos macht."'
  choices: ['"einen" should be "ein".', '"den" should be "der".', '"wohnt" should be at the start of the clause.', 'There should be no comma before "den".']
  answer: 1
  explanation: |-
    The man is the one who lives in Vienna, so inside the relative clause he is the subject and the pronoun is nominative "der". "einen" is correct in the main clause (Ich kenne einen Mann), but its case doesn't carry over into the relative clause.
- id: de2-q-2112
  lesson: de2-media-relative
  module_quiz: true
  topic: Relative clauses
  stem: 'Which is the best way to join: "Ich habe eine App. Ich benutze die App jeden Tag."'
  choices: ['Ich habe eine App, die benutze ich jeden Tag.', 'Ich habe eine App, die ich jeden Tag benutze.', 'Ich habe eine App, was ich jeden Tag benutze.', 'Ich habe eine App, ich jeden Tag benutze.']
  answer: 1
  explanation: |-
    "die App" is feminine and the object of "benutze", so the relative pronoun is "die" (feminine accusative = nominative), and the verb goes to the end. The first choice keeps main-clause order, "was" can't follow a noun in correct German, and the last drops the relative pronoun as English does.

# --- 22 Holidays and celebrations ---
- id: de2-q-2201
  lesson: de2-celebrations
  module_quiz: true
  topic: Dative
  stem: 'Complete: "Ich gratuliere ___ zum Geburtstag!"'
  choices: ['dich', 'dir', 'du', 'dein']
  answer: 1
  explanation: |-
    gratulieren takes a dative object: "Ich gratuliere dir". "dich" is the accusative, the most common mistake, because English "congratulate you" has a direct object.
- id: de2-q-2202
  lesson: de2-celebrations
  topic: Dative
  stem: 'Complete: "Wir laden ___ herzlich zu unserer Feier ein."'
  choices: ['euch', 'ihnen', 'dir', 'deinem']
  answer: 0
  explanation: |-
    einladen takes an accusative object (the guest), and "euch" is the accusative of "ihr". "dir" is dative, which is right after gratulieren but not after einladen. "ihnen" (small i) means them, in the dative.
- id: de2-q-2203
  lesson: de2-celebrations
  module_quiz: true
  topic: Dates
  stem: 'How do you say "on 24 December" aloud?'
  choices: ['am vierundzwanzig Dezember', 'am vierundzwanzigste Dezember', 'im vierundzwanzigsten Dezember', 'am vierundzwanzigsten Dezember']
  answer: 3
  explanation: |-
    Dates use ordinal numbers. From 20 the ordinal ends in -ste, and after "am" it takes the ending -en: "am vierundzwanzigsten". The cardinal "vierundzwanzig" and the ending -e are wrong after am; "im" is for months, not days.
- id: de2-q-2204
  lesson: de2-celebrations
  topic: Dates
  stem: 'Which ordinal is spelled correctly?'
  choices: ['der siebente', 'der dreite', 'der siebte', 'der einste']
  answer: 2
  explanation: |-
    The irregular ordinals are erste, dritte, siebte and achte. "dreite" and "einste" don't exist; "siebente" is an old-fashioned variant you may see, but the standard form today is "siebte".
- id: de2-q-2205
  lesson: de2-celebrations
  topic: Pronouns
  stem: 'Complete: "Hast du schon einen Weihnachtsbaum?" – "Ja, wir haben gestern ___ gekauft."'
  choices: ['einen', 'ein', 'eins', 'eine']
  answer: 0
  explanation: |-
    The pronoun replaces "einen Weihnachtsbaum" (masculine, accusative object), so it is "einen". "ein" is the article without its ending, and "eins" is the neuter pronoun.
- id: de2-q-2206
  lesson: de2-celebrations
  topic: Pronouns
  stem: 'Complete: "Ist das dein Glas?" – "Nein, das ist nicht ___."'
  choices: ['mein', 'meins', 'meiner', 'meine']
  answer: 1
  explanation: |-
    Standing alone for "das Glas" (neuter), the possessive needs the neuter ending: "meins". "mein" is the article form used before a noun ("mein Glas"); "meiner" would replace a masculine noun.
- id: de2-q-2207
  lesson: de2-celebrations
  module_quiz: true
  topic: Celebrations
  stem: 'It is 30 December. You say goodbye to a colleague until next year. What do you say?'
  choices: ['Frohe Weihnachten!', 'Frohe Ostern!', 'Guten Rutsch!', 'Gute Besserung!']
  answer: 2
  explanation: |-
    "Guten Rutsch!" is the wish for the change to the new year, said before 1 January. On 30 December it's too late for Frohe Weihnachten, Ostern is in spring, and Gute Besserung is for someone who is ill.
- id: de2-q-2208
  lesson: de2-celebrations
  topic: Conjunctions
  stem: 'Complete: "___ ich ein Kind war, haben wir jedes Jahr bei meiner Oma gefeiert."'
  choices: ['Wenn', 'Wann', 'Ob', 'Als']
  answer: 3
  explanation: |-
    One period in the past (when I was a child) takes "als". "wenn" is for repeated events or the present and future; "wann" is a question word; "ob" means whether.
- id: de2-q-2209
  lesson: de2-celebrations
  topic: Celebrations
  stem: 'What do people in the Rhineland usually do at Karneval?'
  choices: ['They dress up in costumes and watch parades.', 'They light Advent candles.', 'They paint eggs for the children.', 'They let off fireworks at midnight.']
  answer: 0
  explanation: |-
    At Karneval (Fasching in Bavaria and Austria) people "verkleiden sich": they dress up in costumes, and there are parades. Advent candles belong to December, painted eggs to Easter, and midnight fireworks to Silvester.
- id: de2-q-2210
  lesson: de2-celebrations
  topic: Reading
  stem: 'Read: "Am Samstag, dem 31. Dezember, feiern wir Silvester bei uns. Wir fangen um 20 Uhr mit einem Buffet an. Wer möchte, kann gern ein Kostüm tragen. Könnt ihr mir bis zum 20. Bescheid sagen?" What must the guests do?'
  choices: ['Bring food for the buffet.', 'Wear a costume.', 'Let the host know by the 20th.', 'Arrive before 8 pm.']
  answer: 2
  explanation: |-
    "Könnt ihr mir bis zum 20. Bescheid sagen?" asks the guests to let the host know by the 20th. A costume is optional ("Wer möchte, kann …"), and the buffet is provided by the hosts.
- id: de2-q-2211
  lesson: de2-celebrations
  topic: Dative
  stem: 'Find the mistake: "Wir wünschen Sie und Ihre Familie frohe Weihnachten."'
  choices: ['"wünschen" should be "wünscht".', '"frohe" should be "froh".', '"Weihnachten" needs the article "die".', '"Sie und Ihre Familie" should be "Ihnen und Ihrer Familie".']
  answer: 3
  explanation: |-
    wünschen takes a dative person and an accusative thing: you wish something TO someone. So the people must be dative: "Ihnen und Ihrer Familie". "frohe Weihnachten" is correct with no article.
- id: de2-q-2212
  lesson: de2-celebrations
  module_quiz: true
  topic: Celebrations
  stem: 'In Germany, when are Christmas presents usually opened?'
  choices: ['On the morning of 25 December.', 'On the evening of 24 December (Heiligabend).', 'On 6 January.', 'On New Year''s Eve.']
  answer: 1
  explanation: |-
    In Germany the presents are given on Heiligabend, the evening of 24 December. The morning of the 25th is the British and American custom.

# --- 23 Writing SMS and e-mails ---
- id: de2-q-2301
  lesson: de2-writing
  module_quiz: true
  topic: Register
  stem: 'You write to your course teacher, Ms Brandt, whom you call "Sie". Which opening and closing fit best?'
  choices: ['Hallo Anna, … LG', 'Liebe Frau Brandt, … Viele Grüße', 'Lieber Frau Brandt, … Mit freundlichen Grüßen', 'Sehr geehrte Damen und Herren, … Bis bald!']
  answer: 1
  explanation: |-
    This is semi-formal: you know her but say Sie, so "Liebe Frau Brandt" with "Viele Grüße" is ideal. "Lieber" is for a man; "Sehr geehrte Damen und Herren" is for an unknown reader and doesn't match "Bis bald".
- id: de2-q-2302
  lesson: de2-writing
  topic: Register
  stem: 'Complete the formal opening: "Sehr ___ Herr Wagner,"'
  choices: ['geehrte', 'geehrt', 'geehrter', 'geehrten']
  answer: 2
  explanation: |-
    For a man the opening is "Sehr geehrter Herr …"; for a woman "Sehr geehrte Frau …". The ending -er shows the masculine, just like "Lieber Tom".
- id: de2-q-2303
  lesson: de2-writing
  topic: Writing messages
  stem: 'Which sentence is correct?'
  choices: ['Es tut mir leid, dass ich habe nicht geantwortet.', 'Es tut mir leid, dass ich nicht habe geantwortet.', 'Es tut mir leid, dass ich geantwortet nicht habe.', 'Es tut mir leid, dass ich nicht geantwortet habe.']
  answer: 3
  explanation: |-
    After "dass" the conjugated verb goes to the end, after the participle: "dass ich nicht geantwortet habe". The first choice keeps main-clause order, the most common error.
- id: de2-q-2304
  lesson: de2-writing
  module_quiz: true
  topic: Linking
  stem: 'Complete: "Mein Auto ist kaputt. ___ komme ich heute mit dem Bus."'
  choices: ['Deshalb', 'Weil', 'Trotzdem', 'Denn']
  answer: 0
  explanation: |-
    The second sentence is the consequence of the first, so "deshalb" (that's why), followed directly by the verb. "Weil" would send the verb to the end, "Denn" needs normal order, and "Trotzdem" means "nevertheless", which doesn't fit.
- id: de2-q-2305
  lesson: de2-writing
  topic: Writing messages
  stem: 'Complete: "Entschuldigung, ich ___ mich ein bisschen. Ich bin in zehn Minuten da."'
  choices: ['verspäte', 'verspätet', 'spät', 'verschiebe']
  answer: 0
  explanation: |-
    "sich verspäten" means to be late, and it is reflexive: "ich verspäte mich". "verschieben" means to postpone something, not to be late, and "spät" is an adjective.
- id: de2-q-2306
  lesson: de2-writing
  topic: Writing messages
  stem: 'What does "Können wir den Termin auf Donnerstag verschieben?" ask?'
  choices: ['Can we cancel the appointment?', 'Can we confirm the appointment for Thursday?', 'Can we move the appointment to Thursday?', 'Was the appointment on Thursday?']
  answer: 2
  explanation: |-
    "verschieben" means to postpone or move, and "auf Donnerstag" gives the new day. To cancel is "absagen", to confirm "bestätigen".
- id: de2-q-2307
  lesson: de2-writing
  module_quiz: true
  topic: Writing messages
  stem: 'Your friend writes: "Sag mir Bescheid, wenn du angekommen bist." What should you do?'
  choices: ['Pick him up when he arrives.', 'Tell him what you said.', 'Ask him for the address.', 'Let him know when you have arrived.']
  answer: 3
  explanation: |-
    "Bescheid sagen" means to let someone know. "wenn du angekommen bist" means when you have arrived. So he wants a message from you when you get there.
- id: de2-q-2308
  lesson: de2-writing
  topic: Writing messages
  stem: 'In an e-mail, what is "der Anhang"?'
  choices: ['The subject line', 'The attachment', 'The signature', 'The reply']
  answer: 1
  explanation: |-
    "der Anhang" is the attachment: "Im Anhang finden Sie …" means "Please find … attached". The subject line is "der Betreff", and a reply or feedback is "die Rückmeldung".
- id: de2-q-2309
  lesson: de2-writing
  topic: Register
  stem: 'Find the mistake: "Liebe Frau Brandt, kannst du mir bitte die Aufgaben schicken? Viele Grüße, Sofia"'
  choices: ['"Liebe" should be "Lieber".', '"kannst du" should be "können Sie".', '"Viele Grüße" is too informal for a teacher.', '"kannst" should start with a capital letter.']
  answer: 1
  explanation: |-
    With "Frau Brandt" you use Sie, so the request must be "können Sie". Mixing a Sie-opening with du is a typical register mistake. "Liebe" is right for a woman, "Viele Grüße" is fine in a semi-formal e-mail, and after the opening comma the next word starts small.
- id: de2-q-2310
  lesson: de2-writing
  topic: Reading
  stem: 'Read: "Hallo Mia, es tut mir leid, ich verspäte mich um 20 Minuten, weil mein Bus nicht kommt. Kaufst du die Karten? Ich gebe dir das Geld nachher. Bis gleich! Tom" Why is Tom late?'
  choices: ['He forgot the tickets.', 'He has no money.', 'He has to work.', 'His bus isn''t coming.']
  answer: 3
  explanation: |-
    "weil mein Bus nicht kommt" gives the reason: his bus isn't coming. He asks Mia to buy the tickets and will give her the money afterwards ("nachher").
- id: de2-q-2311
  lesson: de2-writing
  topic: Writing messages
  stem: 'Which sentence accepts an invitation?'
  choices: ['Leider muss ich absagen.', 'Können wir die Feier verschieben?', 'Ich sage gern zu und bringe einen Salat mit.', 'Ich habe die Einladung weitergeleitet.']
  answer: 2
  explanation: |-
    "zusagen" is to accept, the opposite of "absagen" (to decline or cancel). The other sentences cancel, ask to postpone, or say you forwarded the invitation.
- id: de2-q-2312
  lesson: de2-writing
  topic: Writing messages
  stem: 'Complete: "Bitte antworten Sie ___ bald, die Sache ist dringend."'
  choices: ['möglichst', 'möglich', 'rechtzeitig', 'inzwischen']
  answer: 0
  explanation: |-
    "möglichst bald" means "as soon as possible". "möglich" alone is the adjective "possible" and doesn't work before "bald"; "inzwischen" means meanwhile.

# --- 24 The Goethe-Zertifikat A2 and review ---
- id: de2-q-2401
  lesson: de2-exam-review
  module_quiz: true
  topic: A2 exam
  stem: 'How many points do you need to pass the Goethe-Zertifikat A2?'
  choices: ['50 overall', '60 overall, with at least 45 written and 15 speaking', '60 overall, no other minimum', '75 overall']
  answer: 1
  explanation: |-
    You need 60 of 100 points, and also at least 45 of the 75 written points and 15 of the 25 speaking points. A good written score can't make up for a very weak speaking result.
- id: de2-q-2402
  lesson: de2-exam-review
  topic: A2 exam
  stem: 'What do you write in the Schreiben part of the Goethe A2?'
  choices: ['A form and a short letter', 'One long essay of 150 words', 'An informal SMS (20–30 words) and a semi-formal e-mail (30–40 words)', 'Answers to listening questions']
  answer: 2
  explanation: |-
    Schreiben has two tasks: an informal SMS of 20–30 words and a semi-formal e-mail of 30–40 words, each covering three content points. The form belongs to the A1 exam.
- id: de2-q-2403
  lesson: de2-exam-review
  topic: A2 exam
  stem: 'Which is NOT one of the speaking tasks in the Goethe A2?'
  choices: ['Asking and answering questions with word cards', 'Talking about your own life', 'Planning an appointment with your partner', 'Giving a prepared ten-minute presentation']
  answer: 3
  explanation: |-
    There is no preparation time and no presentation at A2. The three tasks are questions with word cards, talking about your life, and planning something together.
- id: de2-q-2404
  lesson: de2-exam-review
  module_quiz: true
  topic: Exam strategies
  stem: 'In the planning task your partner suggests: "Wie wäre es mit Samstag um zehn?" You have a dentist''s appointment then. What is a good reply?'
  choices: ['Da kann ich leider nicht, da bin ich beim Zahnarzt. Geht es auch am Nachmittag?', 'Nein.', 'Samstag ist ein Tag.', 'Ja, gern, um zehn passt es mir gut.']
  answer: 0
  explanation: |-
    A good reply refuses politely, gives a reason and makes a new suggestion, so the conversation keeps going. A bare "Nein" ends it, and accepting would contradict your calendar.
- id: de2-q-2405
  lesson: de2-exam-review
  topic: Review
  stem: 'Complete: "Ich kann heute nicht kommen, weil ich ___."'
  choices: ['muss arbeiten', 'arbeiten muss', 'arbeite muss', 'muss arbeite']
  answer: 1
  explanation: |-
    After "weil" the conjugated verb goes to the very end, after the infinitive: "weil ich arbeiten muss" (lesson 3). "muss arbeiten" is main-clause order.
- id: de2-q-2406
  lesson: de2-exam-review
  topic: Review
  stem: 'Complete: "Ich habe einen ___ Laptop gekauft."'
  choices: ['neue', 'neuen', 'neues', 'neuer']
  answer: 1
  explanation: |-
    Laptop is masculine and the accusative object; after "einen" the adjective takes -en: "einen neuen Laptop" (lesson 9). "neuer" is the nominative after "ein", as in "Das ist ein neuer Laptop".
- id: de2-q-2407
  lesson: de2-exam-review
  topic: Review
  stem: 'Complete: "Wohin legst du das Buch?" – "Ich lege es auf ___ Tisch."'
  choices: ['dem', 'der', 'den', 'das']
  answer: 2
  explanation: |-
    "Wohin?" asks about a movement to a place, so the two-way preposition "auf" takes the accusative: "auf den Tisch" (lesson 13). "auf dem Tisch" answers "Wo?" (where something is).
- id: de2-q-2408
  lesson: de2-exam-review
  topic: Review
  stem: 'Which sentence is a polite request?'
  choices: ['Sie geben mir das Formular.', 'Geben Sie das Formular!', 'Ich will das Formular.', 'Könnten Sie mir bitte das Formular geben?']
  answer: 3
  explanation: |-
    "Könnten Sie …?" is the Konjunktiv II (lesson 15), the most polite way to ask. "Ich will" sounds demanding, and a statement or bare imperative is not polite.
- id: de2-q-2409
  lesson: de2-exam-review
  topic: Review
  stem: 'Complete: "Berlin ist ___ als München."'
  choices: ['größer', 'großer', 'am größten', 'mehr groß']
  answer: 0
  explanation: |-
    The comparative of "groß" adds an umlaut and -er: "größer als" (lesson 12). "am größten" is the superlative, and "mehr groß" is an English-style mistake.
- id: de2-q-2410
  lesson: de2-exam-review
  topic: Exam language
  stem: 'An exam instruction says: "Beachten Sie die Uhrzeit." What should you do?'
  choices: ['Pay attention to the time.', 'Write down the date.', 'Look at the clock in the room.', 'Change the time.']
  answer: 0
  explanation: |-
    "beachten" means to pay attention to or note, and "die Uhrzeit" is the time on the clock. The instruction tells you that the time in the text matters for the answer.
- id: de2-q-2411
  lesson: de2-exam-review
  module_quiz: true
  topic: Exam strategies
  stem: 'In a listening text you hear: "Der Kurs beginnt am Montag um neun, äh, nein, um halb zehn." When does the course start?'
  choices: ['Monday at 9:00', 'Monday at 8:30', 'Nine days from now', 'Monday at 9:30']
  answer: 3
  explanation: |-
    The speaker corrects himself: "nein, um halb zehn". The last information counts, and "halb zehn" is 9:30, not 10:30 or 8:30: German "halb" counts towards the next hour.
- id: de2-q-2412
  lesson: de2-exam-review
  topic: Exam language
  stem: 'What does "Ich verwechsle immer die beiden Wörter" mean?'
  choices: ['I always forget both words.', 'I always repeat both words.', 'I always mix up the two words.', 'I always translate both words.']
  answer: 2
  explanation: |-
    "verwechseln" means to mix up or confuse. To forget is "vergessen", to repeat "wiederholen".
