- id: de2-h1-r2-h50
  lesson: de2-h-geschichten
  topic: Reading poems
  stem: What is "Vögelein" in "Die Vögelein schweigen im Walde"?
  choices:
  - A diminutive meaning little birds
  - A plural meaning many forests
  - A verb meaning to sing
  - A place name
  answer: 0
  explanation: '-lein makes a diminutive, usually with an umlaut: der Vogel → das Vögelein, little birds. Modern German more often says Vögelchen.'
- id: de2-h1-r2-h51
  lesson: de2-h-geschichten
  topic: Reading poems
  stem: Which words in Goethe's poem are older or poetic forms that you shouldn't use in an everyday e-mail? Select all that apply.
  choices:
  - Ruh
  - Walde
  - Spürest
  - Hauch
  - Gipfeln
  answer:
  - 0
  - 1
  - 2
  explanation: Ruh = Ruhe, im Walde = im Wald, spürest = spürst. Hauch (breath) and Gipfeln (dative plural of Gipfel) are normal modern German.
- id: de2-h1-r2-h52
  lesson: de2-h-geschichten
  module_quiz: true
  topic: Reading poems
  stem: The first four lines of the poem end with Gipfeln, Ruh, Wipfeln, du. What is their rhyme scheme?
  choices:
  - aabb
  - abba
  - abcd
  - abab
  answer: 3
  explanation: 'Gipfeln rhymes with Wipfeln (lines 1 and 3: a), Ruh with du (lines 2 and 4: b): abab. The last four lines are cddc.'
- id: de2-h1-r2-h53
  lesson: de2-h-geschichten
  topic: Reading poems
  stem: Which article goes with "Büchlein" (little book)?
  choices:
  - der
  - die
  - das
  - den
  answer: 2
  explanation: 'Diminutives with -chen or -lein are always neuter: das Büchlein, das Vögelein, even though der Vogel is masculine.'
- id: de2-h1-r2-h54
  lesson: de2-h-geschichten
  topic: Reading stories
  type: text
  stem: 'Fill in the infinitive: "schwieg" comes from ___.'
  accept:
  - schweigen
  explanation: 'schweigen (to be silent): schwieg, hat geschwiegen. Think of the consonants schw-g.'
- id: de2-h1-r2-h55
  lesson: de2-h-geschichten
  module_quiz: true
  topic: Reading poems
  stem: When and where did Goethe write the poem "Über allen Gipfeln ist Ruh", by most accounts?
  choices:
  - In 1780, on the wall of a hut on a hill near Ilmenau
  - In 1815, in a letter from Weimar
  - In 1823, as a song text for Schubert
  - In 1812, for the Grimms' collection of fairy tales
  answer: 0
  explanation: By most accounts he wrote it in pencil on the wall of a wooden hut on the Kickelhahn near Ilmenau in September 1780. 1815 is when it was first printed, and Schubert set it to music later.
- id: de2-h1-r2-h56
  lesson: de2-h-geschichten
  topic: Reading poems
  stem: What does "Spürest du kaum einen Hauch" mean?
  choices:
  - You feel a strong wind.
  - You feel hardly a breath of air.
  - You hear no birds.
  - You can hardly see the trees.
  answer: 1
  explanation: kaum = hardly, der Hauch = a breath, a light breath of wind. Everything in the poem is still.
