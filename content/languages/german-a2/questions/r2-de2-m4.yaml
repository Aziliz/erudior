# German A2, module 4 (Home, travel and wishes), round 2: new question types for lessons 13–16 and
# the honors lessons 16h1 (de2-m4-h-figurative) and 16h2 (de2-m4-h-wetter).

# --- 13 Two-way prepositions ---
- id: de2-m4-r2-q01
  lesson: de2-two-way
  module_quiz: true
  type: label
  topic: Home and moving
  stem: 'Name the numbered things in Lena''s living room.'
  image: {src: images/de2-m4-living-room-blank.svg, alt: 'A living room on moving day with six numbered things: something hanging from the ceiling, something on the wall above the sofa, something at the window, something on the sofa, something on the floor in front of the sofa, and a box marked Küche on the floor.'}
  labels:
    - {x: 46.9, y: 18.2, text: die Lampe}
    - {x: 25.8, y: 27.0, text: das Bild}
    - {x: 71.9, y: 45.0, text: der Vorhang}
    - {x: 35.2, y: 55.0, text: das Kissen}
    - {x: 59.4, y: 87.0, text: der Teppich}
    - {x: 80.5, y: 78.8, text: der Karton}
  distractors: [der Herd, die Spülmaschine]
  explanation: |-
    1 die Lampe hangs from the ceiling (an der Decke), 2 das Bild hangs on the wall above the sofa, 3 der Vorhang hangs at the window, 4 das Kissen lies on the sofa, 5 der Teppich lies on the floor in front of the sofa, 6 der Karton stands on the floor. The cooker (der Herd) and the dishwasher (die Spülmaschine) belong in the kitchen, not in this picture.
- id: de2-m4-r2-q02
  lesson: de2-two-way
  type: text
  topic: Position verbs
  stem: 'Type the past participles: "Gestern hat der Teppich im Flur ___. Jetzt habe ich ihn ins Schlafzimmer ___."'
  accept:
    - [gelegen]
    - [gelegt]
  explanation: |-
    The first sentence says where the rug was (Wo? im Flur, no object), so it's the being verb liegen: hat gelegen. In the second, I put it somewhere (Wohin? ins Schlafzimmer, object ihn), so it's the putting verb legen: habe gelegt.
- id: de2-m4-r2-q03
  lesson: de2-two-way
  type: match
  topic: Position verbs
  stem: 'Match each verb to its perfect form.'
  pairs:
    - [liegen, hat gelegen]
    - [legen, hat gelegt]
    - [sitzen, hat gesessen]
    - [setzen, hat gesetzt]
    - [hängen (be hanging), hat gehangen]
  distractors: [hat gesitzt, hat geliegt]
  explanation: |-
    The putting verbs are regular: gelegt, gesetzt (and gehängt for hanging something up). The being verbs are irregular: gelegen, gesessen, gehangen. "Gesitzt" and "geliegt" don't exist.
- id: de2-m4-r2-q04
  lesson: de2-two-way
  module_quiz: true
  topic: Two-way prepositions
  stem: 'Which sentences use the accusative correctly, because something moves to a new place? Select all that apply.'
  choices:
    - Wir stellen den Karton in den Keller.
    - Die Kinder spielen in den Garten.
    - Sie hängt die Jacke an die Tür.
    - Die Katze liegt auf das Sofa.
  answer: [0, 2]
  explanation: |-
    "den Karton in den Keller stellen" and "die Jacke an die Tür hängen" are both movement to a new place (Wohin?), so the accusative is right. Playing in the garden happens in one place (Wo?): im Garten. Lying is a position: Die Katze liegt auf dem Sofa.
- id: de2-m4-r2-q05
  lesson: de2-two-way
  type: order
  topic: Position verbs
  stem: 'Put the words in order to ask: "Where did you put the key?"'
  items: [Wohin, hast, du, den Schlüssel, 'gelegt?']
  explanation: |-
    Question word first (Wohin), then the auxiliary hast in position 2, the subject du, the object den Schlüssel, and the past participle gelegt at the end: Wohin hast du den Schlüssel gelegt?

# --- 14 Planning a trip ---
- id: de2-m4-r2-q06
  lesson: de2-travel
  module_quiz: true
  type: match
  topic: Time prepositions
  stem: 'Match each time phrase to its meaning.'
  pairs:
    - [vor zwei Jahren, two years ago]
    - [seit zwei Jahren, for two years (and still now)]
    - [in zwei Jahren, two years from now]
    - [für zwei Jahre, for a planned period of two years]
  distractors: [until two years ago]
  explanation: |-
    vor + dative looks back from now (ago); seit + dative started in the past and is still going on; in + dative looks forward from now; für + accusative is a planned length of time. "Until" would be bis.
- id: de2-m4-r2-q07
  lesson: de2-travel
  type: text
  topic: Time prepositions
  stem: 'Complete: "We''re flying to Portugal in three weeks." = "Wir fliegen ___ drei ___ nach Portugal."'
  accept:
    - [in]
    - [Wochen]
  explanation: |-
    "In" + dative counts forward from now: in drei Wochen. Woche has the plural Wochen, which already ends in -n, so the dative plural doesn't change. "Nach drei Wochen" would mean "after three weeks" (after some other event).
- id: de2-m4-r2-q08
  lesson: de2-travel
  topic: Directions
  stem: 'Look at the picture. Which words show movement away from the speaker? Select all that apply.'
  image: {src: images/de2-m4-hin-her.svg, alt: 'A speaker in the middle labeled ich. An arrow labeled her points towards the speaker from a person on the left; an arrow labeled hin points away from the speaker to a lake on the right.'}
  choices: [hin, her, hinauf, herunter]
  answer: [0, 2]
  explanation: |-
    hin means away from the speaker, her towards the speaker. The combined words keep that meaning: hinauf (up, away from me) and herunter (down, towards me). So hin and hinauf point away.
- id: de2-m4-r2-q09
  lesson: de2-travel
  type: order
  topic: Time prepositions
  stem: 'Put the times in order, from furthest in the past to furthest in the future.'
  items: [vor einem Jahr, vor einer Woche, jetzt, in drei Tagen, in einem Monat]
  explanation: |-
    vor looks back from now: a year ago is further back than a week ago. in looks forward: three days from now comes before a month from now. jetzt sits in between.
- id: de2-m4-r2-q10
  lesson: de2-travel
  type: text
  topic: Directions
  stem: 'Type the missing word: "Bringen Sie das Gepäck bitte ___ oben?" (Would you take the luggage upstairs, please?)'
  accept: [nach]
  explanation: |-
    oben is a place (Wo?): Das Zimmer ist oben. For a direction (Wohin?), put nach in front: nach oben, nach unten, nach draußen.

# --- 15 Konjunktiv II ---
- id: de2-m4-r2-q11
  lesson: de2-konjunktiv
  module_quiz: true
  type: match
  topic: Konjunktiv II
  stem: 'Match each simple past form to its Konjunktiv II ("would") form.'
  pairs:
    - [hatte, hätte]
    - [war, wäre]
    - [konnte, könnte]
    - [wurde, würde]
    - [musste, müsste]
  distractors: [wöre]
  explanation: |-
    Past form + umlaut gives the "would" form: hatte → hätte, konnte → könnte, wurde → würde, musste → müsste. war takes an umlaut and an -e: wäre. "Wöre" doesn't exist.
- id: de2-m4-r2-q12
  lesson: de2-konjunktiv
  type: text
  topic: Polite requests
  stem: 'Make the request more polite with one word: "Können Sie mir helfen?" → "___ Sie mir bitte helfen?"'
  accept: [Könnten, Koennten]
  explanation: |-
    The Konjunktiv II of können is könnten (for Sie): Könnten Sie mir bitte helfen? Without the umlaut, "Konnten Sie mir helfen?" means "Were you able to help me?"
- id: de2-m4-r2-q13
  lesson: de2-konjunktiv
  type: order
  topic: Wishes and advice
  stem: 'Put the parts in order: "If I had time, I would come along."'
  items: [Wenn, ich, Zeit, 'hätte,', würde, ich mitkommen.]
  explanation: |-
    In the wenn clause the verb (hätte) goes to the end. Then comes the comma, and the main clause starts with its verb (würde) because the whole wenn clause is in position 1: Wenn ich Zeit hätte, würde ich mitkommen.
- id: de2-m4-r2-q14
  lesson: de2-konjunktiv
  module_quiz: true
  topic: Konjunktiv II
  stem: 'Which are Konjunktiv II ("would") forms rather than simple past forms? Select all that apply.'
  choices: [hätte, konnte, wäre, wurde, dürfte]
  answer: [0, 2, 4]
  explanation: |-
    hätte, wäre and dürfte have the umlaut of the Konjunktiv II. konnte and wurde have no umlaut: they are the simple past (could, was able to; became). Their "would" forms are könnte and würde.

# --- 16 Linking ideas; weather ---
- id: de2-m4-r2-q15
  lesson: de2-connectors
  module_quiz: true
  type: label
  topic: Weather and environment
  stem: 'Name the numbered weather symbols.'
  image: {src: images/de2-m4-weather-blank.svg, alt: 'Six numbered weather symbols in tiles: a sun; two clouds; a dark cloud with a lightning bolt; horizontal grey lines; curling wind lines; a cloud with snowflakes.'}
  labels:
    - {x: 28.9, y: 8.6, text: sonnig}
    - {x: 61.7, y: 8.6, text: bewölkt}
    - {x: 94.5, y: 8.6, text: das Gewitter}
    - {x: 28.9, y: 57.1, text: neblig}
    - {x: 61.7, y: 57.1, text: windig}
    - {x: 94.5, y: 57.1, text: der Schnee}
  distractors: [der Regen, trocken]
  explanation: |-
    1 the sun: sonnig. 2 clouds: bewölkt. 3 a cloud with lightning: das Gewitter (thunderstorm). 4 grey lines: neblig (foggy, from der Nebel). 5 wind lines: windig. 6 a cloud with snowflakes: der Schnee. No picture shows rain drops (der Regen), and trocken (dry) has no symbol here.
- id: de2-m4-r2-q16
  lesson: de2-connectors
  type: order
  topic: Word order
  stem: 'Put the words in order to finish the idea: "Es regnet. ..." (I''m going for a walk anyway.) Start with the linking adverb.'
  items: [Trotzdem, gehe, ich, spazieren.]
  explanation: |-
    trotzdem is a linking adverb. In position 1 it is followed directly by the verb (gehe) and then the subject (ich): Trotzdem gehe ich spazieren.
- id: de2-m4-r2-q17
  lesson: de2-connectors
  type: match
  topic: Linking words
  stem: 'Match each linking word to the word order that follows it.'
  pairs:
    - [deshalb, verb straight after it]
    - [trotzdem, verb straight after it]
    - [weil, verb at the end]
    - [dass, verb at the end]
    - [denn, normal order (subject then verb)]
  explanation: |-
    deshalb and trotzdem are linking adverbs: they take position 1, so the verb comes next (Deshalb bleibe ich …). weil and dass send the verb to the end (…, weil es regnet). denn is a coordinating conjunction in position 0, so the clause keeps its normal order (…, denn es regnet).
- id: de2-m4-r2-q18
  lesson: de2-connectors
  type: text
  topic: Linking words
  stem: 'Complete with one word: "Es ist nicht kalt, ___ warm."'
  accept: [sondern]
  explanation: |-
    After a negative (nicht kalt) that is corrected by the second part, use sondern: nicht kalt, sondern warm ("not cold but rather warm"). "aber" would mean "however" and doesn't fit after a corrected negative.
- id: de2-m4-r2-q19
  lesson: de2-connectors
  topic: Word order
  stem: 'Which sentences have correct word order? Select all that apply.'
  choices:
    - Deshalb bleiben wir zu Hause.
    - Trotzdem ich gehe spazieren.
    - Ich bleibe zu Hause, weil es regnet.
    - Ich fahre nach München morgen mit dem Zug.
  answer: [0, 2]
  explanation: |-
    After deshalb in position 1 the verb comes next: Deshalb bleiben wir. weil sends the verb to the end: weil es regnet. "Trotzdem ich gehe" needs the verb straight after: Trotzdem gehe ich spazieren. And the middle field goes time, manner, place: Ich fahre morgen mit dem Zug nach München.

# --- 16h1 Honors: figurative German ---
- id: de2-m4-r2-h01
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'Complete: "Die Verspätung liegt ___ Stau." (The delay is because of the traffic jam.)'
  choices: [am, im, an den, auf dem]
  answer: 0
  explanation: |-
    "liegen an" + dative means "to be because of". der Stau is masculine: an dem Stau, contracted to am Stau. "An den" would be the accusative, which liegen an never takes; "im" and "auf dem" don't give a reason.
- id: de2-m4-r2-h02
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'What does "In der Zeitung steht, dass die Mieten steigen." mean?'
  choices:
    - The newspaper is next to the rent.
    - It says in the paper that rents are rising.
    - The newspaper is getting more expensive.
    - The paper says that rents are falling.
  answer: 1
  explanation: |-
    "stehen in" + dative is how German says that something is written in a text: In der Zeitung steht … = It says in the paper … "steigen" means to rise. Nothing is physically standing anywhere: this is a figurative use.
- id: de2-m4-r2-h03
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'Your friend asks: "Du bist so müde. Woran liegt das?" Which answer fits?'
  choices:
    - Das liegt auf dem Bett.
    - Ich liege im Bett.
    - Ich glaube, es liegt daran, dass ich zu wenig schlafe.
    - Es liegt an das Wetter.
  answer: 2
  explanation: |-
    "Woran liegt das?" asks for the reason. The answer uses daran + a dass clause: Es liegt daran, dass ich zu wenig schlafe. "Auf dem Bett" and "im Bett" are real places, not reasons, and "an das Wetter" has the wrong case: liegen an takes the dative (am Wetter).
- id: de2-m4-r2-h04
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'What does "Mathe liegt mir nicht." mean?'
  choices:
    - Maths isn't my thing.
    - My maths book isn't here.
    - I don't lie about maths.
    - Maths doesn't matter to me.
  answer: 0
  explanation: |-
    "jemandem liegen" (person in the dative) means that something suits you or that you're good at it. Mathe liegt mir nicht = I'm not good at maths, it isn't my thing.
- id: de2-m4-r2-h05
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'Which sentence is correct in standard German as used in Germany? (I was very attached to my old flat.)'
  choices:
    - Ich habe sehr an meiner alten Wohnung gehängt.
    - Ich habe sehr an meine alte Wohnung gehangen.
    - Ich habe sehr an meiner alten Wohnung gehangen.
    - Ich bin sehr an meiner alten Wohnung gehangen.
  answer: 2
  explanation: |-
    "hängen an" + dative = to be attached to. It's the being verb, so the perfect is hat gehangen (gehängt is for hanging something up). The case is fixed: an meiner alten Wohnung (dative), not an meine alte Wohnung. Standard German in Germany uses haben here; "ist gehangen" is heard in southern Germany, Austria and Switzerland.
- id: de2-m4-r2-h06
  lesson: de2-m4-h-figurative
  topic: Prepositions in fixed expressions
  stem: 'Which of these set phrases uses the accusative?'
  choices: [vor allem, in der Nähe, auf dem Land, aufs Land]
  answer: 3
  explanation: |-
    aufs = auf das, accusative: Wir fahren aufs Land (to the countryside). vor allem, in der Nähe and auf dem Land (in the countryside) are fixed datives.
- id: de2-m4-r2-h07
  lesson: de2-m4-h-figurative
  topic: Figurative position verbs
  stem: 'Which sentence is colloquial, better kept for friends than for a job interview?'
  choices:
    - Ich interessiere mich für alte Filme.
    - Ich mag alte Filme.
    - Ich sehe gern alte Filme.
    - Ich stehe total auf alte Filme.
  answer: 3
  explanation: |-
    "auf etwas stehen" (+ accusative) means to be really into something. It's informal, and "total" makes it even more so. The other three are neutral.
- id: de2-m4-r2-h08
  lesson: de2-m4-h-figurative
  topic: Prepositions in fixed expressions
  stem: 'Complete: "Wir fahren ___ Wochenende weg." (for the whole weekend, Friday to Sunday)'
  choices: [über dem, übers, auf dem, im]
  answer: 1
  explanation: |-
    über with a stretch of time takes the accusative: übers (über das) Wochenende = for the length of the weekend. "Über dem" is the dative, which doesn't fit. ("Am Wochenende" would also be correct, but it means "at the weekend", not "over the weekend".)
- id: de2-m4-r2-h09
  lesson: de2-m4-h-figurative
  type: text
  topic: Figurative position verbs
  stem: 'Type the position verb German uses here: "Wo ___ du denn? Ich warte seit einer Stunde!" (Where on earth are you?)'
  accept: [steckst]
  explanation: |-
    "Wo steckst du?" (from stecken) asks where a person is, often a bit impatiently. The du form is steckst.
- id: de2-m4-r2-h10
  lesson: de2-m4-h-figurative
  type: text
  topic: Figurative position verbs
  stem: 'Type the position verb German uses here: "Was ___ in dem Brief?" (What does the letter say?)'
  accept: [steht]
  explanation: |-
    German says that things "stand" in a text: Was steht in dem Brief? The subject is "was", so the verb is in the third person singular: steht.
- id: de2-m4-r2-h11
  lesson: de2-m4-h-figurative
  type: match
  topic: Figurative position verbs
  stem: 'Match each expression to its meaning.'
  pairs:
    - [im Stau stehen, to be stuck in traffic]
    - [liegen an + dative, to be because of]
    - [hängen an + dative, to be attached to]
    - [Die Hose sitzt., The trousers fit well.]
    - ['Wo steckst du?', 'Where are you?']
  distractors: [to be written in]
  explanation: |-
    All five are figurative uses of the position verbs. "To be written in" would be stehen in (In der Zeitung steht …), which isn't in the list.
- id: de2-m4-r2-h12
  lesson: de2-m4-h-figurative
  topic: Prepositions in fixed expressions
  stem: 'In which sentences is the preposition used figuratively, with no real place? Select all that apply.'
  choices:
    - Das liegt nicht an dir.
    - Der Karton steht im Flur.
    - 'Unter uns: Ich finde ihn nett.'
    - Die Katze liegt unter dem Tisch.
  answer: [0, 2]
  explanation: |-
    "liegen an" (be because of) and "unter uns" (between you and me) don't name places: they are fixed expressions. The box in the hall and the cat under the table are real positions, so the Wo? rule decides the dative there.
- id: de2-m4-r2-h13
  lesson: de2-m4-h-figurative
  type: label
  topic: Figurative position verbs
  stem: 'Choose the expression that fits each numbered picture.'
  image: {src: images/de2-m4-figurative-blank.svg, alt: 'Four numbered panels: a newspaper with the headline Mieten steigen; a line of cars bumper to bumper; a grey cloud with lightning and rain; a person with both arms around a small house, a heart beside it.'}
  labels:
    - {x: 10.9, y: 13.6, text: In der Zeitung steht …}
    - {x: 56.2, y: 11.4, text: im Stau stehen}
    - {x: 9.4, y: 59.1, text: Das liegt am Wetter.}
    - {x: 57.8, y: 56.8, text: an der Wohnung hängen}
  distractors: ['Wo steckst du?', Die Hose sitzt.]
  explanation: |-
    1 a newspaper: In der Zeitung steht … (it says in the paper). 2 cars that can't move: im Stau stehen. 3 bad weather as the reason for something: Das liegt am Wetter. 4 loving a home: an der Wohnung hängen (to be attached to the flat).
- id: de2-m4-r2-h14
  lesson: de2-m4-h-figurative
  type: order
  topic: Figurative position verbs
  stem: 'Put the parts in order: "It''s because I don''t sleep enough."'
  items: [Es, liegt, 'daran,', dass, ich, zu wenig, schlafe.]
  explanation: |-
    Main clause first, verb in position 2: Es liegt daran. daran points forward to the dass clause, and in the dass clause the verb goes to the end: Es liegt daran, dass ich zu wenig schlafe.

# --- 16h2 Honors: weather talk ---
- id: de2-m4-r2-h15
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'Complete correctly: "Morgen ___."'
  choices: [regnet, es regnet, regnet es, wird regnen]
  answer: 2
  explanation: |-
    The weather "es" never disappears. When "Morgen" is in position 1, the verb comes second and es follows it: Morgen regnet es. "Morgen es regnet" breaks the verb-second rule, and "wird regnen" needs es too (Morgen wird es regnen).
- id: de2-m4-r2-h16
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'Complete: "Gestern ___ es gehagelt."'
  choices: [ist, hat, wird, war]
  answer: 1
  explanation: |-
    Weather verbs form the perfect with haben: Es hat gehagelt, es hat geregnet, es hat geschneit.
- id: de2-m4-r2-h17
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'Someone says: "Morgen soll es schneien." What do they mean?'
  choices:
    - Snow should be forbidden tomorrow.
    - They are sure it will snow.
    - They want it to snow tomorrow.
    - The forecast says it will snow tomorrow.
  answer: 3
  explanation: |-
    sollen used to pass on information means "they say, apparently": Morgen soll es schneien = It's supposed to snow tomorrow (according to the forecast). It doesn't show that the speaker is sure, and it isn't a wish.
- id: de2-m4-r2-h18
  lesson: de2-m4-h-wetter
  topic: Temperatures
  stem: 'The forecast says "30 Grad". What is that in Fahrenheit?'
  choices: [62 °F, 86 °F, 54 °F, 99 °F]
  answer: 1
  explanation: |-
    F = C × 9/5 + 32: 30 × 9/5 = 54, and 54 + 32 = 86 °F. 54 °F forgets to add 32; 62 °F adds 32 without multiplying by 9/5.
- id: de2-m4-r2-h19
  lesson: de2-m4-h-wetter
  topic: Temperatures
  stem: 'A friend in the US writes that it''s 68 °F. How many degrees Celsius is that?'
  choices: [36 Grad, 38 Grad, 20 Grad, 65 Grad]
  answer: 2
  explanation: |-
    C = (F − 32) × 5/9: 68 − 32 = 36, and 36 × 5/9 = 20 Grad (room temperature). 36 forgets to multiply by 5/9; 38 multiplies 68 by 5/9 without subtracting 32 first.
- id: de2-m4-r2-h20
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'Which adjective means "rainy"?'
  choices: [regnerisch, regnig, regnerig, geregnet]
  answer: 0
  explanation: |-
    Most weather adjectives take -ig (sonnig, windig, neblig), but der Regen is an exception: regnerisch. "geregnet" is the past participle (es hat geregnet).
- id: de2-m4-r2-h21
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'What is "der Föhn" in Munich or Innsbruck?'
  choices:
    - a cold wind from the North Sea
    - a warm, dry wind coming down from the Alps
    - a heavy snowstorm in the mountains
    - thick fog in the valleys
  answer: 1
  explanation: |-
    The Föhn is a warm, dry wind that comes down from the Alps; in Munich and Innsbruck, on the north side, it brings sudden warmth and clear views. In everyday German, der Föhn is also a hairdryer.
- id: de2-m4-r2-h22
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'You''re cold. What do you say?'
  choices: [Ich bin kalt., Ich mache kalt., Mir ist kalt., Mich ist kalt.]
  answer: 2
  explanation: |-
    For feeling cold, German puts the person in the dative: Mir ist kalt (or: Ich friere). "Ich bin kalt" describes you as a cold person, "Ich mache kalt" isn't German, and "mich" is the accusative.
- id: de2-m4-r2-h23
  lesson: de2-m4-h-wetter
  type: text
  topic: Temperatures
  stem: 'Complete: "Es sind minus fünf Grad." = "Es sind fünf Grad unter ___."'
  accept: [null, Null]
  explanation: |-
    minus fünf Grad and fünf Grad unter null (five degrees below zero) mean the same.
- id: de2-m4-r2-h24
  lesson: de2-m4-h-wetter
  type: text
  topic: Temperatures
  stem: 'Convert: 10 °C = ___ °F. Give only the number.'
  accept: ['50']
  explanation: |-
    F = C × 9/5 + 32: 10 × 9/5 = 18, and 18 + 32 = 50 °F.
- id: de2-m4-r2-h25
  lesson: de2-m4-h-wetter
  type: match
  topic: Weather and forecasts
  stem: 'Match each weather verb to its noun.'
  pairs:
    - [es hagelt, der Hagel]
    - [es donnert, der Donner]
    - [es blitzt, der Blitz]
    - [es nieselt, der Nieselregen]
    - [es friert, der Frost]
  distractors: [der Nebel]
  explanation: |-
    hageln – der Hagel (hail), donnern – der Donner (thunder), blitzen – der Blitz (lightning), nieseln – der Nieselregen (drizzle), frieren – der Frost (frost). Fog (der Nebel) has no matching verb in the list: you say es ist neblig.
- id: de2-m4-r2-h26
  lesson: de2-m4-h-wetter
  type: label
  topic: Temperatures
  stem: 'Name the numbered points on the thermometer.'
  image: {src: images/de2-m4-thermometer-blank.svg, alt: 'A thermometer with a Celsius and a Fahrenheit scale. Four numbered points: 100 °C = 212 °F, 37 °C = 98,6 °F, 20 °C = 68 °F and 0 °C = 32 °F. A fifth point, −10 °C = 14 °F, has no number.'}
  labels:
    - {x: 83.3, y: 14.1, text: Wasser kocht}
    - {x: 83.3, y: 51.7, text: Körpertemperatur}
    - {x: 83.3, y: 61.9, text: Zimmertemperatur}
    - {x: 83.3, y: 73.8, text: Wasser gefriert}
  distractors: [Fieber, Hitzefrei]
  explanation: |-
    1 water boils at 100 °C (212 °F): Wasser kocht. 2 normal body temperature is about 37 °C (98.6 °F): Körpertemperatur; 39 °C would be Fieber. 3 about 20 °C (68 °F) is Zimmertemperatur. 4 water freezes at 0 °C (32 °F): Wasser gefriert.
- id: de2-m4-r2-h27
  lesson: de2-m4-h-wetter
  topic: Weather and forecasts
  stem: 'Which sentences correctly pass on what the weather forecast says? Select all that apply.'
  choices:
    - Morgen soll es schneien.
    - Im Wetterbericht haben sie gesagt, dass es morgen schneit.
    - Morgen schneit.
    - Morgen sollt es schneien.
  answer: [0, 1]
  explanation: |-
    "soll" (er/sie/es form of sollen) passes on a report, and so does an indirect statement with dass. "Morgen schneit" is missing the weather es, and "sollt" is the ihr form, not the es form.
- id: de2-m4-r2-h28
  lesson: de2-m4-h-wetter
  type: order
  topic: Temperatures
  stem: 'Put the temperatures in order from coldest to warmest.'
  items: [minus zehn Grad, null Grad, 50 °F, 20 Grad, 77 °F]
  explanation: |-
    Convert the Fahrenheit values: 50 °F = 10 °C and 77 °F = 25 °C. So the order is −10 °C, 0 °C, 10 °C (50 °F), 20 °C, 25 °C (77 °F).
