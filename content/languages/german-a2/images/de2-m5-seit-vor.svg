<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"><title>A time line from Monday to Thursday. On Monday: Ich habe mich erkältet. An arrow from Thursday back to Monday is labeled vor drei Tagen. A bar from Monday up to now is labeled seit drei Tagen: Ich habe Husten (present tense).</title>
<rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
<line x1="40" y1="170" x2="680" y2="170" stroke="#1c2833" stroke-width="3" />
<path d="M 680 162 L 696 170 L 680 178 Z" fill="#1c2833" stroke="#1c2833" stroke-width="2" />
<line x1="170" y1="162" x2="170" y2="178" stroke="#1c2833" stroke-width="3" />
<text x="170" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" >Mo</text>
<line x1="310" y1="162" x2="310" y2="178" stroke="#1c2833" stroke-width="3" />
<text x="310" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" >Di</text>
<line x1="450" y1="162" x2="450" y2="178" stroke="#1c2833" stroke-width="3" />
<text x="450" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" >Mi</text>
<line x1="590" y1="162" x2="590" y2="178" stroke="#1c2833" stroke-width="3" />
<text x="590" y="200" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" >Do</text>
<text x="590" y="224" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833" >heute</text>
<circle cx="170" cy="170" r="9" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<text x="170" y="120" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833" >Ich habe mich erkältet.</text>
<text x="170" y="142" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833" >(a moment in the past)</text>
<rect x="170" y="60" width="420" height="22" rx="4" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5" />
<path d="M 590 52 L 606 71 L 590 90 Z" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5" />
<text x="380" y="46" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833" >seit drei Tagen: Ich habe Husten. (still now: present tense)</text>
<line x1="170" y1="82" x2="170" y2="160" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M 590 250 L 178 250" fill="none" stroke="#1c2833" stroke-width="2" />
<path d="M 186 243 L 172 250 L 186 257 Z" fill="#1c2833" stroke="#1c2833" stroke-width="2" />
<text x="380" y="276" font-family="sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833" >vor drei Tagen: Ich habe mich erkältet. (finished: past)</text>
<line x1="590" y1="178" x2="590" y2="250" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="5 4"/>
</svg>
