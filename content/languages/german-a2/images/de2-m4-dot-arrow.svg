<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" role="img"><title>Dot for Wo? and dative, arrow for Wohin? and accusative</title><rect x="0" y="0" width="640" height="290" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1c2833"/></marker></defs><rect x="10" y="10" width="300" height="270" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><rect x="330" y="10" width="300" height="270" rx="10" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="160" y="40" font-family="sans-serif" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">Wo? → Dativ</text><text x="480" y="40" font-family="sans-serif" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">Wohin? → Akkusativ</text><rect x="70" y="170" width="180" height="12" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><line x1="85" y1="182" x2="85" y2="235" stroke="#1c2833" stroke-width="4"/><line x1="235" y1="182" x2="235" y2="235" stroke="#1c2833" stroke-width="4"/><rect x="130" y="156" width="60" height="14" rx="2" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><line x1="136" y1="163" x2="184" y2="163" stroke="#1c2833" stroke-width="1"/><circle cx="160" cy="125" r="9" fill="#1c2833"/><text x="160" y="105" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">Punkt (dot)</text><rect x="390" y="170" width="180" height="12" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><line x1="405" y1="182" x2="405" y2="235" stroke="#1c2833" stroke-width="4"/><line x1="555" y1="182" x2="555" y2="235" stroke="#1c2833" stroke-width="4"/><rect x="380" y="80" width="60" height="14" rx="2" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><line x1="386" y1="87" x2="434" y2="87" stroke="#1c2833" stroke-width="1"/><path d="M420 100 Q470 90 492 150" fill="none" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/><text x="520" y="95" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">Pfeil (arrow)</text><text x="160" y="262" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-style="italic">Das Buch liegt auf dem Tisch.</text><text x="480" y="262" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-style="italic">Ich lege das Buch auf den Tisch.</text></svg>