<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img"><title>The compound der Wohnungsschlüssel split into its parts: the article der, the modifier Wohnung, the linking s and the head word Schlüssel, meaning the key to the flat</title><rect x="0" y="0" width="640" height="330" fill="#ffffff"/><rect x="40" y="40" width="90" height="64" rx="8" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="85.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">der</text><rect x="150" y="40" width="170" height="64" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="235.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">Wohnung</text><rect x="340" y="40" width="50" height="64" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="365.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">s</text><rect x="410" y="40" width="190" height="64" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="505.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">schlüssel</text><text x="320" y="150" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">Read it from the back: the last part says what the thing IS.</text><line x1="85" y1="104" x2="85" y2="190" stroke="#1c2833" stroke-width="1.5"/><text x="85" y="212" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f4f7f" text-anchor="middle">article</text><text x="85" y="232" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2f4f7f" text-anchor="middle">(from the head)</text><line x1="235" y1="104" x2="235" y2="190" stroke="#1c2833" stroke-width="1.5"/><text x="235" y="212" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f4f7f" text-anchor="middle">modifier</text><text x="235" y="232" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2f4f7f" text-anchor="middle">die Wohnung (flat)</text><line x1="365" y1="104" x2="365" y2="190" stroke="#1c2833" stroke-width="1.5"/><text x="365" y="212" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f4f7f" text-anchor="middle">linking s</text><line x1="505" y1="104" x2="505" y2="190" stroke="#1c2833" stroke-width="1.5"/><text x="505" y="212" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2f4f7f" text-anchor="middle">head word</text><text x="505" y="232" font-family="sans-serif" font-size="14" font-weight="normal" fill="#2f4f7f" text-anchor="middle">der Schlüssel (key)</text><rect x="150" y="262" width="340" height="46" rx="8" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="320" y="292" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2833" text-anchor="middle">= the key to the flat</text></svg>