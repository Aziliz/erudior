<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img"><title>A German school report</title><rect width="620" height="500" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="20" width="540" height="460" rx="6" fill="#fffdf6"/><text x="310" y="62" font-size="18" text-anchor="middle" fill="#1c2833" stroke="none">Grundschule Lindenweg</text><text x="310" y="98" font-size="28" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">ZEUGNIS</text><text x="80" y="140" font-size="18" text-anchor="start" fill="#1c2833" stroke="none">Name: Peter Wolf</text><text x="400" y="140" font-size="18" text-anchor="start" font-weight="bold" fill="#1c2833" stroke="none">Klasse 3b</text><text x="80" y="168" font-size="16" text-anchor="start" fill="#1c2833" stroke="none">Schuljahr 1961/62, 2. Halbjahr</text><path d="M80 188 L540 188" stroke-width="2"/><rect x="80" y="198" width="460" height="36" fill="#dde8f3" stroke="none"/><text x="100" y="222" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Deutsch</text><rect x="440" y="200" width="60" height="32" rx="4" fill="#ffffff" stroke-width="2"/><text x="470" y="222" font-size="20" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">2</text><rect x="80" y="238" width="460" height="36" fill="#ffffff" stroke="none"/><text x="100" y="262" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Mathematik</text><rect x="440" y="240" width="60" height="32" rx="4" fill="#ffffff" stroke-width="2"/><text x="470" y="262" font-size="20" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">4</text><rect x="80" y="278" width="460" height="36" fill="#dde8f3" stroke="none"/><text x="100" y="302" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Sport</text><rect x="440" y="280" width="60" height="32" rx="4" fill="#ffffff" stroke-width="2"/><text x="470" y="302" font-size="20" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">1</text><rect x="80" y="318" width="460" height="36" fill="#ffffff" stroke="none"/><text x="100" y="342" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Musik</text><rect x="440" y="320" width="60" height="32" rx="4" fill="#ffffff" stroke-width="2"/><text x="470" y="342" font-size="20" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">3</text><text x="80" y="400" font-size="16" text-anchor="start" font-style="italic" fill="#1c2833" stroke="none">Peter ist fleißig, aber oft frech.</text><path d="M370 425 q15 -25 25 -5 t25 -5 t25 0 t30 -8" stroke-width="2"/><path d="M360 432 L540 432" stroke-width="1.5"/><text x="450" y="456" font-size="14" text-anchor="middle" fill="#1c2833" stroke="none">Unterschrift</text></g></svg>