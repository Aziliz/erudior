<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 360" width="730" height="360" role="img"><title>A two-by-two grid of forms of address. du with a first name: friends and family. Sie with a first name: the Hamburger Sie. du with a surname: the Münchner Du. Sie with Herr or Frau and the surname: the standard polite form</title>
<rect x="0" y="0" width="730" height="360" fill="#ffffff"/>
<text x="450" y="40" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">pronoun</text>
<text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">first</text>
<text x="70" y="172" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">name</text>
<text x="70" y="290" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">surname</text>
<text x="300" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">du</text>
<text x="580" y="80" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Sie</text>
<rect x="170" y="95" width="260" height="120" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="300" y="123" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">du + first name</text>
<text x="300" y="149" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Hallo Lena, kommst du mit?</text>
<text x="300" y="177" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">friends, family, children,</text>
<text x="300" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">many young people and teams</text>
<rect x="450" y="95" width="260" height="120" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="580" y="123" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Sie + first name</text>
<text x="580" y="149" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Lena, kommen Sie bitte?</text>
<text x="580" y="177" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">the “Hamburger Sie”:</text>
<text x="580" y="199" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">teachers to older pupils</text>
<rect x="170" y="225" width="260" height="120" rx="10" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/>
<text x="300" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">du + surname</text>
<text x="300" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Meier, mach das Fenster zu!</text>
<text x="300" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">the “Münchner Du”:</text>
<text x="300" y="329" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">some workplaces, sports clubs</text>
<rect x="450" y="225" width="260" height="120" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="580" y="253" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Sie + Herr/Frau + surname</text>
<text x="580" y="279" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Frau Meier, kommen Sie bitte?</text>
<text x="580" y="307" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">the standard polite form</text>
<text x="580" y="329" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">with adults you don’t know</text>
</svg>
