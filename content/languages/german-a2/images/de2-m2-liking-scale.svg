<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 492" width="720" height="492" role="img"><title>A scale of six ways to say you like someone, from weakest at the bottom to strongest at the top: Ich finde dich nett, Ich mag dich, Ich hab dich gern, Ich hab dich lieb, Ich bin in dich verliebt, Ich liebe dich</title>
<rect x="0" y="0" width="720" height="492" fill="#ffffff"/>
<rect x="120" y="30" width="560" height="62" rx="10" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="56" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich liebe dich.</text>
<text x="140" y="80" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I love you.</text>
<text x="660" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">partners; also family</text>
<rect x="120" y="104" width="560" height="62" rx="10" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="130" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich bin in dich verliebt.</text>
<text x="140" y="154" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I'm in love with you.</text>
<text x="660" y="154" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">romantic</text>
<rect x="120" y="178" width="560" height="62" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="204" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich hab dich lieb.</text>
<text x="140" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I love you (not romantic).</text>
<text x="660" y="228" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">family, close friends</text>
<rect x="120" y="252" width="560" height="62" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="278" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich hab dich gern.</text>
<text x="140" y="302" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I'm fond of you.</text>
<text x="660" y="302" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">warm, friends and family</text>
<rect x="120" y="326" width="560" height="62" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="352" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich mag dich.</text>
<text x="140" y="376" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I like you.</text>
<text x="660" y="376" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">friends, colleagues</text>
<rect x="120" y="400" width="560" height="62" rx="10" fill="#ffffff" stroke="#1c2833" stroke-width="2"/>
<text x="140" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="italic" fill="#1c2833" text-anchor="start">Ich finde dich nett.</text>
<text x="140" y="450" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">I think you're nice.</text>
<text x="660" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">friendly, a bit distant</text>
<line x1="60" y1="462" x2="60" y2="38" stroke="#1c2833" stroke-width="4"/>
<path d="M 48 52 L 60 30 L 72 52 Z" fill="#1c2833"/>
<text x="40" y="246" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" transform="rotate(-90 40 246)">stronger feeling</text>
</svg>
