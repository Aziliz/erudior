<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" role="img"><title>her means towards the speaker, hin means away from the speaker</title><rect x="0" y="0" width="640" height="250" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#1c2833"/></marker></defs><line x1="10" y1="200" x2="630" y2="200" stroke="#1c2833" stroke-width="2"/><circle cx="320" cy="75" r="16" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><line x1="320" y1="91" x2="320" y2="145" stroke="#1c2833" stroke-width="3"/><line x1="296" y1="111" x2="344" y2="111" stroke="#1c2833" stroke-width="3"/><line x1="320" y1="145" x2="302" y2="185" stroke="#1c2833" stroke-width="3"/><line x1="320" y1="145" x2="338" y2="185" stroke="#1c2833" stroke-width="3"/><text x="320" y="55" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold">ich (speaker)</text><circle cx="90" cy="75" r="16" fill="#dde8f3" stroke="#1c2833" stroke-width="2.5"/><line x1="90" y1="91" x2="90" y2="145" stroke="#1c2833" stroke-width="3"/><line x1="66" y1="111" x2="114" y2="111" stroke="#1c2833" stroke-width="3"/><line x1="90" y1="145" x2="72" y2="185" stroke="#1c2833" stroke-width="3"/><line x1="90" y1="145" x2="108" y2="185" stroke="#1c2833" stroke-width="3"/><ellipse cx="560" cy="185" rx="65" ry="18" fill="#dde8f3" stroke="#1c2833" stroke-width="2.5"/><text x="560" y="160" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle">der See</text><line x1="125" y1="120" x2="285" y2="120" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/><text x="205" y="105" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold">her</text><text x="205" y="150" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-style="italic">Komm her!</text><text x="205" y="170" font-family="sans-serif" font-size="14" fill="#1c2833" text-anchor="middle">(towards me)</text><line x1="355" y1="120" x2="505" y2="120" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/><text x="430" y="105" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold">hin</text><text x="430" y="150" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-style="italic">Ich fahre hin.</text><text x="430" y="170" font-family="sans-serif" font-size="14" fill="#1c2833" text-anchor="middle">(away from me)</text><text x="170" y="234" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">woher? = where from (towards me)</text><text x="480" y="234" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">wohin? = where to (away from me)</text></svg>