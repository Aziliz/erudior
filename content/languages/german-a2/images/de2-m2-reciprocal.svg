<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img"><title>Two panels. Left, reflexive: Anna and Ben each have an arrow looping back to themselves (Sie waschen sich selbst, they wash themselves). Right, reciprocal: arrows go from Anna to Ben and from Ben to Anna (Sie helfen einander, they help each other)</title>
<rect x="0" y="0" width="720" height="380" fill="#ffffff"/>
<rect x="20" y="20" width="330" height="340" rx="12" fill="#ffffff" stroke="#1c2833" stroke-width="2"/>
<rect x="370" y="20" width="330" height="340" rx="12" fill="#ffffff" stroke="#1c2833" stroke-width="2"/>
<text x="185" y="52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">reflexive: each to themselves</text>
<text x="535" y="52" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">reciprocal: to each other</text>
<circle cx="110" cy="150" r="20" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<path d="M 82 220 Q 82 174 110 174 Q 138 174 138 220 Z" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<text x="110" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Anna</text>
<circle cx="260" cy="150" r="20" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<path d="M 232 220 Q 232 174 260 174 Q 288 174 288 220 Z" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="260" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Ben</text>
<circle cx="460" cy="150" r="20" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<path d="M 432 220 Q 432 174 460 174 Q 488 174 488 220 Z" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<text x="460" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Anna</text>
<circle cx="610" cy="150" r="20" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<path d="M 582 220 Q 582 174 610 174 Q 638 174 638 220 Z" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="610" y="246" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Ben</text>
<path d="M 92 128 C 60 80 160 80 128 128" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 122 118 L 129 130 L 136 120" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 242 128 C 210 80 310 80 278 128" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 272 118 L 279 130 L 286 120" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 490 140 Q 535 100 580 140" fill="none" stroke="#c0392b" stroke-width="3"/><path d="M 568 136 L 581 141 L 578 127" fill="none" stroke="#c0392b" stroke-width="3"/>
<path d="M 580 175 Q 535 215 490 175" fill="none" stroke="#2e6da4" stroke-width="3"/><path d="M 502 179 L 489 174 L 492 188" fill="none" stroke="#2e6da4" stroke-width="3"/>
<text x="185" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie waschen sich selbst.</text>
<text x="185" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">They wash themselves.</text>
<text x="535" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie helfen einander.</text>
<text x="535" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">They help each other.</text>
</svg>
