<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" role="img" font-family="sans-serif"><title>The front page of an invented local newspaper (unlabeled)</title><rect x="0" y="0" width="820" height="470" fill="#ffffff"/><rect x="190" y="15" width="480" height="440" rx="4" fill="#fdfcf8" stroke="#1c2833" stroke-width="2.5"/><text x="430" y="55" font-size="30" fill="#1c2833" text-anchor="middle" font-weight="bold">Neckar-Bote</text><line x1="210" y1="68" x2="650" y2="68" stroke="#1c2833" stroke-width="2"/><text x="210" y="86" font-size="14" fill="#1c2833" text-anchor="start">Dienstag, 14. Oktober</text><text x="650" y="86" font-size="14" fill="#1c2833" text-anchor="end">Nr. 238 · 2,40 €</text><line x1="210" y1="94" x2="650" y2="94" stroke="#1c2833" stroke-width="1"/><text x="210" y="130" font-size="26" fill="#1c2833" text-anchor="start" font-weight="bold">Neue Brücke: Stadt plant</text><text x="210" y="160" font-size="26" fill="#1c2833" text-anchor="start" font-weight="bold">Eröffnung im Mai</text><rect x="210" y="174" width="440" height="40" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="0"/><text x="210" y="192" font-size="15" fill="#1c2833" text-anchor="start" font-weight="bold">Die Brücke über den Neckar kostet 12 Millionen Euro.</text><text x="210" y="210" font-size="15" fill="#1c2833" text-anchor="start" font-weight="bold">Viele Radfahrer freuen sich, aber es gibt auch Kritik.</text><rect x="210" y="226" width="200" height="130" rx="2" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><path d="M210 330 Q260 300 310 330 L310 356 L210 356 Z" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><path d="M220 310 L400 310 M240 310 L240 330 M300 310 L300 330 M360 310 L360 330" fill="None" stroke="#1c2833" stroke-width="3"/><circle cx="370" cy="255" r="14" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="210" y="376" font-size="14" fill="#1c2833" text-anchor="start" font-style="italic">Die neue Brücke im Oktober</text><rect x="430" y="230" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="246" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="262" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="278" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="294" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="310" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="326" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="342" width="220" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="430" y="358" width="140" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="210" y="396" width="440" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="210" y="412" width="440" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/><rect x="210" y="428" width="300" height="7" rx="3" fill="#e5e8ec" stroke="#1c2833" stroke-width="0"/></svg>