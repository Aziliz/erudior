<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img"><title>The compound der Wohnungsschlüssel split into four boxes, for a labeling question</title><rect x="0" y="0" width="640" height="330" fill="#ffffff"/><rect x="40" y="40" width="90" height="64" rx="8" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="85.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">der</text><rect x="150" y="40" width="170" height="64" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="235.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">Wohnung</text><rect x="340" y="40" width="50" height="64" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="365.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">s</text><rect x="410" y="40" width="190" height="64" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="505.0" y="84" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1c2833" text-anchor="middle">schlüssel</text><text x="320" y="150" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">Read it from the back: the last part says what the thing IS.</text></svg>