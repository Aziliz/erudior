<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" font-family="sans-serif"><title>Two cards side by side: a colourful birthday card and a condolence card with a black border</title><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><rect x="40" y="30" width="320" height="270" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2.5"/><rect x="52" y="42" width="296" height="246" rx="4" fill="none" stroke="#b8d8c2" stroke-width="6"/><circle cx="80" cy="70" r="12" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><circle cx="320" cy="70" r="12" fill="#e8e2f3" stroke="#1c2833" stroke-width="1.5"/><circle cx="80" cy="260" r="12" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><circle cx="320" cy="260" r="12" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="200" y="100" font-size="24" fill="#1c2833" text-anchor="middle" font-weight="bold">Herzlichen</text><text x="200" y="130" font-size="24" fill="#1c2833" text-anchor="middle" font-weight="bold">Glückwunsch</text><text x="200" y="165" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">zum 40. Geburtstag!</text><text x="200" y="205" font-size="16" fill="#1c2833" text-anchor="middle">Alles Gute, viel Glück</text><text x="200" y="227" font-size="16" fill="#1c2833" text-anchor="middle">und Gesundheit!</text><rect x="400" y="30" width="320" height="270" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2.5"/><rect x="408" y="38" width="304" height="254" rx="2" fill="none" stroke="#1c2833" stroke-width="5"/><text x="560" y="110" font-size="21" fill="#1c2833" text-anchor="middle" font-weight="bold">In stiller Anteilnahme</text><line x1="500" y1="128" x2="620" y2="128" stroke="#1c2833" stroke-width="1.5"/><text x="560" y="170" font-size="18" fill="#1c2833" text-anchor="middle">Herzliches Beileid</text><text x="560" y="205" font-size="16" fill="#1c2833" text-anchor="middle">Wir denken an euch.</text></svg>