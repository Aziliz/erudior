<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" role="img"><title>Passing on a message</title><rect width="800" height="430" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="90" cy="300" r="26" fill="#f8e1dc"/><path d="M52 390 Q52 334 90 334 Q128 334 128 390 Z" fill="#f8e1dc"/><text x="90" y="420" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">Anna</text><circle cx="400" cy="300" r="26" fill="#dde8f3"/><path d="M362 390 Q362 334 400 334 Q438 334 438 390 Z" fill="#dde8f3"/><text x="400" y="420" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">Ben</text><circle cx="710" cy="300" r="26" fill="#dcf0e3"/><path d="M672 390 Q672 334 710 334 Q748 334 748 390 Z" fill="#dcf0e3"/><text x="710" y="420" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">Clara</text><rect x="20" y="20" width="300" height="150" rx="14" fill="#f8e1dc" stroke-width="2.5"/><path d="M80 170 L90 262 L120 170" fill="#f8e1dc" stroke-width="2.5"/><path d="M82 168 L118 168" stroke="#f8e1dc" stroke-width="5"/><text x="40" y="60" font-size="20" text-anchor="start" font-style="italic" fill="#1c2833" stroke="none">„Ich bin krank.</text><text x="40" y="95" font-size="20" text-anchor="start" font-style="italic" fill="#1c2833" stroke="none">Kommst du morgen</text><text x="40" y="128" font-size="20" text-anchor="start" font-style="italic" fill="#1c2833" stroke="none">zu mir?“</text><text x="170" y="160" font-size="14" text-anchor="middle" fill="#1c2833" stroke="none">direct speech</text><rect x="350" y="20" width="430" height="150" rx="14" fill="#dde8f3" stroke-width="2.5"/><path d="M420 170 L410 262 L450 170" fill="#dde8f3" stroke-width="2.5"/><path d="M422 168 L448 168" stroke="#dde8f3" stroke-width="5"/><text x="370" y="60" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Anna hat gesagt, dass sie krank ist.</text><text x="370" y="95" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">Sie hat gefragt, ob du morgen</text><text x="370" y="128" font-size="19" text-anchor="start" fill="#1c2833" stroke="none">zu ihr kommst.</text><text x="565" y="160" font-size="14" text-anchor="middle" fill="#1c2833" stroke="none">reported speech</text><path d="M460 340 L640 340" stroke-dasharray="8 8" stroke-width="2.5"/><path d="M626 330 L642 340 L626 350" stroke-width="2.5"/><text x="550" y="325" font-size="15" text-anchor="middle" fill="#1c2833" stroke="none">Ben tells Clara</text></g></svg>