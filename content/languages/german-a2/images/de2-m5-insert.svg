<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img"><title>The first page of a package insert for the made-up medicine Musterin 200 mg tablets: a title, a warning to read the whole leaflet, and the six numbered sections every EU package insert has.</title>
<rect x="0" y="0" width="720" height="700" fill="#ffffff"/>
<rect x="70" y="20" width="580" height="660" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="2" />
<text x="100" y="64" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="bold" fill="#1c2833" >Gebrauchsinformation: Information für Anwender</text>
<text x="100" y="100" font-family="sans-serif" font-size="24" text-anchor="start" font-weight="bold" fill="#1c2833" >Musterin 200 mg Tabletten</text>
<text x="100" y="126" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Wirkstoff: Musterol (ein erfundener Wirkstoff)</text>
<rect x="100" y="146" width="520" height="92" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5" />
<text x="114" y="170" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Lesen Sie die gesamte Packungsbeilage sorgfältig durch,</text>
<text x="114" y="190" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >bevor Sie mit der Einnahme dieses Arzneimittels beginnen.</text>
<text x="114" y="210" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Heben Sie die Packungsbeilage auf. Vielleicht möchten</text>
<text x="114" y="230" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Sie diese später nochmals lesen.</text>
<text x="100" y="278" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="bold" fill="#1c2833" >Was in dieser Packungsbeilage steht</text>
<rect x="100" y="294" width="520" height="30" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="0" />
<text x="112" y="316" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >1. Was ist Musterin und wofür wird es angewendet?</text>
<rect x="100" y="328" width="520" height="30" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="0" />
<text x="112" y="350" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >2. Was sollten Sie vor der Einnahme beachten?</text>
<rect x="100" y="362" width="520" height="30" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="0" />
<text x="112" y="384" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >3. Wie ist Musterin einzunehmen?</text>
<rect x="100" y="396" width="520" height="30" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="0" />
<text x="112" y="418" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >4. Welche Nebenwirkungen sind möglich?</text>
<rect x="100" y="430" width="520" height="30" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="0" />
<text x="112" y="452" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >5. Wie ist Musterin aufzubewahren?</text>
<rect x="100" y="464" width="520" height="30" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="0" />
<text x="112" y="486" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833" >6. Inhalt der Packung und weitere Informationen</text>
<text x="100" y="552" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="bold" fill="#1c2833" >3. Wie ist Musterin einzunehmen?</text>
<text x="100" y="582" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Erwachsene: 1 Tablette bis zu dreimal täglich.</text>
<text x="100" y="604" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Nehmen Sie nicht mehr als 3 Tabletten pro Tag ein.</text>
<text x="100" y="626" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >Die Tabletten werden unzerkaut mit einem Glas Wasser</text>
<text x="100" y="648" font-family="sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833" >nach dem Essen eingenommen.</text>
</svg>
