<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" font-family="sans-serif"><title>How to choose a relative pronoun: gender from the noun before the comma, case from inside the clause</title><rect x="0" y="0" width="760" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#1c2833"/></marker></defs><text x="82.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">Das ist</text><rect x="146" y="120" width="164" height="44" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="228.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">der Artikel,</text><rect x="322" y="120" width="56" height="44" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="350.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">den</text><text x="442.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">ich dir</text><text x="570.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">geschickt</text><rect x="646" y="120" width="80" height="44" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="686.0" y="149" font-size="20" fill="#1c2833" text-anchor="middle" font-weight="bold">habe.</text><path d="M350.0 118 C350.0 60 228.0 60 228.0 112" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="262.0" y="48" font-size="16" fill="#2f4f7f" text-anchor="middle" font-weight="bold">1. gender and number: look back</text><text x="262.0" y="68" font-size="15" fill="#1c2833" text-anchor="middle">der Artikel = masculine singular</text><path d="M462.0 168 C442.0 230 350.0 230 350.0 170" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="340.0" y="262" font-size="16" fill="#2f4f7f" text-anchor="middle" font-weight="bold">2. case: look inside the clause</text><text x="340.0" y="284" font-size="15" fill="#1c2833" text-anchor="middle">ich sent it: object → accusative den</text><text x="686.0" y="200" font-size="15" fill="#2f4f7f" text-anchor="middle" font-weight="bold">verb at the end</text><line x1="686.0" y1="182" x2="686.0" y2="168" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/></svg>