<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" role="img"><title>A notice board in a block of flats with four texts: a notice from the property management, a poster for a summer party, a small ad with tear-off strips and a note about a lost cat</title><rect x="0" y="0" width="640" height="500" fill="#ffffff"/><rect x="10" y="10" width="620" height="480" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="3"/><rect x="30" y="30" width="280" height="190" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="170" y="58" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle">Hausverwaltung Berger</text><text x="48" y="88" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">An alle Mieterinnen und Mieter:</text><text x="48" y="116" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">Am Dienstag, 14. Mai, gibt es</text><text x="48" y="140" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">von 8 bis 12 Uhr kein Wasser.</text><text x="48" y="164" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">Grund: Reparatur im Keller.</text><text x="48" y="198" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">Vielen Dank!</text><rect x="330" y="30" width="280" height="190" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="470" y="70" font-family="sans-serif" font-size="28" font-weight="bold" fill="#1c2833" text-anchor="middle">SOMMERFEST</text><text x="470" y="100" font-family="sans-serif" font-size="18" font-weight="normal" fill="#1c2833" text-anchor="middle">im Hof</text><text x="470" y="134" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle">Samstag, 18. Mai, ab 16 Uhr</text><text x="470" y="164" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Musik · Grill · Spiele für Kinder</text><text x="470" y="196" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Salat oder Kuchen mitbringen!</text><rect x="30" y="240" width="280" height="230" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="170" y="268" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle">Zu verkaufen:</text><text x="170" y="292" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">Kinderfahrrad, blau</text><text x="170" y="316" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">gut erhalten, 40 Euro</text><text x="170" y="340" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Familie Yilmaz, 2. Stock</text><line x1="72" y1="356" x2="72" y2="462" stroke="#1c2833" stroke-width="1"/><text x="60" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 60 458)">Yilmaz, 2. St.</text><line x1="110" y1="356" x2="110" y2="462" stroke="#1c2833" stroke-width="1"/><text x="98" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 98 458)">Yilmaz, 2. St.</text><line x1="148" y1="356" x2="148" y2="462" stroke="#1c2833" stroke-width="1"/><text x="136" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 136 458)">Yilmaz, 2. St.</text><line x1="186" y1="356" x2="186" y2="462" stroke="#1c2833" stroke-width="1"/><text x="174" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 174 458)">Yilmaz, 2. St.</text><line x1="224" y1="356" x2="224" y2="462" stroke="#1c2833" stroke-width="1"/><text x="212" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 212 458)">Yilmaz, 2. St.</text><line x1="262" y1="356" x2="262" y2="462" stroke="#1c2833" stroke-width="1"/><text x="250" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 250 458)">Yilmaz, 2. St.</text><line x1="300" y1="356" x2="300" y2="462" stroke="#1c2833" stroke-width="1"/><text x="288" y="458" font-family="sans-serif" font-size="14" fill="#1c2833" transform="rotate(-90 288 458)">Yilmaz, 2. St.</text><line x1="34" y1="356" x2="306" y2="356" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="330" y="240" width="280" height="230" rx="4" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="470" y="272" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1c2833" text-anchor="middle">Katze entlaufen!</text><text x="470" y="302" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Mia, grau mit weißen Pfoten,</text><text x="470" y="326" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">seit Montag nicht zu Hause.</text><text x="470" y="350" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Wer hat sie gesehen?</text><text x="470" y="386" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2833" text-anchor="middle">Belohnung: 50 Euro</text><text x="470" y="416" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Bitte bei Jonas klingeln,</text><text x="470" y="440" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">Erdgeschoss links.</text><circle cx="170" cy="30" r="7" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><circle cx="470" cy="30" r="7" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><circle cx="170" cy="240" r="7" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><circle cx="470" cy="240" r="7" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/></svg>