<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" font-family="sans-serif"><title>Goethe-Zertifikat A2 points: 75 written with at least 45 needed, 25 speaking with at least 15 needed, 100 in all with at least 60 needed</title><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><rect x="60" y="50" width="450" height="40" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="60" y="40" font-size="16" fill="#1c2833" text-anchor="start" font-weight="bold">Written exam (Lesen, Hören, Schreiben): 75 points</text><rect x="60" y="150" width="150" height="40" rx="4" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="60" y="140" font-size="16" fill="#1c2833" text-anchor="start" font-weight="bold">Sprechen (speaking): 25 points</text><rect x="60" y="250" width="600" height="40" rx="4" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="60" y="240" font-size="16" fill="#1c2833" text-anchor="start" font-weight="bold">Total: 100 points</text><line x1="330" y1="46" x2="330" y2="94" stroke="#8b2c1c" stroke-width="3"/><text x="336" y="114" font-size="15" fill="#8b2c1c" text-anchor="start" font-weight="bold">at least 45</text><line x1="150" y1="146" x2="150" y2="194" stroke="#8b2c1c" stroke-width="3"/><text x="156" y="214" font-size="15" fill="#8b2c1c" text-anchor="start" font-weight="bold">at least 15</text><line x1="420" y1="246" x2="420" y2="294" stroke="#8b2c1c" stroke-width="3"/><text x="426" y="314" font-size="15" fill="#8b2c1c" text-anchor="start" font-weight="bold">at least 60 to pass</text><text x="668" y="276" font-size="15" fill="#1c2833" text-anchor="start">100</text><text x="518" y="76" font-size="15" fill="#1c2833" text-anchor="start">75</text><text x="218" y="176" font-size="15" fill="#1c2833" text-anchor="start">25</text></svg>