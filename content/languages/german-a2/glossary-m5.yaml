# German A2, module 5 glossary terms (lessons 17–20)
- term: zu + infinitive
  aliases: [infinitive with zu, zu-infinitive, Infinitiv mit zu]
  definition: 'A verb in its dictionary form with zu in front, placed at the end of the sentence after expressions like Lust haben, Zeit haben, versuchen, vergessen, anfangen, aufhören and es ist wichtig: Ich habe keine Zeit, ins Kino zu gehen. Separable verbs put zu between prefix and verb (anzurufen). Modal verbs, werden, gehen and lassen take an infinitive without zu.'
  topic: Verbs
- term: infinitive clause
  aliases: [infinitive clauses, infinitive group, Infinitivgruppe, Infinitivsatz]
  definition: 'A group of words ending in zu + infinitive that works like a short clause without its own subject: in Ich versuche, den Bericht heute zu schreiben, the clause is "den Bericht heute zu schreiben". The person doing it is the subject of the main sentence. It usually follows a comma.'
  topic: Word order
- term: genitive
  aliases: [genitive case, Genitiv]
  definition: 'The fourth German case, used mainly to show possession in writing: das Auto meines Bruders (my brother''s car), am Ende der Woche. Articles: des/eines (masculine and neuter, and the noun adds -s or -es), der/einer (feminine and plural). In everyday speech von + dative usually replaces it: das Auto von meinem Bruder.'
  topic: Cases
- term: imperative
  aliases: [imperatives, Imperativ, command form]
  definition: 'The verb form for instructions and requests, with the verb first. Sie form: Nehmen Sie die Tabletten! du form: the present du form without du and -st, with e→i changes kept (Nimm! Iss! Bleib!). ihr form: the ihr form without ihr (Nehmt!). bitte makes it polite.'
  topic: Verbs
