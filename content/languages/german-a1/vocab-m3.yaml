# --- 12 A day in my life: separable verbs ---
- id: aufstehen
  lesson: de1-daily-routine
  term: aufstehen
  pos: verb
  meanings: [to get up, to stand up, to rise]
  example: Ich stehe um sieben Uhr auf.
  exampleEn: I get up at seven o'clock.
  note: 'Separable: ich stehe … auf. Perfect: ist aufgestanden.'
- id: anfangen
  lesson: de1-daily-routine
  term: anfangen
  pos: verb
  meanings: [to begin, to start]
  example: Der Kurs fängt um neun an.
  exampleEn: The course starts at nine.
  note: 'Separable, with a→ä: du fängst an, er fängt an. Perfect: hat angefangen.'
- id: einkaufen
  lesson: de1-daily-routine
  term: einkaufen
  pos: verb
  meanings: [to go shopping, to shop, to do the shopping]
  example: Am Samstag kaufe ich ein.
  exampleEn: On Saturday I go shopping.
  note: 'Separable: ich kaufe … ein. Perfect: hat eingekauft.'
- id: anrufen
  lesson: de1-daily-routine
  term: anrufen
  pos: verb
  meanings: [to phone, to call (on the phone), to ring, to call]
  example: Ich rufe meine Mutter an.
  exampleEn: I'm phoning my mother.
  note: 'Separable: ich rufe … an. Perfect: hat angerufen.'
- id: fernsehen
  lesson: de1-daily-routine
  term: fernsehen
  pos: verb
  meanings: [to watch TV, to watch television]
  example: Siehst du heute Abend fern?
  exampleEn: Are you watching TV this evening?
  note: 'Separable, with e→ie: du siehst fern, er sieht fern. Perfect: hat ferngesehen.'
- id: aufraeumen
  lesson: de1-daily-routine
  term: aufräumen
  pos: verb
  meanings: [to tidy up, to tidy, to clean up]
  example: Wir räumen die Küche auf.
  exampleEn: We're tidying up the kitchen.
  note: 'Separable: ich räume … auf. Perfect: hat aufgeräumt.'
- id: mitkommen
  lesson: de1-daily-routine
  term: mitkommen
  pos: verb
  meanings: [to come along, to come with, to come too]
  example: Kommst du mit?
  exampleEn: Are you coming along?
  note: 'Separable: ich komme … mit. Perfect: ist mitgekommen.'
- id: abholen
  lesson: de1-daily-routine
  term: abholen
  pos: verb
  meanings: [to pick up (collect), to pick up, to collect, to fetch]
  example: Ich hole das Kind um vier ab.
  exampleEn: I pick the child up at four.
  note: 'Separable: ich hole … ab. Perfect: hat abgeholt.'
- id: ankommen
  lesson: de1-daily-routine
  term: ankommen
  pos: verb
  meanings: [to arrive, to get (somewhere)]
  example: Der Zug kommt um acht an.
  exampleEn: The train arrives at eight.
  note: 'Separable: ich komme … an. Perfect: ist angekommen.'
- id: schlafen
  lesson: de1-daily-routine
  term: schlafen
  pos: verb
  meanings: [to sleep]
  example: Das Baby schläft.
  exampleEn: The baby is sleeping.
  note: 'Stem change a→ä: du schläfst, er schläft. Perfect: hat geschlafen.'
- id: duschen
  lesson: de1-daily-routine
  term: duschen
  pos: verb
  meanings: [to shower, to take a shower, to have a shower]
  example: Ich dusche am Morgen.
  exampleEn: I shower in the morning.
- id: fruehstuecken
  lesson: de1-daily-routine
  term: frühstücken
  pos: verb
  meanings: [to have breakfast, to eat breakfast]
  example: Wir frühstücken um acht.
  exampleEn: We have breakfast at eight.
  note: 'Not separable: ich frühstücke. Perfect: hat gefrühstückt.'
- id: kochen
  lesson: de1-daily-routine
  term: kochen
  pos: verb
  meanings: [to cook, to boil]
  example: Am Abend koche ich Nudeln.
  exampleEn: In the evening I cook pasta.
- id: putzen
  lesson: de1-daily-routine
  term: putzen
  pos: verb
  meanings: [to clean]
  example: Er putzt das Bad.
  exampleEn: He's cleaning the bathroom.
  note: 'du putzt (no extra s).'
- id: waschen
  lesson: de1-daily-routine
  term: waschen
  pos: verb
  meanings: [to wash]
  example: Er wäscht das Auto.
  exampleEn: He's washing the car.
  note: 'Stem change a→ä: du wäschst, er wäscht. Perfect: hat gewaschen.'
- id: zuerst
  lesson: de1-daily-routine
  term: zuerst
  pos: adverb
  meanings: [first of all, first, at first]
  example: Zuerst dusche ich.
  exampleEn: First I take a shower.
- id: dann
  lesson: de1-daily-routine
  term: dann
  pos: adverb
  meanings: [then]
  example: Dann frühstücke ich.
  exampleEn: Then I have breakfast.
- id: danach
  lesson: de1-daily-routine
  term: danach
  pos: adverb
  meanings: [afterwards, after that, then]
  example: Danach räume ich auf.
  exampleEn: After that I tidy up.
- id: spaeter
  lesson: de1-daily-routine
  term: später
  pos: adverb
  meanings: [later]
  example: Bis später!
  exampleEn: See you later!
- id: normalerweise
  lesson: de1-daily-routine
  term: normalerweise
  pos: adverb
  meanings: [normally, usually, as a rule]
  example: Normalerweise stehe ich um sechs auf.
  exampleEn: Normally I get up at six.
- id: bett
  lesson: de1-daily-routine
  term: das Bett
  pos: noun
  plural: die Betten
  meanings: [bed]
  example: Das Bett ist groß.
  exampleEn: The bed is big.
- id: dusche
  lesson: de1-daily-routine
  term: die Dusche
  pos: noun
  plural: die Duschen
  meanings: [shower (the noun), shower]
  example: Die Dusche ist kaputt.
  exampleEn: The shower is broken.
- id: feierabend
  lesson: de1-daily-routine
  term: der Feierabend
  pos: noun
  plural: die Feierabende
  meanings: [end of the working day, finishing time, time off after work, evening off, quitting time]
  example: Um fünf Uhr habe ich Feierabend.
  exampleEn: I finish work at five o'clock.
  note: 'Feierabend haben = to have finished work for the day.'
- id: alltag
  lesson: de1-daily-routine
  term: der Alltag
  pos: noun
  plural: —
  meanings: [everyday life, daily routine, daily life, routine]
  note: 'The plural die Alltage is rare.'
  example: Mein Alltag ist ziemlich ruhig.
  exampleEn: My everyday life is fairly quiet.
- id: muede
  lesson: de1-daily-routine
  term: müde
  pos: adjective
  meanings: [tired, sleepy]
  example: Am Abend bin ich müde.
  exampleEn: In the evening I'm tired.
- id: fertig
  lesson: de1-daily-routine
  term: fertig
  pos: adjective
  meanings: [finished, ready, done]
  example: Bist du fertig?
  exampleEn: Are you ready?
