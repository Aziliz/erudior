# German A1, round 2, module de1-m3 glossary terms (honors lessons 12h1 and 12h2)
- term: regional variant
  aliases: [regional variants, regionalism, regionalisms]
  definition: 'A word or form that is normal in one region but not everywhere, such as die Semmel (Bavaria, Austria) or die Schrippe (Berlin) for the bread roll das Brötchen. Regional variants are correct where they are used; the standard word is understood everywhere.'
  topic: Food culture
- term: subjunctive
  aliases: [Konjunktiv II, Konjunktiv, polite subjunctive]
  definition: 'The "would" form of a verb, used for wishes and polite requests. At A1 you meet it in two fixed forms: ich hätte gern (from haben) and ich möchte (from mögen), both meaning "I would like": Ich hätte gern einen Kaffee.'
  topic: Polite requests
- term: accusative of time
  aliases: [time accusative, accusative of duration]
  definition: 'A time phrase in the accusative with no preposition. It is used with jeder, nächster, dieser and ganz (jeden Tag, nächsten Montag, diese Woche, den ganzen Tag) and to say how long something lasts (Der Kurs dauert einen Tag). Only the masculine changes: den, einen, jeden, nächsten.'
  topic: Time expressions
- term: adverb of time
  aliases: [adverbs of time, time adverb, time adverbs, Temporaladverb]
  definition: 'An adverb that says when something happens, such as heute, morgen or jetzt. Adverbs made from days and parts of the day with -s, such as montags, abends or nachts, mean "regularly, every Monday / evening / night" and are written with a small letter.'
  topic: Time expressions
