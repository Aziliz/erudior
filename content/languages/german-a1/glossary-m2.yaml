# German A1 glossary, module 2 terms
- term: gender
  aliases: [grammatical gender, Genus]
  definition: 'The group a German noun belongs to: masculine, feminine or neuter. It is a property of the word, not of the thing, and it decides the form of articles and possessives (der Tisch, die Lampe, das Buch). Learn every noun with its article.'
  topic: Nouns
- term: masculine
  aliases: [maskulin]
  definition: 'One of the three German genders. Masculine nouns take der and ein in the nominative: der Stuhl, ein Stuhl.'
  topic: Nouns
- term: feminine
  aliases: [feminin]
  definition: 'One of the three German genders. Feminine nouns take die and eine: die Tür, eine Tür. Nouns ending in -ung, -heit, -keit and -ion, and words for female people in -in (die Lehrerin), are feminine.'
  topic: Nouns
- term: neuter
  aliases: [neutral, sächlich]
  definition: 'One of the three German genders. Neuter nouns take das and ein: das Buch, ein Buch. Nouns ending in -chen and -lein are always neuter.'
  topic: Nouns
- term: definite article
  aliases: [definite articles, bestimmter Artikel]
  definition: 'The word for "the". In the nominative it is der (masculine), die (feminine), das (neuter) and die (all plurals).'
  topic: Articles
- term: indefinite article
  aliases: [indefinite articles, unbestimmter Artikel]
  definition: 'The word for "a" or "an": ein for masculine and neuter nouns, eine for feminine nouns (nominative). It has no plural form.'
  topic: Articles
- term: plural
  aliases: [plurals, Plural]
  definition: 'The form of a noun for more than one. All German plurals take the article die, but the ending varies (die Tische, die Bücher, die Lampen, die Handys, die Schlüssel), so learn each plural with the noun.'
  topic: Nouns
- term: compound noun
  aliases: [compound nouns, compound, Kompositum]
  definition: 'A noun made by joining two or more words: die Handynummer = das Handy + die Nummer. The last part decides the gender and the plural.'
  topic: Nouns
- term: possessive article
  aliases: [possessive articles, possessive, possessives, Possessivartikel]
  definition: 'A word that says whose something is: mein, dein, sein, ihr, unser, euer, Ihr. The owner chooses the word; the noun that follows chooses the ending, which is the same as for ein (meine Mutter, mein Vater, meine Eltern).'
  topic: Possessives
- term: nominative
  aliases: [nominative case, Nominativ]
  definition: 'The case of the subject, the person or thing doing the action or being described: Der Tisch ist neu. It is the form you find in dictionaries.'
  topic: Cases
- term: case
  aliases: [cases, Kasus]
  definition: 'The form of an article, pronoun or noun that shows its job in the sentence. German has four cases: nominative (subject), accusative (direct object), dative (indirect object, after some prepositions) and genitive.'
  topic: Cases
- term: stem-changing verb
  aliases: [stem-changing verbs, stem change, stem-change verb]
  definition: 'A verb whose stem vowel changes in the du and er/sie/es forms of the present tense, while the endings stay regular: sprechen → du sprichst, er spricht; fahren → du fährst, er fährt.'
  topic: Verbs
- term: adjective
  aliases: [adjectives, Adjektiv]
  definition: 'A word that describes a noun: groß, neu, rot. After sein an adjective has no ending (Die Lampe ist neu); before a noun it takes endings, which you learn at A2.'
  topic: Adjectives
- term: negation
  aliases: [negating, Negation]
  definition: 'Saying that something is not so. German uses kein to negate nouns that would have ein or no article, and nicht for everything else (verbs, adjectives, nouns with der/die/das or a possessive).'
  topic: Negation
- term: negative article
  aliases: [negative articles, Negativartikel]
  definition: 'kein, the negative form of ein: "not a", "no", "not any". It takes the same endings as ein and also has a plural: kein Hund, keine Katze, kein Buch, keine Kinder.'
  topic: Negation
- term: particle
  aliases: [particles, Partikel]
  definition: 'A small word that adds a shade of meaning or attitude rather than content, such as doch (yes, contradicting a negative), ja or mal. Particles are very common in spoken German.'
  topic: Words
