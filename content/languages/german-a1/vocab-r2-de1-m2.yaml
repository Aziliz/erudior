# German A1, module 2 honors lessons (round 2): words for people, jobs and modern families.
# Checked against German A1, A2 and B1 vocabulary: none of these terms exists elsewhere.

# --- 08h1 People and gender (de1-m2-h-people-gender) ---
- id: de1-m2-r2-w01
  lesson: de1-m2-h-people-gender
  term: das Mädchen
  pos: noun
  plural: die Mädchen
  meanings: [girl]
  alt: [das Maedchen]
  example: Das Mädchen heißt Lea.
  exampleEn: The girl is called Lea.
  note: Neuter because of -chen. The textbook pronoun is es; sie is common in speech.
- id: de1-m2-r2-w02
  lesson: de1-m2-h-people-gender
  term: die Schülerin
  pos: noun
  plural: die Schülerinnen
  meanings: ['pupil (female, at school)', pupil, schoolgirl, school student, student]
  alt: [die Schuelerin]
  example: Meine Tochter ist Schülerin.
  exampleEn: My daughter is a pupil.
- id: de1-m2-r2-w03
  lesson: de1-m2-h-people-gender
  term: die Verkäuferin
  pos: noun
  plural: die Verkäuferinnen
  meanings: [salesperson (female), saleswoman, salesperson, sales assistant, shop assistant, seller, sales clerk, clerk]
  alt: [die Verkaeuferin]
  example: Die Verkäuferin ist sehr nett.
  exampleEn: The shop assistant is very nice.
- id: de1-m2-r2-w04
  lesson: de1-m2-h-people-gender
  term: die Kellnerin
  pos: noun
  plural: die Kellnerinnen
  meanings: [waitress, server, waiter]
  example: Sie arbeitet als Kellnerin.
  exampleEn: She works as a waitress.
- id: de1-m2-r2-w05
  lesson: de1-m2-h-people-gender
  term: die Köchin
  pos: noun
  plural: die Köchinnen
  meanings: ['cook (female, as a job)', cook, chef]
  alt: [die Koechin]
  example: Meine Schwester ist Köchin.
  exampleEn: My sister is a cook.
- id: de1-m2-r2-w06
  lesson: de1-m2-h-people-gender
  term: die Polizistin
  pos: noun
  plural: die Polizistinnen
  meanings: [police officer (female), police officer, policewoman, officer]
  example: Die Polizistin spricht Englisch.
  exampleEn: The police officer speaks English.
- id: de1-m2-r2-w07
  lesson: de1-m2-h-people-gender
  term: die Ingenieurin
  pos: noun
  plural: die Ingenieurinnen
  meanings: [engineer (female), engineer]
  example: Ich bin Ingenieurin.
  exampleEn: I'm an engineer.
- id: de1-m2-r2-w08
  lesson: de1-m2-h-people-gender
  term: der Kaufmann
  pos: noun
  plural: die Kaufleute
  meanings: [businessman, merchant, trader, salesman, clerk, business person]
  example: Mein Vater ist Kaufmann.
  exampleEn: My father is a businessman.
  note: 'Female form: die Kauffrau. Also the name of trained office and retail jobs.'
- id: de1-m2-r2-w09
  lesson: de1-m2-h-people-gender
  term: die Kauffrau
  pos: noun
  plural: die Kauffrauen
  meanings: [businesswoman, merchant, trader, saleswoman, clerk, business person]
  example: Frau Klein ist Kauffrau.
  exampleEn: Ms Klein is a businesswoman.
- id: de1-m2-r2-w10
  lesson: de1-m2-h-people-gender
  term: der Feuerwehrmann
  pos: noun
  plural: die Feuerwehrmänner
  meanings: [firefighter (male), firefighter, fireman]
  example: Mein Bruder ist Feuerwehrmann.
  exampleEn: My brother is a firefighter.
  note: 'Female form: die Feuerwehrfrau. A mixed group: die Feuerwehrleute.'
- id: de1-m2-r2-w11
  lesson: de1-m2-h-people-gender
  term: die Feuerwehrfrau
  pos: noun
  plural: die Feuerwehrfrauen
  meanings: [firefighter (female), firefighter]
  example: Die Feuerwehrfrau ist schnell.
  exampleEn: The firefighter is quick.
- id: de1-m2-r2-w12
  lesson: de1-m2-h-people-gender
  term: die Lehrkraft
  pos: noun
  plural: die Lehrkräfte
  meanings: ['teacher (any gender, formal word)', teacher, member of teaching staff, teaching staff, instructor]
  example: Unsere Lehrkräfte sind international.
  exampleEn: Our teaching staff are international.
  note: Feminine for every teacher, man or woman.
- id: de1-m2-r2-w13
  lesson: de1-m2-h-people-gender
  term: der Krankenpfleger
  pos: noun
  plural: die Krankenpfleger
  meanings: [nurse (male), nurse]
  example: Herr Braun ist Krankenpfleger.
  exampleEn: Mr Braun is a nurse.
- id: de1-m2-r2-w14
  lesson: de1-m2-h-people-gender
  term: die Krankenpflegerin
  pos: noun
  plural: die Krankenpflegerinnen
  meanings: [nurse (female), nurse]
  example: Meine Mutter ist Krankenpflegerin.
  exampleEn: My mother is a nurse.
  note: The older word die Krankenschwester is still common.
- id: de1-m2-r2-w15
  lesson: de1-m2-h-people-gender
  term: die Dame
  pos: noun
  plural: die Damen
  meanings: [lady]
  example: Wer ist die Dame dort?
  exampleEn: Who is the lady over there?
  note: In letters, Sehr geehrte Damen und Herren = Dear Sir or Madam.

# --- 08h2 Families and names (de1-m2-h-family-names) ---
- id: de1-m2-r2-w16
  lesson: de1-m2-h-family-names
  term: die Mama
  pos: noun
  plural: die Mamas
  meanings: [mum, mom, mummy, mommy, mama, mother]
  example: Meine Mama wohnt in Graz.
  exampleEn: My mum lives in Graz.
- id: de1-m2-r2-w17
  lesson: de1-m2-h-family-names
  term: der Papa
  pos: noun
  plural: die Papas
  meanings: [dad, daddy, papa, father]
  example: Papa ist Koch.
  exampleEn: Dad is a cook.
- id: de1-m2-r2-w18
  lesson: de1-m2-h-family-names
  term: die Patchworkfamilie
  pos: noun
  plural: die Patchworkfamilien
  meanings: [patchwork family, blended family, stepfamily]
  example: Wir sind eine Patchworkfamilie.
  exampleEn: We're a blended family.
- id: de1-m2-r2-w19
  lesson: de1-m2-h-family-names
  term: der Stiefvater
  pos: noun
  plural: die Stiefväter
  meanings: [stepfather, stepdad]
  example: Tom ist mein Stiefvater.
  exampleEn: Tom is my stepfather.
- id: de1-m2-r2-w20
  lesson: de1-m2-h-family-names
  term: die Stiefmutter
  pos: noun
  plural: die Stiefmütter
  meanings: [stepmother, stepmum, stepmom]
  example: Anja ist meine Stiefmutter.
  exampleEn: Anja is my stepmother.
- id: de1-m2-r2-w21
  lesson: de1-m2-h-family-names
  term: der Halbbruder
  pos: noun
  plural: die Halbbrüder
  meanings: [half-brother, half brother]
  example: Mein Halbbruder ist fünf.
  exampleEn: My half-brother is five.
- id: de1-m2-r2-w22
  lesson: de1-m2-h-family-names
  term: die Halbschwester
  pos: noun
  plural: die Halbschwestern
  meanings: [half-sister, half sister]
  example: Emma ist meine Halbschwester.
  exampleEn: Emma is my half-sister.
- id: de1-m2-r2-w23
  lesson: de1-m2-h-family-names
  term: der Zwilling
  pos: noun
  plural: die Zwillinge
  meanings: [twin]
  example: Lisa und Ben sind Zwillinge.
  exampleEn: Lisa and Ben are twins.
  note: Masculine for girls too. Twin sister = die Zwillingsschwester.
- id: de1-m2-r2-w24
  lesson: de1-m2-h-family-names
  term: das Einzelkind
  pos: noun
  plural: die Einzelkinder
  meanings: [only child]
  example: Ich bin Einzelkind.
  exampleEn: I'm an only child.
- id: de1-m2-r2-w25
  lesson: de1-m2-h-family-names
  term: getrennt
  pos: adjective
  meanings: [separated (couple), separated, apart, separate]
  example: Meine Eltern sind getrennt.
  exampleEn: My parents are separated.
- id: de1-m2-r2-w26
  lesson: de1-m2-h-family-names
  term: der Nachname
  pos: noun
  plural: die Nachnamen
  meanings: [last name (everyday word), last name, surname, family name]
  example: Wie ist Ihr Nachname?
  exampleEn: What's your last name?
  note: Same meaning as der Familienname, which is the word on forms.
- id: de1-m2-r2-w27
  lesson: de1-m2-h-family-names
  term: der Spitzname
  pos: noun
  plural: die Spitznamen
  meanings: [nickname]
  example: Mein Spitzname ist Kathi.
  exampleEn: My nickname is Kathi.
