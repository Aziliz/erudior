- id: de1-q-1301
  lesson: de1-hobbies
  module_quiz: true
  topic: Stem-changing verbs
  stem: 'Complete: "Mein Bruder ___ jeden Tag Fahrrad." (fahren)'
  choices:
  - fährt
  - fahrt
  - fahre
  - fähren
  answer: 0
  explanation: 'Fahren changes a to ä in the du and er/sie/es forms: er fährt. "Fahrt" without the umlaut
    is the ihr form, "fahre" is the ich form, and "fähren" doesn''t exist.'
- id: de1-q-1302
  lesson: de1-hobbies
  topic: Stem-changing verbs
  stem: What is the du form of "lesen" (to read)?
  choices:
  - lesst
  - liest
  - lest
  - liesst
  answer: 1
  explanation: 'Lesen changes e to ie: du liest. Because the stem ends in -s, du only adds -t, so it is
    not "liesst". "Lest" is the ihr form, which keeps the plain e.'
- id: de1-q-1303
  lesson: de1-hobbies
  topic: Stem-changing verbs
  stem: 'Complete: "Ihr ___ heute zwei Filme." (sehen)'
  choices:
  - sieht
  - siehst
  - seht
  - säht
  answer: 2
  explanation: 'The stem change e → ie only happens with du and er/sie/es. The ihr form is regular: ihr
    seht. "Sieht" (er) and "siehst" (du) are the changed forms; "säht" is not a form of sehen.'
- id: de1-q-1304
  lesson: de1-hobbies
  module_quiz: true
  topic: Likes and preferences
  stem: Which sentence is correct?
  choices:
  - Ich gern spiele Fußball.
  - Gern ich spiele Fußball.
  - Ich spiele mehr gern Fußball.
  - Ich spiele gern Fußball.
  answer: 3
  explanation: 'The verb comes in position 2 and gern follows it: Ich spiele gern Fußball. English word
    order ("Ich gern spiele") puts gern before the verb, which is wrong. "Mehr gern" doesn''t exist; the
    comparative is lieber.'
- id: de1-q-1305
  lesson: de1-hobbies
  topic: Likes and preferences
  stem: 'Complete: "Ich trinke gern Kaffee, aber ___ trinke ich Tee." (most of all)'
  choices:
  - am liebsten
  - lieber
  - gern
  - am lieber
  answer: 0
  explanation: 'Most of all = am liebsten, the superlative of gern. Lieber means "rather, prefer" (comparative).
    "Am lieber" mixes the two and is wrong. Note the inversion: am liebsten trinke ich.'
- id: de1-q-1306
  lesson: de1-hobbies
  topic: Likes and preferences
  stem: What does "Ich jogge lieber." mean?
  choices:
  - I like jogging.
  - I prefer jogging.
  - I jog most of all.
  - I don't like jogging.
  answer: 1
  explanation: 'Lieber is the comparative of gern: "rather, prefer". "I like jogging" would be Ich jogge
    gern; "most of all" would be am liebsten.'
- id: de1-q-1307
  lesson: de1-hobbies
  module_quiz: true
  topic: Stem-changing verbs
  stem: Which verb form is wrong?
  choices:
  - du hilfst
  - er gibt
  - wir sprichen
  - du triffst
  answer: 2
  explanation: 'The stem change (e → i) only happens with du and er/sie/es. With wir the verb is regular:
    wir sprechen. Du hilfst, er gibt and du triffst are all correct changed forms.'
- id: de1-q-1308
  lesson: de1-hobbies
  topic: Hobbies
  stem: 'Read: "Ich heiße Ben. In der Freizeit spiele ich gern Gitarre und singe in einer Band. Sport
    mache ich nicht gern, aber ich wandere manchmal. Am liebsten sehe ich Filme." What does Ben like doing
    most?'
  choices:
  - playing the guitar
  - hiking
  - watching films
  - singing
  answer: 2
  explanation: Am liebsten sehe ich Filme = most of all I like watching films. He also likes playing the
    guitar and singing (gern), and he hikes only sometimes (manchmal).
- id: de1-q-1309
  lesson: de1-hobbies
  topic: Hobbies
  stem: Choose the right answer. "Was machst du gern in der Freizeit?"
  choices:
  - Ja, ich habe Freizeit.
  - Ich lese gern und ich male.
  - Am Wochenende, um acht.
  - Nein, ich mache gern.
  answer: 1
  explanation: 'The question asks what you like doing in your free time, so you name activities: Ich lese
    gern und ich male. A W-question can''t be answered with ja or nein, and "Am Wochenende, um acht" answers
    "when?".'
- id: de1-q-1310
  lesson: de1-hobbies
  topic: Stem-changing verbs
  stem: 'Complete: "Er ___ seine Freunde am Samstag." (treffen)'
  choices:
  - treffet
  - trefft
  - triefft
  - trifft
  answer: 3
  explanation: 'Treffen changes e to i in the du and er forms and keeps the double f: er trifft. "Trefft"
    is the ihr form; "triefft" uses ie, which is the pattern of lesen and sehen, not treffen.'
- id: de1-q-1311
  lesson: de1-hobbies
  module_quiz: true
  topic: Stem-changing verbs
  stem: 'Find the mistake: "Ihr fährt am Wochenende zusammen, und Lena schläft lange."'
  choices:
  - 'fährt (should be: fahrt)'
  - 'schläft (should be: schlaft)'
  - 'lange (should be: lang)'
  - There is no mistake.
  answer: 0
  explanation: 'With ihr there is no stem change: ihr fahrt. Lena is er/sie/es, so schläft with ä is correct.
    "Lange" (for a long time) is the right word here.'
- id: de1-q-1312
  lesson: de1-hobbies
  topic: Hobbies
  stem: How do you say "I'm meeting friends and we're going to the cinema"?
  choices:
  - Ich trifft Freunde und wir gehen ins Kino.
  - Ich treffe Freunde und wir fahren Kino.
  - Ich treffe Freunde und gehen wir ins Kino.
  - Ich treffe Freunde und wir gehen ins Kino.
  answer: 3
  explanation: Ich treffe (ich has no stem change) and ins Kino gehen is the fixed chunk for going to
    the cinema. "Ich trifft" uses the er form; after und the word order doesn't change, so "und gehen
    wir" is wrong.
- id: de1-q-1401
  lesson: de1-modals-1
  module_quiz: true
  topic: Modal verbs
  stem: 'Complete: "___ du Klavier spielen?" (können)'
  choices:
  - Kannst
  - Kann
  - Könnst
  - Kennst
  answer: 0
  explanation: 'The du form of können is kannst: the vowel changes to a in the singular. "Kann" is the
    ich/er form, "könnst" keeps the plural vowel, and "kennst" comes from kennen (to know a person).'
- id: de1-q-1402
  lesson: de1-modals-1
  module_quiz: true
  topic: Sentence bracket
  stem: Which sentence is correct?
  choices:
  - Ich will lernen Gitarre.
  - Ich will Gitarre lernen.
  - Ich will zu Gitarre lernen.
  - Ich will Gitarre lerne.
  answer: 1
  explanation: 'With a modal verb the infinitive goes to the end: Ich will Gitarre lernen. English order
    ("will lernen Gitarre") is wrong, modals never take zu, and the second verb stays in the infinitive
    (lernen, not lerne).'
- id: de1-q-1403
  lesson: de1-modals-1
  topic: Modal verbs
  stem: 'Complete: "Er ___ am Wochenende eine Party feiern." (möchten)'
  choices:
  - möchtet
  - möchten
  - möchte
  - möchtest
  answer: 2
  explanation: 'Like all modal forms, the er form is the same as the ich form and has no -t: er möchte.
    "Möchtet" is ihr, "möchten" is wir/sie, "möchtest" is du.'
- id: de1-q-1404
  lesson: de1-modals-1
  topic: Modal verbs
  stem: What does "Ich will morgen kommen." mean?
  choices:
  - I will come tomorrow (future).
  - I can come tomorrow.
  - I would like to come tomorrow, please.
  - I want to come tomorrow.
  answer: 3
  explanation: 'Wollen means "to want": ich will = I want. It is a false friend: it never means the English
    future "I will". "I can" would be ich kann, and the polite "would like" is ich möchte.'
- id: de1-q-1405
  lesson: de1-modals-1
  module_quiz: true
  topic: Modal verbs
  stem: You are in a café. What is the most polite way to order?
  choices:
  - Ich will einen Tee.
  - Ich mag einen Tee.
  - Ich kann einen Tee.
  - Ich möchte einen Tee, bitte.
  answer: 3
  explanation: Möchte is the polite "would like" and is normal for ordering. "Ich will" is direct and
    sounds demanding; "ich mag" means "I like (tea in general)", and "ich kann" means "I can".
- id: de1-q-1406
  lesson: de1-modals-1
  topic: Modal verbs
  stem: 'Complete: "Wir ___ leider nicht Ski fahren." (können)'
  choices:
  - kann
  - könnt
  - können
  - kannen
  answer: 2
  explanation: 'The plural of a modal is regular and built from the infinitive: wir können. "Kann" is
    singular, "könnt" is the ihr form, and "kannen" doesn''t exist.'
- id: de1-q-1407
  lesson: de1-modals-1
  topic: Abilities and plans
  stem: 'Read: "Hallo Tim, ich mache am Freitag eine Party. Kannst du kommen? Du kannst auch deine Gitarre
    mitbringen. Jana kommt leider nicht. Lisa" What does Lisa ask Tim?'
  choices:
  - to play football on Friday
  - to help Jana with the party
  - to come to a party and maybe bring his guitar
  - to cook for the party
  answer: 2
  explanation: Kannst du kommen? asks if he can come, and Du kannst auch deine Gitarre mitbringen invites
    him to bring (mitbringen) his guitar. Jana is not coming (kommt leider nicht); there is nothing about
    football or cooking.
- id: de1-q-1408
  lesson: de1-modals-1
  topic: Abilities and plans
  stem: Choose the right answer. "Hast du Lust auf Kino?"
  choices:
  - Ja, gern! Wann?
  - Ja, ich bin Kino.
  - Nein, ich kann Kino.
  - Doch, ich habe Kino.
  answer: 0
  explanation: Hast du Lust auf …? means "Do you feel like …?", so a natural answer is Ja, gern! (Yes,
    I'd love to.) The other answers don't make sense; doch is only used to contradict a negative question.
- id: de1-q-1409
  lesson: de1-modals-1
  topic: Modal verbs
  stem: 'Find the mistake: "Meine Schwester kannt sehr gut kochen."'
  choices:
  - 'Meine (should be: Mein)'
  - 'kannt (should be: kann)'
  - 'kochen (should be: kocht)'
  - 'sehr (should be: viel)'
  answer: 1
  explanation: 'The er/sie/es form of a modal has no ending: sie kann. Meine is right for a feminine noun,
    the infinitive kochen at the end is right, and sehr gut is the normal way to say "very well".'
- id: de1-q-1410
  lesson: de1-modals-1
  topic: Sentence bracket
  stem: Which sentence means "I can't come today"?
  choices:
  - Ich kann heute nicht kommen.
  - Ich kann heute kommen nicht.
  - Ich nicht kann heute kommen.
  - Ich kann nicht heute kommen nicht.
  answer: 0
  explanation: 'The modal is in position 2, the infinitive at the end, and nicht goes just before the
    infinitive: Ich kann heute nicht kommen. Nicht can''t follow the infinitive or stand before the modal.'
- id: de1-q-1411
  lesson: de1-modals-1
  module_quiz: true
  topic: Sentence bracket
  stem: Which question is correct?
  choices:
  - Willst du kommen mit?
  - Willst du mitkommst?
  - Kommst du mitwollen?
  - Willst du mitkommen?
  answer: 3
  explanation: 'With a modal, a separable verb is joined again at the end in the infinitive: Willst du
    mitkommen? Without a modal you would say Kommst du mit?'
- id: de1-q-1412
  lesson: de1-modals-1
  topic: Abilities and plans
  stem: What does "Ich habe keine Lust." mean?
  choices:
  - I have no time.
  - I don't feel like it.
  - I have no idea.
  - I don't have a plan.
  answer: 1
  explanation: Lust haben means to feel like doing something, so keine Lust haben is "not to feel like
    it". No time = keine Zeit, no idea = keine Ahnung, no plan = keinen Plan.
- id: de1-q-1501
  lesson: de1-modals-2
  module_quiz: true
  topic: Modal verbs
  stem: 'Complete: "Du ___ morgen früh aufstehen." (müssen)'
  choices:
  - musst
  - müsst
  - muss
  - müssen
  answer: 0
  explanation: 'Müssen loses its umlaut in the singular: du musst. "Müsst" is the ihr form, "muss" is
    ich/er, and "müssen" is wir/sie/Sie.'
- id: de1-q-1502
  lesson: de1-modals-2
  module_quiz: true
  topic: Rules and signs
  stem: A sign says "Rauchen verboten". What does it mean?
  choices:
  - You have to smoke here.
  - Smoking is allowed here.
  - No smoking.
  - Smokers must wait here.
  answer: 2
  explanation: Verboten means forbidden, so Rauchen verboten = no smoking. "Allowed" would be erlaubt.
- id: de1-q-1503
  lesson: de1-modals-2
  module_quiz: true
  topic: Rules and signs
  stem: Which sentence means "You don't have to fill in the form"?
  choices:
  - Sie dürfen das Formular nicht ausfüllen.
  - Sie müssen das Formular nicht ausfüllen.
  - Sie sollen das Formular ausfüllen.
  - Sie können das Formular nicht ausfüllen.
  answer: 1
  explanation: 'Nicht müssen means "not necessary": Sie müssen das Formular nicht ausfüllen. The tempting
    "dürfen nicht" means you are not allowed to fill it in, which is the English "must not".'
- id: de1-q-1504
  lesson: de1-modals-2
  module_quiz: true
  topic: Rules and signs
  stem: Which sentence means "You mustn't park here"?
  choices:
  - Hier muss man nicht parken.
  - Hier soll man parken.
  - Hier kann man parken.
  - Hier darf man nicht parken.
  answer: 3
  explanation: 'English "must not" (forbidden) is German nicht dürfen: Hier darf man nicht parken. "Hier
    muss man nicht parken" only says you don''t have to park here.'
- id: de1-q-1505
  lesson: de1-modals-2
  topic: Modal verbs
  stem: 'Complete: "Im Kino ___ man leise sein." (müssen)'
  choices:
  - müssen
  - musst
  - muss
  - müsst
  answer: 2
  explanation: 'Man always takes the er/sie/es form: man muss. It may feel plural ("people"), but "man
    müssen" is wrong. "Musst" is du and "müsst" is ihr.'
- id: de1-q-1506
  lesson: de1-modals-2
  topic: Rules and signs
  stem: Which sentence is correct?
  choices:
  - Sie müssen das Formular ausfüllen.
  - Sie müssen ausfüllen das Formular.
  - Sie müssen das Formular füllen aus.
  - Sie müssen das Formular ausfüllt.
  answer: 0
  explanation: 'The infinitive goes to the end, and a separable verb is written as one word there: … das
    Formular ausfüllen. The prefix only separates when ausfüllen itself is the conjugated verb (Sie füllen
    das Formular aus).'
- id: de1-q-1507
  lesson: de1-modals-2
  topic: Polite requests
  stem: You want to ask politely if you may open the window. What do you say?
  choices:
  - Ich muss das Fenster öffnen.
  - Darf ich das Fenster öffnen?
  - Du sollst das Fenster öffnen.
  - Das Fenster ist verboten.
  answer: 1
  explanation: Darf ich …? asks for permission politely. "Ich muss …" says it is necessary for you, and
    "Du sollst …" tells someone else what to do.
- id: de1-q-1508
  lesson: de1-modals-2
  topic: Rules and signs
  stem: 'Read the notice: "In der Bibliothek muss man leise sein. Essen und Trinken sind verboten, aber
    Wasser dürfen Sie trinken. Die Bibliothek schließt um 20 Uhr." (Bibliothek = library) What is allowed?'
  choices:
  - eating
  - talking loudly
  - drinking water
  - staying until 10 p.m.
  answer: 2
  explanation: Wasser dürfen Sie trinken = you may drink water. Eating is verboten, you must be quiet
    (leise), and the library closes (schließt) at 20 Uhr, which is 8 p.m.
- id: de1-q-1509
  lesson: de1-modals-2
  topic: Modal verbs
  stem: 'Your doctor wants you to drink a lot of water. Complete: "Mein Arzt sagt, ich ___ viel Wasser trinken."'
  choices:
  - soll
  - darf
  - mag
  - will
  answer: 0
  explanation: 'Sollen passes on what another person (here the doctor) wants you to do: ich soll. Darf
    would mean you are allowed to, and will is your own wish, not the doctor''s.'
- id: de1-q-1510
  lesson: de1-modals-2
  topic: Rules and signs
  stem: 'Find the mistake: "Man müssen hier pünktlich sein."'
  choices:
  - 'Man (should be: Mann)'
  - 'müssen (should be: muss)'
  - 'hier (should be: her)'
  - 'pünktlich (should be: pünktlichen)'
  answer: 1
  explanation: 'Man takes the er/sie/es form: Man muss hier pünktlich sein. "Mann" with two n''s is a
    man (a person), and adjectives after sein have no ending at A1.'
- id: de1-q-1511
  lesson: de1-modals-2
  topic: Polite requests
  stem: Choose the right answer. "Darf ich hier warten?"
  choices:
  - Ja, du musst nicht.
  - Nein, ich warte.
  - Ja, das ist ein Termin.
  - Ja, natürlich. Bitte!
  answer: 3
  explanation: 'The person asks for permission, so a natural answer gives it: Ja, natürlich. "Du musst
    nicht" (you don''t have to) doesn''t fit a request for permission, and the other answers don''t answer
    the question.'
- id: de1-q-1512
  lesson: de1-modals-2
  topic: Rules and signs
  stem: What does "pünktlich" mean?
  choices:
  - quiet
  - important
  - allowed
  - on time
  answer: 3
  explanation: 'Pünktlich means on time or punctual: Der Termin ist um neun. Wir müssen pünktlich sein.
    Quiet is leise or ruhig, important is wichtig, allowed is erlaubt.'
- id: de1-q-1601
  lesson: de1-dates-weather
  module_quiz: true
  topic: Dates and ordinal numbers
  stem: How do you say "on the third of October"?
  choices:
  - am dritten Oktober
  - am drei Oktober
  - im dritten Oktober
  - am dreiten Oktober
  answer: 0
  explanation: 'On a date you use am + ordinal with -en: am dritten Oktober. Dates need the ordinal, not
    the plain number drei; im is for months alone (im Oktober); and the ordinal of 3 is irregular: dritte,
    not "dreite".'
- id: de1-q-1602
  lesson: de1-dates-weather
  module_quiz: true
  topic: Dates and ordinal numbers
  stem: 'Complete: "Heute ist der ___ Mai." (1.)'
  choices:
  - ersten
  - erste
  - einste
  - eins
  answer: 1
  explanation: 'After der the ordinal ends in -e: der erste Mai. The -en ending (ersten) is used after
    am: am ersten Mai. The ordinal of 1 is irregular: erste.'
- id: de1-q-1603
  lesson: de1-dates-weather
  topic: Dates and ordinal numbers
  stem: 'Complete: "Ich habe ___ Juli Geburtstag." (in July)'
  choices:
  - am
  - um
  - im
  - in
  answer: 2
  explanation: 'With months and seasons you use im: im Juli. Am goes with a day or date (am 5. Juli),
    um with clock times, and "in Juli" without the m is a typical mistake.'
- id: de1-q-1604
  lesson: de1-dates-weather
  topic: Weather
  stem: What does "Es schneit und es ist sehr kalt." mean?
  choices:
  - It is raining and cool.
  - The sun is shining.
  - It is windy and warm.
  - It is snowing and very cold.
  answer: 3
  explanation: Es schneit = it is snowing (schneien), kalt = cold. Raining would be es regnet, and the
    sun shining is die Sonne scheint.
- id: de1-q-1605
  lesson: de1-dates-weather
  module_quiz: true
  topic: Accusative prepositions
  stem: Which sentence is correct?
  choices:
  - Das Geschenk ist für mein Bruder.
  - Das Geschenk ist für meinem Bruder.
  - Das Geschenk ist für meinen Bruder.
  - Das Geschenk ist für meiner Bruder.
  answer: 2
  explanation: 'Für always takes the accusative, and masculine words change: mein → meinen. "Mein Bruder"
    is the nominative; "meinem" is dative, which für never takes.'
- id: de1-q-1606
  lesson: de1-dates-weather
  topic: Dates and ordinal numbers
  stem: A German form shows the date 04.07. Which date is it?
  choices:
  - the 4th of July
  - the 7th of April
  - the 4th of June
  - the 7th of March
  answer: 0
  explanation: 'Germans write the day first, then the month: 04.07. is der vierte Juli, the 4th of July.
    Reading it the American way (April 7th) is a common mistake.'
- id: de1-q-1607
  lesson: de1-dates-weather
  topic: Dates and ordinal numbers
  stem: Which ordinal number is spelled correctly?
  choices:
  - dreite
  - achtte
  - zweiste
  - siebte
  answer: 3
  explanation: 'Siebte (7th) is right. The ordinal of 3 is dritte, of 8 is achte with one t, and numbers
    below 20 add -te, not -ste: zweite.'
- id: de1-q-1608
  lesson: de1-dates-weather
  topic: Invitations
  stem: 'Read: "Hallo Max, am Samstag habe ich Geburtstag und ich mache eine Party. Sie fängt um 19 Uhr
    an. Kannst du Musik mitbringen? Eva" When does the party start?'
  choices:
  - on Sunday at 9 p.m.
  - on Saturday at 7 p.m.
  - on Saturday at 9 a.m.
  - on Friday at 7 p.m.
  answer: 1
  explanation: Am Samstag = on Saturday, and um 19 Uhr is 7 p.m. in the 24-hour clock. Don't confuse 19
    (neunzehn) with 9.
- id: de1-q-1609
  lesson: de1-dates-weather
  module_quiz: true
  topic: Invitations
  stem: A friend invites you, but you have to work. What do you say?
  choices:
  - Ja, gern! Ich komme.
  - Herzlichen Glückwunsch!
  - Leider kann ich nicht. Ich muss arbeiten.
  - Ich habe keinen Geburtstag.
  answer: 2
  explanation: 'To decline politely, say leider (unfortunately) and give a reason: Leider kann ich nicht.
    Ich muss arbeiten. "Ja, gern" accepts, and Herzlichen Glückwunsch is for congratulating.'
- id: de1-q-1610
  lesson: de1-dates-weather
  topic: Weather
  stem: 'Find the mistake: "Im Winter es schneit oft."'
  choices:
  - 'Im (should be: In)'
  - 'es schneit (should be: schneit es)'
  - 'oft (should be: often)'
  - 'Winter (should be: winter)'
  answer: 1
  explanation: 'When a time phrase like im Winter comes first, the verb stays in position 2 and the subject
    follows: Im Winter schneit es oft. Im is right with seasons, and nouns like Winter are capitalized.'
- id: de1-q-1611
  lesson: de1-dates-weather
  topic: Invitations
  stem: What do you say to someone on their birthday?
  choices:
  - Gute Besserung!
  - Viel Glück im Geburtstag!
  - Guten Geburtstag!
  - Herzlichen Glückwunsch zum Geburtstag!
  answer: 3
  explanation: The standard phrase is Herzlichen Glückwunsch zum Geburtstag! "Guten Geburtstag" is a word-for-word
    copy of English and isn't used; Gute Besserung means "get well soon".
- id: de1-q-1612
  lesson: de1-dates-weather
  topic: Accusative prepositions
  stem: 'Complete: "Wir gehen ___ den Park." (through)'
  choices:
  - durch
  - für
  - ohne
  - um
  answer: 0
