# German A1, module 2 (round 2): new question types for the core lessons, and the honors lessons.

# --- 05 de1-nouns-gender ---
- id: de1-m2-r2-q01
  lesson: de1-nouns-gender
  type: text
  module_quiz: true
  topic: Articles
  stem: 'Write the definite article ("the") for each noun: ___ Zeitung (newspaper), ___ Handy (mobile phone), ___ Stuhl (chair).'
  accept:
    - [die]
    - [das]
    - [der]
  explanation: |-
    die Zeitung: -ung nouns are always feminine. das Handy: neuter, like many English loanwords in -y. der Stuhl: masculine, a noun to learn with its article (plural die Stühle).
- id: de1-m2-r2-q02
  lesson: de1-nouns-gender
  type: match
  topic: Plurals
  stem: 'Match each noun to its plural.'
  pairs:
    - [der Tisch, die Tische]
    - [das Buch, die Bücher]
    - [die Lampe, die Lampen]
    - [das Handy, die Handys]
    - [der Schlüssel, die Schlüssel]
  distractors: [die Tischs, die Buchs]
  explanation: |-
    Tisch adds -e, Buch takes an umlaut and -er, Lampe (feminine in -e) adds -n, the loanword Handy adds -s, and Schlüssel (masculine in -el) adds nothing: only the article die shows it is plural. German rarely adds -s to ordinary nouns, so die Tischs and die Buchs are wrong.
- id: de1-m2-r2-q03
  lesson: de1-nouns-gender
  module_quiz: true
  topic: Articles
  stem: 'Which nouns are feminine? Select all that apply.'
  choices: [Zeitung, Fenster, Tür, Mädchen, Brille]
  answer: [0, 2, 4]
  explanation: |-
    die Zeitung (-ung is always feminine), die Tür and die Brille are feminine. das Fenster is neuter even though it ends in -er, and das Mädchen is neuter because -chen nouns are always neuter.
- id: de1-m2-r2-q04
  lesson: de1-nouns-gender
  type: label
  topic: Articles
  stem: 'Name the numbered things in this office corner, with their articles.'
  image: {src: images/de1-m2-desk-blank.svg, alt: 'An office corner with a window, a wall clock, a door, a lamp on a table, a chair and a bag on the floor. Six of the things are numbered.'}
  labels:
    - {x: 18, y: 28, text: das Fenster}
    - {x: 47, y: 21, text: die Uhr}
    - {x: 89, y: 56, text: die Tür}
    - {x: 34, y: 40, text: die Lampe}
    - {x: 75, y: 69, text: der Stuhl}
    - {x: 17, y: 80, text: die Tasche}
  distractors: [das Heft, die Brille]
  explanation: |-
    1 is the window (das Fenster), 2 the clock (die Uhr), 3 the door (die Tür), 4 the lamp (die Lampe), 5 the chair (der Stuhl) and 6 the bag (die Tasche). There is no exercise book (das Heft) or pair of glasses (die Brille) in the picture.
- id: de1-m2-r2-q05
  lesson: de1-nouns-gender
  type: order
  topic: Articles
  stem: 'Put the words in order to say "Those are Anna''s books." The capitalised word comes first.'
  items: [Das, sind, die, Bücher, von, Anna]
  explanation: |-
    Das sind … is the pattern for several things, and "die Bücher von Anna" (the books of Anna) is a simple way to say Anna's books. The verb sind stands in second place.

# --- 06 de1-family ---
- id: de1-m2-r2-q06
  lesson: de1-family
  type: label
  module_quiz: true
  topic: Family
  stem: 'This is Lena''s family tree. Lena is "ich". Name each numbered person from Lena''s point of view.'
  image: {src: images/de1-m2-family-tree-blank.svg, alt: 'A family tree with first names only. Top row: Klaus and Helga. Middle row: their son Peter and his wife Sabine. Bottom row: their children Jonas, Lena (ich) and Mia. Six people are numbered.'}
  labels:
    - {x: 22, y: 16.7, text: der Opa}
    - {x: 64, y: 16.7, text: die Oma}
    - {x: 22, y: 45.2, text: der Vater}
    - {x: 64, y: 45.2, text: die Mutter}
    - {x: 14, y: 83.3, text: der Bruder}
    - {x: 72, y: 83.3, text: die Schwester}
  distractors: [der Sohn, die Tochter]
  explanation: |-
    Klaus and Helga are the parents of Lena's father, so they are her Opa and Oma. Peter and Sabine are her Vater and Mutter. Jonas and Mia are her Bruder and Schwester. From Peter's point of view Lena would be die Tochter, but the question asks from Lena's.
- id: de1-m2-r2-q07
  lesson: de1-family
  type: text
  topic: Possessives
  stem: 'Complete with the possessive article: "Paul und ___ Schwester" (his) and "Anna und ___ Vater" (her).'
  accept:
    - [seine]
    - [ihr]
  explanation: |-
    The owner chooses the word: Paul is a man, so sein; Anna is a woman, so ihr. The thing owned chooses the ending: Schwester is feminine, so seine; Vater is masculine, so ihr with no ending.
- id: de1-m2-r2-q08
  lesson: de1-family
  type: match
  topic: Possessives
  stem: 'Match each pronoun to its possessive article (the basic form, as before a masculine noun).'
  pairs:
    - [ich, mein]
    - [du, dein]
    - [wir, unser]
    - ['ihr (you, plural)', euer]
    - ['Sie (you, formal)', Ihr]
  distractors: [sein, eure]
  explanation: |-
    ich → mein, du → dein, wir → unser, ihr → euer, Sie → Ihr (with a capital I). sein belongs to er and es. eure is the form of euer with an ending, before a feminine or plural noun.
- id: de1-m2-r2-q09
  lesson: de1-family
  module_quiz: true
  topic: Possessives
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Wir haben eine Katze.', 'Er habt zwei Brüder.', 'Meine Eltern sind geschieden.', 'Das ist euere Mutter.', 'Habt ihr Geschwister?']
  answer: [0, 2, 4]
  explanation: |-
    "Wir haben", "Meine Eltern sind" (Eltern is plural) and "Habt ihr" are right. The er form of haben is hat, not habt, and euer drops its second e before an ending: eure Mutter, not euere.
- id: de1-m2-r2-q10
  lesson: de1-family
  type: order
  topic: Family
  stem: 'Put the words in order to ask "Does your sister have a dog?" The capitalised word comes first.'
  items: [Hat, deine, Schwester, einen, Hund]
  explanation: |-
    A yes/no question starts with the verb: Hat deine Schwester einen Hund? After haben, masculine ein becomes einen (lesson 9 explains why).

# --- 07 de1-jobs-languages ---
- id: de1-m2-r2-q11
  lesson: de1-jobs-languages
  type: text
  module_quiz: true
  topic: Verbs
  stem: 'Write the correct form of sprechen: "Du ___ sehr gut Deutsch." "Mein Vater ___ Polnisch."'
  accept:
    - [sprichst]
    - [spricht]
  explanation: |-
    sprechen changes its stem vowel from e to i in the du and er/sie/es forms only: du sprichst, er spricht. "Mein Vater" is an er form.
- id: de1-m2-r2-q12
  lesson: de1-jobs-languages
  type: match
  topic: Languages
  stem: 'Match each country to the main language spoken there.'
  pairs:
    - [Frankreich, Französisch]
    - [Spanien, Spanisch]
    - [Polen, Polnisch]
    - [Österreich, Deutsch]
    - [die Türkei, Türkisch]
  distractors: [Englisch, Italienisch]
  explanation: |-
    Most language names end in -isch: Spanisch, Polnisch, Türkisch, Französisch. Austria is German-speaking, so the language there is Deutsch; there is no language called Österreichisch.
- id: de1-m2-r2-q13
  lesson: de1-jobs-languages
  topic: Jobs
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Ich bin Ingenieurin.', 'Ich arbeite als Kellnerin.', 'Ich spriche Englisch.', 'Ich komme aus Türkei.', 'Ich komme aus der Schweiz.']
  answer: [0, 1, 4]
  explanation: |-
    A job after sein or als needs no article, so the first two are right, and die Schweiz keeps its article: aus der Schweiz. The ich form of sprechen doesn't change its vowel (ich spreche), and die Türkei needs its article too: aus der Türkei.
- id: de1-m2-r2-q14
  lesson: de1-jobs-languages
  type: order
  topic: Languages
  stem: 'Put the words in order to ask "Which languages do you speak?" The capitalised word comes first.'
  items: [Welche, Sprachen, sprichst, du]
  explanation: |-
    In a W-question the question phrase (Welche Sprachen) comes first and the verb second: Welche Sprachen sprichst du?
- id: de1-m2-r2-q15
  lesson: de1-jobs-languages
  type: text
  topic: Jobs
  stem: 'Write the female job titles: der Lehrer → die ___, der Arzt → die ___.'
  accept:
    - [Lehrerin]
    - [Ärztin, Aerztin]
  explanation: |-
    Female job titles add -in: die Lehrerin. Some words also take an umlaut: der Arzt → die Ärztin.

# --- 08 de1-describing ---
- id: de1-m2-r2-q16
  lesson: de1-describing
  type: label
  topic: Adjectives
  stem: 'Name the colour of each numbered square.'
  image: {src: images/de1-m2-colours-blank.svg, alt: 'Eight colour squares in two rows. Top row: red, blue, green, yellow. Bottom row: black, white, grey, brown. Six of them are numbered.'}
  labels:
    - {x: 13.9, y: 24.3, text: rot}
    - {x: 37.9, y: 24.3, text: blau}
    - {x: 61.9, y: 24.3, text: grün}
    - {x: 86, y: 24.3, text: gelb}
    - {x: 13.9, y: 70.3, text: schwarz}
    - {x: 86, y: 70.3, text: braun}
  distractors: [grau, weiß]
  explanation: |-
    1 rot (red), 2 blau (blue), 3 grün (green), 4 gelb (yellow), 5 schwarz (black), 6 braun (brown). The two squares without numbers are weiß (white) and grau (grey).
- id: de1-m2-r2-q17
  lesson: de1-describing
  type: text
  module_quiz: true
  topic: Negation
  stem: 'Complete with kein or nicht: "Das ist ___ Hund, das ist eine Katze." "Das Buch ist ___ interessant."'
  accept:
    - [kein]
    - [nicht]
  explanation: |-
    "ein Hund" becomes "kein Hund": kein negates a noun with ein. An adjective is negated with nicht, placed right before it: nicht interessant.
- id: de1-m2-r2-q18
  lesson: de1-describing
  type: match
  topic: Adjectives
  stem: 'Match each adjective to its opposite.'
  pairs:
    - [groß, klein]
    - [teuer, billig]
    - [neu, alt]
    - [richtig, falsch]
    - [interessant, langweilig]
  distractors: [schnell]
  explanation: |-
    groß/klein (big/small), teuer/billig (expensive/cheap), neu/alt (new/old), richtig/falsch (right/wrong), interessant/langweilig (interesting/boring). The opposite of schnell (fast) is langsam.
- id: de1-m2-r2-q19
  lesson: de1-describing
  topic: Negation
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Das Auto ist rot.', 'Ich habe keine Zeit.', 'Das ist nicht ein Hund.', 'Die Tasche ist zu teuer.', 'Ich nicht verstehe.']
  answer: [0, 1, 3]
  explanation: |-
    Adjectives after sein have no ending (ist rot), kein negates a noun with no article (keine Zeit), and zu means "too". "nicht ein" must be kein (Das ist kein Hund), and German doesn't put nicht before the verb: Ich verstehe nicht.
- id: de1-m2-r2-q20
  lesson: de1-describing
  type: order
  module_quiz: true
  topic: Negation
  stem: 'Put the words in order to say "That isn''t my key." The capitalised word comes first.'
  items: [Das, ist, nicht, mein, Schlüssel]
  explanation: |-
    A noun with a possessive (mein Schlüssel) is negated with nicht, which goes right before the part it negates: Das ist nicht mein Schlüssel.
- id: de1-m2-r2-q21
  lesson: de1-describing
  topic: Negation
  stem: 'Your friend asks: "Ist das nicht dein Handy?" It IS your phone. What do you answer? "___, das ist mein Handy."'
  choices: ['Ja', 'Nein', 'Doch', 'Nicht']
  answer: 2
  explanation: |-
    To contradict a negative question, German says doch: Doch, das ist mein Handy. Ja doesn't fit after a negative question, and nein would agree that it isn't your phone.

# --- 08h1 de1-m2-h-people-gender (honors) ---
- id: de1-m2-r2-h01
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'Why is "Mädchen" (girl) a neuter noun?'
  choices: ['Because all words for young people are neuter.', 'Because it ends in -chen, and -chen nouns are always neuter.', 'Because the article das means "that girl".', 'It isn''t neuter: the singular is die Mädchen.']
  answer: 1
  explanation: |-
    Nouns ending in -chen are always neuter, whatever they mean: das Mädchen, das Brötchen. Not all words for young people are neuter (der Junge, boy, is masculine), and die Mädchen is the plural.
- id: de1-m2-r2-h02
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'Choose the textbook pronoun: "Das Mädchen heißt Lea. ___ ist zehn Jahre alt."'
  choices: ['Er', 'Ihr', 'Ihm', 'Es']
  answer: 3
  explanation: |-
    The grammar rule says the pronoun follows the noun's gender: das Mädchen → es. In everyday speech many people say sie here, thinking of the girl, but er (masculine) is wrong, and ihr and ihm are not subject pronouns for one person.
- id: de1-m2-r2-h03
  lesson: de1-m2-h-people-gender
  type: text
  topic: Jobs
  stem: 'Write the female forms: der Koch → die ___, der Kaufmann → die ___.'
  accept:
    - [Köchin, Koechin]
    - [Kauffrau]
  explanation: |-
    Koch adds -in and takes an umlaut: die Köchin. Words in -mann change -mann to -frau: die Kauffrau (never Kaufmännin).
- id: de1-m2-r2-h04
  lesson: de1-m2-h-people-gender
  type: text
  topic: Jobs
  stem: 'Write the plural: die Ärztin → die ___'
  accept: [Ärztinnen, Aerztinnen]
  explanation: |-
    Every -in word adds -nen in the plural, so it has a double n: die Ärztinnen.
- id: de1-m2-r2-h05
  lesson: de1-m2-h-people-gender
  type: match
  topic: Jobs
  stem: 'Match each masculine job title to its female form.'
  pairs:
    - [der Kollege, die Kollegin]
    - [der Feuerwehrmann, die Feuerwehrfrau]
    - [der Arzt, die Ärztin]
    - [der Polizist, die Polizistin]
    - [der Kaufmann, die Kauffrau]
  distractors: [die Kaufmännin, die Kollegein]
  explanation: |-
    Kollege drops its -e before -in; -mann becomes -frau; Arzt takes an umlaut and -in; Polizist simply adds -in. Kaufmännin and Kollegein are not words.
- id: de1-m2-r2-h06
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'Which of these always include both men and women? Select all that apply.'
  choices: ['Lehrerinnen und Lehrer', 'die Lehrkräfte', 'Lehrer*innen', 'die Lehrerinnen']
  answer: [0, 1, 2]
  explanation: |-
    The paired form names both groups, die Lehrkräfte is a neutral word for teaching staff, and the gender star is meant to include everyone. die Lehrerinnen means female teachers only.
- id: de1-m2-r2-h07
  lesson: de1-m2-h-people-gender
  topic: Jobs
  stem: 'A job advert says "Verkäufer (m/w/d)". What does (m/w/d) tell you?'
  choices: ['The job is only for men, because it says Verkäufer.', 'The job is on Monday, Wednesday and Thursday.', 'The job is open to everyone: männlich, weiblich, divers.', 'The job needs three languages.']
  answer: 2
  explanation: |-
    (m/w/d) stands for männlich, weiblich, divers: male, female, diverse. German law says job adverts must not shut anyone out because of their gender, so the letters show the job is open to all.
- id: de1-m2-r2-h08
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'What did the Council for German Orthography (Rat für deutsche Rechtschreibung) decide in 2023 about signs like the gender star?'
  choices: ['It made them compulsory in official texts.', 'It did not make them part of official spelling.', 'It banned them in all German-speaking countries.', 'It replaced the paired form with them.']
  answer: 1
  explanation: |-
    In 2023 the Council decided not to add the star, colon and similar signs to official spelling. It didn't ban them: many universities, cities and companies still use them, while in 2024 Bavaria and Hesse told their schools (and, in Bavaria, state offices) not to.
- id: de1-m2-r2-h09
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'You write a formal letter to a company and don''t know who will read it. Which greeting is accepted everywhere?'
  choices: ['Liebe Leute,', 'Hallo Kollegen,', 'Sehr geehrte Damen,', 'Sehr geehrte Damen und Herren,']
  answer: 3
  explanation: |-
    Sehr geehrte Damen und Herren ("Dear Sir or Madam") is a paired form and the standard opening of a formal letter. Liebe Leute and Hallo are informal, and Sehr geehrte Damen addresses women only.
- id: de1-m2-r2-h10
  lesson: de1-m2-h-people-gender
  topic: Jobs
  stem: 'Read the advert. Which statement is true?'
  image: {src: images/de1-m2-job-ad.svg, alt: 'A job advert on a notice board: Bäckerei Sonnenschein, Leipzig. Wir suchen: Verkäuferin / Verkäufer (m/w/d), Bäckerin / Bäcker (m/w/d). Unser Team: 12 Kolleginnen und Kollegen. Fragen? Bitte im Laden bei Frau Nowak.'}
  choices: ['The bakery is looking for shop staff and bakers of any gender.', 'The bakery is looking for 12 new colleagues.', 'Frau Nowak is looking for a job.', 'The bakery only wants women.']
  answer: 0
  explanation: |-
    "Wir suchen" means "we are looking for", and both jobs are given in the paired form with (m/w/d). The 12 Kolleginnen und Kollegen are the team the bakery already has, and Frau Nowak is the person to ask.
- id: de1-m2-r2-h11
  lesson: de1-m2-h-people-gender
  topic: Jobs
  stem: 'Read: "Frau Demir ist Lehrerin für Englisch. Herr Wolf ist Lehrer für Mathe. Er spricht auch Polnisch. Frau Kim ist unsere neue Schulärztin." Who speaks Polish?'
  choices: ['Frau Demir', 'Frau Kim', 'nobody', 'Herr Wolf']
  answer: 3
  explanation: |-
    "Er spricht auch Polnisch" follows the sentence about Herr Wolf, and er (he) can only mean him. Frau Demir teaches English, and Frau Kim is the school doctor.
- id: de1-m2-r2-h12
  lesson: de1-m2-h-people-gender
  type: order
  topic: People and gender
  stem: 'Put the words in order to ask "Is the girl from Poland?" The capitalised word comes first.'
  items: [Ist, das, Mädchen, aus, Polen]
  explanation: |-
    A yes/no question starts with the verb: Ist das Mädchen aus Polen? Mädchen takes das because it is neuter.
- id: de1-m2-r2-h13
  lesson: de1-m2-h-people-gender
  type: text
  topic: People and gender
  stem: 'Complete the paired form at the start of a school letter: "Liebe Schülerinnen und ___!"'
  accept: [Schüler, Schueler]
  explanation: |-
    The paired form names the female and the male group: Schülerinnen und Schüler. The masculine plural of der Schüler has no ending.
- id: de1-m2-r2-h14
  lesson: de1-m2-h-people-gender
  topic: People and gender
  stem: 'Which sentence contains a mistake?'
  choices: ['Ich bin Kauffrau.', 'Die Ärztinnen sind sehr gut.', 'Die Mädchen ist neu.', 'Mein Bruder ist Feuerwehrmann.']
  answer: 2
  explanation: |-
    Mädchen is neuter: Das Mädchen ist neu. "Die Mädchen" is the plural and would need sind. The other sentences are right: no article before a job, and -innen with double n.

# --- 08h2 de1-m2-h-family-names (honors) ---
- id: de1-m2-r2-h15
  lesson: de1-m2-h-family-names
  type: label
  topic: Family
  stem: 'This is Ben''s family. Ben is "ich", and Lisa is his twin. Name each numbered person from Ben''s point of view.'
  image: {src: images/de1-m2-patchwork-blank.svg, alt: 'A family tree with first names only. Top row: Anja is married to Markus; Markus and Julia are divorced; Julia is married to Tom. Markus and Julia''s children are Ben (ich) and Lisa. Julia and Tom''s child is Emma. Six people are numbered.'}
  labels:
    - {x: 3.8, y: 17.5, text: die Stiefmutter}
    - {x: 26.3, y: 17.5, text: der Vater}
    - {x: 58, y: 17.5, text: die Mutter}
    - {x: 82, y: 17.5, text: der Stiefvater}
    - {x: 49, y: 77.5, text: die Zwillingsschwester}
    - {x: 80, y: 77.5, text: die Halbschwester}
  distractors: [die Tante, der Halbbruder]
  explanation: |-
    Markus and Julia are Ben's parents. Anja is his father's new wife (Stiefmutter), and Tom is his mother's new husband (Stiefvater). Lisa has the same parents and is his twin (Zwillingsschwester). Emma shares only one parent, Julia, so she is his Halbschwester.
- id: de1-m2-r2-h16
  lesson: de1-m2-h-family-names
  type: text
  topic: Names and whose
  stem: 'Write "Anna''s brother" in German: ___ Bruder'
  accept: [Annas]
  explanation: |-
    After a name German adds -s with no apostrophe and no article: Annas Bruder. In speech you can also say der Bruder von Anna.
- id: de1-m2-r2-h17
  lesson: de1-m2-h-family-names
  type: text
  topic: Names and whose
  stem: 'Write "Max''s sister" in German: ___ Schwester'
  accept: [Max']
  explanation: |-
    Max ends in x, an s sound, so it takes only an apostrophe: Max' Schwester. In speech: die Schwester von Max.
- id: de1-m2-r2-h18
  lesson: de1-m2-h-family-names
  topic: Names and whose
  stem: 'Which are correct ways to say "Jonas''s dog"? Select all that apply.'
  choices: ['Jonas'' Hund', 'der Hund von Jonas', 'Jonass Hund', 'der Jonas'' Hund', 'Jonas''s Hund']
  answer: [0, 1]
  explanation: |-
    A name ending in s takes only an apostrophe, and von + name is common in speech. You never add a second s (Jonass, Jonas's), and the noun after the name takes no article.
- id: de1-m2-r2-h19
  lesson: de1-m2-h-family-names
  type: match
  topic: Family
  stem: 'Match each word to its meaning.'
  pairs:
    - [der Stiefvater, your mother's new husband]
    - [die Halbschwester, a sister who shares one parent with you]
    - [das Einzelkind, a child with no brothers or sisters]
    - [der Zwilling, one of two children born together]
    - [der Spitzname, a short or friendly name like Kathi]
  distractors: [your mother's sister]
  explanation: |-
    Stief- is for a parent's new partner, Halb- for a sibling who shares one parent. Einzelkind is an only child, Zwilling a twin, Spitzname a nickname. Your mother's sister is your aunt, die Tante.
- id: de1-m2-r2-h20
  lesson: de1-m2-h-family-names
  type: order
  topic: Family
  stem: 'Put the words in order to say "My parents are separated." The capitalised word comes first.'
  items: [Meine, Eltern, sind, getrennt]
  explanation: |-
    Eltern is plural, so the possessive is meine and the verb sind. Like any adjective after sein, getrennt has no ending.
- id: de1-m2-r2-h21
  lesson: de1-m2-h-family-names
  topic: Names and whose
  stem: 'Which is the everyday word for "last name"?'
  choices: ['der Vorname', 'der Spitzname', 'der Nachname', 'die Unterschrift']
  answer: 2
  explanation: |-
    der Nachname is the everyday word; der Familienname means the same and is used on forms. der Vorname is the first name, der Spitzname a nickname and die Unterschrift a signature.
- id: de1-m2-r2-h22
  lesson: de1-m2-h-family-names
  topic: Names and whose
  stem: 'Many German surnames are old job titles. What did "Schneider" originally mean?'
  choices: ['tailor', 'miller', 'smith', 'baker']
  answer: 0
  explanation: |-
    Schneider means tailor (schneiden = to cut). Müller is a miller, Schmidt a smith and Becker a baker.
- id: de1-m2-r2-h23
  lesson: de1-m2-h-family-names
  topic: Family
  stem: 'Lisa is a girl and a twin. Which sentence is correct?'
  choices: ['Lisa ist eine Zwilling.', 'Lisa ist ein Zwilling.', 'Lisa ist eine Zwillingin.', 'Lisa ist das Zwilling.']
  answer: 1
  explanation: |-
    der Zwilling is masculine for girls too, so "a twin" is ein Zwilling. Lisa is also meine Zwillingsschwester, a compound whose last part decides the gender.
- id: de1-m2-r2-h24
  lesson: de1-m2-h-family-names
  topic: Family
  stem: 'Why is it "die Zwillingsschwester"?'
  choices: ['Because the linking s makes a word feminine.', 'Because the first part, der Zwilling, decides the gender.', 'Because all words for family members are feminine.', 'Because the last part, die Schwester, decides the gender.']
  answer: 3
  explanation: |-
    In a compound noun the last part decides the gender: die Schwester → die Zwillingsschwester. The linking s only joins the parts; it carries no meaning or gender.
- id: de1-m2-r2-h25
  lesson: de1-m2-h-family-names
  topic: Family
  stem: 'Read: "Meine Eltern sind geschieden. Wir wohnen bei Mama und Tom. Tom ist mein Stiefvater. Papa ist wieder verheiratet." Who is Tom?'
  choices: ['the writer''s father', 'the writer''s mother''s husband', 'the writer''s half-brother', 'the writer''s uncle']
  answer: 1
  explanation: |-
    Tom is the Stiefvater: the mother's new husband. The father is Papa, who has a new wife, and the text says nothing about a half-brother or an uncle.
- id: de1-m2-r2-h26
  lesson: de1-m2-h-family-names
  topic: Names and whose
  stem: 'Which sentence is written correctly?'
  choices: ['Das ist Lena''s Familie.', 'Das ist die Lenas Familie.', 'Das ist Familie Lenas.', 'Das ist Lenas Familie.']
  answer: 3
  explanation: |-
    Name + s comes first, with no apostrophe and no article: Lenas Familie. The English-style apostrophe is a common mistake, and the noun after the name never takes der, die or das.
- id: de1-m2-r2-h27
  lesson: de1-m2-h-family-names
  topic: Names and whose
  stem: 'Which of these is NOT allowed for a married couple''s surnames in Germany?'
  choices: ['one shared surname', 'each keeps their own surname', 'a three-part name such as Müller-Schmidt-Weber', 'both use a double name such as Müller-Schmidt (since 2025)']
  answer: 2
  explanation: |-
    A couple can share one surname, keep their own, or, since the 2025 reform, both use a double name. Names with more than two parts are still not allowed.
- id: de1-m2-r2-h28
  lesson: de1-m2-h-family-names
  topic: Family
  stem: 'Ben talks about his father: "Papa ist wieder verheiratet. ___ Frau heißt Anja."'
  choices: ['Sein', 'Ihre', 'Seine', 'Ihr']
  answer: 2
  explanation: |-
    The owner is Papa, a man, so the word is sein. Frau is feminine, so it takes -e: Seine Frau. Ihre would mean "her" or "their".
