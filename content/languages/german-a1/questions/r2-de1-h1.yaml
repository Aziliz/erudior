# Round 2 questions for de1-h1 (honors module: Kultur und Alltag, lessons 90-93)
# --- 90: Ankommen: registering, appointments and letters from the Amt ----------------
- id: de1-h1-r2-h01
  lesson: de1-h-ankommen
  module_quiz: true
  topic: Registering and official letters
  stem: 'You move into a flat in Germany. By when must you register your address (die Anmeldung)?'
  choices: ['Within two weeks of moving in', 'Within three days of moving in', 'Within three months of moving in', 'Only when you start a job']
  answer: 0
  explanation: |-
    In Germany you have two weeks after moving in. Three days is the rule in Austria (the Meldezettel), not Germany. You register whether or not you have a job.
- id: de1-h1-r2-h02
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'Which form does your landlord or landlady give you for the Anmeldung?'
  choices: ['die Meldebescheinigung', 'die Wohnungsgeberbestätigung', 'die Steuer-ID', 'der Rundfunkbeitrag']
  answer: 1
  explanation: |-
    The "Wohnungsgeberbestätigung" (Wohnungsgeber = the person who provides the flat, Bestätigung = confirmation) confirms that you've moved in. The "Meldebescheinigung" is what the Bürgeramt gives you at the end; the Steuer-ID comes by post later; the Rundfunkbeitrag is the broadcasting fee.
- id: de1-h1-r2-h03
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'Read: "Ihr Termin ist am Dienstag, 20. Oktober, um 9:30 Uhr im Bürgeramt Mitte, Zimmer 104. Sie können nicht kommen? Dann sagen Sie den Termin bitte bis zum 19. Oktober ab." What should Lukas do if he can''t come?'
  choices: ['Go to room 104 on 19 October instead', 'Phone the Bürgeramt on 20 October at 9:30', 'Bring the forms on Monday', 'Cancel the appointment by 19 October']
  answer: 3
  explanation: |-
    "Absagen" means to cancel, and "bis zum 19. Oktober" means by 19 October. The letter doesn't offer another day or ask him to phone on the day itself.
- id: de1-h1-r2-h04
  lesson: de1-h-ankommen
  type: text
  topic: Abbreviations in official German
  stem: 'Abbreviations are read aloud as full words. Type what you say for "z. B.": ___'
  accept: [zum Beispiel]
  explanation: |-
    "z. B." stands for "zum Beispiel" (for example) and is always read as the full words, never as the letters "zet be".
- id: de1-h1-r2-h05
  lesson: de1-h-ankommen
  module_quiz: true
  type: match
  topic: Abbreviations in official German
  stem: 'Match each abbreviation to its full form.'
  pairs:
    - ['usw.', 'und so weiter']
    - ['ca.', 'circa']
    - ['ggf.', 'gegebenenfalls']
    - ['d. h.', 'das heißt']
    - ['u. a.', 'unter anderem']
  distractors: ['zum Beispiel', 'beziehungsweise']
  explanation: |-
    usw. = und so weiter (and so on); ca. = circa (about); ggf. = gegebenenfalls (if necessary); d. h. = das heißt (that is); u. a. = unter anderem (among other things). "Zum Beispiel" is z. B. and "beziehungsweise" is bzw.
- id: de1-h1-r2-h06
  lesson: de1-h-ankommen
  topic: Abbreviations in official German
  stem: 'A colleague writes: "Ich komme evtl. später." What does she mean?'
  choices: ['I''ll come later in the end.', 'I always come later.', 'I may come later.', 'I came later.']
  answer: 2
  explanation: |-
    evtl. = eventuell, which means "possibly", not "eventually". It's a classic false friend. The verb "komme" is present tense, so "I came" is wrong too.
- id: de1-h1-r2-h07
  lesson: de1-h-ankommen
  module_quiz: true
  topic: Abbreviations in official German
  stem: 'A letter from the Amt says: "Bitte bringen Sie Ihren Reisepass mit." What does "Ihren" mean here?'
  choices: ['her', 'their', 'your', 'our']
  answer: 2
  explanation: |-
    With a capital I, "Ihr/Ihre/Ihren" is the formal "your" that goes with Sie. "ihr" with a small i would mean "her" or "their". The ending -en is there because "Reisepass" is masculine and accusative.
- id: de1-h1-r2-h08
  lesson: de1-h-ankommen
  module_quiz: true
  type: label
  topic: Registering and official letters
  stem: 'Name the numbered parts of the entrance to a block of flats.'
  image: {src: images/de1-h1-entrance-blank.svg, alt: 'The entrance of a block of flats: a house number above the front door, a doorbell panel with six buttons to the right of the door, six post boxes on the wall to the left, and the front door with a glass panel. Four parts are numbered.'}
  labels:
    - {x: 50.0, y: 37.1, text: die Hausnummer}
    - {x: 65.0, y: 65.8, text: die Klingel}
    - {x: 25.4, y: 65.8, text: der Briefkasten}
    - {x: 47.2, y: 82.3, text: die Haustür}
  distractors: [das Fenster, der Keller]
  explanation: |-
    1 is the house number above the door (die Hausnummer), 2 the panel of doorbells (die Klingel), 3 the post boxes (der Briefkasten), and 4 the front door of the building (die Haustür). Put your name on the bell and the post box as soon as you move in, or the post can't be delivered.
- id: de1-h1-r2-h09
  lesson: de1-h-ankommen
  type: order
  topic: Registering and official letters
  stem: 'Put the words in order to say, politely and formally: "Please bring your passport."'
  items: [Bitte, bringen, Sie, Ihren Pass, 'mit.']
  explanation: |-
    "Bitte bringen Sie Ihren Pass mit." The formal imperative starts with the verb (after "bitte"), Sie follows it, and the separable prefix "mit" goes to the very end.
- id: de1-h1-r2-h10
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'Which of these do you usually bring to your Anmeldung appointment? Select all that apply.'
  choices: [your passport or ID card, the Wohnungsgeberbestätigung, the Anmeldeformular, your Steuer-ID letter, your Meldebescheinigung]
  answer: [0, 1, 2]
  explanation: |-
    You bring your passport or ID card, the landlord's confirmation and the registration form. The Steuer-ID isn't needed: after a first registration it is sent to you by post a few weeks later. The Meldebescheinigung is what you receive at the appointment, so you don't bring it.
- id: de1-h1-r2-h11
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'Which is the right name line for the address on a letter to Lukas Brandt?'
  choices: ['Herr Lukas Brandt', 'Herrn Lukas Brandt', 'Herren Lukas Brandt', 'Sehr geehrter Lukas Brandt']
  answer: 1
  explanation: |-
    In an address, "Herr" takes an extra -n: "Herrn Lukas Brandt". "Herr" without -n belongs in the greeting ("Sehr geehrter Herr Brandt,"), "Herren" is the plural (gentlemen), and "Sehr geehrter …" is a greeting, not an address.
- id: de1-h1-r2-h12
  lesson: de1-h-ankommen
  type: text
  topic: Registering and official letters
  stem: 'You leave Germany for good. Type the missing part of the verb for "to deregister": sich ___'
  accept: [abmelden]
  explanation: |-
    "Sich abmelden" is the opposite of "sich anmelden" (to register). Like anmelden, it's separable: "Ich melde mich ab."
- id: de1-h1-r2-h13
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'Who pays the Rundfunkbeitrag (the broadcasting fee)?'
  choices: ['Only households that own a TV', 'Every adult in the household separately', 'Only students and pensioners', 'Every household, one fee per household']
  answer: 3
  explanation: |-
    The Rundfunkbeitrag is one fee per household, whether or not it has a TV or radio. Flatmates share one fee instead of each paying.
- id: de1-h1-r2-h14
  lesson: de1-h-ankommen
  topic: Registering and official letters
  stem: 'At the Bürgeramt the official asks: "Haben Sie Ihren Pass dabei?" Which answer fits best?'
  choices: ['Ja, hier, bitte.', 'Ja, ich habe dabei.', 'Gern geschehen.', 'Nein, ich bin Pass.']
  answer: 0
  explanation: |-
    "Ja, hier, bitte." (Yes, here you are.) "Ich habe dabei" is missing the object ("Ich habe ihn dabei" would be right). "Gern geschehen" answers a thank-you, and "ich bin Pass" makes no sense.
# --- 91: Zusammen wohnen: neighbours, quiet hours and recycling ----------------------
- id: de1-h1-r2-h15
  lesson: de1-h-zusammen-wohnen
  module_quiz: true
  topic: House rules and quiet hours
  stem: 'A Hausordnung says: "Am Sonntag und an Feiertagen ist den ganzen Tag Ruhezeit." What does it mean?'
  choices: ['On Sundays you may only be loud in the afternoon.', 'On Sundays and public holidays it''s quiet time all day.', 'On Sundays and public holidays the building is locked.', 'Quiet time ends at 7 on public holidays.']
  answer: 1
  explanation: |-
    "Den ganzen Tag" means all day, and "Feiertage" are public holidays. So no drilling, loud music or bottle throwing all day on those days.
- id: de1-h1-r2-h16
  lesson: de1-h-zusammen-wohnen
  type: order
  topic: Infinitive commands and Wohin?
  stem: 'Build the notice "Please lock the front door!" as an infinitive command.'
  items: [Bitte, die Haustür, 'abschließen!']
  explanation: |-
    "Bitte die Haustür abschließen!" In an infinitive command the infinitive comes last, and a separable verb stays in one piece: "abschließen", never "schließen … ab".
- id: de1-h1-r2-h17
  lesson: de1-h-zusammen-wohnen
  topic: Infinitive commands and Wohin?
  stem: 'Which is the infinitive command for a sign that says "No smoking in the cellar"?'
  choices: ['Im Keller rauchen nicht!', 'Im Keller nicht raucht!', 'Im Keller nicht rauche!', 'Im Keller nicht rauchen!']
  answer: 3
  explanation: |-
    The infinitive "rauchen" goes at the end, with "nicht" before it: "Im Keller nicht rauchen!" The other choices put the verb in the wrong place or use a conjugated form ("raucht"), which an infinitive command doesn't have.
- id: de1-h1-r2-h18
  lesson: de1-h-zusammen-wohnen
  module_quiz: true
  topic: Infinitive commands and Wohin?
  stem: 'Turn the rule "Im Keller nicht rauchen." into a sentence with "man" and a modal verb.'
  choices: ['Im Keller muss man nicht rauchen.', 'Im Keller man darf nicht rauchen.', 'Im Keller darf man nicht rauchen.', 'Im Keller darf man nicht raucht.']
  answer: 2
  explanation: |-
    A ban is "nicht dürfen": "Im Keller darf man nicht rauchen." "Nicht müssen" means "don't have to", which is not a ban. The modal must be in position 2, right after "Im Keller", so "man darf" is wrong, and the verb at the end stays an infinitive.
- id: de1-h1-r2-h19
  lesson: de1-h-zusammen-wohnen
  module_quiz: true
  type: label
  topic: Recycling and Pfand
  stem: 'Name the numbered bins.'
  image: {src: images/de1-h1-bins-blank.svg, alt: 'Four wheelie bins in a row, each with a sticker showing what goes in it: a yellow bin with a tin and a yoghurt pot, a blue bin with a newspaper, a brown bin with an apple core and a grey bin with an old sponge. The bins are numbered.'}
  labels:
    - {x: 13.5, y: 72.5, text: die gelbe Tonne}
    - {x: 37.8, y: 72.5, text: die Papiertonne}
    - {x: 62.1, y: 72.5, text: die Biotonne}
    - {x: 86.4, y: 72.5, text: der Restmüll}
  distractors: [der Glascontainer, der Pfandautomat]
  explanation: |-
    1 is the yellow bin for packaging such as tins and yoghurt pots; 2 the blue paper bin; 3 the (often brown) Biotonne for food waste; 4 the grey bin for general waste (Restmüll). Glass goes in a separate street container, and Pfand bottles go back to the shop's machine.
- id: de1-h1-r2-h20
  lesson: de1-h-zusammen-wohnen
  type: match
  topic: Recycling and Pfand
  stem: 'Where does each item go?'
  pairs:
    - [eine alte Zeitung, die Papiertonne]
    - [ein leerer Joghurtbecher, die gelbe Tonne]
    - [ein Apfelrest, die Biotonne]
    - [eine Weinflasche ohne Pfand, der Glascontainer]
    - [eine Wasserflasche mit Pfand-Logo, der Pfandautomat]
  distractors: [der Restmüll]
  explanation: |-
    Paper goes in the blue paper bin, plastic packaging in the yellow bin, food waste in the Biotonne, glass without a deposit in the bottle bank (sorted by colour), and a bottle with a Pfand logo back to the shop's deposit machine. None of these is general waste.
- id: de1-h1-r2-h21
  lesson: de1-h-zusammen-wohnen
  topic: Recycling and Pfand
  stem: 'How much Pfand (deposit) do you pay on a single-use plastic bottle with the deposit logo?'
  choices: ['8 cents', '15 cents', '25 cents', '50 cents']
  answer: 2
  explanation: |-
    Single-use plastic bottles and drink cans carry 25 cents. The lower amounts, 8 or 15 cents, are typical for reusable (Mehrweg) bottles.
- id: de1-h1-r2-h22
  lesson: de1-h-zusammen-wohnen
  module_quiz: true
  type: text
  topic: Infinitive commands and Wohin?
  stem: 'Wohin? Type the missing article: "Die Dose kommt in ___ Gelben Sack."'
  accept: [den]
  explanation: |-
    The can goes into the bag: movement to a place, so "Wohin?" and the accusative. "Der Sack" is masculine, so the accusative article is "den". ("im Gelben Sack" would describe where it already is.)
- id: de1-h1-r2-h23
  lesson: de1-h-zusammen-wohnen
  type: text
  topic: Infinitive commands and Wohin?
  stem: 'Wo? Type the missing word (one word, a contraction): "Das Fahrrad steht ___ Keller."'
  accept: [im]
  explanation: |-
    The bike is standing in the cellar: no movement, so "Wo?" and the dative: in dem Keller, shortened to "im Keller". (For movement it would be "in den Keller".)
- id: de1-h1-r2-h24
  lesson: de1-h-zusammen-wohnen
  topic: Infinitive commands and Wohin?
  stem: 'Which sentences are correct? Select all that apply.'
  choices: [Ich werfe die Dose in die Tonne., Die Zeitung ist in der Papiertonne., Wir bringen die Fahrräder in den Keller., Ich werfe die Flasche in dem Glascontainer., Das Fahrrad steht ins Treppenhaus.]
  answer: [0, 1, 2]
  explanation: |-
    Throwing and bringing are movement (Wohin? + accusative): "in die Tonne", "in den Keller". "Ist in der Papiertonne" is location (Wo? + dative). "In dem Glascontainer" after "werfen" should be "in den Glascontainer", and "steht" is location, so it should be "im Treppenhaus", not "ins".
- id: de1-h1-r2-h25
  lesson: de1-h-zusammen-wohnen
  topic: Recycling and Pfand
  stem: 'Choose the right form: "Er ___ die Flasche in den Glascontainer."'
  choices: ['wirft', 'werft', 'werfen', 'wirfst']
  answer: 0
  explanation: |-
    "Werfen" changes e → i in the du and er/sie/es forms: du wirfst, er wirft. "Werft" is the ihr form, and "wirfst" is the du form.
- id: de1-h1-r2-h26
  lesson: de1-h-zusammen-wohnen
  topic: House rules and quiet hours
  stem: 'Lukas asks his neighbour: "Darf ich am Sonntag bohren?" Which answer is polite and matches the house rules?'
  choices: ['Ja, natürlich, am Sonntag ist das kein Problem.', 'Ja, aber nur am Sonntagabend.', 'Bohren Sie bitte am Sonntag!', 'Lieber nicht. Am Sonntag ist Ruhezeit.']
  answer: 3
  explanation: |-
    Sunday is quiet time all day, so drilling is not OK at any time on Sunday: "Lieber nicht" (better not) is a polite way to say no, and Saturday is the day for it.
- id: de1-h1-r2-h27
  lesson: de1-h-zusammen-wohnen
  topic: Recycling and Pfand
  stem: 'You have an empty water bottle with a Pfand logo. What do you do with it?'
  choices: ['Take it back to a shop''s deposit machine', 'Put it in the yellow bin', 'Put it in the glass container', 'Put it in the Restmüll']
  answer: 0
  explanation: |-
    A Pfand bottle goes back to a shop's Pfandautomat, which prints a receipt (Pfandbon) you can cash at the till. Check for the Pfand logo first, before you think about glass or plastic.
- id: de1-h1-r2-h28
  lesson: de1-h-zusammen-wohnen
  topic: House rules and quiet hours
  stem: 'A note in the stairwell: "Liebe Nachbarn, am Samstag feiern wir eine Party. Es kann ein bisschen laut werden. Wir bitten um Verständnis!" What is the last sentence?'
  choices: ['A request for the neighbours to come to the party', 'A request for the neighbours'' understanding', 'An apology for a past party', 'A warning that the police may come']
  answer: 1
  explanation: |-
    "Wir bitten um Verständnis" is a set phrase on notices: "we ask for your understanding" (thank you for your understanding). It doesn't invite anyone, and the party is still to come ("am Samstag feiern wir").
# --- 92: Es war einmal: reading a fairy tale -----------------------------------------
- id: de1-h1-r2-h29
  lesson: de1-h-maerchen
  module_quiz: true
  topic: Reading the simple past
  stem: 'Which past tense do written stories, novels and fairy tales mostly use?'
  choices: ['The perfect (ist gegangen)', 'The present (geht)', 'The simple past (ging)', 'The future (wird gehen)']
  answer: 2
  explanation: |-
    Written stories use the simple past (Präteritum): "Der Esel ging nach Bremen." In conversation Germans mostly use the perfect instead, except for war, hatte and the modals.
- id: de1-h1-r2-h30
  lesson: de1-h-maerchen
  module_quiz: true
  type: match
  topic: Reading the simple past
  stem: 'Match each simple past form from the story to its infinitive.'
  pairs:
    - [ging, gehen]
    - [kam, kommen]
    - [sah, sehen]
    - [lief, laufen]
    - [fand, finden]
  distractors: [fahren, sitzen]
  explanation: |-
    These are strong verbs: the vowel changes and there's no -te ending. gehen, ging, gegangen; kommen, kam, gekommen; sehen, sah, gesehen; laufen, lief, gelaufen; finden, fand, gefunden. ("Saß" would be sitzen; "fuhr" would be fahren.)
- id: de1-h1-r2-h31
  lesson: de1-h-maerchen
  type: text
  topic: Reading the simple past
  stem: '"Machen" is a weak verb. Type its simple past to complete: "Die Tiere ___ einen Plan." (The animals made a plan.)'
  accept: [machten]
  explanation: |-
    Weak verbs add -te to the stem, and the plural (sie, wir) adds -n: mach + te + n = "machten". "Machte" is the er/sie/es form.
- id: de1-h1-r2-h32
  lesson: de1-h-maerchen
  topic: Reading the simple past
  stem: 'Which is the correct simple past: "Am Abend ___ der Esel an ein Haus."'
  choices: ['kommte', 'kamt', 'kam', 'gekommen']
  answer: 2
  explanation: |-
    "Kommen" is strong: the past is "kam", with no ending for er/sie/es. "Kommte" adds the weak -te to a strong verb, "kamt" is the ihr form, and "gekommen" is the participle, which needs "ist".
- id: de1-h1-r2-h33
  lesson: de1-h-maerchen
  topic: Reading the simple past
  stem: 'Which are the correct principal parts (infinitive, simple past, past participle) of "gehen"?'
  choices: ['gehen, gehte, gegeht', 'gehen, ging, gegangen', 'gehen, ging, gegingen', 'gehen, gang, gegangen']
  answer: 1
  explanation: |-
    gehen, ging, gegangen. Strong verbs don't take -te or -t, so "gehte, gegeht" is wrong; the vowels of the simple past and the participle are often different, so you learn all three forms together.
- id: de1-h1-r2-h34
  lesson: de1-h-maerchen
  module_quiz: true
  type: order
  topic: Fairy tales
  stem: 'Put these events from the story "Die Bremer Stadtmusikanten" (as retold in the lesson) in order.'
  items: [Der Esel lief weg., Der Esel fand einen Hund., Die Tiere sahen im Wald ein Licht., Die Tiere fielen durch das Fenster., Die Räuber liefen in den Wald., In der Nacht kam ein Räuber zurück.]
  explanation: |-
    The donkey runs away, finds the dog (and later the cat and the rooster), they see a light in the forest, crash through the window while making their "music", the robbers flee, and one robber comes back in the night and is chased off.
- id: de1-h1-r2-h35
  lesson: de1-h-maerchen
  topic: Fairy tales
  stem: 'Read: "Ein Hahn stand auf dem Zaun und rief: Kikeriki! Morgen kocht die Bäuerin eine Suppe aus mir!" Why does the rooster want to leave?'
  choices: ['He wants to sing in Bremen.', 'The robbers took his farm.', 'He is too old to catch mice.', 'The farmer''s wife is going to make soup out of him.']
  answer: 3
  explanation: |-
    "Morgen kocht die Bäuerin eine Suppe aus mir" means "Tomorrow the farmer's wife is going to cook a soup out of me". Catching mice is the cat's problem, not the rooster's.
- id: de1-h1-r2-h36
  lesson: de1-h-maerchen
  topic: Fairy tales
  stem: 'Read: "Die Räuber hatten große Angst. Ein Gespenst!, riefen sie und liefen in den Wald." Why did the robbers run away?'
  choices: ['They thought a ghost had come.', 'They wanted to make music.', 'The police were coming.', 'They were going to Bremen.']
  answer: 0
  explanation: |-
    "Angst haben" means to be afraid, and "Ein Gespenst!" means "A ghost!". The animals' noise and crash through the window made the robbers think a ghost had come in.
- id: de1-h1-r2-h37
  lesson: de1-h-maerchen
  module_quiz: true
  type: label
  topic: Fairy tales
  stem: 'Name the four Bremen Town Musicians.'
  image: {src: images/de1-h1-musicians-blank.svg, alt: 'Four animals standing on each other in front of a lit window: a donkey at the bottom, a dog on the donkey, a cat on the dog and a rooster at the top. The animals are numbered from the top.'}
  labels:
    - {x: 41.1, y: 36.2, text: der Hahn}
    - {x: 41.7, y: 46.2, text: die Katze}
    - {x: 41.7, y: 57.7, text: der Hund}
    - {x: 41.7, y: 71.5, text: der Esel}
  distractors: [das Huhn, die Maus]
  explanation: |-
    From the top: der Hahn (rooster), die Katze (cat), der Hund (dog) and der Esel (donkey) at the bottom. "Das Huhn" is a hen, and "die Maus" is what the old cat couldn't catch any more.
- id: de1-h1-r2-h38
  lesson: de1-h-maerchen
  topic: Reading the simple past
  stem: 'Which of these simple past forms belong to strong verbs (new vowel, no -te)? Select all that apply.'
  choices: [sprang, bellte, flog, machten, fiel, wohnte]
  answer: [0, 2, 4]
  explanation: |-
    sprang (springen), flog (fliegen) and fiel (fallen) change their vowel and have no ending: strong verbs. bellte, machten and wohnte have -te: weak verbs (bellen, machen, wohnen).
- id: de1-h1-r2-h39
  lesson: de1-h-maerchen
  module_quiz: true
  topic: Reading the simple past
  stem: 'You''re telling the story aloud. How do you say "Der Hund sprang auf den Esel" in the spoken past (the perfect)?'
  choices: ['Der Hund hat auf den Esel gesprungen.', 'Der Hund ist auf den Esel gesprungen.', 'Der Hund ist auf den Esel gespringt.', 'Der Hund hat auf den Esel gesprangen.']
  answer: 1
  explanation: |-
    "Springen" is movement, so it takes sein, and it's strong: springen, sprang, gesprungen. So: "Der Hund ist auf den Esel gesprungen." "Hat" is the wrong auxiliary, and "gespringt" and "gesprangen" are not words.
- id: de1-h1-r2-h40
  lesson: de1-h-maerchen
  topic: Fairy tales
  stem: 'When did the Brothers Grimm publish the first volume of their "Kinder- und Hausmärchen"?'
  choices: ['1812', '1819', '1859', '1953']
  answer: 0
  explanation: |-
    The first volume appeared in 1812. "Die Bremer Stadtmusikanten" was added in the second edition of 1819; Wilhelm Grimm died in 1859; the bronze statue in Bremen was set up in 1953.
- id: de1-h1-r2-h41
  lesson: de1-h-maerchen
  type: text
  topic: Reading the simple past
  stem: 'Type the infinitive of the verb in "Auf dem Weg fand er einen Hund." ___'
  accept: [finden]
  explanation: |-
    "Fand" is the simple past of the strong verb "finden" (finden, fand, gefunden), like English find / found. It has nothing to do with English "fanned".
- id: de1-h1-r2-h42
  lesson: de1-h-maerchen
  topic: Fairy tales
  stem: 'What does "Es war einmal ein Esel." mean?'
  choices: ['It was a donkey once more.', 'Once upon a time there was a donkey.', 'A donkey was here only one time.', 'There is a donkey again.']
  answer: 1
  explanation: |-
    "Es war einmal …" is the fixed opening of fairy tales: "Once upon a time there was …". "Einmal" here means "once" in the sense of "at one time", not "one more time" (that would be "noch einmal").
# --- 93: Gemütlich: Feierabend, the Kleingarten and little words ---------------------
- id: de1-h1-r2-h43
  lesson: de1-h-gemuetlich
  module_quiz: true
  topic: Feierabend and the Kleingarten
  stem: 'At 5 p.m. a colleague says: "Schönen Feierabend!" What do you answer?'
  choices: ['Gute Besserung!', 'Herzlich willkommen!', 'Danke, gleichfalls!', 'Guten Appetit!']
  answer: 2
  explanation: |-
    "Danke, gleichfalls!" means "Thanks, you too!" and is the usual answer to a good wish. "Gute Besserung" is for someone who is ill, "Herzlich willkommen" greets a guest, and "Guten Appetit" is said before a meal.
- id: de1-h1-r2-h44
  lesson: de1-h-gemuetlich
  module_quiz: true
  type: text
  topic: Diminutives
  stem: 'Type the diminutive (the "little" form with -chen) of "das Haus": das ___'
  accept: [Häuschen, Haeuschen]
  explanation: |-
    "Haus" has no final -e to drop; "au" takes an umlaut ("äu"); then add -chen: "Häuschen". Say it Häus-chen, with s and the ch of "ich", not "sch".
- id: de1-h1-r2-h45
  lesson: de1-h-gemuetlich
  topic: Diminutives
  stem: 'Which article goes with "Kätzchen" (kitten), from "die Katze"?'
  choices: ['der', 'die', 'den', 'das']
  answer: 3
  explanation: |-
    Every noun ending in -chen or -lein is neuter: "das Kätzchen", even though "die Katze" is feminine. "Die" would only be right for the plural: "die Kätzchen".
- id: de1-h1-r2-h46
  lesson: de1-h-gemuetlich
  topic: Diminutives
  stem: 'Which of these nouns are diminutives (with the ending -chen)? Select all that apply.'
  choices: [das Brötchen, das Mädchen, der Kuchen, das Eichhörnchen, die Küche, der Kleingarten]
  answer: [0, 1, 3]
  explanation: |-
    Brötchen (from Brot), Mädchen (from the old word Magd) and Eichhörnchen are diminutives, and all three are das. "Der Kuchen" just happens to end in -chen, and "die Küche" in -che; neither is a diminutive, which is why they aren't neuter. "Kleingarten" is a compound of klein + Garten.
- id: de1-h1-r2-h47
  lesson: de1-h-gemuetlich
  module_quiz: true
  type: match
  topic: Diminutives
  stem: 'Match each noun to its diminutive.'
  pairs:
    - [der Baum, das Bäumchen]
    - [die Tasse, das Tässchen]
    - [der Hund, das Hündchen]
    - [die Blume, das Blümchen]
    - [das Buch, das Büchlein]
  distractors: [das Baumchen, das Hundchen]
  explanation: |-
    Drop a final -e (Tasse → Täss-, Blume → Blüm-), add the umlaut (a → ä, u → ü, au → äu) and add -chen. After -ch, -lein is used: Büchlein. "Baumchen" and "Hundchen" forget the umlaut.
- id: de1-h1-r2-h48
  lesson: de1-h-gemuetlich
  module_quiz: true
  type: label
  topic: Feierabend and the Kleingarten
  stem: 'Name the numbered things in this Kleingarten.'
  image: {src: images/de1-h1-garden-blank.svg, alt: 'A small rented garden: a hut on the left, an apple tree on the right, a wooden fence at the back, a vegetable bed with tomato plants in front, flowers on the right and a watering can on the left. Six things are numbered.'}
  labels:
    - {x: 20.1, y: 54.2, text: die Laube}
    - {x: 76.1, y: 33.3, text: der Baum}
    - {x: 55.6, y: 57.3, text: der Zaun}
    - {x: 50.7, y: 85.4, text: das Beet}
    - {x: 85.4, y: 83.3, text: die Blume}
    - {x: 16.9, y: 87.1, text: die Gießkanne}
  distractors: [der Balkon, die Garage]
  explanation: |-
    1 is the garden hut (die Laube), 2 the apple tree (der Baum), 3 the fence (der Zaun), 4 the vegetable bed (das Beet), 5 the flowers (die Blume) and 6 the watering can (die Gießkanne, from gießen, to water).
- id: de1-h1-r2-h49
  lesson: de1-h-gemuetlich
  topic: Feierabend and the Kleingarten
  stem: 'Which is true of the Laube in a German Kleingarten, under the federal rules?'
  choices: ['It may be at most 24 square metres, and you may not live in it.', 'You may live in it all year round.', 'It must be at least 400 square metres.', 'Only the city may use it.']
  answer: 0
  explanation: |-
    The Bundeskleingartengesetz allows a simple hut of at most 24 m², including a covered seating area, and it's not for living in. 400 m² is the maximum size of the whole garden, not a minimum for the hut.
- id: de1-h1-r2-h50
  lesson: de1-h-gemuetlich
  topic: Diminutives
  stem: 'At the bakery: "Ich hätte gern zwei ___, bitte."'
  choices: ['Brötchens', 'Brötchen', 'Brötchenen', 'Brötcher']
  answer: 1
  explanation: |-
    Diminutives have no plural ending: one Brötchen, two Brötchen. Only the article shows the plural: das Brötchen, die Brötchen.
- id: de1-h1-r2-h51
  lesson: de1-h-gemuetlich
  topic: Feierabend and the Kleingarten
  stem: 'From whom do you usually rent a Kleingarten in Germany?'
  choices: ['From a landlord, like a flat', 'From the Bürgeramt', 'From a garden club, the Kleingartenverein', 'From a supermarket']
  answer: 2
  explanation: |-
    You rent the garden through the Kleingartenverein and become a member, with meetings and shared jobs. (The club usually leases the land from the town; the lesson simplifies this.)
- id: de1-h1-r2-h52
  lesson: de1-h-gemuetlich
  topic: Feierabend and the Kleingarten
  stem: 'Read: "Im Garten nebenan sitzt Herr Wolff vor seinem Häuschen und liest die Zeitung. Na, Frau Berger, möchten Sie ein Gläschen Saft?, fragt er." What does Herr Wolff offer Ilse?'
  choices: ['A glass of juice', 'His little house', 'His newspaper', 'Some strawberries']
  answer: 0
  explanation: |-
    "Ein Gläschen Saft" is a (little) glass of juice. The -chen makes the offer friendly; it doesn't mean the glass is tiny. "Häuschen" is where he is sitting, and "Zeitung" is what he is reading.
- id: de1-h1-r2-h53
  lesson: de1-h-gemuetlich
  topic: Diminutives
  stem: 'A friend asks: "Trinken wir noch ein Tässchen Kaffee?" Why "Tässchen" and not "Tasse"?'
  choices: ['Because it sounds friendly and relaxed', 'Because the cup is especially small', 'Because "Tässchen" is the plural', 'Because it''s the formal form for Sie']
  answer: 0
  explanation: |-
    The diminutive often adds a warm, relaxed feeling, part of Gemütlichkeit; the cup is a normal cup. "Ein Tässchen" is singular, and diminutives have nothing to do with Sie.
- id: de1-h1-r2-h54
  lesson: de1-h-gemuetlich
  type: order
  topic: Feierabend and the Kleingarten
  stem: 'Put the words in order: "We''re making ourselves comfortable."'
  items: [Wir, machen, es, uns, 'gemütlich.']
  explanation: |-
    "Wir machen es uns gemütlich." It's a fixed chunk: subject, verb in position 2, then "es uns" (es before uns), and "gemütlich" at the end.
- id: de1-h1-r2-h55
  lesson: de1-h-gemuetlich
  topic: Diminutives
  stem: 'How do you say "Häuschen" (little house)?'
  choices: ['Häu-schen, with "sch" as in Schule', 'Hä-uschen', 'Häusch-en', 'Häus-chen: an s, then the ch of "ich"']
  answer: 3
  explanation: |-
    The word is Häus + chen, so the s and the ch are separate: Häus-chen, with the soft ch of "ich". Reading it as "sch" is a common mistake; the same goes for Gläschen and Röschen.
- id: de1-h1-r2-h56
  lesson: de1-h-gemuetlich
  module_quiz: true
  topic: Feierabend and the Kleingarten
  stem: 'What is a "Stammtisch"?'
  choices: ['The family''s dining table at home', 'The table where you sign forms at the Bürgeramt', 'A picnic table in the Kleingarten', 'A table in a pub kept for a group of regulars who meet there often']
  answer: 3
  explanation: |-
    A Stammtisch is a regulars' table in a Kneipe, kept for a group that meets there regularly (often weekly). Today the word is also used for any regular get-together, like a Sprachstammtisch for language learners.
