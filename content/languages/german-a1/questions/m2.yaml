# German A1, module 2: People and things (lessons 05–08)

# --- 05 de1-nouns-gender ---
- id: de1-q-0501
  lesson: de1-nouns-gender
  module_quiz: true
  topic: Articles
  stem: 'Which article goes with "Tisch" (table)?'
  choices: ['die', 'der', 'das', 'den']
  answer: 1
  explanation: |-
    Tisch is masculine: der Tisch. "die" is for feminine nouns and plurals, "das" for neuter nouns. "den" is a different case form you will meet in lesson 9. Learn every noun together with its article.
- id: de1-q-0502
  lesson: de1-nouns-gender
  module_quiz: true
  topic: Plurals
  stem: 'What is the plural of "das Buch" (book)?'
  choices: ['die Bücher', 'die Buchs', 'die Buche', 'das Bücher']
  answer: 0
  explanation: |-
    Buch belongs to the umlaut + -er group: das Buch, die Bücher. German rarely adds -s like English, and every plural takes the article "die", never "das".
- id: de1-q-0503
  lesson: de1-nouns-gender
  module_quiz: true
  topic: Articles
  stem: 'Which noun is feminine? Look at the ending.'
  choices: ['Computer', 'Mädchen', 'Fenster', 'Zeitung']
  answer: 3
  explanation: |-
    Nouns ending in -ung are always feminine: die Zeitung. -chen is always neuter (das Mädchen). -er is a weaker hint: der Computer is masculine but das Fenster is neuter.
- id: de1-q-0504
  lesson: de1-nouns-gender
  topic: Articles
  stem: 'Complete the sentence: "Das ist ___ Lampe."'
  choices: ['einen', 'ein', 'eine', 'der']
  answer: 2
  explanation: |-
    Lampe is feminine (die Lampe), so "a" is eine: Das ist eine Lampe. "ein" is for masculine and neuter nouns. "der" would be "the", and only for masculine nouns.
- id: de1-q-0505
  lesson: de1-nouns-gender
  topic: Articles
  stem: 'Which article goes with the compound noun "Handynummer" (das Handy + die Nummer)?'
  choices: ['das', 'die', 'der', 'It has no article.']
  answer: 1
  explanation: |-
    In a compound noun the last part decides the gender. Nummer is feminine, so it is die Handynummer, even though das Handy is neuter.
- id: de1-q-0506
  lesson: de1-nouns-gender
  module_quiz: true
  topic: Plurals
  stem: 'You point at three keys on the table. Which sentence is correct?'
  choices: ['Das sind Schlüssel.', 'Das ist Schlüssel.', 'Das sind Schlüssels.', 'Die sind ein Schlüssel.']
  answer: 0
  explanation: |-
    For several things you say "Das sind …". Schlüssel belongs to the no-ending group (der Schlüssel, die Schlüssel), so Schlüssels is wrong, and "ein" has no plural.
- id: de1-q-0507
  lesson: de1-nouns-gender
  topic: Vocabulary
  stem: 'What does "das Handy" mean?'
  choices: ['hand towel', 'handy tool', 'glove', 'mobile phone']
  answer: 3
  explanation: |-
    Das Handy is the everyday German word for a mobile (cell) phone. It looks like English "handy" but means something quite different.
- id: de1-q-0508
  lesson: de1-nouns-gender
  topic: Articles
  stem: 'Which sentence contains a mistake?'
  choices: ['Das ist eine Tasche.', 'Das ist ein Heft.', 'Das ist ein Uhr.', 'Das ist ein Stift.']
  answer: 2
  explanation: |-
    Uhr is feminine (die Uhr), so it must be "Das ist eine Uhr." Heft is neuter and Stift is masculine, so "ein" is correct for them, and Tasche is feminine with "eine".
- id: de1-q-0509
  lesson: de1-nouns-gender
  topic: Reading
  stem: 'Read the note: "Lena, hier sind zwei Bücher und ein Heft. Die Bücher sind für Max, das Heft ist für Jana. Danke! Ben" (für = for). What is for Jana?'
  choices: ['two books', 'one exercise book', 'two exercise books', 'one book']
  answer: 1
  explanation: |-
    The note says "das Heft ist für Jana": the (one) exercise book is for Jana. The two books (die Bücher) are for Max.
- id: de1-q-0510
  lesson: de1-nouns-gender
  topic: Articles
  stem: 'Which noun is neuter?'
  choices: ['Fenster', 'Brille', 'Stuhl', 'Tür']
  answer: 0
  explanation: |-
    It is das Fenster. The others are die Brille, der Stuhl and die Tür. Fenster ends in -er, which often suggests masculine, so it is a good example of why you learn every article.
- id: de1-q-0511
  lesson: de1-nouns-gender
  topic: Plurals
  stem: 'What is the plural of "die Lampe"?'
  choices: ['die Lämpe', 'die Lampe', 'die Lampes', 'die Lampen']
  answer: 3
  explanation: |-
    Most feminine nouns add -n or -en in the plural: die Lampe, die Lampen. German does not form this plural with -s or an umlaut.
- id: de1-q-0512
  lesson: de1-nouns-gender
  topic: Articles
  stem: 'Your friend says "Wo ist die Brille?" What is she looking for?'
  choices: ['a bottle', 'several pairs of glasses', 'her glasses (one pair)', 'her bag']
  answer: 2
  explanation: |-
    Die Brille is singular: one pair of glasses. English says "glasses", but German treats it as one thing, so it is "Wo ist die Brille?", not "Wo sind …". Several pairs would be die Brillen.

# --- 06 de1-family ---
- id: de1-q-0601
  lesson: de1-family
  module_quiz: true
  topic: Possessives
  stem: 'Complete: "Anna und ___ Vater wohnen in Bonn."'
  choices: ['sein', 'ihre', 'ihr', 'seine']
  answer: 2
  explanation: |-
    Anna is the owner, so the word is ihr (her). Vater is masculine, so there is no ending: ihr Vater. "ihre" would be for a feminine or plural noun, and sein/seine means "his".
- id: de1-q-0602
  lesson: de1-family
  module_quiz: true
  topic: Possessives
  stem: 'Complete: "Paul und ___ Schwester wohnen in Wien."'
  choices: ['sein', 'seine', 'ihre', 'ihr']
  answer: 1
  explanation: |-
    Paul is the owner, so the word is sein (his). Schwester is feminine, so it takes -e: seine Schwester. "ihre" would mean "her" or "their".
- id: de1-q-0603
  lesson: de1-family
  module_quiz: true
  topic: Verbs
  stem: 'Complete: "Mein Bruder ___ zwei Kinder."'
  choices: ['hat', 'habt', 'haben', 'hast']
  answer: 0
  explanation: |-
    Mein Bruder is the same as er, and the er/sie/es form of haben is hat. "habt" belongs to ihr, "hast" to du and "haben" to wir, sie and Sie.
- id: de1-q-0604
  lesson: de1-family
  topic: Verbs
  stem: 'You ask two friends: "___ ihr ein Tier?"'
  choices: ['Hast', 'Hat', 'Haben', 'Habt']
  answer: 3
  explanation: |-
    With ihr (you, plural) the form of haben is habt: Habt ihr ein Tier? The verb comes first because it is a yes/no question.
- id: de1-q-0605
  lesson: de1-family
  topic: Possessives
  stem: 'You ask two children: "Ist das ___ Katze?"'
  choices: ['euer', 'euere', 'eure', 'deine']
  answer: 2
  explanation: |-
    Talking to two children you use ihr, so "your" is euer. Katze is feminine, so euer takes -e and drops its second e: eure Katze. "deine" is for one person only.
- id: de1-q-0606
  lesson: de1-family
  topic: Family
  stem: 'What does "die Geschwister" mean?'
  choices: ['grandparents', 'brothers and sisters', 'parents', 'cousins']
  answer: 1
  explanation: |-
    Die Geschwister means brothers and sisters together: siblings. Parents are die Eltern, grandparents die Großeltern.
- id: de1-q-0607
  lesson: de1-family
  topic: Family
  stem: 'What does "Meine Eltern sind geschieden." mean?'
  choices: ['My parents are divorced.', 'My parents are married.', 'My parents are single.', 'My parents are separated by distance.']
  answer: 0
  explanation: |-
    Geschieden means divorced. Married is verheiratet and single is ledig.
- id: de1-q-0608
  lesson: de1-family
  module_quiz: true
  topic: Reading
  stem: 'Read: "Das ist meine Familie. Mein Vater heißt Klaus, meine Mutter heißt Petra. Ich habe einen Bruder, Max. Max ist verheiratet. Seine Frau heißt Lina, und sie haben ein Baby." Who is Lina?'
  choices: ['the baby', 'the writer’s sister', 'the writer’s mother', 'Max’s wife']
  answer: 3
  explanation: |-
    "Seine Frau heißt Lina": his (Max’s) wife is called Lina. Die Frau means both "woman" and "wife"; after a possessive it usually means wife. The mother is Petra, and the baby’s name isn’t given.
- id: de1-q-0609
  lesson: de1-family
  topic: Possessives
  stem: 'Someone shows you a photo and asks "Wer ist das?" Which answer is correct?'
  choices: ['Er ist meine Schwester.', 'Das ist mein Schwester.', 'Das ist meine Schwester.', 'Das sind meine Schwester.']
  answer: 2
  explanation: |-
    Schwester is feminine, so "my" is meine. "Das ist" never changes for one person; "Das sind" is only for several people, and "er" means "he".
- id: de1-q-0610
  lesson: de1-family
  topic: Possessives
  stem: 'You speak formally to Frau Berg: "Frau Berg, ist das ___ Hund?"'
  choices: ['ihr', 'Ihr', 'Sie', 'dein']
  answer: 1
  explanation: |-
    The formal "your" is Ihr with a capital I, matching the formal pronoun Sie. Lower-case ihr would mean "her" or "their", and dein is informal.
- id: de1-q-0611
  lesson: de1-family
  topic: Possessives
  stem: 'Which sentence contains a mistake?'
  choices: ['Mein Eltern wohnen in Köln.', 'Meine Tochter ist zehn.', 'Unser Sohn heißt Leo.', 'Ist das dein Opa?']
  answer: 0
  explanation: |-
    Eltern is plural, and possessives take -e in the plural: Meine Eltern wohnen in Köln. The other sentences are correct: meine Tochter (feminine), unser Sohn and dein Opa (masculine).
- id: de1-q-0612
  lesson: de1-family
  module_quiz: true
  topic: Possessives
  stem: 'Lisa und Tom haben einen Hund. "___ Hund heißt Rex."'
  choices: ['Euer', 'Sein', 'Ihre', 'Ihr']
  answer: 3
  explanation: |-
    The dog belongs to Lisa and Tom, so you need "their": ihr. Hund is masculine, so no ending: Ihr Hund (capital only because it starts the sentence). Sein would mean "his", euer "your".

# --- 07 de1-jobs-languages ---
- id: de1-q-0701
  lesson: de1-jobs-languages
  module_quiz: true
  topic: Jobs
  stem: '"Was sind Sie von Beruf?" Which answer is correct for a woman who teaches?'
  choices: ['Ich habe Lehrerin.', 'Ich bin eine Lehrer.', 'Ich bin Lehrerinnen.', 'Ich bin Lehrerin.']
  answer: 3
  explanation: |-
    German uses no article with jobs after sein, and a woman uses the -in form: Ich bin Lehrerin. "Lehrerinnen" is plural, and the verb here is sein (bin), not haben.
- id: de1-q-0702
  lesson: de1-jobs-languages
  module_quiz: true
  topic: Verbs
  stem: 'Complete: "Mein Vater ___ Spanisch."'
  choices: ['sprechen', 'sprecht', 'spricht', 'sprich']
  answer: 2
  explanation: |-
    sprechen changes its stem vowel from e to i in the du and er/sie/es forms: er spricht. "sprecht" is the ihr form, and "sprechen" is for wir, sie and Sie.
- id: de1-q-0703
  lesson: de1-jobs-languages
  topic: Verbs
  stem: 'Complete the question: "___ du Englisch?"'
  choices: ['Sprechst', 'Sprichst', 'Spricht', 'Sprecht']
  answer: 1
  explanation: |-
    The du form also has the stem change: du sprichst. "Sprechst" keeps the e by mistake, and "Spricht" is the er/sie/es form.
- id: de1-q-0704
  lesson: de1-jobs-languages
  topic: Verbs
  stem: 'Complete: "Ich ___ ein bisschen Deutsch."'
  choices: ['spreche', 'spriche', 'sprichst', 'spricht']
  answer: 0
  explanation: |-
    The stem only changes for du and er/sie/es. The ich form is regular: ich spreche. "spriche" is a common mistake.
- id: de1-q-0705
  lesson: de1-jobs-languages
  module_quiz: true
  topic: Jobs
  stem: 'What is the feminine form of "der Arzt" (doctor)?'
  choices: ['die Arzte', 'die Arztin', 'die Ärztinn', 'die Ärztin']
  answer: 3
  explanation: |-
    Feminine job titles add -in, and Arzt also takes an umlaut: die Ärztin. The double n only appears in the plural: die Ärztinnen.
- id: de1-q-0706
  lesson: de1-jobs-languages
  module_quiz: true
  topic: Countries
  stem: 'Which sentence is correct?'
  choices: ['Ich komme aus die Türkei.', 'Ich komme aus Türkei.', 'Ich komme aus der Türkei.', 'Ich komme aus den Türkei.']
  answer: 2
  explanation: |-
    Die Türkei is one of the few countries that always take an article. After aus it becomes der: aus der Türkei (a set phrase for now; the dative comes in lesson 18). Most countries, like Spanien, need no article.
- id: de1-q-0707
  lesson: de1-jobs-languages
  topic: Languages
  stem: 'Which language do people speak in Frankreich?'
  choices: ['Frankreichisch', 'Französisch', 'Franzisch', 'Französin']
  answer: 1
  explanation: |-
    The language of France is Französisch. Many language names end in -isch, but they aren’t always formed from the country name. Französin means a Frenchwoman.
- id: de1-q-0708
  lesson: de1-jobs-languages
  module_quiz: true
  topic: Reading
  stem: 'Read: "Hallo, ich heiße Elif. Ich komme aus der Türkei, aber ich wohne in Berlin. Ich bin Studentin. Ich spreche Türkisch, Deutsch und ein bisschen Englisch. Mein Bruder ist Koch." (aber = but) Which statement is true?'
  choices: ['Elif is a university student.', 'Elif is a cook.', 'Elif lives in Turkey.', 'Elif doesn’t speak any English.']
  answer: 0
  explanation: |-
    Elif says "Ich bin Studentin": she is a (university) student. Her brother is the cook, she lives in Berlin, and she speaks "ein bisschen Englisch", a little English.
- id: de1-q-0709
  lesson: de1-jobs-languages
  topic: Vocabulary
  stem: 'What does "die Firma" mean?'
  choices: ['factory floor', 'farm', 'signature', 'company']
  answer: 3
  explanation: |-
    Die Firma means a company or firm: Meine Firma ist international. It has nothing to do with English "farm".
- id: de1-q-0710
  lesson: de1-jobs-languages
  topic: Languages
  stem: 'Which sentence is correct?'
  choices: ['Er spricht sehr gut deutsch.', 'Er sprecht sehr gut Deutsch.', 'Er spricht sehr gut Deutsch.', 'Er spricht sehr gut German.']
  answer: 2
  explanation: |-
    The er form is spricht, and the name of a language is capitalized: Deutsch. English names like German are not used in German sentences.
- id: de1-q-0711
  lesson: de1-jobs-languages
  topic: Jobs
  stem: 'What is the plural of "die Lehrerin" (female teacher)?'
  choices: ['die Lehrerins', 'die Lehrerinnen', 'die Lehrerin', 'die Lehrerine']
  answer: 1
  explanation: |-
    Feminine nouns ending in -in add -nen in the plural: die Lehrerin, die Lehrerinnen.
- id: de1-q-0712
  lesson: de1-jobs-languages
  topic: Jobs
  stem: 'Daniel is a man who studies at a university. What does he say?'
  choices: ['Ich bin Student.', 'Ich bin Schüler.', 'Ich bin Studentin.', 'Ich bin ein Studenten.']
  answer: 0
  explanation: |-
    A man at university is a Student (no article after sein). A Schüler goes to school, Studentin is the female form, and Studenten is plural.
- id: de1-q-0713
  lesson: de1-jobs-languages
  topic: Languages
  stem: 'Your new colleague asks: "Welche Sprachen sprichst du?" Which is a fitting answer?'
  choices: ['Ja, ich spreche.', 'Ich komme aus England.', 'Ich bin Ingenieur.', 'Englisch und ein bisschen Deutsch.']
  answer: 3
  explanation: |-
    Welche Sprachen sprichst du? means "Which languages do you speak?", so you name languages. The other answers say where you are from, what your job is, or don’t answer the question.

# --- 08 de1-describing ---
- id: de1-q-0801
  lesson: de1-describing
  module_quiz: true
  topic: Negation
  stem: 'Complete: "Das ist ___ Hund, das ist eine Katze!"'
  choices: ['kein', 'keine', 'nicht', 'nicht ein']
  answer: 0
  explanation: |-
    To negate a noun with ein, use kein: ein Hund becomes kein Hund. Hund is masculine, so there is no ending; keine is for feminine and plural nouns. German never says "nicht ein".
- id: de1-q-0802
  lesson: de1-describing
  module_quiz: true
  topic: Negation
  stem: 'Complete: "Tut mir leid, ich habe ___ Zeit." (Tut mir leid = Sorry)'
  choices: ['nichts', 'kein', 'nicht', 'keine']
  answer: 3
  explanation: |-
    Zeit has no article here, so you negate it with kein. Zeit is feminine (die Zeit), so it is keine: Ich habe keine Zeit.
- id: de1-q-0803
  lesson: de1-describing
  topic: Negation
  stem: 'Complete: "Das ist ___ mein Handy."'
  choices: ['keine', 'kein', 'nicht', 'nein']
  answer: 2
  explanation: |-
    A noun with a possessive (mein, dein …) or with der/die/das is negated with nicht, not kein: Das ist nicht mein Handy. "nein" means no as an answer.
- id: de1-q-0804
  lesson: de1-describing
  module_quiz: true
  topic: Negation
  stem: 'A friend asks "Ist das nicht dein Schlüssel?" It is your key. What do you say?'
  choices: ['Ja, das ist nicht mein Schlüssel.', 'Doch, das ist mein Schlüssel.', 'Nein, das ist mein Schlüssel.', 'Nicht, das ist mein Schlüssel.']
  answer: 1
  explanation: |-
    To contradict a negative question you answer doch. "Nein" would agree with the negative ("No, it isn’t"), and "Nicht" is not an answer word.
- id: de1-q-0805
  lesson: de1-describing
  topic: Adjectives
  stem: 'Complete: "Die Stühle sind ___." (new)'
  choices: ['neu', 'neue', 'neuen', 'neuer']
  answer: 0
  explanation: |-
    After sein an adjective never takes an ending, whatever the gender or number: Die Stühle sind neu. Endings only appear when the adjective stands before a noun.
- id: de1-q-0806
  lesson: de1-describing
  topic: Adjectives
  stem: 'What does "Die Tasche ist zu teuer." mean?'
  choices: ['The bag is expensive too.', 'The bag is very expensive.', 'The bag is quite cheap.', 'The bag is too expensive.']
  answer: 3
  explanation: |-
    zu before an adjective means "too", more than you want: zu teuer = too expensive. "Very" is sehr, and "also, too" is auch.
- id: de1-q-0807
  lesson: de1-describing
  topic: Adjectives
  stem: 'What is the opposite of "langweilig"?'
  choices: ['langsam', 'lang', 'interessant', 'schwer']
  answer: 2
  explanation: |-
    Langweilig means boring; its opposite is interessant. Lang (long) and langsam (slow) only look similar.
- id: de1-q-0808
  lesson: de1-describing
  module_quiz: true
  topic: Reading
  stem: 'Read the ad: "Verkaufe Fahrrad, rot, 2 Jahre alt, sehr schnell. Das Licht ist kaputt. Nur 90 Euro!" (Verkaufe = for sale, Fahrrad = bicycle, Licht = light, nur = only) Which statement is true?'
  choices: ['The bike is blue.', 'The bike’s light doesn’t work.', 'The bike is very slow.', 'The bike costs 190 euros.']
  answer: 1
  explanation: |-
    Das Licht ist kaputt: the light is broken. The bike is red (rot), very fast (sehr schnell) and costs only 90 euros.
- id: de1-q-0809
  lesson: de1-describing
  topic: Negation
  stem: 'Which sentence is correct?'
  choices: ['Ich verstehe das nicht.', 'Ich nicht verstehe das.', 'Ich verstehe nicht das.', 'Ich verstehe kein das.']
  answer: 0
  explanation: |-
    To negate a whole simple sentence, nicht usually goes at the end: Ich verstehe das nicht. German doesn’t put nicht before the verb and has no helper like English "don’t".
- id: de1-q-0810
  lesson: de1-describing
  topic: Colours
  stem: 'Which colour is "gelb"?'
  choices: ['gold', 'green', 'grey', 'yellow']
  answer: 3
  explanation: |-
    Gelb is yellow. Green is grün and grey is grau.
- id: de1-q-0811
  lesson: de1-describing
  topic: Adjectives
  stem: 'Which sentence contains a mistake?'
  choices: ['Das Fenster ist weiß.', 'Die Tür ist rot.', 'Das Auto ist roter.', 'Die Hefte sind blau.']
  answer: 2
  explanation: |-
    After sein, adjectives don’t take endings: Das Auto ist rot. The other sentences are correct.
- id: de1-q-0812
  lesson: de1-describing
  topic: Adjectives
  stem: 'How do you say "I’m bored" in German?'
  choices: ['Ich bin langweilig.', 'Mir ist langweilig.', 'Ich bin interessant.', 'Ich habe langweilig.']
  answer: 1
  explanation: |-
    Mir ist langweilig is the fixed phrase for "I’m bored". "Ich bin langweilig" means "I’m boring", a classic learner mistake.
- id: de1-q-0813
  lesson: de1-describing
  topic: Adjectives
  stem: 'What does "Die Tasche ist ziemlich schwer." mean?'
  choices: ['The bag is quite heavy.', 'The bag is very easy.', 'The bag is too heavy.', 'The bag isn’t heavy.']
  answer: 0
  explanation: |-
    Ziemlich means quite or fairly, and schwer means heavy (or difficult). "Too heavy" would be zu schwer.
