# Module 6: lessons 21–24
# --- Lesson 21: the perfect with haben -------------------------------------------
- id: de1-q-2101
  lesson: de1-perfect-haben
  module_quiz: true
  topic: Perfect tense
  stem: |-
    Complete the sentence: "Ich ___ gestern einen Ausflug gemacht."
  choices: ['habe', 'bin', 'hat', 'haben']
  answer: 0
  explanation: |-
    "Machen" forms its perfect with haben, and the subject is "ich", so the form is "habe". "Bin" is the sein auxiliary, used for movement verbs, not for "machen". "Hat" is for er/sie/es and "haben" for wir/sie/Sie.
- id: de1-q-2102
  lesson: de1-perfect-haben
  topic: Past participles
  stem: |-
    What is the past participle of "kaufen" (to buy)?
  choices: ['kaufte', 'gekaufen', 'gekauft', 'gekauf']
  answer: 2
  explanation: |-
    "Kaufen" is a regular (weak) verb: ge- + stem + -t gives "gekauft". "Gekaufen" mixes in the -en ending of strong verbs, which "kaufen" doesn't have. "Kaufte" is a different past form you don't need at A1.
- id: de1-q-2103
  lesson: de1-perfect-haben
  module_quiz: true
  topic: Past participles
  stem: |-
    Complete: "Am Sonntag haben wir unsere Oma ___." (visited)
  choices: ['gebesucht', 'besuchen', 'besuchte', 'besucht']
  answer: 3
  explanation: |-
    "Besuchen" has the inseparable prefix be-, which blocks ge-. The participle is simply "besucht". "Gebesucht" is the most common learner mistake: it adds ge- as if the verb had no prefix.
- id: de1-q-2104
  lesson: de1-perfect-haben
  topic: Past participles
  stem: |-
    What is the past participle of the separable verb "einkaufen" (to go shopping)?
  choices: ['eingekauft', 'geeinkauft', 'eingekaufen', 'einkauft']
  answer: 0
  explanation: |-
    In separable verbs, ge- goes between the prefix and the stem: ein + ge + kauft = "eingekauft", written as one word. "Geeinkauft" puts ge- in front of the whole verb, and "einkauft" leaves it out.
- id: de1-q-2105
  lesson: de1-perfect-haben
  module_quiz: true
  topic: Perfect tense
  stem: |-
    Which sentence is correct?
  choices: ['Ich habe gegessen eine Pizza.', 'Ich habe eine Pizza gegessen.', 'Ich eine Pizza habe gegessen.', 'Habe ich gegessen eine Pizza.']
  answer: 1
  explanation: |-
    In the perfect, haben is in position 2 and the participle goes to the very end, with the object in between: "Ich habe eine Pizza gegessen." Putting "gegessen" right after "habe" copies English word order ("I have eaten a pizza").
- id: de1-q-2106
  lesson: de1-perfect-haben
  topic: Past participles
  stem: |-
    Complete: "Mein Bruder hat in Berlin ___." (studied)
  choices: ['gestudiert', 'studiert', 'gestudieren', 'studieret']
  answer: 1
  explanation: |-
    Verbs ending in -ieren never take ge- in the participle: "studieren" becomes "studiert", like "fotografiert". "Gestudiert" is a very common mistake.
- id: de1-q-2107
  lesson: de1-perfect-haben
  topic: Past participles
  stem: |-
    Complete: "Hast du Brot ___?" (brought)
  choices: ['gebringt', 'gebrungen', 'gebracht', 'bringt']
  answer: 2
  explanation: |-
    "Bringen" is a mixed verb: the vowel changes like a strong verb, but the ending is -t like a weak verb. The participle is "gebracht". "Gebringt" treats it as regular, and "gebrungen" copies the pattern of "trinken – getrunken".
- id: de1-q-2108
  lesson: de1-perfect-haben
  module_quiz: true
  topic: kennen and wissen
  stem: |-
    Complete: "Ich ___ Frau Müller schon lange." (I've known Ms Müller for a long time.)
  choices: ['weiß', 'kennen', 'wisse', 'kenne']
  answer: 3
  explanation: |-
    You know a person with "kennen", and the ich form is "kenne". "Wissen" (ich weiß) is for facts and information, not people. "Kennen" without an ending is the infinitive or the wir/sie form.
- id: de1-q-2109
  lesson: de1-perfect-haben
  topic: Reading
  stem: |-
    Read the postcard:
    "Liebe Mia, wir sind in Hamburg! Gestern haben wir den Hafen (the harbour) besucht und Fisch gegessen. Heute habe ich Postkarten gekauft. Leider habe ich meine Brille verloren! Viele Grüße, Jan"
    What went wrong for Jan?
  choices: ['He lost his glasses.', 'He forgot to buy postcards.', 'He didn''t like the fish.', 'The harbour was closed.']
  answer: 0
  explanation: |-
    "Leider habe ich meine Brille verloren" means "Unfortunately I've lost my glasses". "Verloren" is the participle of "verlieren" (to lose). He did buy postcards ("Postkarten gekauft"), and nothing negative is said about the fish or the harbour.
- id: de1-q-2110
  lesson: de1-perfect-haben
  topic: Time words for the past
  stem: |-
    What does "Ich habe gerade gegessen." mean?
  choices: ['I''m eating right now.', 'I''ve just eaten.', 'I ate yesterday.', 'I want to eat now.']
  answer: 1
  explanation: |-
    "Gerade" with the perfect means "just (a moment ago)": I've just eaten. With the present tense ("Ich esse gerade") it would mean "I'm eating right now", but here the verb is in the perfect.
- id: de1-q-2111
  lesson: de1-perfect-haben
  topic: Dialogue
  stem: |-
    Your friend asks: "Was hast du am Wochenende gemacht?" What is the best answer?
  choices: ['Ich mache am Wochenende Sport.', 'Ja, ich habe am Wochenende.', 'Ich habe meine Eltern besucht.', 'Am Wochenende ist schön.']
  answer: 2
  explanation: |-
    The question is in the perfect and asks what you did, so answer in the perfect: "Ich habe meine Eltern besucht" (I visited my parents). "Ich mache am Wochenende Sport" is present tense and talks about a habit. "Ja" doesn't answer a W-question.
- id: de1-q-2112
  lesson: de1-perfect-haben
  topic: Past participles
  stem: |-
    Which sentence has a mistake?
  choices: ['Ich habe den Film gesehen.', 'Er hat mir geholfen.', 'Hast du das verstanden?', 'Wir haben das Auto geverkauft.']
  answer: 3
  explanation: |-
    "Verkaufen" has the inseparable prefix ver-, so its participle has no ge-: "Wir haben das Auto verkauft." The other three are correct: "gesehen" and "geholfen" are strong participles, and "verstanden" also has no ge- because of ver-.

# --- Lesson 22: the perfect with sein, war/hatte ---------------------------------
- id: de1-q-2201
  lesson: de1-perfect-sein
  module_quiz: true
  topic: haben or sein
  stem: |-
    Complete: "Wir ___ nach Spanien geflogen."
  choices: ['haben', 'sind', 'seid', 'ist']
  answer: 1
  explanation: |-
    "Fliegen" is a verb of movement from one place to another, so it takes sein, and the wir form of sein is "sind". "Haben" is the tempting English-style choice ("we have flown"). "Seid" is for ihr and "ist" for er/sie/es.
- id: de1-q-2202
  lesson: de1-perfect-sein
  topic: haben or sein
  stem: |-
    Complete: "Was ___ passiert?"
  choices: ['hat', 'haben', 'ist', 'sind']
  answer: 2
  explanation: |-
    "Passieren" (to happen) always forms its perfect with sein: "Was ist passiert?" (What happened?). It is one of the verbs you simply have to learn with sein, together with "sein" and "bleiben".
- id: de1-q-2203
  lesson: de1-perfect-sein
  topic: haben or sein
  stem: |-
    Which sentence is correct?
  choices: ['Ich habe um sieben Uhr aufgestanden.', 'Ich bin um sieben Uhr aufgestehen.', 'Ich habe um sieben Uhr aufgesteht.', 'Ich bin um sieben Uhr aufgestanden.']
  answer: 3
  explanation: |-
    "Aufstehen" is a change of state (from lying to standing), so it takes sein, and its participle is strong: auf + ge + standen = "aufgestanden". The first choice uses the wrong auxiliary; the other two have invented participles.
- id: de1-q-2204
  lesson: de1-perfect-sein
  topic: war and hatte
  stem: |-
    Complete: "Wo ___ du gestern?"
  choices: ['warst', 'war', 'warest', 'wart']
  answer: 0
  explanation: |-
    The du form of "war" takes the usual -st ending: "du warst". "War" is the ich and er/sie/es form, and "wart" is for ihr.
- id: de1-q-2205
  lesson: de1-perfect-sein
  topic: war and hatte
  stem: |-
    Complete: "Wir ___ leider keine Zeit." (We unfortunately didn't have time.)
  choices: ['hatte', 'hattet', 'hattest', 'hatten']
  answer: 3
  explanation: |-
    The wir form of "hatte" ends in -en: "wir hatten", just like "wir haben" in the present. "Hatte" is ich/er, "hattest" is du and "hattet" is ihr.
- id: de1-q-2206
  lesson: de1-perfect-sein
  module_quiz: true
  topic: haben or sein
  stem: |-
    Which of these verbs forms its perfect with haben?
  choices: ['kommen', 'fliegen', 'bleiben', 'essen']
  answer: 3
  explanation: |-
    "Essen" takes an object (etwas essen) and involves no movement, so it uses haben: "Ich habe gegessen." "Kommen" and "fliegen" are movement verbs (ist gekommen, ist geflogen), and "bleiben" is one of the special verbs with sein (ist geblieben).
- id: de1-q-2207
  lesson: de1-perfect-sein
  topic: Holidays and places
  stem: |-
    What does "Wir sind im See geschwommen." mean?
  choices: ['We swam in the sea.', 'We swam in the lake.', 'We are swimming in the lake.', 'We saw the lake.']
  answer: 1
  explanation: |-
    "Der See" (masculine) is a lake; the sea is "das Meer". "Sind … geschwommen" is the perfect, so it describes the past: we swam. "We saw" would be "Wir haben … gesehen".
- id: de1-q-2208
  lesson: de1-perfect-sein
  topic: wo and wohin
  stem: |-
    Complete the question: "___ seid ihr gefahren?" — "Nach Österreich."
  choices: ['Wo', 'Woher', 'Wohin', 'Wie']
  answer: 2
  explanation: |-
    The answer gives a destination ("to Austria"), so the question asks "where to": "Wohin". "Wo" asks about a position (where something is), and "Woher" asks where someone comes from.
- id: de1-q-2209
  lesson: de1-perfect-sein
  topic: Reading
  stem: |-
    Read the text:
    "Letztes Jahr bin ich mit meiner Freundin nach Kroatien gefahren. Wir waren zwei Wochen auf einer Insel. Am Strand war es sehr heiß. Plötzlich ist meine Freundin krank geworden, und wir sind früher nach Hause gefahren."
    Why did they go home early?
  choices: ['The weather was bad.', 'His girlfriend became ill.', 'They had no money left.', 'The beach was closed.']
  answer: 1
  explanation: |-
    "Plötzlich ist meine Freundin krank geworden" means "Suddenly my girlfriend became ill". "Geworden" is the participle of "werden" (to become), which takes sein. The weather was hot ("sehr heiß"), not bad.
- id: de1-q-2210
  lesson: de1-perfect-sein
  topic: haben or sein
  stem: |-
    Which sentence has a mistake?
  choices: ['Ich bin zu Hause geblieben.', 'Er ist Lehrer geworden.', 'Wir haben nach Hause gegangen.', 'Sie ist nach München umgezogen.']
  answer: 2
  explanation: |-
    "Gehen" is a movement verb, so it needs sein: "Wir sind nach Hause gegangen." The other sentences are correct: "bleiben", "werden" and "umziehen" all take sein.
- id: de1-q-2211
  lesson: de1-perfect-sein
  module_quiz: true
  topic: Dialogue
  stem: |-
    Your neighbour asks: "Wie war der Urlaub?" What is the best answer?
  choices: ['Super! Das Wetter war toll.', 'Ich fahre morgen in Urlaub.', 'Ja, ich bin im Urlaub.', 'Der Urlaub ist zwei Wochen.']
  answer: 0
  explanation: |-
    "Wie war …?" asks how something was, so a past answer that describes it fits: "Super! Das Wetter war toll." The other answers talk about the present or future, and "Ja" doesn't answer a W-question.
- id: de1-q-2212
  lesson: de1-perfect-sein
  topic: Past participles
  stem: |-
    Complete: "Der Zug ist pünktlich ___." (departed)
  choices: ['abgefahrt', 'gefahren ab', 'abfahren', 'abgefahren']
  answer: 3
  explanation: |-
    "Abfahren" is separable and "fahren" is strong, so the participle is ab + ge + fahren = "abgefahren", written as one word. "Abgefahrt" gives it a weak ending, and "gefahren ab" splits the participle like a present-tense verb.
- id: de1-q-2213
  lesson: de1-perfect-sein
  module_quiz: true
  topic: war and hatte
  stem: |-
    Complete: "___ ihr schon einmal in Wien?" (Have you ever been to Vienna?)
  choices: ['Wart', 'Wartet', 'Waren', 'Warst']
  answer: 0
  explanation: |-
    The ihr form of "war" is "wart" (ihr wart), with the -t ending of ihr. "Waren" is for wir and sie/Sie, and "warst" for du. "Wartet" is a form of "warten" (to wait).

# --- Lesson 23: linking sentences and writing messages ---------------------------
- id: de1-q-2301
  lesson: de1-writing
  module_quiz: true
  topic: Conjunctions
  stem: |-
    Complete: "Ich komme heute nicht, ___ ich bin krank."
  choices: ['denn', 'aber', 'oder', 'sondern']
  answer: 0
  explanation: |-
    The second half gives the reason, so the linking word is "denn" (because). "Aber" would contrast two ideas, and "sondern" needs to correct a negative. After "denn" the word order stays normal: "ich bin krank".
- id: de1-q-2302
  lesson: de1-writing
  topic: Conjunctions
  stem: |-
    Which sentence has the correct word order?
  choices: ['Ich gehe nach Hause, denn bin ich müde.', 'Ich gehe nach Hause, denn ich müde bin.', 'Ich gehe nach Hause, denn müde ich bin.', 'Ich gehe nach Hause, denn ich bin müde.']
  answer: 3
  explanation: |-
    "Denn" stands in position zero and doesn't change the word order: the second half is a normal sentence with the verb in position 2, "ich bin müde". Putting the verb at the end is the rule for "weil", which comes at A2.
- id: de1-q-2303
  lesson: de1-writing
  topic: Conjunctions
  stem: |-
    Complete: "Das ist nicht mein Handy, ___ das Handy von Tom."
  choices: ['aber', 'sondern', 'und', 'denn']
  answer: 1
  explanation: |-
    The first half is negative ("nicht mein Handy") and the second half corrects it, so you need "sondern" (but rather). "Aber" is the tempting choice because English uses "but" for both.
- id: de1-q-2304
  lesson: de1-writing
  topic: Conjunctions
  stem: |-
    Complete: "Das Zimmer ist klein, ___ es ist sehr hell."
  choices: ['sondern', 'denn', 'aber', 'oder']
  answer: 2
  explanation: |-
    There is a contrast (small, but bright) and no negative to correct, so the word is "aber". "Sondern" only follows "nicht" or "kein". "Denn" would give a reason, which doesn't make sense here.
- id: de1-q-2305
  lesson: de1-writing
  module_quiz: true
  topic: deshalb
  stem: |-
    Which sentence is correct?
  choices: ['Ich bin krank, deshalb ich bleibe zu Hause.', 'Ich bin krank, deshalb zu Hause bleibe ich.', 'Ich bin krank, deshalb ich zu Hause bleibe.', 'Ich bin krank, deshalb bleibe ich zu Hause.']
  answer: 3
  explanation: |-
    "Deshalb" is not a conjunction but an adverb in position 1, so the verb comes straight after it and the subject follows: "deshalb bleibe ich". Keeping "ich bleibe" treats deshalb like "denn".
- id: de1-q-2306
  lesson: de1-writing
  module_quiz: true
  topic: Writing messages
  stem: |-
    You are writing an e-mail to your friend Tom. How do you start?
  choices: ['Liebe Tom,', 'Lieber Tom,', 'Sehr geehrte Tom,', 'Lieben Tom,']
  answer: 1
  explanation: |-
    For a man the opening is "Lieber" + name; "Liebe" is for a woman (Liebe Anna). "Sehr geehrte" is formal and is used with Frau/Herr and a surname, never with a first name.
- id: de1-q-2307
  lesson: de1-writing
  topic: Writing messages
  stem: |-
    You are writing to an office where you don't know anyone. Which closing is right?
  choices: ['Viele Grüße', 'Bis bald!', 'Mit freundlichen Grüßen', 'Liebe Grüße']
  answer: 2
  explanation: |-
    "Mit freundlichen Grüßen" is the standard formal closing, used with "Sehr geehrte Damen und Herren". "Viele Grüße", "Liebe Grüße" and "Bis bald!" are for friends and people you know.
- id: de1-q-2308
  lesson: de1-writing
  topic: Forms
  stem: |-
    On a German form, what does the field "Staatsangehörigkeit" ask for?
  choices: ['your place of birth', 'your nationality', 'your marital status', 'your signature']
  answer: 1
  explanation: |-
    "Staatsangehörigkeit" is your nationality or citizenship, usually written as an adjective (deutsch, amerikanisch). Place of birth is "Geburtsort", marital status "Familienstand" and signature "Unterschrift".
- id: de1-q-2309
  lesson: de1-writing
  topic: Forms
  stem: |-
    A form says "Geburtsdatum: 04.07.1998". When was this person born?
  choices: ['7 April 1998', '4 July 1998', '4 June 1998', '7 July 1998']
  answer: 1
  explanation: |-
    German dates go day, month, year: 04.07. is the 4th of the 7th month, which is July. Reading it as 7 April is the American month-first order.
- id: de1-q-2310
  lesson: de1-writing
  module_quiz: true
  topic: Reading
  stem: |-
    Read the message:
    "Hallo Ben, danke für die Einladung! Ich komme gern am Freitag zum Grillen (to the barbecue), aber ich kann erst um acht Uhr kommen, denn ich muss bis sieben arbeiten. Soll ich etwas mitbringen (bring along)? Viele Grüße, Nina"
    Why is Nina coming late?
  choices: ['She has to work until seven.', 'She has no car.', 'She has to buy food first.', 'She doesn''t like barbecues.']
  answer: 0
  explanation: |-
    The reason comes after "denn": "ich muss bis sieben arbeiten" (I have to work until seven). Nina is happy to come ("Ich komme gern"), and she offers to bring something, but she doesn't say she has to buy food.
- id: de1-q-2311
  lesson: de1-writing
  topic: Conjunctions
  stem: |-
    Which sentence has a mistake?
  choices: ['Ich trinke keinen Tee, sondern Kaffee.', 'Er ist müde, aber er arbeitet.', 'Wir bleiben hier, denn es regnet.', 'Ich wohne in Berlin, sondern in Hamburg.']
  answer: 3
  explanation: |-
    "Sondern" needs a negative before it. Correct would be "Ich wohne nicht in Berlin, sondern in Hamburg." The first sentence is fine because "keinen" is negative.
- id: de1-q-2312
  lesson: de1-writing
  topic: Writing messages
  stem: |-
    What does "Ich muss den Termin leider absagen." mean?
  choices: ['Unfortunately I have to cancel the appointment.', 'Unfortunately I have to make an appointment.', 'I have to confirm the appointment.', 'I''ll be late for the appointment.']
  answer: 0
  explanation: |-
    "Absagen" means to cancel (an appointment or event), and "leider" means unfortunately. The noun is "die Absage", a message saying you can't come.
- id: de1-q-2313
  lesson: de1-writing
  topic: Forms
  stem: |-
    Which answer fits the form field "Familienstand"?
  choices: ['weiblich', 'deutsch', 'Köln', 'verheiratet']
  answer: 3
  explanation: |-
    "Familienstand" is marital status: ledig (single), verheiratet (married) or geschieden (divorced). "Weiblich" answers "Geschlecht", "deutsch" answers "Staatsangehörigkeit" and "Köln" could be your "Geburtsort" or "Ort".
- id: de1-q-2314
  lesson: de1-writing
  topic: Past participles
  stem: |-
    Complete: "Ich habe die Prüfung ___!" (I passed the exam!)
  choices: ['bestehen', 'gebestanden', 'bestanden', 'besteht']
  answer: 2
  explanation: |-
    "Bestehen" has the inseparable prefix be-, so there is no ge-, and it is strong (like "verstehen – verstanden"): "bestanden". "Gebestanden" adds a ge- that the prefix blocks.

# --- Lesson 24: the exam and review of the course -------------------------------
- id: de1-q-2401
  lesson: de1-exam-review
  module_quiz: true
  topic: A1 exam
  stem: |-
    How many points do you need to pass the Goethe-Zertifikat A1: Start Deutsch 1?
  choices: ['50 of 100', '60 of 100', '70 of 100', '80 of 100']
  answer: 1
  explanation: |-
    The pass mark is 60 of 100 points. 60–69 is "ausreichend", 70–79 "befriedigend", 80–89 "gut" and 90–100 "sehr gut".
- id: de1-q-2402
  lesson: de1-exam-review
  module_quiz: true
  topic: A1 exam
  stem: |-
    Which part of the Goethe A1 exam takes place in a small group, without preparation time?
  choices: ['Hören', 'Lesen', 'Schreiben', 'Sprechen']
  answer: 3
  explanation: |-
    Sprechen (speaking) is a short oral exam in a small group: you introduce yourself, ask and answer questions with word cards, and make and respond to requests. Hören, Lesen and Schreiben are written together in one block.
- id: de1-q-2403
  lesson: de1-exam-review
  topic: Classroom phrases
  stem: |-
    The examiner says something and you don't catch it. What do you say?
  choices: ['Können Sie das bitte wiederholen?', 'Wie sagt man das auf Deutsch?', 'Was bedeutet das?', 'Ich habe nichts gesagt.']
  answer: 0
  explanation: |-
    "Können Sie das bitte wiederholen?" asks the person to say it again. "Was bedeutet das?" asks about the meaning of a word you heard, and "Wie sagt man das auf Deutsch?" asks for a German word.
- id: de1-q-2404
  lesson: de1-exam-review
  topic: Small words
  stem: |-
    Complete: "Hast du etwas gesagt?" — "Nein, ich habe ___ gesagt."
  choices: ['nicht', 'kein', 'niemand', 'nichts']
  answer: 3
  explanation: |-
    The opposite of "etwas" (something) is "nichts" (nothing). "Nicht" negates a verb but can't replace an object, "kein" goes with a noun, and "niemand" means nobody.
- id: de1-q-2405
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Complete: "Ich nehme ___ Kaffee." (der Kaffee)
  choices: ['ein', 'eine', 'einen', 'einem']
  answer: 2
  explanation: |-
    "Kaffee" is the direct object, so it is in the accusative, and masculine "ein" becomes "einen" (lesson 9). "Ein" is the nominative, and "einem" is the dative.
- id: de1-q-2406
  lesson: de1-exam-review
  module_quiz: true
  topic: Review
  stem: |-
    Which sentence is correct?
  choices: ['Am Montag ich arbeite.', 'Ich am Montag arbeite.', 'Arbeite am Montag ich.', 'Am Montag arbeite ich.']
  answer: 3
  explanation: |-
    The verb is always the second element in a statement. When "Am Montag" comes first, the verb follows and the subject moves behind it: "Am Montag arbeite ich" (lessons 4 and 12). "Am Montag ich arbeite" is English word order.
- id: de1-q-2407
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Complete: "Ich kann heute leider nicht ___."
  choices: ['kommen', 'komme', 'kommt', 'gekommen']
  answer: 0
  explanation: |-
    After a modal verb such as "können", the second verb goes to the end in the infinitive: "kommen" (lesson 14). "Gekommen" is the participle, used with haben or sein in the perfect.
- id: de1-q-2408
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Which question is correct? (anfangen = to start)
  choices: ['Wann fängt der Film an?', 'Wann anfängt der Film?', 'Wann der Film fängt an?', 'Wann fängt an der Film?']
  answer: 0
  explanation: |-
    "Anfangen" is separable: the verb "fängt" stays in position 2 and the prefix "an" goes to the end (lesson 12). It also has a stem change, a → ä, in the er/sie/es form.
- id: de1-q-2409
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Complete: "Ich fahre mit ___ Bus zur Arbeit." (der Bus)
  choices: ['der', 'den', 'dem', 'das']
  answer: 2
  explanation: |-
    "Mit" is always followed by the dative, and masculine "der" becomes "dem" (lesson 18). "Den" is the accusative, which is a common mix-up.
- id: de1-q-2410
  lesson: de1-exam-review
  module_quiz: true
  topic: Review
  stem: |-
    Complete: "Gestern ___ wir ins Kino gegangen."
  choices: ['sind', 'haben', 'seid', 'hat']
  answer: 0
  explanation: |-
    "Gehen" is a verb of movement, so its perfect uses sein, and the wir form is "sind" (lesson 22). "Haben" is the auxiliary for most other verbs.
- id: de1-q-2411
  lesson: de1-exam-review
  topic: Reading
  stem: |-
    Read the sign:
    "Bäckerei Schmidt. Montag bis Freitag 6:30–18:00 Uhr, Samstag 7:00–12:00 Uhr, Sonntag geschlossen."
    It is Saturday, 2 p.m. Is the bakery open?
  choices: ['Yes, until 18:00.', 'No, it closed at 12:00.', 'No, it is closed all day on Saturday.', 'Yes, it opens at 14:00.']
  answer: 1
  explanation: |-
    On Saturday ("Samstag") the bakery is open from 7:00 to 12:00, so at 2 p.m. (14:00) it is already closed. The 18:00 closing time is for Monday to Friday, and "geschlossen" (closed) is for Sunday.
- id: de1-q-2412
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Complete: "Das ist ___ Schwester." (my)
  choices: ['mein', 'meinen', 'meine', 'meiner']
  answer: 2
  explanation: |-
    "Schwester" is feminine (die Schwester), so the possessive takes -e: "meine Schwester" (lesson 6). "Mein" is for masculine and neuter nouns in the nominative.
- id: de1-q-2413
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Which sentence is written correctly?
  choices: ['ich habe einen hund.', 'Ich habe einen hund.', 'Ich Habe Einen Hund.', 'Ich habe einen Hund.']
  answer: 3
  explanation: |-
    In German the first word of a sentence and every noun start with a capital letter: "Hund" is a noun, so it is capitalized, but verbs and articles are not (lessons 1 and 5).
- id: de1-q-2414
  lesson: de1-exam-review
  topic: Review
  stem: |-
    Complete: "Ich habe ___ Auto." (I don't have a car.)
  choices: ['kein', 'nicht', 'keine', 'nichts']
  answer: 0
  explanation: |-
    A noun with "ein" is negated with "kein", and "Auto" is neuter, so "kein Auto" (lesson 8). "Nicht" doesn't replace an article, and "keine" is for feminine and plural nouns.
