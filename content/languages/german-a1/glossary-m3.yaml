# German A1, module 3 glossary terms (lessons 09–12)
- term: accusative
  aliases: [accusative case, Akkusativ]
  definition: 'The case of the direct object: the person or thing the verb acts on. In German only the masculine article changes: der becomes den, ein becomes einen, kein becomes keinen (Ich trinke einen Kaffee). Feminine, neuter and plural forms are the same as in the nominative.'
  topic: Cases
- term: direct object
  aliases: [direct objects]
  definition: 'The person or thing that the action of the verb is done to. In "I eat the apple" the apple is the direct object. In German the direct object is in the accusative: Ich esse den Apfel.'
  topic: Cases
- term: demonstrative
  aliases: [demonstratives, demonstrative article]
  definition: 'A word that points to a particular thing, like English this or that. German dieser (this, that) takes the same endings as der, die, das: dieser, diese, dieses, masculine accusative diesen.'
  topic: Articles
- term: frequency adverb
  aliases: [frequency adverbs, adverb of frequency]
  definition: 'An adverb that says how often something happens: immer (always), oft (often), manchmal (sometimes), nie (never). It usually comes right after the verb: Ich trinke oft Tee.'
  topic: Time
- term: separable verb
  aliases: [separable verbs, trennbares Verb]
  definition: 'A verb with a stressed prefix that splits off in a main clause: the conjugated verb stays in second place and the prefix goes to the end. aufstehen: Ich stehe um sieben Uhr auf. In the infinitive the verb stays in one piece: Ich möchte einkaufen.'
  topic: Verbs
- term: separable prefix
  aliases: [separable prefixes]
  definition: 'The small front part of a separable verb, such as auf, an, ein, mit, ab or fern. It carries the stress (AUFstehen) and moves to the end of a main clause: Ich rufe meine Mutter an.'
  topic: Verbs
- term: inversion
  aliases: [subject-verb inversion]
  definition: 'Putting the subject after the verb. In a German statement the verb is always the second element, so when something else comes first, such as a time phrase, the subject follows the verb: Am Montag arbeite ich.'
  topic: Word order
