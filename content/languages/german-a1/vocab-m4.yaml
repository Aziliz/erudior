- id: hobby
  lesson: de1-hobbies
  term: das Hobby
  pos: noun
  plural: die Hobbys
  meanings:
  - hobby
  example: Mein Hobby ist Musik.
  exampleEn: My hobby is music.
- id: freizeit
  lesson: de1-hobbies
  term: die Freizeit
  pos: noun
  plural: —
  meanings:
  - free time
  - spare time
  - leisure time
  - leisure
  example: Was machst du in der Freizeit?
  exampleEn: What do you do in your free time?
- id: lesen
  lesson: de1-hobbies
  term: lesen
  pos: verb
  meanings:
  - to read
  example: Liest du gern Bücher?
  exampleEn: Do you like reading books?
  note: 'Stem change: du liest, er liest. Perfect: hat gelesen.'
- id: sehen
  lesson: de1-hobbies
  term: sehen
  pos: verb
  meanings:
  - to see
  - to watch
  example: Wir sehen heute einen Film.
  exampleEn: We are watching a film today.
  note: 'Stem change: du siehst, er sieht. Perfect: hat gesehen.'
- id: fahren
  lesson: de1-hobbies
  term: fahren
  pos: verb
  meanings:
  - to go (by vehicle)
  - to go
  - to drive
  - to ride
  - to travel
  example: Mein Vater fährt jeden Tag Fahrrad.
  exampleEn: My father rides his bike every day.
  note: 'Stem change: du fährst, er fährt. Perfect: ist gefahren.'
- id: schwimmen
  lesson: de1-hobbies
  term: schwimmen
  pos: verb
  meanings:
  - to swim
  - to go swimming
  example: Im Sommer schwimme ich gern.
  exampleEn: In summer I like swimming.
  note: 'Perfect: ist geschwommen.'
- id: tanzen
  lesson: de1-hobbies
  term: tanzen
  pos: verb
  meanings:
  - to dance
  example: Tanzt du gern?
  exampleEn: Do you like dancing?
  note: du tanzt (the stem ends in z, so du only adds -t).
- id: singen
  lesson: de1-hobbies
  term: singen
  pos: verb
  meanings:
  - to sing
  example: Meine Schwester singt sehr schön.
  exampleEn: My sister sings very beautifully.
  note: 'Perfect: hat gesungen.'
- id: reisen
  lesson: de1-hobbies
  term: reisen
  pos: verb
  meanings:
  - to travel
  - to journey
  - to take a trip
  example: Wir reisen gern zusammen.
  exampleEn: We like travelling together.
  note: 'du reist. Perfect: ist gereist.'
- id: wandern
  lesson: de1-hobbies
  term: wandern
  pos: verb
  meanings:
  - to hike
  - to go hiking
  - to go walking
  - to ramble
  - to walk (in the country)
  example: Am Sonntag wandern wir oft.
  exampleEn: We often go hiking on Sundays.
  note: 'ich wandere. Perfect: ist gewandert.'
- id: joggen
  lesson: de1-hobbies
  term: joggen
  pos: verb
  meanings:
  - to jog
  - to go jogging
  - to run (for exercise)
  example: Er joggt jeden Morgen.
  exampleEn: He jogs every morning.
  note: 'Perfect: ist gejoggt (hat gejoggt is also used).'
- id: malen
  lesson: de1-hobbies
  term: malen
  pos: verb
  meanings:
  - to paint
  - to draw (a picture)
  example: Das Kind malt eine Katze.
  exampleEn: The child is painting a cat.
- id: fotografieren
  lesson: de1-hobbies
  term: fotografieren
  pos: verb
  meanings:
  - to take photos
  - to take pictures
  - to photograph
  - to take a photo
  example: Ich fotografiere gern Tiere.
  exampleEn: I like taking photos of animals.
  note: 'Perfect: hat fotografiert (no ge- with -ieren verbs).'
- id: treffen
  lesson: de1-hobbies
  term: treffen
  pos: verb
  meanings:
  - to meet
  - to meet up with
  - to see (meet)
  example: Ich treffe am Freitag meine Freunde.
  exampleEn: I am meeting my friends on Friday.
  note: 'Stem change: du triffst, er trifft. Perfect: hat getroffen.'
- id: sport
  lesson: de1-hobbies
  term: der Sport
  pos: noun
  plural: —
  meanings:
  - sport
  - sports
  - exercise
  - PE
  example: Machst du gern Sport?
  exampleEn: Do you like doing sport?
  note: Sport machen = to do sport, to exercise.
- id: fussball
  lesson: de1-hobbies
  term: der Fußball
  pos: noun
  plural: die Fußbälle
  meanings:
  - football (soccer)
  - soccer
  - football
  - soccer ball
  example: Die Kinder spielen Fußball.
  exampleEn: The children are playing football.
  alt:
  - der Fussball
  note: 'No article for the game: Ich spiele Fußball.'
- id: fahrrad
  lesson: de1-hobbies
  term: das Fahrrad
  pos: noun
  plural: die Fahrräder
  meanings:
  - bicycle
  - bike
  - cycle
  example: Mein Fahrrad ist neu.
  exampleEn: My bike is new.
  note: 'Fahrrad fahren = to cycle. Short form: das Rad.'
- id: musik
  lesson: de1-hobbies
  term: die Musik
  pos: noun
  plural: —
  meanings:
  - music
  example: Ich höre gern Musik.
  exampleEn: I like listening to music.
- id: spiel
  lesson: de1-hobbies
  term: das Spiel
  pos: noun
  plural: die Spiele
  meanings:
  - game
  - match
  - play (game)
  example: Das Spiel ist sehr lustig.
  exampleEn: The game is very funny.
- id: film
  lesson: de1-hobbies
  term: der Film
  pos: noun
  plural: die Filme
  meanings:
  - film
  - movie
  example: Der Film ist leider langweilig.
  exampleEn: Unfortunately the film is boring.
- id: kino
  lesson: de1-hobbies
  term: das Kino
  pos: noun
  plural: die Kinos
  meanings:
  - cinema
  - movie theater
  - movies
  - the movies
  example: Gehen wir heute ins Kino?
  exampleEn: Shall we go to the cinema today?
  note: ins Kino gehen = to go to the cinema.
- id: konzert
  lesson: de1-hobbies
  term: das Konzert
  pos: noun
  plural: die Konzerte
  meanings:
  - concert
  - gig
  example: Das Konzert fängt um acht an.
  exampleEn: The concert starts at eight.
- id: theater
  lesson: de1-hobbies
  term: das Theater
  pos: noun
  plural: die Theater
  meanings:
  - theatre
  - theater
  example: Das Theater ist im Zentrum.
  exampleEn: The theatre is in the centre.
- id: lied
  lesson: de1-hobbies
  term: das Lied
  pos: noun
  plural: die Lieder
  meanings:
  - song
  example: Wir singen ein Lied.
  exampleEn: We are singing a song.
- id: geben
  lesson: de1-hobbies
  term: geben
  pos: verb
  meanings:
  - to give
  - to hand
  example: Gibst du mir bitte das Buch?
  exampleEn: Can you give me the book, please?
  note: 'Stem change: du gibst, er gibt. Perfect: hat gegeben. es gibt = there is/are.'
- id: helfen
  lesson: de1-hobbies
  term: helfen
  pos: verb
  meanings:
  - to help
  example: Mein Bruder hilft gern.
  exampleEn: My brother likes helping.
  note: 'Stem change: du hilfst, er hilft. Perfect: hat geholfen. Takes the dative: Ich helfe dir.'
- id: lieber
  lesson: de1-hobbies
  term: lieber
  pos: adverb
  meanings:
  - rather (prefer)
  - rather
  - prefer
  - preferably
  - sooner
  - more gladly
  example: Ich trinke lieber Tee.
  exampleEn: I prefer tea.
  note: 'Comparative of gern: gern, lieber, am liebsten.'
- id: am-liebsten
  lesson: de1-hobbies
  term: am liebsten
  pos: adverb
  meanings:
  - most of all (like best)
  - most of all
  - like best
  - best of all
  - like most
  - like most of all
  example: Am liebsten lese ich.
  exampleEn: Most of all I like reading.
  note: Superlative of gern.
- id: allein
  lesson: de1-hobbies
  term: allein
  pos: adverb
  meanings:
  - alone
  - by oneself
  - on one's own
  - on my own
  - by myself
  example: Ich wohne allein.
  exampleEn: I live alone.
  alt:
  - alleine
- id: spazieren-gehen
  lesson: de1-hobbies
  kind: phrase
  term: spazieren gehen
  pos: verb
  meanings:
  - to go for a walk
  - to take a walk
  - to walk
  - to stroll
  example: Wir gehen am Abend spazieren.
  exampleEn: We go for a walk in the evening.
  note: 'ich gehe spazieren. Perfect: ist spazieren gegangen.'
- id: koennen
  lesson: de1-modals-1
  term: können
  pos: verb
  meanings:
  - can (be able to)
  - can
  - to be able to
  - to know how to
  - be able
  example: Kannst du schwimmen?
  exampleEn: Can you swim?
  note: 'Modal verb: ich kann, du kannst, er kann, wir können, ihr könnt, sie können.'
- id: wollen
  lesson: de1-modals-1
  term: wollen
  pos: verb
  meanings:
  - to want (to)
  - to want
  - to wish
  - want to
  example: Ich will Gitarre lernen.
  exampleEn: I want to learn the guitar.
  note: 'Modal verb: ich will, du willst, er will, wir wollen, ihr wollt, sie wollen. Ich will = I want
    (not I will).'
- id: moegen
  lesson: de1-modals-1
  term: mögen
  pos: verb
  meanings:
  - to like (a thing or person)
  - to like
  - to be fond of
  - to care for
  example: Magst du Käse?
  exampleEn: Do you like cheese?
  note: ich mag, du magst, er mag, wir mögen, ihr mögt, sie mögen. Mostly with a noun; for activities
    use gern.
- id: instrument
  lesson: de1-modals-1
  term: das Instrument
  pos: noun
  plural: die Instrumente
  meanings:
  - instrument (musical)
  - instrument
  - musical instrument
  example: Spielst du ein Instrument?
  exampleEn: Do you play an instrument?
- id: gitarre
  lesson: de1-modals-1
  term: die Gitarre
  pos: noun
  plural: die Gitarren
  meanings:
  - guitar
  example: Ich spiele ein bisschen Gitarre.
  exampleEn: I play the guitar a little.
  note: 'No article for playing: Gitarre spielen.'
- id: klavier
  lesson: de1-modals-1
  term: das Klavier
  pos: noun
  plural: die Klaviere
  meanings:
  - piano
  example: Meine Tochter kann Klavier spielen.
  exampleEn: My daughter can play the piano.
- id: ski-fahren
  lesson: de1-modals-1
  kind: phrase
  term: Ski fahren
  pos: verb
  meanings:
  - to ski
  - to go skiing
  example: Im Winter fahren wir Ski.
  exampleEn: In winter we go skiing.
  alt:
  - Ski laufen
  - Schi fahren
  note: 'ich fahre Ski, du fährst Ski. Perfect: ist Ski gefahren.'
- id: auto-fahren
  lesson: de1-modals-1
  kind: phrase
  term: Auto fahren
  pos: verb
  meanings:
  - to drive (a car)
  - to drive
  - to drive a car
  example: Kannst du schon Auto fahren?
  exampleEn: Can you drive yet?
  note: 'ich fahre Auto, du fährst Auto. Perfect: ist Auto gefahren.'
- id: ein-bisschen
  lesson: de1-modals-1
  kind: phrase
  term: ein bisschen
  pos: adverb
  meanings:
  - a little bit
  - a bit
  - a little
  - slightly
  - some
  example: Ich spreche ein bisschen Deutsch.
  exampleEn: I speak a little German.
- id: natuerlich
  lesson: de1-modals-1
  term: natürlich
  pos: adverb
  meanings:
  - of course
  - naturally
  - certainly
  - sure
  example: Natürlich helfe ich dir.
  exampleEn: Of course I will help you.
- id: vielleicht
  lesson: de1-modals-1
  term: vielleicht
  pos: adverb
  meanings:
  - maybe
  - perhaps
  - possibly
  example: Vielleicht kommt sie später.
  exampleEn: Maybe she will come later.
- id: leider
  lesson: de1-modals-1
  term: leider
  pos: adverb
  meanings:
  - unfortunately
  - sadly
  - I'm afraid
  - regrettably
  example: Ich kann leider nicht kommen.
  exampleEn: Unfortunately I can't come.
- id: schon
  lesson: de1-modals-1
  term: schon
  pos: adverb
  meanings:
  - already
  - yet (in questions)
  - yet
  example: Bist du schon fertig?
  exampleEn: Are you finished already?
- id: noch
  lesson: de1-modals-1
  term: noch
  pos: adverb
  meanings:
  - still (continuing)
  - still
  - yet
  - more (another)
  example: Ich lerne noch.
  exampleEn: I am still learning.
  note: noch ein Kaffee = another coffee.
- id: noch-nicht
  lesson: de1-modals-1
  kind: phrase
  term: noch nicht
  pos: adverb
  meanings:
  - not yet
  example: Er kann noch nicht lesen.
  exampleEn: He can't read yet.
- id: gleich
  lesson: de1-modals-1
  term: gleich
  pos: adverb
  meanings:
  - right away (in a moment)
  - in a moment
  - right away
  - immediately
  - at once
  - soon
  - in a minute
  - same
  - equal
  example: Ich komme gleich!
  exampleEn: I'm coming right away!
  note: 'As an adjective it also means "same": das gleiche Buch.'
- id: wirklich
  lesson: de1-modals-1
  term: wirklich
  pos: adverb
  meanings:
  - really
  - truly
  - actually
  - real
  - genuinely
  example: Das Konzert ist wirklich toll.
  exampleEn: The concert is really great.
- id: sicher
  lesson: de1-modals-1
  term: sicher
  pos: adverb
  meanings:
  - sure (certain)
  - sure
  - certain
  - certainly
  - surely
  - safe
  - secure
  example: Sie kommt sicher.
  exampleEn: She's sure to come.
  note: 'Also an adjective: safe, secure.'
- id: idee
  lesson: de1-modals-1
  term: die Idee
  pos: noun
  plural: die Ideen
  meanings:
  - idea
  example: Das ist eine gute Idee!
  exampleEn: That is a good idea!
- id: lust
  lesson: de1-modals-1
  term: die Lust
  pos: noun
  plural: —
  meanings:
  - desire (to do something)
  - desire
  - wish
  - inclination
  - interest
  - pleasure
  - mood
  example: Hast du Lust auf Kino?
  exampleEn: Do you feel like going to the cinema?
  note: 'Lust haben = to feel like (doing something): Ich habe keine Lust. (Plural die Lüste exists but
    means lusts.)'
- id: spass
  lesson: de1-modals-1
  term: der Spaß
  pos: noun
  plural: die Späße
  meanings:
  - fun
  - enjoyment
  - joke
  example: Tanzen macht Spaß.
  exampleEn: Dancing is fun.
  alt:
  - der Spass
  note: Das macht Spaß = that is fun. Viel Spaß! = Have fun!
- id: plan
  lesson: de1-modals-1
  term: der Plan
  pos: noun
  plural: die Pläne
  meanings:
  - plan
  - schedule
  example: Hast du schon Pläne für Samstag?
  exampleEn: Do you have plans for Saturday yet?
- id: party
  lesson: de1-modals-1
  term: die Party
  pos: noun
  plural: die Partys
  meanings:
  - party (celebration)
  - party
  example: Am Freitag machen wir eine Party.
  exampleEn: We're having a party on Friday.
- id: fest
  lesson: de1-modals-1
  term: das Fest
  pos: noun
  plural: die Feste
  meanings:
  - festival (celebration)
  - celebration
  - festival
  - feast
  - fete
  - party
  example: Im Sommer gibt es hier ein großes Fest.
  exampleEn: In summer there is a big festival here.
- id: einladen
  lesson: de1-modals-1
  term: einladen
  pos: verb
  meanings:
  - to invite
  - to treat (pay for someone)
  example: Ich lade meine Freunde ein.
  exampleEn: I am inviting my friends.
  note: 'Separable: ich lade ein. Stem change: du lädst ein, er lädt ein. Perfect: hat eingeladen.'
- id: feiern
  lesson: de1-modals-1
  term: feiern
  pos: verb
  meanings:
  - to celebrate
  - to party
  - to have a party
  example: Wir feiern am Samstag.
  exampleEn: We are celebrating on Saturday.
  note: ich feiere, du feierst.
- id: muessen
  lesson: de1-modals-2
  term: müssen
  pos: verb
  meanings:
  - must (have to)
  - must
  - to have to
  - to need to
  - to have got to
  example: Ich muss heute arbeiten.
  exampleEn: I have to work today.
  note: 'Modal verb: ich muss, du musst, er muss, wir müssen, ihr müsst, sie müssen. nicht müssen = not
    have to.'
- id: duerfen
  lesson: de1-modals-2
  term: dürfen
  pos: verb
  meanings:
  - may (be allowed to)
  - may
  - to be allowed to
  - to be permitted to
  - can (be allowed)
  example: Darf ich hier parken?
  exampleEn: May I park here?
  note: 'Modal verb: ich darf, du darfst, er darf, wir dürfen, ihr dürft, sie dürfen. nicht dürfen = must
    not.'
- id: sollen
  lesson: de1-modals-2
  term: sollen
  pos: verb
  meanings:
  - should (be supposed to)
  - should
  - to be supposed to
  - ought to
  - shall
  example: Soll ich das Fenster öffnen?
  exampleEn: Shall I open the window?
  note: 'Modal verb: ich soll, du sollst, er soll, wir sollen, ihr sollt, sie sollen.'
- id: man
  lesson: de1-modals-2
  term: man
  pos: pronoun
  meanings:
  - one (people in general)
  - one
  - you (in general)
  - people
  - they (in general)
  - we (in general)
  example: Hier darf man nicht rauchen.
  exampleEn: You aren't allowed to smoke here.
  note: 'Takes the er/sie/es form: man muss, man darf. Not der Mann (the man).'
- id: rauchen
  lesson: de1-modals-2
  term: rauchen
  pos: verb
  meanings:
  - to smoke
  example: Rauchen Sie?
  exampleEn: Do you smoke?
- id: parken
  lesson: de1-modals-2
  term: parken
  pos: verb
  meanings:
  - to park
  example: Wo kann ich parken?
  exampleEn: Where can I park?
- id: warten
  lesson: de1-modals-2
  term: warten
  pos: verb
  meanings:
  - to wait
  example: Wir warten auf den Bus.
  exampleEn: We are waiting for the bus.
  note: du wartest, er wartet. warten auf + accusative = to wait for.
- id: bleiben
  lesson: de1-modals-2
  term: bleiben
  pos: verb
  meanings:
  - to stay
  - to remain
  example: Ich bleibe heute zu Hause.
  exampleEn: I am staying at home today.
  note: 'Perfect: ist geblieben.'
- id: oeffnen
  lesson: de1-modals-2
  term: öffnen
  pos: verb
  meanings:
  - to open
  example: Kannst du bitte die Tür öffnen?
  exampleEn: Can you open the door, please?
  note: 'du öffnest, er öffnet. Signs: geöffnet = open.'
- id: schliessen
  lesson: de1-modals-2
  term: schließen
  pos: verb
  meanings:
  - to close
  - to shut
  example: Die Bäckerei schließt um sechs.
  exampleEn: The bakery closes at six.
  alt:
  - schliessen
  note: 'Perfect: hat geschlossen. Signs: geschlossen = closed.'
- id: verboten
  lesson: de1-modals-2
  term: verboten
  pos: adjective
  meanings:
  - forbidden
  - prohibited
  - not allowed
  - banned
  example: Parken ist hier verboten.
  exampleEn: Parking is forbidden here.
- id: erlaubt
  lesson: de1-modals-2
  term: erlaubt
  pos: adjective
  meanings:
  - allowed
  - permitted
  example: Ist Rauchen hier erlaubt?
  exampleEn: Is smoking allowed here?
- id: regel
  lesson: de1-modals-2
  term: die Regel
  pos: noun
  plural: die Regeln
  meanings:
  - rule
  - regulation
  example: Das ist eine wichtige Regel.
  exampleEn: That is an important rule.
- id: schild
  lesson: de1-modals-2
  term: das Schild
  pos: noun
  plural: die Schilder
  meanings:
  - sign (notice)
  - sign
  - notice
  - plate
  - nameplate
  example: Was steht auf dem Schild?
  exampleEn: What does the sign say?
- id: hausaufgabe
  lesson: de1-modals-2
  term: die Hausaufgabe
  pos: noun
  plural: die Hausaufgaben
  meanings:
  - homework (task)
  - homework
  - assignment
  example: Ich muss noch die Hausaufgaben machen.
  exampleEn: I still have to do my homework.
  note: 'Usually plural: die Hausaufgaben machen.'
- id: termin
  lesson: de1-modals-2
  term: der Termin
  pos: noun
  plural: die Termine
  meanings:
  - appointment
  - date (arranged meeting)
  - meeting
  - deadline
  example: Ich habe morgen einen Termin beim Arzt.
  exampleEn: I have a doctor's appointment tomorrow.
- id: puenktlich
  lesson: de1-modals-2
  term: pünktlich
  pos: adjective
  meanings:
  - on time
  - punctual
  - punctually
  example: Der Zug ist heute pünktlich.
  exampleEn: The train is on time today.
- id: ruhig
  lesson: de1-modals-2
  term: ruhig
  pos: adjective
  meanings:
  - calm (quiet, peaceful)
  - calm
  - quiet
  - peaceful
  - calmly
  - quietly
  example: Unsere Straße ist sehr ruhig.
  exampleEn: Our street is very quiet.
- id: laut
  lesson: de1-modals-2
  term: laut
  pos: adjective
  meanings:
  - loud
  - noisy
  - loudly
  example: Die Musik ist zu laut.
  exampleEn: The music is too loud.
- id: leise
  lesson: de1-modals-2
  term: leise
  pos: adjective
  meanings:
  - quiet (not loud)
  - quiet
  - quietly
  - softly
  - soft
  - low (volume)
  example: Bitte sprecht leise!
  exampleEn: Please speak quietly!
- id: wichtig
  lesson: de1-modals-2
  term: wichtig
  pos: adjective
  meanings:
  - important
  example: Der Termin ist sehr wichtig.
  exampleEn: The appointment is very important.
- id: ausweis
  lesson: de1-modals-2
  term: der Ausweis
  pos: noun
  plural: die Ausweise
  meanings:
  - ID card
  - ID
  - identity card
  - identification
  - pass
  example: Haben Sie einen Ausweis?
  exampleEn: Do you have an ID card?
  note: The German ID card is der Personalausweis.
- id: formular
