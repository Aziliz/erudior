# German A1, module 4 honors lessons (round 2): notecards
# --- 16h1 Clubs, quiet hours and favourite things ---
- {front: 'der Verein, e. V.', back: 'A club or association. e. V. = eingetragener Verein, a club in the official register: TC Rotbuche e. V.', topic: Free time culture}
- {front: 'Saying you are in a club', back: 'im Verein: Ich spiele im Verein Fußball. Meine Tochter singt im Chor.', topic: Free time culture}
- {front: 'How many clubs does Germany have?', back: 'About 629,000 registered clubs (ZiviZ, March 2026); about 86,000 sports clubs with about 29.3 million memberships (DOSB, 2025).', topic: Free time culture}
- {front: 'die Nachtruhe', back: 'Night quiet time, usually 22 to 6 Uhr (state and local rules). Von 22 bis 6 Uhr darf man keine laute Musik hören.', topic: Free time culture}
- {front: 'die Mittagsruhe', back: 'Midday quiet time, often 13 to 15 Uhr. Not a general law: it depends on the town and the house rules (Hausordnung).', topic: Free time culture}
- {front: 'Sundays and public holidays in Germany', back: 'Protected days of rest (Sonntagsruhe): most shops closed, no noisy work such as mowing the lawn. Bakeries may open a few hours; station and airport shops stay open.', topic: Free time culture}
- {front: 'Rules in a Hausordnung', back: 'man + modal (er form): Hier darf man nicht …, man muss …, man soll … Fahrräder darf man nicht im Treppenhaus parken.', topic: Free time culture}
- {front: 'Lieblings- + noun', back: 'favourite …, written as one word: der Lieblingsfilm, die Lieblingsfarbe, das Lieblingsessen. Gender from the last noun.', topic: Favourites and comparisons}
- {front: 'meine Lieblingsfarbe or mein Lieblingsfarbe?', back: 'meine: die Farbe → die Lieblingsfarbe (feminine), so the possessive takes -e.', topic: Favourites and comparisons}
- {front: 'lieber … als …', back: 'prefer … to …: Ich trinke lieber Tee als Kaffee. lieber right after the verb, the als part at the end.', topic: Favourites and comparisons}
- {front: 'gar nicht gern → nicht so gern → gern → sehr gern → lieber → am liebsten', back: 'not at all → not really → like → really like → prefer → like most of all.', topic: Favourites and comparisons}
# --- 16h2 The German year ---
- {front: 'Public holidays in all German states', back: 'Nine: Neujahr, Karfreitag, Ostermontag, Tag der Arbeit (1.5.), Christi Himmelfahrt, Pfingstmontag, Tag der Deutschen Einheit (3.10.), 25. and 26. Dezember. The states set the rest.', topic: Holidays and customs}
- {front: 'Tag der Deutschen Einheit', back: '3 October: reunification of East and West Germany in 1990. The only public holiday fixed by national law (Unification Treaty).', topic: Holidays and customs}
- {front: 'Not public holidays (but well known)', back: 'Heiligabend (24.12.), Silvester (31.12.), Rosenmontag, Sankt Martin (11.11.), Nikolaustag (6.12.).', topic: Holidays and customs}
- {front: 'When are Christmas presents opened in Germany?', back: 'Usually on the evening of 24 December, Heiligabend (die Bescherung).', topic: Holidays and customs}
- {front: 'Guten Rutsch! or Frohes neues Jahr!?', back: 'Guten Rutsch! before New Year (until midnight on 31.12.); Frohes neues Jahr! from 1 January on.', topic: Holidays and customs}
- {front: 'Karneval or Fasching?', back: 'Same season, different regions: Karneval in the Rhineland (Köln, Düsseldorf, Mainz), Fasching in the south and Austria. Parades on Rosenmontag.', topic: Holidays and customs}
- {front: 'Congratulating early on a birthday', back: 'Many Germans consider it bad luck (a superstition). Wait for the day: Alles Gute zum Geburtstag!', topic: Holidays and customs}
- {front: 'Easter and the holidays counted from it', back: 'Easter Sunday: between 22 March and 25 April. Good Friday 2 days before; Ascension Day 39 days after (a Thursday); Whit Monday 50 days after.', topic: Holidays and customs}
- {front: 'Ordinal endings in dates', back: 'der + -e: der dritte Mai. am, vom, zum, den + -en: am dritten, vom dritten, bis zum dritten, den dritten Mai.', topic: Dates and ranges}
- {front: 'Date range: from 1 to 14 August', back: 'vom ersten bis zum vierzehnten August (written vom 1. bis zum 14. August, or 1.–14.8.).', topic: Dates and ranges}
- {front: 'Date at the top of a letter', back: 'Hamburg, den 6. Dezember 2026 (den sechsten). Modern letters often leave out den: Hamburg, 06.12.2026.', topic: Dates and ranges}
