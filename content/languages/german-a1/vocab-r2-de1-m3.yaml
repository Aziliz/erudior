# German A1, round 2, module de1-m3: words introduced by the honors lessons 12h1 and 12h2

# --- 12h1 Brötchen, Kaffee und Kuchen ---
- id: de1-m3-r2-w01
  lesson: de1-m3-h-food-culture
  term: die Semmel
  pos: noun
  plural: die Semmeln
  meanings: [bread roll (southern German and Austrian word), roll, bread roll]
  example: Ich hätte gern vier Semmeln.
  exampleEn: I'd like four rolls.
  note: 'Used in Bavaria, Austria and parts of eastern Germany; das Brötchen elsewhere.'
- id: de1-m3-r2-w02
  lesson: de1-m3-h-food-culture
  term: die Brezel
  pos: noun
  plural: die Brezeln
  alt: [die Breze]
  meanings: [pretzel]
  example: Eine Brezel mit Butter, bitte.
  exampleEn: A pretzel with butter, please.
  note: 'In Bavaria also die Breze or die Brezn.'
- id: de1-m3-r2-w03
  lesson: de1-m3-h-food-culture
  term: die Sahne
  pos: noun
  plural: —
  meanings: [cream, whipped cream]
  example: Ich esse den Kuchen mit Sahne.
  exampleEn: I'm having the cake with cream.
  note: 'Austria: das Schlagobers or das Obers.'
- id: de1-m3-r2-w04
  lesson: de1-m3-h-food-culture
  term: der Quark
  pos: noun
  plural: —
  meanings: [quark (a soft fresh cheese), quark, curd cheese, soft cheese]
  example: Zum Frühstück esse ich Quark mit Obst.
  exampleEn: For breakfast I eat quark with fruit.
  note: 'Austria and Bavaria: der Topfen.'
- id: de1-m3-r2-w05
  lesson: de1-m3-h-food-culture
  term: die Marmelade
  pos: noun
  plural: die Marmeladen
  meanings: [jam, marmalade, jelly]
  example: Das Brötchen mit Butter und Marmelade ist lecker.
  exampleEn: The roll with butter and jam is tasty.
- id: de1-m3-r2-w06
  lesson: de1-m3-h-food-culture
  term: der Honig
  pos: noun
  plural: —
  meanings: [honey]
  example: Trinkst du den Tee mit Honig?
  exampleEn: Do you drink your tea with honey?
- id: de1-m3-r2-w07
  lesson: de1-m3-h-food-culture
  term: das Abendbrot
  pos: noun
  plural: —
  meanings: [supper (a cold evening meal with bread), supper, evening meal, dinner]
  example: Um sieben gibt es Abendbrot.
  exampleEn: At seven there's supper.
  note: 'Mostly northern and eastern Germany; everywhere also das Abendessen.'
- id: de1-m3-r2-w08
  lesson: de1-m3-h-food-culture
  term: die Mahlzeit
  pos: noun
  plural: die Mahlzeiten
  meanings: [meal (a time when you eat), meal, mealtime]
  example: Das Frühstück ist meine Lieblingsmahlzeit.
  exampleEn: Breakfast is my favourite meal.
  note: 'Mahlzeit! is also a lunchtime greeting between colleagues.'
- id: de1-m3-r2-w09
  lesson: de1-m3-h-food-culture
  term: satt
  pos: adjective
  meanings: [full (after eating), full, satisfied]
  example: Nein danke, ich bin satt.
  exampleEn: No thanks, I'm full.
- id: de1-m3-r2-w10
  lesson: de1-m3-h-food-culture
  kind: phrase
  term: Guten Appetit!
  pos: phrase
  meanings: [Enjoy your meal!, enjoy your meal, bon appetit, enjoy your food]
  example: Das Essen ist fertig. Guten Appetit!
  exampleEn: The food is ready. Enjoy your meal!
  note: 'The answer is Danke, gleichfalls! (Thanks, you too!)'
- id: de1-m3-r2-w11
  lesson: de1-m3-h-food-culture
  kind: phrase
  term: Stimmt so.
  pos: phrase
  alt: [Stimmt so]
  meanings: [Keep the change., keep the change]
  example: Hier sind zehn Euro. Stimmt so.
  exampleEn: Here's ten euros. Keep the change.
- id: de1-m3-r2-w12
  lesson: de1-m3-h-food-culture
  kind: phrase
  term: Ich hätte gern
  pos: phrase
  alt: [Ich hätte gerne]
  meanings: [I'd like (polite, when ordering), I would like, I'd like]
  example: Ich hätte gern einen Kaffee, bitte.
  exampleEn: I'd like a coffee, please.
  note: 'Followed by the accusative: einen Kaffee, eine Brezel, ein Brötchen.'
- id: de1-m3-r2-w13
  lesson: de1-m3-h-food-culture
  term: die Scheibe
  pos: noun
  plural: die Scheiben
  meanings: [slice]
  example: Ich esse zwei Scheiben Brot.
  exampleEn: I'm eating two slices of bread.
- id: de1-m3-r2-w14
  lesson: de1-m3-h-food-culture
  term: das Bargeld
  pos: noun
  plural: —
  meanings: [cash]
  example: Hier zahlt man nur mit Bargeld.
  exampleEn: You can only pay cash here.
- id: de1-m3-r2-w15
  lesson: de1-m3-h-food-culture
  term: der Bäcker
  pos: noun
  plural: die Bäcker
  meanings: [baker (male), baker]
  example: Der Bäcker steht jeden Tag um vier auf.
  exampleEn: The baker gets up at four every day.
  note: 'Female: die Bäckerin. Zum Bäcker gehen = to go to the bakery.'

# --- 12h2 Planning the week ---
- id: de1-m3-r2-w16
  lesson: de1-m3-h-week-planning
  term: montags
  pos: adverb
  meanings: [on Mondays, every Monday, Mondays]
  example: Montags arbeite ich bis sieben.
  exampleEn: On Mondays I work until seven.
  note: 'Small letter. Also dienstags, mittwochs, donnerstags, freitags, samstags.'
- id: de1-m3-r2-w17
  lesson: de1-m3-h-week-planning
  term: sonntags
  pos: adverb
  meanings: [on Sundays, every Sunday, Sundays]
  example: Sonntags sind die Geschäfte geschlossen.
  exampleEn: On Sundays the shops are closed.
- id: de1-m3-r2-w18
  lesson: de1-m3-h-week-planning
  term: morgens
  pos: adverb
  meanings: [in the mornings (every morning), in the morning, mornings, every morning]
  example: Morgens trinke ich Kaffee.
  exampleEn: In the mornings I drink coffee.
- id: de1-m3-r2-w19
  lesson: de1-m3-h-week-planning
  term: abends
  pos: adverb
  meanings: [in the evenings (every evening), in the evening, evenings, every evening]
  example: Abends sehe ich oft fern.
  exampleEn: In the evenings I often watch TV.
- id: de1-m3-r2-w20
  lesson: de1-m3-h-week-planning
  term: nachts
  pos: adverb
  meanings: [at night (every night), at night, nights]
  example: Nachts ist es hier sehr ruhig.
  exampleEn: At night it's very quiet here.
- id: de1-m3-r2-w21
  lesson: de1-m3-h-week-planning
  kind: phrase
  term: nächste Woche
  pos: phrase
  meanings: [next week]
  example: Nächste Woche habe ich viele Termine.
  exampleEn: Next week I have lots of appointments.
  note: 'Accusative of time: nächsten Montag, nächste Woche, nächstes Jahr.'
- id: de1-m3-r2-w22
  lesson: de1-m3-h-week-planning
  kind: phrase
  term: jeden Tag
  pos: phrase
  meanings: [every day, each day, daily]
  example: Ich lerne jeden Tag Deutsch.
  exampleEn: I study German every day.
- id: de1-m3-r2-w23
  lesson: de1-m3-h-week-planning
  kind: phrase
  term: den ganzen Tag
  pos: phrase
  meanings: [all day, the whole day, all day long]
  example: Am Sonntag schlafe ich den ganzen Tag.
  exampleEn: On Sunday I sleep all day.
- id: de1-m3-r2-w24
  lesson: de1-m3-h-week-planning
  term: gegen
  pos: preposition
  meanings: [around (with a time; gegen acht), around, about, at about]
  example: Ich komme gegen sieben.
  exampleEn: I'll come at around seven.
  note: 'Replaces um. With the accusative; gegen also means against.'
- id: de1-m3-r2-w25
  lesson: de1-m3-h-week-planning
  term: dauern
  pos: verb
  meanings: [to last (take time), to last, to take]
  example: Der Film dauert zwei Stunden.
  exampleEn: The film lasts two hours.
  note: 'Wie lange dauert das? Perfect: hat gedauert.'
- id: de1-m3-r2-w26
  lesson: de1-m3-h-week-planning
  term: meistens
  pos: adverb
  meanings: [mostly (most of the time), mostly, usually, most of the time]
  example: Ich frühstücke meistens um sieben.
  exampleEn: I usually have breakfast at seven.
- id: de1-m3-r2-w27
  lesson: de1-m3-h-week-planning
  term: selten
  pos: adverb
  meanings: [rarely, seldom]
  example: Wir essen selten im Restaurant.
  exampleEn: We rarely eat in a restaurant.
- id: de1-m3-r2-w28
  lesson: de1-m3-h-week-planning
  term: einmal
  pos: adverb
  meanings: [once (one time), once, one time]
  example: Ich gehe einmal pro Woche schwimmen.
  exampleEn: I go swimming once a week.
  note: 'zweimal = twice, dreimal = three times.'
- id: de1-m3-r2-w29
  lesson: de1-m3-h-week-planning
  term: pro
  pos: preposition
  meanings: [per, a (per)]
  example: Der Kurs ist zweimal pro Woche.
  exampleEn: The course is twice a week.
- id: de1-m3-r2-w30
  lesson: de1-m3-h-week-planning
  term: geöffnet
  pos: adjective
  alt: [geoeffnet]
  meanings: [open (of a shop or office), open, opened]
  example: Die Bäckerei ist sonntags geöffnet.
  exampleEn: The bakery is open on Sundays.
- id: de1-m3-r2-w31
  lesson: de1-m3-h-week-planning
  term: geschlossen
  pos: adjective
  meanings: [closed, shut]
  example: Heute ist das Café geschlossen.
  exampleEn: The café is closed today.
- id: de1-m3-r2-w32
  lesson: de1-m3-h-week-planning
  term: die Öffnungszeiten
  pos: noun
  plural: die Öffnungszeiten (usually plural)
  alt: [die Oeffnungszeiten]
  meanings: [opening hours, business hours, hours]
  example: Wie sind die Öffnungszeiten?
  exampleEn: What are the opening hours?
- id: de1-m3-r2-w33
  lesson: de1-m3-h-week-planning
  term: der Ruhetag
  pos: noun
  plural: die Ruhetage
  meanings: [closing day (a restaurant's weekly day off), closing day, day off, rest day]
  example: Montag ist Ruhetag.
  exampleEn: Monday is the closing day.
