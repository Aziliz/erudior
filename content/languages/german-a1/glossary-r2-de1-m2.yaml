# German A1 glossary, module 2 honors lessons (round 2)
- term: generic masculine
  aliases: [generisches Maskulinum, masculine generic]
  definition: 'Using the masculine form of a word for people of any gender, or for a mixed group: die Lehrer for male and female teachers together. It is the traditional usage and still very common; critics say it makes readers think of men first.'
  topic: People and gender
- term: paired form
  aliases: [paired forms, Paarform, Beidnennung]
  definition: 'Naming both the female and the male form of a word for people: Lehrerinnen und Lehrer, Liebe Kolleginnen und Kollegen, Sehr geehrte Damen und Herren. It is accepted in every kind of text.'
  topic: People and gender
- term: gender-fair language
  aliases: [gender-neutral language, gender-inclusive language, geschlechtergerechte Sprache, gendern]
  definition: 'Ways of writing and speaking about people that include more than the masculine form: paired forms (Lehrerinnen und Lehrer), neutral words (die Lehrkräfte, die Studierenden) and signs such as the gender star (Lehrer*innen). How far to use it is debated in German-speaking countries.'
  topic: People and gender
- term: gender star
  aliases: [Gendersternchen, Genderstern, gender asterisk]
  definition: 'The asterisk in forms like Lehrer*innen, meant to include women, men and people who are neither. Similar signs are the colon (Lehrer:innen) and the underscore (Lehrer_innen); the older capital I (LehrerInnen) was made to name women and men. Read aloud with a short break before -innen. The Council for German Orthography decided in 2023 not to make these signs part of official spelling.'
  topic: People and gender
- term: genitive
  aliases: [genitive case, Genitiv]
  definition: 'The fourth German case. At A1 you need only one use of it: -s after a name to say whose something is, with no apostrophe and no article: Annas Bruder (Anna''s brother). Names ending in s, ss, ß, x or z take only an apostrophe: Max'' Schwester. In speech von + name is common: der Bruder von Anna.'
  topic: Names and whose
- term: linking s
  aliases: [Fugen-s, linking element, Fugenelement]
  definition: 'An s that joins the two parts of some compound nouns without adding meaning: der Zwilling + die Schwester = die Zwillingsschwester; die Geburt + der Tag = der Geburtstag.'
  topic: Nouns
