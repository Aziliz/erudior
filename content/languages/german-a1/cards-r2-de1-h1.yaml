# Round 2 cards for de1-h1 (honors module: Kultur und Alltag, lessons 90-93)
# --- 90: Ankommen
- {front: 'die Anmeldung: when and where?', back: 'Register your address (sich anmelden) at the Bürgeramt within two weeks of moving in (Germany). Austria: within three days (Meldezettel).', topic: Registering and official letters}
- {front: 'What do you bring to the Anmeldung?', back: 'Passport or ID card, the Wohnungsgeberbestätigung from your landlord, and the Anmeldeformular, filled in and signed.', topic: Registering and official letters}
- {front: 'die Meldebescheinigung', back: 'The certificate of registration you get at the Bürgeramt. Banks and employers may ask for it.', topic: Registering and official letters}
- {front: 'die Steuer-ID', back: 'Your 11-digit tax ID, sent by post a few weeks after your first registration. Your employer needs it: keep the letter.', topic: Registering and official letters}
- {front: 'der Rundfunkbeitrag', back: 'The broadcasting fee: one fee per household, TV or no TV. Flatmates share it.', topic: Registering and official letters}
- {front: 'Scanning a formal letter: four questions', back: 'Who? (Absender) What? (Betreff) When and where? (numbers) What must I do? (Bitte … and imperatives)', topic: Registering and official letters}
- {front: 'Herr or Herrn?', back: 'Address on the envelope: Herrn Lukas Brandt. Greeting: Sehr geehrter Herr Brandt,', topic: Registering and official letters}
- {front: 'z. B. / d. h. / usw.', back: 'zum Beispiel (for example) / das heißt (that is) / und so weiter (and so on). Read abbreviations aloud as full words.', topic: Abbreviations in official German}
- {front: 'ca. / ggf. / u. a. / bzw.', back: 'circa (about) / gegebenenfalls (if necessary) / unter anderem (among other things) / beziehungsweise (or; respectively)', topic: Abbreviations in official German}
- {front: 'evtl. = eventuell', back: 'possibly, perhaps (NOT "eventually"): Ich komme eventuell später. — I may come later.', topic: Abbreviations in official German}
- {front: 'Ihr / Ihre with a capital I', back: 'your (formal, from Sie): Ihre Anmeldung = your registration. Small ihr = her, their, or you (plural).', topic: Abbreviations in official German}
# --- 91: Zusammen wohnen
- {front: 'die Hausordnung', back: 'The house rules in the stairwell: quiet hours (Ruhezeiten), no bikes in the stairwell, sort the rubbish, lock the front door at night.', topic: House rules and quiet hours}
- {front: 'Typical Ruhezeiten', back: 'Night: about 22 to 6 or 7 Uhr; often a midday rest (13 to 15 Uhr); Sundays and public holidays all day. Rules vary by building and town.', topic: House rules and quiet hours}
- {front: 'Wir bitten um Verständnis.', back: 'We ask for your understanding / thank you for your understanding (set phrase on notices).', topic: House rules and quiet hours}
- {front: 'Infinitive command: how?', back: 'Everything else first, infinitive last, no du/Sie: Bitte Tür schließen! Nicht rauchen! Separable verbs stay joined: Bitte einsteigen!', topic: 'Infinitive commands and Wohin?'}
- {front: 'Infinitive command or imperative?', back: 'Infinitive commands are for signs, announcements and recipes. To a person, use the imperative: Schließ bitte die Tür! / Schließen Sie bitte die Tür!', topic: 'Infinitive commands and Wohin?'}
- {front: 'Wo? or Wohin? with in, an, auf …', back: 'Wo? (location) + dative: in der Tonne, im Keller. Wohin? (movement) + accusative: in die Tonne, in den Keller, ins Treppenhaus.', topic: 'Infinitive commands and Wohin?'}
- {front: 'The four bins', back: 'gelb: packaging (plastic, metal); blau: paper; Biotonne (often brown): food and garden waste; Restmüll (grey/black): everything else. Colours vary by town.', topic: Recycling and Pfand}
- {front: 'Where does glass go?', back: 'In the Glascontainer on the street, by colour: Weißglas, Grünglas, Braunglas (blue goes with green). Only on working days (Mon–Sat), during the day; never on Sundays or holidays.', topic: Recycling and Pfand}
- {front: 'das Pfand', back: 'A deposit: 25 cents on single-use bottles and cans with the logo, usually 8 or 15 cents on reusable (Mehrweg) bottles. Return them to the Pfandautomat for a Pfandbon.', topic: Recycling and Pfand}
- {front: 'werfen: present tense', back: 'ich werfe, du wirfst, er wirft, wir werfen, ihr werft, sie werfen (e → i)', topic: Recycling and Pfand}
# --- 92: Märchen
- {front: 'Simple past or perfect?', back: 'Written stories, novels and fairy tales: simple past (er ging). Speaking: perfect (er ist gegangen), except war, hatte and the modals.', topic: Reading the simple past}
- {front: 'Weak verbs in the simple past', back: 'stem + -te: sagte, machte, fragte; -t/-d stems add -e-: arbeitete. Plural: sie sagten.', topic: Reading the simple past}
- {front: 'Strong verbs in the simple past', back: 'New vowel, no ending for ich and er/sie/es: ging, kam, sah, lief, fand, saß. Plural: sie gingen.', topic: Reading the simple past}
- {front: 'Principal parts', back: 'Infinitive, simple past, past participle: gehen, ging, gegangen; kommen, kam, gekommen; sehen, sah, gesehen. Learn them together.', topic: Reading the simple past}
- {front: 'Finding the infinitive of a simple past form', back: '-te / -ten? Weak: fragte → fragen. Short, new vowel? Strong: compare the participle or English (fand / found → finden).', topic: Reading the simple past}
- {front: 'laufen, springen, fallen, fliegen', back: 'lief, sprang, fiel, flog; perfect with sein: ist gelaufen, ist gesprungen, ist gefallen, ist geflogen', topic: Reading the simple past}
- {front: 'The Brothers Grimm', back: 'Jacob (1785–1863) and Wilhelm (1786–1859), born in Hanau. Kinder- und Hausmärchen from 1812.', topic: Fairy tales}
- {front: 'Die Bremer Stadtmusikanten', back: 'A donkey, a dog, a cat and a rooster scare robbers out of a house in the forest and stay there. They never reach Bremen. (In the Grimms'' collection from 1819.)', topic: Fairy tales}
- {front: 'How fairy tales begin and end', back: 'Es war einmal … (once upon a time) … und wenn sie nicht gestorben sind, dann leben sie noch heute.', topic: Fairy tales}
- {front: 'der Hahn / das Huhn', back: 'rooster / hen (chicken)', topic: Fairy tales}
# --- 93: Gemütlich
- {front: 'Schönen Feierabend! / Schönes Wochenende!', back: 'Have a nice evening (after work)! / Have a nice weekend! Answer: Danke, gleichfalls!', topic: Feierabend and the Kleingarten}
- {front: 'die Gemütlichkeit', back: 'Cosiness, comfort, warmth, good company and no hurry. Wir machen es uns gemütlich. — We''re making ourselves comfortable.', topic: Feierabend and the Kleingarten}
- {front: 'der Stammtisch', back: 'A regulars'' table in a Kneipe (pub) for a group that meets there regularly; also any regular get-together (Sprachstammtisch).', topic: Feierabend and the Kleingarten}
- {front: 'der Kleingarten (Schrebergarten)', back: 'A small garden rented through a club (Kleingartenverein), about 900,000 in Germany. Named after the Leipzig doctor Moritz Schreber; first club 1864.', topic: Feierabend and the Kleingarten}
- {front: 'Kleingarten rules (simplified)', back: 'At most 400 m²; a simple Laube of at most 24 m², not for living in; part of the garden for fruit and vegetables (about a third).', topic: Feierabend and the Kleingarten}
- {front: 'How to make a diminutive', back: '1. Drop a final -e. 2. Usually umlaut a, o, u, au. 3. Add -chen (or -lein): die Blume → das Blümchen, das Haus → das Häuschen.', topic: Diminutives}
- {front: 'Gender and plural of diminutives', back: 'Always das: der Hund → das Hündchen. Plural looks the same: das Brötchen, die Brötchen.', topic: Diminutives}
- {front: '-chen or -lein?', back: 'Same meaning. -lein is older, more poetic and southern, and usual after -ch: das Büchlein.', topic: Diminutives}
- {front: 'What diminutives add', back: 'Often a friendly feeling, not just smallness: ein Tässchen Kaffee, ein Gläschen Wein, mein Schätzchen.', topic: Diminutives}
- {front: 'Diminutives that are words of their own', back: 'das Mädchen (girl), das Märchen (fairy tale), das Brötchen (roll), das Kaninchen (rabbit), das Eichhörnchen (squirrel), ein bisschen (a little)', topic: Diminutives}
- {front: 'Regional diminutive endings', back: 'Swabian -le (das Häusle), Swiss -li (das Müesli), Bavarian and Austrian -erl / -l (das Sackerl). All neuter.', topic: Diminutives}
- {front: 'Saying Häuschen', back: 'Häus-chen: s, then the soft ch of ich. Not "sch". Also Gläs-chen, Täss-chen.', topic: Diminutives}
