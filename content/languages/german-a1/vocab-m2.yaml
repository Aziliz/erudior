# German A1, module 2: People and things (lessons 05–08)

# --- 05 Nouns, gender and articles (de1-nouns-gender) ---
- id: der
  lesson: de1-nouns-gender
  term: der
  pos: article
  meanings: [the (masculine), the]
  example: Der Tisch ist hier.
  exampleEn: The table is here.
  note: Definite article for masculine nouns (nominative).
- id: die-article
  lesson: de1-nouns-gender
  term: die
  pos: article
  meanings: [the (feminine or plural), the]
  example: Die Lampe ist neu.
  exampleEn: The lamp is new.
  note: Definite article for feminine nouns and for all plurals (nominative).
- id: das-article
  lesson: de1-nouns-gender
  term: das
  pos: article
  meanings: [the (neuter), the]
  example: Das Buch ist von Anna.
  exampleEn: The book is Anna's.
  note: Definite article for neuter nouns (nominative). Das ist … ("that is") is a separate item.
- id: ein
  lesson: de1-nouns-gender
  term: ein
  pos: article
  meanings: [a (masculine or neuter), a, an, one]
  example: Das ist ein Stift.
  exampleEn: That's a pen.
  note: Indefinite article for masculine and neuter nouns (nominative).
- id: eine
  lesson: de1-nouns-gender
  term: eine
  pos: article
  meanings: [a (feminine), a, an, one]
  example: Das ist eine Tasche.
  exampleEn: That's a bag.
  note: Indefinite article for feminine nouns.
- id: was-ist-das
  lesson: de1-nouns-gender
  kind: phrase
  term: Was ist das?
  meanings: ['What is that?', what is this, 'what''s that', 'what''s this']
  example: Was ist das? Ist das ein Handy?
  exampleEn: What's that? Is it a mobile phone?
- id: das-ist
  lesson: de1-nouns-gender
  kind: phrase
  term: Das ist
  meanings: [That is (pointing at one thing or person), that is, this is, 'that''s', it is]
  example: Das ist mein Schlüssel.
  exampleEn: That's my key.
- id: das-sind
  lesson: de1-nouns-gender
  kind: phrase
  term: Das sind
  meanings: [Those are (pointing at several things or people), those are, these are, they are]
  example: Das sind Fotos von Berlin.
  exampleEn: These are photos of Berlin.
- id: tisch
  lesson: de1-nouns-gender
  term: der Tisch
  pos: noun
  plural: die Tische
  meanings: [table, desk]
  example: Der Tisch ist groß.
  exampleEn: The table is big.
- id: stuhl
  lesson: de1-nouns-gender
  term: der Stuhl
  pos: noun
  plural: die Stühle
  meanings: [chair]
  example: Der Stuhl ist alt.
  exampleEn: The chair is old.
- id: buch
  lesson: de1-nouns-gender
  term: das Buch
  pos: noun
  plural: die Bücher
  meanings: [book]
  example: Das Buch ist sehr gut.
  exampleEn: The book is very good.
- id: heft
  lesson: de1-nouns-gender
  term: das Heft
  pos: noun
  plural: die Hefte
  meanings: [exercise book, notebook, workbook, booklet]
  example: Mein Heft ist in der Tasche.
  exampleEn: My exercise book is in the bag.
- id: stift
  lesson: de1-nouns-gender
  term: der Stift
  pos: noun
  plural: die Stifte
  meanings: [pen (any pen or pencil), pen, pencil, marker, crayon]
  example: Der Stift ist hier.
  exampleEn: The pen is here.
  note: General word for anything you write with; a pencil is also der Bleistift.
- id: kuli
  lesson: de1-nouns-gender
  term: der Kuli
  pos: noun
  plural: die Kulis
  meanings: [ballpoint pen, ballpoint, biro, pen, ballpen]
  example: Der Kuli ist blau.
  exampleEn: The ballpoint pen is blue.
  note: Short for der Kugelschreiber.
- id: papier
  lesson: de1-nouns-gender
  term: das Papier
  pos: noun
  plural: die Papiere
  meanings: [paper]
  example: Hier ist Papier.
  exampleEn: Here's some paper.
  note: The plural die Papiere means "papers, documents".
- id: tasche
  lesson: de1-nouns-gender
  term: die Tasche
  pos: noun
  plural: die Taschen
  meanings: [bag, handbag, pocket]
  example: Die Tasche ist schwarz.
  exampleEn: The bag is black.
- id: schluessel
  lesson: de1-nouns-gender
  term: der Schlüssel
  pos: noun
  plural: die Schlüssel
  meanings: [key]
  alt: [der Schluessel]
  example: Wo ist der Schlüssel?
  exampleEn: Where is the key?
- id: handy
  lesson: de1-nouns-gender
  term: das Handy
  pos: noun
  plural: die Handys
  meanings: [mobile phone, cell phone, cellphone, mobile, phone, smartphone]
  example: Mein Handy ist neu.
  exampleEn: My mobile phone is new.
- id: computer
  lesson: de1-nouns-gender
  term: der Computer
  pos: noun
  plural: die Computer
  meanings: [computer, PC]
  example: Ist das dein Computer?
  exampleEn: Is that your computer?
- id: uhr
  lesson: de1-nouns-gender
  term: die Uhr
  pos: noun
  plural: die Uhren
  meanings: [clock (or watch), clock, watch, wristwatch]
  example: Ist das eine Uhr?
  exampleEn: Is that a clock?
  note: Also used for telling the time (lesson 11).
- id: lampe
  lesson: de1-nouns-gender
  term: die Lampe
  pos: noun
  plural: die Lampen
  meanings: [lamp, light]
  example: Das ist eine Lampe.
  exampleEn: That's a lamp.
- id: fenster
  lesson: de1-nouns-gender
  term: das Fenster
  pos: noun
  plural: die Fenster
  meanings: [window]
  example: Das Fenster ist groß.
  exampleEn: The window is big.
- id: tuer
  lesson: de1-nouns-gender
  term: die Tür
  pos: noun
  plural: die Türen
  meanings: [door]
  alt: [die Tuer]
  example: Die Tür ist dort.
  exampleEn: The door is over there.
- id: foto
  lesson: de1-nouns-gender
  term: das Foto
  pos: noun
  plural: die Fotos
  meanings: [photo, photograph, picture]
  example: Das Foto ist schön.
  exampleEn: The photo is beautiful.
- id: brille
  lesson: de1-nouns-gender
  term: die Brille
  pos: noun
  plural: die Brillen
  meanings: [glasses (a pair), glasses, spectacles, eyeglasses]
  example: Wo ist meine Brille?
  exampleEn: Where are my glasses?
  note: 'Singular in German: die Brille is one pair of glasses.'
- id: zeitung
  lesson: de1-nouns-gender
  term: die Zeitung
  pos: noun
  plural: die Zeitungen
  meanings: [newspaper, paper]
  example: Die Zeitung ist von heute.
  exampleEn: The newspaper is from today.
- id: ding
  lesson: de1-nouns-gender
  term: das Ding
  pos: noun
  plural: die Dinge
  meanings: [thing (object), thing, object, item]
  example: Was ist das Ding hier?
  exampleEn: What's this thing here?

# --- 06 Family and possessives (de1-family) ---
- id: familie
  lesson: de1-family
  term: die Familie
  pos: noun
  plural: die Familien
  meanings: [family]
  example: Meine Familie wohnt in Köln.
  exampleEn: My family lives in Cologne.
- id: eltern
  lesson: de1-family
  term: die Eltern
  pos: noun
  plural: die Eltern (plural only)
  meanings: [parents]
  example: Meine Eltern wohnen in Hamburg.
  exampleEn: My parents live in Hamburg.
- id: mutter
  lesson: de1-family
  term: die Mutter
  pos: noun
  plural: die Mütter
  meanings: [mother, mom, mum]
  example: Meine Mutter heißt Karin.
  exampleEn: My mother is called Karin.
- id: vater
  lesson: de1-family
  term: der Vater
  pos: noun
  plural: die Väter
  meanings: [father, dad]
  example: Sein Vater ist Arzt.
  exampleEn: His father is a doctor.
- id: kind
  lesson: de1-family
  term: das Kind
  pos: noun
  plural: die Kinder
  meanings: [child, kid]
  example: Wir haben zwei Kinder.
  exampleEn: We have two children.
- id: sohn
  lesson: de1-family
  term: der Sohn
  pos: noun
  plural: die Söhne
  meanings: [son]
  example: Ihr Sohn ist zehn Jahre alt.
  exampleEn: Her son is ten years old.
- id: tochter
  lesson: de1-family
  term: die Tochter
  pos: noun
  plural: die Töchter
  meanings: [daughter]
  example: Unsere Tochter wohnt in Wien.
  exampleEn: Our daughter lives in Vienna.
- id: bruder
  lesson: de1-family
  term: der Bruder
  pos: noun
  plural: die Brüder
  meanings: [brother]
  example: Mein Bruder lernt Deutsch.
  exampleEn: My brother is learning German.
- id: schwester
  lesson: de1-family
  term: die Schwester
  pos: noun
  plural: die Schwestern
  meanings: [sister]
  example: Hast du eine Schwester?
  exampleEn: Do you have a sister?
- id: geschwister
  lesson: de1-family
  term: die Geschwister
  pos: noun
  plural: die Geschwister (plural only)
  meanings: [siblings, brothers and sisters]
  example: Hast du Geschwister?
  exampleEn: Do you have any siblings?
- id: grossvater
  lesson: de1-family
  term: der Großvater
  pos: noun
  plural: die Großväter
  meanings: [grandfather, grandpa, granddad]
  alt: [der Grossvater]
  example: Mein Großvater ist 80.
  exampleEn: My grandfather is 80.
- id: opa
  lesson: de1-family
  term: der Opa
  pos: noun
  plural: die Opas
  meanings: [grandpa (informal), grandpa, granddad, grandad, grandfather]
  example: Opa, wo ist deine Brille?
  exampleEn: Grandpa, where are your glasses?
- id: grossmutter
  lesson: de1-family
  term: die Großmutter
  pos: noun
  plural: die Großmütter
  meanings: [grandmother, grandma, granny]
  alt: [die Grossmutter]
  example: Meine Großmutter wohnt in Italien.
  exampleEn: My grandmother lives in Italy.
- id: oma
  lesson: de1-family
  term: die Oma
  pos: noun
  plural: die Omas
  meanings: [grandma (informal), grandma, granny, nan, grandmother]
  example: Unsere Oma hat eine Katze.
  exampleEn: Our grandma has a cat.
- id: mann
  lesson: de1-family
  term: der Mann
  pos: noun
  plural: die Männer
  meanings: ['man (also: husband)', man, husband]
  example: Das ist mein Mann Peter.
  exampleEn: This is my husband Peter.
- id: frau-woman
  lesson: de1-family
  term: die Frau
  pos: noun
  plural: die Frauen
  meanings: ['woman (also: wife)', woman, wife]
  example: Die Frau dort ist meine Lehrerin.
  exampleEn: The woman over there is my teacher.
  note: Without an article, Frau + surname means Mrs/Ms.
- id: freund
  lesson: de1-family
  term: der Freund
  pos: noun
  plural: die Freunde
  meanings: ['friend (male; also: boyfriend)', friend, boyfriend]
  example: Mein Freund heißt Ali.
  exampleEn: My boyfriend is called Ali.
- id: freundin
  lesson: de1-family
  term: die Freundin
  pos: noun
  plural: die Freundinnen
  meanings: ['friend (female; also: girlfriend)', friend, girlfriend]
  example: Das ist Lea, eine Freundin aus Berlin.
  exampleEn: This is Lea, a friend from Berlin.
- id: baby
  lesson: de1-family
  term: das Baby
  pos: noun
  plural: die Babys
  meanings: [baby]
  example: Das Baby heißt Emma.
  exampleEn: The baby is called Emma.
- id: verheiratet
  lesson: de1-family
  term: verheiratet
  pos: adjective
  meanings: [married]
  example: Bist du verheiratet?
  exampleEn: Are you married?
- id: ledig
  lesson: de1-family
  term: ledig
  pos: adjective
  meanings: [single (not married), single, unmarried]
  example: Mein Bruder ist noch ledig.
  exampleEn: My brother is still single.
- id: geschieden
  lesson: de1-family
  term: geschieden
  pos: adjective
  meanings: [divorced]
  example: Meine Eltern sind geschieden.
  exampleEn: My parents are divorced.
- id: mein
  lesson: de1-family
  term: mein
  pos: article
  meanings: [my]
  example: Mein Name ist Tom.
  exampleEn: My name is Tom.
  note: meine before feminine and plural nouns.
- id: dein
  lesson: de1-family
  term: dein
  pos: article
  meanings: ['your (informal, one person)', your]
  example: Ist das dein Handy?
  exampleEn: Is that your phone?
  note: deine before feminine and plural nouns.
- id: sein-his
  lesson: de1-family
  term: sein
  pos: article
  meanings: [his (or its), his, its]
  example: Paul und sein Hund sind im Park.
  exampleEn: Paul and his dog are in the park.
  note: Possessive for er and es; seine before feminine and plural nouns. Not the verb sein (to be).
- id: ihr-her
  lesson: de1-family
  term: ihr
  pos: article
  meanings: [her (or their), her, their]
  example: Anna und ihr Vater wohnen in Bonn.
  exampleEn: Anna and her father live in Bonn.
  note: Possessive for sie (she) and sie (they); ihre before feminine and plural nouns. Formal "your" is Ihr with a capital I.
- id: unser
  lesson: de1-family
  term: unser
  pos: article
  meanings: [our]
  example: Unser Lehrer kommt aus Wien.
  exampleEn: Our teacher is from Vienna.
  note: unsere before feminine and plural nouns.
- id: euer
  lesson: de1-family
  term: euer
  pos: article
  meanings: ['your (informal, several people)', your]
  example: Ist das euer Hund?
  exampleEn: Is that your dog? (talking to two friends)
  note: 'Drops an e when it takes an ending: eure Tochter, eure Kinder.'
- id: hund
  lesson: de1-family
  term: der Hund
  pos: noun
  plural: die Hunde
  meanings: [dog]
  example: Der Hund ist schwarz und weiß.
  exampleEn: The dog is black and white.
- id: katze
  lesson: de1-family
  term: die Katze
  pos: noun
  plural: die Katzen
  meanings: [cat]
  example: Die Katze heißt Mimi.
  exampleEn: The cat is called Mimi.
- id: tier
  lesson: de1-family
  term: das Tier
  pos: noun
  plural: die Tiere
  meanings: [animal, pet]
  example: Habt ihr ein Tier?
  exampleEn: Do you have a pet?
- id: person
  lesson: de1-family
  term: die Person
  pos: noun
  plural: die Personen
  meanings: [person]
  example: Wir sind vier Personen.
  exampleEn: There are four of us.

# --- 07 Jobs, languages and countries (de1-jobs-languages) ---
- id: beruf
  lesson: de1-jobs-languages
  term: der Beruf
  pos: noun
  plural: die Berufe
  meanings: [profession (occupation), profession, occupation, job, career]
  example: Was sind Sie von Beruf?
  exampleEn: What do you do for a living?
- id: arbeit
  lesson: de1-jobs-languages
  term: die Arbeit
  pos: noun
  plural: die Arbeiten
  meanings: [work (noun), work, job, labour, labor]
  example: Die Arbeit ist interessant.
  exampleEn: The work is interesting.
  note: The plural die Arbeiten means "pieces of work, tasks".
- id: lehrer
  lesson: de1-jobs-languages
  term: der Lehrer
  pos: noun
  plural: die Lehrer
  meanings: [teacher (male), teacher]
  example: Der Lehrer kommt aus England.
  exampleEn: The teacher is from England.
- id: lehrerin
  lesson: de1-jobs-languages
  term: die Lehrerin
  pos: noun
  plural: die Lehrerinnen
  meanings: [teacher (female), teacher]
  example: Meine Mutter ist Lehrerin.
  exampleEn: My mother is a teacher.
- id: arzt
  lesson: de1-jobs-languages
  term: der Arzt
  pos: noun
  plural: die Ärzte
  meanings: [doctor (male), doctor, physician]
  example: Der Arzt spricht Englisch.
  exampleEn: The doctor speaks English.
- id: aerztin
  lesson: de1-jobs-languages
  term: die Ärztin
  pos: noun
  plural: die Ärztinnen
  meanings: [doctor (female), doctor, physician]
  alt: [die Aerztin]
  example: Sie ist Ärztin in Berlin.
  exampleEn: She's a doctor in Berlin.
- id: student
  lesson: de1-jobs-languages
  term: der Student
  pos: noun
  plural: die Studenten
  meanings: ['student (male, at university)', student, university student]
  example: Mein Bruder ist Student.
  exampleEn: My brother is a student.
- id: studentin
  lesson: de1-jobs-languages
  term: die Studentin
  pos: noun
  plural: die Studentinnen
  meanings: ['student (female, at university)', student, university student]
  example: Bist du Studentin?
  exampleEn: Are you a student?
- id: schueler
  lesson: de1-jobs-languages
  term: der Schüler
  pos: noun
  plural: die Schüler
  meanings: ['pupil (male, at school)', pupil, school student, student, schoolboy]
  alt: [der Schueler]
  example: Der Schüler ist 15 Jahre alt.
  exampleEn: The pupil is 15 years old.
  note: 'Female form: die Schülerin.'
- id: verkaeufer
  lesson: de1-jobs-languages
  term: der Verkäufer
  pos: noun
  plural: die Verkäufer
  meanings: [salesperson (male), salesperson, sales assistant, shop assistant, salesman, seller, sales clerk, clerk]
  alt: [der Verkaeufer]
  example: Mein Vater ist Verkäufer.
  exampleEn: My father is a salesman.
  note: 'Female form: die Verkäuferin.'
- id: kellner
  lesson: de1-jobs-languages
  term: der Kellner
  pos: noun
  plural: die Kellner
  meanings: [waiter, server]
  example: Der Kellner kommt aus Italien.
  exampleEn: The waiter is from Italy.
  note: 'Female form: die Kellnerin (waitress).'
- id: ingenieur
  lesson: de1-jobs-languages
  term: der Ingenieur
  pos: noun
  plural: die Ingenieure
  meanings: [engineer (male), engineer]
  example: Er ist Ingenieur in Stuttgart.
  exampleEn: He's an engineer in Stuttgart.
  note: 'Female form: die Ingenieurin. Pronounced in-zhe-NYÖR.'
- id: polizist
  lesson: de1-jobs-languages
  term: der Polizist
  pos: noun
  plural: die Polizisten
  meanings: [police officer (male), police officer, policeman, officer, cop]
  example: Der Polizist ist sehr groß.
  exampleEn: The police officer is very tall.
  note: 'Female form: die Polizistin.'
- id: koch
  lesson: de1-jobs-languages
  term: der Koch
  pos: noun
  plural: die Köche
  meanings: ['cook (male, as a job)', cook, chef]
  example: Mein Mann ist Koch.
  exampleEn: My husband is a cook.
  note: 'Female form: die Köchin.'
- id: firma
  lesson: de1-jobs-languages
  term: die Firma
  pos: noun
  plural: die Firmen
  meanings: [company (business), company, firm, business]
  example: Die Firma ist in München.
  exampleEn: The company is in Munich.
- id: buero
  lesson: de1-jobs-languages
  term: das Büro
  pos: noun
  plural: die Büros
  meanings: [office]
  alt: [das Buero]
  example: Das Büro ist ziemlich klein.
  exampleEn: The office is quite small.
- id: schule
  lesson: de1-jobs-languages
  term: die Schule
  pos: noun
  plural: die Schulen
  meanings: [school]
  example: Die Schule ist neu.
  exampleEn: The school is new.
- id: universitaet
  lesson: de1-jobs-languages
  term: die Universität
  pos: noun
  plural: die Universitäten
  meanings: [university, college]
  alt: [die Uni, die Universitaet]
  example: Die Universität ist sehr alt.
  exampleEn: The university is very old.
  note: 'Everyday short form: die Uni.'
- id: sprache
  lesson: de1-jobs-languages
  term: die Sprache
  pos: noun
  plural: die Sprachen
  meanings: [language]
  example: Deutsch ist eine schöne Sprache.
  exampleEn: German is a beautiful language.
- id: deutsch
  lesson: de1-jobs-languages
  term: Deutsch
  meanings: [German (the language), German]
  example: Ich lerne Deutsch.
  exampleEn: I'm learning German.
  note: Language name, capitalized and used without an article.
- id: englisch
  lesson: de1-jobs-languages
  term: Englisch
  meanings: [English (the language), English]
  example: Sprechen Sie Englisch?
  exampleEn: Do you speak English?
  note: Language name, capitalized and used without an article.
- id: sprechen
  lesson: de1-jobs-languages
  term: sprechen
  pos: verb
  meanings: [to speak, to talk]
  example: Wir sprechen Deutsch und Englisch.
  exampleEn: We speak German and English.
  note: 'Stem change e → i: du sprichst, er spricht. Perfect: hat gesprochen.'
- id: england
  lesson: de1-jobs-languages
  term: England
  meanings: [England]
  example: Sie kommt aus England.
  exampleEn: She's from England.
  note: Country name, used without an article.
- id: usa
  lesson: de1-jobs-languages
  term: die USA
  pos: noun
  plural: die USA (plural only)
  meanings: [the USA, USA, United States, the United States, America, US]
  example: Ich komme aus den USA.
  exampleEn: I'm from the USA.
  note: 'Plural, always with an article: aus den USA, in den USA.'
- id: spanien
  lesson: de1-jobs-languages
  term: Spanien
  meanings: [Spain]
  example: Spanien ist sehr schön.
  exampleEn: Spain is very beautiful.
  note: 'Country name, used without an article. Language: Spanisch.'
- id: frankreich
  lesson: de1-jobs-languages
  term: Frankreich
  meanings: [France]
  example: Meine Freundin wohnt in Frankreich.
  exampleEn: My girlfriend lives in France.
  note: 'Country name, used without an article. Language: Französisch.'
- id: italien
  lesson: de1-jobs-languages
  term: Italien
  meanings: [Italy]
  example: Wir kommen aus Italien.
  exampleEn: We're from Italy.
  note: 'Country name, used without an article. Language: Italienisch.'
- id: tuerkei
  lesson: de1-jobs-languages
  term: die Türkei
  pos: noun
  plural: —
  meanings: [Turkey (the country), Turkey]
  alt: [die Tuerkei]
  example: Mein Vater kommt aus der Türkei.
  exampleEn: My father is from Turkey.
  note: 'Always with an article: aus der Türkei, in der Türkei. Language: Türkisch.'
- id: polen
  lesson: de1-jobs-languages
  term: Polen
  meanings: [Poland]
  example: Polen ist nicht weit.
  exampleEn: Poland isn't far.
  note: 'Country name, used without an article. Language: Polnisch.'
- id: international
  lesson: de1-jobs-languages
  term: international
  pos: adjective
  meanings: [international]
  example: Die Schule ist international.
  exampleEn: The school is international.

# --- 08 Describing things (de1-describing) ---
- id: gross
  lesson: de1-describing
  term: groß
  pos: adjective
  meanings: ['big (also: tall)', big, large, tall, great]
  alt: [gross]
  example: Die Familie ist sehr groß.
  exampleEn: The family is very big.
- id: klein
  lesson: de1-describing
