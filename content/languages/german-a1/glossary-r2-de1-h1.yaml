# Round 2 glossary for de1-h1 (honors module: Kultur und Alltag)
- term: abbreviation
  aliases: [abbreviations, Abkürzung, Abkürzungen]
  definition: 'A short form of a word or phrase. Most are read aloud as the full words and written with a full stop: z. B. = zum Beispiel, usw. = und so weiter, ca. = circa. A few, like PLZ or ICE, are said letter by letter and have no full stop.'
  topic: Abbreviations in official German
- term: infinitive command
  aliases: [infinitive commands, infinitive imperative]
  definition: 'An order given with just the infinitive at the end, with no du or Sie: Bitte Tür schließen! Nicht rauchen! Used on notices, in announcements and in recipes, not face to face. A separable verb stays in one piece: Bitte einsteigen!'
  topic: Infinitive commands and Wohin?
- term: principal parts
  aliases: [principal part, Stammformen]
  definition: 'The three forms you learn for each strong or irregular verb: the infinitive, the simple past and the past participle, e.g. gehen, ging, gegangen; sehen, sah, gesehen. Together they let you build every tense.'
  topic: Reading the simple past
- term: diminutive
  aliases: [diminutives, Verkleinerungsform, Diminutiv]
  definition: 'A noun made "little" (and often friendlier) with the ending -chen or -lein, usually with an umlaut and without a final -e: das Haus → das Häuschen, die Katze → das Kätzchen. Diminutives are always neuter, and the plural looks the same: die Brötchen.'
  topic: Diminutives
