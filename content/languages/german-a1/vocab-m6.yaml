# Module 6: lessons 21–24
# --- Lesson 21: the perfect with haben -------------------------------------------
- id: besuchen
  lesson: de1-perfect-haben
  term: besuchen
  pos: verb
  meanings: ["to visit", "to go and see", "to attend"]
  example: Am Sonntag haben wir Oma besucht.
  exampleEn: On Sunday we visited Grandma.
  note: 'Inseparable prefix be-, so no ge-: hat besucht.'
- id: bekommen
  lesson: de1-perfect-haben
  term: bekommen
  pos: verb
  meanings: ["to get (to receive)", "to get", "to receive", "to obtain"]
  example: Ich habe deine Postkarte bekommen.
  exampleEn: I got your postcard.
  note: 'Not "to become" (that is werden). Perfect: hat bekommen.'
- id: vergessen
  lesson: de1-perfect-haben
  term: vergessen
  pos: verb
  meanings: ["to forget", "to leave behind"]
  example: Ich habe meinen Schlüssel vergessen.
  exampleEn: I forgot my key.
  note: 'du vergisst, er vergisst. Perfect: hat vergessen.'
- id: verlieren
  lesson: de1-perfect-haben
  term: verlieren
  pos: verb
  meanings: ["to lose"]
  example: Er hat sein Handy verloren.
  exampleEn: He has lost his phone.
  note: 'Perfect: hat verloren.'
- id: erzaehlen
  lesson: de1-perfect-haben
  term: erzählen
  pos: verb
  meanings: ["to tell (a story)", "to tell", "to narrate", "to recount"]
  example: Opa erzählt gern Geschichten.
  exampleEn: Grandpa likes telling stories.
  note: 'Inseparable prefix er-: hat erzählt.'
- id: kennen
  lesson: de1-perfect-haben
  term: kennen
  pos: verb
  meanings: ["to know (a person or place)", "to know", "to be familiar with", "to be acquainted with"]
  example: Kennst du meine Schwester?
  exampleEn: Do you know my sister?
  note: 'Mixed verb: hat gekannt. For facts use wissen.'
- id: wissen
  lesson: de1-perfect-haben
  term: wissen
  pos: verb
  meanings: ["to know (a fact)", "to know"]
  example: Weißt du die Adresse?
  exampleEn: Do you know the address?
  note: 'ich weiß, du weißt, er weiß, wir wissen, ihr wisst, sie wissen. Perfect: hat gewusst.'
- id: glauben
  lesson: de1-perfect-haben
  term: glauben
  pos: verb
  meanings: ["to believe", "to think (to suppose)", "to suppose", "to reckon"]
  example: Ich glaube, das ist richtig.
  exampleEn: I think that's right.
- id: denken
  lesson: de1-perfect-haben
  term: denken
  pos: verb
  meanings: ["to think", "to consider"]
  example: Ich habe oft an dich gedacht.
  exampleEn: I often thought of you.
  note: 'Mixed verb: hat gedacht. denken an + accusative = to think of.'
- id: lachen
  lesson: de1-perfect-haben
  term: lachen
  pos: verb
  meanings: ["to laugh"]
  example: Wir haben viel gelacht.
  exampleEn: We laughed a lot.
- id: weinen
  lesson: de1-perfect-haben
  term: weinen
  pos: verb
  meanings: ["to cry", "to weep"]
  example: Das Baby weint.
  exampleEn: The baby is crying.
- id: kennenlernen
  lesson: de1-perfect-haben
  term: kennenlernen
  pos: verb
  meanings: ["to get to know", "to meet (for the first time)", "to meet", "to become acquainted with"]
  example: Ich habe meinen Mann im Urlaub kennengelernt.
  exampleEn: I met my husband on holiday.
  note: 'Separable: ich lerne ihn kennen. Perfect: hat kennengelernt.'
- id: verkaufen
  lesson: de1-perfect-haben
  term: verkaufen
  pos: verb
  meanings: ["to sell"]
  example: Wir haben unser Auto verkauft.
  exampleEn: We sold our car.
  note: 'Inseparable prefix ver-: hat verkauft.'
- id: benutzen
  lesson: de1-perfect-haben
  term: benutzen
  pos: verb
  meanings: ["to use", "to make use of"]
  example: Darf ich dein Handy benutzen?
  exampleEn: May I use your phone?
  note: 'Inseparable prefix be-: hat benutzt.'
- id: schenken
  lesson: de1-perfect-haben
  term: schenken
  pos: verb
  meanings: ["to give (as a present)", "to give", "to give as a gift", "to present"]
  example: Ich schenke meiner Mutter Blumen.
  exampleEn: I'm giving my mother flowers.
- id: bringen
  lesson: de1-perfect-haben
  term: bringen
  pos: verb
  meanings: ["to bring", "to take (somewhere)"]
  example: Kannst du bitte Brot bringen?
  exampleEn: Can you bring some bread, please?
  note: 'Mixed verb: hat gebracht.'
- id: letzte-woche
  lesson: de1-perfect-haben
  kind: phrase
  term: letzte Woche
  pos: phrase
  meanings: ["last week"]
  example: Letzte Woche habe ich viel gearbeitet.
  exampleEn: Last week I worked a lot.
  note: 'letzte changes with gender: letzten Monat, letztes Wochenende.'
- id: vorgestern
  lesson: de1-perfect-haben
  term: vorgestern
  pos: adverb
  meanings: ["the day before yesterday"]
  example: Vorgestern war ich im Kino.
  exampleEn: The day before yesterday I was at the cinema.
- id: gerade
  lesson: de1-perfect-haben
  term: gerade
  pos: adverb
  meanings: ["just (a moment ago)", "just", "right now", "at the moment", "currently", "just now"]
  example: Ich habe gerade gegessen.
  exampleEn: I've just eaten.
- id: damals
  lesson: de1-perfect-haben
  term: damals
  pos: adverb
  meanings: ["back then (at that time)", "back then", "at that time", "then", "in those days"]
  example: Damals habe ich in Wien gewohnt.
  exampleEn: Back then I lived in Vienna.
- id: ausflug
  lesson: de1-perfect-haben
  term: der Ausflug
  pos: noun
  plural: die Ausflüge
  meanings: ["trip (a day out)", "trip", "outing", "excursion", "day trip"]
  example: Am Sonntag machen wir einen Ausflug.
  exampleEn: On Sunday we're going on a trip.
- id: picknick
  lesson: de1-perfect-haben
  term: das Picknick
  pos: noun
  plural: die Picknicks
  meanings: ["picnic"]
  example: Wir machen ein Picknick im Park.
  exampleEn: We're having a picnic in the park.
  note: 'Plural also die Picknicke.'
- id: geschichte
  lesson: de1-perfect-haben
  term: die Geschichte
  pos: noun
  plural: die Geschichten
  meanings: ["story", "history", "tale"]
  example: Erzähl mir eine Geschichte!
  exampleEn: Tell me a story!
- id: brief
  lesson: de1-perfect-haben
  term: der Brief
  pos: noun
  plural: die Briefe
  meanings: ["letter (that you post)", "letter"]
  example: Ich schreibe einen Brief an meine Oma.
  exampleEn: I'm writing a letter to my grandma.
- id: postkarte
  lesson: de1-perfect-haben
  term: die Postkarte
  pos: noun
  plural: die Postkarten
  meanings: ["postcard", "card"]
  example: Wir haben eine Postkarte aus Italien bekommen.
  exampleEn: We got a postcard from Italy.
- id: bild
  lesson: de1-perfect-haben
  term: das Bild
  pos: noun
  plural: die Bilder
  meanings: ["picture", "image", "painting", "photo"]
  example: Das Bild hängt im Wohnzimmer.
  exampleEn: The picture hangs in the living room.
- id: sache
  lesson: de1-perfect-haben
  term: die Sache
  pos: noun
  plural: die Sachen
  meanings: ["thing (matter, item)", "thing", "matter", "affair", "stuff"]
  example: Wo sind meine Sachen?
  exampleEn: Where are my things?
  note: 'Plural die Sachen often means "things, stuff, belongings".'

# --- Lesson 22: the perfect with sein, war/hatte ---------------------------------
- id: passieren
  lesson: de1-perfect-sein
  term: passieren
  pos: verb
  meanings: ["to happen", "to occur"]
  example: Was ist passiert?
  exampleEn: What happened?
  note: 'Perfect with sein: ist passiert.'
- id: werden
  lesson: de1-perfect-sein
  term: werden
  pos: verb
  meanings: ["to become", "to get (to turn into)", "to turn", "to grow"]
  example: Sie wird Ärztin.
  exampleEn: She's going to be a doctor.
  note: 'ich werde, du wirst, er wird. Perfect: ist geworden.'
- id: laufen
  lesson: de1-perfect-sein
  term: laufen
  pos: verb
  meanings: ["to run", "to walk", "to go on foot"]
  example: Ich laufe jeden Morgen im Park.
  exampleEn: I run in the park every morning.
  note: 'du läufst, er läuft. Perfect: ist gelaufen.'
- id: umziehen
  lesson: de1-perfect-sein
  term: umziehen
  pos: verb
  meanings: ["to move (house)", "to move", "to relocate", "to move home"]
  example: Wir sind nach Hamburg umgezogen.
  exampleEn: We moved to Hamburg.
  note: 'Separable: ich ziehe um. Perfect: ist umgezogen.'
- id: zurueckkommen
  lesson: de1-perfect-sein
  term: zurückkommen
  pos: verb
  meanings: ["to come back", "to return", "to get back"]
  example: Wann kommst du zurück?
  exampleEn: When are you coming back?
  note: 'Separable: ich komme zurück. Perfect: ist zurückgekommen.'
- id: ferien
  lesson: de1-perfect-sein
  term: die Ferien
  pos: noun
  plural: die Ferien (plural only)
  meanings: ["holidays (school or university break)", "holidays", "vacation", "school holidays", "break"]
  example: In den Ferien fahren wir ans Meer.
  exampleEn: In the holidays we're going to the seaside.
- id: meer
  lesson: de1-perfect-sein
  term: das Meer
  pos: noun
  plural: die Meere
  meanings: ["sea", "ocean", "seaside"]
  example: Das Meer ist heute ruhig.
  exampleEn: The sea is calm today.
- id: see
  lesson: de1-perfect-sein
  term: der See
  pos: noun
  plural: die Seen
  meanings: ["lake"]
  example: Im Sommer schwimmen wir im See.
  exampleEn: In the summer we swim in the lake.
  note: 'die See (feminine) means "the sea", but it is rare; the lake is der See.'
- id: berg
  lesson: de1-perfect-sein
  term: der Berg
  pos: noun
  plural: die Berge
  meanings: ["mountain", "hill"]
  example: Der Berg ist sehr hoch.
  exampleEn: The mountain is very high.
- id: dorf
  lesson: de1-perfect-sein
  term: das Dorf
  pos: noun
  plural: die Dörfer
  meanings: ["village"]
  example: Meine Großeltern wohnen in einem Dorf.
  exampleEn: My grandparents live in a village.
- id: insel
  lesson: de1-perfect-sein
  term: die Insel
  pos: noun
  plural: die Inseln
  meanings: ["island"]
  example: Rügen ist eine Insel.
  exampleEn: Rügen is an island.
- id: strand
  lesson: de1-perfect-sein
  term: der Strand
  pos: noun
  plural: die Strände
  meanings: ["beach", "shore"]
  example: Wir waren den ganzen Tag am Strand.
  exampleEn: We were on the beach all day.
- id: natur
  lesson: de1-perfect-sein
  term: die Natur
  pos: noun
  plural: —
  meanings: ["nature", "countryside", "outdoors"]
  example: Am Wochenende bin ich gern in der Natur.
  exampleEn: At the weekend I like being out in nature.
- id: fluss
  lesson: de1-perfect-sein
  term: der Fluss
  pos: noun
  plural: die Flüsse
  meanings: ["river", "stream"]
  example: Der Rhein ist ein langer Fluss.
  exampleEn: The Rhine is a long river.
- id: ausland
  lesson: de1-perfect-sein
  term: das Ausland
  pos: noun
  plural: —
  meanings: ["abroad (foreign countries)", "abroad", "foreign countries", "overseas"]
  example: Mein Bruder arbeitet im Ausland.
  exampleEn: My brother works abroad.
  note: 'im Ausland = (living, working) abroad; ins Ausland = (going) abroad.'
- id: welt
  lesson: de1-perfect-sein
  term: die Welt
  pos: noun
  plural: die Welten
  meanings: ["world", "earth"]
  example: Sie ist um die Welt gereist.
  exampleEn: She travelled around the world.
- id: war
  lesson: de1-perfect-sein
  term: war
  pos: verb
  meanings: ["was (past of sein)", "was", "were"]
  example: Gestern war ich krank.
  exampleEn: Yesterday I was ill.
  note: 'ich war, du warst, er war, wir waren, ihr wart, sie waren.'
- id: hatte
  lesson: de1-perfect-sein
  term: hatte
  pos: verb
  meanings: ["had (past of haben)", "had"]
  example: Ich hatte keine Zeit.
  exampleEn: I didn't have time.
  note: 'ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten.'
- id: letztes-jahr
  lesson: de1-perfect-sein
  kind: phrase
  term: letztes Jahr
  pos: phrase
  meanings: ["last year"]
  example: Letztes Jahr waren wir in Spanien.
  exampleEn: Last year we were in Spain.
- id: frueher
  lesson: de1-perfect-sein
  term: früher
  pos: adverb
  meanings: ["in the past (formerly, used to)", "formerly", "in the past", "used to", "earlier", "before"]
  example: Früher habe ich in einem Dorf gewohnt.
  exampleEn: I used to live in a village.
- id: endlich
  lesson: de1-perfect-sein
  term: endlich
  pos: adverb
  meanings: ["finally (at last)", "at last", "finally", "eventually"]
  example: Endlich ist der Bus gekommen!
  exampleEn: At last the bus came!
- id: ploetzlich
  lesson: de1-perfect-sein
  term: plötzlich
  pos: adverb
  meanings: ["suddenly", "all of a sudden"]
  example: Plötzlich hat es geregnet.
  exampleEn: Suddenly it rained.
- id: zurueck
  lesson: de1-perfect-sein
  term: zurück
  pos: adverb
  meanings: ["back (returning)", "back"]
  example: Ich bin um acht Uhr zurück.
  exampleEn: I'll be back at eight o'clock.

# --- Lesson 23: linking sentences and writing messages ---------------------------
- id: oder
  lesson: de1-writing
  term: oder
  pos: conjunction
  meanings: ["or"]
  example: Möchtest du Tee oder Kaffee?
  exampleEn: Would you like tea or coffee?
- id: aber
  lesson: de1-writing
  term: aber
  pos: conjunction
  meanings: ["but", "however"]
  example: Das Zimmer ist klein, aber schön.
  exampleEn: The room is small but nice.
- id: denn
  lesson: de1-writing
  term: denn
  pos: conjunction
  meanings: ["because (verb stays in position 2)", "because", "as", "since", "for"]
  example: Ich komme nicht, denn ich bin krank.
  exampleEn: I'm not coming because I'm ill.
  note: 'In questions denn is also a filler word: Wo warst du denn?'
- id: sondern
  lesson: de1-writing
  term: sondern
  pos: conjunction
  meanings: ["but (rather, after a negative)", "but rather", "but", "instead"]
  example: Das ist kein Tee, sondern Kaffee.
  exampleEn: That's not tea but coffee.
- id: deshalb
  lesson: de1-writing
  term: deshalb
  pos: adverb
  meanings: ["that's why (therefore)", "therefore", "so", "that's why", "for that reason"]
  example: Ich bin müde, deshalb gehe ich ins Bett.
  exampleEn: I'm tired, so I'm going to bed.
  note: 'Takes position 1, so the verb follows directly: Deshalb komme ich.'
- id: liebe-dear
  lesson: de1-writing
  term: liebe
  pos: adjective
  meanings: ["dear (opening a letter to a woman)", "dear"]
  example: Liebe Anna, vielen Dank für deinen Brief!
  exampleEn: Dear Anna, thanks a lot for your letter!
- id: lieber-dear
  lesson: de1-writing
  term: lieber
  pos: adjective
  meanings: ["dear (opening a letter to a man)", "dear"]
  example: Lieber Tom, wie geht es dir?
  exampleEn: Dear Tom, how are you?
- id: sehr-geehrte-damen-und-herren
  lesson: de1-writing
  kind: phrase
  term: Sehr geehrte Damen und Herren
  pos: phrase
  meanings: ["Dear Sir or Madam", "Dear Sir/Madam", "to whom it may concern", "Dear Sirs", "ladies and gentlemen"]
  example: Sehr geehrte Damen und Herren, ich habe eine Frage.
  exampleEn: Dear Sir or Madam, I have a question.
  note: 'Formal opening when you do not know the name. To a person: Sehr geehrte Frau …, Sehr geehrter Herr ….'
- id: viele-gruesse
  lesson: de1-writing
  kind: phrase
  term: Viele Grüße
  pos: phrase
  alt: ["viele Grüße", "Viele Grüsse"]
  meanings: ["best wishes (to close a message)", "best wishes", "kind regards", "regards", "many greetings", "all the best"]
  example: Viele Grüße, deine Lisa
  exampleEn: Best wishes, your Lisa
- id: bis-bald
  lesson: de1-writing
  kind: phrase
  term: Bis bald!
  alt: ["bis bald", "Bis bald"]
  pos: phrase
  meanings: ["See you soon!", "see you soon", "until soon", "talk soon"]
  example: Bis bald, und viel Spaß im Urlaub!
  exampleEn: See you soon, and have fun on holiday!
- id: nachricht
  lesson: de1-writing
  term: die Nachricht
  pos: noun
  plural: die Nachrichten
  meanings: ["message", "text message", "note"]
  example: Ich schicke dir eine Nachricht.
  exampleEn: I'll send you a message.
  note: 'Plural die Nachrichten also means "the news".'
- id: schicken
  lesson: de1-writing
  term: schicken
  pos: verb
  meanings: ["to send"]
  example: Kannst du mir die Adresse schicken?
  exampleEn: Can you send me the address?
- id: geburtsdatum
  lesson: de1-writing
  term: das Geburtsdatum
  pos: noun
  plural: die Geburtsdaten
  meanings: ["date of birth", "birth date"]
  example: Bitte schreiben Sie hier Ihr Geburtsdatum.
  exampleEn: Please write your date of birth here.
- id: geburtsort
  lesson: de1-writing
  term: der Geburtsort
  pos: noun
  plural: die Geburtsorte
  meanings: ["place of birth", "birthplace"]
  example: Mein Geburtsort ist Graz.
  exampleEn: My place of birth is Graz.
- id: staatsangehoerigkeit
  lesson: de1-writing
  term: die Staatsangehörigkeit
  pos: noun
  plural: die Staatsangehörigkeiten
  meanings: ["nationality", "citizenship"]
  example: Welche Staatsangehörigkeit haben Sie?
  exampleEn: What nationality are you?
- id: familienstand
  lesson: de1-writing
  term: der Familienstand
  pos: noun
  plural: —
  meanings: ["marital status"]
  example: 'Familienstand: verheiratet'
  exampleEn: 'Marital status: married'
- id: geschlecht
  lesson: de1-writing
  term: das Geschlecht
  pos: noun
  plural: die Geschlechter
  meanings: ["sex (on a form: male, female)", "sex", "gender"]
  example: 'Geschlecht: weiblich'
  exampleEn: 'Sex: female'
  note: 'In grammar, a noun''s gender is also called Geschlecht (or Genus).'
- id: maennlich
  lesson: de1-writing
  term: männlich
  pos: adjective
  meanings: ["male", "masculine"]
  example: 'Bitte kreuzen Sie an: männlich oder weiblich.'
  exampleEn: Please tick male or female.
- id: weiblich
  lesson: de1-writing
  term: weiblich
  pos: adjective
  meanings: ["female", "feminine"]
  example: 'Geschlecht: weiblich'
  exampleEn: 'Sex: female'
- id: unterschrift
  lesson: de1-writing
  term: die Unterschrift
  pos: noun
  plural: die Unterschriften
  meanings: ["signature"]
  example: Hier fehlt noch Ihre Unterschrift.
  exampleEn: Your signature is still missing here.
- id: absage
  lesson: de1-writing
  term: die Absage
  pos: noun
  plural: die Absagen
  meanings: ["cancellation (saying no to an invitation or appointment)", "cancellation", "refusal", "rejection", "decline"]
  example: Leider habe ich eine Absage bekommen.
  exampleEn: Unfortunately I got a rejection.
- id: absagen
  lesson: de1-writing
  term: absagen
  pos: verb
  meanings: ["to cancel (an appointment or event)", "to cancel", "to call off", "to decline"]
  example: Ich muss den Termin leider absagen.
  exampleEn: Unfortunately I have to cancel the appointment.
  note: 'Separable: ich sage ab. Perfect: hat abgesagt.'
- id: antwort
  lesson: de1-writing
  term: die Antwort
  pos: noun
  plural: die Antworten
  meanings: ["answer", "reply", "response"]
  example: Danke für deine schnelle Antwort!
  exampleEn: Thanks for your quick reply!
- id: frage
  lesson: de1-writing
  term: die Frage
  pos: noun
  plural: die Fragen
  meanings: ["question", "query"]
  example: Ich habe eine Frage.
  exampleEn: I have a question.
- id: kurs
  lesson: de1-writing
  term: der Kurs
  pos: noun
  plural: die Kurse
  meanings: ["course (a class)", "course", "class"]
  example: Der Kurs beginnt am Montag.
  exampleEn: The course starts on Monday.
- id: pruefung
  lesson: de1-writing
  term: die Prüfung
  pos: noun
  plural: die Prüfungen
  meanings: ["exam", "examination", "test"]
  example: Morgen habe ich eine Prüfung.
  exampleEn: I have an exam tomorrow.
- id: bestehen
  lesson: de1-writing
  term: bestehen
  pos: verb
  meanings: ["to pass (an exam)", "to pass"]
  example: Ich habe die Prüfung bestanden!
  exampleEn: I passed the exam!
  note: 'Perfect: hat bestanden.'
- id: problem
  lesson: de1-writing
  term: das Problem
  pos: noun
  plural: die Probleme
  meanings: ["problem", "issue", "trouble"]
  example: Kein Problem!
  exampleEn: No problem!

# --- Lesson 24: the exam and review -------------------------------------------------
- id: aufgabe
  lesson: de1-exam-review
  term: die Aufgabe
  pos: noun
  plural: die Aufgaben
  meanings: ["task (an exercise to do)", "task", "exercise", "assignment", "job"]
  example: Lesen Sie die Aufgabe genau.
  exampleEn: Read the task carefully.
- id: text
  lesson: de1-exam-review
  term: der Text
  pos: noun
  plural: die Texte
  meanings: ["text"]
  example: Der Text ist nicht lang.
  exampleEn: The text isn't long.
- id: loesung
  lesson: de1-exam-review
  term: die Lösung
  pos: noun
  plural: die Lösungen
  meanings: ["solution (correct answer)", "solution", "answer", "key"]
  example: Die Lösungen sind auf Seite 50.
  exampleEn: The answers are on page 50.
- id: ankreuzen
  lesson: de1-exam-review
  term: ankreuzen
  pos: verb
  meanings: ["to tick (mark with a cross)", "to tick", "to check", "to mark with a cross", "to cross"]
  example: Kreuzen Sie die richtige Antwort an.
  exampleEn: Tick the correct answer.
  note: 'Separable: ich kreuze an. Perfect: hat angekreuzt.'
- id: ergaenzen
  lesson: de1-exam-review
  term: ergänzen
  pos: verb
  meanings: ["to complete (fill in the gaps)", "to complete", "to fill in", "to add", "to supplement"]
  example: Ergänzen Sie die Sätze.
  exampleEn: Complete the sentences.
  note: 'Perfect: hat ergänzt.'
- id: wiederholen
  lesson: de1-exam-review
  term: wiederholen
  pos: verb
  meanings: ["to repeat", "to revise", "to review", "to say again"]
  example: Wir wiederholen heute die Verben.
  exampleEn: Today we're reviewing the verbs.
  note: 'Not separable here: ich wiederhole, hat wiederholt.'
- id: erklaeren
  lesson: de1-exam-review
  term: erklären
  pos: verb
  meanings: ["to explain"]
  example: Kannst du mir das erklären?
  exampleEn: Can you explain that to me?
