- term: vowel
  aliases: [vowels, Vokal]
  definition: 'A letter or sound made with the mouth open and the air flowing freely: a, e, i, o, u, plus ä, ö, ü in German. Every German vowel can be long (Tag, sie) or short (Stadt, bitte), and the length can change the meaning of a word.'
  topic: Pronunciation

- term: consonant
  aliases: [consonants, Konsonant]
  definition: 'A sound made by partly or fully blocking the air with the lips, tongue or throat, such as b, k, s or ch. In German, a vowel before a double consonant (ll, mm, ss, tt) is usually short: Hallo, kommen.'
  topic: Pronunciation

- term: umlaut
  aliases: [umlauts]
  definition: 'The two dots over a, o or u (ä, ö, ü), which change the vowel''s sound. They are part of the spelling: schon (already) and schön (beautiful) are different words. Write ae, oe, ue only if you cannot type the real letters.'
  topic: Pronunciation

- term: diphthong
  aliases: [diphthongs]
  definition: 'Two vowel sounds that glide together in one syllable. German has three: ei/ai (as in eye: nein), eu/äu (as in boy: Deutschland), au (as in cow: Frau). Note that ie is not a diphthong but a long ee sound.'
  topic: Pronunciation

- term: final devoicing
  aliases: [devoicing, Auslautverhärtung]
  definition: 'The rule that b, d and g at the end of a word or syllable are pronounced like p, t and k: Tag sounds like "tahk", und like "oont". The spelling stays the same.'
  topic: Pronunciation

- term: word stress
  aliases: [stress, stressed syllable]
  definition: 'The syllable said more strongly than the others. German words are usually stressed on the first syllable (DAN-ke), except after prefixes such as be-, ent-, ver- (ver-STE-hen), in verbs ending in -ieren (stu-DIE-ren) and in many borrowed words (Ad-RES-se).'
  topic: Pronunciation

- term: noun
  aliases: [nouns, Nomen, Substantiv]
  definition: 'A word for a person, place, thing or idea: Name, Stadt, Wort. In German every noun starts with a capital letter and has a gender, shown by its article der, die or das, so learn each noun with its article.'
  topic: Grammar basics

- term: informal
  aliases: [informal you, du form, duzen]
  definition: 'The friendly way of addressing someone, with du (one person) or ihr (two or more). Used with friends, family, children, and among students and young people. Goes with first names.'
  topic: Address

- term: formal
  aliases: [formal you, Sie form, siezen]
  definition: 'The polite way of addressing someone, with Sie (always capitalized), for one or more people. Used with adults you don''t know, staff in shops and offices, and anyone you call Herr or Frau. The verb form is the same as the infinitive: Sie wohnen, Sie heißen (except Sie sind).'
  topic: Address

- term: verb
  aliases: [verbs]
  definition: 'A word for an action or state, such as wohnen (to live), kommen (to come) or sein (to be). In a German sentence the verb changes its ending to match the subject: ich wohne, du wohnst.'
  topic: Verbs

- term: infinitive
  aliases: [infinitives, Infinitiv]
  definition: 'The basic form of a verb, the one listed in a dictionary. German infinitives end in -en or -n: machen, arbeiten, sein. Remove the -en to find the stem.'
  topic: Verbs

- term: subject
  aliases: [subjects, Subjekt]
  definition: 'The person or thing that does the action of the verb, or that the sentence is about: in Ich wohne in Berlin, the subject is ich. The verb ending must match the subject.'
  topic: Grammar basics

- term: W-question
  aliases: [W-questions, question word, W-Frage]
  definition: 'A question that starts with a question word such as wer (who), wie (how), wo (where), woher (where from), was (what), warum (why) or wann (when). The verb comes second, straight after the question word: Wo wohnst du?'
  topic: Questions

- term: personal pronoun
  aliases: [personal pronouns, pronoun, pronouns, Personalpronomen]
  definition: 'A short word that stands for a person or thing. The German subject pronouns are ich (I), du (you, informal), er/sie/es (he/she/it), wir (we), ihr (you, informal plural), sie (they) and Sie (you, formal).'
  topic: Verbs

- term: conjugate
  aliases: [conjugation, conjugated, conjugating, Konjugation]
  definition: 'To give a verb the form that matches its subject, usually by adding an ending to the stem: lernen becomes ich lerne, du lernst, er lernt, wir lernen, ihr lernt, sie lernen. The full set of forms is the verb''s conjugation.'
  topic: Verbs

- term: stem
  aliases: [verb stem, stems, Stamm]
  definition: 'The part of a verb left when you remove the infinitive ending -en (or -n): mach- from machen, arbeit- from arbeiten. Endings are added to the stem.'
  topic: Verbs

- term: ending
  aliases: [endings, verb ending, verb endings, Endung]
  definition: 'The letters added to a stem to show who does the action. The regular present-tense endings are -e, -st, -t, -en, -t, -en (ich, du, er/sie/es, wir, ihr, sie/Sie). Stems ending in -t or -d add an e: du arbeitest.'
  topic: Verbs

- term: present tense
  aliases: [present, Präsens]
  definition: 'The verb form for things happening now, in general, or (with a time word) in the future. One German form covers English "I play", "I am playing" and "I do play": ich spiele.'
  topic: Verbs

- term: statement
  aliases: [statements, declarative sentence]
  definition: 'A sentence that tells something rather than asking or ordering: Ich wohne in Köln. In a German statement the conjugated verb is always the second element.'
  topic: Word order

- term: verb-second rule
  aliases: [verb second, V2, verb in second position, verb-second]
  definition: 'The rule that the conjugated verb is the second element of a German statement. If something other than the subject comes first (a time word, a place), the subject moves to just after the verb: Heute arbeite ich, not Heute ich arbeite.'
  topic: Word order

- term: yes/no question
  aliases: [yes-no question, yes/no questions, Ja/Nein-Frage]
  definition: 'A question that can be answered with ja or nein. In German the conjugated verb comes first and the subject second, with no helper verb like English "do": Wohnst du hier? (Do you live here?)'
  topic: Questions
