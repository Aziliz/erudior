# Module 5: Town, travel and home (lessons 17–20)

# 17 de1-city-imperative
- id: strasse
  lesson: de1-city-imperative
  term: die Straße
  pos: noun
  plural: die Straßen
  alt: ["die Strasse"]
  meanings: ["street", "road"]
  example: Unsere Straße ist sehr ruhig.
  exampleEn: Our street is very quiet.
- id: platz
  lesson: de1-city-imperative
  term: der Platz
  pos: noun
  plural: die Plätze
  meanings: ["square (in a town)", "square", "place", "space", "seat", "room"]
  example: Am Marktplatz gibt es ein Café.
  exampleEn: There is a café on the market square.
