  plural: die Apotheken
  meanings: ["pharmacy", "chemist's", "drugstore", "chemist"]
  example: Gibt es hier in der Nähe eine Apotheke?
  exampleEn: Is there a pharmacy nearby?
- id: krankenhaus
  lesson: de1-city-imperative
  term: das Krankenhaus
  pos: noun
  plural: die Krankenhäuser
  meanings: ["hospital"]
  example: Das Krankenhaus ist nicht weit.
  exampleEn: The hospital isn't far.
- id: hotel
  lesson: de1-city-imperative
  term: das Hotel
  pos: noun
  plural: die Hotels
  meanings: ["hotel"]
  example: Unser Hotel ist im Zentrum.
  exampleEn: Our hotel is in the centre.
- id: restaurant
  lesson: de1-city-imperative
  term: das Restaurant
  pos: noun
  plural: die Restaurants
  meanings: ["restaurant"]
  example: Das Restaurant ist heute geschlossen.
  exampleEn: The restaurant is closed today.
- id: cafe
  lesson: de1-city-imperative
  term: das Café
  pos: noun
  plural: die Cafés
  alt: ["das Cafe"]
  meanings: ["café", "cafe", "coffee shop"]
  example: Wir treffen uns im Café.
  exampleEn: We're meeting in the café.
- id: museum
  lesson: de1-city-imperative
  term: das Museum
  pos: noun
  plural: die Museen
  meanings: ["museum"]
  example: Das Museum ist am Montag zu.
  exampleEn: The museum is closed on Monday.
- id: kirche
  lesson: de1-city-imperative
  term: die Kirche
  pos: noun
  plural: die Kirchen
  meanings: ["church"]
  example: Die Kirche ist sehr alt.
  exampleEn: The church is very old.
- id: park
  lesson: de1-city-imperative
  term: der Park
  pos: noun
  plural: die Parks
  meanings: ["park"]
  example: Im Park spielen viele Kinder.
  exampleEn: Lots of children are playing in the park.
- id: bruecke
  lesson: de1-city-imperative
  term: die Brücke
  pos: noun
  plural: die Brücken
  alt: ["die Bruecke"]
  meanings: ["bridge"]
  example: Gehen Sie über die Brücke.
  exampleEn: Go over the bridge.
- id: zentrum
  lesson: de1-city-imperative
  term: das Zentrum
  pos: noun
  plural: die Zentren
  meanings: ["centre (of a town)", "center", "centre", "city centre", "town centre", "downtown"]
  example: Das Hotel ist im Zentrum.
  exampleEn: The hotel is in the centre.
- id: haltestelle
  lesson: de1-city-imperative
  term: die Haltestelle
  pos: noun
  plural: die Haltestellen
  meanings: ["stop (for a bus or tram)", "stop", "bus stop", "tram stop"]
  example: Die Haltestelle ist an der Ecke.
  exampleEn: The stop is on the corner.
- id: ecke
  lesson: de1-city-imperative
  term: die Ecke
  pos: noun
  plural: die Ecken
  meanings: ["corner"]
  example: An der Ecke ist eine Bäckerei.
  exampleEn: There's a bakery on the corner.
- id: ampel
  lesson: de1-city-imperative
  term: die Ampel
  pos: noun
  plural: die Ampeln
  meanings: ["traffic lights", "traffic light", "stoplight"]
  example: An der Ampel biegen Sie links ab.
  exampleEn: Turn left at the traffic lights.
- id: stadtplan
  lesson: de1-city-imperative
  term: der Stadtplan
  pos: noun
  plural: die Stadtpläne
  meanings: ["city map", "town map", "street map", "map (of a town)"]
  example: Hast du einen Stadtplan?
  exampleEn: Do you have a city map?
- id: weg
  lesson: de1-city-imperative
  term: der Weg
  pos: noun
  plural: die Wege
  meanings: ["way (route)", "way", "path", "route"]
  example: Können Sie mir den Weg zeigen?
  exampleEn: Can you show me the way?
- id: links
  lesson: de1-city-imperative
  term: links
  pos: adverb
  meanings: ["left (direction)", "left", "on the left", "to the left"]
  example: Die Post ist links.
  exampleEn: The post office is on the left.
- id: rechts
  lesson: de1-city-imperative
  term: rechts
  pos: adverb
  meanings: ["right (direction)", "right", "on the right", "to the right"]
  example: Nehmen Sie die erste Straße rechts.
  exampleEn: Take the first street on the right.
- id: geradeaus
  lesson: de1-city-imperative
  term: geradeaus
  pos: adverb
  meanings: ["straight ahead", "straight on", "straight"]
  example: Gehen Sie immer geradeaus.
  exampleEn: Keep going straight ahead.
- id: weit
  lesson: de1-city-imperative
  term: weit
  pos: adjective
  meanings: ["far", "far away", "a long way"]
  example: Ist das weit?
  exampleEn: Is that far?
- id: nah
  lesson: de1-city-imperative
  term: nah
  pos: adjective
  alt: ["nahe"]
  meanings: ["near", "close", "nearby", "close by"]
  example: Der Bahnhof ist ganz nah.
  exampleEn: The station is very close.
- id: in-der-naehe
  lesson: de1-city-imperative
  kind: phrase
  term: in der Nähe
  pos: phrase
  meanings: ["nearby (in the area)", "nearby", "near here", "in the area", "close by", "in the vicinity"]
  example: Gibt es hier in der Nähe ein Hotel?
  exampleEn: Is there a hotel nearby?
- id: zu-fuss
  lesson: de1-city-imperative
  kind: phrase
  term: zu Fuß
  pos: phrase
  alt: ["zu Fuss"]
  meanings: ["on foot", "by foot", "walking"]
  example: Ich gehe zu Fuß zur Arbeit.
  exampleEn: I walk to work.
- id: gegenueber
  lesson: de1-city-imperative
  term: gegenüber
  pos: preposition
  meanings: ["opposite", "across from", "across the street", "facing"]
  note: 'Takes the dative: gegenüber der Kirche. Also used alone: Die Post ist direkt gegenüber.'
  example: Die Apotheke ist direkt gegenüber.
  exampleEn: The pharmacy is directly opposite.
- id: zweite
  lesson: de1-city-imperative
  term: zweite
  pos: adjective
  meanings: ["second (ordinal)", "second", "2nd"]
  note: 'Ordinal of zwei: der/die/das zweite.'
  example: Nehmen Sie die zweite Straße links.
  exampleEn: Take the second street on the left.
- id: zeigen
  lesson: de1-city-imperative
  term: zeigen
  pos: verb
  meanings: ["to show", "to point"]
  example: Zeig mir bitte den Weg.
  exampleEn: Please show me the way.
- id: finden
  lesson: de1-city-imperative
  term: finden
  pos: verb
  meanings: ["to find", "to think (have an opinion)", "to think"]
  note: 'Perfect: hat gefunden. Also for opinions: Ich finde das gut.'
  example: Ich finde den Bahnhof nicht.
  exampleEn: I can't find the station.
- id: abbiegen
  lesson: de1-city-imperative
  term: abbiegen
  pos: verb
  meanings: ["to turn (left or right)", "to turn", "to turn off"]
  note: 'Separable: Biegen Sie links ab! Perfect with sein: ist abgebogen.'
  example: Biegen Sie an der Ampel rechts ab.
  exampleEn: Turn right at the traffic lights.

# 18 de1-travel-dative
- id: bahnhof
  lesson: de1-travel-dative
  term: der Bahnhof
  pos: noun
  plural: die Bahnhöfe
  meanings: ["station (for trains)", "station", "train station", "railway station"]
  example: Wie komme ich zum Bahnhof?
  exampleEn: How do I get to the station?
- id: zug
  lesson: de1-travel-dative
  term: der Zug
  pos: noun
  plural: die Züge
  meanings: ["train"]
  example: Der Zug kommt um acht Uhr an.
  exampleEn: The train arrives at eight o'clock.
- id: bus
  lesson: de1-travel-dative
  term: der Bus
  pos: noun
  plural: die Busse
  meanings: ["bus", "coach"]
  example: Ich fahre mit dem Bus zur Schule.
  exampleEn: I go to school by bus.
- id: u-bahn
  lesson: de1-travel-dative
  term: die U-Bahn
  pos: noun
  plural: die U-Bahnen
  meanings: ["underground (train)", "underground", "subway", "metro", "tube"]
  example: Nimm die U-Bahn, das geht schneller.
  exampleEn: Take the underground, it's quicker.
- id: s-bahn
  lesson: de1-travel-dative
  term: die S-Bahn
  pos: noun
  plural: die S-Bahnen
  meanings: ["suburban train", "commuter train", "city train", "S-Bahn"]
  example: Die S-Bahn fährt zum Flughafen.
  exampleEn: The suburban train goes to the airport.
- id: strassenbahn
  lesson: de1-travel-dative
  term: die Straßenbahn
  pos: noun
  plural: die Straßenbahnen
  alt: ["die Strassenbahn"]
  meanings: ["tram", "streetcar", "trolley"]
  example: Wir fahren mit der Straßenbahn.
  exampleEn: We're going by tram.
- id: auto
  lesson: de1-travel-dative
  term: das Auto
  pos: noun
  plural: die Autos
  meanings: ["car", "automobile"]
  example: Mein Auto ist leider kaputt.
  exampleEn: Unfortunately my car is broken.
- id: taxi
  lesson: de1-travel-dative
  term: das Taxi
  pos: noun
  plural: die Taxis
  meanings: ["taxi", "cab"]
  example: Wir nehmen ein Taxi zum Hotel.
  exampleEn: We're taking a taxi to the hotel.
- id: flugzeug
  lesson: de1-travel-dative
  term: das Flugzeug
  pos: noun
  plural: die Flugzeuge
  meanings: ["plane", "airplane", "aeroplane", "aircraft"]
  example: Das Flugzeug ist pünktlich.
  exampleEn: The plane is on time.
- id: flughafen
  lesson: de1-travel-dative
  term: der Flughafen
  pos: noun
  plural: die Flughäfen
  meanings: ["airport"]
  example: Ich fahre mit der S-Bahn zum Flughafen.
  exampleEn: I'm taking the suburban train to the airport.
- id: fahrkarte
  lesson: de1-travel-dative
  term: die Fahrkarte
  pos: noun
  plural: die Fahrkarten
  meanings: ["ticket (for a train or bus)", "ticket", "travel ticket", "fare"]
  example: Eine Fahrkarte nach Hamburg, bitte.
  exampleEn: A ticket to Hamburg, please.
- id: ticket
  lesson: de1-travel-dative
  term: das Ticket
  pos: noun
  plural: die Tickets
  meanings: ["ticket (English loanword; also for planes and concerts)", "ticket"]
  example: Hast du schon ein Ticket für das Konzert?
  exampleEn: Have you already got a ticket for the concert?
- id: fahrplan
  lesson: de1-travel-dative
  term: der Fahrplan
  pos: noun
  plural: die Fahrpläne
  meanings: ["timetable", "schedule"]
  example: Der Fahrplan hängt an der Haltestelle.
  exampleEn: The timetable is at the stop.
- id: gleis
  lesson: de1-travel-dative
  term: das Gleis
  pos: noun
  plural: die Gleise
  meanings: ["platform (at a station)", "platform", "track"]
  example: Der Zug fährt von Gleis 3 ab.
  exampleEn: The train leaves from platform 3.
- id: abfahrt
  lesson: de1-travel-dative
  term: die Abfahrt
  pos: noun
  plural: die Abfahrten
  meanings: ["departure"]
  example: Die Abfahrt ist um 9:20 Uhr.
  exampleEn: The departure is at 9:20.
- id: ankunft
  lesson: de1-travel-dative
  term: die Ankunft
  pos: noun
  plural: die Ankünfte
  meanings: ["arrival"]
  example: Die Ankunft in Berlin ist um 14 Uhr.
  exampleEn: The arrival in Berlin is at 2 p.m.
- id: verspaetung
  lesson: de1-travel-dative
  term: die Verspätung
  pos: noun
  plural: die Verspätungen
  meanings: ["delay", "lateness"]
  note: 'Verspätung haben = to be late, to be delayed: Der Zug hat Verspätung.'
  example: Der Bus hat zehn Minuten Verspätung.
  exampleEn: The bus is ten minutes late.
- id: reise
  lesson: de1-travel-dative
  term: die Reise
  pos: noun
  plural: die Reisen
  meanings: ["trip", "journey", "travel", "tour", "voyage"]
  example: Gute Reise!
  exampleEn: Have a good trip!
- id: urlaub
  lesson: de1-travel-dative
  term: der Urlaub
  pos: noun
  plural: die Urlaube
  meanings: ["holiday (time off work)", "holiday", "holidays", "vacation", "leave"]
  example: Wir fahren im Sommer in den Urlaub.
  exampleEn: We're going on holiday in the summer.
- id: koffer
  lesson: de1-travel-dative
  term: der Koffer
  pos: noun
  plural: die Koffer
  meanings: ["suitcase", "case"]
  example: Mein Koffer ist sehr schwer.
  exampleEn: My suitcase is very heavy.
- id: abfahren
  lesson: de1-travel-dative
  term: abfahren
  pos: verb
  meanings: ["to leave (by vehicle)", "to leave", "to depart", "to set off", "to go"]
  note: 'Separable, stem change: du fährst ab, er fährt ab. Perfect with sein: ist abgefahren.'
  example: Wann fährt der Bus ab?
  exampleEn: When does the bus leave?
- id: einsteigen
  lesson: de1-travel-dative
  term: einsteigen
  pos: verb
  meanings: ["to get on (a vehicle)", "to get on", "to get in", "to board"]
  note: 'Separable: Steigen Sie bitte ein! Perfect with sein: ist eingestiegen.'
  example: Bitte schnell einsteigen!
  exampleEn: Please get on quickly!
- id: aussteigen
  lesson: de1-travel-dative
  term: aussteigen
  pos: verb
  meanings: ["to get off (a vehicle)", "to get off", "to get out"]
  note: 'Separable: Wir steigen hier aus. Perfect with sein: ist ausgestiegen.'
  example: Ich steige an der nächsten Haltestelle aus.
  exampleEn: I'm getting off at the next stop.
- id: umsteigen
  lesson: de1-travel-dative
  term: umsteigen
  pos: verb
  meanings: ["to change (trains or buses)", "to change", "to transfer", "to switch"]
  note: 'Separable: Sie steigen in Köln um. Perfect with sein: ist umgestiegen.'
  example: Muss ich umsteigen?
  exampleEn: Do I have to change?
- id: fliegen
  lesson: de1-travel-dative
  term: fliegen
  pos: verb
  meanings: ["to fly"]
  note: 'Perfect with sein: ist geflogen.'
  example: Wir fliegen im Mai nach Spanien.
  exampleEn: We're flying to Spain in May.
- id: mit
  lesson: de1-travel-dative
  term: mit
  pos: preposition
  meanings: ["with", "by (means of transport)", "by"]
  note: 'Always takes the dative: mit dem Zug, mit meiner Schwester.'
  example: Ich fahre mit dem Zug nach Wien.
  exampleEn: I'm going to Vienna by train.
- id: zu-to
  lesson: de1-travel-dative
  term: zu
  pos: preposition
  meanings: ["to (a person or a place)", "to"]
  note: 'Always takes the dative: zum Arzt (zu dem), zur Post (zu der), zu Anna.'
  example: Ich gehe heute zu meiner Oma.
  exampleEn: I'm going to my grandma's today.
- id: bei
  lesson: de1-travel-dative
  term: bei
  pos: preposition
  meanings: ["at (someone's place or a company)", "at", "with", "near", "at the home of"]
  note: 'Always takes the dative: bei meinen Eltern, beim Arzt (bei dem).'
  example: Ich wohne bei meinen Eltern.
  exampleEn: I live with my parents.
- id: seit
  lesson: de1-travel-dative
  term: seit
  pos: preposition
  meanings: ["since (a point in time)", "since", "for (a period up to now)", "for"]
  note: 'Always takes the dative, with the present tense: Ich wohne seit einem Jahr hier.'
  example: Ich lerne seit drei Monaten Deutsch.
  exampleEn: I've been learning German for three months.
- id: nach-to
  lesson: de1-travel-dative
  term: nach
  pos: preposition
  meanings: ["to (a city or country)", "to"]
  note: 'Takes the dative. Used for towns and countries without an article: nach Berlin, nach Spanien; also nach Hause.'
  example: Im Sommer fahren wir nach Italien.
  exampleEn: In the summer we're going to Italy.
- id: nach-hause
  lesson: de1-travel-dative
  kind: phrase
  term: nach Hause
  pos: phrase
  meanings: ["home (going there)", "home", "to home", "homeward"]
  note: 'For going home. Being at home is zu Hause.'
  example: Ich gehe jetzt nach Hause.
  exampleEn: I'm going home now.
- id: wohin
  lesson: de1-travel-dative
  term: wohin
  pos: question word
  meanings: ["where to", "where"]
  example: Wohin fährst du im Urlaub?
  exampleEn: Where are you going on holiday?

