  pos: adjective
  alt: ["gemuetlich"]
  meanings: ["cosy", "cozy", "comfortable", "snug", "homely", "relaxed"]
  example: Das Café ist klein und gemütlich.
  exampleEn: The café is small and cosy.
- id: zu-hause
  lesson: de1-home
  kind: phrase
  term: zu Hause
  pos: phrase
  alt: ["zuhause"]
  meanings: ["at home"]
  note: 'Being at home. Going home is nach Hause.'
  example: Am Sonntag bin ich zu Hause.
  exampleEn: On Sunday I'm at home.
- id: auf
  lesson: de1-home
  term: auf
  pos: preposition
  meanings: ["on (top of)", "on", "on top of", "onto"]
  note: 'Two-way preposition: Wo? + dative (auf dem Tisch).'
  example: Das Handy ist auf dem Tisch.
  exampleEn: The mobile is on the table.
- id: an
  lesson: de1-home
  term: an
  pos: preposition
  meanings: ["on (a wall or vertical surface)", "on", "at", "by", "next to"]
  note: 'Two-way preposition: Wo? + dative (an der Wand, am Fenster).'
  example: Die Uhr ist an der Wand.
  exampleEn: The clock is on the wall.
- id: unter
  lesson: de1-home
  term: unter
  pos: preposition
  meanings: ["under", "below", "underneath", "beneath"]
  note: 'Two-way preposition: Wo? + dative (unter dem Bett).'
  example: Der Hund ist unter dem Tisch.
  exampleEn: The dog is under the table.
- id: ueber
  lesson: de1-home
  term: über
  pos: preposition
  meanings: ["over (above)", "over", "above", "about", "across"]
  note: 'Two-way preposition: Wo? + dative (über dem Sofa). Also means about: ein Buch über Berlin.'
  example: Die Lampe ist über dem Tisch.
  exampleEn: The lamp is above the table.
- id: neben
  lesson: de1-home
  term: neben
  pos: preposition
  meanings: ["next to", "beside", "by"]
  note: 'Two-way preposition: Wo? + dative (neben dem Schrank).'
  example: Das Bad ist neben der Küche.
  exampleEn: The bathroom is next to the kitchen.
- id: zwischen
  lesson: de1-home
  term: zwischen
  pos: preposition
  meanings: ["between", "among"]
  note: 'Two-way preposition: Wo? + dative (zwischen dem Sofa und dem Regal).'
  example: Die Apotheke ist zwischen der Bank und dem Café.
  exampleEn: The pharmacy is between the bank and the café.
- id: hinter
  lesson: de1-home
  term: hinter
  pos: preposition
  meanings: ["behind", "at the back of", "in back of"]
  note: 'Two-way preposition: Wo? + dative (hinter dem Haus).'
  example: Der Garten ist hinter dem Haus.
  exampleEn: The garden is behind the house.
- id: ihn
  lesson: de1-home
  term: ihn
  pos: pronoun
  meanings: ["him (accusative)", "him", "it (masculine object)", "it"]
  note: 'Accusative of er. For masculine things too: Der Schrank? Ich finde ihn schön.'
  example: Der Tisch ist neu. Wie findest du ihn?
  exampleEn: The table is new. What do you think of it?

