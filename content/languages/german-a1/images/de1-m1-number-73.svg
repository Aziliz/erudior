<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="520" height="250" role="img"><title>How 73 is read in German: first the 3 (drei), then und, then the 70 (siebzig)</title><rect x="0" y="0" width="520" height="250" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><text x="200" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#1c2833" text-anchor="middle">7</text><text x="260" y="95" font-family="sans-serif" font-size="80" font-weight="bold" fill="#1c2833" text-anchor="middle">3</text><rect x="60" y="150" width="120" height="46" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="120" y="180" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1c2833" text-anchor="middle">drei</text><rect x="200" y="150" width="120" height="46" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="260" y="180" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1c2833" text-anchor="middle">und</text><rect x="340" y="150" width="120" height="46" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="400" y="180" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1c2833" text-anchor="middle">siebzig</text><path d="M 255 100 C 220 125 150 120 125 146" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><path d="M 205 100 C 260 130 360 115 395 146" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><circle cx="70" cy="150" r="13" fill="#1c2833"/><text x="70" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><circle cx="210" cy="150" r="13" fill="#1c2833"/><text x="210" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><circle cx="350" cy="150" r="13" fill="#1c2833"/><text x="350" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="260" y="232" font-family="sans-serif" font-size="18" font-weight="normal" fill="#1c2833" text-anchor="middle">73 = dreiundsiebzig (one word)</text></svg>