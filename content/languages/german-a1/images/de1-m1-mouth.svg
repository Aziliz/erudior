d palate</text><text x="221" y="144" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">ch in ich, nicht</text><line x1="334" y1="196" x2="400" y2="118" stroke="#1c2833" stroke-width="1.5"/><circle cx="334" cy="196" r="3.5" fill="#1c2833"/><text x="406" y="123" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">Soft palate</text><text x="406" y="142" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">ch in ach, Nacht</text><line x1="364" y1="232" x2="440" y2="250" stroke="#1c2833" stroke-width="1.5"/><circle cx="364" cy="232" r="3.5" fill="#1c2833"/><text x="446" y="255" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">Uvula</text><text x="446" y="274" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">German r: richtig</text><line x1="140" y1="241" x2="60" y2="330" stroke="#1c2833" stroke-width="1.5"/><circle cx="140" cy="241" r="3.5" fill="#1c2833"/><text x="66" y="335" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">Lips</text><text x="66" y="354" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="start">round for ü, ö</text><text x="60" y="425" font-family="sans-serif" font-size="14" fill="#1c2833">Simplified side view</text></svg>