<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img"><title>gern, lieber, am liebsten as three steps</title><rect width="720" height="340" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="60" y="200" width="190" height="100" fill="#f7ebcf" stroke-width="2.5"/><text x="155" y="234" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">gern</text><text x="155" y="260" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">like doing</text><text x="155" y="186" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Ich schwimme gern.</text><rect x="270" y="140" width="190" height="160" fill="#dde8f3" stroke-width="2.5"/><text x="365" y="174" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">lieber</text><text x="365" y="200" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">prefer</text><text x="365" y="126" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Ich jogge lieber.</text><rect x="480" y="80" width="190" height="220" fill="#dcf0e3" stroke-width="2.5"/><text x="575" y="114" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">am liebsten</text><text x="575" y="140" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">like most of all</text><text x="575" y="66" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Am liebsten tanze ich.</text><path d="M30 300 L690 300" stroke-width="3"/><path d="M60 318 L660 318" stroke-width="2"/><path d="M648 310 L662 318 L648 326" stroke-width="2"/><text x="360" y="336" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">how much you like it</text></g></svg>