<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img"><title>gern, lieber, am liebsten as three steps</title><rect width="720" height="340" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="60" y="240" width="190" height="60" fill="#f7ebcf" stroke-width="2.5"/><text x="155" y="274" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">gern</text><text x="155" y="300" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">like doing</text><text x="155" y="226" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Ich schwimme gern.</text><rect x="270" y="170" width="190" height="130" fill="#dde8f3" stroke-width="2.5"/><text x="365" y="204" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">lieber</text><text x="365" y="230" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">prefer</text><text x="365" y="156" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Ich jogge lieber.</text><rect x="480" y="100" width="190" height="200" fill="#dcf0e3" stroke-width="2.5"/><text x="575" y="134" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">am liebsten</text><text x="575" y="160" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none">like most of all</text><text x="575" y="86" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833" stroke="none" font-style="italic">Am liebsten tanze ich.</text><path d="M30 300 L690 300" stroke-width="3"/><path d="M60 322 L660 322" stroke-width="2"/><path d="M648 314 L662 322 L648 330" stroke-width="2"/></g></svg>