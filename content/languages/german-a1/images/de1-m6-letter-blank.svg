<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" role="img"><title>A formal German letter: sender's address, recipient's address, place and date, subject line, salutation, text, closing, signature and typed name</title><rect x="0" y="0" width="640" height="760" fill="#ffffff"/><rect x="60" y="15" width="520" height="730" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="90" y="55" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Paul Novak</text><text x="90" y="75" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Gartenweg 4</text><text x="90" y="95" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">28195 Bremen</text><text x="90" y="160" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Sprachschule am Markt</text><text x="90" y="181" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Frau Berger</text><text x="90" y="202" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Marktplatz 7</text><text x="90" y="223" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">28195 Bremen</text><text x="550" y="262" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">Bremen, 12. Mai 2026</text><text x="90" y="312" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Kurs am Dienstag</text><text x="90" y="362" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Sehr geehrte Frau Berger,</text><text x="90" y="400" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ich habe am Dienstag um 10 Uhr einen Termin</text><text x="90" y="424" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">bei Ihnen. Leider kann ich nicht kommen,</text><text x="90" y="448" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">denn ich bin krank. Haben Sie am Freitag Zeit?</text><text x="90" y="472" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Bitte schicken Sie mir eine Nachricht.</text><text x="90" y="530" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Mit freundlichen Grüßen</text><path d="M95 590 c12 -30 22 -30 16 0 c-3 14 10 -18 20 -8 c8 8 12 -12 22 -4 c10 8 14 -10 26 -2 c8 4 16 -6 26 -2 l50 -8" fill="none" stroke="#1c2833" stroke-width="1.8"/><text x="90" y="625" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Paul Novak</text></svg>