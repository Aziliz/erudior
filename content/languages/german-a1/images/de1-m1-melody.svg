<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img"><title>Sentence melody: statements and W-questions fall at the end, yes/no questions rise</title><rect x="0" y="0" width="600" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><path d="M 30 50 L 180 50 Q 220 50 240 72" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="86" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Du wohnst in Berlin.</text><text x="300" y="74" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">statement: falls</text><path d="M 30 135 L 185 135 Q 225 135 245 113" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="171" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Wohnst du in Berlin?</text><text x="300" y="159" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">yes/no question: rises</text><path d="M 30 220 L 120 220 Q 160 220 180 242" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="256" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Wo wohnst du?</text><text x="300" y="244" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">W-question: usually falls</text></svg>