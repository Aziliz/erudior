<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img"><title>Sentence melody: statements and W-questions fall at the end, yes/no questions rise</title><rect x="0" y="0" width="640" height="300" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><path d="M 30 52 C 200 40 330 46 380 78" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="90" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Du wohnst in Berlin.</text><path d="M 30 142 C 200 150 300 146 380 108" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="180" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Wohnst du in Berlin?</text><path d="M 30 232 C 120 222 200 226 250 258" fill="none" stroke="#2f6fa8" stroke-width="3" marker-end="url(#ah)"/><text x="30" y="270" font-family="sans-serif" font-size="20" font-weight="normal" fill="#1c2833" text-anchor="start">Wo wohnst du?</text><text x="470" y="85" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">statement: falls</text><text x="470" y="175" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">yes/no question:</text><text x="470" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">rises</text><text x="470" y="265" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">W-question:</text><text x="470" y="285" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="start">usually falls</text></svg>