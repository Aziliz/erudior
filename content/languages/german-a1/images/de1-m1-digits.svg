<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img"><title>Handwritten 1 and 7 as often written in Germany (1 with a long upstroke, 7 with a crossbar) and in the US</title><rect x="0" y="0" width="640" height="300" fill="#ffffff"/><text x="150" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle">Often written in Germany</text><text x="470" y="34" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle">Often written in the US</text><line x1="320" y1="20" x2="320" y2="200" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M 80 110 L 120 60 L 120 160" fill="none" stroke="#1c2833" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 170 62 L 220 62 L 185 160" fill="none" stroke="#1c2833" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 182 112 L 214 112" fill="none" stroke="#1c2833" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 420 60 L 420 160" fill="none" stroke="#1c2833" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 490 62 L 540 62 L 505 160" fill="none" stroke="#1c2833" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="190" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">1</text><text x="195" y="190" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">7</text><text x="420" y="190" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">1</text><text x="515" y="190" font-family="sans-serif" font-size="15" font-weight="normal" fill="#1c2833" text-anchor="middle">7</text><text x="320" y="236" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">A German 1 can look like an American 7,</text><text x="320" y="258" font-family="sans-serif" font-size="16" font-weight="normal" fill="#1c2833" text-anchor="middle">so Germans cross the 7.</text></svg>