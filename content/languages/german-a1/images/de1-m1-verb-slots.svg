<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" height="350" role="img"><title>Where the verb goes: second in statements and W-questions, first in yes/no questions</title><rect x="0" y="0" width="680" height="350" fill="#ffffff"/><text x="215" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="middle">Position 1</text><text x="350" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="middle">Position 2</text><text x="540" y="40" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="middle">rest of the sentence</text><text x="20" y="93" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="start">Statement</text><rect x="160" y="68" width="110" height="40" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="215" y="94" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">Ich</text><rect x="295" y="68" width="110" height="40" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="350" y="94" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">arbeite</text><text x="425" y="94" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="start">heute in Köln.</text><text x="20" y="159" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="start">Time word first</text><rect x="160" y="134" width="110" height="40" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="215" y="160" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">Heute</text><rect x="295" y="134" width="110" height="40" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="350" y="160" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">arbeite</text><text x="425" y="160" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="start">ich in Köln.</text><text x="20" y="225" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="start">W-question</text><rect x="160" y="200" width="110" height="40" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="215" y="226" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">Wo</text><rect x="295" y="200" width="110" height="40" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="350" y="226" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">arbeitest</text><text x="425" y="226" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="start">du heute?</text><text x="20" y="291" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1c2833" text-anchor="start">Yes/no question</text><rect x="160" y="266" width="110" height="40" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="215" y="292" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">Arbeitest</text><rect x="295" y="266" width="110" height="40" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="350" y="292" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="middle">du</text><text x="425" y="292" font-family="sans-serif" font-size="17" font-weight="normal" fill="#1c2833" text-anchor="start">heute in Köln?</text><rect x="160" y="325" width="18" height="14" rx="3" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="186" y="337" font-family="sans-serif" font-size="14" font-weight="normal" fill="#1c2833" text-anchor="start">= the conjugated verb</text></svg>