<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"><title>Word order after conjunctions: denn and aber stand in position 0 and the verb stays in position 2; deshalb takes position 1 itself</title><rect x="0" y="0" width="700" height="330" fill="#ffffff"/><text x="110" y="34" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Position 0</text><text x="245" y="34" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Position 1</text><text x="375" y="34" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Position 2</text><text x="560" y="34" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">rest</text><text x="20" y="62" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">Ich komme heute nicht,</text><rect x="50" y="70" width="120" height="42" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="110" y="97" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">denn</text><rect x="185" y="70" width="120" height="42" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="245" y="97" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">ich</text><rect x="320" y="70" width="110" height="42" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="375" y="97" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">bin</text><text x="450" y="97" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">krank.</text><text x="20" y="147" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">Gestern war ich müde,</text><rect x="50" y="155" width="120" height="42" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="110" y="182" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">aber</text><rect x="185" y="155" width="120" height="42" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="245" y="182" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">heute</text><rect x="320" y="155" width="110" height="42" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="375" y="182" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">habe</text><text x="450" y="182" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ich Zeit.</text><text x="20" y="232" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">Ich bin krank.</text><rect x="50" y="240" width="120" height="42" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="5 4"/><text x="110" y="267" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">(empty)</text><rect x="185" y="240" width="120" height="42" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="245" y="267" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Deshalb</text><rect x="320" y="240" width="110" height="42" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="375" y="267" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">komme</text><text x="450" y="267" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ich nicht.</text><rect x="20" y="300" width="18" height="14" rx="3" fill="#e8e2f3" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="312" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">und, oder, aber, denn, sondern</text><rect x="330" y="300" width="18" height="14" rx="3" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="356" y="312" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">= the verb, still in position 2</text></svg>