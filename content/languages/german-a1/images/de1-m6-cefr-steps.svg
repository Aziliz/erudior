<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img"><title>The six CEFR levels as a staircase: A1 and A2 (basic user), B1 and B2 (independent user), C1 and C2 (proficient user); you are at A1</title><rect x="0" y="0" width="700" height="360" fill="#ffffff"/><rect x="40" y="230" width="100" height="40" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="90.0" y="258" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">A1</text><rect x="140" y="198" width="100" height="72" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="190.0" y="226" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">A2</text><rect x="240" y="166" width="100" height="104" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="290.0" y="194" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">B1</text><rect x="340" y="134" width="100" height="136" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="390.0" y="162" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">B2</text><rect x="440" y="102" width="100" height="168" rx="0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="490.0" y="130" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">C1</text><rect x="540" y="70" width="100" height="200" rx="0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="590.0" y="98" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">C2</text><path d="M46 278 L46 290 L234 290 L234 278" fill="none" stroke="#1c2833" stroke-width="2"/><text x="140.0" y="314" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">basic user</text><path d="M246 278 L246 290 L434 290 L434 278" fill="none" stroke="#1c2833" stroke-width="2"/><text x="340.0" y="314" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">independent user</text><path d="M446 278 L446 290 L634 290 L634 278" fill="none" stroke="#1c2833" stroke-width="2"/><text x="540.0" y="314" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">proficient user</text><path d="M90 150 L90 220" fill="none" stroke="#1c2833" stroke-width="2.5"/><path d="M82 208 L90 222 L98 208" fill="none" stroke="#1c2833" stroke-width="2.5"/><text x="90" y="142" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">You are here</text><text x="40" y="345" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">Each step builds on the one before it.</text></svg>