<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img"><title>How the simple past of a modal verb is built: können loses its umlaut, adds -te, and takes the endings -, -st, -, -n, -t, -n</title><rect x="0" y="0" width="700" height="360" fill="#ffffff"/><rect x="20" y="20" width="150" height="46" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="95" y="50" font-family="sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">können</text><path d="M172 43 L232 43" fill="none" stroke="#1c2833" stroke-width="2"/><path d="M222 36 L234 43 L222 50" fill="none" stroke="#1c2833" stroke-width="2"/><text x="201" y="30" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">no umlaut</text><rect x="236" y="20" width="110" height="46" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="291" y="50" font-family="sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">konn-</text><path d="M348 43 L408 43" fill="none" stroke="#1c2833" stroke-width="2"/><path d="M398 36 L410 43 L398 50" fill="none" stroke="#1c2833" stroke-width="2"/><text x="378" y="30" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">+ te</text><rect x="412" y="20" width="130" height="46" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="477" y="50" font-family="sans-serif" font-size="19" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><text x="60" y="126" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ich</text><rect x="200" y="100" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="125" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="100" width="44" height="36" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="1.2" stroke-dasharray="4 3"/><text x="60" y="168" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">du</text><rect x="200" y="142" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="167" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="142" width="44" height="36" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="336" y="167" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">st</text><text x="60" y="210" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">er / sie / es</text><rect x="200" y="184" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="209" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="184" width="44" height="36" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="1.2" stroke-dasharray="4 3"/><text x="60" y="252" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">wir</text><rect x="200" y="226" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="251" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="226" width="44" height="36" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="336" y="251" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">n</text><text x="60" y="294" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ihr</text><rect x="200" y="268" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="293" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="268" width="44" height="36" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="336" y="293" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">t</text><text x="60" y="336" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">sie / Sie</text><rect x="200" y="310" width="110" height="36" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="255" y="335" font-family="sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">konnte</text><rect x="314" y="310" width="44" height="36" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="336" y="335" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">n</text><text x="390" y="130" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Same pattern:</text><text x="390" y="160" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">müssen → musste</text><text x="390" y="188" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">dürfen → durfte</text><text x="390" y="216" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">wollen → wollte</text><text x="390" y="244" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">sollen → sollte</text><text x="390" y="272" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">mögen → mochte</text><text x="390" y="318" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">ich and er: no ending</text></svg>