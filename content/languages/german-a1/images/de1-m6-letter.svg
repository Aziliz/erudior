<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 690" width="800" height="690" role="img"><title>A formal German letter: sender's address, recipient's address, place and date, subject line, salutation, text, closing, signature and typed name</title><rect x="0" y="0" width="800" height="690" fill="#ffffff"/><rect x="60" y="15" width="520" height="660" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="110" y="55" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Paul Novak</text><text x="110" y="75" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Gartenweg 4</text><text x="110" y="95" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">28195 Bremen</text><text x="110" y="160" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Sprachschule am Markt</text><text x="110" y="181" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Frau Berger</text><text x="110" y="202" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Marktplatz 7</text><text x="110" y="223" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">28195 Bremen</text><text x="550" y="262" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">Bremen, 12. Mai 2026</text><text x="110" y="312" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Kurs am Dienstag</text><text x="110" y="362" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Sehr geehrte Frau Berger,</text><text x="110" y="400" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">ich habe am Dienstag um 10 Uhr einen Termin</text><text x="110" y="424" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">bei Ihnen. Leider kann ich nicht kommen,</text><text x="110" y="448" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">denn ich bin krank. Haben Sie am Freitag Zeit?</text><text x="110" y="472" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Bitte schicken Sie mir eine Nachricht.</text><text x="110" y="530" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Mit freundlichen Grüßen</text><path d="M115 590 c12 -30 22 -30 16 0 c-3 14 10 -18 20 -8 c8 8 12 -12 22 -4 c10 8 14 -10 26 -2 c8 4 16 -6 26 -2 l50 -8" fill="none" stroke="#1c2833" stroke-width="1.8"/><text x="110" y="625" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Paul Novak</text><line x1="212" y1="70" x2="596" y2="70" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="212" cy="70" r="3" fill="#1c2833"/><rect x="600" y="55" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="74" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Absender</text><line x1="290" y1="190" x2="596" y2="190" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="290" cy="190" r="3" fill="#1c2833"/><rect x="600" y="175" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="194" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Empfänger</text><line x1="558" y1="257" x2="596" y2="257" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="558" cy="257" r="3" fill="#1c2833"/><rect x="600" y="242" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="261" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Ort und Datum</text><line x1="262" y1="307" x2="596" y2="307" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="262" cy="307" r="3" fill="#1c2833"/><rect x="600" y="292" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="311" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Betreff</text><line x1="298" y1="357" x2="596" y2="357" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="298" cy="357" r="3" fill="#1c2833"/><rect x="600" y="342" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="361" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Anrede</text><line x1="290" y1="525" x2="596" y2="525" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="290" cy="525" r="3" fill="#1c2833"/><rect x="600" y="510" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="529" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Grußformel</text><line x1="300" y1="582" x2="596" y2="582" stroke="#1c2833" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="300" cy="582" r="3" fill="#1c2833"/><rect x="600" y="567" width="180" height="26" rx="5" fill="#dde8f3" stroke="#1c2833" stroke-width="1.3"/><text x="690" y="586" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Unterschrift</text></svg>