# German A1, module 5 honors lessons (round 2)
- term: nominal style
  aliases: [Nominalstil, noun style]
  definition: 'Writing with nouns made from verbs instead of full sentences, as on signs, boards and announcements: die Abfahrt (from abfahren), die Ankunft (from ankommen), der Ausstieg (from aussteigen), der Eingang (from eingehen). Nächster Halt: Hauptbahnhof. Ausstieg links. -fahrt nouns are feminine; -stieg and -gang nouns are masculine.'
  topic: Nominal style
