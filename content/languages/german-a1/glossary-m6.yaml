# Module 6 glossary (lessons 21–24)
- term: perfect tense
  aliases: [perfect, Perfekt, present perfect, conversational past]
  definition: 'The main past tense of spoken German, made of a present-tense form of haben or sein (the auxiliary, in position 2) and a past participle at the end of the sentence: Ich habe gegessen, Wir sind gefahren. It translates both "I ate" and "I have eaten".'
  topic: Perfect tense
- term: auxiliary verb
  aliases: [auxiliary verbs, auxiliary, helping verb, Hilfsverb]
  definition: 'A helper verb that combines with another verb to form a tense. In the German perfect the auxiliary is haben or sein; it takes the person ending and stands in position 2, while the main verb goes to the end as a participle.'
  topic: Perfect tense
- term: past participle
  aliases: [past participles, participle, participles, Partizip II, Partizip]
  definition: 'The form of a verb used in the perfect tense, placed at the end of the sentence. It never changes its ending. Most have ge- at the front and end in -t (gemacht) or -en (gesehen); separable verbs put -ge- after the prefix (eingekauft), and verbs in -ieren or with an inseparable prefix have no ge- (studiert, besucht).'
  topic: Perfect tense
- term: weak verb
  aliases: [weak verbs, regular verb, regular verbs]
  definition: 'A regular verb whose stem stays the same in all forms. Its past participle is ge- + stem + -t: machen → gemacht, kaufen → gekauft, arbeiten → gearbeitet. Most German verbs are weak.'
  topic: Perfect tense
- term: strong verb
  aliases: [strong verbs, irregular verb, irregular verbs]
  definition: 'A verb whose past participle ends in -en, often with a changed vowel: sehen → gesehen, trinken → getrunken, schreiben → geschrieben. Strong participles have to be learned with the verb.'
  topic: Perfect tense
- term: mixed verb
  aliases: [mixed verbs]
  definition: 'A verb that changes its vowel like a strong verb but ends in -t like a weak verb in the past participle. At A1: bringen → gebracht, denken → gedacht, kennen → gekannt, wissen → gewusst.'
  topic: Perfect tense
- term: inseparable prefix
  aliases: [inseparable prefixes, inseparable verb, inseparable verbs]
  definition: 'A prefix that always stays attached to its verb and is never stressed, such as be-, ver-, er-, ent- and ge-. Verbs with an inseparable prefix take no ge- in the past participle: besuchen → besucht, verlieren → verloren, erzählen → erzählt.'
  topic: Perfect tense
- term: simple past
  aliases: [Präteritum, preterite, simple past tense, imperfect]
  definition: 'A one-word past tense, used mainly in writing. In spoken German you need it at A1 only for sein and haben, where it is more common than the perfect: ich war, du warst (was, were); ich hatte, du hattest (had).'
  topic: Past tense
- term: conjunction
  aliases: [conjunctions, coordinating conjunction, coordinating conjunctions, Konjunktion]
  definition: 'A word that joins words or sentences. The coordinating conjunctions und, oder, aber, denn and sondern stand in position zero and do not change the word order of the sentence after them: Ich bleibe hier, denn ich bin müde.'
  topic: Conjunctions
- term: position zero
  aliases: [Position 0, position 0]
  definition: 'The slot in front of a sentence where und, oder, aber, denn and sondern stand. A word there does not count as position 1, so the next element is position 1 and the verb is still in position 2: …, aber heute habe ich Zeit.'
  topic: Conjunctions
