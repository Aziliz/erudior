# German A1, module 5 glossary terms (lessons 17–20)
- term: imperative
  aliases: [imperatives, Imperativ, command form]
  definition: 'The verb form for telling or asking someone to do something. German has one for each kind of "you", always with the verb first: du (Geh! Nimm!), ihr (Geht! Nehmt!) and Sie (Gehen Sie! Nehmen Sie!). The du form is the present-tense du form without du and its -st ending; the Sie form keeps Sie. Add bitte to sound polite.'
  topic: Verbs
- term: dative
  aliases: [dative case, Dativ]
  definition: 'The third German case, after the nominative and accusative. It is used after the prepositions aus, bei, mit, nach, seit, von, zu, after in, an, auf and similar prepositions when they say where something is, and for the indirect object (the person who receives something). Articles: dem/einem (masculine and neuter), der/einer (feminine), den (plural, and the noun adds -n).'
  topic: Cases
- term: contraction
  aliases: [contractions, contracted form]
  definition: 'A preposition and an article fused into one word: zum (zu dem), zur (zu der), vom (von dem), beim (bei dem), im (in dem), am (an dem), ins (in das). The short forms are the normal ones in speech and writing.'
  topic: Prepositions
- term: two-way preposition
  aliases: [two-way prepositions, Wechselpräposition, Wechselpräpositionen]
  definition: 'One of nine prepositions (in, an, auf, unter, über, neben, zwischen, hinter, vor) that take the dative for location (Wo? Das Buch ist auf dem Tisch) and the accusative for movement to a place (Wohin? Ich lege das Buch auf den Tisch). At A1 you mainly need the location use.'
  topic: Prepositions
- term: accusative pronoun
  aliases: [accusative pronouns, object pronoun, object pronouns]
  definition: 'A personal pronoun used as the direct object: mich, dich, ihn, sie, es, uns, euch, sie, Sie. Only mich, dich, ihn, uns and euch differ from the subject forms. Example: Verstehen Sie mich?'
  topic: Pronouns
- term: dative pronoun
  aliases: [dative pronouns]
  definition: 'A personal pronoun in the dative: mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen. Used after dative prepositions (mit mir), with verbs like helfen (Kannst du mir helfen?), in set phrases (Wie geht es dir? Mir ist kalt) and for the indirect object.'
  topic: Pronouns
- term: indirect object
  aliases: [indirect objects]
  definition: 'The person who receives something or to whom something is done, as in "Give me the book", where me is the indirect object and the book is the direct object. In German the indirect object is in the dative: Gib mir das Buch.'
  topic: Cases
