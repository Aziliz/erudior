# Round 2 glossary for de1-m6 (honors lessons 24h1 and 24h2)
- term: double infinitive
  aliases: [double infinitives, Ersatzinfinitiv]
  definition: 'Two infinitives together at the end of a sentence, as in the perfect of a modal verb: Ich habe arbeiten müssen (I had to work). It is correct but heavy, so in speech Germans usually use the simple past of the modal instead: Ich musste arbeiten.'
  topic: Simple past of modals
- term: register
  aliases: [registers, level of formality, formality]
  definition: 'How formal a text or a way of speaking is. In German letters and e-mails the register shows in the opening (Sehr geehrte … / Liebe … / Hallo …), the closing (Mit freundlichen Grüßen … Liebe Grüße) and the choice of Sie or du.'
  topic: Register
- term: salutation
  aliases: [salutations, Anrede, opening line, letter opening]
  definition: 'The opening line of a letter or e-mail, followed by a comma: Sehr geehrte Frau Berger, / Liebe Anna, / Hallo zusammen,. The text after it starts with a small letter.'
  topic: Letters and e-mails
- term: sign-off
  aliases: [sign-offs, closing formula, complimentary close, Grußformel]
  definition: 'The closing words of a letter or e-mail, before your name, with no comma after them: Mit freundlichen Grüßen (formal), Viele Grüße (neutral), Liebe Grüße (warm).'
  topic: Letters and e-mails
