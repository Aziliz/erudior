id: lang-german-a1
title: German A1
description: >-
  German from your first word to CEFR level A1, the level of the Goethe-Zertifikat A1:
  Start Deutsch 1. Grammar lessons cover sounds and spelling, greetings, numbers, the
  present tense, articles and plurals, the accusative and a first look at the dative,
  modal and separable verbs, the imperative and the perfect tense. About 700 everyday
  words are learned through typed vocabulary reviews with pronunciation, and a reading
  list points to graded readers you can try on your own.
