# German A1, round 2, module de1-m3 notecards (honors lessons 12h1 and 12h2)
# --- 12h1 food culture ---
- {front: 'Ich hätte gern …', back: 'I''d like … (the most polite way to order). Takes the accusative: Ich hätte gern einen Kaffee.', topic: Polite requests}
- {front: 'hätte gern: the forms', back: 'ich hätte, du hättest, er/sie/es hätte, wir/sie/Sie hätten … gern', topic: Polite requests}
- {front: 'Another coffee, please!', back: 'Noch einen Kaffee, bitte! (noch + accusative article)', topic: Polite requests}
- {front: 'No more coffee, thanks.', back: 'Ich möchte keinen Kaffee mehr, danke. (kein … mehr)', topic: Polite requests}
- {front: 'Traditional German meals (simplified)', back: 'Frühstück; Mittagessen (often the warm meal); Kaffee und Kuchen (afternoon, especially Sundays); Abendbrot (cold supper with bread)', topic: Food culture}
- {front: 'Guten Appetit!', back: 'Enjoy your meal! Answer: Danke, gleichfalls!', topic: Food culture}
- {front: 'Mahlzeit!', back: 'Literally "mealtime": a lunchtime greeting between colleagues at work.', topic: Food culture}
- {front: 'I''m full (after eating)', back: 'Ich bin satt. (Not: Ich bin voll, which can mean "I''m drunk".)', topic: Food culture}
- {front: 'Regional words for the bread roll', back: 'Brötchen (standard, north and centre), Semmel (Bavaria, Austria, Saxony), Schrippe (Berlin), Weck/Weckle (southwest), Rundstück (Hamburg)', topic: Food culture}
- {front: 'Austrian food words', back: 'Erdapfel = Kartoffel, Paradeiser = Tomate, Schlagobers = Sahne, Topfen = Quark, Semmel = Brötchen', topic: Food culture}
- {front: 'Stimmt so.', back: 'Keep the change. Said when you hand over money that already includes the tip.', topic: Food culture}
- {front: 'How to tip in a German café', back: 'Round up or add about 5–10 %, and tell the server the total you want to pay (Acht Euro vierzig, bitte) instead of leaving coins on the table.', topic: Food culture}
# --- 12h2 planning the week ---
- {front: 'montags, abends, nachts', back: 'every Monday, every evening, every night (small letter, -s). am Montag = on (one) Monday.', topic: Time expressions}
- {front: 'Accusative of time', back: 'No preposition: jeden Tag, nächsten Montag, diese Woche, den ganzen Tag, nächstes Jahr', topic: Time expressions}
- {front: 'next week / next Monday / next year', back: 'nächste Woche / nächsten Montag / nächstes Jahr', topic: Time expressions}
- {front: 'How long? dauern', back: 'Wie lange dauert das? – Es dauert eine Stunde / einen Tag / zwei Wochen. (accusative, no für)', topic: Time expressions}
- {front: 'around eight / shortly after eight / eight on the dot', back: 'gegen acht / kurz nach acht / Punkt acht', topic: Time expressions}
- {front: 'Frequency scale', back: 'immer → meistens → oft → manchmal → selten → nie', topic: Time expressions}
- {front: 'once a week / twice a day', back: 'einmal pro Woche (einmal die Woche) / zweimal am Tag', topic: Time expressions}
- {front: 'Two time phrases in one sentence', back: 'General before specific: morgen um acht, am Freitag gegen sieben. Time usually before place.', topic: Time expressions}
- {front: 'geöffnet / geschlossen / Ruhetag', back: 'open / closed / a restaurant''s or café''s weekly closing day (Montag Ruhetag)', topic: Opening hours}
- {front: 'Reading Mo–Fr 8–18 Uhr', back: 'Montag bis Freitag von acht bis achtzehn Uhr', topic: Opening hours}
- {front: 'Shops on Sundays in Germany', back: 'Most are closed (rules set by each state); bakeries may open a few hours, and shops at stations, airports and petrol stations stay open.', topic: Opening hours}
