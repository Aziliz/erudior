# German A1, module 2 honors lessons (round 2): notecards
# --- 08h1 People and gender ---
- {front: 'das Mädchen: which gender, and why?', back: 'Neuter, because nouns in -chen are always neuter. Textbook pronoun: es (Das Mädchen heißt Lea. Es ist zehn.); sie is common in speech.', topic: People and gender}
- {front: 'die Person, der Mensch, das Kind: does the article change with the person?', back: 'No. The article belongs to the word: die Person and der Mensch for everyone, das Kind for every child.', topic: People and gender}
- {front: 'Female job title: the main rule', back: 'Add -in: der Lehrer → die Lehrerin. Some words also take an umlaut: der Arzt → die Ärztin, der Koch → die Köchin.', topic: Jobs}
- {front: 'Female job title for a word in -e (der Kollege)', back: 'Drop the -e, add -in: die Kollegin. Likewise der Kunde → die Kundin.', topic: Jobs}
- {front: 'Female job title for a word in -mann (der Kaufmann)', back: '-mann becomes -frau: die Kauffrau, die Feuerwehrfrau. A mixed group: die Kaufleute, die Feuerwehrleute.', topic: Jobs}
- {front: 'Plural of a job title in -in', back: 'Add -nen (double n): die Lehrerinnen, die Ärztinnen, die Köchinnen.', topic: Jobs}
- {front: 'Generic masculine', back: 'The masculine form used for a mixed group or any person: die Lehrer. Traditional and very common; critics say it makes readers think of men.', topic: People and gender}
- {front: 'Paired form', back: 'Both forms named: Lehrerinnen und Lehrer, Liebe Kolleginnen und Kollegen. Accepted everywhere: the safe choice for letters and exams.', topic: People and gender}
- {front: 'Lehrer*innen, Lehrer:innen, Lehrer_innen, LehrerInnen', back: 'Gender star, colon, underscore, capital I: signs meant to include everyone. Read with a short break before -innen. Not part of official spelling (decision of 2023).', topic: People and gender}
- {front: 'Neutral words for groups', back: 'die Lehrkräfte (teaching staff), die Studierenden (those studying), das Team.', topic: People and gender}
- {front: '(m/w/d) in a job advert', back: 'männlich, weiblich, divers: male, female, diverse. The job is open to everyone.', topic: Jobs}
- {front: 'die Lehrerinnen vs Lehrer*innen', back: 'die Lehrerinnen = female teachers only. Lehrer*innen = teachers of every gender.', topic: People and gender}
# --- 08h2 Families and names ---
- {front: 'Stief- vs Halb-', back: 'Stiefvater, Stiefmutter: your parent''s new husband or wife. Halbbruder, Halbschwester: you share one parent.', topic: Family}
- {front: 'getrennt vs geschieden', back: 'getrennt = separated (no longer living together); geschieden = divorced.', topic: Family}
- {front: 'der Zwilling, das Einzelkind', back: 'der Zwilling (die Zwillinge) = twin, masculine for girls too; das Einzelkind = only child.', topic: Family}
- {front: 'Twin sister in German, and why die?', back: 'die Zwillingsschwester: Zwilling + linking s + Schwester. The last part (die Schwester) decides the gender.', topic: Family}
- {front: 'Onkel, Tante, Cousin, Cousine, Neffe, Nichte, Enkel, Enkelin', back: 'uncle, aunt, cousin (m), cousin (f), nephew, niece, grandson, granddaughter.', topic: Family}
- {front: 'Vorname, Nachname, Spitzname', back: 'first name, last name (= Familienname on forms), nickname.', topic: Names and whose}
- {front: 'Müller, Schmidt, Schneider: where do these surnames come from?', back: 'Old job titles: miller, smith, tailor. Müller is the most common surname in Germany, Schmidt the second.', topic: Names and whose}
- {front: 'Anna''s brother', back: 'Annas Bruder: name + -s, no apostrophe, no article. In speech also: der Bruder von Anna.', topic: Names and whose}
- {front: 'Max''s sister / Jonas''s dog', back: 'Max'' Schwester, Jonas'' Hund: names ending in s, ss, ß, x or z take only an apostrophe. Or: die Schwester von Max, der Hund von Jonas.', topic: Names and whose}
- {front: 'Marriage names in Germany (since May 2025)', back: 'A shared surname, each keeps their own, or both use a double name (Müller-Schmidt). Children can get a double name from both parents.', topic: Names and whose}
