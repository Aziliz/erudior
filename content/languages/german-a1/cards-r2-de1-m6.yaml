# Round 2 cards for de1-m6 (honors lessons 24h1 and 24h2)
- {front: 'Simple past of a modal verb: how is it built?', back: 'Drop the umlaut and add -te: können → konnte, müssen → musste, dürfen → durfte. wollen → wollte, sollen → sollte.', topic: Simple past of modals}
- {front: 'konnte: all six forms', back: 'ich konnte, du konntest, er/sie/es konnte, wir konnten, ihr konntet, sie/Sie konnten (ich = er, no ending)', topic: Simple past of modals}
- {front: 'mögen in the simple past', back: 'mochte (g becomes ch): Ich mochte den Film. — I liked the film.', topic: Simple past of modals}
- {front: 'möchte in the past?', back: 'There is no past of möchte. Use wollte: Ich wollte einen Kaffee.', topic: Simple past of modals}
- {front: 'konnte or könnte?', back: 'konnte = could, was able to (past). könnte = could, would be able to (subjunctive, polite): Könnten Sie mir helfen?', topic: Simple past of modals}
- {front: '"I had to work" in spoken German', back: 'Ich musste arbeiten. (The perfect, Ich habe arbeiten müssen, is a double infinitive: correct but less common.)', topic: Simple past of modals}
- {front: 'Word order with a modal in the past', back: 'Same bracket as in the present: modal in position 2, infinitive at the end. Gestern musste ich lange arbeiten.', topic: Simple past of modals}
- {front: 'es gab', back: 'there was / there were (past of es gibt), + accusative: Es gab keinen Bus.', topic: Telling stories}
- {front: 'Other simple past forms common in speech', back: 'war, hatte, the modals (konnte, musste…), es gab, ich wusste, ich dachte', topic: Telling stories}
- {front: 'The three parts of a story in the past', back: 'Setting (war, hatte, modals) → events (perfect with zuerst, dann, plötzlich) → end (endlich, zum Schluss)', topic: Telling stories}
- {front: 'Parts of a formal German letter, top to bottom', back: 'Absender, Empfänger, Ort und Datum, Betreff, Anrede, Text, Grußformel, Unterschrift', topic: Letters and e-mails}
- {front: 'Date line in a German letter', back: 'Bremen, 12. Mai 2026 (day first, full stop after the day; older style: Bremen, den 12. Mai 2026)', topic: Letters and e-mails}
- {front: 'Betreff', back: 'The subject line: short and in bold; the word Betreff itself is usually left out in letters. In an e-mail, the subject field.', topic: Letters and e-mails}
- {front: 'Openings from formal to informal', back: 'Sehr geehrte/r … → Liebe/r Frau/Herr … → Hallo Frau/Herr … → Liebe/r or Hallo + first name', topic: Register}
- {front: 'Liebe Frau Weber: du or Sie?', back: 'Sie. As a rule, Frau/Herr + surname goes with Sie; a first name goes with du.', topic: Register}
- {front: 'Closings from formal to informal', back: 'Mit freundlichen Grüßen → Freundliche Grüße → Viele Grüße → Liebe Grüße (LG only in text messages; avoid MfG)', topic: Register}
- {front: 'Capital letters for "you" in writing', back: 'Sie, Ihnen, Ihr always capital. du, dein, ihr, euer: small, but may be capitalized in letters.', topic: Register}
- {front: 'Who offers du?', back: 'Traditionally the older or more senior person. If unsure, use Sie.', topic: Register}
- {front: 'Moin, Servus, Grüezi', back: 'Moin: hi in northern Germany (any time of day). Servus: informal hi/bye in Bavaria and Austria. Grüezi: polite hello in Switzerland.', topic: Register}
- {front: 'Closing a postcard to family', back: 'Dein Max (from a man or boy), Deine Mira (from a woman or girl)', topic: Letters and e-mails}
