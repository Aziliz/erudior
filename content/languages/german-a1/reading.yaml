# Reading list for German A1. Checked 2026-10-17 (publisher or retailer pages; see RESEARCH.md).
- title: Nicos Weg (A1)
  publisher: Deutsche Welle
  level: A1
  url: https://learngerman.dw.com/en/nicos-weg/c-36519789
  free: true
  note: A video course told as a story about Nico, newly arrived in Germany, with short texts and exercises for each episode. A good companion from the first lesson.
- title: Deutsch – warum nicht? Series 1
  publisher: Deutsche Welle and Goethe-Institut
  level: A1
  url: https://freelanguage.org/node/87262
  free: true
  note: An older audio course built around a student working in a hotel, with a lesson script for each episode. Some details are dated (prices are in Deutsche Mark).
- title: Leo & Co. – Die Neue (Stufe 1)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A1
  isbn: 978-3-12-674096-8
  url: https://www.klett-sprachen.de/die-neue-stufe-1/t-0/9783126740968
  note: A short graded reader set in a café, with audio. Leo & Co. is a long-running series for adult beginners; try it once you're about halfway through the course.
- title: Leo & Co. – Das schnelle Glück (Stufe 1)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A1
  isbn: 978-3-12-674098-2
  url: https://www.klett-sprachen.de/das-schnelle-glueck-stufe-1/t-0/9783126740982
  note: Four friends think they've won the lottery, and then the ticket goes missing.
- title: Leo & Co. – Ein Hundeleben (Stufe 1)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: A1
  isbn: 978-3-12-674099-9
  url: https://www.klett-sprachen.de/ein-hundeleben-stufe-1/t-0/9783126740999
  note: A dog-sitting job that lasts much longer than planned.
- title: Lese-Novelas – Tina, Hamburg
  author: Thomas Silvin
  publisher: Hueber
  level: A1
  isbn: 978-3-19-201022-4
  note: A very short novella written for adult beginners. The same series has Anna, Berlin; Eva, Wien; Franz, München and Claudia, Mallorca.
- title: Blinder Passagier (Stadt, Land, Fluss …)
  author: Andrea Maria Wagner
  publisher: Klett
  level: A1
  isbn: 978-3-12-557005-4
  url: https://klett-international.com/en/stadt-land-fluss/r-1/379
  note: A short adventure for younger readers with a free audio version, set in a real German region.
- title: Café in Berlin (Dino lernt Deutsch 1)
  author: André Klein
  level: A1
  url: https://www.goodreads.com/book/show/18806935
  note: Ten short stories about Dino, an Italian newcomer in Berlin, each with a word list and questions.
- title: Goethe-Zertifikat A1 practice tests (reading sections)
  publisher: Goethe-Institut
  level: A1
  url: https://www.goethe.de/de/spr/prf/ueb/pa1.html
  free: true
  note: The official model test and practice sets. The reading parts are short notes, signs and ads, exactly the kind of text the exam uses. Save these for the end of the course.
- title: Mein Weg nach Deutschland
  publisher: Goethe-Institut
  level: A1–B2
  url: https://www.goethe.de/prj/mwd/de/startseite.html
  free: true
  note: Free exercises and short texts about everyday life and work in Germany; filter by level A1.
- title: nachrichtenleicht
  publisher: Deutschlandfunk
  level: A2 (a stretch at the end of A1)
  url: https://www.nachrichtenleicht.de/
  free: true
  note: Short news articles in plain German with a glossary of harder words. Try one a week once you've finished the course.
