# --- 10 je … desto (sport, fitness, a healthy life) ---
- id: je
  lesson: de3-je-desto
  term: je
  pos: conjunction
  meanings: ['the (first "the" in "the more …, the better")', the more, the]
  example: Je mehr ich lerne, desto mehr weiß ich.
  exampleEn: The more I learn, the more I know.
  note: 'je + comparative, verb at the end; then desto/umso + comparative + verb. On its own je also means "each, per" (je 5 Euro) and "ever".'
- id: desto
  lesson: de3-je-desto
  term: desto
  pos: adverb
  meanings: ['the (second "the" in "the more …, the better")', the]
  example: Je früher, desto besser.
  exampleEn: The sooner the better.
  note: 'desto + comparative takes position 1, so the verb comes next: Je mehr ich übe, desto besser spreche ich.'
- id: umso
  lesson: de3-je-desto
  term: umso
  pos: adverb
  meanings: [all the (more), all the more, the, so much the]
  example: Das Spiel war schwer, umso schöner war der Sieg.
  exampleEn: The game was hard, so the win was all the sweeter.
  note: 'Same as desto in je … umso. Umso besser! = All the better!'
- id: bewegung
  lesson: de3-je-desto
  term: die Bewegung
  pos: noun
  plural: die Bewegungen
  meanings: [exercise, movement, motion]
  example: Ein bisschen Bewegung tut dir gut.
