# German B1, module 2: Reasons, goals and contrasts (lessons 06–10)

# --- 06 obwohl, trotzdem, zwar … aber (consumer choices, money) ---
- id: obwohl
  lesson: de3-obwohl
  term: obwohl
  pos: conjunction
  meanings: [although, even though, though]
  example: Ich kaufe das Handy, obwohl es teuer ist.
  exampleEn: I'm buying the phone although it's expensive.
  note: 'Verb at the end: obwohl ich wenig Geld habe.'
- id: zwar
  lesson: de3-obwohl
  term: zwar
  pos: adverb
  meanings: ['admittedly (… but)', admittedly, "it's true", indeed]
  example: Das Auto ist zwar alt, aber es fährt gut.
  exampleEn: The car may be old, but it runs well.
  note: 'Used with aber in the next clause: zwar … aber.'
- id: dennoch
  lesson: de3-obwohl
  term: dennoch
  pos: adverb
  meanings: [even so (formal), even so, nevertheless, all the same, still, yet]
  example: Die Preise sind gestiegen. Dennoch kaufen viele Leute mehr.
  exampleEn: Prices have gone up. Even so, many people are buying more.
  note: 'Like trotzdem but more formal. In position 1 the verb comes next.'
- id: jedoch
  lesson: de3-obwohl
  term: jedoch
  pos: adverb
  meanings: [however, but, though]
  example: Das Angebot war gut, die Qualität jedoch nicht.
  exampleEn: The offer was good, but the quality wasn't.
  note: 'Formal. In position 1 the verb comes next: Jedoch hat er nicht bezahlt.'
- id: verbraucher
  lesson: de3-obwohl
  term: der Verbraucher
  pos: noun
  plural: die Verbraucher
  meanings: [consumer (male), consumer]
  example: Viele Verbraucher achten auf den Preis.
  exampleEn: Many consumers pay attention to the price.
- id: verbraucherin
  lesson: de3-obwohl
  term: die Verbraucherin
  pos: noun
  plural: die Verbraucherinnen
  meanings: [consumer (female), consumer]
  example: Die Verbraucherin hat sich über das Produkt beschwert.
  exampleEn: The consumer complained about the product.
- id: konsum
  lesson: de3-obwohl
  term: der Konsum
  pos: noun
  plural: —
  meanings: [consumption, consumerism]
  example: Der Konsum von Fleisch ist gesunken.
  exampleEn: Meat consumption has fallen.
- id: sich-leisten
  lesson: de3-obwohl
  term: sich leisten
  pos: verb
  meanings: [to afford, to treat yourself to, can afford]
  example: Ich kann mir kein neues Auto leisten.
  exampleEn: I can't afford a new car.
  note: 'The pronoun is dative: Ich leiste mir etwas. Usually with können.'
- id: ausgabe
  lesson: de3-obwohl
  term: die Ausgabe
  pos: noun
  plural: die Ausgaben
  meanings: [expense, expenditure, spending, outgoings]
  example: Unsere größte Ausgabe ist die Miete.
  exampleEn: Our biggest expense is the rent.
  note: 'Often plural: die Ausgaben. Also means edition (of a book or newspaper).'
- id: ausgeben
  lesson: de3-obwohl
  term: ausgeben
  pos: verb
  meanings: [to spend (money), to spend]
  example: Wie viel gibst du im Monat für Essen aus?
  exampleEn: How much do you spend on food a month?
  note: 'Separable and strong: er gibt aus, gab aus, hat ausgegeben. Time is spent with verbringen.'
- id: einnahme
  lesson: de3-obwohl
  term: die Einnahme
  pos: noun
  plural: die Einnahmen
  meanings: [takings, earnings, income (money coming in), revenue]
  example: Die Einnahmen des Cafés sind im Sommer höher.
  exampleEn: The café's takings are higher in summer.
  note: 'Usually plural: die Einnahmen und Ausgaben.'
- id: einkommen
  lesson: de3-obwohl
  term: das Einkommen
  pos: noun
  plural: die Einkommen
  meanings: [income, earnings]
  example: Mit einem kleinen Einkommen muss man sparsam sein.
  exampleEn: On a small income you have to be careful with money.
- id: lohn
  lesson: de3-obwohl
  term: der Lohn
  pos: noun
  plural: die Löhne
  meanings: [wage, wages, pay]
  example: Der Lohn kommt am Ende des Monats.
  exampleEn: The wages come at the end of the month.
- id: steuer
  lesson: de3-obwohl
  term: die Steuer
  pos: noun
  plural: die Steuern
  meanings: [tax]
  example: Wer mehr verdient, zahlt mehr Steuern.
  exampleEn: Those who earn more pay more tax.
- id: kredit
  lesson: de3-obwohl
  term: der Kredit
  pos: noun
  plural: die Kredite
  meanings: [loan, credit]
  example: Für die Wohnung haben wir einen Kredit aufgenommen.
  exampleEn: We took out a loan for the flat.
  note: 'einen Kredit aufnehmen = to take out a loan.'
- id: schulden
  lesson: de3-obwohl
  term: die Schulden
  pos: noun
  plural: die Schulden (plural only)
  meanings: [debts, debt]
  example: Er hat hohe Schulden bei der Bank.
  exampleEn: He has big debts with the bank.
  note: 'Schulden machen = to get into debt.'
- id: verschuldet
  lesson: de3-obwohl
  term: verschuldet
  pos: adjective
  meanings: [in debt, indebted]
  example: Viele junge Leute sind verschuldet.
  exampleEn: Many young people are in debt.
- id: zins
  lesson: de3-obwohl
  term: der Zins
  pos: noun
  plural: die Zinsen
  meanings: [interest (on money), interest, interest rate]
  example: Die Bank zahlt kaum Zinsen.
  exampleEn: The bank pays hardly any interest.
  note: 'Mostly used in the plural: die Zinsen.'
- id: ersparnis
  lesson: de3-obwohl
  term: die Ersparnis
  pos: noun
  plural: die Ersparnisse
  meanings: [savings, saving]
  example: Für den Urlaub hat sie ihre Ersparnisse genommen.
  exampleEn: She used her savings for the holiday.
  note: 'Money you have saved is usually plural: die Ersparnisse.'
- id: sparsam
  lesson: de3-obwohl
  term: sparsam
  pos: adjective
  meanings: [thrifty, economical, careful with money, frugal]
  example: Meine Großeltern waren immer sehr sparsam.
  exampleEn: My grandparents were always very thrifty.
- id: verschwenden
  lesson: de3-obwohl
  term: verschwenden
  pos: verb
  meanings: [to waste]
  example: Wir verschwenden zu viel Geld für Kaffee.
  exampleEn: We waste too much money on coffee.
  note: 'Perfect: hat verschwendet (no ge-).'
- id: luxus
  lesson: de3-obwohl
  term: der Luxus
  pos: noun
  plural: —
  meanings: [luxury]
  example: Ein eigenes Auto ist für mich Luxus.
  exampleEn: A car of my own is a luxury for me.
- id: nachhaltig
  lesson: de3-obwohl
  term: nachhaltig
  pos: adjective
  meanings: [sustainable, sustainably, lasting]
  example: Ich versuche, nachhaltig einzukaufen.
  exampleEn: I try to shop sustainably.
- id: qualitaet
  lesson: de3-obwohl
  term: die Qualität
  pos: noun
  plural: die Qualitäten
  meanings: [quality]
  example: Gute Qualität hat ihren Preis.
  exampleEn: Good quality comes at a price.
- id: ueberzeugen
  lesson: de3-obwohl
  term: überzeugen
  pos: verb
  meanings: [to convince, to persuade]
  example: Die Werbung hat mich nicht überzeugt.
  exampleEn: The advert didn't convince me.
  note: 'Inseparable. Perfect: hat überzeugt. überzeugt sein von = to be convinced of.'
- id: ueberzeugung
  lesson: de3-obwohl
  term: die Überzeugung
  pos: noun
  plural: die Überzeugungen
  meanings: [conviction, belief]
  example: Er kauft aus Überzeugung nur Bio-Produkte.
  exampleEn: He only buys organic products out of conviction.
- id: vergleichen
  lesson: de3-obwohl
  term: vergleichen
  pos: verb
  meanings: [to compare]
  example: Vor dem Kauf vergleiche ich immer die Preise.
  exampleEn: I always compare prices before buying.
  note: 'Strong: verglich, hat verglichen.'
- id: vergleich
  lesson: de3-obwohl
  term: der Vergleich
  pos: noun
  plural: die Vergleiche
  meanings: [comparison]
  example: Im Vergleich zu letztem Jahr ist alles teurer.
  exampleEn: Compared with last year, everything is more expensive.
  note: 'im Vergleich zu = compared with.'
- id: preiswert
  lesson: de3-obwohl
  term: preiswert
  pos: adjective
  meanings: [reasonably priced, good value, inexpensive, cheap]
  example: Der Markt ist preiswerter als der Supermarkt.
  exampleEn: The market is better value than the supermarket.
- id: schnaeppchen
  lesson: de3-obwohl
  term: das Schnäppchen
  pos: noun
  plural: die Schnäppchen
  meanings: [bargain, good deal, steal]
  example: Die Jacke war ein echtes Schnäppchen.
  exampleEn: The jacket was a real bargain.
- id: sich-lohnen
  lesson: de3-obwohl
  term: sich lohnen
  pos: verb
  meanings: [to be worth it, to be worthwhile, to pay off]
  example: Ein teures Fahrrad lohnt sich, wenn man jeden Tag fährt.
  exampleEn: An expensive bike is worth it if you ride every day.
  note: 'Mostly with es or a thing as subject: Das lohnt sich.'
- id: finanziell
  lesson: de3-obwohl
  term: finanziell
  pos: adjective
  meanings: [financial, financially]
  example: Nach dem Studium war ich endlich finanziell unabhängig.
  exampleEn: After university I was finally financially independent.

# --- 07 um … zu, damit (study and training) ---
- id: damit-so-that
  lesson: de3-um-zu-damit
  term: damit
  pos: conjunction
  meanings: [so that (purpose), so that, in order that]
  example: Ich spreche langsam, damit du mich verstehst.
  exampleEn: I'm speaking slowly so that you understand me.
  note: 'Verb at the end. Same subject in both clauses: um … zu is usually better.'
- id: um-zu
  lesson: de3-um-zu-damit
  kind: phrase
  term: um … zu
  alt: ['um ... zu', 'um...zu', 'um…zu', 'um zu']
  pos: conjunction
  meanings: [in order to, to (purpose), so as to]
  example: Ich lerne Deutsch, um in Wien zu arbeiten.
  exampleEn: I'm learning German in order to work in Vienna.
  note: 'um at the start, zu + infinitive at the end: um mich einzuschreiben.'
- id: hochschule
  lesson: de3-um-zu-damit
  term: die Hochschule
  pos: noun
  plural: die Hochschulen
  meanings: [university or college (general term), university, college, institution of higher education, higher education institution]
  example: An unserer Hochschule studieren 20.000 Menschen.
  exampleEn: 20,000 people study at our university.
- id: fachhochschule
  lesson: de3-um-zu-damit
  term: die Fachhochschule
  pos: noun
  plural: die Fachhochschulen
  meanings: [university of applied sciences, polytechnic]
  example: Meine Schwester studiert Design an einer Fachhochschule.
  exampleEn: My sister is studying design at a university of applied sciences.
- id: semester
  lesson: de3-um-zu-damit
  term: das Semester
  pos: noun
  plural: die Semester
  meanings: [semester, term (at university)]
  example: Ich bin im dritten Semester.
  exampleEn: I'm in my third semester.
- id: vorlesung
  lesson: de3-um-zu-damit
  term: die Vorlesung
  pos: noun
  plural: die Vorlesungen
  meanings: [lecture]
  example: Die Vorlesung beginnt um Viertel nach acht.
  exampleEn: The lecture starts at a quarter past eight.
- id: seminar
  lesson: de3-um-zu-damit
  term: das Seminar
  pos: noun
  plural: die Seminare
  meanings: [seminar, class (at university)]
  example: Im Seminar diskutieren wir die Texte.
  exampleEn: In the seminar we discuss the texts.
- id: hoersaal
  lesson: de3-um-zu-damit
  term: der Hörsaal
  pos: noun
  plural: die Hörsäle
  meanings: [lecture hall, lecture theatre, auditorium]
  example: Der Hörsaal war so voll, dass ich stehen musste.
  exampleEn: The lecture hall was so full that I had to stand.
- id: hausarbeit
  lesson: de3-um-zu-damit
  term: die Hausarbeit
  pos: noun
  plural: die Hausarbeiten
  meanings: [term paper, essay (at university), paper]
  example: Ich muss bis Freitag meine Hausarbeit abgeben.
  exampleEn: I have to hand in my term paper by Friday.
  note: 'Also means housework.'
- id: klausur
  lesson: de3-um-zu-damit
  term: die Klausur
  pos: noun
  plural: die Klausuren
  meanings: [written exam, exam (at university), test]
  example: Morgen schreiben wir eine Klausur in Statistik.
  exampleEn: Tomorrow we have a written exam in statistics.
  note: 'eine Klausur schreiben = to sit a written exam.'
- id: bachelor
  lesson: de3-um-zu-damit
  term: der Bachelor
  pos: noun
  plural: die Bachelor
  meanings: [bachelor's degree, bachelor's, bachelor]
  example: Nach dem Bachelor möchte ich arbeiten.
  exampleEn: After my bachelor's I'd like to work.
- id: master
  lesson: de3-um-zu-damit
  term: der Master
  pos: noun
  plural: die Master
  meanings: [master's degree, master's, master]
  example: Sie macht ihren Master in Wien.
  exampleEn: She's doing her master's in Vienna.
- id: stipendium
  lesson: de3-um-zu-damit
  term: das Stipendium
  pos: noun
  plural: die Stipendien
  meanings: [scholarship, grant, bursary]
  example: Ohne Stipendium könnte ich nicht studieren.
  exampleEn: Without a scholarship I couldn't study.
- id: sich-einschreiben
  lesson: de3-um-zu-damit
  term: sich einschreiben
  pos: verb
  meanings: [to enrol, to enroll, to register (at university), to sign up]
  example: Ich habe mich für Biologie eingeschrieben.
  exampleEn: I've enrolled for biology.
  note: 'Separable and strong: schrieb sich ein, hat sich eingeschrieben. With zu: sich einzuschreiben.'
- id: studiengang
  lesson: de3-um-zu-damit
  term: der Studiengang
  pos: noun
  plural: die Studiengänge
  meanings: [degree programme, degree program, course of study, course (at university)]
  example: Der Studiengang dauert sechs Semester.
  exampleEn: The degree programme lasts six semesters.
- id: studienplatz
  lesson: de3-um-zu-damit
  term: der Studienplatz
  pos: noun
  plural: die Studienplätze
  meanings: [university place, place at university]
  example: Für Medizin gibt es nur wenige Studienplätze.
  exampleEn: There are only a few university places for medicine.
- id: zulassung
  lesson: de3-um-zu-damit
  term: die Zulassung
  pos: noun
  plural: die Zulassungen
  meanings: [admission, acceptance, registration (of a car), approval]
  example: Gestern habe ich die Zulassung für Jura bekommen.
  exampleEn: Yesterday I got my acceptance for law.
- id: studiengebuehr
  lesson: de3-um-zu-damit
  term: die Studiengebühr
  pos: noun
  plural: die Studiengebühren
  meanings: [tuition fee, tuition fees, university fee]
  example: In Deutschland gibt es meistens keine Studiengebühren.
  exampleEn: In Germany there are mostly no tuition fees.
  note: 'Usually plural: die Studiengebühren.'
- id: bibliothek
  lesson: de3-um-zu-damit
  term: die Bibliothek
  pos: noun
  plural: die Bibliotheken
  meanings: [library]
  example: In der Bibliothek ist es ruhig.
  exampleEn: It's quiet in the library.
- id: mensa
  lesson: de3-um-zu-damit
  term: die Mensa
  pos: noun
  plural: die Mensen
  meanings: [university canteen, refectory, cafeteria (at university)]
  example: Mittags essen wir in der Mensa.
  exampleEn: At lunchtime we eat in the university canteen.
- id: studentenwohnheim
  lesson: de3-um-zu-damit
  term: das Studentenwohnheim
  pos: noun
  plural: die Studentenwohnheime
  alt: [das Wohnheim]
  meanings: [hall of residence, student residence, dorm, dormitory]
  example: Im ersten Jahr habe ich im Studentenwohnheim gewohnt.
  exampleEn: In my first year I lived in a hall of residence.
- id: professor
  lesson: de3-um-zu-damit
  term: der Professor
  pos: noun
  plural: die Professoren
  meanings: [professor (male), professor]
  example: Der Professor hält heute keine Vorlesung.
  exampleEn: The professor isn't giving a lecture today.
- id: professorin
  lesson: de3-um-zu-damit
  term: die Professorin
  pos: noun
  plural: die Professorinnen
  meanings: [professor (female), professor]
  example: Unsere Professorin kommt aus Brasilien.
  exampleEn: Our professor is from Brazil.
- id: dozent
  lesson: de3-um-zu-damit
  term: der Dozent
  pos: noun
  plural: die Dozenten
  meanings: [lecturer (male), lecturer, tutor]
  example: Der Dozent hat uns die Hausarbeit zurückgegeben.
  exampleEn: The lecturer gave us back our term papers.
  note: 'n-noun: den, dem, des Dozenten.'
- id: dozentin
  lesson: de3-um-zu-damit
  term: die Dozentin
  pos: noun
  plural: die Dozentinnen
  meanings: [lecturer (female), lecturer, tutor]
  example: Die Dozentin spricht sehr schnell.
  exampleEn: The lecturer speaks very fast.
- id: praktikum
  lesson: de3-um-zu-damit
  term: das Praktikum
  pos: noun
  plural: die Praktika
  meanings: [internship, work placement, placement]
  example: Im Sommer mache ich ein Praktikum bei einer Zeitung.
  exampleEn: In the summer I'm doing an internship at a newspaper.
- id: praktikant
  lesson: de3-um-zu-damit
  term: der Praktikant
  pos: noun
  plural: die Praktikanten
  meanings: [intern (male), intern, trainee]
  example: Wir suchen einen Praktikanten für drei Monate.
  exampleEn: We're looking for an intern for three months.
  note: 'n-noun: den, dem, des Praktikanten.'
- id: praktikantin
  lesson: de3-um-zu-damit
  term: die Praktikantin
  pos: noun
  plural: die Praktikantinnen
  meanings: [intern (female), intern, trainee]
  example: Die neue Praktikantin hilft im Büro.
  exampleEn: The new intern is helping in the office.
- id: qualifikation
  lesson: de3-um-zu-damit
  term: die Qualifikation
  pos: noun
  plural: die Qualifikationen
  meanings: [qualification]
  example: Für die Stelle fehlt mir eine Qualifikation.
  exampleEn: I'm missing a qualification for the job.
- id: qualifiziert
  lesson: de3-um-zu-damit
  term: qualifiziert
  pos: adjective
  meanings: [qualified]
  example: Sie ist für die Stelle sehr gut qualifiziert.
  exampleEn: She is very well qualified for the job.
- id: kenntnis
  lesson: de3-um-zu-damit
  term: die Kenntnis
  pos: noun
  plural: die Kenntnisse
  meanings: [knowledge (of a subject, mostly plural), knowledge, skills, skill]
  example: Für den Job braucht man gute Englischkenntnisse.
  exampleEn: For the job you need a good knowledge of English.
  note: 'Usually plural: Kenntnisse, Deutschkenntnisse, Computerkenntnisse.'
- id: faehigkeit
  lesson: de3-um-zu-damit
  term: die Fähigkeit
  pos: noun
  plural: die Fähigkeiten
  meanings: [ability, skill, capability]
  example: Teamarbeit ist eine wichtige Fähigkeit.
  exampleEn: Teamwork is an important skill.
- id: faehig
  lesson: de3-um-zu-damit
  term: fähig
  pos: adjective
  meanings: [capable, able, competent]
  example: Er ist nicht fähig, allein zu arbeiten.
  exampleEn: He isn't capable of working on his own.
  note: 'fähig sein, etwas zu tun / fähig zu etwas.'
- id: voraussetzung
  lesson: de3-um-zu-damit
  term: die Voraussetzung
  pos: noun
  plural: die Voraussetzungen
  meanings: [requirement, prerequisite, precondition]
  example: Das Abitur ist eine Voraussetzung für das Studium.
  exampleEn: The Abitur is a requirement for university.

# --- 08 da, falls, sodass (insurance, contracts, risk) ---
- id: da-since
  lesson: de3-da-falls
  term: da
  pos: conjunction
  meanings: [since (because), as (because), since, as, because]
  example: Da es regnet, bleiben wir zu Hause.
  exampleEn: Since it's raining, we're staying at home.
  note: 'Verb at the end. A known reason, usually at the start of the sentence.'
- id: sodass
  lesson: de3-da-falls
  term: sodass
  alt: [so dass]
  pos: conjunction
  meanings: [so that (result), with the result that, so that, so]
  example: Es hat stark geregnet, sodass der Keller nass war.
  exampleEn: It rained heavily, so that the cellar was wet.
  note: 'Verb at the end. For a goal, use damit.'
- id: also-so
  lesson: de3-da-falls
  term: also
  pos: adverb
  meanings: [so (therefore), therefore, so, well then, thus]
  example: Der Laden ist zu, also gehen wir morgen.
  exampleEn: The shop is closed, so we'll go tomorrow.
  note: 'False friend: English "also" is auch.'
- id: daher
  lesson: de3-da-falls
  term: daher
  pos: adverb
  meanings: [therefore (formal), therefore, hence, for this reason, so]
  example: Die Unterlagen fehlen. Daher können wir nicht zahlen.
  exampleEn: The documents are missing. Therefore we can't pay.
- id: deswegen
  lesson: de3-da-falls
  term: deswegen
  pos: adverb
  meanings: [for that reason, that's why, so, therefore]
  example: Ich war krank, deswegen bin ich nicht gekommen.
  exampleEn: I was ill, that's why I didn't come.
  note: 'Same as deshalb; very common in speech.'
- id: frist
  lesson: de3-da-falls
  term: die Frist
  pos: noun
  plural: die Fristen
  meanings: [deadline, time limit, period]
  example: Die Frist endet am 30. Juni.
  exampleEn: The deadline is 30 June.
- id: kuendigungsfrist
  lesson: de3-da-falls
  term: die Kündigungsfrist
  pos: noun
  plural: die Kündigungsfristen
  meanings: [notice period, period of notice]
  example: Die Kündigungsfrist beträgt drei Monate.
  exampleEn: The notice period is three months.
- id: bedingung
  lesson: de3-da-falls
  term: die Bedingung
  pos: noun
  plural: die Bedingungen
  meanings: [condition, term (of a contract), requirement]
  example: 'Unter einer Bedingung: Du hilfst mir beim Putzen.'
  exampleEn: 'On one condition: you help me with the cleaning.'
- id: gueltig
  lesson: de3-da-falls
  term: gültig
  pos: adjective
  meanings: [valid]
  example: Mein Pass ist noch zwei Jahre gültig.
  exampleEn: My passport is valid for two more years.
- id: ungueltig
  lesson: de3-da-falls
  term: ungültig
  pos: adjective
  meanings: [invalid, not valid, void]
  example: Ohne Stempel ist die Fahrkarte ungültig.
  exampleEn: Without a stamp the ticket is invalid.
- id: gueltigkeit
  lesson: de3-da-falls
  term: die Gültigkeit
  pos: noun
  plural: —
  meanings: [validity]
  example: Bitte prüfen Sie die Gültigkeit Ihres Ausweises.
  exampleEn: Please check the validity of your ID card.
- id: verlaengern
  lesson: de3-da-falls
  term: verlängern
  pos: verb
  meanings: [to extend, to renew, to prolong, to lengthen]
  example: Ich möchte meinen Vertrag um ein Jahr verlängern.
  exampleEn: I'd like to extend my contract by a year.
  note: 'Perfect: hat verlängert. sich verlängern = to be extended.'
- id: laufzeit
  lesson: de3-da-falls
  term: die Laufzeit
  pos: noun
  plural: die Laufzeiten
