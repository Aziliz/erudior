# Round 2, honors module de3-h1: words introduced by the honors lessons 90–93.
- id: de3-h1-r2-w01
  lesson: de3-h-kurzgeschichte
  term: die Kurzgeschichte
  pos: noun
  plural: die Kurzgeschichten
  meanings:
  - short story
  example: Wir lesen im Unterricht eine Kurzgeschichte von Heinrich Böll.
  exampleEn: We are reading a short story by Heinrich Böll in class.
- id: de3-h1-r2-w02
  lesson: de3-h-kurzgeschichte
  term: die Literatur
  pos: noun
  plural: die Literaturen
  meanings:
  - literature
  example: Sie interessiert sich sehr für deutsche Literatur.
  exampleEn: She is very interested in German literature.
  note: 'Stress on the last syllable: li-te-ra-TUR. The plural is rare.'
- id: de3-h1-r2-w03
  lesson: de3-h-kurzgeschichte
  term: die Erzählung
  pos: noun
  plural: die Erzählungen
  meanings:
  - narrative (story, tale)
  - tale
  - narrative
  - story
  example: Die Erzählung spielt in einem kleinen Dorf.
  exampleEn: The story is set in a small village.
  note: From erzählen. A general word for a narrative text, usually longer than a Kurzgeschichte.
- id: de3-h1-r2-w04
  lesson: de3-h-kurzgeschichte
  term: der Erzähler
  pos: noun
  plural: die Erzähler
  meanings:
  - narrator (male)
  - narrator
  - storyteller
  example: Der Erzähler sagt uns nicht, was der Vater denkt.
  exampleEn: "The narrator doesn't tell us what the father is thinking."
- id: de3-h1-r2-w05
  lesson: de3-h-kurzgeschichte
  term: die Erzählerin
  pos: noun
  plural: die Erzählerinnen
  meanings:
  - narrator (female)
  - narrator
  - storyteller
  example: Die Erzählerin ist selbst eine Figur in der Geschichte.
  exampleEn: The narrator is herself a character in the story.
- id: de3-h1-r2-w06
  lesson: de3-h-kurzgeschichte
  term: die Spannung
  pos: noun
  plural: die Spannungen
  meanings:
  - tension (suspense)
  - tension
  - suspense
  - excitement
  example: Die Spannung steigt bis zum Wendepunkt.
  exampleEn: The tension rises until the turning point.
  note: Also electrical voltage.
- id: de3-h1-r2-w07
  lesson: de3-h-kurzgeschichte
  term: spannend
  pos: adjective
  meanings:
  - exciting (gripping)
  - exciting
  - gripping
  - thrilling
  example: Der Krimi war so spannend, dass ich bis Mitternacht gelesen habe.
  exampleEn: The crime novel was so exciting that I read until midnight.
- id: de3-h1-r2-w08
  lesson: de3-h-kurzgeschichte
  term: andeuten
  pos: verb
  meanings:
  - to hint at
  - to hint
  - to suggest
  - to imply
  example: Die Geschichte deutet die Krankheit nur an.
  exampleEn: The story only hints at the illness.
  note: 'Separable: deutet … an, hat angedeutet.'
- id: de3-h1-r2-w09
  lesson: de3-h-kurzgeschichte
  term: die Szene
  pos: noun
  plural: die Szenen
  meanings:
  - scene
  example: In der letzten Szene sitzt Jana im Dunkeln.
  exampleEn: In the last scene Jana sits in the dark.
  note: 'Say: STSEH-ne.'
- id: de3-h1-r2-w10
  lesson: de3-h-kurzgeschichte
  term: die Perspektive
  pos: noun
  plural: die Perspektiven
  meanings:
  - perspective (point of view)
  - perspective
  - point of view
  example: Die Geschichte ist aus der Perspektive der Tochter erzählt.
  exampleEn: The story is told from the daughter's point of view.
- id: de3-h1-r2-w11
  lesson: de3-h-kurzgeschichte
  term: falten
  pos: verb
  meanings:
  - to fold
  example: Sie faltete den Brief und steckte ihn ein.
  exampleEn: She folded the letter and put it in her pocket.
  note: 'Weak: faltete, hat gefaltet. zusammenfalten = to fold up.'
- id: de3-h1-r2-w12
  lesson: de3-h-kurzgeschichte
  term: seltsam
  pos: adjective
  meanings:
  - strange (more written; not komisch)
  - strange
  - odd
  - weird
  - peculiar
  example: Er sah sie an, als hätte sie etwas Seltsames gesagt.
  exampleEn: He looked at her as if she had said something strange.
- id: de3-h1-r2-w13
  lesson: de3-h-gedichte
  term: die Dichterin
  pos: noun
  plural: die Dichterinnen
  meanings:
  - poet (female)
  - poet
  - poetess
  example: Annette von Droste-Hülshoff war eine berühmte Dichterin.
  exampleEn: Annette von Droste-Hülshoff was a famous poet.
- id: de3-h1-r2-w14
  lesson: de3-h-gedichte
  term: die Strophe
  pos: noun
  plural: die Strophen
  meanings:
  - stanza (verse of a song or poem)
  - stanza
  - verse
  example: Wir singen nur die erste Strophe.
  exampleEn: We are only singing the first verse.
- id: de3-h1-r2-w15
  lesson: de3-h-gedichte
  term: sich reimen
  pos: verb
  meanings:
  - to rhyme
  example: '"Haus" reimt sich auf "Maus".'
  exampleEn: '"Haus" rhymes with "Maus".'
  note: sich reimen auf + accusative.
- id: de3-h1-r2-w16
  lesson: de3-h-gedichte
  term: still
  pos: adjective
  meanings:
  - still (silent, motionless)
  - still
  - silent
  - quiet
  - calm
  example: Am Abend war es ganz still im Wald.
  exampleEn: In the evening it was completely silent in the forest.
  note: Sei still! = Be quiet!
- id: de3-h1-r2-w17
  lesson: de3-h-gedichte
  term: auswendig
  pos: adverb
  meanings:
  - by heart
  - from memory
  example: Ich kann das Gedicht auswendig.
  exampleEn: I know the poem by heart.
  note: auswendig lernen = to learn by heart.
- id: de3-h1-r2-w18
  lesson: de3-h-gedichte
  term: vortragen
  pos: verb
  meanings:
  - to recite
  - to perform (a poem or text)
  - to present
  example: Jedes Kind trägt ein Gedicht vor.
  exampleEn: Every child recites a poem.
  note: 'Separable and strong: trägt vor, trug vor, hat vorgetragen.'
- id: de3-h1-r2-w19
  lesson: de3-h-gedichte
  term: die Sage
  pos: noun
  plural: die Sagen
  meanings:
  - legend (old story)
  - legend
  - saga
  - myth
  example: Die Sage von der Loreley ist gar nicht so alt.
  exampleEn: The legend of the Lorelei isn't that old at all.
- id: de3-h1-r2-w20
  lesson: de3-h-gedichte
  term: die Welle
  pos: noun
  plural: die Wellen
  meanings:
  - wave
  example: Die Wellen waren heute sehr hoch.
  exampleEn: The waves were very high today.
- id: de3-h1-r2-w21
  lesson: de3-h-gedichte
  term: die Seele
  pos: noun
  plural: die Seelen
  meanings:
  - soul
  example: Und meine Seele spannte weit ihre Flügel aus.
  exampleEn: And my soul spread its wings wide.
- id: de3-h1-r2-w22
  lesson: de3-h-gedichte
  term: die Blüte
  pos: noun
  plural: die Blüten
  meanings:
  - blossom (flower)
  - blossom
  - flower
  - bloom
  example: Im April sind die Bäume voller Blüten.
  exampleEn: In April the trees are full of blossom.
- id: de3-h1-r2-w23
  lesson: de3-h-gedichte
  term: rauschen
  pos: verb
  meanings:
  - to rustle (murmur)
  - to rustle
  - to murmur
  - to rush (water)
  example: Der Wind rauscht in den Bäumen.
  exampleEn: The wind is rustling in the trees.
  note: 'Weak: rauschte, hat gerauscht.'
- id: de3-h1-r2-w24
  lesson: de3-h-gedichte
  term: die Stimmung
  pos: noun
  plural: die Stimmungen
  meanings:
  - mood (atmosphere)
  - mood
  - atmosphere
  example: Das Gedicht hat eine ruhige Stimmung.
  exampleEn: The poem has a calm mood.
- id: de3-h1-r2-w25
  lesson: de3-h-erinnerung
  term: gedenken
  pos: verb
  meanings:
  - to commemorate
  - to remember (solemnly)
  - to honour the memory of
  example: Am 27. Januar gedenken wir der Opfer.
  exampleEn: On 27 January we commemorate the victims.
  note: 'Takes the genitive. Mixed verb: gedachte, hat gedacht. das Gedenken = remembrance.'
- id: de3-h1-r2-w26
  lesson: de3-h-erinnerung
  term: die Gedenkstätte
  pos: noun
  plural: die Gedenkstätten
  meanings:
  - memorial site
  example: Die Klasse besucht die KZ-Gedenkstätte Dachau.
  exampleEn: The class is visiting the Dachau concentration camp memorial site.
- id: de3-h1-r2-w27
  lesson: de3-h-erinnerung
  term: das Mahnmal
  pos: noun
  plural: die Mahnmale
  meanings:
  - memorial (warning against a crime)
  - memorial
  - monument
  example: In Berlin steht ein Mahnmal für die ermordeten Juden Europas.
  exampleEn: In Berlin there is a memorial to the murdered Jews of Europe.
  note: From mahnen, to warn. Plural also die Mahnmäler.
- id: de3-h1-r2-w28
  lesson: de3-h-erinnerung
  term: der Gedenktag
  pos: noun
  plural: die Gedenktage
  meanings:
  - day of remembrance
  - memorial day
  - remembrance day
  example: Der 27. Januar ist ein Gedenktag.
  exampleEn: 27 January is a day of remembrance.
- id: de3-h1-r2-w29
  lesson: de3-h-erinnerung
  term: verfolgen
  pos: verb
  meanings:
  - to persecute
  - to follow
  - to pursue
  example: Viele Menschen wurden wegen ihrer Religion verfolgt.
  exampleEn: Many people were persecuted because of their religion.
  note: 'Inseparable: hat verfolgt. Also "to follow" (news, a car).'
- id: de3-h1-r2-w30
  lesson: de3-h-erinnerung
  term: die Verfolgung
  pos: noun
  plural: die Verfolgungen
  meanings:
  - persecution
  - pursuit
  example: Die Ausstellung erzählt von der Verfolgung der Juden.
  exampleEn: The exhibition tells of the persecution of the Jews.
- id: de3-h1-r2-w31
  lesson: de3-h-erinnerung
  term: deportieren
  pos: verb
  meanings:
  - to deport
  example: 1942 wurde die Familie deportiert.
  exampleEn: In 1942 the family was deported.
  note: 'Weak -ieren verb: hat deportiert (no ge-).'
- id: de3-h1-r2-w32
  lesson: de3-h-erinnerung
  term: ermorden
  pos: verb
  meanings:
  - to murder
  example: Sie wurde 1943 in Auschwitz ermordet.
  exampleEn: She was murdered in Auschwitz in 1943.
  note: 'Inseparable: hat ermordet. der Mord = murder.'
- id: de3-h1-r2-w33
  lesson: de3-h-erinnerung
  term: jüdisch
  pos: adjective
  meanings:
  - Jewish
  example: In dem Haus wohnte eine jüdische Familie.
  exampleEn: A Jewish family lived in the house.
- id: de3-h1-r2-w34
  lesson: de3-h-erinnerung
  term: das Verbrechen
  pos: noun
  plural: die Verbrechen
  meanings:
  - crime
  example: Die Verbrechen der Nazis dürfen nicht vergessen werden.
  exampleEn: The crimes of the Nazis must not be forgotten.
- id: de3-h1-r2-w35
  lesson: de3-h-erinnerung
  term: die Aufarbeitung
  pos: noun
  plural: —
  meanings:
  - working through (the past)
  - coming to terms with
  - reappraisal
  example: Die Aufarbeitung der Vergangenheit dauert bis heute.
  exampleEn: Working through the past continues to this day.
- id: de3-h1-r2-w36
  lesson: de3-h-erinnerung
  term: der Nationalsozialismus
  pos: noun
  plural: —
  meanings:
  - National Socialism
  - Nazism
  example: Die Ausstellung zeigt den Alltag im Nationalsozialismus.
  exampleEn: The exhibition shows everyday life under National Socialism.
  note: 'Short form: die NS-Zeit (the Nazi era).'
- id: de3-h1-r2-w37
  lesson: de3-h-einwanderung
  term: einwandern
  pos: verb
  meanings:
  - to immigrate
  example: Ihre Großeltern sind 1964 aus Portugal eingewandert.
  exampleEn: Her grandparents immigrated from Portugal in 1964.
  note: 'Separable, perfect with sein: ist eingewandert.'
- id: de3-h1-r2-w38
  lesson: de3-h-einwanderung
  term: der Einwanderer
  pos: noun
  plural: die Einwanderer
  meanings:
  - immigrant (male)
  - immigrant
  example: Viele Einwanderer haben in Fabriken gearbeitet.
  exampleEn: Many immigrants worked in factories.
- id: de3-h1-r2-w39
  lesson: de3-h-einwanderung
  term: die Einwanderin
  pos: noun
  plural: die Einwanderinnen
  meanings:
  - immigrant (female)
  - immigrant
  example: Als junge Einwanderin lernte sie abends Deutsch.
  exampleEn: As a young immigrant she learned German in the evenings.
- id: de3-h1-r2-w40
  lesson: de3-h-einwanderung
  term: die Migration
  pos: noun
  plural: —
  meanings:
  - migration
  example: Migration ist ein wichtiges Thema in der Politik.
  exampleEn: Migration is an important topic in politics.
- id: de3-h1-r2-w41
  lesson: de3-h-einwanderung
  term: die Arbeitskraft
  pos: noun
  plural: die Arbeitskräfte
  meanings:
  - worker (labour)
  - worker
  - labour
  - labor
  - manpower
  example: In den 1960er-Jahren fehlten Arbeitskräfte.
  exampleEn: In the 1960s there was a shortage of workers.
  note: 'Usually plural: die Arbeitskräfte. Fachkräfte = skilled workers.'
- id: de3-h1-r2-w42
  lesson: de3-h-einwanderung
  term: die Einbürgerung
  pos: noun
  plural: die Einbürgerungen
  meanings:
  - naturalisation
  - naturalization
  example: Für die Einbürgerung braucht man einen Sprachnachweis.
  exampleEn: For naturalisation you need proof of your language skills.
  note: sich einbürgern lassen = to become a citizen.
- id: de3-h1-r2-w43
  lesson: de3-h-einwanderung
  term: der Anteil
  pos: noun
  plural: die Anteile
  meanings:
  - share (proportion)
  - share
  - proportion
  - percentage
  example: Der Anteil der jungen Wähler ist gestiegen.
  exampleEn: The share of young voters has risen.
- id: de3-h1-r2-w44
  lesson: de3-h-einwanderung
  term: die Grafik
  pos: noun
  plural: die Grafiken
  meanings:
  - chart (graphic)
  - chart
  - graph
  - graphic
  example: Die Grafik zeigt die Entwicklung seit 2000.
  exampleEn: The chart shows the development since 2000.
- id: de3-h1-r2-w45
  lesson: de3-h-einwanderung
  term: das Prozent
  pos: noun
  plural: die Prozente
  meanings:
  - per cent
  - percent
  - percentage
  example: Fast 25 Prozent der Einwohner sind über 60.
  exampleEn: Almost 25 per cent of the residents are over 60.
  note: 'After a number no plural ending: 25 Prozent.'
- id: de3-h1-r2-w46
  lesson: de3-h-einwanderung
  term: steigen
  pos: verb
  meanings:
  - to rise (go up)
  - to rise
  - to go up
  - to climb
  - to increase
  example: Die Preise sind stark gestiegen.
  exampleEn: Prices have risen sharply.
  note: 'Strong: stieg, ist gestiegen. steigen auf/um: to rise to/by.'
- id: de3-h1-r2-w47
  lesson: de3-h-einwanderung
  term: sinken
  pos: verb
  meanings:
  - to sink (go down)
  - to sink
  - to fall
  - to go down
  - to drop
  - to decrease
  example: Die Zahl der Unfälle ist gesunken.
  exampleEn: The number of accidents has gone down.
  note: 'Strong: sank, ist gesunken.'
- id: de3-h1-r2-w48
  lesson: de3-h-einwanderung
  term: der Anstieg
  pos: noun
  plural: die Anstiege
  meanings:
  - rise (increase)
  - rise
  - increase
  example: Den stärksten Anstieg gab es 2016.
  exampleEn: The biggest rise was in 2016.
- id: de3-h1-r2-w49
  lesson: de3-h-einwanderung
  term: der Rückgang
  pos: noun
  plural: die Rückgänge
  meanings:
  - decline (decrease)
  - decline
  - decrease
  - drop
  - fall
  example: Die Statistik zeigt einen Rückgang der Geburten.
  exampleEn: The statistics show a decline in births.
- id: de3-h1-r2-w50
  lesson: de3-h-einwanderung
  term: die Statistik
  pos: noun
  plural: die Statistiken
  meanings:
  - statistics
  - statistic
  example: Laut Statistik lebt jeder Vierte allein.
  exampleEn: According to statistics, one person in four lives alone.
- id: de3-h1-r2-w51
  lesson: de3-h-einwanderung
  term: die Vielfalt
  pos: noun
  plural: —
  meanings:
  - diversity (variety)
  - diversity
  - variety
  example: Die Stadt ist stolz auf ihre kulturelle Vielfalt.
  exampleEn: The city is proud of its cultural diversity.
