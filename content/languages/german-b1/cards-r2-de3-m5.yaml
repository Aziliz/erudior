# German B1, module 5 honors lessons (round 2): notecards
# --- 25h1 Diplomatic German ---
- {front: 'Hedging with the Konjunktiv II: five chunks', back: 'Ich würde sagen, … / Ich hätte da eine Frage. / Ich fände das etwas zu teuer. / Wäre es nicht besser, …? / Da wäre ich mir nicht so sicher.', topic: Softening and guessing}
- {front: 'Ich hätte gedacht, dass …', back: 'I''d have thought that … A polite way to show surprise or disagree (past subjunctive).', topic: Softening and guessing}
- {front: 'Könnte es sein, dass …?', back: 'Could it be that …? Turns an accusation into a question: Könnte es sein, dass hier ein kleiner Fehler ist?', topic: Softening and guessing}
- {front: 'Modals for guessing, from surest to least sure', back: 'muss (sure) → müsste (if all is as expected) → dürfte (probably) → könnte (possibly); kann nicht = impossible. A rough scale.', topic: Softening and guessing}
- {front: 'Das dürfte teuer werden.', back: 'That''s probably going to be expensive. In a statement dürfte = probably, not permission.', topic: Softening and guessing}
- {front: 'Dürfte ich …? vs Das dürfte …', back: 'Dürfte ich Ihr Telefon benutzen? = very polite permission. Das dürfte stimmen. = that''s probably right.', topic: Softening and guessing}
- {front: 'Der Zug müsste gleich kommen.', back: 'The train should be here any minute (if everything is normal). müsste = expectation.', topic: Softening and guessing}
- {front: 'Guess about the past (recognize)', back: 'Modal + participle + haben/sein: Er dürfte den Zug verpasst haben. (He has probably missed the train.)', topic: Softening and guessing}
- {front: 'Er hätte es wissen müssen vs Er müsste es gewusst haben', back: 'First: he should have known (reproach). Second: he presumably knew (guess).', topic: Softening and guessing}
- {front: 'sonst + indicative vs sonst + Konjunktiv II', back: 'Beeil dich, sonst verpassen wir den Zug! (real warning) / Gut, dass du angerufen hast, sonst hätte ich es vergessen. (didn''t happen). sonst takes position 1.', topic: Konjunktiv II}
- {front: 'andernfalls', back: 'Formal for sonst (otherwise): Bitte zahlen Sie bis Freitag, andernfalls müssen wir eine Gebühr berechnen.', topic: Softening and guessing}
# --- 25h2 Literature and history ---
- {front: 'Written Konjunktiv II: how to recognize it', back: 'Simple past stem + umlaut + -e: lag → läge, sah → sähe, nahm → nähme, fuhr → führe. A few are irregular: stehen → stünde, werfen → würfe.', topic: Konjunktiv II}
- {front: 'stünde or stände?', back: 'Both are correct Konjunktiv II forms of stehen; stünde is the older and more common one in writing.', topic: Konjunktiv II}
- {front: 'führe, führen: two meanings', back: 'Konjunktiv II of fahren (wir führen = we would drive) or present tense of führen (to lead). Context decides.', topic: Konjunktiv II}
- {front: 'Weak verbs in the Konjunktiv II', back: 'Identical to the simple past (machte, wohnte), so speech uses würde + infinitive. In literature, only context shows the meaning.', topic: Konjunktiv II}
- {front: 'Kafka, Wunsch, Indianer zu werden', back: 'A one-sentence prose piece from Betrachtung (printed end of 1912). It is one unreal wish: Wenn man doch ein Indianer wäre, … with no main clause.', topic: Reading literature}
- {front: 'Kafka''s verbs: wäre, ließ, wegwarf, sah', back: 'wäre is Konjunktiv II; ließ, wegwarf, sah are simple past (Konjunktiv: ließe, wegwürfe, sähe). The text starts as a wish and continues in plain past forms.', topic: Reading literature}
- {front: 'die Zügel, die Sporen, die Heide', back: 'the reins, the spurs (der Sporn), the heath. Words from Kafka''s text.', topic: Reading literature}
- {front: 'Counterfactual history', back: 'What would have happened if …? Facts in the indicative, the imagined past in hätte/wäre + participle, a hedge (vielleicht) to mark speculation.', topic: Reading literature}
- {front: 'wenn … erfunden worden wäre', back: 'if … had been invented: past subjunctive of the passive (recognize). Without worden it would describe a state.', topic: Konjunktiv II}
- {front: 'Gutenberg and the printing press', back: 'Around 1450 in Mainz: printing with movable metal type. Movable type existed earlier in China and Korea.', topic: Reading literature}
- {front: 'Ohne + noun instead of a wenn clause', back: 'Ohne den Buchdruck hätten sich Luthers Ideen langsamer verbreitet. = Wenn es den Buchdruck nicht gegeben hätte, …', topic: Konjunktiv II}
