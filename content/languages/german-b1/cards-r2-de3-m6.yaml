# Round 2, module de3-m6: cards for the honors lessons 30h1 and 30h2.

# 30h1 Reported speech in full
- {front: 'Konjunktiv I endings', back: '-e, -est, -e, -en, -et, -en on the infinitive stem: ich komme, du kommest, er komme, wir kommen, ihr kommet, sie kommen.', topic: Konjunktiv I}
- {front: 'Konjunktiv I of sein', back: 'ich sei, du sei(e)st, er sei, wir seien, ihr seiet, sie seien.', topic: Konjunktiv I}
- {front: 'Spotting the Konjunktiv I of stem-changing verbs', back: 'It keeps the infinitive vowel: er gebe (gibt), sie fahre (fährt), er wisse (weiß).', topic: Konjunktiv I}
- {front: 'Replacement rule', back: 'Konjunktiv I → if it looks like the indicative, Konjunktiv II → if that looks like the Präteritum, würde + infinitive.', topic: Konjunktiv I}
- {front: '„Wir haben keine Zeit." in news style', back: 'Sie sagten, sie hätten keine Zeit. (sie haben would look like the indicative.)', topic: Konjunktiv I}
- {front: 'Past in reported speech', back: 'Every past becomes habe/sei + participle: „Ich kam." / „Ich bin gekommen." → er sei gekommen.', topic: Reported speech}
- {front: 'Future in reported speech', back: '„Ich werde kommen." → er werde kommen.', topic: Reported speech}
- {front: 'Reported question in news style', back: 'Sie fragte, ob/wann die Brücke geöffnet werde. (verb at the end, Konjunktiv I)', topic: Reported speech}
- {front: 'Reported request in news style', back: 'man solle / er solle …; polite: man möge …; plural: sie sollten …', topic: Reported speech}
- {front: 'A paragraph in Konjunktiv I', back: 'Every sentence still belongs to the named speaker; the indicative marks the newspaper''s own information.', topic: Reading the news}
- {front: 'behaupten vs erklären', back: 'behaupten = claim (the reporter keeps a distance); erklären = state (neutral).', topic: Reported speech}
- {front: 'einräumen / dementieren', back: 'einräumen = admit (something unpleasant); dementieren = officially deny a report.', topic: Reported speech}
- {front: 'News German → everyday German', back: 'Er erklärte, die Renten seien sicher. → Er hat gesagt, dass die Renten sicher sind.', topic: Reported speech}

# 30h2 Letters from offices and landlords
- {front: 'der Bescheid: the parts', back: 'Aktenzeichen, Betreff, the decision (bewilligt / abgelehnt / festgesetzt), Begründung, Rechtsbehelfsbelehrung, i. A. + signature.', topic: Official letters}
- {front: 'Rechtsbehelfsbelehrung', back: 'Tells you how and by when you can challenge a decision; usually a Widerspruch within one month of notification.', topic: Official letters}
- {front: 'Bekanntgabe of a posted letter (Germany)', back: 'Counts as delivered a few days after posting (federal rules since 2025: the fourth day). Safe habit: act well within a month of the date on the letter.', topic: Official letters}
- {front: 'How to lodge a Widerspruch', back: 'In writing (signed) or zur Niederschrift at the office; quote the Aktenzeichen, give reasons, keep proof of sending.', topic: Official letters}
- {front: 'First line of an objection', back: 'Hiermit lege ich Widerspruch gegen Ihren Bescheid vom … (Az. …) ein.', topic: Official letters}
- {front: 'einen Antrag stellen', back: '= beantragen, to apply (a light verb construction).', topic: Official letters}
- {front: 'zur Verfügung stellen / stehen', back: 'to provide / to be available: Ich stehe Ihnen gern zur Verfügung.', topic: Official letters}
- {front: 'in Anspruch nehmen; zur Kenntnis nehmen', back: 'to make use of; to take note of.', topic: Official letters}
- {front: 'Der Betrag ist bis zum 15.07. zu überweisen.', back: 'You must transfer the amount by 15 July (sein + zu = must).', topic: Official letters}
- {front: 'z. Hd. / i. V. / o. g.', back: 'zu Händen (for the attention of) / in Vertretung (standing in for) / oben genannt (above-mentioned).', topic: Official letters}
- {front: 'Im Falle einer Ablehnung …', back: 'Wenn der Antrag abgelehnt wird, … (nominal style → verb).', topic: Nominal style}
- {front: 'Nebenkostenabrechnung: the sum', back: 'real costs − advance payments: positive = Nachzahlung (you pay), negative = Guthaben (you get money back).', topic: Renting}
- {front: 'Deadlines for the service-charge bill (Germany)', back: 'Landlord: within 12 months of the end of the billing period. Tenant: objections within 12 months of receiving it; you may inspect the Belege.', topic: Renting}
