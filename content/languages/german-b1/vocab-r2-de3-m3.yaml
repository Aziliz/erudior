# German B1, module 3 (round 2): words introduced by the honors lessons 15h1 and 15h2.

# --- 15h1 Extended participle phrases: archaeology and museums ---
- id: de3-m3-r2-w01
  lesson: de3-m3-h-participle-phrases
  term: die Ausgrabung
  pos: noun
  plural: die Ausgrabungen
  meanings: [excavation, dig, archaeological dig]
  example: Die Ausgrabung dauert noch bis zum Herbst.
  exampleEn: The excavation will go on until the autumn.
- id: de3-m3-r2-w02
  lesson: de3-m3-h-participle-phrases
  term: ausgraben
  pos: verb
  meanings: [to dig up, to excavate, to unearth]
  example: Die Archäologen haben eine alte Mauer ausgegraben.
  exampleEn: The archaeologists have dug up an old wall.
  note: 'Separable and strong: er gräbt aus, grub aus, hat ausgegraben.'
- id: de3-m3-r2-w03
  lesson: de3-m3-h-participle-phrases
  term: der Fund
  pos: noun
  plural: die Funde
  meanings: [find, discovery]
  example: Der Fund ist etwa 2.000 Jahre alt.
  exampleEn: The find is about 2,000 years old.
- id: de3-m3-r2-w04
  lesson: de3-m3-h-participle-phrases
  term: der Archäologe
  pos: noun
  plural: die Archäologen
  meanings: [archaeologist (male), archaeologist, archeologist]
  example: Der Archäologe zeigt uns die Ausgrabung.
  exampleEn: The archaeologist shows us the excavation.
  note: 'Weak noun: den/dem/des Archäologen.'
- id: de3-m3-r2-w05
  lesson: de3-m3-h-participle-phrases
  term: die Archäologin
  pos: noun
  plural: die Archäologinnen
  meanings: [archaeologist (female), archaeologist, archeologist]
  example: Die Archäologin leitet das Team.
  exampleEn: The archaeologist leads the team.
- id: de3-m3-r2-w06
  lesson: de3-m3-h-participle-phrases
  term: die Sammlung
  pos: noun
  plural: die Sammlungen
  meanings: [collection]
  example: Das Museum hat eine große Sammlung römischer Münzen.
  exampleEn: The museum has a large collection of Roman coins.
- id: de3-m3-r2-w07
  lesson: de3-m3-h-participle-phrases
  term: stammen
  pos: verb
  meanings: [to come from, to date from, to originate from, to stem from]
  example: Die Münze stammt aus dem 2. Jahrhundert.
  exampleEn: The coin dates from the 2nd century.
  note: 'Usually stammen aus + dative (a place or time), sometimes stammen von (a person).'
- id: de3-m3-r2-w08
  lesson: de3-m3-h-participle-phrases
  term: zahlreich
  pos: adjective
  meanings: [numerous, many]
  example: Zahlreiche Besucher kamen zur Ausstellung.
  exampleEn: Numerous visitors came to the exhibition.
- id: de3-m3-r2-w09
  lesson: de3-m3-h-participle-phrases
  term: bisherig
  pos: adjective
  meanings: [previous, former, existing, so far]
  example: Der bisherige Rekord lag bei 40 Münzen.
  exampleEn: The previous record was 40 coins.
  note: 'Only before a noun, with endings: der bisherige Rekord. The adverb is bisher.'
- id: de3-m3-r2-w12
  lesson: de3-m3-h-participle-phrases
  term: der Besucher
  pos: noun
  plural: die Besucher
  meanings: [visitor (male), visitor, guest]
  example: Der Besucher kaufte eine Eintrittskarte.
  exampleEn: The visitor bought a ticket.
- id: de3-m3-r2-w13
  lesson: de3-m3-h-participle-phrases
  term: die Besucherin
  pos: noun
  plural: die Besucherinnen
  meanings: [visitor (female), visitor, guest]
  example: Die Besucherin hatte viele Fragen.
  exampleEn: The visitor had a lot of questions.
- id: de3-m3-r2-w14
  lesson: de3-m3-h-participle-phrases
  term: der Gegenstand
  pos: noun
  plural: die Gegenstände
  meanings: [object, item, thing]
  example: In der Kiste lagen zahlreiche Gegenstände.
  exampleEn: There were numerous objects in the box.
- id: de3-m3-r2-w15
  lesson: de3-m3-h-participle-phrases
  term: römisch
  pos: adjective
  meanings: [Roman]
  example: Hier stand früher eine römische Stadt.
  exampleEn: A Roman town used to stand here.

# --- 15h2 Office German: official letters ---
- id: de3-m3-r2-w17
  lesson: de3-m3-h-official-genitive
  term: aufgrund
  pos: preposition
  alt: [auf Grund]
  meanings: [due to, because of, on the grounds of, owing to]
  example: Aufgrund der Bauarbeiten ist die Straße gesperrt.
  exampleEn: Due to the construction work the road is closed.
  note: '+ genitive (formal wegen). Without an article: aufgrund von.'
- id: de3-m3-r2-w18
  lesson: de3-m3-h-official-genitive
  term: infolge
  pos: preposition
  meanings: [as a result of, following, in consequence of]
  example: Infolge des Unwetters fiel der Strom aus.
  exampleEn: As a result of the storm, the power went off.
  note: '+ genitive. Without an article: infolge von.'
- id: de3-m3-r2-w19
  lesson: de3-m3-h-official-genitive
  term: angesichts
  pos: preposition
  meanings: [in view of, given, in the face of, considering]
  example: Angesichts der hohen Kosten wird das Projekt verschoben.
  exampleEn: In view of the high costs, the project is being postponed.
  note: '+ genitive.'
- id: de3-m3-r2-w20
  lesson: de3-m3-h-official-genitive
  term: dank
  pos: preposition
  meanings: [thanks to, owing to]
  example: Dank deiner Hilfe war alles schnell fertig.
  exampleEn: Thanks to your help everything was finished quickly.
  note: '+ genitive or dative; only for a cause with a good result.'
- id: de3-m3-r2-w21
  lesson: de3-m3-h-official-genitive
  term: mangels
  pos: preposition
  meanings: [for lack of, for want of, in the absence of]
  example: Mangels ausreichender Nachfrage wird die Buslinie eingestellt.
  exampleEn: For lack of sufficient demand, the bus line is being discontinued.
  note: '+ genitive; plural nouns without an article take the dative: mangels Beweisen.'
- id: de3-m3-r2-w22
  lesson: de3-m3-h-official-genitive
  term: bezüglich
  pos: preposition
  meanings: [regarding, concerning, with reference to, re]
  example: Bezüglich Ihrer Anfrage teilen wir Ihnen Folgendes mit.
  exampleEn: Regarding your enquiry, we would like to inform you of the following.
  note: '+ genitive. Abbreviation: bzgl.'
- id: de3-m3-r2-w23
  lesson: de3-m3-h-official-genitive
  term: hinsichtlich
  pos: preposition
  meanings: [with regard to, as regards, in terms of, with respect to]
  example: Hinsichtlich der Kosten gibt es noch Fragen.
  exampleEn: With regard to the costs, there are still questions.
  note: '+ genitive.'
- id: de3-m3-r2-w24
  lesson: de3-m3-h-official-genitive
  term: mithilfe
  pos: preposition
  alt: [mit Hilfe]
  meanings: [with the help of, with the aid of, by means of]
  example: Mithilfe eines Kredits haben sie das Haus gekauft.
  exampleEn: With the help of a loan they bought the house.
  note: '+ genitive. Without an article: mithilfe von.'
- id: de3-m3-r2-w25
  lesson: de3-m3-h-official-genitive
  term: anhand
  pos: preposition
  meanings: [on the basis of, using, by means of (evidence)]
  example: Anhand der Unterlagen prüfen wir Ihren Antrag.
  exampleEn: We will check your application on the basis of the documents.
  note: '+ genitive. Without an article: anhand von.'
- id: de3-m3-r2-w26
  lesson: de3-m3-h-official-genitive
  term: anlässlich
  pos: preposition
  meanings: [on the occasion of, to mark]
  example: Anlässlich des Jubiläums gibt es ein Fest.
  exampleEn: There is a party on the occasion of the anniversary.
  note: '+ genitive.'
- id: de3-m3-r2-w27
  lesson: de3-m3-h-official-genitive
  term: entlang
  pos: preposition
  meanings: [along]
  example: Wir gingen den Fluss entlang.
  exampleEn: We walked along the river.
  note: 'Usually after the noun with the accusative (den Fluss entlang); before the noun with the genitive (entlang des Flusses).'
- id: de3-m3-r2-w28
  lesson: de3-m3-h-official-genitive
  term: die Angelegenheit
  pos: noun
  plural: die Angelegenheiten
  meanings: [matter, affair, business, issue]
  example: In dieser Angelegenheit können wir Ihnen leider nicht helfen.
  exampleEn: Unfortunately we can't help you in this matter.
- id: de3-m3-r2-w29
  lesson: de3-m3-h-official-genitive
  term: der Anwohner
  pos: noun
  plural: die Anwohner
  meanings: [local resident (male), local resident, resident, neighbour, neighbor]
  example: Die Anwohner haben sich über den Lärm beschwert.
  exampleEn: The local residents complained about the noise.
- id: de3-m3-r2-w30
  lesson: de3-m3-h-official-genitive
  term: die Anwohnerin
  pos: noun
  plural: die Anwohnerinnen
  meanings: [local resident (female), local resident, resident, neighbour, neighbor]
  example: Eine Anwohnerin hat die Polizei gerufen.
  exampleEn: A local resident called the police.
- id: de3-m3-r2-w31
  lesson: de3-m3-h-official-genitive
  term: die Sanierung
  pos: noun
  plural: die Sanierungen
  meanings: [renovation, refurbishment, redevelopment, restoration]
  example: Die Sanierung des Schwimmbads kostet zwei Millionen Euro.
  exampleEn: The renovation of the swimming pool costs two million euros.
- id: de3-m3-r2-w32
  lesson: de3-m3-h-official-genitive
  term: sanieren
  pos: verb
  meanings: [to refurbish, to renovate, to redevelop, to restore]
  example: Die Stadt saniert die alten Wasserleitungen.
  exampleEn: The town is refurbishing the old water pipes.
- id: de3-m3-r2-w33
  lesson: de3-m3-h-official-genitive
  term: das Grundstück
  pos: noun
  plural: die Grundstücke
  meanings: [plot of land, property, plot, piece of land, lot]
  example: Das Grundstück liegt direkt am Wald.
  exampleEn: The plot is right next to the forest.
- id: de3-m3-r2-w34
  lesson: de3-m3-h-official-genitive
  term: erneuern
  pos: verb
  meanings: [to renew, to replace, to renovate]
  example: Die alten Fenster müssen erneuert werden.
  exampleEn: The old windows need to be replaced.
