# German B1 glossary, module 5 honors lessons (round 2)
- term: hedging
  aliases: [hedge, hedges, softening, softened statement]
  definition: 'Making a statement less absolute so that it leaves room for the other person. German often hedges with the Konjunktiv II: Ich würde sagen, … (I''d say …), Ich hätte da eine Frage, Da wäre ich mir nicht so sicher, Könnte es sein, dass …? Small words like vielleicht, eigentlich and eher help too.'
  topic: Softening and guessing
- term: epistemic modal
  aliases: [epistemic modals, modal verb of probability, modal verbs of probability, subjective modal, subjektiver Gebrauch der Modalverben]
  definition: 'A modal verb used to show how sure the speaker is, not to express ability or obligation: Sie muss zu Hause sein (she must be at home: sure), Der Zug müsste gleich kommen (should, if all is normal), Das dürfte stimmen (probably), Das könnte stimmen (possibly), Das kann nicht sein (impossible).'
  topic: Softening and guessing
- term: counterfactual
  aliases: [counterfactuals, counterfactual history, alternative history, kontrafaktische Geschichte]
  definition: 'About what would have happened if something had been different, contrary to the facts. In German, counterfactual statements use the Konjunktiv II: Ohne den Buchdruck hätten sich Luthers Ideen langsamer verbreitet. Counterfactual history is a thought experiment, not a fact.'
  topic: Reading literature
