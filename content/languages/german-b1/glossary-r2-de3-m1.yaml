# German B1 glossary, module 1 honors lessons (round 2)
- term: Futur II
  aliases: [future perfect, future perfect tense, Futur 2, Futur zwei]
  definition: 'werden in position 2 + past participle + haben or sein at the end: Sie wird es geschafft haben. Er wird gegangen sein. It says that something will be finished by a point in the future (Bis Freitag werde ich den Bericht geschrieben haben), or, more often in speech, guesses about the past (Er wird den Zug verpasst haben = he has probably missed the train). Strictly B2; in everyday speech the perfect often replaces it.'
  topic: Verbs
- term: perfect infinitive
  aliases: [perfect infinitives, Infinitiv Perfekt, past infinitive]
  definition: 'The past participle plus the infinitive haben or sein: gelesen haben, angekommen sein. It follows werden in the Futur II (Er wird es gelesen haben), zu after verbs like scheinen (Er scheint es gelesen zu haben) and modal verbs in guesses (Er muss es gelesen haben). The helper is the same as in the perfect.'
  topic: Verbs
- term: prepositional phrase
  aliases: [prepositional phrases, Präpositionalphrase]
  definition: 'A preposition with its noun or pronoun: nach dem Krieg, bei unserer Ankunft, seit ihrer Heirat. A time phrase like these can often replace a whole time clause (nachdem der Krieg zu Ende war); it is shorter and has no tense, so written German likes it.'
  topic: Word order
- term: nominalised infinitive
  aliases: [nominalized infinitive, nominalised infinitives, nominalized infinitives, substantivierter Infinitiv]
  definition: 'An infinitive used as a noun: always neuter and written with a capital letter: das Essen, das Lesen, das Autofahren. Very common after beim (while doing: beim Lesen) and zum (for doing: zum Lesen).'
  topic: Nouns
