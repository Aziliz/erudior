# German B1, module 5: If only: Konjunktiv II and more (lessons 21–25)
- term: Konjunktiv II
  aliases: [subjunctive II, general subjunctive, conditional mood, Konjunktiv 2]
  definition: 'The verb form for things that are imagined, unreal or hypothetical, and for politeness, like English "would", "could" and "if I were". Present: wäre, hätte, würde, the modals (könnte, müsste, dürfte, sollte) and a few strong verbs (käme, gäbe, wüsste), otherwise würde + infinitive. Past: hätte or wäre + past participle (hätte gewusst, wäre gegangen).'
  topic: Verbs
- term: indicative
  aliases: [indicative mood, Indikativ]
  definition: 'The normal verb form for facts and real possibilities, in any tense: Ich habe Zeit. Wenn es regnet, bleiben wir zu Hause. Its opposite is the Konjunktiv II, for things that are only imagined: Ich hätte Zeit.'
  topic: Verbs
- term: unreal condition
  aliases: [unreal conditions, unreal conditional, unreal conditionals, irrealer Bedingungssatz]
  definition: 'An if-clause about something that is not true or not expected, with the Konjunktiv II in both clauses: Wenn ich Zeit hätte, würde ich kommen (present). Wenn ich das gewusst hätte, wäre ich gekommen (past). wenn can be left out if the verb comes first: Hätte ich Zeit, würde ich kommen.'
  topic: Sentences
- term: würde form
  aliases: [würde + infinitive, würde-Form, würde construction]
  definition: 'The everyday Konjunktiv II for most verbs: würde in position 2 and the infinitive at the end, like a modal verb: Ich würde gern reisen. Not used with sein, haben or modal verbs, which have their own forms (wäre, hätte, könnte).'
  topic: Verbs
- term: past subjunctive
  aliases: [Konjunktiv II der Vergangenheit, past Konjunktiv II, past conditional, subjunctive past]
  definition: 'The past form of the Konjunktiv II: hätte or wäre + past participle, for unreal situations in the past: Ich hätte dich angerufen. Sie wäre gekommen. hätte or wäre is chosen as haben or sein in the perfect. There is only one past form.'
  topic: Verbs
- term: double infinitive
  aliases: [double infinitives, Ersatzinfinitiv, infinitive for participle]
  definition: 'Two infinitives at the end of a clause, used when a modal verb is in a perfect or past-subjunctive form together with another verb: Ich hätte anrufen sollen (I should have called). The modal stays in the infinitive instead of becoming a participle. In a subordinate clause, hätte comes before both: …, dass ich hätte anrufen sollen.'
  topic: Verbs
- term: unreal wish
  aliases: [unreal wishes, wish clause, Wunschsatz]
  definition: 'A wish about something that is not (or was not) true, with the Konjunktiv II and nur, doch or bloß: Wenn ich nur mehr Zeit hätte! or with the verb first: Hätte ich doch mehr Zeit! For the past: Hätte ich das bloß gewusst!'
  topic: Sentences
- term: modal particle
  aliases: [modal particles, Modalpartikel, flavouring particle, flavoring particle]
  definition: 'A small word such as doch, nur, bloß, ja, mal or denn that adds a feeling (surprise, impatience, softness, longing) to a sentence without changing its basic meaning. It has no exact translation: Wenn ich doch nur Zeit hätte! (If only I had time!) Komm mal her! (Come here a moment!)'
  topic: Words
- term: unreal comparison
  aliases: [unreal comparisons, als ob clause, als-ob clause, Vergleichssatz mit als ob]
  definition: 'A comparison with something that is not really true, using als ob + Konjunktiv II with the verb at the end: Er tut so, als ob er alles wüsste (as if he knew everything). Short form with als and the verb straight after: als wüsste er alles.'
  topic: Sentences
- term: prepositional adjective
  aliases: [prepositional adjectives, adjective with a preposition, adjectives with prepositions]
  definition: 'An adjective that is used with a fixed preposition and case: stolz auf + accusative (proud of), zufrieden mit + dative (satisfied with), interessiert an + dative (interested in). Learn the adjective, preposition and case together.'
  topic: Adjectives
- term: prepositional noun
  aliases: [prepositional nouns, noun with a preposition, nouns with prepositions]
  definition: 'A noun that is used with a fixed preposition and case: die Angst vor + dative, die Lust auf + accusative, das Interesse an + dative. Many keep the preposition of the related verb (sich erinnern an → die Erinnerung an), but not all (sich interessieren für → das Interesse an).'
  topic: Nouns
- term: noun suffix
  aliases: [noun suffixes, noun ending, noun endings, suffix, suffixes]
  definition: 'An ending that makes a noun from another word and fixes its gender: -ung, -heit, -keit, -schaft, -ion, -tät are always feminine (die Beförderung, die Freiheit); -ismus is masculine; -chen, -lein, -ment and -um are neuter (das Mädchen, das Zentrum).'
  topic: Nouns
