# Module 6 glossary (lessons 26–30)
- term: reported speech
  aliases: [indirect speech, reported question, reported questions, indirekte Rede]
  definition: 'Passing on what someone else said or asked, instead of quoting them. In everyday German you use dass (statements), ob (yes/no questions) or the question word (W-questions), with the verb at the end, change the pronouns to fit the new speaker, and use sollen for instructions: Sie sagt, dass sie morgen kommt. Er fragt, ob ich Zeit habe.'
  topic: Reported speech
- term: Konjunktiv I
  aliases: [subjunctive I, special subjunctive, Konjunktiv 1, quotative subjunctive]
  definition: 'The verb form that news and official texts use to show they are only reporting someone''s words: Der Minister sagte, das System sei stabil. It is mostly met in the third person singular (er sei, er habe, er komme, er könne). Where it looks like the normal present, writers use the Konjunktiv II instead (sie hätten). At B1 you only need to recognize it.'
  topic: Reported speech
- term: causative
  aliases: [causative lassen, causative verb, lassen + infinitive]
  definition: 'A construction in which you get someone else to do something, rather than doing it yourself. German uses lassen + infinitive: Ich lasse das Auto reparieren (I''m having the car repaired). Its perfect has two infinitives: Ich habe das Auto reparieren lassen.'
  topic: lassen
- term: directional adverb
  aliases: [directional adverbs, hin and her, hin- and her-, Richtungsadverb]
  definition: 'A word that shows the direction of a movement relative to the speaker. hin- means away from the speaker, her- towards the speaker: hinauf/herauf (up), hinein/herein (in), hinaus/heraus (out), hinunter/herunter (down). In speech they are often shortened to rauf, rein, raus, runter.'
  topic: hin and her
- term: register
  aliases: [formality, level of formality]
  definition: 'The level of formality you choose for a reader or listener. German letters and e-mails have three: informal (du, Liebe Mia, Liebe Grüße), semi-formal (Sie, Liebe Frau Kraus, Viele Grüße) and formal (Sie, Sehr geehrte Damen und Herren, Mit freundlichen Grüßen).'
  topic: Writing
- term: semi-formal
  aliases: [semi-formal register, semi-formal e-mail, semi-formal letter, halbformell]
  definition: 'The register for people you know but call Sie, such as a teacher, a colleague or a neighbour: polite and with Sie, but warmer than a formal letter. Typical opening and closing: Liebe Frau Kraus, … Viele Grüße.'
  topic: Writing
- term: CEFR
  aliases: [Common European Framework of Reference, GER, Gemeinsamer Europäischer Referenzrahmen]
  definition: 'The Common European Framework of Reference for Languages, which describes six levels from A1 (beginner) to C2 (near-native). B1 is the third level and the first "independent user" level: you can deal with familiar topics, travel, write connected texts and give reasons for your opinions.'
  topic: Exams
- term: can-do statement
  aliases: [can-do statements, can-do descriptor, can-do descriptors, Kann-Beschreibung]
  definition: 'A sentence that describes a language level by what a learner can do with the language, such as "can describe experiences, events, hopes and plans". The CEFR defines its levels with can-do statements rather than with lists of grammar.'
  topic: Exams
