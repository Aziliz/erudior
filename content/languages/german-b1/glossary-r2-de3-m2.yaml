# German B1 glossary, module 2 honors lessons (round 2)
- term: adversative connector
  aliases: [adversative connectors, adversative conjunction, adversative conjunctions, contrastive connector, contrastive connectors, adversativer Konnektor]
  definition: 'A connector that sets two different facts side by side without saying that one should prevent the other (that would be concession): während and wohingegen (whereas, verb at the end), dagegen and hingegen (on the other hand, verb straight after), im Gegensatz zu (in contrast to). Test: if you can swap the two halves without changing the meaning, it is a contrast.'
  topic: Contrast
- term: exceptive clause
  aliases: [exceptive clauses, exception clause, exception clauses, unless clause, Exzeptivsatz]
  definition: 'A clause that names the one case in which the main statement does not hold, like English "unless": es sei denn + main clause (Wir gehen wandern, es sei denn, es regnet) or außer wenn + verb at the end (…, außer wenn es regnet). Both mean the same as wenn … nicht.'
  topic: Contrast
- term: concessive conditional clause
  aliases: [concessive conditional clauses, concessive conditional, concessive conditionals, even-if clause]
  definition: 'A clause that says the main event happens whatever the condition, whether it is true or only possible: auch wenn (even if) or the stronger selbst wenn (even in the extreme case), verb at the end: Auch wenn es regnet, gehen wir raus. Unlike obwohl, the condition does not have to be a real fact.'
  topic: Concession
- term: argumentative essay
  aliases: [argumentative essays, Erörterung, discursive essay, discursive essays, argument essay]
  definition: 'A structured text that weighs up the arguments for and against a question: introduction (Einleitung), arguments for, arguments against, weighing up, and a conclusion with your own opinion (Fazit). Signposts such as zunächst, darüber hinaus, auf der anderen Seite and zusammenfassend lässt sich sagen guide the reader.'
  topic: Argument
