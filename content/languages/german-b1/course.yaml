id: lang-german-b1
title: German B1
description: >-
  The third step in German, from A2 to CEFR level B1, the level of the Goethe-Zertifikat
  B1. Lessons cover telling stories in the simple past and past perfect, time clauses,
  the future, weak and adjectival nouns, obwohl, um … zu and damit, two-part connectors,
  relative clauses in every case, the genitive, the passive, the full Konjunktiv II,
  verbs with prepositions, and writing e-mails, forum posts and short presentations. About
  1,000 new words build on the 1,384 from German A1 and A2 for about 2,400 in all, and a
  reading list suggests graded readers and real news at this level. Unlocks when German A2
  is complete.
