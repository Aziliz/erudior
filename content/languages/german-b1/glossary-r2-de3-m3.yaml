# German B1, module 3 (round 2): terms from the honors lessons 15h1 and 15h2.
- term: extended participial attribute
  aliases: [extended participial attributes, extended participle phrase, extended participle phrases, erweitertes Partizipialattribut, Partizipialattribut]
  definition: 'A participle (or adjective) before a noun that has words of its own in front of it, all framed by the article and the noun: der beim Bau der neuen Brücke entdeckte Schatz (the treasure discovered during the construction of the new bridge). The participle comes last, just before the noun, with a normal adjective ending. It means the same as a relative clause: der Schatz, der beim Bau der neuen Brücke entdeckt wurde. Typical of written German.'
  topic: Extended participle phrases
- term: gerundive
  aliases: [gerundives, Gerundiv, Gerundivum, zu + Partizip I, zu + present participle]
  definition: 'zu + present participle before a noun, meaning that something must (sometimes can) be done: die noch zu untersuchenden Münzen = die Münzen, die noch untersucht werden müssen. It is the form before a noun of sein + zu (Die Münzen sind noch zu untersuchen). With separable verbs zu goes inside: die auszufüllenden Formulare. Mostly in official and academic writing.'
  topic: Extended participle phrases
- term: possessive dative
  aliases: [possessive datives]
  definition: 'A spoken, regional way of showing possession with a dative and a possessive: dem Vater sein Haus (instead of das Haus des Vaters), der Oma ihr Garten. Common in everyday speech in many regions, but not standard German: don''t write it. The book title Der Dativ ist dem Genitiv sein Tod is a joke built on it.'
  topic: Genitive prepositions in writing
- term: postposition
  aliases: [postpositions]
  definition: 'A preposition that comes after its noun instead of before it. The main German example is entlang with the accusative: den Fluss entlang (along the river). Before the noun, entlang takes the genitive: entlang des Flusses. wegen can also follow its noun in formal style: des Wetters wegen.'
  topic: Genitive prepositions in writing
