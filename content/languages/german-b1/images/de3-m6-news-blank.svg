<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img"><title>A short local news article with its reporting signals (unlabeled)</title><rect width="480" height="470" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="#1c2833"><rect x="20" y="20" width="440" height="430" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="40" y="52" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">LOKALNACHRICHTEN</text><text x="440" y="52" font-size="14" text-anchor="end" fill="#1c2833">Seite 3</text><line x1="40" y1="62" x2="440" y2="62" stroke="#1c2833" stroke-width="2"/><text x="40" y="100" font-size="26" text-anchor="start" font-weight="bold" fill="#1c2833">Brücke bleibt gesperrt</text><text x="40" y="145" font-size="16" text-anchor="start" fill="#1c2833">Die Lindenbrücke in der Altstadt bleibt</text><text x="40" y="179" font-size="16" text-anchor="start" fill="#1c2833">bis Ende Mai gesperrt. Der Beton sei</text><text x="40" y="213" font-size="16" text-anchor="start" fill="#1c2833">stärker beschädigt als erwartet, erklärte</text><text x="40" y="247" font-size="16" text-anchor="start" fill="#1c2833">ein Sprecher der Stadt. „Wir arbeiten so</text><text x="40" y="281" font-size="16" text-anchor="start" fill="#1c2833">schnell wie möglich“, sagte er.</text><text x="40" y="315" font-size="16" text-anchor="start" fill="#1c2833">Einem Gutachten zufolge waren die</text><text x="40" y="349" font-size="16" text-anchor="start" fill="#1c2833">Schäden schon seit Jahren bekannt. Die</text><text x="40" y="383" font-size="16" text-anchor="start" fill="#1c2833">Baufirma hat angeblich zu wenig Personal.</text></g></svg>