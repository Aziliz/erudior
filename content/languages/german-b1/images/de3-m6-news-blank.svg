<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 470" width="480" height="470" role="img"><title>A short local news article with its reporting signals (unlabeled)</title><rect width="480" height="470" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="#1c2833"><rect x="20" y="20" width="440" height="430" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="40" y="52" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">LOKALNACHRICHTEN</text><text x="440" y="52" font-size="14" text-anchor="end" fill="#1c2833">Seite 3</text><line x1="40" y1="62" x2="440" y2="62" stroke="#1c2833" stroke-width="2"/><text x="40" y="100" font-size="26" text-anchor="start" font-weight="bold" fill="#1c2833">Brücke bleibt gesperrt</text><text x="40" y="145" font-size="16" text-anchor="start" fill="#1c2833">Die Lindenbrücke in der Altstadt bleibt</text><text x="40" y="179" font-size="16" text-anchor="start" fill="#1c2833">bis Ende Mai gesperrt. Der Beton </text><text x="281.2" y="179" font-size="16" text-anchor="start" fill="#1c2833">sei</text><text x="40" y="213" font-size="16" text-anchor="start" fill="#1c2833">stärker beschädigt als erwartet, </text><text x="267.0" y="213" font-size="16" text-anchor="start" fill="#1c2833">erklärte</text><text x="40" y="247" font-size="16" text-anchor="start" fill="#1c2833">ein Sprecher der Stadt. </text><text x="209.1" y="247" font-size="16" text-anchor="start" fill="#1c2833">„Wir arbeiten so</text><text x="40" y="281" font-size="16" text-anchor="start" fill="#1c2833">schnell wie möglich“</text><text x="183.3" y="281" font-size="16" text-anchor="start" fill="#1c2833">, sagte er.</text><text x="40" y="315" font-size="16" text-anchor="start" fill="#1c2833">Einem Gutachten </text><text x="168.2" y="315" font-size="16" text-anchor="start" fill="#1c2833">zufolge</text><text x="219.8" y="315" font-size="16" text-anchor="start" fill="#1c2833"> waren die</text><text x="40" y="349" font-size="16" text-anchor="start" fill="#1c2833">Schäden schon seit Jahren bekannt. Die</text><text x="40" y="383" font-size="16" text-anchor="start" fill="#1c2833">Baufirma hat </text><text x="135.2" y="383" font-size="16" text-anchor="start" fill="#1c2833">angeblich</text><text x="203.8" y="383" font-size="16" text-anchor="start" fill="#1c2833"> zu wenig Personal.</text></g></svg>