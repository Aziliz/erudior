<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" role="img"><title>The sentence Plötzlich rief der Zeuge die Polizei an, split into five boxes, with labels</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="720" height="250" fill="#ffffff"/><text x="360.0" y="34" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">A separable verb in the simple past: anrufen → rief … an</text><rect x="32.0" y="80" width="140" height="56" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="102.0" y="115" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Plötzlich</text><line x1="102.0" y1="136" x2="102.0" y2="160" stroke="#1c2833" stroke-width="1.5"/><text x="102.0" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">position 1</text><rect x="186.0" y="80" width="90" height="56" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="231.0" y="115" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">rief</text><line x1="231.0" y1="136" x2="231.0" y2="160" stroke="#1c2833" stroke-width="1.5"/><text x="231.0" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">verb: past form</text><rect x="290.0" y="80" width="140" height="56" rx="4" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="360.0" y="115" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">der Zeuge</text><line x1="360.0" y1="136" x2="360.0" y2="160" stroke="#1c2833" stroke-width="1.5"/><text x="360.0" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">subject</text><rect x="444.0" y="80" width="150" height="56" rx="4" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="519.0" y="115" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">die Polizei</text><line x1="519.0" y1="136" x2="519.0" y2="160" stroke="#1c2833" stroke-width="1.5"/><text x="519.0" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">object</text><rect x="608.0" y="80" width="80" height="56" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="648.0" y="115" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">an.</text><line x1="648.0" y1="136" x2="648.0" y2="160" stroke="#1c2833" stroke-width="1.5"/><text x="648.0" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">separable prefix</text><path d="M231.0 78 L231.0 60 L648.0 60 L648.0 78" fill="none" stroke="#1c2833" stroke-width="2"/><text x="360.0" y="228" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">The two parts of the verb frame the sentence: past form in position 2, prefix at the end.</text></svg>