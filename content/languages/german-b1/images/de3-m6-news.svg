<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img"><title>A short local news article with its reporting signals highlighted</title><rect width="760" height="470" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="#1c2833"><rect x="20" y="20" width="440" height="430" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="40" y="52" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">LOKALNACHRICHTEN</text><text x="440" y="52" font-size="14" text-anchor="end" fill="#1c2833">Seite 3</text><line x1="40" y1="62" x2="440" y2="62" stroke="#1c2833" stroke-width="2"/><text x="40" y="100" font-size="26" text-anchor="start" font-weight="bold" fill="#1c2833">Brücke bleibt gesperrt</text><rect x="279.203125" y="163" width="24.46875" height="22" rx="3" fill="#f7ebcf" stroke="none" stroke-width="0"/><rect x="264.953125" y="197" width="57.390625" height="22" rx="3" fill="#dcf0e3" stroke="none" stroke-width="0"/><rect x="207.125" y="231" width="117.015625" height="22" rx="3" fill="#dde8f3" stroke="none" stroke-width="0"/><rect x="38" y="265" width="147.28125" height="22" rx="3" fill="#dde8f3" stroke="none" stroke-width="0"/><rect x="38" y="299" width="132.171875" height="22" rx="3" fill="#e8e2f3" stroke="none" stroke-width="0"/><rect x="166.171875" y="299" width="55.640625" height="22" rx="3" fill="#e8e2f3" stroke="none" stroke-width="0"/><rect x="133.234375" y="367" width="72.5625" height="22" rx="3" fill="#f8e1dc" stroke="none" stroke-width="0"/><text x="40" y="145" font-size="16" text-anchor="start" fill="#1c2833">Die Lindenbrücke in der Altstadt bleibt</text><text x="40" y="179" font-size="16" text-anchor="start" fill="#1c2833">bis Ende Mai gesperrt. Der Beton </text><text x="281.2" y="179" font-size="16" text-anchor="start" fill="#1c2833">sei</text><text x="40" y="213" font-size="16" text-anchor="start" fill="#1c2833">stärker beschädigt als erwartet, </text><text x="267.0" y="213" font-size="16" text-anchor="start" fill="#1c2833">erklärte</text><text x="40" y="247" font-size="16" text-anchor="start" fill="#1c2833">ein Sprecher der Stadt. </text><text x="209.1" y="247" font-size="16" text-anchor="start" fill="#1c2833">„Wir arbeiten so</text><text x="40" y="281" font-size="16" text-anchor="start" fill="#1c2833">schnell wie möglich“</text><text x="183.3" y="281" font-size="16" text-anchor="start" fill="#1c2833">, sagte er.</text><text x="40" y="315" font-size="16" text-anchor="start" fill="#1c2833">Einem Gutachten </text><text x="168.2" y="315" font-size="16" text-anchor="start" fill="#1c2833">zufolge</text><text x="219.8" y="315" font-size="16" text-anchor="start" fill="#1c2833"> waren die</text><text x="40" y="349" font-size="16" text-anchor="start" fill="#1c2833">Schäden schon seit Jahren bekannt. Die</text><text x="40" y="383" font-size="16" text-anchor="start" fill="#1c2833">Baufirma hat </text><text x="135.2" y="383" font-size="16" text-anchor="start" fill="#1c2833">angeblich</text><text x="203.8" y="383" font-size="16" text-anchor="start" fill="#1c2833"> zu wenig Personal.</text><rect x="490" y="132" width="26" height="24" rx="4" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="526" y="150" font-size="16" text-anchor="start" font-weight="bold" fill="#1c2833">Konjunktiv I verb</text><rect x="490" y="176" width="26" height="24" rx="4" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="526" y="194" font-size="16" text-anchor="start" font-weight="bold" fill="#1c2833">reporting verb</text><rect x="490" y="220" width="26" height="24" rx="4" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="526" y="238" font-size="16" text-anchor="start" font-weight="bold" fill="#1c2833">direct quotation</text><rect x="490" y="264" width="26" height="24" rx="4" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="526" y="282" font-size="16" text-anchor="start" font-weight="bold" fill="#1c2833">source (zufolge)</text><rect x="490" y="308" width="26" height="24" rx="4" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="526" y="326" font-size="16" text-anchor="start" font-weight="bold" fill="#1c2833">distancing adverb</text></g></svg>