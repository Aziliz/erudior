<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" font-family="sans-serif" font-size="16" fill="#1c2833" role="img"><title>Two sentences split into word boxes: an obwohl clause with the verb at the end, and a trotzdem sentence with the verb straight after trotzdem</title><rect x="0" y="0" width="760" height="390" fill="#ffffff"/><text x="20.0" y="50.0" font-size="17" text-anchor="start" font-weight="bold">obwohl: before the fact, verb at the end</text><rect x="40.6" y="92.0" width="269.8" height="48.0" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="175.5" y="124.0" font-size="20" text-anchor="middle">Sie arbeitet gern dort,</text><text x="175.5" y="162.0" font-size="14" text-anchor="middle" font-weight="bold">main clause</text><rect x="320.4" y="92.0" width="89.6" height="48.0" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="365.2" y="124.0" font-size="20" text-anchor="middle">obwohl</text><text x="365.2" y="162.0" font-size="14" text-anchor="middle" font-weight="bold">conjunction</text><rect x="420.0" y="92.0" width="110.8" height="48.0" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="475.4" y="124.0" font-size="20" text-anchor="middle">der Lohn</text><text x="475.4" y="162.0" font-size="14" text-anchor="middle" font-weight="bold">subject</text><rect x="540.8" y="92.0" width="100.2" height="48.0" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="590.9" y="124.0" font-size="20" text-anchor="middle">niedrig</text><text x="590.9" y="162.0" font-size="14" text-anchor="middle" font-weight="bold">middle</text><rect x="651.0" y="92.0" width="68.4" height="48.0" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="685.2" y="124.0" font-size="20" text-anchor="middle">ist.</text><text x="685.2" y="162.0" font-size="14" text-anchor="middle" font-weight="bold">verb at the end</text><text x="20.0" y="210.0" font-size="17" text-anchor="start" font-weight="bold">trotzdem: before the result, verb straight after</text><rect x="30.0" y="252.0" width="248.6" height="48.0" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="154.3" y="284.0" font-size="20" text-anchor="middle">Der Lohn ist niedrig.</text><text x="154.3" y="322.0" font-size="14" text-anchor="middle" font-weight="bold">the fact</text><rect x="288.6" y="252.0" width="110.8" height="48.0" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="344.0" y="284.0" font-size="20" text-anchor="middle">Trotzdem</text><text x="344.0" y="322.0" font-size="14" text-anchor="middle" font-weight="bold">position 1</text><rect x="409.4" y="252.0" width="110.8" height="48.0" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="464.8" y="284.0" font-size="20" text-anchor="middle">arbeitet</text><text x="464.8" y="322.0" font-size="14" text-anchor="middle" font-weight="bold">verb (position 2)</text><rect x="530.2" y="252.0" width="57.8" height="48.0" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="559.1" y="284.0" font-size="20" text-anchor="middle">sie</text><text x="559.1" y="322.0" font-size="14" text-anchor="middle" font-weight="bold">subject</text><rect x="598.0" y="252.0" width="132.0" height="48.0" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="664.0" y="284.0" font-size="20" text-anchor="middle">gern dort.</text><text x="664.0" y="322.0" font-size="14" text-anchor="middle" font-weight="bold">rest</text><text x="380.0" y="376.0" font-size="15" text-anchor="middle">Both sentences: "The pay is low, but she likes working there all the same."</text></svg>