<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img"><title>An extended participle phrase</title><rect width="760" height="300" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="30" y="90" width="66" height="58" rx="8" fill="#f8e1dc" stroke-width="2.5"/><text x="63.0" y="127" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">der</text><rect x="110" y="90" width="300" height="58" rx="8" fill="#ffffff" stroke-width="2.5"/><text x="260.0" y="127" font-size="22" text-anchor="middle" fill="#1c2833" stroke="none">beim Bau der neuen Brücke</text><rect x="424" y="90" width="140" height="58" rx="8" fill="#f7ebcf" stroke-width="2.5"/><text x="494.0" y="127" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">entdeckte</text><rect x="578" y="90" width="120" height="58" rx="8" fill="#f8e1dc" stroke-width="2.5"/><text x="638.0" y="127" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">Schatz</text><path d="M63 84 L63 50 L638 50 L638 84" stroke="#b03a2e" stroke-width="3.5"/><rect x="200" y="36" width="352" height="26" fill="#ffffff" stroke="none"/><text x="376" y="56" font-size="17" text-anchor="middle" font-weight="bold" fill="#9a2a1f" stroke="none">der … Schatz: one noun phrase</text><path d="M63.0 152 L63.0 170" stroke-width="1.5"/><text x="63.0" y="190" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">article</text><path d="M260.0 152 L260.0 170" stroke-width="1.5"/><text x="260.0" y="190" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">expansion</text><path d="M494.0 152 L494.0 170" stroke-width="1.5"/><text x="494.0" y="190" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">participle + ending</text><path d="M638.0 152 L638.0 170" stroke-width="1.5"/><text x="638.0" y="190" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">noun</text><path d="M260 214 L534 214" stroke-width="1.5" stroke-dasharray="5 5"/><text x="380" y="240" font-size="16" text-anchor="middle" font-style="italic" fill="#1c2833" stroke="none">the same as a relative clause:</text><text x="380" y="272" font-size="19" text-anchor="middle" fill="#1c2833" stroke="none">der Schatz, der beim Bau der neuen Brücke entdeckt wurde</text></g></svg>