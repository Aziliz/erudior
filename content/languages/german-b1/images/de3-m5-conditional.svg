<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" role="img"><title>The sentence Wenn ich mehr Zeit hätte, würde ich öfter kochen, split into boxes, with the role of each part labeled</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="300" fill="#ffffff"/><text x="390" y="32" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">An unreal condition: the wenn clause fills position 1</text><rect x="37.0" y="100" width="76" height="54" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="1.5"/><text x="75.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Wenn</text><rect x="125.0" y="100" width="150" height="54" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="200.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">ich mehr Zeit</text><rect x="287.0" y="100" width="88" height="54" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="331.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">hätte,</text><rect x="387.0" y="100" width="88" height="54" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="431.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">würde</text><rect x="487.0" y="100" width="56" height="54" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="515.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">ich</text><rect x="555.0" y="100" width="76" height="54" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="593.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">öfter</text><rect x="643.0" y="100" width="100" height="54" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="693.0" y="134" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">kochen.</text><path d="M37.0 94 L37.0 76 L375.0 76 L375.0 94" fill="none" stroke="#1c2833" stroke-width="2"/><text x="206.0" y="66" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">position 1: the whole wenn clause</text><path d="M431.0 94 L431.0 84 L693.0 84 L693.0 94" fill="none" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5"/><line x1="75.0" y1="154" x2="75.0" y2="178" stroke="#1c2833" stroke-width="1.5"/><text x="75.0" y="196" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">conjunction</text><line x1="331.0" y1="154" x2="331.0" y2="218" stroke="#1c2833" stroke-width="1.5"/><text x="331.0" y="236" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Konjunktiv II at the end</text><line x1="431.0" y1="154" x2="431.0" y2="178" stroke="#1c2833" stroke-width="1.5"/><text x="431.0" y="196" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">conjugated verb</text><line x1="515.0" y1="154" x2="515.0" y2="218" stroke="#1c2833" stroke-width="1.5"/><text x="515.0" y="236" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">subject</text><line x1="693.0" y1="154" x2="693.0" y2="178" stroke="#1c2833" stroke-width="1.5"/><text x="693.0" y="196" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">infinitive at the end</text><text x="390" y="282" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">After the wenn clause, the main clause starts with its verb.</text></svg>