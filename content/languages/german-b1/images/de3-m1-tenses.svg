<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img"><title>Five tenses on one timeline, with two reference points: damals in the past and Freitag in the future</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="720" height="350" fill="#ffffff"/><line x1="20" y1="180" x2="700" y2="180" stroke="#1c2833" stroke-width="3" marker-end="url(#arr)"/><line x1="360" y1="80" x2="360" y2="200" stroke="#1c2833" stroke-width="2" stroke-dasharray="6 5"/><text x="360" y="60" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">jetzt</text><line x1="220" y1="120" x2="220" y2="198" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="3 4"/><line x1="590" y1="120" x2="590" y2="198" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="3 4"/><text x="220" y="112" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">damals</text><text x="590" y="112" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Freitag</text><circle cx="110" cy="180" r="13" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="110" y="222" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Plusquamperfekt</text><text x="110" y="244" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie hatte gepackt.</text><circle cx="220" cy="180" r="13" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="220" y="284" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Präteritum / Perfekt</text><text x="220" y="306" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie fuhr los.</text><circle cx="360" cy="180" r="13" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="360" y="222" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Präsens</text><text x="360" y="244" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie arbeitet.</text><circle cx="500" cy="180" r="13" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="500" y="284" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Futur II</text><text x="500" y="306" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie wird es geschafft haben.</text><circle cx="590" cy="180" r="13" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="590" y="222" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Futur I</text><text x="590" y="244" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Sie wird feiern.</text><path d="M214 162 Q165 124 118 162" fill="none" stroke="#1c2833" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M584 162 Q545 124 508 162" fill="none" stroke="#1c2833" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="360.0" y="28" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Looking back from a point in the past and from a point in the future</text></svg>