<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520" role="img"><title>A newspaper front page</title><rect width="480" height="520" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif"><rect x="20" y="20" width="440" height="480" fill="#fbfaf6" stroke="#1c2833" stroke-width="2.5"/><text x="240" y="58" font-size="30" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Stadtanzeiger</text><line x1="36" y1="72" x2="444" y2="72" stroke="#1c2833" stroke-width="2"/><text x="36" y="92" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">Dienstag, 14. Mai</text><line x1="36" y1="102" x2="444" y2="102" stroke="#1c2833" stroke-width="1.5"/><text x="240" y="140" font-size="26" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Bäckerei durch Brand zerstört</text><rect x="244" y="160" width="200" height="140" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><path d="M274 290 L274 225 L324 190 L374 225 L374 290 Z" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><rect x="308" y="250" width="30" height="40" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><path d="M358 205 q10 -25 0 -40 q25 15 15 45 q15 -10 10 -25 q20 25 0 45 Z" fill="#f8e1dc" stroke="#b03a2e" stroke-width="2.5"/><path d="M388 290 L388 250 L423 250 L423 290" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="244" y="322" font-size="14" text-anchor="start" font-weight="normal" font-style="italic" fill="#1c2833">Die Feuerwehr am Sonntag</text><text x="244" y="340" font-size="14" text-anchor="start" font-weight="normal" font-style="italic" fill="#1c2833">in der Kirchgasse</text><text x="36" y="176" font-size="14" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">Altstadt. In der Nacht</text><text x="36" y="194" font-size="14" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">auf Sonntag ist …</text><re