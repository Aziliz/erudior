<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img"><title>The parts of a relative clause with a preposition</title><rect width="760" height="270" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="110" width="90" height="56" rx="8" fill="#ffffff" stroke-width="2.5"/><text x="65.0" y="146" font-size="22" text-anchor="middle" fill="#1c2833" stroke="none">Das ist</text><rect x="120" y="110" width="160" height="56" rx="8" fill="#f8e1dc" stroke-width="2.5"/><text x="200.0" y="146" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">die Kollegin</text><rect x="300" y="110" width="64" height="56" rx="8" fill="#f7ebcf" stroke-width="2.5"/><text x="332.0" y="146" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">mit</text><rect x="374" y="110" width="64" height="56" rx="8" fill="#dde8f3" stroke-width="2.5"/><text x="406.0" y="146" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">der</text><rect x="448" y="110" width="160" height="56" rx="8" fill="#ffffff" stroke-width="2.5"/><text x="528.0" y="146" font-size="22" text-anchor="middle" fill="#1c2833" stroke="none">ich ein Büro</text><rect x="618" y="110" width="110" height="56" rx="8" fill="#dcf0e3" stroke-width="2.5"/><text x="673.0" y="146" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">teile.</text><text x="289" y="150" font-size="24" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">,</text><path d="M200 104 C200 50 406 50 406 104" stroke="#b03a2e" stroke-width="3"/><path d="M398 94 L406 106 L414 94" stroke="#b03a2e" stroke-width="3"/><text x="303" y="40" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">gender and number: feminine singular</text><path d="M200.0 170 L200.0 178" stroke-width="1.5"/><text x="200.0" y="196" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">antecedent</text><path d="M332.0 170 L332.0 178" stroke-width="1.5"/><text x="332.0" y="196" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">preposition</text><path d="M406.0 170 L406.0 212" stroke-width="1.5"/><text x="406.0" y="230" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">relative pronoun</text><path d="M673.0 170 L673.0 178" stroke-width="1.5"/><text x="673.0" y="196" font-size="16" text-anchor="middle" fill="#1c2833" stroke="none">conjugated verb (last)</text><text x="380" y="262" font-size="16" text-anchor="middle" font-style="italic" fill="#1c2833" stroke="none">mit always takes the dative, so the case is dative: mit der</text></g></svg>