<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 640" width="760" height="640" role="img"><title>An official letter from a town office</title><rect width="760" height="640" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="none" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="40" y="14" width="680" height="612" rx="2" fill="#ffffff" stroke-width="2"/><text x="80" y="52" font-size="15" text-anchor="start" fill="#1c2833" stroke="none">Stadt Kronstein · Tiefbauamt · Marktplatz 1</text><path d="M80 60 L470 60" stroke-width="1"/><text x="80" y="92" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Frau</text><text x="80" y="116" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Petra Berger</text><text x="80" y="140" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Lindenstraße 14</text><text x="80" y="164" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Kronstein</text><text x="680" y="92" font-size="16" text-anchor="end" fill="#1c2833" stroke="none">Kronstein, 4. März 2026</text><text x="680" y="116" font-size="16" text-anchor="end" fill="#1c2833" stroke="none">Az.: TB-26/118</text><text x="80" y="222" font-size="18" text-anchor="start" font-weight="bold" fill="#1c2833" stroke="none">Sanierung der Lindenstraße</text><text x="80" y="246" font-size="18" text-anchor="start" font-weight="bold" fill="#1c2833" stroke="none">Ihre Anfrage vom 27. Februar 2026</text><text x="80" y="290" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Sehr geehrte Frau Berger,</text><text x="80" y="326" font-size="16" text-anchor="start" fill="#1c2833" stroke="none">bezüglich Ihrer Anfrage teilen wir Ihnen mit, dass die</text><text x="80" y="350" font-size="16" text-anchor="start" fill="#1c2833" stroke="none">Lindenstraße aufgrund der Sanierung der Wasserleitungen</text><text x="80" y="374" font-size="16" text-anchor="start" fill="#1c2833" stroke="none">vom 13. April bis voraussichtlich 29. Mai gesperrt wird.</text><rect x="80" y="410" width="560" height="10" rx="5" fill="#d5dbe1" stroke="none"/><rect x="80" y="434" width="590" height="10" rx="5" fill="#d5dbe1" stroke="none"/><rect x="80" y="458" width="420" height="10" rx="5" fill="#d5dbe1" stroke="none"/><text x="80" y="520" font-size="17" text-anchor="start" fill="#1c2833" stroke="none">Mit freundlichen Grüßen</text><text x="80" y="548" font-size="15" text-anchor="start" fill="#1c2833" stroke="none">im Auftrag</text><text x="80" y="590" font-size="17" text-anchor="start" font-style="italic" fill="#1c2833" stroke="none">Jana Albers</text><rect x="572" y="34" width="140" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="642.0" y="52" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">der Absender</text><rect x="602" y="122" width="110" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="657.0" y="140" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">das Datum</text><rect x="270" y="110" width="150" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="345.0" y="128" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">der Empfänger</text><rect x="582" y="216" width="130" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="647.0" y="234" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">der Betreff</text><rect x="592" y="272" width="120" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="652.0" y="290" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">die Anrede</text><rect x="552" y="502" width="160" height="26" rx="13" fill="#f7ebcf" stroke-width="1.5"/><text x="632.0" y="520" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833" stroke="none">die Grußformel</text></g></svg>