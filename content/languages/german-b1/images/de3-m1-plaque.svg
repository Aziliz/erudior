<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img"><title>A museum plaque giving the life of the fictional photographer Clara Brenner in short noun phrases</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="720" height="440" fill="#ffffff"/><rect x="40" y="20" width="640" height="400" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><rect x="54" y="34" width="612" height="372" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="360.0" y="76" font-family="sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Clara Brenner (1891–1974)</text><text x="360.0" y="102" font-family="sans-serif" font-size="17" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Fotografin</text><text x="170" y="144" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1891</text><text x="190" y="144" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Geburt in Lübeck</text><text x="170" y="178" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1910</text><text x="190" y="178" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">nach dem Abitur Ausbildung in einem Fotoatelier</text><text x="170" y="212" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1919</text><text x="190" y="212" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Gründung eines eigenen Ateliers in Hamburg</text><text x="170" y="246" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1933–1949</text><text x="190" y="246" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Aufenthalt in New York</text><text x="170" y="280" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1949</text><text x="190" y="280" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">nach ihrer Rückkehr Fotos vom Wiederaufbau</text><text x="170" y="314" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1960</text><text x="190" y="314" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Beginn des Ruhestands, Umzug an die Ostsee</text><text x="170" y="348" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="end">1974</text><text x="190" y="348" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Tod in Travemünde</text><text x="360.0" y="390" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">A fictional person (invented for this course).</text></svg>