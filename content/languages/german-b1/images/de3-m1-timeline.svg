<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img"><title>A timeline with three points: 1961 shortly before, 1961, and today</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="720" height="300" fill="#ffffff"/><line x1="30" y1="150" x2="690" y2="150" stroke="#1c2833" stroke-width="3" marker-end="url(#arr)"/><text x="690" y="180" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">time</text><circle cx="150" cy="150" r="13" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="150" y="186" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">1961, kurz zuvor</text><text x="150" y="212" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Die Tante war geflohen.</text><text x="150" y="238" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">past perfect</text><circle cx="360" cy="150" r="13" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="360" y="186" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">1961</text><text x="360" y="212" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Die Regierung baute die Mauer.</text><text x="360" y="238" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">simple past</text><circle cx="590" cy="150" r="13" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="590" y="186" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">heute</text><text x="590" y="212" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">Berlin ist wieder eine Stadt.</text><text x="590" y="238" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">present</text><path d="M352 134 Q255 50 168 134" fill="none" stroke="#1c2833" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="255" y="80" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">looking back</text><text x="360.0" y="28" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">The story is told at point B; the past perfect looks back to point A.</text><text x="150" y="278" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">A</text><text x="360" y="278" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">B</text><text x="590" y="278" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">now</text></svg>