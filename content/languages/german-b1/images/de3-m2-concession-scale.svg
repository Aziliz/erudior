<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="sans-serif" font-size="16" fill="#1c2833" role="img"><title>A scale from a real fact to an imagined, extreme case: obwohl (it is raining), auch wenn (rain or no rain) and selbst wenn (even in a storm); in each case we go out anyway</title><rect x="0" y="0" width="760" height="330" fill="#ffffff"/><text x="380.0" y="30.0" font-size="17" text-anchor="middle" font-weight="bold">How sure is the condition? The main clause happens anyway.</text><line x1="60.0" y1="260.0" x2="690.0" y2="260.0" stroke="#1c2833" stroke-width="3"/><path d="M690 250 L712 260 L690 270 Z" fill="#1c2833"/><text x="60.0" y="290.0" font-size="15" text-anchor="start">a real fact</text><text x="712.0" y="290.0" font-size="15" text-anchor="end">only imagined, maybe extreme</text><rect x="40.0" y="60.0" width="215.0" height="150.0" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="147.0" y="92.0" font-size="22" text-anchor="middle" font-weight="bold">obwohl</text><text x="147.0" y="128.0" font-size="16" text-anchor="middle" font-style="italic">Obwohl es regnet,</text><text x="147.0" y="152.0" font-size="16" text-anchor="middle" font-style="italic">gehen wir raus.</text><text x="147.0" y="188.0" font-size="15" text-anchor="middle">it IS raining</text><line x1="147.0" y1="210.0" x2="147.0" y2="252.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="5 4"/><circle cx="147" cy="260" r="7" fill="#1c2833"/><rect x="275.0" y="60.0" width="215.0" height="150.0" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="382.0" y="92.0" font-size="22" text-anchor="middle" font-weight="bold">auch wenn</text><text x="382.0" y="128.0" font-size="16" text-anchor="middle" font-style="italic">Auch wenn es regnet,</text><text x="382.0" y="152.0" font-size="16" text-anchor="middle" font-style="italic">gehen wir raus.</text><text x="382.0" y="188.0" font-size="15" text-anchor="middle">rain or no rain</text><line x1="382.0" y1="210.0" x2="382.0" y2="252.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="5 4"/><circle cx="382" cy="260" r="7" fill="#1c2833"/><rect x="510.0" y="60.0" width="215.0" height="150.0" rx="10" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="617.0" y="92.0" font-size="22" text-anchor="middle" font-weight="bold">selbst wenn</text><text x="617.0" y="128.0" font-size="16" text-anchor="middle" font-style="italic">Selbst wenn es stürmt,</text><text x="617.0" y="152.0" font-size="16" text-anchor="middle" font-style="italic">gehen wir raus.</text><text x="617.0" y="188.0" font-size="15" text-anchor="middle">even in a storm</text><line x1="617.0" y1="210.0" x2="617.0" y2="252.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="5 4"/><circle cx="617" cy="260" r="7" fill="#1c2833"/></svg>