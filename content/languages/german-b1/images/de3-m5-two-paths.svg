<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img"><title>Markus's story as two paths: what really happened (indicative) and what would have happened (Konjunktiv II)</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="470" fill="#ffffff"/><rect x="190" y="20" width="400" height="52" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="1.5"/><text x="390" y="52" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Montag, 7.58 Uhr: Der Zug fährt ab.</text><text x="195" y="116" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Was wirklich passiert ist</text><text x="195" y="136" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">(Indikativ)</text><text x="585" y="116" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Was passiert wäre</text><text x="585" y="136" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">(Konjunktiv II)</text><line x1="330" y1="72" x2="195" y2="96" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)"/><line x1="450" y1="72" x2="585" y2="96" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="7 5"/><rect x="25" y="156" width="340" height="56" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="195" y="190" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Er hat den Zug verpasst.</text><line x1="195" y1="212" x2="195" y2="254" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)"/><rect x="25" y="256" width="340" height="56" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="195" y="290" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Er hat Lena kennengelernt.</text><line x1="195" y1="312" x2="195" y2="354" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)"/><rect x="25" y="356" width="340" height="56" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="195" y="390" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Heute sind sie verheiratet.</text><rect x="415" y="156" width="340" height="56" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="7 5"/><text x="585" y="190" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Er hätte den Zug genommen.</text><line x1="585" y1="212" x2="585" y2="254" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="7 5"/><rect x="415" y="256" width="340" height="56" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="7 5"/><text x="585" y="290" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Er hätte Lena nie kennengelernt.</text><line x1="585" y1="312" x2="585" y2="354" stroke="#1c2833" stroke-width="1.5" marker-end="url(#arr)" stroke-dasharray="7 5"/><rect x="415" y="356" width="340" height="56" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="7 5"/><text x="585" y="390" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Er wäre in Hamburg geblieben.</text><text x="390" y="456" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Real events: perfect or simple past. Imagined past: hätte / wäre + participle.</text></svg>