<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img"><title>How Germany is governed</title><rect width="800" height="560" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#244d76"/></marker></defs><rect x="260" y="20" width="280" height="80" rx="10" fill="#e8e2f3" stroke="#1c2833" stroke-width="2.5"/><text x="400.0" y="50" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">der Bundespräsident</text><text x="400.0" y="74" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Staatsoberhaupt</text><rect x="30" y="170" width="300" height="110" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><text x="180.0" y="200" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">die Bundesregierung</text><text x="180.0" y="224" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Bundeskanzler(in)</text><text x="180.0" y="244" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Ministerinnen und Minister</text><rect x="30" y="350" width="300" height="96" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2.5"/><text x="180.0" y="380" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">der Bundestag</text><text x="180.0" y="404" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">630 Abgeordnete</text><rect x="470" y="350" width="300" height="96" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5"/><text x="620.0" y="380" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">der Bundesrat</text><text x="620.0" y="404" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Mitglieder der</text><text x="620.0" y="424" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">16 Landesregierungen</text><rect x="30" y="480" width="300" height="70" rx="10" fill="#f8e1dc" stroke="#1c2833" stroke-width="2.5"/><text x="180.0" y="510" font-size="19" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">die Wählerinnen und Wähler</text><text x="180" y="540" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">ab 18 Jahren</text><rect x="470" y="480" width="300" height="70" rx="10" fill="#ffffff" stroke="#1c2833" stroke-width="2.5"/><text x="620" y="521" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">die 16 Bundesländer</text><line x1="180" y1="480" x2="180" y2="450" stroke="#244d76" stroke-width="3" marker-end="url(#ah)"/><text x="190" y="470" font-size="15" text-anchor="start" font-weight="normal" font-style="italic" fill="#244d76">wählen</text><line x1="180" y1="350" x2="180" y2="284" stroke="#244d76" stroke-width="3" marker-end="url(#ah)"/><text x="192" y="322" font-size="15" text-anchor="start" font-weight="normal" font-style="italic" fill="#244d76">wählt den Kanzler / die Kanzlerin</text><line x1="330" y1="100" x2="250" y2="168" stroke="#244d76" stroke-width="3" marker-end="url(#ah)"/><text x="300" y="150" font-size="15" text-anchor="start" font-weight="normal" font-style="italic" fill="#244d76">ernennt</text><line x1="620" y1="480" x2="620" y2="450" stroke="#244d76" stroke-width="3" marker-end="url(#ah)"/><text x="630" y="470" font-size="15" text-anchor="start" font-weight="normal" font-style="italic" fill="#244d76">schicken</text><line x1="334" y1="398" x2="466" y2="398" stroke="#244d76" stroke-width="3" stroke-dasharray="8 6"/><text x="400" y="388" font-size="15" text-anchor="middle" font-weight="normal" font-style="italic" fill="#244d76">Gesetze</text></g></svg>