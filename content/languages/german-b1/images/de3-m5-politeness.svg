<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img"><title>Five ways to ask someone to close the window, from direct at the bottom to formal at the top</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="420" fill="#ffffff"/><text x="390" y="30" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Asking someone to close the window</text><rect x="90" y="340" width="560" height="52" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="104" y="363" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Schließen Sie bitte das Fenster.</text><text x="104" y="383" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">direct</text><rect x="112" y="274" width="560" height="52" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="297" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Können Sie bitte das Fenster schließen?</text><text x="126" y="317" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">polite</text><rect x="134" y="208" width="560" height="52" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="148" y="231" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Könnten Sie bitte das Fenster schließen?</text><text x="148" y="251" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">more polite</text><rect x="156" y="142" width="560" height="52" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="170" y="165" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Wären Sie so nett, das Fenster zu schließen?</text><text x="170" y="185" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">very polite</text><rect x="178" y="76" width="560" height="52" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="192" y="99" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Ich wäre Ihnen dankbar, wenn Sie das Fenster schließen könnten.</text><text x="192" y="119" font-family="sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">formal, in writing</text><line x1="50" y1="392" x2="50" y2="70" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arr)"/><text x="40" y="230" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" transform="rotate(-90 40 230)">more polite, more distant</text><text x="390" y="412" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">With friends, the top steps can sound ironic; with strangers they are normal manners.</text></svg>