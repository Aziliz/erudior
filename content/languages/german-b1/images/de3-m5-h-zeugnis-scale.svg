<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" width="780" height="420" role="img"><title>The usual grade scale of the satisfaction sentence in a German job reference, from sehr gut to mangelhaft</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="420" fill="#ffffff"/><text x="390" y="30" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">The satisfaction sentence: the usual scale</text><text x="390" y="54" font-family="sans-serif" font-size="16" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">„Sie erledigte ihre Aufgaben … “</text><rect x="30" y="72" width="180" height="48" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="102" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">1  sehr gut</text><rect x="222" y="72" width="528" height="48" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="238" y="102" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">stets zu unserer vollsten Zufriedenheit</text><rect x="30" y="132" width="180" height="48" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="162" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">2  gut</text><rect x="222" y="132" width="528" height="48" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="238" y="162" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">stets zu unserer vollen Zufriedenheit</text><rect x="30" y="192" width="180" height="48" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="222" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">3  befriedigend</text><rect x="222" y="192" width="528" height="48" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="238" y="222" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">zu unserer vollen Zufriedenheit</text><rect x="30" y="252" width="180" height="48" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="282" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">4  ausreichend</text><rect x="222" y="252" width="528" height="48" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="238" y="282" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">zu unserer Zufriedenheit</text><rect x="30" y="312" width="180" height="48" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="46" y="342" font-family="sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">5  mangelhaft</text><rect x="222" y="312" width="528" height="48" rx="6" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="238" y="342" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">im Großen und Ganzen zu unserer Zufriedenheit</text><text x="390" y="384" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Wordings vary a little between guides; the pattern (stets, voll, vollst-) stays the same.</text><text x="390" y="406" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Since a 2014 court ruling, „zur vollen Zufriedenheit“ (3) counts as the average.</text></svg>