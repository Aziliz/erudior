<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="780" height="440" role="img"><title>A scale of how sure a speaker is, from almost certain at the top (muss) to impossible at the bottom (kann nicht)</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="440" fill="#ffffff"/><text x="390" y="30" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Guessing with modal verbs: how sure is the speaker?</text><rect x="110" y="52" width="640" height="60" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="78" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Das muss stimmen.</text><text x="126" y="100" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">sure: a logical conclusion</text><text x="736" y="89" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">≈ bestimmt, sicher</text><rect x="110" y="124" width="640" height="60" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="150" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Das müsste stimmen.</text><text x="126" y="172" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">almost sure: if everything is as expected</text><text x="736" y="161" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">≈ eigentlich, normalerweise</text><rect x="110" y="196" width="640" height="60" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="222" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Das dürfte stimmen.</text><text x="126" y="244" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">probable: a careful estimate</text><text x="736" y="233" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">≈ wahrscheinlich, vermutlich</text><rect x="110" y="268" width="640" height="60" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="294" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Das könnte stimmen.</text><text x="126" y="316" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">possible, but open</text><text x="736" y="305" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">≈ vielleicht, möglicherweise</text><rect x="110" y="340" width="640" height="60" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="126" y="366" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Das kann nicht stimmen.</text><text x="126" y="388" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="start">impossible: ruled out</text><text x="736" y="377" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="end">≈ auf keinen Fall</text><line x1="60" y1="414" x2="60" y2="56" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arr)"/><text x="44" y="236" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" transform="rotate(-90 44 236)">surer</text><text x="430" y="430" font-family="sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">A rough guide, not exact percentages: tone and context matter too.</text></svg>