<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" role="img"><title>The parts of a short formal e-mail in German</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="470" fill="#ffffff"/><rect x="24" y="20" width="470" height="430" rx="4" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="56" font-family="sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="start">Betreff: Ihre Stellenanzeige vom 3. März</text><line x1="486" y1="51" x2="566" y2="51" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="106" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Sehr geehrte Damen und Herren,</text><line x1="486" y1="101" x2="566" y2="101" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="152" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">mit großem Interesse habe ich Ihre</text><text x="44" y="174" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Anzeige gelesen.</text><line x1="486" y1="158" x2="566" y2="158" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="228" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Bevor ich mich bewerbe, hätte ich</text><text x="44" y="250" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">noch zwei Fragen: Ist die Stelle</text><text x="44" y="272" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">befristet? Und wäre Homeoffice möglich?</text><line x1="486" y1="245" x2="566" y2="245" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="326" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Ich wäre Ihnen dankbar, wenn Sie</text><text x="44" y="348" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">mir kurz antworten könnten.</text><line x1="486" y1="332" x2="566" y2="332" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="394" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Mit freundlichen Grüßen</text><line x1="486" y1="389" x2="566" y2="389" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="428" font-family="sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="start">Daniel Okafor</text></svg>