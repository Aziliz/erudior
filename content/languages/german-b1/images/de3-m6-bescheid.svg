<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" width="780" height="720" role="img"><title>An official decision letter (Bescheid) from a town's road traffic office</title><rect width="780" height="720" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="#1c2833" xml:space="preserve"><rect x="20" y="20" width="480" height="680" rx="0" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="44" y="52" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">Stadt Musterstadt · Straßenverkehrsamt</text><text x="44" y="70" font-size="14" text-anchor="start" fill="#1c2833">Marktplatz 1 · 12345 Musterstadt</text><line x1="44" y1="80" x2="476" y2="80" stroke="#1c2833" stroke-width="1.5"/><text x="44" y="112" font-size="15" text-anchor="start" fill="#1c2833">Frau</text><text x="44" y="131" font-size="15" text-anchor="start" fill="#1c2833">Elif Kaya</text><text x="44" y="150" font-size="15" text-anchor="start" fill="#1c2833">Lindenweg 7</text><text x="44" y="169" font-size="15" text-anchor="start" fill="#1c2833">12345 Musterstadt</text><text x="476" y="112" font-size="14" text-anchor="end" fill="#1c2833">Aktenzeichen: BP-2027-0418</text><text x="476" y="131" font-size="14" text-anchor="end" fill="#1c2833">Datum: 03.05.2027</text><text x="476" y="150" font-size="14" text-anchor="end" fill="#1c2833">Ihr Sachbearbeiter: Herr Brandt</text><text x="44" y="214" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Ihr Antrag auf einen Bewohnerparkausweis</text><text x="44" y="233" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">vom 14.04.2027</text><text x="44" y="270" font-size="15" text-anchor="start" fill="#1c2833">Sehr geehrte Frau Kaya,</text><text x="44" y="300" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Bescheid</text><text x="44" y="321" font-size="15" text-anchor="start" fill="#1c2833">Ihr Antrag wird abgelehnt.</text><text x="44" y="356" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Begründung:</text><text x="44" y="377" font-size="15" text-anchor="start" fill="#1c2833">Das Fahrzeug ist nicht auf Sie zugelassen. Eine</text><text x="44" y="396" font-size="15" text-anchor="start" fill="#1c2833">Bestätigung der Halterin, dass Sie das Fahrzeug</text><text x="44" y="415" font-size="15" text-anchor="start" fill="#1c2833">dauerhaft nutzen, lag Ihrem Antrag nicht bei.</text><text x="44" y="450" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Rechtsbehelfsbelehrung:</text><text x="44" y="471" font-size="15" text-anchor="start" fill="#1c2833">Gegen diesen Bescheid kann innerhalb eines</text><text x="44" y="490" font-size="15" text-anchor="start" fill="#1c2833">Monats nach Bekanntgabe Widerspruch erhoben</text><text x="44" y="509" font-size="15" text-anchor="start" fill="#1c2833">werden. Der Widerspruch ist schriftlich oder zur</text><text x="44" y="528" font-size="15" text-anchor="start" fill="#1c2833">Niederschrift beim Straßenverkehrsamt einzulegen.</text><text x="44" y="568" font-size="15" text-anchor="start" fill="#1c2833">Mit freundlichen Grüßen</text><text x="44" y="592" font-size="15" text-anchor="start" fill="#1c2833">Im Auftrag</text><path d="M46 632 q10 -24 20 -4 q10 18 20 -8 q10 -16 24 4" fill="none" stroke="#1c2833" stroke-width="2"/><text x="44" y="660" font-size="15" text-anchor="start" fill="#1c2833">Brandt</text><line x1="478" y1="107" x2="515" y2="107" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="112" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Aktenzeichen (file number)</text><line x1="380" y1="209" x2="515" y2="209" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="214" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Betreff (subject)</text><line x1="240" y1="316" x2="515" y2="316" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="321" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Entscheidung (decision)</text><line x1="400" y1="380" x2="515" y2="372" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="377" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Begründung (reasons)</text><line x1="470" y1="480" x2="515" y2="466" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="471" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Rechtsbehelfsbelehrung</text><text x="520" y="491" font-size="15" text-anchor="start" fill="#1c2833">(how to object, deadline)</text><line x1="130" y1="588" x2="515" y2="587" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="4 3"/><text x="520" y="592" font-size="15" text-anchor="start" font-weight="bold" fill="#1c2833">Im Auftrag (on behalf of)</text></g></svg>