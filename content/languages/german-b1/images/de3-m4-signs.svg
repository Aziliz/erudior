<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" role="img"><title>Three signs</title><rect width="800" height="250" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif"><rect x="20" y="30" width="240" height="150" rx="8" fill="#dde8f3" stroke="#244d76" stroke-width="6"/><text x="140.0" y="79" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Hunde sind</text><text x="140.0" y="105" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">an der Leine</text><text x="140.0" y="131" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">zu führen.</text><rect x="135.0" y="180" width="10" height="50" fill="#b8c0c6" stroke="#1c2833" stroke-width="2"/><rect x="280" y="30" width="240" height="150" rx="8" fill="#f8e1dc" stroke="#b03a2e" stroke-width="6"/><text x="400.0" y="53" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Betreten der</text><text x="400.0" y="79" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Baustelle</text><text x="400.0" y="105" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">verboten!</text><text x="400.0" y="131" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Eltern haften für</text><text x="400.0" y="157" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">ihre Kinder.</text><rect x="395.0" y="180" width="10" height="50" fill="#b8c0c6" stroke="#1c2833" stroke-width="2"/><rect x="540" y="30" width="240" height="150" rx="8" fill="#dcf0e3" stroke="#1e7b45" stroke-width="6"/><text x="660.0" y="79" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Bitte den Rasen</text><text x="660.0" y="105" font-size="18" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">nicht betreten.</text><text x="660.0" y="131" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Die Stadtverwaltung</text><rect x="655.0" y="180" width="10" height="50" fill="#b8c0c6" stroke="#1c2833" stroke-width="2"/></g></svg>