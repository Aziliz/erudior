<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" width="660" height="440" role="img"><title>The four modules of the Goethe-Zertifikat B1 for adults</title><rect width="660" height="440" fill="#ffffff"/><g font-family="Helvetica, Arial, sans-serif" fill="#1c2833"><text x="330" y="36" font-size="19" text-anchor="middle" font-weight="bold" fill="#1c2833">Goethe-Zertifikat B1 (adults): four modules</text><rect x="30" y="60" width="290" height="130" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="46" y="92" font-size="19" text-anchor="start" font-weight="bold" fill="#1c2833">Lesen</text><text x="113.5" y="92" font-size="15" text-anchor="start" fill="#1c2833">(reading)</text><text x="46" y="122" font-size="15" text-anchor="start" fill="#1c2833">65 Minuten</text><text x="46" y="144" font-size="15" text-anchor="start" fill="#1c2833">5 Teile</text><rect x="340" y="60" width="290" height="130" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="356" y="92" font-size="19" text-anchor="start" font-weight="bold" fill="#1c2833">Hören</text><text x="423.5" y="92" font-size="15" text-anchor="start" fill="#1c2833">(listening)</text><text x="356" y="122" font-size="15" text-anchor="start" fill="#1c2833">ca. 40 Minuten</text><text x="356" y="144" font-size="15" text-anchor="start" fill="#1c2833">4 Teile</text><rect x="30" y="210" width="290" height="130" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="46" y="242" font-size="19" text-anchor="start" font-weight="bold" fill="#1c2833">Schreiben</text><text x="159.5" y="242" font-size="15" text-anchor="start" fill="#1c2833">(writing)</text><text x="46" y="272" font-size="15" text-anchor="start" fill="#1c2833">60 Minuten</text><text x="46" y="294" font-size="15" text-anchor="start" fill="#1c2833">3 Aufgaben: ~80, ~80, ~40 Wörter</text><rect x="340" y="210" width="290" height="130" rx="10" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="356" y="242" font-size="19" text-anchor="start" font-weight="bold" fill="#1c2833">Sprechen</text><text x="458.0" y="242" font-size="15" text-anchor="start" fill="#1c2833">(speaking)</text><text x="356" y="272" font-size="15" text-anchor="start" fill="#1c2833">ca. 15 Minuten, zu zweit</text><text x="356" y="294" font-size="15" text-anchor="start" fill="#1c2833">+ 15 Minuten Vorbereitung</text><text x="356" y="316" font-size="15" text-anchor="start" fill="#1c2833">3 Teile</text><rect x="30" y="365" width="600" height="52" rx="10" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="330" y="388" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Each module: 100 points; pass with 60.</text><text x="330" y="408" font-size="15" text-anchor="middle" fill="#1c2833">Modules can be taken and repeated separately.</text></g></svg>