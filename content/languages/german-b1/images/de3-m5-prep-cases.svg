<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" role="img"><title>Rules of thumb for the case after a fixed preposition: dative, accusative, or split for an</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="780" height="430" fill="#ffffff"/><text x="390" y="30" font-family="sans-serif" font-size="18" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">Fixed prepositions: which case? (rules of thumb)</text><rect x="24" y="50" width="230" height="330" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="139" y="80" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">+ Dativ</text><text x="139" y="106" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">mit, von, aus, nach, vor</text><line x1="40" y1="120" x2="238" y2="120" stroke="#1c2833" stroke-width="1.5"/><text x="139" y="152" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">zufrieden mit</text><text x="139" y="192" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">abhängen von</text><text x="139" y="232" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">bestehen aus</text><text x="139" y="272" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">sich sehnen nach</text><text x="139" y="312" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Angst vor</text><rect x="274" y="50" width="230" height="330" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="389" y="80" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">+ Akkusativ</text><text x="389" y="106" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">für, um, auf, über</text><line x1="290" y1="120" x2="488" y2="120" stroke="#1c2833" stroke-width="1.5"/><text x="389" y="152" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">dankbar für</text><text x="389" y="192" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">sich sorgen um</text><text x="389" y="232" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">stolz auf</text><text x="389" y="272" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">verzichten auf</text><text x="389" y="312" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">sich wundern über</text><rect x="524" y="50" width="232" height="330" rx="6" fill="#e8e2f3" stroke="#1c2833" stroke-width="1.5"/><text x="640" y="80" font-family="sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">an: split</text><text x="640" y="106" font-family="sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#1c2833" text-anchor="middle">it depends on the meaning</text><line x1="540" y1="120" x2="740" y2="120" stroke="#1c2833" stroke-width="1.5"/><text x="640" y="146" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">+ Akk: thinking,</text><text x="640" y="166" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">getting used to</text><text x="640" y="192" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">denken an</text><text x="640" y="218" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">sich gewöhnen an</text><line x1="564" y1="236" x2="716" y2="236" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="7 5"/><text x="640" y="262" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">+ Dat: interest,</text><text x="640" y="282" font-family="sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1c2833" text-anchor="middle">doubt, taking part</text><text x="640" y="308" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">interessiert an</text><text x="640" y="334" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">zweifeln an</text><text x="640" y="360" font-family="sans-serif" font-size="17" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">teilnehmen an</text><text x="390" y="412" font-family="sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#1c2833" text-anchor="middle">Rules of thumb, not laws: still learn each word with its preposition and case.</text></svg>