# German B1, module 1 honors lessons (round 2): notecards
# --- 05h1 Futur II ---
- {front: 'Futur II: how is it built?', back: 'werden (position 2) + participle + haben/sein at the end: Sie wird es geschafft haben. Er wird gegangen sein.', topic: Futur II}
- {front: 'Futur II: haben or sein?', back: 'The same helper as in the perfect: hat gelesen → wird gelesen haben; ist angekommen → wird angekommen sein.', topic: Futur II}
- {front: 'Futur II in a subordinate clause', back: 'werden goes to the very end: …, dass er den Zug verpasst haben wird.', topic: Futur II}
- {front: 'Futur II, use 1', back: 'Finished by a point in the future: Bis Freitag werde ich den Bericht geschrieben haben. (By Friday I will have written the report.)', topic: Futur II}
- {front: 'Futur II, use 2', back: 'A guess about the past: Er wird den Zug verpasst haben. = He has probably missed the train.', topic: Assumptions}
- {front: 'Er wird wohl krank sein. vs Er wird wohl krank gewesen sein.', back: 'Futur I + wohl: he is probably ill (now). Futur II + wohl: he was probably ill (in the past).', topic: Assumptions}
- {front: 'Everyday alternative to Bis Freitag werde ich es geschrieben haben', back: 'The perfect + time word: Bis Freitag habe ich es geschrieben.', topic: Futur II}
- {front: 'Everyday alternative to Er wird den Zug verpasst haben', back: 'Perfect + an adverb: Er hat den Zug wahrscheinlich (wohl, vermutlich) verpasst.', topic: Assumptions}
- {front: 'Er muss es gesehen haben.', back: 'He must have seen it: a modal with the perfect infinitive, a strong conclusion about the past (B2, recognise it).', topic: Assumptions}
- {front: 'Futur II: the most common mistake', back: 'Using the bare infinitive: not "wird … schreiben haben" but "wird … geschrieben haben".', topic: Futur II}
- {front: 'der Täter, der Verdacht, das Alibi, der Tatort', back: 'the culprit, suspicion, the alibi, the crime scene.', topic: Crime stories}
- {front: 'ermitteln, festnehmen, einbrechen', back: 'to investigate (police), to arrest (nahm fest, hat festgenommen), to break in (brach ein, ist eingebrochen).', topic: Crime stories}
# --- 05h2 Clause or phrase ---
- {front: 'als/wenn + clause → phrase', back: 'bei + dative: Als wir ankamen → bei unserer Ankunft.', topic: Time phrases}
- {front: 'nachdem + clause → phrase', back: 'nach + dative: Nachdem sie zurückgekehrt war → nach ihrer Rückkehr.', topic: Time phrases}
- {front: 'bevor + clause → phrase', back: 'vor + dative: Bevor der Bus abfuhr → vor der Abfahrt.', topic: Time phrases}
- {front: 'während + clause → phrase', back: 'während + genitive: Während er studierte → während seines Studiums.', topic: Time phrases}
- {front: 'seit + clause → phrase', back: 'seit + dative: Seit sie geheiratet haben → seit ihrer Heirat.', topic: Time phrases}
- {front: 'bis + clause → phrase; sobald + clause → phrase', back: 'bis zu + dative (bis zu seinem Ruhestand); gleich nach / sofort nach + dative (gleich nach ihrer Ankunft).', topic: Time phrases}
- {front: 'Three ways to make the noun', back: '-ung noun (die Gründung), short stem noun (die Ankunft, der Beginn, der Tod), or the infinitive as a noun (das Lesen, beim Lesen).', topic: Time phrases}
- {front: 'beim + nominalised infinitive', back: 'while doing: beim Autofahren, beim Lesen. Capital letter, neuter.', topic: Time phrases}
- {front: 'What happens to the subject in a time phrase?', back: 'It becomes a possessive (seit ihrer Heirat) or a genitive (die Heirat meiner Großeltern); von + dative in speech.', topic: Time phrases}
- {front: 'Turning a phrase back into a clause: the tense', back: 'Phrases have no tense. Choose it: nach dem Essen → nachdem wir gegessen hatten (one step back).', topic: Time clauses}
- {front: 'ehe, sooft, kaum …, als', back: 'before (formal), whenever, hardly … when. All send the verb to the end.', topic: Time clauses}
- {front: 'wurde geboren vs ist geboren', back: 'wurde geboren for people who have died (Clara Brenner wurde 1891 geboren); ist geboren for people who are alive.', topic: Life stories}
