# German B1, module 2 honors lessons (round 2): contrast, exceptions, concessive conditions and argument.
# Checked against German A1, A2 and B1 vocabulary (including other round-2 files): none of these terms exists elsewhere.

# --- 10h1 Whereas, however, unless (de3-m2-h-contrast) ---
- id: de3-m2-r2-w01
  lesson: de3-m2-h-contrast
  term: allerdings
  pos: adverb
  meanings: ['however (limiting what was just said)', however, though, mind you, admittedly, 'certainly (as an answer)']
  example: Die Wohnung ist schön. Allerdings ist sie klein.
  exampleEn: The flat is nice. It's small, though.
  note: 'In position 1 the verb comes next. As a short answer (Allerdings!) it means "It certainly is!"'
- id: de3-m2-r2-w02
  lesson: de3-m2-h-contrast
  term: hingegen
  pos: adverb
  meanings: ['by contrast (slightly formal)', by contrast, on the other hand, in contrast, whereas, however]
  example: Ich trinke Kaffee. Meine Frau hingegen trinkt nur Tee.
  exampleEn: I drink coffee. My wife, by contrast, drinks only tea.
  note: 'Slightly formal. Position 1 (verb next) or straight after the first element.'
- id: de3-m2-r2-w03
  lesson: de3-m2-h-contrast
  term: wohingegen
  pos: conjunction
  meanings: [whereas, while (contrast), while]
  example: Er zahlt bar, wohingegen ich mit Karte zahle.
  exampleEn: He pays cash, whereas I pay by card.
  note: 'Verb at the end. Formal; only for contrast, never for time.'
- id: de3-m2-r2-w04
  lesson: de3-m2-h-contrast
  term: andernfalls
  pos: adverb
  meanings: ['otherwise (formal)', otherwise, or else, if not, failing that]
  example: Bitte zahlen Sie bis Freitag, andernfalls kostet es mehr.
  exampleEn: Please pay by Friday, otherwise it costs more.
  note: 'Formal partner of sonst. In position 1 the verb comes next.'
- id: de3-m2-r2-w05
  lesson: de3-m2-h-contrast
  kind: phrase
  term: es sei denn
  pos: phrase
  meanings: [unless, except if]
  example: Wir gehen wandern, es sei denn, es regnet.
  exampleEn: We're going hiking unless it rains.
  note: 'Followed by a main clause (verb second): es sei denn, es regnet. Or: es sei denn, dass es regnet.'
- id: de3-m2-r2-w06
  lesson: de3-m2-h-contrast
  kind: phrase
  term: außer wenn
  alt: [ausser wenn]
  pos: phrase
  meanings: [except when, except if, unless]
  example: Ich fahre mit dem Rad, außer wenn es schneit.
  exampleEn: I cycle, except when it snows.
  note: 'Verb at the end, like wenn.'
- id: de3-m2-r2-w07
  lesson: de3-m2-h-contrast
  term: der Gegensatz
  pos: noun
  plural: die Gegensätze
  meanings: [contrast, opposite, difference, contradiction]
  example: Stadt und Land sind ein großer Gegensatz.
  exampleEn: Town and country are a big contrast.
- id: de3-m2-r2-w08
  lesson: de3-m2-h-contrast
  kind: phrase
  term: im Gegensatz zu
  pos: phrase
  meanings: [in contrast to, unlike, contrary to, as opposed to]
  example: Im Gegensatz zu meinem Bruder spreche ich kein Französisch.
  exampleEn: Unlike my brother, I don't speak French.
  note: 'zu + dative: im Gegensatz zu meinem Bruder. im Gegensatz dazu = in contrast.'
- id: de3-m2-r2-w09
  lesson: de3-m2-h-contrast
  term: die Gemeinsamkeit
  pos: noun
  plural: die Gemeinsamkeiten
  meanings: [something in common, common ground, similarity, shared feature, commonality]
  example: Wir haben viele Gemeinsamkeiten.
  exampleEn: We have a lot in common.
- id: de3-m2-r2-w10
  lesson: de3-m2-h-contrast
  term: sich unterscheiden
  pos: verb
  meanings: [to differ, to be different, to distinguish, to tell apart]
  example: Unsere Länder unterscheiden sich beim Bezahlen.
  exampleEn: Our countries differ when it comes to paying.
  note: 'Strong: unterschied, hat unterschieden. sich unterscheiden von (+ dative) = to differ from.'
- id: de3-m2-r2-w11
  lesson: de3-m2-h-contrast
  term: vergleichbar
  pos: adjective
  meanings: [comparable, similar]
  example: Die Preise sind vergleichbar.
  exampleEn: The prices are comparable.
- id: de3-m2-r2-w12
  lesson: de3-m2-h-contrast
  term: das Vorurteil
  pos: noun
  plural: die Vorurteile
  meanings: [prejudice, preconception, bias]
  example: Manche Vorurteile sind einfach falsch.
  exampleEn: Some prejudices are simply wrong.
- id: de3-m2-r2-w13
  lesson: de3-m2-h-contrast
  term: das Klischee
  pos: noun
  plural: die Klischees
  meanings: [cliché, stereotype]
  example: Das ist nur ein Klischee.
  exampleEn: That's just a cliché.
- id: de3-m2-r2-w14
  lesson: de3-m2-h-contrast
  term: die Pünktlichkeit
  pos: noun
  plural: —
  meanings: [punctuality, being on time]
  alt: [die Puenktlichkeit]
  example: Pünktlichkeit ist bei Terminen wichtig.
  exampleEn: Punctuality is important for appointments.
- id: de3-m2-r2-w15
  lesson: de3-m2-h-contrast
  term: der Ladenschluss
  pos: noun
  plural: —
  meanings: [shop closing time, closing time (of shops), closing time]
  example: Nach Ladenschluss kann man nur noch am Bahnhof einkaufen.
  exampleEn: After closing time you can only shop at the station.

# --- 10h2 Even if, no matter how (de3-m2-h-argument) ---
- id: de3-m2-r2-w16
  lesson: de3-m2-h-argument
  kind: phrase
  term: auch wenn
  pos: phrase
  meanings: [even if, even though]
  example: Ich komme mit, auch wenn ich müde bin.
  exampleEn: I'll come along, even if I'm tired.
  note: 'Verb at the end. The condition may be true or only possible.'
- id: de3-m2-r2-w17
  lesson: de3-m2-h-argument
  kind: phrase
  term: selbst wenn
  pos: phrase
  meanings: ['even if (stronger: even in the extreme case)', even if, even supposing]
  example: Selbst wenn es stürmt, gehen wir raus.
  exampleEn: Even if there's a storm, we're going out.
  note: 'Verb at the end; often with Konjunktiv II: selbst wenn ich Zeit hätte.'
- id: de3-m2-r2-w18
  lesson: de3-m2-h-argument
  term: bar
  pos: adverb
  meanings: [in cash, cash]
  example: Kann ich bar bezahlen?
  exampleEn: Can I pay in cash?
- id: de3-m2-r2-w19
  lesson: de3-m2-h-argument
  term: die Kartenzahlung
  pos: noun
  plural: die Kartenzahlungen
  meanings: [card payment, paying by card]
  example: Kartenzahlung ist hier erst ab 10 Euro möglich.
  exampleEn: Card payment is only possible here from 10 euros.
- id: de3-m2-r2-w20
  lesson: de3-m2-h-argument
  term: kontaktlos
  pos: adjective
  meanings: [contactless]
  example: Ich bezahle meistens kontaktlos.
  exampleEn: I usually pay contactless.
- id: de3-m2-r2-w21
  lesson: de3-m2-h-argument
  term: die Münze
  pos: noun
  plural: die Münzen
  meanings: [coin]
  alt: [die Muenze]
  example: Hast du eine Münze für den Einkaufswagen?
  exampleEn: Do you have a coin for the shopping trolley?
- id: de3-m2-r2-w22
  lesson: de3-m2-h-argument
  term: der Geldschein
  pos: noun
  plural: die Geldscheine
  meanings: [banknote, note, bill]
  example: Der Automat nimmt keine Geldscheine.
  exampleEn: The machine doesn't take banknotes.
- id: de3-m2-r2-w23
  lesson: de3-m2-h-argument
  term: das Zahlungsmittel
  pos: noun
  plural: die Zahlungsmittel
  meanings: [means of payment, method of payment, payment method]
  example: Bargeld ist ein beliebtes Zahlungsmittel.
  exampleEn: Cash is a popular means of payment.
- id: de3-m2-r2-w24
  lesson: de3-m2-h-argument
  term: überwachen
  pos: verb
  meanings: [to monitor, to watch, to supervise, to keep under surveillance, to observe]
  alt: [ueberwachen]
  example: Kameras überwachen den Bahnhof.
  exampleEn: Cameras monitor the station.
  note: 'Inseparable: überwacht, hat überwacht.'
- id: de3-m2-r2-w25
  lesson: de3-m2-h-argument
  term: die Erörterung
  pos: noun
  plural: die Erörterungen
  meanings: [argumentative essay, discursive essay, discussion]
  alt: [die Eroerterung]
  example: In der Erörterung wägt man Argumente ab.
  exampleEn: In an argumentative essay you weigh up arguments.
- id: de3-m2-r2-w26
  lesson: de3-m2-h-argument
  term: das Gegenargument
  pos: noun
  plural: die Gegenargumente
  meanings: [counterargument, argument against, objection]
  example: Es gibt auch wichtige Gegenargumente.
  exampleEn: There are important counterarguments too.
- id: de3-m2-r2-w27
  lesson: de3-m2-h-argument
  term: abwägen
  pos: verb
  meanings: [to weigh up, to weigh, to consider carefully, to balance]
  alt: [abwaegen]
  example: Wir müssen die Vor- und Nachteile abwägen.
  exampleEn: We have to weigh up the pros and cons.
  note: 'Separable: ich wäge ab; hat abgewogen (also: abgewägt).'
- id: de3-m2-r2-w28
  lesson: de3-m2-h-argument
  kind: phrase
  term: darüber hinaus
  alt: [darueber hinaus]
  pos: phrase
  meanings: [moreover, furthermore, in addition, beyond that, what is more]
  example: Darüber hinaus ist die Karte sicherer.
  exampleEn: Moreover, the card is safer.
  note: 'In position 1 the verb comes next.'
- id: de3-m2-r2-w29
  lesson: de3-m2-h-argument
  term: letztlich
  pos: adverb
  meanings: [ultimately, in the end, at the end of the day, finally]
  example: Letztlich geht es um Freiheit.
  exampleEn: In the end it's about freedom.
- id: de3-m2-r2-w30
  lesson: de3-m2-h-argument
  term: zusammenfassend
  pos: adverb
  meanings: [to sum up, in summary, to summarise, to summarize, in conclusion]
  example: Zusammenfassend lässt sich sagen, dass beide Seiten recht haben.
  exampleEn: To sum up, both sides are right.
- id: de3-m2-r2-w31
  lesson: de3-m2-h-argument
  term: die Anonymität
  pos: noun
  plural: —
  meanings: [anonymity]
  alt: [die Anonymitaet]
  example: Bargeld bietet Anonymität.
  exampleEn: Cash offers anonymity.
