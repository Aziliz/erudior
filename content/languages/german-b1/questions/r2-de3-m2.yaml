# German B1, module 2 (round 2): new question types for the core lessons, and the honors lessons.

# --- 06 de3-obwohl ---
- id: de3-m2-r2-q01
  lesson: de3-obwohl
  type: text
  module_quiz: true
  topic: Concession
  stem: 'Complete with obwohl or trotzdem: "Das Kleid war teuer. ___ habe ich es gekauft." and "Ich habe es gekauft, ___ es teuer war."'
  accept:
    - [trotzdem, dennoch]
    - [obwohl, obgleich]
  explanation: |-
    The first blank starts a new sentence and is followed straight away by the verb "habe", so it needs the linking adverb: Trotzdem (or the formal Dennoch). The second blank introduces the fact and the verb "war" is at the end, so it needs the conjunction obwohl. Both express the same logic: the price should have stopped the purchase, but it didn't.
- id: de3-m2-r2-q02
  lesson: de3-obwohl
  type: order
  topic: Concession
  stem: 'Put the words in order: "Although Lena earns little, she saves every month." The capitalised word comes first.'
  items: ['Obwohl', 'Lena', 'wenig', 'verdient,', 'spart', 'sie', 'jeden Monat.']
  explanation: |-
    Obwohl Lena wenig verdient, spart sie jeden Monat. After obwohl the conjugated verb "verdient" goes to the end of its clause. The whole obwohl clause then fills position 1, so the main verb "spart" comes straight after the comma, followed by the subject "sie".
- id: de3-m2-r2-q03
  lesson: de3-obwohl
  module_quiz: true
  topic: Concession
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Ich kaufe das Handy, obwohl es teuer ist.', 'Es ist teuer. Trotzdem ich kaufe es.', 'Das Handy ist zwar teuer, aber es ist sehr gut.', 'Trotzdem es teuer ist, kaufe ich es.', 'Obwohl es teuer ist, kaufe ich es.']
  answer: [0, 2, 4]
  explanation: |-
    obwohl sends the verb to the end ("obwohl es teuer ist"), and a fronted obwohl clause is followed by the main verb ("kaufe ich"). zwar … aber is correct as written. trotzdem is an adverb, not a conjunction: it needs the verb straight after it ("Trotzdem kaufe ich es"), and it can't introduce a clause like obwohl ("Trotzdem es teuer ist" is wrong).
- id: de3-m2-r2-q04
  lesson: de3-obwohl
  type: label
  topic: Connectors
  stem: 'Both sentences mean "The pay is low, but she likes working there all the same." What job does each numbered box do?'
  image: {src: images/de3-m2-obwohl-trotzdem-blank.svg, alt: 'Two sentences cut into word boxes. Sentence A: Sie arbeitet gern dort, / obwohl / der Lohn / niedrig / ist. Sentence B: Der Lohn ist niedrig. / Trotzdem / arbeitet / sie / gern dort. Five boxes have numbers below them.'}
  labels:
    - {x: 48.1, y: 44.9, text: Subordinating conjunction}
    - {x: 90.2, y: 44.9, text: Conjugated verb at the end}
    - {x: 45.3, y: 86.0, text: Linking adverb in position 1}
    - {x: 61.2, y: 86.0, text: Conjugated verb in position 2}
    - {x: 73.6, y: 86.0, text: Subject after the verb}
  distractors: [Coordinating conjunction (position 0), Infinitive with zu]
  explanation: |-
    1 obwohl is a subordinating conjunction, so 2 the conjugated verb "ist" goes to the end of its clause. In sentence B, 3 Trotzdem is a linking adverb in position 1, so 4 the verb "arbeitet" follows straight after it and 5 the subject "sie" comes after the verb. Neither sentence has a position-0 conjunction like aber or an infinitive with zu.
- id: de3-m2-r2-q05
  lesson: de3-obwohl
  type: match
  topic: Money
  stem: 'Match each German phrase to its meaning.'
  pairs:
    - [sich etwas leisten, to afford something]
    - [auf etwas verzichten, to do without something]
    - [Geld ausgeben, to spend money]
    - [Schulden machen, to get into debt]
    - [Das lohnt sich., It's worth it.]
  distractors: [to save money, to spend time]
  explanation: |-
    sich etwas leisten (with a dative pronoun: Ich kann mir das nicht leisten) = to afford; auf etwas verzichten = to do without; Geld ausgeben = to spend money; Schulden machen = to get into debt; Das lohnt sich = it's worth it. To save money is sparen, and spending time is Zeit verbringen, not ausgeben.

# --- 07 de3-um-zu-damit ---
- id: de3-m2-r2-q06
  lesson: de3-um-zu-damit
  type: text
  module_quiz: true
  topic: Infinitive clauses
  stem: 'Complete with um, damit or ohne: "Ich lerne Deutsch, ___ in Wien zu arbeiten." / "Ich erkläre es noch einmal, ___ du es verstehst." / "Er ist gegangen, ___ sich zu verabschieden."'
  accept:
    - [um]
    - [damit]
    - [ohne]
  explanation: |-
    1: same subject (I learn, I work) and zu + infinitive at the end: um … zu. 2: different subjects (I explain, you understand) and a full clause with the verb at the end: damit. 3: he left without saying goodbye: ohne … zu, which works like um … zu.
- id: de3-m2-r2-q07
  lesson: de3-um-zu-damit
  type: order
  topic: Infinitive clauses
  stem: 'Put the words in order: "To get a scholarship, you need good grades." The capitalised word comes first.'
  items: ['Um', 'ein Stipendium', 'zu bekommen,', 'braucht', 'man', 'gute Noten.']
  explanation: |-
    Um ein Stipendium zu bekommen, braucht man gute Noten. um starts the clause and zu + infinitive ends it. The whole um … zu clause fills position 1, so the main verb "braucht" comes straight after the comma, then the subject "man".
- id: de3-m2-r2-q08
  lesson: de3-um-zu-damit
  module_quiz: true
  topic: Infinitive clauses
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Meine Eltern sparen, um ich studieren kann.', 'Ich spare, um ein Auto zu kaufen.', 'Sie geht in die Bibliothek, um in Ruhe zu lernen.', 'Der Lehrer spricht langsam, um wir ihn verstehen.', 'Wir fahren früh los, um pünktlich anzukommen.']
  answer: [1, 2, 4]
  explanation: |-
    um … zu works only when the same person acts and has the goal, and it has no subject of its own: "um ein Auto zu kaufen", "um in Ruhe zu lernen", "um pünktlich anzukommen" (zu inside the separable verb). When the subjects differ, German needs damit + verb at the end: "damit ich studieren kann", "damit wir ihn verstehen".
- id: de3-m2-r2-q09
  lesson: de3-um-zu-damit
  type: label
  topic: Study
  stem: 'Name the numbered places on this campus.'
  image: {src: images/de3-m2-campus-blank.svg, alt: 'A campus map with five numbered places: a hall with curved rows of seats and a lectern, a building full of bookshelves, a building with a plate, knife and fork, a block with many windows and a bed, and a round yellow sign with a green H.'}
  labels:
    - {x: 23.0, y: 31.4, text: der Hörsaal}
    - {x: 76.3, y: 26.5, text: die Bibliothek}
    - {x: 17.1, y: 87.3, text: die Mensa}
    - {x: 50.7, y: 84.3, text: das Studentenwohnheim}
    - {x: 84.2, y: 77.3, text: die Bushaltestelle}
  distractors: [das Seminar, die Fachhochschule]
  explanation: |-
    1 rows of seats facing a lectern: der Hörsaal (lecture hall). 2 bookshelves: die Bibliothek. 3 plate and cutlery: die Mensa (university canteen). 4 many small rooms with beds: das Studentenwohnheim (hall of residence). 5 the green H on a yellow sign marks a bus stop in Germany: die Bushaltestelle. A Seminar is a small class, not a building, and a Fachhochschule is a whole institution.
- id: de3-m2-r2-q10
  lesson: de3-um-zu-damit
  type: match
  topic: Infinitive clauses
  stem: 'Match each beginning to the ending that completes it correctly.'
  pairs:
    - ['Er hat den Vertrag unterschrieben,', 'ohne ihn zu lesen.']
    - ['Statt für die Klausur zu lernen,', 'hat er Serien geschaut.']
    - ['Die Uni bietet Kurse an,', 'damit die Studierenden ihr Deutsch verbessern.']
    - ['Du brauchst', 'nicht zu kommen.']
  distractors: ['um du es verstehst.', 'ohne lesen den Vertrag.']
  explanation: |-
    ohne … zu + infinitive = without -ing; a fronted statt … zu clause is followed by the main verb ("hat er"); damit introduces a goal for a different subject (the university offers, the students improve); brauchen nicht … zu = don't have to. "um du es verstehst" mixes um with a subject, and "ohne lesen" copies the English -ing pattern.

# --- 08 de3-da-falls ---
- id: de3-m2-r2-q11
  lesson: de3-da-falls
  type: text
  module_quiz: true
  topic: Reasons and results
  stem: 'Complete with da, falls or sodass: "___ Sie umgezogen sind, müssen Sie Ihre Adresse ändern." / "Rufen Sie uns an, ___ Sie Fragen haben." / "Ich habe die Frist verpasst, ___ der Vertrag automatisch verlängert wurde."'
  accept:
    - [da, weil]
    - [falls, wenn]
    - [sodass, so dass]
  explanation: |-
    1: a known reason at the start of the sentence: Da (weil is also grammatical). 2: a possibility you prepare for: falls (wenn also works). 3: a result of missing the deadline: sodass (also spelled so dass). All three send the verb to the end.
- id: de3-m2-r2-q12
  lesson: de3-da-falls
  type: label
  topic: Insurance
  stem: 'This timeline shows a 12-month contract. Name each numbered part.'
  image: {src: images/de3-m2-contract-blank.svg, alt: 'A timeline of a mobile phone contract in 2026 with five numbered parts: the line at 1 January, the long bar from January to December, a short block in December after 30 November, the line at 31 December, and a dashed arrow into 2027.'}
  labels:
    - {x: 7.9, y: 53.3, text: der Vertragsbeginn}
    - {x: 40.5, y: 38.7, text: die Laufzeit}
    - {x: 76.0, y: 52.0, text: die Kündigungsfrist}
    - {x: 78.9, y: 29.3, text: das Vertragsende}
    - {x: 88.2, y: 38.7, text: die Verlängerung}
  distractors: [die Selbstbeteiligung, der Schadensfall]
  explanation: |-
    1 the contract starts on 1 January (der Vertragsbeginn). 2 it runs for twelve months (die Laufzeit). 3 the last month is the notice period (die Kündigungsfrist): you must cancel before it begins, by 30 November. 4 it ends on 31 December (das Vertragsende). 5 if nobody cancels, it is renewed (die Verlängerung). Selbstbeteiligung (excess) and Schadensfall (claim) belong to insurance claims, not to the timeline.
- id: de3-m2-r2-q13
  lesson: de3-da-falls
  type: order
  topic: Insurance
  stem: 'Put the steps of an insurance claim in order, as in Tobias''s letter.'
  items: ['Der Schaden passiert.', 'Man meldet den Schaden.', 'Man schickt die fehlenden Unterlagen.', 'Die Versicherung bearbeitet den Fall.', 'Die Versicherung zahlt den Ersatz.']
  explanation: |-
    First the damage happens (the bike is stolen), then Tobias reports it. The insurer can't process the claim until the missing documents arrive, and it pays compensation (current value minus the excess) only after processing the case.
- id: de3-m2-r2-q14
  lesson: de3-da-falls
  module_quiz: true
  topic: Reasons and results
  stem: 'Which words are linking adverbs, followed straight away by the verb when they start a sentence (like deshalb)? Select all that apply.'
  choices: ['daher', 'sodass', 'falls', 'deswegen', 'also', 'da (since)']
  answer: [0, 3, 4]
  explanation: |-
    daher, deswegen and also (so, therefore) are linking adverbs: Daher können wir nicht zahlen. sodass, falls and da (since) are subordinating conjunctions: they send the verb to the end of their own clause (da es regnet, falls Sie Fragen haben).
- id: de3-m2-r2-q15
  lesson: de3-da-falls
  type: match
  topic: Connectors
  stem: 'Match each connector to its meaning.'
  pairs:
    - [da, since (a known reason)]
    - [falls, in case]
    - [sodass, with the result that]
    - [daher, therefore (formal)]
    - [also, so (a conclusion)]
  distractors: ['too, as well', in order that]
  explanation: |-
    da gives a reason the reader already knows; falls a possibility; sodass a result; daher is the formal "therefore"; also means "so, therefore" (a false friend: English "also" is auch). "in order that" is a goal, which is damit (lesson 7).

# --- 09 de3-two-part ---
- id: de3-m2-r2-q16
  lesson: de3-two-part
  type: text
  module_quiz: true
  topic: Two-part connectors
  stem: 'Complete the pairs: "Ich habe ___ Zeit noch Geld." / "Wir fahren ___ heute oder morgen." / "Sie spricht nicht nur Deutsch, ___ auch Polnisch."'
  accept:
    - [weder]
    - [entweder]
    - [sondern]
  explanation: |-
    weder … noch (neither … nor), entweder … oder (either … or), nicht nur … sondern auch (not only … but also). After nicht nur the partner is sondern, never aber.
- id: de3-m2-r2-q17
  lesson: de3-two-part
  type: label
  topic: Housing
  stem: 'Name the four kinds of building.'
  image: {src: images/de3-m2-houses-blank.svg, alt: 'Four numbered buildings in a row: a detached house with a fence and a tree, three joined narrow houses, a four-storey block of flats, and a tall tower with many floors.'}
  labels:
    - {x: 11.8, y: 60.6, text: das Einfamilienhaus}
    - {x: 39.5, y: 63.6, text: das Reihenhaus}
    - {x: 63.8, y: 51.5, text: das Mehrfamilienhaus}
    - {x: 88.2, y: 42.4, text: das Hochhaus}
  distractors: [die WG, das Treppenhaus]
  explanation: |-
    1 a house for one family standing on its own: das Einfamilienhaus. 2 houses joined in a row: das Reihenhaus. 3 a building with flats for several families: das Mehrfamilienhaus. 4 a tall tower block: das Hochhaus. A WG is a flat-share (a way of living, not a building), and das Treppenhaus is the stairwell inside a building.
- id: de3-m2-r2-q18
  lesson: de3-two-part
  module_quiz: true
  topic: Two-part connectors
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Ich habe weder kein Auto noch kein Fahrrad.', 'Sowohl Tom als auch Lea wohnen in einer WG.', 'Die Wohnung ist nicht nur laut, aber auch teuer.', 'Die Wohnung ist nicht nur laut, sondern auch teuer.', 'Entweder du sprichst mit den Nachbarn, oder ich mache es.']
  answer: [1, 3, 4]
  explanation: |-
    sowohl … als auch adds the subjects, so the verb is plural (wohnen). nicht nur is followed by sondern auch, not aber auch. entweder can stand in position 0, so "Entweder du sprichst …" is fine. weder … noch is already negative: "weder ein Auto noch ein Fahrrad", without kein.
- id: de3-m2-r2-q19
  lesson: de3-two-part
  type: match
  topic: Two-part connectors
  stem: 'A flat may have a balcony (B) and a garden (G). Match each sentence pattern to what it says.'
  pairs:
    - ['sowohl B als auch G', 'both']
    - ['weder B noch G', 'neither']
    - ['entweder B oder G', 'one of the two']
    - ['nicht nur B, sondern auch G', 'both, with the second as extra news']
  distractors: ['only the first']
  explanation: |-
    sowohl … als auch = both; weder … noch = neither; entweder … oder = one or the other; nicht nur … sondern auch also means both, but presents the second item as the surprising addition.
- id: de3-m2-r2-q20
  lesson: de3-two-part
  type: order
  topic: Two-part connectors
  stem: 'Put the words in order: "Neither the landlord nor the caretaker has got in touch." The capitalised word comes first.'
  items: ['Weder', 'der Vermieter', 'noch', 'die Hausmeisterin', 'hat', 'sich', 'gemeldet.']
  explanation: |-
    Weder der Vermieter noch die Hausmeisterin hat sich gemeldet. The whole subject "weder der Vermieter noch die Hausmeisterin" fills position 1, the verb "hat" comes second, the reflexive pronoun follows, and the participle "gemeldet" goes to the end. (With weder … noch, "haben" in the plural would also be correct.)

# --- 10 de3-je-desto ---
- id: de3-m2-r2-q21
  lesson: de3-je-desto
  type: text
  module_quiz: true
  topic: Comparison
  stem: 'Complete with the comparative: "Je ___ (früh) du anfängst, desto ___ (leicht) ist es."'
  accept:
    - [früher, frueher]
    - [leichter]
  explanation: |-
    je and desto are each followed by a comparative: früh → früher, leicht → leichter. The je part has the verb at the end (anfängst); the desto part has the verb straight after the comparative (ist es).
- id: de3-m2-r2-q22
  lesson: de3-je-desto
  type: order
  topic: Comparison
  stem: 'Put the words in order: "The more I train, the fitter I get." The capitalised words come first.'
  items: ['Je mehr', 'ich', 'trainiere,', 'desto fitter', 'werde', 'ich.']
  explanation: |-
    Je mehr ich trainiere, desto fitter werde ich. In the je clause the verb goes to the end; in the desto clause "desto fitter" fills position 1, so the verb "werde" comes next and the subject "ich" after it.
- id: de3-m2-r2-q23
  lesson: de3-je-desto
  module_quiz: true
  topic: Comparison
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Lisa ist die schnellste Läuferin.', 'Lisa läuft am schnellsten.', 'Lisa ist die am schnellsten Läuferin.', 'Wir brauchen einen besser Trainer.', 'Immer mehr Menschen gehen ins Fitnessstudio.']
  answer: [0, 1, 4]
  explanation: |-
    Before a noun the superlative takes der/die/das + -ste + ending (die schnellste Läuferin); without a noun it is am + -sten (läuft am schnellsten). am never stands before a noun. A comparative before a noun needs its ending too: einen besseren Trainer. immer + comparative (immer mehr) means "more and more".
- id: de3-m2-r2-q24
  lesson: de3-je-desto
  type: match
  topic: Comparison
  stem: 'Look at the race result. Match each runner to the sentence about her.'
  image: {src: images/de3-m2-podium.svg, alt: 'A podium for a 10 km city run: Lea first in 41:20, Aylin second in 43:05, Mia third in 44:50.'}
  pairs:
    - [Lea, ist am schnellsten gelaufen.]
    - [Aylin, 'war schneller als Mia, aber langsamer als Lea.']
    - [Mia, hat die längste Zeit gebraucht.]
  distractors: [war schneller als Lea.]
  explanation: |-
    Lea had the shortest time (41:20), so she ran the fastest. Aylin (43:05) was between the two. Mia's 44:50 is the longest time. Nobody was faster than Lea.
- id: de3-m2-r2-q25
  lesson: de3-je-desto
  type: match
  topic: Comparison
  stem: 'Match each adjective to its superlative before a noun.'
  pairs:
    - [gut, das beste Ergebnis]
    - [hoch, der höchste Berg]
    - [nah, das nächste Spiel]
    - [viel, die meisten Spieler]
    - [groß, die größte Halle]
  distractors: [das höhste Gewicht, die größeste Halle]
  explanation: |-
    gut → beste, hoch → höchste (with ch again), nah → nächste (with ch), viel → meiste, groß → größte (no extra e). "höhste" and "größeste" are typical mistakes.

# --- 10h1 de3-m2-h-contrast (honors) ---
- id: de3-m2-r2-h01
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: 'Complete: "Ich trinke gern Kaffee, ___ mein Mann nur Tee trinkt."'
  choices: ['obwohl', 'während', 'trotzdem', 'deshalb']
  answer: 1
  explanation: |-
    Two different tastes side by side, and neither should prevent the other: a contrast, so während (whereas). obwohl would say that his tea-drinking should stop me drinking coffee. trotzdem and deshalb are adverbs and would need the verb straight after them.
- id: de3-m2-r2-h02
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: 'Which sentence is correct?'
  choices: ['Er zahlt bar, wohingegen ich zahle mit Karte.', 'Er zahlt bar, wohingegen zahle ich mit Karte.', 'Er zahlt bar, wohingegen mit Karte ich zahle.', 'Er zahlt bar, wohingegen ich mit Karte zahle.']
  answer: 3
  explanation: |-
    wohingegen is a subordinating conjunction like während, so the conjugated verb "zahle" goes to the end: wohingegen ich mit Karte zahle. The other versions use main-clause or random word order.
- id: de3-m2-r2-h03
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: 'Complete: "Die Miete in München ist sehr hoch. In Leipzig hingegen ___ niedriger."'
  choices: ['sie ist viel', 'viel sie ist', 'ist sie viel', 'sie viel ist']
  answer: 2
  explanation: |-
    "In Leipzig hingegen" counts as one block in position 1, so the verb comes next and then the subject: "In Leipzig hingegen ist sie viel niedriger." hingegen is a linking adverb, not a conjunction, so the verb does not go to the end.
- id: de3-m2-r2-h04
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: 'What does dagegen mean in these two sentences? (a) "Ich bin dagegen." (b) "In Wien dagegen ist es ruhiger."'
  choices: ['(a) against it, (b) on the other hand', '(a) on the other hand, (b) against it', '(a) against it, (b) against it', '(a) nevertheless, (b) on the other hand']
  answer: 0
  explanation: |-
    In (a) dagegen is the da-word of gegen: "I'm against it." In (b) it compares Vienna with another place: "In Vienna, on the other hand, it's quieter." The context (a comparison or not) tells you which one is meant.
- id: de3-m2-r2-h05
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: '"War die Reise teuer?" – "Allerdings!" What does the answer mean?'
  choices: ['No, not at all.', 'However, it was cheap.', 'I don''t know.', 'Yes, it certainly was!']
  answer: 3
  explanation: |-
    As a short answer on its own, Allerdings! is strong agreement: "It certainly was!" Inside a sentence allerdings means "however, though" and limits what was said before.
- id: de3-m2-r2-h06
  lesson: de3-m2-h-contrast
  topic: Connectors
  stem: 'Which sentence means "We''ll have a barbecue tomorrow unless it rains"?'
  choices: ['Wir grillen morgen, es sei denn, es regnet.', 'Wir grillen morgen, es sei denn, es regnet nicht.', 'Wir grillen morgen, es sei denn, es morgen regnet.', 'Wir grillen morgen, außer wenn es regnet nicht.']
  answer: 0
  explanation: |-
    es sei denn is followed by a normal main clause with the verb in second place ("es regnet"), and it already contains the "not" of unless. Adding nicht turns it into "unless it doesn't rain". Putting the verb at the end after es sei denn is wrong unless you add dass ("es sei denn, dass es regnet"). außer wenn would also work, but without the nicht: "außer wenn es regnet".
- id: de3-m2-r2-h07
  lesson: de3-m2-h-contrast
  topic: Culture
  stem: 'Look at the sign. It is an ordinary Sunday, 10:30. Lukas wants to buy two rolls for 1.20 euros. What is true?'
  image: {src: images/de3-m2-bakery-sign.svg, alt: 'A bakery door sign: Bäckerei Krume. Öffnungszeiten: Mo – Fr 6:30 – 18:30, Sa 7:00 – 13:00, So 8:00 – 11:00. Feiertags geschlossen. Kartenzahlung ab 10 €.'}
  choices: ['The bakery is closed, so he can''t buy anything.', 'He can pay by card because it is Sunday.', 'He can buy them, but he has to pay cash.', 'He can only buy them after 11:00.']
  answer: 2
  explanation: |-
    On Sundays (So) the bakery is open from 8:00 to 11:00, so at 10:30 it is open. Card payment is only possible from 10 euros (Kartenzahlung ab 10 €), so for 1.20 euros he has to pay cash. It closes at 11:00, it doesn't open then.
- id: de3-m2-r2-h08
  lesson: de3-m2-h-contrast
  type: text
  topic: Connectors
  stem: 'Rewrite the bakery rule with es sei denn: "Man kann nur bar bezahlen, es sei denn, man ___ mindestens 10 Euro ___." (ausgeben)'
  accept:
    - [gibt]
    - [aus]
  explanation: |-
    After es sei denn comes a normal main clause: the conjugated verb in second place (gibt) and the separable prefix at the end (aus): "es sei denn, man gibt mindestens 10 Euro aus". With außer wenn the verb would go to the end and join up: "außer wenn man mindestens 10 Euro ausgibt".
- id: de3-m2-r2-h09
  lesson: de3-m2-h-contrast
  type: text
  topic: Contrast
  stem: 'Complete: "In Hamburg regnet es oft, ___ es in München mehr Sonne gibt." (whereas) / "Das Hotel war schön. ___ war das Frühstück teuer." (however)'
  accept:
    - [während, wohingegen, waehrend]
    - [allerdings, jedoch]
  explanation: |-
    1: a contrast with the verb (gibt) at the end: während or wohingegen. 2: the verb (war) comes straight after the gap, so it must be a linking adverb in position 1: Allerdings (or Jedoch). aber is position 0 and would need "Aber das Frühstück war teuer".
- id: de3-m2-r2-h10
  lesson: de3-m2-h-contrast
  type: match
  topic: Connectors
  stem: 'Match each connector to the word order that follows it.'
  pairs:
    - [während (whereas), verb at the end]
    - [hingegen, verb straight after it]
    - [es sei denn, comma and a normal main clause]
    - [außer wenn, verb at the end]
    - [allerdings, verb straight after it]
  distractors: [no effect on word order (position 0)]
  explanation: |-
    während, wohingegen and außer wenn are subordinating: verb at the end. hingegen, dagegen and allerdings are linking adverbs: verb straight after them in position 1. es sei denn is followed by a comma and a main clause with the verb second (es sei denn, es regnet). Only und, aber, oder, denn and sondern leave the order unchanged.
- id: de3-m2-r2-h11
  lesson: de3-m2-h-contrast
  topic: Contrast
  stem: 'Which sentences express a contrast (two different things side by side) rather than a concession? Select all that apply.'
  choices: ['Meine Schwester ist ordentlich, während ich lieber im Chaos lebe.', 'Obwohl es regnet, gehen wir spazieren.', 'Ich trinke Kaffee. Mein Mann hingegen trinkt Tee.', 'Im Gegensatz zu dir koche ich nicht gern.', 'Das Auto ist alt. Trotzdem fährt es gut.']
  answer: [0, 2, 3]
  explanation: |-
    während, hingegen and im Gegensatz zu put two different people side by side; you could swap the halves without changing the meaning. obwohl and trotzdem are concessive: rain should stop a walk, and age should stop a car running well.
- id: de3-m2-r2-h12
  lesson: de3-m2-h-contrast
  type: order
  topic: Contrast
  stem: 'Put the words in order: "Unlike my brother, I don''t speak French." The capitalised words come first.'
  items: ['Im Gegensatz', 'zu', 'meinem Bruder', 'spreche', 'ich', 'kein Französisch.']
  explanation: |-
    Im Gegensatz zu meinem Bruder spreche ich kein Französisch. The phrase "im Gegensatz zu meinem Bruder" (zu + dative) fills position 1, so the verb "spreche" comes next and the subject "ich" follows it.
- id: de3-m2-r2-h13
  lesson: de3-m2-h-contrast
  topic: Culture
  stem: 'In Jake''s blog post, what does he say about punctuality?'
  choices: ['Germans are always on time, and trains too.', 'His flatmate thinks arriving early looks uninterested.', 'Punctuality matters only for trains.', 'Germans are sometimes late too, but for appointments it is better to come a little early.']
  answer: 3
  explanation: |-
    "Im Gegensatz zu meinen Erwartungen kommen auch Deutsche manchmal zu spät": contrary to his expectations, Germans are sometimes late too. His flatmate's advice is to come five minutes early to appointments, "andernfalls denken die Leute, du hast kein Interesse": otherwise people think you aren't interested.
- id: de3-m2-r2-h14
  lesson: de3-m2-h-contrast
  type: match
  topic: Culture
  stem: 'Match each word to its meaning.'
  pairs:
    - [das Vorurteil, prejudice]
    - [die Gemeinsamkeit, something in common]
    - [vergleichbar, comparable]
    - [der Ladenschluss, shop closing time]
    - [andernfalls, otherwise]
  distractors: [difference, punctuality]
  explanation: |-
    das Vorurteil = prejudice (literally a judgement made beforehand); die Gemeinsamkeit = something in common; vergleichbar = comparable; der Ladenschluss = closing time of shops; andernfalls = otherwise (formal sonst). A difference is der Unterschied, and punctuality is die Pünktlichkeit.

# --- 10h2 de3-m2-h-argument (honors) ---
- id: de3-m2-r2-h15
  lesson: de3-m2-h-argument
  topic: Concession
  stem: 'Complete: "___ es morgen schneien sollte, fahren wir los."'
  choices: ['Obwohl', 'Auch wenn', 'Trotzdem', 'Weil']
  answer: 1
  explanation: |-
    Tomorrow's snow is only a possibility (sollte), and it won't change the plan: auch wenn (even if). obwohl is only for real facts, weil gives a reason (snow is no reason to leave), and trotzdem is an adverb that can't introduce a clause.
- id: de3-m2-r2-h16
  lesson: de3-m2-h-argument
  topic: Concession
  stem: 'Which sentence is correct?'
  choices: ['Selbst wenn ich habe Zeit, gehe ich nicht.', 'Selbst wenn ich Zeit habe, ich gehe nicht.', 'Selbst wenn ich Zeit habe, gehe ich nicht.', 'Selbst ich Zeit habe, gehe ich nicht.']
  answer: 2
  explanation: |-
    selbst wenn sends the verb to the end (ich Zeit habe), and when the clause comes first, the main verb follows straight after the comma (gehe ich). selbst alone, without wenn, can't introduce a clause.
- id: de3-m2-r2-h17
  lesson: de3-m2-h-argument
  topic: Concession
  stem: 'Which sentence describes an extreme, imagined case?'
  choices: ['Selbst wenn ich im Lotto gewinnen würde, würde ich weiterarbeiten.', 'Obwohl ich müde bin, arbeite ich weiter.', 'Weil ich müde bin, gehe ich ins Bett.', 'Wenn ich müde bin, trinke ich Kaffee.']
  answer: 0
  explanation: |-
    selbst wenn with würde imagines an extreme case (winning the lottery) that would still not change the result. The obwohl sentence states a real fact, the weil sentence a reason, and the wenn sentence an ordinary condition.
- id: de3-m2-r2-h18
  lesson: de3-m2-h-argument
  topic: Concession
  stem: 'Why is "Obwohl es morgen schneit, fahren wir los" wrong?'
  choices: ['obwohl needs the verb in second position.', 'obwohl is only for real facts, and tomorrow''s weather is not a fact yet.', 'obwohl cannot start a sentence.', 'An obwohl clause must be followed by trotzdem.']
  answer: 1
  explanation: |-
    obwohl concedes a fact that is true. Tomorrow's snow is only possible, so German uses auch wenn (or selbst wenn): "Auch wenn es morgen schneit, fahren wir los." The word order of the sentence is fine, and obwohl clauses can come first.
- id: de3-m2-r2-h19
  lesson: de3-m2-h-argument
  topic: Concession
  stem: 'Which sentence is correct?'
  choices: ['Egal, wie teuer ist es, ich kaufe es.', 'Egal, wie es teuer ist, kaufe ich es.', 'Egal wie teuer, es ist ich kaufe.', 'Egal, wie teuer es ist, ich kaufe es.']
  answer: 3
  explanation: |-
    The wie clause has the verb at the end, with wie and its adjective together (wie teuer es ist). The egal clause stands outside the main sentence, so the main clause keeps its normal order, subject first: "ich kaufe es".
- id: de3-m2-r2-h20
  lesson: de3-m2-h-argument
  topic: Argument
  stem: 'In an essay you have given one argument for card payment and want to add a second one for the same side. Which beginning fits?'
  choices: ['Darüber hinaus …', 'Auf der anderen Seite …', 'Zusammenfassend lässt sich sagen …', 'Dagegen spricht, dass …']
  answer: 0
  explanation: |-
    Darüber hinaus (moreover) adds another argument to the same side. Auf der anderen Seite and Dagegen spricht switch to the other side, and Zusammenfassend lässt sich sagen starts the conclusion.
- id: de3-m2-r2-h21
  lesson: de3-m2-h-argument
  type: text
  topic: Argument
  stem: 'Write the missing first word of each signpost: "___ kommt, dass Geschäfte weniger Arbeit haben." (added to this) / "___ lässt sich sagen: Karte ja, aber Bargeld auch." (to sum up)'
  accept:
    - [Hinzu]
    - [Zusammenfassend]
  explanation: |-
    Hinzu kommt, dass … (added to this, …) adds an argument in a dass clause. Zusammenfassend lässt sich sagen … (to sum up, …) introduces the conclusion.
- id: de3-m2-r2-h22
  lesson: de3-m2-h-argument
  type: text
  topic: Argument
  stem: 'Write the verb in the right form: "Darüber hinaus ___ man kein Geld abheben." (müssen) / "Auch wenn es teuer ___, kaufe ich es." (sein)'
  accept:
    - [muss]
    - [ist]
  explanation: |-
    darüber hinaus is a linking adverb: the conjugated verb comes straight after it, then the subject: "Darüber hinaus muss man …". auch wenn sends the verb to the end of its clause: "Auch wenn es teuer ist, …".
- id: de3-m2-r2-h23
  lesson: de3-m2-h-argument
  type: order
  topic: Argument
  stem: 'Put the paragraphs of the model essay "Sollte man das Bargeld abschaffen?" in the order they appear.'
  items: ['The question, with the Bundesbank study', 'Arguments for paying by card', 'Arguments for keeping cash', 'Weighing up and the writer''s own view']
  explanation: |-
    The essay follows the standard shape: an introduction that presents the question, the arguments for card payment (zunächst, darüber hinaus, hinzu kommt), the counterarguments (auf der anderen Seite), and finally the weighing up and conclusion (wie man es auch dreht, letztlich, zusammenfassend).
- id: de3-m2-r2-h24
  lesson: de3-m2-h-argument
  topic: Argument
  stem: 'Which arguments in the model essay speak for keeping cash? Select all that apply.'
  choices: ['Cash offers anonymity.', 'Cash works when the power fails.', 'Paying is quick, especially contactless.', 'Not everyone copes well with cards and apps.', 'A stolen card can be blocked at once.']
  answer: [0, 1, 3]
  explanation: |-
    The paragraph that starts "Auf der anderen Seite" gives the arguments for cash: anonymity (no data), it works without internet or power, and not everyone copes with cards and apps. Speed, contactless payment and blocking a stolen card are arguments for card payment.
- id: de3-m2-r2-h25
  lesson: de3-m2-h-argument
  type: match
  topic: Argument
  stem: 'Match each signpost to its job in an essay.'
  pairs:
    - [Zunächst …, introduces the first argument]
    - [Darüber hinaus …, adds another argument]
    - [Auf der anderen Seite …, switches to the other side]
    - ['Es stimmt zwar, dass …, aber …', concedes a point and answers it]
    - [Zusammenfassend …, introduces the conclusion]
  distractors: [gives the reason for a single fact]
  explanation: |-
    Zunächst opens the first argument, darüber hinaus adds one, auf der anderen Seite turns to the opposite side, es stimmt zwar … aber concedes and answers, and zusammenfassend starts the conclusion. A reason for a single fact is weil or da, not an essay signpost.
- id: de3-m2-r2-h26
  lesson: de3-m2-h-argument
  type: match
  topic: Money
  stem: 'Match each word to its meaning.'
  pairs:
    - [die Münze, coin]
    - [der Geldschein, banknote]
    - [kontaktlos, contactless]
    - [abwägen, to weigh up]
    - [das Gegenargument, counterargument]
  distractors: [to withdraw money, credit card]
  explanation: |-
    die Münze = coin; der Geldschein = banknote; kontaktlos = contactless; abwägen = to weigh up (separable: ich wäge ab); das Gegenargument = counterargument. To withdraw money is Geld abheben, and a credit card is die Kreditkarte.
- id: de3-m2-r2-h27
  lesson: de3-m2-h-argument
  topic: Money
  stem: 'According to the model essay, what did the 2023 Bundesbank study find?'
  choices: ['Cash is hardly used in Germany any more.', 'Cash is still the most-used means of payment at the checkout, but its share is falling.', 'Most Germans pay only with their phones.', 'Card payments are becoming less common.']
  answer: 1
  explanation: |-
    "Bargeld ist in Deutschland an der Kasse zwar noch das meistgenutzte Zahlungsmittel, sein Anteil sinkt aber": cash is still the most-used means of payment at the checkout, but its share is falling. Note the zwar … aber that concedes one point and adds another.
- id: de3-m2-r2-h28
  lesson: de3-m2-h-argument
  topic: Argument
  stem: 'What is the writer''s conclusion in the model essay?'
  choices: ['Cash should be abolished because cards are more practical.', 'The writer only ever pays cash.', 'Cards are fine, but cash should continue to exist.', 'Neither side has any good arguments.']
  answer: 2
  explanation: |-
    "Zusammenfassend lässt sich sagen: Karte ja, aber Bargeld sollte es weiter geben." The writer usually pays by card but is against abolishing cash, "auch wenn sie praktisch wäre", because people should be free to choose how they pay. Both sides, the writer says, have good arguments.
