# German B1, module 5: If only: Konjunktiv II and more (lessons 21–25)

# --- 21 Konjunktiv II in full ---
- id: de3-q-2101
  lesson: de3-konj2-present
  module_quiz: true
  topic: Konjunktiv II
  stem: 'Complete: "Wenn ich mehr Zeit ___, würde ich öfter kochen."'
  choices: ['habe', 'hätte', 'hatte', 'würde haben']
  answer: 1
  explanation: |-
    An unreal condition needs the Konjunktiv II in the wenn clause too. For haben the form is "hätte". "habe" is the indicative (a real condition), "hatte" is the simple past, and "würde haben" is avoided with haben.
- id: de3-q-2102
  lesson: de3-konj2-present
  topic: Konjunktiv II
  stem: 'What is the Konjunktiv II of "kommen" for "er"?'
  choices: ['käme', 'kam', 'kommte', 'würde kommt']
  answer: 0
  explanation: |-
    Strong verbs form the Konjunktiv II from the simple past stem (kam) plus an umlaut and -e: käme. "kam" is just the simple past, "kommte" doesn't exist, and after würde the verb must be an infinitive (würde kommen).
- id: de3-q-2103
  lesson: de3-konj2-present
  module_quiz: true
  topic: Unreal conditions
  stem: 'Which sentence is correct?'
  choices: ['Wenn ich reich wäre, würde ich ein Haus kaufen.', 'Wenn ich reich wäre, ich würde ein Haus kaufen.', 'Wenn ich wäre reich, würde ich ein Haus kaufen.', 'Wenn ich reich bin, würde ich ein Haus kaufen.']
  answer: 0
  explanation: |-
    The wenn clause has the verb at the end (reich wäre) and counts as position 1, so the main clause starts with its verb: würde ich. Putting "ich" first copies English word order, and "wenn ich reich bin" is the indicative, which doesn't match an imagined result.
- id: de3-q-2104
  lesson: de3-konj2-present
  topic: Unreal conditions
  stem: 'Which sentence means the same as "Wenn ich ein Auto hätte, würde ich dich abholen."?'
  choices: ['Ich hatte ein Auto, deshalb habe ich dich abgeholt.', 'Hätte ich ein Auto, würde ich dich abholen.', 'Wenn ich ein Auto habe, hole ich dich ab.', 'Ich hätte ein Auto, aber ich würde dich abholen.']
  answer: 1
  explanation: |-
    An unreal condition can drop wenn if the verb moves to the front: "Hätte ich ein Auto, …". The other sentences describe real past events, a real possibility (indicative) or something else entirely.
- id: de3-q-2105
  lesson: de3-konj2-present
  topic: Konjunktiv II
  stem: 'Complete: "Ich ___ dir gern helfen, aber ich habe heute keine Zeit."'
  choices: ['kann', 'könnte', 'konnte', 'würde können']
  answer: 1
  explanation: |-
    The speaker is imagining something that won't happen, so the modal goes into the Konjunktiv II: könnte (with umlaut). "konnte" without the umlaut is the simple past, "kann" states a fact, and modals don't use würde.
- id: de3-q-2106
  lesson: de3-konj2-present
  topic: Konjunktiv II
  stem: 'Which version sounds most natural in everyday German?'
  choices: ['Wenn ich nach Japan fliegen würde, …', 'Wenn ich nach Japan flöge, …', 'Wenn ich nach Japan flog, …', 'Wenn ich nach Japan geflogen würde, …']
  answer: 0
  explanation: |-
    For most verbs, spoken German uses würde + infinitive. "flöge" is correct but sounds old-fashioned or literary. "flog" is the simple past, and würde can't be combined with a participle.
- id: de3-q-2107
  lesson: de3-konj2-present
  module_quiz: true
  topic: Reading
  stem: 'Read: "Tom arbeitet in einer Bank in Frankfurt. Er verdient gut, aber er hat kaum Freizeit. Wenn er könnte, würde er nach Portugal auswandern und dort ein kleines Café eröffnen. Leider spricht er kein Portugiesisch, und seine Freundin möchte in Deutschland bleiben. Vielleicht macht er erst einmal einen Sprachkurs." Which statement is true?'
  choices: ['Tom already lives in Portugal.', 'Tom has opened a café.', 'Tom would like to emigrate, but there are obstacles.', 'Tom''s girlfriend wants to move to Portugal.']
  answer: 2
  explanation: |-
    "Wenn er könnte, würde er … auswandern" is an unreal condition: it's his dream, not reality. The language and his girlfriend, who wants to stay in Germany, are the obstacles. He hasn't moved or opened a café.
- id: de3-q-2108
  lesson: de3-konj2-present
  topic: Vocabulary
  stem: 'What does "ausgerechnet" mean in "Ausgerechnet heute ist mein Fahrrad kaputt!"?'
  choices: ['fortunately today', 'exactly at noon today', 'already today', 'today of all days']
  answer: 3
  explanation: |-
    "ausgerechnet" expresses annoyance or surprise that something happens at the worst possible time or to the most unlikely person: today of all days. It has nothing to do with counting (rechnen) in this use.
- id: de3-q-2109
  lesson: de3-konj2-present
  topic: Konjunktiv II
  stem: 'Complete: "Ich stelle ___ das Leben auf dem Land sehr ruhig vor."'
  choices: ['mich', 'sich', 'mein', 'mir']
  answer: 3
  explanation: |-
    "sich vorstellen" in the sense of "to imagine" takes a dative reflexive pronoun because there is already an accusative object (das Leben): ich stelle mir etwas vor. "Ich stelle mich vor" means "I introduce myself".
- id: de3-q-2110
  lesson: de3-konj2-present
  module_quiz: true
  topic: Konjunktiv II
  stem: 'Which is the Konjunktiv II of "wissen" for "ich"?'
  choices: ['wüsste', 'wusste', 'wisste', 'weiß']
  answer: 0
  explanation: |-
    "wissen" is a mixed verb: simple past wusste, plus umlaut gives wüsste ("Wenn ich das wüsste!"). "wusste" is the simple past, "weiß" the present, and "wisste" doesn't exist.
- id: de3-q-2111
  lesson: de3-konj2-present
  topic: Dialogue
  stem: 'A: "Was würdest du machen, wenn du ein Jahr frei hättest?" B: "___"'
  choices: ['Ich bin um die Welt gereist.', 'Ich reise um die Welt, wenn ich Zeit gehabt habe.', 'Ich hätte um die Welt reisen.', 'Ich würde um die Welt reisen.']
  answer: 3
  explanation: |-
    The question is about an imagined situation, so the answer uses the Konjunktiv II: würde + infinitive. The perfect describes something that really happened, and "hätte" needs a participle, not an infinitive.
- id: de3-q-2112
  lesson: de3-konj2-present
  topic: Konjunktiv II
  stem: 'Which sentence contains a mistake?'
  choices: ['Wäre das Wetter schön, könnten wir grillen.', 'Wenn du mehr schlafen würdest, wärst du nicht so müde.', 'Wenn ich konnte, würde ich dir helfen.', 'Es gäbe weniger Stau, wenn mehr Leute Rad fahren würden.']
  answer: 2
  explanation: |-
    Without the umlaut, "konnte" is the simple past ("I was able to"). An unreal condition needs "könnte": Wenn ich könnte, würde ich dir helfen. The other three sentences are correct unreal conditions.
- id: de3-q-2113
  lesson: de3-konj2-present
  topic: Vocabulary
  stem: 'Which word fits? "Meine Arbeit ist sehr ___: Jeder Tag ist anders."'
  choices: ['langweilig', 'unabhängig', 'abwechslungsreich', 'ehrgeizig']
  answer: 2
  explanation: |-
    "abwechslungsreich" means varied, full of variety, which matches "every day is different". "langweilig" (boring) is the opposite; "unabhängig" (independent) and "ehrgeizig" (ambitious) describe people, not a job's variety.

# --- 22 The past subjunctive ---
- id: de3-q-2201
  lesson: de3-konj2-past
  module_quiz: true
  topic: Past subjunctive
  stem: 'Complete: "Wenn ich das gewusst hätte, ___ ich zu Hause geblieben."'
  choices: ['wäre', 'hätte', 'würde', 'bin']
  answer: 0
  explanation: |-
    "bleiben" forms the perfect with sein (ist geblieben), so the past subjunctive uses wäre: wäre geblieben. "hätte geblieben" is the classic auxiliary mistake, and "würde geblieben" is not a German form.
- id: de3-q-2202
  lesson: de3-konj2-past
  topic: Past subjunctive
  stem: 'Complete: "Wenn du mich gefragt ___, hätte ich dir geholfen."'
  choices: ['hast', 'hättest', 'würdest', 'wärst']
  answer: 1
  explanation: |-
    The wenn clause also needs the past subjunctive, and fragen takes haben: du hättest gefragt. "hast" would be the indicative perfect, "würdest" can't go with a participle, and fragen doesn't take sein.
- id: de3-q-2203
  lesson: de3-konj2-past
  module_quiz: true
  topic: Past subjunctive
  stem: 'Which sentence is correct?'
  choices: ['Ich hätte früher losfahren gesollt.', 'Ich wäre früher losfahren sollen.', 'Ich hätte früher losfahren sollen.', 'Ich würde früher losgefahren sollen.']
  answer: 2
  explanation: |-
    With a modal and another verb, the past subjunctive uses hätte + two infinitives (the double infinitive): hätte … losfahren sollen. The modal stays in the infinitive, and it always takes hätte, even though losfahren itself takes sein.
- id: de3-q-2204
  lesson: de3-konj2-past
  topic: Past subjunctive
  stem: 'What does "Du hättest mich anrufen können!" express?'
  choices: ['a request: could you call me?', 'a fact: you were able to call me', 'a reproach: you could have called me (but didn''t)', 'a plan: you will call me later']
  answer: 2
  explanation: |-
    "hätte … können" refers to a possibility in the past that wasn't used. Said with an exclamation mark, it is a reproach. A request for now would be "Könntest du mich anrufen?"
- id: de3-q-2205
  lesson: de3-konj2-past
  module_quiz: true
  topic: Past subjunctive
  stem: 'Which sentence describes something that almost happened but didn''t?'
  choices: ['Ich wäre beinahe gefallen.', 'Ich bin gefallen.', 'Ich falle beinahe.', 'Ich würde fallen.']
  answer: 0
  explanation: |-
    beinahe (or fast) + past subjunctive describes a near miss: "Ich wäre beinahe gefallen" means I almost fell, so I didn't. "Ich bin gefallen" says it did happen; the others are present or hypothetical.
- id: de3-q-2206
  lesson: de3-konj2-past
  topic: Past subjunctive
  stem: 'Complete the mixed sentence: "Wenn ich gestern nicht so lange gefeiert hätte, ___ ich jetzt nicht so müde."'
  choices: ['hätte', 'wäre', 'bin', 'wäre gewesen']
  answer: 1
  explanation: |-
    The condition is in the past, but the result is about now (jetzt), so the main clause takes the present Konjunktiv II: wäre. "wäre gewesen" would put the tiredness in the past, and "bin" is the indicative.
- id: de3-q-2207
  lesson: de3-konj2-past
  module_quiz: true
  topic: Reading
  stem: 'Read: "Letztes Jahr bekam Sara ein Jobangebot in Zürich. Sie hat es abgelehnt, weil sie ihre Familie nicht verlassen wollte. Ein Jahr später hat die Firma in Zürich zugemacht. Rückblickend ist Sara sehr erleichtert. Wenn sie umgezogen wäre, hätte sie jetzt keine Arbeit." How does Sara feel about her decision today?'
  choices: ['She regrets turning the job down.', 'She is relieved that she turned the job down.', 'She is angry with her family.', 'She is looking for a job in Zürich.']
  answer: 1
  explanation: |-
    "Rückblickend ist Sara sehr erleichtert": looking back, she is relieved. The past subjunctive "Wenn sie umgezogen wäre, hätte sie jetzt keine Arbeit" explains why: the company closed, so moving would have left her without work.
- id: de3-q-2208
  lesson: de3-konj2-past
  topic: Vocabulary
  stem: 'What does "im Nachhinein" mean?'
  choices: ['in advance', 'in the meantime', 'in the end', 'in hindsight']
  answer: 3
  explanation: |-
    "im Nachhinein" (also "rückblickend" or "hinterher") means in hindsight, afterwards. "in advance" is "im Voraus".
- id: de3-q-2209
  lesson: de3-konj2-past
  topic: Past subjunctive
  stem: 'Which sentence contains a mistake?'
  choices: ['Wenn ich den Bus nicht verpasst hätte, wäre ich pünktlich gewesen.', 'Hätte ich den Bus nicht verpasst, wäre ich pünktlich gewesen.', 'Ohne den Stau wäre ich pünktlich gewesen.', 'Wenn ich den Bus nicht verpasst habe, wäre ich pünktlich gewesen.']
  answer: 3
  explanation: |-
    The wenn clause of an unreal past condition also needs the past subjunctive: verpasst hätte, not verpasst habe. The other three are correct: with wenn, without wenn (verb first), and with ohne + noun replacing the condition.
- id: de3-q-2210
  lesson: de3-konj2-past
  topic: Vocabulary
  stem: 'Complete: "Das war nicht deine ___, du konntest nichts dafür."'
  choices: ['Schuld', 'Ursache', 'Wirkung', 'Reue']
  answer: 0
  explanation: |-
    "Das ist meine/deine Schuld" means that's my/your fault. "die Ursache" is a cause (of an event, not a person's blame), "die Wirkung" is an effect and "die Reue" is remorse.
- id: de3-q-2211
  lesson: de3-konj2-past
  topic: Vocabulary
  stem: 'Which verb fits? "Mit einem Helm hätte man die Verletzung ___ können."'
  choices: ['verursachen', 'bereuen', 'versäumen', 'verhindern']
  answer: 3
  explanation: |-
    "verhindern" means to prevent: with a helmet the injury could have been prevented. "verursachen" (to cause) is the opposite, "bereuen" (to regret) and "versäumen" (to miss) don't fit.
- id: de3-q-2212
  lesson: de3-konj2-past
  topic: Past subjunctive
  stem: 'A: "Warum bist du nicht zur Party gekommen?" B: "Ich war krank. ___"'
  choices: ['Sonst bin ich natürlich gekommen.', 'Sonst hätte ich natürlich gekommen.', 'Sonst wäre ich natürlich gekommen.', 'Sonst würde ich natürlich gekommen.']
  answer: 2
  explanation: |-
    B imagines a past that didn't happen, so the past subjunctive is needed. "kommen" takes sein in the perfect (ist gekommen), so it's "wäre gekommen". "würde gekommen" doesn't exist.

# --- 23 Wishes, advice and polite requests ---
- id: de3-q-2301
  lesson: de3-advice-wishes
  module_quiz: true
  topic: Wishes
  stem: 'Complete the wish: "Wenn ich nur mehr Geld ___!"'
  choices: ['habe', 'hatte', 'haben würde', 'hätte']
  answer: 3
  explanation: |-
    An unreal wish uses the Konjunktiv II with nur, doch or bloß, verb at the end: Wenn ich nur mehr Geld hätte! The indicative "habe" would not express a wish, "hatte" is the past, and "haben würde" is clumsy.
- id: de3-q-2302
  lesson: de3-advice-wishes
  topic: Wishes
  stem: 'Which sentence is a wish about the past?'
  choices: ['Hätte ich bloß mehr Zeit!', 'Hätte ich das bloß nicht gesagt!', 'Wäre ich doch zu Hause!', 'Könnte ich doch schwimmen!']
  answer: 1
  explanation: |-
    A wish about the past uses the past subjunctive (hätte/wäre + participle): Hätte ich das bloß nicht gesagt! (If only I hadn't said that!) The other three wish for something different now.
- id: de3-q-2303
  lesson: de3-advice-wishes
  module_quiz: true
  topic: Advice
  stem: 'Which sentence is correct?'
  choices: ['An deiner Stelle ich würde mit ihm reden.', 'An deiner Stelle würde ich mit ihm reden.', 'An deiner Stelle würde ich mit ihm reden würden.', 'In deiner Stelle würde ich mit ihm reden.']
  answer: 1
  explanation: |-
    "an deiner Stelle" fills position 1, so the verb comes next: würde ich. The preposition is an, not in, and würde appears only once, with the infinitive at the end.
- id: de3-q-2304
  lesson: de3-advice-wishes
  topic: Polite requests
  stem: 'Which request is the most polite?'
  choices: ['Halten Sie mir die Tür auf!', 'Können Sie mir die Tür aufhalten?', 'Wären Sie so nett, mir die Tür aufzuhalten?', 'Sie halten mir die Tür auf, ja?']
  answer: 2
  explanation: |-
    "Wären Sie so nett, … zu …?" uses the Konjunktiv II and is very polite. The imperative is direct, "Können Sie" is polite but less so, and the last version sounds like an order.
- id: de3-q-2305
  lesson: de3-advice-wishes
  module_quiz: true
  topic: Polite requests
  stem: 'Complete: "Würde es Ihnen etwas ausmachen, das Fenster ___?"'
  choices: ['schließen', 'schließen zu', 'zu schließen', 'zu schließt']
  answer: 2
  explanation: |-
    "Würde es Ihnen etwas ausmachen" is followed by a zu-infinitive at the end: das Fenster zu schließen. zu comes directly before the infinitive.
- id: de3-q-2306
  lesson: de3-advice-wishes
  topic: Advice
  stem: 'Which sentence gives advice (not a reproach)?'
  choices: ['Du solltest mehr Wasser trinken.', 'Du hättest mehr Wasser trinken sollen.', 'Du hast zu wenig Wasser getrunken.', 'Warum hast du nichts getrunken?']
  answer: 0
  explanation: |-
    "Du solltest …" is advice for now or the future. "Du hättest … sollen" refers to the past: it's too late, so it sounds like a reproach. The other two are statements or questions about the past.
- id: de3-q-2307
  lesson: de3-advice-wishes
  module_quiz: true
  topic: Reading
  stem: 'Read: "Liebe Frau Lindner, meine beste Freundin ist vor drei Monaten nach Australien gezogen. Seitdem fühle ich mich einsam. Wir schreiben uns zwar oft, aber das ist nicht dasselbe. Ich traue mich nicht, in einen Verein zu gehen, weil ich dort niemanden kenne. Was soll ich tun? Mia" What is Mia''s problem?'
  choices: ['She wants to move to Australia.', 'She has had an argument with her best friend.', 'She has too little time for her hobbies.', 'She feels lonely and is too shy to meet new people.']
  answer: 3
  explanation: |-
    Mia says "fühle ich mich einsam" (I feel lonely) and "Ich traue mich nicht, in einen Verein zu gehen" (I don't dare join a club). Her friend moved away; there was no argument, and Mia doesn't say she wants to move.
- id: de3-q-2308
  lesson: de3-advice-wishes
  topic: Wishes
  stem: 'Which sentence is correct?'
  choices: ['Ich wünsche, du wärst hier.', 'Ich wünschte, du bist hier.', 'Ich wünschte, du wärst hier.', 'Ich wünschte, dass du wärst hier.']
  answer: 2
  explanation: |-
    An unreal wish with "Ich wünschte" (the Konjunktiv II of wünschen) is followed by a clause in the Konjunktiv II: du wärst hier. "Ich wünsche" is for good wishes (Ich wünsche dir Glück); a dass clause would need the verb at the end.
- id: de3-q-2309
  lesson: de3-advice-wishes
  topic: Unreal comparison
  stem: 'What does "Er tut so, als ob er krank wäre." mean?'
  choices: ['He is ill, so he stays at home.', 'He would be ill if he went out.', 'He asks whether he is ill.', 'He acts as if he were ill (but he isn''t).']
  answer: 3
  explanation: |-
    "als ob" + Konjunktiv II is an unreal comparison: it describes how someone seems or behaves, while suggesting it isn't true. "so tun, als ob" means to act as if, to pretend.
- id: de3-q-2310
  lesson: de3-advice-wishes
  topic: Unreal comparison
  stem: 'Which sentence has the same meaning as "Sie sieht aus, als ob sie nicht geschlafen hätte."?'
  choices: ['Sie sieht aus, als hätte sie nicht geschlafen.', 'Sie sieht aus, als ob hätte sie nicht geschlafen.', 'Sie sieht aus, als sie nicht geschlafen hätte.', 'Sie sieht aus, ob sie nicht geschlafen hätte.']
  answer: 0
  explanation: |-
    The short form of "als ob" is "als" with the conjugated verb straight after it: als hätte sie nicht geschlafen. With als ob, the verb goes to the end; you can't mix the two orders.
- id: de3-q-2311
  lesson: de3-advice-wishes
  topic: Vocabulary
  stem: 'What does "schüchtern" mean?'
  choices: ['brave', 'shy', 'desperate', 'lonely']
  answer: 1
  explanation: |-
    "schüchtern" means shy. Brave is "mutig", desperate is "verzweifelt" and lonely is "einsam".
- id: de3-q-2312
  lesson: de3-advice-wishes
  topic: Vocabulary
  stem: 'Complete: "Auf meine Kollegen kann ich mich immer ___."'
  choices: ['verlassen', 'trauen', 'unterstützen', 'trösten']
  answer: 0
  explanation: |-
    "sich verlassen auf + accusative" means to rely on. "sich trauen" means to dare, "unterstützen" (to support) takes a direct object without auf, and "trösten" means to comfort.

# --- 24 Verbs, adjectives and nouns with prepositions ---
- id: de3-q-2401
  lesson: de3-verb-prep
  module_quiz: true
  topic: Verbs with prepositions
  stem: 'Complete: "Ob wir grillen, hängt ___ Wetter ab."'
  choices: ['vom', 'auf das', 'mit dem', 'für das']
  answer: 0
  explanation: |-
    "abhängen von + dative" means to depend on: vom (von dem) Wetter. English "depend on" tempts learners to use auf, but German uses von.
- id: de3-q-2402
  lesson: de3-verb-prep
  topic: Adjectives with prepositions
  stem: 'Complete: "Wir sind sehr stolz ___ unsere Tochter."'
  choices: ['von', 'über', 'an', 'auf']
  answer: 3
  explanation: |-
    "stolz auf + accusative" means proud of. English "proud of" leads many learners to "von", which is wrong here.
- id: de3-q-2403
  lesson: de3-verb-prep
  module_quiz: true
  topic: Adjectives with prepositions
  stem: 'Complete: "Bist du mit ___ neuen Job zufrieden?"'
  choices: ['deinem', 'deinen', 'dein', 'deiner']
  answer: 0
  explanation: |-
    "zufrieden mit" takes the dative, because mit is always dative. "Job" is masculine, so it's "mit deinem neuen Job".
- id: de3-q-2404
  lesson: de3-verb-prep
  topic: Nouns with prepositions
  stem: 'Which is correct?'
  choices: ['Sie hat großes Interesse an Kunst.', 'Sie hat großes Interesse für Kunst.', 'Sie hat großes Interesse in Kunst.', 'Sie hat großes Interesse auf Kunst.']
  answer: 0
  explanation: |-
    The noun "das Interesse" takes an + dative, although the verb is "sich interessieren für". This is one of the nouns whose preposition differs from the verb's.
- id: de3-q-2405
  lesson: de3-verb-prep
  module_quiz: true
  topic: Verbs with prepositions
  stem: 'Complete: "Ich zweifle an ___ Ehrlichkeit."'
  choices: ['seine', 'seiner', 'seinen', 'sein']
  answer: 1
  explanation: |-
    "zweifeln an" takes the dative: an seiner Ehrlichkeit (Ehrlichkeit is feminine). an is a two-way preposition, and in this fixed phrase it is dative, unlike "denken an" + accusative.
- id: de3-q-2406
  lesson: de3-verb-prep
  topic: Questions
  stem: 'Ask about the thing: "Ich habe mich über den Preis gewundert."'
  choices: ['Über was hast du dich gewundert?', 'Über wen hast du dich gewundert?', 'Worüber hast du dich gewundert?', 'Was hast du dich gewundert?']
  answer: 2
  explanation: |-
    For a thing in a prepositional object, use wo(r)- + preposition: worüber. "Über was" is colloquial, "über wen" is for people, and the question can't drop the preposition.
- id: de3-q-2407
  lesson: de3-verb-prep
  module_quiz: true
  topic: Questions
  stem: 'Ask about the person: "Sie sorgt sich um ihren Vater."'
  choices: ['Worum sorgt sie sich?', 'Um wen sorgt sie sich?', 'Wen sorgt sie sich?', 'Um wem sorgt sie sich?']
  answer: 1
  explanation: |-
    For a person, keep the preposition and add wen (accusative) or wem (dative). um takes the accusative, so it's "Um wen". "Worum" would ask about a thing.
- id: de3-q-2408
  lesson: de3-verb-prep
  topic: Verbs with prepositions
  stem: 'Which sentence is correct?'
  choices: ['Es hängt ab, ob ich Zeit habe.', 'Es hängt davon ab, ich Zeit habe.', 'Es hängt von ab, ob ich Zeit habe.', 'Es hängt davon ab, ob ich Zeit habe.']
  answer: 3
  explanation: |-
    When a prepositional verb is followed by a clause, the da-word points ahead to it: davon ab, ob … The preposition can't stand alone, and the ob clause needs its conjunction.
- id: de3-q-2409
  lesson: de3-verb-prep
  topic: Reading
  stem: 'Read: "Herr Brandt ist 72 und begeistert von Computern. Jeden Dienstag geht er in einen Kurs für Senioren. Er beschäftigt sich vor allem mit Fotos: Er sortiert und bearbeitet alte Familienbilder. Seine Enkel sind stolz auf ihn, aber sie wundern sich manchmal, wie viel Zeit er vor dem Bildschirm verbringt." Which statement is true?'
  choices: ['Herr Brandt''s grandchildren are worried about his health.', 'Herr Brandt teaches a computer course.', 'Herr Brandt spends a lot of time working on family photos.', 'Herr Brandt isn''t interested in computers.']
  answer: 2
  explanation: |-
    "Er beschäftigt sich vor allem mit Fotos … bearbeitet alte Familienbilder" and the grandchildren are surprised how much time he spends at the screen. He attends the course (he doesn't teach it), and "begeistert von" means he's enthusiastic, not uninterested.
- id: de3-q-2410
  lesson: de3-verb-prep
  topic: Vocabulary
  stem: 'What does "Ich bin gespannt auf den neuen Film." mean?'
  choices: ['I''m disappointed by the new film.', 'I can''t wait to see the new film.', 'I''m tired of the new film.', 'I''m afraid of the new film.']
  answer: 1
  explanation: |-
    "gespannt auf" describes eager, curious anticipation: I'm excited to see it. Disappointed is "enttäuscht von", afraid is "Angst haben vor".
- id: de3-q-2411
  lesson: de3-verb-prep
  topic: Verbs with prepositions
  stem: 'Complete: "I''m Urlaub verzichte ich ___ mein Handy."'
  choices: ['an', 'von', 'auf', 'ohne']
  answer: 2
  explanation: |-
    "verzichten auf + accusative" means to do without, give up. "ohne" means without, but it isn't used with verzichten.
- id: de3-q-2412
  lesson: de3-verb-prep
  topic: Verbs with prepositions
  stem: 'Complete: "Die Prüfung besteht ___ drei Teilen."'
  choices: ['von', 'in', 'mit', 'aus']
  answer: 3
  explanation: |-
    "bestehen aus + dative" means to consist of: aus drei Teilen (dative plural with -n). English "consist of" may suggest von, but German uses aus.

# --- 25 Careers and the job market ---
- id: de3-q-2501
  lesson: de3-work-career
  module_quiz: true
  topic: Infinitive constructions
  stem: 'Complete: "Die neue Kollegin scheint sehr nett ___."'
  choices: ['zu sein', 'sein', 'ist', 'zu ist']
  answer: 0
  explanation: |-
    "scheinen" (to seem) is used with zu + infinitive at the end: Sie scheint nett zu sein. Without zu, the sentence is wrong.
- id: de3-q-2502
  lesson: de3-work-career
  topic: Infinitive constructions
  stem: 'Which sentence means "You don''t have to bring anything."?'
  choices: ['Du darfst nichts mitbringen.', 'Du brauchst nichts mitzubringen.', 'Du brauchst etwas mitzubringen.', 'Du musst etwas mitbringen.']
  answer: 1
  explanation: |-
    "brauchen nicht/nichts/kein … zu" is the negative of müssen: no need to. "Du darfst nichts mitbringen" means you're not allowed to bring anything. With a separable verb, zu goes between the prefix and the verb: mitzubringen.
- id: de3-q-2503
  lesson: de3-work-career
  module_quiz: true
  topic: Noun endings
  stem: 'What is the gender of "Beförderung"?'
  choices: ['der', 'die', 'das', 'it depends on the meaning']
  answer: 1
  explanation: |-
    Nouns ending in -ung are always feminine: die Beförderung, die Leitung, die Bewerbung.
- id: de3-q-2504
  lesson: de3-work-career
  topic: Noun endings
  stem: 'Which noun is NOT feminine?'
  choices: ['Arbeitslosigkeit', 'Zentrum', 'Gewerkschaft', 'Qualifikation']
  answer: 1
  explanation: |-
    Nouns ending in -um are neuter: das Zentrum. -keit (die Arbeitslosigkeit), -schaft (die Gewerkschaft) and -ion (die Qualifikation) are always feminine.
- id: de3-q-2505
  lesson: de3-work-career
  module_quiz: true
  topic: Vocabulary
  stem: 'Who is "der Arbeitgeber"?'
  choices: ['the employee', 'the job applicant', 'the trade union representative', 'the employer']
  answer: 3
  explanation: |-
    The Arbeitgeber "gives" work: the employer. The Arbeitnehmer "takes" work: the employee. A job applicant is "der Bewerber".
- id: de3-q-2506
  lesson: de3-work-career
  topic: Vocabulary
  stem: 'What is a "befristeter Vertrag"?'
  choices: ['a permanent contract', 'a part-time contract', 'a fixed-term contract', 'a contract with flexitime']
  answer: 2
  explanation: |-
    "befristet" means limited to a certain period (die Frist = deadline, time limit). A permanent contract is "unbefristet", part-time is "Teilzeit" and flexitime is "Gleitzeit".
- id: de3-q-2507
  lesson: de3-work-career
  module_quiz: true
  topic: Reading
  stem: 'Read the job advert: "Wir suchen ab sofort eine Fachkraft für unser Lager (m/w/d) in Vollzeit. Wir bieten: einen unbefristeten Vertrag, Gleitzeit und regelmäßige Weiterbildung. Sie haben eine abgeschlossene Ausbildung und arbeiten gern im Team. Die Probezeit beträgt sechs Monate. Bitte schicken Sie Ihre Bewerbung bis zum 15. Juni an Frau Kaya." Which is true?'
  choices: ['The job is part-time.', 'You don''t need any training for the job.', 'The job is permanent and the hours are flexible.', 'The probationary period is one year.']
  answer: 2
  explanation: |-
    The advert offers "einen unbefristeten Vertrag" (permanent) and "Gleitzeit" (flexitime). It is "in Vollzeit" (full-time), asks for "eine abgeschlossene Ausbildung", and the probation is six months.
- id: de3-q-2508
  lesson: de3-work-career
  topic: Formal letters
  stem: 'Which is the correct start of a formal e-mail?'
  choices: ['Sehr geehrte Frau Kaya, Mit großem Interesse habe ich Ihre Anzeige gelesen.', 'Sehr geehrter Frau Kaya, mit großem Interesse habe ich Ihre Anzeige gelesen.', 'Hallo Frau Kaya! mit großem Interesse habe ich deine Anzeige gelesen.', 'Sehr geehrte Frau Kaya, mit großem Interesse habe ich Ihre Anzeige gelesen.']
  answer: 3
  explanation: |-
    Formal: "Sehr geehrte" for a woman (geehrter for a man), a comma after the name, then a small letter to continue, and Ihre with a capital I. After a comma German doesn't start with a capital, and "deine" is informal.
- id: de3-q-2509
  lesson: de3-work-career
  topic: Infinitive constructions
  stem: 'What does "Der Antrag ist bis Freitag abzugeben." mean?'
  choices: ['The application must be handed in by Friday.', 'The application was handed in on Friday.', 'The application can''t be handed in until Friday.', 'You don''t need to hand in the application.']
  answer: 0
  explanation: |-
    "sein + zu + infinitive" has a passive meaning of must or can: it must be handed in (muss abgegeben werden). It is typical of rules and official texts.
- id: de3-q-2510
  lesson: de3-work-career
  topic: Vocabulary
  stem: 'Complete: "Nach drei Jahren wurde sie zur Abteilungsleiterin ___."'
  choices: ['beworben', 'entlassen', 'gekündigt', 'befördert']
  answer: 3
  explanation: |-
    "befördern" means to promote: she was promoted to head of department. "entlassen" (to dismiss) and "kündigen" (to quit, give notice) don't fit "zur Abteilungsleiterin", and "sich bewerben" is to apply.
- id: de3-q-2511
  lesson: de3-work-career
  topic: Infinitive constructions
  stem: 'Which sentence is correct?'
  choices: ['Sie brauchen das Formular nur zu unterschreiben.', 'Sie brauchen das Formular nur unterschreiben zu.', 'Sie brauchen zu das Formular nur unterschreiben.', 'Sie brauchen das Formular nur zu unterschrieben.']
  answer: 0
  explanation: |-
    "brauchen nur zu" + infinitive: zu goes directly before the infinitive at the end. "unterschreiben" is inseparable, so zu stays in front (zu unterschreiben), and it takes the infinitive, not the participle.
- id: de3-q-2512
  lesson: de3-work-career
  topic: Vocabulary
  stem: 'Which word describes someone who runs their own business?'
  choices: ['arbeitslos', 'befristet', 'selbstständig', 'angestellt']
  answer: 2
  explanation: |-
    "selbstständig" means self-employed. "arbeitslos" is unemployed, "angestellt" means employed by someone else, and "befristet" describes a contract, not a person.
