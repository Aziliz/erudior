# German B1, module 1 (round 2): new question types for the core lessons, and the honors lessons' questions.

# --- 01 de3-praeteritum ---
- id: de3-m1-r2-q01
  lesson: de3-praeteritum
  type: text
  module_quiz: true
  topic: Simple past
  stem: 'Write the simple past (er/sie form) of each verb: schreiben → ___, bringen → ___, arbeiten → ___.'
  accept:
    - [schrieb]
    - [brachte]
    - [arbeitete]
  explanation: |-
    schreiben is strong (ei – ie – ie): schrieb, with no ending in the er form. bringen is mixed: new vowel and -te, brachte. arbeiten is weak, and its stem ends in -t, so it adds -ete: arbeitete.
- id: de3-m1-r2-q02
  lesson: de3-praeteritum
  type: match
  topic: Strong verbs
  stem: 'Match each verb to its type.'
  pairs:
    - [finden, 'Strong: new vowel, no -te']
    - [sagen, 'Weak: stem + -te']
    - [denken, 'Mixed: new vowel + -te']
    - [schreiben, 'Strong: new vowel, no -te']
    - [entdecken, 'Weak: stem + -te']
    - [kennen, 'Mixed: new vowel + -te']
  explanation: |-
    finden – fand and schreiben – schrieb change the vowel and add no -te: strong. sagen – sagte and entdecken – entdeckte keep the vowel and add -te: weak. denken – dachte and kennen – kannte do both: mixed.
- id: de3-m1-r2-q03
  lesson: de3-praeteritum
  topic: Simple past
  stem: 'Which simple past forms are correct? Select all that apply.'
  choices: ['er fand', 'sie gingte', 'ich schrieb', 'er kame', 'wir dachten']
  answer: [0, 2, 4]
  explanation: |-
    er fand, ich schrieb and wir dachten are correct. Strong verbs never add -te (sie ging, not gingte), and the ich and er forms have no ending (er kam, not kame).
- id: de3-m1-r2-q04
  lesson: de3-praeteritum
  type: label
  module_quiz: true
  topic: Simple past
  stem: 'The sentence is "Plötzlich rief der Zeuge die Polizei an." Name the numbered parts.'
  image: {src: images/de3-m1-bracket-blank.svg, alt: 'The sentence Plötzlich rief der Zeuge die Polizei an split into five boxes. A bracket joins rief and an. Four boxes are numbered: rief, der Zeuge, die Polizei and an.'}
  labels:
    - {x: 32.1, y: 62.4, text: Past form of the verb (position 2)}
    - {x: 50.0, y: 62.4, text: Subject}
    - {x: 72.1, y: 62.4, text: Object}
    - {x: 90.0, y: 62.4, text: Separable prefix}
  distractors: [Past participle, Infinitive]
  explanation: |-
    anrufen is separable. In a main clause the past form rief stands in position 2 and the prefix an goes to the end, framing the sentence. der Zeuge (nominative) is the subject, die Polizei the object. There is no participle or infinitive in a simple past sentence.
- id: de3-m1-r2-q05
  lesson: de3-praeteritum
  type: order
  topic: Simple past
  stem: 'Put the words in order to say "Then the witness phoned the police." Start with "Dann".'
  items: [Dann, rief, der Zeuge, die Polizei, an]
  explanation: |-
    After Dann in position 1, the verb comes next: rief. Then the subject der Zeuge, the object die Polizei, and the separable prefix an at the very end.

# --- 02 de3-plusquamperfekt ---
- id: de3-m1-r2-q06
  lesson: de3-plusquamperfekt
  type: text
  module_quiz: true
  topic: Past perfect
  stem: 'Complete with the past perfect of "abfahren": "Als wir am Bahnhof ankamen, ___ der Zug schon ___."'
  accept:
    - [war]
    - [abgefahren]
  explanation: |-
    The train left before we arrived, so it needs the past perfect. abfahren takes sein in the perfect (ist abgefahren), so the past perfect is war … abgefahren.
- id: de3-m1-r2-q07
  lesson: de3-plusquamperfekt
  type: label
  topic: Past perfect
  stem: 'A written story is set in 1961. Name the tense you would use for each numbered point: 1 Die Tante ___ (fliehen, shortly before), 2 Die Regierung ___ die Mauer (bauen), 3 Berlin ___ wieder eine Stadt (today).'
  image: {src: images/de3-m1-timeline-blank.svg, alt: 'A timeline with three numbered points: 1961 shortly before, 1961, and heute. A dashed arrow looks back from the second point to the first.'}
  labels:
    - {x: 20.8, y: 50, text: Past perfect}
    - {x: 50, y: 50, text: Simple past}
    - {x: 81.9, y: 50, text: Present}
  distractors: [Future]
  explanation: |-
    The story is told in the simple past (Die Regierung baute die Mauer). Something that happened before the story's time steps back into the past perfect (Die Tante war geflohen). Today's situation is in the present (Berlin ist wieder eine Stadt).
- id: de3-m1-r2-q08
  lesson: de3-plusquamperfekt
  type: match
  module_quiz: true
  topic: Time clauses
  stem: 'Match each word to the kind of word it is.'
  pairs:
    - [nachdem, 'Conjunction: verb at the end']
    - [nach, 'Preposition + dative']
    - [danach, 'Adverb: verb straight after it']
    - [bevor, 'Conjunction: verb at the end']
    - [vor, 'Preposition + dative']
    - [vorher, 'Adverb: verb straight after it']
  explanation: |-
    nachdem and bevor start a clause with the verb at the end (nachdem der Krieg zu Ende war). nach and vor are followed by a noun in the dative (nach dem Krieg). danach and vorher stand in a main clause and the verb follows directly (Danach ging er nach Hause).
- id: de3-m1-r2-q09
  lesson: de3-plusquamperfekt
  topic: Time clauses
  stem: 'Which sentences are correct written German? Select all that apply.'
  choices: ['Nachdem er gegessen hatte, ging er spazieren.', 'Nachdem er aß, ging er spazieren.', 'Nach dem Essen ging er spazieren.', 'Danach er ging spazieren.', 'Bevor er ging, aß er etwas.']
  answer: [0, 2, 4]
  explanation: |-
    A nachdem clause goes one step further back than the main clause: gegessen hatte, not aß. Nach dem Essen is a preposition with a noun, which is fine. After the adverb danach the verb comes straight away (Danach ging er spazieren). bevor takes the same tense as the main clause, so Bevor er ging, aß er etwas is correct.
- id: de3-m1-r2-q10
  lesson: de3-plusquamperfekt
  type: order
  topic: History
  stem: 'Put these events from the text "Ein Zeitzeuge erzählt" in the order they happened.'
  items: ['Die Tante floh mit ihren Kindern in den Westen.', 'Die Regierung der DDR baute die Mauer.', 'Herr Brandt beendete die Schule.', 'Die Grenze öffnete sich.', 'Herr Brandt verlor seine Stelle.']
  explanation: |-
    The aunt had fled shortly before the Wall was built in 1961 (war kurz zuvor geflohen). Herr Brandt, born in 1958, finished school after that and became an electrician. The border opened on 9 November 1989, and he lost his job in 1991.

# --- 03 de3-temporal-clauses ---
- id: de3-m1-r2-q11
  lesson: de3-temporal-clauses
  type: label
  module_quiz: true
  topic: Time clauses
  stem: 'Each picture shows a time clause (pink) and a main clause (blue). Which conjunction does each picture show?'
  image: {src: images/de3-m1-time-clauses-blank.svg, alt: 'Four numbered timelines. 1: a shorter pink bar lies under a longer blue bar at the same time. 2: a pink dot marks a start, and a blue bar runs from it to a line marked jetzt. 3: a blue bar ends exactly at a pink dot. 4: a pink dot is followed immediately by a blue bar.'}
  labels:
    - {x: 25.4, y: 31.5, text: während}
    - {x: 76.0, y: 33.4, text: seit}
    - {x: 20.6, y: 78.9, text: bis}
    - {x: 80.0, y: 78.9, text: sobald}
  distractors: [weil, dass]
  explanation: |-
    1 während: both things happen at the same time. 2 seit: the main clause starts at the event and continues until now. 3 bis: the main clause stops at the event. 4 sobald: the main clause starts immediately after the event. weil and dass are not time conjunctions.
- id: de3-m1-r2-q12
  lesson: de3-temporal-clauses
  type: text
  topic: Conjunctions
  stem: 'Complete with "als" or "wenn": "___ ich klein war, wohnten wir in Kiel. ___ wir Oma besuchten, gab es immer Kuchen."'
  accept:
    - [als]
    - [wenn]
  explanation: |-
    Childhood is one period in the past, so als. The visits happened again and again (you could add jedes Mal), so wenn.
- id: de3-m1-r2-q13
  lesson: de3-temporal-clauses
  topic: Time clauses
  stem: 'Which sentences have the correct word order? Select all that apply.'
  choices: ['Während ich im Büro bin, kocht meine Mutter.', 'Sobald er kommt, wir essen.', 'Seit sie in Rente ist, reist sie viel.', 'Bis wir finden eine Wohnung, wohnen wir hier.']
  answer: [0, 2]
  explanation: |-
    In a time clause the verb goes to the end (im Büro bin, in Rente ist), and when the time clause comes first, the main clause starts with its verb (kocht meine Mutter, reist sie). Correct would be: Sobald er kommt, essen wir. Bis wir eine Wohnung finden, wohnen wir hier.
- id: de3-m1-r2-q14
  lesson: de3-temporal-clauses
  type: match
  module_quiz: true
  topic: Conjunctions
  stem: 'Match each conjunction to its meaning.'
  pairs:
    - [während, while]
    - [seit, since]
    - [bis, until]
    - [sobald, as soon as]
    - [solange, as long as]
  distractors: [although]
  explanation: |-
    während = while (also whereas), seit/seitdem = since, bis = until, sobald = as soon as, solange = as long as. "Although" is obwohl, which comes in module 2.
- id: de3-m1-r2-q15
  lesson: de3-temporal-clauses
  type: order
  topic: Time clauses
  stem: 'Put the words in order to say "As soon as the children are asleep, I''ll call you." Start with "Sobald".'
  items: [Sobald, die Kinder, schlafen, rufe, ich, dich, an]
  explanation: |-
    In the sobald clause the verb schlafen goes to the end. The main clause then starts with its verb (rufe), followed by the subject ich, the object dich and the separable prefix an.

# --- 04 de3-futur ---
- id: de3-m1-r2-q16
  lesson: de3-futur
  type: text
  module_quiz: true
  topic: Future
  stem: 'Write the correct form of werden: "Du ___ das schaffen." "Es ___ bald regnen."'
  accept:
    - [wirst]
    - [wird]
  explanation: |-
    werden is irregular: du wirst (no d) and er/sie/es wird. The infinitive (schaffen, regnen) goes to the end.
- id: de3-m1-r2-q17
  lesson: de3-futur
  type: match
  topic: werden
  stem: 'Match each sentence to the job "werden" does in it.'
  pairs:
    - ['Sie wird Ärztin.', 'Full verb: to become']
    - ['Es wird morgen regnen.', 'Future']
    - ['Das Haus wird gebaut.', 'Passive']
    - ['Er wird wohl krank sein.', 'Assumption about now']
  distractors: [Wish]
  explanation: |-
    werden + noun or adjective means to become. werden + infinitive is the future, or, with wohl and a present situation, a guess about now. werden + past participle (gebaut) is the passive.
- id: de3-m1-r2-q18
  lesson: de3-futur
  module_quiz: true
  topic: Future
  stem: 'In which situations is werden + infinitive the most natural choice? Select all that apply.'
  choices: ['A weather forecast saying that rain is coming.', 'A promise to a friend that you will help.', 'Telling a friend your plan to go to Hamburg tomorrow.', 'Saying that the meeting starts at ten.']
  answer: [0, 1]
  explanation: |-
    Predictions and promises use werden: Es wird regnen. Ich werde dir helfen. Plans with a time word and timetables are normally in the present: Morgen fahre ich nach Hamburg. Das Meeting beginnt um zehn.
- id: de3-m1-r2-q19
  lesson: de3-futur
  type: order
  topic: Future
  stem: 'Put the words in order to say "I believe that technology will change our lives." Start with "Ich".'
  items: [Ich, glaube, dass, die Technik, unser Leben, verändern, wird]
  explanation: |-
    dass sends the verb to the end. In the future, werden is the conjugated verb, so it comes last of all, after the infinitive: … dass die Technik unser Leben verändern wird.
- id: de3-m1-r2-q20
  lesson: de3-futur
  type: text
  topic: Future
  stem: 'Say it as a guess with werden + wohl: "Er ist wahrscheinlich im Labor." → "Er ___ wohl im Labor ___."'
  accept:
    - [wird]
    - [sein]
  explanation: |-
    werden + wohl + infinitive makes an assumption about the present: Er wird wohl im Labor sein (he's probably in the lab). Nothing here is about the future.

# --- 05 de3-n-nouns ---
- id: de3-m1-r2-q21
  lesson: de3-n-nouns
  type: text
  module_quiz: true
  topic: Nouns
  stem: 'Complete with the correct form: "Ich frage meinen ___ (Kollege)." "Wir sprechen mit dem ___ (Nachbar)."'
  accept:
    - [Kollegen]
    - [Nachbarn]
  explanation: |-
    Both are weak nouns: they add -n in every form except the nominative singular. Accusative: meinen Kollegen. Dative: dem Nachbarn.
- id: de3-m1-r2-q22
  lesson: de3-n-nouns
  topic: Nouns
  stem: 'Which nouns are weak nouns (n-declension)? Select all that apply.'
  choices: ['der Student', 'der Tisch', 'der Junge', 'die Kollegin', 'der Präsident']
  answer: [0, 2, 4]
  explanation: |-
    der Student and der Präsident are foreign words for people in -ent; der Junge is a masculine person ending in -e. der Tisch is a normal noun (den Tisch), and feminine nouns like die Kollegin are never weak.
- id: de3-m1-r2-q23
  lesson: de3-n-nouns
  type: match
  module_quiz: true
  topic: Adjectival nouns
  stem: 'Complete each sentence with the right form of "Deutsche/Deutscher".'
  pairs:
    - ['Er ist ein ___.', Deutscher]
    - ['Sie ist eine ___.', Deutsche]
    - ['Die ___ trinken viel Mineralwasser.', Deutschen]
    - ['Ich habe mit einem ___ gesprochen.', Deutschen]
  distractors: [Deutsch]
  explanation: |-
    Deutsche is an adjectival noun, so it takes adjective endings: ein Deutscher (masculine after ein), eine Deutsche, die Deutschen (plural after die), mit einem Deutschen (dative). Deutsch with no ending is the language.
- id: de3-m1-r2-q24
  lesson: de3-n-nouns
  type: order
  topic: Nouns
  stem: 'Put the words in order to say "Yesterday I helped the Frenchman." Start with "Gestern".'
  items: [Gestern, habe, ich, dem Franzosen, geholfen]
  explanation: |-
    helfen takes the dative, and der Franzose is a weak noun: dem Franzosen. The perfect follows the bracket: habe in position 2, geholfen at the end.
- id: de3-m1-r2-q25
  lesson: de3-n-nouns
  type: text
  topic: Adjectival nouns
  stem: 'Complete: "Gibt es etwas ___ (neu)?" "Alles ___ (gut) zum Geburtstag!"'
  accept:
    - [Neues]
    - [Gute]
  explanation: |-
    Adjectives used as nouns for things are written with a capital letter. After etwas the ending is -es (etwas Neues); after alles it is -e (alles Gute).

# --- 05h1 de3-m1-h-futur-zwei (honors) ---
- id: de3-m1-r2-h01
  lesson: de3-m1-h-futur-zwei
  topic: Futur II
  stem: 'Which sentence is in the Futur II?'
  choices: ['Er wird den Brief geschrieben haben.', 'Er wird den Brief schreiben.', 'Er hatte den Brief geschrieben.', 'Er wird den Brief geschrieben.']
  answer: 0
  explanation: |-
    The Futur II is werden + participle + haben/sein: wird … geschrieben haben. "wird … schreiben" is the Futur I, "hatte … geschrieben" the past perfect, and "wird … geschrieben" without haben is incomplete.
- id: de3-m1-r2-h02
  lesson: de3-m1-h-futur-zwei
  topic: Futur II
  stem: 'Complete with "ankommen": "Morgen um diese Zeit ___ sie schon in Rom ___."'
  choices: ['wird … angekommen haben', 'ist … angekommen werden', 'wird … angekommen sein', 'wird … ankommen haben']
  answer: 2
  explanation: |-
    ankommen takes sein in the perfect (sie ist angekommen), so the Futur II is wird … angekommen sein. The helper is always the same as in the perfect, and the participle (angekommen), not the infinitive, is needed.
- id: de3-m1-r2-h03
  lesson: de3-m1-h-futur-zwei
  topic: Assumptions
  stem: '"Sie antwortet nicht. Sie wird die Nachricht nicht gesehen haben." What does the second sentence mean?'
  choices: ['She won''t see the message.', 'She will have to see the message.', 'She hadn''t seen the message.', 'She probably hasn''t seen the message.']
  answer: 3
  explanation: |-
    With no future time point, the Futur II is a guess about the past: she probably hasn't seen it. "won't see" would be Futur I (wird … nicht sehen), and "hadn't seen" is the past perfect (hatte … gesehen).
- id: de3-m1-r2-h04
  lesson: de3-m1-h-futur-zwei
  topic: Futur II
  stem: 'Which is the most natural everyday way to say "By Friday I''ll have written the report"?'
  choices: ['Bis Freitag hatte ich den Bericht geschrieben.', 'Bis Freitag habe ich den Bericht geschrieben.', 'Bis Freitag werde ich den Bericht geschrieben.', 'Bis Freitag wird der Bericht schreiben.']
  answer: 1
  explanation: |-
    In speech, the perfect plus a time word usually replaces the Futur II: Bis Freitag habe ich den Bericht geschrieben. "hatte … geschrieben" is the past perfect, "werde … geschrieben" lacks haben, and "wird der Bericht schreiben" says the report will write.
- id: de3-m1-r2-h05
  lesson: de3-m1-h-futur-zwei
  topic: Futur II
  stem: 'Which subordinate clause is correct?'
  choices: ['…, dass er wird den Zug verpasst haben.', '…, dass er den Zug haben verpasst wird.', '…, dass er den Zug verpasst haben wird.', '…, dass er den Zug verpasst wird haben.']
  answer: 2
  explanation: |-
    In a subordinate clause the conjugated verb goes to the very end. In the Futur II that is werden, after the perfect infinitive: … verpasst haben wird.
- id: de3-m1-r2-h06
  lesson: de3-m1-h-futur-zwei
  topic: Assumptions
  stem: '"Wo ist Lisa?" — "Sie ___ wohl noch im Büro ___." (She''s probably still at the office.)'
  choices: ['wird … sein', 'wird … gewesen sein', 'ist … gewesen', 'war … gewesen']
  answer: 0
  explanation: |-
    The guess is about now, so it is the Futur I + wohl: Sie wird wohl noch im Büro sein. "wird … gewesen sein" (Futur II) would be a guess about the past: she was probably at the office.
- id: de3-m1-r2-h07
  lesson: de3-m1-h-futur-zwei
  topic: Assumptions
  stem: '"Gestern war er nicht beim Training. Er wird krank gewesen sein." What does the speaker think?'
  choices: ['He will be ill tomorrow.', 'He is going to become ill.', 'He has definitely been ill.', 'He was probably ill yesterday.']
  answer: 3
  explanation: |-
    The Futur II here is a guess about the past: er wird krank gewesen sein = he was probably ill. It is a supposition, not a certainty and not a statement about the future.
- id: de3-m1-r2-h08
  lesson: de3-m1-h-futur-zwei
  topic: Crime stories
  stem: 'In the text "Der Einbruch in der Bäckerei", why does Kommissarin Yilmaz think the culprit knew the bakery well?'
  choices: ['He left fingerprints on the till.', 'He didn''t touch the safe, because he knew there was no money in it.', 'He came in through the front door with a key.', 'The baker saw him in the night.']
  answer: 1
  explanation: |-
    "Der Täter hat nur die Kasse geöffnet und den Tresor nicht angefasst. Er wird gewusst haben, dass dort kein Geld war." Only an insider would know that. There were no fingerprints, and he came in through the window.
- id: de3-m1-r2-h09
  lesson: de3-m1-h-futur-zwei
  type: text
  topic: Futur II
  stem: 'Put "Wir befragen alle Zeugen." into the Futur II: "Bis heute Abend ___ wir alle Zeugen ___ ___."'
  accept:
    - [werden]
    - [befragt]
    - [haben]
  explanation: |-
    werden in position 2, then the perfect infinitive at the end: befragt haben (befragen is inseparable, so no ge-, and it takes haben). Bis heute Abend werden wir alle Zeugen befragt haben.
- id: de3-m1-r2-h10
  lesson: de3-m1-h-futur-zwei
  type: text
  topic: Assumptions
  stem: 'Make a guess about the past with "einsteigen": "Das Fenster ist offen. Der Täter ___ durch das Fenster ___ ___."'
  accept:
    - [wird]
    - [eingestiegen]
    - [sein]
  explanation: |-
    einsteigen is separable and takes sein (ist eingestiegen), so the Futur II is wird … eingestiegen sein: the culprit probably climbed in through the window.
- id: de3-m1-r2-h11
  lesson: de3-m1-h-futur-zwei
  type: order
  topic: Futur II
  stem: 'Put the words in order to say "By then we will have found the culprit." Start with "Bis dahin".'
  items: [Bis dahin, werden, wir, den Täter, gefunden, haben]
  explanation: |-
    Bis dahin fills position 1, so werden comes next, then the subject wir. The perfect infinitive gefunden haben closes the sentence.
- id: de3-m1-r2-h12
  lesson: de3-m1-h-futur-zwei
  type: match
  topic: Assumptions
  stem: 'Match each sentence to its meaning.'
  pairs:
    - ['Er wird wohl krank sein.', 'He is probably ill.']
    - ['Er wird wohl krank gewesen sein.', 'He was probably ill.']
    - ['Bis Montag wird er das Buch gelesen haben.', 'By Monday he will have read the book.']
    - ['Er wird das Buch morgen lesen.', 'He is going to read the book tomorrow.']
  distractors: ['He had read the book.']
  explanation: |-
    Futur I + wohl guesses about now; Futur II + wohl guesses about the past. With a future point (bis Montag) the Futur II says what will be finished by then. Futur I with a time word is a plan or prediction. "He had read the book" would be the past perfect: Er hatte das Buch gelesen.
- id: de3-m1-r2-h13
  lesson: de3-m1-h-futur-zwei
  topic: Futur II
  stem: 'Which sentences are correct Futur II? Select all that apply.'
  choices: ['Sie wird schon gegangen sein.', 'Sie wird schon gegangen haben.', 'Wir werden das Haus verkauft haben.', 'Ich werde den Film gesehen sein.', 'Ihr werdet es bis dahin geschafft haben.']
  answer: [0, 2, 4]
  explanation: |-
    The helper is the same as in the perfect: sie ist gegangen → wird gegangen sein; wir haben verkauft → werden verkauft haben; ihr habt geschafft → werdet geschafft haben. gehen takes sein, not haben, and sehen takes haben, not sein.
- id: de3-m1-r2-h14
  lesson: de3-m1-h-futur-zwei
  type: label
  topic: Futur II
  stem: 'The timeline has two reference points, damals in the past and Freitag in the future. Name the tense at each numbered point.'
  image: {src: images/de3-m1-tenses-blank.svg, alt: 'A timeline with jetzt in the middle, a reference point damals in the past and a reference point Freitag in the future. Five points are numbered from left to right: one before damals, damals itself, jetzt, one just before Freitag, and Freitag itself. Arrows look back from damals to point 1 and from Freitag to point 4.'}
  labels:
    - {x: 15.3, y: 51.4, text: Plusquamperfekt}
    - {x: 30.6, y: 51.4, text: Präteritum or Perfekt}
    - {x: 50.0, y: 51.4, text: Präsens}
    - {x: 69.4, y: 51.4, text: Futur II}
    - {x: 81.9, y: 51.4, text: Futur I}
  distractors: [Konjunktiv II]
  explanation: |-
    The past perfect looks back from a past point (damals) to something earlier; the Futur II looks back from a future point (Freitag) to something finished before it. damals itself is told in the simple past or perfect, jetzt in the present, and Freitag in the Futur I. The Konjunktiv II is not a tense on the timeline but a mood for unreal situations.
- id: de3-m1-r2-h15
  lesson: de3-m1-h-futur-zwei
  topic: Crime stories
  stem: 'What does "Die Polizei hat den Einbrecher am Bahnhof festgenommen." mean?'
  choices: ['The police held the burglar''s hand at the station.', 'The police released the burglar at the station.', 'The police arrested the burglar at the station.', 'The police followed the burglar to the station.']
  answer: 2
  explanation: |-
    festnehmen (nahm fest, hat festgenommen) means to arrest. Releasing someone would be freilassen; following would be verfolgen.

# --- 05h2 de3-m1-h-time-phrases (honors) ---
- id: de3-m1-r2-h16
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'Which phrase means the same as "Nachdem sie zurückgekehrt war, …"?'
  choices: ['Nachdem ihrer Rückkehr …', 'Nach ihrer Rückkehr …', 'Vor ihrer Rückkehr …', 'Seit ihrer Rückkehr …']
  answer: 1
  explanation: |-
    nachdem + clause becomes nach + dative: nach ihrer Rückkehr. nachdem is a conjunction and cannot stand before a noun. vor means before and seit means since, which change the meaning.
- id: de3-m1-r2-h17
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'Which phrase can replace the clause in "Als wir ankamen, regnete es."?'
  choices: ['Nach unserer Ankunft regnete es.', 'Seit unserer Ankunft regnete es.', 'Vor unserer Ankunft regnete es.', 'Bei unserer Ankunft regnete es.']
  answer: 3
  explanation: |-
    als (and wenn) become bei + dative: bei unserer Ankunft = when we arrived. nach would mean after, seit since and vor before.
- id: de3-m1-r2-h18
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'Complete: "___ Lesen schläft mein Vater oft ein." (while reading)'
  choices: ['Beim', 'Bei', 'Zum', 'Im']
  answer: 0
  explanation: |-
    "While doing something" is beim + nominalised infinitive: beim Lesen (bei dem → beim, because das Lesen is neuter). Zum Lesen means for reading (Ich brauche eine Brille zum Lesen).
- id: de3-m1-r2-h19
  lesson: de3-m1-h-time-phrases
  topic: Time clauses
  stem: 'Which clause means the same as "Nach dem Essen gingen wir spazieren."?'
  choices: ['Nachdem wir aßen, gingen wir spazieren.', 'Nachdem wir gegessen hatten, wir gingen spazieren.', 'Nachdem wir gegessen hatten, gingen wir spazieren.', 'Nach wir gegessen hatten, gingen wir spazieren.']
  answer: 2
  explanation: |-
    A phrase has no tense, so you choose it: the main clause is in the simple past, and nachdem goes one step further back, into the past perfect. After the clause the main clause starts with its verb (gingen wir). nach cannot introduce a clause.
- id: de3-m1-r2-h20
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'What is the noun that belongs to "beginnen"?'
  choices: ['die Beginnung', 'der Beginn', 'das Begann', 'die Beginnheit']
  answer: 1
  explanation: |-
    beginnen has a short stem noun: der Beginn (vor Beginn des Konzerts). Not every verb makes an -ung noun; you learn these nouns one by one.
- id: de3-m1-r2-h21
  lesson: de3-m1-h-time-phrases
  topic: Life stories
  stem: 'According to the plaque, what did Clara Brenner do in 1919?'
  image: {src: images/de3-m1-plaque.svg, alt: 'A museum plaque. Clara Brenner (1891–1974), Fotografin. 1891 Geburt in Lübeck. 1910 nach dem Abitur Ausbildung in einem Fotoatelier. 1919 Gründung eines eigenen Ateliers in Hamburg. 1933–1949 Aufenthalt in New York. 1949 nach ihrer Rückkehr Fotos vom Wiederaufbau. 1960 Beginn des Ruhestands, Umzug an die Ostsee. 1974 Tod in Travemünde.'}
  choices: ['She started an apprenticeship.', 'She returned from New York.', 'She moved to the Baltic coast.', 'She founded her own studio in Hamburg.']
  answer: 3
  explanation: |-
    "1919 Gründung eines eigenen Ateliers in Hamburg": die Gründung is the noun of gründen (to found). The apprenticeship began in 1910, she returned in 1949 and moved to the Baltic in 1960.
- id: de3-m1-r2-h22
  lesson: de3-m1-h-time-phrases
  topic: Time clauses
  stem: 'What does "Er war kaum zu Hause, als das Telefon klingelte." mean?'
  choices: ['He had hardly got home when the phone rang.', 'He was rarely at home when the phone rang.', 'The phone rang because he was at home.', 'The phone rang before he got home.']
  answer: 0
  explanation: |-
    kaum …, als = hardly … when: the phone rang right after he got home. kaum means hardly or barely here, not rarely.
- id: de3-m1-r2-h23
  lesson: de3-m1-h-time-phrases
  topic: Time clauses
  stem: '"Sooft ich sie besuche, backt sie einen Kuchen." What does "sooft" mean here?'
  choices: ['as soon as', 'although', 'whenever', 'so often that']
  answer: 2
  explanation: |-
    sooft (one word) is a conjunction meaning whenever, every time that. As soon as is sobald; so oft as two words means so often.
- id: de3-m1-r2-h24
  lesson: de3-m1-h-time-phrases
  type: text
  topic: Time phrases
  stem: 'Write the prepositions: "Seit sie geheiratet haben" → "___ ihrer Heirat"; "Bis er in Rente ging" → "___ ___ seinem Ruhestand".'
  accept:
    - [seit]
    - [bis]
    - [zu]
  explanation: |-
    seit stays seit (+ dative): seit ihrer Heirat. bis + clause becomes bis zu + dative: bis zu seinem Ruhestand (or bis zum Ruhestand).
- id: de3-m1-r2-h25
  lesson: de3-m1-h-time-phrases
  type: text
  topic: Time phrases
  stem: 'Write the noun with its article (nominative): ankommen → ___, gründen → ___, sterben → ___.'
  accept:
    - [die Ankunft]
    - [die Gründung, die Gruendung]
    - [der Tod]
  explanation: |-
    ankommen → die Ankunft (a short stem noun with a vowel change); gründen → die Gründung (-ung nouns are always feminine); sterben → der Tod (a different word altogether).
- id: de3-m1-r2-h26
  lesson: de3-m1-h-time-phrases
  type: match
  topic: Time phrases
  stem: 'Match each conjunction to the preposition that replaces it in a time phrase.'
  pairs:
    - [als, bei]
    - [nachdem, nach]
    - [bevor, vor]
    - [seit, seit]
    - [bis, bis zu]
  distractors: [wegen]
  explanation: |-
    als/wenn → bei, nachdem → nach, bevor → vor, seit → seit, bis → bis zu. wegen (because of) is a preposition of cause, not of time.
- id: de3-m1-r2-h27
  lesson: de3-m1-h-time-phrases
  type: order
  topic: Life stories
  stem: 'Put the words in order to say "After her return she founded a studio." Start with "Nach".'
  items: [Nach, ihrer Rückkehr, gründete, sie, ein Atelier]
  explanation: |-
    The phrase nach ihrer Rückkehr fills position 1, so the verb gründete follows, then the subject sie and the object ein Atelier.
- id: de3-m1-r2-h28
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Nachdem dem Abitur machte sie eine Ausbildung.', 'Nach dem Abitur machte sie eine Ausbildung.', 'Beim Autofahren soll man nicht telefonieren.', 'Bei wir ankamen, regnete es.', 'Seit ihrer Heirat wohnen sie in Graz.']
  answer: [1, 2, 4]
  explanation: |-
    Prepositions go with nouns (nach dem Abitur, beim Autofahren, seit ihrer Heirat); conjunctions go with clauses. "Nachdem dem Abitur" puts a conjunction before a noun, and "Bei wir ankamen" puts a preposition before a clause (Als wir ankamen or Bei unserer Ankunft).
- id: de3-m1-r2-h29
  lesson: de3-m1-h-time-phrases
  type: text
  topic: Time clauses
  stem: 'Rewrite with nachdem: "Nach der Abfahrt des Zuges rief ich meine Mutter an." → "Nachdem der Zug ___ ___, rief ich meine Mutter an."'
  accept:
    - [abgefahren]
    - [war]
  explanation: |-
    The main clause is in the simple past, so the nachdem clause takes the past perfect. abfahren goes with sein, and in a subordinate clause the conjugated helper is last: nachdem der Zug abgefahren war.
- id: de3-m1-r2-h30
  lesson: de3-m1-h-time-phrases
  topic: Time phrases
  stem: 'In which sentence does "vor" mean "ago"?'
  choices: ['Vor der Abfahrt kontrollierte der Fahrer die Reifen.', 'Vor dem Konzert aßen wir etwas.', 'Er wartete vor dem Kino.', 'Sie ist vor zwei Jahren umgezogen.']
  answer: 3
  explanation: |-
    vor + a time span (vor zwei Jahren) means ago. vor der Abfahrt and vor dem Konzert mean before an event, and vor dem Kino is a place: in front of the cinema.
