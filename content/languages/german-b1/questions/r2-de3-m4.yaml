# German B1, module 4 (round 2): new question types for the core lessons, and the honors lessons.

# --- 16 de3-passive-present ---
- id: de3-m4-r2-q01
  lesson: de3-passive-present
  type: text
  module_quiz: true
  topic: Passive
  stem: 'Complete with the present passive of "sortieren": "Das Altglas ___ nach Farben ___."'
  accept:
    - [wird]
    - [sortiert]
  explanation: |-
    The present passive is werden + Partizip II. "Das Altglas" is singular, so werden takes the er/sie/es form "wird" in position 2, and the participle "sortiert" (no ge- with -ieren verbs) goes to the end.
- id: de3-m4-r2-q02
  lesson: de3-passive-present
  type: order
  topic: Passive
  stem: 'Put the words in order to say "Bikes are produced in this factory." The capitalised word comes first.'
  items: [In, dieser, Fabrik, werden, Fahrräder, produziert]
  explanation: |-
    "In dieser Fabrik" fills position 1, so the conjugated "werden" comes second, then the subject "Fahrräder", and the participle "produziert" goes to the very end. "werden" is plural because "Fahrräder" is plural.
- id: de3-m4-r2-q03
  lesson: de3-passive-present
  module_quiz: true
  topic: Passive
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Der Müll wird von der Stadt abgeholt.', 'Das Metall wird durch Magneten herausgezogen.', 'Den Müll wird abgeholt.', 'Die Flaschen wird gesammelt.', 'Man trennen den Müll.']
  answer: [0, 1]
  explanation: |-
    "von der Stadt" (von + dative for an organisation) and "durch Magneten" (durch for a means) are both right. "Den Müll" keeps the accusative, but the passive subject must be nominative: "Der Müll wird abgeholt". "Die Flaschen" is plural, so "werden gesammelt". With man the verb is singular: "Man trennt den Müll".
- id: de3-m4-r2-q04
  lesson: de3-passive-present
  type: label
  topic: Production and recycling
  stem: 'Name the numbered rubbish containers.'
  image: {src: images/de3-m4-bins-blank.svg, alt: 'Five rubbish containers without names: a yellow bin for packaging, a blue bin for paper and cardboard, a brown bin for food scraps and garden waste, a grey bin for everything else, and a container with openings for white, green and brown glass. Each is numbered.'}
  labels:
    - {x: 11.0, y: 45.5, text: die gelbe Tonne}
    - {x: 30.5, y: 45.5, text: die blaue Tonne}
    - {x: 50.0, y: 45.5, text: die Biotonne}
    - {x: 69.5, y: 45.5, text: die Restmülltonne}
    - {x: 89.0, y: 60.6, text: der Altglascontainer}
  distractors: [das Pfand, der Eimer]
  explanation: |-
    Packaging goes in the yellow bin (die gelbe Tonne), paper and cardboard in the blue bin (die blaue Tonne), food and garden waste in the brown Biotonne, everything else in the grey Restmülltonne, and bottles and jars, sorted by colour, in the Altglascontainer. das Pfand is the deposit on bottles, and der Eimer is a bucket.
- id: de3-m4-r2-q05
  lesson: de3-passive-present
  type: match
  topic: Passive
  stem: 'Match each sentence to the job that "werden" is doing in it.'
  pairs:
    - ['Der Strom wird teurer.', 'become (full verb)']
    - ['Der Strom wird teurer werden.', 'future']
    - ['Der Strom wird durch Windkraft erzeugt.', 'passive']
    - ['Sie wird Ingenieurin.', 'become (full verb)']
    - ['Das Haus wird gebaut.', 'passive']
  distractors: [perfect]
  explanation: |-
    Look at what goes with werden: an adjective or noun (teurer, Ingenieurin) means "become"; an infinitive (teurer werden) makes the future; a Partizip II (erzeugt, gebaut) makes the passive. werden never forms the perfect of other verbs.

# --- 17 de3-passive-past ---
- id: de3-m4-r2-q06
  lesson: de3-passive-past
  type: text
  module_quiz: true
  topic: Passive
  stem: 'Complete with "worden" or "geworden": "Mein Fahrrad ist gestohlen ___." "Sie ist Journalistin ___."'
  accept:
    - [worden]
    - [geworden]
  explanation: |-
    The first sentence already has a participle (gestohlen), so it is the Perfekt passive and needs "worden". In the second, werden is the full verb "become" (she has become a journalist), so its participle is "geworden".
- id: de3-m4-r2-q07
  lesson: de3-passive-past
  type: label
  topic: News and history
  stem: 'Name the numbered parts of this newspaper page.'
  image: {src: images/de3-m4-newspaper-blank.svg, alt: 'The front page of the Stadtanzeiger without labels: the date line, the headline Bäckerei durch Brand zerstört, a photo of a burning house, a caption in italics under the photo, and the article text. Five parts are numbered.'}
  labels:
    - {x: 18.8, y: 16.7, text: das Datum}
    - {x: 50.0, y: 24.4, text: die Schlagzeile}
    - {x: 71.7, y: 43.7, text: das Foto}
    - {x: 62.5, y: 62.7, text: die Bildunterschrift}
    - {x: 50.0, y: 79.8, text: der Artikel}
  distractors: [die Anzeige, die Pressekonferenz]
  explanation: |-
    1 is the date (das Datum), 2 the headline (die Schlagzeile), 3 the photo (das Foto), 4 the caption under it (die Bildunterschrift) and 5 the article (der Artikel). There is no advert (die Anzeige) on the page, and a press conference is an event, not part of a page.
- id: de3-m4-r2-q08
  lesson: de3-passive-past
  type: order
  topic: Passive
  stem: 'Finish the sentence "Ich habe gelesen, …" to say "that two paintings have been stolen". Put the words in order.'
  items: [dass, zwei, Bilder, gestohlen, worden, sind]
  explanation: |-
    After dass, the conjugated verb goes to the very end. The end of the clause is a chain: participle, worden, conjugated sein: "gestohlen worden sind".
- id: de3-m4-r2-q09
  lesson: de3-passive-past
  module_quiz: true
  topic: Passive
  stem: 'Which sentences describe an action (an event), not a state? Select all that apply.'
  choices: ['Die Straße wurde um 8 Uhr gesperrt.', 'Die Straße ist gesperrt.', 'Die Tür ist geöffnet worden.', 'Heute geschlossen.', 'Die Bäckerei wurde 1952 eröffnet.']
  answer: [0, 2, 4]
  explanation: |-
    wurde + participle and ist + participle + worden describe events: someone closed the road, opened the door, opened the bakery. "Die Straße ist gesperrt" and the sign "Heute geschlossen" are the state passive: they describe the situation now.
- id: de3-m4-r2-q10
  lesson: de3-passive-past
  type: match
  topic: News and history
  stem: 'Match each word to its meaning.'
  pairs:
    - ['die Schlagzeile', 'headline']
    - ['die Meldung', 'news item']
    - ['aktuell', 'current']
    - ['abschaffen', 'to abolish']
    - ['errichten', 'to put up (a building)']
  distractors: [actual, to invent]
  explanation: |-
    aktuell is a false friend: it means "current, up to date", not "actual" (that is eigentlich or tatsächlich). "to invent" is erfinden.

# --- 18 de3-passive-modal ---
- id: de3-m4-r2-q11
  lesson: de3-passive-modal
  type: text
  module_quiz: true
  topic: Passive
  stem: 'Complete with the modal passive ("must be submitted"): "Der Antrag ___ bis Freitag eingereicht ___."'
  accept:
    - [muss]
    - [werden]
  explanation: |-
    The modal verb stands in position 2 and agrees with the subject (der Antrag: muss). At the end comes the passive infinitive: participle + werden, "eingereicht werden". Not "worden": that is only for the Perfekt passive.
- id: de3-m4-r2-q12
  lesson: de3-passive-modal
  type: order
  topic: Passive
  stem: 'Finish the sentence "Im Brief steht, …" to say "that the application must be submitted". Put the words in order.'
  items: [dass, der, Antrag, eingereicht, werden, muss]
  explanation: |-
    In a subordinate clause the conjugated modal goes to the very end, so the chain is participle, werden, modal: "eingereicht werden muss". In a main clause the modal is the first verb; in a subordinate clause it is the last.
- id: de3-m4-r2-q13
  lesson: de3-passive-modal
  type: match
  topic: Public life and rules
  stem: 'Match each sign or notice to the sentence with the same meaning.'
  image: {src: images/de3-m4-signs.svg, alt: 'Three signs. A blue sign: Hunde sind an der Leine zu führen. A red sign: Betreten der Baustelle verboten! Eltern haften für ihre Kinder. A green sign: Bitte den Rasen nicht betreten. Die Stadtverwaltung.'}
  pairs:
    - ['Hunde sind an der Leine zu führen.', 'Hunde müssen an der Leine geführt werden.']
    - ['Der Ausweis ist vorzulegen.', 'Der Ausweis muss vorgelegt werden.']
    - ['Das Problem ist leicht zu lösen.', 'Das Problem kann leicht gelöst werden.']
    - ['Bitte den Rasen nicht betreten.', 'Der Rasen darf nicht betreten werden.']
  distractors: [Der Rasen muss nicht betreten werden., Das Problem muss leicht gelöst werden.]
  explanation: |-
    sein + zu in a rule means "must" (Hunde sind … zu führen, Der Ausweis ist vorzulegen); with leicht it means "can" (ist leicht zu lösen). A ban needs darf nicht; "muss nicht betreten werden" would mean nobody has to walk on the grass.
- id: de3-m4-r2-q14
  lesson: de3-passive-modal
  module_quiz: true
  topic: Public life and rules
  stem: 'Which sentences say that something is forbidden? Select all that apply.'
  choices: ['Der Rasen darf nicht betreten werden.', 'Der Antrag muss nicht persönlich abgegeben werden.', 'Rauchen ist in allen öffentlichen Gebäuden verboten.', 'Hier dürfen keine Fahrräder abgestellt werden.', 'Die Gebühr kann bar bezahlt werden.']
  answer: [0, 2, 3]
  explanation: |-
    darf nicht / dürfen keine and verboten express a ban. "muss nicht" only means it isn't necessary (you don't have to hand it in in person), and "kann bar bezahlt werden" is a possibility.
- id: de3-m4-r2-q15
  lesson: de3-passive-modal
  type: text
  topic: Public life and rules
  stem: 'Complete with a -bar adjective: "Man kann den Pilz essen. Er ist ___." "Man kann die Schrift nicht lesen. Sie ist ___." (der Pilz: mushroom)'
  accept:
    - [essbar]
    - [unlesbar, nicht lesbar]
  explanation: |-
    -bar means "can be …-ed": essbar (edible) = kann gegessen werden. un- makes it negative: unlesbar (illegible) = kann nicht gelesen werden.

# --- 19 de3-opinions-media ---
- id: de3-m4-r2-q16
  lesson: de3-opinions-media
  type: text
  module_quiz: true
  topic: Da- and wo- compounds
  stem: 'Complete with a da- or wo-compound: "___ wartest du?" – "Auf den Bus." / "Ich bin ___, dass wir mehr Datenschutz brauchen." (in favour of it)'
  accept:
    - [Worauf]
    - [dafür, dafuer]
  explanation: |-
    warten auf + a thing: the question is "Worauf?", with r because auf starts with a vowel. "in favour of" is für, and before a dass-clause the forward-pointing da-word is "dafür" (no r: für starts with a consonant).
- id: de3-m4-r2-q17
  lesson: de3-opinions-media
  type: label
  topic: Media
  stem: 'Name the numbered parts of this social media post.'
  image: {src: images/de3-m4-post-blank.svg, alt: 'A social media post without labels: a profile picture and the name Tina_Wahrheit, the text of the post, a link box with a source, a row of buttons including Teilen, and a comment by Max B. Five parts are numbered.'}
  labels:
    - {x: 13.4, y: 13.6, text: das Profil}
    - {x: 50.0, y: 30.6, text: der Beitrag}
    - {x: 50.0, y: 53.2, text: die Quelle}
    - {x: 79.2, y: 65.3, text: Teilen}
    - {x: 50.0, y: 83.8, text: der Kommentar}
  distractors: [die Privatsphäre, der Datenschutz]
  explanation: |-
    1 is the profile of the person posting (das Profil), 2 the post itself (der Beitrag), 3 the link with its source (die Quelle), 4 the share button (Teilen) and 5 a comment (der Kommentar). Privacy and data protection are ideas, not parts of the screen.
- id: de3-m4-r2-q18
  lesson: de3-opinions-media
  type: match
  module_quiz: true
  topic: Opinions
  stem: 'Match each phrase to what it does in a discussion.'
  pairs:
    - ['Da stimme ich dir zu.', 'agreeing']
    - ['Das sehe ich anders.', 'disagreeing']
    - ['Da hast du zwar recht, aber …', partly agreeing]
    - ['Meiner Ansicht nach …', 'giving your opinion']
    - ['Was hältst du davon?', 'asking for an opinion']
    - ['Da muss ich dir widersprechen.', 'disagreeing']
  distractors: [ending the discussion]
  explanation: |-
    zustimmen = agree; "Das sehe ich anders" and "widersprechen" disagree; "zwar …, aber" grants a point and then objects; "Meiner Ansicht nach" introduces your view; "Was hältst du davon?" asks for the other person's view.
- id: de3-m4-r2-q19
  lesson: de3-opinions-media
  topic: Da- and wo- compounds
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Über wen sprichst du?', 'Worüber diskutiert ihr?', 'Ich halte das als eine gute Idee.', 'Es kommt darauf an, ob die Quelle glaubwürdig ist.', 'Ich widerspreche dich.']
  answer: [0, 1, 3]
  explanation: |-
    For a person you use preposition + wen (Über wen?), for a thing a wo-word (Worüber?). "Es kommt darauf an, ob …" is the fixed phrase. It is "halten für" (Ich halte das für eine gute Idee), and widersprechen takes the dative: "Ich widerspreche dir".
- id: de3-m4-r2-q20
  lesson: de3-opinions-media
  type: order
  topic: Da- and wo- compounds
  stem: 'Put the words in order to say "I''m looking forward to seeing you." The capitalised word comes first.'
  items: [Ich, freue, mich, darauf, dich, zu, sehen]
  explanation: |-
    sich freuen auf + a zu-infinitive: the da-word "darauf" stays in the main clause and points ahead to "dich zu sehen". (In writing, a comma goes after darauf.)

# --- 20 de3-politics-society ---
- id: de3-m4-r2-q21
  lesson: de3-politics-society
  type: label
  module_quiz: true
  topic: Politics
  stem: 'Name the numbered parts of this diagram of how Germany is governed.'
  image: {src: images/de3-m4-system-blank.svg, alt: 'A diagram of the German federal system without names. Box 1: Staatsoberhaupt; it appoints box 2: Bundeskanzler(in), Ministerinnen und Minister. Box 3: 630 Abgeordnete; it elects the Chancellor. Box 4: Mitglieder der 16 Landesregierungen, sent by the 16 Bundesländer. Box 5: ab 18 Jahren; these people elect box 3.'}
  labels:
    - {x: 50.0, y: 8.6, text: der Bundespräsident}
    - {x: 22.5, y: 35.4, text: die Bundesregierung}
    - {x: 22.5, y: 67.5, text: der Bundestag}
    - {x: 77.5, y: 67.5, text: der Bundesrat}
    - {x: 22.5, y: 90.7, text: die Wählerinnen und Wähler}
  distractors: [die Bürgerinitiative, die Partei]
  explanation: |-
    The head of state is the Federal President (1), who appoints the federal government (2: the Chancellor and the ministers). The Bundestag (3) has 630 members and elects the Chancellor; it is elected by the voters (5), from the age of 18. The Bundesrat (4) is made up of members of the 16 state governments.
- id: de3-m4-r2-q22
  lesson: de3-politics-society
  type: match
  topic: Nominal style
  stem: 'Match each noun to the verb it comes from.'
  pairs:
    - ['die Einführung', 'einführen']
    - ['die Wahl', 'wählen']
    - ['der Beschluss', 'beschließen']
    - ['die Erhöhung', 'erhöhen']
    - ['die Abschaffung', 'abschaffen']
  distractors: [entscheiden, regieren]
  explanation: |-
    Most nouns of nominal style end in -ung (einführen → die Einführung, erhöhen → die Erhöhung, abschaffen → die Abschaffung); some are short forms of the verb (wählen → die Wahl, beschließen → der Beschluss). entscheiden gives die Entscheidung and regieren die Regierung.
- id: de3-m4-r2-q23
  lesson: de3-politics-society
  type: text
  module_quiz: true
  topic: Politics
  stem: 'Complete with infinitives: in an election you ___ people and parties; in parliament, people ___ über a question.'
  accept:
    - [wählen, waehlen]
    - [abstimmen]
  explanation: |-
    wählen is for elections and people (Wen hast du gewählt?); for a yes/no decision on a question German uses abstimmen über: Im Parlament wird über das Gesetz abgestimmt.
- id: de3-m4-r2-q24
  lesson: de3-politics-society
  topic: Politics
  stem: 'Which statements about Germany are true, according to the lesson? Select all that apply.'
  choices: ['The Bundestag is elected every four years.', 'The Chancellor is the head of state.', 'With the second vote you vote for a party.', 'The Bundestag elects the Chancellor.', 'The voting age for the Bundestag is 16.']
  answer: [0, 2, 3]
  explanation: |-
    The Bundestag is elected every four years, the second vote goes to a party and decides the seats, and the Bundestag elects the Chancellor. The head of state is the Federal President, and the voting age for the Bundestag is 18 (16 for European elections and some state and local elections).
- id: de3-m4-r2-q25
  lesson: de3-politics-society
  type: order
  topic: Reading the news
  stem: 'Put the three passes for reading a long news sentence in order, from the lesson''s method.'
  items: ['Find the main clause and its verb', 'Look at the relative clauses', 'Spot the passive and the genitive', 'Put the pieces together']
  explanation: |-
    First strip the sentence down to its main clause, then see what each relative clause describes, then decode the passive (wird / wurde + participle) and the genitive (des / der), and finally put it all together.

# --- 20h1 de3-m4-h-lawmaking (honors) ---
- id: de3-m4-r2-h01
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Complete: "Seit 2023 ___ das Rauchen in unserem Stadtpark verboten."'
  choices: ['ist', 'wird', 'wurde', 'hat']
  answer: 0
  explanation: |-
    "Seit 2023" describes a situation that still lasts, so you need the state passive: sein + participle, "ist verboten". "wurde verboten" would be the action at one moment (2023 wurde das Rauchen verboten), "wird verboten" the action happening now, and the passive is never formed with haben.
- id: de3-m4-r2-h02
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Which sentence describes the action of passing the law, not the state afterwards?'
  choices: ['Das Gesetz ist verabschiedet.', 'Das Gesetz war schon verabschiedet.', 'Das Gesetz wurde am Donnerstag verabschiedet.', 'Das Gesetz ist seit Mai verabschiedet.']
  answer: 2
  explanation: |-
    wurde + participle with a point in time (am Donnerstag) is the event: the vote happened on Thursday. The other three use sein + participle, the state passive: the law is (or was already) passed.
- id: de3-m4-r2-h03
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Which sentence is the passive of "Der Bundestag stimmte dem Gesetz zu."?'
  choices: ['Das Gesetz wurde vom Bundestag zugestimmt.', 'Dem Gesetz wurde vom Bundestag zugestimmt.', 'Dem Gesetz wurden vom Bundestag zugestimmt.', 'Dem Gesetz ist vom Bundestag zugestimmt.']
  answer: 1
  explanation: |-
    zustimmen takes the dative, and only an accusative object can become a passive subject. So "dem Gesetz" stays dative, there is no subject, and the verb is singular: "wurde zugestimmt". "Das Gesetz wurde zugestimmt" turns the dative into a nominative, "wurden" is plural for no reason, and "ist zugestimmt" is neither the Präteritum nor the Perfekt passive (that would be "ist zugestimmt worden").
- id: de3-m4-r2-h04
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Complete: "Den Flutopfern ___ schnell geholfen." (die Flutopfer: flood victims)'
  choices: ['werden', 'sind', 'hat', 'wird']
  answer: 3
  explanation: |-
    helfen takes the dative, so "den Flutopfern" is not the subject. A passive without a subject always has the er/sie/es form: "wird geholfen", even though the dative noun is plural.
- id: de3-m4-r2-h05
  lesson: de3-m4-h-lawmaking
  type: text
  topic: Passive
  stem: 'Complete with the present passive of "abstimmen": "Im März ___ über das Gesetz ___."'
  accept:
    - [wird]
    - [abgestimmt]
  explanation: |-
    abstimmen über has no accusative object, so the passive has no subject: "wird … abgestimmt", singular. The prepositional phrase "über das Gesetz" stays as it is. No es, because "Im März" is in position 1.
- id: de3-m4-r2-h06
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Which sentence is correct?'
  choices: ['Es wird im Bundestag über das Gesetz abgestimmt.', 'Im Bundestag es wird über das Gesetz abgestimmt.', 'Im Bundestag wird es über das Gesetz abgestimmt.', 'Im Bundestag werden über das Gesetz abgestimmt.']
  answer: 0
  explanation: |-
    In a passive without a subject, es only fills an empty position 1: "Es wird … abgestimmt". When "Im Bundestag" is in position 1, es disappears: "Im Bundestag wird über das Gesetz abgestimmt". The verb is always singular, and it must be in position 2.
- id: de3-m4-r2-h07
  lesson: de3-m4-h-lawmaking
  type: text
  topic: Passive
  stem: 'Rewrite "Das Problem kann leicht gelöst werden." with sich lassen: "Das Problem ___ ___ leicht lösen."'
  accept:
    - [lässt, laesst]
    - [sich]
  explanation: |-
    sich lassen + infinitive means "can be done". lassen agrees with the subject (das Problem: lässt), sich follows, and the infinitive goes to the end: "Das Problem lässt sich leicht lösen."
- id: de3-m4-r2-h08
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Which sentences mean "The windows can''t be opened"? Select all that apply.'
  choices: ['Die Fenster lassen sich nicht öffnen.', 'Die Fenster können nicht geöffnet werden.', 'Die Fenster müssen nicht geöffnet werden.', 'Man kann die Fenster nicht öffnen.', 'Die Fenster lassen nicht öffnen.']
  answer: [0, 1, 3]
  explanation: |-
    sich lassen, the modal passive with können and man + können all mean "can't be opened". "müssen nicht" means it isn't necessary to open them, and "lassen nicht öffnen" is missing sich.
- id: de3-m4-r2-h09
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Article 76 of the Basic Law says: "Vorlagen der Bundesregierung sind zunächst dem Bundesrat zuzuleiten." What does it mean?'
  choices: ['Government bills can first be sent to the Bundesrat.', 'Government bills must first be sent to the Bundesrat.', 'Government bills were first sent to the Bundesrat.', 'Government bills need not be sent to the Bundesrat.']
  answer: 1
  explanation: |-
    "sind … zuzuleiten" is sein + zu. In a rule, without a word like leicht or kaum, it means "must": müssen zugeleitet werden. It is present tense, and it is an obligation, not a possibility.
- id: de3-m4-r2-h10
  lesson: de3-m4-h-lawmaking
  type: order
  topic: Politics
  stem: 'Put the stages of a government bill in order.'
  items: ['The Bundesrat comments on the bill', 'First reading in the Bundestag', 'Work in a committee', 'Second and third reading, final vote', 'The Bundesrat deals with the passed law', 'The Federal President signs it', 'Publication in the Bundesgesetzblatt']
  explanation: |-
    A government bill goes to the Bundesrat for comment first, then to the Bundestag: first reading, committee, second and third reading with the final vote. Then the Bundesrat deals with it; after the countersignature the Federal President signs it, and it is published in the Bundesgesetzblatt.
- id: de3-m4-r2-h11
  lesson: de3-m4-h-lawmaking
  type: match
  topic: Politics
  stem: 'Match each word to its meaning.'
  pairs:
    - ['der Gesetzentwurf', 'bill (draft law)']
    - ['der Ausschuss', 'committee']
    - ['der Einspruch', 'objection']
    - ['die Zustimmung', 'consent']
    - ['in Kraft treten', 'to come into force']
  distractors: [to pass a law, coalition]
  explanation: |-
    "to pass a law" is verabschieden, and "coalition" is die Koalition.
- id: de3-m4-r2-h12
  lesson: de3-m4-h-lawmaking
  topic: Politics
  stem: 'A federal law does not name the day it comes into force. When does it come into force?'
  choices: ['On the day the Bundestag passes it', 'On the day the Federal President signs it', '14 days after it appears in the Bundesgesetzblatt', 'On the first day of the following month']
  answer: 2
  explanation: |-
    Article 82 of the Basic Law: if a law sets no date, it comes into force on the fourteenth day after the issue of the Bundesgesetzblatt that contains it appeared. Passing and signing are earlier steps.
- id: de3-m4-r2-h13
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'A politician says: "Es wurden Fehler gemacht." What does this passive leave out?'
  choices: ['when the mistakes were made', 'how many mistakes there were', 'where the mistakes were made', 'who made the mistakes']
  answer: 3
  explanation: |-
    The passive without von hides the doer. "Es wurden Fehler gemacht" admits mistakes but names nobody; a careful listener asks "Von wem?"
- id: de3-m4-r2-h14
  lesson: de3-m4-h-lawmaking
  topic: Passive
  stem: 'Which sentences are correct? Select all that apply.'
  choices: ['Der Ministerin wurde widersprochen.', 'Die Ministerin wurde widersprochen.', 'Es wurde beschlossen, dass die Bibliothek länger geöffnet bleibt.', 'Den Experten ist für ihre Hilfe gedankt worden.', 'Den Bürgern werden geholfen.']
  answer: [0, 2, 3]
  explanation: |-
    widersprechen and danken take the dative, which stays in the passive: "Der Ministerin wurde widersprochen", "Den Experten ist … gedankt worden". "Es wurde beschlossen, dass …" is correct with es in position 1. "Die Ministerin" wrongly makes the dative a subject, and a subjectless passive is singular: "Den Bürgern wird geholfen".

# --- 20h2 de3-m4-h-sources (honors) ---
- id: de3-m4-r2-h15
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'Complete: "___ Studie zufolge schlafen Jugendliche zu wenig."'
  choices: ['Einer', 'Eine', 'Einen', 'Eines']
  answer: 0
  explanation: |-
    zufolge comes after its noun, which is in the dative: "einer Studie zufolge" (die Studie, dative einer). "Eine" is nominative or accusative, "Einen" masculine accusative, "Eines" genitive.
- id: de3-m4-r2-h16
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'What does "Der Täter soll etwa 30 Jahre alt sein." mean?'
  choices: ['The offender should be about 30.', 'The offender is said to be about 30.', 'The offender claims to be about 30.', 'The offender wants to be about 30.']
  answer: 1
  explanation: |-
    In news reports, sollen often passes on what others say without confirming it: "is said to be". "claims to be" would be wollen, about the offender's own claim.
- id: de3-m4-r2-h17
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'What does "Der Fahrer will das Rotlicht nicht gesehen haben." mean?'
  choices: ['The driver didn''t want to see the red light.', 'The driver is said not to have seen the red light.', 'The driver will not have seen the red light.', 'The driver claims not to have seen the red light.']
  answer: 3
  explanation: |-
    wollen + perfect infinitive (gesehen haben) is a claim the subject makes about himself, and the speaker has doubts. "is said to" would be sollen, and "will" in German is not the English future.
- id: de3-m4-r2-h18
  lesson: de3-m4-h-sources
  type: text
  topic: Reporting claims
  stem: 'Complete with the perfect infinitive of "fahren": "Sie soll nach Spanien ___ ___." (She is said to have gone to Spain.)'
  accept:
    - [gefahren]
    - [sein]
  explanation: |-
    The perfect infinitive is participle + haben or sein, exactly as in the Perfekt. fahren (to a place) takes sein: "sie ist gefahren", so "gefahren sein".
- id: de3-m4-r2-h19
  lesson: de3-m4-h-sources
  type: order
  topic: Reporting claims
  stem: 'Put the words in order to say "He is said to have driven too fast." The capitalised word comes first.'
  items: [Er, soll, zu, schnell, gefahren, sein]
  explanation: |-
    sollen is in position 2, and the perfect infinitive "gefahren sein" goes to the end, participle first.
- id: de3-m4-r2-h20
  lesson: de3-m4-h-sources
  type: match
  topic: Reporting claims
  stem: 'Match each adverb to its meaning.'
  pairs:
    - ['tatsächlich', 'in fact (confirmed)']
    - ['offenbar', 'evidently (the evidence is clear)']
    - ['anscheinend', 'apparently (it seems so)']
    - ['vermutlich', 'presumably']
    - ['angeblich', 'allegedly']
    - ['scheinbar', 'seemingly (but not really)']
  distractors: [hopefully]
  explanation: |-
    From most to least certain: tatsächlich, offenbar, anscheinend, vermutlich, angeblich. scheinbar says something only looks true. "hopefully" is hoffentlich.
- id: de3-m4-r2-h21
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'In careful German, what does "Der Bus ist scheinbar pünktlich." say?'
  choices: ['The bus looks punctual, but it isn''t.', 'The bus is probably on time.', 'The bus is definitely on time.', 'The bus is said to be on time.']
  answer: 0
  explanation: |-
    scheinbar means "only seemingly". "Probably on time" would be anscheinend (many people use scheinbar this way in speech, but careful writing keeps them apart). "Definitely" would be tatsächlich, and "is said to be" would be soll … sein.
- id: de3-m4-r2-h22
  lesson: de3-m4-h-sources
  topic: Media
  stem: 'A report says: "Ein Sprecher sagte, die Lage sei ruhig." Why does it use "sei"?'
  choices: ['It is the past tense of sein.', 'It shows that the newspaper agrees.', 'It shows that someone''s words are being reported.', 'It is a mistake for "ist".']
  answer: 2
  explanation: |-
    sei is the Konjunktiv I of sein, the verb form of reported speech in written German. It passes on what the spokesman said without the paper confirming it. The past tense of sein is war.
- id: de3-m4-r2-h23
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'Which of these name a source of information? Select all that apply.'
  choices: ['laut Polizei', 'nach Angaben der Stadt', 'trotz des Regens', 'dem Bericht zufolge', 'Wie die Feuerwehr mitteilte, …']
  answer: [0, 1, 3, 4]
  explanation: |-
    laut, nach Angaben, zufolge and a wie-clause with a verb like mitteilen all say where information comes from. "trotz des Regens" means "despite the rain".
- id: de3-m4-r2-h24
  lesson: de3-m4-h-sources
  topic: Reporting claims
  stem: 'Which sentence is correct?'
  choices: ['Wie die Polizei mitteilte, niemand wurde verletzt.', 'Wie mitteilte die Polizei, wurde niemand verletzt.', 'Wie die Polizei mitteilte, wurde niemand verletzt.', 'Wie die Polizei mitteilte, verletzt wurde niemand.']
  answer: 2
  explanation: |-
    In the wie-clause the verb goes to the end (mitteilte). The whole clause is position 1 of the sentence, so the conjugated verb of the main clause comes right after the comma: "wurde niemand verletzt".
- id: de3-m4-r2-h25
  lesson: de3-m4-h-sources
  type: order
  topic: Media
  stem: 'Put the steps of the lesson''s method for checking a claim in order.'
  items: ['Ask who says it and look for an Impressum', 'Look for other, independent sources', 'Check the date and the photo', 'Decide whether to share it']
  explanation: |-
    First the source, then other sources, then the details (date, photo); only when everything checks out do you share it. If you're not sure, don't.
- id: de3-m4-r2-h26
  lesson: de3-m4-h-sources
  topic: Media
  stem: 'Read: "Nach Angaben der Stadt wurde der Beitrag über 1.200-mal geteilt. Er soll zuerst auf einer Webseite ohne Impressum erschienen sein." Which statement is right?'
  choices: ['The town confirms that the post first appeared on a site without an Impressum.', 'The newspaper itself counted how often the post was shared.', 'It is reported, but not confirmed, that the post first appeared on a site without an Impressum.', 'The town shared the post more than 1,200 times.']
  answer: 2
  explanation: |-
    "soll … erschienen sein" is hearsay: the newspaper passes it on without confirming it. The figure of 1,200 shares comes from the town (nach Angaben der Stadt), not from the newspaper, and the town didn't share the post; it was shared that often.
- id: de3-m4-r2-h27
  lesson: de3-m4-h-sources
  topic: Media
  stem: 'Where does the sentence "Eine Zensur findet nicht statt." come from?'
  choices: ['the press code of the German Press Council', 'a ruling of a German court', 'the rules of procedure of the Bundestag', 'Article 5 of the Basic Law']
  answer: 3
  explanation: |-
    It is part of Article 5 of the Basic Law, which protects freedom of expression and of the press. The Press Council's code contains rules for journalists, such as checking facts and correcting mistakes.
- id: de3-m4-r2-h28
  lesson: de3-m4-h-sources
  type: text
  topic: Media
  stem: '"seriös" means reputable, trustworthy. Which German adjective means "serious" in the sense of "not joking"? ___'
  accept: [ernst, ernsthaft]
  explanation: |-
    seriös is a false friend: eine seriöse Zeitung is a reputable newspaper. "Are you serious?" is "Meinst du das ernst?"
