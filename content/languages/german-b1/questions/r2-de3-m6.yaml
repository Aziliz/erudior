# Round 2, module de3-m6: new question types for the core lessons 26–30 (q) and questions for
# the honors lessons 30h1 and 30h2 (h).

# ---------- Lesson 26: The health system; reported speech ----------
- id: de3-m6-r2-q01
  lesson: de3-health-system
  module_quiz: true
  topic: Health system
  type: label
  stem: 'The five branches of the Sozialversicherung. Name each numbered pillar.'
  image: {src: images/de3-m6-pillars-blank.svg, alt: 'A roof labelled die Sozialversicherung resting on five numbered pillars. Under the pillars, from left to right: health, long-term care, pension, unemployment, accidents at work.'}
  labels:
    - {x: 11.8, y: 54.8, text: Krankenversicherung}
    - {x: 30.9, y: 54.8, text: Pflegeversicherung}
    - {x: 50.0, y: 54.8, text: Rentenversicherung}
    - {x: 69.1, y: 54.8, text: Arbeitslosenversicherung}
    - {x: 88.2, y: 54.8, text: Unfallversicherung}
  distractors: [Haftpflichtversicherung, Krankmeldung]
  explanation: |-
    Each name is "what it covers" + Versicherung: Kranken- (the sick: health), Pflege- (care), Renten- (pensions), Arbeitslosen- (the unemployed) and Unfall- (accidents at work). A Haftpflichtversicherung (liability insurance) is a private insurance, not part of the Sozialversicherung, and a Krankmeldung is telling your employer you're ill.

- id: de3-m6-r2-q02
  lesson: de3-health-system
  topic: Konjunktiv I
  type: text
  stem: 'A news report. Type the Konjunktiv I form of "sein": "Ein Sprecher der Klinik sagte, die Lage ___ ruhig."'
  accept: [sei]
  explanation: |-
    The Konjunktiv I of sein is irregular: er/sie/es sei. It marks the sentence as the spokesman's words: "the situation was calm, he said". The indicative would be ist; the Konjunktiv II wäre is also heard in reported speech, but it isn't the Konjunktiv I.

- id: de3-m6-r2-q03
  lesson: de3-health-system
  topic: Reported speech
  type: order
  stem: 'The receptionist asked: "Haben Sie eine Überweisung?" Complete the report: "Sie hat gefragt, …"'
  items: [ob, ich, eine Überweisung, habe]
  explanation: |-
    Sie hat gefragt, ob ich eine Überweisung habe. A yes/no question is reported with ob, and ob sends the verb to the end. Sie (you, formal) becomes ich, because you are now reporting about yourself.

- id: de3-m6-r2-q04
  lesson: de3-health-system
  module_quiz: true
  topic: Reported speech
  stem: 'Which of these reports are correct German? Select all that apply.'
  choices:
    - 'Sie sagt, sie kommt morgen.'
    - 'Sie sagt, dass sie kommt morgen.'
    - 'Er fragt, ob ich Zeit habe.'
    - 'Er fragt, wenn ich Zeit habe.'
    - 'Der Arzt hat gesagt, ich soll mehr trinken.'
  answer: [0, 2, 4]
  explanation: |-
    Without dass, a reported statement can keep main-clause order (sie kommt morgen); with dass, the verb must go to the end (dass sie morgen kommt). A yes/no question is reported with ob, not wenn. An instruction ("Trinken Sie mehr!") is reported with sollen.

- id: de3-m6-r2-q05
  lesson: de3-health-system
  topic: Health system
  type: match
  stem: 'Match each word to its meaning in the health system.'
  pairs:
    - [die Überweisung, a referral from your family doctor to a specialist]
    - [die Krankmeldung, telling your employer that you are ill]
    - [die Notaufnahme, the emergency department of a hospital]
    - [die Sprechstunde, the hours when a doctor sees patients]
  distractors: [a prescription for medicine]
  explanation: |-
    die Überweisung is a referral here (at the bank, the same word means a transfer). die Krankmeldung is the notification of sickness to your employer, die Notaufnahme is A&E, and die Sprechstunde is a practice's consulting hours. A prescription is das Rezept.

# ---------- Lesson 27: Living together; lassen ----------
- id: de3-m6-r2-q06
  lesson: de3-neighbourhood
  module_quiz: true
  topic: Neighbours
  type: label
  stem: 'Name the numbered parts of the building.'
  image: {src: images/de3-m6-building-blank.svg, alt: 'A block of flats with six numbered parts: 1 the stairwell in the middle of the building, 2 a small panel with three buttons beside the front door, 3 a box with three slots on the other side of the door, 4 a balcony on the first floor, 5 two bins beside a tree, and 6 the green area next to the building.'}
  labels:
    - {x: 41.5, y: 39.6, text: das Treppenhaus}
    - {x: 49.1, y: 76.5, text: die Klingel}
    - {x: 32.5, y: 76.7, text: der Briefkasten}
    - {x: 70.3, y: 61.7, text: der Balkon}
    - {x: 86.9, y: 80.4, text: die Mülltonne}
    - {x: 72.3, y: 88.3, text: der Hof}
  distractors: [der Keller, der Wasserhahn]
  explanation: |-
    The stairs run up the Treppenhaus (1). Beside the front door are the doorbells, die Klingel (2), and the letterboxes, der Briefkasten (3). der Balkon (4) sticks out from a flat on the first floor, and the bins, die Mülltonnen (5), stand in the courtyard, der Hof (6). The cellar (der Keller) isn't shown, and a tap (der Wasserhahn) is inside a flat.

- id: de3-m6-r2-q07
  lesson: de3-neighbourhood
  topic: lassen
  type: text
  stem: 'Complete with the right form of lassen: "Wann ___ du dir die Haare schneiden?"'
  accept: [lässt, laesst]
  explanation: |-
    lassen changes its vowel in the du and er forms: du lässt, er lässt. The stem already ends in s, so du adds only -t. (lasst is the ihr form.)

- id: de3-m6-r2-q08
  lesson: de3-neighbourhood
  topic: lassen
  type: order
  stem: 'Put the words in order: "When did you have the car repaired?"'
  items: [Wann, hast, du, das Auto, reparieren, lassen]
  explanation: |-
    Wann hast du das Auto reparieren lassen? The question word comes first and hast second. With another infinitive, the perfect of lassen uses the infinitive lassen, not gelassen, so two infinitives stand at the end: reparieren lassen.

- id: de3-m6-r2-q09
  lesson: de3-neighbourhood
  topic: lassen
  stem: 'In which sentences does lassen mean "to have something done (by someone else)"? Select all that apply.'
  choices:
    - 'Ich lasse mir die Haare schneiden.'
    - 'Lass mich in Ruhe!'
    - 'Wir lassen die Heizung prüfen.'
    - 'Meine Eltern lassen mich allein fahren.'
    - 'Das Fenster lässt sich nicht öffnen.'
  answer: [0, 2]
  explanation: |-
    A hairdresser cuts your hair and a tradesperson checks the heating: that's the causative "have something done". Lass mich in Ruhe means "leave me alone", lassen + a person + infinitive (mich allein fahren) means "let", and sich lassen means "can be done": the window won't open.

- id: de3-m6-r2-q10
  lesson: de3-neighbourhood
  topic: Renting
  type: match
  stem: 'Match each word to its meaning.'
  pairs:
    - [der Schimmel, mould on a wall]
    - [undicht, letting water or air through]
    - [die Mietminderung, paying less rent because of a defect]
    - [der Mieterverein, an association that advises tenants]
    - [die Hausverwaltung, the company that manages the building]
  distractors: [the person who cleans the stairwell]
  explanation: |-
    der Schimmel is mould, undicht means leaking, a Mietminderung is a rent reduction for a serious defect, the Mieterverein is the tenants' association, and the Hausverwaltung looks after the building for the owner.

# ---------- Lesson 28: Travel and regions; presentations ----------
- id: de3-m6-r2-q11
  lesson: de3-travel-regions
  topic: hin and her
  type: label
  stem: 'The speaker is upstairs. Which word describes each numbered movement from her point of view?'
  image: {src: images/de3-m6-hin-her-blank.svg, alt: 'A two-storey house. The speaker, marked ICH, is in a room upstairs. 1: a person climbs the stairs up to her floor. 2: a key falls from her window down to a friend in the garden. 3: a cat walks into her room. 4: a dog runs out of the front door downstairs.'}
  labels:
    - {x: 75.7, y: 60.9, text: herauf}
    - {x: 15.4, y: 57.0, text: hinunter}
    - {x: 52.1, y: 48.5, text: herein}
    - {x: 28.6, y: 80.9, text: hinaus}
  distractors: [hinauf, heraus]
  explanation: |-
    her- means towards the speaker, hin- away from her. The person on the stairs comes up to her (herauf), the key goes down away from her (hinunter), the cat comes into her room (herein), and the dog goes out, away from the house she's in (hinaus). hinauf would be up and away (said by someone downstairs), heraus out towards the speaker (said by someone outside).

- id: de3-m6-r2-q12
  lesson: de3-travel-regions
  module_quiz: true
  topic: hin and her
  type: text
  stem: 'You are in the cellar. Your friend is upstairs. Call to him, using the full standard form: "Komm bitte ___!" (come down here)'
  accept: [herunter]
  explanation: |-
    He should come down towards you, so the word is her- + unter: herunter. hinunter would mean down and away from you. In speech many people simply say runter.

- id: de3-m6-r2-q13
  lesson: de3-travel-regions
  module_quiz: true
  topic: Presentations
  type: order
  stem: 'Put the five parts of a short presentation in order.'
  items: [Einleitung, Eigene Erfahrung, Situation im Heimatland, Vor- und Nachteile mit Meinung, Schluss]
  explanation: |-
    Introduce the topic and your plan, tell your own experience, describe the situation in your home country, weigh pros and cons and give your opinion, and finish with a conclusion. This is the structure of part 2 of the Goethe B1 speaking test.

- id: de3-m6-r2-q14
  lesson: de3-travel-regions
  topic: Regions
  stem: 'Which statements are true? Select all that apply.'
  choices:
    - 'Austria is divided into nine Bundesländer.'
    - 'Germany is divided into 16 Kantone.'
    - 'Switzerland has 26 cantons.'
    - 'Germany''s highest mountain is over 3,000 metres high.'
    - 'The Alps reach into the far south of Germany.'
  answer: [0, 2, 4]
  explanation: |-
    Austria has nine Bundesländer and Switzerland 26 Kantone. Germany has 16 Bundesländer, not Kantone. The Zugspitze, Germany's highest mountain, is just under 3,000 metres. The Alps cover much of Austria and Switzerland and reach into the far south of Germany.

- id: de3-m6-r2-q15
  lesson: de3-travel-regions
  topic: Presentations
  type: match
  stem: 'Match each phrase to the part of a presentation where it belongs.'
  pairs:
    - ['In meiner Präsentation geht es um …', Introduction]
    - ['Ich habe selbst erlebt, dass …', Your own experience]
    - ['Bei uns in Brasilien ist es üblich, dass …', Your home country]
    - ['Einerseits …, andererseits …', Pros and cons]
    - ['Abschließend möchte ich sagen, …', Conclusion]
  explanation: |-
    Each part has typical phrases: "es geht um" introduces the topic, "selbst erlebt" signals personal experience, "bei uns in …" the home country, "einerseits … andererseits" weighs two sides, and "abschließend" starts the conclusion.

# ---------- Lesson 29: Writing ----------
- id: de3-m6-r2-q16
  lesson: de3-writing
  module_quiz: true
  topic: Letters
  type: label
  stem: 'Name the numbered parts of this formal letter.'
  image: {src: images/de3-m6-letter-blank.svg, alt: 'A formal letter. 1 is next to the sender''s name and address at the top left, 2 next to the address of a company below it, 3 before the place and date on the right, 4 after the bold subject line, 5 after Sehr geehrte Damen und Herren, and 6 after Mit freundlichen Grüßen.'}
  labels:
    - {x: 39.0, y: 12.4, text: Absender}
    - {x: 49.0, y: 27.0, text: Empfänger}
    - {x: 57.2, y: 37.1, text: Ort und Datum}
    - {x: 69.0, y: 43.5, text: Betreff}
    - {x: 62.0, y: 49.8, text: Anrede}
    - {x: 50.0, y: 81.1, text: Grußformel}
  distractors: [Fazit, Anhang]
  explanation: |-
    The sender (Absender) is at the top, the recipient (Empfänger) below, then place and date on the right and the subject line (Betreff, no full stop). The opening (Anrede) ends with a comma; the closing (Grußformel) has no punctuation. A Fazit is the conclusion of a forum post, and an Anhang is an attachment.

- id: de3-m6-r2-q17
  lesson: de3-writing
  topic: Letters
  type: text
  stem: 'Type the standard closing of a formal letter, without punctuation.'
  accept: ['Mit freundlichen Grüßen', 'Mit freundlichen Gruessen', 'Mit freundlichen Grüssen']
  explanation: |-
    Mit freundlichen Grüßen is the formal closing (in Switzerland: Grüssen). No comma or full stop follows it in German.

- id: de3-m6-r2-q18
  lesson: de3-writing
  topic: Punctuation
  type: order
  stem: 'Complete the sentence: "Ich schreibe Ihnen, …" (to ask about the course)'
  items: [um, mich, nach dem Kurs, zu erkundigen]
  explanation: |-
    Ich schreibe Ihnen, um mich nach dem Kurs zu erkundigen. um starts the group, the reflexive mich comes early, and zu + infinitive closes it. sich erkundigen nach = to ask about. A comma separates the um … zu group from the main clause.

- id: de3-m6-r2-q19
  lesson: de3-writing
  topic: Register
  stem: 'Which lines are correct in a formal letter to a company? Select all that apply.'
  choices:
    - 'Sehr geehrte Damen und Herren,'
    - 'Könnten sie mir bitte helfen?'
    - 'Ich schreibe Ihnen wegen meiner Bestellung.'
    - 'Mit freundlichen Grüßen,'
    - 'Könnten Sie mir bitte mitteilen, ob der Kurs stattfindet?'
  answer: [0, 2, 4]
  explanation: |-
    The polite Sie is always capitalized, so "Könnten sie" is wrong. The closing Mit freundlichen Grüßen has no comma. The opening with a comma, "Ich schreibe Ihnen wegen …" and the polite question with Könnten Sie are all correct.

- id: de3-m6-r2-q20
  lesson: de3-writing
  topic: Register
  type: match
  stem: 'Match each opening or closing to its register.'
  pairs:
    - ['Liebe Mia,', informal]
    - ['Sehr geehrte Damen und Herren,', formal]
    - ['Liebe Frau Kraus,', semi-formal]
    - [Liebe Grüße, informal]
    - [Mit freundlichen Grüßen, formal]
  explanation: |-
    Friends get Liebe Mia and Liebe Grüße. People you know but call Sie get Liebe Frau Kraus (closing: Viele Grüße). Companies and offices get Sehr geehrte … and Mit freundlichen Grüßen.

# ---------- Lesson 30: The exam and review ----------
- id: de3-m6-r2-q21
  lesson: de3-exam-review
  module_quiz: true
  topic: B1 exam
  type: match
  stem: 'Match each module of the adult Goethe-Zertifikat B1 to its length.'
  pairs:
    - [Lesen, 65 minutes]
    - [Hören, about 40 minutes]
    - [Schreiben, 60 minutes]
    - [Sprechen, about 15 minutes plus 15 minutes of preparation]
  distractors: [90 minutes]
  explanation: |-
    Reading takes 65 minutes, listening about 40, writing 60, and speaking about 15 minutes in pairs after 15 minutes of preparation. No module takes 90 minutes.

- id: de3-m6-r2-q22
  lesson: de3-exam-review
  topic: Exam strategies
  type: order
  stem: 'Put the stages of the B1 speaking module in order for one candidate.'
  items: [Preparing alone for 15 minutes, Planning something together with your partner, Presenting your topic, Answering questions about your presentation]
  explanation: |-
    After 15 minutes of preparation, part 1 is planning something together. In part 2 you present your topic, and in part 3 your partner reacts and you answer questions about your presentation. Then the roles change.

- id: de3-m6-r2-q23
  lesson: de3-exam-review
  topic: Exam strategies
  type: text
  stem: 'You passed. Complete: "Ich habe die Prüfung ___!"'
  accept: [bestanden]
  explanation: |-
    die Prüfung bestehen = to pass the exam; the participle is bestanden. "Ich habe die Prüfung gemacht" only says that you took it.

- id: de3-m6-r2-q24
  lesson: de3-exam-review
  topic: B1 exam
  stem: 'Which statements about the adult Goethe-Zertifikat B1 are true? Select all that apply.'
  choices:
    - 'Each module is scored out of 100 points.'
    - 'You must take all four modules on the same day.'
    - 'A module is passed with 60 points.'
    - 'The speaking test is done alone, without a partner.'
    - 'You can repeat only the module you failed.'
  answer: [0, 2, 4]
  explanation: |-
    The exam is modular: each module has 100 points and is passed with 60, and you can take modules separately and repeat only the one you failed. You can take all four on one day, but you don't have to. Speaking is done in pairs.

- id: de3-m6-r2-q25
  lesson: de3-exam-review
  topic: Exam strategies
  type: match
  stem: 'Match each word from exam instructions to its meaning.'
  pairs:
    - [zuordnen, to match one thing to another]
    - [zutreffen, to apply or be true for something]
    - [die Aussage, a statement]
    - [die Gliederung, an outline or structure]
  distractors: [a mark or grade]
  explanation: |-
    "Ordnen Sie zu" asks you to match, "Trifft das zu?" asks whether something applies, an Aussage is a statement (for example in a true/false task), and a Gliederung is the outline you plan before writing. A grade is die Note.

# ---------- Honors 30h1: Reported speech in full ----------
- id: de3-m6-r2-h01
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  stem: 'Why do news reports often write "Der Bürgermeister sagte, die Brücke sei sicher" instead of "… die Brücke ist sicher"?'
  choices:
    - 'sei is more polite towards the mayor'
    - 'sei is the past tense of ist'
    - 'sei shows that this is the mayor''s statement, not the newspaper''s'
    - 'sei is required after every verb of saying'
  answer: 2
  explanation: |-
    The Konjunktiv I marks the statement as reported: the paper passes it on without vouching for it. It isn't a past tense or a politeness form, and it isn't required: the indicative is also correct after a verb of saying, just less distanced.

- id: de3-m6-r2-h02
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  type: text
  stem: 'Type the Konjunktiv I form of "haben": "Die Ministerin erklärte, sie ___ das Problem erst gestern erkannt."'
  accept: [habe]
  explanation: |-
    The original was "Ich habe das Problem erst gestern erkannt." Every past becomes habe/sei + participle, and the third person singular of haben in the Konjunktiv I is habe (indicative: hat).

- id: de3-m6-r2-h03
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  stem: 'The tenants said: "Wir haben kein warmes Wasser." Which report follows the replacement rule?'
  choices:
    - 'Die Mieter sagten, sie hätten kein warmes Wasser.'
    - 'Die Mieter sagten, sie haben kein warmes Wasser.'
    - 'Die Mieter sagten, sie habe kein warmes Wasser.'
    - 'Die Mieter sagten, sie hatten kein warmes Wasser.'
  answer: 0
  explanation: |-
    The Konjunktiv I sie haben looks exactly like the indicative, so it is replaced by the Konjunktiv II: sie hätten. sie habe is singular, and sie hatten is the Präteritum ("they had", in the past).

- id: de3-m6-r2-h04
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  stem: 'The workers said: "Wir arbeiten zu viel." Why does the newspaper write "sie würden zu viel arbeiten"?'
  choices:
    - 'because the workers were only imagining it'
    - 'because both sie arbeiten and sie arbeiteten look like indicative forms'
    - 'because arbeiten has no Konjunktiv I at all'
    - 'because würde is always used for the plural'
  answer: 1
  explanation: |-
    The Konjunktiv I sie arbeiten looks like the present indicative, and the Konjunktiv II sie arbeiteten looks like the Präteritum. So the last step of the replacement rule applies: würde + infinitive. Here würde doesn't mean "would"; it just marks reported speech.

- id: de3-m6-r2-h05
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  type: match
  stem: 'Match each direct statement by Herr Ott to its report in news style.'
  pairs:
    - ['„Ich komme morgen."', er komme morgen]
    - ['„Ich bin gestern gekommen."', er sei gestern gekommen]
    - ['„Ich werde nächste Woche kommen."', er werde nächste Woche kommen]
    - ['„Ich kam leider zu spät."', er sei leider zu spät gekommen]
  distractors: [er käme morgen]
  explanation: |-
    The present stays present (er komme), the future uses werde (er werde kommen), and every past tense, Perfekt or Präteritum, becomes sei/habe + participle (er sei gekommen). er käme is a Konjunktiv II, only needed when the Konjunktiv I looks like the indicative, which er komme doesn't.

- id: de3-m6-r2-h06
  lesson: de3-m6-h-reported-news
  topic: Reported speech
  type: order
  stem: 'A reporter asked: "Wird die Brücke gesperrt?" Complete the report: "Die Reporterin fragte, …"'
  items: [ob, die Brücke, gesperrt, werde]
  explanation: |-
    Die Reporterin fragte, ob die Brücke gesperrt werde. A yes/no question is reported with ob; the verb goes to the end, and werde is the Konjunktiv I of werden (indicative: wird).

- id: de3-m6-r2-h07
  lesson: de3-m6-h-reported-news
  topic: Reported speech
  stem: 'Which of these verbs suggest that the reporter has doubts about the statement or that it was unpleasant for the speaker? Select all that apply.'
  choices: [behaupten, sagen, einräumen, mitteilen, erklären]
  answer: [0, 2]
  explanation: |-
    behaupten (to claim) keeps a distance: maybe it isn't true. einräumen (to admit) tells you the speaker had to concede something unpleasant. sagen, mitteilen and erklären are neutral.

- id: de3-m6-r2-h08
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  stem: 'In a news article: "Viele Ärzte hätten zu wenig Zeit für ihre Patienten, sagte die Sprecherin." What does "hätten" mean here?'
  choices:
    - 'would have, if things were different'
    - 'had, a long time ago'
    - 'should have'
    - 'have, according to the spokeswoman'
  answer: 3
  explanation: |-
    In reported speech, hätten often just replaces haben, whose Konjunktiv I would look like the indicative. The spokeswoman said "Viele Ärzte haben zu wenig Zeit". It isn't unreal and it isn't past.

- id: de3-m6-r2-h09
  lesson: de3-m6-h-reported-news
  topic: Reported speech
  stem: 'Read: "Der Verband kritisierte die Regeln. Sie seien zu kompliziert. Die Regeln treten am 1. Juli in Kraft." Which information comes from the newspaper itself, not from the association?'
  choices:
    - 'that the rules are too complicated'
    - 'that the rules come into force on 1 July'
    - 'both statements'
    - 'neither statement'
  answer: 1
  explanation: |-
    "Sie seien zu kompliziert" is in the Konjunktiv I, so it's still the association's view, even without a new "sagte". "Die Regeln treten … in Kraft" is indicative: the newspaper's own information.

- id: de3-m6-r2-h10
  lesson: de3-m6-h-reported-news
  topic: Reported speech
  stem: 'You read: "Der Minister erklärte, die Renten seien sicher." How do you pass this on naturally to a friend?'
  choices:
    - 'Der Minister hat gesagt, dass die Renten sicher sind.'
    - 'Der Minister hat gesagt, dass die Renten sicher seien sind.'
    - 'Der Minister hat gesagt, die Renten sicher sind.'
    - 'Der Minister sagt, dass sind die Renten sicher.'
  answer: 0
  explanation: |-
    In conversation, use the perfect for the speech verb and dass + indicative with the verb at the end. Without dass you'd need main-clause order (die Renten sind sicher), and after dass the verb can't come second.

- id: de3-m6-r2-h11
  lesson: de3-m6-h-reported-news
  topic: Reading the news
  type: label
  stem: 'Find the reporting signals in this article. Name each numbered part.'
  image: {src: images/de3-m6-news-blank.svg, alt: 'A short news article headed Brücke bleibt gesperrt, with five parts in dashed boxes, each followed by a number. 1 follows the words „Wir arbeiten so, the start of a quotation. 2 follows the word sei. 3 follows the word erklärte. 4 follows Einem Gutachten zufolge. 5 follows the word angeblich.'}
  labels:
    - {x: 70.9, y: 50.5, text: Direct quotation}
    - {x: 66.6, y: 34.1, text: Konjunktiv I verb}
    - {x: 70.5, y: 42.3, text: Reporting verb}
    - {x: 49.5, y: 67.0, text: Source named with zufolge}
    - {x: 65.9, y: 83.4, text: Distancing adverb}
  distractors: [Konjunktiv II verb, Passive verb]
  explanation: |-
    The words in German quotation marks („ … “) are direct speech (1). sei is the Konjunktiv I of sein (2), introduced by the reporting verb erklärte (3). "Einem Gutachten zufolge" names the source, with zufolge after a dative noun (4), and angeblich (supposedly) keeps a distance (5). There's no Konjunktiv II and no werden-passive in the article.

- id: de3-m6-r2-h12
  lesson: de3-m6-h-reported-news
  topic: Reading the news
  stem: 'Read: "Baubürgermeister Wendt räumte Fehler ein. Die Stadt hätte die Bürger früher informieren müssen." What does Wendt say?'
  choices:
    - 'The citizens should have informed the city earlier.'
    - 'The city informed the citizens early enough.'
    - 'The city should have informed the citizens earlier.'
    - 'The city will inform the citizens next week.'
  answer: 2
  explanation: |-
    hätte … informieren müssen is the past Konjunktiv II of a modal: "should have informed", a regret. die Stadt is the subject, die Bürger the object. einräumen (admit) fits: he concedes a mistake.

- id: de3-m6-r2-h13
  lesson: de3-m6-h-reported-news
  topic: Konjunktiv I
  stem: 'Which verb form is a Konjunktiv I?'
  choices: [er gibt, er gäbe, er gab, er gebe]
  answer: 3
  explanation: |-
    The Konjunktiv I uses the infinitive stem (geb-) + -e: er gebe. Stem-changing verbs keep the infinitive vowel, which helps you spot it. er gibt is the present indicative, er gab the Präteritum, er gäbe the Konjunktiv II.

- id: de3-m6-r2-h14
  lesson: de3-m6-h-reported-news
  topic: Reported speech
  type: text
  stem: 'The police told a resident: "Bleiben Sie im Haus!" Type the Konjunktiv I of sollen: "Die Polizei sagte der Anwohnerin, sie ___ im Haus bleiben."'
  accept: [solle]
  explanation: |-
    Instructions are reported with sollen. The Konjunktiv I of sollen in the third person singular is solle (indicative: soll). For a plural subject you'd read sollten, because sie sollen looks like the indicative.

# ---------- Honors 30h2: Letters from offices and landlords ----------
- id: de3-m6-r2-h15
  lesson: de3-m6-h-official-letters
  topic: Official letters
  type: label
  stem: 'Name the numbered parts of this official decision.'
  image: {src: images/de3-m6-bescheid-blank.svg, alt: 'An official letter from the road traffic office of Musterstadt to Elif Kaya, with the section headings removed. 1 is next to the code BP-2027-0418 at the top right. 2 is next to the bold line Ihr Antrag auf einen Bewohnerparkausweis. 3 is next to Ihr Antrag wird abgelehnt. 4 is next to a paragraph explaining that the car is not registered to her and a confirmation was missing. 5 is next to a paragraph saying that a Widerspruch can be lodged within one month.'}
  labels:
    - {x: 69.2, y: 14.9, text: Aktenzeichen}
    - {x: 71.2, y: 29.0, text: Betreff}
    - {x: 46.2, y: 43.9, text: Entscheidung}
    - {x: 76.9, y: 52.8, text: Begründung}
    - {x: 78.8, y: 68.1, text: Rechtsbehelfsbelehrung}
  distractors: [Grußformel, Nebenkostenabrechnung]
  explanation: |-
    The file number (Aktenzeichen, 1) is the code to quote in every reply. The bold line is the subject (Betreff, 2), "Ihr Antrag wird abgelehnt" is the decision (3), the paragraph about the missing confirmation gives the reasons (Begründung, 4), and the paragraph about Widerspruch within a month is the Rechtsbehelfsbelehrung (5). The Grußformel, Mit freundlichen Grüßen, is further down and isn't numbered.

- id: de3-m6-r2-h16
  lesson: de3-m6-h-official-letters
  topic: Official letters
  type: match
  stem: 'Match each light verb construction to the simple verb with the same meaning.'
  pairs:
    - [einen Antrag stellen, beantragen]
    - [Widerspruch einlegen, widersprechen]
    - [eine Entscheidung treffen, entscheiden]
    - [in Kraft treten, gültig werden]
    - [in Anspruch nehmen, nutzen]
  distractors: [unterschreiben]
  explanation: |-
    In a light verb construction the noun carries the meaning: Antrag → beantragen, Widerspruch → widersprechen, Entscheidung → entscheiden. in Kraft treten means to become valid, and in Anspruch nehmen to make use of something. unterschreiben (to sign) matches none of them.

- id: de3-m6-r2-h17
  lesson: de3-m6-h-official-letters
  topic: Official letters
  type: match
  stem: 'Match each abbreviation to its full form.'
  pairs:
    - [z. Hd., zu Händen]
    - [i. V., in Vertretung]
    - [o. g., oben genannt]
    - [gem., gemäß]
    - [Abs., Absatz]
  distractors: [beziehungsweise]
  explanation: |-
    z. Hd. means "for the attention of", i. V. "standing in for" the person in charge, o. g. "above-mentioned", gem. "in accordance with" and Abs. a paragraph or subsection of a law (§ 556 Abs. 3). beziehungsweise is abbreviated bzw.

- id: de3-m6-r2-h18
  lesson: de3-m6-h-official-letters
  topic: Renting
  type: text
  stem: 'You paid a Vorauszahlung of 150 Euro a month for 12 months. Your share of the real costs is 1,920 Euro. How much is the Nachzahlung? Give only the number of euros.'
  accept: ['120', '120 Euro', '120 €']
  explanation: |-
    Advance payments: 12 × 150 = 1,800 Euro. The real costs are higher: 1,920 − 1,800 = 120 Euro, which you have to pay (Nachzahlung).

- id: de3-m6-r2-h19
  lesson: de3-m6-h-official-letters
  topic: Renting
  type: text
  stem: 'Your advance payments were higher than the real costs, so you get money back. What is this credit called? Type the noun without the article.'
  accept: [Guthaben]
  explanation: |-
    das Guthaben is the credit you get back (or that is set against the next rent). If the costs were higher than your payments, you'd owe a Nachzahlung.

- id: de3-m6-r2-h20
  lesson: de3-m6-h-official-letters
  topic: Renting
  type: order
  stem: 'Put the steps of the service-charge system in order.'
  items: [You pay a Vorauszahlung every month, The billing period ends, The landlord sends the Nebenkostenabrechnung, You pay the Nachzahlung or receive the Guthaben]
  explanation: |-
    You pay advance payments through the year. When the billing period ends, the landlord adds up the real costs and sends the bill (within twelve months). Only then is the difference settled: a Nachzahlung or a Guthaben.

- id: de3-m6-r2-h21
  lesson: de3-m6-h-official-letters
  topic: Official letters
  stem: 'Which of these are light verb constructions (Funktionsverbgefüge)? Select all that apply.'
  choices: [einen Antrag stellen, den Antrag ausfüllen, zur Kenntnis nehmen, in die Stadt fahren, zur Verfügung stellen]
  answer: [0, 2, 4]
  explanation: |-
    In einen Antrag stellen, zur Kenntnis nehmen and zur Verfügung stellen, the verbs stellen and nehmen have lost their own meaning: the nouns carry it (beantragen, bemerken, bereitstellen). In den Antrag ausfüllen and in die Stadt fahren, the verbs keep their full meaning: you really fill in and really travel.

- id: de3-m6-r2-h22
  lesson: de3-m6-h-official-letters
  topic: Nominal style
  stem: 'What does "Im Falle einer Ablehnung erhalten Sie die Unterlagen zurück." mean?'
  choices:
    - 'You must send the documents back if you refuse.'
    - 'If your application is rejected, you get your documents back.'
    - 'The documents are rejected if they arrive late.'
    - 'You will receive the documents after the decision in any case.'
  answer: 1
  explanation: |-
    im Falle + genitive = in the case of; die Ablehnung comes from ablehnen (to reject). In plain German: Wenn wir Ihren Antrag ablehnen, schicken wir Ihnen die Unterlagen zurück. The office does the rejecting, and you are the one who gets the documents.

- id: de3-m6-r2-h23
  lesson: de3-m6-h-official-letters
  topic: Official letters
  stem: 'A letter says: "Der Betrag ist bis zum 15.07. zu überweisen." What does it mean?'
  choices:
    - 'You can transfer the amount if you want to.'
    - 'The amount has already been transferred.'
    - 'You must transfer the amount by 15 July.'
    - 'The amount will be transferred to you by 15 July.'
  answer: 2
  explanation: |-
    sein + zu + infinitive in an instruction means "must be done": Sie müssen den Betrag bis zum 15. Juli überweisen. It's an order, not a possibility, and you are the one who pays.

- id: de3-m6-r2-h24
  lesson: de3-m6-h-official-letters
  topic: Official letters
  stem: 'The Rechtsbehelfsbelehrung says: "Gegen diesen Bescheid kann innerhalb eines Monats nach Bekanntgabe Widerspruch erhoben werden." What does it tell you?'
  choices:
    - 'You can object to the decision within a month of being notified.'
    - 'The decision will be announced publicly in a month.'
    - 'You must pay within a month, or the office will object.'
    - 'You can apply again after a month.'
  answer: 0
  explanation: |-
    Widerspruch erheben (or einlegen) = to lodge an objection; innerhalb eines Monats nach Bekanntgabe = within one month of notification. Bekanntgabe is when the letter counts as delivered, a few days after posting, so act well within a month of the date on the letter.

- id: de3-m6-r2-h25
  lesson: de3-m6-h-official-letters
  topic: Official letters
  stem: 'Why did the office reject Elif Kaya''s application for a residents'' parking permit?'
  choices:
    - 'She doesn''t live in the parking zone.'
    - 'She applied after the deadline.'
    - 'She didn''t pay the fee.'
    - 'The car isn''t registered to her, and the keeper''s confirmation was missing.'
  answer: 3
  explanation: |-
    The Begründung says: "Das Fahrzeug ist nicht auf Sie zugelassen. Eine Bestätigung der Halterin, dass Sie das Fahrzeug dauerhaft nutzen, lag Ihrem Antrag nicht bei." The car belongs to her sister, and the confirmation was not enclosed.

- id: de3-m6-r2-h26
  lesson: de3-m6-h-official-letters
  topic: Official letters
  stem: 'Which is the best first line for Elif''s objection?'
  choices:
    - 'Hiermit lege ich Widerspruch gegen Ihren Bescheid vom 03.05.2027 ein.'
    - 'Hiermit widerspreche ich Sie wegen dem Parkausweis.'
    - 'Ich finde Ihre Entscheidung nicht so gut, liebe Grüße.'
    - 'Hiermit lege ich gegen Ihren Bescheid Widerspruch.'
  answer: 0
  explanation: |-
    Widerspruch einlegen is separable: lege … ein. The line names the decision by its date, as offices expect. widersprechen takes the dative (Ihnen), not Sie; the third choice is far too informal; and the last one is missing the prefix ein.

- id: de3-m6-r2-h27
  lesson: de3-m6-h-official-letters
  topic: Renting
  stem: 'Read: "Ihre Vorauszahlungen betrugen 12 × 210,00 € = 2.520,00 €. Ihr Anteil an den Kosten beträgt 2.687,40 €." What is the result?'
  choices:
    - 'a Guthaben of 167,40 €'
    - 'a Nachzahlung of 167,40 €'
    - 'a Nachzahlung of 2.687,40 €'
    - 'a Guthaben of 2.520,00 €'
  answer: 1
  explanation: |-
    The real costs (2.687,40 €) are higher than the advance payments (2.520,00 €), so the tenant owes the difference: 2.687,40 € − 2.520,00 € = 167,40 €, a Nachzahlung.

- id: de3-m6-r2-h28
  lesson: de3-m6-h-official-letters
  topic: Renting
  stem: 'In Germany, the service-charge bill for the year 2026 arrives in February 2028. What is usually true?'
  choices:
    - 'The tenant must pay any Nachzahlung within 30 days.'
    - 'The tenant gets back all the advance payments.'
    - 'The landlord can usually no longer demand a Nachzahlung.'
    - 'The tenant has to ask the Mieterverein before paying.'
  answer: 2
  explanation: |-
    The landlord has twelve months after the end of the billing period (here, until 31 December 2027) to send the bill. If it comes later, a Nachzahlung usually can't be demanded. The advance payments themselves aren't refunded, and asking the Mieterverein is a good idea but not a duty.
