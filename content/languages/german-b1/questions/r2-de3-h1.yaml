# Round 2, honors module de3-h1: questions for lessons 90–93.
- id: de3-h1-r2-h01
  lesson: de3-h-kurzgeschichte
  module_quiz: true
  topic: Short stories
  stem: Which of these is a typical feature of a German Kurzgeschichte?
  choices:
  - A long introduction that presents all the characters
  - An open ending
  - A happy ending that answers every question
  - A story that covers many years
  answer: 1
  explanation: 'Kurzgeschichten typically stop without telling us how things end: an open ending (offener Schluss). They start without an introduction, cover a short time (minutes or hours) and rarely tie everything up the way a fairy tale does.'
- id: de3-h1-r2-h02
  lesson: de3-h-kurzgeschichte
  module_quiz: true
  topic: Short stories
  stem: Which features of a Kurzgeschichte does "Der Zettel" show? Select all that apply.
  choices:
  - It starts without an introduction.
  - It takes place in one evening.
  - A narrator explains the father's illness.
  - It ends without telling us what happens next.
  - It has many characters from several generations.
  answer:
  - 0
  - 1
  - 3
  explanation: 'The story begins with "Als Jana aus dem Bus stieg" as if we already knew Jana (sudden start), covers one evening and ends open. The illness is never named: that is a gap the reader fills in. There are only two characters.'
- id: de3-h1-r2-h03
  lesson: de3-h-kurzgeschichte
  topic: Writing a summary
  type: text
  stem: 'Complete the summary in the present tense: "Jana ___ ihren Vater jeden Dienstag." (besuchen)'
  accept:
  - besucht
  explanation: 'An Inhaltsangabe is written in the present tense, even though the story is in the past: Jana besucht ihren Vater. (besuchte would be the simple past of the story itself.)'
- id: de3-h1-r2-h04
  lesson: de3-h-kurzgeschichte
  module_quiz: true
  topic: Writing a summary
  stem: Which sentence belongs in an Inhaltsangabe of "Der Zettel"?
  choices:
  - Jana besuchte ihren Vater jeden Dienstag.
  - 'Er sagt: „Du kommst zu spät.“'
  - Jana besucht ihren Vater jeden Dienstag.
  - Ich finde die Geschichte sehr traurig.
  answer: 2
  explanation: An Inhaltsangabe is in the present tense, has no direct speech and no opinion. The first choice is in the past, the second quotes direct speech, and the last gives an opinion.
- id: de3-h1-r2-h05
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  type: order
  stem: Put the events of "Der Zettel" in the order they happen.
  items:
  - Jana steigt aus dem Bus.
  - Der Vater öffnet die Tür.
  - Jana findet drei Flaschen Milch im Kühlschrank.
  - Jana liest den Zettel.
  - Jana verspricht, schon am Montag zu kommen.
  explanation: Jana gets off the bus, her father opens the door, she finds the milk while putting away the shopping, then she reads the note, and at the end she promises to come on Monday.
- id: de3-h1-r2-h06
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  stem: What is the turning point (der Wendepunkt) of "Der Zettel"?
  choices:
  - Jana reads the note on the kitchen table.
  - Jana gets off the bus in the rain.
  - The father talks about a football match.
  - It gets dark outside.
  answer: 0
  explanation: Before the note, Jana notices small strange things (the milk, the TV that is off). The note shows her what they mean, and right afterwards she hides it and decides to come more often. The bus and the darkness frame the story; the football match shows that his old memories are still clear.
- id: de3-h1-r2-h07
  lesson: de3-h-kurzgeschichte
  module_quiz: true
  topic: Short stories
  type: match
  stem: Match each feature of a Kurzgeschichte to its meaning.
  pairs:
  - - unvermittelter Anfang
    - Starts without an introduction
  - - offener Schluss
    - Ends without telling how things turn out
  - - Wendepunkt
    - The moment that changes the situation
  - - Leerstelle
    - Something important the text leaves unsaid
  distractors:
  - A long description of the setting
  explanation: An unvermittelter Anfang drops us into the action, an offener Schluss leaves the outcome open, the Wendepunkt changes the situation, and a Leerstelle is something important the text leaves unsaid. A long description of the setting is not typical of the form.
- id: de3-h1-r2-h08
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  stem: '"Als ich aus dem Bus stieg, regnete es." What kind of narrator tells this sentence?'
  choices:
  - A third-person narrator
  - The author speaking about herself
  - A first-person narrator
  - A fairy-tale narrator
  answer: 2
  explanation: 'The narrator says ich and is part of the story: a first-person narrator (Ich-Erzähler). That doesn''t make it the author; the narrator is a voice inside the text.'
- id: de3-h1-r2-h09
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  stem: Which statement about narrator and author is correct?
  choices:
  - The narrator is always the author.
  - A first-person narrator is always the author.
  - Only novels have narrators.
  - The narrator is the voice in the text; the author is the real person who wrote it.
  answer: 3
  explanation: Der Erzähler is the voice that tells the story, der Autor the real person who wrote it. Even an ich in a story is a narrator, not necessarily the author, and every story, long or short, has a narrator.
- id: de3-h1-r2-h10
  lesson: de3-h-kurzgeschichte
  topic: Writing a summary
  type: text
  stem: 'Rewrite in the present tense for a summary: "Sie faltete den Zettel zusammen." → "Sie ___ den Zettel ___."'
  accept:
  - - faltet
  - - zusammen
  explanation: 'zusammenfalten is separable: in the present, faltet goes to position 2 and zusammen to the end: Sie faltet den Zettel zusammen.'
- id: de3-h1-r2-h11
  lesson: de3-h-kurzgeschichte
  module_quiz: true
  topic: Writing a summary
  stem: Which is the best introduction sentence for an Inhaltsangabe?
  choices:
  - In der Kurzgeschichte „Der Zettel“ geht es um eine junge Frau, die merkt, dass ihr Vater immer vergesslicher wird.
  - Die Geschichte „Der Zettel“ ist sehr schön und spannend.
  - In der Geschichte geht es um Milch und einen Zettel.
  - Jana stieg aus dem Bus, und es regnete.
  answer: 0
  explanation: The introduction names title, text type and the theme, what the story is really about. The second choice is an opinion, the third names objects instead of the theme, and the fourth retells the first sentence in the past.
- id: de3-h1-r2-h12
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  stem: What is "Trümmerliteratur" (rubble literature)?
  choices:
  - Fairy tales collected by the Brothers Grimm
  - Novels about building houses
  - Poems written before 1900
  - Literature written soon after 1945 about the war, hunger and ruins
  answer: 3
  explanation: die Trümmer are the ruins of bombed cities. Writers such as Wolfgang Borchert and Heinrich Böll wrote about the war and its aftermath in plain language, and the German Kurzgeschichte grew out of this.
- id: de3-h1-r2-h13
  lesson: de3-h-kurzgeschichte
  topic: Short stories
  type: label
  stem: Name the numbered parts of the short-story tension curve.
  image:
    src: images/de3-h1-tension-blank.svg
    alt: 'A tension curve over time with four numbered points on the short-story line: its start halfway up, the rising middle, the peak and the dotted end with a question mark. A grey dashed fairy-tale curve is shown for comparison.'
  labels:
  - x: 17.2
    y: 54.8
    text: unvermittelter Anfang
  - x: 39.1
    y: 39.3
    text: Hauptteil
  - x: 59.4
    y: 21.4
    text: Wendepunkt
  - x: 84.4
    y: 38.1
    text: offener Schluss
  distractors:
  - Happy End
  - Einleitung
  explanation: 'The short story starts already halfway up (unvermittelter Anfang), rises through the Hauptteil to the Wendepunkt and stops in the air: offener Schluss. A Happy End belongs to the fairy-tale curve, and an Einleitung is exactly what a Kurzgeschichte leaves out.'
- id: de3-h1-r2-h14
  lesson: de3-h-kurzgeschichte
  topic: Writing a summary
  stem: How should „Hast du gegessen?“, fragte sie. appear in an Inhaltsangabe?
  choices:
  - 'Sie fragt: „Hast du gegessen?“'
  - Sie fragt ihn, ob er schon gegessen hat.
  - Sie fragte ihn, ob er gegessen hatte.
  - 'Sie hat gefragt: „Hast du gegessen?“'
  answer: 1
  explanation: 'No direct speech and the present tense: a yes/no question becomes an ob clause with the verb at the end. The third choice uses ob but is in the past; the others keep the quotation.'
- id: de3-h1-r2-h15
  lesson: de3-h-gedichte
  module_quiz: true
  topic: Poems
  stem: 'Im Garten blüht der erste Baum, / der Winter war ein langer Traum. / Die Kinder rennen aus dem Haus, / der Frühling ruft: „Kommt alle raus!“ What is the rhyme scheme?'
  choices:
  - Kreuzreim (abab)
  - Paarreim (aabb)
  - umarmender Reim (abba)
  - No rhyme
  answer: 1
  explanation: 'Baum rhymes with Traum (a, a) and Haus with raus (b, b): the lines rhyme in pairs, aabb, a Paarreim.'
- id: de3-h1-r2-h16
  lesson: de3-h-gedichte
  module_quiz: true
  topic: Poems
  type: text
  stem: What is the rhyme scheme of the first stanza of Mondnacht (lines ending Himmel, geküsst, Blütenschimmer, müsst')? Type four letters, for example aabb.
  accept:
  - abab
  - a-b-a-b
  - a b a b
  explanation: 'Himmel is a, geküsst is b, Blütenschimmer rhymes (impurely) with Himmel (a), müsst'' rhymes with geküsst (b): abab, a Kreuzreim.'
- id: de3-h1-r2-h17
  lesson: de3-h-gedichte
  module_quiz: true
  topic: Poems
  type: label
  stem: Name the three rhyme schemes.
  image:
    src: images/de3-h1-rhymes-blank.svg
    alt: 'Three columns of four lines with rhyme letters: a a b b, a b a b and a b b a, each with a number above it.'
  labels:
  - x: 19.1
    y: 12.1
    text: Paarreim
  - x: 51.1
    y: 12.1
    text: Kreuzreim
  - x: 83.1
    y: 12.1
    text: umarmender Reim
  distractors:
  - Strophe
  - Zeilensprung
  explanation: aabb is the Paarreim (pairs), abab the Kreuzreim (the rhymes cross), abba the umarmende Reim (one pair embraces the other). A Strophe is a stanza and a Zeilensprung is enjambment; neither is a rhyme scheme.
- id: de3-h1-r2-h18
  lesson: de3-h-gedichte
  topic: Old and poetic German
  type: match
  stem: Match each old or poetic form from Mondnacht to its everyday German.
  pairs:
  - - hätt'
    - hätte
  - - leis
    - leise
  - - die Lande
    - die Länder
  - - nach Haus
    - nach Hause
  - - flöge
    - würde fliegen
  distractors:
  - fliegt
  explanation: hätt' and leis have lost their final -e, die Lande is an old plural of Land (today die Länder), nach Haus has lost the -e of nach Hause, and flöge is the Konjunktiv II of fliegen, which everyday German replaces with würde fliegen.
- id: de3-h1-r2-h19
  lesson: de3-h-gedichte
  module_quiz: true
  topic: Poems
  stem: In German, "der Vers" means …
  choices:
  - a stanza
  - a whole poem
  - one line of a poem
  - a rhyme
  answer: 2
  explanation: German Vers is one line (also called Zeile). A stanza is die Strophe, which is also the word for a song's verse.
- id: de3-h1-r2-h20
  lesson: de3-h-gedichte
  topic: Old and poetic German
  stem: Which of these are old or poetic forms that you should not use in an everyday e-mail? Select all that apply.
  choices:
  - hätt'
  - die Lande
  - zu Hause
  - flöge
  - bald
  answer:
  - 0
  - 1
  - 3
  explanation: hätt' (today hätte), die Lande (today die Länder) and flöge (today usually würde fliegen) sound about 200 years old. zu Hause keeps an old dative -e but is completely normal today, and bald is an ordinary word.
- id: de3-h1-r2-h21
  lesson: de3-h-gedichte
  topic: Old and poetic German
  type: order
  stem: Rewrite Heine's line "Ich weiß nicht, was soll es bedeuten" in everyday word order, with the verb at the end of the was clause.
  items:
  - Ich weiß nicht,
  - was
  - es
  - bedeuten
  - soll
  explanation: 'An indirect question with was sends the conjugated verb to the end: Ich weiß nicht, was es bedeuten soll. Heine keeps main-clause order for the rhythm.'
- id: de3-h1-r2-h22
  lesson: de3-h-gedichte
  topic: Poems
  stem: What is enjambment (der Zeilensprung)?
  choices:
  - A sentence that runs on from one line into the next
  - Two lines that rhyme
  - A line with an old dative -e
  - Dropping a final -e
  answer: 0
  explanation: 'In Und meine Seele spannte / Weit ihre Flügel aus, the sentence doesn''t stop at the end of the line: that is enjambment. Dropping a final -e is elision.'
- id: de3-h1-r2-h23
  lesson: de3-h-gedichte
  topic: Poems
  stem: In Mondnacht, the earth (die Erde) dreams "von ihm". Who or what is "ihm"?
  choices:
  - die Nacht
  - der Himmel
  - die Seele
  - der Wald
  answer: 1
  explanation: ihm is masculine (or neuter) dative, and the poem has just said that der Himmel kissed die Erde. So she, the earth, dreams of him, the sky. Nacht and Seele are feminine, and der Wald is not in the first stanza.
- id: de3-h1-r2-h24
  lesson: de3-h-gedichte
  topic: Poems
  stem: Heine calls the Loreley story "ein Märchen aus alten Zeiten". What is surprising about that?
  choices:
  - Heine invented it himself in 1824.
  - It comes from ancient Greece.
  - The Brothers Grimm collected it in 1819.
  - Clemens Brentano had invented it in 1801, only about 20 years earlier.
  answer: 3
  explanation: 'The Loreley legend is not an old folk tale: Clemens Brentano made it up in a ballad of 1801. Heine wrote his poem in 1824, so the "tale from olden times" was quite new.'
- id: de3-h1-r2-h25
  lesson: de3-h-gedichte
  topic: Old and poetic German
  type: text
  stem: 'Write the line in today''s spelling: Heine wrote "Daß ich so traurig bin". Today: "___ ich so traurig bin."'
  accept:
  - dass
  explanation: Since the 1996 spelling reform, daß is written dass (ß after a short vowel became ss).
- id: de3-h1-r2-h26
  lesson: de3-h-gedichte
  topic: Poems
  stem: 'Complete: "Ich habe das Gedicht ___ gelernt." (I learned the poem by heart.)'
  choices:
  - herzlich
  - vorwärts
  - auswendig
  - zusammen
  answer: 2
  explanation: auswendig lernen means to learn by heart. herzlich means warm, cordial (herzliche Grüße), not "by heart".
- id: de3-h1-r2-h27
  lesson: de3-h-gedichte
  module_quiz: true
  topic: Poems
  stem: What is the rhyme scheme of the whole of Mondnacht (Himmel, geküsst, Blütenschimmer, müsst' / Felder, sacht, Wälder, Nacht / spannte, aus, Lande, Haus)?
  choices:
  - abab cdcd efef
  - aabb ccdd eeff
  - abba cddc effe
  - abab abab abab
  answer: 0
  explanation: 'Each stanza has alternate rhyme with new sounds: Himmel/Blütenschimmer and geküsst/müsst'' (abab), Felder/Wälder and sacht/Nacht (cdcd), spannte/Lande and aus/Haus (efef). abab abab abab would need the same rhyme sounds in every stanza.'
- id: de3-h1-r2-h28
  lesson: de3-h-gedichte
  topic: Poems
  stem: Which pair of rhyme words from Mondnacht is an impure rhyme (unreiner Reim)?
  choices:
  - sacht – Nacht
  - aus – Haus
  - geküsst – müsst'
  - Himmel – Blütenschimmer
  answer: 3
  explanation: 'Himmel and Schimmer share the stressed i and the mm but end differently (-el, -er): close, not identical. sacht/Nacht, aus/Haus and geküsst/müsst'' rhyme perfectly from the stressed vowel on.'
- id: de3-h1-r2-h29
  lesson: de3-h-erinnerung
  module_quiz: true
  topic: Remembering history
  stem: Why is 9 November called "der Schicksalstag" (the day of fate)?
  choices:
  - Because the Berlin Wall was built on that day
  - Because several turning points of German history happened on that date
  - Because it is the German national holiday
  - Because the Second World War ended on that day
  answer: 1
  explanation: 1918 (the republic is proclaimed), 1923 (Hitler's failed putsch), 1938 (the November pogroms) and 1989 (the fall of the Wall) all happened on 9 November. The Wall was built in 1961, the national holiday is 3 October and the war in Europe ended on 8 May 1945.
- id: de3-h1-r2-h30
  lesson: de3-h-erinnerung
  module_quiz: true
  topic: Remembering history
  type: match
  stem: Match each 9 November to what happened.
  pairs:
  - - '1918'
    - A republic is proclaimed in Berlin
  - - '1923'
    - Hitler's failed putsch in Munich
  - - '1938'
    - The November pogroms
  - - '1989'
    - The Berlin Wall falls
  distractors:
  - German reunification
  explanation: '1918: the republic is proclaimed; 1923: Hitler''s failed putsch in Munich; 1938: the November pogroms; 1989: the Berlin Wall falls. Reunification came on 3 October 1990.'
- id: de3-h1-r2-h31
  lesson: de3-h-erinnerung
  module_quiz: true
  topic: Memorial texts
  type: text
  stem: 'Rewrite the Stolperstein line "DEPORTIERT 1942" as a full sentence about Rosa Adler: "Sie ___ 1942 deportiert."'
  accept:
  - wurde
  explanation: 'Rosa Adler didn''t deport anyone; she was deported. So the participle stands for a passive in the past: Sie wurde 1942 deportiert.'
- id: de3-h1-r2-h32
  lesson: de3-h-erinnerung
  topic: Memorial texts
  stem: What does "JG. 1903" on a Stolperstein mean?
  choices:
  - joined the group in 1903
  - died in 1903
  - year of birth 1903
  - lived here from 1903
  answer: 2
  explanation: 'JG. is short for Jahrgang, the year someone was born: Sie wurde 1903 geboren.'
- id: de3-h1-r2-h33
  lesson: de3-h-erinnerung
  module_quiz: true
  topic: Remembering history
  stem: Which statements about Stolpersteine are true? Select all that apply.
  choices:
  - Each stone carries the name of one person.
  - They are placed in front of the person's last freely chosen home.
  - They are paid for by the federal government.
  - Every German city allows them on public ground.
  - The artist Gunter Demnig laid the first one in 1992.
  answer:
  - 0
  - 1
  - 4
  explanation: Each stone remembers one person, in front of the last home they chose freely. Neighbours, school classes, relatives and local groups pay for them, not the federal government, and Munich, for example, doesn't allow them on public ground. Demnig laid the first one in Cologne in 1992.
- id: de3-h1-r2-h34
  lesson: de3-h-erinnerung
  module_quiz: true
  topic: Memorial texts
  stem: 'Complete: "Wir gedenken ___ Opfer."'
  choices:
  - die
  - den
  - der
  - dem
  answer: 2
  explanation: 'gedenken takes the genitive, and the genitive plural article is der: Wir gedenken der Opfer. In everyday German: Wir erinnern an die Opfer.'
- id: de3-h1-r2-h35
  lesson: de3-h-erinnerung
  topic: Memorial texts
  type: label
  stem: Name the numbered parts of the picture.
  image:
    src: images/de3-h1-stolperstein-blank.svg
    alt: A house front with a door, a pavement with a small brass stone, and a magnified view of the stone's text with four numbered points.
  labels:
  - x: 30.5
    y: 53.2
    text: die Haustür
  - x: 14.1
    y: 86.2
    text: der Gehweg
  - x: 30.6
    y: 77.2
    text: der Stolperstein
  - x: 87.5
    y: 41.7
    text: der Jahrgang
  distractors:
  - das Fenster
  - der Name
  explanation: 1 is the front door, 2 the pavement, 3 the brass stone set into it, and 4 the line JG. 1903, the year of birth (Jahrgang). The name is the line ROSA ADLER, which has no number.
- id: de3-h1-r2-h36
  lesson: de3-h-erinnerung
  topic: Remembering history
  stem: What is special about a "Mahnmal"?
  choices:
  - It honours a victory.
  - It is a cemetery.
  - It is a museum about art.
  - 'It warns: it remembers a crime so that it never happens again.'
  answer: 3
  explanation: Mahnmal comes from mahnen, to warn. A Denkmal can also honour a person or a victory; a cemetery is der Friedhof.
- id: de3-h1-r2-h37
  lesson: de3-h-erinnerung
  topic: Memorial texts
  type: order
  stem: Put the events from the plaque in time order.
  items:
  - Die Druckerei wird von SA-Männern zerstört.
  - Paul kommt mit einem Kindertransport nach England.
  - Rosa und Max Adler werden deportiert.
  - Die Bürger der Stadt hängen die Gedenktafel auf.
  explanation: '1938: the printing works is destroyed; 1939: Paul reaches England with a Kindertransport; 1942: Rosa and Max are deported; 2008: the citizens put up the plaque.'
- id: de3-h1-r2-h38
  lesson: de3-h-erinnerung
  topic: Memorial texts
  stem: '"Rosa Adler deportierte 1942." What is wrong with this sentence?'
  choices:
  - 'The active voice says she deported someone; it must be passive: Rosa Adler wurde 1942 deportiert.'
  - Nothing; it is correct.
  - The year must come first.
  - deportieren is a strong verb, so the past is deportiert.
  answer: 0
  explanation: 'Things were done to the victims, so memorial texts use the passive: wurde … deportiert. deportieren is a regular -ieren verb (deportierte, hat deportiert); the problem is the meaning, not the form.'
- id: de3-h1-r2-h39
  lesson: de3-h-erinnerung
  topic: Remembering history
  stem: What does "Vergangenheitsbewältigung" mean?
  choices:
  - remembering birthdays
  - coming to terms with the past
  - a history exam
  - the end of the war
  answer: 1
  explanation: die Vergangenheit (the past) + die Bewältigung (coping with, mastering). Many people prefer die Aufarbeitung (working through).
- id: de3-h1-r2-h40
  lesson: de3-h-erinnerung
  topic: Memorial texts
  stem: Which sentence means "The plaque commemorates the Adler family"?
  choices:
  - Die Tafel erinnert sich an die Familie Adler.
  - Die Tafel gedenkt die Familie Adler.
  - Die Tafel erinnert der Familie Adler.
  - Die Tafel erinnert an die Familie Adler.
  answer: 3
  explanation: 'erinnern an + accusative without sich means to remind of or commemorate. sich erinnern an means to remember (a plaque can''t remember), and gedenken would need the genitive: der Familie Adler.'
- id: de3-h1-r2-h41
  lesson: de3-h-erinnerung
  topic: Memorial texts
  type: text
  stem: 'A Stolperstein says: HIER WOHNTE PAUL ADLER … FLUCHT 1939 / ENGLAND. Complete with the simple past of fliehen: "1939 ___ er nach England."'
  accept:
  - floh
  explanation: 'fliehen is strong (ie – o – o): floh, ist geflohen. Here the verb is active, because Paul acted himself: 1939 floh er nach England.'
- id: de3-h1-r2-h42
  lesson: de3-h-erinnerung
  topic: Memorial texts
  stem: Why do memorial texts use so many passive sentences?
  choices:
  - Because they are about things that were done to people
  - Because German has no active voice in the past
  - Because the passive is shorter
  - Because plaques must be in the future tense
  answer: 0
  explanation: 'The victims are the subject of the text, and what happened was done to them by others: wurde zerstört, wurden deportiert. The passive puts them in first place.'
- id: de3-h1-r2-h43
  lesson: de3-h-einwanderung
  module_quiz: true
  topic: Migration history
  stem: With which country did West Germany sign its first recruitment agreement, in 1955?
  choices:
  - Turkey
  - Italy
  - Spain
  - Greece
  answer: 1
  explanation: The first Anwerbeabkommen was signed with Italy in December 1955. Spain and Greece followed in 1960, Turkey in 1961.
- id: de3-h1-r2-h44
  lesson: de3-h-einwanderung
  module_quiz: true
  topic: Migration history
  type: order
  stem: Put the recruitment agreements in time order.
  items:
  - Italien
  - Türkei
  - Marokko
  - Jugoslawien
  explanation: Italy 1955, Turkey 1961, Morocco 1963, Yugoslavia 1968.
- id: de3-h1-r2-h45
  lesson: de3-h-einwanderung
  topic: Migration history
  stem: What happened after the recruitment stop (Anwerbestopp) of 1973?
  choices:
  - All guest workers went home.
  - Germany signed new recruitment agreements.
  - Many workers stayed and brought their families.
  - Guest workers had to become German citizens.
  answer: 2
  explanation: Leaving now meant never being able to come back, so many workers stayed and their families joined them. Temporary workers became immigrants.
- id: de3-h1-r2-h46
  lesson: de3-h-einwanderung
  module_quiz: true
  topic: Describing statistics
  type: text
  stem: The share rose from 20 % to 24 %. By how many percentage points did it rise? Give only the number.
  accept:
  - '4'
  explanation: 'Percentage points are the plain difference: 24 − 20 = 4.'
- id: de3-h1-r2-h47
  lesson: de3-h-einwanderung
  topic: Describing statistics
  type: text
  stem: The share rose from 20 % to 24 %. By how many per cent did it rise compared with the old value? Give only the number.
  accept:
  - '20'
  explanation: 'Compare the difference with the old value: 4 ÷ 20 = 0.2, so it rose by 20 per cent (and by 4 percentage points).'
- id: de3-h1-r2-h48
  lesson: de3-h-einwanderung
  topic: Describing statistics
  stem: The share ended at 24 %. Which sentence says that correctly?
  choices:
  - Der Anteil stieg um 24 Prozent.
  - Der Anteil stieg bis 24 Prozenten.
  - Der Anteil hat auf 24 Prozent gestiegen.
  - Der Anteil ist auf 24 Prozent gestiegen.
  answer: 3
  explanation: auf gives the new value, um the difference. steigen takes sein in the perfect, and Prozent has no plural ending after a number.
- id: de3-h1-r2-h49
  lesson: de3-h-einwanderung
  module_quiz: true
  topic: Describing statistics
  type: label
  stem: Name the numbered parts of the chart.
  image:
    src: images/de3-h1-chart.svg
    alt: A bar chart of the share of residents with an immigration history in Neustadt, 2000 to 2024, with four numbered points.
  labels:
  - x: 12.5
    y: 6.8
    text: der Titel
  - x: 64.1
    y: 62.1
    text: die Säule
  - x: 15.6
    y: 52.3
    text: die Achse
  - x: 16.9
    y: 93.9
    text: die Quelle
  distractors:
  - die Legende
  - das Kreisdiagramm
  explanation: 1 is the title, 2 one of the bars (die Säule; this kind of chart is a Säulendiagramm), 3 the vertical axis with the percentages, and 4 the source line, Quelle. The chart has no legend, and it isn't a pie chart (Kreisdiagramm).
- id: de3-h1-r2-h50
  lesson: de3-h-einwanderung
  topic: Describing statistics
  type: match
  stem: Match each verb to its meaning in a chart description.
  pairs:
  - - steigen
    - To go up
  - - sinken
    - To go down
  - - gleich bleiben
    - To stay the same
  - - sich verdoppeln
    - To double
  distractors:
  - To halve
  explanation: steigen = to rise, sinken = to fall, gleich bleiben = to stay the same, sich verdoppeln = to double. "To halve" would be sich halbieren.
- id: de3-h1-r2-h51
  lesson: de3-h-einwanderung
  module_quiz: true
  topic: Describing statistics
  stem: Which statements about the Neustadt chart (12 %, 15 %, 20 %, 24 %) are correct? Select all that apply.
  choices:
  - The share doubled between 2000 and 2024.
  - The biggest rise was between 2008 and 2016.
  - In 2024 about one in four residents had an immigration history.
  - The share fell between 2016 and 2024.
  - The numbers are real statistics.
  answer:
  - 0
  - 1
  - 2
  explanation: 12 → 24 is a doubling. The rises are 3, 5 and 4 points, so 2008–2016 is the biggest. 24 % is about a quarter. The share rose, not fell, from 2016 to 2024, and the chart says the numbers are invented.
- id: de3-h1-r2-h52
  lesson: de3-h-einwanderung
  topic: Migration history
  stem: Which statement is correct?
  choices:
  - Ausländer are people without German citizenship; many were born in Germany.
  - All immigrants are Ausländer.
  - Einwanderungsgeschichte means having one grandparent born abroad.
  - Migrationshintergrund and Ausländer mean the same.
  answer: 0
  explanation: Ausländer only means "without German citizenship". Many immigrants have become German, and many Ausländer were born in Germany. Einwanderungsgeschichte means you or both your parents immigrated since 1950.
- id: de3-h1-r2-h53
  lesson: de3-h-einwanderung
  topic: Migration history
  stem: 'Max Frisch wrote in 1965: „Man hat Arbeitskräfte gerufen, und es kommen Menschen.“ What did he mean?'
  choices:
  - The workers were people with families and lives, not just labour that would leave again.
  - There were not enough workers.
  - People came without being called.
  - Workers should be sent home.
  answer: 0
  explanation: Arbeitskräfte (workers, labour) were what the countries wanted; Menschen (people) are what arrived, with families, needs and lives of their own.
- id: de3-h1-r2-h54
  lesson: de3-h-einwanderung
  topic: Describing statistics
  stem: 'Complete: "Der Anteil ___ in den letzten Jahren gestiegen."'
  choices:
  - hat
  - wird
  - ist
  - habe
  answer: 2
  explanation: 'steigen is a verb of change of state and takes sein in the perfect: Der Anteil ist gestiegen. The same goes for sinken: ist gesunken.'
- id: de3-h1-r2-h55
  lesson: de3-h-einwanderung
  topic: Migration history
  stem: Since the 2024 reform, after how many years of residence can people usually be naturalised in Germany?
  choices:
  - three
  - five
  - eight
  - ten
  answer: 1
  explanation: The 2024 reform lowered the usual period from eight to five years. A three-year fast track was added at the same time but abolished again in 2025.
- id: de3-h1-r2-h56
  lesson: de3-h-einwanderung
  topic: Describing statistics
  stem: Which is correct?
  choices:
  - 25 Prozente der Einwohner
  - 25 Prozenten der Einwohner
  - 25 Prozents der Einwohner
  - 25 Prozent der Einwohner
  answer: 3
  explanation: 'After a number, Prozent has no plural ending: 25 Prozent. With a plural noun after it, the verb is usually plural: 25 Prozent der Einwohner haben …'
