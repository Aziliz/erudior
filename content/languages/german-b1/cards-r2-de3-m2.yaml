# German B1, module 2 honors lessons (round 2): notecards
# --- 10h1 Whereas, however, unless ---
- {front: 'Contrast vs concession', back: 'Contrast: two different facts side by side (während, hingegen); you can swap the halves. Concession: a fact fails to stop something (obwohl, trotzdem).', topic: Contrast}
- {front: 'während: two meanings', back: 'while (same time): Während ich koche, deckt sie den Tisch. whereas (contrast): Während ich gern koche, isst sie lieber auswärts. Verb at the end in both.', topic: Contrast}
- {front: 'wohingegen', back: 'whereas (formal, only contrast, never time). Verb at the end: Er zahlt bar, wohingegen ich mit Karte zahle.', topic: Contrast}
- {front: 'dagegen / hingegen: word order', back: 'Linking adverbs. Position 1, verb next: Dagegen ist es in Wien ruhiger. Or after the first element: In Wien hingegen ist es ruhiger.', topic: Contrast}
- {front: 'dagegen: two meanings', back: 'on the other hand (in a comparison): In Wien dagegen … / against it (da-word of gegen): Ich bin dagegen.', topic: Contrast}
- {front: 'im Gegensatz zu', back: 'in contrast to, unlike; zu + dative: Im Gegensatz zu meinem Bruder spreche ich kein Französisch. im Gegensatz dazu = in contrast.', topic: Contrast}
- {front: 'allerdings', back: 'however, though: limits what you just said. Die Wohnung ist schön. Allerdings ist sie klein. As an answer, Allerdings! = It certainly is!', topic: Contrast}
- {front: 'es sei denn', back: 'unless. Comma + normal main clause (verb second): Wir gehen wandern, es sei denn, es regnet. Or: es sei denn, dass es regnet.', topic: Connectors}
- {front: 'außer wenn', back: 'except when, unless. Verb at the end: Ich fahre Rad, außer wenn es schneit.', topic: Connectors}
- {front: 'unless: don''t add nicht', back: 'es sei denn and außer wenn already contain the "not" = wenn … nicht. "es sei denn, es regnet nicht" would mean "unless it doesn''t rain".', topic: Connectors}
- {front: 'sonst / andernfalls', back: 'otherwise, or else. Linking adverbs, verb next: Wir müssen los, sonst verpassen wir den Zug. andernfalls is the formal version.', topic: Connectors}
- {front: 'Sunday shopping in Germany', back: 'Sundays and public holidays are protected days of rest; most shops are closed. Opening hours (Ladenschluss) are set by each Bundesland; stations, airports, petrol stations and often bakeries are exceptions.', topic: Culture}
# --- 10h2 Even if, no matter how ---
- {front: 'obwohl vs auch wenn vs selbst wenn', back: 'obwohl: a real fact. auch wenn: fact or possibility (even if). selbst wenn: the extreme or imagined case. All three: verb at the end.', topic: Concession}
- {front: 'Concessive conditional clause', back: 'A clause with auch wenn or selbst wenn: the main event happens whatever the condition. Auch wenn es regnet, gehen wir raus.', topic: Concession}
- {front: 'Word order after a fronted auch wenn clause', back: 'Verb straight after the comma: Auch wenn es regnet, gehen wir raus. (In speech you may hear subject first; avoid it in writing.)', topic: Concession}
- {front: 'selbst wenn + Konjunktiv II', back: 'For imagined cases: Selbst wenn ich im Lotto gewinnen würde, würde ich weiterarbeiten.', topic: Concession}
- {front: 'Why not obwohl for tomorrow?', back: 'obwohl is only for facts. A possible event takes auch wenn: Auch wenn es morgen schneien sollte, fahren wir los.', topic: Concession}
- {front: 'Egal, wie / was / ob …', back: 'no matter how / what / whether. The main clause usually keeps subject first: Egal, wie teuer es ist, ich kaufe es.', topic: Concession}
- {front: 'Wie man es auch dreht', back: 'However you look at it (fixed phrase; also Was du auch sagst, … = whatever you say).', topic: Concession}
- {front: 'Structure of an argumentative essay (Erörterung)', back: 'Einleitung → Argumente dafür → Argumente dagegen → abwägen → Fazit with your own opinion.', topic: Argument}
- {front: 'Adding arguments', back: 'Zunächst … · Außerdem … · Darüber hinaus … (moreover) · Hinzu kommt, dass … · Ein weiteres Argument ist …', topic: Argument}
- {front: 'Switching sides and conceding', back: 'Auf der anderen Seite … · Dagegen spricht, dass … · Es stimmt zwar, dass …, aber …', topic: Argument}
- {front: 'Concluding', back: 'Letztlich … (in the end) · Insgesamt … (all in all) · Zusammenfassend lässt sich sagen, dass … (to sum up)', topic: Argument}
- {front: 'Hinzu kommt, dass … : word order', back: 'A complete main clause; the argument follows in a dass clause with the verb at the end: Hinzu kommt, dass Geschäfte weniger Arbeit haben.', topic: Argument}
