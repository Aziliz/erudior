# German B1, module 3 (round 2): cards for the honors lessons 15h1 and 15h2.
# --- 15h1 extended participle phrases ---
- {front: 'Extended participle phrase: the frame', back: 'Article … noun frame the phrase; the participle (with an adjective ending) stands right before the noun; its own words come before it: der beim Bau entdeckte Schatz.', topic: Extended participle phrases}
- {front: 'der beim Bau entdeckte Schatz', back: 'der Schatz, der beim Bau entdeckt wurde (the treasure discovered during construction)', topic: Extended participle phrases}
- {front: 'How to read a participle phrase', back: 'Find an article with no noun after it, jump to the first noun that fits it, take the word before that noun as the participle, and read the middle as its words.', topic: Extended participle phrases}
- {front: 'Partizip I before a noun: meaning', back: 'Active, at the same time: die steigenden Preise = die Preise, die steigen.', topic: Extended participle phrases}
- {front: 'Partizip II of a verb with an object: meaning', back: 'Passive: die von Kindern gefundenen Münzen = die Münzen, die von Kindern gefunden wurden.', topic: Extended participle phrases}
- {front: 'Partizip II of a sein verb: meaning', back: 'Active and finished: der gerade angekommene Zug = der Zug, der gerade angekommen ist.', topic: Extended participle phrases}
- {front: 'Why not "der geschlafene Mann"?', back: 'Verbs with haben and no object (schlafen, arbeiten, lachen) have no Partizip II before a noun. Use a relative clause: der Mann, der geschlafen hat.', topic: Extended participle phrases}
- {front: 'die noch zu untersuchenden Münzen', back: 'the coins that still have to be examined (zu + Partizip I, the gerundive: must or can be done)', topic: Extended participle phrases}
- {front: 'eine etwa 2.000 Jahre alte Münze', back: 'a coin about 2,000 years old (adjectives can be extended too)', topic: Extended participle phrases}
- {front: 'Participle phrases: when to use them', back: 'Short ones in writing (die gestern bestellte Ware); in speech, use a relative clause.', topic: Extended participle phrases}
- {front: 'die Ausgrabung, ausgraben', back: 'excavation, to dig up (grub aus, hat ausgegraben)', topic: Archaeology and museums}
- {front: 'stammen aus', back: 'to come from, to date from: Die Münze stammt aus dem 2. Jahrhundert.', topic: Archaeology and museums}
# --- 15h2 office German ---
- {front: 'aufgrund', back: 'due to, because of (+ genitive; the formal wegen). Without an article: aufgrund von.', topic: Genitive prepositions in writing}
- {front: 'infolge', back: 'as a result of (+ genitive): Infolge des Unwetters fiel der Strom aus.', topic: Genitive prepositions in writing}
- {front: 'angesichts', back: 'in view of, given (+ genitive): Angesichts der hohen Kosten …', topic: Genitive prepositions in writing}
- {front: 'dank', back: 'thanks to (+ genitive or dative); only for a good result.', topic: Genitive prepositions in writing}
- {front: 'mangels', back: 'for lack of (+ genitive): mangels ausreichender Nachfrage', topic: Genitive prepositions in writing}
- {front: 'bezüglich (bzgl.), hinsichtlich', back: 'regarding, with regard to (+ genitive): Bezüglich Ihrer Anfrage …', topic: Genitive prepositions in writing}
- {front: 'laut', back: 'according to (+ genitive or dative); no ending without an article: laut Polizei, laut Plan.', topic: Genitive prepositions in writing}
- {front: 'mithilfe, anhand, anlässlich', back: 'with the help of, on the basis of / using, on the occasion of (all + genitive)', topic: Genitive prepositions in writing}
- {front: 'entlang', back: 'along: den Fluss entlang (after the noun, accusative) or entlang des Flusses (before, genitive)', topic: Genitive prepositions in writing}
- {front: 'dessen / deren in use', back: 'Agree with the owner; never change; no article after them; preposition in front (mit deren Hilfe); strong adjective ending (dessen neues Auto).', topic: Genitive prepositions in writing}
- {front: 'possessive dative', back: 'dem Vater sein Haus: spoken and regional, not standard. Write: das Haus des Vaters.', topic: Genitive prepositions in writing}
- {front: 'die Angelegenheit', back: 'matter, affair: in dieser Angelegenheit', topic: Official letters}
