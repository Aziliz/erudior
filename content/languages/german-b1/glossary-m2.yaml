# German B1, module 2 glossary terms (lessons 06–10)
- term: causal clause
  aliases: [causal clauses, reason clause, clause of reason, Kausalsatz]
  definition: 'A subordinate clause that gives the reason for the main clause and answers Warum?, introduced by weil or da: Ich bleibe zu Hause, weil ich krank bin. Da es regnet, nehmen wir den Bus. The verb goes to the end.'
  topic: Connectors
- term: concessive clause
  aliases: [concessive clauses, concession, concessive, Konzessivsatz]
  definition: 'A clause that admits a fact which should prevent the main event but does not: Ich kaufe es, obwohl es teuer ist (although). With obwohl the verb goes to the end; the adverb partner trotzdem (anyway) introduces the unexpected result instead: Es ist teuer. Trotzdem kaufe ich es.'
  topic: Connectors
- term: two-part connector
  aliases: [two-part connectors, correlative conjunction, correlative conjunctions, paired conjunction, paired conjunctions, zweiteilige Konnektoren]
  definition: 'A pair of words that frame two ideas: entweder … oder (either … or), weder … noch (neither … nor), sowohl … als auch (both … and), nicht nur … sondern auch (not only … but also), zwar … aber (admittedly … but). Linking two words or phrases, they do not change the word order.'
  topic: Connectors
- term: purpose clause
  aliases: [purpose clauses, final clause, final clauses, clause of purpose, Finalsatz]
  definition: 'A clause that says what an action is for and answers Wozu? With the same subject in both parts German uses um … zu + infinitive (Ich spare, um zu reisen); with a different subject it uses damit + verb at the end (Ich spare, damit meine Tochter reisen kann).'
  topic: Connectors
- term: conditional clause
  aliases: [conditional clauses, condition clause, Konditionalsatz]
  definition: 'A subordinate clause that states a condition for the main clause, introduced by wenn (if) or falls (in case, if it should happen), with the verb at the end: Falls Sie Fragen haben, rufen Sie uns an.'
  topic: Connectors
- term: result clause
  aliases: [result clauses, consecutive clause, consecutive clauses, clause of result, Konsekutivsatz]
  definition: 'A clause that gives the consequence of the main clause, introduced by sodass or by so + adjective … dass, with the verb at the end: Es regnete stark, sodass der Keller nass war. Das Wasser war so kalt, dass niemand schwimmen wollte. Not to be confused with damit, which gives a goal.'
  topic: Connectors
- term: proportional clause
  aliases: [proportional clauses, je … desto, je-desto clause, comparative correlative]
  definition: 'A pair of clauses in which two things change together: je + comparative with the verb at the end, then desto or umso + comparative with the verb straight after: Je mehr ich trainiere, desto fitter werde ich (the more …, the fitter …).'
  topic: Comparison
