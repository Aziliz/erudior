# Round 2, honors module de3-h1: cards for lessons 90–93.

# 90 Die Kurzgeschichte
- {front: 'Kurzgeschichte: typical features', back: 'Sudden start, open ending, a turning point, a short time, few characters, everyday language, gaps (Leerstellen). A checklist, not a law.', topic: Short stories}
- {front: 'Trümmerliteratur', back: 'Rubble literature: German writing soon after 1945 about war, hunger and ruins. Wolfgang Borchert (Das Brot, 1946), Heinrich Böll (Nobel Prize 1972).', topic: Short stories}
- {front: 'unvermittelter Anfang', back: 'Sudden start: no introduction; the reader is dropped into the action.', topic: Short stories}
- {front: 'offener Schluss', back: 'Open ending: the story stops without telling how things turn out.', topic: Short stories}
- {front: 'der Wendepunkt', back: 'Turning point: the moment that changes the situation or what a character understands.', topic: Short stories}
- {front: 'die Leerstelle', back: 'A gap: something important the text leaves unsaid, for the reader to fill in.', topic: Short stories}
- {front: 'Erzähler vs Autor', back: 'The narrator is the voice in the text; the author is the real person who wrote it.', topic: Short stories}
- {front: 'Ich-Erzähler vs Er-/Sie-Erzähler', back: 'First-person narrator (ich, a character) vs third-person narrator (talks about er and sie).', topic: Short stories}
- {front: 'Inhaltsangabe: tense', back: 'Present tense; earlier events in the perfect. Never the simple past of the story.', topic: Writing a summary}
- {front: 'Inhaltsangabe: rules', back: 'No direct speech, no opinion, own words, main events in order.', topic: Writing a summary}
- {front: 'Inhaltsangabe: first sentence', back: 'In der Kurzgeschichte „…“ von … geht es um … (title, author, text type, theme).', topic: Writing a summary}
- {front: 'Direct speech in a summary', back: '„Hast du gegessen?“, fragte sie. → Sie fragt ihn, ob er schon gegessen hat.', topic: Writing a summary}

# 91 Gedichte
- {front: 'die Strophe / die Zeile, der Vers', back: 'Stanza / line. German Vers is one line, not a stanza.', topic: Poems}
- {front: 'Paarreim', back: 'Couplet rhyme: aabb.', topic: Poems}
- {front: 'Kreuzreim', back: 'Alternate rhyme: abab.', topic: Poems}
- {front: 'umarmender Reim', back: 'Enclosed rhyme: abba.', topic: Poems}
- {front: 'How to find a rhyme scheme', back: 'Give each new end sound a new letter; rhyming lines share a letter. Listen to the sound, not the spelling.', topic: Poems}
- {front: 'unreiner Reim', back: 'Impure rhyme: close but not identical, e.g. Himmel / Schimmer.', topic: Poems}
- {front: 'Zeilensprung (enjambment)', back: 'The sentence runs on into the next line: Und meine Seele spannte / Weit ihre Flügel aus. Don''t stop when reading aloud.', topic: Poems}
- {front: 'Elision', back: 'A dropped sound, often final -e: hätt'' = hätte, leis = leise, nach Haus = nach Hause.', topic: Old and poetic German}
- {front: 'Mondnacht (Eichendorff, 1837)', back: 'Kreuzreim abab cdcd efef. Als hätt'' der Himmel … / Als flöge sie nach Haus: comparisons in Konjunktiv II.', topic: Poems}
- {front: 'Die Lore-Ley (Heine, 1824)', back: 'Ich weiß nicht, was soll es bedeuten … The "old" legend was invented by Clemens Brentano in 1801.', topic: Poems}
- {front: 'Poetic word order → everyday', back: 'Find the verb and the subject, then use normal order: was soll es bedeuten → was es bedeuten soll.', topic: Old and poetic German}
- {front: 'die Lande, flöge, daß', back: 'Old forms: die Länder; würde fliegen; dass (spelling since 1996). Understand them, don''t write them.', topic: Old and poetic German}

# 92 Erinnerungskultur
- {front: 'Erinnerungskultur', back: 'Culture of remembrance: how a society remembers its past in public (memorials, memorial days, museums, school).', topic: Remembering history}
- {front: 'Vergangenheitsbewältigung / Aufarbeitung', back: 'Coming to terms with the past / working through the past.', topic: Remembering history}
- {front: '9. November (Schicksalstag)', back: '1918 republic proclaimed; 1923 Hitler''s failed putsch; 1938 November pogroms; 1989 the Wall falls.', topic: Remembering history}
- {front: '27. Januar', back: '1945: Auschwitz liberated. German day of remembrance for the victims of National Socialism since 1996.', topic: Remembering history}
- {front: 'Stolperstein', back: 'A 10 × 10 cm brass stone in the pavement in front of a victim''s last freely chosen home; Gunter Demnig, since 1992.', topic: Remembering history}
- {front: 'JG. 1903', back: 'Jahrgang 1903: born in 1903.', topic: Memorial texts}
- {front: 'DEPORTIERT 1942', back: 'Telegraphic style for a passive: Sie wurde 1942 deportiert.', topic: Memorial texts}
- {front: 'gedenken + genitive', back: 'Wir gedenken der Opfer (solemn). Everyday: Wir erinnern an die Opfer.', topic: Memorial texts}
- {front: 'sich erinnern an vs erinnern an', back: 'sich erinnern an = to remember; erinnern an = to remind of, commemorate: Die Tafel erinnert an die Familie.', topic: Memorial texts}
- {front: 'Denkmal vs Mahnmal', back: 'Denkmal: any monument, also honouring. Mahnmal (mahnen, to warn): remembers a crime so that it never happens again.', topic: Remembering history}

# 93 Einwanderung
- {front: 'Anwerbeabkommen', back: 'Recruitment agreements: Italy 1955, Spain and Greece 1960, Turkey 1961, Morocco 1963, Portugal 1964, Tunisia 1965, Yugoslavia 1968.', topic: Migration history}
- {front: 'Anwerbestopp', back: 'November 1973: recruitment stopped; many workers stayed and their families followed.', topic: Migration history}
- {front: 'Man hat Arbeitskräfte gerufen, und es kommen Menschen.', back: 'Max Frisch, 1965 (about Switzerland): workers are people with lives, not just labour.', topic: Migration history}
- {front: 'Ausländer / Migrationshintergrund / Einwanderungsgeschichte', back: 'No German citizenship / you or a parent not born German / you or both parents immigrated since 1950.', topic: Migration history}
- {front: 'Einbürgerung (since 2024)', back: 'Naturalisation usually after five years; dual citizenship generally allowed. Check the current rules.', topic: Migration history}
- {front: 'von … auf vs um', back: 'von 20 auf 24 Prozent = from 20 to 24; um 4 Prozentpunkte = by 4 points.', topic: Describing statistics}
- {front: 'Prozentpunkte vs Prozent', back: '20 % → 24 %: +4 percentage points, but +20 per cent (4 ÷ 20).', topic: Describing statistics}
- {front: 'steigen / sinken: perfect', back: 'Der Anteil ist gestiegen / gesunken (sein).', topic: Describing statistics}
- {front: 'Describing a chart: structure', back: 'Introduction and source (Die Grafik zeigt … Die Zahlen stammen von …), main trend, details, conclusion (Insgesamt …).', topic: Describing statistics}
- {front: '25 Prozent', back: 'No plural ending after a number; with a plural noun the verb is usually plural: 25 Prozent der Einwohner haben …', topic: Describing statistics}
