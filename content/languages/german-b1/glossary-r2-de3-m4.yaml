# German B1 glossary, module 4 honors lessons (round 2)
- term: sich lassen
  aliases: [lässt sich, lassen sich, sich lassen + infinitive]
  definition: 'sich lassen + infinitive with a thing as the subject means "can be done", an alternative to a passive with können: Das Problem lässt sich lösen (= kann gelöst werden). Die Fenster lassen sich nicht öffnen. lassen agrees with the subject, and the infinitive goes to the end.'
  topic: Passive
- term: hearsay
  aliases: [hearsay sollen, hearsay meaning, reportive sollen, claim wollen]
  definition: 'Passing on a claim without confirming it. German uses sollen for what others say (Er soll reich sein = he is said to be rich) and wollen for what someone claims about himself or herself (Sie will nichts gesehen haben = she claims to have seen nothing). For the past, add the perfect infinitive: Er soll das Geld genommen haben.'
  topic: Reporting claims
