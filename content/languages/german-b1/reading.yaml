# Reading list for German B1. Checked 2026-10-17 (publisher pages or listings; see RESEARCH.md).
- title: Top-Thema mit Vokabeln
  publisher: Deutsche Welle
  level: B1
  url: https://podcasts.apple.com/us/podcast/top-thema-mit-vokabeln-audios-dw-deutsch-lernen/id282932005
  free: true
  note: A short article about a current topic every week, with audio, a glossary and exercises. The best weekly habit at this level.
- title: Nicos Weg (B1)
  publisher: Deutsche Welle
  level: B1
  url: https://www.podcast.de/podcast/776638/nicos-weg-deutschkurs-b1-videos-dw-deutsch-lernen
  free: true
  note: The third season of the free video course, following Nico's working life in Germany.
- title: Leo & Co. – Leichte Beute (Stufe 3)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: B1
  isbn: 978-3-12-674079-1
  url: https://www.klett-sprachen.de/leichte-beute-stufe-3/t-0/9783126740791
  note: A neighbourhood mystery in Berlin, with audio. Familiar characters from the A1 and A2 readers.
- title: Leo & Co. – Stille Nacht (Stufe 3)
  author: Elke Burger and Theo Scherling
  publisher: Klett
  level: B1
  isbn: 978-3-12-674086-9
  url: https://www.klett-sprachen.de/stille-nacht-stufe-3/t-0/9783126740869
  note: Christmas plans that don't go the way anyone expected.
- title: Spannender Lernkrimi – Tod einer Diva
  publisher: Hueber
  level: B1
  isbn: 978-3-19-198580-6
  url: https://shop.hueber.de/en/reihen-und-lehrwerke/spannender-lernkrimi-3930847.html
  note: A detective story with a free audio download, a glossary and exercises.
- title: Erich Kästner – Drei Männer im Schnee (Easy Readers)
  publisher: Klett
  level: B1
  isbn: 978-3-12-675721-8
  url: https://www.klett-sprachen.de/drei-maenner-im-schnee/t-1/9783126757218
  note: An adapted classic comedy about a millionaire who goes to a ski hotel in disguise.
- title: Uwe Timm – Die Entdeckung der Currywurst (Easy Readers)
  publisher: Klett
  level: B1
  isbn: 978-3-12-675737-9
  url: https://www.klett-sprachen.de/die-entdeckung-der-currywurst/t-13/9783126757379
  note: An adapted modern novel, a love story set in Hamburg at the end of the Second World War.
- title: Fälle für den Kommissar (Easy Readers)
  publisher: Klett
  level: B1
  isbn: 978-3-12-675773-7
  url: https://www.klett-sprachen.de/faelle-fuer-den-kommissar/t-7/9783126757737
  note: Two crime cases adapted from German television.
- title: Theodor Fontane – Effi Briest (Lesen und üben)
  publisher: Klett
  level: B1
  isbn: 978-3-12-556025-3
  url: https://www.klett-sprachen.de/effi-briest/t-12/9783125560253
  note: A shortened version of the 19th-century classic, with audio and exercises.
- title: Short Stories in German for Intermediate Learners
  author: Olly Richards
  publisher: Teach Yourself
  level: B1–B2
  isbn: 978-1-5293-6163-6
  note: Eight longer stories with summaries and word lists; good for the end of the course.
- title: nachrichtenleicht
  publisher: Deutschlandfunk
  level: A2–B1
  url: https://www.nachrichtenleicht.de/
  free: true
  note: News in plain German. At B1 you should now read it comfortably; use it for speed.
- title: Klexikon
  publisher: ZUM (children's encyclopedia)
  level: B1
  url: https://klexikon.zum.de/
  free: true
  note: Short, clear encyclopedia articles on almost any topic.
- title: Langsam gesprochene Nachrichten
  publisher: Deutsche Welle
  level: B2 (a stretch)
  url: https://www.bildungsserver.de/onlineressource.html?onlineressourcen_id=63415
  free: true
  note: Real news read slowly, with a full transcript, six days a week. Try it at the end of the course as a first step toward B2.
- title: Goethe-Zertifikat B1 model and practice tests
  publisher: Goethe-Institut
  level: B1
  url: https://www.goethe.de/pro/relaunch/prf/materialien/B1/b1_modellsatz_erwachsene.pdf
  free: true
  note: The official model test; the reading module has exactly the kinds of texts the exam uses. A second practice set with answers is at https://www.goethe.de/pro/relaunch/prf/materialien/B1/B1_Uebungssatz_Erwachsene.pdf
