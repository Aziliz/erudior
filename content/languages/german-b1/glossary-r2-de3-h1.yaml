# Round 2, honors module de3-h1: terms bolded in lessons 90–93.

# 90 Die Kurzgeschichte
- term: short story
  aliases: [short stories, Short story, Kurzgeschichte, Kurzgeschichten]
  definition: 'A short piece of prose fiction. The German Kurzgeschichte took shape after 1945 (Borchert, Böll): typically a sudden start, an open ending, a turning point, a short span of time, few characters, everyday language and gaps the reader must fill. These features are a school checklist; many stories break some of them.'
  topic: Short stories

- term: rubble literature
  aliases: [Trümmerliteratur]
  definition: 'German literature written soon after 1945 about the war, hunger, ruins and soldiers coming home, in plain, short sentences. Wolfgang Borchert and the young Heinrich Böll are the best-known names. (die Trümmer = ruins, rubble.)'
  topic: Short stories

- term: open ending
  aliases: [open endings, offener Schluss]
  definition: 'An ending that stops without telling the reader how things turn out, typical of the Kurzgeschichte. A fairy tale, by contrast, closes every question: Und wenn sie nicht gestorben sind, dann leben sie noch heute.'
  topic: Short stories

- term: turning point
  aliases: [turning points, Wendepunkt]
  definition: 'The moment in a story that changes the situation or what a character understands, often something small: a sentence, a look, an object. In the course story Der Zettel it is the note on the kitchen table.'
  topic: Short stories

- term: narrator
  aliases: [narrators, Erzähler, Erzählerin]
  definition: 'The voice that tells a story (der Erzähler, die Erzählerin). It is not the same as the author, the real person who wrote the text: even a narrator who says ich is a voice inside the text.'
  topic: Short stories

- term: first-person narrator
  aliases: [first person narrator, Ich-Erzähler]
  definition: 'A narrator who is a character in the story and says ich: Als ich aus dem Bus stieg, regnete es. The reader only knows what this person knows and thinks.'
  topic: Short stories

- term: third-person narrator
  aliases: [third person narrator, Er-Erzähler, Sie-Erzähler]
  definition: 'A narrator who talks about the characters as er and sie: Als Jana aus dem Bus stieg … This narrator may stay close to one character or know everything about everyone.'
  topic: Short stories

- term: Inhaltsangabe
  aliases: [Inhaltsangaben, plot summary]
  definition: 'The standard German school summary of a text: present tense (earlier events in the perfect), no direct speech, no opinion, own words, and an introduction sentence with title, author, text type and theme: In der Kurzgeschichte „…“ von … geht es um …'
  topic: Writing a summary

# 91 Gedichte
- term: stanza
  aliases: [stanzas, Strophe, Strophen]
  definition: 'A group of lines in a poem or song, separated from the next group by an empty line: die Strophe. The verse of a song is also die Strophe.'
  topic: Poems

- term: line of verse
  aliases: [line, lines of verse, Vers, Verse, Zeile]
  definition: 'One line of a poem: die Zeile or der Vers. Careful: German Vers means one line, while English "verse" often means a whole stanza.'
  topic: Poems

- term: rhyme scheme
  aliases: [rhyme schemes, Reimschema]
  definition: 'The pattern of rhymes in a poem, written with letters: each new rhyme sound gets the next letter, and rhyming lines share a letter. Eichendorff''s Mondnacht is abab cdcd efef.'
  topic: Poems

- term: couplet rhyme
  aliases: [Couplet rhyme, rhyming couplets, Paarreim]
  definition: 'The rhyme scheme aabb: lines rhyme in pairs (der Paarreim).'
  topic: Poems

- term: alternate rhyme
  aliases: [Alternate rhyme, cross rhyme, Kreuzreim]
  definition: 'The rhyme scheme abab: every other line rhymes, so the rhymes cross (der Kreuzreim).'
  topic: Poems

- term: enclosed rhyme
  aliases: [Enclosed rhyme, embracing rhyme, umarmender Reim]
  definition: 'The rhyme scheme abba: one pair of rhymes is enclosed by another (der umarmende Reim).'
  topic: Poems

- term: impure rhyme
  aliases: [impure rhymes, unreiner Reim, near rhyme, half rhyme]
  definition: 'A rhyme that is close but not identical in sound, accepted in many poems: Himmel / Schimmer (the endings -el and -er differ). Spelling doesn''t matter: Felder / Wälder is a pure rhyme, because e and ä sound the same there.'
  topic: Poems

- term: elision
  aliases: [Elision]
  definition: 'Dropping a sound, usually a final -e, for rhythm or rhyme, often marked with an apostrophe in older texts: hätt'' (hätte), leis (leise), nach Haus (nach Hause).'
  topic: Old and poetic German

- term: enjambment
  aliases: [Zeilensprung]
  definition: 'When a sentence runs on from one line of a poem into the next without a pause: Und meine Seele spannte / Weit ihre Flügel aus. Read it aloud without stopping at the line end.'
  topic: Poems

# 92 Erinnerungskultur
- term: culture of remembrance
  aliases: [Erinnerungskultur, remembrance culture]
  definition: 'All the ways a society remembers its past in public: memorials, memorial days, museums, school lessons and speeches. In Germany it refers above all to the Nazi era and the Holocaust, and also to the GDR.'
  topic: Remembering history

- term: Vergangenheitsbewältigung
  aliases: [coming to terms with the past]
  definition: 'Coming to terms with the past, especially the Nazi era: die Vergangenheit (the past) + die Bewältigung (coping with, mastering). Many people prefer die Aufarbeitung (working through), because such a past cannot really be mastered.'
  topic: Remembering history

- term: Stolperstein
  aliases: [Stolpersteine, stumbling stone, stumbling stones]
  definition: 'A small brass plate (10 × 10 cm) set into the pavement in front of the last freely chosen home of one person persecuted by the Nazis, with their name and fate: HIER WOHNTE … JG. … DEPORTIERT … A project of the artist Gunter Demnig since 1992; the 100,000th was laid in 2023.'
  topic: Remembering history

- term: telegraphic style
  aliases: [Telegrammstil]
  definition: 'Writing without articles and auxiliary verbs, keeping only the words that carry the facts, as on Stolpersteine, plaques and CVs: DEPORTIERT 1942 = Sie wurde 1942 deportiert. A participle alone often stands for a passive.'
  topic: Memorial texts

# 93 Einwanderung
- term: guest worker
  aliases: [guest workers, Gastarbeiter, Gastarbeiterin]
  definition: 'A worker recruited abroad by West Germany between 1955 and 1973 under recruitment agreements. The name assumed they would go home; many stayed and brought their families. Today it is a historical term, often written in quotation marks.'
  topic: Migration history

- term: recruitment agreement
  aliases: [recruitment agreements, Anwerbeabkommen]
  definition: 'A treaty under which West Germany recruited workers from another country: Italy 1955, Spain and Greece 1960, Turkey 1961, Morocco 1963, Portugal 1964, Tunisia 1965, Yugoslavia 1968. Recruitment stopped in 1973 (der Anwerbestopp).'
  topic: Migration history

- term: naturalisation
  aliases: [naturalization, Einbürgerung]
  definition: 'Becoming a citizen of a country you were not born a citizen of: die Einbürgerung, sich einbürgern lassen. In Germany the usual minimum residence has been five years since the 2024 reform; rules change, so check the current law.'
  topic: Migration history

- term: percentage point
  aliases: [percentage points, Prozentpunkt, Prozentpunkte]
  definition: 'The plain difference between two percentages: from 20 % to 24 % is 4 percentage points. The change in per cent compares the difference with the old value: 4 ÷ 20 = an increase of 20 per cent.'
  topic: Describing statistics
