# Round 2, module de3-m6: terms bolded in the honors lessons 30h1 and 30h2.
- term: direct speech
  aliases: [direkte Rede, quoted speech]
  definition: 'Someone''s exact words, in quotation marks: „Die Brücke ist sicher", sagte er. German quotation marks open low („) and close high (“). Direct speech keeps the speaker''s own tense and pronouns; reported speech changes them.'
  topic: Reported speech

- term: reporting verb
  aliases: [reporting verbs, verb of saying, verbs of saying]
  definition: 'A verb that introduces what someone said: sagen, erklären, mitteilen (neutral), betonen (stress), behaupten (claim, with doubt), bestätigen (confirm), einräumen (admit), bestreiten or dementieren (deny), fordern (demand). The choice often shows how the reporter sees the statement.'
  topic: Reported speech

- term: replacement rule
  aliases: [Ersatzregel, Ersatzform, replacement forms]
  definition: 'The rule for choosing the verb form in formal reported speech: use the Konjunktiv I (er komme); if it looks like the indicative (sie kommen), use the Konjunktiv II (sie kämen); if that looks like the Präteritum (sie arbeiteten), use würde + infinitive (sie würden arbeiten).'
  topic: Konjunktiv I

- term: officialese
  aliases: [Amtsdeutsch, Behördendeutsch, bureaucratese]
  definition: 'The style of letters from offices and companies: nouns instead of verbs (nach Eingang Ihrer Zahlung), light verb constructions (einen Antrag stellen), sein + zu (ist zu überweisen), the passive and many abbreviations (Az., i. A., ggf.). To understand it, turn the nouns back into verbs.'
  topic: Official letters

- term: light verb construction
  aliases: [light verb constructions, Funktionsverbgefüge, support verb construction, support verb constructions]
  definition: 'A noun plus a verb that has lost most of its own meaning, so the noun carries the meaning: einen Antrag stellen (= beantragen), Widerspruch einlegen (= widersprechen), eine Entscheidung treffen (= entscheiden), zur Verfügung stellen (= bereitstellen), in Kraft treten (= gültig werden). Typical of formal and official German.'
  topic: Official letters
