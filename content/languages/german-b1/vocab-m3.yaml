# German B1, module 3: Describing in detail (lessons 11–15)

# --- 11 Relative clauses in every case: relationships, character, communication ---
- id: umgang
  lesson: de3-relative-all
  term: der Umgang
  pos: noun
  plural: —
  meanings: [dealing with (people or things), handling, contact, dealings]
  example: Der Umgang mit schwierigen Kunden ist nicht leicht.
  exampleEn: Dealing with difficult customers isn't easy.
  note: 'Usually with mit + dative: der Umgang mit Kritik.'
- id: umgehen
  lesson: de3-relative-all
  term: umgehen
  pos: verb
  meanings: [to deal with, to handle, to cope with]
  example: Sie kann gut mit Kritik umgehen.
  exampleEn: She can deal well with criticism.
  note: 'umgehen mit + dative. Separable: er geht damit um; ging um; ist umgegangen.'
- id: zuverlaessig
  lesson: de3-relative-all
  term: zuverlässig
  pos: adjective
  meanings: [reliable, dependable]
  example: Mein Kollege ist sehr zuverlässig.
  exampleEn: My colleague is very reliable.
- id: zuverlaessigkeit
  lesson: de3-relative-all
  term: die Zuverlässigkeit
  pos: noun
  plural: —
  meanings: [reliability, dependability]
  example: Für diese Arbeit ist Zuverlässigkeit wichtig.
  exampleEn: Reliability is important for this job.
- id: verstaendnis
  lesson: de3-relative-all
  term: das Verständnis
  pos: noun
  plural: —
  meanings: [understanding, sympathy]
  example: Ich habe Verständnis für deine Situation.
  exampleEn: I understand your situation.
- id: tolerant
  lesson: de3-relative-all
  term: tolerant
  pos: adjective
  meanings: [tolerant]
  example: Meine Großeltern sind sehr tolerant.
  exampleEn: My grandparents are very tolerant.
- id: toleranz
  lesson: de3-relative-all
  term: die Toleranz
  pos: noun
  plural: —
  meanings: [tolerance]
  example: In einer WG braucht man viel Toleranz.
  exampleEn: You need a lot of tolerance in a shared flat.
- id: geduld
  lesson: de3-relative-all
  term: die Geduld
  pos: noun
  plural: —
  meanings: [patience]
  example: Mit kleinen Kindern braucht man Geduld.
  exampleEn: You need patience with small children.
- id: geduldig
  lesson: de3-relative-all
  term: geduldig
  pos: adjective
  meanings: [patient (adjective), patient]
  example: Unsere Lehrerin ist immer geduldig.
  exampleEn: Our teacher is always patient.
- id: ungeduldig
  lesson: de3-relative-all
  term: ungeduldig
  pos: adjective
  meanings: [impatient]
  example: Warum bist du heute so ungeduldig?
  exampleEn: Why are you so impatient today?
- id: eifersuechtig
  lesson: de3-relative-all
  term: eifersüchtig
  pos: adjective
  meanings: [jealous]
  example: Er ist eifersüchtig auf ihren Kollegen.
  exampleEn: He's jealous of her colleague.
  note: eifersüchtig auf + accusative.
- id: eifersucht
  lesson: de3-relative-all
  term: die Eifersucht
  pos: noun
  plural: —
  meanings: [jealousy]
  example: Eifersucht macht eine Beziehung kaputt.
  exampleEn: Jealousy ruins a relationship.
- id: konflikt
  lesson: de3-relative-all
  term: der Konflikt
  pos: noun
  plural: die Konflikte
  meanings: [conflict]
  example: Im Team gab es einen Konflikt.
  exampleEn: There was a conflict in the team.
- id: loesen
  lesson: de3-relative-all
  term: lösen
  pos: verb
  meanings: [to solve, to resolve, to settle]
  example: Wir müssen das Problem zusammen lösen.
  exampleEn: We have to solve the problem together.
- id: kompromiss
  lesson: de3-relative-all
  term: der Kompromiss
  pos: noun
  plural: die Kompromisse
  meanings: [compromise]
  example: Am Ende haben wir einen Kompromiss gefunden.
  exampleEn: In the end we found a compromise.
- id: diskussion
  lesson: de3-relative-all
  term: die Diskussion
  pos: noun
  plural: die Diskussionen
  meanings: [discussion, debate]
  example: Nach dem Film gab es eine lange Diskussion.
  exampleEn: After the film there was a long discussion.
- id: diskutieren
  lesson: de3-relative-all
  term: diskutieren
  pos: verb
  meanings: [to discuss, to debate, to argue (discuss)]
  example: Wir haben lange über das Thema diskutiert.
  exampleEn: We discussed the topic for a long time.
  note: 'diskutieren über + accusative, or with a direct object: ein Problem diskutieren.'
- id: respekt
  lesson: de3-relative-all
  term: der Respekt
  pos: noun
  plural: —
  meanings: [respect]
  example: Ich habe großen Respekt vor ihr.
  exampleEn: I have great respect for her.
  note: Respekt vor + dative.
- id: respektieren
  lesson: de3-relative-all
  term: respektieren
  pos: verb
  meanings: [to respect]
  example: Ich respektiere deine Meinung.
  exampleEn: I respect your opinion.
- id: kritik
  lesson: de3-relative-all
  term: die Kritik
  pos: noun
  plural: die Kritiken
  meanings: [criticism, critique, review (of a book or film)]
  example: Er kann keine Kritik vertragen.
  exampleEn: He can't take criticism.
- id: kritisieren
  lesson: de3-relative-all
  term: kritisieren
  pos: verb
  meanings: [to criticize, to criticise]
  example: Sie kritisiert immer meine Arbeit.
  exampleEn: She always criticizes my work.
- id: lob
  lesson: de3-relative-all
  term: das Lob
  pos: noun
  plural: —
  meanings: [praise]
  example: Danke für das Lob!
  exampleEn: Thanks for the praise!
- id: loben
  lesson: de3-relative-all
  term: loben
  pos: verb
  meanings: [to praise]
  example: Die Chefin hat uns für das Projekt gelobt.
  exampleEn: The boss praised us for the project.
- id: sich-verhalten
  lesson: de3-relative-all
  term: sich verhalten
  pos: verb
  meanings: [to behave, to act]
  example: Er hat sich auf der Party komisch verhalten.
  exampleEn: He behaved strangely at the party.
  note: 'Strong: er verhält sich; verhielt sich; hat sich verhalten.'
- id: verhalten
  lesson: de3-relative-all
  term: das Verhalten
  pos: noun
  plural: —
  meanings: [behaviour, behavior, conduct]
  example: Sein Verhalten war nicht in Ordnung.
  exampleEn: His behaviour wasn't okay.
- id: persoenlichkeit
  lesson: de3-relative-all
  term: die Persönlichkeit
  pos: noun
  plural: die Persönlichkeiten
  meanings: [personality]
  example: Sie hat eine starke Persönlichkeit.
  exampleEn: She has a strong personality.
- id: offen
  lesson: de3-relative-all
  term: offen
  pos: adjective
  meanings: [open, open-minded, frank]
  example: Mein Bruder ist ein offener Mensch.
  exampleEn: My brother is an open person.
  note: 'Also "open" for doors and shops: Die Tür ist offen.'
- id: zurueckhaltend
  lesson: de3-relative-all
  term: zurückhaltend
  pos: adjective
  meanings: [reserved, restrained]
  example: Am Anfang war sie etwas zurückhaltend.
  exampleEn: At first she was a little reserved.
- id: grosszuegig
  lesson: de3-relative-all
  term: großzügig
  pos: adjective
  meanings: [generous]
  example: Meine Tante ist sehr großzügig.
  exampleEn: My aunt is very generous.
- id: egoistisch
  lesson: de3-relative-all
  term: egoistisch
  pos: adjective
  meanings: [selfish, egoistic, egotistical]
  example: Das war wirklich egoistisch von dir.
  exampleEn: That was really selfish of you.
- id: ehrlichkeit
  lesson: de3-relative-all
  term: die Ehrlichkeit
  pos: noun
  plural: —
  meanings: [honesty]
  example: In einer Freundschaft ist Ehrlichkeit wichtig.
  exampleEn: Honesty is important in a friendship.
- id: kommunikation
  lesson: de3-relative-all
  term: die Kommunikation
  pos: noun
  plural: —
  meanings: [communication]
  example: Gute Kommunikation hilft gegen Konflikte.
  exampleEn: Good communication helps prevent conflicts.
- id: sich-trennen
  lesson: de3-relative-all
  term: sich trennen
  pos: verb
  meanings: [to split up, to separate, to break up]
  example: Sie haben sich nach zehn Jahren getrennt.
  exampleEn: They split up after ten years.
  note: 'sich trennen von + dative. Without sich, trennen means to separate (things): Müll trennen.'
- id: trennung
  lesson: de3-relative-all
  term: die Trennung
  pos: noun
  plural: die Trennungen
  meanings: [separation, break-up, split]
  example: Nach der Trennung ist er umgezogen.
  exampleEn: After the break-up he moved house.

# --- 12 wo, was, wer as relatives: cities, culture, sights ---
- id: kultur
  lesson: de3-relative-wo-was
  term: die Kultur
  pos: noun
  plural: die Kulturen
  meanings: [culture]
  example: Ich interessiere mich für die Kultur anderer Länder.
  exampleEn: I'm interested in the culture of other countries.
- id: kulturell
  lesson: de3-relative-wo-was
  term: kulturell
  pos: adjective
  meanings: [cultural, culturally]
  example: Die Stadt hat ein großes kulturelles Angebot.
  exampleEn: The town has a wide range of cultural events.
- id: ausstellung
  lesson: de3-relative-wo-was
  term: die Ausstellung
  pos: noun
  plural: die Ausstellungen
  meanings: [exhibition, show]
  example: Die Ausstellung ist bis Ende Mai geöffnet.
  exampleEn: The exhibition is open until the end of May.
- id: ausstellen
  lesson: de3-relative-wo-was
  term: ausstellen
  pos: verb
  meanings: [to exhibit, to display, to issue (a document)]
  example: Das Museum stellt Fotos aus den Fünfzigerjahren aus.
  exampleEn: The museum is exhibiting photos from the fifties.
  note: 'Separable: stellt aus; hat ausgestellt. Also to issue: einen Ausweis ausstellen.'
- id: denkmal
  lesson: de3-relative-wo-was
  term: das Denkmal
  pos: noun
  plural: die Denkmäler
  meanings: [monument, memorial]
  example: Vor dem Rathaus steht ein Denkmal.
  exampleEn: There's a monument in front of the town hall.
- id: schloss
  lesson: de3-relative-wo-was
  term: das Schloss
  pos: noun
  plural: die Schlösser
  meanings: [palace, castle (palace), lock]
  example: Im Sommer gibt es Konzerte im Schloss.
  exampleEn: In summer there are concerts in the palace.
  note: 'A palace or stately home; die Burg is a fortified castle. das Schloss also means a lock.'
- id: burg
  lesson: de3-relative-wo-was
  term: die Burg
  pos: noun
  plural: die Burgen
  meanings: [castle, fortress]
  example: Die Burg liegt hoch über dem Fluss.
  exampleEn: The castle stands high above the river.
- id: dom
  lesson: de3-relative-wo-was
  term: der Dom
  pos: noun
  plural: die Dome
  meanings: [cathedral]
  example: Der Dom ist das höchste Gebäude der Stadt.
  exampleEn: The cathedral is the tallest building in the town.
- id: rathaus
  lesson: de3-relative-wo-was
  term: das Rathaus
  pos: noun
  plural: die Rathäuser
  meanings: [town hall, city hall]
  example: Das Rathaus steht am Marktplatz.
  exampleEn: The town hall is on the market square.
- id: altstadt
  lesson: de3-relative-wo-was
  term: die Altstadt
  pos: noun
  plural: die Altstädte
  meanings: [old town, historic centre]
  example: Die Altstadt ist am Abend sehr schön.
  exampleEn: The old town is very beautiful in the evening.
- id: stadtteil
  lesson: de3-relative-wo-was
  term: der Stadtteil
  pos: noun
  plural: die Stadtteile
  meanings: [district (of a city), part of town, neighbourhood]
  example: In welchem Stadtteil wohnst du?
  exampleEn: Which part of town do you live in?
- id: fussgaengerzone
  lesson: de3-relative-wo-was
  term: die Fußgängerzone
  pos: noun
  plural: die Fußgängerzonen
  meanings: [pedestrian zone, pedestrian precinct]
  example: In der Fußgängerzone gibt es viele Geschäfte.
  exampleEn: There are lots of shops in the pedestrian zone.
- id: veranstaltung
  lesson: de3-relative-wo-was
  term: die Veranstaltung
  pos: noun
  plural: die Veranstaltungen
  meanings: [event (organized), event, function]
  example: Die Veranstaltung beginnt um 19 Uhr.
  exampleEn: The event starts at 7 p.m.
- id: veranstalten
  lesson: de3-relative-wo-was
  term: veranstalten
  pos: verb
  meanings: [to organize (an event), to organise, to hold, to stage]
  example: Die Schule veranstaltet ein Sommerfest.
  exampleEn: The school is holding a summer party.
  note: 'Inseparable: hat veranstaltet.'
- id: festival
  lesson: de3-relative-wo-was
  term: das Festival
  pos: noun
  plural: die Festivals
  meanings: [festival]
  example: Im August fahren wir auf ein Festival.
  exampleEn: In August we're going to a festival.
- id: kuenstler
  lesson: de3-relative-wo-was
  term: der Künstler
  pos: noun
  plural: die Künstler
  meanings: [artist (male), artist]
  example: Der Künstler malt seit vierzig Jahren.
  exampleEn: The artist has been painting for forty years.
- id: kuenstlerin
  lesson: de3-relative-wo-was
  term: die Künstlerin
  pos: noun
  plural: die Künstlerinnen
  meanings: [artist (female), artist]
  example: Die Künstlerin stellt ihre Bilder in Wien aus.
  exampleEn: The artist is exhibiting her pictures in Vienna.
- id: gemaelde
  lesson: de3-relative-wo-was
  term: das Gemälde
  pos: noun
  plural: die Gemälde
  meanings: [painting]
  example: Das Gemälde ist über 300 Jahre alt.
  exampleEn: The painting is over 300 years old.
- id: skulptur
  lesson: de3-relative-wo-was
  term: die Skulptur
  pos: noun
  plural: die Skulpturen
  meanings: [sculpture]
  example: Im Park stehen moderne Skulpturen.
  exampleEn: There are modern sculptures in the park.
- id: buehne
  lesson: de3-relative-wo-was
  term: die Bühne
  pos: noun
  plural: die Bühnen
  meanings: [stage]
  example: Die Band steht schon auf der Bühne.
  exampleEn: The band is already on stage.
- id: publikum
  lesson: de3-relative-wo-was
  term: das Publikum
  pos: noun
  plural: —
  meanings: [audience, public, spectators]
  example: Das Publikum hat lange geklatscht.
  exampleEn: The audience clapped for a long time.
- id: eintritt
  lesson: de3-relative-wo-was
  term: der Eintritt
  pos: noun
  plural: die Eintritte
  meanings: [admission (to an event), admission, entrance fee, entry]
  example: Der Eintritt ist für Kinder frei.
  exampleEn: Admission is free for children.
- id: fuehrung
  lesson: de3-relative-wo-was
  term: die Führung
  pos: noun
  plural: die Führungen
  meanings: [guided tour, tour, leadership]
  example: Die Führung durch das Schloss dauert eine Stunde.
  exampleEn: The guided tour of the palace takes an hour.
- id: galerie
  lesson: de3-relative-wo-was
  term: die Galerie
  pos: noun
  plural: die Galerien
  meanings: [gallery]
  example: Die Galerie zeigt junge Fotografen.
  exampleEn: The gallery shows young photographers.
- id: oper
  lesson: de3-relative-wo-was
  term: die Oper
  pos: noun
  plural: die Opern
  meanings: [opera, opera house]
  example: Wir gehen heute Abend in die Oper.
  exampleEn: We're going to the opera tonight.
- id: orchester
  lesson: de3-relative-wo-was
  term: das Orchester
  pos: noun
  plural: die Orchester
  meanings: [orchestra]
  example: Meine Schwester spielt in einem Orchester.
  exampleEn: My sister plays in an orchestra.
- id: turm
  lesson: de3-relative-wo-was
  term: der Turm
  pos: noun
  plural: die Türme
  meanings: [tower]
  example: Vom Turm sieht man die ganze Stadt.
  exampleEn: You can see the whole town from the tower.
- id: brunnen
  lesson: de3-relative-wo-was
  term: der Brunnen
  pos: noun
  plural: die Brunnen
  meanings: [fountain, well]
  example: Wir treffen uns am Brunnen.
  exampleEn: Let's meet at the fountain.
- id: marktplatz
  lesson: de3-relative-wo-was
  term: der Marktplatz
  pos: noun
  plural: die Marktplätze
  meanings: [market square, marketplace]
  example: Am Samstag ist auf dem Marktplatz Markt.
  exampleEn: On Saturday there's a market on the market square.
- id: gebaeude
  lesson: de3-relative-wo-was
  term: das Gebäude
  pos: noun
  plural: die Gebäude
  meanings: [building]
  example: Das Gebäude wurde 1910 gebaut.
  exampleEn: The building was built in 1910.
- id: kunstwerk
  lesson: de3-relative-wo-was
  term: das Kunstwerk
  pos: noun
  plural: die Kunstwerke
  meanings: [work of art, artwork]
  example: Das Museum hat über tausend Kunstwerke.
  exampleEn: The museum has over a thousand works of art.
- id: architektur
  lesson: de3-relative-wo-was
  term: die Architektur
  pos: noun
  plural: —
  meanings: [architecture]
  example: Mir gefällt die moderne Architektur in Rotterdam.
  exampleEn: I like the modern architecture in Rotterdam.
- id: sehenswert
  lesson: de3-relative-wo-was
  term: sehenswert
  pos: adjective
  meanings: [worth seeing]
  example: Die Ausstellung ist wirklich sehenswert.
  exampleEn: The exhibition is really worth seeing.
- id: eintrittskarte
  lesson: de3-relative-wo-was
  term: die Eintrittskarte
  pos: noun
  plural: die Eintrittskarten
  meanings: [(admission) ticket, entrance ticket, ticket (for an event)]
  example: Die Eintrittskarten kann man online kaufen.
  exampleEn: You can buy the tickets online.

# --- 13 The genitive: family history, inheritance, documents ---
- id: vorfahr
  lesson: de3-genitive
  term: der Vorfahr
  pos: noun
  plural: die Vorfahren
  alt: [der Vorfahre]
  meanings: [ancestor, forefather]
  example: Meine Vorfahren kamen aus Polen.
  exampleEn: My ancestors came from Poland.
  note: 'n-noun: des Vorfahren, dem Vorfahren.'
- id: nachkomme
  lesson: de3-genitive
  term: der Nachkomme
  pos: noun
  plural: die Nachkommen
  meanings: [descendant]
  example: Er hat viele Nachkommen.
  exampleEn: He has many descendants.
  note: 'n-noun: des Nachkommen.'
- id: abstammung
  lesson: de3-genitive
  term: die Abstammung
  pos: noun
  plural: —
  meanings: [descent, ancestry, origin (family)]
  example: Sie ist italienischer Abstammung.
  exampleEn: She is of Italian descent.
- id: ursprung
  lesson: de3-genitive
  term: der Ursprung
  pos: noun
  plural: die Ursprünge
  meanings: [origin (starting point), origin, source]
  example: Der Ursprung des Namens ist unbekannt.
  exampleEn: The origin of the name is unknown.
- id: urspruenglich
  lesson: de3-genitive
  term: ursprünglich
  pos: adjective
  meanings: [originally, original]
  example: Das Haus war ursprünglich eine Schule.
  exampleEn: The house was originally a school.
- id: urgrossvater
  lesson: de3-genitive
  term: der Urgroßvater
  pos: noun
  plural: die Urgroßväter
  meanings: [great-grandfather]
  example: Mein Urgroßvater war Bäcker.
  exampleEn: My great-grandfather was a baker.
- id: urgrossmutter
  lesson: de3-genitive
  term: die Urgroßmutter
  pos: noun
  plural: die Urgroßmütter
  meanings: [great-grandmother]
  example: Das ist ein Foto meiner Urgroßmutter.
  exampleEn: This is a photo of my great-grandmother.
- id: stammbaum
  lesson: de3-genitive
  term: der Stammbaum
  pos: noun
  plural: die Stammbäume
  meanings: [family tree, pedigree]
  example: Wir haben einen Stammbaum unserer Familie gemacht.
  exampleEn: We made a family tree of our family.
- id: verwandtschaft
  lesson: de3-genitive
  term: die Verwandtschaft
  pos: noun
  plural: die Verwandtschaften
  meanings: [relatives (as a whole), relations, kinship]
  example: Zur Hochzeit kam die ganze Verwandtschaft.
  exampleEn: All the relatives came to the wedding.
- id: urkunde
  lesson: de3-genitive
  term: die Urkunde
  pos: noun
  plural: die Urkunden
  meanings: [certificate, official document, deed]
  example: Für den Antrag brauchen Sie die Urkunde im Original.
  exampleEn: For the application you need the original certificate.
- id: geburtsurkunde
  lesson: de3-genitive
  term: die Geburtsurkunde
  pos: noun
  plural: die Geburtsurkunden
  meanings: [birth certificate]
  example: Ich habe meine Geburtsurkunde nicht gefunden.
  exampleEn: I couldn't find my birth certificate.
- id: dokument
  lesson: de3-genitive
  term: das Dokument
  pos: noun
  plural: die Dokumente
  meanings: [document]
  example: Bitte bringen Sie alle Dokumente mit.
  exampleEn: Please bring all the documents with you.
- id: archiv
  lesson: de3-genitive
  term: das Archiv
  pos: noun
  plural: die Archive
  meanings: [archive, archives, records office]
  example: Die alten Briefe liegen im Archiv der Stadt.
  exampleEn: The old letters are in the town archive.
- id: erben
  lesson: de3-genitive
  term: erben
  pos: verb
  meanings: [to inherit]
  example: Sie hat das Haus ihrer Tante geerbt.
  exampleEn: She inherited her aunt's house.
- id: vererben
  lesson: de3-genitive
  term: vererben
  pos: verb
  meanings: [to leave (in a will), to bequeath, to pass on, to hand down]
  example: Er hat seinem Sohn die Uhr vererbt.
  exampleEn: He left the watch to his son.
- id: erbe-inheritance
  lesson: de3-genitive
  term: das Erbe
  pos: noun
  plural: —
  meanings: [inheritance, heritage, legacy]
  example: Das Erbe wird unter den Kindern geteilt.
  exampleEn: The inheritance is divided among the children.
  note: 'der Erbe (masculine) is the heir.'
- id: erbe-heir
  lesson: de3-genitive
  term: der Erbe
  pos: noun
  plural: die Erben
  meanings: [heir (male), heir]
  example: Er ist der einzige Erbe.
  exampleEn: He is the only heir.
  note: 'n-noun: des Erben. das Erbe (neuter) is the inheritance.'
- id: erbin
  lesson: de3-genitive
  term: die Erbin
  pos: noun
  plural: die Erbinnen
  meanings: [heir (female), heiress, heir]
  example: Die Tochter ist die einzige Erbin.
  exampleEn: The daughter is the only heir.
- id: erbstueck
  lesson: de3-genitive
  term: das Erbstück
  pos: noun
  plural: die Erbstücke
  meanings: [heirloom]
  example: Der Ring ist ein Erbstück meiner Großmutter.
  exampleEn: The ring is an heirloom from my grandmother.
- id: testament
  lesson: de3-genitive
  term: das Testament
  pos: noun
  plural: die Testamente
  meanings: [will (document), testament, last will]
  example: Er hat kein Testament gemacht.
  exampleEn: He didn't make a will.
- id: nachlass
  lesson: de3-genitive
  term: der Nachlass
  pos: noun
  plural: die Nachlässe
  meanings: [estate (of a dead person), legacy, everything left behind]
  example: Im Nachlass des Malers fand man viele Briefe.
  exampleEn: Many letters were found among the painter's papers.
- id: eigentum
  lesson: de3-genitive
  term: das Eigentum
  pos: noun
  plural: —
  meanings: [property, ownership, possessions]
  example: Das Auto ist mein Eigentum.
  exampleEn: The car is my property.
- id: besitzer
  lesson: de3-genitive
  term: der Besitzer
  pos: noun
  plural: die Besitzer
  meanings: [possessor (male), owner, possessor]
  example: Der Besitzer des Hundes wohnt nebenan.
  exampleEn: The dog's owner lives next door.
- id: besitzerin
  lesson: de3-genitive
  term: die Besitzerin
  pos: noun
  plural: die Besitzerinnen
  meanings: [possessor (female), owner, possessor]
  example: Die Besitzerin des Cafés ist sehr freundlich.
  exampleEn: The owner of the café is very friendly.
- id: andenken
  lesson: de3-genitive
  term: das Andenken
  pos: noun
  plural: die Andenken
  meanings: [keepsake, memento, souvenir]
  example: Ich habe die Tasse als Andenken behalten.
  exampleEn: I kept the cup as a keepsake.
- id: fotoalbum
  lesson: de3-genitive
  term: das Fotoalbum
  pos: noun
  plural: die Fotoalben
  meanings: [photo album]
  example: Oma zeigt uns gern ihr altes Fotoalbum.
  exampleEn: Grandma likes showing us her old photo album.
- id: tagebuch
  lesson: de3-genitive
  term: das Tagebuch
  pos: noun
  plural: die Tagebücher
  meanings: [diary, journal]
  example: Als Kind habe ich Tagebuch geschrieben.
  exampleEn: I kept a diary as a child.
- id: aufbewahren
  lesson: de3-genitive
  term: aufbewahren
  pos: verb
  meanings: [to keep, to store, to look after (things)]
  example: Sie bewahrt alle Briefe in einer Kiste auf.
  exampleEn: She keeps all the letters in a box.
  note: 'Separable: bewahrt auf; hat aufbewahrt.'
- id: dachboden
  lesson: de3-genitive
  term: der Dachboden
  pos: noun
  plural: die Dachböden
  meanings: [attic, loft]
  example: Die alten Möbel stehen auf dem Dachboden.
  exampleEn: The old furniture is in the attic.
- id: ueberliefern
  lesson: de3-genitive
  term: überliefern
  pos: verb
  meanings: [to hand down, to pass down (traditions, stories)]
  example: Das Rezept wurde von Generation zu Generation überliefert.
  exampleEn: The recipe was handed down from generation to generation.
  note: 'Inseparable: hat überliefert.'
- id: original
  lesson: de3-genitive
  term: das Original
  pos: noun
  plural: die Originale
  meanings: [original (noun), the original]
  example: Das Original hängt im Museum, das hier ist eine Kopie.
  exampleEn: The original is in the museum; this is a copy.
- id: wert
  lesson: de3-genitive
  term: der Wert
  pos: noun
  plural: die Werte
  meanings: [value, worth]
  example: Der Wert des Rings ist nicht hoch.
  exampleEn: The value of the ring isn't high.
- id: wertvoll
  lesson: de3-genitive
  term: wertvoll
  pos: adjective
  meanings: [valuable, precious]
  example: Für mich ist dieses Foto sehr wertvoll.
  exampleEn: This photo is very valuable to me.

# --- 14 Genitive prepositions: travel problems and disruptions ---
- id: wegen
  lesson: de3-genitive-preps
  term: wegen
  pos: preposition
  meanings: [because of, due to, on account of]
  example: Wegen des Regens bleiben wir zu Hause.
  exampleEn: Because of the rain we're staying at home.
  note: '+ genitive (in speech often dative: wegen dem Regen).'
- id: trotz
  lesson: de3-genitive-preps
  term: trotz
  pos: preposition
  meanings: [despite, in spite of]
  example: Trotz des Staus sind wir pünktlich angekommen.
  exampleEn: Despite the traffic jam we arrived on time.
  note: '+ genitive (in speech often dative).'
- id: waehrend-prep
  lesson: de3-genitive-preps
  term: während
  pos: preposition
  meanings: [during]
  example: Während der Fahrt habe ich geschlafen.
  exampleEn: I slept during the journey.
  note: '+ genitive. Also a conjunction meaning "while".'
- id: statt
  lesson: de3-genitive-preps
  term: statt
  pos: preposition
  alt: [anstatt]
  meanings: [instead of (+ genitive), instead of]
  example: Statt eines Briefes schreibe ich eine E-Mail.
  exampleEn: Instead of a letter I'm writing an e-mail.
  note: '+ genitive; anstatt means the same.'
- id: innerhalb
  lesson: de3-genitive-preps
  term: innerhalb
  pos: preposition
  meanings: [within, inside]
  example: Bitte antworten Sie innerhalb einer Woche.
  exampleEn: Please reply within a week.
  note: '+ genitive; with a number: innerhalb von zwei Tagen.'
- id: ausserhalb
  lesson: de3-genitive-preps
  term: außerhalb
  pos: preposition
  meanings: [outside (+ genitive), outside, outside of]
  example: Wir wohnen außerhalb der Stadt.
  exampleEn: We live outside the town.
  note: '+ genitive.'
- id: meinetwegen
  lesson: de3-genitive-preps
  term: meinetwegen
  pos: adverb
  meanings: [because of me, for my sake, fine by me, I don't mind]
  example: Meinetwegen können wir auch später gehen.
  exampleEn: I don't mind if we go later.
- id: streik
  lesson: de3-genitive-preps
  term: der Streik
  pos: noun
  plural: die Streiks
  meanings: [strike (by workers), strike]
  example: Wegen des Streiks fahren keine Busse.
  exampleEn: Because of the strike no buses are running.
- id: streiken
  lesson: de3-genitive-preps
  term: streiken
  pos: verb
  meanings: [to strike, to go on strike, to be on strike]
  example: Die Piloten streiken seit Montag.
  exampleEn: The pilots have been on strike since Monday.
- id: ausfall
  lesson: de3-genitive-preps
  term: der Ausfall
  pos: noun
  plural: die Ausfälle
  meanings: [cancellation (of a train, class…), failure, breakdown (of a system)]
  example: Es gibt viele Ausfälle wegen des Sturms.
  exampleEn: There are many cancellations because of the storm.
- id: ausfallen
  lesson: de3-genitive-preps
  term: ausfallen
  pos: verb
  meanings: [to be cancelled, to be canceled, to fail (of a machine)]
  example: Der Zug um acht fällt heute aus.
  exampleEn: The eight o'clock train is cancelled today.
  note: 'Separable and strong: fällt aus; fiel aus; ist ausgefallen.'
- id: verzoegerung
  lesson: de3-genitive-preps
  term: die Verzögerung
  pos: noun
  plural: die Verzögerungen
  meanings: [delay (hold-up), delay, hold-up]
  example: Es kommt zu Verzögerungen im Bahnverkehr.
  exampleEn: There are delays to rail services.
- id: sich-verzoegern
  lesson: de3-genitive-preps
  term: sich verzögern
  pos: verb
  meanings: [to be delayed]
  example: Die Abfahrt verzögert sich um zehn Minuten.
  exampleEn: Departure is delayed by ten minutes.
- id: stau
  lesson: de3-genitive-preps
  term: der Stau
  pos: noun
  plural: die Staus
  meanings: [traffic jam, tailback]
  example: Wir standen zwei Stunden im Stau.
  exampleEn: We were stuck in a traffic jam for two hours.
- id: baustelle
  lesson: de3-genitive-preps
  term: die Baustelle
  pos: noun
  plural: die Baustellen
  meanings: [roadworks, building site, construction site]
  example: Auf der Autobahn gibt es eine Baustelle.
  exampleEn: There are roadworks on the motorway.
- id: umleitung
  lesson: de3-genitive-preps
  term: die Umleitung
  pos: noun
  plural: die Umleitungen
  meanings: [diversion, detour]
  example: Wegen der Baustelle gibt es eine Umleitung.
  exampleEn: There's a diversion because of the roadworks.
- id: unwetter
  lesson: de3-genitive-preps
  term: das Unwetter
  pos: noun
  plural: die Unwetter
  meanings: [severe weather, storm (severe weather)]
  example: Nach dem Unwetter waren viele Straßen gesperrt.
  exampleEn: After the storm many roads were closed.
- id: panne
  lesson: de3-genitive-preps
  term: die Panne
  pos: noun
  plural: die Pannen
  meanings: [breakdown (of a vehicle), mishap, glitch]
  example: Wir hatten auf der Autobahn eine Panne.
  exampleEn: We broke down on the motorway.
- id: sperren
  lesson: de3-genitive-preps
  term: sperren
  pos: verb
  meanings: [to close (a road), to block, to block (a card)]
  example: Die Polizei hat die Brücke gesperrt.
  exampleEn: The police closed the bridge.
- id: gesperrt
  lesson: de3-genitive-preps
  term: gesperrt
  pos: adjective
  meanings: [closed (road, route), blocked]
  example: Die Straße ist bis Freitag gesperrt.
  exampleEn: The road is closed until Friday.
- id: ersatzverkehr
  lesson: de3-genitive-preps
  term: der Ersatzverkehr
  pos: noun
  plural: —
  alt: [der Schienenersatzverkehr]
  meanings: [replacement service, rail replacement (bus) service]
  example: Zwischen Kassel und Fulda gibt es Ersatzverkehr mit Bussen.
  exampleEn: There's a rail replacement bus service between Kassel and Fulda.
- id: anschluss
  lesson: de3-genitive-preps
  term: der Anschluss
  pos: noun
  plural: die Anschlüsse
  meanings: [connection (train or flight), connecting train]
  example: Ich habe meinen Anschluss in Köln verpasst.
  exampleEn: I missed my connection in Cologne.
- id: verbindung
  lesson: de3-genitive-preps
  term: die Verbindung
  pos: noun
  plural: die Verbindungen
  meanings: [connection (route), route, link]
  example: Gibt es eine direkte Verbindung nach Wien?
  exampleEn: Is there a direct connection to Vienna?
- id: bahnsteig
  lesson: de3-genitive-preps
  term: der Bahnsteig
  pos: noun
  plural: die Bahnsteige
  meanings: [platform (railway), platform]
  example: Ich warte auf dem Bahnsteig.
  exampleEn: I'm waiting on the platform.
- id: strecke
  lesson: de3-genitive-preps
  term: die Strecke
  pos: noun
  plural: die Strecken
  meanings: [route, line (rail), stretch, distance]
  example: Die Strecke zwischen Bonn und Koblenz ist gesperrt.
  exampleEn: The line between Bonn and Koblenz is closed.
- id: fahrgast
  lesson: de3-genitive-preps
  term: der Fahrgast
  pos: noun
  plural: die Fahrgäste
  meanings: [passenger]
  example: Alle Fahrgäste müssen hier aussteigen.
  exampleEn: All passengers must get off here.
- id: wartezeit
  lesson: de3-genitive-preps
  term: die Wartezeit
  pos: noun
  plural: die Wartezeiten
  meanings: [waiting time, wait]
  example: Die Wartezeit beträgt etwa 20 Minuten.
  exampleEn: The waiting time is about 20 minutes.
- id: verpassen
  lesson: de3-genitive-preps
  term: verpassen
  pos: verb
  meanings: [to miss (a train, chance), to miss]
  example: Beeil dich, sonst verpassen wir den Bus!
  exampleEn: Hurry up, or we'll miss the bus!
  note: 'Inseparable: hat verpasst.'
- id: umbuchen
  lesson: de3-genitive-preps
  term: umbuchen
  pos: verb
  meanings: [to rebook, to change a booking]
  example: Ich möchte meinen Flug auf Montag umbuchen.
  exampleEn: I'd like to change my flight to Monday.
  note: 'Separable: bucht um; hat umgebucht.'
- id: stornieren
  lesson: de3-genitive-preps
  term: stornieren
  pos: verb
  meanings: [to cancel (a booking or order)]
  example: Ich habe die Reise storniert.
  exampleEn: I cancelled the trip.
- id: entschaedigung
  lesson: de3-genitive-preps
  term: die Entschädigung
  pos: noun
  plural: die Entschädigungen
  meanings: [compensation]
  example: Für die Verspätung bekommen Sie eine Entschädigung.
  exampleEn: You'll get compensation for the delay.
- id: erstattung
  lesson: de3-genitive-preps
  term: die Erstattung
  pos: noun
  plural: die Erstattungen
  meanings: [refund, reimbursement]
  example: Die Erstattung dauert etwa zwei Wochen.
  exampleEn: The refund takes about two weeks.
- id: erstatten
  lesson: de3-genitive-preps
  term: erstatten
  pos: verb
  meanings: [to refund, to reimburse]
  example: Die Firma erstattet Ihnen die Kosten.
  exampleEn: The company will refund your costs.

# --- 15 Participles and adjectives without articles: advertising, products, quality ---
- id: produkt
  lesson: de3-participles
  term: das Produkt
  pos: noun
  plural: die Produkte
  meanings: [product]
  example: Dieses Produkt gibt es nur online.
  exampleEn: This product is only available online.
- id: ware
  lesson: de3-participles
  term: die Ware
  pos: noun
  plural: die Waren
  meanings: [goods, merchandise, product (for sale)]
  example: Die Ware kommt morgen an.
  exampleEn: The goods arrive tomorrow.
- id: herstellen
  lesson: de3-participles
  term: herstellen
  pos: verb
  meanings: [to manufacture, to make, to produce]
  example: Die Firma stellt Möbel aus Holz her.
  exampleEn: The company makes wooden furniture.
  note: 'Separable: stellt her; hat hergestellt.'
- id: hersteller
  lesson: de3-participles
  term: der Hersteller
  pos: noun
  plural: die Hersteller
  meanings: [manufacturer, maker, producer]
  example: Der Hersteller gibt zwei Jahre Garantie.
  exampleEn: The manufacturer gives a two-year guarantee.
- id: herstellung
  lesson: de3-participles
  term: die Herstellung
  pos: noun
  plural: —
  meanings: [manufacture, manufacturing, making (of a product)]
  example: Die Herstellung dauert drei Tage.
  exampleEn: Making it takes three days.
- id: hochwertig
  lesson: de3-participles
  term: hochwertig
  pos: adjective
  meanings: [high-quality, of high quality]
  example: Die Jacke ist aus hochwertigem Material.
  exampleEn: The jacket is made of high-quality material.
- id: praktisch
  lesson: de3-participles
  term: praktisch
  pos: adjective
  meanings: [practical, handy, useful]
  example: Die Tasche ist klein, aber sehr praktisch.
  exampleEn: The bag is small but very practical.
- id: umweltfreundlich
  lesson: de3-participles
  term: umweltfreundlich
  pos: adjective
  meanings: [environmentally friendly, eco-friendly, green]
  example: Die Verpackung ist umweltfreundlich.
  exampleEn: The packaging is environmentally friendly.
- id: empfehlenswert
  lesson: de3-participles
  term: empfehlenswert
  pos: adjective
  meanings: [recommendable, recommended, worth recommending]
  example: Das Restaurant ist sehr empfehlenswert.
  exampleEn: The restaurant is highly recommended.
- id: sonderangebot
  lesson: de3-participles
  term: das Sonderangebot
  pos: noun
  plural: die Sonderangebote
  meanings: [special offer (reduced price), special offer]
  example: Die Kaffeemaschine ist diese Woche im Sonderangebot.
  exampleEn: The coffee machine is on special offer this week.
- id: aktion
  lesson: de3-participles
  term: die Aktion
  pos: noun
  plural: die Aktionen
  meanings: [promotion (special offer), campaign, initiative]
  example: Bei dieser Aktion bekommen Sie zwei Produkte zum Preis von einem.
  exampleEn: In this promotion you get two products for the price of one.
- id: begrenzt
  lesson: de3-participles
  term: begrenzt
  pos: adjective
  meanings: [limited, restricted]
  example: Die Zahl der Plätze ist begrenzt.
  exampleEn: The number of places is limited.
- id: kostenlos
  lesson: de3-participles
  term: kostenlos
  pos: adjective
  meanings: [free of charge, free (no cost), at no cost]
  example: Die Lieferung ist kostenlos.
  exampleEn: Delivery is free of charge.
- id: gratis
  lesson: de3-participles
  term: gratis
  pos: adverb
  meanings: [for free, free, gratis]
  example: Zu jeder Bestellung gibt es eine Tasche gratis.
  exampleEn: You get a free bag with every order.
- id: kauf
  lesson: de3-participles
  term: der Kauf
  pos: noun
  plural: die Käufe
  meanings: [purchase, buying]
  example: Vor dem Kauf lese ich die Bewertungen.
  exampleEn: Before buying I read the reviews.
- id: kaeufer
  lesson: de3-participles
  term: der Käufer
  pos: noun
  plural: die Käufer
  meanings: [buyer (male), buyer, purchaser]
  example: Für das alte Auto gibt es schon einen Käufer.
  exampleEn: There's already a buyer for the old car.
- id: kaeuferin
  lesson: de3-participles
  term: die Käuferin
  pos: noun
  plural: die Käuferinnen
  meanings: [buyer (female), buyer]
  example: Die Käuferin war mit dem Produkt zufrieden.
  exampleEn: The buyer was happy with the product.
- id: auswahl
  lesson: de3-participles
  term: die Auswahl
  pos: noun
  plural: —
  meanings: [choice, selection, range]
  example: Der Laden hat eine große Auswahl an Tee.
  exampleEn: The shop has a large selection of tea.
- id: auswaehlen
  lesson: de3-participles
  term: auswählen
  pos: verb
  meanings: [to choose, to select, to pick]
  example: Bitte wählen Sie eine Farbe aus.
  exampleEn: Please choose a colour.
  note: 'Separable: wählt aus; hat ausgewählt.'
- id: bestellung
  lesson: de3-participles
  term: die Bestellung
  pos: noun
  plural: die Bestellungen
  meanings: [order (something ordered), order]
  example: Ihre Bestellung ist unterwegs.
  exampleEn: Your order is on its way.
- id: liefern
  lesson: de3-participles
  term: liefern
  pos: verb
  meanings: [to deliver, to supply]
  example: Wir liefern innerhalb von drei Tagen.
  exampleEn: We deliver within three days.
- id: lieferung
  lesson: de3-participles
  term: die Lieferung
  pos: noun
  plural: die Lieferungen
  meanings: [delivery]
  example: Die Lieferung kam einen Tag zu spät.
  exampleEn: The delivery came a day late.
- id: lieferzeit
  lesson: de3-participles
  term: die Lieferzeit
  pos: noun
  plural: die Lieferzeiten
  meanings: [delivery time]
  example: Die Lieferzeit beträgt zwei bis drei Tage.
  exampleEn: The delivery time is two to three days.
- id: versand
  lesson: de3-participles
  term: der Versand
  pos: noun
  plural: —
  meanings: [shipping, dispatch, sending]
  example: Der Versand nach Österreich dauert länger.
  exampleEn: Shipping to Austria takes longer.
- id: versandkosten
  lesson: de3-participles
  term: die Versandkosten
  pos: noun
  plural: die Versandkosten (plural only)
  meanings: [shipping costs, postage, delivery charges]
  example: Ab 50 Euro gibt es keine Versandkosten.
  exampleEn: There are no shipping costs on orders over 50 euros.
- id: lager
  lesson: de3-participles
  term: das Lager
  pos: noun
  plural: die Lager
  meanings: [warehouse, stock, storeroom, camp]
  example: Der Artikel ist leider nicht auf Lager.
  exampleEn: Unfortunately the item is out of stock.
- id: vorraetig
  lesson: de3-participles
  term: vorrätig
  pos: adjective
  meanings: [in stock, available]
  example: Die Schuhe sind in Größe 42 nicht vorrätig.
  exampleEn: The shoes aren't in stock in size 42.
- id: ruecksendung
  lesson: de3-participles
  term: die Rücksendung
  pos: noun
  plural: die Rücksendungen
  meanings: [return (of goods), return]
  example: Die Rücksendung ist kostenlos.
  exampleEn: Returns are free.
- id: zurueckschicken
  lesson: de3-participles
  term: zurückschicken
  pos: verb
  meanings: [to send back, to return (by post)]
  example: Die Hose war zu klein, also habe ich sie zurückgeschickt.
  exampleEn: The trousers were too small, so I sent them back.
  note: 'Separable: schickt zurück; hat zurückgeschickt.'
- id: bewertung
  lesson: de3-participles
  term: die Bewertung
  pos: noun
  plural: die Bewertungen
  meanings: [review (rating), rating, evaluation, assessment]
  example: Das Hotel hat sehr gute Bewertungen.
  exampleEn: The hotel has very good reviews.
- id: bewerten
  lesson: de3-participles
  term: bewerten
  pos: verb
  meanings: [to rate, to review, to assess, to evaluate]
  example: Bitte bewerten Sie unseren Service.
  exampleEn: Please rate our service.
- id: mehrere
  lesson: de3-participles
  term: mehrere
  pos: pronoun
  meanings: [several]
  example: Ich habe mehrere Shops verglichen.
  exampleEn: I compared several shops.
  note: Adjectives after it take strong endings (mehrere neue Produkte).
- id: wenige
  lesson: de3-participles
  term: wenige
  pos: pronoun
  meanings: [few, a few (only)]
  example: Nur wenige Kunden haben sich beschwert.
  exampleEn: Only a few customers complained.
  note: 'The plural of wenig; adjectives after it take strong endings.'
- id: saemtliche
  lesson: de3-participles
  term: sämtliche
  pos: pronoun
  meanings: [all (every single one), all, entire]
  example: Sämtliche Waren sind um 20 Prozent reduziert.
  exampleEn: All goods are reduced by 20 percent.
  note: Formal; adjectives after it take weak endings like after alle.
