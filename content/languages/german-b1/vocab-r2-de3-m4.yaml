# German B1, module 4 honors lessons (round 2): words for law-making and for sources and claims.
# Checked against every vocab file in German A1, A2 and B1 (including the round-2 files): no shared
# term + part of speech, first meaning or id. (das Gerücht is taught in German A2, so 20h2 only glosses it.)

# --- 20h1 Wie ein Gesetz entsteht (de3-m4-h-lawmaking) ---
- id: de3-m4-r2-w01
  lesson: de3-m4-h-lawmaking
  term: der Gesetzentwurf
  pos: noun
  plural: die Gesetzentwürfe
  meanings: [bill (draft law), bill, draft law, draft bill]
  example: Der Gesetzentwurf wird im Ausschuss beraten.
  exampleEn: The bill is being discussed in committee.
- id: de3-m4-r2-w02
  lesson: de3-m4-h-lawmaking
  term: der Entwurf
  pos: noun
  plural: die Entwürfe
  meanings: [draft, design, outline, plan]
  example: Das ist nur ein erster Entwurf.
  exampleEn: This is only a first draft.
- id: de3-m4-r2-w03
  lesson: de3-m4-h-lawmaking
  term: die Lesung
  pos: noun
  plural: die Lesungen
  meanings: [reading (of a bill or by an author), reading, public reading]
  example: Heute ist die erste Lesung im Bundestag.
  exampleEn: Today is the first reading in the Bundestag.
  note: 'Also a reading by an author: eine Lesung in der Buchhandlung.'
- id: de3-m4-r2-w04
  lesson: de3-m4-h-lawmaking
  term: der Ausschuss
  pos: noun
  plural: die Ausschüsse
  meanings: [committee]
  alt: [der Ausschuß]
  example: Im Ausschuss werden Experten angehört.
  exampleEn: Experts are heard in the committee.
- id: de3-m4-r2-w05
  lesson: de3-m4-h-lawmaking
  term: der Bundesrat
  pos: noun
  plural: —
  meanings: [Bundesrat (chamber of the German states), Bundesrat, federal council]
  example: Der Bundesrat muss dem Gesetz zustimmen.
  exampleEn: The Bundesrat has to approve the law.
  note: 'In Switzerland, der Bundesrat is the federal government.'
- id: de3-m4-r2-w06
  lesson: de3-m4-h-lawmaking
  term: der Bundespräsident
  pos: noun
  plural: die Bundespräsidenten
  meanings: [Federal President (male), federal president, president]
  alt: [der Bundespraesident]
  example: Der Bundespräsident unterzeichnet das Gesetz.
  exampleEn: The Federal President signs the law.
  note: 'Weak noun: den, dem, des Bundespräsidenten.'
- id: de3-m4-r2-w07
  lesson: de3-m4-h-lawmaking
  term: die Bundespräsidentin
  pos: noun
  plural: die Bundespräsidentinnen
  meanings: [Federal President (female), federal president, president]
  alt: [die Bundespraesidentin]
  example: Die Bundespräsidentin hält eine Rede.
  exampleEn: The Federal President gives a speech.
- id: de3-m4-r2-w08
  lesson: de3-m4-h-lawmaking
  term: verabschieden
  pos: verb
  meanings: [to pass (a law), to adopt (a law), to pass, to adopt]
  example: Das Gesetz wurde im Juni verabschiedet.
  exampleEn: The law was passed in June.
  note: 'Perfect: hat verabschiedet. Reflexive sich verabschieden = to say goodbye.'
- id: de3-m4-r2-w09
  lesson: de3-m4-h-lawmaking
  kind: phrase
  term: in Kraft treten
  pos: phrase
  meanings: [to come into force, to take effect, to come into effect]
  example: Das Gesetz tritt im Januar in Kraft.
  exampleEn: The law comes into force in January.
  note: 'tritt in Kraft, trat in Kraft, ist in Kraft getreten.'
- id: de3-m4-r2-w10
  lesson: de3-m4-h-lawmaking
  term: der Einspruch
  pos: noun
  plural: die Einsprüche
  meanings: [objection (formal, e.g. to a law), objection, protest]
  example: Der Bundesrat hat Einspruch eingelegt.
  exampleEn: The Bundesrat has lodged an objection.
  note: 'Einspruch einlegen (gegen) = to lodge an objection (to).'
- id: de3-m4-r2-w11
  lesson: de3-m4-h-lawmaking
  term: die Zustimmung
  pos: noun
  plural: —
  meanings: [consent, approval, agreement, assent]
  example: Für dieses Gesetz braucht man die Zustimmung des Bundesrates.
  exampleEn: This law needs the consent of the Bundesrat.
- id: de3-m4-r2-w12
  lesson: de3-m4-h-lawmaking
  term: unterzeichnen
  pos: verb
  meanings: [to sign (formal), to sign]
  example: Der Vertrag wurde gestern unterzeichnet.
  exampleEn: The treaty was signed yesterday.
  note: 'Inseparable; perfect: hat unterzeichnet. Everyday word: unterschreiben.'
- id: de3-m4-r2-w13
  lesson: de3-m4-h-lawmaking
  term: die Abstimmung
  pos: noun
  plural: die Abstimmungen
  meanings: [vote (on a question), vote, ballot]
  example: Die Abstimmung findet am Donnerstag statt.
  exampleEn: The vote takes place on Thursday.
- id: de3-m4-r2-w14
  lesson: de3-m4-h-lawmaking
  term: die Koalition
  pos: noun
  plural: die Koalitionen
  meanings: [coalition]
  example: Zwei Parteien bilden eine Koalition.
  exampleEn: Two parties form a coalition.
- id: de3-m4-r2-w15
  lesson: de3-m4-h-lawmaking
  term: die Opposition
  pos: noun
  plural: die Oppositionen
  meanings: [opposition (in parliament), opposition]
  example: Die Opposition kritisiert den Entwurf.
  exampleEn: The opposition criticises the bill.
- id: de3-m4-r2-w16
  lesson: de3-m4-h-lawmaking
  term: der Abgeordnete
  pos: noun
  plural: die Abgeordneten
  alt: [ein Abgeordneter, die Abgeordnete]
  meanings: [member of parliament, MP, representative, deputy]
  example: Die Abgeordneten stimmen über das Gesetz ab.
  exampleEn: The members of parliament vote on the law.
  note: 'Adjectival noun: der Abgeordnete, ein Abgeordneter, die Abgeordnete (female).'
- id: de3-m4-r2-w17
  lesson: de3-m4-h-lawmaking
  term: regeln
  pos: verb
  meanings: [to regulate, to settle, to sort out, to arrange]
  example: Das Gesetz regelt die Rechte der Mieter.
  exampleEn: The law regulates tenants' rights.
- id: de3-m4-r2-w18
  lesson: de3-m4-h-lawmaking
  term: festlegen
  pos: verb
  meanings: [to lay down (fix), to fix, to set, to determine, to stipulate, to lay down]
  example: Im Gesetz ist der Tag festgelegt.
  exampleEn: The day is fixed in the law.
  note: 'Separable: legt fest, hat festgelegt.'
- id: de3-m4-r2-w19
  lesson: de3-m4-h-lawmaking
  term: der Zustand
  pos: noun
  plural: die Zustände
  meanings: [condition (state of something), condition, state]
  example: Die Straße ist in einem schlechten Zustand.
  exampleEn: The road is in a bad condition.
- id: de3-m4-r2-w20
  lesson: de3-m4-h-lawmaking
  term: der Beschluss
  pos: noun
  plural: die Beschlüsse
  meanings: [resolution (formal decision), resolution, decision, ruling]
  alt: [der Beschluß]
  example: Der Beschluss wurde einstimmig gefasst.
  exampleEn: The resolution was passed unanimously.
  note: 'einen Beschluss fassen = to pass a resolution.'

# --- 20h2 Wer sagt das? (de3-m4-h-sources) ---
- id: de3-m4-r2-w21
  lesson: de3-m4-h-sources
  term: die Angabe
  pos: noun
  plural: die Angaben
  meanings: [statement (piece of information), information, detail, statement, figure]
  example: Nach Angaben der Polizei wurde niemand verletzt.
  exampleEn: According to the police, nobody was injured.
  note: 'nach Angaben + genitive = according to; nach eigenen Angaben = by one''s own account.'
- id: de3-m4-r2-w22
  lesson: de3-m4-h-sources
  term: zufolge
  pos: preposition
  meanings: [according to (after a dative noun), according to]
  example: Einer Studie zufolge schlafen Jugendliche zu wenig.
  exampleEn: According to a study, young people sleep too little.
  note: 'Comes after its noun, which is in the dative: dem Bericht zufolge.'
- id: de3-m4-r2-w23
  lesson: de3-m4-h-sources
  term: offenbar
  pos: adverb
  meanings: [evidently, apparently, obviously, clearly]
  example: Das Foto ist offenbar alt.
  exampleEn: The photo is evidently old.
- id: de3-m4-r2-w24
  lesson: de3-m4-h-sources
  term: scheinbar
  pos: adverb
  meanings: [seemingly (but not really), seemingly, ostensibly]
  example: Die Aufgabe ist nur scheinbar leicht.
  exampleEn: The task is only seemingly easy.
  note: 'Careful writing keeps it apart from anscheinend (apparently, and probably true).'
- id: de3-m4-r2-w25
  lesson: de3-m4-h-sources
  term: die Pressefreiheit
  pos: noun
  plural: —
  meanings: [freedom of the press, press freedom]
  example: Die Pressefreiheit steht im Grundgesetz.
  exampleEn: Freedom of the press is in the Basic Law.
- id: de3-m4-r2-w26
  lesson: de3-m4-h-sources
  term: die Zensur
  pos: noun
  plural: —
  meanings: [censorship]
  example: Eine Zensur findet nicht statt.
  exampleEn: There is no censorship.
  note: 'The plural die Zensuren is an older word for school marks.'
- id: de3-m4-r2-w27
  lesson: de3-m4-h-sources
  term: der Rundfunk
  pos: noun
  plural: —
  meanings: [broadcasting, radio and television, radio]
  example: Der öffentlich-rechtliche Rundfunk wird durch einen Beitrag finanziert.
  exampleEn: Public broadcasting is financed by a fee.
- id: de3-m4-r2-w28
  lesson: de3-m4-h-sources
  term: öffentlich-rechtlich
  pos: adjective
  meanings: [public-service (broadcasting), public-service, public-law, public]
  alt: [oeffentlich-rechtlich, öffentlich rechtlich]
  example: ARD und ZDF sind öffentlich-rechtliche Sender.
  exampleEn: ARD and ZDF are public-service broadcasters.
- id: de3-m4-r2-w29
  lesson: de3-m4-h-sources
  term: recherchieren
  pos: verb
  meanings: [to research (as a journalist), to research, to investigate, to look into]
  example: Die Journalistin hat drei Monate lang recherchiert.
  exampleEn: The journalist researched for three months.
  note: 'Perfect: hat recherchiert. Said re-scher-SCHIE-ren.'
- id: de3-m4-r2-w30
  lesson: de3-m4-h-sources
  term: die Recherche
  pos: noun
  plural: die Recherchen
  meanings: [research (by a journalist), research, investigation, enquiry, inquiry]
  example: Nach unseren Recherchen ist die Meldung falsch.
  exampleEn: According to our research, the report is false.
- id: de3-m4-r2-w31
  lesson: de3-m4-h-sources
  term: das Impressum
  pos: noun
  plural: die Impressen
  meanings: [legal notice (on a website), imprint, impressum, publisher's details]
  example: Die Webseite hat kein Impressum.
  exampleEn: The website has no legal notice.
- id: de3-m4-r2-w32
  lesson: de3-m4-h-sources
  term: seriös
  pos: adjective
  meanings: [reputable, trustworthy, respectable]
  alt: [serioes]
  example: Das ist eine seriöse Zeitung.
  exampleEn: That is a reputable newspaper.
  note: 'False friend: "serious" (not joking) is ernst.'
- id: de3-m4-r2-w33
  lesson: de3-m4-h-sources
  term: der Faktencheck
  pos: noun
  plural: die Faktenchecks
  meanings: [fact check, fact-check]
  example: Der Faktencheck zeigt, dass das Foto alt ist.
  exampleEn: The fact check shows that the photo is old.
- id: de3-m4-r2-w34
  lesson: de3-m4-h-sources
  term: beweisen
  pos: verb
  meanings: [to prove, to show]
  example: Kannst du das beweisen?
  exampleEn: Can you prove that?
  note: 'bewies, hat bewiesen.'
- id: de3-m4-r2-w35
  lesson: de3-m4-h-sources
  term: der Beweis
  pos: noun
  plural: die Beweise
  meanings: [evidence (proof), evidence, proof]
  example: Es gibt keine Beweise für diese Behauptung.
  exampleEn: There is no evidence for this claim.
- id: de3-m4-r2-w36
  lesson: de3-m4-h-sources
  term: die Studie
  pos: noun
  plural: die Studien
  meanings: [study (piece of research), study, survey]
  example: Laut einer neuen Studie lesen Kinder weniger.
  exampleEn: According to a new study, children read less.
- id: de3-m4-r2-w37
  lesson: de3-m4-h-sources
  term: fälschen
  pos: verb
  meanings: [to fake, to forge, to falsify, to counterfeit]
  alt: [faelschen]
  example: Das Foto wurde gefälscht.
  exampleEn: The photo was faked.
- id: de3-m4-r2-w38
  lesson: de3-m4-h-sources
  term: bestreiten
  pos: verb
  meanings: [to deny (a claim), to deny, to dispute, to contest]
  example: Der Bürgermeister bestreitet die Vorwürfe.
  exampleEn: The mayor denies the accusations.
  note: 'bestritt, hat bestritten.'
