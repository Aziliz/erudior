# Round 2 glossary, module calc-m2 (honors lessons)
- term: forward difference
  aliases: [forward differences, forward difference quotient]
  definition: 'The estimate $\dfrac{f(a + h) - f(a)}{h}$ of $f''(a)$, using $a$ and a point to its right; its error is about $\frac{f''''(a)}{2}h$ (first order).'
  topic: Numerical differentiation
- term: backward difference
  aliases: [backward differences, backward difference quotient]
  definition: 'The estimate $\dfrac{f(a) - f(a - h)}{h}$ of $f''(a)$, using $a$ and a point to its left; first order, like the forward difference.'
  topic: Numerical differentiation
- term: truncation error
  definition: 'The error a numerical method makes because its step $h$ is not zero, even with exact arithmetic; for the central difference it is about $\frac{f''''''(a)}{6}h^2$.'
  topic: Numerical differentiation
- term: order of accuracy
  aliases: [first-order method, second-order method]
  definition: 'The power of $h$ in a method''s truncation error. A first-order method''s error is roughly proportional to $h$, a second-order method''s to $h^2$, so halving $h$ divides it by about 2 or 4.'
  topic: Numerical differentiation
- term: Richardson extrapolation
  definition: 'Combining estimates made with steps $h$ and $h/2$ so their leading errors cancel: $2D(h/2) - D(h)$ for a first-order method, $\frac{4D(h/2) - D(h)}{3}$ for a second-order one.'
  topic: Numerical differentiation
- term: round-off error
  aliases: [rounding error, roundoff error]
  definition: 'Error from storing numbers with finitely many digits (about 16 significant digits in standard double precision). In a difference quotient it grows roughly like $1/h$ as $h$ shrinks.'
  topic: Numerical differentiation
- term: subtractive cancellation
  aliases: [catastrophic cancellation]
  definition: 'The loss of correct digits when two nearly equal numbers are subtracted, as in $f(a + h) - f(a)$ for tiny $h$.'
  topic: Numerical differentiation
- term: one-sided derivative
  aliases: [one-sided derivatives, left-hand derivative, right-hand derivative]
  definition: 'A derivative computed with $h \to 0^-$ (left-hand, $f''_-(a)$) or $h \to 0^+$ (right-hand, $f''_+(a)$). $f''(a)$ exists exactly when both exist and are equal.'
  topic: Smoothness
- term: Darboux's theorem
  definition: 'If $f$ is differentiable on $[a, b]$, then $f''$ takes every value between $f''(a)$ and $f''(b)$. So a derivative can never have a jump discontinuity, even when it is not continuous.'
  topic: Smoothness
- term: smoothness class
  aliases: [smoothness classes]
  definition: 'A grade of smoothness: $C^0$ (continuous), $C^1$, $C^2$, …, $C^k$ (first $k$ derivatives exist and are continuous), and $C^\infty$ (derivatives of every order).'
  topic: Smoothness
- term: continuously differentiable
  definition: 'Having a derivative that is itself continuous; the class $C^1$. Stronger than just differentiable: $x^2\sin(1/x)$ (with value 0 at 0) is differentiable but not $C^1$.'
  topic: Smoothness
- term: infinitely differentiable
  definition: 'Having derivatives of every order; the class $C^\infty$. Polynomials and $e^x$ are examples.'
  topic: Smoothness
- term: transition curve
  aliases: [transition curves, easement curve, Euler spiral, clothoid]
  definition: 'A stretch of road or railway between a straight and a circular curve along which the curvature rises gradually from 0, so the sideways acceleration does not jump. Common forms are the clothoid (Euler spiral) and the cubic parabola.'
  topic: Smoothness
- term: cubic spline
  aliases: [cubic splines, spline, splines]
  definition: 'A curve made of cubic pieces through given points, joined so that the value, first derivative and second derivative agree at every joint ($C^2$).'
  topic: Smoothness
