# Module 11 drills: parametric and polar
- id: calc-d-param-slope
  title: Slope of a parametric curve
  topic: Parametric equations
  vars:
    a: {min: -4, max: 4}
    b: {min: -5, max: 5}
    t0: {min: -3, max: 3}
  where: ["2*t0 + a != 0", "t0 != 0", "b != 0", "a != 0"]
  calc:
    xp: 2*t0 + a
    yp: 3*t0^2 + b
    m: (3*t0^2 + b)/(2*t0 + a)
    X: t0^2 + a*t0
    Y: t0^3 + b*t0
  prompt: 'A curve is given by $x = t^2 {a:signedcoef}t$, $y = t^3 {b:signedcoef}t$. Find the point where $t = {t0}$ and the slope $\dfrac{dy}{dx}$ there (exact fraction).'
  answers:
    - {name: X, label: '$x =$'}
    - {name: Y, label: '$y =$'}
    - {name: m, kind: fraction, lowestTerms: true, label: '$\dfrac{dy}{dx} =$'}
  figure:
    type: plot
    x: ['X - 8', 'X + 8']
    y: ['Y - 8', 'Y + 8']
    curves: [{x: 't^2 + a*t', y: 't^3 + b*t', t: [-4, 4]}]
    points: [{at: [X, Y]}]
  solution: |-
    At $t = {t0}$: $x =$ **{X}**, $y =$ **{Y}**. Derivatives: $\dfrac{dx}{dt} = 2t {a:signed} = {xp}$ and $\dfrac{dy}{dt} = 3t^2 {b:signed} = {yp}$. So $\dfrac{dy}{dx} = \dfrac{{yp}}{{xp}} =$ **{m:frac}**.
- id: calc-d-param-arc
  title: Length of a parametric curve (numerical)
  topic: Parametric equations
  vars:
    a: {min: 1, max: 3}
    b: {min: 1, max: 2}
    T: {choices: [1, 1.5, 2]}
  funcs:
    sp(t): sqrt(4*a^2*t^2 + 9*b^2*t^4)
  calc:
    L: integ(sp, 0, T)
    a4: 4*a^2
    b9: 9*b^2
  prompt: 'Find the length of the curve $x = {a:coef}t^2$, $y = {b:coef}t^3$ for $0 \le t \le {T}$. (Use a calculator for the integral; 3 decimals.)'
  answers:
    - {name: L, label: 'Length', tolerance: 0.001, format: dp3}
  figure:
    type: plot
    x: [-0.5, 'a*T^2 + 0.5']
    y: [-0.5, 'b*T^3 + 0.5']
    equal: true
    curves: [{x: 'a*t^2', y: 'b*t^3', t: [0, T]}]
  solution: |-
    $x' = {a:coef}\cdot2t$, $y' = {b:coef}\cdot3t^2$, so the speed is $\sqrt{{a4}t^2 + {b9}t^4}$ and
    $$L = \int_0^{{T}}\sqrt{{a4}t^2 + {b9}t^4}\,dt \approx \mathbf{{L:dp3}}.$$
    (Factoring $t\sqrt{{a4} + {b9}t^2}$ makes it a $u$-substitution, if you want an exact value.)
- id: calc-d-polar-area
  title: Area of one rose petal
  topic: Polar coordinates
  vars:
    a: {min: 1, max: 5}
    n: {choices: [2, 3, 4, 5]}
  calc:
    A: pi*a^2/(4*n)
    a2: a^2
    n4: 4*n
    lim: pi/(2*n)
    n2: 2*n
  prompt: 'Find the area of one petal of the rose $r = {a:coef}\cos({n}\theta)$. (Exact, like pi/3, or 4 decimals.)'
  answers:
    - {name: A, label: 'Area', relTolerance: 0.0005, format: num4}
  figure:
    type: plot
    x: ['-a - 0.5', 'a + 0.5']
    y: ['-a - 0.5', 'a + 0.5']
    equal: true
    curves: [{x: 'a*cos(n*t)*cos(t)', y: 'a*cos(n*t)*sin(t)', t: [0, '2*pi']}]
  solution: |-
    One petal is traced while $\cos({n}\theta) \ge 0$ around $\theta = 0$: $-\dfrac{\pi}{{n2}} \le \theta \le \dfrac{\pi}{{n2}}$.
    $$A = \frac12\int_{-\pi/{n2}}^{\pi/{n2}}{a2}\cos^2({n}\theta)\,d\theta = \frac{{a2}}{2}\left[\frac\theta2 + \frac{\sin(2\cdot{n}\theta)}{4\cdot{n}}\right]_{-\pi/{n2}}^{\pi/{n2}} = \frac{{a2}\pi}{{n4}} \approx \mathbf{{A:num4}}.$$
- id: calc-d-polar-slope
  title: Slope of a limaçon
  topic: Polar coordinates
  vars:
    a: {min: 1, max: 4}
    b: {min: 1, max: 3}
    th: {choices: [{label: '\tfrac{\pi}{6}', value: 0.5235987755982988}, {label: '\tfrac{\pi}{4}', value: 0.7853981633974483}, {label: '\tfrac{\pi}{3}', value: 1.0471975511965976}, {label: '\tfrac{2\pi}{3}', value: 2.0943951023931953}, {label: '\tfrac{3\pi}{4}', value: 2.356194490192345}]}
  calc:
    r: a + b*cos(th)
    rp: -b*sin(th)
    num: -b*sin(th)*sin(th) + (a + b*cos(th))*cos(th)
    den: -b*sin(th)*cos(th) - (a + b*cos(th))*sin(th)
    m: (-b*sin(th)*sin(th) + (a + b*cos(th))*cos(th))/(-b*sin(th)*cos(th) - (a + b*cos(th))*sin(th))
    X: (a + b*cos(th))*cos(th)
    Y: (a + b*cos(th))*sin(th)
  where: ["abs(-b*sin(th)*cos(th) - (a + b*cos(th))*sin(th)) > 0.05"]
  prompt: 'Find the slope $\dfrac{dy}{dx}$ of the polar curve $r = {a} + {b:coef}\cos\theta$ at $\theta = {th}$. (4 decimals)'
  answers:
    - {name: m, label: '$\dfrac{dy}{dx} \approx$', tolerance: 0.0001, format: num4}
  figure:
    type: plot
    x: ['-a - b - 0.5', 'a + b + 0.5']
    y: ['-a - b - 0.5', 'a + b + 0.5']
    equal: true
    curves: [{x: '(a + b*cos(t))*cos(t)', y: '(a + b*cos(t))*sin(t)', t: [0, '2*pi']}]
    points: [{at: [X, Y]}]
  solution: |-
    $r = {a} + {b:coef}\cos\theta$ and $r' = -{b:coef}\sin\theta$. At $\theta = {th}$: $r \approx {r:num4}$ and $r' \approx {rp:num4}$.
    $$\frac{dy}{dx} = \frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta} \approx \frac{{num:num4}}{{den:num4}} \approx \mathbf{{m:num4}}.$$
