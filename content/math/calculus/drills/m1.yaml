# Module 1 drills: limits and continuity
- id: calc-d-limit-table
  title: Estimate a limit from a table
  topic: Limits
  vars:
    b: {min: 2, max: 9}
  funcs:
    f(x): (b^x - 1)/x
  calc:
    v1: f(-0.1)
    v2: f(-0.01)
    v3: f(-0.001)
    v4: f(0.001)
    v5: f(0.01)
    v6: f(0.1)
    L: ln(b)
  prompt: |-
    Values of $f(x) = \dfrac{{b}^x - 1}{x}$ near $x = 0$:

    | $x$ | $-0.1$ | $-0.01$ | $-0.001$ | $0.001$ | $0.01$ | $0.1$ |
    |---|---|---|---|---|---|---|
    | $f(x)$ | {v1:dp4} | {v2:dp4} | {v3:dp4} | {v4:dp4} | {v5:dp4} | {v6:dp4} |

    Estimate $\displaystyle\lim_{x\to0}f(x)$ to 2 decimal places.
  answers:
    - {name: L, label: 'Limit $\approx$', tolerance: 0.01}
  solution: |-
    Substituting $x = 0$ gives $0/0$, so read the table. From the left the values rise ({v3:dp4} at $x = -0.001$); from the right they fall ({v4:dp4} at $x = 0.001$). Both sides close in on the number between them, about **{L:dp2}**. (The exact value is $\ln {b} \approx {L:dp4}$, as you'll see when you learn the derivative of ${b}^x$.)
- id: calc-d-limit-graph
  title: One-sided limits of a piecewise function
  topic: Limits
  vars:
    c: {min: -2, max: 2}
    m1: {min: -2, max: 2}
    b1: {min: -3, max: 4}
    m2: {min: -2, max: 2}
    b2: {min: -3, max: 4}
  where: ["m1 != 0", "m2 != 0", "b1 != 0", "b2 != 0", "m1*c + b1 != m2*c + b2", "abs(m1*c + b1) <= 6", "abs(m2*c + b2) <= 6"]
  calc:
    L: m1*c + b1
    R: m2*c + b2
  prompt: |-
    $$f(x) = \begin{cases} {m1:coef}x {b1:signed}, & x < {c}\\ {m2:coef}x {b2:signed}, & x \ge {c}\end{cases}$$
    Find the one-sided limits at $x = {c}$.
  answers:
    - {name: L, label: '$\lim_{x\to {c}^-} f(x) =$'}
    - {name: R, label: '$\lim_{x\to {c}^+} f(x) =$'}
  figure:
    type: plot
    x: [-5, 5]
    y: [-9, 9]
    functions:
      - {f: 'm1*x + b1', to: c}
      - {f: 'm2*x + b2', from: c}
    points:
      - {at: [c, L], open: true}
      - {at: [c, R]}
  solution: |-
    Left of ${c}$ use the first piece: ${m1}({c}) {b1:signed} =$ **{L}**. Right of ${c}$ (and at ${c}$) use the second: ${m2}({c}) {b2:signed} =$ **{R}**. They differ, so the two-sided limit does not exist (a jump).
- id: calc-d-limit-factor
  title: Limit by factoring
  topic: Algebraic limits
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
  where: ["a != 0", "b != 0", "a != b", "b != -a"]
  calc:
    s: -(a + b)
    pr: a*b
    sq: -a^2
    na: -a
    nb: -b
    amb: a - b
    a2: 2*a
    L: (a - b)/(2*a)
  prompt: 'Find $\displaystyle\lim_{x\to {a}}\frac{x^2 {s:signedcoef}x {pr:signed}}{x^2 {sq:signed}}$ as an exact fraction.'
  answers:
    - {name: L, kind: fraction, lowestTerms: true, label: 'Limit $=$'}
  solution: |-
    Substituting gives $0/0$. Factor: the top is $(x {na:signed})(x {nb:signed})$ and the bottom is $(x {na:signed})(x {a:signed})$. Cancel $x {na:signed}$ to get $\dfrac{x {nb:signed}}{x {a:signed}}$, then substitute $x = {a}$: $\dfrac{{amb}}{{a2}} =$ **{L:frac}**.
- id: calc-d-limit-conj
  title: Limit with a conjugate
  topic: Algebraic limits
  vars:
    n: {min: 2, max: 7}
    c: {min: -5, max: 6}
  where: ["c != 0", "n^2 - c > 0"]
  calc:
    k: n^2 - c
    nc: -c
    L: 1/(2*n)
  prompt: 'Find $\displaystyle\lim_{x\to {c}}\frac{\sqrt{x + {k}} - {n}}{x {nc:signed}}$ as an exact fraction.'
  answers:
    - {name: L, kind: fraction, lowestTerms: true, label: 'Limit $=$'}
  solution: |-
    At $x = {c}$, $\sqrt{{c} + {k}} = {n}$, so this is $0/0$. Multiply by the conjugate $\sqrt{x + {k}} + {n}$: the top becomes $(x + {k}) - {n}^2 = x {nc:signed}$, which cancels, leaving $\dfrac{1}{\sqrt{x + {k}} + {n}} \to \dfrac{1}{{n} + {n}} =$ **{L:frac}**.
- id: calc-d-limit-inf-rational
  title: Limit at infinity of a rational function
  topic: Limits at infinity
  vars:
    a: {min: -9, max: 9}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    d: {min: 2, max: 9}
    e: {min: 1, max: 9}
    deg: {choices: [2, 3]}
  where: ["a != 0", "b != 0", "c != 0"]
  calc:
    L: a/d
  prompt: 'Find $\displaystyle\lim_{x\to\infty}\frac{{a:coef}x^{deg} {b:signedcoef}x {c:signed}}{{d}x^{deg} {e:signed}}$ as an exact fraction.'
  answers:
    - {name: L, kind: fraction, lowestTerms: true, label: 'Limit $=$'}
  solution: |-
    Divide every term by $x^{deg}$, the highest power in the denominator. Every term except the leading ones becomes a constant over a power of $x$ and tends to 0, leaving $\dfrac{{a}}{{d}} =$ **{L:frac}**.
- id: calc-d-vert-asymptote
  title: Asymptotes of a linear-over-linear function
  topic: Infinite limits
  vars:
    a: {min: -6, max: 6}
    b: {min: -9, max: 9}
    c: {min: 1, max: 5}
    d: {min: -9, max: 9}
  where: ["a != 0", "b != 0", "d != 0", "a*d - b*c != 0"]
  calc:
    va: -d/c
    ha: a/c
  prompt: 'Find the vertical and horizontal asymptotes of $y = \dfrac{{a:coef}x {b:signed}}{{c:coef}x {d:signed}}$. Give exact fractions.'
  answers:
    - {name: va, kind: fraction, lowestTerms: true, label: 'Vertical: $x =$'}
    - {name: ha, kind: fraction, lowestTerms: true, label: 'Horizontal: $y =$'}
  figure:
    type: plot
    x: [-10, 10]
    y: [-10, 10]
    functions:
      - {f: '(a*x + b)/(c*x + d)'}
    segments:
      - {from: [va, -10], to: [va, 10], dashed: true}
      - {from: [-10, ha], to: [10, ha], dashed: true}
  solution: |-
    The denominator ${c:coef}x {d:signed}$ is zero at $x = {va:texfrac}$, and the numerator isn't zero there (no common factor since $ad - bc \ne 0$), so the vertical asymptote is $x =$ **{va:frac}**. Both top and bottom have degree 1, so as $x \to \pm\infty$ the function tends to the ratio of leading coefficients: $y =$ **{ha:frac}**.
- id: calc-d-limit-trig
  title: Limit using sin(x)/x
  topic: Squeeze theorem
  vars:
    a: {min: 2, max: 9}
    b: {min: 2, max: 9}
    form: {choices: [{label: '\sin', value: 1}, {label: '\tan', value: 2}]}
  where: ["a != b"]
  calc:
    L: a/b
  prompt: 'Find $\displaystyle\lim_{x\to0}\frac{{form}({a}x)}{{b}x}$ as an exact fraction.'
  answers:
    - {name: L, kind: fraction, lowestTerms: true, label: 'Limit $=$'}
  solution: |-
    Rewrite to match the argument: $\dfrac{{form}({a}x)}{{b}x} = \dfrac{{a}}{{b}}\cdot\dfrac{{form}({a}x)}{{a}x}$. As $x\to0$, $\dfrac{{form}\,u}{u} \to 1$ (for $\tan u = \frac{\sin u}{\cos u}$ the extra $\frac{1}{\cos u}\to 1$). The limit is **{L:frac}**.
- id: calc-d-epsilon-delta
  title: Find δ for a given ε
  topic: Formal limit definition
  vars:
    m: {min: -9, max: 9}
    b: {min: -9, max: 9}
    a: {min: -5, max: 5}
    eps: {choices: [0.1, 0.05, 0.01, 0.03, 0.2]}
  where: ["m != 0", "abs(m) != 1", "b != 0", "a != 0", "L != 0"]
  calc:
    L: m*a + b
    na: -a
    nL: -L
    am: abs(m)
    delta: eps/abs(m)
  prompt: 'Let $f(x) = {m:coef}x {b:signed}$, so $\displaystyle\lim_{x\to {a}}f(x) = {L}$. For $\varepsilon = {eps}$, what is the largest $\delta$ such that $0 < |x {na:signed}| < \delta$ guarantees $|f(x) {nL:signed}| < \varepsilon$? Give it exactly or to 4 significant figures.'
  answers:
    - {name: delta, label: '$\delta =$', relTolerance: 0.001, format: sig4}
  solution: |-
    $|f(x) {nL:signed}| = |{m:coef}x {b:signed} {nL:signed}| = {am}\,|x {na:signed}|$. This is less than ${eps}$ exactly when $|x {na:signed}| < \dfrac{{eps}}{{am}}$, so $\delta =$ **{delta:sig4}**.
- id: calc-d-continuity-k
  title: Make a piecewise function continuous
  topic: Continuity
  vars:
    c: {min: 2, max: 4}
    p: {min: -6, max: 6}
    q: {min: -4, max: 4}
  where: ["q != 0", "c != q", "p != 0"]
  calc:
    k: (c^2 - p)/(c - q)
    cc: c^2
    top: c^2 - p
    bot: c - q
    np: -p
    nq: -q
  prompt: |-
    Find $k$ so that
    $$f(x) = \begin{cases} kx {p:signed}, & x < {c}\\ x^2 {q:signedcoef}k, & x \ge {c}\end{cases}$$
    is continuous at $x = {c}$. Give an exact fraction.
  answers:
    - {name: k, kind: fraction, lowestTerms: true, label: '$k =$'}
  solution: |-
    Both pieces are polynomials, so only $x = {c}$ matters. The left piece heads to ${c}k {p:signed}$; the right piece equals ${cc} {q:signedcoef}k$ there. Set them equal, ${c}k {p:signed} = {cc} {q:signedcoef}k$, and collect the $k$ terms: ${c}k {nq:signedcoef}k = {cc} {np:signed}$, so ${bot:coef}k = {top}$ and $k =$ **{k:frac}**.
- id: calc-d-ivt-bisect
  title: Bisection after three steps
  topic: Intermediate Value Theorem
  vars:
    a: {min: 1, max: 5}
    b: {min: 3, max: 20}
  where: ["1 + a - b < 0", "8 + 2*a - b > 0"]
  funcs:
    f(x): x^3 + a*x - b
  calc:
    f1: f(1)
    f2: f(2)
    m1: '1.5'
    L1: if(f(1)*f(m1) <= 0, 1, m1)
    R1: if(f(1)*f(m1) <= 0, m1, 2)
    m2: (L1 + R1)/2
    L2: if(f(L1)*f(m2) <= 0, L1, m2)
    R2: if(f(L1)*f(m2) <= 0, m2, R1)
    m3: (L2 + R2)/2
    L3: if(f(L2)*f(m3) <= 0, L2, m3)
    R3: if(f(L2)*f(m3) <= 0, m3, R2)
    fm1: f(m1)
    fm2: f(m2)
    fm3: f(m3)
    root: solve(f, 1, 2)
  prompt: 'Let $f(x) = x^3 {a:signedcoef}x - {b}$. Since $f(1) = {f1}$ and $f(2) = {f2}$, the IVT puts a root in $(1, 2)$. Do three steps of bisection (test 1.5, then the next two midpoints). Which interval is left?'
  answers:
    - {name: L3, label: 'Left end', format: num4, tolerance: 0.0001}
    - {name: R3, label: 'Right end', format: num4, tolerance: 0.0001}
  figure:
    type: plot
    x: [0.5, 2.5]
    y: [-15, 15]
    functions: [f]
    points:
      - {at: [L3, 0], label: 'L'}
      - {at: [R3, 0], label: 'R'}
  solution: |-
    $f$ is a continuous polynomial with $f(1) < 0 < f(2)$.
    1. $f(1.5) = {fm1:num4}$: keep $[{L1:num4}, {R1:num4}]$, where the sign changes.
    2. $f({m2:num4}) = {fm2:num4}$: keep $[{L2:num4}, {R2:num4}]$.
    3. $f({m3:num4}) = {fm3:num4}$: keep **[{L3:num4}, {R3:num4}]**.

    (The root is about {root:num4}.)
