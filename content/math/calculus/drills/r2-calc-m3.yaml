# Round 2, module calc-m3: drills for the honors lessons
- id: calc-m3-r2-leibniz-at-zero
  title: Leibniz's rule at x = 0
  topic: Leibniz rule
  vars:
    m: {choices: [{label: 'x', value: 1}, {label: 'x^2', value: 2}, {label: 'x^3', value: 3}]}
    n: {min: 4, max: 8}
    a: {min: -3, max: 3}
  where: ["a != 0"]
  calc:
    mv: m
    p: n - m
    bin: nCr(n, m)
    mf: fact(m)
    ap: a^(n - m)
    ans: nCr(n, m)*fact(m)*a^(n - m)
  prompt: 'Use Leibniz''s rule to find $y^{({n})}(0)$ for $y = {m}e^{{a}x}$.'
  answers:
    - {name: ans, format: integer, label: '$y^{({n})}(0) =$'}
  solution: |-
    Write $y = g\cdot f$ with $g = {m}$ and $f = e^{{a}x}$, so $f^{(j)} = ({a})^{j}e^{{a}x}$, which is $({a})^{j}$ at $x = 0$. Every derivative of $g$ of order below ${mv}$ is 0 at $x = 0$, and every derivative above ${mv}$ is 0 everywhere; only $g^{({mv})} = {mf}$ survives. Leibniz's rule leaves the single term
    $$y^{({n})}(0) = \binom{{n}}{{mv}}\,f^{({p})}(0)\,g^{({mv})}(0) = {bin}\cdot({a})^{{p}}\cdot{mf} = {bin}\cdot({ap})\cdot{mf} = \mathbf{{ans}}.$$
- id: calc-m3-r2-nth-reciprocal
  title: nth derivative of a reciprocal
  topic: Higher derivatives
  vars:
    n: {min: 2, max: 5}
    c: {min: -5, max: 5}
    d: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    p: c + d
    n1: n + 1
    sgn: (-1)^n
    nf: fact(n)
    den: d^(n + 1)
    ans: (-1)^n*fact(n)/d^(n + 1)
  prompt: 'Let $f(x) = \dfrac{1}{x {c:signed}}$. Find $f^{({n})}({p})$ as an exact fraction.'
  answers:
    - {name: ans, kind: fraction, lowestTerms: true, label: '$f^{({n})}({p}) =$'}
  solution: |-
    The pattern for a reciprocal is $\dfrac{d^n}{dx^n}\dfrac{1}{x - k} = \dfrac{(-1)^n\,n!}{(x - k)^{n + 1}}$. Here $x - k = x {c:signed}$, which equals ${d}$ at $x = {p}$. So
    $$f^{({n})}({p}) = \frac{({sgn})\cdot{nf}}{({d})^{{n1}}} = \frac{{sgn}\cdot{nf}}{{den}} = \mathbf{{ans:frac}}.$$
- id: calc-m3-r2-nth-sine
  title: nth derivative of sin(ax)
  topic: Higher derivatives
  vars:
    sg: {choices: [{label: '', value: 1}, {label: '-', value: -1}]}
    fn: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    q: {min: 1, max: 2}
    a: {choices: [2, 3]}
  calc:
    s: if(fn == 0, if(sg == 1, 0, 2), if(sg == 1, 1, 3))
    n: 4*q + s
    an: a^n
    q4: 4*q
  where: ["a^(4*q + s) <= 20000"]
  prompt: 'Find $\dfrac{d^{{n}}}{dx^{{n}}}\sin({a}x)$.'
  answers:
    - kind: expression
      expression: 'a^n*sin(a*x + n*pi/2)'
      label: '$\dfrac{d^{{n}}}{dx^{{n}}}\sin({a}x) =$'
      show: '${sg}{an}{fn}({a}x)$'
  solution: |-
    Each derivative of $\sin({a}x)$ multiplies by ${a}$ and moves one step around the cycle $\sin \to \cos \to -\sin \to -\cos \to \sin$. After ${n} = {q4} + {s}$ steps the cycle has gone round completely and then ${s}$ more steps, and the factor is ${a}^{{n}} = {an}$. So the answer is **$\dfrac{d^{{n}}}{dx^{{n}}}\sin({a}x) = {sg}{an}{fn}({a}x)$**.
- id: calc-m3-r2-e-limit
  title: A limit equal to a power of e
  topic: Proofs of derivative rules
  vars:
    sg: {choices: [{label: '+', value: 1}, {label: '-', value: -1}]}
    aa: {min: 1, max: 3}
    b: {choices: [{label: '', value: 1}, {label: '2', value: 2}, {label: '3', value: 3}]}
  where: ["aa*b <= 6"]
  calc:
    a: sg*aa
    bv: b
    ab: sg*aa*b
    L: exp(sg*aa*b)
  prompt: 'Find $\displaystyle\lim_{n\to\infty}\left(1 {sg} \dfrac{{aa}}{n}\right)^{{b}n}$ to 3 decimal places.'
  answers:
    - {name: L, format: dp3, tolerance: 0.001, label: 'Limit'}
  solution: |-
    Take the log: ${bv}n\ln\left(1 {sg} \dfrac{{aa}}{n}\right) = {bv}\cdot({a})\cdot\dfrac{\ln(1 + h)}{h}$ with $h = \dfrac{{a}}{n} \to 0$. Since $\dfrac{\ln(1 + h)}{h} \to 1$ (the derivative of $\ln$ at 1), the log tends to ${ab}$, so the limit is $e^{{ab}} \approx$ **{L:dp3}**.
- id: calc-m3-r2-horizontal-tangent
  title: Horizontal tangent of a tilted ellipse
  topic: Implicit curves
  vars:
    a: {min: 1, max: 3}
    b: {min: 1, max: 3}
    k: {min: -4, max: 4}
    c: {min: 2, max: 30}
  where: ["k != 0", "4*a*b > k^2"]
  calc:
    a2: 2*a
    b2: 2*b
    x0: sqrt(c*k^2/(a*(4*a*b - k^2)))
    y0: -2*a*sqrt(c*k^2/(a*(4*a*b - k^2)))/k
    r: -2*a/k
  prompt: 'The curve ${a:coef}x^2 {k:signedcoef}xy {b:signedcoef}y^2 = {c}$ is an ellipse. Find the point with $x > 0$ where its tangent line is horizontal. Give $x$ and $y$ to 3 decimal places.'
  answers:
    - {name: x0, format: dp3, tolerance: 0.001, label: '$x =$'}
    - {name: y0, format: dp3, tolerance: 0.001, label: '$y =$'}
  solution: |-
    With $F = {a:coef}x^2 {k:signedcoef}xy {b:signedcoef}y^2 - {c}$, the slope is $-\dfrac{F_x}{F_y}$ where $F_x = {a2}x {k:signedcoef}y$ and $F_y = {k:coef}x {b2:signed}y$. A horizontal tangent needs $F_x = 0$, so $y = {r:texfrac}\,x$. Substitute into the curve's equation and solve for $x^2$, then take the positive root: $x \approx$ **{x0:dp3}**, and $y = {r:texfrac}\,x \approx$ **{y0:dp3}**. (There $F_y \ne 0$, so the tangent really is horizontal.)
- id: calc-m3-r2-folium-tangent
  title: Top of the folium's loop
  topic: Implicit curves
  vars:
    c: {min: 1, max: 6}
  calc:
    k: 3*c
    x0: c*2^(1/3)
    y0: c*4^(1/3)
    c3: 2*c^3
  prompt: 'The folium $x^3 + y^3 = {k}xy$ has a horizontal tangent at the top of its loop. Find that point, to 3 decimal places.'
  answers:
    - {name: x0, format: dp3, tolerance: 0.001, label: '$x =$'}
    - {name: y0, format: dp3, tolerance: 0.001, label: '$y =$'}
  solution: |-
    $F_x = 3x^2 - {k}y = 0$ gives $y = \dfrac{x^2}{{c}}$. Substitute into the curve: $x^3 + \dfrac{x^6}{{c}^3} = {k}x\cdot\dfrac{x^2}{{c}} = 3x^3$, so $x^3 = 2\cdot{c}^3 = {c3}$ (the other solution, $x = 0$, is the singular point at the origin). Then $x = {c}\sqrt[3]{2} \approx$ **{x0:dp3}** and $y = \dfrac{x^2}{{c}} = {c}\sqrt[3]{4} \approx$ **{y0:dp3}**.
