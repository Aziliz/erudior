# Module 3 drills: differentiation rules
- id: calc-d-product
  title: Product rule with an exponential
  topic: Product rule
  vars:
    a: {min: 1, max: 6}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
  where: ["b != 0", "c != 0", "2*a + b != 0", "b + c != 0"]
  calc:
    a2: 2*a
    s1: 2*a + b
    s0: b + c
  prompt: 'Differentiate $y = ({a:coef}x^2 {b:signedcoef}x {c:signed})e^{x}$.'
  answers:
    - kind: expression
      expression: '(a*x^2 + (2*a + b)*x + b + c)*e^x'
      label: '$y'' =$'
      show: '$e^{x}\left({a:coef}x^2 {s1:signedcoef}x {s0:signed}\right)$'
  solution: |-
    Product rule with $f = {a:coef}x^2 {b:signedcoef}x {c:signed}$ ($f' = {a2}x {b:signed}$) and $g = e^{x}$ ($g' = e^{x}$):
    $$y' = ({a2}x {b:signed})e^{x} + ({a:coef}x^2 {b:signedcoef}x {c:signed})e^{x}.$$
    Factor out $e^{x}$ and combine like terms: **$y' = e^{x}\left({a:coef}x^2 {s1:signedcoef}x {s0:signed}\right)$**.
- id: calc-d-quotient
  title: Quotient rule
  topic: Quotient rule
  vars:
    a: {min: -6, max: 6}
    b: {min: -9, max: 9}
    c: {min: 1, max: 9}
  where: ["a != 0", "b != 0"]
  calc:
    na: -a
    nb2: -2*b
    ac: a*c
  prompt: 'Differentiate $y = \dfrac{{a:coef}x {b:signed}}{x^2 + {c}}$ and simplify the numerator.'
  answers:
    - kind: expression
      expression: '(-a*x^2 - 2*b*x + a*c)/(x^2 + c)^2'
      label: '$y'' =$'
      show: '$\dfrac{{na:coef}x^2 {nb2:signedcoef}x {ac:signed}}{(x^2 + {c})^2}$'
  solution: |-
    Lo d-hi minus hi d-lo, over lo squared:
    $$y' = \frac{{a}(x^2 + {c}) - ({a:coef}x {b:signed})(2x)}{(x^2 + {c})^2}.$$
    Expand the top and collect like terms; the result is **$\dfrac{{na:coef}x^2 {nb2:signedcoef}x {ac:signed}}{(x^2 + {c})^2}$**.
- id: calc-d-trig-deriv
  title: Derivative with trig functions
  topic: Trig derivatives
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
  where: ["a != 0", "b != 0"]
  calc:
    a2: 2*a
    nb: -b
  prompt: 'Differentiate $y = {a:coef}x^2\sin x {b:signedcoef}\cos x$.'
  answers:
    - kind: expression
      expression: '2*a*x*sin(x) + a*x^2*cos(x) - b*sin(x)'
      label: '$y'' =$'
      show: '${a2}x\sin x {a:signedcoef}x^2\cos x {nb:signedcoef}\sin x$'
  solution: |-
    Product rule on the first term: $\dfrac{d}{dx}\left[{a:coef}x^2\sin x\right] = {a2}x\sin x {a:signedcoef}x^2\cos x$. Then $\dfrac{d}{dx}\left[{b:coef}\cos x\right] = {nb:coef}\sin x$. Together: **$y' = {a2}x\sin x {a:signedcoef}x^2\cos x {nb:signedcoef}\sin x$**.
- id: calc-d-trig-tangent
  title: Slope of a trig curve
  topic: Trig derivatives
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    p: {choices: [{label: '\tfrac{\pi}{6}', value: 0.5235987755982988}, {label: '\tfrac{\pi}{4}', value: 0.7853981633974483}, {label: '\tfrac{\pi}{3}', value: 1.0471975511965976}, {label: '\tfrac{2\pi}{3}', value: 2.0943951023931953}, {label: '\pi', value: 3.141592653589793}]}
  where: ["a != 0", "b != 0"]
  funcs:
    f(x): a*sin(x) + b*cos(x)
  calc:
    m: a*cos(p) - b*sin(p)
    yp: f(p)
    nb: -b
  prompt: 'Find the slope of $y = {a:coef}\sin x {b:signedcoef}\cos x$ at $x = {p}$, to 3 decimal places.'
  answers:
    - {name: m, label: 'Slope', tolerance: 0.001, format: dp3}
  figure:
    type: plot
    x: [-1, 7]
    y: [-6, 6]
    functions: [f]
    tangents:
      - {f: f, at: p}
    points:
      - {at: [p, yp]}
  solution: |-
    $y' = {a:coef}\cos x {nb:signedcoef}\sin x$. At $x = {p}$: $y' = {a:coef}\cos\left({p}\right) {nb:signedcoef}\sin\left({p}\right) \approx$ **{m:dp3}**.
- id: calc-d-chain-power
  title: Chain rule on a power
  topic: Chain rule
  vars:
    a: {min: 2, max: 6}
    b: {min: -9, max: 9}
    n: {min: 3, max: 7}
  where: ["b != 0"]
  calc:
    k: 2*a*n
    n1: n - 1
  prompt: 'Differentiate $y = ({a}x^2 {b:signed})^{n}$.'
  answers:
    - kind: expression
      expression: 'n*(a*x^2 + b)^(n-1)*2*a*x'
      label: '$y'' =$'
      show: '${k}x({a}x^2 {b:signed})^{{n1}}$'
  solution: |-
    Outside: $u^{n}$, derivative ${n}u^{{n1}}$. Inside: $u = {a}x^2 {b:signed}$, derivative $2\cdot{a}x$. Multiply: **$y' = {k}x({a}x^2 {b:signed})^{{n1}}$**.
- id: calc-d-chain-trig
  title: Chain rule inside cosine
  topic: Chain rule
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
  where: ["a != 0", "b != 0"]
  calc:
    a2: 2*a
    na2: -2*a
    nb: -b
  prompt: 'Differentiate $y = \cos({a:coef}x^2 {b:signedcoef}x)$.'
  answers:
    - kind: expression
      expression: '-(2*a*x + b)*sin(a*x^2 + b*x)'
      label: '$y'' =$'
      show: '$({na2:coef}x {nb:signed})\sin({a:coef}x^2 {b:signedcoef}x)$'
  solution: |-
    Outside $\cos u$ has derivative $-\sin u$; inside $u = {a:coef}x^2 {b:signedcoef}x$ has derivative ${a2}x {b:signed}$. So $y' = -({a2}x {b:signed})\sin({a:coef}x^2 {b:signedcoef}x)$, which is **$y' = ({na2:coef}x {nb:signed})\sin({a:coef}x^2 {b:signedcoef}x)$**. Keep the inside unchanged inside the sine.
- id: calc-d-implicit-slope
  title: Slope by implicit differentiation
  topic: Implicit differentiation
  vars:
    a: {min: -4, max: 4}
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
  where: ["a != 0", "p != 0", "q != 0", "a*p + 2*q != 0", "2*p + a*q != 0"]
  calc:
    c: p^2 + a*p*q + q^2
    num: -(2*p + a*q)
    den: a*p + 2*q
    m: -(2*p + a*q)/(a*p + 2*q)
  prompt: 'The point $({p}, {q})$ lies on $x^2 {a:signedcoef}xy + y^2 = {c}$. Find $\dfrac{dy}{dx}$ there, as an exact fraction.'
  answers:
    - {name: m, kind: fraction, lowestTerms: true, label: '$\dfrac{dy}{dx} =$'}
  solution: |-
    Differentiate both sides in $x$ (product rule on $xy$):
    $$2x {a:signedcoef}\left(y + x\frac{dy}{dx}\right) + 2y\frac{dy}{dx} = 0.$$
    Collect: $\dfrac{dy}{dx}\left({a:coef}x + 2y\right) = -(2x {a:signedcoef}y)$, so $\dfrac{dy}{dx} = -\dfrac{2x {a:signedcoef}y}{{a:coef}x + 2y}$. At $({p}, {q})$: $\dfrac{{num}}{{den}} =$ **{m:frac}**.
- id: calc-d-inverse-trig
  title: Derivative of an inverse trig function
  topic: Inverse trig derivatives
  vars:
    a: {min: 2, max: 9}
    n: {choices: [3, 4, 5]}
  calc:
    a2: a^2
    an: a*n
    n1: n - 1
    n2: 2*n
  prompt: 'Differentiate $y = \arctan({a}x^{n})$.'
  answers:
    - kind: expression
      expression: 'a*n*x^(n-1)/(1 + a^2*x^(2*n))'
      label: '$y'' =$'
      show: '$\dfrac{{an}x^{{n1}}}{1 + {a2}x^{{n2}}}$'
  solution: |-
    $\dfrac{d}{dx}\arctan u = \dfrac{u'}{1 + u^2}$ with $u = {a}x^{n}$, $u' = {an}x^{{n1}}$. So **$y' = \dfrac{{an}x^{{n1}}}{1 + {a2}x^{{n2}}}$**.
- id: calc-d-exp-log-deriv
  title: Derivative with ln and exp
  topic: Exponential and log derivatives
  vars:
    a: {min: 1, max: 6}
    b: {min: 1, max: 9}
    c: {min: -5, max: 5}
    k: {min: -4, max: 4}
  where: ["c != 0", "k != 0", "abs(k) != 1"]
  calc:
    a2: 2*a
    ck: c*k
  prompt: 'Differentiate $y = \ln({a:coef}x^2 + {b}) {c:signedcoef}e^{{k}x}$.'
  answers:
    - kind: expression
      expression: '2*a*x/(a*x^2 + b) + c*k*e^(k*x)'
      label: '$y'' =$'
      show: '$\dfrac{{a2}x}{{a:coef}x^2 + {b}} {ck:signed}e^{{k}x}$'
  solution: |-
    $(\ln u)' = \dfrac{u'}{u}$ with $u = {a:coef}x^2 + {b}$ gives $\dfrac{{a2}x}{{a:coef}x^2 + {b}}$. The chain rule gives $\dfrac{d}{dx}e^{{k}x} = {k}e^{{k}x}$. So **$y' = \dfrac{{a2}x}{{a:coef}x^2 + {b}} {ck:signed}e^{{k}x}$**.
- id: calc-d-inverse-fn-deriv
  title: Derivative of an inverse function
  topic: Exponential and log derivatives
  vars:
    a: {min: 1, max: 6}
    b: {min: -9, max: 9}
    p: {min: -3, max: 3}
  where: ["b != 0"]
  calc:
    bv: p^3 + a*p + b
    d: 3*p^2 + a
    r: 1/(3*p^2 + a)
  prompt: 'Let $f(x) = x^3 {a:signedcoef}x {b:signed}$ (which is one-to-one). Given that $f({p}) = {bv}$, find $(f^{-1})''({bv})$ as an exact fraction.'
  answers:
    - {name: r, kind: fraction, lowestTerms: true, label: '$(f^{-1})''({bv}) =$'}
  solution: |-
    $(f^{-1})'(b) = \dfrac{1}{f'(a)}$ where $f(a) = b$. Here $f({p}) = {bv}$, and $f'(x) = 3x^2 {a:signed}$, so $f'({p}) = {d}$. Therefore $(f^{-1})'({bv}) =$ **{r:frac}**. (Evaluate $f'$ at ${p}$, not at ${bv}$.)
