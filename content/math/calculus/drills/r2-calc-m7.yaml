# Round 2, module 7 drills (honors lessons)
- id: calc-m7-r2-centroid-between
  title: Centroid of the region between a line and a parabola
  topic: Center of mass
  vars:
    m: {min: 1, max: 4}
  calc:
    A: m^3/6
    My: m^4/12
    Mx: m^5/15
    xb: m/2
    yb: 2*m^2/5
    m2: m^2
  prompt: 'Find the centroid $(\bar x, \bar y)$ of the region between $y = {m:coef}x$ and $y = x^2$. (Exact fractions.)'
  answers:
    - {name: xb, kind: fraction, lowestTerms: true, label: '$\bar x =$'}
    - {name: yb, kind: fraction, lowestTerms: true, label: '$\bar y =$'}
  figure:
    type: plot
    x: [-0.3, 'm + 0.3']
    y: [-0.3, 'm^2 + 0.3']
    functions: ['m*x', 'x^2']
    shade: [{f: 'm*x', g: 'x^2', from: 0, to: m}]
    points: [{at: [xb, yb]}]
  solution: |-
    The curves meet at $x = 0$ and $x = {m}$, and the line is on top between them.
    $A = \displaystyle\int_0^{{m}}\left({m:coef}x - x^2\right)dx = {A:texfrac}$.
    $M_y = \displaystyle\int_0^{{m}}x\left({m:coef}x - x^2\right)dx = {My:texfrac}$, so $\bar x = M_y/A =$ **{xb:frac}**.
    $M_x = \displaystyle\int_0^{{m}}\tfrac12\left({m2:coef}x^2 - x^4\right)dx = {Mx:texfrac}$, so $\bar y = M_x/A =$ **{yb:frac}**.
- id: calc-m7-r2-pappus-torus
  title: Torus volume and surface area by Pappus
  topic: Theorems of Pappus
  vars:
    Rc: {min: 3, max: 8}
    rd: {min: 1, max: 3}
  where: ["Rc > rd"]
  calc:
    V: 2*pi^2*Rc*rd^2
    S: 4*pi^2*Rc*rd
    cV: 2*Rc*rd^2
    cS: 4*Rc*rd
    rd2: rd^2
  prompt: 'A torus is made by rotating a disk of radius {rd} about a line in its plane {Rc} units from the disk''s center. Use the theorems of Pappus to find its volume and its surface area. (3 significant figures.)'
  answers:
    - {name: V, label: 'Volume', sigfigs: 3}
    - {name: S, label: 'Surface area', sigfigs: 3}
  solution: |-
    The disk has area $\pi\cdot{rd}^2 = {rd2}\pi$, and its centroid (the center) travels a circle of length $2\pi\cdot{Rc}$:
    $$V = 2\pi\cdot{Rc}\cdot{rd2}\pi = {cV}\pi^2 \approx \mathbf{{V:sig3}}.$$
    The surface comes from the boundary circle, of length $2\pi\cdot{rd}$, whose centroid is also the center:
    $$S = 2\pi\cdot{Rc}\cdot2\pi\cdot{rd} = {cS}\pi^2 \approx \mathbf{{S:sig3}}.$$
- id: calc-m7-r2-pappus-line
  title: Volume about a line by Pappus
  topic: Theorems of Pappus
  vars:
    m: {min: 1, max: 3}
    k: {min: 1, max: 4}
  calc:
    A: m^3/6
    yb: 2*m^2/5
    d: 2*m^2/5 + k
    c: 2*(2*m^2/5 + k)*m^3/6
    V: pi*2*(2*m^2/5 + k)*m^3/6
  prompt: 'The region between $y = {m:coef}x$ and $y = x^2$ has area ${A:texfrac}$ and centroid height $\bar y = {yb:texfrac}$. Use Pappus to find the volume when it is rotated about the line $y = -{k}$. (Exact, like 7pi/15, or 3 decimals.)'
  answers:
    - {name: V, label: 'Volume', relTolerance: 0.0005, format: num4}
  figure:
    type: plot
    x: [-0.5, 'm + 0.5']
    y: ['-k - 0.5', 'm^2 + 0.5']
    functions: ['m*x', 'x^2']
    shade: [{f: 'm*x', g: 'x^2', from: 0, to: m}]
    segments: [{from: [-0.5, '-k'], to: ['m + 0.5', '-k'], dashed: true}]
    points: [{at: [m/2, yb]}]
  solution: |-
    The region lies above the axis $y = -{k}$, so the centroid is $\bar r = {yb:texfrac} + {k} = {d:texfrac}$ from it. By Pappus,
    $$V = 2\pi\bar r A = 2\pi\cdot{d:texfrac}\cdot{A:texfrac} = {c:texfrac}\,\pi \approx \mathbf{{V:num4}}.$$
- id: calc-m7-r2-pdf-power
  title: Normalize a density and find a probability
  topic: Probability density functions
  vars:
    n: {min: 2, max: 3}
    b: {min: 2, max: 4}
    c: {min: 1, max: 3}
  where: ["c < b"]
  calc:
    n1: n + 1
    k: (n + 1)/b^(n + 1)
    P: (c/b)^(n + 1)
  prompt: 'The function $f(x) = kx^{n}$ for $0 \le x \le {b}$ (and 0 elsewhere) is a probability density. Find $k$, then $P(X \le {c})$. (Exact fractions.)'
  answers:
    - {name: k, kind: fraction, lowestTerms: true, label: '$k =$'}
    - {name: P, kind: fraction, lowestTerms: true, label: 'Probability'}
  figure:
    type: plot
    x: [-0.3, 'b + 0.3']
    y: [-0.1, 'k*b^n*1.15']
    functions: [{f: 'k*x^n', from: 0, to: b}]
    shade: [{f: 'k*x^n', from: 0, to: c}]
  solution: |-
    Total area 1: $\displaystyle\int_0^{{b}}kx^{n}\,dx = k\cdot\frac{{b}^{{n1}}}{{n1}} = 1$, so $k =$ **{k:frac}**.
    Then $P(X \le {c}) = \displaystyle\int_0^{{c}}kx^{n}\,dx = k\cdot\frac{{c}^{{n1}}}{{n1}} = \left(\frac{{c}}{{b}}\right)^{{n1}} =$ **{P:frac}**.
- id: calc-m7-r2-pdf-mean-median
  title: Mean and median of a density
  topic: Probability density functions
  vars:
    n: {min: 2, max: 3}
    b: {min: 2, max: 4}
  calc:
    n1: n + 1
    n2: n + 2
    bn: b^(n + 1)
    mu: (n + 1)*b/(n + 2)
    med: b*0.5^(1/(n + 1))
  prompt: '$X$ has density $f(x) = \dfrac{{n1}x^{n}}{{bn}}$ for $0 \le x \le {b}$ (and 0 elsewhere). Find its mean (exact fraction) and its median (3 decimal places).'
  answers:
    - {name: mu, kind: fraction, lowestTerms: true, label: 'Mean'}
    - {name: med, label: 'Median', tolerance: 0.0006, format: dp3}
  solution: |-
    Mean: $\mu = \displaystyle\int_0^{{b}}x\cdot\frac{{n1}x^{n}}{{bn}}\,dx = \frac{{n1}}{{bn}}\cdot\frac{{b}^{{n2}}}{{n2}} =$ **{mu:frac}**.
    CDF: $F(x) = \displaystyle\int_0^{x}\frac{{n1}t^{n}}{{bn}}\,dt = \left(\frac{x}{{b}}\right)^{{n1}}$. Median: $\left(\frac{m}{{b}}\right)^{{n1}} = \frac12$, so $m = {b}\cdot\left(\tfrac12\right)^{1/{n1}} \approx$ **{med:dp3}**.
- id: calc-m7-r2-exponential
  title: Exponential waiting times
  topic: Probability density functions
  vars:
    mu: {min: 2, max: 12}
    tw: {min: 1, max: 15}
  where: ["tw <= 3*mu"]
  calc:
    P: exp(-tw/mu)
    med: mu*ln(2)
  prompt: 'The time until the next call at a help desk is modeled as exponential with mean {mu} minutes. Find the probability of waiting more than {tw} minutes (4 decimal places) and the median wait in minutes (2 decimal places).'
  answers:
    - {name: P, label: 'Probability', tolerance: 0.00006, format: num4}
    - {name: med, label: 'Median', tolerance: 0.006, format: num2}
  solution: |-
    The rate is $\lambda = \frac{1}{{mu}}$ per minute, and $P(X > x) = e^{-\lambda x}$:
    $$P(X > {tw}) = e^{-{tw}/{mu}} \approx \mathbf{{P:num4}}.$$
    The median solves $1 - e^{-m/{mu}} = \frac12$, so $m = {mu}\ln2 \approx$ **{med:num2}** minutes.
