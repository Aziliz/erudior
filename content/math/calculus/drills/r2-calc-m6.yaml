# Integrals and the Fundamental Theorem (calc-m6): round 2 drills for the honors lessons
- id: calc-m6-r2-ln-sums
  title: Bounding a logarithm with Riemann sums
  topic: Functions defined by integrals
  vars:
    b: {choices: [2, 3, 5]}
  funcs:
    f(x): 1/x
    gl(i): f(1 + (i - 1)*dx)*dx
    gr(i): f(1 + i*dx)*dx
  calc:
    dx: (b - 1)/4
    x1: 1 + dx
    x2: 1 + 2*dx
    x3: 1 + 3*dx
    L: sum(gl, 1, 4)
    R: sum(gr, 1, 4)
    lnb: ln(b)
  prompt: 'Using $\ln {b} = \displaystyle\int_1^{{b}}\frac{dt}{t}$, compute the left and right Riemann sums with $n = 4$ equal subintervals. Round each to 4 decimal places.'
  answers:
    - {name: L, label: '$L_4 =$', tolerance: 0.0001, format: num4}
    - {name: R, label: '$R_4 =$', tolerance: 0.0001, format: num4}
  solution: |-
    $\Delta t = \dfrac{{b} - 1}{4} = {dx}$, with endpoints $1, {x1}, {x2}, {x3}, {b}$.
    The left sum uses the first four: $L_4 = {dx}\left(\frac11 + \frac{1}{{x1}} + \frac{1}{{x2}} + \frac{1}{{x3}}\right) =$ **{L:num4}**.
    The right sum uses the last four: $R_4 = {dx}\left(\frac{1}{{x1}} + \frac{1}{{x2}} + \frac{1}{{x3}} + \frac{1}{{b}}\right) =$ **{R:num4}**.
    Since $\frac1t$ is decreasing, $R_4 < \ln {b} < L_4$ (indeed $\ln {b} \approx {lnb:num4}$).
- id: calc-m6-r2-integral-equation
  title: Solve an integral equation
  topic: Functions defined by integrals
  vars:
    c: {min: 2, max: 9}
    k: {min: -4, max: 4}
  where: ["k != 0"]
  calc:
    ck: c*k
    nk: -k
  prompt: 'Find the continuous function $f$ that satisfies $f(x) = {c} {k:signedcoef}\displaystyle\int_0^x f(t)\,dt$ for all $x$.'
  answers:
    - kind: expression
      expression: 'c*exp(k*x)'
      label: '$f(x) =$'
      show: '${c}e^{{k:coef}x}$'
  solution: |-
    Differentiate both sides (FTC 1): $f'(x) = {k:coef}f(x)$. Set $x = 0$, where the integral is 0: $f(0) = {c}$.
    The function ${c}e^{{k:coef}x}$ has both properties, and it is the only one: $h(x) = f(x)e^{{nk:coef}x}$ has $h' = (f' {nk:signedcoef}f)e^{{nk:coef}x} = 0$, so $h$ is constant, $h(0) = {c}$.
    So **$f(x) = {c}e^{{k:coef}x}$**. Check: $f'(0) = {ck}$, which matches ${k}\cdot f(0)$.
- id: calc-m6-r2-sum-to-integral
  title: Limit of a Riemann sum
  topic: Sums and integrals
  vars:
    a: {min: 1, max: 3}
    w: {min: 2, max: 4}
    p: {choices: [2, 3]}
  calc:
    bb: a + w
    p1: p + 1
    top: bb^p1
    bot: a^p1
    diff: top - bot
    val: diff/p1
  prompt: 'Evaluate $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac{{w}}{n}\left({a} + \frac{{w}i}{n}\right)^{{p}}$. Give an exact fraction or a decimal rounded to 2 places.'
  answers:
    - {name: val, label: 'Limit $=$', tolerance: 0.006, format: num2}
  solution: |-
    The width is $\Delta x = \frac{{w}}{n}$ and the sample point is $x_i = {a} + i\,\Delta x$, so the interval is $[{a}, {bb}]$ and $f(x) = x^{{p}}$.
    $$\int_{{a}}^{{bb}}x^{{p}}\,dx = \left[\frac{x^{{p1}}}{{p1}}\right]_{{a}}^{{bb}} = \frac{{top:dp0} - {bot:dp0}}{{p1}} = {val:texfrac}.$$
    So the limit is **${val:texfrac} \approx {val:num2}$**.
- id: calc-m6-r2-lr-error
  title: Subintervals needed for a left or right sum
  topic: Sums and integrals
  vars:
    c: {min: 2, max: 4}
    p: {choices: [2, 3]}
    m: {choices: [10, 20, 100]}
  calc:
    tol: 1/m
    fb: c^p
    p1: p + 1
    N: c^(p + 1)*m
  prompt: 'For $\displaystyle\int_0^{{c}}x^{{p}}\,dx$, use the bound $\lvert R_n - L_n\rvert = \lvert f(b) - f(a)\rvert\,\Delta x$ to find the smallest number of equal subintervals $n$ that guarantees a left or right sum is within ${tol}$ of the integral.'
  answers:
    - {name: N, label: '$n =$', format: integer}
  solution: |-
    $x^{{p}}$ is increasing on $[0, {c}]$, so the integral lies between $L_n$ and $R_n$, and each is within $R_n - L_n = \big(f({c}) - f(0)\big)\dfrac{{c}}{n} = \dfrac{{fb}\cdot{c}}{n}$ of it.
    Require $\dfrac{{fb}\cdot{c}}{n} \le {tol}$, so $n \ge {fb}\cdot{c}\cdot{m}$. The smallest such $n$ is **{N}**.
