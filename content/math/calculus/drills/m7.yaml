# Module 7 drills: applications of integration
- id: calc-d-area-between
  title: Area between a parabola and a line
  topic: Area between curves
  vars:
    r1: {min: -4, max: 1}
    gap: {min: 1, max: 5}
  where: ["r1 != 0", "r1 + gap != 0", "2*r1 + gap != 0"]
  calc:
    r2: r1 + gap
    m: 2*r1 + gap
    k: -r1*(r1 + gap)
    A: gap^3/6
    y1: r1^2
    y2: (r1 + gap)^2
  prompt: 'Find the area of the region between $y = x^2$ and $y = {m:coef}x {k:signed}$. (Exact fraction.)'
  answers:
    - {name: A, kind: fraction, lowestTerms: true, label: 'Area'}
  figure:
    type: plot
    x: ['r1 - 1', 'r2 + 1']
    y: [-1, 'max(y1, y2) + 2']
    functions: ['x^2', 'm*x + k']
    shade: [{f: 'm*x + k', g: 'x^2', from: r1, to: r2}]
  solution: |-
    Intersections: $x^2 = {m:coef}x {k:signed}$ gives $(x - ({r1}))(x - ({r2})) = 0$, so $x = {r1}$ and $x = {r2}$. Between them the line is on top. 
    $$A = \int_{{r1}}^{{r2}}\left({m:coef}x {k:signed} - x^2\right)dx = \frac{({r2} - ({r1}))^3}{6} = \mathbf{{A:texfrac}}.$$
    (For a line cutting a parabola $y = x^2$ at $x = p$ and $x = q$, the area is always $\frac{(q - p)^3}{6}$.)
- id: calc-d-area-y
  title: Area with horizontal slices
  topic: Area between curves
  vars:
    a: {min: 1, max: 4}
    k: {min: 1, max: 4}
  calc:
    A: a*k^3/6
    ak: a*k
  prompt: 'Find the area of the region between the curve $x = {a:coef}y({k} - y)$ and the $y$-axis. (Exact fraction.)'
  answers:
    - {name: A, kind: fraction, lowestTerms: true, label: 'Area'}
  figure:
    type: plot
    x: [-1, 'a*k^2/4 + 1']
    y: [-1, 'k + 1']
    equal: true
    curves: [{x: 'a*t*(k - t)', y: t, t: [0, k]}]
  solution: |-
    The curve meets the $y$-axis ($x = 0$) at $y = 0$ and $y = {k}$, and is to the right of it in between. Horizontal slices: right minus left is ${a:coef}y({k} - y) - 0$.
    $$A = \int_0^{{k}}\left({ak:coef}y - {a:coef}y^2\right)dy = \frac{{ak}\cdot{k}^2}{2} - \frac{{a}\cdot{k}^3}{3} = \mathbf{{A:texfrac}}.$$
- id: calc-d-disk
  title: Volume by disks
  topic: Volumes by slicing
  vars:
    n: {choices: [{label: '\sqrt{x}', value: 0.5}, {label: 'x', value: 1}, {label: 'x^2', value: 2}]}
    b: {min: 1, max: 3}
  calc:
    p: 2*n + 1
    p1: 2*n
    V: pi*b^(2*n + 1)/(2*n + 1)
    c: b^(2*n + 1)/(2*n + 1)
  prompt: 'The region under $y = {n}$ for $0 \le x \le {b}$ is rotated about the $x$-axis. Find the volume. (Exact, like 8pi/3, or 3 decimals.)'
  answers:
    - {name: V, label: 'Volume', relTolerance: 0.0005, format: num4}
  solution: |-
    Disks of radius $R = {n}$: $V = \pi\displaystyle\int_0^{{b}}\left({n}\right)^2dx = \pi\int_0^{{b}}x^{{p1}}\,dx = \pi\cdot\frac{{b}^{{p}}}{{p}} \approx$ **{V:num4}** (that is, ${c:num4}\pi$).
- id: calc-d-washer
  title: Volume by washers
  topic: Volumes by slicing
  vars:
    m: {min: 1, max: 3}
  calc:
    V: 2*pi*m^5/15
    m2: m^2
    m5: m^5
  prompt: 'The region between $y = {m:coef}x$ and $y = x^2$ is rotated about the $x$-axis. Find the volume. (Exact or 3 decimals.)'
  answers:
    - {name: V, label: 'Volume', relTolerance: 0.0005, format: num4}
  figure:
    type: plot
    x: [-0.5, 'm + 0.5']
    y: [-0.5, 'm^2 + 1']
    functions: ['m*x', 'x^2']
    shade: [{f: 'm*x', g: 'x^2', from: 0, to: m}]
  solution: |-
    The curves meet at $x = 0$ and $x = {m}$; the line is farther from the axis. Washers with $R = {m:coef}x$, $r = x^2$:
    $$V = \pi\int_0^{{m}}\left({m2:coef}x^2 - x^4\right)dx = \pi\left(\frac{{m2}\cdot{m}^3}{3} - \frac{{m}^5}{5}\right) = \frac{2\cdot{m5}\,\pi}{15} \approx \mathbf{{V:num4}}.$$
- id: calc-d-cross-section
  title: Volume with known cross sections
  topic: Volumes by slicing
  vars:
    b: {min: 2, max: 6}
    h: {min: 1, max: 4}
    shape: {choices: [{label: squares, value: 1}, {label: semicircles (diameter in the base), value: 0.39269908169872414}, {label: equilateral triangles, value: 0.4330127018922193}]}
  calc:
    base: h^2*b/3
    V: shape*h^2*b/3
  prompt: 'The base of a solid is the triangle with vertices $(0, 0)$, $({b}, 0)$ and $(0, {h})$. Cross sections perpendicular to the $x$-axis are {shape}. Find the volume. (4 significant figures.)'
  answers:
    - {name: V, label: 'Volume', relTolerance: 0.0005, format: num4}
  figure:
    type: plot
    x: [-0.5, 'b + 0.5']
    y: [-0.5, 'h + 0.5']
    functions: [{f: 'h*(1 - x/b)', from: 0, to: b}]
    shade: [{f: 'h*(1 - x/b)', from: 0, to: b}]
  solution: |-
    At position $x$ the base runs from $y = 0$ up to the hypotenuse $y = {h}\left(1 - \tfrac{x}{{b}}\right)$, so the side is $s = {h}\left(1 - \tfrac{x}{{b}}\right)$. Then $\int_0^{{b}}s^2\,dx = \dfrac{{h}^2\cdot{b}}{3} = {base:num4}$. The area of each cross section is $s^2$ times a constant (1 for squares, $\frac\pi8$ for semicircles, $\frac{\sqrt3}{4}$ for equilateral triangles), so $V \approx$ **{V:sig4}**.
- id: calc-d-shell
  title: Volume by shells
  topic: Shell method
  vars:
    a: {min: 1, max: 4}
    k: {min: 1, max: 3}
  calc:
    V: pi*a^4/6 + pi*k*a^3/3
  prompt: 'The region between $y = {a:coef}x - x^2$ and the $x$-axis is rotated about the line $x = -{k}$. Use shells to find the volume. (Exact or 3 decimals.)'
  answers:
    - {name: V, label: 'Volume', relTolerance: 0.0005, format: num4}
  figure:
    type: plot
    x: ['-k - 1', 'a + 1']
    y: [-0.5, 'a^2/4 + 1']
    functions: [{f: 'a*x - x^2', from: 0, to: a}]
    shade: [{f: 'a*x - x^2', from: 0, to: a}]
    segments: [{from: ['-k', -0.5], to: ['-k', 'a^2/4 + 1'], dashed: true}]
  solution: |-
    The region spans $0 \le x \le {a}$. A vertical strip at $x$ has height ${a:coef}x - x^2$ and distance $x + {k}$ from the axis $x = -{k}$.
    $$V = 2\pi\int_0^{{a}}(x + {k})({a:coef}x - x^2)\,dx \approx \mathbf{{V:num4}}.$$
    (Expanding: $2\pi\left[\frac{{a}^4}{12} + {k}\cdot\frac{{a}^3}{6}\right]$.)
- id: calc-d-arc-length
  title: Arc length of a parabola (numerical)
  topic: Arc length
  vars:
    a: {choices: [0.5, 1, 1.5, 2]}
    b: {min: 1, max: 3}
  funcs:
    g(x): sqrt(1 + 4*a^2*x^2)
  calc:
    L: integ(g, 0, b)
    a2: 4*a^2
    ad: 2*a
    chord: sqrt(b^2 + a^2*b^4)
  prompt: 'Set up and evaluate (with a calculator) the length of $y = {a:coef}x^2$ from $x = 0$ to $x = {b}$. (3 decimals)'
  answers:
    - {name: L, label: 'Length', tolerance: 0.001, format: dp3}
  figure:
    type: plot
    x: [-0.5, 'b + 0.5']
    y: [-0.5, 'a*b^2 + 1']
    functions: [{f: 'a*x^2', from: 0, to: b}]
  solution: |-
    $y' = {ad:coef}x$, so $L = \displaystyle\int_0^{{b}}\sqrt{1 + {a2:coef}x^2}\,dx \approx$ **{L:dp3}**. Check: the straight chord from $(0, 0)$ to the endpoint has length {chord:dp3}, and the curve is a bit longer.
- id: calc-d-surface-area
  title: Surface area of revolution
  topic: Surface area
  vars:
    b: {min: 1, max: 6}
  calc:
    S: pi*((4*b + 1)^1.5 - 1)/6
    b4: 4*b + 1
  prompt: 'Find the area of the surface formed by rotating $y = \sqrt x$, $0 \le x \le {b}$, about the $x$-axis. (3 decimals.)'
  answers:
    - {name: S, label: 'Surface area', relTolerance: 0.0005}
  solution: |-
    $y' = \dfrac{1}{2\sqrt x}$, so $y\sqrt{1 + (y')^2} = \sqrt x\sqrt{1 + \dfrac{1}{4x}} = \sqrt{x + \tfrac14}$.
    $$S = 2\pi\int_0^{{b}}\sqrt{x + \tfrac14}\,dx = 2\pi\cdot\frac23\left[\left(x + \tfrac14\right)^{3/2}\right]_0^{{b}} = \frac{\pi}{6}\left({b4}^{3/2} - 1\right) \approx \mathbf{{S:dp3}}.$$
- id: calc-d-work-spring
  title: Work stretching a spring
  topic: Work
  vars:
    F: {min: 10, max: 60, step: 5}
    d: {min: 2, max: 10}
    s1: {min: 0, max: 6}
    w: {min: 2, max: 10}
  calc:
    s2: s1 + w
    k: F/(d/100)
    W: (F/(d/100))/2*((s2/100)^2 - (s1/100)^2)
    m1: s1/100
    m2: (s1 + w)/100
  prompt: 'A force of {F} N holds a spring stretched {d} cm beyond its natural length. How much work (in joules) does it take to stretch it from {s1} cm to {s2} cm beyond natural length? (4 significant figures.)'
  answers:
    - {name: W, label: 'Work', relTolerance: 0.0005, units: {J: 1}}
  solution: |-
    Convert to meters. $k = \dfrac{{F}}{{d}/100} = {k:dp2}$ N/m. Then
    $$W = \int_{{m1}}^{{m2}}{k:dp2}\,x\,dx = \frac{{k:dp2}}{2}\left({m2}^2 - {m1}^2\right) \approx \mathbf{{W:sig4}}\text{ J}.$$
- id: calc-d-work-pump
  title: Work to pump out a tank
  topic: Work
  vars:
    r: {min: 1, max: 4}
    H: {min: 2, max: 8}
    o: {min: 0, max: 3}
  calc:
    W: 9800*pi*r^2*(H^2/2 + o*H)
    r2: r^2
    top: H + o
  prompt: 'A cylindrical tank with radius {r} m and height {H} m is full of water. How much work is needed to pump all the water to a point {o} m above the top of the tank? Use $\rho g = 9800$ N/m³. (3 significant figures, in J.)'
  answers:
    - {name: W, label: 'Work (J)', sigfigs: 3, format: sci}
  solution: |-
    Put $y = 0$ at the bottom. A layer at height $y$ has volume $\pi({r})^2\,dy$, weight $9800\pi\cdot{r2}\,dy$, and is lifted to height ${top}$, a distance ${top} - y$.
    $$W = \int_0^{{H}}9800\pi\cdot{r2}\,({top} - y)\,dy = 9800\pi\cdot{r2}\left({top}\cdot{H} - \frac{{H}^2}{2}\right) \approx \mathbf{{W:texsci}}\text{ J}.$$
- id: calc-d-centroid
  title: Centroid of the region under a power
  topic: Center of mass
  vars:
    n: {min: 2, max: 4}
    b: {min: 1, max: 3}
  calc:
    A: b^(n + 1)/(n + 1)
    xb: (n + 1)*b/(n + 2)
    yb: (n + 1)*b^n/(2*(2*n + 1))
    Mx: b^(n + 2)/(n + 2)
    My: b^(2*n + 1)/(2*(2*n + 1))
  prompt: 'Find the centroid $(\bar x, \bar y)$ of the region under $y = x^{n}$ for $0 \le x \le {b}$. (Exact fractions.)'
  answers:
    - {name: xb, kind: fraction, lowestTerms: true, label: '$\bar x =$'}
    - {name: yb, kind: fraction, lowestTerms: true, label: '$\bar y =$'}
  figure:
    type: plot
    x: [-0.3, 'b + 0.3']
    y: [-0.3, 'b^n + 0.3']
    functions: [{f: 'x^n', from: 0, to: b}]
    shade: [{f: 'x^n', from: 0, to: b}]
    points: [{at: [xb, yb]}]
  solution: |-
    $A = \displaystyle\int_0^{{b}}x^{n}dx = {A:texfrac}$. Moments: $\displaystyle\int_0^{{b}}x\cdot x^{n}dx = {Mx:texfrac}$ and $\displaystyle\int_0^{{b}}\tfrac12x^{2\cdot{n}}dx = {My:texfrac}$. Divide by $A$: $\bar x =$ **{xb:frac}**, $\bar y =$ **{yb:frac}**.
