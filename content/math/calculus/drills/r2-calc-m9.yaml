# Round 2 drills, module calc-m9: honors lessons 39h1 (phase lines) and 39h2 (numerical methods)
- id: calc-m9-r2-phase-line
  title: Phase line of a cubic autonomous equation
  topic: Phase lines and stability
  vars:
    p: {min: -3, max: 1}
    g1: {min: 1, max: 3}
    g2: {min: 1, max: 3}
  calc:
    q: p + g1
    r: p + g1 + g2
    np: -p
    nq: -(p + g1)
    y0: p + g1 - 0.5
    dr: -(g1 + g2)*g2
    dq: g1*g2
    dp: -g1*(g1 + g2)
  where: ["p != 0", "p + g1 != 0", "p + g1 + g2 != 0"]
  prompt: 'For $\dfrac{dy}{dt} = (y {np:signed})(y {nq:signed})({r} - y)$, find the unstable equilibrium, the value of $g''(y)$ at the largest equilibrium $y = {r}$ (where $g$ is the right side), and the limit as $t \to \infty$ of the solution with $y(0) = {y0}$.'
  answers:
    - {name: q, label: 'Unstable: $y =$'}
    - {name: dr, label: '$g''({r}) =$'}
    - {name: p, label: '$\lim_{t\to\infty} y =$'}
  solution: |-
    The equilibria are $y = {p}$, ${q}$ and ${r}$. Signs of $g$: for $y > {r}$ the last factor is negative, so $g < 0$; on $({q}, {r})$ all three factors are positive, $g > 0$; on $({p}, {q})$ the middle factor is negative, $g < 0$; below ${p}$ two factors are negative, $g > 0$.

    Phase line: arrows point toward ${p}$ and ${r}$ (stable) and away from **{q}** (unstable).

    Derivative test: at a root, $g'$ is the product of the other two factors with their signs. $g'({r}) = ({r} {np:signed})({r} {nq:signed})(-1) =$ **{dr}** $< 0$, stable. Likewise $g'({q}) = {dq} > 0$ and $g'({p}) = {dp} < 0$.

    The solution starting at ${y0}$ is between ${p}$ and ${q}$, where $g < 0$, so it falls toward **{p}**.
- id: calc-m9-r2-harvest
  title: Logistic growth with constant harvesting
  topic: Phase lines and stability
  vars:
    kr: {choices: [0.2, 0.4, 0.5, 0.8]}
    M: {min: 200, max: 2000, step: 100}
    fr: {choices: [0.36, 0.64, 0.75, 0.84, 0.96]}
  calc:
    msy: kr*M/4
    Hr: fr*kr*M/4
    H: round(fr*kr*M/4)
    s: sqrt(1 - fr)
    half: M/2
    lo: round(M/2*(1 - sqrt(1 - fr)), 6)
    hi: round(M/2*(1 + sqrt(1 - fr)), 6)
    disc: round((M/2)^2*(1 - fr), 6)
  where: ["abs(Hr - round(Hr)) < 1e-9", "abs(msy - round(msy)) < 1e-9"]
  prompt: 'A fish population follows $\dfrac{dP}{dt} = {kr}P\left(1 - \dfrac{P}{{M:dp0}}\right) - {H}$. Find the two equilibria and the maximum sustainable yield (the largest constant harvest that still leaves an equilibrium).'
  answers:
    - {name: lo, label: 'Smaller equilibrium $P =$'}
    - {name: hi, label: 'Larger equilibrium $P =$'}
    - {name: msy, label: 'Maximum sustainable yield $=$'}
  figure:
    type: plot
    x: [0, 'M*1.1']
    y: ['-H*1.3', 'msy*1.2']
    xLabel: P
    yLabel: dP/dt
    functions: ['kr*x*(1 - x/M) - H']
    points: [{at: [lo, 0]}, {at: [hi, 0]}]
  solution: |-
    Set the right side to 0 and multiply by $-\dfrac{{M:dp0}}{{kr}}$: $P^2 - {M:dp0}P + \dfrac{{H}\cdot{M:dp0}}{{kr}} = 0$. The quadratic formula gives
    $$P = {half:dp0} \pm \sqrt{{half:dp0}^2 - \frac{{H}\cdot{M:dp0}}{{kr}}} = {half:dp0} \pm \sqrt{{disc:dp0}},$$
    so $P =$ **{lo:dp0}** (unstable threshold) and $P =$ **{hi:dp0}** (stable).

    The growth term ${kr}P\left(1 - \frac{P}{{M:dp0}}\right)$ is largest at $P = \frac M2 = {half:dp0}$, where it equals $\frac{kM}{4} = \frac{{kr}\cdot{M:dp0}}{4} =$ **{msy:dp0}**. A larger harvest leaves no equilibrium, so that is the maximum sustainable yield.
- id: calc-m9-r2-heun
  title: Improved Euler method, two steps
  topic: Numerical methods for differential equations
  vars:
    a: {min: -2, max: 2}
    y0: {min: -2, max: 3}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ["a != 0", "y0 != 0", "not (y0 == -1 and abs(a) == 1)"]
  calc:
    k1a: a*y0
    p1: y0 + h*a*y0
    k2a: h + a*(y0 + h*a*y0)
    y1: y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0))
    x1: h
    x2: 2*h
    k1b: h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)))
    p2: y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)) + h*(h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0))))
    k2b: 2*h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)) + h*(h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)))))
    y2: y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)) + h/2*((h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)))) + (2*h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)) + h*(h + a*(y0 + h/2*(a*y0 + h + a*(y0 + h*a*y0)))))))
  prompt: 'Use the improved Euler method with $h = {h}$ on $\dfrac{dy}{dx} = x {a:signedcoef}y$, $y(0) = {y0}$ to approximate $y({x1})$ and $y({x2})$. (4 decimals)'
  answers:
    - {name: y1, label: '$y({x1}) \approx$', tolerance: 0.0001, format: num4}
    - {name: y2, label: '$y({x2}) \approx$', tolerance: 0.0001, format: num4}
  solution: |-
    Each step: $k_1 = F(x_n, y_n)$, predict $y_n + hk_1$, $k_2 = F(x_n + h, \text{prediction})$, then $y_{n+1} = y_n + \frac h2(k_1 + k_2)$, with $F(x, y) = x {a:signedcoef}y$.

    | $x_n$ | $y_n$ | $k_1$ | prediction | $k_2$ | $y_{n+1}$ |
    |---|---|---|---|---|---|
    | 0 | {y0} | {k1a:num4} | {p1:num4} | {k2a:num4} | {y1:num4} |
    | {x1} | {y1:num4} | {k1b:num4} | {p2:num4} | {k2b:num4} | {y2:num4} |

    So $y({x1}) \approx$ **{y1:num4}** and $y({x2}) \approx$ **{y2:num4}**.
- id: calc-m9-r2-rk4-step
  title: One step of the Runge–Kutta method (RK4)
  topic: Numerical methods for differential equations
  vars:
    a: {min: -2, max: 2}
    y0: {min: 1, max: 4}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ["a != 0"]
  calc:
    k1: a*y0
    k2: h/2 + a*(y0 + h/2*a*y0)
    k3: h/2 + a*(y0 + h/2*(h/2 + a*(y0 + h/2*a*y0)))
    k4: h + a*(y0 + h*(h/2 + a*(y0 + h/2*(h/2 + a*(y0 + h/2*a*y0)))))
    y1: y0 + h/6*(a*y0 + 2*(h/2 + a*(y0 + h/2*a*y0)) + 2*(h/2 + a*(y0 + h/2*(h/2 + a*(y0 + h/2*a*y0)))) + h + a*(y0 + h*(h/2 + a*(y0 + h/2*(h/2 + a*(y0 + h/2*a*y0))))))
    hh: h/2
  prompt: 'Take one RK4 step with $h = {h}$ on $\dfrac{dy}{dx} = x {a:signedcoef}y$, $y(0) = {y0}$. Find $k_2$ and the estimate of $y({h})$. (4 decimals)'
  answers:
    - {name: k2, label: '$k_2 =$', tolerance: 0.0001, format: num4}
    - {name: y1, label: '$y({h}) \approx$', tolerance: 0.0001, format: num4}
  solution: |-
    With $F(x, y) = x {a:signedcoef}y$ and $\frac h2 = {hh}$:

    - $k_1 = F(0, {y0}) = {k1:num4}$
    - $k_2 = F\left({hh},\ {y0} + {hh}\,k_1\right) =$ **{k2:num4}**
    - $k_3 = F\left({hh},\ {y0} + {hh}\,k_2\right) = {k3:num4}$
    - $k_4 = F\left({h},\ {y0} + {h}\,k_3\right) = {k4:num4}$

    $y_1 = {y0} + \dfrac{{h}}{6}\left(k_1 + 2k_2 + 2k_3 + k_4\right) \approx$ **{y1:num4}**.
- id: calc-m9-r2-euler-stability
  title: Euler's method on a decay equation
  topic: Numerical methods for differential equations
  vars:
    kd: {choices: [4, 5, 8, 10, 20, 25, 40]}
    h: {choices: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3]}
    n: {min: 3, max: 4}
  calc:
    m: round(1 - kd*h, 6)
    yn: round((1 - kd*h)^n, 10)
    hmax: 2/kd
  where: ["abs(1 - kd*h) > 0.01", "abs(1 - kd*h) <= 4"]
  prompt: 'Euler''s method with step $h = {h}$ is applied to $y'' = -{kd}y$, $y(0) = 1$. By what number is $y$ multiplied at each step? What is $y_{{n}}$ (4 decimals)? Below what step size do the computed values shrink toward 0 as the true solution does?'
  answers:
    - {name: m, label: 'Multiplier $=$', tolerance: 0.000001}
    - {name: yn, label: '$y_{{n}} \approx$', tolerance: 0.0001, format: num4}
    - {name: hmax, label: '$h <$', tolerance: 0.000001}
  solution: |-
    Each step: $y_{k+1} = y_k + h(-{kd}y_k) = (1 - {kd}\cdot{h})\,y_k$, so the multiplier is **{m}** and $y_{{n}} = ({m})^{{n}} =$ **{yn:num4}**.

    The values shrink only if $|1 - {kd}h| < 1$, that is $0 < h < \dfrac{2}{{kd}} =$ **{hmax}**. (They shrink without flipping sign only when $h < \frac{1}{{kd}}$.) The true solution $e^{-{kd}x}$ always decays.
