# Module 9 drills: differential equations
- id: calc-d-euler
  title: Euler's method, three steps
  topic: Euler's method
  vars:
    a: {min: -2, max: 2}
    y0: {min: -2, max: 3}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ["a != 0"]
  calc:
    s0: 0 + a*y0
    y1: y0 + h*(0 + a*y0)
    x1: h
    s1: h + a*(y0 + h*(0 + a*y0))
    y2: y0 + h*(0 + a*y0) + h*(h + a*(y0 + h*(0 + a*y0)))
    x2: 2*h
    s2: 2*h + a*(y0 + h*(0 + a*y0) + h*(h + a*(y0 + h*(0 + a*y0))))
    y3: y0 + h*(0 + a*y0) + h*(h + a*(y0 + h*(0 + a*y0))) + h*(2*h + a*(y0 + h*(0 + a*y0) + h*(h + a*(y0 + h*(0 + a*y0)))))
    x3: 3*h
  prompt: 'Use Euler''s method with step size $h = {h}$ to approximate $y({x3})$ for $\dfrac{dy}{dx} = x {a:signedcoef}y$, $y(0) = {y0}$. (Three steps; 4 decimals.)'
  answers:
    - {name: y3, label: '$y({x3}) \approx$', tolerance: 0.0001, format: num4}
  figure:
    type: plot
    x: [-0.2, 'x3 + 0.3']
    y: ['min(y0, y1, y2, y3) - 1', 'max(y0, y1, y2, y3) + 1']
    slopeField: {f: 'x + a*y', step: 'x3/6'}
    segments:
      - {from: [0, y0], to: [x1, y1]}
      - {from: [x1, y1], to: [x2, y2]}
      - {from: [x2, y2], to: [x3, y3]}
  solution: |-
    $y_{n+1} = y_n + {h}\,(x_n {a:signedcoef}y_n)$.

    | $n$ | $x_n$ | $y_n$ | slope | $y_{n+1}$ |
    |---|---|---|---|---|
    | 0 | 0 | {y0} | {s0:num4} | {y1:num4} |
    | 1 | {x1} | {y1:num4} | {s1:num4} | {y2:num4} |
    | 2 | {x2} | {y2:num4} | {s2:num4} | {y3:num4} |

    So $y({x3}) \approx$ **{y3:num4}**.
- id: calc-d-slope-field
  title: Equilibria from a slope field
  topic: Slope fields
  vars:
    r1: {min: -3, max: 1}
    gap: {min: 2, max: 4}
  where: ["r1 != 0", "r1 + gap != 0"]
  calc:
    r2: r1 + gap
    nr1: -r1
    nr2: -r1 - gap
    y0: r1 + 1
  prompt: 'The slope field below is for $\dfrac{dy}{dx} = (y {nr1:signed})({r2} - y)$. Find the stable and the unstable equilibrium solutions. Where does the solution with $y(0) = {y0}$ head as $x \to \infty$?'
  answers:
    - {name: r2, label: 'Stable: $y =$'}
    - {name: r1, label: 'Unstable: $y =$'}
    - {name: r2, label: '$\lim_{x\to\infty} y =$'}
  figure:
    type: plot
    x: [0, 4]
    y: ['r1 - 2', 'r2 + 2']
    slopeField: {f: '(y - r1)*(r2 - y)/3', step: 0.5}
    functions:
      - {f: r1, dashed: true}
      - {f: r2, dashed: true}
  solution: |-
    Equilibria are where $\dfrac{dy}{dx} = 0$: $y = {r1}$ and $y = {r2}$. Check signs: for ${r1} < y < {r2}$ both factors are positive, so solutions rise; above ${r2}$ the slope is negative, so solutions fall. Solutions on both sides move toward $y = {r2}$ (**stable**) and away from $y = {r1}$ (**unstable**; below it the slope is negative too, so solutions drop away). The solution starting at $y = {y0}$, between the two, rises toward **{r2}**.

    (The field is drawn with slopes scaled by $\tfrac13$ to keep the segments readable; their directions are what matter.)
- id: calc-d-separable
  title: Solve a separable equation
  topic: Separable equations
  vars:
    k: {min: 1, max: 3}
    n: {choices: [{label: 'x', value: 1}, {label: 'x^2', value: 2}]}
    A: {min: 1, max: 5}
    x1: {choices: [0.5, 1]}
  calc:
    n1: n + 1
    y1: A*e^(k*x1^(n + 1)/(n + 1))
  prompt: 'Solve $\dfrac{dy}{dx} = {k:coef}{n}y$ with $y(0) = {A}$, then find $y({x1})$. (4 significant figures)'
  answers:
    - {name: y1, label: '$y({x1}) =$', relTolerance: 0.0005, format: sig4}
  solution: |-
    Separate: $\dfrac{dy}{y} = {k:coef}{n}\,dx$. Integrate: $\ln|y| = \dfrac{{k:coef}x^{{n1}}}{{n1}} + C$, so $y = Be^{{k:coef}x^{{n1}}/{n1}}$. At $x = 0$, $y = B = {A}$. So $y = {A:coef}e^{{k:coef}x^{{n1}}/{n1}}$ and $y({x1}) \approx$ **{y1:sig4}**.
- id: calc-d-exp-growth
  title: Exponential growth from two data points
  topic: Exponential and logistic models
  vars:
    P0: {min: 100, max: 900, step: 50}
    ratio: {choices: [1.5, 2, 2.5, 3]}
    t1: {min: 2, max: 8}
    target: {choices: [5, 10, 20]}
  calc:
    P1: P0*ratio
    kr: ln(ratio)/t1
    T: ln(target)/(ln(ratio)/t1)
    goal: P0*target
  prompt: 'A population grows at a rate proportional to its size. It is {P0} at $t = 0$ and {P1:int} at $t = {t1}$ (years). When will it reach {goal:int}? (2 decimals)'
  answers:
    - {name: T, label: '$t \approx$', tolerance: 0.01, format: num2}
  solution: |-
    $P = {P0}e^{kt}$. From $P({t1}) = {P1:dp0}$: $e^{{t1}k} = {ratio}$, so $k = \dfrac{\ln {ratio}}{{t1}} \approx {kr:num4}$. Solve ${P0}e^{kt} =$ {goal:int}: $e^{kt} = {target}$, $t = \dfrac{\ln {target}}{k} \approx$ **{T:num2}** years.
- id: calc-d-logistic
  title: Logistic model
  topic: Exponential and logistic models
  vars:
    cap: {min: 200, max: 900, step: 100}
    frac: {choices: [0.05, 0.1, 0.2, 0.25]}
    rate: {choices: [0.2, 0.3, 0.5, 0.8]}
    t1: {min: 2, max: 8}
  calc:
    P0: cap*frac
    A: (1 - frac)/frac
    Pt: cap/(1 + (1 - frac)/frac*e^(-rate*t1))
    th: ln((1 - frac)/frac)/rate
    half: cap/2
  prompt: 'A population follows $\dfrac{dP}{dt} = {rate}P\left(1 - \dfrac{P}{{cap}}\right)$ with $P(0) = {P0:int}$. Find $P({t1})$ (nearest whole number) and the time when the population grows fastest (2 decimals).'
  answers:
    - {name: Pt, label: '$P({t1}) \approx$', tolerance: 1, format: integer}
    - {name: th, label: 'Fastest at $t \approx$', tolerance: 0.01, format: num2}
  figure:
    type: plot
    x: [0, '2*th + 2']
    y: [0, 'cap*1.1']
    functions: ['cap/(1 + A*e^(-rate*x))', {f: cap, dashed: true}]
    points: [{at: [th, half]}]
  solution: |-
    $P(t) = \dfrac{M}{1 + Ae^{-kt}}$ with $M = {cap}$, $k = {rate}$, and $A = \dfrac{M - P_0}{P_0} = {A:num4}$. Then $P({t1}) = \dfrac{{cap}}{1 + {A:num4}e^{-{rate}\cdot{t1}}} \approx$ **{Pt:int}**. Growth is fastest when $P = \tfrac M2 = {half:int}$: $1 + Ae^{-kt} = 2$, so $t = \dfrac{\ln A}{{rate}} \approx$ **{th:num2}**.
- id: calc-d-linear-ode
  title: Solve a linear equation with an integrating factor
  topic: Linear differential equations
  vars:
    n: {min: 2, max: 3}
    ex: {choices: [{label: 'x', value: 1}, {label: 'x^2', value: 2}, {label: 'x^3', value: 3}]}
    c: {min: 2, max: 8}
    y1: {min: -3, max: 5}
  calc:
    ne: n + ex
    nm: n + ex - 1
    Cc: y1 - c/(n + ex)
    Y: c*2^ex/(n + ex) + (y1 - c/(n + ex))/2^n
    tn: 2^n
    te: 2^ex
  prompt: 'Solve $xy'' + {n}y = {c}{ex}$ for $x > 0$ with $y(1) = {y1}$, then find $y(2)$. (Exact fraction.)'
  answers:
    - {name: Y, kind: fraction, lowestTerms: true, label: '$y(2) =$'}
  solution: |-
    *Standard form:* divide by $x$ to get $y' + \dfrac{{n}}{x}y = \dfrac{{c}{ex}}{x}$, so $P(x) = \dfrac{{n}}{x}$.

    *Integrating factor:* $\mu = e^{\int ({n}/x)\,dx} = e^{{n}\ln x} = x^{{n}}$.

    Multiply through: $\left(x^{{n}}y\right)' = x^{{n}}\cdot\dfrac{{c}{ex}}{x} = {c}x^{{nm}}$, so $x^{{n}}y = \dfrac{{c}x^{{ne}}}{{ne}} + C$ and $y = \dfrac{{c}{ex}}{{ne}} + \dfrac{C}{x^{{n}}}$.

    At $x = 1$: ${y1} = \dfrac{{c}}{{ne}} + C$, so $C = {Cc:texfrac}$. Then
    $$y(2) = \frac{{c}\cdot{te}}{{ne}} + \frac{C}{{tn}} = \mathbf{{Y:texfrac}}.$$
- id: calc-d-mixing
  title: Salt in a mixing tank
  topic: Linear differential equations
  vars:
    V: {choices: [100, 200, 400, 500, 1000]}
    r: {choices: [2, 4, 5, 10]}
    conc: {choices: [0.1, 0.2, 0.25, 0.5]}
    q0: {min: 0, max: 20, step: 5}
    T: {choices: [10, 20, 30, 60]}
  where: ["q0 < conc*V"]
  calc:
    rin: conc*r
    kk: r/V
    tau: V/r
    Qss: conc*V
    diff: q0 - conc*V
    QT: conc*V + (q0 - conc*V)*e^(-r*T/V)
    expo: r*T/V
  prompt: 'A tank holds {V:dp0} L of water containing {q0} kg of dissolved salt. Brine with {conc} kg of salt per liter flows in at {r} L/min, and the well-mixed solution drains at {r} L/min. How much salt is in the tank after {T} minutes (2 decimals), and how much in the long run?'
  answers:
    - {name: QT, label: '$Q({T}) \approx$', tolerance: 0.01, format: num2}
    - {name: Qss, label: 'Long run: $Q \to$'}
  figure:
    type: plot
    x: [0, '3*tau']
    y: [0, 'Qss*1.15']
    xLabel: t (min)
    yLabel: Q (kg)
    functions: ['Qss + diff*e^(-x/tau)', {f: Qss, dashed: true}]
  solution: |-
    Rate in $= {conc}\times{r} = {rin}$ kg/min. Rate out $= \dfrac{Q}{{V:dp0}}\times{r} = \dfrac{Q}{{tau}}$ kg/min. So
    $$\frac{dQ}{dt} + \frac{Q}{{tau}} = {rin}, \qquad Q(0) = {q0}.$$
    This is $Q' + kQ = b$ with $k = \frac{1}{{tau}}$ and $b = {rin}$: the steady state is $\frac bk = {rin}\times{tau} = {Qss}$ kg, and
    $$Q(t) = {Qss} {diff:signed}e^{-t/{tau}}.$$
    At $t = {T}$: $Q = {Qss} {diff:signed}e^{-{expo}} \approx$ **{QT:num2}** kg. As $t \to \infty$ the transient dies out and $Q \to$ **{Qss}** kg ({conc} kg/L times {V:dp0} L).
- id: calc-d-rl-circuit
  title: Current in an RL circuit
  topic: Linear differential equations
  vars:
    R: {min: 2, max: 20}
    Lh: {choices: [0.5, 1, 2, 4]}
    E: {choices: [6, 12, 24, 48, 60, 120]}
    t1: {choices: [0.05, 0.1, 0.2, 0.5]}
  where: ["R*t1/Lh >= 0.2", "R*t1/Lh <= 3"]
  calc:
    k: R/Lh
    EL: E/Lh
    Iss: E/R
    It: E/R*(1 - e^(-R*t1/Lh))
    tc: Lh/R
    t90: Lh/R*ln(10)
    kt: R*t1/Lh
  prompt: 'A circuit with resistance $R = {R}\ \Omega$ and inductance $L = {Lh}$ H is connected to a {E}-volt battery at $t = 0$, so $I(0) = 0$. Find the current at $t = {t1}$ s, and the time when the current reaches 90% of its steady-state value. (3 decimals)'
  answers:
    - {name: It, label: '$I({t1}) \approx$ (A)', tolerance: 0.001, format: dp3}
    - {name: t90, label: '90% at $t \approx$ (s)', tolerance: 0.001, format: dp3}
  solution: |-
    $LI' + RI = E$ in standard form is $I' + {k:num4}I = {EL:num4}$. The steady state is $\frac ER = {Iss:num4}$ A and the time constant is $\frac LR = {tc:num4}$ s, so
    $$I(t) = {Iss:num4}\left(1 - e^{-{k:num4}t}\right).$$
    At $t = {t1}$: $I = {Iss:num4}\left(1 - e^{-{kt:num4}}\right) \approx$ **{It:dp3}** A.

    90% of the steady state means $e^{-{k:num4}t} = 0.1$, so $t = \dfrac{\ln 10}{{k:num4}} \approx$ **{t90:dp3}** s.
