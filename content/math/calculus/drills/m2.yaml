# Module 2 drills: the derivative
- id: calc-d-diff-quotient
  title: Derivative from the limit definition
  topic: Definition of the derivative
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    p: {min: -4, max: 4}
  where: ["a != 0", "b != 0", "c != 0", "p != 0"]
  calc:
    lin: 2*a*p + b
    m: 2*a*p + b
    fp: a*p^2 + b*p + c
  prompt: 'Let $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$. Simplify the difference quotient $\dfrac{f({p} + h) - f({p})}{h}$ (for $h \ne 0$), then find $f''({p})$.'
  answers:
    - {kind: expression, expression: 'lin + a*h', variables: [h], label: 'Quotient $=$', show: '${lin} {a:signedcoef}h$'}
    - {name: m, label: '$f''({p}) =$'}
  solution: |-
    $f({p} + h) = {a}({p} + h)^2 + ({b})({p} + h) {c:signed}$ and $f({p}) = {fp}$. Expanding and subtracting, every term without $h$ cancels, leaving ${a}\left(2({p})h + h^2\right) + ({b})h$. Divide by $h$: the quotient is ${lin} {a:signed}h$. Let $h \to 0$: $f'({p}) =$ **{m}**.
- id: calc-d-tangent-line
  title: Tangent line to a cubic
  topic: Tangent lines
  vars:
    a: {min: -3, max: 3}
    b: {min: -6, max: 6}
    p: {min: -2, max: 2}
  where: ["a != 0", "b != 0", "p != 0", "3*a*p^2 + b != 0"]
  funcs:
    f(x): a*x^3 + b*x
  calc:
    yp: f(p)
    m: 3*a*p^2 + b
    k: f(p) - m*p
  prompt: 'Find the equation of the tangent line to $f(x) = {a:coef}x^3 {b:signedcoef}x$ at $x = {p}$. Write it as $y = mx + k$.'
  answers:
    - {kind: expression, expression: 'm*x + k', label: '$y =$', show: '${m:coef}x {k:signed}$'}
  figure:
    type: plot
    x: [-4, 4]
    y: [-20, 20]
    functions: [f]
    tangents:
      - {f: f, at: p}
    points:
      - {at: [p, yp]}
  solution: |-
    Point: $f({p}) = {yp}$. Slope: $f'(x) = {a}\cdot3x^2 {b:signed}$, so $f'({p}) = {m}$. Point-slope: $y - ({yp}) = {m}(x - ({p}))$, which simplifies to **$y = {m:coef}x {k:signed}$**.
- id: calc-d-avg-vs-inst
  title: Average and instantaneous rate
  topic: Definition of the derivative
  vars:
    a: {min: -4, max: 4}
    c: {min: -9, max: 9}
    p: {min: -3, max: 3}
    w: {min: 1, max: 4}
  where: ["a != 0", "c != 0"]
  funcs:
    f(x): a*x^2 + c
  calc:
    q: p + 2*w
    mid: p + w
    fq: f(q)
    fpp: f(p)
    avg: (f(q) - f(p))/(q - p)
    w2: 2*w
    inst: 2*a*(p + w)
  prompt: 'For $f(x) = {a:coef}x^2 {c:signed}$, find the average rate of change on $[{p}, {q}]$ and the instantaneous rate of change at the midpoint $x = {mid}$.'
  answers:
    - {name: avg, label: 'Average'}
    - {name: inst, label: '$f''({mid}) =$'}
  figure:
    type: plot
    x: [-4, 12]
    y: ['min(f(p), f(q), c) - 5', 'max(f(p), f(q), c) + 5']
    functions: [f]
    segments:
      - {from: [p, fpp], to: [q, fq], dashed: true}
    tangents:
      - {f: f, at: mid}
  solution: |-
    Average: $\dfrac{f({q}) - f({p})}{{q} - ({p})} = \dfrac{{fq} - ({fpp})}{{w2}} =$ **{avg}**. Instantaneous: $f'(x) = {a}\cdot 2x$, so $f'({mid}) =$ **{inst}**. For a quadratic these always agree: the secant over an interval is parallel to the tangent at its midpoint.
- id: calc-d-piecewise-diff
  title: Make a piecewise function differentiable
  topic: Differentiability
  vars:
    k: {min: 1, max: 3}
    c: {min: -3, max: 3}
  where: ["c != 0"]
  calc:
    a: 2*k*c
    b: -k*c^2
    kc2: k*c^2
  prompt: |-
    Find $a$ and $b$ so that
    $$f(x) = \begin{cases} {k:coef}x^2, & x \le {c}\\ ax + b, & x > {c}\end{cases}$$
    is differentiable at $x = {c}$.
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
  solution: |-
    Slopes must match: the left piece has derivative ${k}\cdot2x$, which is ${a}$ at $x = {c}$, so $a =$ **{a}**. The pieces must also meet: ${k}({c})^2 = {kc2}$ must equal $a({c}) + b = {a}({c}) + b$, so $b =$ **{b}**.
- id: calc-d-power-rule
  title: Power rule with roots and reciprocals
  topic: Power rule
  vars:
    a: {min: 2, max: 9}
    n: {min: 2, max: 6}
    b: {min: 1, max: 9}
    m: {min: 2, max: 4}
    c: {min: 2, max: 8, step: 2}
  calc:
    an: a*n
    n1: n - 1
    bm: b*m
    m1: m + 1
    hc: c/2
  prompt: 'Differentiate $f(x) = {a}x^{n} + \dfrac{{b}}{x^{m}} - {c}\sqrt{x}$.'
  answers:
    - {kind: expression, expression: 'a*n*x^(n-1) - b*m*x^(-m-1) - c/(2*sqrt(x))', label: '$f''(x) =$', show: '${an}x^{{n1}} - \dfrac{{bm}}{x^{{m1}}} - \dfrac{{hc}}{\sqrt x}$'}
  solution: |-
    Rewrite as powers: $f(x) = {a}x^{n} + {b:coef}x^{-{m}} - {c}x^{1/2}$. Power rule on each term: **$f'(x) = {an}x^{{n1}} - {bm}x^{-{m1}} - {hc:coef}x^{-1/2}$**, i.e. ${an}x^{{n1}} - \dfrac{{bm}}{x^{{m1}}} - \dfrac{{hc}}{\sqrt x}$.
- id: calc-d-second-deriv
  title: Second derivative
  topic: Higher derivatives
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    k: {min: 2, max: 7}
  where: ["a != 0", "b != 0", "c != 0"]
  calc:
    a4: 4*a
    b3: 3*b
    c2: 2*c
    a12: 12*a
    b6: 6*b
  prompt: 'Find $f''''(x)$ for $f(x) = {a:coef}x^4 {b:signedcoef}x^3 {c:signedcoef}x^2 + {k}e^x$.'
  answers:
    - {kind: expression, expression: '12*a*x^2 + 6*b*x + 2*c + k*e^x', label: '$f''''(x) =$', show: '${a12}x^2 {b6:signed}x {c2:signed} + {k}e^x$'}
  solution: |-
    First derivative: $f'(x) = {a4}x^3 {b3:signed}x^2 {c2:signed}x + {k}e^x$. Again: **$f''(x) = {a12}x^2 {b6:signed}x {c2:signed} + {k}e^x$**. ($e^x$ is its own derivative at every step.)
