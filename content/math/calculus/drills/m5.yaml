# Module 5 drills: analyzing functions
- id: calc-d-closed-interval
  title: Absolute extrema on a closed interval
  topic: Extreme values
  vars:
    r1: {min: -4, max: 1}
    gap: {choices: [2, 4, 6]}
    d: {min: -10, max: 10}
    left: {min: 1, max: 3}
    right: {min: 1, max: 3}
  where: ["d != 0", "r1 != 0", "r1 + gap != 0", "2*r1 + gap != 0"]
  funcs:
    f(x): x^3 - 1.5*(2*r1 + gap)*x^2 + 3*r1*(r1 + gap)*x + d
  calc:
    r2: r1 + gap
    nr1: -r1
    nr2: -(r1 + gap)
    s: 2*r1 + gap
    b: -1.5*(2*r1 + gap)
    b2: -3*(2*r1 + gap)
    c: 3*r1*(r1 + gap)
    lo: r1 - left
    hi: r1 + gap + right
    flo: f(r1 - left)
    f1: f(r1)
    f2: f(r1 + gap)
    fhi: f(r1 + gap + right)
    mx: max(f(r1 - left), f(r1), f(r1 + gap), f(r1 + gap + right))
    mn: min(f(r1 - left), f(r1), f(r1 + gap), f(r1 + gap + right))
  prompt: 'Find the absolute maximum and minimum values of $f(x) = x^3 {b:signedcoef}x^2 {c:signedcoef}x {d:signed}$ on $[{lo}, {hi}]$.'
  answers:
    - {name: mx, label: 'Max value'}
    - {name: mn, label: 'Min value'}
  figure:
    type: plot
    x: ['lo - 0.5', 'hi + 0.5']
    y: ['mn - 5', 'mx + 5']
    functions: [{f: f, from: lo, to: hi}]
    points:
      - {at: [lo, flo]}
      - {at: [r1, f1]}
      - {at: [r2, f2]}
      - {at: [hi, fhi]}
  solution: |-
    $f'(x) = 3x^2 {b2:signedcoef}x {c:signed} = 3(x {nr1:signed})(x {nr2:signed})$, so the critical numbers are ${r1}$ and ${r2}$, both in the interval. Evaluate at critical numbers and endpoints:

    | $x$ | ${lo}$ | ${r1}$ | ${r2}$ | ${hi}$ |
    |---|---|---|---|---|
    | $f(x)$ | {flo} | {f1} | {f2} | {fhi} |

    Absolute max **{mx}**, absolute min **{mn}**.
- id: calc-d-mvt-c
  title: Find c in the Mean Value Theorem
  topic: Mean Value Theorem
  vars:
    p: {min: 0, max: 3}
    w: {min: 1, max: 4}
  calc:
    q: p + w
    fp: p^3
    fq: (p + w)^3
    avg: ((p + w)^3 - p^3)/w
    c: sqrt(((p + w)^3 - p^3)/(3*w))
  prompt: 'Find the number $c$ in $({p}, {q})$ that satisfies the Mean Value Theorem for $f(x) = x^3$ on $[{p}, {q}]$. (4 decimals)'
  answers:
    - {name: c, label: '$c =$', tolerance: 0.0001, format: num4}
  figure:
    type: plot
    x: ['p - 0.5', 'q + 0.5']
    y: [-2, 'fq + 5']
    functions: ['x^3']
    segments:
      - {from: [p, fp], to: [q, fq], dashed: true}
    tangents:
      - {f: 'x^3', at: c}
  solution: |-
    Average rate: $\dfrac{{fq} - {fp}}{{q} - {p}} = {avg}$. Set $f'(c) = 3c^2 = {avg}$: $c = \sqrt{{avg}/3} \approx$ **{c:num4}**, which lies in $({p}, {q})$. (The negative root is outside the interval.)
- id: calc-d-crit-points
  title: Locate the local max and min
  topic: First derivative test
  vars:
    r1: {min: -5, max: 2}
    gap: {min: 1, max: 5}
  where: ["r1 != 0", "r1 + gap != 0", "2*r1 + gap != 0"]
  calc:
    r2: r1 + gap
    nr1: -r1
    nr2: -(r1 + gap)
    b: -3*(2*r1 + gap)
    b2: -6*(2*r1 + gap)
    c: 6*r1*(r1 + gap)
  prompt: 'For $f(x) = 2x^3 {b:signedcoef}x^2 {c:signedcoef}x$, find where $f$ has its local maximum and local minimum.'
  answers:
    - {name: r1, label: 'Local max at $x =$'}
    - {name: r2, label: 'Local min at $x =$'}
  solution: |-
    $f'(x) = 6x^2 {b2:signedcoef}x {c:signed} = 6(x {nr1:signed})(x {nr2:signed})$. Sign chart: $f' > 0$ for $x < {r1}$, $f' < 0$ between ${r1}$ and ${r2}$, $f' > 0$ for $x > {r2}$. So $f$ has a local max at $x =$ **{r1}** ($+$ to $-$) and a local min at $x =$ **{r2}** ($-$ to $+$).
- id: calc-d-local-max
  title: Local maximum of a power times an exponential
  topic: First derivative test
  vars:
    n: {min: 3, max: 5}
    k: {min: 2, max: 3}
  funcs:
    f(x): x^n*e^(-x/k)
  calc:
    xm: n*k
    n1: n - 1
    ym: f(n*k)
  prompt: 'Find the location and value of the local maximum of $f(x) = x^{n}e^{-x/{k}}$ for $x > 0$. (Value to 4 significant figures.)'
  answers:
    - {name: xm, label: '$x =$'}
    - {name: ym, label: 'Max value', relTolerance: 0.001, format: sig4}
  figure:
    type: plot
    x: [0, 'xm*3']
    y: [0, 'ym*1.3']
    functions: [f]
    points:
      - {at: [xm, ym]}
  solution: |-
    Product and chain rules: $f'(x) = {n}x^{{n1}}e^{-x/{k}} - \tfrac{1}{{k}}x^{n}e^{-x/{k}} = x^{{n1}}e^{-x/{k}}\left({n} - \tfrac{x}{{k}}\right)$. For $x > 0$ the first two factors are positive, so the sign of $f'$ is the sign of ${n} - x/{k}$: positive before $x = {xm}$, negative after. Local max at $x =$ **{xm}**, value $f({xm}) = {xm}^{n}e^{-{n}} \approx$ **{ym:sig4}**.
- id: calc-d-inflection
  title: Inflection point of a cubic
  topic: Concavity
  vars:
    h: {min: -3, max: 3}
    b1: {min: -5, max: 5}
    d: {min: -9, max: 9}
  where: ["b1 != 0", "h != 0", "d != 0"]
  funcs:
    f(x): x^3 - 3*h*x^2 + b1*x + d
  calc:
    b: -3*h
    b2: -6*h
    yi: f(h)
    lo: h - 3
    hi: h + 3
  prompt: 'Find the inflection point of $f(x) = x^3 {b:signedcoef}x^2 {b1:signedcoef}x {d:signed}$.'
  answers:
    - {name: h, label: '$x =$'}
    - {name: yi, label: '$y =$'}
  figure:
    type: plot
    x: [lo, hi]
    y: ['yi - 25', 'yi + 25']
    functions: [f]
    points:
      - {at: [h, yi]}
  solution: |-
    $f'(x) = 3x^2 {b2:signedcoef}x {b1:signed}$ and $f''(x) = 6x {b2:signed}$, which is zero at $x = {h}$ and changes sign there (negative before, positive after). The inflection point is $({h}, f({h}))$ = **({h}, {yi})**.
- id: calc-d-second-test
  title: Second derivative test
  topic: Concavity
  vars:
    a: {min: 1, max: 4}
    c: {min: -10, max: 10}
  where: ["c != 0"]
  calc:
    a2: 3*a^2
    fmax: 2*a^3 + c
    fmin: -2*a^3 + c
    na: -a
    s6: 6*a
  prompt: 'Use the second derivative test to find the local maximum and local minimum values of $f(x) = x^3 - {a2}x {c:signed}$.'
  answers:
    - {name: fmax, label: 'Local max value'}
    - {name: fmin, label: 'Local min value'}
  solution: |-
    $f'(x) = 3x^2 - {a2} = 3(x - {a})(x + {a})$: critical numbers $\pm{a}$. $f''(x) = 6x$.
    - $f''({na}) = -{s6} < 0$: local max $f({na}) =$ **{fmax}**.
    - $f''({a}) = {s6} > 0$: local min $f({a}) =$ **{fmin}**.
- id: calc-d-opt-box
  title: Open box of largest volume
  topic: Optimization
  vars:
    W: {min: 6, max: 20, step: 2}
    L: {min: 8, max: 30, step: 2}
  where: ["L > W"]
  funcs:
    V(x): x*(W - 2*x)*(L - 2*x)
  calc:
    x: ((W + L) - sqrt(W^2 - W*L + L^2))/6
    Vm: V(((W + L) - sqrt(W^2 - W*L + L^2))/6)
    hw: W/2
    s4: 2*(W + L)
    s8: 4*(W + L)
    wl: W*L
  prompt: 'Squares of side $x$ are cut from the corners of a {W}-in by {L}-in sheet, and the sides are folded up to make an open box. Find the $x$ that maximizes the volume, and the maximum volume. (3 decimals for $x$; volume to the nearest 0.1 in³)'
  answers:
    - {name: x, label: '$x =$', tolerance: 0.001, format: dp3}
    - {name: Vm, label: 'Volume', tolerance: 0.1, format: num1}
  solution: |-
    $V(x) = x({W} - 2x)({L} - 2x) = 4x^3 - {s4}x^2 + {wl}x$ on $0 \le x \le {hw}$. $V'(x) = 12x^2 - {s8}x + {wl} = 0$. The quadratic formula gives two roots; the smaller, $x \approx$ **{x:dp3}**, is in the domain (the larger exceeds {hw}). Endpoints give $V = 0$, so the max is $V \approx$ **{Vm:num1}** in³.
- id: calc-d-opt-fence
  title: Least fence for a riverside pen
  topic: Optimization
  vars:
    s: {min: 10, max: 60, step: 5}
  calc:
    A: 2*s^2
    px: s
    py: 2*s
    F: 4*s
  prompt: 'A rectangular pen along a straight river must enclose {A:int} m². No fence is needed along the river. What dimensions minimize the fencing, and how much fence is used?'
  answers:
    - {name: px, label: 'Side perpendicular to river (m)'}
    - {name: py, label: 'Side parallel to river (m)'}
    - {name: F, label: 'Fence (m)'}
  solution: |-
    With $x$ perpendicular and $y$ parallel: $xy = {A:dp0}$, so $y = {A:dp0}/x$, and the fence is $F(x) = 2x + \dfrac{{A:dp0}}{x}$ for $x > 0$. $F'(x) = 2 - \dfrac{{A:dp0}}{x^2} = 0$ gives $x^2 = {A:dp0}/2$, $x =$ **{px}**. $F''(x) = \dfrac{2\cdot{A:dp0}}{x^3} > 0$, so it's the minimum. Then $y =$ **{py}** and $F =$ **{F}** m.
