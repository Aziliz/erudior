# Module 8 drills: techniques of integration
- id: calc-d-parts
  title: Integration by parts with a logarithm
  topic: Integration by parts
  vars:
    n: {choices: [{label: 'x', value: 1}, {label: 'x^2', value: 2}, {label: 'x^3', value: 3}, {label: 'x^4', value: 4}]}
    a: {min: 1, max: 6}
  calc:
    n1: n + 1
    sq: (n + 1)^2
  prompt: 'Find $\displaystyle\int {a:coef}{n}\ln x\,dx$ for $x > 0$. (Leave off $+C$; type ln for the natural log.)'
  answers:
    - kind: expression
      expression: 'a*(x^(n+1)/(n+1)*ln(x) - x^(n+1)/(n+1)^2)'
      plusC: true
      label: '$F(x) =$'
      show: '${a:coef}\left(\dfrac{x^{{n1}}}{{n1}}\ln x - \dfrac{x^{{n1}}}{{sq}}\right)$ $+ C$'
  solution: |-
    LIATE: $u = \ln x$, $dv = {n}\,dx$, so $du = \dfrac{dx}{x}$ and $v = \dfrac{x^{{n1}}}{{n1}}$.
    $$\int {n}\ln x\,dx = \frac{x^{{n1}}}{{n1}}\ln x - \int\frac{x^{{n1}}}{{n1}}\cdot\frac1x\,dx = \frac{x^{{n1}}}{{n1}}\ln x - \frac{x^{{n1}}}{{sq}} + C.$$
    Multiply by ${a}$: **$F(x) = {a:coef}\left(\dfrac{x^{{n1}}}{{n1}}\ln x - \dfrac{x^{{n1}}}{{sq}}\right) + C$**.
- id: calc-d-parts-def
  title: Definite integral by parts
  topic: Integration by parts
  vars:
    k: {min: 1, max: 4}
    b: {min: 1, max: 3}
  funcs:
    f(x): x*e^(-k*x)
  calc:
    I: integ(f, 0, b)
    k2: k^2
    kb: k*b
  prompt: 'Evaluate $\displaystyle\int_0^{{b}}x\,e^{-{k:coef}x}\,dx$. (4 decimals)'
  answers:
    - {name: I, label: 'Value', tolerance: 0.0001, format: num4}
  figure:
    type: plot
    x: [-0.2, 'b + 0.5']
    y: [-0.05, '1/(k*e) + 0.1']
    functions: [f]
    shade: [{f: f, from: 0, to: b}]
  solution: |-
    $u = x$, $dv = e^{-{k:coef}x}dx$, so $du = dx$, $v = -\tfrac{1}{{k}}e^{-{k:coef}x}$.
    $$\int_0^{{b}}xe^{-{k:coef}x}dx = \left[-\frac{x}{{k}}e^{-{k:coef}x}\right]_0^{{b}} + \frac{1}{{k}}\int_0^{{b}}e^{-{k:coef}x}dx = \left[-\frac{x}{{k}}e^{-{k:coef}x} - \frac{1}{{k2}}e^{-{k:coef}x}\right]_0^{{b}}.$$
    $= \dfrac{1}{{k2}} - \left(\dfrac{{b}}{{k}} + \dfrac{1}{{k2}}\right)e^{-{kb}} \approx$ **{I:num4}**.
- id: calc-d-trig-integral
  title: Odd power of sine
  topic: Trig integrals
  vars:
    n: {min: 2, max: 5}
  calc:
    n1: n + 1
    n3: n + 3
  prompt: 'Find $\displaystyle\int\sin^3x\cos^{n}x\,dx$. (Leave off $+C$; type cos(x)^k for powers.)'
  answers:
    - kind: expression
      expression: '-cos(x)^(n+1)/(n+1) + cos(x)^(n+3)/(n+3)'
      plusC: true
      label: '$F(x) =$'
      show: '$-\dfrac{\cos^{{n1}}x}{{n1}} + \dfrac{\cos^{{n3}}x}{{n3}}$ $+ C$'
  solution: |-
    The sine power is odd: save one $\sin x$ and write $\sin^2x = 1 - \cos^2x$. With $u = \cos x$, $du = -\sin x\,dx$:
    $$\int(1 - \cos^2x)\cos^{n}x\,\sin x\,dx = -\int(u^{n} - u^{{n} + 2})\,du = -\frac{u^{{n1}}}{{n1}} + \frac{u^{{n3}}}{{n3}} + C.$$
    So **$F(x) = -\dfrac{\cos^{{n1}}x}{{n1}} + \dfrac{\cos^{{n3}}x}{{n3}} + C$**.
- id: calc-d-trig-sub
  title: Trigonometric substitution
  topic: Trig substitution
  vars:
    a: {min: 1, max: 6}
  calc:
    a2: a^2
  prompt: 'Find $\displaystyle\int\frac{dx}{(x^2 + {a2})^{3/2}}$. (Leave off $+C$.)'
  answers:
    - kind: expression
      expression: 'x/(a^2*sqrt(x^2 + a^2))'
      plusC: true
      label: '$F(x) =$'
      show: '$\dfrac{x}{{a2}\sqrt{x^2 + {a2}}}$ $+ C$'
  solution: |-
    Let $x = {a}\tan\theta$, $dx = {a}\sec^2\theta\,d\theta$, and $x^2 + {a2} = {a2}\sec^2\theta$, so $(x^2 + {a2})^{3/2} = {a}^3\sec^3\theta$.
    $$\int\frac{{a}\sec^2\theta}{{a}^3\sec^3\theta}\,d\theta = \frac{1}{{a2}}\int\cos\theta\,d\theta = \frac{1}{{a2}}\sin\theta + C.$$
    Triangle: $\tan\theta = \dfrac{x}{{a}}$, hypotenuse $\sqrt{x^2 + {a2}}$, so $\sin\theta = \dfrac{x}{\sqrt{x^2 + {a2}}}$. **$F(x) = \dfrac{x}{{a2}\sqrt{x^2 + {a2}}} + C$**.
- id: calc-d-partial-fractions
  title: Partial fractions with two linear factors
  topic: Partial fractions
  vars:
    r1: {min: -4, max: 1}
    gap: {min: 1, max: 4}
    cA: {min: -5, max: 5}
    cB: {min: -5, max: 5}
  where: ["cA != 0", "cB != 0", "cA + cB != 0", "r1 != 0", "r1 - gap != 0", "cA*(r1 - gap) + cB*r1 != 0", "2*r1 - gap != 0"]
  calc:
    r2: r1 - gap
    p: cA + cB
    q: -(cA*r2 + cB*r1)
    s: -(r1 + r2)
    t: r1*r2
    nr1: -r1
    nr2: -r2
  prompt: 'Find $\displaystyle\int\frac{{p:coef}x {q:signed}}{x^2 {s:signedcoef}x {t:signed}}\,dx$. (Leave off $+C$. Type logs as ln(abs(...)) or ln(...).)'
  answers:
    - kind: expression
      expression: 'cA*ln(x - r1) + cB*ln(x - r2)'
      plusC: true
      label: '$F(x) =$'
      show: '${cA:coef}\ln|x {nr1:signed}| {cB:signedcoef}\ln|x {nr2:signed}|$ $+ C$'
  solution: |-
    Factor: $x^2 {s:signedcoef}x {t:signed} = (x {nr1:signed})(x {nr2:signed})$. Set $\dfrac{{p:coef}x {q:signed}}{(x {nr1:signed})(x {nr2:signed})} = \dfrac{A}{x {nr1:signed}} + \dfrac{B}{x {nr2:signed}}$ and clear denominators: ${p:coef}x {q:signed} = A(x {nr2:signed}) + B(x {nr1:signed})$. Plug in $x = {r1}$ to get $A = {cA}$, and $x = {r2}$ to get $B = {cB}$. Integrate: **$F(x) = {cA:coef}\ln|x {nr1:signed}| {cB:signedcoef}\ln|x {nr2:signed}| + C$**.
- id: calc-d-trapezoid
  title: Trapezoidal rule
  topic: Numerical integration
  vars:
    b: {min: 1, max: 4}
  funcs:
    f(x): 1/(1 + x^2)
    g(i): if(i == 0 or i == 4, 1, 2)*f(i*b/4)
  calc:
    h4: b/4
    hb: b/2
    t3: 3*b/4
    T: b/8*sum(g, 0, 4)
    y0: f(0)
    y1: f(b/4)
    y2: f(b/2)
    y3: f(3*b/4)
    y4: f(b)
    ex: atan(b)
  prompt: 'Use the trapezoidal rule with $n = 4$ to approximate $\displaystyle\int_0^{{b}}\frac{1}{1 + x^2}\,dx$. (4 decimals)'
  answers:
    - {name: T, label: '$T_4 \approx$', tolerance: 0.0001, format: num4}
  figure:
    type: plot
    x: [-0.2, 'b + 0.2']
    y: [-0.1, 1.2]
    functions: [f]
    polygons:
      - {points: [[0, 0], [0, y0], [h4, y1], [h4, 0]]}
      - {points: [[h4, 0], [h4, y1], ['2*h4', y2], ['2*h4', 0]]}
      - {points: [['2*h4', 0], ['2*h4', y2], ['3*h4', y3], ['3*h4', 0]]}
      - {points: [['3*h4', 0], ['3*h4', y3], [b, y4], [b, 0]]}
  solution: |-
    $\Delta x = {h4}$. Values: $f(0) = {y0:num4}$, $f({h4}) = {y1:num4}$, $f({hb}) = {y2:num4}$, $f({t3}) = {y3:num4}$, $f({b}) = {y4:num4}$.
    $$T_4 = \frac{{h4}}{2}\left[{y0:num4} + 2({y1:num4}) + 2({y2:num4}) + 2({y3:num4}) + {y4:num4}\right] \approx \mathbf{{T:num4}}.$$
    (Exact: $\arctan {b} \approx {ex:num4}$.)
- id: calc-d-simpson
  title: Simpson's rule
  topic: Numerical integration
  vars:
    b: {min: 1, max: 3}
  funcs:
    f(x): sqrt(1 + x^3)
    g(i): if(i == 0 or i == 4, 1, if(mod(i, 2) == 1, 4, 2))*f(i*b/4)
  calc:
    h4: b/4
    S: b/12*sum(g, 0, 4)
    y0: f(0)
    y1: f(b/4)
    y2: f(b/2)
    y3: f(3*b/4)
    y4: f(b)
    ex: integ(f, 0, b)
  prompt: 'Use Simpson''s rule with $n = 4$ to approximate $\displaystyle\int_0^{{b}}\sqrt{1 + x^3}\,dx$. (4 decimals)'
  answers:
    - {name: S, label: '$S_4 \approx$', tolerance: 0.0001, format: num4}
  solution: |-
    $\Delta x = {h4}$. Values: {y0:num4}, {y1:num4}, {y2:num4}, {y3:num4}, {y4:num4}. Weights $1, 4, 2, 4, 1$:
    $$S_4 = \frac{{h4}}{3}\left[{y0:num4} + 4({y1:num4}) + 2({y2:num4}) + 4({y3:num4}) + {y4:num4}\right] \approx \mathbf{{S:num4}}.$$
    (A high-precision value is {ex:num4}.)
- id: calc-d-improper
  title: Convergent improper integral
  topic: Improper integrals
  vars:
    k: {min: 1, max: 9}
    p: {min: 2, max: 5}
  calc:
    I: k/(p - 1)
    p1: p - 1
  prompt: 'Evaluate $\displaystyle\int_1^\infty\frac{{k}}{x^{p}}\,dx$ as an exact fraction.'
  answers:
    - {name: I, kind: fraction, lowestTerms: true, label: 'Value'}
  solution: |-
    $$\int_1^\infty {k:coef}x^{-{p}}dx = \lim_{t\to\infty}\left[\frac{{k:coef}x^{-{p1}}}{-{p1}}\right]_1^t = \lim_{t\to\infty}\left(\frac{{k}}{{p1}} - \frac{{k}}{{p1}\,t^{{p1}}}\right) = \frac{{k}}{{p1}}.$$
    It converges ($p = {p} > 1$) to **{I:frac}**.
- id: calc-d-improper-p
  title: Improper integral with an infinite discontinuity
  topic: Improper integrals
  vars:
    b: {choices: [1, 4, 9, 16]}
    k: {min: 1, max: 6}
  calc:
    I: 2*k*sqrt(b)
    rb: sqrt(b)
    k2: 2*k
  prompt: 'Evaluate $\displaystyle\int_0^{{b}}\frac{{k}}{\sqrt x}\,dx$.'
  answers:
    - {name: I, label: 'Value'}
  solution: |-
    The integrand is unbounded at $x = 0$, so take a limit:
    $$\lim_{t\to0^+}\int_t^{{b}}{k:coef}x^{-1/2}dx = \lim_{t\to0^+}\Big[{k2}\sqrt x\Big]_t^{{b}} = {k2}({rb}) - 0 = \mathbf{{I}}.$$
    It converges because the exponent $\tfrac12 < 1$.
