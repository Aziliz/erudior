- term: limit
  aliases:
  - limits
  definition: The value $L$ that $f(x)$ approaches as $x$ approaches $a$ (from both sides, with $x \ne a$), written $\lim_{x\to a}f(x) = L$.
  topic: Limits
- term: one-sided limit
  aliases:
  - one-sided limits
  - left-hand limit
  - right-hand limit
  definition: 'A limit taken as $x$ approaches $a$ from only one side: $\lim_{x\to a^-}$ (from the left) or $\lim_{x\to a^+}$ (from the right).'
  topic: Limits
- term: does not exist
  aliases:
  - DNE
  definition: 'Said of a limit when the outputs don''t approach a single finite number: because of a jump, unbounded growth or oscillation. Abbreviated DNE.'
  topic: Limits
- term: indeterminate form
  aliases:
  - indeterminate forms
  definition: An expression like $\frac00$, $\frac{\infty}{\infty}$, $0\cdot\infty$, $\infty - \infty$, $1^\infty$, $0^0$ or $\infty^0$ whose value can't be decided from the form alone; the limit must be found another way.
  topic: Algebraic limits
- term: direct substitution property
  aliases:
  - direct substitution
  definition: If $f$ is continuous at $a$ (for example, a polynomial, or a rational function with $a$ in its domain), then $\lim_{x\to a}f(x) = f(a)$.
  topic: Limit laws
- term: limit laws
  aliases:
  - limit law
  definition: Rules for computing limits of sums, differences, constant multiples, products, quotients (nonzero denominator), powers and roots from the limits of their parts.
  topic: Limit laws
- term: conjugate
  aliases:
  - conjugates
  definition: For $\sqrt A - B$, the expression $\sqrt A + B$. Multiplying by it uses $(\sqrt A - B)(\sqrt A + B) = A - B^2$ to clear the root.
  topic: Algebraic limits
- term: infinite limit
  aliases:
  - infinite limits
  definition: A limit in which $f(x)$ grows without bound ($\pm\infty$) as $x$ approaches a finite number; it signals a vertical asymptote.
  topic: Infinite limits
- term: limit at infinity
  aliases:
  - limits at infinity
  definition: A limit as $x\to\infty$ or $x\to-\infty$, describing long-run behavior; a finite value gives a horizontal asymptote.
  topic: Limits at infinity
- term: vertical asymptote
  aliases:
  - vertical asymptotes
  definition: A vertical line $x = a$ where $f(x) \to \pm\infty$ as $x$ approaches $a$ from at least one side.
  topic: Infinite limits
- term: horizontal asymptote
  aliases:
  - horizontal asymptotes
  definition: A horizontal line $y = L$ with $\lim_{x\to\infty}f(x) = L$ or $\lim_{x\to-\infty}f(x) = L$.
  topic: Limits at infinity
- term: slant asymptote
  aliases:
  - oblique asymptote
  - slant asymptotes
  definition: A non-horizontal line $y = mx + b$ that the graph approaches as $x\to\pm\infty$; for rational functions it comes from long division when the numerator's degree is one more than the denominator's.
  topic: Limits at infinity
- term: asymptote
  aliases:
  - asymptotes
  definition: 'A line that a graph approaches arbitrarily closely: vertical, horizontal or slant.'
  topic: Infinite limits
- term: squeeze theorem
  aliases:
  - sandwich theorem
  definition: If $g(x) \le f(x) \le h(x)$ near $a$ and $g$ and $h$ both approach $L$, then $f(x)$ approaches $L$ too. Also called the sandwich theorem.
  topic: Squeeze theorem
- term: ε-δ definition
  aliases:
  - epsilon-delta definition
  - formal definition of a limit
  definition: '$\lim_{x\to a}f(x) = L$ means: for every $\varepsilon > 0$ there is a $\delta > 0$ such that $0 < |x - a| < \delta$ implies $|f(x) - L| < \varepsilon$.'
  topic: Formal limit definition
- term: continuous
  aliases:
  - continuity
  - continuous on their domains
  definition: $f$ is continuous at $a$ if $f(a)$ is defined, $\lim_{x\to a}f(x)$ exists, and they are equal. Continuous on an interval means continuous at every point of it.
  topic: Continuity
- term: discontinuity
  aliases:
  - discontinuities
  definition: 'A point where a function fails to be continuous: removable (hole), jump, infinite (asymptote) or oscillating.'
  topic: Continuity
- term: removable discontinuity
  aliases:
  - removable
  - hole
  definition: A discontinuity where the limit exists but $f(a)$ is missing or different; it can be fixed by redefining one value (a hole in the graph).
  topic: Continuity
- term: jump discontinuity
  aliases:
  - jump
  definition: A discontinuity where both one-sided limits exist but are different, so the graph jumps.
  topic: Continuity
- term: infinite discontinuity
  aliases:
  - infinite
  definition: A discontinuity where a one-sided limit is $\pm\infty$ (a vertical asymptote).
  topic: Continuity
- term: oscillation
  aliases:
  - oscillating
  definition: Behavior in which outputs keep swinging without settling, such as $\sin(1/x)$ near 0; one way a limit can fail to exist.
  topic: Limits
- term: unbounded behavior
  definition: Outputs growing without bound near a point, so no finite limit exists (as with $1/x^2$ near 0).
  topic: Limits
- term: Intermediate Value Theorem
  aliases:
  - IVT
  definition: If $f$ is continuous on $[a, b]$ and $N$ is between $f(a)$ and $f(b)$, then $f(c) = N$ for at least one $c$ in $(a, b)$.
  topic: Intermediate Value Theorem
- term: bisection method
  definition: 'A root-finding method: repeatedly halve an interval on which a continuous function changes sign, keeping the half where the sign still changes.'
  topic: Intermediate Value Theorem
- term: average rate of change
  definition: '$\dfrac{f(b) - f(a)}{b - a}$: the change in output per unit change in input over $[a, b]$; the slope of the secant line.'
  topic: Definition of the derivative
- term: instantaneous rate of change
  definition: 'The limit of average rates of change over shrinking intervals: the derivative $f''(a)$.'
  topic: Definition of the derivative
- term: secant line
  aliases:
  - secant lines
  definition: A line through two points on a curve; its slope is an average rate of change.
  topic: Definition of the derivative
- term: tangent line
  aliases:
  - tangent lines
  definition: 'The line through $(a, f(a))$ with slope $f''(a)$: $y = f(a) + f''(a)(x - a)$. The limit of secant lines.'
  topic: Tangent lines
- term: derivative
  aliases:
  - derivatives
  definition: '$f''(a) = \lim_{h\to0}\frac{f(a + h) - f(a)}{h}$: the instantaneous rate of change of $f$ at $a$ and the slope of its tangent line.'
  topic: Definition of the derivative
- term: difference quotient
  aliases:
  - difference quotients
  definition: $\dfrac{f(a + h) - f(a)}{h}$, the slope of the secant line from $x = a$ to $x = a + h$.
  topic: Definition of the derivative
- term: symmetric difference quotient
  aliases:
  - central difference
  definition: $\dfrac{f(a + h) - f(a - h)}{2h}$, a central-difference estimate of $f'(a)$ that is usually more accurate than a one-sided quotient.
  topic: Definition of the derivative
- term: local linearity
  definition: The property that a differentiable function looks like its tangent line when you zoom in near a point.
  topic: Tangent lines
- term: derivative function
  definition: The function $f'(x) = \lim_{h\to0}\frac{f(x + h) - f(x)}{h}$, giving the slope of $f$ at every $x$ where the limit exists.
  topic: The derivative function
- term: differentiable
  aliases:
  - differentiability
  definition: Having a derivative. $f$ is differentiable at $a$ if $f'(a)$ exists; differentiable functions are continuous.
  topic: Differentiability
- term: Leibniz notation
  definition: Writing the derivative as $\frac{dy}{dx}$ (and higher derivatives as $\frac{d^2y}{dx^2}$, …), recalling that it is a limit of $\frac{\Delta y}{\Delta x}$.
  topic: The derivative function
- term: corner
  aliases:
  - cusp
  - corners
  definition: A point where a continuous graph has different left and right slopes, so the derivative does not exist (like $|x|$ at 0). A sharp corner where the slopes go to $\pm\infty$ is a cusp.
  topic: Differentiability
- term: vertical tangent line
  aliases:
  - vertical tangent
  definition: 'A tangent line that is vertical: the difference quotients grow without bound, so the derivative does not exist (like $\sqrt[3]{x}$ at 0).'
  topic: Differentiability
- term: power rule
  definition: $\frac{d}{dx}x^n = nx^{n-1}$, valid for every real exponent $n$.
  topic: Power rule
- term: second derivative
  aliases:
  - second derivatives
  - higher derivatives
  definition: The derivative of the derivative, $f''(x) = \frac{d^2y}{dx^2}$; it measures how the slope changes (concavity, acceleration).
  topic: Higher derivatives
- term: acceleration
  definition: 'The rate of change of velocity: $a(t) = v''(t) = s''''(t)$.'
  topic: Higher derivatives
- term: velocity
  definition: 'The rate of change of position: $v(t) = s''(t)$. Its sign gives the direction of motion.'
  topic: Motion along a line
- term: product rule
  definition: $(fg)' = f'g + fg'$.
  topic: Product rule
- term: quotient rule
  definition: $\left(\frac fg\right)' = \dfrac{f'g - fg'}{g^2}$ (lo d-hi minus hi d-lo, over lo squared).
  topic: Quotient rule
- term: chain rule
  definition: $\frac{d}{dx}f(g(x)) = f'(g(x))\,g'(x)$; in Leibniz form, $\frac{dy}{dx} = \frac{dy}{du}\frac{du}{dx}$.
  topic: Chain rule
- term: composite function
  aliases:
  - composite functions
  definition: A function applied to the output of another, $f(g(x))$.
  topic: Chain rule
- term: outer function
  definition: In $f(g(x))$, the function $f$ applied last.
  topic: Chain rule
- term: inner function
  definition: In $f(g(x))$, the function $g$ applied first; the chain rule multiplies by its derivative.
  topic: Chain rule
- term: implicit differentiation
  definition: Differentiating both sides of an equation in $x$ and $y$ with respect to $x$, treating $y$ as a function of $x$ (so each $y$ term picks up $\frac{dy}{dx}$), then solving for $\frac{dy}{dx}$.
  topic: Implicit differentiation
- term: logarithmic differentiation
  definition: Taking $\ln$ of both sides of $y = f(x)$, differentiating implicitly, and multiplying by $y$; used for $f(x)^{g(x)}$ and messy products.
  topic: Logarithmic differentiation
- term: natural exponential function
  aliases:
  - e^x
  definition: $e^x$, with $e \approx 2.71828$, the unique exponential whose derivative is itself.
  topic: Exponential and log derivatives
- term: related rates
  definition: Problems in which several quantities linked by an equation change with time; differentiating the equation with respect to $t$ links their rates.
  topic: Related rates
- term: linearization
  definition: 'The tangent line viewed as a function: $L(x) = f(a) + f''(a)(x - a)$.'
  topic: Linearization
- term: linear approximation
  aliases:
  - tangent line approximation
  definition: Approximating $f(x) \approx f(a) + f'(a)(x - a)$ for $x$ near $a$.
  topic: Linearization
- term: differential
  aliases:
  - differentials
  definition: 'For $y = f(x)$, $dy = f''(x)\,dx$: the change along the tangent line, approximating the actual change $\Delta y$.'
  topic: Linearization
- term: relative error
  definition: Error divided by the size of the quantity, such as $\frac{dV}{V}$; often given as a percent.
  topic: Linearization
- term: small-angle approximation
  definition: '$\sin x \approx x$ (and $\tan x \approx x$) for small $x$ in radians: the linearization at 0.'
  topic: Linearization
- term: Newton's method
  definition: 'Root-finding by tangent lines: $x_{n+1} = x_n - \dfrac{f(x_n)}{f''(x_n)}$.'
  topic: Newton's method
- term: L'Hôpital's rule
  aliases:
  - L'Hopital's rule
  definition: If $\lim\frac{f}{g}$ has the form $\frac00$ or $\frac{\infty}{\infty}$, then $\lim\frac fg = \lim\frac{f'}{g'}$ (when the latter exists).
  topic: L'Hôpital's rule
- term: absolute maximum
  aliases:
  - global maximum
  definition: The largest value $f(c)$ takes on its whole domain (or a given interval). Also called a global maximum.
  topic: Extreme values
- term: absolute minimum
  aliases:
  - global minimum
  definition: The smallest value $f(c)$ takes on its whole domain (or a given interval). Also called a global minimum.
  topic: Extreme values
- term: local maximum
  aliases:
  - relative maximum
  - local max
  definition: A value $f(c)$ at least as large as all nearby values of $f$. Also called a relative maximum.
  topic: Extreme values
- term: local minimum
  aliases:
  - relative minimum
  - local min
  definition: A value $f(c)$ at most as large as all nearby values of $f$. Also called a relative minimum.
  topic: Extreme values
- term: extremum
  aliases:
  - extrema
  definition: 'A maximum or minimum value (plural: extrema).'
  topic: Extreme values
- term: Extreme Value Theorem
  aliases:
  - EVT
  definition: A function continuous on a closed interval $[a, b]$ attains an absolute maximum and an absolute minimum there.
  topic: Extreme values
- term: critical number
  aliases:
  - critical numbers
  - critical point
  - critical points
  definition: A number $c$ in the domain of $f$ where $f'(c) = 0$ or $f'(c)$ does not exist; local extrema can only occur there.
  topic: Extreme values
- term: closed interval method
  definition: 'To find absolute extrema of a continuous $f$ on $[a, b]$: evaluate $f$ at the critical numbers inside and at the endpoints, then compare.'
  topic: Extreme values
- term: Rolle's theorem
  definition: If $f$ is continuous on $[a, b]$, differentiable on $(a, b)$, and $f(a) = f(b)$, then $f'(c) = 0$ for some $c$ in $(a, b)$.
  topic: Mean Value Theorem
- term: Mean Value Theorem
  aliases:
  - MVT
  definition: If $f$ is continuous on $[a, b]$ and differentiable on $(a, b)$, then $f'(c) = \frac{f(b) - f(a)}{b - a}$ for some $c$ in $(a, b)$.
  topic: Mean Value Theorem
- term: Fermat's theorem
  definition: If $f$ has a local extremum at an interior point $c$ and $f'(c)$ exists, then $f'(c) = 0$.
  topic: Extreme values
- term: increasing
  definition: $f$ is increasing on an interval if $x_1 < x_2$ implies $f(x_1) < f(x_2)$; guaranteed when $f' > 0$ there.
  topic: First derivative test
- term: decreasing
  definition: $f$ is decreasing on an interval if $x_1 < x_2$ implies $f(x_1) > f(x_2)$; guaranteed when $f' < 0$ there.
  topic: First derivative test
- term: first derivative test
  definition: 'At a critical number $c$: if $f''$ changes from $+$ to $-$, local max; from $-$ to $+$, local min; no sign change, no extremum.'
  topic: First derivative test
- term: concave up
  definition: 'Bending upward: $f''$ is increasing (guaranteed by $f'''' > 0$), and the graph lies above its tangent lines.'
  topic: Concavity
- term: concave down
  definition: 'Bending downward: $f''$ is decreasing (guaranteed by $f'''' < 0$), and the graph lies below its tangent lines.'
  topic: Concavity
- term: concavity
  definition: The direction a graph bends, up or down, measured by the sign of $f''$.
  topic: Concavity
- term: inflection point
  aliases:
  - inflection points
  - point of inflection
  definition: A point on the graph where the concavity changes; candidates are where $f'' = 0$ or is undefined.
  topic: Concavity
- term: second derivative test
  definition: 'If $f''(c) = 0$: $f''''(c) > 0$ gives a local min, $f''''(c) < 0$ a local max, and $f''''(c) = 0$ is inconclusive.'
  topic: Concavity
- term: inconclusive
  definition: Said of a test that gives no information in a particular case (such as $f''(c) = 0$, or ratio-test limit $L = 1$); another method is needed.
  topic: Concavity
- term: optimization
  definition: Finding the input that makes a quantity as large or as small as possible, usually subject to a constraint.
  topic: Optimization
- term: first derivative test for absolute extrema
  definition: If a continuous function on an interval has only one critical number and it is a local max (or min), then it is the absolute max (or min).
  topic: Optimization
- term: constraint
  definition: In an optimization problem, the fixed condition relating the variables (such as a fixed perimeter or volume), used to reduce the objective to one variable.
  topic: Optimization
- term: antidifferentiation
  definition: The process of finding a function from its derivative.
  topic: Antiderivatives
- term: antiderivative
  aliases:
  - antiderivatives
  definition: A function $F$ with $F' = f$. All antiderivatives of $f$ on an interval are $F(x) + C$.
  topic: Antiderivatives
- term: indefinite integral
  aliases:
  - indefinite integrals
  definition: '$\int f(x)\,dx = F(x) + C$: the family of all antiderivatives of $f$.'
  topic: Antiderivatives
- term: constant of integration
  definition: The arbitrary constant $C$ in an indefinite integral.
  topic: Antiderivatives
- term: integrand
  definition: 'The function being integrated: $f(x)$ in $\int f(x)\,dx$.'
  topic: Definite integral
- term: power rule for integrals
  definition: $\int x^n\,dx = \dfrac{x^{n+1}}{n + 1} + C$ for $n \ne -1$.
  topic: Antiderivatives
- term: differential equation
  aliases:
  - differential equations
  - DE
  definition: An equation involving an unknown function and its derivatives, such as $\frac{dy}{dx} = ky$.
  topic: Slope fields
- term: initial condition
  aliases:
  - initial conditions
  definition: A given value such as $y(x_0) = y_0$ that picks one solution out of a family.
  topic: Antiderivatives
- term: initial value problem (IVP)
  aliases:
  - initial value problem
  - IVP
  definition: A differential equation together with an initial condition.
  topic: Antiderivatives
- term: area problem
  definition: The problem of finding the area under a curve; solved by limits of Riemann sums, leading to the definite integral.
  topic: Riemann sums
- term: sigma notation
  aliases:
  - summation notation
  definition: 'Compact notation for sums: $\sum_{i=1}^n a_i = a_1 + a_2 + \cdots + a_n$.'
  topic: Riemann sums
- term: Riemann sum
  aliases:
  - Riemann sums
  definition: A sum $\sum f(x_i^*)\Delta x$ of rectangle areas approximating $\int_a^b f(x)\,dx$.
  topic: Riemann sums
- term: left Riemann sum
  aliases:
  - left sum
  definition: A Riemann sum using the left endpoint of each subinterval for the height ($L_n$).
  topic: Riemann sums
- term: right Riemann sum
  aliases:
  - right sum
  definition: A Riemann sum using the right endpoint of each subinterval for the height ($R_n$).
  topic: Riemann sums
- term: midpoint sum
  aliases:
  - midpoint rule
  definition: A Riemann sum using each subinterval's midpoint for the height ($M_n$); also called the midpoint rule.
  topic: Riemann sums
- term: definite integral
  aliases:
  - definite integrals
  definition: '$\int_a^b f(x)\,dx = \lim_{n\to\infty}\sum f(x_i^*)\Delta x$: the net signed area between $f$ and the $x$-axis from $a$ to $b$.'
  topic: Definite integral
- term: limits of integration
  definition: The numbers $a$ (lower) and $b$ (upper) in $\int_a^b f(x)\,dx$.
  topic: Definite integral
- term: integrable
  definition: Having a definite integral on $[a, b]$ (the Riemann sums have a limit); every continuous function is integrable.
  topic: Definite integral
- term: net signed area
  definition: Area above the $x$-axis minus area below it; what $\int_a^b f(x)\,dx$ measures.
  topic: Definite integral
- term: dummy variable
  definition: The variable of integration in a definite integral; it can be renamed without changing the value ($\int_0^2t^2dt = \int_0^2x^2dx$).
  topic: Definite integral
- term: Fundamental Theorem of Calculus
  aliases:
  - FTC
  definition: 'Part 1: $\frac{d}{dx}\int_a^xf(t)\,dt = f(x)$. Part 2: $\int_a^bf(x)\,dx = F(b) - F(a)$ for any antiderivative $F$.'
  topic: Fundamental Theorem of Calculus
- term: accumulation function
  aliases:
  - accumulation functions
  definition: A function defined by an integral with a variable limit, $g(x) = \int_a^xf(t)\,dt$; by FTC 1, $g' = f$.
  topic: Fundamental Theorem of Calculus
- term: net change theorem
  definition: '$\int_a^bF''(x)\,dx = F(b) - F(a)$: integrating a rate of change gives the total change.'
  topic: Fundamental Theorem of Calculus
- term: substitution
  aliases:
  - u-substitution
  definition: 'Integration technique reversing the chain rule: with $u = g(x)$, $\int f(g(x))g''(x)\,dx = \int f(u)\,du$. Also called u-substitution.'
  topic: U-substitution
- term: even
  aliases:
  - even function
  definition: A function with $f(-x) = f(x)$ (symmetric about the $y$-axis); $\int_{-a}^af = 2\int_0^af$.
  topic: U-substitution
- term: odd
  aliases:
  - odd function
  definition: A function with $f(-x) = -f(x)$ (symmetric about the origin); $\int_{-a}^af = 0$.
  topic: U-substitution
- term: speed
  definition: The absolute value of velocity, $|v(t)|$; for a parametric path, $\sqrt{(x')^2 + (y')^2}$.
  topic: Motion along a line
- term: displacement
  definition: Net change in position, $s(b) - s(a) = \int_a^bv(t)\,dt$.
  topic: Motion along a line
- term: total distance traveled
  aliases:
  - distance traveled
  definition: '$\int_a^b|v(t)|\,dt$: all motion counted as positive.'
  topic: Motion along a line
- term: changes direction
  definition: A moving particle changes direction where its velocity changes sign.
  topic: Motion along a line
- term: speeding up
  definition: 'Speed increasing: velocity and acceleration have the same sign.'
  topic: Motion along a line
- term: slowing down
  definition: 'Speed decreasing: velocity and acceleration have opposite signs.'
  topic: Motion along a line
- term: average value
  aliases:
  - average value of a function
  definition: $f_{\text{avg}} = \frac{1}{b - a}\int_a^bf(x)\,dx$, the height of the rectangle on $[a, b]$ with the same area as the region under $f$.
  topic: Average value
- term: Mean Value Theorem for integrals
  definition: If $f$ is continuous on $[a, b]$, then $f(c) = f_{\text{avg}}$ for some $c$ in $[a, b]$.
  topic: Average value
- term: area between curves
  definition: $\int_a^b[\text{top} - \text{bottom}]\,dx$ or $\int_c^d[\text{right} - \text{left}]\,dy$.
  topic: Area between curves
- term: cross section
  aliases:
  - cross sections
  definition: The slice of a solid made by a plane, often perpendicular to an axis; $V = \int A(x)\,dx$ where $A(x)$ is its area.
  topic: Volumes by slicing
- term: solid of revolution
  aliases:
  - solids of revolution
  definition: A solid swept out by rotating a plane region about a line.
  topic: Volumes by slicing
- term: disk
  aliases:
  - disks
  definition: A circular slice of a solid of revolution with no hole, of area $\pi R^2$.
  topic: Volumes by slicing
- term: disk method
  definition: $V = \pi\int_a^b[R(x)]^2\,dx$ for a region touching the axis of rotation.
  topic: Volumes by slicing
- term: washer
  aliases:
  - washers
  definition: 'A circular slice with a hole: area $\pi R^2 - \pi r^2$.'
  topic: Volumes by slicing
- term: washer method
  definition: $V = \pi\int_a^b\left([R(x)]^2 - [r(x)]^2\right)dx$ for a region not touching the axis of rotation.
  topic: Volumes by slicing
- term: shell
  aliases:
  - shells
  - cylindrical shell
  definition: A thin cylindrical shell of radius $r$, height $h$ and thickness $\Delta r$, with volume about $2\pi rh\,\Delta r$.
  topic: Shell method
- term: shell method
  definition: $V = 2\pi\int(\text{radius})(\text{height})\,dx$, slicing parallel to the axis of rotation.
  topic: Shell method
- term: arc length
  definition: 'The length of a curve: $L = \int_a^b\sqrt{1 + [f''(x)]^2}\,dx$ (or $\int\sqrt{(x'')^2 + (y'')^2}\,dt$ for parametric curves).'
  topic: Arc length
- term: surface area of revolution
  aliases:
  - surface area
  definition: $S = 2\pi\int_a^bf(x)\sqrt{1 + [f'(x)]^2}\,dx$ when $y = f(x) \ge 0$ is rotated about the $x$-axis.
  topic: Surface area
- term: work
  definition: Force times distance; for a variable force, $W = \int_a^bF(x)\,dx$. Measured in joules (N·m) or foot-pounds.
  topic: Work
- term: Hooke's law
  definition: The force to hold a spring stretched $x$ beyond natural length is $F = kx$.
  topic: Work
- term: spring constant
  definition: The constant $k$ in Hooke's law $F = kx$ (N/m or lb/ft).
  topic: Work
- term: pressure
  aliases:
  - hydrostatic pressure
  definition: Force per unit area; in a fluid at depth $d$, $P = \rho g d$.
  topic: Fluid force
- term: center of mass
  definition: The balance point of a system; for point masses, $\bar x = \frac{\sum m_ix_i}{\sum m_i}$.
  topic: Center of mass
- term: moment
  aliases:
  - moments
  definition: Mass times signed distance from an axis or point; centers of mass are moments divided by total mass.
  topic: Center of mass
- term: centroid
  definition: 'The center of mass of a region of uniform density: $\bar x = \frac1A\int xf(x)\,dx$, $\bar y = \frac1A\int\frac12f(x)^2\,dx$.'
  topic: Center of mass
- term: theorem of Pappus
  aliases:
  - Pappus
  definition: Rotating a region of area $A$ about an external axis gives volume $V = A\cdot2\pi\bar r$, where $\bar r$ is the centroid's distance to the axis.
  topic: Center of mass
- term: integration by parts
  aliases:
  - parts
  - by parts
  definition: '$\int u\,dv = uv - \int v\,du$: the product rule in reverse.'
  topic: Integration by parts
- term: LIATE
  definition: 'Order for choosing $u$ in integration by parts: Logarithmic, Inverse trig, Algebraic, Trig, Exponential.'
  topic: Integration by parts
- term: tabular method
  definition: 'A table for repeated integration by parts: differentiate one factor to 0, integrate the other repeatedly, and combine diagonally with alternating signs.'
  topic: Integration by parts
- term: half-angle identities
  aliases:
  - power-reduction formulas
  definition: $\sin^2x = \frac{1 - \cos2x}{2}$ and $\cos^2x = \frac{1 + \cos2x}{2}$; used to lower even powers.
  topic: Trig integrals
- term: trig substitution
  aliases:
  - trigonometric substitution
  definition: Substituting $x = a\sin\theta$, $a\tan\theta$ or $a\sec\theta$ to remove $\sqrt{a^2 - x^2}$, $\sqrt{a^2 + x^2}$ or $\sqrt{x^2 - a^2}$.
  topic: Trig substitution
- term: partial fractions
  aliases:
  - partial fraction decomposition
  definition: Writing a proper rational function as a sum of simpler fractions with linear or irreducible quadratic denominators, so each piece can be integrated.
  topic: Partial fractions
- term: proper
  aliases:
  - proper rational function
  definition: A rational function $\frac{P}{Q}$ is proper if $\deg P < \deg Q$; otherwise divide first.
  topic: Partial fractions
- term: trapezoidal rule
  aliases:
  - trapezoid rule
  definition: $T_n = \frac{\Delta x}{2}[f(x_0) + 2f(x_1) + \cdots + 2f(x_{n-1}) + f(x_n)]$; overestimates for concave-up functions.
  topic: Numerical integration
- term: Simpson's rule
  definition: $S_n = \frac{\Delta x}{3}[f(x_0) + 4f(x_1) + 2f(x_2) + \cdots + 4f(x_{n-1}) + f(x_n)]$, $n$ even; fits parabolas and is exact for cubics.
  topic: Numerical integration
- term: improper integral
  aliases:
  - improper integrals
  definition: An integral over an infinite interval or of an unbounded function, defined as a limit of ordinary integrals.
  topic: Improper integrals
- term: converges
  aliases:
  - convergent
  - convergence
  - converge
  definition: 'Has a finite limit: said of improper integrals, sequences and series.'
  topic: Improper integrals
- term: diverges
  aliases:
  - divergent
  - divergence
  - diverge
  definition: 'Fails to have a finite limit: said of improper integrals, sequences and series.'
  topic: Improper integrals
- term: p-integral
  aliases:
  - p-integrals
  definition: $\int_1^\infty\frac{dx}{x^p}$ converges iff $p > 1$; $\int_0^1\frac{dx}{x^p}$ converges iff $p < 1$.
  topic: Improper integrals
- term: solution
  definition: A function that makes a differential equation true when substituted.
  topic: Slope fields
- term: general solution
  definition: The family of all solutions of a differential equation, usually with an arbitrary constant.
  topic: Slope fields
- term: particular solution
  definition: The member of the general solution picked out by an initial condition.
  topic: Slope fields
- term: order
  definition: The order of a differential equation is the highest derivative appearing in it.
  topic: Slope fields
- term: slope field
  aliases:
  - slope fields
  - direction field
  definition: A grid of short segments with slope $F(x, y)$, showing the shape of the solutions of $\frac{dy}{dx} = F(x, y)$. Also called a direction field.
  topic: Slope fields
- term: autonomous
  definition: A differential equation $\frac{dy}{dx} = g(y)$ whose right side doesn't involve $x$.
  topic: Slope fields
- term: equilibrium solution
  aliases:
  - equilibrium solutions
  - equilibrium
  definition: A constant solution $y = c$ of an autonomous equation, where $g(c) = 0$; stable if nearby solutions approach it, unstable if they move away.
  topic: Slope fields
- term: Euler's method
  definition: 'Numerical solution by small tangent-line steps: $y_{n+1} = y_n + h\,F(x_n, y_n)$.'
  topic: Euler's method
- term: separable
  aliases:
  - separable equation
  - separable equations
  definition: A first-order differential equation of the form $\frac{dy}{dx} = g(x)h(y)$, solved by $\int\frac{dy}{h(y)} = \int g(x)\,dx$.
  topic: Separable equations
- term: exponential growth
  aliases:
  - exponential decay
  definition: 'Growth at a rate proportional to size: $\frac{dy}{dt} = ky$ with $k > 0$, solved by $y = y_0e^{kt}$. With $k < 0$ it is exponential decay.'
  topic: Exponential and logistic models
- term: half-life
  definition: 'The time for a decaying quantity to halve: $\frac{\ln2}{|k|}$.'
  topic: Exponential and logistic models
- term: doubling time
  definition: 'The time for a growing quantity to double: $\frac{\ln2}{k}$.'
  topic: Exponential and logistic models
- term: Newton's law of cooling
  definition: '$\frac{dT}{dt} = k(T - T_s)$: temperature approaches the surroundings'' temperature exponentially, $T = T_s + (T_0 - T_s)e^{kt}$.'
  topic: Exponential and logistic models
- term: logistic equation
  aliases:
  - logistic growth
  - logistic model
  definition: $\frac{dP}{dt} = kP\left(1 - \frac PM\right)$, modeling growth limited by a carrying capacity $M$; solution $P = \frac{M}{1 + Ae^{-kt}}$.
  topic: Exponential and logistic models
- term: carrying capacity
  definition: The limiting population $M$ in the logistic equation.
  topic: Exponential and logistic models
- term: sequence
  aliases:
  - sequences
  definition: An infinite ordered list $a_1, a_2, a_3, \dots$
  topic: Sequences
- term: monotone
  aliases:
  - monotonic
  definition: Always increasing or always decreasing. A bounded monotone sequence converges.
  topic: Sequences
- term: bounded
  definition: Staying between two fixed numbers.
  topic: Sequences
- term: infinite series
  aliases:
  - series
  definition: A sum of infinitely many terms, $\sum_{n=1}^\infty a_n$, defined as the limit of its partial sums.
  topic: Series basics
- term: partial sums
  aliases:
  - partial sum
  definition: $S_N = a_1 + \cdots + a_N$; a series converges when its partial sums converge.
  topic: Series basics
- term: geometric series
  definition: $\sum ar^n$; converges to $\frac{\text{first term}}{1 - r}$ when $|r| < 1$ and diverges when $|r| \ge 1$.
  topic: Series basics
- term: telescoping series
  aliases:
  - telescoping
  definition: A series whose partial sums collapse because consecutive terms cancel, such as $\sum\left(\frac1n - \frac1{n + 1}\right)$.
  topic: Series basics
- term: divergence test
  aliases:
  - nth-term test
  definition: If $\lim a_n \ne 0$, then $\sum a_n$ diverges. If $a_n \to 0$ the test says nothing. Also called the $n$th-term test.
  topic: Series basics
- term: harmonic series
  definition: $\sum\frac1n = 1 + \frac12 + \frac13 + \cdots$; its terms go to 0 but it diverges.
  topic: Series basics
- term: integral test
  definition: For positive, continuous, decreasing $f$ with $a_n = f(n)$, $\sum a_n$ and $\int_1^\infty f(x)\,dx$ converge or diverge together.
  topic: Integral test
- term: p-series
  definition: $\sum\frac1{n^p}$; converges iff $p > 1$.
  topic: Integral test
- term: direct comparison test
  aliases:
  - comparison test
  definition: 'If $0 \le a_n \le b_n$: $\sum b_n$ converges ⇒ $\sum a_n$ converges; $\sum a_n$ diverges ⇒ $\sum b_n$ diverges.'
  topic: Comparison tests
- term: limit comparison test
  aliases:
  - LCT
  definition: If $a_n, b_n > 0$ and $\lim\frac{a_n}{b_n}$ is finite and positive, then $\sum a_n$ and $\sum b_n$ both converge or both diverge.
  topic: Comparison tests
- term: positive terms
  definition: Series whose terms are all positive; their partial sums increase, so they converge exactly when the partial sums are bounded.
  topic: Comparison tests
- term: alternating series
  definition: A series whose terms alternate in sign, $\sum(-1)^nb_n$ with $b_n > 0$.
  topic: Alternating series
- term: alternating series test
  aliases:
  - AST
  definition: If $b_n$ decreases to 0, then $\sum(-1)^nb_n$ converges, with error $|S - S_N| \le b_{N+1}$.
  topic: Alternating series
- term: alternating harmonic series
  definition: $1 - \frac12 + \frac13 - \cdots = \ln 2$; conditionally convergent.
  topic: Alternating series
- term: absolutely convergent
  aliases:
  - absolute convergence
  definition: $\sum a_n$ is absolutely convergent if $\sum|a_n|$ converges; absolute convergence implies convergence.
  topic: Alternating series
- term: conditionally convergent
  aliases:
  - conditional convergence
  definition: Convergent, but not absolutely convergent (like the alternating harmonic series).
  topic: Alternating series
- term: ratio test
  definition: '$L = \lim\left|\frac{a_{n+1}}{a_n}\right|$: $L < 1$ absolutely convergent, $L > 1$ divergent, $L = 1$ inconclusive.'
  topic: Ratio and root tests
- term: root test
  definition: '$L = \lim\sqrt[n]{|a_n|}$: $L < 1$ absolutely convergent, $L > 1$ divergent, $L = 1$ inconclusive.'
  topic: Ratio and root tests
- term: power series
  definition: A series $\sum c_n(x - a)^n$ in powers of $x - a$.
  topic: Power series
- term: center
  definition: The number $a$ in a power series $\sum c_n(x - a)^n$.
  topic: Power series
- term: radius of convergence
  definition: The $R$ such that a power series converges for $|x - a| < R$ and diverges for $|x - a| > R$.
  topic: Power series
- term: interval of convergence
  definition: 'The set of all $x$ where a power series converges: an interval centered at $a$, with endpoints checked separately.'
  topic: Power series
- term: Taylor series
  definition: $\sum\frac{f^{(n)}(a)}{n!}(x - a)^n$, the power series of $f$ centered at $a$.
  topic: Taylor series
- term: Maclaurin series
  definition: A Taylor series centered at $a = 0$.
  topic: Taylor series
- term: Taylor polynomial
  aliases:
  - Taylor polynomials
  definition: $P_n(x) = \sum_{k=0}^n\frac{f^{(k)}(a)}{k!}(x - a)^k$, the degree-$n$ partial sum of the Taylor series.
  topic: Taylor series
- term: Lagrange error bound
  aliases:
  - Taylor's remainder
  - Taylor's theorem
  definition: $|R_n(x)| \le \frac{M}{(n + 1)!}|x - a|^{n+1}$ where $|f^{(n+1)}| \le M$ between $a$ and $x$; also called Taylor's remainder estimate.
  topic: Taylor's remainder
- term: binomial series
  definition: $(1 + x)^k = 1 + kx + \frac{k(k - 1)}{2!}x^2 + \cdots$ for $|x| < 1$.
  topic: Taylor series
- term: parametric equations
  aliases:
  - parametric curve
  - parametric
  definition: Equations $x = x(t)$, $y = y(t)$ giving a curve's points in terms of a parameter $t$.
  topic: Parametric equations
- term: parameter
  definition: The independent variable (often $t$, for time) in parametric equations.
  topic: Parametric equations
- term: cycloid
  definition: 'The curve traced by a point on a rolling circle: $x = r(t - \sin t)$, $y = r(1 - \cos t)$.'
  topic: Parametric equations
- term: polar coordinates
  aliases:
  - polar
  definition: 'Locating a point by distance $r$ from the origin and angle $\theta$ from the positive $x$-axis: $x = r\cos\theta$, $y = r\sin\theta$.'
  topic: Polar coordinates
- term: cardioid
  definition: A heart-shaped polar curve $r = a(1 \pm \cos\theta)$ or $r = a(1 \pm \sin\theta)$.
  topic: Polar coordinates
- term: rose
  aliases:
  - rose curve
  definition: A polar curve $r = a\cos(n\theta)$ or $a\sin(n\theta)$ with $n$ petals ($n$ odd) or $2n$ petals ($n$ even).
  topic: Polar coordinates
- term: limaçon
  aliases:
  - limacon
  definition: A polar curve $r = a + b\cos\theta$ (or $\sin\theta$); it has an inner loop when $|a| < |b|$.
  topic: Polar coordinates
- term: radians
  aliases:
  - radian
  definition: Angle measure in which a full turn is $2\pi$; required for $\frac{d}{dx}\sin x = \cos x$ and $\lim\frac{\sin x}{x} = 1$.
  topic: Trig derivatives
