# Integrals and the Fundamental Theorem (calc-m6): round 2 (new question types and honors lessons)
- id: calc-m6-r2-q01
  lesson: calc-antiderivatives
  type: text
  topic: Antiderivatives
  stem: 'Fill in the coefficient: $\displaystyle\int 8x^3\,dx =$ ___ $x^4 + C$. Give only the number.'
  accept:
  - '2'
  explanation: 'Raise the exponent by one and divide by the new exponent: $8\cdot\frac{x^4}{4} = 2x^4$. Check: $\frac{d}{dx}(2x^4) = 8x^3$.'
- id: calc-m6-r2-q02
  lesson: calc-antiderivatives
  type: match
  topic: Antiderivatives
  stem: Match each integrand to its indefinite integral.
  pairs:
  - - $\cos x$
    - sin x + C
  - - $\sin x$
    - −cos x + C
  - - $\sec^2 x$
    - tan x + C
  - - $\dfrac{1}{x}$
    - ln|x| + C
  - - $e^x$
    - eˣ + C
  distractors:
  - cos x + C
  - −sin x + C
  explanation: 'Each answer is a derivative rule read backward: $(\sin x)'' = \cos x$, $(-\cos x)'' = \sin x$, $(\tan x)'' = \sec^2 x$, $(\ln|x|)'' = \frac1x$ and $(e^x)'' = e^x$. The distractors have the wrong sign: $\cos x + C$ differentiates to $-\sin x$, and $-\sin x + C$ differentiates to $-\cos x$.'
- id: calc-m6-r2-q03
  lesson: calc-antiderivatives
  topic: Antiderivatives
  stem: Which functions are antiderivatives of $f(x) = 2x$? Select all that apply.
  choices:
  - $x^2 + 7$
  - $x^2 - \pi$
  - $2$
  - $\dfrac{x^2}{2}$
  answer:
  - 0
  - 1
  explanation: $F$ is an antiderivative of $2x$ when $F'(x) = 2x$. Both $x^2 + 7$ and $x^2 - \pi$ work, since constants differentiate to 0. The derivative of $2$ is $0$ (that choice is the derivative of $2x$, not an antiderivative), and the derivative of $\frac{x^2}{2}$ is $x$.
- id: calc-m6-r2-q04
  lesson: calc-antiderivatives
  type: label
  module_quiz: true
  topic: Antiderivatives
  stem: A ball is thrown upward from a cliff. The boxes show three functions of time for its motion, with the arrows linking them. Name the quantity in each numbered box.
  image:
    src: images/calc-m6-motion-chain-blank.svg
    alt: Three stacked boxes containing −16t² + 48t + 64 (top), −32t + 48 (middle) and −32 (bottom). Arrows pointing down are labeled differentiate; arrows pointing up are labeled antidifferentiate, then use the initial value. Each box has a numbered marker where its name would go.
  labels:
  - x: 50.0
    y: 13.0
    text: Position
  - x: 50.0
    y: 46.3
    text: Velocity
  - x: 50.0
    y: 79.5
    text: Acceleration
  distractors:
  - Speed
  - Jerk
  explanation: 'Differentiating moves down the chain: $\frac{d}{dt}(-16t^2 + 48t + 64) = -32t + 48$, and $\frac{d}{dt}(-32t + 48) = -32$. So the top box is position, the middle is velocity and the bottom is acceleration (the constant pull of gravity, $-32$ ft/s²). Speed would be $|v(t)|$, which is never negative, and jerk is the derivative of acceleration, which is 0 here.'
- id: calc-m6-r2-q05
  lesson: calc-antiderivatives
  type: order
  module_quiz: true
  topic: Antiderivatives
  stem: Put the steps for solving $f''(x) = 12x^2 + 6$, $f'(0) = 1$, $f(0) = -2$ in order.
  items:
  - Antidifferentiate $f''$ to get $f'$ with a constant $C_1$
  - Use $f'(0) = 1$ to find $C_1$
  - Antidifferentiate $f'$ to get $f$ with a constant $C_2$
  - Use $f(0) = -2$ to find $C_2$
  - Check by differentiating twice
  explanation: 'Each antiderivative brings in one constant, and each constant is fixed by the condition at its own level: first $f'' = 4x^3 + 6x + C_1$ with $f''(0) = 1$ giving $C_1 = 1$, then $f = x^4 + 3x^2 + x + C_2$ with $f(0) = -2$ giving $C_2 = -2$. You can''t use $f(0)$ until you have $f$, and checking comes last.'
- id: calc-m6-r2-q06
  lesson: calc-riemann-sums
  type: label
  module_quiz: true
  topic: Riemann sums
  stem: Each panel approximates the area under the same curve over one subinterval from $a$ to $b$. Name the approximation in each numbered panel.
  image:
    src: images/calc-m6-sum-types-blank.svg
    alt: 'Four panels with the same rising curve over a subinterval from a to b. Panel 1: a rectangle touching the curve at its upper left corner. Panel 2: a rectangle touching the curve at its upper right corner. Panel 3: a rectangle touching the curve at the middle of its top. Panel 4: a shape with a slanted top joining the curve at a and at b.'
  labels:
  - x: 27.4
    y: 34.0
    text: Left endpoint sum
  - x: 75.8
    y: 34.0
    text: Right endpoint sum
  - x: 27.4
    y: 84.0
    text: Midpoint sum
  - x: 75.8
    y: 84.0
    text: Trapezoidal sum
  distractors:
  - Simpson's rule
  explanation: 'Panel 1''s rectangle meets the curve at its left edge, so its height is $f(a)$: a left endpoint sum. Panel 2''s meets the curve at the right edge: right endpoint. Panel 3''s meets it in the middle: midpoint. Panel 4 has a slanted top joining $f(a)$ and $f(b)$: a trapezoid, whose area is the average of the left and right rectangles. Simpson''s rule (Lesson 34) fits parabolas, not straight tops.'
- id: calc-m6-r2-q07
  lesson: calc-riemann-sums
  type: text
  topic: Riemann sums
  stem: Evaluate $\displaystyle\sum_{i=1}^{5}(2i - 1) =$ ___.
  accept:
  - '25'
  explanation: 'Write out the terms: $1 + 3 + 5 + 7 + 9 = 25$. Or use the formulas: $2\sum i - \sum 1 = 2\cdot\frac{5\cdot6}{2} - 5 = 30 - 5 = 25$.'
- id: calc-m6-r2-q08
  lesson: calc-riemann-sums
  topic: Riemann sums
  stem: $f$ is continuous, positive and decreasing on $[a, b]$. Which statements are true for every such $f$ and every $n$? Select all that apply.
  choices:
  - The left Riemann sum overestimates the integral.
  - The right Riemann sum underestimates the integral.
  - The midpoint sum equals the integral exactly.
  - The left sum is less than the right sum.
  answer:
  - 0
  - 1
  explanation: For a decreasing function the left end of each subinterval is the highest point, so left rectangles stick out above the curve (overestimate) and right rectangles sit under it (underestimate). That makes the left sum *greater* than the right sum. The midpoint sum is usually close, but it is exact only for special functions such as lines.
- id: calc-m6-r2-q09
  lesson: calc-riemann-sums
  type: match
  module_quiz: true
  topic: Definite integral
  stem: Given $\int_0^4 f(x)\,dx = 10$ and $\int_0^1 f(x)\,dx = 3$, match each integral to its value.
  pairs:
  - - $\int_1^4 f(x)\,dx$
    - '7'
  - - $\int_4^0 f(x)\,dx$
    - −10
  - - $\int_0^4 2f(x)\,dx$
    - '20'
  - - $\int_1^1 f(x)\,dx$
    - '0'
  distractors:
  - '13'
  - −7
  explanation: 'Additivity: $\int_1^4 f = 10 - 3 = 7$. Reversing limits changes the sign: $\int_4^0 f = -10$. Linearity: $\int_0^4 2f = 2(10) = 20$. Zero width: $\int_1^1 f = 0$. The distractor 13 comes from adding instead of subtracting, and $-7$ from reversing a sign that doesn''t need reversing.'
- id: calc-m6-r2-q10
  lesson: calc-riemann-sums
  topic: Riemann sums
  stem: 'A pump''s flow rate is measured at uneven times: $r(0) = 2$, $r(2) = 5$, $r(3) = 9$ (liters per minute). What does a trapezoidal sum give for $\int_0^3 r(t)\,dt$?'
  choices:
  - $19$ L
  - $14$ L
  - $9$ L
  - $10.5$ L
  answer: 1
  explanation: 'Each trapezoid uses its own width: $\frac{2 + 5}{2}(2) + \frac{5 + 9}{2}(1) = 7 + 7 = 14$ L. A right sum gives $5(2) + 9(1) = 19$ and a left sum $2(2) + 5(1) = 9$. $10.5$ comes from treating both widths as 1.'
- id: calc-m6-r2-q11
  lesson: calc-ftc
  type: label
  module_quiz: true
  topic: Fundamental Theorem of Calculus
  stem: The graph shows $y = f(t)$, and $g(x) = \int_0^x f(t)\,dt$. Name what happens to $g$ at each numbered point.
  image:
    src: images/calc-m6-accumulation-features-blank.svg
    alt: 'The graph of y = f(t) for t from 0 to 8: a parabola-shaped curve starting at 3, crossing the t-axis at t = 2, reaching its lowest value −1 at t = 4, and crossing back up at t = 6. Area above the axis is shaded green, area below pink. Marker 1 is at t = 2 on the axis, marker 2 at the lowest point (4, −1), marker 3 at t = 6 on the axis.'
  labels:
  - x: 33.9
    y: 62.8
    text: Local maximum of g
  - x: 53.2
    y: 79.2
    text: Inflection point of g
  - x: 72.6
    y: 62.8
    text: Local minimum of g
  distractors:
  - Local maximum of f
  - Point where g is undefined
  explanation: '$g'' = f$. At 1 ($t = 2$), $f$ changes from positive to negative, so $g$ stops increasing and starts decreasing: a local maximum of $g$. At 3 ($t = 6$), $f$ changes from negative to positive: a local minimum of $g$. At 2 ($t = 4$), $f$ has its lowest point, so $g'''' = f''$ changes sign there: an inflection point of $g$. Point 2 is a local *minimum* of $f$, not a maximum, and $g$ is defined everywhere because $f$ is continuous.'
- id: calc-m6-r2-q12
  lesson: calc-ftc
  type: text
  topic: Fundamental Theorem of Calculus
  stem: Let $g(x) = \int_2^x (t^3 + 1)\,dt$. Then $g'(2) =$ ___. Give only the number.
  accept:
  - '9'
  explanation: By FTC 1, $g'(x) = x^3 + 1$, so $g'(2) = 8 + 1 = 9$. (Don't confuse this with $g(2)$, which is $0$ because the limits are equal.)
- id: calc-m6-r2-q13
  lesson: calc-ftc
  type: order
  topic: Fundamental Theorem of Calculus
  stem: Let $f(t) = \frac{(t - 2)(t - 6)}{4}$ (the curve in the lesson's picture) and $g(x) = \int_0^x f(t)\,dt$. Put these values in order from least to greatest.
  items:
  - $g(6)$
  - $g(4)$
  - $g(1)$
  - $g(2)$
  explanation: 'Integrate: $g(x) = \frac14\left(\frac{x^3}{3} - 4x^2 + 12x\right)$. Then $g(6) = 0$, $g(4) = \frac43$, $g(1) = \frac{25}{12} \approx 2.08$ and $g(2) = \frac83 \approx 2.67$. The picture agrees: $g$ rises until $t = 2$, so $g(1) < g(2)$; then it falls until $t = 6$, so $g(2) > g(4) > g(6)$, and $g(6) = 0$ because the pink area (8/3) cancels the green area from 0 to 2 (also 8/3).'
- id: calc-m6-r2-q14
  lesson: calc-ftc
  module_quiz: true
  topic: Fundamental Theorem of Calculus
  stem: $f$ is continuous everywhere and $F$ is an antiderivative of $f$. Which statements are true? Select all that apply.
  choices:
  - $\dfrac{d}{dx}\displaystyle\int_a^x f(t)\,dt = f(x)$
  - $\dfrac{d}{dx}\displaystyle\int_x^b f(t)\,dt = -f(x)$
  - $\displaystyle\int_a^b f(x)\,dx = F(b) - F(a)$
  - $\dfrac{d}{dx}\displaystyle\int_a^{x^2} f(t)\,dt = f(x^2)$
  answer:
  - 0
  - 1
  - 2
  explanation: 'The first is FTC 1 and the third is FTC 2. For the second, flip the limits: $\int_x^b f = -\int_b^x f$, whose derivative is $-f(x)$. The fourth forgets the chain rule: the derivative is $f(x^2)\cdot 2x$.'
- id: calc-m6-r2-q15
  lesson: calc-ftc
  type: match
  topic: Fundamental Theorem of Calculus
  stem: Match each definite integral to its value.
  pairs:
  - - $\int_0^\pi \sin x\,dx$
    - '2'
  - - $\int_0^2 x^2\,dx$
    - 8/3
  - - $\int_1^e \frac{1}{x}\,dx$
    - '1'
  - - $\int_0^1 e^x\,dx$
    - e − 1
  distractors:
  - −2
  - e
  explanation: $\Big[-\cos x\Big]_0^\pi = 1 + 1 = 2$. $\Big[\frac{x^3}{3}\Big]_0^2 = \frac83$. $\Big[\ln x\Big]_1^e = 1 - 0 = 1$. $\Big[e^x\Big]_0^1 = e - 1$. The distractor $-2$ is what you get by subtracting in the wrong order on the sine integral.
- id: calc-m6-r2-q16
  lesson: calc-u-sub
  type: text
  topic: U-substitution
  stem: With $u = x^2 + 1$, the integral $\int_0^1 2x(x^2 + 1)^3\,dx$ becomes $\int_a^b u^3\,du$, where $a =$ ___ and $b =$ ___.
  accept:
  - - '1'
  - - '2'
  explanation: '$du = 2x\,dx$ matches the $2x\,dx$ in the integrand. Convert the limits: $x = 0$ gives $u = 0^2 + 1 = 1$, and $x = 1$ gives $u = 2$. (The integral is $\left[\frac{u^4}{4}\right]_1^2 = \frac{15}{4}$.) Keeping the old limits 0 and 1 is the classic mixing mistake.'
- id: calc-m6-r2-q17
  lesson: calc-u-sub
  type: match
  module_quiz: true
  topic: U-substitution
  stem: Match each integrand to the best choice of $u$.
  pairs:
  - - $x\cos(x^2)$
    - u = x²
  - - $\dfrac{\ln x}{x}$
    - u = ln x
  - - $\dfrac{e^{\sqrt x}}{\sqrt x}$
    - u = √x
  - - $\sin^4 x\cos x$
    - u = sin x
  distractors:
  - u = cos x
  - u = eˣ
  explanation: 'Choose the inner function whose derivative is also a factor. $x\cos(x^2)$: $u = x^2$, $du = 2x\,dx$. $\frac{\ln x}{x}$: $u = \ln x$, $du = \frac{dx}{x}$. $\frac{e^{\sqrt x}}{\sqrt x}$: $u = \sqrt x$, $du = \frac{dx}{2\sqrt x}$. $\sin^4 x\cos x$: $u = \sin x$, $du = \cos x\,dx$. $u = \cos x$ would leave a $\sin x$ factor that isn''t there.'
- id: calc-m6-r2-q18
  lesson: calc-u-sub
  topic: U-substitution
  stem: Which integrals equal 0 because the integrand is odd? Select all that apply.
  choices:
  - $\displaystyle\int_{-1}^{1} x^5\,dx$
  - $\displaystyle\int_{-2}^{2} x\sin x\,dx$
  - $\displaystyle\int_{-\pi}^{\pi} \sin^3 x\,dx$
  - $\displaystyle\int_{-1}^{1} (x^3 + 1)\,dx$
  answer:
  - 0
  - 2
  explanation: '$x^5$ and $\sin^3 x$ are odd ($f(-x) = -f(x)$), and the intervals are symmetric, so the areas cancel. $x\sin x$ is a product of two odd functions, which is even, so its integral is $2\int_0^2 x\sin x\,dx \ne 0$. $x^3 + 1$ is neither: the $x^3$ part cancels but the $1$ contributes $2$.'
- id: calc-m6-r2-q19
  lesson: calc-u-sub
  type: order
  module_quiz: true
  topic: U-substitution
  stem: Put the steps for evaluating $\displaystyle\int_0^2\frac{x}{\sqrt{x^2 + 5}}\,dx$ in order.
  items:
  - Choose $u = x^2 + 5$
  - Compute $du = 2x\,dx$
  - Rewrite as $\frac12\int_5^9 u^{-1/2}\,du$
  - Find the antiderivative $u^{1/2}$
  - Evaluate $\sqrt9 - \sqrt5$
  explanation: 'You need $u$ before $du$, and both (plus the new limits) before rewriting. Then integrate in $u$ and evaluate at the $u$-limits: $\sqrt9 - \sqrt5 = 3 - \sqrt5$.'
- id: calc-m6-r2-q20
  lesson: calc-u-sub
  topic: U-substitution
  stem: Find $\displaystyle\int\cos(5x)\,dx$.
  choices:
  - $5\sin(5x) + C$
  - $\sin(5x) + C$
  - $-\tfrac15\sin(5x) + C$
  - $\tfrac15\sin(5x) + C$
  answer: 3
  explanation: 'Let $u = 5x$, $du = 5\,dx$, so $dx = \frac15du$: $\frac15\int\cos u\,du = \frac15\sin(5x) + C$. Check: $\frac{d}{dx}\frac15\sin(5x) = \cos(5x)$. $\sin(5x) + C$ forgets to convert $dx$; $5\sin(5x)$ multiplies instead of dividing.'
- id: calc-m6-r2-q21
  lesson: calc-motion-average
  type: label
  module_quiz: true
  topic: Motion along a line
  stem: A particle moves along a line with $s(t) = t^3 - 6t^2 + 9t$. The picture shows its path in three passes. Name the time at each numbered point.
  image:
    src: images/calc-m6-particle-path-blank.svg
    alt: 'A number line marked 0 to 4 with a path drawn above it in three passes: an arrow from 0 right to 4, a turn, an arrow from 4 back left to 0, another turn, and an arrow from 0 right past 4. Five numbered markers: at the start (s = 0, first pass), at the right-hand turn (s = 4), at s = 2 on the second pass, at the left-hand turn (s = 0), and at s = 4 on the third pass.'
  labels:
  - x: 16.1
    y: 18.2
    text: t = 0
  - x: 87.1
    y: 30.3
    text: t = 1
  - x: 48.4
    y: 42.4
    text: t = 2
  - x: 9.7
    y: 54.5
    text: t = 3
  - x: 80.6
    y: 66.7
    text: t = 4
  distractors:
  - t = 0.5
  - t = 5
  explanation: '$v(t) = 3(t - 1)(t - 3)$, so the particle turns around at $t = 1$ and $t = 3$. Positions: $s(0) = 0$ (start, marker 1), $s(1) = 4$ (first turn, marker 2), $s(2) = 8 - 24 + 18 = 2$ (marker 3, on the way back), $s(3) = 0$ (second turn, marker 4), $s(4) = 64 - 96 + 36 = 4$ (marker 5). At $t = 0.5$ the particle is at $s = 3.125$, on the first pass, and at $t = 5$ it is at $s = 20$.'
- id: calc-m6-r2-q22
  lesson: calc-motion-average
  type: text
  topic: Average value
  stem: The average value of $f(x) = 2x$ on $[0, 5]$ is ___.
  accept:
  - '5'
  explanation: '$f_{\text{avg}} = \frac{1}{5 - 0}\int_0^5 2x\,dx = \frac15\Big[x^2\Big]_0^5 = \frac{25}{5} = 5$. Forgetting to divide by $b - a$ gives 25. (For a line, the average value is the value at the midpoint: $f(2.5) = 5$.)'
- id: calc-m6-r2-q23
  lesson: calc-motion-average
  topic: Motion along a line
  stem: A particle has velocity $v(t) = t^2 - 4t + 3$ m/s for $0 \le t \le 4$. Which statements are true? Select all that apply.
  choices:
  - It changes direction at $t = 1$.
  - It changes direction at $t = 3$.
  - Its displacement on $[0, 4]$ is $4$ m.
  - The total distance it travels on $[0, 4]$ is $4$ m.
  answer:
  - 0
  - 1
  - 3
  explanation: '$v = (t - 1)(t - 3)$ changes sign at both $t = 1$ and $t = 3$. With $S(t) = \frac{t^3}{3} - 2t^2 + 3t$: $S(0) = 0$, $S(1) = \frac43$, $S(3) = 0$, $S(4) = \frac43$. Displacement is $S(4) - S(0) = \frac43$ m, not 4. Distance adds the absolute values of the three pieces: $\frac43 + \frac43 + \frac43 = 4$ m.'
- id: calc-m6-r2-q24
  lesson: calc-motion-average
  type: match
  module_quiz: true
  topic: Average value
  stem: Match each expression to what it measures.
  pairs:
  - - $\int_a^b v(t)\,dt$
    - Displacement
  - - $\int_a^b |v(t)|\,dt$
    - Total distance traveled
  - - $\frac{1}{b - a}\int_a^b f(x)\,dx$
    - Average value of f
  - - $\frac{f(b) - f(a)}{b - a}$
    - Average rate of change of f
  distractors:
  - Speed at time b
  - Acceleration at time b
  explanation: $\int v\,dt$ is net change in position (displacement); $\int|v|\,dt$ counts all motion as positive (distance). Dividing $\int_a^b f$ by $b - a$ gives the average value, while $\frac{f(b) - f(a)}{b - a}$ is the average rate of change (the slope of a secant line). Speed and acceleration at a single time are not integrals.
- id: calc-m6-r2-q25
  lesson: calc-motion-average
  topic: Motion along a line
  stem: A tank holds 50 L at $t = 0$. Water flows in at $r(t) = 6 - 2t$ L/min (negative values mean water flows out). How much is in the tank at $t = 4$ min?
  choices:
  - $8$ L
  - $42$ L
  - $58$ L
  - $48$ L
  answer: 2
  explanation: 'Final = initial + accumulated change: $50 + \int_0^4(6 - 2t)\,dt = 50 + \Big[6t - t^2\Big]_0^4 = 50 + 8 = 58$ L. $8$ L forgets the initial amount; $42$ subtracts the change; $48$ adds the rate $r(4) = -2$ instead of the integral.'
- id: calc-m6-r2-h01
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Take $\ln x = \int_1^x \frac{dt}{t}$ as the definition. Which argument proves $\ln(ax) = \ln a + \ln x$ for $a, x > 0$?
  choices:
  - Both sides have derivative $\frac1x$, so they differ by a constant, and at $x = 1$ both equal $\ln a$.
  - Both sides equal $0$ at $x = 1$, so they are equal everywhere.
  - 'Apply $e^{(\;)}$ to both sides: each becomes $ax$.'
  - The area under $\frac1t$ is positive, so the areas add.
  answer: 0
  explanation: $\frac{d}{dx}\ln(ax) = \frac{a}{ax} = \frac1x = \frac{d}{dx}(\ln a + \ln x)$, so the two sides differ by a constant; at $x = 1$ both are $\ln a$, so the constant is 0. They are not both 0 at $x = 1$ (both are $\ln a$). Using $e^x$ is circular when $\ln$ is defined first, and positivity says nothing about the product law (and fails for $x < 1$ anyway).
- id: calc-m6-r2-h02
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Why is the left Riemann sum for $\int_1^2 \frac{dt}{t}$ an overestimate of $\ln 2$?
  choices:
  - $\frac1t$ is concave up on $[1, 2]$.
  - $\frac1t$ is positive on $[1, 2]$.
  - $\frac1t$ is decreasing on $[1, 2]$.
  - $\ln 2$ is less than 1.
  answer: 2
  explanation: For a decreasing function, each left endpoint is the highest point of its subinterval, so each left rectangle covers more than the area under the curve. Concavity governs midpoint and trapezoid errors, not left and right sums; positivity alone doesn't decide over or under.
- id: calc-m6-r2-h03
  lesson: calc-m6-h-integral-functions
  type: text
  topic: Functions defined by integrals
  stem: Let $F(x) = \int_0^x e^{-t^2}\,dt$. Then $F'(0) =$ ___ and $F''(0) =$ ___.
  accept:
  - - '1'
  - - '0'
  explanation: 'FTC 1: $F''(x) = e^{-x^2}$, so $F''(0) = 1$. Then $F''''(x) = -2xe^{-x^2}$, so $F''''(0) = 0$; since $F''''$ changes sign at 0, $F$ has its inflection point there.'
- id: calc-m6-r2-h04
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: For $x > 0$, where does $\operatorname{Si}(x) = \int_0^x \frac{\sin t}{t}\,dt$ have local maxima?
  choices:
  - $x = 2\pi, 4\pi, 6\pi, \ldots$
  - $x = \pi, 3\pi, 5\pi, \ldots$
  - $x = \tfrac\pi2, \tfrac{5\pi}2, \tfrac{9\pi}{2}, \ldots$
  - Only at $x = \pi$
  answer: 1
  explanation: $\operatorname{Si}'(x) = \frac{\sin x}{x}$, which for $x > 0$ has the sign of $\sin x$. It changes from $+$ to $-$ at odd multiples of $\pi$ (local maxima) and from $-$ to $+$ at even multiples (local minima). $\frac\pi2, \frac{5\pi}2, \ldots$ are where $\sin x$ is largest, which would be maxima of $\operatorname{Si}'$, not of $\operatorname{Si}$. $x = \pi$ gives the largest value overall, but $3\pi, 5\pi, \ldots$ are local maxima too.
- id: calc-m6-r2-h05
  lesson: calc-m6-h-integral-functions
  type: label
  topic: Functions defined by integrals
  stem: The graph shows $y = \operatorname{Si}(x)$ with two dashed lines. Name each numbered feature.
  image:
    src: images/calc-m6-sine-integral-blank.svg
    alt: The graph of y = Si(x) from about −2π to 4π, with dashed horizontal lines above and below the x-axis. The curve passes through the origin, rises to a peak at x = π, dips at x = 2π, and keeps oscillating with shrinking swings around the upper dashed line. Marker 1 is at the peak, marker 2 at the dip, marker 3 at the origin, and marker 4 on the upper dashed line at the left.
  labels:
  - x: 51.0
    y: 15.3
    text: Local maximum
  - x: 65.6
    y: 23.2
    text: Local minimum
  - x: 36.5
    y: 49.2
    text: Inflection point
  - x: 18.0
    y: 20.4
    text: Horizontal asymptote
  distractors:
  - Vertical asymptote
  - Cusp
  explanation: 'Marker 1 at $x = \pi$ is the highest point nearby: a local maximum. Marker 2 at $x = 2\pi$ is a local minimum. At marker 3, the origin, the curve switches from concave up to concave down: an inflection point. Marker 4 sits on the dashed line $y = \frac\pi2$, which the curve approaches as $x \to \infty$: a horizontal asymptote. $\operatorname{Si}$ is continuous and smooth everywhere, so it has no vertical asymptotes or cusps.'
- id: calc-m6-r2-h06
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Evaluate $\displaystyle\lim_{x\to0}\frac{1}{x^2}\int_0^x \sin t\,dt$.
  choices:
  - $1$
  - $0$
  - $2$
  - $\tfrac12$
  answer: 3
  explanation: 'It''s $\frac00$. L''Hôpital with FTC 1: $\lim\frac{\sin x}{2x} = \frac12$. Check directly: $\int_0^x\sin t\,dt = 1 - \cos x$, and $\frac{1 - \cos x}{x^2} \to \frac12$. Answering 1 forgets the 2 from differentiating $x^2$.'
- id: calc-m6-r2-h07
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Find $f$ and $a$ such that $\int_a^x f(t)\,dt = x^2 - 9$ for all $x$.
  choices:
  - $f(x) = 2x$; $a = 3$ or $a = -3$
  - $f(x) = 2x$; $a = 9$
  - $f(x) = x^2 - 9$; $a = 3$
  - $f(x) = 2x - 9$; $a = 0$
  answer: 0
  explanation: 'Differentiate both sides (FTC 1): $f(x) = 2x$. Set $x = a$: the integral is 0, so $a^2 - 9 = 0$ and $a = \pm3$. Check: $\int_3^x 2t\,dt = x^2 - 9$, and $\int_{-3}^x 2t\,dt = x^2 - 9$ too.'
- id: calc-m6-r2-h08
  lesson: calc-m6-h-integral-functions
  type: text
  topic: Functions defined by integrals
  stem: A continuous function satisfies $f(x) = 5 + 3\int_0^x f(t)\,dt$. Then $f(0) =$ ___ and $f'(0) =$ ___.
  accept:
  - - '5'
  - - '15'
  explanation: 'At $x = 0$ the integral vanishes: $f(0) = 5$. Differentiating gives $f''(x) = 3f(x)$, so $f''(0) = 15$. (In fact $f(x) = 5e^{3x}$.)'
- id: calc-m6-r2-h09
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Which functions have no elementary antiderivative? Select all that apply.
  choices:
  - $e^{-x^2}$
  - $\dfrac{\sin x}{x}$
  - $xe^{-x^2}$
  - $\sin(x^2)$
  answer:
  - 0
  - 1
  - 3
  explanation: '$e^{-x^2}$, $\frac{\sin x}{x}$ and $\sin(x^2)$ are standard examples whose antiderivatives are provably not elementary (they give $\operatorname{erf}$, $\operatorname{Si}$ and a Fresnel integral). $xe^{-x^2}$ is different: with $u = -x^2$ its antiderivative is $-\frac12e^{-x^2} + C$. The extra factor $x$ is exactly the derivative of the inside, up to a constant.'
- id: calc-m6-r2-h10
  lesson: calc-m6-h-integral-functions
  type: match
  topic: Functions defined by integrals
  stem: Match each function to its derivative.
  pairs:
  - - $\int_1^x \frac{dt}{t}$
    - 1/x
  - - $\operatorname{Si}(x)$
    - (sin x)/x
  - - $\int_0^x e^{-t^2}\,dt$
    - e^(−x²)
  - - $\int_0^{x^2}\cos t\,dt$
    - 2x cos(x²)
  distractors:
  - cos(x²)
  - −1/x²
  explanation: 'FTC 1 gives each derivative as the integrand at the upper limit: $\frac{d}{dx}\int_1^x\frac{dt}{t} = \frac1x$, $\operatorname{Si}''(x) = \frac{\sin x}{x}$, $\frac{d}{dx}\int_0^x e^{-t^2}dt = e^{-x^2}$. For the upper limit $x^2$, multiply by its derivative: $\cos(x^2)\cdot 2x$. The distractor cos(x²) forgets the chain rule.'
- id: calc-m6-r2-h11
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Find $\dfrac{d}{dx}\operatorname{erf}(x^3)$, where $\operatorname{erf}(x) = \frac{2}{\sqrt\pi}\int_0^x e^{-t^2}\,dt$.
  choices:
  - $\dfrac{2}{\sqrt\pi}e^{-x^6}$
  - $\dfrac{6x^2}{\sqrt\pi}e^{-x^5}$
  - $\dfrac{2}{\sqrt\pi}e^{-x^2}\cdot3x^2$
  - $\dfrac{6x^2}{\sqrt\pi}e^{-x^6}$
  answer: 3
  explanation: 'Chain rule: $\operatorname{erf}''(u) = \frac{2}{\sqrt\pi}e^{-u^2}$ with $u = x^3$, so the derivative is $\frac{2}{\sqrt\pi}e^{-(x^3)^2}\cdot3x^2 = \frac{6x^2}{\sqrt\pi}e^{-x^6}$. Note $(x^3)^2 = x^6$, not $x^5$; and the integrand must be evaluated at $x^3$, not $x$.'
- id: calc-m6-r2-h12
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: $f$ is continuous and even. What can you say about $F(x) = \int_0^x f(t)\,dt$?
  choices:
  - $F$ is even.
  - $F$ is odd.
  - $F$ can be even or odd, depending on $f$.
  - $F$ is periodic.
  answer: 1
  explanation: 'Substitute $t = -u$: $F(-x) = \int_0^{-x}f(t)\,dt = -\int_0^x f(-u)\,du = -\int_0^x f(u)\,du = -F(x)$. That is why $\operatorname{erf}$ and $\operatorname{Si}$ are odd. (If $f$ is odd, $F$ is even.)'
- id: calc-m6-r2-h13
  lesson: calc-m6-h-integral-functions
  type: order
  topic: Functions defined by integrals
  stem: Put the steps of the argument that $2 < e < 4$ in order, starting from $\ln x = \int_1^x\frac{dt}{t}$.
  items:
  - On $[1, 2]$, $\frac12 \le \frac1t \le 1$
  - So $\frac12 < \ln 2 < 1$
  - So $\ln 4 = 2\ln 2 > 1$
  - By the IVT, $\ln x = 1$ for some $x$ between 2 and 4
  explanation: 'First bound the integrand, which bounds the integral: $\frac12 < \ln 2 < 1$. The product law then gives $\ln 4 = 2\ln 2 > 1$, while $\ln 2 < 1$. Since $\ln$ is continuous and increasing, the IVT gives exactly one $x$ in $(2, 4)$ with $\ln x = 1$, and that number is $e$.'
- id: calc-m6-r2-h14
  lesson: calc-m6-h-integral-functions
  topic: Functions defined by integrals
  stem: Where is $F(x) = \int_0^x e^{-t^2}\,dt$ concave up?
  choices:
  - For $x > 0$
  - Everywhere
  - For $x < 0$
  - Nowhere
  answer: 2
  explanation: '$F''''(x) = \frac{d}{dx}e^{-x^2} = -2xe^{-x^2}$. Since $e^{-x^2} > 0$, the sign is the sign of $-2x$: positive for $x < 0$ (concave up) and negative for $x > 0$ (concave down).'
- id: calc-m6-r2-h15
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Evaluate $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac1n\left(\frac in\right)^3$.
  choices:
  - $\tfrac14$
  - $\tfrac13$
  - $1$
  - $\tfrac12$
  answer: 0
  explanation: 'Width $\frac1n$, sample points $\frac in$ on $[0, 1]$, $f(x) = x^3$: the limit is $\int_0^1x^3\,dx = \frac14$. ($\frac13$ would be $\int_0^1x^2\,dx$.)'
- id: calc-m6-r2-h16
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Which integral equals $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac2n\sqrt{1 + \frac{2i}{n}}$?
  choices:
  - $\displaystyle\int_0^2\sqrt x\,dx$
  - $\displaystyle\int_1^3\sqrt x\,dx$
  - $\displaystyle\int_1^3 2\sqrt x\,dx$
  - $\displaystyle\int_0^1\sqrt{1 + 2x}\,dx$
  answer: 1
  explanation: $\Delta x = \frac2n$ and $x_i = 1 + \frac{2i}{n} = 1 + i\,\Delta x$, so the interval is $[1, 3]$ and $f(x) = \sqrt x$. $\int_0^2\sqrt x\,dx$ has the wrong interval; $2\sqrt x$ counts the width twice; and $\int_0^1\sqrt{1 + 2x}\,dx$ uses width $\frac1n$, so it is only half the limit.
- id: calc-m6-r2-h17
  lesson: calc-m6-h-sums-integrals
  type: text
  topic: Sums and integrals
  stem: $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac4n\left(1 + \frac{4i}{n}\right) =$ ___.
  accept:
  - '12'
  explanation: '$\Delta x = \frac4n$, $x_i = 1 + i\Delta x$ on $[1, 5]$, $f(x) = x$: $\int_1^5x\,dx = \frac{25 - 1}{2} = 12$. Reading it as $\int_0^4$ (without changing $f$) gives the wrong answer 8.'
- id: calc-m6-r2-h18
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Evaluate $\displaystyle\sum_{i=1}^{10} i^2$.
  choices:
  - $330$
  - $3025$
  - $55$
  - $385$
  answer: 3
  explanation: $\frac{n(n + 1)(2n + 1)}{6} = \frac{10\cdot11\cdot21}{6} = 385$. $55$ is $\sum i$ and $3025 = 55^2$ is $\sum i^3$.
- id: calc-m6-r2-h19
  lesson: calc-m6-h-sums-integrals
  type: order
  topic: Sums and integrals
  stem: Put the steps of the telescoping proof that $\sum_{i=1}^n i = \frac{n(n + 1)}{2}$ in order.
  items:
  - Expand $(i + 1)^2 - i^2 = 2i + 1$
  - Sum both sides from $i = 1$ to $n$
  - The left side collapses to $(n + 1)^2 - 1$
  - 'Solve for the sum: $\frac{n(n + 1)}{2}$'
  explanation: 'Start from an identity for one term, sum it, let the left side collapse, then solve: $(n + 1)^2 - 1 = 2\sum i + n$, so $\sum i = \frac{n^2 + n}{2}$.'
- id: calc-m6-r2-h20
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: For $f(x) = x^2$ on $[0, 3]$ with $n = 30$ subintervals, what is $R_{30} - L_{30}$?
  choices:
  - $0.9$
  - $0.3$
  - $2.7$
  - $0.1$
  answer: 0
  explanation: $f$ is increasing, so $R_n - L_n = [f(3) - f(0)]\Delta x = 9\cdot\frac{3}{30} = 0.9$. $0.3$ uses $f(b) - f(a) = 3$ (the change in $x$, not in $f$); $2.7$ uses $\Delta x = 0.3$.
- id: calc-m6-r2-h21
  lesson: calc-m6-h-sums-integrals
  type: text
  topic: Sums and integrals
  stem: What is the smallest $n$ for which the bound $|f(b) - f(a)|\,\Delta x$ guarantees that a left or right sum for $\int_0^2 e^x\,dx$ is within 0.01 of the integral? $n =$ ___
  accept:
  - '1278'
  explanation: $e^x$ is increasing, so the error is at most $(e^2 - 1)\cdot\frac2n$. We need $\frac{2(e^2 - 1)}{n} \le 0.01$, so $n \ge 200(e^2 - 1) \approx 1277.8$. The smallest whole number is 1278.
- id: calc-m6-r2-h22
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: $f$ is positive and decreasing for $x \ge 1$. Which inequalities are true for every whole number $n \ge 2$? Select all that apply.
  choices:
  - $\displaystyle\sum_{i=1}^n f(i) \ge \int_1^{n+1} f(x)\,dx$
  - $\displaystyle\sum_{i=1}^n f(i) \le f(1) + \int_1^{n} f(x)\,dx$
  - $\displaystyle\sum_{i=1}^n f(i) \le \int_1^{n} f(x)\,dx$
  - $\displaystyle\sum_{i=1}^{n} f(i) \le \int_1^{n+1} f(x)\,dx$
  answer:
  - 0
  - 1
  explanation: 'Boxes of height $f(i)$ on $[i, i + 1]$ lie above the curve, so the sum is at least $\int_1^{n+1}f$; that rules out the fourth choice. Shifting the boxes for $i \ge 2$ one unit left puts them under the curve, so $\sum_{i=2}^n f(i) \le \int_1^n f$, and adding $f(1)$ gives the second. The third is false: the sum is at least $\int_1^{n+1}f$, which is bigger than $\int_1^n f$.'
- id: calc-m6-r2-h23
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Using $\ln(n + 1) \le H_n \le 1 + \ln n$, which bounds hold for $H_{100} = 1 + \frac12 + \cdots + \frac{1}{100}$?
  choices:
  - $3.61 \le H_{100} \le 4.61$
  - $5.61 \le H_{100} \le 6.61$
  - $4.61 \le H_{100} \le 5.61$
  - $4.61 \le H_{100} \le 4.71$
  answer: 2
  explanation: $\ln 101 \approx 4.615$ and $1 + \ln 100 \approx 5.605$, so $4.61 \le H_{100} \le 5.61$. (The true value is about 5.187.) The other ranges miss it.
- id: calc-m6-r2-h24
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Use $H_n \approx \ln n + 0.5772$ to estimate $H_{10000}$.
  choices:
  - $9.21$
  - $10.21$
  - $5.77$
  - $9.79$
  answer: 3
  explanation: $\ln 10000 = 4\ln 10 \approx 9.2103$, and $9.2103 + 0.5772 \approx 9.79$. (The true value is $9.7876$.) $9.21$ forgets the constant $\gamma$.
- id: calc-m6-r2-h25
  lesson: calc-m6-h-sums-integrals
  type: match
  topic: Sums and integrals
  stem: Match each limit (as $n \to \infty$) to its value.
  pairs:
  - - $\sum_{i=1}^n\frac1n\left(\frac in\right)^2$
    - 1/3
  - - $\sum_{i=1}^n\frac1n\left(\frac in\right)^3$
    - 1/4
  - - $\sum_{i=1}^n\frac{n}{n^2 + i^2}$
    - π/4
  - - $\sum_{i=1}^n\frac1n e^{i/n}$
    - e − 1
  distractors:
  - 1/2
  - π/2
  explanation: 'Each is a right sum on $[0, 1]$ with width $\frac1n$: $\int_0^1x^2\,dx = \frac13$, $\int_0^1x^3\,dx = \frac14$, $\int_0^1\frac{dx}{1 + x^2} = \frac\pi4$, $\int_0^1e^x\,dx = e - 1$.'
- id: calc-m6-r2-h26
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: Let $S = \sqrt1 + \sqrt2 + \cdots + \sqrt{100}$. Which statement is true?
  choices:
  - $\displaystyle\int_1^{101}\sqrt x\,dx \le S \le \int_0^{100}\sqrt x\,dx$
  - $\displaystyle\int_0^{100}\sqrt x\,dx \le S \le \int_1^{101}\sqrt x\,dx$
  - $\displaystyle S \le \int_0^{100}\sqrt x\,dx$
  - $\displaystyle S \ge \int_1^{101}\sqrt x\,dx$
  answer: 1
  explanation: $\sqrt x$ is increasing. A box of height $\sqrt i$ on $[i - 1, i]$ lies above the curve, so $S \ge \int_0^{100}\sqrt x\,dx \approx 666.67$; a box on $[i, i + 1]$ lies below it, so $S \le \int_1^{101}\sqrt x\,dx \approx 676.02$. The true sum is about 671.46, which rules out the last two choices; the second has the bounds swapped.
- id: calc-m6-r2-h27
  lesson: calc-m6-h-sums-integrals
  topic: Sums and integrals
  stem: $\displaystyle\lim_{n\to\infty}\sum_{i=1}^{n}\frac3n\left(2 + \frac{3i}{n}\right)^2$ can be written as $\int_0^3 f(x)\,dx$. What is $f(x)$?
  choices:
  - $x^2$
  - $3(2 + x)^2$
  - $(2 + x)^2$
  - $(2 + 3x)^2$
  answer: 2
  explanation: Take $x_i = \frac{3i}{n}$ on $[0, 3]$ with $\Delta x = \frac3n$; then each term is $f(x_i)\Delta x$ with $f(x) = (2 + x)^2$. Both readings, $\int_0^3(2 + x)^2dx$ and $\int_2^5x^2dx$, equal 39. $x^2$ on $[0, 3]$ would give only 9.
- id: calc-m6-r2-h28
  lesson: calc-m6-h-sums-integrals
  type: text
  topic: Sums and integrals
  stem: Evaluate $\displaystyle\sum_{i=1}^{9}\left[(i + 1)^2 - i^2\right] =$ ___.
  accept:
  - '99'
  explanation: 'It telescopes: $(2^2 - 1^2) + (3^2 - 2^2) + \cdots + (10^2 - 9^2) = 10^2 - 1^2 = 99$. Check: each term is $2i + 1$, and $\sum_{i=1}^9(2i + 1) = 2(45) + 9 = 99$.'
