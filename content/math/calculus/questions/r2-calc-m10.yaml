# Round 2 questions for calc-m10 (Sequences and series)
# Core lessons 40-44: calc-m10-r2-q01..q25. Honors 44h1: h01..h14; honors 44h2: h15..h28.

# ---- Lesson 40: sequences and series ----
- id: calc-m10-r2-q01
  lesson: calc-sequences-series
  type: label
  topic: Series basics
  stem: 'A square of area 1 is cut in half, then the leftover piece is cut in half, and so on. Name the area of each numbered piece.'
  image: {src: images/calc-m10-halves-blank.svg, alt: 'A square divided into a large left piece, an upper right piece, and smaller and smaller pieces in the lower right corner; four pieces are numbered'}
  labels:
    - {x: 32.1, y: 45.9, text: '1/2'}
    - {x: 67.9, y: 25.7, text: '1/4'}
    - {x: 58.9, y: 66.2, text: '1/8'}
    - {x: 76.8, y: 56.1, text: '1/16'}
  distractors: ['1/3', '1/6']
  explanation: |-
    Each cut halves what is left: the first piece is $\frac12$ of the square, the next is half of the remaining $\frac12$, which is $\frac14$, then $\frac18$, then $\frac1{16}$. Together the pieces fill the square, which is why $\frac12 + \frac14 + \frac18 + \cdots = 1$.
- id: calc-m10-r2-q02
  lesson: calc-sequences-series
  type: text
  module_quiz: true
  topic: Series basics
  stem: 'The geometric series $\displaystyle\sum_{n=1}^\infty 4\left(\frac13\right)^n$ has first term ___ and sum ___.'
  accept:
    - ['4/3', '1 1/3']
    - ['2']
  explanation: |-
    The first term is the $n = 1$ term, $4\cdot\frac13 = \frac43$ (not 4). The ratio is $\frac13$, so the sum is $\dfrac{4/3}{1 - 1/3} = \dfrac{4/3}{2/3} = 2$.
- id: calc-m10-r2-q03
  lesson: calc-sequences-series
  topic: Series basics
  stem: 'Which of these series diverge? Select all that apply.'
  choices: ['$\sum_{n=1}^\infty\dfrac{n}{2n + 1}$', '$\sum_{n=0}^\infty(-1)^n$', '$\sum_{n=1}^\infty\dfrac{1}{n}$', '$\sum_{n=0}^\infty\left(\dfrac23\right)^n$', '$\sum_{n=1}^\infty\dfrac{1}{n(n + 1)}$']
  answer: [0, 1, 2]
  explanation: |-
    $\frac{n}{2n + 1} \to \frac12$ and $(-1)^n$ never settles, so both fail the divergence test. The harmonic series diverges even though its terms go to 0 (group the terms into blocks that each add to at least $\frac12$). The geometric series with $r = \frac23$ converges (to 3), and the telescoping series $\sum\frac{1}{n(n + 1)}$ converges to 1.
- id: calc-m10-r2-q04
  lesson: calc-sequences-series
  type: order
  topic: Series basics
  stem: 'For the geometric series $1 - \frac12 + \frac14 - \frac18 + \cdots$, put these numbers in order from smallest to largest.'
  items: ['$S_2$', '$S_4$', 'the sum $S$', '$S_3$', '$S_1$']
  explanation: |-
    $S_1 = 1$, $S_2 = 0.5$, $S_3 = 0.75$, $S_4 = 0.625$, and $S = \dfrac{1}{1 - (-1/2)} = \dfrac23 \approx 0.667$. With a negative ratio the partial sums land alternately above and below the sum, closing in from both sides: $0.5 < 0.625 < 0.667 < 0.75 < 1$.
- id: calc-m10-r2-q05
  lesson: calc-sequences-series
  type: match
  module_quiz: true
  topic: Series basics
  stem: 'Match each series to its sum.'
  pairs:
    - ['$\sum_{n=0}^\infty\left(\frac13\right)^n$', '3/2']
    - ['$\sum_{n=1}^\infty\left(\frac12\right)^n$', '1']
    - ['$\sum_{n=0}^\infty\left(-\frac12\right)^n$', '2/3']
    - ['$\sum_{n=0}^\infty 2^n$', 'Diverges']
  distractors: ['2', '1/2']
  explanation: |-
    Use $\frac{\text{first term}}{1 - r}$ when $|r| < 1$: $\frac{1}{1 - 1/3} = \frac32$; $\frac{1/2}{1 - 1/2} = 1$ (the first term is the $n = 1$ term); $\frac{1}{1 + 1/2} = \frac23$. With $r = 2$ the series diverges; the formula would give the meaningless $-1$.

# ---- Lesson 41: integral test and comparison tests ----
- id: calc-m10-r2-q06
  lesson: calc-integral-comparison
  type: text
  module_quiz: true
  topic: Integral test
  stem: 'For $\sum\frac{1}{n^2}$, the integral test bounds the remainder after 4 terms as $\frac{1}{a} \le R_4 \le \frac{1}{b}$. Fill in $a$ = ___ and $b$ = ___.'
  accept:
    - ['5']
    - ['4']
  explanation: |-
    $\int_5^\infty\frac{dx}{x^2} \le R_4 \le \int_4^\infty\frac{dx}{x^2}$, and $\int_c^\infty\frac{dx}{x^2} = \frac1c$. So $\frac15 \le R_4 \le \frac14$: $a = 5$, $b = 4$. (The lower integral starts at $N + 1$, the upper at $N$.)
- id: calc-m10-r2-q07
  lesson: calc-integral-comparison
  type: match
  topic: Comparison tests
  stem: 'Match each series to the p-series you would use for a limit comparison.'
  pairs:
    - ['$\sum\dfrac{n + 1}{n^3 + 2}$', 'Compare with 1/n²']
    - ['$\sum\dfrac{1}{\sqrt n + 3}$', 'Compare with 1/√n']
    - ['$\sum\dfrac{\sqrt n}{n^2 + 1}$', 'Compare with 1/(n√n)']
    - ['$\sum\dfrac{n}{n^2 + 5}$', 'Compare with 1/n']
  distractors: ['Compare with 1/n³']
  explanation: |-
    Keep the dominant powers: $\frac{n}{n^3} = \frac{1}{n^2}$ (converges); $\frac{1}{\sqrt n}$ (diverges, $p = \frac12$); $\frac{n^{1/2}}{n^2} = \frac{1}{n^{3/2}}$ (converges); $\frac{n}{n^2} = \frac1n$ (diverges). In each case the limit of $\frac{a_n}{b_n}$ is 1.
- id: calc-m10-r2-q08
  lesson: calc-integral-comparison
  module_quiz: true
  topic: Comparison tests
  stem: 'Which of these series converge? Select all that apply.'
  choices: ['$\sum_{n=1}^\infty\dfrac{1}{n^2 + 1}$', '$\sum_{n=1}^\infty\dfrac{1}{\sqrt n}$', '$\sum_{n=2}^\infty\dfrac{\ln n}{n}$', '$\sum_{n=1}^\infty\dfrac{\sin^2 n}{3^n}$', '$\sum_{n=1}^\infty\dfrac{1}{n^{1.01}}$']
  answer: [0, 3, 4]
  explanation: |-
    $\frac{1}{n^2 + 1} < \frac{1}{n^2}$: converges. $\frac{1}{\sqrt n}$ is a p-series with $p = \frac12 \le 1$: diverges. $\frac{\ln n}{n} > \frac1n$ for $n \ge 3$: diverges. $0 \le \frac{\sin^2n}{3^n} \le \frac{1}{3^n}$: converges. $p = 1.01 > 1$: converges, though slowly.
- id: calc-m10-r2-q09
  lesson: calc-integral-comparison
  topic: Comparison tests
  stem: 'Every term of $\sum_{n=1}^\infty\frac{1}{n^2 + 4}$ is smaller than the matching term of $\sum_{n=1}^\infty\frac{1}{n^2} = \frac{\pi^2}{6}$. What can you conclude about $S = \sum_{n=1}^\infty\frac{1}{n^2 + 4}$?'
  choices: ['It converges, and $S = \frac{\pi^2}{6} - 4$', 'It converges, and $S < \frac{\pi^2}{6}$', 'It diverges, because it is compared with a larger series', 'Nothing, because comparison needs $b_n \le a_n$']
  answer: 1
  explanation: |-
    Smaller than a convergent series of positive terms means convergent, and its partial sums never exceed $\frac{\pi^2}{6}$, so $S < \frac{\pi^2}{6}$. Comparison gives no formula for $S$; subtracting 4 from each term's denominator does not subtract 4 from the sum.

# ---- Lesson 42: alternating series, ratio and root tests ----
- id: calc-m10-r2-q10
  lesson: calc-alternating-ratio
  type: label
  module_quiz: true
  topic: Alternating series
  stem: 'Every series falls into exactly one numbered region. Name each region.'
  image: {src: images/calc-m10-series-types-blank.svg, alt: 'Three nested regions with example series. The outer region holds sum 1/n, sum of (−1)^n and sum n/(n + 1). The middle ring holds (−1)^n/n, (−1)^n/√n and (−1)^n/ln n. The inner region holds (−1)^n/n², 1/2^n and (−1)^n/n!'}
  labels:
    - {x: 12, y: 9.5, text: Divergent}
    - {x: 15, y: 29.5, text: Conditionally convergent}
    - {x: 19, y: 43.5, text: Absolutely convergent}
  distractors: [Geometric, Telescoping]
  explanation: |-
    The inner series converge even with every sign made positive ($\sum\frac{1}{n^2}$, $\sum\frac{1}{2^n}$, $\sum\frac{1}{n!}$): absolutely convergent. The middle ones converge by the alternating series test, but $\sum\frac1n$, $\sum\frac{1}{\sqrt n}$ and $\sum\frac{1}{\ln n}$ diverge: conditionally convergent. The outer ones diverge.
- id: calc-m10-r2-q11
  lesson: calc-alternating-ratio
  type: text
  topic: Ratio and root tests
  stem: 'For $\displaystyle\sum_{n=1}^\infty\frac{n^3}{5^n}$, the ratio test gives $L$ = ___ .'
  accept: ['1/5']
  explanation: |-
    $\dfrac{(n + 1)^3}{5^{n+1}}\cdot\dfrac{5^n}{n^3} = \dfrac15\left(\dfrac{n + 1}{n}\right)^3 \to \dfrac15$. Since $L < 1$, the series converges absolutely.
- id: calc-m10-r2-q12
  lesson: calc-alternating-ratio
  module_quiz: true
  topic: Alternating series
  stem: 'Which of these series are conditionally convergent? Select all that apply.'
  choices: ['$\sum_{n=1}^\infty\dfrac{(-1)^n}{\sqrt n}$', '$\sum_{n=1}^\infty\dfrac{(-1)^n}{n^2}$', '$\sum_{n=1}^\infty(-1)^n\dfrac{n}{n + 1}$', '$\sum_{n=2}^\infty\dfrac{(-1)^n}{\ln n}$', '$\sum_{n=1}^\infty\dfrac{(-1)^n}{n}$']
  answer: [0, 3, 4]
  explanation: |-
    $\frac{1}{\sqrt n}$, $\frac{1}{\ln n}$ and $\frac1n$ decrease to 0, so those alternating series converge, but their absolute values diverge ($p = \frac12$; $\frac{1}{\ln n} > \frac1n$; harmonic): conditionally convergent. $\sum\frac{(-1)^n}{n^2}$ converges absolutely. $(-1)^n\frac{n}{n + 1}$ does not go to 0, so that series diverges.
- id: calc-m10-r2-q13
  lesson: calc-alternating-ratio
  type: match
  topic: Ratio and root tests
  stem: 'Following the strategy chart, match each series to the test that settles it.'
  pairs:
    - ['$\sum\dfrac{10^n}{n!}$', Ratio test]
    - ['$\sum\left(\dfrac{n}{3n + 1}\right)^n$', Root test]
    - ['$\sum\dfrac{(-1)^n}{\sqrt[3]{n}}$', Alternating series test]
    - ['$\sum\dfrac{n}{n + 1}$', Divergence test]
  distractors: [Integral test]
  explanation: |-
    $\frac{n}{n + 1} \to 1 \ne 0$: the divergence test settles it. The terms $\frac{10^n}{n!}$ do go to 0, and a factorial calls for the ratio test ($L = 0$, converges), and a whole term to the $n$th power for the root test. For $\sum\frac{(-1)^n}{n^{1/3}}$, the absolute values form a divergent p-series ($p = \frac13$), so the alternating series test is what shows (conditional) convergence.
- id: calc-m10-r2-q14
  lesson: calc-alternating-ratio
  topic: Alternating series
  stem: 'An alternating series meets the conditions of the alternating series test, with $S_5 = 0.80$ and $S_6 = 0.76$. Where must its sum $S$ lie?'
  choices: ['Below $0.76$', 'Exactly $0.78$', 'Between $0.76$ and $0.80$', 'Above $0.80$']
  answer: 2
  explanation: |-
    The partial sums zigzag around $S$ with shrinking steps, so the sum is always between two consecutive partial sums. The midpoint $0.78$ is a reasonable guess but not guaranteed.

# ---- Lesson 43: power series ----
- id: calc-m10-r2-q15
  lesson: calc-power-series
  type: label
  topic: Power series
  stem: 'The picture shows where a power series centered at $a$ with radius $R$ converges. Name each numbered part.'
  image: {src: images/calc-m10-radius-blank.svg, alt: 'A number line marked a − R, a and a + R, with the middle section shaded green, the outer sections shaded red, circles at the two endpoints and a double arrow from a to a + R; four parts are numbered'}
  labels:
    - {x: 37.5, y: 57, text: Converges absolutely}
    - {x: 85.7, y: 57, text: Diverges}
    - {x: 25, y: 57, text: Endpoint to test separately}
    - {x: 62.5, y: 34.3, text: Radius of convergence}
  distractors: [Converges conditionally, Always in the interval]
  explanation: |-
    Inside $|x - a| < R$ the series converges absolutely; outside it diverges; at $x = a \pm R$ anything can happen, so each endpoint is tested on its own. The distance $R$ from the center to either endpoint is the radius of convergence.
- id: calc-m10-r2-q16
  lesson: calc-power-series
  type: text
  module_quiz: true
  topic: Power series
  stem: 'The power series $\displaystyle\sum_{n=1}^\infty\frac{(x + 1)^n}{n\,4^n}$ has center ___ and radius of convergence ___.'
  accept:
    - ['-1', '−1']
    - ['4']
  explanation: |-
    $x + 1 = x - (-1)$, so the center is $-1$. Ratio test: $\frac{n}{n + 1}\cdot\frac{|x + 1|}{4} \to \frac{|x + 1|}{4} < 1$ gives $|x + 1| < 4$, so $R = 4$. (The interval of convergence is $[-5, 3)$.)
- id: calc-m10-r2-q17
  lesson: calc-power-series
  type: order
  module_quiz: true
  topic: Power series
  stem: 'Put the steps for finding the interval of convergence of $\sum c_n(x - a)^n$ in order.'
  items: ['Apply the ratio test to $|c_n(x - a)^n|$', 'Solve the resulting inequality for $|x - a| < R$', 'Write the open interval $(a - R, a + R)$', 'Plug in each endpoint and test those series', 'State the interval of convergence']
  explanation: |-
    The ratio test gives a limit of the form $K|x - a|$; solving $K|x - a| < 1$ gives $R$ and the open interval. Only then are there endpoints to test, and their results decide the final interval.
- id: calc-m10-r2-q18
  lesson: calc-power-series
  topic: Power series
  stem: 'A power series $\sum c_n(x - 2)^n$ has radius of convergence 3. At which $x$ must it converge? Select all that apply.'
  choices: ['$x = 0$', '$x = 4.9$', '$x = -1$', '$x = 6$', '$x = 2$']
  answer: [0, 1, 4]
  explanation: |-
    It converges when $|x - 2| < 3$, that is for $-1 < x < 5$: so at 0, 4.9 and the center 2. $x = -1$ is an endpoint, where it may or may not converge, so it isn't guaranteed. $x = 6$ is outside, where it diverges.
- id: calc-m10-r2-q19
  lesson: calc-power-series
  topic: Power series
  stem: 'What is the interval of convergence of $\displaystyle\sum_{n=1}^\infty\frac{(x - 3)^n}{n^2\,2^n}$?'
  choices: ['$[1, 5)$', '$(1, 5)$', '$(1, 5]$', '$[1, 5]$']
  answer: 3
  explanation: |-
    As in Example 1, $R = 2$ and the open interval is $(1, 5)$. At $x = 5$: $\sum\frac{1}{n^2}$ converges. At $x = 1$: $\sum\frac{(-1)^n}{n^2}$ converges absolutely. Both endpoints are included: $[1, 5]$. (With $n$ instead of $n^2$ the answer would be $[1, 5)$.)

# ---- Lesson 44: Taylor and Maclaurin series ----
- id: calc-m10-r2-q20
  lesson: calc-taylor
  type: text
  module_quiz: true
  topic: Taylor series
  stem: 'The coefficient of $x^4$ in the Maclaurin series of $e^{2x}$ is ___ . (Give an exact number.)'
  accept: ['2/3']
  explanation: |-
    Substitute $2x$ into $e^u = \sum\frac{u^n}{n!}$: the $x^4$ term is $\frac{(2x)^4}{4!} = \frac{16}{24}x^4 = \frac23x^4$.
- id: calc-m10-r2-q21
  lesson: calc-taylor
  type: match
  module_quiz: true
  topic: Taylor series
  stem: 'Match each function to the start of its Maclaurin series.'
  pairs:
    - ['$e^{-x}$', '1 − x + x²/2 − x³/6 + …']
    - ['$\cos x$', '1 − x²/2 + x⁴/24 − …']
    - ['$\ln(1 + x)$', 'x − x²/2 + x³/3 − …']
    - ['$\arctan x$', 'x − x³/3 + x⁵/5 − …']
    - ['$\sin x$', 'x − x³/6 + x⁵/120 − …']
  distractors: ['1 + x + x² + x³ + …']
  explanation: |-
    $e^{-x}$ comes from substituting $-x$ into $e^u$. $\cos x$ has the even powers over factorials; $\sin x$ the odd ones. $\ln(1 + x)$ and $\arctan x$ have plain denominators $n$ (from integrating geometric series), with all powers for $\ln$ and odd powers for $\arctan$. The distractor is $\frac{1}{1 - x}$.
- id: calc-m10-r2-q22
  lesson: calc-taylor
  topic: Taylor series
  stem: 'Let $P_3$ be the degree-3 Taylor polynomial of $f$ centered at $a$. Which statements are true? Select all that apply.'
  choices: ['$P_3(a) = f(a)$', '$P_3''(a) = f''(a)$', '$P_3''''''(a) = f''''''(a)$', '$P_3^{(4)}(a) = f^{(4)}(a)$ for every $f$', '$P_3(x) = f(x)$ for all $x$ near $a$']
  answer: [0, 1, 2]
  explanation: |-
    $P_n$ is built to match $f$ and its first $n$ derivatives at $a$, so $P_3$ matches $f$, $f'$, $f''$ and $f'''$ there. The fourth derivative of a cubic is 0, so it matches $f^{(4)}(a)$ only when that happens to be 0. Near $a$, $P_3$ is close to $f$, but generally not equal.
- id: calc-m10-r2-q23
  lesson: calc-taylor
  type: order
  topic: Taylor's remainder
  stem: 'Let $P_n$ be the Maclaurin polynomials of $e^x$. Put these numbers in order from smallest to largest.'
  items: ['$P_0(1)$', '$P_1(1)$', '$P_2(1)$', '$P_3(1)$', '$e$']
  explanation: |-
    $P_0(1) = 1$, $P_1(1) = 2$, $P_2(1) = 2.5$, $P_3(1) \approx 2.667$, $e \approx 2.718$. Every term $\frac{1}{n!}$ is positive, so each polynomial adds a little more and the values climb toward $e$ from below.
- id: calc-m10-r2-q24
  lesson: calc-taylor
  topic: Taylor series
  stem: 'What is the fastest way to find the Maclaurin series of $x\cos(x^2)$?'
  choices: ['Substitute $x^2$ into the series for $\cos u$, then multiply by $x$', 'Make a table of derivatives of $x\cos(x^2)$ at 0', 'Apply the ratio test to $x\cos(x^2)$', 'Multiply the series for $\cos x$ by $x^2$']
  answer: 0
  explanation: |-
    $\cos(x^2) = 1 - \frac{x^4}{2!} + \frac{x^8}{4!} - \cdots$, so $x\cos(x^2) = x - \frac{x^5}{2} + \frac{x^9}{24} - \cdots$. The derivatives of $x\cos(x^2)$ get messy fast, the ratio test finds a radius rather than a series, and $x^2\cos x$ is a different function.
- id: calc-m10-r2-q25
  lesson: calc-taylor
  type: text
  topic: Taylor's remainder
  stem: 'To bound the error of $P_4$ for $\sin x$ with the Lagrange error bound, you use a bound $M$ on the derivative of order ___ .'
  accept: ['5', 'five', 'fifth', '5th']
  explanation: |-
    For $P_n$ the bound uses $f^{(n+1)}$, here $f^{(5)}$: $|R_4(x)| \le \frac{M}{5!}|x|^5$. For $\sin x$, $M = 1$ works.

# ---- Honors 44h1: computing with series ----
- id: calc-m10-r2-h01
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'Using the alternating series error bound, about how many terms of the Leibniz series $1 - \frac13 + \frac15 - \cdots$ guarantee that four times the partial sum is within $0.001$ of $\pi$?'
  choices: ['About 20', 'About 200', 'About 2,000', 'About 4,000']
  answer: 2
  explanation: |-
    After $N$ terms the next term is $\frac{1}{2N + 1}$, so the error for $\pi$ is at most $\frac{4}{2N + 1}$. Need $2N + 1 > 4000$: $N = 2000$ terms. (4,000 comes from forgetting that the denominators are odd numbers, which skip by 2.)
- id: calc-m10-r2-h02
  lesson: calc-m10-h-computing
  type: text
  topic: Computing with series
  stem: 'If you stop $e = \sum_{k=0}^\infty\frac{1}{k!}$ after the $\frac{1}{5!}$ term, the bound $\frac{1}{n!\,n}$ says the error is less than 1/___ .'
  accept: ['600']
  explanation: |-
    With $n = 5$: $5!\cdot5 = 120\cdot5 = 600$, so the error is less than $\frac{1}{600} \approx 0.00167$. (The actual error is about $0.00162$.)
- id: calc-m10-r2-h03
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'Why does $\sum\frac{1}{k!}$ give $e$ so much faster than the Leibniz series gives $\pi$?'
  choices: ['Its terms shrink faster than any geometric series, so the tail is tiny after a few terms', 'It has only positive terms, and positive series always converge faster', 'It is a p-series with a large $p$', '$e$ is smaller than $\pi$, so fewer digits are needed']
  answer: 0
  explanation: |-
    Each term of $\sum\frac{1}{k!}$ is the previous one divided by $k$, so the ratio of terms goes to 0 and the tail is bounded by a rapidly shrinking geometric series. The Leibniz terms $\frac{1}{2k + 1}$ shrink only like $\frac1k$. Positivity has nothing to do with speed (the harmonic series is positive and diverges).
- id: calc-m10-r2-h04
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'Given $S_2 = 1 + \frac18 = 1.125$ for $\sum\frac{1}{n^3}$, which interval must contain the sum? (Use the integral bounds.)'
  choices: ['Between $1.25$ and $1.625$', 'Between $1.125$ and $1.25$', 'Between $1.0694$ and $1.125$', 'Between $1.1806$ and $1.25$']
  answer: 3
  explanation: |-
    $\int_c^\infty\frac{dx}{x^3} = \frac{1}{2c^2}$. Lower: $S_2 + \frac{1}{2\cdot9} = 1.125 + 0.0556 = 1.1806$. Upper: $S_2 + \frac{1}{2\cdot4} = 1.125 + 0.125 = 1.25$. (The true sum is about $1.2021$.)
- id: calc-m10-r2-h05
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'Which statements about the bounds $S_N + \int_{N+1}^\infty f \le S \le S_N + \int_N^\infty f$ are true? Select all that apply.'
  choices: ['They need the terms $f(n)$ to be positive and decreasing', 'The interval they give has width $\int_N^{N+1}f(x)\,dx$', 'Their midpoint is often a much better estimate than $S_N$', 'They apply to any alternating series', 'They show that $\int_1^\infty f(x)\,dx$ equals the sum']
  answer: [0, 1, 2]
  explanation: |-
    The bounds come from rectangles above and below a positive decreasing curve, and the gap between them is $\int_N^\infty f - \int_{N+1}^\infty f = \int_N^{N+1} f$. For $\sum\frac{1}{n^2}$ with $N = 10$, the midpoint is off by $0.0003$ while $S_{10}$ is off by $0.095$. Alternating series use the first-omitted-term bound instead, and the integral's value is not the sum.
- id: calc-m10-r2-h06
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'For a series with positive decreasing terms, the integral bounds give $2.30 \le S \le 2.36$. Taking the midpoint as the estimate, what is the estimate and the most it can be off by?'
  choices: ['$2.30$, off by at most $0.06$', '$2.33$, off by at most $0.03$', '$2.36$, off by at most $0.03$', '$2.33$, off by at most $0.06$']
  answer: 1
  explanation: |-
    The midpoint is $\frac{2.30 + 2.36}{2} = 2.33$. Since $S$ is somewhere in an interval of width $0.06$, the midpoint is at most half the width, $0.03$, from it. Using an endpoint could be off by the full $0.06$.
- id: calc-m10-r2-h07
  lesson: calc-m10-h-computing
  type: text
  topic: Computing with series
  stem: 'The Euler–Mascheroni constant is $\gamma = \lim_{N\to\infty}\left(H_N - \text{?}\right)$, where $H_N$ is the $N$th harmonic partial sum. The missing expression is ___ .'
  accept: ['ln N', 'ln(N)', 'log N', 'log(N)', 'natural log of N']
  explanation: |-
    $H_N$ grows like $\ln N$, and the gap $H_N - \ln N$ decreases toward $\gamma \approx 0.5772$.
- id: calc-m10-r2-h08
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'To compute $\ln 5$ with $\ln\frac{1 + x}{1 - x} = 2\left(x + \frac{x^3}{3} + \cdots\right)$, which $x$ do you use?'
  choices: ['$x = 4$', '$x = \frac15$', '$x = \frac45$', '$x = \frac23$']
  answer: 3
  explanation: |-
    Solve $\frac{1 + x}{1 - x} = 5$: $1 + x = 5 - 5x$, so $x = \frac46 = \frac23$. (In general $x = \frac{y - 1}{y + 1}$.) $x = 4$ is outside $(-1, 1)$, where the series diverges.
- id: calc-m10-r2-h09
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'Why does the series for $\ln\frac{1 + x}{1 - x}$ contain only odd powers of $x$?'
  choices: ['Because the even powers cancel when the series for $\ln(1 - x)$ is subtracted', 'Because $\ln$ is an odd function', 'Because the even powers are zero in the series for $\ln(1 + x)$', 'Because only odd powers converge for $|x| < 1$']
  answer: 0
  explanation: |-
    $\ln(1 + x) = x - \frac{x^2}{2} + \frac{x^3}{3} - \cdots$ and $\ln(1 - x) = -x - \frac{x^2}{2} - \frac{x^3}{3} - \cdots$ have the same even terms, so they cancel on subtraction and the odd terms double. (It's the function $\ln\frac{1 + x}{1 - x}$ that is odd, not $\ln$ itself.)
- id: calc-m10-r2-h10
  lesson: calc-m10-h-computing
  type: match
  topic: Computing with series
  stem: 'Match each quantity to the fast method from this lesson.'
  pairs:
    - ['$\pi$', 'Machin''s formula with arctangent series']
    - ['$\ln 2$', 'The ln((1 + x)/(1 − x)) series with x = 1/3']
    - ['$e^{10}$', 'Argument reduction, then a short Taylor polynomial']
    - ['$\sum\frac{1}{n^2}$ to 3 decimals', 'A partial sum plus integral bounds on the tail']
  distractors: ['The Leibniz series']
  explanation: |-
    Machin's formula uses arctangents of $\frac15$ and $\frac1{239}$, which converge fast. $x = \frac13$ makes $\frac{1 + x}{1 - x} = 2$. $e^{10} = 2^{14}e^{r}$ with small $r$. For $\sum\frac{1}{n^2}$, ten terms and the integral sandwich give the midpoint $1.64522$, within $0.0003$ of the sum (3 decimals; about 20 terms would give 4). The Leibniz series is the slow method these replace.
- id: calc-m10-r2-h11
  lesson: calc-m10-h-computing
  type: order
  topic: Computing with series
  stem: 'Put the steps for computing $e^x$ by argument reduction in order.'
  items: ['Find the whole number $k$ nearest to $x/\ln 2$', 'Compute $r = x - k\ln 2$', 'Evaluate a short polynomial approximation of $e^r$', 'Multiply the result by $2^k$']
  explanation: |-
    $k$ must be known before $r$ can be computed, $r$ before $e^r$, and $e^r$ before scaling: $e^x = 2^k e^r$.
- id: calc-m10-r2-h12
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'In the proof of Machin''s formula, with $\alpha = \arctan\frac15$, what is $\tan2\alpha$?'
  choices: ['$\frac25$', '$\frac{5}{12}$', '$\frac{1}{12}$', '$\frac{120}{119}$']
  answer: 1
  explanation: |-
    $\tan2\alpha = \dfrac{2\tan\alpha}{1 - \tan^2\alpha} = \dfrac{2/5}{1 - 1/25} = \dfrac{2/5}{24/25} = \dfrac{5}{12}$. ($\frac25$ forgets the denominator; $\frac{120}{119}$ is $\tan4\alpha$.)
- id: calc-m10-r2-h13
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'You use two terms of the series for $\arctan\frac15$ (that is, $\frac15 - \frac{1}{375}$) and one term for $\arctan\frac{1}{239}$ in $\pi = 16\arctan\frac15 - 4\arctan\frac1{239}$. About how large can the error be?'
  choices: ['About $0.1$', 'About $0.00003$', 'About $0.001$', 'About $0.01$']
  answer: 2
  explanation: |-
    The first omitted terms are $\frac{(1/5)^5}{5} = 0.000064$ and $\frac{(1/239)^3}{3} \approx 2.4\times10^{-8}$. Multiplied by 16 and 4: $16(0.000064) + 4(2.4\times10^{-8}) \approx 0.00102$. (The actual error is about $0.0010$; with three terms of the first series the bound drops to about $0.00003$.)
- id: calc-m10-r2-h14
  lesson: calc-m10-h-computing
  topic: Computing with series
  stem: 'A program finds $e^r$ with relative error below $10^{-6}$ and then multiplies by $2^{14} = 16384$ to get $e^{10}$. What can you say about the error in $e^{10}$?'
  choices: ['Its absolute error is 16384 times larger, but its relative error is still below $10^{-6}$', 'Both its absolute and relative errors are still below $10^{-6}$', 'Its relative error is 16384 times larger', 'Multiplying by $2^{14}$ removes the error']
  answer: 0
  explanation: |-
    Multiplying a number by $c$ multiplies its absolute error by $c$ and leaves the relative error (error divided by size) unchanged. In Example 5 the absolute error grew to about $0.016$, out of $22026$.

# ---- Honors 44h2: complex power series and Euler's formula ----
- id: calc-m10-r2-h15
  lesson: calc-m10-h-complex
  topic: Complex power series
  stem: 'Compute $(2 + i)(3 - i)$.'
  choices: ['$5 + i$', '$6 - i$', '$7 - i$', '$7 + i$']
  answer: 3
  explanation: |-
    $(2 + i)(3 - i) = 6 - 2i + 3i - i^2 = 6 + i + 1 = 7 + i$. Forgetting that $-i^2 = +1$ gives $5 + i$.
- id: calc-m10-r2-h16
  lesson: calc-m10-h-complex
  type: text
  topic: Complex power series
  stem: 'The modulus $|-5 + 12i|$ equals ___ .'
  accept: ['13']
  explanation: |-
    $|-5 + 12i| = \sqrt{(-5)^2 + 12^2} = \sqrt{169} = 13$, the distance from $-5 + 12i$ to 0 in the complex plane.
- id: calc-m10-r2-h17
  lesson: calc-m10-h-complex
  topic: Euler's formula
  stem: 'What is $e^{i\pi/2}$?'
  choices: ['$-1$', '$i$', '$-i$', '$1$']
  answer: 1
  explanation: |-
    $e^{i\pi/2} = \cos\frac\pi2 + i\sin\frac\pi2 = 0 + i = i$: a quarter turn around the unit circle from 1.
- id: calc-m10-r2-h18
  lesson: calc-m10-h-complex
  topic: Euler's formula
  stem: 'Which of these equal $-1$? Select all that apply.'
  choices: ['$e^{i\pi}$', '$i^2$', '$e^{3\pi i}$', '$e^{2\pi i}$', '$i^4$']
  answer: [0, 1, 2]
  explanation: |-
    $e^{i\pi} = \cos\pi + i\sin\pi = -1$, and $e^{3\pi i} = \cos3\pi + i\sin3\pi = -1$ (one and a half turns). $i^2 = -1$ by definition. $e^{2\pi i} = 1$ (a full turn) and $i^4 = (i^2)^2 = 1$.
- id: calc-m10-r2-h19
  lesson: calc-m10-h-complex
  topic: Complex power series
  stem: 'Does the geometric series $\displaystyle\sum_{n=0}^\infty\left(\frac z2\right)^n$ converge at $z = 1 + i$?'
  choices: ['No, because the terms are not real', 'No, because $|1 + i| = 2$', 'Yes, because $|1 + i| = \sqrt2 < 2$', 'Yes, because the real part of $1 + i$ is less than 2']
  answer: 2
  explanation: |-
    A geometric series converges when its ratio has modulus less than 1: $\left|\frac z2\right| = \frac{\sqrt2}{2} \approx 0.71 < 1$. Its disk of convergence is $|z| < 2$, and $1 + i$ is inside. Only the modulus matters, not the real part alone.
- id: calc-m10-r2-h20
  lesson: calc-m10-h-complex
  topic: Complex power series
  stem: 'What is the radius of convergence of the Taylor series of $\dfrac{1}{x^2 + 9}$ centered at $a = 4$?'
  choices: ['$3$', '$4$', '$7$', '$5$']
  answer: 3
  explanation: |-
    The denominator is zero at $x = \pm3i$. The distance from 4 to $3i$ is $\sqrt{4^2 + 3^2} = 5$ (the same for $-3i$), so $R = 5$. Three is the radius at center 0; 7 adds the distances instead of using the Pythagorean theorem.
- id: calc-m10-r2-h21
  lesson: calc-m10-h-complex
  type: text
  topic: Complex power series
  stem: 'The radius of convergence of the Maclaurin series of $\dfrac{1}{x^2 + 2x + 5}$ is $\sqrt{k}$ with $k$ = ___ .'
  accept: ['5']
  explanation: |-
    $x^2 + 2x + 5 = (x + 1)^2 + 4$ is zero at $x = -1 \pm 2i$. The distance from 0 is $\sqrt{1 + 4} = \sqrt5$, so $k = 5$.
- id: calc-m10-r2-h22
  lesson: calc-m10-h-complex
  type: match
  topic: Complex power series
  stem: 'Match each Taylor series to its radius of convergence.'
  pairs:
    - ['$\dfrac{1}{1 + x^2}$, centered at 0', '1']
    - ['$\tan x$, centered at 0', 'π/2']
    - ['$e^x$, centered at 0', 'Infinite']
    - ['$\dfrac{1}{4 + x^2}$, centered at 0', '2']
    - ['$\ln(1 + x)$, centered at 2', '3']
  distractors: ['√2']
  explanation: |-
    Distances to the nearest singularity: $\pm i$ are 1 from 0; $\pm\frac\pi2$ are $\frac\pi2$ from 0; $e^z$ has none; $\pm2i$ are 2 from 0; $-1$ is 3 from 2. ($\sqrt2$ is the radius of $\frac{1}{1 + x^2}$ centered at 1.)
- id: calc-m10-r2-h23
  lesson: calc-m10-h-complex
  type: order
  topic: Euler's formula
  stem: 'Put the steps of the derivation of Euler''s formula in order.'
  items: ['Define $e^z$ by its power series $\sum\frac{z^n}{n!}$', 'Substitute $z = i\theta$', 'Simplify the powers of $i$ using $i^2 = -1$', 'Group the real terms and the imaginary terms', 'Recognize the series for $\cos\theta$ and $\sin\theta$']
  explanation: |-
    The series must be defined before anything is substituted, the powers $i^n$ simplified before terms can be sorted into real and imaginary, and the sorted groups are what turn out to be the cosine and sine series.
- id: calc-m10-r2-h24
  lesson: calc-m10-h-complex
  topic: Euler's formula
  stem: 'Expand $(\cos\theta + i\sin\theta)^2$ and use De Moivre''s formula. What does the real part tell you $\cos2\theta$ equals?'
  choices: ['$2\sin\theta\cos\theta$', '$\cos^2\theta - \sin^2\theta$', '$\cos^2\theta + \sin^2\theta$', '$2\cos^2\theta + 1$']
  answer: 1
  explanation: |-
    $(\cos\theta + i\sin\theta)^2 = \cos^2\theta + 2i\sin\theta\cos\theta - \sin^2\theta$, and De Moivre says this equals $\cos2\theta + i\sin2\theta$. Real parts: $\cos2\theta = \cos^2\theta - \sin^2\theta$. The imaginary parts give $\sin2\theta = 2\sin\theta\cos\theta$.
- id: calc-m10-r2-h25
  lesson: calc-m10-h-complex
  topic: Euler's formula
  stem: 'Taking the imaginary part of $\int e^{(1 + i)x}\,dx$ gives $\int e^x\sin x\,dx =$'
  choices: ['$\frac{e^x}{2}(\cos x + \sin x) + C$', '$\frac{e^x}{2}(\cos x - \sin x) + C$', '$\frac{e^x}{2}(\sin x - \cos x) + C$', '$e^x(\sin x - \cos x) + C$']
  answer: 2
  explanation: |-
    $\frac{e^{(1 + i)x}}{1 + i} = \frac{e^x}{2}\left[(\cos x + \sin x) + i(\sin x - \cos x)\right]$, whose imaginary part is $\frac{e^x}{2}(\sin x - \cos x)$. Check: its derivative is $\frac{e^x}{2}(\sin x - \cos x) + \frac{e^x}{2}(\cos x + \sin x) = e^x\sin x$. The first choice is $\int e^x\cos x\,dx$.
- id: calc-m10-r2-h26
  lesson: calc-m10-h-complex
  topic: Euler's formula
  stem: 'Use $1 + i = \sqrt2\,e^{i\pi/4}$ to compute $(1 + i)^8$.'
  choices: ['$16$', '$16i$', '$-16$', '$256$']
  answer: 0
  explanation: |-
    $(1 + i)^8 = (\sqrt2)^8e^{i\cdot8\pi/4} = 16e^{2\pi i} = 16$. The modulus is $(\sqrt2)^8 = 16$, not $2^8 = 256$, and eight eighth-turns make a full turn.
- id: calc-m10-r2-h27
  lesson: calc-m10-h-complex
  type: label
  topic: Complex power series
  stem: 'The picture shows the complex plane for $f(z) = \frac{1}{1 + z^2}$ and its Taylor series centered at 0 and at 1. Name each numbered part.'
  image: {src: images/calc-m10-disk-blank.svg, alt: 'The complex plane with a shaded disk of radius 1 about 0, a highlighted real segment from −1 to 1, marked points at i and −i, and a dashed circle of radius √2 about the point 1; four parts are numbered'}
  labels:
    - {x: 39.6, y: 24.4, text: Singularity where f blows up}
    - {x: 28, y: 36, text: Disk of convergence for center 0}
    - {x: 52, y: 46.7, text: Real interval of convergence for center 0}
    - {x: 76, y: 18, text: Edge of the disk for center 1}
  distractors: [Zero of f, Disk of convergence for center i]
  explanation: |-
    $f$ blows up at $\pm i$. The series centered at 0 converges in the disk $|z| < 1$, whose slice on the real axis is $(-1, 1)$. Centered at 1, the nearest singularities are $\sqrt2$ away, so the disk there has radius $\sqrt2$ and its edge passes through $\pm i$. ($f$ has no zeros: $\frac{1}{1 + z^2}$ is never 0.)
- id: calc-m10-r2-h28
  lesson: calc-m10-h-complex
  topic: Complex power series
  stem: 'Why does $1 - x^2 + x^4 - \cdots$ stop converging at $x = \pm1$, even though $\frac{1}{1 + x^2}$ is smooth for all real $x$?'
  choices: ['Because the complex singularities $\pm i$ are at distance 1 from the center 0', 'Because $\frac{1}{1 + x^2}$ has a hidden vertical asymptote at $x = 1$', 'Because every Maclaurin series has radius 1', 'Because the terms alternate in sign']
  answer: 0
  explanation: |-
    The radius is the distance from the center to the nearest singularity in the complex plane, and $1 + z^2 = 0$ at $z = \pm i$, both at distance 1. On the real line nothing goes wrong, which is why the real graph gives no warning. Many Maclaurin series have other radii ($e^x$ has $R = \infty$), and alternating signs don't limit convergence.
