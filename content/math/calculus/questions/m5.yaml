# Module 5: Analyzing functions with derivatives
- id: calc-q-1701
  lesson: calc-extreme-values
  module_quiz: true
  topic: Extreme values
  stem: 'Find the absolute maximum value of $f(x) = x^3 - 3x$ on $[0, 3]$.'
  choices: ['$2$', '$0$', '$18$', '$-2$']
  answer: 2
  explanation: |-
    $f' = 3x^2 - 3 = 0$ at $x = 1$ (in the interval). Values: $f(0) = 0$, $f(1) = -2$, $f(3) = 18$. The max is 18 at the endpoint $x = 3$.
- id: calc-q-1702
  lesson: calc-extreme-values
  topic: Extreme values
  stem: 'Which of these is a critical number of $f(x) = x^{2/3}$?'
  choices: ['$x = 1$', '$x = 0$', '$x = -1$', 'There are none']
  answer: 1
  explanation: |-
    $f'(x) = \frac{2}{3x^{1/3}}$ is never 0 but is undefined at $x = 0$, which is in the domain. So 0 is a critical number (a cusp, where the absolute min occurs).
- id: calc-q-1703
  lesson: calc-extreme-values
  module_quiz: true
  topic: Extreme values
  stem: 'The Extreme Value Theorem guarantees an absolute max and min for which function?'
  choices: ['$f(x) = 1/x$ on $[-1, 1]$', '$f(x) = x^2$ on $(0, 2)$', '$f(x) = \tan x$ on $[0, \pi]$', '$f(x) = \sqrt{x}$ on $[0, 9]$']
  answer: 3
  explanation: |-
    The EVT needs continuity on a closed interval. $\sqrt x$ on $[0, 9]$ qualifies. $1/x$ and $\tan x$ have asymptotes inside their intervals, and $(0, 2)$ is open.
- id: calc-q-1704
  lesson: calc-extreme-values
  module_quiz: true
  topic: Mean Value Theorem
  stem: 'Find the value of $c$ guaranteed by the MVT for $f(x) = x^2$ on $[1, 5]$.'
  choices: ['$3$', '$6$', '$\sqrt{13}$', '$2$']
  answer: 0
  explanation: |-
    Average rate $\frac{25 - 1}{4} = 6$. $f'(c) = 2c = 6$, so $c = 3$. (For a quadratic, $c$ is always the midpoint.)
- id: calc-q-1705
  lesson: calc-extreme-values
  topic: Mean Value Theorem
  stem: 'A car travels 150 miles in 2.5 hours. What does the MVT guarantee?'
  choices:
    - 'The car''s speed never exceeded 60 mph'
    - 'The car''s speed was exactly 60 mph at some instant'
    - 'The car traveled at 60 mph the whole time'
    - 'The car''s speed was at least 60 mph for half the trip'
  answer: 1
  explanation: |-
    Average speed $150/2.5 = 60$ mph. With position differentiable in time, at some instant the instantaneous speed equals the average.
- id: calc-q-1706
  lesson: calc-extreme-values
  topic: Mean Value Theorem
  stem: 'Why doesn''t the MVT apply to $f(x) = |x - 1|$ on $[0, 3]$?'
  choices:
    - '$f$ is not continuous on $[0, 3]$'
    - '$f(0) \ne f(3)$'
    - '$f$ is not differentiable at $x = 1$, which is inside the interval'
    - 'It does apply'
  answer: 2
  explanation: |-
    $|x - 1|$ has a corner at $x = 1$. The MVT needs differentiability on the open interval. (Indeed, the average rate is $\frac{2 - 1}{3} = \frac13$, but $f'$ is only ever $\pm1$.)
- id: calc-q-1707
  lesson: calc-extreme-values
  topic: Mean Value Theorem
  stem: 'Rolle''s theorem applies to $f(x) = x^2 - 4x$ on $[0, 4]$. At what $c$ is $f''(c) = 0$?'
  choices:
    - '$c = 1$'
    - '$c = 4$'
    - '$c = 3$'
    - '$c = 2$'
  answer: 3
  explanation: |-
    $f(0) = f(4) = 0$, and $f'(c) = 2c - 4 = 0$ gives $c = 2$.
- id: calc-q-1708
  lesson: calc-extreme-values
  topic: Extreme values
  stem: 'If $f''(c) = 0$, which must be true?'
  choices: ['$f$ has a local max at $c$', '$f$ has a local min at $c$', '$c$ is a critical number of $f$ (if $c$ is in the domain)', '$f$ has an inflection point at $c$']
  answer: 2
  explanation: |-
    $f'(c) = 0$ makes $c$ a critical number, a candidate only. $x^3$ at 0 shows it need not be an extremum.
- id: calc-q-1709
  lesson: calc-extreme-values
  topic: Extreme values
  stem: 'Find the absolute minimum value of $f(x) = x + \dfrac{4}{x}$ on $[1, 4]$.'
  choices: ['$5$', '$2$', '$4$', '$1$']
  answer: 2
  explanation: |-
    $f' = 1 - \frac{4}{x^2} = 0$ at $x = 2$. Values: $f(1) = 5$, $f(2) = 4$, $f(4) = 5$. Minimum value 4 (at $x = 2$; "2" is where, not what).
- id: calc-q-1710
  lesson: calc-extreme-values
  topic: Mean Value Theorem
  stem: 'If $f''(x) = g''(x)$ for all $x$ in an interval, then on that interval'
  choices: ['$f = g$', '$f = g + C$ for some constant $C$', '$f = Cg$ for some constant $C$', '$f - g$ is increasing']
  answer: 1
  explanation: |-
    $(f - g)' = 0$, and by the MVT a function with zero derivative on an interval is constant.
- id: calc-q-1711
  lesson: calc-extreme-values
  topic: Extreme values
  stem: 'On $[0, 2\pi]$, the absolute maximum of $f(x) = \sin x + \cos x$ is'
  choices: ['$1$', '$2$', '$\sqrt2$', '$\tfrac{\sqrt2}{2}$']
  answer: 2
  explanation: |-
    $f' = \cos x - \sin x = 0$ at $x = \pi/4, 5\pi/4$. $f(\pi/4) = \sqrt2$, $f(5\pi/4) = -\sqrt2$, $f(0) = f(2\pi) = 1$. Max $\sqrt2$.

- id: calc-q-1801
  lesson: calc-first-derivative-test
  module_quiz: true
  topic: First derivative test
  stem: 'On which interval is $f(x) = x^3 - 12x$ decreasing?'
  choices: ['$(-2, 2)$', '$(-\infty, -2)$', '$(2, \infty)$', '$(0, \infty)$']
  answer: 0
  explanation: |-
    $f' = 3x^2 - 12 = 3(x - 2)(x + 2)$, negative between $-2$ and $2$.
- id: calc-q-1802
  lesson: calc-first-derivative-test
  module_quiz: true
  topic: First derivative test
  stem: '$f''(x) = (x - 1)^2(x + 3)$. Which describes $f$''s critical numbers?'
  choices:
    - 'Local max at $x = -3$, local min at $x = 1$'
    - 'Local min at $x = -3$, local max at $x = 1$'
    - 'Local min at $x = -3$; no extremum at $x = 1$'
    - 'Local min at both'
  answer: 2
  explanation: |-
    $(x - 1)^2 \ge 0$ never changes sign, so the sign of $f'$ is the sign of $x + 3$: negative then positive at $-3$ (local min), and positive on both sides of 1 (no extremum).
- id: calc-q-1803
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'Find the local maximum value of $f(x) = 2x^3 - 9x^2 + 12x$.'
  choices: ['$4$', '$1$', '$5$', '$2$']
  answer: 2
  explanation: |-
    $f' = 6x^2 - 18x + 12 = 6(x - 1)(x - 2)$: $+$ then $-$ at $x = 1$, so local max $f(1) = 2 - 9 + 12 = 5$. (At $x = 2$, local min $f(2) = 4$.)
- id: calc-q-1804
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'The graph of $f''$ crosses the $x$-axis from below to above at $x = 4$. What happens to $f$ at $x = 4$?'
  choices: ['Local maximum', 'Inflection point', 'Local minimum', 'Nothing can be concluded']
  answer: 2
  explanation: |-
    $f'$ goes from negative to positive: $f$ decreases then increases, a local min.
- id: calc-q-1805
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'A student says "$f''(2) = 0$, so $f$ has a local maximum at $x = 2$." What is missing?'
  choices:
    - 'Nothing; that is a complete justification'
    - 'Showing $f(2) > 0$'
    - 'Showing $f''(2) = 0$ twice'
    - 'Showing $f''$ changes from positive to negative at $x = 2$'
  answer: 3
  explanation: |-
    $f'(2) = 0$ only makes 2 a candidate. The first derivative test needs the sign change $+$ to $-$.
- id: calc-q-1806
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'Where is $f(x) = xe^{-x}$ increasing?'
  choices: ['$(-\infty, 1)$', '$(1, \infty)$', '$(0, \infty)$', '$(-\infty, 0)$']
  answer: 0
  explanation: |-
    $f' = e^{-x} - xe^{-x} = e^{-x}(1 - x)$; $e^{-x} > 0$, so $f' > 0$ when $x < 1$.
- id: calc-q-1807
  lesson: calc-first-derivative-test
  module_quiz: true
  topic: First derivative test
  stem: 'How many local extrema does $f(x) = x^3 + 3x$ have?'
  choices: ['$2$', '$1$', '$3$', '$0$']
  answer: 3
  explanation: |-
    $f' = 3x^2 + 3 > 0$ everywhere, so $f$ is always increasing and has no critical numbers.
- id: calc-q-1808
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'Find the local minimum of $f(x) = x\ln x$ ($x > 0$).'
  choices: ['At $x = e$', 'At $x = 1/e$', 'At $x = 1$', 'There is none']
  answer: 1
  explanation: |-
    $f' = \ln x + 1 = 0$ at $x = 1/e$; $f' < 0$ before and $> 0$ after. The min value is $-1/e$.
- id: calc-q-1809
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'Classify the critical number $x = 0$ of $f(x) = x^{4/3}$.'
  choices: ['Local maximum', 'Local minimum', 'Neither', 'Not a critical number']
  answer: 1
  explanation: |-
    $f'(x) = \frac43x^{1/3}$: zero at $x = 0$, negative for $x < 0$ and positive for $x > 0$. So a local (and absolute) min.
- id: calc-q-1810
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'The graph of $f''$ has a peak (local maximum) at $x = 3$, where $f''(3) = 5$. What does this say about $f$ at $x = 3$?'
  choices: ['$f$ has a local maximum', '$f$ has a local minimum', '$f$ is increasing fastest there (an inflection point)', '$f(3) = 5$']
  answer: 2
  explanation: |-
    $f'(3) = 5 > 0$, so $f$ is rising, not at an extremum. A max of $f'$ means $f$ is steepest there: $f'$ switches from increasing to decreasing, so $f$ has an inflection point.
- id: calc-q-1811
  lesson: calc-first-derivative-test
  topic: First derivative test
  stem: 'Which test values correctly fill a sign chart for $f''(x) = \dfrac{x - 2}{x + 1}$?'
  choices:
    - '$f'' > 0$ on $(-\infty, -1)$, $< 0$ on $(-1, 2)$, $> 0$ on $(2, \infty)$'
    - '$f'' < 0$ on $(-\infty, -1)$, $> 0$ on $(-1, 2)$, $< 0$ on $(2, \infty)$'
    - '$f'' > 0$ on $(-\infty, 2)$, $< 0$ on $(2, \infty)$'
    - '$f'' < 0$ on $(-\infty, 2)$, $> 0$ on $(2, \infty)$'
  answer: 0
  explanation: |-
    Test $x = -2$: $\frac{-4}{-1} > 0$. Test $x = 0$: $\frac{-2}{1} < 0$. Test $x = 3$: $\frac14 > 0$. The sign can change at $x = -1$ too, where $f'$ is undefined.

- id: calc-q-1901
  lesson: calc-concavity
  module_quiz: true
  topic: Concavity
  stem: 'On which interval is $f(x) = x^3 - 6x^2 + 4$ concave up?'
  choices:
    - '$(-\infty, 2)$'
    - '$(-\infty, 0)$'
    - '$(0, 4)$'
    - '$(2, \infty)$'
  answer: 3
  explanation: |-
    $f'' = 6x - 12 > 0$ when $x > 2$.
- id: calc-q-1902
  lesson: calc-concavity
  module_quiz: true
  topic: Concavity
  stem: '$f''(3) = 0$ and $f''''(3) = -4$. By the second derivative test, $f$ has'
  choices: ['a local minimum at $x = 3$', 'an inflection point at $x = 3$', 'no conclusion possible', 'a local maximum at $x = 3$']
  answer: 3
  explanation: |-
    Flat ($f' = 0$) and concave down ($f'' < 0$): a peak.
- id: calc-q-1903
  lesson: calc-concavity
  topic: Concavity
  stem: 'What are the inflection points of $f(x) = x^4 - 4x^3$?'
  choices: ['$x = 0$ and $x = 2$', '$x = 0$ and $x = 3$', '$x = 2$ only', '$x = 3$ only']
  answer: 0
  explanation: |-
    $f'' = 12x^2 - 24x = 12x(x - 2)$, which changes sign at both 0 and 2. (3 is a critical number, not an inflection point.)
- id: calc-q-1904
  lesson: calc-concavity
  topic: Concavity
  stem: 'Does $f(x) = x^4$ have an inflection point at $x = 0$?'
  choices: ['Yes, because $f''''(0) = 0$', 'No, because $f''''(x) = 12x^2$ does not change sign', 'Yes, because $f''(0) = 0$', 'No, because $f$ is not differentiable at 0']
  answer: 1
  explanation: |-
    $f''(0) = 0$ only makes 0 a candidate. Since $12x^2 \ge 0$ on both sides, $x^4$ is concave up throughout.
- id: calc-q-1905
  lesson: calc-concavity
  topic: Concavity
  stem: 'If $f''(c) = 0$ and $f''''(c) = 0$, the second derivative test says'
  choices: ['$c$ is a local minimum', '$c$ is an inflection point', 'the test is inconclusive', '$c$ is neither a max nor a min']
  answer: 2
  explanation: |-
    $x^4$, $-x^4$ and $x^3$ all have $f'(0) = f''(0) = 0$ but behave differently. Use the first derivative test.
- id: calc-q-1906
  lesson: calc-concavity
  module_quiz: true
  topic: Curve sketching
  stem: 'A function is decreasing and concave up on an interval. Which graph shape matches?'
  choices: ['Falling and getting steeper', 'Rising and leveling off', 'Rising and getting steeper', 'Falling and leveling off']
  answer: 3
  explanation: |-
    Decreasing: $f' < 0$. Concave up: $f'$ increasing, so the negative slopes approach 0. Like $e^{-x}$.
- id: calc-q-1907
  lesson: calc-concavity
  topic: Curve sketching
  stem: 'What are the asymptotes of $f(x) = \dfrac{2x^2}{x^2 - 9}$?'
  choices: ['$x = \pm3$ and $y = 2$', '$x = \pm3$ and $y = 0$', '$x = 9$ and $y = 2$', '$x = \pm3$ only']
  answer: 0
  explanation: |-
    The denominator vanishes at $\pm3$ (numerator nonzero there): vertical asymptotes. Equal degrees: horizontal asymptote $y = 2/1 = 2$.
- id: calc-q-1908
  lesson: calc-concavity
  topic: Concavity
  stem: 'The graph of $f''$ is increasing on $(0, 5)$. Then on $(0, 5)$, $f$ is'
  choices: ['increasing', 'concave up', 'concave down', 'decreasing']
  answer: 1
  explanation: |-
    $f'$ increasing means $f'' > 0$: concave up. It doesn't tell you whether $f$ itself is rising.
- id: calc-q-1909
  lesson: calc-concavity
  topic: Concavity
  stem: 'Use the second derivative test to classify the critical numbers of $f(x) = x^3 - 3x^2 - 9x$.'
  choices:
    - 'Local max at $x = 3$, local min at $x = -1$'
    - 'Local max at $x = -1$, local min at $x = 3$'
    - 'Both are local minima'
    - 'Inconclusive at both'
  answer: 1
  explanation: |-
    $f' = 3(x - 3)(x + 1)$; $f'' = 6x - 6$. $f''(-1) = -12 < 0$: max. $f''(3) = 12 > 0$: min.
- id: calc-q-1910
  lesson: calc-concavity
  topic: Concavity
  stem: 'For which function does the linear approximation at $x = 0$ underestimate nearby values?'
  choices: ['$f(x) = -x^2$', '$f(x) = \sqrt{x + 1}$', '$f(x) = \ln(1 + x)$', '$f(x) = e^x$']
  answer: 3
  explanation: |-
    $e^x$ is concave up ($f'' = e^x > 0$), so it lies above its tangent lines. The other three are concave down near 0.
- id: calc-q-1911
  lesson: calc-concavity
  topic: Curve sketching
  stem: 'A point $(c, f(c))$ where $f''''$ changes sign but $f(c)$ is undefined is'
  choices: ['an inflection point', 'a local extremum', 'not an inflection point, since it''s not on the graph', 'a critical point']
  answer: 2
  explanation: |-
    An inflection point must be a point on the graph. Concavity can change across a vertical asymptote (like $1/x$ at 0) without an inflection point.

- id: calc-q-2001
  lesson: calc-optimization
  module_quiz: true
  topic: Optimization
  stem: 'Two nonnegative numbers sum to 20. What is the largest possible product?'
  choices: ['$100$', '$99$', '$200$', '$400$']
  answer: 0
  explanation: |-
    $P = x(20 - x)$, $P' = 20 - 2x = 0$ at $x = 10$. $P(10) = 100$; endpoints give 0.
- id: calc-q-2002
  lesson: calc-optimization
  module_quiz: true
  topic: Optimization
  stem: 'A rectangle has perimeter 40 cm. What dimensions maximize its area?'
  choices: ['$5 \times 15$', '$8 \times 12$', '$4 \times 16$', '$10 \times 10$']
  answer: 3
  explanation: |-
    $A = x(20 - x)$, maximized at $x = 10$: a square with area 100 cm².
- id: calc-q-2003
  lesson: calc-optimization
  topic: Optimization
  stem: 'A box with a square base and open top has volume 32 ft³. Which base side minimizes the material used?'
  choices:
    - '$2$ ft'
    - '$8$ ft'
    - '$\sqrt[3]{32}$ ft'
    - '$4$ ft'
  answer: 3
  explanation: |-
    $x^2h = 32$ and $S = x^2 + 4xh = x^2 + \frac{128}{x}$. $S' = 2x - \frac{128}{x^2} = 0$ gives $x^3 = 64$, $x = 4$ ($h = 2$). $S'' > 0$ confirms a min.
- id: calc-q-2004
  lesson: calc-optimization
  topic: Optimization
  stem: 'In an optimization problem, what is the role of the constraint?'
  choices:
    - 'It is the quantity to be maximized'
    - 'It gives the answer directly'
    - 'It relates the variables so the objective can be written in one variable'
    - 'It is the derivative of the objective'
  answer: 2
  explanation: |-
    The constraint is the fixed condition (fixed perimeter, volume…). Solving it for one variable reduces the objective to a single-variable function.
- id: calc-q-2005
  lesson: calc-optimization
  topic: Optimization
  stem: '600 m of fence encloses a rectangle along a river (no fence on the river side). What is the maximum area?'
  choices: ['$22{,}500$ m²', '$90{,}000$ m²', '$45{,}000$ m²', '$40{,}000$ m²']
  answer: 2
  explanation: |-
    $A = x(600 - 2x)$ is maximized at $x = 150$: $150\cdot300 = 45{,}000$ m². (22,500 is the square that needs fence on all four sides.)
- id: calc-q-2006
  lesson: calc-optimization
  topic: Optimization
  stem: 'Which point on the line $y = 2x + 5$ is closest to the origin?'
  choices: ['$(-2, 1)$', '$(0, 5)$', '$(-2.5, 0)$', '$(-1, 3)$']
  answer: 0
  explanation: |-
    Minimize $D^2 = x^2 + (2x + 5)^2 = 5x^2 + 20x + 25$. Derivative $10x + 20 = 0$ at $x = -2$, giving $(-2, 1)$ at distance $\sqrt5$.
- id: calc-q-2007
  lesson: calc-optimization
  module_quiz: true
  topic: Optimization
  stem: 'Profit is $P(q) = 40q - 0.01q^2 - 2000$. Which production level maximizes profit?'
  choices: ['$4000$', '$2000$', '$1000$', '$40$']
  answer: 1
  explanation: |-
    $P' = 40 - 0.02q = 0$ at $q = 2000$; $P'' < 0$ confirms a maximum.
- id: calc-q-2008
  lesson: calc-optimization
  topic: Optimization
  stem: 'A closed cylindrical can holds a fixed volume. For least surface area, how does the height $h$ compare to the radius $r$?'
  choices: ['$h = r$', '$h = 2r$', '$h = \pi r$', '$h = 4r$']
  answer: 1
  explanation: |-
    Minimizing $S = 2\pi r^2 + \frac{2V}{r}$ gives $r^3 = \frac{V}{2\pi}$, so $h = \frac{V}{\pi r^2} = 2r$: height equals diameter.
- id: calc-q-2009
  lesson: calc-optimization
  topic: Optimization
  stem: 'On the open domain $x > 0$, $f$ has exactly one critical number $c$, and $f''''(x) > 0$ for all $x > 0$. Then $f(c)$ is'
  choices: ['the absolute maximum', 'an inflection value', 'the absolute minimum', 'not an extremum']
  answer: 2
  explanation: |-
    Concave up everywhere with a horizontal tangent at $c$: the graph lies above that tangent line everywhere, so $f(c)$ is the absolute min.
- id: calc-q-2010
  lesson: calc-optimization
  topic: Optimization
  stem: 'Squares of side $x$ are cut from the corners of a 10-in by 16-in sheet to make an open box. What is the domain of $x$?'
  choices: ['$0 \le x \le 8$', '$0 \le x \le 10$', '$0 \le x \le 5$', '$x \ge 0$']
  answer: 2
  explanation: |-
    The shorter side becomes $10 - 2x$, which must be $\ge 0$, so $x \le 5$. (The optimum turns out to be $x = 2$, volume 144 in³.)
- id: calc-q-2011
  lesson: calc-optimization
  topic: Optimization
  stem: 'To minimize the distance from a point to a curve, why is it valid to minimize the squared distance instead?'
  choices:
    - 'Because squaring is an increasing function on nonnegative numbers, so it has the same minimizer'
    - 'Because the derivative of a square root is zero'
    - 'Because distance is always an integer'
    - 'It isn''t valid; it gives a different point'
  answer: 0
  explanation: |-
    For $D \ge 0$, $D$ is smallest exactly when $D^2$ is smallest. $D^2$ avoids the square root, making the derivative simpler.
