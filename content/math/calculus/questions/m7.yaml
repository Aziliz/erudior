# Module 7: Applications of integration
- id: calc-q-2601
  lesson: calc-area-between
  module_quiz: true
  topic: Area between curves
  stem: 'Find the area between $y = x^2$ and $y = 2x$.'
  choices: ['$\tfrac43$', '$\tfrac83$', '$4$', '$\tfrac23$']
  answer: 0
  explanation: |-
    They meet at $x = 0$ and $x = 2$; the line is on top. $\int_0^2(2x - x^2)\,dx = 4 - \frac83 = \frac43$.
- id: calc-q-2602
  lesson: calc-area-between
  topic: Area between curves
  stem: 'Which integral gives the area between $y = 4 - x^2$ and $y = x + 2$?'
  choices:
    - '$\int_{-2}^{1}(x^2 + x - 2)\,dx$'
    - '$\int_{-2}^{1}(2 - x - x^2)\,dx$'
    - '$\int_{-1}^{2}(2 - x - x^2)\,dx$'
    - '$\int_{0}^{2}(4 - x^2)\,dx$'
  answer: 1
  explanation: |-
    $4 - x^2 = x + 2$ gives $x^2 + x - 2 = 0$, $x = -2, 1$. The parabola is on top (test $x = 0$: 4 vs 2), so the integrand is $(4 - x^2) - (x + 2) = 2 - x - x^2$. The area is $\frac92$.
- id: calc-q-2603
  lesson: calc-area-between
  module_quiz: true
  topic: Area between curves
  stem: 'Find the total area enclosed by $y = x^3$ and $y = x$.'
  choices: ['$0$', '$\tfrac14$', '$1$', '$\tfrac12$']
  answer: 3
  explanation: |-
    They meet at $-1, 0, 1$. Each lobe has area $\frac14$, total $\frac12$. Integrating $x - x^3$ straight across $[-1, 1]$ gives 0 because the lobes cancel.
- id: calc-q-2604
  lesson: calc-area-between
  topic: Area between curves
  stem: 'For the region between $x = y^2$ and $x = 4$, which setup uses horizontal slices?'
  choices: ['$\int_0^4(4 - y^2)\,dy$', '$\int_{-2}^{2}(4 - y^2)\,dy$', '$\int_{-2}^{2}(y^2 - 4)\,dy$', '$\int_0^4 2\sqrt x\,dy$']
  answer: 1
  explanation: |-
    At height $y$ the region runs from $x = y^2$ (left) to $x = 4$ (right), for $-2 \le y \le 2$. Area $= \frac{32}{3}$.
- id: calc-q-2605
  lesson: calc-area-between
  topic: Area between curves
  stem: 'Find the area between $y = e^x$ and $y = 1$ on $[0, 1]$.'
  choices: ['$e - 2$', '$e - 1$', '$e$', '$1$']
  answer: 0
  explanation: |-
    $\int_0^1(e^x - 1)\,dx = (e - 1) - 1 = e - 2 \approx 0.718$.
- id: calc-q-2606
  lesson: calc-area-between
  topic: Area between curves
  stem: 'Why does $\int_0^{\pi}(\cos x - \sin x)\,dx$ not give the area between $\sin x$ and $\cos x$ on $[0, \pi]$?'
  choices:
    - 'Because $\cos x$ is negative on part of the interval'
    - 'It does give the area'
    - 'Because the limits should be in $y$'
    - 'Because the curves cross at $x = \pi/4$, so the integrand changes sign and parts cancel'
  answer: 3
  explanation: |-
    After the crossing, $\sin x > \cos x$, so the integrand is negative there. Split at $\pi/4$ (or use $|\cos x - \sin x|$).
- id: calc-q-2607
  lesson: calc-area-between
  module_quiz: true
  topic: Area between curves
  stem: 'Find the area between $y = \sqrt x$ and $y = x$.'
  choices: ['$\tfrac12$', '$\tfrac13$', '$\tfrac16$', '$\tfrac23$']
  answer: 2
  explanation: |-
    They meet at 0 and 1; $\sqrt x \ge x$ there. $\int_0^1(\sqrt x - x)\,dx = \frac23 - \frac12 = \frac16$.
- id: calc-q-2608
  lesson: calc-area-between
  topic: Area between curves
  stem: 'When are horizontal slices ($dy$) the better choice for an area?'
  choices:
    - 'Whenever the region is above the $x$-axis'
    - 'When the left and right boundaries are simple functions of $y$ and vertical slices would need several integrals'
    - 'Only when the region is symmetric about the $y$-axis'
    - 'Never; they give a different answer'
  answer: 1
  explanation: |-
    Both methods give the same area. Choose the one where each slice runs between the same two curves throughout.
- id: calc-q-2609
  lesson: calc-area-between
  topic: Area between curves
  stem: 'Find the area between $y = 6 - x^2$ and $y = 2$.'
  choices: ['$\tfrac{16}{3}$', '$\tfrac{32}{3}$', '$8$', '$16$']
  answer: 1
  explanation: |-
    $6 - x^2 = 2$ at $x = \pm2$. $\int_{-2}^{2}(4 - x^2)\,dx = 16 - \frac{16}{3} = \frac{32}{3}$.
- id: calc-q-2610
  lesson: calc-area-between
  topic: Area between curves
  stem: 'Rain falls into a pond at $R(t)$ and evaporates at $E(t)$, with $R(t) \ge E(t)$ on $[0, 6]$. What does $\int_0^6[R(t) - E(t)]\,dt$ represent?'
  choices: ['The amount of water in the pond at $t = 6$', 'The net amount of water gained from $t = 0$ to $t = 6$', 'The average rainfall rate', 'The rate of change of the water level']
  answer: 1
  explanation: |-
    The integral of a net rate is a net change. To get the amount at $t = 6$ you'd add the initial amount.

- id: calc-q-2701
  lesson: calc-volumes-disks
  module_quiz: true
  topic: Volumes by slicing
  stem: 'The region under $y = x$ on $[0, 3]$ is rotated about the $x$-axis. Find the volume.'
  choices: ['$9\pi$', '$\tfrac92\pi$', '$27\pi$', '$3\pi$']
  answer: 0
  explanation: |-
    Disks of radius $x$: $\pi\int_0^3x^2\,dx = 9\pi$. (A cone with $r = h = 3$: $\frac13\pi(9)(3) = 9\pi$.)
- id: calc-q-2702
  lesson: calc-volumes-disks
  module_quiz: true
  topic: Volumes by slicing
  stem: 'The region between $y = \sqrt x$ and $y = x$ is rotated about the $x$-axis. Which integral gives the volume?'
  choices:
    - '$\pi\int_0^1(\sqrt x - x)^2\,dx$'
    - '$\pi\int_0^1(x^2 - x)\,dx$'
    - '$\pi\int_0^1(x - x^2)\,dx$'
    - '$2\pi\int_0^1(x - x^2)\,dx$'
  answer: 2
  explanation: |-
    Washers: $R = \sqrt x$ (farther), $r = x$. $\pi\int(R^2 - r^2) = \pi\int_0^1(x - x^2)\,dx = \frac{\pi}{6}$. Squaring the difference, $\pi\int_0^1(\sqrt x - x)^2\,dx$, is the common $(R - r)^2$ error; $x^2 - x$ is $r^2 - R^2$, backward.
- id: calc-q-2703
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'A solid''s base is the region between $y = 1 - x^2$ and the $x$-axis. Cross sections perpendicular to the $x$-axis are squares. Find the volume.'
  choices:
    - '$\tfrac43$'
    - '$\tfrac{16\pi}{15}$'
    - '$\tfrac{8}{15}$'
    - '$\tfrac{16}{15}$'
  answer: 3
  explanation: |-
    Side $s = 1 - x^2$; $V = \int_{-1}^1(1 - x^2)^2\,dx = \int_{-1}^{1}(1 - 2x^2 + x^4)\,dx = 2 - \frac43 + \frac25 = \frac{16}{15}$. Squares don't get a $\pi$.
- id: calc-q-2704
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'For a solid whose cross sections are semicircles with diameter $s$, the cross-sectional area is'
  choices: ['$\pi s^2$', '$\tfrac{\pi}{2}s^2$', '$\tfrac{\pi}{8}s^2$', '$\tfrac{\pi}{4}s^2$']
  answer: 2
  explanation: |-
    Radius $\frac s2$: half of $\pi\left(\frac s2\right)^2$ is $\frac{\pi s^2}{8}$.
- id: calc-q-2705
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'The region under $y = x^2$ on $[0, 1]$ is rotated about the line $y = -1$. What are the outer and inner radii?'
  choices: ['$R = x^2 + 1$, $r = 1$', '$R = x^2$, $r = 0$', '$R = 1$, $r = x^2$', '$R = x^2 - 1$, $r = 1$']
  answer: 0
  explanation: |-
    Distances to $y = -1$: the curve is at $x^2 - (-1) = x^2 + 1$; the $x$-axis is at distance 1.
- id: calc-q-2706
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'Rotate the region under $y = e^x$ on $[0, 1]$ about the $x$-axis. Find the volume.'
  choices: ['$\pi(e - 1)$', '$\tfrac{\pi}{2}(e^2 - 1)$', '$\pi(e^2 - 1)$', '$\tfrac{\pi}{2}e^2$']
  answer: 1
  explanation: |-
    $\pi\int_0^1e^{2x}\,dx = \frac\pi2(e^2 - 1)$.
- id: calc-q-2707
  lesson: calc-volumes-disks
  module_quiz: true
  topic: Volumes by slicing
  stem: 'Using disks to rotate a region about the $y$-axis, you integrate with respect to'
  choices: ['$x$', '$y$', '$\theta$', 'either, with the same integrand']
  answer: 1
  explanation: |-
    Disks are perpendicular to the axis of rotation, so for a vertical axis the slices are horizontal and you integrate in $y$.
- id: calc-q-2708
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'Use the disk method to derive the volume of a cone of radius $r$ and height $h$ (rotate $y = \frac rhx$, $0 \le x \le h$).'
  choices: ['$\pi r^2h$', '$\tfrac13\pi rh^2$', '$\tfrac12\pi r^2h$', '$\tfrac13\pi r^2h$']
  answer: 3
  explanation: |-
    $\pi\int_0^h\frac{r^2}{h^2}x^2\,dx = \pi\frac{r^2}{h^2}\cdot\frac{h^3}{3} = \frac13\pi r^2h$.
- id: calc-q-2709
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'A solid has base the disk $x^2 + y^2 \le 4$ and square cross sections perpendicular to the $x$-axis. What is the side of the square at position $x$?'
  choices: ['$\sqrt{4 - x^2}$', '$2\sqrt{4 - x^2}$', '$4 - x^2$', '$2$']
  answer: 1
  explanation: |-
    The base spans from $y = -\sqrt{4 - x^2}$ to $y = \sqrt{4 - x^2}$. (The volume is $\int_{-2}^{2}4(4 - x^2)\,dx = \frac{128}{3}$.)
- id: calc-q-2710
  lesson: calc-volumes-disks
  topic: Volumes by slicing
  stem: 'Rotate the region between $y = 2$ and $y = x^2$ (for $0 \le x \le \sqrt2$) about the line $y = 2$. Which integral gives the volume?'
  choices:
    - '$\pi\int_0^{\sqrt2}(4 - x^4)\,dx$'
    - '$2\pi\int_0^{\sqrt2}x(2 - x^2)\,dx$'
    - '$\pi\int_0^{\sqrt2}x^4\,dx$'
    - '$\pi\int_0^{\sqrt2}(2 - x^2)^2\,dx$'
  answer: 3
  explanation: |-
    The region touches the axis $y = 2$, so the slices are disks with radius $2 - x^2$ (distance from the parabola up to the line).

- id: calc-q-2801
  lesson: calc-volumes-shells
  module_quiz: true
  topic: Shell method
  stem: 'The region under $y = x^2$ on $[0, 2]$ is rotated about the $y$-axis. Using shells, the volume is'
  choices: ['$2\pi\int_0^2x^3\,dx = 8\pi$', '$\pi\int_0^2x^4\,dx$', '$2\pi\int_0^2x^2\,dx$', '$2\pi\int_0^4y\,dy$']
  answer: 0
  explanation: |-
    Radius $x$, height $x^2$: $2\pi\int_0^2x\cdot x^2\,dx = 2\pi\cdot4 = 8\pi$.
- id: calc-q-2802
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'Shells for rotation about the line $x = 3$, with vertical strips at position $x < 3$, have radius'
  choices: ['$x$', '$x - 3$', '$3$', '$3 - x$']
  answer: 3
  explanation: |-
    The radius is the distance from the strip to the axis: $3 - x$ for strips to the left of the line.
- id: calc-q-2803
  lesson: calc-volumes-shells
  module_quiz: true
  topic: Shell method
  stem: 'Compared to disks and washers, cylindrical shells are oriented'
  choices: ['perpendicular to the axis of rotation', 'parallel to the axis of rotation', 'at 45° to the axis', 'always vertically']
  answer: 1
  explanation: |-
    Shells come from strips parallel to the axis; disks come from slices perpendicular to it.
- id: calc-q-2804
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'The region between $y = x$ and $y = x^2$ is rotated about the $y$-axis. Find the volume with shells.'
  choices: ['$\tfrac{\pi}{6}$', '$\tfrac{\pi}{12}$', '$\tfrac{\pi}{3}$', '$\tfrac{2\pi}{15}$']
  answer: 0
  explanation: |-
    $2\pi\int_0^1x(x - x^2)\,dx = 2\pi\left(\frac13 - \frac14\right) = \frac\pi6$.
- id: calc-q-2805
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'Why is the shell method easier for rotating the region under $y = 3x^2 - x^3$ ($0 \le x \le 3$) about the $y$-axis?'
  choices:
    - 'Washers would require solving the cubic for $x$ in terms of $y$'
    - 'Shells don''t need a $\pi$'
    - 'The disk method only works about the $x$-axis'
    - 'Shells give a larger, more accurate answer'
  answer: 0
  explanation: |-
    Washers about the $y$-axis use horizontal slices, needing $x$ as a function of $y$. Shells use vertical strips with height $3x^2 - x^3$ directly.
- id: calc-q-2806
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'Rotate the region under $y = \sqrt x$, $0 \le x \le 4$, about the $y$-axis. Find the volume.'
  choices: ['$8\pi$', '$\tfrac{64\pi}{5}$', '$\tfrac{128\pi}{5}$', '$16\pi$']
  answer: 2
  explanation: |-
    $2\pi\int_0^4x\sqrt x\,dx = 2\pi\cdot\frac25\cdot4^{5/2} = 2\pi\cdot\frac{64}{5} = \frac{128\pi}{5}$.
- id: calc-q-2807
  lesson: calc-volumes-shells
  module_quiz: true
  topic: Shell method
  stem: 'Using shells to rotate a region about the $x$-axis, you integrate in'
  choices: ['$x$, with radius $x$', '$y$, with radius $y$', '$x$, with radius $y$', '$y$, with radius $x$']
  answer: 1
  explanation: |-
    Shells parallel to the $x$-axis come from horizontal strips at height $y$, whose distance to the axis is $y$.
- id: calc-q-2808
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'Rotate the triangle with vertices $(0,0)$, $(1,0)$, $(1,2)$ about the $y$-axis using shells. Find the volume.'
  choices: ['$\tfrac{2\pi}{3}$', '$\tfrac{4\pi}{3}$', '$2\pi$', '$\tfrac{\pi}{3}$']
  answer: 1
  explanation: |-
    The hypotenuse is $y = 2x$, so strips have height $2x$: $2\pi\int_0^1x\cdot2x\,dx = \frac{4\pi}{3}$.
- id: calc-q-2809
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'A student uses shells about $x = -1$ for a region with $0 \le x \le 2$ and writes the radius as $x - 1$. The correct radius is'
  choices: ['$x$', '$1 - x$', '$x + 1$', '$2 - x$']
  answer: 2
  explanation: |-
    Distance from $x$ to $-1$ is $x - (-1) = x + 1$.
- id: calc-q-2810
  lesson: calc-volumes-shells
  topic: Shell method
  stem: 'The volume of one cylindrical shell with radius $r$, height $h$ and thickness $\Delta r$ is approximately'
  choices:
    - '$\pi r^2h$'
    - '$2\pi r^2h$'
    - '$\pi r^2\Delta r$'
    - '$2\pi r h\,\Delta r$'
  answer: 3
  explanation: |-
    Unroll it into a slab: length $2\pi r$, height $h$, thickness $\Delta r$.

- id: calc-q-2901
  lesson: calc-arc-length-surface
  module_quiz: true
  topic: Arc length
  stem: 'Which integral gives the length of $y = \sin x$ from $0$ to $\pi$?'
  choices: ['$\int_0^\pi\sqrt{1 + \sin^2 x}\,dx$', '$\int_0^\pi\sqrt{1 + \cos x}\,dx$', '$\int_0^\pi(1 + \cos^2 x)\,dx$', '$\int_0^\pi\sqrt{1 + \cos^2 x}\,dx$']
  answer: 3
  explanation: |-
    $L = \int\sqrt{1 + (y')^2}\,dx$ with $y' = \cos x$. (Its value is about 3.820.)
- id: calc-q-2902
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'Find the length of $y = \tfrac23x^{3/2}$ from $x = 0$ to $x = 8$.'
  choices: ['$\tfrac{52}{3}$', '$18$', '$\tfrac{26}{3}$', '$\tfrac{56}{3}$']
  answer: 0
  explanation: |-
    $\int_0^8\sqrt{1 + x}\,dx = \frac23\left[(1 + x)^{3/2}\right]_0^8 = \frac23(27 - 1) = \frac{52}{3}$. (Forgetting to subtract the value at $x = 0$ gives 18; dropping the 2 in $\frac23$ gives $\frac{26}{3}$.)
- id: calc-q-2903
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'Find the length of the line $y = 3x + 1$ from $x = 0$ to $x = 2$ using the arc length formula.'
  choices: ['$6$', '$2\sqrt{10}$', '$\sqrt{10}$', '$8$']
  answer: 1
  explanation: |-
    $\int_0^2\sqrt{1 + 9}\,dx = 2\sqrt{10}$, matching the distance formula between $(0, 1)$ and $(2, 7)$.
- id: calc-q-2904
  lesson: calc-arc-length-surface
  module_quiz: true
  topic: Surface area
  stem: 'The surface area when $y = f(x) \ge 0$, $a \le x \le b$, is rotated about the $x$-axis is'
  choices:
    - '$\pi\int_a^b f(x)^2\,dx$'
    - '$2\pi\int_a^b f(x)\,dx$'
    - '$2\pi\int_a^b f(x)\sqrt{1 + [f''(x)]^2}\,dx$'
    - '$2\pi\int_a^b x\,f(x)\,dx$'
  answer: 2
  explanation: |-
    Bands of radius $f(x)$ and slant width $ds = \sqrt{1 + (f')^2}\,dx$. $\pi\int f^2\,dx$ is the disk-method volume, and $2\pi\int f\,dx$ forgets the slant factor in $ds$.
- id: calc-q-2905
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'A student simplifies $\sqrt{1 + (y'')^2}$ to $1 + y''$. Why is this wrong?'
  choices:
    - 'Square roots don''t distribute over sums'
    - 'It should be $1 - y''$'
    - 'It is right whenever $y'' > 0$'
    - 'The formula has no square root'
  answer: 0
  explanation: |-
    $\sqrt{a^2 + b^2} \ne a + b$ in general (e.g. $\sqrt{1 + 9} \ne 4$).
- id: calc-q-2906
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'For $y = \dfrac{x^3}{6} + \dfrac{1}{2x}$, what is $1 + (y'')^2$?'
  choices: ['$\left(\dfrac{x^2}{2} - \dfrac{1}{2x^2}\right)^2$', '$\left(\dfrac{x^2}{2} + \dfrac{1}{2x^2}\right)^2$', '$1 + \dfrac{x^4}{4}$', '$\dfrac{x^4}{4} + \dfrac{1}{4x^4}$']
  answer: 1
  explanation: |-
    $y' = \frac{x^2}{2} - \frac{1}{2x^2}$, $(y')^2 = \frac{x^4}{4} - \frac12 + \frac{1}{4x^4}$; adding 1 flips the middle term to $+\frac12$, a perfect square.
- id: calc-q-2907
  lesson: calc-arc-length-surface
  module_quiz: true
  topic: Surface area
  stem: 'Rotating $y = \sqrt{r^2 - x^2}$, $-r \le x \le r$, about the $x$-axis gives a sphere with surface area'
  choices: ['$\tfrac43\pi r^3$', '$2\pi r^2$', '$4\pi r^2$', '$\pi r^2$']
  answer: 2
  explanation: |-
    $f\sqrt{1 + (f')^2} = r$, so $S = 2\pi\int_{-r}^{r}r\,dx = 4\pi r^2$.
- id: calc-q-2908
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'The length of $y = x^2$ on $[0, 1]$ must be'
  choices: ['less than 1', 'exactly $\sqrt2$', 'at least $\sqrt2$', 'exactly 1.5']
  answer: 2
  explanation: |-
    A straight segment is the shortest path between $(0, 0)$ and $(1, 1)$, so the curve's length ($\approx 1.479$) is at least $\sqrt2 \approx 1.414$.
- id: calc-q-2909
  lesson: calc-arc-length-surface
  topic: Surface area
  stem: 'Rotate $y = x$, $0 \le x \le 1$, about the $x$-axis. Find the surface area (the side of a cone).'
  choices: ['$\pi$', '$\sqrt2\,\pi$', '$2\pi$', '$\tfrac{\sqrt2}{2}\pi$']
  answer: 1
  explanation: |-
    $2\pi\int_0^1x\sqrt2\,dx = \sqrt2\,\pi$. (Cone formula $\pi r\ell$ with $r = 1$, slant $\ell = \sqrt2$.)
- id: calc-q-2910
  lesson: calc-arc-length-surface
  topic: Arc length
  stem: 'For a curve given as $x = g(y)$, $c \le y \le d$, the arc length is'
  choices: ['$\int_c^d\sqrt{1 + [g''(y)]^2}\,dy$', '$\int_c^d g(y)\,dy$', '$\int_c^d\sqrt{1 + g(y)^2}\,dy$', '$\int_c^d\sqrt{1 + [g''(y)]^2}\,dx$']
  answer: 0
  explanation: |-
    Same formula with the roles of $x$ and $y$ swapped: $ds = \sqrt{1 + (dx/dy)^2}\,dy$.

- id: calc-q-3001
  lesson: calc-physics-apps
  module_quiz: true
  topic: Work
  stem: 'A spring has natural length 10 cm; a force of 40 N stretches it to 15 cm. How much work stretches it from 10 cm to 18 cm?'
  choices: ['$2.56$ J', '$3.2$ J', '$1.28$ J', '$256$ J']
  answer: 0
  explanation: |-
    $k = \frac{40}{0.05} = 800$ N/m. $W = \int_0^{0.08}800x\,dx = 400(0.0064) = 2.56$ J. (Using centimeters without converting gives 256.)
- id: calc-q-3002
  lesson: calc-physics-apps
  topic: Work
  stem: 'In Hooke''s law $F = kx$, what does $x$ measure?'
  choices:
    - 'The total length of the spring'
    - 'The work done'
    - 'The spring''s mass'
    - 'The distance stretched or compressed from natural length'
  answer: 3
  explanation: |-
    $x$ is the displacement from natural length. Measuring from the wrong point is the most common spring error.
- id: calc-q-3003
  lesson: calc-physics-apps
  module_quiz: true
  topic: Work
  stem: 'A cylindrical tank (radius 1 m, height 4 m) is full of water ($\rho g = 9800$ N/m³). Which integral gives the work to pump the water over the top? ($y$ = height above the bottom)'
  choices:
    - '$\int_0^4 9800\pi\,y\,dy$'
    - '$\int_0^4 9800\pi(4 - y)\,dy$'
    - '$\int_0^4 9800(4 - y)\,dy$'
    - '$\int_0^4 9800\pi(4 - y)^2\,dy$'
  answer: 1
  explanation: |-
    Layer weight $9800\cdot\pi(1)^2\,dy$, lifted $4 - y$. ($W = 9800\pi\cdot8 = 78{,}400\pi$ J.)
- id: calc-q-3004
  lesson: calc-physics-apps
  topic: Work
  stem: 'A 30-ft rope weighing 2 lb/ft hangs from a roof. How much work to pull it all up?'
  choices: ['$60$ ft·lb', '$1800$ ft·lb', '$900$ ft·lb', '$450$ ft·lb']
  answer: 2
  explanation: |-
    $\int_0^{30}2x\,dx = 900$ ft·lb.
- id: calc-q-3005
  lesson: calc-physics-apps
  module_quiz: true
  topic: Fluid force
  stem: 'Hydrostatic pressure at depth $d$ in a fluid of weight density $\rho g$ is'
  choices: ['$\rho g/d$', '$\rho g d^2$', '$\rho g d$', '$\rho g$']
  answer: 2
  explanation: |-
    Pressure is the weight of the column of fluid above a unit area: density times depth.
- id: calc-q-3006
  lesson: calc-physics-apps
  topic: Fluid force
  stem: 'A vertical square plate 2 m on a side has its top edge at the water surface. Find the fluid force ($\rho g = 9800$ N/m³).'
  choices: ['$19{,}600$ N', '$39{,}200$ N', '$78{,}400$ N', '$9{,}800$ N']
  answer: 1
  explanation: |-
    $\int_0^2 9800\,h\cdot2\,dh = 9800\cdot4 = 39{,}200$ N.
- id: calc-q-3007
  lesson: calc-physics-apps
  topic: Center of mass
  stem: 'Masses of 2 kg at $x = 1$ and 6 kg at $x = 5$. Where is the center of mass?'
  choices: ['$x = 3$', '$x = 4$', '$x = 3.5$', '$x = 2$']
  answer: 1
  explanation: |-
    $\bar x = \frac{2(1) + 6(5)}{8} = \frac{32}{8} = 4$.
- id: calc-q-3008
  lesson: calc-physics-apps
  module_quiz: true
  topic: Center of mass
  stem: 'Find $\bar x$ for the region under $y = x$ on $[0, 3]$ (a triangle).'
  choices: ['$1.5$', '$1$', '$2$', '$2.5$']
  answer: 2
  explanation: |-
    $A = \frac92$; $\int_0^3x\cdot x\,dx = 9$; $\bar x = \frac{9}{9/2} = 2$, two-thirds of the way toward the tall side.
- id: calc-q-3009
  lesson: calc-physics-apps
  topic: Center of mass
  stem: 'Where is the centroid of the region between $y = 4 - x^2$ and the $x$-axis?'
  choices:
    - '$(0, 2)$'
    - '$(1, 1.6)$'
    - '$(0, \tfrac43)$'
    - '$(0, 1.6)$'
  answer: 3
  explanation: |-
    By symmetry $\bar x = 0$. $A = \frac{32}{3}$; $\int_{-2}^{2}\frac12(4 - x^2)^2\,dx = \frac{256}{15}$; $\bar y = \frac{256/15}{32/3} = 1.6$.
- id: calc-q-3010
  lesson: calc-physics-apps
  topic: Work
  stem: 'Why do pumping problems slice the liquid into horizontal layers?'
  choices:
    - 'Because each layer is lifted a different distance, so the work per layer varies'
    - 'Because water is incompressible'
    - 'Because the tank is a cylinder'
    - 'Because pressure is constant'
  answer: 0
  explanation: |-
    Work = force × distance only works when the distance is constant. Within a thin layer it nearly is, so slice, compute, and integrate.
- id: calc-q-3011
  lesson: calc-physics-apps
  topic: Center of mass
  stem: 'By Pappus''s theorem, rotating a disk of radius 1 centered at $(3, 0)$ about the $y$-axis gives a torus of volume'
  choices: ['$3\pi^2$', '$6\pi$', '$6\pi^2$', '$9\pi^2$']
  answer: 2
  explanation: |-
    $V = A\cdot2\pi\bar r = \pi(1)^2\cdot2\pi(3) = 6\pi^2$.
