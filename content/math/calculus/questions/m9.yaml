# Module 9: Differential equations
- id: calc-q-3601
  lesson: calc-slope-fields-euler
  module_quiz: true
  topic: Euler's method
  stem: 'Use one step of Euler''s method with $h = 0.1$ for $\frac{dy}{dx} = 2x + y$, $y(1) = 3$. What is the estimate of $y(1.1)$?'
  choices: ['$3.5$', '$3.2$', '$3.05$', '$5$']
  answer: 0
  explanation: |-
    Slope at $(1, 3)$: $2 + 3 = 5$. $y_1 = 3 + 0.1(5) = 3.5$.
- id: calc-q-3602
  lesson: calc-slope-fields-euler
  topic: Euler's method
  stem: 'Two Euler steps with $h = 0.5$ for $\frac{dy}{dx} = y$, $y(0) = 1$. Estimate $y(1)$.'
  choices: ['$2$', '$2.718$', '$2.25$', '$2.5$']
  answer: 2
  explanation: |-
    $y_1 = 1 + 0.5(1) = 1.5$; $y_2 = 1.5 + 0.5(1.5) = 2.25$. The true value $e \approx 2.718$ is larger, because the solution is concave up.
- id: calc-q-3603
  lesson: calc-slope-fields-euler
  module_quiz: true
  topic: Slope fields
  stem: 'In a slope field, all segments in each vertical column are parallel. Which form must the equation have?'
  choices: ['$\frac{dy}{dx} = g(y)$', '$\frac{dy}{dx} = f(x)$', '$\frac{dy}{dx} = x + y$', '$\frac{dy}{dx} = xy$']
  answer: 1
  explanation: |-
    Same slope all the way up a column means the slope doesn't depend on $y$. Solutions are then vertical shifts of one another.
- id: calc-q-3604
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'For $\frac{dy}{dx} = y(y - 3)$, what are the equilibrium solutions?'
  choices: ['$y = 0$ and $y = 3$', '$y = 3$ only', '$x = 0$ and $x = 3$', '$y = -3$ and $y = 0$']
  answer: 0
  explanation: |-
    Equilibria are constant solutions, where $\frac{dy}{dx} = 0$ for all $x$: $y = 0$ and $y = 3$.
- id: calc-q-3605
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'Which function is a solution of $y'' = 3y$?'
  choices: ['$y = 3x$', '$y = e^{x/3}$', '$y = x^3$', '$y = 5e^{3x}$']
  answer: 3
  explanation: |-
    $y' = 15e^{3x} = 3(5e^{3x}) = 3y$. ✓ The others fail when substituted.
- id: calc-q-3606
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'At the point $(2, -1)$, the slope-field segment for $\frac{dy}{dx} = x^2y$ has slope'
  choices: ['$-4$', '$4$', '$-2$', '$2$']
  answer: 0
  explanation: |-
    $x^2y = 4(-1) = -4$.
- id: calc-q-3607
  lesson: calc-slope-fields-euler
  module_quiz: true
  topic: Euler's method
  stem: 'If the solution curve of a differential equation is concave down on an interval, Euler''s method there'
  choices: ['underestimates', 'is exact', 'overestimates', 'diverges']
  answer: 2
  explanation: |-
    Each Euler step follows a tangent line, and a concave-down curve lies below its tangent lines.
- id: calc-q-3608
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'Where are the slope-field segments horizontal for $\frac{dy}{dx} = x - 2y$?'
  choices: ['Along $y = 2x$', 'Along $x = 0$', 'Along $y = \frac x2$', 'Along $y = 0$']
  answer: 2
  explanation: |-
    Slope 0 when $x - 2y = 0$, i.e. on the line $y = \frac x2$.
- id: calc-q-3609
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'What is the order of $y'''' + 4y'' - y = \sin x$?'
  choices:
    - 'Second'
    - 'First'
    - 'Third'
    - 'Zero'
  answer: 0
  explanation: |-
    The highest derivative is $y''$, so the equation is second order.
- id: calc-q-3610
  lesson: calc-slope-fields-euler
  topic: Euler's method
  stem: 'In an Euler step from $(x_n, y_n)$, which slope is used?'
  choices: ['The slope at the end of the step', 'The average of the start and end slopes', 'The exact solution''s slope at $x_n + h$', 'The slope $F(x_n, y_n)$ at the start of the step']
  answer: 3
  explanation: |-
    $y_{n+1} = y_n + hF(x_n, y_n)$. (Averaging start and end slopes is an improved method, not Euler's.)
- id: calc-q-3611
  lesson: calc-slope-fields-euler
  topic: Slope fields
  stem: 'For $\frac{dy}{dx} = y(4 - y)$, a solution starts at $y(0) = 1$. What happens as $x\to\infty$?'
  choices: ['$y \to 4$', '$y \to 0$', '$y \to \infty$', '$y$ oscillates']
  answer: 0
  explanation: |-
    Between the equilibria 0 and 4 the slope is positive, so $y$ increases and levels off at the stable equilibrium 4.
- id: calc-q-3612
  lesson: calc-slope-fields-euler
  topic: Euler's method
  stem: 'Halving the step size in Euler''s method (same interval) roughly does what to the error?'
  choices: ['Halves it', 'Quarters it', 'Doubles it', 'Leaves it unchanged']
  answer: 0
  explanation: |-
    Euler's method is first order: the error is roughly proportional to $h$.

- id: calc-q-3701
  lesson: calc-separable
  module_quiz: true
  topic: Separable equations
  stem: 'Solve $\frac{dy}{dx} = \frac{x}{y}$ with $y(0) = 4$.'
  choices: ['$y = \sqrt{x^2 + 16}$', '$y = x + 4$', '$y = \sqrt{x^2 + 4}$', '$y = 4e^{x}$']
  answer: 0
  explanation: |-
    $y\,dy = x\,dx$ gives $y^2 = x^2 + C$; $C = 16$. Positive root since $y(0) > 0$.
- id: calc-q-3702
  lesson: calc-separable
  topic: Separable equations
  stem: 'Which equation is NOT separable?'
  choices: ['$\frac{dy}{dx} = xy$', '$\frac{dy}{dx} = e^{x + y}$', '$\frac{dy}{dx} = x + y$', '$\frac{dy}{dx} = \frac{\sin x}{y^2}$']
  answer: 2
  explanation: |-
    $x + y$ can't be written as $g(x)h(y)$. Note $e^{x + y} = e^xe^y$ is separable.
- id: calc-q-3703
  lesson: calc-separable
  module_quiz: true
  topic: Exponential and logistic models
  stem: 'A substance decays according to $\frac{dy}{dt} = -0.05y$ ($t$ in years). What is its half-life?'
  choices: ['$10$ years', '$20$ years', '$13.9$ years', '$6.9$ years']
  answer: 2
  explanation: |-
    $T = \frac{\ln2}{0.05} \approx 13.86$ years.
- id: calc-q-3704
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'A population triples in 5 years under exponential growth. What is $k$?'
  choices: ['$\frac{\ln3}{5}$', '$\frac35$', '$5\ln3$', '$\frac{\ln5}{3}$']
  answer: 0
  explanation: |-
    $e^{5k} = 3$, so $k = \frac{\ln3}{5} \approx 0.220$.
- id: calc-q-3705
  lesson: calc-separable
  module_quiz: true
  topic: Exponential and logistic models
  stem: 'For $\frac{dP}{dt} = 0.3P\left(1 - \frac{P}{800}\right)$ with $P(0) = 50$, what is $\lim_{t\to\infty}P(t)$, and at what population is growth fastest?'
  choices: ['$800$; $P = 800$', '$800$; $P = 400$', '$\infty$; $P = 400$', '$400$; $P = 200$']
  answer: 1
  explanation: |-
    The carrying capacity is 800; growth $\frac{dP}{dt}$ is a parabola in $P$ peaking at $P = \frac{M}{2} = 400$.
- id: calc-q-3706
  lesson: calc-separable
  topic: Separable equations
  stem: 'Solve $\frac{dy}{dx} = 3x^2y$, $y(0) = 2$.'
  choices: ['$y = 2e^{x^3}$', '$y = e^{x^3} + 1$', '$y = 2 + x^3$', '$y = 2e^{3x^2}$']
  answer: 0
  explanation: |-
    $\frac{dy}{y} = 3x^2dx$, $\ln|y| = x^3 + C$, $y = Ae^{x^3}$, $A = 2$.
- id: calc-q-3707
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'Coffee at 95°C cools in a 25°C room by Newton''s law. Which form does $T(t)$ have?'
  choices: ['$T = 95e^{kt}$', '$T = 25 + 70e^{kt}$ with $k < 0$', '$T = 95 - 25e^{kt}$', '$T = 70e^{kt} - 25$']
  answer: 1
  explanation: |-
    The difference $T - 25$ decays exponentially from $70$: $T = 25 + 70e^{kt}$, $k < 0$.
- id: calc-q-3708
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'The logistic solution $P(t) = \dfrac{1200}{1 + 5e^{-0.4t}}$ has what initial population?'
  choices: ['$240$', '$1200$', '$200$', '$6000$']
  answer: 2
  explanation: |-
    $P(0) = \frac{1200}{1 + 5} = 200$. (Check: $A = \frac{M - P_0}{P_0} = \frac{1000}{200} = 5$.)
- id: calc-q-3709
  lesson: calc-separable
  topic: Separable equations
  stem: 'After separating $\frac{dy}{dx} = \frac{2x}{\cos y}$, which equation results?'
  choices: ['$\sin y = x^2 + C$', '$\cos y = x^2 + C$', '$-\sin y = x^2 + C$', '$\sin y = 2x + C$']
  answer: 0
  explanation: |-
    $\cos y\,dy = 2x\,dx$ integrates to $\sin y = x^2 + C$.
- id: calc-q-3710
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'Money compounds continuously at 4% per year. How long does it take to double?'
  choices: ['$25$ years', '$17.3$ years', '$12.5$ years', '$18$ years']
  answer: 1
  explanation: |-
    $T = \frac{\ln2}{0.04} \approx 17.33$ years. (The "rule of 72" estimate, 18, is close but not exact.)
- id: calc-q-3711
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'A logistic population starts above its carrying capacity ($P_0 > M$). Over time it'
  choices: ['grows without bound', 'oscillates around $M$', 'decreases toward $M$', 'drops to 0']
  answer: 2
  explanation: |-
    For $P > M$, $1 - \frac PM < 0$, so $\frac{dP}{dt} < 0$; the population decreases toward the stable equilibrium $M$.
- id: calc-q-3712
  lesson: calc-separable
  topic: Separable equations
  stem: 'The solution of $\frac{dy}{dx} = y^2$, $y(0) = 1$ is $y = \frac{1}{1 - x}$. On what interval is it valid?'
  choices: ['All real $x$', '$x > 1$', '$x < 1$', '$x \ne 0$']
  answer: 2
  explanation: |-
    The solution blows up at $x = 1$. It's defined on the interval containing the initial point $x = 0$: $(-\infty, 1)$.
- id: calc-q-3713
  lesson: calc-separable
  topic: Exponential and logistic models
  stem: 'For a quantity with $\frac{dy}{dt} = ky$, what does the constant $k$ represent?'
  choices: ['The initial amount', 'The relative (per-unit) growth rate', 'The doubling time', 'The carrying capacity']
  answer: 1
  explanation: |-
    $k = \frac{1}{y}\frac{dy}{dt}$: the rate of change per unit of the quantity, like an interest rate.

- id: calc-q-lin-01
  lesson: calc-linear-de
  module_quiz: true
  topic: Linear differential equations
  stem: 'Find an integrating factor for $\dfrac{dy}{dx} + \dfrac3xy = x$, $x > 0$.'
  choices: ['$3\ln x$', '$e^{3x}$', '$x^3$', '$\dfrac{1}{x^3}$']
  answer: 2
  explanation: |-
    $\mu = e^{\int P\,dx} = e^{3\ln x} = x^3$. Check: $(x^3y)' = x^3y' + 3x^2y = x^3\left(y' + \frac3xy\right)$. ✓ $3\ln x$ is $\int P\,dx$ before exponentiating; $e^{3x}$ treats $P$ as 3 instead of $\frac3x$; $\frac1{x^3}$ comes from a sign slip, $e^{-3\ln x}$.
- id: calc-q-lin-02
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'Which differential equation is linear?'
  choices: ['$y'' + y^2 = x$', '$y'' + x^2y = e^x$', '$y'' = \sin y$', '$yy'' = x$']
  answer: 1
  explanation: |-
    $y' + x^2y = e^x$ has the form $y' + P(x)y = Q(x)$ with $P = x^2$, $Q = e^x$. The rest each have a nonlinear term: $y^2$ is a power of $y$, $\sin y$ puts $y$ inside a function, and $yy'$ multiplies $y$ by $y'$. (Functions of $x$ such as $x^2$ or $e^x$ are allowed.)
- id: calc-q-lin-03
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'Put $xy'' - 4y = x^5$ ($x > 0$) in standard form. What is $P(x)$?'
  choices: ['$-4$', '$\dfrac4x$', '$-4x$', '$-\dfrac4x$']
  answer: 3
  explanation: |-
    Divide by $x$: $y' - \frac4xy = x^4$, so $P(x) = -\frac4x$ (and $Q = x^4$). Using $-4$ skips dividing by the coefficient of $y'$; $\frac4x$ drops the minus sign; $-4x$ multiplies by $x$ instead of dividing.
- id: calc-q-lin-04
  lesson: calc-linear-de
  module_quiz: true
  topic: Linear differential equations
  stem: 'Solve $\dfrac{dy}{dx} + 2y = 6$ with $y(0) = 1$.'
  choices: ['$y = 3 - 2e^{-2x}$', '$y = 3 + 2e^{-2x}$', '$y = 3 - 2e^{2x}$', '$y = 6 - 5e^{-2x}$']
  answer: 0
  explanation: |-
    $\mu = e^{2x}$: $(e^{2x}y)' = 6e^{2x}$, so $e^{2x}y = 3e^{2x} + C$ and $y = 3 + Ce^{-2x}$. At $x = 0$: $1 = 3 + C$, $C = -2$. The plus version has the wrong sign of $C$ (it starts at 5); $e^{2x}$ grows instead of decaying (it doesn't satisfy the equation); and 6 is $b$, while the steady state is $\frac bk = 3$.
- id: calc-q-lin-05
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'Every solution of $\dfrac{dy}{dt} + 0.5y = 4$ approaches what value as $t \to \infty$?'
  choices: ['$4$', '$2$', '$8$', '$0$']
  answer: 2
  explanation: |-
    $y = \frac bk + Ce^{-kt}$ with $k = 0.5$, $b = 4$: the transient dies out and $y \to \frac{4}{0.5} = 8$. Equivalently, the equilibrium has $y' = 0$, so $0.5y = 4$. The value 4 forgets to divide by $k$; 2 multiplies by $k$ instead; and 0 is the limit only when $b = 0$.
- id: calc-q-lin-06
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'Solving $y'' + 2y = 1$, a student writes $(e^{2x}y)'' = e^{2x}$, then $e^{2x}y = \tfrac12e^{2x} + C$, then $y = \tfrac12 + C$. What went wrong?'
  choices: ['The integrating factor should be $e^{-2x}$', 'The constant must be divided by $e^{2x}$ too: $y = \tfrac12 + Ce^{-2x}$', 'The antiderivative of $e^{2x}$ is $2e^{2x}$', 'The right side should not have been multiplied by $e^{2x}$']
  answer: 1
  explanation: |-
    Dividing $e^{2x}y = \frac12e^{2x} + C$ by $e^{2x}$ divides every term, so $y = \frac12 + Ce^{-2x}$. The integrating factor $e^{\int2\,dx} = e^{2x}$ was right; $\int e^{2x}\,dx = \frac12e^{2x}$, so that step was right too; and the right side must be multiplied by $\mu$ like every other term.
- id: calc-q-lin-07
  lesson: calc-linear-de
  module_quiz: true
  topic: Linear differential equations
  stem: 'A 100 L tank starts with pure water. Brine containing 0.3 kg of salt per liter flows in at 5 L/min, and the well-mixed solution drains at 5 L/min. Which equation does the salt $Q(t)$ (kg) satisfy?'
  choices: ['$Q'' = 1.5 - 5Q$', '$Q'' = 0.3 - \dfrac{Q}{20}$', '$Q'' = 1.5 - \dfrac{Q}{20}$', '$Q'' = 1.5 - \dfrac{Q}{100}$']
  answer: 2
  explanation: |-
    Rate in $= 0.3(5) = 1.5$ kg/min. Rate out $=$ concentration $\times$ flow $= \frac{Q}{100}(5) = \frac{Q}{20}$. So $Q' = 1.5 - \frac{Q}{20}$. $5Q$ forgets to divide by the volume; $0.3$ is a concentration, not a rate (it needs the factor of 5 L/min); $\frac{Q}{100}$ is the outgoing concentration without multiplying by the flow.
- id: calc-q-lin-08
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'For the tank with $Q'' = 1.5 - \dfrac{Q}{20}$ (100 L, inflow 0.3 kg/L), how much salt does the tank hold in the long run?'
  choices: ['$30$ kg', '$1.5$ kg', '$150$ kg', '$0.3$ kg']
  answer: 0
  explanation: |-
    The steady state has $Q' = 0$: $\frac{Q}{20} = 1.5$, so $Q = 30$ kg. That is 100 L at the incoming 0.3 kg/L, as it must be. $1.5$ is the rate in (kg/min); $150$ multiplies the rate 1.5 by the volume 100, which mixes kg/min with liters; $0.3$ is the concentration (kg/L), not an amount.
- id: calc-q-lin-09
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'A tank holds 50 L at $t = 0$. Brine flows in at 4 L/min and the mixture drains at 2 L/min. What is the rate at which salt leaves, if the tank holds $Q(t)$ kg of salt?'
  choices: ['$\dfrac{2Q}{50}$ kg/min', '$\dfrac{4Q}{50 + 2t}$ kg/min', '$\dfrac{2Q}{50 - 2t}$ kg/min', '$\dfrac{2Q}{50 + 2t}$ kg/min']
  answer: 3
  explanation: |-
    The volume gains $4 - 2 = 2$ L each minute, so $V = 50 + 2t$, and salt leaves at concentration $\times$ outflow $= \frac{Q}{50 + 2t}(2)$. $\frac{2Q}{50}$ treats the volume as constant; using 4 confuses inflow with outflow; and $50 - 2t$ has the tank emptying when it is actually filling.
- id: calc-q-lin-10
  lesson: calc-linear-de
  module_quiz: true
  topic: Linear differential equations
  stem: 'An RL circuit has $R = 10\ \Omega$, $L = 2$ H and a constant 20 V source, with $I(0) = 0$. Find $I(t)$ in amperes.'
  choices: ['$2\left(1 - e^{-t/5}\right)$', '$2\left(1 - e^{-5t}\right)$', '$10\left(1 - e^{-5t}\right)$', '$2e^{-5t}$']
  answer: 1
  explanation: |-
    $2I' + 10I = 20$, so $I' + 5I = 10$. The steady state is $\frac{10}{5} = 2$ A $= \frac ER$, and $I = 2 + Ce^{-5t}$ with $C = -2$. The exponent $-t/5$ inverts $\frac RL$; 10 is $\frac EL$ rather than the steady state $\frac ER$; and $2e^{-5t}$ is only the transient, which starts at 2 instead of 0.
- id: calc-q-lin-11
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'What is the time constant of an RL circuit with $R = 8\ \Omega$ and $L = 0.5$ H?'
  choices: ['$16$ s', '$4$ s', '$0.0625$ s', '$8$ s']
  answer: 2
  explanation: |-
    In standard form $I' + \frac RLI = \frac EL$, so $k = \frac RL = 16$ per second and the time constant is $\frac1k = \frac LR = \frac{0.5}{8} = 0.0625$ s. 16 is $\frac RL$ itself (a rate, not a time); 4 is $RL$; 8 is just $R$.
- id: calc-q-lin-12
  lesson: calc-linear-de
  topic: Linear differential equations
  stem: 'Find the general solution of $\dfrac{dy}{dx} - y = e^{2x}$.'
  choices: ['$y = e^{2x} + Ce^x$', '$y = \tfrac13e^{2x} + Ce^{-x}$', '$y = e^{2x} + C$', '$y = \tfrac12e^{3x} + Ce^x$']
  answer: 0
  explanation: |-
    $P = -1$, so $\mu = e^{-x}$: $(e^{-x}y)' = e^{-x}e^{2x} = e^x$, giving $e^{-x}y = e^x + C$ and $y = e^{2x} + Ce^x$. Using $\mu = e^x$ (ignoring the minus sign in $P$) leads to $\frac13e^{2x} + Ce^{-x}$; $e^{2x} + C$ forgets to divide $C$ by $\mu$; and $\frac12e^{3x} + Ce^x$ comes from integrating $e^{2x}$ without first multiplying it by $\mu$.
