# Module 8: Techniques of integration
- id: calc-q-3101
  lesson: calc-by-parts
  module_quiz: true
  topic: Integration by parts
  stem: 'Find $\displaystyle\int x\cos x\,dx$.'
  choices: ['$x\sin x - \cos x + C$', '$x\sin x + \cos x + C$', '$\tfrac{x^2}{2}\sin x + C$', '$-x\sin x + \cos x + C$']
  answer: 1
  explanation: |-
    $u = x$, $dv = \cos x\,dx$: $x\sin x - \int\sin x\,dx = x\sin x + \cos x + C$. Getting $-\cos x$ at the end is the sign slip on $\int\sin x\,dx = -\cos x$.
- id: calc-q-3102
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'For $\int x^3\ln x\,dx$, LIATE says to choose'
  choices: ['$u = x^3$, $dv = \ln x\,dx$', '$u = x^3\ln x$, $dv = dx$', '$u = 1$, $dv = x^3\ln x\,dx$', '$u = \ln x$, $dv = x^3\,dx$']
  answer: 3
  explanation: |-
    Logarithms come first in LIATE. With $u = \ln x$, $du = \frac{dx}{x}$ simplifies, and $v = \frac{x^4}{4}$ is easy. Result: $\frac{x^4}{4}\ln x - \frac{x^4}{16} + C$.
- id: calc-q-3103
  lesson: calc-by-parts
  module_quiz: true
  topic: Integration by parts
  stem: 'Find $\displaystyle\int\ln x\,dx$.'
  choices: ['$\dfrac1x + C$', '$x\ln x + C$', '$x\ln x - x + C$', '$\dfrac{(\ln x)^2}{2} + C$']
  answer: 2
  explanation: |-
    $u = \ln x$, $dv = dx$: $x\ln x - \int x\cdot\frac1x\,dx = x\ln x - x + C$.
- id: calc-q-3104
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'Evaluate $\displaystyle\int_0^1xe^x\,dx$.'
  choices: ['$1$', '$e - 1$', '$e$', '$2e - 1$']
  answer: 0
  explanation: |-
    $[xe^x - e^x]_0^1 = (e - e) - (0 - 1) = 1$.
- id: calc-q-3105
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'In $\int e^x\sin x\,dx$, after integrating by parts twice you get $I = -e^x\cos x + e^x\sin x - I$. What is $I$?'
  choices: ['$e^x(\sin x - \cos x) + C$', '$0$', '$2e^x(\sin x - \cos x) + C$', '$\tfrac12e^x(\sin x - \cos x) + C$']
  answer: 3
  explanation: |-
    Move $I$ to the left: $2I = e^x(\sin x - \cos x)$, so $I = \frac12e^x(\sin x - \cos x) + C$.
- id: calc-q-3106
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'How many rounds of integration by parts does $\int x^4e^{x}\,dx$ need (with $u$ = the power of $x$)?'
  choices: ['$4$', '$1$', '$2$', '$5$']
  answer: 0
  explanation: |-
    Each round lowers the power of $x$ by one: $x^4 \to x^3 \to x^2 \to x \to 1$. The tabular method handles this neatly.
- id: calc-q-3107
  lesson: calc-by-parts
  module_quiz: true
  topic: Integration by parts
  stem: 'A student uses $u = e^x$, $dv = x\,dx$ for $\int xe^x\,dx$ and gets $\frac{x^2}{2}e^x - \int\frac{x^2}{2}e^x\,dx$. What does this show?'
  choices: ['The integral diverges', 'The choice of $u$ was poor: the new integral is harder', 'The answer is $\frac{x^2}{2}e^x$', 'Parts doesn''t work for this integral']
  answer: 1
  explanation: |-
    The formula is correct but unhelpful: the power of $x$ went up. Swap the roles ($u = x$) to get $xe^x - e^x + C$.
- id: calc-q-3108
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'Find $\displaystyle\int\arctan x\,dx$.'
  choices: ['$\dfrac{1}{1 + x^2} + C$', '$x\arctan x + \tfrac12\ln(1 + x^2) + C$', '$x\arctan x - \tfrac12\ln(1 + x^2) + C$', '$x\arctan x - \ln(1 + x^2) + C$']
  answer: 2
  explanation: |-
    $u = \arctan x$, $dv = dx$: $x\arctan x - \int\frac{x}{1 + x^2}dx = x\arctan x - \frac12\ln(1 + x^2) + C$.
- id: calc-q-3109
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'Integration by parts reverses which differentiation rule?'
  choices: ['The chain rule', 'The quotient rule', 'The power rule', 'The product rule']
  answer: 3
  explanation: |-
    Integrate $(uv)' = u'v + uv'$ to get $\int u\,dv = uv - \int v\,du$. Substitution reverses the chain rule.
- id: calc-q-3110
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'Find $\displaystyle\int x^2e^x\,dx$.'
  choices: ['$e^x(x^2 - 2x + 2) + C$', '$e^x(x^2 + 2x + 2) + C$', '$x^2e^x - 2xe^x + C$', '$\tfrac{x^3}{3}e^x + C$']
  answer: 0
  explanation: |-
    Tabular: $+x^2e^x - 2xe^x + 2e^x$. Check by differentiating: $e^x(x^2 - 2x + 2) + e^x(2x - 2) = x^2e^x$.
- id: calc-q-3111
  lesson: calc-by-parts
  topic: Integration by parts
  stem: 'Evaluate $\displaystyle\int_1^e\ln x\,dx$.'
  choices: ['$e - 1$', '$1$', '$e$', '$0$']
  answer: 1
  explanation: |-
    $[x\ln x - x]_1^e = (e - e) - (0 - 1) = 1$.

- id: calc-q-3201
  lesson: calc-trig-integrals
  module_quiz: true
  topic: Trig integrals
  stem: 'For $\int\sin^5x\cos^2x\,dx$, the best first step is'
  choices:
    - 'Save one $\cos x$ and let $u = \sin x$'
    - 'Use half-angle identities on both factors'
    - 'Save one $\sin x$, convert $\sin^4x = (1 - \cos^2x)^2$, and let $u = \cos x$'
    - 'Integrate by parts with $u = \sin^5x$'
  answer: 2
  explanation: |-
    The sine power is odd, so save one $\sin x$ for $du = -\sin x\,dx$ and convert the remaining even power to cosines.
- id: calc-q-3202
  lesson: calc-trig-integrals
  topic: Trig integrals
  stem: 'Evaluate $\displaystyle\int_0^{2\pi}\cos^2x\,dx$.'
  choices: ['$2\pi$', '$0$', '$\tfrac\pi2$', '$\pi$']
  answer: 3
  explanation: |-
    $\cos^2x = \frac{1 + \cos2x}{2}$; over a full period the $\cos2x$ part integrates to 0, leaving $\frac12\cdot2\pi = \pi$.
- id: calc-q-3203
  lesson: calc-trig-integrals
  topic: Trig integrals
  stem: 'Find $\displaystyle\int\sin^2x\,dx$.'
  choices: ['$\dfrac{\sin^3x}{3} + C$', '$\dfrac x2 - \dfrac{\sin2x}{4} + C$', '$\dfrac x2 + \dfrac{\sin2x}{4} + C$', '$-\dfrac{\cos^3x}{3} + C$']
  answer: 1
  explanation: |-
    $\sin^2x = \frac{1 - \cos2x}{2}$, so the integral is $\frac x2 - \frac{\sin2x}{4} + C$. The plus sign belongs to $\cos^2x$.
- id: calc-q-3204
  lesson: calc-trig-integrals
  topic: Trig integrals
  stem: 'Find $\displaystyle\int\sin x\cos^4x\,dx$.'
  choices: ['$-\dfrac{\cos^5x}{5} + C$', '$\dfrac{\cos^5x}{5} + C$', '$\dfrac{\sin^2x\cos^5x}{10} + C$', '$-\dfrac{\sin^5x}{5} + C$']
  answer: 0
  explanation: |-
    $u = \cos x$, $du = -\sin x\,dx$: $-\int u^4\,du = -\frac{u^5}{5} + C$.
- id: calc-q-3205
  lesson: calc-trig-integrals
  module_quiz: true
  topic: Trig substitution
  stem: 'Which substitution suits $\displaystyle\int\frac{dx}{(x^2 + 9)^{3/2}}$?'
  choices: ['$x = 3\sin\theta$', '$x = 3\sec\theta$', '$u = x^2 + 9$', '$x = 3\tan\theta$']
  answer: 3
  explanation: |-
    $a^2 + x^2$ with $a = 3$ calls for $x = 3\tan\theta$, since $9 + 9\tan^2\theta = 9\sec^2\theta$. ($u = x^2 + 9$ fails: there's no $x$ factor for $du$.)
- id: calc-q-3206
  lesson: calc-trig-integrals
  topic: Trig substitution
  stem: 'With $x = 2\sin\theta$ ($-\frac\pi2 \le \theta \le \frac\pi2$), $\sqrt{4 - x^2}$ becomes'
  choices:
    - '$2\sin\theta$'
    - '$2\sec\theta$'
    - '$4\cos^2\theta$'
    - '$2\cos\theta$'
  answer: 3
  explanation: |-
    $\sqrt{4 - 4\sin^2\theta} = 2\sqrt{\cos^2\theta} = 2\cos\theta$ (since $\cos\theta \ge 0$ on that interval).
- id: calc-q-3207
  lesson: calc-trig-integrals
  module_quiz: true
  topic: Trig substitution
  stem: 'After substituting $x = 3\sin\theta$, an answer is $\cot\theta$. Written in terms of $x$, $\cot\theta$ equals'
  choices: ['$\dfrac{x}{\sqrt{9 - x^2}}$', '$\dfrac{3}{x}$', '$\dfrac{\sqrt{9 - x^2}}{x}$', '$\dfrac{\sqrt{9 - x^2}}{3}$']
  answer: 2
  explanation: |-
    Triangle: opposite $x$, hypotenuse 3, adjacent $\sqrt{9 - x^2}$. $\cot\theta = \frac{\text{adjacent}}{\text{opposite}}$.
- id: calc-q-3208
  lesson: calc-trig-integrals
  topic: Trig substitution
  stem: 'Which integral is easiest WITHOUT trig substitution?'
  choices: ['$\int\sqrt{1 - x^2}\,dx$', '$\int\frac{dx}{x^2\sqrt{x^2 - 4}}$', '$\int\frac{x^2\,dx}{\sqrt{9 - x^2}}$', '$\int\frac{x\,dx}{\sqrt{9 - x^2}}$']
  answer: 3
  explanation: |-
    The factor $x$ is (up to a constant) the derivative of $9 - x^2$, so $u = 9 - x^2$ gives $-\sqrt{9 - x^2} + C$ in one step.
- id: calc-q-3209
  lesson: calc-trig-integrals
  topic: Trig integrals
  stem: 'Find $\displaystyle\int\tan^2x\,dx$.'
  choices: ['$\dfrac{\tan^3x}{3} + C$', '$\sec^2x + C$', '$\tan x - x + C$', '$\ln|\sec x| + C$']
  answer: 2
  explanation: |-
    $\tan^2x = \sec^2x - 1$, so the integral is $\tan x - x + C$.
- id: calc-q-3210
  lesson: calc-trig-integrals
  topic: Trig substitution
  stem: 'Use $x = r\sin\theta$ to evaluate $\int_{-r}^{r}\sqrt{r^2 - x^2}\,dx$.'
  choices: ['$\pi r^2$', '$\tfrac12\pi r^2$', '$2r^2$', '$\tfrac14\pi r^2$']
  answer: 1
  explanation: |-
    It becomes $r^2\int_{-\pi/2}^{\pi/2}\cos^2\theta\,d\theta = r^2\cdot\frac\pi2$: the area of a half disk.
- id: calc-q-3211
  lesson: calc-trig-integrals
  topic: Trig integrals
  stem: 'Find $\displaystyle\int\sec^4x\,dx$.'
  choices: ['$\dfrac{\sec^5x}{5} + C$', '$\tan x + \dfrac{\tan^3x}{3} + C$', '$\sec^3x\tan x + C$', '$\tan x + \tan^3x + C$']
  answer: 1
  explanation: |-
    Save $\sec^2x$: $\int(1 + \tan^2x)\sec^2x\,dx = \int(1 + u^2)\,du$ with $u = \tan x$.

- id: calc-q-3301
  lesson: calc-partial-fractions
  module_quiz: true
  topic: Partial fractions
  stem: 'Decompose $\dfrac{3x + 1}{(x - 1)(x + 1)}$.'
  choices: ['$\dfrac{2}{x - 1} + \dfrac{1}{x + 1}$', '$\dfrac{1}{x - 1} + \dfrac{2}{x + 1}$', '$\dfrac{3}{x - 1} + \dfrac{1}{x + 1}$', '$\dfrac{2}{x - 1} - \dfrac{1}{x + 1}$']
  answer: 0
  explanation: |-
    $3x + 1 = A(x + 1) + B(x - 1)$. $x = 1$: $4 = 2A$, $A = 2$. $x = -1$: $-2 = -2B$, $B = 1$.
- id: calc-q-3302
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'What is the correct form of the decomposition of $\dfrac{x^2 + 2}{x(x - 3)^2}$?'
  choices:
    - '$\dfrac Ax + \dfrac{B}{(x - 3)^2}$'
    - '$\dfrac Ax + \dfrac{Bx + C}{(x - 3)^2}$'
    - '$\dfrac{A}{x(x - 3)} + \dfrac{B}{x - 3}$'
    - '$\dfrac Ax + \dfrac{B}{x - 3} + \dfrac{C}{(x - 3)^2}$'
  answer: 3
  explanation: |-
    A repeated linear factor $(x - 3)^2$ needs a term for each power: $\frac{B}{x - 3} + \frac{C}{(x - 3)^2}$.
- id: calc-q-3303
  lesson: calc-partial-fractions
  module_quiz: true
  topic: Partial fractions
  stem: 'Find $\displaystyle\int\frac{dx}{x^2 - 4}$.'
  choices: ['$\ln|x^2 - 4| + C$', '$\tfrac14\ln\left|\dfrac{x - 2}{x + 2}\right| + C$', '$\tfrac12\arctan\dfrac x2 + C$', '$\tfrac14\ln\left|\dfrac{x + 2}{x - 2}\right| + C$']
  answer: 1
  explanation: |-
    $\frac{1}{(x - 2)(x + 2)} = \frac{1/4}{x - 2} - \frac{1/4}{x + 2}$, giving $\frac14\ln|x - 2| - \frac14\ln|x + 2|$. (Arctan is for $x^2 + 4$.)
- id: calc-q-3304
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'Before using partial fractions on $\dfrac{x^3}{x^2 - 1}$, you must'
  choices: ['factor the numerator', 'complete the square', 'do polynomial long division', 'substitute $u = x^2 - 1$']
  answer: 2
  explanation: |-
    The fraction is improper (degree 3 over degree 2). Division gives $x + \frac{x}{x^2 - 1}$.
- id: calc-q-3305
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'For $\dfrac{x + 5}{x(x + 1)^2} = \dfrac Ax + \dfrac{B}{x + 1} + \dfrac{C}{(x + 1)^2}$, find $A$ and $C$.'
  choices: ['$A = 5$, $C = 4$', '$A = 1$, $C = -4$', '$A = 5$, $C = -4$', '$A = -5$, $C = 4$']
  answer: 2
  explanation: |-
    Clear: $x + 5 = A(x + 1)^2 + Bx(x + 1) + Cx$. $x = 0$: $A = 5$. $x = -1$: $4 = -C$, $C = -4$.
- id: calc-q-3306
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'Find $\displaystyle\int\frac{dx}{(x + 3)^2}$.'
  choices: ['$\ln(x + 3)^2 + C$', '$\dfrac{1}{x + 3} + C$', '$2\ln|x + 3| + C$', '$-\dfrac{1}{x + 3} + C$']
  answer: 3
  explanation: |-
    It's a power, not a log: $\int(x + 3)^{-2}dx = -(x + 3)^{-1} + C$.
- id: calc-q-3307
  lesson: calc-partial-fractions
  module_quiz: true
  topic: Partial fractions
  stem: 'The decomposition of $\dfrac{5}{(x - 2)(x^2 + 1)}$ should have the form'
  choices:
    - '$\dfrac{A}{x - 2} + \dfrac{B}{x^2 + 1}$'
    - '$\dfrac{Ax + B}{x - 2} + \dfrac{C}{x^2 + 1}$'
    - '$\dfrac{A}{x - 2} + \dfrac{B}{x + 1} + \dfrac{C}{x - 1}$'
    - '$\dfrac{A}{x - 2} + \dfrac{Bx + C}{x^2 + 1}$'
  answer: 3
  explanation: |-
    $x^2 + 1$ is irreducible, so its numerator is linear: $Bx + C$. (Here $A = 1$, $B = -1$, $C = -2$.)
- id: calc-q-3308
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'Evaluate $\displaystyle\int_2^3\frac{dx}{x(x - 1)}$.'
  choices: ['$\ln\tfrac43$', '$\ln\tfrac32$', '$\ln 2$', '$\ln\tfrac34$']
  answer: 0
  explanation: |-
    $\frac{1}{x(x - 1)} = \frac{1}{x - 1} - \frac1x$. $\left[\ln\frac{x - 1}{x}\right]_2^3 = \ln\frac23 - \ln\frac12 = \ln\frac43$.
- id: calc-q-3309
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'Find $\displaystyle\int\frac{2x + 3}{x^2 + 3x}\,dx$ (fastest method).'
  choices: ['$\ln|x| - \ln|x + 3| + C$, by partial fractions', '$\ln|x^2 + 3x| + C$, by substitution', '$2\ln|x + 3| + C$', '$\arctan(x^2 + 3x) + C$']
  answer: 1
  explanation: |-
    The numerator is exactly the derivative of the denominator, so $u = x^2 + 3x$ gives $\ln|u|$. (Partial fractions also works, more slowly: $\frac{2x + 3}{x(x + 3)} = \frac1x + \frac{1}{x + 3}$, so both logs have coefficient $+1$; $\ln|x| - \ln|x + 3|$ is a sign slip.)
- id: calc-q-3310
  lesson: calc-partial-fractions
  topic: Partial fractions
  stem: 'Integrating $\dfrac{x + 2}{x^2 + 4}$ gives which combination?'
  choices: ['Only a logarithm', 'Only an arctangent', 'A logarithm and an arctangent', 'A power function']
  answer: 2
  explanation: |-
    Split: $\frac{x}{x^2 + 4}$ gives $\frac12\ln(x^2 + 4)$ and $\frac{2}{x^2 + 4}$ gives $\arctan\frac x2$.

- id: calc-q-3401
  lesson: calc-numerical-integration
  module_quiz: true
  topic: Numerical integration
  stem: 'Use the trapezoidal rule with $n = 2$ to approximate $\int_0^2x^2\,dx$.'
  choices: ['$3$', '$2$', '$\tfrac83$', '$4$']
  answer: 0
  explanation: |-
    $\Delta x = 1$: $\frac12[f(0) + 2f(1) + f(2)] = \frac12[0 + 2 + 4] = 3$. The exact value is $\frac83$; the trapezoid overestimates because $x^2$ is concave up.
- id: calc-q-3402
  lesson: calc-numerical-integration
  module_quiz: true
  topic: Numerical integration
  stem: 'Use Simpson''s rule with $n = 2$ to approximate $\int_0^2x^2\,dx$.'
  choices: ['$3$', '$\tfrac83$', '$2$', '$\tfrac{10}{3}$']
  answer: 1
  explanation: |-
    $\frac{1}{3}[f(0) + 4f(1) + f(2)] = \frac13[0 + 4 + 4] = \frac83$: exact, since Simpson's rule is exact for cubics and below.
- id: calc-q-3403
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'If $f$ is concave down on $[a, b]$, the trapezoidal rule'
  choices: ['overestimates the integral', 'is exact', 'could be either', 'underestimates the integral']
  answer: 3
  explanation: |-
    The chords lie below a concave-down curve, so the trapezoids miss some area.
- id: calc-q-3404
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'Why must $n$ be even for Simpson''s rule?'
  choices: ['Because the weights must sum to an even number', 'Because it fits a parabola through each pair of subintervals', 'Because the error bound has $n^4$', 'It doesn''t need to be']
  answer: 1
  explanation: |-
    Each parabola uses three points spanning two subintervals, so the subintervals must pair off.
- id: calc-q-3405
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'If $n$ is doubled, the error bound for the trapezoidal rule is multiplied by about'
  choices: ['$\tfrac12$', '$\tfrac1{16}$', '$\tfrac14$', '$2$']
  answer: 2
  explanation: |-
    $|E_T| \le \frac{K(b - a)^3}{12n^2}$, so doubling $n$ divides the bound by 4. For Simpson's rule it's 16.
- id: calc-q-3406
  lesson: calc-numerical-integration
  module_quiz: true
  topic: Integration strategy
  stem: 'Which integral is best done with integration by parts?'
  choices: ['$\int x\,e^{x^2}\,dx$', '$\int\frac{2x}{x^2 + 1}\,dx$', '$\int\sin^3x\,dx$', '$\int x\,e^{3x}\,dx$']
  answer: 3
  explanation: |-
    A polynomial times an exponential with no matching inner derivative: parts with $u = x$. $\int xe^{x^2}dx$ and $\int\frac{2x}{x^2 + 1}dx$ are substitutions; $\int\sin^3x\,dx$ uses a trig identity.
- id: calc-q-3407
  lesson: calc-numerical-integration
  topic: Integration strategy
  stem: 'Which statement about $\int e^{-x^2}\,dx$ is true?'
  choices:
    - 'It has no antiderivative'
    - 'Its antiderivative is $-\frac{e^{-x^2}}{2x} + C$'
    - 'It has an antiderivative, but not one expressible in elementary functions'
    - 'It can be done by partial fractions'
  answer: 2
  explanation: |-
    FTC 1 guarantees $\int_0^xe^{-t^2}dt$ is an antiderivative; it just isn't elementary. Definite integrals of it are found numerically. (Differentiating $-\frac{e^{-x^2}}{2x}$ doesn't give $e^{-x^2}$: the quotient rule adds an extra term.)
- id: calc-q-3408
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'Trapezoidal rule from data: $f(0) = 3$, $f(1) = 5$, $f(2) = 4$, $f(3) = 6$ with $\Delta x = 1$. The estimate of $\int_0^3f$ is'
  choices: ['$13.5$', '$12$', '$15$', '$18$']
  answer: 0
  explanation: |-
    $\frac12[3 + 2(5) + 2(4) + 6] = \frac12(27) = 13.5$.
- id: calc-q-3409
  lesson: calc-numerical-integration
  topic: Integration strategy
  stem: 'Which first step is best for $\int\frac{x^2 + x}{x}\,dx$?'
  choices: ['Partial fractions', 'Integration by parts', 'Trig substitution', 'Simplify to $x + 1$']
  answer: 3
  explanation: |-
    Always simplify first: $\frac{x^2 + x}{x} = x + 1$ (for $x \ne 0$), so the integral is $\frac{x^2}{2} + x + C$.
- id: calc-q-3410
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'For a concave-up function, which ordering is correct?'
  choices:
    - '$T_n < \int < M_n$'
    - '$M_n < T_n < \int$'
    - '$\int < M_n < T_n$'
    - '$M_n < \int < T_n$'
  answer: 3
  explanation: |-
    Concave up: chords (trapezoid) lie above the curve; midpoint rectangles undercount. The true value is bracketed between them.
- id: calc-q-3411
  lesson: calc-numerical-integration
  topic: Numerical integration
  stem: 'The trapezoidal estimate $T_n$ always equals'
  choices: ['the midpoint estimate $M_n$', 'the average of the left and right Riemann sums', 'Simpson''s estimate', 'the left Riemann sum']
  answer: 1
  explanation: |-
    Each trapezoid averages the left and right rectangle heights, so $T_n = \frac{L_n + R_n}{2}$.

- id: calc-q-3501
  lesson: calc-improper
  module_quiz: true
  topic: Improper integrals
  stem: 'Evaluate $\displaystyle\int_1^\infty\frac{dx}{x^3}$.'
  choices: ['$\tfrac13$', 'It diverges', '$\tfrac12$', '$1$']
  answer: 2
  explanation: |-
    $\lim_{t\to\infty}\left[-\frac{1}{2x^2}\right]_1^t = \frac12$. (In general $\frac{1}{p - 1}$ for $p > 1$.)
- id: calc-q-3502
  lesson: calc-improper
  module_quiz: true
  topic: Improper integrals
  stem: 'Which integral converges?'
  choices: ['$\int_1^\infty\frac{dx}{\sqrt x}$', '$\int_1^\infty\frac{dx}{x}$', '$\int_0^1\frac{dx}{x^2}$', '$\int_0^1\frac{dx}{\sqrt x}$']
  answer: 3
  explanation: |-
    On $(0, 1]$, $x^{-p}$ converges when $p < 1$; $p = \frac12$ qualifies (value 2). On $[1, \infty)$ you'd need $p > 1$, which $\frac{1}{\sqrt x}$ and $\frac1x$ fail; $\int_0^1x^{-2}$ has $p = 2 \ge 1$.
- id: calc-q-3503
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Evaluate $\displaystyle\int_0^\infty e^{-2x}\,dx$.'
  choices: ['$2$', '$\tfrac12$', 'It diverges', '$1$']
  answer: 1
  explanation: |-
    $\lim_{t\to\infty}\left[-\frac12e^{-2x}\right]_0^t = 0 + \frac12 = \frac12$.
- id: calc-q-3504
  lesson: calc-improper
  topic: Improper integrals
  stem: 'A student writes $\int_{-2}^{1}\frac{dx}{x^2} = \left[-\frac1x\right]_{-2}^1 = -\frac32$. What is wrong?'
  choices:
    - 'The antiderivative is wrong'
    - 'The integrand is unbounded at $x = 0$, inside the interval; the integral actually diverges'
    - 'The limits should be reversed'
    - 'Nothing'
  answer: 1
  explanation: |-
    Split at 0: $\int_0^1\frac{dx}{x^2}$ diverges. A positive integrand can't have a negative integral, which was the warning sign.
- id: calc-q-3505
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Use comparison: $\displaystyle\int_1^\infty\frac{dx}{x^2 + x}$'
  choices: ['converges, since $\frac{1}{x^2 + x} < \frac{1}{x^2}$', 'diverges, since $\frac{1}{x^2 + x} < \frac1x$', 'diverges, since $\frac{1}{x^2 + x} > \frac{1}{x^3}$', 'cannot be decided by comparison']
  answer: 0
  explanation: |-
    Smaller than the convergent $\int_1^\infty x^{-2}dx$, so it converges (to $\ln 2$, by partial fractions). Being smaller than a divergent integral proves nothing.
- id: calc-q-3506
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Evaluate $\displaystyle\int_{-\infty}^{\infty}\frac{dx}{1 + x^2}$.'
  choices: ['$\tfrac\pi2$', '$2\pi$', 'It diverges', '$\pi$']
  answer: 3
  explanation: |-
    Split at 0: each half is $\lim\arctan t = \frac\pi2$. Total $\pi$.
- id: calc-q-3507
  lesson: calc-improper
  module_quiz: true
  topic: Improper integrals
  stem: 'Why does $\int_{-\infty}^{\infty}x\,dx$ diverge even though $\lim_{t\to\infty}\int_{-t}^{t}x\,dx = 0$?'
  choices:
    - 'Because each half, $\int_0^\infty x\,dx$ and $\int_{-\infty}^0x\,dx$, diverges separately'
    - 'Because $x$ is odd'
    - 'Because the limit should be taken as $t \to 0$'
    - 'It doesn''t; it equals 0'
  answer: 0
  explanation: |-
    The definition requires both halves to converge on their own. The symmetric limit hides two infinite areas canceling.
- id: calc-q-3508
  lesson: calc-improper
  topic: Improper integrals
  stem: 'For which $p$ does $\int_1^\infty x^{-p}\,dx$ converge?'
  choices: ['$p < 1$', '$p \ge 1$', '$p > 1$', 'all $p > 0$']
  answer: 2
  explanation: |-
    $p > 1$, with value $\frac{1}{p - 1}$. At $p = 1$ it's $\ln t \to \infty$.
- id: calc-q-3509
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Evaluate $\displaystyle\int_0^4\frac{dx}{\sqrt{4 - x}}$.'
  choices:
    - '$4$'
    - '$2$'
    - 'It diverges'
    - '$8$'
  answer: 0
  explanation: |-
    Unbounded at $x = 4$: $\lim_{t\to4^-}\left[-2\sqrt{4 - x}\right]_0^t = 0 + 2\sqrt4 = 4$.
- id: calc-q-3510
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Does $\displaystyle\int_1^\infty\frac{2 + \sin x}{x}\,dx$ converge?'
  choices: ['Yes, by comparison with $\frac{3}{x^2}$', 'No, since $\frac{2 + \sin x}{x} \ge \frac1x$ and $\int_1^\infty\frac{dx}{x}$ diverges', 'Yes, since $\sin x$ is bounded', 'No, since $\sin x$ oscillates']
  answer: 1
  explanation: |-
    $2 + \sin x \ge 1$, so the integrand is at least $\frac1x$, and the integral is larger than a divergent one.
- id: calc-q-3511
  lesson: calc-improper
  topic: Improper integrals
  stem: 'Evaluate $\displaystyle\int_0^\infty xe^{-x}\,dx$.'
  choices: ['$0$', '$1$', 'It diverges', '$e$']
  answer: 1
  explanation: |-
    By parts: $\left[-xe^{-x} - e^{-x}\right]_0^t = -te^{-t} - e^{-t} + 1 \to 1$, since $te^{-t} \to 0$.

- id: calc-q-hyp-01
  lesson: calc-hyperbolic
  module_quiz: true
  topic: Hyperbolic functions
  stem: 'Find $\dfrac{d}{dx}\cosh(4x)$.'
  choices: ['$-4\sinh(4x)$', '$4\sinh(4x)$', '$\sinh(4x)$', '$4\cosh(4x)$']
  answer: 1
  explanation: |-
    $(\cosh u)' = \sinh u\cdot u'$ with $u = 4x$, so the derivative is $4\sinh(4x)$. The minus sign belongs to $(\cos x)' = -\sin x$, not to cosh; $\sinh(4x)$ forgets the chain-rule factor 4; and $4\cosh(4x)$ treats cosh as its own derivative, like $e^x$.
- id: calc-q-hyp-02
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Evaluate $\sinh(\ln 3)$.'
  choices: ['$\tfrac53$', '$\tfrac83$', '$\tfrac45$', '$\tfrac43$']
  answer: 3
  explanation: |-
    $e^{\ln 3} = 3$ and $e^{-\ln 3} = \frac13$, so $\sinh(\ln 3) = \frac{3 - \frac13}{2} = \frac{8/3}{2} = \frac43$. Adding instead of subtracting gives $\cosh(\ln 3) = \frac53$; $\frac83$ forgets to divide by 2; $\frac45$ is $\tanh(\ln 3) = \frac{4/3}{5/3}$.
- id: calc-q-hyp-03
  lesson: calc-hyperbolic
  module_quiz: true
  topic: Hyperbolic functions
  stem: 'Which identity holds for every real $x$?'
  choices: ['$\cosh^2x - \sinh^2x = 1$', '$\cosh^2x + \sinh^2x = 1$', '$1 + \tanh^2x = \operatorname{sech}^2x$', '$\sinh 2x = \cosh^2x + \sinh^2x$']
  answer: 0
  explanation: |-
    Squaring the definitions, $\cosh^2x = \frac{e^{2x} + 2 + e^{-2x}}{4}$ and $\sinh^2x = \frac{e^{2x} - 2 + e^{-2x}}{4}$; their difference is $\frac44 = 1$. The plus-sign version copies the trig identity (at $x = 1$ it gives about 3.76, not 1). Dividing the true identity by $\cosh^2x$ gives $1 - \tanh^2x = \operatorname{sech}^2x$, with a minus. $\cosh^2x + \sinh^2x$ equals $\cosh 2x$, not $\sinh 2x = 2\sinh x\cosh x$.
- id: calc-q-hyp-04
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Find $\displaystyle\int\sinh(3x)\,dx$.'
  choices: ['$-\tfrac13\cosh(3x) + C$', '$3\cosh(3x) + C$', '$\tfrac13\cosh(3x) + C$', '$\cosh(3x) + C$']
  answer: 2
  explanation: |-
    With $u = 3x$, $dx = \frac13du$: $\frac13\int\sinh u\,du = \frac13\cosh(3x) + C$. Check: its derivative is $\frac13\cdot3\sinh(3x)$. The minus sign is carried over from $\int\sin x\,dx = -\cos x$; multiplying by 3 instead of dividing, or dropping the $\frac13$, fails the derivative check.
- id: calc-q-hyp-05
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Find $\dfrac{d}{dx}\tanh(x^2)$.'
  choices: ['$\operatorname{sech}^2(x^2)$', '$-2x\operatorname{sech}^2(x^2)$', '$\dfrac{2x}{\cosh(x^2)}$', '$2x\operatorname{sech}^2(x^2)$']
  answer: 3
  explanation: |-
    $(\tanh u)' = \operatorname{sech}^2u\cdot u'$ with $u = x^2$: $2x\operatorname{sech}^2(x^2)$. Leaving off $2x$ forgets the chain rule; the minus sign belongs to the derivatives of $\operatorname{sech}$ and $\coth$, not $\tanh$; and $\frac{2x}{\cosh(x^2)}$ is $2x\operatorname{sech}(x^2)$, missing the square.
- id: calc-q-hyp-06
  lesson: calc-hyperbolic
  module_quiz: true
  topic: Hyperbolic functions
  stem: 'Evaluate $\displaystyle\int_0^3\frac{dx}{\sqrt{x^2 + 16}}$.'
  choices: ['$\ln 2$', '$\tfrac14\ln 2$', '$\arcsin\tfrac34$', '$\tfrac14\arctan\tfrac34$']
  answer: 0
  explanation: |-
    $\int\frac{dx}{\sqrt{x^2 + a^2}} = \sinh^{-1}\frac xa + C$ with $a = 4$, so the value is $\sinh^{-1}\frac34 = \ln\left(\frac34 + \sqrt{\frac9{16} + 1}\right) = \ln\left(\frac34 + \frac54\right) = \ln 2$. The factor $\frac14$ belongs to the arctan formula, not this one; arcsin goes with $\sqrt{a^2 - x^2}$; and arctan goes with $\frac{1}{a^2 + x^2}$, which has no square root.
- id: calc-q-hyp-07
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Which expression equals $\sinh^{-1}x$ for every real $x$?'
  choices: ['$\ln\left(x + \sqrt{x^2 - 1}\right)$', '$\ln\left(x + \sqrt{x^2 + 1}\right)$', '$\dfrac{1}{\sinh x}$', '$\dfrac12\ln\dfrac{1 + x}{1 - x}$']
  answer: 1
  explanation: |-
    Solving $x = \sinh y$ gives $(e^y)^2 - 2xe^y - 1 = 0$, so $e^y = x + \sqrt{x^2 + 1}$ (the positive root) and $y = \ln\left(x + \sqrt{x^2 + 1}\right)$. With $\sqrt{x^2 - 1}$ it is $\cosh^{-1}x$, defined only for $x \ge 1$; $\frac{1}{\sinh x}$ is $\operatorname{csch}x$, a reciprocal, not an inverse; $\frac12\ln\frac{1 + x}{1 - x}$ is $\tanh^{-1}x$.
- id: calc-q-hyp-08
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Find $\dfrac{d}{dx}\sinh^{-1}(2x)$.'
  choices: ['$\dfrac{1}{\sqrt{4x^2 + 1}}$', '$\dfrac{2}{\sqrt{1 - 4x^2}}$', '$\dfrac{2}{\sqrt{4x^2 + 1}}$', '$\dfrac{2}{\sqrt{4x^2 - 1}}$']
  answer: 2
  explanation: |-
    $\frac{d}{du}\sinh^{-1}u = \frac{1}{\sqrt{u^2 + 1}}$, times $u' = 2$: $\frac{2}{\sqrt{4x^2 + 1}}$. Without the 2 the chain rule is missing; $\sqrt{1 - 4x^2}$ is the arcsin pattern; $\sqrt{4x^2 - 1}$ is the $\cosh^{-1}$ pattern.
- id: calc-q-hyp-09
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'A cable hangs in the shape $y = 10\cosh\dfrac{x}{10}$ between supports at $x = -10$ and $x = 10$. How long is the cable?'
  choices: ['$20\cosh 1 \approx 30.9$', '$10\sinh 1 \approx 11.8$', '$20$', '$20\sinh 1 \approx 23.5$']
  answer: 3
  explanation: |-
    $\sqrt{1 + (y')^2} = \sqrt{1 + \sinh^2\frac{x}{10}} = \cosh\frac{x}{10}$, so $L = \int_{-10}^{10}\cosh\frac{x}{10}\,dx = 20\sinh 1 \approx 23.50$. $20\cosh 1$ uses the antiderivative of the wrong function; $10\sinh 1$ is only the half from $x = 0$ to $x = 10$; and 20 is the straight-line distance between the supports, which a sagging cable must exceed.
- id: calc-q-hyp-10
  lesson: calc-hyperbolic
  module_quiz: true
  topic: Hyperbolic functions
  stem: 'For the cable $y = 10\cosh\dfrac{x}{10}$ with supports at $x = \pm10$, how far below the supports is its lowest point?'
  choices: ['$10(\cosh 1 - 1) \approx 5.43$', '$10\cosh 1 \approx 15.43$', '$10\sinh 1 \approx 11.75$', '$10(1 - \cos 1) \approx 4.60$']
  answer: 0
  explanation: |-
    The supports are at height $10\cosh 1 \approx 15.43$ and the low point (at $x = 0$) is at height $10\cosh 0 = 10$. The sag is the difference, $10(\cosh 1 - 1) \approx 5.43$. The height $15.43$ alone measures from the $x$-axis, not from the low point; $10\sinh 1$ is half the cable length; and $\cos 1$ swaps in the circular cosine.
- id: calc-q-hyp-11
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Which statement about $y = \tanh x$ is true?'
  choices: ['It is periodic with period $\pi$', 'It has vertical asymptotes where $\cosh x = 0$', 'It is increasing, with horizontal asymptotes $y = 1$ and $y = -1$', 'It takes every real value'
  ]
  answer: 2
  explanation: |-
    $(\tanh x)' = \operatorname{sech}^2x > 0$, so it increases; and $\tanh x = \frac{e^x - e^{-x}}{e^x + e^{-x}} \to 1$ as $x \to \infty$ and $\to -1$ as $x \to -\infty$. It is not periodic (that's $\tan x$); $\cosh x \ge 1$ is never 0, so there are no vertical asymptotes; and its values stay strictly between $-1$ and $1$.
- id: calc-q-hyp-12
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'Solving $x = \sinh y$ leads to $(e^y)^2 - 2x\,e^y - 1 = 0$, so $e^y = x \pm\sqrt{x^2 + 1}$. Why is the minus sign rejected?'
  choices: ['Because $x - \sqrt{x^2 + 1}$ is always negative, and $e^y$ is always positive', 'Because $\sinh$ is an odd function', 'Because $x$ must be positive', 'Because a quadratic in $e^y$ has only one root'
  ]
  answer: 0
  explanation: |-
    $\sqrt{x^2 + 1} > \sqrt{x^2} = \lvert x\rvert \ge x$, so $x - \sqrt{x^2 + 1} < 0$ for every $x$, and no exponential can equal a negative number. Being odd is true of $\sinh$ but doesn't choose a root; $x$ can be any real number (the formula works for negative $x$ too); and this quadratic does have two real roots, one of which is simply unusable.
- id: calc-q-hyp-13
  lesson: calc-hyperbolic
  topic: Hyperbolic functions
  stem: 'As $t$ runs over all real numbers, the point $(\cosh t, \sinh t)$ traces part of which curve?'
  choices: ['$x^2 + y^2 = 1$', '$y^2 - x^2 = 1$', '$xy = 1$', '$x^2 - y^2 = 1$']
  answer: 3
  explanation: |-
    $x^2 - y^2 = \cosh^2t - \sinh^2t = 1$; since $\cosh t \ge 1$, the point traces the right branch of this hyperbola. The circle is traced by $(\cos t, \sin t)$; $y^2 - x^2 = 1$ swaps the roles of the coordinates; and $xy = \cosh t\sinh t = \frac12\sinh 2t$ is not constant.
