# Module 2: The derivative
- id: calc-q-0601
  lesson: calc-derivative-def
  module_quiz: true
  topic: Definition of the derivative
  stem: 'Which limit is the definition of $f''(a)$?'
  choices:
    - '$\displaystyle\lim_{h\to0}\frac{f(a + h) - f(a)}{h}$'
    - '$\displaystyle\lim_{h\to0}\frac{f(a) + h - f(a)}{h}$'
    - '$\displaystyle\lim_{h\to0}\frac{f(a + h) - f(a)}{a}$'
    - '$\displaystyle\lim_{x\to\infty}\frac{f(x) - f(a)}{x - a}$'
  answer: 0
  explanation: |-
    The derivative is the limit of the secant slope $\frac{f(a + h) - f(a)}{h}$ as the second point slides to the first.
- id: calc-q-0602
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'Find the average rate of change of $f(x) = x^2 + 3x$ on $[1, 4]$.'
  choices: ['$28$', '$8$', '$\tfrac{28}{3}$', '$5$']
  answer: 1
  explanation: |-
    $f(4) = 28$, $f(1) = 4$, so $\frac{28 - 4}{4 - 1} = \frac{24}{3} = 8$. (28 is $f(4)$ alone; 28/3 forgets to subtract $f(1)$.)
- id: calc-q-0603
  lesson: calc-derivative-def
  module_quiz: true
  topic: Definition of the derivative
  stem: 'Use the definition to find $f''(2)$ for $f(x) = 3x^2 - x$.'
  choices: ['$10$', '$12$', '$11$', '$5$']
  answer: 2
  explanation: |-
    $f(2 + h) = 3(4 + 4h + h^2) - 2 - h = 10 + 11h + 3h^2$ and $f(2) = 10$. The quotient is $\frac{11h + 3h^2}{h} = 11 + 3h \to 11$.
- id: calc-q-0604
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'The limit $\displaystyle\lim_{h\to0}\frac{(5 + h)^3 - 125}{h}$ is $f''(a)$ for which $f$ and $a$?'
  choices:
    - '$f(x) = x^3$, $a = 125$'
    - '$f(x) = (5 + x)^3$, $a = 5$'
    - '$f(x) = x^3 - 125$, $a = 0$'
    - '$f(x) = x^3$, $a = 5$'
  answer: 3
  explanation: |-
    Match $\frac{f(a + h) - f(a)}{h}$: with $f(x) = x^3$ and $a = 5$, $f(5 + h) = (5 + h)^3$ and $f(5) = 125$. Its value is $3(5)^2 = 75$.
- id: calc-q-0605
  lesson: calc-derivative-def
  module_quiz: true
  topic: Tangent lines
  stem: 'If $f(4) = 7$ and $f''(4) = -2$, what is the tangent line to $f$ at $x = 4$?'
  choices: ['$y = -2x + 15$', '$y = 7x - 2$', '$y = -2x + 7$', '$y = -2x - 1$']
  answer: 0
  explanation: |-
    $y - 7 = -2(x - 4)$, so $y = -2x + 8 + 7 = -2x + 15$.
- id: calc-q-0606
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: '$V(t)$ is the volume of water in a tank, in liters, $t$ minutes after noon. What does $V''(10) = -4$ mean?'
  choices:
    - 'At 12:10 the tank holds 4 liters less than at noon'
    - 'At 12:10 the volume is decreasing at 4 liters per minute'
    - 'At 12:10 the tank holds $-4$ liters'
    - 'Over the first 10 minutes the volume fell by 4 liters per minute on average'
  answer: 1
  explanation: |-
    $V'(10)$ is the instantaneous rate of change of volume at $t = 10$, in liters per minute. Negative means draining. The last choice describes an average rate, not $V'(10)$.
- id: calc-q-0607
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'Find $f''(9)$ for $f(x) = \sqrt x$ using the definition.'
  choices: ['$\tfrac13$', '$\tfrac1{18}$', '$\tfrac16$', '$3$']
  answer: 2
  explanation: |-
    $\frac{\sqrt{9 + h} - 3}{h}\cdot\frac{\sqrt{9 + h} + 3}{\sqrt{9 + h} + 3} = \frac{1}{\sqrt{9 + h} + 3} \to \frac16$.
- id: calc-q-0608
  lesson: calc-derivative-def
  topic: Tangent lines
  stem: 'The tangent line to $y = f(x)$ at $x = 2$ is $y = 5x - 3$. Find $f(2)$ and $f''(2)$.'
  choices: ['$f(2) = 5$, $f''(2) = 7$', '$f(2) = -3$, $f''(2) = 5$', '$f(2) = 2$, $f''(2) = 5$', '$f(2) = 7$, $f''(2) = 5$']
  answer: 3
  explanation: |-
    The tangent line touches the curve at $x = 2$: $f(2) = 5(2) - 3 = 7$. Its slope is $f'(2) = 5$.
- id: calc-q-0609
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'Data: $f(1.8) = 4.2$, $f(2) = 5.0$, $f(2.2) = 6.0$. What is the central-difference estimate of $f''(2)$?'
  choices: ['$4.5$', '$5$', '$4$', '$9$']
  answer: 0
  explanation: |-
    $\frac{f(2.2) - f(1.8)}{2.2 - 1.8} = \frac{1.8}{0.4} = 4.5$. (One-sided quotients give 4 and 5.)
- id: calc-q-0610
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'A ball''s height is $s(t) = 80t - 16t^2$ feet. What is its velocity at $t = 2$ s?'
  choices:
    - '$96$ ft/s'
    - '$-16$ ft/s'
    - '$48$ ft/s'
    - '$16$ ft/s'
  answer: 3
  explanation: |-
    $\frac{s(2 + h) - s(2)}{h} = \frac{80h - 16(4h + h^2)}{h} = 80 - 64 - 16h \to 16$ ft/s. (96 is the height $s(2)$; 48 is the average velocity on $[0, 2]$.)
- id: calc-q-0611
  lesson: calc-derivative-def
  topic: Definition of the derivative
  stem: 'Which statement about $f''(a)$ is correct?'
  choices:
    - 'It is the height of the graph at $x = a$'
    - 'It is the slope of a secant line through $(a, f(a))$'
    - 'It is the slope of the tangent line at $(a, f(a))$'
    - 'It is the average rate of change of $f$ on $[0, a]$'
  answer: 2
  explanation: |-
    $f'(a)$ is the limit of secant slopes: the slope of the tangent line, or the instantaneous rate of change at $a$.

- id: calc-q-0701
  lesson: calc-derivative-function
  module_quiz: true
  topic: Differentiability
  stem: 'Which statement is true?'
  choices:
    - 'If $f$ is continuous at $a$, then $f$ is differentiable at $a$'
    - 'If $f$ is differentiable at $a$, then $f$ is continuous at $a$'
    - 'If $f$ is not differentiable at $a$, then $f$ is not continuous at $a$'
    - 'Continuity and differentiability are the same condition'
  answer: 1
  explanation: |-
    Differentiable ⇒ continuous. The converse fails: $|x|$ is continuous at 0 but has a corner there. The third choice is the converse in disguise.
- id: calc-q-0702
  lesson: calc-derivative-function
  module_quiz: true
  topic: The derivative function
  stem: 'Using the definition, the derivative of $f(x) = x^2 + 5x$ is'
  choices: ['$2x$', '$x^2 + 5$', '$2x + 5$', '$2x + 5 + h$']
  answer: 2
  explanation: |-
    $\frac{(x + h)^2 + 5(x + h) - x^2 - 5x}{h} = \frac{2xh + h^2 + 5h}{h} = 2x + h + 5 \to 2x + 5$.
- id: calc-q-0703
  lesson: calc-derivative-function
  module_quiz: true
  topic: Differentiability
  stem: 'At which kind of point is a continuous function NOT differentiable?'
  choices: ['A peak with a horizontal tangent', 'An inflection point', 'A point where the graph crosses the $x$-axis', 'A corner']
  answer: 3
  explanation: |-
    At a corner the left and right slopes differ, so the derivative doesn't exist. Smooth peaks have derivative 0; inflection points and crossings can be perfectly smooth.
- id: calc-q-0704
  lesson: calc-derivative-function
  topic: The derivative function
  stem: 'On an interval, the graph of $f$ is falling and getting less steep. On that interval, $f''$ is'
  choices:
    - 'negative and increasing toward 0'
    - 'positive and decreasing'
    - 'negative and decreasing'
    - 'positive and increasing'
  answer: 0
  explanation: |-
    Falling means $f' < 0$. Getting less steep means $|f'|$ shrinks, so the negative slopes rise toward 0: $f'$ is negative and increasing.
- id: calc-q-0705
  lesson: calc-derivative-function
  topic: Differentiability
  stem: 'Why is $f(x) = \sqrt[3]{x}$ not differentiable at $x = 0$?'
  choices:
    - 'It is discontinuous at 0'
    - 'It has a corner at 0'
    - 'It has a vertical tangent at 0: the difference quotient $h^{-2/3}$ grows without bound'
    - 'It is undefined for $x < 0$'
  answer: 2
  explanation: |-
    $\frac{\sqrt[3]{h} - 0}{h} = h^{-2/3} \to \infty$. The graph is continuous and smooth-looking but has a vertical tangent at the origin. Cube roots of negatives are defined.
- id: calc-q-0706
  lesson: calc-derivative-function
  module_quiz: true
  topic: Differentiability
  stem: |-
    For which $a$ and $b$ is
    $$f(x) = \begin{cases} x^2, & x \le 3\\ ax + b, & x > 3\end{cases}$$
    differentiable at $x = 3$?
  choices: ['$a = 6$, $b = -9$', '$a = 6$, $b = 9$', '$a = 3$, $b = 0$', '$a = 9$, $b = -18$']
  answer: 0
  explanation: |-
    Slopes must match: $2(3) = a$, so $a = 6$. The pieces must meet: $9 = 3a + b = 18 + b$, so $b = -9$. (The tangent to $x^2$ at 3 is $y = 6x - 9$.)
- id: calc-q-0707
  lesson: calc-derivative-function
  topic: The derivative function
  stem: 'Using the definition, the derivative of $f(x) = \dfrac{1}{x}$ is'
  choices: ['$\dfrac{1}{x^2}$', '$-\dfrac{1}{x^2}$', '$\ln x$', '$-\dfrac{1}{x}$']
  answer: 1
  explanation: |-
    $\frac{\frac{1}{x + h} - \frac1x}{h} = \frac{-1}{x(x + h)} \to -\frac{1}{x^2}$.
- id: calc-q-0708
  lesson: calc-derivative-function
  topic: The derivative function
  stem: 'Where does $f(x) = x^3 - 3x$ have horizontal tangent lines?'
  choices: ['$x = 0$ only', '$x = \pm\sqrt3$', '$x = 3$', '$x = \pm1$']
  answer: 3
  explanation: |-
    $f'(x) = 3x^2 - 3 = 0$ gives $x = \pm1$. ($\pm\sqrt3$ are the zeros of $f$, not of $f'$.)
- id: calc-q-0709
  lesson: calc-derivative-function
  topic: The derivative function
  stem: 'Readings of $W(t)$ in gallons: $W(0) = 100$, $W(3) = 130$, $W(5) = 154$, $W(9) = 170$. Best estimate of $W''(4)$?'
  choices: ['$12$ gal/h', '$10$ gal/h', '$4$ gal/h', '$13.5$ gal/h']
  answer: 0
  explanation: |-
    Use the data bracketing $t = 4$: $\frac{154 - 130}{5 - 3} = 12$ gallons per hour.
- id: calc-q-0710
  lesson: calc-derivative-function
  topic: Differentiability
  stem: 'Let $f(x) = |x - 2|$. What are the one-sided derivatives at $x = 2$?'
  choices: ['Both $0$', 'Left $1$, right $-1$', 'Left $-1$, right $1$', 'Both $1$']
  answer: 2
  explanation: |-
    Left of 2, $f(x) = 2 - x$ with slope $-1$; right of 2, $f(x) = x - 2$ with slope $1$. They differ, so $f'(2)$ doesn't exist.
- id: calc-q-0711
  lesson: calc-derivative-function
  topic: The derivative function
  stem: 'Which notation does NOT mean the derivative of $y = f(x)$?'
  choices: ['$\dfrac{dy}{dx}$', '$f''(x)$', '$\dfrac{d}{dx}f(x)$', '$\dfrac{\Delta y}{\Delta x}$']
  answer: 3
  explanation: |-
    $\frac{\Delta y}{\Delta x}$ is an average rate over a finite change; the derivative is its limit as $\Delta x \to 0$.

- id: calc-q-0801
  lesson: calc-basic-rules
  module_quiz: true
  topic: Power rule
  stem: 'Differentiate $f(x) = 6x^4 - 5x^3 + 2x - 8$.'
  choices: ['$24x^3 - 15x^2 + 2$', '$24x^3 - 15x^2 + 2x$', '$6x^3 - 5x^2 + 2$', '$24x^3 - 15x^2 + 2 - 8$']
  answer: 0
  explanation: |-
    Power rule term by term: $24x^3 - 15x^2 + 2$, and the constant's derivative is 0.
- id: calc-q-0802
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'Differentiate $y = \dfrac{4}{x^3}$.'
  choices: ['$\dfrac{12}{x^2}$', '$-\dfrac{12}{x^4}$', '$\dfrac{4}{3x^2}$', '$-\dfrac{12}{x^2}$']
  answer: 1
  explanation: |-
    $y = 4x^{-3}$, so $y' = -12x^{-4} = -\frac{12}{x^4}$. The exponent drops to $-4$, not $-2$.
- id: calc-q-0803
  lesson: calc-basic-rules
  module_quiz: true
  topic: Power rule
  stem: 'Differentiate $y = 6\sqrt x$.'
  choices: ['$\dfrac{6}{\sqrt x}$', '$3\sqrt x$', '$\dfrac{3}{\sqrt x}$', '$12\sqrt x$']
  answer: 2
  explanation: |-
    $y = 6x^{1/2}$, so $y' = 3x^{-1/2} = \frac{3}{\sqrt x}$.
- id: calc-q-0804
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'Differentiate $g(x) = \dfrac{x^3 - 4x}{x}$ ($x \ne 0$).'
  choices: ['$3x^2 - 4$', '$2x - 4$', '$x^2 - 4$', '$2x$']
  answer: 3
  explanation: |-
    Simplify first: $g(x) = x^2 - 4$, so $g'(x) = 2x$. Differentiating top and bottom separately (giving $3x^2 - 4$) is not a valid rule.
- id: calc-q-0805
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'Find $\dfrac{d}{dx}\left(3e^x + e^3\right)$.'
  choices: ['$3e^x$', '$3e^x + 3e^2$', '$3xe^{x-1}$', '$3e^x + e^3$']
  answer: 0
  explanation: |-
    $\frac{d}{dx}e^x = e^x$, and $e^3$ is a constant, so its derivative is 0.
- id: calc-q-0806
  lesson: calc-basic-rules
  module_quiz: true
  topic: Higher derivatives
  stem: 'Position $s(t) = t^3 - 9t^2 + 15t$ meters. What is the acceleration at $t = 2$ s?'
  choices: ['$-9$ m/s²', '$-6$ m/s²', '$6$ m/s²', '$-3$ m/s²']
  answer: 1
  explanation: |-
    $v = 3t^2 - 18t + 15$, $a = 6t - 18$, so $a(2) = -6$ m/s². ($-9$ is $v(2)$.)
- id: calc-q-0807
  lesson: calc-basic-rules
  topic: Higher derivatives
  stem: 'Find $f''''(x)$ for $f(x) = x^4 - 2x^3 + 5x$.'
  choices: ['$4x^3 - 6x^2 + 5$', '$12x^2 - 6x$', '$12x^2 - 12x$', '$24x - 12$']
  answer: 2
  explanation: |-
    $f' = 4x^3 - 6x^2 + 5$, then $f'' = 12x^2 - 12x$.
- id: calc-q-0808
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'At which $x$ values does $y = x^3 - 12x + 1$ have a horizontal tangent?'
  choices: ['$x = 12$', '$x = 0$', '$x = \pm4$', '$x = \pm2$']
  answer: 3
  explanation: |-
    $y' = 3x^2 - 12 = 0$ gives $x^2 = 4$, $x = \pm2$.
- id: calc-q-0809
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'Find the tangent line to $y = x^2 + \dfrac{8}{x}$ at $x = 2$.'
  choices: ['$y = 2x + 4$', '$y = 4x$', '$y = 2x + 8$', '$y = 6x - 4$']
  answer: 0
  explanation: |-
    $y(2) = 4 + 4 = 8$. $y' = 2x - 8x^{-2}$, so $y'(2) = 4 - 2 = 2$. Tangent: $y - 8 = 2(x - 2)$, i.e. $y = 2x + 4$.
- id: calc-q-0810
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'A student writes $\dfrac{d}{dx}2^x = x\cdot2^{x-1}$. What went wrong?'
  choices:
    - 'Nothing; that is the power rule'
    - 'The exponent should be $x + 1$'
    - 'The answer should be $2^x$'
    - 'The power rule only applies to a variable base with a constant exponent; $2^x$ is an exponential'
  answer: 3
  explanation: |-
    $2^x$ has a constant base and a variable exponent, so the power rule doesn't apply. Its derivative is $2^x\ln 2$ (Lesson 13); only base $e$ gives back the function itself.
- id: calc-q-0811
  lesson: calc-basic-rules
  topic: Higher derivatives
  stem: 'For $f(x) = 2x^5$, what is $f^{(5)}(x)$?'
  choices: ['$0$', '$120$', '$240$', '$10x^4$']
  answer: 2
  explanation: |-
    $f' = 10x^4$, $f'' = 40x^3$, $f''' = 120x^2$, $f^{(4)} = 240x$, $f^{(5)} = 240$. The sixth derivative is 0.
- id: calc-q-0812
  lesson: calc-basic-rules
  topic: Power rule
  stem: 'Differentiate $y = \sqrt[3]{x^2}$.'
  choices: ['$\dfrac{2}{3}x^{-1/3}$', '$\dfrac{3}{2}x^{1/2}$', '$\dfrac{2}{3}x^{1/3}$', '$\dfrac{2}{3}x^{-2/3}$']
  answer: 0
  explanation: |-
    $y = x^{2/3}$, so $y' = \frac23x^{2/3 - 1} = \frac23 x^{-1/3}$.
