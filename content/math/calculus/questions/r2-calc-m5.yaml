# Round 2 questions for calc-m5: core lessons 17-20 (q) and honors lessons 20h1-20h3 (h)
- id: calc-m5-r2-q01
  lesson: calc-extreme-values
  type: label
  module_quiz: true
  topic: Extreme values
  stem: The graph shows a continuous function $f$ on a closed interval $[a, b]$. Name the numbered points.
  image:
    src: images/calc-m5-extrema-blank.svg
    alt: 'The graph of a function on a closed interval from a to b with four numbered points: the highest point (a smooth peak), a lower smooth peak, a valley at a sharp corner, and the left endpoint, which is the lowest point of the graph.'
  labels:
  - x: 66.5
    y: 18.5
    text: Absolute maximum
  - x: 29.0
    y: 44.4
    text: Local maximum that is not the absolute maximum
  - x: 44.0
    y: 61.7
    text: Local minimum where f′ is undefined
  - x: 14.1
    y: 78.9
    text: Absolute minimum at an endpoint
  distractors:
  - Inflection point
  - Local minimum where f′ = 0
  explanation: 'Point 1 is the highest point on the whole interval, so it is the absolute maximum. Point 2 is higher than the points near it but lower than point 1: a local maximum only. Point 3 is a valley at a sharp corner, where the derivative does not exist; it is still a critical number. Point 4 is the lowest value of all and sits at the endpoint $a$, which is why the closed interval method always checks endpoints.'
- id: calc-m5-r2-q02
  lesson: calc-extreme-values
  type: text
  topic: Extreme values
  stem: A number $c$ in the domain of $f$ where $f'(c) = 0$ or $f'(c)$ does not exist is called a ___ number of $f$.
  accept:
  - critical
  explanation: 'These are the critical numbers. By Fermat''s theorem, local extrema can occur only there, but a critical number is only a candidate: $x^3$ has a critical number at 0 with no extremum.'
- id: calc-m5-r2-q03
  lesson: calc-extreme-values
  type: order
  topic: Extreme values
  stem: Put the steps of the closed interval method for a continuous $f$ on $[a, b]$ in order.
  items:
  - Find $f'(x)$
  - Find where $f'(x) = 0$ or $f'(x)$ is undefined
  - Keep only the critical numbers inside $(a, b)$
  - Evaluate $f$ at those numbers and at $a$ and $b$
  - 'Compare: the largest value is the absolute max, the smallest the absolute min'
  explanation: 'You need the derivative before you can find critical numbers, and you need the candidate list (critical numbers in the interval plus the two endpoints) before you can evaluate and compare. No derivative test is needed at the end: you just compare a short list of numbers.'
- id: calc-m5-r2-q04
  lesson: calc-extreme-values
  topic: Mean Value Theorem
  stem: Which functions satisfy the hypotheses of the Mean Value Theorem on $[-1, 1]$? Select all that apply.
  choices:
  - $f(x) = x^3$
  - $f(x) = |x|$
  - $f(x) = x^{2/3}$
  - $f(x) = \sqrt{x + 1}$
  - $f(x) = e^x$
  answer:
  - 0
  - 3
  - 4
  explanation: The MVT needs continuity on $[-1, 1]$ and differentiability on the open interval $(-1, 1)$. $x^3$ and $e^x$ are differentiable everywhere. $\sqrt{x + 1}$ is continuous on $[-1, 1]$ and differentiable for $x > -1$; its derivative fails only at the endpoint $-1$, which the theorem does not require. $|x|$ has a corner at 0 and $x^{2/3}$ has a cusp at 0, both inside the interval.
- id: calc-m5-r2-q05
  lesson: calc-extreme-values
  type: match
  module_quiz: true
  topic: Mean Value Theorem
  stem: Match each theorem to what it guarantees (with its hypotheses met).
  pairs:
  - - Extreme Value Theorem
    - f has an absolute max and an absolute min on [a, b]
  - - Rolle's theorem
    - f′(c) = 0 for some c in (a, b), given f(a) = f(b)
  - - Mean Value Theorem
    - f′(c) equals the average rate of change for some c in (a, b)
  - - Fermat's theorem
    - f′(c) = 0 at an interior local extremum where f′ exists
  distractors:
  - f takes every value between f(a) and f(b)
  explanation: The EVT is about existence of extremes; Fermat's theorem locates them; Rolle's theorem combines the two; the MVT is Rolle's theorem tilted. Taking every value between $f(a)$ and $f(b)$ is the Intermediate Value Theorem from Lesson 5.
- id: calc-m5-r2-q06
  lesson: calc-extreme-values
  type: text
  topic: Mean Value Theorem
  stem: For $f(x) = x^2 + 2x$ on $[0, 4]$, the number $c$ guaranteed by the Mean Value Theorem is $c =$ ___. Give only the number.
  accept:
  - '2'
  explanation: 'Average rate: $\frac{f(4) - f(0)}{4 - 0} = \frac{24 - 0}{4} = 6$. Solve $f''(c) = 2c + 2 = 6$: $c = 2$, which is in $(0, 4)$. (For any quadratic, $c$ is the midpoint of the interval.)'
- id: calc-m5-r2-q07
  lesson: calc-first-derivative-test
  type: label
  module_quiz: true
  topic: First derivative test
  stem: The picture is the graph of $f'$, the derivative, not $f$ itself. Name what happens to $f$ at each numbered point.
  image:
    src: images/calc-m5-fprime-blank.svg
    alt: 'The graph of y = f prime of x, a cubic, with three numbered points: where it crosses the x-axis going down at x = −2, where it crosses going up at x = 1, and its peak between x = 2 and x = 3.'
  labels:
  - x: 26.5
    y: 54.0
    text: Local maximum of f
  - x: 55.3
    y: 54.0
    text: Local minimum of f
  - x: 71.8
    y: 33.0
    text: Inflection point of f
  distractors:
  - Local minimum of f′
  - Point where f is undefined
  explanation: 'At $x = -2$, $f''$ changes from positive to negative, so $f$ rises then falls: a local max. At $x = 1$, $f''$ changes from negative to positive: a local min of $f$. At the peak of the $f''$ graph, $f''$ stops increasing and starts decreasing, so $f''''$ changes sign there: an inflection point of $f$ (where $f$ is steepest), not an extremum of $f$.'
- id: calc-m5-r2-q08
  lesson: calc-first-derivative-test
  type: order
  topic: First derivative test
  stem: Put the steps for finding where $f$ is increasing and decreasing in order.
  items:
  - Find $f'(x)$ and factor it
  - Find the critical numbers and any points outside the domain
  - Mark those points to split the number line into intervals
  - Test the sign of $f'$ at one point in each interval
  - 'Read off: increasing where $f'' > 0$, decreasing where $f'' < 0$'
  explanation: The sign of $f'$ can change only at critical numbers or domain breaks, so those points must be found first; they split the line into intervals where $f'$ keeps one sign, so one test value per interval is enough.
- id: calc-m5-r2-q09
  lesson: calc-first-derivative-test
  module_quiz: true
  topic: First derivative test
  stem: Suppose $f'(x) = x^2(x - 3)(x + 1)$. Which statements about $f$ are true? Select all that apply.
  choices:
  - $f$ has a local maximum at $x = -1$
  - $f$ has a local minimum at $x = 0$
  - $f$ has a local minimum at $x = 3$
  - $f$ is increasing on $(0, 3)$
  answer:
  - 0
  - 2
  explanation: 'Sign chart: $f'' > 0$ on $(-\infty, -1)$, $f'' < 0$ on $(-1, 0)$ and $(0, 3)$, $f'' > 0$ on $(3, \infty)$. So $+$ to $-$ at $-1$ (local max) and $-$ to $+$ at $3$ (local min). At $0$ the factor $x^2$ doesn''t change sign, so $f''$ stays negative on both sides: no extremum. And $f$ is decreasing, not increasing, on $(0, 3)$.'
- id: calc-m5-r2-q10
  lesson: calc-first-derivative-test
  type: text
  topic: First derivative test
  stem: If $f$ is continuous and $f'$ changes from negative to positive at $x = c$, then $f$ has a local ___ at $c$.
  accept:
  - minimum
  - min
  - minima
  - local minimum
  - relative minimum
  - relative min
  explanation: 'Negative then positive means $f$ falls and then rises, so $f(c)$ is lower than the nearby values: a local minimum.'
- id: calc-m5-r2-q11
  lesson: calc-first-derivative-test
  type: match
  topic: First derivative test
  stem: $c$ is a critical number of a continuous function $f$. Match each sign pattern of $f'$ (just left of $c$, then just right) to the conclusion.
  pairs:
  - - $+$ then $-$
    - Local maximum at c
  - - $-$ then $+$
    - Local minimum at c
  - - $+$ then $+$
    - No local extremum at c
  - - $-$ then $-$
    - No local extremum at c
  distractors:
  - Absolute maximum at c
  explanation: That is the first derivative test. With no sign change, $f$ keeps rising (or keeps falling) through $c$, like $x^3$ at 0. The test is about local behavior; it says nothing by itself about absolute extrema.
- id: calc-m5-r2-q12
  lesson: calc-concavity
  type: label
  module_quiz: true
  topic: Concavity
  stem: The graph is one period of $y = \sin x$, split into quarters. Describe the graph near each numbered point.
  image:
    src: images/calc-m5-shapes-blank.svg
    alt: One period of y = sin x from 0 to 2π, split into quarters by dashed lines at π/2, π and 3π/2, with one numbered point in each quarter.
  labels:
  - x: 18.9
    y: 33.8
    text: Increasing and concave down
  - x: 39.3
    y: 33.8
    text: Decreasing and concave down
  - x: 59.8
    y: 66.2
    text: Decreasing and concave up
  - x: 80.2
    y: 66.2
    text: Increasing and concave up
  explanation: 'On $(0, \pi)$, $f''''(x) = -\sin x < 0$, so the graph is concave down; on $(\pi, 2\pi)$, $-\sin x > 0$, so it is concave up. The direction comes from $f''(x) = \cos x$: positive on the first and last quarters (increasing), negative on the middle two (decreasing).'
- id: calc-m5-r2-q13
  lesson: calc-concavity
  type: text
  topic: Concavity
  stem: A point on a graph where the concavity changes (from up to down or down to up) is called an ___ point.
  accept:
  - inflection
  - inflexion
  explanation: An inflection point. Candidates are where $f'' = 0$ or $f''$ is undefined, but you must check that $f''$ actually changes sign there.
- id: calc-m5-r2-q14
  lesson: calc-concavity
  type: match
  topic: Concavity
  stem: Match each statement about $f$ to what it says about $f'$.
  pairs:
  - - $f$ is concave up
    - f′ is increasing
  - - $f$ is increasing
    - f′ is positive
  - - $f$ has an inflection point
    - f′ has a local maximum or minimum
  - - $f$ has a local maximum
    - f′ changes from positive to negative
  distractors:
  - f′ is zero everywhere
  explanation: 'Concave up means the slopes increase. Increasing means positive slopes. At an inflection point, $f''''$ changes sign, so $f''$ switches between increasing and decreasing: a local max or min of $f''$. A local max of $f$ comes with $f''$ going from positive to negative. ($f''$ zero everywhere means $f$ is constant.)'
- id: calc-m5-r2-q15
  lesson: calc-concavity
  module_quiz: true
  topic: Concavity
  stem: Suppose $f''(x) = (x + 1)(x - 2)^2$ for all $x$. Which statements are true? Select all that apply.
  choices:
  - $f$ has an inflection point at $x = -1$
  - $f$ has an inflection point at $x = 2$
  - $f$ is concave up on $(2, \infty)$
  - $f$ is concave down on $(-1, 2)$
  answer:
  - 0
  - 2
  explanation: '$(x - 2)^2 \ge 0$, so the sign of $f''''$ is the sign of $x + 1$: negative for $x < -1$, positive for $x > -1$ (except $f''''(2) = 0$). Concavity changes at $-1$, so that is an inflection point. At $x = 2$, $f''''$ is 0 but positive on both sides: no inflection point. So $f$ is concave up on $(-1, \infty)$, including $(2, \infty)$, and not concave down on $(-1, 2)$.'
- id: calc-m5-r2-q16
  lesson: calc-concavity
  type: text
  topic: Concavity
  stem: The inflection point of $f(x) = x^3 - 6x^2 + 5$ has $x$-coordinate ___. Give only the number.
  accept:
  - '2'
  explanation: $f''(x) = 6x - 12$, which is 0 at $x = 2$ and changes from negative to positive there, so the concavity changes at $x = 2$. (Every cubic has exactly one inflection point.)
- id: calc-m5-r2-q17
  lesson: calc-optimization
  type: order
  module_quiz: true
  topic: Optimization
  stem: Put the steps for solving an optimization problem in order.
  items:
  - Draw a picture and name the variables
  - Write a formula for the quantity to optimize
  - Use the constraint to rewrite it in one variable
  - Find the domain of that one variable
  - Find the critical numbers and test them (or compare with the endpoints)
  - Answer the question asked, with units
  explanation: Variables come from the picture; the objective is written in those variables; the constraint reduces it to one variable, whose domain you then find; only then can you optimize, and the last step is answering what was actually asked.
- id: calc-m5-r2-q18
  lesson: calc-optimization
  type: text
  topic: Optimization
  stem: Two positive numbers have product 64. The smallest possible value of their sum is ___. Give only the number.
  accept:
  - '16'
  explanation: 'With numbers $x$ and $\frac{64}{x}$, the sum is $S(x) = x + \frac{64}{x}$ for $x > 0$. $S''(x) = 1 - \frac{64}{x^2} = 0$ at $x = 8$, and $S''''(x) = \frac{128}{x^3} > 0$, so it is the minimum: $8 + 8 = 16$.'
- id: calc-m5-r2-q19
  lesson: calc-optimization
  topic: Optimization
  stem: For the can in Example 3, $S(r) = 2\pi r^2 + \dfrac{2000}{r}$ on $r > 0$ has one critical number $r_0$. Which arguments correctly show that $S(r_0)$ is the absolute minimum? Select all that apply.
  choices:
  - $S''(r) > 0$ for every $r > 0$
  - $S'$ changes from negative to positive at $r_0$, and $r_0$ is the only critical number
  - $S(r_0)$ is smaller than $S(1)$ and $S(10)$
  - $S'(r_0) = 0$
  answer:
  - 0
  - 1
  explanation: 'Either derivative argument works on this open domain: $S$ concave up everywhere, or a lone critical number where $S''$ goes from $-$ to $+$. Comparing with two sample values proves nothing about all the others, and $S''(r_0) = 0$ only says $r_0$ is a candidate.'
- id: calc-m5-r2-q20
  lesson: calc-optimization
  type: match
  module_quiz: true
  topic: Optimization
  stem: Match each problem to its objective function, written in one variable $x$.
  pairs:
  - - Largest area of a rectangle with perimeter 40
    - x(20 − x)
  - - Open box from a 12-in square sheet, x-by-x corners cut
    - x(12 − 2x)²
  - - Field along a river, 600 m of fence on three sides
    - x(600 − 2x)
  - - Two nonnegative numbers with sum 30, largest product
    - x(30 − x)
  distractors:
  - x(12 − x)²
  explanation: Perimeter 40 means length plus width is 20, so $A = x(20 - x)$. The box has height $x$ and a square base of side $12 - 2x$. The river field has two sides $x$ and one side $600 - 2x$. Numbers $x$ and $30 - x$ have product $x(30 - x)$. $x(12 - x)^2$ forgets that a square is cut from both ends of each side.
- id: calc-m5-r2-q21
  lesson: calc-optimization
  topic: Optimization
  stem: In the river-fence problem (600 m of fence, no fence along the river), why are the endpoints $x = 0$ and $x = 300$ included when comparing values?
  choices:
  - They are part of the closed domain $[0, 300]$, so the closed interval method must check them
  - The maximum always occurs at an endpoint
  - The derivative is undefined at both endpoints
  - They are the only critical numbers
  answer: 0
  explanation: 'Allowing $x = 0$ and $x = 300$ (zero area) makes the domain the closed interval $[0, 300]$, so the closed interval method applies: compare $A(0) = 0$, $A(150) = 45{,}000$ and $A(300) = 0$. The endpoints are checked because extremes can occur there, not because they always do; here the critical number $x = 150$ wins.'
- id: calc-m5-r2-h01
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: Suppose $f(1) = 3$ and $2 \le f'(x) \le 5$ for every $x$ in $(1, 4)$. Which interval must contain $f(4)$?
  choices:
  - $[6, 15]$
  - $[5, 8]$
  - $[9, 18]$
  - $[11, 23]$
  answer: 2
  explanation: By the MVT, $f(4) - f(1) = 3f'(c)$ with $2 \le f'(c) \le 5$, so $6 \le f(4) - 3 \le 15$ and $9 \le f(4) \le 18$. $[6, 15]$ forgets to add $f(1)$; $[5, 8]$ forgets to multiply by the length 3; $[11, 23]$ uses length 4 instead of $4 - 1 = 3$.
- id: calc-m5-r2-h02
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: Since $\dfrac{d}{dx}\cos x = -\sin x$ and $|\sin x| \le 1$, the MVT proves which inequality for all real $a$ and $b$?
  choices:
  - $|\cos a - \cos b| \ge |a - b|$
  - $|\cos a - \cos b| \le |a - b|$
  - $\cos a \le \cos b$ whenever $a \le b$
  - $|\cos a - \cos b| \le |\sin a - \sin b|$
  answer: 1
  explanation: With $|f'| \le M = 1$ everywhere, $|f(a) - f(b)| \le 1\cdot|a - b|$. The reversed inequality fails for $a = 0$, $b = 2\pi$ (left side 0). Cosine is not monotonic. And $a = 0$, $b = \pi$ gives $2 \le 0$ in the last choice, which is false.
- id: calc-m5-r2-h03
  lesson: calc-m5-h-mvt-inequalities
  type: text
  topic: Inequalities from the MVT
  stem: The result "if $f(a) = g(a)$ and $f'(x) \le g'(x)$ for $x > a$, then $f(x) \le g(x)$ for $x > a$" is sometimes called the ___ principle.
  accept:
  - racetrack
  - race track
  - race-track
  explanation: 'The racetrack principle: two runners start together, and the one who is always at least as fast is never behind. It follows from the MVT applied to $h = g - f$.'
- id: calc-m5-r2-h04
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: Apply the MVT to $\sqrt{x}$ on $[49, 50]$. Which conclusion is correct?
  choices:
  - $\sqrt{50} = 7 + \tfrac{1}{14}$ exactly
  - $\sqrt{50} < 7 + \tfrac{1}{100}$
  - $7 + \tfrac{1}{14} < \sqrt{50} < 7.1$
  - $7 < \sqrt{50} < 7 + \tfrac{1}{14}$
  answer: 3
  explanation: $\sqrt{50} - 7 = \frac{1}{2\sqrt c}$ for some $c$ in $(49, 50)$. Since $\sqrt c > 7$, this is less than $\frac{1}{14}$, and it is positive. So $7 < \sqrt{50} < 7 + \frac{1}{14} \approx 7.0714$ (true value $7.0711$). The MVT gives a bound, not an exact value, and $7.01$ is far too small.
- id: calc-m5-r2-h05
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: Which inequality follows from $e^x \ge 1 + x$ by taking the natural log of both sides?
  choices:
  - $\ln(1 + x) \le x$ for $x > -1$
  - $\ln(1 + x) \ge x$ for $x > -1$
  - $\ln(1 + x) \le x$ for all real $x$
  - $\ln x \ge x - 1$ for $x > 0$
  answer: 0
  explanation: 'For $x > -1$ both sides are positive, and $\ln$ is increasing, so $x = \ln e^x \ge \ln(1 + x)$. For $x \le -1$, $\ln(1 + x)$ is undefined. The last choice is backwards: substituting $x - 1$ for $x$ gives $\ln x \le x - 1$.'
- id: calc-m5-r2-h06
  lesson: calc-m5-h-mvt-inequalities
  type: order
  topic: Inequalities from the MVT
  stem: 'Put the steps of the proof of the racetrack principle in order. (Given: $f(a) = g(a)$ and $f'' \le g''$ on $(a, b)$; $x$ is in $(a, b]$.)'
  items:
  - Let $h = g - f$; then $h(a) = 0$ and $h' \ge 0$
  - By the MVT, $h(x) - h(a) = h'(c)(x - a)$ for some $c$ in $(a, x)$
  - Since $h'(c) \ge 0$ and $x - a > 0$, $h(x) \ge h(a) = 0$
  - Therefore $g(x) \ge f(x)$
  explanation: Define the difference first, apply the MVT to it, read the sign of the right side, and translate back to $f$ and $g$.
- id: calc-m5-r2-h07
  lesson: calc-m5-h-mvt-inequalities
  topic: Counting roots
  stem: Which statements about $f(x) = x^4 - 4x + 1$ are correct? Select all that apply.
  choices:
  - $f'$ has exactly one real zero
  - $f$ has at most two real roots
  - $f$ has four real roots because it has degree 4
  - $f$ has a root between 0 and 1
  - $f$ has no real roots because $f(1) < 0$
  answer:
  - 0
  - 1
  - 3
  explanation: $f'(x) = 4x^3 - 4 = 4(x - 1)(x^2 + x + 1)$, and the quadratic factor has no real zeros, so $f'$ has one zero and $f$ has at most two roots. $f(0) = 1 > 0$ and $f(1) = -2 < 0$, so the IVT gives a root in $(0, 1)$. Degree 4 allows up to four roots but doesn't guarantee them, and a negative value is evidence for roots, not against them.
- id: calc-m5-r2-h08
  lesson: calc-m5-h-mvt-inequalities
  type: text
  topic: Counting roots
  stem: If $f$ is differentiable everywhere and $f'$ has exactly 3 real zeros, then $f$ has at most ___ real zeros. Give only the number.
  accept:
  - '4'
  explanation: Between any two consecutive zeros of $f$, Rolle's theorem puts a zero of $f'$. Five zeros of $f$ would need four zeros of $f'$, so $f$ has at most $3 + 1 = 4$.
- id: calc-m5-r2-h09
  lesson: calc-m5-h-mvt-inequalities
  topic: Counting roots
  stem: How many real solutions does $x^3 - 12x + 5 = 0$ have?
  choices:
  - $1$
  - $2$
  - $0$
  - $3$
  answer: 3
  explanation: '$f''(x) = 3x^2 - 12 = 0$ at $x = \pm2$, so there are at most three roots. The local max $f(-2) = -8 + 24 + 5 = 21 > 0$ and the local min $f(2) = 8 - 24 + 5 = -11 < 0$, so the graph crosses the axis on each of $(-\infty, -2)$, $(-2, 2)$ and $(2, \infty)$: three solutions.'
- id: calc-m5-r2-h10
  lesson: calc-m5-h-mvt-inequalities
  topic: Counting roots
  stem: A student proves "$x^3 + 4x - 7 = 0$ has exactly one root" by noting only that $f'(x) = 3x^2 + 4 > 0$. What is missing?
  choices:
  - Nothing; a positive derivative proves exactly one root
  - A proof that a root exists, such as $f(1) < 0 < f(2)$ with the IVT
  - A check that $f$ is concave up
  - The value of the root
  answer: 1
  explanation: '$f'' > 0$ (with Rolle''s theorem) shows there is at most one root. $e^x$ also has a positive derivative and no roots at all. Existence needs a separate argument: $f(1) = -2 < 0 < 9 = f(2)$ and the IVT.'
- id: calc-m5-r2-h11
  lesson: calc-m5-h-mvt-inequalities
  type: match
  topic: Inequalities from the MVT
  stem: Each inequality (for $x \ge 0$) is proved by the racetrack principle, starting from equal values at $x = 0$. Match it to the derivative comparison used.
  pairs:
  - - $\sin x \le x$
    - cos x ≤ 1
  - - $e^x \ge 1 + x$
    - eˣ ≥ 1 for x ≥ 0
  - - $\cos x \ge 1 - \frac{x^2}{2}$
    - sin x ≤ x for x ≥ 0
  - - $\ln(1 + x) \le x$
    - 1/(1 + x) ≤ 1 for x ≥ 0
  distractors:
  - sin x ≥ 0 for all x
  explanation: Differentiate both sides of each inequality and compare. $(\sin x)' = \cos x \le 1 = (x)'$. $(e^x)' = e^x \ge 1 = (1 + x)'$. $(\cos x)' = -\sin x \ge -x = (1 - \frac{x^2}{2})'$ uses $\sin x \le x$. $(\ln(1 + x))' = \frac{1}{1 + x} \le 1$. The distractor is false ($\sin x < 0$ on $(\pi, 2\pi)$).
- id: calc-m5-r2-h12
  lesson: calc-m5-h-mvt-inequalities
  topic: Counting roots
  stem: For $f(x) = x - \cos x$, the derivative $f'(x) = 1 + \sin x$ equals 0 at some points. Why does $f$ still have at most one root?
  choices:
  - $f'$ is never zero, so Rolle's theorem applies directly
  - Rolle's theorem does not apply to trigonometric functions
  - $f' \ge 0$ and is zero only at isolated points, so $f$ is strictly increasing
  - $f$ is a polynomial of degree 1
  answer: 2
  explanation: $f'$ does vanish (at $x = -\frac{\pi}{2} + 2\pi n$), so the plain Rolle argument fails. But $f' \ge 0$ makes $f$ nondecreasing, and $f$ can't be constant on any interval because $f'$ is zero only at isolated points. So $f$ is strictly increasing and crosses zero at most once (exactly once, near $0.739$).
- id: calc-m5-r2-h13
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: A differentiable function satisfies $f'(x) = f(x)$ for all $x$ and $f(0) = 3$. Then $f(x) =$
  choices:
  - $e^x + 2$
  - $e^{3x}$
  - $3x + e^x$
  - $3e^x$
  answer: 3
  explanation: 'Let $q(x) = f(x)e^{-x}$. Then $q'' = f''e^{-x} - fe^{-x} = 0$, so $q$ is constant, $q(0) = 3$, and $f(x) = 3e^x$. The others fail $f'' = f$: $(e^x + 2)'' = e^x \ne e^x + 2$, $(e^{3x})'' = 3e^{3x}$, and $3x + e^x$ also has $f(0) = 1$.'
- id: calc-m5-r2-h14
  lesson: calc-m5-h-mvt-inequalities
  topic: Inequalities from the MVT
  stem: Starting from $\cos x \ge 1 - \frac{x^2}{2}$ for $x \ge 0$, one more use of the racetrack principle gives which inequality for $x \ge 0$?
  choices:
  - $\sin x \ge x - \frac{x^3}{6}$
  - $\sin x \le x - \frac{x^3}{6}$
  - $\sin x \ge x - \frac{x^2}{2}$
  - $\cos x \le 1 - \frac{x^2}{2}$
  answer: 0
  explanation: 'Compare $g(x) = \sin x$ and $f(x) = x - \frac{x^3}{6}$: both are 0 at $x = 0$, and $g''(x) = \cos x \ge 1 - \frac{x^2}{2} = f''(x)$. So $g \ge f$ for $x \ge 0$. ($x - \frac{x^2}{2}$ has the wrong derivative, and the last choice reverses the given inequality.)'
- id: calc-m5-r2-h15
  lesson: calc-m5-h-convexity
  type: label
  topic: Convexity
  stem: The picture shows a convex function with one tangent line and one chord. Name the numbered parts.
  image:
    src: images/calc-m5-convex-blank.svg
    alt: 'A cup-shaped graph with a straight line touching it at one point and lying below it, and a dashed segment joining two points of the graph and lying above it. Four parts are numbered: the solid straight line, the dashed segment, the curve itself, and the point where the solid line touches the curve.'
  labels:
  - x: 20.5
    y: 87.7
    text: Tangent line, below the graph
  - x: 41.6
    y: 41.9
    text: Chord, above the graph between its endpoints
  - x: 89.0
    y: 19.3
    text: Graph of the convex function
  - x: 58.4
    y: 64.7
    text: Point of tangency
  distractors:
  - Inflection point
  explanation: For a convex (concave-up) function, every tangent line lies on or below the graph (the tangent line inequality) and every chord lies on or above the graph between its endpoints (the definition of convexity). A convex function has no inflection points.
- id: calc-m5-r2-h16
  lesson: calc-m5-h-convexity
  type: text
  topic: Convexity
  stem: In most college mathematics, a function whose chords all lie on or above its graph is called a ___ function.
  accept:
  - convex
  - concave up
  - concave-up
  - concave upward
  explanation: Convex is the usual college and research word for concave up. Some books use different words, so check a source's definition.
- id: calc-m5-r2-h17
  lesson: calc-m5-h-convexity
  topic: Convexity
  stem: What does the tangent line inequality give for $f(x) = x^2$ at $a = 3$?
  choices:
  - $x^2 \le 6x - 9$ for all $x$
  - $x^2 \ge 6x - 9$ for all $x$
  - $x^2 \ge 3x$ for all $x$
  - $x^2 \ge 6x - 9$ only for $x \ge 3$
  answer: 1
  explanation: $f''= 2 > 0$, so $f$ is convex. The tangent at 3 is $y = 9 + 6(x - 3) = 6x - 9$, and $x^2 \ge 6x - 9$ for every $x$ (it rearranges to $(x - 3)^2 \ge 0$). $x^2 \ge 3x$ fails at $x = 1$.
- id: calc-m5-r2-h18
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: For a convex function $f$ and numbers $x_1, x_2, x_3$ in its domain, Jensen's inequality says
  choices:
  - $f\left(\frac{x_1 + x_2 + x_3}{3}\right) \ge \frac{f(x_1) + f(x_2) + f(x_3)}{3}$
  - $f(x_1 + x_2 + x_3) \le f(x_1) + f(x_2) + f(x_3)$
  - $f\left(\frac{x_1 + x_2 + x_3}{3}\right) \le \frac{f(x_1) + f(x_2) + f(x_3)}{3}$
  - $f\left(\frac{x_1 + x_2 + x_3}{3}\right) = \frac{f(x_1) + f(x_2) + f(x_3)}{3}$
  answer: 2
  explanation: 'For convex $f$, $f$ of the average is at most the average of $f$; the reversed version holds for concave $f$. Equality holds only for linear $f$ or equal $x_i$. The version with sums instead of averages is a different, generally false statement: for $f(x) = x^2$ and $x_1 = x_2 = x_3 = 1$ it would say $9 \le 3$.'
- id: calc-m5-r2-h19
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: For $f(x) = x^2$ and the numbers 1, 3 and 8, what is (the average of $f$) minus ($f$ of the average)?
  choices:
  - $\tfrac{26}{3}$
  - $\tfrac{74}{3}$
  - $16$
  - $-\tfrac{26}{3}$
  answer: 0
  explanation: 'Average of the numbers: 4, so $f(4) = 16$. Average of the squares: $\frac{1 + 9 + 64}{3} = \frac{74}{3}$. The difference is $\frac{74}{3} - 16 = \frac{26}{3}$, the population variance of the data. Jensen''s inequality says it can''t be negative.'
- id: calc-m5-r2-h20
  lesson: calc-m5-h-convexity
  topic: Convexity
  stem: Which functions are convex on $(0, \infty)$? Select all that apply.
  choices:
  - $x^3$
  - $\ln x$
  - $\sqrt{x}$
  - $\dfrac{1}{x}$
  - $e^{-x}$
  answer:
  - 0
  - 3
  - 4
  explanation: 'Check $f''''$ on $(0, \infty)$: $x^3$ has $6x > 0$; $\frac1x$ has $\frac{2}{x^3} > 0$; $e^{-x}$ has $e^{-x} > 0$. But $\ln x$ has $-\frac{1}{x^2} < 0$ and $\sqrt x$ has $-\frac14x^{-3/2} < 0$: both are concave.'
- id: calc-m5-r2-h21
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: For the numbers 3, 6 and 12, what are the geometric mean (GM) and the arithmetic mean (AM)?
  choices:
  - GM $= 7$, AM $= 6$
  - GM $= 6$, AM $= 6$
  - GM $= 6$, AM $= 7$
  - GM $= 7$, AM $= 7$
  answer: 2
  explanation: GM $= \sqrt[3]{3\cdot6\cdot12} = \sqrt[3]{216} = 6$ and AM $= \frac{21}{3} = 7$. As AM–GM promises, GM $\le$ AM, with strict inequality because the numbers are not all equal.
- id: calc-m5-r2-h22
  lesson: calc-m5-h-convexity
  type: text
  topic: Classic inequalities
  stem: The minimum value of $4x + \dfrac{25}{x}$ for $x > 0$ is ___. Give only the number.
  accept:
  - '20'
  explanation: The product of the terms is $4x\cdot\frac{25}{x} = 100$, so AM–GM gives $4x + \frac{25}{x} \ge 2\sqrt{100} = 20$, with equality when $4x = \frac{25}{x}$, at $x = \frac52$.
- id: calc-m5-r2-h23
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: At which $x > 0$ does $4x + \dfrac{25}{x}$ reach its minimum?
  choices:
  - $5$
  - $\tfrac{25}{4}$
  - $10$
  - $\tfrac52$
  answer: 3
  explanation: 'Equality in AM–GM needs equal terms: $4x = \frac{25}{x}$, so $x^2 = \frac{25}{4}$ and $x = \frac52$. (Calculus agrees: $4 - \frac{25}{x^2} = 0$.) $\frac{25}{4}$ is $x^2$, not $x$.'
- id: calc-m5-r2-h24
  lesson: calc-m5-h-convexity
  type: match
  topic: Convexity
  stem: Match each term to its description.
  pairs:
  - - Convex function
    - Every chord lies on or above the graph
  - - Concave function
    - Every chord lies on or below the graph
  - - Tangent line inequality
    - f(x) ≥ f(a) + f′(a)(x − a)
  - - Jensen's inequality
    - f of the average is at most the average of f
  distractors:
  - The graph crosses each of its tangent lines
  explanation: Convex and concave are defined by chords; for a differentiable convex function, the tangent line inequality says the graph lies above its tangents; averaging tangent line inequalities gives Jensen's inequality. A graph crossing its tangent line happens at an inflection point, which a convex function doesn't have.
- id: calc-m5-r2-h25
  lesson: calc-m5-h-convexity
  topic: Convexity
  stem: $f$ is differentiable and convex on all of $\mathbb{R}$, and $f'(2) = 0$. What can you conclude?
  choices:
  - $f(2)$ is the absolute maximum of $f$
  - $f(2)$ is the absolute minimum of $f$
  - $x = 2$ is an inflection point
  - Nothing until you check the second derivative test
  answer: 1
  explanation: The tangent line at 2 is horizontal, $y = f(2)$, and a convex function lies above all its tangent lines, so $f(x) \ge f(2)$ for every $x$. No further test is needed.
- id: calc-m5-r2-h26
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: Why does the AM–GM argument fail for minimizing $x + \dfrac{1}{x}$ on $x < 0$?
  choices:
  - The product of the terms is not constant
  - The function has no critical numbers there
  - AM–GM only works for two terms
  - AM–GM requires nonnegative numbers, and both terms are negative
  answer: 3
  explanation: The product $x\cdot\frac1x = 1$ is still constant, but AM–GM is only valid for nonnegative numbers. On $x < 0$, $x + \frac1x \le -2$, and the value $-2$ at $x = -1$ is a maximum, not a minimum; there is no minimum. (AM–GM works for any number of terms.)
- id: calc-m5-r2-h27
  lesson: calc-m5-h-convexity
  type: order
  topic: Classic inequalities
  stem: Put the steps of the proof of the AM–GM inequality for positive $a_1, \dots, a_n$ in order.
  items:
  - Note that $\ln x$ is concave, since $(\ln x)'' = -\frac{1}{x^2} < 0$
  - Apply Jensen's inequality, reversed for a concave function, to $\ln$ at $a_1, \dots, a_n$
  - Rewrite the average of the logs as the log of the geometric mean
  - Use that $\ln$ is increasing to conclude AM $\ge$ GM
  explanation: Concavity is what lets you use Jensen's inequality; Jensen gives $\ln(\text{AM}) \ge$ average of the logs; that average is $\ln$ of the product to the power $\frac1n$, the log of the GM; finally, an increasing function preserves the order.
- id: calc-m5-r2-h28
  lesson: calc-m5-h-convexity
  topic: Classic inequalities
  stem: To minimize $x^2 + \dfrac{16}{x}$ for $x > 0$ with AM–GM, which way of writing it makes the product of the terms constant?
  choices:
  - $x^2 + \dfrac{16}{x}$
  - $x^2 + \dfrac{8}{x} + \dfrac{8}{x}$
  - $\dfrac{x^2}{2} + \dfrac{x^2}{2} + \dfrac{16}{x}$
  - $\dfrac{x^2}{4} + \dfrac{3x^2}{4} + \dfrac{16}{x}$
  answer: 1
  explanation: $x^2\cdot\frac8x\cdot\frac8x = 64$, a constant, so $x^2 + \frac{16}{x} \ge 3\sqrt[3]{64} = 12$, with equality when $x^2 = \frac8x$, at $x = 2$. The other products are $16x$, $4x^3$ and $3x^3$, which vary with $x$.
- id: calc-m5-r2-h29
  lesson: calc-m5-h-optimization-models
  type: label
  topic: Optimization models
  stem: The picture shows the lifeguard problem. Name the numbered parts.
  image:
    src: images/calc-m5-lifeguard-blank.svg
    alt: 'A beach with sand above a horizontal shoreline and water below. A path runs from the lifeguard A on the sand to a point P on the shoreline and on to the swimmer B in the water. A dashed vertical line passes through P. Four parts are numbered: a point on the shoreline, a point on the dashed vertical line, the angle at P between the dashed line and the sand path, and the angle at P between the dashed line and the water path.'
  labels:
  - x: 27.6
    y: 45.0
    text: Shoreline
  - x: 68.1
    y: 82.5
    text: Normal to the shoreline
  - x: 63.2
    y: 35.3
    text: Angle θ₁ between the sand path and the normal
  - x: 70.5
    y: 56.5
    text: Angle θ₂ between the water path and the normal
  distractors:
  - Angle between the sand path and the shoreline
  explanation: The normal is the line through the entry point perpendicular to the shoreline. Both angles in the lifeguard rule (and in Snell's law) are measured from the normal, not from the shoreline.
- id: calc-m5-r2-h30
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: With angles measured from the normal, which condition holds at the fastest entry point?
  choices:
  - $v_1\sin\theta_1 = v_2\sin\theta_2$
  - $\theta_1 = \theta_2$
  - $\dfrac{\sin\theta_1}{v_1} = \dfrac{\sin\theta_2}{v_2}$
  - $\dfrac{\cos\theta_1}{v_1} = \dfrac{\cos\theta_2}{v_2}$
  answer: 2
  explanation: $T'(x) = \frac{\sin\theta_1}{v_1} - \frac{\sin\theta_2}{v_2}$, so $T'(x) = 0$ gives the third choice. Multiplying by the speeds instead of dividing is the common slip; equal angles would be the straight line, which is fastest only when $v_1 = v_2$; cosines come from measuring angles from the shoreline.
- id: calc-m5-r2-h31
  lesson: calc-m5-h-optimization-models
  type: text
  topic: Optimization models
  stem: The principle that light travels between two points along the path that takes the least time is called ___ principle.
  accept:
  - Fermat's
  - Fermats
  - Fermat
  explanation: Fermat's principle (Pierre de Fermat, 1600s). Applied to a flat boundary between two media, it gives Snell's law. In its modern form, the time is stationary rather than always least.
- id: calc-m5-r2-h32
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: Light passes from air ($n = 1.00$) into glass ($n = 1.50$), hitting the surface at $30°$ from the normal. About what angle from the normal does it travel in the glass?
  choices:
  - $48.6°$
  - $19.5°$
  - $20.0°$
  - $30°$
  answer: 1
  explanation: 'Snell''s law: $1.00\sin30° = 1.50\sin\theta_2$, so $\sin\theta_2 = \frac{0.5}{1.5} \approx 0.333$ and $\theta_2 \approx 19.5°$. $48.6°$ multiplies by 1.5 instead of dividing; $20.0°$ divides the angle itself by 1.5.'
- id: calc-m5-r2-h33
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: Why does a light ray bend toward the normal when it passes from air into water?
  choices:
  - Light is slower in water, so the least-time path makes a smaller angle with the normal there
  - Light is faster in water, so it turns to stay in the water longer
  - Part of the light reflects off the surface
  - The shortest path between two points is a straight line
  answer: 0
  explanation: 'Like the lifeguard, light "spends" a smaller angle (a steeper, shorter path) in the slower medium: $\frac{\sin\theta_1}{v_1} = \frac{\sin\theta_2}{v_2}$ with $v_2 < v_1$ forces $\sin\theta_2 < \sin\theta_1$. Light is slower, not faster, in water, and a straight line is shortest but not quickest.'
- id: calc-m5-r2-h34
  lesson: calc-m5-h-optimization-models
  type: text
  topic: Optimization models
  stem: A store sells 2000 units a year. Each order costs \$40 to place, and holding one unit for a year costs \$4. The economic order quantity is ___ units. Give only the number.
  accept:
  - '200'
  explanation: $Q^* = \sqrt{\frac{2KD}{h}} = \sqrt{\frac{2\cdot40\cdot2000}{4}} = \sqrt{40{,}000} = 200$ units, or 10 orders a year.
- id: calc-m5-r2-h35
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: In the basic inventory model, how do the yearly ordering cost and the yearly holding cost compare at the economic order quantity?
  choices:
  - The holding cost is twice the ordering cost
  - The ordering cost is twice the holding cost
  - They are equal
  - The holding cost is zero
  answer: 2
  explanation: '$C''(Q^*) = 0$ means $\frac{KD}{Q^{*2}} = \frac h2$; multiplying by $Q^*$ gives $\frac{KD}{Q^*} = \frac{hQ^*}{2}$: ordering cost equals holding cost.'
- id: calc-m5-r2-h36
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: If yearly demand quadruples while the ordering and holding costs stay the same, the economic order quantity
  choices:
  - quadruples
  - doubles
  - stays the same
  - is cut in half
  answer: 1
  explanation: $Q^* = \sqrt{2KD/h}$ is proportional to $\sqrt D$, and $\sqrt4 = 2$. The square root damps the change.
- id: calc-m5-r2-h37
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: Which assumptions does the basic inventory model ($C(Q) = \frac{KD}{Q} + \frac{hQ}{2}$) make? Select all that apply.
  choices:
  - Demand is steady through the year
  - Each order arrives all at once, just as stock runs out
  - Larger orders get a lower price per unit
  - Running out of stock is allowed and costs nothing
  answer:
  - 0
  - 1
  explanation: Steady demand and instant delivery when stock hits zero are what make the stock level a sawtooth with average $\frac Q2$. The model ignores volume discounts (the price of the goods is left out because it doesn't depend on $Q$) and allows no shortages.
- id: calc-m5-r2-h38
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: Two hallways, each 8 ft wide, meet at a right angle. What is the longest ladder that can be carried horizontally around the corner?
  choices:
  - $16$ ft
  - $8\sqrt2 \approx 11.3$ ft
  - $32$ ft
  - $16\sqrt2 \approx 22.6$ ft
  answer: 3
  explanation: $L_{\min} = (8^{2/3} + 8^{2/3})^{3/2} = 8^{3/2} = 16\sqrt2 \approx 22.6$ ft. With equal widths the best angle is $45°$, and each piece is $\frac{8}{\sin45°} = 8\sqrt2$. $8\sqrt2$ is only one piece.
- id: calc-m5-r2-h39
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: Why is the longest ladder that fits around the corner found by minimizing $L(\theta)$?
  choices:
  - A ladder fits only if it is no longer than every segment touching the inner corner, so the shortest such segment is the limit
  - Because $L(\theta)$ has no critical numbers
  - Because the maximum of $L(\theta)$ is at $\theta = 45°$
  - Because shorter ladders are always easier to carry
  answer: 0
  explanation: While turning, the ladder must at some moment lie along a segment through the inner corner at each angle; it gets stuck at the angle where that segment is shortest. So the longest ladder that fits equals $\min L(\theta)$. $L$ has one critical number and no maximum (it blows up at both ends).
- id: calc-m5-r2-h40
  lesson: calc-m5-h-optimization-models
  type: order
  topic: Optimization models
  stem: Put the steps of the lifeguard derivation in order.
  items:
  - Let $x$ be the distance along the shore to the entry point
  - Write $T(x)$ as sand distance over $v_1$ plus water distance over $v_2$
  - Compute $T'(x)$ and set it equal to 0
  - Rewrite $T'(x) = 0$ as $\frac{\sin\theta_1}{v_1} = \frac{\sin\theta_2}{v_2}$
  explanation: Choose the variable, build the objective, differentiate, then interpret the critical-point condition geometrically using the right triangles on each side of the shore.
- id: calc-m5-r2-h41
  lesson: calc-m5-h-optimization-models
  type: match
  topic: Optimization models
  stem: Match each optimization model to the condition that holds at its optimum.
  pairs:
  - - Lifeguard or light ray
    - sin θ₁ / v₁ = sin θ₂ / v₂
  - - Inventory (economic order quantity)
    - Ordering cost equals holding cost
  - - Ladder around a corner
    - tan³θ = a / b
  - - Profit (Lesson 20)
    - Marginal revenue equals marginal cost
  distractors:
  - Height equals radius
  explanation: Each rule is what $f' = 0$ says in that model. (For the closed can of Lesson 20, the optimum has height equal to the diameter, $h = 2r$, not the radius.)
- id: calc-m5-r2-h42
  lesson: calc-m5-h-optimization-models
  topic: Optimization models
  stem: In the inventory model, $\dfrac{C(kQ^*)}{C(Q^*)} = \dfrac12\left(k + \dfrac1k\right)$. By what percent does the yearly cost rise if a store orders twice the economic order quantity?
  choices:
  - $100\%$
  - $50\%$
  - $25\%$
  - $12.5\%$
  answer: 2
  explanation: 'With $k = 2$: $\frac12\left(2 + \frac12\right) = 1.25$, a 25% rise. Doubling the order size does not double the cost, because the cost curve is flat near its minimum.'
