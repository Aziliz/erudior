# Module 11: Parametric equations and polar coordinates
- id: calc-q-4301
  lesson: calc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'For $x = t^2 + 1$, $y = t^3 - t$, find $\dfrac{dy}{dx}$ at $t = 2$.'
  choices: ['$\tfrac{4}{11}$', '$11$', '$\tfrac{11}{4}$', '$\tfrac{12}{4}$']
  answer: 2
  explanation: |-
    $\frac{dy}{dx} = \frac{3t^2 - 1}{2t}$; at $t = 2$: $\frac{11}{4}$. The answer $\frac{4}{11}$ is $\frac{dx}{dy}$, upside down.
- id: calc-q-4302
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'Eliminate the parameter: $x = 2\cos t$, $y = 2\sin t$.'
  choices: ['$x^2 + y^2 = 4$', '$x^2 + y^2 = 2$', '$y = x$', '$\tfrac{x^2}{4} - \tfrac{y^2}{4} = 1$']
  answer: 0
  explanation: |-
    $x^2 + y^2 = 4\cos^2t + 4\sin^2t = 4$: a circle of radius 2.
- id: calc-q-4303
  lesson: calc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'For $x = t^2 - 4t$, $y = t^2 - 1$, where is the tangent line vertical?'
  choices: ['At $t = 0$', 'At $t = 2$, the point $(-4, 3)$', 'At $t = 1$', 'Nowhere']
  answer: 1
  explanation: |-
    Vertical when $\frac{dx}{dt} = 2t - 4 = 0$ (and $\frac{dy}{dt} = 2t \ne 0$): $t = 2$, the point $(4 - 8, 4 - 1) = (-4, 3)$.
- id: calc-q-4304
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'Which formula gives $\dfrac{d^2y}{dx^2}$ for a parametric curve?'
  choices: ['$\dfrac{y''''(t)}{x''''(t)}$', '$\dfrac{y''''(t)}{x''(t)}$', '$\dfrac{d}{dt}\left(\dfrac{y''(t)}{x''(t)}\right)$', '$\dfrac{\frac{d}{dt}\left(\frac{dy}{dx}\right)}{dx/dt}$']
  answer: 3
  explanation: |-
    Differentiate $\frac{dy}{dx}$ with respect to $t$, then divide by $\frac{dx}{dt}$ to convert to a derivative with respect to $x$.
- id: calc-q-4305
  lesson: calc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'A particle moves with $x''(t) = 3$ and $y''(t) = 4t$. What is its speed at $t = 1$?'
  choices:
    - '$7$'
    - '$\sqrt7$'
    - '$25$'
    - '$5$'
  answer: 3
  explanation: |-
    Speed $= \sqrt{3^2 + 4^2} = 5$.
- id: calc-q-4306
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'Which integral gives the length of $x = t^2$, $y = t^3$ for $0 \le t \le 1$?'
  choices: ['$\int_0^1\sqrt{t^2 + t^3}\,dt$', '$\int_0^1\sqrt{1 + \frac94t^2}\,dt$', '$\int_0^1\sqrt{4t^2 + 9t^4}\,dt$', '$\int_0^1(2t + 3t^2)\,dt$']
  answer: 2
  explanation: |-
    $L = \int\sqrt{(x')^2 + (y')^2}\,dt = \int_0^1\sqrt{4t^2 + 9t^4}\,dt = \frac{13\sqrt{13} - 8}{27} \approx 1.440$.
- id: calc-q-4307
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'Find the length of the circle $x = 5\cos t$, $y = 5\sin t$, $0 \le t \le 2\pi$, using the parametric arc length formula.'
  choices: ['$10\pi$', '$25\pi$', '$5\pi$', '$20\pi$']
  answer: 0
  explanation: |-
    Speed $= \sqrt{25\sin^2t + 25\cos^2t} = 5$, so $L = \int_0^{2\pi}5\,dt = 10\pi$.
- id: calc-q-4308
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'A particle starts at $(2, -1)$ at $t = 0$ with $x''(t) = 6t$ and $y''(t) = 2$. Where is it at $t = 3$?'
  choices: ['$(27, 6)$', '$(29, 5)$', '$(18, 6)$', '$(20, 5)$']
  answer: 1
  explanation: |-
    $x(3) = 2 + \int_0^3 6t\,dt = 2 + 27 = 29$; $y(3) = -1 + \int_0^3 2\,dt = -1 + 6 = 5$.
- id: calc-q-4309
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'For $x = e^t$, $y = e^{2t}$, find $\dfrac{dy}{dx}$.'
  choices: ['$2e^{2t}$', '$e^{t}$', '$\tfrac12e^{-t}$', '$2e^t$']
  answer: 3
  explanation: |-
    $\frac{2e^{2t}}{e^t} = 2e^t$. (Indeed $y = x^2$, so $\frac{dy}{dx} = 2x = 2e^t$.)
- id: calc-q-4310
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'The curve $x = t^2 - 3$, $y = t^3 - 3t$ passes through $(0, 0)$ at $t = \pm\sqrt3$. What is true there?'
  choices: ['There is one tangent line, horizontal', 'There are two different tangent lines (the curve crosses itself)', 'The curve has a cusp', 'The slope is undefined at both']
  answer: 1
  explanation: |-
    $\frac{dy}{dx} = \frac{3t^2 - 3}{2t} = \frac{6}{\pm2\sqrt3} = \pm\sqrt3$. Two different slopes at the same point: a self-crossing.
- id: calc-q-4311
  lesson: calc-parametric
  topic: Parametric equations
  stem: 'Find the area under one arch of the cycloid $x = t - \sin t$, $y = 1 - \cos t$ ($0 \le t \le 2\pi$).'
  choices: ['$2\pi$', '$\pi$', '$4\pi$', '$3\pi$']
  answer: 3
  explanation: |-
    $\int y\,dx = \int_0^{2\pi}(1 - \cos t)^2\,dt = \int_0^{2\pi}(1 - 2\cos t + \cos^2t)\,dt = 2\pi + \pi = 3\pi$.

- id: calc-q-4401
  lesson: calc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Convert the polar point $\left(4, \frac{2\pi}{3}\right)$ to rectangular coordinates.'
  choices: ['$(-2, 2\sqrt3)$', '$(2, 2\sqrt3)$', '$(-2\sqrt3, 2)$', '$(2\sqrt3, -2)$']
  answer: 0
  explanation: |-
    $x = 4\cos\frac{2\pi}{3} = -2$, $y = 4\sin\frac{2\pi}{3} = 2\sqrt3$.
- id: calc-q-4402
  lesson: calc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Which integral gives the area enclosed by $r = 2\sin\theta$?'
  choices: ['$\int_0^\pi2\sin\theta\,d\theta$', '$\tfrac12\int_0^{2\pi}4\sin^2\theta\,d\theta$', '$\tfrac12\int_0^\pi4\sin^2\theta\,d\theta$', '$\int_0^{\pi}4\sin^2\theta\,d\theta$']
  answer: 2
  explanation: |-
    The circle is traced once for $0 \le \theta \le \pi$. $\frac12\int_0^\pi4\sin^2\theta\,d\theta = \pi$, the area of a radius-1 circle. Using $[0, 2\pi]$ counts it twice.
- id: calc-q-4403
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'What curve is $r = 6\cos\theta$?'
  choices: ['A circle of radius 6 centered at the origin', 'A circle of radius 3 centered at $(3, 0)$', 'A cardioid', 'A line']
  answer: 1
  explanation: |-
    $r^2 = 6r\cos\theta$ gives $x^2 + y^2 = 6x$, i.e. $(x - 3)^2 + y^2 = 9$.
- id: calc-q-4404
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'How many petals does $r = 3\sin(4\theta)$ have?'
  choices: ['$4$', '$3$', '$12$', '$8$']
  answer: 3
  explanation: |-
    For $r = a\sin(n\theta)$ or $a\cos(n\theta)$: $n$ petals if $n$ is odd, $2n$ if even. Here $2\cdot4 = 8$.
- id: calc-q-4405
  lesson: calc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Find the area enclosed by the cardioid $r = 2(1 + \cos\theta)$.'
  choices:
    - '$3\pi$'
    - '$4\pi$'
    - '$\tfrac{3\pi}{2}$'
    - '$6\pi$'
  answer: 3
  explanation: |-
    $\frac12\int_0^{2\pi}4(1 + \cos\theta)^2d\theta = 2\cdot3\pi = 6\pi$ (four times the area $\frac{3\pi}{2}$ of $r = 1 + \cos\theta$, since lengths doubled).
- id: calc-q-4406
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'For a polar curve, what does $\dfrac{dr}{d\theta}$ measure?'
  choices: ['The slope of the tangent line', 'How fast the distance from the origin changes as $\theta$ increases', 'The area swept out', 'The arc length']
  answer: 1
  explanation: |-
    It's the rate of change of $r$. The slope $\frac{dy}{dx}$ needs the full formula $\frac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$.
- id: calc-q-4407
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'Find the slope of $r = \theta$ at $\theta = \frac\pi2$.'
  choices: ['$-\dfrac{2}{\pi}$', '$\dfrac{\pi}{2}$', '$1$', '$0$']
  answer: 0
  explanation: |-
    $r' = 1$. $\frac{dy}{dx} = \frac{1\cdot\sin\theta + \theta\cos\theta}{1\cdot\cos\theta - \theta\sin\theta} = \frac{1 + 0}{0 - \pi/2} = -\frac{2}{\pi}$.
- id: calc-q-4408
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'The area of a polar region comes from summing thin'
  choices: ['vertical rectangles', 'circular sectors (wedges) of area $\tfrac12r^2\Delta\theta$', 'disks of area $\pi r^2$', 'shells of area $2\pi r\Delta r$']
  answer: 1
  explanation: |-
    A sector with radius $r$ and angle $\Delta\theta$ has area $\frac12r^2\Delta\theta$; adding them gives $\frac12\int r^2\,d\theta$.
- id: calc-q-4409
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'Where do $r = 1$ and $r = 2\cos\theta$ intersect (for $-\pi < \theta \le \pi$)?'
  choices: ['$\theta = \pm\tfrac\pi6$', '$\theta = 0$ only', '$\theta = \pm\tfrac\pi3$', '$\theta = \pm\tfrac\pi2$']
  answer: 2
  explanation: |-
    $2\cos\theta = 1$ gives $\cos\theta = \frac12$, $\theta = \pm\frac\pi3$.
- id: calc-q-4410
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'The area inside $r = 2\cos\theta$ and outside $r = 1$ is'
  choices: ['$\tfrac12\int_{-\pi/3}^{\pi/3}(2\cos\theta - 1)^2\,d\theta$', '$\tfrac12\int_{-\pi/3}^{\pi/3}(4\cos^2\theta - 1)\,d\theta$', '$\int_{-\pi/3}^{\pi/3}(4\cos^2\theta - 1)\,d\theta$', '$\tfrac12\int_{0}^{\pi}(4\cos^2\theta - 1)\,d\theta$']
  answer: 1
  explanation: |-
    $\frac12\int(r_{\text{out}}^2 - r_{\text{in}}^2)\,d\theta$ between the intersections $\pm\frac\pi3$. Its value is $\frac\pi3 + \frac{\sqrt3}{2} \approx 1.913$. Writing $(2\cos\theta - 1)^2$ squares the difference instead of subtracting the squares, the same mistake as with washers.
- id: calc-q-4411
  lesson: calc-polar
  topic: Polar coordinates
  stem: 'Which integral gives the arc length of $r = e^\theta$ for $0 \le \theta \le 1$?'
  choices: ['$\int_0^1e^\theta\,d\theta$', '$\int_0^1\sqrt{1 + e^{2\theta}}\,d\theta$', '$\tfrac12\int_0^1e^{2\theta}\,d\theta$', '$\int_0^1\sqrt2\,e^\theta\,d\theta$']
  answer: 3
  explanation: |-
    $\sqrt{r^2 + (r')^2} = \sqrt{e^{2\theta} + e^{2\theta}} = \sqrt2e^\theta$, so $L = \sqrt2(e - 1)$.
