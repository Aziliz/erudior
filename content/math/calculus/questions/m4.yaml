# Module 4: Rates and approximation
- id: calc-q-1401
  lesson: calc-related-rates
  module_quiz: true
  topic: Related rates
  stem: 'A circle''s radius grows at 2 cm/s. How fast is its area growing when $r = 5$ cm?'
  choices: ['$10\pi$ cm²/s', '$4\pi$ cm²/s', '$20\pi$ cm²/s', '$25\pi$ cm²/s']
  answer: 2
  explanation: |-
    $A = \pi r^2$, so $\frac{dA}{dt} = 2\pi r\frac{dr}{dt} = 2\pi(5)(2) = 20\pi$ cm²/s.
- id: calc-q-1402
  lesson: calc-related-rates
  module_quiz: true
  topic: Related rates
  stem: 'A 10-ft ladder slides down a wall; its foot moves away at 1 ft/s. How fast is the top falling when the foot is 6 ft from the wall?'
  choices: ['$\tfrac34$ ft/s', '$\tfrac43$ ft/s', '$\tfrac35$ ft/s', '$1$ ft/s']
  answer: 0
  explanation: |-
    $x^2 + y^2 = 100$; at $x = 6$, $y = 8$. Then $2x\dot x + 2y\dot y = 0$ gives $12 + 16\dot y = 0$, so $\dot y = -\frac34$ ft/s: the top falls at $\frac34$ ft/s. ($\frac43$ swaps $x$ and $y$.)
- id: calc-q-1403
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A spherical balloon''s volume grows at $100$ cm³/s. How fast is the radius growing when $r = 5$ cm?'
  choices: ['$\dfrac{1}{\pi}$ cm/s', '$\dfrac{4}{\pi}$ cm/s', '$\dfrac{1}{4\pi}$ cm/s', '$100\pi$ cm/s']
  answer: 0
  explanation: |-
    $\frac{dV}{dt} = 4\pi r^2\frac{dr}{dt}$: $100 = 4\pi(25)\frac{dr}{dt} = 100\pi\frac{dr}{dt}$, so $\frac{dr}{dt} = \frac1\pi \approx 0.318$ cm/s.
- id: calc-q-1404
  lesson: calc-related-rates
  topic: Related rates
  stem: 'In a related-rates problem, a student substitutes $r = 5$ into $A = \pi r^2$ to get $A = 25\pi$, then differentiates to get $\frac{dA}{dt} = 0$. What went wrong?'
  choices:
    - 'The formula for area is wrong'
    - 'The student should have integrated'
    - 'The value $r = 5$ was substituted before differentiating, freezing $r$ as a constant'
    - 'Nothing; the area is constant'
  answer: 2
  explanation: |-
    Differentiate first: $\frac{dA}{dt} = 2\pi r\frac{dr}{dt}$. Only then plug in the instant's value $r = 5$.
- id: calc-q-1405
  lesson: calc-related-rates
  module_quiz: true
  topic: Related rates
  stem: 'Water drains from an inverted cone (height 10 m, top radius 5 m). Which equation gives $V$ as a function of the water depth $h$ alone?'
  choices: ['$V = \tfrac13\pi h^3$', '$V = \tfrac1{12}\pi h^3$', '$V = \tfrac{1}{6}\pi h^3$', '$V = \tfrac{25}{3}\pi h$']
  answer: 1
  explanation: |-
    Similar triangles: $\frac rh = \frac5{10}$, so $r = \frac h2$. Then $V = \frac13\pi\left(\frac h2\right)^2h = \frac{1}{12}\pi h^3$.
- id: calc-q-1406
  lesson: calc-related-rates
  topic: Related rates
  stem: 'Two cars leave an intersection: one north at 30 mph, one east at 40 mph. How fast is the distance between them increasing after 1 hour?'
  choices: ['$70$ mph', '$35$ mph', '$10$ mph', '$50$ mph']
  answer: 3
  explanation: |-
    At $t = 1$: $x = 40$, $y = 30$, $D = 50$. $D\dot D = x\dot x + y\dot y = 1600 + 900 = 2500$, so $\dot D = 50$ mph. (Here $D = 50t$ the whole time.)
- id: calc-q-1407
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A cube''s edge grows at 0.5 cm/s. How fast is its volume growing when the edge is 4 cm?'
  choices: ['$24$ cm³/s', '$8$ cm³/s', '$32$ cm³/s', '$48$ cm³/s']
  answer: 0
  explanation: |-
    $\frac{dV}{dt} = 3s^2\frac{ds}{dt} = 3(16)(0.5) = 24$ cm³/s.
- id: calc-q-1408
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A rocket rises vertically, tracked from a point 3 km from the launch pad. When the rocket is 4 km high and rising at 0.5 km/s, how fast is its distance from the tracker increasing?'
  choices: ['$0.5$ km/s', '$0.3$ km/s', '$0.4$ km/s', '$0.625$ km/s']
  answer: 2
  explanation: |-
    $D^2 = 9 + y^2$. At $y = 4$, $D = 5$. $2D\dot D = 2y\dot y$ gives $\dot D = \frac{4(0.5)}{5} = 0.4$ km/s.
- id: calc-q-1409
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A balloon 100 m from an observer rises at 4 m/s. How fast is the angle of elevation increasing when the balloon is 100 m high?'
  choices: ['$0.04$ rad/s', '$0.02$ rad/s', '$0.08$ rad/s', '$2$ deg/s']
  answer: 1
  explanation: |-
    $\tan\theta = \frac{y}{100}$, so $\sec^2\theta\,\dot\theta = \frac{\dot y}{100}$. At $y = 100$, $\sec^2\theta = 2$: $\dot\theta = \frac{4}{200} = 0.02$ rad/s.
- id: calc-q-1410
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A tank is draining. Which sign should $\dfrac{dV}{dt}$ have in your equations?'
  choices: ['Positive', 'Zero', 'It depends on the shape of the tank', 'Negative']
  answer: 3
  explanation: |-
    $V$ is decreasing, so its rate of change is negative. Getting this sign right determines the sign of every other rate you compute.
- id: calc-q-1411
  lesson: calc-related-rates
  topic: Related rates
  stem: 'A 6-ft person walks away from a 15-ft streetlight at 5 ft/s. How fast does the tip of the shadow move?'
  choices: ['$\tfrac{25}{3}$ ft/s', '$\tfrac{10}{3}$ ft/s', '$5$ ft/s', '$\tfrac{25}{9}$ ft/s']
  answer: 0
  explanation: |-
    Let $x$ = person's distance, $s$ = tip's distance from the pole. Similar triangles: $\frac{15}{s} = \frac{6}{s - x}$, so $15s - 15x = 6s$ and $s = \frac{5}{3}x$. Then $\dot s = \frac53(5) = \frac{25}{3}$ ft/s. (The shadow's length grows at $\frac{10}{3}$ ft/s.)

- id: calc-q-1501
  lesson: calc-linearization
  module_quiz: true
  topic: Linearization
  stem: 'Use the linearization of $f(x) = \sqrt x$ at $a = 9$ to estimate $\sqrt{9.3}$.'
  choices: ['$3.05$', '$3.1$', '$3.03$', '$3.0167$']
  answer: 0
  explanation: |-
    $L(x) = 3 + \frac16(x - 9)$, so $L(9.3) = 3 + 0.05 = 3.05$. (True value $3.0496$.)
- id: calc-q-1502
  lesson: calc-linearization
  topic: Linearization
  stem: 'The linearization of $f(x) = \ln x$ at $a = 1$ is'
  choices: ['$L(x) = x$', '$L(x) = x - 1$', '$L(x) = 1 + x$', '$L(x) = \ln x - 1$']
  answer: 1
  explanation: |-
    $f(1) = 0$ and $f'(1) = 1$, so $L(x) = 0 + 1(x - 1)$.
- id: calc-q-1503
  lesson: calc-linearization
  module_quiz: true
  topic: Linearization
  stem: 'If $f''''(x) > 0$ near $a$, the tangent-line approximation $L(x)$ for $x$ near $a$ is'
  choices: ['an overestimate', 'exact', 'an underestimate', 'impossible to classify']
  answer: 2
  explanation: |-
    Concave up means the curve lies above its tangent lines, so the tangent line value is too small.
- id: calc-q-1504
  lesson: calc-linearization
  topic: Linearization
  stem: 'A sphere''s radius is measured as 5 cm with error at most 0.1 cm. Using differentials, the maximum error in its volume is about'
  choices: ['$10\pi$ cm³', '$\tfrac{4}{3}\pi$ cm³', '$100\pi$ cm³', '$\tfrac{10}{3}\pi$ cm³']
  answer: 0
  explanation: |-
    $dV = 4\pi r^2\,dr = 4\pi(25)(0.1) = 10\pi \approx 31.4$ cm³.
- id: calc-q-1505
  lesson: calc-linearization
  topic: Linearization
  stem: 'For $y = x^3$, find $dy$ when $x = 2$ and $dx = 0.01$.'
  choices: ['$0.08$', '$0.0012$', '$0.06$', '$0.12$']
  answer: 3
  explanation: |-
    $dy = 3x^2\,dx = 12(0.01) = 0.12$. (The actual change is $2.01^3 - 8 = 0.120601$.)
- id: calc-q-1506
  lesson: calc-linearization
  module_quiz: true
  topic: Newton's method
  stem: 'Apply one step of Newton''s method to $f(x) = x^2 - 5$ with $x_0 = 2$.'
  choices:
    - '$x_1 = 2.5$'
    - '$x_1 = 1.75$'
    - '$x_1 = 2.2$'
    - '$x_1 = 2.25$'
  answer: 3
  explanation: |-
    $x_1 = 2 - \frac{f(2)}{f'(2)} = 2 - \frac{-1}{4} = 2.25$. ($\sqrt5 \approx 2.236$.)
- id: calc-q-1507
  lesson: calc-linearization
  topic: Newton's method
  stem: 'Newton''s method fails at the first step if'
  choices: ['$f(x_0) = 0$', '$f(x_0) < 0$', '$f''''(x_0) = 0$', '$f''(x_0) = 0$']
  answer: 3
  explanation: |-
    The formula divides by $f'(x_0)$; a horizontal tangent never meets the $x$-axis. (If $f(x_0) = 0$ you've already found a root.)
- id: calc-q-1508
  lesson: calc-linearization
  topic: Linearization
  stem: 'The small-angle approximation $\sin x \approx x$ is the linearization of $\sin x$ at'
  choices: ['$x = 0$', '$x = \pi/2$', '$x = 1$', '$x = \pi$']
  answer: 0
  explanation: |-
    $\sin 0 = 0$ and $\cos 0 = 1$, so $L(x) = x$. It needs radians.
- id: calc-q-1509
  lesson: calc-linearization
  topic: Linearization
  stem: 'Use a linear approximation to estimate $(1.02)^{10}$.'
  choices: ['$1.02$', '$1.2$', '$1.22$', '$1.1$']
  answer: 1
  explanation: |-
    $(1 + x)^{10} \approx 1 + 10x$ near 0, so $(1.02)^{10} \approx 1.2$. (True value $1.2190$; the curve is concave up, so this underestimates.)
- id: calc-q-1510
  lesson: calc-linearization
  topic: Linearization
  stem: 'A square''s side is measured with a relative error of 2%. The relative error in its area is about'
  choices: ['$2\%$', '$1\%$', '$4\%$', '$8\%$']
  answer: 2
  explanation: |-
    $A = s^2$, $dA = 2s\,ds$, so $\frac{dA}{A} = 2\frac{ds}{s} = 4\%$.
- id: calc-q-1511
  lesson: calc-linearization
  topic: Newton's method
  stem: 'Newton''s method for $f(x) = x^3 - x - 1$ starting at $x_0 = 1$ gives $x_1 =$'
  choices: ['$1.5$', '$1.25$', '$1.33$', '$2$']
  answer: 0
  explanation: |-
    $f(1) = -1$, $f'(x) = 3x^2 - 1$, $f'(1) = 2$. $x_1 = 1 - \frac{-1}{2} = 1.5$.

- id: calc-q-1601
  lesson: calc-lhopital
  module_quiz: true
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to0}\frac{e^{2x} - 1}{x}$.'
  choices: ['$1$', '$2$', '$0$', '$e^2$']
  answer: 1
  explanation: |-
    $0/0$. L'Hôpital: $\lim\frac{2e^{2x}}{1} = 2$.
- id: calc-q-1602
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to\infty}\frac{x^2}{e^x}$.'
  choices: ['$\infty$', '$1$', '$2$', '$0$']
  answer: 3
  explanation: |-
    $\infty/\infty$ twice: $\frac{2x}{e^x} \to \frac{2}{e^x} \to 0$. Exponentials beat powers.
- id: calc-q-1603
  lesson: calc-lhopital
  module_quiz: true
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to\infty}\left(1 + \frac{2}{x}\right)^{x}$.'
  choices: ['$1$', '$e$', '$e^2$', '$\infty$']
  answer: 2
  explanation: |-
    $1^\infty$ form. $\ln y = x\ln(1 + 2/x) \to 2$ by L'Hôpital, so $y \to e^2$. Calling $1^\infty$ equal to 1 is the trap.
- id: calc-q-1604
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'A student computes $\displaystyle\lim_{x\to1}\frac{x^2 + 1}{x + 3}$ with L''Hôpital''s rule and gets $\frac{2}{1} = 2$. What is the correct limit?'
  choices: ['$2$', '$\tfrac12$', '$1$', 'It does not exist']
  answer: 1
  explanation: |-
    Substitution gives $\frac{2}{4} = \frac12$. The form isn't indeterminate, so L'Hôpital's rule doesn't apply.
- id: calc-q-1605
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to0^+}x^2\ln x$.'
  choices: ['$0$', '$-\infty$', '$1$', '$-\tfrac12$']
  answer: 0
  explanation: |-
    Rewrite $\frac{\ln x}{x^{-2}}$: L'Hôpital gives $\frac{1/x}{-2x^{-3}} = -\frac{x^2}{2} \to 0$.
- id: calc-q-1606
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to0}\frac{1 - \cos x}{x^2}$.'
  choices: ['$0$', '$1$', '$2$', '$\tfrac12$']
  answer: 3
  explanation: |-
    $0/0$: $\frac{\sin x}{2x}$, still $0/0$: $\frac{\cos x}{2} \to \frac12$.
- id: calc-q-1607
  lesson: calc-lhopital
  module_quiz: true
  topic: L'Hôpital's rule
  stem: 'Which limit is NOT an indeterminate form?'
  choices: ['$0\cdot\infty$', '$1^\infty$', '$\dfrac{0}{\infty}$', '$\infty - \infty$']
  answer: 2
  explanation: |-
    A numerator tending to 0 over a denominator growing without bound gives 0. The other three can come out to anything.
- id: calc-q-1608
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to0^+}x^{x}$.'
  choices:
    - '$0$'
    - 'It does not exist'
    - '$e$'
    - '$1$'
  answer: 3
  explanation: |-
    $\ln y = x\ln x \to 0$, so $y \to e^0 = 1$.
- id: calc-q-1609
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to0}\frac{\tan x - x}{x^3}$.'
  choices: ['$0$', '$\tfrac13$', '$1$', '$\tfrac16$']
  answer: 1
  explanation: |-
    Repeated L'Hôpital: $\frac{\sec^2 x - 1}{3x^2} = \frac{\tan^2 x}{3x^2} \to \frac13$ (since $\frac{\tan x}{x} \to 1$).
- id: calc-q-1610
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to\infty}\frac{\ln x}{x^{0.1}}$.'
  choices: ['$\infty$', '$10$', '$0$', '$0.1$']
  answer: 2
  explanation: |-
    $\frac{1/x}{0.1x^{-0.9}} = \frac{10}{x^{0.1}} \to 0$. Every positive power eventually beats $\ln x$, even $x^{0.1}$.
- id: calc-q-1611
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'Find $\displaystyle\lim_{x\to 1}\left(\frac{1}{\ln x} - \frac{1}{x - 1}\right)$.'
  choices: ['$0$', '$1$', '$-\tfrac12$', '$\tfrac12$']
  answer: 3
  explanation: |-
    Combine: $\frac{x - 1 - \ln x}{(x - 1)\ln x}$ ($0/0$). L'Hôpital: $\frac{1 - 1/x}{\ln x + (x - 1)/x} = \frac{x - 1}{x\ln x + x - 1}$ ($0/0$). Again: $\frac{1}{\ln x + 1 + 1} \to \frac12$.
- id: calc-q-1612
  lesson: calc-lhopital
  topic: L'Hôpital's rule
  stem: 'In L''Hôpital''s rule, what do you differentiate?'
  choices:
    - 'The whole quotient, using the quotient rule'
    - 'Only the numerator'
    - 'The numerator and denominator separately'
    - 'The logarithm of the quotient'
  answer: 2
  explanation: |-
    $\lim\frac fg = \lim\frac{f'}{g'}$: derivative of the top over derivative of the bottom, each on its own.
