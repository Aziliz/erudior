# Round 2 glossary for calc-m4 (honors lessons 16h1 and 16h2)
- term: quadratic convergence
  aliases: [converges quadratically, quadratically convergent]
  definition: 'Convergence in which each error is roughly a constant times the square of the previous one, $e_{n+1} \approx Ce_n^2$, so the number of correct digits roughly doubles each step. Newton''s method converges this way near a simple root.'
  topic: Convergence of Newton's method
- term: linear convergence
  aliases: [converges linearly, linearly convergent]
  definition: 'Convergence in which each error is roughly a fixed fraction of the previous one, $e_{n+1} \approx ke_n$ with $0 < k < 1$, so a fixed number of digits is gained per step. Newton''s method converges this way at a multiple root.'
  topic: Convergence of Newton's method
- term: multiple root
  aliases: [multiple roots, repeated root, repeated roots, double root, double roots, multiplicity]
  definition: 'A root $r$ where $f$ has a factor $(x - r)^m$ with $m \ge 2$ (its multiplicity); the graph touches or flattens at the axis and $f''(r) = 0$. Newton''s method slows to $e_{n+1} \approx \frac{m - 1}{m}e_n$ there.'
  topic: Convergence of Newton's method
- term: secant method
  definition: 'A root-finding method that replaces the tangent line in Newton''s method by the secant line through the last two guesses: $x_{n+1} = x_n - f(x_n)\dfrac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}$. It needs no derivative; near a simple root its order is about 1.618.'
  topic: Convergence of Newton's method
- term: Cauchy's mean value theorem
  aliases: [Cauchy mean value theorem, generalized mean value theorem, extended mean value theorem]
  definition: 'If $f$ and $g$ are continuous on $[a, b]$, differentiable on $(a, b)$, and $g''(x) \ne 0$ there, then $\dfrac{f(b) - f(a)}{g(b) - g(a)} = \dfrac{f''(c)}{g''(c)}$ for some $c$ in $(a, b)$. It is the key step in proving L''Hôpital''s rule.'
  topic: Cauchy's mean value theorem
- term: little-o notation
  aliases: [little-o, little o]
  definition: '$f = o(g)$ as $x \to \infty$ means $\dfrac{f(x)}{g(x)} \to 0$: $f$ grows more slowly than $g$. Example: $\ln x = o(\sqrt x)$.'
  topic: Orders of growth
- term: asymptotically equivalent
  aliases: [asymptotic equivalence]
  definition: '$f \sim g$ as $x \to \infty$ means $\dfrac{f(x)}{g(x)} \to 1$. It is a statement about the ratio, not the difference: $x^2 + x \sim x^2$ although the difference grows without bound.'
  topic: Orders of growth
