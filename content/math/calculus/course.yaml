id: math-calculus
title: Calculus
description: >-
  Single-variable calculus from the first limit through Calculus II, layered AP Calculus AB,
  then BC, then college Calculus I and II: limits and continuity, the derivative and its
  rules, related rates, optimization and curve sketching, integrals and the Fundamental
  Theorem, applications of integration, techniques of integration, improper integrals,
  hyperbolic functions, introductory differential equations (separable and first-order linear),
  sequences and series, Taylor series, and calculus
  with parametric and polar curves.
revision: 6
released: true
changelog: Honors lessons for every module, pictures and diagrams in every lesson, and new question types (fill in the blank, matching, labeling, ordering); corrections from a second full review of every lesson, question and drill; clearer graphs; answers shown at the precision each problem asks for. Fixes pictures that didn't show.
