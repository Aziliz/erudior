# Round 2 cards, module calc-m1 (honors lessons 05h1 and 05h2)
- {front: 'Precise definition of $\lim_{x\to a} f(x) = \infty$', back: 'For every $M > 0$ there is a $\delta > 0$ such that $0 < |x - a| < \delta \Rightarrow f(x) > M$.', topic: Precise limit definitions}
- {front: 'Precise definition of $\lim_{x\to\infty} f(x) = L$', back: 'For every $\varepsilon > 0$ there is an $N$ such that $x > N \Rightarrow |f(x) - L| < \varepsilon$.', topic: Precise limit definitions}
- {front: 'Precise definition of $\lim_{x\to a^+} f(x) = L$', back: 'For every $\varepsilon > 0$ there is a $\delta > 0$ such that $a < x < a + \delta \Rightarrow |f(x) - L| < \varepsilon$.', topic: Precise limit definitions}
- {front: 'Largest $\delta$ that makes $\dfrac{1}{(x - a)^2} > M$', back: '$\delta = \dfrac{1}{\sqrt M}$: then $(x - a)^2 < \dfrac1M$.', topic: Precise limit definitions}
- {front: Triangle inequality, back: '$|u + v| \le |u| + |v|$ for all real $u, v$.', topic: Precise limit definitions}
- {front: 'Two moves in the proof of the sum law', back: 'Ask each function for error $\varepsilon/2$; take $\delta = \min(\delta_1, \delta_2)$ so both hold at once.', topic: Precise limit definitions}
- {front: 'Identity behind the product law', back: '$f g - LK = f\,(g - K) + K\,(f - L)$', topic: Precise limit definitions}
- {front: 'Negation of "$\lim_{x\to a} f(x) = L$"', back: 'There is an $\varepsilon > 0$ such that for every $\delta > 0$ some $x$ with $0 < |x - a| < \delta$ has $|f(x) - L| \ge \varepsilon$.', topic: Precise limit definitions}
- {front: 'How to prove a limit does not exist', back: 'Find two kinds of inputs in every window around $a$ whose outputs stay a distance $d$ apart; take $\varepsilon = d/2$; the triangle inequality defeats every candidate $L$.', topic: Precise limit definitions}
- {front: 'Inputs that show $\sin(1/x)$ has no limit at 0', back: '$x = \dfrac{1}{\pi/2 + 2\pi n}$ gives 1 and $x = \dfrac{1}{3\pi/2 + 2\pi n}$ gives $-1$; both kinds occur in every window around 0.', topic: Precise limit definitions}
- {front: 'Bisection: bracket length after $n$ steps on $[a, b]$', back: '$\dfrac{b - a}{2^n}$; the midpoint is within $\dfrac{b - a}{2^{n+1}}$ of a root.', topic: IVT applications}
- {front: 'Bisection steps for a bracket of length at most $t$', back: 'The smallest whole $n$ with $2^n \ge \dfrac{b - a}{t}$, that is, $\log_2\frac{b - a}{t}$ rounded up.', topic: IVT applications}
- {front: 'Rule of thumb for bisection speed', back: '$2^{10} \approx 10^3$: about 10 steps for every 3 decimal places.', topic: IVT applications}
- {front: Fixed point, back: 'A number $c$ with $f(c) = c$, where the graph of $f$ meets $y = x$.', topic: IVT applications}
- {front: 'Fixed-point theorem (one dimension)', back: 'If $f$ is continuous on $[a, b]$ and maps $[a, b]$ into itself, then $f(c) = c$ for some $c$ in $[a, b]$. Apply the IVT to $g(x) = f(x) - x$.', topic: IVT applications}
- {front: 'Solution of $\cos x = x$ (radians)', back: 'Exactly one, $x \approx 0.739085$, in $[0, 1]$.', topic: IVT applications}
- {front: 'Why every odd-degree polynomial has a real root', back: 'Its ends go to $-\infty$ and $+\infty$ (opposite signs), so the IVT gives a zero between.', topic: IVT applications}
- {front: 'Two-day hike: same spot at the same time?', back: 'Yes. Apply the IVT to $u(t) - d(t)$, the difference of the two days'' positions: it goes from negative to positive.', topic: IVT applications}
- {front: Universal chord theorem, back: 'If $f$ is continuous on $[a, b]$ with $f(a) = f(b)$, horizontal chords of length $(b - a)/n$ exist for every whole $n$; other lengths can fail.', topic: IVT applications}
- {front: Dirichlet function, back: '1 at rationals, 0 at irrationals: continuous nowhere, and never takes the value $\tfrac12$.', topic: IVT applications}
