# calc-m8 round 2: cards for the honors lessons 36h1 (reduction formulas), 36h2 (gamma function) and 36h3 (Richardson and Romberg)
- {front: 'Reduction formula for $\int x^ne^x\,dx$', back: '$\int x^ne^x\,dx = x^ne^x - n\int x^{n-1}e^x\,dx$ (one round of parts with $u = x^n$).', topic: Reduction formulas}
- {front: 'Reduction formula for $\int\sin^nx\,dx$', back: '$-\frac1n\sin^{n-1}x\cos x + \frac{n - 1}{n}\int\sin^{n-2}x\,dx$ (parts, then solve for the integral that comes back).', topic: Reduction formulas}
- {front: 'Reduction formula for $\int\tan^nx\,dx$', back: '$\frac{\tan^{n-1}x}{n - 1} - \int\tan^{n-2}x\,dx$, from $\tan^nx = \tan^{n-2}x(\sec^2x - 1)$.', topic: Reduction formulas}
- {front: 'Wallis integrals $W_n = \int_0^{\pi/2}\sin^nx\,dx$', back: '$W_n = \frac{n - 1}{n}W_{n-2}$, $W_0 = \frac\pi2$, $W_1 = 1$. Same values for $\cos^nx$.', topic: Reduction formulas}
- {front: '$W_{2k}$ and $W_{2k+1}$ in closed form', back: '$W_{2k} = \frac{1\cdot3\cdots(2k - 1)}{2\cdot4\cdots(2k)}\cdot\frac\pi2$; $W_{2k+1} = \frac{2\cdot4\cdots(2k)}{3\cdot5\cdots(2k + 1)}$.', topic: Reduction formulas}
- {front: '$\int_0^{\pi/2}\sin^5x\,dx$ and $\int_0^{\pi/2}\cos^6x\,dx$', back: '$\frac{8}{15}$ and $\frac{5\pi}{32}$.', topic: Reduction formulas}
- {front: 'Wallis product', back: '$\frac\pi2 = \frac21\cdot\frac23\cdot\frac43\cdot\frac45\cdot\frac65\cdot\frac67\cdots$ (from squeezing $W_{2k+1} \le W_{2k} \le W_{2k-1}$).', topic: Reduction formulas}
- {front: 'Running a recurrence like $J_n = e - nJ_{n-1}$', back: 'Forward, each step multiplies the error by $n$ (unstable); backward, $J_{n-1} = \frac{e - J_n}{n}$ divides it by $n$ (stable).', topic: Reduction formulas}
- {front: 'Gamma function', back: '$\Gamma(s) = \int_0^\infty x^{s-1}e^{-x}\,dx$, converging for $s > 0$.', topic: Gamma function}
- {front: 'Functional equation of $\Gamma$', back: '$\Gamma(s + 1) = s\,\Gamma(s)$ (by parts); with $\Gamma(1) = 1$ it gives $\Gamma(n + 1) = n!$.', topic: Gamma function}
- {front: '$\Gamma\left(\tfrac12\right)$, $\Gamma\left(\tfrac32\right)$, $\Gamma\left(\tfrac52\right)$', back: '$\sqrt\pi$, $\frac{\sqrt\pi}{2}$, $\frac{3\sqrt\pi}{4}$.', topic: Gamma function}
- {front: '$\int_0^\infty x^ne^{-ax}\,dx$ ($a > 0$)', back: '$\frac{n!}{a^{n+1}}$ (substitute $u = ax$).', topic: Gamma function}
- {front: '$\int_0^\infty x^me^{-x^2}\,dx$', back: '$\frac12\Gamma\left(\frac{m + 1}{2}\right)$ (substitute $u = x^2$).', topic: Gamma function}
- {front: 'Why $\Gamma(s)$ converges for $s > 0$', back: 'Near 0, $x^{s-1}e^{-x} \le x^{s-1}$, a p-integral with $p = 1 - s < 1$; near $\infty$, it is below $e^{-x/2}$.', topic: Gamma function}
- {front: 'Where $\Gamma$ is smallest on $(0, \infty)$', back: 'Near $s \approx 1.4616$, value about $0.8856$; $\Gamma(1) = \Gamma(2) = 1$, and $\Gamma(s) \to \infty$ as $s \to 0^+$.', topic: Gamma function}
- {front: 'Stirling''s approximation', back: '$n! \approx \sqrt{2\pi n}\left(\frac ne\right)^n$; the relative error tends to 0 (about 0.8% at $n = 10$).', topic: Gamma function}
- {front: 'Euler–Maclaurin error of the trapezoidal rule', back: '$T(h) = I + \frac{h^2}{12}[f''(b) - f''(a)] - \frac{h^4}{720}[f''''''(b) - f''''''(a)] + \cdots$ (smooth $f$, asymptotic series).', topic: Richardson extrapolation}
- {front: 'Richardson step for an error $\approx ch^p$', back: '$\dfrac{2^pA(h/2) - A(h)}{2^p - 1}$; for the trapezoidal rule ($p = 2$), $\frac{4T_{2n} - T_n}{3}$.', topic: Richardson extrapolation}
- {front: '$\dfrac{4T_{2n} - T_n}{3}$', back: 'Exactly Simpson''s rule $S_{2n}$: Simpson is one Richardson step on the trapezoidal rule.', topic: Richardson extrapolation}
- {front: 'Romberg table rule', back: '$R_{k,0} = T_{2^k}$; $R_{k,j} = R_{k,j-1} + \frac{R_{k,j-1} - R_{k-1,j-1}}{4^j - 1}$.', topic: Richardson extrapolation}
- {front: 'When Romberg integration helps little', back: 'Rough integrands (like $\sqrt x$ at 0, where the error is not a series in $h^2$) and step sizes too large for the error model.', topic: Richardson extrapolation}
- {front: 'Trapezoidal rule for a smooth periodic function over a full period', back: 'Extremely accurate: every Euler–Maclaurin correction term is 0, so extrapolation has nothing left to cancel.', topic: Richardson extrapolation}
- {front: 'Error order of each Romberg column', back: 'Column 0 (trapezoid) $\propto h^2$, column 1 (Simpson) $\propto h^4$, column 2 $\propto h^6$: each column cancels one more even power of $h$.', topic: Richardson extrapolation}
- {front: 'Richardson step as a correction', back: '$T_{2n} + \frac{T_{2n} - T_n}{3}$: add a third of the change from $T_n$ to $T_{2n}$.', topic: Richardson extrapolation}
