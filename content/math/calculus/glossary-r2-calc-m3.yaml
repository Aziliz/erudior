# Round 2, module calc-m3: terms bolded in the honors lessons 13h1-13h3
- term: nth derivative
  aliases:
  - nth derivatives
  - n-th derivative
  definition: 'The result of differentiating $f$ $n$ times, written $f^{(n)}(x)$ or $\frac{d^ny}{dx^n}$; by convention $f^{(0)} = f$.'
  topic: Higher derivatives
- term: falling factorial
  aliases:
  - falling factorials
  definition: 'A product of $n$ factors, each one less than the last: $m(m - 1)(m - 2)\cdots(m - n + 1)$. It is the coefficient in $\frac{d^n}{dx^n}x^m$, and equals $m!$ when $n = m$.'
  topic: Higher derivatives
- term: mathematical induction
  aliases:
  - induction
  - proof by induction
  definition: 'A way to prove a statement for every whole number $n \ge 1$: prove it for $n = 1$, then show that whenever it holds for $n$ it also holds for $n + 1$.'
  topic: Higher derivatives
- term: Leibniz rule
  aliases:
  - Leibniz's rule
  - general Leibniz rule
  definition: 'The formula for the $n$th derivative of a product: $(fg)^{(n)} = \sum_{k=0}^{n}\binom nk f^{(n - k)}g^{(k)}$, with the same coefficients as $(a + b)^n$.'
  topic: Leibniz rule
- term: slope function
  aliases:
  - slope functions
  definition: 'For $f$ at a point $a$: a function $\varphi$, continuous at $a$, with $f(x) - f(a) = \varphi(x)(x - a)$. For $x \ne a$ it is the secant slope. $f$ is differentiable at $a$ exactly when one exists, and then $f''(a) = \varphi(a)$.'
  topic: Proofs of derivative rules
- term: partial derivative
  aliases:
  - partial derivatives
  definition: 'For an expression $F(x, y)$: $F_x$ is its derivative with respect to $x$ treating $y$ as a constant, and $F_y$ its derivative with respect to $y$ treating $x$ as a constant. On the curve $F(x, y) = 0$, $\frac{dy}{dx} = -\frac{F_x}{F_y}$.'
  topic: Implicit curves
- term: singular point
  aliases:
  - singular points
  definition: 'A point of the curve $F(x, y) = 0$ where $F_x = 0$ and $F_y = 0$ as well. The slope formula gives $\frac00$, and the curve may cross itself (a node) or form a sharp point (a cusp) there.'
  topic: Implicit curves
- term: orthogonal trajectories
  aliases:
  - orthogonal trajectory
  - orthogonal families
  definition: 'Two families of curves such that every curve of one family crosses every curve of the other at a right angle, so their slopes at each crossing point multiply to $-1$.'
  topic: Orthogonal trajectories
