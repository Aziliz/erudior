# calc-m6 round 2: terms introduced in the honors lessons 25h1 and 25h2
- term: elementary function
  aliases: [elementary functions, elementary antiderivative]
  definition: 'A function built from polynomials, roots, exponentials, logarithms, trig and inverse trig functions by arithmetic and composition. Derivatives of elementary functions are elementary; some antiderivatives, such as that of $e^{-x^2}$, are provably not.'
  topic: Functions defined by integrals
- term: error function
  aliases: [erf]
  definition: '$\operatorname{erf}(x) = \frac{2}{\sqrt\pi}\int_0^x e^{-t^2}\,dt$, a nonelementary function defined by an integral. It is odd and increasing, and tends to 1 as $x\to\infty$.'
  topic: Functions defined by integrals
- term: sine integral
  aliases: [Si]
  definition: '$\operatorname{Si}(x) = \int_0^x \frac{\sin t}{t}\,dt$ (integrand taken as 1 at $t = 0$). It is odd, has local maxima at odd multiples of $\pi$ and minima at even multiples, and tends to $\frac\pi2$ as $x\to\infty$.'
  topic: Functions defined by integrals
- term: integral equation
  aliases: [integral equations]
  definition: 'An equation with an unknown function inside an integral, such as $f(x) = 3 + 2\int_0^x f(t)\,dt$. Differentiating (FTC 1) and setting $x$ to the lower limit turn it into an initial value problem.'
  topic: Functions defined by integrals
- term: harmonic number
  aliases: [harmonic numbers]
  definition: '$H_n = 1 + \frac12 + \frac13 + \cdots + \frac1n$. Comparing with $\int\frac{dx}{x}$ gives $\ln(n + 1) \le H_n \le 1 + \ln n$.'
  topic: Sums and integrals
