# calc-m7 round 2: cards for the honors lessons 30h1 (centroids and Pappus) and 30h2 (probability densities)
- {front: 'Moments of the region between $g$ (below) and $f$ (above)', back: '$M_y = \int_a^b x(f - g)\,dx$, $M_x = \int_a^b \tfrac12(f^2 - g^2)\,dx$; $\bar x = M_y/A$, $\bar y = M_x/A$.', topic: Center of mass}
- {front: 'Why $M_x$ has $\tfrac12(f^2 - g^2)$', back: 'A strip of area $(f - g)\,dx$ has its midpoint at height $\tfrac12(f + g)$; the product is $\tfrac12(f^2 - g^2)\,dx$.', topic: Center of mass}
- {front: 'Centroid of the region between $y = x$ and $y = x^2$', back: '$\left(\tfrac12, \tfrac25\right)$, with area $\tfrac16$.', topic: Center of mass}
- {front: 'Centroid of a triangle', back: 'The average of its three vertices.', topic: Center of mass}
- {front: 'First theorem of Pappus (volume)', back: '$V = 2\pi\bar r A$: area times the distance the region''s centroid travels. The axis must not cut through the region.', topic: Theorems of Pappus}
- {front: 'Proof idea of Pappus''s volume theorem', back: 'The shell integral $2\pi\int x(f - g)\,dx$ (or the washer integral) is exactly $2\pi$ times a moment, and a moment is $\bar r A$.', topic: Theorems of Pappus}
- {front: 'Second theorem of Pappus (surface area)', back: '$S = 2\pi\bar r L$: length of the curve times the distance the curve''s centroid travels.', topic: Theorems of Pappus}
- {front: 'Torus with tube radius $r$ and center distance $R$', back: '$V = 2\pi^2Rr^2$, $S = 4\pi^2Rr$.', topic: Theorems of Pappus}
- {front: 'Centroid of a half-disk of radius $r$', back: '$\frac{4r}{3\pi} \approx 0.42r$ from the diameter (from the sphere''s volume by Pappus).', topic: Theorems of Pappus}
- {front: 'Centroid of a semicircular arc of radius $r$', back: '$\frac{2r}{\pi} \approx 0.64r$ from the diameter (from the sphere''s surface area by Pappus).', topic: Theorems of Pappus}
- {front: 'When does Pappus fail?', back: 'When the axis passes through the region''s interior: parts on both sides sweep the same space.', topic: Theorems of Pappus}
- {front: 'Conditions for a probability density $f$', back: '$f(x) \ge 0$ everywhere and $\int_{-\infty}^{\infty}f(x)\,dx = 1$.', topic: Probability density functions}
- {front: '$P(a \le X \le b)$ for a density $f$', back: '$\int_a^b f(x)\,dx = F(b) - F(a)$.', topic: Probability density functions}
- {front: '$P(X = c)$ for a continuous random variable', back: '0. Only intervals have positive probability; $f(c)$ is a density and can exceed 1.', topic: Probability density functions}
- {front: 'CDF and density', back: '$F(x) = \int_{-\infty}^x f(t)\,dt$, so $F''(x) = f(x)$ where $f$ is continuous.', topic: Probability density functions}
- {front: 'Mean of a density', back: '$\mu = \int x\,f(x)\,dx$: the centroid''s $x$-coordinate of the region under $f$ (area 1).', topic: Probability density functions}
- {front: 'Median of a density', back: 'The $m$ with $F(m) = \tfrac12$.', topic: Probability density functions}
- {front: 'Variance shortcut', back: '$\sigma^2 = \int x^2f(x)\,dx - \mu^2$.', topic: Probability density functions}
- {front: 'Exponential distribution with rate $\lambda$', back: '$f = \lambda e^{-\lambda x}$ ($x \ge 0$), $P(X > x) = e^{-\lambda x}$, mean $\frac1\lambda$, median $\frac{\ln2}{\lambda}$.', topic: Probability density functions}
- {front: 'Uniform distribution on $[a, b]$', back: '$f = \frac{1}{b - a}$ on $[a, b]$; mean $\frac{a + b}{2}$.', topic: Probability density functions}
