# Round 2, module calc-m3: notecards for the honors lessons 13h1-13h3
# 13h1 Higher derivatives and Leibniz's rule
- front: '$\dfrac{d^n}{dx^n}e^{ax}$'
  back: '$a^ne^{ax}$'
  topic: Higher derivatives
- front: '$\dfrac{d^n}{dx^n}\sin(ax + b)$'
  back: '$a^n\sin\left(ax + b + \frac{n\pi}{2}\right)$: each derivative multiplies by $a$ and shifts the angle a quarter turn.'
  topic: Higher derivatives
- front: '$\dfrac{d^n}{dx^n}\dfrac{1}{x - c}$'
  back: '$\dfrac{(-1)^n\,n!}{(x - c)^{n + 1}}$'
  topic: Higher derivatives
- front: '$\dfrac{d^n}{dx^n}\ln x$ ($n \ge 1$)'
  back: '$\dfrac{(-1)^{n - 1}(n - 1)!}{x^n}$ (note $(n - 1)!$, not $n!$)'
  topic: Higher derivatives
- front: '$\dfrac{d^n}{dx^n}x^m$'
  back: 'The falling factorial $m(m - 1)\cdots(m - n + 1)$ times $x^{m - n}$. For whole $m$: $m!$ when $n = m$, and 0 when $n > m$.'
  topic: Higher derivatives
- front: Leibniz's rule
  back: '$(fg)^{(n)} = \sum_{k=0}^{n}\binom nk f^{(n - k)}g^{(k)}$, with the coefficients of $(a + b)^n$.'
  topic: Leibniz rule
- front: '$(fg)''''$ and $(fg)''''''$'
  back: '$f''''g + 2f''g'' + fg''''$ and $f''''''g + 3f''''g'' + 3f''g'''' + fg''''''$'
  topic: Leibniz rule
- front: When is Leibniz's rule quick?
  back: 'When one factor is a polynomial of degree $m$: at most $m + 1$ terms survive, and at $x = 0$ often only one.'
  topic: Leibniz rule
- front: Second derivative of $f(g(x))$
  back: '$f''''(g(x))\,[g''(x)]^2 + f''(g(x))\,g''''(x)$'
  topic: Higher derivatives
- front: Proving an $n$th-derivative pattern
  back: 'Induction: check $n = 1$, then show that differentiating the formula for $n$ gives the formula for $n + 1$.'
  topic: Higher derivatives
# 13h2 Proofs
- front: Differentiability via a slope function
  back: '$f$ is differentiable at $a$ exactly when $f(x) - f(a) = \varphi(x)(x - a)$ with $\varphi$ continuous at $a$; then $f''(a) = \varphi(a)$.'
  topic: Proofs of derivative rules
- front: The gap in the short chain rule proof
  back: 'It divides by $\Delta u = g(x + h) - g(x)$, which can be 0 for infinitely many small $h$ (e.g. $x^2\sin\frac1x$ near 0).'
  topic: Proofs of derivative rules
- front: Slope-function proof of the chain rule
  back: '$f(g(x)) - f(g(a)) = \varphi(g(x))\,\psi(x)\,(x - a)$, and $\varphi(g(x))\psi(x)$ is continuous at $a$, with value $f''(g(a))g''(a)$.'
  topic: Proofs of derivative rules
- front: Hypotheses of the inverse function derivative rule
  back: '$f$ continuous and strictly monotonic on an open interval, $f''(a) \ne 0$. Then $(f^{-1})''(f(a)) = \frac{1}{f''(a)}$.'
  topic: Inverse function derivatives
- front: Why $f'(a) \ne 0$ is needed for $(f^{-1})'$
  back: 'If $f''(a) = 0$, the inverse has a vertical tangent at $f(a)$: $x^3$ and $\sqrt[3]x$ at 0.'
  topic: Inverse function derivatives
- front: Power rule for a real exponent $r$
  back: '$x^r = e^{r\ln x}$ ($x > 0$), so $(x^r)'' = x^r\cdot\frac rx = rx^{r - 1}$.'
  topic: Proofs of derivative rules
- front: '$e$ as a limit'
  back: '$\left(1 + \frac1n\right)^n \to e$ and $\left(1 + \frac rn\right)^n \to e^r$, because $\frac{\ln(1 + h)}{h} \to \ln''(1) = 1$.'
  topic: Proofs of derivative rules
- front: Is $1^\infty$ equal to 1?
  back: 'No, it is an indeterminate form: $\left(1 + \frac1n\right)^n \to e$. Take logs first.'
  topic: Proofs of derivative rules
# 13h3 Implicit curves
- front: Slope of $F(x, y) = 0$
  back: '$\dfrac{dy}{dx} = -\dfrac{F_x}{F_y}$, with $F_x$, $F_y$ the partial derivatives.'
  topic: Implicit curves
- front: Horizontal tangent of $F(x, y) = 0$
  back: '$F = 0$, $F_x = 0$, $F_y \ne 0$. Solve the first two together.'
  topic: Implicit curves
- front: Vertical tangent of $F(x, y) = 0$
  back: '$F = 0$, $F_y = 0$, $F_x \ne 0$.'
  topic: Implicit curves
- front: Singular point
  back: '$F = F_x = F_y = 0$. The curve may cross itself (a node, like the folium at the origin) or form a cusp (like $y^2 = x^3$).'
  topic: Implicit curves
- front: 'Folium $x^3 + y^3 = 6xy$: key points'
  back: 'Node at the origin; horizontal tangent at $(2\sqrt[3]2, 2\sqrt[3]4)$; vertical tangent at $(2\sqrt[3]4, 2\sqrt[3]2)$; asymptote $x + y = -2$.'
  topic: Implicit curves
- front: Testing two families for orthogonality
  back: 'Write each slope in terms of $(x, y)$ only (eliminate the parameter), then check that the product is $-1$.'
  topic: Orthogonal trajectories
- front: Orthogonal pairs to remember
  back: 'Circles $x^2 + y^2 = r^2$ and lines $y = kx$; hyperbolas $x^2 - y^2 = c$ and $xy = k$; parabolas $y = kx^2$ and ellipses $x^2 + 2y^2 = C$.'
  topic: Orthogonal trajectories
- front: Where orthogonal families appear
  back: Electric field lines and equipotentials, heat-flow lines and isotherms, streamlines and potential lines in idealized flow, contour lines and steepest-descent paths.
  topic: Orthogonal trajectories
