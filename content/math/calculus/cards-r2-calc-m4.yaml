# Round 2 cards for calc-m4 honors lessons
- {front: 'Error bound for a linear approximation', back: 'If $|f''''| \le M$ between $a$ and $x$, then $|f(x) - L(x)| \le \frac M2(x - a)^2$.', topic: Approximation error}
- {front: 'How does the tangent-line error scale with distance?', back: 'Like $(x - a)^2$: halve the distance and the error drops to about a quarter.', topic: Approximation error}
- {front: 'Choosing $M$ in the error bound', back: 'The largest value of $|f''''|$ on the whole interval between $a$ and $x$, not just at $a$. A larger $M$ is still valid, just looser.', topic: Approximation error}
- {front: 'The error $E(x) = f(x) - L(x)$ at $x = a$', back: '$E(a) = 0$, $E''(a) = 0$, and $E'''' = f''''$: it starts at zero with zero slope.', topic: Approximation error}
- {front: 'Newton''s method error near a simple root', back: '$e_{n+1} \approx \dfrac{f''''(r)}{2f''(r)}e_n^2$ (quadratic convergence: digits roughly double).', topic: Convergence of Newton's method}
- {front: 'Newton''s method at a root of multiplicity $m$', back: 'Linear convergence: $e_{n+1} \approx \frac{m - 1}{m}e_n$ (a double root halves the error each step).', topic: Convergence of Newton's method}
- {front: 'Fixing Newton''s method at a root of known multiplicity $m$', back: 'Use $x_{n+1} = x_n - m\dfrac{f(x_n)}{f''(x_n)}$; quadratic convergence returns.', topic: Convergence of Newton's method}
- {front: 'A Newton cycle', back: 'For $x^3 - 2x + 2$ from $x_0 = 0$: $x_1 = 1$, $x_2 = 0$, and so on forever.', topic: Convergence of Newton's method}
- {front: 'Newton''s method on $x^{1/3}$', back: '$x_{n+1} = -2x_n$: every step doubles the distance from the root (vertical tangent at the root).', topic: Convergence of Newton's method}
- {front: 'Secant method formula', back: '$x_{n+1} = x_n - f(x_n)\dfrac{x_n - x_{n-1}}{f(x_n) - f(x_{n-1})}$; no derivative needed, order about 1.618.', topic: Convergence of Newton's method}
- {front: 'Cauchy''s mean value theorem', back: '$\dfrac{f(b) - f(a)}{g(b) - g(a)} = \dfrac{f''(c)}{g''(c)}$ for some $c$ in $(a, b)$, if $f, g$ are continuous on $[a, b]$, differentiable on $(a, b)$, and $g'' \ne 0$ there.', topic: Cauchy's mean value theorem}
- {front: 'Auxiliary function in the proof of Cauchy''s MVT', back: '$h(x) = [f(b) - f(a)]g(x) - [g(b) - g(a)]f(x)$, which has $h(a) = h(b)$; then apply Rolle''s theorem.', topic: Cauchy's mean value theorem}
- {front: 'Geometric meaning of Cauchy''s MVT', back: 'The path $(g(t), f(t))$ has a tangent parallel to the chord joining its endpoints.', topic: Cauchy's mean value theorem}
- {front: 'Proof of L''Hôpital''s rule (0/0 as x → a⁺) in one line', back: 'Set $f(a) = g(a) = 0$; Cauchy on $[a, x]$ gives $\frac{f(x)}{g(x)} = \frac{f''(c_x)}{g''(c_x)}$ with $a < c_x < x$; let $x \to a^+$.', topic: Cauchy's mean value theorem}
- {front: 'Stolz''s example', back: '$f = x + \sin x\cos x$, $g = e^{\sin x}f$: $\frac{f''}{g''} \to 0$ after cancelling $\cos x$, but $\frac fg = e^{-\sin x}$ has no limit, because $g''$ keeps hitting 0.', topic: Cauchy's mean value theorem}
- {front: '$f = o(g)$', back: '$\dfrac{f}{g} \to 0$: $f$ grows more slowly than $g$.', topic: Orders of growth}
- {front: '$f \sim g$', back: '$\dfrac{f}{g} \to 1$ (ratio, not difference).', topic: Orders of growth}
- {front: 'The growth ladder as x → ∞', back: '$(\ln x)^q \ll x^p \ll b^x \ll x^x$ for $p, q > 0$, $b > 1$.', topic: Orders of growth}
- {front: 'When does $x^{0.01}$ pass $(\ln x)^5$?', back: 'Only beyond about $x = 10^{1810}$: asymptotic rankings can take a very long time to show.', topic: Orders of growth}
