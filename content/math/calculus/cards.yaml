- front: Informal meaning of $\lim_{x\to a}f(x) = L$
  back: $f(x)$ gets as close to $L$ as we like when $x$ is close enough to $a$ (with $x \ne a$). The value $f(a)$ doesn't matter.
  topic: Limits
- front: When does a two-sided limit exist?
  back: Exactly when both one-sided limits exist and are equal.
  topic: Limits
- front: Three ways a limit can fail to exist
  back: A jump (one-sided limits differ), unbounded growth (vertical asymptote), or oscillation.
  topic: Limits
- front: Does $f(a)$ affect $\lim_{x\to a}f(x)$?
  back: No. Limits only use inputs near $a$, never $a$ itself.
  topic: Limits
- front: Substituting gives $\frac00$. What does that mean?
  back: 'An indeterminate form: the limit could be anything. Rewrite (factor, conjugate, combine fractions, expand) and try again.'
  topic: Limits
- front: $\lim_{x\to0}\frac{\sin x}{x}$ in degrees
  back: $\frac{\pi}{180} \approx 0.01745$. The limit is 1 only in radians.
  topic: Limits
- front: Quotient law for limits
  back: $\lim\frac fg = \frac{\lim f}{\lim g}$, provided $\lim g \ne 0$.
  topic: Limit laws
- front: Direct substitution property
  back: If $f$ is continuous at $a$ (polynomials, rational functions in their domain, roots, exp, log, trig), then $\lim_{x\to a}f(x) = f(a)$.
  topic: Limit laws
- front: Why can you cancel $(x - a)$ in a limit as $x \to a$?
  back: Because the limit never uses $x = a$, and the two expressions agree for every $x \ne a$.
  topic: Limit laws
- front: Limit technique for $\frac00$ with a square root
  back: Multiply top and bottom by the conjugate.
  topic: Algebraic limits
- front: $\lim_{x\to a}\dfrac{x^2 - a^2}{x - a}$
  back: $2a$ (factor and cancel).
  topic: Algebraic limits
- front: $\lim_{x\to 0}\dfrac{\sqrt{x + c^2} - c}{x}$ ($c > 0$)
  back: $\dfrac{1}{2c}$ (conjugate).
  topic: Algebraic limits
- front: $\lim_{x\to a}\dfrac{|x - a|}{x - a}$
  back: 'Does not exist: $-1$ from the left, $1$ from the right.'
  topic: Algebraic limits
- front: Signal for an infinite limit after substitution
  back: (nonzero)/0. Check the sign on each side.
  topic: Infinite limits
- front: Does every zero denominator give a vertical asymptote?
  back: No. If the factor cancels with the numerator, it's a hole (removable discontinuity).
  topic: Infinite limits
- front: $\lim_{x\to0^+}\ln x$
  back: $-\infty$
  topic: Infinite limits
- front: 'Rational function at $\pm\infty$: degree top < degree bottom'
  back: Limit 0; horizontal asymptote $y = 0$.
  topic: Limits at infinity
- front: 'Rational function at $\pm\infty$: equal degrees'
  back: Limit = ratio of leading coefficients.
  topic: Limits at infinity
- front: 'Rational function at $\pm\infty$: degree top = degree bottom + 1'
  back: No horizontal asymptote; a slant asymptote from long division.
  topic: Limits at infinity
- front: $\sqrt{x^2}$ when $x \to -\infty$
  back: $|x| = -x$. Watch the sign when dividing by $x$.
  topic: Limits at infinity
- front: $\lim_{x\to\infty}\arctan x$
  back: $\frac{\pi}{2}$
  topic: Limits at infinity
- front: Growth ranking as $x\to\infty$
  back: $\ln x \ll x^p \ll e^x$ for any $p > 0$.
  topic: Limits at infinity
- front: Technique for $\infty - \infty$ with roots
  back: Multiply by the conjugate over itself, then divide by the highest power.
  topic: Limits at infinity
- front: Squeeze theorem
  back: If $g \le f \le h$ near $a$ and $g, h \to L$, then $f \to L$.
  topic: Squeeze theorem
- front: $\lim_{\theta\to0}\dfrac{\sin\theta}{\theta}$
  back: $1$ ($\theta$ in radians).
  topic: Squeeze theorem
- front: $\lim_{\theta\to0}\dfrac{1 - \cos\theta}{\theta}$
  back: $0$
  topic: Squeeze theorem
- front: $\lim_{x\to0}\dfrac{\sin ax}{bx}$
  back: $\dfrac ab$
  topic: Squeeze theorem
- front: $\lim_{x\to0}x^2\sin(1/x)$
  back: $0$, by squeezing between $-x^2$ and $x^2$.
  topic: Squeeze theorem
- front: ε-δ definition of $\lim_{x\to a}f(x) = L$
  back: For every $\varepsilon > 0$ there is a $\delta > 0$ with $0 < |x - a| < \delta \Rightarrow |f(x) - L| < \varepsilon$.
  topic: Formal limit definition
- front: ε-δ for $f(x) = mx + b$
  back: $\delta = \varepsilon/|m|$ works.
  topic: Formal limit definition
- front: Three conditions for continuity at $a$
  back: $f(a)$ defined; $\lim_{x\to a}f(x)$ exists; the two are equal.
  topic: Continuity
- front: Removable vs jump vs infinite discontinuity
  back: 'Removable: limit exists, value missing/wrong (hole). Jump: one-sided limits differ. Infinite: a one-sided limit is $\pm\infty$.'
  topic: Continuity
- front: Making a piecewise function continuous at $x = c$
  back: Set the left piece's value at $c$ equal to the right piece's value at $c$.
  topic: Continuity
- front: Intermediate Value Theorem
  back: If $f$ is continuous on $[a, b]$ and $N$ is strictly between $f(a)$ and $f(b)$, then $f(c) = N$ for some $c$ in $(a, b)$.
  topic: Intermediate Value Theorem
- front: Using the IVT to locate a root
  back: Show $f$ is continuous on $[a, b]$ and $f(a)$, $f(b)$ have opposite signs.
  topic: Intermediate Value Theorem
- front: Does the IVT tell you how many roots there are?
  back: No, only that there's at least one.
  topic: Intermediate Value Theorem
- front: Limit definition of $f'(a)$
  back: $\displaystyle\lim_{h\to0}\frac{f(a + h) - f(a)}{h}$, or $\displaystyle\lim_{x\to a}\frac{f(x) - f(a)}{x - a}$.
  topic: Definition of the derivative
- front: Average rate of change on $[a, b]$
  back: $\dfrac{f(b) - f(a)}{b - a}$, the slope of the secant line.
  topic: Definition of the derivative
- front: Units of $f'(x)$
  back: Units of $f$ per unit of $x$.
  topic: Definition of the derivative
- front: Symmetric difference quotient
  back: $f'(a) \approx \dfrac{f(a + h) - f(a - h)}{2h}$
  topic: Definition of the derivative
- front: Interpret $C'(200) = 85$ ($C$ = cost in dollars, $q$ = items)
  back: At 200 items, cost is increasing at about 85 dollars per additional item.
  topic: Definition of the derivative
- front: Equation of the tangent line at $x = a$
  back: $y = f(a) + f'(a)(x - a)$
  topic: Tangent lines
- front: Slope of the normal line at $x = a$
  back: $-\dfrac{1}{f'(a)}$
  topic: Tangent lines
- front: Where $f'$ is positive, $f$ is…
  back: increasing (graph of $f'$ above the axis).
  topic: The derivative function
- front: Where $f$ has a horizontal tangent, $f'$ is…
  back: zero.
  topic: The derivative function
- front: $\frac{d}{dx}\frac1x$ from the definition
  back: $-\dfrac{1}{x^2}$
  topic: The derivative function
- front: Does differentiable imply continuous?
  back: 'Yes. (Continuous does not imply differentiable: $|x|$ at 0.)'
  topic: Differentiability
- front: Three ways a function can fail to be differentiable at a point
  back: A corner or cusp, a vertical tangent, or a discontinuity.
  topic: Differentiability
- front: Differentiability of a piecewise function at the seam
  back: The pieces must meet (continuity) and their slopes must match.
  topic: Differentiability
- front: Power rule
  back: $\dfrac{d}{dx}x^n = nx^{n-1}$ for any real $n$.
  topic: Power rule
- front: $\dfrac{d}{dx}\sqrt x$
  back: $\dfrac{1}{2\sqrt x}$
  topic: Power rule
- front: $\dfrac{d}{dx}\dfrac{1}{x^n}$
  back: $-\dfrac{n}{x^{n+1}}$
  topic: Power rule
- front: $\dfrac{d}{dx}e^x$
  back: $e^x$
  topic: Power rule
- front: $\dfrac{d}{dx}c$ (constant)
  back: $0$
  topic: Power rule
- front: Position, velocity, acceleration
  back: $v = s'$, $a = v' = s''$.
  topic: Higher derivatives
- front: $(n+1)$st derivative of a degree-$n$ polynomial
  back: $0$
  topic: Higher derivatives
- front: Product rule
  back: $(fg)' = f'g + fg'$
  topic: Product rule
- front: Product rule, three factors
  back: $(fgh)' = f'gh + fg'h + fgh'$
  topic: Product rule
- front: Quotient rule
  back: $\left(\dfrac fg\right)' = \dfrac{f'g - fg'}{g^2}$ (lo d-hi minus hi d-lo, over lo squared).
  topic: Quotient rule
- front: When to avoid the quotient rule
  back: Constant denominator (just a constant multiple) or monomial denominator (split the fraction first).
  topic: Quotient rule
- front: $\dfrac{d}{dx}\sin x$, $\dfrac{d}{dx}\cos x$
  back: $\cos x$, $-\sin x$
  topic: Trig derivatives
- front: $\dfrac{d}{dx}\tan x$, $\dfrac{d}{dx}\cot x$
  back: $\sec^2 x$, $-\csc^2 x$
  topic: Trig derivatives
- front: $\dfrac{d}{dx}\sec x$, $\dfrac{d}{dx}\csc x$
  back: $\sec x\tan x$, $-\csc x\cot x$
  topic: Trig derivatives
- front: Period of the derivative cycle of $\sin x$
  back: '4: $\sin \to \cos \to -\sin \to -\cos \to \sin$.'
  topic: Trig derivatives
- front: Chain rule
  back: $\dfrac{d}{dx}f(g(x)) = f'(g(x))\,g'(x)$
  topic: Chain rule
- front: General power rule
  back: $\dfrac{d}{dx}u^n = nu^{n-1}u'$
  topic: Chain rule
- front: $\dfrac{d}{dx}f(ax + b)$
  back: $af'(ax + b)$
  topic: Chain rule
- front: $\dfrac{d}{dx}e^{u}$
  back: $e^{u}u'$
  topic: Chain rule
- front: $\dfrac{d}{dx}\sin^2x$ vs $\dfrac{d}{dx}\sin(x^2)$
  back: $2\sin x\cos x$ vs $2x\cos(x^2)$
  topic: Chain rule
- front: '$h = f\circ g$: what is $h''(a)$?'
  back: $f'(g(a))\,g'(a)$. Evaluate $f'$ at $g(a)$, not at $a$.
  topic: Chain rule
- front: 'Implicit differentiation: key step'
  back: Differentiate both sides in $x$; every $y$ term gets a factor $\frac{dy}{dx}$; solve for $\frac{dy}{dx}$.
  topic: Implicit differentiation
- front: $\frac{dy}{dx}$ for $x^2 + y^2 = r^2$
  back: $-\dfrac xy$
  topic: Implicit differentiation
- front: $\frac{d}{dx}(xy)$
  back: $y + x\frac{dy}{dx}$ (product rule).
  topic: Implicit differentiation
- front: Horizontal/vertical tangents from $\frac{dy}{dx} = \frac NM$
  back: Horizontal where $N = 0$ ($M \ne 0$); vertical where $M = 0$ ($N \ne 0$).
  topic: Implicit differentiation
- front: $\dfrac{d}{dx}\arcsin x$
  back: $\dfrac{1}{\sqrt{1 - x^2}}$
  topic: Inverse trig derivatives
- front: $\dfrac{d}{dx}\arccos x$
  back: $-\dfrac{1}{\sqrt{1 - x^2}}$
  topic: Inverse trig derivatives
- front: $\dfrac{d}{dx}\arctan x$
  back: $\dfrac{1}{1 + x^2}$
  topic: Inverse trig derivatives
- front: $\dfrac{d}{dx}\text{arcsec}\, x$
  back: $\dfrac{1}{|x|\sqrt{x^2 - 1}}$
  topic: Inverse trig derivatives
- front: $\dfrac{d}{dx}\ln x$ and $\dfrac{d}{dx}\ln|x|$
  back: Both $\dfrac1x$.
  topic: Exponential and log derivatives
- front: $\dfrac{d}{dx}\ln u$
  back: $\dfrac{u'}{u}$
  topic: Exponential and log derivatives
- front: $\dfrac{d}{dx}b^x$
  back: $b^x\ln b$
  topic: Exponential and log derivatives
- front: $\dfrac{d}{dx}\log_b x$
  back: $\dfrac{1}{x\ln b}$
  topic: Exponential and log derivatives
- front: Derivative of an inverse function
  back: $(f^{-1})'(b) = \dfrac{1}{f'(a)}$ where $f(a) = b$.
  topic: Exponential and log derivatives
- front: When to use logarithmic differentiation
  back: Variable base and variable exponent ($x^x$), or messy products/quotients/powers.
  topic: Logarithmic differentiation
- front: $\dfrac{d}{dx}x^x$
  back: $x^x(\ln x + 1)$
  topic: Logarithmic differentiation
- front: 'Related rates: the cardinal rule'
  back: Differentiate first, then substitute the values at the instant.
  topic: Related rates
- front: Related rates steps
  back: Picture; knowns and unknown; equation; differentiate in $t$; substitute; interpret with units.
  topic: Related rates
- front: 'Cone with water: eliminating $r$'
  back: 'Use similar triangles: $\frac rh$ = (top radius)/(height).'
  topic: Related rates
- front: Sign of $\frac{dV}{dt}$ for a draining tank
  back: Negative.
  topic: Related rates
- front: Linearization of $f$ at $a$
  back: $L(x) = f(a) + f'(a)(x - a)$
  topic: Linearization
- front: 'Concave up: does $L$ over- or underestimate?'
  back: Underestimate (the curve is above its tangent lines).
  topic: Linearization
- front: Differential $dy$
  back: $dy = f'(x)\,dx$, approximating $\Delta y$.
  topic: Linearization
- front: Relative error in $V = s^3$ vs in $s$
  back: 'Three times as large: $\frac{dV}{V} = 3\frac{ds}{s}$.'
  topic: Linearization
- front: Common linearizations at 0
  back: $\sin x \approx x$, $e^x \approx 1 + x$, $\ln(1 + x) \approx x$, $(1 + x)^k \approx 1 + kx$.
  topic: Linearization
- front: Newton's method formula
  back: $x_{n+1} = x_n - \dfrac{f(x_n)}{f'(x_n)}$
  topic: Newton's method
- front: When does Newton's method fail?
  back: When $f'(x_n) = 0$ (horizontal tangent), or a bad start sends iterates elsewhere.
  topic: Newton's method
- front: L'Hôpital's rule
  back: 'For $\frac00$ or $\frac\infty\infty$: $\lim\frac fg = \lim\frac{f''}{g''}$ if the latter exists.'
  topic: L'Hôpital's rule
- front: Handling $0\cdot\infty$
  back: 'Rewrite as a quotient: $fg = \dfrac{f}{1/g}$.'
  topic: L'Hôpital's rule
- front: Handling $1^\infty$, $0^0$, $\infty^0$
  back: 'Take $\ln$: find $\lim\ln y = L$; the answer is $e^L$.'
  topic: L'Hôpital's rule
- front: $\lim_{x\to\infty}\left(1 + \frac ax\right)^x$
  back: $e^a$
  topic: L'Hôpital's rule
- front: $\lim_{x\to0^+}x\ln x$
  back: $0$
  topic: L'Hôpital's rule
- front: Extreme Value Theorem
  back: Continuous on a closed interval $[a, b]$ ⇒ absolute max and min exist.
  topic: Extreme values
- front: Critical number
  back: $c$ in the domain with $f'(c) = 0$ or $f'(c)$ undefined.
  topic: Extreme values
- front: Closed interval method
  back: Evaluate $f$ at critical numbers in $(a, b)$ and at $a$, $b$; the largest is the max, the smallest the min.
  topic: Extreme values
- front: Fermat's theorem
  back: Local extremum at interior $c$ with $f'(c)$ existing ⇒ $f'(c) = 0$.
  topic: Extreme values
- front: Is every critical number an extremum?
  back: 'No: $x^3$ at 0.'
  topic: Extreme values
- front: Mean Value Theorem
  back: $f$ continuous on $[a, b]$, differentiable on $(a, b)$ ⇒ $f'(c) = \frac{f(b) - f(a)}{b - a}$ for some $c$ in $(a, b)$.
  topic: Mean Value Theorem
- front: Rolle's theorem
  back: 'MVT with $f(a) = f(b)$: some $f''(c) = 0$.'
  topic: Mean Value Theorem
- front: 'MVT consequence: $f'' = g''$ on an interval'
  back: $f = g + C$.
  topic: Mean Value Theorem
- front: MVT $c$ for a quadratic on $[a, b]$
  back: The midpoint $\frac{a + b}{2}$.
  topic: Mean Value Theorem
- front: First derivative test
  back: '$f''$ from $+$ to $-$: local max. From $-$ to $+$: local min. No sign change: neither.'
  topic: First derivative test
- front: Increasing/decreasing test
  back: $f' > 0$ ⇒ increasing; $f' < 0$ ⇒ decreasing.
  topic: First derivative test
- front: Does a squared factor $(x - c)^2$ in $f'$ change sign at $c$?
  back: No.
  topic: First derivative test
- front: A maximum of the graph of $f'$ means what for $f$?
  back: '$f$ is steepest there: an inflection point of $f$, not an extremum.'
  topic: First derivative test
- front: Concavity test
  back: $f'' > 0$ ⇒ concave up; $f'' < 0$ ⇒ concave down.
  topic: Concavity
- front: Inflection point
  back: A point on the graph where concavity changes (check that $f''$ changes sign).
  topic: Concavity
- front: Second derivative test
  back: '$f''(c) = 0$: $f''''(c) > 0$ min; $f''''(c) < 0$ max; $f''''(c) = 0$ inconclusive.'
  topic: Concavity
- front: Does $x^4$ have an inflection point at 0?
  back: No; $f'' = 12x^2$ doesn't change sign.
  topic: Concavity
- front: Curve sketching checklist
  back: Domain, intercepts, symmetry, asymptotes, $f'$ sign chart, $f''$ sign chart, plot key points.
  topic: Curve sketching
- front: Decreasing and concave up looks like…
  back: Falling and leveling off (like $e^{-x}$).
  topic: Curve sketching
- front: Optimization steps
  back: Draw; objective formula; use constraint to get one variable; find domain; critical numbers; justify max/min; answer the question.
  topic: Optimization
- front: Fixed perimeter, maximum area rectangle
  back: A square.
  topic: Optimization
- front: Can with fixed volume, least surface area
  back: Height = diameter ($h = 2r$).
  topic: Optimization
- front: Minimizing a distance
  back: Minimize the distance squared (same minimizer, no square root).
  topic: Optimization
- front: Profit maximum (economics)
  back: 'Where marginal revenue equals marginal cost: $R''(q) = C''(q)$.'
  topic: Optimization
- front: All antiderivatives of $f$
  back: $F(x) + C$, where $F$ is any one antiderivative.
  topic: Antiderivatives
- front: $\displaystyle\int x^n\,dx$ ($n \ne -1$)
  back: $\dfrac{x^{n+1}}{n + 1} + C$
  topic: Antiderivatives
- front: $\displaystyle\int\frac1x\,dx$
  back: $\ln|x| + C$
  topic: Antiderivatives
- front: $\displaystyle\int\sin x\,dx$ and $\displaystyle\int\cos x\,dx$
  back: $-\cos x + C$ and $\sin x + C$
  topic: Antiderivatives
- front: $\displaystyle\int\sec^2x\,dx$
  back: $\tan x + C$
  topic: Antiderivatives
- front: $\displaystyle\int b^x\,dx$
  back: $\dfrac{b^x}{\ln b} + C$
  topic: Antiderivatives
- front: How many conditions does $f'' = g(x)$ need for a unique $f$?
  back: Two (one per constant).
  topic: Antiderivatives
- front: Free fall (ft, s)
  back: $a = -32$, $v = -32t + v_0$, $s = -16t^2 + v_0t + s_0$.
  topic: Antiderivatives
- front: $\Delta x$ for $n$ equal subintervals of $[a, b]$
  back: $\dfrac{b - a}{n}$
  topic: Riemann sums
- front: Left vs right sums for an increasing function
  back: Left underestimates, right overestimates.
  topic: Riemann sums
- front: $\sum_{i=1}^n i$ and $\sum_{i=1}^n i^2$
  back: $\dfrac{n(n + 1)}{2}$ and $\dfrac{n(n + 1)(2n + 1)}{6}$
  topic: Riemann sums
- front: $\lim\sum_{i=1}^n f\left(a + \frac{(b - a)i}{n}\right)\frac{b - a}{n}$
  back: $\displaystyle\int_a^b f(x)\,dx$
  topic: Riemann sums
- front: Definite integral as area
  back: 'Net signed area: area above the axis minus area below.'
  topic: Definite integral
- front: $\displaystyle\int_b^a f\,dx$
  back: $-\displaystyle\int_a^b f\,dx$
  topic: Definite integral
- front: $\displaystyle\int_a^b f + \int_b^c f$
  back: $\displaystyle\int_a^c f$
  topic: Definite integral
- front: If $m \le f \le M$ on $[a, b]$
  back: $m(b - a) \le \int_a^b f \le M(b - a)$
  topic: Definite integral
- front: $\displaystyle\int_{-r}^{r}\sqrt{r^2 - x^2}\,dx$
  back: $\dfrac{\pi r^2}{2}$ (half a disk).
  topic: Definite integral
- front: FTC Part 1
  back: $\dfrac{d}{dx}\displaystyle\int_a^x f(t)\,dt = f(x)$
  topic: Fundamental Theorem of Calculus
- front: FTC Part 1 with chain rule
  back: $\dfrac{d}{dx}\displaystyle\int_a^{u(x)}f(t)\,dt = f(u(x))\,u'(x)$
  topic: Fundamental Theorem of Calculus
- front: FTC Part 2
  back: $\displaystyle\int_a^b f(x)\,dx = F(b) - F(a)$ where $F' = f$.
  topic: Fundamental Theorem of Calculus
- front: Net change theorem
  back: $\displaystyle\int_a^b F'(x)\,dx = F(b) - F(a)$
  topic: Fundamental Theorem of Calculus
- front: 'For $g(x) = \int_a^x f(t)\,dt$: where is $g$ increasing? concave up?'
  back: Where $f > 0$; where $f$ is increasing.
  topic: Fundamental Theorem of Calculus
- front: $\dfrac{d}{dx}\displaystyle\int_x^b f(t)\,dt$
  back: $-f(x)$
  topic: Fundamental Theorem of Calculus
- front: Substitution rule
  back: $\int f(g(x))g'(x)\,dx = \int f(u)\,du$ with $u = g(x)$.
  topic: U-substitution
- front: Definite integrals with substitution
  back: Change the limits to $u$-values (and don't substitute back).
  topic: U-substitution
- front: $\displaystyle\int\frac{g'(x)}{g(x)}\,dx$
  back: $\ln|g(x)| + C$
  topic: U-substitution
- front: $\displaystyle\int\tan x\,dx$
  back: $-\ln|\cos x| + C = \ln|\sec x| + C$
  topic: U-substitution
- front: $\displaystyle\int\frac{dx}{a^2 + x^2}$
  back: $\dfrac1a\arctan\dfrac xa + C$
  topic: U-substitution
- front: $\displaystyle\int\frac{dx}{\sqrt{a^2 - x^2}}$
  back: $\arcsin\dfrac xa + C$
  topic: U-substitution
- front: Odd function on $[-a, a]$
  back: $\int_{-a}^a f = 0$
  topic: U-substitution
- front: Even function on $[-a, a]$
  back: $\int_{-a}^a f = 2\int_0^a f$
  topic: U-substitution
- front: Displacement vs distance from $v(t)$
  back: Displacement $\int v\,dt$; distance $\int|v|\,dt$.
  topic: Motion along a line
- front: When is a particle speeding up?
  back: When $v$ and $a$ have the same sign.
  topic: Motion along a line
- front: When does a particle change direction?
  back: Where $v$ changes sign.
  topic: Motion along a line
- front: Position from velocity
  back: $s(b) = s(a) + \int_a^b v(t)\,dt$
  topic: Motion along a line
- front: Average value of $f$ on $[a, b]$
  back: $\dfrac{1}{b - a}\displaystyle\int_a^b f(x)\,dx$
  topic: Average value
- front: Average value vs average rate of change
  back: 'Average value: $\frac{1}{b - a}\int f$. Average rate: $\frac{f(b) - f(a)}{b - a}$ (the average value of $f''$).'
  topic: Average value
- front: Mean Value Theorem for integrals
  back: Continuous $f$ on $[a, b]$ attains its average value at some $c$.
  topic: Average value
- front: Area between curves (vertical slices)
  back: $\int_a^b(\text{top} - \text{bottom})\,dx$
  topic: Area between curves
- front: Area between curves (horizontal slices)
  back: $\int_c^d(\text{right} - \text{left})\,dy$
  topic: Area between curves
- front: Curves cross inside the interval
  back: Split at the crossing (or integrate $|f - g|$).
  topic: Area between curves
- front: Area between $y = x^2$ and a line meeting it at $x = p$, $q$
  back: $\dfrac{(q - p)^3}{6}$
  topic: Area between curves
- front: Volume by cross sections
  back: $V = \int_a^b A(x)\,dx$
  topic: Volumes by slicing
- front: Disk method
  back: $V = \pi\int_a^b R^2\,dx$
  topic: Volumes by slicing
- front: Washer method
  back: $V = \pi\int_a^b(R^2 - r^2)\,dx$ (not $(R - r)^2$).
  topic: Volumes by slicing
- front: Square cross sections on base width $s$
  back: $A = s^2$
  topic: Volumes by slicing
- front: Semicircle cross sections, diameter $s$
  back: $A = \frac\pi8 s^2$
  topic: Volumes by slicing
- front: Equilateral triangle cross sections, side $s$
  back: $A = \frac{\sqrt3}{4}s^2$
  topic: Volumes by slicing
- front: Disks/washers about a vertical axis
  back: Slice horizontally; integrate in $y$.
  topic: Volumes by slicing
- front: Shell method about a vertical axis
  back: $V = 2\pi\int_a^b(\text{radius})(\text{height})\,dx$
  topic: Shell method
- front: Shells vs disks orientation
  back: Shells are parallel to the axis; disks/washers are perpendicular.
  topic: Shell method
- front: Radius for shells about $x = k$
  back: $|x - k|$
  topic: Shell method
- front: Arc length of $y = f(x)$
  back: $\displaystyle\int_a^b\sqrt{1 + [f'(x)]^2}\,dx$
  topic: Arc length
- front: Arc length element
  back: $ds = \sqrt{dx^2 + dy^2} = \sqrt{1 + (y')^2}\,dx$
  topic: Arc length
- front: Surface area of revolution about the $x$-axis
  back: $S = 2\pi\int_a^b f(x)\sqrt{1 + [f'(x)]^2}\,dx$
  topic: Surface area
- front: Surface area of a sphere (from calculus)
  back: $4\pi r^2$
  topic: Surface area
- front: Work by a variable force
  back: $W = \int_a^b F(x)\,dx$
  topic: Work
- front: Hooke's law
  back: $F = kx$, $x$ = stretch beyond natural length.
  topic: Work
- front: Pumping work setup
  back: $W = \int\rho g\,A(y)\,(\text{lift distance})\,dy$
  topic: Work
- front: Weight density of water
  back: $9800$ N/m³, or $62.4$ lb/ft³.
  topic: Work
- front: Hydrostatic pressure at depth $d$
  back: $P = \rho g d$
  topic: Fluid force
- front: Fluid force on a vertical plate
  back: $F = \int\rho g\,(\text{depth})(\text{width})\,dy$
  topic: Fluid force
- front: Center of mass of point masses
  back: $\bar x = \dfrac{\sum m_ix_i}{\sum m_i}$
  topic: Center of mass
- front: Centroid of the region under $y = f(x)$
  back: $\bar x = \frac1A\int xf\,dx$, $\bar y = \frac1A\int\frac12f^2\,dx$
  topic: Center of mass
- front: Theorem of Pappus
  back: $V = A\cdot2\pi\bar r$
  topic: Center of mass
- front: Integration by parts
  back: $\int u\,dv = uv - \int v\,du$
  topic: Integration by parts
- front: LIATE
  back: 'Choose $u$ in this order: Logarithmic, Inverse trig, Algebraic, Trig, Exponential.'
  topic: Integration by parts
- front: $\displaystyle\int\ln x\,dx$
  back: $x\ln x - x + C$
  topic: Integration by parts
- front: $\displaystyle\int xe^x\,dx$
  back: $xe^x - e^x + C$
  topic: Integration by parts
- front: $\int e^x\sin x\,dx$ strategy
  back: Parts twice (same type of $u$), then solve for the integral.
  topic: Integration by parts
- front: $\int\sin^mx\cos^nx\,dx$ with an odd power
  back: Save one factor of the odd-powered function, convert the rest with $\sin^2 + \cos^2 = 1$, substitute.
  topic: Trig integrals
- front: $\int\sin^mx\cos^nx\,dx$ with both even
  back: Use half-angle identities.
  topic: Trig integrals
- front: Half-angle identities
  back: $\sin^2x = \frac{1 - \cos2x}{2}$, $\cos^2x = \frac{1 + \cos2x}{2}$
  topic: Trig integrals
- front: $\displaystyle\int\sec x\,dx$
  back: $\ln|\sec x + \tan x| + C$
  topic: Trig integrals
- front: $\int\tan^mx\sec^nx\,dx$, $n$ even
  back: Save $\sec^2x$, convert the rest to $\tan$, $u = \tan x$.
  topic: Trig integrals
- front: $\sqrt{a^2 - x^2}$
  back: $x = a\sin\theta$
  topic: Trig substitution
- front: $\sqrt{a^2 + x^2}$
  back: $x = a\tan\theta$
  topic: Trig substitution
- front: $\sqrt{x^2 - a^2}$
  back: $x = a\sec\theta$
  topic: Trig substitution
- front: Returning to $x$ after trig substitution
  back: Draw a reference triangle from the substitution.
  topic: Trig substitution
- front: First step if $\deg P \ge \deg Q$
  back: Polynomial long division.
  topic: Partial fractions
- front: Term for a repeated factor $(x - r)^2$
  back: $\dfrac{A}{x - r} + \dfrac{B}{(x - r)^2}$
  topic: Partial fractions
- front: Term for an irreducible quadratic
  back: $\dfrac{Bx + C}{x^2 + bx + c}$
  topic: Partial fractions
- front: $\displaystyle\int\frac{dx}{x^2 - a^2}$
  back: $\dfrac{1}{2a}\ln\left|\dfrac{x - a}{x + a}\right| + C$
  topic: Partial fractions
- front: Integration strategy, step 1
  back: Simplify (algebra, identities) before choosing a technique.
  topic: Integration strategy
- front: Is $\int e^{-x^2}dx$ elementary?
  back: No. It has an antiderivative, but not in elementary functions; use numerical methods for definite integrals.
  topic: Integration strategy
- front: Trapezoidal rule
  back: $\frac{\Delta x}{2}[f_0 + 2f_1 + \dots + 2f_{n-1} + f_n]$
  topic: Numerical integration
- front: Simpson's rule
  back: $\frac{\Delta x}{3}[f_0 + 4f_1 + 2f_2 + \dots + 4f_{n-1} + f_n]$, $n$ even.
  topic: Numerical integration
- front: 'Concave up: trapezoid and midpoint'
  back: Trapezoid overestimates; midpoint underestimates.
  topic: Numerical integration
- front: Error bounds (trapezoid, Simpson)
  back: $\frac{K(b - a)^3}{12n^2}$ with $|f''| \le K$; $\frac{K(b - a)^5}{180n^4}$ with $|f^{(4)}| \le K$.
  topic: Numerical integration
- front: Simpson's rule is exact for…
  back: Polynomials of degree 3 or less.
  topic: Numerical integration
- front: $\displaystyle\int_1^\infty\frac{dx}{x^p}$
  back: Converges iff $p > 1$ (to $\frac{1}{p - 1}$).
  topic: Improper integrals
- front: $\displaystyle\int_0^1\frac{dx}{x^p}$
  back: Converges iff $p < 1$ (to $\frac{1}{1 - p}$).
  topic: Improper integrals
- front: Improper integral over $(-\infty, \infty)$
  back: Split at a point; both halves must converge.
  topic: Improper integrals
- front: Comparison test for improper integrals
  back: '$0 \le f \le g$: $\int g$ converges ⇒ $\int f$ converges; $\int f$ diverges ⇒ $\int g$ diverges.'
  topic: Improper integrals
- front: $\displaystyle\int_0^\infty e^{-ax}\,dx$ ($a > 0$)
  back: $\dfrac1a$
  topic: Improper integrals
- front: Slope field segments parallel in each column
  back: The equation is $\frac{dy}{dx} = f(x)$ (slope depends on $x$ only).
  topic: Slope fields
- front: Slope field segments parallel in each row
  back: 'Autonomous: $\frac{dy}{dx} = g(y)$.'
  topic: Slope fields
- front: Equilibrium solutions of $\frac{dy}{dx} = g(y)$
  back: Constant solutions $y = c$ with $g(c) = 0$.
  topic: Slope fields
- front: Stable equilibrium
  back: Nearby solutions move toward it.
  topic: Slope fields
- front: Euler's method step
  back: $y_{n+1} = y_n + h\,F(x_n, y_n)$
  topic: Euler's method
- front: Euler's method on a concave-up solution
  back: Underestimates.
  topic: Euler's method
- front: Separable equation solution method
  back: $\frac{dy}{dx} = g(x)h(y) \Rightarrow \int\frac{dy}{h(y)} = \int g(x)\,dx$, then use the initial condition.
  topic: Separable equations
- front: Is $\frac{dy}{dx} = x + y$ separable?
  back: No.
  topic: Separable equations
- front: Solution of $\frac{dy}{dt} = ky$
  back: $y = y_0e^{kt}$
  topic: Exponential and logistic models
- front: Half-life and doubling time
  back: $\dfrac{\ln 2}{|k|}$
  topic: Exponential and logistic models
- front: Newton's law of cooling solution
  back: $T = T_s + (T_0 - T_s)e^{kt}$
  topic: Exponential and logistic models
- front: Logistic equation
  back: $\frac{dP}{dt} = kP\left(1 - \frac PM\right)$; $P = \frac{M}{1 + Ae^{-kt}}$, $A = \frac{M - P_0}{P_0}$.
  topic: Exponential and logistic models
- front: 'Logistic: fastest growth'
  back: When $P = \frac M2$.
  topic: Exponential and logistic models
- front: 'Logistic: long-run limit'
  back: $M$, the carrying capacity.
  topic: Exponential and logistic models
- front: $\lim r^n$
  back: $0$ if $|r| < 1$; $1$ if $r = 1$; diverges otherwise.
  topic: Sequences
- front: Monotone convergence
  back: A bounded monotone sequence converges.
  topic: Sequences
- front: Geometric series sum
  back: $\dfrac{\text{first term}}{1 - r}$, when $|r| < 1$.
  topic: Series basics
- front: Divergence test
  back: $a_n \not\to 0$ ⇒ $\sum a_n$ diverges. ($a_n \to 0$ proves nothing.)
  topic: Series basics
- front: Harmonic series
  back: $\sum\frac1n$ diverges.
  topic: Series basics
- front: Telescoping example $\sum\frac{1}{n(n + 1)}$
  back: $= 1$
  topic: Series basics
- front: Series converges means…
  back: The sequence of partial sums $S_N$ has a finite limit.
  topic: Series basics
- front: Integral test conditions
  back: $f$ positive, continuous, decreasing; then $\sum f(n)$ and $\int_1^\infty f$ behave alike.
  topic: Integral test
- front: p-series
  back: $\sum\frac1{n^p}$ converges iff $p > 1$.
  topic: Integral test
- front: Integral test remainder
  back: $\int_{N+1}^\infty f \le R_N \le \int_N^\infty f$
  topic: Integral test
- front: $\sum\frac1{n^2}$
  back: $\frac{\pi^2}{6}$
  topic: Integral test
- front: Direct comparison test
  back: '$0 \le a_n \le b_n$: $\sum b_n$ conv ⇒ $\sum a_n$ conv; $\sum a_n$ div ⇒ $\sum b_n$ div.'
  topic: Comparison tests
- front: Limit comparison test
  back: $\lim\frac{a_n}{b_n} = c$, $0 < c < \infty$ ⇒ same behavior.
  topic: Comparison tests
- front: Choosing $b_n$ for limit comparison
  back: Keep the dominant powers of the numerator and denominator.
  topic: Comparison tests
- front: Alternating series test
  back: $b_n$ decreasing and $\to 0$ ⇒ $\sum(-1)^nb_n$ converges.
  topic: Alternating series
- front: Alternating series error bound
  back: $|S - S_N| \le b_{N+1}$, the first omitted term.
  topic: Alternating series
- front: Absolute vs conditional convergence
  back: 'Absolute: $\sum|a_n|$ converges. Conditional: $\sum a_n$ converges but $\sum|a_n|$ doesn''t.'
  topic: Alternating series
- front: Alternating harmonic series
  back: $1 - \frac12 + \frac13 - \cdots = \ln 2$; conditionally convergent.
  topic: Alternating series
- front: Ratio test
  back: '$L = \lim|a_{n+1}/a_n|$: $< 1$ abs. conv; $> 1$ div; $= 1$ inconclusive.'
  topic: Ratio and root tests
- front: Root test
  back: '$L = \lim\sqrt[n]{|a_n|}$: same conclusions as the ratio test.'
  topic: Ratio and root tests
- front: When is the ratio test useless?
  back: For rational functions of $n$ (always $L = 1$); use comparison.
  topic: Ratio and root tests
- front: Best test for factorials
  back: Ratio test.
  topic: Ratio and root tests
- front: 'Radius of convergence: how to find'
  back: Ratio test on $|c_n(x - a)^n|$; solve $L < 1$ for $|x - a| < R$.
  topic: Power series
- front: Endpoints of the interval of convergence
  back: Always test separately.
  topic: Power series
- front: $\dfrac{1}{1 - x}$ as a power series
  back: $\sum x^n$, $|x| < 1$
  topic: Power series
- front: Term-by-term differentiation/integration
  back: Allowed inside the interval; the radius stays the same.
  topic: Power series
- front: $\ln(1 + x)$ series
  back: $x - \frac{x^2}{2} + \frac{x^3}{3} - \cdots$, $-1 < x \le 1$
  topic: Power series
- front: Taylor coefficient
  back: $c_n = \dfrac{f^{(n)}(a)}{n!}$
  topic: Taylor series
- front: $e^x$ Maclaurin series
  back: $\sum\frac{x^n}{n!} = 1 + x + \frac{x^2}{2} + \frac{x^3}{6} + \cdots$
  topic: Taylor series
- front: $\sin x$ Maclaurin series
  back: $x - \frac{x^3}{3!} + \frac{x^5}{5!} - \cdots$
  topic: Taylor series
- front: $\cos x$ Maclaurin series
  back: $1 - \frac{x^2}{2!} + \frac{x^4}{4!} - \cdots$
  topic: Taylor series
- front: $\arctan x$ Maclaurin series
  back: $x - \frac{x^3}{3} + \frac{x^5}{5} - \cdots$, $|x| \le 1$
  topic: Taylor series
- front: Binomial series
  back: $(1 + x)^k = 1 + kx + \frac{k(k - 1)}{2!}x^2 + \cdots$, $|x| < 1$
  topic: Taylor series
- front: Fastest way to get the series of $e^{-x^2}$
  back: Substitute $-x^2$ into the series for $e^u$.
  topic: Taylor series
- front: Lagrange error bound
  back: $|R_n(x)| \le \dfrac{M}{(n + 1)!}|x - a|^{n+1}$ with $|f^{(n+1)}| \le M$.
  topic: Taylor's remainder
- front: Which derivative does the Lagrange bound use for $P_n$?
  back: $f^{(n+1)}$
  topic: Taylor's remainder
- front: Slope of a parametric curve
  back: $\dfrac{dy}{dx} = \dfrac{dy/dt}{dx/dt}$
  topic: Parametric equations
- front: Second derivative, parametric
  back: $\dfrac{d^2y}{dx^2} = \dfrac{\frac{d}{dt}(dy/dx)}{dx/dt}$
  topic: Parametric equations
- front: Parametric arc length
  back: $\int_\alpha^\beta\sqrt{(x')^2 + (y')^2}\,dt$
  topic: Parametric equations
- front: Speed of a particle with position $(x(t), y(t))$
  back: $\sqrt{(x')^2 + (y')^2}$
  topic: Parametric equations
- front: Horizontal and vertical tangents (parametric)
  back: 'Horizontal: $y'' = 0$, $x'' \ne 0$. Vertical: $x'' = 0$, $y'' \ne 0$.'
  topic: Parametric equations
- front: Polar to rectangular
  back: $x = r\cos\theta$, $y = r\sin\theta$; $r^2 = x^2 + y^2$.
  topic: Polar coordinates
- front: Polar area
  back: $\dfrac12\int_\alpha^\beta r^2\,d\theta$
  topic: Polar coordinates
- front: Area between polar curves
  back: $\dfrac12\int(r_{\text{out}}^2 - r_{\text{in}}^2)\,d\theta$
  topic: Polar coordinates
- front: Polar slope
  back: $\dfrac{dy}{dx} = \dfrac{r'\sin\theta + r\cos\theta}{r'\cos\theta - r\sin\theta}$
  topic: Polar coordinates
- front: Polar arc length
  back: $\int\sqrt{r^2 + (r')^2}\,d\theta$
  topic: Polar coordinates
- front: Petals of $r = a\cos(n\theta)$
  back: $n$ if $n$ is odd, $2n$ if $n$ is even.
  topic: Polar coordinates
- front: $r = 2a\cos\theta$ is…
  back: A circle of radius $a$ centered at $(a, 0)$.
  topic: Polar coordinates
