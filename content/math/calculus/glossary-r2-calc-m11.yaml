# Round 2 glossary, module calc-m11 (honors lessons 46h1 and 46h2)
- term: brachistochrone
  aliases:
  - brachistochrone problem
  - curve of fastest descent
  definition: 'The track along which a bead, starting from rest and moving without friction under gravity, slides from one point to a lower one in the least time; the answer is an upside-down cycloid. Posed by Johann Bernoulli in 1696.'
  topic: Cycloid descent
- term: tautochrone
  aliases:
  - tautochrone property
  definition: 'A curve on which a bead released from rest anywhere reaches the lowest point in the same time. The upside-down cycloid is one: the time is $\pi\sqrt{a/g}$ for wheel radius $a$ (Huygens, 1673).'
  topic: Cycloid descent
- term: focus
  aliases:
  - foci
  definition: 'The fixed point in the focus–directrix definition of a conic; every point $P$ of the conic has $PF = e\cdot PD$. A planet''s orbit has the Sun at a focus.'
  topic: Polar conics
- term: directrix
  definition: 'The fixed line in the focus–directrix definition of a conic: each point of the conic is $e$ times as far from the directrix as from the focus. With the focus at the pole and directrix $x = d$, $r = \frac{ed}{1 + e\cos\theta}$.'
  topic: Polar conics
- term: eccentricity
  definition: 'The ratio $e = PF/PD$ that fixes a conic''s shape: $e < 1$ ellipse, $e = 1$ parabola, $e > 1$ hyperbola. For an ellipse, $e = c/a$.'
  topic: Polar conics
- term: conic section
  aliases:
  - conic sections
  - conic
  - conics
  definition: 'An ellipse, parabola or hyperbola: the set of points whose distance to a focus is $e$ times their distance to a directrix (also the curves cut from a cone by a plane).'
  topic: Polar conics
- term: semi-major axis
  definition: 'Half the length of an ellipse''s longest diameter, written $a$; for an orbit it is the average of the nearest and farthest distances, $a = \frac12(r_{\min} + r_{\max})$.'
  topic: Polar conics
- term: semi-latus rectum
  definition: 'For a conic $r = \frac{\ell}{1 + e\cos\theta}$, the number $\ell = ed$: the distance from the focus to the curve measured perpendicular to the axis. For an ellipse, $\ell = a(1 - e^2)$.'
  topic: Polar conics
- term: perihelion
  aliases:
  - periapsis
  definition: 'The point of an orbit around the Sun nearest the Sun, at distance $a(1 - e)$; the body moves fastest there. (Periapsis is the general name for the nearest point to whatever body is orbited.)'
  topic: Kepler's laws
- term: aphelion
  aliases:
  - apoapsis
  definition: 'The point of an orbit around the Sun farthest from the Sun, at distance $a(1 + e)$; the body moves slowest there. (Apoapsis is the general name for the farthest point from whatever body is orbited.)'
  topic: Kepler's laws
- term: Kepler's laws
  aliases:
  - Kepler's second law
  - Kepler's third law
  - Kepler's first law
  definition: '(1) Planets move on ellipses with the Sun at a focus; (2) the line from the Sun sweeps equal areas in equal times, so $r^2\frac{d\theta}{dt}$ is constant; (3) $T^2 \propto a^3$ ($T = a^{3/2}$ in years and AU). Published by Kepler in 1609 and 1619.'
  topic: Kepler's laws
