# Honors module calc-h1 (Honors: Toward analysis), round 2 glossary
- term: real analysis
  definition: 'The branch of mathematics that proves the theorems of calculus rigorously, starting from the properties of the real numbers. It is usually a first proof-based college course.'
  topic: Proving sequence limits
- term: limit of a sequence
  aliases: [sequence limit, limits of sequences]
  definition: '$\lim_{n\to\infty} a_n = L$ means: for every $\varepsilon > 0$ there is a number $N$ such that $|a_n - L| < \varepsilon$ for every $n > N$.'
  topic: Proving sequence limits
- term: subsequence
  aliases: [subsequences]
  definition: 'A sequence made of infinitely many terms of another sequence, kept in their original order: $a_{n_1}, a_{n_2}, a_{n_3}, \dots$ with $n_1 < n_2 < n_3 < \cdots$.'
  topic: Subsequences
- term: upper bound
  aliases: [upper bounds]
  definition: 'A number $M$ with $x \le M$ for every $x$ in the set $S$. A set with an upper bound is bounded above.'
  topic: Completeness
- term: lower bound
  aliases: [lower bounds]
  definition: 'A number $m$ with $m \le x$ for every $x$ in the set $S$. A set with a lower bound is bounded below.'
  topic: Completeness
- term: least upper bound
  aliases: [supremum, suprema, least upper bounds]
  definition: 'The smallest upper bound of a set $S$, written $\sup S$. A number $s$ is $\sup S$ when it is an upper bound and, for every $\varepsilon > 0$, some element of $S$ exceeds $s - \varepsilon$. It need not belong to $S$.'
  topic: Completeness
- term: greatest lower bound
  aliases: [infimum, infima, greatest lower bounds]
  definition: 'The largest lower bound of a set $S$, written $\inf S$. It need not belong to $S$.'
  topic: Completeness
- term: completeness axiom
  aliases: [completeness, completeness property]
  definition: 'Every nonempty set of real numbers that is bounded above has a least upper bound that is a real number. The rational numbers do not have this property.'
  topic: Completeness
- term: Archimedean property
  definition: 'For every real number $x$ there is a natural number $n > x$; equivalently, for every $\varepsilon > 0$ some $n$ has $\frac1n < \varepsilon$.'
  topic: Completeness
- term: monotone convergence theorem
  definition: 'An increasing sequence that is bounded above converges to the supremum of its terms (and a decreasing sequence bounded below converges to its infimum).'
  topic: Completeness
- term: nested interval property
  aliases: [nested intervals theorem]
  definition: 'If closed intervals $[a_1, b_1] \supseteq [a_2, b_2] \supseteq \cdots$ have lengths tending to 0, exactly one number lies in all of them.'
  topic: Completeness
- term: Bolzano–Weierstrass theorem
  aliases: [Bolzano-Weierstrass theorem, Bolzano–Weierstrass]
  definition: 'Every bounded sequence of real numbers has a convergent subsequence.'
  topic: Bolzano–Weierstrass theorem
- term: Cauchy sequence
  aliases: [Cauchy sequences]
  definition: 'A sequence whose terms eventually stay close to each other: for every $\varepsilon > 0$ there is $N$ with $|a_m - a_n| < \varepsilon$ for all $m, n > N$. In the real numbers, a sequence converges exactly when it is Cauchy.'
  topic: Bolzano–Weierstrass theorem
- term: sequential criterion
  aliases: [sequential criterion for continuity, sequential characterization of continuity]
  definition: '$f$ is continuous at $c$ exactly when $f(x_n) \to f(c)$ for every sequence $x_n$ in the domain with $x_n \to c$. One sequence with $x_n \to c$ but $f(x_n) \not\to f(c)$ proves discontinuity.'
  topic: Sequential continuity
- term: partition
  aliases: [partitions]
  definition: 'A finite list of points $a = x_0 < x_1 < \cdots < x_n = b$ that cuts $[a, b]$ into pieces, not necessarily of equal width.'
  topic: Upper and lower sums
- term: upper sum
  aliases: [upper sums, upper Darboux sum]
  definition: 'For a partition $P$, $U(f, P) = \sum M_i\,\Delta x_i$, where $M_i$ is the supremum of $f$ on the $i$-th piece. Every Riemann sum on $P$ is at most $U(f, P)$.'
  topic: Upper and lower sums
- term: lower sum
  aliases: [lower sums, lower Darboux sum]
  definition: 'For a partition $P$, $L(f, P) = \sum m_i\,\Delta x_i$, where $m_i$ is the infimum of $f$ on the $i$-th piece. Every Riemann sum on $P$ is at least $L(f, P)$.'
  topic: Upper and lower sums
- term: refinement
  aliases: [refinements, refine]
  definition: 'A partition that contains all the points of another partition and possibly more. Refining can only raise lower sums and lower upper sums.'
  topic: Upper and lower sums
- term: lower integral
  definition: 'The supremum of all lower sums of $f$ on $[a, b]$. It is never more than the upper integral.'
  topic: Integrability
- term: upper integral
  definition: 'The infimum of all upper sums of $f$ on $[a, b]$. A bounded function is integrable when its upper and lower integrals are equal.'
  topic: Integrability
- term: Riemann's criterion
  aliases: [Riemann criterion, Riemann's integrability criterion]
  definition: 'A bounded function $f$ is integrable on $[a, b]$ exactly when, for every $\varepsilon > 0$, some partition $P$ has $U(f, P) - L(f, P) < \varepsilon$.'
  topic: Integrability
- term: uniformly continuous
  aliases: [uniform continuity]
  definition: '$f$ is uniformly continuous on a set if for every $\varepsilon > 0$ one $\delta > 0$ works at every point: $|x - y| < \delta$ implies $|f(x) - f(y)| < \varepsilon$ for all $x, y$ in the set. Continuous functions on closed bounded intervals are uniformly continuous.'
  topic: Integrability
