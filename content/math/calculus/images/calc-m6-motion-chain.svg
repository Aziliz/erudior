<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430"><title>Position, velocity and acceleration linked by derivatives and antiderivatives</title><rect x="0" y="0" width="600" height="430" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="200.0" y="30.0" width="200.0" height="84.0" rx="10" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="300.0" y="62.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">Position s(t)</text><text x="300.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal">−16t² + 48t + 64</text><rect x="200.0" y="173.0" width="200.0" height="84.0" rx="10" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="300.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">Velocity v(t)</text><text x="300.0" y="237.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal">−32t + 48</text><rect x="200.0" y="316.0" width="200.0" height="84.0" rx="10" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="300.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">Acceleration a(t)</text><text x="300.0" y="380.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal">−32</text><line x1="370.0" y1="120.0" x2="370.0" y2="167.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="410.0" y="149.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal">differentiate</text><line x1="230.0" y1="167.0" x2="230.0" y2="120.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="190.0" y="139.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">antidifferentiate,</text><text x="190.0" y="159.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">then use the</text><text x="190.0" y="179.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">initial value</text><line x1="370.0" y1="263.0" x2="370.0" y2="310.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="410.0" y="292.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal">differentiate</text><line x1="230.0" y1="310.0" x2="230.0" y2="263.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="190.0" y="282.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">antidifferentiate,</text><text x="190.0" y="302.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">then use the</text><text x="190.0" y="322.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="end" font-weight="normal">initial value</text></svg>
