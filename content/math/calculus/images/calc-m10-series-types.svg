<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" font-family="sans-serif" fill="#1c2833">
<rect width="520" height="380" fill="#ffffff"/>
<rect x="10" y="10" width="500" height="360" rx="14" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/>
<rect x="35" y="88" width="450" height="232" rx="14" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<rect x="55" y="140" width="235" height="165" rx="14" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="28" y="38" font-size="17" text-anchor="start" font-weight="bold">Divergent</text>
<text x="52" y="116" font-size="17" text-anchor="start" font-weight="bold">Conditionally convergent</text>
<text x="72" y="168" font-size="17" text-anchor="start" font-weight="bold">Absolutely convergent</text>
<text x="120" y="66" font-size="16" text-anchor="middle">Σ 1/n</text>
<text x="250" y="66" font-size="16" text-anchor="middle">Σ (−1)ⁿ</text>
<text x="395" y="66" font-size="16" text-anchor="middle">Σ n/(n + 1)</text>
<text x="260" y="350" font-size="15" text-anchor="middle">Convergent series: the two inner regions together</text>
<text x="388" y="180" font-size="16" text-anchor="middle">Σ (−1)ⁿ/n</text>
<text x="388" y="220" font-size="16" text-anchor="middle">Σ (−1)ⁿ/√n</text>
<text x="388" y="260" font-size="16" text-anchor="middle">Σ (−1)ⁿ/ln n</text>
<text x="172" y="205" font-size="16" text-anchor="middle">Σ (−1)ⁿ/n²</text>
<text x="172" y="239" font-size="16" text-anchor="middle">Σ 1/2ⁿ</text>
<text x="172" y="273" font-size="16" text-anchor="middle">Σ (−1)ⁿ/n!</text>
</svg>
