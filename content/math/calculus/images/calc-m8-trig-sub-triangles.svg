<path d="M504,160 A34,34 0 0,0 497.4,139.9" fill="none" stroke="#1c2833" stroke-width="1.5"/>
<text x="514" y="153" font-size="16" font-style="italic" fill="#1c2833">θ</text>
<text x="550.0" y="218" font-size="17" text-anchor="middle" fill="#1c2833">x = a sec θ</text>
<text x="528.0" y="93.0" font-size="16" text-anchor="end" fill="#1c2833">x</text>
<text x="618" y="110.0" font-size="16" text-anchor="start" fill="#1c2833">√(x² − a²)</text>
<text x="540.0" y="184" font-size="16" text-anchor="middle" fill="#1c2833">a</text>
</svg>
