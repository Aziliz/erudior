<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 240" width="690" height="240" font-family="Helvetica, Arial, sans-serif">
<rect width="690" height="240" fill="#ffffff"/>
<polygon points="30,160 170,160 170,50" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<polyline points="156,160 156,146 170,146" fill="none" stroke="#1c2833" stroke-width="1.5"/>
<path d="M64,160 A34,34 0 0,0 57.4,139.9" fill="none" stroke="#1c2833" stroke-width="1.5"/>
<text x="74" y="153" font-size="16" font-style="italic" fill="#1c2833">θ</text>
<text x="110.0" y="218" font-size="17" text-anchor="middle" fill="#1c2833">x = a sin θ</text>
<text x="88.0" y="93.0" font-size="16" text-anchor="end" fill="#1c2833">a</text>
<text x="178" y="110.0" font-size="16" text-anchor="start" fill="#1c2833">x</text>
<text x="100.0" y="184" font-size="16" text-anchor="middle" fill="#1c2833">√(a² − x²)</text>
<polygon points="255,160 395,160 395,50" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<polyline points="381,160 381,146 395,146" fill="none" stroke="#1c2833" stroke-width="1.5"/>
<path d="M289,160 A34,34 0 0,0 282.4,139.9" fill="none" stroke="#1c2833" stroke-width="1.5"/>
<text x="299" y="153" font-size="16" font-style="italic" fill="#1c2833">θ</text>
<text x="335.0" y="218" font-size="17" text-anchor="middle" fill="#1c2833">x = a tan θ</text>
<text x="313.0" y="93.0" font-size="16" text-anchor="end" fill="#1c2833">√(a² + x²)</text>
<text x="403" y="110.0" font-size="16" text-anchor="start" fill="#1c2833">x</text>
<text x="325.0" y="184" font-size="16" text-anchor="middle" fill="#1c2833">a</text>
<polygon points="470,160 610,160 610,50" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
