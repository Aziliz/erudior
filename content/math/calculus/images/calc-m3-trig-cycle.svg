<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 400" width="460" height="400" role="img"><title>A cycle of four boxes joined by arrows labeled d/dx: sin x goes to cos x, cos x to −sin x, −sin x to −cos x, and −cos x back to sin x, so four derivatives return to the start</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="460" height="400" fill="#ffffff"/><path d="M280.8,90.8 A125,125 0 0 1 344.2,154.2" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="339.6" y="100.4" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" font-style="italic">d/dx</text><path d="M344.2,255.8 A125,125 0 0 1 280.8,319.2" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="339.6" y="319.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" font-style="italic">d/dx</text><path d="M179.2,319.2 A125,125 0 0 1 115.8,255.8" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="120.4" y="319.6" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" font-style="italic">d/dx</text><path d="M115.8,154.2 A125,125 0 0 1 179.2,90.8" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="120.4" y="100.4" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" font-style="italic">d/dx</text><rect x="182.0" y="60.0" width="96" height="40" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="230.0" y="86.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1c2833" >sin x</text><rect x="307.0" y="185.0" width="96" height="40" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="355.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1c2833" >cos x</text><rect x="182.0" y="310.0" width="96" height="40" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="230.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1c2833" >−sin x</text><rect x="57.0" y="185.0" width="96" height="40" rx="8" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="105.0" y="211.0" font-family="Helvetica, Arial, sans-serif" font-size="18" text-anchor="middle" fill="#1c2833" >−cos x</text><text x="230.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" >4 derivatives</text><text x="230.0" y="221.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1c2833" >= back to start</text></svg>