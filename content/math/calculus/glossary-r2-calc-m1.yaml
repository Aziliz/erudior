# Round 2 glossary, module calc-m1 (honors lessons 05h1 and 05h2)
- term: M-δ definition
  aliases: [M-delta definition]
  definition: 'The precise meaning of $\lim_{x\to a} f(x) = \infty$: for every $M > 0$ there is a $\delta > 0$ such that $0 < |x - a| < \delta$ implies $f(x) > M$. (A convenient name; books phrase it differently.)'
  topic: Precise limit definitions
- term: ε-N definition
  aliases: [epsilon-N definition]
  definition: 'The precise meaning of $\lim_{x\to\infty} f(x) = L$: for every $\varepsilon > 0$ there is a number $N$ such that $x > N$ implies $|f(x) - L| < \varepsilon$.'
  topic: Precise limit definitions
- term: triangle inequality
  definition: 'For all real numbers $u$ and $v$, $|u + v| \le |u| + |v|$. It is the main tool for combining two small errors into one.'
  topic: Precise limit definitions
- term: negation
  aliases: [negate, negating]
  definition: 'The statement that says the opposite. Negating a definition swaps "for every" with "there is" and reverses the final condition; it is how you prove that a limit does not exist.'
  topic: Precise limit definitions
- term: Heaviside step function
  aliases: [Heaviside function, unit step function]
  definition: 'The function $H(x) = 0$ for $x < 0$ and $H(x) = 1$ for $x \ge 0$. It has a jump at 0, so $\lim_{x\to0} H(x)$ does not exist. (Some books use a different value at 0.)'
  topic: Precise limit definitions
- term: bracket
  aliases: [bracketing interval]
  definition: 'An interval $[a, b]$ on which a continuous function changes sign, so that by the IVT a root is trapped inside. Bisection halves the bracket at each step.'
  topic: IVT applications
- term: error bound
  aliases: [error bounds]
  definition: 'A guaranteed upper limit on the size of an approximation''s error, known without knowing the exact answer. After $n$ bisection steps on $[a, b]$, the midpoint is within $(b - a)/2^{n+1}$ of a root.'
  topic: IVT applications
- term: fixed point
  aliases: [fixed points]
  definition: 'A number $c$ with $f(c) = c$: an input the function leaves unchanged. On a graph, a point where $y = f(x)$ meets the line $y = x$.'
  topic: IVT applications
- term: fixed-point theorem
  definition: 'In one dimension: if $f$ is continuous on $[a, b]$ and all its outputs on $[a, b]$ lie in $[a, b]$, then $f(c) = c$ for some $c$ in $[a, b]$. Proved by applying the IVT to $f(x) - x$.'
  topic: IVT applications
- term: universal chord theorem
  definition: 'If $f$ is continuous on $[a, b]$ with $f(a) = f(b)$, then for every whole number $n$ there is a horizontal chord of length $(b - a)/n$: some $x$ with $f(x + (b - a)/n) = f(x)$. Other lengths are not guaranteed.'
  topic: IVT applications
- term: Dirichlet function
  definition: 'The function equal to 1 at every rational number and 0 at every irrational number. It is continuous nowhere, and it jumps from 0 to 1 without taking any value in between.'
  topic: IVT applications
