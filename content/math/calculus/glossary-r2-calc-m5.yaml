# Round 2 glossary for calc-m5 honors lessons
- term: racetrack principle
  definition: If $f(a) = g(a)$ and $f'(x) \le g'(x)$ on $(a, b)$, then $f(x) \le g(x)$ on $[a, b]$; a consequence of the Mean Value Theorem.
  topic: Inequalities from the MVT
- term: convex function
  aliases:
  - convex
  - convex functions
  definition: 'A function whose chords all lie on or above its graph: $f(tx + (1 - t)y) \le tf(x) + (1 - t)f(y)$ for $0 \le t \le 1$. The same as concave up; guaranteed by $f'''' \ge 0$.'
  topic: Convexity
- term: concave function
  aliases:
  - concave functions
  definition: A function whose chords all lie on or below its graph; the same as concave down. $f$ is concave exactly when $-f$ is convex.
  topic: Convexity
- term: strictly convex
  definition: 'Convex with strict inequality: every chord lies strictly above the graph between its endpoints. Guaranteed by $f'''' > 0$.'
  topic: Convexity
- term: tangent line inequality
  definition: 'For a differentiable convex function, $f(x) \ge f(a) + f''(a)(x - a)$: the graph lies on or above each tangent line.'
  topic: Convexity
- term: Jensen's inequality
  aliases:
  - Jensen inequality
  definition: 'For a convex $f$: $f\left(\frac{x_1 + \cdots + x_n}{n}\right) \le \frac{f(x_1) + \cdots + f(x_n)}{n}$ (also with weights adding to 1); reversed for concave $f$.'
  topic: Classic inequalities
- term: arithmetic mean
  aliases:
  - AM
  definition: 'The ordinary average of $n$ numbers: $\frac{a_1 + \cdots + a_n}{n}$.'
  topic: Classic inequalities
- term: geometric mean
  aliases:
  - GM
  definition: 'For positive numbers, the $n$th root of their product: $\sqrt[n]{a_1 a_2\cdots a_n}$.'
  topic: Classic inequalities
- term: AM–GM inequality
  aliases:
  - AM-GM inequality
  - AM-GM
  - AM–GM
  - arithmetic mean-geometric mean inequality
  definition: For nonnegative numbers, the geometric mean is at most the arithmetic mean, with equality only when all the numbers are equal.
  topic: Classic inequalities
- term: normal
  aliases:
  - normal line
  definition: At a point of a line or surface, the line through that point perpendicular to it. In refraction, angles are measured from the normal.
  topic: Optimization models
- term: Fermat's principle
  aliases:
  - principle of least time
  definition: Light travels between two points along the path that takes the least time (in modern form, a path of stationary time). It implies Snell's law.
  topic: Optimization models
- term: index of refraction
  aliases:
  - refractive index
  definition: 'For a medium, $n = \frac{c}{v}$: the speed of light in a vacuum divided by its speed in the medium (about 1.00 for air, 1.33 for water).'
  topic: Optimization models
- term: Snell's law
  definition: '$n_1\sin\theta_1 = n_2\sin\theta_2$, with angles measured from the normal: the rule for how light bends at a boundary between two media.'
  topic: Optimization models
- term: ordering cost
  definition: In the inventory model, the fixed cost $K$ of placing one order, whatever its size.
  topic: Optimization models
- term: holding cost
  definition: In the inventory model, the cost $h$ of keeping one unit in stock for a year (storage, insurance, tied-up money).
  topic: Optimization models
- term: economic order quantity
  aliases:
  - EOQ
  definition: The order size $Q^* = \sqrt{2KD/h}$ that minimizes yearly ordering plus holding cost; at $Q^*$ the two costs are equal.
  topic: Optimization models
