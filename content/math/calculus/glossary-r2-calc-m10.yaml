# Round 2 glossary for calc-m10 (honors lessons 44h1 and 44h2)
- term: Leibniz series
  aliases: [Madhava–Leibniz series, Madhava-Leibniz series]
  definition: 'The series $\frac{\pi}{4} = 1 - \frac13 + \frac15 - \frac17 + \cdots$, the arctangent series at $x = 1$. It converges, but very slowly.'
  topic: Computing with series
- term: Machin's formula
  definition: '$\frac{\pi}{4} = 4\arctan\frac15 - \arctan\frac{1}{239}$ (John Machin, 1706); the arctangent series converge fast at these small values.'
  topic: Computing with series
- term: argument reduction
  definition: 'Rewriting a function value in terms of the value at a small input before approximating, such as $e^x = 2^ke^r$ with $r = x - k\ln2$ small.'
  topic: Computing with series
- term: complex number
  aliases: [complex numbers]
  definition: 'A number $a + bi$ with $a$, $b$ real and $i^2 = -1$.'
  topic: Complex power series
- term: complex plane
  definition: 'The plane in which $a + bi$ is drawn as the point $(a, b)$: real numbers on the horizontal axis, multiples of $i$ on the vertical axis.'
  topic: Complex power series
- term: modulus
  aliases: [moduli]
  definition: 'For $z = a + bi$, $|z| = \sqrt{a^2 + b^2}$: the distance from $z$ to 0 in the complex plane.'
  topic: Complex power series
- term: disk of convergence
  definition: 'The disk $|z - a| < R$ in the complex plane where a power series $\sum c_n(z - a)^n$ converges absolutely; $R$ is its radius of convergence.'
  topic: Complex power series
- term: Euler's formula
  definition: '$e^{i\theta} = \cos\theta + i\sin\theta$ for real $\theta$ (in radians), found by putting $i\theta$ into the series for $e^z$.'
  topic: Euler's formula
- term: Euler's identity
  definition: '$e^{i\pi} + 1 = 0$, Euler''s formula at $\theta = \pi$.'
  topic: Euler's formula
- term: De Moivre's formula
  aliases: [De Moivre's theorem]
  definition: '$(\cos\theta + i\sin\theta)^n = \cos n\theta + i\sin n\theta$; in exponential form, $(e^{i\theta})^n = e^{in\theta}$.'
  topic: Euler's formula
- term: singularity
  aliases: [singularities]
  definition: 'A point (possibly complex) where a function blows up or otherwise fails to be differentiable as a function of a complex variable; a Taylor series converges out to the nearest one.'
  topic: Complex power series
