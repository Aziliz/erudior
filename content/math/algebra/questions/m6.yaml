# Module 6: Quadratic equations and functions
- id: alg-q-2201
  lesson: alg-quad-factoring
  module_quiz: true
  topic: Quadratic equations
  stem: 'Solve $x^2 - 5x - 14 = 0$.'
  choices: ['$x = 7$ or $x = -2$', '$x = -7$ or $x = 2$', '$x = 14$ or $x = -1$', '$x = 5$ or $x = 14$']
  answer: 0
  explanation: |-
    Factor: $(x - 7)(x + 2) = 0$, so $x = 7$ or $x = -2$. The factor $x + 2$ gives the root $-2$; mixing up the signs gives $-7$ and 2.
- id: alg-q-2202
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Solve $3x^2 = 15x$.'
  choices: ['$x = 0$ or $x = 5$', '$x = 5$ only', '$x = 0$ or $x = -5$', '$x = 3$ or $x = 5$']
  answer: 0
  explanation: |-
    $3x^2 - 15x = 0$, so $3x(x - 5) = 0$ and $x = 0$ or $x = 5$. Dividing both sides by $x$ loses the root 0.
- id: alg-q-2203
  lesson: alg-quad-factoring
  module_quiz: true
  topic: Quadratic equations
  stem: 'Solve $2x^2 + x - 6 = 0$.'
  choices: ['$x = 3$ or $x = -2$', '$x = -\tfrac32$ or $x = 2$', '$x = \tfrac32$ or $x = -2$', '$x = \tfrac23$ or $x = -2$']
  answer: 2
  explanation: |-
    $ac = -12$, sum 1: 4 and $-3$. $2x^2 + 4x - 3x - 6 = 2x(x + 2) - 3(x + 2) = (2x - 3)(x + 2)$. So $x = \tfrac32$ or $x = -2$.
- id: alg-q-2204
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'A student solves $(x - 3)(x + 1) = 5$ by writing $x - 3 = 5$ or $x + 1 = 5$. What is the correct conclusion?'
  choices: ['The method is fine; the solutions are $x = 8$ or $x = 4$', 'The zero product property needs 0 on one side; the solutions are $x = 4$ or $x = -2$', 'The factors should each be set equal to $-5$', 'The solutions are $x = 3$ or $x = -1$']
  answer: 1
  explanation: |-
    Expand and move the 5: $x^2 - 2x - 3 - 5 = 0$, so $x^2 - 2x - 8 = (x - 4)(x + 2) = 0$. A product equal to 5 doesn't force either factor to be 5.
- id: alg-q-2205
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Solve $x^2 + 9 = 6x$.'
  choices: ['No solution', '$x = 3$ or $x = -3$', '$x = 9$', '$x = 3$ (a double root)']
  answer: 3
  explanation: |-
    Standard form: $x^2 - 6x + 9 = 0$, a perfect square $(x - 3)^2 = 0$. The only solution is $x = 3$; its graph touches the $x$-axis there.
- id: alg-q-2206
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Which equation has solutions $x = 4$ and $x = -\tfrac12$?'
  choices: ['$2x^2 - 7x - 4 = 0$', '$2x^2 + 7x - 4 = 0$', '$x^2 - 4x - \tfrac12 = 0$', '$2x^2 - 9x + 4 = 0$']
  answer: 0
  explanation: |-
    Factors $(x - 4)$ and $(2x + 1)$: $(x - 4)(2x + 1) = 2x^2 - 7x - 4$. The last choice factors as $(2x - 1)(x - 4)$, with roots $\tfrac12$ and 4.
- id: alg-q-2207
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Which statement is the zero product property?'
  choices: ['If $ab = 0$, then $a = 0$ or $b = 0$', 'If $ab = 1$, then $a = 1$ or $b = 1$', 'If $a + b = 0$, then $a = 0$ and $b = 0$', 'If $a = 0$, then $ab = a + b$']
  answer: 0
  explanation: |-
    Only zero has this property: a product is zero exactly when some factor is zero. For $ab = 1$, many pairs work, like $a = 2$, $b = \tfrac12$.
- id: alg-q-2208
  lesson: alg-quad-factoring
  module_quiz: true
  topic: Quadratic equations
  stem: 'A rectangle''s length is 4 m more than its width and its area is 96 m². What are its dimensions?'
  choices: ['12 m by 16 m', '6 m by 16 m', '8 m by 12 m', '4 m by 24 m']
  answer: 2
  explanation: |-
    $w(w + 4) = 96$, so $w^2 + 4w - 96 = 0$ and $(w + 12)(w - 8) = 0$. Reject $w = -12$; $w = 8$ and the length is 12. (6 by 16 has the right area but differs by 10.)
- id: alg-q-2209
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Where does the graph of $y = x^2 - x - 6$ cross the $x$-axis?'
  choices: ['At $x = 2$ and $x = -3$', 'At $x = -2$ and $x = 3$', 'At $x = -6$ and $x = 1$', 'At $y = -6$']
  answer: 1
  explanation: |-
    $x$-intercepts are solutions of $x^2 - x - 6 = 0$: $(x - 3)(x + 2) = 0$, so $x = 3$ and $x = -2$. $y = -6$ is the $y$-intercept.
- id: alg-q-2210
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'To solve $x^2 = 4x$, a student divides both sides by $x$ and gets $x = 4$. What did the student lose?'
  choices: ['The solution $x = -4$', 'The solution $x = 0$', 'Nothing; $x = 4$ is the only solution', 'The solution $x = 2$']
  answer: 1
  explanation: |-
    $x^2 - 4x = x(x - 4) = 0$ gives $x = 0$ or $x = 4$. Dividing by $x$ silently assumes $x \ne 0$.
- id: alg-q-2211
  lesson: alg-quad-factoring
  topic: Quadratic equations
  stem: 'Solve $4x^2 - 9 = 0$ by factoring.'
  choices: ['$x = \pm\tfrac94$', '$x = \tfrac94$', '$x = \pm\tfrac32$', '$x = \pm 3$']
  answer: 2
  explanation: |-
    Difference of squares: $(2x - 3)(2x + 3) = 0$, so $x = \tfrac32$ or $x = -\tfrac32$. $\pm\tfrac94$ are the values of $x^2$, not $x$.

- id: alg-q-2301
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'Solve $x^2 = 49$.'
  choices: ['$x = 24.5$', '$x = 7$', '$x = \pm 7$', '$x = \pm 49$']
  answer: 2
  explanation: |-
    By the square root property, $x = \pm\sqrt{49} = \pm 7$. Both $7^2$ and $(-7)^2$ equal 49.
- id: alg-q-2302
  lesson: alg-complete-square
  module_quiz: true
  topic: Quadratic equations
  stem: 'Solve $(x - 2)^2 = 16$.'
  choices: ['$x = 2 \pm 16$', '$x = 6$ only', '$x = 18$ or $x = -14$', '$x = 6$ or $x = -2$']
  answer: 3
  explanation: |-
    $x - 2 = \pm 4$, so $x = 6$ or $x = -2$. Using 16 instead of $\sqrt{16}$ gives the wrong $18$ and $-14$.
- id: alg-q-2303
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'Solve $3x^2 + 5 = 41$.'
  choices: ['$x = \pm 2\sqrt3$', '$x = \pm 6$', '$x = \pm 12$', '$x = \pm\sqrt{\tfrac{46}{3}}$']
  answer: 0
  explanation: |-
    $3x^2 = 36$, so $x^2 = 12$ and $x = \pm\sqrt{12} = \pm 2\sqrt3$. Adding 5 instead of subtracting gives $\tfrac{46}{3}$.
- id: alg-q-2304
  lesson: alg-complete-square
  module_quiz: true
  topic: Quadratic equations
  stem: 'What number completes the square: $x^2 + 14x + \underline{\quad}$?'
  choices: ['$196$', '$49$', '$7$', '$14$']
  answer: 1
  explanation: |-
    Half of 14 is 7, and $7^2 = 49$: $x^2 + 14x + 49 = (x + 7)^2$. Squaring 14 without halving gives 196.
- id: alg-q-2305
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'What number completes the square: $x^2 - 9x + \underline{\quad}$?'
  choices: ['$81$', '$\tfrac{81}{2}$', '$\tfrac{81}{4}$', '$\tfrac{9}{2}$']
  answer: 2
  explanation: |-
    Half of $-9$ is $-\tfrac92$, and $\left(-\tfrac92\right)^2 = \tfrac{81}{4}$. Then $x^2 - 9x + \tfrac{81}{4} = \left(x - \tfrac92\right)^2$.
- id: alg-q-2306
  lesson: alg-complete-square
  module_quiz: true
  topic: Quadratic equations
  stem: 'Solve $x^2 + 4x - 3 = 0$ by completing the square.'
  choices: ['$x = -2 \pm \sqrt7$', '$x = 2 \pm \sqrt7$', '$x = -2 \pm \sqrt3$', '$x = -4 \pm \sqrt7$']
  answer: 0
  explanation: |-
    $x^2 + 4x = 3$. Add 4: $(x + 2)^2 = 7$. So $x + 2 = \pm\sqrt7$ and $x = -2 \pm \sqrt7$. Forgetting to add 4 to the right side gives $\sqrt3$.
- id: alg-q-2307
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'Write $x^2 + 10x + 18$ in the form $(x + h)^2 + k$.'
  choices: ['$(x - 5)^2 - 7$', '$(x + 5)^2 + 18$', '$(x + 10)^2 - 82$', '$(x + 5)^2 - 7$']
  answer: 3
  explanation: |-
    Half of 10 is 5; add and subtract 25: $x^2 + 10x + 25 - 25 + 18 = (x + 5)^2 - 7$.
- id: alg-q-2308
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'Solve $(x + 1)^2 = -9$ over the real numbers.'
  choices: ['$x = -1 \pm 3$', '$x = 2$ or $x = -4$', 'No real solution', '$x = -10$']
  answer: 2
  explanation: |-
    A real square can't be negative, so there is no real solution. (In Lesson 29 you'll see the complex solutions $-1 \pm 3i$.)
- id: alg-q-2309
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'What is the first step in completing the square on $3x^2 - 12x + 1 = 0$?'
  choices: ['Add 4 to both sides', 'Add 36 to both sides', 'Take the square root of both sides', 'Divide every term by 3']
  answer: 3
  explanation: |-
    The method needs $x^2$ with coefficient 1. Dividing by 3 gives $x^2 - 4x + \tfrac13 = 0$; then you'd add 4 to complete the square.
- id: alg-q-2310
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'A student solves $(x - 4)^2 = 25$ and writes $x - 4 = 5$, so $x = 9$. What is missing?'
  choices: ['Nothing; $x = 9$ is the only solution', 'The negative root: $x - 4 = -5$ gives $x = -1$', 'The answer should be $x = 29$', 'The answer should be $x = 4 \pm 25$']
  answer: 1
  explanation: |-
    The square root property gives $x - 4 = \pm 5$. Both $x = 9$ and $x = -1$ satisfy the original equation.
- id: alg-q-2311
  lesson: alg-complete-square
  topic: Quadratic equations
  stem: 'Use completing the square to find the smallest value of $x^2 - 6x + 13$.'
  choices: ['$4$', '$13$', '$3$', '$-4$']
  answer: 0
  explanation: |-
    $x^2 - 6x + 13 = (x - 3)^2 + 4$. A square is at least 0, so the smallest value is 4, at $x = 3$.

- id: alg-q-2401
  lesson: alg-quad-formula
  topic: Quadratic formula
  stem: 'Which is the quadratic formula for $ax^2 + bx + c = 0$?'
  choices: ['$x = -b \pm \dfrac{\sqrt{b^2 - 4ac}}{2a}$', '$x = \dfrac{-b \pm \sqrt{b^2 - 4ac}}{2a}$', '$x = \dfrac{b \pm \sqrt{b^2 - 4ac}}{2a}$', '$x = \dfrac{-b \pm \sqrt{b^2 + 4ac}}{2a}$']
  answer: 1
  explanation: |-
    The whole numerator $-b \pm \sqrt{b^2 - 4ac}$ is divided by $2a$. It comes from completing the square on the general equation.
- id: alg-q-2402
  lesson: alg-quad-formula
  module_quiz: true
  topic: Quadratic formula
  stem: 'Solve $x^2 + 6x + 4 = 0$.'
  choices: ['$x = -6 \pm \sqrt5$', '$x = 3 \pm \sqrt5$', '$x = -3 \pm 2\sqrt5$', '$x = -3 \pm \sqrt5$']
  answer: 3
  explanation: |-
    $D = 36 - 16 = 20$. $x = \dfrac{-6 \pm \sqrt{20}}{2} = \dfrac{-6 \pm 2\sqrt5}{2} = -3 \pm \sqrt5$. Dividing only the $-6$ by 2 gives $-3 \pm 2\sqrt5$.
- id: alg-q-2403
  lesson: alg-quad-formula
  topic: Quadratic formula
  stem: 'Solve $2x^2 - 3x - 2 = 0$ using the quadratic formula.'
  choices: ['$x = -2$ or $x = \tfrac12$', '$x = 2$ or $x = -\tfrac12$', '$x = \dfrac{3 \pm \sqrt7}{4}$', '$x = 8$ or $x = -2$']
  answer: 1
  explanation: |-
    $D = 9 + 16 = 25$, so $x = \dfrac{3 \pm 5}{4}$: $x = 2$ or $x = -\tfrac12$. Writing $-4ac$ as $-16$ gives $\sqrt{-7}$; dividing by 1 instead of $2a = 4$ gives 8 and $-2$.
- id: alg-q-2404
  lesson: alg-quad-formula
  topic: Discriminant
  stem: 'What is the discriminant of $3x^2 - 4x + 5$?'
  choices: ['$-76$', '$76$', '$-44$', '$44$']
  answer: 2
  explanation: |-
    $b^2 - 4ac = (-4)^2 - 4(3)(5) = 16 - 60 = -44$. Using $-16$ for $b^2$ gives $-76$.
- id: alg-q-2405
  lesson: alg-quad-formula
  module_quiz: true
  topic: Discriminant
  stem: 'How many real solutions does $x^2 - 6x + 9 = 0$ have?'
  choices: ['Two', 'One (a double root)', 'None', 'Infinitely many']
  answer: 1
  explanation: |-
    $D = 36 - 36 = 0$, so there is exactly one real solution, $x = 3$. The parabola touches the $x$-axis at its vertex.
- id: alg-q-2406
  lesson: alg-quad-formula
  topic: Discriminant
  stem: 'Describe the solutions of $2x^2 + x + 3 = 0$.'
  choices: ['No real solutions', 'One real solution', 'Two rational solutions', 'Two irrational solutions']
  answer: 0
  explanation: |-
    $D = 1 - 24 = -23 < 0$, so there are no real solutions; the parabola stays above the $x$-axis.
- id: alg-q-2407
  lesson: alg-quad-formula
  topic: Discriminant
  stem: 'Describe the solutions of $x^2 + 2x - 4 = 0$.'
  choices: ['Two rational solutions', 'Two irrational real solutions', 'One real solution', 'No real solutions']
  answer: 1
  explanation: |-
    $D = 4 + 16 = 20 > 0$, but 20 isn't a perfect square, so the two real roots $-1 \pm \sqrt5$ are irrational.
- id: alg-q-2408
  lesson: alg-quad-formula
  module_quiz: true
  topic: Discriminant
  stem: 'For which values of $k$ does $x^2 + kx + 16 = 0$ have exactly one real solution?'
  choices: ['$k = 64$ only', '$k = 4$ or $k = -4$', '$k = 16$ only', '$k = 8$ or $k = -8$']
  answer: 3
  explanation: |-
    One solution means $D = k^2 - 64 = 0$, so $k = \pm 8$. Then the equation is $(x \pm 4)^2 = 0$.
- id: alg-q-2409
  lesson: alg-quad-formula
  topic: Quadratic formula
  stem: 'Solve $5x^2 = 2x + 1$.'
  choices: ['$x = \dfrac{2 \pm \sqrt6}{10}$', '$x = \dfrac{-1 \pm \sqrt6}{5}$', '$x = \dfrac{1 \pm 2\sqrt6}{5}$', '$x = \dfrac{1 \pm \sqrt6}{5}$']
  answer: 3
  explanation: |-
    Standard form $5x^2 - 2x - 1 = 0$: $D = 4 + 20 = 24$, $\sqrt{24} = 2\sqrt6$. $x = \dfrac{2 \pm 2\sqrt6}{10} = \dfrac{1 \pm \sqrt6}{5}$.
- id: alg-q-2410
  lesson: alg-quad-formula
  topic: Quadratic formula
  stem: 'A student solving $x^2 - 4x - 5 = 0$ with the formula uses $b = 4$. What are the correct solutions?'
  choices: ['$x = 2 \pm \sqrt{29}$', '$x = -5$ or $x = 1$', '$x = 5$ or $x = -1$', '$x = 4 \pm \sqrt{5}$']
  answer: 2
  explanation: |-
    $b = -4$, so $-b = 4$: $x = \dfrac{4 \pm \sqrt{16 + 20}}{2} = \dfrac{4 \pm 6}{2}$, giving 5 and $-1$. Using $b = 4$ produces the opposite signs.
- id: alg-q-2411
  lesson: alg-quad-formula
  topic: Discriminant
  stem: 'A quadratic with integer coefficients has a discriminant that is a perfect square (like 49). What can you conclude?'
  choices: ['It has no real roots', 'Its roots are rational and it factors over the integers', 'It has a double root', 'The quadratic formula does not apply']
  answer: 1
  explanation: |-
    $\sqrt{D}$ is then an integer, so $\tfrac{-b \pm \sqrt D}{2a}$ is rational, and the quadratic factors with integer coefficients.
- id: alg-q-2412
  lesson: alg-quad-formula
  topic: Quadratic formula
  stem: 'To two decimal places, what is the positive solution of $x^2 + 3x - 7 = 0$?'
  choices: ['$3.08$', '$4.54$', '$-4.54$', '$1.54$']
  answer: 3
  explanation: |-
    $x = \dfrac{-3 \pm \sqrt{9 + 28}}{2} = \dfrac{-3 \pm \sqrt{37}}{2}$. The positive root is $\dfrac{-3 + 6.083}{2} \approx 1.54$.

- id: alg-q-2501
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'What is the vertex of $y = 3(x - 4)^2 + 1$?'
  choices: ['$(4, -1)$', '$(-4, 1)$', '$(4, 1)$', '$(3, 4)$']
  answer: 2
  explanation: |-
    In vertex form $a(x - h)^2 + k$, the vertex is $(h, k) = (4, 1)$.
- id: alg-q-2502
  lesson: alg-quad-graphs
  module_quiz: true
  topic: Quadratic functions
  stem: 'What is the vertex of $y = -(x + 2)^2 - 5$?'
  choices: ['$(-2, -5)$', '$(2, -5)$', '$(-2, 5)$', '$(2, 5)$']
  answer: 0
  explanation: |-
    $(x + 2)^2 = (x - (-2))^2$, so $h = -2$, and $k = -5$. The vertex $(-2, -5)$ is a maximum since $a = -1 < 0$.
- id: alg-q-2503
  lesson: alg-quad-graphs
  module_quiz: true
  topic: Quadratic functions
  stem: 'What is the vertex of $y = 2x^2 - 8x + 3$?'
  choices: ['$(2, -5)$', '$(-2, 27)$', '$(4, 3)$', '$(2, 3)$']
  answer: 0
  explanation: |-
    $h = -\tfrac{b}{2a} = -\tfrac{-8}{4} = 2$; $k = 2(4) - 16 + 3 = -5$. Forgetting the negative in $-\tfrac{b}{2a}$ gives $h = -2$.
- id: alg-q-2504
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'What is the axis of symmetry of $y = x^2 + 10x - 1$?'
  choices: ['$x = 5$', '$x = -5$', '$x = -10$', '$y = -5$']
  answer: 1
  explanation: |-
    $x = -\tfrac{b}{2a} = -\tfrac{10}{2} = -5$. The axis is a vertical line, so its equation is $x = \ldots$
- id: alg-q-2505
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'Which parabola opens downward and is narrower than $y = x^2$?'
  choices: ['$y = -\tfrac13 x^2$', '$y = -3x^2 + 1$', '$y = 3x^2 - 1$', '$y = \tfrac13 x^2 + 2$']
  answer: 1
  explanation: |-
    Downward needs $a < 0$; narrower needs $|a| > 1$. Only $a = -3$ does both. $-\tfrac13$ opens down but is wider.
- id: alg-q-2506
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'What is the range of $f(x) = -2(x - 1)^2 + 7$?'
  choices: ['$[7, \infty)$', '$(-\infty, 7]$', '$(-\infty, 1]$', '$(-\infty, \infty)$']
  answer: 1
  explanation: |-
    The parabola opens down with vertex $(1, 7)$, so 7 is the maximum value and every smaller value is reached.
- id: alg-q-2507
  lesson: alg-quad-graphs
  module_quiz: true
  topic: Quadratic functions
  stem: 'A parabola has vertex $(1, 3)$ and passes through $(3, 11)$. What is its equation?'
  choices: ['$y = 4(x - 1)^2 + 3$', '$y = 2(x + 1)^2 + 3$', '$y = 2(x - 1)^2 + 3$', '$y = (x - 1)^2 + 3$']
  answer: 2
  explanation: |-
    $y = a(x - 1)^2 + 3$. At $(3, 11)$: $11 = 4a + 3$, so $a = 2$.
- id: alg-q-2508
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'A parabola has $x$-intercepts $-2$ and 4 and passes through $(0, -16)$. What is its equation?'
  choices: ['$y = (x + 2)(x - 4)$', '$y = -2(x + 2)(x - 4)$', '$y = 2(x - 2)(x + 4)$', '$y = 2(x + 2)(x - 4)$']
  answer: 3
  explanation: |-
    Intercept form $y = a(x + 2)(x - 4)$. At $x = 0$: $-16 = a(2)(-4) = -8a$, so $a = 2$.
- id: alg-q-2509
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'Which is $y = x^2 - 4x - 5$ in vertex form?'
  choices: ['$y = (x - 4)^2 - 5$', '$y = (x + 2)^2 - 9$', '$y = (x - 2)^2 - 5$', '$y = (x - 2)^2 - 9$']
  answer: 3
  explanation: |-
    Half of $-4$ is $-2$; add and subtract 4: $(x^2 - 4x + 4) - 4 - 5 = (x - 2)^2 - 9$.
- id: alg-q-2510
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'How is the graph of $y = (x + 3)^2 - 2$ related to the graph of $y = x^2$?'
  choices: ['Shifted left 3 and up 2', 'Shifted right 3 and down 2', 'Shifted left 3 and down 2', 'Shifted right 2 and down 3']
  answer: 2
  explanation: |-
    The vertex moves from $(0, 0)$ to $(-3, -2)$: left 3, down 2. A $+3$ inside the square means a shift to the left.
- id: alg-q-2511
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'A parabola has $x$-intercepts 1 and 7. What is its axis of symmetry?'
  choices: ['$x = 8$', '$x = 3$', '$x = 4$', '$x = 6$']
  answer: 2
  explanation: |-
    The axis is halfway between the roots: $x = \tfrac{1 + 7}{2} = 4$.
- id: alg-q-2512
  lesson: alg-quad-graphs
  topic: Quadratic functions
  stem: 'What is the $y$-intercept of $y = -3x^2 + 5x - 8$?'
  choices: ['$(0, 5)$', '$(-8, 0)$', '$(0, -3)$', '$(0, -8)$']
  answer: 3
  explanation: |-
    Set $x = 0$: $y = -8$. In standard form the constant term is the $y$-intercept.

- id: alg-q-2601
  lesson: alg-quad-apps
  topic: Quadratic applications
  stem: 'A ball''s height in feet is $h(t) = -16t^2 + 64t + 5$. When does it reach its maximum height?'
  choices: ['1 second', '4 seconds', '2 seconds', '32 seconds']
  answer: 2
  explanation: |-
    $t = -\tfrac{b}{2a} = -\tfrac{64}{2(-16)} = 2$ seconds.
- id: alg-q-2602
  lesson: alg-quad-apps
  module_quiz: true
  topic: Quadratic applications
  stem: 'For $h(t) = -16t^2 + 64t + 5$ (feet), what is the maximum height?'
  choices: ['$69$ ft', '$5$ ft', '$64$ ft', '$133$ ft']
  answer: 0
  explanation: |-
    The maximum is at $t = 2$: $h(2) = -64 + 128 + 5 = 69$ feet. (133 comes from $+64$ instead of $-64$ for the first term.)
- id: alg-q-2603
  lesson: alg-quad-apps
  topic: Quadratic applications
  stem: 'With 200 m of fence around all four sides of a rectangle, what is the largest area you can enclose?'
  choices: ['$1{,}875$ m²', '$10{,}000$ m²', '$5{,}000$ m²', '$2{,}500$ m²']
  answer: 3
  explanation: |-
    With width $w$, length is $100 - w$ and $A = w(100 - w) = -w^2 + 100w$. Maximum at $w = 50$: a 50 by 50 square with area 2,500 m².
- id: alg-q-2604
  lesson: alg-quad-apps
  module_quiz: true
  topic: Quadratic applications
  stem: 'A rectangular pen along a river uses 200 m of fence on the other three sides. What is the largest possible area?'
  choices: ['$10{,}000$ m²', '$2{,}500$ m²', '$5{,}000$ m²', '$4{,}800$ m²']
  answer: 2
  explanation: |-
    Two sides of length $x$ and one of $200 - 2x$: $A = x(200 - 2x) = -2x^2 + 200x$. Maximum at $x = 50$, giving 50 m by 100 m, area 5,000 m².
