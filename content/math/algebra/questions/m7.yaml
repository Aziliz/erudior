# Module 7: Radicals, complex numbers, and rational expressions
- id: alg-q-2701
  lesson: alg-radicals
  module_quiz: true
  topic: Radicals
  stem: 'Write $\sqrt{72}$ in simplest radical form.'
  choices: ['$36\sqrt2$', '$3\sqrt8$', '$2\sqrt{18}$', '$6\sqrt2$']
  answer: 3
  explanation: |-
    The largest perfect-square factor of 72 is 36: $\sqrt{36 \cdot 2} = 6\sqrt2$. $3\sqrt8$ and $2\sqrt{18}$ have the right value but still contain perfect-square factors.
- id: alg-q-2702
  lesson: alg-radicals
  topic: Radicals
  stem: 'Simplify $\sqrt{12} + \sqrt{75}$.'
  choices: ['$10\sqrt3$', '$\sqrt{87}$', '$7\sqrt3$', '$7\sqrt6$']
  answer: 2
  explanation: |-
    $\sqrt{12} = 2\sqrt3$ and $\sqrt{75} = 5\sqrt3$, which are like radicals: $7\sqrt3$. Adding the radicands ($\sqrt{87}$) is not allowed.
- id: alg-q-2703
  lesson: alg-radicals
  module_quiz: true
  topic: Rational exponents
  stem: 'Evaluate $8^{2/3}$.'
  choices: ['$\tfrac{16}{3}$', '$4$', '$16$', '$2$']
  answer: 1
  explanation: |-
    Denominator = root, numerator = power: $\left(\sqrt[3]{8}\right)^2 = 2^2 = 4$. $\tfrac{16}{3}$ multiplies 8 by $\tfrac23$.
- id: alg-q-2704
  lesson: alg-radicals
  topic: Rational exponents
  stem: 'Evaluate $27^{-1/3}$.'
  choices: ['$-3$', '$\tfrac13$', '$-9$', '$\tfrac19$']
  answer: 1
  explanation: |-
    $27^{-1/3} = \dfrac{1}{27^{1/3}} = \dfrac{1}{3}$. The negative exponent means reciprocal, not a negative result.
- id: alg-q-2705
  lesson: alg-radicals
  topic: Radicals
  stem: 'Rationalize the denominator: $\dfrac{10}{\sqrt5}$.'
  choices: ['$2\sqrt5$', '$\tfrac{\sqrt5}{2}$', '$10\sqrt5$', '$5\sqrt2$']
  answer: 0
  explanation: |-
    Multiply by $\tfrac{\sqrt5}{\sqrt5}$: $\dfrac{10\sqrt5}{5} = 2\sqrt5$.
- id: alg-q-2706
  lesson: alg-radicals
  module_quiz: true
  topic: Radicals
  stem: 'Rationalize the denominator: $\dfrac{6}{2 + \sqrt3}$.'
  choices: ['$\tfrac{6(2 - \sqrt3)}{7}$', '$12 - 6\sqrt3$', '$12 + 6\sqrt3$', '$3 - \sqrt3$']
  answer: 1
  explanation: |-
    Multiply by the conjugate: $\dfrac{6(2 - \sqrt3)}{(2 + \sqrt3)(2 - \sqrt3)} = \dfrac{6(2 - \sqrt3)}{4 - 3} = 12 - 6\sqrt3$. The 7 comes from using $4 + 3$.
- id: alg-q-2707
  lesson: alg-radicals
  topic: Radicals
  stem: 'Multiply $(3 + \sqrt2)(3 - \sqrt2)$.'
  choices: ['$9 - \sqrt2$', '$11$', '$7$', '$7 - 6\sqrt2$']
  answer: 2
  explanation: |-
    Conjugates: $3^2 - (\sqrt2)^2 = 9 - 2 = 7$. The middle terms $\pm 3\sqrt2$ cancel.
- id: alg-q-2708
  lesson: alg-radicals
  topic: Radicals
  stem: 'Simplify $\sqrt{50x^4y^3}$ for $x, y \ge 0$.'
  choices: ['$5x^2y\sqrt{2y}$', '$25x^2y\sqrt{2y}$', '$5x^2y^3\sqrt2$', '$5x^4y\sqrt{2y}$']
  answer: 0
  explanation: |-
    $50x^4y^3 = (25x^4y^2)(2y)$, and $\sqrt{25x^4y^2} = 5x^2y$. So the result is $5x^2y\sqrt{2y}$.
- id: alg-q-2709
  lesson: alg-radicals
  topic: Rational exponents
  stem: 'Simplify $x^{1/2} \cdot x^{1/3}$ for $x > 0$.'
  choices: ['$x^{2/5}$', '$x^{1/6}$', '$x^{5/6}$', '$x^{1/5}$']
  answer: 2
  explanation: |-
    Add exponents: $\tfrac12 + \tfrac13 = \tfrac36 + \tfrac26 = \tfrac56$. Adding tops and bottoms separately gives the wrong $\tfrac25$.
- id: alg-q-2710
  lesson: alg-radicals
  topic: Radicals
  stem: 'Which statement is true?'
  choices: ['$\sqrt{9 + 16} = 7$', '$\sqrt{9 + 16} = 5$', '$\sqrt{9} + \sqrt{16} = 5$', '$\sqrt{25} = \pm 5$']
  answer: 1
  explanation: |-
    $\sqrt{25} = 5$. Roots don't split over sums ($\sqrt9 + \sqrt{16} = 7$), and the radical sign means the principal (nonnegative) root only.
- id: alg-q-2711
  lesson: alg-radicals
  topic: Radicals
  stem: 'Evaluate $\sqrt[3]{-125}$.'
  choices: ['Not a real number', '$-5$', '$5$', '$\pm 5$']
  answer: 1
  explanation: |-
    $(-5)^3 = -125$. Odd roots of negative numbers are real; only even roots of negatives aren't.
- id: alg-q-2712
  lesson: alg-radicals
  topic: Rational exponents
  stem: 'Write $\sqrt[4]{x^3}$ using a rational exponent.'
  choices: ['$x^{4/3}$', '$x^{3/4}$', '$x^{12}$', '$x^{-1}$']
  answer: 1
  explanation: |-
    The index 4 becomes the denominator and the power 3 the numerator: $x^{3/4}$.

- id: alg-q-2801
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Solve $\sqrt{x - 3} = 5$.'
  choices: ['$x = 22$', '$x = 8$', '$x = 28$', '$x = 2$']
  answer: 2
  explanation: |-
    Square both sides: $x - 3 = 25$, so $x = 28$. Check: $\sqrt{25} = 5$. Not squaring the 5 gives 8.
- id: alg-q-2802
  lesson: alg-radical-eq
  module_quiz: true
  topic: Radical equations
  stem: 'Solve $\sqrt{2x + 1} + 3 = 8$.'
  choices: ['$x = 27$', '$x = 2$', '$x = 12$', '$x = 24$']
  answer: 2
  explanation: |-
    Isolate: $\sqrt{2x + 1} = 5$. Square: $2x + 1 = 25$, so $x = 12$. Check: $\sqrt{25} + 3 = 8$.
- id: alg-q-2803
  lesson: alg-radical-eq
  module_quiz: true
  topic: Radical equations
  stem: 'Solve $\sqrt{x + 2} = x$.'
  choices: ['No solution', '$x = -1$', '$x = 2$ or $x = -1$', '$x = 2$']
  answer: 3
  explanation: |-
    Squaring: $x + 2 = x^2$, so $(x - 2)(x + 1) = 0$. Check: $x = 2$ gives $2 = 2$. $x = -1$ gives $\sqrt1 = 1 \ne -1$, so it's extraneous.
- id: alg-q-2804
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Solve $\sqrt{x + 5} = -3$.'
  choices: ['No solution', '$x = 4$', '$x = -14$', '$x = 14$']
  answer: 0
  explanation: |-
    A principal square root is never negative, so there's no solution. Squaring gives $x = 4$, but $\sqrt9 = 3 \ne -3$.
- id: alg-q-2805
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'What is an extraneous solution?'
  choices: ['A solution of a transformed equation that does not satisfy the original equation', 'A solution that is irrational', 'The larger of two solutions', 'A solution found only by graphing']
  answer: 0
  explanation: |-
    Squaring (or multiplying by an expression that can be zero) can add solutions. They solve the new equation but fail in the original, so they must be rejected.
- id: alg-q-2806
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Solve $\sqrt[3]{x - 1} = 2$.'
  choices: ['$x = 5$', '$x = 9$', '$x = 7$', '$x = 3$']
  answer: 1
  explanation: |-
    Cube both sides: $x - 1 = 8$, so $x = 9$. Squaring instead of cubing gives 5.
- id: alg-q-2807
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Solve $(x - 2)^{3/2} = 27$.'
  choices: ['$x = 7$', '$x = 20$', '$x = 11$', '$x = 83$']
  answer: 2
  explanation: |-
    Raise both sides to the $\tfrac23$ power: $x - 2 = 27^{2/3} = 9$, so $x = 11$. Check: $9^{3/2} = 27$.
- id: alg-q-2808
  lesson: alg-radical-eq
  module_quiz: true
  topic: Radical equations
  stem: 'A student solves $\sqrt{x} + 2 = 5$ by squaring both sides to get $x + 4 = 25$. What is the right approach?'
  choices: ['The student is right, so $x = 21$', 'Isolate the radical first: $\sqrt x = 3$, so $x = 9$', 'Square to get $x + 2 = 25$, so $x = 23$', 'Radical equations can''t be solved by squaring']
  answer: 1
  explanation: |-
    $(\sqrt x + 2)^2$ is $x + 4\sqrt x + 4$, not $x + 4$. Isolating first avoids that: $\sqrt x = 3$ and $x = 9$. Check: $3 + 2 = 5$.
- id: alg-q-2809
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Solve $\sqrt{3x + 4} = x$.'
  choices: ['$x = -1$', '$x = 4$', '$x = 4$ or $x = -1$', 'No solution']
  answer: 1
  explanation: |-
    Square: $3x + 4 = x^2$, so $(x - 4)(x + 1) = 0$. $x = 4$ checks ($\sqrt{16} = 4$); $x = -1$ gives $\sqrt1 = 1 \ne -1$, extraneous.
- id: alg-q-2810
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'A pendulum''s period is $T = 2\pi\sqrt{L/9.8}$ seconds ($L$ in meters). About how long is a pendulum with a 3-second period?'
  choices: ['About $4.68$ m', 'About $0.45$ m', 'About $2.23$ m', 'About $22.05$ m']
  answer: 2
  explanation: |-
    $\sqrt{L/9.8} = \tfrac{3}{2\pi}$, so $L = 9.8\left(\tfrac{3}{2\pi}\right)^2 \approx 9.8 \times 0.228 \approx 2.23$ m. Forgetting to square gives about 4.68.

- id: alg-q-2901
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Simplify $\sqrt{-49}$.'
  choices: ['$\pm 7$', '$-7$', '$7i$', '$49i$']
  answer: 2
  explanation: |-
    $\sqrt{-49} = i\sqrt{49} = 7i$. Check: $(7i)^2 = 49i^2 = -49$.
- id: alg-q-2902
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Simplify $(3 - 2i) + (-5 + 6i)$.'
  choices: ['$2i$', '$8 - 8i$', '$-2 - 8i$', '$-2 + 4i$']
  answer: 3
  explanation: |-
    Real parts: $3 - 5 = -2$. Imaginary parts: $-2 + 6 = 4$. So $-2 + 4i$.
- id: alg-q-2903
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Multiply $(4 + i)(2 - 3i)$.'
  choices: ['$11 - 10i$', '$5 - 10i$', '$8 - 3i$', '$11 - 14i$']
  answer: 0
  explanation: |-
    FOIL: $8 - 12i + 2i - 3i^2 = 8 - 10i + 3 = 11 - 10i$. Treating $-3i^2$ as $-3$ gives $5 - 10i$.
- id: alg-q-2904
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Simplify $i^{27}$.'
  choices: ['$-i$', '$i$', '$-1$', '$1$']
  answer: 0
  explanation: |-
    $27 = 4 \cdot 6 + 3$, so $i^{27} = i^3 = -i$.
- id: alg-q-2905
  lesson: alg-complex
  topic: Complex numbers
  stem: 'What is the complex conjugate of $-3 + 5i$?'
  choices: ['$5 - 3i$', '$3 - 5i$', '$3 + 5i$', '$-3 - 5i$']
  answer: 3
  explanation: |-
    The conjugate keeps the real part and changes the sign of the imaginary part: $-3 - 5i$.
- id: alg-q-2906
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Write $\dfrac{2 + 3i}{1 - i}$ in the form $a + bi$.'
  choices: ['$\tfrac52 + \tfrac52 i$', '$2 - 3i$', '$-\tfrac12 + \tfrac52 i$', '$-1 + 5i$']
  answer: 2
  explanation: |-
    Multiply by $\tfrac{1 + i}{1 + i}$: the numerator is $2 + 2i + 3i + 3i^2 = -1 + 5i$ and the denominator is $1 + 1 = 2$. Result: $-\tfrac12 + \tfrac52 i$.
- id: alg-q-2907
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Solve $x^2 + 25 = 0$.'
  choices: ['$x = \pm 5i$', '$x = \pm 5$', '$x = -5$', 'No solution of any kind']
  answer: 0
  explanation: |-
    $x^2 = -25$, so $x = \pm\sqrt{-25} = \pm 5i$. There are no real solutions, but there are two complex ones.
- id: alg-q-2908
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Solve $x^2 + 2x + 5 = 0$.'
  choices: ['$x = -2 \pm 4i$', '$x = 1 \pm 2i$', '$x = -1 \pm 4i$', '$x = -1 \pm 2i$']
  answer: 3
  explanation: |-
    $D = 4 - 20 = -16$, $\sqrt{-16} = 4i$. $x = \dfrac{-2 \pm 4i}{2} = -1 \pm 2i$.
- id: alg-q-2909
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Evaluate $\sqrt{-4} \cdot \sqrt{-9}$.'
  choices: ['$-6$', '$6$', '$6i$', '$-6i$']
  answer: 0
  explanation: |-
    Convert first: $(2i)(3i) = 6i^2 = -6$. Multiplying under one root, $\sqrt{36} = 6$, is invalid for two negative radicands.
- id: alg-q-2910
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Compute $(3 + 4i)(3 - 4i)$.'
  choices: ['$25$', '$-7$', '$9 - 16i$', '$7$']
  answer: 0
  explanation: |-
    $(a + bi)(a - bi) = a^2 + b^2 = 9 + 16 = 25$. Using $-16$ for $-16i^2$ gives $-7$.
- id: alg-q-2911
  lesson: alg-complex
  topic: Complex numbers
  stem: 'What is the imaginary part of $6 - 2i$?'
  choices: ['$-2i$', '$-2$', '$6$', '$2$']
  answer: 1
  explanation: |-
    For $a + bi$, the imaginary part is the real number $b$. Here $b = -2$.

- id: alg-q-3001
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x^2 - 9}{x^2 + x - 6}$.'
  choices: ['$\dfrac{x - 3}{x + 2}$', '$\dfrac{x + 3}{x - 2}$', '$\dfrac{-9}{x - 6}$', '$\dfrac{x - 3}{x - 2}$']
  answer: 3
  explanation: |-
    $\dfrac{(x - 3)(x + 3)}{(x + 3)(x - 2)} = \dfrac{x - 3}{x - 2}$, with $x \ne -3, 2$. Cancelling the $x^2$ terms gives the meaningless $\tfrac{-9}{x - 6}$.
- id: alg-q-3002
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Which values are excluded from the domain of $\dfrac{x + 1}{x^2 - 5x + 6}$?'
  choices: ['$x = 2$ and $x = 3$', '$x = -1$', '$x = -2$ and $x = -3$', '$x = 6$']
  answer: 0
  explanation: |-
    The denominator $(x - 2)(x - 3)$ is zero at 2 and 3. A zero numerator ($x = -1$) is allowed.
- id: alg-q-3003
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x + 6}{x + 3}$.'
  choices: ['$\dfrac{x + 2}{x + 1}$', '$2$', '$x + 2$', 'It is already in lowest terms']
  answer: 3
  explanation: |-
    There are no common factors; $x$ and 6 are terms, not factors. At $x = 1$ the expression is $\tfrac74$, not 2.
- id: alg-q-3004
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Simplify $\dfrac{5 - x}{x - 5}$.'
  choices: ['$-1$', '$1$', '$0$', '$x - 5$']
  answer: 0
  explanation: |-
    $5 - x = -(x - 5)$, so the quotient is $-1$ (for $x \ne 5$).
- id: alg-q-3005
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{2x^2 - 8}{4x + 8}$.'
  choices: ['$\dfrac{x + 2}{2}$', '$\dfrac{x - 2}{4}$', '$\dfrac{2x - 1}{4}$', '$\dfrac{x - 2}{2}$']
  answer: 3
  explanation: |-
    $\dfrac{2(x - 2)(x + 2)}{4(x + 2)} = \dfrac{x - 2}{2}$, with $x \ne -2$.
- id: alg-q-3006
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Multiply $\dfrac{x^2 - 4}{3x} \cdot \dfrac{6x^2}{x + 2}$.'
  choices: ['$2x(x + 2)$', '$\dfrac{x - 2}{2x}$', '$2x(x - 2)$', '$6x(x - 2)$']
  answer: 2
  explanation: |-
    $\dfrac{(x - 2)(x + 2)}{3x} \cdot \dfrac{6x^2}{x + 2}$: cancel $(x + 2)$ and $3x$ from $6x^2$, leaving $2x(x - 2)$.
- id: alg-q-3007
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Divide $\dfrac{x^2 - 1}{x + 3} \div \dfrac{x - 1}{x^2 + 3x}$.'
  choices: ['$x + 1$', '$\dfrac{x + 1}{x}$', '$\dfrac{(x - 1)^2}{x(x + 3)^2}$', '$x(x + 1)$']
  answer: 3
  explanation: |-
    Multiply by the reciprocal: $\dfrac{(x - 1)(x + 1)}{x + 3} \cdot \dfrac{x(x + 3)}{x - 1} = x(x + 1)$. Not flipping gives the third choice.
- id: alg-q-3008
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'The graph of $f(x) = \dfrac{x^2 - 1}{x - 1}$ looks like the line $y = x + 1$ except for what?'
  choices: ['A hole at $(-1, 0)$', 'A vertical asymptote at $x = 1$', 'A hole at $(1, 2)$', 'Nothing; it is exactly the line']
  answer: 2
  explanation: |-
    $f(x) = \dfrac{(x - 1)(x + 1)}{x - 1} = x + 1$ for $x \ne 1$. The factor cancels, so there's a hole, not an asymptote, at $x = 1$, where the line would have $y = 2$.
- id: alg-q-3009
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'A student simplifies $\dfrac{x + 5}{5}$ to $x$. What is wrong?'
  choices: ['The answer should be 1', 'Nothing; the answer is $x$', 'The answer should be $x + 1$', 'Only common factors cancel; 5 is a term of the numerator, not a factor']
  answer: 3
  explanation: |-
    $\dfrac{x + 5}{5} = \dfrac{x}{5} + 1$. Test $x = 5$: the original is 2, not 5.
- id: alg-q-3010
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Which values must be excluded in $\dfrac{x}{x + 4} \div \dfrac{x - 2}{x + 1}$?'
  choices: ['$-4$ and $2$ only', '$-4$ and $-1$ only', '$-4$, $-1$ and $2$', '$0$ and $2$']
  answer: 2
  explanation: |-
    Both original denominators can't be zero ($-4$, $-1$), and the divisor can't be zero, which happens when its numerator $x - 2 = 0$.

- id: alg-q-3101
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{2x + 3}{x - 1} - \dfrac{x + 4}{x - 1}$.'
  choices: ['$\dfrac{3x + 7}{x - 1}$', '$1$', '$\dfrac{x + 7}{x - 1}$', '$\dfrac{x - 1}{2x - 2}$']
  answer: 1
  explanation: |-
    $\dfrac{(2x + 3) - (x + 4)}{x - 1} = \dfrac{x - 1}{x - 1} = 1$ for $x \ne 1$. Not distributing the minus gives $\tfrac{x + 7}{x - 1}$.
- id: alg-q-3102
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'What is the least common denominator of $\dfrac{1}{x^2 - 4}$ and $\dfrac{1}{x^2 + 4x + 4}$?'
  choices: ['$(x - 2)(x + 2)^2$', '$(x^2 - 4)(x^2 + 4x + 4)$', '$(x - 2)(x + 2)$', '$(x + 2)^2$']
  answer: 0
  explanation: |-
    The denominators are $(x - 2)(x + 2)$ and $(x + 2)^2$. Take each factor to its highest power: $(x - 2)(x + 2)^2$. The full product works but is not least.
- id: alg-q-3103
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac1x + \dfrac1y$.'
  choices: ['$\dfrac{2}{x + y}$', '$\dfrac{x + y}{xy}$', '$\dfrac{1}{x + y}$', '$\dfrac{2}{xy}$']
  answer: 1
  explanation: |-
    LCD $xy$: $\dfrac{y}{xy} + \dfrac{x}{xy} = \dfrac{x + y}{xy}$. Denominators never add.
- id: alg-q-3104
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{3}{x} - \dfrac{2}{x + 1}$.'
  choices: ['$\dfrac{1}{x(x + 1)}$', '$\dfrac{x + 3}{x(x + 1)}$', '$\dfrac{5x + 3}{x(x + 1)}$', '$\dfrac{x - 3}{x(x + 1)}$']
  answer: 1
  explanation: |-
    $\dfrac{3(x + 1) - 2x}{x(x + 1)} = \dfrac{x + 3}{x(x + 1)}$. Subtracting only the numerators ($3 - 2$) skips the conversion to the LCD.
- id: alg-q-3105
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x}{x^2 - 9} - \dfrac{1}{x - 3}$.'
  choices: ['$\dfrac{3}{(x - 3)(x + 3)}$', '$\dfrac{-3}{(x - 3)(x + 3)}$', '$\dfrac{x - 1}{x^2 - 9}$', '$\dfrac{2x + 3}{(x - 3)(x + 3)}$']
  answer: 1
  explanation: |-
    $\dfrac{1}{x - 3} = \dfrac{x + 3}{(x - 3)(x + 3)}$. Then $\dfrac{x - (x + 3)}{(x - 3)(x + 3)} = \dfrac{-3}{(x - 3)(x + 3)}$. Dropping the parentheses gives $+3$.
- id: alg-q-3106
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{4}{x - 2} + \dfrac{1}{2 - x}$.'
  choices: ['$\dfrac{3}{x - 2}$', '$\dfrac{5}{x - 2}$', '$\dfrac{3}{2 - x}$', '$\dfrac{5}{(x - 2)(2 - x)}$']
  answer: 0
  explanation: |-
    $\dfrac{1}{2 - x} = \dfrac{-1}{x - 2}$, so the sum is $\dfrac{4 - 1}{x - 2} = \dfrac{3}{x - 2}$.
- id: alg-q-3107
  lesson: alg-rational-add
  module_quiz: true
  topic: Complex fractions
  stem: 'Simplify $\dfrac{1 + \dfrac1x}{1 - \dfrac{1}{x^2}}$.'
  choices: ['$\dfrac{1}{x - 1}$', '$\dfrac{x + 1}{x - 1}$', '$x$', '$\dfrac{x}{x - 1}$']
  answer: 3
  explanation: |-
    Multiply top and bottom by $x^2$: $\dfrac{x^2 + x}{x^2 - 1} = \dfrac{x(x + 1)}{(x - 1)(x + 1)} = \dfrac{x}{x - 1}$.
- id: alg-q-3108
  lesson: alg-rational-add
  topic: Complex fractions
  stem: 'Simplify $\dfrac{\tfrac12 + \tfrac13}{\tfrac14}$.'
  choices: ['$\tfrac85$', '$\tfrac{5}{24}$', '$\tfrac{10}{3}$', '$\tfrac12$']
  answer: 2
  explanation: |-
    The top is $\tfrac56$. Dividing by $\tfrac14$ means multiplying by 4: $\tfrac{20}{6} = \tfrac{10}{3}$. Multiplying by $\tfrac14$ instead gives $\tfrac{5}{24}$.
- id: alg-q-3109
  lesson: alg-rational-add
  topic: Complex fractions
  stem: 'Two resistors of 6 and 3 ohms in parallel have resistance $R = \dfrac{1}{\tfrac16 + \tfrac13}$. What is $R$?'
  choices: ['$4.5$ ohms', '$9$ ohms', '$2$ ohms', '$\tfrac12$ ohm']
  answer: 2
  explanation: |-
    $\tfrac16 + \tfrac13 = \tfrac12$, and its reciprocal is 2. Equivalently $\tfrac{R_1R_2}{R_1 + R_2} = \tfrac{18}{9} = 2$.
- id: alg-q-3110
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'A student writes $\dfrac{x}{x - 2} - \dfrac{x + 1}{x - 2} = \dfrac{x - x + 1}{x - 2} = \dfrac{1}{x - 2}$. What is the error?'
  choices: ['The result should be $\dfrac{2x + 1}{x - 2}$', 'Nothing is wrong', 'The denominators should be subtracted too', 'The minus sign must apply to all of $x + 1$; the result is $\dfrac{-1}{x - 2}$']
  answer: 3
  explanation: |-
    $x - (x + 1) = -1$, so the difference is $\dfrac{-1}{x - 2}$.

- id: alg-q-3201
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve $\dfrac{4}{x} + \dfrac13 = \dfrac{7}{x}$.'
  choices: ['$x = 33$', '$x = 3$', '$x = \tfrac94$', '$x = 9$']
  answer: 3
  explanation: |-
    Multiply by $3x$: $12 + x = 21$, so $x = 9$. Check: $\tfrac49 + \tfrac39 = \tfrac79$.
- id: alg-q-3202
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  stem: 'Solve $\dfrac{x}{x - 4} = \dfrac{4}{x - 4} + 3$.'
  choices: ['$x = 0$', '$x = 4$', 'No solution', '$x = -4$']
  answer: 2
  explanation: |-
    Multiply by $x - 4$: $x = 4 + 3(x - 4)$, so $-2x = -8$ and $x = 4$. But 4 makes the denominators zero, so it's extraneous and there's no solution.
- id: alg-q-3203
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve $\dfrac{2}{x + 1} = \dfrac{3}{x - 2}$.'
  choices: ['$x = 1$', '$x = 7$', '$x = -\tfrac15$', '$x = -7$']
  answer: 3
  explanation: |-
    Cross products: $2(x - 2) = 3(x + 1)$, so $2x - 4 = 3x + 3$ and $x = -7$. Check: $\tfrac{2}{-6} = \tfrac{3}{-9} = -\tfrac13$.
- id: alg-q-3204
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  stem: 'Solve $\dfrac{x}{x + 3} + \dfrac{2}{x - 3} = 1$.'
  choices: ['$x = -15$', '$x = 15$', '$x = 3$', '$x = 9$']
  answer: 1
  explanation: |-
    Multiply by $(x + 3)(x - 3)$: $x(x - 3) + 2(x + 3) = x^2 - 9$, so $-x + 6 = -9$ and $x = 15$. Check: $\tfrac{15}{18} + \tfrac{2}{12} = \tfrac56 + \tfrac16 = 1$.
- id: alg-q-3205
  lesson: alg-rational-eq
  module_quiz: true
  topic: Work and rate
  stem: 'One pipe fills a tank in 4 hours and another in 12 hours. How long do they take together?'
  choices: ['4 hours', '8 hours', '16 hours', '3 hours']
  answer: 3
  explanation: |-
    $\tfrac14 + \tfrac1{12} = \tfrac{4}{12} = \tfrac13$ tank per hour, so 3 hours. Averaging the times gives the wrong 8 hours.
- id: alg-q-3206
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'Two people together finish a job in 6 hours. One of them alone takes 10 hours. How long does the other take alone?'
  choices: ['16 hours', '4 hours', '15 hours', '8 hours']
  answer: 2
  explanation: |-
    $\tfrac1{10} + \tfrac1t = \tfrac16$, so $\tfrac1t = \tfrac16 - \tfrac1{10} = \tfrac{1}{15}$ and $t = 15$ hours. Subtracting the times (4) is a common error.
- id: alg-q-3207
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'A boat goes 24 km downstream in the same time it goes 16 km upstream. The current is 2 km/h. What is the boat''s speed in still water?'
  choices: ['20 km/h', '8 km/h', '12 km/h', '10 km/h']
  answer: 3
  explanation: |-
    $\dfrac{24}{b + 2} = \dfrac{16}{b - 2}$, so $24b - 48 = 16b + 32$ and $b = 10$. Check: $\tfrac{24}{12} = \tfrac{16}{8} = 2$ hours.
- id: alg-q-3208
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve the proportion $\dfrac{3}{8} = \dfrac{x}{20}$.'
  choices: ['$x = 53.3$', '$x = 7.5$', '$x = 10.7$', '$x = 15$']
  answer: 1
  explanation: |-
    Cross products: $8x = 60$, so $x = 7.5$.
- id: alg-q-3209
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Why must solutions of rational equations be checked?'
  choices: ['Multiplying by the LCD can introduce values that make an original denominator zero', 'The LCD is always negative', 'Rational equations never have real solutions', 'Cross products always change the sign of the answer']
  answer: 0
  explanation: |-
    The LCD is zero at the excluded values, and multiplying by zero can create false solutions. Any candidate that is an excluded value must be rejected.
- id: alg-q-3210
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'A recipe uses 3 cups of flour for 24 cookies. How much flour is needed for 40 cookies?'
  choices: ['5 cups', '6 cups', '4 cups', '8 cups']
  answer: 0
  explanation: |-
    $\dfrac{3}{24} = \dfrac{f}{40}$, so $24f = 120$ and $f = 5$ cups.
- id: alg-q-3211
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'A driver covers 120 miles at speed $r$ and then 150 miles at $r + 10$, spending equal time on each part. What is $r$?'
  choices: ['40 mph', '50 mph', '30 mph', '12 mph']
  answer: 0
  explanation: |-
    $\dfrac{120}{r} = \dfrac{150}{r + 10}$, so $120r + 1200 = 150r$ and $r = 40$. Each part takes 3 hours.
