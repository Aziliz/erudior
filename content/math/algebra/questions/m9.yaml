# Module 9: Exponential and logarithmic functions
- id: alg-q-3601
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'Which function is exponential?'
  choices: ['$f(x) = 2x^3$', '$f(x) = 3 \cdot 2^x$', '$f(x) = x^2 + 2$', '$f(x) = 3x + 2$']
  answer: 1
  explanation: |-
    In an exponential function the variable is in the exponent. $2x^3$ is a polynomial (the variable is the base).
- id: alg-q-3602
  lesson: alg-exp-functions
  module_quiz: true
  topic: Exponential functions
  stem: 'Describe $f(x) = 5(0.8)^x$.'
  choices: ['Growth, starting at 5', 'Decay, starting at 5', 'Decay, starting at 0.8', 'Growth, starting at 0.8']
  answer: 1
  explanation: |-
    The base $0.8$ is between 0 and 1, so the function decays (by 20% per step). The initial value is $f(0) = 5$.
- id: alg-q-3603
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'What is the horizontal asymptote of $y = 3^x$?'
  choices: ['$y = 1$', '$x = 0$', '$y = 0$', '$y = 3$']
  answer: 2
  explanation: |-
    As $x \to -\infty$, $3^x$ gets closer and closer to 0 but stays positive. The graph crosses the $y$-axis at 1, which is not an asymptote.
- id: alg-q-3604
  lesson: alg-exp-functions
  module_quiz: true
  topic: Compound interest
  stem: 'You invest $2,000 at 6% interest compounded annually. What is the balance after 3 years?'
  choices: ['$2,382.03', '$2,360.00', '$2,247.20', '$2,400.00']
  answer: 0
  explanation: |-
    $A = 2000(1.06)^3 \approx 2382.03$ dollars. $2,360 is simple interest, which ignores interest earned on interest.
- id: alg-q-3605
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'A population of 8,000 decreases by 5% per year. About how large is it after 4 years?'
  choices: ['About 9,724', 'About 6,400', 'About 6,516', 'About 6,800']
  answer: 2
  explanation: |-
    $8000(0.95)^4 \approx 6516$. Subtracting 20% all at once (6,400) treats the decay as linear; $1.05$ would be growth.
- id: alg-q-3606
  lesson: alg-exp-functions
  module_quiz: true
  topic: Exponential functions
  stem: 'A drug has a half-life of 6 hours. Of an 80 mg dose, how much remains after 18 hours?'
  choices: ['40 mg', '26.7 mg', '20 mg', '10 mg']
  answer: 3
  explanation: |-
    18 hours is 3 half-lives: $80 \to 40 \to 20 \to 10$ mg. In symbols, $80\left(\tfrac12\right)^{18/6} = 80 \cdot \tfrac18 = 10$.
- id: alg-q-3607
  lesson: alg-exp-functions
  topic: Compound interest
  stem: 'You invest $1,000 at 5% compounded continuously. What is the balance after 10 years?'
  choices: ['$1,648.72', '$1,628.89', '$1,500.00', '$1,050.00']
  answer: 0
  explanation: |-
    $A = Pe^{rt} = 1000e^{0.5} \approx 1648.72$ dollars. Annual compounding would give $1,628.89.
- id: alg-q-3608
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'To three decimal places, what is $e$?'
  choices: ['$2.000$', '$3.142$', '$1.414$', '$2.718$']
  answer: 3
  explanation: |-
    $e = \lim\left(1 + \tfrac1n\right)^n \approx 2.71828$. ($3.142$ is $\pi$ and $1.414$ is $\sqrt2$.)
- id: alg-q-3609
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'Compare $f(x) = 100x$ and $g(x) = 1.1^x$ for large positive $x$.'
  choices: ['They grow at the same rate', '$f(x) = 100x$ stays larger forever', '$g(x) = 1.1^x$ eventually exceeds $f(x) = 100x$', 'Neither function grows']
  answer: 2
  explanation: |-
    Any exponential with base greater than 1 eventually outgrows any linear function. Here $1.1^x$ passes $100x$ somewhere near $x = 97$.
- id: alg-q-3610
  lesson: alg-exp-functions
  topic: Compound interest
  stem: 'Which expression gives the balance on $500 at 3% compounded monthly for 4 years?'
  choices: ['$500\left(1 + \tfrac{0.03}{12}\right)^{48}$', '$500(1 + 0.03)^{48}$', '$500\left(1 + \tfrac{0.03}{12}\right)^{4}$', '$500(1.03)^{4/12}$']
  answer: 0
  explanation: |-
    $A = P\left(1 + \tfrac rn\right)^{nt}$ with $n = 12$ and $t = 4$: the monthly rate is $\tfrac{0.03}{12}$ and there are 48 months.
- id: alg-q-3611
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'A function has the values $\;\begin{array}{c|cccc} x & 0 & 1 & 2 & 3 \\ \hline y & 3 & 6 & 12 & 24 \end{array}\;$. Which equation fits?'
  choices: ['$y = 3 \cdot 2^x$', '$y = 3x + 3$', '$y = 2 \cdot 3^x$', '$y = 6x$']
  answer: 0
  explanation: |-
    The $y$-values double each step (a constant ratio), so the function is exponential with base 2 and initial value $y(0) = 3$.

- id: alg-q-3701
  lesson: alg-logs
  module_quiz: true
  topic: Logarithms
  stem: 'Evaluate $\log_2 64$.'
  choices: ['$6$', '$32$', '$8$', '$5$']
  answer: 0
  explanation: |-
    $2^6 = 64$, so $\log_2 64 = 6$. A logarithm is an exponent, not a quotient.
- id: alg-q-3702
  lesson: alg-logs
  topic: Logarithms
  stem: 'Evaluate $\log_5 \tfrac{1}{125}$.'
  choices: ['$-\tfrac13$', '$3$', '$\tfrac13$', '$-3$']
  answer: 3
  explanation: |-
    $\tfrac{1}{125} = 5^{-3}$, so the logarithm is $-3$.
- id: alg-q-3703
  lesson: alg-logs
  topic: Logarithms
  stem: 'Evaluate $\log_8 2$.'
  choices: ['$4$', '$3$', '$\tfrac13$', '$-3$']
  answer: 2
  explanation: |-
    $8^{1/3} = 2$, so $\log_8 2 = \tfrac13$. (It's the reciprocal of $\log_2 8 = 3$.)
- id: alg-q-3704
  lesson: alg-logs
  topic: Logarithms
  stem: 'Which is $\log_3 x = 4$ in exponential form?'
  choices: ['$x^4 = 3$', '$3^4 = x$', '$4^3 = x$', '$3^x = 4$']
  answer: 1
  explanation: |-
    $\log_b x = y$ means $b^y = x$: base 3, exponent 4. So $x = 81$.
- id: alg-q-3705
  lesson: alg-logs
  topic: Logarithms
  stem: 'Simplify $\ln e^5$.'
  choices: ['$e^5$', '$5$', '$1$', '$5e$']
  answer: 1
  explanation: |-
    $\ln$ and $e^x$ are inverses: $\ln e^5 = 5$.
- id: alg-q-3706
  lesson: alg-logs
  module_quiz: true
  topic: Logarithms
  stem: 'Expand $\log(100x^3)$ for $x > 0$.'
  choices: ['$2 + 3\log x$', '$100 + 3\log x$', '$2 \cdot 3\log x$', '$3\log(100x)$']
  answer: 0
  explanation: |-
    Product rule: $\log 100 + \log x^3$. Then $\log 100 = 2$ and the power rule gives $3\log x$. The exponent 3 applies only to $x$, so $3\log(100x)$ is wrong.
- id: alg-q-3707
  lesson: alg-logs
  topic: Logarithms
  stem: 'Condense $\log_2 x + \log_2 8 - \log_2 y$.'
  choices: ['$\log_2 \dfrac{x + 8}{y}$', '$\log_2(8x - y)$', '$\log_2 \dfrac{8x}{y}$', '$3\log_2 \dfrac{x}{y}$']
  answer: 2
  explanation: |-
    Adding logs multiplies the arguments and subtracting divides: $\log_2 \dfrac{8x}{y}$ (which also equals $3 + \log_2 \tfrac xy$).
- id: alg-q-3708
  lesson: alg-logs
  topic: Logarithms
  stem: 'Which statement is true for all positive $M$ and $N$?'
  choices: ['$(\log M)^2 = 2\log M$', '$\log(M + N) = \log M + \log N$', '$\log M \cdot \log N = \log(MN)$', '$\log(MN) = \log M + \log N$']
  answer: 3
  explanation: |-
    That's the product rule. There is no rule for the log of a sum, and the power rule needs the exponent on the argument: $\log M^2 = 2\log M$, not $(\log M)^2$.
- id: alg-q-3709
  lesson: alg-logs
  module_quiz: true
  topic: Logarithms
  stem: 'Use change of base to evaluate $\log_4 30$ to three decimal places.'
  choices: ['$1.477$', '$0.408$', '$7.5$', '$2.453$']
  answer: 3
  explanation: |-
    $\dfrac{\ln 30}{\ln 4} \approx \dfrac{3.4012}{1.3863} \approx 2.453$. Check: $4^2 = 16 < 30 < 64 = 4^3$. Dividing the other way gives 0.408.
- id: alg-q-3710
  lesson: alg-logs
  topic: Logarithms
  stem: 'If $\log_b 2 = 0.3$ and $\log_b 5 = 0.7$, what is $\log_b 20$?'
  choices: ['$2.1$', '$0.42$', '$1.0$', '$1.3$']
  answer: 3
  explanation: |-
    $20 = 2^2 \cdot 5$, so $\log_b 20 = 2(0.3) + 0.7 = 1.3$.
- id: alg-q-3711
  lesson: alg-logs
  topic: Logarithms
  stem: 'What is the domain of $f(x) = \log(x - 3)$?'
  choices: ['$(0, \infty)$', '$[3, \infty)$', '$(-3, \infty)$', '$(3, \infty)$']
  answer: 3
  explanation: |-
    The argument must be positive: $x - 3 > 0$, so $x > 3$. The log of 0 is undefined, so 3 is excluded.
- id: alg-q-3712
  lesson: alg-logs
  topic: Logarithms
  stem: 'For any valid base $b$, what is $\log_b 1$?'
  choices: ['$b$', '$1$', '$0$', 'Undefined']
  answer: 2
  explanation: |-
    $b^0 = 1$, so $\log_b 1 = 0$. That's why every log graph passes through $(1, 0)$.

- id: alg-q-3801
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'Solve $2^{x - 1} = 32$.'
  choices: ['$x = 5$', '$x = 6$', '$x = 4$', '$x = 17$']
  answer: 1
  explanation: |-
    $32 = 2^5$, so $x - 1 = 5$ and $x = 6$.
- id: alg-q-3802
  lesson: alg-exp-log-eq
  module_quiz: true
  topic: Exponential equations
  stem: 'Solve $27^x = 9^{x + 1}$.'
  choices: ['$x = -2$', '$x = 1$', '$x = 2$', '$x = \tfrac23$']
  answer: 2
  explanation: |-
    $3^{3x} = 3^{2(x + 1)}$, so $3x = 2x + 2$ and $x = 2$. Check: $27^2 = 729 = 9^3$.
- id: alg-q-3803
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'Solve $5^x = 40$.'
  choices: ['$x \approx 2.292$', '$x = 8$', '$x \approx 0.436$', '$x \approx 1.602$']
  answer: 0
  explanation: |-
    $x = \dfrac{\ln 40}{\ln 5} \approx 2.292$. Check: $5^2 = 25 < 40 < 125 = 5^3$. $1.602$ is just $\log 40$.
- id: alg-q-3804
  lesson: alg-exp-log-eq
  module_quiz: true
  topic: Exponential equations
  stem: 'Solve $3e^{2x} = 30$.'
  choices: ['$x \approx 1.700$', '$x \approx 2.303$', '$x \approx 1.151$', '$x = 5$']
  answer: 2
  explanation: |-
    Isolate: $e^{2x} = 10$. Take $\ln$: $2x = \ln 10$, so $x \approx 1.151$. Taking $\ln$ before dividing by 3 leads to $\tfrac{\ln 30}{2} \approx 1.700$.
- id: alg-q-3805
  lesson: alg-exp-log-eq
  topic: Logarithmic equations
  stem: 'Solve $\log_3(2x + 1) = 2$.'
  choices: ['$x = \tfrac12$', '$x = \tfrac52$', '$x = 13$', '$x = 4$']
  answer: 3
  explanation: |-
    Exponential form: $2x + 1 = 3^2 = 9$, so $x = 4$. Using $3 \cdot 2 = 6$ instead of $3^2$ gives $\tfrac52$.
- id: alg-q-3806
  lesson: alg-exp-log-eq
  module_quiz: true
  topic: Logarithmic equations
  stem: 'Solve $\log x + \log(x - 3) = 1$.'
  choices: ['$x = 5$', '$x = -2$', '$x = 5$ or $x = -2$', 'No solution']
  answer: 0
  explanation: |-
    $\log[x(x - 3)] = 1$, so $x^2 - 3x = 10$ and $(x - 5)(x + 2) = 0$. Reject $x = -2$ because $\log(-2)$ is undefined. Check: $\log 5 + \log 2 = \log 10 = 1$.
- id: alg-q-3807
  lesson: alg-exp-log-eq
  topic: Logarithmic equations
  stem: 'Solve $\ln(3x - 2) = \ln(x + 6)$.'
  choices: ['$x = 4$', '$x = 2$', '$x = -4$', '$x = 1$']
  answer: 0
  explanation: |-
    Logs are one-to-one: $3x - 2 = x + 6$, so $x = 4$. Both arguments are 10, which is positive.
- id: alg-q-3808
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'At 8% interest compounded annually, about how long does it take money to double?'
  choices: ['About 12.5 years', 'About 9.0 years', 'About 8.0 years', 'About 25 years']
  answer: 1
  explanation: |-
    $1.08^t = 2$, so $t = \dfrac{\ln 2}{\ln 1.08} \approx 9.0$ years. (Simple interest would take 12.5 years.)
- id: alg-q-3809
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'A quantity decays as $A = A_0e^{-0.05t}$. What is its half-life?'
  choices: ['About 10', 'About 13.9', 'About 0.035', 'About 20']
  answer: 1
  explanation: |-
    $e^{-0.05t} = \tfrac12$ gives $t = \dfrac{\ln 2}{0.05} \approx 13.9$ time units.
- id: alg-q-3810
  lesson: alg-exp-log-eq
  topic: Logarithmic equations
  stem: 'A student solves $\log_2(x + 3) = 5$ by writing $x + 3 = 10$. What is correct?'
  choices: ['$x + 3 = \log 5$', '$x + 3 = 5^2 = 25$, so $x = 22$', 'The base is 2, so $x + 3 = 2^5 = 32$ and $x = 29$', 'The student is right, so $x = 7$']
  answer: 2
  explanation: |-
    $\log_b M = c$ means $M = b^c$. Here $b = 2$ and $c = 5$, so $M = 32$.
- id: alg-q-3811
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'Solve $e^{2x} - 3e^x + 2 = 0$.'
  choices: ['$x = 1$ or $x = 2$', '$x = 0$ or $x = \ln 2$', '$x = \ln 2$ only', '$x = 0$ only']
  answer: 1
  explanation: |-
    With $u = e^x$: $u^2 - 3u + 2 = (u - 1)(u - 2) = 0$. So $e^x = 1$ ($x = 0$) or $e^x = 2$ ($x = \ln 2$). The values 1 and 2 are for $u$, not $x$.
- id: alg-q-3812
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'How long until $1,000 grows to $3,000 at 6% compounded continuously?'
  choices: ['About 50 years', 'About 18.3 years', 'About 33.3 years', 'About 6.6 years']
  answer: 1
  explanation: |-
    $3000 = 1000e^{0.06t}$, so $e^{0.06t} = 3$ and $t = \dfrac{\ln 3}{0.06} \approx 18.3$ years.
