# Module 2: Inequalities and absolute value
- id: alg-q-0601
  lesson: alg-inequalities
  module_quiz: true
  topic: Linear inequalities
  stem: 'Solve $-4x + 3 > 15$.'
  choices: ['$x < -3$', '$x > -3$', '$x < 3$', '$x < -\tfrac{9}{2}$']
  answer: 0
  explanation: |-
    Subtract 3: $-4x > 12$. Divide by $-4$ and reverse the symbol: $x < -3$. Forgetting to reverse gives $x > -3$.
- id: alg-q-0602
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'Which interval represents $-2 \le x < 5$?'
  choices: ['$(-2, 5]$', '$(-2, 5)$', '$[-2, 5]$', '$[-2, 5)$']
  answer: 3
  explanation: |-
    $-2$ is included (bracket) and 5 is not (parenthesis): $[-2, 5)$.
- id: alg-q-0603
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'Which is $x \le 7$ in interval notation?'
  choices: ['$(-\infty, 7]$', '$(-\infty, 7)$', '$[7, \infty)$', '$(7, \infty)$']
  answer: 0
  explanation: |-
    All numbers up to and including 7: $(-\infty, 7]$. Infinity always gets a parenthesis, and 7 gets a bracket because it is included.
- id: alg-q-0604
  lesson: alg-inequalities
  module_quiz: true
  topic: Linear inequalities
  stem: 'Solve $5 - 2x \le 3x + 20$.'
  choices: ['$x \le -3$', '$x \le 3$', '$x \ge 3$', '$x \ge -3$']
  answer: 3
  explanation: |-
    Add $2x$ and subtract 20: $-15 \le 5x$. Divide by 5 (positive, no flip): $-3 \le x$, that is $x \ge -3$. Check $x = 0$: $5 \le 20$, true.
- id: alg-q-0605
  lesson: alg-inequalities
  topic: Compound inequalities
  stem: 'Solve $-1 < 3x + 2 \le 11$ and write the answer as an interval.'
  choices: ['$(-1, 3]$', '$[-1, 3)$', '$(-1, 3)$', '$(-\tfrac13, 3]$']
  answer: 0
  explanation: |-
    Subtract 2 from all three parts: $-3 < 3x \le 9$. Divide by 3: $-1 < x \le 3$, which is $(-1, 3]$. The left end is open because the original symbol was $<$.
- id: alg-q-0606
  lesson: alg-inequalities
  module_quiz: true
  topic: Compound inequalities
  stem: 'Solve $4 \le 6 - 2x < 10$.'
  choices: ['$[-2, 1)$', '$(-\infty, -2) \cup [1, \infty)$', '$(-2, 1]$', '$[-1, 2)$']
  answer: 2
  explanation: |-
    Subtract 6: $-2 \le -2x < 4$. Divide all parts by $-2$ and reverse both symbols: $1 \ge x > -2$. In increasing order, $-2 < x \le 1$, which is $(-2, 1]$. Not reversing the symbols leads to the wrong brackets $[-2, 1)$.
- id: alg-q-0607
  lesson: alg-inequalities
  module_quiz: true
  topic: Compound inequalities
  stem: 'Solve $x - 1 < -4$ or $2x \ge 6$.'
  choices: ['$(-3, 3]$', '$(-\infty, -3) \cup [3, \infty)$', '$(-\infty, -3] \cup (3, \infty)$', '$[-3, 3)$']
  answer: 1
  explanation: |-
    First part: $x < -3$. Second part: $x \ge 3$. "Or" means union: $(-\infty, -3) \cup [3, \infty)$.
- id: alg-q-0608
  lesson: alg-inequalities
  topic: Compound inequalities
  stem: 'Which compound inequality has no solution?'
  choices: ['$x > 2$ and $x < 6$', '$x > 6$ or $x < 2$', '$x > 6$ and $x < 2$', '$x < 6$ or $x > 2$']
  answer: 2
  explanation: |-
    No number is both greater than 6 and less than 2, so the intersection is empty. "$x < 6$ or $x > 2$" is the opposite extreme: every real number satisfies it.
- id: alg-q-0609
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'A student solves $-3x + 1 \le 10$. Step 1: $-3x \le 9$. Step 2: $x \le -3$. Which statement is correct?'
  choices: ['Step 1 is wrong; it should be $-3x \le 11$', 'Step 2 is wrong; dividing by $-3$ reverses the symbol, giving $x \ge -3$', 'Step 2 is wrong; it should be $x \le 3$', 'There is no error']
  answer: 1
  explanation: |-
    Step 1 correctly subtracts 1. In step 2 the division is by a negative number, so the symbol must flip: $x \ge -3$. Check $x = 0$: $1 \le 10$ is true, but 0 isn't in $x \le -3$.
- id: alg-q-0610
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'An event hall charges $300 plus $18 per guest. With a budget of at most $1,200, what is the greatest number of guests you can invite?'
  choices: ['$83$', '$66$', '$50$', '$49$']
  answer: 2
  explanation: |-
    $300 + 18g \le 1200$, so $18g \le 900$ and $g \le 50$. Ignoring the $300 fee gives about 66.
- id: alg-q-0611
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'A number line shows an open dot at 4 with shading to the left. Which inequality does it show?'
  choices: ['$x \le 4$', '$x < 4$', '$x > 4$', '$x \ge 4$']
  answer: 1
  explanation: |-
    An open dot means 4 is not included, and shading to the left means smaller numbers: $x < 4$.
- id: alg-q-0612
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'Solve $\dfrac{x}{-2} \ge 3$.'
  choices: ['$x \ge -6$', '$x \le -6$', '$x \ge -\tfrac32$', '$x \le -\tfrac32$']
  answer: 1
  explanation: |-
    Multiply both sides by $-2$ and reverse the symbol: $x \le -6$. Check $x = -8$: $\tfrac{-8}{-2} = 4 \ge 3$. True.
- id: alg-q-0613
  lesson: alg-inequalities
  topic: Compound inequalities
  stem: 'Which set is $(-\infty, 4) \cap [1, \infty)$?'
  choices: ['$[1, 4)$', '$(-\infty, \infty)$', '$(1, 4]$', '$(-\infty, 1] \cup (4, \infty)$']
  answer: 0
  explanation: |-
    The intersection is the overlap: numbers at least 1 and less than 4, $[1, 4)$. The union of the two sets would be all real numbers.
- id: alg-q-0614
  lesson: alg-inequalities
  topic: Linear inequalities
  stem: 'Your first three test scores are 78, 85 and 90. What must the fourth score $s$ be for your average to be at least 85?'
  choices: ['$s \ge 85$', '$s \ge 87$', '$s \ge 88$', '$s \ge 82$']
  answer: 1
  explanation: |-
    $\dfrac{78 + 85 + 90 + s}{4} \ge 85$. Multiply by 4: $253 + s \ge 340$, so $s \ge 87$.

- id: alg-q-0701
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  stem: 'Solve $|x - 3| = 8$.'
  choices: ['$x = -5$ only', '$x = 11$ only', '$x = 5$ or $x = -11$', '$x = 11$ or $x = -5$']
  answer: 3
  explanation: |-
    $x - 3 = 8$ gives $x = 11$; $x - 3 = -8$ gives $x = -5$. Both are 8 units from 3.
- id: alg-q-0702
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Solve $2|x + 1| - 3 = 7$.'
  choices: ['$x = 4$ or $x = -4$', '$x = 4$ or $x = -3$', '$x = 4$ or $x = -6$', '$x = 6$ or $x = -4$']
  answer: 2
  explanation: |-
    Isolate first: $2|x + 1| = 10$, so $|x + 1| = 5$. Then $x + 1 = 5$ or $x + 1 = -5$: $x = 4$ or $x = -6$. Splitting before isolating gives the wrong $-3$.
- id: alg-q-0703
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  stem: 'Solve $|3x + 2| + 6 = 1$.'
  choices: ['$x = 1$ or $x = -\tfrac73$', '$x = -\tfrac{7}{3}$ only', '$x = -1$ or $x = \tfrac13$', 'No solution']
  answer: 3
  explanation: |-
    Isolating gives $|3x + 2| = -5$. An absolute value is never negative, so there is no solution. Splitting anyway produces two values that fail the check.
- id: alg-q-0704
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Solve $|2x - 1| < 7$.'
  choices: ['$-3 < x < 4$', '$x < -3$ or $x > 4$', '$-4 < x < 3$', '$x < 4$']
  answer: 0
  explanation: |-
    Less than becomes between: $-7 < 2x - 1 < 7$. Add 1: $-6 < 2x < 8$. Divide by 2: $-3 < x < 4$.
- id: alg-q-0705
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  stem: 'Solve $|x + 2| \ge 5$.'
  choices: ['$-7 \le x \le 3$', '$x \le -7$ or $x \ge 3$', '$x \le -3$ or $x \ge 7$', '$x \ge 3$']
  answer: 1
  explanation: |-
    Greater than becomes "or": $x + 2 \le -5$ or $x + 2 \ge 5$, so $x \le -7$ or $x \ge 3$. These are the numbers at least 5 units from $-2$.
- id: alg-q-0706
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Which of these has no solution?'
  choices: ['$|x - 1| < 0.5$', '$|x + 4| > -2$', '$|2x| \le -1$', '$|x| = 0$']
  answer: 2
  explanation: |-
    $|2x|$ is never negative, so it can't be at most $-1$. By contrast, $|x + 4| > -2$ is true for every $x$, and $|x| = 0$ has the solution $x = 0$.
- id: alg-q-0707
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Which inequality describes all numbers within 3 units of 5?'
  choices: ['$|x - 5| \le 3$', '$|x - 3| \le 5$', '$|x + 5| \le 3$', '$|x - 5| \ge 3$']
  answer: 0
  explanation: |-
    The distance from $x$ to 5 is $|x - 5|$, and "within 3" means at most 3: $|x - 5| \le 3$, which is $2 \le x \le 8$.
- id: alg-q-0708
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Solve $|x - 2| = |x + 6|$.'
  choices: ['No solution', '$x = 2$ or $x = -6$', '$x = -2$', '$x = -2$ or $x = 4$']
  answer: 2
  explanation: |-
    Either $x - 2 = x + 6$ (which gives $-2 = 6$, impossible) or $x - 2 = -(x + 6)$, giving $2x = -4$ and $x = -2$. Check: $|-4| = |4|$. Geometrically, $-2$ is the point midway between 2 and $-6$.
- id: alg-q-0709
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  stem: 'A student solves $|x - 4| > 2$ by writing $-2 > x - 4 > 2$, so $2 > x > 6$. What is the error?'
  choices: ['There is no error', 'A greater-than absolute value inequality splits into "or": $x - 4 < -2$ or $x - 4 > 2$', 'Both 2s should be $-2$', 'The student should have squared both sides first']
  answer: 1
  explanation: |-
    No number is both less than 2 and greater than 6. Greater than means far from the center, so use "or": $x < 2$ or $x > 6$.
- id: alg-q-0710
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Solve $|4 - x| \le 1$.'
  choices: ['$(-\infty, 3] \cup [5, \infty)$', '$[-5, -3]$', '$[3, 5]$', '$(3, 5)$']
  answer: 2
  explanation: |-
    $-1 \le 4 - x \le 1$. Subtract 4: $-5 \le -x \le -3$. Multiply by $-1$ and reverse: $5 \ge x \ge 3$, so $[3, 5]$. ($|4 - x| = |x - 4|$, the distance from 4.)
- id: alg-q-0711
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'For which $x$ does the graph of $y = |x + 1|$ lie below the line $y = 4$?'
  choices: ['$-4 < x < 4$', '$-3 < x < 5$', '$x < -5$ or $x > 3$', '$-5 < x < 3$']
  answer: 3
  explanation: |-
    Solve $|x + 1| < 4$: $-4 < x + 1 < 4$, so $-5 < x < 3$. The V has its corner at $x = -1$ and reaches height 4 at $x = -5$ and $x = 3$.
- id: alg-q-0712
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'A machined rod''s diameter $d$ must satisfy $|d - 12| \le 0.05$ (in mm). Which diameters are acceptable?'
  choices: ['$11.5 \le d \le 12.5$', '$d \le 11.95$ or $d \ge 12.05$', '$12 \le d \le 12.05$', '$11.95 \le d \le 12.05$']
  answer: 3
  explanation: |-
    $-0.05 \le d - 12 \le 0.05$, so $11.95 \le d \le 12.05$: within 0.05 mm of 12 mm on either side.
- id: alg-q-0713
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'How many integers satisfy $|x| < 3$?'
  choices: ['$5$', '$7$', '$6$', '$3$']
  answer: 0
  explanation: |-
    $|x| < 3$ means $-3 < x < 3$. The integers are $-2, -1, 0, 1, 2$: five of them. The endpoints $\pm3$ are excluded.
