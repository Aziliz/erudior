# Module 1: Foundations and linear equations
- id: alg-q-0101
  lesson: alg-real-numbers
  module_quiz: true
  topic: Real numbers
  stem: 'Which is the most specific set that contains $-7$?'
  choices: ['Natural numbers', 'Whole numbers', 'Integers', 'Irrational numbers']
  answer: 2
  explanation: |-
    $-7$ is negative, so it isn't natural or whole. It is an integer (and therefore also rational and real). It can't be irrational, since $-7 = \tfrac{-7}{1}$.
- id: alg-q-0102
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Which number is irrational?'
  choices: ['$\sqrt{36}$', '$0.\overline{45}$', '$\tfrac{22}{7}$', '$\sqrt{20}$']
  answer: 3
  explanation: |-
    $\sqrt{36} = 6$, $0.\overline{45} = \tfrac{5}{11}$ and $\tfrac{22}{7}$ are all ratios of integers. 20 is not a perfect square, so $\sqrt{20} = 2\sqrt5$ is irrational. ($\tfrac{22}{7}$ is only an approximation of $\pi$; it is itself rational.)
- id: alg-q-0103
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Evaluate $|-12| - |5|$.'
  choices: ['$7$', '$-17$', '$17$', '$-7$']
  answer: 0
  explanation: |-
    $|-12| = 12$ and $|5| = 5$, so the value is $12 - 5 = 7$. Getting $-17$ means treating $|-12|$ as $-12$.
- id: alg-q-0104
  lesson: alg-real-numbers
  module_quiz: true
  topic: Real numbers
  stem: 'What is the distance between $-8$ and $3$ on the number line?'
  choices: ['$5$', '$11$', '$-11$', '$-5$']
  answer: 1
  explanation: |-
    Distance is $|3 - (-8)| = |11| = 11$. A distance can't be negative, and 5 comes from computing $|3 + (-8)|$ instead of the difference.
- id: alg-q-0105
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Which property justifies $7(x + 2) = 7x + 14$?'
  choices: ['Commutative property of multiplication', 'Associative property of multiplication', 'Distributive property', 'Identity property of multiplication']
  answer: 2
  explanation: |-
    Multiplying 7 by each term of a sum, $a(b + c) = ab + ac$, is the distributive property.
- id: alg-q-0106
  lesson: alg-real-numbers
  module_quiz: true
  topic: Real numbers
  stem: 'Which property justifies $(3 + x) + 5 = 3 + (x + 5)$?'
  choices: ['Associative property of addition', 'Commutative property of addition', 'Distributive property', 'Inverse property of addition']
  answer: 0
  explanation: |-
    The numbers stay in the same order; only the grouping changes. That's the associative property. The commutative property would change the order, as in $3 + x = x + 3$.
- id: alg-q-0107
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Compute $\dfrac{2}{3} + \dfrac{3}{5}$.'
  choices: ['$\tfrac{5}{8}$', '$\tfrac{19}{15}$', '$\tfrac{2}{5}$', '$\tfrac{1}{3}$']
  answer: 1
  explanation: |-
    Common denominator 15: $\tfrac{10}{15} + \tfrac{9}{15} = \tfrac{19}{15}$. Adding straight across gives the wrong $\tfrac58$; $\tfrac25$ is the product, not the sum.
- id: alg-q-0108
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Compute $-\dfrac{3}{4} \div \dfrac{9}{8}$.'
  choices: ['$-\tfrac{27}{32}$', '$\tfrac{2}{3}$', '$-\tfrac{3}{2}$', '$-\tfrac{2}{3}$']
  answer: 3
  explanation: |-
    Multiply by the reciprocal of the divisor: $-\tfrac34 \cdot \tfrac89 = -\tfrac{24}{36} = -\tfrac23$. $-\tfrac{27}{32}$ multiplies without flipping, and $-\tfrac32$ flips the wrong fraction.
- id: alg-q-0109
  lesson: alg-real-numbers
  module_quiz: true
  topic: Real numbers
  stem: 'Which statement is true?'
  choices: ['$-4 > -1$', '$-\tfrac12 < -\tfrac13$', '$|-6| < 5$', '$0 > |-2|$']
  answer: 1
  explanation: |-
    $-\tfrac12 = -0.5$ lies to the left of $-\tfrac13 \approx -0.33$, so it is smaller. The others are false: $-4$ is left of $-1$; $|-6| = 6 > 5$; and $|-2| = 2 > 0$.
- id: alg-q-0110
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'What is the multiplicative inverse of $-\tfrac{5}{2}$?'
  choices: ['$\tfrac{5}{2}$', '$\tfrac{2}{5}$', '$-\tfrac{2}{5}$', '$1$']
  answer: 2
  explanation: |-
    The multiplicative inverse (reciprocal) multiplies with the number to give 1: $-\tfrac52 \cdot \left(-\tfrac25\right) = 1$. The sign stays. $\tfrac52$ is the additive inverse (opposite).
- id: alg-q-0111
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Which expression is undefined?'
  choices: ['$\tfrac{0}{9}$', '$\tfrac{9}{0}$', '$\tfrac{0}{-9}$', '$\tfrac{-9}{1}$']
  answer: 1
  explanation: |-
    Division by zero is undefined: no number times 0 gives 9. Zero divided by a nonzero number is just 0.
- id: alg-q-0112
  lesson: alg-real-numbers
  topic: Real numbers
  stem: 'Which fraction equals the repeating decimal $0.\overline{27} = 0.272727\ldots$?'
  choices: ['$\tfrac{3}{11}$', '$\tfrac{27}{100}$', '$\tfrac{27}{10}$', '$\tfrac{2}{7}$']
  answer: 0
  explanation: |-
    A two-digit repeating block over 99: $\tfrac{27}{99} = \tfrac{3}{11}$. Check: $3 \div 11 = 0.2727\ldots$. $\tfrac{27}{100} = 0.27$ exactly, which stops.

- id: alg-q-0201
  lesson: alg-expressions
  module_quiz: true
  topic: Expressions
  stem: 'Evaluate $20 - 12 \div 4 \cdot 2$.'
  choices: ['$4$', '$18.5$', '$14$', '$1$']
  answer: 2
  explanation: |-
    Division and multiplication left to right: $12 \div 4 = 3$, then $3 \cdot 2 = 6$. Then $20 - 6 = 14$. Multiplying first ($4 \cdot 2 = 8$) gives the wrong $18.5$.
- id: alg-q-0202
  lesson: alg-expressions
  module_quiz: true
  topic: Expressions
  stem: 'Evaluate $-4^2 + (-3)^2$.'
  choices: ['$25$', '$-25$', '$7$', '$-7$']
  answer: 3
  explanation: |-
    The exponent in $-4^2$ applies only to 4: $-4^2 = -16$. But $(-3)^2 = 9$. So $-16 + 9 = -7$. Reading $-4^2$ as $16$ gives 25.
- id: alg-q-0203
  lesson: alg-expressions
  topic: Expressions
  stem: 'Evaluate $3a^2 - 2ab$ when $a = -2$ and $b = 5$.'
  choices: ['$32$', '$-8$', '$8$', '$-32$']
  answer: 0
  explanation: |-
    Substitute with parentheses: $3(-2)^2 - 2(-2)(5) = 3(4) + 20 = 12 + 20 = 32$. Missing the double negative in the second term gives $12 - 20 = -8$.
- id: alg-q-0204
  lesson: alg-expressions
  module_quiz: true
  topic: Expressions
  stem: 'Simplify $5(2x - 3) - (4x - 7)$.'
  choices: ['$6x - 22$', '$6x + 4$', '$6x - 8$', '$14x - 22$']
  answer: 2
  explanation: |-
    Distribute: $10x - 15 - 4x + 7$. Combine: $6x - 8$. Writing $-7$ instead of $+7$ (not distributing the minus sign) gives $6x - 22$.
- id: alg-q-0205
  lesson: alg-expressions
  topic: Expressions
  stem: 'What is the coefficient of $x$ in $7x^3 - x + 4$?'
  choices: ['$1$', '$4$', '$0$', '$-1$']
  answer: 3
  explanation: |-
    The term is $-x = -1 \cdot x$, so its coefficient is $-1$. The sign belongs to the term.
- id: alg-q-0206
  lesson: alg-expressions
  topic: Expressions
  stem: 'Which pair are like terms?'
  choices: ['$3x^2y$ and $3xy^2$', '$5ab$ and $-2ba$', '$4x$ and $4x^2$', '$7$ and $7y$']
  answer: 1
  explanation: |-
    $ba = ab$ by the commutative property, so $5ab$ and $-2ba$ have the same variable part. In the first pair the exponents sit on different letters, and the other pairs have different powers or variables.
- id: alg-q-0207
  lesson: alg-expressions
  topic: Expressions
  stem: 'Which expression means "6 less than three times a number $n$"?'
  choices: ['$6 - 3n$', '$3(n - 6)$', '$3n + 6$', '$3n - 6$']
  answer: 3
  explanation: |-
    Start with three times the number, $3n$, then take 6 away: $3n - 6$. "Less than" reverses the reading order, which is why $6 - 3n$ is wrong.
- id: alg-q-0208
  lesson: alg-expressions
  topic: Expressions
  stem: 'Evaluate $\dfrac{8 + 4 \cdot 3}{2^2 + 1}$.'
  choices: ['$4$', '$\tfrac{36}{5}$', '$6$', '$\tfrac{20}{9}$']
  answer: 0
  explanation: |-
    The fraction bar groups. Numerator: $8 + 12 = 20$. Denominator: $4 + 1 = 5$. So $20 / 5 = 4$. Adding before multiplying gives $\tfrac{36}{5}$; squaring $(2 + 1)$ gives $\tfrac{20}{9}$.
- id: alg-q-0209
  lesson: alg-expressions
  module_quiz: true
  topic: Expressions
  stem: 'A student simplifies $2 - 3(x - 4)$. Step 1: $-1(x - 4)$. Step 2: $-x + 4$. What went wrong?'
  choices: ['Step 1 subtracts before multiplying; the result should be $14 - 3x$', 'Step 2 distributes incorrectly; the result should be $-x - 4$', 'Nothing; $-x + 4$ is correct', 'Step 1 is fine, but the result should be $x - 4$']
  answer: 0
  explanation: |-
    Multiplication comes before subtraction, so $-3$ is distributed first: $2 - 3x + 12 = 14 - 3x$. Combining $2 - 3$ first ignores the order of operations.
- id: alg-q-0210
  lesson: alg-expressions
  topic: Expressions
  stem: 'Evaluate $|3 - 8| - 2\,|-4|$.'
  choices: ['$12$', '$-13$', '$3$', '$-3$']
  answer: 3
  explanation: |-
    Absolute value bars group: $|3 - 8| = |-5| = 5$ and $|-4| = 4$. Then $5 - 2 \cdot 4 = 5 - 8 = -3$. Subtracting before multiplying gives $(5 - 2)\cdot 4 = 12$.
- id: alg-q-0211
  lesson: alg-expressions
  topic: Expressions
  stem: 'Simplify $4y - 2(3y - 5) + y$.'
  choices: ['$-y - 10$', '$11y - 10$', '$-y + 10$', '$-2y + 10$']
  answer: 2
  explanation: |-
    Distribute $-2$: $4y - 6y + 10 + y$. Combine the $y$ terms: $4 - 6 + 1 = -1$. Result: $-y + 10$. Dropping the final $+y$ gives $-2y + 10$.

- id: alg-q-0301
  lesson: alg-linear-eq
  module_quiz: true
  topic: Linear equations
  stem: 'Solve $5x + 9 = -16$.'
  choices: ['$x = -5$', '$x = -\tfrac{7}{5}$', '$x = 5$', '$x = -25$']
  answer: 0
  explanation: |-
    Subtract 9: $5x = -25$. Divide by 5: $x = -5$. Adding 9 instead gives $5x = -7$ and the wrong $-\tfrac75$.
- id: alg-q-0302
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $3(x - 4) = 2x + 1$.'
  choices: ['$x = 5$', '$x = -11$', '$x = 13$', '$x = 3$']
  answer: 2
  explanation: |-
    Distribute: $3x - 12 = 2x + 1$. Subtract $2x$: $x - 12 = 1$. Add 12: $x = 13$. Check: $3(9) = 27$ and $2(13) + 1 = 27$. Distributing only to $x$ ($3x - 4$) gives 5.
- id: alg-q-0303
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $\dfrac{x}{3} + \dfrac{x}{2} = 10$.'
  choices: ['$x = 2$', '$x = 60$', '$x = 12$', '$x = 50$']
  answer: 2
  explanation: |-
    Multiply every term by 6: $2x + 3x = 60$, so $5x = 60$ and $x = 12$. Check: $4 + 6 = 10$. Forgetting to multiply the 10 leads to $5x = 10$, $x = 2$.
- id: alg-q-0304
  lesson: alg-linear-eq
  module_quiz: true
  topic: Linear equations
  stem: 'Solve $2(3x - 1) = 6x + 5$.'
  choices: ['$x = 0$', 'No solution', 'All real numbers', '$x = \tfrac{7}{12}$']
  answer: 1
  explanation: |-
    The left side is $6x - 2$. Subtracting $6x$ leaves $-2 = 5$, which is false for every $x$. The equation is a contradiction: no solution.
- id: alg-q-0305
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Which equation is an identity (true for every real number)?'
  choices: ['$3(x + 2) = 3x + 2$', '$4x = 0$', '$2x + 1 = 2x - 1$', '$5x - 5 = 5(x - 1)$']
  answer: 3
  explanation: |-
    $5(x - 1) = 5x - 5$, so both sides are the same expression. The first and third reduce to false statements ($6 = 2$, $1 = -1$), and $4x = 0$ is true only for $x = 0$.
- id: alg-q-0306
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $0.2x - 1.5 = 0.05x + 0.3$.'
  choices: ['$x = 12$', '$x = 1.2$', '$x = 8$', '$x = 120$']
  answer: 0
  explanation: |-
    Multiply by 100: $20x - 150 = 5x + 30$. Then $15x = 180$ and $x = 12$. Check: $2.4 - 1.5 = 0.9$ and $0.6 + 0.3 = 0.9$. Subtracting 1.5 instead of adding it gives $x = 8$.
- id: alg-q-0307
  lesson: alg-linear-eq
  module_quiz: true
  topic: Linear equations
  stem: 'A student solves $-3x + 7 = 19$. Step 1: $-3x = 12$. Step 2: $x = 4$. Which is right?'
  choices: ['Step 1 is wrong; it should be $-3x = 26$', 'Step 2 is wrong; it should be $x = -4$', 'Both steps are correct', 'Step 2 is wrong; it should be $x = 36$']
  answer: 1
  explanation: |-
    Step 1 correctly subtracts 7. Dividing by $-3$ must keep the sign: $x = 12 / (-3) = -4$. Check: $-3(-4) + 7 = 19$.
- id: alg-q-0308
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $\dfrac{2x - 1}{5} = \dfrac{x + 4}{3}$.'
  choices: ['$x = 5$', '$x = 7$', '$x = 23$', '$x = -23$']
  answer: 2
  explanation: |-
    Multiply both sides by 15: $3(2x - 1) = 5(x + 4)$, so $6x - 3 = 5x + 20$ and $x = 23$. Check: $\tfrac{45}{5} = 9$ and $\tfrac{27}{3} = 9$. Not distributing ($6x - 1 = 5x + 4$) gives 5.
- id: alg-q-0309
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'The lines $y = 2x - 1$ and $y = -x + 5$ cross at the point $(2, 3)$. What is the solution of $2x - 1 = -x + 5$?'
  choices: ['$x = 3$', '$x = 2$', '$x = 5$', '$x = -1$']
  answer: 1
  explanation: |-
    The two sides are equal where the graphs meet, and the solution is the $x$-coordinate of that point: $x = 2$. (The 3 is the common value of both sides.) Algebraically, $3x = 6$.
- id: alg-q-0310
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $7 - 2(x + 3) = 5x - 13$.'
  choices: ['$x = \tfrac{26}{7}$', 'No solution', '$x = \tfrac{23}{7}$', '$x = 2$']
  answer: 3
  explanation: |-
    Distribute $-2$: $7 - 2x - 6 = 5x - 13$, so $1 - 2x = 5x - 13$. Add $2x$ and 13: $14 = 7x$, so $x = 2$. Writing $-2 \cdot 3$ as $+6$ leads to $\tfrac{26}{7}$.
- id: alg-q-0311
  lesson: alg-linear-eq
  topic: Linear equations
  stem: 'Solve $\tfrac{3}{4}x = -12$.'
  choices: ['$x = -9$', '$x = -16$', '$x = 16$', '$x = -\tfrac{1}{16}$']
  answer: 1
  explanation: |-
    Multiply both sides by the reciprocal $\tfrac43$: $x = -12 \cdot \tfrac43 = -16$. Multiplying by $\tfrac34$ instead gives $-9$.

- id: alg-q-0401
  lesson: alg-literal
  module_quiz: true
  topic: Literal equations
  stem: 'Solve $A = \tfrac12 bh$ for $h$.'
  choices: ['$h = \dfrac{A}{2b}$', '$h = 2Ab$', '$h = \dfrac{2A}{b}$', '$h = \dfrac{b}{2A}$']
  answer: 2
  explanation: |-
    Multiply both sides by 2: $2A = bh$. Divide by $b$: $h = \dfrac{2A}{b}$.
- id: alg-q-0402
  lesson: alg-literal
  topic: Literal equations
  stem: 'Solve $ax - c = d$ for $x$ (assume $a \ne 0$).'
  choices: ['$x = \dfrac{d - c}{a}$', '$x = \dfrac{d + c}{a}$', '$x = \dfrac{d}{a} + c$', '$x = a(d + c)$']
  answer: 1
  explanation: |-
    Add $c$: $ax = d + c$. Divide the whole right side by $a$: $x = \dfrac{d + c}{a}$. Dividing only $d$ gives the wrong $\tfrac{d}{a} + c$.
- id: alg-q-0403
  lesson: alg-literal
  module_quiz: true
  topic: Literal equations
  stem: 'Solve $3x + 4y = 12$ for $y$.'
  choices: ['$y = 12 - \tfrac{3}{4}x$', '$y = -3x + 3$', '$y = \tfrac{3}{4}x - 3$', '$y = -\tfrac{3}{4}x + 3$']
  answer: 3
  explanation: |-
    Subtract $3x$: $4y = 12 - 3x$. Divide every term by 4: $y = 3 - \tfrac34 x = -\tfrac34x + 3$. Writing $y = 12 - \tfrac34x$ divides only one term by 4.
- id: alg-q-0404
  lesson: alg-literal
  topic: Literal equations
  stem: 'Solve $A = P + Prt$ for $r$.'
  choices: ['$r = \dfrac{A - P}{Pt}$', '$r = \dfrac{A}{Pt} - P$', '$r = A - P - Pt$', '$r = \dfrac{A - P}{t}$']
  answer: 0
  explanation: |-
    Subtract $P$: $A - P = Prt$. Divide by $Pt$: $r = \dfrac{A - P}{Pt}$. (Solving for $P$ would need factoring, but here $r$ appears only once.)
- id: alg-q-0405
  lesson: alg-literal
  topic: Literal equations
  stem: 'Solve $mx + k = nx$ for $x$ (assume $m \ne n$).'
  choices: ['$x = \dfrac{k}{m - n}$', '$x = \dfrac{-k}{n - m}$', '$x = \dfrac{n - k}{m}$', '$x = \dfrac{k}{n - m}$']
  answer: 3
  explanation: |-
    Collect $x$ terms: $k = nx - mx = x(n - m)$. Divide: $x = \dfrac{k}{n - m}$. $\tfrac{k}{m - n}$ and $\tfrac{-k}{n - m}$ have the wrong sign: each equals $-\tfrac{k}{n - m}$.
- id: alg-q-0406
  lesson: alg-literal
  module_quiz: true
  topic: Literal equations
  stem: 'A student solves $P = 2l + 2w$ for $l$. Step 1: $P - 2w = 2l$. Step 2: $l = P - w$. Which statement is correct?'
  choices: ['Step 2 is wrong; it should be $l = \dfrac{P - 2w}{2}$', 'Step 1 is wrong; it should be $P + 2w = 2l$', 'Step 2 is wrong; it should be $l = \dfrac{P}{2} - 2w$', 'Neither step is wrong']
  answer: 0
  explanation: |-
    Both terms on the left must be divided by 2: $l = \dfrac{P - 2w}{2} = \dfrac{P}{2} - w$. The student divided only the $2w$.
- id: alg-q-0407
  lesson: alg-literal
  topic: Literal equations
  stem: 'Using $C = \tfrac59(F - 32)$, find $C$ when $F = 50$.'
  choices: ['$18$', '$-\tfrac{38}{9}$', '$10$', '$\tfrac{410}{9}$']
  answer: 2
  explanation: |-
    Parentheses first: $50 - 32 = 18$. Then $\tfrac59 \cdot 18 = 10$. Multiplying 50 by $\tfrac59$ before subtracting gives $-\tfrac{38}{9}$.
- id: alg-q-0408
  lesson: alg-literal
  topic: Literal equations
  stem: 'A car covers 207 miles in 4.5 hours. Using $d = rt$, what is its average speed?'
  choices: ['$931.5$ mph', '$46$ mph', '$41.4$ mph', '$50$ mph']
  answer: 1
  explanation: |-
    Solve for $r$: $r = \dfrac{d}{t} = \dfrac{207}{4.5} = 46$ mph. Multiplying instead of dividing gives 931.5.
- id: alg-q-0409
  lesson: alg-literal
  topic: Literal equations
  stem: 'The volume of a cylinder is $V = \pi r^2 h$. Solve for $h$.'
  choices: ['$h = V - \pi r^2$', '$h = \dfrac{\pi r^2}{V}$', '$h = \dfrac{V}{2\pi r}$', '$h = \dfrac{V}{\pi r^2}$']
  answer: 3
  explanation: |-
    $h$ is multiplied by $\pi r^2$, so divide both sides by $\pi r^2$: $h = \dfrac{V}{\pi r^2}$.
- id: alg-q-0410
  lesson: alg-literal
  topic: Literal equations
  stem: 'Solve $y - y_1 = m(x - x_1)$ for $x$ (assume $m \ne 0$).'
  choices: ['$x = \dfrac{y - y_1}{m} + x_1$', '$x = \dfrac{y - y_1 + x_1}{m}$', '$x = m(y - y_1) + x_1$', '$x = \dfrac{y - y_1}{m} - x_1$']
  answer: 0
  explanation: |-
    Divide by $m$: $\dfrac{y - y_1}{m} = x - x_1$. Add $x_1$: $x = \dfrac{y - y_1}{m} + x_1$.
- id: alg-q-0411
  lesson: alg-literal
  topic: Literal equations
  stem: 'A trapezoid has area $A = \tfrac12 h(b_1 + b_2) = 45$, with bases 4 and 11. What is its height?'
  choices: ['$3$', '$12$', '$6$', '$1.5$']
  answer: 2
  explanation: |-
    Solve for $h$: $h = \dfrac{2A}{b_1 + b_2} = \dfrac{90}{15} = 6$. Forgetting the factor 2 gives 3.

- id: alg-q-0501
  lesson: alg-linear-apps
  module_quiz: true
  topic: Linear applications
  stem: 'Three consecutive even integers add up to 114. What is the largest?'
  choices: ['$40$', '$38$', '$39$', '$42$']
  answer: 0
  explanation: |-
    Let them be $n$, $n + 2$, $n + 4$. Then $3n + 6 = 114$, so $n = 36$. The integers are 36, 38, 40; the largest is 40.
- id: alg-q-0502
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'A price rises from $40 to $52. What is the percent increase?'
  choices: ['$12\%$', '$23.1\%$', '$30\%$', '$130\%$']
  answer: 2
  explanation: |-
    Change over original: $\dfrac{52 - 40}{40} = \dfrac{12}{40} = 0.30 = 30\%$. Dividing by the new price gives about 23.1%, which is wrong.
- id: alg-q-0503
  lesson: alg-linear-apps
  module_quiz: true
  topic: Linear applications
  stem: 'After a 20% discount, a lamp costs $36. What was the original price?'
  choices: ['$43.20', '$28.80', '$56', '$45']
  answer: 3
  explanation: |-
    The sale price is 80% of the original: $0.8p = 36$, so $p = 45$. Adding 20% of 36 back gives $43.20, but the discount was 20% of the original, not of 36.
- id: alg-q-0504
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'Two trains leave the same station at the same time in opposite directions, at 55 mph and 65 mph. After how many hours are they 300 miles apart?'
  choices: ['$2.5$', '$5$', '$2.73$', '$30$']
  answer: 0
  explanation: |-
    Their distances add: $55t + 65t = 300$, so $120t = 300$ and $t = 2.5$ hours.
- id: alg-q-0505
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'A rectangle''s length is 4 more than 3 times its width, and its perimeter is 64. What is its length?'
  choices: ['$7$', '$49$', '$26.5$', '$25$']
  answer: 3
  explanation: |-
    With width $w$: $2w + 2(3w + 4) = 64$, so $8w + 8 = 64$ and $w = 7$. Length: $3(7) + 4 = 25$. Check: $2(7) + 2(25) = 64$.
- id: alg-q-0506
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'A taxi charges $2.75 plus $1.50 per mile. A ride costs $20.75. How many miles was it?'
  choices: ['$13.8$', '$15.7$', '$12$', '$11$']
  answer: 2
  explanation: |-
    $2.75 + 1.50m = 20.75$, so $1.50m = 18$ and $m = 12$. Dividing the whole fare by 1.50 ignores the fixed charge and gives about 13.8.
- id: alg-q-0507
  lesson: alg-linear-apps
  module_quiz: true
  topic: Linear applications
  stem: 'A price is raised 10% and then the new price is cut 10%. What is the overall effect?'
  choices: ['No change', 'A 1% decrease', 'A 1% increase', 'A 2% decrease']
  answer: 1
  explanation: |-
    Multipliers: $1.10 \times 0.90 = 0.99$, so the final price is 99% of the original: a 1% decrease. The 10% cut is taken from a larger amount than the 10% raise.
- id: alg-q-0508
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'A car leaves town at 40 mph. One hour later a second car leaves the same place on the same road at 60 mph. How long after the second car leaves does it catch up?'
  choices: ['$1$ hour', '$2$ hours', '$3$ hours', '$1.5$ hours']
  answer: 1
  explanation: |-
    If the second car drives $t$ hours, the first has driven $t + 1$. They meet when distances are equal: $60t = 40(t + 1)$, so $20t = 40$ and $t = 2$. (3 hours is the first car's total time.)
- id: alg-q-0509
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'The sum of a number and twice that number is 4 less than five times the number. What is the number?'
  choices: ['$2$', '$-2$', '$\tfrac12$', '$1$']
  answer: 0
  explanation: |-
    $n + 2n = 5n - 4$, so $3n = 5n - 4$, $-2n = -4$ and $n = 2$. Check: $2 + 4 = 6$ and $10 - 4 = 6$.
- id: alg-q-0510
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'Using $I = Prt$, a deposit of $2,400 earns $252 in simple interest over 3 years. What is the annual rate?'
  choices: ['$10.5\%$', '$0.35\%$', '$35\%$', '$3.5\%$']
  answer: 3
  explanation: |-
    $r = \dfrac{I}{Pt} = \dfrac{252}{2400 \cdot 3} = \dfrac{252}{7200} = 0.035 = 3.5\%$. Ignoring the 3 years gives 10.5%.
- id: alg-q-0511
  lesson: alg-linear-apps
  topic: Linear applications
  stem: 'A gym charges a $50 sign-up fee plus $25 per month. Which equation finds the number of months $m$ when the total cost reaches $350?'
  choices: ['$50m + 25 = 350$', '$25m + 50 = 350$', '$75m = 350$', '$25(m + 50) = 350$']
  answer: 1
  explanation: |-
    Total = fixed fee + monthly rate × months: $50 + 25m = 350$. Solving gives $m = 12$ months. $50m + 25 = 350$ swaps the fee and the rate.
