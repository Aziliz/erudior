# Module 7 drills
- id: alg-d-simplify-sqrt
  title: Simplify a square root
  topic: Radicals
  vars:
    a: {min: 2, max: 9}
    b: {choices: [2, 3, 5, 6, 7, 10, 11, 13, 14, 15]}
  calc:
    n: a^2*b
    a2: a^2
  prompt: 'Write $\sqrt{{n}}$ in simplest radical form $a\sqrt{\,b}$.'
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
  solution: |-
    The largest perfect-square factor of {n} is {a2}: $\sqrt{{n}} = \sqrt{{a2} \cdot {b}} = \sqrt{{a2}}\sqrt{{b}} =$ **${a}\sqrt{{b}}$**.

- id: alg-d-rational-exp
  title: Evaluate a rational exponent
  topic: Rational exponents
  vars:
    r: {min: 2, max: 5}
    q: {choices: [2, 3]}
    p: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    base: r^q
    val: r^p
  where: ['base <= 125', 'p != q', 'abs(val) <= 125']
  prompt: 'Evaluate $\;{base}^{{p}/{q}}$. Give an exact answer (a fraction if needed).'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, label: 'Value'}
  solution: |-
    The denominator {q} is the root: $\sqrt[{q}]{{base}} = {r}$. Then raise to the power {p}: ${r}^{{p}} =$ **${val:texfrac}$**.

- id: alg-d-rationalize
  title: Rationalize with a conjugate
  topic: Radicals
  vars:
    a: {min: 1, max: 6}
    b: {choices: [2, 3, 5, 6, 7, 10, 11]}
    m: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    den: a^2 - b
    c: m*den
    p: m*a
    q: -m
  where: ['den != 0', 'abs(den) <= 10']
  prompt: 'Rationalize the denominator and write $\dfrac{{c}}{{a} + \sqrt{{b}}}$ in the form $p + q\sqrt{{b}}$.'
  answers:
    - {name: p, label: '$p =$'}
    - {name: q, label: '$q =$'}
  solution: |-
    Multiply top and bottom by the conjugate ${a} - \sqrt{{b}}$. The denominator becomes ${a}^2 - {b} = {den}$.
    So the expression is $\dfrac{{c}({a} - \sqrt{{b}})}{{den}} = {m}({a} - \sqrt{{b}})$, giving $p =$ **{p}** and $q =$ **{q}**.

- id: alg-d-radical-eq
  title: Solve a radical equation
  topic: Radical equations
  vars:
    a: {min: 1, max: 6}
    b: {min: -10, max: 10}
    c: {min: 1, max: 9}
    k: {min: -5, max: 5}
  calc:
    rhs: c + k
    c2: c^2
    xs: (c^2 - b)/a
    cb: c^2 - b
  where: ['b != 0', 'k != 0', 'rhs > 0']
  prompt: 'Solve $\;\sqrt{{a:coef}x {b:signed}} {k:signed} = {rhs}$. Give an exact answer.'
  answers:
    - {name: xs, kind: fraction, lowestTerms: true, label: '$x =$'}
  solution: |-
    Isolate the radical: $\sqrt{{a:coef}x {b:signed}} = {c}$. Square both sides: ${a:coef}x {b:signed} = {c2}$.
    So ${a:coef}x = {cb}$ and $x =$ **${xs:texfrac}$**. Check: the radicand is ${c2}$ and its root is ${c}$, as required.

- id: alg-d-radical-extraneous
  title: Radical equation with an extraneous root
  topic: Radical equations
  vars:
    q: {min: -4, max: 4}
    s: {min: -3, max: 8}
  calc:
    e: 1 - 2*q - s
    p: q^2 - s*(1 - 2*q - s)
    B: 2*q - 1
    C: q^2 - p
    sq: s + q
    eq: e + q
  where: ['s + q >= 0', 'e + q < 0', 'p != 0', 'q != 0', 's != e', 'q^2 - p != 0']
  prompt: 'Solve $\;\sqrt{x {p:signed}} = x {q:signed}$. Enter the valid solution and the extraneous value that squaring produces.'
  answers:
    - {name: s, label: 'Valid solution'}
    - {name: e, label: 'Extraneous value'}
  solution: |-
    Square both sides: $x {p:signed} = (x {q:signed})^2$, which rearranges to $x^2 {B:signedcoef}x {C:signed} = 0$, with roots ${s}$ and ${e}$.
    Check: at $x = {s}$ the right side is ${sq} \ge 0$ and matches the root, so **{s}** is valid. At $x = {e}$ the right side is ${eq} < 0$, but a square root can't be negative, so **{e}** is extraneous.

- id: alg-d-complex-mult
  title: Multiply complex numbers
  topic: Complex numbers
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  calc:
    re: a*c - b*d
    im: a*d + b*c
    bd: b*d
    nbd: -b*d
  where: ['b != 0', 'd != 0', 'a != 0', 'c != 0']
  prompt: 'Multiply $({a} {b:signedcoef}i)({c} {d:signedcoef}i)$ and write the result as $a + bi$.'
  answers:
    - {name: re, label: 'Real part'}
    - {name: im, label: 'Imaginary part'}
  solution: |-
    FOIL, then use $i^2 = -1$: the $i^2$ term is ${bd}i^2 = {nbd}$.
    Real part $({a})({c}) + ({nbd}) =$ **{re}**; imaginary part ${a}({d}) + ({b})({c}) =$ **{im}**.

- id: alg-d-complex-div
  title: Divide complex numbers
  topic: Complex numbers
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: 1, max: 5}
    d: {min: -5, max: 5}
  calc:
    den: c^2 + d^2
    nre: a*c + b*d
    nim: b*c - a*d
    re: (a*c + b*d)/(c^2 + d^2)
    im: (b*c - a*d)/(c^2 + d^2)
    nd: -d
  where: ['d != 0', 'b != 0', 'a != c or b != d']
  prompt: 'Write $\dfrac{{a} {b:signedcoef}i}{{c} {d:signedcoef}i}$ in the form $a + bi$. Give exact fractions.'
  answers:
    - {name: re, kind: fraction, lowestTerms: true, label: 'Real part'}
    - {name: im, kind: fraction, lowestTerms: true, label: 'Imaginary part'}
  solution: |-
    Multiply top and bottom by the conjugate ${c} {nd:signedcoef}i$. The denominator becomes ${c}^2 + ({d})^2 = {den}$, and the numerator becomes ${nre} {nim:signedcoef}i$.
    So the real part is **${re:texfrac}$** and the imaginary part is **${im:texfrac}$**.

- id: alg-d-i-power
  title: Powers of i
  topic: Complex numbers
  vars:
    n: {min: 5, max: 99}
    a: {min: 1, max: 9}
  calc:
    r: mod(n, 4)
    re: a*if(r == 0, 1, if(r == 2, -1, 0))
    im: a*if(r == 1, 1, if(r == 3, -1, 0))
    qq: floor(n/4)
  prompt: 'Simplify ${a:coef}i^{{n}}$ and give its real and imaginary parts.'
  answers:
    - {name: re, label: 'Real part'}
    - {name: im, label: 'Imaginary part'}
  solution: |-
    Powers of $i$ repeat every 4. ${n} = 4 \cdot {qq} + {r}$, so $i^{{n}} = i^{{r}}$ (the cycle is $i^0 = 1$, $i^1 = i$, $i^2 = -1$, $i^3 = -i$).
    Real part **{re}**, imaginary part **{im}**.

- id: alg-d-rat-simplify
  title: Simplify a rational expression
  topic: Rational expressions
  vars:
    p: {min: -6, max: 6}
    q: {min: -6, max: 6}
    r: {min: -6, max: 6}
  calc:
    nb: p + q
    nc: p*q
    db: p + r
    dc: p*r
  where: ['p != 0', 'q != 0', 'r != 0', 'q != r', 'p != q', 'p != r', 'nb != 0', 'db != 0']
  prompt: 'Simplify $\dfrac{x^2 {nb:signedcoef}x {nc:signed}}{x^2 {db:signedcoef}x {dc:signed}}$.'
  answers:
    - kind: expression
      expression: (x + q)/(x + r)
      variables: [x]
      label: 'Simplified'
      show: '$\dfrac{x {q:signed}}{x {r:signed}}$'
  solution: |-
    Factor both: $\dfrac{(x {p:signed})(x {q:signed})}{(x {p:signed})(x {r:signed})}$.
    Cancel the common factor $(x {p:signed})$: **$\dfrac{x {q:signed}}{x {r:signed}}$** (with the original excluded values still excluded).

- id: alg-d-rat-multiply
  title: Multiply rational expressions
  topic: Rational expressions
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  calc:
    s1: a + b
    p1: a*b
    s2: c + d
    p2: c*d
  where: ['a != 0', 'b != 0', 'c != 0', 'd != 0', 'a != b', 'c != d', 'a != c', 'b != d', 'a != d', 'b != c', 's1 != 0', 's2 != 0']
  prompt: 'Multiply and simplify: $\dfrac{x^2 {s1:signedcoef}x {p1:signed}}{x^2 {s2:signedcoef}x {p2:signed}} \cdot \dfrac{x {c:signed}}{x {a:signed}}$'
  answers:
    - kind: expression
      expression: (x + b)/(x + d)
      variables: [x]
      label: 'Product'
      show: '$\dfrac{x {b:signed}}{x {d:signed}}$'
  solution: |-
    Factor: $\dfrac{(x {a:signed})(x {b:signed})}{(x {c:signed})(x {d:signed})} \cdot \dfrac{x {c:signed}}{x {a:signed}}$.
    Cancel $(x {a:signed})$ and $(x {c:signed})$: **$\dfrac{x {b:signed}}{x {d:signed}}$**.

- id: alg-d-rat-add
  title: Add rational expressions
  topic: Rational expressions
  vars:
    a: {min: -7, max: 7}
    b: {min: -7, max: 7}
    p: {min: -6, max: 6}
    q: {min: -6, max: 6}
  calc:
    A: a + b
    B: a*q + b*p
    aq: a*q
    bp: b*p
  where: ['a != 0', 'b != 0', 'p != 0', 'q != 0', 'p != q', 'A != 0', 'B != 0']
  prompt: 'Add and write as a single fraction: $\dfrac{{a}}{x {p:signed}} + \dfrac{{b}}{x {q:signed}}$'
  answers:
    - kind: expression
      expression: a/(x + p) + b/(x + q)
      variables: [x]
      label: 'Sum'
      show: '$\dfrac{{A:coef}x {B:signed}}{(x {p:signed})(x {q:signed})}$'
  solution: |-
    The LCD is $(x {p:signed})(x {q:signed})$. Rewrite: $\dfrac{{a}(x {q:signed}) {b:signed}(x {p:signed})}{(x {p:signed})(x {q:signed})}$.
    The numerator is ${a}x {aq:signed} {b:signed}x {bp:signed} = {A:coef}x {B:signed}$, so the sum is **$\dfrac{{A:coef}x {B:signed}}{(x {p:signed})(x {q:signed})}$**.

- id: alg-d-complex-fraction
  title: Simplify a numeric complex fraction
  topic: Complex fractions
  vars:
    a: {min: 1, max: 5}
    b: {min: 2, max: 9}
    c: {min: 1, max: 5}
    d: {min: 2, max: 9}
    f: {min: 2, max: 9}
  calc:
    top: a/b + c/d
    val: (a/b + c/d)*f
  where: ['b != d', 'gcd(a, b) == 1', 'gcd(c, d) == 1']
  prompt: 'Simplify $\dfrac{\dfrac{{a}}{{b}} + \dfrac{{c}}{{d}}}{\dfrac{1}{{f}}}$ to an exact fraction.'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, label: 'Value'}
  solution: |-
    The numerator is $\dfrac{{a}}{{b}} + \dfrac{{c}}{{d}} = {top:texfrac}$. Dividing by $\dfrac{1}{{f}}$ means multiplying by {f}: ${top:texfrac} \cdot {f} =$ **${val:texfrac}$**.

- id: alg-d-rat-eq
  title: Solve a rational equation
  topic: Rational equations
  vars:
    a: {min: 1, max: 9}
    b: {min: 1, max: 9}
    p: {min: -8, max: 8}
    q: {min: -8, max: 8}
  calc:
    xs: (b*p - a*q)/(a - b)
    aq: a*q
    bp: b*p
    amb: a - b
    np: -p
    nq: -q
    rhs: b*p - a*q
  where: ['a != b', 'p != q', 'xs != -p', 'xs != -q', 'rhs != 0']
  prompt: 'Solve $\;\dfrac{{a}}{x {p:signed}} = \dfrac{{b}}{x {q:signed}}$. Give an exact answer.'
  answers:
    - {name: xs, kind: fraction, lowestTerms: true, label: '$x =$'}
  solution: |-
    Excluded values: $x \ne {np}$ and $x \ne {nq}$. Cross-multiply: ${a}(x {q:signed}) = {b}(x {p:signed})$.
    So ${a}x {aq:signed} = {b}x {bp:signed}$, giving ${amb:coef}x = {rhs}$ and $x =$ **${xs:texfrac}$**, which isn't excluded.

- id: alg-d-work
  title: Working together
  topic: Work and rate
  vars:
    t1: {min: 2, max: 12}
    t2: {min: 2, max: 15}
  calc:
    tot: t1*t2/(t1 + t2)
    pr: t1*t2
    sm: t1 + t2
  where: ['t1 < t2']
  prompt: 'One machine finishes a job in {t1} hours and another in {t2} hours. Working together, how many hours do they take? (Exact fraction.)'
  answers:
    - {name: tot, kind: fraction, lowestTerms: true, label: 'Hours'}
  solution: |-
    Rates add: $\dfrac{1}{{t1}} + \dfrac{1}{{t2}} = \dfrac{1}{T}$. Multiply by ${t1} \cdot {t2} \cdot T$: ${t2}T + {t1}T = {pr}$.
    So $T = \dfrac{{pr}}{{sm}} =$ **${tot:texfrac}$** hours.

- id: alg-d-current
  title: Boat speed against a current
  topic: Work and rate
  vars:
    bs: {min: 8, max: 30}
    c: {min: 1, max: 6}
    t: {choices: [1, 1.5, 2, 2.5, 3]}
  calc:
    D1: (bs + c)*t
    D2: (bs - c)*t
  where: ['bs > 2*c']
  prompt: 'A boat travels {D1} km downstream in the same time it travels {D2} km upstream. The current flows at {c} km/h. What is the boat''s speed in still water (km/h)?'
  answers:
    - {name: bs, label: 'Speed (km/h)'}
  solution: |-
    Equal times: $\dfrac{{D1}}{b + {c}} = \dfrac{{D2}}{b - {c}}$. Cross-multiply and solve: **{bs}** km/h.
    Check: each trip takes {t} h.
