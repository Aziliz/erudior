# Module 4 drills
- id: alg-d-system-graph
  title: Read a system's solution from a graph
  topic: Systems of equations
  vars:
    x0: {min: -4, max: 4}
    y0: {min: -4, max: 4}
    m1: {choices: [-2, -1, -0.5, 0.5, 1, 2, 3]}
    m2: {choices: [-3, -2, -1, -0.5, 0.5, 1, 2]}
  calc:
    b1: y0 - m1*x0
    b2: y0 - m2*x0
  funcs:
    L1(x): m1*(x - x0) + y0
    L2(x): m2*(x - x0) + y0
  where: ['m1 != m2', 'b1 == round(b1)', 'b2 == round(b2)']
  prompt: 'The graph shows the two lines of a system. What is the solution of the system?'
  figure:
    type: plot
    x: [-8, 8]
    y: [-8, 8]
    functions:
      - {f: L1}
      - {f: L2, dashed: true}
  answers:
    - {name: x0, label: '$x =$'}
    - {name: y0, label: '$y =$'}
  solution: |-
    The solution is where the lines cross. They meet at the grid point **({x0}, {y0})**.
    Check with the equations: ${m1}({x0}) + ({b1}) = {y0}$ and ${m2}({x0}) + ({b2}) = {y0}$.

- id: alg-d-system-sub
  title: Solve a system by substitution
  topic: Systems of equations
  vars:
    xs: {min: -6, max: 6}
    ys: {min: -6, max: 6}
    m: {min: -4, max: 4}
    a: {min: -5, max: 6}
    b: {min: -5, max: 5}
  calc:
    k: ys - m*xs
    c: a*xs + b*ys
    co: a + b*m
    bk: b*k
    rhs: c - b*k
  funcs:
    L1(x): m*x + k
  where: ['m != 0', 'a != 0', 'b != 0', 'co != 0', 'k != 0', 'b != 1']
  prompt: 'Solve by substitution: $\;y = {m:coef}x {k:signed}$ and ${a:coef}x {b:signedcoef}y = {c}$.'
  answers:
    - {name: xs, label: '$x =$'}
    - {name: ys, label: '$y =$'}
  solution: |-
    Substitute the first equation into the second: ${a:coef}x + ({b})({m:coef}x {k:signed}) = {c}$.
    Simplify: ${co:coef}x {bk:signed} = {c}$, so ${co:coef}x = {rhs}$ and $x =$ **{xs}**.
    Back-substitute: $y = {m}({xs}) + ({k}) =$ **{ys}**.

- id: alg-d-system-elim
  title: Solve a system by elimination
  topic: Systems of equations
  vars:
    a: {min: 2, max: 7}
    b: {min: -7, max: 7}
    c: {min: 2, max: 7}
    d: {min: -7, max: 7}
    e: {min: -20, max: 20}
    f: {min: -20, max: 20}
  calc:
    det: a*d - b*c
    xn: e*d - b*f
    yn: a*f - e*c
    xs: (e*d - b*f)/(a*d - b*c)
    ys: (a*f - e*c)/(a*d - b*c)
    ad: a*d
    bc: b*c
    ed: e*d
    bf: b*f
  where: ['det != 0', 'b != 0', 'd != 0', 'abs(b) != 1', 'abs(d) != 1', 'a != c', 'abs(det) <= 30', 'e != 0', 'f != 0']
  prompt: |-
    Solve by elimination. Give exact fractions if needed.

    $$\begin{cases} {a}x {b:signed}y = {e} \\ {c}x {d:signed}y = {f} \end{cases}$$
  answers:
    - {name: xs, kind: fraction, lowestTerms: true, label: '$x =$'}
    - {name: ys, kind: fraction, lowestTerms: true, label: '$y =$'}
  solution: |-
    Eliminate $y$: multiply the first equation by {d} and the second by {b}, then subtract.
    The $y$ terms cancel and $({ad} - ({bc}))x = {ed} - ({bf})$, so ${det}x = {xn}$ and $x =$ **${xs:texfrac}$**.
    Eliminating $x$ the same way (multiply by {c} and {a}) gives ${det}y = {yn}$, so $y =$ **${ys:texfrac}$**.

- id: alg-d-tickets
  title: Ticket sales
  topic: System applications
  vars:
    p1: {min: 8, max: 20}
    p2: {min: 3, max: 9}
    n1: {min: 40, max: 300}
    n2: {min: 40, max: 300}
  calc:
    N: n1 + n2
    T: p1*n1 + p2*n2
    pn: p2*N
    dp: p1 - p2
    rem: T - p2*N
  where: ['p1 > p2 + 2']
  prompt: 'A theater sold {N} tickets for {T:money0} in all. Adult tickets cost {p1:money0} and child tickets cost {p2:money0}. How many of each were sold?'
  answers:
    - {name: n1, label: 'Adult tickets'}
    - {name: n2, label: 'Child tickets'}
  solution: |-
    Let $a$ and $c$ be the numbers sold: $a + c = {N}$ and ${p1}a + {p2}c = {T:dp0}$.
    Substitute $c = {N} - a$: ${p1}a + {p2}({N} - a) = {T:dp0}$, so ${dp}a + {pn:dp0} = {T:dp0}$ and ${dp}a = {rem:dp0}$.
    So $a =$ **{n1}** adult tickets and $c =$ **{n2}** child tickets.

- id: alg-d-mixture
  title: Mixture with two solutions
  topic: System applications
  vars:
    c1: {min: 5, max: 30, step: 5}
    c2: {min: 40, max: 80, step: 5}
    xl: {min: 5, max: 60, step: 5}
    yl: {min: 5, max: 60, step: 5}
  calc:
    V: xl + yl
    tgt: (c1*xl + c2*yl)/(xl + yl)
    acid: tgt*V/100
    tv: tgt*V
    cd: c1 - c2
    rr: tgt*V - c2*V
  where: ['tgt == round(tgt)']
  prompt: 'You need {V} L of a {tgt}% acid solution, mixed from a {c1}% solution and a {c2}% solution. How many liters of each should you use?'
  answers:
    - {name: xl, label: 'Liters of {c1}%'}
    - {name: yl, label: 'Liters of {c2}%'}
  solution: |-
    Let $x$ and $y$ be the liters of the {c1}% and {c2}% solutions. Volume: $x + y = {V}$.
    Acid, measured in percent × liters: ${c1}x + {c2}y = {tgt} \cdot {V} = {tv:dp0}$ (that is {acid} L of pure acid).
    Substitute $y = {V} - x$: ${c1}x + {c2}({V} - x) = {tv:dp0}$, so ${cd}x = {rr:dp0}$.
    So $x =$ **{xl}** L of the {c1}% solution and $y =$ **{yl}** L of the {c2}% solution.

- id: alg-d-wind
  title: Speed with a headwind and tailwind
  topic: System applications
  vars:
    p: {min: 300, max: 600, step: 10}
    w: {min: 10, max: 80, step: 5}
    t1: {choices: [2, 2.5, 3, 4]}
  calc:
    D: (p + w)*t1
    t2: D/(p - w)
    s1: p + w
    s2: p - w
  where: ['t2*4 == round(t2*4)', 't2 != t1']
  prompt: 'A plane flies {D} miles with a tailwind in {t1} hours, and the return trip against the same wind takes {t2} hours. Find the plane''s speed in still air and the wind speed (mph).'
  answers:
    - {name: p, label: 'Plane speed'}
    - {name: w, label: 'Wind speed'}
  solution: |-
    With the wind: $p + w = {D:dp0} / {t1} = {s1}$. Against it: $p - w = {D:dp0} / {t2} = {s2}$.
    Add the equations: $2p = {s1} + {s2}$, so $p =$ **{p}** mph, and $w = {s1} - {p} =$ **{w}** mph.

- id: alg-d-system3
  title: Solve a 3×3 system
  topic: Three-variable systems
  vars:
    xs: {min: -4, max: 4}
    ys: {min: -4, max: 4}
    zs: {min: -4, max: 4}
    a1: {choices: [1, 2, -1]}
    b1: {choices: [1, -1, 2]}
    c1: {choices: [1, -1, 3]}
    a2: {choices: [2, 1, 3]}
    b2: {choices: [-1, 1, -2]}
    c2: {choices: [1, 2, -1]}
    a3: {choices: [1, -1, 3]}
    b3: {choices: [2, 1, 3]}
    c3: {choices: [-1, -2, 1]}
  calc:
    d1: a1*xs + b1*ys + c1*zs
    d2: a2*xs + b2*ys + c2*zs
    d3: a3*xs + b3*ys + c3*zs
    det: a1*(b2*c3 - c2*b3) - b1*(a2*c3 - c2*a3) + c1*(a2*b3 - b2*a3)
  where: ['det != 0']
  prompt: |-
    Solve the system:

    $$\begin{cases} {a1:coef}x {b1:signedcoef}y {c1:signedcoef}z = {d1} \\ {a2:coef}x {b2:signedcoef}y {c2:signedcoef}z = {d2} \\ {a3:coef}x {b3:signedcoef}y {c3:signedcoef}z = {d3} \end{cases}$$
  answers:
    - {name: xs, label: '$x =$'}
    - {name: ys, label: '$y =$'}
    - {name: zs, label: '$z =$'}
  solution: |-
    Eliminate one variable (say $z$) from two different pairs of equations to get two equations in $x$ and $y$; solve that pair, then back-substitute.
    The solution is **$({xs}, {ys}, {zs})$**. Check the first equation: ${a1}({xs}) + ({b1})({ys}) + ({c1})({zs}) = {d1}$.

- id: alg-d-parabola-3pts
  title: Parabola through three points
  topic: Three-variable systems
  vars:
    a: {min: -3, max: 3}
    b: {min: -4, max: 4}
    c: {min: -5, max: 5}
    u: {min: -3, max: -1}
    v: {min: 0, max: 1}
    w: {choices: [2, 3]}
  funcs:
    f(x): a*x^2 + b*x + c
  calc:
    fu: f(u)
    fv: f(v)
    fw: f(w)
    ylo: min(fu, fv, fw, 0) - 3
    yhi: max(fu, fv, fw, 0) + 3
  where: ['a != 0']
  prompt: 'Find $a$, $b$ and $c$ so that $y = ax^2 + bx + c$ passes through $({u}, {fu})$, $({v}, {fv})$ and $({w}, {fw})$.'
  figure:
    type: plot
    x: [-4, 4]
    y: [ylo, yhi]
    points:
      - {at: [u, fu], label: '({u}, {fu})'}
      - {at: [v, fv], label: '({v}, {fv})'}
      - {at: [w, fw], label: '({w}, {fw})'}
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
    - {name: c, label: '$c =$'}
  solution: |-
    Substitute each point to get three linear equations in $a$, $b$, $c$, for example ${fu} = a({u})^2 + b({u}) + c$.
    Solving the system gives **$a = {a}$, $b = {b}$, $c = {c}$**, so $y = {a:coef}x^2 + ({b})x + ({c})$.

- id: alg-d-corner-point
  title: Corner point of a feasible region
  topic: Systems of inequalities
  vars:
    x0: {min: 1, max: 6}
    y0: {min: 1, max: 6}
    a1: {min: 2, max: 5}
    b1: {min: 1, max: 2}
    a2: {min: 1, max: 2}
    b2: {min: 2, max: 5}
  calc:
    c1: a1*x0 + b1*y0
    c2: a2*x0 + b2*y0
    xi: c1/a1
    yi: c2/b2
    top: max(xi, yi) + 1
  where: ['a1 > b1', 'b2 > a2']
  prompt: 'The feasible region is $x \ge 0$, $y \ge 0$, ${a1:coef}x {b1:signedcoef}y \le {c1}$, ${a2:coef}x {b2:signedcoef}y \le {c2}$. Find the vertex where the two slanted boundary lines meet.'
  figure:
    type: plot
    x: [-1, top]
    y: [-1, top]
    polygons:
      - {points: [[0, 0], [xi, 0], [x0, y0], [0, yi]], fill: true}
    points:
      - {at: [x0, y0], label: '?'}
  answers:
    - {name: x0, label: '$x =$'}
    - {name: y0, label: '$y =$'}
  solution: |-
    Solve ${a1:coef}x {b1:signedcoef}y = {c1}$ and ${a2:coef}x {b2:signedcoef}y = {c2}$ together (elimination works well).
    The lines meet at **$({x0}, {y0})$**. Check: ${a1}({x0}) + {b1}({y0}) = {c1}$ and ${a2}({x0}) + {b2}({y0}) = {c2}$.

- id: alg-d-lp-max
  title: Maximize an objective over a region
  topic: Systems of inequalities
  vars:
    x0: {min: 1, max: 6}
    y0: {min: 1, max: 6}
    a1: {min: 2, max: 5}
    b1: {min: 1, max: 2}
    a2: {min: 1, max: 2}
    b2: {min: 2, max: 5}
    p: {min: 1, max: 9}
    q: {min: 1, max: 9}
  calc:
    c1: a1*x0 + b1*y0
    c2: a2*x0 + b2*y0
    xi: c1/a1
    yi: c2/b2
    P1: p*xi
    P2: p*x0 + q*y0
    P3: q*yi
    best: max(P1, P2, P3)
    top: max(xi, yi) + 1
  where: ['a1 > b1', 'b2 > a2', 'xi == round(xi)', 'yi == round(yi)']
  prompt: 'Maximize $P = {p:coef}x {q:signedcoef}y$ subject to $x \ge 0$, $y \ge 0$, ${a1:coef}x {b1:signedcoef}y \le {c1}$ and ${a2:coef}x {b2:signedcoef}y \le {c2}$. What is the maximum value of $P$?'
  figure:
    type: plot
    x: [-1, top]
    y: [-1, top]
    polygons:
      - {points: [[0, 0], [xi, 0], [x0, y0], [0, yi]], fill: true}
  answers:
    - {name: best, label: 'Maximum $P$'}
  solution: |-
    The vertices are $(0, 0)$, $({xi}, 0)$, $({x0}, {y0})$ (where the slanted lines meet) and $(0, {yi})$.
    $P$ there: $0$, ${P1}$, ${P2}$ and ${P3}$. The largest is **{best}**.
