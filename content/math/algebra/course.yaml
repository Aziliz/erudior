id: math-algebra
title: Algebra
description: >-
  Algebra from the first equation through college algebra: real numbers, linear
  equations and inequalities, functions and lines, systems, polynomials and factoring,
  quadratics, radicals, complex numbers, rational expressions, polynomial functions,
  exponentials and logarithms, and sequences and series. Every lesson teaches with
  worked examples and graphs, and every skill has generated practice problems.
