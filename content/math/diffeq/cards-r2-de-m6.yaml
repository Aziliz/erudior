# Module 6, round 2: cards for the honors lessons
- {front: 'Annihilator of $t^ne^{\alpha t}$', back: '$(D - \alpha)^{n+1}$', topic: Annihilators}
- {front: 'Annihilator of $\cos\beta t$ or $\sin\beta t$', back: '$D^2 + \beta^2$ (roots $\pm i\beta$)', topic: Annihilators}
- {front: 'Annihilator of $e^{\alpha t}\cos\beta t$ or $e^{\alpha t}\sin\beta t$', back: '$(D - \alpha)^2 + \beta^2 = D^2 - 2\alpha D + \alpha^2 + \beta^2$', topic: Annihilators}
- {front: 'Annihilator of a polynomial of degree $n$', back: '$D^{n+1}$', topic: Annihilators}
- {front: 'Annihilator of a sum $f_1 + f_2$', back: 'The product $A_1(D)A_2(D)$ of their annihilators (a shared factor is needed only once, to the higher of its two powers)', topic: Annihilators}
- {front: 'The annihilator method for $p(D)y = g$', back: 'Apply $A(D)$ with $A(D)g = 0$; solve $A(D)p(D)y = 0$; delete the $y_c$ terms; what remains is the form of $Y$.', topic: Annihilators}
- {front: 'Why the modification rule works', back: 'A root shared by $A(r)$ and $p(r)$ has its multiplicities added in $A(r)p(r)$, which brings in the extra powers of $t$.', topic: Annihilators}
- {front: 'Exponential shift rule', back: '$p(D)\big[e^{\alpha t}v\big] = e^{\alpha t}p(D + \alpha)v$', topic: Annihilators}
- {front: 'Which functions have annihilators?', back: 'Exactly the finite sums of $t^ne^{\alpha t}\cos\beta t$ and $t^ne^{\alpha t}\sin\beta t$; not $\tan t$, $\ln t$ or $1/t$.', topic: Annihilators}
- {front: 'When do differential operators commute?', back: 'When their coefficients are constant; $D(tD) \ne (tD)D$.', topic: Annihilators}
- {front: 'Damping ratio $\zeta$', back: '$\zeta = \dfrac{\gamma}{2\sqrt{km}} = \dfrac{\gamma}{\gamma_c}$', topic: Quality factor}
- {front: 'Quality factor $Q$', back: '$Q = \dfrac{\sqrt{km}}{\gamma} = \dfrac{m\omega_0}{\gamma} = \dfrac{1}{2\zeta}$', topic: Quality factor}
- {front: '$Q$ and $\zeta$ for critical damping', back: '$\zeta = 1$, $Q = \tfrac12$', topic: Quality factor}
- {front: 'How long does a system with quality factor $Q$ ring?', back: 'About $Q$ cycles: after $Q$ natural periods the envelope $e^{-\omega_0t/(2Q)}$ is $e^{-\pi} \approx 4\%$.', topic: Quality factor}
- {front: 'Logarithmic decrement', back: '$\delta = \ln\dfrac{u_n}{u_{n+1}} = \dfrac{2\pi\zeta}{\sqrt{1 - \zeta^2}}$; $\zeta = \dfrac{\delta}{\sqrt{4\pi^2 + \delta^2}}$; $Q \approx \pi/\delta$', topic: Quality factor}
- {front: 'Steady amplitude when driven at $\omega_0$', back: '$F_0/(\gamma\omega_0) = Q \cdot F_0/k$: $Q$ times the static deflection', topic: Quality factor}
- {front: 'Half-power bandwidth', back: '$\Delta\omega = \omega_+ - \omega_- = \gamma/m = \omega_0/Q$; also $\omega_+\omega_- = \omega_0^2$', topic: Quality factor}
- {front: 'Average power absorbed by a forced oscillator', back: '$P(\omega) = \dfrac{F_0^2\gamma\omega^2}{2[(k - m\omega^2)^2 + \gamma^2\omega^2]}$, peak $F_0^2/(2\gamma)$ exactly at $\omega_0$', topic: Quality factor}
- {front: '$Q$ of a series RLC circuit', back: '$Q = \dfrac1R\sqrt{\dfrac LC}$, with $\omega_0 = 1/\sqrt{LC}$ and $\Delta\omega = R/L$', topic: Quality factor}
- {front: 'When does the displacement amplitude have a peak?', back: 'When $Q > 1/\sqrt2$; it is at $\omega_0\sqrt{1 - 1/(2Q^2)}$', topic: Quality factor}
- {front: 'Euler–Bernoulli beam equation', back: '$EI\,y^{(4)} = w(x)$; $y''$ slope, $EI\,y''''$ moment, $EI\,y''''''$ shear (up to sign)', topic: Beams and buckling}
- {front: 'Clamped end conditions', back: '$y = 0$, $y'' = 0$', topic: Beams and buckling}
- {front: 'Simply supported (pinned) end conditions', back: '$y = 0$, $y'''' = 0$', topic: Beams and buckling}
- {front: 'Free end conditions', back: '$y'''' = 0$, $y'''''' = 0$', topic: Beams and buckling}
- {front: 'Simply supported beam, uniform load: largest sag', back: '$\dfrac{5wL^4}{384EI}$ at the middle', topic: Beams and buckling}
- {front: 'Cantilever, uniform load: tip deflection', back: '$\dfrac{wL^4}{8EI}$', topic: Beams and buckling}
- {front: 'Beam clamped at both ends, uniform load: middle sag', back: '$\dfrac{wL^4}{384EI}$, a fifth of the simply supported value', topic: Beams and buckling}
- {front: 'How many solutions can a boundary value problem have?', back: 'One, none or infinitely many; e.g. $y'''' + y = 0$, $y(0) = 0$ with $y(\pi/2) = 1$, $y(\pi) = 1$, $y(\pi) = 0$.', topic: Beams and buckling}
- {front: 'Critical buckling load of a pinned column', back: '$P_{\text{cr}} = \dfrac{\pi^2EI}{L^2}$; buckled shape $\sin(\pi x/L)$', topic: Beams and buckling}
- {front: 'Critical load of a column clamped at the base and free at the top', back: '$\dfrac{\pi^2EI}{4L^2}$, a quarter of the pinned value', topic: Beams and buckling}
