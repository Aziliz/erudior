# Round 2 cards for module de-m3 (honors lessons 13h1 quadratic drag, 13h2 drug dosing)
- {front: 'Linear or quadratic drag? (Reynolds number)', back: '$\text{Re} = \rho vD/\mu$. Below about 1: linear (Stokes) drag $6\pi\mu Rv$. Above about 1,000: quadratic drag $\tfrac12\rho C_dAv^2$. Rough guides only.', topic: Quadratic drag}
- {front: 'Velocity falling from rest with quadratic drag', back: '$v = v_T\tanh(gt/v_T)$, $v_T = \sqrt{mg/k}$', topic: Quadratic drag}
- {front: 'Distance fallen from rest with quadratic drag', back: '$x = \dfrac{v_T^2}{g}\ln\cosh\dfrac{gt}{v_T}$', topic: Quadratic drag}
- {front: 'Speed against distance fallen (quadratic drag, from rest)', back: '$v^2 = v_T^2\left(1 - e^{-2gx/v_T^2}\right)$, found with the substitution $w = v^2$ in $v\,dv/dx = g(1 - v^2/v_T^2)$.', topic: Quadratic drag}
- {front: 'How do you separate $v'' = g(1 - v^2/v_T^2)$?', back: 'Put $u = v/v_T$: $\dfrac{v_T\,du}{1 - u^2} = g\,dt$, then partial fractions give $\tfrac{v_T}{2}\ln\dfrac{1 + u}{1 - u} = gt + C$.', topic: Quadratic drag}
- {front: 'Thrown up with quadratic drag: time to the top', back: '$t_{\text{top}} = \dfrac{v_T}{g}\tan^{-1}\dfrac{v_0}{v_T}$ (radians)', topic: Quadratic drag}
- {front: 'Thrown up with quadratic drag: maximum height', back: '$H = \dfrac{v_T^2}{2g}\ln\left(1 + \dfrac{v_0^2}{v_T^2}\right)$, less than $v_0^2/(2g)$.', topic: Quadratic drag}
- {front: 'Thrown up with quadratic drag: landing speed', back: '$v_{\text{ret}} = \dfrac{v_0v_T}{\sqrt{v_0^2 + v_T^2}}$, below both $v_0$ and $v_T$.', topic: Quadratic drag}
- {front: 'Why must an up-and-down flight with quadratic drag be split at the top?', back: 'Drag is $-kv|v|$: it points down while rising and up while falling, so the rise and fall obey different equations.', topic: Quadratic drag}
- {front: 'Same terminal velocity: does linear or quadratic drag approach it faster?', back: 'Quadratic. Below $v_T$ its force $mg(v/v_T)^2$ is smaller than the linear $mg(v/v_T)$, so the object accelerates more.', topic: Quadratic drag}
- {front: 'One-compartment model: the key quantities', back: '$C = X/V$, elimination $X'' = -kX$, clearance $\text{CL} = kV$, half-life $t_{1/2} = \ln 2/k$.', topic: Pharmacokinetics}
- {front: 'Concentration after an IV bolus', back: '$C(t) = \dfrac{D}{V}e^{-kt}$; $\ln C$ against $t$ is a line with slope $-k$.', topic: Pharmacokinetics}
- {front: 'Constant infusion at rate $R_0$', back: '$C(t) = \dfrac{R_0}{\text{CL}}(1 - e^{-kt})$, steady state $C_{ss} = R_0/\text{CL}$.', topic: Pharmacokinetics}
- {front: 'How long does an infusion take to reach steady state?', back: 'After $n$ half-lives it is $1 - 2^{-n}$ of the way (50%, 75%, 87.5%, …): about 4 to 5 half-lives, whatever the rate.', topic: Pharmacokinetics}
- {front: 'Loading dose before an infusion', back: '$D_L = C_{ss}V$. By superposition, the decaying bolus plus the rising infusion add to exactly $C_{ss}$.', topic: Pharmacokinetics}
- {front: 'Repeated doses: level just after dose $n$', back: '$C_n = \dfrac{D}{V}\cdot\dfrac{1 - r^n}{1 - r}$ with $r = e^{-k\tau}$ (a geometric series).', topic: Pharmacokinetics}
- {front: 'Repeated doses: steady-state peak and trough', back: 'Peak $\dfrac{D/V}{1 - r}$, trough $r$ times the peak; they differ by $D/V$. Accumulation factor $\dfrac{1}{1 - r}$.', topic: Pharmacokinetics}
- {front: 'Average steady-state level for repeated doses', back: '$\dfrac{D}{\text{CL}\cdot\tau}$: set by dose, clearance and interval, not by a loading dose.', topic: Pharmacokinetics}
- {front: 'Oral dose: amount in the body', back: '$X = \dfrac{FDk_a}{k_a - k}\left(e^{-kt} - e^{-k_at}\right)$; peak at $t_{\max} = \dfrac{\ln(k_a/k)}{k_a - k}$.', topic: Pharmacokinetics}
- {front: 'Oral dosing and the two-tank problem', back: 'Gut then body is two compartments in series, like tanks A and B in Lesson 12; with $k_a = k$ the body holds $FDk\,te^{-kt}$, peaking at $t = 1/k$.', topic: Pharmacokinetics}
