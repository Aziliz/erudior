# Round 2 glossary for module de-m3 (honors lessons 13h1 and 13h2)
- term: Reynolds number
  definition: 'The dimensionless number $\text{Re} = \rho vD/\mu$ comparing inertial and viscous effects in a fluid. Roughly, drag is linear in speed when Re is below about 1 and quadratic when Re is above about 1,000.'
  topic: Quadratic drag
- term: Stokes' law
  aliases: [Stokes drag, Stokes's law]
  definition: 'Linear drag on a small sphere moving slowly through a fluid: $F = 6\pi\mu Rv$, for radius $R$ and viscosity $\mu$. Valid at low Reynolds number.'
  topic: Quadratic drag
- term: drag equation
  definition: 'Quadratic drag at high Reynolds number: $F = \tfrac12\rho C_dAv^2$, with fluid density $\rho$, cross-sectional area $A$ and dimensionless shape factor $C_d$. In a falling-object model it is written $kv^2$ with $k = \tfrac12\rho C_dA$.'
  topic: Quadratic drag
- term: hyperbolic tangent
  aliases: [tanh]
  definition: '$\tanh s = \dfrac{e^s - e^{-s}}{e^s + e^{-s}}$. It rises from 0 toward 1, so $v = v_T\tanh(gt/v_T)$ rises from 0 toward $v_T$. Its inverse is $\tanh^{-1}u = \tfrac12\ln\dfrac{1 + u}{1 - u}$.'
  topic: Quadratic drag
- term: pharmacokinetics
  definition: 'The study of how the body absorbs, distributes and eliminates a drug, often with compartment models built from first-order linear equations.'
  topic: Pharmacokinetics
- term: one-compartment model
  aliases: [one-compartment models, compartment model, compartment models]
  definition: 'A pharmacokinetic model that treats the body as one well-stirred tank of volume $V$: $X'' = (\text{rate in}) - kX$, with concentration $C = X/V$.'
  topic: Pharmacokinetics
- term: volume of distribution
  definition: 'The apparent volume $V$ that links the amount of drug in the body to its blood concentration, $C = X/V$. It can exceed the body''s real volume when a drug moves into tissues.'
  topic: Pharmacokinetics
- term: elimination rate constant
  definition: 'The constant $k$ in first-order elimination $X'' = -kX$ (per hour). The half-life is $\ln 2/k$.'
  topic: Pharmacokinetics
- term: clearance
  definition: 'The volume of blood cleared of drug per unit time, $\text{CL} = kV$ (L/h). The elimination rate is $\text{CL} \cdot C$.'
  topic: Pharmacokinetics
- term: bolus
  aliases: [IV bolus, boluses]
  definition: 'A whole dose given at once into the blood, so $X(0) = D$ and $C = (D/V)e^{-kt}$.'
  topic: Pharmacokinetics
- term: infusion
  aliases: [constant infusion, IV infusion, infusions]
  definition: 'Drug delivered at a constant rate $R_0$: $X'' = R_0 - kX$, so $C = (R_0/\text{CL})(1 - e^{-kt})$, approaching $R_0/\text{CL}$.'
  topic: Pharmacokinetics
- term: loading dose
  aliases: [loading doses]
  definition: 'A larger first dose that brings the level straight to the target: $C_{ss}V$ before an infusion, or $D/(1 - r)$ for repeated doses.'
  topic: Pharmacokinetics
- term: maintenance dose
  aliases: [maintenance doses]
  definition: 'The regular dose or infusion rate that holds the level at its target once it is reached, such as an infusion at $C_{ss}\cdot\text{CL}$.'
  topic: Pharmacokinetics
- term: dosing interval
  aliases: [dosing intervals]
  definition: 'The time $\tau$ between repeated doses. The fraction of drug left after one interval is $r = e^{-k\tau}$.'
  topic: Pharmacokinetics
- term: accumulation factor
  definition: 'For repeated doses, $\dfrac{1}{1 - r}$ with $r = e^{-k\tau}$: the ratio of the steady-state peak to the peak after the first dose.'
  topic: Pharmacokinetics
- term: bioavailability
  definition: 'The fraction $F$ of an oral dose that reaches the circulation.'
  topic: Pharmacokinetics
