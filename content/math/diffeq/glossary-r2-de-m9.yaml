# Round 2 glossary terms for module de-m9 (honors lessons)
- term: irregular singular point
  aliases: [irregular singular points]
  definition: 'A singular point $x_0$ of $y'''' + p(x)y'' + q(x)y = 0$ where $(x - x_0)p(x)$ or $(x - x_0)^2q(x)$ fails to be analytic, as at $x = 0$ for $x^3y'''' + y = 0$. Frobenius''s theorem does not apply there.'
  topic: Frobenius method
- term: Frobenius series
  aliases: [Frobenius series solution, Frobenius series solutions]
  definition: 'A series $y = x^r\sum_{n=0}^\infty a_nx^n$ with $a_0 \ne 0$, where the exponent $r$ (a root of the indicial equation) need not be a whole number; used near a regular singular point.'
  topic: Frobenius method
- term: Bessel's equation
  aliases: [Bessel equation]
  definition: 'The equation $x^2y'''' + xy'' + (x^2 - \nu^2)y = 0$ of order $\nu$, with a regular singular point at $x = 0$; it arises from separating variables in polar or cylindrical coordinates.'
  topic: Frobenius method
- term: Bessel function
  aliases: [Bessel functions, J0]
  definition: 'A solution of Bessel''s equation. The one of order zero that is bounded at 0 is $J_0(x) = \sum_{k\ge0}\dfrac{(-1)^k}{(k!)^2}\left(\dfrac x2\right)^{2k}$; its zeros, about 2.405, 5.520, 8.654, set the frequencies of a round drum''s symmetric modes.'
  topic: Frobenius method
- term: Laplace's equation
  aliases: [Laplace equation]
  definition: 'The PDE $u_{xx} + u_{yy} = 0$, satisfied by steady temperatures in a plate (and by electric and gravitational potentials in empty regions).'
  topic: Laplace's equation
- term: harmonic function
  aliases: [harmonic functions]
  definition: 'A solution of Laplace''s equation $u_{xx} + u_{yy} = 0$, such as $x^2 - y^2$.'
  topic: Laplace's equation
- term: Dirichlet problem
  aliases: [Dirichlet problems]
  definition: 'Finding a solution of Laplace''s equation inside a region from its prescribed values on the boundary.'
  topic: Laplace's equation
- term: mean value property
  definition: 'For a harmonic function, the value at any point equals its average over any circle centered there (whose disk lies in the region).'
  topic: Laplace's equation
- term: maximum principle
  definition: 'A nonconstant harmonic function has no maximum or minimum inside its region; its extreme values occur on the boundary. It implies the Dirichlet problem has only one solution.'
  topic: Laplace's equation
- term: characteristics
  aliases: [characteristic lines, characteristic line]
  definition: 'For the wave equation $u_{tt} = a^2u_{xx}$, the lines $x - at = \text{const}$ and $x + at = \text{const}$ along which the right- and left-moving parts of a solution travel unchanged.'
  topic: d'Alembert's solution
- term: d'Alembert's formula
  aliases: [d'Alembert's solution, d'Alembert solution]
  definition: '$u(x, t) = \tfrac12\big[f(x - at) + f(x + at)\big] + \tfrac{1}{2a}\int_{x-at}^{x+at}g(s)\,ds$, the solution of $u_{tt} = a^2u_{xx}$ on an infinite string with $u(x, 0) = f(x)$, $u_t(x, 0) = g(x)$.'
  topic: d'Alembert's solution
- term: domain of dependence
  definition: 'For the wave equation, the interval $[x_0 - at_0,\ x_0 + at_0]$ of initial data that determines $u(x_0, t_0)$.'
  topic: d'Alembert's solution
- term: range of influence
  definition: 'For the wave equation, the region $|x - x_1| \le at$ that a disturbance at $x_1$ at time 0 can affect; it shows signals travel at the finite speed $a$.'
  topic: d'Alembert's solution
