<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" font-family="sans-serif" font-size="16" fill="#1c2833">
<rect width="640" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect x="15" y="45" width="290" height="320" rx="10" fill="#dde8f3" fill-opacity="0.45"/>
<text x="160" y="32" text-anchor="middle" font-size="16" font-weight="bold">Going up (v &gt; 0)</text>
<circle cx="160" cy="200" r="26" fill="#ffffff" stroke="#1c2833" stroke-width="3"/>
<line x1="176" y1="222" x2="176" y2="320" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<text x="192" y="312" text-anchor="start" font-size="16" font-weight="normal">weight mg</text>
<line x1="144" y1="222" x2="144" y2="280" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<text x="128" y="274" text-anchor="end" font-size="16" font-weight="normal">drag kv²</text>
<line x1="250" y1="220" x2="250" y2="130" stroke="#1c2833" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ah)"/>
<text x="262" y="170" text-anchor="start" font-size="16" font-weight="normal">v</text>
<text x="160" y="92" text-anchor="middle" font-size="15" font-weight="normal">both forces point down</text>
<rect x="335" y="45" width="290" height="320" rx="10" fill="#f7ebcf" fill-opacity="0.45"/>
<text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold">Coming down (v &lt; 0)</text>
<circle cx="480" cy="200" r="26" fill="#ffffff" stroke="#1c2833" stroke-width="3"/>
<line x1="480" y1="222" x2="480" y2="320" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<text x="496" y="312" text-anchor="start" font-size="16" font-weight="normal">weight mg</text>
<line x1="480" y1="174" x2="480" y2="110" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<text x="500" y="130" text-anchor="start" font-size="16" font-weight="normal">drag kv²</text>
<line x1="570" y1="160" x2="570" y2="250" stroke="#1c2833" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#ah)"/>
<text x="582" y="210" text-anchor="start" font-size="16" font-weight="normal">v</text>
<text x="480" y="92" text-anchor="middle" font-size="15" font-weight="normal">drag now points up</text>
</svg>
