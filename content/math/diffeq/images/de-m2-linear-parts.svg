<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" viewBox="0 0 640 270">
<rect x="0" y="0" width="640" height="270" fill="#ffffff"/>
<rect x="66" y="114" width="56" height="50" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="1"/>
<rect x="124" y="114" width="48" height="50" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="1"/>
<rect x="304" y="114" width="112" height="50" rx="8" fill="#e8e2f3" stroke="#1c2833" stroke-width="1"/>
<rect x="490" y="114" width="64" height="50" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="1"/>
<text x="94" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">t²</text>
<text x="148" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">y″</text>
<text x="192" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833">+</text>
<text x="222" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">3t</text>
<text x="256" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">y′</text>
<text x="288" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833">−</text>
<text x="360" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" fill="#1c2833">(sin <tspan font-style="italic">t</tspan>)</text>
<text x="442" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">y</text>
<text x="472" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833">=</text>
<text x="522" y="150" font-family="Helvetica, Arial, sans-serif" font-size="32" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">eᵗ</text>
<text x="94" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">leading coefficient a₂(t)</text>
<line x1="94" y1="68" x2="94" y2="112" stroke="#1c2833" stroke-width="1.5" stroke-linecap="butt"/>
<text x="148" y="222" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">highest derivative: order 2</text>
<line x1="148" y1="204" x2="148" y2="166" stroke="#1c2833" stroke-width="1.5" stroke-linecap="butt"/>
<text x="360" y="60" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">coefficient of y: a₀(t) = −sin t</text>
<line x1="360" y1="68" x2="360" y2="112" stroke="#1c2833" stroke-width="1.5" stroke-linecap="butt"/>
<text x="522" y="222" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">forcing term g(t)</text>
<line x1="522" y1="204" x2="522" y2="166" stroke="#1c2833" stroke-width="1.5" stroke-linecap="butt"/>
<text x="320" y="258" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">Linear: y, y′, y″ appear to the first power, never multiplied together.</text>
</svg>
