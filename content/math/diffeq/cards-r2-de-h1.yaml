# Round 2 cards for honors module de-h1 (lessons 90-93)
- {front: 'Limit cycle', back: 'An isolated closed orbit: nearby trajectories spiral toward it (stable), away (unstable), or one of each (semistable). Linear systems never have one.', topic: Limit cycles}
- {front: 'Why linear systems have no limit cycles', back: 'If $\mathbf{x}(t)$ is periodic, so is $c\,\mathbf{x}(t)$: closed orbits come in families and are never isolated.', topic: Limit cycles}
- {front: 'Polar identities for a planar system', back: '$rr'' = xx'' + yy''$ and $r^2\theta'' = xy'' - yx''$.', topic: Limit cycles}
- {front: 'Reading cycles from $r'' = f(r)$', back: 'With $\theta'' \ne 0$, each isolated zero $r = c > 0$ is a circular limit cycle; it is stable if $f > 0$ just inside and $f < 0$ just outside (a phase line in $r$).', topic: Limit cycles}
- {front: 'Poincaré–Bendixson theorem', back: 'In the plane: a closed, bounded region with no equilibria that keeps a trajectory inside for all $t \ge 0$ contains a closed orbit.', topic: Limit cycles}
- {front: 'Building a trapping annulus', back: 'Show $rr'' > 0$ on a small circle around a source and $rr'' < 0$ on a large circle, and check there are no equilibria between them.', topic: Limit cycles}
- {front: 'Bendixson / Dulac criterion', back: 'If $(gF)_x + (gG)_y$ keeps one sign on a region without holes (and is not identically zero on any small disk), there are no closed orbits there. It can only rule orbits out.', topic: Limit cycles}
- {front: 'Closed orbits and equilibria in the plane', back: 'Every closed orbit encloses at least one equilibrium.', topic: Limit cycles}
- {front: 'Van der Pol equation', back: '$x'''' - \mu(1 - x^2)x'' + x = 0$: energy in for $|x| < 1$, out for $|x| > 1$. One stable limit cycle for each $\mu > 0$, amplitude about 2; relaxation oscillations for large $\mu$.', topic: Limit cycles}
- {front: 'Long-run behavior in the plane (finitely many equilibria)', back: 'A bounded trajectory approaches an equilibrium, a closed orbit, or a loop of equilibria joined by trajectories. No chaos.', topic: Limit cycles}
- {front: 'Two ways an equilibrium in the plane loses stability', back: 'A real eigenvalue through 0 ($\det J = 0$): saddle-node, transcritical, pitchfork. A complex pair across the imaginary axis ($\operatorname{tr} J = 0$, $\det J > 0$): Hopf.', topic: Hopf bifurcation}
- {front: 'Supercritical Hopf prototype', back: '$r'' = \mu r - r^3$, $\theta'' = \omega$: stable spiral for $\mu < 0$; for $\mu > 0$ an unstable origin and a stable cycle of radius $\sqrt\mu$, period $2\pi/\omega$.', topic: Hopf bifurcation}
- {front: 'Subcritical Hopf prototype', back: '$r'' = r(\mu + r^2 - r^4)$: cycles at $r^2 = (1 \pm \sqrt{1 + 4\mu})/2$. An unstable cycle shrinks onto the origin at $\mu = 0$; the large cycle survives down to $\mu = -1/4$.', topic: Hopf bifurcation}
- {front: 'Hopf theorem (informal)', back: 'Eigenvalues $\pm i\omega_0$ at $\mu_0$, crossing with nonzero speed: periodic orbits are born with size $\propto \sqrt{|\mu - \mu_0|}$ and period near $2\pi/\omega_0$.', topic: Hopf bifurcation}
- {front: 'What decides supercritical vs subcritical', back: 'The nonlinear (cubic) terms, through the first Lyapunov coefficient. The linearization is the same in both cases.', topic: Hopf bifurcation}
- {front: 'Brusselator Hopf point', back: '$x'' = 1 - (b+1)x + ax^2y$, $y'' = bx - ax^2y$: equilibrium $(1, b/a)$, $T = b - 1 - a$, $D = a$. Hopf at $b = 1 + a$, period near $2\pi/\sqrt a$.', topic: Hopf bifurcation}
- {front: 'Hysteresis in a subcritical Hopf bifurcation', back: 'Raising $\mu$ past 0 makes the state jump to a large cycle; lowering it, the oscillation persists until the cycles collide at $\mu = -1/4$.', topic: Hopf bifurcation}
- {front: 'Amplitude of $x'''' - (\mu - x^2)x'' + x = 0$ near onset', back: 'Hopf at $\mu = 0$ ($T = \mu$, $D = 1$); numerically the cycle amplitude is about $2\sqrt\mu$, period near $2\pi$.', topic: Hopf bifurcation}
- {front: 'Euler on the logistic equation', back: '$y_{n+1} = y_n + hry_n(1 - y_n)$ becomes the logistic map $x_{n+1} = Rx_n(1 - x_n)$ with $R = 1 + hr$, $x = \frac{hr}{1 + hr}y$.', topic: Iterated maps}
- {front: 'Stability of a fixed point of a map', back: '$e_{n+1} \approx f''(x^*)e_n$: stable if $|f''(x^*)| < 1$, unstable if $> 1$. Negative $f''$ means alternating approach.', topic: Iterated maps}
- {front: 'Logistic map fixed points', back: '$x^* = 0$ (multiplier $R$) and $x^* = 1 - 1/R$ (multiplier $2 - R$, stable for $1 < R < 3$).', topic: Iterated maps}
- {front: 'Logistic map 2-cycle', back: '$p, q = \dfrac{(R + 1) \pm \sqrt{(R - 3)(R + 1)}}{2R}$, multiplier $4 + 2R - R^2$; stable for $3 < R < 1 + \sqrt6 \approx 3.449$.', topic: Iterated maps}
- {front: 'Period-doubling cascade of the logistic map', back: 'Periods 2, 4, 8, 16 born at $R \approx 3, 3.4495, 3.5441, 3.5644$; they accumulate at $R_\infty \approx 3.5699$.', topic: Iterated maps}
- {front: 'Feigenbaum constant', back: '$\delta \approx 4.669$: the limiting ratio of successive gaps between period-doubling values; the same for all smooth one-hump maps with a quadratic peak.', topic: Iterated maps}
- {front: 'Period-3 window of the logistic map', back: 'Opens at $R = 1 + \sqrt8 \approx 3.828$. Li and Yorke (1975): period three implies chaos.', topic: Iterated maps}
- {front: 'Lyapunov exponent of a map', back: '$\lambda = \lim_{n\to\infty} \frac1n\sum_{k=0}^{n-1}\ln|f''(x_k)|$. Negative: stable cycle. Positive: chaos. Logistic map at $R = 4$: $\ln 2$.', topic: Iterated maps}
- {front: 'Chaos (definition used here)', back: 'Deterministic, bounded behavior that never becomes periodic and has sensitive dependence on initial conditions.', topic: Iterated maps}
- {front: 'Strange numerical behavior: first check', back: 'Halve the step size. If the behavior changes, it was an artifact of the method (Euler with $hr > 2$ on the logistic equation).', topic: Iterated maps}
- {front: 'Lorenz equations', back: '$x'' = \sigma(y - x)$, $y'' = rx - y - xz$, $z'' = xy - bz$; classic chaotic values $\sigma = 10$, $b = 8/3$, $r = 28$.', topic: Chaos in differential equations}
- {front: 'Divergence of the Lorenz field', back: '$-(\sigma + 1 + b)$, a negative constant: volumes shrink like $e^{-(\sigma + 1 + b)t}$, so the attractor has zero volume.', topic: Chaos in differential equations}
- {front: 'Lorenz equilibria', back: 'The origin, and for $r > 1$: $C_\pm = (\pm\sqrt{b(r-1)}, \pm\sqrt{b(r-1)}, r - 1)$, born in a pitchfork at $r = 1$.', topic: Chaos in differential equations}
- {front: 'Lorenz origin eigenvalues', back: '$-b$ and $\lambda = \frac{-(\sigma + 1) \pm \sqrt{(\sigma + 1)^2 + 4\sigma(r - 1)}}{2}$; a saddle for $r > 1$ (at $r = 28$: $11.83$, $-22.83$, $-8/3$).', topic: Chaos in differential equations}
- {front: 'When $C_\pm$ lose stability', back: 'At $r_H = \dfrac{\sigma(\sigma + b + 3)}{\sigma - b - 1}$ (needs $\sigma > b + 1$), $\approx 24.74$ for $\sigma = 10$, $b = 8/3$: a subcritical Hopf bifurcation.', topic: Chaos in differential equations}
- {front: 'Strange attractor', back: 'An attractor with fractal structure on which motion has sensitive dependence. Lorenz: zero volume, dimension about 2.06; existence proved by Tucker (2002).', topic: Chaos in differential equations}
- {front: 'Predictability horizon', back: '$t \approx \frac1\lambda\ln(\Delta/\delta_0)$. Each factor of 10 in starting accuracy adds only $\ln 10/\lambda$ (about 2.5 time units for Lorenz, $\lambda \approx 0.91$).', topic: Chaos in differential equations}
- {front: 'Lorenz map', back: 'Successive maxima of $z(t)$ satisfy $z_{n+1} \approx f(z_n)$ with a tent-shaped $f$ whose slope exceeds 1 in size: a chaotic one-dimensional map inside the flow.', topic: Chaos in differential equations}
- {front: 'Minimum dimension for chaos', back: 'Autonomous ODEs: 3 (Poincaré–Bendixson rules out the plane). Forced 2nd-order equations count as 3. Maps: chaos already in 1 dimension.', topic: Chaos in differential equations}
- {front: 'What a numerical solution of a chaotic system gets right', back: 'Not individual trajectories beyond the horizon, but the attractor''s shape and long-run statistics, which agree across step sizes.', topic: Chaos in differential equations}
