# Honors module de-h1 (round 2): nonlinear dynamics and chaos
- term: closed orbit
  aliases: [closed orbits, periodic orbit, periodic orbits]
  definition: 'A trajectory that returns to its starting point, so the solution is periodic: $\mathbf{x}(t + T) = \mathbf{x}(t)$ for some period $T > 0$.'
  topic: Limit cycles
- term: limit cycle
  aliases: [limit cycles]
  definition: 'An isolated closed orbit: nearby trajectories are not closed but spiral toward it (stable), away from it (unstable), or toward it on one side and away on the other (semistable). Linear systems never have one.'
  topic: Limit cycles
- term: Poincaré–Bendixson theorem
  aliases: [Poincare-Bendixson theorem, Poincaré-Bendixson theorem, Poincaré–Bendixson]
  definition: 'For a planar autonomous system with continuously differentiable right sides: if a closed, bounded region contains no equilibria and a trajectory starting in it stays in it for all $t \ge 0$, then the region contains a closed orbit (the trajectory is one or approaches one).'
  topic: Limit cycles
- term: trapping region
  aliases: [trapping regions]
  definition: 'A region whose boundary the flow crosses only inward, so trajectories that start inside stay inside for all later time. An annulus around a source is the usual one in Poincaré–Bendixson arguments.'
  topic: Limit cycles
- term: Dulac's criterion
  aliases: [Dulac criterion, Bendixson–Dulac criterion]
  definition: 'If, on a region without holes, $(gF)_x + (gG)_y$ has one sign (and is not identically zero) for some continuously differentiable $g(x, y)$, then $x'' = F$, $y'' = G$ has no closed orbit in that region.'
  topic: Limit cycles
- term: Bendixson's criterion
  aliases: [Bendixson criterion, Bendixson's negative criterion]
  definition: 'Dulac''s criterion with $g = 1$: if the divergence $F_x + G_y$ has one sign on a region without holes (and is not identically zero), there are no closed orbits there. Proved with Green''s theorem.'
  topic: Limit cycles
- term: Van der Pol equation
  aliases: [Van der Pol oscillator, van der Pol equation, van der Pol oscillator]
  definition: '$x'''' - \mu(1 - x^2)x'' + x = 0$ with $\mu > 0$: damping that is negative for $|x| < 1$ and positive for $|x| > 1$. It has exactly one closed orbit, a stable limit cycle of amplitude about 2.'
  topic: Limit cycles
- term: relaxation oscillation
  aliases: [relaxation oscillations]
  definition: 'A periodic motion made of slow buildups separated by sudden jumps, as in the Van der Pol oscillator with large $\mu$.'
  topic: Limit cycles
- term: Hopf bifurcation
  aliases: [Hopf bifurcations, Andronov–Hopf bifurcation, Hopf bifurcation theorem]
  definition: 'A bifurcation in which a complex pair of eigenvalues of an equilibrium''s Jacobian crosses the imaginary axis (trace passes through 0 while the determinant is positive), creating or destroying a limit cycle of size proportional to $\sqrt{|\mu - \mu_0|}$ and period near $2\pi/\omega_0$.'
  topic: Hopf bifurcation
- term: supercritical
  aliases: [supercritical Hopf bifurcation]
  definition: 'Of a Hopf bifurcation: a small stable limit cycle is born as the equilibrium loses stability and grows smoothly from zero size, as in $r'' = \mu r - r^3$.'
  topic: Hopf bifurcation
- term: subcritical
  aliases: [subcritical Hopf bifurcation]
  definition: 'Of a Hopf bifurcation: an unstable limit cycle shrinks onto a stable equilibrium, which then loses stability; the state jumps to a distant attractor, often with hysteresis, as in $r'' = \mu r + r^3 - r^5$.'
  topic: Hopf bifurcation
- term: Brusselator
  definition: 'The model chemical oscillator $x'' = 1 - (b + 1)x + ax^2y$, $y'' = bx - ax^2y$ (Prigogine and Lefever, 1968). Its equilibrium $(1, b/a)$ has a Hopf bifurcation at $b = 1 + a$.'
  topic: Hopf bifurcation
- term: saddle-node bifurcation of cycles
  aliases: [fold of cycles, saddle-node of cycles]
  definition: 'A bifurcation in which a stable and an unstable limit cycle approach each other, merge and disappear as a parameter changes.'
  topic: Hopf bifurcation
- term: hysteresis
  definition: 'Dependence of a system''s state on its history: the jump in one direction happens at a different parameter value from the jump back, as with a subcritical Hopf bifurcation.'
  topic: Hopf bifurcation
- term: paradox of enrichment
  definition: 'The prediction (Rosenzweig, 1971) that in predator–prey models with saturating predation, raising the prey''s carrying capacity can destabilize coexistence through a Hopf bifurcation and cause large population cycles.'
  topic: Hopf bifurcation
- term: iterated map
  aliases: [iterated maps]
  definition: 'A rule $x_{n+1} = f(x_n)$ that produces a sequence by applying the same function again and again; Euler''s method is an example.'
  topic: Iterated maps
- term: logistic map
  definition: 'The iterated map $x_{n+1} = Rx_n(1 - x_n)$. Euler''s method on $y'' = ry(1 - y)$ with step $h$ becomes it with $R = 1 + hr$. It shows period doubling and chaos as $R$ increases.'
  topic: Iterated maps
- term: fixed point
  aliases: [fixed points]
  definition: 'A value $x^*$ with $f(x^*) = x^*$ for a map $x_{n+1} = f(x_n)$; the map version of an equilibrium.'
  topic: Iterated maps
- term: multiplier
  aliases: [multipliers]
  definition: 'For a fixed point of a map, $f''(x^*)$: errors are multiplied by about this much each step, so the fixed point is stable if $|f''(x^*)| < 1$ and unstable if $|f''(x^*)| > 1$. For a cycle, the product of $f''$ over its points.'
  topic: Iterated maps
- term: cobweb diagram
  aliases: [cobweb diagrams, cobweb plot]
  definition: 'A picture of iterating a map: graph $y = f(x)$ and $y = x$, then alternate vertical moves to the curve and horizontal moves to the diagonal.'
  topic: Iterated maps
- term: 2-cycle
  aliases: [2-cycles, period-2 cycle, period-2 orbit]
  definition: 'A pair of values $p \ne q$ with $f(p) = q$ and $f(q) = p$, so the iterates alternate between them; the points are fixed points of $f \circ f$.'
  topic: Iterated maps
- term: period-doubling bifurcation
  aliases: [period doubling, period-doubling, period-doubling bifurcations]
  definition: 'A bifurcation of a map in which a fixed point (or cycle) loses stability as its multiplier passes through $-1$ and a stable cycle of twice the period appears.'
  topic: Iterated maps
- term: Feigenbaum constant
  aliases: [Feigenbaum's constant]
  definition: '$\delta \approx 4.669$: the limiting ratio of the gaps between successive period-doubling parameter values, the same for every smooth one-hump map (Mitchell Feigenbaum, 1970s).'
  topic: Iterated maps
- term: chaos
  aliases: [chaotic]
  definition: 'Bounded, deterministic behavior that never settles into an equilibrium or periodic pattern and has sensitive dependence on initial conditions (a positive Lyapunov exponent).'
  topic: Iterated maps
- term: Lyapunov exponent
  aliases: [Lyapunov exponents]
  definition: 'The average exponential rate at which nearby trajectories separate. For a map, $\lambda = \lim \frac1n\sum\ln|f''(x_k)|$; positive means chaos, negative means a stable fixed point or cycle.'
  topic: Iterated maps
- term: Lorenz equations
  aliases: [Lorenz system, Lorenz model]
  definition: '$x'' = \sigma(y - x)$, $y'' = rx - y - xz$, $z'' = xy - bz$: a three-variable convection model published by Edward Lorenz in 1963, chaotic at $\sigma = 10$, $b = 8/3$, $r = 28$.'
  topic: Chaos in differential equations
- term: dissipative
  definition: 'Of a system $\mathbf{x}'' = \mathbf{F}(\mathbf{x})$: the divergence of $\mathbf{F}$ is negative, so volumes of starting points shrink as time goes on.'
  topic: Chaos in differential equations
- term: attractor
  aliases: [attractors]
  definition: 'A bounded set that nearby trajectories approach and then stay near, such as a stable equilibrium, a stable limit cycle or a strange attractor.'
  topic: Chaos in differential equations
- term: strange attractor
  aliases: [strange attractors, Lorenz attractor]
  definition: 'An attractor with a fractal structure on which motion has sensitive dependence on initial conditions, such as the Lorenz attractor.'
  topic: Chaos in differential equations
- term: predictability horizon
  definition: 'The time before a starting error $\delta_0$ grows to a tolerance $\Delta$: about $\frac1\lambda\ln(\Delta/\delta_0)$ for Lyapunov exponent $\lambda$. It grows only logarithmically as accuracy improves.'
  topic: Chaos in differential equations
- term: butterfly effect
  definition: 'Popular name for sensitive dependence on initial conditions, from Edward Lorenz''s 1972 talk asking whether a butterfly''s wings in Brazil could set off a tornado in Texas.'
  topic: Chaos in differential equations
