# Round 2 glossary for module de-m8 (honors lessons 37h1 and 37h2)
- term: coupled oscillators
  aliases: [coupled oscillator]
  definition: 'Several masses (or circuits, pendulums) joined so that each one''s motion pushes on the others; for masses and springs, $M\mathbf{x}'''' = -K\mathbf{x}$.'
  topic: Coupled oscillators
- term: stiffness matrix
  aliases: [stiffness matrices]
  definition: 'The symmetric matrix $K$ in $M\mathbf{x}'''' = -K\mathbf{x}$. Each diagonal entry adds the springs touching that mass; an off-diagonal entry is minus the spring joining two masses.'
  topic: Coupled oscillators
- term: mode shape
  aliases: [mode shapes]
  definition: 'An eigenvector $\mathbf{v}$ of $M^{-1}K$: the pattern of relative displacements of the masses in one normal mode, which oscillates as $\cos(\omega t)\mathbf{v}$ with $\omega^2$ the matching eigenvalue.'
  topic: Coupled oscillators
- term: in-phase mode
  definition: 'A normal mode in which the masses move in the same direction together, such as $(1, 1)$ for two identical masses; the coupling spring barely stretches, so it is the slower mode.'
  topic: Coupled oscillators
- term: out-of-phase mode
  definition: 'A normal mode in which the masses move in opposite directions, such as $(1, -1)$ for two identical masses; the coupling spring stretches the most, so it is the faster mode.'
  topic: Coupled oscillators
- term: modal coordinates
  aliases: [modal coordinate]
  definition: 'Variables $\mathbf{q}$ with $\mathbf{x} = V\mathbf{q}$, where the columns of $V$ are the mode shapes. Each one satisfies its own equation $q'''' + \omega^2q = 0$, so the coupled system separates.'
  topic: Coupled oscillators
- term: principal minors
  aliases: [principal minor]
  definition: 'The determinants left after deleting row $i$ and column $i$ of a square matrix. For a $3 \times 3$ matrix their sum $E_2$ is the coefficient of $\lambda$ in $\det(\lambda I - A)$.'
  topic: Stability of larger systems
- term: dominant eigenvalue
  definition: 'The eigenvalue with the largest real part. In the long run it controls how fast solutions of $\mathbf{x}'' = A\mathbf{x}$ decay or grow.'
  topic: Stability of larger systems
- term: Routh–Hurwitz criterion
  aliases: [Routh-Hurwitz criterion, Routh–Hurwitz test, Routh-Hurwitz test]
  definition: 'A test for whether every root of a polynomial has negative real part, using only its coefficients. For $\lambda^3 + a_1\lambda^2 + a_2\lambda + a_3$: $a_1 > 0$, $a_3 > 0$ and $a_1a_2 > a_3$.'
  topic: Stability of larger systems
