# Round 3 cards for module de-m8 (honors lesson 37h3, Lyapunov functions)
- {front: 'Derivative of $V$ along trajectories of $x'' = F$, $y'' = G$', back: '$\dot V = V_xF + V_yG = \nabla V \cdot (F, G)$. No solution needed.', topic: Lyapunov functions}
- {front: 'Lyapunov stable vs asymptotically stable', back: 'Stable: start close, stay close (for every $\varepsilon$ there is a $\delta$). Asymptotically stable: stable, and nearby solutions also tend to the equilibrium. A center is stable but not asymptotically stable.', topic: Lyapunov functions}
- {front: 'Lyapunov''s theorem (direct method)', back: '$V$ positive definite near the equilibrium. $\dot V \le 0$: stable. $\dot V < 0$ except at the equilibrium: asymptotically stable.', topic: Lyapunov functions}
- {front: 'Instability test with a function $V$', back: 'If $V(0, 0) = 0$, $V > 0$ at points arbitrarily close to the origin, and $\dot V > 0$ except at the origin, the origin is unstable.', topic: Lyapunov functions}
- {front: 'A candidate $V$ has $\dot V > 0$ somewhere. Conclusion?', back: 'None about the system: this $V$ fails. Try another one.', topic: Lyapunov functions}
- {front: 'Damped pendulum energy', back: '$x'' = y$, $y'' = -\sin x - cy$, $E = \tfrac12y^2 + 1 - \cos x$, $\dot E = -cy^2 \le 0$. Stable by Lyapunov; asymptotically stable by LaSalle.', topic: Lyapunov functions}
- {front: 'When is $ax^2 + bxy + cy^2$ positive definite?', back: 'Exactly when $a > 0$ and $4ac - b^2 > 0$ (complete the square). As $\mathbf{x}^{T}P\mathbf{x}$: $P = \begin{bmatrix} a & b/2 \\ b/2 & c \end{bmatrix}$ with $a > 0$, $\det P > 0$.', topic: Lyapunov functions}
- {front: 'Quadratic $V$ for $\mathbf{x}'' = A\mathbf{x}$', back: '$V = \mathbf{x}^{T}P\mathbf{x}$ gives $\dot V = \mathbf{x}^{T}(A^{T}P + PA)\mathbf{x}$. Lyapunov equation: $A^{T}P + PA = -Q$.', topic: Lyapunov functions}
- {front: 'Choosing weights in $V = x^2 + wy^2$', back: 'Compute $\dot V$ and pick $w$ to cancel the $xy$ term; then check the remaining $x^2$ and $y^2$ coefficients are negative.', topic: Lyapunov functions}
- {front: 'Lyapunov functions vs linearization', back: 'When the Jacobian has a center or a zero eigenvalue, linearization is inconclusive; a Lyapunov function can still decide (e.g. $x'' = -y - x^3$, $y'' = x - y^3$ with $V = x^2 + y^2$).', topic: Lyapunov functions}
- {front: 'LaSalle''s invariance principle', back: '$\Omega$ closed, bounded, positively invariant, $\dot V \le 0$ on $\Omega$: every solution in $\Omega$ approaches the largest invariant set inside $\{\dot V = 0\}$.', topic: Lyapunov functions}
- {front: 'Global asymptotic stability from $V$', back: '$V$ positive definite on the whole plane, $\dot V < 0$ except at the equilibrium, and $V$ radially unbounded ($V \to \infty$ as $x^2 + y^2 \to \infty$).', topic: Lyapunov functions}
- {front: 'Basin estimate from a level set', back: 'If the bounded piece of $\{V \le c\}$ around the equilibrium has $\dot V < 0$ except at the equilibrium, it lies in the basin of attraction. Use the largest such $c$.', topic: Lyapunov functions}
- {front: 'Who and when: Lyapunov, LaSalle', back: 'A. M. Lyapunov, The General Problem of the Stability of Motion (1892). J. P. LaSalle, invariance principle (1960), building on Barbashin and Krasovskii (1952).', topic: Lyapunov functions}
