# Round 2, module de-m7 (Laplace transforms)
- {front: 'Zero-input and zero-state response', back: 'Zero-input: the response to the initial conditions alone (IC terms over the characteristic polynomial). Zero-state: the response to the forcing from rest, $H(s)G(s)$, or $h * g$. The solution is their sum.', topic: Laplace transform IVPs}

# 32h1 periodic inputs
- {front: 'Transform of a periodic function with period $T$', back: '$\mathcal{L}\{f\} = \dfrac{1}{1 - e^{-Ts}}\displaystyle\int_0^T e^{-st}f(t)\,dt$', topic: Laplace transforms of periodic functions}
- {front: 'Where does the factor $\dfrac{1}{1 - e^{-Ts}}$ come from?', back: 'Each period contributes the first period''s integral times $e^{-nTs}$; the geometric series $\sum_{n\ge0}e^{-nTs}$ sums to $\dfrac{1}{1 - e^{-Ts}}$ for $s > 0$.', topic: Laplace transforms of periodic functions}
- {front: 'On/off square wave (1 for time $a$, 0 for time $a$)', back: '$\dfrac{1}{s(1 + e^{-as})}$', topic: Laplace transforms of periodic functions}
- {front: '$\pm1$ square wave (1 for time $a$, $-1$ for time $a$)', back: '$\dfrac1s\tanh\dfrac{as}{2}$', topic: Laplace transforms of periodic functions}
- {front: 'Sawtooth $f(t) = t$ on $[0, T)$, period $T$', back: '$\dfrac{1}{s^2} - \dfrac{Te^{-Ts}}{s(1 - e^{-Ts})}$ (the ramp minus a staircase of drops of size $T$)', topic: Laplace transforms of periodic functions}
- {front: 'Half-wave rectified $\sin t$ (period $2\pi$)', back: '$\dfrac{1}{(s^2 + 1)(1 - e^{-\pi s})}$', topic: Laplace transforms of periodic functions}
- {front: 'Full-wave rectified $|\sin t|$ (period $\pi$)', back: '$\dfrac{1 + e^{-\pi s}}{(s^2 + 1)(1 - e^{-\pi s})} = \dfrac{1}{s^2 + 1}\coth\dfrac{\pi s}{2}$', topic: Laplace transforms of periodic functions}
- {front: 'Inverting a transform with $\dfrac{1}{1 + e^{-cs}}$', back: 'Expand $1 - e^{-cs} + e^{-2cs} - \cdots$ and use the second shifting theorem term by term; at any time only finitely many terms are on.', topic: Laplace transforms of periodic functions}
- {front: 'Periodic steady state of $y'' + ky = bf$, square wave on and off for time $p$', back: 'With $r = e^{-kp}$: maximum $M = \dfrac{b}{k}\cdot\dfrac{1}{1 + r}$, minimum $m = Mr$. Found by matching the values at the switching times.', topic: Laplace transforms of periodic functions}

# 32h2 transform rules in s
- {front: 'Multiplication by $t$', back: '$\mathcal{L}\{tf(t)\} = -F''(s)$; $\mathcal{L}\{t^nf(t)\} = (-1)^nF^{(n)}(s)$', topic: Transform rules in s}
- {front: 'Division by $t$', back: '$\mathcal{L}\left\{\dfrac{f(t)}{t}\right\} = \displaystyle\int_s^\infty F(\sigma)\,d\sigma$, when $f(t)/t$ has a finite limit as $t \to 0^+$', topic: Transform rules in s}
- {front: 'A factor $\dfrac1s$ in a transform', back: 'Integrate from 0 to $t$: $\mathcal{L}\left\{\int_0^t f(\tau)\,d\tau\right\} = \dfrac{F(s)}{s}$', topic: Transform rules in s}
- {front: '$\mathcal{L}\{t^a\}$ for real $a > -1$', back: '$\dfrac{\Gamma(a + 1)}{s^{a+1}}$; e.g. $\mathcal{L}\{t^{-1/2}\} = \sqrt{\pi/s}$, $\mathcal{L}\{\sqrt t\} = \dfrac{\sqrt\pi}{2s^{3/2}}$', topic: Transform rules in s}
- {front: 'Gamma function facts', back: '$\Gamma(x + 1) = x\Gamma(x)$, $\Gamma(n + 1) = n!$, $\Gamma(\tfrac12) = \sqrt\pi$', topic: Transform rules in s}
- {front: 'Inverting $\ln$ or $\arctan$ of a rational function', back: 'Differentiate $F$, invert $-F''$ to get $tf(t)$, divide by $t$. E.g. $\ln\dfrac{s + a}{s + b} \to \dfrac{e^{-bt} - e^{-at}}{t}$.', topic: Transform rules in s}
- {front: '$\mathcal{L}\left\{\dfrac{\sin t}{t}\right\}$', back: '$\arctan\dfrac1s$; at $s = 1$ it gives $\int_0^\infty e^{-t}\frac{\sin t}{t}\,dt = \frac\pi4$', topic: Transform rules in s}
- {front: 'Coefficient $t$ in an ODE, under the Laplace transform', back: 'Becomes $-\dfrac{d}{ds}$: the transformed equation is an ODE in $s$ (often first order), not an algebraic equation.', topic: Transform rules in s}
- {front: '$\mathcal{L}\{J_0(t)\}$', back: '$\dfrac{1}{\sqrt{s^2 + 1}}$ (from Bessel''s equation $ty'''' + y'' + ty = 0$, $y(0) = 1$)', topic: Transform rules in s}

# 32h3 poles and stability
- {front: 'Pole location and behavior', back: 'Real part = growth rate (negative: decays), imaginary part = angular frequency. Left half-plane: decays; imaginary axis: persists; right half-plane: grows.', topic: Poles and stability}
- {front: 'BIBO stability test', back: 'A rational transfer function (numerator degree at most the denominator''s) is BIBO stable exactly when every pole has $\operatorname{Re}s < 0$.', topic: Poles and stability}
- {front: 'Are poles on the imaginary axis stable?', back: 'Not BIBO stable: an input at the matching frequency gives resonance, e.g. $y'''' + 4y = \sin 2t$ gives $\tfrac18(\sin 2t - 2t\cos 2t)$.', topic: Poles and stability}
- {front: 'Stability of $s^2 + bs + c$', back: 'Both roots have negative real part exactly when $b > 0$ and $c > 0$.', topic: Poles and stability}
- {front: 'Stability of a cubic $a_3s^3 + a_2s^2 + a_1s + a_0$ ($a_3 > 0$)', back: 'All roots in the left half-plane exactly when $a_2, a_1, a_0 > 0$ and $a_2a_1 > a_3a_0$ (Routh–Hurwitz).', topic: Poles and stability}
- {front: 'Final value theorem', back: '$\lim_{t\to\infty}f(t) = \lim_{s\to0}sF(s)$, only if every pole of $sF$ is in the open left half-plane.', topic: Poles and stability}
- {front: 'Final value of a step response', back: 'For a stable system, the DC gain $H(0)$ (times the step height).', topic: Poles and stability}
- {front: 'Closed-loop transfer function (negative feedback, gain $K$)', back: '$\dfrac{KG}{1 + KG}$; closed-loop poles are the roots of $1 + KG(s) = 0$.', topic: Poles and stability}
- {front: 'Proportional control trade-off', back: 'Raising $K$ shrinks the steady error but moves closed-loop poles toward (and eventually past) the imaginary axis.', topic: Poles and stability}
