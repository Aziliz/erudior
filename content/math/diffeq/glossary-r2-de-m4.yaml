# Round 2, module de-m4 (honors lessons)
- term: constant-quota harvesting
  aliases: [constant quota harvesting, quota harvesting]
  definition: 'Removing a fixed amount $h$ per unit time regardless of stock size: $P'' = rP(1 - P/K) - h$. It has a saddle-node bifurcation at $h = rK/4$.'
  topic: Harvesting models
- term: constant-effort harvesting
  aliases: [constant effort harvesting, effort harvesting]
  definition: 'Harvesting at a fixed per-capita rate $E$, so the catch $EP$ is proportional to the stock: $P'' = rP(1 - P/K) - EP$. For $E < r$ it is logistic with rate $r - E$ and capacity $K(1 - E/r)$.'
  topic: Harvesting models
- term: sustainable yield
  aliases: [sustainable yields]
  definition: 'The catch per unit time that can continue indefinitely because the stock sits at a stable equilibrium. For constant effort it is $Y(E) = EK(1 - E/r)$, largest ($rK/4$) at $E = r/2$.'
  topic: Harvesting models
- term: return time
  aliases: [return times, characteristic return time]
  definition: 'For a stable equilibrium $y^*$ of $y'' = f(y)$, the time $T_R = 1/\lvert f''(y^*)\rvert$ for a small disturbance to shrink by a factor of $e$.'
  topic: Harvesting models
- term: resilience
  definition: 'How well a system recovers from disturbances. Here: how fast it returns to equilibrium (short return time). Ecologists also use it for how large a disturbance a system can absorb without changing state.'
  topic: Harvesting models
- term: critical slowing down
  definition: 'The lengthening of the return time as a parameter approaches a bifurcation such as a saddle-node, because $f''(y^*) \to 0$ there.'
  topic: Harvesting models
- term: early-warning signal
  aliases: [early-warning signals, early warning signal, early warning signals]
  definition: 'A measurable sign, such as slower recovery or growing, longer-lasting fluctuations, proposed as a warning that a system is nearing a tipping point. Useful but not foolproof.'
  topic: Harvesting models
- term: test equation
  aliases: [Dahlquist test equation]
  definition: 'The equation $y'' = \lambda y$ (with $\operatorname{Re}\lambda < 0$), used to judge whether a numerical method keeps decaying solutions decaying.'
  topic: Stiff equations
- term: stability function
  aliases: [stability functions, amplification factor]
  definition: 'The factor $R(z)$, $z = h\lambda$, by which a one-step method multiplies $y$ in one step of $y'' = \lambda y$. Euler: $1 + z$; backward Euler: $1/(1 - z)$.'
  topic: Stiff equations
- term: region of absolute stability
  aliases: [stability region, stability regions, regions of absolute stability]
  definition: 'The set of complex $z = h\lambda$ with $\lvert R(z)\rvert \le 1$, where a method''s numbers for $y'' = \lambda y$ do not grow. For Euler it is the disk $\lvert 1 + z\rvert \le 1$.'
  topic: Stiff equations
- term: explicit method
  aliases: [explicit methods]
  definition: 'A numerical method that computes $y_{n+1}$ directly from values already known, such as Euler, improved Euler and RK4. Their stability regions are bounded.'
  topic: Stiff equations
- term: implicit method
  aliases: [implicit methods]
  definition: 'A numerical method in which $y_{n+1}$ appears on both sides of the step formula, so each step means solving an equation (often by Newton''s method). Examples: backward Euler, trapezoidal method.'
  topic: Stiff equations
- term: backward Euler method
  aliases: [backward Euler, implicit Euler method, implicit Euler]
  definition: 'The implicit method $y_{n+1} = y_n + h f(t_{n+1}, y_{n+1})$, using the slope at the end of the step. First order, A-stable and L-stable.'
  topic: Stiff equations
- term: trapezoidal method
  aliases: [trapezoidal rule method, implicit trapezoidal method]
  definition: 'The implicit method $y_{n+1} = y_n + \tfrac h2\big(f(t_n, y_n) + f(t_{n+1}, y_{n+1})\big)$. Second order and A-stable, but not L-stable.'
  topic: Stiff equations
- term: A-stable
  aliases: [A-stability]
  definition: 'Said of a method whose region of absolute stability contains the whole left half-plane $\operatorname{Re} z \le 0$, so decaying modes decay for every step size.'
  topic: Stiff equations
- term: L-stable
  aliases: [L-stability]
  definition: 'A-stable with, in addition, $R(z) \to 0$ as $\lvert z\rvert \to \infty$, so very stiff components are damped out at once. Backward Euler is L-stable; the trapezoidal method is not.'
  topic: Stiff equations
- term: backward differentiation formulas
  aliases: [BDF, BDF methods]
  definition: 'A family of implicit methods for stiff problems that generalize backward Euler by using several earlier points to reach higher order.'
  topic: Stiff equations
- term: Richardson extrapolation
  definition: 'Combining results $A(h)$ and $A(h/2)$ of an order-$p$ method to cancel the leading error: $A(h/2) + \dfrac{A(h/2) - A(h)}{2^p - 1}$. The fraction also estimates the error of $A(h/2)$.'
  topic: Adaptive step size
- term: embedded pair
  aliases: [embedded pairs, embedded Runge–Kutta pair, embedded Runge-Kutta pair]
  definition: 'Two Runge–Kutta methods of different orders that share slope evaluations, so their difference gives a nearly free estimate of local error. Example: Heun–Euler.'
  topic: Adaptive step size
- term: Dormand–Prince method
  aliases: [Dormand-Prince method, Dormand–Prince, Dormand-Prince]
  definition: 'A 5(4) embedded Runge–Kutta pair used by MATLAB''s ode45 and SciPy''s default RK45 solver; about six evaluations of $f$ per step.'
  topic: Adaptive step size
- term: tolerance
  aliases: [tolerances, error tolerance]
  definition: 'In an adaptive solver, the target for the estimated local error of each step. It does not guarantee the final (global) error.'
  topic: Adaptive step size
- term: safety factor
  definition: 'A number a little below 1 (often 0.8 or 0.9) multiplying the proposed new step size, so that fewer steps exceed the tolerance and get rejected.'
  topic: Adaptive step size
- term: adaptive step-size control
  aliases: [adaptive step size, adaptive step-size, adaptive method, adaptive methods, step-size control]
  definition: 'Choosing each step size automatically from an error estimate: accept the step if the estimate is within tolerance, otherwise retry, and set the next step by $h_{\text{new}} = \sigma h(\text{tol}/\text{est})^{1/(p+1)}$.'
  topic: Adaptive step size
- term: local extrapolation
  definition: 'Continuing an adaptive computation from the higher-order result of an embedded pair, even though the error estimate refers to the lower-order one.'
  topic: Adaptive step size
