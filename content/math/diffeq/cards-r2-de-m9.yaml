# Round 2 cards for module de-m9 (honors lessons)
- {front: Regular singular point at $x = 0$, back: '$x = 0$ is singular, but $xp(x)$ and $x^2q(x)$ are analytic there (for $y'''' + py'' + qy = 0$).', topic: Frobenius method}
- {front: Frobenius series, back: '$y = \sum_{n=0}^\infty a_nx^{n+r}$ with $a_0 \ne 0$, for $x > 0$ near a regular singular point.', topic: Frobenius method}
- {front: Indicial equation at a regular singular point, back: '$r(r - 1) + p_0r + q_0 = 0$, with $p_0 = \lim_{x\to0}xp(x)$, $q_0 = \lim_{x\to0}x^2q(x)$.', topic: Frobenius method}
- {front: 'Frobenius: roots not differing by an integer', back: 'Two independent Frobenius series, one for each root.', topic: Frobenius method}
- {front: 'Frobenius: equal roots $r_1 = r_2$', back: '$y_2 = y_1\ln x + x^{r_1}\sum_{n\ge1}b_nx^n$: a logarithm always appears.', topic: Frobenius method}
- {front: 'Frobenius: roots differing by a positive integer', back: '$y_2 = Cy_1\ln x + x^{r_2}\sum b_nx^n$, where $C$ may be 0 (e.g. Bessel of order $\tfrac12$).', topic: Frobenius method}
- {front: 'Bessel''s equation of order $\nu$', back: '$x^2y'''' + xy'' + (x^2 - \nu^2)y = 0$; indicial roots $r = \pm\nu$.', topic: Frobenius method}
- {front: '$J_0(x)$ as a series', back: '$\sum_{k=0}^\infty\dfrac{(-1)^k}{(k!)^2}\left(\dfrac x2\right)^{2k} = 1 - \dfrac{x^2}{4} + \dfrac{x^4}{64} - \cdots$', topic: Frobenius method}
- {front: First three zeros of $J_0$, back: 'About 2.405, 5.520, 8.654 (spacing approaches $\pi$); a round drum''s symmetric modes have frequencies in these ratios.', topic: Frobenius method}
- {front: Why the second Bessel solution is dropped for a drum or cylinder, back: 'It has a $\ln x$ term and is unbounded at the center, where the solution must be finite.', topic: Frobenius method}
- {front: Laplace's equation, back: '$u_{xx} + u_{yy} = 0$: steady temperatures, potentials; solutions are harmonic functions.', topic: Laplace's equation}
- {front: 'Rectangle, only the top edge nonzero ($u(x, b) = f(x)$)', back: '$u = \sum b_n\dfrac{\sinh(n\pi y/a)}{\sinh(n\pi b/a)}\sin\dfrac{n\pi x}{a}$, $b_n = \dfrac2a\int_0^af\sin\dfrac{n\pi x}{a}\,dx$', topic: Laplace's equation}
- {front: Separating Laplace's equation on a rectangle, back: '$X''''/X = -Y''''/Y = -\lambda$: sines in one direction force sinh and cosh in the other.', topic: Laplace's equation}
- {front: 'Disk of radius $R$, edge data $f(\theta)$', back: '$u = \frac{a_0}{2} + \sum(r/R)^n(a_n\cos n\theta + b_n\sin n\theta)$, with the Fourier coefficients of $f$.', topic: Laplace's equation}
- {front: Mean value property, back: 'A harmonic function''s value at a point equals its average over any circle centered there.', topic: Laplace's equation}
- {front: Maximum principle, back: 'A nonconstant harmonic function takes its maximum and minimum only on the boundary.', topic: Laplace's equation}
- {front: Uniqueness for the Dirichlet problem, back: 'Two solutions with the same boundary values differ by a harmonic function that is 0 on the boundary, so 0 everywhere (maximum principle).', topic: Laplace's equation}
- {front: 'Square, one edge at 100, three at 0: center value', back: '25, by symmetry and superposition (four rotations add up to $u \equiv 100$).', topic: Laplace's equation}
- {front: Many nonzero edges on a rectangle, back: 'Split into problems with one nonzero edge each, solve each with sines along that edge, and add.', topic: Laplace's equation}
- {front: 'General solution of $u_{tt} = a^2u_{xx}$', back: '$u = F(x - at) + G(x + at)$: a right-moving and a left-moving wave.', topic: d'Alembert's solution}
- {front: d'Alembert's formula, back: '$u = \tfrac12\big[f(x - at) + f(x + at)\big] + \dfrac{1}{2a}\displaystyle\int_{x-at}^{x+at}g(s)\,ds$', topic: d'Alembert's solution}
- {front: Characteristic coordinates for the wave equation, back: '$\xi = x - at$, $\eta = x + at$ turn $u_{tt} = a^2u_{xx}$ into $u_{\xi\eta} = 0$.', topic: d'Alembert's solution}
- {front: 'Domain of dependence of $(x_0, t_0)$', back: '$[x_0 - at_0,\ x_0 + at_0]$: only initial data there affects $u(x_0, t_0)$.', topic: d'Alembert's solution}
- {front: A plucked pulse released from rest, back: 'Splits into two half-height copies moving apart at speed $a$.', topic: d'Alembert's solution}
- {front: String with fixed ends via d'Alembert, back: 'Extend $f$ and $g$ to be odd and $2L$-periodic; pulses reflect upside down, and the motion has period $2L/a$.', topic: d'Alembert's solution}
- {front: A standing wave as traveling waves, back: '$\sin kx\cos kat = \tfrac12\big[\sin k(x - at) + \sin k(x + at)\big]$', topic: d'Alembert's solution}
- {front: Signal speed, back: 'Wave equation: finite speed $a$. Heat equation model: a change is felt everywhere at once (faintly far away).', topic: d'Alembert's solution}
- {front: 'String struck with velocity $g$ on $|x| < w$ (infinite string, $f = 0$)', back: '$u = \dfrac{1}{2a}\times g$ times the length of $[x - at,\ x + at] \cap [-w, w]$; the struck part ends up permanently displaced.', topic: d'Alembert's solution}
