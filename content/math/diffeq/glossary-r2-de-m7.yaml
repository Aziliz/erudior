# Round 2, module de-m7 (Laplace transforms)
- term: square wave
  aliases: [square waves]
  definition: 'A periodic input that switches between two constant levels, such as 1 for a time $a$ and 0 for a time $a$ (period $2a$). Its Laplace transform is $\dfrac{1}{s(1 + e^{-as})}$; the $\pm1$ version has transform $\dfrac1s\tanh\dfrac{as}{2}$.'
  topic: Laplace transforms of periodic functions
- term: sawtooth wave
  aliases: [sawtooth]
  definition: 'A periodic input that rises linearly and then drops back, such as $f(t) = t$ for $0 \le t < T$ repeated with period $T$. Transform: $\dfrac{1}{s^2} - \dfrac{Te^{-Ts}}{s(1 - e^{-Ts})}$.'
  topic: Laplace transforms of periodic functions
- term: half-wave rectified sine
  definition: 'The positive arches of a sine wave with zero in between: $\sin t$ on $[0, \pi)$, 0 on $[\pi, 2\pi)$, period $2\pi$. Transform: $\dfrac{1}{(s^2 + 1)(1 - e^{-\pi s})}$.'
  topic: Laplace transforms of periodic functions
- term: full-wave rectified sine
  definition: 'The function $|\sin t|$, with period $\pi$: every negative arch of $\sin t$ is flipped up. Transform: $\dfrac{1 + e^{-\pi s}}{(s^2 + 1)(1 - e^{-\pi s})}$.'
  topic: Laplace transforms of periodic functions
- term: one-period window
  definition: 'For a periodic function $f$ with period $T$, the function $f_T$ equal to $f$ on $[0, T)$ and 0 afterward. Its transform is $\int_0^T e^{-st}f(t)\,dt$, and $\mathcal{L}\{f\} = \dfrac{\mathcal{L}\{f_T\}}{1 - e^{-Ts}}$.'
  topic: Laplace transforms of periodic functions
- term: periodic steady state
  definition: 'The solution with the same period as a periodic input that the response of a stable linear system approaches once the transient (the part that remembers the initial condition) has decayed.'
  topic: Laplace transforms of periodic functions
- term: Dirichlet integral
  definition: 'The improper integral $\int_0^\infty \frac{\sin t}{t}\,dt = \frac{\pi}{2}$. It converges only conditionally; Laplace transforms suggest its value as the limit of $\arctan(1/s)$ as $s \to 0^+$.'
  topic: Transform rules in s
- term: Gamma function
  aliases: [gamma function]
  definition: '$\Gamma(x) = \int_0^\infty e^{-u}u^{x - 1}\,du$ for $x > 0$. It satisfies $\Gamma(x + 1) = x\Gamma(x)$, $\Gamma(n + 1) = n!$ and $\Gamma(\tfrac12) = \sqrt\pi$, and gives $\mathcal{L}\{t^a\} = \Gamma(a + 1)/s^{a+1}$ for $a > -1$.'
  topic: Transform rules in s
- term: zero-input response
  definition: 'The part of a linear system''s response caused only by its initial conditions, with no forcing. In the Laplace solution it is the initial-condition terms divided by the characteristic polynomial.'
  topic: Laplace transform IVPs
- term: zero-state response
  definition: 'The part of a linear system''s response caused only by the forcing, starting from rest (zero initial conditions). Its transform is $H(s)G(s)$, so it equals the convolution $h * g$.'
  topic: Laplace transform IVPs
- term: pole
  aliases: [poles]
  definition: 'A value of $s$ where a rational function such as a transfer function $H(s)$ blows up: a root of the denominator after common factors are cancelled. Each pole $p$ contributes a term like $e^{pt}$ to the impulse response.'
  topic: Poles and stability
- term: s-plane
  definition: 'The complex plane of the transform variable $s$, with $\operatorname{Re}s$ across and $\operatorname{Im}s$ up. Poles in the left half give decaying terms, poles in the right half growing ones.'
  topic: Poles and stability
- term: BIBO stability
  aliases: [BIBO stable, bounded-input bounded-output stability]
  definition: 'A system is BIBO stable if every bounded input gives a bounded output from zero initial conditions. For a rational transfer function (numerator degree at most the denominator''s) this holds exactly when every pole has negative real part.'
  topic: Poles and stability
- term: final value theorem
  definition: 'If every pole of $sF(s)$ lies in the open left half-plane, then $\lim_{t\to\infty}f(t) = \lim_{s\to0}sF(s)$. Without that condition the formula can give a wrong answer.'
  topic: Poles and stability
- term: initial value theorem
  definition: '$f(0^+) = \lim_{s\to\infty}sF(s)$, for $F$ the transform of an ordinary (piecewise continuous, exponential-order) function whose right-hand limit at 0 exists.'
  topic: Poles and stability
- term: step response
  aliases: [step responses]
  definition: 'The output of a system starting at rest when the input is the unit step $u_0(t)$; its transform is $H(s)/s$.'
  topic: Poles and stability
- term: DC gain
  definition: 'The value $H(0)$ of a transfer function: for a stable system, the factor by which a constant input is scaled in the long run, and the final value of the step response.'
  topic: Poles and stability
- term: proportional control
  definition: 'Feedback in which the controller drives the system with an input proportional to the error, $Ke = K(r - y)$, where $r$ is the desired value and $y$ the measured output.'
  topic: Poles and stability
- term: closed-loop transfer function
  definition: 'The transfer function from the reference $r$ to the output $y$ of a feedback loop. With plant $G$ and gain $K$ in negative feedback it is $\dfrac{KG}{1 + KG}$; its poles are the roots of $1 + KG(s) = 0$.'
  topic: Poles and stability
