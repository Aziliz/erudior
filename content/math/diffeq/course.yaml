id: math-diffeq
title: Differential Equations
description: >-
  Ordinary differential equations from the AP-calculus bridge (slope fields, separable
  equations, exponential and logistic growth, Euler's method) through a full sophomore
  college course: first-order methods and models, autonomous equations and bifurcations,
  numerical methods, second-order and higher-order linear equations, vibrations and
  circuits, Laplace transforms, linear and nonlinear systems with phase portraits, series
  solutions, and an introduction to Fourier series and the heat and wave equations.
revision: 3
released: true
changelog: Checked against university and open-textbook sources; corrected missing conditions in theorems and definitions, and added a few short sections; new lessons on complex gain and sinusoidal response, nonhomogeneous systems and the matrix exponential, and heat problems with other boundary conditions.
order: 9
subject: Math
