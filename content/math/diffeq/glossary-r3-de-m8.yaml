# Round 3 glossary for module de-m8 (honors lesson 37h3, Lyapunov functions)
- term: direct method
  aliases: [Lyapunov's direct method, Lyapunov's second method, second method of Lyapunov]
  definition: 'Lyapunov''s method of proving stability without solving: find a positive definite function $V$ and check the sign of its derivative along trajectories $\dot V$.'
  topic: Lyapunov functions
- term: Lyapunov stable
  aliases: [stable in the sense of Lyapunov, Lyapunov stability]
  definition: 'Describes an equilibrium such that solutions starting close enough stay as close as you like: for every $\varepsilon > 0$ there is a $\delta > 0$ so that starting within $\delta$ keeps a solution within $\varepsilon$ for all $t \ge 0$.'
  topic: Lyapunov functions
- term: conserved quantity
  aliases: [conserved quantities, first integral, first integrals]
  definition: 'A function of the state that stays constant along every solution, such as the energy of an undamped pendulum; its derivative along trajectories is zero.'
  topic: Lyapunov functions
- term: derivative along trajectories
  aliases: [orbital derivative]
  definition: 'For $x'' = F$, $y'' = G$, the rate of change of $V(x, y)$ along a solution: $\dot V = V_xF + V_yG = \nabla V \cdot (F, G)$, computed without solving.'
  topic: Lyapunov functions
- term: positive definite
  aliases: [positive-definite]
  definition: 'A function $V$ is positive definite near the origin if $V(0, 0) = 0$ and $V > 0$ at every other point nearby. The form $ax^2 + bxy + cy^2$ is positive definite exactly when $a > 0$ and $4ac - b^2 > 0$.'
  topic: Lyapunov functions
- term: Lyapunov function
  aliases: [Lyapunov functions]
  definition: 'A continuously differentiable, positive definite function $V$ with $\dot V \le 0$ near an equilibrium; it proves stability, and asymptotic stability if $\dot V < 0$ away from the equilibrium.'
  topic: Lyapunov functions
- term: Lyapunov equation
  aliases: [Lyapunov matrix equation]
  definition: 'The matrix equation $A^{T}P + PA = -Q$. For a positive definite $Q$, it has a positive definite solution $P$ exactly when every eigenvalue of $A$ has negative real part, and then $V = \mathbf{x}^{T}P\mathbf{x}$ is a Lyapunov function for $\mathbf{x}'' = A\mathbf{x}$.'
  topic: Lyapunov functions
- term: invariant set
  aliases: [invariant sets]
  definition: 'A set such that every solution starting in it stays in it for all time, forward and backward; equilibria and closed orbits are examples.'
  topic: Lyapunov functions
- term: positively invariant
  aliases: [positively invariant set, positively invariant sets, forward invariant]
  definition: 'Describes a set that solutions starting in it never leave for $t \ge 0$; a bounded piece of $\{V \le c\}$ with $\dot V \le 0$ is an example.'
  topic: Lyapunov functions
- term: LaSalle's invariance principle
  aliases: [LaSalle's principle, LaSalle invariance principle, LaSalle's theorem]
  definition: 'If $\Omega$ is closed, bounded and positively invariant and $\dot V \le 0$ on $\Omega$, every solution starting in $\Omega$ approaches the largest invariant set contained in $\{\dot V = 0\}$ (LaSalle, 1960).'
  topic: Lyapunov functions
- term: globally asymptotically stable
  aliases: [global asymptotic stability]
  definition: 'Describes an equilibrium that every solution approaches as $t \to \infty$: its basin of attraction is the whole space.'
  topic: Lyapunov functions
- term: radially unbounded
  definition: 'Describes a function $V$ with $V \to \infty$ as $x^2 + y^2 \to \infty$, so all its level sets are bounded; needed to conclude global asymptotic stability from a Lyapunov function.'
  topic: Lyapunov functions
- term: basin of attraction
  aliases: [basins of attraction, region of attraction, domain of attraction]
  definition: 'The set of all starting points whose solutions approach a given asymptotically stable equilibrium (or other attractor). A bounded sublevel set $\{V \le c\}$ with $\dot V < 0$ except at the equilibrium lies inside it.'
  topic: Lyapunov functions
