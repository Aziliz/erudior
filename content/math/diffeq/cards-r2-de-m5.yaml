# Round 2 cards for de-m5 honors lessons
# Solution spaces (21h1)
- {front: 'Abel''s theorem with limits', back: '$W(t) = W(t_0)\exp\left(-\int_{t_0}^{t} p(s)\,ds\right)$ for solutions of $y'''' + py'' + qy = 0$.', topic: Solution spaces}
- {front: 'Why $q$ does not affect the Wronskian', back: 'In $W'' = y_1y_2'''' - y_1''''y_2$, substituting $y'''' = -py'' - qy$ makes the $q$ terms cancel, leaving $W'' = -pW$.', topic: Solution spaces}
- {front: 'Dimension of the solution space of $y'''' + py'' + qy = 0$', back: '2: the map $y \mapsto (y(t_0), y''(t_0))$ is onto (existence) and one-to-one (uniqueness).', topic: Solution spaces}
- {front: 'Any three solutions of a second-order linear homogeneous equation', back: 'Are linearly dependent (e.g. $e^t + e^{-t} - 2\cosh t = 0$).', topic: Solution spaces}
- {front: 'Principal fundamental set at $t_0$', back: '$u_1$: $(1, 0)$ and $u_2$: $(0, 1)$ as $(y(t_0), y''(t_0))$; then $y = y(t_0)u_1 + y''(t_0)u_2$ and $W(t_0) = 1$.', topic: Solution spaces}
- {front: 'Principal fundamental set of $y'''' - y = 0$ at 0', back: '$\cosh t$ and $\sinh t$', topic: Solution spaces}
- {front: 'Quotient identity for the Wronskian', back: '$\left(\dfrac{y_2}{y_1}\right)'' = \dfrac{W}{y_1^2}$; with Abel''s $W$ it gives the reduction-of-order formula.', topic: Solution spaces}
- {front: '$p$ and $q$ from a fundamental set $y_1, y_2$', back: '$p = -\dfrac{W''}{W}$, $q = \dfrac{y_1''y_2'''' - y_1''''y_2''}{W}$', topic: Solution spaces}
- {front: 'Does $W(f, g) \equiv 0$ imply $f$, $g$ dependent?', back: 'Not in general ($t^2$ and $t\lvert t\rvert$, Peano 1889). Yes if both solve one $y'''' + py'' + qy = 0$ with continuous $p$, $q$.', topic: Solution spaces}
- {front: 'Does $W(f, g) \ne 0$ at one point imply independence?', back: 'Yes, for any differentiable $f$, $g$: if $f = kg$ then $W \equiv 0$.', topic: Solution spaces}
# Oscillation theory (21h2)
- {front: 'Removing the $y''$ term from $y'''' + py'' + qy = 0$', back: '$y = u\,e^{-\frac12\int p\,dt}$ gives $u'''' + Qu = 0$, $Q = q - \dfrac{p^2}{4} - \dfrac{p''}{2}$; $y$ and $u$ have the same zeros.', topic: Oscillation theory}
- {front: '$Q$ for $ay'''' + by'' + cy = 0$ (constants)', back: '$Q = \dfrac{c}{a} - \dfrac{b^2}{4a^2} = \dfrac{4ac - b^2}{4a^2}$: positive exactly when the roots are complex.', topic: Oscillation theory}
- {front: 'Sturm separation theorem', back: 'Between consecutive zeros of $y_1$, an independent solution $y_2$ has exactly one zero: the zeros interlace.', topic: Oscillation theory}
- {front: 'Sturm comparison theorem', back: 'If $Q_2 \ge Q_1$ (not identically equal), every solution of $v'''' + Q_2v = 0$ has a zero strictly between consecutive zeros of a solution of $u'''' + Q_1u = 0$.', topic: Oscillation theory}
- {front: 'Zero spacing when $m^2 \le Q \le M^2$', back: 'Consecutive zeros of $u'''' + Qu = 0$ are between $\pi/M$ and $\pi/m$ apart.', topic: Oscillation theory}
- {front: 'Zeros when $Q \le 0$', back: 'A nonzero solution of $u'''' + Qu = 0$ has at most one zero on that interval.', topic: Oscillation theory}
- {front: 'Bessel''s equation after removing $y''$', back: '$y = u/\sqrt t$, $u'''' + \left(1 + \dfrac{1/4 - \nu^2}{t^2}\right)u = 0$; for $\nu = \tfrac12$, zeros exactly $\pi$ apart.', topic: Oscillation theory}
- {front: 'Zeros of Airy''s equation $y'''' + ty = 0$', back: 'Infinitely many for $t > 0$, roughly $\pi/\sqrt t$ apart near $t$; at most one for $t \le 0$.', topic: Oscillation theory}
- {front: 'Key identity in Sturm''s comparison proof', back: '$(u''v - uv'')'' = (Q_2 - Q_1)uv$', topic: Oscillation theory}
