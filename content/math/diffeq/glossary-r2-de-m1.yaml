# Round 2 glossary terms for module de-m1 (honors lessons)
- term: orthogonal trajectories
  aliases: [orthogonal trajectory]
  definition: 'A family of curves each of which crosses every curve of a given family at a right angle. If the given family satisfies $y'' = f(x, y)$, its orthogonal trajectories satisfy $y'' = -1/f(x, y)$.'
  topic: Orthogonal trajectories
- term: self-orthogonal
  aliases: [self-orthogonal family]
  definition: 'Describes a family of curves whose orthogonal trajectories are members of the same family, such as the parabolas $y^2 = 4C(x + C)$.'
  topic: Orthogonal trajectories
- term: oblique trajectories
  aliases: [oblique trajectory]
  definition: 'Curves that cross every member of a given family at the same fixed angle, not necessarily a right angle.'
  topic: Orthogonal trajectories
- term: logarithmic spiral
  aliases: [logarithmic spirals]
  definition: 'The curve $r = Ae^{c\theta}$ in polar coordinates. With $c = \pm 1$ it crosses every line through the origin at $45^\circ$.'
  topic: Orthogonal trajectories
- term: SI model
  aliases: [SI epidemic model]
  definition: 'An epidemic model with susceptible and infected groups and no recovery: $\dfrac{dI}{dt} = \beta I\left(1 - \dfrac{I}{N}\right)$ for a closed population of $N$. It is the logistic equation with $K = N$.'
  topic: Logistic growth
- term: transmission rate
  definition: 'In the SI model, the constant $\beta$: roughly the number of new infections one infected person causes per unit time while almost everyone is still susceptible.'
  topic: Logistic growth
- term: Gompertz model
  aliases: [Gompertz equation, Gompertz curve, Gompertz growth]
  definition: 'The growth model $\dfrac{dP}{dt} = kP\ln\dfrac{K}{P}$, an S-curve that approaches the ceiling $K$ with its inflection point at $K/e$; solution $P = K\exp\left(-\ln\frac{K}{P_0}e^{-kt}\right)$.'
  topic: Gompertz growth
