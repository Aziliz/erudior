# Round 2 questions for module de-m1 (core lessons 01-05 and honors lessons 05h1, 05h2)

# ---------- Lesson 1: What a differential equation is ----------
- id: de-m1-r2-q01
  lesson: de-intro
  module_quiz: true
  type: text
  topic: DE basics
  stem: 'Solve $\dfrac{dy}{dx} = 4x^3$ with $y(1) = 6$. The particular solution is $y = x^4 + C$ with $C =$ ___. Give only the number.'
  accept: ['5']
  explanation: |-
    The general solution is $y = x^4 + C$. At $x = 1$: $6 = 1 + C$, so $C = 5$ and $y = x^4 + 5$.

- id: de-m1-r2-q02
  lesson: de-intro
  type: match
  topic: DE basics
  stem: 'Match each differential equation to the sentence it translates ($k > 0$).'
  pairs:
    - ['$\dfrac{dy}{dt} = ky$', 'y grows at a rate proportional to itself']
    - ['$\dfrac{dT}{dt} = -k(T - 20)$', 'T changes at a rate proportional to its difference from 20']
    - ['$\dfrac{dv}{dt} = -kv^2$', 'v decreases at a rate proportional to its square']
    - ['$\dfrac{dP}{dt} = kP(1000 - P)$', 'The rate is proportional to P and to 1000 − P']
  distractors: ['v decreases at a rate proportional to its square root']
  explanation: |-
    "Proportional to" means "a constant times". $ky$ is proportional to $y$; $-k(T - 20)$ to the difference $T - 20$ (the minus sign makes $T$ move toward 20); $-kv^2$ to the square of $v$, with a minus sign because $v$ decreases; $kP(1000 - P)$ to both $P$ and $1000 - P$. A square root would be $-k\sqrt{v}$, which is not listed.

- id: de-m1-r2-q03
  lesson: de-intro
  topic: DE basics
  stem: |-
    Which functions are solutions of $y'' + 9y = 0$? Select all that apply.
  choices: ['$y = \cos 3t$', '$y = 5\sin 3t$', '$y = \cos 9t$', '$y = e^{3t}$', '$y = 2\cos 3t - \sin 3t$']
  answer: [0, 1, 4]
  explanation: |-
    For $y = A\cos 3t + B\sin 3t$, $y'' = -9A\cos 3t - 9B\sin 3t = -9y$, so $y'' + 9y = 0$; that covers $\cos 3t$, $5\sin 3t$ and $2\cos 3t - \sin 3t$. For $\cos 9t$, $y'' = -81\cos 9t$ and $y'' + 9y = -72\cos 9t \ne 0$. For $e^{3t}$, $y'' + 9y = 18e^{3t} \ne 0$.

- id: de-m1-r2-q04
  lesson: de-intro
  type: order
  topic: DE basics
  stem: 'Put the steps for solving an initial value problem $\dfrac{dy}{dx} = f(x)$, $y(x_0) = y_0$ in order.'
  items:
    - 'Find the general solution $y = \int f(x)\,dx + C$'
    - 'Substitute $x = x_0$ and $y = y_0$'
    - 'Solve for $C$'
    - 'Write the particular solution and check it in the equation and the condition'
  explanation: |-
    The constant must be in the general solution before the initial condition can fix it, so integrate first, then substitute $x_0$ and $y_0$, solve for $C$, and finally write and check the particular solution.

- id: de-m1-r2-q05
  lesson: de-intro
  module_quiz: true
  topic: DE basics
  stem: 'Which constant functions are equilibrium solutions of $\dfrac{dy}{dt} = t(y - 1)(y + 3)$?'
  choices: ['$y = -1$ and $y = 3$', '$t = 0$ only', '$y = 1$ and $y = -3$', '$y = 0$, $y = 1$ and $y = -3$']
  answer: 2
  explanation: |-
    A constant $y = c$ has $y' = 0$, so it is a solution exactly when $t(c - 1)(c + 3) = 0$ for every $t$, which needs $c = 1$ or $c = -3$. The factor $t$ is zero only at one instant, so it gives no equilibrium, and $y = 0$ makes the right side $-3t$, not zero. The signs in $y = -1$, $y = 3$ are flipped.

# ---------- Lesson 2: Slope fields ----------
- id: de-m1-r2-q06
  lesson: de-slope-fields
  type: label
  topic: Slope fields
  stem: |-
    The picture shows the slope field of $\dfrac{dy}{dx} = x - y$ with three curves drawn on it and one segment highlighted. Name the numbered parts.
  image: {src: images/de-m1-slope-field-blank.svg, alt: 'The slope field of dy/dx = x minus y with a dashed line, a green line, a blue curve and one highlighted segment, marked 1 to 4'}
  labels:
    - {x: 16.7, y: 77.3, text: Isocline of slope 0}
    - {x: 42.7, y: 56.0, text: Straight-line solution}
    - {x: 32.3, y: 23.4, text: Solution curve}
    - {x: 53.1, y: 13.5, text: Slope segment}
  distractors: [Equilibrium solution, Vertical asymptote]
  explanation: |-
    1 is the dashed line $y = x$: every segment on it is flat, so it is the isocline of slope 0, but it is not a solution (a curve along it would need slope 1). 2 is $y = x - 1$, a straight-line solution: its slope 1 matches $x - y = 1$ at every point. 3 is the solution through $(0, 1)$, which bottoms out where it crosses the slope-0 isocline. 4 is a single slope segment. Nothing here is an equilibrium (a constant solution), since no row of segments is flat.

- id: de-m1-r2-q07
  lesson: de-slope-fields
  module_quiz: true
  type: text
  topic: Slope fields
  stem: 'In the slope field of $\dfrac{dy}{dx} = x^2 - 3y$, the segment drawn at the point $(2, -1)$ has slope ___.'
  accept: ['7']
  explanation: |-
    Substitute $x = 2$, $y = -1$: $2^2 - 3(-1) = 4 + 3 = 7$.

- id: de-m1-r2-q08
  lesson: de-slope-fields
  type: match
  topic: Slope fields
  stem: 'Match each equation to a feature of its slope field.'
  pairs:
    - ["$y' = x^2$", 'Every column of segments looks alike']
    - ["$y' = y(3 - y)$", 'Every row looks alike, with flat rows at two heights']
    - ["$y' = x - y$", 'Flat segments along a slanted line']
    - ["$y' = \\dfrac{x}{y}$", 'No segments along the x-axis']
  distractors: ['No segments along the y-axis']
  explanation: |-
    $y' = x^2$ depends only on $x$, so columns look alike. $y' = y(3 - y)$ depends only on $y$ (rows alike) and is zero at $y = 0$ and $y = 3$. For $y' = x - y$ the slope is 0 along the line $y = x$. For $y' = x/y$ the slope is undefined where $y = 0$, the $x$-axis; on the $y$-axis ($x = 0$) it is 0, not undefined.

- id: de-m1-r2-q09
  lesson: de-slope-fields
  module_quiz: true
  topic: Slope fields
  stem: |-
    Which statements about the slope field of $y' = y(2 - y)$ are true? Select all that apply.
  choices:
    - 'The equation is autonomous'
    - '$y = 2$ is an equilibrium solution'
    - 'Solutions with $0 < y < 2$ are increasing'
    - 'Solutions above $y = 2$ are increasing'
    - 'The isocline of slope 0 is the line $y = x$'
  answer: [0, 1, 2]
  explanation: |-
    The right side depends only on $y$, so the equation is autonomous. It is zero at $y = 0$ and $y = 2$, which are equilibria. For $0 < y < 2$ both factors are positive, so $y' > 0$. Above 2 the factor $2 - y$ is negative, so solutions decrease. The slope-0 isoclines are the horizontal lines $y = 0$ and $y = 2$, not $y = x$.

- id: de-m1-r2-q10
  lesson: de-slope-fields
  topic: Slope fields
  stem: 'For $\dfrac{dy}{dx} = x + 2y$, which line is the isocline of slope 2?'
  choices: ['$y = 1 - \tfrac{x}{2}$', '$y = 2 - x$', '$y = \tfrac{x}{2} - 1$', '$y = -\tfrac{x}{2}$']
  answer: 0
  explanation: |-
    Set the slope equal to 2: $x + 2y = 2$, so $y = 1 - \tfrac{x}{2}$. Forgetting to divide by 2 gives $y = 2 - x$; a sign slip gives $\tfrac{x}{2} - 1$; and $y = -\tfrac{x}{2}$ is the isocline of slope 0.

# ---------- Lesson 3: Separable equations ----------
- id: de-m1-r2-q11
  lesson: de-separable
  type: order
  topic: Separable equations
  stem: 'Put the steps for solving $\dfrac{dy}{dx} = xy^2$, $y(0) = 1$ by separation of variables in order.'
  items:
    - 'Write the right side as $g(x)h(y)$ with $g(x) = x$, $h(y) = y^2$'
    - 'Separate: $y^{-2}\,dy = x\,dx$'
    - 'Integrate both sides with one constant: $-\dfrac1y = \dfrac{x^2}{2} + C$'
    - 'Use $y(0) = 1$: $C = -1$'
    - 'Check that $y = \dfrac{2}{2 - x^2}$ satisfies the equation and $y(0) = 1$'
  explanation: |-
    Factor, separate, integrate (adding one constant), then fix the constant with the initial condition: $-1 = 0 + C$. Solving $-\frac1y = \frac{x^2}{2} - 1 = \frac{x^2 - 2}{2}$ gives $y = \frac{2}{2 - x^2}$, and the check comes last. (The equilibrium $y = 0$ does not satisfy $y(0) = 1$.)

- id: de-m1-r2-q12
  lesson: de-separable
  module_quiz: true
  topic: Separable equations
  stem: |-
    Which equations are separable? Select all that apply.
  choices: ["$y' = xy + x$", "$y' = e^{x + y}$", "$y' = x + y$", "$y' = \\sin(xy)$", "$y' = \\dfrac{y^2}{x^2 + 1}$"]
  answer: [0, 1, 4]
  explanation: |-
    $xy + x = x(y + 1)$; $e^{x + y} = e^xe^y$; $\dfrac{y^2}{x^2 + 1} = \dfrac{1}{x^2 + 1}\cdot y^2$. Each is a function of $x$ times a function of $y$. A sum $x + y$ cannot be factored that way, and neither can $\sin(xy)$.

- id: de-m1-r2-q13
  lesson: de-separable
  module_quiz: true
  type: text
  topic: Separable equations
  stem: 'The solution of $\dfrac{dy}{dx} = y^2$, $y(0) = \tfrac12$, blows up at $x =$ ___ (the first positive value). Give only the number.'
  accept: ['2']
  explanation: |-
    Separate: $y^{-2}\,dy = dx$, so $-\dfrac1y = x + C$. At $x = 0$: $-2 = C$. Then $-\dfrac1y = x - 2$, giving $y = \dfrac{1}{2 - x}$, which blows up at $x = 2$.

- id: de-m1-r2-q14
  lesson: de-separable
  type: match
  topic: Separable equations
  stem: 'Match each equation to its general solution.'
  pairs:
    - ["$y' = 3y$", 'y = A e^(3x)']
    - ["$y' = xy$", 'y = A e^(x²/2)']
    - ["$y' = \\dfrac{x}{y}$", 'y² − x² = C']
    - ["$y' = y^2$", 'y = −1/(x + C)']
  distractors: ['y = 3x + C']
  explanation: |-
    $\dfrac{dy}{y} = 3\,dx$ gives $y = Ae^{3x}$; $\dfrac{dy}{y} = x\,dx$ gives $y = Ae^{x^2/2}$; $y\,dy = x\,dx$ gives $\dfrac{y^2}{2} = \dfrac{x^2}{2} + c$, that is $y^2 - x^2 = C$; $y^{-2}\,dy = dx$ gives $-\dfrac1y = x + C$. The distractor $y = 3x + C$ treats $y' = 3y$ as if it were $y' = 3$.

- id: de-m1-r2-q15
  lesson: de-separable
  topic: Separable equations
  stem: 'A student solves $\dfrac{dy}{dx} = (y - 4)\cos x$ by dividing by $y - 4$. Which solution can that step lose?'
  choices: ['$y = 0$', '$y = -4$', '$y = \sin x$', '$y = 4$']
  answer: 3
  explanation: |-
    Dividing by $y - 4$ assumes $y \ne 4$. The constant $y = 4$ makes the right side $0 \cdot \cos x = 0 = y'$, so it is an equilibrium solution that must be checked separately. (With $y = Ae^{\sin x} + 4$ it comes back as $A = 0$.) The other choices don't solve the equation.

# ---------- Lesson 4: Exponential and logistic growth ----------
- id: de-m1-r2-q16
  lesson: de-growth-logistic
  type: label
  topic: Logistic growth
  stem: 'The picture shows the solution of $\dfrac{dP}{dt} = 0.6P\left(1 - \dfrac{P}{1000}\right)$ with $P(0) = 100$. Name the numbered parts.'
  image: {src: images/de-m1-logistic-blank.svg, alt: 'A logistic curve rising toward a dashed horizontal line, with five numbered markers'}
  labels:
    - {x: 14.3, y: 14.5, text: Carrying capacity}
    - {x: 27.5, y: 51.3, text: Inflection point}
    - {x: 18.3, y: 70.0, text: Concave-up stretch}
    - {x: 41.5, y: 25.8, text: Concave-down stretch}
    - {x: 9.4, y: 80.7, text: Initial value}
  distractors: [Doubling time, Half-life]
  explanation: |-
    1 is the dashed line $P = K = 1000$, the carrying capacity. 2 is the inflection point at $P = K/2 = 500$, where growth is fastest. 3 is below $K/2$, where the curve is concave up (growth speeding up), and 4 is above it, concave down (growth slowing). 5 is the starting value $P(0) = 100$. Doubling time and half-life are times, not points on this graph.

- id: de-m1-r2-q17
  lesson: de-growth-logistic
  module_quiz: true
  type: text
  topic: Logistic growth
  stem: 'Write $\dfrac{dP}{dt} = 0.004P(250 - P)$ in the form $kP\left(1 - \dfrac{P}{K}\right)$. Then $K =$ ___ and $k =$ ___.'
  accept:
    - ['250']
    - ['1']
  explanation: |-
    Factor out 250: $0.004P(250 - P) = 0.004 \cdot 250\,P\left(1 - \dfrac{P}{250}\right) = 1\cdot P\left(1 - \dfrac{P}{250}\right)$. So $K = 250$ and $k = 0.004 \times 250 = 1$ (not 0.004).

- id: de-m1-r2-q18
  lesson: de-growth-logistic
  type: match
  topic: Exponential growth
  stem: 'Match each description to the model that fits it.'
  pairs:
    - ['Multiplies by the same factor in equal time spans, with no sign of slowing', 'Exponential growth']
    - ['Rises in an S-shape and levels off at a ceiling', 'Logistic growth']
    - ['Halves every 30 years', 'Exponential decay']
    - ['Starts above the ceiling and falls back toward it', 'Logistic growth']
  distractors: ['Linear growth']
  explanation: |-
    Constant-factor growth is exponential; a constant halving time is exponential decay. Leveling off at a ceiling, from below (S-shape) or from above (falling back), is logistic behaviour. Linear growth adds the same amount, not the same factor, in equal times, and none of the descriptions says that.

- id: de-m1-r2-q19
  lesson: de-growth-logistic
  topic: Logistic growth
  stem: |-
    For $\dfrac{dP}{dt} = 0.5P\left(1 - \dfrac{P}{800}\right)$, which statements are true? Select all that apply.
  choices:
    - 'The carrying capacity is 800'
    - 'Growth is fastest when $P = 400$'
    - 'The largest possible growth rate is 100 per unit time'
    - 'A solution with $P(0) = 1000$ increases'
    - '$P = 400$ is an equilibrium solution'
  answer: [0, 1, 2]
  explanation: |-
    $K = 800$. The rate is fastest at $K/2 = 400$, where it equals $kK/4 = 0.5 \cdot 800/4 = 100$. For $P = 1000 > K$ the factor $1 - P/K$ is negative, so the solution decreases toward 800. The equilibria are only $P = 0$ and $P = 800$; at $P = 400$ the rate is 100, not 0.

- id: de-m1-r2-q20
  lesson: de-growth-logistic
  module_quiz: true
  topic: Exponential growth
  stem: 'An investment grows by $\dfrac{dA}{dt} = 0.05A$ ($t$ in years). What is its doubling time?'
  choices: ['About 20 years', 'About 13.9 years', 'About 0.035 years', 'About 1.39 years']
  answer: 1
  explanation: |-
    $T_d = \dfrac{\ln 2}{k} = \dfrac{0.6931}{0.05} \approx 13.86$ years. 20 years is $1/k$ (forgetting $\ln 2$); 0.035 is $k\ln 2$; 1.39 comes from a decimal slip (dividing by 0.5).

# ---------- Lesson 5: Euler's method ----------
- id: de-m1-r2-q21
  lesson: de-euler
  type: label
  topic: Euler's method
  stem: 'The picture shows one step of Euler''s method from $(x_0, y_0)$ to $(x_1, y_1)$. Name the numbered parts.'
  image: {src: images/de-m1-euler-step-blank.svg, alt: 'One Euler step on a concave-up curve with a tangent line, a horizontal run, a vertical rise and a vertical gap, marked 1 to 5'}
  labels:
    - {x: 34.0, y: 74.3, text: Step size h}
    - {x: 46.9, y: 59.0, text: 'Rise h·f(x₀, y₀)'}
    - {x: 52.1, y: 37.4, text: Tangent line}
    - {x: 37.5, y: 44.3, text: True solution curve}
    - {x: 46.9, y: 30.7, text: Error of the step}
  distractors: [Isocline]
  explanation: |-
    1 is the horizontal run $h$ from $x_0$ to $x_1$. 2 is the rise along the tangent, $h$ times the slope $f(x_0, y_0)$, which lands at $(x_1, y_1)$. 3 is the tangent line at $(x_0, y_0)$, and 4 is the true solution, which curves away above it. 5 is the gap between $y_1$ and the true value $y(x_1)$: the error of this step. The curve is concave up, so the estimate is too low.

- id: de-m1-r2-q22
  lesson: de-euler
  type: order
  topic: Euler's method
  stem: 'Put the stages of Euler''s method in order.'
  items:
    - 'Start at the known point $(x_0, y_0)$'
    - 'Compute the slope $f(x_n, y_n)$ at the current point'
    - 'Move along that slope for a step $h$ to the new point $(x_{n+1}, y_{n+1})$'
    - 'Repeat from the new point until you reach the target $x$'
  explanation: |-
    The method starts at the initial condition, uses the slope at the start of each step, moves a distance $h$ along it, and then repeats from the point it has reached.

- id: de-m1-r2-q23
  lesson: de-euler
  module_quiz: true
  type: text
  topic: Euler's method
  stem: 'Use Euler''s method with $h = 0.1$ on $y'' = x + 2y$, $y(0) = 1$. After two steps, $y(0.2) \approx$ ___.'
  accept: ['1.45']
  explanation: |-
    Step 1: slope at $(0, 1)$ is $0 + 2 = 2$, so $y_1 = 1 + 0.1(2) = 1.2$ at $x = 0.1$. Step 2: slope at $(0.1, 1.2)$ is $0.1 + 2.4 = 2.5$, so $y_2 = 1.2 + 0.1(2.5) = 1.45$.

- id: de-m1-r2-q24
  lesson: de-euler
  topic: Euler's method
  stem: |-
    In which situations does Euler's method (stepping to the right) give an underestimate? Select all that apply.
  choices:
    - 'The solutions are concave up on the interval'
    - "$y'' > 0$ along the solution"
    - 'The solutions are concave down on the interval'
    - 'The solution is a straight line'
    - "$y' = y$ with $y(0) = 1$"
  answer: [0, 1, 4]
  explanation: |-
    Tangent lines lie below a concave-up curve ($y'' > 0$), so Euler's estimates are too low. For $y' = y$ with $y(0) = 1$, $y'' = y' = y > 0$, so that case is concave up too. Concave down gives overestimates, and for a straight line the method is exact.

- id: de-m1-r2-q25
  lesson: de-euler
  module_quiz: true
  topic: Euler's method
  stem: 'Euler''s method with $h = 0.2$ is used on $\dfrac{dy}{dx} = 0.5y$, $y(0) = 2$, to estimate $y(1)$. What estimate does it give?'
  choices: ['$3.000$', '$4.977$', '$3.221$', '$3.297$']
  answer: 2
  explanation: |-
    For $y' = ky$ each step multiplies by $1 + kh = 1 + 0.5(0.2) = 1.1$. Five steps: $2(1.1)^5 \approx 3.221$. The exact value is $2e^{0.5} \approx 3.297$ (Euler underestimates, since solutions are concave up). $3.000$ is a single step of size 1, and $4.977$ comes from multiplying by $1 + h = 1.2$.

# ---------- Honors: Families of curves and orthogonal trajectories ----------
- id: de-m1-r2-h01
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: 'Which differential equation does every curve of the family $y = Cx^3$ satisfy (for $x \ne 0$)?'
  choices: ["$y' = 3Cx^2$", "$y' = \\dfrac{3y}{x}$", "$y' = -\\dfrac{x}{3y}$", "$y' = 3x^2$"]
  answer: 1
  explanation: |-
    Differentiate: $y' = 3Cx^2$. From the family, $C = y/x^3$, so $y' = 3\cdot\dfrac{y}{x^3}\cdot x^2 = \dfrac{3y}{x}$. $y' = 3Cx^2$ still contains $C$, so it is not a single equation for the whole family; $-\dfrac{x}{3y}$ is the slope of the orthogonal trajectories; $3x^2$ is the slope of the one member with $C = 1$.

- id: de-m1-r2-h02
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: 'What are the orthogonal trajectories of the family $y = Cx^3$?'
  choices: ['$3x^2 + y^2 = K$', '$x^2 - 3y^2 = K$', '$y^3 = Kx$', '$x^2 + 3y^2 = K$']
  answer: 3
  explanation: |-
    The family satisfies $y' = 3y/x$, so the trajectories satisfy $y' = -\dfrac{x}{3y}$. Separate: $3y\,dy = -x\,dx$, so $\dfrac{3y^2}{2} = -\dfrac{x^2}{2} + c$, that is $x^2 + 3y^2 = K$. Putting the 3 on $x^2$ is the usual slip; $x^2 - 3y^2 = K$ comes from dropping the minus sign.

- id: de-m1-r2-h03
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: |-
    A family of curves satisfies $y' = x^2y$. Which equation do its orthogonal trajectories satisfy?
  choices: ["$y' = -\\dfrac{1}{x^2y}$", "$y' = -x^2y$", "$y' = \\dfrac{1}{x^2y}$", "$y' = -\\dfrac{x^2}{y}$"]
  answer: 0
  explanation: |-
    Perpendicular slopes multiply to $-1$, so the trajectory slope at $(x, y)$ is $-1/f(x, y) = -\dfrac{1}{x^2y}$. Changing only the sign ($-x^2y$) or only taking the reciprocal ($\dfrac{1}{x^2y}$) does not give a perpendicular direction.

- id: de-m1-r2-h04
  lesson: de-m1-h-orthogonal
  type: text
  topic: Orthogonal trajectories
  stem: 'Consider the family $y = Ce^{2x}$. The orthogonal trajectory through the point $(0, 3)$ has slope ___ at that point. Give the exact value.'
  accept: ['-1/6', '-0.1667', '-0.167']
  explanation: |-
    The family satisfies $y' = 2Ce^{2x} = 2y$, so its slope at $(0, 3)$ is 6. The trajectory's slope there is $-\dfrac16$.

- id: de-m1-r2-h05
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: |-
    Which pairs of families are orthogonal (every curve of one crosses every curve of the other at a right angle)? Select all that apply.
  choices:
    - 'Circles $x^2 + y^2 = C$ and lines $y = Kx$'
    - 'Parabolas $y = Cx^2$ and circles $x^2 + y^2 = K$'
    - 'Hyperbolas $xy = C$ and hyperbolas $y^2 - x^2 = K$'
    - 'Curves $y = Ce^x$ and curves $y = Ke^{-x}$'
    - 'Lines $y = x + C$ and lines $y = -x + K$'
  answer: [0, 2, 4]
  explanation: |-
    Circles have slope $-x/y$, lines through the origin $y/x$: product $-1$. For $xy = C$ the slope is $-y/x$ and for $y^2 - x^2 = K$ it is $x/y$: product $-1$. Lines of slope 1 and $-1$ are perpendicular. But $y = Cx^2$ has slope $2y/x$ and the circles $-x/y$, product $-2$; and $y = Ce^x$, $y = Ke^{-x}$ have slopes $y$ and $-y$, product $-y^2$, which is $-1$ only on the lines $y = \pm 1$.

- id: de-m1-r2-h06
  lesson: de-m1-h-orthogonal
  type: order
  topic: Orthogonal trajectories
  stem: 'Put the steps for finding the orthogonal trajectory of $y = Cx^2$ through $(2, 1)$ in order.'
  items:
    - "Differentiate: $y' = 2Cx$"
    - "Eliminate $C$: $y' = \\dfrac{2y}{x}$"
    - "Take the negative reciprocal: $y' = -\\dfrac{x}{2y}$"
    - 'Separate and integrate: $x^2 + 2y^2 = K$'
    - 'Use the point: $K = 4 + 2 = 6$'
  explanation: |-
    The family's slope must be written without $C$ before the negative reciprocal is taken; the new equation is then solved, and the given point picks out one trajectory.

- id: de-m1-r2-h07
  lesson: de-m1-h-orthogonal
  type: match
  topic: Orthogonal trajectories
  stem: 'Match each family to its orthogonal trajectories.'
  pairs:
    - ['$y = Cx$', 'Circles centered at the origin']
    - ['$xy = C$', 'Hyperbolas y² − x² = K']
    - ['$y = Cx^2$', 'Ellipses x² + 2y² = K']
    - ['$y = Ce^{x}$', 'Parabolas y² = K − 2x']
  distractors: ['Ellipses 2x² + y² = K']
  explanation: |-
    $y = Cx$: $y' = y/x$, trajectories $y' = -x/y$, circles. $xy = C$: $y' = -y/x$, trajectories $y' = x/y$, so $y^2 - x^2 = K$. $y = Cx^2$: $y' = 2y/x$, trajectories $2y\,dy = -x\,dx$, so $x^2 + 2y^2 = K$. $y = Ce^x$: $y' = y$, trajectories $y\,dy = -dx$, so $y^2 = K - 2x$.

- id: de-m1-r2-h08
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: 'On a topographic map of a smooth hillside, how does the path of water running straight downhill (the steepest descent) meet the contour lines?'
  choices: ['It runs along the contour lines', 'It crosses them at 45°', 'It crosses them at right angles', 'It heads in a straight line to the lowest point']
  answer: 2
  explanation: |-
    A contour line is a level curve: moving along it, the height doesn't change. The direction of fastest change is perpendicular to the level curve, so steepest-descent paths are orthogonal trajectories of the contour lines. Running along a contour would keep the water at the same height.

- id: de-m1-r2-h09
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: |-
    The parabolas $y^2 = 4C(x + C)$ satisfy $y^2 = 2xyy' + y^2(y')^2$. Replacing $y'$ by $-1/y'$ and clearing fractions gives back this same equation. What does that show?
  choices: ['The orthogonal trajectories belong to the same family: it is self-orthogonal', 'The family has no orthogonal trajectories', 'Each parabola crosses itself at a right angle', 'All the parabolas are the same curve']
  answer: 0
  explanation: |-
    The trajectories satisfy the family's own differential equation, so they are members of the same family: parabolas with $C > 0$ (opening right) cross those with $C < 0$ (opening left) at right angles. A family with this property is called self-orthogonal.

- id: de-m1-r2-h10
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: |-
    A student finds the orthogonal trajectories of the lines $y = Cx$ like this: the family satisfies $y' = y/x$, so the trajectories satisfy $y' = -y/x$, which gives $xy = K$. What is wrong?
  choices: ['Nothing; the hyperbolas $xy = K$ are correct', 'The student forgot to eliminate $C$', 'The student should have used $y'' = x/y$, giving $y = Kx$ again', 'The student changed only the sign; with $y'' = -x/y$ the answer is circles $x^2 + y^2 = K$']
  answer: 3
  explanation: |-
    The perpendicular slope is $-1/f = -\dfrac{x}{y}$, not $-f$. Then $y\,dy = -x\,dx$ and $x^2 + y^2 = K$: circles about the origin. The slopes $y/x$ and $-y/x$ multiply to $-y^2/x^2$, which is $-1$ only on the lines $y = \pm x$, so the hyperbolas are not orthogonal to the lines in general. $C$ was correctly eliminated, and $x/y$ (the reciprocal without the sign) is not perpendicular either.

- id: de-m1-r2-h11
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: 'Which orthogonal trajectory of the parabolas $y = Cx^2$ passes through $(2, 1)$?'
  choices: ['$x^2 + 2y^2 = 9$', '$x^2 + 2y^2 = 6$', '$2x^2 + y^2 = 9$', '$x^2 + 2y^2 = 5$']
  answer: 1
  explanation: |-
    The trajectories are $x^2 + 2y^2 = K$. At $(2, 1)$: $K = 4 + 2(1) = 6$. 9 comes from swapping the coordinates' roles ($2 \cdot 4 + 1$), and 5 from forgetting the 2 on $y^2$.

- id: de-m1-r2-h12
  lesson: de-m1-h-orthogonal
  type: text
  topic: Orthogonal trajectories
  stem: 'The orthogonal trajectories of $y = Cx^5$ are $x^2 + 5y^2 = K$. The one through $(2, 1)$ is $x^2 + 5y^2 = K$ with $K =$ ___.'
  accept: ['9']
  explanation: |-
    Substitute $x = 2$, $y = 1$: $4 + 5 = 9$. (Check of the family: $y' = 5y/x$, trajectories $y' = -\dfrac{x}{5y}$, so $5y\,dy = -x\,dx$ and $x^2 + 5y^2 = K$.)

- id: de-m1-r2-h13
  lesson: de-m1-h-orthogonal
  topic: Orthogonal trajectories
  stem: 'Which curves cross every line through the origin at a constant angle of 45° (oblique trajectories of those lines)?'
  choices: ['Circles centered at the origin', 'Hyperbolas $xy = K$', 'Logarithmic spirals $r = Ae^{\theta}$', 'Parabolas $y = Kx^2$']
  answer: 2
  explanation: |-
    Circles cross the lines through the origin at 90°, not 45°. The curves at a constant 45° are logarithmic spirals, $r = Ae^{\theta}$ (or $r = Ae^{-\theta}$ for the other direction of turning). Parabolas and hyperbolas meet those lines at angles that change from point to point.

# ---------- Honors: Beyond the logistic ----------
- id: de-m1-r2-h14
  lesson: de-m1-h-beyond-logistic
  topic: Logistic growth
  stem: 'In the SI model of an epidemic in a population of $N$, why is the rate of new infections taken proportional to $I(N - I)$?'
  choices: ['Infected people recover at a rate proportional to $N - I$', 'The population grows exponentially at rate $I$', 'Infections are fastest when no one is infected yet', 'Each new infection needs a meeting between an infected and a susceptible person, and there are $I(N - I)$ such pairs']
  answer: 3
  explanation: |-
    In a well-mixed population, the chance of a transmitting contact is proportional to the number of infected–susceptible pairs, $I(N - I)$. The SI model has no recovery, $N$ is fixed, and with $I = 0$ there is no one to spread the disease.

- id: de-m1-r2-h15
  lesson: de-m1-h-beyond-logistic
  topic: Logistic growth
  stem: 'A rumor spreads by the SI model $\dfrac{dI}{dt} = 0.4I\left(1 - \dfrac{I}{2000}\right)$, $t$ in days. What is the fastest rate of spread?'
  choices: ['200 people per day', '800 people per day', '400 people per day', '100 people per day']
  answer: 0
  explanation: |-
    The rate is fastest at $I = N/2 = 1000$: $0.4 \cdot 1000 \cdot \tfrac12 = 200$ per day, which is $\beta N/4$. 800 is $\beta N$, 400 forgets the factor $\tfrac12$, and 100 divides by 8.

- id: de-m1-r2-h16
  lesson: de-m1-h-beyond-logistic
  type: text
  topic: Logistic growth
  stem: 'In the SI model for a closed population of 600 people, the number infected is growing fastest when $I =$ ___.'
  accept: ['300']
  explanation: |-
    The SI model is logistic with $K = N = 600$, and logistic growth is fastest at $K/2 = 300$.

- id: de-m1-r2-h17
  lesson: de-m1-h-beyond-logistic
  topic: Logistic growth
  stem: 'If $P$ solves $P'' = kP(1 - P/K)$, which equation does $u = 1/P$ satisfy?'
  choices: ["$u' = ku(1 - u/K)$", "$u' = -k\\left(u - \\dfrac1K\\right)$", "$u' = -ku^2$", "$u' = k(u - K)$"]
  answer: 1
  explanation: |-
    $u' = -\dfrac{P'}{P^2} = -\dfrac{kP(1 - P/K)}{P^2} = -k\left(\dfrac1P - \dfrac1K\right) = -k\left(u - \dfrac1K\right)$. It is linear, so $u - 1/K$ decays exponentially.

- id: de-m1-r2-h18
  lesson: de-m1-h-beyond-logistic
  topic: Logistic growth
  stem: 'A population is counted three times, equally spaced in time: 300, 450, 600. If it follows a logistic model, what is its carrying capacity?'
  choices: ['750', '1200', '900', '1050']
  answer: 2
  explanation: |-
    With $u_n = 1/P_n$: $c = \dfrac{u_0u_2 - u_1^2}{u_0 + u_2 - 2u_1} = \dfrac{\frac{1}{180000} - \frac{1}{202500}}{\frac{1}{300} + \frac{1}{600} - \frac{2}{450}} = \dfrac{1}{900}$, so $K = 900$. Check: with $A = 2$ and $e^{-kT} = \tfrac12$, $\frac{900}{3} = 300$, $\frac{900}{2} = 450$, $\frac{900}{1.5} = 600$.

- id: de-m1-r2-h19
  lesson: de-m1-h-beyond-logistic
  topic: Gompertz growth
  stem: 'A population follows the Gompertz model $\dfrac{dP}{dt} = kP\ln\dfrac{500}{P}$. At about what population is it growing fastest?'
  choices: ['250', '68', '316', '184']
  answer: 3
  explanation: |-
    The Gompertz rate peaks at $P = K/e = 500/e \approx 184$. 250 is the logistic answer $K/2$; 68 is $K/e^2$; 316 is $K(1 - 1/e)$.

- id: de-m1-r2-h20
  lesson: de-m1-h-beyond-logistic
  topic: Gompertz growth
  stem: 'What is the largest growth rate of $\dfrac{dP}{dt} = 0.2P\ln\dfrac{1000}{P}$?'
  choices: ['About 73.6', 'About 50', 'About 200', 'About 27.1']
  answer: 0
  explanation: |-
    The maximum is at $P = K/e$, where $\ln(K/P) = 1$, so the rate is $kK/e = 200/e \approx 73.6$. 50 is the logistic value $kK/4$, 200 is $kK$, and 27.1 is $kK/e^2$.

- id: de-m1-r2-h21
  lesson: de-m1-h-beyond-logistic
  topic: Gompertz growth
  stem: |-
    Which statements are true of both the logistic model $P' = kP(1 - P/K)$ and the Gompertz model $P' = kP\ln(K/P)$, with $k, K > 0$? Select all that apply.
  choices:
    - 'Solutions starting between 0 and $K$ rise toward $K$'
    - '$P = K$ is an equilibrium'
    - 'Growth is fastest at $P = K/2$'
    - 'The relative growth rate $\frac{1}{P}\frac{dP}{dt}$ is a linear function of $P$'
    - 'Solutions starting above $K$ fall toward $K$'
  answer: [0, 1, 4]
  explanation: |-
    In both models the rate is positive for $0 < P < K$, zero at $K$ and negative above $K$, so solutions approach $K$ from either side. Only the logistic has its fastest growth at $K/2$ (the Gompertz curve's is at $K/e$) and a relative growth rate linear in $P$ (the Gompertz relative rate is $k\ln(K/P)$).

- id: de-m1-r2-h22
  lesson: de-m1-h-beyond-logistic
  type: match
  topic: Gompertz growth
  stem: 'Match each model to how its relative growth rate $\frac1P\frac{dP}{dt}$ depends on $P$.'
  pairs:
    - ["Exponential, $P' = kP$", 'Constant']
    - ["Logistic, $P' = kP(1 - P/K)$", 'Falls linearly as P grows']
    - ["Gompertz, $P' = kP\\ln(K/P)$", 'Falls like ln(K/P) as P grows']
  distractors: ['Rises as P grows']
  explanation: |-
    Divide each right side by $P$: $k$ (constant), $k(1 - P/K)$ (a line with negative slope), and $k\ln(K/P)$ (a decreasing logarithm). None of the three rises with $P$.

- id: de-m1-r2-h23
  lesson: de-m1-h-beyond-logistic
  type: order
  topic: Gompertz growth
  stem: 'Put the steps for solving the Gompertz equation $\dfrac{dP}{dt} = kP\ln\dfrac{K}{P}$, $P(0) = P_0$, in order.'
  items:
    - 'Substitute $w = \ln\dfrac{K}{P}$, so $\dfrac{dw}{dt} = -\dfrac1P\dfrac{dP}{dt}$'
    - 'Rewrite the equation as $\dfrac{dw}{dt} = -kw$'
    - 'Solve: $w = w_0e^{-kt}$ with $w_0 = \ln\dfrac{K}{P_0}$'
    - 'Undo the substitution: $P = K\exp\left(-w_0e^{-kt}\right)$'
  explanation: |-
    The substitution comes first; it turns the equation into exponential decay for $w$, which is solved, and then $P = Ke^{-w}$ recovers the population.

- id: de-m1-r2-h24
  lesson: de-m1-h-beyond-logistic
  topic: Logistic growth
  stem: 'The SI model predicts that eventually every member of the population is infected. What simplifying assumption causes that?'
  choices: ['The population is well mixed', 'No one recovers or leaves the infected group', 'The transmission rate is constant', 'The population starts with at least one infected person']
  answer: 1
  explanation: |-
    With no way out of the infected group, $I$ can only increase, and the only stable equilibrium is $I = N$. Adding recovery (the SIR model) lets an epidemic end with some people never infected. The other assumptions affect the shape and speed of the curve, not its end point.

- id: de-m1-r2-h25
  lesson: de-m1-h-beyond-logistic
  type: text
  topic: Gompertz growth
  stem: 'The Gompertz curve has its inflection point at $P = K/$___.'
  accept: [e, '2.718', '2.72', '2.7183']
  explanation: |-
    The rate $kP\ln(K/P)$ is largest where its derivative $k(\ln(K/P) - 1)$ is zero, that is $\ln(K/P) = 1$, so $P = K/e \approx 0.368K$.

- id: de-m1-r2-h26
  lesson: de-m1-h-beyond-logistic
  topic: Gompertz growth
  stem: 'A Gompertz model has $K = 800$, $k = 0.5$ and $P(0) = 200$. What is $P(2)$, to the nearest whole number?'
  choices: ['380', '544', '480', '640']
  answer: 2
  explanation: |-
    $P(t) = 800\exp\left(-\ln 4\cdot e^{-0.5t}\right)$. At $t = 2$: $\ln 4 \cdot e^{-1} \approx 1.3863 \times 0.3679 \approx 0.5100$, so $P(2) \approx 800e^{-0.5100} \approx 480$. A logistic model with the same numbers gives 380, and pure exponential growth $200e^{1}$ gives 544.
