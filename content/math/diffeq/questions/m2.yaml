    When $n > 0$, $y = 0$ solves the original equation ($0 + 0 = 0$) but division by $y^n$ assumed $y \ne 0$.
- id: de-q-1010
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Solving $y'' = \dfrac{x^2 + y^2}{xy}$ by $y = vx$ leads to which separable equation?'
  choices: ['$\dfrac{dv}{v} = \dfrac{dx}{x}$', '$dv = v\,dx$', '$(1 + v^2)\,dv = x\,dx$', '$v\,dv = \dfrac{dx}{x}$']
  answer: 3
  explanation: |-
    $F(v) = \dfrac{1 + v^2}{v} = \dfrac1v + v$, so $v + xv' = \dfrac1v + v$, giving $xv' = \dfrac1v$, that is $v\,dv = dx/x$.
- id: de-q-1011
  lesson: de-substitutions
  topic: Substitutions
  stem: 'The logistic equation $P'' = kP - \dfrac{k}{K}P^2$ is a Bernoulli equation with'
  choices: ['$n = 1$, so it is already linear', '$n = 2$, so $v = 1/P$ makes it linear', '$n = -1$, so $v = P^2$', '$n = 2$, so $v = P^2$']
  answer: 1
  explanation: |-
    Rewrite as $P' - kP = -\frac{k}{K}P^2$: Bernoulli with $n = 2$ and $v = P^{1-2} = 1/P$.
