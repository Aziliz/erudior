    $v = 1/y$, so $v(0) = 1/(1/4) = 4$. Forgetting to convert the condition is a common slip.
- id: de-q-1009
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Dividing a Bernoulli equation $y'' + py = qy^n$ (with $n > 0$) by $y^n$ can lose which solution?'
  choices: ['$y = 1$', '$y = q/p$', '$y = 0$', 'none; no solutions are lost']
  answer: 2
