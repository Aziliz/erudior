# Module 2: classification and first-order methods
- id: de-q-0601
  lesson: de-classification
  module_quiz: true
  topic: Classification
  stem: 'Which equation is linear?'
  choices: ['$y'''' + y^2 = 0$', '$t^3y'''' + e^t y'' - (\ln t)y = \sin t$', '$yy'' = t$', '$y'' = \cos y$']
  answer: 1
  explanation: |-
    Linearity is about the unknown $y$: it and its derivatives must appear to the first power, unmultiplied, and not inside other functions. The coefficients $t^3$, $e^t$, $\ln t$ can be anything in $t$. The others contain $y^2$, $yy'$ and $\cos y$.
- id: de-q-0602
  lesson: de-classification
  topic: Classification
  stem: 'Classify $(y'''')^3 + 4y'' = t$.'
  choices: ['Third order, nonlinear', 'Second order, linear', 'Third order, linear', 'Second order, nonlinear']
  answer: 3
  explanation: |-
    The highest derivative is $y''$, so it is second order; the cube on $y''$ is a power, which makes the equation nonlinear.
- id: de-q-0603
  lesson: de-classification
  module_quiz: true
  topic: Classification
  stem: 'Which equation is a partial differential equation?'
  choices: ['$u_t = 4u_{xx}$', '$y'''' + ty'' = 0$', '$\dfrac{dx}{dt} = x - xy$', '$y^{(4)} = y$']
  answer: 0
  explanation: |-
    $u(x, t)$ depends on two variables and the equation involves partial derivatives. The predator–prey style equation $dx/dt = x - xy$ is an ODE: $x$ and $y$ are both functions of $t$ alone.
- id: de-q-0604
  lesson: de-classification
  topic: Classification
  stem: 'Which equation is autonomous?'
  choices: ['$y'' = t - y$', '$y'' = ty$', '$y'' = y^3 - 2y$', '$y'' = \sin t$']
  answer: 2
  explanation: |-
    Autonomous means the independent variable does not appear explicitly on the right side. Only $y^3 - 2y$ depends on $y$ alone.
- id: de-q-0605
  lesson: de-classification
  topic: Classification
  stem: 'The linear equation $y'''' + 3y'' - 2y = e^{-t}$ is'
  choices: ['homogeneous, because every coefficient is constant', 'nonlinear, because of $e^{-t}$', 'homogeneous, because $e^{-t}$ involves no $y$', 'nonhomogeneous, because of the term $e^{-t}$']
  answer: 3
  explanation: |-
    For linear equations, homogeneous means the forcing term $g(t)$ is zero. Here $g(t) = e^{-t} \ne 0$. A function of $t$ alone doesn't affect linearity.
- id: de-q-0606
  lesson: de-classification
  module_quiz: true
  topic: Classification
  stem: 'For $y'''' + y = 0$ (general solution $c_1\cos t + c_2\sin t$), how many solutions satisfy $y(0) = 0$, $y(\pi) = 0$?'
  choices: ['Exactly one', 'Infinitely many', 'None', 'Exactly two']
  answer: 1
  explanation: |-
    $y(0) = 0$ forces $c_1 = 0$, and then $y(\pi) = c_2\sin\pi = 0$ for every $c_2$. Boundary value problems, unlike IVPs, can have infinitely many solutions (or none).
- id: de-q-0607
  lesson: de-classification
  topic: Classification
  stem: 'How many initial conditions does an IVP for a fourth-order ODE need to have a unique solution?'
  choices: ['1: $y(t_0)$', '2: $y(t_0)$ and $y''(t_0)$', '4: $y$, $y''$, $y''''$ and $y''''''$ at $t_0$', '5: $y$ through $y^{(4)}$ at $t_0$']
  answer: 2
  explanation: |-
    An $n$th-order equation needs $n$ conditions, the values of $y$ through $y^{(n-1)}$ at $t_0$. The equation itself then determines $y^{(n)}$.
- id: de-q-0608
  lesson: de-classification
  topic: Classification
  stem: 'The pendulum equation $\theta'''' + \tfrac{g}{L}\sin\theta = 0$ is replaced by $\theta'''' + \tfrac{g}{L}\theta = 0$ for small swings. What does that change?'
  choices: ['It turns a nonlinear equation into a linear one', 'It lowers the order from 2 to 1', 'It makes the equation nonhomogeneous', 'It turns an ODE into a PDE']
  answer: 0
  explanation: |-
    $\sin\theta$ is a nonlinear function of the unknown; replacing it by $\theta$ (valid for small $\theta$) gives a linear equation of the same order.
- id: de-q-0609
  lesson: de-classification
  topic: Classification
  stem: 'Which property lets you add two solutions of $y'''' + p(t)y'' + q(t)y = 0$ to get another solution?'
  choices: ['Linearity and homogeneity (the superposition principle)', 'Being autonomous', 'Having constant coefficients', 'Being second order']
  answer: 0
  explanation: |-
    Superposition works for any linear homogeneous equation, even with variable coefficients. It fails for nonlinear equations and for nonhomogeneous ones (the sum of two solutions of $L[y] = g$ solves $L[y] = 2g$).
- id: de-q-0610
  lesson: de-classification
  topic: Classification
  stem: 'Write $t y'' - 2y = t^3$ in normal form.'
  choices: ['$y'' = 2y + t^3$', '$y'' = \dfrac{t^3 - 2y}{t}$', '$y'' = \dfrac{2y + t^3}{t}$', '$y'' = t^2 - 2y$']
  answer: 2
  explanation: |-
    Solve for the top derivative: $ty' = 2y + t^3$, so $y' = (2y + t^3)/t$ (for $t \ne 0$).
- id: de-q-0611
  lesson: de-classification
  topic: Classification
  stem: 'Classify $y'''' + 2y'' + 5y = 0$, $y(0) = 1$, $y''(0) = 0$.'
  choices: ['Second-order nonlinear IVP', 'Second-order linear homogeneous IVP', 'First-order linear BVP', 'Second-order linear homogeneous BVP']
  answer: 1
  explanation: |-
    Highest derivative $y''$; all terms linear in $y$ with $g = 0$; both conditions at the single point $t = 0$, so it's an initial value problem.
# Lesson 7
- id: de-q-0701
  lesson: de-existence
  module_quiz: true
  topic: Existence and uniqueness
  stem: 'On what largest interval is the solution of $(t - 4)y'' + \dfrac{y}{t + 2} = \sqrt{t}$, $y(1) = 0$ guaranteed to exist?'
  choices: ['$-2 < t < 4$', '$t > 0$', '$1 < t < 4$', '$0 < t < 4$']
  answer: 3
  explanation: |-
    In standard form, $p(t) = \dfrac{1}{(t + 2)(t - 4)}$ and $g(t) = \dfrac{\sqrt t}{t - 4}$. Trouble points: $t = -2$, $t = 4$, and $t < 0$ (for $\sqrt t$). The piece containing $t_0 = 1$ is $(0, 4)$.
- id: de-q-0702
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'For $y'' + \dfrac{1}{t - 2}y = \tan t$, $y(3) = 1$, what interval does the linear theorem give?'
  choices: ['$\tfrac{\pi}{2} < t < \tfrac{3\pi}{2}$', '$2 < t < \tfrac{3\pi}{2}$', '$2 < t < \infty$', '$\tfrac{\pi}{2} < t < 2$']
  answer: 1
  explanation: |-
    $p$ fails at $t = 2$; $\tan t$ fails at $\pi/2 \approx 1.57$ and $3\pi/2 \approx 4.71$. Around $t_0 = 3$ the nearest trouble points are $2$ on the left and $3\pi/2$ on the right.
- id: de-q-0703
  lesson: de-existence
  module_quiz: true
  topic: Existence and uniqueness
  stem: 'For $y'' = y^{1/3}$, at which initial point does the existence and uniqueness theorem fail to guarantee uniqueness?'
  choices: ['$(0, 1)$', '$(1, -8)$', '$(2, 27)$', '$(0, 0)$']
  answer: 3
  explanation: |-
    $f = y^{1/3}$ is continuous everywhere, but $f_y = \tfrac13 y^{-2/3}$ is undefined at $y = 0$. At points with $y \ne 0$ both are continuous.
- id: de-q-0704
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'Which pair are both solutions of $y'' = 2\sqrt{y}$, $y(0) = 0$ for $t \ge 0$?'
  choices: ['$y = 0$ and $y = t^2$', '$y = 0$ and $y = 2t$', '$y = t^2$ and $y = 4t^2$', '$y = t$ and $y = t^2$']
  answer: 0
  explanation: |-
    $y = 0$ works trivially. For $y = t^2$: $y' = 2t$ and $2\sqrt{t^2} = 2t$ for $t \ge 0$. So uniqueness fails, consistent with $f_y = 1/\sqrt y$ being discontinuous at $y = 0$.
- id: de-q-0705
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'A solution of $y'' = y(3 - y)\cos t$ has $y(0) = 1$. Without solving, which statement must be true?'
  choices: ['$y(t) \to 3$ as $t \to \infty$', '$y(t)$ eventually exceeds 3', '$0 < y(t) < 3$ for all $t$ where it exists', '$y(t) < 1$ for $t > 0$']
  answer: 2
  explanation: |-
    $y = 0$ and $y = 3$ are equilibrium solutions, and $f$, $f_y$ are continuous everywhere, so curves can't cross. The solution is trapped between 0 and 3. Because $\cos t$ changes sign, it oscillates rather than settling at 3.
- id: de-q-0706
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'The general (nonlinear) existence and uniqueness theorem guarantees a solution'
  choices: ['on every interval where $f$ is continuous', 'for all $t$', 'only for $t > t_0$', 'on some interval around $t_0$, possibly short']
  answer: 3
  explanation: |-
    The nonlinear theorem is local. Example: $y' = y^2$, $y(0) = 1$ has $f$ continuous everywhere, but the solution $1/(1 - t)$ only exists for $t < 1$.
- id: de-q-0707
  lesson: de-existence
  module_quiz: true
  topic: Existence and uniqueness
  stem: 'For $y'' = \dfrac{t + y}{t - y}$, the theorem guarantees a unique solution through every point except'
  choices: ['points on the line $y = -t$', 'points on the line $y = t$', 'the origin only', 'points with $t = 0$']
  answer: 1
  explanation: |-
    $f$ and $f_y = \dfrac{2t}{(t - y)^2}$ are both continuous wherever $t \ne y$. On $y = t$ the denominator is zero.
- id: de-q-0708
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'Why can two different solutions of $y'' = \sin(ty)$ never cross?'
  choices: ['The equation is linear', 'Solutions of every ODE are unique', '$f$ and $\partial f/\partial y$ are continuous everywhere, so each point has only one solution through it', 'The equation is autonomous']
  answer: 2
  explanation: |-
    $f = \sin(ty)$ and $f_y = t\cos(ty)$ are continuous everywhere, so uniqueness holds at every point, and a crossing point would have two solutions. The equation is neither linear nor autonomous.
- id: de-q-0709
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'If the hypotheses of the uniqueness theorem fail at a point, then'
  choices: ['uniqueness may or may not hold there', 'there is no solution through that point', 'there are infinitely many solutions through that point', 'there are exactly two solutions through that point']
  answer: 0
  explanation: |-
    The theorem gives sufficient conditions, not necessary ones. For $y' = 3y^{2/3}$, uniqueness really fails at $y = 0$ ($y = 0$ and $y = t^3$ both start there). But $y' = 1 + y^{2/3}$ also has $f_y$ undefined at $y = 0$, and its solutions through $y = 0$ are still unique, because they cross that line with slope 1 instead of lingering on it.
- id: de-q-0710
  lesson: de-existence
  topic: Existence and uniqueness
  stem: 'For $t^2y'' + \dfrac{y}{t - 5} = 0$, $y(-1) = 2$, the guaranteed interval is'
  choices: ['$t < 0$', '$0 < t < 5$', '$t < 5$', 'all real $t$']
  answer: 0
  explanation: |-
    Standard form: $p(t) = \dfrac{1}{t^2(t - 5)}$, discontinuous at $t = 0$ and $t = 5$. The piece containing $-1$ is $(-\infty, 0)$.
# Lesson 8
- id: de-q-0801
  lesson: de-linear-first
  module_quiz: true
  topic: Linear first-order
  stem: 'What is the integrating factor for $y'' - 4y = t$?'
  choices: ['$e^{4t}$', '$e^{-2t^2}$', '$e^{-4t}$', '$e^{t^2/2}$']
  answer: 2
  explanation: |-
    $p(t) = -4$, so $\mu = e^{\int -4\,dt} = e^{-4t}$. Missing the sign gives $e^{4t}$.
- id: de-q-0802
  lesson: de-linear-first
  module_quiz: true
  topic: Linear first-order
  stem: 'Solve $y'' + 3y = 6$, $y(0) = 5$.'
  choices: ['$y = 2 + 5e^{-3t}$', '$y = 2 + 3e^{-3t}$', '$y = 6 - e^{-3t}$', '$y = 2 + 3e^{3t}$']
  answer: 1
  explanation: |-
    $(e^{3t}y)' = 6e^{3t}$, so $y = 2 + Ce^{-3t}$. At $t = 0$: $5 = 2 + C$, $C = 3$. Using $C = y_0$ directly gives $2 + 5e^{-3t}$, which starts at 7.
- id: de-q-0803
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'For $ty'' + 3y = t^2$ ($t > 0$), what is the integrating factor?'
  choices: ['$e^{3t}$', '$3t$', '$t^{-3}$', '$t^3$']
  answer: 3
  explanation: |-
    Standard form $y' + \dfrac3t y = t$ gives $p = 3/t$ and $\mu = e^{3\ln t} = t^3$. Using $p = 3$ without dividing by $t$ gives $e^{3t}$.
- id: de-q-0804
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'Solve $ty'' + y = 3t^2$ with $y(1) = 4$ ($t > 0$).'
  choices: ['$y = t^2 + 3$', '$y = t^2 + \dfrac{3}{t}$', '$y = 3t^2 + \dfrac{1}{t}$', '$y = t^2 + \dfrac{4}{t}$']
  answer: 1
  explanation: |-
    $(ty)' = 3t^2$, so $ty = t^3 + C$ and $y = t^2 + C/t$. $y(1) = 1 + C = 4$ gives $C = 3$.
- id: de-q-0805
  lesson: de-linear-first
  module_quiz: true
  topic: Linear first-order
  stem: 'Solve $y'' - 2y = e^{3t}$, $y(0) = 0$.'
  choices: ['$y = e^{3t} + e^{2t}$', '$y = \tfrac15(e^{3t} - e^{-2t})$', '$y = te^{2t}$', '$y = e^{3t} - e^{2t}$']
  answer: 3
  explanation: |-
    $\mu = e^{-2t}$: $(e^{-2t}y)' = e^t$, so $e^{-2t}y = e^t + C$ and $y = e^{3t} + Ce^{2t}$. $y(0) = 0$ gives $C = -1$.
- id: de-q-0806
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'Find the step where this goes wrong. $y'' + 2y = 4$: (1) $\mu = e^{2t}$; (2) $(e^{2t}y)'' = 4e^{2t}$; (3) $e^{2t}y = 2e^{2t}$; (4) $y = 2$.'
  choices: ['Step 3: the constant $C$ is missing', 'Step 1: $\mu$ should be $e^{-2t}$', 'Step 2: the right side should be 4', 'Step 4: dividing is wrong']
  answer: 0
  explanation: |-
    Integrating gives $e^{2t}y = 2e^{2t} + C$, so $y = 2 + Ce^{-2t}$. Without $C$ you only get the single equilibrium solution and can't satisfy most initial conditions.
- id: de-q-0807
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'Every solution of $y'' + y = t$ approaches which function as $t \to \infty$?'
  choices: ['$t$', '$0$', '$t - 1$', '$t + 1$']
  answer: 2
  explanation: |-
    The general solution is $y = t - 1 + Ce^{-t}$, and the transient $Ce^{-t}$ dies out.
- id: de-q-0808
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'Solve $y'' + 2ty = 2t$, $y(0) = 3$.'
  choices: ['$y = 1 + 3e^{-t^2}$', '$y = 3e^{-t^2}$', '$y = 1 + 2e^{t^2}$', '$y = 1 + 2e^{-t^2}$']
  answer: 3
  explanation: |-
    $\mu = e^{t^2}$: $(e^{t^2}y)' = 2te^{t^2}$, so $e^{t^2}y = e^{t^2} + C$ and $y = 1 + Ce^{-t^2}$. $y(0) = 1 + C = 3$ gives $C = 2$.
- id: de-q-0809
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'The general solution of $ty'' + y = \cos t$ ($t > 0$) is'
  choices: ['$y = \dfrac{\sin t}{t} + C$', '$y = \dfrac{\sin t + C}{t}$', '$y = t\sin t + C$', '$y = \dfrac{\cos t + C}{t}$']
  answer: 1
  explanation: |-
    The left side is already $(ty)'$, so $ty = \sin t + C$. Dividing only $\sin t$ by $t$ and not $C$ is a classic slip.
- id: de-q-0810
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'The integrating factor $\mu$ for $y'' + p(t)y = g(t)$ is chosen so that'
  choices: ['$\mu g$ is constant', '$\mu p = 1$', '$\mu y'' + \mu p y$ equals $(\mu y)''$', 'the equation becomes separable in $t$']
  answer: 2
  explanation: |-
    The product rule gives $(\mu y)' = \mu y' + \mu' y$, which matches $\mu y' + \mu p y$ when $\mu' = p\mu$, so $\mu = e^{\int p\,dt}$.
- id: de-q-0811
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'For $y'' + \dfrac{2}{t}y = 0$ with $t > 0$, which is the general solution?'
  choices: ['$y = \dfrac{C}{t^2}$', '$y = Ct^2$', '$y = Ce^{-2t}$', '$y = C - 2\ln t$']
  answer: 0
  explanation: |-
    $\mu = t^2$ and $(t^2y)' = 0$, so $t^2y = C$. Check: $y' = -2C/t^3$ and $\tfrac2t\cdot C/t^2 = 2C/t^3$; they cancel.
# Lesson 9
- id: de-q-0901
  lesson: de-exact
  module_quiz: true
  topic: Exact equations
  stem: 'Which equation is exact?'
  choices: ['$(2xy + 3)\,dx + (x^2 - 4y)\,dy = 0$', '$(x + y)\,dx + (2x - y)\,dy = 0$', '$y\,dx - x\,dy = 0$', '$(x^2 + y)\,dx + x^2\,dy = 0$']
  answer: 0
  explanation: |-
    For the first, $M_y = 2x$ and $N_x = 2x$. The others: $1$ vs $2$; $1$ vs $-1$; $1$ vs $2x$.
- id: de-q-0902
  lesson: de-exact
  module_quiz: true
  topic: Exact equations
  stem: 'Solve $(2xy + 3)\,dx + (x^2 - 4y)\,dy = 0$ with $y(1) = 2$.'
  choices: ['$x^2y + 3x - 2y^2 = 0$', '$x^2y + 3x - 4y^2 = -11$', '$x^2y + 3x - 2y^2 = -3$', '$x^2y - 2y^2 = -6$']
  answer: 2
  explanation: |-
    $F = \int (2xy + 3)\,dx = x^2y + 3x + h(y)$; $F_y = x^2 + h' = x^2 - 4y$ gives $h = -2y^2$. At $(1, 2)$: $F = 2 + 3 - 8 = -3$.
- id: de-q-0903
  lesson: de-exact
  topic: Exact equations
  stem: 'For which $k$ is $(kx^2y + y^3)\,dx + (x^3 + 3xy^2)\,dy = 0$ exact?'
  choices: ['$k = 1$', '$k = 3$', '$k = 2$', '$k = 6$']
  answer: 1
  explanation: |-
    $M_y = kx^2 + 3y^2$ and $N_x = 3x^2 + 3y^2$. They match when $k = 3$.
- id: de-q-0904
  lesson: de-exact
  topic: Exact equations
  stem: 'The test for exactness of $M\,dx + N\,dy = 0$ compares'
  choices: ['$\partial M/\partial x$ with $\partial N/\partial y$', '$M$ with $N$', '$\partial M/\partial x$ with $\partial N/\partial x$', '$\partial M/\partial y$ with $\partial N/\partial x$']
  answer: 3
  explanation: |-
    If $F_x = M$ and $F_y = N$, then $M_y = F_{xy} = F_{yx} = N_x$. Each function is differentiated with respect to the other variable.
- id: de-q-0905
  lesson: de-exact
  topic: Exact equations
  stem: 'While solving an exact equation you get $F = x^3y + h(y)$ and need $F_y = x^3 + 2y$. What is $h(y)$?'
  choices: ['$2y$', '$y^2$', '$x^3y + y^2$', '$2$']
  answer: 1
  explanation: |-
    $F_y = x^3 + h'(y)$, so $h'(y) = 2y$ and $h = y^2$. Taking $h = 2y$ confuses $h$ with $h'$.
- id: de-q-0906
  lesson: de-exact
  topic: Exact equations
  stem: 'The general solution of $(3x^2 + y\cos x)\,dx + (\sin x - 4y^3)\,dy = 0$ is'
  choices: ['$x^3 + y\cos x - y^4 = C$', '$x^3 + 2y\sin x - y^4 = C$', '$6x - y\sin x - 12y^2 = C$', '$x^3 + y\sin x - y^4 = C$']
  answer: 3
  explanation: |-
    Check $F = x^3 + y\sin x - y^4$: $F_x = 3x^2 + y\cos x$ and $F_y = \sin x - 4y^3$. The $y\sin x$ term appears in both integrals but goes in $F$ once.
- id: de-q-0907
  lesson: de-exact
  module_quiz: true
  topic: Exact equations
  stem: 'For $(3xy + y^2)\,dx + (x^2 + xy)\,dy = 0$, which integrating factor makes it exact?'
  choices: ['$\mu = x$', '$\mu = y$', '$\mu = e^x$', '$\mu = 1/x$']
  answer: 0
  explanation: |-
    $\dfrac{M_y - N_x}{N} = \dfrac{(3x + 2y) - (2x + y)}{x(x + y)} = \dfrac1x$, depending only on $x$, so $\mu = e^{\int dx/x} = x$.
- id: de-q-0908
  lesson: de-exact
  topic: Exact equations
  stem: 'An exact equation has potential $F(x, y) = x^2 + xy^2$. What do its solutions look like?'
  choices: ['The curves $2x + y^2 = C$', 'The graph $y = x^2 + xy^2$', 'The level curves $x^2 + xy^2 = C$', 'The single curve $x^2 + xy^2 = 0$']
  answer: 2
  explanation: |-
    Along a solution $dF/dx = M + Ny' = 0$, so $F$ is constant: solutions are level curves of $F$, with $C$ set by the initial condition.
- id: de-q-0909
  lesson: de-exact
  topic: Exact equations
  stem: 'The linear equation $y'' + p(x)y = g(x)$ written as $(py - g)\,dx + dy = 0$ has $(M_y - N_x)/N = p(x)$. What does this show?'
  choices: ['Linear equations are always exact', 'Linear equations can never be made exact', 'The integrating factor is $p(x)$', 'The usual integrating factor $e^{\int p\,dx}$ is the exact-equation integrating factor']
  answer: 3
  explanation: |-
    Since $(M_y - N_x)/N = p$ depends only on $x$, $\mu = e^{\int p\,dx}$, the same factor as the linear method. The equation is exact only if $p = 0$.
- id: de-q-0910
  lesson: de-exact
  topic: Exact equations
  stem: 'Solve $(y e^{x} + 2x)\,dx + (e^{x} + 1)\,dy = 0$ with $y(0) = 1$.'
  choices: ['$ye^x + x^2 + y = 1$', '$ye^x + x^2 + y = 2$', '$ye^x + 2x + y = 2$', '$ye^x + x^2 = 1$']
  answer: 1
  explanation: |-
    $M_y = e^x = N_x$. $F = \int (e^x + 1)\,dy = ye^x + y + g(x)$; $F_x = ye^x + g' = ye^x + 2x$ gives $g = x^2$. At $(0, 1)$: $1 + 0 + 1 = 2$.
- id: de-q-0911
  lesson: de-exact
  topic: Exact equations
  stem: 'Is $(y^2 + 2x)\,dx + 2xy\,dy = 0$ exact, and if so what is its potential?'
  choices: ['Exact, $F = y^2x + 2x^2$', 'Not exact', 'Exact, $F = xy^2 + x^2$', 'Exact, $F = 2xy + y^2$']
  answer: 2
  explanation: |-
    $M_y = 2y = N_x$. $F = \int (y^2 + 2x)\,dx = xy^2 + x^2 + h(y)$, and $F_y = 2xy$ gives $h' = 0$.
# Lesson 10
- id: de-q-1001
  lesson: de-substitutions
  module_quiz: true
  topic: Substitutions
  stem: 'For the Bernoulli equation $y'' + 2y = ty^4$, which substitution makes it linear?'
  choices: ['$v = y^{-3}$', '$v = y^4$', '$v = y^{-4}$', '$v = y^{3}$']
  answer: 0
  explanation: |-
    With $n = 4$, $v = y^{1 - n} = y^{-3}$.
- id: de-q-1002
  lesson: de-substitutions
  module_quiz: true
  topic: Substitutions
  stem: 'Solve $y'' - y = -y^2$, $y(0) = \tfrac13$.'
  choices: ['$y = \dfrac{1}{1 + 2e^{-t}}$', '$y = \dfrac{1}{3e^{-t}}$', '$y = \dfrac{1}{1 + 2e^{t}}$', '$y = \dfrac{1}{3 - 2e^{-t}}$']
  answer: 0
  explanation: |-
    $v = 1/y$ gives $v' + v = 1$, so $v = 1 + Ce^{-t}$; $v(0) = 3$ gives $C = 2$. This is a logistic equation with $K = 1$.
- id: de-q-1003
  lesson: de-substitutions
  topic: Substitutions
  stem: 'With $v = y^{1-n}$, the Bernoulli equation $y'' + py = qy^n$ becomes'
  choices: ['$v'' + pv = q$', '$v'' + (1 - n)pv = q$', '$v'' + (1 - n)pv = (1 - n)q$', '$v'' - npv = nq$']
  answer: 2
  explanation: |-
    Divide by $y^n$ and use $v' = (1 - n)y^{-n}y'$: $\frac{1}{1-n}v' + pv = q$. Multiply by $1 - n$. Forgetting to multiply $q$ too is common.
- id: de-q-1004
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Which equation is homogeneous in the sense $y'' = F(y/x)$?'
  choices: ['$y'' = \dfrac{x + y^2}{x}$', '$y'' = \dfrac{x^2 - y^2}{xy}$', '$y'' = x^2 + y^2$', '$y'' = \dfrac{y}{x} + x$']
  answer: 1
  explanation: |-
    Dividing top and bottom by $x^2$ gives $\dfrac{1 - (y/x)^2}{y/x}$. The others change when $x$ and $y$ are scaled by the same factor.
- id: de-q-1005
  lesson: de-substitutions
  module_quiz: true
  topic: Substitutions
  stem: 'With $y = vx$, what does $y'' = F(y/x)$ become?'
  choices: ['$v'' = F(v)$', '$xv'' = F(v)$', '$v + v'' = F(v)$', '$v + xv'' = F(v)$']
  answer: 3
  explanation: |-
    By the product rule, $y' = v + xv'$. Writing $y' = v'$ forgets that $x$ varies too.
- id: de-q-1006
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Solve $y'' = \dfrac{y + 2x}{x}$ for $x > 0$ with $y(1) = 1$.'
  choices: ['$y = x\ln x + x$', '$y = 2x\ln x + x$', '$y = 2\ln x + x$', '$y = x^2 + 2x\ln x$']
  answer: 1
  explanation: |-
    $v + xv' = v + 2$, so $v' = 2/x$ and $v = 2\ln x + C$. Then $y = 2x\ln x + Cx$, and $y(1) = C = 1$.
- id: de-q-1007
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Which substitution turns $y'' = (2x + y - 1)^2$ into a separable equation?'
  choices: ['$v = y/x$', '$v = y^{-1}$', '$u = y^2$', '$u = 2x + y - 1$']
  answer: 3
  explanation: |-
    With $u = 2x + y - 1$, $u' = 2 + y' = 2 + u^2$, which is separable.
- id: de-q-1008
  lesson: de-substitutions
  topic: Substitutions
  stem: 'In solving $y'' + y = y^2$ with $v = 1/y$, the initial condition $y(0) = \tfrac14$ becomes'
  choices: ['$v(0) = 4$', '$v(0) = \tfrac14$', '$v(0) = -4$', '$v(0) = 16$']
  answer: 0
