# Module 7: Laplace transforms
- id: de-q-2701
  lesson: de-laplace-def
  module_quiz: true
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{t^2e^{3t}\}$.'
  choices: ['$\dfrac{2}{(s + 3)^3}$', '$\dfrac{2}{(s - 3)^3}$', '$\dfrac{1}{(s - 3)^3}$', '$\dfrac{2}{s^3(s - 3)}$']
  answer: 1
  explanation: |-
    $\mathcal{L}\{t^2\} = 2/s^3$; multiplying by $e^{3t}$ replaces $s$ with $s - 3$. The choice $\dfrac{2}{s^3(s - 3)}$ multiplies transforms, which is not allowed.
- id: de-q-2702
  lesson: de-laplace-def
  module_quiz: true
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{\cos 5t\}$.'
  choices: ['$\dfrac{5}{s^2 + 25}$', '$\dfrac{s}{s^2 - 25}$', '$\dfrac{s}{s^2 + 5}$', '$\dfrac{s}{s^2 + 25}$']
  answer: 3
  explanation: |-
    $\mathcal{L}\{\cos bt\} = s/(s^2 + b^2)$ with $b = 5$. The sine has $b$ on top instead of $s$.
- id: de-q-2703
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{4 - 3t + e^{2t}\}$.'
  choices: ['$\dfrac4s - \dfrac{3}{s^2} + \dfrac{1}{s - 2}$', '$\dfrac4s - \dfrac3s + \dfrac{1}{s - 2}$', '$4 - \dfrac{3}{s^2} + \dfrac{1}{s + 2}$', '$\dfrac4s - \dfrac{3}{s^2} + \dfrac{1}{s + 2}$']
  answer: 0
  explanation: |-
    By linearity: $\mathcal{L}\{1\} = 1/s$, $\mathcal{L}\{t\} = 1/s^2$, $\mathcal{L}\{e^{2t}\} = 1/(s - 2)$.
- id: de-q-2704
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{e^{-2t}\cos 5t\}$.'
  choices: ['$\dfrac{s}{(s + 2)^2 + 25}$', '$\dfrac{s - 2}{(s - 2)^2 + 25}$', '$\dfrac{s + 2}{(s + 2)^2 + 25}$', '$\dfrac{5}{(s + 2)^2 + 25}$']
  answer: 2
  explanation: |-
    First shift with $a = -2$: replace every $s$ in $\dfrac{s}{s^2 + 25}$ by $s + 2$, including the numerator.
- id: de-q-2705
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Using the definition, $\mathcal{L}\{e^{at}\} = \dfrac{1}{s - a}$ holds for which $s$?'
  choices: ['$s > 0$', 'all $s$', '$s < a$', '$s > a$']
  answer: 3
  explanation: |-
    $\int_0^\infty e^{-(s - a)t}dt$ converges only when $s - a > 0$.
- id: de-q-2706
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{\sin^2 t\}$.'
  choices: ['$\dfrac{1}{(s^2 + 1)^2}$', '$\dfrac{2}{s(s^2 + 4)}$', '$\dfrac{1}{s^2 + 1}$', '$\dfrac{s}{s^2 + 4}$']
  answer: 1
  explanation: |-
    $\sin^2 t = \tfrac12 - \tfrac12\cos 2t$, so the transform is $\dfrac{1}{2s} - \dfrac{s}{2(s^2 + 4)} = \dfrac{2}{s(s^2 + 4)}$. Squaring the transform of $\sin t$ is wrong: $\mathcal{L}\{fg\} \ne FG$.
- id: de-q-2707
  lesson: de-laplace-def
  module_quiz: true
  topic: Laplace transform
  stem: 'The first shifting theorem says $\mathcal{L}\{e^{at}f(t)\} =$'
  choices: ['$F(s + a)$', '$e^{as}F(s)$', '$F(s - a)$', '$e^{-as}F(s)$']
  answer: 2
  explanation: |-
    $\int_0^\infty e^{-st}e^{at}f(t)\,dt = \int_0^\infty e^{-(s - a)t}f(t)\,dt = F(s - a)$. The $e^{-as}F(s)$ form belongs to the second shifting theorem (delays in $t$).
- id: de-q-2708
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Which function does NOT have a Laplace transform?'
  choices: ['$e^{t^2}$', '$t^{10}$', '$e^{5t}\sin t$', 'a step function']
  answer: 0
  explanation: |-
    $e^{t^2}$ grows faster than any $Me^{ct}$, so it is not of exponential order and the integral diverges for every $s$.
- id: de-q-2709
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'If $F(s) = \mathcal{L}\{e^{-t}\cos 2t\}$, what is $F(1)$?'
  choices: ['$\tfrac14$', '$\tfrac15$', '$\tfrac12$', '$\tfrac{1}{8}$']
  answer: 0
  explanation: |-
    $F(s) = \dfrac{s + 1}{(s + 1)^2 + 4}$, so $F(1) = \dfrac{2}{8} = \dfrac14$.
- id: de-q-2710
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Find $\mathcal{L}\{t^4\}$.'
  choices: ['$\dfrac{4}{s^5}$', '$\dfrac{24}{s^4}$', '$\dfrac{24}{s^5}$', '$\dfrac{1}{s^5}$']
  answer: 2
  explanation: |-
    $\mathcal{L}\{t^n\} = n!/s^{n+1}$ with $n = 4$: $4! = 24$ over $s^5$.
- id: de-q-2711
  lesson: de-laplace-def
  topic: Laplace transform
  stem: 'Which statement is true for the transform $F(s)$ of any piecewise continuous function of exponential order?'
  choices: ['$F(s) \to 1$ as $s \to \infty$', '$F(s) \to 0$ as $s \to \infty$', '$F(0) = f(0)$', '$F$ is always a polynomial']
  answer: 1
  explanation: |-
    The factor $e^{-st}$ crushes the integral as $s$ grows. So something like $F(s) = s^2$ can't be the transform of an ordinary function.
# Lesson 29
- id: de-q-2801
  lesson: de-laplace-inverse
  module_quiz: true
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{5}{(s - 2)(s + 3)}\right\}$.'
  choices: ['$5e^{2t} - 5e^{-3t}$', '$e^{-2t} - e^{3t}$', '$e^{2t} + e^{-3t}$', '$e^{2t} - e^{-3t}$']
  answer: 3
  explanation: |-
    Cover-up: at $s = 2$, $5/5 = 1$; at $s = -3$, $5/(-5) = -1$. So $\dfrac{1}{s - 2} - \dfrac{1}{s + 3}$.
- id: de-q-2802
  lesson: de-laplace-inverse
  module_quiz: true
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s + 3}{s^2 + 6s + 25}\right\}$.'
  choices: ['$e^{3t}\cos 4t$', '$e^{-3t}\cos 4t$', '$e^{-3t}\cos 5t$', '$e^{-3t}\sin 4t$']
  answer: 1
  explanation: |-
    $s^2 + 6s + 25 = (s + 3)^2 + 16$, and the numerator is already $s + 3$: the shifted cosine with $a = -3$, $b = 4$.
- id: de-q-2803
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{3}{s^2 + 16}\right\}$.'
  choices: ['$3\sin 4t$', '$\tfrac{3}{16}\sin 4t$', '$3\cos 4t$', '$\tfrac34\sin 4t$']
  answer: 3
  explanation: |-
    The table entry is $\dfrac{4}{s^2 + 16} \leftrightarrow \sin 4t$, so multiply by $\tfrac34$.
- id: de-q-2804
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{6}{(s + 2)^4}\right\}$.'
  choices: ['$t^3e^{-2t}$', '$6t^3e^{-2t}$', '$t^4e^{-2t}$', '$t^3e^{2t}$']
  answer: 0
  explanation: |-
    $\dfrac{3!}{s^4} \leftrightarrow t^3$, and $(s + 2)$ means multiply by $e^{-2t}$. Since $3! = 6$ the constant matches exactly.
- id: de-q-2805
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{s - 4}{s^2 + 4}\right\}$.'
  choices: ['$\cos 2t - 4\sin 2t$', '$\cos 2t - \sin 2t$', '$\cos 2t - 2\sin 2t$', '$e^{4t}\cos 2t$']
  answer: 2
  explanation: |-
    Split: $\dfrac{s}{s^2 + 4} - 2\cdot\dfrac{2}{s^2 + 4}$, giving $\cos 2t - 2\sin 2t$.
- id: de-q-2806
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{s(s + 2)}\right\}$.'
  choices: ['$1 - e^{-2t}$', '$\tfrac12(1 + e^{-2t})$', '$te^{-2t}$', '$\tfrac12(1 - e^{-2t})$']
  answer: 3
  explanation: |-
    $\dfrac{1}{s(s + 2)} = \dfrac{1/2}{s} - \dfrac{1/2}{s + 2}$.
- id: de-q-2807
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'How many partial-fraction terms does $\dfrac{s + 1}{(s - 1)^3(s^2 + 4)}$ need?'
  choices: ['2', '4: three for $(s - 1)^3$ and one $\dfrac{Bs + C}{s^2 + 4}$', '3', '5']
  answer: 1
  explanation: |-
    A repeated factor $(s - 1)^3$ needs denominators $(s - 1)$, $(s - 1)^2$, $(s - 1)^3$; the irreducible quadratic needs one term with a linear numerator.
- id: de-q-2808
  lesson: de-laplace-inverse
  module_quiz: true
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{2s + 1}{s^2 + 4s + 13}\right\}$.'
  choices: ['$e^{-2t}(2\cos 3t + \tfrac13\sin 3t)$', '$e^{2t}(2\cos 3t - \sin 3t)$', '$e^{-2t}(2\cos 3t - \sin 3t)$', '$2e^{-2t}\cos 3t$']
  answer: 2
  explanation: |-
    $(s + 2)^2 + 9$ and $2s + 1 = 2(s + 2) - 3$. So $2\cdot\dfrac{s + 2}{(s+2)^2 + 9} - \dfrac{3}{(s+2)^2 + 9}$, which inverts to $2e^{-2t}\cos 3t - e^{-2t}\sin 3t$.
- id: de-q-2809
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{3s + 1}{(s + 1)^2}\right\}$.'
  choices: ['$3e^{-t} - 2te^{-t}$', '$3e^{-t} + te^{-t}$', '$3te^{-t}$', '$3e^{-t} - 2e^{-t}$']
  answer: 0
  explanation: |-
    $3s + 1 = 3(s + 1) - 2$, so $\dfrac{3}{s + 1} - \dfrac{2}{(s + 1)^2}$.
- id: de-q-2810
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'Using the cover-up method on $\dfrac{s + 7}{(s - 1)(s + 3)} = \dfrac{A}{s - 1} + \dfrac{B}{s + 3}$, what is $A$?'
  choices: ['2', '8', '$\tfrac74$', '$-1$']
  answer: 0
  explanation: |-
    Cover $(s - 1)$ and set $s = 1$: $\dfrac{1 + 7}{1 + 3} = 2$. ($B = -1$.)
- id: de-q-2811
  lesson: de-laplace-inverse
  topic: Inverse Laplace transform
  stem: 'The initial value theorem says $f(0^+) = \lim_{s\to\infty} sF(s)$. For $F(s) = \dfrac{3s + 2}{s^2 + 1}$, what is $f(0)$?'
  choices: ['2', '0', '3', '5']
  answer: 2
  explanation: |-
    $sF(s) = \dfrac{3s^2 + 2s}{s^2 + 1} \to 3$. Indeed $f = 3\cos t + 2\sin t$ has $f(0) = 3$.
# Lesson 30
- id: de-q-2901
  lesson: de-laplace-ivp
  module_quiz: true
  topic: Laplace transform IVPs
  stem: 'If $y(0) = 2$ and $y''(0) = -1$, what is $\mathcal{L}\{y''''\}$?'
  choices: ['$s^2Y - 2s - 1$', '$s^2Y - 2s + 1$', '$s^2Y - s + 2$', '$s^2Y + 2s - 1$']
  answer: 1
  explanation: |-
    $\mathcal{L}\{y''\} = s^2Y - sy(0) - y'(0) = s^2Y - 2s - (-1)$.
- id: de-q-2902
  lesson: de-laplace-ivp
  module_quiz: true
  topic: Laplace transform IVPs
  stem: 'Transforming $y'''' + 9y = 0$, $y(0) = 0$, $y''(0) = 6$ gives $Y(s) =$'
  choices: ['$\dfrac{6}{s^2 + 9}$, so $y = 6\sin 3t$', '$\dfrac{6s}{s^2 + 9}$, so $y = 6\cos 3t$', '$\dfrac{6}{s^2 - 9}$, so $y = 2\sinh 3t$', '$\dfrac{6}{s^2 + 9}$, so $y = 2\sin 3t$']
  answer: 3
  explanation: |-
    $s^2Y - 6 + 9Y = 0$, so $Y = 6/(s^2 + 9) = 2\cdot 3/(s^2 + 9)$.
- id: de-q-2903
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'Solve $y'' - 2y = e^{3t}$, $y(0) = 1$ using Laplace transforms.'
  choices: ['$y = e^{2t} + e^{3t}$', '$y = e^{3t}$', '$y = 2e^{3t} - e^{2t}$', '$y = e^{2t}$']
  answer: 1
  explanation: |-
    $(s - 2)Y = 1 + \dfrac{1}{s - 3}$, so $Y = \dfrac{1}{s - 2} + \dfrac{1}{(s - 2)(s - 3)} = \dfrac{1}{s - 2} + \dfrac{1}{s - 3} - \dfrac{1}{s - 2} = \dfrac{1}{s - 3}$. Check: $y' - 2y = 3e^{3t} - 2e^{3t} = e^{3t}$ and $y(0) = 1$.
- id: de-q-2904
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'For $y'''' - 3y'' + 2y = 0$, $y(0) = 0$, $y''(0) = 1$, what is $Y(s)$?'
  choices: ['$\dfrac{s}{(s - 1)(s - 2)}$', '$\dfrac{1}{(s + 1)(s + 2)}$', '$\dfrac{s - 3}{(s - 1)(s - 2)}$', '$\dfrac{1}{(s - 1)(s - 2)}$']
  answer: 3
  explanation: |-
    $(s^2Y - 1) - 3sY + 2Y = 0$ gives $(s^2 - 3s + 2)Y = 1$. Then $y = e^{2t} - e^t$.
- id: de-q-2905
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'When an IVP $ay'''' + by'' + cy = g$ is transformed, what multiplies $Y(s)$?'
  choices: ['The characteristic polynomial $as^2 + bs + c$', '$s^2$', 'The transform $G(s)$', '$a + b + c$']
  answer: 0
  explanation: |-
    The $y''$, $y'$, $y$ terms contribute $as^2Y$, $bsY$, $cY$. Its roots are the characteristic roots, which become the poles of $Y$.
- id: de-q-2906
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'Solve $y'''' + 4y = 8$, $y(0) = y''(0) = 0$.'
  choices: ['$2\sin 2t$', '$8 - 8\cos 2t$', '$2 - 2\cos 2t$', '$2 + 2\cos 2t$']
  answer: 2
  explanation: |-
    $Y = \dfrac{8}{s(s^2 + 4)} = \dfrac2s - \dfrac{2s}{s^2 + 4}$. Check: $y(0) = 0$ and $y'' + 4y = 8\cos 2t + 8 - 8\cos 2t = 8$.
- id: de-q-2907
  lesson: de-laplace-ivp
  module_quiz: true
  topic: Laplace transform IVPs
  stem: 'Find the step that''s wrong. $y'' + 3y = 6$, $y(0) = 1$: (1) $sY - 1 + 3Y = 6$; (2) $Y = \dfrac{7}{s + 3}$; (3) $y = 7e^{-3t}$.'
  choices: ['Step 2 only', 'Step 3 only', 'Nothing is wrong', 'Step 1: the 6 should become $6/s$']
  answer: 3
  explanation: |-
    The right side must be transformed too: $\mathcal{L}\{6\} = 6/s$. Then $Y = \dfrac{1}{s + 3} + \dfrac{6}{s(s + 3)}$ and $y = 2 - e^{-3t}$.
- id: de-q-2908
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'Solve $y'''' + 2y'' + y = 4e^{t}$, $y(0) = y''(0) = 0$.'
  choices: ['$e^t - e^{-t}$', '$e^t - e^{-t} - 2te^{-t}$', '$e^t + e^{-t} - 2te^{-t}$', '$4te^{-t}$']
  answer: 1
  explanation: |-
    $Y = \dfrac{4}{(s - 1)(s + 1)^2} = \dfrac{1}{s - 1} - \dfrac{1}{s + 1} - \dfrac{2}{(s + 1)^2}$.
- id: de-q-2909
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'Why does the Laplace method not need a separate step to fit constants?'
  choices: ['Because all constants are zero', 'Because it only works for zero initial conditions', 'The derivative rules insert $y(0)$, $y''(0)$ directly into the transformed equation', 'Because the inverse transform is unique up to a constant']
  answer: 2
  explanation: |-
    $\mathcal{L}\{y'\} = sY - y(0)$ and $\mathcal{L}\{y''\} = s^2Y - sy(0) - y'(0)$ build the initial data into $Y(s)$.
- id: de-q-2910
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'For $y'''' + 2y'' + 5y = 0$, $y(0) = 1$, $y''(0) = 3$, which is $Y(s)$?'
  choices: ['$\dfrac{s + 5}{s^2 + 2s + 5}$', '$\dfrac{s + 3}{s^2 + 2s + 5}$', '$\dfrac{s + 1}{s^2 + 2s + 5}$', '$\dfrac{3s + 1}{s^2 + 2s + 5}$']
  answer: 0
  explanation: |-
    $(s^2Y - s - 3) + 2(sY - 1) + 5Y = 0$, so the numerator is $s + 3 + 2 = s + 5$.
- id: de-q-2911
  lesson: de-laplace-ivp
  topic: Laplace transform IVPs
  stem: 'Derive $\mathcal{L}\{f''\}$ from the definition. Which technique is used?'
  choices: ['Integration by parts, giving $sF(s) - f(0)$', 'Substitution, giving $F(s)/s$', 'Partial fractions, giving $sF(s)$', 'The chain rule, giving $F''(s)$']
  answer: 0
  explanation: |-
    With $u = e^{-st}$, $dv = f'\,dt$: $[e^{-st}f]_0^\infty + s\int e^{-st}f\,dt = -f(0) + sF(s)$.
# Lesson 31
- id: de-q-3001
  lesson: de-laplace-step
  module_quiz: true
  topic: Step functions
  stem: 'Find $\mathcal{L}\{u_3(t)\}$.'
  choices: ['$\dfrac{e^{3s}}{s}$', '$e^{-3s}$', '$\dfrac{e^{-3s}}{s}$', '$\dfrac{1}{s - 3}$']
  answer: 2
  explanation: |-
    $\int_3^\infty e^{-st}dt = e^{-3s}/s$. $e^{-3s}$ alone is the transform of $\delta(t - 3)$; $1/(s - 3)$ is $e^{3t}$.
- id: de-q-3002
  lesson: de-laplace-step
  module_quiz: true
  topic: Step functions
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{e^{-2s}}{s^2}\right\}$.'
  choices: ['$u_2(t)\,t$', '$u_2(t)(t - 2)$', '$t - 2$', '$e^{-2t}t$']
  answer: 1
  explanation: |-
    $\mathcal{L}^{-1}\{1/s^2\} = t$; the factor $e^{-2s}$ delays it: $u_2(t)(t - 2)$, a ramp starting at $t = 2$.
- id: de-q-3003
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Write "$f(t) = 5$ for $2 \le t < 6$, otherwise 0" with step functions.'
  choices: ['$5(u_6(t) - u_2(t))$', '$5u_2(t)u_6(t)$', '$5u_4(t)$', '$5(u_2(t) - u_6(t))$']
  answer: 3
  explanation: |-
    $u_2$ switches on at 2 and subtracting $u_6$ switches off at 6. The reversed order gives $-5$ on the interval.
- id: de-q-3004
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Find $\mathcal{L}\{u_3(t)(t - 3)^2\}$.'
  choices: ['$\dfrac{2}{(s - 3)^3}$', '$\dfrac{2e^{-3s}}{s^3}$', '$e^{-3s}\dfrac{2}{s^2}$', '$\dfrac{2e^{3s}}{s^3}$']
  answer: 1
  explanation: |-
    The function is already in terms of $t - 3$, so $e^{-3s}\mathcal{L}\{t^2\} = 2e^{-3s}/s^3$. The choice $\dfrac{2}{(s - 3)^3}$ confuses the two shifting theorems (it is the transform of $t^2e^{3t}$).
- id: de-q-3005
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Find $\mathcal{L}\{u_2(t)\,t\}$.'
  choices: ['$\dfrac{e^{-2s}}{s^2}$', '$e^{-2s}\left(\dfrac{1}{s^2} - \dfrac{2}{s}\right)$', '$\dfrac{e^{-2s}}{s}$', '$e^{-2s}\left(\dfrac{1}{s^2} + \dfrac{2}{s}\right)$']
  answer: 3
  explanation: |-
    Rewrite $t = (t - 2) + 2$, so the transform is $e^{-2s}(1/s^2 + 2/s)$. Skipping the rewrite gives $e^{-2s}/s^2$, which is the transform of $u_2(t)(t - 2)$.
- id: de-q-3006
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Express $g(t) = t$ for $t < 4$ and $g(t) = 8$ for $t \ge 4$ using step functions.'
  choices: ['$t + (8 - t)u_4(t)$', '$t + 8u_4(t)$', '$tu_4(t) + 8$', '$(t - 8)u_4(t)$']
  answer: 0
  explanation: |-
    Start with $f_1 = t$; at $t = 4$ swap it for $f_2 = 8$ by adding $(f_2 - f_1)u_4$.
- id: de-q-3007
  lesson: de-laplace-step
  module_quiz: true
  topic: Step functions
  stem: 'If $Y(s) = e^{-cs}H(s)$ and $h = \mathcal{L}^{-1}\{H\}$, then $y(t) =$'
  choices: ['$u_c(t)h(t)$', '$h(t - c)$', '$u_c(t)h(t - c)$', '$e^{-ct}h(t)$']
  answer: 2
  explanation: |-
    The second shifting theorem delays the whole function and switches it on at $t = c$.
- id: de-q-3008
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Solve $y'' + y = 1 - u_2(t)$, $y(0) = 0$. For $t \ge 2$, $y(t) =$'
  choices: ['$1 - e^{-t}$', '$e^{-(t - 2)}$', '$0$', '$(e^2 - 1)e^{-t}$']
  answer: 3
  explanation: |-
    $y = 1 - e^{-t} - u_2(t)(1 - e^{-(t-2)})$. For $t \ge 2$: $1 - e^{-t} - 1 + e^{2}e^{-t} = (e^2 - 1)e^{-t}$.
- id: de-q-3009
  lesson: de-laplace-step
  topic: Step functions
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{e^{-\pi s}}{s^2 + 1}\right\}$.'
  choices: ['$u_\pi(t)\sin t$', '$-u_\pi(t)\sin t$', '$\sin(t - \pi)$', '$u_\pi(t)\cos t$']
  answer: 1
  explanation: |-
    $u_\pi(t)\sin(t - \pi)$, and $\sin(t - \pi) = -\sin t$. Without the step factor, $\sin(t - \pi)$ would act before $t = \pi$.
- id: de-q-3010
  lesson: de-laplace-step
  topic: Step functions
  stem: 'A spring $y'''' + 4y = u_\pi(t)$ starts at rest at equilibrium. Which describes the motion?'
  choices: ['Oscillates from $t = 0$', '$\tfrac14(1 - \cos 2t)$ for all $t$', 'At rest until $t = \pi$, then $\tfrac14(1 - \cos 2t)$', 'Grows without bound after $t = \pi$']
  answer: 2
  explanation: |-
    $y = \tfrac14u_\pi(t)(1 - \cos 2(t - \pi)) = \tfrac14u_\pi(t)(1 - \cos 2t)$: nothing happens until the force switches on, then it oscillates between 0 and $\tfrac12$.
- id: de-q-3011
  lesson: de-laplace-step
  topic: Step functions
  stem: 'What is $\mathcal{L}\{u_1(t) - u_4(t)\}$?'
  choices: ['$\dfrac{e^{-s} - e^{-4s}}{s}$', '$\dfrac{e^{-3s}}{s}$', '$\dfrac{e^{s} - e^{4s}}{s}$', '$e^{-s} - e^{-4s}$']
  answer: 0
  explanation: |-
    By linearity, $\dfrac{e^{-s}}{s} - \dfrac{e^{-4s}}{s}$.
