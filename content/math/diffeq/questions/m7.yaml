- id: de-q-3101
  lesson: de-laplace-impulse
  module_quiz: true
  topic: Impulses and convolution
  stem: 'Find $\mathcal{L}\{\delta(t - 2)\}$.'
  choices: ['$e^{-2s}$', '$\dfrac{e^{-2s}}{s}$', '$1$', '$e^{2s}$']
  answer: 0
  explanation: |-
    By the sifting property, $\int_0^\infty e^{-st}\delta(t - 2)\,dt = e^{-2s}$. $e^{-2s}/s$ is the step $u_2$.
- id: de-q-3102
  lesson: de-laplace-impulse
  module_quiz: true
  topic: Impulses and convolution
  stem: 'Solve $y'''' + 4y = \delta(t - 1)$, $y(0) = y''(0) = 0$.'
  choices: ['$u_1(t)\sin 2(t - 1)$', '$\tfrac12\sin 2t$', '$\tfrac12u_1(t)\sin 2(t - 1)$', '$\tfrac12u_1(t)\cos 2(t - 1)$']
  answer: 2
  explanation: |-
    $Y = \dfrac{e^{-s}}{s^2 + 4}$; $\mathcal{L}^{-1}\{1/(s^2 + 4)\} = \tfrac12\sin 2t$, delayed by 1.
- id: de-q-3103
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'Evaluate $\displaystyle\int_0^\infty \cos t\;\delta(t - \pi)\,dt$.'
  choices: ['$1$', '$-1$', '$0$', '$\pi$']
  answer: 1
  explanation: |-
    Sifting picks out $\cos\pi = -1$.
- id: de-q-3104
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'The convolution theorem states'
  choices: ['$\mathcal{L}\{fg\} = F(s)G(s)$', '$\mathcal{L}\{f * g\} = F(s) + G(s)$', '$\mathcal{L}\{f * g\} = F(s) * G(s)$', '$\mathcal{L}\{f * g\} = F(s)G(s)$']
  answer: 3
  explanation: |-
    The product of transforms corresponds to the convolution $\int_0^t f(t - \tau)g(\tau)d\tau$, not to the ordinary product.
- id: de-q-3105
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'Compute $t * e^{t} = \displaystyle\int_0^t (t - \tau)e^{\tau}\,d\tau$.'
  choices: ['$te^t$', '$e^t - t - 1$', '$e^t - 1$', '$\tfrac12t^2e^t$']
  answer: 1
  explanation: |-
    Integrating by parts gives $e^t - 1 - t$; transforms confirm: $\dfrac{1}{s^2(s - 1)} = \dfrac{1}{s - 1} - \dfrac1s - \dfrac1{s^2}$.
- id: de-q-3106
  lesson: de-laplace-impulse
  module_quiz: true
  topic: Impulses and convolution
  stem: 'The impulse response of $y'''' + 2y'' + 5y = g(t)$ (zero initial conditions) is'
  choices: ['$e^{-t}\sin 2t$', '$e^{-t}\cos 2t$', '$\tfrac15$', '$\tfrac12e^{-t}\sin 2t$']
  answer: 3
  explanation: |-
    $H(s) = \dfrac{1}{(s + 1)^2 + 4} = \tfrac12\cdot\dfrac{2}{(s + 1)^2 + 4}$, so $h(t) = \tfrac12e^{-t}\sin 2t$.
- id: de-q-3107
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'Find $\mathcal{L}^{-1}\left\{\dfrac{1}{(s^2 + 1)^2}\right\}$ using convolution.'
  choices: ['$\tfrac12(\sin t - t\cos t)$', '$\sin^2 t$', '$t\sin t$', '$\tfrac12t\sin t$']
  answer: 0
  explanation: |-
    It's $\sin t * \sin t = \int_0^t\sin(t - \tau)\sin\tau\,d\tau = \tfrac12(\sin t - t\cos t)$. ($\tfrac12t\sin t$ is the inverse of $s/(s^2 + 1)^2$.)
- id: de-q-3108
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'A unit impulse hits a mass at rest. Immediately afterward, which quantity has jumped?'
  choices: ['Position', 'Both position and velocity', 'Velocity (momentum)', 'Neither']
  answer: 2
  explanation: |-
    An impulse delivers a finite change of momentum in zero time, so the velocity jumps while the position stays continuous (it has no time to change).
- id: de-q-3109
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'For $y'''' + 9y = g(t)$ from rest, the solution for any forcing $g$ is'
  choices: ['$\displaystyle\int_0^t\cos(3(t - \tau))g(\tau)\,d\tau$', '$\dfrac13\sin 3t\,g(t)$', '$\dfrac19\displaystyle\int_0^t g(\tau)\,d\tau$', '$\dfrac13\displaystyle\int_0^t\sin(3(t - \tau))g(\tau)\,d\tau$']
  answer: 3
  explanation: |-
    $y = h * g$ with impulse response $h = \mathcal{L}^{-1}\{1/(s^2 + 9)\} = \tfrac13\sin 3t$.
- id: de-q-3110
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'What is $(f * 1)(t)$?'
  choices: ['$f(t)$', '$\displaystyle\int_0^t f(\tau)\,d\tau$', '$1$', '$f(0)$']
  answer: 1
  explanation: |-
    $\int_0^t f(\tau)\cdot 1\,d\tau$ (using commutativity). Its transform is $F(s)/s$, matching $\mathcal{L}\{1\} = 1/s$.
- id: de-q-3111
  lesson: de-laplace-impulse
  topic: Impulses and convolution
  stem: 'Solve $y'' + 2y = 3\delta(t)$, $y(0) = 0$.'
  choices: ['$e^{-2t}$', '$3u_0(t)$', '$3e^{-2t}$', '$\tfrac32(1 - e^{-2t})$']
  answer: 2
  explanation: |-
    $(s + 2)Y = 3$, so $Y = 3/(s + 2)$: the impulse instantly sets $y$ to 3 (for a first-order equation the unknown itself jumps), then it decays.
