# Round 2 questions for de-m3
# ---- Lesson 11 (core)
- id: de-m3-r2-q01
  lesson: de-model-growth
  type: text
  topic: Newton's law of cooling
  stem: 'In Newton''s law of cooling, $T'' = -k(T - T_a)$, the quantity that decays exponentially is the difference between the object''s temperature and the ___ temperature.'
  accept: [ambient, room, surrounding, surroundings, outside, environment, environmental, air]
  explanation: |-
    Let $u = T - T_a$. Then $u' = -ku$, so $u = u_0e^{-kt}$: the gap between the object and its surroundings (the ambient or room temperature) shrinks exponentially. $T$ itself does not decay to 0; it approaches $T_a$.
- id: de-m3-r2-q02
  lesson: de-model-growth
  type: order
  module_quiz: true
  topic: Growth and decay
  stem: 'Put the steps of building and using a model in order.'
  items:
    - 'Choose the variables and their units'
    - 'Write the equation: rate of change = rate in − rate out'
    - 'Solve the differential equation'
    - 'Interpret the solution and check it (units, initial value, long run)'
  explanation: |-
    You can't write an equation before naming the quantities in it, can't solve it before writing it, and can only interpret and check a solution once you have one. If the check fails, you go back to the assumptions and repeat the cycle.
- id: de-m3-r2-q03
  lesson: de-model-growth
  topic: Growth and decay
  stem: 'A \$200,000 loan at 6% compounded continuously is repaid continuously at $d$ dollars per year, so $B'' = 0.06B - d$. Which statements are true? Select all that apply.'
  choices:
    - 'With $d = 15{,}000$ the loan is paid off after about 26.8 years'
    - 'With $d = 12{,}000$ the balance stays at \$200,000 forever'
    - 'With $d = 10{,}000$ the balance grows without bound'
    - 'With $d = 12{,}000$ the loan is paid off after $200{,}000/12{,}000 \approx 16.7$ years'
  answer: [0, 1, 2]
  explanation: |-
    The yearly interest on the starting balance is $0.06 \times 200{,}000 = 12{,}000$. With $d = 15{,}000$, $B = 250{,}000 - 50{,}000e^{0.06t}$ reaches 0 at $t = \ln 5/0.06 \approx 26.8$. With $d = 12{,}000$, $B' = 0$ at the start and the balance never moves, so it is never paid off (dividing the loan by the payment ignores interest). With $d = 10{,}000$, $B' > 0$ and the balance grows exponentially.
- id: de-m3-r2-q04
  lesson: de-model-growth
  type: match
  module_quiz: true
  topic: Growth and decay
  stem: 'Match each equation to the situation it models ($k$, $r$, $d$ positive constants).'
  pairs:
    - ['$T'' = -k(T - T_a)$', 'Newton''s law of cooling']
    - ['$A'' = rA + d$', 'Savings with continuous deposits']
    - ['$B'' = rB - d$', 'Paying off a loan']
    - ['$y'' = -ky$', 'Radioactive decay']
  distractors: [Logistic population growth]
  explanation: |-
    Cooling compares $T$ with the ambient temperature. Savings grow from interest ($rA$) plus deposits ($+d$); a loan grows from interest but payments ($-d$) reduce it. Pure decay has no other term. Logistic growth would need a $y^2$ term, $y' = ky(1 - y/K)$.
- id: de-m3-r2-q05
  lesson: de-model-growth
  type: text
  topic: Newton's law of cooling
  stem: 'Coffee at 90 °C is set in a 20 °C room. After 10 minutes it is 55 °C. Assuming Newton''s law of cooling, its temperature after 20 minutes is ___ °C. Give only the number.'
  accept: ['37.5']
  explanation: |-
    The difference from the room went from 70 to 35 in 10 minutes, so it halves every 10 minutes. After 20 minutes it is 17.5, and $T = 20 + 17.5 = 37.5$ °C. (Halving the temperature itself, 55 to 27.5, forgets the room.)
# ---- Lesson 12 (core)
- id: de-m3-r2-q06
  lesson: de-mixing
  type: label
  module_quiz: true
  topic: Mixing problems
  stem: 'Name the numbered parts of this mixing tank.'
  image: {src: images/de-m3-tank-blank.svg, alt: 'A tank of liquid with an inflow pipe entering from the top left, a motor-driven stirrer with blades in the liquid, and an outflow pipe with a valve leaving from the bottom right.'}
  labels:
    - {x: 22.4, y: 15.9, text: Inflow at the incoming concentration}
    - {x: 62.7, y: 22.3, text: Stirrer that keeps the mixture uniform}
    - {x: 44.8, y: 66.7, text: Solution with volume V and amount Q}
    - {x: 89.6, y: 81.5, text: Outflow at the tank concentration Q/V}
  distractors: [Outflow at the incoming concentration, Equilibrium amount of salt]
  explanation: |-
    Brine enters through the inflow pipe (1) at the incoming concentration. The stirrer (2) is what makes "well-stirred" true, so the solution (3) has one concentration $Q/V$ throughout, and that is the concentration that leaves through the outflow (4). The outflow does not carry the incoming concentration unless the tank has already reached it.
- id: de-m3-r2-q07
  lesson: de-mixing
  type: order
  topic: Mixing problems
  stem: 'A 100 L tank holds 10 kg of salt; brine at 0.2 kg/L enters at 3 L/min and mixture leaves at 2 L/min. Put the solution steps in order.'
  items:
    - 'Write the volume: $V = 100 + t$'
    - 'Write the equation: $Q'' + \dfrac{2}{100 + t}Q = 0.6$'
    - 'Find the integrating factor $(100 + t)^2$'
    - 'Integrate: $(100 + t)^2Q = 0.2(100 + t)^3 + C$'
    - 'Use $Q(0) = 10$ to find $C = -100{,}000$'
  explanation: |-
    The outflow term needs $V(t)$, so the volume comes first. The integrating factor comes from the coefficient of $Q$ in the equation, integrating needs the factor, and the constant can only be found after integrating. This is Example 3 of the lesson.
- id: de-m3-r2-q08
  lesson: de-mixing
  topic: Mixing problems
  stem: 'You solved a constant-volume mixing problem. Which checks should your formula for $Q(t)$ pass? Select all that apply.'
  choices:
    - 'It grows without bound as $t \to \infty$'
    - 'At $t = 0$ it gives the stated initial amount'
    - 'As $t \to \infty$ it approaches the incoming concentration times the volume'
    - 'The concentration $Q/V$ stays between the starting and incoming concentrations'
  answer: [1, 2, 3]
  explanation: |-
    These are the lesson's three checks. With constant volume, $Q = c_{\text{in}}V + (Q_0 - c_{\text{in}}V)e^{-rt/V}$, which starts at $Q_0$ and levels off at $c_{\text{in}}V$; it can't grow forever, and the tank can never get saltier than anything that was put in it.
- id: de-m3-r2-q09
  lesson: de-mixing
  type: text
  module_quiz: true
  topic: Mixing problems
  stem: 'A 400 L tank receives brine containing 0.25 kg of salt per liter at 8 L/min, and the mixture drains at 8 L/min. In the long run the tank holds ___ kg of salt. Give only the number.'
  accept: ['100']
  explanation: |-
    At equilibrium the tank holds liquid at the incoming concentration: $Q_\infty = c_{\text{in}}V = 0.25 \times 400 = 100$ kg. The same answer comes from setting $Q' = 2 - \dfrac{8}{400}Q = 0$. The flow rate affects how fast it gets there, not where it ends up.
- id: de-m3-r2-q10
  lesson: de-mixing
  type: match
  topic: Mixing problems
  stem: 'Match each phrase in a mixing problem to what it means for the model.'
  pairs:
    - ['Pure water flows in', 'The incoming concentration is 0']
    - ['The tank is well stirred', 'The outflow has concentration Q/V']
    - ['Inflow is faster than outflow', 'The volume increases over time']
    - ['The tank starts with pure water', 'Q(0) = 0']
  distractors: ['The volume decreases over time']
  explanation: |-
    "Pure water in" makes the rate-in term zero; "pure water at the start" makes the initial amount zero. Good stirring is what justifies using $Q/V$ for the outflow. If more flows in than out, $V = V_0 + (r_{\text{in}} - r_{\text{out}})t$ increases.
# ---- Lesson 13 (core)
- id: de-m3-r2-q11
  lesson: de-falling-circuits
  type: label
  module_quiz: true
  topic: Falling objects
  stem: 'This force diagram is for a package falling with linear drag. Name the numbered arrows.'
  image: {src: images/de-m3-falling-forces-blank.svg, alt: 'A package with a thick arrow pointing up from its top, a longer thick arrow pointing down from its bottom, a dashed arrow beside it pointing down, and a thin downward axis arrow on the left.'}
  labels:
    - {x: 48.3, y: 25, text: Drag force}
    - {x: 48.3, y: 77.5, text: Weight}
    - {x: 70, y: 51.25, text: Velocity}
    - {x: 15, y: 55, text: Positive direction}
  distractors: [Normal force, Tension]
  explanation: |-
    Drag (1) opposes the motion, so it points up while the package falls. Weight (2) always points down. The dashed arrow (3) is the velocity, downward, and the axis (4) shows the chosen positive direction, down, which gives $mv' = mg - \gamma v$. Nothing touches the package from below or pulls on a rope, so there is no normal force or tension.
- id: de-m3-r2-q12
  lesson: de-falling-circuits
  type: label
  topic: RL and RC circuits
  stem: 'Name the numbered components in these two series circuits.'
  image: {src: images/de-m3-circuits-blank.svg, alt: 'Two series circuits. The left one has a battery, a switch, a zigzag and a coil. The right one has a battery, a switch, a zigzag and two parallel plates.'}
  labels:
    - {x: 14.7, y: 55.1, text: Battery}
    - {x: 16.2, y: 15.9, text: Switch}
    - {x: 36.8, y: 55.1, text: Inductor}
    - {x: 79.4, y: 17.4, text: Resistor}
    - {x: 85.3, y: 55.1, text: Capacitor}
  distractors: [Diode, Ammeter]
  explanation: |-
    The long and short plates are a battery (1); the hinged line is a switch (2). A coil is an inductor (3), a zigzag is a resistor (4), and two parallel plates are a capacitor (5). So the left circuit is RL and the right one is RC.
- id: de-m3-r2-q13
  lesson: de-falling-circuits
  type: match
  topic: RL and RC circuits
  stem: 'Match each component to its voltage drop in a series circuit ($I$ is current, $q$ is charge).'
  pairs:
    - [Resistor, R times I]
    - [Inductor, L times dI/dt]
    - [Capacitor, q divided by C]
  distractors: [C times q, R times dI/dt]
  explanation: |-
    The drops are $RI$ (Ohm's law), $L\,dI/dt$ and $q/C$. Kirchhoff's voltage law sets their sum equal to the source voltage. A common slip is writing $Cq$ for the capacitor.
- id: de-m3-r2-q14
  lesson: de-falling-circuits
  topic: RL and RC circuits
  stem: 'Each system starts at rest or uncharged, and the force or battery voltage is constant. Which quantities level off at a nonzero steady value? Select all that apply.'
  choices:
    - 'The velocity of a falling object with linear drag'
    - 'The current in an RC circuit'
    - 'The current in an RL circuit'
    - 'The charge on the capacitor in an RC circuit'
  answer: [0, 2, 3]
  explanation: |-
    Velocity approaches $v_T = mg/\gamma$, the RL current approaches $E/R$, and the capacitor charge approaches $CE$. The RC current is $I = q' = \dfrac{E}{R}e^{-t/(RC)}$: it starts at $E/R$ and decays to 0 as the capacitor fills.
- id: de-m3-r2-q15
  lesson: de-falling-circuits
  type: text
  topic: RL and RC circuits
  stem: 'An RC circuit has $R = 50$ Ω and $C = 0.002$ F. Its time constant is ___ seconds. Give only the number.'
  accept: ['0.1']
  explanation: |-
    The time constant of an RC circuit is $RC = 50 \times 0.002 = 0.1$ s. After that time a charging capacitor holds about 63% of its final charge.
# ---- Honors: quadratic drag (13h1)
- id: de-m3-r2-h01
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'A 60 kg skydiver falls with drag $0.24v^2$ newtons. What is the terminal velocity? (Use $g = 9.8$ m/s².)'
  choices: ['about 15.8 m/s', 'about 49.5 m/s', '2450 m/s', 'about 0.020 m/s']
  answer: 1
  explanation: |-
    At terminal velocity $kv_T^2 = mg$, so $v_T = \sqrt{mg/k} = \sqrt{588/0.24} = \sqrt{2450} \approx 49.5$ m/s. 2450 forgets the square root, 15.8 forgets $g$, and 0.020 is $\sqrt{k/(mg)}$, upside down.
- id: de-m3-r2-h02
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'A dust grain 10 µm across falls through air at 3 mm/s. Taking $\rho = 1.2$ kg/m³ and $\mu = 1.8 \times 10^{-5}$ Pa·s, which is right?'
  choices: ['$\text{Re} \approx 2000$, so quadratic drag', '$\text{Re} \approx 2000$, so linear drag', '$\text{Re} \approx 0.002$, so linear (Stokes) drag', '$\text{Re} \approx 0.002$, so quadratic drag']
  answer: 2
  explanation: |-
    $\text{Re} = \dfrac{\rho vD}{\mu} = \dfrac{1.2(0.003)(10^{-5})}{1.8 \times 10^{-5}} = 0.002$, far below 1, so viscosity dominates and drag is proportional to speed. Getting 2000 usually comes from leaving $D$ in micrometers or $v$ in mm/s.
- id: de-m3-r2-h03
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'After separating $\dfrac{dv}{dt} = g\left(1 - \dfrac{v^2}{v_T^2}\right)$, which technique integrates $\displaystyle\int \frac{du}{1 - u^2}$ (with $u = v/v_T$)?'
  choices: ['An integrating factor', 'Integration by parts', 'The substitution $u = \tan\theta$', 'Partial fractions']
  answer: 3
  explanation: |-
    $1 - u^2 = (1 - u)(1 + u)$, so $\dfrac{1}{1 - u^2} = \dfrac12\left(\dfrac{1}{1 - u} + \dfrac{1}{1 + u}\right)$, which integrates to $\tfrac12\ln\dfrac{1 + u}{1 - u}$. The equation is nonlinear, so an integrating factor doesn't apply; $u = \tan\theta$ suits $1 + u^2$, the rising case.
- id: de-m3-r2-h04
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'The skydiver of Example 1 has $v_T \approx 53.9$ m/s. About how far does she fall in the first 5 seconds?'
  choices: ['about 109 m', 'about 123 m', 'about 194 m', 'about 269 m']
  answer: 0
  explanation: |-
    $x = \dfrac{v_T^2}{g}\ln\cosh\dfrac{gt}{v_T} = 296.3\ln\cosh(0.909) \approx 108.6$ m. 123 m is free fall ($\tfrac12 g t^2$), 194 m multiplies the speed at 5 s by 5 s, and 269 m assumes she falls at $v_T$ from the start.
- id: de-m3-r2-h05
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'An object with terminal velocity 40 m/s (quadratic drag) is dropped from rest. How fast is it moving after falling 50 m?'
  choices: ['about 31.3 m/s', 'about 22.0 m/s', 'about 27.1 m/s', 'about 40.0 m/s']
  answer: 2
  explanation: |-
    $v^2 = v_T^2\left(1 - e^{-2gx/v_T^2}\right) = 1600\left(1 - e^{-980/1600}\right) \approx 1600(0.458) \approx 733$, so $v \approx 27.1$ m/s. 31.3 m/s is the no-drag speed $\sqrt{2gx}$; 40 m/s is never quite reached.
- id: de-m3-r2-h06
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'A ball with terminal velocity 30 m/s is thrown straight up at 20 m/s. How long does it take to reach the top?'
  choices: ['about 2.04 s', 'about 1.80 s', 'about 2.46 s', 'about 0.59 s']
  answer: 1
  explanation: |-
    $t_{\text{top}} = \dfrac{v_T}{g}\tan^{-1}\dfrac{v_0}{v_T} = \dfrac{30}{9.8}\tan^{-1}(0.667) \approx 3.061(0.588) \approx 1.80$ s, with the angle in radians. 2.04 s is the no-drag time $v_0/g$; 2.46 s uses $\tanh^{-1}$ (the falling formula); 0.59 s forgets the factor $v_T/g$.
- id: de-m3-r2-h07
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'For the same ball (terminal velocity 30 m/s, thrown up at 20 m/s), what is the maximum height?'
  choices: ['about 20.4 m', 'about 23.5 m', 'about 8.4 m', 'about 16.9 m']
  answer: 3
  explanation: |-
    $H = \dfrac{v_T^2}{2g}\ln\left(1 + \dfrac{v_0^2}{v_T^2}\right) = \dfrac{900}{19.6}\ln\left(1 + \dfrac49\right) \approx 45.92(0.368) \approx 16.9$ m. 20.4 m is the no-drag height; 23.5 m uses $v_0/v_T$ instead of its square; 8.4 m halves the correct answer.
- id: de-m3-r2-h08
  lesson: de-m3-h-quadratic-drag
  type: text
  topic: Quadratic drag
  stem: 'A ball with terminal velocity 40 m/s (quadratic drag) is thrown straight up at 30 m/s. It lands back at the launch point at ___ m/s. Give only the number.'
  accept: ['24']
  explanation: |-
    $v_{\text{ret}} = \dfrac{v_0v_T}{\sqrt{v_0^2 + v_T^2}} = \dfrac{30 \times 40}{\sqrt{900 + 1600}} = \dfrac{1200}{50} = 24$ m/s, slower than both the launch speed and the terminal velocity.
- id: de-m3-r2-h09
  lesson: de-m3-h-quadratic-drag
  type: order
  topic: Quadratic drag
  stem: 'Put the steps of deriving the velocity of an object falling from rest with quadratic drag in order.'
  items:
    - 'Write Newton''s second law: $mv'' = mg - kv^2$'
    - 'Separate: $\dfrac{dv}{1 - v^2/v_T^2} = g\,dt$'
    - 'Integrate the left side with partial fractions'
    - 'Use $v(0) = 0$ to find that the constant is 0'
    - 'Solve for $v$: $v = v_T\tanh(gt/v_T)$'
  explanation: |-
    The model comes first, separating needs the equation, the integral produces the constant, the initial condition fixes it, and only then can you solve the logarithm equation for $v$.
- id: de-m3-r2-h10
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'A ball is thrown straight up and falls back down, with quadratic drag. Which statements are true? Select all that apply.'
  choices:
    - 'One equation, $mv'' = -mg - kv^2$, describes the whole flight'
    - 'While it rises, drag points down'
    - 'It lands more slowly than it was thrown'
    - 'The fall takes longer than the rise'
    - 'It reaches the same height as it would without drag'
  answer: [1, 2, 3]
  explanation: |-
    Drag opposes motion, so it points down on the way up and up on the way down; that's why $mv' = -mg - kv^2$ only holds while rising (the full law is $-kv|v|$). Air removes energy on both legs, so the ball rises less high than without drag and lands slower. On the way down drag works against gravity, so the descent is slower than the climb (2.83 s vs 2.63 s in the lesson's example).
- id: de-m3-r2-h11
  lesson: de-m3-h-quadratic-drag
  type: match
  topic: Quadratic drag
  stem: 'Match each formula (quadratic drag) to what it gives.'
  pairs:
    - ['$v_T\tanh(gt/v_T)$', 'Velocity when falling from rest']
    - ['$\dfrac{v_T^2}{g}\ln\cosh(gt/v_T)$', 'Distance fallen from rest']
    - ['$\dfrac{v_T^2}{2g}\ln\left(1 + \dfrac{v_0^2}{v_T^2}\right)$', 'Maximum height of an upward throw']
    - ['$\dfrac{v_0v_T}{\sqrt{v_0^2 + v_T^2}}$', 'Landing speed after an upward throw']
  distractors: [Time to reach the top]
  explanation: |-
    Differentiating the distance formula gives the tanh velocity. The height formula comes from $v\,dv/dy$ with $w = v^2$, and the landing speed combines that height with the falling speed-distance formula. The time to the top is $\dfrac{v_T}{g}\tan^{-1}\dfrac{v_0}{v_T}$, which is not listed.
- id: de-m3-r2-h12
  lesson: de-m3-h-quadratic-drag
  type: text
  topic: Quadratic drag
  stem: 'The dimensionless quantity $\rho vD/\mu$, which tells you whether linear or quadratic drag is the better model, is called the ___ number.'
  accept: [Reynolds, Reynolds', Reynold's, Reynold, Reynolds number]
  explanation: |-
    The Reynolds number compares inertial effects (pushing air aside) with viscous effects (the air's stickiness). Below about 1, drag is roughly linear in speed; above about 1,000, it is roughly quadratic.
- id: de-m3-r2-h13
  lesson: de-m3-h-quadratic-drag
  topic: Quadratic drag
  stem: 'Two models of the same object have the same terminal velocity, one with linear drag and one with quadratic drag. Starting from rest, which gets close to terminal velocity sooner, and why?'
  choices: ['Linear, because its drag grows faster at low speed, so it settles sooner', 'Quadratic, because below $v_T$ its drag force is smaller, so the object speeds up faster', 'Neither: both reach $v_T$ at the same time, since they share $v_T$', 'Quadratic, because its drag force is larger at every speed']
  answer: 1
  explanation: |-
    With the same $v_T$, linear drag is $mg(v/v_T)$ and quadratic drag is $mg(v/v_T)^2$, which is smaller whenever $v < v_T$. Less drag means faster acceleration, so the quadratic model reaches, say, 96% of $v_T$ sooner (about 5 s versus 8 s for the 24.5 m/s package). Neither model reaches $v_T$ exactly in finite time.
# ---- Honors: drug dosing (13h2)
- id: de-m3-r2-h14
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'A drug has clearance 5 L/h and volume of distribution 50 L. What is its half-life?'
  choices: ['about 6.93 h', 'about 3.47 h', '10 h', 'about 0.069 h']
  answer: 0
  explanation: |-
    $k = \text{CL}/V = 0.1$ per hour, so $t_{1/2} = \ln 2/k \approx 6.93$ h. 10 h is $1/k$ (the time constant, not the half-life); 3.47 h multiplies the clearance by $\ln 2$ instead of dividing $\ln 2$ by $k$; 0.069 multiplies $k$ by $\ln 2$.
- id: de-m3-r2-h15
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'After a 480 mg IV bolus, blood levels are 12 mg/L at 1 h and 3 mg/L at 5 h. What is the volume of distribution?'
  choices: ['about 28.3 L', '40 L', '20 L', '160 L']
  answer: 0
  explanation: |-
    The level fell by a factor 4 (two halvings) in 4 h, so $t_{1/2} = 2$ h. Going back 1 h, half a half-life, multiplies by $\sqrt2$: $C(0) \approx 16.97$ mg/L. Then $V = 480/16.97 \approx 28.3$ L. 40 L divides by the 1-hour level as if it were $C(0)$; 20 L doubles back a full half-life; 160 L uses the 5-hour level.
- id: de-m3-r2-h16
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'A drug with clearance 4 L/h and volume of distribution 25 L is infused at 50 mg/h. What steady-state concentration does it approach?'
  choices: ['200 mg/L', '2 mg/L', '0.08 mg/L', '12.5 mg/L']
  answer: 3
  explanation: |-
    At steady state elimination equals input: $\text{CL}\cdot C_{ss} = R_0$, so $C_{ss} = 50/4 = 12.5$ mg/L. Dividing by $V$ instead (2 mg/L) leaves out $k$; 200 multiplies, and 0.08 inverts the ratio. $V$ affects how long it takes, not the level.
- id: de-m3-r2-h17
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'A constant infusion is running at twice its original rate (from the start). Compared with the original, what happens?'
  choices: ['The steady level doubles and is reached in the same time', 'The steady level is the same but is reached twice as fast', 'The steady level doubles and is reached twice as fast', 'The steady level and the time to reach it both stay the same']
  answer: 0
  explanation: |-
    $C(t) = \dfrac{R_0}{\text{CL}}(1 - e^{-kt})$: doubling $R_0$ doubles every value, including $C_{ss}$, but the factor $1 - e^{-kt}$, which sets how quickly the fraction of the plateau is reached, depends only on $k$. Only a loading dose reaches the plateau sooner.
- id: de-m3-r2-h18
  lesson: de-m3-h-drug-dosing
  type: text
  topic: Pharmacokinetics
  stem: 'A constant infusion starts with no drug in the body. After 3 half-lives the concentration has reached ___ % of its steady-state value. Give only the number.'
  accept: ['87.5']
  explanation: |-
    The fraction reached is $1 - e^{-kt} = 1 - 2^{-n}$ after $n$ half-lives: $1 - \tfrac18 = 0.875$, or 87.5%.
- id: de-m3-r2-h19
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'A drug has $V = 60$ L and $t_{1/2} = 6$ h. What IV loading dose brings the level straight to a target of 15 mg/L?'
  choices: ['about 104 mg', '4 mg', '900 mg', '450 mg']
  answer: 2
  explanation: |-
    The bolus must put $C_{ss}V = 15 \times 60 = 900$ mg in the body. About 104 mg is $C_{ss}\cdot\text{CL}$ (with $\text{CL} = kV \approx 6.93$ L/h), the hourly maintenance rate, not the loading dose. 4 mg divides $V$ by the target, and 450 mg is only half the amount needed.
- id: de-m3-r2-h20
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'Each dose of a drug raises the blood level by 8 mg/L, and doses are given every two half-lives. What are the steady-state peak and trough?'
  choices: ['Peak 16 mg/L, trough 8 mg/L', 'Peak 8 mg/L, trough 2 mg/L', 'Peak 32 mg/L, trough 8 mg/L', 'Peak about 10.7 mg/L, trough about 2.7 mg/L']
  answer: 3
  explanation: |-
    Two half-lives give $r = \tfrac14$. Peak $= \dfrac{8}{1 - 1/4} \approx 10.7$ mg/L and trough $= \tfrac14$ of that $\approx 2.7$ mg/L; their difference is the 8 mg/L each dose adds. 16 and 8 use $r = \tfrac12$; 8 and 2 ignore accumulation; 32 divides by $r$ instead of $1 - r$.
- id: de-m3-r2-h21
  lesson: de-m3-h-drug-dosing
  type: text
  topic: Pharmacokinetics
  stem: 'A drug is given every two half-lives. Its accumulation factor $\dfrac{1}{1 - r}$ is ___. Give an exact fraction.'
  accept: ['4/3', '1 1/3']
  explanation: |-
    Two half-lives leave $r = \tfrac14$, so $\dfrac{1}{1 - 1/4} = \dfrac43$: the steady-state peak is only a third higher than the first peak. Dosing more often (smaller interval, $r$ closer to 1) gives more accumulation.
- id: de-m3-r2-h22
  lesson: de-m3-h-drug-dosing
  type: order
  topic: Pharmacokinetics
  stem: 'Put the stages of a tablet''s journey through the compartment model in order.'
  items:
    - 'The tablet dissolves in the gut'
    - 'Drug is absorbed from the gut into the blood'
    - 'Drug is spread through the blood and tissues (volume V)'
    - 'Drug is eliminated by the liver and kidneys'
  explanation: |-
    The oral model is two compartments in series: gut, then body. Drug must be dissolved before it can be absorbed, absorbed before it reaches the body compartment, and in the body before it can be eliminated from it.
- id: de-m3-r2-h23
  lesson: de-m3-h-drug-dosing
  type: match
  topic: Pharmacokinetics
  stem: 'Match each term to its meaning.'
  pairs:
    - [Bioavailability, Fraction of an oral dose that reaches the circulation]
    - [Clearance, Volume of blood cleared of drug per unit time]
    - [Volume of distribution, Apparent volume linking amount and concentration]
    - [Loading dose, Large first dose that reaches the target level at once]
  distractors: [Time for the concentration to fall by half]
  explanation: |-
    $F$ is bioavailability; $\text{CL} = kV$ is clearance; $V$ in $C = X/V$ is the volume of distribution; a loading dose of $C_{ss}V$ starts at the target. The time for the concentration to halve is the half-life.
- id: de-m3-r2-h24
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'For a drug given repeatedly, the average steady-state level is $\dfrac{D}{\text{CL}\cdot\tau}$. Which changes would raise it? Select all that apply.'
  choices:
    - 'A larger dose $D$'
    - 'A shorter dosing interval $\tau$'
    - 'Giving a loading dose at the start'
    - 'A lower clearance (for example, reduced kidney function)'
  answer: [0, 1, 3]
  explanation: |-
    The average rises with $D$ and falls with $\text{CL}$ and $\tau$. A loading dose only gets the patient to steady state sooner; the steady state itself is set by the maintenance doses.
- id: de-m3-r2-h25
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'An oral drug has absorption rate constant $k_a = 0.9$ per hour and elimination rate constant $k = 0.3$ per hour. When does the blood level peak?'
  choices: ['about 0.92 h', 'about 1.67 h', 'about 1.83 h', 'about 2.31 h']
  answer: 2
  explanation: |-
    $t_{\max} = \dfrac{\ln(k_a/k)}{k_a - k} = \dfrac{\ln 3}{0.6} \approx 1.83$ h. 1.67 h is $1/(k_a - k)$ without the log; 0.92 h divides by $k_a + k$; 2.31 h is the elimination half-life.
- id: de-m3-r2-h26
  lesson: de-m3-h-drug-dosing
  topic: Pharmacokinetics
  stem: 'If $k_a = k = 0.25$ per hour, the amount in the body is $X = FDk\,te^{-kt}$. When does it peak?'
  choices: ['at about 2.77 h', 'at 4 h', 'at $t = 0$', 'it never peaks']
  answer: 1
  explanation: |-
    $X' = FDk\,e^{-kt}(1 - kt) = 0$ at $t = 1/k = 4$ h, the same calculation as tank B in Lesson 12 (peak at $t = 20$ min when $k = 1/20$). 2.77 h is the half-life $\ln 2/k$.
