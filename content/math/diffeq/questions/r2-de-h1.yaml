# Honors module de-h1 (round 2): nonlinear dynamics and chaos
# Lesson 90: limit cycles
- id: de-h1-r2-h01
  lesson: de-h1-limit-cycles
  module_quiz: true
  topic: Limit cycles
  stem: 'What distinguishes a limit cycle from the closed orbits around a linear center?'
  choices: ['A limit cycle is isolated: nearby trajectories are not closed and spiral toward or away from it', 'A limit cycle always has period $2\pi$', 'A limit cycle surrounds no equilibrium point', 'A limit cycle can only occur in three or more dimensions']
  answer: 0
  explanation: |-
    A limit cycle is an isolated closed orbit. Around a linear center every nearby trajectory is also closed, so none of them is isolated. The period can be anything; in the plane a closed orbit must enclose an equilibrium; and limit cycles are common in the plane (Van der Pol).
- id: de-h1-r2-h02
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'Why can''t a linear system $\mathbf{x}'' = A\mathbf{x}$ have a limit cycle?'
  choices: ['Because its equilibria are always saddles', 'Because if $\mathbf{x}(t)$ is a periodic solution, so is $c\,\mathbf{x}(t)$ for every constant $c$, so its closed orbits are never isolated', 'Because linear systems have no periodic solutions at all', 'Because the trace of $A$ is always zero']
  answer: 1
  explanation: |-
    Linear systems obey superposition: $c\,\mathbf{x}(t)$ solves the system whenever $\mathbf{x}(t)$ does, and it has the same period. So a closed orbit comes with a whole family of scaled copies. Linear centers do have periodic solutions, and neither the trace nor the type of equilibrium is forced.
- id: de-h1-r2-h03
  lesson: de-h1-limit-cycles
  module_quiz: true
  topic: Limit cycles
  stem: 'A system in polar form is $r'' = r(4 - r^2)$, $\theta'' = 1$. What happens to a trajectory starting at $r = 0.5$?'
  choices: ['It spirals into the origin', 'It stays on the circle $r = 0.5$', 'It spirals out to the stable limit cycle $r = 2$', 'It spirals out to the stable limit cycle $r = 4$']
  answer: 2
  explanation: |-
    The zeros of $r(4 - r^2)$ with $r \ge 0$ are $r = 0$ and $r = 2$. For $0 < r < 2$, $r'' > 0$ (the radius grows) and for $r > 2$, $r'' < 0$. So $r = 2$ is a stable limit cycle and the trajectory spirals out to it. The value 4 is $r^2$ on the cycle, not $r$.
- id: de-h1-r2-h04
  lesson: de-h1-limit-cycles
  type: text
  topic: Limit cycles
  stem: 'For $r'' = r(r - 1)(r - 3)$, $\theta'' = 1$, the stable limit cycle has radius ___ and the unstable limit cycle has radius ___.'
  accept:
    - ['1']
    - ['3']
  explanation: |-
    Signs of $r(r - 1)(r - 3)$: for $0 < r < 1$, $(+)(-)(-) > 0$, so $r$ grows; for $1 < r < 3$, $(+)(+)(-) < 0$, so $r$ shrinks; for $r > 3$ it is positive. Trajectories on both sides move toward $r = 1$ (stable) and away from $r = 3$ (unstable).
- id: de-h1-r2-h05
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'Bendixson''s criterion shows that which of these systems has no closed orbits anywhere in the plane?'
  choices: ['$x'' = y$, $y'' = -x$', '$x'' = x - y - x^3$, $y'' = x + y - y^3$', '$x'' = y$, $y'' = -x + (1 - x^2)y$', '$x'' = -x + y^2$, $y'' = -2y + x^2$']
  answer: 3
  explanation: |-
    For $x' = -x + y^2$, $y' = -2y + x^2$ the divergence is $-1 - 2 = -3 < 0$ everywhere, so there are no closed orbits. The first has divergence 0 (it is a center, full of closed orbits); the second has divergence $2 - 3x^2 - 3y^2$, which changes sign (and it does have a limit cycle); Van der Pol's divergence $1 - x^2$ changes sign too.
- id: de-h1-r2-h06
  lesson: de-h1-limit-cycles
  module_quiz: true
  topic: Limit cycles
  stem: 'To conclude from the Poincaré–Bendixson theorem that a region $R$ of the plane contains a closed orbit, which of these must you know? Select all that apply.'
  choices: ['$R$ is closed and bounded', '$R$ has no holes in it', '$R$ contains no equilibrium points', 'Some trajectory that starts in $R$ stays in $R$ for all $t \ge 0$', 'The system is linear']
  answer: [0, 2, 3]
  explanation: |-
    The theorem needs a closed, bounded region with no equilibria that traps at least one trajectory forward in time. Holes are allowed; in fact the usual trapping region is an annulus with a hole around an equilibrium. Linear systems never have limit cycles, so linearity is not a hypothesis.
- id: de-h1-r2-h07
  lesson: de-h1-limit-cycles
  module_quiz: true
  type: label
  topic: Limit cycles
  stem: 'This picture shows the trapping-region argument for the Poincaré–Bendixson theorem. Name the numbered parts.'
  image: {src: images/de-h1-trapping-annulus-blank.svg, alt: 'A shaded ring between a dashed inner circle and a solid outer circle. Arrows on the outer circle point inward and arrows on the inner circle point outward. A point sits at the center, a thick closed curve lies inside the ring, and dashed spirals approach it. Four parts are numbered.'}
  labels:
    - {x: 50, y: 51, text: Equilibrium (a source)}
    - {x: 50, y: 63.4, text: 'Inner boundary: flow points out'}
    - {x: 21.6, y: 51, text: Limit cycle}
    - {x: 78.2, y: 79.2, text: 'Outer boundary: flow points in'}
  distractors: [Saddle point, Unstable limit cycle]
  explanation: |-
    The equilibrium at the center is a source, cut out by the small inner circle, where the flow points outward. On the outer circle the flow points inward. The shaded ring between them traps trajectories and has no equilibria, so it contains a closed orbit, the thick curve, which the dashed trajectories approach from both sides (so it is stable, not unstable).
- id: de-h1-r2-h08
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'For $x'' = x - y - x^3$, $y'' = x + y - y^3$ we found $r^2 - r^4 \le rr'' \le r^2 - \tfrac12 r^4$, and the origin is the only equilibrium. Which annulus is guaranteed to be a trapping region?'
  choices: ['$0.5 \le r \le 1.2$', '$0.9 \le r \le 1.5$', '$1.1 \le r \le 2$', '$0 \le r \le 2$']
  answer: 1
  explanation: |-
    The flow points outward on circles with $r < 1$ and inward on circles with $r > \sqrt2 \approx 1.414$. So the inner radius must be below 1 and the outer above $\sqrt2$: $0.9 \le r \le 1.5$ works. On $r = 1.2$ the bounds don't force inward flow; at $r = 1.1$ they don't force outward flow; and the disk $0 \le r \le 2$ contains the equilibrium.
- id: de-h1-r2-h09
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'In the Van der Pol equation $x'''' - \mu(1 - x^2)x'' + x = 0$ with $\mu > 0$, why do small oscillations grow?'
  choices: ['The spring force $x$ is too weak near the origin', 'The equation is linear for small $x$, so solutions grow exponentially', 'The forcing term $\mu$ adds energy at the natural frequency', 'The damping coefficient $-\mu(1 - x^2)$ is negative when $|x| < 1$, so energy is pumped in']
  answer: 3
  explanation: |-
    Compared with $x'' + cx' + x = 0$, the damping coefficient is $c = -\mu(1 - x^2)$, negative for $|x| < 1$ (energy in) and positive for $|x| > 1$ (energy out). There is no external forcing; the linearization at the origin is an unstable spiral or node because its trace is $\mu > 0$.
- id: de-h1-r2-h10
  lesson: de-h1-limit-cycles
  type: match
  topic: Limit cycles
  stem: 'Match each kind of closed orbit to how nearby trajectories behave.'
  pairs:
    - [Closed orbit of a linear center, 'Nearby trajectories are closed too, none isolated']
    - [Stable limit cycle, Nearby trajectories spiral toward it from both sides]
    - [Unstable limit cycle, Nearby trajectories spiral away from it on both sides]
    - [Semistable limit cycle, Approached from one side and left from the other]
  distractors: [Nearby trajectories approach an equilibrium point]
  explanation: |-
    A center's orbits form a continuous family, so none is isolated. Limit cycles are isolated, and they are classified by what neighbors do: stable (attract on both sides), unstable (repel on both sides) or semistable (one of each).
- id: de-h1-r2-h11
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'The proof of Bendixson''s criterion applies Green''s theorem around a supposed closed orbit $C$. Which fact makes $\oint_C (F\,dy - G\,dx) = 0$?'
  choices: ['Along $C$, the direction $(dx, dy)$ is parallel to $(F, G)$, so $F\,dy - G\,dx = 0$ at every point', 'The divergence is zero on $C$', '$F$ and $G$ are zero on $C$', 'The region inside $C$ contains no equilibrium']
  answer: 0
  explanation: |-
    On a trajectory, $(dx, dy) = (F, G)\,dt$, so $F\,dy - G\,dx = (FG - GF)\,dt = 0$. Green's theorem turns the zero line integral into $\iint (F_x + G_y)\,dA = 0$, impossible if the divergence keeps one sign. $F$ and $G$ vanish only at equilibria, and the inside of a closed orbit must contain one.
- id: de-h1-r2-h12
  lesson: de-h1-limit-cycles
  module_quiz: true
  type: text
  topic: Limit cycles
  stem: 'For the Van der Pol equation $x'''' - \mu(1 - x^2)x'' + x = 0$, numerical solutions show that the limit cycle reaches a maximum $x$ of about ___ for every $\mu > 0$. (Give one number.)'
  accept: ['2', '2.0']
  explanation: |-
    The Van der Pol limit cycle has amplitude close to 2 for all $\mu > 0$ (about 2.00 for small $\mu$ and about 2.01–2.02 for larger $\mu$). What changes with $\mu$ is the shape (near-circle for small $\mu$, relaxation oscillation for large $\mu$) and the period.
- id: de-h1-r2-h13
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'For a planar system, the divergence $F_x + G_y$ is positive in some places and negative in others. What does Bendixson''s criterion say?'
  choices: ['There must be a limit cycle', 'There are no closed orbits', 'Nothing: the criterion can only rule closed orbits out, and here it doesn''t apply', 'There is exactly one closed orbit, where the divergence is zero']
  answer: 2
  explanation: |-
    The criterion is one-way: a divergence of one sign rules closed orbits out. A divergence that changes sign proves nothing either way (a closed orbit may or may not exist), and closed orbits don't have to lie on the curve where the divergence is zero.
- id: de-h1-r2-h14
  lesson: de-h1-limit-cycles
  type: order
  topic: Limit cycles
  stem: 'Put the steps of the polar analysis of $x'' = x - y - x(x^2 + y^2)$, $y'' = x + y - y(x^2 + y^2)$ in order.'
  items: ['Compute $rr'' = xx'' + yy'' = r^2 - r^4$', 'Simplify to $r'' = r(1 - r^2)$', 'Find the zeros $r = 0$ and $r = 1$', 'Read the sign of $r''$ on each side of $r = 1$', 'Conclude that $r = 1$ is a stable limit cycle']
  explanation: |-
    The polar identity gives the radial equation, which simplifies to a one-dimensional autonomous equation. Its zeros must be found before the signs between them can be read, and the signs ($r' > 0$ inside, $r' < 0$ outside) show the circle attracts from both sides.
- id: de-h1-r2-h15
  lesson: de-h1-limit-cycles
  topic: Limit cycles
  stem: 'Which statement about closed orbits of a planar autonomous system is true?'
  choices: ['A closed orbit can lie in a region with no equilibria inside the orbit', 'Every closed orbit is a limit cycle', 'A closed orbit must enclose at least one equilibrium point', 'Two different closed orbits can cross each other']
  answer: 2
  explanation: |-
    Index theory shows that the region inside a closed orbit in the plane contains at least one equilibrium. Not every closed orbit is a limit cycle (centers), and no two trajectories can cross, by uniqueness.
# Lesson 91: Hopf bifurcation
- id: de-h1-r2-h16
  lesson: de-h1-hopf
  module_quiz: true
  topic: Hopf bifurcation
  stem: 'An equilibrium''s Jacobian has trace $T(\mu)$ and determinant $D(\mu)$. Which condition signals a Hopf bifurcation at $\mu_0$?'
  choices: ['$D(\mu_0) = 0$ and $T(\mu_0) < 0$', '$T(\mu_0) = 0$ and $D(\mu_0) > 0$, with $T$ changing sign as $\mu$ passes $\mu_0$', '$T(\mu_0) = 0$ and $D(\mu_0) < 0$', '$T(\mu_0)^2 = 4D(\mu_0)$']
  answer: 1
  explanation: |-
    A Hopf bifurcation happens when a complex pair $\alpha \pm i\omega$ crosses the imaginary axis: the real part $T/2$ passes through 0 while $D = \omega^2 > 0$. $D = 0$ means a real eigenvalue at 0 (saddle-node type); $T = 0$ with $D < 0$ is a saddle; $T^2 = 4D$ is the node/spiral boundary, not a change of stability.
- id: de-h1-r2-h17
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'For $r'' = \mu r - r^3$, $\theta'' = 3$ with $\mu = 0.16$, what are the radius and period of the limit cycle?'
  choices: ['Radius $0.16$, period $2\pi/3$', 'Radius $0.4$, period $6\pi$', 'Radius $0.4$, period $2\pi/3$', 'Radius $0.0256$, period $2\pi$']
  answer: 2
  explanation: |-
    The cycle is where $\mu - r^2 = 0$: $r = \sqrt{0.16} = 0.4$. The angle grows at 3 radians per unit time, so one turn takes $2\pi/3 \approx 2.09$. Using $\mu$ itself as the radius, or $2\pi \cdot 3$, are the common slips.
- id: de-h1-r2-h18
  lesson: de-h1-hopf
  module_quiz: true
  type: text
  topic: Hopf bifurcation
  stem: 'For the Brusselator $x'' = 1 - (b + 1)x + ax^2y$, $y'' = bx - ax^2y$ with $a = 4$, the Hopf bifurcation occurs at $b =$ ___, and the newborn oscillation has period about ___ (to 2 decimal places).'
  accept:
    - ['5']
    - ['3.14']
  explanation: |-
    At the equilibrium $(1, b/a)$, $T = b - 1 - a$ and $D = a$. $T = 0$ gives $b = 1 + a = 5$. The eigenvalues there are $\pm i\sqrt a = \pm 2i$, so the period is about $2\pi/2 = \pi \approx 3.14$.
- id: de-h1-r2-h19
  lesson: de-h1-hopf
  module_quiz: true
  topic: Hopf bifurcation
  stem: 'Which statements describe a supercritical Hopf bifurcation at $\mu = \mu_0$? Select all that apply.'
  choices: ['The new limit cycle is stable', 'The cycle''s size grows like $\sqrt{\mu - \mu_0}$', 'Near onset the period is close to $2\pi/\omega_0$, where $\pm i\omega_0$ are the eigenvalues at $\mu_0$', 'The oscillation appears suddenly with a large amplitude', 'It happens when the determinant of the Jacobian passes through 0']
  answer: [0, 1, 2]
  explanation: |-
    In the supercritical case a small stable cycle is born with zero size and grows like the square root of the distance past the bifurcation, with period near $2\pi/\omega_0$. A sudden large oscillation is the subcritical signature, and a determinant through 0 signals a real eigenvalue at 0, not a Hopf bifurcation.
- id: de-h1-r2-h20
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'For the subcritical model $r'' = r(\mu + r^2 - r^4)$ at $\mu = -0.1$, the limit cycles have radii about $0.336$ (unstable) and $0.942$ (stable). Where does a trajectory starting at $r = 0.5$ end up?'
  choices: ['On the large stable cycle $r \approx 0.942$', 'At the origin', 'On the cycle $r \approx 0.336$', 'It goes off to infinity']
  answer: 0
  explanation: |-
    Between the cycles, $\mu + r^2 - r^4 > 0$ (for example at $r = 0.5$: $-0.1 + 0.25 - 0.0625 = 0.0875$), so $r$ grows until it reaches the stable cycle. Only trajectories starting inside the unstable cycle at $0.336$ decay to the origin, and none can settle on the unstable cycle itself.
- id: de-h1-r2-h21
  lesson: de-h1-hopf
  type: match
  topic: Hopf bifurcation
  stem: 'Match each event to the bifurcation it describes.'
  pairs:
    - ['A real eigenvalue of $J$ passes through 0', 'Saddle-node, transcritical or pitchfork']
    - ['A complex pair of eigenvalues of $J$ crosses the imaginary axis', Hopf bifurcation]
    - [A small stable cycle grows from an equilibrium that just lost stability, Supercritical Hopf bifurcation]
    - [An unstable cycle shrinks onto an equilibrium that then loses stability, Subcritical Hopf bifurcation]
  distractors: [Period-doubling bifurcation]
  explanation: |-
    A real eigenvalue through 0 gives the one-dimensional bifurcations of Lesson 15; a complex pair crossing gives a Hopf bifurcation, which is supercritical when the cycle born is small and stable, subcritical when an unstable cycle collapses onto the equilibrium. Period doubling is a bifurcation of maps (Lesson 92).
- id: de-h1-r2-h22
  lesson: de-h1-hopf
  module_quiz: true
  type: label
  topic: Hopf bifurcation
  stem: 'This is the bifurcation diagram of the subcritical model $r'' = r(\mu + r^2 - r^4)$: radius $r$ against $\mu$, solid for stable and dashed for unstable. Name the numbered parts.'
  image: {src: images/de-h1-hopf-subcritical-blank.svg, alt: 'A bifurcation diagram with mu across and r up. Along the bottom, a solid line on the left becomes dashed at mu = 0. A dashed curve rises from mu = 0 leftward to a dot at mu = -1/4, where it meets a solid curve that continues rightward above r = 1. Five points are numbered.'}
  labels:
    - {x: 19.2, y: 86.4, text: Stable equilibrium}
    - {x: 77.2, y: 86.4, text: Unstable equilibrium}
    - {x: 39.9, y: 61.6, text: Unstable limit cycle}
    - {x: 77.2, y: 22.1, text: Stable limit cycle}
    - {x: 31.6, y: 45.6, text: Saddle-node bifurcation of cycles}
  distractors: [Period-doubling point]
  explanation: |-
    The equilibrium $r = 0$ is stable for $\mu < 0$ and unstable for $\mu > 0$. The dashed branch $r^2 = (1 - \sqrt{1 + 4\mu})/2$ is the unstable cycle, which shrinks onto the origin at $\mu = 0$. The solid upper branch $r^2 = (1 + \sqrt{1 + 4\mu})/2$ is the stable cycle. The two cycles meet and vanish at $\mu = -1/4$, a saddle-node bifurcation of cycles.
- id: de-h1-r2-h23
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'In the subcritical model, $\mu$ is raised slowly to $0.2$ (so the state jumps to the large cycle) and then lowered slowly. At about what value of $\mu$ does the large oscillation stop?'
  choices: ['$\mu = 0.2$', '$\mu = 0$', '$\mu = -0.1$', '$\mu = -0.25$']
  answer: 3
  explanation: |-
    The large stable cycle exists for all $\mu > -1/4$, so the oscillation persists below 0 until the stable and unstable cycles collide at $\mu = -1/4$. Then the state falls back to the origin. Because the jump up happens at 0 but the jump down at $-1/4$, the system shows hysteresis.
- id: de-h1-r2-h24
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'For $x'''' - (\mu - x^2)x'' + 4x = 0$, where is the Hopf bifurcation and about what is the period of the oscillation born there?'
  choices: ['At $\mu = 0$, period about $\pi$', 'At $\mu = 0$, period about $2\pi$', 'At $\mu = 4$, period about $\pi$', 'At $\mu = 2$, period about $\pi/2$']
  answer: 0
  explanation: |-
    As a system $x' = y$, $y' = -4x + (\mu - x^2)y$; at the origin $T = \mu$ and $D = 4$. $T = 0$ at $\mu = 0$, with eigenvalues $\pm 2i$, so the period is about $2\pi/2 = \pi$. Using $\omega = 1$ instead of $\sqrt4$ gives $2\pi$.
- id: de-h1-r2-h25
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'Why can''t the linearization at the equilibrium tell a supercritical Hopf bifurcation from a subcritical one?'
  choices: ['Because the Jacobian is not defined at the bifurcation', 'Because both cases have the same linearization, eigenvalues $\pm i\omega_0$ at the bifurcation; the nonlinear (cubic) terms decide', 'Because the linearization always predicts a subcritical case', 'Because Hopf bifurcations only happen in linear systems']
  answer: 1
  explanation: |-
    The prototypes $r' = \mu r - r^3$ and $r' = \mu r + r^3 - r^5$ have identical Jacobians at the origin, eigenvalues $\mu \pm i\omega$. Which way the cycle goes is set by the nonlinear terms, through the first Lyapunov coefficient.
- id: de-h1-r2-h26
  lesson: de-h1-hopf
  type: text
  topic: Hopf bifurcation
  stem: 'For the supercritical model $r'' = \mu r - r^3$, the radius of the limit cycle at $\mu = 0.25$ is ___.'
  accept: ['0.5', '1/2']
  explanation: |-
    The cycle is at $r = \sqrt\mu = \sqrt{0.25} = 0.5$.
- id: de-h1-r2-h27
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'At $\mu = \mu_0$ an equilibrium has $T = 0$ and $D = -3$. What kind of event is this?'
  choices: ['A Hopf bifurcation with frequency $\sqrt3$', 'A subcritical Hopf bifurcation', 'A center, so a family of closed orbits', 'Not a Hopf bifurcation: with $D < 0$ the equilibrium is a saddle on both sides']
  answer: 3
  explanation: |-
    With $D < 0$ the eigenvalues are real with opposite signs, so the equilibrium is a saddle whatever the trace. A Hopf bifurcation needs $D > 0$ at the moment $T$ passes through 0.
- id: de-h1-r2-h28
  lesson: de-h1-hopf
  topic: Hopf bifurcation
  stem: 'What does the "paradox of enrichment" say?'
  choices: ['In a predator–prey model whose predators'' feeding saturates, raising the prey''s carrying capacity can destabilize coexistence through a Hopf bifurcation, giving large population cycles', 'Adding food always stabilizes a predator–prey system', 'Lotka–Volterra cycles disappear when prey are enriched', 'Enriching an ecosystem always drives the predators extinct']
  answer: 0
  explanation: |-
    Rosenzweig (1971) showed that in such a model, enrichment pushes the coexistence equilibrium through a Hopf bifurcation into large cycles. It is a model prediction; how often it happens in real ecosystems is debated. Plain Lotka–Volterra has no carrying capacity at all.
- id: de-h1-r2-h29
  lesson: de-h1-hopf
  module_quiz: true
  type: order
  topic: Hopf bifurcation
  stem: 'In the subcritical model, $\mu$ is raised slowly from $-0.5$ to $0.2$ and then lowered back to $-0.5$. Put the events in order.'
  items: ['The state rests at the stable origin', '$\mu$ passes 0 and the origin loses stability', 'The state jumps to the large stable cycle', '$\mu$ is lowered below 0 and the large oscillation continues', 'At $\mu = -1/4$ the cycles vanish and the state falls back to the origin']
  explanation: |-
    This is the hysteresis loop: the jump up happens where the unstable cycle collapses (at 0), but the jump down waits until the large cycle itself disappears (at $-1/4$).
# Lesson 92: the logistic map
- id: de-h1-r2-h30
  lesson: de-h1-logistic-map
  module_quiz: true
  topic: Iterated maps
  stem: 'Euler''s method with step $h = 0.5$ is applied to $y'' = 2y(1 - y)$. After rescaling, the iteration is the logistic map $x_{n+1} = Rx_n(1 - x_n)$ with $R$ equal to'
  choices: ['$1$', '$2$', '$2.5$', '$0.5$']
  answer: 1
  explanation: |-
    $R = 1 + hr = 1 + 0.5 \cdot 2 = 2$. Forgetting the 1 gives 1; adding $h + r$ instead of multiplying gives 2.5; using $h$ alone gives 0.5.
- id: de-h1-r2-h31
  lesson: de-h1-logistic-map
  type: text
  topic: Iterated maps
  stem: 'For the logistic map with $R = 2.5$, the nonzero fixed point is $x^* =$ ___ and its multiplier is $f''(x^*) =$ ___.'
  accept:
    - ['0.6', '3/5']
    - ['-0.5', '-1/2']
  explanation: |-
    $x^* = 1 - 1/R = 1 - 0.4 = 0.6$, and $f'(x^*) = 2 - R = -0.5$. Its size is below 1, so the fixed point is stable, approached from alternating sides.
- id: de-h1-r2-h32
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'A fixed point $x^*$ of a map $x_{n+1} = f(x_n)$ is stable when'
  choices: ['$f''(x^*) < 0$', '$f''(x^*) > 0$', '$|f''(x^*)| < 1$', '$f(x^*) = 0$']
  answer: 2
  explanation: |-
    Errors obey $e_{n+1} \approx f'(x^*)e_n$, so they shrink exactly when $|f'(x^*)| < 1$. The sign test $f'(y^*) < 0$ is for differential equations $y' = f(y)$; for a map the sign only tells whether the approach alternates.
- id: de-h1-r2-h33
  lesson: de-h1-logistic-map
  module_quiz: true
  topic: Iterated maps
  stem: 'For which values of $R$ is the fixed point $x^* = 1 - 1/R$ of the logistic map stable? Select all that apply.'
  choices: ['$R = 0.5$', '$R = 1.5$', '$R = 2.5$', '$R = 2.9$', '$R = 3.2$']
  answer: [1, 2, 3]
  explanation: |-
    The multiplier is $2 - R$, which has size less than 1 exactly when $1 < R < 3$: true for 1.5, 2.5 and 2.9. At $R = 3.2$ it is $-1.2$ (unstable; a 2-cycle takes over). At $R = 0.5$ the multiplier is $1.5$, and the fixed point $1 - 2 = -1$ is negative anyway; the population goes to 0.
- id: de-h1-r2-h34
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'For the logistic map with $R = 1.8$, how do iterates starting near $x^* = 1 - 1/1.8$ approach it?'
  choices: ['From alternating sides, because the multiplier is negative', 'They move away, because the multiplier is greater than 1', 'They approach in a 2-cycle', 'From one side without overshooting, because the multiplier $0.2$ is between 0 and 1']
  answer: 3
  explanation: |-
    The multiplier is $2 - 1.8 = 0.2$: positive and less than 1, so each error is multiplied by about $0.2$ and keeps its sign. Alternating approach needs a multiplier between $-1$ and $0$, that is, $2 < R < 3$.
- id: de-h1-r2-h35
  lesson: de-h1-logistic-map
  type: order
  topic: Iterated maps
  stem: 'Put the moves of a cobweb diagram in order, starting from $x_0$.'
  items: ['Mark $x_0$ on the horizontal axis', 'Go vertically to the curve $y = f(x)$; the height is $x_1$', 'Go horizontally to the diagonal $y = x$', 'Go vertically to the curve again; the height is $x_2$']
  explanation: |-
    The vertical move evaluates $f$; the horizontal move to $y = x$ carries the output back to the input axis so it can be fed in again.
- id: de-h1-r2-h36
  lesson: de-h1-logistic-map
  module_quiz: true
  topic: Iterated maps
  stem: 'For the logistic map with $R = 3.2$, the iterates settle into which pattern?'
  choices: ['The fixed point $x^* = 0.6875$', 'A 2-cycle alternating between about $0.513$ and $0.799$', 'A 4-cycle', 'Chaos']
  answer: 1
  explanation: |-
    At $R = 3.2$ the fixed point $1 - 1/3.2 = 0.6875$ has multiplier $-1.2$ and is unstable. The 2-cycle $p, q = \frac{4.2 \pm \sqrt{0.84}}{6.4} \approx 0.7995, 0.5130$ has multiplier $4 + 2R - R^2 = 0.16$, so it is stable. The 4-cycle starts only at $R \approx 3.449$.
- id: de-h1-r2-h37
  lesson: de-h1-logistic-map
  type: text
  topic: Iterated maps
  stem: 'The multiplier of the logistic map''s 2-cycle is $4 + 2R - R^2$. At $R = 3.4$ it equals ___.'
  accept: ['-0.76']
  explanation: |-
    $4 + 6.8 - 11.56 = -0.76$. Its size is below 1, so the 2-cycle is still stable; it loses stability at $R = 1 + \sqrt6 \approx 3.449$, where the multiplier reaches $-1$.
- id: de-h1-r2-h38
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'What does the Feigenbaum constant $\delta \approx 4.669$ measure?'
  choices: ['The value of $R$ where chaos begins', 'The Lyapunov exponent at $R = 4$', 'The number of periodic windows in the chaotic range', 'The limiting ratio of the gaps between successive period-doubling values of $R$']
  answer: 3
  explanation: |-
    The doublings happen at $R \approx 3, 3.4495, 3.5441, 3.5644, \dots$; each gap is about $1/4.669$ of the one before, in the limit. The cascade accumulates at $R_\infty \approx 3.5699$, and the same $\delta$ appears for every smooth one-hump map with a rounded (quadratic) peak.
- id: de-h1-r2-h39
  lesson: de-h1-logistic-map
  module_quiz: true
  type: match
  topic: Iterated maps
  stem: 'Match each value of $R$ in the logistic map to the long-run behavior of typical iterates.'
  pairs:
    - ['$R = 2.5$', Stable fixed point]
    - ['$R = 3.2$', Stable 2-cycle]
    - ['$R = 3.5$', Stable 4-cycle]
    - ['$R = 3.83$', Stable 3-cycle]
    - ['$R = 4$', Chaos]
  distractors: [Population dies out]
  explanation: |-
    $1 < R < 3$: fixed point. $3 < R < 3.449$: 2-cycle. $3.449 < R < 3.544$: 4-cycle. $R = 3.83$ lies in the period-3 window that opens at $1 + \sqrt8 \approx 3.828$. $R = 4$ is fully chaotic. Dying out needs $R \le 1$.
- id: de-h1-r2-h40
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'On the stable 2-cycle at $R = 3.2$, $f''(p)f''(q) = 0.16$. What is the Lyapunov exponent?'
  choices: ['$\ln 0.4 \approx -0.92$', '$\ln 0.16 \approx -1.83$', '$0.16$', '$\ln 2 \approx 0.69$']
  answer: 0
  explanation: |-
    The orbit alternates $p, q$, so the average of $\ln|f'|$ over one cycle is $\tfrac12\ln(0.16) = \ln 0.4 \approx -0.916$. Forgetting to divide by the period gives $\ln 0.16$. Negative, as for any stable cycle.
- id: de-h1-r2-h41
  lesson: de-h1-logistic-map
  module_quiz: true
  topic: Iterated maps
  stem: 'At $R = 4$ the Lyapunov exponent is $\ln 2$. Two orbits start $10^{-9}$ apart. After about how many steps does their difference become as large as the values themselves (order 1)?'
  choices: ['About 9', 'About 30', 'About 300', 'About $10^9$']
  answer: 1
  explanation: |-
    Errors grow by a factor of about 2 per step, so we need $2^n \approx 10^9$, $n \approx \log_2 10^9 \approx 29.9$. Nine steps confuses base 2 with base 10; the others treat the growth as linear.
- id: de-h1-r2-h42
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'Which statements describe chaotic behavior of the logistic map? Select all that apply.'
  choices: ['The rule is deterministic: the same $x_0$ always gives the same orbit', 'The orbit is eventually periodic', 'Nearby starting values separate exponentially fast on average', 'The iterates stay in a bounded interval', 'Random noise must be added to the rule']
  answer: [0, 2, 3]
  explanation: |-
    Chaos is deterministic, bounded behavior that never becomes periodic and has sensitive dependence (positive Lyapunov exponent). No randomness is involved.
- id: de-h1-r2-h43
  lesson: de-h1-logistic-map
  topic: Iterated maps
  stem: 'Euler''s method on $y'' = y(1 - y)$ with a large step produces values that jump around without settling. What is the right conclusion?'
  choices: ['The logistic equation is chaotic', 'The equilibrium $y = 1$ is unstable', 'The behavior is an artifact of the step size; with $hr < 2$ (here $h < 2$) the iterates settle to 1, like the true solution', 'The initial condition was too close to 0']
  answer: 2
  explanation: |-
    The logistic equation's solutions are monotone and approach 1. Euler's method is a logistic map with $R = 1 + h$, which only settles on 1 when $R < 3$, that is, $h < 2$. Halving the step until the behavior stops changing exposes the artifact.
- id: de-h1-r2-h44
  lesson: de-h1-logistic-map
  type: text
  topic: Iterated maps
  stem: 'For Euler''s method on $y'' = 4y(1 - y)$, the iterates converge to 1 only if the step size is less than ___.'
  accept: ['0.5', '1/2']
  explanation: |-
    Here $r = 4$ and $R = 1 + 4h$. The fixed point is stable for $R < 3$, so $4h < 2$ and $h < 0.5$. Equivalently, near $y = 1$ the equation behaves like $u' = -4u$, and Euler is stable for that only when $4h < 2$.
# Lesson 93: Lorenz equations
- id: de-h1-r2-h45
  lesson: de-h1-lorenz
  module_quiz: true
  topic: Chaos in differential equations
  stem: 'Why is chaos impossible for an autonomous system of two first-order equations, but possible with three?'
  choices: ['Because two-dimensional systems are always linear', 'Because three-dimensional systems have no equilibria', 'Because chaos requires random forcing, which needs a third variable', 'Because in the plane trajectories can''t cross, and Poincaré–Bendixson limits bounded trajectories to equilibria, closed orbits or loops of them; in three dimensions trajectories can pass around each other']
  answer: 3
  explanation: |-
    Uniqueness forbids crossing, and in the plane that confines long-run behavior (Poincaré–Bendixson). In three dimensions trajectories can weave over and under one another, which allows the stretching and folding behind chaos. Neither nonlinearity nor equilibria are ruled out in two dimensions, and chaos is deterministic.
- id: de-h1-r2-h46
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'For the Lorenz equations with $\sigma = 10$ and $b = 8/3$, a small blob of starting points has its volume multiplied by what factor after one time unit?'
  choices: ['$e^{-41/3} \approx 1.2 \times 10^{-6}$', '$e^{-10}$', '$e^{41/3}$', 'It doesn''t change, since the system is conservative']
  answer: 0
  explanation: |-
    The divergence is $-\sigma - 1 - b = -10 - 1 - 8/3 = -41/3$, a constant, so volumes shrink like $e^{-41t/3}$. The system is dissipative, not conservative; using only $\sigma$ gives $e^{-10}$.
- id: de-h1-r2-h47
  lesson: de-h1-lorenz
  module_quiz: true
  type: text
  topic: Chaos in differential equations
  stem: 'For the Lorenz equations with $b = 8/3$ and $r = 10$, the equilibrium $C_+$ has $z$-coordinate ___ and $x$-coordinate ___ (to 2 decimal places).'
  accept:
    - ['9']
    - ['4.90', '4.9']
  explanation: |-
    $C_\pm = (\pm\sqrt{b(r - 1)}, \pm\sqrt{b(r - 1)}, r - 1)$. So $z = 10 - 1 = 9$ and $x = \sqrt{(8/3)(9)} = \sqrt{24} = 2\sqrt6 \approx 4.90$.
- id: de-h1-r2-h48
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'At $r = 28$ ($\sigma = 10$, $b = 8/3$) the origin''s Jacobian has eigenvalues about $11.83$, $-22.83$ and $-8/3$. What is the origin?'
  choices: ['A stable node', 'A saddle: one direction repels while two attract', 'A center', 'An unstable spiral in every direction']
  answer: 1
  explanation: |-
    One positive and two negative real eigenvalues make a saddle. The $-8/3$ comes from the $z$-direction, which separates off at the origin. For $r < 1$ all three would be negative (a stable node).
- id: de-h1-r2-h49
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'With $\sigma = 10$ and $b = 2$, at what $r$ do $C_\pm$ lose stability (the Hopf value $r_H = \sigma(\sigma + b + 3)/(\sigma - b - 1)$)?'
  choices: ['About $24.74$', 'About $15$', 'About $21.43$', 'About $1$']
  answer: 2
  explanation: |-
    $r_H = \frac{10(10 + 2 + 3)}{10 - 2 - 1} = \frac{150}{7} \approx 21.43$. The value $24.74$ is for the classic $b = 8/3$; $r = 1$ is where $C_\pm$ are born.
- id: de-h1-r2-h50
  lesson: de-h1-lorenz
  module_quiz: true
  topic: Chaos in differential equations
  stem: 'Which statements about the Lorenz attractor at the classic parameters are true? Select all that apply.'
  choices: ['It has zero volume', 'It is a stable limit cycle', 'Motion on it has sensitive dependence on initial conditions', 'It has a layered, fractal structure', 'Trajectories on it are periodic with period about $2\pi$']
  answer: [0, 2, 3]
  explanation: |-
    The constant negative divergence shrinks all volumes, so the attractor has zero volume; it is a strange attractor with a fractal, many-sheeted structure (dimension about 2.06) and sensitive dependence. Trajectories on it never become periodic, so it is not a limit cycle.
- id: de-h1-r2-h51
  lesson: de-h1-lorenz
  type: label
  topic: Chaos in differential equations
  stem: 'This is a long solution of the Lorenz equations ($\sigma = 10$, $b = 8/3$, $r = 28$) drawn in the $x$–$z$ plane. Name the numbered parts.'
  image: {src: images/de-h1-lorenz-blank.svg, alt: 'A butterfly-shaped tangle of loops in the x–z plane with two lobes. Point 1 is at the center of the right lobe, point 2 at the center of the left lobe, point 3 at the origin on the x-axis, and point 4 on the outer edge of the loops.'}
  labels:
    - {x: 67.8, y: 44.2, text: 'Equilibrium C+ (x > 0)'}
    - {x: 32.2, y: 44.2, text: 'Equilibrium C− (x < 0)'}
    - {x: 50, y: 93.6, text: Origin (a saddle)}
    - {x: 84.6, y: 44, text: Trajectory on the strange attractor}
  distractors: [Stable limit cycle, Stable node]
  explanation: |-
    Each lobe winds around one of the unstable equilibria $C_\pm = (\pm 6\sqrt2, \pm 6\sqrt2, 27)$; the right one has $x > 0$. The origin, a saddle, sits on the $x$-axis below the point where the lobes meet. The loops are one long trajectory on the strange attractor, not a limit cycle, and none of the equilibria are stable at $r = 28$.
- id: de-h1-r2-h52
  lesson: de-h1-lorenz
  module_quiz: true
  topic: Chaos in differential equations
  stem: 'A chaotic system has largest Lyapunov exponent $0.9$. With a starting error of $10^{-4}$ and an error tolerance of 1, about how long can you predict?'
  choices: ['About 1.1 time units', 'About 4.4 time units', 'About 10 time units', 'About $10^4$ time units']
  answer: 2
  explanation: |-
    $t \approx \frac{1}{0.9}\ln\frac{1}{10^{-4}} = \frac{9.21}{0.9} \approx 10.2$. Using $\log_{10}$ instead of $\ln$ gives $4/0.9 \approx 4.4$; the error grows exponentially, so the horizon is logarithmic in the accuracy, not proportional to it.
- id: de-h1-r2-h53
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'For the same system ($\lambda = 0.9$), you make the starting data 1,000 times more accurate. How much longer can you predict?'
  choices: ['1,000 times longer', '3 times longer', 'About 0.9 time units longer', 'About 7.7 time units longer']
  answer: 3
  explanation: |-
    The horizon is $\frac1\lambda\ln(\Delta/\delta_0)$, so dividing $\delta_0$ by 1,000 adds $\frac{\ln 1000}{0.9} = \frac{6.91}{0.9} \approx 7.7$ time units, however long the horizon was before.
- id: de-h1-r2-h54
  lesson: de-h1-lorenz
  module_quiz: true
  type: match
  topic: Chaos in differential equations
  stem: 'Match each system to the long-run behavior that is possible for its bounded solutions or iterates.'
  pairs:
    - ['$y'' = f(y)$, one autonomous equation', Approaches an equilibrium]
    - [An autonomous system in the plane, 'Approaches an equilibrium, a closed orbit or a loop of equilibria']
    - [The Lorenz equations at r = 28, Chaos on a strange attractor]
    - [The logistic map at R = 4, Chaotic iterates with Lyapunov exponent ln 2]
  distractors: [Grows without bound]
  explanation: |-
    One-dimensional autonomous solutions are monotone; planar systems are limited by Poincaré–Bendixson; three-dimensional flows such as Lorenz can be chaotic; and maps can be chaotic even in one dimension.
- id: de-h1-r2-h55
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'Lorenz plotted each maximum $z_{n+1}$ of $z(t)$ against the previous maximum $z_n$. What did this show?'
  choices: ['The points fill a two-dimensional region with no pattern', 'The points lie close to a tent-shaped curve with slope steeper than 1 in size, an iterated map whose fixed points are all unstable', 'The maxima approach a fixed value, so the motion is eventually periodic', 'The maxima double each time']
  answer: 1
  explanation: |-
    The Lorenz map $z_{n+1} = f(z_n)$ is close to a single tent-shaped curve. With $|f'| > 1$ everywhere, every fixed point and cycle is unstable and errors grow at each step, the same mechanism as the chaotic logistic map.
- id: de-h1-r2-h56
  lesson: de-h1-lorenz
  topic: Chaos in differential equations
  stem: 'You solve the Lorenz equations with RK4 at two different small step sizes from the same starting point. What should agree between the two runs?'
  choices: ['The shape of the attractor and long-run averages, such as the fraction of time spent on each wing', 'The values of $x(t)$ at $t = 100$', 'Nothing, since numerical solutions of chaotic systems are meaningless', 'The exact sequence of wings visited for all time']
  answer: 0
  explanation: |-
    Step-size errors are amplified like any other error, so individual trajectories disagree after a limited time ($t = 100$ is far beyond the horizon). But the attractor's shape and statistics come out the same; for the Lorenz system this is supported by extensive computation rather than a complete proof.
- id: de-h1-r2-h57
  lesson: de-h1-lorenz
  type: order
  topic: Chaos in differential equations
  stem: 'Put these stages of the Lorenz equations ($\sigma = 10$, $b = 8/3$) in order of increasing $r$.'
  items: ['The origin attracts every solution', '$C_\pm$ are born in a pitchfork bifurcation and are stable', '$C_\pm$ lose stability in a subcritical Hopf bifurcation', 'Lorenz''s classic chaotic regime']
  explanation: |-
    For $r < 1$ the origin attracts everything; at $r = 1$ the pitchfork creates $C_\pm$; at $r_H \approx 24.74$ they lose stability in a subcritical Hopf bifurcation; Lorenz's classic chaos is at $r = 28$.
- id: de-h1-r2-h58
  lesson: de-h1-lorenz
  type: text
  topic: Chaos in differential equations
  stem: 'The divergence of the Lorenz vector field with $\sigma = 10$ and $b = 2$ is ___.'
  accept: ['-13']
  explanation: |-
    $\frac{\partial}{\partial x}\sigma(y - x) + \frac{\partial}{\partial y}(rx - y - xz) + \frac{\partial}{\partial z}(xy - bz) = -\sigma - 1 - b = -10 - 1 - 2 = -13$. It doesn't depend on $r$ or on the point.
