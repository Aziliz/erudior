- id: de-q-2607
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'How many arbitrary constants are in the general solution of a fifth-order linear ODE?'
  choices: ['4', '2', '5', '6']
  answer: 2
  explanation: |-
    An $n$th-order linear equation has $n$ fundamental solutions, so $n$ constants.
- id: de-q-2608
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'Factor $r^3 - r^2 + 4r - 4$ to solve $y'''''' - y'''' + 4y'' - 4y = 0$.'
  choices: ['$(r - 1)(r - 2)(r + 2)$, so $y = c_1e^t + c_2e^{2t} + c_3e^{-2t}$', '$(r + 1)(r^2 + 4)$, so $y = c_1e^{-t} + c_2\cos 2t + c_3\sin 2t$', '$(r - 1)^3$, so $y = (c_1 + c_2t + c_3t^2)e^t$', '$(r - 1)(r^2 + 4)$, so $y = c_1e^t + c_2\cos 2t + c_3\sin 2t$']
  answer: 3
  explanation: |-
    Group: $r^2(r - 1) + 4(r - 1) = (r - 1)(r^2 + 4)$. The roots are $1$ and $\pm 2i$.
- id: de-q-2609
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'A root of the characteristic polynomial of a constant-coefficient equation has multiplicity 3. How many solutions does it contribute?'
  choices: ['1', '3', '2', '6']
  answer: 1
  explanation: |-
    A root $r$ of multiplicity $k$ contributes $e^{rt}, te^{rt}, \dots, t^{k-1}e^{rt}$: $k$ solutions.
- id: de-q-2610
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'A clamped–free beam satisfies $EIy^{(4)} = w$ (constant). Why are four conditions needed?'
  choices: ['Because $EI$ and $w$ must both be specified', 'Because the beam has four ends', 'The equation is fourth order, so its general solution has four constants', 'Only two conditions are needed']
  answer: 2
  explanation: |-
    Integrating four times introduces four constants, fixed by boundary conditions at the two ends (two at each end).
- id: de-q-2611
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'Which value is a root of $r^3 - 2r^2 - 5r + 6$?'
  choices: ['$r = 1$', '$r = 2$', '$r = -1$', '$r = -3$']
  answer: 0
  explanation: |-
    $1 - 2 - 5 + 6 = 0$. Dividing gives $(r - 1)(r^2 - r - 6) = (r - 1)(r - 3)(r + 2)$. Check the others: $r = 2$ gives $-4$; $r = -1$ gives $8$; $r = -3$ gives $-24$.
