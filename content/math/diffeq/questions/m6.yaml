# Module 6: nonhomogeneous equations and applications
- id: de-q-2201
  lesson: de-undetermined
  module_quiz: true
  topic: Undetermined coefficients
  stem: 'Find a particular solution of $y'''' - y = 3e^{2t}$.'
  choices: ['$Y = 3e^{2t}$', '$Y = e^{2t}$', '$Y = \tfrac35e^{2t}$', '$Y = te^{2t}$']
  answer: 1
  explanation: |-
    $Y = Ae^{2t}$ gives $(4A - A)e^{2t} = 3e^{2t}$, so $A = 1$. No modification is needed since 2 is not a root of $r^2 - 1$.
- id: de-q-2202
  lesson: de-undetermined
  module_quiz: true
  topic: Undetermined coefficients
  stem: 'Find a particular solution of $y'''' + 4y = 8t^2$.'
  choices: ['$Y = 2t^2$', '$Y = 2t^2 + 1$', '$Y = \tfrac23t^4$', '$Y = 2t^2 - 1$']
  answer: 3
  explanation: |-
    Guess $At^2 + Bt + C$: $2A + 4(At^2 + Bt + C) = 8t^2$. So $A = 2$, $B = 0$, $2A + 4C = 0$ gives $C = -1$. Guessing only $At^2$ misses the constant.
- id: de-q-2203
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'What is the correct form of $Y$ for $y'''' + 3y'' + 2y = 4e^{-t}$?'
  choices: ['$Ate^{-t}$', '$Ae^{-t}$', '$At^2e^{-t}$', '$(At + B)e^{-t}$']
  answer: 0
  explanation: |-
    The roots are $-1, -2$, so $e^{-t}$ already solves the homogeneous equation. $-1$ is a simple root, so multiply by $t$ once. (Solving gives $A = 4$.)
- id: de-q-2204
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'What is the correct form of $Y$ for $y'''' - 2y'' + y = 6e^{t}$?'
  choices: ['$Ate^{t}$', '$Ae^{t}$', '$At^2e^{t}$', '$(At + B)e^t$']
  answer: 2
  explanation: |-
    $r = 1$ is a double root, so both $e^t$ and $te^t$ are in $y_c$. Multiply by $t^2$. (Then $A = 3$.)
- id: de-q-2205
  lesson: de-undetermined
  module_quiz: true
  topic: Undetermined coefficients
  stem: 'Find a particular solution of $y'''' + y = 2\sin 2t$.'
  choices: ['$Y = \tfrac23\sin 2t$', '$Y = -\tfrac25\sin 2t$', '$Y = -t\cos 2t$', '$Y = -\tfrac23\sin 2t$']
  answer: 3
  explanation: |-
    Guess $A\cos 2t + B\sin 2t$: $(-4 + 1)(A\cos 2t + B\sin 2t) = 2\sin 2t$, so $A = 0$, $B = -\tfrac23$. No resonance since $2 \ne 1$.
- id: de-q-2206
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'For $y'''' + 2y'' + 5y = 3\cos t$, which guess is correct?'
  choices: ['$A\cos t$', '$A\cos t + B\sin t$', '$At\cos t + Bt\sin t$', '$Ae^{-t}\cos t$']
  answer: 1
  explanation: |-
    The $y'$ term turns cosines into sines, so both are needed. No modification: $\pm i$ are not roots of $r^2 + 2r + 5$ (roots $-1 \pm 2i$).
- id: de-q-2207
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'Find the general solution of $y'''' + y'' - 6y = 12$.'
  choices: ['$c_1e^{2t} + c_2e^{-3t} + 2$', '$c_1e^{-2t} + c_2e^{3t} - 2$', '$c_1e^{2t} + c_2e^{-3t} - 2$', '$c_1e^{2t} + c_2e^{-3t} - 12$']
  answer: 2
  explanation: |-
    $r^2 + r - 6 = (r - 2)(r + 3)$. A constant guess $Y = A$ gives $-6A = 12$, so $A = -2$.
- id: de-q-2208
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'Find the step that is wrong. Solve $y'''' - 3y'' - 4y = 5e^{4t}$: (1) $y_c = c_1e^{4t} + c_2e^{-t}$; (2) guess $Y = Ae^{4t}$; (3) substituting gives $0 = 5e^{4t}$; (4) so there is no solution.'
  choices: ['Steps 2 and 4: the guess must be $Ate^{4t}$, which works', 'Step 1 only', 'Step 3 only', 'No step is wrong']
  answer: 0
  explanation: |-
    $e^{4t}$ solves the homogeneous equation, so the guess needs a factor $t$. With $Y = Ate^{4t}$ one gets $5A = 5$, $A = 1$. A solution always exists.
- id: de-q-2209
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'For $y'''' + 4y = t + \cos 2t$, what is the right form of $Y$?'
  choices: ['$At + B + t(C\cos 2t + D\sin 2t)$', '$At + B + C\cos 2t + D\sin 2t$', '$At + t(C\cos 2t)$', '$t(At + B + C\cos 2t + D\sin 2t)$']
  answer: 0
  explanation: |-
    Split the forcing. For $t$: $At + B$ (no overlap). For $\cos 2t$: $\pm 2i$ are roots, so $t(C\cos 2t + D\sin 2t)$. Only the overlapping piece gets the extra $t$.
- id: de-q-2210
  lesson: de-undetermined
  module_quiz: true
  topic: Undetermined coefficients
  stem: 'Solve $y'''' + y'' - 2y = 2t$, $y(0) = 0$, $y''(0) = 1$.'
  choices: ['$\tfrac13e^t - \tfrac13e^{-2t} - t$', '$e^t - e^{-2t} - t$', '$e^t - \tfrac12e^{-2t} - t - \tfrac12$', '$\tfrac12e^t - \tfrac12e^{-2t} - t - \tfrac12$']
  answer: 2
  explanation: |-
    $Y = -t - \tfrac12$. Fitting $c_1e^t + c_2e^{-2t} + Y$: $c_1 + c_2 = \tfrac12$ and $c_1 - 2c_2 - 1 = 1$, giving $c_1 = 1$, $c_2 = -\tfrac12$. Fitting the initial conditions with $y_c$ alone and then tacking on $-t$ gives the $\tfrac13$ choice.
- id: de-q-2211
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'For which forcing term can undetermined coefficients NOT be used on $y'''' + y = g(t)$?'
  choices: ['$g = t^3e^{t}$', '$g = \tan t$', '$g = e^{-t}\sin 3t$', '$g = 5$']
  answer: 1
  explanation: |-
    The derivatives of $\tan t$ never close into a finite family. The others are polynomial, exponential and trig combinations.
- id: de-q-2212
  lesson: de-undetermined
  topic: Undetermined coefficients
  stem: 'Find a particular solution of $y'''' + 3y'' + 2y = 4e^{-t}$.'
  choices: ['$-4te^{-t}$', '$2te^{-t}$', '$4e^{-t}$', '$4te^{-t}$']
  answer: 3
  explanation: |-
    $Y = Ate^{-t}$: $Y' = A(1 - t)e^{-t}$, $Y'' = A(t - 2)e^{-t}$. Substituting: $Ae^{-t}[(t - 2) + 3(1 - t) + 2t] = Ae^{-t}$. So $A = 4$.
# Lesson 23
- id: de-q-2301
  lesson: de-variation
  module_quiz: true
  topic: Variation of parameters
  stem: 'In variation of parameters for $y'''' + py'' + qy = g$, what is $u_1''$?'
  choices: ['$\dfrac{y_2g}{W}$', '$-\dfrac{y_2g}{W}$', '$-\dfrac{y_1g}{W}$', '$\dfrac{y_1g}{W}$']
  answer: 1
  explanation: |-
    Cramer's rule on $u_1'y_1 + u_2'y_2 = 0$, $u_1'y_1' + u_2'y_2' = g$ gives $u_1' = -y_2g/W$ and $u_2' = y_1g/W$.
- id: de-q-2302
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Which extra condition is imposed on $u_1, u_2$ in variation of parameters?'
  choices: ['$u_1 + u_2 = 0$', '$u_1''y_1'' + u_2''y_2'' = 0$', '$u_1'''' = u_2'''' = 0$', '$u_1''y_1 + u_2''y_2 = 0$']
  answer: 3
  explanation: |-
    This choice keeps $Y'$ free of $u'$ terms, so $Y''$ only involves first derivatives of $u_1, u_2$.
- id: de-q-2303
  lesson: de-variation
  module_quiz: true
  topic: Variation of parameters
  stem: 'For $y'''' + y = \sec t$, variation of parameters gives which particular solution?'
  choices: ['$\cos t\ln(\cos t) + t\sin t$', '$\sin t\ln(\cos t) + t\cos t$', '$t\sin t$', '$-\cos t\ln(\cos t) + t\sin t$']
  answer: 0
  explanation: |-
    $W = 1$, $u_1' = -\tan t$ so $u_1 = \ln(\cos t)$, $u_2' = 1$ so $u_2 = t$. Then $Y = u_1\cos t + u_2\sin t$.
- id: de-q-2304
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Before using variation of parameters on $t^2y'''' + ty'' - y = t^2$, what is $g(t)$?'
  choices: ['$t^2$', '$t^4$', '$1$', '$t$']
  answer: 2
  explanation: |-
    The formulas need standard form $y'' + \tfrac1t y' - \tfrac1{t^2}y = 1$, so $g = 1$. Using $t^2$ is the classic error.
- id: de-q-2305
  lesson: de-variation
  topic: Variation of parameters
  stem: 'For $y'''' - 2y'' + y = e^t/t$ ($t > 0$), with $y_1 = e^t$, $y_2 = te^t$, $W = e^{2t}$, what is $u_2$?'
  choices: ['$-t$', '$1/t$', '$t\ln t$', '$\ln t$']
  answer: 3
  explanation: |-
    $u_2' = \dfrac{y_1g}{W} = \dfrac{e^t \cdot e^t/t}{e^{2t}} = \dfrac1t$, so $u_2 = \ln t$. (And $u_1 = -t$; the particular solution is $te^t\ln t$ after dropping a multiple of $y_2$.)
- id: de-q-2306
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Why may the constants of integration in $u_1$ and $u_2$ be dropped?'
  choices: ['They are always zero', 'They only add multiples of $y_1$ and $y_2$, already in $y_c$', 'They cancel in the Wronskian', 'The initial conditions force them to be zero']
  answer: 1
  explanation: |-
    $(u_1 + k_1)y_1 + (u_2 + k_2)y_2 = Y + k_1y_1 + k_2y_2$, and those extra terms are part of the complementary solution.
- id: de-q-2307
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Which equation calls for variation of parameters rather than undetermined coefficients?'
  choices: ['$y'''' + 4y'' + 4y = t^2e^{-2t}$', '$y'''' + 4y = \sin 2t$', '$y'''' + 4y'' + 4y = \dfrac{e^{-2t}}{t^2}$', '$y'''' - y = e^t + t$']
  answer: 2
  explanation: |-
    $1/t^2$ is not of polynomial/exponential/trig type. The others, including resonance cases, are handled by undetermined coefficients with the modification rule.
- id: de-q-2308
  lesson: de-variation
  topic: Variation of parameters
  stem: 'For $y'''' - y = e^{2t}$ with $y_1 = e^t$, $y_2 = e^{-t}$, what is the Wronskian $W(y_1, y_2)$?'
  choices: ['$-2$', '$2$', '$0$', '$-2e^{t}$']
  answer: 0
  explanation: |-
    $W = e^t(-e^{-t}) - e^t(e^{-t}) = -1 - 1 = -2$.
- id: de-q-2309
  lesson: de-variation
  topic: Variation of parameters
  stem: 'For $y'''' + \omega^2y = g(t)$, the particular solution with $Y(0) = Y''(0) = 0$ is'
  choices: ['$\dfrac1\omega\displaystyle\int_0^t\sin(\omega(t - s))g(s)\,ds$', '$\displaystyle\int_0^t\cos(\omega(t - s))g(s)\,ds$', '$\dfrac1\omega\displaystyle\int_0^t\sin(\omega s)g(s)\,ds$', '$\omega\displaystyle\int_0^t\sin(\omega(t - s))g(s)\,ds$']
  answer: 0
  explanation: |-
    With $y_1 = \cos\omega t$, $y_2 = \sin\omega t$, $W = \omega$, the kernel $\dfrac{y_1(s)y_2(t) - y_1(t)y_2(s)}{W} = \dfrac{\sin\omega(t - s)}{\omega}$.
- id: de-q-2310
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Using variation of parameters on $y'''' + y = \tan t$ gives $u_2 = -\cos t$. What is $u_2''$ supposed to be?'
  choices: ['$-\sin t\tan t$', '$\tan t$', '$\cos t\tan t = \sin t$', '$\sec t$']
  answer: 2
  explanation: |-
    $u_2' = y_1g/W = \cos t \cdot \tan t / 1 = \sin t$, whose antiderivative is $-\cos t$.
- id: de-q-2311
  lesson: de-variation
  topic: Variation of parameters
  stem: 'Variation of parameters needs which ingredients?'
  choices: ['Constant coefficients only', 'A fundamental set $y_1, y_2$ of the homogeneous equation and the standard-form forcing $g$', 'The characteristic roots and initial conditions', 'A guess for the form of $Y$']
  answer: 1
  explanation: |-
    It works with variable coefficients too, as long as $y_1$ and $y_2$ are known. No guessing is involved.
# Lesson 24
- id: de-q-2401
  lesson: de-free-vibrations
  module_quiz: true
  topic: Mechanical vibrations
  stem: 'A 4 kg mass stretches a spring 0.98 m at equilibrium. What is the spring constant? ($g = 9.8$ m/s²)'
  choices: ['4.08 N/m', '3.92 N/m', '400 N/m', '40 N/m']
  answer: 3
  explanation: |-
    $kL = mg$: $k = 4(9.8)/0.98 = 40$ N/m.
- id: de-q-2402
  lesson: de-free-vibrations
  module_quiz: true
  topic: Mechanical vibrations
  stem: 'For $2u'''' + 3u'' + 5u = 0$, classify the damping.'
  choices: ['Critically damped', 'Underdamped', 'Overdamped', 'Undamped']
  answer: 1
  explanation: |-
    $\gamma^2 = 9 < 4km = 40$: complex roots, a decaying oscillation.
- id: de-q-2403
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'What damping coefficient makes $u'''' + \gamma u'' + 9u = 0$ critically damped?'
  choices: ['$\gamma = 3$', '$\gamma = 9$', '$\gamma = 36$', '$\gamma = 6$']
  answer: 3
  explanation: |-
    Critical when $\gamma^2 = 4km = 36$, so $\gamma = 6$.
- id: de-q-2404
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'What is the period of $u'''' + 16u = 0$?'
  choices: ['$\pi/2$', '$2\pi$', '$\pi/8$', '$\pi/4$']
  answer: 0
  explanation: |-
    $\omega_0 = 4$, period $2\pi/4 = \pi/2$.
- id: de-q-2405
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'An undamped spring has $u = 0.3\cos 2t + 0.4\sin 2t$. What is the amplitude?'
  choices: ['0.7', '0.1', '0.5', '0.25']
  answer: 2
  explanation: |-
    $R = \sqrt{0.09 + 0.16} = 0.5$. Adding the coefficients gives 0.7, which overstates it.
- id: de-q-2406
  lesson: de-free-vibrations
  module_quiz: true
  topic: Mechanical vibrations
  stem: 'Doubling the mass on an undamped spring changes the natural frequency by what factor?'
  choices: ['$1/2$', '$\sqrt2$', '$2$', '$1/\sqrt2$']
  answer: 3
  explanation: |-
    $\omega_0 = \sqrt{k/m}$, so doubling $m$ divides $\omega_0$ by $\sqrt2$. Heavier masses vibrate more slowly.
- id: de-q-2407
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'A 1 kg mass ($k = 10$, $\gamma = 2$) starts at $u(0) = 1$ at rest. Which is the motion?'
  choices: ['$e^{-t}\cos 3t$', '$e^{-t}\left(\cos 3t + \tfrac13\sin 3t\right)$', '$e^{-2t}\left(\cos 3t + \tfrac23\sin 3t\right)$', '$\cos\sqrt{10}\,t$']
  answer: 1
  explanation: |-
    $r = -1 \pm 3i$. $A = 1$ and $u'(0) = -A + 3B = 0$ gives $B = \tfrac13$. Dropping the sine term ignores the velocity condition.
- id: de-q-2408
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'Compared with the undamped natural frequency $\omega_0$, the quasi-frequency $\mu$ of an underdamped system is'
  choices: ['larger', 'equal', 'smaller', 'zero']
  answer: 2
  explanation: |-
    $\mu = \sqrt{4km - \gamma^2}/(2m) = \sqrt{\omega_0^2 - \gamma^2/(4m^2)} < \omega_0$. Damping slows the oscillation slightly.
- id: de-q-2409
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'With down as positive, a mass is pushed upward from equilibrium at 2 m/s. What are the initial conditions?'
  choices: ['$u(0) = 0$, $u''(0) = -2$', '$u(0) = 0$, $u''(0) = 2$', '$u(0) = -2$, $u''(0) = 0$', '$u(0) = 2$, $u''(0) = 0$']
  answer: 0
  explanation: |-
    It starts at equilibrium ($u = 0$) moving up, which is the negative direction.
- id: de-q-2410
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'A spring–mass system has $m = 1$, $k = 10$, $\gamma = 10$. How does it return to equilibrium compared with critical damping?'
  choices: ['More slowly, without oscillating', 'Faster, without oscillating', 'With decaying oscillations', 'It never returns']
  answer: 0
  explanation: |-
    $\gamma^2 = 100 > 40$: overdamped. Its slow root $-5 + \sqrt{15} \approx -1.13$ is closer to 0 than the critical double root $-\sqrt{10} \approx -3.16$.
- id: de-q-2411
  lesson: de-free-vibrations
  topic: Mechanical vibrations
  stem: 'A 16 lb weight stretches a spring 2 ft ($g = 32$ ft/s²). What are $m$ and $k$?'
  choices: ['$m = 16$ slug, $k = 8$ lb/ft', '$m = 0.5$ slug, $k = 32$ lb/ft', '$m = 0.5$ slug, $k = 8$ lb/ft', '$m = 16$ slug, $k = 256$ lb/ft']
  answer: 2
  explanation: |-
    Mass = weight/$g$ = 16/32 = 0.5 slug. $k$ = weight/stretch = 16/2 = 8 lb/ft.
# Lesson 25
- id: de-q-2501
  lesson: de-forced-vibrations
  module_quiz: true
  topic: Forced vibrations
  stem: 'For $u'''' + 4u = 3\cos\omega t$ (undamped), which $\omega$ causes resonance?'
  choices: ['$\omega = 4$', '$\omega = 2$', '$\omega = 3$', '$\omega = \tfrac12$']
  answer: 1
  explanation: |-
    Resonance happens when $\omega = \omega_0 = \sqrt{k/m} = \sqrt4 = 2$.
- id: de-q-2502
  lesson: de-forced-vibrations
  module_quiz: true
  topic: Forced vibrations
  stem: 'Find the steady-state solution of $u'''' + 2u'' + 5u = 10\cos t$.'
  choices: ['$\tfrac52\cos t$', '$\cos t + 2\sin t$', '$2\cos t - \sin t$', '$2\cos t + \sin t$']
  answer: 3
  explanation: |-
    With $U = A\cos t + B\sin t$: $4A + 2B = 10$ and $4B - 2A = 0$, so $A = 2$, $B = 1$. Ignoring the damping term gives $\tfrac{10}{4}\cos t$.
- id: de-q-2503
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'Undamped $u'''' + 9u = 6\cos 3t$ starting from rest at equilibrium gives'
  choices: ['$u = \tfrac23\cos 3t$', '$u = t\sin 3t$', '$u = 6t\sin 3t$', '$u = \tfrac12 t\cos 3t$']
  answer: 1
  explanation: |-
    Resonance: $U = \dfrac{F_0}{2m\omega_0}t\sin\omega_0t = \dfrac{6}{6}t\sin 3t$. The initial conditions are already satisfied by $U$, so $c_1 = c_2 = 0$.
- id: de-q-2504
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'The beats phenomenon occurs when'
  choices: ['damping is critical', 'forcing exactly matches the natural frequency', 'there is no external force', 'an undamped system is forced at a frequency close to, but not equal to, its natural frequency']
  answer: 3
  explanation: |-
    $\cos\omega t - \cos\omega_0t$ becomes a fast oscillation inside a slow envelope when $\omega \approx \omega_0$.
- id: de-q-2505
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'In a damped forced system, the transient solution is'
  choices: ['the complementary solution, which decays to 0', 'the particular solution, which decays', 'the part oscillating at the forcing frequency', 'the solution at $t = 0$']
  answer: 0
  explanation: |-
    With $\gamma > 0$ all homogeneous solutions decay. The particular (steady-state) part persists at the forcing frequency.
- id: de-q-2506
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'Find the steady-state amplitude of $u'''' + 2u'' + 7u = 10\cos 2t$.'
  choices: ['$\tfrac{10}{3}$', '2.5', '2', '1.25']
  answer: 2
  explanation: |-
    $R = \dfrac{F_0}{\sqrt{(k - m\omega^2)^2 + \gamma^2\omega^2}} = \dfrac{10}{\sqrt{(7 - 4)^2 + 4 \cdot 4}} = \dfrac{10}{5} = 2$. Ignoring damping gives $10/3$; ignoring the spring gives $10/(\gamma\omega) = 2.5$.
- id: de-q-2507
  lesson: de-forced-vibrations
  module_quiz: true
  topic: RLC circuits
  stem: 'In the analogy between $mu'''' + \gamma u'' + ku = F$ and an RLC circuit, the spring constant $k$ corresponds to'
  choices: ['$C$', '$R$', '$L$', '$1/C$']
  answer: 3
  explanation: |-
    The circuit equation is $Lq'' + Rq' + \tfrac1Cq = E$, so $m \leftrightarrow L$, $\gamma \leftrightarrow R$, $k \leftrightarrow 1/C$.
- id: de-q-2508
  lesson: de-forced-vibrations
  topic: RLC circuits
  stem: 'An RLC circuit has $L = 1$ H, $C = 0.25$ F. What resistance makes it critically damped?'
  choices: ['2 Ω', '4 Ω', '1 Ω', '16 Ω']
  answer: 1
  explanation: |-
    Critical when $R^2 = 4L/C = 16$, so $R = 4$ Ω.
- id: de-q-2509
  lesson: de-forced-vibrations
  topic: RLC circuits
  stem: 'What is the natural (undamped) angular frequency of an LC circuit with $L = 0.5$ H and $C = 0.02$ F?'
  choices: ['0.1 rad/s', '100 rad/s', '10 rad/s', '0.01 rad/s']
  answer: 2
  explanation: |-
    $\omega_0 = 1/\sqrt{LC} = 1/\sqrt{0.01} = 10$ rad/s.
- id: de-q-2510
  lesson: de-forced-vibrations
  topic: RLC circuits
  stem: 'A circuit has $L = 0.5$, $R = 2$, $C = 0.1$, $q(0) = 1$, $I(0) = 0$, no source. Find $q(t)$.'
  choices: ['$e^{-2t}\left(\cos 4t + \tfrac12\sin 4t\right)$', '$e^{-4t}\left(\cos 2t + 2\sin 2t\right)$', '$e^{-2t}\cos 4t$', '$\cos\sqrt{20}\,t$']
  answer: 0
  explanation: |-
    $q'' + 4q' + 20q = 0$ gives $r = -2 \pm 4i$. $A = 1$ and $-2A + 4B = 0$ give $B = \tfrac12$.
- id: de-q-2511
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'For damped forcing, as $t \to \infty$ the motion oscillates at'
  choices: ['the forcing frequency $\omega$', 'the natural frequency $\omega_0$', 'the quasi-frequency $\mu$', 'the average of $\omega$ and $\omega_0$']
  answer: 0
  explanation: |-
    Only the steady-state particular solution survives, and it oscillates like the forcing $\cos\omega t$.
- id: de-q-2512
  lesson: de-forced-vibrations
  module_quiz: true
  topic: Forced vibrations
  stem: 'For $u'''' + 2u'' + 10u = F_0\cos\omega t$, at what forcing frequency is the steady-state amplitude largest?'
  choices: ['$\omega = \sqrt{10} \approx 3.16$', '$\omega = 2\sqrt2 \approx 2.83$', '$\omega = \sqrt6 \approx 2.45$', '$\omega = 3$']
  answer: 1
  explanation: |-
    $\omega_{\max}^2 = \omega_0^2 - \dfrac{\gamma^2}{2m^2} = 10 - \dfrac42 = 8$, so $\omega_{\max} = 2\sqrt2$. $\sqrt{10}$ is the natural frequency $\omega_0$, where the peak would sit without damping; $\sqrt6$ subtracts $\gamma^2/m^2$ (missing the factor 2); 3 is the quasi-frequency $\sqrt{\omega_0^2 - \gamma^2/(4m^2)}$ of the free damped motion, not the peak of the forced response.
- id: de-q-2513
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'A forced oscillator has $m = 2$ and $k = 9$. Which damping constant gives an amplitude curve with no practical-resonance peak at all?'
  choices: ['$\gamma = 5$', '$\gamma = 3$', '$\gamma = 1$', '$\gamma = 7$']
  answer: 3
  explanation: |-
    A peak exists only when $\gamma^2 < 2mk = 36$, that is $\gamma < 6$. With $\gamma = 7$ the amplitude just decreases as $\omega$ grows, even though the system is still underdamped ($\gamma < 2\sqrt{km} \approx 8.49$). The values 5, 3 and 1 all satisfy $\gamma^2 < 36$ and do have a peak; picking one of them confuses the no-peak threshold with the onset of heavy damping in general.
- id: de-q-2514
  lesson: de-forced-vibrations
  topic: Forced vibrations
  stem: 'As the damping $\gamma$ increases (with $\gamma^2 < 2mk$ throughout), the practical-resonance peak'
  choices: ['moves to lower frequencies and gets lower', 'stays at $\omega_0$ and gets lower', 'moves to higher frequencies and gets lower', 'moves to lower frequencies and gets taller']
  answer: 0
  explanation: |-
    $\omega_{\max}^2 = \omega_0^2 - \gamma^2/(2m^2)$ shrinks as $\gamma$ grows, and the peak height $F_0/\big(\gamma\sqrt{\omega_0^2 - \gamma^2/(4m^2)}\big)$ falls. The peak sits exactly at $\omega_0$ only in the undamped limit; it never moves above $\omega_0$; more damping always lowers the amplitude rather than raising it.
- id: de-q-2515
  lesson: de-forced-vibrations
  module_quiz: true
  topic: Forced vibrations
  stem: 'For $u'''' + 2u'' + 10u = 20\cos\omega t$, what is the largest possible steady-state amplitude (over all $\omega$)?'
  choices: ['$\sqrt{10} \approx 3.16$', '2', '$\tfrac{10}{3}$', '$\tfrac{5}{\sqrt2} \approx 3.54$']
  answer: 2
  explanation: |-
    At $\omega_{\max}^2 = 10 - 2 = 8$: $k - m\omega^2 = 2$ and $\gamma^2\omega^2 = 32$, so $R = \dfrac{20}{\sqrt{4 + 32}} = \dfrac{20}{6} = \dfrac{10}{3}$. $\sqrt{10} = F_0/(\gamma\omega_0)$ is the amplitude at $\omega_0$, just below the true peak; 2 is the static response $F_0/k$ at $\omega = 0$; $\tfrac{5}{\sqrt2} = F_0/(\gamma\omega_{\max})$ drops the $(k - m\omega^2)^2$ term.
# Lesson 26
- id: de-q-cg01
  lesson: de-complex-gain
  module_quiz: true
  topic: Complex gain
  stem: 'For $p(D)x = x'''' + 3x'' + 2x$, what is $p(D)e^{2t}$?'
  choices: ['$9e^{2t}$', '$12e^{2t}$', '$6e^{2t}$', '$4e^{2t}$']
  answer: 1
  explanation: |-
    $p(D)e^{rt} = p(r)e^{rt}$ with $p(r) = r^2 + 3r + 2$, and $p(2) = 4 + 6 + 2 = 12$. Writing 3 instead of $3r$ for the $x'$ term gives 9; dropping the $x'$ term gives 6; keeping only $r^2$ gives 4.
- id: de-q-cg02
  lesson: de-complex-gain
  module_quiz: true
  topic: Complex gain
  stem: 'Use complex replacement to find the steady-state solution of $x'''' + 4x'' + 3x = 10\cos t$.'
  choices: ['$\cos t - 2\sin t$', '$\cos t$', '$2\cos t + \sin t$', '$\cos t + 2\sin t$']
  answer: 3
  explanation: |-
    $p(i) = -1 + 4i + 3 = 2 + 4i$, so $z_p = \dfrac{10}{2 + 4i}e^{it} = \dfrac{10(2 - 4i)}{20}e^{it} = (1 - 2i)(\cos t + i\sin t)$, whose real part is $\cos t + 2\sin t$. Writing $2 + 4i$ instead of its conjugate $2 - 4i$ in the numerator gives $1 + 2i$ and the minus sign; taking the real part of $\tfrac{10}{2 + 4i}$ before multiplying by $e^{it}$ gives $\cos t$ alone; $2\cos t + \sin t$ swaps the coefficients.
- id: de-q-cg03
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'For $x'''' + x'' + 4x = F_0\cos\omega t$, find the gain $g$ and phase lag $\phi$ at $\omega = 2$.'
  choices: ['$g = \tfrac12$, $\phi = \tfrac\pi2$', '$g = \tfrac12$, $\phi = -\tfrac\pi2$', '$g = 2$, $\phi = \tfrac\pi2$', '$g = \tfrac{1}{10}$, $\phi = 0$']
  answer: 0
  explanation: |-
    $p(2i) = -4 + 2i + 4 = 2i$, so $|p(2i)| = 2$ and $\arg p(2i) = \tfrac\pi2$. The gain is $1/|p(2i)| = \tfrac12$ and the lag is $\tfrac\pi2$ (here $\omega = \omega_0$). A lag of $-\tfrac\pi2$ is the angle of the complex gain $1/p$, not of $p$; $g = 2$ is $|p|$ instead of $1/|p|$; $\tfrac1{10}$ comes from evaluating $p(2)$ instead of $p(2i)$.
- id: de-q-cg04
  lesson: de-complex-gain
  module_quiz: true
  topic: Complex gain
  stem: 'For $x'''' + x'' + x = \cos 2t$, what is the phase lag $\phi$ of the steady-state response (in radians)?'
  choices: ['$-\arctan\tfrac23 \approx -0.59$', '$\arctan\tfrac23 \approx 0.59$', '$\pi - \arctan\tfrac23 \approx 2.55$', '$\tfrac\pi2 \approx 1.57$']
  answer: 2
  explanation: |-
    $p(2i) = -4 + 2i + 1 = -3 + 2i$ lies in the second quadrant, so $\phi = \pi - \arctan\tfrac23 \approx 2.55$: forcing above $\omega_0 = 1$ gives a lag beyond $\tfrac\pi2$. A calculator's $\arctan(2/(-3))$ gives $-0.59$ (wrong quadrant); $0.59$ ignores the negative real part; $\tfrac\pi2$ is the lag only at $\omega = \omega_0$.
- id: de-q-cg05
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'Why is $\operatorname{Re}z$ a solution of $p(D)x = F_0\cos\omega t$ when $z$ solves $p(D)z = F_0e^{i\omega t}$?'
  choices: ['$p(i\omega)$ is always a real number', 'The imaginary part of $z$ is always zero', '$e^{i\omega t}$ is real for every $t$', '$p$ has real coefficients, so $p(D)(\operatorname{Re}z) = \operatorname{Re}\big(p(D)z\big)$']
  answer: 3
  explanation: |-
    Differentiation and multiplication by real constants act separately on real and imaginary parts, so $p(D)(\operatorname{Re}z) = \operatorname{Re}(F_0e^{i\omega t}) = F_0\cos\omega t$. $p(i\omega)$ is generally complex (that is where the phase comes from), $z$ usually has a nonzero imaginary part, and $e^{i\omega t}$ is not real except at special times.
- id: de-q-cg06
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'Find the steady-state solution of $x'' + x = \sin t$.'
  choices: ['$\tfrac12(\sin t + \cos t)$', '$\tfrac12(\sin t - \cos t)$', '$\tfrac12(\cos t - \sin t)$', '$\tfrac12\sin t$']
  answer: 1
  explanation: |-
    $\sin t = \operatorname{Im}e^{it}$ and $p(i) = 1 + i$, so $z_p = \dfrac{1 - i}{2}(\cos t + i\sin t)$, whose imaginary part is $\tfrac12(\sin t - \cos t)$. The real part, $\tfrac12(\sin t + \cos t)$, answers a cosine input; $\tfrac12(\cos t - \sin t)$ has the sign flipped; $\tfrac12\sin t$ ignores the phase lag.
- id: de-q-cg07
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'Write the steady-state solution of $x'''' + 4x'' + 4x = 15\cos t$ as $R\cos(t - \phi)$.'
  choices: ['$3\cos(t + 0.927)$', '$5\cos t$', '$3\cos(t - 0.927)$', '$3\cos(t - 0.644)$']
  answer: 2
  explanation: |-
    $p(i) = -1 + 4i + 4 = 3 + 4i$, with modulus 5 and angle $\arctan\tfrac43 \approx 0.927$. So $R = 15/5 = 3$ and the response lags by 0.927. $\cos(t + 0.927)$ is a lead, not a lag; $5\cos t$ ignores the damping term ($15/3$); $0.644 = \arctan\tfrac34$ inverts the ratio.
- id: de-q-cg08
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'To find a particular solution of $p(D)y = e^{-2t}\sin 3t$ by complex replacement, you solve $p(D)z = e^{rt}$ and then take'
  choices: ['$r = -2 + 3i$, the imaginary part', '$r = -2 + 3i$, the real part', '$r = 3 - 2i$, the imaginary part', '$r = 3i$, the imaginary part, then multiply by $e^{-2t}$']
  answer: 0
  explanation: |-
    $e^{(-2 + 3i)t} = e^{-2t}(\cos 3t + i\sin 3t)$, whose imaginary part is the input, so $z_p = e^{(-2 + 3i)t}/p(-2 + 3i)$ and $y_p = \operatorname{Im}z_p$. The real part answers $e^{-2t}\cos 3t$; $3 - 2i$ swaps the roles of growth rate and frequency; multiplying a $3i$ response by $e^{-2t}$ afterward does not solve the equation, because $p$ must be evaluated at $-2 + 3i$.
- id: de-q-cg09
  lesson: de-complex-gain
  module_quiz: true
  topic: Complex gain
  stem: 'For $x'''' + 9x = 4\cos 3t$, $p(3i) = 0$. Using $z_p = \dfrac{F_0te^{i\omega t}}{p''(i\omega)}$, what is $x_p$?'
  choices: ['$\tfrac23t\sin 3t$', '$\tfrac23t\cos 3t$', '$-\tfrac23t\sin 3t$', '$\tfrac49\cos 3t$']
  answer: 0
  explanation: |-
    $p'(r) = 2r$, so $p'(3i) = 6i$ and $z_p = \dfrac{4t}{6i}e^{3it} = -\tfrac23it(\cos 3t + i\sin 3t)$. The real part is $\tfrac23t\sin 3t$. Treating $\frac1i$ as $i$ gives the minus sign; $\tfrac23t\cos 3t$ forgets that dividing by $i$ turns cosine into sine; $\tfrac49\cos 3t$ divides by $k = 9$ as if there were no resonance.
- id: de-q-cg10
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'What is the complex gain $1/p(i\omega)$ of $x'' + 3x = F_0\cos 4t$?'
  choices: ['$\dfrac{3 + 4i}{25}$', '$\dfrac17$', '$\dfrac{3 - 4i}{25}$', '$\dfrac{3 - 4i}{5}$']
  answer: 2
  explanation: |-
    $p(4i) = 3 + 4i$, and $\dfrac{1}{3 + 4i} = \dfrac{3 - 4i}{(3 + 4i)(3 - 4i)} = \dfrac{3 - 4i}{25}$. Keeping $3 + 4i$ on top forgets the conjugate; $\tfrac17$ evaluates $p(4)$; dividing by 5 instead of 25 uses $|p|$ rather than $|p|^2$.
- id: de-q-cg11
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'Very slow forcing ($\omega$ near 0) of $mx'''' + \gamma x'' + kx = F_0\cos\omega t$ gives a steady state close to'
  choices: ['$\dfrac{F_0}{\gamma\omega}\sin\omega t$, a quarter cycle behind', '$\dfrac{F_0}{k}\cos\omega t$, nearly in phase with the force', 'almost no motion, half a cycle behind', '$\dfrac{F_0}{m}\cos\omega t$, nearly in phase']
  answer: 1
  explanation: |-
    As $\omega \to 0$, $p(i\omega) = (k - m\omega^2) + i\gamma\omega \to k$, so the gain approaches $1/k$ and the lag approaches 0: the spring just follows the slowly changing force. The quarter-cycle lag happens at $\omega_0$; almost no motion half a cycle behind is the fast-forcing limit; $F_0/m$ uses the wrong coefficient of $p$.
- id: de-q-cg12
  lesson: de-complex-gain
  topic: Complex gain
  stem: 'For $x'' + 2x = \cos(2\sqrt3\,t)$, by how much time does the response lag behind the input?'
  choices: ['$\dfrac\pi3 \approx 1.047$', '$\dfrac{\pi}{12\sqrt3} \approx 0.151$', '$\dfrac{2\pi}{\sqrt3} \approx 3.628$', '$\dfrac{\pi}{6\sqrt3} \approx 0.302$']
  answer: 3
  explanation: |-
    $p(2\sqrt3\,i) = 2 + 2\sqrt3\,i$ has angle $\arctan\sqrt3 = \tfrac\pi3$, so the time lag is $\phi/\omega = \dfrac{\pi/3}{2\sqrt3} = \dfrac{\pi}{6\sqrt3}$. $\tfrac\pi3$ is the phase lag in radians, not time; $0.151$ uses $\arctan\tfrac{1}{\sqrt3} = \tfrac\pi6$ (ratio inverted); $3.628$ multiplies by $\omega$ instead of dividing.
# Lesson 27
- id: de-q-2601
  lesson: de-higher-order
  module_quiz: true
  topic: Higher-order equations
  stem: 'Find the general solution of $y'''''' - 6y'''' + 11y'' - 6y = 0$.'
  choices: ['$c_1e^{-t} + c_2e^{-2t} + c_3e^{-3t}$', '$c_1e^t + c_2e^{6t} + c_3e^{11t}$', '$c_1e^t + c_2e^{2t} + c_3e^{3t}$', '$(c_1 + c_2t + c_3t^2)e^{2t}$']
  answer: 2
  explanation: |-
    $r = 1$ is a root; dividing leaves $r^2 - 5r + 6 = (r - 2)(r - 3)$.
- id: de-q-2602
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'Find the general solution of $y^{(4)} - y = 0$.'
  choices: ['$c_1e^t + c_2e^{-t}$', '$c_1e^t + c_2e^{-t} + c_3\cos t + c_4\sin t$', '$(c_1 + c_2t)e^t + (c_3 + c_4t)e^{-t}$', '$c_1\cos t + c_2\sin t + c_3t\cos t + c_4t\sin t$']
  answer: 1
  explanation: |-
    $r^4 - 1 = (r - 1)(r + 1)(r^2 + 1)$: roots $\pm 1$, $\pm i$. Four roots, four solutions.
- id: de-q-2603
  lesson: de-higher-order
  module_quiz: true
  topic: Higher-order equations
  stem: 'Find the general solution of $y'''''' + 3y'''' + 3y'' + y = 0$.'
  choices: ['$c_1e^{-t} + c_2e^{-t} + c_3e^{-t}$', '$(c_1 + c_2t + c_3t^2)e^{t}$', '$c_1e^{-t} + c_2te^{-t} + c_3e^{t}$', '$(c_1 + c_2t + c_3t^2)e^{-t}$']
  answer: 3
  explanation: |-
    $(r + 1)^3$: a triple root $-1$ gives $e^{-t}$, $te^{-t}$, $t^2e^{-t}$.
- id: de-q-2604
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'The characteristic polynomial of $y^{(4)} + 8y'''' + 16y = 0$ is $(r^2 + 4)^2$. The general solution is'
  choices: ['$c_1\cos 2t + c_2\sin 2t$', '$(c_1 + c_2t)\cos 2t + (c_3 + c_4t)\sin 2t$', '$c_1\cos 4t + c_2\sin 4t + c_3\cos 2t + c_4\sin 2t$', '$(c_1 + c_2t)e^{2t} + (c_3 + c_4t)e^{-2t}$']
  answer: 1
  explanation: |-
    $\pm 2i$ each have multiplicity 2, so the cosine and sine each also appear multiplied by $t$.
- id: de-q-2605
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'Solve $y'''''' - y'' = 0$, $y(0) = 3$, $y''(0) = 1$, $y''''(0) = 1$.'
  choices: ['$3 + \sinh t$', '$1 + e^t + e^{-t}$', '$3e^t$', '$2 + e^t$']
  answer: 3
  explanation: |-
    $y = c_1 + c_2e^t + c_3e^{-t}$. $c_2 - c_3 = 1$ and $c_2 + c_3 = 1$ give $c_2 = 1$, $c_3 = 0$; then $c_1 = 2$.
- id: de-q-2606
  lesson: de-higher-order
  topic: Higher-order equations
  stem: 'For $y'''''' - y'''' = 3t^2$, what is the correct form of the particular solution?'
  choices: ['$At^4 + Bt^3 + Ct^2$', '$At^2 + Bt + C$', '$t(At^2 + Bt + C)$', '$At^4$']
  answer: 0
  explanation: |-
