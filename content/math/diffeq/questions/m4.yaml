# Module 4: autonomous equations and numerical methods
- id: de-q-1401
  lesson: de-autonomous
  module_quiz: true
  topic: Autonomous equations
  stem: 'Find and classify the equilibria of $y'' = y^2 - 4y$.'
  choices: ['$y = 0$ unstable, $y = 4$ stable', '$y = 0$ stable, $y = 4$ unstable', 'both stable', '$y = 0$ semistable, $y = 4$ unstable']
  answer: 1
  explanation: |-
    $f(y) = y(y - 4)$ and $f'(y) = 2y - 4$. $f'(0) = -4 < 0$: stable. $f'(4) = 4 > 0$: unstable. (This is the reverse of logistic growth.)
- id: de-q-1402
  lesson: de-autonomous
  module_quiz: true
  topic: Autonomous equations
  stem: 'For $y'' = y^3 - 9y$ with $y(0) = 2$, what is $\lim_{t\to\infty} y(t)$?'
  choices: ['$3$', '$-3$', '$+\infty$', '$0$']
  answer: 3
  explanation: |-
    Equilibria $-3, 0, 3$. On $(0, 3)$, $f(1) = -8 < 0$, so the solution decreases from 2 toward the next equilibrium below, 0.
- id: de-q-1403
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'For $y'' = (y - 2)^2$, the equilibrium $y = 2$ is'
  choices: ['semistable', 'asymptotically stable', 'unstable', 'not an equilibrium']
  answer: 0
  explanation: |-
    $f \ge 0$ everywhere, so arrows point up on both sides: toward 2 from below, away from 2 above. The derivative test fails here since $f'(2) = 0$.
- id: de-q-1404
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'If $f(y^*) = 0$ and $f''(y^*) < 0$ for $y'' = f(y)$, then $y^*$ is'
  choices: ['unstable', 'semistable', 'asymptotically stable', 'impossible to classify']
  answer: 2
  explanation: |-
    $f$ decreases through zero, so it's positive just below $y^*$ (arrows up) and negative just above (arrows down): both point toward $y^*$.
- id: de-q-1405
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'Which equation can be analyzed with a phase line?'
  choices: ['$y'' = t\sin y$', '$y'' = y - t$', '$y'' = e^{-t}y$', '$y'' = \sin y$']
  answer: 3
  explanation: |-
    Phase lines need an autonomous equation $y' = f(y)$, with no explicit $t$.
- id: de-q-1406
  lesson: de-autonomous
  module_quiz: true
  topic: Autonomous equations
  stem: 'For $y'' = y(4 - y)$, solutions starting between 0 and 4 have an inflection point where'
  choices: ['$y = 0$', '$y = 2$', '$y = 4$', '$t = 2$']
  answer: 1
  explanation: |-
    $y'' = f'(y)f(y)$, and $f'(y) = 4 - 2y = 0$ at $y = 2$. The S-curve changes concavity halfway to the carrying capacity.
- id: de-q-1407
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'In $P'' = -rP(1 - P/T)(1 - P/K)$ with $0 < T < K$, what happens to a population starting just below $T$?'
  choices: ['It increases to $K$', 'It stays at $T$', 'It decreases to 0', 'It increases to $T$ and stops']
  answer: 2
  explanation: |-
    For $0 < P < T$, both factors in parentheses are positive, so $P' < 0$. $T$ is an unstable threshold; below it the population dies out.
- id: de-q-1408
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'The phase line of an equation has equilibria at $-1$ and $2$ with arrows: down below $-1$, up between $-1$ and $2$, down above $2$. Which equation matches?'
  choices: ['$y'' = (y + 1)(2 - y)$', '$y'' = (y + 1)(y - 2)$', '$y'' = (y - 1)(y + 2)$', '$y'' = -(y + 1)(2 - y)$']
  answer: 0
  explanation: |-
    At $y = 0$ (between), $(1)(2) > 0$: up. At $y = 3$: $(4)(-1) < 0$: down. At $y = -2$: $(-1)(4) < 0$: down. The choice $(y + 1)(y - 2)$ has every sign reversed.
- id: de-q-1409
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'Why can''t a solution of $y'' = y(4 - y)$ starting at $y(0) = 1$ ever exceed 4?'
  choices: ['$y = 4$ is a solution, and by uniqueness solution curves can''t cross', 'The derivative is negative for $0 < y < 4$', 'All solutions are bounded by their initial value', 'Because $f''(4) < 0$ means it is unstable']
  answer: 0
  explanation: |-
    $f$ and $f'$ are continuous, so uniqueness holds and the equilibrium solution $y = 4$ acts as a barrier. (The derivative is actually positive on $(0, 4)$.)
- id: de-q-1410
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'For $y'' = \cos y$, which equilibrium is asymptotically stable?'
  choices: ['$y = -\pi/2$', '$y = 0$', '$y = \pi/2$', '$y = \pi$']
  answer: 2
  explanation: |-
    Equilibria are where $\cos y = 0$: $\pm\pi/2, \pm 3\pi/2, \dots$. $f'(y) = -\sin y$; $f'(\pi/2) = -1 < 0$ (stable), $f'(-\pi/2) = 1 > 0$ (unstable). $0$ and $\pi$ are not equilibria.
- id: de-q-1411
  lesson: de-autonomous
  topic: Autonomous equations
  stem: 'A solution of an autonomous equation with continuous $f$ and $f''$ starts strictly between two consecutive equilibria. Which is true?'
  choices: ['It oscillates between them', 'It is monotonic and approaches one of the two equilibria', 'It reaches an equilibrium in finite time', 'It can leave the interval eventually']
  answer: 1
  explanation: |-
    $f$ has one sign on the interval, so $y$ is monotonic; it's trapped by uniqueness, and a bounded monotonic function has a limit, which must be an equilibrium.
# Lesson 15
- id: de-q-1501
  lesson: de-bifurcation
  module_quiz: true
  topic: Bifurcations
  stem: 'For harvesting $P'' = 0.5P(1 - P/1000) - h$, what is the bifurcation value of $h$?'
  choices: ['$h = 250$', '$h = 500$', '$h = 62.5$', '$h = 125$']
  answer: 3
  explanation: |-
    The maximum of $rP(1 - P/K)$ is $rK/4 = 0.5 \cdot 1000/4 = 125$. Above that, there are no equilibria and the population collapses.
- id: de-q-1502
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'For $P'' = P(1 - P/100) - 16$, what are the equilibria?'
  choices: ['$16$ and $84$', '$20$ and $80$', '$0$ and $100$', '$40$ and $60$']
  answer: 1
  explanation: |-
    $P^2 - 100P + 1600 = 0$ factors as $(P - 20)(P - 80) = 0$.
- id: de-q-1503
  lesson: de-bifurcation
  module_quiz: true
  topic: Bifurcations
  stem: 'For harvesting below the bifurcation value, the two equilibria $P_1 < P_2$ are'
  choices: ['$P_1$ stable, $P_2$ unstable', 'both stable', 'both unstable', '$P_1$ unstable, $P_2$ stable']
  answer: 3
  explanation: |-
    $f = rP(1 - P/K) - h$ is a downward parabola shifted down: negative below $P_1$, positive between, negative above $P_2$. So $P_1$ repels (a threshold) and $P_2$ attracts.
- id: de-q-1504
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'For $y'' = c + y^2$, how many equilibria are there when $c > 0$, $c = 0$, $c < 0$?'
  choices: ['0, 1, 2', '2, 1, 0', '1, 1, 1', '2, 2, 2']
  answer: 0
  explanation: |-
    $y^2 = -c$ has no real solutions for $c > 0$, one ($y = 0$) for $c = 0$, two ($\pm\sqrt{-c}$) for $c < 0$. This is a saddle-node bifurcation at $c = 0$.
- id: de-q-1505
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'Which bifurcation does $y'' = cy - y^3$ undergo at $c = 0$?'
  choices: ['Saddle-node', 'Transcritical', 'Pitchfork', 'None']
  answer: 2
  explanation: |-
    For $c \le 0$ only $y = 0$; for $c > 0$, $y = 0$ becomes unstable and two stable equilibria $\pm\sqrt c$ appear. One splitting into three is a pitchfork.
- id: de-q-1506
  lesson: de-bifurcation
  module_quiz: true
  topic: Bifurcations
  stem: 'For $y'' = y^2 - 6y + c$, what is the bifurcation value?'
  choices: ['$c = 6$', '$c = 3$', '$c = 36$', '$c = 9$']
  answer: 3
  explanation: |-
    Equilibria $y = 3 \pm \sqrt{9 - c}$ exist only when $c \le 9$; they merge at $c = 9$. Equivalently, solve $f = 0$ and $f_y = 2y - 6 = 0$: $y = 3$, $c = 9$.
- id: de-q-1507
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'In $y'' = cy - y^2$, what happens as $c$ increases through 0?'
  choices: ['Two equilibria collide and vanish', 'The equilibria $0$ and $c$ cross and exchange stability', 'One equilibrium splits into three', 'Nothing changes']
  answer: 1
  explanation: |-
    That's a transcritical bifurcation: for $c < 0$, 0 is stable and $c$ unstable; for $c > 0$ the roles swap.
- id: de-q-1508
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'Candidate bifurcation points of $y'' = f(y, c)$ are found by solving'
  choices: ['$f = 0$ and $\partial f/\partial c = 0$ together', '$f = c$', '$f = 0$ and $\partial f/\partial y = 0$ together', '$\partial f/\partial y = c$']
  answer: 2
  explanation: |-
    An equilibrium can appear, vanish or change stability only where $f'(y^*)$ (the derivative in $y$) is zero.
- id: de-q-1509
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'For $y'' = 4y - y^3$, classify the equilibria.'
  choices: ['$0$ unstable; $\pm 2$ stable', '$0$ stable; $\pm 2$ unstable', 'all stable', '$0$ semistable; $\pm 2$ stable']
  answer: 0
  explanation: |-
    $f'(y) = 4 - 3y^2$: $f'(0) = 4 > 0$ unstable; $f'(\pm2) = -8 < 0$ stable.
- id: de-q-1510
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'In a bifurcation diagram, what goes on each axis?'
  choices: ['Parameter horizontal, equilibrium values vertical', 'Time horizontal, solution vertical', 'Equilibrium values horizontal, parameter vertical', '$y$ horizontal, $f(y)$ vertical']
  answer: 0
  explanation: |-
    The diagram shows how equilibria depend on the parameter, so the parameter is the independent (horizontal) variable. Time plots and $f(y)$ graphs are different pictures.
- id: de-q-1511
  lesson: de-bifurcation
  topic: Bifurcations
  stem: 'A fishery harvests exactly at the maximum sustainable yield $h = rK/4$. Why is this risky?'
  choices: ['The population grows without bound', 'There are no equilibria at this harvest rate', 'The only equilibrium $K/2$ is semistable, so a dip below it leads to collapse', 'The population oscillates wildly']
  answer: 2
  explanation: |-
    At $h = rK/4$, $f \le 0$ everywhere with a double root at $K/2$. Populations above $K/2$ fall toward it; any population below it keeps falling to zero.
# Lesson 16
- id: de-q-1601
  lesson: de-improved-euler
  module_quiz: true
  topic: Numerical methods
  stem: 'One step of improved Euler with $h = 0.1$ for $y'' = y - t$, $y(0) = 2$ gives'
  choices: ['2.2', '2.205', '2.21', '2.105']
  answer: 1
  explanation: |-
    $k_1 = 2 - 0 = 2$. Predicted $y = 2.2$ at $t = 0.1$, so $k_2 = 2.2 - 0.1 = 2.1$. $y_1 = 2 + 0.05(2 + 2.1) = 2.205$. Plain Euler gives 2.2.
- id: de-q-1602
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'In improved Euler, $k_2$ is the slope evaluated at'
  choices: ['$(t_n + h/2,\ y_n + \tfrac h2 k_1)$', '$(t_n,\ y_n + hk_1)$', '$(t_n + h,\ y_n)$', '$(t_n + h,\ y_n + hk_1)$']
  answer: 3
  explanation: |-
    It's the slope at the end of the step, at the point an Euler step predicts. The midpoint version is a different second-order method (and one of RK4's slopes).
- id: de-q-1603
  lesson: de-improved-euler
  module_quiz: true
  topic: Numerical methods
  stem: 'A second-order method has error 0.008 at $t = 1$ with $h = 0.1$. About what error do you expect with $h = 0.05$?'
  choices: ['0.004', '0.002', '0.0005', '0.008']
  answer: 1
  explanation: |-
    Global error $\propto h^2$, so halving $h$ divides the error by 4: $0.008/4 = 0.002$.
- id: de-q-1604
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'Euler''s method has local truncation error proportional to'
  choices: ['$h$', '$h^3$', '$h^4$', '$h^2$']
  answer: 3
  explanation: |-
    The Taylor remainder after the linear term is $\tfrac{h^2}{2}y''(\xi)$. Accumulated over $L/h$ steps it gives global error proportional to $h$.
- id: de-q-1605
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'Why is the global error one power of $h$ lower than the local error?'
  choices: ['About $L/h$ steps are needed, and their local errors add up', 'Round-off error cancels one power', 'The last step is always exact', 'The global error is measured relative to $h$']
  answer: 0
  explanation: |-
    Roughly (number of steps) × (error per step) $= \dfrac{L}{h}\cdot Ch^{p+1} = LCh^p$.
- id: de-q-1606
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'Improved Euler for $y'' = f(t)$ (no $y$ dependence) is the same as which integration rule?'
  choices: ['The left-endpoint rule', 'Simpson''s rule', 'The trapezoid rule', 'The midpoint rule']
  answer: 2
  explanation: |-
    $y_{n+1} = y_n + \tfrac h2(f(t_n) + f(t_n + h))$ is the trapezoid rule. Euler is the left-endpoint rule; RK4 reduces to Simpson's rule.
- id: de-q-1607
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'One improved Euler step with $h = 0.2$ for $y'' = ty$, $y(1) = 1$ gives'
  choices: ['1.2', '1.288', '1.22', '1.244']
  answer: 3
  explanation: |-
    $k_1 = 1 \cdot 1 = 1$. Predicted $y = 1.2$ at $t = 1.2$, so $k_2 = 1.2 \times 1.2 = 1.44$. $y_1 = 1 + 0.1(1 + 1.44) = 1.244$.
- id: de-q-1608
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'Euler errors at $t = 1$ were 0.1245, 0.0650, 0.0332 for $h = 0.1, 0.05, 0.025$. What order does this suggest?'
  choices: ['2', '1', '4', '0.5']
  answer: 1
  explanation: |-
    Each halving of $h$ roughly halves the error (ratio about 1.9–2), so error $\propto h^1$.
- id: de-q-1609
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'Improved Euler is called a predictor-corrector method because'
  choices: ['it predicts the exact solution', 'it corrects round-off error', 'an Euler step predicts the endpoint, and averaging slopes corrects it', 'it uses the previous two steps']
  answer: 2
  explanation: |-
    The predictor $y_n + hk_1$ gives an endpoint estimate used only to compute $k_2$; the corrector step uses the average slope.
- id: de-q-1610
  lesson: de-improved-euler
  topic: Numerical methods
  stem: 'For $y'' = y$, $y(0) = 1$, one improved Euler step multiplies $y$ by'
  choices: ['$1 + h + \dfrac{h^2}{2}$', '$1 + h$', '$e^h$', '$1 + \dfrac{h}{2}$']
  answer: 0
  explanation: |-
    $k_1 = y$, $k_2 = y + hy$, so $y_1 = y + \tfrac h2(2y + hy) = y(1 + h + h^2/2)$, matching $e^h$ through the $h^2$ term (second order).
# Lesson 17
- id: de-q-1701
  lesson: de-runge-kutta
  module_quiz: true
  topic: Numerical methods
  stem: 'In RK4, what are the weights on $k_1, k_2, k_3, k_4$?'
  choices: ['$\tfrac16, \tfrac26, \tfrac26, \tfrac16$', '$\tfrac14$ each', '$\tfrac12, 0, 0, \tfrac12$', '$\tfrac16, \tfrac46, 0, \tfrac16$']
  answer: 0
  explanation: |-
    $y_{n+1} = y_n + \tfrac h6(k_1 + 2k_2 + 2k_3 + k_4)$. The midpoint slopes count double, as in Simpson's rule.
- id: de-q-1702
  lesson: de-runge-kutta
  module_quiz: true
  topic: Numerical methods
  stem: 'Halving the step size of RK4 reduces the global error by about a factor of'
  choices: ['4', '2', '16', '32']
  answer: 2
  explanation: |-
    RK4 is fourth order: error $\propto h^4$, and $2^4 = 16$.
- id: de-q-1703
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'For one RK4 step from $(t_n, y_n)$, $k_3$ is evaluated at'
  choices: ['$\left(t_n + \tfrac h2,\ y_n + \tfrac h2 k_1\right)$', '$\left(t_n + \tfrac h2,\ y_n + \tfrac h2 k_2\right)$', '$(t_n + h,\ y_n + hk_2)$', '$\left(t_n + \tfrac h2,\ y_n + hk_2\right)$']
  answer: 1
  explanation: |-
    $k_2$ and $k_3$ are both midpoint slopes; $k_2$ uses $k_1$ to reach the midpoint and $k_3$ uses $k_2$.
- id: de-q-1704
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'One RK4 step with $h = 0.1$ for $y'' = -y$, $y(0) = 1$ gives about'
  choices: ['0.9', '0.905', '0.9025', '0.9048375']
  answer: 3
  explanation: |-
    $k_1 = -1$, $k_2 = -0.95$, $k_3 = -0.9525$, $k_4 = -0.90475$. $y_1 = 1 + \tfrac{0.1}{6}(-1 - 1.9 - 1.905 - 0.90475) = 0.9048375$. The exact $e^{-0.1} = 0.90483742$ differs in the 7th decimal; 0.9 is Euler, 0.905 is improved Euler, and 0.9025 is two Euler half-steps.
- id: de-q-1705
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'If $f$ depends only on $t$, RK4 reduces to'
  choices: ['the trapezoid rule', 'Simpson''s rule', 'the midpoint rule', 'the left-endpoint rule']
  answer: 1
  explanation: |-
    Then $k_2 = k_3 = f(t_n + h/2)$ and the update is $\tfrac h6(f_0 + 4f_{1/2} + f_1)$, Simpson's rule.
- id: de-q-1706
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'One RK4 step with $h = 1$ for $y'' = 2t$, $y(0) = 0$ gives $y(1) \approx$'
  choices: ['0.5', '2', '0.9', '1, exactly right']
  answer: 3
  explanation: |-
    $k_1 = 0$, $k_2 = k_3 = 1$, $k_4 = 2$: $y_1 = \tfrac16(0 + 2 + 2 + 2) = 1$. Simpson's rule is exact for polynomials up to degree 3, and the exact answer is $t^2 = 1$.
- id: de-q-1707
  lesson: de-runge-kutta
  module_quiz: true
  topic: Numerical methods
  stem: 'How many evaluations of $f$ does one RK4 step need?'
  choices: ['4', '1', '2', '6']
  answer: 0
  explanation: |-
    One for each of $k_1$ through $k_4$. Euler needs 1 per step, improved Euler 2.
- id: de-q-1708
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'On a log–log plot of error against step size, RK4''s data fall on a line of slope about'
  choices: ['1', '2', '4', '$-4$']
  answer: 2
  explanation: |-
    Error $\approx Ch^4$ gives $\log(\text{error}) = \log C + 4\log h$: slope 4 (error decreases as $h$ decreases).
- id: de-q-1709
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'Euler''s method on $y'' = -50y$ with $h = 0.1$ produces values that'
  choices: ['decay smoothly to 0', 'stay constant', 'decay faster than the true solution', 'grow in size and alternate sign']
  answer: 3
  explanation: |-
    Each step multiplies by $1 - 50(0.1) = -4$, so the numbers flip sign and grow, while the true solution $e^{-50t}$ decays. This is the stiffness/stability problem: $h|\lambda| = 5 > 2$.
- id: de-q-1710
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'How is the second-order ODE $y'''' = -y$ prepared for RK4?'
  choices: ['Apply RK4 twice to $y''''$', 'Rewrite it as the system $y_1'' = y_2$, $y_2'' = -y_1$', 'Integrate once by hand first', 'RK4 cannot handle it']
  answer: 1
  explanation: |-
    With $y_1 = y$ and $y_2 = y'$, any higher-order equation becomes a first-order system, and RK4 applies with vector $k$'s.
- id: de-q-1711
  lesson: de-runge-kutta
  topic: Numerical methods
  stem: 'With $h = 0.5$ on $y'' = t + y$, $y(0) = 1$ to $t = 1$, the errors were: Euler 0.937, improved Euler 0.155, RK4 0.0019. What does this show?'
  choices: ['All three are equally accurate', 'RK4 is exact for this equation', 'Higher-order methods are far more accurate for the same step size', 'Improved Euler is the most efficient']
  answer: 2
  explanation: |-
    At the same $h$, RK4 is about 80 times more accurate than improved Euler here, for twice the work per step.
