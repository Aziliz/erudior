# Round 2, module de-m2 (Classification and first-order methods): new question types for the
# core lessons (de-m2-r2-q..) and questions for the three honors lessons (de-m2-r2-h..).

# ---- Lesson 6: classifying differential equations
- id: de-m2-r2-q01
  lesson: de-classification
  type: label
  module_quiz: true
  topic: Classification
  stem: |-
    The picture shows the linear equation $t^2y'' + 3ty' - (\sin t)\,y = e^t$ with four parts numbered. Name each numbered part.
  image: {src: images/de-m2-linear-parts-blank.svg, alt: 'The equation t² y″ + 3t y′ − (sin t) y = eᵗ. Marker 1 is on t², marker 2 on y″, marker 3 on (sin t), and marker 4 on eᵗ on the right side.'}
  labels:
    - {x: 14.69, y: 51.5, text: Leading coefficient}
    - {x: 23.13, y: 51.5, text: Highest derivative}
    - {x: 56.25, y: 51.5, text: Coefficient of y}
    - {x: 81.56, y: 51.5, text: Forcing term}
  distractors: [Initial condition, Nonlinear term]
  explanation: |-
    1: $t^2$ multiplies the top derivative, so it is the leading coefficient $a_2(t)$. 2: $y''$ is the highest derivative, which makes the equation second order. 3: $\sin t$ (with the minus sign, $a_0(t) = -\sin t$) is the coefficient of $y$; it depends only on $t$, so it doesn't spoil linearity. 4: $e^t$ is the forcing term $g(t)$, so the equation is nonhomogeneous. There is no nonlinear term: $y$, $y'$ and $y''$ all appear to the first power. Initial conditions are separate from the equation.

- id: de-m2-r2-q02
  lesson: de-classification
  type: match
  module_quiz: true
  topic: Classification
  stem: 'Match each equation to its classification. (A classification can be used more than once.)'
  pairs:
    - ['$y'''' + ty = 0$', Linear homogeneous ODE]
    - ['$y'''' + 4y = \cos t$', Linear nonhomogeneous ODE]
    - ['$y'' = y^2 - t$', Nonlinear ODE]
    - ['$\theta'''' + \sin\theta = 0$', Nonlinear ODE]
    - ['$u_t = 3u_{xx}$', Partial differential equation]
  explanation: |-
    $y'' + ty = 0$ is linear (the coefficient $t$ is allowed) with no forcing term. $y'' + 4y = \cos t$ is linear with forcing $\cos t$. $y^2$ and $\sin\theta$ make the next two nonlinear, even though $\sin\theta$ is close to $\theta$ for small angles. $u(x, t)$ depends on two variables, so the heat equation is a PDE.

- id: de-m2-r2-q03
  lesson: de-classification
  type: order
  topic: Classification
  stem: 'Put these equations in order from lowest order to highest order.'
  items:
    - '$(y'')^5 = t + y$'
    - '$y'''' = (y'')^3 + t^4$'
    - '$y'''''' = y^2$'
    - '$y^{(4)} + 9y = 0$'
  explanation: |-
    The order is the highest derivative that appears, and powers don't change it. $(y')^5 = t + y$ is first order (the 5 is a power), $y'' = (y')^3 + t^4$ is second order, $y''' = y^2$ is third order and $y^{(4)} + 9y = 0$ is fourth order.

- id: de-m2-r2-q04
  lesson: de-classification
  topic: Classification
  stem: 'Which equations are linear? Select all that apply.'
  choices:
    - '$t^2y'''' + e^ty = \ln t$'
    - '$y'' + y\cos t = 0$'
    - '$y'''' + \cos y = 0$'
    - '$yy'' = t$'
    - '$y'''''' = (\sin t)\,y'' + t^5$'
  answer: [0, 1, 4]
  explanation: |-
    Linear means $y$ and its derivatives appear only to the first power, unmultiplied and not inside other functions; the coefficients may be any functions of $t$. So $t^2y'' + e^ty = \ln t$, $y' + y\cos t = 0$ and $y''' = (\sin t)y' + t^5$ are linear. $\cos y$ puts the unknown inside a function, and $yy'$ multiplies the unknown by its derivative, so those two are nonlinear.

- id: de-m2-r2-q05
  lesson: de-classification
  type: text
  topic: Classification
  stem: |-
    The equation $(y')^4 + t^2y''' = e^t y$ has order ___. (Give only the number.)
  accept: ['3', three, third]
  explanation: |-
    The highest derivative is $y'''$, so the order is 3. The fourth power on $y'$ is a power, not a derivative; it makes the equation nonlinear but doesn't change the order.

# ---- Lesson 7: existence and uniqueness
- id: de-m2-r2-q06
  lesson: de-existence
  type: label
  module_quiz: true
  topic: Existence and uniqueness
  stem: 'The picture illustrates the existence and uniqueness theorem for $y'' = f(t, y)$, $y(t_0) = y_0$. Name each numbered part.'
  image: {src: images/de-m2-existence-rect-blank.svg, alt: 'A t–y plane with a shaded rectangle (marker 1 inside it). A dot inside the rectangle (marker 2) with a curve through it (marker 3 on the curve) that leaves through the top of the rectangle. A short highlighted interval on the t-axis around the dot''s t-value (marker 4), narrower than the rectangle.'}
  labels:
    - {x: 29.69, y: 29.55, text: Region where f and ∂f/∂y are continuous}
    - {x: 46.88, y: 44.32, text: 'Initial point (t₀, y₀)'}
    - {x: 59.73, y: 31.77, text: Solution curve}
    - {x: 41.41, y: 84.09, text: Interval where a solution is guaranteed}
  distractors: [Equilibrium solution, Point where uniqueness fails]
  explanation: |-
    1: the rectangle is where the hypotheses hold ($f$ and $\partial f/\partial y$ continuous). 2: the dot is the initial point $(t_0, y_0)$. 3: the curve through it is the solution. 4: the theorem guarantees the solution only on some interval $t_0 - h < t < t_0 + h$, which can be much shorter than the rectangle is wide; here the solution leaves through the top of the rectangle early. Nothing in the picture is an equilibrium (a horizontal solution), and uniqueness holds everywhere inside the rectangle.

- id: de-m2-r2-q07
  lesson: de-existence
  type: text
  topic: Existence and uniqueness
  stem: |-
    By the linear existence theorem, the solution of $(t + 2)y' + \dfrac{y}{t - 5} = \sqrt{t + 4}$, $y(-3) = 1$ is guaranteed to exist on the open interval $(a, b)$ with $a =$ ___ and $b =$ ___.
  accept:
    - ['-4']
    - ['-2']
  explanation: |-
    Standard form: $y' + \dfrac{1}{(t + 2)(t - 5)}y = \dfrac{\sqrt{t + 4}}{t + 2}$. $p$ breaks at $t = -2$ and $t = 5$; $g$ breaks at $t = -2$ and needs $t > -4$ for the square root (an open interval can't include $-4$, where $g$ is defined on one side only). The piece containing $t_0 = -3$ is $(-4, -2)$.

- id: de-m2-r2-q08
  lesson: de-existence
  module_quiz: true
  topic: Existence and uniqueness
  stem: |-
    For $y' = \dfrac{y^{2/3}}{t - 1}$ (with $y^{2/3} = (\sqrt[3]{y})^2$, defined for every $y$), at which initial points $(t_0, y_0)$ does the theorem guarantee a unique solution? Select all that apply.
  choices: ['$(0, 1)$', '$(2, -8)$', '$(3, 0)$', '$(1, 4)$', '$(-1, 2)$']
  answer: [0, 1, 4]
  explanation: |-
    $f = \dfrac{y^{2/3}}{t - 1}$ is continuous wherever $t \ne 1$, and $f_y = \dfrac{2}{3}\cdot\dfrac{y^{-1/3}}{t - 1}$ is continuous wherever $t \ne 1$ and $y \ne 0$. So the theorem applies at $(0, 1)$, $(2, -8)$ and $(-1, 2)$. At $(3, 0)$, $f_y$ is undefined ($y = 0$), and at $(1, 4)$ even $f$ is undefined.

- id: de-m2-r2-q09
  lesson: de-existence
  type: match
  topic: Existence and uniqueness
  stem: 'Match each IVP to what the existence and uniqueness theorems tell you.'
  pairs:
    - ['$y'' = y^2$, $y(0) = 1$', Unique solution on some interval around t₀]
    - ['$y'' + \dfrac{y}{t - 2} = 0$, $y(0) = 1$', 'Unique solution on all of (−∞, 2)']
    - ['$y'' = \sqrt{y}$, $y(0) = 0$', A solution exists but uniqueness is not guaranteed]
    - ['$y'' = \dfrac{1}{y}$, $y(0) = 0$', 'The theorems don''t apply: f is undefined there']
  distractors: [Unique solution for every t]
  explanation: |-
    $y' = y^2$ is nonlinear with $f$ and $f_y = 2y$ continuous, so the general theorem gives a unique solution on some interval (it actually blows up at $t = 1$). $y' + \frac{1}{t - 2}y = 0$ is linear with $p$ continuous on $(-\infty, 2)$, so the linear theorem gives that whole interval. For $\sqrt{y}$ at $y = 0$, $f$ is continuous but $f_y$ is not; existence holds and uniqueness in fact fails. $1/y$ isn't even defined at $y = 0$, so neither theorem applies.

- id: de-m2-r2-q10
  lesson: de-existence
  type: order
  topic: Existence and uniqueness
  stem: 'Put the steps for finding the guaranteed interval of a linear IVP in order.'
  items:
    - 'Divide by the coefficient of $y''$ to reach standard form $y'' + p(t)y = g(t)$'
    - 'Find every point where $p(t)$ or $g(t)$ is discontinuous or undefined'
    - 'Take the open interval between neighboring trouble points that contains $t_0$'
  explanation: |-
    The trouble points can only be read off after dividing, because zeros of the leading coefficient become discontinuities of $p$ and $g$. Once they are listed, the answer is the open piece of the number line that contains $t_0$.

# ---- Lesson 8: linear first-order equations
- id: de-m2-r2-q11
  lesson: de-linear-first
  type: order
  module_quiz: true
  topic: Linear first-order
  stem: 'Put the steps of the integrating-factor method in order.'
  items:
    - 'Write the equation as $y'' + p(t)y = g(t)$'
    - 'Compute $\mu = e^{\int p\,dt}$'
    - 'Rewrite the equation as $(\mu y)'' = \mu g$'
    - 'Integrate both sides, including the constant $C$'
    - 'Divide by $\mu$ and use the initial condition to find $C$'
  explanation: |-
    $p$ must be read from the standard form before $\mu$ can be computed. Multiplying by $\mu$ turns the left side into $(\mu y)'$, which can then be integrated (with $C$, or the initial condition can't be met). Dividing by $\mu$ gives $y$, and the initial condition fixes $C$.

- id: de-m2-r2-q12
  lesson: de-linear-first
  type: text
  topic: Linear first-order
  stem: |-
    For $ty' - 3y = t^5$ with $t > 0$, the integrating factor is $\mu = t^k$ with $k =$ ___.
  accept: ['-3']
  explanation: |-
    Standard form: $y' - \dfrac{3}{t}y = t^4$, so $p = -\dfrac3t$ and $\mu = e^{-3\ln t} = t^{-3}$. (Using $p = -3$ without dividing, or dropping the sign, gives the wrong factor.)

- id: de-m2-r2-q13
  lesson: de-linear-first
  topic: Linear first-order
  stem: 'Which equations are linear in $y$, so the integrating-factor method applies? Select all that apply.'
  choices:
    - '$y'' = ty + e^t$'
    - '$t^2y'' + (\sin t)\,y = 1$'
    - '$y'' = y^2 + t$'
    - '$y'' + e^{y} = t$'
    - '$y'' = \dfrac{y}{t} + \cos t$'
  answer: [0, 1, 4]
  explanation: |-
    $y' = ty + e^t$ is $y' - ty = e^t$; $t^2y' + (\sin t)y = 1$ becomes linear standard form after dividing by $t^2$; $y' = \frac{y}{t} + \cos t$ is $y' - \frac1t y = \cos t$. The other two contain $y^2$ and $e^y$, so they are nonlinear.

- id: de-m2-r2-q14
  lesson: de-linear-first
  type: match
  topic: Linear first-order
  stem: 'Match each equation ($t > 0$) to its integrating factor.'
  pairs:
    - ['$y'' + 2y = t$', e^(2t)]
    - ['$y'' - \dfrac{1}{t}y = t$', 1/t]
    - ['$y'' + 2ty = 0$', e^(t²)]
    - ['$ty'' + 2y = t^3$', t²]
  distractors: [e^(−2t), t]
  explanation: |-
    $\mu = e^{\int p\,dt}$ with $p$ read from standard form. $p = 2$ gives $e^{2t}$. $p = -\frac1t$ gives $e^{-\ln t} = \frac1t$. $p = 2t$ gives $e^{t^2}$. For $ty' + 2y = t^3$, divide by $t$ first: $p = \frac2t$ and $\mu = e^{2\ln t} = t^2$.

- id: de-m2-r2-q15
  lesson: de-linear-first
  module_quiz: true
  topic: Linear first-order
  stem: 'Solve $y'' + y = 2e^{t}$, $y(0) = 0$.'
  choices: ['$y = e^t - e^{-t}$', '$y = e^t + e^{-t}$', '$y = 2e^t - 2e^{-t}$', '$y = e^t - 1$']
  answer: 0
  explanation: |-
    $\mu = e^t$, so $(e^ty)' = 2e^{2t}$ and $e^ty = e^{2t} + C$. Divide: $y = e^t + Ce^{-t}$. $y(0) = 1 + C = 0$ gives $C = -1$. $e^t - 1$ comes from adding $C$ after dividing (forgetting to divide $C$ by $\mu$); $2e^t - 2e^{-t}$ forgets the $\frac12$ from integrating $2e^{2t}$; $e^t + e^{-t}$ has the wrong sign of $C$ and fails $y(0) = 0$.

# ---- Lesson 9: exact equations
- id: de-m2-r2-q16
  lesson: de-exact
  type: text
  topic: Exact equations
  stem: |-
    The equation $(2xy + y^3)\,dx + (x^2 + kxy^2)\,dy = 0$ is exact when $k =$ ___.
  accept: ['3']
  explanation: |-
    $M_y = 2x + 3y^2$ and $N_x = 2x + ky^2$. These agree for every $x$ and $y$ only when $k = 3$.

- id: de-m2-r2-q17
  lesson: de-exact
  type: order
  module_quiz: true
  topic: Exact equations
  stem: 'Put the steps for solving an exact equation $M\,dx + N\,dy = 0$ in order.'
  items:
    - 'Check that $M_y = N_x$'
    - 'Integrate $M$ with respect to $x$, adding a function $h(y)$'
    - 'Differentiate the result with respect to $y$ and set it equal to $N$ to find $h''(y)$'
    - 'Integrate $h''(y)$ to get $h(y)$'
    - 'Write $F(x, y) = C$ and use the initial condition to find $C$'
  explanation: |-
    Exactness must be checked first; then $F = \int M\,dx + h(y)$, matching $F_y = N$ gives $h'(y)$, integrating gives $h$, and the solutions are the level curves $F(x, y) = C$.

- id: de-m2-r2-q18
  lesson: de-exact
  topic: Exact equations
  stem: 'Which equations are exact? Select all that apply.'
  choices:
    - '$(2x + y)\,dx + (x + 2y)\,dy = 0$'
    - '$(y\cos x)\,dx + (\sin x + 1)\,dy = 0$'
    - '$xy\,dx + x^2\,dy = 0$'
    - '$3x^2y\,dx + (x^3 + e^y)\,dy = 0$'
    - '$y^2\,dx + xy\,dy = 0$'
  answer: [0, 1, 3]
  explanation: |-
    Compare $M_y$ with $N_x$. First: $1 = 1$. Second: $\cos x = \cos x$. Fourth: $3x^2 = 3x^2$. Third: $M_y = x$ but $N_x = 2x$. Fifth: $M_y = 2y$ but $N_x = y$.

- id: de-m2-r2-q19
  lesson: de-exact
  type: match
  topic: Exact equations
  stem: 'Match each finding about $M\,dx + N\,dy = 0$ to what it tells you.'
  pairs:
    - ['$M_y = N_x$', The equation is already exact]
    - ['$\dfrac{M_y - N_x}{N}$ depends only on $x$', 'An integrating factor μ(x) makes it exact']
    - ['$\dfrac{N_x - M_y}{M}$ depends only on $y$', 'An integrating factor μ(y) makes it exact']
    - ['$F_x = M$ and $F_y = N$', 'The solutions are the level curves F(x, y) = C']
  distractors: [The equation is separable]
  explanation: |-
    Equal mixed partials is the exactness test. The two quotient conditions are the special cases where an integrating factor depending on one variable exists. A potential function $F$ with $F_x = M$, $F_y = N$ makes $\frac{d}{dx}F(x, y) = 0$ along solutions, so they are level curves. None of these says the equation separates.

- id: de-m2-r2-q20
  lesson: de-exact
  module_quiz: true
  topic: Exact equations
  stem: 'Which integrating factor makes $y\,dx + (2x - ye^{y})\,dy = 0$ exact?'
  choices: ['$\mu = y$', '$\mu = x$', '$\mu = e^{y}$', '$\mu = \dfrac1y$']
  answer: 0
  explanation: |-
    $M_y = 1$, $N_x = 2$: not exact. $\dfrac{N_x - M_y}{M} = \dfrac{1}{y}$ depends only on $y$, so $\mu = e^{\int dy/y} = y$. Check: $y^2\,dx + (2xy - y^2e^y)\,dy$ has $M_y = 2y = N_x$. With $\mu = x$, $\mu = e^y$ or $\mu = 1/y$ the mixed partials still differ (for example, $\mu = 1/y$ gives $M_y = 0$ but $N_x = 2/y$).

# ---- Lesson 10: Bernoulli and homogeneous equations
- id: de-m2-r2-q21
  lesson: de-substitutions
  type: text
  topic: Substitutions
  stem: |-
    The Bernoulli equation $y' - 3y = t\,y^5$ becomes linear with the substitution $v = y^k$, where $k =$ ___.
  accept: ['-4']
  explanation: |-
    For $y' + py = qy^n$ the substitution is $v = y^{1-n}$. Here $n = 5$, so $k = 1 - 5 = -4$. (Using $y^{n}$ or $y^{n-1}$ is the usual slip.)

- id: de-m2-r2-q22
  lesson: de-substitutions
  type: match
  module_quiz: true
  topic: Substitutions
  stem: 'Match each equation to the substitution that solves it.'
  pairs:
    - ['$y'' + 2y = e^ty^3$', v = y^(−2)]
    - ['$y'' + \dfrac{y}{x} = x^2y^{1/2}$', v = y^(1/2)]
    - ['$y'' = \dfrac{y^2 + xy}{x^2}$', v = y/x]
    - ['$y'' = \cos(x - y)$', u = x − y]
  distractors: [v = y³, u = x + y]
  explanation: |-
    Bernoulli with $n = 3$ gives $v = y^{1-3} = y^{-2}$; with $n = \frac12$, $v = y^{1/2}$. $\frac{y^2 + xy}{x^2} = \left(\frac yx\right)^2 + \frac yx$ depends only on $y/x$. $\cos(x - y)$ is a function of the combination $x - y$, so $u = x - y$ gives $u' = 1 - \cos u$, which is separable.

- id: de-m2-r2-q23
  lesson: de-substitutions
  topic: Substitutions
  stem: 'Which equations are homogeneous in the sense $y'' = F(y/x)$? Select all that apply.'
  choices:
    - '$y'' = \dfrac{x^2 + 3y^2}{2xy}$'
    - '$y'' = \dfrac{y}{x} + \tan\dfrac{y}{x}$'
    - '$y'' = \dfrac{x + y + 1}{x}$'
    - '$y'' = \dfrac{x^3 + y^3}{xy^2}$'
    - '$y'' = \dfrac{y^2}{x}$'
  answer: [0, 1, 3]
  explanation: |-
    Replace $x, y$ by $\lambda x, \lambda y$: the first, second and fourth don't change (top and bottom have the same degree, or the right side is already a function of $y/x$). In $\frac{x + y + 1}{x}$ the $1$ gives $\frac{1}{\lambda x}$, and $\frac{y^2}{x}$ becomes $\lambda\frac{y^2}{x}$, so those two are not homogeneous.

- id: de-m2-r2-q24
  lesson: de-substitutions
  type: order
  topic: Substitutions
  stem: 'Put the steps for solving a Bernoulli equation in order.'
  items:
    - 'Write it as $y'' + p(t)y = q(t)y^n$ and read off $n$'
    - 'Set $v = y^{1-n}$ to get $v'' + (1 - n)pv = (1 - n)q$'
    - 'Solve that linear equation for $v$ with an integrating factor'
    - 'Convert back with $y = v^{1/(1-n)}$'
  explanation: |-
    You need $n$ before you can choose $v = y^{1-n}$; the substitution produces the linear equation, the integrating factor solves it, and only then can you return to $y$.

- id: de-m2-r2-q25
  lesson: de-substitutions
  module_quiz: true
  topic: Substitutions
  stem: 'Use $u = x + y$ to solve $y'' = (x + y)^2 - 1$ with $y(0) = 1$.'
  choices: ['$y = \dfrac{1}{1 - x} - x$', '$y = \dfrac{1}{1 - x}$', '$y = \tan\!\left(x + \tfrac{\pi}{4}\right) - x$', '$y = 1 + x^3/3$']
  answer: 0
  explanation: |-
    $u' = 1 + y' = u^2$, so $-\dfrac1u = x + C$. With $u(0) = 0 + 1 = 1$: $C = -1$, so $u = \dfrac{1}{1 - x}$ and $y = u - x = \dfrac{1}{1 - x} - x$. Forgetting to subtract $x$ gives $\dfrac{1}{1 - x}$; dropping the $-1$ (so $u' = 1 + u^2$) gives the tangent; $1 + x^3/3$ treats $y$ as if it were $0$ on the right side.

# ---- Honors: Picard iteration
- id: de-m2-r2-h01
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'Which integral equation is equivalent to the IVP $y'' = t\,y^2$, $y(1) = 3$?'
  choices: ['$y(t) = 3 + \displaystyle\int_1^t s\,y(s)^2\,ds$', '$y(t) = 3 + \displaystyle\int_0^t s\,y(s)^2\,ds$', '$y(t) = \displaystyle\int_1^t s\,y(s)^2\,ds$', '$y(t) = 3 + t\,y(t)^2$']
  answer: 0
  explanation: |-
    Integrate $y' = f(t, y)$ from the initial time $t_0 = 1$ to $t$: $y(t) - y(1) = \int_1^t s\,y(s)^2\,ds$. The lower limit must be $t_0 = 1$ (not 0), the $y_0 = 3$ must be added, and $3 + ty^2$ isn't an integral at all.

- id: de-m2-r2-h02
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'For $y'' = t + y$, $y(0) = 2$, what is the first Picard iterate $\varphi_1(t)$?'
  choices: ['$2 + 2t + \dfrac{t^2}{2}$', '$2t + \dfrac{t^2}{2}$', '$2 + t + \dfrac{t^2}{2}$', '$2 + 2t + t^2$']
  answer: 0
  explanation: |-
    $\varphi_0 = 2$, so $\varphi_1 = 2 + \int_0^t (s + 2)\,ds = 2 + \frac{t^2}{2} + 2t$. Leaving off the leading $2$ gives $2t + \frac{t^2}{2}$; using $\varphi_0 = 0$ inside $f$ loses the $2t$; forgetting to halve when integrating $s$ gives $t^2$.

- id: de-m2-r2-h03
  lesson: de-m2-h-picard
  type: text
  topic: Picard iteration
  stem: |-
    For $y' = 3y$, $y(0) = 1$, the second Picard iterate is $\varphi_2(t) = 1 + 3t + c\,t^2$ with $c =$ ___.
  accept: ['9/2', '4.5']
  explanation: |-
    $\varphi_1 = 1 + \int_0^t 3\,ds = 1 + 3t$, then $\varphi_2 = 1 + \int_0^t 3(1 + 3s)\,ds = 1 + 3t + \frac92t^2$. These are the Taylor polynomials of $e^{3t}$, whose $t^2$ coefficient is $\frac{3^2}{2!} = \frac92$.

- id: de-m2-r2-h04
  lesson: de-m2-h-picard
  type: order
  topic: Picard iteration
  stem: 'Put the steps of Picard iteration in order.'
  items:
    - 'Rewrite the IVP as $y(t) = y_0 + \int_{t_0}^t f(s, y(s))\,ds$'
    - 'Start with the constant guess $\varphi_0(t) = y_0$'
    - 'Substitute the current guess $\varphi_n(s)$ for $y$ inside $f$'
    - 'Integrate from $t_0$ to $t$ and add $y_0$ to get $\varphi_{n+1}(t)$'
    - 'Repeat until successive iterates agree closely enough'
  explanation: |-
    The integral equation defines the iteration, the constant $y_0$ is the first guess, and each new iterate is $y_0 + \int_{t_0}^t f(s, \varphi_n(s))\,ds$: substitute, then integrate. Repeating produces $\varphi_2, \varphi_3, \dots$, which converge on $|t - t_0| \le h$.

- id: de-m2-r2-h05
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'For $y'' = y^2$, $y(0) = 1$, which is $\varphi_2(t)$?'
  choices: ['$1 + t + t^2 + \dfrac{t^3}{3}$', '$1 + t + t^2 + t^3$', '$1 + t + \dfrac{t^2}{2}$', '$(1 + t)^2$']
  answer: 0
  explanation: |-
    $\varphi_1 = 1 + t$, and $\varphi_2 = 1 + \int_0^t (1 + s)^2\,ds = 1 + \frac{(1 + t)^3 - 1}{3} = 1 + t + t^2 + \frac{t^3}{3}$. $1 + t + t^2 + t^3$ is the start of the true solution $\frac{1}{1 - t}$, which $\varphi_2$ matches only through $t^2$. $1 + t + \frac{t^2}{2}$ is the iterate for $y' = y$, and $(1 + t)^2$ forgets to integrate.

- id: de-m2-r2-h06
  lesson: de-m2-h-picard
  type: text
  topic: Picard iteration
  stem: |-
    For $y' = y^2$, $y(0) = 1$, use the rectangle $|t| \le 1$, $|y - 1| \le 2$. The guaranteed interval is $|t| \le h$ with $h = \min(a, b/M)$. Give $h$ as an exact fraction: $h =$ ___.
  accept: ['2/9']
  explanation: |-
    Here $a = 1$ and $b = 2$, so $y$ ranges over $[-1, 3]$ and $M = \max y^2 = 9$. Then $h = \min\left(1, \frac29\right) = \frac29$.

- id: de-m2-r2-h07
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'Which statements about Picard iteration are true? Select all that apply.'
  choices:
    - 'Each new iterate comes from integrating, not differentiating.'
    - 'If $f$ and $f_y$ are continuous on $R$, the iterates converge for $|t - t_0| \le \min(a, b/M)$.'
    - 'The number $h = \min(a, b/M)$ is always the full interval on which the solution exists.'
    - 'For $y'' = y$, $y(0) = 1$, the iterates are the Taylor polynomials of $e^t$.'
    - 'When $f$ is only continuous, iterating from $y_0$ proves the solution is unique.'
  answer: [0, 1, 3]
  explanation: |-
    The iteration integrates, and with $f$, $f_y$ continuous it converges on $|t - t_0| \le h$; for $y' = y$ it produces $\sum t^k/k!$. But $h$ is only a guarantee: for $y' = y^2$, $y(0) = 1$ it is at most $\frac14$ while the solution lasts on $(-\infty, 1)$. And iteration doesn't prove uniqueness without a Lipschitz condition: for $y' = \sqrt{y}$, $y(0) = 0$ it finds $y = 0$, though $t^2/4$ is also a solution.

- id: de-m2-r2-h08
  lesson: de-m2-h-picard
  type: match
  topic: Picard iteration
  stem: 'On the rectangle $|t| \le 1$, $|y| \le 2$, match each $f(t, y)$ to the smallest bound $M$ with $|f| \le M$.'
  pairs:
    - ['$f = y^2$', '4']
    - ['$f = t + y$', '3']
    - ['$f = ty$', '2']
    - ['$f = \sin(ty)$', '1']
  distractors: ['8']
  explanation: |-
    $y^2 \le 4$ at $y = \pm 2$; $|t + y| \le 1 + 2 = 3$ at $t = 1, y = 2$; $|ty| \le 1 \cdot 2 = 2$; and $ty$ ranges over $[-2, 2]$, which contains $\frac{\pi}{2} \approx 1.57$, so $\sin(ty)$ reaches 1.

- id: de-m2-r2-h09
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'In the convergence proof, the gaps satisfy $|\varphi_{n+1} - \varphi_n| \le \dfrac{MK^nh^{n+1}}{(n+1)!}$. Why do the iterates converge even when $Kh$ is large?'
  choices: ['Because $(Kh)^n/n!$ tends to 0 for any fixed $Kh$', 'Because $h$ is always less than 1', 'Because each iterate is a polynomial', 'Because $M$ shrinks as $n$ grows']
  answer: 0
  explanation: |-
    The factorial eventually beats any power: $\sum (Kh)^n/n! = e^{Kh}$ converges for every $Kh$, so the gaps add up to a finite total. $h$ need not be less than 1, iterates need not be polynomials (they are whenever $f$ is a polynomial in $t$ and $y$), and $M$ is a fixed bound on $R$.

- id: de-m2-r2-h10
  lesson: de-m2-h-picard
  type: label
  topic: Picard iteration
  stem: 'The picture shows the rectangle $R$: $|t - t_0| \le a$, $|y - y_0| \le b$, on which $|f| \le M$, and the lines of slope $\pm M$ through $(t_0, y_0)$. Name each numbered part.'
  image: {src: images/de-m2-picard-cone-blank.svg, alt: 'A rectangle centered on a dot, with two lines crossing at the dot to form a bow-tie that touches the top and bottom of the rectangle. A t-axis runs below. Marker 1 is on the t-axis below the right edge of the rectangle; marker 2 is on the t-axis below where the bow-tie meets the top edge; marker 3 is on the top edge of the rectangle; marker 4 is on the rising line of the bow-tie.'}
  labels:
    - {x: 87.5, y: 85.71, text: t₀ + a}
    - {x: 61.28, y: 85.71, text: t₀ + b/M}
    - {x: 75.0, y: 16.67, text: Top edge y = y₀ + b}
    - {x: 57.81, y: 26.19, text: Line of slope M}
  distractors: [t₀ + M/b, Line of slope b]
  explanation: |-
    1: the right edge of $R$ is at $t_0 + a$. 2: the rising line $y = y_0 + M(t - t_0)$ reaches the top edge $y = y_0 + b$ when $t - t_0 = b/M$, so marker 2 is $t_0 + b/M$. 3: the top edge is $y = y_0 + b$. 4: the rising line has slope $M$, the steepest a solution can climb in $R$. Since $b/M < a$ here, $h = \min(a, b/M) = b/M$.

- id: de-m2-r2-h11
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'For $y'' = y^{1/3}$, $y(0) = 0$, which statement is correct?'
  choices: ['A solution exists, but it is not unique: $y = 0$ and $y = (2t/3)^{3/2}$ (for $t \ge 0$) both work.', 'No solution exists, because $f_y$ is undefined at $y = 0$.', 'Exactly one solution exists, because $f$ is continuous.', 'Picard iteration from $\varphi_0 = 0$ finds every solution.']
  answer: 0
  explanation: |-
    $f = y^{1/3}$ is continuous, so Peano's theorem gives existence, but it isn't Lipschitz at $0$. Check: $y = (2t/3)^{3/2}$ gives $y' = (2t/3)^{1/2} = y^{1/3}$. Continuity alone gives existence, not uniqueness, and iteration from $0$ only ever produces $\varphi_n = 0$.

- id: de-m2-r2-h12
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'For $y'' = 2t(1 + y)$, $y(0) = 0$, which is $\varphi_3(t)$?'
  choices: ['$t^2 + \dfrac{t^4}{2} + \dfrac{t^6}{6}$', '$t^2 + \dfrac{t^4}{2} + \dfrac{t^6}{3}$', '$t^2 + t^4 + t^6$', '$1 + t^2 + \dfrac{t^4}{2}$']
  answer: 0
  explanation: |-
    $\varphi_1 = t^2$, $\varphi_2 = \int_0^t 2s(1 + s^2)\,ds = t^2 + \frac{t^4}{2}$, and $\varphi_3 = \int_0^t 2s\left(1 + s^2 + \frac{s^4}{2}\right)ds = t^2 + \frac{t^4}{2} + \frac{t^6}{6}$, the partial sums of $e^{t^2} - 1$. $1 + t^2 + \frac{t^4}{2}$ starts from the wrong $y_0$.

- id: de-m2-r2-h13
  lesson: de-m2-h-picard
  topic: Picard iteration
  stem: 'For $y'' = y^2$, $y(0) = 1$, the theorem guarantees a solution only for $|t| \le \tfrac14$, but the solution $\dfrac{1}{1 - t}$ exists on $(-\infty, 1)$. What does this show?'
  choices: ['The guaranteed interval is a safe lower estimate; the true interval can be much longer.', 'The theorem is wrong for this equation.', 'The solution is not unique outside $|t| \le \tfrac14$.', 'Picard iteration diverges for $|t| > \tfrac14$.']
  answer: 0
  explanation: |-
    The theorem promises only what it can prove from bounds on one rectangle. Uniqueness still holds wherever $f = y^2$ is Lipschitz (everywhere, locally), so the solution stays unique beyond $\frac14$; the iterates' behavior beyond $h$ isn't settled by this argument either way.

# ---- Honors: Grönwall's inequality and continuous dependence
- id: de-m2-r2-h14
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'What is the smallest Lipschitz constant $L$ of $f(t, y) = 3\sin(2y)$ on the whole plane?'
  choices: ['$6$', '$3$', '$2$', '$1$']
  answer: 0
  explanation: |-
    $f_y = 6\cos(2y)$, whose largest size is 6, so $|f(t, y) - f(t, z)| \le 6|y - z|$, and no smaller constant works (near $y = 0$ the slope is 6). 3 is the bound on $|f|$, not on $f_y$; 2 forgets the outer 3.

- id: de-m2-r2-h15
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'Which functions satisfy a Lipschitz condition in $y$ on the region $0 \le t \le 1$, $|y| \le 1$? Select all that apply.'
  choices: ['$f = |y|$', '$f = \sqrt{|y|}$', '$f = y^3$', '$f = y^{1/3}$', '$f = (\sin t)\,y$']
  answer: [0, 2, 4]
  explanation: |-
    $\big||y| - |z|\big| \le |y - z|$ ($L = 1$, even without a derivative at 0). $y^3$ has $|f_y| = 3y^2 \le 3$. $(\sin t)y$ has $|f_y| = |\sin t| \le 1$. $\sqrt{|y|}$ and $y^{1/3}$ fail near $y = 0$: the ratio $|f(y) - f(0)|/|y|$ grows without bound as $y \to 0$.

- id: de-m2-r2-h16
  lesson: de-m2-h-gronwall
  type: text
  topic: Continuous dependence
  stem: |-
    Two solutions of $y' = 2\cos y$ start $0.05$ apart at $t = 0$. The continuous dependence estimate bounds their gap at $t = 1$ by ___ (round to 2 decimal places).
  accept: ['0.37']
  explanation: |-
    $|f_y| = |2\sin y| \le 2$, so $L = 2$ and the gap is at most $0.05e^{2 \cdot 1} = 0.05 \times 7.389 \approx 0.369$, which rounds to $0.37$.

- id: de-m2-r2-h17
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'A continuous $u(t) \ge 0$ satisfies $u(t) \le 2 + 3\displaystyle\int_0^t u(s)\,ds$ for $t \ge 0$. What does Grönwall''s inequality give?'
  choices: ['$u(t) \le 2e^{3t}$', '$u(t) \le 2 + 3t$', '$u(t) \le 3e^{2t}$', '$u(t) \le 2e^{t/3}$']
  answer: 0
  explanation: |-
    With $C = 2$ and $L = 3$, Grönwall gives $u \le Ce^{Lt} = 2e^{3t}$. The other choices swap $C$ and $L$, divide instead of multiply, or keep only the first step of an iteration.

- id: de-m2-r2-h18
  lesson: de-m2-h-gronwall
  type: order
  topic: Continuous dependence
  stem: 'Put the steps of the proof of Grönwall''s inequality in order.'
  items:
    - 'Let $U(t) = C + L\int_{t_0}^t u(s)\,ds$, so $u \le U$'
    - 'Differentiate: $U'' = Lu \le LU$'
    - 'Multiply by $e^{-L(t - t_0)}$: $\left(e^{-L(t - t_0)}U\right)'' \le 0$'
    - 'So $e^{-L(t - t_0)}U(t) \le U(t_0) = C$'
    - 'Since $u \le U$, conclude $u(t) \le Ce^{L(t - t_0)}$'
  explanation: |-
    Define $U$, use $u \le U$ to get the differential inequality, apply the integrating factor to see that $e^{-L(t - t_0)}U$ never increases from its starting value $C$, then pass the bound from $U$ back to $u$.

- id: de-m2-r2-h19
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'How does the estimate $|y(t) - z(t)| \le |y_0 - z_0|\,e^{L|t - t_0|}$ prove uniqueness?'
  choices: ['If $y_0 = z_0$, the right side is 0, so $y(t) = z(t)$ for all $t$.', 'It shows the gap shrinks to 0 as $t \to \infty$.', 'It shows that $L$ must be 0.', 'It shows solutions exist on the whole line.']
  answer: 0
  explanation: |-
    Two solutions of the same IVP start with zero gap, and $0 \cdot e^{L|t - t_0|} = 0$. The estimate allows the gap to grow (not shrink), says nothing forcing $L = 0$, and gives no information about how long solutions exist.

- id: de-m2-r2-h20
  lesson: de-m2-h-gronwall
  type: match
  topic: Continuous dependence
  stem: 'Match each statement to its name.'
  pairs:
    - ['$|f(t, y) - f(t, z)| \le L|y - z|$', Lipschitz condition]
    - ['$u \le C + L\int_{t_0}^t u$ implies $u \le Ce^{L(t - t_0)}$', Grönwall's inequality]
    - ['$f_y \le \lambda$ on the region', One-sided Lipschitz condition]
    - ['$|y(t) - z(t)| \le |y_0 - z_0|\,e^{L|t - t_0|}$', Continuous dependence estimate]
  distractors: [Picard iteration]
  explanation: |-
    The Lipschitz condition bounds how fast $f$ changes in $y$; Grönwall's inequality turns an integral inequality into an exponential bound; a one-sided condition bounds $f_y$ from above only; and the continuous dependence estimate is what you get by combining the first two.

- id: de-m2-r2-h21
  lesson: de-m2-h-gronwall
  type: text
  topic: Continuous dependence
  stem: |-
    A process follows $y' = 0.5\sin y$. Using the continuous dependence estimate, $y(4)$ is known to within $0.05$ if $y(0)$ is known to within $\delta$. The largest such $\delta$, to 4 decimal places, is ___.
  accept: ['0.0068']
  explanation: |-
    $L = 0.5$, so an initial error $\delta$ grows to at most $\delta e^{0.5 \cdot 4} = \delta e^2$. Require $\delta e^2 \le 0.05$: $\delta \le 0.05e^{-2} \approx 0.006767$, or $0.0068$.

- id: de-m2-r2-h22
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'Two solutions of $y'' = -2y + \sin t$ start $0.1$ apart at $t = 0$. What is their gap at $t = 3$?'
  choices: ['$0.1e^{-6}$', '$0.1e^{6}$', '$0.1$', '$0.1e^{-3}$']
  answer: 0
  explanation: |-
    The difference $w = y - z$ satisfies $w' = -2w$ (the $\sin t$ cancels), so $w = 0.1e^{-2t}$ and the gap at $t = 3$ is $0.1e^{-6}$. This matches the one-sided bound with $\lambda = -2$. The two-sided estimate ($L = 2$) would allow $0.1e^6$, a huge overestimate.

- id: de-m2-r2-h23
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'Which statements are true? Select all that apply.'
  choices:
    - 'The Grönwall bound on the gap between two solutions is often far larger than the actual gap.'
    - 'For $y'' = ky$ with $k > 0$, the continuous dependence estimate is exact.'
    - 'Continuous dependence means two solutions never move farther apart.'
    - 'If $f$ is Lipschitz, a small enough starting error keeps the error small on any fixed finite interval.'
    - 'A single first-order autonomous equation can show chaotic behavior.'
  answer: [0, 1, 3]
  explanation: |-
    The bound assumes the worst case at every instant (Example 1 was about 100 times too big), and it is attained by $y' = ky$, where the gap is exactly $|y_0 - z_0|e^{kt}$. Continuous dependence allows the gap to grow, by at most $e^{L|t - t_0|}$, which is finite on a finite interval. A single first-order autonomous equation has monotone solutions, so it can't be chaotic.

- id: de-m2-r2-h24
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'A model $y'' = f(t, y)$ with Lipschitz constant $L = 2$ is replaced by $z'' = g(t, z)$, where $|f - g| \le 0.001$. With the same start, what is the bound on $|y - z|$ at $t = 1$ (starting at $t = 0$)?'
  choices: ['about $0.0032$', 'about $0.0010$', 'about $0.0074$', 'about $0.0064$']
  answer: 0
  explanation: |-
    $|y - z| \le \frac{\varepsilon}{L}\left(e^{Lt} - 1\right) = \frac{0.001}{2}(e^2 - 1) \approx 0.0005 \times 6.389 \approx 0.0032$. $0.0074$ is $\varepsilon e^{2}$ and $0.0064$ forgets to divide by $L$; $0.0010$ ignores the growth.

- id: de-m2-r2-h25
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'Why is $f(y) = \sqrt{y}$ not Lipschitz on $0 \le y \le 1$?'
  choices: ['$\dfrac{\sqrt{y} - 0}{y - 0} = \dfrac{1}{\sqrt{y}}$ grows without bound as $y \to 0^+$.', '$\sqrt{y}$ is not continuous at $y = 0$.', '$\sqrt{y}$ is not bounded on $0 \le y \le 1$.', '$\sqrt{y}$ is decreasing.']
  answer: 0
  explanation: |-
    A Lipschitz constant must bound every difference quotient, and these blow up near 0. $\sqrt{y}$ is continuous, bounded by 1 on this interval and increasing, so none of those is the reason.

- id: de-m2-r2-h26
  lesson: de-m2-h-gronwall
  topic: Continuous dependence
  stem: 'For $y'' = \sin y$, solutions starting at 1 and 1.01 differ by only about $0.002$ at $t = 3$, while the bound $0.01e^3$ is about $0.2$. Why is the bound so pessimistic?'
  choices: ['Both solutions approach the stable equilibrium $\pi$, where nearby solutions squeeze together, and the bound can''t see that.', 'The Lipschitz constant of $\sin y$ is really $0.01$.', 'The solutions cross each other near $t = 3$.', 'Grönwall''s inequality only holds for linear equations.']
  answer: 0
  explanation: |-
    Near $y = \pi$, $f_y = \cos y \approx -1$, so the gap shrinks there; the two-sided estimate uses $|f_y| \le 1$ and assumes growth all the time. $L = 1$, solutions can't cross (uniqueness), and Grönwall applies to nonlinear equations.

# ---- Honors: Riccati and Clairaut equations
- id: de-m2-r2-h27
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'Which equation is a Riccati equation?'
  choices: ['$y'' = t^2 - y + 3y^2$', '$y'' = y^3 + t$', '$y'''' = y^2$', '$y'' = ty + e^t$']
  answer: 0
  explanation: |-
    A Riccati equation is first order and quadratic in $y$: $y' = q_0 + q_1y + q_2y^2$ with $q_2 \ne 0$. $y^3$ is cubic, $y'' = y^2$ is second order, and $y' = ty + e^t$ is linear.

- id: de-m2-r2-h28
  lesson: de-m2-h-riccati
  type: text
  topic: Riccati and Clairaut equations
  stem: |-
    If $y_1$ is one solution of a Riccati equation, the others are found by substituting $y = y_1 + {}$___, which makes the equation linear in the new unknown $v$.
  accept: ['1/v', 'v^(-1)', 'v^-1']
  explanation: |-
    With $y = y_1 + \frac1v$, the terms involving $y_1$ alone cancel (because $y_1$ is a solution) and multiplying by $-v^2$ leaves $v' = -(q_1 + 2q_2y_1)v - q_2$, a linear equation.

- id: de-m2-r2-h29
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'The Riccati equation $y'' = y^2 - ty + 1$ has the solution $y_1 = t$. With $y = t + \dfrac1v$, which linear equation does $v$ satisfy?'
  choices: ['$v'' + tv = -1$', '$v'' = -1$', '$v'' - tv = -1$', '$v'' + 3tv = -1$']
  answer: 0
  explanation: |-
    Here $q_0 = 1$, $q_1 = -t$, $q_2 = 1$, so $v' = -(q_1 + 2q_2y_1)v - q_2 = -(-t + 2t)v - 1 = -tv - 1$. Dropping the 2 gives $v' = -1$; sign slips give the other two.

- id: de-m2-r2-h30
  lesson: de-m2-h-riccati
  type: text
  topic: Riccati and Clairaut equations
  stem: |-
    The Riccati equation $y' = y^2 - \dfrac{6}{t^2}$ has two solutions of the form $y = \dfrac{c}{t}$. The positive value of $c$ is ___.
  accept: ['2']
  explanation: |-
    Substituting $y = c/t$: $-\frac{c}{t^2} = \frac{c^2 - 6}{t^2}$, so $c^2 + c - 6 = 0$, $(c + 3)(c - 2) = 0$, and $c = 2$ or $c = -3$.

- id: de-m2-r2-h31
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'The solutions of $y'' = 1 + (y - t)^2$ other than $y = t$ are $y = t + \dfrac{1}{C - t}$. For $y(0) = 1$, where does the solution blow up?'
  choices: ['$t = 1$', '$t = 2$', '$t = \tfrac12$', 'It never blows up, since the coefficients are polynomials.']
  answer: 0
  explanation: |-
    $y(0) = \frac1C = 1$ gives $C = 1$, so $y = t + \frac{1}{1 - t}$, which blows up at $t = 1$. Continuous coefficients prevent blow-up only for linear equations; this one is nonlinear.

- id: de-m2-r2-h32
  lesson: de-m2-h-riccati
  type: order
  topic: Riccati and Clairaut equations
  stem: 'Put the steps for solving a Riccati IVP with a guessed solution in order.'
  items:
    - 'Check that the guess $y_1$ satisfies the equation'
    - 'Substitute $y = y_1 + 1/v$'
    - 'Solve the linear equation $v'' = -(q_1 + 2q_2y_1)v - q_2$'
    - 'Write $y = y_1 + 1/v$ and use the initial condition'
  explanation: |-
    The substitution only cancels the nonlinear terms if $y_1$ really is a solution, so check it first. Then substitute, solve the resulting linear equation, and convert back before applying the initial condition.

- id: de-m2-r2-h33
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'The substitution $y = -\dfrac{u''}{u}$ turns $y'' = y^2 + t$ into which equation?'
  choices: ['$u'''' + tu = 0$', '$u'''' - tu = 0$', '$u'''' + t^2u = 0$', '$u'''' + u'' + t = 0$']
  answer: 0
  explanation: |-
    $y' = -\frac{u''}{u} + \frac{(u')^2}{u^2} = -\frac{u''}{u} + y^2$. Setting this equal to $y^2 + t$ gives $-\frac{u''}{u} = t$, so $u'' + tu = 0$ (Airy's equation, up to sign conventions; Lesson 38). This matches $u'' - q_1u' + q_0u = 0$ with $q_0 = t$, $q_1 = 0$.

- id: de-m2-r2-h34
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'Which statements about the Clairaut equation $y = xy'' + f(y'')$ are true? Select all that apply.'
  choices:
    - 'Every line $y = Cx + f(C)$ is a solution.'
    - 'A singular solution comes from the factor $x + f''(p) = 0$.'
    - 'The singular solution is the line obtained from one special value of $C$.'
    - 'The lines of the family touch the singular solution tangentially.'
    - 'A Clairaut equation is linear in $y$.'
  answer: [0, 1, 3]
  explanation: |-
    Differentiating gives $p'(x + f'(p)) = 0$. $p' = 0$ gives the lines; $x + f'(p) = 0$ gives the singular solution, which is not any member of the family but the curve all the lines touch. The term $f(y')$ is usually nonlinear in $y'$, so the equation is not linear.

- id: de-m2-r2-h35
  lesson: de-m2-h-riccati
  type: text
  topic: Riccati and Clairaut equations
  stem: |-
    The Clairaut equation $y = xy' + (y')^2$ has the singular solution $y = kx^2$ with $k =$ ___.
  accept: ['-1/4', '-0.25']
  explanation: |-
    $f(p) = p^2$, so $x = -f'(p) = -2p$, giving $p = -\frac x2$, and $y = xp + p^2 = -\frac{x^2}{2} + \frac{x^2}{4} = -\frac{x^2}{4}$. Check: $y' = -\frac x2$ and $x\left(-\frac x2\right) + \frac{x^2}{4} = -\frac{x^2}{4}$.

- id: de-m2-r2-h36
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'Which straight-line solutions of $y = xy'' + (y'')^2$ pass through $(1, 2)$?'
  choices: ['$y = x + 1$ and $y = -2x + 4$', '$y = x + 1$ only', '$y = 2x$ and $y = -x + 3$', 'None, because $(1, 2)$ is not on the singular solution']
  answer: 0
  explanation: |-
    The lines are $y = Cx + C^2$. Through $(1, 2)$: $C^2 + C - 2 = 0$, so $C = 1$ or $C = -2$, giving $y = x + 1$ and $y = -2x + 4$. $y = 2x$ and $y = -x + 3$ pass through the point but aren't of the form $Cx + C^2$. Points need not lie on the singular solution to have lines through them.

- id: de-m2-r2-h37
  lesson: de-m2-h-riccati
  type: match
  topic: Riccati and Clairaut equations
  stem: 'For $y = xy'' - (y'')^2$ (lines $y = Cx - C^2$, singular solution $y = x^2/4$), match each point to the solutions through it. (An answer can be used more than once.)'
  pairs:
    - ['$(3, 2)$', Two straight lines]
    - ['$(0, -1)$', Two straight lines]
    - ['$(2, 1)$', One tangent line and the parabola]
    - ['$(0, 1)$', No solutions]
  distractors: [Three straight lines]
  explanation: |-
    Lines through $(x_0, y_0)$ solve $C^2 - x_0C + y_0 = 0$, with discriminant $x_0^2 - 4y_0$. $(3, 2)$: $9 - 8 > 0$, two lines ($C = 1, 2$). $(0, -1)$: $0 + 4 > 0$, two lines ($C = \pm1$). $(2, 1)$ is on the parabola: one line ($C = 1$) plus the parabola itself. $(0, 1)$: $0 - 4 < 0$, above the parabola, so nothing passes through it.

- id: de-m2-r2-h38
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'Why does uniqueness fail at points of the parabola $y = x^2/4$ for $y = xy'' - (y'')^2$?'
  choices: ['In normal form $y'' = \tfrac12\left(x \pm \sqrt{x^2 - 4y}\right)$, and the partial derivative in $y$ blows up where $x^2 = 4y$.', 'The equation is linear there.', 'The lines $y = Cx - C^2$ cross the parabola at right angles.', 'The parabola is not a solution of the equation.']
  answer: 0
  explanation: |-
    $\frac{\partial}{\partial y}\left(\frac{x \pm \sqrt{x^2 - 4y}}{2}\right) = \mp\frac{1}{\sqrt{x^2 - 4y}}$, which is unbounded at the parabola, so the uniqueness theorem doesn't apply, and indeed the parabola and a tangent line pass through each of its points with the same slope. The lines are tangent, not perpendicular, and the parabola is a solution (the singular one).

- id: de-m2-r2-h39
  lesson: de-m2-h-riccati
  topic: Riccati and Clairaut equations
  stem: 'What did Joseph Liouville prove in 1841 about the Riccati equation $y'' = t^2 + y^2$?'
  choices: ['It cannot be solved by any finite combination of elementary functions and their integrals.', 'It has no solutions on any interval.', 'Every solution exists for all $t$.', 'It can be turned into a separable equation by $v = y/t$.']
  answer: 0
  explanation: |-
    Liouville showed that this Riccati equation has no solution expressible in finite terms with elementary functions and integrals (its solutions involve Bessel functions). Solutions do exist (the existence theorem applies), they blow up in finite time, and $v = y/t$ does not separate it.
