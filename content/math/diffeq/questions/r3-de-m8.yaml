# Round 3, module de-m8: questions for the honors lesson 37h3 (Lyapunov functions)
- id: de-m8-r3-h01
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'For $x'' = -x + 2y$, $y'' = -2x - y^3$ and $V = x^2 + y^2$, what is $\dot V$, the derivative of $V$ along trajectories?'
  choices: ['$-2x^2 + 8xy - 2y^4$', '$-x^2 - y^4$', '$-2x^2 - 2y^4$', '$-2x - 2y^3$']
  answer: 2
  explanation: |-
    $\dot V = V_xF + V_yG = 2x(-x + 2y) + 2y(-2x - y^3) = -2x^2 + 4xy - 4xy - 2y^4 = -2x^2 - 2y^4$. The cross terms cancel; $+8xy$ comes from a sign slip in one of them. Leaving out the factor 2 from $V_x = 2x$ gives $-x^2 - y^4$, and adding $F + G$ without multiplying by $V_x$ and $V_y$ is not the chain rule.
- id: de-m8-r3-h02
  lesson: de-m8-h-lyapunov
  type: text
  topic: Lyapunov functions
  stem: 'For $x'' = y$, $y'' = -2x - y + x^2$ and $V = 2x^2 + y^2$, find $\dot V$ at the point $(1, 2)$. $\dot V(1, 2) =$ ___'
  accept: ['-4']
  explanation: |-
    $\dot V = 4x \cdot y + 2y(-2x - y + x^2) = 4xy - 4xy - 2y^2 + 2x^2y = -2y^2 + 2x^2y$. At $(1, 2)$: $-8 + 4 = -4$.
- id: de-m8-r3-h03
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'A positive definite $V$ has $\dot V = -y^2$ near the origin, so $\dot V = 0$ on the whole $x$-axis. What does Lyapunov''s theorem by itself tell you about the equilibrium at the origin?'
  choices: ['It is Lyapunov stable; asymptotic stability needs a further argument such as LaSalle''s', 'It is asymptotically stable, because $\dot V \le 0$', 'It is unstable, because $\dot V$ is zero along a whole line', 'Nothing at all, because $\dot V$ is not negative away from the origin']
  answer: 0
  explanation: |-
    Case 1 of the theorem needs only $\dot V \le 0$ and gives stability. Case 2 (asymptotic stability) needs $\dot V < 0$ at every point except the origin, which fails on the $x$-axis. That does not make the origin unstable, and it does not make the theorem useless: you still get stability, and LaSalle's principle may then upgrade it, as for the damped pendulum.
- id: de-m8-r3-h04
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'Which of these quadratic forms are positive definite? Select all that apply.'
  choices: ['$x^2 + 3xy + 4y^2$', '$x^2 + 4xy + 3y^2$', '$2x^2 - 2xy + y^2$', '$x^2 - 2xy + y^2$']
  answer: [0, 2]
  explanation: |-
    $ax^2 + bxy + cy^2$ is positive definite exactly when $a > 0$ and $4ac - b^2 > 0$.
    - $x^2 + 3xy + 4y^2$: $16 - 9 = 7 > 0$. Yes.
    - $x^2 + 4xy + 3y^2$: $12 - 16 = -4 < 0$. No: at $(1, -1)$ it equals $-2$.
    - $2x^2 - 2xy + y^2$: $8 - 4 = 4 > 0$. Yes.
    - $x^2 - 2xy + y^2 = (x - y)^2$: $4 - 4 = 0$. No: it is zero all along the line $y = x$.
- id: de-m8-r3-h05
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'For $x'' = -x + 9y$, $y'' = -x - y$, the candidate $V = x^2 + y^2$ gives $\dot V = -2x^2 + 16xy - 2y^2$, which equals $12$ at $(1, 1)$. What follows?'
  choices: ['The origin is unstable', 'The origin is stable but not asymptotically stable', 'The origin is a saddle', 'Nothing about the origin; another $V$ might still work']
  answer: 3
  explanation: |-
    Lyapunov's theorem only runs one way: a candidate whose $\dot V$ is positive somewhere simply fails. Here $V = x^2 + 9y^2$ works ($\dot V = -2x^2 - 18y^2$), and the eigenvalues $-1 \pm 3i$ confirm a spiral sink, which is asymptotically stable, not a saddle.
- id: de-m8-r3-h06
  lesson: de-m8-h-lyapunov
  type: match
  topic: Lyapunov functions
  stem: 'In each case $V$ is positive definite near the equilibrium at the origin. Match the behavior of $\dot V$ near the origin to the conclusion it supports.'
  pairs:
    - ['$\dot V < 0$ except at the origin', Asymptotically stable]
    - ['$\dot V \le 0$, with $\dot V = 0$ on the $x$-axis', Stable (asymptotic stability not yet shown)]
    - ['$\dot V = 0$ everywhere', Stable but not asymptotically stable]
    - ['$\dot V > 0$ except at the origin', Unstable]
    - ['$\dot V$ takes both signs arbitrarily close to the origin', No conclusion from this V]
  explanation: |-
    Strictly negative $\dot V$ gives asymptotic stability; $\dot V \le 0$ gives stability, and LaSalle may give more. If $\dot V = 0$ everywhere, $V$ is conserved: a solution starting where $V = c > 0$ stays on that level curve, so it stays close but never approaches the origin. Positive $\dot V$ with $V$ positive near the origin is the mirror-image test for instability. A $\dot V$ of both signs means this candidate fails, nothing more.
- id: de-m8-r3-h07
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'At the origin, $x'' = y - x^3$, $y'' = -x - 3y^3$ has Jacobian $\begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix}$, a center. Using $V = x^2 + y^2$, what is the origin?'
  choices: ['A true center: stable but not asymptotically stable', 'Asymptotically stable', 'Unstable', 'Impossible to decide by any method']
  answer: 1
  explanation: |-
    $\dot V = 2x(y - x^3) + 2y(-x - 3y^3) = -2x^4 - 6y^4$, negative except at the origin, and $V$ is positive definite: asymptotically stable. The linear terms only rotate solutions; the cubic terms pull them slowly inward. This is exactly the case where linearization is inconclusive and a Lyapunov function decides.
- id: de-m8-r3-h08
  lesson: de-m8-h-lyapunov
  type: order
  topic: Lyapunov functions
  stem: 'Put the steps of the LaSalle argument for $x'' = y$, $y'' = -x^3 - 2y$ in order.'
  items:
    - 'Write $E = \tfrac12y^2 + \tfrac14x^4$ and check that it is positive definite'
    - 'Compute $\dot E = -2y^2 \le 0$'
    - 'Find where $\dot E = 0$: the $x$-axis'
    - 'Show that only the origin stays on the $x$-axis, since $y'' = -x^3 \ne 0$ there when $x \ne 0$'
    - 'Conclude that every solution tends to the origin'
  explanation: |-
    You need $E$ before you can differentiate it, $\dot E$ before you know where it vanishes, and that set before you can find the largest invariant set inside it. Here that set is only the origin, so LaSalle's principle (with the bounded sets $E \le c$) sends every solution to the origin. ($\dot E = x^3y + y(-x^3 - 2y) = -2y^2$.)
- id: de-m8-r3-h09
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'For $x'' = y$, $y'' = -x - y^3$, the energy $E = \tfrac12(x^2 + y^2)$ has $\dot E = -y^4$, which is zero on the $x$-axis. In the LaSalle argument, why can no solution except the origin stay on the $x$-axis?'
  choices: ['Because $\dot E < 0$ at every point of the $x$-axis', 'Because $E$ is radially unbounded', 'Because on the $x$-axis $y'' = -x$, which is nonzero unless $x = 0$, so the solution leaves the axis', 'Because the linearization at the origin is a center']
  answer: 2
  explanation: |-
    A solution staying on the $x$-axis has $y \equiv 0$, so $y' \equiv 0$; but there $y' = -x - 0 = -x$, which forces $x = 0$. So the largest invariant set where $\dot E = 0$ is the origin alone. $\dot E$ is zero, not negative, on the axis; radial unboundedness matters for the global conclusion, not for this step; and the linearization being a center is why we needed LaSalle in the first place.
- id: de-m8-r3-h10
  lesson: de-m8-h-lyapunov
  type: text
  topic: Lyapunov functions
  stem: 'For $x'' = -x + x^3$, $y'' = -y$ and $V = x^2 + y^2$, $\dot V = -2x^2 + 2x^4 - 2y^2$. What is the largest $R$ such that $\dot V < 0$ at every point with $0 < x^2 + y^2 < R^2$? Give only the number. $R =$ ___'
  accept: ['1']
  explanation: |-
    $\dot V = -2x^2(1 - x^2) - 2y^2$. Inside the disk of radius 1 every point has $|x| < 1$, so both terms are $\le 0$, and they are not both zero unless $x = y = 0$. For any $R > 1$, the point $(x, 0)$ with $1 < x < R$ has $\dot V = 2x^2(x^2 - 1) > 0$. So $R = 1$, and the open unit disk lies in the basin of the origin. The true basin is larger: the whole strip $-1 < x < 1$, since $x = \pm1$ are equilibria of the $x$-equation and $y$ always decays.
- id: de-m8-r3-h11
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'For $\mathbf{x}'' = A\mathbf{x}$ with $A = \begin{bmatrix} -1 & 2 \\ -2 & -3 \end{bmatrix}$, take $V = \mathbf{x}^{T}\mathbf{x} = x^2 + y^2$ (so $P = I$). Using $\dot V = \mathbf{x}^{T}(A^{T}P + PA)\mathbf{x}$, what is $\dot V$?'
  choices: ['$-2x^2 - 6y^2$', '$-x^2 - 3y^2$', '$-2x^2 - 8xy - 6y^2$', '$2x^2 + 6y^2$']
  answer: 0
  explanation: |-
    With $P = I$, $A^{T}P + PA = A^{T} + A = \begin{bmatrix} -2 & 0 \\ 0 & -6 \end{bmatrix}$ (the off-diagonal entries $2$ and $-2$ cancel). So $\dot V = -2x^2 - 6y^2$, negative except at the origin. Directly: $2x(-x + 2y) + 2y(-2x - 3y) = -2x^2 - 6y^2$. Forgetting the factor 2 gives $-x^2 - 3y^2$.
- id: de-m8-r3-h12
  lesson: de-m8-h-lyapunov
  type: label
  topic: Lyapunov functions
  stem: 'The picture illustrates why $\dot V \le 0$ gives stability. Name the numbered parts.'
  image: {src: images/de-m8-lyapunov-proof-blank.svg, alt: 'A dashed circle around a central point. Inside it, a tilted shaded oval touches the circle at its two far ends. A small disk surrounds the central point, and a red curve with an arrow starts on the small disk''s edge, swings out beyond it, and spirals in toward the center. Four numbered markers: 1 on the dashed circle, 2 on the oval, 3 on the red curve, 4 on the central point.'}
  labels:
    - {x: 66.3, y: 74.1, text: Circle of radius epsilon}
    - {x: 70.6, y: 54.3, text: Level curve V = m}
    - {x: 34.2, y: 45.7, text: Trajectory}
    - {x: 44.2, y: 50, text: Equilibrium}
  distractors: [Separatrix, Limit cycle]
  explanation: |-
    $m$ is the smallest value of $V$ on the circle of radius $\varepsilon$, so the level curve $V = m$ lies inside the circle and touches it where that minimum is reached. A solution that starts in the small $\delta$-disk around the equilibrium starts with $V < m$; since $V$ never increases, it stays inside the oval and so inside the circle. The red curve may move farther from the equilibrium for a while, but never to a higher level of $V$.
- id: de-m8-r3-h13
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'What was new about the "direct method" in Lyapunov''s 1892 dissertation?'
  choices: ['It classified equilibria by the eigenvalues of the Jacobian', 'It proved that a bounded planar trajectory approaches a closed orbit or an equilibrium', 'It gave the first numerical method for solving systems', 'It decided stability from a function and its derivative along trajectories, without solving the equations']
  answer: 3
  explanation: |-
    Lyapunov''s second, or direct, method generalizes the energy argument: find a positive definite $V$ and check the sign of $\dot V = V_xF + V_yG$, which needs no solutions. The trapping-region result is the Poincaré–Bendixson theorem (Lesson 90), and classification by Jacobian eigenvalues is the linearization of Lesson 37.
- id: de-m8-r3-h14
  lesson: de-m8-h-lyapunov
  type: text
  topic: Lyapunov functions
  stem: 'For $x'' = -2x + 3y$, $y'' = -6x - y$, choose $w$ so that $V = x^2 + wy^2$ has no $xy$ term in $\dot V$. $w =$ ___'
  accept: ['1/2']
  explanation: |-
    $\dot V = 2x(-2x + 3y) + 2wy(-6x - y) = -4x^2 + (6 - 12w)xy - 2wy^2$. The cross term vanishes when $w = \tfrac12$, leaving $\dot V = -4x^2 - y^2$, negative except at the origin. So the origin is asymptotically stable (as the trace $-3$ and determinant $20$ confirm).
- id: de-m8-r3-h15
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'For the damped pendulum $x'' = y$, $y'' = -\sin x - cy$ with $E = \tfrac12y^2 + 1 - \cos x$, the oval region $E < 2$ around the origin lies in the basin of attraction. Why is the level 2 the natural limit?'
  choices: ['Because $\dot E = -2y^2$ when $c = 2$', 'Because $E = 2$ at the upright equilibria $(\pm\pi, 0)$, so a larger level region around the origin would reach them', 'Because $E$ is at most 2 everywhere in the plane', 'Because the linearization at the origin has determinant 2']
  answer: 1
  explanation: |-
    At $(\pm\pi, 0)$, $E = 0 + 1 - \cos\pi = 2$. For $c < 2$ the piece of $E \le c$ around the origin is a closed oval inside $|x| < \pi$, and LaSalle sends everything in it to the origin. At level 2 the curve runs into the saddles, which are equilibria and so can't be in the origin''s basin. $E$ is unbounded (it grows with $y$), and the determinant of the linearization is 1.
- id: de-m8-r3-h16
  lesson: de-m8-h-lyapunov
  topic: Lyapunov functions
  stem: 'Suppose $V = \dfrac{x^2}{1 + x^2} + y^2$ satisfies $\dot V < 0$ everywhere except at the origin for some system. What does that prove?'
  choices: ['Global asymptotic stability, since $\dot V < 0$ everywhere else', 'Only Lyapunov stability', 'Asymptotic stability, but not global asymptotic stability, because $V$ is not radially unbounded', 'Nothing, because $V$ is not a quadratic form']
  answer: 2
  explanation: |-
    $V$ is positive definite and $\dot V < 0$ away from the origin, so the origin is asymptotically stable. But $\frac{x^2}{1 + x^2} < 1$ for all $x$, so the level sets $V = c$ with $c \ge 1$ are unbounded and a solution could drift off to infinity while $V$ decreases toward 1. The global conclusion needs a radially unbounded $V$. Lyapunov functions need not be quadratic.
