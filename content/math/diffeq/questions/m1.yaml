- id: de-q-0508
  lesson: de-euler
  module_quiz: true
  topic: Euler's method
  stem: 'Two Euler steps of $h = 0.1$ for $\dfrac{dy}{dt} = -2y$, $y(0) = 3$ give $y(0.2) \approx 1.92$. The exact value is $3e^{-0.4} \approx 2.01$. Why is the estimate low?'
  choices: ['Solutions are concave down, so tangent lines lie below them', 'Solutions are concave up ($y'''' = 4y > 0$), so tangent lines lie below them', 'The step size is negative', 'Euler''s method always underestimates']
  answer: 1
  explanation: |-
    $y'' = -2y' = 4y > 0$, so the solution is concave up and each tangent line undershoots. Euler's method overestimates on concave-down solutions, so "always underestimates" is false.
- id: de-q-0509
  lesson: de-euler
  topic: Euler's method
  stem: 'For which equation is Euler''s method exact for every step size (with $y(0) = 1$)?'
  choices: ['$y'' = 3y$', '$y'' = 3x$', '$y'' = 3$', '$y'' = y^2$']
  answer: 2
  explanation: |-
    $y' = 3$ has the line $y = 3x + 1$ as solution, and a line is its own tangent line, so Euler follows it exactly. The others have curved solutions.
- id: de-q-0510
  lesson: de-euler
  topic: Euler's method
  stem: 'One Euler step of size $h = 0.5$ for $y'' = x^2 - y$, $y(2) = 1$ estimates $y(2.5)$ as'
