# Lesson 5: Euler
- id: de-q-0501
  lesson: de-euler
  module_quiz: true
  topic: Euler's method
  stem: 'Use one Euler step with $h = 0.2$ for $y'' = x + 2y$, $y(1) = 3$. What is the estimate of $y(1.2)$?'
  choices: ['3.4', '4.4', '10', '4.48']
  answer: 1
  explanation: |-
    Slope at $(1, 3)$: $1 + 6 = 7$. Then $y_1 = 3 + 0.2(7) = 4.4$. Forgetting to multiply by $h$ gives 10.
- id: de-q-0502
  lesson: de-euler
  module_quiz: true
  topic: Euler's method
  stem: 'Use two Euler steps with $h = 0.5$ for $y'' = y - x$, $y(0) = 2$, to estimate $y(1)$.'
  choices: ['3.75', '4', '4.5', '4.25']
  answer: 3
  explanation: |-
    Step 1: slope $2 - 0 = 2$, so $y_1 = 3$ at $x = 0.5$. Step 2: slope $3 - 0.5 = 2.5$, so $y_2 = 3 + 0.5(2.5) = 4.25$. Using the slope at $x = 0$ for both steps gives 4.
- id: de-q-0503
  lesson: de-euler
  topic: Euler's method
  stem: 'Solutions of $y'' = f(x, y)$ are concave down on $[0, 1]$. An Euler estimate of $y(1)$ will be'
  choices: ['too small', 'too large', 'exact', 'too large or too small depending on $h$']
  answer: 1
  explanation: |-
    On a concave-down curve, tangent lines lie above the curve, so following them overestimates.
- id: de-q-0504
  lesson: de-euler
  topic: Euler's method
  stem: 'For $y'' = ky$, Euler''s method with step $h$ gives which formula for $y_n$?'
  choices: ['$y_0e^{knh}$', '$y_0(1 + k)^{nh}$', '$y_0 + nkh$', '$y_0(1 + kh)^n$']
  answer: 3
  explanation: |-
    Each step is $y_{n+1} = y_n + hky_n = (1 + kh)y_n$, so $n$ steps multiply by $(1 + kh)^n$. $y_0e^{knh}$ is the exact solution, which Euler only approaches as $h \to 0$.
- id: de-q-0505
  lesson: de-euler
  topic: Euler's method
  stem: 'With Euler''s method, halving the step size typically does what to the error at a fixed point?'
  choices: ['Roughly halves it', 'Roughly quarters it', 'Leaves it unchanged', 'Doubles it']
  answer: 0
  explanation: |-
    Euler's method is first order: the global error is roughly proportional to $h$. Quartering would be a second-order method such as improved Euler (Module 4).
