- id: de-q-0507
  lesson: de-euler
  topic: Euler's method
  stem: 'Find the error in this Euler step for $y'' = xy$, $y(1) = 2$, $h = 0.1$: "slope $= 1.1 \times 2 = 2.2$, so $y(1.1) \approx 2 + 0.1(2.2) = 2.22$."'
  choices: ['The slope should be multiplied by $x$ again', 'The step should add $2.2$, not $0.22$', 'There is no error', 'The slope should use $x = 1$, giving $y(1.1) \approx 2.2$']
  answer: 3
