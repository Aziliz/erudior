# Round 2, module de-m8 (systems): new question types for the core lessons (q) and the honors lessons (h)

# ---------- Lesson 33: Systems of first-order equations ----------
- id: de-m8-r2-q01
  lesson: de-systems-intro
  type: text
  topic: Linear systems
  stem: 'Convert $y'''' - 4y'' + 3y = 0$ to $\mathbf{x}'' = A\mathbf{x}$ with $x_1 = y$ and $x_2 = y''$. The first row of $A$ is $(0, 1)$, and the second row is ( ___ , ___ ).'
  accept:
    - ['-3']
    - ['4']
  explanation: |-
    $x_2' = y'' = -3y + 4y' = -3x_1 + 4x_2$, so the second row is $(-3, 4)$. Solving for $y''$ moves each term to the other side, which flips its sign.
- id: de-m8-r2-q02
  lesson: de-systems-intro
  type: label
  module_quiz: true
  topic: Linear systems
  stem: 'In the two-tank example, $Q_1'' = -0.1Q_1 + 0.05Q_2$ and $Q_2'' = 0.1Q_1 - 0.1Q_2$. Name the numbered pipes.'
  image: {src: images/de-m8-two-tanks-blank.svg, alt: 'Two side-by-side tanks of 100 liters labeled Tank 1 and Tank 2. Pipe 1 brings water into tank 1 from the top left. Pipe 2, low between the tanks, flows from tank 1 to tank 2. Pipe 3, higher between the tanks, flows from tank 2 to tank 1. Pipe 4 carries water out of tank 2 on the right.'}
  labels:
    - {x: 17.2, y: 17.5, text: Pure water in at 5 L/min}
    - {x: 52.3, y: 67.5, text: Tank 1 to tank 2 at 10 L/min}
    - {x: 52.3, y: 47.5, text: Tank 2 to tank 1 at 5 L/min}
    - {x: 93, y: 70, text: Out of tank 2 at 5 L/min}
  distractors: [Out of tank 1 at 5 L/min, Brine in at 5 L/min]
  explanation: |-
    The term $-0.1Q_1$ says tank 1 loses $10/100$ of its salt per minute, so 10 L/min leave tank 1, all of it through pipe 2 into tank 2. Tank 2 sends 5 L/min back (pipe 3, the $+0.05Q_2$ term in $Q_1'$) and 5 L/min out (pipe 4), 10 L/min in total, giving $-0.1Q_2$. Water entering through pipe 1 is pure, so it adds no salt term. Nothing leaves tank 1 except through pipe 2.
- id: de-m8-r2-q03
  lesson: de-systems-intro
  type: order
  topic: Linear systems
  stem: 'Put the steps for solving $\mathbf{x}'' = A\mathbf{x}$, $\mathbf{x}(0) = \mathbf{x}_0$ (a $2 \times 2$ matrix with distinct real eigenvalues) in order.'
  items:
    - 'Write the characteristic equation $\lambda^2 - (\operatorname{tr}A)\lambda + \det A = 0$'
    - 'Solve it for the eigenvalues $\lambda_1$, $\lambda_2$'
    - 'Find an eigenvector for each eigenvalue from $(A - \lambda I)\mathbf{v} = \mathbf{0}$'
    - 'Write $\mathbf{x} = c_1e^{\lambda_1t}\mathbf{v}^{(1)} + c_2e^{\lambda_2t}\mathbf{v}^{(2)}$'
    - 'Solve $c_1\mathbf{v}^{(1)} + c_2\mathbf{v}^{(2)} = \mathbf{x}_0$ for the constants'
  explanation: |-
    Each step needs the one before it: the eigenvalues come from the characteristic equation, each eigenvector needs its eigenvalue, the general solution needs both eigenpairs, and the initial condition fixes the constants in the general solution.
- id: de-m8-r2-q04
  lesson: de-systems-intro
  module_quiz: true
  topic: Linear systems
  stem: 'Which vectors are eigenvectors of $A = \begin{bmatrix} 1 & 1 \\ 4 & 1 \end{bmatrix}$? Select all that apply.'
  choices: ['$\begin{bmatrix} 1 \\ 2 \end{bmatrix}$', '$\begin{bmatrix} -1 \\ 2 \end{bmatrix}$', '$\begin{bmatrix} 2 \\ 1 \end{bmatrix}$', '$\begin{bmatrix} 0 \\ 0 \end{bmatrix}$']
  answer: [0, 1]
  explanation: |-
    $A(1, 2) = (3, 6) = 3(1, 2)$ and $A(-1, 2) = (1, -2) = -1 \cdot (-1, 2)$, so both are eigenvectors (for $\lambda = 3$ and $\lambda = -1$; $(-1, 2)$ is a multiple of $(1, -2)$). $A(2, 1) = (3, 9)$ is not a multiple of $(2, 1)$. The zero vector is never an eigenvector.
- id: de-m8-r2-q05
  lesson: de-systems-intro
  type: match
  topic: Linear systems
  stem: 'Match each phase-plane term to its meaning for $\mathbf{x}'' = A\mathbf{x}$.'
  pairs:
    - [Trajectory, A solution curve traced in the x1x2-plane]
    - [Phase portrait, A picture showing several trajectories]
    - [Critical point, A point where Ax = 0]
    - [Direction field, Velocity arrows Ax drawn at many points]
  distractors: [A graph of x1 against t]
  explanation: |-
    The phase plane plots $(x_1(t), x_2(t))$ with time hidden: one solution curve is a trajectory, several make a phase portrait, the arrows $A\mathbf{x}$ form the direction field, and where $A\mathbf{x} = \mathbf{0}$ nothing moves (an equilibrium, or critical point). A graph of $x_1$ against $t$ is a time plot, not a phase-plane object.

# ---------- Lesson 34: Real eigenvalues and phase portraits ----------
- id: de-m8-r2-q06
  lesson: de-eigen-real
  type: label
  module_quiz: true
  topic: Phase portraits
  stem: 'Each panel is the phase portrait of $\mathbf{x}'' = A\mathbf{x}$ for a matrix with real eigenvalues. Dashed lines are eigenvector directions. Name each numbered portrait.'
  image: {src: images/de-m8-real-portraits-blank.svg, alt: 'Four phase portraits in a grid. Panel 1: trajectories come in along one dashed line and leave along the other. Panel 2: every trajectory flows into the origin. Panel 3: every trajectory flows out of the origin. Panel 4: a thick line through the origin with straight trajectories moving toward it from both sides.'}
  labels:
    - {x: 25, y: 46.6, text: Saddle point}
    - {x: 75, y: 46.6, text: Nodal sink}
    - {x: 25, y: 97.5, text: Nodal source}
    - {x: 75, y: 97.5, text: Line of equilibria}
  distractors: [Spiral sink, Center]
  explanation: |-
    Panel 1 has straight-line solutions coming in along one eigenvector and leaving along the other: eigenvalues of opposite sign, a saddle. In panel 2 everything flows in (both eigenvalues negative), and panel 3 is the same picture with the arrows reversed (both positive). Panel 4 has a zero eigenvalue: every point of the thick line is an equilibrium. No trajectory rotates, so there are no spirals or centers: those need complex eigenvalues.
- id: de-m8-r2-q07
  lesson: de-eigen-real
  topic: Phase portraits
  stem: 'For which matrices is the origin of $\mathbf{x}'' = A\mathbf{x}$ a saddle point? Select all that apply.'
  choices: ['$\begin{bmatrix} 3 & -2 \\ 2 & -2 \end{bmatrix}$', '$\begin{bmatrix} 1 & 4 \\ 1 & 1 \end{bmatrix}$', '$\begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$', '$\begin{bmatrix} -2 & 1 \\ 1 & -2 \end{bmatrix}$']
  answer: [0, 1]
  explanation: |-
    A saddle means eigenvalues of opposite sign, which happens exactly when $\det A < 0$. The determinants are $-6 + 4 = -2$, $1 - 4 = -3$, $12 - 2 = 10$ and $4 - 1 = 3$. The third matrix is a nodal source (eigenvalues 2 and 5) and the fourth a nodal sink ($-1$ and $-3$).
- id: de-m8-r2-q08
  lesson: de-eigen-real
  type: text
  topic: Phase portraits
  stem: 'A system has eigenvalue $-1$ with eigenvector $(1, 1)$ and eigenvalue $-3$ with eigenvector $(1, -1)$. For the solution $\mathbf{x} = c_1e^{-t}(1, 1) + c_2e^{-3t}(1, -1)$ with $\mathbf{x}(0) = (4, 2)$: $c_1 =$ ___ and $c_2 =$ ___.'
  accept:
    - ['3']
    - ['1']
  explanation: |-
    At $t = 0$ the exponentials are 1, so $c_1(1, 1) + c_2(1, -1) = (4, 2)$: $c_1 + c_2 = 4$ and $c_1 - c_2 = 2$. Adding gives $c_1 = 3$, then $c_2 = 1$.
- id: de-m8-r2-q09
  lesson: de-eigen-real
  type: match
  topic: Phase portraits
  stem: 'Match each pair of eigenvalues of a $2 \times 2$ matrix to the type of the origin.'
  pairs:
    - ['$\lambda = 2$ and $\lambda = -5$', Saddle point]
    - ['$\lambda = -1$ and $\lambda = -4$', Nodal sink]
    - ['$\lambda = 1$ and $\lambda = 6$', Nodal source]
    - ['$\lambda = 0$ and $\lambda = -2$', Line of equilibria]
  distractors: [Center]
  explanation: |-
    Opposite signs give a saddle, two negatives a sink, two positives a source. A zero eigenvalue means $\det A = 0$, so the eigenvector for 0 is a whole line of equilibria. A center needs purely imaginary eigenvalues, which none of these are.
- id: de-m8-r2-q10
  lesson: de-eigen-real
  module_quiz: true
  topic: Phase portraits
  stem: 'A nodal sink has eigenvalue $-1$ with eigenvector $(1, 0)$ and eigenvalue $-5$ with eigenvector $(0, 1)$. As $t \to \infty$, a typical trajectory approaches the origin'
  choices: ['tangent to the $x_2$-axis', 'tangent to the $x_1$-axis', 'along the line $x_2 = x_1$', 'by spiraling around it']
  answer: 1
  explanation: |-
    $\mathbf{x} = c_1e^{-t}(1, 0) + c_2e^{-5t}(0, 1)$. The $e^{-5t}$ term dies much faster, so near the origin the solution is mostly $c_1e^{-t}(1, 0)$: it comes in tangent to the slow eigenvector, the $x_1$-axis. The $x_2$-axis is the fast eigenvector. Real eigenvalues give no rotation, so there is no spiraling.

# ---------- Lesson 35: Complex and repeated eigenvalues ----------
- id: de-m8-r2-q11
  lesson: de-eigen-complex
  type: label
  module_quiz: true
  topic: Phase portraits
  stem: 'Name each numbered phase portrait.'
  image: {src: images/de-m8-complex-portraits-blank.svg, alt: 'Four phase portraits in a grid. Panel 1: trajectories spiral inward to the origin. Panel 2: a trajectory spirals outward from the origin. Panel 3: nested closed ellipses around the origin. Panel 4: trajectories flow straight into the origin, all becoming tangent to one dashed line.'}
  labels:
    - {x: 25, y: 46.6, text: Spiral sink}
    - {x: 75, y: 46.6, text: Spiral source}
    - {x: 25, y: 97.5, text: Center}
    - {x: 75, y: 97.5, text: Improper node}
  distractors: [Saddle point, Proper node (star)]
  explanation: |-
    Spirals come from complex eigenvalues $\alpha \pm i\beta$: inward when $\alpha < 0$ (panel 1), outward when $\alpha > 0$ (panel 2). Closed orbits mean $\alpha = 0$, a center (panel 3). Panel 4 has no rotation and only one eigenvector direction, which all trajectories become tangent to: a repeated eigenvalue with one eigenvector, an improper node. A proper node (star) would have straight rays in every direction.
- id: de-m8-r2-q12
  lesson: de-eigen-complex
  type: text
  topic: Phase portraits
  stem: 'The matrix $A = \begin{bmatrix} 1 & -5 \\ 1 & -3 \end{bmatrix}$ has eigenvalues $\alpha \pm i\beta$ with $\beta > 0$. Then $\alpha =$ ___ and $\beta =$ ___.'
  accept:
    - ['-1']
    - ['1']
  explanation: |-
    $T = 1 - 3 = -2$ and $D = -3 + 5 = 2$, so $\lambda^2 + 2\lambda + 2 = 0$ and $\lambda = \dfrac{-2 \pm \sqrt{4 - 8}}{2} = -1 \pm i$. So $\alpha = -1$ and $\beta = 1$: a spiral sink.
- id: de-m8-r2-q13
  lesson: de-eigen-complex
  type: order
  topic: Phase portraits
  stem: 'Put the steps for solving $\mathbf{x}'' = A\mathbf{x}$ when $A$ has a repeated eigenvalue with only one eigenvector in order.'
  items:
    - 'Find the repeated eigenvalue $\lambda$ from $\lambda^2 - T\lambda + D = 0$'
    - 'Find an eigenvector $\mathbf{v}$ from $(A - \lambda I)\mathbf{v} = \mathbf{0}$'
    - 'Find a generalized eigenvector $\mathbf{w}$ from $(A - \lambda I)\mathbf{w} = \mathbf{v}$'
    - 'Write $\mathbf{x} = c_1e^{\lambda t}\mathbf{v} + c_2e^{\lambda t}(t\mathbf{v} + \mathbf{w})$'
  explanation: |-
    The eigenvector needs $\lambda$, the generalized eigenvector's equation has $\mathbf{v}$ on its right side, and the general solution uses all three.
- id: de-m8-r2-q14
  lesson: de-eigen-complex
  topic: Phase portraits
  stem: 'A real $2 \times 2$ matrix $A$ has eigenvalues $\pm 3i$. Which statements are true? Select all that apply.'
  choices: ['Trajectories of $\mathbf{x}'' = A\mathbf{x}$ are closed curves around the origin', 'The trace of $A$ is 0', 'Every solution tends to the origin as $t \to \infty$', '$\det A < 0$']
  answer: [0, 1]
  explanation: |-
    Purely imaginary eigenvalues give a center: closed orbits that neither approach nor leave the origin, so solutions do not tend to 0. The eigenvalues add up to the trace, $3i - 3i = 0$, and multiply to the determinant, $(3i)(-3i) = 9 > 0$.
- id: de-m8-r2-q15
  lesson: de-eigen-complex
  type: match
  module_quiz: true
  topic: Phase portraits
  stem: 'Match each trace $T$ and determinant $D$ to the type of the origin.'
  pairs:
    - ['$T = -3$, $D = 2$', Nodal sink]
    - ['$T = 2$, $D = 5$', Spiral source]
    - ['$T = 0$, $D = 4$', Center]
    - ['$T = -4$, $D = 4$', Node with a repeated eigenvalue]
    - ['$T = 1$, $D = -6$', Saddle point]
  distractors: [Spiral sink]
  explanation: |-
    $D < 0$ is a saddle. Otherwise compare $T^2$ with $4D$: $9 > 8$ gives a node (sink, since $T < 0$); $4 < 20$ a spiral (source, since $T > 0$); $T = 0$ with $D > 0$ a center; $16 = 16$ a repeated eigenvalue ($\lambda = -2$).

# ---------- Lesson 36: Nonhomogeneous systems and the matrix exponential ----------
- id: de-m8-r2-q16
  lesson: de-nonhomog-systems
  type: text
  module_quiz: true
  topic: Nonhomogeneous systems
  stem: 'The system $\mathbf{x}'' = \begin{bmatrix} -2 & 1 \\ 1 & -2 \end{bmatrix}\mathbf{x} + \begin{bmatrix} 3 \\ 0 \end{bmatrix}$ has a constant (equilibrium) solution $\mathbf{x}_p$. Its entries are ___ and ___ (first entry first).'
  accept:
    - ['2']
    - ['1']
  explanation: |-
    A constant $\mathbf{a}$ needs $A\mathbf{a} + \mathbf{b} = \mathbf{0}$: $-2a_1 + a_2 = -3$ and $a_1 - 2a_2 = 0$. The second gives $a_1 = 2a_2$; then $-3a_2 = -3$, so $a_2 = 1$ and $a_1 = 2$. Check: $A(2, 1) = (-3, 0)$, and adding $(3, 0)$ gives $\mathbf{0}$.
- id: de-m8-r2-q17
  lesson: de-nonhomog-systems
  type: order
  topic: Nonhomogeneous systems
  stem: 'Put the steps of variation of parameters for $\mathbf{x}'' = A\mathbf{x} + \mathbf{g}(t)$ in order.'
  items:
    - 'Find a fundamental matrix $\Psi(t)$ of the homogeneous system'
    - 'Compute $\Psi(t)^{-1}$'
    - 'Form $\mathbf{u}'' = \Psi^{-1}\mathbf{g}$'
    - 'Integrate to get $\mathbf{u}(t)$'
    - 'Multiply: $\mathbf{x}_p = \Psi(t)\mathbf{u}(t)$'
  explanation: |-
    Substituting $\mathbf{x} = \Psi\mathbf{u}$ leaves $\Psi\mathbf{u}' = \mathbf{g}$, so you need $\Psi$, then its inverse, then $\mathbf{u}'$, then $\mathbf{u}$, and finally the product $\Psi\mathbf{u}$.
- id: de-m8-r2-q18
  lesson: de-nonhomog-systems
  module_quiz: true
  topic: Matrix exponential
  stem: 'Which statements about the matrix exponential $e^{At}$ are true for every constant square matrix $A$? Select all that apply.'
  choices: ['It equals $I$ at $t = 0$', 'Its derivative is $Ae^{At}$', 'It is the matrix whose entries are $e^{a_{ij}t}$', 'It equals $\Psi(t)\Psi(0)^{-1}$ for any fundamental matrix $\Psi$']
  answer: [0, 1, 3]
  explanation: |-
    From the series $I + At + \frac{A^2t^2}{2!} + \cdots$: at $t = 0$ only $I$ is left, and term-by-term differentiation gives $Ae^{At}$. $\Psi(t)\Psi(0)^{-1}$ solves the same matrix IVP, so it is equal. Entrywise exponentials are right only for diagonal matrices.
- id: de-m8-r2-q19
  lesson: de-nonhomog-systems
  topic: Matrix exponential
  stem: 'Find $e^{At}$ for $A = \begin{bmatrix} 3 & 1 \\ 0 & 3 \end{bmatrix}$.'
  choices: ['$\begin{bmatrix} e^{3t} & e^{t} \\ 1 & e^{3t} \end{bmatrix}$', '$e^{3t}\begin{bmatrix} 1 & 3t \\ 0 & 1 \end{bmatrix}$', '$e^{3t}\begin{bmatrix} 1 & t \\ 0 & 1 \end{bmatrix}$', '$e^{3t}\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$']
  answer: 2
  explanation: |-
    $A = 3I + N$ with $N = \begin{bmatrix} 0 & 1 \\ 0 & 0 \end{bmatrix}$ and $N^2 = 0$, so $e^{At} = e^{3t}(I + Nt)$. The first choice exponentiates each entry, which only works for diagonal matrices; the others put the wrong factor in the corner.
- id: de-m8-r2-q20
  lesson: de-nonhomog-systems
  type: match
  topic: Nonhomogeneous systems
  stem: 'For $\mathbf{x}'' = A\mathbf{x} + \mathbf{g}(t)$, where $A$ has eigenvalues $-1$ and $3$, match each forcing $\mathbf{g}$ to the simplest method that works.'
  pairs:
    - ['$\mathbf{g} = (2, -1)$', Try a constant vector]
    - ['$\mathbf{g} = e^{2t}(1, 0)$', Try e^(2t) times a constant vector]
    - ['$\mathbf{g} = t(1, 1)$', Try t times a vector plus another vector]
    - ['$\mathbf{g} = e^{-t}(0, 4)$', Variation of parameters]
  distractors: [Try sin t times a constant vector]
  explanation: |-
    Constant forcing gets a constant guess (the equilibrium), and $e^{2t}$ forcing gets $e^{2t}\mathbf{a}$ because 2 is not an eigenvalue. Linear forcing gets $t\mathbf{a}_1 + \mathbf{a}_0$. Variation of parameters would also work for these three, but the guesses are simpler. The rate $-1$ is an eigenvalue, so the simple guess $e^{-t}\mathbf{a}$ fails; variation of parameters handles it (as in Lesson 36, Example 4).

# ---------- Lesson 37: Nonlinear systems and linearization ----------
- id: de-m8-r2-q21
  lesson: de-nonlinear
  type: text
  module_quiz: true
  topic: Nonlinear systems
  stem: 'For the predator–prey system $x'' = 2x - 0.5xy$, $y'' = -y + 0.25xy$, the coexistence equilibrium has prey $x =$ ___ and predators $y =$ ___.'
  accept:
    - ['4']
    - ['4']
  explanation: |-
    With $a = 2$, $\alpha = 0.5$, $c = 1$, $\gamma = 0.25$, the equilibrium is $(c/\gamma, a/\alpha) = (1/0.25, 2/0.5) = (4, 4)$. Check: $2 - 0.5 \cdot 4 = 0$ and $-1 + 0.25 \cdot 4 = 0$.
- id: de-m8-r2-q22
  lesson: de-nonlinear
  type: order
  topic: Nonlinear systems
  stem: 'Lotka–Volterra trajectories circle the coexistence point. Starting with "Prey are plentiful and predators are few", put one cycle in order.'
  items:
    - 'Prey are plentiful and predators are few'
    - 'Predators increase, with plenty of food'
    - 'Prey decline under heavy predation'
    - 'Predators decline for lack of food'
    - 'Prey recover while predators are scarce'
  explanation: |-
    In the phase plane (prey across, predators up) the motion is counterclockwise: plentiful prey make predators grow; many predators drive prey down; scarce prey make predators decline; few predators let prey recover. The predator peak lags the prey peak by about a quarter cycle.
- id: de-m8-r2-q23
  lesson: de-nonlinear
  topic: Nonlinear systems
  stem: 'Consider $x'' = y$, $y'' = x - x^3$. Which statements are true? Select all that apply.'
  choices: ['$(1, 0)$ and $(-1, 0)$ are equilibria', 'The origin is a saddle point', 'Linearization shows that $(1, 0)$ is a spiral sink', 'The origin is asymptotically stable']
  answer: [0, 1]
  explanation: |-
    Equilibria need $y = 0$ and $x - x^3 = x(1 - x)(1 + x) = 0$: $x = 0, \pm1$. $J = \begin{bmatrix} 0 & 1 \\ 1 - 3x^2 & 0 \end{bmatrix}$. At the origin $D = -1 < 0$: a saddle, which is unstable. At $(\pm1, 0)$, $J = \begin{bmatrix} 0 & 1 \\ -2 & 0 \end{bmatrix}$ has eigenvalues $\pm i\sqrt2$, a linearized center, which is inconclusive and certainly not a spiral sink. (The energy $\tfrac12y^2 - \tfrac12x^2 + \tfrac14x^4$ is conserved, so they are true centers.)
- id: de-m8-r2-q24
  lesson: de-nonlinear
  type: match
  module_quiz: true
  topic: Nonlinear systems
  stem: 'Match each equilibrium from Lesson 37 to its type.'
  pairs:
    - ['Pendulum hanging down, $(0, 0)$', Center]
    - ['Pendulum balanced upside down, $(\pi, 0)$', Saddle point]
    - ['Lotka–Volterra, both species extinct, $(0, 0)$', Saddle point]
    - ['$x'' = x(1 - x - y)$, $y'' = y(0.75 - y - 0.5x)$ at $(0.5, 0.5)$', Nodal sink]
  distractors: [Spiral source]
  explanation: |-
    The hanging pendulum's linearization has eigenvalues $\pm i$ and energy conservation makes it a true center. Upside down, $D = -1 < 0$: a saddle. At Lotka–Volterra's origin the eigenvalues are $a > 0$ and $-c < 0$: a saddle. The competing-species point has $T = -1$, $D = 0.125$, $T^2 - 4D = 0.5 > 0$: a nodal sink.
- id: de-m8-r2-q25
  lesson: de-nonlinear
  topic: Nonlinear systems
  stem: 'At an equilibrium of a nonlinear system, the Jacobian has eigenvalues $\pm 2i$. What can you conclude about the nonlinear system there?'
  choices: ['It is a center, with closed orbits', 'It is asymptotically stable', 'It is a saddle point', 'It could be a center, a spiral sink or a spiral source']
  answer: 3
  explanation: |-
    Purely imaginary eigenvalues are the borderline case of the linearization theorem: the nonlinear terms decide. Lotka–Volterra and the pendulum turn out to be true centers, but only because of separate conserved-quantity arguments; small nonlinear terms can just as well make a slow spiral in or out. It isn't a saddle, since the eigenvalues aren't real with opposite signs.

# ---------- Honors: Coupled oscillators and normal modes ----------
- id: de-m8-r2-h01
  lesson: de-m8-h-coupled-oscillators
  type: label
  topic: Coupled oscillators
  stem: 'Two masses on a track are joined to the walls and to each other by springs. Name the numbered parts.'
  image: {src: images/de-m8-coupled-masses-blank.svg, alt: 'Two blocks m1 and m2 on a track between two walls, with spring 1 from the left wall to m1, spring 2 between the blocks, spring 3 from m2 to the right wall, and arrow 4 under m2 pointing right.'}
  labels:
    - {x: 16.7, y: 50, text: Wall spring on mass 1}
    - {x: 50, y: 50, text: Coupling spring}
    - {x: 83.3, y: 50, text: Wall spring on mass 2}
    - {x: 70.9, y: 82.7, text: Displacement of mass 2}
  distractors: [Damper, Displacement of mass 1]
  explanation: |-
    Spring 1 ($k_1$) acts only on $m_1$ and spring 3 ($k_3$) only on $m_2$. Spring 2 ($k_2$) joins the masses; it is the coupling, and it puts $-k_2$ off the diagonal of $K$. Arrow 4 sits under $m_2$: it is $x_2$, measured from equilibrium with right positive. There are no dampers in this frictionless model.
- id: de-m8-r2-h02
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'Springs $k_1 = 3$, $k_2 = 2$, $k_3 = 5$ (N/m) join two masses between two walls as in the lesson. What is the stiffness matrix $K$ in $M\mathbf{x}'''' = -K\mathbf{x}$?'
  choices: ['$\begin{bmatrix} 5 & -2 \\ -2 & 7 \end{bmatrix}$', '$\begin{bmatrix} 3 & -2 \\ -2 & 5 \end{bmatrix}$', '$\begin{bmatrix} 5 & 2 \\ 2 & 7 \end{bmatrix}$', '$\begin{bmatrix} 5 & -2 \\ -2 & 5 \end{bmatrix}$']
  answer: 0
  explanation: |-
    Each diagonal entry adds every spring touching that mass: $k_1 + k_2 = 5$ and $k_2 + k_3 = 7$. The off-diagonal entries are $-k_2 = -2$, because the coupling force $k_2(x_2 - x_1)$ pulls each mass toward the other. Leaving out $k_2$ on the diagonal, flipping the off-diagonal sign, or reusing 5 are the usual slips.
- id: de-m8-r2-h03
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'Two 1 kg masses are joined by three springs, each 9 N/m, between two walls. What are the two natural frequencies?'
  choices: ['$9$ and $27$ rad/s', '$3$ and $3\sqrt3$ rad/s', '$3$ and $6$ rad/s', '$3\sqrt2$ and $3\sqrt3$ rad/s']
  answer: 1
  explanation: |-
    $M^{-1}K = \begin{bmatrix} 18 & -9 \\ -9 & 18 \end{bmatrix}$ has trace 36 and determinant $324 - 81 = 243$, so $\omega^2 = 9$ or $27$, giving $\omega = 3$ (in phase) and $\sqrt{27} = 3\sqrt3 \approx 5.2$ rad/s (out of phase). The eigenvalues 9 and 27 are $\omega^2$, not $\omega$; $3\sqrt2$ comes from the diagonal entry 18.
- id: de-m8-r2-h04
  lesson: de-m8-h-coupled-oscillators
  type: text
  topic: Coupled oscillators
  stem: 'Two 2 kg masses are joined by three springs of 8 N/m between two walls. In the in-phase mode, the frequency is $\omega =$ ___ rad/s. Give only the number.'
  accept: ['2']
  explanation: |-
    In the in-phase mode $(1, 1)$ the masses move together, so the coupling spring never stretches and each mass feels only its wall spring: $\omega = \sqrt{k/m} = \sqrt{8/2} = 2$. (Check: $M^{-1}K = \begin{bmatrix} 8 & -4 \\ -4 & 8 \end{bmatrix}$ has eigenvalues 4 and 12.)
- id: de-m8-r2-h05
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'For a two-mass system, $M^{-1}K$ has eigenvalues 16 and 25 (in $\text{s}^{-2}$). What are the natural frequencies?'
  choices: ['$16$ and $25$ rad/s', '$8$ and $12.5$ rad/s', '$4$ and $5$ rad/s', '$256$ and $625$ rad/s']
  answer: 2
  explanation: |-
    Trying $\cos(\omega t)\mathbf{v}$ gives $M^{-1}K\mathbf{v} = \omega^2\mathbf{v}$, so the eigenvalues are $\omega^2$ and the frequencies are $\sqrt{16} = 4$ and $\sqrt{25} = 5$ rad/s. Halving or squaring the eigenvalues has no basis.
- id: de-m8-r2-h06
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'Which statements about undamped coupled oscillators are true? Select all that apply.'
  choices: ['In a normal mode every mass oscillates at the same frequency', 'Every free motion is a sum of normal modes', 'Every free motion of two coupled masses is periodic', 'The mode shapes are the eigenvalues of $M^{-1}K$']
  answer: [0, 1]
  explanation: |-
    A normal mode is $\cos(\omega t)\mathbf{v}$ (or $\sin$): one frequency for all masses, and the general solution is a combination of modes. A combination of two modes is periodic only when $\omega_2/\omega_1$ is rational, so not every motion is periodic. Mode shapes are eigenvectors; the eigenvalues are the squared frequencies.
- id: de-m8-r2-h07
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'In the lesson''s Example 1 (modes $(1, 1)$ at $\omega = 2$ and $(1, -1)$ at $\omega = 2\sqrt3$), mass 2 is pulled to $x_2 = 2$ while mass 1 is held at $x_1 = 0$, and both are released from rest. What is $x_1(t)$?'
  choices: ['$\cos 2t + \cos 2\sqrt3\,t$', '$2\cos 2t$', '$\cos 2\sqrt3\,t - \cos 2t$', '$\cos 2t - \cos 2\sqrt3\,t$']
  answer: 3
  explanation: |-
    Starting from rest removes the sine terms. Fit $a_1(1, 1) + a_2(1, -1) = (0, 2)$: $a_1 + a_2 = 0$ and $a_1 - a_2 = 2$, so $a_1 = 1$, $a_2 = -1$. Then $x_1 = \cos 2t - \cos 2\sqrt3\,t$ (which is 0 at $t = 0$, as it must be) and $x_2 = \cos 2t + \cos 2\sqrt3\,t$. The first choice is $x_2$, and the third has the signs swapped.
- id: de-m8-r2-h08
  lesson: de-m8-h-coupled-oscillators
  type: order
  topic: Coupled oscillators
  stem: 'Put the steps for finding the motion of a mass–spring system from its initial positions and velocities in order.'
  items:
    - 'Write Newton''s second law for each mass'
    - 'Assemble the mass matrix $M$ and stiffness matrix $K$'
    - 'Find the eigenvalues $\omega^2$ of $M^{-1}K$'
    - 'Find a mode shape for each eigenvalue'
    - 'Fit the cosine and sine coefficients to the initial conditions'
  explanation: |-
    The matrices come from the force equations; the eigenvalues come from $M^{-1}K$; each mode shape is found from its own eigenvalue; and the constants can only be fitted once the general solution (frequencies and mode shapes) is known.
- id: de-m8-r2-h09
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'Two 1 kg masses each have a 4 N/m wall spring and are joined by a weak 0.42 N/m coupling spring. Mass 1 is released from rest with mass 2 at equilibrium. About when has all the motion first passed to mass 2?'
  choices: ['$15.7$ s', '$31.4$ s', '$7.85$ s', '$1.43$ s']
  answer: 0
  explanation: |-
    $\omega_1 = \sqrt{4} = 2$ and $\omega_2 = \sqrt{4 + 2(0.42)} = \sqrt{4.84} = 2.2$ rad/s. The first complete transfer is at $t = \pi/(\omega_2 - \omega_1) = \pi/0.2 \approx 15.7$ s. $31.4$ s is $2\pi/0.2$, when the motion is back in mass 1; $7.85$ s is only halfway; $1.43$ s is $\pi/2.2$.
- id: de-m8-r2-h10
  lesson: de-m8-h-coupled-oscillators
  type: match
  topic: Coupled oscillators
  stem: 'Match each piece of the coupled-oscillator math to its meaning.'
  pairs:
    - [Eigenvalue of M⁻¹K, Square of a natural frequency]
    - [Eigenvector of M⁻¹K, Mode shape]
    - ['Off-diagonal entry $-k_2$ of $K$', Coupling between the masses]
    - [Modal coordinate, A variable that obeys its own single-spring equation]
  distractors: [Damping constant]
  explanation: |-
    $M^{-1}K\mathbf{v} = \omega^2\mathbf{v}$: eigenvalues are $\omega^2$ and eigenvectors are mode shapes. The $-k_2$ entries link $x_1$ and $x_2$; without them the masses would move independently. Modal coordinates such as $x_1 + x_2$ and $x_1 - x_2$ each satisfy $q'' + \omega^2q = 0$. The model has no damping.
- id: de-m8-r2-h11
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'In the two-story building model, the slow mode has shape $(1, 1.618)$ (floor 1, floor 2). What does that describe?'
  choices: ['The floors move in opposite directions, the top one 1.6 times as far', 'Only the top floor moves', 'Both floors move the same direction, the top one about 1.6 times as far', 'Both floors move the same distance, the top one 1.6 times as fast']
  answer: 2
  explanation: |-
    Both entries are positive, so the floors sway the same way at every instant, and the ratio of the entries is the ratio of their displacements: $x_2 = 1.618x_1$. Opposite directions describe the fast mode $(1, -0.618)$. In a normal mode both floors share one frequency, so "1.6 times as fast" mixes up amplitude and frequency.
- id: de-m8-r2-h12
  lesson: de-m8-h-coupled-oscillators
  topic: Coupled oscillators
  stem: 'Two identical masses and three identical springs: why is the out-of-phase mode faster than the in-phase mode?'
  choices: ['The masses are heavier when they move apart', 'The coupling spring stretches by twice each displacement and adds restoring force', 'Energy is lost to the coupling spring', 'The wall springs are stretched less']
  answer: 1
  explanation: |-
    When $x_2 = -x_1$, the middle spring stretches by $x_2 - x_1 = -2x_1$, so each mass feels $k + 2k = 3k$ of restoring force per unit displacement, giving $\omega = \sqrt{3k/m}$ instead of $\sqrt{k/m}$. Mass doesn't change, nothing is lost without friction, and the wall springs stretch just as much in both modes.
- id: de-m8-r2-h13
  lesson: de-m8-h-coupled-oscillators
  type: text
  topic: Coupled oscillators
  stem: 'Masses $m_1 = 2$ kg and $m_2 = 1$ kg with springs $k_1 = 2$, $k_2 = 2$, $k_3 = 1$ (N/m) give $M^{-1}K = \begin{bmatrix} 2 & -1 \\ -2 & 3 \end{bmatrix}$. The natural frequencies are $\omega_1 =$ ___ and $\omega_2 =$ ___ rad/s (smaller first).'
  accept:
    - ['1']
    - ['2']
  explanation: |-
    Trace 5, determinant $6 - 2 = 4$: $\mu^2 - 5\mu + 4 = (\mu - 1)(\mu - 4) = 0$. These are $\omega^2$, so $\omega_1 = 1$ and $\omega_2 = 2$ rad/s, with mode shapes $(1, 1)$ and $(1, -2)$. Each row of $K = \begin{bmatrix} 4 & -2 \\ -2 & 3 \end{bmatrix}$ was divided by its own mass.

# ---------- Honors: Larger systems and the Routh–Hurwitz test ----------
- id: de-m8-r2-h14
  lesson: de-m8-h-larger-systems
  type: label
  topic: Stability of larger systems
  stem: 'Pure water flows through this chain of tanks at 10 L/min. Label each numbered tank with its rate constant (flow ÷ volume), which is also the size of its eigenvalue.'
  image: {src: images/de-m8-tank-chain-blank.svg, alt: 'Three tanks arranged like steps with pipes from each to the next: tank 1 holds 50 liters, tank 2 holds 100 liters and tank 3 holds 200 liters. Water enters tank 1 and leaves tank 3.'}
  labels:
    - {x: 21.2, y: 28.3, text: 0.2 per minute}
    - {x: 57.3, y: 54.7, text: 0.1 per minute}
    - {x: 92.4, y: 83, text: 0.05 per minute}
  distractors: [0.5 per minute, 5 per minute]
  explanation: |-
    Each tank loses salt at (flow ÷ volume) × amount: $10/50 = 0.2$, $10/100 = 0.1$ and $10/200 = 0.05$ per minute. The matrix is triangular, so its eigenvalues are $-0.2$, $-0.1$ and $-0.05$. Volume ÷ flow (5, 10, 20 minutes) is the time constant, not the rate.
- id: de-m8-r2-h15
  lesson: de-m8-h-larger-systems
  type: text
  topic: Stability of larger systems
  stem: 'For $A = \begin{bmatrix} -1 & 2 & 0 \\ 0 & -3 & 1 \\ 1 & 0 & -2 \end{bmatrix}$, write $\det(\lambda I - A) = \lambda^3 + a_1\lambda^2 + a_2\lambda + a_3$. Then $a_1 =$ ___, $a_2 =$ ___ and $a_3 =$ ___.'
  accept:
    - ['6']
    - ['11']
    - ['4']
  explanation: |-
    $a_1 = -\operatorname{tr}A = 6$. The principal minors are $(-3)(-2) - 0 = 6$, $(-1)(-2) - 0 = 2$ and $(-1)(-3) - 0 = 3$, so $a_2 = 11$. $\det A = -1(6 - 0) - 2(0 - 1) + 0 = -4$, so $a_3 = 4$. Since $a_1a_2 = 66 > 4$, the origin is asymptotically stable.
- id: de-m8-r2-h16
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'A system''s characteristic polynomial is $\lambda^3 + 2\lambda^2 + 3\lambda + 7$. What does the Routh–Hurwitz test say?'
  choices: ['Stable, because every coefficient is positive', 'Stable, because $a_1a_2 = 6$ is close to $a_3 = 7$', 'Borderline, with a purely imaginary pair', 'Unstable, because $a_1a_2 = 6 < 7 = a_3$']
  answer: 3
  explanation: |-
    For a cubic, positive coefficients are necessary but not enough: we also need $a_1a_2 > a_3$, and here $2 \cdot 3 = 6 < 7$. So some root has a positive real part (in fact a pair near $0.07 \pm 1.81i$). The borderline case needs exact equality $a_1a_2 = a_3$.
- id: de-m8-r2-h17
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'Which polynomials have all their roots in the left half-plane (negative real parts)? Select all that apply.'
  choices: ['$\lambda^3 + 3\lambda^2 + 3\lambda + 1$', '$\lambda^3 + \lambda^2 + \lambda + 2$', '$\lambda^3 + 4\lambda^2 + 5\lambda + 2$', '$\lambda^3 + 2\lambda^2 - \lambda + 1$']
  answer: [0, 2]
  explanation: |-
    Check $a_1, a_3 > 0$ and $a_1a_2 > a_3$: $9 > 1$ (it is $(\lambda + 1)^3$) and $20 > 2$ (it is $(\lambda + 1)^2(\lambda + 2)$) pass. $1 \cdot 1 < 2$ fails, and the last has $a_2 = -1$, so $a_1a_2 = -2 < 1$ fails too.
- id: de-m8-r2-h18
  lesson: de-m8-h-larger-systems
  type: text
  topic: Stability of larger systems
  stem: 'A feedback system has characteristic polynomial $\lambda^3 + 4\lambda^2 + 5\lambda + k$. It is asymptotically stable exactly when $0 < k <$ ___.'
  accept: ['20']
  explanation: |-
    Routh–Hurwitz: $a_1 = 4 > 0$, $a_3 = k > 0$ and $a_1a_2 = 20 > k$. So $0 < k < 20$. At $k = 20$ the polynomial is $(\lambda + 4)(\lambda^2 + 5)$.
- id: de-m8-r2-h19
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'For $\lambda^3 + 4\lambda^2 + 5\lambda + k$ at the threshold $k = 20$, where are the roots?'
  choices: ['$-4$ and $\pm i\sqrt5$', '$-4$ and $\pm 5i$', '$-5$ and $\pm 2i$', '$-1$, $-2$ and $-10$']
  answer: 0
  explanation: |-
    At $a_1a_2 = a_3$ the polynomial factors as $(\lambda + a_1)(\lambda^2 + a_2) = (\lambda + 4)(\lambda^2 + 5)$, so the roots are $-4$ and $\pm i\sqrt5$: solutions oscillate with angular frequency $\sqrt5$, neither growing nor decaying. $\pm 5i$ forgets the square root.
- id: de-m8-r2-h20
  lesson: de-m8-h-larger-systems
  type: order
  topic: Stability of larger systems
  stem: 'Put these events in the history of the stability problem in order, earliest first.'
  items:
    - 'Maxwell analyzes the stability of steam-engine governors'
    - 'Routh gives a general test for any degree'
    - 'Hurwitz independently finds an equivalent determinant test'
  explanation: |-
    Maxwell's paper on governors appeared in 1868; Routh's general solution won the Adams Prize in 1877; Hurwitz published his version in 1895. The combined result is called the Routh–Hurwitz criterion.
- id: de-m8-r2-h21
  lesson: de-m8-h-larger-systems
  type: match
  topic: Stability of larger systems
  stem: 'For a $3 \times 3$ matrix $A$, match each quantity to what it equals or is called.'
  pairs:
    - [Sum of the eigenvalues, Trace of A]
    - [Product of the eigenvalues, Determinant of A]
    - [Sum of the three principal 2×2 minors, Coefficient of λ in det(λI − A)]
    - [Eigenvalue with the largest real part, Dominant eigenvalue]
  distractors: [Number of equilibria]
  explanation: |-
    Expanding $(\lambda - \lambda_1)(\lambda - \lambda_2)(\lambda - \lambda_3)$ and comparing with $\lambda^3 - (\operatorname{tr}A)\lambda^2 + E_2\lambda - \det A$ gives the first three. The eigenvalue with the largest real part decays slowest (or grows fastest), so it dominates in the long run.
- id: de-m8-r2-h22
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'If the origin of $\mathbf{x}'' = A\mathbf{x}$ is asymptotically stable for a $3 \times 3$ matrix $A$, then necessarily'
  choices: ['$\operatorname{tr}A < 0$ and $\det A > 0$', '$\operatorname{tr}A < 0$ and $\det A < 0$', '$\operatorname{tr}A > 0$ and $\det A < 0$', '$\det A = 0$']
  answer: 1
  explanation: |-
    The trace is the sum of eigenvalues with negative real parts, so it is negative. The determinant is their product: a real negative eigenvalue times either two negative ones or a complex pair (whose product $|\lambda|^2$ is positive) is negative. The $2 \times 2$ rule $D > 0$ does not carry over to odd sizes.
- id: de-m8-r2-h23
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'For $\mathbf{x}'' = \begin{bmatrix} -3 & 0 & 0 \\ 2 & -1 & 0 \\ 0 & 1 & -4 \end{bmatrix}\mathbf{x}$, which eigenvalue controls how fast typical solutions decay in the long run?'
  choices: ['$-4$', '$-3$', '$-8$', '$-1$']
  answer: 3
  explanation: |-
    The matrix is triangular, so its eigenvalues are its diagonal entries $-3$, $-1$, $-4$. Terms with $e^{-3t}$ and $e^{-4t}$ die faster than $e^{-t}$, so the dominant eigenvalue, the one with the largest real part, is $-1$. $-8$ is the trace (the sum), not an eigenvalue.
- id: de-m8-r2-h24
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'Do all solutions of $y'''''' + 2y'''' + 3y'' + 4y = 0$ tend to 0?'
  choices: ['No, because the coefficients are not all equal', 'No, because $a_1a_2 = 6 > 4$', 'Yes, because $a_1a_2 = 6 > 4 = a_3$ and all coefficients are positive', 'Yes, because the polynomial has no positive coefficients']
  answer: 2
  explanation: |-
    The characteristic polynomial $\lambda^3 + 2\lambda^2 + 3\lambda + 4$ has $a_1 = 2 > 0$, $a_3 = 4 > 0$ and $a_1a_2 = 6 > 4$, so every root has a negative real part (they are about $-1.65$ and $-0.17 \pm 1.55i$) and every solution decays. $a_1a_2 > a_3$ is the stable side, not the unstable one.
- id: de-m8-r2-h25
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'In the feedback model with characteristic polynomial $(\lambda + 1)^3 + k$, what is the period of the oscillations that appear at the threshold $k = 8$?'
  choices: ['$2\pi/\sqrt3 \approx 3.6$', '$2\pi/3 \approx 2.1$', '$2\pi/8 \approx 0.79$', '$2\pi$']
  answer: 0
  explanation: |-
    At $k = 8$, $(\lambda + 1)^3 = -8$ gives $\lambda + 1 = -2$ or $\lambda + 1 = 1 \pm i\sqrt3$, so $\lambda = -3$ and $\pm i\sqrt3$. The angular frequency is $\sqrt3$ (also $\sqrt{a_2} = \sqrt3$), so the period is $2\pi/\sqrt3 \approx 3.63$.
- id: de-m8-r2-h26
  lesson: de-m8-h-larger-systems
  topic: Stability of larger systems
  stem: 'Three blocks exchange heat: $A = \begin{bmatrix} -2 & 1 & 0 \\ 1 & -2 & 1 \\ 0 & 1 & -2 \end{bmatrix}$, with eigenvalues $-2$ and $-2 \pm \sqrt2$. In the long run, which temperature pattern remains?'
  choices: ['$(1, \sqrt2, 1)$: the middle block warmest', '$(1, 0, -1)$: the end blocks opposite, the middle at 0', '$(1, -\sqrt2, 1)$: the middle block opposite to the ends', '$(1, 1, 1)$: all blocks equal']
  answer: 0
  explanation: |-
    The dominant eigenvalue is $-2 + \sqrt2 \approx -0.59$, and its eigenvector is $(1, \sqrt2, 1)$ (check: $A(1, \sqrt2, 1) = (-2 + \sqrt2, 2 - 2\sqrt2, -2 + \sqrt2)$, which is $(-2 + \sqrt2)(1, \sqrt2, 1)$). $(1, 0, -1)$ goes with $-2$ and $(1, -\sqrt2, 1)$ with $-2 - \sqrt2$; both die faster. $(1, 1, 1)$ is not an eigenvector.
