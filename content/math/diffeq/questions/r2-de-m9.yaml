# Round 2, module de-m9: new question types for lessons 38-41, and the three honors lessons
# Lesson 38: series solutions
- id: de-m9-r2-q01
  lesson: de-series
  type: text
  module_quiz: true
  topic: Series solutions
  stem: 'In $P(x)y'''' + Q(x)y'' + R(x)y = 0$ with polynomial coefficients that have no common factor, a point $x_0$ with $P(x_0) \ne 0$ is called an ___ point.'
  accept: [ordinary]
  explanation: |-
    At an ordinary point two independent power-series solutions exist. A point where $P(x_0) = 0$ is a singular point, where an ordinary power series may fail.
- id: de-m9-r2-q02
  lesson: de-series
  type: order
  topic: Series solutions
  stem: 'Put the steps of the power series method at an ordinary point $x_0 = 0$ in order.'
  items:
    - 'Substitute the series for $y$, $y''$ and $y''''$'
    - 'Shift indices so every sum shows $x^n$'
    - 'Set the coefficient of each power to zero to get a recurrence'
    - 'Compute the coefficients from $a_0 = y(0)$ and $a_1 = y''(0)$'
  explanation: |-
    You can only shift indices after the series are in the equation, you need every sum to show the same power before you can collect coefficients into a recurrence, and the recurrence is what lets you compute the coefficients.
- id: de-m9-r2-q03
  lesson: de-series
  topic: Series solutions
  stem: 'Which are singular points of $x(x^2 + 9)y'''' + y'' + xy = 0$? Select all that apply.'
  choices: ['$x = 0$', '$x = 3i$', '$x = 3$', '$x = -3i$']
  answer: [0, 1, 3]
  explanation: |-
    Singular points are the zeros of $P(x) = x(x^2 + 9)$: $x = 0$ and $x^2 = -9$, so $x = \pm3i$. At $x = 3$, $P(3) = 3 \cdot 18 \ne 0$, so it is an ordinary point. Complex singular points count: they limit the radius of convergence.
- id: de-m9-r2-q04
  lesson: de-series
  type: label
  module_quiz: true
  topic: Series solutions
  stem: 'The picture shows, in the complex plane, where series solutions of $(1 + x^2)y'''' + y = 0$ about $x = 0$ are guaranteed to converge. Name the numbered parts.'
  image: {src: images/de-m9-radius-blank.svg, alt: 'The complex plane with a shaded disk centered at the origin. Crosses mark the points i and −i on the edge of the disk. A dashed segment runs from the center to the edge, and the part of the real axis inside the disk is highlighted. Four numbered markers.'}
  labels:
    - {x: 46.9, y: 51.1, text: Expansion point (an ordinary point)}
    - {x: 46.9, y: 23.9, text: Singular point}
    - {x: 54.6, y: 43.3, text: Radius of convergence}
    - {x: 35.6, y: 51.1, text: Real interval where convergence is guaranteed}
  distractors: [Recurrence relation, Regular singular point at the origin]
  explanation: |-
    The series is expanded about the ordinary point $x = 0$ (marker 1). $P(x) = 1 + x^2$ vanishes at $x = \pm i$ (marker 2 is $x = i$), at distance 1 from the center, so the guaranteed radius is 1 (marker 3). On the real line that disk covers $-1 < x < 1$ (marker 4). The origin is not singular here, since $P(0) = 1$.
- id: de-m9-r2-q05
  lesson: de-series
  type: text
  topic: Series solutions
  stem: 'Airy''s equation $y'''' - xy = 0$ has recurrence $a_{n+2} = \dfrac{a_{n-1}}{(n+2)(n+1)}$. With $y(0) = 0$ and $y''(0) = 1$, the coefficient $a_4$ of $x^4$ is ___. (Give an exact fraction.)'
  accept: ['1/12']
  explanation: |-
    $a_0 = 0$ and $a_1 = 1$. Taking $n = 2$: $a_4 = \dfrac{a_1}{4 \cdot 3} = \dfrac{1}{12}$.
- id: de-m9-r2-q06
  lesson: de-series
  type: match
  topic: Series solutions
  stem: 'Match each equation with the radius of convergence guaranteed for its series solutions about $x = 0$.'
  pairs:
    - ['$(1 + x^2)y'''' + y = 0$', '1']
    - ['$(4 + x^2)y'''' + y = 0$', '2']
    - ['$(x - 3)y'''' + y = 0$', '3']
    - ['$y'''' - xy = 0$', 'Infinite (all x)']
  distractors: ['0']
  explanation: |-
    The guaranteed radius is the distance from 0 to the nearest zero of $P$, complex ones included: $\pm i$ (distance 1), $\pm2i$ (distance 2), $3$ (distance 3). Airy's equation has $P = 1$, with no singular points, so its series converge for every $x$.
# Lesson 39: Fourier series
- id: de-m9-r2-q07
  lesson: de-fourier
  type: text
  module_quiz: true
  topic: Fourier series
  stem: 'Let $f(x) = 0$ for $-\pi < x < 0$ and $f(x) = 4$ for $0 < x < \pi$, extended with period $2\pi$. At $x = 0$ its Fourier series converges to ___.'
  accept: ['2']
  explanation: |-
    At a jump the series converges to the average of the one-sided limits: $\tfrac12(0 + 4) = 2$. (The constant term $\tfrac{a_0}{2} = 2$ and every sine term vanishes at 0, which confirms it.)
- id: de-m9-r2-q08
  lesson: de-fourier
  type: match
  module_quiz: true
  topic: Fourier series
  stem: 'Match each function on $(-\pi, \pi)$ with the kind of terms in its Fourier series.'
  pairs:
    - ['$x^3$', 'Sine terms only']
    - ['$x^2$', 'Cosine terms only (and a constant)']
    - ['$e^x$', 'Both sine and cosine terms']
    - ['$|x| + x$', 'Both sine and cosine terms']
  explanation: |-
    $x^3$ is odd, so every $a_n = 0$. $x^2$ is even, so every $b_n = 0$. $e^x$ and $|x| + x$ are neither even nor odd, so both kinds of terms appear ($|x| + x$ is the even $|x|$ plus the odd $x$).
- id: de-m9-r2-q09
  lesson: de-fourier
  topic: Fourier series
  stem: 'Which statements about the Fourier sine series of $f(x) = 1$ on $0 < x < \pi$ are true? Select all that apply.'
  choices:
    - 'Its coefficients are $b_n = \dfrac{4}{n\pi}$ for odd $n$ and $0$ for even $n$'
    - 'It is the Fourier series of the odd extension, a square wave'
    - 'At $x = 0$ it converges to $1$'
    - 'Its coefficients decay like $1/n^2$'
  answer: [0, 1]
  explanation: |-
    The odd extension of 1 is the square wave of Example 1, with $b_n = \dfrac{2}{n\pi}(1 - (-1)^n)$. At $x = 0$ every sine is 0, so the series gives 0, the midpoint of the jump from $-1$ to $1$, not 1. The coefficients decay like $1/n$, the rate for a function with jumps.
- id: de-m9-r2-q10
  lesson: de-fourier
  type: order
  topic: Fourier series
  stem: 'Put the steps of the derivation of $a_m = \frac1L\int_{-L}^{L}f(x)\cos\frac{m\pi x}{L}\,dx$ in order.'
  items:
    - 'Write $f$ as its Fourier series'
    - 'Multiply both sides by $\cos\frac{m\pi x}{L}$'
    - 'Integrate both sides from $-L$ to $L$'
    - 'Use orthogonality: only the $a_m$ term survives, giving $a_mL$'
    - 'Divide by $L$'
  explanation: |-
    Multiplying by $\cos\frac{m\pi x}{L}$ and integrating kills every term except the $m$th (orthogonality), whose integral is $a_mL$. Dividing by $L$ gives the formula.
- id: de-m9-r2-q11
  lesson: de-fourier
  topic: Fourier series
  stem: 'Extend $f(x) = x$ from $(0, \pi)$. Why do the coefficients of its sine series (odd extension) decay like $1/n$, while those of its cosine series (even extension) decay like $1/n^2$?'
  choices:
    - 'The sine series uses the interval $(0, \pi)$ and the cosine series uses $(-\pi, \pi)$'
    - 'The cosine series has a constant term that absorbs part of the function'
    - 'The odd extension is a sawtooth that jumps at $x = \pm\pi$; the even extension is a continuous triangle wave'
    - 'Sines are smaller than cosines on most of $(0, \pi)$'
  answer: 2
  explanation: |-
    Coefficients reflect the smoothness of the periodic extension. The odd extension jumps from $\pi$ to $-\pi$ at $x = \pi$, so its coefficients fall like $1/n$; the even extension $|x|$ only has corners, so they fall like $1/n^2$. Both half-range series use $(0, \pi)$.
# Lesson 40: heat and wave equations
- id: de-m9-r2-q12
  lesson: de-heat-wave
  type: order
  module_quiz: true
  topic: Heat and wave equations
  stem: 'Put the steps of separation of variables for $u_t = \alpha^2u_{xx}$ with zero ends in order.'
  items:
    - 'Try a product solution $u = X(x)T(t)$'
    - 'Separate the variables and set both sides equal to $-\lambda$'
    - 'Solve the eigenvalue problem for $X$ with the boundary conditions'
    - 'Solve for $T$ with each eigenvalue $\lambda_n$'
    - 'Superpose and match the initial data with a Fourier sine series'
  explanation: |-
    The product form is what lets you separate; separation gives the two ODEs; the boundary conditions pick out the eigenvalues $\lambda_n$, which the $T$ equation needs; and only the full superposition has enough freedom to match $u(x, 0) = f(x)$.
- id: de-m9-r2-q13
  lesson: de-heat-wave
  type: label
  topic: Heat and wave equations
  stem: 'The picture shows the first three normal modes of a string fixed at both ends, each drawn half a period apart (solid and dashed). Name the numbered parts of the $n = 3$ mode.'
  image: {src: images/de-m9-string-modes-blank.svg, alt: 'Three standing waves on a string between two clamps, labeled n = 1, 2 and 3. On the n = 3 mode, marker 1 is on a still point between humps, marker 2 is at the top of the first hump, and marker 3 is at the right clamp.'}
  labels:
    - {x: 40.6, y: 82, text: Node}
    - {x: 28.9, y: 73.6, text: Antinode}
    - {x: 88.6, y: 78, text: Fixed end}
  distractors: [Fundamental frequency, Initial velocity]
  explanation: |-
    The $n = 3$ mode $\sin\frac{3\pi x}{L}$ is zero at $x = L/3$ and $2L/3$ for all time: these nodes never move (marker 1). Midway between nodes, at the top of a hump, the string swings the farthest: an antinode (marker 2). The ends are clamped, $u(0, t) = u(L, t) = 0$ (marker 3).
- id: de-m9-r2-q14
  lesson: de-heat-wave
  type: text
  topic: Heat and wave equations
  stem: 'A string fixed at both ends vibrates in its $n = 4$ normal mode. Not counting the ends, it has ___ points that never move.'
  accept: ['3', three]
  explanation: |-
    $\sin\frac{4\pi x}{L} = 0$ at $x = L/4$, $L/2$ and $3L/4$ inside the string: mode $n$ has $n - 1$ interior nodes.
- id: de-m9-r2-q15
  lesson: de-heat-wave
  topic: Heat and wave equations
  stem: 'Which statements are true of the solution $u = \sum b_ne^{-\alpha^2(n\pi/L)^2t}\sin\frac{n\pi x}{L}$ of the heat equation with both ends held at 0? Select all that apply.'
  choices:
    - 'Each mode decays exponentially in time'
    - 'The $n = 2$ mode decays at 4 times the rate of the $n = 1$ mode'
    - '$u \to 0$ as $t \to \infty$'
    - 'Higher modes oscillate faster in time'
  answer: [0, 1, 2]
  explanation: |-
    The decay rate of mode $n$ is $\alpha^2(n\pi/L)^2$, proportional to $n^2$, so mode 2 decays 4 times as fast. Every mode decays, so $u \to 0$. Nothing oscillates in time: that is the wave equation, whose time factors are cosines and sines.
- id: de-m9-r2-q16
  lesson: de-heat-wave
  type: match
  module_quiz: true
  topic: Heat and wave equations
  stem: 'Match each feature with the equation it belongs to (fixed or zero-temperature ends).'
  pairs:
    - ['Time factors $e^{-\alpha^2(n\pi/L)^2t}$', 'Heat equation']
    - ['Needs both $u(x, 0)$ and $u_t(x, 0)$', 'Wave equation']
    - ['Corners in the initial shape stay sharp', 'Wave equation']
    - ['Bumps in the initial profile smooth out', 'Heat equation']
  explanation: |-
    The heat equation is first order in $t$ (one initial condition), its modes decay, and high modes die fastest, so it smooths. The wave equation is second order in $t$ (position and velocity), its modes oscillate forever, so sharp features persist.
# Lesson 41: other boundary conditions
- id: de-m9-r2-q17
  lesson: de-heat-boundary
  type: label
  module_quiz: true
  topic: Heat boundary conditions
  stem: 'The picture shows a rod with two different kinds of end. Name the numbered parts.'
  image: {src: images/de-m9-rod-ends-blank.svg, alt: 'A horizontal rod from x = 0 to x = L, wrapped in hatched insulation on its top and bottom. Its left end is pressed against a large block and its right end is covered with a hatched cap. An arrow inside the rod points along it. Four numbered markers.'}
  labels:
    - {x: 18, y: 50, text: End held at a fixed temperature (Dirichlet)}
    - {x: 80.2, y: 50, text: Insulated end (Neumann)}
    - {x: 39.1, y: 38.9, text: Insulated side}
    - {x: 46.9, y: 50, text: Heat flux along the rod}
  distractors: [Equilibrium temperature, Heat source inside the rod]
  explanation: |-
    The large block keeps the left end at a set temperature, $u(0, t) = T_1$: a Dirichlet condition (marker 1). The cap at the right lets no heat through, so $u_x(L, t) = 0$: a Neumann condition (marker 2). Insulation along the sides (marker 3) means heat moves only along the rod, at the rate $-\kappa u_x$ (marker 4).
- id: de-m9-r2-q18
  lesson: de-heat-boundary
  type: text
  topic: Heat boundary conditions
  stem: 'A rod of length $L = 2$ is insulated at both ends and starts at $u(x, 0) = 6x$. As $t \to \infty$ its temperature approaches ___ everywhere.'
  accept: ['6']
  explanation: |-
    With insulated ends the rod tends to the average of its initial temperature: $\dfrac12\displaystyle\int_0^2 6x\,dx = \dfrac12 \cdot 12 = 6$.
- id: de-m9-r2-q19
  lesson: de-heat-boundary
  type: match
  topic: Heat boundary conditions
  stem: 'Match each pair of end conditions for $u_t = \alpha^2u_{xx}$ on $0 < x < L$ with its eigenfunctions.'
  pairs:
    - ['$u(0, t) = 0$ and $u(L, t) = 0$', 'sin(nπx/L), n = 1, 2, 3, …']
    - ['$u_x(0, t) = 0$ and $u_x(L, t) = 0$', '1 and cos(nπx/L), n = 1, 2, 3, …']
    - ['$u(0, t) = 0$ and $u_x(L, t) = 0$', 'sin((2n − 1)πx/(2L)), n = 1, 2, 3, …']
  distractors: ['e^(nπx/L), n = 1, 2, 3, …']
  explanation: |-
    Zero values at both ends give full sine humps; zero slopes give cosines plus the constant mode ($\lambda = 0$); zero at $x = 0$ with zero slope at $x = L$ gives quarter-waves that vanish at 0 and are flat at $L$. Exponentials can't satisfy either kind of homogeneous condition at both ends unless they are zero.
- id: de-m9-r2-q20
  lesson: de-heat-boundary
  type: order
  module_quiz: true
  topic: Heat boundary conditions
  stem: 'Put the steps for solving the heat equation with ends held at $u(0, t) = T_1$ and $u(L, t) = T_2$ in order.'
  items:
    - 'Find the equilibrium line $v(x) = T_1 + (T_2 - T_1)x/L$'
    - 'Set $w = u - v$, which has zero ends'
    - 'Solve for $w$: decaying sine modes $e^{-\alpha^2(n\pi/L)^2t}\sin\frac{n\pi x}{L}$ whose coefficients are the sine coefficients of $f(x) - v(x)$'
    - 'Add back: $u = v + w$'
  explanation: |-
    You need $v$ before you can define $w$; $w$ has zero ends, so it is the zero-end problem of Lesson 40 with initial data $f - v$ (expanded in sines, each mode decaying at its own rate); and the answer is $v + w$, which tends to $v$.
- id: de-m9-r2-q21
  lesson: de-heat-boundary
  topic: Heat boundary conditions
  stem: 'For the heat equation on a rod insulated at both ends (and along its sides), which statements are true? Select all that apply.'
  choices:
    - 'The total heat in the rod stays constant'
    - 'The eigenvalue $\lambda = 0$, with the constant eigenfunction, appears'
    - '$u \to 0$ as $t \to \infty$'
    - 'At every time $t > 0$, the profile meets each end with zero slope'
  answer: [0, 1, 3]
  explanation: |-
    No heat crosses the boundary, so the total is conserved and the rod tends to the average of its initial temperature, not to 0. The constant mode is what carries that average. The condition $u_x = 0$ at the ends means every profile is flat there.
# Honors: the method of Frobenius
- id: de-m9-r2-h01
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'For which equation is $x = 0$ a regular singular point?'
  choices:
    - '$x^2y'''' + 3xy'' + (1 + x)y = 0$'
    - '$x^3y'''' + xy'' + y = 0$'
    - '$y'''' + xy'' + y = 0$'
    - '$x^2y'''' + y'' + y = 0$'
  answer: 0
  explanation: |-
    For the first, $xp = 3$ and $x^2q = 1 + x$ are analytic: regular. For $x^3y'' + xy' + y = 0$, $p = 1/x^2$, so $xp = 1/x$ is not analytic: irregular. The same happens with $x^2y'' + y' + y = 0$ ($p = 1/x^2$). In $y'' + xy' + y = 0$, $x = 0$ is an ordinary point, not a singular one.
- id: de-m9-r2-h02
  lesson: de-m9-h-frobenius
  type: text
  topic: Frobenius method
  stem: 'For $2x^2y'''' - xy'' + (1 + x)y = 0$ at $x = 0$, the indicial equation has the larger root $r_1 =$ ___ and the smaller root $r_2 =$ ___.'
  accept:
    - ['1']
    - ['1/2', '0.5']
  explanation: |-
    Dividing by $2x^2$: $p_0 = \lim xp = -\tfrac12$ and $q_0 = \lim x^2q = \tfrac12$. The indicial equation $r(r - 1) - \tfrac12r + \tfrac12 = 0$ is $2r^2 - 3r + 1 = 0$, so $r = 1$ or $r = \tfrac12$.
- id: de-m9-r2-h03
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'The indicial roots at a regular singular point are $r_1 = 1$ and $r_2 = \tfrac12$. What do the solutions near $x = 0$ (for $x > 0$) look like?'
  choices:
    - 'One Frobenius series, and a second solution with a $\ln x$ term'
    - 'Two Frobenius series, $x\sum a_nx^n$ and $x^{1/2}\sum b_nx^n$'
    - 'Two ordinary power series'
    - 'There are no series solutions near 0'
  answer: 1
  explanation: |-
    The roots differ by $\tfrac12$, not an integer, so each root gives its own Frobenius series. A logarithm can appear only when the roots are equal or differ by an integer.
- id: de-m9-r2-h04
  lesson: de-m9-h-frobenius
  type: match
  topic: Frobenius method
  stem: 'Match each pair of indicial roots with what the second solution looks like.'
  pairs:
    - ['$r = \tfrac13$ and $r = -\tfrac13$', 'A second Frobenius series']
    - ['$r = 2$ (a double root)', 'y1 ln x plus another series']
    - ['$r = 3$ and $r = 1$', 'C y1 ln x plus a series, where C may be 0']
  distractors: ['No second solution exists']
  explanation: |-
    A difference of $\tfrac23$ (not an integer) gives two series. Equal roots always force a logarithm. A positive integer difference (here 2) may or may not: the constant $C$ has to be computed. A second-order linear equation always has a second independent solution.
- id: de-m9-r2-h05
  lesson: de-m9-h-frobenius
  type: text
  topic: Frobenius method
  stem: 'For $2xy'''' + y'' + y = 0$ with $r = 0$, the recurrence is $a_n = -\dfrac{a_{n-1}}{n(2n - 1)}$, and with $a_0 = 1$ it gives $a_3 = -\tfrac{1}{90}$. Then $a_4 =$ ___. (Exact fraction.)'
  accept: ['1/2520']
  explanation: |-
    $a_4 = -\dfrac{a_3}{4 \cdot 7} = \dfrac{1}{90 \cdot 28} = \dfrac{1}{2520}$. This matches the $x^4$ coefficient of $\cos\sqrt{2x}$, which is $\dfrac{(2x)^4}{8!} = \dfrac{16x^4}{40320}$.
- id: de-m9-r2-h06
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'In the Frobenius series $y = \sum_{n=0}^\infty a_nx^{n+r}$, why is $a_0 \ne 0$ required?'
  choices:
    - 'Otherwise the series would diverge'
    - 'It makes the recurrence linear'
    - 'Because $a_0 = y(0)$ must be nonzero'
    - 'So that $x^r$ is the true leading power; otherwise $r$ could be shifted by any integer'
  answer: 3
  explanation: |-
    If $a_0$ were allowed to be 0, the first nonzero term could be $a_kx^{k+r}$, the same as starting with exponent $r + k$. Insisting $a_0 \ne 0$ pins $r$ down, and the coefficient of the lowest power then gives the indicial equation. ($y(0)$ need not even be finite: $x^r$ blows up at 0 when $r < 0$.)
- id: de-m9-r2-h07
  lesson: de-m9-h-frobenius
  type: order
  topic: Frobenius method
  stem: 'Put the steps of the method of Frobenius at $x = 0$ in order.'
  items:
    - 'Check that $xp(x)$ and $x^2q(x)$ are analytic at 0'
    - 'Substitute $y = \sum a_nx^{n+r}$ with $a_0 \ne 0$'
    - 'Set the coefficient of the lowest power to zero to get the indicial equation'
    - 'Solve the indicial equation for $r$'
    - 'Use the recurrence with each root to find the coefficients'
  explanation: |-
    The method is only guaranteed at a regular singular point, so check that first. The indicial equation comes from the lowest power after substituting, its roots are the exponents, and the recurrence depends on which root you use.
- id: de-m9-r2-h08
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'Which statements about Bessel''s equation of order zero, $x^2y'''' + xy'' + x^2y = 0$, are true? Select all that apply.'
  choices:
    - '$x = 0$ is a regular singular point'
    - 'Its indicial equation has the double root $r = 0$'
    - 'Every solution is bounded near $x = 0$'
    - 'In the series for $J_0$, all odd coefficients $a_1, a_3, a_5, \dots$ are zero'
  answer: [0, 1, 3]
  explanation: |-
    $xp = 1$ and $x^2q = x^2$ are analytic, so 0 is regular, with $p_0 = 1$, $q_0 = 0$ and indicial equation $r^2 = 0$. The $x^{1}$ coefficient forces $a_1 = 0$, and the recurrence $a_n = -a_{n-2}/n^2$ carries that to every odd index. The double root forces a logarithm in the second solution, which is unbounded at 0.
- id: de-m9-r2-h09
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'Using $J_0(x) = \sum_{k=0}^\infty\dfrac{(-1)^k}{(k!)^2}\left(\dfrac x2\right)^{2k}$, find $J_0(2)$ to 3 decimal places.'
  choices: ['$0.250$', '$0.224$', '$0.765$', '$-0.224$']
  answer: 1
  explanation: |-
    With $x = 2$, $(x/2)^{2k} = 1$, so $J_0(2) = 1 - 1 + \tfrac14 - \tfrac1{36} + \tfrac1{576} - \tfrac1{14400} + \cdots \approx 0.2239$. Stopping after three terms gives 0.250; 0.765 is $J_0(1)$.
- id: de-m9-r2-h10
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'In the simplified model of the lesson, the radially symmetric modes of a round drum have frequencies proportional to the zeros $2.405$, $5.520$, $8.654, \dots$ of $J_0$. About how many times the lowest frequency is the second one?'
  choices: ['$2$', '$1.5$', '$2.295$', '$3$']
  answer: 2
  explanation: |-
    $5.520/2.405 \approx 2.295$. A string's second mode would be exactly 2 times its fundamental; the drum's ratios are not whole numbers, which is part of why a drum sounds less definitely pitched.
- id: de-m9-r2-h11
  lesson: de-m9-h-frobenius
  type: text
  topic: Frobenius method
  stem: 'Bessel''s equation of order $\nu$, $x^2y'''' + xy'' + (x^2 - \nu^2)y = 0$, has indicial equation $r^2 = \nu^2$. For $\nu = \tfrac13$, the two indicial roots differ by ___. (Exact fraction.)'
  accept: ['2/3']
  explanation: |-
    The roots are $\pm\tfrac13$, which differ by $\tfrac23$. That is not an integer, so there are two independent Frobenius series.
- id: de-m9-r2-h12
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'Why can''t an ordinary power series $\sum a_nx^n$ about 0 produce the solution $y_2 = x^{1/2}\left(1 - \dfrac x3 + \cdots\right)$ of $2xy'''' + y'' + y = 0$?'
  choices:
    - 'Its derivative behaves like $\dfrac{1}{2\sqrt x}$ and blows up at 0, but a power series has a finite derivative there'
    - 'Its coefficients do not satisfy any recurrence'
    - 'It only converges for $x < 1$'
    - 'It is not a solution for $x > 0$'
  answer: 0
  explanation: |-
    A power series is differentiable at its center, with $y'(0) = a_1$. The factor $x^{1/2}$ gives $y_2$ a vertical tangent at 0, which no power series can have. Its coefficients do follow a recurrence, it converges for all $x > 0$, and it solves the equation there.
- id: de-m9-r2-h13
  lesson: de-m9-h-frobenius
  topic: Frobenius method
  stem: 'At $x = 0$, the equation $x^3y'''' + y = 0$ has'
  choices:
    - 'an ordinary point, so two power series solutions exist'
    - 'a regular singular point with indicial roots 0 and 1'
    - 'a regular singular point with a double indicial root'
    - 'an irregular singular point, where Frobenius''s theorem does not apply'
  answer: 3
  explanation: |-
    $q = 1/x^3$, so $x^2q = 1/x$, which is not analytic at 0. The singularity is too strong for a Frobenius series to be guaranteed.
# Honors: Laplace's equation
- id: de-m9-r2-h14
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'On the rectangle $0 < x < a$, $0 < y < b$ with $u = 0$ on the left, right and bottom edges, separating $u = X(x)Y(y)$ gives $X_n = \sin\dfrac{n\pi x}{a}$. Which $Y_n$ goes with it?'
  choices:
    - '$\sin\dfrac{n\pi y}{a}$'
    - '$\cosh\dfrac{n\pi y}{a}$'
    - '$e^{-n\pi y/a}$'
    - '$\sinh\dfrac{n\pi y}{a}$'
  answer: 3
  explanation: |-
    $X''/X = -\lambda$ forces $Y''/Y = +\lambda$, so $Y'' - \lambda_nY = 0$ with solutions $\cosh$ and $\sinh$ (or exponentials). $Y(0) = 0$ keeps only $\sinh\dfrac{n\pi y}{a}$; $\cosh$ and $e^{-n\pi y/a}$ are not 0 at $y = 0$.
- id: de-m9-r2-h15
  lesson: de-m9-h-laplace
  type: text
  topic: Laplace's equation
  stem: 'A square plate has one edge held at 100° and the other three at 0°. Its steady temperature at the center is ___°.'
  accept: ['25']
  explanation: |-
    Rotating gives four problems, one per heated edge, which add up to the problem with every edge at 100°, whose solution is $u = 100$. By symmetry each contributes the same amount at the center: $100/4 = 25$. The series in Example 2 confirms it.
- id: de-m9-r2-h16
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'A unit square plate ($a = b = 1$) has top edge $u(x, 1) = 20\sin\pi x$ and the other edges at 0. Find $u\left(\tfrac12, \tfrac12\right)$.'
  choices: ['$3.99$', '$7.97$', '$10.00$', '$20.00$']
  answer: 0
  explanation: |-
    $u = 20\dfrac{\sinh\pi y}{\sinh\pi}\sin\pi x$. At the center, $\dfrac{\sinh(\pi/2)}{\sinh\pi} = \dfrac{1}{2\cosh(\pi/2)} \approx 0.1993$, so $u \approx 3.99$. Missing the factor 2 in $\sinh\pi = 2\sinh\frac\pi2\cosh\frac\pi2$ gives 7.97; 10 is just half the edge value, and 20 ignores the decay into the plate.
- id: de-m9-r2-h17
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'A harmonic function $u$ on a disk is not constant, and its values on the edge circle range from 10 to 50. Which statements must be true? Select all that apply.'
  choices:
    - '$u > 10$ everywhere inside the disk'
    - '$u < 50$ everywhere inside the disk'
    - '$u$ has a local maximum somewhere inside the disk'
    - '$u$ at the center equals the average of its edge values'
  answer: [0, 1, 3]
  explanation: |-
    By the maximum principle a nonconstant harmonic function takes its largest and smallest values only on the boundary, so inside it lies strictly between 10 and 50 and has no interior maximum. The mean value property says the center value is the average around the edge circle.
- id: de-m9-r2-h18
  lesson: de-m9-h-laplace
  type: order
  topic: Laplace's equation
  stem: 'Put the steps for solving Laplace''s equation on a rectangle with only the top edge nonzero in order.'
  items:
    - 'Separate: $u = X(x)Y(y)$'
    - 'Solve the $x$ eigenvalue problem: $X_n = \sin\frac{n\pi x}{a}$'
    - 'Solve $Y'''' - \lambda_nY = 0$ with $Y(0) = 0$: $Y_n = \sinh\frac{n\pi y}{a}$'
    - 'Superpose: $u = \sum c_n\sinh\frac{n\pi y}{a}\sin\frac{n\pi x}{a}$'
    - 'Match the top edge: $c_n\sinh\frac{n\pi b}{a} = b_n$'
  explanation: |-
    The eigenvalues come from the $x$ problem (zero at both side edges), and the $Y$ equation needs them. The top-edge data can only be matched once all the modes are added together.
- id: de-m9-r2-h19
  lesson: de-m9-h-laplace
  type: match
  topic: Laplace's equation
  stem: 'Match each term with its meaning.'
  pairs:
    - [Harmonic function, A solution of Laplace's equation]
    - [Dirichlet problem, Finding u inside a region from its values on the boundary]
    - [Mean value property, The value at a point equals the average over any circle around it]
    - [Maximum principle, Extreme values occur on the boundary]
  distractors: [The value at the center is always the largest]
  explanation: |-
    These are the basic facts about $u_{xx} + u_{yy} = 0$. The distractor contradicts the maximum principle: a nonconstant harmonic function has no interior maximum.
- id: de-m9-r2-h20
  lesson: de-m9-h-laplace
  type: text
  topic: Laplace's equation
  stem: 'A disk of radius 2 has edge temperature $f(\theta) = 5 + 2\sin\theta$. At the point $r = 1$, $\theta = \pi/2$ inside, the steady temperature is ___. (Give only the number.)'
  accept: ['6']
  explanation: |-
    $u = 5 + 2\left(\dfrac r2\right)\sin\theta$. At $r = 1$, $\theta = \pi/2$: $u = 5 + 2 \cdot \tfrac12 \cdot 1 = 6$. (In Cartesian form $u = 5 + y$, which is clearly harmonic.)
- id: de-m9-r2-h21
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'Separating Laplace''s equation on a disk gives radial factors $r^n$ and $r^{-n}$ (and $1$, $\ln r$ for $n = 0$). Why are $r^{-n}$ and $\ln r$ discarded?'
  choices:
    - 'They do not satisfy the Cauchy–Euler equation'
    - 'They are unbounded at the center, where the temperature must be finite'
    - 'They are not periodic in $\theta$'
    - 'They make the boundary condition impossible to match'
  answer: 1
  explanation: |-
    Both blow up as $r \to 0$, but the center is a point of the plate with a finite temperature. They do solve the radial equation, and periodicity concerns the $\theta$ factor. (On a ring that excludes the center, they would be kept.)
- id: de-m9-r2-h22
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'The disk solution of Example 3 (radius 2) is $u = 3 + 2x - \dfrac{xy}{2}$. What is $u$ at the point $(-1, 1)$ inside the disk?'
  choices: ['$2$', '$0.5$', '$5.5$', '$1.5$']
  answer: 3
  explanation: |-
    $(-1, 1)$ is at distance $\sqrt2 < 2$ from the center, so it is inside. $u = 3 + 2(-1) - \dfrac{(-1)(1)}{2} = 3 - 2 + 0.5 = 1.5$. Forgetting that $-xy/2$ becomes $+0.5$ gives 0.5; dropping the $\tfrac12$ gives 2; and $5.5$ comes from using $+2$ for $2x$.
- id: de-m9-r2-h23
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'Which function is harmonic (satisfies $u_{xx} + u_{yy} = 0$)?'
  choices: ['$x^2 + y^2$', '$x^2 - y^2$', '$x^3 - y^3$', '$e^x\sin x$']
  answer: 1
  explanation: |-
    For $x^2 - y^2$: $u_{xx} + u_{yy} = 2 - 2 = 0$. For $x^2 + y^2$ the sum is 4; for $x^3 - y^3$ it is $6x - 6y$; and $e^x\sin x$ has $u_{xx} = 2e^x\cos x$, $u_{yy} = 0$.
- id: de-m9-r2-h24
  lesson: de-m9-h-laplace
  type: text
  topic: Laplace's equation
  stem: 'If every edge of a plate is held at 100°, the steady temperature everywhere inside is ___°.'
  accept: ['100']
  explanation: |-
    The constant $u = 100$ is harmonic and matches the boundary, and by the maximum principle the solution is unique. (Also, $100 \le u \le 100$ inside.)
- id: de-m9-r2-h25
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'A plate with $a = 1$, $b = 2$ has top edge $u(x, 2) = 6\sin\pi x$ and the other edges at 0. In $u = \sum c_n\sinh(n\pi y)\sin(n\pi x)$, what is $c_1$?'
  choices:
    - '$6$'
    - '$\dfrac{6}{\sinh 2\pi}$'
    - '$\dfrac{6}{\sinh\pi}$'
    - '$6\sinh 2\pi$'
  answer: 1
  explanation: |-
    At the top, $c_1\sinh(\pi \cdot 2) = 6$, so $c_1 = \dfrac{6}{\sinh 2\pi} \approx 0.0224$. Taking $c_1 = 6$ forgets the sinh factor; $\sinh\pi$ uses $b = 1$ instead of $b = 2$.
- id: de-m9-r2-h26
  lesson: de-m9-h-laplace
  topic: Laplace's equation
  stem: 'Why can''t both factors in a separated solution $X(x)Y(y)$ of Laplace''s equation be sines?'
  choices:
    - 'Sines don''t satisfy any boundary condition'
    - 'The product of two sines is not differentiable'
    - '$X''''/X = -Y''''/Y$, so if one ratio is negative the other is positive, giving exponentials or sinh and cosh'
    - 'Laplace''s equation is nonlinear'
  answer: 2
  explanation: |-
    Laplace's equation gives $X''Y + XY'' = 0$, so $X''/X = -Y''/Y$. If $X$ oscillates ($X''/X = -\lambda < 0$), then $Y''/Y = \lambda > 0$, so $Y$ grows or decays. The equation is linear, and sines satisfy zero boundary values perfectly well.
# Honors: d'Alembert's solution
- id: de-m9-r2-h27
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'For $u_{tt} = a^2u_{xx}$ with $a > 0$, which describes a shape moving to the left at speed $a$?'
  choices: ['$F(x - at)$', '$G(x + at)$', '$F(at - x)$', '$G(x)\cos at$']
  answer: 1
  explanation: |-
    $G(x + at)$ takes at $x$ the value that $G$ had at $x + at$, to the right; so the graph is the graph of $G$ shifted $at$ units left. $F(x - at)$ moves right. $F(at - x)$ is a function of $x - at$ too, so it also moves right, and $G(x)\cos at$ is a standing wave.
- id: de-m9-r2-h28
  lesson: de-m9-h-dalembert
  type: text
  topic: d'Alembert's solution
  stem: 'A long string with $a = 2$ starts at rest with $f(x) = \max(0,\ 1 - |x|)$. Then $u(1, 0.25) =$ ___. (Give a decimal or fraction.)'
  accept: ['0.25', '1/4']
  explanation: |-
    $u = \tfrac12[f(x - 2t) + f(x + 2t)]$. At $x = 1$, $t = 0.25$: $\tfrac12[f(0.5) + f(1.5)] = \tfrac12(0.5 + 0) = 0.25$.
- id: de-m9-r2-h29
  lesson: de-m9-h-dalembert
  type: label
  topic: d'Alembert's solution
  stem: 'The picture shows the $xt$-plane for the wave equation with speed $a$. Name the numbered parts.'
  image: {src: images/de-m9-characteristics-blank.svg, alt: 'The xt-plane with a point above the x-axis. Two straight lines run down from the point to the x-axis, one down to the left and one down to the right, enclosing a shaded triangle. The base of the triangle on the x-axis is highlighted. Four numbered markers.'}
  labels:
    - {x: 53.1, y: 29.5, text: The point (x0, t0)}
    - {x: 40.6, y: 56.8, text: Characteristic line x − at = constant}
    - {x: 65.6, y: 56.8, text: Characteristic line x + at = constant}
    - {x: 46.9, y: 84.1, text: Domain of dependence}
  distractors: [Range of influence, Fixed end of the string]
  explanation: |-
    The value at $(x_0, t_0)$ (marker 1) depends only on initial data between $x_0 - at_0$ and $x_0 + at_0$ (marker 4). Along the left line, $x$ grows as $t$ grows, so $x - at$ stays equal to $x_0 - at_0$ (marker 2); along the right line, $x + at = x_0 + at_0$ (marker 3). The range of influence would be a wedge opening upward from a point on the $x$-axis.
- id: de-m9-r2-h30
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'For an infinite string, which statements about $u(x_0, t_0)$ given by d''Alembert''s formula are true? Select all that apply.'
  choices:
    - 'It depends on $g$ only between $x_0 - at_0$ and $x_0 + at_0$'
    - 'It depends on $f$ only at the two points $x_0 - at_0$ and $x_0 + at_0$'
    - 'It depends on the values of $f$ everywhere on the string'
    - 'Changing $g$ near $x_0 + 2at_0$ changes $u(x_0, t_0)$'
  answer: [0, 1]
  explanation: |-
    $u = \tfrac12[f(x_0 - at_0) + f(x_0 + at_0)] + \tfrac{1}{2a}\int_{x_0 - at_0}^{x_0 + at_0}g$. Nothing outside the domain of dependence $[x_0 - at_0,\ x_0 + at_0]$ enters, and $x_0 + 2at_0$ lies outside it (for $t_0 > 0$).
- id: de-m9-r2-h31
  lesson: de-m9-h-dalembert
  type: order
  topic: d'Alembert's solution
  stem: 'A string with $L = 4$, $a = 1$ and fixed ends is released from rest with a triangular pulse in the middle. Put these snapshots in time order.'
  items:
    - 'Two half-height pulses, each just touching an end'
    - 'The string is momentarily flat everywhere'
    - 'An upside-down copy of the pulse sits in the middle'
    - 'The original pulse is back in the middle'
  explanation: |-
    These happen at $t = 1$, $t = 2$ (each half cancels its inverted mirror image at an end), $t = 4 = L/a$ (the inverted halves meet) and $t = 8 = 2L/a$ (one full period).
- id: de-m9-r2-h32
  lesson: de-m9-h-dalembert
  type: text
  topic: d'Alembert's solution
  stem: 'A long string with $a = 1$ is flat at $t = 0$, with initial velocity $g(x) = 1$ for $|x| < 1$ and 0 elsewhere. Then $u(3, 3.5) =$ ___. (Give a decimal or fraction.)'
  accept: ['0.75', '3/4']
  explanation: |-
    $u = \tfrac12 \times$ (length of $[x - t,\ x + t] \cap [-1, 1]$). Here $[3 - 3.5,\ 3 + 3.5] = [-0.5,\ 6.5]$ overlaps $[-1, 1]$ in $[-0.5, 1]$, of length 1.5, so $u = 0.75$.
- id: de-m9-r2-h33
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'In the hammer problem ($a = 1$, initial velocity 1 on $|x| < 1$, zero initial position), when does the point $x = 5$ first start to move?'
  choices: ['$t = 5$', '$t = 6$', '$t = 4$', '$t = 2.5$']
  answer: 2
  explanation: |-
    $u(5, t)$ stays 0 until the interval $[5 - t,\ 5 + t]$ reaches the struck region, that is until $5 - t = 1$, so $t = 4$. Disturbances travel at speed 1 from the nearest struck point, $x = 1$, which is 4 units away; 5 would be the distance from the center.
- id: de-m9-r2-h34
  lesson: de-m9-h-dalembert
  type: match
  topic: d'Alembert's solution
  stem: 'Match each expression or idea with what it means for the wave equation.'
  pairs:
    - ['$F(x - at)$', 'A shape moving right at speed a']
    - ['$G(x + at)$', 'A shape moving left at speed a']
    - ['The odd $2L$-periodic extension of $f$ and $g$', 'Handles a string with fixed ends']
    - ['$u_{\xi\eta} = 0$', 'The wave equation in characteristic coordinates']
  distractors: [A shape that decays in place]
  explanation: |-
    With $\xi = x - at$ and $\eta = x + at$ the wave equation becomes $u_{\xi\eta} = 0$, whose solutions are $F(\xi) + G(\eta)$: right- and left-moving waves. The odd periodic extension makes the two pieces cancel at the ends. Decaying in place is what heat modes do.
- id: de-m9-r2-h35
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'A string with fixed ends has $L = 3$ and $a = 2$. After how long does any motion of the string repeat exactly?'
  choices: ['$1.5$', '$6$', '$0.75$', '$3$']
  answer: 3
  explanation: |-
    In time $2L/a$ each traveling piece moves a distance $2L$, one full period of the odd $2L$-periodic extension, so the whole shape repeats: $2L/a = 6/2 = 3$. This is the period of the fundamental mode, whose frequency is $a/(2L)$. $L/a = 1.5$ is only half a period, when the shape is upside down.
- id: de-m9-r2-h36
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'Which identity shows that the standing wave $\sin x\cos t$ is a sum of two traveling waves?'
  choices:
    - '$\sin x\cos t = \tfrac12[\sin(x - t) + \sin(x + t)]$'
    - '$\sin x\cos t = \sin(x - t) + \sin(x + t)$'
    - '$\sin x\cos t = \tfrac12[\cos(x - t) - \cos(x + t)]$'
    - '$\sin x\cos t = \tfrac12[\sin(x + t) - \sin(x - t)]$'
  answer: 0
  explanation: |-
    $\sin(x - t) + \sin(x + t) = 2\sin x\cos t$, so half of it is the standing wave. The cosine difference gives $\sin x\sin t$, and the sine difference gives $\cos x\sin t$.
- id: de-m9-r2-h37
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'Which statement contrasts the wave equation with the heat equation correctly?'
  choices:
    - 'Both spread disturbances at a finite speed'
    - 'The heat equation spreads disturbances at speed $\alpha$'
    - 'Waves spread at the finite speed $a$; in the heat equation model a local change is felt everywhere at once, though very faintly far away'
    - 'Neither equation lets a disturbance reach distant points'
  answer: 2
  explanation: |-
    d'Alembert's formula shows that $u(x_0, t_0)$ sees only data within $at_0$ of $x_0$. On an infinite rod, a hot spot at $t = 0$ makes the temperature rise everywhere for every $t > 0$, so the heat model has no finite signal speed (an idealization, but an important difference).
- id: de-m9-r2-h38
  lesson: de-m9-h-dalembert
  topic: d'Alembert's solution
  stem: 'An infinite string starts at rest with $u(x, 0) = \sin x$. What does d''Alembert''s formula give?'
  choices:
    - '$u = \sin(x - at)$'
    - '$u = \sin x + \sin at$'
    - '$u = \sin x\,e^{-a^2t}$'
    - '$u = \sin x\cos at$'
  answer: 3
  explanation: |-
    With $g = 0$, $u = \tfrac12[\sin(x - at) + \sin(x + at)] = \sin x\cos at$: a standing wave. Only half the shape moves each way; $\sin(x - at)$ alone would have initial velocity $-a\cos x$, not 0. The exponential is a heat-equation mode.
- id: de-m9-r2-h39
  lesson: de-m9-h-dalembert
  type: text
  topic: d'Alembert's solution
  stem: 'A pulse of height 1 on a long string is released from rest. Once the two traveling pieces have separated, each has height ___. (Give a decimal or fraction.)'
  accept: ['0.5', '1/2']
  explanation: |-
    With $g = 0$, $u = \tfrac12[f(x - at) + f(x + at)]$: two copies of $f$ at half height moving apart.
