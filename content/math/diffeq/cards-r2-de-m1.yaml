# Round 2 cards for module de-m1 (honors lessons)
- {front: 'How do you find the differential equation of a one-parameter family of curves?', back: 'Differentiate the family''s equation, then eliminate the constant $C$ using the original equation, leaving a relation among $x$, $y$ and $y''$.', topic: Orthogonal trajectories}
- {front: 'Orthogonal trajectories: the slope rule', back: 'If the family satisfies $y'' = f(x, y)$, its orthogonal trajectories satisfy $y'' = -\dfrac{1}{f(x, y)}$.', topic: Orthogonal trajectories}
- {front: 'Why must $C$ be eliminated before finding orthogonal trajectories?', back: 'The trajectory''s slope at a point must be given by the point''s coordinates alone, whichever family member passes through it; a slope with $C$ describes only one curve.', topic: Orthogonal trajectories}
- {front: 'Orthogonal trajectories of $y = Cx^n$', back: '$x^2 + ny^2 = K$ (for example ellipses $x^2 + 2y^2 = K$ when $n = 2$).', topic: Orthogonal trajectories}
- {front: 'Orthogonal trajectories of the circles $x^2 + y^2 = C$', back: 'The lines through the origin, $y = Kx$ (and $x = 0$).', topic: Orthogonal trajectories}
- {front: 'Orthogonal trajectories of $xy = C$', back: 'The hyperbolas $y^2 - x^2 = K$.', topic: Orthogonal trajectories}
- {front: 'Orthogonal trajectories of $y = Ce^x$', back: 'The parabolas $y^2 = K - 2x$ (from $y'' = -1/y$).', topic: Orthogonal trajectories}
- {front: 'Name three pairs of orthogonal families in science', back: 'Contour lines and steepest-descent paths; equipotentials and electric field lines; isotherms and heat flow lines (steady heat flow in a uniform plate).', topic: Orthogonal trajectories}
- {front: 'Self-orthogonal family', back: 'A family whose orthogonal trajectories belong to the same family, such as the confocal parabolas $y^2 = 4C(x + C)$.', topic: Orthogonal trajectories}
- {front: 'Common slip: using $-f$ or $1/f$ for the trajectory slope', back: 'Neither is perpendicular to $f$. Only the negative reciprocal $-1/f$ works, since perpendicular slopes multiply to $-1$.', topic: Orthogonal trajectories}
- {front: 'SI epidemic model', back: '$\dfrac{dI}{dt} = \beta I\left(1 - \dfrac{I}{N}\right)$: logistic with $K = N$. Spread is fastest at $I = N/2$, at rate $\beta N/4$.', topic: Logistic growth}
- {front: 'Why is SI spread proportional to $I(N - I)$?', back: 'A new infection needs a meeting of an infected and a susceptible person, and in a well-mixed population the number of such pairs is $I(N - I)$.', topic: Logistic growth}
- {front: 'Main limitation of the SI model', back: 'No recovery, so it predicts everyone is eventually infected. Adding recovery gives the SIR model, a system of equations.', topic: Logistic growth}
- {front: 'What does $u = 1/P$ do to the logistic equation?', back: 'It makes it linear: $u'' = -k\left(u - \dfrac1K\right)$, so $u - 1/K$ decays exponentially.', topic: Logistic growth}
- {front: 'Carrying capacity from three equally spaced counts', back: 'With $u_n = 1/P_n$: $\dfrac1K = \dfrac{u_0u_2 - u_1^2}{u_0 + u_2 - 2u_1}$; then $A = \dfrac{K}{P_0} - 1$.', topic: Logistic growth}
- {front: 'Gompertz model and solution', back: '$P'' = kP\ln\dfrac{K}{P}$; $P = K\exp\left(-\ln\frac{K}{P_0}\,e^{-kt}\right)$, found with $w = \ln(K/P)$, which satisfies $w'' = -kw$.', topic: Gompertz growth}
- {front: 'Gompertz inflection point and fastest rate', back: 'Inflection at $P = K/e \approx 0.37K$; fastest rate $kK/e$.', topic: Gompertz growth}
- {front: 'Logistic vs Gompertz relative growth rate', back: 'Logistic: $k(1 - P/K)$, falls linearly. Gompertz: $k\ln(K/P)$, falls like a logarithm (and is unbounded as $P \to 0$).', topic: Gompertz growth}
- {front: 'Logistic vs Gompertz shape', back: 'Logistic: S-curve symmetric about $K/2$. Gompertz: rises fast, bends over at $K/e$, then creeps up to $K$.', topic: Gompertz growth}
