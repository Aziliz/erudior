# Module 2 drills
- id: de-interval
  title: Interval of existence for a linear equation
  topic: Existence and uniqueness
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    t0: {min: -5, max: 5}
  where: ['abs(a - b) >= 2', 't0 > min(a, b)', 't0 < max(a, b)', 'a != 0', 'b != 0']
  calc:
    lo: min(a, b)
    hi: max(a, b)
    na: -a
    nb: -b
  prompt: 'The IVP $y'' + \dfrac{1}{t {na:signed}}\,y = \dfrac{1}{t {nb:signed}}$, $y({t0}) = 1$ has a unique solution on the largest open interval $(\alpha, \beta)$ containing $t_0 = {t0}$ on which the coefficients are continuous. Find $\alpha$ and $\beta$.'
  answers:
    - {name: lo, label: '$\alpha =$'}
    - {name: hi, label: '$\beta =$'}
  solution: |-
    $p(t)$ is discontinuous at $t = {a}$ and $g(t)$ at $t = {b}$. These split the line into pieces; the piece containing ${t0}$ is $({lo}, {hi})$, so $\alpha =$ **{lo}** and $\beta =$ **{hi}**.
- id: de-linear-if
  title: Linear equation with constant forcing
  topic: Linear first-order
  vars:
    a: {min: 1, max: 5}
    m: {min: -5, max: 5}
    y0: {min: -6, max: 8}
  where: ['y0 != m', 'm != 0']
  calc:
    b: a*m
    C: y0 - m
  prompt: 'Solve $y'' {a:signedcoef}y = {b}$ with $y(0) = {y0}$.'
  answers:
    - {kind: expression, expression: 'm + C*exp(-a*t)', variables: [t], label: '$y =$', show: '$y = {m} {C:signedcoef}e^{-{a:coef}t}$'}
  solution: |-
    Integrating factor $\mu = e^{{a:coef}t}$: $\left(e^{{a:coef}t}y\right)' = {b:coef}e^{{a:coef}t}$, so $e^{{a:coef}t}y = {m:coef}e^{{a:coef}t} + C$ and $y = {m} + Ce^{-{a:coef}t}$. At $t = 0$: ${y0} = {m} + C$, so $C = {C}$. Answer: **$y = {m} {C:signedcoef}e^{-{a:coef}t}$**.
- id: de-linear-ivp
  title: Linear equation with exponential forcing
  topic: Linear first-order
  vars:
    a: {min: 1, max: 4}
    bb: {min: -3, max: 3}
    q: {min: -4, max: 4}
    y0: {min: -5, max: 5}
  where: ['bb != 0', 'a + bb != 0', 'q != 0', 'y0 != q']
  calc:
    c: q*(a + bb)
    apb: a + bb
    C: y0 - q
  prompt: 'Solve $y'' {a:signedcoef}y = {c:coef}e^{{bb:coef}t}$ with $y(0) = {y0}$.'
  answers:
    - {kind: expression, expression: 'q*exp(bb*t) + C*exp(-a*t)', variables: [t], label: '$y =$', show: '$y = {q:coef}e^{{bb:coef}t} {C:signedcoef}e^{-{a:coef}t}$'}
  solution: |-
    $\mu = e^{{a:coef}t}$, so $\left(e^{{a:coef}t}y\right)' = {c:coef}e^{{apb:coef}t}$. Integrate: $e^{{a:coef}t}y = \dfrac{{c}}{{apb}}e^{{apb:coef}t} + C = {q:coef}e^{{apb:coef}t} + C$. Divide: $y = {q:coef}e^{{bb:coef}t} + Ce^{-{a:coef}t}$. At $t = 0$: $C = {y0} - ({q}) = {C}$. Answer: **$y = {q:coef}e^{{bb:coef}t} {C:signedcoef}e^{-{a:coef}t}$**.
- id: de-linear-power
  title: Linear equation with a power integrating factor
  topic: Linear first-order
  vars:
    k: {min: 2, max: 4}
    m: {min: 2, max: 4}
    q: {min: -3, max: 3}
    y0: {min: -4, max: 5}
  where: ['q != 0', 'y0 != q']
  calc:
    c: q*(m + k)
    mk: m + k
    C: y0 - q
    mk1: m + k - 1
  prompt: 'Solve $ty'' {k:signedcoef}y = {c:coef}t^{{m}}$ with $y(1) = {y0}$ (for $t > 0$).'
  answers:
    - {kind: expression, expression: 'q*t^m + C*t^(-k)', variables: [t], label: '$y =$', show: '$y = {q:coef}t^{{m}} {C:signedcoef}t^{-{k}}$'}
  solution: |-
    Standard form: $y' + \dfrac{{k}}{t}y = {c:coef}t^{{m}-1}$, so $\mu = e^{{k}\ln t} = t^{{k}}$. Then $(t^{{k}}y)' = {c:coef}t^{{mk1}}$, and $t^{{k}}y = \dfrac{{c}}{{mk}}t^{{mk}} + C$. So $y = {q:coef}t^{{m}} + Ct^{-{k}}$, and $y(1) = {q} + C = {y0}$ gives $C = {C}$. Answer: **$y = {q:coef}t^{{m}} {C:signedcoef}t^{-{k}}$**.
- id: de-exact-check
  title: Make an equation exact
  topic: Exact equations
  vars:
    k: {min: -3, max: 3}
    b: {min: -4, max: 4}
  where: ['k != 0', 'b != 0']
  calc:
    a: 3*k
    c: 2*b
  prompt: 'Find the constants $k$ and $c$ that make $\left({a}x^2y {b:signedcoef}y^2\right)dx + \left(kx^3 + cxy\right)dy = 0$ exact.'
  answers:
    - {name: k, label: '$k =$'}
    - {name: c, label: '$c =$'}
  solution: |-
    $M_y = {a}x^2 {c:signedcoef}y$ and $N_x = 3kx^2 + cy$. Matching coefficients: $3k = {a}$ gives $k =$ **{k}**, and $c =$ **{c}**.
- id: de-exact-solve
  title: Solve an exact equation
  topic: Exact equations
  vars:
    a: {min: -3, max: 3}
    p: {min: -5, max: 5}
    q: {min: -2, max: 2}
    x0: {min: -2, max: 2}
    y0: {min: -2, max: 2}
  where: ['a != 0', 'p != 0', 'q != 0']
  calc:
    a2: 2*a
    q3: 3*q
    C: a*x0^2*y0 + p*x0 + q*y0^3
  prompt: 'The equation $\left({a2}xy {p:signed}\right)dx + \left({a:coef}x^2 {q3:signed}y^2\right)dy = 0$ is exact. Its solution through $({x0}, {y0})$ is $F(x, y) = C$, where $F$ has no constant term. Find $C$.'
  answers:
    - {name: C, label: '$C =$'}
  solution: |-
    $F = \int ({a2}xy {p:signed})\,dx = {a:coef}x^2y {p:signedcoef}x + h(y)$. Then $F_y = {a:coef}x^2 + h'(y)$ must equal ${a:coef}x^2 {q3:signed}y^2$, so $h = {q:coef}y^3$. So $F = {a:coef}x^2y {p:signedcoef}x {q:signedcoef}y^3$, and at $({x0}, {y0})$: $C =$ **{C}**.
- id: de-bernoulli-w
  title: Solve a Bernoulli equation
  topic: Substitutions
  vars:
    a: {min: 1, max: 2}
    m: {min: 1, max: 3}
    n: {min: 2, max: 5}
  where: ['n != m']
  calc:
    b: a*m
    d: n - m
  prompt: 'Solve the Bernoulli equation $y'' {a:signedcoef}y = {b:coef}y^2$ with $y(0) = \dfrac{1}{{n}}$.'
  answers:
    - {kind: expression, expression: '1/(m + d*exp(a*t))', variables: [t], label: '$y =$', show: '$y = \dfrac{1}{{m} {d:signedcoef}e^{{a:coef}t}}$'}
  solution: |-
    With $n = 2$, set $v = y^{-1}$. Dividing by $y^2$ gives $-v' + {a:coef}v = {b}$, that is $v' - {a:coef}v = -{b}$. Integrating factor $e^{-{a:coef}t}$: $v = {m} + Ce^{{a:coef}t}$. Since $v(0) = {n}$, $C = {d}$. Answer: **$y = \dfrac{1}{{m} {d:signedcoef}e^{{a:coef}t}}$**.
- id: de-homog-ivp
  title: Solve a homogeneous equation
  topic: Substitutions
  vars:
    a: {min: -4, max: 4}
    y0: {min: -5, max: 5}
  where: ['a != 0', 'y0 != 0']
  prompt: 'Solve $\dfrac{dy}{dx} = \dfrac{y {a:signedcoef}x}{x}$ for $x > 0$ with $y(1) = {y0}$.'
  answers:
    - {kind: expression, expression: 'a*x*ln(x) + y0*x', variables: [x], label: '$y =$', show: '$y = {a:coef}x\ln x {y0:signedcoef}x$'}
  solution: |-
    The right side is $\dfrac{y}{x} {a:signed}$, a function of $v = y/x$. With $y = vx$: $v + xv' = v {a:signed}$, so $v' = \dfrac{{a}}{x}$ and $v = {a:coef}\ln x + C$. Then $y = {a:coef}x\ln x + Cx$, and $y(1) = C = {y0}$. Answer: **$y = {a:coef}x\ln x {y0:signedcoef}x$**.
