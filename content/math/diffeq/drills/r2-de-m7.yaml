# Round 2, module de-m7: drills for honors lessons 32h1-32h3
- id: de-m7-r2-periodic-pulse
  title: Transform of a periodic pulse train
  topic: Laplace transforms of periodic functions
  vars:
    k: {min: 1, max: 5}
    w: {choices: [1, 2]}
    d: {min: 1, max: 3}
    s0: {choices: [0.5, 1, 2]}
  calc:
    T: w + d
    F: k*(1 - exp(-w*s0))/(s0*(1 - exp(-T*s0)))
  prompt: 'A periodic input equals {k} for $0 \le t < {w}$ and 0 for ${w} \le t < {T}$, repeating with period {T}. Find its Laplace transform at $s = {s0}$, to 4 decimal places.'
  answers:
    - {name: F, label: '$F({s0}) \approx$', tolerance: 0.00006, format: num4}
  solution: |-
    One period: $\displaystyle\int_0^{w} {k:coef}e^{-st}\,dt = \dfrac{{k:coef}(1 - e^{-{w:coef}s})}{s}$. Divide by $1 - e^{-{T:coef}s}$ (the full period is {T}): $F(s) = \dfrac{{k:coef}(1 - e^{-{w:coef}s})}{s(1 - e^{-{T:coef}s})}$. At $s = {s0}$ this is **{F:num4}**.
- id: de-m7-r2-periodic-steady
  title: Periodic steady state under a square wave
  topic: Laplace transforms of periodic functions
  vars:
    a: {min: 1, max: 3}
    b: {min: 1, max: 6}
    p: {choices: [0.5, 1, 2]}
  calc:
    ap: a*p
    r: exp(-ap)
    M: b/a/(1 + r)
    m: b/a*r/(1 + r)
  prompt: 'The equation $y'' + {a:coef}y = {b:coef}f(t)$ is driven by the on/off square wave $f$ (1 for a time {p}, then 0 for a time {p}, repeating). Find the maximum $M$ and minimum $m$ of the periodic steady state, to 4 decimal places.'
  answers:
    - {name: M, label: '$M \approx$', tolerance: 0.00006, format: num4}
    - {name: m, label: '$m \approx$', tolerance: 0.00006, format: num4}
  solution: |-
    While the input is on, $y$ moves from $m$ toward the equilibrium $\dfrac{{b}}{{a}}$: $M = \dfrac{{b}}{{a}} - \left(\dfrac{{b}}{{a}} - m\right)r$ with $r = e^{-{ap}} \approx {r:num4}$. While it is off, $y$ decays: $m = Mr$. Substituting, $M(1 - r^2) = \dfrac{{b}}{{a}}(1 - r)$, so $M = \dfrac{{b}}{{a}}\cdot\dfrac{1}{1 + r} \approx$ **{M:num4}** and $m = Mr \approx$ **{m:num4}**.
- id: de-m7-r2-t-times
  title: Transform of t times a damped sine
  topic: Transform rules in s
  vars:
    a: {min: -3, max: 3}
    bb: {min: 1, max: 4}
  where: ['a != 0']
  calc:
    na: -a
    b2: 2*bb
    bsq: bb^2
  prompt: 'Use $\mathcal{L}\{tf(t)\} = -F''(s)$ to find $\mathcal{L}\{t\,e^{{a:coef}t}\sin {bb:coef}t\}$.'
  answers:
    - {kind: expression, expression: '2*bb*(s - a)/((s - a)^2 + bb^2)^2', variables: [s], label: '$\mathcal{L} =$', show: '$\dfrac{{b2}(s {na:signed})}{\left((s {na:signed})^2 + {bsq}\right)^2}$'}
  solution: |-
    Without the $t$: $F(s) = \mathcal{L}\{e^{{a:coef}t}\sin {bb:coef}t\} = \dfrac{{bb}}{(s {na:signed})^2 + {bsq}}$. By the chain rule, $F'(s) = -\dfrac{{bb}\cdot2(s {na:signed})}{\left((s {na:signed})^2 + {bsq}\right)^2}$. So the transform is $-F'(s) =$ **$\dfrac{{b2}(s {na:signed})}{\left((s {na:signed})^2 + {bsq}\right)^2}$**.
- id: de-m7-r2-sinc-integral
  title: An integral from a transform
  topic: Transform rules in s
  vars:
    a: {min: 1, max: 4}
    bb: {min: 1, max: 5}
  calc:
    v: atan(bb/a)
  prompt: 'Use $\mathcal{L}\left\{\dfrac{\sin kt}{t}\right\} = \arctan\dfrac{k}{s}$ to evaluate $\displaystyle\int_0^\infty e^{-{a:coef}t}\,\frac{\sin {bb:coef}t}{t}\,dt$ to 4 decimal places.'
  answers:
    - {name: v, label: '$\approx$', tolerance: 0.00006, format: num4}
  solution: |-
    The integral is the Laplace transform of $\dfrac{\sin {bb:coef}t}{t}$ evaluated at $s = {a}$, so it equals $\arctan\dfrac{{bb}}{{a}} \approx$ **{v:num4}** (radians).
- id: de-m7-r2-final-value
  title: Final value of a step response
  topic: Poles and stability
  vars:
    p: {min: 1, max: 3}
    q: {min: 1, max: 9}
    bb: {min: 1, max: 6}
    c: {min: 1, max: 9}
    k: {min: 1, max: 5}
  calc:
    kq: k*q
    fv: k*q/c
  prompt: 'A system with transfer function $H(s) = \dfrac{{p:coef}s + {q}}{s^2 + {bb:coef}s + {c}}$ starts at rest and receives the step input $g(t) = {k}u_0(t)$. Find $\displaystyle\lim_{t\to\infty}y(t)$ as an exact fraction.'
  answers:
    - {name: fv, label: '$\lim y =$', kind: fraction, lowestTerms: true}
  solution: |-
    $Y(s) = H(s)\cdot\dfrac{{k}}{s}$, so $sY = {k:coef}H(s)$. Its poles are the roots of $s^2 + {bb:coef}s + {c}$, which has positive coefficients, so both lie in the left half-plane and the final value theorem applies: $\lim y = \lim_{s\to0}{k:coef}H(s) = {k:coef}H(0) = \dfrac{{kq}}{{c}} =$ **{fv:frac}**.
- id: de-m7-r2-routh-gain
  title: Stability limit of a cubic
  topic: Poles and stability
  vars:
    a: {min: 1, max: 5}
    bb: {min: 2, max: 9}
  calc:
    K: a*bb
    w: sqrt(bb)
  prompt: 'The polynomial $s^3 + {a:coef}s^2 + {bb:coef}s + K$ has all its roots in the open left half-plane exactly when $0 < K < K_{\max}$. Find $K_{\max}$, and the angular frequency $\omega$ of the steady oscillation (the roots on the imaginary axis) when $K = K_{\max}$, to 3 decimal places.'
  answers:
    - {name: K, label: '$K_{\max} =$', tolerance: 0}
    - {name: w, label: '$\omega \approx$', tolerance: 0.0006, format: dp3}
  solution: |-
    Routh–Hurwitz for a cubic $a_3s^3 + a_2s^2 + a_1s + a_0$: all coefficients positive and $a_2a_1 > a_3a_0$. Here that is $K > 0$ and ${a}\cdot{bb} > K$, so $K_{\max} =$ **{K}**. At $K = {K}$ the polynomial factors as $(s + {a})(s^2 + {bb})$, with roots $-{a}$ and $\pm i\sqrt{{bb}}$, so $\omega = \sqrt{{bb}} \approx$ **{w:dp3}**.
