# Module 6, round 2 drills (honors lessons)
- id: de-m6-r2-shift-double
  title: Exponential shift on a double root
  topic: Annihilators
  vars:
    a: {min: -3, max: 3}
    B: {min: -3, max: 3}
  where: ['a != 0', 'B != 0']
  calc:
    b: -2*a
    a2: a^2
    c: 6*B
    na: -a
  prompt: 'Find a particular solution of $y'''' {b:signedcoef}y'' {a2:signed}y = {c:coef}te^{{a:coef}t}$. Type products with a star, e.g. t^3*e^(2t).'
  answers:
    - {kind: expression, expression: 'B*t^3*exp(a*t)', variables: [t], label: '$Y =$', show: '$Y = {B:coef}t^3e^{{a:coef}t}$'}
  solution: |-
    The characteristic polynomial is $r^2 {b:signedcoef}r {a2:signed} = (r {na:signed})^2$, a double root $r = {a}$, so $e^{{a:coef}t}$ and $te^{{a:coef}t}$ are in $y_c$. Write $Y = e^{{a:coef}t}v$. The exponential shift rule turns $(D {na:signed})^2$ into $D^2$: $e^{{a:coef}t}v'' = {c:coef}te^{{a:coef}t}$, so $v'' = {c:coef}t$ and $v = {B:coef}t^3$ (dropping the $c_1 + c_2t$ that would only reproduce $y_c$). Answer: **$Y = {B:coef}t^3e^{{a:coef}t}$**.
- id: de-m6-r2-annihilator-pick
  title: Smallest annihilator
  topic: Annihilators
  vars:
    al: {min: -3, max: 3}
    be: {min: 1, max: 4}
    tp: {choices: [{label: 't', value: 1}, {label: 't^2', value: 2}]}
  where: ['al != 0']
  calc:
    m: tp + 1
    cst: al^2 + be^2
    nal: -al
    ntal: -2*al
  prompt: 'Find the smallest annihilator of $f(t) = {tp}e^{{al:coef}t}\cos {be:coef}t$. Give it as a polynomial $A(r)$ in $r$ with leading coefficient 1 (factored is fine), e.g. ((r-1)^2+4)^2.'
  answers:
    - {kind: expression, expression: '((r - al)^2 + be^2)^(tp + 1)', variables: [r], label: '$A(r) =$', show: '$A(r) = \big((r {nal:signed})^2 + {be}^2\big)^{{m}}$'}
  solution: |-
    $e^{{al:coef}t}\cos {be:coef}t$ comes from the complex pair $r = {al} \pm {be:coef}i$, whose quadratic is $(r {nal:signed})^2 + {be}^2 = r^2 {ntal:signedcoef}r + {cst}$. The factor ${tp}$ means the pair must have multiplicity ${m}$, one more than the power of $t$. Answer: **$A(r) = \big((r {nal:signed})^2 + {be}^2\big)^{{m}}$**.
- id: de-m6-r2-q-bandwidth
  title: Quality factor and bandwidth
  topic: Quality factor
  vars:
    m: {choices: [0.5, 1, 2, 4]}
    k: {choices: [2, 8, 18, 25, 32, 50, 72, 100]}
    gam: {choices: [0.1, 0.2, 0.4, 0.5, 1]}
  where: ['sqrt(k*m)/gam > 1']
  calc:
    km: k*m
    Q: sqrt(k*m)/gam
    dw: gam/m
    w0: sqrt(k/m)
  prompt: 'A forced oscillator $mu'''' + \gamma u'' + ku = F_0\cos\omega t$ has $m = {m}$ kg, $\gamma = {gam}$ N·s/m and $k = {k}$ N/m. Find its quality factor $Q$ (2 decimal places) and its half-power bandwidth $\Delta\omega$ in rad/s.'
  answers:
    - {name: Q, label: '$Q$', tolerance: 0.0051, format: num2}
    - {name: dw, label: '$\Delta\omega$ (rad/s)', tolerance: 0.0006, format: num4}
  solution: |-
    $Q = \dfrac{\sqrt{km}}{\gamma} = \dfrac{\sqrt{{km}}}{{gam}} \approx$ **{Q:num2}**. The bandwidth is $\Delta\omega = \dfrac{\gamma}{m} = \dfrac{{gam}}{{m}} =$ **{dw:num4} rad/s**. Check: $\omega_0 = \sqrt{k/m} \approx {w0:num4}$ and $\omega_0/\Delta\omega \approx {Q:num2}$.
- id: de-m6-r2-log-decrement
  title: Damping from a decay record
  topic: Quality factor
  vars:
    u1: {min: 6, max: 12}
    u2: {min: 3, max: 11}
  where: ['u2 < u1', 'u2 >= 0.5*u1']
  calc:
    dl: ln(u1/u2)
    z: dl/sqrt(4*pi^2 + dl^2)
    Q: 1/(2*z)
  prompt: 'Two successive maxima of a damped free oscillation are {u1} cm and {u2} cm. Find the logarithmic decrement $\delta$ (4 decimal places), and the quality factor $Q$ to 3 significant figures using the exact relation $\zeta = \delta/\sqrt{4\pi^2 + \delta^2}$.'
  answers:
    - {name: dl, label: '$\delta$', tolerance: 0.00006, format: num4}
    - {name: Q, label: '$Q$', relTolerance: 0.006, format: num2}
  solution: |-
    $\delta = \ln\dfrac{{u1}}{{u2}} \approx$ **{dl:num4}**. Then $\zeta = \dfrac{\delta}{\sqrt{4\pi^2 + \delta^2}} \approx {z:num4}$ and $Q = \dfrac{1}{2\zeta} \approx$ **{Q:num2}** (the shortcut $\pi/\delta$ gives nearly the same for light damping).
- id: de-m6-r2-rlc-q
  title: Resonant frequency and Q of an RLC circuit
  topic: Quality factor
  vars:
    L: {choices: [0.01, 0.02, 0.05, 0.1, 0.2, 0.5]}
    cap: {choices: [{label: '1 \times 10^{-6}', value: 0.000001}, {label: '2 \times 10^{-6}', value: 0.000002}, {label: '5 \times 10^{-6}', value: 0.000005}, {label: '1 \times 10^{-5}', value: 0.00001}, {label: '1 \times 10^{-4}', value: 0.0001}]}
    R: {choices: [1, 2, 5, 10, 20, 50]}
  where: ['sqrt(L/cap)/R > 1']
  calc:
    w0: 1/sqrt(L*cap)
    Q: sqrt(L/cap)/R
    dw: R/L
  prompt: 'A series RLC circuit has $L = {L}$ H, $C = {cap}$ F and $R = {R}$ Ω. Find its natural frequency $\omega_0$ and its quality factor $Q$, each to 3 significant figures.'
  answers:
    - {name: w0, label: '$\omega_0$ (rad/s)', relTolerance: 0.006, format: sig3}
    - {name: Q, label: '$Q$', relTolerance: 0.006, format: sig3}
  solution: |-
    With $m \to L$, $\gamma \to R$, $k \to 1/C$: $\omega_0 = \dfrac{1}{\sqrt{LC}} \approx$ **{w0:sig3} rad/s**, and $Q = \dfrac1R\sqrt{\dfrac LC} \approx$ **{Q:sig3}**. (The bandwidth is $R/L = {dw:sig3}$ rad/s, and $\omega_0/(R/L)$ gives the same $Q$.)
- id: de-m6-r2-beam-deflection
  title: Sag of a simply supported beam
  topic: Beams and buckling
  vars:
    L: {choices: [2, 2.5, 3, 4, 5, 6]}
    w: {min: 200, max: 2000, step: 100}
    EI: {choices: [{label: '1 \times 10^{4}', value: 10000}, {label: '2 \times 10^{4}', value: 20000}, {label: '5 \times 10^{4}', value: 50000}, {label: '1 \times 10^{5}', value: 100000}, {label: '2 \times 10^{5}', value: 200000}, {label: '5 \times 10^{5}', value: 500000}]}
  where: ['d >= 1', 'd <= 150']
  calc:
    L4: L^4
    d: 1000*5*w*L^4/(384*EI)
  prompt: 'A beam {L} m long is simply supported at both ends and carries a uniform load of {w} N/m. Its flexural rigidity is $EI = {EI}$ N·m². Find its largest deflection in millimeters, to 3 significant figures.'
  answers:
    - {name: d, label: 'Deflection (mm)', relTolerance: 0.006, format: sig3}
  solution: |-
    The largest sag is at the middle: $y_{\max} = \dfrac{5wL^4}{384EI} = \dfrac{5({w})({L4:sig6})}{384({EI})}$ m $\approx$ **{d:sig3} mm**.
- id: de-m6-r2-buckling
  title: Euler buckling load
  topic: Beams and buckling
  vars:
    L: {choices: [1, 1.5, 2, 2.5, 3, 4, 5]}
    EI: {choices: [{label: '2 \times 10^{3}', value: 2000}, {label: '5 \times 10^{3}', value: 5000}, {label: '1 \times 10^{4}', value: 10000}, {label: '2 \times 10^{4}', value: 20000}, {label: '5 \times 10^{4}', value: 50000}]}
  calc:
    L2: L^2
    P: pi^2*EI/L^2/1000
    P4: P/4
  prompt: 'A slender column {L} m long has $EI = {EI}$ N·m². Find its critical buckling load in kN (3 significant figures) if both ends are pinned, and if instead the base is clamped and the top is free.'
  answers:
    - {name: P, label: 'Pinned–pinned (kN)', relTolerance: 0.006, format: sig3}
    - {name: P4, label: 'Clamped–free (kN)', relTolerance: 0.006, format: sig3}
  solution: |-
    Pinned ends: $P_{\text{cr}} = \dfrac{\pi^2EI}{L^2} = \dfrac{\pi^2({EI})}{{L2:sig6}}$ N $\approx$ **{P:sig3} kN**. Clamped–free: a quarter of that, $\dfrac{\pi^2EI}{4L^2} \approx$ **{P4:sig3} kN**.
