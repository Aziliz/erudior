# Module 4 (autonomous equations and numerical methods): round 2 drills (honors lessons)
- id: de-m4-r2-effort-yield
  title: Constant-effort harvesting
  topic: Harvesting models
  vars:
    r: {choices: [0.5, 0.8, 1, 1.2, 1.5]}
    K: {min: 200, max: 1000, step: 100}
    q: {choices: [0.1, 0.2, 0.3, 0.4, 0.6, 0.7]}
  calc:
    E: q*r
    Ps: K*(1 - q)
    Y: E*Ps
    Em: r/2
    msy: r*K/4
    re: r - E
  prompt: 'A fish stock is harvested with constant effort: $P'' = {r:coef}P\left(1 - \dfrac{P}{{K:sig6}}\right) - {E}P$. Find the stable equilibrium $P^*$, the sustainable yield $Y = EP^*$, and the effort that would give the maximum sustainable yield.'
  answers:
    - {name: Ps, label: '$P^* =$', tolerance: 0.01}
    - {name: Y, label: '$Y =$', tolerance: 0.01}
    - {name: Em, label: 'Effort for MSY $=$', tolerance: 0.001}
  solution: |-
    Constant effort is logistic with rate $r - E = {re}$ and capacity $K(1 - E/r)$, so the stable equilibrium is $P^* = {K:sig6}\left(1 - \dfrac{{E}}{{r}}\right) =$ **{Ps:sig6}**.
    The yield is $Y = EP^* = {E} \times {Ps:sig6} =$ **{Y:sig6}**.
    $Y(E) = EK(1 - E/r)$ is a parabola in $E$ with roots $0$ and $r$, so it peaks at $E = r/2 =$ **{Em}**, where the yield would be $rK/4 = {msy:sig6}$.
- id: de-m4-r2-return-time
  title: Return time under a harvest quota
  topic: Harvesting models
  vars:
    r: {choices: [0.5, 1, 2]}
    K: {min: 100, max: 1000, step: 100}
    fr: {choices: [0.1, 0.2, 0.3, 0.4]}
  calc:
    P1: fr*K
    P2: K - P1
    hh: r*P1*P2/K
    fp: r*(1 - 2*P2/K)
    afp: abs(fp)
    TR: 1/afp
  prompt: 'A harvested population satisfies $P'' = {r:coef}P\left(1 - \dfrac{P}{{K:sig6}}\right) - {hh:sig6}$. Find the stable equilibrium and its return time $T_R = 1/\lvert f''(P^*)\rvert$ (2 decimal places).'
  answers:
    - {name: P2, label: 'Stable $P^* =$', tolerance: 0.01}
    - {name: TR, label: '$T_R \approx$', tolerance: 0.006, format: num2}
  solution: |-
    The equilibria solve $rP(1 - P/K) = h$; here they are $P_1 = {P1:sig6}$ (the unstable threshold) and $P_2 =$ **{P2:sig6}** (stable). You can check that $P_1 + P_2 = K$ and ${r:coef}P_1P_2/K = {hh:sig6}$.
    Next, $f'(P) = r\left(1 - 2P/K\right)$, so $f'({P2:sig6}) = {fp:num4}$, and $T_R = 1/{afp:num4} \approx$ **{TR:num2}**.
- id: de-m4-r2-stability-limit
  title: Largest stable step for an explicit method
  topic: Stiff equations
  vars:
    lam: {choices: [-10, -20, -25, -40, -50, -80, -100, -200, -250, -400, -500, -1000]}
    m: {choices: [{label: 'Euler''s method', value: 2}, {label: 'the improved Euler method', value: 2}, {label: 'RK4 (stable for real $h\lambda \ge -2.785$)', value: 2.785}]}
  calc:
    alam: abs(lam)
    mv: m
    hmax: m/alam
  prompt: 'For $y'' = {lam:sig6}y$, what is the largest step size $h$ for which {m} is stable? Give 3 significant figures.'
  answers:
    - {name: hmax, label: '$h_{\max} \approx$', relTolerance: 0.006, format: sig3}
  solution: |-
    On $y' = \lambda y$ with real $\lambda < 0$, Euler's and the improved Euler method are stable for $-2 \le h\lambda \le 0$, and RK4 for about $-2.785 \le h\lambda \le 0$. With $\lambda = {lam:sig6}$, the limit is $h \le {mv:sig6}/{alam:sig6} \approx$ **{hmax:sig3}**.
- id: de-m4-r2-backward-euler
  title: Two steps of backward Euler
  topic: Stiff equations
  vars:
    a: {min: -20, max: -2}
    b: {min: -10, max: 10}
    y0: {min: -3, max: 5}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ['b != 0', 'a*y0 + b != 0']
  calc:
    den: 1 - h*a
    hb: h*b
    y1: (y0 + h*b)/den
    y2: (y1 + h*b)/den
    yE: y0 + h*(a*y0 + b)
    alam: abs(a)
    lim: 2/alam
  prompt: 'Use two steps of the backward Euler method with $h = {h}$ for $y'' = {a}y {b:signed}$, $y(0) = {y0}$. Give $y_1$ and $y_2$ to 4 decimal places.'
  answers:
    - {name: y1, label: '$y_1 \approx$', tolerance: 0.0005, format: num4}
    - {name: y2, label: '$y_2 \approx$', tolerance: 0.0005, format: num4}
  solution: |-
    Backward Euler uses the slope at the end of the step: $y_{n+1} = y_n + {h}\big({a}y_{n+1} {b:signed}\big)$. Solve for $y_{n+1}$: $y_{n+1} = \dfrac{y_n {hb:signed}}{{den:num4}}$.
    So $y_1 = \dfrac{{y0} {hb:signed}}{{den:num4}} \approx$ **{y1:num4}** and $y_2 = \dfrac{{y1:num4} {hb:signed}}{{den:num4}} \approx$ **{y2:num4}**.
    (Explicit Euler would give $y_1 = {yE:num4}$; it is stable only for $h \le 2/{alam} = {lim:num4}$.)
- id: de-m4-r2-richardson
  title: Richardson error estimate
  topic: Adaptive step size
  vars:
    p: {choices: [1, 2, 4]}
    T: {min: 1, max: 5, step: 0.001}
    C: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    hh: if(p == 4, 0.2, 0.1)
    hh2: hh/2
    A1: T + C*hh^p
    A2: T + C*hh2^p
    d: A2 - A1
    den: 2^p - 1
    est: d/den
    Ab: A2 + est
  prompt: 'A method of order {p} gives $A({hh}) = {A1:num4}$ and $A({hh2}) = {A2:num4}$ for the same value $y(T)$. Estimate the error $y(T) - A({hh2})$ and give the Richardson extrapolated value, both to 4 decimal places.'
  answers:
    - {name: est, label: 'Error estimate', tolerance: 0.00005, format: num4}
    - {name: Ab, label: 'Extrapolated value', tolerance: 0.00005, format: num4}
  solution: |-
    For order $p = {p}$ the divisor is $2^{p} - 1 = {den}$. Error of the finer result: $\dfrac{A({hh2}) - A({hh})}{{den}} = \dfrac{{d:num4}}{{den}} =$ **{est:num4}**.
    Extrapolated value: $A({hh2}) + \text{estimate} = {A2:num4} + ({est:num4}) =$ **{Ab:num4}**.
- id: de-m4-r2-new-step
  title: Heun–Euler error estimate and new step
  topic: Adaptive step size
  vars:
    a: {min: -3, max: 3}
    b: {min: -3, max: 3}
    t0: {min: 0, max: 2}
    y0: {min: -2, max: 3}
    h: {choices: [0.1, 0.2, 0.4]}
    tl: {choices: [{label: '0.001', value: 0.001}, {label: '0.01', value: 0.01}]}
  where: ['a != 0', 'b != 0', 'abs(a + b*(a*t0 + b*y0)) >= 1']
  calc:
    k1: a*t0 + b*y0
    yE: y0 + h*k1
    t1: t0 + h
    k2: a*t1 + b*yE
    z: y0 + h/2*(k1 + k2)
    er: h/2*abs(k2 - k1)
    hn: 0.9*h*sqrt(tl/er)
  prompt: 'Take one Heun–Euler step with $h = {h}$ for $y'' = {a:coef}t {b:signedcoef}y$, $y({t0}) = {y0}$. Find the error estimate $\lvert z - y_E\rvert$ (4 significant figures) and the next step size $h_{\text{new}} = 0.9\,h\,(\text{tol}/\text{est})^{1/2}$ for tolerance ${tl}$ (3 significant figures).'
  answers:
    - {name: er, label: 'Estimate', relTolerance: 0.001, format: sig4}
    - {name: hn, label: '$h_{\text{new}} \approx$', relTolerance: 0.006, format: sig3}
  solution: |-
    $k_1 = f({t0}, {y0}) = {k1}$, so Euler gives $y_E = {y0} + {h}({k1}) = {yE:num4}$.
    $k_2 = f({t1}, {yE:num4}) = {k2:num4}$, so Heun gives $z = {y0} + \tfrac{{h}}{2}\big({k1} + ({k2:num4})\big) = {z:num4}$.
    Estimate: $\lvert z - y_E\rvert = \tfrac{{h}}{2}\lvert k_2 - k_1\rvert =$ **{er:sig4}**. Then $h_{\text{new}} = 0.9({h})\left(\dfrac{{tl}}{{er:sig4}}\right)^{1/2} \approx$ **{hn:sig3}**. (If the estimate is above ${tl}$, the step is rejected and retried with this $h$; otherwise it is accepted and the next step uses it.)
