# Round 2 drills for module de-m9 (honors lessons)
- id: de-m9-r2-indicial
  title: Indicial roots at a regular singular point
  topic: Frobenius method
  vars:
    u: {min: -3, max: 5}
    v: {min: -2, max: 3}
  where: ['u != 0', 'v != 0', 'u != 2*v', 'u + 2*v != 2', 'u + 2*v != 0']
  calc:
    p: 2 - u - 2*v
    q: u*v
    pm2: p - 2
    r1: max(u/2, v)
    r2: min(u/2, v)
  prompt: 'Find the roots of the indicial equation of $2x^2y'''' {p:signedcoef}xy'' + (x {q:signed})y = 0$ at the regular singular point $x = 0$. Exact fractions or integers.'
  answers:
    - {name: r1, label: 'Larger root $r_1 =$', kind: fraction, lowestTerms: true}
    - {name: r2, label: 'Smaller root $r_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    Divide by $2x^2$: $xp(x) = \dfrac{{p}}{2}$ and $x^2q(x) = \dfrac{x {q:signed}}{2}$, so $p_0 = \dfrac{{p}}{2}$ and $q_0 = \dfrac{{q}}{2}$. The indicial equation $r(r - 1) + p_0r + q_0 = 0$, times 2, is $2r^2 {pm2:signedcoef}r {q:signed} = 0$. Its roots (by factoring or the quadratic formula) are $r_1 =$ **{r1:frac}** and $r_2 =$ **{r2:frac}**.
- id: de-m9-r2-frob-coef
  title: Coefficients of a Frobenius series
  topic: Frobenius method
  vars:
    m: {choices: [2, 3, 4]}
    k: {choices: [-3, -2, -1, 1, 2, 3]}
    a0: {choices: [-2, -1, 1, 2, 3]}
  calc:
    rr: (m - 1)/m
    d1: 2*m - 1
    d2: 2*(3*m - 1)
    nk: -k
    a1: -k*a0/d1
    a2: -k*a1/d2
  prompt: 'The equation ${m}xy'''' + y'' {k:signedcoef}y = 0$ has indicial roots $r = 0$ and a nonzero root $r$. For the Frobenius series $y = \sum_{n=0}^\infty a_nx^{n+r}$ with the nonzero root and $a_0 = {a0}$, find $r$, $a_1$ and $a_2$. Exact fractions.'
  answers:
    - {name: rr, label: '$r =$', kind: fraction, lowestTerms: true}
    - {name: a1, label: '$a_1 =$', kind: fraction, lowestTerms: true}
    - {name: a2, label: '$a_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    Substituting, the power $x^{n+r-1}$ collects ${m}(n + r)(n + r - 1)a_n + (n + r)a_n {k:signedcoef}a_{n-1} = 0$. For $n = 0$: $r\big({m}(r - 1) + 1\big) = 0$, so $r = 0$ or $r = 1 - \dfrac{1}{{m}} =$ **{rr:frac}**. The recurrence is $a_n = \dfrac{{nk:coef}a_{n-1}}{(n + r)\big({m}(n + r - 1) + 1\big)}$. With $r = {rr:texfrac}$ the denominators are ${d1}$ for $n = 1$ and ${d2}$ for $n = 2$, so $a_1 = \dfrac{({nk})({a0})}{{d1}} =$ **{a1:frac}** and $a_2 = \dfrac{({nk})\left({a1:texfrac}\right)}{{d2}} =$ **{a2:frac}**.
- id: de-m9-r2-plate-mode
  title: Steady temperature in a rectangular plate
  topic: Laplace's equation
  vars:
    wid: {choices: [2, 3]}
    ht: {choices: [1, 2]}
    n: {choices: [1, 2, 3]}
    A: {min: 10, max: 50, step: 5}
    xf: {choices: [0.25, 0.5, 0.75]}
    yf: {choices: [0.25, 0.5, 0.75]}
  where: ['abs(u) > 0.05', 'gcd(n, wid) == 1']
  calc:
    x0: xf*wid
    y0: yf*ht
    k: n*pi/wid
    ratio: sinh(k*y0)/sinh(k*ht)
    sn: sin(k*x0)
    u: A*ratio*sn
  prompt: 'A plate $0 < x < {wid}$, $0 < y < {ht}$ has its left, right and bottom edges held at 0 and its top edge at $u(x, {ht}) = {A}\sin\dfrac{{n:coef}\pi x}{{wid}}$. Find the steady temperature at $({x0}, {y0})$ to 4 decimal places.'
  answers:
    - {name: u, label: '$u({x0}, {y0}) \approx$', tolerance: 0.00006, format: num4}
  solution: |-
    The top data is a single sine mode, so $u = {A}\,\dfrac{\sinh({k:num4}\,y)}{\sinh({k:num4} \cdot {ht})}\sin({k:num4}\,x)$, where ${k:num4} = \dfrac{{n:coef}\pi}{{wid}}$. At $({x0}, {y0})$ the sinh ratio is ${ratio:num4}$ and the sine is ${sn:num4}$, so $u \approx$ **{u:num4}**.
- id: de-m9-r2-disk
  title: Laplace's equation in a disk
  topic: Laplace's equation
  vars:
    R: {choices: [2, 3, 4]}
    c0: {min: 10, max: 40, step: 5}
    c1: {choices: [-8, -6, -4, 4, 6, 8]}
    c2: {choices: [-5, -3, -2, 2, 3, 5]}
    r0: {choices: [1, 1.5]}
    th: {choices: [{label: '\pi/6', value: 0.5235987755982988}, {label: '\pi/4', value: 0.7853981633974483}, {label: '\pi/3', value: 1.0471975511965976}, {label: '2\pi/3', value: 2.0943951023931953}]}
  calc:
    q: r0/R
    t1: c1*q*cos(th)
    t2: c2*q^2*sin(2*th)
    u: c0 + t1 + t2
  prompt: 'A disk of radius ${R}$ has edge temperature $f(\theta) = {c0} {c1:signedcoef}\cos\theta {c2:signedcoef}\sin 2\theta$. Find the steady temperature at $r = {r0}$, $\theta = {th}$ (4 decimal places) and at the center.'
  answers:
    - {name: u, label: '$u \approx$', tolerance: 0.00006, format: num4}
    - {name: c0, label: 'At the center'}
  solution: |-
    Each Fourier mode of the edge data is scaled by $(r/R)^n$: $u = {c0} {c1:signedcoef}\left(\dfrac{r}{{R}}\right)\cos\theta {c2:signedcoef}\left(\dfrac{r}{{R}}\right)^2\sin 2\theta$. At $r = {r0}$, $\theta = {th}$: the cosine term is ${t1:num4}$ and the sine term is ${t2:num4}$, so $u \approx$ **{u:num4}**. At the center only the average remains: **{c0}**.
- id: de-m9-r2-pulse
  title: A plucked pulse on a long string
  topic: d'Alembert's solution
  vars:
    H: {min: 1, max: 4}
    w: {choices: [1, 2]}
    a: {choices: [1, 2, 3]}
    x0: {min: -3, max: 3, step: 0.5}
    t0: {choices: [0.25, 0.5, 1, 1.5]}
  where: ['u > 0']
  calc:
    lo: x0 - a*t0
    hi: x0 + a*t0
    fl: H*max(0, 1 - abs(lo)/w)
    fh: H*max(0, 1 - abs(hi)/w)
    u: (fl + fh)/2
  prompt: 'A long string with wave speed $a = {a}$ starts at rest in the shape $f(x) = {H}\max\left(0,\ 1 - \dfrac{|x|}{{w}}\right)$ (a triangle of height {H} and half-width {w}). Find $u({x0}, {t0})$. (Exact decimal or fraction.)'
  answers:
    - {name: u, label: '$u({x0}, {t0}) =$', tolerance: 0.0001, format: num4}
  solution: |-
    With $g = 0$, d'Alembert's formula is $u = \tfrac12\big[f(x - at) + f(x + at)\big]$. Here $x - at = {lo}$ and $x + at = {hi}$, where $f({lo}) = {fl:num4}$ and $f({hi}) = {fh:num4}$. So $u = \tfrac12({fl:num4} + {fh:num4}) =$ **{u:num4}**.
- id: de-m9-r2-velocity-kick
  title: A string struck with an initial velocity
  topic: d'Alembert's solution
  vars:
    V: {min: 1, max: 4}
    w: {choices: [1, 2]}
    a: {choices: [1, 2]}
    x0: {min: 0, max: 5, step: 0.5}
    t0: {choices: [0.5, 1, 1.5, 2, 3]}
  where: ['u > 0']
  calc:
    lo: x0 - a*t0
    hi: x0 + a*t0
    lft: max(lo, -w)
    rgt: min(hi, w)
    len: max(0, rgt - lft)
    u: V*len/(2*a)
  prompt: 'A long string with wave speed $a = {a}$ is flat at $t = 0$, and is struck so that its initial velocity is $g(x) = {V}$ for $|x| < {w}$ and 0 elsewhere. Find $u({x0}, {t0})$. (Exact decimal or fraction.)'
  answers:
    - {name: u, label: '$u({x0}, {t0}) =$', tolerance: 0.0001, format: num4}
  solution: |-
    With $f = 0$, $u = \dfrac{1}{2a}\displaystyle\int_{x-at}^{x+at}g(s)\,ds$, and $g = {V}$ only on $(-{w}, {w})$. The interval of integration is $[{lo}, {hi}]$; its overlap with $[-{w}, {w}]$ is $[{lft}, {rgt}]$, of length ${len}$. So $u = \dfrac{{V} \cdot {len}}{2 \cdot {a}} =$ **{u:num4}**.
