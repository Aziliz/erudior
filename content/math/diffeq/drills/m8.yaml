# Module 8 drills
- id: de-eigenvalues-2x2
  title: Eigenvalues of a 2×2 matrix
  topic: Linear systems
  vars:
    l1: {min: -4, max: 4}
    l2: {min: -4, max: 4}
    p: {min: -2, max: 2}
  where: ['l1 < l2']
  calc:
    q: p + 1
    a11: l1*q - l2*p
    a12: l2 - l1
    a21: p*q*(l1 - l2)
    a22: q*l2 - p*l1
    T: l1 + l2
    D: l1*l2
  prompt: 'Find the eigenvalues of $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22} \end{bmatrix}$, smaller first.'
  answers:
    - {name: l1, label: '$\lambda_1 =$'}
    - {name: l2, label: '$\lambda_2 =$'}
  solution: |-
    $\operatorname{tr}A = {T}$ and $\det A = ({a11})({a22}) - ({a12})({a21}) = {D}$, so $\lambda^2 - ({T})\lambda + ({D}) = 0$, which factors as $(\lambda - ({l1}))(\lambda - ({l2})) = 0$. Eigenvalues **{l1}** and **{l2}**.
- id: de-system-convert
  title: Write a second-order equation as a system
  topic: Linear systems
  vars:
    a: {min: 1, max: 4}
    b: {min: -6, max: 6}
    c: {min: -9, max: 9}
  where: ['b != 0', 'c != 0']
  calc:
    a21: -c/a
    a22: -b/a
  prompt: 'Rewrite ${a:coef}y'''' {b:signedcoef}y'' {c:signedcoef}y = 0$ as $\mathbf{x}'' = A\mathbf{x}$ with $x_1 = y$, $x_2 = y''$. The first row of $A$ is $(0, 1)$. Give the second row as exact fractions.'
  answers:
    - {name: a21, label: '$a_{21} =$', kind: fraction, lowestTerms: true}
    - {name: a22, label: '$a_{22} =$', kind: fraction, lowestTerms: true}
  solution: |-
    $x_2' = y'' = \dfrac{-({c})y - ({b})y'}{{a}} = {a21:texfrac}\,x_1 + \left({a22:texfrac}\right)x_2$. So the second row is $\left({a21:texfrac}, {a22:texfrac}\right)$: **{a21:frac}** and **{a22:frac}**.
- id: de-system-ivp
  title: Solve a linear system IVP
  topic: Phase portraits
  vars:
    l1: {min: -3, max: 3}
    l2: {min: -3, max: 3}
    p: {min: -2, max: 1}
    c1: {min: -3, max: 3}
    c2: {min: -3, max: 3}
  where: ['l1 < l2', 'c1 != 0', 'c2 != 0', 'l1 != 0', 'l2 != 0', 'p != 0', 'p != -1']
  calc:
    q: p + 1
    a11: l1*q - l2*p
    a12: l2 - l1
    a21: p*q*(l1 - l2)
    a22: q*l2 - p*l1
    x10: c1 + c2
    x20: c1*p + c2*q
    pc1: p*c1
    qc2: q*c2
  prompt: 'Solve $\mathbf{x}'' = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22} \end{bmatrix}\mathbf{x}$ with $\mathbf{x}(0) = \begin{bmatrix} {x10} \\ {x20} \end{bmatrix}$. (The eigenvalues are ${l1}$ and ${l2}$.)'
  answers:
    - {kind: expression, expression: 'c1*exp(l1*t) + c2*exp(l2*t)', variables: [t], label: '$x_1(t) =$', show: '${c1:coef}e^{{l1:coef}t} {c2:signedcoef}e^{{l2:coef}t}$'}
    - {kind: expression, expression: 'c1*p*exp(l1*t) + c2*q*exp(l2*t)', variables: [t], label: '$x_2(t) =$', show: '${pc1:coef}e^{{l1:coef}t} {qc2:signedcoef}e^{{l2:coef}t}$'}
  solution: |-
    Eigenvectors: for $\lambda = {l1}$, $\mathbf{v}^{(1)} = (1, {p})$; for $\lambda = {l2}$, $\mathbf{v}^{(2)} = (1, {q})$ (check with $A\mathbf{v} = \lambda\mathbf{v}$). Fit $c_1\mathbf{v}^{(1)} + c_2\mathbf{v}^{(2)} = ({x10}, {x20})$: $c_1 + c_2 = {x10}$ and $({p})c_1 + ({q})c_2 = {x20}$, so $c_1 = {c1}$, $c_2 = {c2}$. Then **$x_1 = {c1:coef}e^{{l1:coef}t} {c2:signedcoef}e^{{l2:coef}t}$** and **$x_2 = {pc1:coef}e^{{l1:coef}t} {qc2:signedcoef}e^{{l2:coef}t}$**.
- id: de-eigen-complex
  title: Complex eigenvalues of a 2×2 matrix
  topic: Phase portraits
  vars:
    al: {min: -3, max: 3}
    be: {min: 1, max: 4}
    d: {min: -2, max: 2}
    c: {choices: [-2, -1, 1, 2]}
  where: ['mod(be^2 + d^2, abs(c)) == 0']
  calc:
    b: -(be^2 + d^2)/c
    a11: al + d
    a22: al - d
    T: 2*al
    D: al^2 + be^2
    disc: T^2 - 4*D
  prompt: 'The matrix $A = \begin{bmatrix} {a11} & {b} \\ {c} & {a22} \end{bmatrix}$ has complex eigenvalues $\alpha \pm i\beta$ with $\beta > 0$. Find $\alpha$ and $\beta$.'
  answers:
    - {name: al, label: '$\alpha =$'}
    - {name: be, label: '$\beta =$'}
  solution: |-
    $\operatorname{tr}A = {T}$, $\det A = ({a11})({a22}) - ({b})({c}) = {D}$. Then $\lambda = \dfrac{{T} \pm \sqrt{{disc}}}{2}$, so $\alpha = \dfrac{{T}}{2} =$ **{al}** and $\beta = \dfrac{\sqrt{-({disc})}}{2} =$ **{be}**. So the origin is a spiral sink if $\alpha < 0$, a spiral source if $\alpha > 0$, and a center if $\alpha = 0$.
- id: de-classify-td
  title: Trace, determinant and discriminant
  topic: Phase portraits
  vars:
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    c: {min: -5, max: 5}
    d: {min: -5, max: 5}
  where: ['b != 0', 'c != 0', 'a*d - b*c != 0']
  calc:
    T: a + d
    D: a*d - b*c
    disc: (a + d)^2 - 4*(a*d - b*c)
  prompt: 'For $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$, compute the trace $T$, the determinant $D$, and $T^2 - 4D$. (These classify the origin of $\mathbf{x}'' = A\mathbf{x}$.)'
  answers:
    - {name: T, label: '$T =$'}
    - {name: D, label: '$D =$'}
    - {name: disc, label: '$T^2 - 4D =$'}
  solution: |-
    $T = {a} + ({d}) =$ **{T}**, $D = ({a})({d}) - ({b})({c}) =$ **{D}**, and $T^2 - 4D =$ **{disc}**. Read the type from the chart: $D < 0$ saddle; otherwise $T^2 - 4D > 0$ node, $< 0$ spiral (center if $T = 0$), with sinks for $T < 0$ and sources for $T > 0$.
- id: de-jacobian
  title: Jacobian matrix at a point
  topic: Nonlinear systems
  vars:
    a: {min: -3, max: 3}
    b: {min: -3, max: 3}
    c: {min: -3, max: 3}
    d: {min: -4, max: 4}
    x0: {min: -3, max: 3}
    y0: {min: -3, max: 3}
  where: ['a != 0', 'b != 0', 'c != 0', 'd != 0']
  calc:
    j11: 2*a*x0 + b*y0
    j12: b*x0
    j21: d
    j22: 2*c*y0
    a2: 2*a
    c2: 2*c
  prompt: 'For $x'' = {a:coef}x^2 {b:signedcoef}xy$, $y'' = {c:coef}y^2 {d:signedcoef}x$, find the Jacobian matrix $J = \begin{bmatrix} F_x & F_y \\ G_x & G_y \end{bmatrix}$ at the point $({x0}, {y0})$.'
  answers:
    - {name: j11, label: '$F_x =$'}
    - {name: j12, label: '$F_y =$'}
    - {name: j21, label: '$G_x =$'}
    - {name: j22, label: '$G_y =$'}
  solution: |-
    $F_x = {a2}x {b:signedcoef}y$, $F_y = {b:coef}x$, $G_x = {d}$, $G_y = {c2}y$. At $({x0}, {y0})$: $J = \begin{bmatrix} {j11} & {j12} \\ {j21} & {j22} \end{bmatrix}$, so **{j11}**, **{j12}**, **{j21}**, **{j22}**.
- id: de-predator-prey-eq
  title: Predator–prey equilibrium
  topic: Nonlinear systems
  vars:
    a: {choices: [0.5, 1, 1.5, 2]}
    al: {choices: [0.1, 0.2, 0.25, 0.5]}
    c: {choices: [0.5, 0.75, 1, 1.5]}
    ga: {choices: [0.05, 0.1, 0.125, 0.25]}
  calc:
    xs: c/ga
    ys: a/al
    per: 2*pi/sqrt(a*c)
  prompt: 'For the predator–prey model $x'' = {a:coef}x - {al}xy$, $y'' = -{c:coef}y + {ga:sig3}xy$, find the coexistence equilibrium $(x^*, y^*)$ and the approximate period of small oscillations around it (2 decimal places).'
  answers:
    - {name: xs, label: '$x^* =$', relTolerance: 0.001}
    - {name: ys, label: '$y^* =$', relTolerance: 0.001}
    - {name: per, label: 'Period', tolerance: 0.006}
  solution: |-
    $x' = x({a} - {al}y) = 0$ with $x \ne 0$ gives $y^* = {a}/{al} =$ **{ys:num2}**; $y' = y(-{c} + {ga:sig3}x) = 0$ gives $x^* = {c}/{ga:sig3} =$ **{xs:num2}**. The linearization there has eigenvalues $\pm i\sqrt{ac} = \pm i\sqrt{{a}\cdot{c}}$, so the period is $2\pi/\sqrt{ac} \approx$ **{per:num2}**.
