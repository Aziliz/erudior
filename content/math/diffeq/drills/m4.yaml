# Module 4 drills
- id: de-equilibria
  title: Classify two equilibria
  topic: Autonomous equations
  vars:
    r1: {min: -4, max: 3}
    gap: {min: 1, max: 4}
    s: {choices: [-1, 1]}
  calc:
    r2: r1 + gap
    stab: if(s == 1, r1, r2)
    unst: if(s == 1, r2, r1)
    b: -(r1 + r2)
    c: r1*r2
    sb: s*b
    sc: s*c
  where: ['r2 <= 5', 'r1 + r2 != 0', 'r1*r2 != 0']
  prompt: 'Find the asymptotically stable and the unstable equilibrium of $\dfrac{dy}{dt} = {s:coef}y^2 {sb:signedcoef}y {sc:signed}$.'
  answers:
    - {name: stab, label: 'Stable $y^* =$'}
    - {name: unst, label: 'Unstable $y^* =$'}
  figure:
    type: plot
    x: [0, 4]
    y: [r1 - 2, r2 + 2]
    xLabel: t
    slopeField: {f: 's*(y - r1)*(y - r2)', step: 0.5}
  solution: |-
    Factor: $f(y) = {s:coef}(y - ({r1}))(y - ({r2}))$, so the equilibria are $y = {r1}$ and $y = {r2}$. The derivative $f'(y) = {s:coef}(2y - ({r1}) - ({r2}))$ is negative at the stable one: stable **{stab}**, unstable **{unst}**.
- id: de-phase-limit
  title: Long-run limit from a phase line
  topic: Autonomous equations
  vars:
    p: {min: -4, max: -1}
    q: {min: 0, max: 2}
    r: {min: 3, max: 5}
    s: {choices: [-1, 1]}
    y0: {min: -3.5, max: 4.5, step: 0.5}
  where: ['y0 > p', 'y0 < r', 'y0 != q']
  calc:
    f0: s*(y0 - p)*(y0 - q)*(y0 - r)
    L: if(y0 < q, if(f0 > 0, q, p), if(f0 > 0, r, q))
    np: -p
    nq: -q
    nr: -r
  prompt: 'For $\dfrac{dy}{dt} = {s:coef}(y {np:signed})(y {nq:signed})(y {nr:signed})$ with $y(0) = {y0}$, find $\displaystyle\lim_{t\to\infty} y(t)$.'
  answers:
    - {name: L, label: 'Limit'}
  solution: |-
    The equilibria are ${p}$, ${q}$ and ${r}$. At the start, $f({y0}) = {f0:num4}$: a positive value means $y$ increases, a negative one that it decreases. Either way it moves monotonically to the nearest equilibrium in that direction, so the limit is **{L}**.
- id: de-harvest-eq
  title: Equilibria of logistic harvesting
  topic: Bifurcations
  vars:
    r: {choices: [0.5, 1, 2]}
    K: {min: 100, max: 1000, step: 100}
    fr: {choices: [0.1, 0.2, 0.3, 0.4]}
  calc:
    P1: fr*K
    P2: K - P1
    hh: r*P1*P2/K
    hmax: r*K/4
  prompt: 'A harvested population satisfies $P'' = {r:coef}P\left(1 - \dfrac{P}{{K:sig6}}\right) - {hh:sig6}$. Find both equilibria (smaller first).'
  answers:
    - {name: P1, label: '$P_1 =$ (unstable)'}
    - {name: P2, label: '$P_2 =$ (stable)'}
  solution: |-
    Set ${r:coef}P - \dfrac{{r}}{{K:sig6}}P^2 = {hh:sig6}$ and solve the quadratic $P^2 - {K:sig6}P + \dfrac{{hh:sig6}\cdot{K:sig6}}{{r}} = 0$: $P_1 =$ **{P1}** and $P_2 =$ **{P2}**. (Since $h < rK/4 = {hmax:sig6}$, two equilibria exist.)
- id: de-bifurcation-value
  title: Find a saddle-node bifurcation value
  topic: Bifurcations
  vars:
    m: {min: -5, max: 5}
  where: ['m != 0']
  calc:
    b: 2*m
    cstar: m^2
    ys: -m
  prompt: 'For which value of the parameter $c$ does $\dfrac{dy}{dt} = y^2 {b:signedcoef}y + c$ have exactly one equilibrium? Also give that equilibrium.'
  answers:
    - {name: cstar, label: '$c^* =$'}
    - {name: ys, label: 'Equilibrium $y^* =$'}
  solution: |-
    Equilibria solve $y^2 {b:signedcoef}y + c = 0$. Completing the square, $(y {m:signed})^2 = {cstar} - c$, so there are two roots when $c < {cstar}$, none when $c > {cstar}$, and exactly one when $c =$ **{cstar}**, namely $y^* =$ **{ys}**. (Equivalently: $f = 0$ and $f_y = 2y {b:signed} = 0$.)
- id: de-heun-1step
  title: One step of improved Euler
  topic: Numerical methods
  vars:
    a: {min: -3, max: 3}
    b: {min: -2, max: 2}
    t0: {min: 0, max: 2}
    y0: {min: -3, max: 4}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ['a != 0', 'b != 0']
  calc:
    k1: a*t0 + b*y0
    yp: y0 + h*k1
    t1: t0 + h
    k2: a*t1 + b*yp
    y1: y0 + h/2*(k1 + k2)
  prompt: 'Use one step of the improved Euler method with $h = {h}$ for $\dfrac{dy}{dt} = {a:coef}t {b:signedcoef}y$, $y({t0}) = {y0}$, to estimate $y({t1})$. (4 decimal places)'
  answers:
    - {name: y1, label: '$y({t1}) \approx$', tolerance: 0.0005, format: num4}
  solution: |-
    $k_1 = f({t0}, {y0}) = {k1:num4}$. Predictor: $y_{n} + hk_1 = {yp:num4}$ at $t = {t1}$, so $k_2 = f({t1}, {yp:num4}) = {k2:num4}$. Then $y_1 = {y0} + \dfrac{{h}}{2}\big({k1:num4} + ({k2:num4})\big) =$ **{y1:num4}**.
- id: de-euler-error
  title: Euler estimate and its error
  topic: Numerical methods
  vars:
    k: {choices: [-1, -0.5, 0.5, 1, 2]}
    h: {choices: [0.1, 0.2, 0.25, 0.5]}
  calc:
    n: 1/h
    est: (1 + k*h)^n
    ex: exp(k)
    err: ex - est
    g: 1 + k*h
  prompt: 'Apply Euler''s method with step $h = {h}$ to $y'' = {k:coef}y$, $y(0) = 1$, out to $t = 1$. Give the estimate of $y(1)$ and the error $y(1) - y_{\text{Euler}}$, both to 4 decimal places.'
  answers:
    - {name: est, label: 'Euler estimate', tolerance: 0.0005, format: num4}
    - {name: err, label: 'Error', tolerance: 0.0005, format: num4}
  solution: |-
    Each step multiplies by $1 + kh = {g:num4}$, and there are ${n}$ steps, so $y_{n} = {g:num4}^{{n}} \approx$ **{est:num4}**. The exact value is $e^{{k}} \approx {ex:num4}$, so the error is **{err:num4}**.
- id: de-rk4-1step
  title: One step of RK4
  topic: Numerical methods
  vars:
    a: {min: -2, max: 2}
    b: {min: -2, max: 2}
    y0: {min: -2, max: 3}
    h: {choices: [0.1, 0.2, 0.5]}
  where: ['a != 0', 'b != 0', 'y0 != 0']
  calc:
    k1: b*y0
    k2: a*(h/2) + b*(y0 + h/2*k1)
    k3: a*(h/2) + b*(y0 + h/2*k2)
    k4: a*h + b*(y0 + h*k3)
    y1: y0 + h/6*(k1 + 2*k2 + 2*k3 + k4)
  prompt: 'Use one step of RK4 with $h = {h}$ for $\dfrac{dy}{dt} = {a:coef}t {b:signedcoef}y$, $y(0) = {y0}$, to estimate $y({h})$. (5 decimal places)'
  answers:
    - {name: y1, label: '$y({h}) \approx$', tolerance: 0.00001, format: dp5}
  solution: |-
    $k_1 = {k1:num4}$, $k_2 = f\left(\tfrac{{h}}{2}, {y0} + \tfrac{{h}}{2}k_1\right) = {k2:num4}$, $k_3 = f\left(\tfrac{{h}}{2}, {y0} + \tfrac{{h}}{2}k_2\right) = {k3:num4}$, $k_4 = f\left({h}, {y0} + {h}k_3\right) = {k4:num4}$. Then $y_1 = {y0} + \tfrac{{h}}{6}(k_1 + 2k_2 + 2k_3 + k_4) =$ **{y1:dp5}**.
