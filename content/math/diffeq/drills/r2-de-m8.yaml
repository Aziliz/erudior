# Round 2 drills for module de-m8 (honors lessons 37h1 and 37h2)
- id: de-m8-r2-mode-freqs
  title: Natural frequencies of two coupled masses
  topic: Coupled oscillators
  vars:
    m: {choices: [1, 2, 4]}
    k1: {min: 1, max: 12}
    k2: {min: 1, max: 12}
    k3: {min: 1, max: 12}
  calc:
    K11: k1 + k2
    K22: k2 + k3
    a: (k1 + k2)/m
    d: (k2 + k3)/m
    c: k2/m
    T: a + d
    Dt: a*d - c^2
    sq: sqrt((a - d)^2 + 4*c^2)
    mu1: (T - sq)/2
    mu2: (T + sq)/2
    w1: sqrt(mu1)
    w2: sqrt(mu2)
  prompt: 'Two masses of {m} kg each sit on a frictionless track. Springs $k_1 = {k1}$ N/m and $k_3 = {k3}$ N/m join them to the walls, and a coupling spring $k_2 = {k2}$ N/m joins them to each other. Find the two natural frequencies in rad/s, smaller first, to 2 decimal places.'
  answers:
    - {name: w1, label: '$\omega_1 \approx$', tolerance: 0.006}
    - {name: w2, label: '$\omega_2 \approx$', tolerance: 0.006}
  solution: |-
    The stiffness matrix is $K = \begin{bmatrix} {K11} & -{k2} \\ -{k2} & {K22} \end{bmatrix}$, and dividing by the mass gives $M^{-1}K = \begin{bmatrix} {a:num4} & -{c:num4} \\ -{c:num4} & {d:num4} \end{bmatrix}$. Its trace is ${T:num4}$ and its determinant ${Dt:num4}$, so the eigenvalues $\omega^2$ solve $\mu^2 - {T:num4}\mu + {Dt:num4} = 0$: $\mu = \dfrac{{T:num4} \pm {sq:num4}}{2}$, that is ${mu1:num4}$ and ${mu2:num4}$. These are the squared frequencies, so $\omega_1 = \sqrt{{mu1:num4}} \approx$ **{w1:num2}** and $\omega_2 = \sqrt{{mu2:num4}} \approx$ **{w2:num2}** rad/s.
- id: de-m8-r2-beat-time
  title: Energy transfer between weakly coupled oscillators
  topic: Coupled oscillators
  vars:
    m: {choices: [0.5, 1, 2]}
    k: {min: 2, max: 20}
    kap: {choices: [0.05, 0.1, 0.2, 0.25, 0.4, 0.5]}
  where: ['kap <= k/10']
  calc:
    k2: k + 2*kap
    w1: sqrt(k/m)
    w2: sqrt((k + 2*kap)/m)
    dw: w2 - w1
    tt: pi/(w2 - w1)
  prompt: 'Two {m} kg masses each have a wall spring of {k} N/m and are joined by a weak coupling spring of {kap} N/m. Mass 1 is released from rest with mass 2 at equilibrium. When does all the motion first pass to mass 2? Give the time in seconds to 1 decimal place.'
  answers:
    - {name: tt, label: '$t \approx$', tolerance: 0.06, units: {s: 1}}
  solution: |-
    The in-phase mode has $\omega_1 = \sqrt{{k}/{m}} \approx {w1:num4}$ and the out-of-phase mode $\omega_2 = \sqrt{({k} + 2 \cdot {kap})/{m}} = \sqrt{{k2}/{m}} \approx {w2:num4}$ rad/s. The envelope of mass 1 is $\cos\big(\tfrac{\omega_2 - \omega_1}{2}t\big)$, which first reaches zero at $t = \dfrac{\pi}{\omega_2 - \omega_1} = \dfrac{\pi}{{dw:num4}} \approx$ **{tt:num1} s**.
- id: de-m8-r2-peak-time
  title: Peak of the second tank in a chain
  topic: Stability of larger systems
  vars:
    F: {choices: [5, 10, 20]}
    V1: {choices: [20, 25, 40, 50, 80, 100]}
    V2: {choices: [25, 40, 50, 100, 200]}
    Q0: {choices: [50, 100, 200]}
  where: ['V1 != V2']
  calc:
    a: F/V1
    b: F/V2
    tp: ln(a/b)/(a - b)
    Qp: Q0*a/(b - a)*(exp(-a*tp) - exp(-b*tp))
  prompt: 'Pure water flows at {F} L/min into tank 1 ({V1} L), from tank 1 into tank 2 ({V2} L), and out of tank 2. Tank 1 starts with {Q0} g of salt and tank 2 with none. When does the salt in tank 2 peak, and how much is there then? Give the time to 2 decimal places and the amount to 1 decimal place.'
  answers:
    - {name: tp, label: 'Time (min)', tolerance: 0.006}
    - {name: Qp, label: 'Salt (g)', tolerance: 0.06}
  solution: |-
    The rate constants are $a = {F}/{V1} = {a:num4}$ and $b = {F}/{V2} = {b:num4}$ per minute, so $Q_1' = -aQ_1$ and $Q_2' = aQ_1 - bQ_2$. Then $Q_1 = {Q0}e^{-at}$ and, with $Q_2(0) = 0$, $Q_2 = \dfrac{{Q0}a}{b - a}\big(e^{-at} - e^{-bt}\big)$. Setting $Q_2' = 0$ gives $ae^{-at} = be^{-bt}$, so $t = \dfrac{\ln(a/b)}{a - b} \approx$ **{tp:num2} min**, when $Q_2 \approx$ **{Qp:num1} g**.
- id: de-m8-r2-char-poly-3x3
  title: Characteristic polynomial of a 3×3 matrix
  topic: Stability of larger systems
  vars:
    p11: {min: -4, max: 1}
    p12: {min: -3, max: 3}
    p13: {min: -3, max: 3}
    p21: {min: -3, max: 3}
    p22: {min: -4, max: 1}
    p23: {min: -3, max: 3}
    p31: {min: -3, max: 3}
    p32: {min: -3, max: 3}
    p33: {min: -4, max: 1}
  where: ['p12 != 0 or p21 != 0', 'p23 != 0 or p32 != 0', 'p13 != 0 or p31 != 0']
  calc:
    trA: p11 + p22 + p33
    mi1: p22*p33 - p23*p32
    mi2: p11*p33 - p13*p31
    mi3: p11*p22 - p12*p21
    dt: p11*(p22*p33 - p23*p32) - p12*(p21*p33 - p23*p31) + p13*(p21*p32 - p22*p31)
    a1: -(p11 + p22 + p33)
    a2: mi1 + mi2 + mi3
    a3: -dt
    prod: a1*a2
  prompt: 'For $A = \begin{bmatrix} {p11} & {p12} & {p13} \\ {p21} & {p22} & {p23} \\ {p31} & {p32} & {p33} \end{bmatrix}$, write $\det(\lambda I - A) = \lambda^3 + a_1\lambda^2 + a_2\lambda + a_3$ and find $a_1$, $a_2$ and $a_3$.'
  answers:
    - {name: a1, label: '$a_1 =$'}
    - {name: a2, label: '$a_2 =$'}
    - {name: a3, label: '$a_3 =$'}
  solution: |-
    $a_1 = -\operatorname{tr}A = -({trA}) =$ **{a1}**. The principal minors (delete row and column 1, 2, 3 in turn) are ${mi1}$, ${mi2}$ and ${mi3}$, so $a_2 =$ **{a2}**. Expanding along the first row, $\det A = {dt}$, so $a_3 = -\det A =$ **{a3}**. Routh–Hurwitz: the origin is asymptotically stable exactly when $a_1 > 0$, $a_3 > 0$ and $a_1a_2 > a_3$; here $a_1a_2 = {prod}$.
- id: de-m8-r2-critical-gain
  title: Critical feedback strength for a three-stage loop
  topic: Stability of larger systems
  vars:
    p: {min: 1, max: 4}
    q: {min: 1, max: 4}
    r: {min: 1, max: 4}
  calc:
    s1: p + q + r
    s2: p*q + q*r + r*p
    s3: p*q*r
    kc: (p + q + r)*(p*q + q*r + r*p) - p*q*r
    s12: (p + q + r)*(p*q + q*r + r*p)
    w: sqrt(p*q + q*r + r*p)
  prompt: 'A feedback loop $x_1'' = -{p:coef}x_1 - kx_3$, $x_2'' = x_1 - {q:coef}x_2$, $x_3'' = x_2 - {r:coef}x_3$ has $\det(\lambda I - A) = (\lambda + {p})(\lambda + {q})(\lambda + {r}) + k$. Find the critical feedback strength $k_c$ (the steady state is stable for $0 \le k < k_c$ and unstable for $k > k_c$), and the angular frequency of the oscillation that appears at that $k$ (2 decimal places).'
  answers:
    - {name: kc, label: '$k_c =$'}
    - {name: w, label: '$\omega \approx$', tolerance: 0.006}
  solution: |-
    Expanding, $\det(\lambda I - A) = \lambda^3 + {s1}\lambda^2 + {s2}\lambda + ({s3} + k)$. Routh–Hurwitz needs $a_1 = {s1} > 0$, $a_3 = {s3} + k > 0$ and $a_1a_2 > a_3$: ${s1} \cdot {s2} = {s12} > {s3} + k$, so $k < {s12} - {s3}$. The threshold is $k_c =$ **{kc}**. There the polynomial is $(\lambda + {s1})(\lambda^2 + {s2})$, with roots $\pm i\sqrt{{s2}}$, so $\omega = \sqrt{{s2}} \approx$ **{w:num2}**.
