# Round 2 drills for de-m3 (honors lessons 13h1 quadratic drag, 13h2 drug dosing)
- id: de-m3-r2-quad-fall
  title: Falling from rest with quadratic drag
  topic: Quadratic drag
  vars:
    m: {min: 50, max: 100, step: 5}
    kq: {choices: [0.2, 0.25, 0.3, 0.35, 0.4]}
    t1: {min: 2, max: 12}
  calc:
    vT: sqrt(m*9.8/kq)
    s: 9.8*t1/vT
    v: vT*tanh(9.8*t1/vT)
  prompt: 'A {m} kg skydiver falls from rest with drag force ${kq}v^2$ newtons ($v$ in m/s). With down positive, $m\dfrac{dv}{dt} = mg - {kq}v^2$ and $g = 9.8$ m/s². Find the terminal velocity and the speed after {t1} s. (1 decimal place each)'
  answers:
    - {name: vT, label: '$v_T$ (m/s)', tolerance: 0.06}
    - {name: v, label: '$v({t1})$ (m/s)', tolerance: 0.06}
  solution: |-
    Terminal velocity: ${kq}v_T^2 = {m}(9.8)$, so $v_T = \sqrt{\dfrac{{m}(9.8)}{{kq}}} \approx$ **{vT:num1} m/s**. Starting from rest, $v = v_T\tanh\!\left(\dfrac{9.8\,t}{v_T}\right)$. At $t = {t1}$: $\dfrac{9.8({t1})}{v_T} \approx {s:num4}$, so $v \approx {vT:num4}\tanh({s:num4}) \approx$ **{v:num1} m/s**.
- id: de-m3-r2-quad-height
  title: Maximum height with quadratic drag
  topic: Quadratic drag
  vars:
    vT: {min: 20, max: 50, step: 5}
    v0: {min: 10, max: 40, step: 2}
  calc:
    H: vT^2/(2*9.8)*ln(1 + v0^2/vT^2)
    tt: vT/9.8*atan(v0/vT)
    H0: v0^2/(2*9.8)
    ratio: v0/vT
  prompt: 'A ball with terminal velocity {vT} m/s (quadratic drag) is thrown straight up at {v0} m/s. Using $g = 9.8$ m/s², find its maximum height (1 decimal place) and the time to reach it (2 decimal places).'
  answers:
    - {name: H, label: '$H$ (m)', tolerance: 0.06}
    - {name: tt, label: '$t_{\text{top}}$ (s)', tolerance: 0.006}
  solution: |-
    $H = \dfrac{v_T^2}{2g}\ln\left(1 + \dfrac{v_0^2}{v_T^2}\right) = \dfrac{{vT}^2}{19.6}\ln\left(1 + \dfrac{{v0}^2}{{vT}^2}\right) \approx$ **{H:num1} m** (without drag it would be {H0:num1} m). $t_{\text{top}} = \dfrac{v_T}{g}\tan^{-1}\dfrac{v_0}{v_T} = \dfrac{{vT}}{9.8}\tan^{-1}({ratio:num4}) \approx$ **{tt:num2} s** (angle in radians).
- id: de-m3-r2-quad-return
  title: Landing speed after an upward throw with quadratic drag
  topic: Quadratic drag
  vars:
    vT: {min: 20, max: 60, step: 5}
    v0: {min: 10, max: 50, step: 5}
  calc:
    vr: v0*vT/sqrt(v0^2 + vT^2)
    tf: vT/9.8*atanh(vr/vT)
  prompt: 'A ball with terminal velocity {vT} m/s (quadratic drag) is thrown straight up at {v0} m/s and falls back to the launch point. Using $g = 9.8$ m/s², find its speed when it returns (1 decimal place) and the time it spends falling from the top (2 decimal places).'
  answers:
    - {name: vr, label: 'Return speed (m/s)', tolerance: 0.06}
    - {name: tf, label: 'Fall time (s)', tolerance: 0.006}
  solution: |-
    The return speed is $v_{\text{ret}} = \dfrac{v_0v_T}{\sqrt{v_0^2 + v_T^2}} = \dfrac{{v0}({vT})}{\sqrt{{v0}^2 + {vT}^2}} \approx$ **{vr:num1} m/s**. Falling from rest, $v = v_T\tanh(gt/v_T)$, so the fall time is $t = \dfrac{v_T}{g}\tanh^{-1}\dfrac{v_{\text{ret}}}{v_T} = \dfrac{{vT}}{9.8}\tanh^{-1}\dfrac{{vr:num4}}{{vT}} \approx$ **{tf:num2} s**.
- id: de-m3-r2-bolus-fit
  title: Half-life and volume from two blood samples
  topic: Pharmacokinetics
  vars:
    D: {min: 200, max: 1000, step: 50}
    V: {min: 20, max: 80, step: 5}
    th: {choices: [2, 3, 4, 5, 6, 8, 10, 12]}
    t1: {min: 1, max: 3}
    dt: {min: 2, max: 8}
  calc:
    t2: t1 + dt
    C1r: round(D/V*exp(-ln(2)/th*t1), 2)
    C2r: round(D/V*exp(-ln(2)/th*t2), 2)
    kk: ln(C1r/C2r)/dt
    thalf: ln(2)/kk
    C0: C1r*exp(kk*t1)
    Vd: D/C0
  where: ['D/V*exp(-ln(2)/th*(t1 + dt)) > 1']
  prompt: 'A patient receives a {D} mg IV bolus of a drug that follows the one-compartment model. The blood concentration is {C1r:num2} mg/L at {t1} h and {C2r:num2} mg/L at {t2} h. Find the half-life and the volume of distribution (3 significant figures each).'
  answers:
    - {name: thalf, label: '$t_{1/2}$ (h)', sigfigs: 3, format: sig3}
    - {name: Vd, label: '$V$ (L)', sigfigs: 3, format: sig3}
  solution: |-
    $C = C(0)e^{-kt}$, so $k = \dfrac{1}{{dt}}\ln\dfrac{{C1r:num2}}{{C2r:num2}} \approx {kk:num4}$ per hour and $t_{1/2} = \dfrac{\ln 2}{k} \approx$ **{thalf:sig3} h**. Back to $t = 0$: $C(0) = {C1r:num2}\,e^{{kk:num4}({t1})} \approx {C0:num4}$ mg/L, so $V = \dfrac{\,D}{C(0)} = \dfrac{{D}}{{C0:num4}} \approx$ **{Vd:sig3} L**.
- id: de-m3-r2-infusion
  title: Concentration during a constant infusion
  topic: Pharmacokinetics
  vars:
    th: {choices: [2, 3, 4, 5, 6, 8, 10, 12]}
    V: {min: 20, max: 80, step: 5}
    R0: {min: 10, max: 100, step: 5}
    t1: {min: 2, max: 24}
  calc:
    kk: ln(2)/th
    CL: kk*V
    Css: R0/CL
    C: Css*(1 - exp(-kk*t1))
  prompt: 'A drug with half-life {th} h and volume of distribution {V} L is infused at a constant {R0} mg/h, starting at $t = 0$ with none in the body. Find the steady-state concentration and the concentration after {t1} h, in mg/L. (2 decimal places each)'
  answers:
    - {name: Css, label: '$C_{ss}$ (mg/L)', tolerance: 0.006}
    - {name: C, label: '$C({t1})$ (mg/L)', tolerance: 0.006}
  solution: |-
    $k = \dfrac{\ln 2}{{th}} \approx {kk:num4}$ per hour and $\text{CL} = kV \approx {CL:num4}$ L/h. Steady state: $C_{ss} = \dfrac{R_0}{\text{CL}} = \dfrac{{R0}}{{CL:num4}} \approx$ **{Css:num2} mg/L**. Then $C({t1}) = C_{ss}\left(1 - e^{-k({t1})}\right) \approx$ **{C:num2} mg/L**.
- id: de-m3-r2-dose-steady
  title: Steady-state peak and trough for repeated doses
  topic: Pharmacokinetics
  vars:
    D: {min: 100, max: 800, step: 50}
    V: {min: 20, max: 80, step: 5}
    th: {choices: [3, 4, 6, 8, 12]}
    tau: {choices: [4, 6, 8, 12, 24]}
  calc:
    kk: ln(2)/th
    r: exp(-kk*tau)
    C1: D/V
    peak: D/V/(1 - r)
    trough: r*peak
  prompt: 'A drug with half-life {th} h and volume of distribution {V} L is given as a {D} mg IV bolus every {tau} h. Using the one-compartment model, find the steady-state peak and trough concentrations in mg/L. (2 decimal places each)'
  answers:
    - {name: peak, label: 'Peak (mg/L)', tolerance: 0.006}
    - {name: trough, label: 'Trough (mg/L)', tolerance: 0.006}
  solution: |-
    Each dose adds $D/V = {C1:num4}$ mg/L. The fraction left after one interval is $r = e^{-k\tau} = 2^{-{tau}/{th}} \approx {r:num4}$. Steady-state peak $= \dfrac{D/V}{1 - r} \approx$ **{peak:num2} mg/L**; trough $= r \times \text{peak} \approx$ **{trough:num2} mg/L**.
