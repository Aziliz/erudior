# Round 2 drills for module de-m2 (honors lessons: Picard iteration, Grönwall, Riccati and Clairaut)
- id: de-m2-r2-picard-iterate
  title: Second Picard iterate
  topic: Picard iteration
  vars:
    a: {min: -4, max: 4}
    b: {min: -3, max: 3}
    y0: {min: -3, max: 3}
  where: ['a != 0', 'b != 0', 'y0 != 0', 'a + b*y0 != 0', 'mod(b*(a + b*y0), 2) == 0']
  calc:
    by0: b*y0
    c1: a + b*y0
    bc1: b*(a + b*y0)
    c2: b*(a + b*y0)/2
  prompt: 'Find the second Picard iterate $\varphi_2(t)$ for $y'' = {a} {b:signedcoef}y$, $y(0) = {y0}$, starting from $\varphi_0 = {y0}$.'
  answers:
    - {kind: expression, expression: 'y0 + c1*t + c2*t^2', variables: [t], label: '$\varphi_2(t) =$', show: '${y0} {c1:signedcoef}t {c2:signedcoef}t^2$'}
  solution: |-
    Each iterate is $\varphi_{n+1}(t) = {y0} + \int_0^t \big({a} {b:signedcoef}\varphi_n(s)\big)\,ds$. First, $\varphi_1 = {y0} + \int_0^t ({a} {by0:signed})\,ds = {y0} {c1:signedcoef}t$. Then $\varphi_2 = {y0} + \int_0^t \big({a} {b:signedcoef}({y0} {c1:signedcoef}s)\big)\,ds = {y0} + \int_0^t ({c1} {bc1:signedcoef}s)\,ds$, so **$\varphi_2(t) = {y0} {c1:signedcoef}t {c2:signedcoef}t^2$**.
- id: de-m2-r2-picard-h
  title: Guaranteed interval from the Picard theorem
  topic: Picard iteration
  vars:
    y0: {min: 1, max: 3}
    bb: {min: 1, max: 4}
    A: {choices: [{label: '1', value: 1}, {label: '\tfrac{1}{10}', value: 0.1}]}
  calc:
    M: (y0 + bb)^2
    h: min(A, bb/(y0 + bb)^2)
  prompt: 'For $y'' = y^2$, $y(0) = {y0}$, use the rectangle $|t| \le {A}$, $|y - {y0}| \le {bb}$. Find the guaranteed interval $|t| \le h$, where $h = \min(a, b/M)$ and $M$ is the largest value of $|f|$ on the rectangle. Give $h$ as an exact fraction.'
  answers:
    - {name: h, kind: fraction, tolerance: 0.000000001, label: '$h =$'}
  solution: |-
    On the rectangle $y$ runs from ${y0} - {bb}$ to ${y0} + {bb}$, so $M = \max y^2 = ({y0} + {bb})^2 = {M}$. Then $b/M = \dfrac{{bb}}{{M}}$ and $a = {A}$, and $h$ is the smaller of the two: **$h = {h:texfrac}$**.
- id: de-m2-r2-gronwall-bound
  title: Continuous dependence bound
  topic: Continuous dependence
  vars:
    c: {choices: [0.5, 1, 1.5, 2, 3]}
    dd: {choices: [0.01, 0.02, 0.05, 0.1]}
    T: {min: 1, max: 4}
  calc:
    LT: c*T
    bound: dd*exp(c*T)
  prompt: 'Two solutions of $y'' = {c:coef}\sin y$ start ${dd}$ apart at $t = 0$. Use the continuous dependence estimate $|y(t) - z(t)| \le |y_0 - z_0|\,e^{L|t - t_0|}$ to bound their gap at $t = {T}$. Give the bound to 3 significant figures.'
  answers:
    - {name: bound, sigfigs: 3, label: 'gap $\le$'}
  solution: |-
    $f_y = {c:coef}\cos y$, so $|f_y| \le {c}$ and the Lipschitz constant is $L = {c}$. The bound is ${dd}\,e^{{c} \cdot {T}} = {dd}\,e^{{LT}} \approx$ **{bound:sig3}**.
- id: de-m2-r2-gronwall-precision
  title: How precise must the start be?
  topic: Continuous dependence
  vars:
    c: {choices: [0.2, 0.25, 0.4, 0.5, 1]}
    eps: {choices: [0.1, 0.05, 0.01]}
    T: {min: 2, max: 6}
  calc:
    LT: c*T
    dmax: eps*exp(-c*T)
  prompt: 'A process follows $y'' = {c:coef}\cos y$. Using the continuous dependence estimate, how accurately must $y(0)$ be known to guarantee that $y({T})$ is predicted within ${eps}$? Give the largest allowed initial error $\delta$ to 3 significant figures.'
  answers:
    - {name: dmax, sigfigs: 3, label: '$\delta =$'}
  solution: |-
    $|f_y| = |{c:coef}\sin y| \le {c}$, so $L = {c}$ and an initial error $\delta$ grows to at most $\delta e^{{c} \cdot {T}} = \delta e^{{LT}}$. Require $\delta e^{{LT}} \le {eps}$: $\delta \le {eps}\,e^{-{LT}} \approx$ **{dmax:sig3}**.
- id: de-m2-r2-riccati
  title: Riccati equation with a known solution
  topic: Riccati and Clairaut equations
  vars:
    a: {min: -3, max: 3}
    y0: {min: -3, max: 3}
  where: ['a != 0', 'y0 != 0']
  calc:
    na: -a
    ny0: -y0
    asq: a^2
    q1c: -2*a
  prompt: 'The Riccati equation $y'' = {a} + (y {na:signedcoef}t)^2$ has the solution $y_1 = {a:coef}t$. Use $y = y_1 + \dfrac1v$ to solve it with $y(0) = {y0}$.'
  answers:
    - {kind: expression, expression: 'a*t + y0/(1 - y0*t)', variables: [t], label: '$y =$', show: '${a:coef}t + \dfrac{{y0}}{1 {ny0:signedcoef}t}$'}
  solution: |-
    Expanding, $q_0 = {a} + {asq}t^2$, $q_1 = {q1c:coef}t$ and $q_2 = 1$, so $2q_2y_1 = 2({a:coef}t)$ cancels $q_1$: $q_1 + 2q_2y_1 = 0$ and the linear equation is $v' = -1$. So $v = C - t$ and $y = {a:coef}t + \dfrac{1}{C - t}$. At $t = 0$: $\dfrac1C = {y0}$, so $C = \dfrac{1}{{y0}}$. Multiplying top and bottom of $\dfrac{1}{C - t}$ by ${y0}$ gives **$y = {a:coef}t + \dfrac{{y0}}{1 {ny0:signedcoef}t}$**.
- id: de-m2-r2-clairaut
  title: Straight-line solutions of a Clairaut equation
  topic: Riccati and Clairaut equations
  vars:
    r1: {min: -4, max: 4}
    r2: {min: -4, max: 4}
  where: ['r1 < r2', 'r1 != 0', 'r2 != 0', 'r1 + r2 != 0']
  calc:
    x0: r1 + r2
    y0: r1*r2
    nx0: -(r1 + r2)
    nr1: -r1
    nr2: -r2
  prompt: 'The Clairaut equation $y = xy'' - (y'')^2$ has the straight-line solutions $y = Cx - C^2$. Find the slopes $C$ of the two lines through $({x0}, {y0})$, smaller one first.'
  answers:
    - {name: r1, label: '$C_1 =$'}
    - {name: r2, label: '$C_2 =$'}
  solution: |-
    Put $({x0}, {y0})$ into $y = Cx - C^2$: ${y0} = {x0}C - C^2$, so $C^2 {nx0:signedcoef}C {y0:signed} = 0$. This factors as $(C {nr1:signed})(C {nr2:signed}) = 0$, so $C_1 =$ **{r1}** and $C_2 =$ **{r2}**.
