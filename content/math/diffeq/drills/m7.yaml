# Module 7 drills
- id: de-laplace-eval
  title: Evaluate a Laplace transform
  topic: Laplace transform
  vars:
    a: {min: -3, max: 2}
    bb: {min: 1, max: 4}
    fn: {choices: [{label: '\cos', value: 0}, {label: '\sin', value: 1}]}
    s0: {min: 3, max: 6}
  where: ['a != 0']
  calc:
    den: (s0 - a)^2 + bb^2
    F: if(fn == 0, (s0 - a)/den, bb/den)
    na: -a
  prompt: 'Let $F(s) = \mathcal{L}\{e^{{a:coef}t}{fn} {bb:coef}t\}$. Find $F({s0})$ as an exact fraction.'
  answers:
    - {name: F, label: '$F({s0}) =$', kind: fraction, lowestTerms: true}
  solution: |-
    By the table and the first shifting theorem, $\mathcal{L}\{e^{at}\cos bt\} = \dfrac{s - a}{(s - a)^2 + b^2}$ and $\mathcal{L}\{e^{at}\sin bt\} = \dfrac{b}{(s - a)^2 + b^2}$. Here $a = {a}$, $b = {bb}$, and at $s = {s0}$ the denominator is $({s0} {na:signed})^2 + {bb}^2 = {den}$. So $F({s0}) =$ **{F:frac}**.
- id: de-laplace-poly
  title: Transform of a polynomial times an exponential
  topic: Laplace transform
  vars:
    c: {min: 1, max: 5}
    tn: {choices: [{label: 't', value: 1}, {label: 't^2', value: 2}, {label: 't^3', value: 3}]}
    a: {min: -4, max: 4}
    k: {min: 1, max: 6}
  where: ['a != 0']
  calc:
    n: tn
    nf: fact(n)
    cn: c*fact(n)
    n1: n + 1
    na: -a
  prompt: 'Find $\mathcal{L}\{{c:coef}{tn}e^{{a:coef}t} + {k}\}$ as a function of $s$.'
  answers:
    - {kind: expression, expression: 'cn/(s - a)^(n + 1) + k/s', variables: [s], label: '$F(s) =$', show: '$\dfrac{{cn}}{(s {na:signed})^{{n1}}} + \dfrac{{k}}{s}$'}
  solution: |-
    $\mathcal{L}\{{tn}\} = \dfrac{{n}!}{s^{{n1}}} = \dfrac{{nf}}{s^{{n1}}}$; the factor $e^{{a:coef}t}$ replaces $s$ by $s {na:signed}$. With the constant: **$F(s) = \dfrac{{cn}}{(s {na:signed})^{{n1}}} + \dfrac{{k}}{s}$**.
- id: de-inverse-pf
  title: Inverse transform by partial fractions
  topic: Inverse Laplace transform
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
    A: {min: -4, max: 4}
    B: {min: -4, max: 4}
  where: ['p < q', 'A != 0', 'B != 0', 'A + B != 0', 'p*q != 0', 'p + q != 0', 'A*q + B*p != 0']
  calc:
    c1: A + B
    c0: -(A*q + B*p)
    sp: -(p + q)
    pq: p*q
    np: -p
    nq: -q
  prompt: 'Find $\mathcal{L}^{-1}\left\{\dfrac{{c1:coef}s {c0:signed}}{s^2 {sp:signedcoef}s {pq:signed}}\right\}$.'
  answers:
    - {kind: expression, expression: 'A*exp(p*t) + B*exp(q*t)', variables: [t], label: '$f(t) =$', show: '${A:coef}e^{{p:coef}t} {B:signedcoef}e^{{q:coef}t}$'}
  solution: |-
    The denominator factors as $(s {np:signed})(s {nq:signed})$. Cover-up: at $s = {p}$ the coefficient is $A = {A}$; at $s = {q}$ it is $B = {B}$. So $F = \dfrac{{A}}{s {np:signed}} + \dfrac{{B}}{s {nq:signed}}$ and $f(t) =$ **${A:coef}e^{{p:coef}t} {B:signedcoef}e^{{q:coef}t}$**.
- id: de-inverse-shift
  title: Inverse transform by completing the square
  topic: Inverse Laplace transform
  vars:
    a: {min: -3, max: 3}
    b: {min: 1, max: 4}
    A: {min: -3, max: 3}
    B: {min: -3, max: 3}
  where: ['a != 0', 'A != 0', 'B != 0', 'B*b - A*a != 0']
  calc:
    n0: -A*a + B*b
    sa: -2*a
    c: a^2 + b^2
    na: -a
    Bb: B*b
  prompt: 'Find $\mathcal{L}^{-1}\left\{\dfrac{{A:coef}s {n0:signed}}{s^2 {sa:signedcoef}s + {c}}\right\}$.'
  answers:
    - {kind: expression, expression: 'exp(a*t)*(A*cos(b*t) + B*sin(b*t))', variables: [t], label: '$f(t) =$', show: '$e^{{a:coef}t}\left({A:coef}\cos {b:coef}t {B:signedcoef}\sin {b:coef}t\right)$'}
  solution: |-
    Complete the square: $s^2 {sa:signedcoef}s + {c} = (s {na:signed})^2 + {b}^2$. Write the numerator in terms of $s {na:signed}$: ${A:coef}s {n0:signed} = {A:coef}(s {na:signed}) {Bb:signed}$, and ${Bb} = ({B})({b})$. So $F = {A:coef}\dfrac{s {na:signed}}{(s {na:signed})^2 + {b}^2} {B:signedcoef}\dfrac{{b}}{(s {na:signed})^2 + {b}^2}$, and $f(t) =$ **$e^{{a:coef}t}\left({A:coef}\cos {b:coef}t {B:signedcoef}\sin {b:coef}t\right)$**.
- id: de-laplace-ivp1
  title: First-order IVP by Laplace transform
  topic: Laplace transform IVPs
  vars:
    a: {min: 1, max: 5}
    m: {min: -4, max: 4}
    y0: {min: -5, max: 5}
  where: ['m != 0', 'y0 != m', 'y0 != 0']
  calc:
    b: a*m
    C: y0 - m
    ny0: -y0
  prompt: 'Use Laplace transforms to solve $y'' {a:signedcoef}y = {b}$, $y(0) = {y0}$.'
  answers:
    - {kind: expression, expression: 'm + C*exp(-a*t)', variables: [t], label: '$y =$', show: '${m} {C:signedcoef}e^{-{a:coef}t}$'}
  solution: |-
    Transform: $sY {ny0:signed} {a:signedcoef}Y = \dfrac{{b}}{s}$, so $Y = \dfrac{{y0}}{s + {a}} + \dfrac{{b}}{s(s + {a})}$. Partial fractions: $\dfrac{{b}}{s(s + {a})} = \dfrac{{m}}{s} - \dfrac{{m}}{s + {a}}$. So $Y = \dfrac{{m}}{s} + \dfrac{{C}}{s + {a}}$ and **$y = {m} {C:signedcoef}e^{-{a:coef}t}$**.
- id: de-laplace-Ys
  title: Transform of the solution of a second-order IVP
  topic: Laplace transform IVPs
  vars:
    b: {min: -4, max: 4}
    c: {min: 1, max: 10}
    y0: {min: -3, max: 3}
    v0: {min: -4, max: 4}
  where: ['b != 0', 'y0 != 0', 'v0 + b*y0 != 0']
  calc:
    k0: v0 + b*y0
  prompt: 'For $y'''' {b:signedcoef}y'' + {c:coef}y = 0$ with $y(0) = {y0}$ and $y''(0) = {v0}$, find $Y(s) = \mathcal{L}\{y\}$.'
  answers:
    - {kind: expression, expression: '(y0*s + k0)/(s^2 + b*s + c)', variables: [s], label: '$Y(s) =$', show: '$\dfrac{{y0:coef}s {k0:signed}}{s^2 {b:signedcoef}s + {c}}$'}
  solution: |-
    $\big(s^2Y - ({y0})s - ({v0})\big) + ({b})\big(sY - ({y0})\big) {c:signedcoef}Y = 0$. Collect: $(s^2 {b:signedcoef}s + {c})Y = ({y0})s + ({v0}) + ({b})({y0}) = {y0:coef}s {k0:signed}$. So **$Y(s) = \dfrac{{y0:coef}s {k0:signed}}{s^2 {b:signedcoef}s + {c}}$**.
- id: de-step-transform
  title: Transform of a delayed function
  topic: Step functions
  vars:
    c: {min: 1, max: 5}
    k: {min: 1, max: 4}
  calc:
    ck: c*k
  prompt: 'Find $\mathcal{L}\{{k:coef}u_{{c}}(t)\,t\}$ as a function of $s$.'
  answers:
    - {kind: expression, expression: 'k*exp(-c*s)*(1/s^2 + c/s)', variables: [s], label: '$F(s) =$', show: '$e^{-{c:coef}s}\left(\dfrac{{k}}{s^2} + \dfrac{{ck}}{s}\right)$'}
  solution: |-
    Write $t = (t - {c}) + {c}$, so ${k:coef}t = {k:coef}(t - {c}) + {ck}$. By the second shifting theorem, $\mathcal{L}\{u_{{c}}(t)f(t - {c})\} = e^{-{c:coef}s}F(s)$ with $f(\tau) = {k:coef}\tau + {ck}$. So **$F(s) = e^{-{c:coef}s}\left(\dfrac{{k}}{s^2} + \dfrac{{ck}}{s}\right)$**.
- id: de-step-response
  title: Response to a switched-on input
  topic: Step functions
  vars:
    a: {min: 1, max: 4}
    b: {min: 1, max: 10}
    c: {min: 1, max: 4}
    dt: {choices: [0.5, 1, 1.5, 2]}
  calc:
    t1: c + dt
    yv: b/a*(1 - exp(-a*dt))
    ba: b/a
  prompt: 'Solve $y'' {a:signedcoef}y = {b}u_{{c}}(t)$, $y(0) = 0$, and give $y({t1})$ to 4 decimal places.'
  answers:
    - {name: yv, label: '$y({t1}) \approx$', tolerance: 0.00006, format: num4}
  solution: |-
    $(s + {a})Y = \dfrac{{b:coef}e^{-{c:coef}s}}{s}$, so $Y = e^{-{c:coef}s}H(s)$ with $H = \dfrac{{b}}{s(s + {a})}$ and $h(t) = \dfrac{{b}}{{a}}\left(1 - e^{-{a:coef}t}\right)$. Then $y = u_{{c}}(t)h(t - {c})$, and $y({t1}) = {ba:num4}\left(1 - e^{-{a:coef}({dt})}\right) \approx$ **{yv:num4}**.
- id: de-impulse-response
  title: Impulse response of a damped oscillator
  topic: Impulses and convolution
  vars:
    lam: {min: -3, max: -1}
    mu: {min: 2, max: 4}
  calc:
    b: -2*lam
    c: lam^2 + mu^2
    nl: -lam
  prompt: 'Find the impulse response $h(t)$ of $y'''' {b:signedcoef}y'' + {c}y = \delta(t)$, $y(0) = y''(0) = 0$.'
  answers:
    - {kind: expression, expression: 'exp(lam*t)*sin(mu*t)/mu', variables: [t], label: '$h(t) =$', show: '$\dfrac{1}{{mu}}e^{{lam:coef}t}\sin {mu:coef}t$'}
  solution: |-
    $(s^2 {b:signedcoef}s + {c})Y = 1$, so $H(s) = \dfrac{1}{(s {nl:signed})^2 + {mu}^2} = \dfrac{1}{{mu}}\cdot\dfrac{{mu}}{(s {nl:signed})^2 + {mu}^2}$. Inverting: **$h(t) = \dfrac{1}{{mu}}e^{{lam:coef}t}\sin {mu:coef}t$**.
- id: de-convolution
  title: Convolution of two exponentials
  topic: Impulses and convolution
  vars:
    a: {min: -3, max: 3}
    b: {min: -3, max: 3}
  where: ['a >= b + 2', 'a != 0', 'b != 0']
  calc:
    ab: a - b
    na: -a
    nb: -b
  prompt: 'Compute the convolution $e^{{a:coef}t} * e^{{b:coef}t} = \displaystyle\int_0^t e^{{a:coef}(t - \tau)}e^{{b:coef}\tau}\,d\tau$.'
  answers:
    - {kind: expression, expression: '(exp(a*t) - exp(b*t))/(a - b)', variables: [t], label: '$=$', show: '$\dfrac{e^{{a:coef}t} - e^{{b:coef}t}}{{ab}}$'}
  solution: |-
    By the convolution theorem, the transform is $\dfrac{1}{(s {na:signed})(s {nb:signed})} = \dfrac{1}{{ab}}\left(\dfrac{1}{s {na:signed}} - \dfrac{1}{s {nb:signed}}\right)$. Inverting: **$\dfrac{e^{{a:coef}t} - e^{{b:coef}t}}{{ab}}$**.
