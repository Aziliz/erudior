# Round 2 cards for module de-m8 (honors lessons 37h1 and 37h2)
- {front: 'Equations of two masses and three springs between walls', back: '$m_1x_1'''' = -k_1x_1 + k_2(x_2 - x_1)$, $m_2x_2'''' = -k_2(x_2 - x_1) - k_3x_2$, or $M\mathbf{x}'''' = -K\mathbf{x}$.', topic: Coupled oscillators}
- {front: 'Stiffness matrix for springs $k_1$, $k_2$, $k_3$ in a row', back: '$K = \begin{bmatrix} k_1 + k_2 & -k_2 \\ -k_2 & k_2 + k_3 \end{bmatrix}$ (symmetric).', topic: Coupled oscillators}
- {front: 'Eigenvalue problem for natural frequencies', back: 'Try $\cos(\omega t)\mathbf{v}$: $M^{-1}K\mathbf{v} = \omega^2\mathbf{v}$. Eigenvalues are $\omega^2$; eigenvectors are mode shapes.', topic: Coupled oscillators}
- {front: 'General free motion of two coupled masses', back: '$\mathbf{x} = (a_1\cos\omega_1t + b_1\sin\omega_1t)\mathbf{v}_1 + (a_2\cos\omega_2t + b_2\sin\omega_2t)\mathbf{v}_2$: four constants for two positions and two velocities.', topic: Coupled oscillators}
- {front: 'Identical masses $m$, identical springs $k$: the two modes', back: 'In phase $(1, 1)$ with $\omega = \sqrt{k/m}$; out of phase $(1, -1)$ with $\omega = \sqrt{3k/m}$.', topic: Coupled oscillators}
- {front: 'Why the frequencies of a mass–spring system are real', back: '$K$ is symmetric with positive energy $\tfrac12\mathbf{x}^TK\mathbf{x}$, so the eigenvalues $\omega^2$ of $M^{-1}K$ are real and positive.', topic: Coupled oscillators}
- {front: 'Modal coordinates for two identical masses', back: '$q_1 = x_1 + x_2$ and $q_2 = x_1 - x_2$ each obey their own equation $q'''' + \omega^2q = 0$.', topic: Coupled oscillators}
- {front: 'Weak coupling: time for the motion to pass from mass 1 to mass 2', back: '$t = \dfrac{\pi}{\omega_2 - \omega_1}$, from the beat envelope $\cos\big(\tfrac{\omega_2 - \omega_1}{2}t\big)$.', topic: Coupled oscillators}
- {front: 'Is a mixture of two normal modes periodic?', back: 'Only if $\omega_2/\omega_1$ is rational.', topic: Coupled oscillators}
- {front: 'Two-story shear building ($k/m$ per story)', back: '$M^{-1}K = \frac{k}{m}\begin{bmatrix} 2 & -1 \\ -1 & 1 \end{bmatrix}$; modes $(1, 1.618)$ and $(1, -0.618)$, $\omega^2 = \frac{3 \mp \sqrt5}{2}\cdot\frac{k}{m}$.', topic: Coupled oscillators}
- {front: 'Stability of $\mathbf{x}'' = A\mathbf{x}$ in any dimension', back: 'Asymptotically stable exactly when every eigenvalue has negative real part.', topic: Stability of larger systems}
- {front: 'Characteristic polynomial of a $3 \times 3$ matrix', back: '$\det(\lambda I - A) = \lambda^3 - (\operatorname{tr}A)\lambda^2 + E_2\lambda - \det A$, with $E_2$ the sum of the principal $2 \times 2$ minors.', topic: Stability of larger systems}
- {front: 'Eigenvalues, trace and determinant ($n \times n$)', back: 'The eigenvalues add up to $\operatorname{tr}A$ and multiply to $\det A$.', topic: Stability of larger systems}
- {front: 'Routh–Hurwitz for $\lambda^2 + a_1\lambda + a_2$', back: 'Stable exactly when $a_1 > 0$ and $a_2 > 0$ (for a matrix: $T < 0 < D$).', topic: Stability of larger systems}
- {front: 'Routh–Hurwitz for $\lambda^3 + a_1\lambda^2 + a_2\lambda + a_3$', back: 'Stable exactly when $a_1 > 0$, $a_3 > 0$ and $a_1a_2 > a_3$.', topic: Stability of larger systems}
- {front: 'The cubic at the stability threshold $a_1a_2 = a_3$', back: '$(\lambda + a_1)(\lambda^2 + a_2)$: roots $-a_1$ and $\pm i\sqrt{a_2}$, so oscillations of angular frequency $\sqrt{a_2}$ appear.', topic: Stability of larger systems}
- {front: 'Signs of trace and determinant for a stable $3 \times 3$ matrix', back: 'Both negative: $\operatorname{tr}A < 0$ and $\det A < 0$.', topic: Stability of larger systems}
- {front: 'Eigenvalues of a triangular matrix', back: 'Its diagonal entries (e.g. a chain of tanks: minus flow ÷ volume for each tank).', topic: Stability of larger systems}
- {front: 'Peak of the second tank in a chain with rates $a$, $b$', back: 'At $t = \dfrac{\ln(a/b)}{a - b}$, where $ae^{-at} = be^{-bt}$.', topic: Stability of larger systems}
- {front: 'Companion matrix of $y'''''' + a_1y'''' + a_2y'' + a_3y = 0$', back: '$\begin{bmatrix} 0 & 1 & 0 \\ 0 & 0 & 1 \\ -a_3 & -a_2 & -a_1 \end{bmatrix}$; its eigenvectors are $(1, \lambda, \lambda^2)$.', topic: Stability of larger systems}
