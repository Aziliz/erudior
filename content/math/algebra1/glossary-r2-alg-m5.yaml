# Round 2: alg-m5 honors lessons (polynomial division; binomial expansion)
- term: dividend
  definition: 'In a division, the number or polynomial being divided. In $P(x) \div D(x)$, the dividend is $P(x)$.'
  topic: Polynomial division
- term: divisor
  aliases: [divisors]
  definition: 'In a division, the number or polynomial you divide by. In $P(x) \div D(x)$, the divisor is $D(x)$.'
  topic: Polynomial division
- term: quotient
  aliases: [quotients]
  definition: 'The result of a division. When $P(x)$ is divided by $D(x)$, the quotient $Q(x)$ is the polynomial in $P(x) = D(x)Q(x) + R(x)$.'
  topic: Polynomial division
- term: remainder
  aliases: [remainders]
  definition: 'What is left over after a division. For whole numbers it is less than the divisor ($17 = 5 \cdot 3 + 2$, remainder 2); for polynomials it is 0 or has lower degree than the divisor.'
  topic: Polynomial division
- term: division algorithm
  definition: 'For polynomials $P(x)$ and $D(x) \ne 0$ there is exactly one pair $Q(x)$, $R(x)$ with $P(x) = D(x)Q(x) + R(x)$, where $R = 0$ or $R$ has lower degree than $D$.'
  topic: Polynomial division
- term: polynomial long division
  definition: 'Dividing one polynomial by another the way you divide numbers: divide the leading terms, multiply, subtract, bring down, and repeat until what is left has lower degree than the divisor.'
  topic: Polynomial division
- term: synthetic division
  definition: 'A shortcut for dividing a polynomial by $x - c$ using only its coefficients: bring down the first, then repeatedly multiply by $c$ and add. The last number is the remainder.'
  topic: Polynomial division
- term: remainder theorem
  definition: 'When a polynomial $P(x)$ is divided by $x - c$, the remainder is $P(c)$.'
  topic: Polynomial division
- term: factor theorem
  definition: '$x - c$ is a factor of the polynomial $P(x)$ exactly when $P(c) = 0$.'
  topic: Polynomial division
- term: Pascal's triangle
  aliases: [Pascals triangle]
  definition: 'A triangle of numbers with 1 at the top and down each side, where every other entry is the sum of the two above it. Row $n$ (counting from 0) gives the coefficients of $(a + b)^n$.'
  topic: Binomial expansion
- term: binomial coefficient
  aliases: [binomial coefficients]
  definition: 'The number $\binom{n}{k} = \frac{n!}{k!\,(n - k)!}$ ("$n$ choose $k$"): the number of ways to choose $k$ things from $n$, and the coefficient of $a^{n-k}b^k$ in $(a + b)^n$.'
  topic: Binomial expansion
- term: binomial theorem
  definition: '$(a + b)^n = \binom{n}{0}a^n + \binom{n}{1}a^{n-1}b + \cdots + \binom{n}{n}b^n$: the term with $b^k$ is $\binom{n}{k}a^{n-k}b^k$.'
  topic: Binomial expansion
- term: Pythagorean triple
  aliases: [Pythagorean triples]
  definition: 'Three positive integers $a$, $b$, $c$ with $a^2 + b^2 = c^2$, such as 3, 4, 5 or 5, 12, 13.'
  topic: Polynomial identities
