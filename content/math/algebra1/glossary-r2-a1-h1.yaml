# Glossary: honors module a1-h1 (Algebraic reasoning and modeling), round 2
- term: conjecture
  aliases: [conjectures]
  definition: 'A statement that seems true from examples but has not yet been proved for every case.'
  topic: Algebraic proof
- term: counterexample
  aliases: [counterexamples, counter-example]
  definition: 'A single case in which a "for every" statement is false. One counterexample is enough to disprove such a statement.'
  topic: Algebraic proof
- term: proof
  aliases: [proofs]
  definition: 'An argument, built from definitions and facts already accepted, that shows a statement is true in every case.'
  topic: Algebraic proof
- term: even number
  aliases: [even numbers]
  definition: 'An integer that is 2 times an integer: $2k$ for some integer $k$.'
  topic: Algebraic proof
- term: odd number
  aliases: [odd numbers]
  definition: 'An integer that is 1 more than an even number: $2k + 1$ for some integer $k$.'
  topic: Algebraic proof
- term: divisible
  aliases: [divisible by, divisibility]
  definition: 'An integer is divisible by $m$ when it equals $m$ times some integer. For example, $3n + 3 = 3(n + 1)$ is divisible by 3.'
  topic: Algebraic proof
- term: direct proof
  aliases: [direct proofs]
  definition: 'A proof that starts from what is known and reaches the statement step by step, for example by rewriting an expression as $2(\text{integer})$ to show it is even.'
  topic: Algebraic proof
- term: reversible step
  aliases: [reversible steps]
  definition: 'A step in solving that another legal step can undo, such as adding the same expression to both sides or multiplying both sides by a nonzero number. Reversible steps keep the solution set the same.'
  topic: Equivalence and extraneous solutions
- term: radical equation
  aliases: [radical equations]
  definition: 'An equation with the variable under a root, such as $\sqrt{x + 6} = x$. It is usually solved by isolating the root and squaring both sides, then checking every candidate.'
  topic: Equivalence and extraneous solutions
- term: extraneous solution
  aliases: [extraneous solutions, extraneous root]
  definition: 'A number produced by the solving process (for example, after squaring both sides) that does not satisfy the original equation.'
  topic: Equivalence and extraneous solutions
- term: mathematical model
  aliases: [mathematical models]
  definition: 'A description of a real situation in mathematical terms, such as an equation, function, table or graph, simple enough to work with and accurate enough to answer a question.'
  topic: The modeling cycle
- term: modeling cycle
  definition: 'The process of building a model: identify the problem, formulate, compute, interpret, validate, and then either revise the model or report the answer.'
  topic: The modeling cycle
- term: assumption
  aliases: [assumptions]
  definition: 'A simplification accepted when building a model, such as "the room temperature stays at 20 °C." A model''s answer is only as good as its assumptions.'
  topic: The modeling cycle
- term: dimensional analysis
  aliases: [unit analysis]
  definition: 'Using units to set up or check a calculation: only quantities with the same units can be added or set equal, and units multiply and cancel like variables.'
  topic: The modeling cycle
- term: conversion factor
  aliases: [conversion factors]
  definition: 'A fraction equal to 1, such as $\tfrac{5280 \text{ ft}}{1 \text{ mi}}$, used to change units by multiplying so that the unwanted unit cancels.'
  topic: The modeling cycle
- term: Fermi estimate
  aliases: [Fermi estimates, Fermi problem]
  definition: 'An estimate built from a chain of stated, reasonable assumptions, named after the physicist Enrico Fermi. It aims for the right size of answer, reported as a range.'
  topic: The modeling cycle
- term: Newton's law of cooling
  definition: 'The model in which the difference between an object''s temperature and its surroundings shrinks by the same factor in equal times, giving $T = L + a \cdot b^t$ with $L$ the surrounding temperature. It is an approximation.'
  topic: The modeling cycle
- term: recursive model
  aliases: [recursive models]
  definition: 'A model given by a starting value and a rule for each step from the one before, such as $a_n = r\,a_{n-1} + d$: multiply by $r$, then add $d$.'
  topic: Recursive models
- term: equilibrium
  aliases: [equilibrium value, equilibria]
  definition: 'A value that a recursive rule leaves unchanged. For $a_n = r\,a_{n-1} + d$ with $r \ne 1$, it solves $E = rE + d$, so $E = \dfrac{d}{1 - r}$.'
  topic: Recursive models
- term: stable equilibrium
  definition: 'An equilibrium that the terms approach from any starting value. For $a_n = r\,a_{n-1} + d$ this happens when $0 < r < 1$.'
  topic: Recursive models
- term: unstable equilibrium
  definition: 'An equilibrium that the terms move away from unless they start exactly at it. For $a_n = r\,a_{n-1} + d$ this happens when $r > 1$.'
  topic: Recursive models
