# Round 2 drills for alg-m2 honors lessons
- id: alg-m2-r2-abs-eq-var
  title: Absolute value equal to a variable expression
  topic: Absolute value by cases
  vars:
    a: {min: -12, max: 12}
    b: {min: 2, max: 6}
  where: ['a != 0']
  calc:
    c1: a/(b - 1)
    c2: -a/(b + 1)
    ans: if(a > 0, c1, c2)
    bad: if(a > 0, c2, c1)
  prompt: 'Solve $|x {a:signed}| = {b}x$. Check for extraneous solutions, then enter the solution as an integer or exact fraction.'
  answers:
    - {name: ans, kind: fraction, lowestTerms: true, label: '$x =$'}
  solution: |-
    Split: $x {a:signed} = {b}x$ gives $x = {c1:texfrac}$, and $x {a:signed} = -{b}x$ gives $x = {c2:texfrac}$.
    The right side ${b}x$ equals a distance, so it must be at least 0, which needs $x \ge 0$. The candidate ${bad:texfrac}$ is negative, so it is extraneous (the left side is positive there, the right side negative).
    The solution is $x =$ **${ans:texfrac}$**.

- id: alg-m2-r2-sum-distances
  title: Sum of two absolute values
  topic: Absolute value by cases
  vars:
    p: {min: -9, max: 6}
    d: {min: 1, max: 8}
    ov: {min: 1, max: 6}
  calc:
    q: p + d
    s: d + 2*ov
    np: -p
    nq: -q
    pq: p + q
    npq: -(p + q)
    lo: p - ov
    hi: q + ov
  where: ['p != 0', 'q != 0', 'p + q != 0']
  prompt: 'Solve $|x {np:signed}| + |x {nq:signed}| = {s}$. Enter both solutions, smaller first.'
  answers:
    - {name: lo, label: 'Smaller'}
    - {name: hi, label: 'Larger'}
  solution: |-
    The critical values are {p} and {q}, which split the line into three regions.
    For $x < {p}$, both insides are negative: the sum is $-2x {pq:signed}$. Setting $-2x {pq:signed} = {s}$ gives $x = {lo}$, which is in this region.
    For ${p} \le x < {q}$, the sum is always ${q} - ({p}) = {d}$, which is not {s}, so there are no solutions here.
    For $x \ge {q}$, the sum is $2x {npq:signed}$. Setting it equal to {s} gives $x = {hi}$, which is in this region.
    Solutions: **{lo}** and **{hi}**. (Distance check: each is {ov} beyond the nearer critical value, and ${d} + 2({ov}) = {s}$.)

- id: alg-m2-r2-interval-to-abs
  title: Interval to absolute value inequality
  topic: Tolerance and error
  vars:
    a: {min: -12, max: 10}
    w: {min: 1, max: 15}
  calc:
    b: a + w
    m: (a + b)/2
    h: w/2
    nm: -m
  where: ['a + b != 0']
  prompt: 'Write ${a} \le x \le {b}$ in the form $|x - m| \le h$. Enter $m$ and $h$.'
  answers:
    - {name: m, tolerance: 0.001, label: '$m =$'}
    - {name: h, tolerance: 0.001, label: '$h =$'}
  solution: |-
    The midpoint is $m = \dfrac{ {a} + ({b}) }{2} =$ **{m}**, and the half-width is $h = \dfrac{ {b} - ({a}) }{2} =$ **{h}**.
    So the interval is $|x {nm:signed}| \le {h}$.

- id: alg-m2-r2-error-bound
  title: Error through a linear formula
  topic: Tolerance and error
  vars:
    k: {min: -9, max: 9}
    x0: {min: 1, max: 20}
    b: {min: -30, max: 30}
    delta: {choices: [0.05, 0.1, 0.2, 0.5]}
    del2: {choices: [0.002, 0.005, 0.01, 0.02]}
  where: ['abs(k) >= 2', 'b != 0', 'y0 != 0']
  calc:
    y0: k*x0 + b
    ny0: -(k*x0 + b)
    ak: abs(k)
    err: round(abs(k)*delta, 6)
    eps: round(abs(k)*del2, 6)
  prompt: 'A quantity is computed as $y = {k}x {b:signed}$. (a) If $x$ is measured as {x0} with an error of at most {delta:num4}, what is the largest possible error in $y$? (b) How close to {x0} must $x$ be to guarantee that $y$ is within {eps:num4} of {y0}?'
  answers:
    - {name: err, tolerance: 0.0001, label: '(a) Largest error in $y$'}
    - {name: del2, tolerance: 0.00001, label: '(b) $x$ within'}
  solution: |-
    Near $x = {x0}$, $y = {y0}$, and $|y {ny0:signed}| = |{k}(x - {x0})| = {ak}\,|x - {x0}|$.
    (a) With $|x - {x0}| \le {delta:num4}$: the error in $y$ is at most ${ak} \times {delta:num4} =$ **{err:num4}**.
    (b) Need ${ak}\,|x - {x0}| \le {eps:num4}$, so $|x - {x0}| \le {eps:num4} \div {ak} =$ **{del2:num4}**.
