# Functions and linear functions drills
- id: alg-d-eval-function
  title: Evaluate a function
  topic: Functions
  vars:
    a: {min: -3, max: 3}
    b: {min: -6, max: 6}
    c: {min: -9, max: 9}
    p: {min: -4, max: 4}
  funcs:
    f(x): a*x^2 + b*x + c
  calc:
    t1: a*p^2
    t2: b*p
    val: f(p)
    vx: -b/(2*a)
    vy: f(vx)
    ylo: min(-10, val - 3, vy - 3)
    yhi: max(10, val + 3, vy + 3)
    sw: sqrt((yhi - ylo)/abs(a))
    xa: max(-6, vx - sw)
    xb: min(6, vx + sw)
  where: ['a != 0', 'b != 0', 'c != 0', 'p != 0']
  prompt: 'Let $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$. Find $f({p})$.'
  figure:
    type: plot
    x: [-6, 6]
    y: [ylo, yhi]
    functions:
      - {f: f, from: xa, to: xb}
    points:
      - {at: [p, val], label: '({p}, ?)'}
  answers:
    - {name: val, label: '$f({p}) =$'}
  solution: |-
    Replace every $x$ with $({p})$: $f({p}) = {a}({p})^2 + ({b})({p}) + ({c})$.
    That is ${t1} + ({t2}) + ({c}) =$ **{val}**.

- id: alg-d-function-expr
  title: Evaluate a function at an expression
  topic: Functions
  vars:
    a: {min: -3, max: 4}
    b: {min: -6, max: 6}
    c: {min: -9, max: 9}
    k: {min: -4, max: 4}
  calc:
    c1: 2*a*k + b
    c0: a*k^2 + b*k + c
    tk: 2*k
    k2: k^2
  where: ['a != 0', 'b != 0', 'c != 0', 'k != 0', 'c1 != 0', 'c0 != 0']
  prompt: 'Let $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$. Find $f(x {k:signed})$ and simplify.'
  answers:
    - kind: expression
      expression: a*(x + k)^2 + b*(x + k) + c
      variables: [x]
      label: '$f(x {k:signed}) =$'
      show: '${a:coef}x^2 {c1:signedcoef}x {c0:signed}$'
  solution: |-
    Replace every $x$ with $(x {k:signed})$: ${a}(x {k:signed})^2 + ({b})(x {k:signed}) + ({c})$.
    Expand $(x {k:signed})^2 = x^2 {tk:signedcoef}x + {k2}$, distribute, and combine like terms:
    **${a:coef}x^2 {c1:signedcoef}x {c0:signed}$**.

- id: alg-d-read-graph
  title: Read a function value from a graph
  topic: Graphs of functions
  vars:
    a: {choices: [1, -1, 0.5, -0.5]}
    h: {min: -3, max: 3}
    k: {min: -4, max: 4}
    p: {min: -5, max: 5}
  funcs:
    f(x): a*(x - h)^2 + k
  calc:
    val: f(p)
    sw: sqrt(30/abs(a))
    xa: max(-7, h - sw)
    xb: min(7, h + sw)
  where: ['val == round(val)', 'abs(val) <= 8', 'p != h']
  prompt: 'The graph shows $y = f(x)$. Use it to find $f({p})$.'
  figure:
    type: plot
    x: [-7, 7]
    y: [-9, 9]
    functions:
      - {f: f, from: xa, to: xb}
    segments:
      - {from: [p, 0], to: [p, val], dashed: true}
  answers:
    - {name: val, label: '$f({p}) =$'}
  solution: |-
    Go to $x = {p}$ on the horizontal axis and move vertically to the curve. The curve is at height **{val}** there, so $f({p}) = {val}$.

- id: alg-d-domain-sqrt
  title: Domain of a square root function
  topic: Domain and range
  vars:
    wd: {choices: [{label: 'smallest', value: 1}, {label: 'largest', value: -1}]}
    aa: {min: 1, max: 6}
    b: {min: -15, max: 15}
  calc:
    a: wd*aa
    nb: -b
    bnd: -b/a
  where: ['b != 0']
  prompt: 'The domain of $f(x) = \sqrt{{a:coef}x {b:signed}}$ is an interval with one endpoint. What is the {wd} number in the domain? (Exact fraction.)'
  answers:
    - {name: bnd, kind: fraction, lowestTerms: true, label: 'Endpoint'}
  solution: |-
    The radicand must be nonnegative: ${a:coef}x {b:signed} \ge 0$, so ${a:coef}x \ge {nb}$.
    Divide by {a} to isolate $x$ (a negative divisor reverses the symbol). The boundary is $x = {bnd:texfrac}$ and the domain runs away from it in one direction, so the {wd} allowed input is **${bnd:texfrac}$**.

- id: alg-d-slope-two-points
  title: Slope through two points
  topic: Slope
  vars:
    x1: {min: -8, max: 8}
    y1: {min: -8, max: 8}
    x2: {min: -8, max: 8}
    y2: {min: -8, max: 8}
  calc:
    dy: y2 - y1
    dx: x2 - x1
    m: (y2 - y1)/(x2 - x1)
  where: ['x1 != x2', 'y1 != y2']
  prompt: 'Find the slope of the line through $({x1}, {y1})$ and $({x2}, {y2})$. Give an exact fraction.'
  answers:
    - {name: m, kind: fraction, lowestTerms: true, label: '$m =$'}
  solution: |-
    $m = \dfrac{y_2 - y_1}{x_2 - x_1} = \dfrac{{y2} - ({y1})}{{x2} - ({x1})} = \dfrac{{dy}}{{dx}} =$ **${m:texfrac}$**.

- id: alg-d-slope-graph
  title: Slope from a graph
  topic: Slope
  vars:
    rr: {min: -5, max: 5}
    rn: {min: 1, max: 5}
    x1: {min: -6, max: 0}
    y1: {min: -4, max: 4}
  calc:
    x2: x1 + rn
    y2: y1 + rr
    m: rr/rn
    xa: x1 - 20/abs(rr/rn)
    xb: x1 + 20/abs(rr/rn)
  where: ['rr != 0', 'gcd(rr, rn) == 1', 'abs(y2) <= 8']
  funcs:
    L(x): y1 + m*(x - x1)
  prompt: 'Find the slope of the line shown. Both marked points sit on grid intersections. (Exact fraction.)'
  figure:
    type: plot
    x: [-8, 8]
    y: [-8, 8]
    equal: true
    functions:
      - {f: L, from: xa, to: xb}
    points:
      - {at: [x1, y1]}
      - {at: [x2, y2]}
  answers:
    - {name: m, kind: fraction, lowestTerms: true, label: '$m =$'}
  solution: |-
    The marked points are $({x1}, {y1})$ and $({x2}, {y2})$. From the first to the second the run is {rn} and the rise is {rr}.
    Slope $= \dfrac{\text{rise}}{\text{run}} = \dfrac{{rr}}{{rn}} =$ **${m:texfrac}$**.

- id: alg-d-line-point-slope
  title: Line from a point and a slope
  topic: Equations of lines
  vars:
    m: {min: -6, max: 6}
    x1: {min: -6, max: 6}
    y1: {min: -9, max: 9}
  calc:
    b: y1 - m*x1
    nx1: -x1
    ny1: -y1
    nmx1: -m*x1
  where: ['m != 0', 'b != 0', 'x1 != 0', 'y1 != 0']
  prompt: 'Write the equation of the line through $({x1}, {y1})$ with slope {m}, in the form $y = mx + b$.'
  answers:
    - kind: expression
      expression: m*x + b
      variables: [x]
      label: '$y =$'
      show: '${m:coef}x {b:signed}$'
  solution: |-
    Point-slope form: $y {ny1:signed} = {m}(x {nx1:signed})$.
    Distribute: $y {ny1:signed} = {m:coef}x {nmx1:signed}$.
    Add {y1} to both sides: **$y = {m:coef}x {b:signed}$**.

- id: alg-d-line-two-points
  title: Line through two points
  topic: Equations of lines
  vars:
    p: {min: -4, max: 4}
    q: {min: 1, max: 4}
    b: {min: -6, max: 6}
    s1: {min: -2, max: 1}
    s2: {min: 1, max: 3}
  calc:
    m: p/q
    x1: q*s1
    x2: q*(s1 + s2)
    y1: p*s1 + b
    y2: p*(s1 + s2) + b
    dy: y2 - y1
    dx: x2 - x1
  where: ['p != 0', 'b != 0', 'gcd(p, q) == 1', 'abs(p) != q']
  prompt: 'Write the equation of the line through $({x1}, {y1})$ and $({x2}, {y2})$ in the form $y = mx + b$.'
  answers:
    - kind: expression
      expression: p/q*x + b
      variables: [x]
      label: '$y =$'
      show: '${m:texfrac}x {b:signed}$'
  solution: |-
    Slope: $m = \dfrac{{y2} - ({y1})}{{x2} - ({x1})} = \dfrac{{dy}}{{dx}} = {m:texfrac}$.
    Then $b = y_1 - m x_1 = {y1} - \left({m:texfrac}\right)({x1}) = {b}$. So **$y = {m:texfrac}x {b:signed}$**.

- id: alg-d-intercepts
  title: Intercepts of a line in standard form
  topic: Equations of lines
  vars:
    A: {min: 1, max: 9}
    B: {min: -9, max: 9}
    C: {min: -24, max: 24}
  calc:
    xi: C/A
    yi: C/B
    xa: (C - 40*B)/A
    xb: (C + 40*B)/A
    xl: max(-11, min(xa, xb))
    xr: min(11, max(xa, xb))
  funcs:
    L(x): (C - A*x)/B
  where: ['B != 0', 'C != 0', 'gcd(A, abs(B)) == 1', 'abs(xi) <= 10', 'abs(yi) <= 10']
  prompt: 'Find the $x$- and $y$-intercepts of ${A:coef}x {B:signedcoef}y = {C}$. Give each as the nonzero coordinate (exact fraction).'
  figure:
    type: plot
    x: [-11, 11]
    y: [-11, 11]
    functions:
      - {f: L, from: xl, to: xr}
  answers:
    - {name: xi, kind: fraction, lowestTerms: true, label: '$x$-intercept'}
    - {name: yi, kind: fraction, lowestTerms: true, label: '$y$-intercept'}
  solution: |-
    Set $y = 0$: ${A:coef}x = {C}$, so the $x$-intercept is **${xi:texfrac}$**.
    Set $x = 0$: ${B:coef}y = {C}$, so the $y$-intercept is **${yi:texfrac}$**.

- id: alg-d-perp-line
  title: Perpendicular line through a point
  topic: Parallel and perpendicular
  vars:
    p: {min: -4, max: 4}
    q: {min: 1, max: 4}
    c: {min: -6, max: 6}
    s: {min: -2, max: 2}
    y1: {min: -6, max: 6}
  calc:
    m: p/q
    pm: -q/p
    x1: p*s
    b: y1 + q*s
  where: ['p != 0', 'gcd(abs(p), q) == 1', 'abs(p) != q', 'c != 0', 'b != 0', 's != 0']
  prompt: 'Write the equation of the line through $({x1}, {y1})$ that is perpendicular to $y = {m:texfrac}x {c:signed}$. Use the form $y = mx + b$.'
  answers:
    - kind: expression
      expression: -q/p*x + b
      variables: [x]
      label: '$y =$'
      show: '${pm:texfrac}x {b:signed}$'
  solution: |-
    The perpendicular slope is the negative reciprocal of ${m:texfrac}$, which is ${pm:texfrac}$.
    Then $b = y_1 - m x_1 = {y1} - \left({pm:texfrac}\right)({x1}) = {b}$. So **$y = {pm:texfrac}x {b:signed}$**.

- id: alg-d-linear-model
  title: Build a linear cost model
  topic: Linear models
  vars:
    fee: {min: 10, max: 80, step: 5}
    rate: {min: 1.5, max: 12, step: 0.5}
    n1: {min: 5, max: 30}
    n2: {min: 35, max: 120}
  calc:
    c1: fee + rate*n1
    c2: fee + rate*n2
    dc: c2 - c1
    dn: n2 - n1
  prompt: 'A print shop charges a setup fee plus a fixed price per poster. An order of {n1} posters costs {c1:money}, and an order of {n2} posters costs {c2:money}. Find the price per poster and the setup fee.'
  answers:
    - {name: rate, label: 'Price per poster (dollars)', format: money}
    - {name: fee, label: 'Setup fee (dollars)', format: money}
  solution: |-
    The price per poster is the slope: (cost change) ÷ (poster change) = {dc} ÷ {dn} = **{rate:money}**.
    The fee is what's left of the first order: {c1:money} − {n1} × {rate:money} = **{fee:money}**.
