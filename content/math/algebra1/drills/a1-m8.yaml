# Data and statistics
- id: a1-d-mean-median
  title: Mean and median
  topic: Center and spread
  vars:
    s1: {min: 2, max: 20}
    g1: {min: 0, max: 8}
    g2: {min: 1, max: 8}
    g3: {min: 0, max: 8}
    g4: {min: 1, max: 8}
    g5: {min: 0, max: 8}
    g6: {min: 1, max: 15}
  calc:
    s2: s1 + g1
    s3: s2 + g2
    s4: s3 + g3
    s5: s4 + g4
    s6: s5 + g5
    s7: s6 + g6
    tot: s1 + s2 + s3 + s4 + s5 + s6 + s7
    mn: round(tot/7, 2)
    md: s4
  prompt: 'Find the mean (to 2 decimal places) and the median of these 7 values: {s5}, {s2}, {s7}, {s1}, {s4}, {s6}, {s3}.'
  answers:
    - {name: mn, label: 'Mean', tolerance: 0.01}
    - {name: md, label: 'Median'}
  solution: |-
    Mean: the values add to {tot}, and $\dfrac{{tot}}{7} \approx$ **{mn}**.
    Median: sort them, {s1}, {s2}, {s3}, {s4}, {s5}, {s6}, {s7}. The middle (4th) value is **{md}**.

- id: a1-d-five-number
  title: Quartiles, IQR, and outlier fence
  topic: Center and spread
  vars:
    s1: {min: 10, max: 30}
    g1: {min: 1, max: 6}
    g2: {min: 0, max: 6}
    g3: {min: 1, max: 6}
    g4: {min: 0, max: 6}
    g5: {min: 1, max: 6}
    g6: {min: 0, max: 6}
    g7: {min: 1, max: 6}
    g8: {min: 0, max: 6}
    g9: {min: 1, max: 40}
  calc:
    s2: s1 + g1
    s3: s2 + g2
    s4: s3 + g3
    s5: s4 + g4
    s6: s5 + g5
    s7: s6 + g6
    s8: s7 + g7
    s9: s8 + g8
    s10: s9 + g9
    q1: s3
    q3: s8
    med: (s5 + s6)/2
    iqr: s8 - s3
    step: 1.5*(s8 - s3)
    upper: s8 + 1.5*(s8 - s3)
    chk1: quartile(1, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10)
    chk3: quartile(3, s1, s2, s3, s4, s5, s6, s7, s8, s9, s10)
  where: ['chk1 == q1', 'chk3 == q3']
  prompt: 'For the 10 values {s6}, {s1}, {s9}, {s3}, {s10}, {s5}, {s2}, {s8}, {s4}, {s7}, find $Q_1$, $Q_3$, the IQR, and the upper outlier fence $Q_3 + 1.5\,\text{IQR}$.'
  answers:
    - {name: q1, label: '$Q_1$'}
    - {name: q3, label: '$Q_3$'}
    - {name: iqr, label: 'IQR'}
    - {name: upper, label: 'Upper fence'}
  solution: |-
    Sorted: {s1}, {s2}, {s3}, {s4}, {s5}, {s6}, {s7}, {s8}, {s9}, {s10}. The median is $\dfrac{{s5} + {s6}}{2} = {med}$.
    Lower half {s1}, {s2}, {s3}, {s4}, {s5}: $Q_1 =$ **{q1}**. Upper half {s6}, {s7}, {s8}, {s9}, {s10}: $Q_3 =$ **{q3}**.
    IQR $= {q3} - {q1} =$ **{iqr}**. Upper fence $= {q3} + 1.5({iqr}) = {q3} + {step} =$ **{upper}**.

- id: a1-d-std-dev
  title: Standard deviation by hand
  topic: Center and spread
  vars:
    v1: {min: 1, max: 20}
    v2: {min: 1, max: 20}
    v3: {min: 1, max: 20}
    v4: {min: 1, max: 20}
    v5: {min: 1, max: 20}
  calc:
    tot: v1 + v2 + v3 + v4 + v5
    xbar: (v1 + v2 + v3 + v4 + v5)/5
    d1: v1 - xbar
    d2: v2 - xbar
    d3: v3 - xbar
    d4: v4 - xbar
    d5: v5 - xbar
    ss: d1^2 + d2^2 + d3^2 + d4^2 + d5^2
    var: ss/5
    sd: round(pstdev(v1, v2, v3, v4, v5), 2)
  where: ['mod(tot, 5) == 0', 'ss > 0']
  prompt: 'Find the mean and the population standard deviation $\sigma$ (divide by $n$; round to 2 decimal places) of {v1}, {v2}, {v3}, {v4}, {v5}.'
  answers:
    - {name: xbar, label: 'Mean'}
    - {name: sd, label: '$\sigma$', tolerance: 0.01}
  solution: |-
    Mean: $\dfrac{{tot}}{5} =$ **{xbar}**.
    Deviations from the mean: {d1}, {d2}, {d3}, {d4}, {d5}. Their squares add to {ss}.
    Average of the squares: $\dfrac{{ss}}{5} = {var}$. Square root: $\sigma = \sqrt{{var}} \approx$ **{sd}**.

- id: a1-d-two-way-freq
  title: Joint, marginal, and conditional relative frequency
  topic: Two-way tables
  vars:
    a: {min: 10, max: 90}
    b: {min: 10, max: 90}
    c: {min: 10, max: 90}
    d: {min: 10, max: 90}
  calc:
    r1: a + b
    r2: c + d
    k1: a + c
    k2: b + d
    N: a + b + c + d
    joint: round(100*a/N, 1)
    marg: round(100*k1/N, 1)
    cond: round(100*a/r1, 1)
  prompt: |-
    Students were asked whether they plan to attend the spring dance.

    | | Yes | No | Total |
    |---|---|---|---|
    | Juniors | {a} | {b} | {r1} |
    | Seniors | {c} | {d} | {r2} |
    | Total | {k1} | {k2} | {N} |

    As percents (1 decimal place), find: the percent of all students who are juniors planning to attend; the percent of all students planning to attend; and the percent of juniors who plan to attend.
  answers:
    - {name: joint, label: 'Juniors and yes, of all (%)', tolerance: 0.05}
    - {name: marg, label: 'Yes, of all (%)', tolerance: 0.05}
    - {name: cond, label: 'Yes, of juniors (%)', tolerance: 0.05}
  solution: |-
    Joint (divide by the grand total): $\dfrac{{a}}{{N}} \approx$ **{joint}%**.
    Marginal (column total over grand total): $\dfrac{{k1}}{{N}} \approx$ **{marg}%**.
    Conditional (restrict to juniors, divide by their row total): $\dfrac{{a}}{{r1}} \approx$ **{cond}%**.

- id: a1-d-two-way-complete
  title: Complete a two-way table
  topic: Two-way tables
  vars:
    a: {min: 10, max: 60}
    b: {min: 10, max: 60}
    c: {min: 10, max: 60}
    d: {min: 10, max: 60}
  calc:
    r1: a + b
    r2: c + d
    N: a + b + c + d
    k1: a + c
    cond: round(100*c/(c + d), 1)
  prompt: 'A club surveyed {N} members, {r1} of them adults and the rest teens. {a} adults and {c} teens said they want a summer trip; everyone else said no. How many teens said no, and what percent of teens want the trip (1 decimal place)?'
  answers:
    - {name: d, label: 'Teens who said no'}
    - {name: cond, label: 'Teens wanting the trip (%)', tolerance: 0.05}
  solution: |-
    Teens: ${N} - {r1} = {r2}$. Teens who said no: ${r2} - {c} =$ **{d}**.
    Percent of teens who want the trip (divide by the teen total, not by {N}): $\dfrac{{c}}{{r2}} \approx$ **{cond}%**.

- id: a1-d-fit-two-points
  title: Line of fit through two points
  topic: Scatter plots
  vars:
    m: {choices: [-3, -2, -1.5, -0.5, 0.5, 1.5, 2, 2.5, 3, 4]}
    b: {min: 10, max: 60}
    x1: {min: 0, max: 6, step: 2}
    gap: {min: 4, max: 10, step: 2}
    xp: {min: 11, max: 20}
  calc:
    x2: x1 + gap
    y1: m*x1 + b
    y2: m*(x1 + gap) + b
    rise: m*gap
    yp: m*xp + b
    mx1: m*x1 + 0
  where: ['y1 > 0', 'y2 > 0', 'yp > 0']
  prompt: 'A line of fit for a scatter plot is drawn through the data points $({x1}, {y1})$ and $({x2}, {y2})$. Write the line as $\hat y = mx + b$, and use it to predict $y$ when $x = {xp}$.'
  figure:
    type: plot
    x: [0, 22]
    y: [0, 'max(y1, y2, yp) + 10']
    functions:
      - {f: 'm*x + b', dashed: true}
    points:
      - {at: [x1, y1], label: '({x1}, {y1})'}
      - {at: [x2, y2], label: '({x2}, {y2})'}
  answers:
    - {name: m, label: 'Slope $m$'}
    - {name: b, label: 'Intercept $b$'}
    - {name: yp, label: 'Predicted $\hat y$ at $x = {xp}$'}
  solution: |-
    Slope: $m = \dfrac{{y2} - {y1}}{{x2} - {x1}} = \dfrac{{rise}}{{gap}} =$ **{m}**.
    Intercept: ${y1} = {m}({x1}) + b$, so $b = {y1} - ({mx1}) =$ **{b}**.
    Prediction: $\hat y = {m}({xp}) + {b} =$ **{yp}**.

- id: a1-d-predict-residual
  title: Prediction and residual
  topic: Correlation and residuals
  vars:
    m10: {min: 12, max: 60}
    b: {min: 20, max: 60}
    x0: {min: 2, max: 12}
    e10: {min: -60, max: 60, step: 5}
  calc:
    m: m10/10
    yhat: m10*x0/10 + b
    e: e10/10
    y0: m10*x0/10 + b + e10/10
  where: ['e10 != 0']
  prompt: 'A line of best fit is $\hat y = {m}x + {b}$. One data point is $({x0}, {y0})$. Find the predicted value at $x = {x0}$ and the residual for this point.'
  figure:
    type: plot
    x: [0, 14]
    y: [0, '6*14 + 70']
    functions:
      - {f: 'm*x + b', dashed: true}
    points:
      - {at: [x0, y0], label: '({x0}, {y0})'}
    segments:
      - {from: [x0, yhat], to: [x0, y0]}
  answers:
    - {name: yhat, label: 'Predicted $\hat y$', tolerance: 0.001}
    - {name: e, label: 'Residual', tolerance: 0.001}
  solution: |-
    Predicted: $\hat y = {m}({x0}) + {b} =$ **{yhat}**.
    Residual = actual − predicted = ${y0} - {yhat} =$ **{e}**. (Positive means the point is above the line; negative, below.)

- id: a1-d-fit-solve-x
  title: Use a line of fit in reverse
  topic: Scatter plots
  vars:
    m: {choices: [2, 2.5, 4, 5, 8]}
    b: {min: 30, max: 60}
    xt: {min: 2, max: 9}
  calc:
    target: m*xt + b
    diff: m*xt
  prompt: 'A line of best fit for test scores is $\hat y = {m}x + {b}$, where $x$ is hours studied. According to the line, how many hours of study go with a predicted score of {target}?'
  answers:
    - {name: xt, label: 'Hours'}
  solution: |-
    Set the prediction equal to {target} and solve: ${m}x + {b} = {target}$, so ${m}x = {diff}$ and $x = \dfrac{{diff}}{{m}} =$ **{xt}** hours.
