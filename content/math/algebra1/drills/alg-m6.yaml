# Quadratic equations and functions drills
- id: alg-d-factor-monic
  title: Factor x² + bx + c
  topic: Factoring
  vars:
    m: {min: -9, max: 9}
    n: {min: -9, max: 9}
  calc:
    b: m + n
    c: m*n
  where: ['m != 0', 'n != 0', 'b != 0', 'm <= n']
  prompt: 'Factor $x^2 {b:signedcoef}x {c:signed}$.'
  answers:
    - kind: expression
      expression: (x + m)*(x + n)
      variables: [x]
      label: 'Factored'
      show: '$(x {m:signed})(x {n:signed})$'
  solution: |-
    Find two integers with product {c} and sum {b}: they are {m} and {n}.
    So $x^2 {b:signedcoef}x {c:signed} =$ **$(x {m:signed})(x {n:signed})$**.

- id: alg-d-zero-product
  title: Solve by factoring (ac method)
  topic: Quadratic equations
  vars:
    p: {min: 1, max: 4}
    q: {min: -7, max: 7}
    r: {min: 1, max: 4}
    s: {min: -7, max: 7}
  calc:
    A: p*r
    B: p*s + q*r
    C: q*s
    x1: -q/p
    x2: -s/r
    lo: min(x1, x2)
    hi: max(x1, x2)
  where: ['q != 0', 's != 0', 'B != 0', 'gcd(p, abs(q)) == 1', 'gcd(r, abs(s)) == 1', 'A > 1', 'x1 != x2']
  prompt: 'Solve $\;{A}x^2 {B:signedcoef}x {C:signed} = 0$ by factoring. Give both solutions as exact fractions, smaller first.'
  answers:
    - {name: lo, kind: fraction, lowestTerms: true, label: 'Smaller'}
    - {name: hi, kind: fraction, lowestTerms: true, label: 'Larger'}
  solution: |-
    Factor: $({p:coef}x {q:signed})({r:coef}x {s:signed}) = 0$.
    Set each factor to zero: $x = {x1:texfrac}$ or $x = {x2:texfrac}$. Smaller first: **${lo:texfrac}$**, **${hi:texfrac}$**.

- id: alg-d-quad-factor-solve
  title: Rearrange and solve by factoring
  topic: Quadratic equations
  vars:
    m: {min: -9, max: 9}
    n: {min: -9, max: 9}
    k: {min: -12, max: 12}
  calc:
    b: -(m + n)
    c: m*n
    rhs: k - c
    nm: -m
    nn: -n
    lo: min(m, n)
    hi: max(m, n)
    nk: -k
  where: ['m < n', 'm != 0', 'n != 0', 'b != 0', 'k != 0', 'rhs != 0']
  prompt: 'Solve $\;x^2 {b:signedcoef}x {k:signed} = {rhs}$.'
  answers:
    - {name: lo, label: 'Smaller solution'}
    - {name: hi, label: 'Larger solution'}
  solution: |-
    Get 0 on one side: subtract $({rhs})$ from both sides to get $x^2 {b:signedcoef}x {c:signed} = 0$.
    Factor: $(x {nm:signed})(x {nn:signed}) = 0$, so $x =$ **{lo}** or $x =$ **{hi}**.

- id: alg-d-sqrt-property
  title: Square root property
  topic: Quadratic equations
  vars:
    a: {min: 1, max: 4}
    h: {min: -6, max: 6}
    sq: {min: 1, max: 7}
    k: {min: -10, max: 10}
  calc:
    r: a*sq^2 + k
    rk: r - k
    s2: sq^2
    lo: h - sq
    hi: h + sq
    nh: -h
  where: ['h != 0', 'k != 0']
  prompt: 'Solve $\;{a:coef}(x {nh:signed})^2 {k:signed} = {r}$.'
  answers:
    - {name: lo, label: 'Smaller solution'}
    - {name: hi, label: 'Larger solution'}
  solution: |-
    Isolate the square: ${a:coef}(x {nh:signed})^2 = {rk}$, so $(x {nh:signed})^2 = {s2}$.
    Square root property: $x {nh:signed} = \pm {sq}$, so $x = {h} \pm {sq}$: **{lo}** and **{hi}**.

- id: alg-d-complete-square
  title: Complete the square
  topic: Quadratic equations
  vars:
    b: {min: -11, max: 11}
    c: {min: -12, max: 12}
  calc:
    h: b/2
    hh: (b/2)^2
    k: c - (b/2)^2
  where: ['b != 0', 'c != 0']
  prompt: 'Write $x^2 {b:signedcoef}x {c:signed}$ in the form $(x + h)^2 + k$. Give $h$ and $k$ as exact fractions.'
  answers:
    - {name: h, kind: fraction, lowestTerms: true, label: '$h =$'}
    - {name: k, kind: fraction, lowestTerms: true, label: '$k =$'}
  solution: |-
    Half of {b} is ${h:texfrac}$, and its square is ${hh:texfrac}$. Add and subtract it:
    $x^2 {b:signedcoef}x + {hh:texfrac} - {hh:texfrac} {c:signed}$.
    The first three terms are $(x + h)^2$ with $h$ equal to half of {b}, and the leftover constant is $k = {c} - {hh:texfrac}$.
    So $h =$ **${h:texfrac}$** and $k =$ **${k:texfrac}$**.

- id: alg-d-quad-formula
  title: Use the quadratic formula
  topic: Quadratic formula
  vars:
    a: {choices: [1, 2, 3, -1, -2]}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
  calc:
    D: b^2 - 4*a*c
    r1: (-b + sqrt(D))/(2*a)
    r2: (-b - sqrt(D))/(2*a)
    lo: min(r1, r2)
    hi: max(r1, r2)
    nb: -b
    ta: 2*a
  where: ['D > 0', 'sqrt(D) != round(sqrt(D))', 'b != 0', 'c != 0']
  prompt: 'Solve $\;{a:coef}x^2 {b:signedcoef}x {c:signed} = 0$ with the quadratic formula. Give both solutions to 2 decimal places, smaller first.'
  answers:
    - {name: lo, label: 'Smaller', tolerance: 0.006, format: num2}
    - {name: hi, label: 'Larger', tolerance: 0.006, format: num2}
  solution: |-
    Here $a = {a}$, $b = {b}$, $c = {c}$, and $b^2 - 4ac = ({b})^2 - 4({a})({c}) = {D}$.
    $x = \dfrac{{nb} \pm \sqrt{{D}}}{{ta}}$, so $x \approx$ **{lo:num2}** and $x \approx$ **{hi:num2}**.

- id: alg-d-discriminant
  title: Discriminant and number of real roots
  topic: Discriminant
  vars:
    kind: {choices: [1, 1, 2]}
    a0: {min: -4, max: 5}
    b0: {min: -9, max: 9}
    c0: {min: -9, max: 9}
    p: {min: 1, max: 3}
    q: {min: -5, max: 5}
    k: {choices: [1, -1, 2]}
  calc:
    a: if(kind == 2, k*p^2, a0)
    b: if(kind == 2, 2*k*p*q, b0)
    c: if(kind == 2, k*q^2, c0)
    D: b^2 - 4*a*c
    n: if(D > 0, 2, if(D == 0, 1, 0))
    fac: 4*a*c
    bb: b^2
  where: ['a != 0', 'b != 0', 'c != 0']
  prompt: 'For $\;{a:coef}x^2 {b:signedcoef}x {c:signed} = 0$, find the discriminant and the number of real solutions.'
  answers:
    - {name: D, label: 'Discriminant'}
    - {name: n, label: 'Number of real solutions'}
  solution: |-
    $b^2 - 4ac = ({b})^2 - 4({a})({c}) = {bb:dp0} - ({fac:dp0}) = {D:dp0}$.
    Positive means two real solutions, zero means one, negative means none. Discriminant **{D}**; number of real solutions **{n}**.

- id: alg-d-vertex-standard
  title: Vertex from standard form
  topic: Quadratic functions
  vars:
    a: {choices: [1, 2, 3, -1, -2, -3]}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
  funcs:
    f(x): a*x^2 + b*x + c
  calc:
    h: -b/(2*a)
    k: f(-b/(2*a))
    ta: 2*a
    nb: -b
    ylo: if(a > 0, k - 2, k - 12)
    yhi: if(a > 0, k + 12, k + 2)
    sw: sqrt(12/abs(a))
    xa: h - sw
    xb: h + sw
  where: ['b != 0', 'c != 0']
  prompt: 'Find the vertex of $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$. Give exact fractions.'
  figure:
    type: plot
    x: [h - 6, h + 6]
    y: [ylo, yhi]
    functions:
      - {f: f, from: xa, to: xb}
  answers:
    - {name: h, kind: fraction, lowestTerms: true, label: 'Vertex $x$'}
    - {name: k, kind: fraction, lowestTerms: true, label: 'Vertex $y$'}
  solution: |-
    $h = \dfrac{-b}{2a} = \dfrac{{nb}}{{ta}} = {h:texfrac}$. Then $k = f\left({h:texfrac}\right) = {k:texfrac}$.
    The vertex is **$\left({h:texfrac}, {k:texfrac}\right)$**.

- id: alg-d-quad-from-graph
  title: Equation of a parabola from its graph
  topic: Quadratic functions
  vars:
    a: {choices: [-2, -1, 1, 2]}
    h: {min: -4, max: 4}
    k: {min: -5, max: 5}
    dx: {choices: [1, 2]}
  funcs:
    f(x): a*(x - h)^2 + k
  calc:
    px: h + dx
    py: f(h + dx)
    nh: -h
    sw: sqrt(14/abs(a))
    xa: h - sw
    xb: h + sw
    rise: py - k
    d2: dx^2
  where: ['abs(py) <= 9', 'h != 0', 'k != 0']
  prompt: 'The parabola shown has its vertex and one other point marked on grid points. Write its equation in the form $y = a(x - h)^2 + k$.'
  figure:
    type: plot
    x: [-8, 8]
    y: [-10, 10]
    functions:
      - {f: f, from: xa, to: xb}
    points:
      - {at: [h, k], label: '({h}, {k})'}
      - {at: [px, py], label: '({px}, {py})'}
  answers:
    - kind: expression
      expression: a*(x - h)^2 + k
      variables: [x]
      label: '$y =$'
      show: '${a:coef}(x {nh:signed})^2 {k:signed}$'
  solution: |-
    The vertex is $({h}, {k})$, so $y = a(x {nh:signed})^2 {k:signed}$.
    Substitute $({px}, {py})$: ${py} = a({dx})^2 {k:signed}$, so ${d2:coef}a = {rise}$ and $a = {a}$.
    **$y = {a:coef}(x {nh:signed})^2 {k:signed}$**.

- id: alg-d-quad-intercepts
  title: Intercepts of a parabola
  topic: Quadratic functions
  vars:
    a: {choices: [1, -1, 2]}
    r: {min: -6, max: 5}
    s: {min: -5, max: 6}
  funcs:
    f(x): a*(x - r)*(x - s)
  calc:
    B: -a*(r + s)
    nr: -r
    ns: -s
    C: a*r*s
    lo: min(r, s)
    hi: max(r, s)
    vx: (r + s)/2
    vy: f((r + s)/2)
    ylo: min(-3, vy - 2, C - 2)
    yhi: max(3, vy + 2, C + 2)
    sw: sqrt((yhi - ylo)/abs(a))
    xa: vx - sw
    xb: vx + sw
  where: ['r < s', 'B != 0', 'C != 0']
  prompt: 'Find the $x$-intercepts (smaller first) and the $y$-intercept of $y = {a:coef}x^2 {B:signedcoef}x {C:signed}$.'
  figure:
    type: plot
    x: [-8, 8]
    y: [ylo, yhi]
    functions:
      - {f: f, from: xa, to: xb}
  answers:
    - {name: lo, label: 'Smaller $x$-intercept'}
    - {name: hi, label: 'Larger $x$-intercept'}
    - {name: C, label: '$y$-intercept'}
  solution: |-
    Factor: $y = {a:coef}(x {nr:signed})(x {ns:signed})$, so the $x$-intercepts are **{lo}** and **{hi}**.
    At $x = 0$, $y = {C}$: the $y$-intercept is **{C}**.

- id: alg-d-projectile
  title: Maximum height of a projectile
  topic: Quadratic applications
  vars:
    v: {min: 16, max: 112, step: 8}
    h0: {min: 2, max: 60, step: 2}
  funcs:
    H(t): -16*t^2 + v*t + h0
  calc:
    tm: v/32
    hm: H(v/32)
  prompt: 'A ball is thrown upward from a height of {h0} ft at {v} ft/s, so $h(t) = -16t^2 + {v}t + {h0}$. When does it reach its maximum height, and what is that height?'
  answers:
    - {name: tm, label: 'Time (s)', tolerance: 0.006}
    - {name: hm, label: 'Max height (ft)', tolerance: 0.01}
  solution: |-
    The vertex is at $t = -\dfrac{b}{2a} = -\dfrac{{v}}{2(-16)} =$ **{tm}** s.
    Height there: $h({tm}) = -16({tm})^2 + {v}({tm}) + {h0} =$ **{hm}** ft.

- id: alg-d-fence-max
  title: Maximum area along a river
  topic: Quadratic applications
  vars:
    L: {min: 40, max: 600, step: 8}
  calc:
    x: L/4
    long: L/2
    A: L^2/8
  prompt: 'A farmer has {L} m of fence for a rectangular field along a straight river (no fence on the river side). What is the largest area she can enclose, and how long is the side parallel to the river?'
  answers:
    - {name: A, label: 'Max area (m²)', tolerance: 0.01}
    - {name: long, label: 'Side along river (m)'}
  solution: |-
    With $x$ = each side perpendicular to the river, the parallel side is ${L} - 2x$ and $A = x({L} - 2x) = -2x^2 + {L}x$.
    The vertex is at $x = \dfrac{{L}}{4} = {x}$, so the parallel side is **{long}** m and the maximum area is ${x} \times {long} =$ **{A}** m².

- id: alg-d-revenue-max
  title: Price that maximizes revenue
  topic: Quadratic applications
  vars:
    P: {min: 10, max: 40}
    N: {min: 300, max: 1200, step: 20}
    d: {min: 5, max: 30, step: 5}
  calc:
    ns: (N - d*P)/(2*d)
    price: P + (N - d*P)/(2*d)
    sold: N - d*(N - d*P)/(2*d)
    R: price*sold
  where: ['N - d*P > 0', 'ns == round(ns)']
  prompt: 'A club sells {N} tickets at {P:money0} each. For every $1 increase in price, it sells {d} fewer tickets. What price maximizes revenue, and what is the maximum revenue?'
  answers:
    - {name: price, label: 'Best price', format: money}
    - {name: R, label: 'Max revenue', format: money}
  solution: |-
    With $n$ one-dollar increases, revenue is $R(n) = ({P} + n)({N} - {d}n)$, a downward parabola.
    Its zeros are $n = -{P}$ and $n = {N}/{d}$; the vertex is halfway between, at $n = {ns}$.
    Best price: **{price:money}**, selling {sold} tickets, for revenue **{R:money}**.
