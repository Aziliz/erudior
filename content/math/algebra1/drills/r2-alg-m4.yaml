# Round 2 drills for alg-m4 (honors lessons: determinants and Cramer's rule; linear programming)
- id: alg-m4-r2-determinant
  title: Evaluate a 2 × 2 determinant
  topic: Determinants and Cramer's rule
  vars:
    a: {min: -9, max: 9}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    d: {min: -9, max: 9}
  where: ['a != 0', 'b != 0', 'c != 0', 'd != 0']
  calc:
    ad: a*d
    bc: b*c
    det: a*d - b*c
  prompt: 'Evaluate the determinant $\begin{vmatrix} {a} & {b} \\ {c} & {d} \end{vmatrix}$.'
  answer: det
  format: integer
  solution: |-
    Main diagonal product minus the other diagonal product: $({a})({d}) - ({b})({c}) = {ad} - ({bc}) =$ **{det}**.

- id: alg-m4-r2-cramer
  title: Solve a system by Cramer's rule
  topic: Determinants and Cramer's rule
  vars:
    a: {min: 1, max: 7}
    b: {min: -7, max: 7}
    c: {min: -7, max: 7}
    d: {min: -7, max: 7}
    xs: {min: -6, max: 6}
    ys: {min: -6, max: 6}
  where: ['b != 0', 'c != 0', 'd != 0', 'a*d - b*c != 0', 'abs(a*d - b*c) <= 40']
  calc:
    e: a*xs + b*ys
    f: c*xs + d*ys
    det: a*d - b*c
    dx: e*d - b*f
    dy: a*f - e*c
    ed: e*d
    bf: b*f
    af: a*f
    ec: e*c
    ad: a*d
    bc: b*c
  prompt: |-
    Solve by Cramer's rule. Give $D$, $D_x$ and $D_y$, then the solution.

    $$\begin{cases} {a:coef}x {b:signedcoef}y = {e} \\ {c:coef}x {d:signedcoef}y = {f} \end{cases}$$
  answers:
    - {name: det, label: '$D =$'}
    - {name: dx, label: '$D_x =$'}
    - {name: dy, label: '$D_y =$'}
    - {name: xs, label: '$x =$'}
    - {name: ys, label: '$y =$'}
  solution: |-
    $D = ({a})({d}) - ({b})({c}) = {ad} - ({bc}) =$ **{det}**.
    Replace the $x$-column with the constants: $D_x = ({e})({d}) - ({b})({f}) = {ed} - ({bf}) =$ **{dx}**.
    Replace the $y$-column: $D_y = ({a})({f}) - ({e})({c}) = {af} - ({ec}) =$ **{dy}**.
    So $x = D_x / D = {dx} / ({det}) =$ **{xs}** and $y = D_y / D = {dy} / ({det}) =$ **{ys}**.

- id: alg-m4-r2-singular-k
  title: When a system has no unique solution
  topic: Determinants and Cramer's rule
  vars:
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
    e: {min: -9, max: 9}
    f: {min: -9, max: 9}
  where: ['b != 0', 'c != 0', 'd != 0', 'b*c/d == round(b*c/d)']
  calc:
    bc: b*c
    kk: b*c/d
  prompt: 'For which value of $k$ does the system $\;kx {b:signedcoef}y = {e}$, $\;{c:coef}x {d:signedcoef}y = {f}\;$ fail to have exactly one solution?'
  answer: kk
  format: integer
  solution: |-
    The coefficient determinant is $D = k({d}) - ({b})({c}) = {d:coef}k - ({bc})$.
    There is exactly one solution unless $D = 0$: ${d:coef}k = {bc}$, so $k =$ **{kk}**.
    For that $k$ the lines have the same slope, so the system has no solution or infinitely many; $D_x$ and $D_y$ tell which.

- id: alg-m4-r2-lp-min
  title: Minimize cost over an unbounded region
  topic: Linear programming
  vars:
    x0: {min: 1, max: 6}
    y0: {min: 1, max: 6}
    a1: {min: 2, max: 5}
    b1: {min: 1, max: 2}
    a2: {min: 1, max: 2}
    b2: {min: 2, max: 5}
    p: {min: 1, max: 9}
    q: {min: 1, max: 9}
  where: ['a1 > b1', 'b2 > a2', '(a1*x0 + b1*y0)/b1 == round((a1*x0 + b1*y0)/b1)', '(a2*x0 + b2*y0)/a2 == round((a2*x0 + b2*y0)/a2)']
  calc:
    c1: a1*x0 + b1*y0
    c2: a2*x0 + b2*y0
    yi: c1/b1
    xi: c2/a2
    C1: q*yi
    C2: p*x0 + q*y0
    C3: p*xi
    best: min(C1, C2, C3)
    top: max(xi, yi) + 2
  prompt: 'Minimize $C = {p:coef}x {q:signedcoef}y$ subject to $x \ge 0$, $y \ge 0$, ${a1:coef}x {b1:signedcoef}y \ge {c1}$ and ${a2:coef}x {b2:signedcoef}y \ge {c2}$. What is the minimum value of $C$?'
  figure:
    type: plot
    x: [-1, top]
    y: [-1, top]
    polygons:
      - {points: [[0, top], [0, yi], [x0, y0], [xi, 0], [top, 0], [top, top]], fill: true}
  answers:
    - {name: best, label: 'Minimum $C$'}
  solution: |-
    The region is unbounded (it goes on up and to the right), but $C$ has positive coefficients and $x, y \ge 0$, so $C$ can't keep decreasing: the minimum is at a vertex.
    The vertices are $(0, {yi})$, $({x0}, {y0})$ (where the two slanted lines meet) and $({xi}, 0)$.
    $C$ there: ${C1}$, ${C2}$ and ${C3}$. The smallest is **{best}**. (There is no maximum.)

- id: alg-m4-r2-lp-range
  title: How far can a profit change? (sensitivity)
  topic: Linear programming
  vars:
    x0: {min: 1, max: 6}
    y0: {min: 1, max: 6}
    a1: {min: 2, max: 5}
    b1: {min: 1, max: 2}
    a2: {min: 1, max: 2}
    b2: {min: 2, max: 5}
    q: {min: 2, max: 30}
  where: ['a1 > b1', 'b2 > a2', 'q*a2/b2 == round(q*a2/b2)', 'q*a1/b1 == round(q*a1/b1)']
  calc:
    c1: a1*x0 + b1*y0
    c2: a2*x0 + b2*y0
    lo: q*a2/b2
    hi: q*a1/b1
    xi: c1/a1
    yi: c2/b2
    top: max(xi, yi) + 1
  prompt: 'The feasible region $x \ge 0$, $y \ge 0$, ${a1:coef}x {b1:signedcoef}y \le {c1}$, ${a2:coef}x {b2:signedcoef}y \le {c2}$ has a vertex at $({x0}, {y0})$. You want to maximize $P = px + {q}y$. For which values of $p$ is $({x0}, {y0})$ a best vertex? Give the smallest and the largest such $p$.'
  figure:
    type: plot
    x: [-1, top]
    y: [-1, top]
    polygons:
      - {points: [[0, 0], [xi, 0], [x0, y0], [0, yi]], fill: true}
    points:
      - {at: [x0, y0], label: '({x0}, {y0})'}
  answers:
    - {name: lo, label: 'Smallest $p$'}
    - {name: hi, label: 'Largest $p$'}
  solution: |-
    At $({x0}, {y0})$ two edges meet: one along ${a2:coef}x {b2:signedcoef}y = {c2}$, with slope $-\tfrac{{a2}}{{b2}}$, and one along ${a1:coef}x {b1:signedcoef}y = {c1}$, with slope $-\tfrac{{a1}}{{b1}}$.
    The level lines of $P$ have slope $-\tfrac{p}{{q}}$. The vertex is best when that slope lies between the edge slopes: $\tfrac{{a2}}{{b2}} \le \tfrac{p}{{q}} \le \tfrac{{a1}}{{b1}}$.
    Multiply by {q}: **{lo}** $\le p \le$ **{hi}**.
