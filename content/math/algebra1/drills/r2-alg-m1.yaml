# Round 2 drills: Foundations and linear equations (alg-m1), honors lessons
- id: alg-m1-r2-repeating-two
  title: Repeating decimal to fraction
  topic: Decimals and irrationality
  vars:
    n: {min: 10, max: 98}
  calc:
    g: gcd(n, 99)
    num: n/g
    den: 99/g
    r: n/99
  where: ['mod(n, 11) != 0']
  prompt: 'Write $0.\overline{{n}}$ as a fraction in lowest terms.'
  answers:
    - {name: r, kind: fraction, lowestTerms: true, label: 'Fraction'}
  solution: |-
    Let $x = 0.\overline{{n}}$. The block has 2 digits, so $100x = {n}.\overline{{n}}$.
    Subtract: $100x - x = {n}$, so $99x = {n}$ and $x = \dfrac{{n}}{99}$.
    The greatest common factor of {n} and 99 is {g}, so in lowest terms $x =$ **$\dfrac{{num}}{{den}}$**.

- id: alg-m1-r2-repeating-delayed
  title: Decimal with a delayed repeat to fraction
  topic: Decimals and irrationality
  vars:
    a: {min: 1, max: 9}
    b: {min: 1, max: 9}
  calc:
    big: 10*a + b
    top: 9*a + b
    g: gcd(top, 90)
    num: top/g
    den: 90/g
    r: top/90
  where: ['a != b', 'b != 9']
  prompt: 'Write $0.{a}\overline{{b}} = 0.{a}{b}{b}{b}\ldots$ as a fraction in lowest terms.'
  answers:
    - {name: r, kind: fraction, lowestTerms: true, label: 'Fraction'}
  solution: |-
    Let $x = 0.{a}{b}{b}{b}\ldots$ Then $10x = {a}.{b}{b}{b}\ldots$ and $100x = {big}.{b}{b}{b}\ldots$
    Subtract: $100x - 10x = {big} - {a}$, so $90x = {top}$ and $x = \dfrac{{top}}{90}$.
    The greatest common factor of {top} and 90 is {g}, so in lowest terms $x =$ **$\dfrac{{num}}{{den}}$**.

- id: alg-m1-r2-work-together
  title: Two workers together
  topic: Rates and averages
  vars:
    ta: {min: 2, max: 9}
    tb: {min: 3, max: 15}
  calc:
    together: ta*tb/(ta + tb)
    lcd: lcm(ta, tb)
    ca: lcd/ta
    cb: lcd/tb
    csum: ca + cb
  where: ['ta < tb']
  prompt: 'One machine finishes a job in {ta} hours and a second machine finishes the same job in {tb} hours. Working together, how many hours do they need? Give an exact fraction or a decimal rounded to 2 decimal places.'
  answers:
    - {name: together, label: 'Hours', tolerance: 0.0051}
  solution: |-
    Rates add: $\dfrac{t}{{ta}} + \dfrac{t}{{tb}} = 1$.
    Multiply by {lcd}: ${ca}t + {cb}t = {lcd}$, so ${csum}t = {lcd}$ and $t = \dfrac{{lcd}}{{csum}} \approx$ **{together:num2}** hours.

- id: alg-m1-r2-round-trip
  title: Round-trip average speed
  topic: Rates and averages
  vars:
    sa: {choices: [20, 30, 40, 45, 60, 90]}
    sb: {choices: [20, 30, 40, 45, 60, 90]}
    mult: {choices: [1, 2]}
  calc:
    dist: lcm(sa, sb)*mult
    avg: 2*sa*sb/(sa + sb)
    t1: dist/sa
    t2: dist/sb
    tt: t1 + t2
    d2: 2*dist
  where: ['sa < sb', 'mod(2*sa*sb, sa + sb) == 0']
  prompt: 'You drive {dist} miles at {sa} mph and return the same {dist} miles at {sb} mph. What is your average speed for the round trip, in mph?'
  answers:
    - {name: avg, label: 'Average speed (mph)'}
  solution: |-
    Time out: $\dfrac{{dist}}{{sa}} = {t1}$ h. Time back: $\dfrac{{dist}}{{sb}} = {t2}$ h. Total: {d2} miles in {tt} hours.
    Average speed $= \dfrac{{d2}}{{tt}} =$ **{avg}** mph. (Check with the harmonic mean: $\dfrac{2 \cdot {sa} \cdot {sb}}{{sa} + {sb}} = {avg}$.)

- id: alg-m1-r2-final-needed
  title: Final exam score needed
  topic: Rates and averages
  vars:
    hw: {min: 70, max: 100}
    ts: {min: 60, max: 98}
    goal: {choices: [70, 75, 80, 85, 90]}
  calc:
    phw: 2*hw/10
    pts: 5*ts/10
    need: (10*goal - 2*hw - 5*ts)/10
    fin: (10*goal - 2*hw - 5*ts)/3
  where: ['mod(10*goal - 2*hw - 5*ts, 3) == 0', 'fin >= 40', 'fin <= 100']
  prompt: 'A course grade counts homework 20%, tests 50% and the final exam 30%. Your homework average is {hw} and your test average is {ts}. What final exam score gives a course grade of exactly {goal}?'
  answers:
    - {name: fin, label: 'Final exam score'}
  solution: |-
    Weighted average: $0.20({hw}) + 0.50({ts}) + 0.30F = {goal}$.
    So ${phw} + {pts} + 0.30F = {goal}$, which gives $0.30F = {need:num1}$ and $F =$ **{fin}**.
