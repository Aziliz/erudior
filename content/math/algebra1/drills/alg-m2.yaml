# Inequalities and absolute value drills
- id: alg-d-ineq-smallest-int
  title: Smallest integer solution
  topic: Linear inequalities
  vars:
    a: {min: -9, max: -2}
    b: {min: -15, max: 15}
    c: {min: -20, max: 20}
  calc:
    cb: c - b
    bnd: (c - b)/a
    ans: floor(bnd) + 1
  where: ['b != 0', 'cb != 0']
  prompt: 'Solve ${a}x {b:signed} < {c}$. What is the smallest integer that satisfies the inequality?'
  answers:
    - {name: ans, label: 'Smallest integer'}
  solution: |-
    Move the constant: ${a}x < {c} - ({b}) = {cb}$. Divide by {a}, which is negative, so reverse the symbol: $x > {bnd:texfrac}$.
    The smallest integer greater than ${bnd:texfrac}$ is **{ans}**.

- id: alg-d-ineq-largest-int
  title: Largest integer solution
  topic: Linear inequalities
  vars:
    a: {min: 1, max: 6}
    c: {min: 2, max: 9}
    b: {min: -12, max: 12}
    d: {min: -12, max: 12}
  calc:
    amc: a - c
    rhs: d - b
    bnd: (d - b)/(a - c)
    ans: floor(bnd)
  where: ['a < c', 'b != 0', 'd != 0', 'rhs != 0']
  prompt: 'Solve ${a:coef}x {b:signed} \ge {c}x {d:signed}$. What is the largest integer that satisfies the inequality?'
  answers:
    - {name: ans, label: 'Largest integer'}
  solution: |-
    Collect $x$ terms on the left and constants on the right: ${amc:coef}x \ge {rhs}$.
    Divide by {amc}, which is negative, so reverse the symbol: $x \le {bnd:texfrac}$.
    The largest integer that is at most ${bnd:texfrac}$ is **{ans}**.

- id: alg-d-compound-ineq
  title: Solve a double inequality
  topic: Compound inequalities
  vars:
    a: {min: -6, max: -2}
    b: {min: -10, max: 10}
    c1: {min: -20, max: 5}
    c2: {min: -5, max: 20}
  calc:
    c1b: c1 - b
    c2b: c2 - b
    left: (c2 - b)/a
    right: (c1 - b)/a
  where: ['c2 - c1 >= 4', 'b != 0']
  prompt: 'Solve ${c1} < {a}x {b:signed} < {c2}$. Give the left and right endpoints of the solution interval as exact fractions.'
  answers:
    - {name: left, kind: fraction, lowestTerms: true, label: 'Left endpoint'}
    - {name: right, kind: fraction, lowestTerms: true, label: 'Right endpoint'}
  solution: |-
    Subtract $({b})$ from all three parts: ${c1b} < {a}x < {c2b}$.
    Divide all three parts by {a}, a negative number, so both symbols reverse: ${right:texfrac} > x > {left:texfrac}$.
    In increasing order: ${left:texfrac} < x < {right:texfrac}$. Endpoints **${left:texfrac}$** and **${right:texfrac}$**.

- id: alg-d-abs-eq
  title: Solve an absolute value equation
  topic: Absolute value
  vars:
    m: {min: 1, max: 4}
    a: {min: 1, max: 5}
    b: {min: -9, max: 9}
    k: {min: 1, max: 12}
    n: {min: -9, max: 9}
  calc:
    r: m*k + n
    rn: r - n
    lo: (-k - b)/a
    hi: (k - b)/a
    nk: -k
  where: ['b != 0', 'n != 0']
  prompt: 'Solve ${m:coef}|{a:coef}x {b:signed}| {n:signed} = {r}$. Enter both solutions as exact fractions, smaller first.'
  answers:
    - {name: lo, kind: fraction, lowestTerms: true, label: 'Smaller'}
    - {name: hi, kind: fraction, lowestTerms: true, label: 'Larger'}
  solution: |-
    Isolate the absolute value: ${m:coef}|{a:coef}x {b:signed}| = {rn}$, so $|{a:coef}x {b:signed}| = {k}$.
    Split: ${a:coef}x {b:signed} = {k}$ or ${a:coef}x {b:signed} = {nk}$.
    Solving each gives $x =$ **${lo:texfrac}$** and $x =$ **${hi:texfrac}$**.

- id: alg-d-abs-ineq
  title: Absolute value inequality
  topic: Absolute value
  vars:
    a: {min: 1, max: 4}
    b: {min: -9, max: 9}
    c: {min: 2, max: 12}
  calc:
    nc: -c
    lo: (-c - b)/a
    hi: (c - b)/a
    count: floor(hi) - ceil(lo) + 1
    mb: -b
  where: ['b != 0']
  prompt: 'Solve $|{a:coef}x {b:signed}| \le {c}$. Enter the endpoints of the solution interval (exact fractions), then how many integers lie in it.'
  answers:
    - {name: lo, kind: fraction, lowestTerms: true, label: 'Left endpoint'}
    - {name: hi, kind: fraction, lowestTerms: true, label: 'Right endpoint'}
    - {name: count, label: 'Number of integers'}
  solution: |-
    "Less than or equal" becomes "between": ${nc} \le {a:coef}x {b:signed} \le {c}$.
    Subtract $({b})$ from all three parts and divide by {a}: ${lo:texfrac} \le x \le {hi:texfrac}$, so the endpoints are **${lo:texfrac}$** and **${hi:texfrac}$**.
    The integers from $\lceil {lo:texfrac} \rceil$ to $\lfloor {hi:texfrac} \rfloor$ number **{count}**.
