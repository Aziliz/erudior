# Round 2 cards: alg-m2 honors lessons
- {front: 'Piecewise definition of $|u|$', back: '$|u| = u$ if $u \ge 0$, and $|u| = -u$ if $u < 0$.', topic: Absolute value by cases}
- {front: 'Critical value of $|x - 3|$', back: '$x = 3$, where the inside equals 0. For $x \ge 3$, $|x - 3| = x - 3$; for $x < 3$, $|x - 3| = 3 - x$.', topic: Absolute value by cases}
- {front: 'Solving $|u| = v$ when $v$ contains $x$', back: 'Split into $u = v$ or $u = -v$, then check every candidate. Any candidate that makes $v < 0$ is extraneous.', topic: Absolute value by cases}
- {front: 'Extraneous solution', back: 'A value the algebra produces that fails the original equation. Splitting $|x - 3| = 2x$ gives $-3$ and $1$; only $1$ works.', topic: Absolute value by cases}
- {front: 'Do $|u| < v \iff -v < u < v$ and $|u| > v \iff u < -v$ or $u > v$ need $v \ge 0$?', back: 'No. They hold for every $v$, because $|u|$ is the larger of $u$ and $-u$.', topic: Absolute value by cases}
- {front: 'Solving $-v < u < v$ when $x$ is in all three parts', back: 'Split it into $-v < u$ and $u < v$, solve each, and intersect.', topic: Absolute value by cases}
- {front: 'Steps for two absolute values (by cases)', back: 'Find the critical values, split the line into regions, remove the bars in each region, solve, keep answers inside their region, combine and check.', topic: Absolute value by cases}
- {front: '$|x - a| + |x - b|$ with $a < b$', back: 'A sum of distances: equal to $b - a$ for every $x$ in $[a, b]$, and $b - a$ plus twice the overshoot outside.', topic: Absolute value by cases}
- {front: 'Solutions of $|x - 1| + |x + 2| = 5$', back: '$x = -3$ and $x = 2$ (one unit beyond each critical value).', topic: Absolute value by cases}
- {front: 'Interval $a \le x \le b$ as an absolute value', back: '$|x - m| \le h$ with midpoint $m = \tfrac{a + b}{2}$ and half-width $h = \tfrac{b - a}{2}$.', topic: Tolerance and error}
- {front: 'Outside an interval: $x < a$ or $x > b$', back: '$|x - m| > h$, with midpoint $m$ and half-width $h$.', topic: Tolerance and error}
- {front: 'A tolerance of $\pm t$ on a nominal value $n$', back: '$|x - n| \le t$, so $n - t \le x \le n + t$. A percent tolerance is that percent of $n$.', topic: Tolerance and error}
- {front: 'Absolute error vs relative error', back: 'Absolute: $|\text{measured} - \text{true}|$. Relative: that divided by $|\text{true}|$, often as a percent.', topic: Tolerance and error}
- {front: 'Error through $y = kx + b$', back: 'An input error of at most $e$ gives an output error of at most $|k|e$, because $|y - y_0| = |k|\,|x - x_0|$.', topic: Tolerance and error}
- {front: '$|ab|$', back: '$|a|\,|b|$: the size of a product is the product of the sizes.', topic: Tolerance and error}
- {front: 'Triangle inequality', back: '$|a + b| \le |a| + |b|$, with equality exactly when $a$ and $b$ do not have opposite signs.', topic: Tolerance and error}
- {front: 'Error bound for $x + y$ or $x - y$', back: 'If $x$ is within $e_1$ and $y$ within $e_2$, both $x + y$ and $x - y$ are within $e_1 + e_2$. Bounds add even when you subtract.', topic: Tolerance and error}
- {front: 'Why errors add for differences', back: '$(x - y) - (x_0 - y_0) = (x - x_0) + (y_0 - y)$, and the triangle inequality bounds this by $|x - x_0| + |y - y_0|$.', topic: Tolerance and error}
