# Round 2 cards for a1-m8 (honors lessons 36h1-36h3)
- {front: 'z-score formula', back: '$z = \dfrac{x - \mu}{\sigma}$: standard deviations from the mean (negative below the mean).', topic: z-scores}
- {front: 'From a z-score back to a value', back: '$x = \mu + z\sigma$.', topic: z-scores}
- {front: 'Comparing values from different data sets', back: 'Compare z-scores, not raw values; check whether high or low is better in context.', topic: z-scores}
- {front: 'Mean and SD of a whole set of z-scores', back: 'Mean 0, standard deviation 1. Changing units (inches to cm) leaves z-scores unchanged.', topic: z-scores}
- {front: 'What describes a normal distribution?', back: 'Its mean $\mu$ (center, peak) and standard deviation $\sigma$ (spread). The curve bends the other way at $\mu \pm \sigma$.', topic: Normal distributions}
- {front: '68–95–99.7 rule', back: 'About 68% within $1\sigma$, 95% within $2\sigma$, 99.7% within $3\sigma$ of the mean (normal data only).', topic: Normal distributions}
- {front: 'Normal bands, from the mean outward', back: '34%, 13.5%, 2.35%, 0.15% on each side.', topic: Normal distributions}
- {front: 'Percent above $\mu + \sigma$ in a normal distribution', back: 'About 16% ($50\% - 34\%$). Below $\mu - 2\sigma$: about 2.5%.', topic: Normal distributions}
- {front: 'Using a z-table', back: 'It gives the area to the LEFT of $z$ (the percentile). Area to the right: 1 minus it. Between: subtract the two left areas.', topic: Normal distributions}
- {front: 'z for the 90th percentile', back: '$z \approx 1.28$, so the 90th percentile is about $\mu + 1.28\sigma$.', topic: Normal distributions}
- {front: 'When not to use a normal model', back: 'Clearly skewed data, several peaks, or outliers. Look at a graph first.', topic: Normal distributions}
- {front: 'Simpson''s paradox', back: 'An association inside every group reverses when the groups are combined, because a lurking variable is unevenly mixed across the groups.', topic: Simpson's paradox}
- {front: 'Overall rate of two groups', back: 'A weighted average: $w\,p_1 + (1 - w)\,p_2$, where $w$ is the first group''s share. It lies between $p_1$ and $p_2$, nearer the bigger group.', topic: Simpson's paradox}
- {front: 'Two ingredients of Simpson''s paradox', back: 'A third variable that strongly affects the outcome, and very different mixes of it in the groups compared.', topic: Simpson's paradox}
- {front: 'Kidney stone study (1986)', back: 'Open surgery (A) beat the keyhole procedure (B) for small stones (93% vs 87%) and large stones (73% vs 69%) but lost overall (78% vs 83%): A treated far more large stones.', topic: Simpson's paradox}
- {front: 'Observational study vs randomized experiment', back: 'Observational: researchers only record. Randomized: chance assigns treatments, which balances lurking variables, even unmeasured ones.', topic: Simpson's paradox}
- {front: 'Expected count formula', back: '$\dfrac{(\text{row total})(\text{column total})}{\text{grand total}}$: the count with no association.', topic: Expected counts}
- {front: 'Observed vs expected counts', back: 'Close: little or no association. Far apart: association (not proof of cause). In a 2×2 table the four gaps are equal in size with alternating signs.', topic: Expected counts}
- {front: 'What least squares minimizes', back: 'The sum of squared residuals $\text{SSE} = \sum (y - \hat y)^2$. (Plain residuals add to 0 for every line through $(\bar x, \bar y)$.)', topic: Least-squares regression}
- {front: 'A point on every least-squares line', back: 'The point of averages $(\bar x, \bar y)$.', topic: Least-squares regression}
- {front: 'Least-squares slope from deviations', back: '$b = \dfrac{\sum (x - \bar x)(y - \bar y)}{\sum (x - \bar x)^2}$, then $a = \bar y - b\bar x$.', topic: Least-squares regression}
- {front: 'Least-squares slope from $r$', back: '$b = r\,\dfrac{\sigma_y}{\sigma_x}$ ($y$-spread on top).', topic: Least-squares regression}
- {front: 'Why the slope formula is a vertex', back: 'SSE as a function of the slope is an upward parabola $Am^2 + Bm + C$; its minimum is at $m = -\dfrac{B}{2A}$.', topic: Least-squares regression}
- {front: 'Correlation from deviations', back: '$r = \dfrac{\sum d_x d_y}{\sqrt{\sum d_x^2 \sum d_y^2}}$; points in the upper-right and lower-left of $(\bar x, \bar y)$ make it positive.', topic: Least-squares regression}
- {front: 'Meaning of $r^2$', back: '$r^2 = 1 - \dfrac{\text{SSE}}{\sum (y - \bar y)^2}$: the fraction of the variation in $y$ the line accounts for. Not a percent of points, not proof of cause.', topic: Least-squares regression}
- {front: 'Regression to the mean', back: 'In z-scores the line is $\hat z_y = r z_x$; with $|r| < 1$ predictions are closer to the mean. Galton, 1886, parents'' and children''s heights.', topic: Least-squares regression}
- {front: 'Predicting $x$ from $y$', back: 'Uses a different line ($\hat z_x = r z_y$), not the $y$-on-$x$ line solved for $x$, unless $r = \pm 1$.', topic: Least-squares regression}
- {front: 'Who invented least squares?', back: 'Legendre published it first (1805); Gauss published in 1809 and said he had used it since the 1790s. Credit is still debated.', topic: Least-squares regression}
- {front: 'Berkeley graduate admissions, 1973', back: 'About 44% of men and 35% of women were admitted overall, yet there was no pattern of bias against women within departments: women more often applied to departments that admitted few applicants.', topic: Simpson's paradox}
