# Round 2 glossary terms for a1-m7 honors lessons
- term: proof by contradiction
  aliases: [indirect proof]
  definition: 'A proof that assumes the opposite of the statement, reasons correctly from that assumption, and reaches something impossible, so the assumption must be false. Example: assuming $\sqrt2 = \tfrac pq$ in lowest terms forces $p$ and $q$ both to be even.'
  topic: Irrationality proofs
- term: rationalizing the denominator
  aliases: [rationalize the denominator, rationalizing denominators, rationalize]
  definition: 'Rewriting a fraction so that no radical remains in the denominator, by multiplying the top and bottom by the same expression: $\dfrac{a}{\sqrt b} = \dfrac{a\sqrt b}{b}$.'
  topic: Rationalizing denominators
- term: conjugate
  aliases: [conjugates]
  definition: 'The conjugate of $a + \sqrt b$ is $a - \sqrt b$ (and the other way around). Their product has no radical: $(a + \sqrt b)(a - \sqrt b) = a^2 - b$.'
  topic: Rationalizing denominators
- term: nth root
  aliases: [nth roots, n-th root]
  definition: 'A number whose $n$th power is $a$, written $\sqrt[n]{a}$. For even $n$ it needs $a \ge 0$ and means the nonnegative root; for odd $n$ every real number has exactly one real $n$th root.'
  topic: Rational exponents
- term: index
  aliases: [index of a radical]
  definition: 'In $\sqrt[n]{a}$, the number $n$ that says which root to take (2 for a square root, usually not written). In summation notation, the index is the letter that counts the terms, as $k$ does in $\sum_{k=1}^{n} a_k$.'
  topic: Rational exponents
- term: rational exponent
  aliases: [rational exponents, fractional exponent]
  definition: 'An exponent that is a fraction. For $a > 0$, $a^{1/n} = \sqrt[n]{a}$ and $a^{m/n} = (\sqrt[n]{a})^m$: the denominator is the root and the numerator is the power.'
  topic: Rational exponents
- term: half-life
  aliases: [half-lives]
  definition: 'The time it takes a decaying quantity to fall to half its amount. With half-life $h$, $A = A_0\left(\tfrac12\right)^{t/h}$.'
  topic: Rational exponents
- term: doubling time
  definition: 'The time it takes a growing quantity to double. With doubling time $D$, $A = A_0 \cdot 2^{t/D}$.'
  topic: Rational exponents
- term: series
  definition: 'The sum of the terms of a sequence, such as $1 + 2 + 3 + \dots + 100$.'
  topic: Series
- term: partial sum
  aliases: [partial sums]
  definition: 'The sum $S_n = a_1 + a_2 + \dots + a_n$ of the first $n$ terms of a sequence.'
  topic: Series
- term: summation notation
  aliases: [sigma notation]
  definition: 'Compact notation for a sum: $\sum_{k=1}^{n} a_k = a_1 + a_2 + \dots + a_n$, where $k$ starts at the bottom number and counts up by 1 to the top number.'
  topic: Series
- term: arithmetic series
  definition: 'The sum of terms of an arithmetic sequence: $S_n = \dfrac{n(a_1 + a_n)}{2}$.'
  topic: Series
- term: geometric series
  definition: 'The sum of terms of a geometric sequence: $S_n = \dfrac{a_1(1 - r^n)}{1 - r}$ for $r \ne 1$.'
  topic: Series
- term: infinite geometric series
  definition: 'A geometric series that never ends, $a_1 + a_1 r + a_1 r^2 + \cdots$. When $|r| < 1$ it converges to $\dfrac{a_1}{1 - r}$; when $|r| \ge 1$ it has no sum.'
  topic: Series
- term: converge
  aliases: [converges, convergent]
  definition: 'An infinite series converges when its partial sums get as close as you like to one number, which is called its sum. Example: $\tfrac12 + \tfrac14 + \tfrac18 + \cdots$ converges to 1.'
  topic: Series
- term: diverge
  aliases: [diverges, divergent]
  definition: 'An infinite series diverges when its partial sums do not settle on one number, as with $1 + 2 + 4 + \cdots$ or $1 - 1 + 1 - 1 + \cdots$. It has no sum.'
  topic: Series
