<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" width="480" height="410" role="img"><title>A unit square cut into a half, a quarter, an eighth, a sixteenth and so on</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="480" height="410" fill="#ffffff"/><rect x="70.0" y="24.0" width="170.0" height="340.0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="155.0" y="201.0" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833">1/2</text><rect x="240.0" y="24.0" width="170.0" height="170.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="325.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833">1/4</text><rect x="240.0" y="194.0" width="85.0" height="170.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="282.5" y="286.0" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833">1/8</text><rect x="325.0" y="194.0" width="85.0" height="85.0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="367.5" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="22" text-anchor="middle" font-weight="bold" fill="#1c2833">1/16</text><rect x="325.0" y="279.0" width="42.5" height="85.0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="346.2" y="328.5" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">1/32</text><rect x="367.5" y="279.0" width="42.5" height="42.5" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><rect x="367.5" y="321.5" width="21.2" height="42.5" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><rect x="388.8" y="321.5" width="21.2" height="21.2" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><rect x="70" y="24" width="340" height="340" fill="none" stroke="#1c2833" stroke-width="3"/><text x="240.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">1/2 + 1/4 + 1/8 + 1/16 + … fills the whole square: the sum is 1</text></svg>