<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" font-family="sans-serif" font-size="16" fill="#1c2833">
<rect width="640" height="340" fill="#ffffff"/>
<rect x="40.0" y="40.0" width="230.0" height="230.0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<rect x="270.0" y="40.0" width="142.1" height="230.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<line x1="270.0" y1="182.1" x2="412.1" y2="182.1" stroke="#1c2833" stroke-width="1.8" stroke-dasharray="7 5"/>
<text x="155.0" y="149.0" text-anchor="middle" font-size="16">square</text>
<text x="155.0" y="171.0" text-anchor="middle" font-size="16">1 by 1</text>
<text x="341.1" y="117.1" text-anchor="middle" font-size="15">square</text>
<text x="155.0" y="294.0" text-anchor="middle" font-size="16">1</text>
<text x="341.1" y="294.0" text-anchor="middle" font-size="16">φ − 1</text>
<text x="26.0" y="160.0" text-anchor="middle" font-size="16">1</text>
<line x1="40.0" y1="312.0" x2="412.1" y2="312.0" stroke="#1c2833" stroke-width="1.5"/>
<line x1="40.0" y1="306.0" x2="40.0" y2="318.0" stroke="#1c2833" stroke-width="1.5"/>
<line x1="412.1" y1="306.0" x2="412.1" y2="318.0" stroke="#1c2833" stroke-width="1.5"/>
<text x="226.1" y="334.0" text-anchor="middle" font-size="16">φ ≈ 1.618</text>
<text x="432.1" y="90.0" text-anchor="start" font-size="15">Cut a 1 by 1 square</text>
<text x="432.1" y="112.0" text-anchor="start" font-size="15">off a 1 by φ rectangle.</text>
<text x="432.1" y="150.0" text-anchor="start" font-size="15">The green strip left over</text>
<text x="432.1" y="172.0" text-anchor="start" font-size="15">has the same shape:</text>
<text x="432.1" y="202.0" text-anchor="start" font-size="15">1 ÷ (φ − 1) = φ</text>
<text x="432.1" y="240.0" text-anchor="start" font-size="15">Cutting a square off it</text>
<text x="432.1" y="262.0" text-anchor="start" font-size="15">(dashed) leaves another.</text>
</svg>
