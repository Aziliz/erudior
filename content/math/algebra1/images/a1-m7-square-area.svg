<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img"><title>Squares with areas 36, 40 and 49 and sides 6, the square root of 40, and 7</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="560" height="250" fill="#ffffff"/><rect x="30.0" y="50.0" width="120.0" height="120.0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="90.0" y="116.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833">area 36</text><text x="90.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">side 6</text><rect x="205.0" y="43.5" width="126.5" height="126.5" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="268.2" y="112.8" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833">area 40</text><text x="268.2" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">side √40 ≈ 6.32</text><rect x="386.5" y="30.0" width="140.0" height="140.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="456.5" y="106.0" font-family="Helvetica, Arial, sans-serif" font-size="17" text-anchor="middle" font-weight="normal" fill="#1c2833">area 49</text><text x="456.5" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">side 7</text><text x="280.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">A square of area a has side √a; 36 &lt; 40 &lt; 49, so 6 &lt; √40 &lt; 7.</text></svg>