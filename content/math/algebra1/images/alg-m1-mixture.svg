<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" width="800" height="375" font-family="sans-serif" fill="#1c2833">
<rect width="800" height="375" fill="#ffffff"/>
<rect x="45.0" y="160" width="130" height="70" fill="#dde8f3"/>
<rect x="45.0" y="219.5" width="130" height="10.5" fill="#f8e1dc" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M39.0,60 L45.0,66 L45.0,230 L175.0,230 L175.0,66 L181.0,60" fill="none" stroke="#1c2833" stroke-width="3" stroke-linejoin="round"/>
<text x="110" y="260" font-size="19" text-anchor="middle" font-weight="bold">10 L</text>
<text x="110" y="284" font-size="17" text-anchor="middle">at 15%</text>
<text x="110" y="308" font-size="17" text-anchor="middle">acid: 1.5 L</text>
<text x="235" y="160" font-size="40" text-anchor="middle">+</text>
<rect x="295.0" y="180" width="130" height="50" fill="#dde8f3"/>
<rect x="295.0" y="210.0" width="130" height="20.0" fill="#f8e1dc" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M289.0,60 L295.0,66 L295.0,230 L425.0,230 L425.0,66 L431.0,60" fill="none" stroke="#1c2833" stroke-width="3" stroke-linejoin="round"/>
<text x="360" y="260" font-size="19" text-anchor="middle" font-weight="bold">x L</text>
<text x="360" y="284" font-size="17" text-anchor="middle">at 40%</text>
<text x="360" y="308" font-size="17" text-anchor="middle">acid: 0.40x L</text>
<text x="490" y="160" font-size="40" text-anchor="middle">=</text>
<rect x="575.0" y="110" width="130" height="120" fill="#dde8f3"/>
<rect x="575.0" y="200.0" width="130" height="30.0" fill="#f8e1dc" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M569.0,60 L575.0,66 L575.0,230 L705.0,230 L705.0,66 L711.0,60" fill="none" stroke="#1c2833" stroke-width="3" stroke-linejoin="round"/>
<text x="640" y="260" font-size="19" text-anchor="middle" font-weight="bold">(10 + x) L</text>
<text x="640" y="284" font-size="17" text-anchor="middle">at 25%</text>
<text x="640" y="308" font-size="17" text-anchor="middle">acid: 0.25(10 + x) L</text>
<rect x="250" y="16" width="22" height="16" fill="#f8e1dc" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 3"/><text x="280" y="30" font-size="16">acid</text>
<rect x="340" y="16" width="22" height="16" fill="#dde8f3"/><text x="370" y="30" font-size="16">water</text>
<text x="400" y="360" font-size="17" text-anchor="middle">acid in + acid in = acid in the mixture:  1.5 + 0.40x = 0.25(10 + x)</text>
</svg>
