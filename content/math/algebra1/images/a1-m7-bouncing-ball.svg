<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img"><title>A ball dropped from 10 feet, bouncing to 6, 3.6, 2.16 and 1.296 feet</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="600" height="340" fill="#ffffff"/><rect x="20" y="290" width="560" height="14" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><circle cx="60" cy="38" r="11" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><line x1="60.0" y1="50.0" x2="60.0" y2="288.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M 60 290 Q 150.0 2.0 240 290" fill="none" stroke="#2f6fa8" stroke-width="2.5"/><path d="M 240 290 Q 310.0 117.2 380 290" fill="none" stroke="#2f6fa8" stroke-width="2.5"/><path d="M 380 290 Q 430.0 186.3 480 290" fill="none" stroke="#2f6fa8" stroke-width="2.5"/><path d="M 480 290 Q 515.0 227.8 550 290" fill="none" stroke="#2f6fa8" stroke-width="2.5"/><line x1="150.0" y1="290.0" x2="150.0" y2="146.0" stroke="#1c2833" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="310.0" y1="290.0" x2="310.0" y2="203.6" stroke="#1c2833" stroke-width="1.6" stroke-dasharray="4 4"/><line x1="430.0" y1="290.0" x2="430.0" y2="238.2" stroke="#1c2833" stroke-width="1.6" stroke-dasharray="4 4"/><text x="82.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#1c2833">dropped from 10 ft</text><text x="150.0" y="136.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">a₁ = 6 ft</text><text x="310.0" y="193.6" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">a₂ = 3.6 ft</text><text x="430.0" y="228.2" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">a₃ = 2.16 ft</text><text x="300.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="normal" fill="#1c2833">Each bounce reaches 60% of the one before: r = 0.6</text></svg>