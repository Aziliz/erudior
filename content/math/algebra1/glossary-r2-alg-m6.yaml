# Round 2 glossary: alg-m6 honors lessons
- term: Vieta's formulas
  aliases: [Vieta formulas, Viète's formulas]
  definition: 'For $ax^2 + bx + c = 0$ with roots $r$ and $s$: the sum is $r + s = -\tfrac{b}{a}$ and the product is $rs = \tfrac{c}{a}$. In this course they apply when the roots are real ($b^2 - 4ac \ge 0$); a double root counts twice.'
  topic: Sums and products of roots
- term: symmetric expression
  aliases: [symmetric expressions]
  definition: 'An expression in two roots $r$ and $s$ that stays the same when $r$ and $s$ are swapped, such as $r^2 + s^2$ or $\tfrac1r + \tfrac1s$. It can be written using only the sum $r + s$ and the product $rs$.'
  topic: Sums and products of roots
- term: quadratic inequality
  aliases: [quadratic inequalities]
  definition: 'An inequality that compares a quadratic expression with a number or another expression, such as $x^2 - x - 6 < 0$. Its solutions usually form an interval or two rays.'
  topic: Quadratic inequalities
- term: boundary point
  aliases: [boundary points]
  definition: 'In solving an inequality, a value of $x$ where the two sides are equal (for a quadratic compared with 0, a root). The solution can change from true to false only at boundary points.'
  topic: Quadratic inequalities
- term: sign chart
  aliases: [sign charts]
  definition: 'A number-line table showing the sign (+ or −) of each factor of an expression on each interval between its zeros, and the sign of the product. Used to solve inequalities such as $(x + 2)(x - 3) < 0$.'
  topic: Quadratic inequalities
- term: sexagesimal
  aliases: [base 60, base-60]
  definition: 'Written in base 60, as Babylonian numbers were. The first place after the point counts sixtieths, so the number written 0;45 means $\tfrac{45}{60} = \tfrac34$.'
  topic: History of quadratics
- term: al-jabr
  definition: 'Arabic for "restoring" or "completion": moving a subtracted term to the other side of an equation, where it becomes added. From the title of al-Khwarizmi''s book (about 820 CE), it gave us the word algebra.'
  topic: History of quadratics
- term: golden ratio
  aliases: [φ, phi, extreme and mean ratio]
  definition: 'The number $\varphi = \tfrac{1 + \sqrt5}{2} \approx 1.618$, the positive solution of $x^2 = x + 1$. A segment cut so that whole : longer = longer : shorter has both ratios equal to $\varphi$. Also $\tfrac1\varphi = \varphi - 1 \approx 0.618$.'
  topic: Golden ratio
- term: golden rectangle
  aliases: [golden rectangles]
  definition: 'A rectangle whose sides are in the ratio $\varphi : 1 \approx 1.618 : 1$. Cutting a square off one end leaves a smaller golden rectangle.'
  topic: Golden ratio
