# Round 2 cards for alg-m1 honors lessons
- {front: 'Why must the decimal of $\tfrac pq$ terminate or repeat?', back: 'Long division by $q$ has only $q$ possible remainders ($0$ to $q - 1$). Remainder 0 ends it; otherwise a remainder must come back, and the digits cycle.', topic: Decimals and irrationality}
- {front: 'Longest possible repeating block of $\tfrac{p}{q}$', back: '$q - 1$ digits (one per nonzero remainder). $\tfrac17 = 0.\overline{142857}$ reaches it.', topic: Decimals and irrationality}
- {front: 'Which fractions have terminating decimals?', back: 'In lowest terms, those whose denominator has no prime factors other than 2 and 5. Reduce first: $\tfrac{9}{75} = \tfrac{3}{25} = 0.12$.', topic: Decimals and irrationality}
- {front: 'Repeating decimal to fraction: the method', back: 'Let $x$ be the decimal, multiply by powers of 10 so the repeating tails line up, subtract, and solve the linear equation.', topic: Decimals and irrationality}
- {front: '$0.\overline{d_1 d_2 \ldots d_k}$ (a $k$-digit block right after the point)', back: 'The block over $k$ nines: $0.\overline{45} = \tfrac{45}{99} = \tfrac{5}{11}$, $0.\overline{135} = \tfrac{135}{999} = \tfrac{5}{37}$.', topic: Decimals and irrationality}
- {front: 'Write $0.4\overline{6}$ as a fraction', back: '$100x - 10x = 46.\overline{6} - 4.\overline{6} = 42$, so $90x = 42$ and $x = \tfrac{7}{15}$.', topic: Decimals and irrationality}
- {front: 'Is $0.999\ldots$ less than 1?', back: 'No, it equals 1: $10x - x = 9$ gives $x = 1$. Every terminating decimal has a twin ending in 9s, like $0.5 = 0.4\overline{9}$.', topic: Decimals and irrationality}
- {front: 'Rational vs irrational, by the decimal', back: 'Rational: terminates or repeats. Irrational: neither. $0.101001000\ldots$ (more 0s each time) is irrational.', topic: Decimals and irrationality}
- {front: 'The rational numbers are dense: what does that mean?', back: 'Between any two different rationals $a$ and $b$ there is another, such as $\tfrac{a + b}{2}$, and so infinitely many.', topic: Decimals and irrationality}
- {front: 'Proof by contradiction', back: 'Assume the opposite of the claim, reason correctly, reach something impossible; so the claim is true.', topic: Decimals and irrationality}
- {front: 'Why is there no smallest positive rational number?', back: 'If $r$ were the smallest, $\tfrac r2$ would be a smaller positive rational: a contradiction.', topic: Decimals and irrationality}
- {front: 'Work rate of someone who takes $a$ hours for a job', back: '$\tfrac1a$ of the job per hour. Work done = rate × time.', topic: Rates and averages}
- {front: 'Two workers take $a$ and $b$ hours alone. Time together?', back: 'Rates add: $\tfrac ta + \tfrac tb = 1$, so $t = \dfrac{ab}{a + b}$, less than either time alone.', topic: Rates and averages}
- {front: 'Inlet fills in $a$ hours, drain empties in $b$ hours ($b > a$). Time to fill?', back: 'Subtract the drain''s rate: $\tfrac ta - \tfrac tb = 1$.', topic: Rates and averages}
- {front: 'Average speed', back: 'Total distance ÷ total time, not the average of the speeds.', topic: Rates and averages}
- {front: 'Average speed for equal distances at speeds $a$ and $b$', back: 'The harmonic mean $\dfrac{2ab}{a + b}$. Example: 60 and 40 mph give 48 mph, not 50.', topic: Rates and averages}
- {front: 'When is average speed the plain average of two speeds?', back: 'When equal times (not equal distances) are spent at each speed.', topic: Rates and averages}
- {front: 'Weighted average', back: '$\dfrac{w_1 x_1 + w_2 x_2 + \cdots}{w_1 + w_2 + \cdots}$: each value counts by its weight.', topic: Rates and averages}
- {front: 'Balance rule for two groups with average $m$', back: '$w_1(m - x_1) = w_2(x_2 - m)$: the average sits between the values, nearer the heavier group.', topic: Rates and averages}
- {front: 'Final exam score needed for a target grade', back: 'Set the weighted average equal to the target and solve: $0.2(92) + 0.5(78) + 0.3F = 80$ gives $F = 75.\overline{3}$.', topic: Rates and averages}
