# Exponents, polynomials, and factoring
- id: alg-q-1801
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Simplify $x^3 \cdot x^5$.'
  choices: ['$x^8$', '$x^{15}$', '$2x^8$', '$x^2$']
  answer: 0
  explanation: |-
    Same base, multiplying: add the exponents. $x^{3+5} = x^8$. Multiplying exponents ($x^{15}$) is the rule for a power of a power.
- id: alg-q-1802
  lesson: alg-exponent-rules
  module_quiz: true
  topic: Exponents
  stem: 'Simplify $(2x^3)^4$.'
  choices: ['$2x^{12}$', '$16x^{12}$', '$8x^{7}$', '$16x^{7}$']
  answer: 1
  explanation: |-
    The exponent applies to both factors: $2^4 (x^3)^4 = 16x^{12}$. Leaving the 2 alone gives $2x^{12}$.
- id: alg-q-1803
  lesson: alg-exponent-rules
  module_quiz: true
  topic: Exponents
  stem: 'Evaluate $3^{-2}$.'
  choices: ['$\tfrac19$', '$-9$', '$-6$', '$\tfrac16$']
  answer: 0
  explanation: |-
    A negative exponent means reciprocal: $3^{-2} = \dfrac{1}{3^2} = \dfrac19$. It is not a negative number.
- id: alg-q-1804
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Evaluate $(-2)^0 + 2^{-1}$.'
  choices: ['$-\tfrac32$', '$\tfrac12$', '$\tfrac32$', '$-\tfrac12$']
  answer: 2
  explanation: |-
    Any nonzero number to the power 0 is 1, including $-2$ in parentheses. $2^{-1} = \tfrac12$. Sum: $\tfrac32$.
- id: alg-q-1805
  lesson: alg-exponent-rules
  module_quiz: true
  topic: Exponents
  stem: 'Simplify $\dfrac{15x^4y^{-2}}{5x^{-1}y^3}$ using positive exponents.'
  choices: ['$\dfrac{3x^5}{y^5}$', '$\dfrac{3x^3}{y}$', '$3x^5y$', '$\dfrac{3x^4}{y^6}$']
  answer: 0
  explanation: |-
    $\tfrac{15}{5} = 3$; $x^{4 - (-1)} = x^5$; $y^{-2 - 3} = y^{-5}$. So $3x^5y^{-5} = \dfrac{3x^5}{y^5}$. Subtracting $-1$ as if it were $+1$ gives $x^3$.
- id: alg-q-1806
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Evaluate $\left(\tfrac25\right)^{-2}$.'
  choices: ['$\tfrac{25}{4}$', '$-\tfrac{4}{25}$', '$\tfrac{4}{25}$', '$-\tfrac{25}{4}$']
  answer: 0
  explanation: |-
    Flip the fraction and make the exponent positive: $\left(\tfrac52\right)^2 = \tfrac{25}{4}$.
- id: alg-q-1807
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Simplify $(x^2)^3 \cdot x^{-4}$.'
  choices: ['$x^{10}$', '$x$', '$x^{-24}$', '$x^2$']
  answer: 3
  explanation: |-
    $(x^2)^3 = x^6$, then $x^6 \cdot x^{-4} = x^{2}$. Using $x^5$ for $(x^2)^3$ (adding instead of multiplying) gives $x$.
- id: alg-q-1808
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Evaluate $-4^0$.'
  choices: ['$0$', '$1$', '$-1$', '$-4$']
  answer: 2
  explanation: |-
    The exponent applies only to 4: $-4^0 = -(4^0) = -1$. With parentheses, $(-4)^0$ would be 1.
- id: alg-q-1809
  lesson: alg-exponent-rules
  topic: Scientific notation
  stem: 'Write $0.000307$ in scientific notation.'
  choices: ['$3.07 \times 10^{-3}$', '$3.07 \times 10^{4}$', '$30.7 \times 10^{-5}$', '$3.07 \times 10^{-4}$']
  answer: 3
  explanation: |-
    Move the decimal 4 places right to get 3.07, so the exponent is $-4$. $30.7 \times 10^{-5}$ has the right value but 30.7 is not between 1 and 10.
- id: alg-q-1810
  lesson: alg-exponent-rules
  module_quiz: true
  topic: Scientific notation
  stem: 'Compute $(4 \times 10^6)(5 \times 10^{-2})$ in scientific notation.'
  choices: ['$20 \times 10^{-12}$', '$2 \times 10^{4}$', '$2 \times 10^{5}$', '$9 \times 10^{4}$']
  answer: 2
  explanation: |-
    $4 \times 5 = 20$ and $10^6 \cdot 10^{-2} = 10^4$, so $20 \times 10^4 = 2 \times 10^5$.
- id: alg-q-1811
  lesson: alg-exponent-rules
  topic: Scientific notation
  stem: 'Compute $\dfrac{9.6 \times 10^{3}}{3.2 \times 10^{-2}}$.'
  choices: ['$3 \times 10^{5}$', '$3 \times 10^{1}$', '$3 \times 10^{-5}$', '$6.4 \times 10^{5}$']
  answer: 0
  explanation: |-
    $\tfrac{9.6}{3.2} = 3$ and $\tfrac{10^3}{10^{-2}} = 10^{3 - (-2)} = 10^5$. Subtracting the exponents as $3 - 2$ gives the wrong $10^1$.
- id: alg-q-1812
  lesson: alg-exponent-rules
  topic: Exponents
  stem: 'Which statement is true?'
  choices: ['$(x + y)^2 = x^2 + y^2$ for all $x, y$', '$(xy)^2 = x^2y^2$ for all $x, y$', '$x^2 \cdot x^3 = x^6$ for all $x$', '$\dfrac{x^6}{x^2} = x^3$ for all $x \ne 0$']
  answer: 1
  explanation: |-
    Exponents distribute over multiplication: $(xy)^2 = x^2y^2$. They don't distribute over addition, $x^2 \cdot x^3 = x^5$, and $\tfrac{x^6}{x^2} = x^4$.
- id: alg-q-1813
  lesson: alg-exponent-rules
  topic: Scientific notation
  stem: 'A bacterium is $2 \times 10^{-6}$ m long. How many would fit end to end across 1 cm ($10^{-2}$ m)?'
  choices: ['$500$', '$5{,}000$', '$50{,}000$', '$2 \times 10^{-8}$']
  answer: 1
  explanation: |-
    $\dfrac{10^{-2}}{2 \times 10^{-6}} = 0.5 \times 10^{4} = 5{,}000$. Multiplying instead of dividing gives $2 \times 10^{-8}$.

- id: alg-q-1901
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'What are the degree and leading coefficient of $3x^2 - 7x^5 + x - 4$?'
  choices: ['Degree 5, leading coefficient 7', 'Degree 2, leading coefficient 3', 'Degree 5, leading coefficient $-7$', 'Degree 4, leading coefficient $-7$']
  answer: 2
  explanation: |-
    In standard form, $-7x^5 + 3x^2 + x - 4$. The highest power is 5 and its coefficient, with its sign, is $-7$.
- id: alg-q-1902
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'Which expression is not a polynomial?'
  choices: ['$4x^3 - x$', '$\tfrac12 x^2 + 3$', '$x^{-2} + 1$', '$7$']
  answer: 2
  explanation: |-
    Polynomial exponents must be whole numbers. $x^{-2}$ has a negative exponent. Fractional coefficients like $\tfrac12$ are fine, and a constant is a degree-0 polynomial.
- id: alg-q-1903
  lesson: alg-poly-ops
  module_quiz: true
  topic: Polynomials
  stem: 'Simplify $(4x^2 - 3x + 5) - (x^2 + 2x - 6)$.'
  choices: ['$5x^2 - x - 1$', '$3x^2 - x - 1$', '$3x^2 - 5x - 1$', '$3x^2 - 5x + 11$']
  answer: 3
  explanation: |-
    Distribute the minus sign: $4x^2 - 3x + 5 - x^2 - 2x + 6 = 3x^2 - 5x + 11$. Subtracting only the first term gives $3x^2 - x - 1$.
- id: alg-q-1904
  lesson: alg-poly-ops
  module_quiz: true
  topic: Polynomials
  stem: 'Multiply $(3x - 2)(2x + 5)$.'
  choices: ['$6x^2 - 11x - 10$', '$6x^2 - 10$', '$6x^2 + 19x - 10$', '$6x^2 + 11x - 10$']
  answer: 3
  explanation: |-
    FOIL: $6x^2 + 15x - 4x - 10 = 6x^2 + 11x - 10$. Keeping only First and Last gives $6x^2 - 10$.
- id: alg-q-1905
  lesson: alg-poly-ops
  module_quiz: true
  topic: Polynomials
  stem: 'Expand $(x - 6)^2$.'
  choices: ['$x^2 - 6x + 36$', '$x^2 + 36$', '$x^2 - 36$', '$x^2 - 12x + 36$']
  answer: 3
  explanation: |-
    $(a - b)^2 = a^2 - 2ab + b^2$: $x^2 - 2(6)x + 36 = x^2 - 12x + 36$. Forgetting the middle term is the classic error.
- id: alg-q-1906
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'Multiply $(5y + 3)(5y - 3)$.'
  choices: ['$25y^2 + 9$', '$25y^2 - 9$', '$25y^2 - 30y - 9$', '$10y^2 - 9$']
  answer: 1
  explanation: |-
    Sum times difference: $(5y)^2 - 3^2 = 25y^2 - 9$. The middle products $-15y$ and $+15y$ cancel.
- id: alg-q-1907
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'Multiply $(x + 2)(x^2 - 2x + 4)$.'
  choices: ['$x^3 + 8$', '$x^3 - 8$', '$x^3 + 4x^2 + 8$', '$x^3 + 2x^2 + 8$']
  answer: 0
  explanation: |-
    $x(x^2 - 2x + 4) = x^3 - 2x^2 + 4x$ and $2(x^2 - 2x + 4) = 2x^2 - 4x + 8$. Adding, the middle terms cancel: $x^3 + 8$, a sum of cubes.
- id: alg-q-1908
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'A polynomial of degree 3 is multiplied by a polynomial of degree 4. What is the degree of the product?'
  choices: ['$4$', '$12$', '$7$', '$1$']
  answer: 2
  explanation: |-
    The leading terms multiply, and their exponents add: $x^3 \cdot x^4 = x^7$. Degree 7.
- id: alg-q-1909
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'A student writes $(2x + 3)^2 = 4x^2 + 9$. What is wrong?'
  choices: ['It should be $2x^2 + 9$', 'The middle term is missing; $(2x + 3)^2 = 4x^2 + 12x + 9$', 'It should be $4x^2 + 6x + 9$', 'Nothing is wrong']
  answer: 1
  explanation: |-
    $(2x + 3)(2x + 3) = 4x^2 + 6x + 6x + 9 = 4x^2 + 12x + 9$. The middle term is $2ab = 2(2x)(3)$, not $ab$.
- id: alg-q-1910
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'Expand $(x + 1)^3$.'
  choices: ['$x^3 + x^2 + x + 1$', '$x^3 + 1$', '$x^3 + 3x^2 + 3x + 1$', '$x^3 + 3x + 1$']
  answer: 2
  explanation: |-
    $(x + 1)^2 = x^2 + 2x + 1$; multiplying by $(x + 1)$ gives $x^3 + 2x^2 + x + x^2 + 2x + 1 = x^3 + 3x^2 + 3x + 1$.
- id: alg-q-1911
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'A square has side $2x + 1$. A rectangle measuring $x$ by $x + 4$ is cut out of it. What area remains?'
  choices: ['$3x^2 + 8x + 1$', '$3x^2 + 1$', '$5x^2 + 8x + 1$', '$3x^2 - 1$']
  answer: 1
  explanation: |-
    $(2x + 1)^2 - x(x + 4) = 4x^2 + 4x + 1 - x^2 - 4x = 3x^2 + 1$.
- id: alg-q-1912
  lesson: alg-poly-ops
  topic: Polynomials
  stem: 'Use a special product to compute $102 \times 98$.'
  choices: ['$10{,}004$', '$9{,}996$', '$9{,}994$', '$10{,}000$']
  answer: 1
  explanation: |-
    $(100 + 2)(100 - 2) = 100^2 - 2^2 = 10{,}000 - 4 = 9{,}996$.

- id: alg-q-2001
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'What is the greatest common factor of $18x^3y^2$ and $24x^2y^5$?'
  choices: ['$6x^2y^2$', '$6x^3y^5$', '$72x^3y^5$', '$3xy$']
  answer: 0
  explanation: |-
    GCF of 18 and 24 is 6; the lowest powers are $x^2$ and $y^2$. $72x^3y^5$ is the least common multiple instead.
- id: alg-q-2002
  lesson: alg-factor-gcf
  module_quiz: true
  topic: Factoring
  stem: 'Factor $14x^3 - 21x^2$ completely.'
  choices: ['$7(2x^3 - 3x^2)$', '$7x(2x^2 - 3x)$', '$7x^2(2x - 3)$', '$x^2(14x - 21)$']
  answer: 2
  explanation: |-
    The GCF is $7x^2$. The other choices are equal to the original but each leaves a common factor inside the parentheses, so they aren't complete.
- id: alg-q-2003
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Factor $5x^2 + 5x$ completely.'
  choices: ['$5x(x + 1)$', '$5x(x)$', '$5(x^2 + x)$', '$5x^2(1 + x)$']
  answer: 0
  explanation: |-
    The GCF is $5x$. Dividing: $\tfrac{5x^2}{5x} = x$ and $\tfrac{5x}{5x} = 1$. Forgetting the 1 gives $5x(x)$, which is only $5x^2$.
- id: alg-q-2004
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Factor $x(2x + 1) - 3(2x + 1)$.'
  choices: ['$(2x + 1)(x + 3)$', '$(2x + 1)(x - 3)$', '$(2x + 1)^2(x - 3)$', '$x - 3(2x + 1)$']
  answer: 1
  explanation: |-
    The common factor is the binomial $(2x + 1)$. What's left is $x - 3$, giving $(2x + 1)(x - 3)$.
- id: alg-q-2005
  lesson: alg-factor-gcf
  module_quiz: true
  topic: Factoring
  stem: 'Factor by grouping: $x^3 - 2x^2 + 5x - 10$.'
  choices: ['$(x - 2)(x^2 + 5)$', '$(x + 2)(x^2 - 5)$', '$(x - 2)(x^2 - 5)$', '$(x - 5)(x^2 + 2)$']
  answer: 0
  explanation: |-
    $x^2(x - 2) + 5(x - 2) = (x - 2)(x^2 + 5)$. Check: $x^3 + 5x - 2x^2 - 10$.
- id: alg-q-2006
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Factor $3xy - 6x + y - 2$.'
  choices: ['$(y + 2)(3x - 1)$', '$(y - 2)(3x)$', '$(y - 2)(3x + 1)$', '$(y - 2)(3x - 1)$']
  answer: 2
  explanation: |-
    $3x(y - 2) + 1(y - 2) = (y - 2)(3x + 1)$. The second group is $1 \cdot (y - 2)$; dropping that 1 loses a term.
- id: alg-q-2007
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Factor out a negative GCF: $-6x^2 + 9x - 12$.'
  choices: ['$-3(2x^2 - 3x + 4)$', '$-3(2x^2 + 3x - 4)$', '$-3(-2x^2 + 9x - 12)$', '$3(-2x^2 + 3x + 4)$']
  answer: 0
  explanation: |-
    Dividing each term by $-3$ flips every sign: $2x^2 - 3x + 4$. Check: $-3 \cdot 2x^2 = -6x^2$, $-3 \cdot (-3x) = 9x$, $-3 \cdot 4 = -12$.
- id: alg-q-2008
  lesson: alg-factor-gcf
  module_quiz: true
  topic: Factoring
  stem: 'Factor completely: $3x^3 + 6x^2 - 12x - 24$.'
  choices: ['$(x + 2)(3x^2 - 12)$', '$3(x + 2)(x^2 - 4)$', '$3(x + 2)^2(x - 2)$', '$3(x - 2)^2(x + 2)$']
  answer: 2
  explanation: |-
    GCF 3: $3(x^3 + 2x^2 - 4x - 8)$. Group: $3[x^2(x + 2) - 4(x + 2)] = 3(x + 2)(x^2 - 4)$. Then $x^2 - 4 = (x + 2)(x - 2)$, so the complete answer is $3(x + 2)^2(x - 2)$.
- id: alg-q-2009
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Which polynomial is prime over the integers?'
  choices: ['$9x^2 - 9$', '$x^2 - 9$', '$x^2 + 9x$', '$x^2 + 9$']
  answer: 3
  explanation: |-
    $x^2 + 9$ is a sum of squares, which has no factorization with integer (or real) coefficients. The others factor: $(x + 3)(x - 3)$, $x(x + 9)$ and $9(x + 1)(x - 1)$.
- id: alg-q-2010
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'A student factors $10xy - 15x - 4y + 6$ as $5x(2y - 3) - 2(2y + 3)$ and gets stuck. What went wrong?'
  choices: ['Nothing; the polynomial is prime', 'The first group should be $5x(2y + 3)$', 'The GCF of the first group is $10x$', 'The second group should be $-2(2y - 3)$, giving $(2y - 3)(5x - 2)$']
  answer: 3
  explanation: |-
    $-4y + 6 = -2(2y - 3)$: factoring out $-2$ flips the sign of 6 too. Then both groups share $(2y - 3)$: $(2y - 3)(5x - 2)$.
- id: alg-q-2011
  lesson: alg-factor-gcf
  topic: Factoring
  stem: 'Use factoring to solve $x^2 - 7x = 0$.'
  choices: ['$x = 7$ only', '$x = 0$ or $x = 7$', '$x = -7$ or $x = 0$', '$x = \sqrt7$']
  answer: 1
  explanation: |-
    $x(x - 7) = 0$, so $x = 0$ or $x - 7 = 0$. Dividing both sides by $x$ would lose the solution $x = 0$.

- id: alg-q-2101
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $x^2 + 8x + 15$.'
  choices: ['$(x + 2)(x + 6)$', '$(x + 1)(x + 15)$', '$(x - 3)(x - 5)$', '$(x + 3)(x + 5)$']
  answer: 3
  explanation: |-
    Product 15, sum 8: 3 and 5. $(x + 1)(x + 15)$ has the right product but sum 16.
- id: alg-q-2102
  lesson: alg-factor-trinomials
  module_quiz: true
  topic: Factoring
  stem: 'Factor $x^2 - 2x - 35$.'
  choices: ['$(x - 7)(x + 5)$', '$(x + 7)(x - 5)$', '$(x - 7)(x - 5)$', '$(x - 35)(x + 1)$']
  answer: 0
  explanation: |-
    Product $-35$, sum $-2$: $-7$ and $5$. $(x + 7)(x - 5)$ has middle term $+2x$.
- id: alg-q-2103
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $x^2 - 11x + 24$.'
  choices: ['$(x - 2)(x - 12)$', '$(x + 3)(x + 8)$', '$(x - 4)(x - 6)$', '$(x - 3)(x - 8)$']
  answer: 3
  explanation: |-
    Product 24, sum $-11$: both negative, $-3$ and $-8$. The pairs $-4, -6$ and $-2, -12$ have sums $-10$ and $-14$.
- id: alg-q-2104
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $2x^2 + 7x + 3$.'
  choices: ['$(2x + 3)(x + 1)$', '$(2x + 1)(x + 3)$', '$(2x + 7)(x + 3)$', '$(x + 1)(x + 3)$']
  answer: 1
  explanation: |-
    $ac = 6$, sum 7: 6 and 1. Split: $2x^2 + 6x + x + 3 = 2x(x + 3) + 1(x + 3) = (2x + 1)(x + 3)$. $(2x + 3)(x + 1)$ expands to $2x^2 + 5x + 3$.
- id: alg-q-2105
  lesson: alg-factor-trinomials
  module_quiz: true
  topic: Factoring
  stem: 'Factor $6x^2 - 7x - 5$.'
  choices: ['$(3x + 5)(2x - 1)$', '$(3x - 5)(2x + 1)$', '$(6x - 5)(x + 1)$', '$(3x + 1)(2x - 5)$']
  answer: 1
  explanation: |-
    $ac = -30$, sum $-7$: $-10$ and $3$. $6x^2 - 10x + 3x - 5 = 2x(3x - 5) + 1(3x - 5) = (3x - 5)(2x + 1)$.
- id: alg-q-2106
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Using the ac method on $4x^2 + 4x - 15$, which two numbers split the middle term?'
  choices: ['$5$ and $-3$', '$-10$ and $6$', '$15$ and $-4$', '$10$ and $-6$']
  answer: 3
  explanation: |-
    $ac = -60$ and $b = 4$: $10 \cdot (-6) = -60$ and $10 + (-6) = 4$. Then $4x^2 + 10x - 6x - 15 = (2x + 5)(2x - 3)$.
- id: alg-q-2107
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $49x^2 - 25$.'
  choices: ['$7(7x^2 - 5)$', '$(7x - 5)^2$', '$(7x + 5)(7x - 5)$', '$(7x + 5)^2$']
  answer: 2
  explanation: |-
    Difference of squares: $(7x)^2 - 5^2 = (7x + 5)(7x - 5)$. $(7x - 5)^2$ would have a middle term $-70x$.
- id: alg-q-2108
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Which is a perfect square trinomial?'
  choices: ['$4x^2 - 12x + 9$', '$4x^2 + 6x + 9$', '$x^2 + 10x - 25$', '$9x^2 + 9$']
  answer: 0
  explanation: |-
    $4x^2 - 12x + 9 = (2x - 3)^2$: the middle term is $-2(2x)(3)$. In $4x^2 + 6x + 9$ the middle term would need to be $12x$, and a perfect square's last term can't be negative.
- id: alg-q-2109
  lesson: alg-factor-trinomials
  module_quiz: true
  topic: Factoring
  stem: 'Factor $x^3 + 64$.'
  choices: ['$(x + 4)^3$', '$(x + 4)(x^2 + 4x + 16)$', '$(x - 4)(x^2 + 4x + 16)$', '$(x + 4)(x^2 - 4x + 16)$']
  answer: 3
  explanation: |-
    Sum of cubes with $a = x$, $b = 4$: $(a + b)(a^2 - ab + b^2)$. Signs: same, opposite, always positive.
- id: alg-q-2110
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $27y^3 - 8$.'
  choices: ['$(3y - 2)(9y^2 - 6y + 4)$', '$(3y - 2)(9y^2 + 6y + 4)$', '$(3y + 2)(9y^2 - 6y + 4)$', '$(3y - 2)^3$']
  answer: 1
  explanation: |-
    Difference of cubes, $a = 3y$, $b = 2$: $(a - b)(a^2 + ab + b^2) = (3y - 2)(9y^2 + 6y + 4)$.
- id: alg-q-2111
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $3x^3 - 12x$ completely.'
  choices: ['$3x(x - 2)^2$', '$3x(x^2 - 4)$', '$3(x^3 - 4x)$', '$3x(x + 2)(x - 2)$']
  answer: 3
  explanation: |-
    GCF $3x$: $3x(x^2 - 4)$, and $x^2 - 4 = (x + 2)(x - 2)$. Stopping at $3x(x^2 - 4)$ isn't complete.
- id: alg-q-2112
  lesson: alg-factor-trinomials
  module_quiz: true
  topic: Factoring
  stem: 'Factor $x^4 - 16$ completely.'
  choices: ['$(x^2 + 4)(x + 2)(x - 2)$', '$(x^2 + 4)(x^2 - 4)$', '$(x + 2)^2(x - 2)^2$', '$(x - 2)^4$']
  answer: 0
  explanation: |-
    $x^4 - 16 = (x^2 + 4)(x^2 - 4)$, and $x^2 - 4$ factors again. The sum of squares $x^2 + 4$ is prime.
- id: alg-q-2113
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Which trinomial is prime over the integers?'
  choices: ['$x^2 - 4x - 5$', '$x^2 + 6x + 5$', '$x^2 + 2x + 5$', '$x^2 + 4x - 5$']
  answer: 2
  explanation: |-
    Factor pairs of 5 are $\pm1, \pm5$, with sums $\pm6$, and of $-5$ the sums are $\pm4$. No pair sums to 2, so $x^2 + 2x + 5$ is prime. The others are $(x + 1)(x + 5)$, $(x - 5)(x + 1)$ and $(x + 5)(x - 1)$.
- id: alg-q-2114
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Which statement about $x^2 + 25$ is true?'
  choices: ['It equals $(x + 5)(x - 5)$', 'It equals $(x + 5)^2$', 'It is prime over the real numbers', 'It equals $(x - 5)^2$']
  answer: 2
  explanation: |-
    A sum of squares doesn't factor over the reals. $(x + 5)^2$ has a $10x$ term and $(x + 5)(x - 5) = x^2 - 25$.
- id: alg-q-2115
  lesson: alg-factor-trinomials
  topic: Factoring
  stem: 'Factor $2x^2 - 20x + 50$ completely.'
  choices: ['$(2x - 10)(x - 5)$', '$2(x - 5)^2$', '$2(x + 5)(x - 5)$', '$2(x - 5)(x - 10)$']
  answer: 1
  explanation: |-
    GCF 2: $2(x^2 - 10x + 25)$, and the trinomial is the perfect square $(x - 5)^2$. $(2x - 10)(x - 5)$ is equal but still has a common factor 2 inside.
