- id: alg-m6-r2-h38
  lesson: alg-m6-h-history
  topic: Golden ratio
  stem: 'The ratios of neighboring Fibonacci numbers, $\tfrac85$, $\tfrac{13}{8}$, $\tfrac{21}{13}$, $\tfrac{34}{21}$, …, get closer and closer to which number?'
  choices: ['$\sqrt2 \approx 1.414$', '$\tfrac{\sqrt5 - 1}{2} \approx 0.618$', '$\tfrac{1 + \sqrt5}{2} \approx 1.618$', '1.5']
  answer: 2
  explanation: |-
    The ratios are 1.6, 1.625, about 1.615 and about 1.619, closing in on the golden ratio $\varphi \approx 1.618$ from both sides. $0.618 = \tfrac1\varphi$ is the limit of the upside-down ratios $\tfrac58$, $\tfrac8{13}$, ….
