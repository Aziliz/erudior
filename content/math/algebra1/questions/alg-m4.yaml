# Systems of equations and inequalities
- id: alg-q-1301
  lesson: alg-systems-sub
  module_quiz: true
  topic: Systems of equations
  stem: 'Is $(2, -1)$ a solution of the system $3x + y = 5$, $x - 2y = 4$?'
  choices: ['Yes, it satisfies both equations', 'No, it satisfies only the first equation', 'No, it satisfies only the second equation', 'No, it satisfies neither equation']
  answer: 0
  explanation: |-
    First: $3(2) + (-1) = 5$. Second: $2 - 2(-1) = 4$. Both are true, so $(2, -1)$ is a solution.
- id: alg-q-1302
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'Solve by substitution: $y = 3x - 1$, $2x + y = 9$.'
  choices: ['$(2, 7)$', '$(5, 2)$', '$(2, 5)$', '$(\tfrac85, \tfrac{19}{5})$']
  answer: 2
  explanation: |-
    Substitute: $2x + (3x - 1) = 9$, so $5x = 10$ and $x = 2$. Then $y = 3(2) - 1 = 5$. Check: $4 + 5 = 9$. Writing the pair as $(5, 2)$ swaps the coordinates.
- id: alg-q-1303
  lesson: alg-systems-sub
  module_quiz: true
  topic: Systems of equations
  stem: 'Solve: $x + 4y = 10$, $3x - 2y = 2$.'
  choices: ['$(2, 2)$', '$(6, 1)$', '$(-2, 3)$', '$(2, -2)$']
  answer: 0
  explanation: |-
    From the first, $x = 10 - 4y$. Substitute: $3(10 - 4y) - 2y = 2$, so $30 - 14y = 2$ and $y = 2$. Then $x = 10 - 8 = 2$. $(6, 1)$ satisfies only the first equation.
- id: alg-q-1304
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'The graphs of the two equations in a system are lines that cross at $(-1, 3)$. Which statement is true?'
  choices: ['The system has the solution $(-1, 3)$', 'The system has the solution $x = 3$', 'The system has no solution', 'The system has infinitely many solutions']
  answer: 0
  explanation: |-
    The intersection point lies on both lines, so it satisfies both equations: the solution is the ordered pair $(-1, 3)$.
- id: alg-q-1305
  lesson: alg-systems-sub
  module_quiz: true
  topic: Systems of equations
  stem: 'How many solutions does the system $y = 2x + 1$, $4x - 2y = 6$ have?'
  choices: ['One', 'None', 'Infinitely many', 'Two']
  answer: 1
  explanation: |-
    The second equation is $y = 2x - 3$. Both lines have slope 2 but different intercepts, so they are parallel and never meet: no solution.
- id: alg-q-1306
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'How many solutions does the system $x - 3y = 6$, $-2x + 6y = -12$ have?'
  choices: ['One', 'None', 'Infinitely many', 'Exactly three']
  answer: 2
  explanation: |-
    The second equation is $-2$ times the first, so both describe the same line. Every point on it is a solution. Two lines can never meet in exactly three points.
- id: alg-q-1307
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'While solving a system by substitution, the variable disappears and you get $4 = 4$. What does this mean?'
  choices: ['The solution is $x = 4$', 'The system has no solution', 'The system has infinitely many solutions', 'An arithmetic mistake must have been made']
  answer: 2
  explanation: |-
    A true statement with no variable means the equations describe the same line (dependent), so there are infinitely many solutions. A false statement would mean no solution.
- id: alg-q-1308
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'Solving $y = x + 2$, $3x + 2y = 14$, a student writes $3x + 2x + 2 = 14$, so $x = \tfrac{12}{5}$. What is wrong?'
  choices: ['The expression should be substituted into $y = x + 2$ itself', 'Nothing; $x = \tfrac{12}{5}$ is correct', '$2(x + 2)$ should be $2x + 4$; the solution is $(2, 4)$', 'The equation $5x + 2 = 14$ should give $x = \tfrac{16}{5}$']
  answer: 2
  explanation: |-
    The whole expression $x + 2$ must be multiplied by 2: $3x + 2(x + 2) = 14$, so $5x + 4 = 14$, $x = 2$ and $y = 4$. Check: $6 + 8 = 14$.
- id: alg-q-1309
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'A system of two linear equations is inconsistent. What does its graph look like?'
  choices: ['Two lines crossing once', 'Two parallel lines', 'One line drawn twice', 'Two perpendicular lines']
  answer: 1
  explanation: |-
    Inconsistent means no solution, so the lines never meet: they're parallel (same slope, different intercepts). Perpendicular lines do cross, once.
- id: alg-q-1310
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'For what value of $k$ does the system $y = kx + 3$, $y = 4x - 1$ have no solution?'
  choices: ['$k = -\tfrac14$', '$k = 4$', '$k = -4$', '$k = 3$']
  answer: 1
  explanation: |-
    No solution means parallel lines: equal slopes and different intercepts. The intercepts 3 and $-1$ already differ, so $k = 4$.
- id: alg-q-1311
  lesson: alg-systems-sub
  topic: Systems of equations
  stem: 'Solve: $x = 2y + 1$, $3x - 4y = 7$.'
  choices: ['$(5, 2)$', '$(2, 5)$', '$(3, 1)$', '$(1, 0)$']
  answer: 0
  explanation: |-
    Substitute: $3(2y + 1) - 4y = 7$, so $2y + 3 = 7$ and $y = 2$. Then $x = 5$. Check: $15 - 8 = 7$. $(3, 1)$ and $(1, 0)$ satisfy the first equation only.

- id: alg-q-1401
  lesson: alg-elimination
  module_quiz: true
  topic: Systems of equations
  stem: 'Solve by elimination: $2x + y = 7$, $3x - y = 8$.'
  choices: ['$(1, 3)$', '$(3, 1)$', '$(3, -1)$', '$(5, -3)$']
  answer: 1
  explanation: |-
    The $y$-coefficients are opposites. Add: $5x = 15$, so $x = 3$. Then $2(3) + y = 7$ gives $y = 1$. Check: $9 - 1 = 8$.
- id: alg-q-1402
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'To eliminate $y$ from $3x + 4y = 2$ and $5x - 6y = 16$, which multipliers work?'
  choices: ['First by 2, second by 3, then subtract', 'First by 4, second by 6, then add', 'First by 5, second by 3, then add', 'First by 3, second by 2, then add']
  answer: 3
  explanation: |-
    The LCM of 4 and 6 is 12. Multiplying by 3 and 2 gives $12y$ and $-12y$, which cancel when added. Multiplying by 4 and 6 gives $16y$ and $-36y$, which don't.
- id: alg-q-1403
  lesson: alg-elimination
  module_quiz: true
  topic: Systems of equations
  stem: 'Solve: $3x + 4y = 2$, $5x - 6y = 16$.'
  choices: ['$(-1, 2)$', '$(2, -1)$', '$(2, 1)$', '$(4, -\tfrac52)$']
  answer: 1
  explanation: |-
    $9x + 12y = 6$ and $10x - 12y = 32$. Add: $19x = 38$, so $x = 2$. Then $6 + 4y = 2$ gives $y = -1$. Check: $10 + 6 = 16$. $(4, -\tfrac52)$ fits only the first equation.
- id: alg-q-1404
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'Using elimination, both variables cancel and you get $0 = 9$. What do you conclude?'
  choices: ['The system has no solution', 'The system has infinitely many solutions', 'The solution is $x = 0$', 'The solution is $x = 9$']
  answer: 0
  explanation: |-
    $0 = 9$ is false for every $x$ and $y$, so no pair satisfies both equations. The lines are parallel.
- id: alg-q-1405
  lesson: alg-elimination
  module_quiz: true
  topic: Systems of equations
  stem: 'Solve: $4x - 6y = 10$, $-2x + 3y = -5$.'
  choices: ['$(1, -1)$ only', 'No solution', 'Infinitely many solutions', '$(0, 0)$']
  answer: 2
  explanation: |-
    Multiply the second by 2: $-4x + 6y = -10$. Adding gives $0 = 0$, so the equations are the same line. $(1, -1)$ is one solution among infinitely many, not the only one.
- id: alg-q-1406
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'Solve: $5x + 2y = 1$, $3x + 4y = 9$.'
  choices: ['$(-1, -3)$', '$(1, -2)$', '$(3, -1)$', '$(-1, 3)$']
  answer: 3
  explanation: |-
    Multiply the first by $-2$: $-10x - 4y = -2$. Add to the second: $-7x = 7$, so $x = -1$. Then $-5 + 2y = 1$ gives $y = 3$. Check: $-3 + 12 = 9$.
- id: alg-q-1407
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'A student adds $2x + 3y = 12$ and $4x - 3y = 6$ and writes $6x = 6$. What went wrong?'
  choices: ['The right sides add to 18, so $6x = 18$ and $x = 3$', 'The $y$ terms don''t cancel', 'Equations can''t be added together', 'The left sides add to $2x$, not $6x$']
  answer: 0
  explanation: |-
    Adding equations adds both sides: $6x = 12 + 6 = 18$, so $x = 3$, and then $y = 2$. Check: $6 + 6 = 12$ and $12 - 6 = 6$.
- id: alg-q-1408
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'Solve: $0.3x + 0.2y = 1.3$, $0.5x - 0.2y = 0.3$.'
  choices: ['$(3.5, 2)$', '$(2, 0.35)$', '$(2, 3.5)$', '$(2, 3.25)$']
  answer: 2
  explanation: |-
    Add: $0.8x = 1.6$, so $x = 2$. Then $0.6 + 0.2y = 1.3$, so $0.2y = 0.7$ and $y = 3.5$. Check: $1.0 - 0.7 = 0.3$.
- id: alg-q-1409
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'Solve: $2x - 3y = -1$, $3x + 2y = 18$.'
  choices: ['$(4, -3)$', '$(3, 4)$', '$(4, 3)$', '$(5, \tfrac{11}{3})$']
  answer: 2
  explanation: |-
    Multiply by 2 and 3: $4x - 6y = -2$ and $9x + 6y = 54$. Add: $13x = 52$, $x = 4$. Then $8 - 3y = -1$ gives $y = 3$. Check: $12 + 6 = 18$.
- id: alg-q-1410
  lesson: alg-elimination
  topic: Systems of equations
  stem: 'Which method is most efficient for $y = 4x - 7$, $3x + 2y = 8$?'
  choices: ['Neither; the system can''t be solved', 'Elimination, because no coefficient is 1', 'Graphing, because it always gives exact answers', 'Substitution, because $y$ is already isolated']
  answer: 3
  explanation: |-
    With $y$ already isolated, substitute: $3x + 2(4x - 7) = 8$, so $11x = 22$, $x = 2$, $y = 1$. Graphing isn't reliably exact.

- id: alg-q-1501
  lesson: alg-system-apps
  module_quiz: true
  topic: System applications
  stem: 'A show sold 300 tickets for $2,360 in total. Adult tickets cost $10 and student tickets $6. How many adult tickets were sold?'
  choices: ['$236$', '$160$', '$140$', '$150$']
  answer: 2
  explanation: |-
    $a + s = 300$ and $10a + 6s = 2360$. Substitute $s = 300 - a$: $10a + 1800 - 6a = 2360$, so $4a = 560$ and $a = 140$ (and $s = 160$). Check: $1400 + 960 = 2360$.
- id: alg-q-1502
  lesson: alg-system-apps
  topic: System applications
  stem: 'A jar holds 30 coins, all dimes ($d$) and quarters ($q$), worth $4.50. Which system models this?'
  choices: ['$d + q = 30$ and $0.10d + 0.25q = 4.50$', '$d + q = 4.50$ and $0.10d + 0.25q = 30$', '$d + q = 30$ and $10d + 25q = 4.50$', '$0.10d = 0.25q$ and $d + q = 30$']
  answer: 0
  explanation: |-
    One equation counts coins, the other counts value in dollars. Using cents would also work, but then the total must be 450, not 4.50.
- id: alg-q-1503
  lesson: alg-system-apps
  topic: System applications
  stem: 'Thirty dimes and quarters are worth $4.50. How many quarters are there?'
  choices: ['$15$', '$20$', '$10$', '$18$']
  answer: 2
  explanation: |-
    In cents: $d + q = 30$ and $10d + 25q = 450$. Substitute $d = 30 - q$: $300 + 15q = 450$, so $q = 10$ (and $d = 20$). Check: $2.00 + 2.50 = 4.50$.
- id: alg-q-1504
  lesson: alg-system-apps
  module_quiz: true
  topic: System applications
  stem: 'How should 40% and 10% acid solutions be combined to make 60 L of a 20% solution?'
  choices: ['15 L of 40% and 45 L of 10%', '40 L of 40% and 20 L of 10%', '30 L of each', '20 L of 40% and 40 L of 10%']
  answer: 3
  explanation: |-
    $x + y = 60$ and $0.40x + 0.10y = 0.20(60) = 12$. Substitute $y = 60 - x$: $0.30x + 6 = 12$, so $x = 20$ L of 40% and $y = 40$ L of 10%. Check: $8 + 4 = 12$ L of acid.
- id: alg-q-1505
  lesson: alg-system-apps
  topic: System applications
  stem: 'A total of $12,000 is invested, part at 3% and the rest at 5% simple interest. The interest after one year is $500. How much is invested at 5%?'
  choices: ['$7,000', '$5,000', '$6,000', '$10,000']
  answer: 0
  explanation: |-
    $p + q = 12000$ and $0.03p + 0.05q = 500$. Multiply the second by 100: $3p + 5q = 50000$. Substitute $p = 12000 - q$: $36000 + 2q = 50000$, so $q = 7000$. Check: $150 + 350 = 500$.
- id: alg-q-1506
  lesson: alg-system-apps
  topic: System applications
  stem: 'A boat travels 36 miles downstream in 2 hours and returns upstream in 3 hours. What is the speed of the current?'
  choices: ['3 mph', '15 mph', '6 mph', '12 mph']
  answer: 0
  explanation: |-
    Downstream $b + c = 36/2 = 18$; upstream $b - c = 36/3 = 12$. Adding: $2b = 30$, so $b = 15$ and $c = 3$ mph. 15 mph is the boat's speed in still water.
- id: alg-q-1507
  lesson: alg-system-apps
  module_quiz: true
  topic: System applications
  stem: 'A product has fixed costs of $2,400, costs $8 per unit to make, and sells for $20 per unit. How many units must be sold to break even?'
  choices: ['$300$', '$120$', '$86$', '$200$']
  answer: 3
  explanation: |-
    Revenue $20n$ equals cost $2400 + 8n$ when $12n = 2400$, so $n = 200$. Dividing 2400 by the price alone (120) ignores the cost per unit.
- id: alg-q-1508
  lesson: alg-system-apps
  topic: System applications
  stem: 'Two numbers add to 52 and differ by 14. What is the larger number?'
  choices: ['$26$', '$19$', '$38$', '$33$']
  answer: 3
  explanation: |-
    $x + y = 52$ and $x - y = 14$. Adding: $2x = 66$, so $x = 33$ and $y = 19$.
- id: alg-q-1509
  lesson: alg-system-apps
  topic: System applications
  stem: 'A plane flies 900 miles with the wind in 2 hours and returns against the wind in 2.5 hours. What is its speed in still air?'
  choices: ['45 mph', '450 mph', '360 mph', '405 mph']
  answer: 3
  explanation: |-
    With the wind $p + w = 450$; against it $p - w = 360$. Adding: $2p = 810$, so $p = 405$ mph and the wind is 45 mph.
- id: alg-q-1510
  lesson: alg-system-apps
  topic: System applications
  stem: 'Rental company A charges $40 a day plus $0.20 a mile; company B charges $25 a day plus $0.30 a mile. For a one-day rental, at what mileage do they cost the same?'
  choices: ['300 miles', '75 miles', '50 miles', '150 miles']
  answer: 3
  explanation: |-
    $40 + 0.20m = 25 + 0.30m$, so $15 = 0.10m$ and $m = 150$. Both cost 70 dollars there; beyond 150 miles, A is cheaper.
- id: alg-q-1511
  lesson: alg-system-apps
  topic: System applications
  stem: 'A rectangle has perimeter 46, and its length is 5 more than its width. What are its dimensions?'
  choices: ['18 by 5', '14 by 9', '13 by 10', '28 by 23']
  answer: 1
  explanation: |-
    $2l + 2w = 46$ and $l = w + 5$. Substitute: $2(w + 5) + 2w = 46$, so $4w = 36$, $w = 9$ and $l = 14$.

- id: alg-q-1701
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'Which point satisfies $y > 2x - 3$?'
  choices: ['$(2, 1)$', '$(3, 2)$', '$(0, 0)$', '$(4, 4)$']
  answer: 2
  explanation: |-
    $(0, 0)$: $0 > -3$, true. The others give $2 > 3$, $1 > 1$ and $4 > 5$, all false. ($(2, 1)$ lies on the dashed boundary, which is not included.)
- id: alg-q-1702
  lesson: alg-ineq-systems
  module_quiz: true
  topic: Systems of inequalities
  stem: 'How is $x + 2y \ge 4$ graphed?'
  choices: ['Solid line, shade above', 'Dashed line, shade above', 'Solid line, shade below', 'Dashed line, shade below']
  answer: 0
  explanation: |-
    The symbol $\ge$ includes the boundary, so the line is solid. Solving, $y \ge -\tfrac12 x + 2$, which is the region above the line. Test $(0, 0)$: $0 \ge 4$ is false, so the origin's side (below) is not shaded.
- id: alg-q-1703
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'How is $3x - y < 6$ graphed?'
  choices: ['Dashed line; shade the side containing the origin', 'Solid line; shade the side containing the origin', 'Dashed line; shade the side away from the origin', 'Solid line; shade the side away from the origin']
  answer: 0
  explanation: |-
    Strict $<$ means a dashed boundary. Test $(0, 0)$: $0 < 6$ is true, so shade the origin's side.
- id: alg-q-1704
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'Which point is in the solution region of $y \le -x + 5$, $y \ge 2x - 1$, $x \ge 0$?'
  choices: ['$(1, 2)$', '$(3, 1)$', '$(-1, 2)$', '$(1, 5)$']
  answer: 0
  explanation: |-
    $(1, 2)$: $2 \le 4$, $2 \ge 1$, $1 \ge 0$, all true. $(3, 1)$ fails $1 \ge 5$; $(-1, 2)$ fails $x \ge 0$; $(1, 5)$ fails $5 \le 4$.
- id: alg-q-1705
  lesson: alg-ineq-systems
  module_quiz: true
  topic: Systems of inequalities
  stem: 'A feasible region has a vertex where the boundary lines $x + y = 10$ and $x - y = 2$ meet. What is that vertex?'
  choices: ['$(4, 6)$', '$(6, 4)$', '$(5, 5)$', '$(8, 2)$']
  answer: 1
  explanation: |-
    Add the equations: $2x = 12$, so $x = 6$ and $y = 4$. Vertices are found by solving pairs of boundary equations.
- id: alg-q-1706
  lesson: alg-ineq-systems
  module_quiz: true
  topic: Systems of inequalities
  stem: 'A feasible region has vertices $(0, 0)$, $(8, 0)$, $(6, 3)$ and $(0, 5)$. What is the maximum of $P = 2x + 5y$?'
  choices: ['$25$', '$27$', '$16$', '$40$']
  answer: 1
  explanation: |-
    Evaluate at each vertex: $0$, $16$, $12 + 15 = 27$, and $25$. The maximum is 27, at $(6, 3)$.
- id: alg-q-1707
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'A feasible region has vertices $(1, 6)$, $(3, 2)$ and $(6, 1)$. What is the minimum of $C = 4x + 3y$?'
  choices: ['$22$', '$18$', '$27$', '$13$']
  answer: 1
  explanation: |-
    $C(1, 6) = 22$, $C(3, 2) = 18$, $C(6, 1) = 27$. The minimum is 18.
- id: alg-q-1708
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'Which system of inequalities has no solution?'
  choices: ['$y > x + 2$ and $y > x - 1$', '$y > x + 2$ and $y < x - 1$', '$y < x + 2$ and $y > x - 1$', '$y > -x$ and $y < x$']
  answer: 1
  explanation: |-
    No point can be above the line $y = x + 2$ and also below the lower parallel line $y = x - 1$. The other systems have overlapping regions.
- id: alg-q-1709
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'A graph shows a dashed line $y = -2x + 1$ with the region below it shaded. Which inequality is graphed?'
  choices: ['$y < -2x + 1$', '$y \le -2x + 1$', '$y > -2x + 1$', '$y \ge -2x + 1$']
  answer: 0
  explanation: |-
    Dashed means strict, and below the line means $y$ is less than the line's value: $y < -2x + 1$.
- id: alg-q-1710
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'Why is $(0, 0)$ a poor test point for graphing $y > 3x$?'
  choices: ['The boundary line is vertical', 'It satisfies every inequality', 'It lies on the boundary line, so it can''t show which side to shade', 'Test points must have positive coordinates']
  answer: 2
  explanation: |-
    The boundary $y = 3x$ passes through the origin. Use a point off the line, such as $(1, 0)$: $0 > 3$ is false, so shade the other side (above the line).
- id: alg-q-1711
  lesson: alg-ineq-systems
  topic: Systems of inequalities
  stem: 'A student tutors $x$ hours at 12 dollars per hour and works $y$ hours at a café at 15 dollars per hour. She wants to earn at least 300 dollars while working at most 25 hours. Which system models this?'
  choices: ['$15x + 12y \ge 300$, $x + y \le 25$, $x \ge 0$, $y \ge 0$', '$12x + 15y \le 300$, $x + y \ge 25$, $x \ge 0$, $y \ge 0$', '$12x + 15y \ge 25$, $x + y \le 300$, $x \ge 0$, $y \ge 0$', '$12x + 15y \ge 300$, $x + y \le 25$, $x \ge 0$, $y \ge 0$']
  answer: 3
  explanation: |-
    Earnings $12x + 15y$ must be at least 300; hours $x + y$ at most 25; and hours can't be negative.
