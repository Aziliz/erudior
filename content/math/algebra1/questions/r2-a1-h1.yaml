- id: a1-h1-r2-h45
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'To convert 3 hours to seconds, multiply 3 h by which conversion factor?'
  choices: ['$\dfrac{1 \text{ h}}{3600 \text{ s}}$', '$\dfrac{60 \text{ s}}{1 \text{ h}}$', '$\dfrac{1 \text{ h}}{60 \text{ min}}$', '$\dfrac{3600 \text{ s}}{1 \text{ h}}$']
  answer: 3
  explanation: 'A conversion factor equals 1 and is arranged so the unwanted unit cancels: $3 \text{ h} \times \tfrac{3600 \text{ s}}{1 \text{ h}} = 10{,}800$ s. The upside-down factor leaves h²/s, $\tfrac{60 \text{ s}}{1 \text{ h}}$ is false (an hour is 3600 s), and $\tfrac{1 \text{ h}}{60 \text{ min}}$ doesn''t produce seconds.'
# Lesson 93: Recursive models
- id: a1-h1-r2-h46
  lesson: a1-h1-recursive
  module_quiz: true
  topic: Recursive models
  stem: 'A patient takes 100 mg of a medicine every 12 hours, and between doses the body removes 30% of the medicine present. Which rule gives the amount $a_n$ just after the $n$th dose?'
  choices: ['$a_n = 0.3\,a_{n-1} + 100$', '$a_n = 0.7(a_{n-1} + 100)$', '$a_n = 0.7\,a_{n-1} + 100$', '$a_n = 1.3\,a_{n-1} - 100$']
  answer: 2
  explanation: 'If 30% is removed, 70% remains: multiply by 0.7, then add the new dose of 100. $0.3$ is the fraction removed, not the fraction left; $0.7(a_{n-1} + 100)$ would remove 30% of the new dose too before it is measured.'
- id: a1-h1-r2-h47
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'A sequence has $a_1 = 100$ and $a_n = 0.5\,a_{n-1} + 40$. What is $a_3$?'
  choices: ['90', '55', '85', '65']
  answer: 2
  explanation: '$a_2 = 0.5(100) + 40 = 90$, then $a_3 = 0.5(90) + 40 = 85$. 90 is $a_2$, one step short. 55 comes from adding 40 before halving each time ($0.5(140) = 70$, then $0.5(110) = 55$). 65 halves twice but adds 40 only once: $0.25(100) + 40$.'
- id: a1-h1-r2-h48
  lesson: a1-h1-recursive
  module_quiz: true
  topic: Recursive models
  stem: 'What is the equilibrium of $a_n = 0.8\,a_{n-1} + 30$?'
  choices: ['150', '37.5', '$-150$', '24']
  answer: 0
  explanation: 'Solve $E = 0.8E + 30$: $0.2E = 30$, so $E = 150$. Check: $0.8(150) + 30 = 150$ ✓. 37.5 is $30 \div 0.8$ (dividing by $r$ instead of $1 - r$), $-150$ is a sign error, and 24 is $0.8 \times 30$.'
- id: a1-h1-r2-h49
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'A population follows $P_n = 1.1\,P_{n-1} - 50$, whose equilibrium is 500. If $P_0 = 520$, what happens over time (in the model)?'
  choices: ['It decreases toward 500', 'It grows, moving farther and farther above 500', 'It stays at 520', 'It drops below 500 and then levels off']
  answer: 1
  explanation: 'Because $r = 1.1 > 1$, the distance from equilibrium is multiplied by 1.1 each step: $20, 22, 24.2, \dots$ above 500. So $P_1 = 522$, $P_2 = 524.2$, and so on: the equilibrium is unstable and the population moves away from it.'
- id: a1-h1-r2-h50
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'A sequence has $a_1 = 50$ and $a_n = 0.5\,a_{n-1} + 30$. Which explicit formula gives the same terms?'
  choices: ['$a_n = 60 + 10(0.5)^{n-1}$', '$a_n = 50 + 30(n - 1)$', '$a_n = 60 - 10(0.5)^{n-1}$', '$a_n = 50(0.5)^{n-1}$']
  answer: 2
  explanation: '$E = \tfrac{30}{1 - 0.5} = 60$ and $a_1 - E = 50 - 60 = -10$, so $a_n = 60 - 10(0.5)^{n-1}$. Check: $a_2 = 60 - 5 = 55$, and the rule gives $0.5(50) + 30 = 55$ ✓. The plus version starts at 70; the others are arithmetic or plain geometric.'
- id: a1-h1-r2-h51
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'The "add, then multiply" rule $a_n = 0.9(a_{n-1} + 50)$ is the same as which "multiply, then add" rule?'
  choices: ['$a_n = 0.9\,a_{n-1} + 50$', '$a_n = 0.9\,a_{n-1} + 45$', '$a_n = a_{n-1} + 45$', '$a_n = 0.9\,a_{n-1} + 55$']
  answer: 1
  explanation: 'Distribute: $0.9(a_{n-1} + 50) = 0.9\,a_{n-1} + 45$. The 50 is reduced along with everything else, so the order of the steps changes $d$.'
- id: a1-h1-r2-h52
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'An account starts at \$0. At the end of each month it earns 1% interest and then a \$200 deposit is added: $B_n = 1.01\,B_{n-1} + 200$. What is the balance after 3 months?'
  choices: ['\$600.00', '\$612.08', '\$618.18', '\$606.02']
  answer: 3
  explanation: '$B_1 = 1.01(0) + 200 = 200$, $B_2 = 1.01(200) + 200 = 402$, $B_3 = 1.01(402) + 200 = 606.02$. \$600 ignores interest; \$612.08 adds each deposit before the interest; \$618.18 gives every deposit three months of interest.'
- id: a1-h1-r2-h53
  lesson: a1-h1-recursive
  module_quiz: true
  topic: Recursive models
  stem: 'Subtracting $E = rE + d$ from $a_n = r\,a_{n-1} + d$ gives $a_n - E = r(a_{n-1} - E)$. What does this show about the distances $a_n - E$?'
  choices: ['They form a geometric sequence with ratio $r$', 'They form an arithmetic sequence with difference $d$', 'They are all equal', 'They form a geometric sequence with ratio $d$']
  answer: 0
  explanation: 'Each distance is $r$ times the one before, which is exactly a geometric sequence with ratio $r$. That is why $a_n = E + (a_1 - E)\,r^{\,n-1}$, and why the terms approach $E$ when $0 < r < 1$.'
- id: a1-h1-r2-h54
  lesson: a1-h1-recursive
  module_quiz: true
  topic: Recursive models
  type: text
  stem: 'Find the equilibrium of $a_n = 0.6\,a_{n-1} + 12$. $E =$ ___'
  accept: ['30']
  explanation: '$E = 0.6E + 12$, so $0.4E = 12$ and $E = 30$. Check: $0.6(30) + 12 = 18 + 12 = 30$ ✓.'
- id: a1-h1-r2-h55
  lesson: a1-h1-recursive
  topic: Recursive models
  type: text
  stem: 'In a medicine model $a_n = 0.75\,a_{n-1} + d$, what fraction of the medicine does the body remove between doses? Give it as a decimal. ___'
  accept: ['0.25', '1/4', '25%']
  explanation: '$r = 0.75$ is the fraction that remains, so $1 - 0.75 = 0.25$ (25%) is removed.'
- id: a1-h1-r2-h56
  lesson: a1-h1-recursive
  topic: Recursive models
  type: order
  stem: 'Put the steps for finding $a_{20}$ of $a_n = r\,a_{n-1} + d$ (with $a_1$ known) without computing all the terms in order.'
  items: ['Find the equilibrium $E = \dfrac{d}{1 - r}$', 'Find the starting distance $a_1 - E$', 'Write $a_n = E + (a_1 - E)\,r^{\,n-1}$', 'Substitute $n = 20$ and evaluate']
  explanation: 'The starting distance needs $E$, and the explicit formula needs both $E$ and $a_1 - E$; only then can you substitute $n = 20$.'
- id: a1-h1-r2-h57
  lesson: a1-h1-recursive
  topic: Recursive models
  type: match
  stem: 'Match each rule to its long-run behavior when the first term is 0.'
  pairs:
    - ['$a_n = 0.5\,a_{n-1} + 10$', Approaches 20]
    - ['$a_n = 2\,a_{n-1} - 10$', Moves farther and farther from 10]
    - ['$a_n = a_{n-1} + 10$', Grows by 10 each step forever]
    - ['$a_n = 0.5\,a_{n-1} + 5$', Approaches 10]
  distractors: [Stays at 0]
  explanation: '$0.5a + 10$: $E = \tfrac{10}{0.5} = 20$, stable. $2a - 10$: $E = \tfrac{-10}{1 - 2} = 10$, and $r = 2 > 1$, so starting at 0 it goes $-10, -30, -70, \dots$, away from 10. $a + 10$ is arithmetic with no equilibrium. $0.5a + 5$: $E = 10$, stable.'
- id: a1-h1-r2-h58
  lesson: a1-h1-recursive
  module_quiz: true
  topic: Recursive models
  stem: 'Which rules have a stable equilibrium, one that the terms approach from any starting value? Select all that apply.'
  choices: ['$a_n = 0.9\,a_{n-1} + 5$', '$a_n = 0.2\,a_{n-1} - 4$', '$a_n = 1.5\,a_{n-1} + 5$', '$a_n = a_{n-1} + 5$']
  answer: [0, 1]
  explanation: 'Stable means $0 < r < 1$: $0.9a + 5$ approaches $E = 50$, and $0.2a - 4$ approaches $E = \tfrac{-4}{0.8} = -5$ (a negative $d$ is fine). With $r = 1.5$ the equilibrium $-10$ is unstable, and $a + 5$ has no equilibrium.'
- id: a1-h1-r2-h59
  lesson: a1-h1-recursive
  topic: Recursive models
  type: label
  stem: 'This picture shows the medicine model $a_n = r\,a_{n-1} + d$ as a tank. Name the numbered parts.'
  image: {src: images/a1-h1-dose-tank-blank.svg, alt: 'An open tank partly filled with liquid. An arrow comes down into the tank from above, the liquid inside is shaded, and an arrow leaves through a small outlet at the bottom. Three parts are numbered.'}
  labels:
    - {x: 50, y: 18.2, text: Dose d added each step}
    - {x: 50, y: 61.4, text: Amount carried over (r times the last amount)}
    - {x: 50, y: 90.9, text: Fraction 1 − r removed between doses}
  distractors: [Equilibrium amount E]
  explanation: 'The new dose $d$ flows in, the body removes the fraction $1 - r$ between doses, and the fraction $r$ of the previous amount carries over, so $a_n = r\,a_{n-1} + d$.'
- id: a1-h1-r2-h60
  lesson: a1-h1-recursive
  topic: Recursive models
  stem: 'For $a_n = 0.5\,a_{n-1} + 50$ with $a_1 = 50$, the explicit formula is $a_n = 100 - 50(0.5)^{n-1}$. What is the first $n$ for which $a_n$ is within 1 of the equilibrium 100?'
  choices: ['7', '6', '8', '50']
  answer: 0
  explanation: 'Need $50(0.5)^{n-1} \le 1$. $n = 6$: $50(0.5)^5 = 1.5625$, too big. $n = 7$: $50(0.5)^6 = 0.78125$ ✓. So $n = 7$, with $a_7 \approx 99.22$. 50 is the value of $a_1$, not a position.'
