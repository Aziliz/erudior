    - {x: 41.7, y: 16.7, text: Added row of n dots}
    - {x: 83.3, y: 16.7, text: Single corner dot}
  distractors: [Row of n + 1 dots]
  explanation: 'The 4-by-4 block has $n^2 = 16$ dots. Growing it takes a column of $n$, a row of $n$ and one corner dot, so $(n + 1)^2 = n^2 + 2n + 1$ and the two squares differ by $2n + 1 = 9$.'
# Lesson 91: Equivalence and extraneous solutions
- id: a1-h1-r2-h16
  lesson: a1-h1-equivalence
  module_quiz: true
  topic: Equivalence and extraneous solutions
  stem: 'Which step, applied to both sides of an equation, can introduce an extraneous solution?'
  choices: ['Adding 7', 'Squaring', 'Dividing by 4', 'Combining like terms on one side']
  answer: 1
  explanation: 'Squaring turns $a = b$ and $a = -b$ into the same equation $a^2 = b^2$, so it can bring in solutions of the "opposite sign" equation. Adding a number, dividing by a nonzero number and rewriting a side can all be undone, so they keep the same solutions.'
- id: a1-h1-r2-h17
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'A student solves $x^2 = 7x$ by dividing both sides by $x$ and gets $x = 7$. What is the complete solution set?'
  choices: ['$\{7\}$', '$\{-7, 7\}$', '$\{0\}$', '$\{0, 7\}$']
  answer: 3
  explanation: 'Dividing by $x$ assumes $x \neq 0$ and loses the solution 0. Factoring keeps both: $x^2 - 7x = 0$, $x(x - 7) = 0$, so $x = 0$ or $x = 7$. $-7$ doesn''t work: $49 \neq -49$.'
- id: a1-h1-r2-h18
  lesson: a1-h1-equivalence
  module_quiz: true
  topic: Equivalence and extraneous solutions
  stem: 'Solve $\sqrt{x + 2} = x$.'
  choices: ['$x = 2$ only', '$x = -1$ only', '$x = 2$ or $x = -1$', 'No solution']
  answer: 0
  explanation: 'Square: $x + 2 = x^2$, so $x^2 - x - 2 = 0$ and $(x - 2)(x + 1) = 0$. Check: $x = 2$ gives $\sqrt4 = 2$ ✓; $x = -1$ gives $\sqrt1 = 1 \neq -1$ ✗. So $-1$ is extraneous and the only solution is 2. Listing both skips the check.'
- id: a1-h1-r2-h19
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  type: text
  stem: 'Solve $\sqrt{x + 4} + 2 = x$. Give only the number. $x =$ ___'
  accept: ['5']
  explanation: 'Isolate the root: $\sqrt{x + 4} = x - 2$. Square: $x + 4 = x^2 - 4x + 4$, so $x^2 - 5x = 0$ and $x = 0$ or $x = 5$. Check: $x = 0$ gives $\sqrt4 + 2 = 4 \neq 0$ ✗; $x = 5$ gives $\sqrt9 + 2 = 5$ ✓. The solution is 5.'
- id: a1-h1-r2-h20
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'After squaring both sides of a radical equation, why must candidates be checked in the original equation and not in the squared one?'
  choices: ['The squared equation has no solutions', 'Every candidate satisfies the squared equation, so only the original can reveal an extraneous one', 'The original equation is easier to evaluate', 'Squaring always doubles each solution']
  answer: 1
  explanation: 'The candidates were found by solving the squared equation, so they all satisfy it; checking there proves nothing. Squaring can add solutions of the opposite-sign equation, and only the original equation tells them apart.'
- id: a1-h1-r2-h21
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'Solve $|x + 3| = 2x$.'
  choices: ['$x = -1$ only', '$x = -1$ or $x = 3$', '$x = 3$ only', 'No solution']
  answer: 2
  explanation: 'Split: $x + 3 = 2x$ gives $x = 3$; $x + 3 = -2x$ gives $x = -1$. Check: $x = 3$: $|6| = 6$ ✓. $x = -1$: $|2| = 2$, but $2x = -2$ ✗. An absolute value can''t be negative, so the right side needs $2x \ge 0$, which rules out $-1$.'
- id: a1-h1-r2-h22
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'What is the solution of $\dfrac{x}{x - 2} = \dfrac{2}{x - 2}$?'
  choices: ['No solution', '$x = 2$', '$x = 0$', 'Every real number except 2']
  answer: 0
  explanation: 'Multiplying by $x - 2$ gives $x = 2$, but at $x = 2$ both denominators are 0, so the equation isn''t defined there. The only candidate is excluded, so there is no solution. For any other $x$ the two fractions have different numerators, so they aren''t equal.'
- id: a1-h1-r2-h23
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'What is the best first step for solving $\sqrt{x - 1} + 3 = x$?'
  choices: ['Square both sides', 'Subtract $x$ from both sides', 'Subtract 3 from both sides', 'Take the square root of both sides']
  answer: 2
  explanation: 'Isolate the root first: $\sqrt{x - 1} = x - 3$. Squaring with the $+3$ still attached gives $(\sqrt{x - 1} + 3)^2 = x - 1 + 6\sqrt{x - 1} + 9$, which still contains a root.'
- id: a1-h1-r2-h24
  lesson: a1-h1-equivalence
  module_quiz: true
  topic: Equivalence and extraneous solutions
  stem: 'What is the solution of $\sqrt{x} = -5$?'
  choices: ['$x = 25$', '$x = -25$', '$x = \pm 25$', 'No solution']
  answer: 3
  explanation: 'A principal square root is never negative, so no $x$ works. Squaring gives the candidate 25, but $\sqrt{25} = 5$, not $-5$, so it is extraneous. $\sqrt{-25}$ is not a real number.'
- id: a1-h1-r2-h25
  lesson: a1-h1-equivalence
  module_quiz: true
  topic: Equivalence and extraneous solutions
  type: text
  stem: 'A number produced by the solving process that does not satisfy the original equation is called a(n) ___ solution.'
  accept: [extraneous]
  explanation: 'Extraneous solutions come from steps that aren''t reversible, such as squaring both sides or multiplying by an expression that can be 0.'
- id: a1-h1-r2-h26
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  type: order
  stem: 'Put the steps for solving $\sqrt{x + 6} = x$ in order.'
  items: ['Square both sides: $x + 6 = x^2$', 'Rewrite as $x^2 - x - 6 = 0$', 'Factor: $(x - 3)(x + 2) = 0$', 'List the candidates $x = 3$ and $x = -2$', 'Check each candidate in the original equation']
  explanation: 'The root is already isolated, so square first, solve the quadratic, and check every candidate in the original equation: 3 works and $-2$ is extraneous.'
- id: a1-h1-r2-h27
  lesson: a1-h1-equivalence
  module_quiz: true
  topic: Equivalence and extraneous solutions
  type: match
  stem: 'Match each step, applied to both sides of an equation, to its possible effect on the solutions.'
  pairs:
    - ['Adding 5', Keeps the same solutions]
    - ['Multiplying by $-3$', Keeps the same solutions]
    - ['Dividing by $x$', Can lose a solution]
    - ['Taking the square root without $\pm$', Can lose a solution]
    - [Squaring, Can add a solution]
  explanation: 'Adding a number and multiplying by a nonzero number are reversible. Dividing by $x$ fails when $x = 0$, and dropping $\pm$ loses the negative root; both can lose solutions. Squaring can add solutions of the opposite-sign equation.'
- id: a1-h1-r2-h28
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'Which steps are reversible for every value of $x$, so they never change the solution set? Select all that apply.'
  choices: ['Subtracting $2x$ from both sides', 'Multiplying both sides by $-4$', 'Multiplying both sides by $x$', 'Squaring both sides']
  answer: [0, 1]
  explanation: 'Subtracting $2x$ is undone by adding $2x$, and multiplying by $-4$ is undone by dividing by $-4$. Multiplying by $x$ can''t be undone when $x = 0$ (it can add the solution 0), and squaring can add solutions.'
- id: a1-h1-r2-h29
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  type: text
  stem: 'Squaring both sides of $\sqrt{3x + 1} = x - 1$ gives two candidates. Which candidate is extraneous? Give only the number. ___'
  accept: ['0']
  explanation: 'Square: $3x + 1 = x^2 - 2x + 1$, so $x^2 - 5x = 0$ and $x = 0$ or $x = 5$. Check: $x = 5$: $\sqrt{16} = 4 = 5 - 1$ ✓. $x = 0$: $\sqrt1 = 1$, but $0 - 1 = -1$ ✗. So 0 is extraneous.'
- id: a1-h1-r2-h30
  lesson: a1-h1-equivalence
  topic: Equivalence and extraneous solutions
  stem: 'Squaring $\sqrt{x + 6} = x$ gives the candidates 3 and $-2$. On a graph, $x = -2$ is where the curve $y = \sqrt{x + 6}$ meets which line?'
  choices: ['$y = x$', '$y = 2$', 'The $x$-axis', '$y = -x$']
  answer: 3
  explanation: 'At $x = -2$ the curve has height $\sqrt4 = 2$, and $y = -x$ also has height 2 there. The extraneous candidate solves the partner equation $\sqrt{x + 6} = -x$. The line $y = x$ has height $-2$ at $x = -2$, so it meets the curve only at $x = 3$.'
# Lesson 92: The modeling cycle
- id: a1-h1-r2-h31
  lesson: a1-h1-modeling
  module_quiz: true
  topic: The modeling cycle
  stem: 'A model of a cooling cup of tea predicts that it will reach 5 °C in a room kept at 21 °C. In which stage of the modeling cycle should this problem be caught?'
  choices: ['Validate', 'Compute', 'Report', 'Problem']
  answer: 0
  explanation: 'Validation compares predictions with data and common sense, including what happens at the extremes. Tea can''t cool below room temperature, so the model must be revised (go back to Formulate) before anything is reported.'
- id: a1-h1-r2-h32
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'Convert 72 kilometers per hour to meters per second.'
  choices: ['259.2 m/s', '1.2 m/s', '20 m/s', '72,000 m/s']
  answer: 2
  explanation: '$72\,\tfrac{\text{km}}{\text{h}} \times \tfrac{1000 \text{ m}}{1 \text{ km}} \times \tfrac{1 \text{ h}}{3600 \text{ s}} = \tfrac{72{,}000}{3600} = 20$ m/s. 259.2 comes from multiplying by 3600 instead of dividing; 1.2 from dividing by 60 only; 72,000 is meters per hour.'
- id: a1-h1-r2-h33
  lesson: a1-h1-modeling
  module_quiz: true
  topic: The modeling cycle
  stem: 'A distance $d$ is in meters, a speed $v$ in meters per second, a time $t$ in seconds, and an acceleration $a$ in meters per second squared. Which formula must be wrong, because its units don''t match?'
  choices: ['$d = vt$', '$d = \tfrac12 at^2$', '$d = \dfrac{v^2}{2a}$', '$d = v + t$']
  answer: 3
  explanation: 'A speed (m/s) and a time (s) can''t be added. The others work: $\tfrac{\text{m}}{\text{s}} \cdot \text{s} = \text{m}$; $\tfrac{\text{m}}{\text{s}^2} \cdot \text{s}^2 = \text{m}$; $\tfrac{\text{m}^2/\text{s}^2}{\text{m}/\text{s}^2} = \text{m}$.'
- id: a1-h1-r2-h34
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'A Fermi estimate multiplies five assumed numbers. If one of them is 20% too low and the rest are right, how far off is the estimate?'
  choices: ['About 4% too low', '20% too low', '100% too low', 'It depends on which of the five it is']
  answer: 1
  explanation: 'In a product, scaling one factor by 0.8 scales the whole product by 0.8, whichever factor it is. So the estimate is 20% too low. Errors aren''t divided among the factors.'
- id: a1-h1-r2-h35
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'Coffee poured at 90 °C cools in a 20 °C room following $T = 20 + 70\left(\tfrac12\right)^{t/10}$, with $t$ in minutes. What is the temperature after 20 minutes?'
  choices: ['17.5 °C', '37.5 °C', '55 °C', '22.5 °C']
  answer: 1
  explanation: '$\left(\tfrac12\right)^{20/10} = \tfrac14$, so $T = 20 + 70 \cdot \tfrac14 = 20 + 17.5 = 37.5$ °C. 17.5 leaves out the room temperature; 55 is the value at 10 minutes; 22.5 halves the whole temperature, $90 \cdot \tfrac14$, which ignores the room.'
- id: a1-h1-r2-h36
  lesson: a1-h1-modeling
  module_quiz: true
  topic: The modeling cycle
  stem: 'Which situation is best modeled by a shifted exponential $y = L + a \cdot b^x$ with $0 < b < 1$?'
  choices: ['A savings balance earning 3% a year', 'A taxi fare of \$3 plus \$2 per mile', 'A cold soda warming toward room temperature', 'The height of a thrown ball over time']
  answer: 2
  explanation: 'The soda''s distance from room temperature shrinks by the same factor in equal times, and its temperature levels off at room temperature $L$. Compound interest grows exponentially with no level ($b > 1$), the fare is linear, and the ball''s height is quadratic.'
- id: a1-h1-r2-h37
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'In the lesson, the first coffee model $T = 90(0.611)^{t/10}$ matched the readings at 0 and 10 minutes. Why was it rejected?'
  choices: ['It predicts the coffee approaches 0 °C, below room temperature', 'It used too many data points', 'Exponential functions can''t model temperature', 'Its units were wrong']
  answer: 0
  explanation: 'As $t$ grows, $90(0.611)^{t/10}$ approaches 0, but coffee in a 20 °C room levels off at 20 °C. It also cooled too fast at 20 minutes (33.6 °C versus 37 measured). The revised model applies the exponential to the difference $T - 20$.'
- id: a1-h1-r2-h38
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'A Fermi estimate of a family''s yearly shower water comes out to 17,520 gallons. Which is the best way to report it?'
  choices: ['"Exactly 17,520 gallons a year."', '"17,520.0 gallons a year."', '"Somewhere between 1 and 1,000,000 gallons."', '"Roughly 15,000 to 20,000 gallons a year, assuming daily 8-minute showers."']
  answer: 3
  explanation: 'The answer rests on rough assumptions, so it should be rounded, given as a range and tied to its assumptions. Reporting 17,520 or 17,520.0 claims precision the model doesn''t have; a range from 1 to a million is too vague to be useful.'
- id: a1-h1-r2-h39
  lesson: a1-h1-modeling
  module_quiz: true
  topic: The modeling cycle
  type: text
  stem: 'There are 5,280 feet in a mile and 3,600 seconds in an hour. A car going 60 miles per hour travels ___ feet per second.'
  accept: ['88']
  explanation: '$60 \times \tfrac{5280}{3600} = \tfrac{316{,}800}{3600} = 88$ ft/s. Miles cancel with miles and hours with hours, leaving feet per second.'
- id: a1-h1-r2-h40
  lesson: a1-h1-modeling
  topic: The modeling cycle
  type: text
  stem: 'Estimate the shower water a family of 4 uses in 30 days, assuming one 6-minute shower per person per day and a showerhead that delivers 2 gallons per minute. Give only the number of gallons. ___'
  accept: ['1440', '1,440']
  explanation: '$4 \times 1 \times 6 \text{ min} \times 2 \tfrac{\text{gal}}{\text{min}} \times 30 = 1440$ gallons. The units chain (people × showers per person per day × minutes per shower × gallons per minute × days) leaves only gallons.'
- id: a1-h1-r2-h41
  lesson: a1-h1-modeling
  topic: The modeling cycle
  type: order
  stem: 'Put the stages of the modeling cycle in order, for a model that passes validation on the first try.'
  items: ['Identify the question to answer', 'Choose variables, assumptions and a type of function', 'Do the math: solve, evaluate or fit', 'Translate the result back into the situation, with units', 'Check the result against data, units and common sense', 'Report the answer with its assumptions']
  explanation: 'Problem, formulate, compute, interpret, validate, report. If validation had failed, the cycle would return to formulate and go around again.'
- id: a1-h1-r2-h42
  lesson: a1-h1-modeling
  module_quiz: true
  topic: The modeling cycle
  type: match
  stem: 'Match each situation to the type of function that best models it.'
  pairs:
    - ['A phone plan: \$30 for up to 5 GB, then \$10 per extra GB', Piecewise]
    - [A bacteria population that doubles every hour, Exponential]
    - [Pay of \$15 per hour worked, Linear]
    - [Hot soup cooling toward room temperature, Shifted exponential]
    - [The height of a ball thrown upward, Quadratic]
  explanation: 'The phone plan''s rule changes at 5 GB (piecewise). Doubling is a constant percent change (exponential). A fixed amount per hour is linear. Cooling levels off at room temperature (shifted exponential). A thrown ball rises and falls along a parabola (quadratic).'
- id: a1-h1-r2-h43
  lesson: a1-h1-modeling
  topic: The modeling cycle
  stem: 'Which of these are part of validating a model? Select all that apply.'
  choices: ['Comparing its predictions with measured data', 'Checking what it predicts for very large inputs', 'Checking that the units of the answer make sense', 'Writing the answer with more decimal places']
  answer: [0, 1, 2]
  explanation: 'Validation asks whether the model''s answers are believable: against data, at the extremes and in their units. Adding decimal places doesn''t test anything, and it usually overstates the precision.'
