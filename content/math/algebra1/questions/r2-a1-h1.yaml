# Honors module a1-h1 (Algebraic reasoning and modeling), round 2
# Lesson 90: Proving it with algebra
- id: a1-h1-r2-h01
  lesson: a1-h1-proof
  module_quiz: true
  topic: Algebraic proof
  stem: 'In a proof about odd numbers, which expression stands for any odd number? ($k$ is an integer.)'
  choices: ['$2k + 1$', '$k + 1$', '$2k$', '$k^2 + 1$']
  answer: 0
  explanation: 'An odd number is 1 more than an even number, and an even number is $2k$, so an odd number is $2k + 1$. $k + 1$ can be even (take $k = 1$), $2k$ is even, and $k^2 + 1$ is even whenever $k$ is odd.'
- id: a1-h1-r2-h02
  lesson: a1-h1-proof
  module_quiz: true
  topic: Algebraic proof
  stem: 'A student checks a statement about whole numbers $n$ for every $n$ from 1 to 1,000, and it is true each time. What can she conclude?'
  choices: ['The statement is proved for every whole number', 'The statement is false', 'The statement is a conjecture: well supported, but not yet proved for every $n$', 'The statement is proved for every $n$ up to 2,000']
  answer: 2
  explanation: 'Examples can''t cover infinitely many cases. $n^2 + n + 41$ is prime for $n = 0$ to 39 and then fails at $n = 40$. Until there is a general argument, the statement is a conjecture. Nothing was shown about $n$ beyond 1,000, and nothing suggests it is false.'
- id: a1-h1-r2-h03
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'The lesson proved that the sum of three consecutive integers is $3(n + 1)$, three times the middle one. Three consecutive integers add up to 162. What is the middle integer?'
  choices: ['53', '54', '55', '81']
  answer: 1
  explanation: '$3(n + 1) = 162$, so the middle integer is $n + 1 = 54$ (the integers are 53, 54, 55). 53 is the smallest, 55 the largest, and 81 comes from dividing by 2 instead of 3.'
- id: a1-h1-r2-h04
  lesson: a1-h1-proof
  module_quiz: true
  topic: Algebraic proof
  stem: 'Which value of $x$ is a counterexample to "for every real number $x$, $x^2 \ge x$"?'
  choices: ['$x = 2$', '$x = -3$', '$x = 1$', '$x = \tfrac13$']
  answer: 3
  explanation: '$\left(\tfrac13\right)^2 = \tfrac19$, which is less than $\tfrac13$, so the statement fails. For $x = 2$: $4 \ge 2$; for $x = -3$: $9 \ge -3$; for $x = 1$: $1 \ge 1$. Those all satisfy it. Fractions between 0 and 1 are good places to hunt for counterexamples.'
- id: a1-h1-r2-h05
  lesson: a1-h1-proof
  module_quiz: true
  topic: Algebraic proof
  stem: 'A "proof" that $2 = 1$ starts with $a = b$ (and $a \neq 0$) and takes these steps: multiply by $a$ to get $a^2 = ab$; subtract $b^2$; factor to get $(a + b)(a - b) = b(a - b)$; divide by $a - b$ to get $a + b = b$; so $2b = b$ and $2 = 1$. Which step is illegal?'
  choices: ['Multiplying both sides by $a$', 'Subtracting $b^2$ from both sides', 'Factoring both sides', 'Dividing both sides by $a - b$']
  answer: 3
  explanation: 'Since $a = b$, the quantity $a - b$ is 0, and dividing by 0 is undefined. Every statement before that step is true; the false conclusion comes in only when dividing by zero.'
- id: a1-h1-r2-h06
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'A student writes: "Let the two odd numbers be $2k + 1$ and $2k + 1$. Their sum is $4k + 2 = 2(2k + 1)$, which is even." What is wrong with this proof?'
  choices: ['It only covers an odd number added to itself', 'It should have written the odd numbers as $2k$', 'The sum $4k + 2$ is actually odd', 'Nothing: it proves the sum of any two odd numbers is even']
  answer: 0
  explanation: 'Using the same letter makes both numbers equal, so the proof only covers cases like $7 + 7$. Two different letters, $2j + 1$ and $2k + 1$, are needed: their sum $2(j + k + 1)$ is even. $2k$ is even, not odd, and $4k + 2 = 2(2k + 1)$ is even.'
- id: a1-h1-r2-h07
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'The digit-reversal proof showed that $(10a + b) - (10b + a) = 9(a - b)$. Without subtracting, what is $91 - 19$?'
  choices: ['$81$', '$72$', '$18$', '$63$']
  answer: 1
  explanation: 'Here $a = 9$ and $b = 1$, so the difference is $9(9 - 1) = 9 \cdot 8 = 72$. Check: $91 - 19 = 72$. 81 would be $9 \cdot 9$, 18 is $9 \cdot 2$, and 63 is $9 \cdot 7$.'
- id: a1-h1-r2-h08
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'Which statement is proved by the line $(2k + 1)^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$, where $k$ is an integer?'
  choices: ['The square of any even number is even', 'Every odd number is a perfect square', 'The square of any odd number is odd', 'The sum of two squares is odd']
  answer: 2
  explanation: '$2k + 1$ stands for any odd number, and the result has the form $2(\text{integer}) + 1$, which is odd. So the square of any odd number is odd. The line says nothing about even numbers or sums of squares, and 3 is odd but not a perfect square.'
- id: a1-h1-r2-h09
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'You want to prove by contradiction that no integers $x$ and $y$ satisfy $x^2 - y^2 = 6$. What do you assume first?'
  choices: ['That no integers satisfy $x^2 - y^2 = 6$', 'That there are integers $x$ and $y$ with $x^2 - y^2 = 6$', 'That $x$ and $y$ are both even', 'That $x^2 - y^2 = 6$ has no real solutions']
  answer: 1
  explanation: 'A proof by contradiction assumes the opposite of the claim: that integers $x$, $y$ with $x^2 - y^2 = 6$ exist. Then $(x - y)(x + y) = 6$ with both factors even (product a multiple of 4) or both odd (product odd), and 6 is neither, which is the contradiction. Assuming the claim itself would be circular, and the equation does have real solutions, such as $x = \sqrt6$, $y = 0$.'
- id: a1-h1-r2-h10
  lesson: a1-h1-proof
  module_quiz: true
  topic: Algebraic proof
  type: text
  stem: 'A single example that shows a "for every number" statement is false is called a ___.'
  accept: [counterexample, counterexamples, counter-example, counter example]
  explanation: 'One counterexample is enough to disprove an "always" statement, no matter how many cases work. For example, $n = 40$ is a counterexample to "$n^2 + n + 41$ is always prime."'
- id: a1-h1-r2-h11
  lesson: a1-h1-proof
  topic: Algebraic proof
  type: text
  stem: 'Use the identity $(n + 1)^2 - n^2 = 2n + 1$ to find $21^2 - 20^2$ without squaring. $21^2 - 20^2 =$ ___'
  accept: ['41']
  explanation: 'With $n = 20$: $2(20) + 1 = 41$. Check: $441 - 400 = 41$.'
- id: a1-h1-r2-h12
  lesson: a1-h1-proof
  topic: Algebraic proof
  type: order
  stem: 'Put the steps of the proof that the sum of three consecutive integers is divisible by 3 in order.'
  items: ['Let the integers be $n$, $n + 1$ and $n + 2$', 'Add them to get $3n + 3$', 'Factor: $3n + 3 = 3(n + 1)$', 'Since $n + 1$ is an integer, the sum is divisible by 3']
  explanation: 'A direct proof names general numbers, combines them, rewrites the result in the needed form (3 times something) and then says why that something is an integer.'
- id: a1-h1-r2-h13
  lesson: a1-h1-proof
  topic: Algebraic proof
  type: match
  stem: 'Match each kind of number to its general form ($k$, $a$ and $b$ are integers).'
  pairs:
    - [Even number, 2k]
    - [Odd number, 2k + 1]
    - [Multiple of 3, 3k]
    - ['Two-digit number with tens digit $a$ and ones digit $b$', 10a + b]
  distractors: [k + 2, ab]
  explanation: 'Even means 2 times an integer; odd is 1 more than that; a multiple of 3 is 3 times an integer; a two-digit number is $a$ tens plus $b$ ones. $ab$ would be the product of the digits, not the number.'
- id: a1-h1-r2-h14
  lesson: a1-h1-proof
  topic: Algebraic proof
  stem: 'Which statements are true for every integer $n$? Select all that apply.'
  choices: ['$n(n + 1)$ is even', '$n^2 + n + 41$ is prime', '$(n + 1)^2 - n^2$ is odd', '$n^2 + 1$ is even']
  answer: [0, 2]
  explanation: '$n$ and $n + 1$ are consecutive, so one of them is even and so is their product. $(n + 1)^2 - n^2 = 2n + 1$, which is odd. $n^2 + n + 41$ fails at $n = 40$ ($1681 = 41^2$), and $n^2 + 1$ is odd when $n$ is even (for example $2^2 + 1 = 5$).'
- id: a1-h1-r2-h15
  lesson: a1-h1-proof
  topic: Algebraic proof
  type: label
  stem: 'This picture grows an $n$-by-$n$ square of dots (here $n = 4$) into an $(n + 1)$-by-$(n + 1)$ square. Name the numbered parts.'
  image: {src: images/a1-h1-squares-gnomon-blank.svg, alt: 'A 5-by-5 square of dots divided into four shaded regions: a large 4-by-4 block at the lower left, a column of 4 dots on the right, a row of 4 dots along the top, and a single dot in the top right corner. Four parts are numbered.'}
  labels:
    - {x: 41.7, y: 58.3, text: Original square of n² dots}
