# Round 2: alg-m2 (Inequalities and absolute value). Core: q01-q11. Honors: h01-h28.

# ---------- Lesson 6: Linear and compound inequalities ----------
- id: alg-m2-r2-q01
  lesson: alg-inequalities
  module_quiz: true
  topic: Linear inequalities
  type: text
  stem: 'Solve $5 - 2x > 11$. The solution is $x <$ ___. Give only the number.'
  accept: ['-3']
  explanation: |-
    Subtract 5: $-2x > 6$. Divide by $-2$ and reverse the symbol: $x < -3$. Check $x = -4$: $5 + 8 = 13 > 11$. True.

- id: alg-m2-r2-q02
  lesson: alg-inequalities
  topic: Linear inequalities
  type: order
  stem: 'Put the steps for solving $4 - 3(x + 2) < 10$ in order.'
  items:
    - 'Distribute: $4 - 3x - 6 < 10$'
    - 'Combine like terms: $-3x - 2 < 10$'
    - 'Add 2 to both sides: $-3x < 12$'
    - 'Divide by $-3$ and reverse the symbol: $x > -4$'
  explanation: |-
    Each line comes from the one before it. Distribute $-3$ first, combine $4 - 6 = -2$, then undo the $-2$, and divide last. The division is by a negative number, so $<$ becomes $>$: $x > -4$.

- id: alg-m2-r2-q03
  lesson: alg-inequalities
  topic: Linear inequalities
  type: match
  stem: 'Match each inequality to its interval notation.'
  pairs:
    - ['$x \le 4$', '(-∞, 4]']
    - ['$x < 4$', '(-∞, 4)']
    - ['$-1 \le x < 4$', '[-1, 4)']
    - ['$x > 4$', '(4, ∞)']
  distractors: ['[4, ∞)', '(-1, 4]']
  explanation: |-
    A bracket means the endpoint is included ($\le$ or $\ge$); a parenthesis means it is not ($<$ or $>$), and infinity always gets a parenthesis. So $x \le 4$ is $(-\infty, 4]$, $x < 4$ is $(-\infty, 4)$, $-1 \le x < 4$ is $[-1, 4)$ and $x > 4$ is $(4, \infty)$. The extra choice $[4, \infty)$ would be $x \ge 4$.

- id: alg-m2-r2-q04
  lesson: alg-inequalities
  topic: Compound inequalities
  stem: 'Which numbers are solutions of $-2 < 3 - x \le 5$? Select all that apply.'
  choices: ['$-3$', '$-2$', '$0$', '$4.5$', '$5$']
  answer: [1, 2, 3]
  explanation: |-
    Subtract 3 from all three parts: $-5 < -x \le 2$. Multiply by $-1$ and reverse both symbols: $5 > x \ge -2$, that is $-2 \le x < 5$. So $-2$, 0 and 4.5 are solutions. 5 is not ($3 - 5 = -2$, and $-2 < -2$ is false), and neither is $-3$ ($3 + 3 = 6 > 5$).

- id: alg-m2-r2-q05
  lesson: alg-inequalities
  module_quiz: true
  topic: Compound inequalities
  type: label
  stem: 'Each numbered number line is the graph of one statement about the sets $x > -2$ and $x \le 3$. Name each one.'
  image: {src: images/alg-m2-and-or-blank.svg, alt: 'Four numbered number lines from -5 to 6. Line 1: open dot at -2, shaded to the right. Line 2: closed dot at 3, shaded to the left. Line 3: shaded from an open dot at -2 to a closed dot at 3. Line 4: the whole line shaded.'}
  labels:
    - {x: 15, y: 14.9, text: 'x > -2'}
    - {x: 15, y: 37.8, text: 'x ≤ 3'}
    - {x: 15, y: 60.8, text: 'x > -2 and x ≤ 3'}
    - {x: 15, y: 83.8, text: 'x > -2 or x ≤ 3'}
  distractors: ['x < -2 or x ≥ 3', 'x ≥ -2 and x < 3']
  explanation: |-
    Line 1 starts at an open dot at $-2$ and goes right: $x > -2$. Line 2 ends at a closed dot at 3 and goes left: $x \le 3$. "And" keeps only the overlap, from $-2$ (open) to 3 (closed), which is line 3. "Or" keeps everything in either set, and since every number is above $-2$ or at most 3, that is the whole line, line 4.

# ---------- Lesson 7: Absolute value equations and inequalities ----------
- id: alg-m2-r2-q06
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  type: text
  stem: 'Solve $|x + 4| = 9$. The smaller solution is $x =$ ___ and the larger is $x =$ ___.'
  accept:
    - ['-13']
    - ['5']
  explanation: |-
    $x + 4 = -9$ gives $x = -13$, and $x + 4 = 9$ gives $x = 5$. Both are 9 units from $-4$.

- id: alg-m2-r2-q07
  lesson: alg-abs-value
  topic: Absolute value
  type: match
  stem: 'Match each statement to the kind of solution set it has.'
  pairs:
    - ['$|x - 2| = 5$', 'Exactly two numbers']
    - ['$|x - 2| < 5$', 'One interval (between two numbers)']
    - ['$|x - 2| > 5$', 'Two separate rays']
    - ['$|x - 2| < -5$', 'No solution']
    - ['$|x - 2| > -5$', 'All real numbers']
  explanation: |-
    $|x - 2| = 5$: $x = -3$ or $x = 7$. $|x - 2| < 5$: $-3 < x < 7$, one interval. $|x - 2| > 5$: $x < -3$ or $x > 7$, two rays. A distance can never be below $-5$, so $|x - 2| < -5$ has no solution, while every distance is above $-5$, so $|x - 2| > -5$ holds for all real numbers.

- id: alg-m2-r2-q08
  lesson: alg-abs-value
  topic: Absolute value
  stem: 'Which inequalities have the solution set $(-\infty, -1) \cup (7, \infty)$? Select all that apply.'
  choices: ['$|x - 3| > 4$', '$|3 - x| > 4$', '$|2x - 6| > 8$', '$|x - 3| \ge 4$', '$|x + 3| > 4$']
  answer: [0, 1, 2]
  explanation: |-
    The set is everything more than 4 units from the midpoint 3, which is $|x - 3| > 4$. $|3 - x|$ is the same distance, and $|2x - 6| > 8$ is $2|x - 3| > 8$, the same inequality. $|x - 3| \ge 4$ also includes the endpoints $-1$ and 7. $|x + 3| > 4$ measures distance from $-3$ and gives $x < -7$ or $x > 1$.

- id: alg-m2-r2-q09
  lesson: alg-abs-value
  module_quiz: true
  topic: Absolute value
  type: label
  stem: 'This picture shows the solutions of $|x - c| \le r$ with the labels removed. Name each numbered part.'
  image: {src: images/alg-m2-distance-blank.svg, alt: 'A number line with a shaded interval between two closed dots and a tick mark in the middle of the interval. A double arrow above runs from one dot to the other, and dashed lines connect it to the dots and the middle tick. Four parts are numbered.'}
  labels:
    - {x: 26.3, y: 65.2, text: 'Left endpoint, c − r'}
    - {x: 50, y: 65.2, text: 'Center, c'}
    - {x: 73.7, y: 65.2, text: 'Right endpoint, c + r'}
    - {x: 61.8, y: 41.3, text: 'Distance r from the center'}
  distractors: ['Distance 2r from the center', 'Zero on the number line']
  explanation: |-
    $|x - c| \le r$ means $x$ is at most $r$ units from $c$. The center $c$ sits in the middle of the shaded interval, the arrows reach $r$ units to each side, and the endpoints are $c - r$ on the left and $c + r$ on the right. The endpoints are closed dots because the symbol is $\le$. Nothing in the picture marks 0; the interval can be anywhere on the line.

- id: alg-m2-r2-q10
  lesson: alg-abs-value
  topic: Absolute value
  type: order
  stem: 'Put the steps for solving $2|x - 1| + 3 \ge 11$ in order.'
  items:
    - 'Subtract 3: $2|x - 1| \ge 8$'
    - 'Divide by 2: $|x - 1| \ge 4$'
    - 'Split into "or": $x - 1 \le -4$ or $x - 1 \ge 4$'
    - 'Solve each part: $x \le -3$ or $x \ge 5$'
  explanation: |-
    Isolate the absolute value first (subtract, then divide), and only then split. "Greater than or equal" means far from the center, so it becomes an "or": $x \le -3$ or $x \ge 5$, which is $(-\infty, -3] \cup [5, \infty)$.

- id: alg-m2-r2-q11
  lesson: alg-abs-value
  topic: Absolute value
  type: text
  stem: 'How many integers satisfy $|2x - 5| \le 7$?'
  accept: ['8', 'eight']
  explanation: |-
    $-7 \le 2x - 5 \le 7$. Add 5: $-2 \le 2x \le 12$. Divide by 2: $-1 \le x \le 6$. The integers $-1, 0, 1, 2, 3, 4, 5, 6$ make 8.

# ---------- Honors: Absolute value by cases ----------
- id: alg-m2-r2-h01
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|x - 3| = 2x$.'
  choices: ['$x = -3$ or $x = 1$', '$x = -3$ only', '$x = 1$ only', 'No solution']
  answer: 2
  explanation: |-
    Splitting gives $x - 3 = 2x$ ($x = -3$) or $x - 3 = -2x$ ($x = 1$). Check: $x = -3$ makes the left side $|-6| = 6$ but the right side $-6$, so it is extraneous. $x = 1$ gives $|-2| = 2 = 2(1)$. Keeping both candidates without checking gives the wrong "$-3$ or 1".

- id: alg-m2-r2-h02
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|2x + 1| = x - 4$.'
  choices: ['No solution', '$x = -5$ or $x = 1$', '$x = 1$ only', '$x = -5$ only']
  answer: 0
  explanation: |-
    The right side must be at least 0, so a solution needs $x \ge 4$. Splitting gives $x = -5$ (from $2x + 1 = x - 4$) and $x = 1$ (from $2x + 1 = -x + 4$), and neither is at least 4. Checking confirms it: $x = -5$ gives $9 \ne -9$ and $x = 1$ gives $3 \ne -3$.

- id: alg-m2-r2-h03
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  type: text
  stem: 'The equation $|x + 6| = 3x$ has exactly one solution: $x =$ ___.'
  accept: ['3']
  explanation: |-
    Split: $x + 6 = 3x$ gives $x = 3$; $x + 6 = -3x$ gives $x = -\tfrac32$. The right side $3x$ must be at least 0, so $x \ge 0$, and $-\tfrac32$ is extraneous (its right side is $-4.5$). Check $x = 3$: $|9| = 9 = 3(3)$.

- id: alg-m2-r2-h04
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Which statements about solving $|u| = v$, where $v$ contains $x$, are true? Select all that apply.'
  choices: ['Every solution must make $v \ge 0$.', 'Splitting into $u = v$ or $u = -v$ can produce values that fail the original equation.', 'A candidate that makes $v$ negative is extraneous.', 'If both candidates come from correct algebra, both are solutions.', 'The method cannot be used, because $v$ is not a number.']
  answer: [0, 1, 2]
  explanation: |-
    $|u|$ is at least 0, so $v$ must be too, and a candidate that makes $v$ negative can't work: it is extraneous. Splitting is still the right method; it finds every solution but may add extra ones, because $u = -v$ only guarantees $|u| = |v|$. That is why correct algebra alone isn't enough: each candidate has to be checked.

- id: alg-m2-r2-h05
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|2x - 1| \le x + 4$.'
  choices: ['$(-\infty, 5]$', '$[-1, \infty)$', '$[-5, 1]$', '$[-1, 5]$']
  answer: 3
  explanation: |-
    $-(x + 4) \le 2x - 1 \le x + 4$. Left half: $-x - 4 \le 2x - 1$, so $-3 \le 3x$ and $x \ge -1$. Right half: $x \le 5$. Both must hold: $[-1, 5]$. Solving only one half gives $(-\infty, 5]$ or $[-1, \infty)$.

- id: alg-m2-r2-h06
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|x + 2| > 2x - 1$.'
  choices: ['$(-\infty, -\tfrac13) \cup (3, \infty)$', '$(-\infty, 3)$', '$(-\tfrac13, 3)$', '$(-\infty, -\tfrac13)$']
  answer: 1
  explanation: |-
    "Greater than" becomes "or": $x + 2 < -(2x - 1)$ or $x + 2 > 2x - 1$. The first gives $3x < -1$, so $x < -\tfrac13$; the second gives $x < 3$. The union of $x < -\tfrac13$ and $x < 3$ is just $x < 3$. Check $x = 4$: $6 > 7$ is false, so $(3, \infty)$ is not part of the answer.

- id: alg-m2-r2-h07
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  type: order
  stem: 'Put the steps for solving $|x - 1| + |x + 2| = 5$ by cases in order.'
  items:
    - 'Find the critical values: $x = 1$ and $x = -2$'
    - 'Split the line into $x < -2$, $-2 \le x < 1$ and $x \ge 1$'
    - 'Rewrite the sum without bars in each region: $-2x - 1$, $3$, $2x + 1$'
    - 'Solve in each region: $x = -3$, no solution, $x = 2$'
    - 'Keep answers that lie in their own region and check them'
  explanation: |-
    The critical values (where each inside equals 0) define the regions; the regions decide the signs, which give the formulas; the formulas give the candidates; and each candidate is kept only if it lies in its region. Both $-3$ and 2 pass, and $|-4| + |-1| = 5$ and $|1| + |4| = 5$ confirm them.

- id: alg-m2-r2-h08
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  type: label
  stem: 'The line is split at the critical values of $|x - 1| + |x + 2|$. Choose what the sum equals in each numbered region.'
  image: {src: images/alg-m2-h-regions-blank.svg, alt: 'A number line from -5 to 4 with dashed marks at -2 (where x + 2 = 0) and 1 (where x - 1 = 0). Below it, three boxes for the regions x < -2, -2 ≤ x < 1 and x ≥ 1, each numbered.'}
  labels:
    - {x: 20.1, y: 72, text: 'Sum = -2x - 1'}
    - {x: 50, y: 72, text: 'Sum = 3'}
    - {x: 79.9, y: 72, text: 'Sum = 2x + 1'}
  distractors: ['Sum = 2x - 1', 'Sum = -3']
  explanation: |-
    For $x < -2$, both insides are negative: $-(x - 1) - (x + 2) = -2x - 1$. For $-2 \le x < 1$, only $x - 1$ is negative: $-(x - 1) + (x + 2) = 3$. For $x \ge 1$, both are nonnegative: $(x - 1) + (x + 2) = 2x + 1$.

- id: alg-m2-r2-h09
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  type: match
  stem: 'Match each equation to how many solutions it has.'
  pairs:
    - ['$|x - 1| + |x + 2| = 5$', 'Exactly two solutions']
    - ['$|x - 1| + |x + 2| = 3$', 'Infinitely many solutions']
    - ['$|x - 1| + |x + 2| = 2$', 'No solution']
    - ['$|x - 1| = |x + 2|$', 'Exactly one solution']
  distractors: ['Exactly three solutions']
  explanation: |-
    $|x - 1| + |x + 2|$ is the sum of the distances to 1 and $-2$, which are 3 apart. The sum is exactly 3 for every $x$ in $[-2, 1]$ (infinitely many solutions), never below 3 (so $= 2$ has none), and equals 5 at $x = -3$ and $x = 2$. $|x - 1| = |x + 2|$ asks for a point equally far from 1 and $-2$: only the midpoint $x = -\tfrac12$.

- id: alg-m2-r2-h10
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'For $x < -2$, which expression equals $|x - 1| + |x + 2|$?'
  choices: ['$-2x - 1$', '$2x + 1$', '$-2x + 3$', '$3$']
  answer: 0
  explanation: |-
    For $x < -2$, both $x - 1$ and $x + 2$ are negative, so both signs switch: $-(x - 1) - (x + 2) = -x + 1 - x - 2 = -2x - 1$. Test $x = -3$: $|-4| + |-1| = 5$ and $-2(-3) - 1 = 5$. The constant 3 is the value in the middle region, and $2x + 1$ is the right region.

- id: alg-m2-r2-h11
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  type: text
  stem: 'The solution of $|x - 1| + |x + 2| < 7$ is the open interval from ___ to ___.'
  accept:
    - ['-4']
    - ['3']
  explanation: |-
    Left region: $-2x - 1 < 7$ gives $x > -4$, so $-4 < x < -2$. Middle region: $3 < 7$ always, so all of $[-2, 1)$. Right region: $2x + 1 < 7$ gives $x < 3$, so $1 \le x < 3$. Together: $(-4, 3)$. Distance check: the sum is 7 when $x$ is 2 units beyond either end, at $-4$ and 3.

- id: alg-m2-r2-h12
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|x| + |x - 4| = 10$.'
  choices: ['$x = 3$ or $x = 7$', '$x = -7$ or $x = 3$', '$x = -3$ or $x = 7$', '$x = -3$ or $x = 3$']
  answer: 2
  explanation: |-
    The sum of the distances to 0 and 4 is 4 for any $x$ between them. Going past an end adds twice the overshoot, so reaching 10 takes an overshoot of 3: $x = 0 - 3 = -3$ or $x = 4 + 3 = 7$. By cases: for $x < 0$, $-x + (4 - x) = 4 - 2x = 10$ gives $x = -3$; for $x \ge 4$, $2x - 4 = 10$ gives $x = 7$. Check: $3 + 7 = 10$ and $7 + 3 = 10$.

- id: alg-m2-r2-h13
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'For which value of $c$ does $|x + 1| + |x - 5| = c$ have infinitely many solutions?'
  choices: ['$c = 4$', '$c = 3$', '$c = 12$', '$c = 6$']
  answer: 3
  explanation: |-
    The points $-1$ and 5 are 6 apart, so for every $x$ in $[-1, 5]$ the two distances add to exactly 6. That gives infinitely many solutions when $c = 6$. For $c < 6$ there are none, and for $c > 6$ (such as 12) there are exactly two.

- id: alg-m2-r2-h14
  lesson: alg-m2-h-abs-cases
  topic: Absolute value by cases
  stem: 'Solve $|x - 2| < 3x$.'
  choices: ['$-1 < x < \tfrac12$', '$x > \tfrac12$', '$x > -1$', '$x < \tfrac12$']
  answer: 1
  explanation: |-
    $-3x < x - 2 < 3x$. Left half: $-4x < -2$, so $x > \tfrac12$ (dividing by $-4$ reverses the symbol). Right half: $-2 < 2x$, so $x > -1$. Both must hold, so $x > \tfrac12$. Check $x = 0$: $2 < 0$ is false, which rules out $x > -1$ as the answer.

# ---------- Honors: Tolerance, error bounds and the triangle inequality ----------
- id: alg-m2-r2-h15
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'Which absolute value inequality is the same as $12 \le x \le 20$?'
  choices: ['$|x - 16| \le 8$', '$|x - 16| \le 4$', '$|x - 4| \le 16$', '$|x + 16| \le 4$']
  answer: 1
  explanation: |-
    Midpoint $\tfrac{12 + 20}{2} = 16$, half-width $\tfrac{20 - 12}{2} = 4$: $|x - 16| \le 4$. Using the full length 8 as the half-width gives $8 \le x \le 24$, too wide.

- id: alg-m2-r2-h16
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  type: text
  stem: 'Write $-7 \le x \le 3$ in the form $|x - m| \le h$: $m =$ ___ and $h =$ ___.'
  accept:
    - ['-2']
    - ['5']
  explanation: |-
    $m = \tfrac{-7 + 3}{2} = -2$ and $h = \tfrac{3 - (-7)}{2} = 5$, so $|x + 2| \le 5$. Check: $-5 \le x + 2 \le 5$ gives $-7 \le x \le 3$.

- id: alg-m2-r2-h17
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'Which inequality describes "$x < 1$ or $x > 9$"?'
  choices: ['$|x - 5| < 4$', '$|x - 4| > 5$', '$|x - 1| > 9$', '$|x - 5| > 4$']
  answer: 3
  explanation: |-
    The gap from 1 to 9 has midpoint 5 and half-width 4. The numbers outside it are more than 4 from 5: $|x - 5| > 4$. With $<$ instead, $|x - 5| < 4$ would describe the inside, $1 < x < 9$.

- id: alg-m2-r2-h18
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'A resistor is labeled 220 ohms with a 10% tolerance. Which resistances are acceptable?'
  choices: ['$198 \le R \le 242$', '$210 \le R \le 230$', '$176 \le R \le 264$', '$209 \le R \le 231$']
  answer: 0
  explanation: |-
    10% of 220 is 22, so $|R - 220| \le 22$, which is $198 \le R \le 242$. Using 10 ohms instead of 10% gives $210$ to $230$; using 5% gives 209 to 231; using 20% gives 176 to 264.

- id: alg-m2-r2-h19
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'A shaft must satisfy $|d - 25| \le 0.03$, with $d$ in millimeters. Which measured diameters pass? Select all that apply.'
  choices: ['24.97 mm', '25.02 mm', '25.04 mm', '24.96 mm', '25.03 mm']
  answer: [0, 1, 4]
  explanation: |-
    The allowed range is $24.97 \le d \le 25.03$, endpoints included. 24.97, 25.02 and 25.03 are within 0.03 of 25. 25.04 and 24.96 are 0.04 away, so they fail.

- id: alg-m2-r2-h20
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'A sample whose true mass is 10.0 g is weighed as 9.6 g. What is the relative error?'
  choices: ['0.4%', '0.04%', '4%', 'about 4.2%']
  answer: 2
  explanation: |-
    The absolute error is $|9.6 - 10.0| = 0.4$ g. Relative error divides by the true value: $\tfrac{0.4}{10.0} = 0.04 = 4\%$. Dividing by the measured 9.6 instead gives about 4.2%.

- id: alg-m2-r2-h21
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  type: text
  stem: 'You compute $y = 7x + 2$ from a measured $x = 4$ whose error is at most 0.3. The largest possible error in $y$ is ___.'
  accept: ['2.1']
  explanation: |-
    $|y - 30| = |7x + 2 - 30| = |7(x - 4)| = 7|x - 4| \le 7(0.3) = 2.1$. The slope multiplies the error by 7.

- id: alg-m2-r2-h22
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'If $|x - 2| \le 0.05$ and $y = 20 - 4x$, which statement is guaranteed?'
  choices: ['$|y - 12| \le -0.2$', '$|y - 12| \le 0.05$', '$|y - 12| \le 0.0125$', '$|y - 12| \le 0.2$']
  answer: 3
  explanation: |-
    At $x = 2$, $y = 12$. $|y - 12| = |20 - 4x - 12| = |-4(x - 2)| = 4|x - 2| \le 4(0.05) = 0.2$. The bound uses $|-4| = 4$; an error bound is never negative. Dividing by 4 instead of multiplying gives the wrong 0.0125.

- id: alg-m2-r2-h23
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'How close to 6 must $x$ be to guarantee that $3x + 1$ is within 0.06 of 19?'
  choices: ['Within 0.18', 'Within 0.02', 'Within 0.06', 'Within 0.2']
  answer: 1
  explanation: |-
    $|(3x + 1) - 19| = |3x - 18| = 3|x - 6|$. Requiring $3|x - 6| \le 0.06$ gives $|x - 6| \le 0.02$. Multiplying by 3 instead of dividing gives 0.18.

- id: alg-m2-r2-h24
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  type: match
  stem: 'For each pair of numbers, compare $|a + b|$ with $|a| + |b|$.'
  pairs:
    - ['$a = 3$, $b = 4$', 'Equal']
    - ['$a = -2$, $b = -6$', 'Equal']
    - ['$a = 5$, $b = -1$', '|a + b| is smaller']
    - ['$a = 0$, $b = -7$', 'Equal']
    - ['$a = -3$, $b = 8$', '|a + b| is smaller']
  distractors: ['|a + b| is larger']
  explanation: |-
    Equality holds when $a$ and $b$ don't have opposite signs: $|7| = 7$, $|-8| = 8$, $|-7| = 7$. With opposite signs the two numbers partly cancel: $|5 - 1| = 4 < 6$ and $|-3 + 8| = 5 < 11$. By the triangle inequality, $|a + b|$ is never larger.

- id: alg-m2-r2-h25
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'You know $|x - 5| \le 0.2$ and $|y - 3| \le 0.1$. Which statements must be true? Select all that apply.'
  choices: ['$|(x + y) - 8| \le 0.3$', '$|(x - y) - 2| \le 0.3$', '$|(x - y) - 2| \le 0.1$', '$|2x - 10| \le 0.4$', '$|(x + y) - 8| \le 0.2$']
  answer: [0, 1, 3]
  explanation: |-
    By the triangle inequality the error bounds add for both the sum and the difference: 0.3. $|2x - 10| = 2|x - 5| \le 0.4$. The bound 0.1 for $x - y$ fails: $x = 5.2$, $y = 2.9$ gives $x - y = 2.3$. The bound 0.2 for $x + y$ fails: $x = 5.2$, $y = 3.1$ gives $x + y = 8.3$.

- id: alg-m2-r2-h26
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  type: order
  stem: 'Put the steps in order to find how close $x$ must be to 5 so that $y = 4x - 3$ is within 0.1 of its value at $x = 5$.'
  items:
    - 'Find the target: at $x = 5$, $y = 4(5) - 3 = 17$'
    - 'Write the difference: $|(4x - 3) - 17| = |4x - 20|$'
    - 'Factor: $|4x - 20| = |4(x - 5)| = 4|x - 5|$'
    - 'Require $4|x - 5| \le 0.1$'
    - 'Divide by 4: $|x - 5| \le 0.025$'
  explanation: |-
    Each step uses the one before: the target value 17 is needed to write the difference, factoring exposes $|x - 5|$, and the requirement on $y$ becomes a requirement on $x$ after dividing by the slope 4.

- id: alg-m2-r2-h27
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'Three boards, each $1.2 \pm 0.005$ m long, are laid end to end. What total length is guaranteed?'
  choices: ['$3.6 \pm 0.005$ m', '$3.6 \pm 0.0025$ m', '$3.6 \pm 0.015$ m', '$3.6 \pm 0.0087$ m']
  answer: 2
  explanation: |-
    In the worst case all three boards are off by 0.005 m in the same direction, so the bounds add: $3(0.005) = 0.015$ m. About $\pm 0.0087$ m is the root-sum-of-squares estimate of a typical error, not a guarantee.

- id: alg-m2-r2-h28
  lesson: alg-m2-h-tolerance
  topic: Tolerance and error
  stem: 'For which real numbers $a$ and $b$ is $|a - b| = |a| + |b|$?'
  choices: ['Exactly when $ab \le 0$', 'Exactly when $ab \ge 0$', 'For all $a$ and $b$', 'For no $a$ and $b$']
  answer: 0
  explanation: |-
    $|a - b| = |a + (-b)| \le |a| + |-b| = |a| + |b|$, with equality when $a$ and $-b$ don't have opposite signs, that is, when $a(-b) \ge 0$, which is $ab \le 0$. Examples: $|3 - (-2)| = 5 = 3 + 2$, but $|3 - 2| = 1 < 5$.
