# Round 2 questions for alg-m3 (Functions and linear functions)
# ---- Core lessons: new question types
- id: alg-m3-r2-q01
  lesson: alg-functions
  type: label
  module_quiz: true
  topic: Functions
  stem: 'This mapping diagram shows a relation. Name the numbered parts.'
  image: {src: images/alg-m3-mapping-blank.svg, alt: 'A mapping diagram. The left oval holds −2, 0, 3 and 6; the right oval holds 1, 4, 7 and 9. Arrows go from −2 to 1, from 0 to 4, from 6 to 4, and from 3 to both 7 and 9.'}
  labels:
    - {x: 25, y: 85.5, text: Domain (the set of inputs)}
    - {x: 75, y: 85.5, text: Range (the set of outputs)}
    - {x: 16.9, y: 58.5, text: An input with two outputs}
    - {x: 83.1, y: 41.5, text: An output shared by two inputs}
  distractors: [An input with no output, An output with no input]
  explanation: |-
    The left oval holds the inputs (the domain) and the right oval the outputs (the range). The input 3 sends arrows to both 7 and 9, so this relation is not a function. The output 4 receives arrows from 0 and 6; a shared output is allowed in a function. Every input here has at least one arrow and every output has at least one arrow arriving.
- id: alg-m3-r2-q02
  lesson: alg-functions
  type: text
  topic: Functions
  stem: 'If $f(x) = 4 - x^2$, then $f(-3) =$ ___. Give only the number.'
  accept: ['-5']
  explanation: |-
    $f(-3) = 4 - (-3)^2 = 4 - 9 = -5$. The square applies to $-3$ in parentheses, so it is $+9$; writing $-3^2$ without parentheses would mean $-9$ and give 13.
- id: alg-m3-r2-q03
  lesson: alg-functions
  topic: Functions
  stem: 'Which of these relations are functions? Select all that apply.'
  choices:
    - '$\{(2, 5), (3, 5), (4, 5)\}$'
    - '$\{(0, 1), (1, 0), (0, -1)\}$'
    - '$y = |x|$'
    - '$x = y^2$'
  answer: [0, 2]
  explanation: |-
    In $\{(2, 5), (3, 5), (4, 5)\}$ each input appears once; the repeated output 5 is allowed. $y = |x|$ gives one value for each $x$. In $\{(0, 1), (1, 0), (0, -1)\}$ the input 0 has two outputs. In $x = y^2$, the input $x = 4$ gives $y = 2$ and $y = -2$.
- id: alg-m3-r2-q04
  lesson: alg-functions
  type: match
  module_quiz: true
  topic: Functions
  stem: 'Match each piece of function notation to what it means.'
  pairs:
    - ['$f(3)$', The output when the input is 3]
    - ['$f(x) = 3$', An equation asking which inputs give the output 3]
    - ['$f(g(3))$', Apply g to 3 then apply f to the result]
    - ['$(3, f(3))$', A point on the graph of f]
  distractors: [f multiplied by 3]
  explanation: |-
    $f(3)$ is an output, while $f(x) = 3$ is an equation to solve for inputs. In a composition the inside function acts first, so $f(g(3))$ applies $g$ first. The pair $(3, f(3))$ is the point on the graph above $x = 3$. Function notation never means multiplication.
- id: alg-m3-r2-q05
  lesson: alg-functions
  type: order
  topic: Functions
  stem: 'Let $f(x) = 1 - 2x$. Put these values in order from smallest to largest.'
  items: ['$f(3)$', '$f(\tfrac12)$', '$f(0)$', '$f(-2)$']
  explanation: |-
    $f(3) = 1 - 6 = -5$, $f(\tfrac12) = 1 - 1 = 0$, $f(0) = 1$ and $f(-2) = 1 + 4 = 5$. Because the slope is negative, larger inputs give smaller outputs.
- id: alg-m3-r2-q06
  lesson: alg-domain-range
  type: label
  module_quiz: true
  topic: Graphs of functions
  stem: 'Name the numbered features of the graph of this function.'
  image: {src: images/alg-m3-features-blank.svg, alt: 'A downward-opening curve on a grid. It starts at a solid dot at (−2, −3.5), crosses the x-axis at −1 and 5, crosses the y-axis at (0, 2.5), reaches its highest point at (2, 4.5), and ends at a hollow dot at (6, −3.5).'}
  labels:
    - {x: 13.6, y: 83.5, text: Closed endpoint (included)}
    - {x: 27, y: 55.1, text: Zero (x-intercept)}
    - {x: 34.7, y: 34.8, text: y-intercept}
    - {x: 50, y: 18.6, text: Maximum point}
    - {x: 86.4, y: 83.5, text: Open endpoint (not included)}
  distractors: [Vertical asymptote, Point where the slope is undefined]
  explanation: |-
    1 is a solid dot, so $x = -2$ is in the domain. 2 is where the graph meets the $x$-axis, a zero of the function. 3 is where it crosses the $y$-axis. 4 is the highest point, giving the maximum value 4.5. 5 is a hollow dot, so $x = 6$ is not in the domain: the domain is $[-2, 6)$ and the range is $[-3.5, 4.5]$.
- id: alg-m3-r2-q07
  lesson: alg-domain-range
  type: text
  topic: Domain and range
  stem: 'The domain of $f(x) = \sqrt{12 - 3x}$ is $(-\infty, a]$. What is $a$? Give only the number.'
  accept: ['4']
  explanation: |-
    The radicand must be nonnegative: $12 - 3x \ge 0$, so $-3x \ge -12$, and dividing by $-3$ flips the symbol: $x \le 4$. Check: $f(4) = \sqrt{0} = 0$ is defined, while $f(5) = \sqrt{-3}$ is not.
- id: alg-m3-r2-q08
  lesson: alg-domain-range
  topic: Domain and range
  stem: 'Which numbers are in the domain of $g(x) = \dfrac{\sqrt{x + 2}}{x - 3}$? Select all that apply.'
  choices: ['$-3$', '$-2$', '$0$', '$3$']
  answer: [1, 2]
  explanation: |-
    The square root needs $x + 2 \ge 0$, so $x \ge -2$, and the denominator needs $x \ne 3$. $g(-2) = \tfrac{0}{-5} = 0$ and $g(0) = \tfrac{\sqrt2}{-3}$ are defined. At $-3$ the radicand is $-1$, and at 3 the denominator is 0. (Here the root is in the numerator, so a radicand of 0 is fine.)
- id: alg-m3-r2-q09
  lesson: alg-domain-range
  type: match
  module_quiz: true
  topic: Domain and range
  stem: 'Match each function to its range.'
  pairs:
    - ['$f(x) = x^2 + 3$', '[3, ∞)']
    - ['$f(x) = -|x|$', '(−∞, 0]']
    - ['$f(x) = 2x - 1$', All real numbers]
    - ['$f(x) = \sqrt{x} - 1$', '[−1, ∞)']
  distractors: ['[0, ∞)']
  explanation: |-
    $x^2 \ge 0$, so $x^2 + 3 \ge 3$. $|x| \ge 0$, so $-|x| \le 0$. A non-horizontal line reaches every height. $\sqrt{x} \ge 0$, so $\sqrt{x} - 1 \ge -1$. In each case the lowest or highest value is actually reached (at $x = 0$), so the endpoint is included.
- id: alg-m3-r2-q10
  lesson: alg-domain-range
  type: text
  topic: Domain and range
  stem: 'A ball is tossed up from the ground, and its height after $t$ seconds is $h(t) = -16t^2 + 32t$ feet. Its practical domain is $[0, b]$, from launch until it lands. What is $b$? Give only the number.'
  accept: ['2']
  explanation: |-
    The ball is on the ground when $h(t) = 0$. That happens at launch, $t = 0$, and again at $t = 2$: $h(2) = -16(4) + 32(2) = -64 + 64 = 0$. Between those times the height is positive (for example $h(1) = 16$), so the practical domain is $[0, 2]$.
- id: alg-m3-r2-q11
  lesson: alg-slope
  type: label
  module_quiz: true
  topic: Slope
  stem: 'Each small graph shows one line. Name the kind of slope of each numbered line.'
  image: {src: images/alg-m3-slope-types-blank.svg, alt: 'Four small graphs in a 2 by 2 grid, each with axes and one line: top left, a line going down to the right; top right, a vertical line; bottom left, a line going up to the right; bottom right, a horizontal line.'}
  labels:
    - {x: 35.1, y: 30, text: Negative slope}
    - {x: 83.3, y: 17.3, text: Undefined slope}
    - {x: 35.1, y: 70, text: Positive slope}
    - {x: 82.7, y: 64.3, text: Zero slope}
  distractors: [A slope that changes along the line]
  explanation: |-
    Read each line from left to right. Line 1 falls (negative slope) and line 3 rises (positive slope). Line 4 is horizontal: rise 0, so slope 0. Line 2 is vertical: run 0, and dividing by 0 is undefined. A straight line's slope never changes along it.
- id: alg-m3-r2-q12
  lesson: alg-slope
  type: text
  module_quiz: true
  topic: Slope
  stem: 'The slope of the line through $(-3, 4)$ and $(5, -2)$ is ___. Give the exact value.'
  accept: ['-3/4', '-0.75']
  explanation: |-
    $m = \dfrac{-2 - 4}{5 - (-3)} = \dfrac{-6}{8} = -\dfrac34$. Subtract in the same order on top and bottom; mixing the order gives $+\tfrac34$.
- id: alg-m3-r2-q13
  lesson: alg-slope
  type: order
  topic: Slope
  stem: 'Put these lines in order from least steep to steepest.'
  items: ['$y = 3$', '$y = -\tfrac12 x + 1$', '$y = x - 4$', '$y = -3x + 2$']
  explanation: |-
    Steepness is the size of the slope, $|m|$: 0, $\tfrac12$, 1 and 3. The sign only tells the direction, so $y = -3x + 2$ is the steepest even though its slope is the smallest number.
- id: alg-m3-r2-q14
  lesson: alg-slope
  topic: Slope
  stem: 'A line has a negative slope. Which statements must be true? Select all that apply.'
  choices:
    - 'It falls from left to right.'
    - 'As $x$ increases, $y$ decreases.'
    - 'Its $y$-intercept is negative.'
    - 'It is steeper than every line with a positive slope.'
  answer: [0, 1]
  explanation: |-
    A negative slope means $y$ goes down as $x$ goes up, so the line falls to the right. The slope says nothing about where the line crosses the $y$-axis: $y = -x + 5$ has a positive intercept. Steepness depends on $|m|$, and $y = -\tfrac12 x$ is less steep than $y = 4x$.
- id: alg-m3-r2-q15
  lesson: alg-slope
  type: match
  topic: Slope
  stem: 'In each linear relationship, the first quantity is the output and the second is the input. Match each one to the units of its slope.'
  pairs:
    - [Distance in miles and time in hours, Miles per hour]
    - [Cost in dollars and weight in pounds, Dollars per pound]
    - [Water left in gallons and time in minutes, Gallons per minute]
    - [Elevation in meters and horizontal distance in kilometers, Meters per kilometer]
  distractors: [Hours per mile]
  explanation: |-
    Slope is change in output over change in input, so its units are output units per input unit. Hours per mile would be input over output, the reciprocal of the speed.
- id: alg-m3-r2-q16
  lesson: alg-line-forms
  type: text
  module_quiz: true
  topic: Equations of lines
  stem: 'The line through $(2, -1)$ with slope 3 has $y$-intercept $(0, b)$. What is $b$? Give only the number.'
  accept: ['-7']
  explanation: |-
    Point-slope form: $y + 1 = 3(x - 2)$, so $y = 3x - 6 - 1 = 3x - 7$ and $b = -7$. Check: $3(2) - 7 = -1$. (Or step back from $(2, -1)$ to $x = 0$: two steps left lowers $y$ by $2 \cdot 3 = 6$, giving $-7$.)
- id: alg-m3-r2-q17
  lesson: alg-line-forms
  type: match
  topic: Equations of lines
  stem: 'Match each equation to the form it is written in.'
  pairs:
    - ['$y = -2x + 5$', Slope-intercept form]
    - ['$y - 4 = 3(x + 1)$', Point-slope form]
    - ['$3x - 4y = 12$', Standard form]
  distractors: [Vertex form]
  explanation: |-
    $y = mx + b$ shows the slope and $y$-intercept, $y - y_1 = m(x - x_1)$ shows the slope and a point (here $(-1, 4)$), and $Ax + By = C$ is standard form. Vertex form belongs to quadratic functions (Lesson 25).
- id: alg-m3-r2-q18
  lesson: alg-line-forms
  type: order
  topic: Equations of lines
  stem: 'Put the steps in order to write the line through $(1, 5)$ and $(3, 9)$ in slope-intercept form.'
  items:
    - 'Find the slope: $m = \tfrac{9 - 5}{3 - 1} = 2$'
    - 'Use point-slope form: $y - 5 = 2(x - 1)$'
    - 'Distribute: $y - 5 = 2x - 2$'
    - 'Add 5 to both sides: $y = 2x + 3$'
    - 'Check the other point: $2(3) + 3 = 9$'
  explanation: |-
    The slope comes first because point-slope form needs it. After distributing and isolating $y$, checking the point you didn't use catches arithmetic slips.
- id: alg-m3-r2-q19
  lesson: alg-line-forms
  module_quiz: true
  topic: Equations of lines
  stem: 'Which equations describe the line through $(0, -2)$ with slope $\tfrac12$? Select all that apply.'
  choices:
    - '$y = \tfrac12 x - 2$'
    - '$x - 2y = 4$'
    - '$y + 2 = \tfrac12 x$'
    - '$x - 2y = -4$'
  answer: [0, 1, 2]
  explanation: |-
    Slope-intercept form is $y = \tfrac12 x - 2$. Point-slope form with $(0, -2)$ is $y + 2 = \tfrac12(x - 0)$. Solving $x - 2y = 4$ for $y$ gives $y = \tfrac12 x - 2$, the same line. But $x - 2y = -4$ gives $y = \tfrac12 x + 2$, a parallel line through $(0, 2)$.
- id: alg-m3-r2-q20
  lesson: alg-line-forms
  type: text
  topic: Equations of lines
  stem: 'The line $2x + 5y = 20$ crosses the $x$-axis at $(a, 0)$. What is $a$? Give only the number.'
  accept: ['10']
  explanation: |-
    On the $x$-axis, $y = 0$: $2x = 20$, so $x = 10$. (Setting $x = 0$ instead gives the $y$-intercept, $(0, 4)$.)
- id: alg-m3-r2-q21
  lesson: alg-parallel-perp
  type: text
  topic: Parallel and perpendicular
  stem: 'A line is perpendicular to $y = -\tfrac43 x + 2$. Its slope is ___. Give the exact value.'
  accept: ['3/4', '0.75']
  explanation: |-
    Flip the fraction and change the sign: the negative reciprocal of $-\tfrac43$ is $\tfrac34$. Check: $-\tfrac43 \cdot \tfrac34 = -1$. ($-\tfrac34$ only flips; $\tfrac43$ only changes the sign.)
- id: alg-m3-r2-q22
  lesson: alg-parallel-perp
  type: match
  module_quiz: true
  topic: Parallel and perpendicular
  stem: 'Each pair includes the line $y = 2x + 1$. Match each pair to how its two lines are related.'
  pairs:
    - ['$y = 2x + 1$ and $y = 2x - 5$', Parallel]
    - ['$y = 2x + 1$ and $y = -\tfrac12 x + 4$', Perpendicular]
    - ['$y = 2x + 1$ and $4x - 2y = -2$', The same line]
    - ['$y = 2x + 1$ and $y = -2x + 1$', Neither]
  explanation: |-
    Equal slopes with different intercepts give parallel lines. Slopes 2 and $-\tfrac12$ multiply to $-1$: perpendicular. Solving $4x - 2y = -2$ for $y$ gives $y = 2x + 1$, the same line. Slopes 2 and $-2$ are neither equal nor negative reciprocals (their product is $-4$), so those lines cross at an angle other than 90°.
- id: alg-m3-r2-q23
  lesson: alg-parallel-perp
  topic: Parallel and perpendicular
  stem: 'Which lines are parallel to the line $3x - y = 7$? Select all that apply.'
  choices:
    - '$y = 3x + 2$'
    - '$y = -3x + 7$'
    - '$6x - 2y = 1$'
    - '$y = 3x - 7$'
  answer: [0, 2]
  explanation: |-
    $3x - y = 7$ is $y = 3x - 7$: slope 3, intercept $-7$. $y = 3x + 2$ and $6x - 2y = 1$ (that is, $y = 3x - \tfrac12$) have slope 3 and other intercepts, so they are parallel. $y = 3x - 7$ is the same line, not a parallel one. $y = -3x + 7$ has slope $-3$.
- id: alg-m3-r2-q24
  lesson: alg-parallel-perp
  type: order
  topic: Parallel and perpendicular
  stem: 'Put the steps in order to write the line through $(6, 1)$ perpendicular to $2x + 3y = 9$.'
  items:
    - 'Solve for $y$: $y = -\tfrac23 x + 3$, so the given slope is $-\tfrac23$'
    - 'Take the negative reciprocal: the new slope is $\tfrac32$'
    - 'Use point-slope form: $y - 1 = \tfrac32(x - 6)$'
    - 'Simplify: $y = \tfrac32 x - 8$'
  explanation: |-
    You need the given slope before you can take its negative reciprocal, and you need the new slope before you can write the new line. Check: $\tfrac32(6) - 8 = 1$, and $-\tfrac23 \cdot \tfrac32 = -1$.
- id: alg-m3-r2-q25
  lesson: alg-parallel-perp
  type: text
  module_quiz: true
  topic: Linear models
  stem: 'A taxi charges a fixed fee plus a set amount per mile. A 4-mile ride costs \$13 and a 10-mile ride costs \$25. What is the fixed fee, in dollars? Give only the number.'
  accept: ['5', '5.00']
  explanation: |-
    The rate is the slope: $\tfrac{25 - 13}{10 - 4} = \tfrac{12}{6} = 2$ dollars per mile. Then $13 = 2(4) + b$ gives $b = 5$. The model is $C = 2m + 5$; check: $2(10) + 5 = 25$.
- id: alg-m3-r2-q26
  lesson: a1-piecewise
  type: text
  module_quiz: true
  topic: Piecewise functions
  stem: 'Let $f(x) = \begin{cases} x^2, & x < 2 \\ 3x - 1, & x \ge 2 \end{cases}$. Then $f(2) =$ ___. Give only the number.'
  accept: ['5']
  explanation: |-
    $x = 2$ fails $x < 2$ but satisfies $x \ge 2$, so use the second piece: $f(2) = 3(2) - 1 = 5$. The first piece would give 4, but it does not apply at 2.
- id: alg-m3-r2-q27
  lesson: a1-piecewise
  type: order
  topic: Piecewise functions
  stem: 'Put these values of the greatest integer function in order from smallest to largest.'
  items: ['$\lfloor -1.5 \rfloor$', '$\lfloor -0.5 \rfloor$', '$\lfloor 0.9 \rfloor$', '$\lfloor 2 \rfloor$']
  explanation: |-
    $\lfloor -1.5 \rfloor = -2$, $\lfloor -0.5 \rfloor = -1$, $\lfloor 0.9 \rfloor = 0$ and $\lfloor 2 \rfloor = 2$. For a negative non-integer the floor is the next integer down, further from 0.
- id: alg-m3-r2-q28
  lesson: a1-piecewise
  topic: Piecewise functions
  stem: 'Let $h(x) = \begin{cases} x + 3, & x < 0 \\ 3 - x, & x \ge 0 \end{cases}$. Which statements are true? Select all that apply.'
  choices:
    - '$h(0) = 3$'
    - '$h(-5) = 8$'
    - 'The range of $h$ is $(-\infty, 3]$'
    - 'The graph of $h$ has a jump at $x = 0$'
  answer: [0, 2]
  explanation: |-
    $h(0)$ uses the second piece: $3 - 0 = 3$. $h(-5)$ uses the first piece: $-5 + 3 = -2$ (8 comes from using $3 - x$). The first piece rises toward 3 and the second falls from 3, so the highest output is 3 and every smaller value is reached: range $(-\infty, 3]$. Both pieces give 3 at $x = 0$, so the graph is connected there (it is $3 - |x|$, an upside-down V).
- id: alg-m3-r2-q29
  lesson: a1-piecewise
  type: match
  module_quiz: true
  topic: Piecewise functions
  stem: 'Let $f(x) = \begin{cases} 3 - x, & x \le -1 \\ x^2, & -1 < x < 2 \\ 4, & x \ge 2 \end{cases}$. Match each input to the piece used to evaluate $f$ there.'
  pairs:
    - ['$x = -1$', First piece (3 − x)]
    - ['$x = 2$', Third piece (4)]
    - ['$x = -0.5$', Second piece (x²)]
    - ['$x = 1.99$', Second piece (x²)]
  explanation: |-
    $-1$ satisfies $x \le -1$ (the "or equal" includes it), so $f(-1) = 4$. 2 fails $x < 2$ but satisfies $x \ge 2$, so $f(2) = 4$. Both $-0.5$ and $1.99$ lie strictly between $-1$ and 2, so they use $x^2$: $f(-0.5) = 0.25$ and $f(1.99) = 3.9601$.
