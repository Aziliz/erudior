# Round 2 questions for alg-m3 (Functions and linear functions)
# ---- Core lessons: new question types
- id: alg-m3-r2-q01
  lesson: alg-functions
  type: label
  module_quiz: true
  topic: Functions
  stem: 'This mapping diagram shows a relation. Name the numbered parts.'
  image: {src: images/alg-m3-mapping-blank.svg, alt: 'A mapping diagram. The left oval holds −2, 0, 3 and 6; the right oval holds 1, 4, 7 and 9. Arrows go from −2 to 1, from 0 to 4, from 6 to 4, and from 3 to both 7 and 9.'}
  labels:
    - {x: 25, y: 85.5, text: Domain (the set of inputs)}
    - {x: 75, y: 85.5, text: Range (the set of outputs)}
    - {x: 16.9, y: 58.5, text: An input with two outputs}
    - {x: 83.1, y: 41.5, text: An output shared by two inputs}
  distractors: [An input with no output, An output with no input]
  explanation: |-
    The left oval holds the inputs (the domain) and the right oval the outputs (the range). The input 3 sends arrows to both 7 and 9, so this relation is not a function. The output 4 receives arrows from 0 and 6; a shared output is allowed in a function. Every input here has at least one arrow and every output has at least one arrow arriving.
- id: alg-m3-r2-q02
  lesson: alg-functions
  type: text
  topic: Functions
  stem: 'If $f(x) = 4 - x^2$, then $f(-3) =$ ___. Give only the number.'
  accept: ['-5']
  explanation: |-
    $f(-3) = 4 - (-3)^2 = 4 - 9 = -5$. The square applies to $-3$ in parentheses, so it is $+9$; writing $-3^2$ without parentheses would mean $-9$ and give 13.
- id: alg-m3-r2-q03
  lesson: alg-functions
  topic: Functions
  stem: 'Which of these relations are functions? Select all that apply.'
  choices:
    - '$\{(2, 5), (3, 5), (4, 5)\}$'
    - '$\{(0, 1), (1, 0), (0, -1)\}$'
    - '$y = |x|$'
    - '$x = y^2$'
  answer: [0, 2]
  explanation: |-
    In $\{(2, 5), (3, 5), (4, 5)\}$ each input appears once; the repeated output 5 is allowed. $y = |x|$ gives one value for each $x$. In $\{(0, 1), (1, 0), (0, -1)\}$ the input 0 has two outputs. In $x = y^2$, the input $x = 4$ gives $y = 2$ and $y = -2$.
- id: alg-m3-r2-q04
  lesson: alg-functions
  type: match
  module_quiz: true
  topic: Functions
  stem: 'Match each piece of function notation to what it means.'
  pairs:
    - ['$f(3)$', The output when the input is 3]
    - ['$f(x) = 3$', An equation asking which inputs give the output 3]
    - ['$f(g(3))$', Apply g to 3 then apply f to the result]
    - ['$(3, f(3))$', A point on the graph of f]
  distractors: [f multiplied by 3]
  explanation: |-
    $f(3)$ is an output, while $f(x) = 3$ is an equation to solve for inputs. In a composition the inside function acts first, so $f(g(3))$ applies $g$ first. The pair $(3, f(3))$ is the point on the graph above $x = 3$. Function notation never means multiplication.
- id: alg-m3-r2-q05
  lesson: alg-functions
  type: order
  topic: Functions
  stem: 'Let $f(x) = 1 - 2x$. Put these values in order from smallest to largest.'
  items: ['$f(3)$', '$f(\tfrac12)$', '$f(0)$', '$f(-2)$']
  explanation: |-
    $f(3) = 1 - 6 = -5$, $f(\tfrac12) = 1 - 1 = 0$, $f(0) = 1$ and $f(-2) = 1 + 4 = 5$. Because the slope is negative, larger inputs give smaller outputs.
- id: alg-m3-r2-q06
  lesson: alg-domain-range
  type: label
  module_quiz: true
  topic: Graphs of functions
  stem: 'Name the numbered features of the graph of this function.'
  image: {src: images/alg-m3-features-blank.svg, alt: 'A downward-opening curve on a grid. It starts at a solid dot at (−2, −3.5), crosses the x-axis at −1 and 5, crosses the y-axis at (0, 2.5), reaches its highest point at (2, 4.5), and ends at a hollow dot at (6, −3.5).'}
  labels:
    - {x: 13.6, y: 83.5, text: Closed endpoint (included)}
    - {x: 27, y: 55.1, text: Zero (x-intercept)}
    - {x: 34.7, y: 34.8, text: y-intercept}
    - {x: 50, y: 18.6, text: Maximum point}
    - {x: 86.4, y: 83.5, text: Open endpoint (not included)}
  distractors: [Vertical asymptote, Point where the slope is undefined]
  explanation: |-
    1 is a solid dot, so $x = -2$ is in the domain. 2 is where the graph meets the $x$-axis, a zero of the function. 3 is where it crosses the $y$-axis. 4 is the highest point, giving the maximum value 4.5. 5 is a hollow dot, so $x = 6$ is not in the domain: the domain is $[-2, 6)$ and the range is $[-3.5, 4.5]$.
- id: alg-m3-r2-q07
  lesson: alg-domain-range
  type: text
  topic: Domain and range
  stem: 'The domain of $f(x) = \sqrt{12 - 3x}$ is $(-\infty, a]$. What is $a$? Give only the number.'
  accept: ['4']
  explanation: |-
    The radicand must be nonnegative: $12 - 3x \ge 0$, so $-3x \ge -12$, and dividing by $-3$ flips the symbol: $x \le 4$. Check: $f(4) = \sqrt{0} = 0$ is defined, while $f(5) = \sqrt{-3}$ is not.
- id: alg-m3-r2-q08
  lesson: alg-domain-range
  topic: Domain and range
  stem: 'Which numbers are in the domain of $g(x) = \dfrac{\sqrt{x + 2}}{x - 3}$? Select all that apply.'
  choices: ['$-3$', '$-2$', '$0$', '$3$']
  answer: [1, 2]
  explanation: |-
    The square root needs $x + 2 \ge 0$, so $x \ge -2$, and the denominator needs $x \ne 3$. $g(-2) = \tfrac{0}{-5} = 0$ and $g(0) = \tfrac{\sqrt2}{-3}$ are defined. At $-3$ the radicand is $-1$, and at 3 the denominator is 0. (Here the root is in the numerator, so a radicand of 0 is fine.)
- id: alg-m3-r2-q09
  lesson: alg-domain-range
  type: match
  module_quiz: true
  topic: Domain and range
  stem: 'Match each function to its range.'
  pairs:
    - ['$f(x) = x^2 + 3$', '[3, ∞)']
    - ['$f(x) = -|x|$', '(−∞, 0]']
    - ['$f(x) = 2x - 1$', All real numbers]
    - ['$f(x) = \sqrt{x} - 1$', '[−1, ∞)']
  distractors: ['[0, ∞)']
  explanation: |-
    $x^2 \ge 0$, so $x^2 + 3 \ge 3$. $|x| \ge 0$, so $-|x| \le 0$. A non-horizontal line reaches every height. $\sqrt{x} \ge 0$, so $\sqrt{x} - 1 \ge -1$. In each case the lowest or highest value is actually reached (at $x = 0$), so the endpoint is included.
- id: alg-m3-r2-q10
  lesson: alg-domain-range
  type: text
  topic: Domain and range
  stem: 'A ball is tossed up from the ground, and its height after $t$ seconds is $h(t) = -16t^2 + 32t$ feet. Its practical domain is $[0, b]$, from launch until it lands. What is $b$? Give only the number.'
  accept: ['2']
  explanation: |-
    The ball is on the ground when $h(t) = 0$. That happens at launch, $t = 0$, and again at $t = 2$: $h(2) = -16(4) + 32(2) = -64 + 64 = 0$. Between those times the height is positive (for example $h(1) = 16$), so the practical domain is $[0, 2]$.
- id: alg-m3-r2-q11
  lesson: alg-slope
  type: label
  module_quiz: true
  topic: Slope
  stem: 'Each small graph shows one line. Name the kind of slope of each numbered line.'
  image: {src: images/alg-m3-slope-types-blank.svg, alt: 'Four small graphs in a 2 by 2 grid, each with axes and one line: top left, a line going down to the right; top right, a vertical line; bottom left, a line going up to the right; bottom right, a horizontal line.'}
  labels:
    - {x: 35.1, y: 30, text: Negative slope}
    - {x: 83.3, y: 17.3, text: Undefined slope}
    - {x: 35.1, y: 70, text: Positive slope}
    - {x: 82.7, y: 64.3, text: Zero slope}
  distractors: [A slope that changes along the line]
  explanation: |-
    Read each line from left to right. Line 1 falls (negative slope) and line 3 rises (positive slope). Line 4 is horizontal: rise 0, so slope 0. Line 2 is vertical: run 0, and dividing by 0 is undefined. A straight line's slope never changes along it.
- id: alg-m3-r2-q12
  lesson: alg-slope
  type: text
  module_quiz: true
  topic: Slope
  stem: 'The slope of the line through $(-3, 4)$ and $(5, -2)$ is ___. Give the exact value.'
  accept: ['-3/4', '-0.75']
  explanation: |-
    $m = \dfrac{-2 - 4}{5 - (-3)} = \dfrac{-6}{8} = -\dfrac34$. Subtract in the same order on top and bottom; mixing the order gives $+\tfrac34$.
- id: alg-m3-r2-q13
  lesson: alg-slope
  type: order
  topic: Slope
  stem: 'Put these lines in order from least steep to steepest.'
  items: ['$y = 3$', '$y = -\tfrac12 x + 1$', '$y = x - 4$', '$y = -3x + 2$']
  explanation: |-
    Steepness is the size of the slope, $|m|$: 0, $\tfrac12$, 1 and 3. The sign only tells the direction, so $y = -3x + 2$ is the steepest even though its slope is the smallest number.
- id: alg-m3-r2-q14
  lesson: alg-slope
  topic: Slope
  stem: 'A line has a negative slope. Which statements must be true? Select all that apply.'
  choices:
    - 'It falls from left to right.'
    - 'As $x$ increases, $y$ decreases.'
    - 'Its $y$-intercept is negative.'
    - 'It is steeper than every line with a positive slope.'
  answer: [0, 1]
  explanation: |-
    A negative slope means $y$ goes down as $x$ goes up, so the line falls to the right. The slope says nothing about where the line crosses the $y$-axis: $y = -x + 5$ has a positive intercept. Steepness depends on $|m|$, and $y = -\tfrac12 x$ is less steep than $y = 4x$.
- id: alg-m3-r2-q15
  lesson: alg-slope
  type: match
  topic: Slope
  stem: 'In each linear relationship, the first quantity is the output and the second is the input. Match each one to the units of its slope.'
  pairs:
    - [Distance in miles and time in hours, Miles per hour]
    - [Cost in dollars and weight in pounds, Dollars per pound]
    - [Water left in gallons and time in minutes, Gallons per minute]
    - [Elevation in meters and horizontal distance in kilometers, Meters per kilometer]
  distractors: [Hours per mile]
  explanation: |-
    Slope is change in output over change in input, so its units are output units per input unit. Hours per mile would be input over output, the reciprocal of the speed.
- id: alg-m3-r2-q16
  lesson: alg-line-forms
  type: text
  module_quiz: true
  topic: Equations of lines
  stem: 'The line through $(2, -1)$ with slope 3 has $y$-intercept $(0, b)$. What is $b$? Give only the number.'
  accept: ['-7']
  explanation: |-
    Point-slope form: $y + 1 = 3(x - 2)$, so $y = 3x - 6 - 1 = 3x - 7$ and $b = -7$. Check: $3(2) - 7 = -1$. (Or step back from $(2, -1)$ to $x = 0$: two steps left lowers $y$ by $2 \cdot 3 = 6$, giving $-7$.)
- id: alg-m3-r2-q17
  lesson: alg-line-forms
  type: match
  topic: Equations of lines
  stem: 'Match each equation to the form it is written in.'
  pairs:
    - ['$y = -2x + 5$', Slope-intercept form]
    - ['$y - 4 = 3(x + 1)$', Point-slope form]
    - ['$3x - 4y = 12$', Standard form]
  distractors: [Vertex form]
  explanation: |-
    $y = mx + b$ shows the slope and $y$-intercept, $y - y_1 = m(x - x_1)$ shows the slope and a point (here $(-1, 4)$), and $Ax + By = C$ is standard form. Vertex form belongs to quadratic functions (Lesson 25).
- id: alg-m3-r2-q18
  lesson: alg-line-forms
  type: order
  topic: Equations of lines
  stem: 'Put the steps in order to write the line through $(1, 5)$ and $(3, 9)$ in slope-intercept form.'
  items:
    - 'Find the slope: $m = \tfrac{9 - 5}{3 - 1} = 2$'
    - 'Use point-slope form: $y - 5 = 2(x - 1)$'
    - 'Distribute: $y - 5 = 2x - 2$'
    - 'Add 5 to both sides: $y = 2x + 3$'
    - 'Check the other point: $2(3) + 3 = 9$'
  explanation: |-
    The slope comes first because point-slope form needs it. After distributing and isolating $y$, checking the point you didn't use catches arithmetic slips.
- id: alg-m3-r2-q19
  lesson: alg-line-forms
  module_quiz: true
  topic: Equations of lines
  stem: 'Which equations describe the line through $(0, -2)$ with slope $\tfrac12$? Select all that apply.'
  choices:
    - '$y = \tfrac12 x - 2$'
    - '$x - 2y = 4$'
    - '$y + 2 = \tfrac12 x$'
    - '$x - 2y = -4$'
  answer: [0, 1, 2]
  explanation: |-
    Slope-intercept form is $y = \tfrac12 x - 2$. Point-slope form with $(0, -2)$ is $y + 2 = \tfrac12(x - 0)$. Solving $x - 2y = 4$ for $y$ gives $y = \tfrac12 x - 2$, the same line. But $x - 2y = -4$ gives $y = \tfrac12 x + 2$, a parallel line through $(0, 2)$.
- id: alg-m3-r2-q20
  lesson: alg-line-forms
  type: text
  topic: Equations of lines
  stem: 'The line $2x + 5y = 20$ crosses the $x$-axis at $(a, 0)$. What is $a$? Give only the number.'
  accept: ['10']
  explanation: |-
    On the $x$-axis, $y = 0$: $2x = 20$, so $x = 10$. (Setting $x = 0$ instead gives the $y$-intercept, $(0, 4)$.)
- id: alg-m3-r2-q21
  lesson: alg-parallel-perp
  type: text
  topic: Parallel and perpendicular
  stem: 'A line is perpendicular to $y = -\tfrac43 x + 2$. Its slope is ___. Give the exact value.'
  accept: ['3/4', '0.75']
  explanation: |-
    Flip the fraction and change the sign: the negative reciprocal of $-\tfrac43$ is $\tfrac34$. Check: $-\tfrac43 \cdot \tfrac34 = -1$. ($-\tfrac34$ only flips; $\tfrac43$ only changes the sign.)
- id: alg-m3-r2-q22
  lesson: alg-parallel-perp
  type: match
  module_quiz: true
  topic: Parallel and perpendicular
  stem: 'Each pair includes the line $y = 2x + 1$. Match each pair to how its two lines are related.'
  pairs:
    - ['$y = 2x + 1$ and $y = 2x - 5$', Parallel]
    - ['$y = 2x + 1$ and $y = -\tfrac12 x + 4$', Perpendicular]
    - ['$y = 2x + 1$ and $4x - 2y = -2$', The same line]
    - ['$y = 2x + 1$ and $y = -2x + 1$', Neither]
  explanation: |-
    Equal slopes with different intercepts give parallel lines. Slopes 2 and $-\tfrac12$ multiply to $-1$: perpendicular. Solving $4x - 2y = -2$ for $y$ gives $y = 2x + 1$, the same line. Slopes 2 and $-2$ are neither equal nor negative reciprocals (their product is $-4$), so those lines cross at an angle other than 90°.
- id: alg-m3-r2-q23
  lesson: alg-parallel-perp
  topic: Parallel and perpendicular
  stem: 'Which lines are parallel to the line $3x - y = 7$? Select all that apply.'
  choices:
    - '$y = 3x + 2$'
    - '$y = -3x + 7$'
    - '$6x - 2y = 1$'
    - '$y = 3x - 7$'
  answer: [0, 2]
  explanation: |-
    $3x - y = 7$ is $y = 3x - 7$: slope 3, intercept $-7$. $y = 3x + 2$ and $6x - 2y = 1$ (that is, $y = 3x - \tfrac12$) have slope 3 and other intercepts, so they are parallel. $y = 3x - 7$ is the same line, not a parallel one. $y = -3x + 7$ has slope $-3$.
- id: alg-m3-r2-q24
  lesson: alg-parallel-perp
  type: order
  topic: Parallel and perpendicular
  stem: 'Put the steps in order to write the line through $(6, 1)$ perpendicular to $2x + 3y = 9$.'
  items:
    - 'Solve for $y$: $y = -\tfrac23 x + 3$, so the given slope is $-\tfrac23$'
    - 'Take the negative reciprocal: the new slope is $\tfrac32$'
    - 'Use point-slope form: $y - 1 = \tfrac32(x - 6)$'
    - 'Simplify: $y = \tfrac32 x - 8$'
  explanation: |-
    You need the given slope before you can take its negative reciprocal, and you need the new slope before you can write the new line. Check: $\tfrac32(6) - 8 = 1$, and $-\tfrac23 \cdot \tfrac32 = -1$.
- id: alg-m3-r2-q25
  lesson: alg-parallel-perp
  type: text
  module_quiz: true
  topic: Linear models
  stem: 'A taxi charges a fixed fee plus a set amount per mile. A 4-mile ride costs \$13 and a 10-mile ride costs \$25. What is the fixed fee, in dollars? Give only the number.'
  accept: ['5', '5.00']
  explanation: |-
    The rate is the slope: $\tfrac{25 - 13}{10 - 4} = \tfrac{12}{6} = 2$ dollars per mile. Then $13 = 2(4) + b$ gives $b = 5$. The model is $C = 2m + 5$; check: $2(10) + 5 = 25$.
- id: alg-m3-r2-q26
  lesson: a1-piecewise
  type: text
  module_quiz: true
  topic: Piecewise functions
  stem: 'Let $f(x) = \begin{cases} x^2, & x < 2 \\ 3x - 1, & x \ge 2 \end{cases}$. Then $f(2) =$ ___. Give only the number.'
  accept: ['5']
  explanation: |-
    $x = 2$ fails $x < 2$ but satisfies $x \ge 2$, so use the second piece: $f(2) = 3(2) - 1 = 5$. The first piece would give 4, but it does not apply at 2.
- id: alg-m3-r2-q27
  lesson: a1-piecewise
  type: order
  topic: Piecewise functions
  stem: 'Put these values of the greatest integer function in order from smallest to largest.'
  items: ['$\lfloor -1.5 \rfloor$', '$\lfloor -0.5 \rfloor$', '$\lfloor 0.9 \rfloor$', '$\lfloor 2 \rfloor$']
  explanation: |-
    $\lfloor -1.5 \rfloor = -2$, $\lfloor -0.5 \rfloor = -1$, $\lfloor 0.9 \rfloor = 0$ and $\lfloor 2 \rfloor = 2$. For a negative non-integer the floor is the next integer down, further from 0.
- id: alg-m3-r2-q28
  lesson: a1-piecewise
  topic: Piecewise functions
  stem: 'Let $h(x) = \begin{cases} x + 3, & x < 0 \\ 3 - x, & x \ge 0 \end{cases}$. Which statements are true? Select all that apply.'
  choices:
    - '$h(0) = 3$'
    - '$h(-5) = 8$'
    - 'The range of $h$ is $(-\infty, 3]$'
    - 'The graph of $h$ has a jump at $x = 0$'
  answer: [0, 2]
  explanation: |-
    $h(0)$ uses the second piece: $3 - 0 = 3$. $h(-5)$ uses the first piece: $-5 + 3 = -2$ (8 comes from using $3 - x$). The first piece rises toward 3 and the second falls from 3, so the highest output is 3 and every smaller value is reached: range $(-\infty, 3]$. Both pieces give 3 at $x = 0$, so the graph is connected there (it is $3 - |x|$, an upside-down V).
- id: alg-m3-r2-q29
  lesson: a1-piecewise
  type: match
  module_quiz: true
  topic: Piecewise functions
  stem: 'Let $f(x) = \begin{cases} 3 - x, & x \le -1 \\ x^2, & -1 < x < 2 \\ 4, & x \ge 2 \end{cases}$. Match each input to the piece used to evaluate $f$ there.'
  pairs:
    - ['$x = -1$', First piece (3 − x)]
    - ['$x = 2$', Third piece (4)]
    - ['$x = -0.5$', Second piece (x²)]
    - ['$x = 1.99$', Second piece (x²)]
  explanation: |-
    $-1$ satisfies $x \le -1$ (the "or equal" includes it), so $f(-1) = 4$. 2 fails $x < 2$ but satisfies $x \ge 2$, so $f(2) = 4$. Both $-0.5$ and $1.99$ lie strictly between $-1$ and 2, so they use $x^2$: $f(-0.5) = 0.25$ and $f(1.99) = 3.9601$.
# ---- Honors lesson: Inverse functions
- id: alg-m3-r2-h01
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Find the inverse of $f(x) = 4x - 3$.'
  choices: ['$f^{-1}(x) = \dfrac{x + 3}{4}$', '$f^{-1}(x) = \dfrac{x - 3}{4}$', '$f^{-1}(x) = \dfrac{1}{4x - 3}$', '$f^{-1}(x) = \dfrac{x}{4} + 3$']
  answer: 0
  explanation: |-
    Swap and solve: $x = 4y - 3$, so $x + 3 = 4y$ and $y = \dfrac{x + 3}{4}$. Check: $f\left(\tfrac{x + 3}{4}\right) = (x + 3) - 3 = x$. $\dfrac{1}{4x - 3}$ is the reciprocal, not the inverse; $\tfrac{x}{4} + 3$ undoes the steps in the wrong order; $\tfrac{x - 3}{4}$ repeats the subtraction instead of undoing it.
- id: alg-m3-r2-h02
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Let $f(x) = 2x + 4$. What is $f^{-1}(8)$?'
  choices: ['$\tfrac{1}{20}$', '$2$', '$20$', '$0$']
  answer: 1
  explanation: |-
    $f^{-1}(8)$ is the input that gives 8: $2x + 4 = 8$, so $x = 2$. Check: $f(2) = 8$. 20 is $f(8)$, $\tfrac{1}{20}$ is $\tfrac{1}{f(8)}$, and 0 comes from dividing by 2 before subtracting 4.
- id: alg-m3-r2-h03
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Which function is one-to-one on all real numbers?'
  choices: ['$y = x^2$', '$y = |x|$', '$y = 3 - 2x$', '$y = 5$']
  answer: 2
  explanation: |-
    $y = 3 - 2x$ is a line with slope $-2 \ne 0$, so different inputs give different outputs. $x^2$ and $|x|$ give the same output for $x$ and $-x$ (both give 4 at $\pm2$), and $y = 5$ gives 5 for every input. Each of those fails the horizontal line test.
- id: alg-m3-r2-h04
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'A function is given by the table $\begin{array}{c|cccc} x & 1 & 2 & 3 & 4 \\ \hline f(x) & 7 & 4 & 9 & 0 \end{array}$. What is $f^{-1}(9)$?'
  choices: ['$\tfrac19$', '$4$', '$7$', '$3$']
  answer: 3
  explanation: |-
    Find 9 in the output row: it is under $x = 3$, so $f(3) = 9$ and $f^{-1}(9) = 3$. 4 and 7 are outputs of $f$ ($f(2)$ and $f(1)$), and $\tfrac19$ treats the $-1$ as an exponent.
- id: alg-m3-r2-h05
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'What is the slope of the graph of $f^{-1}$ if $f(x) = 5x - 2$?'
  choices: ['$\tfrac15$', '$-\tfrac15$', '$5$', '$-5$']
  answer: 0
  explanation: |-
    $f^{-1}(x) = \dfrac{x + 2}{5} = \tfrac15 x + \tfrac25$, so the slope is $\tfrac15$, the reciprocal of 5. $-\tfrac15$ is the negative reciprocal, which belongs to a perpendicular line, not to the inverse.
- id: alg-m3-r2-h06
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'The point $(-2, 7)$ is on the graph of a one-to-one function $f$. Which point must be on the graph of $f^{-1}$?'
  choices: ['$(2, -7)$', '$(7, -2)$', '$(-7, 2)$', '$(-2, \tfrac17)$']
  answer: 1
  explanation: |-
    $f(-2) = 7$ means $f^{-1}(7) = -2$, so the inverse swaps the coordinates: $(7, -2)$. That is the mirror image of $(-2, 7)$ across $y = x$. Changing signs reflects across an axis or through the origin instead.
- id: alg-m3-r2-h07
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'A streaming service charges $C(r) = 12 + 4r$ dollars for a month with $r$ rentals. What does $C^{-1}(40)$ represent?'
  choices:
    - 'The bill, in dollars, for a month with 40 rentals'
    - 'The reciprocal of the bill for a month with 40 rentals'
    - 'The number of rentals in a month whose bill is \$40'
    - 'The cost of one rental when the bill is \$40'
  answer: 2
  explanation: |-
    The inverse takes an output of $C$ (a bill in dollars) back to its input (a number of rentals). $C^{-1}(40) = \tfrac{40 - 12}{4} = 7$: a \$40 bill means 7 rentals. The bill for 40 rentals is $C(40) = 172$ dollars.
- id: alg-m3-r2-h08
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Let $g(x) = (x + 1)^2$ with domain $x \ge -1$. Which is $g^{-1}(x)$, for $x \ge 0$?'
  choices: ['$\sqrt{x} + 1$', '$\sqrt{x - 1}$', '$-\sqrt{x} - 1$', '$\sqrt{x} - 1$']
  answer: 3
  explanation: |-
    Swap: $x = (y + 1)^2$ with $y \ge -1$, so $y + 1 \ge 0$ is the nonnegative root: $y + 1 = \sqrt{x}$ and $y = \sqrt{x} - 1$. Check: $g^{-1}(9) = 2$ and $g(2) = 9$. $-\sqrt{x} - 1$ is the inverse for the other half, $x \le -1$; $\sqrt{x - 1}$ undoes the steps in the wrong order.
- id: alg-m3-r2-h09
  lesson: alg-m3-h-inverse-functions
  type: text
  topic: Inverse functions
  stem: 'If $f(x) = 3x - 7$, then $f^{-1}(8) =$ ___. Give only the number.'
  accept: ['5']
  explanation: |-
    $f^{-1}(x) = \dfrac{x + 7}{3}$, so $f^{-1}(8) = \tfrac{15}{3} = 5$. Check: $f(5) = 15 - 7 = 8$.
- id: alg-m3-r2-h10
  lesson: alg-m3-h-inverse-functions
  type: text
  topic: Inverse functions
  stem: 'The graph of $f^{-1}$ is the reflection of the graph of $f$ across the line $y =$ ___.'
  accept: ['x', 'y = x', 'y=x']
  explanation: |-
    The inverse swaps every point $(a, b)$ to $(b, a)$, and those two points are mirror images across $y = x$: the segment joining them has slope $-1$, perpendicular to $y = x$, and its midpoint lies on $y = x$.
- id: alg-m3-r2-h11
  lesson: alg-m3-h-inverse-functions
  type: order
  topic: Inverse functions
  stem: 'Put the steps in order to find the inverse of $f(x) = \dfrac{x - 4}{2}$.'
  items:
    - 'Write $y = \dfrac{x - 4}{2}$'
    - 'Swap $x$ and $y$: $x = \dfrac{y - 4}{2}$'
    - 'Multiply both sides by 2: $2x = y - 4$'
    - 'Add 4 to both sides: $y = 2x + 4$, so $f^{-1}(x) = 2x + 4$'
    - 'Check: $f(2x + 4) = \dfrac{2x + 4 - 4}{2} = x$'
  explanation: |-
    The swap comes before solving, and solving undoes $f$'s steps in reverse: $f$ subtracts 4 and then divides by 2, so the inverse multiplies by 2 and then adds 4. The check confirms the formula.
- id: alg-m3-r2-h12
  lesson: alg-m3-h-inverse-functions
  type: match
  topic: Inverse functions
  stem: 'Match each function to its inverse.'
  pairs:
    - ['$f(x) = x + 5$', x − 5]
    - ['$f(x) = 5x$', x/5]
    - ['$f(x) = 5 - x$', 5 − x]
    - ['$f(x) = \sqrt{x}$', x² for x ≥ 0]
  distractors: [1/(5x)]
  explanation: |-
    Adding 5 is undone by subtracting 5, and multiplying by 5 by dividing by 5. For $5 - x$: swapping gives $x = 5 - y$, so $y = 5 - x$; this function is its own inverse. $\sqrt{x}$ is the inverse of $x^2$ on $x \ge 0$, so the reverse is true too. $\tfrac{1}{5x}$ is the reciprocal of $5x$, not its inverse.
- id: alg-m3-r2-h13
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Let $f$ be any one-to-one function. Which statements are true? Select all that apply.'
  choices:
    - 'The domain of $f^{-1}$ is the range of $f$.'
    - '$f^{-1}(f(x)) = x$ for every $x$ in the domain of $f$.'
    - '$f^{-1}(x) = \dfrac{1}{f(x)}$'
    - 'The graph of $f^{-1}$ is the reflection of the graph of $f$ across the $x$-axis.'
  answer: [0, 1]
  explanation: |-
    The inverse swaps inputs and outputs, so its domain is the range of $f$, and applying $f$ then $f^{-1}$ returns the starting input. The $-1$ is not an exponent: for $f(x) = x + 1$, $f^{-1}(x) = x - 1$, not $\tfrac{1}{x + 1}$. The mirror line is $y = x$, not the $x$-axis.
- id: alg-m3-r2-h14
  lesson: alg-m3-h-inverse-functions
  topic: Inverse functions
  stem: 'Which functions pass the horizontal line test (on their whole domains)? Select all that apply.'
  choices: ['$f(x) = 2x - 9$', '$f(x) = x^2 - 4$', '$f(x) = x^3$', '$f(x) = |x - 1|$', '$f(x) = \sqrt{x}$']
  answer: [0, 2, 4]
  explanation: |-
    A non-horizontal line, the cubic $x^3$ and the half-parabola $\sqrt{x}$ always rise, so each output comes from one input. $x^2 - 4$ gives $0$ at both $2$ and $-2$, and $|x - 1|$ gives 1 at both 0 and 2, so a horizontal line crosses each of those graphs twice.
# ---- Honors lesson: Piecewise linear models
- id: alg-m3-r2-h15
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'A plan costs \$40 a month and includes 15 GB of data; each GB beyond 15 costs \$5, charged in proportion to the amount used. Which formula gives the bill for $g > 15$ GB?'
  choices: ['$C = 40 + 5g$', '$C = 40 + 5(g - 15)$', '$C = 5(g - 15)$', '$C = 55 + 5g$']
  answer: 1
  explanation: |-
    Only the data beyond 15 GB costs extra, and that amount is $g - 15$; the \$40 is still paid. $40 + 5g$ charges for the included 15 GB again, and $5(g - 15)$ forgets the monthly fee. The second piece is the line through the breakpoint $(15, 40)$ with slope 5.
- id: alg-m3-r2-h16
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'With the plan in the previous question (\$40 including 15 GB, then \$5 per GB), what is the bill for 18.4 GB?'
  choices: ['\$40', '\$132', '\$57', '\$17']
  answer: 2
  explanation: |-
    $40 + 5(18.4 - 15) = 40 + 5(3.4) = 40 + 17 = 57$ dollars. \$132 charges \$5 for all 18.4 GB, \$17 leaves out the monthly fee, and \$40 ignores the extra data.
- id: alg-m3-r2-h17
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'For which value of $k$ is $f(x) = \begin{cases} x + k, & x < 2 \\ 3x - 1, & x \ge 2 \end{cases}$ continuous?'
  choices: ['$1$', '$5$', '$-3$', '$3$']
  answer: 3
  explanation: |-
    At the breakpoint $x = 2$ the second piece gives $3(2) - 1 = 5$, and the first piece heads toward $2 + k$. They meet when $2 + k = 5$, so $k = 3$. Choosing 5 sets $k$ equal to the value instead of $2 + k$.
- id: alg-m3-r2-h18
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Which function has a jump at $x = 1$?'
  choices:
    - '$\begin{cases} 2x, & x < 1 \\ x + 2, & x \ge 1 \end{cases}$'
    - '$\begin{cases} 2x, & x < 1 \\ x + 1, & x \ge 1 \end{cases}$'
    - '$\begin{cases} 3 - x, & x < 1 \\ 2x, & x \ge 1 \end{cases}$'
    - '$\begin{cases} x^2 + 1, & x < 1 \\ 4x - 2, & x \ge 1 \end{cases}$'
  answer: 0
  explanation: |-
    Compare the two formulas at $x = 1$. In the first function they give $2$ and $3$, so the graph jumps from just under 2 up to 3. In each of the others both formulas give 2 at $x = 1$, so the pieces meet.
- id: alg-m3-r2-h19
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'The lesson''s made-up tax schedule charges 10% on the first \$20,000, 20% on income from \$20,000 to \$60,000, and 30% above \$60,000. What is the tax on \$30,000?'
  choices: ['\$6,000', '\$4,000', '\$3,000', '\$9,000']
  answer: 1
  explanation: |-
    10% of the first \$20,000 is \$2,000, and 20% of the remaining \$10,000 is \$2,000: \$4,000 in all. \$6,000 applies 20% to the whole income, \$3,000 applies 10% to all of it, and \$9,000 applies 30%.
- id: alg-m3-r2-h20
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Under the same schedule (10% to \$20,000, 20% to \$60,000, 30% above), what is the average tax rate on an income of \$45,000?'
  choices: ['20%', '15%', 'about 15.6%', '30%']
  answer: 2
  explanation: |-
    $T(45{,}000) = 2{,}000 + 0.20(25{,}000) = 7{,}000$, and $\tfrac{7{,}000}{45{,}000} \approx 0.156$. 20% is the marginal rate (on the next dollar), and 15% averages the two rates without weighting them by how much income each layer holds.
- id: alg-m3-r2-h21
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Under the same schedule, someone owes \$13,000. What is their income?'
  choices: ['\$43,333', '\$65,000', '\$75,000', '\$70,000']
  answer: 3
  explanation: |-
    The tax at \$60,000 is \$10,000, and \$13,000 is more, so use the top piece: $10{,}000 + 0.30(x - 60{,}000) = 13{,}000$, giving $x - 60{,}000 = 10{,}000$ and $x = 70{,}000$. \$43,333 divides \$13,000 by 30% as if every dollar were taxed at 30%; \$75,000 uses 20% for the top layer.
- id: alg-m3-r2-h22
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Under the same schedule, a raise takes someone''s income from \$58,000 to \$62,000. How does their after-tax income change?'
  choices: ['It rises by \$3,000', 'It falls by \$1,000', 'It rises by \$2,800', 'It rises by \$4,000']
  answer: 0
  explanation: |-
    $T(58{,}000) = 2{,}000 + 0.20(38{,}000) = 9{,}600$ and $T(62{,}000) = 10{,}000 + 0.30(2{,}000) = 10{,}600$. The tax rises by \$1,000, so after-tax income rises by $4{,}000 - 1{,}000 = 3{,}000$. \$2,800 assumes the whole raise is taxed at 30%; only the \$2,000 above \$60,000 is.
- id: alg-m3-r2-h23
  lesson: alg-m3-h-piecewise-models
  type: text
  topic: Piecewise linear models
  stem: 'Under the lesson''s schedule (10% to \$20,000, 20% to \$60,000, 30% above), the tax on an income of \$90,000 is ___ dollars. Give only the number.'
  accept: ['19000', '19,000', '19000.00']
  explanation: |-
    $T(90{,}000) = 10{,}000 + 0.30(30{,}000) = 10{,}000 + 9{,}000 = 19{,}000$. The \$10,000 is the tax on the first \$60,000 (\$2,000 + \$8,000).
- id: alg-m3-r2-h24
  lesson: alg-m3-h-piecewise-models
  type: text
  topic: Piecewise linear models
  stem: 'The function $f(x) = \begin{cases} 4x - 1, & x \le 2 \\ ax + 3, & x > 2 \end{cases}$ is continuous when $a =$ ___. Give only the number.'
  accept: ['2']
  explanation: |-
    At $x = 2$ the first piece gives $4(2) - 1 = 7$ and the second heads toward $2a + 3$. Setting $2a + 3 = 7$ gives $a = 2$.
- id: alg-m3-r2-h25
  lesson: alg-m3-h-piecewise-models
  type: order
  topic: Piecewise linear models
  stem: 'Under the lesson''s tax schedule, put the steps in order to find the income on which the tax is \$5,000.'
  items:
    - 'Find the tax at each breakpoint: \$2,000 at \$20,000 and \$10,000 at \$60,000'
    - 'Since \$5,000 is between \$2,000 and \$10,000, choose the second piece'
    - 'Solve $2{,}000 + 0.20(x - 20{,}000) = 5{,}000$'
    - 'Get $x = 35{,}000$'
    - 'Check: $T(35{,}000) = 2{,}000 + 3{,}000 = 5{,}000$'
  explanation: |-
    The breakpoint values tell you which piece can produce \$5,000, so they come first. Then solve that piece's equation: $0.20(x - 20{,}000) = 3{,}000$ gives $x = 35{,}000$, which is inside the second layer. Checking last confirms it.
- id: alg-m3-r2-h26
  lesson: alg-m3-h-piecewise-models
  type: match
  topic: Piecewise linear models
  stem: 'The phone plan $C(g) = 35$ for $0 \le g \le 10$ and $C(g) = 35 + 6(g - 10)$ for $g > 10$ gives the monthly bill in dollars for $g$ GB of data. Match each feature to its meaning.'
  pairs:
    - ['The breakpoint $g = 10$', The data allowance included in the base price]
    - ['The slope 0 of the first piece', Data within the allowance costs nothing extra]
    - ['The slope 6 of the second piece', The cost of each GB beyond the allowance]
    - ['The value $C(10) = 35$', The bill when exactly the allowance is used]
  distractors: [The total cost of 6 GB of data]
  explanation: |-
    The rule changes at 10 GB, the allowance. Below it the bill is flat (slope 0); above it each extra GB adds \$6 (slope 6). $C(10) = 35$ is the bill at the breakpoint. The cost of 6 GB is $C(6) = 35$, not 6.
- id: alg-m3-r2-h27
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Under the lesson''s schedule (10% to \$20,000, 20% to \$60,000, 30% above), which statements are true for an income of \$75,000? Select all that apply.'
  choices:
    - 'The marginal tax rate is 30%.'
    - 'All \$75,000 is taxed at 30%.'
    - 'The average tax rate is less than 20%.'
    - 'The tax is \$22,500.'
  answer: [0, 2]
  explanation: |-
    The next dollar falls in the top layer, so the marginal rate is 30%. But only the \$15,000 above \$60,000 is taxed at 30%: the tax is $2{,}000 + 8{,}000 + 4{,}500 = 14{,}500$ dollars, an average rate of about 19.3%. \$22,500 is 30% of the whole income.
- id: alg-m3-r2-h28
  lesson: alg-m3-h-piecewise-models
  topic: Piecewise linear models
  stem: 'Which of these functions are continuous? Select all that apply.'
  choices:
    - '$\begin{cases} 5, & x \le 4 \\ 5 + 2(x - 4), & x > 4 \end{cases}$'
    - '$\begin{cases} 5, & x \le 4 \\ 5 + 2x, & x > 4 \end{cases}$'
    - '$\begin{cases} x, & x < 0 \\ -x, & x \ge 0 \end{cases}$'
    - '$\begin{cases} x + 1, & x < 0 \\ x - 1, & x \ge 0 \end{cases}$'
  answer: [0, 2]
  explanation: |-
    Compare the formulas at each breakpoint. First: both give 5 at $x = 4$. Second: 5 versus $5 + 8 = 13$, a jump. Third: both give 0 at $x = 0$ (the graph is an upside-down V, $-|x|$). Fourth: 1 versus $-1$, a jump.
# ---- Honors lesson: Average rate of change
- id: alg-m3-r2-h29
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'What is the average rate of change of $f(x) = x^2 - 3x$ from $x = 1$ to $x = 4$?'
  choices: ['$\tfrac32$', '$6$', '$2$', '$-2$']
  answer: 2
  explanation: |-
    $f(1) = -2$ and $f(4) = 4$, so the rate is $\dfrac{4 - (-2)}{4 - 1} = \dfrac{6}{3} = 2$. The shortcut agrees: $a(p + q) + b = 1(5) - 3 = 2$. 6 forgets to divide by the change in $x$, and $\tfrac32$ divides by 4 instead of $4 - 1$.
- id: alg-m3-r2-h30
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'A town''s population $P$ (in hundreds) is $100, 130, 190, 280$ at $t = 0, 2, 4, 6$ years. What is the average rate of change of $P$ from $t = 2$ to $t = 6$, in hundreds of people per year?'
  choices: ['$75$', '$45$', '$46\tfrac23$', '$37.5$']
  answer: 3
  explanation: |-
    $\dfrac{P(6) - P(2)}{6 - 2} = \dfrac{280 - 130}{4} = \dfrac{150}{4} = 37.5$. 75 divides by the number of table steps (2) instead of the number of years, 45 is the rate on $[4, 6]$ only, and $46\tfrac23$ is $\tfrac{280}{6}$, which ignores the starting value.
- id: alg-m3-r2-h31
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'A tank holds 500 L of water at $t = 0$ minutes, 380 L at $t = 3$ and 230 L at $t = 8$. What is the average rate of change of the volume from $t = 0$ to $t = 8$?'
  choices: ['$-33.75$ L/min', '$-35$ L/min', '$-270$ L/min', '$-30$ L/min']
  answer: 0
  explanation: |-
    Total change over total time: $\dfrac{230 - 500}{8 - 0} = \dfrac{-270}{8} = -33.75$ L/min. The rates on the two parts are $-40$ (on $[0, 3]$) and $-30$ (on $[3, 8]$); averaging them gives $-35$, which is wrong because the parts last 3 and 5 minutes. $-270$ forgets to divide by the time.
- id: alg-m3-r2-h32
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'The average rate of change of $f$ on $[a, b]$ is equal to which of these?'
  choices:
    - 'The slope of the tangent line at $x = a$'
    - 'The slope of the secant line through $(a, f(a))$ and $(b, f(b))$'
    - 'The average of $f(a)$ and $f(b)$'
    - 'The difference $f(b) - f(a)$'
  answer: 1
  explanation: |-
    $\dfrac{f(b) - f(a)}{b - a}$ is the slope of the line through the two endpoints of the graph, the secant line. $f(b) - f(a)$ is only the numerator, and the tangent line's slope is the rate at a single point, which usually differs.
- id: alg-m3-r2-h33
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'Over four back-to-back intervals of equal width, moving left to right, a function''s average rates of change are $5, 3, 1, -1$. What does its graph do?'
  choices: ['It is a straight line', 'It bends upward', 'It bends downward', 'It has a jump']
  answer: 2
  explanation: |-
    Decreasing rates over equal-width intervals mean the graph rises less and less steeply and then starts to fall: it bends downward, like a ball's height. A straight line would have equal rates on every interval, and the rates alone do not show a jump.
- id: alg-m3-r2-h34
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'Simplify the difference quotient $\dfrac{f(1 + h) - f(1)}{h}$ for $f(x) = 2x^2$ and $h \ne 0$.'
  choices: ['$4 + h$', '$2 + 2h$', '$4h + 2h^2$', '$4 + 2h$']
  answer: 3
  explanation: |-
    $f(1 + h) = 2(1 + 2h + h^2) = 2 + 4h + 2h^2$. Subtract $f(1) = 2$: $4h + 2h^2$. Divide by $h$: $4 + 2h$. Stopping before dividing leaves $4h + 2h^2$; $4 + h$ forgets to double the $h^2$ term.
- id: alg-m3-r2-h35
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'What is the instantaneous rate of change of $f(x) = x^2$ at $x = 5$?'
  choices: ['$10$', '$25$', '$5$', '$11$']
  answer: 0
  explanation: |-
    $\dfrac{(5 + h)^2 - 25}{h} = \dfrac{10h + h^2}{h} = 10 + h$, which approaches 10 as $h$ approaches 0. 11 is the average rate on $[5, 6]$ (the case $h = 1$), and 25 is the value $f(5)$, not a rate.
- id: alg-m3-r2-h36
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'A ball''s height is $h(t) = -16t^2 + 48t$ feet after $t$ seconds. What is its average velocity from $t = 1$ to $t = 2$?'
  choices: ['$32$ ft/s', '$0$ ft/s', '$16$ ft/s', '$-16$ ft/s']
  answer: 1
  explanation: |-
    $h(1) = 32$ and $h(2) = -64 + 96 = 32$, so the average velocity is $\tfrac{32 - 32}{1} = 0$. The ball rose and came back to the same height; the interval is centered on the top of its path at $t = 1.5$. (Shortcut: $-16(1 + 2) + 48 = 0$.) 32 is the height, not a rate.
- id: alg-m3-r2-h37
  lesson: alg-m3-h-average-rate
  type: text
  topic: Average rate of change
  stem: 'The average rate of change of $f(x) = 3x^2 + 2x - 1$ from $x = 1$ to $x = 3$ is ___. Give only the number.'
  accept: ['14']
  explanation: |-
    $f(1) = 4$ and $f(3) = 27 + 6 - 1 = 32$, so the rate is $\tfrac{32 - 4}{3 - 1} = \tfrac{28}{2} = 14$. Shortcut: $a(p + q) + b = 3(4) + 2 = 14$.
- id: alg-m3-r2-h38
  lesson: alg-m3-h-average-rate
  type: text
  topic: Average rate of change
  stem: 'For $f(x) = x^2$, the difference quotient $\dfrac{f(4 + h) - f(4)}{h}$ gets closer and closer to ___ as $h$ approaches 0. Give only the number.'
  accept: ['8']
  explanation: |-
    $\dfrac{(4 + h)^2 - 16}{h} = \dfrac{8h + h^2}{h} = 8 + h$ for $h \ne 0$, which approaches 8. So the instantaneous rate of change of $x^2$ at 4 is 8, the slope of the tangent line at $(4, 16)$.
- id: alg-m3-r2-h39
  lesson: alg-m3-h-average-rate
  type: order
  topic: Average rate of change
  stem: 'For $f(x) = x^2$, put these intervals in order from the smallest to the largest average rate of change of $f$ on them.'
  items: ['$[-3, -1]$', '$[0, 2]$', '$[1, 2]$', '$[2, 5]$']
  explanation: |-
    For $x^2$ the average rate on $[p, q]$ is $p + q$: $-4$, $2$, $3$ and $7$. Directly, for example, $\tfrac{1 - 9}{-1 - (-3)} = -4$ and $\tfrac{25 - 4}{3} = 7$.
- id: alg-m3-r2-h40
  lesson: alg-m3-h-average-rate
  type: match
  topic: Average rate of change
  stem: 'A ball''s height is $h(t) = -16t^2 + 64t + 5$ feet. Match each time interval to the ball''s average velocity on it.'
  pairs:
    - ['$[0, 1]$', 48 ft/s]
    - ['$[1, 2]$', 16 ft/s]
    - ['$[1, 3]$', 0 ft/s]
    - ['$[2, 4]$', −32 ft/s]
  distractors: [64 ft/s]
  explanation: |-
    Heights: $h(0) = 5$, $h(1) = 53$, $h(2) = 69$, $h(3) = 53$, $h(4) = 5$. So $[0, 1]$: $48$; $[1, 2]$: $16$; $[1, 3]$: $\tfrac{0}{2} = 0$; $[2, 4]$: $\tfrac{5 - 69}{2} = -32$. The shortcut $-16(p + q) + 64$ gives the same values. 64 ft/s would be the velocity at the instant of the throw.
- id: alg-m3-r2-h41
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'Let $f(x) = mx + b$ be a linear function. Which statements are true? Select all that apply.'
  choices:
    - 'Its average rate of change on every interval is $m$.'
    - 'Its difference quotient equals $m$ for every $h \ne 0$.'
    - 'Its average rate of change is largest on the longest interval.'
    - 'Its instantaneous rate of change depends on $x$.'
  answer: [0, 1]
  explanation: |-
    $\dfrac{f(x_2) - f(x_1)}{x_2 - x_1} = \dfrac{m(x_2 - x_1)}{x_2 - x_1} = m$ on every interval, so the difference quotient is $m$ for every $h \ne 0$, and the instantaneous rate is $m$ everywhere. The length of the interval doesn't matter.
- id: alg-m3-r2-h42
  lesson: alg-m3-h-average-rate
  topic: Average rate of change
  stem: 'A car''s position is $s(t)$ miles after $t$ hours, and its average rate of change on $[0, 2]$ is 50 mph. Which statements must be true? Select all that apply.'
  choices:
    - '$s(2) - s(0) = 100$'
    - 'The speedometer read 50 mph the whole time.'
    - 'The secant line through $(0, s(0))$ and $(2, s(2))$ has slope 50.'
