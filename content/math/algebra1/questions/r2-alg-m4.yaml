- id: alg-m4-r2-h27
  lesson: alg-m4-h-linear-programming
  topic: Linear programming
  stem: 'Which describes the simplex method?'
  choices: ['It lists every vertex of the region and compares all the objective values', 'It starts at a vertex and repeatedly moves along an edge to a neighboring vertex with a better objective value, stopping when no neighbor is better', 'It rounds the objective function to whole numbers before graphing', 'It guesses random points inside the region and keeps the best one']
  answer: 1
  explanation: |-
    George Dantzig's simplex method (1947) walks from corner to better neighboring corner. That avoids listing every corner, which for large problems could be astronomically many. It is the corner principle turned into a step-by-step procedure.
- id: alg-m4-r2-h28
  lesson: alg-m4-h-linear-programming
  type: order
  topic: Linear programming
  stem: 'Put these events in the history of linear programming in order, earliest first.'
  items:
    - Kantorovich writes about planning production with limited resources
    - Dantzig invents the simplex method while working on Air Force planning
    - Kantorovich and Koopmans share the Nobel Memorial Prize in Economic Sciences
  explanation: |-
    Kantorovich's work dates from 1939, Dantzig's simplex method from 1947, and the Nobel Memorial Prize to Kantorovich and Koopmans from 1975.
