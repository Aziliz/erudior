# Square roots, exponential functions, and sequences
- id: a1-q-2601
  lesson: a1-square-roots
  module_quiz: true
  topic: Square roots
  stem: 'Simplify $\sqrt{72}$.'
  choices: ['$6\sqrt2$', '$36\sqrt2$', '$2\sqrt6$', '$9\sqrt2$']
  answer: 0
  explanation: |-
    The largest perfect square dividing 72 is 36: $\sqrt{72} = \sqrt{36 \cdot 2} = 6\sqrt2$.
    $36\sqrt2$ forgets to take the square root of 36, and $2\sqrt6$ swaps the outside number and the radicand.
- id: a1-q-2602
  lesson: a1-square-roots
  module_quiz: true
  topic: Square roots
  stem: 'Which number is irrational?'
  choices: ['$\sqrt{\tfrac{16}{25}}$', '$\sqrt{50}$', '$\sqrt{81}$', '$\sqrt{0.49}$']
  answer: 1
  explanation: |-
    50 is not a perfect square, so $\sqrt{50} = 5\sqrt2$ is irrational.
    The others are rational: $\sqrt{81} = 9$, $\sqrt{0.49} = 0.7$ and $\sqrt{\tfrac{16}{25}} = \tfrac45$.
- id: a1-q-2603
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Simplify $\sqrt{12} + 5\sqrt3 - \sqrt{27}$.'
  choices: ['$10\sqrt3$', '$5\sqrt3$', '$4\sqrt3$', '$-2\sqrt3$']
  answer: 2
  explanation: |-
    Simplify first: $\sqrt{12} = 2\sqrt3$ and $\sqrt{27} = \sqrt{9 \cdot 3} = 3\sqrt3$.
    Then $2\sqrt3 + 5\sqrt3 - 3\sqrt3 = 4\sqrt3$. ($10\sqrt3$ adds the last term instead of subtracting it; $-2\sqrt3$ uses $\sqrt{27} = 9\sqrt3$, forgetting to take the root of 9.)
- id: a1-q-2604
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Simplify $(2\sqrt6)(5\sqrt3)$.'
  choices: ['$7\sqrt{18}$', '$10\sqrt{9}$', '$60\sqrt2$', '$30\sqrt2$']
  answer: 3
  explanation: |-
    Multiply outside numbers and radicands: $10\sqrt{18} = 10\sqrt{9 \cdot 2} = 10 \cdot 3\sqrt2 = 30\sqrt2$.
    $7\sqrt{18}$ adds the 2 and 5 instead of multiplying; $10\sqrt9$ multiplies $6 \cdot 3$ wrong ($6 \cdot 3 = 18$, not 9).
- id: a1-q-2605
  lesson: a1-square-roots
  module_quiz: true
  topic: Square roots
  stem: 'A student writes $\sqrt{16 + 9} = \sqrt{16} + \sqrt{9} = 7$. What is the correct value of $\sqrt{16 + 9}$?'
  choices: ['$5$', '$7$', '$25$', '$\sqrt7$']
  answer: 0
  explanation: |-
    Add under the radical first: $\sqrt{16 + 9} = \sqrt{25} = 5$.
    There is no rule $\sqrt{a + b} = \sqrt a + \sqrt b$; the product rule splits products, not sums.
- id: a1-q-2606
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Between which two consecutive whole numbers does $\sqrt{90}$ lie?'
  choices: ['10 and 11', '9 and 10', '8 and 9', '45 and 46']
  answer: 1
  explanation: |-
    $81 < 90 < 100$, so $\sqrt{81} < \sqrt{90} < \sqrt{100}$, that is $9 < \sqrt{90} < 10$. (In fact $\sqrt{90} \approx 9.49$.) 45 is half of 90, not its square root.
- id: a1-q-2607
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Simplify $\sqrt3\,(\sqrt3 + 6)$.'
  choices: ['$7\sqrt3$', '$9$', '$3 + 6\sqrt3$', '$9\sqrt3$']
  answer: 2
  explanation: |-
    Distribute: $\sqrt3 \cdot \sqrt3 + 6\sqrt3 = 3 + 6\sqrt3$.
    The 3 and $6\sqrt3$ are not like terms, so they don't combine into $9\sqrt3$.
- id: a1-q-2608
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Which statement is always true?'
  choices: ['The product of two irrational numbers is irrational.', 'The sum of two irrational numbers is irrational.', 'The square root of any whole number that is not prime is rational.', 'The sum of a rational number and an irrational number is irrational.']
  answer: 3
  explanation: |-
    If $q + x$ were rational with $q$ rational, then $x = (q + x) - q$ would be rational too, so rational + irrational is irrational.
    The others fail: $\sqrt2 \cdot \sqrt2 = 2$; $\sqrt3 + (-\sqrt3) = 0$; and $\sqrt8$ is irrational although 8 isn't prime.
- id: a1-q-2609
  lesson: a1-square-roots
  topic: Square roots
  stem: 'A right triangle has legs 4 and 8. What is the exact length of the hypotenuse?'
  choices: ['$4\sqrt5$', '$12$', '$2\sqrt3$', '$8\sqrt2$']
  answer: 0
  explanation: |-
    $c^2 = 4^2 + 8^2 = 16 + 64 = 80$, so $c = \sqrt{80} = \sqrt{16 \cdot 5} = 4\sqrt5 \approx 8.94$.
    12 adds the legs; $2\sqrt3 = \sqrt{4 + 8}$ forgets to square them; $8\sqrt2 = \sqrt{8^2 + 8^2}$ uses 8 for both legs.
- id: a1-q-2610
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Solve $x^2 = 50$.'
  choices: ['$x = \pm 2\sqrt5$', '$x = \pm 5\sqrt2$', '$x = 5\sqrt2$ only', '$x = \pm 25$']
  answer: 1
  explanation: |-
    Both $5\sqrt2$ and $-5\sqrt2$ square to 50, so $x = \pm\sqrt{50} = \pm 5\sqrt2$.
    The symbol $\sqrt{50}$ by itself is only the positive root; an equation $x^2 = 50$ has two solutions.
- id: a1-q-2611
  lesson: a1-square-roots
  topic: Square roots
  stem: 'Which square root is already in simplest radical form?'
  choices: ['$\sqrt{45}$', '$\sqrt{48}$', '$\sqrt{30}$', '$\sqrt{28}$']
  answer: 2
  explanation: |-
    $30 = 2 \cdot 3 \cdot 5$ has no perfect-square factor besides 1.
    The others simplify: $\sqrt{28} = 2\sqrt7$, $\sqrt{45} = 3\sqrt5$, $\sqrt{48} = 4\sqrt3$.
- id: a1-q-2612
  lesson: a1-square-roots
  topic: Square roots
  stem: 'A student simplifies $\sqrt{48}$: (1) $48 = 16 \cdot 3$; (2) $\sqrt{48} = \sqrt{16} + \sqrt3$; (3) $= 4 + \sqrt3$. Where is the error?'
  choices: ['Step 1: 48 is not $16 \cdot 3$', 'Step 2: $\sqrt{16 \cdot 3}$ splits into a product, $\sqrt{16} \cdot \sqrt3$', 'Step 3: $\sqrt{16}$ is 8', 'Step 2: it should be $\sqrt{16} - \sqrt3$']
  answer: 1
  explanation: |-
    Step 1 is right. The product rule gives $\sqrt{16 \cdot 3} = \sqrt{16}\cdot\sqrt3 = 4\sqrt3$, a product, not a sum. So step 2 is where it goes wrong; the answer is $4\sqrt3 \approx 6.93$, not $4 + \sqrt3 \approx 5.73$.
- id: a1-q-2701
  lesson: a1-exponential
  module_quiz: true
  topic: Exponential functions
  stem: 'A town of 1,500 people grows 4% per year. Which function gives its population after $t$ years?'
  choices: ['$P = 1500(0.04)^t$', '$P = 1500 + 0.04t$', '$P = 1500(1.4)^t$', '$P = 1500(1.04)^t$']
  answer: 3
  explanation: |-
    A 4% growth rate means each year is multiplied by $1 + 0.04 = 1.04$.
    $0.04^t$ would shrink the town almost to nothing, and $1.4$ is 40% growth.
- id: a1-q-2702
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'What does $y = 250(0.88)^t$ describe?'
  choices: ['Decay of 12% per time step', 'Decay of 88% per time step', 'Growth of 12% per time step', 'Growth of 88% per time step']
  answer: 0
  explanation: |-
    The factor $0.88 = 1 - 0.12$ is less than 1, so 88% is kept and 12% is lost each step: 12% decay. The starting amount is 250.
- id: a1-q-2703
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'For $f(x) = 5 \cdot 3^x$, find $f(-2)$.'
  choices: ['$-\tfrac59$', '$\tfrac59$', '$-30$', '$\tfrac{1}{225}$']
  answer: 1
  explanation: |-
    $3^{-2} = \tfrac{1}{9}$, so $f(-2) = 5 \cdot \tfrac19 = \tfrac59$.
    $\tfrac{1}{225}$ comes from computing $(5 \cdot 3)^{-2}$, applying the exponent to the 5 as well. Negative exponents make reciprocals, not negative numbers.
- id: a1-q-2704
  lesson: a1-exponential
  module_quiz: true
  topic: Exponential functions
  stem: 'A car bought for \$20,000 loses 10% of its value each year. What is it worth after 3 years?'
  choices: ['$26,620', '$18,000', '$14,580', '$14,000']
  answer: 2
  explanation: |-
    $V = 20000(0.9)^3 = 20000(0.729) = 14{,}580$ dollars.
    $14,000 subtracts \$2,000 every year (a linear model), and \$26,620 uses 1.1 (growth).
- id: a1-q-2705
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'Which function fits the table? $x$: 0, 1, 2, 3; $y$: 2, 6, 18, 54.'
  choices: ['$y = 3 \cdot 2^x$', '$y = 4x + 2$', '$y = 6^x$', '$y = 2 \cdot 3^x$']
  answer: 3
  explanation: |-
    Ratios: $\tfrac62 = \tfrac{18}{6} = \tfrac{54}{18} = 3$, so $b = 3$; the value at $x = 0$ is $a = 2$. So $y = 2 \cdot 3^x$.
    $y = 4x + 2$ matches only the first two points; $6^x$ gives 1 at $x = 0$.
- id: a1-q-2706
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'An exponential function has $f(0) = 4$ and $f(2) = 100$. Which is it?'
  choices: ['$f(x) = 4 \cdot 5^x$', '$f(x) = 4 \cdot 25^x$', '$f(x) = 48x + 4$', '$f(x) = 100 \cdot 5^x$']
  answer: 0
  explanation: |-
    $a = f(0) = 4$. Two steps multiply by $b$ twice: $4b^2 = 100$, so $b^2 = 25$ and $b = 5$.
    $4 \cdot 25^x$ treats the two-step factor 25 as a one-step factor; $48x + 4$ is the linear function through the points.
- id: a1-q-2707
  lesson: a1-exponential
  module_quiz: true
  topic: Exponential functions
  stem: 'What is the range of $y = 3(0.5)^x$?'
  choices: ['$0 < y \le 3$', '$y > 0$', 'All real numbers', '$y \ge 3$']
  answer: 1
  explanation: |-
    Every output is 3 times a positive power of 0.5, so it is positive. Large negative $x$ give huge outputs ($x = -10$ gives 3072) and large positive $x$ give outputs near 0, so every positive value occurs: the range is $y > 0$. The domain, not the range, is all real numbers.
- id: a1-q-2708
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'Which describes the graph of $y = 4(1.5)^x$?'
  choices: ['It passes through $(0, 4)$ and falls, approaching the $x$-axis on the right', 'It passes through $(0, 6)$ and rises, crossing the $x$-axis on the left', 'It passes through $(0, 4)$ and rises, approaching the $x$-axis on the left', 'It passes through $(0, 1.5)$ and rises, approaching the $x$-axis on the left']
  answer: 2
  explanation: |-
    At $x = 0$, $y = 4 \cdot 1.5^0 = 4$. Since $b = 1.5 > 1$, it is growth: rising to the right, and approaching (never crossing) the asymptote $y = 0$ on the left.
- id: a1-q-2709
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'Which function is NOT exponential?'
  choices: ['$y = 7(1.02)^x$', '$y = 0.5(3)^x$', '$y = 100(0.6)^x$', '$y = 4x^3$']
  answer: 3
  explanation: |-
    In $4x^3$ the variable is the base and the exponent is fixed; that is a polynomial (a cubic). In an exponential function the variable is in the exponent.
- id: a1-q-2710
  lesson: a1-exponential
  topic: Exponential functions
  stem: '\$2,000 is invested at 5% interest compounded once a year. How much is in the account after 2 years?'
  choices: ['$2,205', '$2,200', '$2,100', '$2,010']
  answer: 0
  explanation: |-
    $A = 2000(1.05)^2 = 2000(1.1025) = 2205$ dollars.
    \$2,200 is simple interest (\$100 a year on the original \$2,000); compounding earns interest on the first year's interest too.
- id: a1-q-2711
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'A culture of 300 bacteria doubles every hour. How many are there after 5 hours?'
  choices: ['4,800', '9,600', '3,000', '1,500']
  answer: 1
  explanation: |-
    $N = 300 \cdot 2^5 = 300 \cdot 32 = 9600$.
    3,000 is $300 \cdot 2 \cdot 5$ (multiplying by 2 and 5 instead of doubling five times); 4,800 is only four doublings.
- id: a1-q-2712
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'A town of 8,000 loses 6% of its population each year. A student writes $P = 8000(0.06)^t$. What is wrong?'
  choices: ['The model should be linear: $P = 8000 - 0.06t$', 'The 8,000 should be in the exponent', 'The factor should be 0.94, the fraction kept each year', 'The factor should be 1.06']
  answer: 2
  explanation: |-
    Losing 6% means keeping $1 - 0.06 = 0.94$ each year: $P = 8000(0.94)^t$. With 0.06 the model says 94% of the town vanishes every year. 1.06 would be 6% growth.
- id: a1-q-2801
  lesson: a1-lin-vs-exp
  module_quiz: true
  topic: Linear vs exponential
  stem: 'A table has $x$: 0, 1, 2, 3 and $y$: 5, 10, 20, 40. Which model fits?'
  choices: ['Linear: the outputs always increase', 'Linear: the differences are all 5', 'Neither linear nor exponential', 'Exponential: each output is 2 times the one before']
  answer: 3
  explanation: |-
    Differences are 5, 10, 20, not constant. Ratios are $\tfrac{10}{5} = \tfrac{20}{10} = \tfrac{40}{20} = 2$, constant, so the data are exponential: $y = 5 \cdot 2^x$. Increasing outputs alone don't make data linear.
- id: a1-q-2802
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A table has $x$: 1, 2, 3, 4 and $y$: 3, 8, 13, 18. Which describes it?'
  choices: ['Linear with slope 5', 'Exponential with factor 5', 'Exponential with factor about 2.7', 'Neither linear nor exponential']
  answer: 0
  explanation: |-
    Each step adds 5 (differences 5, 5, 5), so it is linear with slope 5: $y = 5x - 2$. The ratios $\tfrac83, \tfrac{13}{8}, \tfrac{18}{13}$ are not constant.
- id: a1-q-2803
  lesson: a1-lin-vs-exp
  module_quiz: true
  topic: Linear vs exponential
  stem: 'Which situation is best modeled by an exponential function?'
  choices: ['A taxi charges \$3 plus \$2 per mile', 'A savings account earns 2% interest per year, compounded yearly', 'A plant grows 2 cm per week', 'A tank drains 15 gallons per minute']
  answer: 1
  explanation: |-
    Interest adds 2% of the current balance each year, a fixed percent, so the balance is multiplied by 1.02 each year. The others add or subtract a fixed amount each step, which is linear.
- id: a1-q-2804
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'Let $L(x) = 50 + 10x$ and $E(x) = 2^x$. What is the first whole number $x$ at which $E(x) > L(x)$?'
  choices: ['$x = 10$', '$E$ never exceeds $L$', '$x = 7$', '$x = 6$']
  answer: 2
  explanation: |-
    $x = 6$: $E = 64$, $L = 110$. $x = 7$: $E = 128$, $L = 120$. So $x = 7$ is the first, and $E$ stays ahead after that because it doubles each step while $L$ adds only 10.
- id: a1-q-2805
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A linear model and an exponential model both pass through $(0, 50)$ and $(1, 60)$. What do they predict at $x = 3$?'
  choices: ['Both predict 80', 'Linear 90, exponential 86.4', 'Linear 80, exponential 72', 'Linear 80, exponential 86.4']
  answer: 3
  explanation: |-
    Linear: slope 10, so $L(3) = 50 + 30 = 80$. Exponential: factor $\tfrac{60}{50} = 1.2$, so $E(3) = 50(1.2)^3 = 50(1.728) = 86.4$.
- id: a1-q-2806
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'Over equal-length intervals of $x$, how does an exponential function $y = a \cdot b^x$ change?'
  choices: ['By equal factors (constant ratio)', 'By equal differences', 'By differences equal to $b$', 'By factors that grow each interval']
  answer: 0
  explanation: |-
    $\tfrac{a b^{x+1}}{a b^x} = b$ for every $x$, so each unit step multiplies by the same factor. Equal differences describe linear functions.
- id: a1-q-2807
  lesson: a1-lin-vs-exp
  module_quiz: true
  topic: Linear vs exponential
  stem: 'For very large $x$, which function has the largest value?'
  choices: ['$y = x + 1{,}000{,}000$', '$y = 1.01^x$', '$y = 1000x$', '$y = 50x^2$']
  answer: 1
  explanation: |-
    An increasing exponential eventually exceeds every linear and quadratic function, even one with a slow-looking base like 1.01 and a huge head start for the others. (It takes a while: $1.01^x$ passes $50x^2$ only beyond $x \approx 1{,}900$.)
- id: a1-q-2808
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A table has $x$: 0, 2, 4, 6 and $y$: 3, 12, 48, 192. Which function fits?'
  choices: ['$y = 4.5x + 3$', '$y = 3 \cdot 16^x$', '$y = 3 \cdot 2^x$', '$y = 3 \cdot 4^x$']
  answer: 2
  explanation: |-
    The inputs go up by 2, and each 2-step multiplies by 4. Per 1-step the factor is $b$ with $b^2 = 4$, so $b = 2$: $y = 3 \cdot 2^x$. Check: $x = 6$ gives $3 \cdot 64 = 192$. $3 \cdot 4^x$ ignores the step size.
- id: a1-q-2809
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'Which model eventually predicts negative values?'
  choices: ['$V = 900(0.94)^t$', '$V = 900(0.5)^t$', '$V = 900(1.06)^t$', '$V = 900 - 60t$']
  answer: 3
  explanation: |-
    A decreasing linear model subtracts 60 forever: at $t = 15$ it is 0 and after that negative. Exponential decay multiplies by a positive factor and stays positive.
- id: a1-q-2810
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'What is the average rate of change of $E(x) = 100(1.5)^x$ from $x = 0$ to $x = 2$?'
  choices: ['62.5', '50', '125', '1.5']
  answer: 0
  explanation: |-
    $E(0) = 100$ and $E(2) = 100(2.25) = 225$. Average rate $= \dfrac{225 - 100}{2 - 0} = 62.5$ per unit. (125 is the total change, not divided by 2. Over $x = 0$ to 1 the rate is only 50: exponential rates keep growing.)
- id: a1-q-2811
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A town''s population decreases by 300 people each year. Which kind of model fits?'
  choices: ['Exponential growth', 'Linear, decreasing', 'Exponential decay', 'Linear, increasing']
  answer: 1
  explanation: |-
    A fixed amount (300 people) per year is a constant difference: linear with slope $-300$. A fixed percent per year would be exponential decay.
- id: a1-q-2812
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A table has $x$: 0, 1, 2, 3 and $y$: 1, 2, 4, 7. Which is true?'
  choices: ['Linear with slope 2', 'Linear with slope 1', 'Neither model fits: the differences and the ratios both change', 'Exponential with factor 2']
  answer: 2
  explanation: |-
    Differences 1, 2, 3 are not constant, and ratios 2, 2, 1.75 are not constant either. The first two ratios match, which is why it's tempting to say "exponential", but every ratio must be equal.
- id: a1-q-2901
  lesson: a1-sequences
  module_quiz: true
  topic: Sequences
  stem: 'Which explicit formula gives the sequence $5, 9, 13, 17, \dots$?'
  choices: ['$a_n = 4n + 5$', '$a_n = 5n + 4$', '$a_n = 5 \cdot 4^{\,n-1}$', '$a_n = 4n + 1$']
  answer: 3
  explanation: |-
    $a_1 = 5$, $d = 4$: $a_n = 5 + (n - 1)4 = 4n + 1$. Check: $a_1 = 5$, $a_2 = 9$. $4n + 5$ comes from using $a_1 + nd$, which gives 9 for the first term.
- id: a1-q-2902
  lesson: a1-sequences
  topic: Sequences
  stem: 'What is the 30th term of $2, 7, 12, 17, \dots$?'
  choices: ['147', '152', '150', '145']
  answer: 0
  explanation: |-
    $a_{30} = 2 + (30 - 1)5 = 2 + 145 = 147$. 152 uses 30 steps instead of 29; the 30th term is only 29 steps past the first.
- id: a1-q-2903
  lesson: a1-sequences
  module_quiz: true
  topic: Sequences
  stem: 'What is the 8th term of $2, 6, 18, 54, \dots$?'
  choices: ['44', '4,374', '13,122', '1,458']
  answer: 1
  explanation: |-
    Geometric with $r = 3$: $a_8 = 2 \cdot 3^{7} = 2 \cdot 2187 = 4374$. 13,122 uses $3^8$, and 1,458 uses $3^6$.
- id: a1-q-2904
  lesson: a1-sequences
  topic: Sequences
  stem: 'A sequence is defined by $a_1 = 3$ and $a_n = a_{n-1} - 5$. What are its first four terms?'
  choices: ['$3, 8, 13, 18$', '$3, -15, 75, -375$', '$3, -2, -7, -12$', '$-2, -7, -12, -17$']
  answer: 2
  explanation: |-
    Start at 3 and subtract 5 each time: $3, -2, -7, -12$. $-2, -7, -12, -17$ skips the given first term; $3, -15, 75$ multiplies by $-5$ instead of subtracting.
- id: a1-q-2905
  lesson: a1-sequences
  topic: Sequences
  stem: 'In an arithmetic sequence, $a_3 = 20$ and $a_8 = 45$. What is $a_1$?'
  choices: ['15', '5', '20', '10']
  answer: 3
  explanation: |-
    From term 3 to term 8 is 5 steps and the value rises 25, so $d = 5$. Back up 2 steps from $a_3$: $a_1 = 20 - 2(5) = 10$. 15 backs up only one step (that's $a_2$); 5 is $d$.
- id: a1-q-2906
  lesson: a1-sequences
  topic: Sequences
  stem: 'Which sequence is geometric?'
  choices: ['$48, 24, 12, 6, \dots$', '$1, 4, 9, 16, \dots$', '$2, 4, 6, 8, \dots$', '$1, 1, 2, 3, \dots$']
  answer: 0
  explanation: |-
    Each term of $48, 24, 12, 6$ is $\tfrac12$ of the previous one: common ratio $\tfrac12$. $2, 4, 6, 8$ is arithmetic; the squares and the Fibonacci numbers are neither.
- id: a1-q-2907
  lesson: a1-sequences
  topic: Sequences
  stem: 'What is the common ratio of $81, -27, 9, -3, \dots$?'
  choices: ['$-108$', '$-\tfrac13$', '$\tfrac13$', '$-3$']
  answer: 1
  explanation: |-
    $r = \tfrac{-27}{81} = -\tfrac13$; check $\tfrac{9}{-27} = -\tfrac13$. The negative ratio makes the signs alternate. $-108$ is the difference, not the ratio; $-3$ is upside down.
- id: a1-q-2908
  lesson: a1-sequences
  module_quiz: true
  topic: Sequences
  stem: 'An arithmetic sequence with common difference $-2$ is the same as'
  choices: ['a linear function with $y$-intercept $-2$', 'an exponential decay function with factor 0.98', 'a linear function with slope $-2$, evaluated at $n = 1, 2, 3, \dots$', 'an exponential function with base $-2$']
  answer: 2
  explanation: |-
    $a_n = a_1 + (n - 1)(-2) = -2n + (a_1 + 2)$: linear in $n$ with slope $-2$, but only defined at whole-number positions, so its graph is a row of points on that line.
- id: a1-q-2909
  lesson: a1-sequences
  topic: Sequences
  stem: 'Which recursive formula describes $a_n = 6(0.5)^{n-1}$?'
  choices: ['$a_1 = 0.5$, $a_n = 6\,a_{n-1}$', '$a_1 = 6$, $a_n = a_{n-1} - 0.5$', '$a_1 = 3$, $a_n = 0.5\,a_{n-1}$', '$a_1 = 6$, $a_n = 0.5\,a_{n-1}$']
  answer: 3
  explanation: |-
    At $n = 1$ the explicit formula gives $6(0.5)^0 = 6$, and each term is 0.5 times the one before. $a_1 = 3$ is the second term; subtracting 0.5 would make it arithmetic.
- id: a1-q-2910
  lesson: a1-sequences
  topic: Sequences
  stem: 'Which term of $4, 7, 10, 13, \dots$ equals 100?'
  choices: ['The 33rd', 'The 32nd', 'The 34th', 'The 25th']
  answer: 0
  explanation: |-
    $a_n = 4 + (n - 1)3 = 3n + 1$. Solve $3n + 1 = 100$: $n = 33$. (32 is the number of steps from the first term, not the position.)
- id: a1-q-2911
  lesson: a1-sequences
  topic: Sequences
  stem: 'A theater''s first row has 22 seats and each row has 3 more than the row in front of it. How many seats are in row 15?'
  choices: ['37', '64', '67', '45']
  answer: 1
  explanation: |-
    Arithmetic: $a_{15} = 22 + (15 - 1)3 = 22 + 42 = 64$. 67 uses 15 steps instead of 14; 45 is $15 \cdot 3$ alone.
- id: a1-q-2912
  lesson: a1-sequences
  topic: Sequences
  stem: 'A ball''s first bounce reaches 8 ft, and each bounce reaches 75% of the previous height. How high is the 3rd bounce?'
  choices: ['6 ft', '2 ft', '4.5 ft', '3.375 ft']
  answer: 2
  explanation: |-
    Geometric: $a_n = 8(0.75)^{n-1}$, so $a_3 = 8(0.75)^2 = 8(0.5625) = 4.5$ ft. 6 ft is the 2nd bounce and 3.375 ft is the 4th.
- id: a1-q-2913
  lesson: a1-sequences
  topic: Sequences
  stem: 'A student says the 10th term of $3, 6, 12, 24, \dots$ is $3 \cdot 2^{10} = 3072$. What is the correct 10th term?'
  choices: ['3,072', '6,144', '30', '1,536']
  answer: 3
  explanation: |-
    $a_{10} = 3 \cdot 2^{10 - 1} = 3 \cdot 512 = 1536$. The exponent is $n - 1$ because the first term has had no doublings yet.
