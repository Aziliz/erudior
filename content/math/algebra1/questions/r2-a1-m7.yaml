# Round 2 questions for a1-m7 (Square roots, exponential functions, and sequences)
# ---- Core lesson 28: square roots
- id: a1-m7-r2-q01
  lesson: a1-square-roots
  type: label
  module_quiz: true
  topic: Square roots
  stem: 'The picture shows the expression $5\sqrt{12}$. Name the numbered parts.'
  image: {src: images/a1-m7-radical-parts-blank.svg, alt: 'The expression 5√12 written large: a 5, then a radical sign, then 12 under the radical sign. Three parts are numbered.'}
  labels:
    - {x: 23.1, y: 50.6, text: Coefficient}
    - {x: 43.1, y: 36.5, text: Radical sign}
    - {x: 61.5, y: 50.6, text: Radicand}
  distractors: [Index, Exponent]
  explanation: |-
    The 5 in front is the coefficient: it multiplies the root, so $5\sqrt{12}$ means $5 \times \sqrt{12}$. The symbol $\sqrt{\phantom{x}}$ is the radical sign, and the number under it, 12, is the radicand. (Simplified, $5\sqrt{12} = 5 \cdot 2\sqrt3 = 10\sqrt3$.)
- id: a1-m7-r2-q02
  lesson: a1-square-roots
  type: text
  topic: Square roots
  stem: 'Write $\sqrt{98}$ in simplest radical form $a\sqrt{b}$. The outside number $a$ is ___ and the radicand $b$ is ___.'
  accept:
    - ['7']
    - ['2']
  explanation: |-
    The largest perfect square dividing 98 is 49: $98 = 49 \cdot 2$, so $\sqrt{98} = \sqrt{49}\,\sqrt2 = 7\sqrt2$. The radicand 2 has no perfect-square factor left.
- id: a1-m7-r2-q03
  lesson: a1-square-roots
  type: order
  topic: Square roots
  stem: 'Put the steps for simplifying $\sqrt{180}$ in order.'
  items:
    - 'Find the largest perfect square that divides 180: it is 36'
    - 'Write $180 = 36 \cdot 5$'
    - 'Split with the product rule: $\sqrt{36}\,\sqrt5$'
    - 'Take the root of the perfect square: $6\sqrt5$'
  explanation: |-
    You need the perfect square before you can write the factorization, the factorization before you can split the root, and the split before you can take $\sqrt{36} = 6$. The result $6\sqrt5$ is in simplest form because 5 has no square factor.
- id: a1-m7-r2-q04
  lesson: a1-square-roots
  module_quiz: true
  topic: Square roots
  stem: 'Which of these numbers are rational? Select all that apply.'
  choices:
    - '$\sqrt{0.36}$'
    - '$\sqrt{18}$'
    - '$\sqrt2 \cdot \sqrt{32}$'
    - '$4 + \sqrt9$'
    - '$\sqrt{12} - \sqrt3$'
  answer: [0, 2, 3]
  explanation: |-
    $\sqrt{0.36} = 0.6$, $\sqrt2 \cdot \sqrt{32} = \sqrt{64} = 8$ and $4 + \sqrt9 = 4 + 3 = 7$ are rational.
    $\sqrt{18} = 3\sqrt2$ is irrational, and $\sqrt{12} - \sqrt3 = 2\sqrt3 - \sqrt3 = \sqrt3$ is irrational too.
- id: a1-m7-r2-q05
  lesson: a1-square-roots
  type: match
  topic: Square roots
  stem: 'Match each expression to its simplest radical form.'
  pairs:
    - ['$\sqrt{50}$', 5√2]
    - ['$2\sqrt{12}$', 4√3]
    - ['$\sqrt6 \cdot \sqrt{10}$', 2√15]
    - ['$\sqrt{75} - \sqrt{27}$', 2√3]
  distractors: [25√2, 3√5]
  explanation: |-
    $\sqrt{50} = \sqrt{25 \cdot 2} = 5\sqrt2$. $2\sqrt{12} = 2 \cdot 2\sqrt3 = 4\sqrt3$. $\sqrt6 \cdot \sqrt{10} = \sqrt{60} = \sqrt{4 \cdot 15} = 2\sqrt{15}$. $\sqrt{75} - \sqrt{27} = 5\sqrt3 - 3\sqrt3 = 2\sqrt3$.
    $25\sqrt2$ forgets to take the square root of 25.
# ---- Core lesson 29: root functions
- id: a1-m7-r2-q06
  lesson: a1-root-functions
  type: label
  module_quiz: true
  topic: Root functions
  stem: 'The picture shows four root graphs on the same axes. Name each numbered graph.'
  image: {src: images/a1-m7-root-graphs-blank.svg, alt: 'Four curves through the origin. Curve 1 rises to the right; curve 2 falls to the right; curve 3 rises to the left; curve 4 passes through the origin from the lower left to the upper right, below curve 1 on the right.'}
  labels:
    - {x: 90.2, y: 20.0, text: y = √x}
    - {x: 90.2, y: 80.0, text: y = −√x}
    - {x: 9.8, y: 20.0, text: y = √(−x)}
    - {x: 14.3, y: 70.0, text: y = ∛x}
  distractors: [y = −∛x, y = x²]
  explanation: |-
    $y = \sqrt x$ exists only for $x \ge 0$ and rises (1). The minus sign outside, $-\sqrt x$, flips it across the $x$-axis so it falls (2). The minus sign inside, $\sqrt{-x}$, needs $x \le 0$ and flips it across the $y$-axis (3). The cube root is defined on both sides, negative on the left and positive on the right (4). $y = -\sqrt[3]{x}$ would fall from upper left to lower right.
- id: a1-m7-r2-q07
  lesson: a1-root-functions
  type: text
  topic: Root functions
  stem: 'The graph of $y = 3\sqrt{x - 4} + 1$ starts at the point $(h, k)$. Give the coordinates: $h =$ ___ and $k =$ ___.'
  accept:
    - ['4']
    - ['1']
  explanation: |-
    The radicand $x - 4$ is 0 at $x = 4$, where $y = 3 \cdot 0 + 1 = 1$. So the graph starts at $(4, 1)$; its domain is $x \ge 4$ and, since $a = 3 > 0$, its range is $y \ge 1$.
- id: a1-m7-r2-q08
  lesson: a1-root-functions
  topic: Root functions
  stem: 'Which functions have a domain of all real numbers? Select all that apply.'
  choices:
    - '$y = \sqrt[3]{x + 5}$'
    - '$y = \sqrt{x} + 5$'
    - '$y = -2\sqrt[3]{x} - 1$'
    - '$y = \sqrt{5 - x}$'
  answer: [0, 2]
  explanation: |-
    Every real number has a cube root, so both cube root functions accept any input. $y = \sqrt x + 5$ needs $x \ge 0$, and $y = \sqrt{5 - x}$ needs $5 - x \ge 0$, that is $x \le 5$.
- id: a1-m7-r2-q09
  lesson: a1-root-functions
  type: match
  module_quiz: true
  topic: Root functions
  stem: 'Match each equation to the key point of its graph.'
  pairs:
    - ['$y = \sqrt{x + 2} - 3$', 'Starts at (−2, −3)']
    - ['$y = \sqrt{x - 2} + 3$', 'Starts at (2, 3)']
    - ['$y = \sqrt[3]{x + 3} + 2$', 'Centered at (−3, 2)']
    - ['$y = -\sqrt{x - 3} - 2$', 'Starts at (3, −2)']
  distractors: ['Starts at (2, −3)', 'Centered at (3, 2)']
  explanation: |-
    In $y = a\sqrt{x - h} + k$ the starting point is $(h, k)$, and $x + 2$ means $h = -2$. So $\sqrt{x + 2} - 3$ starts at $(-2, -3)$ and $\sqrt{x - 2} + 3$ at $(2, 3)$. The cube root $\sqrt[3]{x + 3} + 2$ is centered at $(-3, 2)$. The minus sign in front of $-\sqrt{x - 3} - 2$ flips the graph downward but doesn't move its starting point $(3, -2)$.
- id: a1-m7-r2-q10
  lesson: a1-root-functions
  type: order
  topic: Root functions
  stem: 'Put these numbers in order from smallest to largest.'
  items: ['$\sqrt[3]{-27}$', '$-\sqrt4$', '$\sqrt{0.25}$', '$\sqrt[3]{8}$', '$\sqrt{10}$']
  explanation: |-
    $\sqrt[3]{-27} = -3$ (cube roots of negatives are negative), $-\sqrt4 = -2$, $\sqrt{0.25} = 0.5$, $\sqrt[3]8 = 2$ and $\sqrt{10} \approx 3.16$, which lies between 3 and 4 because $9 < 10 < 16$.
# ---- Core lesson 30: exponential functions
- id: a1-m7-r2-q11
  lesson: a1-exponential
  type: label
  module_quiz: true
  topic: Exponential functions
  stem: 'The picture shows $y = 2(1.6)^x$ and $y = 2(0.6)^x$. Name the numbered features.'
  image: {src: images/a1-m7-exp-graph-blank.svg, alt: 'Two curves crossing the y-axis at the same point. A solid curve hugs the x-axis on the left and climbs steeply on the right; a dashed curve is high on the left and hugs the x-axis on the right. Point 1 is where they cross the y-axis, point 2 is on the solid curve, point 3 is on the dashed curve and point 4 is on the x-axis at the far left.'}
  labels:
    - {x: 50.0, y: 72.7, text: Initial value (y-intercept)}
    - {x: 79.3, y: 13.0, text: Growth curve}
    - {x: 27.6, y: 30.7, text: Decay curve}
    - {x: 10.3, y: 87.9, text: Horizontal asymptote}
  distractors: [x-intercept, Vertex]
  explanation: |-
    Both functions have $a = 2$, so both pass through $(0, 2)$, the initial value (1). The factor 1.6 is greater than 1, so the curve that climbs to the right is growth (2); the factor 0.6 is between 0 and 1, so the curve that falls to the right is decay (3). Both approach the $x$-axis, $y = 0$, without touching it: the horizontal asymptote (4). There is no $x$-intercept, because the outputs are always positive.
- id: a1-m7-r2-q12
  lesson: a1-exponential
  type: text
  topic: Exponential functions
  stem: 'A quantity decreases by 35% per year. Its yearly decay factor is $b =$ ___.'
  accept: ['0.65', '13/20']
  explanation: |-
    Each year 35% is lost and 65% is kept, so $b = 1 - 0.35 = 0.65$. The factor is the part kept, not the rate lost (0.35).
- id: a1-m7-r2-q13
  lesson: a1-exponential
  topic: Exponential functions
  stem: 'Which functions describe exponential decay? Select all that apply.'
  choices:
    - '$y = 40(0.9)^x$'
    - '$y = 3(1.02)^x$'
    - '$y = 100\left(\tfrac12\right)^x$'
    - '$y = 0.5(4)^x$'
    - '$y = 7(0.99)^x$'
  answer: [0, 2, 4]
  explanation: |-
    With $a > 0$, decay means the factor $b$ is between 0 and 1: 0.9, $\tfrac12$ and 0.99. The factors 1.02 and 4 are greater than 1, so those are growth. In $0.5(4)^x$ the 0.5 is the initial value, not the factor.
- id: a1-m7-r2-q14
  lesson: a1-exponential
  type: match
  module_quiz: true
  topic: Exponential functions
  stem: 'Match each description to its growth or decay factor $b$.'
  pairs:
    - [Grows 4% per year, '1.04']
    - [Shrinks 4% per year, '0.96']
    - [Grows 40% per year, '1.4']
    - [Shrinks 40% per year, '0.6']
  distractors: ['0.04', '1.004']
  explanation: |-
    Growth at rate $r$ gives $b = 1 + r$: $1 + 0.04 = 1.04$ and $1 + 0.40 = 1.4$. Decay at rate $r$ gives $b = 1 - r$: $1 - 0.04 = 0.96$ and $1 - 0.40 = 0.6$. 0.04 is the rate itself, and 1.004 would be growth of 0.4%.
- id: a1-m7-r2-q15
  lesson: a1-exponential
  type: order
  topic: Exponential functions
  stem: 'Put these values in order from smallest to largest.'
  items: ['$2^{-3}$', '$3^0$', '$4(0.5)^1$', '$2(1.5)^2$', '$3 \cdot 2^2$']
  explanation: |-
    $2^{-3} = \tfrac18 = 0.125$; $3^0 = 1$; $4(0.5)^1 = 2$; $2(1.5)^2 = 2(2.25) = 4.5$; $3 \cdot 2^2 = 3 \cdot 4 = 12$. In each, the exponent applies to the base only, and then you multiply.
# ---- Core lesson 31: linear vs exponential
- id: a1-m7-r2-q16
  lesson: a1-lin-vs-exp
  type: match
  module_quiz: true
  topic: Linear vs exponential
  stem: 'Match each situation to the model that fits it.'
  pairs:
    - [A salary that increases by 50 dollars each month, Linear]
    - [An account that grows 3% each month, Exponential]
    - [A sample that loses half its mass every 5 days, Exponential]
    - [A school that loses 12 students each year, Linear]
  distractors: [Quadratic]
  explanation: |-
    A fixed amount added or subtracted each step (50 dollars, 12 students) is linear. A fixed percent or fraction of the current value (3%, half) is exponential.
- id: a1-m7-r2-q17
  lesson: a1-lin-vs-exp
  type: text
  topic: Linear vs exponential
  stem: 'A table has $x$: 0, 1, 2, 3 and $y$: 6, 9, 13.5, 20.25. The data are exponential with factor $b =$ ___.'
  accept: ['1.5', '3/2']
  explanation: |-
    The differences 3, 4.5, 6.75 are not constant, but the ratios are: $\tfrac96 = \tfrac{13.5}{9} = \tfrac{20.25}{13.5} = 1.5$. So $y = 6(1.5)^x$.
- id: a1-m7-r2-q18
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'Each list gives the $y$-values of a table at $x = 0, 1, 2, 3$. Which tables are exponential? Select all that apply.'
  choices:
    - '5, 10, 20, 40'
    - '5, 10, 15, 20'
    - '81, 27, 9, 3'
    - '2, 4, 8, 14'
    - '100, 110, 121, 133.1'
  answer: [0, 2, 4]
  explanation: |-
    Check the ratios. 5, 10, 20, 40 has ratio 2; 81, 27, 9, 3 has ratio $\tfrac13$; 100, 110, 121, 133.1 has ratio 1.1 (10% growth). 5, 10, 15, 20 has constant difference 5, so it is linear. 2, 4, 8, 14 has ratios 2, 2, 1.75 and differences 2, 4, 6, so it is neither.
- id: a1-m7-r2-q19
  lesson: a1-lin-vs-exp
  type: order
  topic: Linear vs exponential
  stem: 'Put the steps for classifying a table as linear, exponential or neither in order.'
  items:
    - 'Check that the $x$-values are equally spaced'
    - 'Compute the differences between consecutive $y$-values'
    - 'If the differences are not constant, compute the ratios of consecutive $y$-values'
    - 'If the ratios are constant, write $y = a \cdot b^x$ with $b$ equal to the ratio'
  explanation: |-
    The difference and ratio tests only work with equal input steps, so check that first. Constant differences mean linear; only if they fail do you go on to the ratios, and a constant ratio gives the factor $b$ of an exponential model.
- id: a1-m7-r2-q20
  lesson: a1-lin-vs-exp
  topic: Linear vs exponential
  stem: 'A town of 5,000 people shrinks 4% per year, which the model $E(t) = 5000(0.96)^t$ describes. A student instead uses $L(t) = 5000 - 200t$. Which statement is true?'
  choices:
    - 'The two models agree for every $t$, because both lose 200 people in the first year.'
    - 'They agree at $t = 1$, but $L$ reaches 0 at $t = 25$ while $E$ is still about 1,800.'
    - '$E$ reaches 0 at $t = 25$, and $L$ stays positive forever.'
    - 'For every $t > 1$, $L$ gives a larger population than $E$.'
  answer: 1
  explanation: |-
    At $t = 1$ both give 4,800. After that the exponential model loses 4% of a smaller population each year, so it loses fewer than 200 people a year and stays above the line: $L(25) = 5000 - 5000 = 0$, but $E(25) = 5000(0.96)^{25} \approx 1802$. Exponential decay never reaches 0, and the linear model is the smaller one for $t > 1$.
# ---- Core lesson 32: sequences
- id: a1-m7-r2-q21
  lesson: a1-sequences
  type: label
  module_quiz: true
  topic: Sequences
  stem: 'A ball is dropped from 10 feet and each bounce reaches 60% of the previous height. The bounce heights form a geometric sequence. Name the numbered heights.'
  image: {src: images/a1-m7-bouncing-ball-blank.svg, alt: 'A ball falls straight down from a height and then bounces along the ground in arcs that get smaller each time. A dashed line marks the drop height and dashed lines mark the tops of the first three bounces.'}
  labels:
    - {x: 10.0, y: 50.0, text: Drop height (not a term)}
    - {x: 25.0, y: 64.1, text: First term a₁}
    - {x: 51.7, y: 72.6, text: Second term a₂}
    - {x: 71.7, y: 77.7, text: Third term a₃}
  distractors: [Common ratio r, Fourth term a₄]
  explanation: |-
    The ball starts at 10 feet, but the sequence lists bounce heights, so its first term is the first bounce: $a_1 = 0.6 \times 10 = 6$ feet. Then $a_2 = 3.6$ and $a_3 = 2.16$ feet. The ratio $r = 0.6$ is the factor between heights, not a height.
- id: a1-m7-r2-q22
  lesson: a1-sequences
  type: text
  topic: Sequences
  stem: 'For the arithmetic sequence $12, 19, 26, 33, \dots$, the explicit formula is $a_n = 7n + {}$___, and $a_{20} =$ ___.'
  accept:
    - ['5']
    - ['145']
  explanation: |-
    $a_1 = 12$ and $d = 7$, so $a_n = 12 + (n - 1)7 = 7n + 5$. Then $a_{20} = 7(20) + 5 = 145$.
- id: a1-m7-r2-q23
  lesson: a1-sequences
  type: match
  module_quiz: true
  topic: Sequences
  stem: 'Match each sequence to its description.'
  pairs:
    - ['$3, 6, 12, 24, \dots$', Geometric with r = 2]
    - ['$3, 6, 9, 12, \dots$', Arithmetic with d = 3]
    - ['$48, 24, 12, 6, \dots$', Geometric with r = 1/2]
    - ['$12, 9, 6, 3, \dots$', Arithmetic with d = −3]
  distractors: [Geometric with r = 3, Neither arithmetic nor geometric]
  explanation: |-
    $3, 6, 12, 24$ doubles each time ($r = 2$); $3, 6, 9, 12$ adds 3 ($d = 3$); $48, 24, 12, 6$ halves ($r = \tfrac12$); $12, 9, 6, 3$ subtracts 3 ($d = -3$, later term minus earlier term).
- id: a1-m7-r2-q24
  lesson: a1-sequences
  topic: Sequences
  stem: 'Which formulas describe the sequence $5, 15, 45, 135, \dots$? Select all that apply.'
  choices:
    - '$a_n = 5 \cdot 3^{n-1}$'
    - '$a_1 = 5$, $a_n = 3a_{n-1}$'
    - '$a_n = 15^{n-1}$'
    - '$a_n = \tfrac53 \cdot 3^n$'
    - '$a_n = a_{n-1} + 10$'
  answer: [0, 1, 3]
  explanation: |-
    The ratio is 3 and $a_1 = 5$, so $a_n = 5 \cdot 3^{n-1}$, which also equals $\tfrac53 \cdot 3^n$ (check $n = 1$: $\tfrac53 \cdot 3 = 5$). The recursive form multiplies by 3 from a start of 5.
    $15^{n-1}$ multiplies $a_1 r$ before applying the exponent (it gives 1 at $n = 1$), and adding 10 works only for the first step.
- id: a1-m7-r2-q25
  lesson: a1-sequences
  type: order
  topic: Sequences
  stem: 'In an arithmetic sequence, $a_4 = 17$ and $a_{10} = 41$. Put the steps for finding the explicit formula in order.'
  items:
    - 'Count the steps and the change: 6 steps, a rise of 24'
    - 'Divide: $d = 24 \div 6 = 4$'
    - 'Back up 3 steps from $a_4$: $a_1 = 17 - 3(4) = 5$'
    - 'Write $a_n = 5 + (n - 1)4 = 4n + 1$'
  explanation: |-
    The common difference is the change divided by the number of steps between the terms. With $d$ known you can step back from $a_4$ to $a_1$, and only then write the formula. Check: $4(10) + 1 = 41$.
# ---- Honors 32h1: proving irrationality and rationalizing denominators
- id: a1-m7-r2-h01
  lesson: a1-m7-h-irrational-roots
  topic: Irrationality proofs
  stem: 'In the proof that $\sqrt2$ is irrational, why must the fraction $\tfrac pq$ be in lowest terms?'
  choices:
    - 'Because the contradiction is that $p$ and $q$ both turn out to be even'
    - 'Because only fractions in lowest terms can be squared'
    - 'Because lowest terms guarantee that $p$ is even'
    - 'Because lowest terms force $q$ to equal 1'
  answer: 0
  explanation: |-
    Any rational number can be written in lowest terms, so the assumption costs nothing. The argument then shows $p$ and $q$ are both even, sharing the factor 2, which contradicts lowest terms. Without that assumption there would be nothing to contradict.
- id: a1-m7-r2-h02
  lesson: a1-m7-h-irrational-roots
  topic: Irrationality proofs
  stem: 'The proof goes from "$p^2 = 2q^2$" to "so $p$ is even." Which fact justifies that step?'
  choices:
    - 'If $n$ is even, then $n^2$ is even.'
    - 'Every even number is a perfect square.'
    - 'If $n^2$ is even, then $n$ is even.'
    - 'The square of an odd number is even.'
  answer: 2
  explanation: |-
    We know $p^2$ is even and want to conclude $p$ is even, so we need "if $n^2$ is even, then $n$ is even." It holds because odd numbers have odd squares: $(2k + 1)^2 = 2(2k^2 + 2k) + 1$. "If $n$ is even, then $n^2$ is even" is true but goes the wrong direction; the last choice is false.
- id: a1-m7-r2-h03
  lesson: a1-m7-h-irrational-roots
  type: order
  topic: Irrationality proofs
  stem: 'Put the steps of the proof that $\sqrt2$ is irrational in order.'
  items:
    - 'Assume $\sqrt2 = \tfrac pq$ in lowest terms'
    - 'Square both sides: $p^2 = 2q^2$'
    - 'Conclude $p$ is even and write $p = 2m$'
    - 'Substitute to get $q^2 = 2m^2$, so $q$ is even'
    - 'Note that $p$ and $q$ share the factor 2, a contradiction'
  explanation: |-
    Each step uses the one before it: squaring needs the assumed fraction, $p$ even needs $p^2 = 2q^2$, $q^2 = 2m^2$ needs $p = 2m$, and the contradiction needs both $p$ and $q$ to be even.
- id: a1-m7-r2-h04
  lesson: a1-m7-h-irrational-roots
  topic: Irrationality proofs
  stem: 'If you run the same argument on $\sqrt4$, where does it stop working?'
  choices:
    - 'At the start: $\sqrt4$ cannot be written as a fraction'
    - 'After $p = 2m$: you get $q^2 = m^2$, which does not force $q$ to be even'
    - 'At $p^2 = 4q^2$: this does not make $p^2$ even'
    - 'Squaring both sides is not allowed for $\sqrt4$'
  answer: 1
  explanation: |-
    From $p^2 = 4q^2$, $p$ is even, so $p = 2m$ and $4m^2 = 4q^2$, giving $q^2 = m^2$. The factor 4 cancels completely, leaving nothing that makes $q$ even, so there is no contradiction, as there shouldn't be: $\sqrt4 = \tfrac21$.
- id: a1-m7-r2-h05
  lesson: a1-m7-h-irrational-roots
  topic: Irrationality proofs
  stem: 'Which numbers are irrational? Select all that apply.'
  choices:
    - '$\sqrt{45}$'
    - '$\sqrt{\tfrac{9}{16}}$'
    - '$\dfrac{1}{\sqrt2 - 1}$'
    - '$(\sqrt3 + 1)(\sqrt3 - 1)$'
    - '$\sqrt2 \cdot \sqrt3$'
  answer: [0, 2, 4]
  explanation: |-
    $\sqrt{45} = 3\sqrt5$ is irrational. $\tfrac{1}{\sqrt2 - 1} = \tfrac{\sqrt2 + 1}{2 - 1} = \sqrt2 + 1$ is irrational. $\sqrt2 \cdot \sqrt3 = \sqrt6$, and 6 is not a perfect square.
    $\sqrt{9/16} = \tfrac34$ and $(\sqrt3 + 1)(\sqrt3 - 1) = 3 - 1 = 2$ are rational.
- id: a1-m7-r2-h06
  lesson: a1-m7-h-irrational-roots
  type: text
  topic: Rationalizing denominators
  stem: 'Rationalize the denominator: $\dfrac{10}{\sqrt5} = {}$___$\,\sqrt5$. Give only the number in front.'
  accept: ['2']
  explanation: |-
    $\dfrac{10}{\sqrt5} \cdot \dfrac{\sqrt5}{\sqrt5} = \dfrac{10\sqrt5}{5} = 2\sqrt5$.
- id: a1-m7-r2-h07
  lesson: a1-m7-h-irrational-roots
  topic: Rationalizing denominators
  stem: 'Rationalize $\dfrac{3}{\sqrt{12}}$ and simplify.'
  choices: ['$\dfrac{3\sqrt3}{2}$', '$\dfrac{\sqrt3}{4}$', '$\dfrac12$', '$\dfrac{\sqrt3}{2}$']
  answer: 3
  explanation: |-
    $\sqrt{12} = 2\sqrt3$, so $\dfrac{3}{2\sqrt3} \cdot \dfrac{\sqrt3}{\sqrt3} = \dfrac{3\sqrt3}{6} = \dfrac{\sqrt3}{2} \approx 0.866$. Check: $3 \div 3.464 \approx 0.866$.
    $\tfrac{3\sqrt3}{2}$ forgets the 3 from $\sqrt3 \cdot \sqrt3$ in the denominator.
- id: a1-m7-r2-h08
  lesson: a1-m7-h-irrational-roots
  topic: Rationalizing denominators
  stem: 'Rationalize $\dfrac{6}{2 + \sqrt3}$.'
  choices: ['$12 + 6\sqrt3$', '$\dfrac{12 - 6\sqrt3}{7}$', '$12 - 6\sqrt3$', '$3 - \sqrt3$']
  answer: 2
  explanation: |-
    Multiply top and bottom by the conjugate $2 - \sqrt3$. The denominator is $4 - 3 = 1$, so the result is $6(2 - \sqrt3) = 12 - 6\sqrt3 \approx 1.61$. Check: $6 \div 3.732 \approx 1.61$.
    The 7 comes from adding $4 + 3$ instead of subtracting; $12 + 6\sqrt3$ multiplies by $2 + \sqrt3$ only on top.
- id: a1-m7-r2-h09
  lesson: a1-m7-h-irrational-roots
  type: match
  topic: Rationalizing denominators
  stem: 'Match each product of conjugates to its value.'
  pairs:
    - ['$(5 + \sqrt2)(5 - \sqrt2)$', '23']
    - ['$(\sqrt7 - 2)(\sqrt7 + 2)$', '3']
    - ['$(3 + \sqrt{10})(3 - \sqrt{10})$', '−1']
    - ['$(\sqrt6 + \sqrt5)(\sqrt6 - \sqrt5)$', '1']
  distractors: ['27', '11']
  explanation: |-
    Each is a difference of squares, first squared minus second squared: $25 - 2 = 23$, $7 - 4 = 3$, $9 - 10 = -1$, $6 - 5 = 1$. 27 comes from adding $25 + 2$.
- id: a1-m7-r2-h10
  lesson: a1-m7-h-irrational-roots
  type: label
  topic: Irrationality proofs
  stem: 'The spiral of Theodorus is built from right triangles. The first has legs 1 and 1, and each new triangle uses the last hypotenuse as one leg and adds an outer leg. Name the numbered lengths.'
  image: {src: images/a1-m7-theodorus-blank.svg, alt: 'Seven right triangles sharing a corner, spiraling counterclockwise from a small triangle at the right. Three hypotenuses and one outer leg are numbered.'}
  labels:
    - {x: 75.7, y: 43.2, text: √2}
    - {x: 66.7, y: 31.1, text: √3}
    - {x: 42.5, y: 34.2, text: √5}
    - {x: 59.2, y: 13.9, text: '1'}
  distractors: [√6, '2']
  explanation: |-
    Every outer leg has length 1 (4). The first hypotenuse is $\sqrt{1^2 + 1^2} = \sqrt2$ (1); the next is $\sqrt{(\sqrt2)^2 + 1^2} = \sqrt3$ (2); then $\sqrt4 = 2$, and the fourth hypotenuse is $\sqrt5$ (3). Each step adds 1 under the root.
- id: a1-m7-r2-h11
  lesson: a1-m7-h-irrational-roots
  topic: Rationalizing denominators
  stem: 'Simplify $\dfrac{\sqrt{10} + \sqrt2}{\sqrt{10} - \sqrt2}$.'
  choices: ['$\dfrac{3 + \sqrt5}{2}$', '$3 + \sqrt5$', '$\dfrac{12 + \sqrt{20}}{8}$', '$\dfrac32$']
  answer: 0
  explanation: |-
    Multiply top and bottom by $\sqrt{10} + \sqrt2$. Denominator: $10 - 2 = 8$. Numerator: $(\sqrt{10} + \sqrt2)^2 = 10 + 2\sqrt{20} + 2 = 12 + 4\sqrt5$. So the value is $\dfrac{12 + 4\sqrt5}{8} = \dfrac{3 + \sqrt5}{2} \approx 2.618$.
    $\tfrac{12 + \sqrt{20}}{8}$ drops the 2 in the middle term, and $3 + \sqrt5$ divides by 4 instead of 8.
- id: a1-m7-r2-h12
  lesson: a1-m7-h-irrational-roots
  topic: Rationalizing denominators
  stem: 'Why doesn''t multiplying $\dfrac{4}{3 - \sqrt5}$ by $\dfrac{\sqrt5}{\sqrt5}$ rationalize it?'
  choices:
    - 'It changes the value of the fraction.'
    - 'The new denominator, $3\sqrt5 - 5$, still contains a root.'
    - 'The new numerator, $4\sqrt5$, is irrational, which is not allowed.'
    - 'You may only multiply a fraction by whole numbers.'
  answer: 1
  explanation: |-
    $\tfrac{\sqrt5}{\sqrt5} = 1$, so the value is unchanged, but $(3 - \sqrt5)\sqrt5 = 3\sqrt5 - 5$ still has a root. The conjugate $3 + \sqrt5$ works because $(3 - \sqrt5)(3 + \sqrt5) = 9 - 5 = 4$. A root in the numerator is fine.
- id: a1-m7-r2-h13
  lesson: a1-m7-h-irrational-roots
  type: text
  topic: Rationalizing denominators
  stem: 'Rationalize $\dfrac{2}{\sqrt3 - 1}$ and write the result as $a + \sqrt b$: $a =$ ___ and $b =$ ___.'
  accept:
    - ['1']
    - ['3']
  explanation: |-
    Multiply by the conjugate $\sqrt3 + 1$: $\dfrac{2(\sqrt3 + 1)}{3 - 1} = \sqrt3 + 1 = 1 + \sqrt3$. So $a = 1$ and $b = 3$.
- id: a1-m7-r2-h14
  lesson: a1-m7-h-irrational-roots
  topic: Irrationality proofs
  stem: 'A student "proves" that $\sqrt9$ is irrational: (1) Suppose $\sqrt9 = \tfrac pq$ in lowest terms. (2) Then $p^2 = 9q^2$, so $p^2$ is divisible by 3, so $p = 3m$. (3) Substituting, $9m^2 = 9q^2$, so $q^2 = m^2$. (4) So $q$ is divisible by 3, and $p$ and $q$ share the factor 3. Which step is wrong?'
  choices: ['Step 1', 'Step 2', 'Step 3', 'Step 4']
  answer: 3
  explanation: |-
    Steps 1–3 are correct. But $q^2 = m^2$ only says $q = m$; nothing makes $q$ divisible by 3. (In the $\sqrt3$ proof, the leftover factor in $q^2 = 3m^2$ is what does that.) Indeed $\sqrt9 = 3 = \tfrac31$ is rational.
# ---- Honors 32h2: nth roots and rational exponents
- id: a1-m7-r2-h15
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Evaluate $16^{3/4}$.'
  choices: ['$12$', '$4096$', '$8$', '$2$']
  answer: 2
  explanation: |-
    The denominator 4 is the root and the numerator 3 is the power: $(\sqrt[4]{16})^3 = 2^3 = 8$.
    12 multiplies $16 \cdot \tfrac34$; 4096 is $16^3$ without the root; 2 is the root without the power.
- id: a1-m7-r2-h16
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Evaluate $27^{-2/3}$.'
  choices: ['$\dfrac19$', '$-9$', '$-18$', '$9$']
  answer: 0
  explanation: |-
    A negative exponent means a reciprocal: $27^{-2/3} = \dfrac{1}{27^{2/3}} = \dfrac{1}{(\sqrt[3]{27})^2} = \dfrac{1}{9}$. It never makes the answer negative.
- id: a1-m7-r2-h17
  lesson: a1-m7-h-rational-exponents
  type: text
  topic: Rational exponents
  stem: 'Evaluate the fifth root: $\sqrt[5]{-32} =$ ___'
  accept: ['-2', '−2']
  explanation: |-
    $(-2)^5 = -32$, so $\sqrt[5]{-32} = -2$. Odd roots of negative numbers are real and negative.
- id: a1-m7-r2-h18
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'For $x > 0$, which expressions equal $\sqrt[3]{x^2}$? Select all that apply.'
  choices:
    - '$x^{2/3}$'
    - '$\left(\sqrt[3]{x}\right)^2$'
    - '$x^{3/2}$'
    - '$\dfrac{x^{5/3}}{x}$'
    - '$\left(x^2\right)^3$'
  answer: [0, 1, 3]
  explanation: |-
    $\sqrt[3]{x^2} = x^{2/3} = (\sqrt[3]{x})^2$. Also $\tfrac{x^{5/3}}{x} = x^{5/3 - 1} = x^{2/3}$.
    $x^{3/2}$ swaps the root and the power, and $(x^2)^3 = x^6$.
- id: a1-m7-r2-h19
  lesson: a1-m7-h-rational-exponents
  type: match
  topic: Rational exponents
  stem: 'Match each power to its value.'
  pairs:
    - ['$9^{1/2}$', '3']
    - ['$8^{2/3}$', '4']
    - ['$32^{-1/5}$', '1/2']
    - ['$64^{5/6}$', '32']
  distractors: ['6', '−2']
  explanation: |-
    $9^{1/2} = \sqrt9 = 3$. $8^{2/3} = (\sqrt[3]8)^2 = 4$. $32^{-1/5} = \tfrac{1}{\sqrt[5]{32}} = \tfrac12$. $64^{5/6} = (\sqrt[6]{64})^5 = 2^5 = 32$. 6 is $9 \cdot \tfrac23$, multiplying by the exponent instead of taking a root and a power, and $-2$ reads the negative exponent as a negative answer.
- id: a1-m7-r2-h20
  lesson: a1-m7-h-rational-exponents
  type: order
  topic: Rational exponents
  stem: 'Put these numbers in order from smallest to largest.'
  items: ['$16^{-1/2}$', '$8^{1/3}$', '$4^{3/2}$', '$27^{2/3}$', '$32^{4/5}$']
  explanation: |-
    $16^{-1/2} = \tfrac14$; $8^{1/3} = 2$; $4^{3/2} = (\sqrt4)^3 = 8$; $27^{2/3} = 3^2 = 9$; $32^{4/5} = 2^4 = 16$.
- id: a1-m7-r2-h21
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Simplify $x^{1/2} \cdot x^{1/3}$ for $x > 0$.'
  choices: ['$x^{1/6}$', '$x^{2/5}$', '$x^{3/2}$', '$x^{5/6}$']
  answer: 3
  explanation: |-
    Multiplying powers of the same base adds the exponents: $\tfrac12 + \tfrac13 = \tfrac36 + \tfrac26 = \tfrac56$.
    $x^{1/6}$ multiplies the exponents, and $x^{2/5}$ adds tops and bottoms separately.
- id: a1-m7-r2-h22
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Solve $x^{3/2} = 64$ for $x > 0$.'
  choices: ['$512$', '$16$', '$96$', '$4$']
  answer: 1
  explanation: |-
    Raise both sides to the reciprocal power $\tfrac23$: $x = 64^{2/3} = (\sqrt[3]{64})^2 = 4^2 = 16$. Check: $16^{3/2} = (\sqrt{16})^3 = 64$.
    512 is $64^{3/2}$ (the same power instead of the reciprocal), and 4 stops after the cube root.
- id: a1-m7-r2-h23
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'An investment grows 9% per year, with growth spread evenly through the year. What is its growth factor per month?'
  choices: ['$1 + \tfrac{0.09}{12} = 1.0075$', '$1.09^{12} \approx 2.81$', '$1.09^{1/12} \approx 1.00721$', '$0.09^{1/12} \approx 0.818$']
  answer: 2
  explanation: |-
    Twelve monthly factors must multiply to the yearly factor: $m^{12} = 1.09$, so $m = 1.09^{1/12} \approx 1.00721$, about 0.721% a month.
    Dividing 9% by 12 ignores compounding ($1.0075^{12} \approx 1.0938$, more than 9%), and $1.09^{12}$ is twelve years of growth.
- id: a1-m7-r2-h24
  lesson: a1-m7-h-rational-exponents
  type: text
  topic: Rational exponents
  stem: 'A tracer has a half-life of 6 hours. Starting with 80 mg, about ___ mg remain after 9 hours. Round to 1 decimal place.'
  accept: ['28.3']
  explanation: |-
    9 hours is $\tfrac96 = 1.5$ half-lives: $A = 80\left(\tfrac12\right)^{1.5} = 80 \cdot \tfrac12 \cdot \tfrac{1}{\sqrt2} \approx 28.28$, so about 28.3 mg. It sits between 40 mg (after 6 hours) and 20 mg (after 12 hours).
- id: a1-m7-r2-h25
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Kepler''s third law in the form $a = T^{2/3}$ gives a planet''s average distance from the Sun $a$ (in AU) from its period $T$ (in years). How far out is a planet with a period of 27 years?'
  choices: ['$9$ AU', '$18$ AU', '$3$ AU', 'about $140$ AU']
  answer: 0
  explanation: |-
    $a = 27^{2/3} = (\sqrt[3]{27})^2 = 3^2 = 9$ AU. Check: $9^{3/2} = (\sqrt9)^3 = 27$ years.
    18 is $27 \cdot \tfrac23$; 3 stops after the cube root; 140 uses $27^{3/2}$, the wrong direction.
- id: a1-m7-r2-h26
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Which statements are true for every $a > 0$? Select all that apply.'
  choices:
    - '$a^{1/2} \cdot a^{1/2} = a$'
    - '$(a + 9)^{1/2} = a^{1/2} + 3$'
    - '$a^{-1/2} = \dfrac{1}{\sqrt a}$'
    - '$a^{2/3} = \tfrac23 a$'
    - '$\left(a^{1/3}\right)^6 = a^2$'
  answer: [0, 2, 4]
  explanation: |-
    $a^{1/2} \cdot a^{1/2} = a^{1/2 + 1/2} = a$; $a^{-1/2} = \tfrac{1}{a^{1/2}}$; $(a^{1/3})^6 = a^{6/3} = a^2$.
    A power of a sum does not split: at $a = 16$, $\sqrt{25} = 5$ but $4 + 3 = 7$. And $a^{2/3}$ is a root and a power, not multiplication by $\tfrac23$ (at $a = 8$: 4, not $\tfrac{16}{3}$).
- id: a1-m7-r2-h27
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Why is $a^{1/2}$ defined to mean $\sqrt a$?'
  choices:
    - 'Because the exponent $\tfrac12$ means "divide $a$ by 2."'
    - 'Because calculators were built to work that way.'
    - 'Because $a^{1/2} = a^1 \div a^2$.'
    - 'So that the power rule still holds: $\left(a^{1/2}\right)^2 = a^1 = a$.'
  answer: 3
  explanation: |-
    If the rule $(a^m)^n = a^{mn}$ is to keep working, $(a^{1/2})^2$ must equal $a$, so $a^{1/2}$ has to be a number whose square is $a$. Choosing the nonnegative one gives $\sqrt a$. Zero and negative exponents were defined the same way, to keep the rules true.
- id: a1-m7-r2-h28
  lesson: a1-m7-h-rational-exponents
  topic: Rational exponents
  stem: 'Why does the lesson keep fractional exponents on positive bases?'
  choices:
    - 'Because $8^{1/3}$ and $8^{2/6}$ give different answers.'
    - 'Because $(-8)^{1/3} = -2$, but $\sqrt[6]{(-8)^2} = 2$, although $\tfrac13 = \tfrac26$.'
    - 'Because a negative number raised to any power is undefined.'
    - 'Because $(-2)^3$ is positive.'
  answer: 1
  explanation: |-
    With a negative base, two ways of reading equal exponents can disagree: $\tfrac13$ and $\tfrac26$ are the same number, but taking the cube root of $-8$ gives $-2$ while squaring first and taking the sixth root gives 2. With positive bases this never happens. ($8^{1/3} = 8^{2/6} = 2$, and $(-2)^3 = -8$.)
# ---- Honors 32h3: series
- id: a1-m7-r2-h29
  lesson: a1-m7-h-series
  topic: Series
  stem: 'Evaluate $\displaystyle\sum_{k=1}^{5} (2k + 1)$.'
  choices: ['$30$', '$11$', '$40$', '$35$']
  answer: 3
  explanation: |-
    The terms for $k = 1$ to 5 are $3, 5, 7, 9, 11$, and $3 + 5 + 7 + 9 + 11 = 35$. With the formula: $\tfrac{5(3 + 11)}{2} = 35$.
    30 leaves out the $+1$ in each term, and 11 is only the last term.
- id: a1-m7-r2-h30
  lesson: a1-m7-h-series
  topic: Series
  stem: 'Find $1 + 2 + 3 + \dots + 200$.'
  choices: ['$20{,}000$', '$40{,}200$', '$20{,}100$', '$20{,}200$']
  answer: 2
  explanation: |-
    $S = \dfrac{n(a_1 + a_n)}{2} = \dfrac{200(1 + 200)}{2} = 100 \cdot 201 = 20{,}100$.
    40,200 forgets to divide by 2.
- id: a1-m7-r2-h31
  lesson: a1-m7-h-series
  type: text
  topic: Series
  stem: 'An arithmetic series has 15 terms. Its first term is 4 and its last term is 46. Its sum is ___.'
  accept: ['375']
  explanation: |-
    $S_{15} = \dfrac{15(4 + 46)}{2} = \dfrac{15 \cdot 50}{2} = 375$: the number of terms times the average of the first and last.
- id: a1-m7-r2-h32
  lesson: a1-m7-h-series
  topic: Series
  stem: 'A pile of logs has 20 logs in the bottom row, 19 in the next row, and so on up to 1 log in the top row. How many logs are in the pile?'
  choices: ['$210$', '$200$', '$420$', '$190$']
  answer: 0
  explanation: |-
    $20 + 19 + \dots + 1$ has 20 terms: $\dfrac{20(20 + 1)}{2} = 210$.
    420 forgets to halve, and 190 uses 19 terms.
- id: a1-m7-r2-h33
  lesson: a1-m7-h-series
  topic: Series
  stem: 'Find the sum of the first 8 terms of $3 + 6 + 12 + 24 + \cdots$.'
  choices: ['$384$', '$765$', '$768$', '$1533$']
  answer: 1
  explanation: |-
    $a_1 = 3$, $r = 2$, $n = 8$: $S_8 = \dfrac{3(1 - 2^8)}{1 - 2} = 3(256 - 1) = 765$.
    384 is the 8th term alone, 768 uses $3 \cdot 2^8$ without subtracting 1, and 1533 is the sum of 9 terms.
- id: a1-m7-r2-h34
  lesson: a1-m7-h-series
  topic: Series
  stem: 'Which infinite geometric series have a sum? Select all that apply.'
  choices:
    - '$8 + 4 + 2 + \cdots$'
    - '$1 + 1.5 + 2.25 + \cdots$'
    - '$9 - 3 + 1 - \cdots$'
    - '$5 - 5 + 5 - \cdots$'
    - '$0.3 + 0.03 + 0.003 + \cdots$'
  answer: [0, 2, 4]
  explanation: |-
    A sum exists when $|r| < 1$. The ratios are $\tfrac12$, $1.5$, $-\tfrac13$, $-1$ and $0.1$. So $8 + 4 + 2 + \cdots = 16$, $9 - 3 + 1 - \cdots = \tfrac{9}{4/3} = 6.75$ and $0.3 + 0.03 + \cdots = \tfrac13$. With $r = 1.5$ the sums grow without bound, and with $r = -1$ they jump between 5 and 0.
- id: a1-m7-r2-h35
  lesson: a1-m7-h-series
  type: text
  topic: Series
  stem: 'Write the repeating decimal $0.2727\ldots$ (27 repeating) as a fraction in lowest terms: ___'
  accept: ['3/11']
  explanation: |-
    $0.2727\ldots = 0.27 + 0.0027 + \cdots$, with $a_1 = 0.27$ and $r = 0.01$. So $S = \dfrac{0.27}{0.99} = \dfrac{27}{99} = \dfrac{3}{11}$.
- id: a1-m7-r2-h36
  lesson: a1-m7-h-series
  type: match
  topic: Series
  stem: 'Match each series to its sum.'
  pairs:
    - ['$\sum_{k=1}^{4} 3^k$', '120']
    - ['$\sum_{k=1}^{10} k$', '55']
    - ['$1 + \tfrac13 + \tfrac19 + \cdots$', '3/2']
    - ['$\sum_{k=1}^{6} (4k - 1)$', '78']
  distractors: ['81', 'No sum']
  explanation: |-
    $3 + 9 + 27 + 81 = 120$ (81 is only the last term). $1 + 2 + \dots + 10 = \tfrac{10 \cdot 11}{2} = 55$. $\tfrac{1}{1 - 1/3} = \tfrac32$. $3 + 7 + 11 + 15 + 19 + 23 = \tfrac{6(3 + 23)}{2} = 78$.
- id: a1-m7-r2-h37
  lesson: a1-m7-h-series
  type: order
  topic: Series
  stem: 'Put the steps of the derivation of the geometric series formula in order.'
  items:
    - 'Write $S_n = a_1 + a_1r + \dots + a_1r^{n-1}$'
    - 'Multiply by $r$: $rS_n = a_1r + a_1r^2 + \dots + a_1r^n$'
    - 'Subtract: $S_n - rS_n = a_1 - a_1r^n$'
    - 'Factor: $S_n(1 - r) = a_1(1 - r^n)$'
    - 'Divide by $1 - r$ (when $r \ne 1$)'
  explanation: |-
    Multiplying by $r$ shifts every term one place, so subtracting cancels all but the first term of $S_n$ and the last term of $rS_n$. Factoring both sides and dividing gives $S_n = \tfrac{a_1(1 - r^n)}{1 - r}$.
- id: a1-m7-r2-h38
  lesson: a1-m7-h-series
  type: label
  topic: Series
  stem: 'A square of area 1 is cut in half, then the leftover part is cut in half, and so on. Name the area of each numbered piece.'
  image: {src: images/a1-m7-halves-square-blank.svg, alt: 'A square divided into a left half, a top-right quarter, then smaller and smaller rectangles in the bottom-right corner, each half of the one before. Four pieces are numbered, from largest to smaller.'}
  labels:
    - {x: 32.3, y: 47.3, text: '1/2'}
    - {x: 67.7, y: 26.6, text: '1/4'}
    - {x: 58.9, y: 68.0, text: '1/8'}
    - {x: 76.6, y: 57.7, text: '1/16'}
  distractors: ['1/3', '1/32']
  explanation: |-
    The left piece is half the square. The top-right piece is half of the remaining half, $\tfrac14$. Each next piece is half the one before: $\tfrac18$, then $\tfrac1{16}$. Together the pieces fill the square, which is why $\tfrac12 + \tfrac14 + \tfrac18 + \cdots = 1$.
- id: a1-m7-r2-h39
  lesson: a1-m7-h-series
  topic: Series
  stem: 'A ball is dropped from 12 feet, and each bounce reaches $\tfrac34$ of the previous height. If it bounced forever, how far would it travel up and down in total?'
  choices: ['$48$ ft', '$96$ ft', '$36$ ft', '$84$ ft']
  answer: 3
  explanation: |-
    The bounce heights are $9, 6.75, \dots$ with $r = \tfrac34$, and they add to $\dfrac{9}{1 - 3/4} = 36$ feet. Each is traveled up and down, so the total is $12 + 2(36) = 84$ feet.
    48 counts each bounce once; 96 also doubles the first drop; 36 is the bounce heights alone.
- id: a1-m7-r2-h40
  lesson: a1-m7-h-series
  topic: Series
  stem: 'At the end of each year for 5 years, you deposit \$200 in an account that earns 4% per year, compounded once a year. About how much is in the account just after the 5th deposit?'
  choices: ['\$1,000.00', '\$1,216.65', '\$1,083.26', '\$1,126.60']
  answer: 2
  explanation: |-
    The deposits have grown for 4, 3, 2, 1 and 0 years: $200 + 200(1.04) + \dots + 200(1.04)^4 = \dfrac{200(1.04^5 - 1)}{0.04} \approx 1083.26$ dollars.
    \$1,000 ignores interest; \$1,216.65 lets every deposit grow 5 years; \$1,126.60 treats the deposits as made at the start of each year.
- id: a1-m7-r2-h41
  lesson: a1-m7-h-series
  topic: Series
  stem: 'Why do we say that $\tfrac12 + \tfrac14 + \tfrac18 + \cdots = 1$?'
  choices:
    - 'Because the partial sums $1 - \left(\tfrac12\right)^n$ get as close to 1 as you like.'
    - 'Because after enough terms the partial sum equals exactly 1.'
    - 'Because the terms eventually become 0.'
    - 'Because infinitely many positive numbers always add up to a finite number.'
  answer: 0
  explanation: |-
    Every partial sum is less than 1, but the gap $\left(\tfrac12\right)^n$ shrinks toward 0, so the sum of the infinite series is defined as 1. No term is ever 0, and many infinite series of positive numbers, like $1 + 2 + 4 + \cdots$, have no sum.
- id: a1-m7-r2-h42
  lesson: a1-m7-h-series
  topic: Series
  stem: 'How many terms does $\displaystyle\sum_{k=4}^{12} 2k$ have, and what is its sum?'
  choices: ['8 terms; sum 136', '9 terms; sum 144', '12 terms; sum 156', '9 terms; sum 72']
  answer: 1
  explanation: |-
    From $k = 4$ to $k = 12$ is $12 - 4 + 1 = 9$ terms: $8, 10, \dots, 24$. Sum: $\dfrac{9(8 + 24)}{2} = 144$.
    8 terms comes from subtracting $12 - 4$ without adding 1 (and then leaving out the first term, 8, gives 136); 156 adds from $k = 1$; 72 forgets the factor 2 in each term.
