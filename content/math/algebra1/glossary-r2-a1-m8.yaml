# Round 2 glossary for a1-m8 (honors lessons 36h1-36h3)
- term: z-score
  aliases: [z-scores, z score, standardized score, standard score]
  definition: 'How many standard deviations a value is from the mean: $z = \dfrac{x - \mu}{\sigma}$. Positive above the mean, negative below; it has no units.'
  topic: z-scores
- term: normal distribution
  aliases: [normal distributions, normal curve, normal model, bell curve, Gaussian distribution]
  definition: 'A symmetric, bell-shaped distribution described completely by its mean $\mu$ (the center) and standard deviation $\sigma$ (the spread). Areas under the curve are fractions of the data. Many real data sets are approximately normal.'
  topic: Normal distributions
- term: empirical rule
  aliases: [68–95–99.7 rule, 68-95-99.7 rule]
  definition: 'In a normal distribution, about 68% of values lie within 1 standard deviation of the mean, 95% within 2 and 99.7% within 3.'
  topic: Normal distributions
- term: standard normal distribution
  definition: 'The normal distribution with mean 0 and standard deviation 1. Standardizing (computing z-scores) turns any normal distribution into it, so one table of areas serves them all.'
  topic: Normal distributions
- term: percentile
  aliases: [percentiles]
  definition: 'The percent of the data at or below a value. In a normal distribution it is the area to the left of the value''s z-score; for example, $z = 1$ is about the 84th percentile.'
  topic: Normal distributions
- term: Simpson's paradox
  definition: 'An association that holds within every group but reverses (or disappears) when the groups are combined. It happens when a lurking variable affects the outcome and is unevenly mixed across the groups being compared.'
  topic: Simpson's paradox
- term: observational study
  aliases: [observational studies]
  definition: 'A study in which researchers record what happens without deciding who gets which treatment. It can show associations but is open to lurking variables.'
  topic: Simpson's paradox
- term: randomized experiment
  aliases: [randomized experiments, random assignment]
  definition: 'A study in which chance decides which treatment each subject gets. Random assignment tends to balance lurking variables, even unmeasured ones, across the treatment groups.'
  topic: Simpson's paradox
- term: expected count
  aliases: [expected counts]
  definition: 'The count a cell of a two-way table would have if the two variables were not associated: $\dfrac{(\text{row total})(\text{column total})}{\text{grand total}}$. It need not be a whole number.'
  topic: Expected counts
- term: sum of squared residuals
  aliases: [SSE, sum of squared errors]
  definition: 'The total $\sum (y - \hat y)^2$ of the squared residuals of a model. The least-squares regression line is the line that makes it as small as possible.'
  topic: Least-squares regression
- term: coefficient of determination
  aliases: [r-squared, r²]
  definition: 'For a least-squares line, $r^2 = 1 - \dfrac{\text{SSE}}{\sum (y - \bar y)^2}$: the fraction of the variation in $y$ that the line accounts for. It equals the square of the correlation $r$.'
  topic: Least-squares regression
- term: regression to the mean
  aliases: [regression toward the mean, regression towards the mean]
  definition: 'When $|r| < 1$, predicted values are fewer standard deviations from their mean than the inputs are from theirs ($\hat z_y = r z_x$), so extreme values tend to be followed by less extreme ones. Described by Francis Galton in 1886.'
  topic: Least-squares regression
