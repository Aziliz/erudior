# Round 2 cards: alg-m4 (core pictures and honors lessons)
- {front: 'Which method for a system: a variable already isolated', back: 'Substitution. With no coefficient of $\pm1$, elimination is usually cleaner; graph only for a picture or estimate.', topic: Systems of equations}
- {front: 'Why adding two equations of a system is allowed', back: 'Equals added to equals are equal, so every solution of the system also satisfies the sum. The new equation''s graph passes through the same intersection point.', topic: Systems of equations}
- {front: 'Fixed costs on a cost-revenue graph', back: 'The cost when nothing is sold: the vertical intercept of the cost line. Left of break-even the gap between the lines is a loss, right of it a profit.', topic: System applications}
- {front: 'A vertex on a dashed boundary', back: 'It is still a corner of the region, but it is not itself a solution (draw it as an open circle).', topic: Systems of inequalities}
- {front: '$\begin{vmatrix} a & b \\ c & d \end{vmatrix}$', back: '$ad - bc$: main diagonal product minus the other diagonal product.', topic: Determinants and Cramer''s rule}
- {front: 'Cramer''s rule for $ax + by = e$, $cx + dy = f$', back: '$x = \dfrac{D_x}{D}$, $y = \dfrac{D_y}{D}$ with $D = ad - bc \ne 0$, $D_x = ed - bf$, $D_y = af - ce$.', topic: Determinants and Cramer''s rule}
- {front: 'How to build $D_x$ and $D_y$', back: 'Start from the coefficient determinant $D$ and replace the $x$-column (for $D_x$) or the $y$-column (for $D_y$) with the constants.', topic: Determinants and Cramer''s rule}
- {front: '$D \ne 0$ means…', back: 'Exactly one solution: the lines have different slopes.', topic: Determinants and Cramer''s rule}
- {front: '$D = 0$ and $D_x$ or $D_y \ne 0$', back: 'No solution: parallel lines.', topic: Determinants and Cramer''s rule}
- {front: '$D = D_x = D_y = 0$', back: 'Infinitely many solutions: the equations describe the same line (assuming each equation is a genuine line).', topic: Determinants and Cramer''s rule}
- {front: 'Why $ad - bc = 0$ means equal slopes', back: 'If $b, d \ne 0$, divide $ad = bc$ by $bd$: $\tfrac{a}{b} = \tfrac{c}{d}$, so the slopes $-\tfrac{a}{b}$ and $-\tfrac{c}{d}$ match.', topic: Determinants and Cramer''s rule}
- {front: 'Ill-conditioned system', back: 'Nearly parallel lines ($D$ small): a tiny change in a constant moves the solution a lot. Example: $x + y = 2$, $x + 1.01y = 2.01$ gives $(1, 1)$, but $2.02$ gives $(0, 2)$.', topic: Determinants and Cramer''s rule}
- {front: 'Elimination vs Cramer''s rule for large systems', back: 'Computers use elimination; Cramer''s rule needs far more arithmetic for many unknowns. Cramer''s rule shines for $2 \times 2$ systems and proofs.', topic: Determinants and Cramer''s rule}
- {front: 'History of solving systems', back: 'Elimination-like methods in the Chinese Nine Chapters (by about the 1st century CE); determinants by Seki (1683) and Leibniz (1693); Cramer''s rule published 1750.', topic: Determinants and Cramer''s rule}
- {front: 'Slope of the level lines of $P = px + qy$', back: '$-\tfrac{p}{q}$, the same for every value of $P$, so the level lines are parallel.', topic: Linear programming}
- {front: 'When is a given corner optimal?', back: 'When the level-line slope lies between the slopes of the two edges that meet at that corner.', topic: Linear programming}
- {front: 'Sensitivity range in the workshop problem ($P = px + 20y$)', back: '$(4, 4)$ stays best for $20 \le p \le 40$ (edge slopes $-1$ and $-2$).', topic: Linear programming}
- {front: 'Two corners tie for the best value', back: 'The level lines are parallel to the edge between them, and every point of that edge is also best.', topic: Linear programming}
- {front: 'Unbounded feasible region', back: 'An optimum exists only if the objective can''t improve forever in the open direction; then it is at a corner. Minimizing a positive-coefficient cost with $x, y \ge 0$ over a nonempty region always has a minimum.', topic: Linear programming}
- {front: 'Infeasible problem', back: 'The constraints contradict each other (for example $x + y \le 4$ and $x + y \ge 6$): the feasible region is empty.', topic: Linear programming}
- {front: 'Whole-number answers in linear programming', back: 'Don''t just round the best corner: the rounded point may break a constraint or not be best. Compare the allowed whole-number points nearby.', topic: Linear programming}
- {front: 'Simplex method', back: 'Dantzig, 1947: move from a vertex along an edge to a better neighboring vertex until none is better.', topic: Linear programming}
- {front: 'Founders of linear programming', back: 'Kantorovich (1939, production planning), Dantzig (1947, simplex method); Kantorovich and Koopmans shared the 1975 Nobel Memorial Prize in Economic Sciences.', topic: Linear programming}
