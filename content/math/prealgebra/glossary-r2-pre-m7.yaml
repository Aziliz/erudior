# Round 2 glossary for pre-m7 (Variables, expressions and equations): honors lessons
- term: system of linear equations
  aliases: [systems of linear equations, system of equations, systems of equations]
  definition: 'Two or more linear equations about the same unknowns, considered together, such as $x + y = 5$ and $2x - y = 4$.'
  topic: Systems of equations
- term: solution of a system
  aliases: [solutions of a system]
  definition: 'An ordered pair that makes every equation in the system true at once; on a graph, a point where the lines meet. $(3, 2)$ solves $x + y = 5$ and $2x - y = 4$.'
  topic: Systems of equations
- term: substitution method
  definition: 'Solving a system by solving one equation for a variable and substituting that expression into the other equation, leaving one equation in one unknown.'
  topic: Systems of equations
- term: elimination method
  definition: 'Solving a system by adding or subtracting the equations (after multiplying them if needed) so that one variable cancels.'
  topic: Systems of equations
- term: compound inequality
  aliases: [compound inequalities]
  definition: 'Two inequalities joined by "and" (both must hold, as in $-1 \le x < 3$) or "or" (at least one must hold, as in $x < -1$ or $x \ge 4$).'
  topic: Compound inequalities
- term: absolute value inequality
  aliases: [absolute value inequalities]
  definition: 'An inequality with the variable inside absolute value bars. For $c > 0$, $|u| < c$ means $-c < u < c$, and $|u| > c$ means $u < -c$ or $u > c$.'
  topic: Compound inequalities
- term: point-slope form
  definition: 'The equation $y - y_1 = m(x - x_1)$ of the line with slope $m$ through the point $(x_1, y_1)$.'
  topic: Equations of lines
- term: negative reciprocals
  aliases: [negative reciprocal]
  definition: 'Two numbers whose product is $-1$, such as $\tfrac23$ and $-\tfrac32$: flip the fraction and change the sign. Perpendicular lines that are neither horizontal nor vertical have slopes that are negative reciprocals.'
  topic: Parallel and perpendicular lines
- term: linear model
  aliases: [linear models]
  definition: 'A linear equation used to describe a real quantity that changes at a steady rate; its slope is the rate of change and its $y$-intercept the starting value. It holds only where its assumptions do.'
  topic: Equations of lines
- term: rate of change
  aliases: [rates of change]
  definition: 'How much one quantity changes for each unit of another, such as dollars per hour; for a line it is the slope.'
  topic: Equations of lines
