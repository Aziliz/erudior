# Round 2 notecards for pre-h1 (Honors: Number theory and problem solving)
# --- Remainders and clock arithmetic ---
- {front: '$a \equiv b \pmod m$', back: '$a$ and $b$ leave the same remainder when divided by $m$. Example: $100 \equiv 2 \pmod 7$.', topic: 'Modular arithmetic'}
- {front: 'Remainder of a sum or product', back: 'Replace each number by its remainder, add or multiply, then reduce again. $47 \times 59 \div 6$: $5 \times 5 = 25$, remainder 1.', topic: 'Modular arithmetic'}
- {front: 'Day of the week $n$ days from now', back: 'Only the remainder of $n \div 7$ matters. 100 days from Tuesday: $100 = 14 \times 7 + 2$, so Thursday.', topic: 'Remainders'}
- {front: 'Last digit of a number', back: 'Its remainder when divided by 10. The last digit of a product depends only on the last digits of the factors.', topic: 'Modular arithmetic'}
- {front: 'Last digits of powers of 7', back: 'Cycle 7, 9, 3, 1 (length 4). $7^{2026}$: $2026 = 506 \times 4 + 2$, so the last digit is 9.', topic: 'Modular arithmetic'}
- {front: 'Remainder 0 when using a cycle', back: 'Means the LAST entry of the cycle, not the first. $7^{2024}$ ends in 1.', topic: 'Modular arithmetic'}
- {front: 'Remainder of a number divided by 9', back: 'Same as the remainder of its digit sum, because 10, 100, 1,000, … are each 1 more than a multiple of 9.', topic: 'Modular arithmetic'}
- {front: 'Casting out nines: what a result means', back: 'Mismatch: the answer is definitely wrong. Match: probably right, but swapped digits and errors of a multiple of 9 slip through.', topic: 'Modular arithmetic'}
- {front: 'Remainders of $2^n$ divided by 7', back: 'Cycle 2, 4, 1 (length 3), since $2^3 = 8 \equiv 1$. $2^{50} \equiv 2^2 = 4$.', topic: 'Modular arithmetic'}
# --- Even, odd and proof ---
- {front: 'Even and odd in algebra', back: 'Even: $2k$. Odd: $2k + 1$. Use different letters for different numbers.', topic: 'Parity'}
- {front: 'Proof that odd + odd = even', back: '$(2j + 1) + (2k + 1) = 2(j + k + 1)$, two times a whole number.', topic: 'Parity'}
- {front: 'Proof that odd × odd = odd', back: '$(2j + 1)(2k + 1) = 2(2jk + j + k) + 1$, one more than an even number.', topic: 'Parity'}
- {front: 'Examples vs proof', back: 'Examples cannot prove a statement about all numbers; one counterexample disproves it. $n^2 + n + 41$ is prime for $n = 0$ to 39 but $41^2$ at $n = 40$.', topic: 'Proof'}
- {front: 'Sum of three consecutive whole numbers', back: '$(n - 1) + n + (n + 1) = 3n$: always 3 times the middle number.', topic: 'Proof'}
- {front: 'Perfect squares divided by 4', back: 'Remainder 0 (squares of even numbers) or 1 (squares of odd numbers). So a sum of two squares never leaves remainder 3.', topic: 'Parity'}
- {front: 'Goldbach''s conjecture', back: 'Every even number greater than 2 is the sum of two primes. Checked by computer to at least $4 \times 10^{18}$; still unproved.', topic: 'Proof'}
- {front: 'Invariant', back: 'A quantity no allowed move changes. If the start and the goal differ in it, the goal is impossible.', topic: 'Parity'}
- {front: 'Chessboard with opposite corners removed', back: 'Cannot be covered by 31 dominoes: each domino covers one light and one dark square, but 32 light and 30 dark squares remain.', topic: 'Parity'}
- {front: '± signs in front of 1 to 10', back: 'The total is always odd (all plus gives 55; each sign change shifts it by an even $2a$), so it is never 0.', topic: 'Parity'}
# --- Counting multiples ---
- {front: 'Multiples of $k$ from 1 to $N$', back: 'The quotient of $N \div k$, ignoring the remainder. Multiples of 7 up to 100: 14.', topic: 'Counting multiples'}
- {front: 'Multiples of $k$ from $A$ to $B$', back: '(count up to $B$) − (count up to $A - 1$). Multiples of 6 from 100 to 300: $50 - 16 = 34$.', topic: 'Counting multiples'}
- {front: 'Inclusion–exclusion (two properties)', back: 'A or B $=$ A $+$ B $-$ both. Divisible by 2 or 3 up to 30: $15 + 10 - 5 = 20$.', topic: 'Inclusion-exclusion'}
- {front: 'Divisible by both $a$ and $b$', back: 'Exactly the multiples of LCM($a$, $b$), not of $a \times b$ unless they share no factor. Both 4 and 6: multiples of 12.', topic: 'Inclusion-exclusion'}
- {front: 'Inclusion–exclusion (three properties)', back: 'Add the singles, subtract the pairs, add back the triple. Up to 100, divisible by 2, 3 or 5: $103 - 32 + 3 = 74$.', topic: 'Inclusion-exclusion'}
- {front: 'Numbers up to 30 with no factor 2, 3 or 5', back: '1, 7, 11, 13, 17, 19, 23, 29: eight in every block of 30.', topic: 'Inclusion-exclusion'}
- {front: '$n!$', back: '$1 \times 2 \times \cdots \times n$. $5! = 120$, $6! = 720$, $10! = 3{,}628{,}800$.', topic: 'Factorials'}
- {front: 'Zeros at the end of $n!$', back: 'Count the 5s: $\frac{n}{5} + \frac{n}{25} + \frac{n}{125} + \cdots$, dropping remainders. $100!$: $20 + 4 = 24$.', topic: 'Factorials'}
- {front: 'Why count 5s, not 2s, for zeros of $n!$', back: 'Each zero needs $2 \times 5$, and there are always more 2s than 5s, so the 5s run out first.', topic: 'Factorials'}
- {front: 'Factors of 2 in $20!$', back: '$10 + 5 + 2 + 1 = 18$ (Legendre''s formula with $p = 2$).', topic: 'Factorials'}
# --- Strategies ---
- {front: 'Pólya''s four steps', back: '1. Understand the problem. 2. Make a plan. 3. Carry out the plan. 4. Look back and check.', topic: 'Problem-solving strategies'}
- {front: 'Useful plans for a new problem', back: 'Look for a pattern, try a smaller case, draw a picture, make an organized list or table, work backward, solve it two ways.', topic: 'Problem-solving strategies'}
- {front: '$1 + 2 + \cdots + n$', back: '$\dfrac{n(n + 1)}{2}$, the $n$th triangular number. $1 + \cdots + 100 = 5{,}050$.', topic: 'Number patterns'}
- {front: 'Number of terms in an arithmetic sequence', back: '$\dfrac{\text{last} - \text{first}}{\text{difference}} + 1$. From 15 to 83: 69 numbers.', topic: 'Number patterns'}
- {front: 'Sum of an arithmetic sequence', back: 'Number of terms × (first + last) ÷ 2. $7 + 11 + \cdots + 199 = 49 \times 103 = 5{,}047$.', topic: 'Number patterns'}
- {front: 'Sum of the first $n$ odd numbers', back: '$n^2$. Each odd number adds an L-shaped layer to a square. $1 + 3 + \cdots + 199 = 100^2$.', topic: 'Number patterns'}
- {front: 'Handshakes among $n$ people', back: '$\dfrac{n(n - 1)}{2}$: each shakes $n - 1$ hands, and each handshake is counted twice. 10 people: 45.', topic: 'Problem-solving strategies'}
- {front: 'Squares on an 8-by-8 chessboard', back: '$64 + 49 + 36 + 25 + 16 + 9 + 4 + 1 = 204$ squares of all sizes.', topic: 'Problem-solving strategies'}
- {front: 'Fence-post (off-by-one) rule', back: 'There is one more post than gaps: a 100 m fence with posts every 5 m has 21 posts.', topic: 'Number patterns'}
