# Round 2 glossary for pre-m2 (Integers)
- term: zero pair
  aliases: [zero pairs]
  definition: 'A positive counter ($+1$) and a negative counter ($-1$) together; they are worth $1 + (-1) = 0$, so removing one doesn''t change a total.'
  topic: Adding integers
- term: closed
  aliases: [closure, closed under]
  definition: 'A set is closed under an operation if doing it to any two members always gives a member. The integers are closed under $+$, $-$ and $\times$ but not $\div$.'
  topic: Properties of integers
- term: counterexample
  aliases: [counterexamples]
  definition: 'One example showing a general statement is false, such as $8 - 3 \ne 3 - 8$ for "subtraction is commutative."'
  topic: Properties of integers
- term: absolute value equation
  aliases: [absolute value equations]
  definition: 'An equation with the unknown inside absolute value bars. $|x - a| = d$ has two solutions $a \pm d$ if $d > 0$, one if $d = 0$, none if $d < 0$.'
  topic: Absolute value equations
- term: midpoint
  aliases: [midpoints]
  definition: 'The number halfway between two numbers $a$ and $b$: $\dfrac{a + b}{2}$, the same distance from each.'
  topic: Distance and net change
- term: net change
  definition: 'Final value minus starting value: a signed number. For moves of $+7$ and $-10$ the net change is $-3$, though the distance traveled is 17.'
  topic: Distance and net change
- term: triangle inequality
  definition: '$|a + b| \le |a| + |b|$: the size of a sum is at most the sum of the sizes, with equality when $a$ and $b$ have the same sign or one is 0.'
  topic: Distance and net change
