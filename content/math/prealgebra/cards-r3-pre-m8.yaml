# Round 3, module pre-m8: cards for the honors lesson "Scaling area and volume".
- {front: 'Lengths scaled by $k$: what happens to perimeter, area and volume?', back: 'Perimeter $\times k$, area $\times k^2$, volume $\times k^3$; angles unchanged.', topic: Scaling area and volume}
- {front: 'Why do areas scale by $k^2$?', back: 'Each unit square becomes a $k \times k$ square holding $k^2$ unit squares.', topic: Scaling area and volume}
- {front: 'Why do volumes scale by $k^3$?', back: 'Each unit cube becomes a $k \times k \times k$ cube holding $k^3$ unit cubes.', topic: Scaling area and volume}
- {front: 'Surface area of a scaled solid', back: 'It is an area, so it scales by $k^2$ (not $k^3$).', topic: Scaling area and volume}
- {front: 'Weight of a scaled solid', back: 'Same material, solid: weight goes with volume, so $\times k^3$.', topic: Scaling area and volume}
- {front: 'On a 1 : 50,000 map, 1 cm² stands for…', back: '0.25 km² (1 cm is 0.5 km, and $0.5^2 = 0.25$).', topic: Scaling area and volume}
- {front: 'Map or model scale and areas', back: 'The scale is a length ratio; square it for areas, cube it for volumes.', topic: Scaling area and volume}
- {front: 'Length ratio from an area ratio', back: '$k = \sqrt{\text{area ratio}}$ (similar figures only): 9 times the area means 3 times the lengths.', topic: Scaling area and volume}
- {front: 'Length ratio from a volume ratio', back: '$k = \sqrt[3]{\text{volume ratio}}$: 8 times the volume means 2 times the lengths.', topic: Scaling area and volume}
- {front: 'A4 to A3 paper', back: 'Twice the area, same shape, so lengths $\times \sqrt2 \approx 1.41$ (the copier''s 141%).', topic: Scaling area and volume}
- {front: 'Square-cube law', back: 'Scaled up by $k$: strength and surface grow by $k^2$, volume and weight by $k^3$. Load per unit of bone area grows by $k$.', topic: Scaling area and volume}
- {front: 'Surface-area-to-volume ratio of a cube with edge $s$', back: '$\tfrac{6s^2}{s^3} = \tfrac{6}{s}$: scaling by $k$ multiplies it by $\tfrac1k$, so small things cool faster.', topic: Scaling area and volume}
