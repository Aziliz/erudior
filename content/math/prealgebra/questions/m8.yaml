# Module 8: Measurement and geometry
# --- pre-units ---
- id: pre-q-2801
  lesson: pre-units
  module_quiz: true
  topic: Unit conversion
  stem: 'Convert 2.4 kilometers to meters.'
  choices: ['24 m', '240 m', '0.0024 m', '2,400 m']
  answer: 3
  explanation: |-
    1 km = 1,000 m, so multiply by 1,000: $2.4 \times 1{,}000 = 2{,}400$ m. Smaller units mean a bigger number.

- id: pre-q-2802
  lesson: pre-units
  topic: Unit conversion
  stem: 'How many inches are in 4.5 feet?'
  choices: ['54 in', '45 in', '0.375 in', '48 in']
  answer: 0
  explanation: |-
    $4.5 \text{ ft} \times \dfrac{12 \text{ in}}{1 \text{ ft}} = 54$ in. (0.375 divides by 12 instead.)

- id: pre-q-2803
  lesson: pre-units
  module_quiz: true
  topic: Unit conversion
  stem: 'Convert 750 milligrams to grams.'
  choices: ['75 g', '0.75 g', '7.5 g', '750,000 g']
  answer: 1
  explanation: |-
    1 g = 1,000 mg, so divide by 1,000: $750 \div 1{,}000 = 0.75$ g.

- id: pre-q-2804
  lesson: pre-units
  topic: Unit conversion
  stem: 'How many cups are in 3 quarts?'
  choices: ['6 cups', '24 cups', '12 cups', '1.5 cups']
  answer: 2
  explanation: |-
    1 quart = 2 pints = 4 cups. So $3 \times 4 = 12$ cups. (6 cups stops at pints.)

- id: pre-q-2805
  lesson: pre-units
  topic: Dimensional analysis
  stem: 'Which conversion factor converts yards to feet?'
  choices: ['$\dfrac{1 \text{ yd}}{3 \text{ ft}}$', '$\dfrac{3 \text{ yd}}{1 \text{ ft}}$', '$\dfrac{12 \text{ in}}{1 \text{ ft}}$', '$\dfrac{3 \text{ ft}}{1 \text{ yd}}$']
  answer: 3
  explanation: |-
    To cancel yards (in the numerator of the quantity), yards must be in the denominator of the factor: $\dfrac{3 \text{ ft}}{1 \text{ yd}}$. $\dfrac{3 \text{ yd}}{1 \text{ ft}}$ is not a true equality.

- id: pre-q-2806
  lesson: pre-units
  module_quiz: true
  topic: Dimensional analysis
  stem: 'A cyclist rides at 30 feet per second. What is that in miles per hour? (1 mi = 5,280 ft)'
  choices: ['About 20.5 mph', 'About 1.8 mph', 'About 0.34 mph', 'About 108 mph']
  answer: 0
  explanation: |-
    $\dfrac{30 \text{ ft}}{1 \text{ s}} \times \dfrac{3{,}600 \text{ s}}{1 \text{ h}} \times \dfrac{1 \text{ mi}}{5{,}280 \text{ ft}} = \dfrac{108{,}000}{5{,}280} \approx 20.5$ mph.

- id: pre-q-2807
  lesson: pre-units
  topic: Unit conversion
  stem: 'A trip takes 3.75 hours. How long is that in hours and minutes?'
  choices: ['3 h 75 min', '3 h 45 min', '3 h 7.5 min', '3 h 30 min']
  answer: 1
  explanation: |-
    $0.75 \text{ h} \times 60 = 45$ min, so 3 hours 45 minutes. Hours have 60 minutes, not 100.

- id: pre-q-2808
  lesson: pre-units
  topic: Unit conversion
  stem: 'How many square feet are in 1 square yard?'
  choices: ['3', '6', '9', '27']
  answer: 2
  explanation: |-
    1 yd = 3 ft, so a square yard is $3 \text{ ft} \times 3 \text{ ft} = 9 \text{ ft}^2$. (3 uses the length factor; 27 is cubic.)

- id: pre-q-2809
  lesson: pre-units
  topic: Unit conversion
  stem: 'A 5-kilogram bag of flour weighs about how many pounds? (1 kg ≈ 2.2 lb)'
  choices: ['2.3 lb', '50 lb', '7.2 lb', '11 lb']
  answer: 3
  explanation: |-
    $5 \text{ kg} \times \dfrac{2.2 \text{ lb}}{1 \text{ kg}} = 11$ lb.

- id: pre-q-2810
  lesson: pre-units
  topic: Unit conversion
  stem: 'A board is 1.5 meters long. How many centimeters is that?'
  choices: ['150 cm', '0.015 cm', '15 cm', '1,500 cm']
  answer: 0
  explanation: |-
    1 m = 100 cm: $1.5 \times 100 = 150$ cm. (1,500 cm would be millimeters.)

- id: pre-q-2811
  lesson: pre-units
  topic: Dimensional analysis
  stem: 'A faucet drips 2 cups of water per hour. How many gallons is that per day? (16 cups = 1 gallon)'
  choices: ['0.125 gal', '3 gal', '48 gal', '6 gal']
  answer: 1
  explanation: |-
    $\dfrac{2 \text{ c}}{1 \text{ h}} \times \dfrac{24 \text{ h}}{1 \text{ day}} \times \dfrac{1 \text{ gal}}{16 \text{ c}} = \dfrac{48}{16} = 3$ gallons per day.

# --- pre-angles ---
- id: pre-q-2901
  lesson: pre-angles
  module_quiz: true
  topic: Angles
  stem: 'What is the supplement of a 65° angle?'
  choices: ['25°', '295°', '115°', '125°']
  answer: 2
  explanation: |-
    Supplementary angles add to 180°: $180° - 65° = 115°$. (25° is the complement.)

- id: pre-q-2902
  lesson: pre-angles
  topic: Angles
  stem: 'Two angles are complementary, and one is 4 times the other. What is the smaller angle?'
  choices: ['36°', '45°', '22.5°', '18°']
  answer: 3
  explanation: |-
    $x + 4x = 90$, so $5x = 90$ and $x = 18°$. The other is 72°. (36° uses 180°, as if supplementary.)

- id: pre-q-2903
  lesson: pre-angles
  module_quiz: true
  topic: Angles
  stem: 'Two angles of a triangle measure 54° and 71°. What is the third angle?'
  choices: ['55°', '125°', '235°', '65°']
  answer: 0
  explanation: |-
    The angles of a triangle add to 180°: $180 - 54 - 71 = 55°$.

- id: pre-q-2904
  lesson: pre-angles
  topic: Angles
  stem: 'An angle measures 132°. What type of angle is it?'
  choices: ['acute', 'right', 'obtuse', 'straight']
  answer: 2
  explanation: |-
    It is between 90° and 180°, so it is obtuse.

- id: pre-q-2905
  lesson: pre-angles
  topic: Angles
  stem: 'Two lines cross, and one of the four angles formed is 48°. What is the angle vertical to it?'
  choices: ['42°', '48°', '132°', '312°']
  answer: 1
  explanation: |-
    Vertical angles are equal, so it is also 48°. (The two angles next to it are $180° - 48° = 132°$.)

- id: pre-q-2906
  lesson: pre-angles
  topic: Angles
  stem: 'In an isosceles triangle, each of the two equal angles measures 52°. What is the third angle?'
  choices: ['128°', '52°', '76°', '38°']
  answer: 2
  explanation: |-
    $180 - 2(52) = 180 - 104 = 76°$.

- id: pre-q-2907
  lesson: pre-angles
  module_quiz: true
  topic: Perimeter
  stem: 'A rectangle is 14 cm long and 9 cm wide. What is its perimeter?'
  choices: ['23 cm', '126 cm', '32 cm', '46 cm']
  answer: 3
  explanation: |-
    $P = 2l + 2w = 28 + 18 = 46$ cm. (23 adds only one length and one width; 126 is the area.)

- id: pre-q-2908
  lesson: pre-angles
  topic: Perimeter
  stem: 'A regular hexagon has a perimeter of 54 inches. How long is each side?'
  choices: ['9 in', '6 in', '10.8 in', '324 in']
  answer: 0
  explanation: |-
    A hexagon has 6 equal sides: $54 \div 6 = 9$ inches. (10.8 divides by 5, the number of sides of a pentagon.)

- id: pre-q-2909
  lesson: pre-angles
  topic: Perimeter
  stem: 'A square garden has a perimeter of 36 ft. Fencing costs \$12 per foot. What does it cost to fence the whole garden?'
  choices: ['\$108', '\$432', '\$144', '\$1,296']
  answer: 1
  explanation: |-
    The fence goes around the whole perimeter: $36 \times 12 = 432$ dollars. (\$108 fences one 9-foot side.)

- id: pre-q-2910
  lesson: pre-angles
  topic: Angles
  stem: 'The angles of a triangle are $x$, $2x$ and $3x$. What is the largest angle?'
  choices: ['30°', '60°', '90°', '120°']
  answer: 2
  explanation: |-
    $x + 2x + 3x = 180$, so $6x = 180$ and $x = 30$. The angles are 30°, 60°, 90°; the largest is 90°, so it is a right triangle.

- id: pre-q-2911
  lesson: pre-angles
  topic: Perimeter
  stem: 'A rectangle has perimeter 60 m and width 12 m. What is its length?'
  choices: ['36 m', '24 m', '5 m', '18 m']
  answer: 3
  explanation: |-
    $2l + 2(12) = 60$, so $2l = 36$ and $l = 18$ m. (36 m forgets to divide by 2.)

# --- pre-area ---
- id: pre-q-3001
  lesson: pre-area
  module_quiz: true
  topic: Area
  stem: 'Find the area of a triangle with base 12 m and height 7 m.'
  choices: ['42 m²', '84 m²', '19 m²', '38 m²']
  answer: 0
  explanation: |-
    $A = \tfrac12 bh = \tfrac12(12)(7) = 42 \text{ m}^2$. (84 forgets the $\tfrac12$.)

- id: pre-q-3002
  lesson: pre-area
  topic: Area
  stem: 'A parallelogram has base 10 cm, slanted side 6 cm, and height 5 cm. What is its area?'
  choices: ['60 cm²', '50 cm²', '30 cm²', '32 cm²']
  answer: 1
  explanation: |-
    $A = bh = 10 \times 5 = 50 \text{ cm}^2$. The height must be perpendicular to the base, so the slanted side (6) is not used.

- id: pre-q-3003
  lesson: pre-area
  module_quiz: true
  topic: Area
  stem: 'A trapezoid has bases 8 ft and 14 ft and height 5 ft. What is its area?'
  choices: ['110 ft²', '27 ft²', '55 ft²', '560 ft²']
  answer: 2
  explanation: |-
    $A = \tfrac12(b_1 + b_2)h = \tfrac12(22)(5) = 55 \text{ ft}^2$.

- id: pre-q-3004
  lesson: pre-area
  topic: Area
  stem: 'A square has an area of 81 in². What is its perimeter?'
  choices: ['9 in', '20.25 in', '324 in', '36 in']
  answer: 3
  explanation: |-
    Side $= \sqrt{81} = 9$ in. Perimeter $= 4 \times 9 = 36$ in.

- id: pre-q-3005
  lesson: pre-area
  topic: Area
  stem: 'A wall is 12 ft wide and 8 ft tall, with a 3 ft by 4 ft window. How many square feet need paint?'
  choices: ['84 ft²', '96 ft²', '108 ft²', '89 ft²']
  answer: 0
  explanation: |-
    Wall $12 \times 8 = 96$, minus window $3 \times 4 = 12$: $96 - 12 = 84 \text{ ft}^2$.

- id: pre-q-3006
  lesson: pre-area
  topic: Area
  stem: 'A rectangle is 15 cm by 6 cm. If both dimensions are doubled, what happens to the area?'
  choices: ['It doubles', 'It quadruples', 'It triples', 'It stays the same']
  answer: 1
  explanation: |-
    The original area is 90 cm²; the new one is $30 \times 12 = 360$ cm², which is 4 times as much. Doubling each of two dimensions multiplies area by $2 \times 2 = 4$.

- id: pre-q-3007
  lesson: pre-area
  module_quiz: true
  topic: Area
  stem: 'An L-shaped patio is made of a 10 ft by 6 ft rectangle and a 4 ft by 3 ft rectangle that don''t overlap. Concrete costs \$5 per square foot. What does the patio cost?'
  choices: ['\$300', '\$72', '\$360', '\$115']
  answer: 2
  explanation: |-
    Area $= 60 + 12 = 72 \text{ ft}^2$. Cost $= 72 \times 5 = 360$ dollars.

- id: pre-q-3008
  lesson: pre-area
  topic: Area
  stem: 'A right triangle has legs 9 cm and 12 cm and hypotenuse 15 cm. What is its area?'
  choices: ['108 cm²', '67.5 cm²', '90 cm²', '54 cm²']
  answer: 3
  explanation: |-
    The legs are perpendicular, so they serve as base and height: $\tfrac12(9)(12) = 54 \text{ cm}^2$. The hypotenuse is not used.

- id: pre-q-3009
  lesson: pre-area
  topic: Area
  stem: 'A triangle has area 30 m² and base 12 m. What is its height?'
  choices: ['5 m', '2.5 m', '18 m', '360 m']
  answer: 0
  explanation: |-
    $30 = \tfrac12(12)h = 6h$, so $h = 5$ m. (2.5 forgets the $\tfrac12$.)

- id: pre-q-3010
  lesson: pre-area
  topic: Area
  stem: 'A room measures 15 ft by 12 ft. How many square yards of carpet cover it?'
  choices: ['60 yd²', '20 yd²', '180 yd²', '1,620 yd²']
  answer: 1
  explanation: |-
    Area $= 180 \text{ ft}^2$. One square yard is 9 ft², so $180 \div 9 = 20 \text{ yd}^2$. (60 divides by 3, the length factor.)

- id: pre-q-3011
  lesson: pre-area
  topic: Area
  stem: 'Which has the larger area: a 7 by 7 square or a 10 by 4 rectangle?'
  choices: ['The rectangle, because its perimeter is larger', 'They are equal', 'The square, 49 vs 40', 'The rectangle, 40 vs 28']
  answer: 2
  explanation: |-
    Square: $7^2 = 49$. Rectangle: $10 \times 4 = 40$. The square is larger, even though both have perimeter 28. Equal perimeters don't mean equal areas.

# --- pre-circles ---
- id: pre-q-3101
  lesson: pre-circles
  module_quiz: true
  topic: Circles
  stem: 'Find the circumference of a circle with radius 5 cm (in terms of $\pi$).'
  choices: ['$5\pi$ cm', '$2.5\pi$ cm', '$25\pi$ cm', '$10\pi$ cm']
  answer: 3
  explanation: |-
    $C = 2\pi r = 2\pi(5) = 10\pi$ cm, about 31.4 cm. ($25\pi$ is the area.)

- id: pre-q-3102
  lesson: pre-circles
  module_quiz: true
  topic: Circles
  stem: 'Find the area of a circle with diameter 12 in (in terms of $\pi$).'
  choices: ['$36\pi$ in²', '$12\pi$ in²', '$144\pi$ in²', '$24\pi$ in²']
  answer: 0
  explanation: |-
    The radius is 6, so $A = \pi(6)^2 = 36\pi$ in². ($144\pi$ uses the diameter instead of the radius.)

- id: pre-q-3103
  lesson: pre-circles
  topic: Circles
  stem: 'A circle has circumference $18\pi$ m. What is its radius?'
  choices: ['18 m', '9 m', '3 m', '36 m']
  answer: 1
  explanation: |-
    $2\pi r = 18\pi$, so $r = 9$ m.

- id: pre-q-3104
  lesson: pre-circles
  topic: Circles
  stem: 'A wheel has a diameter of 70 cm. About how far does it roll in one full turn? (Use $\pi \approx \tfrac{22}{7}$.)'
  choices: ['110 cm', '440 cm', '220 cm', '3,850 cm']
  answer: 2
  explanation: |-
    One turn covers the circumference: $\pi d \approx \tfrac{22}{7} \times 70 = 220$ cm.

- id: pre-q-3105
  lesson: pre-circles
  topic: Circles
  stem: 'Which is true for every circle?'
  choices: ['$C = \pi r^2$', '$d = \dfrac{r}{2}$', '$A = 2\pi r$', '$\dfrac{C}{d} = \pi$']
  answer: 3
  explanation: |-
    The ratio of circumference to diameter is $\pi$ for every circle; that is the definition of $\pi$. The other formulas are mixed up: $C = 2\pi r$, $d = 2r$, $A = \pi r^2$.

- id: pre-q-3106
  lesson: pre-circles
  topic: Circles
  stem: 'If a circle''s radius is tripled, its area is multiplied by…'
  choices: ['9', '6', '3', '27']
  answer: 0
  explanation: |-
    Area depends on $r^2$, so tripling $r$ multiplies the area by $3^2 = 9$.

- id: pre-q-3107
  lesson: pre-circles
  topic: Circles
  stem: 'A circular rug has radius 4 ft. To the nearest square foot, what is its area?'
  choices: ['25 ft²', '50 ft²', '13 ft²', '201 ft²']
  answer: 1
  explanation: |-
    $A = \pi(4)^2 = 16\pi \approx 50.3$, about 50 ft². (25 is the circumference, $8\pi \approx 25.1$ ft.)

- id: pre-q-3108
  lesson: pre-circles
  module_quiz: true
  topic: Circles
  stem: 'A semicircle has diameter 10 m. What is its area, to the nearest tenth?'
  choices: ['78.5 m²', '157.1 m²', '39.3 m²', '15.7 m²']
  answer: 2
  explanation: |-
    The radius is 5: a full circle is $25\pi \approx 78.54$, and half is $12.5\pi \approx 39.3 \text{ m}^2$.

- id: pre-q-3109
  lesson: pre-circles
  topic: Circles
  stem: 'A circular track has a radius of 50 m. About how many laps make 5 km?'
  choices: ['10', '32', '64', '16']
  answer: 3
  explanation: |-
    One lap $= 2\pi(50) = 100\pi \approx 314$ m. $5{,}000 \div 314 \approx 15.9$, about 16 laps.

- id: pre-q-3110
  lesson: pre-circles
  topic: Circles
  stem: 'Which gives more pizza: one 12-inch pizza or two 8-inch pizzas?'
  choices: ['One 12-inch pizza', 'Two 8-inch pizzas', 'They are equal', 'It depends on the thickness only']
  answer: 0
  explanation: |-
    One 12-inch: $\pi(6)^2 = 36\pi$. Two 8-inch: $2\pi(4)^2 = 32\pi$. The single 12-inch pizza is larger.

- id: pre-q-3111
  lesson: pre-circles
  topic: Circles
  stem: 'A circle has area $49\pi$ cm². What is its diameter?'
  choices: ['7 cm', '14 cm', '24.5 cm', '49 cm']
  answer: 1
  explanation: |-
    $\pi r^2 = 49\pi$, so $r^2 = 49$ and $r = 7$. The diameter is $2r = 14$ cm.

# --- pre-volume ---
- id: pre-q-3201
  lesson: pre-volume
  module_quiz: true
  topic: Volume
  stem: 'Find the volume of a box 8 cm long, 5 cm wide and 3 cm high.'
  choices: ['16 cm³', '158 cm³', '120 cm³', '40 cm³']
  answer: 2
  explanation: |-
    $V = lwh = 8 \times 5 \times 3 = 120 \text{ cm}^3$. (158 cm² is the surface area; 16 adds the dimensions.)

- id: pre-q-3202
  lesson: pre-volume
  topic: Volume
  stem: 'What is the volume of a cube with edge 4 in?'
  choices: ['12 in³', '16 in³', '96 in³', '64 in³']
  answer: 3
  explanation: |-
    $V = s^3 = 4^3 = 64 \text{ in}^3$. (96 in² is the surface area $6s^2$.)

- id: pre-q-3203
  lesson: pre-volume
  module_quiz: true
  topic: Volume
  stem: 'A cylinder has radius 3 m and height 10 m. Find its volume in terms of $\pi$.'
  choices: ['$90\pi$ m³', '$60\pi$ m³', '$30\pi$ m³', '$900\pi$ m³']
  answer: 0
  explanation: |-
    $V = \pi r^2 h = \pi(9)(10) = 90\pi \text{ m}^3 \approx 283$ m³. ($60\pi$ is the curved surface area $2\pi rh$.)

- id: pre-q-3204
  module_quiz: true
  lesson: pre-volume
  topic: Surface area
  stem: 'Find the surface area of a box 6 in by 4 in by 2 in.'
  choices: ['48 in²', '88 in²', '44 in²', '96 in²']
  answer: 1
  explanation: |-
    $SA = 2(6 \cdot 4) + 2(6 \cdot 2) + 2(4 \cdot 2) = 48 + 24 + 16 = 88 \text{ in}^2$. (44 counts only three faces; 48 is the volume.)

- id: pre-q-3205
  lesson: pre-volume
  topic: Surface area
  stem: 'What is the surface area of a cube with edge 5 cm?'
  choices: ['125 cm²', '25 cm²', '150 cm²', '100 cm²']
  answer: 2
  explanation: |-
    Six square faces, each $5^2 = 25$: $SA = 6 \times 25 = 150 \text{ cm}^2$. (125 cm³ is the volume.)

- id: pre-q-3206
  lesson: pre-volume
  topic: Volume
  stem: 'Which question is answered by finding a volume?'
  choices: ['How much wrapping paper covers a box?', 'How much fence surrounds a yard?', 'How much paint covers a wall?', 'How much water fills a tank?']
  answer: 3
  explanation: |-
    Volume measures the space inside a solid, such as how much a tank holds. Wrapping paper is surface area, fencing is perimeter and paint on a wall is area.

- id: pre-q-3207
  lesson: pre-volume
  topic: Volume
  stem: 'A pool is 20 ft long, 10 ft wide and filled 4 ft deep. One cubic foot holds about 7.5 gallons. About how many gallons are in the pool?'
  choices: ['6,000 gal', '800 gal', '1,500 gal', '107 gal']
  answer: 0
  explanation: |-
    $V = 20 \times 10 \times 4 = 800 \text{ ft}^3$. Then $800 \times 7.5 = 6{,}000$ gallons.

- id: pre-q-3208
  lesson: pre-volume
  topic: Volume
  stem: 'A box has volume 240 cm³, length 10 cm and width 6 cm. What is its height?'
  choices: ['24 cm', '4 cm', '2.4 cm', '14 cm']
  answer: 1
  explanation: |-
    $240 = 10 \times 6 \times h = 60h$, so $h = 4$ cm.

- id: pre-q-3209
  lesson: pre-volume
  topic: Volume
  stem: 'How many cubic feet are in 1 cubic yard?'
  choices: ['3', '9', '27', '36']
  answer: 2
  explanation: |-
    $1 \text{ yd}^3 = 3 \text{ ft} \times 3 \text{ ft} \times 3 \text{ ft} = 27 \text{ ft}^3$.

- id: pre-q-3210
  lesson: pre-volume
  module_quiz: true
  topic: Volume
  stem: 'A can has diameter 6 cm and height 10 cm. To the nearest cm³, what is its volume?'
  choices: ['94 cm³', '1,131 cm³', '188 cm³', '283 cm³']
  answer: 3
  explanation: |-
    Radius 3: $V = \pi(3)^2(10) = 90\pi \approx 283 \text{ cm}^3$. (1,131 uses the diameter as the radius.)

- id: pre-q-3211
  lesson: pre-volume
  topic: Volume
  stem: 'If every edge of a cube is doubled, its volume is multiplied by…'
  choices: ['8', '4', '6', '2']
  answer: 0
  explanation: |-
    $V = s^3$, so doubling $s$ multiplies the volume by $2^3 = 8$.

# --- pre-pythagorean ---
- id: pre-q-3301
  lesson: pre-pythagorean
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A right triangle has legs 9 and 12. How long is the hypotenuse?'
  choices: ['21', '15', '225', '7.9']
  answer: 1
  explanation: |-
    $c^2 = 81 + 144 = 225$, so $c = 15$. (21 adds the legs; 225 forgets the square root.)

- id: pre-q-3302
  lesson: pre-pythagorean
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A right triangle has hypotenuse 17 and one leg 8. How long is the other leg?'
  choices: ['9', '18.8', '15', '25']
  answer: 2
  explanation: |-
    $b^2 = 17^2 - 8^2 = 289 - 64 = 225$, so $b = 15$. (18.8 adds the squares as if 17 were a leg.)

- id: pre-q-3303
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'Which side of a right triangle is the hypotenuse?'
  choices: ['The shortest side', 'The base', 'Either side next to the right angle', 'The side opposite the right angle']
  answer: 3
  explanation: |-
    The hypotenuse is the side across from the right angle, and it is always the longest side.

- id: pre-q-3304
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'Which set of side lengths forms a right triangle?'
  choices: ['6, 8, 10', '4, 5, 6', '5, 6, 7', '2, 3, 4']
  answer: 0
  explanation: |-
    $6^2 + 8^2 = 36 + 64 = 100 = 10^2$. (It is the 3-4-5 triple doubled.) The other sets fail the test.

- id: pre-q-3305
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'A 10-ft ladder leans against a wall with its foot 6 ft from the wall. How high does it reach?'
  choices: ['4 ft', '8 ft', '11.7 ft', '16 ft']
  answer: 1
  explanation: |-
    The ladder is the hypotenuse: $h^2 = 100 - 36 = 64$, so $h = 8$ ft.

- id: pre-q-3306
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'A rectangle is 5 cm by 8 cm. To the nearest tenth, how long is its diagonal?'
  choices: ['13.0 cm', '6.2 cm', '9.4 cm', '89.0 cm']
  answer: 2
  explanation: |-
    $d^2 = 25 + 64 = 89$, so $d = \sqrt{89} \approx 9.4$ cm. (6.2 is $\sqrt{64 - 25}$, subtracting instead of adding.)

- id: pre-q-3307
  lesson: pre-pythagorean
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A plane flies 120 miles north, then 50 miles east. How far is it from where it started?'
  choices: ['170 mi', '70 mi', '109 mi', '130 mi']
  answer: 3
  explanation: |-
    The paths are at right angles: $d^2 = 120^2 + 50^2 = 14{,}400 + 2{,}500 = 16{,}900$, so $d = 130$ miles. (170 adds the distances along the route.)

- id: pre-q-3308
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'Is a triangle with sides 8, 15 and 17 a right triangle?'
  choices: ['Yes, because $8^2 + 15^2 = 17^2$', 'No, because $8 + 15 \ne 17$', 'No, because 17 is prime', 'Yes, because all sides are different']
  answer: 0
  explanation: |-
    $64 + 225 = 289 = 17^2$, so it is a right triangle (a Pythagorean triple).

- id: pre-q-3309
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'A student says the hypotenuse of a right triangle with legs 6 and 8 is $\sqrt{6^2} + \sqrt{8^2} = 14$. What is the correct value?'
  choices: ['14', '10', '100', '$\sqrt{14}$']
  answer: 1
  explanation: |-
    The square root doesn't split across addition: $c = \sqrt{36 + 64} = \sqrt{100} = 10$.

- id: pre-q-3310
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'A square has a diagonal of 10 in. To the nearest tenth, how long is each side?'
  choices: ['5 in', '14.1 in', '7.1 in', '50 in']
  answer: 2
  explanation: |-
    The two sides are equal legs $s$: $s^2 + s^2 = 100$, so $2s^2 = 100$, $s^2 = 50$, $s = \sqrt{50} \approx 7.1$ in.

- id: pre-q-3311
  lesson: pre-pythagorean
  topic: Pythagorean theorem
  stem: 'A TV screen is 32 in wide and 18 in tall. To the nearest inch, what is its diagonal size?'
  choices: ['50 in', '36 in', '27 in', '37 in']
  answer: 3
  explanation: |-
    $c^2 = 1{,}024 + 324 = 1{,}348$, so $c = \sqrt{1{,}348} \approx 36.7$, about 37 in.
