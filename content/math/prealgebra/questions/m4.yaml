# Module 4: Decimals, ratios and proportions
# --- pre-dec-basics ---
- id: pre-q-1301
  lesson: pre-dec-basics
  module_quiz: true
  topic: Decimal place value
  stem: 'In 52.0384, which digit is in the thousandths place?'
  choices: ['8', '0', '4', '3']
  answer: 0
  explanation: |-
    After the point: 0 is tenths, 3 is hundredths, 8 is thousandths, 4 is ten-thousandths.

- id: pre-q-1302
  lesson: pre-dec-basics
  topic: Decimal place value
  stem: 'Which list is in order from least to greatest?'
  choices: ['0.5, 0.45, 0.405, 0.054', '0.054, 0.405, 0.45, 0.5', '0.054, 0.45, 0.405, 0.5', '0.405, 0.45, 0.054, 0.5']
  answer: 1
  explanation: |-
    Pad to three places: 0.054, 0.405, 0.450, 0.500. In thousandths these are 54, 405, 450, 500, so the order is 0.054, 0.405, 0.45, 0.5.

- id: pre-q-1303
  lesson: pre-dec-basics
  module_quiz: true
  topic: Decimal place value
  stem: 'Round 7.2649 to the nearest hundredth.'
  choices: ['7.3', '7.27', '7.26', '7.265']
  answer: 2
  explanation: |-
    The hundredths digit is 6; the next digit is 4, so it stays: 7.26. (7.27 comes from rounding in two steps, 7.2649 → 7.265 → 7.27, which is not allowed; only the digit right after the rounding place matters.)

- id: pre-q-1304
  lesson: pre-dec-basics
  module_quiz: true
  topic: Fractions and decimals
  stem: 'Write 0.85 as a fraction in simplest form.'
  choices: ['$\dfrac{85}{10}$', '$\dfrac{17}{25}$', '$\dfrac{85}{1000}$', '$\dfrac{17}{20}$']
  answer: 3
  explanation: |-
    0.85 is 85 hundredths: $\tfrac{85}{100}$. The GCF is 5, giving $\tfrac{17}{20}$.

- id: pre-q-1305
  lesson: pre-dec-basics
  topic: Fractions and decimals
  stem: 'Write $\dfrac{7}{8}$ as a decimal.'
  choices: ['0.875', '0.78', '1.14', '0.7']
  answer: 0
  explanation: |-
    $7 \div 8 = 0.875$. (1.14 divides the wrong way, $8 \div 7$.)

- id: pre-q-1306
  lesson: pre-dec-basics
  topic: Fractions and decimals
  stem: 'Which fraction has a repeating decimal?'
  choices: ['$\dfrac{3}{20}$', '$\dfrac{4}{15}$', '$\dfrac{5}{16}$', '$\dfrac{7}{25}$']
  answer: 1
  explanation: |-
    In simplest form, a fraction terminates only if its denominator has no prime factors except 2 and 5. $20 = 2^2 \cdot 5$, $25 = 5^2$, $16 = 2^4$ all terminate, but $15 = 3 \cdot 5$ has a 3, so $\tfrac4{15} = 0.2\overline{6}$ repeats.

- id: pre-q-1307
  lesson: pre-dec-basics
  topic: Fractions and decimals
  stem: 'Write $\dfrac{2}{3}$ as a decimal.'
  choices: ['0.23', '0.67', '$0.\overline{6}$', '1.5']
  answer: 2
  explanation: |-
    $2 \div 3 = 0.666\ldots = 0.\overline{6}$. The value 0.67 is a rounded approximation, not exact.

- id: pre-q-1308
  lesson: pre-dec-basics
  topic: Decimal place value
  stem: 'How is 4.016 read in words?'
  choices: ['four and sixteen hundredths', 'four and one hundred sixty thousandths', 'four thousand sixteen', 'four and sixteen thousandths']
  answer: 3
  explanation: |-
    The last digit, 6, is in the thousandths place, so the decimal part is "sixteen thousandths": four and sixteen thousandths ($4\tfrac{16}{1000}$).

- id: pre-q-1309
  lesson: pre-dec-basics
  topic: Decimal place value
  stem: 'Which is greater: $-1.25$ or $-1.3$?'
  choices: ['$-1.25$, because it is to the right of $-1.3$', '$-1.3$, because 3 > 25', 'They are equal', '$-1.3$, because it has fewer digits']
  answer: 0
  explanation: |-
    $-1.25$ is closer to zero than $-1.30$, so it lies to the right on the number line and is greater.

- id: pre-q-1310
  lesson: pre-dec-basics
  topic: Fractions and decimals
  stem: 'Write 3.04 as a mixed number in simplest form.'
  choices: ['$3\tfrac{2}{5}$', '$3\tfrac{1}{25}$', '$3\tfrac{4}{10}$', '$3\tfrac{1}{4}$']
  answer: 1
  explanation: |-
    $3.04 = 3\tfrac{4}{100} = 3\tfrac{1}{25}$. ($3\tfrac25 = 3.4$ reads the 4 as tenths.)

- id: pre-q-1311
  lesson: pre-dec-basics
  topic: Decimal place value
  stem: 'A price of \$12.3479 per share is rounded to the nearest cent. What is it?'
  choices: ['\$12.34', '\$12.3', '\$12.35', '\$12.36']
  answer: 2
  explanation: |-
    The nearest cent is the nearest hundredth. The hundredths digit is 4 and the next digit is 7, so round up: \$12.35.

# --- pre-dec-ops ---
- id: pre-q-1401
  lesson: pre-dec-ops
  module_quiz: true
  topic: Decimal operations
  stem: 'Find $14.6 + 3.08 + 9$.'
  choices: ['26.86', '17.77', '18.59', '26.68']
  answer: 3
  explanation: |-
    Line up the points: $14.60 + 3.08 + 9.00 = 26.68$. (17.77 treats 9 as 0.09.)

- id: pre-q-1402
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Find $20 - 7.36$.'
  choices: ['12.64', '13.36', '13.74', '12.74']
  answer: 0
  explanation: |-
    Write 20 as 20.00: $20.00 - 7.36 = 12.64$. Check: $12.64 + 7.36 = 20$.

- id: pre-q-1403
  lesson: pre-dec-ops
  module_quiz: true
  topic: Decimal operations
  stem: 'Find $0.4 \times 0.07$.'
  choices: ['0.28', '0.028', '2.8', '0.0028']
  answer: 1
  explanation: |-
    $4 \times 7 = 28$, and the factors have $1 + 2 = 3$ decimal places, so 0.028.

- id: pre-q-1404
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Find $2.35 \times 1.6$.'
  choices: ['37.6', '0.376', '3.76', '3.751']
  answer: 2
  explanation: |-
    $235 \times 16 = 3{,}760$; there are $2 + 1 = 3$ decimal places, so 3.760 = 3.76. Estimate: about $2 \times 2 = 4$. ✓

- id: pre-q-1405
  lesson: pre-dec-ops
  module_quiz: true
  topic: Decimal operations
  stem: 'Find $9.12 \div 0.3$.'
  choices: ['3.04', '0.304', '304', '30.4']
  answer: 3
  explanation: |-
    Move both points one place: $91.2 \div 3 = 30.4$. Check: $30.4 \times 0.3 = 9.12$. (3.04 moves the point only in the divisor.)

- id: pre-q-1406
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Find $0.056 \times 1000$.'
  choices: ['56', '0.000056', '560', '5.6']
  answer: 0
  explanation: |-
    Multiplying by 1,000 moves the point three places right: 0.056 → 56.

- id: pre-q-1407
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Find $3 \div 0.04$.'
  choices: ['0.12', '75', '7.5', '750']
  answer: 1
  explanation: |-
    Move both points two places: $300 \div 4 = 75$. Dividing by a number less than 1 gives a larger result.

- id: pre-q-1408
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Apples cost \$1.29 per pound. What do 3.5 pounds cost, to the nearest cent?'
  choices: ['\$3.87', '\$4.51', '\$4.52', '\$4.79']
  answer: 2
  explanation: |-
    $1.29 \times 3.5 = 4.515$, which rounds to \$4.52 (the thousandths digit is 5, so round up).

- id: pre-q-1409
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'Three roommates split a \$1,247.10 rent payment equally. How much does each pay?'
  choices: ['\$415.07', '\$41.57', '\$4,157.00', '\$415.70']
  answer: 3
  explanation: |-
    $1{,}247.10 \div 3 = 415.70$. Check: $415.70 \times 3 = 1{,}247.10$.

- id: pre-q-1410
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'A student found $0.6 \times 0.5 = 3.0$. Which estimate shows the error?'
  choices: ['Both factors are less than 1, so the product must be less than 1', '0.6 + 0.5 is about 1', 'The product of two decimals is always a whole number', '6 × 5 = 30, so the product is 30']
  answer: 0
  explanation: |-
    Multiplying a number by something less than 1 makes it smaller, so $0.6 \times 0.5 < 0.6$. The correct product is 0.30, with two decimal places.

- id: pre-q-1411
  lesson: pre-dec-ops
  topic: Decimal operations
  stem: 'A phone plan costs \$35.50 per month plus \$0.15 per text over the limit. Last month there were 42 extra texts. What was the bill?'
  choices: ['\$35.65', '\$41.80', '\$6.30', '\$1,491.00']
  answer: 1
  explanation: |-
    Extra charge: $42 \times 0.15 = 6.30$. Bill: $35.50 + 6.30 = 41.80$, so \$41.80. (\$6.30 is only the extra part; \$35.65 charges for one text.)

# --- pre-ratio ---
- id: pre-q-1501
  lesson: pre-ratio
  module_quiz: true
  topic: Ratios
  stem: 'A team won 18 games and lost 12. What is the ratio of losses to wins in simplest form?'
  choices: ['3 : 2', '12 : 30', '2 : 3', '2 : 5']
  answer: 2
  explanation: |-
    Losses to wins is $12 : 18$, and dividing by the GCF 6 gives $2 : 3$. (3 : 2 is wins to losses; 2 : 5 is losses to all games.)

- id: pre-q-1502
  lesson: pre-ratio
  topic: Ratios
  stem: 'Write the ratio of 40 minutes to 2 hours in simplest form.'
  choices: ['20 : 1', '1 : 20', '2 : 3', '1 : 3']
  answer: 3
  explanation: |-
    Convert to the same unit: 2 hours = 120 minutes. Then $40 : 120 = 1 : 3$. (20 : 1 forgets to convert.)

- id: pre-q-1503
  lesson: pre-ratio
  module_quiz: true
  topic: Rates
  stem: 'A cyclist rides 45 miles in 2.5 hours. What is her average speed?'
  choices: ['18 mph', '112.5 mph', '0.056 mph', '22.5 mph']
  answer: 0
  explanation: |-
    Miles per hour = miles ÷ hours: $45 \div 2.5 = 18$ mph. (112.5 multiplies; 0.056 divides the wrong way.)

- id: pre-q-1504
  lesson: pre-ratio
  module_quiz: true
  topic: Rates
  stem: 'Which is the best buy?'
  choices: ['12 oz for \$3.00', '20 oz for \$4.60', '16 oz for \$3.84', '32 oz for \$8.00']
  answer: 1
  explanation: |-
    Unit prices: $3.00 \div 12 = 0.25$, $3.84 \div 16 = 0.24$, $4.60 \div 20 = 0.23$, $8.00 \div 32 = 0.25$ dollars per ounce. The 20-ounce size is cheapest per ounce.

- id: pre-q-1505
  lesson: pre-ratio
  topic: Ratios
  stem: 'Simplify the ratio $1.2 : 4.8$.'
  choices: ['12 : 48', '4 : 1', '1 : 4', '1 : 3']
  answer: 2
  explanation: |-
    Multiply by 10 to clear decimals: $12 : 48$. Divide by 12: $1 : 4$.

- id: pre-q-1506
  lesson: pre-ratio
  topic: Ratios
  stem: 'Concrete is mixed with cement, sand and gravel in the ratio 1 : 2 : 3. How much sand is in 9 cubic yards of concrete?'
  choices: ['2 cubic yards', '6 cubic yards', '4.5 cubic yards', '3 cubic yards']
  answer: 3
  explanation: |-
    There are $1 + 2 + 3 = 6$ parts, each $9 \div 6 = 1.5$ cubic yards. Sand is 2 parts: $2 \times 1.5 = 3$ cubic yards.

- id: pre-q-1507
  lesson: pre-ratio
  topic: Ratios
  stem: 'Two partners share \$2,400 in the ratio 3 : 5. How much does the partner with the larger share get?'
  choices: ['\$1,500', '\$900', '\$1,440', '\$1,600']
  answer: 0
  explanation: |-
    $3 + 5 = 8$ parts, each $2{,}400 \div 8 = 300$. The larger share is $5 \times 300 = 1{,}500$ dollars. (\$1,440 divides by 5 parts and multiplies by 3, mixing up the parts.)

- id: pre-q-1508
  lesson: pre-ratio
  topic: Rates
  stem: 'A worker earns \$342 for 19 hours. What is the hourly wage?'
  choices: ['\$16', '\$18', '\$19', '\$17.50']
  answer: 1
  explanation: |-
    Dollars per hour: $342 \div 19 = 18$ dollars per hour.

- id: pre-q-1509
  lesson: pre-ratio
  topic: Rates
  stem: 'A printer prints 24 pages per minute. How long does it take to print 300 pages?'
  choices: ['0.08 minutes', '7,200 minutes', '12.5 minutes', '276 minutes']
  answer: 2
  explanation: |-
    Divide the pages by the rate: $300 \div 24 = 12.5$ minutes.

- id: pre-q-1510
  lesson: pre-ratio
  topic: Ratios
  stem: 'In a class, the ratio of students who walk to students who ride is 2 : 5. What fraction of the class walks?'
  choices: ['$\dfrac{2}{5}$', '$\dfrac{5}{7}$', '$\dfrac{3}{7}$', '$\dfrac{2}{7}$']
  answer: 3
  explanation: |-
    For every 2 walkers there are 5 riders, so 2 out of every 7 students walk: $\tfrac27$. ($\tfrac25$ is the part-to-part ratio, not part-to-whole.)

- id: pre-q-1511
  lesson: pre-ratio
  topic: Rates
  stem: 'A car uses 15 gallons to travel 480 miles. What is its fuel economy?'
  choices: ['32 miles per gallon', '7,200 miles per gallon', '0.03 miles per gallon', '30 miles per gallon']
  answer: 0
  explanation: |-
    Miles per gallon = miles ÷ gallons $= 480 \div 15 = 32$.

# --- pre-proportion ---
- id: pre-q-1601
  lesson: pre-proportion
  module_quiz: true
  topic: Proportions
  stem: 'Solve $\dfrac{x}{15} = \dfrac{8}{24}$.'
  choices: ['$x = 45$', '$x = 5$', '$x = 3$', '$x = 7$']
  answer: 1
  explanation: |-
    Cross products: $24x = 15 \times 8 = 120$, so $x = 5$. Check: $\tfrac{5}{15} = \tfrac13 = \tfrac8{24}$.

- id: pre-q-1602
  lesson: pre-proportion
  topic: Proportions
  stem: 'Which pair of ratios forms a proportion?'
  choices: ['$\dfrac{3}{4}$ and $\dfrac{9}{16}$', '$\dfrac{5}{6}$ and $\dfrac{6}{7}$', '$\dfrac{6}{9}$ and $\dfrac{10}{15}$', '$\dfrac{2}{5}$ and $\dfrac{5}{2}$']
  answer: 2
  explanation: |-
    Cross products: $6 \times 15 = 90$ and $9 \times 10 = 90$, equal, so $\tfrac69 = \tfrac{10}{15}$ (both are $\tfrac23$). The other pairs have unequal cross products.

- id: pre-q-1603
  lesson: pre-proportion
  module_quiz: true
  topic: Proportions
  stem: 'Five pounds of potatoes cost \$3.45. At the same rate, what do 8 pounds cost?'
  choices: ['\$5.25', '\$2.16', '\$6.90', '\$5.52']
  answer: 3
  explanation: |-
    $\dfrac{5}{3.45} = \dfrac{8}{x}$, so $5x = 27.60$ and $x = 5.52$. Or by unit rate: $3.45 \div 5 = 0.69$ per pound, times 8 is \$5.52.

- id: pre-q-1604
  lesson: pre-proportion
  topic: Proportions
  stem: 'A map scale is 1 cm : 40 km. Two cities are 260 km apart. How far apart are they on the map?'
  choices: ['6.5 cm', '10,400 cm', '0.15 cm', '65 cm']
  answer: 0
  explanation: |-
    $\dfrac{1 \text{ cm}}{40 \text{ km}} = \dfrac{x \text{ cm}}{260 \text{ km}}$, so $40x = 260$ and $x = 6.5$ cm.

- id: pre-q-1605
  lesson: pre-proportion
  topic: Proportions
  stem: 'Solve $\dfrac{4}{n} = \dfrac{10}{7}$.'
  choices: ['$n = 17.5$', '$n = 2.8$', '$n = 5.7$', '$n = 0.35$']
  answer: 1
  explanation: |-
    Cross products: $10n = 28$, so $n = 2.8$. Check: $4 \div 2.8 \approx 1.43$ and $10 \div 7 \approx 1.43$.

- id: pre-q-1606
  lesson: pre-proportion
  topic: Proportions
  stem: 'Which proportion correctly models: "If 4 tickets cost \$30, how much do 10 tickets cost?"'
  choices: ['$\dfrac{4}{30} = \dfrac{x}{10}$', '$\dfrac{4}{10} = \dfrac{x}{30}$', '$\dfrac{4}{30} = \dfrac{10}{x}$', '$\dfrac{30}{4} = \dfrac{10}{x}$']
  answer: 2
  explanation: |-
    Keep tickets over dollars on both sides: $\tfrac{4}{30} = \tfrac{10}{x}$, giving $x = 75$. The other setups put tickets and dollars in mismatched positions; the second, for example, pairs 4 tickets with $x$ dollars and gives \$12.

- id: pre-q-1607
  lesson: pre-proportion
  module_quiz: true
  topic: Proportions
  stem: 'A 5-foot post casts a 3-foot shadow. At the same time a building casts a 27-foot shadow. How tall is the building?'
  choices: ['16.2 ft', '29 ft', '81 ft', '45 ft']
  answer: 3
  explanation: |-
    Similar triangles: $\dfrac{5}{3} = \dfrac{h}{27}$, so $3h = 135$ and $h = 45$ feet. (16.2 sets up the ratio upside down.)

- id: pre-q-1608
  lesson: pre-proportion
  topic: Proportions
  stem: 'A recipe for 4 people uses 3 eggs. How many eggs for 10 people?'
  choices: ['7.5', '9', '13.3', '12']
  answer: 0
  explanation: |-
    $\dfrac{4}{3} = \dfrac{10}{x}$, so $4x = 30$ and $x = 7.5$ eggs (in practice, 7 or 8).

- id: pre-q-1609
  lesson: pre-proportion
  topic: Proportions
  stem: 'A taxi charges a \$4 flat fee plus \$2 per mile. A 5-mile ride costs \$14. Why can''t you use a proportion to find the cost of a 10-mile ride as \$28?'
  choices: ['Because 10 is not a multiple of 5', 'Because the flat fee means cost and distance are not proportional', 'Because taxi fares are rounded', 'Because the rate per mile changes']
  answer: 1
  explanation: |-
    Doubling the miles does not double the cost, since the \$4 fee is paid only once. The 10-mile ride costs $4 + 2 \times 10 = 24$ dollars, not 28.

- id: pre-q-1610
  lesson: pre-proportion
  topic: Proportions
  stem: 'On a blueprint, $\tfrac{1}{4}$ inch represents 1 foot. A room is $3\tfrac{1}{2}$ inches long on the blueprint. How long is the actual room?'
  choices: ['$\tfrac{7}{8}$ ft', '12 ft', '14 ft', '16 ft']
  answer: 2
  explanation: |-
    $\dfrac{0.25}{1} = \dfrac{3.5}{x}$, so $0.25x = 3.5$ and $x = 14$ feet. ($\tfrac78$ multiplies $3.5 \times 0.25$ instead of dividing.)

- id: pre-q-1611
  lesson: pre-proportion
  topic: Proportions
  stem: 'In a survey, 3 out of 8 people preferred tea. If 1,200 people are surveyed in the same proportion, how many prefer tea?'
  choices: ['750', '3,200', '400', '450']
  answer: 3
  explanation: |-
    $\dfrac{3}{8} = \dfrac{x}{1200}$, so $8x = 3{,}600$ and $x = 450$. (750 is the number who do not prefer tea.)
