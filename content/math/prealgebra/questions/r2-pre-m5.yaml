# Round 2, module pre-m5 (Percents): new question types for the core lessons, and the honors lessons
# --- pre-pct-basics ---
- id: pre-m5-r2-q01
  lesson: pre-pct-basics
  type: text
  topic: Percent conversions
  stem: 'Write 0.045 as a percent: $0.045 =$ ___%. (Type only the number.)'
  accept: ['4.5']
  explanation: |-
    Multiply by 100 (move the point two places right): $0.045 \times 100 = 4.5$, so $0.045 = 4.5\%$. (0.45% moves the point only one place; 45% moves it three.)

- id: pre-m5-r2-q02
  lesson: pre-pct-basics
  type: match
  module_quiz: true
  topic: Percent conversions
  stem: 'Match each fraction to the equal percent.'
  pairs:
    - ['$\tfrac18$', '12.5%']
    - ['$\tfrac34$', '75%']
    - ['$\tfrac25$', '40%']
    - ['$\tfrac{1}{20}$', '5%']
  distractors: ['25%', '80%']
  explanation: |-
    Divide, then multiply by 100: $1 \div 8 = 0.125 = 12.5\%$; $3 \div 4 = 0.75 = 75\%$; $\tfrac25 = \tfrac{40}{100} = 40\%$; $\tfrac{1}{20} = \tfrac{5}{100} = 5\%$. (25% is $\tfrac14$ and 80% is $\tfrac45$.)

- id: pre-m5-r2-q03
  lesson: pre-pct-basics
  topic: Percent conversions
  stem: 'Which of these are equal to 60%? Select all that apply.'
  choices: ['$0.6$', '$\tfrac35$', '$0.06$', '$\tfrac{6}{10}$', '$\tfrac{60}{1000}$']
  answer: [0, 1, 3]
  explanation: |-
    $60\% = \tfrac{60}{100} = 0.6$, which simplifies to $\tfrac{6}{10}$ and $\tfrac35$. Both $0.06$ and $\tfrac{60}{1000}$ equal 6%, ten times too small.

- id: pre-m5-r2-q04
  lesson: pre-pct-basics
  type: label
  module_quiz: true
  topic: Percent conversions
  stem: 'The bar runs from 0% to 100%, with a short tick every 5% and a tall tick every 10%. Name the percent at each numbered pointer.'
  image: {src: images/pre-m5-percent-bar-blank.svg, alt: 'A long horizontal bar labeled 0% at the left end and 100% at the right end, with a short tick every 5% and a tall tick every 10%. Three red pointers sit above the bar at three of the ticks.'}
  labels:
    - {x: 28.7, y: 35, text: '25%'}
    - {x: 58.5, y: 35, text: '60%'}
    - {x: 84.1, y: 35, text: '90%'}
  distractors: ['40%', '75%', '6%']
  explanation: |-
    Count the tall ticks (each 10%) and short ticks (each 5%). Pointer 1 is halfway between 20% and 30%: 25%, which is $\tfrac14$ of the bar. Pointer 2 is on the 6th tall tick: 60%. Pointer 3 is on the 9th tall tick: 90%. (6% would be very close to the left end.)

- id: pre-m5-r2-q05
  lesson: pre-pct-basics
  type: order
  topic: Percent conversions
  stem: 'Put these numbers in order from least to greatest.'
  items: ['0.5%', '$\tfrac{1}{20}$', '0.45', '$\tfrac12$', '55%']
  explanation: |-
    Write each as a decimal: $0.5\% = 0.005$, $\tfrac{1}{20} = 0.05$, $0.45$, $\tfrac12 = 0.5$, $55\% = 0.55$. The trap is 0.5%, which is half of one percent, not one half.

# --- pre-pct-solve ---
- id: pre-m5-r2-q06
  lesson: pre-pct-solve
  type: text
  topic: Percent problems
  stem: '24 is ___% of 160. (Type only the number.)'
  accept: ['15']
  explanation: |-
    The base is 160 (after "of") and the part is 24. Percent = part ÷ whole: $24 \div 160 = 0.15 = 15\%$. Check: $0.15 \times 160 = 24$.

- id: pre-m5-r2-q07
  lesson: pre-pct-solve
  type: match
  module_quiz: true
  topic: Percent problems
  stem: 'Match each problem to what it asks you to find.'
  pairs:
    - ['A \$40 shirt is 15% off. How many dollars is the discount?', 'The amount (part)']
    - ['12 of the 48 students walk to school. What percent walk?', 'The percent']
    - ['A \$9 tip was 18% of the bill. How much was the bill?', 'The base (whole)']
    - ['Rent went from \$900 to \$990. By what percent did it rise?', 'A percent change']
  explanation: |-
    The discount is 15% of \$40, a part: \$6. The walkers are 12 of 48, so the percent is unknown: 25%. The tip is 18% of an unknown bill, the base: $9 \div 0.18 = 50$ dollars. The rent changed from an old value to a new one: $(990 - 900) \div 900 = 10\%$.

- id: pre-m5-r2-q08
  lesson: pre-pct-solve
  topic: Percent problems
  stem: 'Which of these calculations give 25% of 80? Select all that apply.'
  choices: ['$0.25 \times 80$', '$80 \div 4$', '$25 \times 80$', '$80 \div 25$', '$\tfrac14 \times 80$']
  answer: [0, 1, 4]
  explanation: |-
    25% is 0.25, which is $\tfrac14$, so 25% of 80 is $0.25 \times 80 = \tfrac14 \times 80 = 80 \div 4 = 20$. $25 \times 80 = 2{,}000$ forgets to convert the percent, and $80 \div 25 = 3.2$ divides by the wrong number.

- id: pre-m5-r2-q09
  lesson: pre-pct-solve
  type: label
  module_quiz: true
  topic: Percent problems
  stem: 'This bar model solves "42 is 60% of what number?" Name the numbered parts.'
  image: {src: images/pre-m5-bar-model-blank.svg, alt: 'A bar split into ten equal cells, each holding the number 7. The first six cells are shaded, and a bracket above them is marked 42. A bracket under the whole bar is marked 100% = ?. A scale from 0% to 100% in steps of 10% runs underneath. Marker 1 is on the top bracket, marker 2 on the bottom bracket and marker 3 on one unshaded cell.'}
  labels:
    - {x: 17.1, y: 34.6, text: 'Amount (the part)'}
    - {x: 21.2, y: 69.2, text: 'Base (the whole)'}
    - {x: 70.6, y: 48, text: '10% of the base'}
  distractors: ['Percent change', 'Interest']
  explanation: |-
    The shaded 60% is the amount, 42. The whole bar, 100%, is the base, the number being asked for. Each of the ten equal cells is 10% of the base: $42 \div 6 = 7$, so the base is $10 \times 7 = 70$.

- id: pre-m5-r2-q10
  lesson: pre-pct-solve
  type: order
  topic: Percent change
  stem: 'Put the steps for finding a percent change in order.'
  items:
    - 'Find the change: new value minus original value'
    - 'Divide the change by the original value'
    - 'Multiply that quotient by 100 and add the % sign'
  explanation: |-
    Percent change $= \dfrac{\text{new} - \text{original}}{\text{original}} \times 100\%$. Each step uses the result of the one before. For \$80 to \$62: change $-18$; $-18 \div 80 = -0.225$; $-22.5\%$, which is a 22.5% decrease.

# --- pre-pct-apps ---
- id: pre-m5-r2-q11
  lesson: pre-pct-apps
  type: label
  module_quiz: true
  topic: Percent applications
  stem: 'This receipt is for shoes bought at 30% off with 6% sales tax. Name each numbered line.'
  image: {src: images/pre-m5-receipt-blank.svg, alt: 'A store receipt with five amounts and no words beside them: $85.00, −$25.50, a line, $59.50, +$3.57, a heavier line, and $63.07 in bold.'}
  labels:
    - {x: 31, y: 26, text: 'Original price'}
    - {x: 31, y: 37.2, text: 'Discount'}
    - {x: 31, y: 48.5, text: 'Sale price'}
    - {x: 31, y: 59.8, text: 'Sales tax'}
    - {x: 31, y: 78.5, text: 'Total'}
  distractors: ['Tip', 'Commission']
  explanation: |-
    The original price is \$85.00. The discount is 30% of it, \$25.50, subtracted. The sale price is $85 - 25.50 = 59.50$. Tax is 6% of the sale price (not the original), $0.06 \times 59.50 = 3.57$, added. The total is $59.50 + 3.57 = 63.07$.

- id: pre-m5-r2-q12
  lesson: pre-pct-apps
  type: text
  topic: Simple interest
  stem: 'The simple interest on \$800 at 5% per year for 3 years is ___ dollars. (Type only the number.)'
  accept: ['120']
  explanation: |-
    $I = Prt = 800 \times 0.05 \times 3 = 120$. The interest is \$120 (the total to repay would be \$920).

- id: pre-m5-r2-q13
  lesson: pre-pct-apps
  type: match
  module_quiz: true
  topic: Percent applications
  stem: 'Match each change to the single multiplication that gives the new price.'
  pairs:
    - ['25% off', 'Multiply by 0.75']
    - ['7% sales tax added', 'Multiply by 1.07']
    - ['40% markup', 'Multiply by 1.4']
    - ['40% off', 'Multiply by 0.6']
  distractors: ['Multiply by 0.25', 'Multiply by 1.25']
  explanation: |-
    An increase at rate $r$ multiplies by $1 + r$; a decrease multiplies by $1 - r$. 25% off leaves 75% (0.75); 7% tax gives 107% (1.07); a 40% markup gives 140% (1.4); 40% off leaves 60% (0.6). Multiplying by 0.25 would give only the discount, not the sale price.

- id: pre-m5-r2-q14
  lesson: pre-pct-apps
  topic: Percent applications
  stem: 'A \$50 sweater is 20% off, and 8% sales tax is charged on the sale price. Which expressions give the total cost? Select all that apply.'
  choices: ['$50 \times 0.8 \times 1.08$', '$40 \times 1.08$', '$50 \times 0.864$', '$50 \times 0.88$', '$40 + 4$']
  answer: [0, 1, 2]
  explanation: |-
    Sale price: $50 \times 0.8 = 40$. Total: $40 \times 1.08 = 43.20$. Since $0.8 \times 1.08 = 0.864$, $50 \times 0.864 = 43.20$ too. $50 \times 0.88 = 44$ adds the percents ($-20\% + 8\% = -12\%$), and $40 + 4$ figures the tax on the original \$50; both give \$44, which is wrong.

- id: pre-m5-r2-q15
  lesson: pre-pct-apps
  type: order
  topic: Percent applications
  stem: 'A jacket costs \$100. Put these deals in order from the lowest final price to the highest.'
  items:
    - '30% off, then an extra 15% off the sale price'
    - 'A single 40% discount'
    - '10% off, then an extra 30% off the sale price'
    - '20% off, then an extra 20% off the sale price'
    - '\$35 off'
  explanation: |-
    Multiply the remaining percents: $100 \times 0.70 \times 0.85 = 59.50$; $100 \times 0.60 = 60$; $100 \times 0.90 \times 0.70 = 63$; $100 \times 0.80 \times 0.80 = 64$; $100 - 35 = 65$. Stacked discounts are worth less than their sum: 20% + 20% is only 36% off.

# --- pre-m5-h-compound-interest (honors) ---
- id: pre-m5-r2-h01
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: '\$1,000 is invested at 10% compounded yearly. What is the balance after 3 years?'
  choices: ['\$1,300', '\$1,331', '\$1,330', '\$1,310']
  answer: 1
  explanation: |-
    Multiply by 1.1 each year: $1{,}000 \to 1{,}100 \to 1{,}210 \to 1{,}331$, or $1{,}000(1.1)^3 = 1{,}331$. \$1,300 is simple interest, which adds only \$100 a year.

- id: pre-m5-r2-h02
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'In $A = 5{,}000(1.06)^{8}$, what does the 1.06 represent?'
  choices: ['The interest earned in 8 years', 'The interest rate as a percent', 'The growth factor: the balance is multiplied by 1.06 each year', 'The balance after one year, in thousands']
  answer: 2
  explanation: |-
    Adding 6% interest multiplies the balance by $1 + 0.06 = 1.06$, and the exponent 8 says this happens 8 times (8 years). The rate is 6%, or 0.06; the balance after one year is $5{,}000 \times 1.06 = 5{,}300$ dollars.

- id: pre-m5-r2-h03
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: '\$4,000 is invested at 6% a year compounded monthly for 2 years. What is the balance, to the nearest cent?'
  choices: ['\$4,494.40', '\$4,480.00', '\$16,195.74', '\$4,508.64']
  answer: 3
  explanation: |-
    Rate per month: $\tfrac{0.06}{12} = 0.005$. Periods: $12 \times 2 = 24$. $A = 4{,}000(1.005)^{24} \approx 4{,}508.64$. (\$4,494.40 compounds yearly, \$4,480 is simple interest, and \$16,195.74 uses the full 6% every month.)

- id: pre-m5-r2-h04
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'What is the annual percentage yield (APY) of an account paying 6% compounded monthly, to 2 decimal places?'
  choices: ['6.17%', '6.00%', '0.50%', '72.00%']
  answer: 0
  explanation: |-
    APY $= \left(1 + \tfrac{0.06}{12}\right)^{12} - 1 = 1.005^{12} - 1 \approx 0.0617$, or 6.17%. Monthly compounding makes the true yearly growth a little more than the stated 6%. (0.50% is the rate for one month; 72% is $12 \times 6\%$.)

- id: pre-m5-r2-h05
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'Bank A pays 4.8% compounded daily (365 times a year). Bank B pays 4.9% compounded yearly. Which pays more on a savings deposit, and why?'
  choices: ['Bank B, because 4.9% is more than 4.8%', 'They pay the same, because daily compounding adds exactly 0.1%', 'Bank A, because its APY is about 4.92%, more than Bank B''s 4.90%', 'Bank A, because daily compounding always beats a higher rate']
  answer: 2
  explanation: |-
    Compare APYs. Bank A: $\left(1 + \tfrac{0.048}{365}\right)^{365} - 1 \approx 0.04917$, about 4.92%. Bank B compounds once a year, so its APY is 4.90%. Bank A wins here, but only barely; a large enough difference in stated rates would win instead, so "always" is wrong.

- id: pre-m5-r2-h06
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'Using the rule of 72, about how long does money take to double at 6% a year?'
  choices: ['6 years', '12 years', '16.7 years', '43 years']
  answer: 1
  explanation: |-
    Years to double $\approx 72 \div 6 = 12$. Check: $1.06^{12} \approx 2.01$. (16.7 years is $100 \div 6$, the time for simple interest to double the money.)

- id: pre-m5-r2-h07
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'A \$20,000 car loses 20% of its value each year. Using this model, what is it worth after 2 years?'
  choices: ['\$12,000', '\$16,000', '\$14,400', '\$12,800']
  answer: 3
  explanation: |-
    It keeps 80% each year: $20{,}000 \times 0.8^2 = 20{,}000 \times 0.64 = 12{,}800$. \$12,000 subtracts 40% of the original, but the second year's loss is 20% of \$16,000, not of \$20,000.

- id: pre-m5-r2-h08
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'Graph a balance over many years. Which describes the shapes?'
  choices: ['Simple interest gives a straight line; compound interest gives a curve that bends upward', 'Both give straight lines, and compound interest''s is steeper', 'Simple interest curves upward; compound interest is a straight line', 'Both curve upward at the same rate']
  answer: 0
  explanation: |-
    Simple interest adds the same dollar amount every year, so the points fall on a line. Compound interest multiplies by the same factor every year, so each year's increase is bigger than the last and the graph curves upward: exponential growth.

- id: pre-m5-r2-h09
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'About what yearly interest rate would double an investment in 8 years, by the rule of 72?'
  choices: ['8%', '12.5%', '9%', '64%']
  answer: 2
  explanation: |-
    The rule works both ways: rate $\approx 72 \div 8 = 9\%$. Check: $1.09^8 \approx 1.99$. (12.5% is $100 \div 8$, the simple-interest rate that doubles money in 8 years.)

- id: pre-m5-r2-h10
  lesson: pre-m5-h-compound-interest
  type: text
  topic: Compound interest
  stem: '\$2,000 at 10% compounded yearly grows to ___ dollars after 3 years. (Type only the number.)'
  accept: ['2662', '2,662', '2662.00', '2,662.00']
  explanation: |-
    $2{,}000(1.1)^3 = 2{,}000 \times 1.331 = 2{,}662$. Year by year: 2,200, then 2,420, then 2,662.

- id: pre-m5-r2-h11
  lesson: pre-m5-h-compound-interest
  type: text
  topic: Compound interest
  stem: 'Interest is compounded quarterly for 5 years. In $A = P\left(1 + \tfrac{r}{n}\right)^{nt}$, the exponent $nt$ is ___.'
  accept: ['20']
  explanation: |-
    Quarterly means $n = 4$ periods a year, and $t = 5$ years, so $nt = 4 \times 5 = 20$ quarters.

- id: pre-m5-r2-h12
  lesson: pre-m5-h-compound-interest
  type: match
  topic: Compound interest
  stem: 'Match each way of compounding to $n$, the number of compounding periods per year.'
  pairs:
    - ['Semiannually', '2']
    - ['Quarterly', '4']
    - ['Monthly', '12']
    - ['Daily', '365']
  distractors: ['6', '52']
  explanation: |-
    Semiannually means twice a year, quarterly four times (every three months), monthly 12 times and daily 365 times. (52 would be weekly.)

- id: pre-m5-r2-h13
  lesson: pre-m5-h-compound-interest
  topic: Compound interest
  stem: 'Which statements about compound interest are true? Assume a positive rate and no withdrawals. Select all that apply.'
  choices:
    - 'Each year''s interest is larger than the year before.'
    - 'The rule of 72 gives the exact doubling time.'
    - 'At the same stated rate, monthly compounding gives more than yearly compounding.'
    - 'Doubling the principal doubles the doubling time.'
    - 'The APY lets you compare accounts that compound differently.'
  answer: [0, 2, 4]
  explanation: |-
    Interest is a percent of a growing balance, so it grows every year. More frequent compounding adds a little more (6% monthly is an APY of about 6.17%). The APY puts every account on a once-a-year basis. The rule of 72 is only an estimate, and the doubling time doesn't depend on the principal at all: \$50 and \$5,000 double at the same moment.

- id: pre-m5-r2-h14
  lesson: pre-m5-h-compound-interest
  type: order
  topic: Compound interest
  stem: 'Put the steps for computing $A = P\left(1 + \tfrac{r}{n}\right)^{nt}$ in order.'
  items:
    - 'Divide the yearly rate (as a decimal) by n'
    - 'Add 1 to that quotient'
    - 'Raise the sum to the power nt'
    - 'Multiply the result by the principal P'
  explanation: |-
    Work from the inside out, following the order of operations: the rate per period $\tfrac{r}{n}$, then the growth factor $1 + \tfrac{r}{n}$, then the power, then multiply by $P$. Multiplying by $P$ before taking the power would raise $P$ to the power too, which is wrong.

# --- pre-m5-h-percent-reasoning (honors) ---
- id: pre-m5-r2-h15
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A price rises 10% and then falls 10%. What is the overall change?'
  choices: ['No change', 'A 1% increase', 'A 10% decrease', 'A 1% decrease']
  answer: 3
  explanation: |-
    Multiply the multipliers: $1.1 \times 0.9 = 0.99$, and $0.99 - 1 = -0.01$, a 1% decrease. The fall is 10% of a larger price, so it takes away more than the rise added. With \$100: $100 \to 110 \to 99$.

- id: pre-m5-r2-h16
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A price rises 25%. What percent decrease brings it back to the original price?'
  choices: ['20%', '25%', '75%', '80%']
  answer: 0
  explanation: |-
    Undo the multiplier 1.25 by multiplying by $\tfrac{1}{1.25} = 0.8$, a 20% decrease. With \$80: up 25% is \$100, and down 20% of \$100 is back to \$80. A 25% decrease would give $100 \times 0.75 = 75$, too low.

- id: pre-m5-r2-h17
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A stock falls 50%. What percent gain does it need to get back to its starting price?'
  choices: ['50%', '100%', '150%', '200%']
  answer: 1
  explanation: |-
    After a 50% fall it is worth half as much, so it must double: multiplier $\tfrac{1}{0.5} = 2$, a 100% gain. A \$40 share falls to \$20 and needs a \$20 gain, which is 100% of \$20.

- id: pre-m5-r2-h18
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A loan''s interest rate goes from 6% to 9%. Which description is correct?'
  choices: ['It rose 3%, which is the same as 3 percentage points', 'It rose 50 percentage points', 'It rose 3 percentage points, an increase of 50%', 'It rose 9 percentage points, an increase of 150%']
  answer: 2
  explanation: |-
    Percentage points: $9 - 6 = 3$. Relative change: $3 \div 6 = 0.5$, a 50% increase. "Rose 3%" would mean the rate went from 6% to $6 \times 1.03 = 6.18\%$, so it's not the same thing.

- id: pre-m5-r2-h19
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'An unemployment rate falls from 4.0% to 3.5%. What is the relative (percent) change in the rate?'
  choices: ['A 0.5% decrease', 'A 14.3% decrease', 'A 0.5 percentage point increase', 'A 12.5% decrease']
  answer: 3
  explanation: |-
    The change is $3.5 - 4.0 = -0.5$ percentage point. Relative change: $-0.5 \div 4.0 = -0.125$, a 12.5% decrease. (14.3% divides by the new rate, 3.5, instead of the original.)

- id: pre-m5-r2-h20
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'Among people who don''t take a medicine, 1 in 1,000 gets a certain side effect; among people who take it, 3 in 1,000 do. Which statement is accurate?'
  choices: ['The risk rose 200%, an absolute increase of 0.2 percentage point', 'The risk rose 3%', 'The risk rose 2%, so the medicine is twice as risky', 'The risk rose 300 percentage points']
  answer: 0
  explanation: |-
    Relative change: $(3 - 1) \div 1 = 2$, a 200% increase (the risk tripled). Absolute: 0.1% to 0.3%, up 0.2 percentage point, or 2 extra cases per 1,000 people. Both are true; together they give the full picture. (The numbers are invented for practice.)

- id: pre-m5-r2-h21
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'Ana made a higher percent of her free throws than Bea in Month 1 and again in Month 2, yet Bea''s percent for the two months combined is higher. How can that happen?'
  choices: ['It can''t; one of the percents must be miscalculated', 'Ana took most of her shots in her weaker month, so her overall percent is weighted toward it', 'Bea''s percents were rounded up', 'Combined percents are found by adding the monthly percents']
  answer: 1
  explanation: |-
    An overall percent is a weighted average of the group percents, weighted by group size. If Ana's attempts were mostly in her weaker month and Bea's in her stronger one, the comparison can flip: Simpson's paradox. Nothing is miscalculated, and percents from different-sized groups can't simply be added or averaged.

- id: pre-m5-r2-h22
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'For which pair of price changes does the ORDER change the final price?'
  choices: ['25% off and 8% tax', '30% off and an extra 20% off', '10% off and \$10 off', 'A 15% markup and 15% off']
  answer: 2
  explanation: |-
    Percent changes are multiplications, and multiplication can be done in any order, so the other three pairs give the same result either way. A flat \$10 off is a subtraction. On \$100: 10% off then \$10 off gives $90 - 10 = 80$; \$10 off then 10% off gives $90 \times 0.9 = 81$.

- id: pre-m5-r2-h23
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A store takes 20% off, then an extra 25% off the sale price. What single discount is this equal to?'
  choices: ['45%', '5%', '55%', '40%']
  answer: 3
  explanation: |-
    You pay $0.80 \times 0.75 = 0.60$ of the original, so the total discount is 40%. Adding the percents (45%) ignores that the 25% is taken of the already reduced price.

- id: pre-m5-r2-h24
  lesson: pre-m5-h-percent-reasoning
  type: text
  topic: Percent reasoning
  stem: 'A price rises 60%. It must then fall ___% to return exactly to the original price. (Type only the number.)'
  accept: ['37.5']
  explanation: |-
    Undo the multiplier 1.6 with $\tfrac{1}{1.6} = 0.625$, a decrease of $1 - 0.625 = 0.375 = 37.5\%$. Or use $\tfrac{r}{1 + r} = \tfrac{0.6}{1.6} = 0.375$. Check with \$100: $100 \to 160$, and 37.5% of 160 is 60, back to \$100.

- id: pre-m5-r2-h25
  lesson: pre-m5-h-percent-reasoning
  type: text
  topic: Percent reasoning
  stem: 'A mortgage rate went from 3.5% to 4.25%. It rose ___ percentage points. (Type only the number.)'
  accept: ['0.75', '3/4']
  explanation: |-
    Percentage points are a plain difference: $4.25 - 3.5 = 0.75$. (As a relative change that is $0.75 \div 3.5 \approx 21.4\%$.)

- id: pre-m5-r2-h26
  lesson: pre-m5-h-percent-reasoning
  type: match
  topic: Percent reasoning
  stem: 'Match each change to its multiplier.'
  pairs:
    - ['Up 40%', '1.4']
    - ['Down 40%', '0.6']
    - ['Up 100%', '2']
    - ['Down 5%', '0.95']
  distractors: ['0.4', '1.05']
  explanation: |-
    The multiplier is $1 + r$ with $r$ negative for a decrease: $1 + 0.4 = 1.4$, $1 - 0.4 = 0.6$, $1 + 1 = 2$, $1 - 0.05 = 0.95$. A multiplier of 0.4 would be a 60% decrease, and 1.05 a 5% increase.

- id: pre-m5-r2-h27
  lesson: pre-m5-h-percent-reasoning
  topic: Percent reasoning
  stem: 'A mayor''s approval rating rose from 40% to 50%. Which statements are correct? Select all that apply.'
  choices:
    - 'It rose 10 percentage points.'
    - 'It rose 25%.'
    - 'It rose 10%.'
    - 'It rose 20 percentage points.'
    - 'The new rating is 1.25 times the old one.'
  answer: [0, 1, 4]
  explanation: |-
    Points: $50 - 40 = 10$. Relative change: $10 \div 40 = 0.25$, a 25% rise, so the new rating is $1.25$ times the old. "Rose 10%" confuses points with percent: 10% more than 40% would be 44%.

- id: pre-m5-r2-h28
  lesson: pre-m5-h-percent-reasoning
  type: order
  topic: Percent reasoning
  stem: 'An item starts at \$100. Put these pairs of changes in order from the lowest final price to the highest.'
  items:
    - 'Up 50%, then down 50%'
    - 'Down 20%, then up 20%'
    - 'Down 30%, then up 40%'
    - 'Up 10%, then down 10%'
    - 'Up 30%, then down 20%'
  explanation: |-
    Multiply the multipliers: $1.5 \times 0.5 = 0.75$ (\$75); $0.8 \times 1.2 = 0.96$ (\$96); $0.7 \times 1.4 = 0.98$ (\$98); $1.1 \times 0.9 = 0.99$ (\$99); $1.3 \times 0.8 = 1.04$ (\$104). Equal-sized up and down changes always end below the start, and the bigger the change, the bigger the loss.
