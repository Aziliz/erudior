# Module 7: Variables, expressions and equations
# --- pre-expressions ---
- id: pre-q-2301
  lesson: pre-expressions
  module_quiz: true
  topic: Expressions
  stem: 'Evaluate $2x^2 - 3x$ when $x = -4$.'
  choices: ['44', '20', '$-20$', '$-44$']
  answer: 0
  explanation: |-
    Substitute with parentheses: $2(-4)^2 - 3(-4) = 2(16) + 12 = 32 + 12 = 44$. (20 comes from $-3(-4)$ treated as $-12$; $-20$ from squaring without parentheses.)

- id: pre-q-2302
  lesson: pre-expressions
  module_quiz: true
  topic: Translating words
  stem: 'Which expression means "8 less than a number $n$"?'
  choices: ['$8 - n$', '$n - 8$', '$8n$', '$n < 8$']
  answer: 1
  explanation: |-
    Start with the number and take 8 away: $n - 8$. "Less than" reverses the order in which the words appear. ($n < 8$ is an inequality, not an expression.)

- id: pre-q-2303
  lesson: pre-expressions
  topic: Expressions
  stem: 'In the expression $5y^2 - y + 9$, what is the coefficient of $y$?'
  choices: ['1', '5', '$-1$', '9']
  answer: 2
  explanation: |-
    The term is $-y$, which means $-1 \cdot y$, so the coefficient is $-1$. The sign goes with the term.

- id: pre-q-2304
  lesson: pre-expressions
  topic: Expressions
  stem: 'How many terms does $4a^2 - 7ab + b - 12$ have?'
  choices: ['3', '6', '5', '4']
  answer: 3
  explanation: |-
    Terms are separated by + and −: $4a^2$, $-7ab$, $b$ and $-12$. That is 4 terms.

- id: pre-q-2305
  lesson: pre-expressions
  module_quiz: true
  topic: Translating words
  stem: 'Which expression means "three times the sum of a number and 5"?'
  choices: ['$3(x + 5)$', '$3x + 5$', '$3 + x + 5$', '$x + 15$']
  answer: 0
  explanation: |-
    The whole sum is multiplied by 3, so it needs parentheses: $3(x + 5)$. ($3x + 5$ is "the sum of three times a number and 5.")

- id: pre-q-2306
  lesson: pre-expressions
  topic: Expressions
  stem: 'Evaluate $\dfrac{a - b}{2a}$ when $a = 3$ and $b = -5$.'
  choices: ['$-\dfrac{1}{3}$', '$\dfrac{4}{3}$', '$\dfrac{1}{3}$', '$\dfrac{8}{3}$']
  answer: 1
  explanation: |-
    Numerator: $3 - (-5) = 8$. Denominator: $2(3) = 6$. Value: $\tfrac86 = \tfrac43$. ($-\tfrac13$ comes from $3 + (-5) = -2$ on top.)

- id: pre-q-2307
  lesson: pre-expressions
  topic: Expressions
  stem: 'The formula $F = \tfrac{9}{5}C + 32$ converts Celsius to Fahrenheit. What is $-10$°C in Fahrenheit?'
  choices: ['50°F', '$-18$°F', '14°F', '22°F']
  answer: 2
  explanation: |-
    $F = \tfrac95(-10) + 32 = -18 + 32 = 14$.

- id: pre-q-2308
  lesson: pre-expressions
  topic: Translating words
  stem: 'A plumber charges \$65 to visit plus \$48 per hour. Which expression gives the cost of a job lasting $h$ hours?'
  choices: ['$65h + 48$', '$(65 + 48)h$', '$113h$', '$48h + 65$']
  answer: 3
  explanation: |-
    The hourly charge is $48h$, and the visit fee of 65 is added once: $48h + 65$.

- id: pre-q-2309
  lesson: pre-expressions
  topic: Expressions
  stem: 'If $x = 5$, what is the value of $3x$?'
  choices: ['15', '8', '35', '53']
  answer: 0
  explanation: |-
    $3x$ means $3 \times x = 3 \times 5 = 15$. Writing the digits side by side (35) is a common slip.

- id: pre-q-2310
  lesson: pre-expressions
  topic: Translating words
  stem: 'Let $w$ be a rectangle''s width. Its length is 5 more than twice the width. Which expression is the length?'
  choices: ['$2(w + 5)$', '$2w + 5$', '$5w + 2$', '$2 + w + 5$']
  answer: 1
  explanation: |-
    "Twice the width" is $2w$; "5 more than" that is $2w + 5$.

- id: pre-q-2311
  lesson: pre-expressions
  topic: Expressions
  stem: 'Evaluate $-x^2 + 4x$ when $x = 3$.'
  choices: ['21', '$-3$', '3', '$-21$']
  answer: 2
  explanation: |-
    $-x^2 = -(3^2) = -9$ (the exponent applies before the negative). Then $-9 + 12 = 3$. (21 comes from $(-3)^2 = 9$.)

# --- pre-simplify ---
- id: pre-q-2401
  lesson: pre-simplify
  module_quiz: true
  topic: Distributive property
  stem: 'Simplify $-3(2x - 5)$.'
  choices: ['$-6x - 15$', '$6x + 15$', '$-6x - 5$', '$-6x + 15$']
  answer: 3
  explanation: |-
    Multiply each term by $-3$: $(-3)(2x) = -6x$ and $(-3)(-5) = +15$. So $-6x + 15$.

- id: pre-q-2402
  lesson: pre-simplify
  module_quiz: true
  topic: Simplifying expressions
  stem: 'Simplify $5a + 3 - 2a + 7$.'
  choices: ['$3a + 10$', '$13a$', '$7a + 10$', '$3a - 4$']
  answer: 0
  explanation: |-
    Combine like terms: $5a - 2a = 3a$ and $3 + 7 = 10$. So $3a + 10$. Constants and $a$-terms can't combine with each other.

- id: pre-q-2403
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'Which pair are like terms?'
  choices: ['$3x^2$ and $3x$', '$5xy$ and $-2xy$', '$4a$ and $4b$', '$7$ and $7m$']
  answer: 1
  explanation: |-
    Like terms have exactly the same variable part. $5xy$ and $-2xy$ both have $xy$. The other pairs differ in variables or powers.

- id: pre-q-2404
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'Simplify $4x^2 + 3x^2$.'
  choices: ['$7x^4$', '$12x^2$', '$7x^2$', '$12x^4$']
  answer: 2
  explanation: |-
    Combining like terms adds the coefficients and keeps the variable part: $7x^2$. Exponents don't change when you add.

- id: pre-q-2405
  lesson: pre-simplify
  module_quiz: true
  topic: Simplifying expressions
  stem: 'Simplify $2(3y + 4) - (y - 6)$.'
  choices: ['$5y + 2$', '$5y - 2$', '$7y + 14$', '$5y + 14$']
  answer: 3
  explanation: |-
    Distribute: $6y + 8 - y + 6$. (The minus sign changes $-6$ to $+6$.) Combine: $5y + 14$. ($5y + 2$ forgets to change the sign of the 6.)

- id: pre-q-2406
  lesson: pre-simplify
  topic: Distributive property
  stem: 'Which shows $18x + 12$ factored using the GCF?'
  choices: ['$6(3x + 2)$', '$2(9x + 6)$', '$3(6x + 4)$', '$6(3x + 12)$']
  answer: 0
  explanation: |-
    The GCF of 18 and 12 is 6: $18x + 12 = 6(3x + 2)$. $2(9x + 6)$ and $3(6x + 4)$ are equivalent but don't use the greatest factor; $6(3x + 12)$ is wrong ($6 \times 12 = 72$).

- id: pre-q-2407
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'Simplify $x + x + x$.'
  choices: ['$x^3$', '$3x$', '$3 + x$', '$x$']
  answer: 1
  explanation: |-
    Each $x$ is $1x$, so $1x + 1x + 1x = 3x$. ($x^3$ would be $x \cdot x \cdot x$.)

- id: pre-q-2408
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'Simplify $4(m - 2n) - 3(m + n)$.'
  choices: ['$7m - 11n$', '$m - 5n$', '$m - 11n$', '$m + 11n$']
  answer: 2
  explanation: |-
    Distribute: $4m - 8n - 3m - 3n$. Combine: $m - 11n$. ($m - 5n$ comes from $-8n + 3n$, a sign error on the second distribution.)

- id: pre-q-2409
  lesson: pre-simplify
  topic: Distributive property
  stem: |-
    A student simplified $5 - 2(x + 3)$ as $3(x + 3) = 3x + 9$. What is the correct result?
  choices: ['$3x + 9$', '$-2x + 1$', '$-2x + 11$', '$-2x - 1$']
  answer: 3
  explanation: |-
    Multiplication comes before subtraction, so distribute first: $5 - 2x - 6 = -2x - 1$. The student subtracted $5 - 2$ first.

- id: pre-q-2410
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'A rectangle has length $3x + 2$ and width $x - 1$. Which simplified expression gives its perimeter?'
  choices: ['$8x + 2$', '$4x + 1$', '$8x + 6$', '$4x + 2$']
  answer: 0
  explanation: |-
    $P = 2(3x + 2) + 2(x - 1) = 6x + 4 + 2x - 2 = 8x + 2$. ($4x + 1$ adds one length and one width without doubling.)

- id: pre-q-2411
  lesson: pre-simplify
  topic: Simplifying expressions
  stem: 'Which expression is equivalent to $6 - 4(2 - x)$?'
  choices: ['$4x + 14$', '$4x - 2$', '$-4x - 2$', '$4 - 2x$']
  answer: 1
  explanation: |-
    Distribute $-4$: $6 - 8 + 4x = 4x - 2$. Check with $x = 1$: original $6 - 4(1) = 2$; $4(1) - 2 = 2$. ✓

# --- pre-equations-1 ---
- id: pre-q-2501
  lesson: pre-equations-1
  module_quiz: true
  topic: Solving equations
  stem: 'Solve $x + 13 = 4$.'
  choices: ['$x = 17$', '$x = 9$', '$x = -9$', '$x = -17$']
  answer: 2
  explanation: |-
    Subtract 13 from both sides: $x = 4 - 13 = -9$. Check: $-9 + 13 = 4$. ✓

- id: pre-q-2502
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $-7y = 56$.'
  choices: ['$y = 8$', '$y = 63$', '$y = 49$', '$y = -8$']
  answer: 3
  explanation: |-
    Divide both sides by $-7$: $y = 56 \div (-7) = -8$. Check: $-7(-8) = 56$. ✓

- id: pre-q-2503
  lesson: pre-equations-1
  module_quiz: true
  topic: Solving equations
  stem: 'Solve $4x - 9 = 23$.'
  choices: ['$x = 8$', '$x = 3.5$', '$x = 128$', '$x = 5.75$']
  answer: 0
  explanation: |-
    Add 9: $4x = 32$. Divide by 4: $x = 8$. Check: $32 - 9 = 23$. ✓ (3.5 comes from subtracting 9 instead of adding.)

- id: pre-q-2504
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $\dfrac{3}{4}n = 18$.'
  choices: ['$n = 13.5$', '$n = 24$', '$n = 72$', '$n = 6$']
  answer: 1
  explanation: |-
    Multiply both sides by the reciprocal $\tfrac43$: $n = 18 \times \tfrac43 = 24$. (13.5 multiplies by $\tfrac34$ instead.)

- id: pre-q-2505
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Is $x = -2$ a solution of $5 - 3x = 11$?'
  choices: ['No, because $5 - 3(-2) = -1$', 'No, because $x$ must be positive', 'Yes, because $5 - 3(-2) = 11$', 'Yes, because $-2 < 11$']
  answer: 2
  explanation: |-
    Substitute: $5 - 3(-2) = 5 + 6 = 11$, which matches the right side. So yes.

- id: pre-q-2506
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $12 - 5x = -8$.'
  choices: ['$x = -4$', '$x = -0.8$', '$x = 0.8$', '$x = 4$']
  answer: 3
  explanation: |-
    Subtract 12: $-5x = -20$. Divide by $-5$: $x = 4$. Check: $12 - 20 = -8$. ✓

- id: pre-q-2507
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $\dfrac{x}{6} + 2 = 7$.'
  choices: ['$x = 30$', '$x = 54$', '$x = 5$', '$x = \dfrac{5}{6}$']
  answer: 0
  explanation: |-
    Subtract 2: $\tfrac{x}{6} = 5$. Multiply by 6: $x = 30$. (54 comes from adding 2 instead of subtracting it: $\tfrac{x}{6} = 9$.)

- id: pre-q-2508
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $\dfrac{x + 4}{3} = 5$.'
  choices: ['$x = 19$', '$x = 11$', '$x = \dfrac{1}{3}$', '$x = 3$']
  answer: 1
  explanation: |-
    The 4 is added first, then the sum divided by 3, so undo in reverse: multiply by 3 to get $x + 4 = 15$, then subtract 4: $x = 11$.

- id: pre-q-2509
  lesson: pre-equations-1
  module_quiz: true
  topic: Solving equations
  stem: 'A taxi charges \$3 plus \$2.50 per mile. A ride cost \$23. How many miles was it?'
  choices: ['10.4 miles', '9.2 miles', '8 miles', '6.4 miles']
  answer: 2
  explanation: |-
    $2.50m + 3 = 23$. Subtract 3: $2.50m = 20$. Divide: $m = 8$ miles. (9.2 forgets to subtract the \$3 fee.)

- id: pre-q-2510
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'To solve $2x + 7 = 15$, what is the best first step?'
  choices: ['Divide both sides by 2', 'Subtract $2x$ from both sides', 'Add 7 to both sides', 'Subtract 7 from both sides']
  answer: 3
  explanation: |-
    Undo the operations in reverse order: the addition of 7 was done last, so undo it first by subtracting 7. Then divide by 2: $x = 4$.

- id: pre-q-2511
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Solve $-x = 9$.'
  choices: ['$x = -9$', '$x = 9$', '$x = \dfrac{1}{9}$', 'no solution']
  answer: 0
  explanation: |-
    $-x$ means $-1 \cdot x$. Divide (or multiply) both sides by $-1$: $x = -9$.

# --- pre-equations-2 ---
- id: pre-q-2601
  lesson: pre-equations-2
  module_quiz: true
  topic: Multi-step equations
  stem: 'Solve $5x + 3 = 2x + 18$.'
  choices: ['$x = 3$', '$x = 5$', '$x = 3\tfrac{1}{7}$', '$x = 7$']
  answer: 1
  explanation: |-
    Subtract $2x$: $3x + 3 = 18$. Subtract 3: $3x = 15$. Divide: $x = 5$. Check: $28 = 28$. ✓

- id: pre-q-2602
  lesson: pre-equations-2
  module_quiz: true
  topic: Multi-step equations
  stem: 'Solve $3(x - 4) = 2x + 1$.'
  choices: ['$x = 5$', '$x = -11$', '$x = 13$', '$x = 3$']
  answer: 2
  explanation: |-
    Distribute: $3x - 12 = 2x + 1$. Subtract $2x$: $x - 12 = 1$. Add 12: $x = 13$. (5 comes from writing $3x - 4$, distributing to only the first term.)

- id: pre-q-2603
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: 'Solve $\dfrac{x}{4} - \dfrac{1}{2} = \dfrac{3}{4}$.'
  choices: ['$x = 1$', '$x = 1.25$', '$x = 2$', '$x = 5$']
  answer: 3
  explanation: |-
    Multiply every term by the LCD 4: $x - 2 = 3$, so $x = 5$. Check: $\tfrac54 - \tfrac24 = \tfrac34$. ✓

- id: pre-q-2604
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: 'How many solutions does $4(x + 2) = 4x + 8$ have?'
  choices: ['Every number is a solution', 'Exactly one', 'Exactly two', 'None']
  answer: 0
  explanation: |-
    Distributing gives $4x + 8 = 4x + 8$, which is true for every $x$. The equation is an identity.

- id: pre-q-2605
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: 'How many solutions does $2x - 7 = 2(x - 3)$ have?'
  choices: ['Exactly one', 'None', 'Every number is a solution', 'Exactly two']
  answer: 1
  explanation: |-
    The right side is $2x - 6$. Subtracting $2x$ leaves $-7 = -6$, which is never true. There is no solution.

- id: pre-q-2606
  lesson: pre-equations-2
  module_quiz: true
  topic: Equation word problems
  stem: 'The sum of three consecutive integers is 99. What is the largest?'
  choices: ['32', '33', '34', '35']
  answer: 2
  explanation: |-
    $n + (n + 1) + (n + 2) = 99$, so $3n + 3 = 99$, $n = 32$. The integers are 32, 33, 34; the largest is 34.

- id: pre-q-2607
  lesson: pre-equations-2
  topic: Equation word problems
  stem: 'Twice a number, increased by 11, equals five times the number, decreased by 4. What is the number?'
  choices: ['3', '$-5$', '$\tfrac{7}{3}$', '5']
  answer: 3
  explanation: |-
    $2n + 11 = 5n - 4$. Subtract $2n$: $11 = 3n - 4$. Add 4: $15 = 3n$, so $n = 5$. Check: $21 = 21$. ✓

- id: pre-q-2608
  lesson: pre-equations-2
  topic: Equation word problems
  stem: 'A rectangle''s length is 3 m more than its width, and its perimeter is 46 m. What is its width?'
  choices: ['10 m', '21.5 m', '13 m', '11.5 m']
  answer: 0
  explanation: |-
    $2w + 2(w + 3) = 46$, so $4w + 6 = 46$, $4w = 40$, $w = 10$ m (and the length is 13 m).

- id: pre-q-2609
  lesson: pre-equations-2
  topic: Equation word problems
  stem: 'Gym A costs \$20 per month plus \$5 per class. Gym B costs \$50 per month plus \$2 per class. For how many classes per month do they cost the same?'
  choices: ['6', '10', '30', '4.3']
  answer: 1
  explanation: |-
    $20 + 5c = 50 + 2c$. Subtract $2c$: $20 + 3c = 50$. Subtract 20: $3c = 30$, $c = 10$ classes (both cost \$70).

- id: pre-q-2610
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: |-
    A student solved $6 - 2(x + 1) = 10$ like this:

    Step 1: $6 - 2x + 2 = 10$. Step 2: $8 - 2x = 10$. Step 3: $-2x = 2$. Step 4: $x = -1$.

    Where is the first error?
  choices: ['Step 1', 'Step 2', 'Step 3', 'Step 4']
  answer: 0
  explanation: |-
    Distributing $-2$ over $(x + 1)$ gives $-2x - 2$, not $-2x + 2$. Correctly: $6 - 2x - 2 = 10$, so $4 - 2x = 10$, $-2x = 6$, $x = -3$.

- id: pre-q-2611
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: 'Solve $0.3x + 1.5 = 0.8x - 2$.'
  choices: ['$x = 0.7$', '$x = -7$', '$x = 7$', '$x = 3.5$']
  answer: 2
  explanation: |-
    Multiply every term by 10: $3x + 15 = 8x - 20$. Subtract $3x$: $15 = 5x - 20$. Add 20: $35 = 5x$, so $x = 7$.

- id: pre-q-2612
  lesson: pre-equations-2
  topic: Equation word problems
  stem: 'Ana is 4 years older than twice her son''s age. Their ages add to 46. How old is the son?'
  choices: ['21', '12', '15', '14']
  answer: 3
  explanation: |-
    Let $s$ be the son's age; Ana is $2s + 4$. Then $s + 2s + 4 = 46$, so $3s = 42$ and $s = 14$. Ana is 32.

- id: pre-q-2613
  lesson: pre-equations-2
  module_quiz: true
  topic: Formulas
  stem: 'Solve the formula $d = rt$ for $r$.'
  choices: ['$r = dt$', '$r = \dfrac{t}{d}$', '$r = d - t$', '$r = \dfrac{d}{t}$']
  answer: 3
  explanation: |-
    $r$ is multiplied by $t$, so divide both sides by $t$: $r = \dfrac{d}{t}$ (for $t \ne 0$). Check with numbers: 120 miles in 2 hours is $120 \div 2 = 60$ mph. $r = dt$ multiplies instead of dividing, $\tfrac{t}{d}$ divides upside down, and $d - t$ undoes multiplication with subtraction.

- id: pre-q-2614
  lesson: pre-equations-2
  topic: Formulas
  stem: 'Solve the perimeter formula $P = 2l + 2w$ for $l$.'
  choices: ['$l = \dfrac{P - 2w}{2}$', '$l = P - 2w$', '$l = \dfrac{P - w}{2}$', '$l = \dfrac{P}{2} - 2w$']
  answer: 0
  explanation: |-
    Subtract $2w$ from both sides: $P - 2w = 2l$. Divide both sides by 2: $l = \dfrac{P - 2w}{2}$. $P - 2w$ stops before dividing by 2. $\dfrac{P - w}{2}$ subtracts $w$ instead of $2w$. $\dfrac{P}{2} - 2w$ divides only $P$ by 2; the whole side must be divided.

- id: pre-q-2615
  lesson: pre-equations-2
  topic: Formulas
  stem: 'Solve the triangle area formula $A = \tfrac12 bh$ for $h$.'
  choices: ['$h = \dfrac{A}{2b}$', '$h = \dfrac{2A}{b}$', '$h = \dfrac{A}{b}$', '$h = \dfrac{2b}{A}$']
  answer: 1
  explanation: |-
    Multiply both sides by 2 to clear the fraction: $2A = bh$. Divide by $b$: $h = \dfrac{2A}{b}$. Check: a triangle with area 12 and base 4 has height $\tfrac{24}{4} = 6$, and $\tfrac12(4)(6) = 12$. ✓ $\dfrac{A}{2b}$ multiplies by $\tfrac12$ again instead of undoing it. $\dfrac{A}{b}$ ignores the $\tfrac12$. $\dfrac{2b}{A}$ is upside down.

- id: pre-q-2616
  lesson: pre-equations-2
  module_quiz: true
  topic: Formulas
  stem: 'Solve $3x + 2y = 12$ for $y$.'
  choices: ['$y = \dfrac{12 + 3x}{2}$', '$y = 6 - 3x$', '$y = \dfrac{12 - 3x}{2}$', '$y = 12 - \dfrac{3x}{2}$']
  answer: 2
  explanation: |-
    Subtract $3x$ from both sides: $2y = 12 - 3x$. Divide both sides by 2: $y = \dfrac{12 - 3x}{2}$, which is also $y = 6 - \tfrac32 x$. $\dfrac{12 + 3x}{2}$ adds $3x$ instead of subtracting it. $6 - 3x$ divides only the 12 by 2, and $12 - \dfrac{3x}{2}$ divides only the $3x$; every term must be divided.

- id: pre-q-2617
  lesson: pre-equations-2
  topic: Formulas
  stem: 'Solve $F = \tfrac95 C + 32$ for $C$.'
  choices: ['$C = \tfrac59 F - 32$', '$C = \tfrac95(F - 32)$', '$C = \tfrac59(F + 32)$', '$C = \tfrac59(F - 32)$']
  answer: 3
  explanation: |-
    Subtract 32: $F - 32 = \tfrac95 C$. Multiply both sides by $\tfrac59$, the reciprocal of $\tfrac95$: $C = \tfrac59(F - 32)$. Check: $F = 212$ gives $\tfrac59(180) = 100$. ✓ $\tfrac59 F - 32$ undoes the steps in the wrong order. $\tfrac95(F - 32)$ multiplies by $\tfrac95$ again instead of its reciprocal. $\tfrac59(F + 32)$ adds 32 instead of subtracting it.

# --- pre-money-problems ---
- id: pre-q-money-01
  lesson: pre-money-problems
  module_quiz: true
  topic: Money word problems
  stem: 'A jar holds 25 coins, all nickels and dimes, worth \$1.90 in all. How many dimes are in the jar?'
  choices: ['13', '12', '19', '38']
  answer: 0
  explanation: |-
    Let $d$ be the dimes; the nickels are $25 - d$. In cents: $10d + 5(25 - d) = 190$, so $5d + 125 = 190$, $5d = 65$ and $d = 13$. Check: 13 dimes and 12 nickels are worth $130 + 60 = 190$ cents. (12 is the number of nickels, the other count. 19 and 38 divide 190 cents by 10 or by 5, as if every coin were a dime or every coin a nickel.)

- id: pre-q-money-02
  lesson: pre-money-problems
  module_quiz: true
  topic: Money word problems
  stem: 'A box holds 40 coins, all quarters and dimes, worth \$7.30. If $q$ is the number of quarters, which equation models the problem?'
  choices: ['$25q + 10(40 - q) = 7.30$', '$25q + 10(40 - q) = 730$', '$25q + 10q = 730$', '$q + (40 - q) = 730$']
  answer: 1
  explanation: |-
    The dimes are $40 - q$, and each term must be a count times a value, all in cents: $25q + 10(40 - q) = 730$ (it gives $q = 22$). Writing 7.30 on the right mixes cents with dollars. Using $q$ for the dimes too ignores that the counts add to 40. Adding the counts gives 40, not a value in cents.

- id: pre-q-money-03
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'A fair sold 300 tickets: adult tickets at \$10 and child tickets at \$6. Ticket sales were \$2,520. How many child tickets were sold?'
  choices: ['180', '252', '420', '120']
  answer: 3
  explanation: |-
    Let $a$ be the adult tickets; the child tickets are $300 - a$. Then $10a + 6(300 - a) = 2{,}520$, so $4a + 1{,}800 = 2{,}520$, $4a = 720$ and $a = 180$. The child tickets number $300 - 180 = 120$. Check: $1{,}800 + 720 = 2{,}520$. (180 is the adult count, the variable but not the question. 252 and 420 divide the sales by one price, as if every ticket cost the same.)

- id: pre-q-money-04
  lesson: pre-money-problems
  module_quiz: true
  topic: Money word problems
  stem: 'Candy selling for \$3 per pound is mixed with candy selling for \$8 per pound to make 10 pounds of a mix worth \$5 per pound. How many pounds of the \$3 candy are used?'
  choices: ['4', '5', '15', '6']
  answer: 3
  explanation: |-
    Let $x$ be the pounds of \$3 candy; the rest, $10 - x$, is \$8 candy. The mix is worth $10 \times 5 = 50$ dollars: $3x + 8(10 - x) = 50$, so $-5x + 80 = 50$ and $x = 6$. Check: $18 + 32 = 50$. (4 is the amount of \$8 candy. 5 assumes equal amounts, but equal amounts would give \$5.50 a pound. 15 comes from setting the values equal to 5, the price, instead of 50, the mix's total value.)

- id: pre-q-money-05
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'A bag has $q$ quarters and $18 - q$ nickels. Which expression gives the value of the coins in cents?'
  choices: ['$25q + 5(18 - q)$', '$0.25q + 5(18 - q)$', '$q + (18 - q)$', '$25q + 5q$']
  answer: 0
  explanation: |-
    Value is count times value each: $25q$ cents for the quarters and $5(18 - q)$ cents for the nickels. Using 0.25 mixes dollars with cents. $q + (18 - q)$ is the number of coins, 18, not their value. $25q + 5q$ wrongly uses $q$ for the number of nickels.

- id: pre-q-money-06
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'Sam has three times as many dimes as quarters. The coins are worth \$4.95. How many quarters does he have?'
  choices: ['27', '9', '36', '14']
  answer: 1
  explanation: |-
    Let $q$ be the quarters; the dimes number $3q$. In cents: $25q + 10(3q) = 495$, so $55q = 495$ and $q = 9$. Check: 9 quarters and 27 dimes are worth $225 + 270 = 495$ cents. (27 is the number of dimes and 36 the number of coins. About 14 comes from $25q + 10q = 495$, which forgets that there are three times as many dimes.)

- id: pre-q-money-07
  lesson: pre-money-problems
  module_quiz: true
  topic: Money word problems
  stem: 'A concert sold twice as many general tickets at \$15 as VIP tickets at \$40. Ticket sales were \$5,250. How many VIP tickets were sold?'
  choices: ['150', '225', '75', 'about 95.5']
  answer: 2
  explanation: |-
    Let $v$ be the VIP tickets; general tickets number $2v$. Then $40v + 15(2v) = 5{,}250$, so $70v = 5{,}250$ and $v = 75$. Check: 75 VIP and 150 general tickets bring in $3{,}000 + 2{,}250 = 5{,}250$. (150 is the general count and 225 the total. About 95.5 comes from $40v + 15v = 5{,}250$, which leaves out the "twice as many," and a ticket count must be a whole number anyway.)

- id: pre-q-money-08
  lesson: pre-money-problems
  topic: Money word problems
  stem: |-
    A student solves $10d + 25(20 - d) = 395$ for the number of dimes:
    Step 1: $10d + 500 - 25d = 395$
    Step 2: $-15d + 500 = 395$
    Step 3: $-15d = 895$
    Step 4: $d \approx -59.7$
    In which step is the first error?
  choices: ['Step 1', 'Step 2', 'Step 3', 'Step 4']
  answer: 2
  explanation: |-
    Steps 1 and 2 distribute and combine correctly. In Step 3, 500 must be subtracted from both sides, giving $-15d = -105$; the student added it instead. Then $d = 7$. A negative or fractional count of coins is a sign that something went wrong. Step 4 divides correctly, but it starts from the wrong equation.

- id: pre-q-money-09
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'How many liters of juice worth \$2 per liter must be mixed with 5 liters of juice worth \$5 per liter to make a blend worth \$3 per liter?'
  choices: ['5', '25', '15', '10']
  answer: 3
  explanation: |-
    Let $x$ be the liters of \$2 juice. The blend has $x + 5$ liters worth $3(x + 5)$ dollars: $2x + 25 = 3(x + 5)$. So $2x + 25 = 3x + 15$ and $x = 10$. Check: $20 + 25 = 45 = 3 \times 15$. (5 liters of each would give \$3.50 per liter. 25 comes from $2x + 25 = 3x$, which forgets the 5 liters in the blend's amount. 15 is the total liters of blend, not the \$2 juice.)

- id: pre-q-money-10
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'A purse holds dimes, nickels and pennies worth \$1.13. There are twice as many nickels as dimes, and 3 more pennies than nickels. How many dimes are there?'
  choices: ['5', '10', '13', '28']
  answer: 0
  explanation: |-
    Let $d$ be the dimes. Nickels: $2d$. Pennies: $2d + 3$. In cents: $10d + 5(2d) + 1(2d + 3) = 113$, so $22d + 3 = 113$, $22d = 110$ and $d = 5$. Check: 5 dimes, 10 nickels, 13 pennies: $50 + 50 + 13 = 113$. (10 and 13 are the nickel and penny counts; 28 is the number of coins.)

- id: pre-q-money-11
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'Coffee worth \$6 per pound is blended with coffee worth \$10 per pound. Without solving anything, which could be the price per pound of the blend?'
  choices: ['\$16.00', '\$8.50', '\$5.50', '\$10.50']
  answer: 1
  explanation: |-
    A blend's price per pound always lies between the prices of its ingredients, here between \$6 and \$10, so only \$8.50 is possible (it means more of the \$10 coffee). \$16 adds the two prices. \$5.50 and \$10.50 lie outside the range; no blend of \$6 and \$10 coffee can cost less than the cheaper one or more than the dearer one.

- id: pre-q-money-12
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'Solving a coin problem, a student gets $d = 12.5$ dimes. What should the student conclude?'
  choices: ['There are 13 dimes, rounding the answer up', 'There are 12 dimes, rounding the answer down', 'The equation or the arithmetic has an error, since a number of coins must be whole', 'There are 12 dimes plus 5 cents in other coins']
  answer: 2
  explanation: |-
    Counts of coins (or tickets) are whole numbers, so a fractional count means the equation was set up wrong or there is an arithmetic slip. Go back and check it; rounding up or down hides the mistake, and the leftover 5 cents does not fit the problem's own facts.

# --- pre-inequalities ---
- id: pre-q-2701
  lesson: pre-inequalities
  module_quiz: true
  topic: Inequalities
  stem: 'Solve $-4x > 20$.'
  choices: ['$x < -5$', '$x > -5$', '$x > 5$', '$x < 5$']
  answer: 0
  explanation: |-
    Divide both sides by $-4$ and reverse the symbol: $x < -5$. Check $x = -6$: $24 > 20$. ✓

- id: pre-q-2702
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Which inequality matches "at least 18"?'
  choices: ['$x > 18$', '$x \ge 18$', '$x < 18$', '$x \le 18$']
  answer: 1
  explanation: |-
    "At least 18" means 18 or more: $x \ge 18$.

- id: pre-q-2703
  lesson: pre-inequalities
  module_quiz: true
  topic: Inequalities
  stem: 'Solve $2x + 7 \le 1$.'
  choices: ['$x \ge -3$', '$x \le 4$', '$x \le -3$', '$x \ge 4$']
  answer: 2
  explanation: |-
    Subtract 7: $2x \le -6$. Divide by 2 (positive, no flip): $x \le -3$.

- id: pre-q-2704
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'How is $x > -1$ graphed on a number line?'
  choices: ['Closed circle at $-1$, shaded left', 'Closed circle at $-1$, shaded right', 'Open circle at $-1$, shaded left', 'Open circle at $-1$, shaded right']
  answer: 3
  explanation: |-
    The boundary $-1$ is not included (strict $>$), so the circle is open; greater means to the right.

- id: pre-q-2705
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Which value is a solution of $3 - x < 1$?'
  choices: ['3', '2', '1', '0']
  answer: 0
  explanation: |-
    Solve: $-x < -2$, so $x > 2$. Only 3 works. Check: $3 - 3 = 0 < 1$. ✓ (2 gives $1 < 1$, false.)

- id: pre-q-2706
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Solve $5 - 3y \ge 17$.'
  choices: ['$y \ge -4$', '$y \le -4$', '$y \ge 4$', '$y \le 4$']
  answer: 1
  explanation: |-
    Subtract 5: $-3y \ge 12$. Divide by $-3$ and reverse: $y \le -4$.

- id: pre-q-2707
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Solve $3x < -12$.'
  choices: ['$x > -4$', '$x < 4$', '$x < -4$', '$x > 4$']
  answer: 2
  explanation: |-
    Divide by 3, a positive number, so the symbol stays: $x < -4$. The negative on the right side does not cause a flip.

- id: pre-q-2708
  lesson: pre-inequalities
  module_quiz: true
  topic: Inequalities
  stem: 'A phone costs \$40 down plus \$25 per month. Max can spend at most \$340. What is the greatest number of months he can pay?'
  choices: ['13', '15', '14', '12']
  answer: 3
  explanation: |-
    $40 + 25m \le 340$, so $25m \le 300$ and $m \le 12$. At most 12 months.

- id: pre-q-2709
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Which numbers satisfy $-2 < x \le 3$?'
  choices: ['$-1, 0, 3$', '$-2, 0, 3$', '$-1, 3, 4$', '$-3, 0, 2$']
  answer: 0
  explanation: |-
    $x$ must be greater than $-2$ (so $-2$ is excluded) and at most 3 (so 3 is included). Only $-1, 0, 3$ all qualify.

- id: pre-q-2710
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Solve $4(x - 1) > 6x + 2$.'
  choices: ['$x > -3$', '$x < -3$', '$x < 3$', '$x > 3$']
  answer: 1
  explanation: |-
    Distribute: $4x - 4 > 6x + 2$. Subtract $6x$: $-2x - 4 > 2$. Add 4: $-2x > 6$. Divide by $-2$ and reverse: $x < -3$.

- id: pre-q-2711
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Kim''s quiz scores are 72, 88 and 81. What must she score on the fourth quiz for an average of at least 80?'
  choices: ['at least 80', 'at least 241', 'at least 79', 'at least 78']
  answer: 2
  explanation: |-
    $\dfrac{72 + 88 + 81 + s}{4} \ge 80$, so $241 + s \ge 320$ and $s \ge 79$.

# --- pre-graphing-lines ---
- id: pre-q-graph-01
  lesson: pre-graphing-lines
  module_quiz: true
  topic: Coordinate plane
  stem: 'In which quadrant is the point $(-4, -7)$?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant III', 'Quadrant IV']
  answer: 2
  explanation: |-
    Both coordinates are negative: 4 units left and 7 units down from the origin. That is Quadrant III, the lower left. Quadrant I has $(+, +)$, Quadrant II $(-, +)$ and Quadrant IV $(+, -)$; the quadrants are numbered counterclockwise from the upper right.

- id: pre-q-graph-02
  lesson: pre-graphing-lines
  topic: Coordinate plane
  stem: 'Which point lies on the $y$-axis?'
  choices: ['$(-6, 0)$', '$(-6, -6)$', '$(6, -6)$', '$(0, -6)$']
  answer: 3
  explanation: |-
    Points on the $y$-axis have $x = 0$: no move left or right. So $(0, -6)$ is on it, 6 units below the origin. $(-6, 0)$ has $y = 0$, so it is on the $x$-axis instead (the coordinates were read in the wrong order). The other two points are in Quadrants III and IV.

- id: pre-q-graph-03
  lesson: pre-graphing-lines
  module_quiz: true
  topic: Graphing lines
  stem: 'Which ordered pair is a solution of $y = 3x - 4$?'
  choices: ['$(2, 2)$', '$(2, 10)$', '$(0, 4)$', '$(5, 3)$']
  answer: 0
  explanation: |-
    Substitute the $x$-coordinate and see whether the $y$-coordinate comes out: $3(2) - 4 = 2$, so $(2, 2)$ works. $(2, 10)$ adds 4 instead of subtracting it. $(0, 4)$ has the wrong sign: at $x = 0$, $y = -4$. $(5, 3)$ swaps the coordinates of the solution $(3, 5)$; at $x = 5$, $y = 11$.

- id: pre-q-graph-04
  lesson: pre-graphing-lines
  topic: Graphing lines
  stem: 'What is the $x$-intercept of $4x - 5y = 20$?'
  choices: ['$(0, -4)$', '$(5, 0)$', '$(0, 5)$', '$(4, 0)$']
  answer: 1
  explanation: |-
    At the $x$-intercept, $y = 0$: $4x = 20$, so $x = 5$, giving $(5, 0)$. $(0, -4)$ is the $y$-intercept (set $x = 0$: $-5y = 20$). $(0, 5)$ puts the right number on the wrong axis. $(4, 0)$ divides 20 by 5, the size of the coefficient of $y$, instead of by 4, the coefficient of $x$.

- id: pre-q-graph-05
  lesson: pre-graphing-lines
  topic: Graphing lines
  stem: 'What is the $y$-intercept of $3x + 2y = 18$?'
  choices: ['$(6, 0)$', '$(0, 18)$', '$(0, 9)$', '$(0, 6)$']
  answer: 2
  explanation: |-
    At the $y$-intercept, $x = 0$: $2y = 18$, so $y = 9$, giving $(0, 9)$. $(6, 0)$ is the $x$-intercept. $(0, 18)$ forgets to divide by 2, and $(0, 6)$ divides by 3, the coefficient of $x$.

- id: pre-q-graph-06
  lesson: pre-graphing-lines
  module_quiz: true
  topic: Slope
  stem: 'What is the slope of the line through $(1, 2)$ and $(5, 10)$?'
  choices: ['$\tfrac12$', '$-2$', '8', '2']
  answer: 3
  explanation: |-
    Rise over run: $m = \dfrac{10 - 2}{5 - 1} = \dfrac{8}{4} = 2$. $\tfrac12$ is run over rise. $-2$ comes from subtracting in opposite orders on top and bottom. 8 is the rise alone, without dividing by the run.

- id: pre-q-graph-07
  lesson: pre-graphing-lines
  topic: Slope
  stem: 'What is the slope of the line through $(-3, 4)$ and $(3, -2)$?'
  choices: ['$-1$', '1', 'undefined', '$-\tfrac13$']
  answer: 0
  explanation: |-
    $m = \dfrac{-2 - 4}{3 - (-3)} = \dfrac{-6}{6} = -1$. The line falls from left to right, so the slope must be negative, which rules out 1. "Undefined" comes from computing the run as $3 - 3 = 0$, dropping the sign of $-3$. $-\tfrac13$ comes from computing the rise as $-2$ instead of $-2 - 4 = -6$.

- id: pre-q-graph-08
  lesson: pre-graphing-lines
  topic: Slope
  stem: 'Which line has an undefined slope?'
  choices: ['$y = 4$', '$x = 4$', '$y = x$', '$y = -4x$']
  answer: 1
  explanation: |-
    $x = 4$ is a vertical line: all its points have $x = 4$, so the run between any two of them is 0, and dividing by 0 is undefined. $y = 4$ is horizontal with slope 0 (the usual mix-up). $y = x$ and $y = -4x$ have slopes 1 and $-4$.

- id: pre-q-graph-09
  lesson: pre-graphing-lines
  module_quiz: true
  topic: Slope
  stem: 'What are the slope and $y$-intercept of $y = -5x + 7$?'
  choices: ['slope 7, $y$-intercept $-5$', 'slope 5, $y$-intercept 7', 'slope $-5$, $y$-intercept 7', 'slope $-5$, $y$-intercept $-7$']
  answer: 2
  explanation: |-
    In $y = mx + b$, $m$ is the slope and $b$ the $y$-intercept, so $m = -5$ and $b = 7$. Swapping them confuses the roles. The slope keeps its sign: $-5x$ means $m = -5$, not 5. The intercept is $+7$; at $x = 0$, $y = 7$.

- id: pre-q-graph-10
  lesson: pre-graphing-lines
  topic: Slope
  stem: 'What is the slope of the line $4x + 2y = 10$?'
  choices: ['4', '2', '5', '$-2$']
  answer: 3
  explanation: |-
    Solve for $y$: subtract $4x$ to get $2y = -4x + 10$, then divide by 2: $y = -2x + 5$. The slope is $-2$. 4 is the coefficient of $x$ in the original form, which is not the slope. 2 loses the minus sign from moving $4x$. 5 is the $y$-intercept.

- id: pre-q-graph-11
  lesson: pre-graphing-lines
  topic: Graphing lines
  stem: |-
    The table lists three points on a line. Which equation does the line have?
    $\begin{array}{c|ccc} x & 0 & 2 & 4 \\ \hline y & 3 & 7 & 11 \end{array}$
  choices: ['$y = 2x + 3$', '$y = 4x + 3$', '$y = 3x + 2$', '$y = \tfrac12 x + 3$']
  answer: 0
  explanation: |-
    At $x = 0$, $y = 3$, so $b = 3$. Each time $x$ goes up 2, $y$ goes up 4, so $m = \tfrac42 = 2$: $y = 2x + 3$. Check: $2(4) + 3 = 11$. $y = 4x + 3$ uses the rise without dividing by the run of 2. $y = 3x + 2$ swaps $m$ and $b$. $y = \tfrac12 x + 3$ divides run by rise.

- id: pre-q-graph-12
  lesson: pre-graphing-lines
  topic: Slope
  stem: 'A plumber''s charge in dollars for a job lasting $x$ hours is $y = 45x + 60$. What does the 45 represent?'
  choices: ['The fee charged before any work is done', 'The charge per hour of work', 'The total charge for a one-hour job', 'The number of hours worked']
  answer: 1
  explanation: |-
    The slope is a rate: each extra hour adds \$45, so 45 is dollars per hour. The 60 is the $y$-intercept, the charge at $x = 0$ hours. A one-hour job costs $45 + 60 = 105$ dollars, not 45. The number of hours is the variable $x$.

- id: pre-q-graph-13
  lesson: pre-graphing-lines
  topic: Graphing lines
  stem: 'A line has $y$-intercept $-3$ and passes through $(2, 5)$. What is its equation?'
  choices: ['$y = 4x + 3$', '$y = 8x - 3$', '$y = 4x - 3$', '$y = -3x + 2$']
  answer: 2
  explanation: |-
    The line passes through $(0, -3)$ and $(2, 5)$: $m = \dfrac{5 - (-3)}{2 - 0} = \dfrac{8}{2} = 4$, and $b = -3$, so $y = 4x - 3$. Check: $4(2) - 3 = 5$. ✓ $y = 4x + 3$ drops the sign of the intercept. $y = 8x - 3$ uses the rise without dividing by the run. $y = -3x + 2$ puts the intercept where the slope goes and the $x$-coordinate where the intercept goes.
