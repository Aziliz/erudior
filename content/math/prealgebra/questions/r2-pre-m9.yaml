# Round 2: pre-m9 (Data and probability). Core: q01-q16. Honors: h01-h29.

# ---------- Lesson 36: Mean, median, mode and range ----------
- id: pre-m9-r2-q01
  lesson: pre-stats
  module_quiz: true
  topic: Measures of center
  type: text
  stem: 'Find the median of 15, 4, 11, 8, 20, 6. Give only the number.'
  accept: ['9.5']
  explanation: |-
    Order first: 4, 6, 8, 11, 15, 20. With six values there are two middle ones, the 3rd and 4th: 8 and 11. The median is their mean, $\tfrac{8 + 11}{2} = 9.5$.

- id: pre-m9-r2-q02
  lesson: pre-stats
  topic: Measures of center
  type: order
  stem: 'For the data 9, 3, 20, 5, 3, put these measures in order from smallest value to largest value.'
  items: [Mode, Median, Mean, Range]
  explanation: |-
    Ordered data: 3, 3, 5, 9, 20. The mode is 3 (it appears twice). The median is the middle value, 5. The mean is $40 \div 5 = 8$, pulled up by the 20. The range is $20 - 3 = 17$. So mode (3) < median (5) < mean (8) < range (17).

- id: pre-m9-r2-q03
  lesson: pre-stats
  topic: Measures of center
  type: match
  stem: 'Match each situation to the measure that best describes it.'
  pairs:
    - ['A typical home price on a street with one mansion', Median]
    - ['The most popular ice cream flavor', Mode]
    - ['The average of five quiz scores with no outliers', Mean]
    - ['How spread out a week of temperatures was', Range]
  distractors: [Outlier]
  explanation: |-
    The mansion is an outlier, so the median, which resists outliers, describes a typical price. Flavors are categories, and the mode is the only measure of center that works for categories. With no outliers, the mean uses every score and is the usual average. Spread is measured by the range (largest minus smallest); the other three describe the center.

- id: pre-m9-r2-q04
  lesson: pre-stats
  topic: Measures of center
  stem: 'Which statements are true for the data set 6, 4, 9, 2, 4? Select all that apply.'
  choices: ['The mean is 5', 'The median is 9', 'The mode is 4', 'The range is 7', 'The mean is one of the data values']
  answer: [0, 2, 3]
  explanation: |-
    Ordered: 2, 4, 4, 6, 9. Mean: $25 \div 5 = 5$. Median: the middle value, 4 (9 is the middle of the unordered list). Mode: 4, which appears twice. Range: $9 - 2 = 7$. The mean, 5, is not in the data set, which is common.

- id: pre-m9-r2-q05
  lesson: pre-stats
  module_quiz: true
  topic: Measures of center
  type: label
  stem: 'The dot plot shows the data 1, 7, 8, 9, 9, 10. Name each numbered part.'
  image: {src: images/pre-m9-center-spread-blank.svg, alt: 'A dot plot of 1, 7, 8, 9, 9, 10 on a number line from 0 to 11, with five numbered parts: the dot at 1, a triangle under the line at about 7.3, a diamond under the line at 8.5, the stack of two dots at 9, and a bracket above the dots running from 1 to 10.'}
  labels:
    - {x: 16.2, y: 51.3, text: Outlier}
    - {x: 64.3, y: 82.7, text: Mean}
    - {x: 73.1, y: 82.7, text: Median}
    - {x: 76.9, y: 34.0, text: Mode}
    - {x: 50.3, y: 20.7, text: Range}
  distractors: [Sum of the values, Number of values]
  explanation: |-
    The 1 is far below the other values: an outlier. The mean is $44 \div 6 \approx 7.3$, marked by the triangle; the outlier pulls it below the median. The median is the mean of the two middle values 8 and 9, which is 8.5, the diamond. The mode is 9, where the dots stack highest. The bracket from 1 to 10 shows the range, $10 - 1 = 9$.

- id: pre-m9-r2-q06
  lesson: pre-stats
  topic: Measures of center
  type: text
  stem: 'The mean of four numbers is 15. Three of them are 12, 20 and 9. The fourth number is ___.'
  accept: ['19']
  explanation: |-
    Sum = mean × count $= 15 \times 4 = 60$. The three known numbers add to $12 + 20 + 9 = 41$, so the fourth is $60 - 41 = 19$.

# ---------- Lesson 37: Reading tables and graphs ----------
