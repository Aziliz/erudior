  lesson: pre-graphs
  module_quiz: true
  topic: Tables and graphs
  type: label
  stem: 'Name each numbered part of this bar graph.'
  image: {src: images/pre-m9-graph-parts-blank.svg, alt: 'A bar graph titled Favorite lunch, with a vertical axis labeled Number of students and a scale from 0 to 20, bars for Pizza, Tacos, Salad and Soup, and a horizontal axis labeled Lunch choice. Six parts are numbered.'}
  labels:
    - {x: 59.2, y: 9.0, text: Title}
    - {x: 10.3, y: 50.0, text: Vertical axis label}
    - {x: 21.7, y: 35.7, text: Scale}
    - {x: 33.5, y: 52.9, text: Bar}
    - {x: 67.7, y: 83.1, text: Category label}
    - {x: 59.2, y: 91.7, text: Horizontal axis label}
  distractors: [Sector, Legend]
  explanation: |-
    The title (Favorite lunch) says what the graph is about. The vertical axis label (Number of students) says what the heights measure, and the scale (0, 5, 10, 15, 20) gives the values. Each bar's height shows an amount, and the category label under it (here, Salad) names its category. The horizontal axis label (Lunch choice) says what the categories are. Sectors belong to circle graphs, and this graph has no legend.

- id: pre-m9-r2-q08
  lesson: pre-graphs
  topic: Tables and graphs
  type: match
  stem: 'Match each set of data to the display that fits it best.'
  pairs:
    - ['How a city''s average temperature changed month by month over a year', Line graph]
    - ['The share of a budget spent on each expense', Circle graph]
    - ['The number of members in each of five clubs', Bar graph]
    - ['Exact prices, weights and sizes of 20 products', Table]
  explanation: |-
    Change over time (month by month) calls for a line graph, whose rising and falling segments show the trend. Shares of one whole that add to 100% suit a circle graph. Comparing amounts across categories (clubs) is what bar graphs do. Several variables with exact values belong in a table.

- id: pre-m9-r2-q09
  lesson: pre-graphs
  module_quiz: true
  topic: Tables and graphs
  type: text
  stem: 'A frequency table shows the goals a team scored in 20 games: 0 goals in 4 games, 1 goal in 6 games, 2 goals in 5 games, 3 goals in 3 games and 4 goals in 2 games. The mean number of goals per game is ___.'
  accept: ['1.65']
  explanation: |-
    Total goals: $0(4) + 1(6) + 2(5) + 3(3) + 4(2) = 0 + 6 + 10 + 9 + 8 = 33$. There are $4 + 6 + 5 + 3 + 2 = 20$ games. Mean: $33 \div 20 = 1.65$ goals per game.

- id: pre-m9-r2-q10
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'A bar graph shows books sold: Monday 25, Tuesday 40, Wednesday 15, Thursday 30, Friday 35. Which statements are true? Select all that apply.'
  choices: ['Tuesday''s sales were more than twice Wednesday''s', 'Monday had the fewest sales', 'The mean is 29 books per day', 'The median is 25 books', 'The range is 25 books']
  answer: [0, 2, 4]
  explanation: |-
    Twice Wednesday's sales is 30, and Tuesday sold 40, so that is true. Wednesday (15), not Monday, had the fewest. Mean: $(25 + 40 + 15 + 30 + 35) \div 5 = 145 \div 5 = 29$. Ordered: 15, 25, 30, 35, 40, so the median is 30, not 25. Range: $40 - 15 = 25$.

- id: pre-m9-r2-q11
  lesson: pre-graphs
  topic: Tables and graphs
  type: order
  stem: 'In a survey, 18 people walk to work, 30 drive and 12 bike. Put the steps for drawing the "walk" sector of a circle graph in order.'
  items:
    - 'Add the counts to get the total: 60'
    - 'Divide the walk count by the total: 18 ÷ 60 = 0.3'
    - 'Multiply by 360°: 0.3 × 360° = 108°'
    - 'Draw a sector with a 108° angle at the center'
  explanation: |-
    Each step uses the result of the one before: the total (60) is needed for the fraction, the fraction (0.3, or 30%) is needed for the angle, and the angle (108°) is needed to draw the sector.

# ---------- Lesson 38: Simple probability ----------
- id: pre-m9-r2-q12
  lesson: pre-probability
  module_quiz: true
  topic: Probability
  type: label
  stem: 'A fair six-sided die is rolled once. Place each event at its probability on the scale.'
  image: {src: images/pre-m9-prob-scale-blank.svg, alt: 'A probability scale from 0 to 1 with five numbered points at 0, 1/6, 1/2, 5/6 and 1. The words impossible, equally likely and certain are under 0, 1/2 and 1.'}
  labels:
    - {x: 10.0, y: 65.4, text: Roll a 7}
    - {x: 23.3, y: 65.4, text: Roll a 6}
    - {x: 50.0, y: 65.4, text: Roll an even number}
    - {x: 76.7, y: 65.4, text: Roll a number less than 6}
    - {x: 90.0, y: 65.4, text: Roll a number less than 7}
  distractors: [Roll a 1 or a 2, Roll a 5 or a 6]
  explanation: |-
    A die has no 7, so rolling one is impossible (0). One face of six is a 6: $\tfrac16$. Three faces (2, 4, 6) are even: $\tfrac36 = \tfrac12$. Five faces (1 to 5) are less than 6: $\tfrac56$. Every face is less than 7, so that is certain (1). "A 1 or a 2" and "a 5 or a 6" would each be $\tfrac26 = \tfrac13$, which has no point on this scale.

- id: pre-m9-r2-q13
  lesson: pre-probability
  module_quiz: true
  topic: Probability
  type: text
  stem: 'Two fair dice are rolled. The probability that the sum is 8 is ___. Give a fraction.'
  accept: ['5/36']
  explanation: |-
    There are $6 \times 6 = 36$ equally likely outcomes. Sums of 8: (2,6), (3,5), (4,4), (5,3), (6,2), which is 5 outcomes. $P = \tfrac{5}{36}$.

- id: pre-m9-r2-q14
  lesson: pre-probability
  topic: Probability
  type: match
  stem: 'A bag holds 2 red, 3 blue and 5 green marbles. One is drawn at random. Match each event to its probability.'
  pairs:
    - ['$P(\text{red})$', '1/5']
    - ['$P(\text{blue})$', '3/10']
    - ['$P(\text{not green})$', '1/2']
    - ['$P(\text{yellow})$', '0']
  distractors: ['2/3', '3/7']
  explanation: |-
    There are $2 + 3 + 5 = 10$ marbles. Red: $\tfrac{2}{10} = \tfrac15$. Blue: $\tfrac{3}{10}$. Not green: $1 - \tfrac{5}{10} = \tfrac12$. There are no yellow marbles, so that event is impossible: 0. ($\tfrac37$ would come from dividing blue by the 7 non-blue marbles, the wrong total.)

- id: pre-m9-r2-q15
  lesson: pre-probability
  topic: Probability
  stem: 'Which pairs of events are independent? Select all that apply.'
  choices: ['Flipping a coin, then rolling a die', 'Drawing a card, putting it back, shuffling, and drawing again', 'Drawing two marbles from a bag without putting the first one back', 'Two flips of the same fair coin', 'Choosing two different students from a class, one after the other']
  answer: [0, 1, 3]
  explanation: |-
    A coin and a die don't affect each other, and a coin has no memory between flips. Putting the card back and shuffling restores the deck, so the second draw is like the first. Without replacement, the first draw changes what is left, so those events are dependent, and choosing two different students is the same situation: the first student can't be chosen again.

- id: pre-m9-r2-q16
  lesson: pre-probability
  topic: Probability
  type: order
  stem: 'Two fair dice are rolled. Put these sums in order from least likely to most likely.'
  items: [Sum of 2, Sum of 11, Sum of 4, Sum of 8, Sum of 7]
  explanation: |-
    Count the outcomes out of 36: a sum of 2 has 1 (1,1); 11 has 2; 4 has 3; 8 has 5; and 7 has 6, the most of any sum.

# ---------- Honors: Measuring spread (38h1) ----------
- id: pre-m9-r2-h01
  lesson: pre-m9-h-spread
  topic: Mean absolute deviation
  stem: 'Find the mean absolute deviation (MAD) of 4, 6, 8, 10, 12.'
  choices: ['2.4', '0', '3', '8']
  answer: 0
  explanation: |-
    Mean: $40 \div 5 = 8$. Distances from 8: 4, 2, 0, 2, 4, which add to 12. MAD $= 12 \div 5 = 2.4$. (0 is the average of the signed deviations, which is always 0; 3 divides by 4 instead of 5; 8 is the range.)

- id: pre-m9-r2-h02
  lesson: pre-m9-h-spread
  topic: Mean absolute deviation
  type: text
  stem: 'The MAD of 3, 5, 7, 13 is ___.'
  accept: ['3']
  explanation: |-
    Mean: $28 \div 4 = 7$. Distances from 7: 4, 2, 0, 6, which add to 12. MAD $= 12 \div 4 = 3$.

- id: pre-m9-r2-h03
  lesson: pre-m9-h-spread
  topic: Mean absolute deviation
  stem: 'Why does the MAD use the absolute values of the deviations instead of the deviations themselves?'
  choices: ['Because data values are always positive', 'Because the deviations always add to 0, so their average says nothing', 'Because absolute values make the MAD equal to the range', 'Because absolute values remove the effect of outliers']
  answer: 1
  explanation: |-
    The mean is the balance point: the deviations above it cancel the ones below, so they always add to 0 and their average is always 0. Distances (absolute values) don't cancel. Data can be negative, the MAD is not the range, and an outlier still has a large distance, so it still pulls the MAD.

- id: pre-m9-r2-h04
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'Find the five-number summary (minimum, Q1, median, Q3, maximum) of 15, 7, 2, 12, 8, 5, 10, using the median-of-halves method.'
  choices: ['2, 6, 8, 11, 15', '2, 5, 8.4, 12, 15', '2, 5, 8, 12, 15', '2, 7, 8, 10, 15']
  answer: 2
  explanation: |-
    Ordered: 2, 5, 7, 8, 10, 12, 15. The median is the 4th value, 8. Leave it out: lower half 2, 5, 7 gives Q1 = 5, and upper half 10, 12, 15 gives Q3 = 12. (6 and 11 come from wrongly putting the 8 in both halves; 8.4 is the mean, not the median; 7 and 10 are just the neighbors of the median.)

- id: pre-m9-r2-h05
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  type: text
  stem: 'The interquartile range of 11, 3, 9, 14, 6, 20, 8, 17 is ___.'
  accept: ['8.5']
  explanation: |-
    Ordered: 3, 6, 8, 9, 11, 14, 17, 20. Eight values split evenly. Lower half 3, 6, 8, 9: Q1 $= \tfrac{6 + 8}{2} = 7$. Upper half 11, 14, 17, 20: Q3 $= \tfrac{14 + 17}{2} = 15.5$. IQR $= 15.5 - 7 = 8.5$.

- id: pre-m9-r2-h06
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'A data set has Q1 = 20 and Q3 = 32. Which of these values would the 1.5 × IQR rule flag as an outlier?'
  choices: ['49', '3', '35', '1']
  answer: 3
  explanation: |-
    IQR $= 32 - 20 = 12$ and $1.5 \times 12 = 18$. Fences: $20 - 18 = 2$ and $32 + 18 = 50$. Only 1 is outside the fences. 49 and 3 are close to the fences but inside them, and 35 is well inside.

- id: pre-m9-r2-h07
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'Which statements can you conclude from this box plot of test scores? Select all that apply.'
  image: {src: images/pre-m9-h-boxplot.svg, alt: 'A box plot of test scores: minimum 52, Q1 68, median 75, Q3 84, maximum 97, with IQR 16 marked under the box.'}
  choices: ['About half of the scores are between 68 and 84', 'The mean score is 75', 'The IQR is 16', 'About 25% of the scores are above 84', 'More scores are between 84 and 97 than between 68 and 75']
  answer: [0, 2, 3]
  explanation: |-
    The box (68 to 84) holds the middle half, and its length is $84 - 68 = 16$. Each of the four sections holds about a quarter of the scores, so about 25% are above Q3 = 84. A box plot shows the median (75), not the mean. The section from 84 to 97 is longer than the one from 68 to 75, but both hold about 25%: a longer section means more spread, not more scores.

- id: pre-m9-r2-h08
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  type: label
  stem: 'Name each numbered part of this box plot.'
  image: {src: images/pre-m9-h-boxplot-blank.svg, alt: 'A box plot above a number line from 50 to 100, with a bracket under the box. Six parts are numbered: the left end of the left whisker, the left edge of the box, the line inside the box, the right edge of the box, the right end of the right whisker, and the bracket under the box.'}
  labels:
    - {x: 10.3, y: 50.0, text: Minimum}
    - {x: 37.9, y: 44.0, text: First quartile (Q1)}
    - {x: 50.0, y: 44.0, text: Median}
    - {x: 65.5, y: 44.0, text: Third quartile (Q3)}
    - {x: 87.9, y: 50.0, text: Maximum}
    - {x: 58.6, y: 66.7, text: Interquartile range}
  distractors: [Mean, Range]
  explanation: |-
    The whiskers end at the minimum (left) and maximum (right). The box runs from Q1 (left edge) to Q3 (right edge), and the line inside it is the median. The bracket spans only the box, so it is the IQR, Q3 − Q1. The range would span whisker end to whisker end, and a box plot does not show the mean.

- id: pre-m9-r2-h09
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  type: order
  stem: 'Put the steps for finding the IQR of a data set in order.'
  items:
    - Put the data in order
    - Find the median
    - Split the data into a lower half and an upper half
    - Find Q1 and Q3, the medians of the two halves
    - Subtract Q1 from Q3
  explanation: |-
    The median can only be found once the data are ordered, the halves are defined by the median, the quartiles are the medians of the halves, and the IQR is their difference.

- id: pre-m9-r2-h10
  lesson: pre-m9-h-spread
  topic: Mean absolute deviation
  type: match
  stem: 'Match each measure to its description.'
  pairs:
    - [Mean absolute deviation, Average distance of the values from the mean]
    - [Interquartile range, Spread of the middle half of the data]
    - [Range, Distance from the smallest value to the largest]
    - [First quartile, About a quarter of the data lie below it]
  distractors: [About three quarters of the data lie below it]
  explanation: |-
    The MAD averages the distances from the mean. The IQR, Q3 − Q1, is the width of the middle half. The range is maximum − minimum. Q1 has about a quarter of the data below it; the extra description fits Q3.

- id: pre-m9-r2-h11
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'One extreme value is added to a large data set. Which measure of spread is likely to change the least?'
  choices: ['The IQR', 'The range', 'The MAD', 'The largest distance from the mean']
  answer: 0
  explanation: |-
    The IQR depends only on the middle half of the ordered data, so it is resistant: one extreme value barely moves Q1 and Q3. The range and the largest distance change by the full amount of the extreme value, and the MAD uses every value's distance, so it is pulled up too.

- id: pre-m9-r2-h12
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'Which statement is supported by these box plots?'
  image: {src: images/pre-m9-h-two-boxplots.svg, alt: 'Two box plots on one number line from 40 to 100. Class A: minimum 55, Q1 68, median 72, Q3 78, maximum 90. Class B: minimum 45, Q1 62, median 78, Q3 87, maximum 99.'}
  choices: ['Class A has the higher median', 'Class B has the higher median, but Class A''s middle half is less spread out', 'Class B''s IQR is smaller than Class A''s', 'Class B has more students than Class A']
  answer: 1
  explanation: |-
    Medians: 72 for A, 78 for B. IQRs: $78 - 68 = 10$ for A and $87 - 62 = 25$ for B, so A's middle half is tighter. A box plot shows positions, not how many values there are, so it can't tell you which class is larger.

- id: pre-m9-r2-h13
  lesson: pre-m9-h-spread
  topic: Mean absolute deviation
  stem: 'Two runners both average 60 seconds per lap. Runner P''s lap times have a MAD of 0.8 seconds; Runner Q''s have a MAD of 3.5 seconds. What does this tell you?'
  choices: ['Runner Q is faster', 'Runner P is faster', 'Runner P''s lap times are more consistent', 'Their lap times vary by the same amount']
  answer: 2
  explanation: |-
    The means are equal, so neither is faster on average. The MAD is the typical distance from the mean: P's laps are typically about 0.8 s from 60 s, while Q's are typically about 3.5 s away. P is more consistent.

- id: pre-m9-r2-h14
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  stem: 'The data set 5, 7, 8, 10, 12 has an outlier, 40, added. What happens to the range and the IQR (median-of-halves method)?'
  choices: ['Both increase by about 28', 'The IQR increases a lot, but the range barely changes', 'Neither changes, because 40 is only one value', 'The range increases from 7 to 35, but the IQR stays 5']
  answer: 3
  explanation: |-
    Before: range $12 - 5 = 7$; halves 5, 7 and 10, 12 give Q1 = 6, Q3 = 11, IQR = 5. After: 5, 7, 8, 10, 12, 40 has range $40 - 5 = 35$; halves 5, 7, 8 and 10, 12, 40 give Q1 = 7, Q3 = 12, IQR = 5. The range jumps; the IQR doesn't move.

- id: pre-m9-r2-h15
  lesson: pre-m9-h-spread
  topic: Quartiles and box plots
  type: text
  stem: 'A data set has Q1 = 40 and Q3 = 56. The upper fence of the 1.5 × IQR rule is ___.'
  accept: ['80']
  explanation: |-
    IQR $= 56 - 40 = 16$, and $1.5 \times 16 = 24$. Upper fence: $56 + 24 = 80$. Values above 80 would be flagged as outliers.

# ---------- Honors: Tree diagrams and expected value (38h2) ----------
- id: pre-m9-r2-h16
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  stem: 'A bag holds 4 red and 6 blue marbles. Two are drawn without replacement. What is the probability that both are red?'
  choices: ['$\dfrac{4}{25}$', '$\dfrac{2}{15}$', '$\dfrac{11}{15}$', '$\dfrac{2}{5}$']
  answer: 1
  explanation: |-
    $\tfrac{4}{10} \times \tfrac{3}{9} = \tfrac{12}{90} = \tfrac{2}{15}$. After a red is taken, 3 of the remaining 9 are red. ($\tfrac{4}{25} = \tfrac{4}{10} \times \tfrac{4}{10}$ treats the draws as if the first marble were put back, $\tfrac{11}{15}$ adds $\tfrac{4}{10}$ and $\tfrac39$ instead of multiplying, and $\tfrac25$ is only the first draw.)

- id: pre-m9-r2-h17
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  type: text
  stem: 'A player makes 80% of her free throws, and her two shots are independent. The probability that she makes exactly one of two shots is ___. Give a decimal.'
  accept: ['0.32', '32%']
  explanation: |-
    Two paths give exactly one make: make then miss, $0.8 \times 0.2 = 0.16$, and miss then make, $0.2 \times 0.8 = 0.16$. Add the paths: $0.16 + 0.16 = 0.32$.

- id: pre-m9-r2-h18
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  stem: 'A fair die is rolled twice. What is the probability of at least one 6?'
  choices: ['$\dfrac{1}{3}$', '$\dfrac{1}{36}$', '$\dfrac{25}{36}$', '$\dfrac{11}{36}$']
  answer: 3
  explanation: |-
    Use the complement. No 6 on either roll: $\tfrac56 \times \tfrac56 = \tfrac{25}{36}$. So $P(\text{at least one 6}) = 1 - \tfrac{25}{36} = \tfrac{11}{36}$. ($\tfrac13 = \tfrac16 + \tfrac16$ counts the outcome (6, 6) twice; $\tfrac{1}{36}$ is two 6s; $\tfrac{25}{36}$ is no 6s.)

- id: pre-m9-r2-h19
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  type: label
  stem: 'A bag holds 5 red and 3 blue marbles, and two are drawn without replacement. Give the probability on each numbered branch.'
  image: {src: images/pre-m9-h-tree-blank.svg, alt: 'A tree diagram with first-draw branches to Red and Blue, and from each of those, second-draw branches to Red and Blue. The six branches are numbered: 1 first draw red, 2 red then red, 3 red then blue, 4 first draw blue, 5 blue then red, 6 blue then blue.'}
  labels:
    - {x: 15.2, y: 38.8, text: 5/8}
    - {x: 42.5, y: 21.2, text: 4/7}
    - {x: 42.5, y: 33.8, text: 3/7}
    - {x: 15.2, y: 61.2, text: 3/8}
    - {x: 42.5, y: 66.2, text: 5/7}
    - {x: 42.5, y: 78.8, text: 2/7}
  distractors: [4/8, 2/8]
  explanation: |-
    First draw: 5 of 8 are red, 3 of 8 blue. After a red is drawn, 7 marbles remain, 4 red and 3 blue. After a blue is drawn, 7 remain, 5 red and 2 blue. The denominators drop to 7 because the first marble is not replaced; the branches from each point add to 1.

- id: pre-m9-r2-h20
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  type: order
  stem: 'A bag holds 5 red and 3 blue marbles, and two are drawn without replacement. Put these events in order from least likely to most likely.'
  items: [Both blue, Both red, One of each color, At least one red]
  explanation: |-
    Over 56: both blue $\tfrac38 \times \tfrac27 = \tfrac{6}{56}$; both red $\tfrac58 \times \tfrac47 = \tfrac{20}{56}$; one of each $\tfrac{15}{56} + \tfrac{15}{56} = \tfrac{30}{56}$; at least one red $1 - \tfrac{6}{56} = \tfrac{50}{56}$.

- id: pre-m9-r2-h21
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  type: match
  stem: 'Match each kind of question to the rule that answers it.'
  pairs:
    - ['"A and B" for independent events', Multiply the two probabilities]
    - ['"A and B" when drawing without replacement', Multiply using the updated second probability]
    - ['An event made of several tree paths', Add the path probabilities]
    - ['"At least one"', Subtract the probability of none from 1]
  distractors: [Add the first-stage probabilities]
  explanation: |-
    Independent: $P(A) \times P(B)$. Without replacement, the second factor is the probability after the first draw. Separate paths can't happen together, so their probabilities add. "At least one" is the complement of "none."

- id: pre-m9-r2-h22
  lesson: pre-m9-h-expected
  topic: Expected value
  stem: 'The expected value of one roll of a fair die is 3.5. What does this mean?'
  choices: ['Over many rolls, the average roll will be close to 3.5', 'Rolling 3 or 4 is more likely than rolling 1 or 6', 'A roll of 3.5 is the most likely result', 'About half the rolls will land on exactly 3.5']
  answer: 0
  explanation: |-
    $\tfrac{1 + 2 + 3 + 4 + 5 + 6}{6} = 3.5$ is a long-run average. A die can never show 3.5, and all six faces are equally likely.

- id: pre-m9-r2-h23
  lesson: pre-m9-h-expected
  topic: Expected value
  type: text
  stem: 'A game costs \$4. A spinner with four equal sections pays \$0, \$0, \$2 or \$10. The expected net gain per play is ___ dollars (negative for a loss). Give only the number.'
  accept: ['-1', '−1', '-$1', '-$1.00']
  explanation: |-
    Expected prize: $0 \cdot \tfrac14 + 0 \cdot \tfrac14 + 2 \cdot \tfrac14 + 10 \cdot \tfrac14 = \tfrac{12}{4} = 3$ dollars. Subtract the cost: $3 - 4 = -1$, a loss of \$1 per play on average.

- id: pre-m9-r2-h24
  lesson: pre-m9-h-expected
  topic: Expected value
  stem: 'A club sells 1,000 raffle tickets at \$5 each. There is one \$1,000 prize and two \$250 prizes. What is the expected net gain for one ticket?'
  choices: ['\$1.50', '−\$5.00', '−\$3.50', '−\$4.00']
  answer: 2
  explanation: |-
    Expected prize: $\tfrac{1{,}000 + 2 \times 250}{1{,}000} = \tfrac{1{,}500}{1{,}000} = 1.50$ dollars. Net: $1.50 - 5.00 = -3.50$. (\$1.50 forgets to subtract the ticket price; −\$4.00 counts only the \$1,000 prize.)

- id: pre-m9-r2-h25
  lesson: pre-m9-h-expected
  topic: Expected value
  stem: 'In each game you pay the price, then receive the prize if you win (the price is not returned). Which games are fair? Select all that apply.'
  choices: ['Pay \$1; flip a coin; heads pays \$2', 'Pay \$1; roll a die; a 6 pays \$6', 'Pay \$2; roll a die; a 6 pays \$6', 'Pay \$1; flip two coins; two heads pays \$4', 'Pay \$3; draw one of 10 numbered cards; the 1 pays \$10']
  answer: [0, 1, 3]
  explanation: |-
    A game is fair when the expected prize equals the price. Coin: $\tfrac12 \times 2 = 1$, price 1. Die: $\tfrac16 \times 6 = 1$, price 1. The same die game at price 2 loses 1 per play on average. Two heads: $\tfrac14 \times 4 = 1$, price 1. Cards: $\tfrac{1}{10} \times 10 = 1$, but the price is 3.

- id: pre-m9-r2-h26
  lesson: pre-m9-h-expected
  topic: Expected value
  stem: 'A carnival game has an expected net gain of −\$0.25 per play. Which statement is correct?'
  choices: ['Every play loses exactly 25 cents', 'Over many plays, the average result will be close to a loss of 25 cents per play', 'After several losses in a row, a win becomes more likely', 'No player can ever come out ahead']
  answer: 1
  explanation: |-
    Expected value is a long-run average (the law of large numbers). Single plays win or lose different amounts, and some players will come out ahead in the short run. Past losses don't make a win "due"; that is the gambler's fallacy.

- id: pre-m9-r2-h27
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  stem: 'A bag holds 6 red and 4 blue marbles. The first marble drawn is red and is not put back. What is the probability that the second marble is red?'
  choices: ['$\dfrac{6}{10}$', '$\dfrac{5}{10}$', '$\dfrac{5}{9}$', '$\dfrac{6}{9}$']
  answer: 2
  explanation: |-
    After one red is removed, 9 marbles remain and 5 are red: $\tfrac59$. ($\tfrac{6}{10}$ ignores the first draw; $\tfrac{5}{10}$ updates the reds but not the total; $\tfrac69$ updates the total but not the reds.)

- id: pre-m9-r2-h28
  lesson: pre-m9-h-expected
  topic: Expected value
  stem: 'The number of texts a person gets in an hour is 0, 1, 2 or 3, with probabilities 0.1, 0.3, 0.4 and 0.2. What is the expected number of texts per hour?'
  choices: ['1.7', '1.5', '2', '0.25']
  answer: 0
  explanation: |-
    $0(0.1) + 1(0.3) + 2(0.4) + 3(0.2) = 0 + 0.3 + 0.8 + 0.6 = 1.7$. (1.5 is the plain mean of 0, 1, 2, 3, which ignores the probabilities; 2 is the most likely value; 0.25 is the mean of the probabilities.)

- id: pre-m9-r2-h29
  lesson: pre-m9-h-expected
  topic: Tree diagrams
  type: text
  stem: 'A jar holds 3 green and 2 yellow candies. Two are taken without replacement. The probability that both are yellow is ___. Give a fraction.'
  accept: ['1/10']
  explanation: |-
    $\tfrac25 \times \tfrac14 = \tfrac{2}{20} = \tfrac{1}{10}$. After one yellow is taken, 1 of the 4 remaining candies is yellow.
