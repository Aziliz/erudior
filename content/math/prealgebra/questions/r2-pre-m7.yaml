# Round 2, module pre-m7: new question types for the core lessons (q) and the honors lessons (h)
# --- pre-expressions ---
- id: pre-m7-r2-q01
  lesson: pre-expressions
  module_quiz: true
  type: label
  topic: Expressions
  stem: 'Name the numbered parts of the expression $3x^2 - 5x + 8$.'
  image: {src: images/pre-m7-expression-parts-blank.svg, alt: 'The expression 3x squared minus 5x plus 8, with brackets under its three pieces. Numbered pointers lead to the 3, to the x after it, to the small raised 2, to the 8, and to the bracket under minus 5x.'}
  labels:
    - {x: 12.5, y: 23.6, text: Coefficient}
    - {x: 33.6, y: 23.6, text: Variable}
    - {x: 53.9, y: 23.6, text: Exponent}
    - {x: 81.2, y: 23.6, text: Constant term}
    - {x: 45.2, y: 83.3, text: Term}
  distractors: [Equation, Like terms]
  explanation: |-
    1: the 3 multiplies $x^2$, so it is the coefficient of that term. 2: $x$ is the variable. 3: the small raised 2 is the exponent ($x^2 = x \cdot x$). 4: the 8 has no variable, so it is the constant term. 5: $-5x$ is one of the three terms, the pieces separated by + and −. There is no equals sign, so this is an expression, not an equation, and no two of its terms are like terms.

- id: pre-m7-r2-q02
  lesson: pre-expressions
  type: text
  topic: Expressions
  stem: 'Evaluate $4x - x^2$ when $x = -3$. Give only the number: ___'
  accept: ['-21']
  explanation: |-
    Substitute in parentheses: $4(-3) - (-3)^2 = -12 - 9 = -21$. The square is $(-3)^2 = 9$, and it is subtracted. (Getting $-3$ comes from turning $-(-3)^2$ into $+9$.)

- id: pre-m7-r2-q03
  lesson: pre-expressions
  module_quiz: true
  type: match
  topic: Translating words
  stem: 'Match each expression to the phrase it translates ($n$ is the number).'
  pairs:
    - ['$n - 9$', 9 less than a number]
    - ['$9 - n$', a number subtracted from 9]
    - ['$3(n + 1)$', 3 times the sum of a number and 1]
    - ['$3n + 1$', the sum of 3 times a number and 1]
  distractors: [9 more than a number]
  explanation: |-
    "9 less than a number" starts with the number: $n - 9$. "A number subtracted from 9" starts with 9: $9 - n$. "3 times the sum" multiplies the whole sum, so it needs parentheses: $3(n + 1)$; "the sum of 3 times a number and 1" multiplies only the number: $3n + 1$. "9 more than a number" would be $n + 9$.

- id: pre-m7-r2-q04
  lesson: pre-expressions
  topic: Expressions
  stem: 'Which expressions have the value 12 when $x = -2$? Select all that apply.'
  choices: ['$x^2 + 8$', '$-x^2 + 8$', '$-6x$', '$6 - x$']
  answer: [0, 2]
  explanation: |-
    $(-2)^2 + 8 = 4 + 8 = 12$ ✓. $-(-2)^2 + 8 = -4 + 8 = 4$. $-6(-2) = 12$ ✓. $6 - (-2) = 8$.

- id: pre-m7-r2-q05
  lesson: pre-expressions
  type: order
  topic: Expressions
  stem: 'Put the steps for evaluating $2(x - 1)^2 + 3$ at $x = 4$ in order.'
  items: ['$2(4 - 1)^2 + 3$', '$2(3)^2 + 3$', '$2(9) + 3$', '$18 + 3$', '$21$']
  explanation: |-
    Substitute first, then follow the order of operations: parentheses ($4 - 1 = 3$), the power ($3^2 = 9$), the multiplication ($2 \cdot 9 = 18$), and finally the addition, giving 21.

# --- pre-simplify ---
- id: pre-m7-r2-q06
  lesson: pre-simplify
  module_quiz: true
  type: text
  topic: Distributive property
  stem: 'Simplify $-3(2x - 5) + 4x$. Answer: ___'
  accept: ['-2x+15', '15-2x', '−2x+15', '15−2x']
  explanation: |-
    Distribute $-3$ to both terms: $-6x + 15$ (since $(-3)(-5) = +15$). Add $4x$: $-6x + 4x + 15 = -2x + 15$.

- id: pre-m7-r2-q07
  lesson: pre-simplify
  type: match
  topic: Simplifying expressions
  stem: 'Sort each term: is it a like term of $5x^2$, of $5x$, or of neither?'
  pairs:
    - ['$-x^2$', like 5x²]
    - ['$9x$', like 5x]
    - ['$\tfrac{x}{3}$', like 5x]
    - ['$2x^3$', like neither]
    - ['$4xy$', like neither]
  explanation: |-
    Like terms have exactly the same variable part. $-x^2$ has $x^2$, like $5x^2$. $9x$ and $\tfrac{x}{3} = \tfrac13 x$ have $x$, like $5x$. $2x^3$ has a different power and $4xy$ has a different variable part, so they match neither.

- id: pre-m7-r2-q08
  lesson: pre-simplify
  module_quiz: true
  topic: Simplifying expressions
  stem: 'Which expressions are equivalent to $6x + 15$? Select all that apply.'
  choices: ['$3(2x + 5)$', '$6(x + 15)$', '$2x + 4x + 10 + 5$', '$21x$']
  answer: [0, 2]
  explanation: |-
    $3(2x + 5) = 6x + 15$ ✓ (factoring out the GCF 3). $6(x + 15) = 6x + 90$. $2x + 4x + 10 + 5 = 6x + 15$ ✓. $21x$ wrongly combines unlike terms.

- id: pre-m7-r2-q09
  lesson: pre-simplify
  type: order
  topic: Simplifying expressions
  stem: 'Put the steps for simplifying $2(3x - 4) - (x - 7)$ in order.'
  items: ['$2(3x - 4) - (x - 7)$', '$6x - 8 - x + 7$', '$(6x - x) + (-8 + 7)$', '$5x - 1$']
  explanation: |-
    Distribute first: $2(3x - 4) = 6x - 8$, and the minus sign in front of $(x - 7)$ changes both signs, giving $-x + 7$. Group like terms, then combine: $5x - 1$.

- id: pre-m7-r2-q10
  lesson: pre-simplify
  topic: Distributive property
  stem: 'Simplify $5 - 2(x - 3)$.'
  choices: ['$3x - 9$', '$-2x - 1$', '$-2x + 11$', '$-2x + 2$']
  answer: 2
  explanation: |-
    Multiplication comes before subtraction, so distribute $-2$ first: $5 - 2x + 6 = -2x + 11$. ($3x - 9$ comes from subtracting $5 - 2$ first; $-2x - 1$ from writing $-6$ instead of $+6$; $-2x + 2$ from multiplying only the $x$.)

# --- pre-equations-1 ---
- id: pre-m7-r2-q11
  lesson: pre-equations-1
  module_quiz: true
  topic: Solving equations
  stem: 'The balance is level. Each small cube weighs 1, and each box weighs the same unknown amount $x$. Which equation does it show?'
  image: {src: images/pre-m7-balance.svg, alt: 'A level balance scale. The left pan holds three boxes marked x and five small unit cubes; the right pan holds twenty unit cubes.'}
  choices: ['$3x + 5 = 20$', '$3x = 25$', '$x + 5 = 20$', '$8x = 20$']
  answer: 0
  explanation: |-
    The left pan has three boxes ($3x$) and five cubes ($+5$); the right has 20 cubes. Level means equal: $3x + 5 = 20$. Removing 5 cubes from each side leaves $3x = 15$, so each box weighs 5. ($8x = 20$ wrongly counts the cubes as boxes.)

- id: pre-m7-r2-q12
  lesson: pre-equations-1
  type: text
  topic: Solving equations
  stem: 'Solve $\dfrac{x}{4} + 7 = 3$. Give only the number: $x =$ ___'
  accept: ['-16']
  explanation: |-
    Undo the addition first: subtract 7 to get $\tfrac{x}{4} = -4$. Then multiply both sides by 4: $x = -16$. Check: $\tfrac{-16}{4} + 7 = -4 + 7 = 3$ ✓.

- id: pre-m7-r2-q13
  lesson: pre-equations-1
  type: order
  topic: Solving equations
  stem: 'Put the steps for solving $5 - 2x = 17$ in order.'
  items: ['$5 - 2x = 17$', '$-2x = 12$', '$x = -6$', 'Check: $5 - 2(-6) = 17$']
  explanation: |-
    Subtract 5 from both sides: $-2x = 12$. Divide by $-2$, the coefficient with its sign: $x = -6$. Then check in the original: $5 + 12 = 17$ ✓.

- id: pre-m7-r2-q14
  lesson: pre-equations-1
  topic: Solving equations
  stem: 'Which equations have the solution $x = -4$? Select all that apply.'
  choices: ['$3x + 2 = -10$', '$\dfrac{x}{2} - 1 = -3$', '$2 - x = -2$', '$-5x = -20$']
  answer: [0, 1]
  explanation: |-
    Substitute $-4$. $3(-4) + 2 = -10$ ✓. $\tfrac{-4}{2} - 1 = -3$ ✓. $2 - (-4) = 6$, not $-2$ (its solution is $x = 4$). $-5(-4) = 20$, not $-20$ (its solution is $x = 4$).

- id: pre-m7-r2-q15
  lesson: pre-equations-1
  module_quiz: true
  type: match
  topic: Solving equations
  stem: 'Match each step to the property of equality it uses.'
  pairs:
    - ['From $x - 8 = -3$ to $x = 5$', Addition property of equality]
    - ['From $y + 9 = 4$ to $y = -5$', Subtraction property of equality]
    - ['From $\dfrac{k}{4} = 2.5$ to $k = 10$', Multiplication property of equality]
    - ['From $-6n = 42$ to $n = -7$', Division property of equality]
  explanation: |-
    Undo each operation with its inverse: add 8 to undo subtracting 8; subtract 9 to undo adding 9; multiply by 4 to undo dividing by 4; divide by $-6$ to undo multiplying by $-6$. Each is done to both sides.

# --- pre-equations-2 ---
- id: pre-m7-r2-q16
  lesson: pre-equations-2
  module_quiz: true
  type: order
  topic: Multi-step equations
  stem: 'Put the general strategy for solving an equation like $3(x - 2) + x = 2x + 8$ in order.'
  items: [Distribute to remove parentheses, Combine like terms on each side, Collect the variable terms on one side and the constants on the other, Divide both sides by the coefficient of the variable, Check the answer in the original equation]
  explanation: |-
    Simplify each side first (distribute, then combine), then collect terms, then divide. For this equation: $3x - 6 + x = 2x + 8$, so $4x - 6 = 2x + 8$, then $2x = 14$ and $x = 7$. Check: $3(5) + 7 = 22$ and $2(7) + 8 = 22$ ✓.

- id: pre-m7-r2-q17
  lesson: pre-equations-2
  module_quiz: true
  type: text
  topic: Multi-step equations
  stem: 'Solve $5(x - 2) = 3x + 4$. Give only the number: $x =$ ___'
  accept: ['7']
  explanation: |-
    Distribute: $5x - 10 = 3x + 4$. Subtract $3x$: $2x - 10 = 4$. Add 10: $2x = 14$, so $x = 7$. Check: $5(5) = 25$ and $21 + 4 = 25$ ✓.

- id: pre-m7-r2-q18
  lesson: pre-equations-2
  topic: Multi-step equations
  stem: 'Which equations have no solution? Select all that apply.'
  choices: ['$3(x + 2) = 3x + 5$', '$2x + 4 = 2(x + 2)$', '$4x - 1 = 4x + 1$', '$5x = 3x$']
  answer: [0, 2]
  explanation: |-
    $3x + 6 = 3x + 5$ leaves $6 = 5$, false: no solution ✓. $2x + 4 = 2x + 4$ leaves a true statement: every number is a solution. $4x - 1 = 4x + 1$ leaves $-1 = 1$, false: no solution ✓. $5x = 3x$ gives $2x = 0$, so $x = 0$ is a solution.

- id: pre-m7-r2-q19
  lesson: pre-equations-2
  type: match
  topic: Multi-step equations
  stem: 'How many solutions does each equation have?'
  pairs:
    - ['$2(x + 1) = 2x + 2$', Every number is a solution]
    - ['$x + 3 = x - 3$', No solution]
    - ['$3x = 12$', Exactly one solution]
    - ['$6x - 6 = 6(x - 1)$', Every number is a solution]
    - ['$4x = 0$', Exactly one solution]
  explanation: |-
    $2x + 2 = 2x + 2$ and $6x - 6 = 6x - 6$ are identities: always true. $x + 3 = x - 3$ leaves $3 = -3$: never true. $3x = 12$ has the one solution 4, and $4x = 0$ has the one solution 0 (a solution of 0 is still a solution).

- id: pre-m7-r2-q20
  lesson: pre-equations-2
  type: text
  topic: Formulas
  stem: 'Solve $P = 2l + 2w$ for $w$ and use it: a rectangle has perimeter 46 cm and length 15 cm. Its width is ___ cm.'
  accept: ['8']
  explanation: |-
    Solving for $w$: $w = \dfrac{P - 2l}{2} = \dfrac{46 - 30}{2} = \dfrac{16}{2} = 8$ cm. Check: $2(15) + 2(8) = 46$ ✓.

# --- pre-money-problems ---
- id: pre-m7-r2-q21
  lesson: pre-money-problems
  type: order
  topic: Money word problems
  stem: 'Put the steps for setting up and solving a two-coin problem in order.'
  items: ['Let $x$ be the number of one kind of coin', 'Write the number of the other kind in terms of $x$', 'Multiply each count by the value of one coin', 'Set the sum of the values equal to the total value and solve', 'Check both the number of coins and the total value']
  explanation: |-
    Each step uses the one before it: you need the variable to write the other count, both counts to find the values, the values to write the equation, and the solution to check.

- id: pre-m7-r2-q22
  lesson: pre-money-problems
  module_quiz: true
  type: text
  topic: Money word problems
  stem: 'A jar of nickels and quarters holds 24 coins worth \$3.20. How many quarters are in the jar? Give only the number: ___'
  accept: ['10']
  explanation: |-
    Let $q$ be the quarters; the nickels are $24 - q$. In cents: $25q + 5(24 - q) = 320$. Distribute: $25q + 120 - 5q = 320$, so $20q = 200$ and $q = 10$. There are 10 quarters and 14 nickels. Check: $250 + 70 = 320$ cents ✓.

- id: pre-m7-r2-q23
  lesson: pre-money-problems
  topic: Money word problems
  stem: 'Lena has $d$ dimes and 3 more quarters than dimes. Which expressions are correct? Select all that apply.'
  choices: ['Number of quarters: $d + 3$', 'Value of the quarters in cents: $25(d + 3)$', 'Total value in cents: $10d + 25d + 3$', 'Total number of coins: $2d + 3$']
  answer: [0, 1, 3]
  explanation: |-
    Quarters: $d + 3$ ✓. Their value is count × 25 cents: $25(d + 3)$ ✓. The total value is $10d + 25(d + 3) = 35d + 75$; writing $10d + 25d + 3$ forgets the parentheses, so the 3 extra quarters count as 3 cents. Coins: $d + (d + 3) = 2d + 3$ ✓.

- id: pre-m7-r2-q24
  lesson: pre-money-problems
  type: match
  topic: Money word problems
  stem: 'A theater sells $a$ adult tickets at \$12 and $220 - a$ student tickets at \$7, taking in \$2,190. Match each quantity to its role in the value table.'
  pairs:
    - ['$a$', Count of one kind]
    - ['$12$', Value of each item]
    - ['$12a$', Total value of one kind]
    - ['$2{,}190$', Total value of everything]
  distractors: [Total count of items]
  explanation: |-
    $a$ counts adult tickets; 12 dollars is the value of each; $12a$ is the money from adult tickets (count × value); \$2,190 is the money from all tickets. The total count of items would be 220.

- id: pre-m7-r2-q25
  lesson: pre-money-problems
  module_quiz: true
  topic: Money word problems
  stem: 'How many pounds of tea worth \$6 per pound must be mixed with 10 pounds of tea worth \$9 per pound to make a mix worth \$7 per pound?'
  choices: ['10 pounds', '5 pounds', '30 pounds', '20 pounds']
  answer: 3
  explanation: |-
    Let $p$ be the pounds of \$6 tea. The mix weighs $p + 10$ pounds and is worth $7(p + 10)$ dollars: $6p + 90 = 7(p + 10) = 7p + 70$, so $p = 20$. Check: $120 + 90 = 210 = 7 \times 30$ ✓. (30 pounds is the whole mix; 10 pounds would give a \$7.50 mix, the plain average.)

# --- pre-inequalities ---
- id: pre-m7-r2-q26
  lesson: pre-inequalities
  module_quiz: true
  type: text
  topic: Inequalities
  stem: 'Solve $-4x + 3 \ge 19$. The solution is $x$ ___ ___ (type the symbol, using <= for ≤ and >= for ≥, then the number).'
  accept:
    - ['<=', '≤', '=<']
    - ['-4']
  explanation: |-
    Subtract 3: $-4x \ge 16$. Divide by $-4$, which is negative, so the symbol reverses: $x \le -4$. Check $x = -5$: $20 + 3 = 23 \ge 19$ ✓; and $x = 0$: $3 \ge 19$ is false ✓.

- id: pre-m7-r2-q27
  lesson: pre-inequalities
  module_quiz: true
  topic: Inequalities
  stem: 'Which steps, done to both sides of an inequality, reverse the inequality symbol? Select all that apply.'
  choices: ['Dividing by $-3$', 'Subtracting 5', 'Multiplying by $-\tfrac12$', 'Adding $-7$']
  answer: [0, 2]
  explanation: |-
    Only multiplying or dividing by a negative number reverses the symbol. Adding or subtracting any number, even a negative one like $-7$, never does.

- id: pre-m7-r2-q28
  lesson: pre-inequalities
  type: match
  topic: Inequalities
  stem: 'Match each inequality to its graph on a number line.'
  pairs:
    - ['$x < 2$', 'Open circle at 2, shaded to the left']
    - ['$x \ge 2$', 'Closed circle at 2, shaded to the right']
    - ['$x \le 2$', 'Closed circle at 2, shaded to the left']
    - ['$2 < x$', 'Open circle at 2, shaded to the right']
  explanation: |-
    $<$ and $>$ leave out the boundary (open circle); $\le$ and $\ge$ include it (closed circle). $2 < x$ means the same as $x > 2$, so it is shaded to the right.

- id: pre-m7-r2-q29
  lesson: pre-inequalities
  type: order
  topic: Inequalities
  stem: 'Put the steps for solving $3(x - 2) > 5x + 4$ in order.'
  items: ['$3x - 6 > 5x + 4$', '$-2x - 6 > 4$', '$-2x > 10$', '$x < -5$']
  explanation: |-
    Distribute, subtract $5x$ from both sides, add 6, then divide by $-2$, reversing the symbol. Check $x = -6$: $3(-8) = -24$ and $5(-6) + 4 = -26$, and $-24 > -26$ ✓.

- id: pre-m7-r2-q30
  lesson: pre-inequalities
  topic: Inequalities
  stem: 'Sam has \$50. He spends \$8 on admission, and each ride costs \$3.50. Which inequality describes the number of rides $r$ he can afford?'
  choices: ['$8 + 3.5r \ge 50$', '$8 + 3.5r \le 50$', '$8r + 3.5 \le 50$', '$3.5r \le 50 + 8$']
  answer: 1
  explanation: |-
    The total cost, $8 + 3.5r$, can be at most \$50: $8 + 3.5r \le 50$. Solving, $3.5r \le 42$, so $r \le 12$: at most 12 rides. ($\ge$ would mean spending at least \$50.)

# --- pre-graphing-lines ---
- id: pre-m7-r2-q31
  lesson: pre-graphing-lines
  module_quiz: true
  type: label
  topic: Coordinate plane
  stem: 'Name the numbered parts of this graph of the line $3x + 4y = 12$.'
  image: {src: images/pre-m7-coordinate-plane-blank.svg, alt: 'A coordinate grid with a horizontal and a vertical axis crossing at the center, and a straight line falling from upper left to lower right. Numbered markers sit on the right part of the horizontal axis, on the top part of the vertical axis, where the axes cross, where the line crosses the horizontal axis, where the line crosses the vertical axis, and in the upper-left region.'}
  labels:
    - {x: 84.4, y: 50, text: x-axis}
    - {x: 50, y: 15.5, text: y-axis}
    - {x: 50, y: 50, text: Origin}
    - {x: 68.8, y: 50, text: x-intercept}
    - {x: 50, y: 27.5, text: y-intercept}
    - {x: 26.6, y: 27.5, text: Quadrant II}
  distractors: [Quadrant IV, Slope]
  explanation: |-
    The horizontal axis is the $x$-axis and the vertical one the $y$-axis; they cross at the origin $(0, 0)$. The line crosses the $x$-axis at the $x$-intercept $(4, 0)$ and the $y$-axis at the $y$-intercept $(0, 3)$. The upper-left region, where $x < 0$ and $y > 0$, is Quadrant II (quadrants are numbered counterclockwise from the upper right).

- id: pre-m7-r2-q32
  lesson: pre-graphing-lines
  module_quiz: true
  type: text
  topic: Slope
  stem: 'Find the slope of the line through $(-3, 4)$ and $(1, -2)$. Give an integer or a fraction: ___'
  accept: ['-3/2']
  explanation: |-
    $m = \dfrac{-2 - 4}{1 - (-3)} = \dfrac{-6}{4} = -\dfrac32$. The line falls 3 for every 2 to the right.

- id: pre-m7-r2-q33
  lesson: pre-graphing-lines
  type: match
  topic: Slope
  stem: 'Match each equation to a description of its line.'
  pairs:
    - ['$y = 3$', 'Horizontal, slope 0']
    - ['$x = -2$', 'Vertical, slope undefined']
    - ['$y = -2x + 1$', Falls from left to right]
    - ['$y = \tfrac12 x - 4$', Rises from left to right]
  explanation: |-
    $y = 3$ is $y = 0x + 3$: horizontal. $x = -2$ is vertical; its run is 0, so the slope is undefined. A negative slope ($-2$) falls from left to right, a positive slope ($\tfrac12$) rises.

- id: pre-m7-r2-q34
  lesson: pre-graphing-lines
  topic: Graphing lines
  stem: 'Which points lie on the line $2x - y = 6$? Select all that apply.'
  choices: ['$(3, 0)$', '$(0, 6)$', '$(4, 2)$', '$(2, 2)$']
  answer: [0, 2]
  explanation: |-
    Substitute each pair. $2(3) - 0 = 6$ ✓. $0 - 6 = -6$, not 6 (the $y$-intercept is $(0, -6)$). $2(4) - 2 = 6$ ✓. $2(2) - 2 = 2$, not 6.

- id: pre-m7-r2-q35
  lesson: pre-graphing-lines
  type: order
  topic: Graphing lines
  stem: 'Put the steps for graphing $y = -\tfrac23 x + 1$ in order.'
  items: ['Read the slope and intercept: $m = -\tfrac23$, $b = 1$', 'Plot the $y$-intercept $(0, 1)$', 'From $(0, 1)$, run 3 to the right and go down 2, to $(3, -1)$', 'Draw the line through the points']
  explanation: |-
    In $y = mx + b$, $b$ gives the starting point $(0, b)$ and $m$ the step: a slope of $-\tfrac23$ means down 2 for every 3 to the right. Check $(3, -1)$: $-\tfrac23(3) + 1 = -1$ ✓.

- id: pre-m7-r2-q36
  lesson: pre-graphing-lines
  topic: Coordinate plane
  stem: 'A point has a negative $x$-coordinate and a positive $y$-coordinate. Where is it?'
  choices: ['Quadrant I', 'Quadrant III', 'Quadrant II', 'Quadrant IV']
  answer: 2
  explanation: |-
    Negative $x$ means left of the $y$-axis, positive $y$ means above the $x$-axis: the upper left, Quadrant II. For example, $(-3, 1)$.

# --- pre-m7-h-systems (honors) ---
- id: pre-m7-r2-h01
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Which ordered pair is the solution of the system $x + y = 7$ and $x - y = 1$?'
  choices: ['$(3, 4)$', '$(4, 3)$', '$(5, 2)$', '$(6, 1)$']
  answer: 1
  explanation: |-
    $(4, 3)$: $4 + 3 = 7$ ✓ and $4 - 3 = 1$ ✓. The other pairs all satisfy $x + y = 7$ but give $x - y = -1$, $3$ and $5$, so each fails the second equation. A solution must satisfy both.

- id: pre-m7-r2-h02
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Solve by substitution: $y = 2x + 1$ and $3x + y = 16$.'
  choices: ['$(7, 3)$', '$(3, 5)$', '$(5, 11)$', '$(3, 7)$']
  answer: 3
  explanation: |-
    Substitute $2x + 1$ for $y$: $3x + 2x + 1 = 16$, so $5x = 15$ and $x = 3$. Then $y = 2(3) + 1 = 7$. Check: $9 + 7 = 16$ ✓. $(5, 11)$ fits only the first equation; $(7, 3)$ swaps the coordinates.

- id: pre-m7-r2-h03
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Solve by elimination: $4x + 3y = 6$ and $2x - 3y = 12$.'
  choices: ['$(3, -2)$', '$(3, 2)$', '$(-3, 6)$', '$(-2, 3)$']
  answer: 0
  explanation: |-
    The $y$ terms are opposites, so add: $6x = 18$ and $x = 3$. Then $12 + 3y = 6$, so $3y = -6$ and $y = -2$. Check: $6 - (-6) = 12$ ✓. $(-3, 6)$ satisfies only the first equation.

- id: pre-m7-r2-h04
  lesson: pre-m7-h-systems
  type: text
  topic: Systems of equations
  stem: 'Solve the system $x + y = 12$ and $x - y = 4$: $x =$ ___ and $y =$ ___'
  accept:
    - ['8']
    - ['4']
  explanation: |-
    Add the equations: $2x = 16$, so $x = 8$. Then $8 + y = 12$, so $y = 4$. Check: $8 - 4 = 4$ ✓.

- id: pre-m7-r2-h05
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Which statements about the system $y = 3x + 2$ and $y = 3x - 5$ are true? Select all that apply.'
  choices: ['The lines are parallel.', 'The system has no solution.', 'The lines cross at exactly one point.', 'Every point on the first line is a solution.']
  answer: [0, 1]
  explanation: |-
    Both lines have slope 3 but different $y$-intercepts (2 and $-5$), so they are parallel and never meet: no solution. Algebraically, $3x + 2 = 3x - 5$ leaves $2 = -5$, which is false.

- id: pre-m7-r2-h06
  lesson: pre-m7-h-systems
  type: match
  topic: Systems of equations
  stem: 'Match what the algebra shows to the solutions of the system.'
  pairs:
    - ['Elimination leaves $0 = 0$', Infinitely many solutions]
    - ['Elimination leaves $0 = 9$', No solution]
    - ['Elimination gives $x = 2$, then $y = 5$', 'One solution, (2, 5)']
  distractors: ['One solution, (5, 2)']
  explanation: |-
    A true statement with no variable left means the equations describe the same line: infinitely many solutions. A false statement means parallel lines: no solution. Finding $x = 2$ and $y = 5$ gives the single point $(2, 5)$, with $x$ first.

- id: pre-m7-r2-h07
  lesson: pre-m7-h-systems
  type: order
  topic: Systems of equations
  stem: 'Put the steps of the substitution method in order.'
  items: [Solve one equation for one variable, Substitute that expression into the other equation, Solve the resulting one-variable equation, Substitute the value back to find the other variable, Check the pair in both equations]
  explanation: |-
    Substitution turns two equations in two unknowns into one equation in one unknown. After solving it, back-substitution gives the second value, and the check uses both original equations.

- id: pre-m7-r2-h08
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'How many solutions does the system $2x + 4y = 8$ and $x + 2y = 4$ have?'
  choices: ['None', 'Exactly one', 'Infinitely many', 'Exactly two']
  answer: 2
  explanation: |-
    The first equation is the second multiplied by 2, so they describe the same line. Doubling the second and subtracting leaves $0 = 0$: every point on the line $x + 2y = 4$ is a solution. (Two lines can never share exactly two points.)

- id: pre-m7-r2-h09
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Two numbers add up to 58, and their difference is 16. What is the larger number?'
  choices: ['37', '21', '42', '29']
  answer: 0
  explanation: |-
    Let the numbers be $x$ (larger) and $y$: $x + y = 58$ and $x - y = 16$. Adding gives $2x = 74$, so $x = 37$ and $y = 21$. Check: $37 - 21 = 16$ ✓. (21 is the smaller number; 42 is $58 - 16$; 29 is half of 58.)

- id: pre-m7-r2-h10
  lesson: pre-m7-h-systems
  type: text
  topic: Systems of equations
  stem: 'A museum sold 40 tickets: adult tickets at \$9 and child tickets at \$5, for \$296 in all. How many child tickets were sold? Give only the number: ___'
  accept: ['16']
  explanation: |-
    Let $a$ and $c$ be the adult and child tickets: $a + c = 40$ and $9a + 5c = 296$. Multiply the first by 9: $9a + 9c = 360$. Subtract the second: $4c = 64$, so $c = 16$ and $a = 24$. Check: $216 + 80 = 296$ ✓.

- id: pre-m7-r2-h11
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'You want to eliminate $y$ from $3x + 4y = 5$ and $2x - 6y = 1$ by adding the equations. What should you multiply them by?'
  choices: ['The first by 2 and the second by 3', 'The first by 4 and the second by 6', 'The first by $-3$ and the second by 2', 'The first by 3 and the second by 2']
  answer: 3
  explanation: |-
    The least common multiple of 4 and 6 is 12. Multiplying the first by 3 gives $12y$, and the second by 2 gives $-12y$; adding cancels $y$. The other choices give $8y$ and $-18y$, $16y$ and $-36y$, or $-12y$ and $-12y$, which don't cancel when added.

- id: pre-m7-r2-h12
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Why is it allowed to add two equations together, left side to left side and right side to right side?'
  choices: ['Adding equal amounts to equal amounts gives equal results', 'Any two equations always have the same solution', 'Adding equations makes both variables cancel', 'The equations must first be graphed']
  answer: 0
  explanation: |-
    If $A = B$ and $C = D$, then $A + C = B + D$: this is the addition property of equality, adding the same amount ($C$, which equals $D$) to both sides. Adding doesn't always cancel a variable; that's why you sometimes multiply first.

- id: pre-m7-r2-h13
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Which systems have exactly one solution? Select all that apply.'
  choices: ['$y = 2x + 1$ and $y = -x + 4$', '$y = 4x - 3$ and $y = 4x + 2$', '$x + y = 5$ and $2x + 2y = 10$', '$x = 3$ and $y = -1$']
  answer: [0, 3]
  explanation: |-
    Different slopes (2 and $-1$) mean the lines cross once, at $(1, 3)$ ✓. Equal slopes with different intercepts are parallel: no solution. The third pair is one line written twice: infinitely many. A vertical and a horizontal line cross once, at $(3, -1)$ ✓.

- id: pre-m7-r2-h14
  lesson: pre-m7-h-systems
  topic: Systems of equations
  stem: 'Solve $2x + y = 4$ and $4x - y = 5$.'
  choices: ['$(1, \tfrac32)$', '$(\tfrac32, -1)$', '$(\tfrac32, 1)$', '$(\tfrac92, -5)$']
  answer: 2
  explanation: |-
    Add the equations: $6x = 9$, so $x = \tfrac32$. Then $2(\tfrac32) + y = 4$ gives $3 + y = 4$ and $y = 1$. Check: $4(\tfrac32) - 1 = 5$ ✓. $(\tfrac92, -5)$ satisfies only the first equation.

# --- pre-m7-h-absolute-value (honors) ---
- id: pre-m7-r2-h15
  lesson: pre-m7-h-absolute-value
  topic: Absolute value equations
  stem: 'Solve $|x + 4| = 9$.'
  choices: ['$x = 5$ only', '$x = 5$ or $x = -13$', '$x = -5$ or $x = 13$', '$x = 5$ or $x = -5$']
  answer: 1
  explanation: |-
    $x + 4 = 9$ gives $x = 5$; $x + 4 = -9$ gives $x = -13$. Both are 9 units from $-4$. ("$x = 5$ only" forgets the negative case.)

- id: pre-m7-r2-h16
  lesson: pre-m7-h-absolute-value
  topic: Absolute value equations
  stem: 'Solve $|3x - 2| = -5$.'
  choices: ['$x = -1$ or $x = \tfrac73$', '$x = 1$ or $x = -\tfrac73$', 'Every number is a solution', 'No solution']
  answer: 3
  explanation: |-
    An absolute value is a distance, never negative, so it can't equal $-5$: no solution. Splitting anyway would give the wrong answers $x = \tfrac73$ and $x = -1$.

- id: pre-m7-r2-h17
  lesson: pre-m7-h-absolute-value
  type: text
  topic: Absolute value equations
  stem: 'Solve $2|x - 3| + 1 = 9$. The solutions are $x =$ ___ (smaller) and $x =$ ___ (larger).'
  accept:
    - ['-1']
    - ['7']
  explanation: |-
    Isolate first: subtract 1, then divide by 2, giving $|x - 3| = 4$. So $x - 3 = 4$ ($x = 7$) or $x - 3 = -4$ ($x = -1$). Check: $2|4| + 1 = 9$ ✓ and $2|-4| + 1 = 9$ ✓.

- id: pre-m7-r2-h18
  lesson: pre-m7-h-absolute-value
  topic: Absolute value equations
  stem: 'Which equation says "$x$ is 6 units from $-2$ on the number line"?'
  choices: ['$|x - 2| = 6$', '$|x + 6| = 2$', '$|x + 2| = 6$', '$|x| - 2 = 6$']
  answer: 2
  explanation: |-
    The distance from $x$ to $-2$ is $|x - (-2)| = |x + 2|$, and it equals 6. ($|x - 2| = 6$ measures distance from $+2$.) The solutions are 4 and $-8$.

- id: pre-m7-r2-h19
  lesson: pre-m7-h-absolute-value
  topic: Compound inequalities
  stem: 'Which numbers are solutions of $|x - 1| < 3$? Select all that apply.'
  choices: ['0', '$-2$', '3.5', '4']
  answer: [0, 2]
  explanation: |-
    $|x - 1| < 3$ means $-2 < x < 4$. 0 ✓ ($|-1| = 1$) and 3.5 ✓ ($|2.5| = 2.5$). For $-2$ and 4 the distance is exactly 3, which is not less than 3, so the open endpoints are left out.

- id: pre-m7-r2-h20
  lesson: pre-m7-h-absolute-value
  type: match
  topic: Compound inequalities
  stem: 'Match each inequality to its solution.'
  pairs:
    - ['$|x| < 4$', '−4 < x < 4']
    - ['$|x| > 4$', 'x < −4 or x > 4']
    - ['$|x| \le -4$', No solution]
    - ['$|x| > -4$', Every number]
  explanation: |-
    Less than a positive number: between. Greater than a positive number: outside, an "or." A distance is never at most $-4$ (no solution), and it is always greater than $-4$ (every number).

- id: pre-m7-r2-h21
  lesson: pre-m7-h-absolute-value
  topic: Compound inequalities
  stem: 'Solve $-7 < 3x + 2 \le 11$.'
  choices: ['$-3 \le x < 3$', '$-3 < x \le 3$', '$-\tfrac73 < x \le \tfrac{11}{3}$', '$-3 > x \ge 3$']
  answer: 1
  explanation: |-
    Subtract 2 from all three parts: $-9 < 3x \le 9$. Divide all three by 3 (positive, no flip): $-3 < x \le 3$. The endpoint symbols stay where they were. ($-\tfrac73 < x \le \tfrac{11}{3}$ subtracts 2 from the middle only.)

- id: pre-m7-r2-h22
  lesson: pre-m7-h-absolute-value
  type: text
  topic: Compound inequalities
  stem: 'Solve $-1 \le 5 - 2x < 9$. The solution is ___ $< x \le$ ___'
  accept:
    - ['-2']
    - ['3']
  explanation: |-
    Subtract 5 from all three parts: $-6 \le -2x < 4$. Divide by $-2$ and reverse both symbols: $3 \ge x > -2$, that is, $-2 < x \le 3$. Check $x = 3$: $5 - 6 = -1$ ✓ (included); $x = -2$: $5 + 4 = 9$, not less than 9 (excluded).

- id: pre-m7-r2-h23
  lesson: pre-m7-h-absolute-value
  type: order
  topic: Absolute value equations
  stem: 'Put the steps for solving $4|x + 1| - 3 = 17$ in order.'
  items: ['$4|x + 1| = 20$', '$|x + 1| = 5$', '$x + 1 = 5$ or $x + 1 = -5$', '$x = 4$ or $x = -6$']
  explanation: |-
    Isolate the absolute value (add 3, divide by 4), then split into two cases and solve each. Check: $4|5| - 3 = 17$ ✓ and $4|-5| - 3 = 17$ ✓.

- id: pre-m7-r2-h24
  lesson: pre-m7-h-absolute-value
  topic: Absolute value equations
  stem: 'An oven should stay at most 15 °F away from 350 °F. Which describes the allowed temperatures $T$?'
  choices: ['$335 \le T \le 365$', '$T \le 335$ or $T \ge 365$', '$|T| \le 365$', '$350 \le T \le 365$']
  answer: 0
  explanation: |-
    "At most 15 away from 350" is $|T - 350| \le 15$, so $-15 \le T - 350 \le 15$ and $335 \le T \le 365$. The "or" choice describes temperatures at least 15 away.

- id: pre-m7-r2-h25
  lesson: pre-m7-h-absolute-value
  topic: Compound inequalities
  stem: 'Solve $|2x + 1| \ge 5$.'
  choices: ['$-3 \le x \le 2$', '$x \le -2$ or $x \ge 3$', '$x \le -3$ or $x \ge 2$', '$x \ge -3$ or $x \le 2$']
  answer: 2
  explanation: |-
    Greater than or equal: outside. $2x + 1 \le -5$ gives $x \le -3$; $2x + 1 \ge 5$ gives $x \ge 2$. Check $x = 0$: $|1| \ge 5$ is false, so 0 must not be a solution, as in $x \le -3$ or $x \ge 2$. ($-3 \le x \le 2$ is the "less than" answer; the last choice covers every number.)

- id: pre-m7-r2-h26
  lesson: pre-m7-h-absolute-value
  topic: Compound inequalities
  stem: 'Which have no solution? Select all that apply.'
  choices: ['$|x - 5| = -1$', '$|x - 5| < 0$', '$|x - 5| \ge 0$', '$x < 2$ and $x > 7$']
  answer: [0, 1, 3]
  explanation: |-
    A distance can't be $-1$ or less than 0, so the first two have no solution. $|x - 5| \ge 0$ is true for every number. No number is both below 2 and above 7, so the "and" statement has no solution.

- id: pre-m7-r2-h27
  lesson: pre-m7-h-absolute-value
  topic: Absolute value equations
  stem: 'Why does $|x - 3| = 5$ have two solutions?'
  choices: ['Two numbers, one on each side of 3, are 5 units from 3', 'Absolute value bars always double the answer', 'The equation is an identity', 'Every equation with a variable has two solutions']
  answer: 0
  explanation: |-
    $|x - 3|$ is the distance from $x$ to 3. Going 5 units right gives 8 and 5 units left gives $-2$, so there are exactly two numbers at that distance.

- id: pre-m7-r2-h28
  lesson: pre-m7-h-absolute-value
  topic: Compound inequalities
  stem: 'Which graph matches "$x < -1$ or $x \ge 4$"?'
  choices: ['Closed circle at $-1$ shaded left; open circle at 4 shaded right', 'Open circle at $-1$ and closed circle at 4, shaded between them', 'Open circle at $-1$ shaded right; closed circle at 4 shaded left', 'Open circle at $-1$ shaded left; closed circle at 4 shaded right']
  answer: 3
  explanation: |-
    "Or" gives two rays pointing away from each other. $x < -1$: open circle (not included), shaded left. $x \ge 4$: closed circle (included), shaded right. Shading between the points would be an "and."

# --- pre-m7-h-line-equations (honors) ---
- id: pre-m7-r2-h29
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'Which is an equation of the line with slope 4 through $(-3, 2)$?'
  choices: ['$y + 2 = 4(x - 3)$', '$y - 2 = 4(x - 3)$', '$y - 3 = 4(x + 2)$', '$y - 2 = 4(x + 3)$']
  answer: 3
  explanation: |-
    Point-slope form subtracts the point's coordinates: $y - 2 = 4(x - (-3)) = 4(x + 3)$. The other choices flip a sign or swap $x$ and $y$.

- id: pre-m7-r2-h30
  lesson: pre-m7-h-line-equations
  type: text
  topic: Equations of lines
  stem: 'The line with slope $-2$ through $(3, 1)$ has equation $y = -2x +$ ___'
  accept: ['7']
  explanation: |-
    $y - 1 = -2(x - 3) = -2x + 6$, so $y = -2x + 7$. Check: $-2(3) + 7 = 1$ ✓.

- id: pre-m7-r2-h31
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'Find the equation of the line through $(1, 5)$ and $(3, 11)$.'
  choices: ['$y = \tfrac13 x + \tfrac{14}{3}$', '$y = 3x + 2$', '$y = 3x - 2$', '$y = 3x + 5$']
  answer: 1
  explanation: |-
    Slope: $\dfrac{11 - 5}{3 - 1} = \dfrac62 = 3$. Then $y - 5 = 3(x - 1)$, so $y = 3x + 2$. Check: $3(3) + 2 = 11$ ✓. (The $\tfrac13$ choice uses run over rise; $y = 3x + 5$ uses the point's $y$-value as the intercept.)

- id: pre-m7-r2-h32
  lesson: pre-m7-h-line-equations
  type: text
  topic: Parallel and perpendicular lines
  stem: 'What is the slope of a line perpendicular to $y = -\tfrac45 x + 1$? Give a fraction: ___'
  accept: ['5/4']
  explanation: |-
    Take the negative reciprocal of $-\tfrac45$: flip it to $-\tfrac54$ and change the sign, giving $\tfrac54$. Check: $(-\tfrac45)(\tfrac54) = -1$ ✓.

- id: pre-m7-r2-h33
  lesson: pre-m7-h-line-equations
  topic: Parallel and perpendicular lines
  stem: 'Which lines are parallel to $y = 2x - 3$? Select all that apply.'
  choices: ['$y = 2x + 7$', '$4x - 2y = 1$', '$y = -2x - 3$', '$y = \tfrac12 x - 3$']
  answer: [0, 1]
  explanation: |-
    Parallel lines have the same slope, 2. $y = 2x + 7$ ✓. Solving $4x - 2y = 1$ for $y$ gives $y = 2x - \tfrac12$ ✓. Slopes $-2$ and $\tfrac12$ are different (and $-2$ isn't even perpendicular; that would need $-\tfrac12$).

- id: pre-m7-r2-h34
  lesson: pre-m7-h-line-equations
  type: match
  topic: Parallel and perpendicular lines
  stem: 'Match each pair of lines to how they are related.'
  pairs:
    - ['$y = 3x + 1$ and $y = 3x - 4$', Parallel]
    - ['$y = 3x + 1$ and $y = -\tfrac13 x + 2$', Perpendicular]
    - ['$y = 3x + 1$ and $y = x + 1$', 'Neither: they cross, but not at a right angle']
    - ['$x = 2$ and $y = 5$', Perpendicular]
    - ['$y = 3x + 1$ and $6x - 2y = -2$', The same line]
  explanation: |-
    Equal slopes and different intercepts: parallel. Slopes 3 and $-\tfrac13$ multiply to $-1$: perpendicular. Slopes 3 and 1 differ but don't multiply to $-1$: neither. A vertical and a horizontal line are perpendicular. Solving $6x - 2y = -2$ for $y$ gives $y = 3x + 1$: the same line.

- id: pre-m7-r2-h35
  lesson: pre-m7-h-line-equations
  type: order
  topic: Parallel and perpendicular lines
  stem: 'Put the steps for finding the line through $(-4, 1)$ perpendicular to $x - 2y = 6$ in order.'
  items: ['Solve the given equation for $y$: $y = \tfrac12 x - 3$', 'Take the negative reciprocal of its slope: $-2$', 'Write point-slope form: $y - 1 = -2(x + 4)$', 'Simplify: $y = -2x - 7$']
  explanation: |-
    $x - 2y = 6$ gives $-2y = -x + 6$, so $y = \tfrac12 x - 3$ with slope $\tfrac12$. The perpendicular slope is $-2$. Then $y - 1 = -2x - 8$, so $y = -2x - 7$. Check: $-2(-4) - 7 = 1$ ✓.

- id: pre-m7-r2-h36
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'A plumber''s charge is a linear function of the hours worked: \$140 for a 2-hour job and \$230 for a 4-hour job. Which model gives the charge $y$ for $x$ hours?'
  choices: ['$y = 70x$', '$y = 45x + 140$', '$y = 45x + 50$', '$y = 57.5x$']
  answer: 2
  explanation: |-
    Slope: $\dfrac{230 - 140}{4 - 2} = \dfrac{90}{2} = 45$ dollars per hour. Then $y - 140 = 45(x - 2)$, so $y = 45x + 50$: a \$50 base fee plus \$45 per hour. Check: $45(4) + 50 = 230$ ✓. $y = 70x$ and $y = 57.5x$ each fit only one job.

- id: pre-m7-r2-h37
  lesson: pre-m7-h-line-equations
  type: text
  topic: Equations of lines
  stem: 'A 300-liter tank drains at a steady 12 liters per minute, so its volume is $V = -12t + 300$. After how many minutes is it empty? Give only the number: ___'
  accept: ['25']
  explanation: |-
    Empty means $V = 0$: $-12t + 300 = 0$, so $12t = 300$ and $t = 25$ minutes.

- id: pre-m7-r2-h38
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'A phone''s battery charge is modeled by $B = -8t + 100$ (percent, $t$ hours after unplugging). What does the $-8$ mean?'
  choices: ['The battery starts at 8 percent', 'The battery loses 8 percentage points per hour', 'The battery lasts 8 hours', 'The battery is empty after 92 hours']
  answer: 1
  explanation: |-
    The slope is the rate of change: $-8$ percentage points per hour, negative because the charge goes down. The intercept 100 is the starting charge, and it runs out at $t = 12.5$ hours.

- id: pre-m7-r2-h39
  lesson: pre-m7-h-line-equations
  topic: Parallel and perpendicular lines
  stem: 'A line has slope $\tfrac37$. What is the slope of a line perpendicular to it?'
  choices: ['$\tfrac73$', '$-\tfrac37$', '$\tfrac37$', '$-\tfrac73$']
  answer: 3
  explanation: |-
    Flip and change the sign: $-\tfrac73$. Check: $\tfrac37 \cdot (-\tfrac73) = -1$ ✓. $\tfrac73$ flips without changing sign; $-\tfrac37$ changes sign without flipping; $\tfrac37$ is the slope of a parallel line.

- id: pre-m7-r2-h40
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'A line passes through $(0, 3)$ and $(2, 7)$. Which equations describe it? Select all that apply.'
  choices: ['$y = 2x + 3$', '$y - 7 = 2(x - 2)$', '$y - 2 = 2(x - 7)$', '$y = \tfrac12 x + 3$']
  answer: [0, 1]
  explanation: |-
    Slope: $\tfrac{7 - 3}{2 - 0} = 2$, and the $y$-intercept is 3, so $y = 2x + 3$ ✓. Point-slope form with $(2, 7)$ is $y - 7 = 2(x - 2)$, which simplifies to the same line ✓. $y - 2 = 2(x - 7)$ swaps the point's coordinates, and $\tfrac12$ is run over rise.

- id: pre-m7-r2-h41
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'Using $F = \tfrac95 C + 32$, at what temperature do the Celsius and Fahrenheit scales show the same number?'
  choices: ['$-40$', '0', '32', '$-32$']
  answer: 0
  explanation: |-
    Set $F = C$: $C = \tfrac95 C + 32$, so $-\tfrac45 C = 32$ and $C = -40$. Check: $\tfrac95(-40) + 32 = -72 + 32 = -40$ ✓.

- id: pre-m7-r2-h42
  lesson: pre-m7-h-line-equations
  topic: Equations of lines
  stem: 'A candle''s height is modeled by $h = -2.5t + 24$ (cm, $t$ hours after lighting). Why shouldn''t you use the model at $t = 12$?'
  choices: ['The slope changes after 12 hours', 'It predicts a negative height; the candle burned out at 9.6 hours', 'Linear models only work for whole numbers', 'At $t = 12$ the candle is exactly 24 cm tall']
  answer: 1
  explanation: |-
    $-2.5(12) + 24 = -6$ cm, which is impossible. The model only makes sense while the candle exists, from $t = 0$ to $t = 9.6$ hours, where $h = 0$.
