# Round 2, module pre-m6: new question types for the core lessons, and the honors lessons.
# --- pre-powers-roots ---
- id: pre-m6-r2-q01
  lesson: pre-powers-roots
  type: label
  module_quiz: true
  topic: Real numbers
  stem: 'The picture sorts some numbers into nested boxes. Name the numbered sets.'
  image: {src: images/pre-m6-real-numbers-blank.svg, alt: 'An outer box holds two boxes side by side. The left one contains a smaller box, which contains a still smaller box. The innermost box holds 0, 7, 25 and 100; the ring around it holds −4 and −12; the outer part of the left box holds 3/4, 0.25, −2.6 and 0.333…; the right box holds √2, π, √58 and −√7.'}
  labels:
    - {x: 50, y: 9.3, text: Real numbers}
    - {x: 33.75, y: 20.5, text: Rational numbers}
    - {x: 25.6, y: 31.6, text: Integers}
    - {x: 21.25, y: 42.8, text: Whole numbers}
    - {x: 81.25, y: 20.5, text: Irrational numbers}
  distractors: [Perfect squares, Negative numbers]
  explanation: |-
    The innermost box holds 0, 7, 25 and 100: whole numbers. Adding the negatives −4 and −12 gives the integers. Adding fractions and terminating or repeating decimals such as $\tfrac34$ and $0.333\ldots$ gives the rational numbers. The separate box holds numbers that can't be written as fractions of integers, such as $\sqrt2$ and $\pi$: the irrational numbers. Rational and irrational together make up the real numbers.

- id: pre-m6-r2-q02
  lesson: pre-powers-roots
  topic: Real numbers
  stem: 'Which of these numbers are rational? Select all that apply.'
  choices: ['$\sqrt{64}$', '$-\tfrac{7}{3}$', '$\sqrt{12}$', '$0.1\overline{6}$', '$\pi$']
  answer: [0, 1, 3]
  explanation: |-
    $\sqrt{64} = 8$ is an integer. $-\tfrac73$ is a fraction of integers. $0.1\overline{6} = 0.1666\ldots$ repeats, so it is rational (it equals $\tfrac16$). But 12 is not a perfect square, so $\sqrt{12} \approx 3.464$ is irrational, and $\pi$ is irrational.

- id: pre-m6-r2-q03
  lesson: pre-powers-roots
  type: text
  topic: Square roots
  stem: '$\sqrt[3]{-125} =$ ___'
  accept: ['-5', '−5']
  explanation: |-
    $(-5)^3 = (-5)(-5)(-5) = -125$, so $\sqrt[3]{-125} = -5$. Unlike square roots, cube roots of negative numbers are real.

- id: pre-m6-r2-q04
  lesson: pre-powers-roots
  type: order
  module_quiz: true
  topic: Square roots
  stem: 'Put these numbers in order from least to greatest.'
  items: ['$-\sqrt{10}$', '$-3$', '$\sqrt{8}$', '$3$', '$\sqrt{10}$']
  explanation: |-
    $\sqrt{10}$ is a little more than 3 (since $3^2 = 9$), about 3.16, and $\sqrt8$ is a little less than 3, about 2.83. So $-\sqrt{10} \approx -3.16$ is below $-3$, and the order is $-\sqrt{10} < -3 < \sqrt8 < 3 < \sqrt{10}$.

- id: pre-m6-r2-q05
  lesson: pre-powers-roots
  type: match
  topic: Square roots
  stem: 'Match each expression to its value.'
  pairs:
    - ['$\sqrt{0.49}$', '0.7']
    - ['$\sqrt{49}$', '7']
    - ['$\sqrt{4900}$', '70']
    - ['$0.7^2$', '0.49']
  distractors: ['4.9', '0.07']
  explanation: |-
    $0.7^2 = 0.49$, so $\sqrt{0.49} = 0.7$. $7^2 = 49$, so $\sqrt{49} = 7$. $70^2 = 4900$, so $\sqrt{4900} = 70$. Squaring 0.7 gives 0.49 (two decimal places), which is smaller than 0.7.

# --- pre-exp-rules ---
- id: pre-m6-r2-q06
  lesson: pre-exp-rules
  type: text
  module_quiz: true
  topic: Exponent rules
  stem: '$x^{10} \div x^{4} = x^{n}$, where $n =$ ___. (Give only the number.)'
  accept: ['6']
  explanation: |-
    Same base, dividing: subtract the exponents. $10 - 4 = 6$, so $x^{10} \div x^4 = x^6$. (Dividing the exponents would give 2.5, which is wrong.)

- id: pre-m6-r2-q07
  lesson: pre-exp-rules
  type: match
  topic: Exponent rules
  stem: 'Match each expression to its value.'
  pairs:
    - ['$2^3 \cdot 2^2$', '32']
    - ['$\left(2^3\right)^2$', '64']
    - ['$\dfrac{2^5}{2^2}$', '8']
    - ['$2^{-2}$', '1/4']
    - ['$2^0$', '1']
  distractors: ['-4', '0']
  explanation: |-
    $2^3 \cdot 2^2 = 2^5 = 32$ (add exponents). $\left(2^3\right)^2 = 2^6 = 64$ (multiply exponents). $\dfrac{2^5}{2^2} = 2^3 = 8$ (subtract exponents). $2^{-2} = \dfrac{1}{2^2} = \dfrac14$, a reciprocal, not $-4$. $2^0 = 1$, not 0.

- id: pre-m6-r2-q08
  lesson: pre-exp-rules
  topic: Exponent rules
  stem: 'Which expressions equal $\dfrac{1}{9}$? Select all that apply.'
  choices: ['$3^{-2}$', '$9^{-1}$', '$-3^{2}$', '$\left(\dfrac{1}{3}\right)^{2}$', '$(-3)^{-2}$', '$9^{0}$']
  answer: [0, 1, 3, 4]
  explanation: |-
    $3^{-2} = \tfrac{1}{9}$, $9^{-1} = \tfrac19$, $\left(\tfrac13\right)^2 = \tfrac19$, and $(-3)^{-2} = \dfrac{1}{(-3)^2} = \dfrac{1}{9}$ (an even power of a negative is positive). But $-3^2 = -(3^2) = -9$, and $9^0 = 1$.

- id: pre-m6-r2-q09
  lesson: pre-exp-rules
  type: order
  module_quiz: true
  topic: Exponent rules
  stem: 'Simplify $\dfrac{\left(x^2\right)^3 \cdot x}{x^9}$. Put the steps in order, starting with the first step after the original expression.'
  items: ['$\dfrac{x^6 \cdot x}{x^9}$', '$\dfrac{x^7}{x^9}$', '$x^{-2}$', '$\dfrac{1}{x^2}$']
  explanation: |-
    Power of a power: $\left(x^2\right)^3 = x^6$. Product rule on top: $x^6 \cdot x^1 = x^7$. Quotient rule: $x^{7-9} = x^{-2}$. Negative exponent means reciprocal: $\dfrac{1}{x^2}$.

- id: pre-m6-r2-q10
  lesson: pre-exp-rules
  type: text
  topic: Exponent rules
  stem: '$4^{-1} + 4^{0} =$ ___ (as a fraction or decimal)'
  accept: ['5/4', '1.25', '1 1/4']
  explanation: |-
    $4^{-1} = \tfrac14$ and $4^0 = 1$, so the sum is $\tfrac14 + 1 = \tfrac54 = 1.25$.

# --- pre-sci-notation ---
- id: pre-m6-r2-q11
  lesson: pre-sci-notation
  type: label
  module_quiz: true
  topic: Scientific notation
  stem: 'Name the numbered parts of this number written in scientific notation.'
  image: {src: images/pre-m6-sci-anatomy-blank.svg, alt: 'The expression 4.05 times 10 to the minus 4, equals 0.000405, with numbered markers under 4.05, under 10, above the minus 4, and under 0.000405.'}
  labels:
    - {x: 21.25, y: 64.3, text: Coefficient}
    - {x: 46.9, y: 64.3, text: Base}
    - {x: 55.6, y: 17, text: Exponent}
    - {x: 82.5, y: 64.3, text: Standard form}
  distractors: [Radicand, Quotient]
  explanation: |-
    4.05 is the coefficient (at least 1 and less than 10), 10 is the base, $-4$ is the exponent (how many places the point moves, negative for a number less than 1), and 0.000405 is the same number in standard form.

- id: pre-m6-r2-q12
  lesson: pre-sci-notation
  type: text
  topic: Scientific notation
  stem: 'Write 0.00093 in scientific notation: $9.3 \times 10^{n}$, where $n =$ ___. (Give only the number.)'
  accept: ['-4', '−4']
  explanation: |-
    Moving the point 4 places right turns 0.00093 into 9.3. The number is less than 1, so the exponent is negative: $9.3 \times 10^{-4}$.

- id: pre-m6-r2-q13
  lesson: pre-sci-notation
  type: order
  topic: Scientific notation
  stem: 'Put these numbers in order from least to greatest.'
  items: ['$9.5 \times 10^{-3}$', '$2.1 \times 10^{-2}$', '$7 \times 10^{-2}$', '$1.04 \times 10^{0}$', '$3 \times 10^{2}$']
  explanation: |-
    Compare exponents first: $-3 < -2 < 0 < 2$. The two numbers with exponent $-2$ are compared by coefficient: $2.1 < 7$. In standard form: $0.0095 < 0.021 < 0.07 < 1.04 < 300$.

- id: pre-m6-r2-q14
  lesson: pre-sci-notation
  module_quiz: true
  topic: Scientific notation
  stem: 'Which numbers are written correctly in scientific notation? Select all that apply.'
  choices: ['$6.02 \times 10^{23}$', '$0.9 \times 10^{4}$', '$1 \times 10^{-7}$', '$10.5 \times 10^{2}$', '$9.99 \times 10^{0}$']
  answer: [0, 2, 4]
  explanation: |-
    The coefficient must be at least 1 and less than 10, and the exponent an integer. 6.02, 1 and 9.99 qualify (an exponent of 0 is allowed). 0.9 is too small (write $9 \times 10^3$) and 10.5 is too big (write $1.05 \times 10^3$).

- id: pre-m6-r2-q15
  lesson: pre-sci-notation
  type: match
  topic: Scientific notation
  stem: 'Match each number in scientific notation to its standard form.'
  pairs:
    - ['$4.5 \times 10^{3}$', '4,500']
    - ['$4.5 \times 10^{0}$', '4.5']
    - ['$4.5 \times 10^{-1}$', '0.45']
    - ['$4.5 \times 10^{-3}$', '0.0045']
  distractors: ['45,000', '0.00045']
  explanation: |-
    Multiplying by $10^n$ moves the point $n$ places right; a negative exponent moves it left. $4.5 \times 10^3$: 3 right, 4,500. $4.5 \times 10^0 = 4.5 \times 1 = 4.5$. $4.5 \times 10^{-1}$: 1 left, 0.45. $4.5 \times 10^{-3}$: 3 left, 0.0045.

# --- pre-m6-h-radicals (honors) ---
- id: pre-m6-r2-h01
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Write $\sqrt{48}$ in simplest radical form.'
  choices: ['$4\sqrt{3}$', '$2\sqrt{12}$', '$16\sqrt{3}$', '$3\sqrt{4}$']
  answer: 0
  explanation: |-
    The largest perfect square dividing 48 is 16: $\sqrt{48} = \sqrt{16 \cdot 3} = 4\sqrt3$. $2\sqrt{12}$ equals the same number but isn't finished, since 12 still contains 4. $16\sqrt3$ forgets to take the root of 16, and $3\sqrt4$ takes the root of the wrong factor.

- id: pre-m6-r2-h02
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Simplify $\sqrt{12} \cdot \sqrt{3}$.'
  choices: ['$\sqrt{15}$', '36', '6', '$3\sqrt{2}$']
  answer: 2
  explanation: |-
    Product rule: $\sqrt{12} \cdot \sqrt{3} = \sqrt{36} = 6$. ($\sqrt{15}$ adds the radicands instead of multiplying, and 36 forgets the square root.)

- id: pre-m6-r2-h03
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Simplify $3\sqrt{2} + 5\sqrt{8}$.'
  choices: ['$8\sqrt{10}$', '$13\sqrt{2}$', '$8\sqrt{2}$', '$15\sqrt{16}$']
  answer: 1
  explanation: |-
    Simplify first: $\sqrt8 = 2\sqrt2$, so $5\sqrt8 = 10\sqrt2$. Now they are like radicals: $3\sqrt2 + 10\sqrt2 = 13\sqrt2$. ($8\sqrt2$ forgets to simplify $\sqrt8$; $8\sqrt{10}$ adds the radicands; $15\sqrt{16}$ multiplies the coefficients and the radicands, which is only right for a product.)

- id: pre-m6-r2-h04
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Rationalize the denominator: $\dfrac{10}{\sqrt{5}}$.'
  choices: ['$10\sqrt{5}$', '$\dfrac{\sqrt{10}}{5}$', '$\sqrt{2}$', '$2\sqrt{5}$']
  answer: 3
  explanation: |-
    Multiply top and bottom by $\sqrt5$: $\dfrac{10\sqrt5}{5} = 2\sqrt5$. ($10\sqrt5$ multiplies the top only, which changes the value. $\sqrt2$ divides 10 by 5 as if 10 were under the root too, and $\tfrac{\sqrt{10}}{5}$ moves the 10 under the root.) Check: $\tfrac{10}{2.236} \approx 4.47$ and $2\sqrt5 \approx 4.47$.

- id: pre-m6-r2-h05
  lesson: pre-m6-h-radicals
  topic: Fractional exponents
  stem: 'Evaluate $27^{2/3}$.'
  choices: ['9', '18', '$\dfrac{1}{9}$', '243']
  answer: 0
  explanation: |-
    The denominator 3 is a cube root and the numerator 2 a square: $\sqrt[3]{27} = 3$ and $3^2 = 9$. (18 multiplies 27 by $\tfrac23$; $\tfrac19$ would be $27^{-2/3}$; 243 squares 27 to get 729 and then divides by 3 instead of taking the cube root.)

- id: pre-m6-r2-h06
  lesson: pre-m6-h-radicals
  topic: Fractional exponents
  stem: 'Evaluate $64^{-1/2}$.'
  choices: ['$-8$', '$-32$', '$\dfrac{1}{8}$', '$\dfrac{1}{32}$']
  answer: 2
  explanation: |-
    $64^{1/2} = \sqrt{64} = 8$, and the negative sign means reciprocal: $\tfrac18$. It is positive. (32 comes from multiplying 64 by $\tfrac12$.)

- id: pre-m6-r2-h07
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Which expression is in simplest radical form?'
  choices: ['$\sqrt{20}$', '$\dfrac{3}{\sqrt{2}}$', '$\sqrt{\dfrac{1}{5}}$', '$5\sqrt{6}$']
  answer: 3
  explanation: |-
    6 has no perfect-square factor other than 1, and there is no fraction under the root or radical in a denominator. $\sqrt{20} = 2\sqrt5$ has a perfect-square factor, $\dfrac{3}{\sqrt2}$ has a radical in the denominator, and $\sqrt{\tfrac15}$ has a fraction under the radical (it equals $\tfrac{\sqrt5}{5}$).

- id: pre-m6-r2-h08
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'Evaluate $\left(3\sqrt{5}\right)^2$.'
  choices: ['15', '45', '225', '$9\sqrt{5}$']
  answer: 1
  explanation: |-
    The power applies to both factors: $3^2 \cdot \left(\sqrt5\right)^2 = 9 \cdot 5 = 45$. (15 forgets to square the 3; $9\sqrt5$ forgets to square the root; 225 treats $\sqrt5$ as 5, giving $15^2$.)

- id: pre-m6-r2-h09
  lesson: pre-m6-h-radicals
  topic: Radicals
  stem: 'A tilted square drawn on graph paper has an area of 18 square units. What is its side length in simplest radical form?'
  choices: ['$9\sqrt{2}$', '$2\sqrt{3}$', '$3\sqrt{2}$', '$6\sqrt{3}$']
  answer: 2
  explanation: |-
    The side is $\sqrt{18} = \sqrt{9 \cdot 2} = 3\sqrt2$, about 4.24. ($9\sqrt2$ forgets to take the root of 9.)

- id: pre-m6-r2-h10
  lesson: pre-m6-h-radicals
  type: text
  topic: Radicals
  stem: 'Write $\sqrt{200}$ in simplest radical form $a\sqrt{b}$: $a =$ ___ and $b =$ ___.'
  accept:
    - ['10']
    - ['2']
  explanation: |-
    The largest perfect square dividing 200 is 100: $\sqrt{200} = \sqrt{100 \cdot 2} = 10\sqrt2$. (Using 4 gives $2\sqrt{50}$, which isn't finished: $\sqrt{50} = 5\sqrt2$.)

- id: pre-m6-r2-h11
  lesson: pre-m6-h-radicals
  type: text
  topic: Fractional exponents
  stem: '$16^{3/4} =$ ___'
  accept: ['8']
  explanation: |-
    The fourth root of 16 is 2, because $2^4 = 16$. Then $2^3 = 8$.

- id: pre-m6-r2-h12
  lesson: pre-m6-h-radicals
  type: order
  topic: Radicals
  stem: 'Put the steps for simplifying $\sqrt{252}$ by prime factorization in order.'
  items: ['$\sqrt{2 \cdot 2 \cdot 3 \cdot 3 \cdot 7}$', '$\sqrt{2^2 \cdot 3^2} \cdot \sqrt{7}$', '$2 \cdot 3\sqrt{7}$', '$6\sqrt{7}$']
  explanation: |-
    Factor: $252 = 2 \cdot 2 \cdot 3 \cdot 3 \cdot 7$. Split off the pairs with the product rule. Each pair leaves the radical as one factor: 2 and 3. Multiply: $6\sqrt7$. Check: $36 \times 7 = 252$.

- id: pre-m6-r2-h13
  lesson: pre-m6-h-radicals
  type: match
  topic: Radicals
  stem: 'Match each square root to its simplest radical form.'
  pairs:
    - ['$\sqrt{50}$', '5√2']
    - ['$\sqrt{27}$', '3√3']
    - ['$\sqrt{98}$', '7√2']
    - ['$\sqrt{45}$', '3√5']
  distractors: ['2√5', '9√3']
  explanation: |-
    $50 = 25 \cdot 2$, $27 = 9 \cdot 3$, $98 = 49 \cdot 2$ and $45 = 9 \cdot 5$; take the root of the perfect square outside. $2\sqrt5 = \sqrt{20}$ and $9\sqrt3 = \sqrt{243}$ match none of them.

- id: pre-m6-r2-h14
  lesson: pre-m6-h-radicals
  topic: Fractional exponents
  stem: 'Which expressions equal 4? Select all that apply.'
  choices: ['$16^{1/2}$', '$8^{2/3}$', '$\sqrt{2} \cdot \sqrt{8}$', '$64^{1/2}$', '$2^{1/2} \cdot 2^{3/2}$', '$\sqrt{8} + \sqrt{8}$']
  answer: [0, 1, 2, 4]
  explanation: |-
    $16^{1/2} = \sqrt{16} = 4$. $8^{2/3} = \left(\sqrt[3]{8}\right)^2 = 2^2 = 4$. $\sqrt2 \cdot \sqrt8 = \sqrt{16} = 4$. $2^{1/2} \cdot 2^{3/2} = 2^{2} = 4$. But $64^{1/2} = 8$, and $\sqrt8 + \sqrt8 = 2\sqrt8 = 4\sqrt2 \approx 5.66$: roots don't add like that.

- id: pre-m6-r2-h15
  lesson: pre-m6-h-radicals
  type: label
  topic: Radicals
  stem: 'The expression is "4 times the cube root of 10." Name the numbered parts.'
  image: {src: images/pre-m6-radical-parts-blank.svg, alt: 'A large 4, then a radical sign with a small 3 in its crook, and the number 10 under the radical, with numbered markers on the 4, the small 3, the radical sign and the 10.'}
  labels:
    - {x: 28.75, y: 79, text: Coefficient}
    - {x: 38.1, y: 27, text: Index}
    - {x: 44, y: 50, text: Radical sign}
    - {x: 60.6, y: 79, text: Radicand}
  distractors: [Exponent, Base]
  explanation: |-
    The 4 in front is the coefficient (it multiplies the root). The small 3 is the index: it makes this a cube root. The symbol itself is the radical sign, and 10, the number under it, is the radicand.

# --- pre-m6-h-sig-figs (honors) ---
- id: pre-m6-r2-h16
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'How many significant figures does 0.03040 have?'
  choices: ['6', '4', '3', '5']
  answer: 1
  explanation: |-
    The leading zeros (0.0) only place the point and don't count. The 3, the 0 between 3 and 4, the 4, and the trailing 0 after the decimal point all count: 4.

- id: pre-m6-r2-h17
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'Round 0.006358 to 2 significant figures.'
  choices: ['0.0063', '0.01', '0.0064', '0.00636']
  answer: 2
  explanation: |-
    The first two significant digits are 6 and 3; the next digit is 5, so round up: 0.0064. (0.0063 truncates instead of rounding; 0.00636 keeps 3 significant figures.)

- id: pre-m6-r2-h18
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'A tile measures 6.4 cm by 2.135 cm. What is its area, rounded correctly?'
  choices: ['13.664 cm²', '13.66 cm²', '13.7 cm²', '14 cm²']
  answer: 3
  explanation: |-
    $6.4 \times 2.135 = 13.664$. It's a product, so keep the fewest significant figures: 6.4 has 2, so the area is 14 cm².

- id: pre-m6-r2-h19
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'Find the total of 25.1 g, 3.26 g and 0.457 g, rounded correctly.'
  choices: ['28.8 g', '28.82 g', '28.817 g', '29 g']
  answer: 0
  explanation: |-
    The exact sum is 28.817 g. It's a sum, so round to the place of the least precise measurement: 25.1 g is known to tenths, so the total is 28.8 g. (29 g rounds to the ones place, throwing away the tenths digit that 25.1 g does support; 28.82 g and 28.817 g keep digits that 25.1 g can't support.)

- id: pre-m6-r2-h20
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'A crowd was counted to the nearest ten as 1,500 people. Which shows this in scientific notation with the right number of significant figures?'
  choices: ['$1.5 \times 10^{3}$', '$1.50 \times 10^{3}$', '$15.0 \times 10^{2}$', '$1.500 \times 10^{3}$']
  answer: 1
  explanation: |-
    To the nearest ten, the digits 1, 5 and the tens-place 0 are known: 3 significant figures, $1.50 \times 10^3$. $1.5 \times 10^3$ claims only the nearest hundred, $1.500 \times 10^3$ claims the nearest one, and $15.0 \times 10^2$ isn't in scientific notation.

- id: pre-m6-r2-h21
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'A recipe needs 2.25 cups of flour, and you make exactly 3 batches. How should the total be written?'
  choices: ['7 cups', '6.75 cups', '6.8 cups', '6.750 cups']
  answer: 1
  explanation: |-
    $3 \times 2.25 = 6.75$. The 3 is an exact count, so it doesn't limit the answer; 2.25 has 3 significant figures, so the total is 6.75 cups. (Treating 3 as a 1-significant-figure measurement would wrongly give 7.)

- id: pre-m6-r2-h22
  lesson: pre-m6-h-sig-figs
  topic: Powers of ten
  stem: 'Earth''s mass is about $5.97 \times 10^{24}$ kg and the Moon''s about $7.35 \times 10^{22}$ kg. About how many times as massive as the Moon is Earth?'
  choices: ['about 2', 'about 0.8', 'about 800', 'about 80']
  answer: 3
  explanation: |-
    $\dfrac{5.97}{7.35} \times 10^{24-22} \approx 0.812 \times 10^2 = 81.2$, about 80. Subtracting exponents alone gives 100, but the coefficient ratio 0.81 brings it down to about 80. (About 2 subtracts the exponents and stops; 0.8 forgets the power of ten.)

- id: pre-m6-r2-h23
  lesson: pre-m6-h-sig-figs
  topic: Powers of ten
  stem: 'A virus is 120 nanometers across. How many meters is that?'
  choices: ['$1.2 \times 10^{-7}$ m', '$1.2 \times 10^{-11}$ m', '$1.2 \times 10^{-9}$ m', '$1.2 \times 10^{7}$ m']
  answer: 0
  explanation: |-
    Nano- means $10^{-9}$: $120 \times 10^{-9} = 1.2 \times 10^{2} \times 10^{-9} = 1.2 \times 10^{-7}$ m. ($1.2 \times 10^{-9}$ forgets that 120 is 1.2 hundreds; $1.2 \times 10^{-11}$ adjusts the exponent the wrong way.)

- id: pre-m6-r2-h24
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'A student times three swings of a pendulum: 2.31 s, 2.28 s and 2.36 s. What is the average, rounded correctly?'
  choices: ['2.3 s', '2.3167 s', '2.32 s', '2 s']
  answer: 2
  explanation: |-
    Sum: $2.31 + 2.28 + 2.36 = 6.95$ s (to hundredths, 3 significant figures). Divide by the exact count 3: $6.95 \div 3 = 2.3166\ldots$ Keep 3 significant figures: 2.32 s.

- id: pre-m6-r2-h25
  lesson: pre-m6-h-sig-figs
  type: label
  topic: Significant figures
  stem: 'The number 0.004050 is written digit by digit. Name what each numbered digit is.'
  image: {src: images/pre-m6-sigfig-zeros-blank.svg, alt: 'The number 0.004050 with each digit in its own box and the decimal point between the first two boxes. Numbered markers sit on the first zero after the point, on the 4, on the zero between 4 and 5, and on the last zero.'}
  labels:
    - {x: 33, y: 57, text: Leading zero (not significant)}
    - {x: 52, y: 57, text: Nonzero digit (significant)}
    - {x: 61.5, y: 57, text: Zero between nonzero digits (significant)}
    - {x: 80.5, y: 57, text: Trailing zero after the decimal point (significant)}
  distractors: [Trailing zero in a whole number (ambiguous)]
  explanation: |-
    1: a zero before the first nonzero digit only places the decimal point, so it is a leading zero and not significant. 2: the 4 is nonzero, so it counts. 3: a zero sandwiched between 4 and 5 counts. 4: a zero at the end after a decimal point was measured, so it counts. In all, 0.004050 has 4 significant figures.

- id: pre-m6-r2-h26
  lesson: pre-m6-h-sig-figs
  type: text
  topic: Significant figures
  stem: '$6.020 \times 10^{23}$ has ___ significant figures.'
  accept: ['4', 'four']
  explanation: |-
    In scientific notation every digit of the coefficient is significant: 6, 0, 2 and the trailing 0 make 4.

- id: pre-m6-r2-h27
  lesson: pre-m6-h-sig-figs
  type: text
  topic: Significant figures
  stem: 'Round 86,451 to 3 significant figures and write it as $a \times 10^4$: $a =$ ___'
  accept: ['8.65']
  explanation: |-
    Keep 8, 6, 4; the next digit is 5, so round up to 86,500. In scientific notation that is $8.65 \times 10^4$.

- id: pre-m6-r2-h28
  lesson: pre-m6-h-sig-figs
  type: order
  topic: Powers of ten
  stem: 'Put these lengths in order from shortest to longest.'
  items: ['500 nm', '3 µm', '0.02 mm', '0.4 m', '2 km']
  explanation: |-
    In meters: 500 nm $= 5 \times 10^{-7}$, 3 µm $= 3 \times 10^{-6}$, 0.02 mm $= 2 \times 10^{-5}$, 0.4 m $= 4 \times 10^{-1}$, 2 km $= 2 \times 10^{3}$. The exponents increase, so that is the order.

- id: pre-m6-r2-h29
  lesson: pre-m6-h-sig-figs
  type: match
  topic: Powers of ten
  stem: 'Match each metric prefix to the factor it stands for.'
  pairs:
    - [giga-, one billion]
    - [mega-, one million]
    - [micro-, one millionth]
    - [nano-, one billionth]
  distractors: [one thousandth, one thousand]
  explanation: |-
    giga- $= 10^9$ (a billion), mega- $= 10^6$ (a million), micro- $= 10^{-6}$ (a millionth), nano- $= 10^{-9}$ (a billionth). A thousandth is milli- and a thousand is kilo-.

- id: pre-m6-r2-h30
  lesson: pre-m6-h-sig-figs
  topic: Significant figures
  stem: 'Which measurements have exactly 3 significant figures? Select all that apply.'
  choices: ['0.00250 kg', '305 m', '4.0 s', '$7.10 \times 10^{5}$ J', '0.040 L', '30.05 m']
  answer: [0, 1, 3]
  explanation: |-
    0.00250: leading zeros don't count, so 2, 5 and the trailing 0 make 3. 305: the middle zero counts, 3. $7.10 \times 10^5$: all coefficient digits, 3. But 4.0 has 2, 0.040 has 2 (4 and the trailing 0), and 30.05 has 4.
