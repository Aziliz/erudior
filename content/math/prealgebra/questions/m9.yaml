# Module 9: Data and probability
# --- pre-stats ---
- id: pre-q-3401
  lesson: pre-stats
  module_quiz: true
  topic: Measures of center
  stem: 'Find the mean of 12, 15, 9, 20 and 14.'
  choices: ['14', '70', '15', '17.5']
  answer: 0
  explanation: |-
    Sum: $12 + 15 + 9 + 20 + 14 = 70$. Divide by the count, 5: $70 \div 5 = 14$.

- id: pre-q-3402
  lesson: pre-stats
  module_quiz: true
  topic: Measures of center
  stem: 'Find the median of 7, 3, 12, 5, 9, 4.'
  choices: ['12', '6', '5', '7.5']
  answer: 1
  explanation: |-
    Order: 3, 4, 5, 7, 9, 12. With six values, average the two middle ones: $\tfrac{5 + 7}{2} = 6$. (12 is the middle of the unordered list.)

- id: pre-q-3403
  lesson: pre-stats
  topic: Measures of center
  stem: 'What is the mode of 4, 7, 4, 9, 7, 4, 2?'
  choices: ['7', '5.3', '4', '9']
  answer: 2
  explanation: |-
    4 appears three times, more than any other value, so the mode is 4.

- id: pre-q-3404
  module_quiz: true
  lesson: pre-stats
  topic: Range
  stem: 'Find the range of 18, 32, 25, 11, 29.'
  choices: ['43', '11 to 32', '25', '21']
  answer: 3
  explanation: |-
    Range = maximum − minimum $= 32 - 11 = 21$. The range is a single number, not a pair.

- id: pre-q-3405
  lesson: pre-stats
  module_quiz: true
  topic: Measures of center
  stem: 'Ty''s scores on four tests are 78, 85, 92 and 81. What must he score on the fifth test to have a mean of 85?'
  choices: ['89', '85', '84', '90']
  answer: 0
  explanation: |-
    Needed total: $85 \times 5 = 425$. Current total: $78 + 85 + 92 + 81 = 336$. He needs $425 - 336 = 89$.

- id: pre-q-3406
  lesson: pre-stats
  topic: Measures of center
  stem: 'Home prices on a street (in thousands of dollars) are 210, 225, 240, 230 and 1,150. Which measure best describes a typical price?'
  choices: ['The mean, because it uses every value', 'The median, because 1,150 is an outlier', 'The range, because prices vary', 'The mode, because prices repeat']
  answer: 1
  explanation: |-
    The 1,150 price pulls the mean up to 411 thousand, above four of the five prices. The median, 230 thousand, is unaffected by the outlier and describes a typical home better.

- id: pre-q-3407
  lesson: pre-stats
  topic: Measures of center
  stem: 'The mean of five numbers is 16. Four of them are 12, 18, 20 and 14. What is the fifth?'
  choices: ['80', '14', '16', '18']
  answer: 2
  explanation: |-
    Total: $5 \times 16 = 80$. Known sum: $12 + 18 + 20 + 14 = 64$. Fifth: $80 - 64 = 16$.

- id: pre-q-3408
  lesson: pre-stats
  topic: Measures of center
  stem: 'Adding a value of 100 to the data set 4, 5, 6, 7, 8 changes which measure the most?'
  choices: ['The median', 'None of them change', 'The mode', 'The mean']
  answer: 3
  explanation: |-
    The mean jumps from 6 to $130 \div 6 \approx 21.7$. The median only moves from 6 to 6.5. Outliers pull the mean strongly.

- id: pre-q-3409
  lesson: pre-stats
  topic: Measures of center
  stem: 'Which data set has no mode?'
  choices: ['4, 6, 8, 10', '1, 1, 2, 2, 3', '2, 3, 3, 5', '7, 7, 7, 8']
  answer: 0
  explanation: |-
    In 4, 6, 8, 10 every value appears once, so no value is most frequent. (1, 1, 2, 2, 3 has two modes, 1 and 2; 2, 3, 3, 5 has mode 3; 7, 7, 7, 8 has mode 7.)

- id: pre-q-3410
  lesson: pre-stats
  topic: Range
  stem: 'Two classes have the same mean score, 75. Class A''s scores range from 70 to 80; Class B''s range from 45 to 100. What does this tell you?'
  choices: ['Class B did better', 'Class A''s scores are more consistent', 'Class A had a higher median', 'The classes performed identically']
  answer: 1
  explanation: |-
    The ranges are 10 and 55. Same center, but Class A's scores are much less spread out, so they are more consistent. The means alone don't show this.

- id: pre-q-3411
  lesson: pre-stats
  topic: Measures of center
  stem: 'The mean of 8 numbers is 10. A ninth number is added and the mean becomes 11. What number was added?'
  choices: ['11', '1', '19', '99']
  answer: 2
  explanation: |-
    Old total: $8 \times 10 = 80$. New total: $9 \times 11 = 99$. Added number: $99 - 80 = 19$.

# --- pre-graphs ---
- id: pre-q-3501
  lesson: pre-graphs
  module_quiz: true
  topic: Tables and graphs
  stem: 'A bar graph shows students'' favorite sports: soccer 14, basketball 9, baseball 6, tennis 5, other 6. How many students were surveyed?'
  choices: ['14', '35', '8', '40']
  answer: 3
  explanation: |-
    Add the bars: $14 + 9 + 6 + 5 + 6 = 40$.

- id: pre-q-3502
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'Using the same survey (soccer 14, basketball 9, baseball 6, tennis 5, other 6 out of 40), what percent chose soccer?'
  choices: ['35%', '14%', '28%', '40%']
  answer: 0
  explanation: |-
    $14 \div 40 = 0.35 = 35\%$.

- id: pre-q-3503
  lesson: pre-graphs
  module_quiz: true
  topic: Tables and graphs
  stem: 'A circle graph shows a \$2,400 monthly budget, with 30% for housing. How many dollars go to housing?'
  choices: ['\$30', '\$720', '\$80', '\$800']
  answer: 1
  explanation: |-
    $0.30 \times 2{,}400 = 720$ dollars.

- id: pre-q-3504
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'In a circle graph, a category makes up 15% of the total. What is the angle of its sector?'
  choices: ['15°', '24°', '54°', '150°']
  answer: 2
  explanation: |-
    $0.15 \times 360° = 54°$.

- id: pre-q-3505
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'Which display is best for showing how a city''s population changed each year from 2010 to 2020?'
  choices: ['Circle graph', 'Pictograph of one year', 'A single table cell', 'Line graph']
  answer: 3
  explanation: |-
    Line graphs show change over time. Circle graphs show parts of a whole at one moment.

- id: pre-q-3506
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'A line graph of a plant''s height shows 4 cm in week 1, 7 cm in week 2, 12 cm in week 3 and 14 cm in week 4. During which week-to-week interval did it grow the most?'
  choices: ['Week 2 to 3', 'Week 1 to 2', 'Week 3 to 4', 'It grew the same each week']
  answer: 0
  explanation: |-
    Growth: 3 cm, then 5 cm, then 2 cm. The largest change, 5 cm, is from week 2 to week 3: the steepest segment on the graph.

- id: pre-q-3507
  lesson: pre-graphs
  module_quiz: true
  topic: Tables and graphs
  stem: 'A table shows a store''s sales: \$12,500 in March and \$15,000 in April. What was the percent increase?'
  choices: ['2.5%', '20%', '16.7%', '25%']
  answer: 1
  explanation: |-
    $(15{,}000 - 12{,}500) \div 12{,}500 = 2{,}500 \div 12{,}500 = 0.2 = 20\%$. (16.7% divides by the April value.)

- id: pre-q-3508
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'A bar graph''s vertical axis starts at 90 instead of 0. Bar A shows 95 and bar B shows 100. What is misleading about the picture?'
  choices: ['Nothing; the bars are drawn to scale', 'Bar A looks larger than bar B', 'Bar B looks twice as tall as bar A, though B is only about 5% larger', 'The values cannot be read']
  answer: 2
  explanation: |-
    From a baseline of 90, the bars are 5 and 10 units tall, so B looks twice as big. In fact $100 \div 95 \approx 1.05$, only about 5% more.

- id: pre-q-3509
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'A circle graph of 600 voters shows 45% for Candidate A, 35% for B and the rest undecided. How many are undecided?'
  choices: ['20', '80', '210', '120']
  answer: 3
  explanation: |-
    Undecided: $100\% - 45\% - 35\% = 20\%$. Then $0.20 \times 600 = 120$ voters.

- id: pre-q-3510
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'Daily high temperatures for a week were 61, 64, 58, 70, 66, 63 and 61 °F. What is the mean, to the nearest tenth?'
  choices: ['63.3 °F', '61.0 °F', '64.0 °F', '443.0 °F']
  answer: 0
  explanation: |-
    Sum: $61 + 64 + 58 + 70 + 66 + 63 + 61 = 443$. Mean: $443 \div 7 \approx 63.3$ °F. (61 is the mode; 64 is the midrange.)

- id: pre-q-3511
  lesson: pre-graphs
  topic: Tables and graphs
  stem: 'Which display best shows what fraction of a company''s budget goes to each department?'
  choices: ['Line graph', 'Circle graph', 'Number line', 'Scatter of dates']
  answer: 1
  explanation: |-
    A circle graph shows parts of a whole as sectors that add to 100%.

# --- pre-probability ---
- id: pre-q-3601
  lesson: pre-probability
  module_quiz: true
  topic: Probability
  stem: 'A bag has 4 red, 6 blue and 2 green marbles. What is the probability of drawing a blue marble at random?'
  choices: ['$\dfrac{1}{6}$', '$\dfrac{1}{3}$', '$\dfrac{1}{2}$', '$\dfrac{3}{5}$']
  answer: 2
  explanation: |-
    There are $4 + 6 + 2 = 12$ marbles and 6 are blue: $\tfrac{6}{12} = \tfrac12$. ($\tfrac35$ divides by the 10 non-green marbles, the wrong total.)

- id: pre-q-3602
  lesson: pre-probability
  topic: Probability
  stem: 'A fair die is rolled. What is the probability of rolling a number greater than 4?'
  choices: ['$\dfrac{1}{6}$', '$\dfrac{1}{2}$', '$\dfrac{2}{3}$', '$\dfrac{1}{3}$']
  answer: 3
  explanation: |-
    Greater than 4 means 5 or 6: 2 of 6 outcomes, $\tfrac26 = \tfrac13$.

- id: pre-q-3603
  lesson: pre-probability
  module_quiz: true
  topic: Probability
  stem: 'The probability of rain tomorrow is 0.35. What is the probability it does not rain?'
  choices: ['0.65', '0.35', '1.35', '0.5']
  answer: 0
  explanation: |-
    Complement: $1 - 0.35 = 0.65$.

- id: pre-q-3604
  lesson: pre-probability
  topic: Probability
  stem: 'Which of these cannot be a probability?'
  choices: ['0', '$\dfrac{7}{5}$', '0.99', '100%']
  answer: 1
  explanation: |-
    Probabilities lie between 0 and 1. $\tfrac75 = 1.4$ is greater than 1. (0 means impossible and 100% means certain; both are valid.)

- id: pre-q-3605
  lesson: pre-probability
  module_quiz: true
  topic: Probability
  stem: 'A coin is flipped and a die is rolled. What is the probability of tails and a 3?'
  choices: ['$\dfrac{1}{8}$', '$\dfrac{2}{3}$', '$\dfrac{1}{12}$', '$\dfrac{1}{4}$']
  answer: 2
  explanation: |-
    The events are independent: $\tfrac12 \times \tfrac16 = \tfrac{1}{12}$. ($\tfrac23 = \tfrac12 + \tfrac16$ adds instead of multiplying.)

- id: pre-q-3606
  lesson: pre-probability
  topic: Probability
  stem: 'Two fair dice are rolled. What is the probability that the sum is 10?'
  choices: ['$\dfrac{1}{11}$', '$\dfrac{1}{36}$', '$\dfrac{1}{6}$', '$\dfrac{1}{12}$']
  answer: 3
  explanation: |-
    Sums of 10: (4,6), (5,5), (6,4), which is 3 of 36 outcomes. $\tfrac{3}{36} = \tfrac{1}{12}$. ($\tfrac1{11}$ wrongly treats the 11 possible sums as equally likely.)

- id: pre-q-3607
  lesson: pre-probability
  topic: Probability
  stem: 'A spinner landed on red 18 times in 60 spins. What is the experimental probability of red?'
  choices: ['30%', '18%', '$\dfrac{18}{42}$', '60%']
  answer: 0
  explanation: |-
    $\tfrac{18}{60} = 0.3 = 30\%$. ($\tfrac{18}{42}$ compares red to not-red, a ratio, not a probability.)

- id: pre-q-3608
  lesson: pre-probability
  topic: Probability
  stem: 'A fair coin has landed heads 6 times in a row. What is the probability the next flip is heads?'
  choices: ['Less than $\tfrac12$, because tails is due', '$\tfrac12$', 'More than $\tfrac12$, because heads is on a streak', '$\left(\tfrac12\right)^7$']
  answer: 1
  explanation: |-
    Each flip is independent; the coin has no memory. The probability is still $\tfrac12$. Expecting tails to be "due" is the gambler's fallacy.

- id: pre-q-3609
  lesson: pre-probability
  topic: Probability
  stem: 'A machine makes defective parts with probability 0.02. About how many defective parts are expected in a batch of 1,500?'
  choices: ['2', '300', '30', '15']
  answer: 2
  explanation: |-
    Expected count = probability × trials $= 0.02 \times 1{,}500 = 30$.

- id: pre-q-3610
  lesson: pre-probability
  topic: Probability
  stem: 'A card is drawn from 10 cards numbered 1 to 10, replaced, and a second card is drawn. What is the probability both are even?'
  choices: ['$\dfrac{1}{2}$', '1', '$\dfrac{1}{5}$', '$\dfrac{1}{4}$']
  answer: 3
  explanation: |-
    With replacement the draws are independent: $\tfrac{5}{10} \times \tfrac{5}{10} = \tfrac14$. (1 adds the probabilities.)

- id: pre-q-3611
  lesson: pre-probability
  topic: Probability
  stem: 'A restaurant offers 3 appetizers, 5 entrees and 4 desserts. How many different three-course meals (one of each) are possible?'
  choices: ['60', '12', '35', '20']
  answer: 0
  explanation: |-
    By the counting principle, multiply the choices: $3 \times 5 \times 4 = 60$. (12 adds them.)
