# Round 2, module pre-m1: terms bolded in the new core picture text and the honors lessons.
- term: area model
  aliases: [area models]
  definition: 'A rectangle used to picture multiplication: its sides are split by place value (47 = 40 + 7), and the smaller rectangles are the partial products that add up to the whole product.'
  topic: Whole number operations
- term: number base
  aliases: [radix]
  definition: 'The number a place-value system groups by. In base $b$ each place is worth $b$ times the place to its right, and the digits run from 0 to $b - 1$.'
  topic: Number bases
- term: base-ten system
  aliases: [base ten, decimal system]
  definition: 'Our everyday place-value system: it groups by tens, uses the digits 0 to 9, and has places worth 1, 10, 100, 1,000, …'
  topic: Number bases
- term: binary
  aliases: [base two, binary number, binary numbers]
  definition: 'Base two: numbers written with only the digits 0 and 1, with places worth 1, 2, 4, 8, 16, … For example $1101_2 = 8 + 4 + 1 = 13$.'
  topic: Number bases
- term: bit
  aliases: [bits]
  definition: 'Short for binary digit: a single 0 or 1, the smallest unit of information a computer stores.'
  topic: Number bases
- term: byte
  aliases: [bytes]
  definition: 'A group of 8 bits. One byte can hold 256 different values, the whole numbers 0 through 255.'
  topic: Number bases
- term: hexadecimal
  aliases: [hex, base sixteen]
  definition: 'Base sixteen, with digits 0–9 and A–F (A = 10, …, F = 15) and places worth 1, 16, 256, … Each hexadecimal digit stands for exactly 4 bits.'
  topic: Number bases
- term: Euclidean algorithm
  aliases: [Euclid's algorithm]
  definition: 'A way to find the GCF of two whole numbers without factoring: divide the larger by the smaller, replace the pair with (divisor, remainder), and repeat until the remainder is 0. The last nonzero remainder is the GCF.'
  topic: Euclidean algorithm
- term: overestimate
  aliases: [overestimates]
  definition: 'An estimate that is larger than the exact value, for example from rounding every number in a sum or product up.'
  topic: Estimation
- term: underestimate
  aliases: [underestimates]
  definition: 'An estimate that is smaller than the exact value, for example from rounding every number in a sum or product down.'
  topic: Estimation
- term: Fermi problem
  aliases: [Fermi problems, Fermi estimate, Fermi estimates]
  definition: 'A rough estimate of a quantity that seems impossible to know, made by breaking it into pieces you can estimate and combining them. Named after the physicist Enrico Fermi.'
  topic: Estimation
- term: order of magnitude
  aliases: [orders of magnitude]
  definition: 'The rough size of a number given as a power of ten (tens, hundreds, thousands, …). Two quantities differ by one order of magnitude when one is about ten times the other.'
  topic: Estimation
