# Round 2 notecards for pre-m2 (Integers)
- {front: 'Zero pair', back: 'One $+1$ counter and one $-1$ counter: worth 0, so it can be removed. $-5 + 3$: remove 3 zero pairs, leaving $-2$.', topic: 'Adding integers'}
- {front: 'Integer laws that are kept', back: 'Commutative, associative, identity ($a + 0 = a$, $a \cdot 1 = a$), opposites ($a + (-a) = 0$) and distributive.', topic: 'Properties of integers'}
- {front: 'Fact A: the opposite test', back: 'If $a + x = 0$, then $x = -a$. Two numbers that add to 0 are opposites.', topic: 'Properties of integers'}
- {front: 'Why $a \times 0 = 0$', back: '$a \cdot 0 = a(0 + 0) = a \cdot 0 + a \cdot 0$; subtract $a \cdot 0$ from both sides.', topic: 'Properties of integers'}
- {front: 'Proof that $(-a)b = -(ab)$', back: '$ab + (-a)b = (a + (-a))b = 0 \cdot b = 0$, so $(-a)b$ is the opposite of $ab$.', topic: 'Properties of integers'}
- {front: 'Proof that $(-a)(-b) = ab$', back: '$(-a)(-b) + (-a)b = (-a)((-b) + b) = 0$, so $(-a)(-b)$ is the opposite of $-(ab)$, which is $ab$.', topic: 'Properties of integers'}
- {front: 'Multiplying by $-1$', back: 'Takes the opposite: flips the number across 0. Each negative factor is one flip.', topic: 'Properties of integers'}
- {front: 'Opposite of a sum', back: '$-(a + b) = (-a) + (-b)$; also $-(a - b) = b - a$.', topic: 'Properties of integers'}
- {front: 'Integers: closed under…', back: 'Addition, subtraction and multiplication; not division ($-7 \div 2$).', topic: 'Properties of integers'}
- {front: 'Counterexample', back: 'One case where a general claim fails, e.g. $(10 - 4) - 3 = 3$ but $10 - (4 - 3) = 9$: subtraction is not associative.', topic: 'Properties of integers'}
- {front: '$0 \div 0$ and $a \div 0$', back: 'Both undefined: no $q$ has $q \cdot 0 = a$ (for $a \ne 0$), and every $q$ has $q \cdot 0 = 0$.', topic: 'Properties of integers'}
- {front: 'Read $|x - a|$ as…', back: 'The distance from $x$ to $a$. $|x + 6|$ is the distance from $x$ to $-6$.', topic: 'Absolute value equations'}
- {front: 'Solutions of $|x - a| = d$', back: '$d > 0$: two, $a - d$ and $a + d$. $d = 0$: one, $a$. $d < 0$: none.', topic: 'Absolute value equations'}
- {front: 'First step for $3|x - 1| + 4 = 19$', back: 'Isolate the absolute value: $|x - 1| = 5$, so $x = -4$ or $6$.', topic: 'Absolute value equations'}
- {front: 'Midpoint of $a$ and $b$', back: '$\dfrac{a + b}{2}$, or $a$ plus half the distance: midpoint of $-11$ and 5 is $-3$.', topic: 'Distance and net change'}
- {front: 'Integers from $m$ to $n$', back: 'Both ends included: $n - m + 1$. Strictly between: $n - m - 1$.', topic: 'Distance and net change'}
- {front: '$|x - a| \le d$', back: 'All numbers from $a - d$ to $a + d$, ends included: $2d + 1$ integers.', topic: 'Distance and net change'}
- {front: 'Net change vs. distance traveled', back: 'Net change adds signed moves (final − start); distance adds their absolute values. $+7, -10$: net $-3$, distance 17.', topic: 'Distance and net change'}
- {front: 'Triangle inequality', back: '$|a + b| \le |a| + |b|$; equal when $a$, $b$ have the same sign or one is 0.', topic: 'Distance and net change'}
- {front: '$|ab|$', back: '$|a| \cdot |b|$: signs decide the sign, never the size.', topic: 'Distance and net change'}
