<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="sans-serif" fill="#1c2833">
<rect width="800" height="330" fill="#ffffff"/>
<polygon points="60,285 180,285 60,165" fill="#f7ebcf"/>
<polygon points="180,285 300,285 300,165" fill="#f7ebcf"/>
<polygon points="300,165 300,45 180,45" fill="#f7ebcf"/>
<polygon points="60,165 180,45 60,45" fill="#f7ebcf"/>
<polygon points="180,285 300,165 180,45 60,165" fill="#dde8f3"/>
<line x1="60" y1="45" x2="60" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="60" y1="45" x2="300" y2="45" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="120" y1="45" x2="120" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="60" y1="105" x2="300" y2="105" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="180" y1="45" x2="180" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="60" y1="165" x2="300" y2="165" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="240" y1="45" x2="240" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="60" y1="225" x2="300" y2="225" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="300" y1="45" x2="300" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<line x1="60" y1="285" x2="300" y2="285" stroke="#8a96a0" stroke-width="1.2"/>
<rect x="60" y="45" width="240" height="240" fill="none" stroke="#1c2833" stroke-width="2.5"/>
<polygon points="180,285 300,165 180,45 60,165" fill="none" stroke="#1c2833" stroke-width="3"/>
<text x="180" y="172" font-size="20" font-weight="bold" text-anchor="middle" fill="#1c2833">area 8</text>
<text x="254" y="95" font-size="18" text-anchor="start" transform="rotate(45 254 95)">√8</text>
<text x="120" y="309" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2833">2</text>
<text x="240" y="309" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2833">2</text>
<text x="46" y="231" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2833">2</text>
<text x="46" y="111" font-size="16" font-weight="normal" text-anchor="middle" fill="#1c2833">2</text>
<text x="360" y="70" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">Big square: 4 × 4 = 16</text>
<text x="360" y="102" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">Four corner triangles:</text>
<text x="360" y="134" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">  each ½ × 2 × 2 = 2, total 8</text>
<text x="360" y="166" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">Tilted square: 16 − 8 = 8</text>
<text x="360" y="198" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2833" xml:space="preserve">Side = √8</text>
<text x="360" y="230" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">Each side is also the diagonal of a</text>
<text x="360" y="262" font-size="18" font-weight="normal" text-anchor="start" fill="#1c2833" xml:space="preserve">2-by-2 square: 2 × √2 = 2√2</text>
<text x="360" y="294" font-size="18" font-weight="bold" text-anchor="start" fill="#1c2833" xml:space="preserve">So √8 = 2√2 ≈ 2.83</text>
</svg>