<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833"><title>Three divided by three quarters</title><rect x="0" y="0" width="640" height="250" fill="#ffffff"/><text x="320" y="30" font-size="17" text-anchor="middle" font-weight="bold">How many 3/4 pieces fit in 3 wholes?</text><rect x="30.0" y="60" width="45.0" height="60" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="52.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="75.0" y="60" width="45.0" height="60" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="97.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="120.0" y="60" width="45.0" height="60" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="142.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="165.0" y="60" width="45.0" height="60" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="187.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><text x="120.0" y="145" font-size="15" text-anchor="middle" font-weight="normal">whole 1</text><rect x="230.0" y="60" width="45.0" height="60" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="252.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="275.0" y="60" width="45.0" height="60" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="297.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="320.0" y="60" width="45.0" height="60" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="342.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="365.0" y="60" width="45.0" height="60" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="387.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><text x="320.0" y="145" font-size="15" text-anchor="middle" font-weight="normal">whole 2</text><rect x="430.0" y="60" width="45.0" height="60" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="452.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="475.0" y="60" width="45.0" height="60" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="497.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="520.0" y="60" width="45.0" height="60" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="542.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><rect x="565.0" y="60" width="45.0" height="60" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="587.5" y="96" font-size="15" text-anchor="middle" font-weight="normal">1/4</text><text x="520.0" y="145" font-size="15" text-anchor="middle" font-weight="normal">whole 3</text><text x="320" y="185" font-size="16" text-anchor="middle" font-weight="normal">Colors: each run of three quarters is one 3/4 piece.</text><text x="320" y="215" font-size="17" text-anchor="middle" font-weight="bold">There are 4 runs, so 3 ÷ 3/4 = 4.</text></svg>
