<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img"><title>A seven-position clock for the days of the week</title><rect x="0" y="0" width="560" height="470" fill="#ffffff"/><circle cx="280" cy="235" r="150" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><circle cx="280.0" cy="85.0" r="24" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="280.0" y="92.0" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">0</text><text x="280.0" y="39.0" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Sun</text><circle cx="397.3" cy="141.5" r="24" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="397.3" y="148.5" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">1</text><text x="437.9" y="115.1" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Mon</text><circle cx="426.2" cy="268.4" r="24" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="426.2" y="275.4" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">2</text><text x="476.9" y="285.9" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Tue</text><circle cx="345.1" cy="370.1" r="24" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="345.1" y="377.1" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">3</text><text x="367.6" y="423.0" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Wed</text><circle cx="214.9" cy="370.1" r="24" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="214.9" y="377.1" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">4</text><text x="192.4" y="423.0" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Thu</text><circle cx="133.8" cy="268.4" r="24" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="133.8" y="275.4" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">5</text><text x="83.1" y="285.9" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Fri</text><circle cx="162.7" cy="141.5" r="24" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="162.7" y="148.5" font-family="sans-serif" fill="#1c2833" font-size="20" text-anchor="middle" font-weight="bold">6</text><text x="122.1" y="115.1" font-family="sans-serif" fill="#1c2833" font-size="17" text-anchor="middle">Sat</text><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><path d="M378.8,270.5 A105,105 0 0 1 246.1,334.4" fill="none" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="280.0" y="223.0" font-family="sans-serif" fill="#1c2833" font-size="15" text-anchor="middle">100 days = 14 weeks + 2 days</text><text x="280.0" y="247.0" font-family="sans-serif" fill="#1c2833" font-size="15" text-anchor="middle">Tuesday (2) + 2 → Thursday (4)</text></svg>