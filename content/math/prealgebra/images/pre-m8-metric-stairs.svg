<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400" font-family="sans-serif" fill="#1c2833">
<rect width="660" height="400" fill="#ffffff"/>
<rect x="15" y="120" width="90" height="265" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="142.0" font-size="15" text-anchor="middle" font-weight="bold">kilo (k)</text>
<text x="60.0" y="164.0" font-size="16" text-anchor="middle">1,000</text>
<rect x="105" y="156" width="90" height="229" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="150.0" y="178.0" font-size="15" text-anchor="middle" font-weight="bold">hecto (h)</text>
<text x="150.0" y="200.0" font-size="16" text-anchor="middle">100</text>
<rect x="195" y="192" width="90" height="193" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="240.0" y="214.0" font-size="15" text-anchor="middle" font-weight="bold">deka (da)</text>
<text x="240.0" y="236.0" font-size="16" text-anchor="middle">10</text>
<rect x="285" y="228" width="90" height="157" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="330.0" y="250.0" font-size="15" text-anchor="middle" font-weight="bold">base unit</text>
<text x="330.0" y="272.0" font-size="16" text-anchor="middle">1</text>
<rect x="375" y="264" width="90" height="121" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="420.0" y="286.0" font-size="15" text-anchor="middle" font-weight="bold">deci (d)</text>
<text x="420.0" y="308.0" font-size="16" text-anchor="middle">0.1</text>
<rect x="465" y="300" width="90" height="85" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="510.0" y="322.0" font-size="15" text-anchor="middle" font-weight="bold">centi (c)</text>
<text x="510.0" y="344.0" font-size="16" text-anchor="middle">0.01</text>
<rect x="555" y="336" width="90" height="49" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="600.0" y="358.0" font-size="15" text-anchor="middle" font-weight="bold">milli (m)</text>
<text x="600.0" y="380.0" font-size="16" text-anchor="middle">0.001</text>
<text x="330.0" y="294.0" font-size="15" text-anchor="middle">m, g, L</text>
<text x="20.0" y="36.0" font-size="18" text-anchor="start" font-weight="bold">Metric prefixes: each step is a factor of 10</text>
<text x="330.0" y="72.0" font-size="15" text-anchor="start" font-weight="bold">One step down (to a smaller unit):</text>
<text x="330.0" y="94.0" font-size="15" text-anchor="start">multiply by 10, decimal point moves right</text>
<text x="330.0" y="128.0" font-size="15" text-anchor="start" font-weight="bold">One step up (to a larger unit):</text>
<text x="330.0" y="150.0" font-size="15" text-anchor="start">divide by 10, decimal point moves left</text>
</svg>
