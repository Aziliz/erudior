<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 310" width="560" height="310" role="img"><title>Cutting squares from a 48 by 18 rectangle</title><rect x="0" y="0" width="560" height="310" fill="#ffffff"/><rect x="40" y="50" width="180" height="180" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><rect x="220" y="50" width="180" height="180" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="130" y="146" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">18 × 18</text><text x="310" y="146" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">18 × 18</text><rect x="400" y="50" width="120" height="120" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="460" y="116" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold">12 × 12</text><rect x="400" y="170" width="60" height="60" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><rect x="460" y="170" width="60" height="60" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="430" y="206" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="bold">6 × 6</text><text x="490" y="206" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="bold">6 × 6</text><text x="280" y="36" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold">48</text><text x="28" y="146" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="end" font-weight="bold">18</text><text x="280" y="264" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle">48 = 2 × 18 + 12,   18 = 1 × 12 + 6,   12 = 2 × 6 + 0</text><text x="280" y="290" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold">The smallest square, 6 × 6, tiles everything: GCF(48, 18) = 6</text></svg>