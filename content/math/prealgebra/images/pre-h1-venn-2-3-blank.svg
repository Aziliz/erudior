<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430" role="img"><title>Venn diagram of the multiples of 2 and of 3 from 1 to 30</title><rect x="0" y="0" width="620" height="430" fill="#ffffff"/><rect x="20" y="20" width="580" height="390" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="40.0" y="48.0" font-family="sans-serif" fill="#1c2833" font-size="16" text-anchor="start" font-weight="bold">Whole numbers 1 to 30</text><circle cx="235" cy="225" r="140" fill="#dde8f3" fill-opacity="0.85" stroke="#1c2833" stroke-width="2"/><circle cx="385" cy="225" r="140" fill="#f7ebcf" fill-opacity="0.75" stroke="#1c2833" stroke-width="2"/><circle cx="235" cy="225" r="140" fill="none" stroke="#1c2833" stroke-width="2"/><text x="180.0" y="78.0" font-family="sans-serif" fill="#1c2833" font-size="16" text-anchor="middle" font-weight="bold">Multiples of 2</text><text x="440.0" y="78.0" font-family="sans-serif" fill="#1c2833" font-size="16" text-anchor="middle" font-weight="bold">Multiples of 3</text></svg>