<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" width="560" height="410" role="img"><title>Area model for 47 times 36</title><rect x="0" y="0" width="560" height="410" fill="#ffffff"/><rect x="110" y="70" width="300.0" height="225.0" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><rect x="410.0" y="70" width="52.5" height="225.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><rect x="110" y="295.0" width="300.0" height="45.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><rect x="410.0" y="295.0" width="52.5" height="45.0" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="260.0" y="56" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold">40</text><text x="436.25" y="56" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold">7</text><text x="92" y="188.5" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="end" font-weight="bold">30</text><text x="92" y="323.5" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="end" font-weight="bold">6</text><text x="260.0" y="188.5" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle">40 × 30 = 1,200</text><text x="436.25" y="178.5" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">7 × 30</text><text x="436.25" y="198.5" font-family="sans-serif" font-size="15" fill="#1c2833" text-anchor="middle">= 210</text><text x="260.0" y="323.5" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle">40 × 6 = 240</text><text x="474.5" y="323.5" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="start">7 × 6 = 42</text><text x="286.25" y="380.0" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">47 × 36 = 1,200 + 210 + 240 + 42 = 1,692</text></svg>