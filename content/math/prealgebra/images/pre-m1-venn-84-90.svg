<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 630 415" width="630" height="415" role="img"><title>Prime factors of 84 and 90 in a Venn diagram</title><rect x="0" y="0" width="630" height="415" fill="#ffffff"/><circle cx="230" cy="190" r="140" fill="#dde8f3" fill-opacity="0.85" stroke="#1c2833" stroke-width="2"/><circle cx="400" cy="190" r="140" fill="#f7ebcf" fill-opacity="0.75" stroke="#1c2833" stroke-width="2"/><circle cx="230" cy="190" r="140" fill="none" stroke="#1c2833" stroke-width="2"/><text x="165" y="185" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">2</text><text x="185" y="225" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">7</text><text x="315" y="175" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">2</text><text x="315" y="220" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">3</text><text x="455" y="175" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">3</text><text x="440" y="225" font-family="sans-serif" font-size="26" fill="#1c2833" text-anchor="middle" font-weight="bold">5</text><text x="160" y="36" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">84 = 2 × 2 × 3 × 7</text><text x="470" y="36" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">90 = 2 × 3 × 3 × 5</text><text x="315" y="368" font-family="sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold">GCF = middle = 2 × 3 = 6</text><text x="315" y="394" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold">LCM = everything = 2 × 7 × 2 × 3 × 3 × 5 = 1,260</text></svg>