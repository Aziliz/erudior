# Round 2, module pre-m8: terms from the honors lessons.
# --- Scaling ---
- term: square–cube law
  aliases: [square-cube law]
  definition: 'When every length of an object is multiplied by $k$, its surface area is multiplied by $k^2$ but its volume by $k^3$, so volume grows faster than surface area.'
  topic: Scaling
- term: surface-area-to-volume ratio
  aliases: [surface area to volume ratio]
  definition: 'Surface area divided by volume, $\tfrac{SA}{V}$; for a cube with edge $s$ it is $\tfrac{6}{s}$. Smaller objects of the same shape have larger ratios.'
  topic: Scaling
# --- Cones, pyramids and spheres ---
- term: pyramid
  aliases: [pyramids, square pyramid]
  definition: 'A solid with a polygon for a base and triangular faces that meet at one point, the apex. Volume $\tfrac13 Bh$.'
  topic: Cones, pyramids and spheres
- term: apex
  definition: 'The point at the top of a pyramid or cone, where the faces or the curved surface come together.'
  topic: Cones, pyramids and spheres
- term: cone
  aliases: [cones]
  definition: 'A solid with a circular base and a curved surface that narrows to a point, the apex. Volume $\tfrac13 \pi r^2 h$.'
  topic: Cones, pyramids and spheres
- term: slant height
  definition: 'The distance measured along the slanted surface of a cone (apex to edge of base) or pyramid (apex down the middle of a face), written $\ell$. Used for surface area, not volume.'
  topic: Cones, pyramids and spheres
- term: Cavalieri's principle
  definition: 'If two solids have the same height and every horizontal slice at the same level has the same area, the solids have the same volume.'
  topic: Cones, pyramids and spheres
- term: lateral surface
  aliases: [lateral area, lateral surface area]
  definition: 'The side surface of a solid, not counting its base or bases. For a cone its area is $\pi r \ell$.'
  topic: Cones, pyramids and spheres
- term: sphere
  aliases: [spheres]
  definition: 'All the points in space at the same distance $r$ from a center: the surface of a ball. Volume $\tfrac43 \pi r^3$, surface area $4\pi r^2$.'
  topic: Cones, pyramids and spheres
- term: hemisphere
  aliases: [hemispheres]
  definition: 'Half of a sphere: volume $\tfrac23 \pi r^3$, curved surface $2\pi r^2$.'
  topic: Cones, pyramids and spheres
# --- Measurement error ---
- term: precision
  aliases: [precise]
  definition: 'The size of the unit a measurement is rounded to: 7.2 cm, to the nearest 0.1 cm, has precision 0.1 cm. A smaller unit means a more precise measurement.'
  topic: Measurement error
- term: greatest possible error
  aliases: [GPE]
  definition: 'Half the precision of a measurement: the most the true value can differ from the rounded value. 7 cm to the nearest cm has a greatest possible error of 0.5 cm.'
  topic: Measurement error
- term: lower bound
  aliases: [lower bounds]
  definition: 'The smallest value the true quantity could have: the measurement minus the greatest possible error.'
  topic: Measurement error
- term: upper bound
  aliases: [upper bounds]
  definition: 'The value the true quantity must stay below (or at most reach): the measurement plus the greatest possible error.'
  topic: Measurement error
- term: accuracy
  aliases: [accurate]
  definition: 'How close a measurement is to the true value. Different from precision, which is how finely it is measured.'
  topic: Measurement error
- term: relative error
  definition: 'The greatest possible error divided by the measurement, often written as a percent; it compares the error with the size of what is measured.'
  topic: Measurement error
- term: percent error
  definition: '$\dfrac{|\text{measured} - \text{true}|}{\text{true}} \times 100\%$: how far a measurement is from a known true value, as a percent of the true value.'
  topic: Measurement error
- term: significant figures
  aliases: [significant digits, sig figs]
  definition: 'The digits of a measurement that carry information about its size (not placeholder zeros). A rule of thumb rounds a product or quotient to as many significant figures as its least precise input.'
  topic: Measurement error
