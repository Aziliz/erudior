# Round 2, module pre-m3 (Fractions): cards for the new pictures and the honors lessons.
- {front: 'Fraction wall', back: 'Equal bars cut into halves, thirds, quarters, …; pieces that line up are equal, e.g. $\tfrac12 = \tfrac24 = \tfrac36 = \tfrac{6}{12}$.', topic: 'Equivalent fractions'}
- {front: 'Complex fraction', back: 'A fraction with a fraction in its numerator, denominator or both, e.g. $\dfrac{\tfrac12 + \tfrac13}{\tfrac34 - \tfrac16}$.', topic: 'Complex fractions'}
- {front: 'Main fraction bar', back: 'The longest bar of a complex fraction: finish the top, finish the bottom, divide last.', topic: 'Complex fractions'}
- {front: '$\tfrac{3/4}{5}$ vs $\tfrac{3}{4/5}$', back: '$\tfrac{3}{20}$ vs $\tfrac{15}{4}$. On one line write (3/4)/5 or 3/(4/5); calculators read 3/4/5 as (3/4)/5.', topic: 'Complex fractions'}
- {front: 'Complex fraction, Method 1', back: 'Simplify the top and the bottom to single fractions, then multiply the top by the reciprocal of the bottom.', topic: 'Complex fractions'}
- {front: 'Complex fraction, Method 2', back: 'Multiply every term on top and bottom (whole numbers too) by the LCD of all the small denominators.', topic: 'Complex fractions'}
- {front: 'Why Method 2 is allowed', back: 'Multiplying top and bottom by the same nonzero number multiplies by $\tfrac kk = 1$.', topic: 'Complex fractions'}
- {front: 'Simplify $\dfrac{3 - \tfrac14}{2 + \tfrac56}$', back: 'Multiply every term by 12: $\dfrac{36 - 3}{24 + 10} = \dfrac{33}{34}$.', topic: 'Complex fractions'}
- {front: 'Continued fraction', back: 'A whole number plus 1 over (a whole number plus 1 over …), e.g. $1 + \cfrac{1}{2 + \cfrac{1}{3}} = \tfrac{10}{7}$.', topic: 'Continued fractions'}
- {front: 'Evaluating a continued fraction', back: 'Work from the bottom up: add, flip, add, flip, …', topic: 'Continued fractions'}
- {front: 'Building a continued fraction', back: 'Split off the whole number, flip the leftover fraction, and repeat until the leftover has numerator 1.', topic: 'Continued fractions'}
- {front: '$\tfrac{43}{30}$ as a continued fraction', back: '$1 + \cfrac{1}{2 + \cfrac{1}{3 + \cfrac{1}{4}}}$', topic: 'Continued fractions'}
- {front: 'Fraction approximations of $\pi$ from its continued fraction', back: '$3$, $\tfrac{22}{7}$, $\tfrac{333}{106}$, $\tfrac{355}{113}$: alternately below and above $\pi$, each closer than the last.', topic: 'Continued fractions'}
- {front: 'A fraction of what''s left', back: 'Multiply the fractions remaining after each step: spend $\tfrac13$, then $\tfrac14$ of the rest, leaves $\tfrac23 \times \tfrac34 = \tfrac12$.', topic: 'Fraction word problems'}
- {front: 'Finding the whole from a part', back: 'Divide the part by its fraction: if $\tfrac25$ of the whole is 12, the whole is $12 \div \tfrac25 = 30$.', topic: 'Fraction word problems'}
- {front: 'Spend $\tfrac13$, then $\tfrac14$ of the rest: why not $1 - \tfrac13 - \tfrac14$?', back: 'The $\tfrac14$ is of the remaining $\tfrac23$, so it is $\tfrac16$ of the whole, not $\tfrac14$.', topic: 'Fraction word problems'}
- {front: 'Work rate', back: 'Job per unit time: a job done alone in $t$ hours is done at $\tfrac1t$ job per hour.', topic: 'Combined rates'}
- {front: 'Working together', back: 'Add the rates (subtract a drain or leak), then time $= 1 \div$ combined rate.', topic: 'Combined rates'}
- {front: 'Two workers, times $a$ and $b$', back: 'Together: $\dfrac{ab}{a+b}$ (product over sum), less than either time alone.', topic: 'Combined rates'}
- {front: 'Average speed', back: 'Total distance ÷ total time.', topic: 'Combined rates'}
- {front: 'Harmonic mean of $a$ and $b$', back: '$\dfrac{2ab}{a+b}$: the average speed for equal distances at speeds $a$ and $b$, e.g. 30 and 60 mph give 40 mph.', topic: 'Combined rates'}
- {front: 'Equal times vs equal distances', back: 'Equal times at two speeds: plain average. Equal distances: harmonic mean, which is smaller.', topic: 'Combined rates'}
