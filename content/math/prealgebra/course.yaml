id: math-prealgebra
title: Pre-algebra and Arithmetic
description: >-
  Arithmetic and pre-algebra from place value up through the level of a college
  developmental math course: whole numbers, integers, fractions, decimals, ratios and
  proportions, percents, exponents and scientific notation, expressions and equations,
  measurement and basic geometry, and basic data and probability, with word problems
  throughout.
