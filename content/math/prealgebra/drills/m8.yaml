- id: pre-us-convert
  title: US customary conversions
  topic: Unit conversion
  vars:
    q: {min: 1.5, max: 12, step: 0.5}
    f:
      choices:
        - {label: 'feet to inches (12 in = 1 ft)', value: 12}
        - {label: 'yards to feet (3 ft = 1 yd)', value: 3}
        - {label: 'pounds to ounces (16 oz = 1 lb)', value: 16}
        - {label: 'gallons to quarts (4 qt = 1 gal)', value: 4}
        - {label: 'hours to minutes (60 min = 1 h)', value: 60}
        - {label: 'quarts to cups (4 c = 1 qt)', value: 4}
        - {label: 'tons to pounds (2,000 lb = 1 ton)', value: 2000}
  calc:
    v: q * f
  prompt: 'Convert {q} from {f}.'
  answers:
    - {name: v, label: Answer}
  solution: |-
    Going to a smaller unit makes the number larger, so multiply by the conversion factor: {q} × {f:int} = **{v}**.

- id: pre-metric-convert
  title: Metric conversions
  topic: Unit conversion
  vars:
    q: {min: 0.5, max: 900, step: 0.5}
    f:
      choices:
        - {label: 'kilometers to meters', value: 1000}
        - {label: 'meters to kilometers', value: 0.001}
        - {label: 'meters to centimeters', value: 100}
        - {label: 'centimeters to meters', value: 0.01}
        - {label: 'millimeters to centimeters', value: 0.1}
        - {label: 'grams to milligrams', value: 1000}
        - {label: 'grams to kilograms', value: 0.001}
        - {label: 'liters to milliliters', value: 1000}
        - {label: 'milliliters to liters', value: 0.001}
  calc:
    v: q * f
  prompt: 'Convert {q} from {f}.'
  answers:
    - {name: v, label: Answer, format: num4, relTolerance: 0.0001}
  solution: |-
    Metric prefixes are powers of 10: kilo = 1,000, centi = 1/100, milli = 1/1,000. Going from {f}, multiply by {f:num4}, which moves the decimal point: **{v:num4}**.

- id: pre-dim-analysis
  title: Convert miles per hour to feet per second
  topic: Dimensional analysis
  vars:
    v: {min: 10, max: 90, step: 5}
  calc:
    top: v * 5280
    fps: v * 5280 / 3600
  prompt: 'A car travels at {v} miles per hour. How fast is that in feet per second? (1 mi = 5,280 ft; round to 2 decimals.)'
  answers:
    - {name: fps, label: Speed, tolerance: 0.006, units: {ft/s: 1}}
  solution: |-
    $\dfrac{{v} \text{ mi}}{1 \text{ h}} \times \dfrac{5280 \text{ ft}}{1 \text{ mi}} \times \dfrac{1 \text{ h}}{3600 \text{ s}}$ = {top:int} ÷ 3,600 ≈ **{fps:num2} ft/s**.

- id: pre-angle-pair
  title: Complements and supplements
  topic: Angles
  vars:
    a: {min: 5, max: 85}
    t:
      choices:
        - {label: complement, value: 90}
        - {label: supplement, value: 180}
  calc:
    v: t - a
  prompt: 'Find the {t} of a {a}° angle.'
  answers:
    - {name: v, label: Angle, units: {'°': 1, deg: 1}}
  solution: |-
    Complementary angles add to 90° and supplementary angles add to 180°. So the {t} is {t:int}° − {a}° = **{v}°**.

- id: pre-triangle-angle
  title: Third angle of a triangle
  topic: Angles
  vars:
    a: {min: 20, max: 110}
    b: {min: 20, max: 110}
  calc:
    c: 180 - a - b
    ab: a + b
    ax: 6 * cosd(a)
    ay: 6 * sind(a)
  where: ["c >= 15"]
  prompt: 'Two angles of a triangle measure {a}° and {b}°. What is the third angle?'
  answers:
    - {name: c, label: Third angle, units: {'°': 1, deg: 1}}
  solution: |-
    The angles of a triangle add to 180°: 180° − ({a}° + {b}°) = 180° − {ab}° = **{c}°**.

- id: pre-perimeter
  title: Missing side from a perimeter
  topic: Perimeter
  vars:
    l: {min: 6, max: 40}
    w: {min: 3, max: 30}
  calc:
    P: 2 * l + 2 * w
    twol: 2 * l
    tw: 2 * w
  where: ["w < l"]
  prompt: 'A rectangle has a perimeter of {P} cm and a length of {l} cm. What is its width?'
  answers:
    - {name: w, label: Width, units: {cm: 1}}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [l, 0], [l, w], [0, w]]}
    segments:
      - {from: [0, '-0.06*l'], to: [l, '-0.06*l'], label: '{l} cm'}
      - {from: ['l + 0.06*l', 0], to: ['l + 0.06*l', w], label: 'w'}
  solution: |-
    $P = 2l + 2w$: ${P} = 2({l}) + 2w = {twol} + 2w$. So $2w = {tw}$ and $w =$ **{w} cm**.

- id: pre-area-triangle
  title: Area of a triangle
  topic: Area
  vars:
    b: {min: 4, max: 30}
    h: {min: 3, max: 25}
    sh: {min: 1, max: 4}
  calc:
    A: b * h / 2
    bh: b * h
    tx: b * sh / 5
  prompt: 'Find the area of the triangle with base {b} m and height {h} m.'
  answers:
    - {name: A, label: Area, units: {m^2: 1, 'm²': 1}}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [b, 0], [tx, h]]}
    segments:
      - {from: [0, '-0.05*b'], to: [b, '-0.05*b'], label: '{b} m'}
      - {from: [tx, h], to: [tx, 0], dashed: true, label: '{h} m'}
    rightAngles:
      - [[tx, 0], ['tx + 0.05*b', 0], [tx, '0.05*b']]
  solution: |-
    $A = \tfrac12 bh = \tfrac12({b})({h}) = \tfrac12({bh}) =$ **{A} m²**.

- id: pre-area-trapezoid
  title: Area of a trapezoid
  topic: Area
  vars:
    b1: {min: 8, max: 30}
    b2: {min: 3, max: 25}
    h: {min: 3, max: 15}
  calc:
    s: b1 + b2
    A: (b1 + b2) * h / 2
    x0: (b1 - b2) / 2
    x1: (b1 + b2) / 2
  where: ["b2 < b1"]
  prompt: 'A trapezoid has parallel sides {b1} ft and {b2} ft, and height {h} ft. Find its area.'
  answers:
    - {name: A, label: Area, units: {ft^2: 1, 'ft²': 1}}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [b1, 0], [x1, h], [x0, h]]}
    segments:
      - {from: [0, '-0.05*b1'], to: [b1, '-0.05*b1'], label: '{b1} ft'}
      - {from: [x0, 'h + 0.05*b1'], to: [x1, 'h + 0.05*b1'], label: '{b2} ft'}
      - {from: [x0, h], to: [x0, 0], dashed: true, label: '{h} ft'}
  solution: |-
    $A = \tfrac12(b_1 + b_2)h = \tfrac12({b1} + {b2})({h}) = \tfrac12({s})({h}) =$ **{A} ft²**.

- id: pre-area-composite
  title: Area of an L-shaped figure
  topic: Area
  vars:
    W: {min: 8, max: 20}
    H: {min: 8, max: 20}
    cw: {min: 2, max: 12}
    ch: {min: 2, max: 12}
  calc:
    big: W * H
    cut: cw * ch
    A: W * H - cw * ch
    xw: W - cw
    yh: H - ch
  where: ["cw <= W - 3", "ch <= H - 3"]
  prompt: 'Find the area of the L-shaped figure (all corners are right angles, lengths in meters).'
  answers:
    - {name: A, label: Area, units: {m^2: 1, 'm²': 1}}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [W, 0], [W, yh], [xw, yh], [xw, H], [0, H]]}
    segments:
      - {from: [0, -0.7], to: [W, -0.7], label: '{W}'}
      - {from: [-0.7, 0], to: [-0.7, H], label: '{H}'}
      - {from: [xw, 'H + 0.7'], to: [W, 'H + 0.7'], label: '{cw}', dashed: true}
      - {from: ['W + 0.7', yh], to: ['W + 0.7', H], label: '{ch}', dashed: true}
  solution: |-
    Think of a full {W} by {H} rectangle ({big} m²) with a {cw} by {ch} corner removed ({cut} m²).
    Area = {big} − {cut} = **{A} m²**.

- id: pre-circumference
  title: Circumference
  topic: Circles
  vars:
    r: {min: 2, max: 30}
    given:
      choices:
        - {label: radius, value: 1}
        - {label: diameter, value: 2}
  calc:
    m: r * given
    d: 2 * r
    C: 2 * pi * r
  prompt: 'A circle has a {given} of {m} cm. Find its circumference to the nearest tenth (you can type an exact answer like 14pi).'
  answers:
    - {name: C, label: Circumference, tolerance: 0.051, units: {cm: 1}}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r}
    points: [[0, 0]]
  solution: |-
    The diameter is {d} cm. $C = \pi d = {d}\pi \approx$ **{C:dp1} cm**.

- id: pre-circle-area
  title: Area of a circle
  topic: Circles
  vars:
    r: {min: 2, max: 25}
    given:
      choices:
        - {label: radius, value: 1}
        - {label: diameter, value: 2}
  calc:
    m: r * given
    r2: r^2
    A: pi * r^2
  prompt: 'A circle has a {given} of {m} in. Find its area to the nearest tenth (or type an exact answer like 49pi).'
  answers:
    - {name: A, label: Area, tolerance: 0.051, units: {in^2: 1, 'in²': 1}}
  solution: |-
    The radius is {r} in. $A = \pi r^2 = \pi({r})^2 = {r2}\pi \approx$ **{A:dp1} in²**.

- id: pre-volume-box
  title: Volume of a box
  topic: Volume
  vars:
    l: {min: 2, max: 20}
    w: {min: 2, max: 15}
    h: {min: 2, max: 12}
  calc:
    lw: l * w
    V: l * w * h
  prompt: 'Find the volume of a box {l} cm long, {w} cm wide and {h} cm high.'
  answers:
    - {name: V, label: Volume, units: {cm^3: 1, 'cm³': 1}}
  solution: |-
    $V = lwh$: the base holds {l} × {w} = {lw} cubes per layer, and there are {h} layers, so $V =$ **{V:int} cm³**.

- id: pre-volume-cylinder
  title: Volume of a cylinder
  topic: Volume
  vars:
    r: {min: 1, max: 12}
    h: {min: 2, max: 20}
  calc:
    r2h: r^2 * h
    V: pi * r^2 * h
  prompt: 'A cylinder has radius {r} m and height {h} m. Find its volume to the nearest tenth (or type an exact answer like 90pi).'
  answers:
    - {name: V, label: Volume, tolerance: 0.051, units: {m^3: 1, 'm³': 1}}
  solution: |-
    $V = \pi r^2 h = \pi({r})^2({h}) = {r2h:dp0}\pi \approx$ **{V:dp1} m³**.

- id: pre-surface-box
  title: Surface area of a box
  topic: Surface area
  vars:
    l: {min: 2, max: 15}
    w: {min: 2, max: 12}
    h: {min: 2, max: 10}
  calc:
    lw: l * w
    lh: l * h
    wh: w * h
    SA: 2 * (l * w + l * h + w * h)
  prompt: 'Find the surface area of a box {l} in by {w} in by {h} in.'
  answers:
    - {name: SA, label: Surface area, units: {in^2: 1, 'in²': 1}}
  solution: |-
    Six faces in three pairs: $SA = 2lw + 2lh + 2wh = 2({lw}) + 2({lh}) + 2({wh}) =$ **{SA} in²**.

- id: pre-hypotenuse
  title: Find the hypotenuse
  topic: Pythagorean theorem
  vars:
    a: {min: 2, max: 20}
    b: {min: 2, max: 20}
  calc:
    s: a^2 + b^2
    c: sqrt(a^2 + b^2)
    a2: a^2
    b2: b^2
  prompt: 'A right triangle has legs {a} and {b}. Find the hypotenuse to the nearest tenth.'
  answers:
    - {name: c, label: Hypotenuse, tolerance: 0.051}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [a, 0], [a, b]]}
    rightAngles:
      - [[a, 0], [0, 0], [a, b]]
    segments:
      - {from: [0, 0], to: [a, 0], label: '{a}'}
      - {from: [a, 0], to: [a, b], label: '{b}'}
      - {from: [a, b], to: [0, 0], label: 'c'}
  solution: |-
    $c^2 = a^2 + b^2 = {a2} + {b2} = {s}$, so $c = \sqrt{{s}} \approx$ **{c:dp1}**.

- id: pre-leg
  title: Find a missing leg
  topic: Pythagorean theorem
  vars:
    t: {min: 1, max: 4}
    k: {min: 1, max: 5}
  calc:
    a: k * if(t == 1, 3, if(t == 2, 5, if(t == 3, 8, 7)))
    b: k * if(t == 1, 4, if(t == 2, 12, if(t == 3, 15, 24)))
    c: k * if(t == 1, 5, if(t == 2, 13, if(t == 3, 17, 25)))
    c2: c^2
    a2: a^2
    b2: b^2
  prompt: 'A right triangle has hypotenuse {c} and one leg {a}. How long is the other leg?'
  answers:
    - {name: b, label: Other leg}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [b, 0], [b, a]]}
    rightAngles:
      - [[b, 0], [0, 0], [b, a]]
    segments:
      - {from: [0, 0], to: [b, 0], label: '?'}
      - {from: [b, 0], to: [b, a], label: '{a}'}
      - {from: [b, a], to: [0, 0], label: '{c}'}
  solution: |-
    The hypotenuse is given, so subtract: $b^2 = c^2 - a^2 = {c2:dp0} - {a2:dp0} = {b2:dp0}$, and $b = \sqrt{{b2:dp0}} =$ **{b}**.

- id: pre-grid-distance
  title: Distance between two points
  topic: Coordinate plane
  vars:
    t: {min: 1, max: 4}
    sx: {choices: [-1, 1]}
    sy: {choices: [-1, 1]}
    sw: {choices: [0, 1]}
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
  calc:
    p: if(t == 1, 3, if(t == 2, 5, if(t == 3, 8, 6)))
    r: if(t == 1, 4, if(t == 2, 12, if(t == 3, 15, 8)))
    c: if(t == 1, 5, if(t == 2, 13, if(t == 3, 17, 10)))
    dx: if(sw == 1, r, p)
    dy: if(sw == 1, p, r)
    x2: x1 + sx * dx
    y2: y1 + sy * dy
    dx2: dx^2
    dy2: dy^2
    c2: c^2
    lox: min(x1, x2) - 2
    hix: max(x1, x2) + 2
    loy: min(y1, y2) - 2
    hiy: max(y1, y2) + 2
  prompt: 'Find the distance between the points $({x1}, {y1})$ and $({x2}, {y2})$.'
  answers:
    - {name: c, label: Distance}
  figure:
    type: plot
    x: [lox, hix]
    y: [loy, hiy]
    equal: true
    points:
      - {at: [x1, y1], label: '({x1}, {y1})'}
      - {at: [x2, y2], label: '({x2}, {y2})'}
    segments:
      - {from: [x1, y1], to: [x2, y1], dashed: true}
      - {from: [x2, y1], to: [x2, y2], dashed: true}
      - {from: [x1, y1], to: [x2, y2]}
  solution: |-
    The move across is $|{x2} - ({x1})| = {dx}$ units and the move up or down is $|{y2} - ({y1})| = {dy}$ units. They are the legs of a right triangle, so the distance is $\sqrt{{dx}^2 + {dy}^2} = \sqrt{{dx2} + {dy2}} = \sqrt{{c2}} =$ **{c}**.
