# Round 3, module pre-m8: drills for the honors lesson "Scaling area and volume".
- id: pre-m8-r3-scale-solid
  title: Surface area and volume of a scaled solid
  topic: Scaling area and volume
  vars:
    k: {choices: [0.5, 1.5, 2, 2.5, 3, 4, 5]}
    S0: {min: 12, max: 200, step: 4}
    V0: {min: 8, max: 120, step: 8}
  calc:
    k2: k^2
    k3: k^3
    S: S0 * k^2
    V: V0 * k^3
  prompt: 'A solid has a surface area of {S0} cm² and a volume of {V0} cm³. A similar solid has every length multiplied by {k}. Find its surface area and its volume.'
  answers:
    - {name: S, label: Surface area, tolerance: 0.001, units: {cm^2: 1, 'cm²': 1}}
    - {name: V, label: Volume, tolerance: 0.001, units: {cm^3: 1, 'cm³': 1}}
  solution: |-
    The length scale factor is $k = {k}$. Surface area is an area, so it is multiplied by $k^2 = {k2:num4}$: ${S0} \times {k2:num4} =$ **{S:num4} cm²**.
    Volume is multiplied by $k^3 = {k3:num4}$: ${V0} \times {k3:num4} =$ **{V:num4} cm³**.

- id: pre-m8-r3-map-area
  title: Real area from a map
  topic: Scaling area and volume
  vars:
    sc:
      choices:
        - {label: '1 : 10,000', value: 10000}
        - {label: '1 : 20,000', value: 20000}
        - {label: '1 : 25,000', value: 25000}
        - {label: '1 : 50,000', value: 50000}
        - {label: '1 : 100,000', value: 100000}
        - {label: '1 : 200,000', value: 200000}
    m: {min: 2, max: 40}
  calc:
    km: sc / 100000
    km2: (sc / 100000)^2
    A: m * (sc / 100000)^2
  prompt: 'On a map with scale {sc}, a forest covers {m} cm². What is the real area of the forest, in square kilometers?'
  answers:
    - {name: A, label: Real area, tolerance: 0.00001, units: {km^2: 1, 'km²': 1}}
  solution: |-
    1 cm on the map is {sc:int} cm on the ground. Since 1 km = 100,000 cm, that is {km:num4} km.
    So 1 cm² on the map stands for ${km:num4} \times {km:num4} = {km2:num4}$ km² (square the length scale for an area).
    The forest: ${m} \times {km2:num4} =$ **{A:num4} km²**.

- id: pre-m8-r3-area-to-length
  title: Length from an area ratio
  topic: Scaling area and volume
  vars:
    a: {min: 2, max: 5}
    b: {min: 3, max: 8}
    m: {min: 1, max: 6}
    c: {min: 1, max: 4}
  where: ['b > a', 'gcd(a, b) == 1']
  calc:
    a2: a^2
    b2: b^2
    A1: m * a^2
    A2: m * b^2
    L1: c * a
    L2: c * b
  prompt: 'Two similar rectangles have areas {A1} cm² and {A2} cm². The smaller one is {L1} cm wide. How wide is the larger one?'
  answers:
    - {name: L2, label: Width, units: {cm: 1}}
  solution: |-
    Area ratio: $\dfrac{{A2}}{{A1}} = \dfrac{{b2}}{{a2}}$. Lengths scale by the square root of the area ratio: $k = \sqrt{\dfrac{{b2}}{{a2}}} = \dfrac{{b}}{{a}}$.
    Width: ${L1} \times \dfrac{{b}}{{a}} =$ **{L2} cm**.
