# Round 2 drills for pre-m2 (Integers): honors lessons 08h1 and 08h2.

- id: pre-m2-r2-near-hundred
  title: Multiply a negative by a number near 100
  topic: Properties of integers
  vars:
    a: {min: -9, max: -2}
    k: {min: 1, max: 4}
    s: {choices: [-1, 1]}
  calc:
    sk: s*k
    n: 100 + s*k
    h: 100*a
    ask: a*s*k
    v: a*(100 + s*k)
  prompt: 'Use the distributive property to find $\;({a})({n})$ without a calculator.'
  answer: v
  format: integer
  solution: |-
    Write ${n} = 100 {sk:signed}$ and distribute: $({a})(100 {sk:signed}) = ({a})(100) + ({a})({sk}) = {h} + ({ask}) =$ **{v}**.

- id: pre-m2-r2-common-factor
  title: Factor out a common negative
  topic: Properties of integers
  vars:
    a: {min: -9, max: 9}
    b: {min: -39, max: 39}
    c: {min: -39, max: 39}
  calc:
    bc: b + c
    ab: a*b
    ac: a*c
    v: a*(b + c)
  where: ["a != 0", "abs(a) != 1", "abs(b) >= 2", "abs(c) >= 2", "bc != 0", "mod(bc, 10) == 0", "a < 0 or b < 0 or c < 0", "b < 0 or c < 0"]
  prompt: 'Find $\;({a})({b}) + ({a})({c})$ by first factoring out the common factor ${a}$.'
  answer: v
  format: integer
  solution: |-
    Both products share the factor ${a}$, so $({a})({b}) + ({a})({c}) = ({a})\big({b} + ({c})\big) = ({a})({bc}) =$ **{v}**.
    Check the long way: ${ab} {ac:signed} = {v}$.

- id: pre-m2-r2-abs-equation
  title: Solve an absolute value equation
  topic: Absolute value equations
  vars:
    a: {min: -9, max: 9}
    d: {min: 1, max: 12}
    m: {choices: [2, 3, 4]}
    k: {min: -9, max: 9}
  calc:
    na: -a
    nk: -k
    md: m*d
    r: m*d + k
    lo: a - d
    hi: a + d
  where: ["a != 0", "k != 0"]
  prompt: 'Solve $\;{m}|x {na:signed}| {k:signed} = {r}$. Enter both solutions.'
  answers:
    - {name: lo, label: 'smaller $x =$'}
    - {name: hi, label: 'larger $x =$'}
  solution: |-
    Isolate the absolute value. Undo the ${k:signed}$: ${m}|x {na:signed}| = {r} {nk:signed} = {md}$. Divide by {m}: $|x {na:signed}| = {d}$.
    $|x {na:signed}|$ is the distance from $x$ to ${a}$, so $x = {a} - {d} =$ **{lo}** or $x = {a} + {d} =$ **{hi}**.

- id: pre-m2-r2-midpoint
  title: Midpoint of two integers
  topic: Distance and net change
  vars:
    a: {min: -30, max: 10}
    b: {min: -10, max: 30}
  calc:
    dist: b - a
    half: (b - a)/2
    sm: a + b
    mid: (a + b)/2
  where: ["a < 0", "a < b", "mod(b - a, 2) == 0", "b - a >= 4"]
  prompt: 'Find the midpoint of {a} and {b} on the number line.'
  answer: mid
  format: integer
  solution: |-
    The distance is ${b} - ({a}) = {dist}$; half of it is {half}. Start at {a} and move {half} to the right: ${a} + {half} =$ **{mid}**.
    (Or average: $\dfrac{{sm}}{2} = {mid}$.)

- id: pre-m2-r2-count-integers
  title: Count the integers within a distance
  topic: Distance and net change
  vars:
    a: {min: -12, max: 12}
    d: {min: 2, max: 9}
    rel: {choices: [{label: '\le', value: 0}, {label: '<', value: 1}]}
  calc:
    na: -a
    lo: a - d
    hi: a + d
    all: 2*d + 1
    v: 2*d + 1 - 2*rel
  where: ["a != 0"]
  prompt: 'How many integers $x$ satisfy $\;|x {na:signed}| {rel} {d}$?'
  answer: v
  format: integer
  solution: |-
    $|x {na:signed}|$ is the distance from $x$ to ${a}$. The numbers exactly {d} away are ${lo}$ and ${hi}$.
    From ${lo}$ to ${hi}$ with both ends included there are ${hi} - ({lo}) + 1 = {all}$ integers. With $\le$ the ends count; with $<$ they are left out (subtract 2).
    Answer: **{v}**.
