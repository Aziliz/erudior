# Round 2, honors module pre-h1 (Number theory and problem solving)
# --- pre-h1-remainders ---
- id: pre-h1-r2-remainder-product
  title: Remainder of a product
  topic: Modular arithmetic
  vars:
    fa: {min: 103, max: 9999}
    fb: {min: 103, max: 9999}
    md: {choices: [6, 7, 8, 9, 11, 12]}
  calc:
    ra: mod(fa, md)
    rb: mod(fb, md)
    pr: ra * rb
    ans: mod(ra * rb, md)
  where: ['ra >= 2', 'rb >= 2']
  prompt: 'Without multiplying it out, find the remainder when ${fa} \times {fb}$ is divided by {md}.'
  answer: ans
  format: integer
  solution: |-
    Replace each factor by its remainder. ${fa} \div {md}$ leaves remainder {ra}, and ${fb} \div {md}$ leaves remainder {rb}.

    Multiply the remainders: ${ra} \times {rb} = {pr}$. Reduce again: ${pr} \div {md}$ leaves remainder **{ans}**.

- id: pre-h1-r2-last-digit
  title: Last digit of a power
  topic: Modular arithmetic
  vars:
    bs: {choices: [2, 3, 7, 8, 12, 13, 17, 22, 23, 27]}
    ex: {min: 21, max: 299}
  calc:
    ld: mod(bs, 10)
    c1: mod(bs, 10)
    c2: mod(ld^2, 10)
    c3: mod(ld^3, 10)
    c4: mod(ld^4, 10)
    qt: floor(ex / 4)
    rm: mod(ex, 4)
    pos: mod(ex - 1, 4) + 1
    ans: mod(ld^(mod(ex - 1, 4) + 1), 10)
  prompt: 'What is the last digit of ${bs}^{ {ex} }$?'
  answer: ans
  format: integer
  solution: |-
    Only the last digit of the base matters, and it is {ld}. The last digits of its powers cycle with length 4: {c1}, {c2}, {c3}, {c4}, then repeat.

    Divide the exponent by 4: ${ex} = {qt} \times 4 + {rm}$. A remainder of {rm} means position {pos} of the cycle (remainder 0 would mean position 4).

    The last digit is **{ans}**.

- id: pre-h1-r2-days-later
  title: Day of the week after many days
  topic: Remainders
  vars:
    dy:
      choices:
        - {label: Sunday, value: 0}
        - {label: Monday, value: 1}
        - {label: Tuesday, value: 2}
        - {label: Wednesday, value: 3}
        - {label: Thursday, value: 4}
        - {label: Friday, value: 5}
        - {label: Saturday, value: 6}
    nd: {min: 30, max: 1000}
  calc:
    dn: dy
    wk: floor(nd / 7)
    lft: mod(nd, 7)
    tot: dy + mod(nd, 7)
    ans: mod(dy + nd, 7)
  where: ['mod(nd, 7) != 0']
  prompt: 'Number the days of the week Sunday = 0, Monday = 1, …, Saturday = 6. Today is {dy}. What is the number of the day of the week {nd} days from today?'
  answer: ans
  format: integer
  solution: |-
    Whole weeks don't change the day: ${nd} = {wk} \times 7 + {lft}$, so only the {lft} leftover days matter.

    {dy} is day {dn}. Move forward {lft}: ${dn} + {lft} = {tot}$, and reducing by 7 if needed gives day **{ans}**.

# --- pre-h1-parity ---
- id: pre-h1-r2-consecutive-sum
  title: Consecutive whole numbers with a given sum
  topic: Proof
  vars:
    kk: {choices: [3, 5, 7]}
    mid: {min: 8, max: 150}
  calc:
    sm: kk * mid
    half: (kk - 1) / 2
    big: mid + (kk - 1) / 2
  prompt: 'The sum of {kk} consecutive whole numbers is {sm}. What is the largest of the numbers?'
  answer: big
  format: integer
  solution: |-
    Call the middle number $n$. The numbers are spread evenly around it ({half} below and {half} above), so the ones below and above cancel in pairs and the sum is ${kk}n$.

    So ${kk}n = {sm}$ and $n = {mid}$. The largest is {half} more than the middle: ${mid} + {half} =$ **{big}**.

# --- pre-h1-counting-multiples ---
- id: pre-h1-r2-multiples-range
  title: Count the multiples in a range
  topic: Counting multiples
  vars:
    kk: {min: 3, max: 19}
    lo: {min: 21, max: 400}
    span: {min: 100, max: 900}
  calc:
    hi: lo + span
    up: floor((lo + span) / kk)
    below: floor((lo - 1) / kk)
    lom: lo - 1
    ans: floor((lo + span) / kk) - floor((lo - 1) / kk)
  prompt: 'How many multiples of {kk} are there from {lo} to {hi}, including both ends?'
  answer: ans
  format: integer
  solution: |-
    Multiples of {kk} from 1 to {hi}: the quotient of ${hi} \div {kk}$ is {up}.

    Leave out the ones below {lo}, that is, from 1 to {lom}: the quotient of ${lom} \div {kk}$ is {below}.

    Answer: ${up} - {below} =$ **{ans}**.

- id: pre-h1-r2-either-count
  title: Divisible by one number or another
  topic: Inclusion-exclusion
  vars:
    na: {min: 2, max: 12}
    nb: {min: 3, max: 15}
    top: {min: 100, max: 2000, step: 50}
  calc:
    lc: lcm(na, nb)
    ca: floor(top / na)
    cb: floor(top / nb)
    cab: floor(top / lcm(na, nb))
    ans: floor(top / na) + floor(top / nb) - floor(top / lcm(na, nb))
  where: ['na < nb', 'mod(nb, na) != 0']
  prompt: 'How many whole numbers from 1 to {top} are divisible by {na} or by {nb} (or both)?'
  answer: ans
  format: integer
  solution: |-
    Multiples of {na}: {ca}. Multiples of {nb}: {cb}.

    Numbers divisible by both are the multiples of LCM({na}, {nb}) = {lc}: there are {cab}.

    Inclusion–exclusion: ${ca} + {cb} - {cab} =$ **{ans}**.

- id: pre-h1-r2-factorial-zeros
  title: Zeros at the end of a factorial
  topic: Factorials
  vars:
    nn: {min: 26, max: 2000}
  calc:
    q1: floor(nn / 5)
    q2: floor(nn / 25)
    q3: floor(nn / 125)
    q4: floor(nn / 625)
    ans: floor(nn / 5) + floor(nn / 25) + floor(nn / 125) + floor(nn / 625)
  prompt: 'How many zeros are at the end of ${nn}!$ (written out in full)?'
  answer: ans
  format: integer
  solution: |-
    Each end zero needs a factor $10 = 2 \times 5$, and there are more 2s than 5s, so count the 5s.

    Multiples of 5: {q1}. Multiples of 25 (a second 5 each): {q2}. Multiples of 125 (a third): {q3}. Multiples of 625 (a fourth): {q4}.

    Total: ${q1} + {q2} + {q3} + {q4} =$ **{ans}** zeros.

# --- pre-h1-strategies ---
- id: pre-h1-r2-count-terms
  title: Count the terms of an arithmetic sequence
  topic: Number patterns
  vars:
    st: {min: 2, max: 40}
    df: {min: 2, max: 9}
    nt: {min: 15, max: 120}
  calc:
    s2: st + df
    s3: st + 2 * df
    lst: st + (nt - 1) * df
    gap: (nt - 1) * df
    steps: nt - 1
  prompt: 'How many numbers are in the list ${st}, {s2}, {s3}, \ldots, {lst}$, which goes up by {df} each time?'
  answer: nt
  format: integer
  solution: |-
    From {st} to {lst} is ${lst} - {st} = {gap}$. Each step is {df}, so there are ${gap} \div {df} = {steps}$ steps.

    There is one more number than steps (fence posts and gaps): ${steps} + 1 =$ **{nt}**.

- id: pre-h1-r2-arith-sum
  title: Sum of an arithmetic sequence
  topic: Number patterns
  vars:
    st: {min: 1, max: 30}
    df: {min: 2, max: 7}
    nt: {min: 10, max: 60}
  calc:
    s2: st + df
    s3: st + 2 * df
    lst: st + (nt - 1) * df
    pairsum: 2 * st + (nt - 1) * df
    ans: nt * (2 * st + (nt - 1) * df) / 2
  prompt: 'Find the sum ${st} + {s2} + {s3} + \cdots + {lst}$. (It has {nt} terms.)'
  answer: ans
  format: integer
  solution: |-
    Pair the first term with the last, the second with the second-to-last, and so on: each pair adds to ${st} + {lst} = {pairsum}$.

    Sum $=$ number of terms $\times$ (first + last) $\div 2 = {nt} \times {pairsum} \div 2 =$ **{ans:int}**.

- id: pre-h1-r2-handshakes
  title: Handshakes
  topic: Number patterns
  vars:
    pp: {min: 5, max: 60}
  calc:
    each: pp - 1
    dbl: pp * (pp - 1)
    ans: pp * (pp - 1) / 2
  prompt: '{pp} people at a meeting each shake hands once with every other person. How many handshakes are there?'
  answer: ans
  format: integer
  solution: |-
    Each person shakes {each} hands, giving ${pp} \times {each} = {dbl}$ hand-counts. Every handshake was counted twice (once for each person), so there are ${dbl} \div 2 =$ **{ans:int}** handshakes.
