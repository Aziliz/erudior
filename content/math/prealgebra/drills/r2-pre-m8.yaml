# Round 2, module pre-m8: drills for the honors lessons.
- id: pre-m8-r2-scale-area
  title: Scaling an area
  topic: Scaling
  vars:
    A0: {min: 4, max: 48, step: 4}
    k: {choices: [2, 3, 4, 5, 1.5, 0.5]}
  calc:
    k2: k^2
    A: A0 * k^2
  prompt: 'A figure with area {A0} cm² is scaled so that every length is multiplied by {k}. What is the area of the new figure?'
  answers:
    - {name: A, label: Area, units: {cm^2: 1, 'cm²': 1}}
  solution: |-
    Areas scale by the square of the scale factor: $k^2 = {k}^2 = {k2}$. New area $= {A0} \times {k2} =$ **{A} cm²**.

- id: pre-m8-r2-scale-volume
  title: Scaling a volume
  topic: Scaling
  vars:
    h1: {min: 2, max: 6}
    m: {min: 2, max: 4}
    V0: {min: 5, max: 60}
  calc:
    h2: h1 * m
    m3: m^3
    V: V0 * m^3
  prompt: 'Two jars are exact scale copies of each other. The small jar is {h1} cm tall and holds {V0} mL. The large jar is {h2} cm tall. How much does the large jar hold?'
  answers:
    - {name: V, label: Volume, units: {mL: 1}}
  solution: |-
    The scale factor is $k = \tfrac{{h2}}{{h1}} = {m}$. Volumes scale by $k^3 = {m}^3 = {m3}$, so the large jar holds ${V0} \times {m3} =$ **{V} mL**.

- id: pre-m8-r2-scale-find-k
  title: From surface areas to volumes
  topic: Scaling
  vars:
    a: {min: 1, max: 5}
    b: {min: 2, max: 7}
    c: {min: 1, max: 6}
    d: {min: 1, max: 3}
  where: ["a < b"]
  calc:
    A1: a^2 * c
    A2: b^2 * c
    a2: a^2
    b2: b^2
    a3: a^3
    b3: b^3
    V1: a^3 * d
    V2: b^3 * d
  prompt: 'Two similar solids have surface areas {A1} cm² and {A2} cm². The smaller one has volume {V1} cm³. What is the volume of the larger one?'
  answers:
    - {name: V2, label: Volume, units: {cm^3: 1, 'cm³': 1}}
  solution: |-
    Area ratio: $\tfrac{{A2}}{{A1}} = \tfrac{{b2}}{{a2}}$, so the scale factor is $k = \sqrt{\tfrac{{b2}}{{a2}}} = \tfrac{{b}}{{a}}$.
    Volumes scale by $k^3 = \tfrac{{b3}}{{a3}}$: ${V1} \times \tfrac{{b3}}{{a3}} =$ **{V2} cm³**.

- id: pre-m8-r2-cone-volume
  title: Volume of a cone
  topic: Cones, pyramids and spheres
  vars:
    r: {min: 1, max: 12}
    h: {min: 3, max: 24, step: 3}
  calc:
    r2: r^2
    c: r^2 * h / 3
    V: pi * r^2 * h / 3
  prompt: 'A cone has radius {r} cm and height {h} cm. Find its volume to the nearest tenth (or type an exact answer like 12pi).'
  answers:
    - {name: V, label: Volume, tolerance: 0.051, units: {cm^3: 1, 'cm³': 1}}
  figure:
    type: shape
    polygons:
      - {points: [['-r', 0], [r, 0], [0, h]]}
    segments:
      - {from: [0, 0], to: [0, h], dashed: true, label: '{h}'}
      - {from: [0, 0], to: [r, 0], label: '{r}'}
    rightAngles:
      - [[0, 0], ['0.08*r', 0], [0, '0.08*r']]
  solution: |-
    $V = \tfrac13 \pi r^2 h = \tfrac13 \pi ({r2})({h}) = {c:int}\pi \approx$ **{V:dp1} cm³**.

- id: pre-m8-r2-sphere
  title: Volume and surface area of a sphere
  topic: Cones, pyramids and spheres
  vars:
    r: {min: 3, max: 15, step: 3}
    given:
      choices:
        - {label: radius, value: 1}
        - {label: diameter, value: 2}
  calc:
    m: r * given
    r3: r^3
    cv: 4 * r^3 / 3
    cs: 4 * r^2
    V: 4 * pi * r^3 / 3
    S: 4 * pi * r^2
  prompt: 'A sphere has a {given} of {m} cm. Find its volume and its surface area, each to the nearest tenth (or type exact answers like 36pi).'
  answers:
    - {name: V, label: Volume, tolerance: 0.051, units: {cm^3: 1, 'cm³': 1}}
    - {name: S, label: Surface area, tolerance: 0.051, units: {cm^2: 1, 'cm²': 1}}
  solution: |-
    The radius is {r} cm. $V = \tfrac43 \pi r^3 = \tfrac43 \pi ({r3}) = {cv:int}\pi \approx$ **{V:dp1} cm³**.
    $SA = 4\pi r^2 = 4\pi({r})^2 = {cs:int}\pi \approx$ **{S:dp1} cm²**.

- id: pre-m8-r2-slant-height
  title: Slant height and lateral area of a cone
  topic: Cones, pyramids and spheres
  vars:
    t: {min: 1, max: 4}
    k: {min: 1, max: 3}
    sw: {choices: [0, 1]}
  calc:
    p: k * if(t == 1, 3, if(t == 2, 5, if(t == 3, 8, 7)))
    q: k * if(t == 1, 4, if(t == 2, 12, if(t == 3, 15, 24)))
    l: k * if(t == 1, 5, if(t == 2, 13, if(t == 3, 17, 25)))
    r: if(sw == 1, q, p)
    h: if(sw == 1, p, q)
    r2: r^2
    h2: h^2
    l2: l^2
    c: r * l
    L: pi * r * l
  prompt: 'A cone has radius {r} cm and height {h} cm. Find its slant height, and the area of its curved (lateral) surface to the nearest tenth (or exact, like 65pi).'
  answers:
    - {name: l, label: Slant height, units: {cm: 1}}
    - {name: L, label: Lateral area, tolerance: 0.051, units: {cm^2: 1, 'cm²': 1}}
  figure:
    type: shape
    polygons:
      - {points: [['-r', 0], [r, 0], [0, h]]}
    segments:
      - {from: [0, 0], to: [0, h], dashed: true, label: '{h}'}
      - {from: [0, 0], to: [r, 0], label: '{r}'}
      - {from: [r, 0], to: [0, h], label: 'ℓ'}
    rightAngles:
      - [[0, 0], ['0.06*(r + h)', 0], [0, '0.06*(r + h)']]
  solution: |-
    The radius, height and slant height form a right triangle with $\ell$ as the hypotenuse: $\ell^2 = {r2} + {h2} = {l2}$, so $\ell =$ **{l} cm**.
    Lateral area $= \pi r \ell = \pi({r})({l}) = {c}\pi \approx$ **{L:dp1} cm²**.

- id: pre-m8-r2-bounds
  title: Bounds of a measurement
  topic: Measurement error
  vars:
    n: {min: 12, max: 95}
    p:
      choices:
        - {label: 'the nearest centimeter', value: 1}
        - {label: 'the nearest tenth of a centimeter', value: 0.1}
        - {label: 'the nearest half centimeter', value: 0.5}
        - {label: 'the nearest 10 centimeters', value: 10}
  where: ['mod(n, 10) != 0', 'p != 0.5 or mod(n, 2) == 1']
  calc:
    m: n * p
    e: p / 2
    lo: n * p - p / 2
    hi: n * p + p / 2
  prompt: 'A length is measured as {m:num4} cm, to {p}. Find the greatest possible error, and the lower and upper bounds of the true length.'
  answers:
    - {name: e, label: Greatest possible error, tolerance: 0.0001, units: {cm: 1}}
    - {name: lo, label: Lower bound, tolerance: 0.0001, units: {cm: 1}}
    - {name: hi, label: Upper bound, tolerance: 0.0001, units: {cm: 1}}
  solution: |-
    The precision is {p:num4} cm, so the greatest possible error is half of it: **{e:num4} cm**.
    Lower bound: {m:num4} − {e:num4} = **{lo:num4} cm**. Upper bound: {m:num4} + {e:num4} = **{hi:num4} cm**.

- id: pre-m8-r2-area-bounds
  title: Bounds on a rectangle's area
  topic: Measurement error
  vars:
    l: {min: 4, max: 20}
    w: {min: 2, max: 15}
  where: ["w < l"]
  calc:
    A: l * w
    l1: l - 0.5
    w1: w - 0.5
    l2: l + 0.5
    w2: w + 0.5
    amin: (l - 0.5) * (w - 0.5)
    amax: (l + 0.5) * (w + 0.5)
  prompt: 'A rectangle is measured as {l} m by {w} m, each to the nearest meter. Find the smallest and largest possible values of its true area.'
  answers:
    - {name: amin, label: Smallest area, tolerance: 0.0001, units: {m^2: 1, 'm²': 1}}
    - {name: amax, label: Largest area, tolerance: 0.0001, units: {m^2: 1, 'm²': 1}}
  solution: |-
    Each side could be off by up to 0.5 m. Smallest: {l1} × {w1} = **{amin} m²**. Largest: {l2} × {w2} = **{amax} m²** (the true area is just under this). The calculated area, {A} m², lies between them.

- id: pre-m8-r2-percent-error
  title: Percent error
  topic: Measurement error
  vars:
    t: {min: 20, max: 200}
    d: {min: 1, max: 15}
    s: {choices: [-1, 1]}
  calc:
    meas: t + s * d
    pe: d / t * 100
  prompt: 'An object with a true mass of {t} g is measured as {meas} g. What is the percent error, to the nearest tenth of a percent?'
  answers:
    - {name: pe, label: Percent error, tolerance: 0.051, units: {'%': 1}}
  solution: |-
    Percent error $= \dfrac{|\text{measured} - \text{true}|}{\text{true}} \times 100\% = \dfrac{{d}}{{t}} \times 100\% \approx$ **{pe:dp1}%**.
