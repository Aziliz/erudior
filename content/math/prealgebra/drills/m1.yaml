- id: pre-digit-value
  title: Value of a digit
  topic: Place value
  vars:
    n: {min: 1000000, max: 9999999}
    p:
      choices:
        - {label: tens, value: 1}
        - {label: hundreds, value: 2}
        - {label: thousands, value: 3}
        - {label: ten thousands, value: 4}
        - {label: hundred thousands, value: 5}
  calc:
    dig: mod(floor(n / 10^p), 10)
    val: dig * 10^p
    pv: 10^p
  where: ["dig != 0"]
  prompt: 'In the number {n:int}, what is the value of the digit in the {p} place?'
  answer: val
  format: integer
  solution: |-
    Counting places from the right (ones, tens, hundreds, …), the {p} digit is {dig}. Its value is the digit times the place: {dig} × {pv:int} = **{val:int}**.

- id: pre-round-whole
  title: Round a whole number
  topic: Rounding
  vars:
    n: {min: 10000, max: 999999}
    p:
      choices:
        - {label: ten, value: 1}
        - {label: hundred, value: 2}
        - {label: thousand, value: 3}
        - {label: ten thousand, value: 4}
  calc:
    pv: 10^p
    r: round(n / pv) * pv
    nxt: mod(floor(n / 10^(p - 1)), 10)
  prompt: 'Round {n:int} to the nearest {p}.'
  answer: r
  format: integer
  solution: |-
    Look at the digit just to the right of the {p}s place: it is {nxt}. A digit of 5 or more rounds up; 4 or less leaves the rounding digit alone. Then fill in zeros: **{r:int}**.

- id: pre-long-division
  title: Long division with a remainder
  topic: Whole number operations
  vars:
    a: {min: 1000, max: 9999}
    b: {min: 3, max: 19}
  calc:
    q: floor(a / b)
    r: mod(a, b)
    qb: q * b
  where: ["r != 0"]
  prompt: 'Divide {a:int} by {b}. Give the quotient and the remainder.'
  answers:
    - {name: q, label: Quotient, format: integer}
    - {name: r, label: Remainder, format: integer}
  solution: |-
    Long division (divide, multiply, subtract, bring down) gives quotient **{q:int}** and remainder **{r}**.
    Check: {q:int} × {b} + {r} = {qb:int} + {r} = {a:int}, and the remainder {r} is less than the divisor {b}.

- id: pre-whole-word
  title: Making change
  topic: Word problems
  vars:
    n: {min: 2, max: 6}
    p: {min: 4, max: 15}
    m: {min: 2, max: 5}
    c: {min: 2, max: 9}
    bill: {choices: [50, 100]}
  calc:
    t1: n * p
    t2: m * c
    cost: t1 + t2
    change: bill - cost
  where: ["change > 0"]
  prompt: 'Sam buys {n} notebooks at \${p} each and {m} pens at \${c} each. He pays with a \${bill} bill. How much change does he get, in dollars?'
  answer: change
  format: integer
  solution: |-
    Cost: $({n} \times {p}) + ({m} \times {c}) = {t1} + {t2} = {cost}$ dollars. Change: $\;{bill} - {cost} =$ **{change}** dollars.

- id: pre-order-ops-1
  title: Order of operations
  topic: Order of operations
  vars:
    a: {min: 2, max: 30}
    b: {min: 2, max: 9}
    c: {min: 2, max: 9}
    e: {min: 2, max: 9}
    k: {min: 1, max: 9}
  calc:
    d: e * k
    bc: b * c
    s: a + bc
    v: a + b*c - d/e
  prompt: 'Evaluate $\;{a} + {b} \times {c} - {d} \div {e}$.'
  answer: v
  format: integer
  solution: |-
    Multiplication and division first, left to right: ${b} \times {c} = {bc}$ and ${d} \div {e} = {k}$.
    Then addition and subtraction, left to right: ${a} + {bc} = {s}$, and ${s} - {k} =$ **{v}**.

- id: pre-order-ops-2
  title: Order of operations with parentheses and exponents
  topic: Order of operations
  vars:
    a: {min: 1, max: 6}
    b: {min: 1, max: 6}
    c: {choices: [2, 3, 4, 5, 6, 8, 9]}
    d: {min: 2, max: 9}
    e: {min: 2, max: 5}
  calc:
    ab: a + b
    sq: ab^2
    qt: sq / c
    de: d * e
    v: sq / c - d * e
  where: ["mod(sq, c) == 0", "v >= 0"]
  prompt: 'Evaluate $\;({a} + {b})^2 \div {c} - {d} \times {e}$.'
  answer: v
  format: integer
  solution: |-
    Parentheses: ${a} + {b} = {ab}$. Exponent: ${ab}^2 = {sq}$.
    Division and multiplication, left to right: ${sq} \div {c} = {qt}$ and ${d} \times {e} = {de}$.
    Subtract: ${qt} - {de} =$ **{v}**.

- id: pre-count-factors
  title: Count the factors
  topic: Factors and multiples
  vars:
    n: {min: 12, max: 120}
  funcs:
    isdiv(k): if(mod(n, k) == 0, 1, 0)
  calc:
    cnt: round(sum(isdiv, 1, n))
  where: ["isprime(n) == 0"]
  prompt: 'How many factors (divisors) does {n} have? Count 1 and {n} itself.'
  answer: cnt
  format: integer
  solution: |-
    List factor pairs $a \times b = {n}$, testing $a = 1, 2, 3, \ldots$ up to $\sqrt{{n}}$. Each pair gives two factors (a pair like $6 \times 6$ gives just one). Counting them all: **{cnt}** factors.

- id: pre-prime-factor
  title: Prime factorization exponents
  topic: Prime factorization
  vars:
    a: {min: 1, max: 5}
    b: {min: 0, max: 3}
    c: {min: 0, max: 2}
  calc:
    n: 2^a * 3^b * 5^c
  where: ["n >= 20", "n <= 2000"]
  prompt: 'Write {n:int} as $2^a \times 3^b \times 5^c$. Find the exponents (an exponent can be 0).'
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
    - {name: c, label: '$c =$'}
  solution: |-
    Divide by 2 until the result is odd, then by 3 as long as possible, then by 5. The divisions used are {a} twos, {b} threes and {c} fives, so ${n} = 2^{{a}} \times 3^{{b}} \times 5^{{c}}$: **{a}**, **{b}**, **{c}**.

- id: pre-gcf
  title: Greatest common factor
  topic: GCF and LCM
  vars:
    g: {min: 2, max: 15}
    m: {min: 2, max: 9}
    k: {min: 2, max: 9}
  calc:
    a: g * m
    b: g * k
    f: gcd(a, b)
  where: ["gcd(m, k) == 1", "m < k"]
  prompt: 'Find the greatest common factor of {a} and {b}.'
  answer: f
  format: integer
  solution: |-
    ${a} = {g} \times {m}$ and ${b} = {g} \times {k}$, and {m} and {k} share no common factor other than 1. So the GCF is **{f}**. (Using prime factorizations: take the shared primes with the smaller powers.)

- id: pre-lcm
  title: Least common multiple
  topic: GCF and LCM
  vars:
    a: {min: 4, max: 30}
    b: {min: 4, max: 30}
  calc:
    g: gcd(a, b)
    ab: a * b
    l: lcm(a, b)
  where: ["a < b", "g > 1", "l != b"]
  prompt: 'Find the least common multiple of {a} and {b}.'
  answer: l
  format: integer
  solution: |-
    The GCF of {a} and {b} is {g}. For two numbers, $\text{LCM} = \dfrac{a \times b}{\text{GCF}} = \dfrac{{ab}}{{g}} =$ **{l}**.
    (Equivalently: take every prime that appears, with its larger power.)
