# Round 2 drills for pre-m4 honors lessons (16h1 repeating decimals, 16h2 direct and inverse proportion)
- id: pre-m4-r2-rep-pure
  title: Pure repeating decimal to a fraction
  topic: Repeating decimals
  vars:
    d1: {min: 0, max: 9}
    d2: {min: 0, max: 9}
  where: ['d1 != d2']
  calc:
    n: 10*d1 + d2
    val: n/99
  prompt: 'Write $0.\overline{{d1}{d2}}$ as a fraction in lowest terms.'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, tolerance: 0.0000001, label: 'Fraction'}
  solution: |-
    Let $x = 0.\overline{{d1}{d2}}$. The repeating block has 2 digits, so multiply by 100: $100x = {n}.\overline{{d1}{d2}}$.
    Subtract $x$ so the repeating tails cancel: $99x = {n}$, so $x = \dfrac{{n}}{99}$.
    In lowest terms: **${val:texfrac}$**.

- id: pre-m4-r2-rep-mixed
  title: Mixed repeating decimal to a fraction
  topic: Repeating decimals
  vars:
    a: {min: 1, max: 9}
    b: {min: 1, max: 8}
  where: ['a != b']
  calc:
    ab: 10*a + b
    n: 9*a + b
    val: n/90
  prompt: 'Write $0.{a}\overline{{b}}$ (only the {b} repeats) as a fraction in lowest terms.'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, tolerance: 0.0000001, label: 'Fraction'}
  solution: |-
    Let $x = 0.{a}\overline{{b}}$. Move the point just before the repeating part: $10x = {a}.\overline{{b}}$. Move it one more place (the period is 1): $100x = {ab}.\overline{{b}}$.
    Subtract: $100x - 10x = {ab} - {a}$, so $90x = {n}$ and $x = \dfrac{{n}}{90}$.
    In lowest terms: **${val:texfrac}$**.

- id: pre-m4-r2-inverse
  title: Inverse proportion (workers and days)
  topic: Inverse proportion
  vars:
    w1: {min: 2, max: 12}
    d1: {min: 2, max: 30}
    w2: {min: 2, max: 15}
  where: ['w1 != w2', 'mod(w1*d1, w2) == 0']
  calc:
    t: w1*d1
    d2: w1*d1/w2
  prompt: '{w1} workers can build a fence in {d1} days. Working at the same rate, how many days would {w2} workers take?'
  answers:
    - {name: d2, label: 'Days'}
  solution: |-
    Workers and days are inversely proportional: more workers, fewer days. The product stays the same: ${w1} \times {d1} = {t}$ worker-days.
    So ${w2} \times d = {t}$, and $d = {t} \div {w2} =$ **{d2}** days.

- id: pre-m4-r2-work-units
  title: Workers, jobs and days
  topic: Inverse proportion
  vars:
    u: {min: 6, max: 40}
    j1: {min: 2, max: 4}
    w1: {min: 2, max: 9}
    j2: {min: 2, max: 6}
    d2: {min: 2, max: 20}
  where: ['j1 != j2', 'mod(u*j1, w1) == 0', 'u*j1/w1 >= 2', 'mod(u*j2, d2) == 0', 'u*j2/d2 != w1']
  calc:
    d1: u*j1/w1
    tot: u*j1
    tot2: u*j2
    w2: u*j2/d2
  prompt: '{w1} painters paint {j1} rooms in {d1} days. Working at the same rate, how many painters are needed to paint {j2} rooms in {d2} days?'
  answers:
    - {name: w2, label: 'Painters'}
  solution: |-
    Count the work in painter-days. So far: ${w1} \times {d1} = {tot}$ painter-days for {j1} rooms, which is ${tot} \div {j1} = {u}$ painter-days per room.
    {j2} rooms need ${j2} \times {u} = {tot2}$ painter-days. Spread over {d2} days: ${tot2} \div {d2} =$ **{w2}** painters.
