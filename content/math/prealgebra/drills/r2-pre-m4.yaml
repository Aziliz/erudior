# Round 2 drills for pre-m4 honors lessons (16h1 repeating decimals, 16h2 inverse proportion, 16h3 scaling)
- id: pre-m4-r2-rep-pure
  title: Pure repeating decimal to a fraction
  topic: Repeating decimals
  vars:
    d1: {min: 0, max: 9}
    d2: {min: 0, max: 9}
  where: ['d1 != d2']
  calc:
    n: 10*d1 + d2
    val: n/99
  prompt: 'Write $0.\overline{{d1}{d2}}$ as a fraction in lowest terms.'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, label: 'Fraction'}
  solution: |-
    Let $x = 0.\overline{{d1}{d2}}$. The repeating block has 2 digits, so multiply by 100: $100x = {n}.\overline{{d1}{d2}}$.
    Subtract $x$ so the repeating tails cancel: $99x = {n}$, so $x = \dfrac{{n}}{99}$.
    In lowest terms: **${val:texfrac}$**.

- id: pre-m4-r2-rep-mixed
  title: Mixed repeating decimal to a fraction
  topic: Repeating decimals
  vars:
    a: {min: 1, max: 9}
    b: {min: 1, max: 8}
  where: ['a != b']
  calc:
    ab: 10*a + b
    n: 9*a + b
    val: n/90
  prompt: 'Write $0.{a}\overline{{b}}$ (only the {b} repeats) as a fraction in lowest terms.'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, label: 'Fraction'}
  solution: |-
    Let $x = 0.{a}\overline{{b}}$. Move the point just before the repeating part: $10x = {a}.\overline{{b}}$. Move it one more place (the period is 1): $100x = {ab}.\overline{{b}}$.
    Subtract: $100x - 10x = {ab} - {a}$, so $90x = {n}$ and $x = \dfrac{{n}}{90}$.
    In lowest terms: **${val:texfrac}$**.

- id: pre-m4-r2-inverse
  title: Inverse proportion (workers and days)
  topic: Inverse proportion
  vars:
    w1: {min: 2, max: 12}
    d1: {min: 2, max: 30}
    w2: {min: 2, max: 15}
  where: ['w1 != w2', 'mod(w1*d1, w2) == 0']
  calc:
    t: w1*d1
    d2: w1*d1/w2
  prompt: '{w1} workers can build a fence in {d1} days. Working at the same rate, how many days would {w2} workers take?'
  answers:
    - {name: d2, label: 'Days'}
  solution: |-
    Workers and days are inversely proportional: more workers, fewer days. The product stays the same: ${w1} \times {d1} = {t}$ worker-days.
    So ${w2} \times d = {t}$, and $d = {t} \div {w2} =$ **{d2}** days.

- id: pre-m4-r2-together
  title: Working together
  topic: Combined rates
  vars:
    a: {min: 2, max: 60}
    b: {min: 2, max: 60}
  where: ['a < b', 'mod(a*b, a + b) == 0']
  calc:
    s: a + b
    p: a*b
    t: a*b/(a + b)
  prompt: 'Mia can wash all the team''s cars in {a} minutes, and Sam can do it in {b} minutes. Working together at those rates, how many minutes do they take?'
  answers:
    - {name: t, label: 'Minutes'}
  solution: |-
    Add the work rates: $\dfrac{1}{{a}} + \dfrac{1}{{b}} = \dfrac{{b}}{{p}} + \dfrac{{a}}{{p}} = \dfrac{{s}}{{p}} = \dfrac{1}{{t}}$ of the job per minute.
    So the whole job takes **{t}** minutes. (Product over sum: ${p} \div {s} = {t}$. It is less than {a}, as it must be.)

- id: pre-m4-r2-scale-up
  title: Scale an area or a volume
  topic: Scaling area and volume
  vars:
    k: {choices: [2, 3, 4, 5, 10, 1.5]}
    A: {min: 2, max: 40}
    dim:
      choices:
        - {label: area, value: 2}
        - {label: volume, value: 3}
  calc:
    pw: dim
    f: k^dim
    B: A*k^dim
  prompt: 'A shape has {dim} {A} (in square units for an area, cubic units for a volume). A similar shape has every length {k:num1} times as long. What is the {dim} of the larger shape?'
  answers:
    - {name: B, label: 'New {dim}', tolerance: 0.001}
  solution: |-
    When every length is multiplied by $k = {k:num1}$, an area is multiplied by $k^2$ and a volume by $k^3$. Here that is ${k:num1}^{pw} = {f:num4}$.
    New {dim}: ${A} \times {f:num4} =$ **{B:num4}**.

- id: pre-m4-r2-scale-back
  title: Length ratio from an area ratio
  topic: Scaling area and volume
  vars:
    q: {min: 1, max: 5}
    p: {min: 2, max: 6}
    m: {min: 1, max: 5}
    s: {min: 1, max: 6}
  where: ['p > q', 'gcd(p, q) == 1']
  calc:
    A1: q^2*m
    A2: p^2*m
    L1: q*s
    L2: p*s
    k: p/q
  prompt: 'Two similar shapes have areas {A1} cm² and {A2} cm². A side of the smaller shape is {L1} cm long. How long is the matching side of the larger shape, in cm?'
  answers:
    - {name: L2, label: 'Length', tolerance: 0.001}
  solution: |-
    The area ratio is $\dfrac{{A2}}{{A1}} = \dfrac{{p}^2}{{q}^2}$, and areas scale by $k^2$, so the length scale factor is $k = {k:texfrac}$.
    Matching side: ${L1} \times {k:texfrac} =$ **{L2} cm**.
