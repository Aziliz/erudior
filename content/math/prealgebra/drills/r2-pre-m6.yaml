# Round 2, module pre-m6: drills for the scientific notation lesson and the honors lessons.
- id: pre-m6-r2-sci-divide
  title: Divide in scientific notation
  topic: Scientific notation
  vars:
    q: {min: 2, max: 9}
    k: {min: 11, max: 990}
    m: {min: -8, max: 9}
    n: {min: -8, max: 9}
  calc:
    quot: k / 100
    a: q * k / 100
    small: if(quot < 1, 1, 0)
    coef: if(quot < 1, quot * 10, quot)
    diff: m - n
    ex: m - n - small
  where: ["a >= 1", "a < 10", "mod(k, 10) != 0", "m != 0", "n != 0", "m != n"]
  prompt: 'Divide and write the answer in scientific notation: $\;\dfrac{{a:num4} \times 10^{{m}}}{{q} \times 10^{{n}}}$'
  answers:
    - {name: coef, label: 'Coefficient', tolerance: 0.0001}
    - {name: ex, label: 'Exponent of 10'}
  solution: |-
    Coefficients: ${a:num4} \div {q} = {quot:num4}$. Powers: $10^{{m} - ({n})} = 10^{{diff}}$.
    If the coefficient is less than 1, move its point one place right and subtract 1 from the exponent. Answer: **${coef:num4} \times 10^{{ex}}$**.

- id: pre-m6-r2-simplify-root
  title: Simplest radical form
  topic: Radicals
  vars:
    s: {min: 2, max: 12}
    r: {choices: [2, 3, 5, 6, 7, 10, 11, 13, 14, 15]}
  calc:
    sq: s^2
    n: s^2 * r
  where: ["n <= 600"]
  prompt: 'Write $\sqrt{{n}}$ in simplest radical form, $a\sqrt{b}$.'
  answers:
    - {name: s, label: '$a =$'}
    - {name: r, label: '$b =$'}
  solution: |-
    The largest perfect square that divides {n} is ${s}^2 = {sq}$: ${n} = {sq} \times {r}$, and {r} has no perfect-square factor other than 1.
    So $\sqrt{{n}} = \sqrt{{sq}} \cdot \sqrt{{r}} =$ **${s}\sqrt{{r}}$**.

- id: pre-m6-r2-like-radicals
  title: Add or subtract square roots
  topic: Radicals
  vars:
    p: {min: 2, max: 6}
    q: {min: 2, max: 7}
    k: {choices: [2, 3, 5, 6, 7]}
    sgn: {choices: [{label: '+', value: 1}, {label: '-', value: -1}]}
  calc:
    n1: p^2 * k
    n2: q^2 * k
    c: p + sgn * q
  where: ["p != q", "n1 <= 300", "n2 <= 300"]
  prompt: 'Simplify $\;\sqrt{{n1}} {sgn} \sqrt{{n2}}$ and write the answer as $a\sqrt{b}$ with $b$ as small as possible.'
  answers:
    - {name: c, label: '$a =$'}
    - {name: k, label: '$b =$'}
  solution: |-
    Simplify each root: $\sqrt{{n1}} = {p}\sqrt{{k}}$ and $\sqrt{{n2}} = {q}\sqrt{{k}}$.
    These are like radicals, so combine the coefficients: ${p} {sgn} {q} = {c}$, giving **${c}\sqrt{{k}}$**.

- id: pre-m6-r2-frac-exponent
  title: Fractional exponents
  topic: Fractional exponents
  vars:
    r: {min: 2, max: 5}
    n: {choices: [2, 3, 4]}
    m: {min: 1, max: 3}
    sg: {choices: [{label: 'The exponent is positive, so that is the value.', value: 1}, {label: 'The exponent is negative, so take the reciprocal.', value: -1}]}
  calc:
    base: r^n
    em: sg * m
    rm: r^m
    v: r^(sg * m)
  where: ["gcd(m, n) == 1", "base <= 625", "rm <= 125"]
  prompt: 'Evaluate $\;{base}^{{em}/{n}}$. Give an exact whole number or fraction.'
  answers:
    - {name: v, kind: fraction, lowestTerms: true, label: Value}
  solution: |-
    The denominator {n} means a root: $\sqrt[{n}]{{base}} = {r}$, because ${r}^{{n}} = {base}$. The numerator's size, {m}, is a power: ${r}^{{m}} = {rm}$.
    {sg} The answer is **{v:frac}**.

- id: pre-m6-r2-count-sigfigs
  title: Count significant figures
  topic: Significant figures
  vars:
    x:
      choices:
        - {label: '0.00450', value: 3}
        - {label: '30.07', value: 4}
        - {label: '205', value: 3}
        - {label: '0.0809', value: 3}
        - {label: '12.00', value: 4}
        - {label: '0.5', value: 1}
        - {label: '7.010', value: 4}
        - {label: '1.0050', value: 5}
        - {label: '400.0', value: 4}
        - {label: '0.000020', value: 2}
        - {label: '96.10', value: 4}
        - {label: '3.0', value: 2}
        - {label: '50.60', value: 4}
        - {label: '0.0100', value: 3}
        - {label: '8,003', value: 4}
        - {label: '6.02', value: 3}
        - {label: '0.300', value: 3}
        - {label: '104.0', value: 4}
  calc:
    sfc: x
  prompt: 'How many significant figures does the measurement {x} have?'
  answer: sfc
  format: integer
  solution: |-
    Start counting at the first nonzero digit: leading zeros never count, zeros between nonzero digits always count, and trailing zeros count when there is a decimal point.
    So {x} has **{sfc:int}** significant figures.

- id: pre-m6-r2-sigfig-multiply
  title: Multiply measurements
  topic: Significant figures
  vars:
    li: {min: 101, max: 999}
    wi: {min: 11, max: 99}
  calc:
    lg: li / 100
    wid: wi / 10
    area: lg * wid
  where: ["mod(wi, 10) != 0"]
  prompt: 'A rectangle measures {lg:num2} m by {wid:num1} m. Find its area in square meters, rounded to the correct number of significant figures.'
  answers:
    - {name: area, label: 'Area (m²)', sigfigs: 2}
  solution: |-
    {lg:num2} has 3 significant figures and {wid:num1} has 2, so the product keeps 2.
    ${lg:num2} \times {wid:num1} = {area:num4}$, which rounds to **{area:sig2} m²**.

- id: pre-m6-r2-sigfig-add
  title: Add measurements
  topic: Significant figures
  vars:
    ai: {min: 101, max: 999}
    bi: {min: 101, max: 999}
    ci: {min: 101, max: 999}
  calc:
    m1: ai / 10
    m2: bi / 100
    m3: ci / 1000
    thou: ai * 100 + bi * 10 + ci
    tot: thou / 1000
    rnd: round(thou / 100) / 10
  where: ["mod(ai, 10) != 0", "mod(thou, 100) != 50"]
  prompt: 'Three samples have masses {m1:num1} g, {m2:num2} g and {m3:dp3} g. Find the total mass, rounded to match the least precise measurement.'
  answer: rnd
  tolerance: 0.001
  solution: |-
    Exact sum: ${m1:num1} + {m2:num2} + {m3:dp3} = {tot:dp3}$ g. The least precise measurement, {m1:num1} g, is known only to the tenths place, so round the total to tenths: **{rnd:dp1} g**.
