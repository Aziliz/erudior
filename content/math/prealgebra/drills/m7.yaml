- id: pre-evaluate
  title: Evaluate an expression
  topic: Expressions
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    c: {min: -12, max: 12}
    t: {min: -5, max: 5}
  calc:
    t2: t^2
    p1: a * t^2
    p2: b * t
    v: a * t^2 + b * t + c
  where: ["a != 0", "b != 0", "c != 0", "t != 0", "t != 1"]
  prompt: 'Evaluate $\;{a:coef}x^2 {b:signedcoef}x {c:signed}\;$ when $x = {t}$.'
  answer: v
  format: integer
  solution: |-
    Substitute $({t})$ for $x$: ${a}({t})^2 + ({b})({t}) + ({c})$.
    Exponent first: $({t})^2 = {t2}$, so the terms are ${p1}$, ${p2}$ and ${c}$. Add: **{v}**.

- id: pre-translate
  title: Translate words into an expression
  topic: Translating words
  vars:
    a: {min: 2, max: 20}
    b: {min: 2, max: 9}
  where: ["a != b"]
  prompt: 'Write an expression for "{a} less than {b} times a number $x$".'
  answers:
    - {kind: expression, expression: 'b*x - a', variables: [x], label: Expression}
  solution: |-
    "{b} times a number" is ${b}x$. "{a} less than" that takes {a} away from it: **${b}x - {a}$**. (Not ${a} - {b}x$: "less than" reverses the order of the words.)

- id: pre-combine-like
  title: Combine like terms
  topic: Simplifying expressions
  vars:
    a: {min: -9, max: 9}
    b: {min: -15, max: 15}
    c: {min: -9, max: 9}
    d: {min: -15, max: 15}
  calc:
    ac: a + c
    bd: b + d
  where: ["a != 0", "c != 0", "b != 0", "d != 0", "ac != 0", "bd != 0"]
  prompt: 'Simplify: $\;{a:coef}x {b:signed} {c:signedcoef}x {d:signed}$'
  answers:
    - {kind: expression, expression: '(a + c)*x + (b + d)', variables: [x], label: Simplified, show: '${ac:coef}x {bd:signed}$'}
  solution: |-
    Group like terms: $({a} + ({c}))x + ({b} + ({d}))$. Combine coefficients: **${ac:coef}x {bd:signed}$**.

- id: pre-distribute
  title: Distribute and combine
  topic: Distributive property
  vars:
    k: {min: -6, max: 6}
    a: {min: 1, max: 6}
    b: {min: -9, max: 9}
    c: {min: -8, max: 8}
  calc:
    ka: k * a
    kb: k * b
    s: k * a + c
  where: ["abs(k) > 1", "b != 0", "c != 0", "s != 0"]
  prompt: 'Simplify: $\;{k}({a:coef}x {b:signed}) {c:signedcoef}x$'
  answers:
    - {kind: expression, expression: 'k*(a*x + b) + c*x', variables: [x], label: Simplified, show: '${s:coef}x {kb:signed}$'}
  solution: |-
    Distribute {k} to both terms: ${ka}x + ({kb})$. Then combine the $x$ terms: ${ka}x + ({c})x = {s}x$. Result: **${s:coef}x {kb:signed}$**.

- id: pre-one-step
  title: One-step equation
  topic: Solving equations
  vars:
    a: {min: -12, max: 12}
    x0: {min: -15, max: 15}
  calc:
    c: a * x0
  where: ["abs(a) > 1", "x0 != 0"]
  prompt: 'Solve for $x$: $\;{a}x = {c}$'
  answers:
    - {name: x0, label: '$x =$'}
  solution: |-
    $x$ is multiplied by {a}, so divide both sides by {a} (sign included): $x = {c} \div ({a}) =$ **{x0}**.

- id: pre-two-step
  title: Two-step equation
  topic: Solving equations
  vars:
    a: {min: -9, max: 9}
    b: {min: -20, max: 20}
    x0: {min: -12, max: 12}
  calc:
    c: a * x0 + b
    cb: c - b
  where: ["abs(a) > 1", "b != 0"]
  prompt: 'Solve for $x$: $\;{a}x {b:signed} = {c}$'
  answers:
    - {name: x0, label: '$x =$'}
  solution: |-
    Undo the {b} first: ${a}x = {c} - ({b}) = {cb}$. Then divide by {a}: $x =$ **{x0}**.

- id: pre-multi-step
  title: Variables on both sides
  topic: Multi-step equations
  vars:
    a: {min: -9, max: 9}
    b: {min: -20, max: 20}
    c: {min: -9, max: 9}
    x0: {min: -10, max: 10}
  calc:
    d: a * x0 + b - c * x0
    ac: a - c
    db: d - b
  where: ["a != 0", "c > 1", "a != c", "abs(a - c) > 1", "b != 0", "d != 0", "a != 1"]
  prompt: 'Solve for $x$: $\;{a}x {b:signed} = {c}x {d:signed}$'
  answers:
    - {name: x0, label: '$x =$'}
  solution: |-
    Subtract ${c}x$ from both sides: ${ac}x {b:signed} = {d}$. Subtract $({b})$ from both sides: ${ac}x = {db}$. Divide by {ac}: $x =$ **{x0}**.

- id: pre-distribute-solve
  title: Equation with parentheses
  topic: Multi-step equations
  vars:
    k: {min: -6, max: 6}
    b: {min: -9, max: 9}
    c: {min: -6, max: 6}
    x0: {min: -10, max: 10}
  calc:
    d: k * (x0 + b) + c * x0
    kb: k * b
    s: k + c
    dk: d - k * b
  where: ["abs(k) > 1", "b != 0", "c != 0", "k + c != 0", "abs(k + c) != 1"]
  prompt: 'Solve for $x$: $\;{k}(x {b:signed}) {c:signedcoef}x = {d}$'
  answers:
    - {name: x0, label: '$x =$'}
  solution: |-
    Distribute: ${k}x {kb:signed} {c:signedcoef}x = {d}$. Combine: ${s}x {kb:signed} = {d}$. Subtract {kb}: ${s}x = {dk}$. Divide by {s}: $x =$ **{x0}**.

- id: pre-eq-word
  title: Consecutive integers
  topic: Equation word problems
  vars:
    k: {choices: [3, 4, 5]}
    n0: {min: -20, max: 60}
  calc:
    extra: k * (k - 1) / 2
    S: k * n0 + extra
    kn: S - extra
  prompt: 'The sum of {k} consecutive integers is {S}. What is the smallest of them?'
  answers:
    - {name: n0, label: Smallest}
  solution: |-
    Let the smallest be $n$; the others are $n + 1, n + 2, \ldots$. Their sum is ${k}n + {extra} = {S}$.
    So ${k}n = {kn}$ and $n =$ **{n0}**.

- id: pre-ineq-solve
  title: Solve a linear inequality
  topic: Inequalities
  vars:
    a: {min: 2, max: 9}
    b: {min: -15, max: 15}
    x0: {min: -10, max: 10}
    sym:
      choices:
        - {label: '<', value: -1}
        - {label: '>', value: 1}
        - {label: '\le', value: -2}
        - {label: '\ge', value: 2}
  calc:
    c: a * x0 + b
    cb: c - b
    dir: sign(sym)
  where: ["b != 0"]
  prompt: 'Solve $\;{a}x {b:signed} {sym} {c}$. Give the boundary value, and type 1 if the solution is $x >$ or $x \ge$ the boundary, or $-1$ if it is $x <$ or $x \le$ the boundary.'
  answers:
    - {name: x0, label: Boundary}
    - {name: dir, label: 'Direction (1 or -1)'}
  solution: |-
    Subtract $({b})$ from both sides: ${a}x {sym} {cb}$. Divide by {a}; it is positive, so the symbol stays: $x {sym} {x0}$.
    Boundary **{x0}**, direction **{dir}** (1 means greater, $-1$ means less).

- id: pre-ineq-flip
  title: Inequality with a negative coefficient
  topic: Inequalities
  vars:
    a: {min: -9, max: -2}
    b: {min: -15, max: 15}
    x0: {min: -10, max: 10}
    sym:
      choices:
        - {label: '<', value: -1}
        - {label: '>', value: 1}
        - {label: '\le', value: -2}
        - {label: '\ge', value: 2}
  calc:
    c: a * x0 + b
    cb: c - b
    dir: -sign(sym)
  where: ["b != 0"]
  prompt: 'Solve $\;{a}x {b:signed} {sym} {c}$. Give the boundary value, and type 1 if the solution is $x >$ or $x \ge$ the boundary, or $-1$ if it is $x <$ or $x \le$ the boundary.'
  answers:
    - {name: x0, label: Boundary}
    - {name: dir, label: 'Direction (1 or -1)'}
  solution: |-
    Subtract $({b})$ from both sides: ${a}x {sym} {cb}$. Divide by {a}. Because {a} is negative, the symbol reverses ($<$ and $>$ swap, $\le$ and $\ge$ swap).
    Boundary **{x0}**, direction **{dir}** (1 means greater, $-1$ means less).

- id: pre-ineq-word
  title: Budget inequality
  topic: Inequalities
  vars:
    F: {min: 5, max: 60}
    r: {min: 3, max: 25}
    B: {min: 60, max: 400}
  calc:
    BF: B - F
    q: (B - F) / r
    n: floor((B - F) / r)
  where: ["B - F > 3 * r", "q != round(q)"]
  prompt: 'A craft class charges a \${F} supply fee plus \${r} per session. Ben can spend at most \${B}. What is the greatest whole number of sessions he can take?'
  answers:
    - {name: n, label: Sessions}
  solution: |-
    Let $s$ be the sessions: ${F} + {r}s \le {B}$. Subtract {F}: ${r}s \le {BF}$. Divide: $s \le {q:num2}$. The greatest whole number is **{n}**.

- id: pre-formula-solve
  title: Solve an equation for y
  topic: Formulas
  vars:
    bb: {min: -6, max: 6}
    m0: {min: -5, max: 5}
    k: {min: -9, max: 9}
  calc:
    a: -m0 * bb
    na: m0 * bb
    c: bb * k
  where: ["abs(bb) > 1", "m0 != 0", "k != 0"]
  prompt: 'Solve $\;{a:coef}x {bb:signedcoef}y = {c}\;$ for $y$.'
  answers:
    - {kind: expression, expression: 'm0*x + k', variables: [x], label: '$y =$', show: '${m0:coef}x {k:signed}$'}
  solution: |-
    Treat $x$ like a number and undo the steps around $y$. Subtract ${a:coef}x$ from both sides: ${bb:coef}y = {na:coef}x {c:signed}$.
    Divide every term by ${bb}$: $y =$ **${m0:coef}x {k:signed}$**.

# --- pre-money-problems ---
- id: pre-coin-problem
  title: Coin problem
  topic: Money word problems
  vars:
    N: {min: 12, max: 40}
    d: {min: 2, max: 38}
  calc:
    qn: N - d
    V: 10 * d + 25 * (N - d)
    Vd: V / 100
    N25: 25 * N
    diff: V - 25 * N
  where: ["d <= N - 2"]
  prompt: 'A jar holds {N} coins, all dimes and quarters, worth {Vd:money} in all. How many dimes are in the jar?'
  answers:
    - {name: d, label: Dimes}
  solution: |-
    Let $d$ be the number of dimes; the quarters are the rest, ${N} - d$. Work in cents: $10d + 25({N} - d) = {V:dp0}$.
    Distribute: $10d + {N25:dp0} - 25d = {V:dp0}$, so $-15d + {N25:dp0} = {V:dp0}$ and $-15d = {diff:dp0}$. Divide by $-15$: $d =$ **{d}**.
    Check: {d} dimes and {qn} quarters are worth $10({d}) + 25({qn}) = {V:dp0}$ cents.

- id: pre-ticket-problem
  title: Ticket sales problem
  topic: Money word problems
  vars:
    N: {min: 80, max: 400, step: 10}
    pa: {min: 8, max: 25}
    pc: {min: 3, max: 15}
    a: {min: 10, max: 390}
  calc:
    c: N - a
    T: pa * a + pc * (N - a)
    pcN: pc * N
    dp: pa - pc
    Tm: T - pc * N
  where: ["pc <= pa - 2", "a <= N - 10"]
  prompt: 'A theater sold {N} tickets. Adult tickets cost {pa:money0} and child tickets cost {pc:money0}. Ticket sales were {T:money0}. How many adult tickets were sold?'
  answers:
    - {name: a, label: Adult tickets}
  solution: |-
    Let $a$ be the adult tickets; the child tickets are ${N} - a$. In dollars: ${pa}a + {pc}({N} - a) = {T:dp0}$.
    Distribute: ${pa}a + {pcN:dp0} - {pc}a = {T:dp0}$, so ${dp}a + {pcN:dp0} = {T:dp0}$ and ${dp}a = {Tm:dp0}$. Divide by {dp}: $a =$ **{a}**.
    Check: {a} adult and {c} child tickets bring in ${pa}({a}) + {pc}({c}) = {T:dp0}$ dollars.

- id: pre-mixture-problem
  title: Mixture problem
  topic: Money word problems
  vars:
    p1: {min: 2, max: 10}
    gap: {min: 2, max: 8}
    W: {min: 10, max: 60, step: 5}
    x: {min: 1, max: 59}
  calc:
    p2: p1 + gap
    rest: W - x
    tot: p1 * x + (p1 + gap) * (W - x)
    P: tot / W
    p2W: (p1 + gap) * W
    dpp: -gap
    diff: tot - (p1 + gap) * W
  where: ["x <= W - 1", "mod(tot * 100, W) == 0"]
  prompt: 'A shop mixes nuts worth {p1:money0} per pound with nuts worth {p2:money0} per pound to make {W} pounds of a mix worth {P:money} per pound. How many pounds of the {p1:money0} nuts does it use?'
  answers:
    - {name: x, label: Pounds}
  solution: |-
    Let $x$ be the pounds of the cheaper nuts; the rest, ${W} - x$ pounds, are the dearer nuts. The whole mix is worth ${W} \times {P:dp2} = {tot:dp0}$ dollars, so
    $${p1}x + {p2}({W} - x) = {tot:dp0}.$$
    Distribute: ${p1}x + {p2W:dp0} - {p2}x = {tot:dp0}$, so ${dpp}x + {p2W:dp0} = {tot:dp0}$ and ${dpp}x = {diff:dp0}$. Divide by ${dpp}$: $x =$ **{x}** pounds (and {rest} pounds of the dearer nuts).

# --- pre-graphing-lines ---
- id: pre-slope-points
  title: Slope from two points
  topic: Slope
  vars:
    x1: {min: -9, max: 9}
    y1: {min: -9, max: 9}
    x2: {min: -9, max: 9}
    y2: {min: -9, max: 9}
  calc:
    dy: y2 - y1
    dx: x2 - x1
    m: (y2 - y1) / (x2 - x1)
  where: ["x1 != x2", "y1 != y2"]
  prompt: 'Find the slope of the line through $({x1}, {y1})$ and $({x2}, {y2})$. Give an integer or a fraction in lowest terms.'
  answers:
    - {name: m, kind: fraction, lowestTerms: true, label: '$m =$'}
  solution: |-
    Rise over run, subtracting in the same order on top and bottom:
    $$m = \dfrac{{y2} - ({y1})}{{x2} - ({x1})} = \dfrac{{dy}}{{dx}} = {m:texfrac}.$$
    The slope is **{m:frac}**.

- id: pre-intercepts
  title: Find the intercepts
  topic: Graphing lines
  vars:
    a: {min: -9, max: 9}
    bq: {min: -9, max: 9}
    k: {min: -4, max: 4}
  calc:
    c: a * bq * k
    xi: bq * k
    yi: a * k
  where: ["a != 0", "bq != 0", "k != 0", "gcd(abs(a), abs(bq)) == 1", "abs(a) + abs(bq) > 2"]
  prompt: 'Find the intercepts of the line $\;{a:coef}x {bq:signedcoef}y = {c}$. Give the $x$-coordinate of the $x$-intercept and the $y$-coordinate of the $y$-intercept.'
  answers:
    - {name: xi, label: '$x$-intercept: $x =$'}
    - {name: yi, label: '$y$-intercept: $y =$'}
  solution: |-
    $x$-intercept: set $y = 0$. Then ${a:coef}x = {c}$, so $x =$ **{xi}**; the point is $({xi}, 0)$.
    $y$-intercept: set $x = 0$. Then ${bq:coef}y = {c}$, so $y =$ **{yi}**; the point is $(0, {yi})$.

- id: pre-line-equation
  title: Equation of a line from its graph
  topic: Graphing lines
  vars:
    b0: {min: -5, max: 5}
    run: {min: 1, max: 4}
    rise: {min: -6, max: 6}
  calc:
    m: rise / run
    y2: b0 + rise
  where: ["rise != 0", "b0 != 0", "abs(rise) != run", "abs(b0 + rise) <= 8", "gcd(abs(rise), run) == 1"]
  prompt: 'The line passes through the two marked points, $(0, {b0})$ and $({run}, {y2})$. Write its equation in slope-intercept form, $y = mx + b$.'
  answers:
    - {kind: expression, expression: 'm*x + b0', variables: [x], label: '$y =$', show: '${m:texfrac}x {b0:signed}$'}
  figure:
    type: plot
    x: [-6, 6]
    y: [-10, 10]
    functions:
      - {f: 'm*x + b0'}
    points:
      - {at: [0, b0], label: '(0, {b0})'}
      - {at: [run, y2], label: '({run}, {y2})'}
  solution: |-
    The line crosses the $y$-axis at $(0, {b0})$, so $b = {b0}$.
    From $(0, {b0})$ to $({run}, {y2})$, $y$ changes by ${rise}$ while $x$ changes by ${run}$, so $m = \dfrac{{rise}}{{run}} = {m:texfrac}$.
    The equation is **$y = {m:texfrac}x {b0:signed}$**.
