# Round 2, module pre-m1: drills for the honors lessons.

# --- pre-m1-h-bases ---
- id: pre-m1-r2-base-to-ten
  title: Convert from another base to base ten
  topic: Number bases
  vars:
    b: {min: 3, max: 9}
    d3: {min: 1, max: 8}
    d2: {min: 0, max: 8}
    d1: {min: 0, max: 8}
    d0: {min: 0, max: 8}
  where: ["d3 < b", "d2 < b", "d1 < b", "d0 < b"]
  calc:
    p2: b^2
    p3: b^3
    t3: d3 * p3
    t2: d2 * p2
    t1: d1 * b
    v: t3 + t2 + t1 + d0
  prompt: 'Convert ${d3}{d2}{d1}{d0}_{{b}}$ to base ten.'
  answer: v
  format: integer
  solution: |-
    In base {b} the places, from the right, are worth 1, {b}, {p2} and {p3}. Expanded form:
    ${d3} \times {p3} + {d2} \times {p2} + {d1} \times {b} + {d0} \times 1 = {t3} + {t2} + {t1} + {d0} =$ **{v}**.

- id: pre-m1-r2-ten-to-binary
  title: Write a number in binary
  topic: Number bases
  vars:
    n: {min: 9, max: 127}
  funcs:
    bit(k): mod(floor(n / 2^k), 2) * 10^k
  calc:
    b6: mod(floor(n / 64), 2)
    b5: mod(floor(n / 32), 2)
    b4: mod(floor(n / 16), 2)
    b3: mod(floor(n / 8), 2)
    b2: mod(floor(n / 4), 2)
    b1: mod(floor(n / 2), 2)
    b0: mod(n, 2)
    bin: round(sum(bit, 0, 6))
  prompt: 'Write {n} in binary (base two). Type only the digits 0 and 1.'
  answers:
    - {name: bin, label: 'Binary:', format: dp0}
  solution: |-
    Divide by 2 repeatedly and read the remainders from last to first (or take out the biggest place value that fits, again and again). The binary places are 64, 32, 16, 8, 4, 2, 1, and
    ${n} = {b6} \times 64 + {b5} \times 32 + {b4} \times 16 + {b3} \times 8 + {b2} \times 4 + {b1} \times 2 + {b0} \times 1$,
    so {n} in binary is **{bin:dp0}** (a leading 0 can be dropped).

- id: pre-m1-r2-hex-to-ten
  title: Convert hexadecimal to base ten
  topic: Number bases
  vars:
    h1:
      choices:
        - {label: '1', value: 1}
        - {label: '2', value: 2}
        - {label: '3', value: 3}
        - {label: '4', value: 4}
        - {label: '5', value: 5}
        - {label: '7', value: 7}
        - {label: '9', value: 9}
        - {label: A, value: 10}
        - {label: B, value: 11}
        - {label: C, value: 12}
        - {label: D, value: 13}
        - {label: E, value: 14}
        - {label: F, value: 15}
    h0:
      choices:
        - {label: '0', value: 0}
        - {label: '3', value: 3}
        - {label: '6', value: 6}
        - {label: '8', value: 8}
        - {label: A, value: 10}
        - {label: B, value: 11}
        - {label: C, value: 12}
        - {label: D, value: 13}
        - {label: E, value: 14}
        - {label: F, value: 15}
  calc:
    a1: h1 * 1
    a0: h0 * 1
    t1: a1 * 16
    v: t1 + a0
  prompt: 'Convert the hexadecimal number {h1}{h0} (base sixteen) to base ten.'
  answer: v
  format: integer
  solution: |-
    In hexadecimal, A = 10, B = 11, C = 12, D = 13, E = 14 and F = 15, and the places are 16 and 1.
    The digit {h1} stands for {a1} and the digit {h0} stands for {a0}, so the value is ${a1} \times 16 + {a0} = {t1} + {a0} =$ **{v}**.

# --- pre-m1-h-euclid ---
- id: pre-m1-r2-euclid
  title: GCF by the Euclidean algorithm
  topic: Euclidean algorithm
  vars:
    g: {min: 6, max: 40}
    m: {min: 11, max: 60}
    k: {min: 10, max: 59}
  where: ["gcd(m, k) == 1", "m > k", "g * m <= 2400"]
  calc:
    a: g * m
    b: g * k
    f: gcd(a, b)
    q1: floor(a / b)
    r1: mod(a, b)
    q2: floor(b / r1)
    r2: mod(b, r1)
  prompt: 'Use the Euclidean algorithm to find the greatest common factor of {a:int} and {b:int}.'
  answer: f
  format: integer
  solution: |-
    Divide, then replace the pair with (divisor, remainder):
    ${a} = {q1} \times {b} + {r1}$, then ${b} = {q2} \times {r1} + {r2}$, and so on until a remainder is 0.
    The last nonzero remainder is the GCF: **{f}**. (Check: ${a} = {f} \times {m}$ and ${b} = {f} \times {k}$, and {m} and {k} share no factor but 1.)

- id: pre-m1-r2-lcm-euclid
  title: LCM from the GCF
  topic: Euclidean algorithm
  vars:
    g: {min: 4, max: 30}
    m: {min: 5, max: 30}
    k: {min: 5, max: 30}
  where: ["gcd(m, k) == 1", "m > k"]
  calc:
    a: g * m
    b: g * k
    f: gcd(a, b)
    l: m * b
  prompt: 'The greatest common factor of {a:int} and {b:int} is {f}. Find their least common multiple.'
  answer: l
  format: integer
  solution: |-
    For two numbers, GCF × LCM = their product, so $\text{LCM} = \dfrac{{a} \times {b}}{{f}}$.
    Divide first: ${a} \div {f} = {m}$, so $\text{LCM} = {m} \times {b} =$ **{l:int}**.

- id: pre-m1-r2-divisor-count
  title: Count divisors from the prime factorization
  topic: Counting divisors
  vars:
    a: {min: 1, max: 5}
    b: {min: 1, max: 3}
    c: {min: 1, max: 2}
  calc:
    n: 2^a * 3^b * 5^c
    a1: a + 1
    b1: b + 1
    c1: c + 1
    cnt: a1 * b1 * c1
  where: ["n <= 5000"]
  prompt: 'How many divisors does {n:int} have? (Count 1 and {n:int} too.)'
  answer: cnt
  format: integer
  solution: |-
    Prime factorization: ${n} = 2^{{a}} \times 3^{{b}} \times 5^{{c}}$.
    Add 1 to each exponent and multiply: ${a1} \times {b1} \times {c1} =$ **{cnt}** divisors.

# --- pre-m1-h-estimation ---
- id: pre-m1-r2-bounds-product
  title: Lower and upper bounds for a product
  topic: Estimation
  vars:
    x: {min: 21, max: 98}
    y: {min: 21, max: 98}
  where: ["mod(x, 10) != 0", "mod(y, 10) != 0"]
  calc:
    xd: floor(x / 10) * 10
    xu: xd + 10
    yd: floor(y / 10) * 10
    yu: yd + 10
    lo: xd * yd
    hi: xu * yu
    ex: x * y
  prompt: 'Round both factors down to the tens, and then both up to the tens, to find a lower bound and an upper bound for ${x} \times {y}$.'
  answers:
    - {name: lo, label: 'Lower bound:', format: integer}
    - {name: hi, label: 'Upper bound:', format: integer}
  solution: |-
    Lower bound: ${xd} \times {yd} =$ **{lo:int}**. Upper bound: ${xu} \times {yu} =$ **{hi:int}**.
    The exact product, {ex:int}, lies between them.

- id: pre-m1-r2-round-range
  title: Range of a rounded number
  topic: Estimation
  vars:
    p:
      choices:
        - {label: ten, value: 10}
        - {label: hundred, value: 100}
        - {label: thousand, value: 1000}
    r: {min: 2, max: 99}
  calc:
    pv: p * 1
    half: pv / 2
    big: r * pv
    lo: big - half
    hi: big + half - 1
  prompt: 'A whole number rounds to {big:int} when it is rounded to the nearest {p}. What are the smallest and the largest whole numbers it could be?'
  answers:
    - {name: lo, label: 'Smallest:', format: integer}
    - {name: hi, label: 'Largest:', format: integer}
  solution: |-
    Halfway between multiples of {pv:int} is {half:int} away. Numbers from {half:int} below {big:int} (halfway rounds up) to one less than {half:int} above it round to {big:int}.
    Smallest: **{lo:int}**. Largest: **{hi:int}**.

- id: pre-m1-r2-rate-chain
  title: Chain a rate through minutes, hours and days
  topic: Estimation
  vars:
    r: {min: 2, max: 90}
    per:
      choices:
        - {label: hour, value: 60}
        - {label: day, value: 1440}
        - {label: week, value: 10080}
  calc:
    mins: per * 1
    ans: r * mins
  prompt: 'Something happens {r} times a minute. How many times does it happen in one {per}?'
  answer: ans
  format: integer
  solution: |-
    An hour is 60 minutes, a day is $24 \times 60 = 1{,}440$ minutes and a week is $7 \times 1{,}440 = 10{,}080$ minutes.
    One {per} is {mins:int} minutes, so the count is ${r} \times {mins} =$ **{ans:int}**.
