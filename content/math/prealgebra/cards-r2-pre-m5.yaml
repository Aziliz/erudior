# Round 2, module pre-m5 (Percents): cards for the honors lessons
- {front: 'Compound interest, yearly', back: '$A = P(1 + r)^t$: multiply by the growth factor $1 + r$ once a year.', topic: 'Compound interest'}
- {front: 'Compound interest, $n$ times a year', back: '$A = P\left(1 + \tfrac{r}{n}\right)^{nt}$: rate $\tfrac{r}{n}$ per period, $nt$ periods.', topic: 'Compound interest'}
- {front: '$n$ for semiannual, quarterly, monthly, daily', back: '2, 4, 12, 365', topic: 'Compound interest'}
- {front: 'Simple vs compound interest on a graph', back: 'Simple: a straight line (same amount added each year). Compound: a curve bending upward (same factor each year).', topic: 'Compound interest'}
- {front: '\$1,000 at 10% compounded yearly for 3 years', back: '$1{,}000 \times 1.1^3 = 1{,}331$ dollars (simple interest gives \$1,300).', topic: 'Compound interest'}
- {front: 'Annual percentage yield (APY)', back: '$\left(1 + \tfrac{r}{n}\right)^n - 1$: the true one-year growth. 6% compounded monthly → about 6.17%.', topic: 'Compound interest'}
- {front: 'Comparing two savings accounts', back: 'Compare their APYs, not their stated rates.', topic: 'Compound interest'}
- {front: 'APR vs APY', back: 'APR: yearly cost of a loan, generally without compounding. APY: yearly growth of savings with compounding.', topic: 'Compound interest'}
- {front: 'Rule of 72', back: 'Years to double ≈ 72 ÷ rate (in percent). 8% → about 9 years. An estimate.', topic: 'Compound interest'}
- {front: 'Depreciation at a fixed percent', back: '$A = P(1 - r)^t$: \$28,000 losing 15% a year is worth $28{,}000 \times 0.85^3 \approx 17{,}196$ dollars after 3 years.', topic: 'Compound interest'}
- {front: 'Common slip with monthly compounding', back: 'Use $\tfrac{r}{12}$ per month and $12t$ periods, and don''t round the growth factor early.', topic: 'Compound interest'}
- {front: 'Percent change as a multiplier', back: 'Change $r$ → multiply by $1 + r$ ($r$ negative for a decrease). Multiplier $m$ → change $(m - 1) \times 100\%$.', topic: 'Percent reasoning'}
- {front: 'Chain of percent changes', back: 'Multiply the multipliers (in any order): +10%, −25%, +20% → $1.1 \times 0.75 \times 1.2 = 0.99$, a 1% decrease.', topic: 'Percent reasoning'}
- {front: 'Undoing a rise of $r$', back: 'Fall by $\tfrac{r}{1 + r}$: up 25% is undone by down 20%.', topic: 'Percent reasoning'}
- {front: 'Undoing a fall of $r$', back: 'Rise by $\tfrac{r}{1 - r}$: down 40% needs up $66\tfrac23\%$; down 50% needs up 100%.', topic: 'Percent reasoning'}
- {front: '4% to 5%', back: 'Up 1 percentage point; up 25% relative to the original.', topic: 'Percent reasoning'}
- {front: 'Percentage points vs percent', back: 'Points: subtract the two percents. Percent change: divide that difference by the original.', topic: 'Percent reasoning'}
- {front: 'Relative vs absolute risk', back: '2 in 10,000 → 3 in 10,000 is +50% relative, but only +0.01 percentage point (1 more case per 10,000).', topic: 'Percent reasoning'}
- {front: 'Simpson''s paradox', back: 'One side wins in every group but loses overall, because the groups make up different shares of each total. Check the groups before comparing totals.', topic: 'Percent reasoning'}
- {front: 'When does the order of discounts matter?', back: 'Only when a flat amount (like \$10 off) is involved; percent changes are multiplications, so their order doesn''t matter.', topic: 'Percent reasoning'}
