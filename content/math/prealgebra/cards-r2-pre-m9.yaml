# Round 2, module pre-m9: cards for the honors lessons.
# --- Measuring spread (38h1) ---
- {front: 'Deviation', back: 'Value − mean. The deviations of any data set add to 0.', topic: Mean absolute deviation}
- {front: 'Mean absolute deviation (MAD)', back: 'Mean of the distances from the mean: $\dfrac{\text{sum of } |\text{value} - \text{mean}|}{\text{count}}$.', topic: Mean absolute deviation}
- {front: 'Why not just average the deviations?', back: 'They always add to 0, so their average is always 0. Use distances (absolute values).', topic: Mean absolute deviation}
- {front: 'Steps for the MAD', back: 'Find the mean; find each distance from it; add the distances; divide by the count.', topic: Mean absolute deviation}
- {front: 'Q1 and Q3 (median-of-halves method)', back: 'Order the data, find the median, split into halves (odd count: leave the median out). Q1 = median of the lower half, Q3 = median of the upper half.', topic: Quartiles and box plots}
- {front: 'Five-number summary', back: 'Minimum, Q1, median, Q3, maximum.', topic: Quartiles and box plots}
- {front: 'Interquartile range (IQR)', back: 'Q3 − Q1: the spread of the middle half of the data.', topic: Quartiles and box plots}
- {front: 'Reading a box plot', back: 'Each of the four sections holds about 25% of the data; a longer section means more spread, not more values.', topic: Quartiles and box plots}
- {front: '1.5 × IQR outlier rule', back: 'Flag values below $Q_1 - 1.5 \times \text{IQR}$ or above $Q_3 + 1.5 \times \text{IQR}$. A convention: flagged values should be checked, not automatically deleted.', topic: Quartiles and box plots}
- {front: 'Which spread goes with which center?', back: 'Mean with MAD (symmetric data, no outliers); median with IQR (outliers or lopsided data).', topic: Quartiles and box plots}
- {front: 'Resistant measures', back: 'Median and IQR barely change when an outlier is added; mean, range and MAD do.', topic: Quartiles and box plots}
# --- Tree diagrams and expected value (38h2) ---
- {front: 'Tree diagram rules', back: 'Branches from one point add to 1. Multiply along a path; add separate paths; all paths add to 1.', topic: Tree diagrams}
- {front: 'General multiplication rule', back: '$P(A \text{ and } B) = P(A) \times P(B \text{ after } A)$', topic: Tree diagrams}
- {front: 'Drawing without replacement', back: 'After each draw, lower both the count of that kind and the total by 1. The draws are dependent.', topic: Tree diagrams}
- {front: 'With vs without replacement', back: 'With replacement the draws are independent (same probabilities each time); without replacement they are dependent.', topic: Tree diagrams}
- {front: '"Exactly one" in two stages', back: 'Add both orders: (yes, no) + (no, yes).', topic: Tree diagrams}
- {front: 'P(at least one)', back: '$1 - P(\text{none})$', topic: Tree diagrams}
- {front: 'Expected value', back: 'Sum of value × probability: the long-run average per trial.', topic: Expected value}
- {front: 'Expected net gain of a game', back: 'Expected prize − price to play (or the expected value of prize minus price for each outcome).', topic: Expected value}
- {front: 'Fair game', back: 'Expected net gain = 0, i.e. the price equals the expected prize.', topic: Expected value}
- {front: 'Law of large numbers', back: 'Over many trials, the average result approaches the expected value. It says nothing about the next few trials.', topic: Expected value}
