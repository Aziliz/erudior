# Round 2, module phys-m7: terms bolded in the honors lessons 29h1-29h3.
- term: Otto cycle
  definition: 'The ideal cycle of a spark-ignition (gasoline) engine: adiabatic compression, heat added at constant volume, adiabatic expansion, heat rejected at constant volume. Its air-standard efficiency is $1 - 1/r^{\gamma-1}$.'
  topic: Engine cycles
- term: Diesel cycle
  definition: 'The ideal cycle of a compression-ignition engine: adiabatic compression, heat added at constant pressure, adiabatic expansion, heat rejected at constant volume.'
  topic: Engine cycles
- term: Brayton cycle
  aliases: [Joule cycle]
  definition: 'The ideal cycle of a gas turbine or jet engine: adiabatic compression, heat added at constant pressure, adiabatic expansion, heat rejected at constant pressure. Efficiency $1 - r_p^{-(\gamma-1)/\gamma}$.'
  topic: Engine cycles
- term: air-standard model
  aliases: [air-standard cycle, air-standard analysis]
  definition: 'A simplified model of an engine in which a fixed amount of air, treated as an ideal gas with constant specific heats, has heat added in place of combustion and removed in place of exhaust, with every step reversible.'
  topic: Engine cycles
- term: compression ratio
  definition: 'In a piston engine, the largest cylinder volume divided by the smallest, $r = V_{\max}/V_{\min}$.'
  topic: Engine cycles
- term: power stroke
  definition: 'The stroke of a piston engine in which the hot, high-pressure gas pushes the piston and does work; in the Otto cycle, the adiabatic expansion.'
  topic: Engine cycles
- term: engine knock
  aliases: [knock, knocking, detonation]
  definition: 'Uncontrolled self-ignition of the compressed fuel–air mixture before or apart from the spark; it limits the compression ratio of gasoline engines.'
  topic: Engine cycles
- term: cutoff ratio
  definition: 'In the Diesel cycle, the volume at the end of the constant-pressure heat addition divided by the volume at its start, $r_c = V_3/V_2$.'
  topic: Engine cycles
- term: pressure ratio
  definition: 'In the Brayton cycle, the highest pressure divided by the lowest, $r_p = P_{\max}/P_{\min}$, set by the compressor.'
  topic: Engine cycles
- term: combined-cycle
  aliases: [combined cycle, combined-cycle plant]
  definition: 'A power plant that uses a gas turbine''s hot exhaust to make steam for a second, steam turbine; the best convert a little over 60% of the fuel''s energy to electricity.'
  topic: Engine cycles
- term: microstate
  aliases: [microstates]
  definition: 'A complete description of a system at the level of its particles, such as which side each coin shows or the position and velocity of every molecule.'
  topic: Statistical entropy
- term: macrostate
  aliases: [macrostates]
  definition: 'A description of a system by measurable quantities only, such as the number of heads or the pressure, volume and temperature of a gas. Many microstates usually share one macrostate.'
  topic: Statistical entropy
- term: multiplicity
  definition: 'The number of microstates $\Omega$ that belong to a given macrostate.'
  topic: Statistical entropy
- term: fundamental assumption
  aliases: [fundamental assumption of statistical mechanics]
  definition: 'The assumption that an isolated system in equilibrium is equally likely to be in any of its accessible microstates.'
  topic: Statistical entropy
- term: Boltzmann's entropy formula
  aliases: [Boltzmann entropy formula]
  definition: '$S = k_B\ln\Omega$: entropy is Boltzmann''s constant times the natural log of the number of microstates.'
  topic: Statistical entropy
- term: statistical definition of temperature
  definition: '$1/T = \partial S/\partial E$ at fixed volume and particle number: temperature measures how fast entropy grows as energy is added.'
  topic: Statistical entropy
- term: Einstein solid
  definition: 'A simple model of a crystal as $N$ identical oscillators (three per atom) holding whole quanta of energy; $q$ quanta can be shared in $\binom{q + N - 1}{q}$ ways.'
  topic: Statistical entropy
- term: Boltzmann factor
  definition: '$e^{-E/(k_BT)}$, the relative probability of a particular state of energy $E$ for a system in contact with surroundings at temperature $T$.'
  topic: Statistical entropy
- term: scale height
  definition: 'The height over which the density of an isothermal atmosphere falls by a factor of $e$: $H = k_BT/(mg) = RT/(Mg)$, about 8.6 km for air near room temperature.'
  topic: Statistical entropy
- term: third law of thermodynamics
  aliases: [third law]
  definition: 'The entropy of a perfect crystal approaches zero as its temperature approaches absolute zero.'
  topic: Statistical entropy
- term: no-slip condition
  aliases: [no slip, no-slip]
  definition: 'The observation that a viscous fluid touching a solid surface moves with that surface; in a pipe, the fluid at the wall is at rest.'
  topic: Viscous flow
- term: shear stress
  definition: 'Force per area parallel to a surface; in a fluid with viscosity $\eta$, $\tau = \eta\,dv/dy$.'
  topic: Viscous flow
- term: Newtonian fluid
  aliases: [Newtonian fluids]
  definition: 'A fluid whose shear stress is proportional to its velocity gradient, with a viscosity that does not depend on how fast it flows (water, air, most oils).'
  topic: Viscous flow
- term: Poiseuille's law
  aliases: [Poiseuille law, Hagen–Poiseuille law, Hagen-Poiseuille law]
  definition: 'The flow rate of laminar flow through a pipe: $Q = \dfrac{\pi R^4\Delta P}{8\eta L}$.'
  topic: Viscous flow
- term: flow resistance
  aliases: [hydraulic resistance]
  definition: 'The pressure difference needed per unit flow rate, $\Delta P/Q$; for laminar flow in a pipe, $8\eta L/(\pi R^4)$.'
  topic: Viscous flow
- term: laminar flow
  aliases: [laminar]
  definition: 'Smooth flow in which layers of fluid slide past one another without mixing; in a pipe, usually when the Reynolds number is below about 2000.'
  topic: Viscous flow
- term: turbulent flow
  aliases: [turbulent, turbulence]
  definition: 'Chaotic flow full of eddies, which takes a larger pressure difference to drive; in a pipe, usually when the Reynolds number is above about 3000.'
  topic: Viscous flow
- term: Reynolds number
  aliases: [Re]
  definition: 'The dimensionless number $\text{Re} = \rho vD/\eta$, comparing inertial and viscous effects; it decides whether a flow is laminar or turbulent.'
  topic: Viscous flow
- term: Stokes' law
  aliases: [Stokes drag, Stokes's law]
  definition: 'The drag on a sphere of radius $r$ moving slowly (Re much less than 1) through a fluid: $F = 6\pi\eta rv$.'
  topic: Viscous flow
- term: falling-ball viscometer
  definition: 'A device that measures a liquid''s viscosity from the terminal speed of a ball falling through it, using Stokes'' law.'
  topic: Viscous flow
