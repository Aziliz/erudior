# Honors module phys-h1 (Round 2): cards for lessons 90-93
# 90 Lagrangian mechanics
- {front: 'The Lagrangian', back: '$L = T - U$ (kinetic minus potential), in generalized coordinates and their rates. Not the total energy.', topic: Lagrangian mechanics}
- {front: 'The action', back: '$S = \int_{t_1}^{t_2}L\,dt$ (units J·s), one number for a whole path.', topic: Lagrangian mechanics}
- {front: 'Hamilton''s principle', back: 'The true path between fixed endpoints makes the action stationary (not always a minimum).', topic: Lagrangian mechanics}
- {front: 'Euler–Lagrange equation', back: '$\dfrac{d}{dt}\left(\dfrac{\partial L}{\partial\dot q}\right) - \dfrac{\partial L}{\partial q} = 0$, one per generalized coordinate.', topic: Lagrangian mechanics}
- {front: 'Generalized coordinates: how many?', back: 'One per degree of freedom, chosen so the constraints hold automatically (pendulum: one angle).', topic: Lagrangian mechanics}
- {front: 'Euler–Lagrange for $L = \tfrac12m\dot x^2 - U(x)$', back: '$m\ddot x = -dU/dx$: Newton''s second law.', topic: Lagrangian mechanics}
- {front: 'Pendulum from its Lagrangian', back: '$L = \tfrac12m\ell^2\dot\theta^2 + mg\ell\cos\theta$ gives $\ddot\theta = -(g/\ell)\sin\theta$.', topic: Lagrangian mechanics}
- {front: 'Atwood machine with a disk pulley', back: '$a = \dfrac{(m_1 - m_2)g}{m_1 + m_2 + \tfrac12M}$; the tensions never appear.', topic: Lagrangian mechanics}
- {front: 'Swinging uniform rod (pivot at one end)', back: '$\omega = \sqrt{3g/(2\ell)}$ for small swings.', topic: Lagrangian mechanics}
- {front: 'What $L = T - U$ does not handle directly', back: 'Constraint forces (they don''t appear; use Newton or Lagrange multipliers) and nonconservative forces like friction and drag (need generalized forces).', topic: Lagrangian mechanics}
# 91 Symmetry, conservation laws and the Hamiltonian
- {front: 'Generalized momentum', back: '$p = \partial L/\partial\dot q$; Euler–Lagrange becomes $\dot p = \partial L/\partial q$.', topic: Symmetry and conservation}
- {front: 'Cyclic coordinate', back: '$q$ absent from $L$ ⇒ $p$ conserved.', topic: Symmetry and conservation}
- {front: 'Central force in polar coordinates', back: '$L = \tfrac12m(\dot r^2 + r^2\dot\varphi^2) - U(r)$; $\varphi$ cyclic, so $mr^2\dot\varphi$ (angular momentum) is conserved.', topic: Symmetry and conservation}
- {front: 'Noether''s theorem', back: 'Continuous symmetry ↔ conserved quantity: time shift → energy; position shift → momentum; rotation → angular momentum.', topic: Symmetry and conservation}
- {front: 'Puck pulled inward on a string through a hole', back: '$\omega \propto 1/r^2$ (angular momentum conserved); kinetic energy rises because the puller does work.', topic: Symmetry and conservation}
- {front: 'The Hamiltonian', back: '$H = \sum p\dot q - L$; conserved if $L$ has no explicit $t$; equals $T + U$ for fixed constraints.', topic: Hamiltonian mechanics}
- {front: 'Hamilton''s equations', back: '$\dot q = \partial H/\partial p$, $\dot p = -\partial H/\partial q$', topic: Hamiltonian mechanics}
- {front: 'Oscillator in phase space', back: 'An ellipse with semi-axes $x_{\max} = \sqrt{2E/k}$ and $p_{\max} = \sqrt{2mE}$; area $2\pi E/\omega$.', topic: Hamiltonian mechanics}
- {front: 'Pendulum separatrix (rigid rod)', back: 'Energy to just reach the top: bottom speed $\sqrt{4g\ell}$. Divides swings (closed loops) from rotations.', topic: Hamiltonian mechanics}
- {front: 'Liouville''s theorem', back: 'Hamiltonian flow keeps phase-space area (volume) constant.', topic: Hamiltonian mechanics}
# 92 Central forces and the Kepler problem
- {front: 'Reduced mass', back: '$\mu = \dfrac{m_1m_2}{m_1 + m_2}$: two bodies reduce to one of mass $\mu$ moving about the center of mass.', topic: Central forces}
- {front: 'Effective potential (gravity)', back: '$U_{\text{eff}} = \dfrac{\ell^2}{2mr^2} - \dfrac{GMm}{r}$; turning points where $E = U_{\text{eff}}$; minimum = circular orbit.', topic: Central forces}
- {front: 'Orbit equation (gravity)', back: '$r = \dfrac{p}{1 + e\cos\varphi}$ with $p = \ell^2/(GMm^2)$: a conic with the central body at a focus.', topic: Central forces}
- {front: 'Eccentricity and orbit type', back: '$e = 0$ circle; $0 < e < 1$ ellipse ($E < 0$); $e = 1$ parabola ($E = 0$); $e > 1$ hyperbola ($E > 0$).', topic: Kepler orbits}
- {front: 'Ellipse: periapsis and apoapsis', back: '$r_p = a(1 - e)$, $r_a = a(1 + e)$; $a = \tfrac12(r_p + r_a)$, $e = \dfrac{r_a - r_p}{r_a + r_p}$.', topic: Kepler orbits}
- {front: 'Energy of a Kepler orbit', back: '$E = -\dfrac{GMm}{2a}$: depends only on the semimajor axis.', topic: Kepler orbits}
- {front: 'Vis-viva equation', back: '$v^2 = GM\left(\dfrac{2}{r} - \dfrac{1}{a}\right)$', topic: Kepler orbits}
- {front: 'Kepler''s third law for ellipses', back: '$T^2 = \dfrac{4\pi^2}{GM}a^3$, independent of $e$ (use $G(m_1 + m_2)$ for exact two-body work).', topic: Kepler orbits}
- {front: 'Speeds at periapsis and apoapsis', back: '$r_pv_p = r_av_a$ (angular momentum).', topic: Kepler orbits}
- {front: 'Is this orbit bound?', back: 'Compute $\varepsilon = v^2/2 - GM/r$: negative means an ellipse with $a = -GM/(2\varepsilon)$.', topic: Kepler orbits}
- {front: 'Bertrand''s theorem', back: 'Only $F \propto 1/r^2$ and $F \propto r$ make all bound orbits close.', topic: Central forces}
# 93 Orbital maneuvers and transfers
- {front: 'Mass ratio for a given delta-v', back: '$m_i/m_f = e^{\Delta v/u}$ (rocket equation).', topic: Orbital maneuvers}
- {front: 'Effect of a forward burn at periapsis', back: 'Raises the apoapsis (the opposite side); the burn point stays put.', topic: Orbital maneuvers}
- {front: 'Hohmann transfer orbit', back: 'Half an ellipse with $a_t = \tfrac12(r_1 + r_2)$; trip time $\pi\sqrt{a_t^3/GM}$.', topic: Orbital maneuvers}
- {front: 'Hohmann burns (outward)', back: '$\Delta v_1 = v_{\text{peri}} - \sqrt{GM/r_1}$, $\Delta v_2 = \sqrt{GM/r_2} - v_{\text{apo}}$; both forward, speeds from vis-viva.', topic: Orbital maneuvers}
- {front: 'LEO to GEO by Hohmann', back: 'About 2.4 + 1.5 = 3.9 km/s, about 5.3 h (ignoring any plane change).', topic: Orbital maneuvers}
- {front: 'Earth to Mars by Hohmann (circular model)', back: 'About 258 days; launch with Mars about 44° ahead; windows every 26 months.', topic: Orbital maneuvers}
- {front: 'Synodic period', back: '$1/S = |1/T_1 - 1/T_2|$; Earth–Mars 2.14 yr.', topic: Orbital maneuvers}
- {front: 'Departure burn for a hyperbolic excess speed', back: '$v = \sqrt{v_\infty^2 + v_{\text{esc}}^2}$ at the burn point; burn $= v - v_{\text{circ}}$.', topic: Orbital maneuvers}
- {front: 'Oberth effect', back: 'A burn adds about $mv\,\Delta v$ of kinetic energy, so burn where $v$ is largest (low periapsis).', topic: Orbital maneuvers}
- {front: 'Gravity assist', back: 'Same speed in the planet''s frame, turned direction; in the Sun''s frame the speed can change (up to $2U$ in the idealized head-on limit).', topic: Orbital maneuvers}
