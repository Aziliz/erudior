# Round 2 glossary for module phys-m3 (honors lessons 10h1-10h3)
- term: relative acceleration
  definition: 'The acceleration of one object as measured from another, $\vec a_A - \vec a_B$; for slipping stacked blocks it sets how fast one slides along the other.'
  topic: Friction in systems
- term: angle of friction
  definition: 'The angle whose tangent equals the coefficient of friction, $\tan\theta = \mu$: the steepest incline an object can rest on (with $\mu_s$) and the best angle for dragging a crate (with $\mu_k$).'
  topic: Friction in systems
- term: capstan equation
  aliases: [Euler–Eytelwein formula, Euler-Eytelwein formula]
  definition: '$T_{\text{load}} = T_{\text{hold}}e^{\mu\theta}$: the largest load a rope wrapped through angle $\theta$ (radians) around a fixed post can hold against a smaller holding force, in the ideal flexible-rope model.'
  topic: Friction in systems
- term: wrap angle
  definition: 'The total angle, in radians, through which a rope or belt touches a post or pulley; $2\pi$ for each full turn.'
  topic: Friction in systems
- term: linear drag
  definition: 'Drag proportional to speed, $F_D = bv$; it describes small, slow objects in a viscous fluid (Reynolds number much less than 1).'
  topic: Drag
- term: quadratic drag
  definition: 'Drag proportional to the square of the speed, $F_D = \tfrac12C\rho Av^2$; it describes most everyday objects moving through air or water.'
  topic: Drag
- term: drag coefficient
  definition: 'The dimensionless, measured number $C$ in the quadratic drag law $\tfrac12C\rho Av^2$; it depends on shape (roughly 0.5 for a sphere, about 1 for a person falling flat).'
  topic: Drag
- term: fictitious force
  aliases: [fictitious forces, inertial force, inertial forces, pseudo-force, pseudo-forces]
  definition: 'A term added to Newton''s second law in an accelerating frame, such as $-m\vec A$; it has no agent and no third-law partner.'
  topic: Non-inertial frames
- term: non-inertial frame
  aliases: [non-inertial frames, noninertial frame, accelerating frame]
  definition: 'A reference frame that accelerates or rotates relative to inertial frames; Newton''s laws hold in it only if fictitious forces are added.'
  topic: Non-inertial frames
- term: effective gravity
  definition: 'In a frame accelerating at $\vec A$, the combination $\vec g_{\text{eff}} = \vec g - \vec A$ that objects behave as if it were gravity; a plumb line hangs along it.'
  topic: Non-inertial frames
- term: centrifugal force
  definition: 'The fictitious force $m\omega^2r$ pointing away from the axis that appears in a rotating frame; it is not a real force in an inertial frame.'
  topic: Non-inertial frames
- term: Coriolis force
  aliases: [Coriolis effect]
  definition: 'The fictitious force $-2m\vec\omega\times\vec v''$ on an object moving in a rotating frame; it is perpendicular to the velocity, so it does no work. It deflects motion to the right in Earth''s Northern Hemisphere.'
  topic: Non-inertial frames
- term: Foucault pendulum
  definition: 'A long pendulum whose plane of swing slowly turns relative to the ground because Earth rotates, once every $23.93\text{ h}/\sin\lambda$ at latitude $\lambda$; first shown in Paris in 1851.'
  topic: Non-inertial frames
