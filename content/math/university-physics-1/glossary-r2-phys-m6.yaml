# Round 2 glossary for phys-m6 honors lessons (Fourier analysis; coupled oscillators and normal modes).
- term: Fourier analysis
  definition: 'Breaking a signal into sinusoids of different frequencies, to find which frequencies it contains and how strongly.'
  topic: Fourier analysis
- term: Fourier's theorem
  aliases: [Fourier theorem]
  definition: 'Any periodic signal with period $T$ (piecewise smooth, as in physics) is a sum of a constant and sinusoids at the frequencies $n/T$, $n = 1, 2, 3, \ldots$'
  topic: Fourier analysis
- term: Fourier series
  definition: 'The sum $a_0 + \sum_n [a_n\cos(n\omega_1t) + b_n\sin(n\omega_1t)]$, with $\omega_1 = 2\pi/T$, that represents a periodic signal.'
  topic: Fourier analysis
- term: Fourier coefficients
  aliases: [Fourier coefficient]
  definition: 'The numbers $a_0$, $a_n$, $b_n$ in a Fourier series: $a_0$ is the average, and $a_n, b_n = \tfrac2T\int_0^T y\cos$ or $\sin(n\omega_1t)\,dt$.'
  topic: Fourier analysis
- term: orthogonal
  aliases: [orthogonality]
  definition: 'Of two functions over an interval: the integral of their product over it is zero. Different harmonics are orthogonal over one period.'
  topic: Fourier analysis
- term: Gibbs phenomenon
  definition: 'The overshoot of about 9% of the jump that a partial Fourier sum always shows next to a jump; more terms make it narrower, not smaller.'
  topic: Fourier analysis
- term: spectrum
  aliases: [spectra, frequency spectrum]
  definition: 'A graph or list of the amplitudes (or powers) of the frequency components in a signal.'
  topic: Fourier analysis
- term: Parseval's theorem
  definition: 'The mean square of a periodic signal is the sum of its parts: $\overline{y^2} = a_0^2 + \tfrac12\sum_n c_n^2$, so the power in each harmonic adds separately.'
  topic: Fourier analysis
- term: coupled oscillators
  aliases: [coupled oscillator]
  definition: 'Two or more oscillators connected so that each one exerts forces on the others, such as two pendulums joined by a spring.'
  topic: Normal modes
- term: coupling spring
  aliases: [coupling springs]
  definition: 'The spring that connects two oscillators to each other, as opposed to the springs that hold each one to a fixed support.'
  topic: Normal modes
- term: normal mode
  aliases: [normal modes]
  definition: 'A motion of a system in which every part oscillates at the same frequency with fixed amplitude ratios; any motion is a superposition of normal modes.'
  topic: Normal modes
- term: normal coordinates
  aliases: [normal coordinate]
  definition: 'Combinations of the coordinates (such as $x_1 + x_2$ and $x_1 - x_2$ for two equal masses) that each obey a separate SHM equation.'
  topic: Normal modes
- term: dispersion
  definition: 'Dependence of a wave''s speed on its frequency or wavelength, as for the short waves on a beaded string.'
  topic: Normal modes
