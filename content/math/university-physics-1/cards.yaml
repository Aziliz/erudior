# Notecards
- {front: 'SI base units for length, mass, time, current', back: 'meter (m), kilogram (kg), second (s), ampere (A)', topic: Units and conversions}
- {front: 'The newton in base units', back: '$1\text{ N} = 1\text{ kg·m/s}^2$', topic: Units and conversions}
- {front: 'The joule in base units', back: '$1\text{ J} = 1\text{ N·m} = 1\text{ kg·m}^2/\text{s}^2$', topic: Units and conversions}
- {front: 'km/h to m/s', back: 'Divide by 3.6 (since $1\text{ km/h} = \tfrac{1000}{3600}\text{ m/s}$).', topic: Units and conversions}
- {front: 'cm² to m² and cm³ to m³', back: '$1\text{ cm}^2 = 10^{-4}\text{ m}^2$; $1\text{ cm}^3 = 10^{-6}\text{ m}^3$. Square or cube the factor.', topic: Units and conversions}
- {front: 'Prefixes: G, M, k, c, m, μ, n', back: '$10^9, 10^6, 10^3, 10^{-2}, 10^{-3}, 10^{-6}, 10^{-9}$', topic: Units and conversions}
- {front: 'Sig figs rule for multiplying and dividing', back: 'Keep as many significant figures as the input with the fewest.', topic: Significant figures}
- {front: 'Sig figs rule for adding and subtracting', back: 'Keep as many decimal places as the input with the fewest decimal places.', topic: Significant figures}
- {front: 'Which zeros are significant?', back: 'Zeros between nonzero digits and trailing zeros after a decimal point. Leading zeros never are.', topic: Significant figures}
- {front: 'What can dimensional analysis catch, and what can''t it?', back: 'It catches wrong powers and missing quantities, but not wrong pure-number factors like 2 or π.', topic: Dimensional analysis}
- {front: 'Arguments of sin, exp, ln must be…', back: 'Dimensionless.', topic: Dimensional analysis}
- {front: 'Components of a vector at angle θ from +x', back: '$A_x = A\cos\theta$, $A_y = A\sin\theta$', topic: Vectors}
- {front: 'Magnitude and direction from components', back: '$A = \sqrt{A_x^2 + A_y^2}$, $\tan\theta = A_y/A_x$ (add 180° if $A_x < 0$).', topic: Vectors}
- {front: 'How to add vectors precisely', back: 'Add their components separately: $R_x = A_x + B_x$, $R_y = A_y + B_y$.', topic: Vectors}
- {front: 'Dot product', back: '$\vec A\cdot\vec B = AB\cos\phi = A_xB_x + A_yB_y + A_zB_z$ (a scalar; zero when perpendicular).', topic: Vector products}
- {front: 'Cross product magnitude and direction', back: '$|\vec A\times\vec B| = AB\sin\phi$, perpendicular to both by the right-hand rule; $\vec B\times\vec A = -\vec A\times\vec B$.', topic: Vector products}
- {front: 'Displacement vs distance', back: 'Displacement $\Delta x = x_f - x_i$ is signed (a vector); distance is total path length, always positive.', topic: Velocity and acceleration}
- {front: 'Average velocity vs average speed', back: 'Velocity: displacement/time. Speed: distance/time.', topic: Velocity and acceleration}
- {front: 'When does an object speed up?', back: 'When $v$ and $a$ have the same sign. Opposite signs: it slows down.', topic: Velocity and acceleration}
- {front: 'Slope of an x–t graph', back: 'Velocity.', topic: Motion graphs}
- {front: 'Slope of a v–t graph; area under a v–t graph', back: 'Slope = acceleration; signed area = displacement.', topic: Motion graphs}
- {front: 'v(t) and a(t) from x(t)', back: '$v = dx/dt$, $a = dv/dt = d^2x/dt^2$.', topic: Velocity and acceleration}
- {front: 'Constant-acceleration equation with no Δx', back: '$v = v_0 + at$', topic: Constant acceleration}
- {front: 'Constant-acceleration equation with no final v', back: '$\Delta x = v_0t + \tfrac12at^2$', topic: Constant acceleration}
- {front: 'Constant-acceleration equation with no t', back: '$v^2 = v_0^2 + 2a\Delta x$', topic: Constant acceleration}
- {front: 'Stopping distance from speed $v_0$ at deceleration $a$', back: '$d = \dfrac{v_0^2}{2a}$ (proportional to $v_0^2$).', topic: Constant acceleration}
- {front: 'Free fall acceleration', back: '$g = 9.8\text{ m/s}^2$ downward, the same for all masses (no air resistance).', topic: Free fall}
- {front: 'Dropped from height h: time and impact speed', back: '$t = \sqrt{2h/g}$, $v = \sqrt{2gh}$', topic: Free fall}
- {front: 'Projectile: what stays constant?', back: 'The horizontal velocity $v_0\cos\theta$ (and the acceleration, $g$ down).', topic: Projectile motion}
- {front: 'Level-ground range, height, time of flight', back: '$R = \dfrac{v_0^2\sin 2\theta}{g}$, $H = \dfrac{v_0^2\sin^2\theta}{2g}$, $T = \dfrac{2v_0\sin\theta}{g}$', topic: Projectile motion}
- {front: 'Launch angle for maximum range (level ground)', back: '45°; complementary angles give equal ranges.', topic: Projectile motion}
- {front: 'Relative velocity rule', back: '$\vec v_{AC} = \vec v_{AB} + \vec v_{BC}$, and $\vec v_{BA} = -\vec v_{AB}$.', topic: Relative motion}
- {front: 'Fastest way across a river vs landing directly opposite', back: 'Fastest: head straight across (time = width/speed). Opposite: head upstream at $\sin\alpha = v_{\text{current}}/v_{\text{boat}}$.', topic: Relative motion}
- {front: 'Newton''s first law', back: 'No net force means no change in velocity (constant speed in a straight line, or rest).', topic: Newton's laws}
- {front: 'Newton''s second law (component form)', back: '$\sum F_x = ma_x$, $\sum F_y = ma_y$', topic: Newton's laws}
- {front: 'Newton''s third law', back: '$\vec F_{\text{A on B}} = -\vec F_{\text{B on A}}$: equal, opposite, on different objects, same type of force.', topic: Newton's laws}
- {front: 'Mass vs weight', back: 'Mass (kg) measures inertia and never changes; weight $mg$ (N) is the gravitational force and depends on $g$.', topic: Newton's laws}
- {front: 'Steps for a free-body diagram', back: 'Isolate the object; draw weight; add a force for each contact (normal, friction, tension, push); choose axes along $\vec a$; write $\sum F = ma$ per axis.', topic: Free-body diagrams}
- {front: 'Scale reading in an elevator accelerating at a (up positive)', back: '$n = m(g + a)$', topic: Free-body diagrams}
- {front: 'Kinetic friction', back: '$f_k = \mu_k n$, opposite the sliding velocity.', topic: Friction}
- {front: 'Static friction', back: '$f_s \le \mu_s n$; equals $\mu_s n$ only on the verge of slipping.', topic: Friction}
- {front: 'Weight components on an incline at θ', back: '$mg\sin\theta$ down the slope, $mg\cos\theta$ into the slope; $n = mg\cos\theta$.', topic: Inclined planes}
- {front: 'Acceleration down a frictionless incline', back: '$a = g\sin\theta$', topic: Inclined planes}
- {front: 'Acceleration sliding down an incline with friction', back: '$a = g(\sin\theta - \mu_k\cos\theta)$', topic: Inclined planes}
- {front: 'Angle at which an object just starts to slide', back: '$\tan\theta = \mu_s$', topic: Inclined planes}
- {front: 'Terminal velocity with linear drag $bv$', back: '$v_T = mg/b$; $v(t) = v_T(1 - e^{-bt/m})$.', topic: Friction}
- {front: 'Atwood machine acceleration and tension', back: '$a = \dfrac{m_1 - m_2}{m_1 + m_2}g$, $T = \dfrac{2m_1m_2}{m_1 + m_2}g$', topic: Tension and pulleys}
- {front: 'Block on table (μk) pulled by hanging mass $m_2$', back: '$a = \dfrac{m_2 - \mu_k m_1}{m_1 + m_2}g$', topic: Tension and pulleys}
- {front: 'Centripetal acceleration', back: '$a_c = \dfrac{v^2}{r} = \dfrac{4\pi^2 r}{T^2} = \omega^2 r$, toward the center.', topic: Circular motion}
- {front: 'Speed in uniform circular motion', back: '$v = \dfrac{2\pi r}{T} = 2\pi r f$', topic: Circular motion}
- {front: 'Max speed on a flat curve', back: '$v_{\max} = \sqrt{\mu_s g r}$', topic: Circular motion}
- {front: 'Frictionless banking angle', back: '$\tan\theta = \dfrac{v^2}{rg}$', topic: Circular motion}
- {front: 'Minimum speed at the top of a vertical loop', back: '$v_{\min} = \sqrt{gr}$ (normal force zero there).', topic: Circular motion}
- {front: 'Work by a constant force', back: '$W = Fd\cos\theta$ (θ between $\vec F$ and $\vec d$); zero if perpendicular, negative if opposing.', topic: Work and kinetic energy}
- {front: 'Work–energy theorem', back: '$W_{\text{net}} = \Delta K = \tfrac12mv_f^2 - \tfrac12mv_i^2$', topic: Work and kinetic energy}
- {front: 'Hooke''s law and spring energy', back: '$F = -kx$; $U = \tfrac12kx^2$ (= work to stretch by $x$).', topic: Work and kinetic energy}
- {front: 'Work by a variable force', back: '$W = \int_{x_1}^{x_2}F(x)\,dx$ = area under the $F$–$x$ graph.', topic: Work and kinetic energy}
- {front: 'Gravitational PE near Earth', back: '$U_g = mgy$ (zero level is your choice).', topic: Conservation of energy}
- {front: 'Conservation of mechanical energy', back: '$K_i + U_i = K_f + U_f$ when only conservative forces do work.', topic: Conservation of energy}
- {front: 'Energy equation with friction', back: '$K_i + U_i + W_{\text{nc}} = K_f + U_f$, with $W_{\text{friction}} = -f_kd$.', topic: Conservation of energy}
- {front: 'Speed after falling height h (any frictionless path)', back: '$v = \sqrt{2gh}$', topic: Conservation of energy}
- {front: 'Force from potential energy', back: '$F = -\dfrac{dU}{dx}$; equilibrium where $dU/dx = 0$, stable if $U$ is a minimum.', topic: Conservation of energy}
- {front: 'Power', back: '$P = W/\Delta t = Fv$; 1 W = 1 J/s; 1 hp = 746 W.', topic: Power}
- {front: 'Momentum', back: '$\vec p = m\vec v$; $K = p^2/(2m)$.', topic: Momentum and impulse}
- {front: 'Impulse–momentum theorem', back: '$\vec J = \vec F_{\text{avg}}\Delta t = \Delta\vec p$ (generally $\int\vec F\,dt$).', topic: Momentum and impulse}
- {front: 'Why do air bags and crumple zones help?', back: 'They lengthen the stopping time, so the same $\Delta p$ needs a smaller average force.', topic: Momentum and impulse}
- {front: 'When is momentum conserved?', back: 'When the net external force on the system is zero (component by component).', topic: Momentum and impulse}
- {front: 'Center of mass', back: '$x_{\text{cm}} = \dfrac{\sum m_ix_i}{M}$, or $\dfrac1M\int x\,dm$; $\vec F_{\text{ext}} = M\vec a_{\text{cm}}$.', topic: Center of mass}
- {front: 'Elastic vs inelastic vs perfectly inelastic', back: 'All conserve momentum. Elastic also conserves KE; perfectly inelastic objects stick and lose the most KE.', topic: Collisions}
- {front: 'Perfectly inelastic final velocity', back: '$v_f = \dfrac{m_1v_{1i} + m_2v_{2i}}{m_1 + m_2}$', topic: Collisions}
- {front: 'Elastic collision, target at rest', back: '$v_{1f} = \dfrac{m_1 - m_2}{m_1 + m_2}v_{1i}$, $v_{2f} = \dfrac{2m_1}{m_1 + m_2}v_{1i}$', topic: Collisions}
- {front: 'Elastic head-on collision: relative velocity', back: 'It reverses: $v_{1i} - v_{2i} = -(v_{1f} - v_{2f})$.', topic: Collisions}
- {front: 'Ballistic pendulum method', back: 'Momentum conservation for the collision, then energy conservation for the swing: $v = \dfrac{m + M}{m}\sqrt{2gh}$.', topic: Collisions}
- {front: 'rpm to rad/s', back: 'Multiply by $2\pi/60 \approx 0.1047$.', topic: Rotational kinematics}
- {front: 'Linear–angular links', back: '$s = r\theta$, $v = r\omega$, $a_t = r\alpha$, $a_c = r\omega^2$ (θ in radians).', topic: Rotational kinematics}
- {front: 'Constant angular acceleration equations', back: '$\omega = \omega_0 + \alpha t$; $\Delta\theta = \omega_0t + \tfrac12\alpha t^2$; $\omega^2 = \omega_0^2 + 2\alpha\Delta\theta$', topic: Rotational kinematics}
- {front: 'Moment of inertia (discrete and continuous)', back: '$I = \sum m_ir_i^2 = \int r^2\,dm$', topic: Moment of inertia}
- {front: 'I for hoop, solid disk, solid sphere, hollow sphere (central axis)', back: '$MR^2$, $\tfrac12MR^2$, $\tfrac25MR^2$, $\tfrac23MR^2$', topic: Moment of inertia}
- {front: 'Parallel-axis theorem', back: '$I = I_{\text{cm}} + Md^2$', topic: Moment of inertia}
- {front: 'Rotational kinetic energy', back: '$K = \tfrac12I\omega^2$', topic: Moment of inertia}
- {front: 'Torque', back: '$\tau = rF\sin\theta = rF_\perp$; $\vec\tau = \vec r\times\vec F$; counterclockwise positive.', topic: Torque}
- {front: 'Newton''s second law for rotation', back: '$\sum\tau = I\alpha$', topic: Rotational dynamics}
- {front: 'Mass m hanging from a solid cylinder pulley of mass M', back: '$a = \dfrac{mg}{m + \tfrac12M}$, $T = \tfrac12Ma$', topic: Rotational dynamics}
- {front: 'Rolling without slipping', back: '$v_{\text{cm}} = R\omega$; $K = \tfrac12Mv^2 + \tfrac12I\omega^2$', topic: Rolling motion}
- {front: 'Speed at the bottom of a ramp for a rolling object with $I = cMR^2$', back: '$v = \sqrt{\dfrac{2gh}{1 + c}}$', topic: Rolling motion}
- {front: 'Rolling race order', back: 'Solid sphere, solid cylinder, hollow sphere, hoop (smallest $c$ first).', topic: Rolling motion}
- {front: 'Angular momentum', back: '$L = I\omega$; particle: $L = mvr_\perp$; vector: $\vec L = \vec r\times\vec p$.', topic: Angular momentum}
- {front: 'Torque and angular momentum', back: '$\vec\tau_{\text{net}} = d\vec L/dt$', topic: Angular momentum}
- {front: 'Conservation of angular momentum', back: 'No external torque: $I_i\omega_i = I_f\omega_f$ (KE need not be conserved).', topic: Angular momentum}
- {front: 'Conditions for static equilibrium', back: '$\sum\vec F = 0$ and $\sum\tau = 0$ about any point.', topic: Static equilibrium}
- {front: 'Best pivot for an equilibrium torque equation', back: 'A point where an unknown force acts, so it drops out.', topic: Static equilibrium}
- {front: 'When does an object tip over?', back: 'When its center of gravity moves beyond the edge of its base.', topic: Static equilibrium}
- {front: 'Newton''s law of gravitation', back: '$F = \dfrac{Gm_1m_2}{r^2}$, $G = 6.67\times10^{-11}$ N·m²/kg²', topic: Gravitation}
- {front: 'Surface gravity of a planet', back: '$g = \dfrac{GM}{R^2}$', topic: Gravitation}
- {front: 'Circular orbit speed and period', back: '$v = \sqrt{GM/r}$; $T^2 = \dfrac{4\pi^2}{GM}r^3$', topic: Orbits}
- {front: 'Kepler''s three laws', back: 'Elliptical orbits (Sun at a focus); equal areas in equal times; $T^2 \propto a^3$.', topic: Orbits}
- {front: 'Escape speed', back: '$v_{\text{esc}} = \sqrt{2GM/R}$ = $\sqrt2$ × low-orbit speed; 11.2 km/s for Earth.', topic: Orbits}
- {front: 'Energy of a circular orbit', back: '$E = -\dfrac{GMm}{2r}$ ($K = -E$, $U = 2E$)', topic: Orbits}
- {front: 'Period of a mass on a spring', back: '$T = 2\pi\sqrt{m/k}$; $\omega = \sqrt{k/m}$', topic: Simple harmonic motion}
- {front: 'Period of a simple pendulum (small angles)', back: '$T = 2\pi\sqrt{L/g}$, independent of mass and amplitude.', topic: Pendulums}
- {front: 'SHM position, max speed, max acceleration', back: '$x = A\cos(\omega t + \phi)$; $v_{\max} = A\omega$; $a_{\max} = A\omega^2$', topic: Simple harmonic motion}
- {front: 'Energy in SHM', back: '$E = \tfrac12kA^2 = \tfrac12mv^2 + \tfrac12kx^2$; $v = \omega\sqrt{A^2 - x^2}$', topic: Simple harmonic motion}
- {front: 'Does SHM period depend on amplitude?', back: 'No (for ideal springs and small-angle pendulums).', topic: Simple harmonic motion}
- {front: 'SHM differential equation', back: '$\ddot x = -\omega^2x$; whatever multiplies $-x$ is $\omega^2$.', topic: Simple harmonic motion}
- {front: 'Resonance', back: 'Driving an oscillator at its natural frequency produces a large amplitude.', topic: Simple harmonic motion}
- {front: 'Wave speed equation', back: '$v = f\lambda = \lambda/T$', topic: Wave properties}
- {front: 'What changes when a wave enters a new medium?', back: 'Speed and wavelength change; frequency stays the same.', topic: Wave properties}
- {front: 'Wave speed on a string', back: '$v = \sqrt{F_T/\mu}$, $\mu$ = mass per length', topic: Wave properties}
- {front: 'Transverse vs longitudinal', back: 'Transverse: medium moves ⊥ to travel (string). Longitudinal: medium moves ∥ (sound).', topic: Wave properties}
- {front: 'Constructive vs destructive interference (path difference)', back: 'Constructive: $\Delta r = m\lambda$. Destructive: $\Delta r = (m + \tfrac12)\lambda$.', topic: Wave properties}
- {front: 'Standing waves on a string fixed at both ends', back: '$\lambda_n = 2L/n$, $f_n = nv/(2L)$, $n = 1, 2, 3, \ldots$', topic: Standing waves}
- {front: 'Sinusoidal traveling wave', back: '$y = A\sin(kx - \omega t)$, $k = 2\pi/\lambda$, $\omega = 2\pi f$, $v = \omega/k$', topic: Wave properties}
- {front: 'Speed of sound in air at 20°C', back: 'About 343 m/s; $v \approx 331 + 0.6\,T_C$ m/s.', topic: Sound}
- {front: 'Sound intensity level', back: '$\beta = 10\log_{10}(I/I_0)$, $I_0 = 10^{-12}$ W/m²', topic: Sound}
- {front: 'Decibel rules of thumb', back: '×10 intensity: +10 dB. ×2 intensity: +3 dB. ×10 distance (point source): −20 dB.', topic: Sound}
- {front: 'Pipe open at both ends', back: '$f_n = nv/(2L)$, all harmonics', topic: Sound}
- {front: 'Pipe closed at one end', back: '$f_n = nv/(4L)$, odd harmonics only', topic: Sound}
- {front: 'Beat frequency', back: '$f_{\text{beat}} = |f_1 - f_2|$', topic: Sound}
- {front: 'Doppler formula', back: '$f'' = f\dfrac{v \pm v_o}{v \mp v_s}$; upper signs for motion toward.', topic: Doppler effect}
- {front: 'Pressure at depth', back: '$P = P_0 + \rho gh$ (depends only on depth)', topic: Pressure}
- {front: 'Gauge vs absolute pressure', back: 'Gauge = absolute − atmospheric; 1 atm = $1.013\times10^5$ Pa.', topic: Pressure}
- {front: 'Hydraulic lift (Pascal)', back: '$F_1/A_1 = F_2/A_2$; volumes moved are equal, so $A_1d_1 = A_2d_2$.', topic: Pressure}
- {front: 'Archimedes'' principle', back: '$F_B = \rho_{\text{fluid}}V_{\text{disp}}g$ (weight of displaced fluid).', topic: Buoyancy}
- {front: 'Fraction submerged when floating', back: '$V_{\text{sub}}/V = \rho_{\text{obj}}/\rho_{\text{fluid}}$', topic: Buoyancy}
- {front: 'Continuity equation', back: '$A_1v_1 = A_2v_2$; $Q = Av$', topic: Fluid dynamics}
- {front: 'Bernoulli''s equation', back: '$P + \tfrac12\rho v^2 + \rho gy$ = constant along a streamline', topic: Fluid dynamics}
- {front: 'Torricelli''s theorem', back: '$v = \sqrt{2gh}$ for a hole at depth $h$', topic: Fluid dynamics}
- {front: 'Temperature conversions', back: '$T(\text{K}) = T_C + 273.15$; $T_F = \tfrac95T_C + 32$', topic: Temperature and expansion}
- {front: 'Linear thermal expansion', back: '$\Delta L = \alpha L\Delta T$; volume: $\Delta V = \beta V\Delta T$, $\beta \approx 3\alpha$', topic: Temperature and expansion}
- {front: 'Heat for a temperature change', back: '$Q = mc\Delta T$', topic: Heat and calorimetry}
- {front: 'Heat for a phase change', back: '$Q = mL$; water: $L_f = 3.34\times10^5$ J/kg, $L_v = 2.26\times10^6$ J/kg', topic: Heat and calorimetry}
- {front: 'Calorimetry equation', back: '$\sum m c(T_f - T_i) = 0$ (add $\pm mL$ for phase changes)', topic: Heat and calorimetry}
- {front: 'Conduction rate', back: '$Q/t = kA\Delta T/L$', topic: Heat and calorimetry}
- {front: 'Ideal gas law', back: '$PV = nRT = Nk_BT$; $R = 8.314$ J/(mol·K)', topic: Ideal gas law}
- {front: 'Combined gas law', back: '$\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$ (absolute $P$, $T$ in K)', topic: Ideal gas law}
- {front: 'Average translational KE of a gas molecule', back: '$\tfrac12m\overline{v^2} = \tfrac32k_BT$', topic: Kinetic theory}
- {front: 'rms speed', back: '$v_{\text{rms}} = \sqrt{3RT/M}$ ($M$ in kg/mol)', topic: Kinetic theory}
- {front: 'Internal energy of a monatomic ideal gas', back: '$E_{\text{int}} = \tfrac32nRT$', topic: Kinetic theory}
- {front: 'First law of thermodynamics', back: '$\Delta E_{\text{int}} = Q - W$ ($Q$ in, $W$ by the gas)', topic: First law of thermodynamics}
- {front: 'Work done by a gas', back: '$W = \int P\,dV$ = area under the PV curve; $P\Delta V$ at constant pressure.', topic: First law of thermodynamics}
- {front: 'Isothermal work (ideal gas)', back: '$W = nRT\ln(V_f/V_i)$, and $Q = W$', topic: First law of thermodynamics}
- {front: 'Adiabatic ideal gas', back: '$Q = 0$; $PV^\gamma$ = const; $TV^{\gamma-1}$ = const; $\gamma = 5/3$ monatomic', topic: First law of thermodynamics}
- {front: 'Monatomic ideal gas molar specific heats', back: '$C_V = \tfrac32R$, $C_P = \tfrac52R$, $C_P - C_V = R$', topic: First law of thermodynamics}
- {front: 'Heat engine efficiency', back: '$e = W/Q_H = 1 - Q_C/Q_H$', topic: Heat engines}
- {front: 'Carnot efficiency', back: '$e_C = 1 - T_C/T_H$ (kelvins); no engine between the same two reservoirs can do better.', topic: Heat engines}
- {front: 'Refrigerator COP', back: '$K = Q_C/W$; Carnot limit $T_C/(T_H - T_C)$', topic: Heat engines}
- {front: 'Entropy change at constant temperature', back: '$\Delta S = Q/T$', topic: Entropy}
- {front: 'Entropy change heating from $T_1$ to $T_2$', back: '$\Delta S = mc\ln(T_2/T_1)$', topic: Entropy}
- {front: 'Second law in entropy form', back: 'The total entropy of an isolated system never decreases.', topic: Entropy}
