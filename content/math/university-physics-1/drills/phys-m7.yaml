- id: phys-pressure-depth
  title: Pressure at depth
  topic: Pressure
  vars:
    h: {min: 1, max: 200}
    fluid: {choices: [{label: 'fresh water (1000 kg/m³)', value: 1000}, {label: 'seawater (1025 kg/m³)', value: 1025}]}
  calc:
    Pg: fluid*9.8*h
    Pabs: 1.013e5 + Pg
    atm: Pabs/1.013e5
  prompt: 'Find the gauge pressure and the absolute pressure {h} m below the surface of {fluid}. Use $g = 9.8$ m/s² and $P_{\text{atm}} = 1.013\times10^5$ Pa.'
  answers:
    - {name: Pg, label: 'Gauge', format: sci, relTolerance: 0.01, units: {Pa: 1, kPa: 1000, atm: 101300}}
    - {name: Pabs, label: 'Absolute', format: sci, relTolerance: 0.01, units: {Pa: 1, kPa: 1000, atm: 101300}}
  solution: |-
    Gauge: $\rho gh = ({fluid:dp0})(9.8)({h}) = {Pg:texsci}$ Pa.

    Absolute: $P_{\text{atm}} + \rho gh = {Pabs:texsci}$ Pa, about **{atm:num2} atm**.
- id: phys-buoyancy
  title: Apparent weight and floating fraction
  topic: Buoyancy
  vars:
    rho: {min: 200, max: 9000, step: 50}
    Vc: {min: 100, max: 5000, step: 50}
  where: ['rho != 1000', 'abs((rho - 1000)*Vc*1e-6*9.8 + 15.54) > 0.5']
  calc:
    V: Vc*1e-6
    W: rho*V*9.8
    FB: 1000*V*9.8
    app: W - FB
  prompt: 'An object of density {rho:dp0} kg/m³ and volume {Vc:dp0} cm³ is held completely under water (density 1000 kg/m³). Using $g = 9.8$ m/s², find the buoyant force and its apparent weight (weight minus buoyant force; a negative value means it would float up if released).'
  answers:
    - {format: sig4, name: FB, label: 'Buoyant force', relTolerance: 0.01, units: {N: 1}}
    - {format: sig4, name: app, label: 'Apparent weight', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    $V = {Vc:dp0}\text{ cm}^3 = {V:texsci}$ m³. $F_B = \rho_{\text{water}}Vg = 1000({V:texsci})(9.8) =$ **{FB:num2} N**.

    Weight $= \rho Vg = {W:num2}$ N, so weight minus buoyancy $=$ **{app:num2} N**. A positive value is the force you must hold it up with; a negative value means it is less dense than water and you must push it down.
- id: phys-hydraulic
  title: Hydraulic lift
  topic: Pressure
  vars:
    d1: {min: 1, max: 5, step: 0.5}
    d2: {min: 15, max: 60, step: 5}
    m: {min: 500, max: 3000, step: 100}
    h: {min: 0.05, max: 0.5, step: 0.05}
  calc:
    ratio: (d2/d1)^2
    F1: m*9.8/ratio
    s1: h*ratio
  prompt: 'A hydraulic lift has pistons of diameter {d1} cm and {d2} cm. Using $g = 9.8$ m/s², what force on the small piston supports a {m} kg car on the large one, and how far must the small piston move in total to raise the car {h} m?'
  answers:
    - {format: sig4, name: F1, label: 'Force', relTolerance: 0.01, units: {N: 1}}
    - {format: sig4, name: s1, label: 'Distance', relTolerance: 0.01, units: {m: 1}}
  solution: |-
    Area ratio $= (d_2/d_1)^2 = ({d2}/{d1})^2 = {ratio:sig4}$.

    Pascal: $F_1 = \dfrac{mg}{A_2/A_1} = \dfrac{{m:dp0}(9.8)}{{ratio:sig4}} =$ **{F1:num1} N**.

    Equal volumes: $d_1 = {h}({ratio:sig4}) =$ **{s1:num1} m** (many pump strokes).
- id: phys-continuity
  title: Continuity equation
  topic: Fluid dynamics
  vars:
    D1: {min: 2, max: 20}
    D2: {min: 1, max: 15}
    v1: {min: 0.5, max: 5, step: 0.1}
  where: ['D2 < D1']
  calc:
    v2: v1*(D1/D2)^2
    Q: pi*(D1/200)^2*v1*1000
  prompt: 'Water flows at {v1} m/s through a pipe of diameter {D1} cm that narrows to {D2} cm. Find the speed in the narrow section and the flow rate in liters per second.'
  answers:
    - {format: sig4, name: v2, label: 'Speed', relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: Q, label: 'Flow rate', relTolerance: 0.01, units: {'L/s': 1}}
  solution: |-
    $A_1v_1 = A_2v_2$ with $A \propto D^2$: $v_2 = {v1}\left(\dfrac{{D1}}{{D2}}\right)^2 =$ **{v2:num2} m/s**.

    $Q = A_1v_1 = \pi({D1}/200\text{ m})^2({v1}) =$ **{Q:num2} L/s**.
- id: phys-bernoulli
  title: Pressure in a narrowing horizontal pipe
  topic: Fluid dynamics
  vars:
    P1k: {min: 150, max: 500, step: 10}
    v1: {min: 0.5, max: 4, step: 0.5}
    k: {min: 1.5, max: 4, step: 0.5}
  calc:
    v2: v1*k
    P2: P1k*1000 + 0.5*1000*(v1^2 - v2^2)
  where: ['P2 > 30000']
  prompt: 'Water flows through a horizontal pipe. Where the pressure is {P1k} kPa the speed is {v1} m/s. At a narrower section the speed is {v2} m/s. What is the pressure there? (Water density 1000 kg/m³.)'
  answers:
    - {format: sig4, name: P2, label: 'Pressure', relTolerance: 0.005, units: {Pa: 1, kPa: 1000}}
  solution: |-
    Same height, so $P_1 + \tfrac12\rho v_1^2 = P_2 + \tfrac12\rho v_2^2$:

    $P_2 = {P1k}\times10^3 + \tfrac12(1000)({v1}^2 - {v2}^2) =$ **{P2:int} Pa**. Faster flow, lower pressure.
- id: phys-torricelli
  title: Draining tank (Torricelli)
  topic: Fluid dynamics
  vars:
    h: {min: 0.5, max: 30, step: 0.5}
    a: {min: 0.5, max: 10, step: 0.5}
  calc:
    v: sqrt(2*9.8*h)
    Q: a*1e-4*v*1000
  prompt: 'A large open tank has a hole of area {a} cm² located {h} m below the water surface. Using $g = 9.8$ m/s², find the speed of the emerging water and the initial flow rate in L/s.'
  answers:
    - {format: sig4, name: v, label: 'Speed', relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: Q, label: 'Flow rate', relTolerance: 0.01, units: {'L/s': 1}}
  solution: |-
    Torricelli: $v = \sqrt{2gh} = \sqrt{2(9.8)({h})} =$ **{v:num2} m/s**.

    $Q = Av = ({a}\times10^{-4})({v:num2})$ m³/s $=$ **{Q:num2} L/s**.
- id: phys-calorimetry
  title: Final temperature of a mixture
  topic: Heat and calorimetry
  vars:
    metal: {choices: [{label: aluminum, value: 900}, {label: iron, value: 450}, {label: copper, value: 385}, {label: lead, value: 128}]}
    m1: {min: 0.05, max: 1, step: 0.05}
    T1: {min: 60, max: 300, step: 5}
    m2: {min: 0.1, max: 2, step: 0.1}
    T2: {min: 5, max: 30}
  calc:
    Tf: (m1*metal*T1 + m2*4186*T2)/(m1*metal + m2*4186)
  where: ['Tf < 99']
  prompt: 'A {m1} kg block of {metal} ($c = {metal:dp0}$ J/(kg·K)) at {T1}°C is dropped into {m2} kg of water ($c = 4186$ J/(kg·K)) at {T2}°C in an insulated cup. Ignoring the cup, find the final temperature in °C.'
  answers:
    - {format: sig4, name: Tf, label: 'Final temperature', tolerance: 0.2, units: {'°C': 1, C: 1}}
  solution: |-
    $\sum Q = 0$: ${m1}({metal:dp0})(T_f - {T1}) + {m2}(4186)(T_f - {T2}) = 0$.

    $T_f = \dfrac{{m1}({metal:dp0})({T1}) + {m2}(4186)({T2})}{{m1}({metal:dp0}) + {m2}(4186)} =$ **{Tf:num1}°C**.
- id: phys-phase-change
  title: Heat to melt and warm ice
  topic: Heat and calorimetry
  vars:
    m: {min: 0.1, max: 3, step: 0.1}
    Ti: {min: -30, max: -2}
    Tf: {min: 5, max: 95, step: 5}
  calc:
    Q1: m*2100*(-Ti)
    Q2: m*3.34e5
    Q3: m*4186*Tf
    Q: Q1 + Q2 + Q3
  prompt: 'How much heat is needed to turn {m} kg of ice at {Ti}°C into water at {Tf}°C? Use $c_{\text{ice}} = 2100$ J/(kg·K), $L_f = 3.34\times10^5$ J/kg and $c_{\text{water}} = 4186$ J/(kg·K).'
  answers:
    - {name: Q, label: 'Heat', format: sci, relTolerance: 0.01, units: {J: 1, kJ: 1000, MJ: 1000000}}
  solution: |-
    Warm the ice to 0°C: ${m}(2100)(0 - ({Ti})) = {Q1:dp0}$ J.

    Melt it: ${m}(3.34\times10^5) = {Q2:dp0}$ J.

    Warm the water: ${m}(4186)({Tf}) = {Q3:dp0}$ J.

    Total: $Q = \mathbf{{Q:texsci}}$ J.
- id: phys-expansion
  title: Thermal expansion
  topic: Temperature and expansion
  vars:
    mat: {choices: [{label: 'steel (12 × 10⁻⁶ K⁻¹)', value: 12}, {label: 'aluminum (23 × 10⁻⁶ K⁻¹)', value: 23}, {label: 'copper (17 × 10⁻⁶ K⁻¹)', value: 17}]}
    L: {min: 1, max: 500}
    T1: {min: -30, max: 10}
    T2: {min: 20, max: 60}
  calc:
    dL: mat*1e-6*L*(T2 - T1)*1000
  prompt: 'A {L} m long piece of {mat} warms from {T1}°C to {T2}°C. By how many millimeters does it lengthen?'
  answers:
    - {format: sig4, name: dL, label: 'Change in length', relTolerance: 0.01, units: {mm: 1, cm: 10, m: 1000}}
  solution: |-
    $\Delta L = \alpha L\Delta T = ({mat}\times10^{-6})({L})({T2} - ({T1})) =$ **{dL:num2} mm**. (A Celsius difference equals a kelvin difference.)
- id: phys-conduction
  title: Heat conduction through a wall
  topic: Heat and calorimetry
  vars:
    k: {choices: [{label: 'glass (k = 0.80 W/(m·K))', value: 0.8}, {label: 'brick (k = 0.70 W/(m·K))', value: 0.7}, {label: 'fiberglass (k = 0.040 W/(m·K))', value: 0.04}]}
    A: {min: 1, max: 20}
    Lcm: {min: 0.5, max: 20, step: 0.5}
    dT: {min: 5, max: 40}
  calc:
    P: k*A*dT/(Lcm/100)
    E: P*3600/1000
  prompt: 'A {A} m² panel of {k} is {Lcm} cm thick. The temperature difference across it is {dT} K. Find the rate of heat conduction (W) and the heat lost in one hour (kJ).'
  answers:
    - {format: sig4, name: P, label: 'Rate', relTolerance: 0.01, units: {W: 1, kW: 1000}}
    - {format: sig4, name: E, label: 'Heat in 1 h', relTolerance: 0.01, units: {kJ: 1, J: 0.001, MJ: 1000}}
  solution: |-
    $\dfrac{Q}{t} = \dfrac{kA\Delta T}{L} = \dfrac{({k:num2})({A})({dT})}{{Lcm}/100} =$ **{P:num1} W**.

    In 3600 s: **{E:num1} kJ**.
- id: phys-ideal-gas
  title: Ideal gas law
  topic: Ideal gas law
  vars:
    n: {min: 0.2, max: 10, step: 0.1}
    TC: {min: -50, max: 300, step: 5}
    VL: {min: 1, max: 200}
  calc:
    T: TC + 273.15
    P: n*8.314*T/(VL/1000)
  prompt: '{n} mol of an ideal gas at {TC}°C occupies {VL} L. What is its pressure? ($R = 8.314$ J/(mol·K))'
  answers:
    - {name: P, label: 'Pressure', format: sci, relTolerance: 0.01, units: {Pa: 1, kPa: 1000, atm: 101300}}
  solution: |-
    Convert: $T = {TC} + 273.15 = {T:num2}$ K, $V = {VL}\times10^{-3}$ m³.

    $P = \dfrac{nRT}{V} = \dfrac{({n})(8.314)({T:num2})}{{VL}\times10^{-3}} = \mathbf{{P:texsci}}$ Pa.
- id: phys-combined-gas
  title: Combined gas law
  topic: Ideal gas law
  vars:
    V1: {min: 1, max: 20, step: 0.5}
    P1: {min: 0.5, max: 5, step: 0.1}
    T1: {min: 250, max: 400, step: 5}
    P2: {min: 0.5, max: 5, step: 0.1}
    T2: {min: 250, max: 600, step: 5}
  calc:
    V2: V1*(P1/P2)*(T2/T1)
  prompt: 'A gas occupies {V1} L at {P1} atm and {T1} K. What volume does it occupy at {P2} atm and {T2} K?'
  answers:
    - {format: sig4, name: V2, label: 'Volume', relTolerance: 0.01, units: {L: 1, mL: 0.001}}
  solution: |-
    $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$, so $V_2 = V_1\cdot\dfrac{P_1}{P_2}\cdot\dfrac{T_2}{T_1} = {V1}\cdot\dfrac{{P1}}{{P2}}\cdot\dfrac{{T2}}{{T1}} =$ **{V2:num2} L**.
- id: phys-vrms
  title: RMS speed and average kinetic energy
  topic: Kinetic theory
  vars:
    gas: {choices: [{label: 'helium (M = 4.00 g/mol)', value: 0.004}, {label: 'nitrogen (M = 28.0 g/mol)', value: 0.028}, {label: 'oxygen (M = 32.0 g/mol)', value: 0.032}, {label: 'carbon dioxide (M = 44.0 g/mol)', value: 0.044}, {label: 'hydrogen (M = 2.02 g/mol)', value: 0.00202}]}
    T: {min: 100, max: 1000, step: 10}
  calc:
    v: sqrt(3*8.314*T/gas)
    K: 1.5*1.38e-23*T
  prompt: 'Find the rms speed of {gas} molecules at {T} K and their average translational kinetic energy. ($R = 8.314$ J/(mol·K), $k_B = 1.38\times10^{-23}$ J/K)'
  answers:
    - {format: sig4, name: v, label: '$v_{\text{rms}}$', relTolerance: 0.01, units: {'m/s': 1}}
    - {name: K, label: 'Average KE', format: sci, relTolerance: 0.01, units: {J: 1}}
  solution: |-
    $v_{\text{rms}} = \sqrt{\dfrac{3RT}{M}} = \sqrt{\dfrac{3(8.314)({T:dp0})}{{gas:sig3}}} =$ **{v:int} m/s** ($M$ in kg/mol).

    $\overline K = \tfrac32k_BT = \mathbf{{K:texsci}}$ J (the same for every gas at this temperature).
- id: phys-first-law
  title: First law of thermodynamics
  topic: First law of thermodynamics
  vars:
    Q: {min: -900, max: 900, step: 10}
    W: {min: -900, max: 900, step: 10}
  where: ['Q != 0', 'W != 0', 'Q != W', 'abs(Q - W + 15.54) > 1']
  calc:
    dU: Q - W
  prompt: 'During a process a gas absorbs {Q} J of heat (negative means it releases heat) and does {W} J of work on its surroundings (negative means work is done on it). Find the change in its internal energy.'
  answers:
    - {format: sig4, name: dU, label: '$\Delta E_{\text{int}} =$', tolerance: 0.5, units: {J: 1}}
  solution: |-
    $\Delta E_{\text{int}} = Q - W = ({Q}) - ({W}) =$ **{dU} J**, with $Q$ into the gas and $W$ done by the gas.
- id: phys-isobaric-work
  title: Constant-pressure process for a monatomic gas
  topic: First law of thermodynamics
  vars:
    n: {min: 0.5, max: 5, step: 0.5}
    dT: {min: 10, max: 200, step: 10}
  calc:
    W: n*8.314*dT
    dU: 1.5*n*8.314*dT
    Q: 2.5*n*8.314*dT
  prompt: '{n} mol of a monatomic ideal gas is heated at constant pressure, raising its temperature by {dT} K. Find the work done by the gas, the change in internal energy, and the heat added. ($R = 8.314$ J/(mol·K))'
  answers:
    - {format: sig4, name: W, label: '$W$', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
    - {format: sig4, name: dU, label: '$\Delta E_{\text{int}}$', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
    - {format: sig4, name: Q, label: '$Q$', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
  solution: |-
    $W = P\Delta V = nR\Delta T = ({n})(8.314)({dT}) =$ **{W:num1} J**.

    $\Delta E_{\text{int}} = \tfrac32nR\Delta T =$ **{dU:num1} J**.

    $Q = \Delta E_{\text{int}} + W = \tfrac52nR\Delta T =$ **{Q:num1} J**.
- id: phys-isothermal-work
  title: Isothermal expansion
  topic: First law of thermodynamics
  vars:
    n: {min: 0.2, max: 5, step: 0.1}
    T: {min: 200, max: 800, step: 10}
    r: {min: 1.5, max: 6, step: 0.5}
  calc:
    W: n*8.314*T*ln(r)
  prompt: '{n} mol of an ideal gas expands isothermally at {T} K until its volume is {r} times larger. How much work does it do, and how much heat does it absorb? ($R = 8.314$ J/(mol·K))'
  answers:
    - {format: sig4, name: W, label: 'Work', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
    - {format: sig4, name: W, label: 'Heat', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
  solution: |-
    $W = \displaystyle\int P\,dV = nRT\ln\frac{V_f}{V_i} = ({n})(8.314)({T})\ln {r} =$ **{W:num1} J**.

    Isothermal: $\Delta E_{\text{int}} = 0$, so $Q = W =$ **{W:num1} J**.
- id: phys-carnot
  title: Carnot efficiency and heat rejected
  topic: Heat engines
  vars:
    TH: {min: 200, max: 900, step: 10}
    TC: {min: 0, max: 100, step: 5}
    QH: {min: 500, max: 5000, step: 100}
  calc:
    e: 1 - (TC + 273)/(TH + 273)
    W: e*QH
    QC: QH - W
  prompt: 'An ideal (Carnot) engine runs between a hot reservoir at {TH}°C and a cold one at {TC}°C. Find its efficiency (as a decimal) and, if it absorbs {QH} J per cycle, the work output and the heat rejected per cycle. (Use $T = T_C + 273$.)'
  answers:
    - {format: sig4, name: e, label: 'Efficiency', relTolerance: 0.01}
    - {format: sig4, name: W, label: 'Work', relTolerance: 0.01, units: {J: 1}}
    - {format: sig4, name: QC, label: 'Heat rejected', relTolerance: 0.01, units: {J: 1}}
  solution: |-
    In kelvins, $T_H = {TH} + 273$ and $T_C = {TC} + 273$. $e = 1 - \dfrac{T_C}{T_H} =$ **{e:num4}**.

    $W = eQ_H =$ **{W:num1} J**; $Q_C = Q_H - W =$ **{QC:num1} J**.
- id: phys-engine-efficiency
  title: Real engine vs Carnot limit
  topic: Heat engines
  vars:
    W: {min: 100, max: 2000, step: 50}
    QC: {min: 200, max: 5000, step: 50}
  calc:
    QH: W + QC
    e: W/QH
  prompt: 'An engine does {W} J of work per cycle and exhausts {QC} J of heat. How much heat does it absorb per cycle, and what is its efficiency (as a decimal)?'
  answers:
    - {format: sig4, name: QH, label: 'Heat absorbed', tolerance: 0.5, units: {J: 1}}
    - {format: sig4, name: e, label: 'Efficiency', relTolerance: 0.01}
  solution: |-
    First law over a cycle: $Q_H = W + Q_C = {W:dp0} + {QC:dp0} =$ **{QH:dp0} J**.

    $e = W/Q_H =$ **{e:num4}**.
- id: phys-entropy-melt
  title: Entropy change of melting and of heating
  topic: Entropy
  vars:
    m: {min: 0.1, max: 5, step: 0.1}
    T2: {min: 10, max: 90, step: 5}
  calc:
    S1: m*3.34e5/273.15
    S2: m*4186*ln((T2 + 273.15)/273.15)
  prompt: '{m} kg of ice at 0°C melts, and the water is then warmed to {T2}°C. Find the entropy change for (a) the melting and (b) the warming. ($L_f = 3.34\times10^5$ J/kg, $c = 4186$ J/(kg·K), 0°C = 273.15 K)'
  answers:
    - {format: sig4, name: S1, label: '(a) Melting', relTolerance: 0.01, units: {'J/K': 1}}
    - {format: sig4, name: S2, label: '(b) Warming', relTolerance: 0.01, units: {'J/K': 1}}
  solution: |-
    (a) Constant temperature: $\Delta S = \dfrac{mL_f}{T} = \dfrac{{m}(3.34\times10^5)}{273.15} =$ **{S1:num1} J/K**.

    (b) $\Delta S = \displaystyle\int\frac{mc\,dT}{T} = mc\ln\frac{T_2}{T_1} = {m}(4186)\ln\frac{{T2} + 273.15}{273.15} =$ **{S2:num1} J/K**.
