# Round 2 drills for the phys-m5 honors lessons.
- id: phys-m5-r2-skid-to-roll
  title: From skidding to rolling
  topic: Rolling with slipping
  vars:
    v0: {min: 2, max: 10, step: 0.5}
    mu: {min: 0.05, max: 0.4, step: 0.05}
    shape: {choices: [{label: 'uniform solid sphere', value: 0.4}, {label: 'uniform solid cylinder', value: 0.5}, {label: 'thin spherical shell', value: 0.6666667}, {label: 'thin hoop', value: 1}]}
  calc:
    ts: shape*v0/((1 + shape)*mu*9.8)
    vf: v0/(1 + shape)
    dist: v0*ts - 0.5*mu*9.8*ts^2
  prompt: 'A {shape} is launched along a level floor at {v0} m/s with no spin. The coefficient of kinetic friction is {mu}. Using $g = 9.8$ m/s², find how long it slides (s), its speed when it starts rolling without slipping (m/s), and how far it slides (m), each to 3 significant figures.'
  answers:
    - {format: sig4, name: ts, label: 'Time sliding', relTolerance: 0.01, units: {s: 1}}
    - {format: sig4, name: vf, label: 'Rolling speed', relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: dist, label: 'Distance', relTolerance: 0.01, units: {m: 1, cm: 0.01}}
  solution: |-
    For a {shape}, $I = cMR^2$ with $c = {shape:num4}$. Friction $\mu_kMg$ slows the center, $v = v_0 - \mu_kgt$, and spins the object up, $R\omega = \mu_kgt/c$.

    They match when $t^* = \dfrac{c\,v_0}{(1 + c)\mu_kg} = \dfrac{{shape:num4}({v0})}{(1 + {shape:num4})({mu})(9.8)} =$ **{ts:sig3} s**.

    Rolling speed (also from angular momentum about a floor point): $v_f = \dfrac{v_0}{1 + c} =$ **{vf:sig3} m/s**.

    Distance: $d = v_0t^* - \tfrac12\mu_kg(t^*)^2 =$ **{dist:sig3} m**.
- id: phys-m5-r2-sweet-spot
  title: Center of percussion of a rod
  topic: Rolling with slipping
  vars:
    L: {min: 0.5, max: 2, step: 0.1}
    pct: {min: 0, max: 30, step: 10}
  calc:
    p: L*pct/100
    d: L/2 - p
    b: d + L^2/(12*d)
    fromend: p + b
  prompt: 'A uniform rod {L} m long is held at a pivot {p:num2} m from its top end and hangs straight down. A ball strikes it horizontally. Find the distance from the pivot to the rod''s center of mass, and the distance from the pivot to its center of percussion (where a blow gives no jolt at the pivot), in meters to 3 significant figures.'
  answers:
    - {format: sig4, name: d, label: 'Pivot to center of mass', relTolerance: 0.01, units: {m: 1, cm: 0.01}}
    - {format: sig4, name: b, label: 'Pivot to center of percussion', relTolerance: 0.01, units: {m: 1, cm: 0.01}}
  solution: |-
    Center of mass: $d = \tfrac L2 - {p:num2} =$ **{d:sig3} m** below the pivot.

    Parallel-axis theorem: $I_P = \tfrac1{12}ML^2 + Md^2$. With no impulse at the pivot, $b = \dfrac{I_P}{Md} = d + \dfrac{L^2}{12d} = {d:sig4} + \dfrac{({L})^2}{12({d:sig4})} =$ **{b:sig3} m** below the pivot ({fromend:sig3} m from the top end).
- id: phys-m5-r2-precession
  title: Gyroscope precession
  topic: Gyroscopes
  vars:
    M: {min: 0.1, max: 2, step: 0.05}
    R: {min: 0.03, max: 0.2, step: 0.01}
    rpm: {min: 600, max: 6000, step: 100}
    r: {min: 0.03, max: 0.25, step: 0.01}
  calc:
    I: 0.5*M*R^2
    w: rpm*2*pi/60
    L: I*w
    tau: M*9.8*r
    Om: tau/L
    Tp: 2*pi/Om
  where: ['Om < w/20']
  prompt: 'A gyroscope''s rotor is a uniform {M} kg disk of radius {R} m spinning at {rpm} rpm. Its center is {r} m from the pivot and its axle is horizontal. Using $g = 9.8$ m/s², find its spin angular momentum (kg·m²/s), the torque of gravity about the pivot (N·m), and the precession rate (rad/s), each to 3 significant figures.'
  answers:
    - {format: sig4, name: L, label: '$L =$', relTolerance: 0.01, units: {'kg·m²/s': 1, 'kg*m^2/s': 1, 'kg m^2/s': 1}}
    - {format: sig4, name: tau, label: 'Torque', relTolerance: 0.01, units: {'N·m': 1, 'N*m': 1, 'Nm': 1, 'N m': 1}}
    - {format: sig4, name: Om, label: 'Precession rate', relTolerance: 0.01, units: {'rad/s': 1}}
  solution: |-
    $I = \tfrac12MR^2 = {I:texsci}$ kg·m² and $\omega = {rpm:dp0}\times\dfrac{2\pi}{60} = {w:num2}$ rad/s, so $L = I\omega =$ **{L:sig3} kg·m²/s**.

    $\tau = Mgr = {M}(9.8)({r}) =$ **{tau:sig3} N·m**.

    $\Omega = \dfrac{\tau}{\,L} =$ **{Om:sig3} rad/s**, one precession every {Tp:sig3} s. (The spin is much faster than the precession, so the gyroscopic approximation holds.)
- id: phys-m5-r2-imbalance
  title: Bearing torque from a crooked rotor
  topic: Gyroscopes
  vars:
    m: {min: 0.05, max: 0.5, step: 0.05}
    a: {min: 0.05, max: 0.3, step: 0.01}
    tilt: {min: 2, max: 20}
    w: {min: 10, max: 100, step: 5}
    sep: {min: 0.1, max: 0.5, step: 0.05}
  calc:
    beta: 90 - tilt
    Lp: 2*m*a^2*w*sind(beta)*cosd(beta)
    tau: w*Lp
    F: tau/sep
  prompt: 'Two small {m} kg masses sit at the ends of a light rod, each {a} m from its center. The rod is fixed through its center to a shaft but is {tilt}° off perpendicular (so it makes $\beta = {beta}^\circ$ with the shaft). The shaft turns at {w} rad/s in bearings {sep} m apart. Find the sideways component of the angular momentum (kg·m²/s), the torque the bearings must supply (N·m), and the force on each bearing (N), each to 3 significant figures.'
  answers:
    - {format: sig4, name: Lp, label: '$L_\perp =$', relTolerance: 0.01, units: {'kg·m²/s': 1, 'kg*m^2/s': 1, 'kg m^2/s': 1}}
    - {format: sig4, name: tau, label: 'Torque', relTolerance: 0.01, units: {'N·m': 1, 'N*m': 1, 'Nm': 1, 'N m': 1}}
    - {format: sig4, name: F, label: 'Force on each bearing', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    Each mass has angular momentum $ma(\omega a\sin\beta)$ perpendicular to the rod; the sideways part of the total is $L_\perp = 2ma^2\omega\sin\beta\cos\beta = 2({m})({a})^2({w})\sin {beta}^\circ\cos {beta}^\circ =$ **{Lp:sig3} kg·m²/s**.

    It turns with the shaft, so $\tau = \omega L_\perp =$ **{tau:sig3} N·m**.

    The bearings supply it as a couple: $F = \tau/{sep} =$ **{F:sig3} N** each, in opposite directions.
- id: phys-m5-r2-inside-planet
  title: Gravity inside a uniform planet
  topic: Tides and the shell theorem
  vars:
    Mm: {min: 1.0, max: 9.9, step: 0.1}
    Me: {min: 22, max: 25}
    Rm: {min: 1.0, max: 9.9, step: 0.1}
    pct: {min: 10, max: 90, step: 10}
  calc:
    M: Mm*10^Me
    R: Rm*10^6
    gs: 6.67e-11*M/R^2
    gin: gs*pct/100
    trip: pi*sqrt(R/gs)/60
  where: ['gs > 0.5', 'gs < 30']
  prompt: 'A uniform planet has mass ${Mm}\times10^{{Me}}$ kg and radius ${Rm}\times10^{6}$ m. Using $G = 6.67\times10^{-11}$ N·m²/kg², find the surface gravity (m/s²), the gravitational acceleration {pct}% of the way from the center to the surface (m/s²), and the time (minutes) for an object dropped into a frictionless tunnel through the center to reach the far side, each to 3 significant figures.'
  answers:
    - {format: sig4, name: gs, label: 'Surface $g$', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: gin, label: '$g$ inside', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: trip, label: 'Trip time', relTolerance: 0.01, units: {min: 1, s: 0.0166666667}}
  solution: |-
    $g_s = \dfrac{GM}{R^2} =$ **{gs:sig3} m/s²**.

    Inside a uniform planet only the mass within $r$ counts, so $g = g_s\dfrac{r}{\,R} = {gs:sig4}({pct}/100) =$ **{gin:sig3} m/s²**.

    The tunnel motion is simple harmonic with period $2\pi\sqrt{R/g_s}$; one way is half a period: $\pi\sqrt{R/g_s} =$ **{trip:sig3} min**.
- id: phys-m5-r2-tidal
  title: Direct pull and tidal acceleration
  topic: Tides and the shell theorem
  vars:
    Mm: {min: 1.0, max: 9.9, step: 0.1}
    Me: {min: 21, max: 24}
    Dm: {min: 1.0, max: 9.9, step: 0.1}
  calc:
    M: Mm*10^Me
    D: Dm*10^8
    direct: 6.67e-11*M/D^2
    tidal: 2*6.67e-11*M*6.37e6/D^3
    ratio: tidal/1.10e-6
  prompt: 'A moon of mass ${Mm}\times10^{{Me}}$ kg orbits ${Dm}\times10^{8}$ m from Earth''s center. Using $G = 6.67\times10^{-11}$ N·m²/kg² and $R_E = 6.37\times10^{6}$ m, find the moon''s gravitational acceleration at Earth''s center (m/s²), its tidal acceleration at the point of Earth''s surface nearest it, using $2GMR_E/D^3$ (m/s²), and that tidal acceleration as a multiple of our Moon''s ($1.10\times10^{-6}$ m/s²), each to 3 significant figures (type powers of ten like 3.18e-4).'
  answers:
    - {format: sci, name: direct, label: 'Direct pull', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sci, name: tidal, label: 'Tidal', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: ratio, label: 'Multiple of the Moon''s', relTolerance: 0.01}
  solution: |-
    Direct pull: $\dfrac{GM}{D^2} = \dfrac{(6.67\times10^{-11})({Mm}\times10^{{Me}})}{({Dm}\times10^{8})^2} = \mathbf{{direct:texsci}}$ m/s².

    Tidal: $\dfrac{2GMR_E}{D^3} = \mathbf{{tidal:texsci}}$ m/s², smaller than the direct pull by the factor $2R_E/D$.

    Compared with the Moon: $\dfrac{{tidal:texsci}}{1.10\times10^{-6}} =$ **{ratio:sig3}**.
