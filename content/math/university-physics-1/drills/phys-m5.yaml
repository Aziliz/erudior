- id: phys-rot-kinematics
  title: Spinning down with constant angular acceleration
  topic: Rotational kinematics
  vars:
    rpm: {min: 60, max: 3000, step: 30}
    t: {min: 2, max: 30}
  calc:
    w0: rpm*2*pi/60
    alpha: -w0/t
    th: 0.5*w0*t
    rev: th/(2*pi)
  where: ['abs(alpha + 15.54) > 0.5']
  prompt: 'A wheel spinning at {rpm} rpm slows uniformly to rest in {t} s. Find its angular acceleration (rad/s², with sign) and the number of revolutions it makes while stopping, to 3 significant figures.'
  answers:
    - {format: sig4, name: alpha, label: '$\alpha =$', relTolerance: 0.01, units: {'rad/s²': 1, 'rad/s^2': 1}}
    - {format: sig4, name: rev, label: 'Revolutions', relTolerance: 0.01, units: {rev: 1}}
  solution: |-
    $\omega_0 = {rpm:dp0}\times\dfrac{2\pi}{60} = {w0:num2}$ rad/s.

    $\alpha = \dfrac{0 - \omega_0}{\,t} =$ **{alpha:sig3} rad/s²**.

    $\Delta\theta = \tfrac12(\omega_0 + 0)t = {th:dp1}$ rad $=$ **{rev:sig3} rev**.
- id: phys-moment-inertia
  title: Moment of inertia of masses on a rod
  topic: Moment of inertia
  vars:
    m1: {min: 0.5, max: 5, step: 0.5}
    m2: {min: 0.5, max: 5, step: 0.5}
    M: {min: 0.5, max: 4, step: 0.5}
    L: {min: 0.5, max: 3, step: 0.1}
  calc:
    Ic: M*L^2/12 + (m1 + m2)*(L/2)^2
    Ie: M*L^2/3 + m2*L^2
  prompt: 'A uniform rod of mass {M} kg and length {L} m has a small {m1} kg mass at its left end and a {m2} kg mass at its right end. Find the moment of inertia about (a) a perpendicular axis through the rod''s center and (b) a perpendicular axis through the left end. Give kg·m² to 3 significant figures.'
  answers:
    - {format: sig4, name: Ic, label: '(a) Center', relTolerance: 0.01, units: {'kg·m²': 1, 'kg*m^2': 1, 'kg m^2': 1}}
    - {format: sig4, name: Ie, label: '(b) Left end', relTolerance: 0.01, units: {'kg·m²': 1, 'kg*m^2': 1, 'kg m^2': 1}}
  solution: |-
    (a) Rod: $\tfrac1{12}ML^2$; each end mass is $L/2$ away: $I = \tfrac1{12}({M})({L})^2 + ({m1} + {m2})({L}/2)^2 =$ **{Ic:sig3} kg·m²**.

    (b) Rod about an end: $\tfrac13ML^2$; the left mass is on the axis, the right mass is $L$ away: $I = \tfrac13({M})({L})^2 + {m2}({L})^2 =$ **{Ie:sig3} kg·m²**.
- id: phys-rot-ke
  title: Rotational kinetic energy of a disk
  topic: Moment of inertia
  vars:
    M: {min: 0.5, max: 20, step: 0.5}
    R: {min: 0.05, max: 0.6, step: 0.05}
    rpm: {min: 100, max: 3000, step: 50}
    shape: {choices: [{label: 'solid disk', value: 0.5}, {label: 'thin hoop', value: 1}]}
  calc:
    I: shape*M*R^2
    w: rpm*2*pi/60
    K: 0.5*I*w^2
  prompt: 'A {M} kg {shape} of radius {R} m spins about its central axis at {rpm} rpm. Find its moment of inertia (kg·m²) and its rotational kinetic energy (J), to 3 significant figures.'
  answers:
    - {format: sig4, name: I, label: '$I =$', relTolerance: 0.01, units: {'kg·m²': 1, 'kg*m^2': 1, 'kg m^2': 1}}
    - {format: sig4, name: K, label: 'KE', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
  solution: |-
    For a {shape}, $I = cMR^2$ with $c = {shape:num1}$, so $I =$ **{I:sig3} kg·m²**.

    $\omega = {rpm:dp0}\times\dfrac{2\pi}{60} = {w:num2}$ rad/s, so $K = \tfrac12I\omega^2 =$ **{K:sig3} J**.
- id: phys-torque
  title: Torque from an angled force
  topic: Torque
  vars:
    r: {min: 0.1, max: 1.5, step: 0.05}
    F: {min: 10, max: 300, step: 5}
    th: {min: 15, max: 165, step: 5}
  where: ['th != 90']
  calc:
    tau: r*F*sind(th)
    tmax: r*F
  prompt: 'A force of {F} N is applied at the end of a {r} m wrench, making an angle of {th}° with the handle. Find the torque about the bolt, and the maximum torque that force could produce, in N·m to 3 significant figures.'
  answers:
    - {format: sig4, name: tau, label: 'Torque', relTolerance: 0.01, units: {'N·m': 1, 'N*m': 1, 'Nm': 1, 'N m': 1}}
    - {format: sig4, name: tmax, label: 'Maximum', relTolerance: 0.01, units: {'N·m': 1, 'N*m': 1, 'Nm': 1, 'N m': 1}}
  figure:
    type: shape
    segments:
      - {from: [0, 0], to: [3, 0], label: '{r} m'}
      - {from: [3, 0], to: ['3 + 1.5*cosd(th)', '1.5*sind(th)'], arrow: true, label: '{F} N'}
      - {from: [3, 0], to: [4.5, 0], dashed: true}
    points:
      - {at: [0, 0], label: 'bolt'}
  solution: |-
    $\tau = rF\sin\theta = ({r})({F})\sin {th}^\circ =$ **{tau:sig3} N·m**.

    The maximum occurs for a perpendicular push: $rF =$ **{tmax:sig3} N·m**.
- id: phys-pulley-disk
  title: Mass hanging from a heavy pulley
  topic: Rotational dynamics
  vars:
    m: {min: 0.5, max: 10, step: 0.5}
    M: {min: 0.5, max: 10, step: 0.5}
    R: {min: 0.05, max: 0.5, step: 0.05}
  calc:
    a: m*9.8/(m + 0.5*M)
    T: 0.5*M*a
    alpha: a/R
  prompt: 'A {m} kg block hangs from a light rope wrapped around a {M} kg solid cylinder of radius {R} m that turns freely on a frictionless axle. The block is released. Using $g = 9.8$ m/s², find the block''s acceleration (m/s²), the rope tension (N) and the cylinder''s angular acceleration (rad/s²), to 3 significant figures.'
  answers:
    - {format: sig4, name: a, label: 'Acceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: T, label: 'Tension', relTolerance: 0.01, units: {N: 1}}
    - {format: sig4, name: alpha, label: 'Angular accel.', relTolerance: 0.01, units: {'rad/s²': 1, 'rad/s^2': 1}}
  solution: |-
    Block: $mg - T = ma$. Cylinder: $TR = \tfrac12MR^2\alpha$ with $\alpha = a/R$, so $T = \tfrac12Ma$.

    $a = \dfrac{mg}{m + \tfrac12M} = \dfrac{{m}(9.8)}{{m} + {M}/2} =$ **{a:sig3} m/s²**.

    $T = \tfrac12({M})({a:sig3}) =$ **{T:sig3} N**; $\alpha = a/R =$ **{alpha:sig3} rad/s²**.
- id: phys-rolling-incline
  title: Rolling down a ramp
  topic: Rolling motion
  vars:
    h: {min: 0.5, max: 10, step: 0.5}
    shape: {choices: [{label: 'solid sphere', value: 0.4}, {label: 'solid cylinder', value: 0.5}, {label: 'hollow sphere', value: 0.6666667}, {label: 'thin hoop', value: 1}]}
  calc:
    v: sqrt(2*9.8*h/(1 + shape))
    vs: sqrt(2*9.8*h)
  prompt: 'A {shape} rolls without slipping from rest down a ramp, dropping a height of {h} m. Using $g = 9.8$ m/s², find its speed at the bottom in m/s, to 3 significant figures. (For comparison, a frictionless sliding block would reach {vs:num2} m/s.)'
  answers:
    - {format: sig4, name: v, label: 'Speed', relTolerance: 0.01, units: {'m/s': 1}}
  solution: |-
    With $I = cMR^2$ and $\omega = v/R$: $Mgh = \tfrac12Mv^2 + \tfrac12cMv^2 = \tfrac12(1 + c)Mv^2$, and for a {shape} $c = {shape:num4}$.

    $v = \sqrt{\dfrac{2gh}{1 + c}} = \sqrt{\dfrac{2(9.8)({h})}{1 + {shape:num4}}} =$ **{v:sig3} m/s**.
- id: phys-angmom-skater
  title: Conservation of angular momentum
  topic: Angular momentum
  vars:
    I1: {min: 2, max: 8, step: 0.1}
    f: {min: 0.5, max: 3, step: 0.1}
    pct: {min: 25, max: 70, step: 5}
  calc:
    I2: I1*pct/100
    f2: I1*f/I2
    K1: 0.5*I1*(2*pi*f)^2
    K2: 0.5*I2*(2*pi*f2)^2
  prompt: 'A skater spins at {f} rev/s with moment of inertia {I1} kg·m². She pulls in her arms, reducing her moment of inertia to {pct}% of its original value. Find her new spin rate (rev/s) and her new rotational kinetic energy (J), to 3 significant figures.'
  answers:
    - {format: sig4, name: f2, label: 'Spin rate', relTolerance: 0.01, units: {'rev/s': 1}}
    - {format: sig4, name: K2, label: 'KE', relTolerance: 0.01, units: {J: 1, kJ: 1000}}
  solution: |-
    No external torque: $I_1\omega_1 = I_2\omega_2$, so $f_2 = f_1\dfrac{I_1}{I_2} = \dfrac{{f}}{{pct}/100} =$ **{f2:sig3} rev/s**.

    New $I_2 = {I2:dp3}$ kg·m² and $\omega_2 = 2\pi f_2$; $K_2 = \tfrac12I_2\omega_2^2 =$ **{K2:sig3} J** (up from {K1:num1} J; her muscles did the work).
- id: phys-seesaw
  title: Balancing a seesaw
  topic: Static equilibrium
  vars:
    m1: {min: 15, max: 90}
    m2: {min: 15, max: 90}
    d1: {min: 0.5, max: 2.5, step: 0.1}
  where: ['m1*d1/m2 < 3', 'm1 != m2']
  calc:
    d2: m1*d1/m2
  prompt: 'A uniform seesaw is pivoted at its center. A {m1} kg person sits {d1} m from the pivot. How far from the pivot, on the other side, must a {m2} kg person sit to balance it? Give meters to 3 significant figures.'
  answers:
    - {format: sig4, name: d2, label: 'Distance', relTolerance: 0.01, units: {m: 1, cm: 0.01}}
  solution: |-
    Torques about the pivot must cancel (the seesaw's weight and the pivot force act at the pivot): ${m1}g({d1}) = {m2}g\,x$.

    $x = \dfrac{{m1}({d1})}{{m2}} =$ **{d2:sig3} m**.
- id: phys-beam-supports
  title: Beam on two supports
  topic: Static equilibrium
  vars:
    L: {min: 3, max: 10}
    mb: {min: 10, max: 80, step: 5}
    m: {min: 20, max: 120, step: 5}
    fr: {min: 0.1, max: 0.9, step: 0.05}
  calc:
    x: fr*L
    FB: (mb*9.8*L/2 + m*9.8*x)/L
    FA: (mb + m)*9.8 - FB
  prompt: 'A uniform {L} m beam of mass {mb} kg rests on supports at its ends A and B. A {m} kg crate sits {x:num2} m from end A. Using $g = 9.8$ m/s², find the upward force from each support, in newtons to 3 significant figures.'
  answers:
    - {format: sig4, name: FA, label: 'Support A', relTolerance: 0.01, units: {N: 1}}
    - {format: sig4, name: FB, label: 'Support B', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    Torques about A: $F_B({L}) = {mb}(9.8)({L}/2) + {m}(9.8)({x:num2})$, so $F_B =$ **{FB:sig3} N**.

    Vertical forces: $F_A = ({mb} + {m})(9.8) - F_B =$ **{FA:sig3} N**.
- id: phys-grav-force
  title: Gravitational force and surface gravity
  topic: Gravitation
  vars:
    Mm: {min: 1.0, max: 9.9, step: 0.1}
    Me: {min: 22, max: 26}
    Rm: {min: 1.0, max: 9.9, step: 0.1}
    m: {min: 50, max: 500, step: 10}
  calc:
    M: Mm*10^Me
    R: Rm*10^6
    gs: 6.67e-11*M/R^2
    F: m*gs
  where: ['gs > 0.5', 'gs < 40']
  prompt: 'A planet has mass ${Mm}\times10^{{Me}}$ kg and radius ${Rm}\times10^{6}$ m. Using $G = 6.67\times10^{-11}$ N·m²/kg², find the acceleration due to gravity at its surface (m/s²) and the weight there of a {m} kg probe (N), to 3 significant figures.'
  answers:
    - {format: sig4, name: gs, label: '$g =$', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: F, label: 'Weight', relTolerance: 0.01, units: {N: 1, kN: 1000}}
  solution: |-
    $g = \dfrac{GM}{R^2} = \dfrac{(6.67\times10^{-11})({Mm}\times10^{{Me}})}{({Rm}\times10^{6})^2} =$ **{gs:sig3} m/s²**.

    Weight $= mg = {m}({gs:sig3}) =$ **{F:sig3} N**.
- id: phys-orbit-speed
  title: Circular orbit speed and period
  topic: Orbits
  vars:
    h: {min: 200, max: 36000, step: 100}
  calc:
    r: 6.37e6 + h*1000
    v: sqrt(6.67e-11*5.97e24/r)
    T: 2*pi*r/v/60
  prompt: 'A satellite is in a circular orbit {h} km above Earth''s surface. Using $G = 6.67\times10^{-11}$ N·m²/kg², $M_E = 5.97\times10^{24}$ kg and $R_E = 6.37\times10^{6}$ m, find its orbital speed (m/s) and period (minutes), to 3 significant figures.'
  answers:
    - {format: sig4, name: v, label: 'Speed', relTolerance: 0.01, units: {'m/s': 1, 'km/s': 1000}}
    - {format: sig4, name: T, label: 'Period', relTolerance: 0.01, units: {min: 1, h: 60}}
  solution: |-
    Orbit radius from Earth's center: $r = R_E + h = {r:texsci}$ m.

    $v = \sqrt{\dfrac{GM_E}{\,r}} =$ **{v:sig3} m/s**.

    $T = \dfrac{2\pi r}{\,v} =$ **{T:sig3} min**.
- id: phys-escape-speed
  title: Escape speed
  topic: Orbits
  vars:
    Mm: {min: 1.0, max: 9.9, step: 0.1}
    Me: {min: 22, max: 26}
    Rm: {min: 1.0, max: 9.9, step: 0.1}
  calc:
    M: Mm*10^Me
    R: Rm*10^6
    ve: sqrt(2*6.67e-11*M/R)/1000
    vo: ve/sqrt(2)
  where: ['ve > 0.5', 've < 60']
  prompt: 'Find the escape speed (km/s) from the surface of a planet with mass ${Mm}\times10^{{Me}}$ kg and radius ${Rm}\times10^{6}$ m, and the speed of a circular orbit just above its surface. Use $G = 6.67\times10^{-11}$ N·m²/kg² and give both speeds in km/s to 3 significant figures.'
  answers:
    - {format: sig4, name: ve, label: 'Escape speed', relTolerance: 0.01, units: {'km/s': 1, 'm/s': 0.001}}
    - {format: sig4, name: vo, label: 'Orbit speed', relTolerance: 0.01, units: {'km/s': 1, 'm/s': 0.001}}
  solution: |-
    Total energy zero: $\tfrac12mv^2 = \dfrac{GMm}{\,R}$, so $v_{\text{esc}} = \sqrt{\dfrac{2GM}{\,R}} =$ **{ve:sig3} km/s**.

    Low orbit: $v = \sqrt{GM/R} = v_{\text{esc}}/\sqrt2 =$ **{vo:sig3} km/s**.
