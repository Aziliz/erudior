# Round 2, module phys-m7: drills for the honors lessons (engine cycles; statistical entropy; viscous flow).
- id: phys-m7-r2-otto
  title: Otto cycle efficiency, temperature and work
  topic: Engine cycles
  vars:
    cr: {min: 6, max: 12, step: 0.5}
    T1: {min: 280, max: 320, step: 5}
    T3: {min: 1500, max: 2500, step: 100}
  calc:
    eff: 1 - cr^(-0.4)
    T2: T1*cr^0.4
    QH: 2.5*8.314*(T3 - T2)/1000
    W: eff*QH
  prompt: 'An air-standard Otto cycle ($\gamma = 1.4$, $C_V = \tfrac52R$, $R = 8.314$ J/(mol·K)) has compression ratio {cr}. Air enters at {T1} K and combustion heats it to {T3} K. Find the efficiency (as a decimal), the temperature at the end of compression (K), and the net work per mole of air per cycle (kJ). Give all three to 3 significant figures.'
  answers:
    - {name: eff, label: 'Efficiency', format: sig4, relTolerance: 0.01}
    - {name: T2, label: '$T_2$', format: sig4, relTolerance: 0.01, units: {K: 1}}
    - {name: W, label: 'Work per mole', format: sig4, relTolerance: 0.01, units: {kJ: 1, J: 0.001}}
  solution: |-
    $e = 1 - r^{1-\gamma} = 1 - {cr}^{-0.4} =$ **{eff:sig3}**.

    Adiabatic compression: $T_2 = T_1r^{\gamma-1} = {T1}({cr})^{0.4} =$ **{T2:sig3} K**.

    Heat in at constant volume: $Q_H = C_V(T_3 - T_2) = 20.785({T3} - {T2:sig4}) = {QH:sig4}$ kJ per mole, so $W = eQ_H =$ **{W:sig3} kJ**.
- id: phys-m7-r2-diesel-brayton
  title: Diesel and Brayton efficiencies
  topic: Engine cycles
  vars:
    cr: {min: 14, max: 22}
    rc: {min: 1.5, max: 3, step: 0.1}
    rp: {min: 5, max: 30}
  calc:
    fac: (rc^1.4 - 1)/(1.4*(rc - 1))
    eD: 1 - cr^(-0.4)*fac
    eB: 1 - rp^(-0.4/1.4)
  prompt: 'Using the air-standard model with $\gamma = 1.4$, find (a) the efficiency of a Diesel cycle with compression ratio {cr} and cutoff ratio {rc}, and (b) the efficiency of a Brayton cycle with pressure ratio {rp}. Give both as decimals to 3 significant figures.'
  answers:
    - {name: eD, label: '(a) Diesel', format: sig4, relTolerance: 0.01}
    - {name: eB, label: '(b) Brayton', format: sig4, relTolerance: 0.01}
  solution: |-
    (a) Cutoff factor: $\dfrac{r_c^{\gamma} - 1}{\gamma(r_c - 1)} = \dfrac{{rc}^{1.4} - 1}{1.4({rc} - 1)} = {fac:sig4}$. Then $e = 1 - \dfrac{{fac:sig4}}{{cr}^{0.4}} =$ **{eD:sig3}**.

    (b) $e = 1 - r_p^{-(\gamma - 1)/\gamma} = 1 - {rp}^{-0.2857} =$ **{eB:sig3}**.
- id: phys-m7-r2-free-expansion
  title: Entropy of a free expansion by counting
  topic: Statistical entropy
  vars:
    n: {min: 0.5, max: 5, step: 0.5}
    k: {choices: [2, 3, 4, 5, 10]}
  calc:
    dS: n*8.314*ln(k)
    lg: n*6.022e23*log10(k)
  prompt: '{n} mol of an ideal gas expands freely into a vacuum until its volume is {k} times as large, at constant temperature. Counting microstates, find (a) the entropy change in J/K and (b) $\log_{10}$ of the factor by which the number of microstates grows. Use $R = 8.314$ J/(mol·K) and $N_A = 6.022\times10^{23}$, and give both to 3 significant figures.'
  answers:
    - {name: dS, label: '(a) $\Delta S$', format: sig4, relTolerance: 0.01, units: {'J/K': 1}}
    - {name: lg, label: '(b) $\log_{10}(\Omega_f/\Omega_i)$', format: sci, relTolerance: 0.01}
  solution: |-
    Each of the $N = nN_A$ molecules has {k} times as many places to be, so $\Omega_f/\Omega_i = {k}^N$.

    (a) $\Delta S = k_B\ln {k}^N = nR\ln {k} = {n}(8.314)\ln {k} =$ **{dS:sig3} J/K**.

    (b) $\log_{10}({k}^N) = N\log_{10}{k} = ({n})(6.022\times10^{23})\log_{10}{k} =$ **{lg:texsci}**. The number of microstates grows by a factor of 10 raised to that power, which is why the gas never returns to its original volume on its own.
- id: phys-m7-r2-boltzmann-factor
  title: Scale height of an isothermal atmosphere
  topic: Statistical entropy
  vars:
    gas: {choices: [{label: 'nitrogen (M = 0.028 kg/mol)', value: 0.028}, {label: 'oxygen (M = 0.032 kg/mol)', value: 0.032}, {label: 'helium (M = 0.004 kg/mol)', value: 0.004}, {label: 'argon (M = 0.040 kg/mol)', value: 0.040}, {label: 'carbon dioxide (M = 0.044 kg/mol)', value: 0.044}]}
    T: {min: 200, max: 320, step: 10}
    y: {min: 1, max: 20}
  calc:
    H: 8.314*T/(gas*9.8)/1000
    frac: exp(-y/H)
  prompt: 'Treat {gas} as an ideal gas in a still atmosphere at a uniform {T} K. Using the Boltzmann factor, find its scale height $H = RT/(Mg)$ in km and the fraction of its sea-level number density that remains at a height of {y} km. Use $R = 8.314$ J/(mol·K) and $g = 9.8$ m/s², and give both to 3 significant figures.'
  answers:
    - {name: H, label: 'Scale height', format: sig4, relTolerance: 0.01, units: {km: 1, m: 0.001}}
    - {name: frac, label: 'Fraction remaining', format: sig4, relTolerance: 0.01}
  solution: |-
    $H = \dfrac{RT}{Mg} = \dfrac{8.314({T})}{({gas})(9.8)}$ m $=$ **{H:sig3} km**.

    The density falls as $e^{-mgy/(k_BT)} = e^{-y/H}$: $e^{-{y}/{H:sig4}} =$ **{frac:sig3}**.
- id: phys-m7-r2-poiseuille
  title: Poiseuille flow in a narrow tube
  topic: Viscous flow
  vars:
    fl: {choices: [{label: 'water (η = 1.0 × 10⁻³ Pa·s)', value: 0.001}, {label: 'blood (η = 3.5 × 10⁻³ Pa·s)', value: 0.0035}, {label: 'olive oil (η = 0.080 Pa·s)', value: 0.08}]}
    Rmm: {min: 0.1, max: 1, step: 0.05}
    Lcm: {min: 2, max: 50}
    dPk: {min: 1, max: 50}
  calc:
    Rm: Rmm/1000
    Q: pi*Rm^4*dPk*1000/(8*fl*Lcm/100)*1e6
    vav: Q*1e-6/(pi*Rm^2)
  prompt: '{fl} flows smoothly (laminar flow) through a tube of inner radius {Rmm} mm and length {Lcm} cm, driven by a pressure difference of {dPk} kPa. Find the volume flow rate in mL/s and the average flow speed in m/s, to 3 significant figures.'
  answers:
    - {name: Q, label: 'Flow rate', format: sig4, relTolerance: 0.01, units: {'mL/s': 1, 'L/s': 1000}}
    - {name: vav, label: 'Average speed', format: sig4, relTolerance: 0.01, units: {'m/s': 1, 'cm/s': 0.01}}
  solution: |-
    Poiseuille: $Q = \dfrac{\pi R^4\Delta P}{8\eta L} = \dfrac{\pi({Rm:texsci})^4({dPk}\times10^3)}{8({fl:texsci})({Lcm}\times10^{-2})}$ m³/s $=$ **{Q:sig3} mL/s** (1 mL $= 10^{-6}$ m³).

    Average speed: $Q/(\pi R^2) =$ **{vav:sig3} m/s**, half the speed on the axis.
- id: phys-m7-r2-reynolds
  title: Reynolds number of a pipe flow
  topic: Viscous flow
  vars:
    fl: {choices: [{label: 'water (ρ = 1000 kg/m³, η = 1.0 × 10⁻³ Pa·s)', value: 1}, {label: 'air (ρ = 1.2 kg/m³, η = 1.8 × 10⁻⁵ Pa·s)', value: 2}, {label: 'olive oil (ρ = 910 kg/m³, η = 0.080 Pa·s)', value: 3}, {label: 'glycerin (ρ = 1260 kg/m³, η = 1.4 Pa·s)', value: 4}]}
    D: {min: 0.5, max: 10, step: 0.5}
    v: {min: 0.1, max: 5, step: 0.1}
  calc:
    rho: if(fl == 1, 1000, if(fl == 2, 1.2, if(fl == 3, 910, 1260)))
    eta: if(fl == 1, 0.001, if(fl == 2, 0.000018, if(fl == 3, 0.08, 1.4)))
    Rey: rho*v*(D/100)/eta
  prompt: '{fl} flows at an average speed of {v} m/s through a pipe of diameter {D} cm. Find the Reynolds number $\text{Re} = \rho vD/\eta$ to 3 significant figures. (Below about 2000 the flow is laminar; above about 3000 it is usually turbulent.)'
  answers:
    - {name: Rey, label: 'Re', format: sig4, relTolerance: 0.01}
  solution: |-
    With $D = {D}$ cm $= {D}\times10^{-2}$ m: $\text{Re} = \dfrac{\rho vD}{\eta} = \dfrac{({rho})({v})({D}\times10^{-2})}{{eta:texsci}} =$ **{Rey:sig3}**. Compare with about 2000 (laminar below) and about 3000 (usually turbulent above).
- id: phys-m7-r2-stokes
  title: Stokes settling speed
  topic: Viscous flow
  vars:
    gr: {choices: [{label: 'quartz (2650 kg/m³)', value: 2650}, {label: 'glass (2500 kg/m³)', value: 2500}, {label: 'iron (7870 kg/m³)', value: 7870}]}
    rum: {min: 2, max: 60}
  calc:
    rm: rum*1e-6
    vt: 2*rm^2*(gr - 1000)*9.8/(9*0.001)
    vmm: vt*1000
    Rey: 1000*vt*2*rm/0.001
  where: ['Rey < 0.5']
  prompt: 'A sphere of {gr} with radius {rum} μm settles through still water (density 1000 kg/m³, $\eta = 1.0\times10^{-3}$ Pa·s). Using Stokes'' law and $g = 9.8$ m/s², find its terminal speed in mm/s and the Reynolds number $\rho_{\text{water}}v_tD/\eta$ (using the diameter) for that speed. Give both to 3 significant figures.'
  answers:
    - {name: vmm, label: 'Terminal speed', format: sig4, relTolerance: 0.01, units: {'mm/s': 1, 'm/s': 1000}}
    - {name: Rey, label: 'Re', format: sci, relTolerance: 0.01}
  solution: |-
    $v_t = \dfrac{2r^2(\rho_s - \rho_f)g}{9\eta} = \dfrac{2({rm:texsci})^2({gr} - 1000)(9.8)}{9(1.0\times10^{-3})} =$ **{vmm:sig3} mm/s**.

    $\text{Re} = \dfrac{1000\,v_t(2r)}{1.0\times10^{-3}} =$ **{Rey:texsci}**, below 1, so Stokes' law applies.
