# Round 2 glossary for phys-m1 honors lessons (uncertainty; vector algebra).
- term: uncertainty
  aliases: [uncertainties, absolute uncertainty]
  definition: 'The amount $\delta x$ by which a measured or calculated value may differ from the true value, written $x \pm \delta x$ in the same units as $x$.'
  topic: Measurement uncertainty
- term: relative uncertainty
  aliases: [relative uncertainties, fractional uncertainty, percent uncertainty]
  definition: 'The uncertainty divided by the size of the value, $\delta x/|x|$, often given as a percentage; it has no units, so it compares quality across quantities.'
  topic: Measurement uncertainty
- term: random error
  aliases: [random errors]
  definition: 'Error that scatters repeated readings above and below the true value; averaging many readings reduces its effect.'
  topic: Measurement uncertainty
- term: systematic error
  aliases: [systematic errors]
  definition: 'Error that shifts every reading the same way, such as a zero offset or a miscalibrated instrument; averaging does not reduce it.'
  topic: Measurement uncertainty
- term: standard deviation
  aliases: [sample standard deviation]
  definition: 'The typical spread of single readings about their mean: $s = \sqrt{\sum (x_i - \bar x)^2/(n-1)}$.'
  topic: Measurement uncertainty
- term: standard error of the mean
  aliases: [standard error]
  definition: 'The uncertainty of a mean of $n$ readings, $s/\sqrt n$; it shrinks as more readings are taken.'
  topic: Measurement uncertainty
- term: propagation of uncertainty
  aliases: [error propagation, propagation of error]
  definition: 'Working out the uncertainty of a calculated result from the uncertainties of the measurements it uses.'
  topic: Error propagation
- term: adding in quadrature
  aliases: [add in quadrature, added in quadrature, quadrature]
  definition: 'Combining independent uncertainties as the square root of the sum of their squares, $\sqrt{a^2 + b^2}$, rather than as a plain sum.'
  topic: Error propagation
- term: discrepancy
  aliases: [discrepancies]
  definition: 'The difference between a result and an accepted value, or between two results; judged against the uncertainty to decide whether they agree.'
  topic: Measurement uncertainty
- term: scalar projection
  aliases: [scalar projections]
  definition: 'The signed length of the part of $\vec A$ along $\vec B$: $\vec A\cdot\hat B = A\cos\phi$.'
  topic: Vector projections
- term: vector projection
  aliases: [vector projections]
  definition: 'The part of $\vec A$ parallel to $\vec B$: $(\vec A\cdot\hat B)\,\hat B = \dfrac{\vec A\cdot\vec B}{B^2}\vec B$.'
  topic: Vector projections
- term: direction cosines
  aliases: [direction cosine]
  definition: 'The cosines of the angles a vector makes with the $x$, $y$ and $z$ axes, $A_x/A$, $A_y/A$, $A_z/A$; they are the components of $\hat A$ and their squares add to 1.'
  topic: Vector projections
- term: scalar triple product
  aliases: [scalar triple products, box product]
  definition: '$\vec A\cdot(\vec B\times\vec C)$, the determinant of the three vectors'' components; its absolute value is the volume of the parallelepiped they span.'
  topic: Triple products
- term: coplanar
  definition: 'Lying in one plane. Three vectors are coplanar exactly when their scalar triple product is zero.'
  topic: Triple products
- term: vector triple product
  aliases: [vector triple products, BAC-CAB rule]
  definition: '$\vec A\times(\vec B\times\vec C) = \vec B(\vec A\cdot\vec C) - \vec C(\vec A\cdot\vec B)$, a vector in the plane of $\vec B$ and $\vec C$.'
  topic: Triple products
