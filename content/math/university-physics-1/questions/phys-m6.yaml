- id: phys-q-2001
  lesson: phys-shm
  module_quiz: true
  topic: Simple harmonic motion
  stem: 'A 2.0 kg mass on a spring with $k = 50$ N/m oscillates. What is its period?'
  choices: ['31 s', '0.20 s', '1.26 s', '0.16 s']
  answer: 2
  explanation: |-
    $T = 2\pi\sqrt{m/k} = 2\pi\sqrt{2.0/50} = 2\pi(0.20) = 1.26$ s. Inverting the ratio, $2\pi\sqrt{k/m}$, gives 31 s.
- id: phys-q-2002
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'A mass on a spring oscillates with amplitude 5 cm. If the amplitude is increased to 10 cm, the period'
  choices: ['doubles', 'stays the same', 'halves', 'increases by $\sqrt2$']
  answer: 1
  explanation: |-
    $T = 2\pi\sqrt{m/k}$ has no amplitude in it. Twice the distance is covered with twice the force (and twice the speed), in the same time.
- id: phys-q-2003
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'Where in its cycle does a mass in SHM have its maximum speed and where its maximum acceleration?'
  choices: ['Both at the endpoints', 'Both at equilibrium', 'Maximum speed at the endpoints, maximum acceleration at equilibrium', 'Maximum speed at equilibrium, maximum acceleration at the endpoints']
  answer: 3
  explanation: |-
    At equilibrium the spring force is zero (so $a = 0$) and all the energy is kinetic (maximum speed). At the endpoints the speed is zero and the restoring force, hence the acceleration, is largest.
- id: phys-q-2004
  lesson: phys-shm
  module_quiz: true
  topic: Pendulums
  stem: 'What is the period of a simple pendulum 1.0 m long? ($g = 9.8$ m/s²)'
  choices: ['2.0 s', '0.32 s', '6.3 s', '1.0 s']
  answer: 0
  explanation: |-
    $T = 2\pi\sqrt{L/g} = 2\pi\sqrt{1.0/9.8} = 2.0$ s.
- id: phys-q-2005
  lesson: phys-shm
  topic: Pendulums
  stem: 'To double the period of a simple pendulum, you should'
  choices: ['double its length', 'double the mass of the bob', 'quadruple its length', 'double the amplitude']
  answer: 2
  explanation: |-
    $T \propto \sqrt{L}$, so doubling $T$ needs $4L$. The bob's mass and (small) amplitude don't affect the period.
- id: phys-q-2006
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'A 2.0 kg mass on a spring ($k = 800$ N/m) oscillates with amplitude 0.050 m. What is its maximum speed?'
  choices: ['1.0 m/s', '20 m/s', '0.25 m/s', '2.0 m/s']
  answer: 0
  explanation: |-
    $\omega = \sqrt{800/2.0} = 20$ rad/s, so $v_{\max} = A\omega = 0.050(20) = 1.0$ m/s. 20 m/s² is the maximum acceleration $A\omega^2$, not the speed.
- id: phys-q-2007
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'A spring with $k = 100$ N/m oscillates with amplitude 0.20 m. What is the total mechanical energy?'
  choices: ['20 J', '4.0 J', '10 J', '2.0 J']
  answer: 3
  explanation: |-
    $E = \tfrac12kA^2 = \tfrac12(100)(0.20)^2 = 2.0$ J. It's all spring energy at the turning points and all kinetic at equilibrium.
- id: phys-q-2008
  lesson: phys-shm
  module_quiz: true
  topic: Simple harmonic motion
  stem: 'A child on a swing is pushed once per swing, exactly in step with its natural motion, and swings higher and higher. This is an example of'
  choices: ['damping', 'resonance', 'superposition', 'the Doppler effect']
  answer: 1
  explanation: |-
    Driving an oscillator at its natural frequency feeds in energy each cycle, building up a large amplitude: resonance.
- id: phys-q-2009
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'The equation of motion of an oscillator is $\ddot x = -36x$ (SI units). What is its period?'
  choices: ['1.05 s', '6.0 s', '0.17 s', '36 s']
  answer: 0
  explanation: |-
    Matching $\ddot x = -\omega^2x$ gives $\omega = 6.0$ rad/s, so $T = 2\pi/6.0 = 1.05$ s. 6.0 is $\omega$, not the period.
- id: phys-q-2010
  lesson: phys-shm
  topic: Pendulums
  stem: 'A pendulum clock that keeps perfect time on Earth is taken to the Moon, where $g$ is about 1/6 as large. Its period becomes'
  choices: ['1/6 as long', '6 times as long', '$\sqrt6$ times as long', 'unchanged']
  answer: 2
  explanation: |-
    $T \propto 1/\sqrt g$, so with $g$ six times smaller the period is $\sqrt6 \approx 2.45$ times longer; the clock runs slow.
- id: phys-q-2011
  lesson: phys-shm
  topic: Simple harmonic motion
  stem: 'For $x(t) = 0.30\cos(4t)$ m, what is the maximum acceleration?'
  choices: ['1.2 m/s²', '0.30 m/s²', '4.8 m/s²', '0.075 m/s²']
  answer: 2
  explanation: |-
    $a = \ddot x = -0.30(16)\cos(4t)$, so $a_{\max} = A\omega^2 = 4.8$ m/s². 1.2 m/s is the maximum speed $A\omega$.
- id: phys-q-2101
  lesson: phys-waves
  module_quiz: true
  topic: Wave properties
  stem: 'A sound wave in air (speed 340 m/s) has frequency 170 Hz. What is its wavelength?'
  choices: ['0.50 m', '2.0 m', '57 800 m', '1.0 m']
  answer: 1
  explanation: |-
    $\lambda = v/f = 340/170 = 2.0$ m. 0.50 m inverts the ratio.
- id: phys-q-2102
  lesson: phys-waves
  topic: Wave properties
  stem: 'A wave passes from a light rope into a heavy rope tied to it. Which property stays the same?'
  choices: ['Speed', 'Wavelength', 'Amplitude', 'Frequency']
  answer: 3
  explanation: |-
    Frequency is set by the source: each point of the junction must oscillate in step on both sides. The speed (and so the wavelength) changes with the medium.
- id: phys-q-2103
  lesson: phys-waves
  topic: Wave properties
  stem: 'In a longitudinal wave, the particles of the medium move'
  choices: ['parallel to the direction the wave travels', 'perpendicular to the direction the wave travels', 'in circles', 'along with the wave to the far end']
  answer: 0
  explanation: |-
    Longitudinal waves (like sound) consist of compressions and rarefactions along the direction of travel. Transverse waves (like waves on a string) move the medium perpendicular to the travel.
- id: phys-q-2104
  lesson: phys-waves
  module_quiz: true
  topic: Wave properties
  stem: 'A string has linear mass density 0.010 kg/m and tension 100 N. What is the speed of waves on it?'
  choices: ['10 m/s', '10 000 m/s', '100 m/s', '1.0 m/s']
  answer: 2
  explanation: |-
    $v = \sqrt{F_T/\mu} = \sqrt{100/0.010} = \sqrt{10\,000} = 100$ m/s.
- id: phys-q-2105
  lesson: phys-waves
  topic: Wave properties
  stem: 'If the tension in a string is quadrupled, the wave speed'
  choices: ['quadruples', 'halves', 'doubles', 'stays the same']
  answer: 2
  explanation: |-
    $v = \sqrt{F_T/\mu}$, so $v \propto \sqrt{F_T}$: four times the tension gives twice the speed.
- id: phys-q-2106
  lesson: phys-waves
  topic: Standing waves
  stem: 'A 0.50 m string fixed at both ends carries waves at 100 m/s. What is its fundamental frequency?'
  choices: ['200 Hz', '50 Hz', '400 Hz', '100 Hz']
  answer: 3
  explanation: |-
    $f_1 = v/(2L) = 100/1.0 = 100$ Hz. Using $v/L$ gives 200 Hz; using $v/(4L)$ gives 50 Hz (that's for a closed pipe).
- id: phys-q-2107
  lesson: phys-waves
  module_quiz: true
  topic: Standing waves
  stem: 'In a standing wave, the distance between adjacent nodes is'
  choices: ['$\lambda/4$', '$\lambda$', '$\lambda/2$', '$2\lambda$']
  answer: 2
  explanation: |-
    Nodes of $\sin(kx)$ occur every $\pi/k = \lambda/2$. A node and the next antinode are $\lambda/4$ apart.
- id: phys-q-2108
  lesson: phys-waves
  topic: Wave properties
  stem: 'Two waves of amplitude 3 cm meet crest to trough at a point. The resulting displacement there is'
  choices: ['0 cm', '6 cm', '3 cm', '9 cm']
  answer: 0
  explanation: |-
    By superposition, $+3 + (-3) = 0$: complete destructive interference. Each wave continues unchanged afterward.
- id: phys-q-2109
  lesson: phys-waves
  topic: Wave properties
  stem: 'A wave is described by $y = 0.02\sin(4\pi x - 20\pi t)$ (SI units). What is its speed?'
  choices: ['0.2 m/s', '80 m/s', '5.0 m/s', '20 m/s']
  answer: 2
  explanation: |-
    $v = \omega/k = 20\pi/4\pi = 5.0$ m/s. (Here $\lambda = 2\pi/k = 0.5$ m and $f = \omega/2\pi = 10$ Hz; $f\lambda = 5.0$ ✓.)
- id: phys-q-2110
  lesson: phys-waves
  topic: Wave properties
  stem: 'If the amplitude of a wave is doubled (same frequency and medium), the power it carries'
  choices: ['doubles', 'quadruples', 'is unchanged', 'halves']
  answer: 1
  explanation: |-
    Wave energy and power are proportional to amplitude squared, so $2^2 = 4$ times the power.
- id: phys-q-2111
  lesson: phys-waves
  topic: Standing waves
  stem: 'The third harmonic of a string fixed at both ends has how many nodes, counting the ends?'
  choices: ['3', '2', '5', '4']
  answer: 3
  explanation: |-
    The $n$th harmonic fits $n$ half-wavelengths, giving $n$ antinodes and $n + 1$ nodes. For $n = 3$: 4 nodes.
- id: phys-q-2201
  lesson: phys-sound
  module_quiz: true
  topic: Sound
  stem: 'A sound has intensity $10^{-5}$ W/m². What is its intensity level? ($I_0 = 10^{-12}$ W/m²)'
  choices: ['50 dB', '70 dB', '7 dB', '120 dB']
  answer: 1
  explanation: |-
    $\beta = 10\log_{10}(10^{-5}/10^{-12}) = 10\log_{10}(10^7) = 70$ dB. Forgetting the factor 10 gives 7 dB.
- id: phys-q-2202
  lesson: phys-sound
  topic: Sound
  stem: 'Two identical machines each produce 70 dB at a certain spot. With both running, the level is'
  choices: ['140 dB', '70 dB', '80 dB', '73 dB']
  answer: 3
  explanation: |-
    Intensities add, not decibels: twice the intensity adds $10\log 2 = 3$ dB, giving 73 dB. 80 dB would need ten machines.
- id: phys-q-2203
  lesson: phys-sound
  topic: Sound
  stem: 'You move three times farther from a small speaker that produces 90 dB where you started. The new level is about'
  choices: ['80 dB', '30 dB', '60 dB', '87 dB']
  answer: 0
  explanation: |-
    Intensity falls as $1/r^2$: one-ninth. The level drops by $10\log 9 = 9.5$ dB, to about 80 dB.
- id: phys-q-2204
  lesson: phys-sound
  module_quiz: true
  topic: Sound
  stem: 'A pipe 0.50 m long is closed at one end. What is its fundamental frequency? ($v = 343$ m/s)'
  choices: ['343 Hz', '686 Hz', '171.5 Hz', '85.8 Hz']
  answer: 2
  explanation: |-
    Closed at one end: $f_1 = v/(4L) = 343/2.0 = 171.5$ Hz. 343 Hz would be the fundamental if both ends were open.
- id: phys-q-2205
  lesson: phys-sound
  topic: Sound
  stem: 'Which harmonics can a pipe closed at one end produce?'
  choices: ['Only odd multiples of the fundamental', 'Only even multiples', 'All integer multiples', 'Only the fundamental']
  answer: 0
  explanation: |-
    A node at the closed end and an antinode at the open end require an odd number of quarter-wavelengths: $f_n = nv/(4L)$, $n = 1, 3, 5, \ldots$
- id: phys-q-2206
  lesson: phys-sound
  module_quiz: true
  topic: Doppler effect
  stem: 'A car horn emits 500 Hz. The car moves toward a stationary listener at 20 m/s. What frequency does the listener hear? ($v = 343$ m/s)'
  choices: ['472 Hz', '529 Hz', '520 Hz', '531 Hz']
  answer: 3
  explanation: |-
    Source approaching: $f' = f\dfrac{v}{v - v_s} = 500\dfrac{343}{323} = 531$ Hz. 529 Hz is the formula for a moving observer; 472 Hz uses $v + v_s$ (receding).
- id: phys-q-2207
  lesson: phys-sound
  topic: Doppler effect
  stem: 'As a train passes you blowing its whistle at constant speed, the pitch you hear'
  choices: ['rises steadily', 'is higher while it approaches and drops as it moves away', 'is lower while it approaches and rises as it moves away', 'stays the same, only the loudness changes']
  answer: 1
  explanation: |-
    Approaching sources sound higher, receding ones lower. At constant speed each pitch is steady, with a quick drop as it passes.
- id: phys-q-2208
  lesson: phys-sound
  topic: Sound
  stem: 'A guitar string and a 440 Hz tuning fork sound together and produce 4 beats per second. The string''s frequency is'
  choices: ['exactly 444 Hz', 'exactly 436 Hz', '4 Hz', 'either 436 Hz or 444 Hz']
  answer: 3
  explanation: |-
    $f_{\text{beat}} = |f_1 - f_2| = 4$ Hz, so the string is 4 Hz away from 440 in an unknown direction. Tightening it slightly and listening to whether the beats speed up or slow down tells which.
- id: phys-q-2209
  lesson: phys-sound
  topic: Sound
  stem: 'The speed of sound in air increases with temperature because'
  choices: ['warm air is denser', 'faster-moving molecules pass the disturbance along more quickly', 'the frequency increases', 'the wavelength decreases']
  answer: 1
  explanation: |-
    Sound is passed on by molecular collisions; higher temperature means faster molecules, so the wave travels faster ($v \approx 331 + 0.6\,T_C$ m/s).
- id: phys-q-2210
  lesson: phys-sound
  topic: Doppler effect
  stem: 'A jet flies at Mach 2. What is the half-angle of its shock-wave cone?'
  choices: ['$60^\circ$', '$45^\circ$', '$30^\circ$', '$90^\circ$']
  answer: 2
  explanation: |-
    $\sin\theta = v/v_s = 1/2$, so $\theta = 30^\circ$.
- id: phys-q-2211
  lesson: phys-sound
  topic: Sound
  stem: 'At the closed end of an organ pipe, the air''s displacement and pressure variation are'
  choices: ['a displacement node and a pressure antinode', 'a displacement antinode and a pressure node', 'both nodes', 'both antinodes']
  answer: 0
  explanation: |-
    The air can't move into the wall, so displacement is zero there; that's where compressions build up the largest pressure swings. Pressure and displacement waves are a quarter-cycle out of step.
