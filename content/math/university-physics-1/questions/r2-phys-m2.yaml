# Round 2 questions for phys-m2 (Kinematics): new question types for the core lessons
# (phys-m2-r2-q..) and the two honors lessons (phys-m2-r2-h..).

# ---------- Lesson 03: Describing motion in one dimension ----------
- id: phys-m2-r2-q01
  lesson: phys-motion-1d
  type: text
  topic: Motion graphs
  stem: 'On a velocity–time graph, the signed area between the curve and the time axis equals the object''s ___.'
  accept: [displacement, change in position, displacements]
  explanation: |-
    Each thin strip of the area is $v\,\Delta t$, which is the displacement during that strip; adding the strips adds the displacements. Area below the axis counts as negative displacement. (It is not the distance traveled, which would count every strip as positive.)
- id: phys-m2-r2-q02
  lesson: phys-motion-1d
  type: match
  module_quiz: true
  topic: Motion graphs
  stem: 'Match each feature of a motion graph to the quantity it gives.'
  pairs:
    - [Height of an x–t graph, Position]
    - [Slope of an x–t graph, Velocity]
    - [Slope of a v–t graph, Acceleration]
    - [Area under a v–t graph, Displacement]
    - [Area under an a–t graph, Change in velocity]
  distractors: [Distance traveled]
  explanation: |-
    Slopes are derivatives ($v = dx/dt$, $a = dv/dt$) and areas are integrals ($\Delta x = \int v\,dt$, $\Delta v = \int a\,dt$). The height of an $x$–$t$ graph is simply the position. Distance traveled is not any one of these: it is the area under the graph of speed $|v|$, which counts every strip as positive.
- id: phys-m2-r2-q03
  lesson: phys-motion-1d
  topic: Velocity and acceleration
  stem: 'A particle moves along $x$ with $x(t) = t^3 - 6t^2 + 9t$ (meters, seconds). Which statements are true? Select all that apply.'
  choices:
    - 'It is momentarily at rest at $t = 1$ s and at $t = 3$ s.'
    - 'It moves in the $-x$ direction between $t = 1$ s and $t = 3$ s.'
    - 'Its acceleration is zero at $t = 1$ s.'
    - 'Its velocity at $t = 2$ s is $+3$ m/s.'
  answer: [0, 1]
  explanation: |-
    $v = 3t^2 - 12t + 9 = 3(t - 1)(t - 3)$, which is zero at 1 s and 3 s and negative between them (try $t = 2$: $v = 12 - 24 + 9 = -3$ m/s, so the last choice has the wrong sign). $a = 6t - 12$, so $a(1) = -6$ m/s², not zero: $v = 0$ does not mean $a = 0$.
- id: phys-m2-r2-q04
  lesson: phys-motion-1d
  type: label
  module_quiz: true
  topic: Motion graphs
  stem: 'Describe the motion during each numbered piece of this velocity–time graph.'
  image: {src: images/phys-m2-vt-segments-blank.svg, alt: 'A velocity–time graph made of four straight pieces: rising from 0 to 6 m/s between 0 and 4 s, flat at 6 m/s until 7 s, falling to zero at 8.5 s, then continuing down to −4 m/s at 9.5 s. Each piece is numbered.'}
  labels:
    - {x: 28.3, y: 38.8, text: Speeding up while moving in +x}
    - {x: 57.5, y: 20, text: Moving at constant velocity}
    - {x: 76.2, y: 38.8, text: Slowing down while moving in +x}
    - {x: 86.7, y: 70, text: Speeding up while moving in −x}
  distractors: [At rest, Slowing down while moving in −x]
  explanation: |-
    The sign of $v$ gives the direction: pieces 1–3 are above the axis ($+x$), piece 4 below ($-x$). The object speeds up when the graph moves away from the axis (pieces 1 and 4) and slows down when it moves toward it (piece 3). The flat piece 2 has zero slope, so constant velocity, not rest: $v = 6$ m/s there. The object is at rest only at single instants: at the start ($t = 0$) and at the turnaround ($t = 8.5$ s).
- id: phys-m2-r2-q05
  lesson: phys-motion-1d
  type: text
  topic: Velocity and acceleration
  stem: 'A particle moves along $x$ with $x(t) = 2t^2 - 8t$ (meters, seconds). At what time is it momentarily at rest? Give only the number of seconds.'
  accept: ['2']
  explanation: |-
    $v = dx/dt = 4t - 8$, which is zero at $t = 2$ s. (At that instant $x = 8 - 16 = -8$ m, the particle's turning point.)

# ---------- Lesson 04: Constant acceleration and free fall ----------
- id: phys-m2-r2-q06
  lesson: phys-const-accel
  type: match
  module_quiz: true
  topic: Constant acceleration
  stem: 'Each constant-acceleration equation leaves out one of the five quantities. Match each equation to the quantity it does not contain.'
  pairs:
    - ['$v = v_0 + at$', Displacement]
    - ['$\Delta x = v_0t + \tfrac12at^2$', Final velocity]
    - ['$\Delta x = \tfrac12(v_0 + v)t$', Acceleration]
    - ['$v^2 = v_0^2 + 2a\Delta x$', Time]
  distractors: [Initial velocity]
  explanation: |-
    Read each equation and see which of $\Delta x$, $v_0$, $v$, $a$, $t$ is missing. Every one of the four contains $v_0$, which is why "initial velocity" matches none of them. To choose an equation, find the quantity you neither know nor want and use the equation without it.
- id: phys-m2-r2-q07
  lesson: phys-const-accel
  type: label
  module_quiz: true
  topic: Free fall
  stem: 'A ball is thrown straight up at 14.7 m/s from a roof 20.0 m high and lands on the ground below ($g = 9.8$ m/s²). Match each numbered point to the ball''s velocity there.'
  image: {src: images/phys-m2-roof-throw-blank.svg, alt: 'A 20.0 m building with a ball''s vertical path drawn beside it as an up leg and a down leg. Point 1 is at roof level on the up leg, point 2 at the top 11.0 m above the roof, point 3 at roof level on the down leg, and point 4 just above the ground.'}
  labels:
    - {x: 41.7, y: 44.2, text: 14.7 m/s upward}
    - {x: 46.7, y: 18.6, text: Zero}
    - {x: 51.7, y: 44.2, text: 14.7 m/s downward}
    - {x: 51.7, y: 87.4, text: 24.7 m/s downward}
  distractors: [24.7 m/s upward, 9.8 m/s downward]
  explanation: |-
    Point 1 is the launch. At the top (2) the velocity is momentarily zero, although the acceleration is still 9.8 m/s² downward. By symmetry the ball passes roof level again (3) at the launch speed, now downward. From launch to the ground $\Delta y = -20.0$ m, so $v_y^2 = 14.7^2 + 2(9.8)(20.0) = 608.09$ and the speed at 4 is 24.7 m/s downward. 9.8 m/s is the speed after 1 s of falling from rest, which matches none of the points.
- id: phys-m2-r2-q08
  lesson: phys-const-accel
  type: text
  topic: Constant acceleration
  stem: 'A cart starts from rest and accelerates at a constant 2.0 m/s² for 6.0 s. How far does it travel? Give only the number of meters.'
  accept: ['36']
  explanation: |-
    No final velocity is given or wanted, so use $\Delta x = v_0t + \tfrac12at^2 = 0 + \tfrac12(2.0)(6.0)^2 = 36$ m. (Forgetting the $\tfrac12$ gives 72 m.)
- id: phys-m2-r2-q09
  lesson: phys-const-accel
  topic: Free fall
  stem: 'A ball is thrown straight up and caught at the height it was thrown from. Air resistance is negligible. Which statements are true? Select all that apply.'
  choices:
    - 'The time going up equals the time coming down.'
    - 'At the top of the flight its acceleration is zero.'
    - 'It returns to the launch height with the same speed it was thrown with.'
    - 'A heavier ball thrown at the same speed would reach a lower maximum height.'
  answer: [0, 2]
  explanation: |-
    The motion is symmetric: with the same constant acceleration on the way up and down, the up and down times are equal and the ball comes back at its launch speed. At the top only the velocity is zero; the acceleration is still $g$ downward. Free-fall motion does not depend on mass, so a heavier ball at the same speed rises to the same height, $v_0^2/(2g)$.
- id: phys-m2-r2-q10
  lesson: phys-const-accel
  type: order
  topic: Constant acceleration
  stem: 'Four cars brake to a stop with the constant decelerations shown. Put them in order from shortest to longest stopping distance.'
  items:
    - '$v_0 = 20$ m/s, braking at 10 m/s²'
    - '$v_0 = 10$ m/s, braking at 2 m/s²'
    - '$v_0 = 30$ m/s, braking at 15 m/s²'
    - '$v_0 = 15$ m/s, braking at 3 m/s²'
  explanation: |-
    Stopping distance is $d = v_0^2/(2a)$: $400/20 = 20$ m, $100/4 = 25$ m, $900/30 = 30$ m and $225/6 = 37.5$ m. Speed alone doesn't decide it, because the distance grows with $v_0^2$ but shrinks with the braking acceleration.

# ---------- Lesson 05: Projectile motion ----------
- id: phys-m2-r2-q11
  lesson: phys-projectiles
  type: label
  module_quiz: true
  topic: Projectile motion
  stem: 'Name the numbered parts of this projectile diagram (no air resistance).'
  image: {src: images/phys-m2-projectile-parts-blank.svg, alt: 'A dashed parabolic path over level ground. On the rising side a solid arrow along the path has dashed horizontal and vertical arrows at its tail. At the top a solid horizontal arrow and a downward arrow start from the path. On the falling side a solid arrow along the path has dashed horizontal and downward arrows. A vertical double arrow on the left spans from the ground to the top of the path, and a horizontal double arrow below spans the launch and landing points. Six items are numbered.'}
  labels:
    - {x: 30.3, y: 37.4, text: Velocity (tangent to the path)}
    - {x: 57.7, y: 25, text: Velocity at the top (horizontal only)}
    - {x: 76.6, y: 63.9, text: Vertical velocity component}
    - {x: 50, y: 40, text: Acceleration due to gravity}
    - {x: 4.7, y: 62.5, text: Maximum height}
    - {x: 62.5, y: 93, text: Range}
  distractors: [Displacement at the top]
  explanation: |-
    The velocity always points along the path (1). At the top the vertical component is zero, so the velocity is horizontal and equal to $v_0\cos\theta$ (2). On the way down the vertical component points downward and grows (3). The acceleration is $g$ straight down everywhere, including the top (4). The vertical double arrow is the maximum height $H$ (5) and the horizontal one the range $R$ (6).
- id: phys-m2-r2-q12
  lesson: phys-projectiles
  type: text
  topic: Projectile motion
  stem: 'A ball launched from level ground at $30^\circ$ above horizontal has a certain range. At what other launch angle, with the same speed, does it land at the same spot? Give only the number of degrees.'
  accept: ['60']
  explanation: |-
    $R = v_0^2\sin 2\theta/g$, and $\sin 60^\circ = \sin 120^\circ$, so $\theta = 30^\circ$ and $\theta = 60^\circ$ give the same range. Complementary angles always do (on level ground, without air resistance); the steeper one goes higher and stays up longer.
- id: phys-m2-r2-q13
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'A ball is launched at $40^\circ$ above level ground, with air resistance negligible. Which quantities stay constant during its flight? Select all that apply.'
  choices:
    - 'The horizontal component of its velocity'
    - 'Its acceleration'
    - 'The vertical component of its velocity'
    - 'Its speed'
  answer: [0, 1]
  explanation: |-
    Gravity acts only downward, so $v_x$ never changes and the acceleration is $g$ downward throughout. $v_y$ decreases steadily (positive, then zero at the top, then negative), so the speed $\sqrt{v_x^2 + v_y^2}$ is smallest at the top and changes all the time.
- id: phys-m2-r2-q14
  lesson: phys-projectiles
  type: order
  topic: Projectile motion
  stem: 'A stone is thrown at an angle from a cliff and lands in the water below. Put the steps for finding how far from the cliff it lands in order.'
  items:
    - 'Resolve the launch velocity into $v_{0x}$ and $v_{0y}$'
    - 'Write $y(t) = v_{0y}t - \tfrac12gt^2$ with $y$ set to the (negative) water level'
    - 'Solve the quadratic for $t$'
    - 'Keep the positive root'
    - 'Compute $x = v_{0x}t$'
  explanation: |-
    The vertical equation needs $v_{0y}$, so the components come first. The landing height fixes $y$; solving the quadratic gives two roots, and the negative one is a time before the throw. Only then can the horizontal distance $x = v_{0x}t$ be found. The range formula can't be used, because the stone lands below its launch height.
- id: phys-m2-r2-q15
  lesson: phys-projectiles
  type: text
  module_quiz: true
  topic: Projectile motion
  stem: 'A ball is launched from level ground with a vertical velocity component of 9.8 m/s. Using $g = 9.8$ m/s², how long is it in the air? Give only the number of seconds.'
  accept: ['2']
  explanation: |-
    $T = 2v_{0y}/g = 2(9.8)/9.8 = 2$ s: 1 s up to the top, where $v_y = 0$, and 1 s back down. The horizontal component doesn't affect the time. (1 s is only the time to the top.)

# ---------- Lesson 06: Motion in two dimensions and relative motion ----------
- id: phys-m2-r2-q16
  lesson: phys-motion-2d
  type: label
  module_quiz: true
  topic: Two-dimensional motion
  stem: 'A car is slowing down as it drives counterclockwise around a curve. Name the numbered parts.'
  image: {src: images/phys-m2-curve-accel-blank.svg, alt: 'A car on a curved road with four arrows starting at the car: one along the road ahead, one along the road backward, one pointing toward a dot at the center of the curve, and one pointing inward and somewhat backward. Dashed lines complete a rectangle from the two component arrows. The center dot and the four arrows are numbered.'}
  labels:
    - {x: 39.4, y: 22.2, text: Velocity}
    - {x: 62.1, y: 49.3, text: Tangential acceleration}
    - {x: 42.1, y: 56.5, text: Radial acceleration}
    - {x: 50.9, y: 66.2, text: Total acceleration}
    - {x: 25, y: 85.7, text: Center of the curve}
  distractors: [Displacement]
  explanation: |-
    The velocity points along the road in the direction of motion (1). Because the car is slowing, the tangential part of the acceleration points backward along the road (2). The radial part points toward the center of the curve (3, 5) and changes the direction of motion. The total acceleration (4) is the vector sum of the two, so it points inward and backward.
- id: phys-m2-r2-q17
  lesson: phys-motion-2d
  type: match
  module_quiz: true
  topic: Relative motion
  stem: 'A passenger P walks along the aisle of a train T, which moves relative to the ground G. Match each symbol to its meaning.'
  pairs:
    - ['$\vec v_{PT}$', Velocity of the passenger relative to the train]
    - ['$\vec v_{TG}$', Velocity of the train relative to the ground]
    - ['$\vec v_{PG}$', Velocity of the passenger relative to the ground]
    - ['$\vec v_{GT}$', Velocity of the ground relative to the train]
  distractors: [Velocity of the train relative to the passenger]
  explanation: |-
    $\vec v_{AB}$ is "A relative to B". The rule $\vec v_{PG} = \vec v_{PT} + \vec v_{TG}$ links the first three, and $\vec v_{GT} = -\vec v_{TG}$: to someone on the train, the ground moves backward. The train relative to the passenger would be $\vec v_{TP}$, which isn't listed.
- id: phys-m2-r2-q18
  lesson: phys-motion-2d
  topic: Two-dimensional motion
  stem: 'Which of these objects are accelerating? Select all that apply.'
  choices:
    - 'A car rounding a curve at a steady 50 km/h'
    - 'A thrown ball at the top of its flight'
    - 'A puck sliding in a straight line at constant speed on frictionless ice'
    - 'A satellite moving at constant speed in a circular orbit'
  answer: [0, 1, 3]
  explanation: |-
    Acceleration is any change in the velocity vector. The car and the satellite change direction (radial acceleration) even at constant speed, and the ball at the top still has $g$ downward. Only the puck keeps the same speed and the same direction, so its acceleration is zero.
- id: phys-m2-r2-q19
  lesson: phys-motion-2d
  type: text
  topic: Relative motion
  stem: 'A river 60 m wide flows at 1.5 m/s. A boat that moves at 2.0 m/s relative to the water points straight across. How long does the crossing take? Give only the number of seconds.'
  accept: ['30']
  explanation: |-
    Only the velocity component across the river matters for the crossing time: $t = 60/2.0 = 30$ s. The current carries the boat $1.5 \times 30 = 45$ m downstream, but it doesn't change the time. Using the ground speed $\sqrt{2.0^2 + 1.5^2} = 2.5$ m/s with the 60 m width (24 s) mixes a diagonal speed with a straight-across distance.
- id: phys-m2-r2-q20
  lesson: phys-motion-2d
  type: text
  topic: Relative motion
  stem: 'Car A drives east at 25 m/s and car B drives west at 15 m/s on the same straight road. What is the speed of B relative to A? Give only the number of m/s.'
  accept: ['40']
  explanation: |-
    With east positive, $v_{BG} = -15$ m/s and $v_{AG} = +25$ m/s. Then $v_{BA} = v_{BG} + v_{GA} = v_{BG} - v_{AG} = -15 - 25 = -40$ m/s: to the driver of A, car B approaches at 40 m/s from the east. (Subtracting the speeds, 10 m/s, would be right only if both drove the same way.)

# ---------- Honors: Aiming a projectile ----------
- id: phys-m2-r2-h01
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'Using $1/\cos^2\theta = 1 + \tan^2\theta$, the condition for a projectile launched at speed $v_0$ to pass through a point $(x, y)$ becomes'
  choices:
    - 'a linear equation in $\theta$'
    - 'a quadratic equation in $\sin\theta$'
    - 'a quadratic equation in $\tan\theta$'
    - 'a cubic equation in $\tan\theta$'
  answer: 2
  explanation: |-
    The trajectory equation $y = x\tan\theta - \dfrac{gx^2}{2v_0^2\cos^2\theta}$ becomes $y = xu - k(1 + u^2)$ with $u = \tan\theta$ and $k = gx^2/(2v_0^2)$, which is the quadratic $ku^2 - xu + (y + k) = 0$. That's why there are up to two launch angles.
- id: phys-m2-r2-h02
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'A ball is launched at 15 m/s from level ground and must land 18 m away at the same height. Which launch angles work? Use $g = 9.8$ m/s².'
  choices:
    - '$51.6^\circ$ and $128.4^\circ$'
    - '$25.8^\circ$ only'
    - '$12.9^\circ$ and $77.1^\circ$'
    - '$25.8^\circ$ and $64.2^\circ$'
  answer: 3
  explanation: |-
    $\sin 2\theta = gR/v_0^2 = 9.8(18)/225 = 0.784$, so $2\theta = 51.6^\circ$ or $128.4^\circ$, giving $\theta = 25.8^\circ$ or $64.2^\circ$ (complementary angles). $51.6^\circ$ and $128.4^\circ$ are the values of $2\theta$, not $\theta$; "$25.8^\circ$ only" drops the second root; $12.9^\circ$ and $77.1^\circ$ halve the angle twice.
- id: phys-m2-r2-h03
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'A ball can be thrown at 14 m/s in any direction ($g = 9.8$ m/s²). Which target, given as (horizontal distance, height above the launch point), can it NOT reach?'
  choices:
    - '(10 m, 4 m)'
    - '(15 m, 3 m)'
    - '(18 m, 2 m)'
    - '(5 m, 9 m)'
  answer: 2
  explanation: |-
    The safety parabola is $y = \dfrac{v_0^2}{2g} - \dfrac{gx^2}{2v_0^2} = 10 - \dfrac{x^2}{40}$ m. At $x = 10$ it is 7.5 m (4 m is below it); at $x = 15$, 4.4 m (3 m is below); at $x = 5$, 9.4 m (9 m is below); at $x = 18$, only 1.9 m, so a target 2 m up is just out of reach.
- id: phys-m2-r2-h04
  lesson: phys-m2-h-aiming
  type: text
  topic: Projectile targeting
  stem: 'All trajectories launched at the same speed from one point stay on or under a curve, which each of them touches exactly once. That curve is called the ___.'
  accept: [safety parabola, envelope, envelope parabola, parabola of safety, envelope of the trajectories]
  explanation: |-
    The safety parabola, $y = \dfrac{v_0^2}{2g} - \dfrac{gx^2}{2v_0^2}$, is the envelope of the family of trajectories. Points inside it can be hit at two angles, points on it at one, points outside it not at all.
- id: phys-m2-r2-h05
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'What is the smallest launch speed that can reach a point 9.0 m away horizontally and 12.0 m above the launch point? Use $g = 9.8$ m/s².'
  choices:
    - '15.3 m/s'
    - '16.3 m/s'
    - '12.1 m/s'
    - '5.4 m/s'
  answer: 1
  explanation: |-
    $d = \sqrt{9.0^2 + 12.0^2} = 15.0$ m, so $v_0^2 = g(y + d) = 9.8(27.0) = 264.6$ and $v_0 = 16.3$ m/s (launched at $\tan^{-1}(27/9) = 71.6^\circ$). 15.3 m/s, $\sqrt{2gy}$, is just enough to rise 12 m straight up with no sideways motion; 12.1 m/s uses $\sqrt{gd}$, the level-ground formula; 5.4 m/s uses $y - d$ instead of $y + d$.
- id: phys-m2-r2-h06
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'The straight line from the launch point to a target rises at $30^\circ$ above horizontal. At what angle above horizontal should a projectile be launched to reach the target with the least possible speed?'
  choices:
    - '$60^\circ$'
    - '$45^\circ$'
    - '$30^\circ$'
    - '$75^\circ$'
  answer: 0
  explanation: |-
    The best direction bisects the angle between the vertical ($90^\circ$) and the line of sight ($30^\circ$): $45^\circ + 30^\circ/2 = 60^\circ$. $45^\circ$ is the answer only for a level target; aiming straight along the line of sight ($30^\circ$) ignores the fall due to gravity; $75^\circ$ adds the full $30^\circ$ to $45^\circ$.
- id: phys-m2-r2-h07
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'Which statements about the safety parabola for launch speed $v_0$ are true? Select all that apply.'
  choices:
    - 'A target strictly inside it can be hit at two different launch angles.'
    - 'Its highest point is $v_0^2/(2g)$ above the launch point.'
    - 'It is the path followed by the $45^\circ$ launch.'
    - 'Increasing $v_0$ makes the region under it smaller.'
  answer: [0, 1]
  explanation: |-
    Inside the parabola the quadratic in $\tan\theta$ has two real roots. At $x = 0$ the curve is at $v_0^2/(2g)$, the height of a straight-up throw. The $45^\circ$ trajectory only touches the safety parabola at ground level ($x = v_0^2/g$); it is a different curve. A faster launch raises and widens the parabola, enlarging the reachable region.
- id: phys-m2-r2-h08
  lesson: phys-m2-h-aiming
  topic: Projectiles on slopes
  stem: 'A ball is thrown at 10.0 m/s at $45^\circ$ above horizontal from the bottom of a slope that rises at $15^\circ$. How far up the slope, measured along it, does it land? Use $g = 9.8$ m/s².'
  choices:
    - '7.22 m'
    - '7.47 m'
    - '7.73 m'
    - '10.2 m'
  answer: 2
  explanation: |-
    $L = \dfrac{2v_0^2\cos\theta\sin(\theta - \alpha)}{g\cos^2\alpha} = \dfrac{200\cos 45^\circ\sin 30^\circ}{9.8\cos^2 15^\circ} = \dfrac{70.71}{9.143} = 7.73$ m. 7.47 m is the horizontal distance $L\cos\alpha$; 7.22 m leaves out the $\cos^2\alpha$; 10.2 m is the level-ground range $v_0^2\sin 90^\circ/g$.
- id: phys-m2-r2-h09
  lesson: phys-m2-h-aiming
  topic: Projectiles on slopes
  stem: 'A ball is thrown from the top of a hill that slopes downward at $20^\circ$. At what angle above horizontal does it land farthest down the slope?'
  choices:
    - '$55^\circ$'
    - '$45^\circ$'
    - '$25^\circ$'
    - '$35^\circ$'
  answer: 3
  explanation: |-
    The best angle is $45^\circ + \alpha/2$ with $\alpha = -20^\circ$ for a downhill slope: $45^\circ - 10^\circ = 35^\circ$. $55^\circ$ is the answer for an uphill slope; $45^\circ$ is for level ground; $25^\circ$ subtracts the full $20^\circ$.
- id: phys-m2-r2-h10
  lesson: phys-m2-h-aiming
  type: text
  topic: Projectiles on slopes
  stem: 'A ball is thrown at 14 m/s down a slope that falls at $30^\circ$ below horizontal. Using $g = 9.8$ m/s², what is the greatest distance along the slope it can reach? Give only the number of meters.'
  accept: ['40']
  explanation: |-
    $L_{\max} = \dfrac{v_0^2}{g(1 + \sin\alpha)}$ with $\alpha = -30^\circ$: $\dfrac{196}{9.8(1 - 0.5)} = 40$ m, launched at $45^\circ - 15^\circ = 30^\circ$. Uphill, the same throw reaches only $196/14.7 = 13.3$ m.
- id: phys-m2-r2-h11
  lesson: phys-m2-h-aiming
  type: order
  topic: Projectile targeting
  stem: 'Put the steps for finding the launch angles that hit a target at $(x, y)$ with launch speed $v_0$ in order.'
  items:
    - 'Compute $k = gx^2/(2v_0^2)$'
    - 'Substitute $k$, $x$ and $y$ into $ku^2 - xu + (y + k) = 0$'
    - 'Check that the discriminant is not negative'
    - 'Solve the quadratic for $u = \tan\theta$'
    - 'Take the inverse tangent of each root'
  explanation: |-
    $k$ is needed before the quadratic can be written with numbers. The discriminant tells whether any angle works before you try to solve; a negative one means the target is beyond the safety parabola. Each root is a value of $\tan\theta$, so the last step converts the roots to angles.
- id: phys-m2-r2-h12
  lesson: phys-m2-h-aiming
  type: match
  topic: Projectiles on slopes
  stem: 'Match each landing surface to the launch angle above horizontal that gives the greatest distance along it (no air resistance).'
  pairs:
    - [Level ground, 45°]
    - [Slope rising at 30°, 60°]
    - [Slope falling at 30°, 30°]
    - [Slope rising at 10°, 50°]
  distractors: [40°]
  explanation: |-
    The best angle is $45^\circ + \alpha/2$, with $\alpha$ positive uphill and negative downhill: $45^\circ$, $60^\circ$, $30^\circ$ and $50^\circ$. $40^\circ$ would be the best angle for a slope falling at $10^\circ$, which isn't listed.
- id: phys-m2-r2-h13
  lesson: phys-m2-h-aiming
  topic: Projectile targeting
  stem: 'Two launch angles at the same speed both hit a target. How do the two flights compare?'
  choices:
    - 'The lower-angle shot reaches the target sooner.'
    - 'The higher-angle shot reaches the target sooner.'
    - 'Both take the same time, since they cover the same horizontal distance.'
    - 'It depends on the mass of the projectile.'
  answer: 0
  explanation: |-
    The time to cover horizontal distance $x$ is $x/(v_0\cos\theta)$, and the lower angle has the larger $\cos\theta$, so it arrives sooner. In the lesson's firefighting example, 1.86 s at $36.1^\circ$ against 3.34 s at $63.3^\circ$. Mass doesn't enter projectile motion without air resistance.
- id: phys-m2-r2-h14
  lesson: phys-m2-h-aiming
  type: label
  topic: Projectiles on slopes
  stem: 'A projectile is launched from the bottom of a slope. Name the numbered parts.'
  image: {src: images/phys-m2-slope-launch-blank.svg, alt: 'A wedge-shaped hill rising to the right. From a point at its foot an arrow points up at a steeper angle than the slope, and a dashed curved path lands farther up the slope. Two arcs at the launch point start from the horizontal: a small one reaching the arrow and a larger one reaching the slope. The slope surface from launch to landing is highlighted. Five items are numbered.'}
  labels:
    - {x: 42.8, y: 67.3, text: Slope angle}
    - {x: 28.2, y: 74, text: Launch angle (from the horizontal)}
    - {x: 26.9, y: 50.1, text: Launch velocity}
    - {x: 49.7, y: 49.4, text: Distance along the slope}
    - {x: 38.8, y: 42, text: Trajectory (a parabola)}
  distractors: [Launch angle measured from the slope, Maximum height]
  explanation: |-
    Both angles are measured from the horizontal: the larger arc reaches the slope ($\alpha$, 1) and the smaller arc reaches the launch velocity ($\theta$, 2 and 3). The highlighted segment is $L$ (4), the distance the formulas give, and the dashed curve is the parabolic path (5). The angle between the launch velocity and the slope would be $\theta - \alpha$; it isn't marked.
- id: phys-m2-r2-h15
  lesson: phys-m2-h-aiming
  topic: Projectiles on slopes
  stem: 'Why does the best angle up a slope, $45^\circ + \alpha/2$, match the best angle for reaching a target with the least speed?'
  choices:
    - 'Because the slope cancels gravity''s component along it'
    - 'Because the farthest landing point on the slope lies on the safety parabola, reached by exactly one trajectory'
    - 'Because every projectile on a slope moves at its minimum speed'
    - 'Because both problems ignore the horizontal motion'
  answer: 1
  explanation: |-
    At a given speed, the farthest point you can reach on the slope is where the slope touches the safety parabola. Reaching a point on the safety parabola with speed $v_0$ is exactly the minimum-speed problem, so the same single angle, bisecting the vertical and the line to the point, appears. Gravity is not cancelled, and neither problem ignores horizontal motion.

# ---------- Honors: Curved paths ----------
- id: phys-m2-r2-h16
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'A car drives at a constant 15 m/s around a curve whose radius of curvature is 45 m. What are its tangential and normal accelerations?'
  choices:
    - '$a_t = 0$, $a_n = 5.0$ m/s²'
    - '$a_t = 5.0$ m/s², $a_n = 0$'
    - '$a_t = 0$, $a_n = 0.33$ m/s²'
    - '$a_t = 0$, $a_n = 0$'
  answer: 0
  explanation: |-
    Constant speed means $a_t = dv/dt = 0$. The normal part is $v^2/\rho = 225/45 = 5.0$ m/s², toward the center of curvature. 0.33 m/s² is $v/\rho$ without squaring $v$; zero acceleration would be true only on a straight road.
- id: phys-m2-r2-h17
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'At one instant a projectile has $\vec v = (6.0, 8.0)$ m/s and $\vec a = (0, -9.8)$ m/s². What is the radius of curvature of its path there?'
  choices:
    - '10.2 m'
    - '12.8 m'
    - '1.70 m'
    - '17.0 m'
  answer: 3
  explanation: |-
    $v = 10.0$ m/s and $|v_xa_y - v_ya_x| = |6.0(-9.8) - 0| = 58.8$, so $a_n = 58.8/10.0 = 5.88$ m/s² and $\rho = v^2/a_n = 100/5.88 = 17.0$ m. 10.2 m uses the whole $|\vec a| = 9.8$ instead of $a_n$; 12.8 m uses $|a_t| = 7.84$; 1.70 m divides $v$ rather than $v^2$ by $a_n$.
- id: phys-m2-r2-h18
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'Consider the very top of a projectile''s path, with air resistance negligible. Which statements are true? Select all that apply.'
  choices:
    - 'The tangential acceleration is zero.'
    - 'The normal acceleration equals $g$.'
    - 'The radius of curvature is $v_x^2/g$.'
    - 'The radius of curvature is larger there than anywhere else on the path.'
  answer: [0, 1, 2]
  explanation: |-
    At the top the velocity is horizontal and $\vec g$ points straight down, perpendicular to it: all of $g$ is normal acceleration and none is tangential. Then $\rho = v^2/a_n = v_x^2/g$. Since $\rho = v^3/(gv_x)$ and the speed is smallest at the top, the radius of curvature is smallest there, not largest: the path bends most sharply at the top.
- id: phys-m2-r2-h19
  lesson: phys-m2-h-curved-paths
  type: text
  topic: Curvilinear motion
  stem: 'The circle that best fits a curved path at a point, sharing its tangent and its curvature there, is called the ___ circle.'
  accept: [osculating, osculating circle, kissing, kissing circle]
  explanation: |-
    The osculating ("kissing") circle has radius equal to the radius of curvature $\rho$ and is centered at the center of curvature, on the inside of the bend along $\hat N$.
- id: phys-m2-r2-h20
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'An object moves at constant speed around a circle. Which is true?'
  choices:
    - 'Both $d|\vec v|/dt$ and $|d\vec v/dt|$ are zero.'
    - '$d|\vec v|/dt = 0$, but $|d\vec v/dt| = v^2/r$.'
    - '$|d\vec v/dt| = 0$, but $d|\vec v|/dt = v^2/r$.'
    - 'Both equal $v^2/r$.'
  answer: 1
  explanation: |-
    $d|\vec v|/dt$ is the rate of change of speed, the tangential acceleration, which is zero at constant speed. $|d\vec v/dt|$ is the size of the acceleration, here all normal: $v^2/r$. The two agree only for motion in a straight line.
- id: phys-m2-r2-h21
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'A car on a curve of radius 50 m is moving at 10 m/s and braking at 1.5 m/s². What is the magnitude of its acceleration?'
  choices:
    - '0.5 m/s²'
    - '2.5 m/s²'
    - '3.5 m/s²'
    - '2.0 m/s²'
  answer: 1
  explanation: |-
    $a_n = v^2/\rho = 100/50 = 2.0$ m/s² and $a_t = -1.5$ m/s². They are perpendicular, so $|\vec a| = \sqrt{2.0^2 + 1.5^2} = 2.5$ m/s². 3.5 and 0.5 add or subtract the components as numbers; 2.0 is the normal part alone.
- id: phys-m2-r2-h22
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'A ball is launched at 20 m/s, $60^\circ$ above horizontal. What is the radius of curvature of its path just after launch? Use $g = 9.8$ m/s².'
  choices:
    - '40.8 m'
    - '10.2 m'
    - '81.6 m'
    - '47.1 m'
  answer: 2
  explanation: |-
    At launch $a_n = g\cos\theta = 4.9$ m/s², so $\rho = v_0^2/a_n = 400/4.9 = 81.6$ m. 40.8 m uses all of $g$ as normal acceleration; 47.1 m uses $\cos 30^\circ$ instead of $\cos 60^\circ$; 10.2 m is the radius at the top, $v_x^2/g = 10^2/9.8$.
- id: phys-m2-r2-h23
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'A particle moves on $\vec r(t) = (3t^2)\,\hat\imath + (2t^3)\,\hat\jmath$ m. How far does it travel along its path from $t = 0$ to $t = 2$ s?'
  choices:
    - '20.4 m'
    - '20.0 m'
    - '22.4 m'
    - '10.2 m'
  answer: 0
  explanation: |-
    $|\vec v| = |(6t, 6t^2)| = 6t\sqrt{1 + t^2}$, so $s = \int_0^2 6t\sqrt{1 + t^2}\,dt = \big[2(1 + t^2)^{3/2}\big]_0^2 = 2(5^{3/2} - 1) = 20.4$ m. 20.0 m is the displacement's magnitude $|(12, 16)|$, which is shorter; 22.4 m forgets the lower limit; 10.2 m drops the factor 2 from the antiderivative.
- id: phys-m2-r2-h24
  lesson: phys-m2-h-curved-paths
  type: order
  topic: Curvilinear motion
  stem: 'Put the steps for finding the radius of curvature of a path $\vec r(t)$ at a given time in order.'
  items:
    - 'Differentiate $\vec r(t)$ to get $\vec v(t)$'
    - 'Differentiate $\vec v(t)$ to get $\vec a(t)$'
    - 'Evaluate $\vec v$ and $\vec a$ at the given time'
    - 'Compute $|v_xa_y - v_ya_x|$ and the speed $v$'
    - 'Divide $v^3$ by $|v_xa_y - v_ya_x|$'
  explanation: |-
    The acceleration comes from differentiating the velocity, so the derivatives come first, in that order. You need both vectors at the instant before you can form the cross-product term, and $\rho = v^3/|v_xa_y - v_ya_x|$ is the final step.
- id: phys-m2-r2-h25
  lesson: phys-m2-h-curved-paths
  type: match
  topic: Curvilinear motion
  stem: 'Match each quantity to its meaning.'
  pairs:
    - [Tangential acceleration, Rate of change of speed]
    - [Normal acceleration, Speed squared divided by the radius of curvature]
    - [Radius of curvature, Radius of the circle that best fits the path at a point]
    - [Arc length, Distance traveled along the path]
  distractors: [Straight-line distance from start to finish]
  explanation: |-
    $a_t = dv/dt$; $a_n = v^2/\rho$; $\rho$ is the radius of the osculating circle; $s = \int|\vec v|\,dt$. The straight-line distance from start to finish is the magnitude of the displacement, which is never more than the arc length.
- id: phys-m2-r2-h26
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'At some instant a particle''s velocity and acceleration are perpendicular. At that instant the particle is'
  choices:
    - 'momentarily at rest'
    - 'moving in a straight line'
    - 'neither speeding up nor slowing down'
    - 'slowing down as fast as possible'
  answer: 2
  explanation: |-
    Perpendicular means $\vec a\cdot\vec v = 0$, so $a_t = 0$: the speed is momentarily not changing, and all of the acceleration turns the particle. It can't be at rest (then $\vec v = 0$ and has no direction), and it can't be moving straight, since a nonzero normal acceleration bends the path.
- id: phys-m2-r2-h27
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'At one instant a particle has $\vec v = (4, -2)$ m/s and $\vec a = (-1, 3)$ m/s². What is happening to its speed?'
  choices:
    - 'It is increasing at 2.24 m/s².'
    - 'It is decreasing at 10 m/s².'
    - 'It is not changing.'
    - 'It is decreasing at 2.24 m/s².'
  answer: 3
  explanation: |-
    $a_t = \dfrac{\vec a\cdot\vec v}{v} = \dfrac{(4)(-1) + (-2)(3)}{\sqrt{20}} = \dfrac{-10}{4.47} = -2.24$ m/s². The negative sign means the speed is decreasing. 10 m/s² forgets to divide by $v$; the positive answer misses the sign.
- id: phys-m2-r2-h28
  lesson: phys-m2-h-curved-paths
  topic: Curvilinear motion
  stem: 'Which of these have a nonzero normal acceleration? Select all that apply.'
  choices:
    - 'A car at constant speed on a straight road'
    - 'A thrown ball at the top of its path'
    - 'A car braking to a stop on a straight road'
    - 'A runner speeding up around a curved track'
  answer: [1, 3]
  explanation: |-
    Normal acceleration means the direction of motion is changing. The ball at the top is turning from rising to falling ($a_n = g$), and the runner on the curve is turning. Both cars move in straight lines, so their normal acceleration is zero; the braking car has only tangential acceleration.
- id: phys-m2-r2-h29
  lesson: phys-m2-h-curved-paths
  type: label
  topic: Curvilinear motion
  stem: 'Name the numbered parts of this picture of a curved path at a point P.'
  image: {src: images/phys-m2-osculating-blank.svg, alt: 'A curved path shaped like an arch, with an arrowhead showing the direction of motion. At a point P on its left side, one arrow points along the path and a shorter arrow points toward the inside of the bend. A dashed circle touches the path at P, and a line runs from P to the circle''s center. Five items are numbered.'}
  labels:
    - {x: 49.3, y: 24.2, text: Unit tangent vector}
    - {x: 40.5, y: 38.4, text: Unit normal vector}
    - {x: 42.9, y: 47.8, text: Radius of curvature}
    - {x: 32.2, y: 69.1, text: Osculating circle}
    - {x: 66.7, y: 56.6, text: Path of the particle}
  distractors: [Displacement, Velocity of the center of curvature]
  explanation: |-
    The unit tangent (1) points along the path in the direction of motion; the unit normal (2) points toward the inside of the bend. The line from P to the center (3) is the radius of curvature $\rho$, the radius of the dashed osculating circle (4), which matches the path's tangent and curvature at P. The arch-shaped curve is the path itself (5).
