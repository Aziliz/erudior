  image: {src: images/phys-m4-raft-blank.svg, alt: 'Two scenes, before and after. Before: a stick figure stands at the left end of a raft. After: the figure stands at the right end and the raft has shifted left. A dashed vertical line crosses both scenes; an arrow points left and another points right between the scenes. Five numbered markers.'}
  labels:
