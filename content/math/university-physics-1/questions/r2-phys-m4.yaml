# Round 2: phys-m4 (Energy and momentum). Core: q01-q20. Honors: h01-h42.

# ---------- Lesson 11: Work and kinetic energy ----------
- id: phys-m4-r2-q01
  lesson: phys-work
  module_quiz: true
  topic: Work and kinetic energy
  type: label
  stem: 'A crate is dragged to the right across a rough floor by a rope. Name the numbered arrows.'
  image: {src: images/phys-m4-crate-forces-blank.svg, alt: 'A crate on a floor with five numbered arrows: 1 points up and to the right from the crate at an angle, 2 points left along the floor, 3 points straight up, 4 points straight down, and 5 is a long arrow to the right below the floor.'}
  labels:
    - {x: 68.5, y: 42.8, text: Rope force}
    - {x: 27.4, y: 64.2, text: Kinetic friction}
    - {x: 47.6, y: 32.9, text: Normal force}
    - {x: 45.2, y: 78.9, text: Weight}
    - {x: 75.8, y: 81.6, text: Displacement}
  distractors: [Static friction, Net force]
  explanation: |-
    The rope pulls along its own direction, up and to the right (1). Kinetic friction opposes the sliding, so it points left along the floor (2). The floor pushes up (normal force, 3) and gravity pulls down (weight, 4). Arrow 5 is the displacement, to the right. The rope does positive work, friction negative work, and the normal force and weight do no work because they are perpendicular to the displacement.

- id: phys-m4-r2-q02
  lesson: phys-work
  module_quiz: true
  topic: Work and kinetic energy
  type: text
  stem: 'A force $F(x) = 6x$ N ($x$ in m) acts on an object along the $x$ axis. The work it does as the object moves from $x = 0$ to $x = 2$ m is ___ J. Give only the number.'
  accept: ['12']
  explanation: |-
    The force varies with position, so integrate: $W = \int_0^2 6x\,dx = \left[3x^2\right]_0^2 = 12$ J. That is the triangle under the $F$–$x$ line, $\tfrac12(2)(12) = 12$ J. Using $W = Fd$ with the final force, $12(2) = 24$ J, would double it.

- id: phys-m4-r2-q03
  lesson: phys-work
  topic: Work and kinetic energy
  stem: 'Which forces do zero work on the object named? Select all that apply.'
  choices:
    - 'The normal force on a block sliding across a level floor'
    - 'The string tension on a ball whirled at constant speed in a horizontal circle'
    - 'Kinetic friction on a box sliding to a stop'
    - 'Gravity on a ball thrown straight up, while it rises'
    - 'Your hands'' upward force on a heavy bag you hold still'
  answer: [0, 1, 4]
  explanation: |-
    Work is $Fd\cos\theta$. The normal force and the tension are perpendicular to the motion ($\cos 90^\circ = 0$), and the bag you hold still has no displacement, so all three do zero work. Friction on the sliding box points opposite the motion (negative work), and gravity on the rising ball points opposite its upward motion (negative work, which is why it slows).

- id: phys-m4-r2-q04
  lesson: phys-work
  topic: Work and kinetic energy
  type: match
  stem: 'Match each force to the sign of the work it does.'
  pairs:
    - ['A rope pulling a sled forward along the snow', Positive]
    - ['Friction on a hockey puck sliding across ice', Negative]
    - ['The normal force on a car driving along a level road', Zero]
    - ['Gravity on an apple falling from a tree', Positive]
    - ['Gravity on a ball rising after it is thrown up', Negative]
  explanation: |-
    The sign follows the angle between force and displacement. The rope and gravity on the falling apple point along the motion (positive). Friction on the puck and gravity on the rising ball point against the motion (negative). The normal force on the car is perpendicular to its motion (zero).

- id: phys-m4-r2-q05
  lesson: phys-work
  topic: Work and kinetic energy
  stem: 'A force $F(x) = 3x^2 - 2x$ N acts along the $x$ axis. How much work does it do as an object moves from $x = 0$ to $x = 1$ m?'
  choices: ['$1$ J', '$0$ J', '$2$ J', '$-\tfrac{4}{27}$ J']
  answer: 1
  explanation: |-
    $W = \int_0^1 (3x^2 - 2x)\,dx = \left[x^3 - x^2\right]_0^1 = 0$ J. The force is negative for $x < \tfrac23$ m and positive after, and the two areas cancel exactly. $-\tfrac{4}{27}$ J is only the negative part (from 0 to $\tfrac23$); 2 J comes from a sign slip ($x^3 + x^2$); 1 J multiplies the force at $x = 1$ by the distance, as if the force were constant.

# ---------- Lesson 12: Potential energy, conservation, power ----------
- id: phys-m4-r2-q06
  lesson: phys-energy
  module_quiz: true
  topic: Conservation of energy
  type: label
  stem: 'The graph shows a potential energy curve $U(x)$ and a particle''s total energy $E$ (dashed line). Name the numbered features.'
  image: {src: images/phys-m4-energy-diagram-blank.svg, alt: 'A double-well potential energy curve with a dashed horizontal total energy line. Marker 1 is at the bottom of the left well, 2 at the top of the central hump, 3 where the curve meets the dashed line on the right, 4 on a vertical arrow from the curve up to the dashed line, and 5 in a shaded region beyond the right crossing point.'}
  labels:
    - {x: 28.9, y: 81.8, text: Stable equilibrium}
    - {x: 50.0, y: 61.1, text: Unstable equilibrium}
    - {x: 83.9, y: 30.2, text: Turning point}
    - {x: 39.5, y: 50.2, text: Kinetic energy at that position}
    - {x: 89.7, y: 18.8, text: Region the particle cannot reach}
  distractors: [Zero of potential energy, Total energy line]
  explanation: |-
    A minimum of $U$ is a stable equilibrium (1) and a maximum is unstable (2). Where the curve meets $E$ the kinetic energy is zero, so the particle stops and reverses: a turning point (3). The vertical gap from the curve up to $E$ is $K = E - U$ (4). Beyond a turning point $U > E$, which would need negative kinetic energy, so the particle can't be there (5).

- id: phys-m4-r2-q07
  lesson: phys-energy
  topic: Power
  type: order
  stem: 'An elevator motor lifts a car at constant speed. Put the steps for finding the electrical energy the motor draws during the trip in order.'
  items:
    - 'Find the cable tension: at constant speed it equals the weight $mg$'
    - 'Multiply the tension by the speed to get the output power $P = Tv$'
    - 'Divide the output power by the efficiency to get the input power'
    - 'Multiply the input power by the travel time to get the energy drawn'
  explanation: |-
    Each step uses the result of the one before: the tension gives the output power ($P = Tv$), the efficiency turns output power into input power ($P_{\text{in}} = P/\eta$), and power times time is energy.

- id: phys-m4-r2-q08
  lesson: phys-energy
  module_quiz: true
  topic: Power
  type: text
  stem: 'A space heater uses 2.5 kWh of energy. That is ___ MJ. Give only the number.'
  accept: ['9']
  explanation: |-
    $1\text{ kWh} = (1000\text{ W})(3600\text{ s}) = 3.6\times10^6$ J $= 3.6$ MJ, so $2.5(3.6) = 9.0$ MJ. A kilowatt-hour is an energy unit, not a power.

- id: phys-m4-r2-q09
  lesson: phys-energy
  topic: Conservation of energy
  stem: 'Which of these forces are conservative, so that a potential energy can describe them? Select all that apply.'
  choices: ['Gravity near Earth''s surface', 'The force of an ideal spring', 'Kinetic friction', 'Air drag', 'The push of a car''s engine through its wheels']
  answer: [0, 1]
  explanation: |-
    Gravity and an ideal spring do work that depends only on the endpoints, so they have potential energies $mgy$ and $\tfrac12kx^2$. Kinetic friction and drag always oppose the motion, so a longer path does more negative work. An engine's push is a nonconservative force: it adds energy from fuel, and its work goes in $W_{\text{nc}}$.

- id: phys-m4-r2-q10
  lesson: phys-energy
  topic: Power
  type: match
  stem: 'Match each quantity to its SI unit or the unit a utility bills it in.'
  pairs:
    - [Power, watt]
    - [Energy on an electric bill, kilowatt-hour]
    - [Work, joule]
    - [Spring constant, newton per meter]
  distractors: [newton-second]
  explanation: |-
    Power is in watts (J/s); utilities bill energy in kilowatt-hours ($3.6\times10^6$ J each); work, like all energy, is in joules; a spring constant is force per stretch, N/m. The newton-second is the unit of impulse.

