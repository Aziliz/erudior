# Round 2, module phys-m5 (Rotation and gravitation): new question types for the core lessons
# (phys-m5-r2-q01…) and the three honors lessons (phys-m5-r2-h01…).

# ---- Lesson 15: rotational kinematics and moment of inertia ----
- id: phys-m5-r2-q01
  lesson: phys-rot-kin
  type: label
  topic: Rotational kinematics
  stem: 'A disk turns counterclockwise and is slowing down. Name the numbered parts of the drawing.'
  image: {src: images/phys-m5-disk-kinematics-blank.svg, alt: 'A disk with a dot at its center, a radius drawn to a point on the rim, a thick arc along the rim from a dashed reference line to that point, and three arrows at the point: a long one tangent to the rim pointing counterclockwise, a short one tangent to the rim pointing clockwise, and one along the radius toward the center. Four parts are numbered.'}
  labels:
    - {x: 44.2, y: 52.3, text: Axis of rotation}
    - {x: 74.1, y: 43.5, text: 'Arc length s = rθ'}
    - {x: 37.6, y: 10.7, text: Velocity of the point}
    - {x: 51.1, y: 29.8, text: Centripetal acceleration}
  distractors: [Angular velocity, Lever arm]
  explanation: |-
    The axis (1) is the fixed center. The thick arc (2) is the distance the point has traveled along the rim, $s = r\theta$. The velocity (3) is tangent to the rim in the direction of rotation, with size $v = r\omega$. The arrow along the radius toward the axis (4) is the centripetal acceleration $r\omega^2$. (The short unnumbered arrow pointing backward along the rim is the tangential acceleration $r\alpha$, backward because the disk is slowing.) Angular velocity is shared by the whole disk and points along the axis, not along any arrow drawn here.
- id: phys-m5-r2-q02
  lesson: phys-rot-kin
  type: text
  module_quiz: true
  topic: Rotational kinematics
  stem: 'A wheel slows uniformly from 10 rev/s to rest in 4.0 s. It makes ___ revolutions while stopping. Give only the number.'
  accept: ['20', '20 rev', '20 revolutions']
  explanation: |-
    With constant angular acceleration the average rate is $\tfrac12(10 + 0) = 5$ rev/s, so $\Delta\theta = \tfrac12(\omega_0 + \omega)t = 5(4.0) = 20$ rev. Working in revolutions is fine here because no formula mixes $\omega$ with a length. (In radians: $\omega_0 = 62.8$ rad/s, $\Delta\theta = 125.7$ rad $= 20$ rev.)
- id: phys-m5-r2-q03
  lesson: phys-rot-kin
  type: match
  topic: Moment of inertia
  stem: 'Match each rotational quantity to its SI unit.'
  pairs:
    - [Angular velocity, rad/s]
    - [Angular acceleration, rad/s²]
    - [Moment of inertia, kg·m²]
    - [Rotational kinetic energy, J]
  distractors: [N·m/s]
  explanation: |-
    $\omega = d\theta/dt$ is in rad/s and $\alpha = d\omega/dt$ in rad/s². $I = \sum mr^2$ is a mass times a distance squared, kg·m². $\tfrac12I\omega^2$ has units kg·m²/s² = J (the radian is dimensionless). N·m/s is a unit of power (W), not one of these.
- id: phys-m5-r2-q04
  lesson: phys-rot-kin
  topic: Moment of inertia
  stem: 'Which of these change an object''s moment of inertia about an axis? Select all that apply.'
  choices: ['Moving the axis to a different place on the object', 'Moving some of its mass farther from the axis', 'Spinning the object faster', 'Adding mass to the object some distance from the axis']
  answer: [0, 1, 3]
  explanation: |-
    $I = \sum m_ir_i^2$ depends on how much mass there is and how far each piece is from the axis, so moving the axis, moving mass outward or adding mass off the axis all change it. The spin rate doesn't appear in $I$ at all: spinning faster raises $\omega$, $L$ and $K$, not $I$.
- id: phys-m5-r2-q05
  lesson: phys-rot-kin
  type: order
  topic: Moment of inertia
  stem: 'Each object has the same mass $M$ and radius $R$. Put them in order of moment of inertia about a central axis, smallest first.'
  items: ['Solid sphere', 'Solid disk (axis along its own axis)', 'Thin spherical shell', 'Thin hoop (axis perpendicular to its plane)']
  explanation: |-
    $I = cMR^2$ with $c = \tfrac25 = 0.40$ (solid sphere), $\tfrac12 = 0.50$ (solid disk), $\tfrac23 \approx 0.67$ (thin shell) and $1$ (hoop). The more of the mass that sits near the full radius $R$, the larger $I$; the hoop has all of it there.

# ---- Lesson 16: torque and rotational dynamics ----
- id: phys-m5-r2-q06
  lesson: phys-torque
  type: label
  topic: Torque
  stem: 'A force turns a bar about an axis (top view). Name the numbered parts.'
  image: {src: images/phys-m5-lever-arm-blank.svg, alt: 'A bar with a pivot at its left end. An arrow above the bar runs from the pivot to the bar''s right end. At the right end an arrow points up and to the right at an angle to the bar, and a dashed line extends that arrow''s line backward below the bar. A line from the pivot meets the dashed line at a right angle. Five parts are numbered.'}
  labels:
    - {x: 16.1, y: 51.1, text: Axis of rotation}
    - {x: 50.0, y: 41.3, text: Position vector r}
    - {x: 78.1, y: 32.8, text: Applied force}
    - {x: 58.9, y: 74.2, text: Line of action}
    - {x: 38.2, y: 67.0, text: Lever arm}
  distractors: [Torque vector]
  explanation: |-
    The bar turns about the axis (1). The position vector $\vec r$ (2) runs from the axis to the point where the force (3) is applied. Extending the force along its own direction gives its line of action (4), and the perpendicular distance from the axis to that line is the lever arm (5), $\ell = r\sin\theta$, so $\tau = \ell F$. The torque vector itself points out of the page (right-hand rule), so it isn't drawn in this top view.
- id: phys-m5-r2-q07
  lesson: phys-torque
  type: text
  module_quiz: true
  topic: Torque
  stem: 'A 40 N force is applied at the end of a 0.50 m wrench, at $30^\circ$ to the handle. The torque about the bolt is ___ N·m. Give only the number.'
  accept: ['10', '10 N·m', '10 N m', '10 Nm', '10 N*m', '10 N-m']
  explanation: |-
    $\tau = rF\sin\theta = 0.50(40)\sin 30^\circ = 0.50(40)(0.5) = 10$ N·m. Using $\cos 30^\circ$ would give 17.3 N·m, and a perpendicular push would give the maximum, 20 N·m.
- id: phys-m5-r2-q08
  lesson: phys-torque
  type: order
  topic: Torque
  stem: 'Each force acts horizontally on a door 0.80 m wide, hinged along one vertical edge. Put them in order of torque about the hinge, smallest first.'
  items: ['60 N at the outer edge, pushing straight toward the hinge', '30 N perpendicular to the door, 0.20 m from the hinge', '20 N perpendicular to the door, at the outer edge', '50 N at $30^\circ$ to the door, at the outer edge', '30 N perpendicular to the door, at the outer edge']
  explanation: |-
    $\tau = rF\sin\theta$: toward the hinge, $\theta = 0$, so $0$; $0.20(30) = 6$ N·m; $0.80(20) = 16$ N·m; $0.80(50)\sin 30^\circ = 20$ N·m; $0.80(30) = 24$ N·m. The biggest force (60 N) gives the smallest torque because it points at the axis.
- id: phys-m5-r2-q09
  lesson: phys-torque
  topic: Torque
  stem: 'Which forces exert zero torque about a given axis? Select all that apply.'
  choices: ['A force whose line of action passes through the axis', 'A force applied at the axis itself', 'A force parallel to the position vector from the axis to its point of application', 'A force perpendicular to the position vector, applied far from the axis']
  answer: [0, 1, 2]
  explanation: |-
    $\tau = rF\sin\theta = \ell F$. A line of action through the axis has lever arm $\ell = 0$; a force at the axis has $r = 0$; a force parallel (or antiparallel) to $\vec r$ has $\sin\theta = 0$. A perpendicular force far from the axis gives the largest torque, $rF$.
- id: phys-m5-r2-q10
  lesson: phys-torque
  type: match
  topic: Rotational dynamics
  stem: 'Match each rotational quantity or formula to its linear (translational) counterpart.'
  pairs:
    - ['$\tau$', Force]
    - ['$I$', Mass]
    - ['$L = I\omega$', Momentum p = mv]
    - ['$W = \tau\Delta\theta$', Work W = FΔx]
  distractors: [Acceleration]
  explanation: |-
    Torque plays the role of force ($\sum\tau = I\alpha$ mirrors $\sum F = ma$), moment of inertia the role of mass, angular momentum $I\omega$ the role of $mv$, and work by a torque through an angle mirrors work by a force through a distance. The counterpart of acceleration is $\alpha$, which isn't listed.

# ---- Lesson 17: rolling and angular momentum ----
- id: phys-m5-r2-q11
  lesson: phys-rolling
  type: label
  topic: Rolling motion
  stem: 'Rolling is built from two simpler motions. Name the numbered parts of the drawing.'
  image: {src: images/phys-m5-rolling-sum-blank.svg, alt: 'Three wheels in a row joined by a plus sign and an equals sign, with velocity arrows. The first wheel has equal arrows at its top, center and bottom. The second has an arrow forward at the top, none at the center and one backward at the bottom. The third has a long arrow at the top, a shorter one at the center and none at the bottom. Each wheel is numbered, and so are the top and bottom points of the third wheel.'}
  labels:
    - {x: 10.5, y: 31.8, text: Pure translation}
    - {x: 42.1, y: 31.8, text: Pure rotation about the center}
    - {x: 73.7, y: 31.8, text: Rolling without slipping}
    - {x: 78.9, y: 24.2, text: Point moving at 2v}
    - {x: 78.9, y: 66.7, text: Point momentarily at rest}
  distractors: [Point moving at v/2]
  explanation: |-
    In translation (1) every point moves at $v$. In rotation about the center (2) the top moves forward at $R\omega = v$ and the bottom backward at $v$. Adding them point by point gives rolling (3): the top moves at $v + v = 2v$ (4) and the contact point at $v - v = 0$ (5), which is what "without slipping" means.
- id: phys-m5-r2-q12
  lesson: phys-rolling
  type: text
  module_quiz: true
  topic: Rolling motion
  stem: 'For a thin hoop rolling without slipping, ___ of its kinetic energy is rotational. Give a fraction or a decimal.'
  accept: ['1/2', '0.5', '50%', 'half', 'one half', 'one-half']
  explanation: |-
    For a hoop $I = MR^2$, so $K_{\text{rot}} = \tfrac12MR^2\omega^2 = \tfrac12Mv^2 = K_{\text{trans}}$. The two parts are equal, so rotation holds $\dfrac{c}{1 + c} = \dfrac{1}{2}$ of the total.
- id: phys-m5-r2-q13
  lesson: phys-rolling
  type: match
  topic: Rolling motion
  stem: 'Rolling objects have $I_{\text{cm}} = cMR^2$. Match each object to its value of $c$ (central axis).'
  pairs:
    - [Thin hoop, '1']
    - [Solid cylinder, 1/2]
    - [Solid sphere, 2/5]
    - [Thin spherical shell, 2/3]
  distractors: [1/3]
  explanation: |-
    Hoop $MR^2$, solid cylinder $\tfrac12MR^2$, solid sphere $\tfrac25MR^2$, thin spherical shell $\tfrac23MR^2$. The value $\tfrac13$ belongs to a thin rod about one end ($\tfrac13ML^2$), which isn't a rolling shape.
- id: phys-m5-r2-q14
  lesson: phys-rolling
  module_quiz: true
  topic: Angular momentum
  stem: 'In which situations is angular momentum conserved about the stated axis? Select all that apply.'
  choices: ['A skater spinning on frictionless ice, about her vertical spin axis', 'Two disks on a frictionless axle that grab each other and spin together, about the axle', 'A planet orbiting the Sun, about the Sun', 'A spinning wheel being slowed by a brake pad, about its axle', 'A ball rolling down a ramp, about the ball''s center']
  answer: [0, 1, 2]
  explanation: |-
    Angular momentum is conserved when the net external torque about that axis is zero. The ice exerts no torque about the skater's axis; the disks' friction on each other is internal; gravity on a planet points at the Sun, so it has no lever arm. The brake pad's friction exerts an external torque on the wheel. On the ramp, friction at the contact point exerts a torque $fR$ about the center, which is exactly what spins the ball up as it goes faster.
- id: phys-m5-r2-q15
  lesson: phys-rolling
  type: order
  topic: Rolling motion
  stem: 'Each object starts from rest at the same height on the same ramp. Put them in order of speed at the bottom, fastest first. (The block slides without friction; the others roll without slipping.)'
  items: ['Block', 'Solid sphere', 'Solid cylinder', 'Thin spherical shell', 'Thin hoop']
  explanation: |-
    $v = \sqrt{2gh/(1 + c)}$ with $c = 0$ (block, no rotation), $0.40$, $0.50$, $0.67$ and $1$. The smaller the share of energy tied up in rotation, the faster the object goes. Mass and radius cancel.

# ---- Lesson 18: static equilibrium ----
- id: phys-m5-r2-q16
  lesson: phys-equilibrium
  type: label
  topic: Static equilibrium
  stem: 'This is the free-body diagram of a beam hinged to a wall, held by a cable, with a sign hanging from its end. Name the numbered forces.'
  image: {src: images/phys-m5-hinged-beam-blank.svg, alt: 'A horizontal beam hinged to a wall at the left, with a cable from its right end up to the wall and a box labeled SIGN hanging below the right end. Five force arrows are numbered: one along the cable toward the wall, one pointing down from the middle of the beam, one pointing down beside the sign, one pointing horizontally away from the wall at the hinge, and one pointing up at the hinge.'}
  labels:
    - {x: 56.8, y: 47.7, text: Cable tension}
    - {x: 40.3, y: 70.9, text: Weight of the beam}
    - {x: 74.2, y: 76.7, text: Weight of the sign}
    - {x: 21.8, y: 67.4, text: Hinge force (horizontal part)}
    - {x: 14.8, y: 74.4, text: Hinge force (vertical part)}
  distractors: [Normal force from the floor]
  explanation: |-
    The cable can only pull along itself, so its tension (1) points along the cable toward the wall. The uniform beam's weight (2) acts at its middle and the sign's weight (3) at the end where it hangs. The hinge can push in any direction, so its force is drawn as a horizontal part (4), pushing the beam away from the wall to balance the cable's pull toward it, and a vertical part (5). Nothing touches a floor here.
- id: phys-m5-r2-q17
  lesson: phys-equilibrium
  type: text
  module_quiz: true
  topic: Static equilibrium
  stem: 'A uniform seesaw is pivoted at its center. A 40 kg child sits 1.5 m from the pivot. To balance, a 60 kg child must sit ___ m from the pivot on the other side. Give only the number.'
  accept: ['1', '1.0', '1 m', '1.0 m']
  explanation: |-
    Torques about the pivot balance: $40g(1.5) = 60g\,x$, so $x = 60/60 = 1.0$ m. The heavier child sits closer to the pivot.
- id: phys-m5-r2-q18
  lesson: phys-equilibrium
  type: order
  topic: Static equilibrium
  stem: 'A uniform horizontal beam is hinged at a wall and held by a cable from its far end. Put these cable angles (measured from the beam) in order of cable tension, largest first.'
  items: ['$15^\circ$', '$30^\circ$', '$45^\circ$', '$60^\circ$']
  explanation: |-
    Torques about the hinge: $T\sin\theta\cdot L = W\cdot\tfrac L2$, so $T = \dfrac{W}{2\sin\theta}$. Smaller angles have smaller $\sin\theta$ and need more tension: $1.93W$, $W$, $0.71W$ and $0.58W$.
- id: phys-m5-r2-q19
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'Which statements are true for every rigid object in static equilibrium? Select all that apply.'
  choices: ['The net force on it is zero', 'The net torque on it is zero about every point', 'Every individual force on it is zero', 'The net torque is zero only about its center of mass', 'Its center of mass is at rest']
  answer: [0, 1, 4]
  explanation: |-
    Static equilibrium means at rest and staying at rest: $\sum\vec F = 0$, and with zero net force the net torque is the same about every point, so it is zero about every point. The individual forces need not be zero (a shelf bracket carries large forces); they just cancel.
- id: phys-m5-r2-q20
  lesson: phys-equilibrium
  type: match
  topic: Elasticity
  stem: 'Match each elastic modulus to the deformation it describes.'
  pairs:
    - [Young's modulus, Stretching or compressing a rod along its length]
    - [Shear modulus, Sliding one face sideways relative to the opposite face]
    - [Bulk modulus, Squeezing from all sides with added pressure]
  distractors: [Expanding when heated]
  explanation: |-
    $F/A = Y\,\Delta L/L$ (tension or compression along a length), $F/A = S\,\Delta x/L$ (shear, force parallel to a face) and $\Delta P = -B\,\Delta V/V$ (uniform squeezing). Thermal expansion is described by a coefficient of expansion, not an elastic modulus.

# ---- Lesson 19: gravitation and orbits ----
- id: phys-m5-r2-q21
  lesson: phys-gravitation
  type: label
  topic: Orbits
  stem: 'Name the numbered parts of this elliptical orbit.'
  image: {src: images/phys-m5-kepler-ellipse-blank.svg, alt: 'An ellipse with a large yellow circle on the long axis right of center and a small open circle the same distance left of center. Two shaded wedges spread from the yellow circle, a short wide one to the near end of the ellipse and a long thin one to the far end. A bracket above runs from the center to the right end. Five points are numbered.'}
  labels:
    - {x: 70.8, y: 50.4, text: Sun (at one focus)}
    - {x: 29.2, y: 50.4, text: Empty focus}
    - {x: 84.7, y: 50.4, text: Perihelion}
    - {x: 15.3, y: 50.4, text: Aphelion}
    - {x: 58.7, y: 7.7, text: Semimajor axis}
  distractors: [Center of the ellipse]
  explanation: |-
    Kepler's first law puts the Sun at one focus (1); the other focus (2) is empty, the same distance on the other side of the center (the center itself is halfway between them and isn't numbered). The nearest point to the Sun is perihelion (3) and the farthest is aphelion (4). The semimajor axis (5) is half the long axis; it sets the period through $T^2 \propto a^3$. The two shaded wedges have equal areas, swept in equal times.
- id: phys-m5-r2-q22
  lesson: phys-gravitation
  type: text
  module_quiz: true
  topic: Gravitation
  stem: 'A planet has the same mass as Earth but half its radius. Its surface gravity is ___ times Earth''s. Give only the number.'
  accept: ['4', 'four', '4 times', '4x', '4×']
  explanation: |-
    $g = GM/R^2$. Same $M$ and $R \to R/2$ gives $g \to GM/(R/2)^2 = 4\,GM/R^2$: four times as large.
- id: phys-m5-r2-q23
  lesson: phys-gravitation
  type: order
  topic: Orbits
  stem: 'Put these Earth satellites in order of orbital period, shortest first.'
  items: ['The International Space Station (about 400 km up)', 'A GPS satellite (about 20 200 km up)', 'A geostationary satellite (about 35 800 km up)', 'The Moon (about 384 000 km away)']
  explanation: |-
    Kepler's third law: $T^2 \propto r^3$, so a larger orbit always has a longer period. The ISS takes about 92 min, a GPS satellite about 12 h, a geostationary satellite 24 h (by design) and the Moon about 27 days.
- id: phys-m5-r2-q24
  lesson: phys-gravitation
  module_quiz: true
  topic: Orbits
  stem: 'A satellite is in a circular orbit with total mechanical energy $E$. Which statements are true? Select all that apply.'
  choices: ['Its kinetic energy is $-E$', 'Its potential energy is $2E$', 'Its orbital speed doesn''t depend on its own mass', 'A lower circular orbit would have a longer period', 'Its total energy $E$ is positive']
  answer: [0, 1, 2]
  explanation: |-
    $K = \dfrac{GMm}{2r}$, $U = -\dfrac{GMm}{r}$ and $E = -\dfrac{GMm}{2r}$, so $K = -E$ and $U = 2E$. $v = \sqrt{GM/r}$ has no $m$ in it. A lower orbit is faster and shorter, so its period is shorter, and $E$ is negative because the satellite is bound.
- id: phys-m5-r2-q25
  lesson: phys-gravitation
  type: match
  topic: Orbits
  stem: 'Match each of Kepler''s laws to the physics that explains it.'
  pairs:
    - [First law (orbits are ellipses), An inverse-square attractive force gives conic-section paths]
    - [Second law (equal areas in equal times), Gravity exerts no torque about the Sun so angular momentum is conserved]
    - ['Third law ($T^2 \propto a^3$)', Setting the gravitational force equal to the centripetal force]
  distractors: [Conservation of the planet's linear momentum]
  explanation: |-
    Newton showed that an inverse-square force produces conic-section orbits (first law). Gravity points toward the Sun, so the planet's angular momentum about the Sun is constant and the swept area per unit time, $L/2m$, is too (second law). For a circular orbit, $GMm/r^2 = mv^2/r$ with $v = 2\pi r/T$ gives $T^2 = (4\pi^2/GM)r^3$ (third law). A planet's linear momentum is not conserved: its direction changes all the time because gravity acts on it.

# ---- Honors 19h1: skidding, rolling and the sweet spot ----
- id: phys-m5-r2-h01
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A bowling ball is released sliding along a level lane with no spin. While it slides, kinetic friction on it points'
  choices: ['forward, in the direction of motion', 'backward, opposite the sliding of the contact point', 'nowhere: there is no friction until it rolls', 'straight up, like the normal force']
  answer: 1
  explanation: |-
    The slip velocity $v_{\text{cm}} - R\omega$ starts at $v_0 > 0$: the contact point slides forward, so kinetic friction points backward. It slows the center and, acting below the center, spins the ball up. Friction acts as long as the contact point slides; it is parallel to the floor, not perpendicular.
- id: phys-m5-r2-h02
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A uniform solid ball is launched along a level floor at 7.0 m/s with no spin. What is its speed once it rolls without slipping?'
  choices: ['7.0 m/s', '5.9 m/s', '2.0 m/s', '5.0 m/s']
  answer: 3
  explanation: |-
    Angular momentum about a point on the floor is conserved: $Mv_0R = (1 + c)Mv_fR$, so $v_f = v_0/(1 + c) = 7.0/1.4 = 5.0$ m/s. 7.0 m/s ignores friction; 5.9 m/s ($7.0/\sqrt{1.4}$) wrongly assumes kinetic energy is conserved, but sliding friction turns some into heat; 2.0 m/s is the fraction lost, $\tfrac27$, times 7.0.
- id: phys-m5-r2-h03
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A uniform solid ball is launched along a level floor at 7.0 m/s with no spin. The coefficient of kinetic friction is 0.20. How long does it slide before it rolls without slipping? ($g = 9.8$ m/s²)'
  choices: ['1.0 s', '3.6 s', '1.4 s', '2.6 s']
  answer: 0
  explanation: |-
    $t^* = \dfrac{c\,v_0}{(1 + c)\mu_kg} = \dfrac{0.4(7.0)}{1.4(0.20)(9.8)} = 1.02$ s. 3.6 s is $v_0/(\mu_kg)$, the time to stop if friction only slowed the ball; 1.4 s leaves out the $(1 + c)$; 2.6 s leaves out the $c$.
- id: phys-m5-r2-h04
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A uniform solid cylinder is launched along a level floor with no spin. What fraction of its initial kinetic energy is lost to kinetic friction before it rolls?'
  choices: ['1/2', '1/3', '2/7', '2/3']
  answer: 1
  explanation: |-
    The lost fraction is $\dfrac{c}{1 + c} = \dfrac{0.5}{1.5} = \dfrac13$, whatever $\mu_k$ is. 1/2 is the hoop's ($c = 1$); 2/7 is the solid sphere's; 2/3 is the fraction kept.
- id: phys-m5-r2-h05
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'Why is the angular momentum of a skidding ball conserved about a fixed point $P$ on the floor (on the line along which it touches the floor)?'
  choices: ['Because kinetic friction is too small to matter', 'Because the ball''s center moves in a straight line', 'Because friction acts along the floor through $P$, and the torques of the weight and the normal force about $P$ cancel', 'Because angular momentum is always conserved about the center of mass']
  answer: 2
  explanation: |-
    Friction lies along the floor line through $P$, so its lever arm about $P$ is zero. The weight and the normal force are equal, opposite and act along the same vertical line, so their torques about $P$ cancel. Friction is not negligible (it changes $v$ and $\omega$), and about the center of mass it has a lever arm $R$, so angular momentum about the center is not conserved.
- id: phys-m5-r2-h06
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A thin hoop is launched along a level floor at 2.0 m/s with backspin such that $R|\omega_0| = 3.0$ m/s. What is its velocity once it rolls without slipping (forward positive)?'
  choices: ['+0.50 m/s', '+2.5 m/s', '−1.0 m/s', '−0.50 m/s']
  answer: 3
  explanation: |-
    $v_f = \dfrac{v_0 + cR\omega_0}{1 + c} = \dfrac{2.0 + 1(-3.0)}{2} = -0.50$ m/s: it comes back. +0.50 m/s drops the sign; +2.5 m/s treats the backspin as topspin; −1.0 m/s forgets to divide by $1 + c$.
- id: phys-m5-r2-h07
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A uniform rod 1.2 m long is held at one end and struck at right angles. How far from the hand is its center of percussion?'
  choices: ['0.40 m', '0.60 m', '0.80 m', '1.2 m']
  answer: 2
  explanation: |-
    $b = \dfrac{I_P}{Md} = \dfrac{\tfrac13ML^2}{M(L/2)} = \tfrac23L = 0.80$ m. 0.60 m is the center of mass; a blow there pushes the whole rod sideways and jolts the hand. 0.40 m is $L/3$; 1.2 m is the far end.
- id: phys-m5-r2-h08
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A uniform solid billiard ball of radius $R$ is struck with a horizontal cue. At what height above the table must it be hit to roll at once, with no sliding?'
  choices: ['$1.4R$', '$R$', '$0.4R$', '$2R$']
  answer: 0
  explanation: |-
    Rolling at once needs $v = R\omega$ with $v = J/M$ and $\omega = J(b - R)/(\tfrac25MR^2)$, giving $b = (1 + c)R = 1.4R$, that is $0.4R$ above the center. At $R$ (the center) the ball starts with no spin and slides; $0.4R$ is the height above the center, not above the table; $2R$ is the top of the ball, which gives too much topspin.
- id: phys-m5-r2-h09
  lesson: phys-m5-h-skidding
  type: text
  topic: Rolling with slipping
  stem: 'A thin hoop is launched along a level floor at 6.0 m/s with no spin. Once it rolls without slipping its speed is ___ m/s. Give only the number.'
  accept: ['3', '3.0', '3 m/s', '3.0 m/s']
  explanation: |-
    $v_f = v_0/(1 + c) = 6.0/2 = 3.0$ m/s, independent of the friction coefficient.
- id: phys-m5-r2-h10
  lesson: phys-m5-h-skidding
  type: text
  topic: Rolling with slipping
  stem: 'A uniform solid sphere launched with no spin loses ___ of its kinetic energy to friction before it starts rolling. Give a fraction.'
  accept: ['2/7', '0.286', '0.29', '28.6%', '29%']
  explanation: |-
    The fraction kept is $\dfrac{(1 + c)v_f^2}{v_0^2} = \dfrac{1}{1 + c} = \dfrac57$, so $\dfrac{c}{1 + c} = \dfrac{0.4}{1.4} = \dfrac27 \approx 0.286$ is lost.
- id: phys-m5-r2-h11
  lesson: phys-m5-h-skidding
  type: order
  topic: Rolling with slipping
  stem: 'Each object is launched along a level floor at the same speed with no spin. Put them in order of their final rolling speed, fastest first.'
  items: ['Solid sphere', 'Solid cylinder', 'Thin spherical shell', 'Thin hoop']
  explanation: |-
    $v_f = v_0/(1 + c)$: $\tfrac{1}{1.4} = 0.71v_0$ (sphere), $\tfrac{1}{1.5} = 0.67v_0$ (cylinder), $\tfrac{1}{1.67} = 0.60v_0$ (shell), $\tfrac12v_0$ (hoop). The more inertia an object has for spinning, the more forward speed it gives up to spin up.
- id: phys-m5-r2-h12
  lesson: phys-m5-h-skidding
  type: match
  topic: Rolling with slipping
  stem: 'A ball is launched along a level floor (forward positive, $I = cMR^2$). Match each starting condition to what happens.'
  pairs:
    - ['$v_0 > 0$, no spin', Slows and spins up then rolls forward more slowly]
    - ['$v_0 = R\omega_0$', Rolls on at constant speed with no kinetic friction]
    - ['Backspin with $cR|\omega_0| > v_0$', Stops and then rolls back toward the start]
    - ['Backspin with $cR|\omega_0| = v_0$', Comes to rest with no spin and stays there]
  explanation: |-
    All four follow from $v_f = \dfrac{v_0 + cR\omega_0}{1 + c}$ with $\omega_0$ negative for backspin. No spin: $v_f = v_0/(1 + c)$. Already rolling: no slip, so no kinetic friction. Strong backspin makes $v_f$ negative. Backspin exactly $v_0/(cR)$ makes $v_f = 0$, and since $\omega_f = v_f/R$, the spin is zero too.
- id: phys-m5-r2-h13
  lesson: phys-m5-h-skidding
  type: label
  topic: Rolling with slipping
  stem: 'A ball slides to the right with too little spin. Name the numbered parts of the drawing.'
  image: {src: images/phys-m5-skid-blank.svg, alt: 'A ball on a level floor. An arrow points right from its center; a curved arrow near its top shows clockwise spin; an arrow points left along the floor from the contact point; an arrow points down from the center; and an arrow points up to the contact point from below. Five parts are numbered.'}
  labels:
    - {x: 34.6, y: 73.7, text: Kinetic friction}
    - {x: 61.5, y: 47.4, text: Velocity of the center}
    - {x: 46.2, y: 31.1, text: Spin in the rolling sense}
    - {x: 46.2, y: 85.5, text: Normal force}
    - {x: 47.3, y: 59.2, text: Weight}
  distractors: [Static friction]
  explanation: |-
    The contact point slides forward, so kinetic friction (1) points backward along the floor. The center moves to the right (2), and the ball spins clockwise (3), the rolling sense for rightward motion, though not yet fast enough to roll. The floor pushes up at the contact point (4) and gravity pulls down at the center (5). Friction here is kinetic, not static, because the contact point is sliding.
- id: phys-m5-r2-h14
  lesson: phys-m5-h-skidding
  topic: Rolling with slipping
  stem: 'A ball is launched with no spin along a level floor. Which of these do NOT depend on the coefficient of kinetic friction? Select all that apply.'
  choices: ['Its final rolling speed', 'The fraction of its kinetic energy lost', 'The time it spends sliding', 'The distance it slides']
  answer: [0, 1]
  explanation: |-
    $v_f = v_0/(1 + c)$ and the lost fraction $c/(1 + c)$ contain no $\mu_k$; they follow from conservation of angular momentum about a floor point. The sliding time $t^* = cv_0/[(1 + c)\mu_kg]$ and the sliding distance both scale as $1/\mu_k$: a slicker floor means longer sliding, but the same final state.

# ---- Honors 19h2: gyroscopes ----
- id: phys-m5-r2-h15
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A gyroscope''s 0.20 kg rotor has $I = 4.0\times10^{-4}$ kg·m² and spins at 250 rad/s. Its center of mass is 5.0 cm from the pivot and its axle is horizontal. What is its precession rate? ($g = 9.8$ m/s²)'
  choices: ['0.098 rad/s', '0.98 rad/s', '0.10 rad/s', '1.02 rad/s']
  answer: 1
  explanation: |-
    $L = I\omega = 4.0\times10^{-4}(250) = 0.10$ kg·m²/s and $\tau = Mgr = 0.20(9.8)(0.050) = 0.098$ N·m, so $\Omega = \tau/L = 0.98$ rad/s. 0.098 is the torque itself; 0.10 leaves out $g$ (uses $Mr$ for the torque); 1.02 is $L/\tau$, upside down.
- id: phys-m5-r2-h16
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A gyroscope precesses at rate $\Omega$. If its spin rate is doubled (same torque), its precession rate becomes'
  choices: ['$2\Omega$', '$4\Omega$', '$\Omega/2$', '$\Omega$, unchanged']
  answer: 2
  explanation: |-
    $\Omega = \tau/(I\omega)$: doubling $\omega$ doubles $L$, and the same torque swings a twice-as-long $\vec L$ half as fast. That is why a top precesses faster as it slows down.
- id: phys-m5-r2-h17
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A spinning top precesses with its axis tilted at angle $\theta$ from the vertical. How does its precession rate depend on $\theta$ (in the gyroscopic approximation)?'
  choices: ['It doesn''t: the rate is the same at any tilt', 'It is proportional to $\sin\theta$', 'It is proportional to $1/\sin\theta$', 'It is zero unless $\theta = 90^\circ$']
  answer: 0
  explanation: |-
    The torque is $Mgr\sin\theta$, but only the horizontal part of $\vec L$, $L\sin\theta$, swings around. $\Omega = \dfrac{Mgr\sin\theta}{L\sin\theta} = \dfrac{Mgr}{I\omega}$: the $\sin\theta$ cancels.
- id: phys-m5-r2-h18
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A gyroscope''s pivot is at the origin, its axle points along $+x$ and its spin angular momentum is along $+x$; $z$ is up. In which direction does the free end of the axle start to move?'
  choices: ['$-z$ (it falls)', '$+x$ (it slides outward)', '$-y$', '$+y$']
  answer: 3
  explanation: |-
    Gravity acts at $(r, 0, 0)$: $\vec\tau = r\hat\imath\times(-Mg\hat k) = Mgr\,\hat\jmath$. Since $d\vec L = \vec\tau\,dt$, the tip of $\vec L$, and the axle with it, moves toward $+y$: counterclockwise seen from above. It doesn't fall (to first order), and $-y$ would be the direction for the opposite spin.
- id: phys-m5-r2-h19
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A fast gyroscope is released with its axle horizontal and held still. What happens in the first moments?'
  choices: ['It starts precessing at full rate instantly, with no other motion', 'It falls straight down until the spin stops', 'Its axle dips slightly and bobs up and down (nutation) while it settles into precession', 'It rises above the horizontal and stays there']
  answer: 2
  explanation: |-
    It can't be precessing at the moment of release, so it begins to fall; that motion swings $\vec L$ sideways, and the axle settles into precession while bobbing about the steady path. For a fast rotor the dip and the bobs are small, and pivot friction damps them. The small dip also supplies the kinetic energy of the precession.
- id: phys-m5-r2-h20
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'What causes the precession of Earth''s rotation axis (period about 26,000 years)?'
  choices: ['The Sun''s and Moon''s gravity acting on Earth''s equatorial bulge', 'Friction between Earth''s core and mantle', 'The pressure of sunlight on Earth''s day side', 'Earth''s elliptical orbit around the Sun']
  answer: 0
  explanation: |-
    Earth's spin makes it bulge at the equator. The Sun and Moon pull harder on the nearer part of the tilted bulge, producing a torque that tends to line the equator up with the orbital plane. As for a top, that torque makes the spin axis precess instead of tipping it. Hipparchus discovered the effect in the 2nd century BCE.
- id: phys-m5-r2-h21
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'Two 0.20 kg masses are 0.10 m from the center of a light rod mounted on a shaft at $\beta = 60^\circ$ to the shaft. The shaft turns at 30 rad/s. What torque must the bearings supply?'
  choices: ['3.1 N·m', '1.8 N·m', '1.6 N·m', '0.052 N·m']
  answer: 2
  explanation: |-
    $\tau = \omega L_\perp = 2ma^2\omega^2\sin\beta\cos\beta = 2(0.20)(0.10)^2(30)^2\sin 60^\circ\cos 60^\circ = 1.56$ N·m. 3.1 N·m leaves out $\cos\beta$; 1.8 N·m leaves out $\sin\beta$; 0.052 N·m uses $\omega$ instead of $\omega^2$ (that is $L_\perp$ itself, in kg·m²/s).
- id: phys-m5-r2-h22
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'A student on a freely turning stool (student and stool $I = 2.5$ kg·m², initially at rest) holds a bicycle wheel ($I = 0.10$ kg·m²) spinning at 15 rad/s with its axle vertical. She flips the wheel upside down. How fast does she then turn?'
  choices: ['0.60 rad/s', '1.2 rad/s', '0', '2.4 rad/s']
  answer: 1
  explanation: |-
    Vertical angular momentum is conserved: $0.10(15) = 1.5$ up before. After, the wheel has $1.5$ down, so she must have $3.0$ up: $\omega = 3.0/2.5 = 1.2$ rad/s. 0.60 rad/s forgets that the wheel's angular momentum reverses (a change of $2L$, not $L$); 2.4 rad/s doubles it again.
- id: phys-m5-r2-h23
  lesson: phys-m5-h-gyroscopes
  type: text
  topic: Gyroscopes
  stem: 'A gyroscope precesses at 0.50 rad/s. If its spin rate is tripled and the torque stays the same, it precesses at ___ rad/s. Give a fraction or a decimal.'
  accept: ['1/6', '0.167', '0.1667', '0.17']
  explanation: |-
    $\Omega = \tau/(I\omega)$ is inversely proportional to the spin rate: $0.50/3 = 1/6 \approx 0.167$ rad/s.
- id: phys-m5-r2-h24
  lesson: phys-m5-h-gyroscopes
  type: text
  topic: Gyroscopes
  stem: 'The small up-and-down bobbing of a gyroscope''s axle on top of its steady precession is called ___.'
  accept: [nutation, nutations]
  explanation: |-
    Nutation appears when the gyroscope is released from rest or disturbed; for a fast rotor it is small and quick, and friction damps it out.
- id: phys-m5-r2-h25
  lesson: phys-m5-h-gyroscopes
  type: match
  topic: Gyroscopes
  stem: 'Match each term to its description.'
  pairs:
    - [Precession, Slow turning of a spin axis caused by a torque]
    - [Nutation, Bobbing of the axis about its steady precession]
    - [Principal axis, An axis about which angular momentum is parallel to angular velocity]
    - [Dynamic balancing, Lining up a principal axis with the axle]
  distractors: [Putting the center of mass on the axle]
  explanation: |-
    Precession is the steady swing of $\vec L$ under a perpendicular torque; nutation is the bobbing on top of it. About a principal axis, $\vec L \parallel \vec\omega$, so spinning needs no bearing torque. Dynamic balancing aligns a principal axis with the axle; putting the center of mass on the axle is static balancing, a different (and also necessary) step.
- id: phys-m5-r2-h26
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'Which changes make a precessing top precess faster? Select all that apply.'
  choices: ['Spinning it more slowly', 'Moving its center of mass farther from the pivot', 'Making the rotor twice as heavy, same shape, size and spin', 'Tilting its axis further from vertical', 'Moving the rotor''s mass toward its rim, same total mass and spin']
  answer: [0, 1]
  explanation: |-
    $\Omega = Mgr/(I\omega)$. A slower spin or a larger $r$ increases $\Omega$. Doubling the mass doubles both the torque and $I$, so $\Omega$ doesn't change. The tilt cancels out. Moving mass to the rim increases $I$, so $\Omega$ decreases.
- id: phys-m5-r2-h27
  lesson: phys-m5-h-gyroscopes
  type: label
  topic: Gyroscopes
  stem: 'A gyroscope precesses on a pivot. Name the numbered parts.'
  image: {src: images/phys-m5-gyroscope-blank.svg, alt: 'A gyroscope drawn in perspective: a vertical post with its top as the pivot, a horizontal axle from the pivot to a spinning disk, an arrow continuing along the axle beyond the disk, an arrow pointing down from the disk''s center, an arrow at the end of the axle arrow pointing sideways into the page, and a curved arrow circling above the post. Five parts are numbered.'}
  labels:
    - {x: 76.6, y: 59.8, text: Spin angular momentum}
    - {x: 56.2, y: 74.4, text: Weight}
    - {x: 89.5, y: 53.5, text: Torque about the pivot}
    - {x: 29.7, y: 59.8, text: Pivot}
    - {x: 37.1, y: 23.5, text: Precession of the axle}
  distractors: [Centrifugal force]
  explanation: |-
    $\vec L$ (1) points along the spinning axle. The weight (2) acts at the rotor's center, and its torque about the pivot (4) is horizontal and perpendicular to the axle (3). Since $d\vec L = \vec\tau\,dt$, the end of $\vec L$ moves in the direction of the torque, so the axle precesses around the vertical (5). No centrifugal force is needed in this explanation.
- id: phys-m5-r2-h28
  lesson: phys-m5-h-gyroscopes
  topic: Gyroscopes
  stem: 'Which statement about why a moving bicycle stays upright is best supported by experiments?'
  choices: ['Only the wheels'' gyroscopic effect keeps it up', 'A bicycle can be self-stable even with the wheels'' spin angular momentum canceled', 'Bicycles cannot balance at all without a rider', 'Stability comes only from the wheels being thin']
  answer: 1
  explanation: |-
    In 2011 Kooijman and coworkers built a riderless bicycle whose wheels' spin angular momentum was canceled by counter-rotating wheels, and it still steered itself upright. Gyroscopic effects contribute in ordinary bicycles, but stability comes from several interacting design features (steering geometry, mass placement), and riderless bicycles can be self-stable at suitable speeds.

# ---- Honors 19h3: shell theorem, gravity inside a planet, tides ----
- id: phys-m5-r2-h29
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'A small mass is placed somewhere inside a thin, uniform spherical shell, not at its center. The net gravitational force on it from the shell is'
  choices: ['toward the nearest part of the shell', 'toward the center of the shell', 'zero', 'toward the farthest part of the shell']
  answer: 2
  explanation: |-
    Inside the shell the potential is the constant $-GM/R$, so its slope, and therefore the force, is zero everywhere inside. The nearby part of the shell pulls harder but contains less mass in the matching direction; the two effects cancel exactly for an inverse-square force.
- id: phys-m5-r2-h30
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'Inside a uniform planet with surface gravity 9.8 m/s², what is $g$ halfway to the center ($r = R/2$)?'
  choices: ['2.45 m/s²', '19.6 m/s²', '39.2 m/s²', '4.9 m/s²']
  answer: 3
  explanation: |-
    Only the mass inside $r$ counts, $M(r) = M(r/R)^3$, so $g = g_s\,r/R = 9.8/2 = 4.9$ m/s². 39.2 m/s² applies the outside rule $1/r^2$ inside the planet; 2.45 m/s² uses $(r/R)^2$; 19.6 m/s² uses $1/r$.
- id: phys-m5-r2-h31
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'A frictionless tunnel runs straight through the center of a uniform planet with $R = 3.39\times10^6$ m and surface gravity 3.7 m/s². How long does an object dropped in at one end take to reach the other end?'
  choices: ['50 min', '100 min', '16 min', '42 min']
  answer: 0
  explanation: |-
    The motion is simple harmonic with $\omega = \sqrt{g_s/R}$ and period $T = 2\pi\sqrt{R/g_s} = 2\pi\sqrt{3.39\times10^6/3.7} = 6.01\times10^3$ s $= 100$ min. One end to the other is half a period, 50 min. 100 min is the round trip; 16 min is $\sqrt{R/g_s}$ without the $\pi$; 42 min is the answer for Earth.
- id: phys-m5-r2-h32
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'In the real Earth, $g$ increases slightly as you go down through the mantle, instead of falling as in a uniform-planet model. Why?'
  choices: ['The rock above you pulls you downward', 'Earth''s dense core holds a large share of its mass, so the mass inside your radius shrinks only slowly while $1/r^2$ grows', 'Air pressure increases with depth', 'Earth''s rotation is faster at depth']
  answer: 1
  explanation: |-
    $g(r) = GM(r)/r^2$. The rock you pass is relatively light, so $M(r)$ falls slowly while $r^2$ shrinks, and $g$ rises to about 10.7 m/s² near the core–mantle boundary before falling to zero at the center. The shell of rock above you exerts no net force at all (shell theorem), so it can't pull you down.
- id: phys-m5-r2-h33
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'If the Moon were twice as far from Earth, its tidal acceleration on Earth would be'
  choices: ['1/2 as large', '1/4 as large', '1/8 as large', 'unchanged']
  answer: 2
  explanation: |-
    Tidal acceleration is about $2GMd/D^3$, so doubling $D$ divides it by $2^3 = 8$. 1/4 is the change in the Moon's direct pull, which goes as $1/D^2$.
- id: phys-m5-r2-h34
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'Why is there a tidal bulge on the side of Earth facing away from the Moon?'
  choices: ['The Moon''s gravity pushes the far-side ocean away', 'Earth''s rotation flings water outward only on that side', 'The Sun always pulls on the far side', 'The far side is pulled toward the Moon less than Earth''s center is, so relative to the center it is left behind']
  answer: 3
  explanation: |-
    Gravity only attracts. Earth's center accelerates toward the Moon at $GM/D^2$; the far side, at $D + R$, is pulled less, so relative to the center it moves away from the Moon by about $2GMR/D^3$, the same size as the near-side bulge. The Sun's position changes during the month, so it can't explain a bulge that always faces away from the Moon.
- id: phys-m5-r2-h35
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'The Sun''s gravitational pull on Earth is about 180 times the Moon''s, yet its tidal effect is only about half as large. Why?'
  choices: ['Tidal effects depend on the difference in pull across Earth, which falls off as $1/D^3$', 'Sunlight heats the ocean and cancels most of the Sun''s tide', 'The Moon is denser than the Sun', 'The Sun''s pull acts only on the day side']
  answer: 0
  explanation: |-
    The tidal acceleration $2GMd/D^3$ has one more power of distance than the direct pull $GM/D^2$. The Sun is about 390 times farther away than the Moon, so that extra factor of $1/D$ more than cancels its huge mass: the Sun's tide is about 0.46 of the Moon's.
- id: phys-m5-r2-h36
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'Spring tides, with the largest tidal range, happen'
  choices: ['in the spring months of each year', 'at first and third quarter moon', 'only during eclipses', 'at new moon and full moon']
  answer: 3
  explanation: |-
    At new and full moon the Sun, Earth and Moon are lined up and the two tidal effects add. At the quarter moons they act at right angles and partly cancel (neap tides). "Spring" here has nothing to do with the season, and the alignment need not be exact enough for an eclipse.
- id: phys-m5-r2-h37
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'Use the rigid-body estimate $D = R_p(2\rho_p/\rho_m)^{1/3}$ to find the Roche limit for an icy rubble-pile moon of density 1400 kg/m³ around a planet of radius 60,000 km and density 700 kg/m³.'
  choices: ['47,600 km', '60,000 km', '95,200 km', '120,000 km']
  answer: 1
  explanation: |-
    $(2\rho_p/\rho_m)^{1/3} = (2\times700/1400)^{1/3} = 1^{1/3} = 1$, so $D = 60{,}000$ km. 95,200 km swaps the two densities; 47,600 km leaves out the 2; 120,000 km is $2R_p$, multiplying by the 2 outside the cube root.
- id: phys-m5-r2-h38
  lesson: phys-m5-h-tides
  type: text
  topic: Tides and the shell theorem
  stem: 'If the Earth–Moon distance were halved, the Moon''s tidal acceleration on Earth would be multiplied by ___. Give only the number.'
  accept: ['8', 'eight', '8 times', '8x', '8×']
  explanation: |-
    Tidal acceleration $\propto 1/D^3$, and $(1/2)^{-3} = 8$.
- id: phys-m5-r2-h39
  lesson: phys-m5-h-tides
  type: text
  topic: Tides and the shell theorem
  stem: 'The Moon always keeps the same face toward Earth because tidal friction long ago matched its spin to its orbit. This state is called ___.'
  accept: [tidal locking, tidally locked, tidal lock, synchronous rotation, spin-orbit locking, spin-orbit lock]
  explanation: |-
    Tidal locking (synchronous rotation): the Moon turns once on its axis per orbit, so the same hemisphere always faces Earth.
- id: phys-m5-r2-h40
  lesson: phys-m5-h-tides
  type: order
  topic: Tides and the shell theorem
  stem: 'For a uniform planet of radius $R$, put these places in order of gravitational acceleration, smallest first.'
  items: ['At the center', 'At $r = 2R$', 'At $r = 1.5R$', 'At $r = R/2$', 'At the surface']
  explanation: |-
    Inside, $g = g_s r/R$; outside, $g = g_s(R/r)^2$. Center: 0. $2R$: $0.25g_s$. $1.5R$: $0.44g_s$. $R/2$: $0.50g_s$. Surface: $g_s$, the largest anywhere.
- id: phys-m5-r2-h41
  lesson: phys-m5-h-tides
  type: match
  topic: Tides and the shell theorem
  stem: 'Match each effect to its cause.'
  pairs:
    - [Spring tides, Sun and Moon lined up with Earth]
    - [Neap tides, Sun and Moon at right angles as seen from Earth]
    - [Tidal locking of the Moon, Tidal friction braking its spin until it matched its orbit]
    - [The Moon's slow recession, Angular momentum passed from Earth's spin to the Moon's orbit]
  distractors: [Earth's shadow falling on the Moon]
  explanation: |-
    Aligned, the solar and lunar tides add (spring); at right angles they partly cancel (neap). Tidal friction slowed the Moon's spin to one turn per orbit (locking), and the tidal bulges on Earth, dragged ahead by its spin, transfer angular momentum to the Moon's orbit, which grows by about 3.8 cm a year. Earth's shadow causes lunar eclipses, not any of these.
- id: phys-m5-r2-h42
  lesson: phys-m5-h-tides
  type: label
  topic: Tides and the shell theorem
  stem: 'The arrows show the tidal acceleration around Earth due to a distant body. Name the numbered parts.'
  image: {src: images/phys-m5-tides-blank.svg, alt: 'A circle with a dashed oval around it, stretched left and right. Small arrows around the circle point outward on the left and right sides and inward at the top and bottom. A small gray circle sits far to the right. Four places are numbered: the right end of the oval, the left end of the oval, the top of the circle, and the small gray circle.'}
  labels:
    - {x: 59.7, y: 50.0, text: High tide facing the Moon}
    - {x: 12.2, y: 50.0, text: High tide facing away from the Moon}
    - {x: 35.9, y: 20.5, text: Low tide}
    - {x: 92.2, y: 50.0, text: Moon}
  distractors: [Sun]
  explanation: |-
    The body producing the tide is the Moon (4). The ocean bulges toward it (1) and away from it (2), where the tidal acceleration points outward, and is drawn down where the arrows point inward, at right angles to the Earth–Moon line (3). The Sun also raises tides, but about half as large, and it isn't the body drawn here.
- id: phys-m5-r2-h43
  lesson: phys-m5-h-tides
  topic: Tides and the shell theorem
  stem: 'Which statements follow from the shell theorem? Select all that apply.'
  choices: ['A uniform spherical shell attracts an outside mass as if all its mass were at its center', 'Inside a uniform spherical shell the net gravitational force is zero', 'Inside a uniform spherical shell the gravitational potential is zero', 'An irregular asteroid attracts a nearby probe exactly like a point mass at its center']
  answer: [0, 1]
  explanation: |-
    Outside, the shell's potential is $-GM/r$, a point mass's; inside it is the constant $-GM/R$, so the force (its slope) is zero, but the potential itself is not zero. The theorem needs spherical symmetry; an irregular asteroid close up does not act like a point mass.
