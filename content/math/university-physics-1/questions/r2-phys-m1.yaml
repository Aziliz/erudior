# Round 2, module phys-m1: new question types for the core lessons, and the two honors lessons.
# ---- Lesson 01: Measurement, units, and significant figures ----
- id: phys-m1-r2-q01
  lesson: phys-measurement
  topic: Units and conversions
  type: text
  stem: 'A runner moves at $5.0\text{ m/s}$. In km/h that is ___ km/h. Give only the number.'
  accept: ['18', '18.0']
  explanation: |-
    $5.0\,\tfrac{\text{m}}{\text{s}} \times \tfrac{3600\text{ s}}{1\text{ h}} \times \tfrac{1\text{ km}}{1000\text{ m}} = 18\text{ km/h}$. Going from m/s to km/h you multiply by 3.6; dividing instead gives 1.4, which is far too slow for a runner.
- id: phys-m1-r2-q02
  lesson: phys-measurement
  topic: Units and conversions
  type: order
  stem: 'Put these lengths in order from smallest to largest.'
  items: ['450 nm', '3 μm', '0.5 mm', '2 cm', '0.04 m', '1.2 m']
  explanation: |-
    Write each in meters: 450 nm $= 4.5\times10^{-7}$ m, 3 μm $= 3\times10^{-6}$ m, 0.5 mm $= 5\times10^{-4}$ m, 2 cm $= 0.02$ m, then 0.04 m and 1.2 m. Comparing powers of ten first, then the leading digits, puts them in order. Note that 2 cm is smaller than 0.04 m (which is 4 cm).
- id: phys-m1-r2-q03
  lesson: phys-measurement
  module_quiz: true
  topic: Units and conversions
  type: match
  stem: 'Match each SI prefix to the factor it stands for.'
  pairs:
    - [giga (G), 10⁹]
    - [mega (M), 10⁶]
    - [milli (m), 10⁻³]
    - [micro (μ), 10⁻⁶]
    - [nano (n), 10⁻⁹]
  distractors: [10⁻¹²]
  explanation: |-
    giga $= 10^9$, mega $= 10^6$, milli $= 10^{-3}$, micro $= 10^{-6}$, nano $= 10^{-9}$. The factor $10^{-12}$ is pico, which is not on the list. Watch the capital letters: M (mega) and m (milli) differ by a factor of $10^9$.
- id: phys-m1-r2-q04
  lesson: phys-measurement
  topic: Dimensional analysis
  stem: 'Here $x$ is a length, $v$ and $v_0$ are speeds, $a$ is an acceleration and $t$ is a time. Which equations are dimensionally consistent? Select all that apply.'
  choices: ['$v^2 = v_0^2 + 2ax$', '$x = v t^2$', '$t = \dfrac{v - v_0}{a}$', '$a = v t$']
  answer: [0, 2]
  explanation: |-
    $v^2 = v_0^2 + 2ax$: every term is $L^2/T^2$, since $[ax] = \tfrac{L}{T^2}\cdot L$. Consistent.
    $t = (v - v_0)/a$: $\dfrac{L/T}{L/T^2} = T$, a time. Consistent.
    $x = vt^2$: the right side is $\tfrac{L}{T}\cdot T^2 = L\cdot T$, not a length.
    $a = vt$: the right side is $\tfrac{L}{T}\cdot T = L$, a length, not an acceleration.
- id: phys-m1-r2-q05
  lesson: phys-measurement
  module_quiz: true
  topic: Significant figures
  type: label
  stem: 'Each target was hit six times; the center stands for the true value. Name each numbered target.'
  image: {src: images/phys-m1-targets-blank.svg, alt: 'Four round targets, each with six hits. Target 1: a tight cluster at the center. Target 2: a tight cluster away from the center. Target 3: hits spread widely around the center. Target 4: hits spread widely and off to one side. A number sits below each target.'}
  labels:
    - {x: 12.5, y: 83, text: Accurate and precise}
    - {x: 37.5, y: 83, text: Precise but not accurate}
    - {x: 62.5, y: 83, text: Accurate but not precise}
    - {x: 87.5, y: 83, text: Neither accurate nor precise}
  explanation: |-
    Precision is how tightly the hits cluster; accuracy is how close they are, on average, to the center. Target 1 is tight and centered. Target 2 is tight but off center, the signature of a systematic error. Target 3 is scattered but centered, so its average is close to the true value. Target 4 is scattered and off center.
# ---- Lesson 02: Vectors ----
- id: phys-m1-r2-q06
  lesson: phys-vectors
  topic: Vectors
  type: label
  stem: 'Name the numbered parts of this diagram of a vector and its components.'
  image: {src: images/phys-m1-components-blank.svg, alt: 'An arrow drawn from the origin into the first quadrant, a dashed horizontal arrow along the x axis below it, a dashed vertical arrow up to the tip of the first arrow, and an arc at the origin between the x axis and the arrow. Four parts are numbered.'}
  labels:
    - {x: 48.1, y: 55.3, text: The vector A}
    - {x: 48.1, y: 81.6, text: x component (A cos θ)}
    - {x: 78.8, y: 55.3, text: y component (A sin θ)}
    - {x: 30.2, y: 76.5, text: Angle measured from the +x axis}
  distractors: [Angle measured from the +y axis, Unit vector]
  explanation: |-
    The solid arrow from the origin is the vector $\vec A$, the hypotenuse of the right triangle. The horizontal leg is its $x$ component $A_x = A\cos\theta$ and the vertical leg is its $y$ component $A_y = A\sin\theta$. The arc marks $\theta$, measured counterclockwise from the $+x$ axis; that is why the $x$ component uses cosine. Nothing in the picture has length 1, so no unit vector is drawn.
- id: phys-m1-r2-q07
  lesson: phys-vectors
  module_quiz: true
  topic: Vectors
  type: order
  stem: 'Put the steps for finding the direction of a resultant in order.'
  items:
    - 'Resolve each vector into $x$ and $y$ components'
    - 'Add the $x$ components and add the $y$ components'
    - 'Compute $\tan^{-1}(R_y/R_x)$ on the calculator'
    - 'Add $180^\circ$ if $R_x$ is negative'
  explanation: |-
    You need components before you can add them, and the sums $R_x$ and $R_y$ before you can take $\tan^{-1}(R_y/R_x)$. The quadrant check comes last, because it corrects the calculator's answer, which always lies between $-90^\circ$ and $90^\circ$.
- id: phys-m1-r2-q08
  lesson: phys-vectors
  topic: Vector products
  type: match
  stem: 'Match each expression to its result.'
  pairs:
    - ['$\vec A\cdot\vec B$', A scalar equal to AB cos φ]
    - ['$\vec A\times\vec B$', A vector perpendicular to both A and B]
    - ['$\hat\imath\times\hat\jmath$', The unit vector along +z]
    - ['$\hat\imath\cdot\hat\jmath$', Zero]
  distractors: [The unit vector along −z]
  explanation: |-
    The dot product is a number, $AB\cos\phi$; the cross product is a vector perpendicular to both factors. By the right-hand rule $\hat\imath\times\hat\jmath = \hat k$ (along $+z$); $-\hat k$ would be $\hat\jmath\times\hat\imath$. Perpendicular unit vectors have dot product $\cos 90^\circ = 0$.
- id: phys-m1-r2-q09
  lesson: phys-vectors
  module_quiz: true
  topic: Vector products
  stem: 'Which pairs of vectors are perpendicular? Select all that apply.'
  choices: ['$\hat\imath + 2\hat\jmath + 3\hat k$ and $3\hat\imath - \hat k$', '$2\hat\imath - \hat\jmath$ and $\hat\imath + 2\hat\jmath + 5\hat k$', '$\hat\imath + \hat\jmath$ and $\hat\imath - 2\hat\jmath + \hat k$', '$3\hat\imath + 4\hat\jmath$ and $4\hat\imath + 3\hat\jmath$']
  answer: [0, 1]
  explanation: |-
    Two nonzero vectors are perpendicular exactly when their dot product is zero.
    First pair: $1(3) + 2(0) + 3(-1) = 0$. Perpendicular.
    Second pair: $2(1) + (-1)(2) + 0(5) = 0$. Perpendicular.
    Third pair: $1(1) + 1(-2) + 0(1) = -1$. Not perpendicular.
    Fourth pair: $3(4) + 4(3) = 24$. Not perpendicular (they are only $16^\circ$ apart).
- id: phys-m1-r2-q10
  lesson: phys-vectors
  topic: Vectors
  type: text
  stem: 'A vector has components $A_x = -6.0$ m and $A_y = 8.0$ m. Its magnitude is ___ m, and its direction is ___ degrees counterclockwise from the $+x$ axis (nearest degree). Give only the numbers.'
  accept:
    - ['10', '10.0']
    - ['127', '126.9', '126.87']
  explanation: |-
    $A = \sqrt{(-6.0)^2 + 8.0^2} = \sqrt{100} = 10$ m. The calculator gives $\tan^{-1}(8.0/(-6.0)) = -53.1^\circ$, but $A_x < 0$ and $A_y > 0$ put the vector in the second quadrant, so add $180^\circ$: $126.9^\circ \approx 127^\circ$.
# ---- Honors: Measurement uncertainty and error propagation ----
- id: phys-m1-r2-h01
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  stem: 'A calculation gives $g = 9.8134\text{ m/s}^2$ with an uncertainty of $0.0634\text{ m/s}^2$. How should the result be reported?'
  choices: ['$9.81 \pm 0.06\text{ m/s}^2$', '$9.8134 \pm 0.0634\text{ m/s}^2$', '$9.8 \pm 0.0634\text{ m/s}^2$', '$9.813 \pm 0.06\text{ m/s}^2$']
  answer: 0
  explanation: |-
    Round the uncertainty to one significant figure (0.06), then round the value to the same decimal place (9.81). Keeping all the digits claims precision the uncertainty denies; 9.813 keeps a digit past the uncertain one; 9.8 with 0.0634 rounds the value but not the uncertainty.
- id: phys-m1-r2-h02
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  stem: 'A length is measured as $2.50 \pm 0.05$ m. What is its relative uncertainty?'
  choices: ['0.05%', '2%', '5%', '0.02%']
  answer: 1
  explanation: |-
    $\delta L/L = 0.05/2.50 = 0.02 = 2\%$. Reading the absolute uncertainty 0.05 m as a percentage gives 5% or 0.05%; forgetting to convert the fraction 0.02 to a percentage gives 0.02%.
- id: phys-m1-r2-h03
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  type: text
  stem: 'Four timings have a sample standard deviation of 0.60 s. The standard error of their mean is ___ s. Give only the number.'
  accept: ['0.3', '0.30']
  explanation: |-
    The standard error is $s/\sqrt n = 0.60/\sqrt4 = 0.60/2 = 0.30$ s. Quoting 0.60 s would describe a single timing, not the mean of four.
- id: phys-m1-r2-h04
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  stem: 'Two independent lengths, $12.0 \pm 0.3$ cm and $5.0 \pm 0.4$ cm, are added. Combining random uncertainties in quadrature, the total is'
  choices: ['$17.0 \pm 0.7$ cm', '$17.0 \pm 0.1$ cm', '$17.0 \pm 0.5$ cm', '$17.0 \pm 0.35$ cm']
  answer: 2
  explanation: |-
    $\delta = \sqrt{0.3^2 + 0.4^2} = \sqrt{0.25} = 0.5$ cm. The plain sum 0.7 cm is the worst case, not quadrature; 0.1 cm comes from subtracting the uncertainties; 0.35 cm is their average. None of those is the quadrature rule.
- id: phys-m1-r2-h05
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  stem: 'A sphere''s radius is measured with a relative uncertainty of 1%. What is the relative uncertainty of its volume, $V = \tfrac43\pi r^3$?'
  choices: ['1%', '1.7%', '0.33%', '3%']
  answer: 3
  explanation: |-
    For a power, $\delta V/V = 3\,\delta r/r = 3\%$; the exact factor $\tfrac43\pi$ adds nothing. Treating $r\cdot r\cdot r$ as three independent measurements and using quadrature gives $\sqrt3\% \approx 1.7\%$, but the three factors are the same measurement, so their errors add fully. Dividing by 3 instead of multiplying gives 0.33%.
- id: phys-m1-r2-h06
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  stem: 'A pendulum has $L = 1.200 \pm 0.005$ m and $T = 2.20 \pm 0.02$ s. What is the relative uncertainty in $g = 4\pi^2L/T^2$ (combining in quadrature)?'
  choices: ['1.0%', '1.9%', '2.2%', '1.3%']
  answer: 1
  explanation: |-
    $\delta L/L = 0.005/1.200 = 0.42\%$ and $\delta T/T = 0.02/2.20 = 0.91\%$. Because $T$ is squared, it contributes $2(0.91\%) = 1.82\%$. Then $\sqrt{0.42^2 + 1.82^2}\,\% = 1.9\%$. Forgetting to double the period term gives 1.0%; adding instead of using quadrature gives 2.2% (or 1.3% without doubling).
- id: phys-m1-r2-h07
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  stem: 'Taking the mean of many repeated readings reduces the effect of which error?'
  choices: ['A balance that reads 0.5 g with nothing on it', 'A stopwatch that runs 1% fast', 'Scatter from the timer''s reaction time', 'A ruler whose end has worn away']
  answer: 2
  explanation: |-
    Reaction-time scatter is a random error: readings fall above and below the true value, so the mean settles down and its standard error shrinks as $1/\sqrt n$. The other three are systematic errors that shift every reading the same way, so averaging leaves them untouched; they need calibration or a better method.
- id: phys-m1-r2-h08
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  stem: 'A student finds $g = 9.66 \pm 0.04\text{ m/s}^2$ where the accepted value is $9.80\text{ m/s}^2$. What is the best conclusion?'
  choices: ['Consistent, since it is within 2% of the accepted value', 'Consistent, since the uncertainty is small', 'Cannot be judged without more readings', 'Not consistent: the discrepancy is 3.5 uncertainties, suggesting a systematic error']
  answer: 3
  explanation: |-
    The discrepancy is $9.80 - 9.66 = 0.14\text{ m/s}^2$, which is $0.14/0.04 = 3.5$ times the uncertainty. That is well beyond the rough "within about 2 uncertainties" rule, so the result disagrees with the accepted value, and a systematic error is the likely cause. Being within some percentage says nothing by itself; agreement is judged against the stated uncertainty, which is all you need here.
- id: phys-m1-r2-h09
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  stem: 'Water warms from $20.4 \pm 0.2\,^\circ\text{C}$ to $22.1 \pm 0.2\,^\circ\text{C}$. With independent errors combined in quadrature, the temperature change is'
  choices: ['$1.7 \pm 0.3\,^\circ\text{C}$, about 17% uncertain', '$1.7 \pm 0.0\,^\circ\text{C}$, since the errors cancel', '$1.7 \pm 0.2\,^\circ\text{C}$, about 1% uncertain', '$1.7 \pm 0.4\,^\circ\text{C}$, about 24% uncertain']
  answer: 0
  explanation: |-
    $\Delta T = 22.1 - 20.4 = 1.7\,^\circ$C with $\delta = \sqrt{0.2^2 + 0.2^2} = 0.28 \approx 0.3\,^\circ$C, and $0.28/1.7 \approx 17\%$. Uncertainties add even when the values are subtracted, so they never cancel. $\pm 0.4$ is the worst-case sum, not quadrature. Each reading was about 1% uncertain, but the small difference is far less certain.
- id: phys-m1-r2-h10
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  type: text
  stem: 'A side length $x$ has a relative uncertainty of 2%. The relative uncertainty of $x^3$ is ___ %. Give only the number.'
  accept: ['6', '6%', '6.0']
  explanation: |-
    For a power, multiply the relative uncertainty by the exponent: $3 \times 2\% = 6\%$.
- id: phys-m1-r2-h11
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  type: match
  stem: 'Sort each source of error by type.'
  pairs:
    - [A balance that reads 0.5 g with nothing on it, Systematic error]
    - [A digital reading that flickers between values, Random error]
    - [A steel ruler used on a very hot day, Systematic error]
    - [Estimating a pointer's position between scale marks, Random error]
  explanation: |-
    A zero offset and a ruler that has expanded shift every reading the same way, so they are systematic: averaging won't remove them. A flickering display and estimating between marks scatter readings both ways, so they are random and average down.
- id: phys-m1-r2-h12
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  type: order
  stem: 'Put the steps for finding the uncertainty in $g = 4\pi^2L/T^2$ in order.'
  items:
    - 'Find the relative uncertainties $\delta L/L$ and $\delta T/T$'
    - 'Double $\delta T/T$, because $T$ is squared'
    - 'Combine the two relative uncertainties in quadrature'
    - 'Multiply the relative uncertainty by $g$ to get $\delta g$'
    - 'Round $\delta g$ to one or two significant figures and round $g$ to match'
  explanation: |-
    You need the relative uncertainties before you can apply the power rule (doubling the period term). Only then can the two terms be combined in quadrature, which gives $\delta g/g$. Multiplying by $g$ turns that into $\delta g$, and rounding always comes last so no precision is lost along the way.
- id: phys-m1-r2-h13
  lesson: phys-m1-h-uncertainty
  topic: Measurement uncertainty
  stem: 'Which statements about the standard error of the mean are true? Select all that apply.'
  choices: ['It equals $s/\sqrt n$, where $s$ is the sample standard deviation', 'It gets smaller as more readings are taken', 'Taking enough readings makes it remove systematic error', 'It is larger than the standard deviation of single readings']
  answer: [0, 1]
  explanation: |-
    The standard error is $s/\sqrt n$, so it shrinks as $n$ grows (four times as many readings halve it). For $n > 1$ it is smaller than $s$, not larger. It describes only random scatter: a systematic shift is in every reading and survives any amount of averaging.
- id: phys-m1-r2-h14
  lesson: phys-m1-h-uncertainty
  topic: Error propagation
  stem: 'An angle is measured as $\theta = 30.0^\circ \pm 0.5^\circ$. Using $\delta q = |dq/d\theta|\,\delta\theta$, what is the uncertainty in $q = \sin\theta$?'
  choices: ['0.43', '0.0044', '0.0076', '0.0087']
  answer: 2
  explanation: |-
    $\delta q = |\cos\theta|\,\delta\theta$ with $\delta\theta$ in radians: $0.5^\circ = 0.00873$ rad, so $\delta q = 0.866 \times 0.00873 = 0.0076$. Using 0.5 (degrees) gives 0.43; using $\sin\theta$ instead of $\cos\theta$ gives 0.0044; leaving out the $\cos\theta$ factor gives 0.0087.
# ---- Honors: Vector algebra ----
- id: phys-m1-r2-h15
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'What is the scalar projection of $\vec A = 4\hat\imath + 2\hat\jmath - \hat k$ onto $\vec B = 2\hat\imath - \hat\jmath + 2\hat k$?'
  choices: ['4', '0.444', '1.33', '0.873']
  answer: 2
  explanation: |-
    $\vec A\cdot\vec B = 8 - 2 - 2 = 4$ and $|\vec B| = \sqrt{4 + 1 + 4} = 3$, so $\vec A\cdot\hat B = 4/3 = 1.33$. The value 4 is the dot product without dividing by $|\vec B|$; 0.444 divides by $B^2$ (that is the coefficient for the vector projection); 0.873 divides by $|\vec A| = 4.58$ instead of $|\vec B|$.
- id: phys-m1-r2-h16
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'For the same vectors, $\vec A = 4\hat\imath + 2\hat\jmath - \hat k$ and $\vec B = 2\hat\imath - \hat\jmath + 2\hat k$, what is the vector projection of $\vec A$ onto $\vec B$?'
  choices: ['$0.889\hat\imath - 0.444\hat\jmath + 0.889\hat k$', '$2.67\hat\imath - 1.33\hat\jmath + 2.67\hat k$', '$8\hat\imath - 4\hat\jmath + 8\hat k$', '$1.78\hat\imath + 0.889\hat\jmath - 0.444\hat k$']
  answer: 0
  explanation: |-
    $\vec A_\parallel = \dfrac{\vec A\cdot\vec B}{B^2}\vec B = \dfrac{4}{9}(2\hat\imath - \hat\jmath + 2\hat k)$. Dividing by $B$ instead of $B^2$ gives the second choice, not dividing at all gives the third, and the last one points along $\vec A$ instead of $\vec B$ (a projection onto $\vec B$ must be parallel to $\vec B$).
- id: phys-m1-r2-h17
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'Still with $\vec A = 4\hat\imath + 2\hat\jmath - \hat k$ and $\vec B = 2\hat\imath - \hat\jmath + 2\hat k$: what is the magnitude of the part of $\vec A$ perpendicular to $\vec B$?'
  choices: ['4.58', '2.24', '3.25', '4.38']
  answer: 3
  explanation: |-
    The parallel and perpendicular parts are perpendicular, so $A_\perp = \sqrt{A^2 - A_\parallel^2} = \sqrt{21 - (4/3)^2} = \sqrt{19.22} = 4.38$. 4.58 is $|\vec A|$ itself; 3.25 subtracts the lengths ($4.58 - 1.33$) instead of their squares; 2.24 is $\sqrt{21 - 16}$, using the dot product 4 in place of the projection.
- id: phys-m1-r2-h18
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'What angle does $\vec A = 2\hat\imath + 3\hat\jmath + 6\hat k$ make with the $z$ axis?'
  choices: ['$73.4^\circ$', '$31.0^\circ$', '$59.0^\circ$', '$64.6^\circ$']
  answer: 1
  explanation: |-
    $A = \sqrt{4 + 9 + 36} = 7$, and the direction cosine is $\cos\gamma = A_z/A = 6/7$, so $\gamma = 31.0^\circ$. $73.4^\circ$ and $64.6^\circ$ are the angles with the $x$ and $y$ axes; $59.0^\circ$ comes from using $\sin^{-1}$ instead of $\cos^{-1}$ (it is the angle with the $xy$ plane).
- id: phys-m1-r2-h19
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'A vector $\vec A = 5.0\hat\imath$ is described in new axes rotated $30^\circ$ counterclockwise from the old ones. What are its new components $(A_{x''}, A_{y''})$?'
  choices: ['$(4.33,\ 2.50)$', '$(2.50,\ -4.33)$', '$(5.0,\ 0)$', '$(4.33,\ -2.50)$']
  answer: 3
  explanation: |-
    $A_{x'} = A_x\cos30^\circ + A_y\sin30^\circ = 5.0(0.866) = 4.33$ and $A_{y'} = -A_x\sin30^\circ + A_y\cos30^\circ = -2.50$. The new $x'$ axis has turned toward $+y$, away from the vector, so the vector now lies below it: $A_{y'}$ is negative. $(4.33, 2.50)$ rotates the vector instead of the axes; $(2.50, -4.33)$ swaps sine and cosine; $(5.0, 0)$ forgets that components depend on the axes.
- id: phys-m1-r2-h20
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'A 4.0 kg crate sits on a ramp inclined at $25^\circ$. What is the magnitude of the component of its weight along the ramp? (Use $g = 9.8\text{ m/s}^2$.)'
  choices: ['16.6 N', '35.5 N', '39.2 N', '18.3 N']
  answer: 0
  explanation: |-
    With $x'$ along the ramp, $W_{x'} = -mg\sin25^\circ$, of magnitude $4.0(9.8)(0.423) = 16.6$ N. 35.5 N is the component into the ramp ($mg\cos25^\circ$), 39.2 N is the whole weight, and 18.3 N uses $\tan25^\circ$.
- id: phys-m1-r2-h21
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  stem: 'What is the volume of the parallelepiped with edges $\vec A = 2\hat\imath$, $\vec B = \hat\imath + 3\hat\jmath$ and $\vec C = \hat\jmath + 5\hat k$ (in meters)?'
  choices: ['$32.2\text{ m}^3$', '$30\text{ m}^3$', '$15.8\text{ m}^3$', '$1.89\text{ m}^3$']
  answer: 1
  explanation: |-
    $\vec B\times\vec C = (3\cdot5 - 0\cdot1)\hat\imath + (0\cdot0 - 1\cdot5)\hat\jmath + (1\cdot1 - 3\cdot0)\hat k = 15\hat\imath - 5\hat\jmath + \hat k$, and $\vec A\cdot(\vec B\times\vec C) = 2(15) = 30$, so the volume is 30 m³. 32.2 multiplies the three edge lengths, which is right only for a rectangular box; 15.8 is $|\vec B\times\vec C|$, the base area alone; 1.89 is the height alone.
- id: phys-m1-r2-h22
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  stem: 'Which set of three vectors is coplanar?'
  choices: ['$(1, 0, 2),\ (0, 1, 1),\ (1, 1, 2)$', '$(1, 2, 0),\ (0, 1, 2),\ (1, 0, 1)$', '$(1, 0, 2),\ (0, 1, 1),\ (1, 1, 3)$', '$(2, 1, 0),\ (0, 1, 1),\ (1, 0, 1)$']
  answer: 2
  explanation: |-
    Three vectors are coplanar exactly when their scalar triple product (the determinant) is zero. For $(1, 0, 2), (0, 1, 1), (1, 1, 3)$ it is $1(3 - 1) - 0 + 2(0 - 1) = 0$; indeed the third vector is the sum of the first two. The other determinants are $-1$, $5$ and $3$, so those sets span real volumes.
- id: phys-m1-r2-h23
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  stem: 'What is $\hat\imath\times(\hat\imath\times\hat\jmath)$?'
  choices: ['$-\hat\jmath$', '$\vec 0$', '$\hat\jmath$', '$\hat k$']
  answer: 0
  explanation: |-
    Inside first: $\hat\imath\times\hat\jmath = \hat k$, then $\hat\imath\times\hat k = -\hat\jmath$. BAC-CAB agrees: $\hat\imath(\hat\imath\cdot\hat\jmath) - \hat\jmath(\hat\imath\cdot\hat\imath) = 0 - \hat\jmath$. $\vec 0$ is $(\hat\imath\times\hat\imath)\times\hat\jmath$, the other grouping, which shows the cross product is not associative.
- id: phys-m1-r2-h24
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  stem: 'A disk spins with $\vec\omega = 4.0\hat k$ rad/s. A point on it is at $\vec r = 0.50\hat\imath + 0.30\hat k$ m. What is its acceleration $\vec a = \vec\omega\times(\vec\omega\times\vec r)$?'
  choices: ['$-8.0\hat\imath - 4.8\hat k\text{ m/s}^2$', '$8.0\hat\imath\text{ m/s}^2$', '$-2.0\hat\imath\text{ m/s}^2$', '$-8.0\hat\imath\text{ m/s}^2$']
  answer: 3
  explanation: |-
    BAC-CAB: $\vec a = \vec\omega(\vec\omega\cdot\vec r) - \vec r\,\omega^2 = 4.0\hat k(1.2) - 16(0.50\hat\imath + 0.30\hat k) = -8.0\hat\imath$ m/s², pointing at the axis with magnitude $\omega^2\rho = 16(0.50)$. Leaving out the $\vec\omega(\vec\omega\cdot\vec r)$ term gives $-\omega^2\vec r$, the first choice; the second has the sign flipped (it points away from the axis); the third uses $\omega$ instead of $\omega^2$.
- id: phys-m1-r2-h25
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  type: text
  stem: 'For $\vec A = \hat\imath + 2\hat\jmath$, $\vec B = \hat\jmath + 3\hat k$ and $\vec C = 2\hat\imath + \hat k$, the scalar triple product $\vec A\cdot(\vec B\times\vec C)$ is ___. Give only the number.'
  accept: ['13']
  explanation: |-
    $\vec B\times\vec C = (1\cdot1 - 3\cdot0)\hat\imath + (3\cdot2 - 0\cdot1)\hat\jmath + (0\cdot0 - 1\cdot2)\hat k = \hat\imath + 6\hat\jmath - 2\hat k$. Then $\vec A\cdot(\vec B\times\vec C) = 1 + 12 + 0 = 13$. The same number comes from the determinant with rows $\vec A$, $\vec B$, $\vec C$.
- id: phys-m1-r2-h26
  lesson: phys-m1-h-vector-algebra
  topic: Triple products
  type: match
  stem: 'Match each expression to what it gives.'
  pairs:
    - ['$\vec A\cdot\hat B$', A signed number (the scalar projection)]
    - ['$(\vec A\cdot\hat B)\,\hat B$', A vector parallel to B]
    - ['$\vec A\cdot(\vec B\times\vec C)$', A signed volume]
    - ['$\vec A\times(\vec B\times\vec C)$', A vector in the plane of B and C]
  distractors: [A vector perpendicular to both B and C]
  explanation: |-
    The scalar projection is a number, positive or negative. Multiplying it by $\hat B$ gives a vector along $\vec B$. The scalar triple product is the parallelepiped's volume with a sign set by handedness. By BAC-CAB, $\vec A\times(\vec B\times\vec C) = \vec B(\vec A\cdot\vec C) - \vec C(\vec A\cdot\vec B)$ is a combination of $\vec B$ and $\vec C$, so it lies in their plane. The vector perpendicular to both $\vec B$ and $\vec C$ is $\vec B\times\vec C$ itself, which is not listed.
- id: phys-m1-r2-h27
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  stem: 'The $x$ and $y$ axes are rotated by some angle. Which of these stay the same? Select all that apply.'
  choices: ['The magnitude of a vector', 'The dot product of two vectors', 'The $x$ component of a vector', 'The angle a vector makes with the $x$ axis']
  answer: [0, 1]
  explanation: |-
    Rotating the axes leaves the vectors themselves alone, so lengths and the angle between two vectors (hence the dot product) are unchanged: $A_{x'}^2 + A_{y'}^2 = A_x^2 + A_y^2$. The components and the angle measured from the $x$ axis depend on where that axis points, so they change.
- id: phys-m1-r2-h28
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  type: label
  stem: 'Name the numbered parts of this projection diagram.'
  image: {src: images/phys-m1-projection-blank.svg, alt: 'Two arrows from a common tail: a long, shallow one and a steeper one. A thick segment runs along the shallow arrow to the foot of a dashed line dropped at a right angle from the tip of the steeper arrow. An arc marks the angle between the arrows. Five parts are numbered.'}
  labels:
    - {x: 34.8, y: 50, text: Vector A}
    - {x: 81.4, y: 48.9, text: Vector B}
    - {x: 38.4, y: 68, text: Projection of A onto B}
    - {x: 60.1, y: 38.8, text: Part of A perpendicular to B}
    - {x: 18.9, y: 74.1, text: Angle between A and B}
  distractors: [Cross product of A and B]
  explanation: |-
    $\vec A$ is the vector being projected and $\vec B$ the direction it is projected onto. The thick segment along $\vec B$ is $\vec A_\parallel = (\vec A\cdot\hat B)\hat B$, the vector projection, and the dashed segment at a right angle is $\vec A_\perp = \vec A - \vec A_\parallel$. The arc marks the angle $\phi$ in $\vec A\cdot\vec B = AB\cos\phi$. The cross product would point out of the page, so it can't be drawn in this plane.
- id: phys-m1-r2-h29
  lesson: phys-m1-h-vector-algebra
  topic: Vector projections
  type: order
  stem: 'Put the steps for splitting $\vec A$ into parts parallel and perpendicular to $\vec B$ in order.'
  items:
    - 'Find the unit vector $\hat B = \vec B/|\vec B|$'
    - 'Compute the scalar projection $\vec A\cdot\hat B$'
    - 'Multiply $\hat B$ by it to get $\vec A_\parallel$'
    - 'Subtract: $\vec A_\perp = \vec A - \vec A_\parallel$'
  explanation: |-
    Each step uses the result of the one before it: the scalar projection needs $\hat B$, the vector projection needs the scalar projection, and the perpendicular part needs $\vec A_\parallel$. A good final check is $\vec A_\perp\cdot\vec B = 0$.
