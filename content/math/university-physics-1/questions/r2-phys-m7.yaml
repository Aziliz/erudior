    - {x: 9.7, y: 82.9, text: Cold reservoir}
    - {x: 37.4, y: 51.3, text: Work output}
    - {x: 62.6, y: 51.3, text: Work input}
    - {x: 75.8, y: 68.9, text: Heat removed from the cold space}
  distractors: [Heat flowing spontaneously from cold to hot, Heat rejected to the cold reservoir]
  explanation: |-
    An engine takes heat $Q_H$ from the hot reservoir (1), turns part of it into work output (3) and rejects $Q_C$ to the cold reservoir (2). A refrigerator runs the other way: work input (4) drives heat out of the cold space (5) and delivers $Q_H = Q_C + W$ to the hot side. That heat moves "uphill" only because work is supplied; it never flows from cold to hot on its own.
- id: phys-m7-r2-q28
  lesson: phys-second-law
  topic: Heat engines
  type: order
  stem: 'Put the four steps of the Carnot cycle in order, starting with the step in which the gas takes in heat from the hot reservoir.'
  items:
    - 'Isothermal expansion at $T_H$'
    - 'Adiabatic expansion, cooling from $T_H$ to $T_C$'
    - 'Isothermal compression at $T_C$'
    - 'Adiabatic compression, heating from $T_C$ to $T_H$'
  explanation: |-
    The gas absorbs $Q_H$ while expanding at $T_H$, keeps expanding with no heat flow so it cools to $T_C$, is compressed at $T_C$ while rejecting $Q_C$, and finally is compressed adiabatically back up to $T_H$, ready to start again.
- id: phys-m7-r2-q29
  lesson: phys-second-law
  topic: Heat engines
  type: text
  stem: 'A Carnot engine runs between reservoirs at 600 K and 300 K. Its efficiency is ___ %. (Give only the number.)'
  accept: ['50']
  explanation: |-
    $e = 1 - T_C/T_H = 1 - 300/600 = 0.50$, or 50%. No engine running between these two reservoirs can do better.
- id: phys-m7-r2-q30
  lesson: phys-second-law
  topic: Entropy
  stem: 'Which of these processes increase the total entropy of the universe? Select all that apply.'
  choices:
    - 'Heat flowing from a hot pan into cooler air'
    - 'A gas expanding freely into a vacuum'
    - 'An ideal Carnot engine completing one cycle'
    - 'A sliding block brought to rest by friction'
  answer: [0, 1, 3]
  explanation: |-
    Heat flow across a finite temperature difference, free expansion and friction are all irreversible, so they increase the total entropy. An ideal Carnot engine is reversible: over a cycle the gas returns to its start and the reservoirs' changes cancel, $Q_H/T_H = Q_C/T_C$, so the total entropy change is zero.
- id: phys-m7-r2-q31
  lesson: phys-second-law
  module_quiz: true
  topic: Heat engines
  stem: 'A heat pump keeps a house at 20°C when it is 0°C outside. What is the largest possible coefficient of performance for heating, $Q_H/W$?'
  choices: ['14.7', '13.7', '1.0', '0.068']
  answer: 0
  explanation: |-
    The Carnot limit for heating is $\dfrac{T_H}{T_H - T_C} = \dfrac{293}{293 - 273} = 14.7$, in kelvins. 13.7 is the refrigerator COP $T_C/(T_H - T_C)$, 1.0 comes from using Celsius ($20/20$), and 0.068 is the Carnot efficiency $1 - T_C/T_H$ of an engine between these temperatures. Real heat pumps reach about 3 to 4 in such conditions, well below the limit.
