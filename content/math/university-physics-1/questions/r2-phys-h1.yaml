# Honors module phys-h1 (Round 2): lessons 90-93
# --- 90 Lagrangian mechanics ---
- id: phys-h1-r2-h01
  lesson: phys-h1-lagrangian
  module_quiz: true
  topic: Lagrangian mechanics
  stem: 'With $T$ the kinetic energy and $U$ the potential energy, what is the Lagrangian?'
  choices: ['$L = T + U$', '$L = T - U$', '$L = U - T$', '$L = \int (T - U)\,dt$']
  answer: 1
  explanation: |-
    $L = T - U$. The sum $T + U$ is the total energy, a different quantity; $\int(T - U)\,dt$ is the action $S$, built from $L$; $U - T$ has the wrong sign (it would flip the sign of every force in the equations of motion).
- id: phys-h1-r2-h02
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'A double pendulum (a second pendulum hung from the bob of the first, both on rigid rods) swings in a vertical plane. How many generalized coordinates does it need?'
  choices: ['1', '4', '3', '2']
  answer: 3
  explanation: |-
    Each rod's angle from the vertical fixes its bob's position, so two angles describe the whole system: 2 degrees of freedom. Four would be the $x$ and $y$ of both bobs, ignoring the two rod constraints; one counts only the upper pendulum.
- id: phys-h1-r2-h03
  lesson: phys-h1-lagrangian
  module_quiz: true
  topic: Lagrangian mechanics
  stem: 'A mass on a spring has $L = \tfrac12m\dot x^2 - \tfrac12kx^2$. What does the Euler–Lagrange equation give?'
  choices: ['$m\ddot x = -kx$', '$m\ddot x = kx$', '$m\dot x = -kx$', '$m\ddot x = -\tfrac12kx$']
  answer: 0
  explanation: |-
    $\partial L/\partial\dot x = m\dot x$, whose time derivative is $m\ddot x$; $\partial L/\partial x = -kx$. So $m\ddot x - (-kx) = 0$, i.e. $m\ddot x = -kx$ (Hooke's law). $+kx$ comes from a sign slip; $m\dot x$ forgets the time derivative; $\tfrac12kx$ forgets that the derivative of $\tfrac12kx^2$ is $kx$.
- id: phys-h1-r2-h04
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'A pendulum has $L = \tfrac12m\ell^2\dot\theta^2 + mg\ell\cos\theta$. What is $\partial L/\partial\theta$?'
  choices: ['$m\ell^2\dot\theta$', '$mg\ell\sin\theta$', '$-mg\ell\sin\theta$', '$-mg\ell\sin\theta + m\ell^2\ddot\theta$']
  answer: 2
  explanation: |-
    In the partial derivative, $\dot\theta$ is held fixed, so the kinetic term gives nothing and $\frac{\partial}{\partial\theta}(mg\ell\cos\theta) = -mg\ell\sin\theta$. $m\ell^2\dot\theta$ is $\partial L/\partial\dot\theta$; $+mg\ell\sin\theta$ drops the minus sign from differentiating cosine; the last choice mixes in the time-derivative term.
- id: phys-h1-r2-h05
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'Blocks of 5.0 kg and 3.0 kg hang over a pulley that is a uniform 4.0 kg disk; the string doesn''t slip. Using $g = 9.8$ m/s², what is the acceleration?'
  choices: ['2.45 m/s²', '1.63 m/s²', '7.84 m/s²', '1.96 m/s²']
  answer: 3
  explanation: |-
    $T = \tfrac12\left(m_1 + m_2 + \tfrac12M\right)\dot x^2$ with $m_1 + m_2 + \tfrac12M = 10$ kg, and $U = -(m_1 - m_2)gx$. So $a = (2.0)(9.8)/10 = 1.96$ m/s². 2.45 m/s² ignores the pulley; 1.63 m/s² counts the pulley's full 4.0 kg (as if it were a hoop); 7.84 m/s² gives both blocks' potential energies the same sign, as if both went down.
- id: phys-h1-r2-h06
  lesson: phys-h1-lagrangian
  module_quiz: true
  topic: Lagrangian mechanics
  stem: 'Why does the string tension never appear when you solve an Atwood machine with a Lagrangian?'
  choices: ['The constraint force does no work, so it enters neither $T$ nor $U$', 'The tension is zero when the pulley has mass', 'The Lagrangian method ignores all forces, including gravity', 'The two tensions are always equal and opposite, so they cancel']
  answer: 0
  explanation: |-
    The string only enforces the constraint (one block up, the other down); with a fixed constraint it does no net work, so it contributes nothing to $T$ or $U$. Gravity is not ignored: it is in $U$. The tension isn't zero, and with a massive pulley the two tensions are not even equal.
- id: phys-h1-r2-h07
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'Which statement of Hamilton''s principle is accurate?'
  choices: ['The true path always makes the action as small as possible', 'The Lagrangian is zero at every instant along the true path', 'The true path makes the action stationary for small changes with the endpoints held fixed', 'The action stays constant in time along the true path']
  answer: 2
  explanation: |-
    The action $S = \int L\,dt$ is stationary: small changes of the path, with fixed endpoints, change $S$ only at second order. The true path is often a minimum (always for short enough times) but can be a saddle, so "least" is not accurate in general. $S$ is a single number for a whole path, so it isn't something that stays constant in time, and $L$ need not be zero.
- id: phys-h1-r2-h08
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'A uniform rod 0.60 m long swings about one end ($I = \tfrac13m\ell^2$, center of mass $\ell/2$ from the pivot). Using $g = 9.8$ m/s², what is its period for small swings?'
  choices: ['1.10 s', '1.27 s', '1.55 s', '0.898 s']
  answer: 1
  explanation: |-
    The Euler–Lagrange equation gives $\tfrac13m\ell^2\ddot\theta = -\tfrac12mg\ell\theta$, so $\omega = \sqrt{3g/(2\ell)} = 4.95$ rad/s and $T = 2\pi/\omega = 1.27$ s. 1.55 s is a simple pendulum of length 0.60 m; 1.10 s treats all the mass as sitting at the center of mass; 0.898 s drops the 2 in $\sqrt{3g/(2\ell)}$.
- id: phys-h1-r2-h09
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'A particle moves in a plane. In polar coordinates $(r, \varphi)$, what is its kinetic energy?'
  choices: ['$\tfrac12m\left(\dot r^2 + \dot\varphi^2\right)$', '$\tfrac12mr^2\dot\varphi^2$', '$\tfrac12m(\dot r + r\dot\varphi)^2$', '$\tfrac12m\left(\dot r^2 + r^2\dot\varphi^2\right)$']
  answer: 3
  explanation: |-
    The velocity has a radial part $\dot r$ and a perpendicular part $r\dot\varphi$; they are at right angles, so $v^2 = \dot r^2 + r^2\dot\varphi^2$. Writing $\dot\varphi^2$ squares an angular rate instead of a speed; $\tfrac12mr^2\dot\varphi^2$ leaves out the radial motion; $(\dot r + r\dot\varphi)^2$ adds perpendicular components as if they were parallel.
- id: phys-h1-r2-h10
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  type: text
  stem: 'Blocks of 4.0 kg and 2.0 kg hang over a pulley that is a uniform 2.0 kg disk (no slipping, $g = 9.8$ m/s²). The acceleration is ___ m/s². Give only the number.'
  accept: ['2.8', '2.80']
  explanation: |-
    The effective mass is $m_1 + m_2 + \tfrac12M = 4.0 + 2.0 + 1.0 = 7.0$ kg, so $a = (4.0 - 2.0)(9.8)/7.0 = 2.8$ m/s².
- id: phys-h1-r2-h11
  lesson: phys-h1-lagrangian
  module_quiz: true
  topic: Lagrangian mechanics
  type: order
  stem: 'Put the steps of solving a problem with Lagrangian mechanics in order.'
  items: ['Choose one generalized coordinate per degree of freedom', 'Write $T$ and $U$ in those coordinates and their rates', 'Form $L = T - U$', 'Take $\partial L/\partial\dot q$ and $\partial L/\partial q$', 'Apply the Euler–Lagrange equation and solve']
  explanation: |-
    You need coordinates before you can write the energies, the energies before $L$, $L$ before its derivatives, and the derivatives before the Euler–Lagrange equation.
- id: phys-h1-r2-h12
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  stem: 'Which systems can the basic method ($L = T - U$, no extra force terms) handle directly? Select all that apply.'
  choices: ['A pendulum on a rigid rod', 'An Atwood machine with a massive pulley', 'A block sliding with kinetic friction', 'A planet orbiting a star', 'A falling object with air drag']
  answer: [0, 1, 3]
  explanation: |-
    The pendulum, the Atwood machine and the orbit involve only conservative forces (gravity) and workless constraints, so $L = T - U$ captures them. Kinetic friction and air drag don't come from a potential energy; they need generalized forces added to the Euler–Lagrange equation.
- id: phys-h1-r2-h13
  lesson: phys-h1-lagrangian
  module_quiz: true
  topic: Lagrangian mechanics
  type: label
  stem: 'Name the numbered parts of this pendulum setup.'
  image: {src: images/phys-h1-pendulum-blank.svg, alt: 'A pendulum: a bob on a rod hanging from a support, a dashed vertical line below the support, an arc between the vertical and the rod, and a dashed circular arc around the support.'}
  labels:
    - {x: 50, y: 16.7, text: Pivot}
    - {x: 75, y: 74.4, text: Bob}
    - {x: 62.5, y: 45.5, text: Rigid rod}
    - {x: 55, y: 38, text: Generalized coordinate (angle from the vertical)}
    - {x: 12, y: 60, text: Path allowed by the constraint}
  distractors: [Center of the orbit, Tension force]
  explanation: |-
    The rod (3) holds the bob (2) at a fixed distance from the pivot (1), so the bob can only move on the dashed circle (5). One number, the angle from the vertical (4), fixes its position: the pendulum has one degree of freedom.
- id: phys-h1-r2-h14
  lesson: phys-h1-lagrangian
  topic: Lagrangian mechanics
  type: match
  stem: 'Match each term to its meaning.'
  pairs:
    - [Constraint, A condition that limits the possible positions]
    - [Degrees of freedom, The number of independent coordinates needed]
    - [Action, The time integral of the Lagrangian along a path]
    - [Lagrangian, Kinetic energy minus potential energy]
  distractors: [Kinetic energy plus potential energy]
  explanation: |-
    A constraint (like a rod's fixed length) limits positions; the degrees of freedom count the independent coordinates left; the Lagrangian is $T - U$; the action is $S = \int L\,dt$. $T + U$ is the total energy, which matches none of them.
# --- 91 Symmetry, conservation laws and the Hamiltonian ---
- id: phys-h1-r2-h15
  lesson: phys-h1-symmetry
  topic: Symmetry and conservation
  stem: 'For a pendulum with $L = \tfrac12m\ell^2\dot\theta^2 + mg\ell\cos\theta$, what is the generalized momentum $p_\theta$?'
  choices: ['$m\ell\dot\theta$', '$m\ell^2\dot\theta$', '$m\ell^2\ddot\theta$', '$-mg\ell\sin\theta$']
  answer: 1
  explanation: |-
    $p_\theta = \partial L/\partial\dot\theta = m\ell^2\dot\theta$, the bob's angular momentum about the pivot. $m\ell\dot\theta$ is the bob's linear momentum (it has the wrong units for an angle's momentum); $m\ell^2\ddot\theta$ is its time derivative; $-mg\ell\sin\theta$ is $\partial L/\partial\theta$, the generalized force (a torque).
- id: phys-h1-r2-h16
  lesson: phys-h1-symmetry
  module_quiz: true
  topic: Symmetry and conservation
  stem: 'A particle moves in a plane with $L = \tfrac12m\left(\dot r^2 + r^2\dot\varphi^2\right) - U(r)$. Which quantity is conserved because $\varphi$ is cyclic?'
  choices: ['$m\dot r$', '$mr\dot\varphi$', '$\dot r^2 + r^2\dot\varphi^2$', '$mr^2\dot\varphi$']
  answer: 3
  explanation: |-
    $\varphi$ doesn't appear in $L$, so $p_\varphi = \partial L/\partial\dot\varphi = mr^2\dot\varphi$ (angular momentum) is conserved. $r$ does appear (in $r^2\dot\varphi^2$ and $U$), so $m\dot r$ is not conserved; $mr\dot\varphi$ is the sideways linear momentum, which changes as $r$ changes; the speed squared changes as $U$ trades energy with $T$.
- id: phys-h1-r2-h17
  lesson: phys-h1-symmetry
  topic: Symmetry and conservation
  stem: 'A puck on a frictionless table circles a hole at 1.5 rad/s on a string of radius 0.60 m. The string is pulled through the hole until the radius is 0.20 m. What is the new angular speed?'
  choices: ['4.5 rad/s', '0.17 rad/s', '13.5 rad/s', '40.5 rad/s']
  answer: 2
  explanation: |-
    The pull is central, so $mr^2\omega$ is conserved: $\omega_2 = 1.5(0.60/0.20)^2 = 1.5(9) = 13.5$ rad/s. 4.5 rad/s conserves $r\omega$ (the speed) instead; 0.17 rad/s inverts the ratio; 40.5 rad/s cubes it.
- id: phys-h1-r2-h18
  lesson: phys-h1-symmetry
  topic: Symmetry and conservation
  stem: 'In the string-through-a-hole experiment, the puck''s kinetic energy increases as it is pulled inward. Where does the energy come from?'
  choices: ['From the work done by the person pulling the string', 'From an increase in the puck''s angular momentum', 'Nowhere: kinetic energy stays constant because energy is conserved', 'From work done by gravity on the puck']
  answer: 0
  explanation: |-
    The string pulls inward and the puck moves inward, so the person does positive work, which shows up as kinetic energy ($T = p_\varphi^2/2mr^2$ grows as $r$ shrinks). Angular momentum stays constant; the table is level, so gravity does no work; and the puck's energy isn't conserved because an outside agent does work on it.
- id: phys-h1-r2-h19
  lesson: phys-h1-symmetry
  module_quiz: true
  topic: Symmetry and conservation
  stem: 'By Noether''s theorem, which quantity is conserved because the laws of physics are the same at every moment in time?'
  choices: ['Linear momentum', 'Angular momentum', 'Mass', 'Energy']
  answer: 3
  explanation: |-
    Time-translation symmetry ($L$ has no explicit $t$) gives energy conservation. Symmetry under shifts in position gives linear momentum, and symmetry under rotation gives angular momentum. Conservation of mass isn't one of the three mechanical cases.
- id: phys-h1-r2-h20
  lesson: phys-h1-symmetry
  topic: Hamiltonian mechanics
  stem: 'For $L = \tfrac12m\dot x^2 - \tfrac12kx^2$, what is the Hamiltonian $H = p\dot x - L$?'
  choices: ['$\tfrac12m\dot x^2 + \tfrac12kx^2$', '$\tfrac12m\dot x^2 - \tfrac12kx^2$', '$m\dot x^2 - \tfrac12kx^2$', '$\tfrac12kx^2 - \tfrac12m\dot x^2$']
  answer: 0
  explanation: |-
    $p = m\dot x$, so $H = m\dot x^2 - \tfrac12m\dot x^2 + \tfrac12kx^2 = \tfrac12m\dot x^2 + \tfrac12kx^2$, the total energy. The second choice is $L$ itself; the third forgets to subtract the kinetic part of $L$ and flips the sign of $U$; the fourth is $-L$.
- id: phys-h1-r2-h21
  lesson: phys-h1-symmetry
  module_quiz: true
  topic: Hamiltonian mechanics
  stem: 'For $H = \dfrac{p^2}{2m} + \tfrac12kx^2$, what does Hamilton''s equation give for $\dot p$?'
  choices: ['$p/m$', '$kx$', '$-kx$', '$-p/m$']
  answer: 2
  explanation: |-
    $\dot p = -\partial H/\partial x = -kx$, Hooke's law. $p/m$ is the other equation, $\dot x = \partial H/\partial p$; $kx$ misses the minus sign; $-p/m$ mixes the two.
- id: phys-h1-r2-h22
  lesson: phys-h1-symmetry
  topic: Hamiltonian mechanics
  stem: 'A 2.0 kg mass on a spring with $k = 50$ N/m has total energy 1.0 J. What are the semi-axes of its ellipse in phase space?'
  choices: ['0.040 m and 4.0 kg·m/s', '0.20 m and 1.4 kg·m/s', '0.14 m and 2.0 kg·m/s', '0.20 m and 2.0 kg·m/s']
  answer: 3
  explanation: |-
    $x_{\max} = \sqrt{2E/k} = \sqrt{0.040} = 0.20$ m and $p_{\max} = \sqrt{2mE} = \sqrt{4.0} = 2.0$ kg·m/s. 0.040 and 4.0 forget the square roots; 1.4 uses $\sqrt{mE}$; 0.14 uses $\sqrt{E/k}$.
- id: phys-h1-r2-h23
  lesson: phys-h1-symmetry
  topic: Hamiltonian mechanics
  stem: 'A pendulum is a small mass on a light rigid rod 0.50 m long. What speed at the bottom puts it exactly on the separatrix ($g = 9.8$ m/s²)?'
  choices: ['4.95 m/s', '4.43 m/s', '3.13 m/s', '2.21 m/s']
  answer: 1
  explanation: |-
    On the separatrix the mass just reaches the top with zero speed: $\tfrac12mv^2 = mg(2\ell)$, so $v = \sqrt{4g\ell} = 4.43$ m/s. 4.95 m/s is $\sqrt{5g\ell}$, needed for a string, which goes slack otherwise; 3.13 m/s only reaches the horizontal ($\sqrt{2g\ell}$); 2.21 m/s is $\sqrt{g\ell}$.
- id: phys-h1-r2-h24
  lesson: phys-h1-symmetry
  topic: Symmetry and conservation
  type: text
  stem: 'A coordinate that does not appear in the Lagrangian (though its rate may) is called a ___ coordinate, and its generalized momentum is conserved.'
  accept: [cyclic, ignorable]
  explanation: |-
    It is a cyclic (or ignorable) coordinate: $\partial L/\partial q = 0$, so the Euler–Lagrange equation reduces to $dp/dt = 0$.
- id: phys-h1-r2-h25
  lesson: phys-h1-symmetry
  module_quiz: true
  topic: Symmetry and conservation
  type: match
  stem: 'Match each symmetry of the Lagrangian to the quantity it conserves.'
  pairs:
    - [Shift in time, Energy]
    - [Shift in position, Linear momentum]
    - [Rotation about an axis, Angular momentum about that axis]
  distractors: [Mass, Kinetic energy]
  explanation: |-
    These are the three mechanical cases of Noether's theorem. Kinetic energy alone is not conserved by any of them (the puck on a string gains it), and mass conservation is not one of these symmetries.
- id: phys-h1-r2-h26
  lesson: phys-h1-symmetry
  module_quiz: true
  topic: Hamiltonian mechanics
  stem: 'Which statements about phase space are true? Select all that apply.'
  choices: ['A point in phase space gives the full state: positions and momenta', 'When $H$ doesn''t depend on time, two phase-space paths never cross', 'A harmonic oscillator''s path in phase space is an ellipse', 'The pendulum''s separatrix passes through the stable equilibrium at $\theta = 0$', 'Every phase-space path spirals in to a point']
  answer: [0, 1, 2]
  explanation: |-
    A phase-space point fixes the future, so paths can't cross (one state can't have two futures), and the oscillator's constant $H$ makes its path an ellipse. The separatrix passes through the unstable upside-down point $\theta = \pm\pi$, not $\theta = 0$. Paths spiral in only with damping, which Hamilton's equations for a conserved $H$ don't include.
- id: phys-h1-r2-h27
  lesson: phys-h1-symmetry
  topic: Symmetry and conservation
  type: text
  stem: 'A puck circles a hole in a frictionless table at 3.0 rad/s. The string through the hole is pulled until the radius is half what it was. The new angular speed is ___ rad/s. Give only the number.'
  accept: ['12']
  explanation: |-
    $mr^2\omega$ is conserved, so halving $r$ multiplies $\omega$ by 4: $3.0 \times 4 = 12$ rad/s.
- id: phys-h1-r2-h28
  lesson: phys-h1-symmetry
  topic: Hamiltonian mechanics
  type: order
  stem: 'Put the steps for getting Hamilton''s equations from a Lagrangian in order.'
  items: ['Write $L(q, \dot q)$', 'Find $p = \partial L/\partial\dot q$', 'Form $H = p\dot q - L$', 'Rewrite $H$ in terms of $q$ and $p$ (no $\dot q$)', 'Use $\dot q = \partial H/\partial p$ and $\dot p = -\partial H/\partial q$']
  explanation: |-
    The momentum is defined from $L$, $H$ is built from $p$ and $L$, and Hamilton's equations only work once $\dot q$ has been replaced by $p$.
# --- 92 Central forces and the Kepler problem ---
- id: phys-h1-r2-h29
  lesson: phys-h1-kepler
  module_quiz: true
  topic: Central forces
  stem: 'Two stars of 2.0 and 6.0 solar masses orbit each other. In solar masses, what is the reduced mass of the pair?'
  choices: ['8.0', '4.0', '0.67', '1.5']
  answer: 3
  explanation: |-
    $\mu = \dfrac{m_1m_2}{m_1 + m_2} = \dfrac{12}{8.0} = 1.5$ solar masses, less than either mass. 8.0 is the total mass; 4.0 the average; 0.67 is the reciprocal, $(m_1 + m_2)/(m_1m_2)$.
- id: phys-h1-r2-h30
  lesson: phys-h1-kepler
  topic: Central forces
  stem: 'What does the term $\dfrac{\ell^2}{2mr^2}$ in the effective potential stand for?'
  choices: ['The kinetic energy of the sideways (angular) motion, written using the conserved $\ell$', 'The gravitational potential energy', 'The kinetic energy of the radial motion', 'The work done by friction as the orbit decays']
  answer: 0
  explanation: |-
    $\tfrac12mr^2\dot\varphi^2$ rewritten with $\dot\varphi = \ell/(mr^2)$ is $\ell^2/(2mr^2)$: sideways kinetic energy that acts like a repulsive "centrifugal barrier" in the radial problem. Gravity is the $-GMm/r$ term; the radial kinetic energy is $\tfrac12m\dot r^2$; there is no friction in the model.
- id: phys-h1-r2-h31
  lesson: phys-h1-kepler
  topic: Kepler orbits
  stem: 'A comet''s orbit around the Sun has eccentricity 1.3. What kind of orbit is it?'
  choices: ['A bound ellipse', 'A hyperbola: it passes the Sun once and leaves', 'A parabola', 'A circle']
  answer: 1
  explanation: |-
    $e > 1$ is a hyperbola, with positive energy: the comet is unbound. An ellipse has $0 < e < 1$, a parabola exactly $e = 1$, a circle $e = 0$.
- id: phys-h1-r2-h32
  lesson: phys-h1-kepler
  module_quiz: true
  topic: Kepler orbits
  stem: 'A satellite''s orbit comes within 7000 km of Earth''s center and goes out to 21 000 km. What are its semimajor axis and eccentricity?'
  choices: ['$a = 28\,000$ km, $e = 0.50$', '$a = 14\,000$ km, $e = 0.67$', '$a = 14\,000$ km, $e = 0.50$', '$a = 7000$ km, $e = 0.33$']
  answer: 2
  explanation: |-
    $a = \tfrac12(7000 + 21\,000) = 14\,000$ km and $e = \dfrac{21\,000 - 7000}{21\,000 + 7000} = 0.50$. 28 000 km forgets to halve; $e = 0.67$ divides by $r_a$ alone; 7000 km and 0.33 take half the difference and $r_p/r_a$.
- id: phys-h1-r2-h33
  lesson: phys-h1-kepler
  module_quiz: true
  topic: Kepler orbits
  stem: 'A satellite on an elliptical orbit with $a = 10\,000$ km is 8000 km from Earth''s center. Using $GM_E = 3.98\times10^{14}$ m³/s², what is its speed there?'
  choices: ['7.05 km/s', '7.73 km/s', '6.31 km/s', '9.97 km/s']
  answer: 1
  explanation: |-
    Vis-viva: $v^2 = 3.98\times10^{14}\left(\dfrac{2}{8.0\times10^6} - \dfrac{1}{1.0\times10^7}\right) = 5.97\times10^7$ m²/s², so $v = 7.73$ km/s. 7.05 km/s is the circular speed at 8000 km and 6.31 km/s the circular speed at 10 000 km, neither of which applies to an ellipse; 9.97 km/s is the escape speed at 8000 km.
- id: phys-h1-r2-h34
  lesson: phys-h1-kepler
  topic: Kepler orbits
  stem: 'Two satellites orbit Earth with the same semimajor axis, one in a circle and one in a very elongated ellipse. How do their periods compare?'
  choices: ['The ellipse''s period is longer, because its path is longer', 'The ellipse''s period is shorter, because it moves faster near perigee', 'It depends on the satellites'' masses', 'They are equal, because the period depends only on $a$']
  answer: 3
  explanation: |-
    $T^2 = 4\pi^2a^3/GM$ for every ellipse, whatever its eccentricity. The faster motion near perigee and slower motion near apogee exactly balance the different path. The satellite's own mass cancels (for satellites much lighter than Earth).
- id: phys-h1-r2-h35
  lesson: phys-h1-kepler
  topic: Kepler orbits
  stem: 'A comet''s orbit runs from 1.0 AU to 9.0 AU from the Sun. How many times faster does it move at perihelion than at aphelion?'
  choices: ['9.0', '3.0', '81', '5.0']
  answer: 0
  explanation: |-
    At both ends the velocity is perpendicular to $\vec r$, so conservation of angular momentum gives $r_pv_p = r_av_a$ and $v_p/v_a = r_a/r_p = 9.0$. 3.0 takes a square root and 81 squares the ratio, as if energy or area scaled that way; 5.0 is the semimajor axis in AU.
- id: phys-h1-r2-h36
  lesson: phys-h1-kepler
  topic: Central forces
  stem: 'According to Bertrand''s theorem, for which central forces is every bound orbit closed (repeating exactly)?'
  choices: ['Any attractive central force', 'Only the inverse-square force', 'The inverse-square force and the linear spring force $F \propto r$', 'Any force that weakens with distance']
  answer: 2
  explanation: |-
    Only $F \propto 1/r^2$ and $F \propto r$ make every bound orbit close. Under other force laws, bound orbits generally precess. That's why the small extra precession of Mercury's orbit (beyond what the other planets cause) showed that Newton's inverse-square law is not the whole story; general relativity explains the difference.
- id: phys-h1-r2-h37
  lesson: phys-h1-kepler
  topic: Kepler orbits
  stem: 'A spacecraft 8000 km from Earth''s center moves at 9.0 km/s. Using $GM_E = 3.98\times10^{14}$ m³/s², what kind of orbit is it on?'
  choices: ['Unbound: a hyperbola, since its kinetic energy is positive', 'A circle of radius 8000 km', 'A bound ellipse with $a \approx 43\,000$ km', 'A bound ellipse with $a \approx 21\,500$ km']
  answer: 3
  explanation: |-
    $\varepsilon = v^2/2 - GM/r = 4.05\times10^7 - 4.975\times10^7 = -9.25\times10^6$ J/kg: negative, so bound. $a = -GM/(2\varepsilon) = 2.15\times10^7$ m $= 21\,500$ km. Positive kinetic energy doesn't make an orbit unbound (the total decides); the circular speed at 8000 km is 7.05 km/s, not 9.0; 43 000 km drops the 2 in $-GM/(2\varepsilon)$.
- id: phys-h1-r2-h38
  lesson: phys-h1-kepler
  module_quiz: true
  topic: Kepler orbits
  type: label
  stem: 'Name the numbered points of this elliptical orbit.'
  image: {src: images/phys-h1-ellipse-blank.svg, alt: 'An ellipse with a dashed long axis; on the axis, from left to right, an end point, a small open circle, a center dot, a large filled circle and the other end point, plus a small body on the upper part of the ellipse.'}
  labels:
    - {x: 68.8, y: 50, text: Central body (occupied focus)}
    - {x: 31.2, y: 50, text: Empty focus}
    - {x: 50, y: 50, text: Center of the ellipse}
    - {x: 81.2, y: 50, text: Periapsis}
    - {x: 18.8, y: 50, text: Apoapsis}
    - {x: 60.1, y: 14.5, text: Orbiting body}
  distractors: [Directrix]
  explanation: |-
    The central body sits at one focus (1), not at the center (3); the other focus (2) is empty. Periapsis (4) is the end of the long axis nearest the occupied focus, and apoapsis (5) the far end. The orbiting body (6) moves fastest near periapsis.
- id: phys-h1-r2-h39
  lesson: phys-h1-kepler
  topic: Kepler orbits
  type: text
  stem: 'The point of an orbit closest to the body being orbited is called the ___.'
  accept: [periapsis, periapse, pericenter, pericentre, perigee, perihelion]
  explanation: |-
    It is the periapsis (perigee around Earth, perihelion around the Sun). The farthest point is the apoapsis.
- id: phys-h1-r2-h40
  lesson: phys-h1-kepler
  module_quiz: true
  topic: Kepler orbits
  type: match
  stem: 'Match each eccentricity to the shape of the orbit.'
  pairs:
    - ['$e = 0$', Circle]
    - ['$0 < e < 1$', Ellipse]
    - ['$e = 1$', Parabola]
    - ['$e > 1$', Hyperbola]
  distractors: [Spiral]
  explanation: |-
    The orbit equation $r = p/(1 + e\cos\varphi)$ is a conic: a circle for $e = 0$, an ellipse (bound, $E < 0$) for $0 < e < 1$, a parabola ($E = 0$) for $e = 1$, and a hyperbola ($E > 0$) for $e > 1$. Inverse-square orbits are never spirals.
- id: phys-h1-r2-h41
  lesson: phys-h1-kepler
  topic: Kepler orbits
  stem: 'For a bound orbit under gravity, which statements are true? Select all that apply.'
  choices: ['The total energy is negative', 'The total energy is $-GMm/(2a)$', 'The speed is greatest at periapsis', 'The central body is at the center of the ellipse', 'The speed is the same everywhere on the orbit']
  answer: [0, 1, 2]
  explanation: |-
    Bound orbits have $E = -GMm/(2a) < 0$, and angular momentum conservation ($r_pv_p = r_av_a$) makes the speed greatest at periapsis. The central body is at a focus, not the center, and the speed is constant only on a circle.
- id: phys-h1-r2-h42
  lesson: phys-h1-kepler
  topic: Kepler orbits
  type: text
  stem: 'An orbit ranges from 8000 km to 12 000 km from Earth''s center. Its eccentricity is ___. Give only the number.'
  accept: ['0.2', '0.20']
  explanation: |-
    $e = \dfrac{r_a - r_p}{r_a + r_p} = \dfrac{4000}{20\,000} = 0.20$.
# --- 93 Orbital maneuvers and transfers ---
- id: phys-h1-r2-h43
  lesson: phys-h1-maneuvers
  module_quiz: true
  topic: Orbital maneuvers
  stem: 'In a Hohmann transfer from a lower circular orbit to a higher one, in which direction are the two burns?'
  choices: ['Forward, then backward', 'Backward, then forward', 'Both forward', 'Both backward']
  answer: 2
  explanation: |-
    The first forward burn raises the apoapsis to the higher orbit. The spacecraft arrives there slower than the circular speed, so the second burn is forward too, raising the periapsis. A backward burn would lower the opposite side of the orbit.
- id: phys-h1-r2-h44
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'How long does a Hohmann transfer take from a circular orbit of radius 7000 km to one of radius 13 000 km around Earth ($GM_E = 3.98\times10^{14}$ m³/s²)?'
  choices: ['166 min', '123 min', '83 min', '235 min']
  answer: 2
  explanation: |-
    $a_t = \tfrac12(7000 + 13\,000) = 10\,000$ km; the trip is half the period: $\pi\sqrt{(1.0\times10^7)^3/3.98\times10^{14}} = 4980$ s $= 83$ min. 166 min is a full period; 123 min uses the outer radius as $a$; 235 min uses $r_1 + r_2$ as $a$.
- id: phys-h1-r2-h45
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'After a Hohmann transfer from low Earth orbit up to geostationary orbit, how does the satellite''s speed compare with its speed in low orbit?'
  choices: ['Faster, because both burns sped it up', 'Slower, even though both burns sped it up', 'The same, because the burns cancel', 'Zero, because it stays above one point of the equator']
  answer: 1
  explanation: |-
    Circular speed $\sqrt{GM/r}$ falls with radius: about 7.7 km/s in low orbit but 3.1 km/s at GEO. On the climb, gravity takes away more kinetic energy than the burns add. A geostationary satellite still moves at 3.1 km/s; it only looks still because Earth turns with it.
- id: phys-h1-r2-h46
  lesson: phys-h1-maneuvers
  module_quiz: true
  topic: Orbital maneuvers
  stem: 'A spacecraft fires its engine forward for a short time at periapsis. What changes most?'
  choices: ['Its apoapsis distance increases', 'Its periapsis distance increases', 'Both distances increase equally', 'Only the period changes; the shape stays the same']
  answer: 0
  explanation: |-
    The burn can't move the point where it happens, so periapsis stays put while the extra energy raises $a$ and lifts the opposite side of the orbit: the apoapsis. A larger $a$ also lengthens the period, but the shape changes too.
- id: phys-h1-r2-h47
  lesson: phys-h1-maneuvers
  module_quiz: true
  topic: Orbital maneuvers
  stem: 'A spacecraft is in a circular orbit where the circular speed is 7.8 km/s and the escape speed is 11.0 km/s. It needs a hyperbolic excess speed of 3.0 km/s. How big is the single departure burn?'
  choices: ['3.0 km/s', '3.6 km/s', '6.2 km/s', '3.2 km/s']
  answer: 1
  explanation: |-
    $v = \sqrt{v_\infty^2 + v_{\text{esc}}^2} = \sqrt{9.0 + 121} = 11.4$ km/s, so the burn is $11.4 - 7.8 = 3.6$ km/s. 6.2 km/s adds $v_\infty$ straight onto the escape speed (or escapes first and then burns far away), which misses the Oberth effect; 3.2 km/s only escapes; 3.0 km/s ignores Earth's gravity.
- id: phys-h1-r2-h48
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'A stage with exhaust speed 3.0 km/s must deliver $\Delta v = 4.5$ km/s. What initial-to-final mass ratio does it need?'
  choices: ['1.5', '2.5', '1.9', '4.5']
  answer: 3
  explanation: |-
    $m_i/m_f = e^{\Delta v/u} = e^{1.5} = 4.48 \approx 4.5$. 1.5 is the exponent itself; 2.5 adds 1 to it instead of exponentiating; 1.9 is $e^{u/\Delta v}$, the ratio upside down.
- id: phys-h1-r2-h49
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'A planet outside Earth''s orbit takes 1.5 years to orbit the Sun. How often do Hohmann launch windows to it repeat?'
  choices: ['Every 3.0 yr', 'Every 0.60 yr', 'Every 2.5 yr', 'Every 0.50 yr']
  answer: 0
  explanation: |-
    The synodic period: $1/S = 1/(1\text{ yr}) - 1/(1.5\text{ yr}) = 1/3$, so $S = 3.0$ yr. 0.60 yr adds the rates instead of subtracting; 2.5 yr adds the periods; 0.50 yr subtracts the periods.
- id: phys-h1-r2-h50
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'During a gravity-assist flyby, what happens to the spacecraft''s speed measured in the planet''s own frame?'
  choices: ['It increases by up to twice the planet''s orbital speed', 'It decreases, because the planet captures energy', 'Its speed and direction are both unchanged', 'Its speed is unchanged, only its direction turns']
  answer: 3
  explanation: |-
    In the planet's frame the flyby is like an elastic collision: same speed out as in, direction turned. The gain (up to $2U$ in the idealized limit) appears only in the Sun's frame, where the planet's velocity is added back.
- id: phys-h1-r2-h51
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'Why is it cheaper to burn for departure close to a planet than far away from it?'
  choices: ['A burn changes kinetic energy by about $mv\,\Delta v$, which is largest where the craft moves fastest', 'Gravity is weaker close to the planet', 'The engine''s exhaust speed is higher near a planet', 'Air resistance helps the burn']
  answer: 0
  explanation: |-
    This is the Oberth effect: the same $\Delta v$ adds more kinetic energy when $v$ is large, as it is deep in the gravity well at periapsis. Gravity is stronger, not weaker, near the planet; exhaust speed is a property of the engine; and drag only takes energy away.
- id: phys-h1-r2-h52
  lesson: phys-h1-maneuvers
  module_quiz: true
  topic: Orbital maneuvers
  type: label
  stem: 'Name the numbered parts of this Hohmann transfer.'
  image: {src: images/phys-h1-hohmann-blank.svg, alt: 'A planet at the center of two circles, with a dashed half-ellipse joining a point on the right of the inner circle to a point on the left of the outer circle; red arrows mark both points.'}
  labels:
    - {x: 50, y: 50, text: Planet}
    - {x: 50, y: 67.6, text: Parking orbit}
    - {x: 50, y: 91.2, text: Target orbit}
    - {x: 40.9, y: 23, text: Transfer orbit}
    - {x: 63.6, y: 50, text: First burn}
    - {x: 18.2, y: 50, text: Second burn}
  distractors: [Escape trajectory]
  explanation: |-
    The spacecraft starts on the inner parking orbit (2) around the planet (1), burns forward (5) to enter the half-ellipse transfer orbit (4), and burns forward again (6) on the far side to stay on the outer target orbit (3).
- id: phys-h1-r2-h53
  lesson: phys-h1-maneuvers
  module_quiz: true
  topic: Orbital maneuvers
  type: order
  stem: 'Put the steps of a Hohmann transfer to Mars in order.'
  items: ['Wait until Mars leads Earth by about 44°', 'Burn forward to enter the transfer ellipse', 'Coast half the ellipse, about 258 days', 'Burn to match Mars''s orbit on arrival']
  explanation: |-
    The phase angle has to be right at launch, so waiting for the window comes first. Then the departure burn, the half-ellipse coast, and the arrival burn at the far side.
- id: phys-h1-r2-h54
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  type: text
  stem: 'The time between successive launch windows to Mars (about 26 months) is the ___ period of Earth and Mars.'
  accept: [synodic]
  explanation: |-
    The synodic period is the time for Earth to gain one full lap on Mars: $1/S = 1/T_E - 1/T_M$, giving about 2.14 yr.
- id: phys-h1-r2-h55
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  stem: 'Which simplifications does the lesson''s model of transfers make? Select all that apply.'
  choices: ['Each burn changes the velocity instantly', 'The starting and target orbits are circles in one plane', 'Only one body''s gravity is counted at a time', 'The propellant has no mass', 'The central body''s mass is negligible']
  answer: [0, 1, 2]
  explanation: |-
    The lesson uses impulsive burns, coplanar circular orbits, and patched conics (Earth's gravity near Earth, the Sun's between the planets). Propellant mass is not ignored: the rocket equation is how $\Delta v$ is paid for. And the central body's mass sets $GM$, so it can't be negligible.
- id: phys-h1-r2-h56
  lesson: phys-h1-maneuvers
  topic: Orbital maneuvers
  type: text
  stem: 'Model Earth''s orbit (1.00 AU) and Jupiter''s (5.20 AU) as circles. A Hohmann transfer from Earth to Jupiter takes ___ years, to 3 significant figures. Give only the number.'
  accept: ['2.73']
  explanation: |-
    $a_t = \tfrac12(1.00 + 5.20) = 3.10$ AU. With $T^2 = a^3$ in AU and years, the trip is half a period: $\tfrac12(3.10)^{3/2} = 2.73$ yr.
