# Round 2 glossary for phys-m5 (honors lessons 19h1-19h3)
- term: slip velocity
  aliases: [slipping velocity]
  definition: 'The velocity of a rolling object''s contact point relative to the surface, $v_{\text{cm}} - R\omega$. It is zero for rolling without slipping; otherwise kinetic friction acts opposite to it.'
  topic: Rolling with slipping
- term: center of percussion
  aliases: [centre of percussion, centers of percussion]
  definition: 'The point of a pivoted rigid body where a blow produces no impulse at the pivot, a distance $b = I_P/(Md)$ from it; $\tfrac23L$ for a uniform rod held at one end. A simple model of a bat''s sweet spot.'
  topic: Rolling with slipping
- term: gyroscopic approximation
  definition: 'Treating a precessing gyroscope''s angular momentum as pure spin, $L = I\omega$ along the axle; valid when the spin is much faster than the precession, giving $\Omega = \tau/(I\omega)$.'
  topic: Gyroscopes
- term: nutation
  aliases: [nutations]
  definition: 'A small bobbing of a spinning body''s axis on top of its steady precession, seen for example when a gyroscope is released with its axle held still.'
  topic: Gyroscopes
- term: axial precession
  aliases: [precession of the equinoxes]
  definition: 'The slow conical motion of Earth''s spin axis, one cycle in about 26,000 years, caused by the Sun''s and Moon''s torques on Earth''s equatorial bulge.'
  topic: Gyroscopes
- term: principal axis
  aliases: [principal axes, principal axes of inertia]
  definition: 'One of three perpendicular axes through a rigid body''s center of mass about which its angular momentum is parallel to its angular velocity; symmetry axes are principal axes. Spinning about one needs no bearing torque.'
  topic: Gyroscopes
- term: gravitational potential
  definition: 'Gravitational potential energy per unit mass, $V = U/m$ (J/kg); $-GM/r$ for a point mass. The field is its negative slope, $g_r = -dV/dr$.'
  topic: Tides and the shell theorem
- term: shell theorem
  aliases: [Newton's shell theorem]
  definition: 'A uniform spherical shell attracts outside masses as if all its mass were at its center, and exerts no net gravitational force anywhere inside it.'
  topic: Tides and the shell theorem
- term: tidal force
  aliases: [tidal forces, tidal acceleration, tidal accelerations]
  definition: 'The difference between a body''s gravitational pull at a point and at the center of the object it acts on; about $2GMd/D^3$ along the line to the body, and half that, inward, across it.'
  topic: Tides and the shell theorem
- term: spring tide
  aliases: [spring tides]
  definition: 'A tide of extra-large range at new and full moon, when the Sun''s and Moon''s tidal effects line up and add.'
  topic: Tides and the shell theorem
- term: neap tide
  aliases: [neap tides]
  definition: 'A tide of small range at first and third quarter moon, when the Sun''s and Moon''s tidal effects act at right angles and partly cancel.'
  topic: Tides and the shell theorem
- term: tidal locking
  aliases: [tidally locked, tidal lock, synchronous rotation]
  definition: 'The state of a body whose spin period equals its orbital period, so it always shows the same face to its partner; produced by tidal friction, as for the Moon.'
  topic: Tides and the shell theorem
- term: Roche limit
  definition: 'The distance from a planet inside which its tides pull apart a moon held together only by gravity: roughly $R_p(2\rho_p/\rho_m)^{1/3}$ (rigid estimate) to $2.44R_p(\rho_p/\rho_m)^{1/3}$ (fluid moon).'
  topic: Tides and the shell theorem
