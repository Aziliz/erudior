# Honors module phys-h1 (Round 2): terms from lessons 90-93
- term: constraint
  aliases: [constraints]
  definition: 'A condition that limits the possible positions of a system, such as a pendulum rod''s fixed length ($x^2 + y^2 = \ell^2$) or an inextensible string.'
  topic: Lagrangian mechanics
- term: degrees of freedom
  aliases: [degree of freedom]
  definition: 'The number of independent quantities needed to specify a system''s configuration once its constraints are taken into account: one for a pendulum, two for a puck on a table, three for a free particle.'
  topic: Lagrangian mechanics
- term: generalized coordinates
  aliases: [generalized coordinate]
  definition: 'Any set of independent quantities $q_1, q_2, \ldots$ (lengths, angles, …) that fixes a system''s configuration, one per degree of freedom, chosen so the constraints hold automatically.'
  topic: Lagrangian mechanics
- term: Lagrangian
  definition: 'Kinetic minus potential energy, $L = T - U$, written in generalized coordinates and their rates $\dot q$. Not the total energy.'
  topic: Lagrangian mechanics
- term: action
  aliases: [action integral]
  definition: 'The time integral of the Lagrangian along a path, $S = \int_{t_1}^{t_2}L\,dt$, with units of J·s.'
  topic: Lagrangian mechanics
- term: principle of stationary action
  aliases: [Hamilton's principle, principle of least action]
  definition: 'The path a system actually follows between fixed endpoints makes the action stationary: small changes to the path don''t change $S$ to first order. Often called "least" action, though the true path can be a saddle point.'
  topic: Lagrangian mechanics
- term: Euler–Lagrange equation
  aliases: [Euler-Lagrange equation, Euler–Lagrange equations, Euler-Lagrange equations]
  definition: 'The equation of motion for each generalized coordinate, $\dfrac{d}{dt}\left(\dfrac{\partial L}{\partial\dot q}\right) - \dfrac{\partial L}{\partial q} = 0$, which follows from making the action stationary.'
  topic: Lagrangian mechanics
- term: generalized momentum
  aliases: [canonical momentum, conjugate momentum]
  definition: 'The momentum belonging to a generalized coordinate, $p = \partial L/\partial\dot q$: ordinary momentum for a length, angular momentum for an angle.'
  topic: Symmetry and conservation
- term: generalized force
  aliases: [generalized forces]
  definition: 'The quantity $\partial L/\partial q$ on the right of $dp/dt = \partial L/\partial q$; a force for a length coordinate and a torque for an angle. Also used for nonconservative forces added to the Euler–Lagrange equation.'
  topic: Symmetry and conservation
- term: cyclic coordinate
  aliases: [cyclic coordinates, ignorable coordinate, ignorable coordinates]
  definition: 'A generalized coordinate that does not appear in the Lagrangian (its rate may). Its generalized momentum is conserved.'
  topic: Symmetry and conservation
- term: Noether's theorem
  definition: 'Every continuous symmetry of the action gives a conserved quantity (Emmy Noether, 1918): time shifts give energy, position shifts give linear momentum, rotations give angular momentum.'
  topic: Symmetry and conservation
- term: Hamiltonian
  definition: '$H = \sum p\dot q - L$, written in terms of coordinates and momenta. Conserved when $L$ has no explicit time dependence; equal to $T + U$ when the constraints are fixed and $U$ doesn''t depend on velocities.'
  topic: Hamiltonian mechanics
- term: Hamilton's equations
  definition: 'The equations of motion in Hamiltonian form: $\dot q = \partial H/\partial p$ and $\dot p = -\partial H/\partial q$, two first-order equations per coordinate.'
  topic: Hamiltonian mechanics
- term: phase space
  definition: 'The space of all positions and momenta of a system, for one coordinate the $(q, p)$ plane. Each point is a complete state.'
  topic: Hamiltonian mechanics
- term: phase portrait
  aliases: [phase portraits]
  definition: 'A drawing of the paths in phase space for many starting states, showing at a glance the kinds of motion a system can have.'
  topic: Hamiltonian mechanics
- term: separatrix
  definition: 'A phase-space path that divides two kinds of motion; for a pendulum, the path at exactly the energy to reach the top, separating swinging from full rotation.'
  topic: Hamiltonian mechanics
- term: Liouville's theorem
  definition: 'Under Hamilton''s equations, a region of starting states in phase space moves and changes shape but keeps its area (volume). Stated without proof in this course.'
  topic: Hamiltonian mechanics
- term: Kepler problem
  definition: 'Finding the motion of two bodies that attract each other with an inverse-square force, such as a planet and a star; its bound solutions are ellipses.'
  topic: Central forces
- term: effective potential
  aliases: [effective potential energy, centrifugal barrier]
  definition: 'For a central force, $U_{\text{eff}}(r) = \dfrac{\ell^2}{2mr^2} + U(r)$: the radial motion behaves like one-dimensional motion in this potential. The first term is the centrifugal barrier.'
  topic: Central forces
- term: orbit equation
  definition: 'The equation for an orbit''s shape using $u = 1/r$ as a function of angle: $\dfrac{d^2u}{d\varphi^2} + u = \dfrac{GMm^2}{\ell^2}$ for gravity, with solution $r = \dfrac{p}{1 + e\cos\varphi}$.'
  topic: Central forces
- term: Bertrand's theorem
  definition: 'Of all central force laws, only the inverse-square force and the linear (spring) force make every bound orbit close on itself.'
  topic: Central forces
- term: conic section
  aliases: [conic sections, conic, conics]
  definition: 'A curve made by slicing a cone with a plane: circle, ellipse, parabola or hyperbola. Orbits under inverse-square forces are conic sections with the attracting body at a focus.'
  topic: Kepler orbits
- term: eccentricity
  definition: 'The number $e$ that sets an orbit''s shape: $e = 0$ circle, $0 < e < 1$ ellipse, $e = 1$ parabola, $e > 1$ hyperbola. For an ellipse, $e = (r_a - r_p)/(r_a + r_p)$.'
  topic: Kepler orbits
- term: semimajor axis
  aliases: [semi-major axis]
  definition: 'Half the longest diameter of an ellipse, $a = (r_p + r_a)/2$ for an orbit. It alone sets the orbit''s energy, $E = -GMm/(2a)$, and period, $T^2 = 4\pi^2a^3/GM$.'
  topic: Kepler orbits
- term: periapsis
  aliases: [perigee, perihelion, pericenter, periapse]
  definition: 'The point of an orbit closest to the body being orbited, at $r_p = a(1 - e)$; perigee for Earth orbits, perihelion for orbits of the Sun. The speed is greatest there.'
  topic: Kepler orbits
- term: apoapsis
  aliases: [apogee, aphelion, apocenter, apoapse]
  definition: 'The point of an orbit farthest from the body being orbited, at $r_a = a(1 + e)$; apogee for Earth orbits, aphelion for orbits of the Sun. The speed is least there.'
  topic: Kepler orbits
- term: vis-viva equation
  aliases: [vis-viva]
  definition: 'The speed at any point of a Kepler orbit: $v^2 = GM\left(\dfrac{2}{r} - \dfrac{1}{a}\right)$, from energy conservation with $E = -GMm/(2a)$.'
  topic: Kepler orbits
- term: specific orbital energy
  definition: 'Orbital energy per unit mass of the orbiting body, $\varepsilon = \dfrac{v^2}{2} - \dfrac{GM}{r} = -\dfrac{GM}{2a}$; negative for bound orbits, zero for a parabola, positive for a hyperbola.'
  topic: Kepler orbits
- term: delta-v
  aliases: [delta v, Δv]
  definition: 'The change in velocity a maneuver needs, or the total a spacecraft''s propellant can provide ($u\ln(m_i/m_f)$ by the rocket equation). The basic budget unit of spaceflight.'
  topic: Orbital maneuvers
- term: impulsive burn
  aliases: [impulsive burns]
  definition: 'A model of a rocket burn so short compared with the orbital period that the velocity changes instantly while the position stays the same.'
  topic: Orbital maneuvers
- term: Hohmann transfer
  aliases: [Hohmann transfer orbit, Hohmann transfers]
  definition: 'A move between two coplanar circular orbits along half an ellipse that touches both, with one forward burn at each end; the cheapest two-burn transfer between them.'
  topic: Orbital maneuvers
- term: transfer orbit
  aliases: [transfer orbits, transfer ellipse]
  definition: 'An orbit used to travel from one orbit to another, entered and left by burns; in a Hohmann transfer, an ellipse with periapsis on the inner orbit and apoapsis on the outer.'
  topic: Orbital maneuvers
- term: hyperbolic excess speed
  aliases: [v-infinity, hyperbolic excess velocity]
  definition: 'The speed $v_\infty$ an escaping spacecraft keeps far from a planet: $v_\infty^2 = v^2 - v_{\text{esc}}^2$ for speed $v$ at distance $r$.'
  topic: Orbital maneuvers
- term: Oberth effect
  definition: 'A given $\Delta v$ changes kinetic energy by about $mv\,\Delta v$, so a burn is most effective where the spacecraft moves fastest, such as periapsis deep in a gravity well.'
  topic: Orbital maneuvers
- term: synodic period
  definition: 'The time for one planet to gain a full lap on another as seen from the Sun, $1/S = |1/T_1 - 1/T_2|$; about 2.14 years (26 months) for Earth and Mars.'
  topic: Orbital maneuvers
- term: launch window
  aliases: [launch windows]
  definition: 'The period when the planets are positioned so that a planned transfer reaches its target; for Hohmann transfers to Mars, about once every 26 months.'
  topic: Orbital maneuvers
- term: gravity assist
  aliases: [gravity assists, gravitational slingshot]
  definition: 'A flyby in which a planet turns a spacecraft''s velocity; its speed is unchanged in the planet''s frame but can increase or decrease in the Sun''s frame.'
  topic: Orbital maneuvers
