# Round 2 glossary for phys-m4 (honors lessons 14h1-14h3)
- term: force field
  aliases: [force fields]
  definition: 'A force that depends on position, $\vec F(x, y, z)$: it assigns a force vector to every point of a region.'
  topic: Conservative force fields
- term: line integral
  aliases: [line integrals]
  definition: 'The sum of $\vec F\cdot d\vec\ell$ along a path, $\int_C\vec F\cdot d\vec\ell$; for a force it is the work done along that path. Evaluate it by parametrizing the path: $\int\vec F(\vec r(t))\cdot\vec r\,''(t)\,dt$.'
  topic: Conservative force fields
- term: path independence
  aliases: [path-independent, path independent]
  definition: 'The property that the work done by a force between two points is the same along every path joining them; it defines a conservative force.'
  topic: Conservative force fields
- term: curl
  aliases: [curl test]
  definition: 'The vector $\nabla\times\vec F$ built from the derivatives of a field''s components; in the plane its one component is $\partial F_y/\partial x - \partial F_x/\partial y$. A conservative force has zero curl, and on a region without holes zero curl guarantees a potential energy.'
  topic: Conservative force fields
- term: central force
  aliases: [central forces]
  definition: 'A force that points along the line to a fixed center and whose size depends only on the distance $r$ from it, $\vec F = f(r)\hat r$. Every central force is conservative, with $U = -\int f(r)\,dr$.'
  topic: Conservative force fields
- term: equipotential
  aliases: [equipotentials, equipotential curve, equipotential surface, equipotential surfaces]
  definition: 'A curve or surface on which the potential energy is constant. A conservative force is perpendicular to the equipotentials and points toward lower potential energy.'
  topic: Conservative force fields
- term: gravity loss
  aliases: [gravity losses]
  definition: 'The speed a rocket fails to gain because its weight acts during the burn: $gt_b$ for a vertical burn of duration $t_b$ in uniform gravity, subtracted from $u\ln(m_i/m_f)$.'
  topic: Variable-mass systems
- term: momentum flux
  definition: 'The rate at which a stream carries momentum across a surface; for a fluid jet of density $\rho$, area $A$ and speed $v$ it is $\rho Av^2$ (mass rate $\rho Av$ times speed $v$).'
  topic: Variable-mass systems
- term: laboratory frame
  aliases: [lab frame]
  definition: 'The reference frame in which a collision is observed or set up, usually with the target at rest.'
  topic: Center-of-mass frame
- term: center-of-mass frame
  aliases: [CM frame, center of mass frame, centre-of-mass frame]
  definition: 'The inertial frame moving with the center of mass of the colliding objects. In it the total momentum is zero, so the two objects have equal and opposite momenta.'
  topic: Center-of-mass frame
- term: reduced mass
  aliases: [μ (reduced mass)]
  definition: 'For two objects, $\mu = \dfrac{m_1m_2}{m_1 + m_2}$, smaller than either mass. The CM-frame momenta are $\pm\mu\vec v_{\text{rel}}$, and the kinetic energy in the CM frame is $\tfrac12\mu v_{\text{rel}}^2$.'
  topic: Center-of-mass frame
- term: relative kinetic energy
  definition: 'The kinetic energy of two objects in their center-of-mass frame, $\tfrac12\mu v_{\text{rel}}^2$; the only part of the kinetic energy a collision can convert to other forms.'
  topic: Center-of-mass frame
- term: scattering angle
  aliases: [scattering angles]
  definition: 'The angle through which a collision turns a particle''s velocity. In the CM frame an elastic collision only turns the momenta, by the CM scattering angle; the lab-frame angle is found by adding the CM velocity back.'
  topic: Center-of-mass frame
- term: moderator
  aliases: [neutron moderator, moderators]
  definition: 'A material of light nuclei, such as water, heavy water or graphite, that slows fast fission neutrons through elastic collisions so they can cause further fission in a reactor.'
  topic: Center-of-mass frame
