- term: trajectory equation
  aliases: [equation of the trajectory]
  definition: 'The path of a projectile written as $y$ in terms of $x$: $y = x\tan\theta - \dfrac{gx^2}{2v_0^2\cos^2\theta}$, found by eliminating $t$ from the component equations.'
  topic: Projectile targeting
- term: safety parabola
  aliases: [envelope parabola, parabola of safety]
  definition: 'The curve $y = \dfrac{v_0^2}{2g} - \dfrac{gx^2}{2v_0^2}$ that every trajectory launched at speed $v_0$ touches once and never crosses (their envelope). Points under it can be hit at two angles, points on it at one, points above it not at all (no air resistance).'
  topic: Projectile targeting
- term: unit tangent vector
  aliases: [unit tangent]
  definition: 'The unit vector $\hat T = \vec v/|\vec v|$ pointing along a path in the direction of motion.'
  topic: Curvilinear motion
- term: unit normal vector
  aliases: [unit normal]
  definition: 'The unit vector $\hat N$ perpendicular to the path, pointing toward the inside of the bend (toward the center of curvature); $d\hat T/dt = (v/\rho)\hat N$.'
  topic: Curvilinear motion
- term: osculating circle
  aliases: [osculating circles, kissing circle]
  definition: 'The circle that best fits a curved path at a point: it has the same tangent and the same curvature there. Its radius is the radius of curvature and its center is the center of curvature.'
  topic: Curvilinear motion
- term: radius of curvature
  aliases: [radii of curvature]
  definition: 'The radius $\rho$ of the osculating circle at a point of a path; small $\rho$ means a sharp bend. For motion, $\rho = v^2/a_n = v^3/|v_xa_y - v_ya_x|$.'
  topic: Curvilinear motion
- term: curvature
  definition: 'How sharply a path bends at a point: $\kappa = 1/\rho$, the reciprocal of the radius of curvature. A straight line has zero curvature.'
  topic: Curvilinear motion
- term: normal acceleration
  aliases: [normal component of acceleration]
  definition: 'The part of the acceleration perpendicular to the velocity, $a_n = v^2/\rho$, pointing toward the center of curvature; it changes the direction of motion, not the speed. Also called radial or centripetal acceleration.'
  topic: Curvilinear motion
- term: arc length
  aliases: [path length]
  definition: 'Distance measured along a curved path: $s = \int |\vec v|\,dt$. It is never less than the magnitude of the displacement.'
  topic: Curvilinear motion
