<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833">
<title>Velocity-time graph with four segments</title>
<rect width="600" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e5d8a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a0432f"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7a4a"/></marker></defs>
<rect x="70" y="55" width="500" height="287.5" fill="#f4f7fb"/>
<line x1="70.0" y1="345.0" x2="70.0" y2="45.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="70.0" y1="230.0" x2="585.0" y2="230.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="170.0" y1="230.0" x2="170.0" y2="236.0" stroke="#1c2833" stroke-width="2"/>
<text x="170.0" y="252.0" text-anchor="middle" font-size="14">2</text>
<line x1="270.0" y1="230.0" x2="270.0" y2="236.0" stroke="#1c2833" stroke-width="2"/>
<text x="270.0" y="252.0" text-anchor="middle" font-size="14">4</text>
<line x1="370.0" y1="230.0" x2="370.0" y2="236.0" stroke="#1c2833" stroke-width="2"/>
<text x="370.0" y="252.0" text-anchor="middle" font-size="14">6</text>
<line x1="470.0" y1="230.0" x2="470.0" y2="236.0" stroke="#1c2833" stroke-width="2"/>
<text x="470.0" y="252.0" text-anchor="middle" font-size="14">8</text>
<line x1="64.0" y1="330.0" x2="70.0" y2="330.0" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="335.0" text-anchor="end" font-size="14">-4</text>
<line x1="64.0" y1="280.0" x2="70.0" y2="280.0" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="285.0" text-anchor="end" font-size="14">-2</text>
<line x1="64.0" y1="180.0" x2="70.0" y2="180.0" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="185.0" text-anchor="end" font-size="14">2</text>
<line x1="64.0" y1="130.0" x2="70.0" y2="130.0" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="135.0" text-anchor="end" font-size="14">4</text>
<line x1="64.0" y1="80.0" x2="70.0" y2="80.0" stroke="#1c2833" stroke-width="2"/>
<text x="60.0" y="85.0" text-anchor="end" font-size="14">6</text>
<text x="585.0" y="254.0" text-anchor="end" font-size="16">t (s)</text>
<text x="78.0" y="51.0" text-anchor="start" font-size="16">v (m/s)</text>
<polyline points="70.0,230.0 270.0,80.0 420.0,80.0 495.0,230.0 545.0,330.0" fill="none" stroke="#2e5d8a" stroke-width="4"/>
<text x="300.0" y="385.0" text-anchor="middle" font-size="15">A velocity–time graph: the sign of v gives the direction of motion</text>
</svg>
