<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380" role="img" font-family="sans-serif"><title>A parallelepiped with edges A, B and C; B cross C is normal to the base and the volume is the absolute value of A dot (B cross C)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="560" height="380" fill="#ffffff"/><polygon points="120.0,300.0 370.0,300.0 480.0,230.0 230.0,230.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5" fill-opacity="0.85"/><polygon points="190.0,130.0 440.0,130.0 550.0,60.0 300.0,60.0" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5" fill-opacity="0.85"/><line x1="120.0" y1="300.0" x2="190.0" y2="130.0" stroke="#1c2833" stroke-width="1.5"/><line x1="370.0" y1="300.0" x2="440.0" y2="130.0" stroke="#1c2833" stroke-width="1.5"/><line x1="230.0" y1="230.0" x2="300.0" y2="60.0" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="480.0" y1="230.0" x2="550.0" y2="60.0" stroke="#1c2833" stroke-width="1.5"/><line x1="120.0" y1="300.0" x2="370.0" y2="300.0" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/><text x="245.0" y="330.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">B</text><line x1="120.0" y1="300.0" x2="230.0" y2="230.0" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/><text x="153.0" y="263.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">C</text><line x1="120.0" y1="300.0" x2="190.0" y2="130.0" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/><text x="131.0" y="215.0" font-size="22" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">A</text><line x1="120.0" y1="300.0" x2="120.0" y2="60.0" stroke="#1f6f43" stroke-width="3" marker-end="url(#ah)"/><text x="108.0" y="52.0" font-size="18" text-anchor="end" font-weight="normal" font-style="normal" fill="#1c2833">B × C</text><text x="108.0" y="74.0" font-size="14" text-anchor="end" font-weight="normal" font-style="normal" fill="#1c2833">(normal to base)</text><text x="430.0" y="350.0" font-size="18" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">Volume = |A · (B × C)|</text><circle cx="120" cy="300" r="5" fill="#1c2833"/></svg>