<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" font-family="sans-serif"><title>A gas in a cylinder under a movable piston, sitting on a hot plate. Heat Q flows up from the hot plate into the gas, and the gas pushes the piston upward, doing work W on the surroundings.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<rect x="203" y="170" width="154" height="126" rx="0" fill="#dcf0e3" stroke="none" stroke-width="0" />
<path d="M200,60 L200,298 L360,298 L360,60" fill="none" stroke="#1c2833" stroke-width="4"/>
<rect x="202" y="150" width="156" height="20" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2" />
<line x1="280" y1="150" x2="280" y2="110" stroke="#1c2833" stroke-width="6"/>
<rect x="240" y="80" width="80" height="30" rx="0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2" />
<text x="280" y="101" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">load</text>
<line x1="390" y1="170" x2="390" y2="90" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<text x="400" y="125" font-size="16" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">work W done by the gas</text>
<text x="280" y="215" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">gas</text>
<text x="280" y="237" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">(the system)</text>
<rect x="170" y="302" width="220" height="24" rx="0" fill="#f5c6b8" stroke="#1c2833" stroke-width="2" />
<text x="280" y="350" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">hot plate</text>
<line x1="240" y1="318" x2="240" y2="262" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="320" y1="318" x2="320" y2="262" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<text x="190" y="280" font-size="16" text-anchor="end" font-weight="normal" font-style="normal" fill="#1c2833">heat Q in</text>
<text x="190" y="145" font-size="16" text-anchor="end" font-weight="normal" font-style="normal" fill="#1c2833">piston</text>
</svg>