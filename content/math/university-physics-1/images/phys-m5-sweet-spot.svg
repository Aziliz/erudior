<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420" role="img"><title>A uniform rod pivoted at its top end with its center of mass and center of percussion marked</title><rect x="0" y="0" width="460" height="420" fill="#ffffff"/><rect x="190" y="50" width="20" height="330" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><circle cx="200.0" cy="58.0" r="9.0" fill="#ffffff" stroke="#1c2833" stroke-width="2.5"/><circle cx="200.0" cy="58.0" r="3" fill="#1c2833"/><text x="178.0" y="64.0" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="end">pivot (hands)</text><circle cx="200.0" cy="215.0" r="7" fill="#a93226"/><text x="178.0" y="221.0" font-family="sans-serif" font-size="16" fill="#a93226" text-anchor="end">center of mass, L/2</text><circle cx="200.0" cy="270.0" r="7" fill="#1f5f99"/><text x="178.0" y="276.0" font-family="sans-serif" font-size="16" fill="#1f5f99" text-anchor="end">center of percussion,</text><text x="178.0" y="296.0" font-family="sans-serif" font-size="16" fill="#1f5f99" text-anchor="end">2L/3 from pivot</text><circle cx="320.0" cy="270.0" r="18.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5"/><line x1="300.0" y1="270.0" x2="230.0" y2="270.0" stroke="#1c2833" stroke-width="3.5" stroke-linecap="round"/><polygon points="216.0,270.0 230.0,263.7 230.0,276.3" fill="#1c2833"/><text x="350.0" y="244.0" font-family="sans-serif" font-size="16" fill="#1c2833" text-anchor="start">ball</text><line x1="240.0" y1="50.0" x2="240.0" y2="380.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><line x1="232.0" y1="50.0" x2="248.0" y2="50.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><line x1="232.0" y1="380.0" x2="248.0" y2="380.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><text x="254.0" y="185.0" font-family="sans-serif" font-size="18" fill="#1c2833" text-anchor="start" font-style="italic">L</text></svg>