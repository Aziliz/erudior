<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" font-family="sans-serif"><title>A block held under water. Short arrows push down on its top face and longer arrows push up on its deeper bottom face; equal arrows push on the sides. The difference is the upward buoyant force.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<rect x="20" y="60" width="560" height="300" rx="0" fill="#dde8f3" stroke="none" stroke-width="0" />
<line x1="20" y1="60" x2="580" y2="60" stroke="#1c2833" stroke-width="2"/>
<text x="30" y="50" font-size="16" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">surface, pressure P₀</text>
<rect x="220" y="160" width="160" height="100" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2" />
<line x1="250" y1="122" x2="250" y2="156" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="250" y1="320" x2="250" y2="264" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="122" x2="300" y2="156" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="300" y1="320" x2="300" y2="264" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="350" y1="122" x2="350" y2="156" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="350" y1="320" x2="350" y2="264" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="170" y1="185" x2="216" y2="185" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="430" y1="185" x2="384" y2="185" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="170" y1="235" x2="216" y2="235" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="430" y1="235" x2="384" y2="235" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="120" y1="62" x2="120" y2="158" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="110" y="115" font-size="16" text-anchor="end" font-weight="normal" font-style="italic" fill="#1c2833">h₁</text>
<line x1="70" y1="62" x2="70" y2="258" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="60" y="165" font-size="16" text-anchor="end" font-weight="normal" font-style="italic" fill="#1c2833">h₂</text>
<line x1="70" y1="260" x2="218" y2="260" stroke="#1c2833" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="120" y1="160" x2="218" y2="160" stroke="#1c2833" stroke-width="1" stroke-dasharray="5 4"/>
<text x="395" y="135" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">P₁ = P₀ + ρgh₁ on the top</text>
<text x="395" y="300" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">P₂ = P₀ + ρgh₂ on the bottom</text>
<text x="300" y="215" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">block</text>
<text x="300" y="352" font-size="16" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">buoyant force = (P₂ − P₁)A = weight of displaced fluid</text>
</svg>