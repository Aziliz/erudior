<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" font-family="sans-serif"><title>Energy-flow diagrams. Left, a heat engine: heat Q H flows down from the hot reservoir into the engine, work W comes out, and heat Q C flows down to the cold reservoir. Right, a refrigerator: work W goes in, heat Q C is pulled up from the cold reservoir, and heat Q H is delivered up to the hot reservoir.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect x="0" y="0" width="620" height="380" fill="#ffffff"/>
<rect x="30" y="50" width="240" height="50" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2" />
<rect x="30" y="290" width="240" height="50" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="2" />
<circle cx="150" cy="195" r="40" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="150" y="30" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Heat engine</text>
<line x1="150" y1="102" x2="150" y2="152" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<line x1="150" y1="237" x2="150" y2="287" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<line x1="192" y1="195" x2="262" y2="195" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<rect x="350" y="50" width="240" height="50" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2" />
<rect x="350" y="290" width="240" height="50" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="2" />
<circle cx="470" cy="195" r="40" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="470" y="30" font-size="17" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1c2833">Refrigerator</text>
<line x1="470" y1="152" x2="470" y2="102" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<line x1="470" y1="287" x2="470" y2="237" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
<line x1="358" y1="195" x2="428" y2="195" stroke="#1c2833" stroke-width="4" marker-end="url(#ah)"/>
</svg>