>A<tspan font-size="14" dy="5">y</tspan><tspan dy="-5"> = A sin θ</tspan></text><text x="172.0" y="296.0" font-size="18" text-anchor="start" font-weight="normal" font-style="italic" fill="#1c2833">θ</text></svg>