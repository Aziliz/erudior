<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" height="330" role="img" font-family="sans-serif"><title>A Venturi tube: a horizontal pipe that narrows in the middle, with streamlines crowding together in the narrow part. A vertical tube over the wide part holds a taller liquid column than the tube over the narrow part.</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect x="0" y="0" width="600" height="330" fill="#ffffff"/>
<path d="M20,110 L200,110 L280,150 L380,150 L460,110 L580,110 L580,250 L460,250 L380,210 L280,210 L200,250 L20,250 Z" fill="#dde8f3" stroke="none" stroke-width="0"/>
<rect x="100" y="40" width="20" height="72" rx="0" fill="#dde8f3" stroke="none" stroke-width="0" />
<rect x="320" y="100" width="20" height="52" rx="0" fill="#dde8f3" stroke="none" stroke-width="0" />
<path d="M20,110 L100,110 L100,15 M120,15 L120,110 L200,110 L280,150 L320,150 L320,15 M340,15 L340,150 L380,150 L460,110 L580,110" fill="none" stroke="#1c2833" stroke-width="3"/>
<path d="M20,250 L200,250 L280,210 L380,210 L460,250 L580,250" fill="none" stroke="#1c2833" stroke-width="3"/>
<line x1="96" y1="40" x2="124" y2="40" stroke="#1c2833" stroke-width="2"/>
<line x1="316" y1="100" x2="344" y2="100" stroke="#1c2833" stroke-width="2"/>
<path d="M20,145 L200,145 L280,165 L380,165 L460,145 L580,145" fill="none" stroke="#244d76" stroke-width="1.5" stroke-dasharray="7 5"/>
<path d="M20,215 L200,215 L280,195 L380,195 L460,215 L580,215" fill="none" stroke="#244d76" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="30" y1="180" x2="90" y2="180" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="290" y1="180" x2="375" y2="180" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="60" y="172" font-size="16" text-anchor="middle" font-weight="normal" font-style="italic" fill="#1c2833">v₁</text>
<text x="333" y="172" font-size="16" text-anchor="middle" font-weight="normal" font-style="italic" fill="#1c2833">v₂</text>
<text x="130" y="300" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">wide: slow, higher pressure</text>
<text x="400" y="300" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">narrow: fast, lower pressure</text>
<text x="150" y="58" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">taller column</text>
<text x="350" y="90" font-size="15" text-anchor="start" font-weight="normal" font-style="normal" fill="#1c2833">shorter column</text>
<text x="520" y="135" font-size="15" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1c2833">streamline</text>
</svg>