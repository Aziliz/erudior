# Round 2 cards for phys-m4 (honors lessons 14h1-14h3)
- {front: 'Work along a path (line integral)', back: '$W = \int_C\vec F\cdot d\vec\ell = \int_{t_1}^{t_2}\vec F(\vec r(t))\cdot\vec r\,''(t)\,dt$ after parametrizing the path.', topic: Conservative force fields}
- {front: 'Three equivalent statements of "conservative"', back: 'Work is path independent; work around every closed path is zero; $\vec F = -\nabla U$ for some $U$.', topic: Conservative force fields}
- {front: 'Curl test in the plane', back: '$\dfrac{\partial F_y}{\partial x} = \dfrac{\partial F_x}{\partial y}$; necessary for a conservative force, and sufficient on a region without holes.', topic: Conservative force fields}
- {front: 'Curl of $\vec F$', back: '$\nabla\times\vec F = \left(\partial_yF_z - \partial_zF_y,\ \partial_zF_x - \partial_xF_z,\ \partial_xF_y - \partial_yF_x\right)$; zero for a conservative force.', topic: Conservative force fields}
- {front: 'Why does a conservative force have zero curl?', back: 'If $F_x = -\partial U/\partial x$ and $F_y = -\partial U/\partial y$, equal mixed partials of $U$ make $\partial F_y/\partial x = \partial F_x/\partial y$.', topic: Conservative force fields}
- {front: 'Building $U$ from $\vec F$', back: 'Integrate $-F_x$ in $x$ (constant becomes $g(y, z)$), match $-\partial U/\partial y$ to $F_y$, then $z$; check $-\nabla U = \vec F$.', topic: Conservative force fields}
- {front: 'Is $\vec F = (-y, x)$ conservative?', back: 'No: $\partial F_y/\partial x = 1$ but $\partial F_x/\partial y = -1$. It circulates and does net work around loops.', topic: Conservative force fields}
- {front: 'Central force', back: '$\vec F = f(r)\hat r$; always conservative, with $U(r) = -\int f(r)\,dr$.', topic: Conservative force fields}
- {front: 'Force and equipotentials', back: '$\vec F = -\nabla U$ is perpendicular to the equipotential through each point, points toward lower $U$, and is strongest where equipotentials crowd together.', topic: Conservative force fields}
- {front: 'Green''s theorem check for loop work', back: 'Work around a counterclockwise loop in the plane $= \iint(\partial F_y/\partial x - \partial F_x/\partial y)\,dA$.', topic: Conservative force fields}
- {front: 'Equation of motion with mass flowing in or out', back: '$m\,d\vec v/dt = \vec F_{\text{ext}} + \vec u_{\text{rel}}\,dm/dt$, with $\vec u_{\text{rel}}$ the crossing mass''s velocity relative to the body.', topic: Variable-mass systems}
- {front: 'Why not $F = d(mv)/dt$ for a body losing mass?', back: 'It ignores the momentum carried by the mass that leaves and gives different answers in different inertial frames; use the relative-velocity form or a closed system.', topic: Variable-mass systems}
- {front: 'Sand leaking straight down through a moving cart''s floor', back: 'The sand leaves with the cart''s velocity ($u_{\text{rel}} = 0$), so the cart''s speed does not change.', topic: Variable-mass systems}
- {front: 'Vertical rocket in uniform gravity', back: '$v(t) = u\ln\dfrac{m_i}{m(t)} - gt$; liftoff needs thrust $uR > m_ig$.', topic: Variable-mass systems}
- {front: 'Gravity loss', back: '$gt_b$: the speed a vertical burn of duration $t_b$ loses to the rocket''s weight.', topic: Variable-mass systems}
- {front: 'Conveyor belt loading at rate $R$, speed $v$', back: 'Force $Rv$, power $Rv^2$; half becomes the load''s kinetic energy, half becomes heat.', topic: Variable-mass systems}
- {front: 'Force of a jet stopped by a wall', back: 'Momentum flux $\rho Av^2$; if the jet is turned straight back, $2\rho Av^2$.', topic: Variable-mass systems}
- {front: 'Ideal Pelton wheel', back: 'Buckets moving at half the jet speed turn the water back and leave it at rest: all of the jet''s kinetic energy is extracted (real wheels about 90%).', topic: Variable-mass systems}
- {front: 'Chain falling onto a scale (idealized)', back: 'Reading $= 3\lambda gy$: the landed weight $\lambda gy$ plus the momentum flux $\lambda v^2 = 2\lambda gy$.', topic: Variable-mass systems}
- {front: 'Reduced mass', back: '$\mu = \dfrac{m_1m_2}{m_1 + m_2}$; CM-frame momenta are $\pm\mu\vec v_{\text{rel}}$.', topic: Center-of-mass frame}
- {front: 'Kinetic energy split (König)', back: '$K = \tfrac12Mv_{\text{cm}}^2 + \tfrac12\mu v_{\text{rel}}^2$; only the second part can be lost in a collision.', topic: Center-of-mass frame}
- {front: 'Kinetic energy lost with restitution $e$', back: '$K_{\text{lost}} = (1 - e^2)\,\tfrac12\mu v_{\text{rel}}^2$.', topic: Center-of-mass frame}
- {front: 'Elastic collision in the CM frame', back: 'Each object keeps its speed; the collision only turns the pair of opposite momenta (reverses them, head-on).', topic: Center-of-mass frame}
- {front: 'Head-on elastic collision: fraction of KE to a target at rest', back: '$\dfrac{4m_1m_2}{(m_1 + m_2)^2}$; equal to 1 only for equal masses.', topic: Center-of-mass frame}
- {front: 'Why are reactor moderators made of light nuclei?', back: 'A neutron loses the most energy per collision to a nucleus of similar mass: up to all of it to hydrogen, at most 28% to carbon, under 2% to uranium-238.', topic: Center-of-mass frame}
- {front: 'Largest deflection of a heavy projectile by a light target at rest (elastic)', back: '$\sin\theta_{\max} = m_2/m_1$; for example 14.5° for an alpha particle on a proton.', topic: Center-of-mass frame}
- {front: 'Velocity circle', back: 'After an elastic collision the projectile''s lab velocity ends on a circle of radius $v_1''$ (its CM-frame speed) centered at the tip of $\vec v_{\text{cm}}$.', topic: Center-of-mass frame}
- {front: 'Why couldn''t electrons turn alpha particles back in the Geiger–Marsden experiment?', back: 'An electron is about 1/7300 of an alpha''s mass, so it can deflect an alpha by at most about 0.008°. Large-angle scattering needed a massive nucleus.', topic: Center-of-mass frame}
