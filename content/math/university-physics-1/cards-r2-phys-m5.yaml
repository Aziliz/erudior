# Round 2 cards for phys-m5 (honors lessons 19h1-19h3)
- {front: 'Slip velocity of a rolling object', back: '$v_{\text{cm}} - R\omega$ (forward spin positive); zero when rolling without slipping. Kinetic friction points opposite to it.', topic: Rolling with slipping}
- {front: 'Ball launched with no spin: what does friction do?', back: 'Points backward: slows the center ($a = -\mu_kg$) and spins it up ($\alpha = \mu_kg/(cR)$) until $v = R\omega$.', topic: Rolling with slipping}
- {front: 'Time to start rolling (launched with no spin)', back: '$t^* = \dfrac{c\,v_0}{(1 + c)\mu_kg}$', topic: Rolling with slipping}
- {front: 'Final rolling speed after skidding', back: '$v_f = \dfrac{v_0 + cR\omega_0}{1 + c}$; with no initial spin, $v_0/(1 + c)$ ($\tfrac57v_0$ for a solid sphere). Independent of $\mu_k$.', topic: Rolling with slipping}
- {front: 'Which angular momentum is conserved while a ball skids?', back: 'About a fixed point on the floor line: friction passes through it and the torques of weight and normal force cancel. Not about the center.', topic: Rolling with slipping}
- {front: 'Kinetic energy lost while skidding to rolling (no initial spin)', back: 'Fraction $\dfrac{c}{1 + c}$: $\tfrac27$ for a solid sphere, $\tfrac12$ for a hoop.', topic: Rolling with slipping}
- {front: 'Center of percussion', back: '$b = \dfrac{I_P}{Md}$ from the pivot ($d$ = pivot to CM); $\tfrac23L$ for a uniform rod held at one end. A blow there gives no jolt at the pivot.', topic: Rolling with slipping}
- {front: 'Height to strike a solid ball so it rolls at once', back: '$(1 + c)R = 1.4R$ above the table ($0.4R$ above the center).', topic: Rolling with slipping}
- {front: 'Gyroscope precession rate', back: '$\Omega = \dfrac{\tau}{L} = \dfrac{Mgr}{I\omega}$; faster spin, slower precession; independent of the tilt.', topic: Gyroscopes}
- {front: 'Direction of precession', back: '$d\vec L = \vec\tau\,dt$: the axle moves in the direction of the torque vector, at right angles to the force. Reversing the spin reverses it.', topic: Gyroscopes}
- {front: 'When is $\Omega = \tau/(I\omega)$ valid?', back: 'In the gyroscopic approximation, spin much faster than precession ($\omega \gg \Omega$).', topic: Gyroscopes}
- {front: 'Nutation', back: 'Bobbing of a gyroscope''s axis around its steady precession, e.g. after release from rest; small and quick for a fast rotor.', topic: Gyroscopes}
- {front: 'Earth''s axial precession', back: 'About 26,000 years per cycle; Sun and Moon torques on the equatorial bulge. Discovered by Hipparchus (2nd century BCE).', topic: Gyroscopes}
- {front: 'Crooked rotor (dumbbell at angle $\beta$ to the shaft)', back: '$L_\perp = 2ma^2\omega\sin\beta\cos\beta$ turns with the shaft; bearings must supply $\tau = \omega L_\perp$.', topic: Gyroscopes}
- {front: 'Static vs dynamic balance of a wheel', back: 'Static: center of mass on the axle. Dynamic: a principal axis along the axle, so $\vec L \parallel \vec\omega$ and no rotating bearing torque.', topic: Gyroscopes}
- {front: 'Flipping a spinning wheel while sitting on a free stool', back: 'Vertical $L$ is conserved: reversing the wheel''s $L_w$ gives you and the stool $2L_w$ in the wheel''s original sense.', topic: Gyroscopes}
- {front: 'Is a bicycle stable because its wheels are gyroscopes?', back: 'Contested and mostly no: a bicycle with the wheels'' spin angular momentum canceled can still be self-stable (Kooijman et al., 2011).', topic: Gyroscopes}
- {front: 'Shell theorem', back: 'Uniform shell: outside, $V = -GM/r$ (like a point mass); inside, $V = -GM/R$ constant, so $g = 0$.', topic: Tides and the shell theorem}
- {front: 'Gravity inside a uniform planet', back: '$g(r) = g_s\,r/R$, zero at the center. (The real Earth''s $g$ rises to about 10.7 m/s² at the core–mantle boundary.)', topic: Tides and the shell theorem}
- {front: 'Tunnel through a uniform planet', back: 'Simple harmonic motion, $T = 2\pi\sqrt{R/g_s}$: 84 min for Earth, 42 min one way, the same as a surface-skimming orbit.', topic: Tides and the shell theorem}
- {front: 'Tidal acceleration', back: 'About $\dfrac{2GMd}{D^3}$ outward along the line to the body (both sides), $\dfrac{GMd}{D^3}$ inward across it.', topic: Tides and the shell theorem}
- {front: 'Moon''s vs Sun''s tides', back: 'Moon $1.1\times10^{-6}$ m/s², Sun $5.1\times10^{-7}$ m/s² (0.46 as much), although the Sun''s direct pull is about 180 times the Moon''s.', topic: Tides and the shell theorem}
- {front: 'Spring and neap tides', back: 'Spring: new and full moon, Sun and Moon aligned, effects add. Neap: quarter moons, at right angles, partly cancel.', topic: Tides and the shell theorem}
- {front: 'Tidal friction', back: 'Slows Earth''s spin and passes angular momentum to the Moon''s orbit; the Moon recedes about 3.8 cm/yr. It also tidally locked the Moon.', topic: Tides and the shell theorem}
- {front: 'Roche limit', back: 'Rigid estimate $R_p(2\rho_p/\rho_m)^{1/3}$; fluid moon (Roche, 1849) $2.44R_p(\rho_p/\rho_m)^{1/3}$.', topic: Tides and the shell theorem}
