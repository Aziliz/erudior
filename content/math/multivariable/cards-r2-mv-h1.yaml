# Round 2 cards for honors module mv-h1 (lessons 90-93)
- {front: 'Gauss''s law for gravity', back: '$\iint_S\mathbf g\cdot d\mathbf S = -4\pi GM_{\text{enc}}$; differential form $\nabla\cdot\mathbf g = -4\pi G\rho$.', topic: Gravitational fields}
- {front: 'Field of a spherically symmetric body at radius $r$', back: '$g(r) = -GM_{\text{enc}}(r)/r^2$ (radial, inward): only the mass closer to the center counts.', topic: Gravitational fields}
- {front: 'Shell theorem', back: 'Outside a spherically symmetric body: same field as a point mass at the center. Inside a uniform hollow shell: zero field.', topic: Gravitational fields}
- {front: 'Field inside a uniform ball', back: '$|\mathbf g| = GMr/R^3 = g_0\,r/R$: linear in $r$, zero at the center, largest at the surface.', topic: Gravitational fields}
- {front: 'Tunnel through a uniform planet', back: 'Simple harmonic motion $x'''' = -(g_0/R)x$, period $2\pi\sqrt{R/g_0}$ (about 84 min for Earth), same as a surface-skimming orbit.', topic: Gravitational fields}
- {front: 'Potential of a thin uniform shell', back: '$\Phi = -GM/r$ outside, constant $-GM/R$ inside (so $\mathbf g = \mathbf 0$ inside).', topic: Gravitational fields}
- {front: 'Poisson''s equation for gravity', back: '$\nabla^2\Phi = 4\pi G\rho$ (from $\nabla\cdot\mathbf g = -4\pi G\rho$ and $\mathbf g = -\nabla\Phi$); $\nabla^2\Phi = 0$ in empty space.', topic: Gravitational fields}
- {front: 'Field of an infinite sheet of mass', back: '$|\mathbf g| = 2\pi G\sigma$ toward the sheet, the same at every distance (pillbox argument).', topic: Gravitational fields}
- {front: 'When does Gauss''s law find the field?', back: 'Only with symmetry (spherical, cylindrical, planar) that makes $\mathbf g\cdot\mathbf n$ constant or zero on a surface. Otherwise it is true but gives only the total flux.', topic: Gravitational fields}
- {front: 'Why Maxwell added the displacement current', back: '$\operatorname{div}\operatorname{curl}\mathbf B = 0$ would force $\nabla\cdot\mathbf J = 0$; adding $\mu_0\varepsilon_0\,\partial\mathbf E/\partial t$ restores charge conservation.', topic: Electromagnetic waves}
- {front: 'Curl of a curl', back: '$\nabla\times(\nabla\times\mathbf F) = \nabla(\nabla\cdot\mathbf F) - \nabla^2\mathbf F$ (vector Laplacian componentwise).', topic: Electromagnetic waves}
- {front: 'Wave equation for $\mathbf E$ in vacuum', back: '$\nabla^2\mathbf E = \mu_0\varepsilon_0\,\partial^2\mathbf E/\partial t^2$, speed $c = 1/\sqrt{\mu_0\varepsilon_0} \approx 2.998\times10^8$ m/s.', topic: Electromagnetic waves}
- {front: 'Plane electromagnetic wave', back: '$\mathbf E = E_0\cos(kz - \omega t)\mathbf i$, $\mathbf B = (E_0/c)\cos(kz - \omega t)\mathbf j$, $\omega = ck$: in phase, perpendicular, transverse.', topic: Electromagnetic waves}
- {front: 'Why light is transverse', back: '$\nabla\cdot\mathbf E = 0$ forces $\mathbf k\cdot\mathbf E_0 = 0$; then $\mathbf B = \frac1\omega\mathbf k\times\mathbf E$.', topic: Electromagnetic waves}
- {front: 'Electromagnetic energy density', back: '$u = \frac{\varepsilon_0}{2}|\mathbf E|^2 + \frac{1}{2\mu_0}|\mathbf B|^2$; in a plane wave the two parts are equal.', topic: Electromagnetic waves}
- {front: 'Poynting vector and theorem', back: '$\mathbf S = \frac1{\mu_0}\mathbf E\times\mathbf B$; $\partial u/\partial t + \nabla\cdot\mathbf S = -\mathbf J\cdot\mathbf E$.', topic: Electromagnetic waves}
- {front: 'Intensity of a plane wave', back: '$I = \frac{E_0B_0}{2\mu_0} = \frac12c\varepsilon_0E_0^2$ (the average of $\cos^2$ is $\frac12$).', topic: Electromagnetic waves}
- {front: 'Divergence of a cross product', back: '$\nabla\cdot(\mathbf E\times\mathbf B) = \mathbf B\cdot(\nabla\times\mathbf E) - \mathbf E\cdot(\nabla\times\mathbf B)$.', topic: Electromagnetic waves}
- {front: 'Flux of the gradient of a harmonic function', back: '$\iint_S\partial u/\partial n\,dS = \iiint\nabla^2u\,dV = 0$ through every closed surface.', topic: Harmonic functions}
- {front: 'Proof idea of the mean value property', back: 'The sphere average $A(r)$ has $A''(r) = \frac{1}{4\pi r^2}\iint\partial u/\partial n\,dS = 0$, so $A(r) = \lim_{r\to0}A = u(\mathbf p)$.', topic: Harmonic functions}
- {front: 'Maximum principle', back: 'A nonconstant harmonic function on a bounded connected region has its max and min only on the boundary.', topic: Harmonic functions}
- {front: 'Uniqueness from the maximum principle', back: 'Two solutions with the same boundary values differ by a harmonic $w$ that is 0 on the boundary, so its max and min are 0: $w = 0$.', topic: Harmonic functions}
- {front: 'Earnshaw''s theorem', back: 'No stable electrostatic equilibrium for a point charge in a charge-free region: $V$ is harmonic, so $qV$ has no strict local minimum.', topic: Harmonic functions}
- {front: 'Second-derivative test on a harmonic $f(x, y)$', back: '$f_{xx} = -f_{yy}$, so $D = -f_{xx}^2 - f_{xy}^2 \le 0$: never a strict local max or min.', topic: Harmonic functions}
- {front: 'Potential flow', back: 'Irrotational + incompressible: $\mathbf v = \nabla\phi$, $\nabla^2\phi = 0$, and $\partial\phi/\partial n = 0$ on solid walls.', topic: Harmonic functions}
- {front: 'Flow past a cylinder', back: '$\phi = U(r + a^2/r)\cos\theta$; on the wall the speed is $2U|\sin\theta|$: stagnation points front and back, $2U$ at the sides.', topic: Harmonic functions}
- {front: 'd''Alembert''s paradox', back: 'Ideal potential flow gives zero drag on a cylinder; real drag comes from viscosity and the wake.', topic: Harmonic functions}
- {front: 'Gaussian and mean curvature', back: '$K = \kappa_1\kappa_2$ and $H = (\kappa_1 + \kappa_2)/2$, from the principal curvatures.', topic: Curvature of surfaces}
- {front: 'Principal curvatures at a horizontal tangent plane', back: 'Eigenvalues of the Hessian $\mathcal H$ of $z = f(x, y)$; normal curvature is $\mathbf u^T\mathcal H\mathbf u$ and $K = \det\mathcal H$.', topic: Curvature of surfaces}
- {front: 'Gaussian curvature of a graph', back: '$K = \dfrac{f_{xx}f_{yy} - f_{xy}^2}{(1 + f_x^2 + f_y^2)^2}$.', topic: Curvature of surfaces}
- {front: 'Euler''s theorem on normal curvature', back: '$\kappa(\theta) = \kappa_1\cos^2\theta + \kappa_2\sin^2\theta$, with $\theta$ measured from the first principal direction.', topic: Curvature of surfaces}
- {front: 'Sign of $K$', back: '$K > 0$ elliptic (dome); $K < 0$ hyperbolic (saddle); $K = 0$ parabolic (cylinder) or planar.', topic: Curvature of surfaces}
- {front: 'Theorema Egregium', back: 'Gauss, 1827: $K$ is intrinsic (unchanged by bending without stretching). So no flat map of a sphere keeps all distances.', topic: Curvature of surfaces}
- {front: 'Gauss–Bonnet for a geodesic triangle', back: '$\alpha + \beta + \gamma = \pi + \iint_T K\,dA$; on a sphere the angle excess is area$/R^2$.', topic: Curvature of surfaces}
- {front: 'Gauss–Bonnet for a closed surface', back: '$\iint_S K\,dA = 2\pi\chi(S)$, $\chi = V - E + F = 2 - 2g$: $4\pi$ for a sphere, 0 for a torus.', topic: Curvature of surfaces}
- {front: 'Curvature of a torus', back: '$K = \dfrac{\cos v}{b(a + b\cos v)}$: $+4\pi$ total on the outer half, $-4\pi$ on the inner half.', topic: Curvature of surfaces}
