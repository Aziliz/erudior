<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" width="500" height="470" font-family="Arial, Helvetica, sans-serif">
<title>Gauss's law and a spherical shell of mass</title>
<rect x="0" y="0" width="500" height="470" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<circle cx="250" cy="235" r="190" fill="#dde8f3" fill-opacity="0.35" stroke="#1c2833" stroke-width="2" stroke-dasharray="9 6"/>
<circle cx="250" cy="235" r="112" fill="#ffffff" stroke="#f7ebcf" stroke-width="16"/>
<circle cx="250" cy="235" r="112" fill="none" stroke="#1c2833" stroke-width="2.5"/>
<circle cx="250" cy="235" r="55" fill="#dcf0e3" fill-opacity="0.6" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="250" cy="235" r="4.5" fill="#1c2833"/>
<line x1="426.8" y1="411.8" x2="388.6" y2="373.6" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="73.2" y1="411.8" x2="111.4" y2="373.6" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="73.2" y1="58.2" x2="111.4" y2="96.4" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="426.8" y1="58.2" x2="388.6" y2="96.4" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<text x="250.0" y="167.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">Gaussian sphere</text>
<text x="250.0" y="257.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">r &lt; R:  g = 0</text>
<text x="250.0" y="101.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">shell of mass M, radius R</text>
<text x="250.0" y="35.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">Gaussian sphere, r &gt; R</text>
<text x="442.0" y="431.0" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833" font-style="italic">g</text>
<text x="250.0" y="449.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">flux through it = −4πGM</text>
</svg>
