# Round 2 cards for module mv-m5 (honors lessons 24h1 and 24h2)
- {front: 'Midpoint rule for $\iint_R f\,dA$', back: '$M = \Delta A\sum f(\text{center of each sub-rectangle})$', topic: Numerical double integration}
- {front: 'Midpoint rule error (leading term)', back: '$\iint_R f\,dA - M \approx \dfrac{h^2}{24}\iint_R f_{xx}\,dA + \dfrac{k^2}{24}\iint_R f_{yy}\,dA$', topic: Numerical double integration}
- {front: 'Functions the 2D midpoint rule integrates exactly', back: 'Every $a + bx + cy + dxy$ (the linear and mixed terms average out about each center).', topic: Numerical double integration}
- {front: 'Effect of halving $h$ and $k$ on the midpoint error', back: 'The error drops by about a factor of 4 (order 2).', topic: Numerical double integration}
- {front: 'Simpson weights on one $3\times3$ panel', back: 'Corners 1, edge midpoints 4, center 16, all times $\dfrac{hk}{9}$', topic: Numerical double integration}
- {front: 'Simpson''s rule in two variables: exactness and error', back: 'Exact for degree at most 3 in each variable; error about proportional to $h^4$ (halving $h$ divides it by about 16). Needs an even number of subintervals in each direction.', topic: Numerical double integration}
- {front: 'Midpoint estimate of a volume from a grid of depths', back: 'Volume $\approx \Delta A\times$(sum of the depths at the centers of the grid squares)', topic: Numerical double integration}
- {front: 'Monte Carlo estimate of $\iint_D f\,dA$', back: '$A(B)\cdot\dfrac1N\sum_{i=1}^N g(P_i)$, with $P_i$ uniform in a box $B \supseteq D$, $g = f$ on $D$ and $0$ off $D$', topic: Monte Carlo integration}
- {front: 'Monte Carlo area by counting hits', back: 'Area of $D \approx A(B)\times\dfrac{\text{points in } D}{N}$', topic: Monte Carlo integration}
- {front: 'Standard error of a Monte Carlo estimate', back: 'About $A(B)\,s/\sqrt N$; 100 times the points for one more digit', topic: Monte Carlo integration}
- {front: 'Typical error with $N$ points in $d$ dimensions', back: 'Midpoint $N^{-2/d}$, Simpson $N^{-4/d}$, Monte Carlo $N^{-1/2}$ (smooth integrands)', topic: Monte Carlo integration}
- {front: 'Improper double integral of $f \ge 0$', back: '$\iint_D f\,dA = \lim_{n\to\infty}\iint_{D_n}f\,dA$ for an exhaustion $D_1 \subseteq D_2 \subseteq \cdots$ of $D$; every exhaustion gives the same value', topic: Improper double integrals}
- {front: 'Gaussian squeeze between disks and squares', back: '$\pi\left(1 - e^{-R^2}\right) \le \left(\int_{-R}^R e^{-x^2}dx\right)^2 \le \pi\left(1 - e^{-2R^2}\right)$', topic: Improper double integrals}
- {front: '$\iint_{r\le1}r^{-q}\,dA$', back: '$\dfrac{2\pi}{2 - q}$ if $q < 2$; diverges if $q \ge 2$', topic: Improper double integrals}
- {front: '$\iint_{r\ge1}r^{-q}\,dA$', back: '$\dfrac{2\pi}{q - 2}$ if $q > 2$; diverges if $q \le 2$', topic: Improper double integrals}
- {front: 'Comparison test for double integrals', back: '$0 \le f \le g$ and $\iint g < \infty$ imply $\iint f < \infty$', topic: Improper double integrals}
- {front: 'Tonelli''s theorem', back: 'If $f \ge 0$, the double integral equals both iterated integrals (finite or infinite).', topic: Fubini and Tonelli}
- {front: 'Fubini''s theorem (general form)', back: 'If $\iint_D|f|\,dA < \infty$, both iterated integrals exist and equal $\iint_D f\,dA$.', topic: Fubini and Tonelli}
- {front: 'A function whose two iterated integrals disagree', back: '$\dfrac{x^2 - y^2}{(x^2 + y^2)^2}$ on $[0,1]^2$: $\tfrac\pi4$ one way, $-\tfrac\pi4$ the other; $\iint|f| = \infty$', topic: Fubini and Tonelli}
- {front: 'Race of two independent exponential waiting times', back: 'Rates $a$ and $b$: $P(X < Y) = \dfrac{a}{a + b}$', topic: Fubini and Tonelli}
