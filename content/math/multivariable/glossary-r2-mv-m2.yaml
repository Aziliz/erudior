# Round 2 glossary for mv-m2 (honors lessons 10h1 and 10h2)
- term: Frenet–Serret formulas
  aliases: [Frenet-Serret formulas, Frenet–Serret formula, Frenet-Serret formula]
  definition: 'The derivatives of the TNB frame with respect to arc length: $\mathbf T'' = \kappa\mathbf N$, $\mathbf N'' = -\kappa\mathbf T + \tau\mathbf B$, $\mathbf B'' = -\tau\mathbf N$.'
  topic: Frenet–Serret formulas
- term: Darboux vector
  definition: 'The vector $\boldsymbol\omega = \tau\mathbf T + \kappa\mathbf B$; each frame vector satisfies $\mathbf X'' = \boldsymbol\omega\times\mathbf X$, so the TNB frame turns at the rate $\sqrt{\kappa^2 + \tau^2}$ per unit length.'
  topic: Frenet–Serret formulas
- term: intrinsic
  definition: 'Of a curve''s property: determined by the curve''s own shape, so unchanged by moving or rotating it. Curvature and torsion are intrinsic.'
  topic: Frenet–Serret formulas
- term: fundamental theorem of space curves
  definition: 'Given continuous $\kappa(s) > 0$ and $\tau(s)$, there is a curve parametrized by arc length with that curvature and torsion, unique up to a rotation and translation.'
  topic: Frenet–Serret formulas
- term: transition curve
  aliases: [transition curves, transition spiral, easement curve]
  definition: 'A stretch of road or track whose curvature changes gradually from 0 (straight) to $1/R$ (a circular arc), so that sideways acceleration builds up smoothly.'
  topic: Frenet–Serret formulas
- term: clothoid
  aliases: [Euler spiral, Cornu spiral, clothoids]
  definition: 'The plane curve whose curvature is proportional to arc length, $\kappa = s/A^2$; its coordinates are Fresnel integrals. Used as a transition curve on railways and highways.'
  topic: Frenet–Serret formulas
- term: jerk
  definition: 'The rate of change of acceleration with time, in m/s³. Along a clothoid at constant speed the lateral jerk is constant, $v^3/(RL)$.'
  topic: Frenet–Serret formulas
- term: Kepler's laws
  aliases: [Kepler's laws of planetary motion]
  definition: 'Planets move on ellipses with the Sun at a focus; the Sun–planet line sweeps equal areas in equal times; $T^2$ is proportional to $a^3$. Newton derived all three from an inverse-square law of gravitation.'
  topic: Kepler's laws
- term: Kepler's first law
  definition: 'Each planet moves on an ellipse with the Sun at one focus; in polar form $r = \dfrac{h^2/GM}{1 + e\cos\theta}$.'
  topic: Kepler's laws
- term: Kepler's second law
  aliases: [law of equal areas]
  definition: 'The line from the Sun to a planet sweeps out equal areas in equal times: $dA/dt = h/2$ is constant. It holds for any central force.'
  topic: Central forces
- term: Kepler's third law
  definition: 'The square of the orbital period is proportional to the cube of the semi-major axis: $T^2 = \dfrac{4\pi^2}{GM}a^3$ (in years and AU around the Sun, $T^2 = a^3$).'
  topic: Kepler's laws
- term: central force
  aliases: [central forces]
  definition: 'A force that always points along the line through a fixed center, so the acceleration is parallel to $\mathbf r$. It keeps $\mathbf h = \mathbf r\times\mathbf v$ constant.'
  topic: Central forces
- term: perihelion
  definition: 'The point of an orbit around the Sun closest to the Sun, at distance $r_p = a(1 - e)$; the planet moves fastest there.'
  topic: Kepler's laws
- term: aphelion
  definition: 'The point of an orbit around the Sun farthest from the Sun, at distance $r_a = a(1 + e)$; the planet moves slowest there.'
  topic: Kepler's laws
- term: conic section
  aliases: [conic, conics, conic sections]
  definition: 'A circle, ellipse, parabola or hyperbola. With a focus at the origin, $r = \dfrac{p}{1 + e\cos\theta}$.'
  topic: Kepler's laws
- term: eccentricity
  definition: 'The number $e$ in $r = p/(1 + e\cos\theta)$ that sets a conic''s shape: $e = 0$ circle, $0 < e < 1$ ellipse, $e = 1$ parabola, $e > 1$ hyperbola.'
  topic: Kepler's laws
- term: semi-major axis
  definition: 'Half the longest diameter of an ellipse, $a$; for an orbit, the average of the perihelion and aphelion distances.'
  topic: Kepler's laws
- term: astronomical unit
  aliases: [astronomical units, AU]
  definition: 'A unit of length of exactly 149,597,870,700 m, about Earth''s average distance from the Sun. In years and AU, Kepler''s third law for the Sun is $T^2 = a^3$.'
  topic: Kepler's laws
