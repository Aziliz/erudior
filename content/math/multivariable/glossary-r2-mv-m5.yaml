# Round 2 glossary entries for module mv-m5 (honors lessons 24h1 and 24h2)
- term: midpoint rule
  aliases: [midpoint rules]
  definition: 'An approximation of $\iint_R f\,dA$: cut $R$ into sub-rectangles of area $\Delta A$ and add $f(\text{center})\,\Delta A$ over all of them. Its error is about $\frac{h^2}{24}\iint f_{xx}\,dA + \frac{k^2}{24}\iint f_{yy}\,dA$, so it has order of accuracy 2.'
  topic: Numerical double integration
- term: Simpson's rule
  aliases: [Simpson rule]
  definition: 'An approximation that fits parabolas through equally spaced values. On one interval: $\frac h3\big(f_0 + 4f_1 + f_2\big)$. In two variables the weights are products of $1, 4, 1$ (corners 1, edge midpoints 4, center 16, times $\frac{hk}{9}$). It is exact for polynomials of degree at most 3 in each variable, and its error is about proportional to $h^4$.'
  topic: Numerical double integration
- term: order of accuracy
  definition: 'The power $p$ for which a numerical method''s error is roughly proportional to $h^p$, where $h$ is the step size. The midpoint rule has order 2 (halving $h$ divides the error by about 4); Simpson''s rule has order 4.'
  topic: Numerical double integration
- term: Monte Carlo integration
  aliases: [Monte Carlo method, Monte Carlo]
  definition: 'Estimating an integral from random samples: with $N$ uniform random points in a box $B$ containing $D$, $\iint_D f\,dA \approx A(B)\cdot\frac1N\sum g(P_i)$, where $g = f$ on $D$ and $0$ elsewhere. The error shrinks like $1/\sqrt N$ in any number of dimensions.'
  topic: Monte Carlo integration
- term: standard error
  definition: 'The standard deviation of an estimate that comes from random sampling. For a Monte Carlo integral it is about $A(B)\,s/\sqrt N$, where $s$ is the standard deviation of the sampled values; the estimate is within two standard errors of the true value roughly 95% of the time.'
  topic: Monte Carlo integration
- term: curse of dimensionality
  definition: 'The rapid growth in work for grid methods as the number of variables grows: a grid with $n$ points per direction in $d$ dimensions needs $n^d$ points. It is the main reason Monte Carlo methods are used for integrals in many variables.'
  topic: Monte Carlo integration
- term: improper double integral
  aliases: [improper double integrals]
  definition: 'A double integral over an unbounded region, or of a function that is unbounded on the region. It is defined as a limit of integrals over bounded regions that avoid the trouble (an exhaustion), and it converges if that limit is finite.'
  topic: Improper double integrals
- term: exhaustion
  aliases: [exhaustions, exhausting sequence]
  definition: 'A sequence of bounded regions $D_1 \subseteq D_2 \subseteq \cdots$, on each of which the integrand is continuous and bounded, that together fill up a region $D$. For $f \ge 0$, every exhaustion gives the same value of $\lim\iint_{D_n}f\,dA$.'
  topic: Improper double integrals
- term: absolutely integrable
  aliases: [absolute integrability]
  definition: 'Said of a function $f$ on a region $D$ when $\iint_D|f|\,dA$ is finite. For a function that changes sign, this is what makes an improper double integral well defined, and it is the hypothesis of the general Fubini theorem.'
  topic: Fubini and Tonelli
- term: comparison test
  definition: 'If $0 \le f \le g$ on $D$ and $\iint_D g\,dA$ converges, then $\iint_D f\,dA$ converges; if $\iint_D f\,dA$ diverges, so does $\iint_D g\,dA$. Powers $r^{-q}$ of the distance are the usual functions to compare with.'
  topic: Improper double integrals
- term: Tonelli's theorem
  aliases: [Tonelli theorem]
  definition: 'For a nonnegative integrand, the double integral and both iterated integrals are equal, whether finite or infinite; so nonnegative improper integrals may be iterated in either order. Published by Leonida Tonelli in 1909.'
  topic: Fubini and Tonelli
