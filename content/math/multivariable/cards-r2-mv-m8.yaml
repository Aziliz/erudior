# Round 2 notecards for mv-m8 (honors lessons 38h1, 38h2)
- {front: 'Divergence theorem proof: first step', back: 'Split $\mathbf F = P\mathbf i + Q\mathbf j + R\mathbf k$; prove $\iint_S R\,\mathbf k\cdot\mathbf n\,dS = \iiint_E R_z\,dV$ and the two similar statements.', topic: Proofs of the big theorems}
- {front: 'Volume side of the $\mathbf k$ part (type 1 solid)', back: 'FTC in $z$: $\iiint_E R_z\,dV = \iint_D[R(x, y, u_2) - R(x, y, u_1)]\,dA$', topic: Proofs of the big theorems}
- {front: 'Surface side of the $\mathbf k$ part', back: 'Top: $+\iint_D R(x, y, u_2)\,dA$; bottom (outward is down): $-\iint_D R(x, y, u_1)\,dA$; vertical side: 0.', topic: Proofs of the big theorems}
- {front: 'Stokes for $z = g(x, y)$: reduction to the plane', back: '$\oint_C P\,dx + Q\,dy + R\,dz = \oint_{C_1}(P + Rg_x)\,dx + (Q + Rg_y)\,dy$, using $dz = g_x\,dx + g_y\,dy$', topic: Proofs of the big theorems}
- {front: 'Stokes for a graph: what Green''s integrand becomes', back: '$(Q_x - P_y) - g_x(R_y - Q_z) - g_y(P_z - R_x) = \operatorname{curl}\mathbf F\cdot\langle -g_x, -g_y, 1\rangle$ (chain rule and Clairaut)', topic: Proofs of the big theorems}
- {front: 'Coordinate-free divergence', back: '$\operatorname{div}\mathbf F(P_0) = \lim_{\epsilon\to0}\dfrac{1}{V_\epsilon}\iint_{\partial B_\epsilon}\mathbf F\cdot\mathbf n\,dS$', topic: Proofs of the big theorems}
- {front: 'Why the Divergence theorem fails for $\mathbf x/|\mathbf x|^3$ on a ball about 0', back: 'The partial derivatives are not continuous (not even defined) at the origin, so the FTC step breaks.', topic: Proofs of the big theorems}
- {front: 'Who first stated Stokes'' theorem?', back: 'William Thomson (Lord Kelvin), in an 1850 letter to Stokes; Stokes set it on the 1854 Smith''s Prize exam.', topic: Proofs of the big theorems}
- {front: 'First general proof of the Divergence theorem', back: 'Mikhail Ostrogradsky, 1826 (earlier uses by Lagrange, 1762, and Gauss, 1813).', topic: Proofs of the big theorems}
- {front: 'Generalized Stokes theorem', back: '$\int_{\partial M}\omega = \int_M d\omega$: FTC, line-integral theorem, Green, Stokes and Divergence are special cases.', topic: Proofs of the big theorems}
- {front: 'Product rule for $\nabla\cdot(f\mathbf F)$', back: '$\nabla f\cdot\mathbf F + f\,\nabla\cdot\mathbf F$', topic: Vector product rules}
- {front: 'Product rule for $\nabla\times(f\mathbf F)$', back: '$\nabla f\times\mathbf F + f\,\nabla\times\mathbf F$', topic: Vector product rules}
- {front: '$\nabla\cdot(\mathbf F\times\mathbf G)$', back: '$\mathbf G\cdot(\nabla\times\mathbf F) - \mathbf F\cdot(\nabla\times\mathbf G)$', topic: Vector product rules}
- {front: 'Curl of a curl', back: '$\nabla\times(\nabla\times\mathbf F) = \nabla(\nabla\cdot\mathbf F) - \nabla^2\mathbf F$', topic: Vector product rules}
- {front: 'Integration by parts in 3D', back: '$\iiint_E f\,\nabla\cdot\mathbf F\,dV = \iint_S f\,\mathbf F\cdot\mathbf n\,dS - \iiint_E\nabla f\cdot\mathbf F\,dV$', topic: Vector product rules}
- {front: 'Green''s first identity', back: '$\iiint_E(u\nabla^2v + \nabla u\cdot\nabla v)\,dV = \iint_S u\,\partial_nv\,dS$', topic: Green's identities}
- {front: 'Green''s second identity', back: '$\iiint_E(u\nabla^2v - v\nabla^2u)\,dV = \iint_S(u\,\partial_nv - v\,\partial_nu)\,dS$', topic: Green's identities}
- {front: 'Uniqueness for Dirichlet and Neumann problems', back: 'Dirichlet: at most one solution. Neumann: unique up to a constant. Proof: energy identity for the difference $w$ gives $\iiint|\nabla w|^2 = 0$.', topic: Green's identities}
- {front: 'Neumann compatibility condition', back: '$\nabla^2u = f$, $\partial_nu = h$ needs $\iint_S h\,dS = \iiint_E f\,dV$ (net boundary flow balances the sources).', topic: Green's identities}
- {front: 'Flux of $\nabla u$ for harmonic $u$', back: 'Zero through every closed surface (in a region where $u$ is harmonic).', topic: Green's identities}
