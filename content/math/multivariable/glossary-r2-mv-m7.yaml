# Round 2 glossary for mv-m7 (honors lessons 32h1 and 32h2)
- term: punctured plane
  definition: 'The plane with one point (usually the origin) removed. It is connected but not simply connected.'
  topic: Fields on regions with holes
- term: vortex field
  definition: 'The field $\mathbf V = \left\langle\frac{-y}{x^2 + y^2}, \frac{x}{x^2 + y^2}\right\rangle$ on the punctured plane. It is locally the gradient of the polar angle $\theta$, has $Q_x = P_y$, and has circulation $2\pi$ once around the origin.'
  topic: Fields on regions with holes
- term: locally conservative
  definition: 'Having a potential function on a small disk around every point of the region, but not necessarily on the whole region. On a simply connected region, locally conservative fields are conservative.'
  topic: Fields on regions with holes
- term: winding number
  aliases: [winding numbers]
  definition: 'The net number of counterclockwise turns a closed curve makes around a point (clockwise turns count as negative): $w = \frac{1}{2\pi}\oint_C\frac{-y\,dx + x\,dy}{x^2 + y^2}$ for the origin. Always an integer.'
  topic: Winding number
- term: deformation principle
  definition: 'If $Q_x = P_y$ on the region between two simple closed curves, oriented the same way, then the field has the same circulation around both curves. It follows from Green''s theorem for a region with a hole.'
  topic: Fields on regions with holes
- term: point vortex
  aliases: [point vortices]
  definition: 'An idealized swirling flow with velocity field $\frac{\Gamma}{2\pi}\mathbf V$, where $\mathbf V$ is the vortex field: circulation $\Gamma$ around any loop that encloses it once, and zero curl everywhere else.'
  topic: Fields on regions with holes
- term: shoelace formula
  aliases: [surveyor's formula, Gauss's area formula]
  definition: 'The area of a polygon with vertices $(x_1, y_1), \dots, (x_n, y_n)$ listed counterclockwise: $A = \tfrac12\sum(x_iy_{i+1} - x_{i+1}y_i)$, with $(x_{n+1}, y_{n+1}) = (x_1, y_1)$. It is Green''s area formula applied edge by edge.'
  topic: Shoelace formula
- term: signed area
  definition: 'Area with a sign that records orientation: positive when the boundary runs counterclockwise, negative when it runs clockwise. The triangle $O$, $(x_a, y_a)$, $(x_b, y_b)$ has signed area $\tfrac12(x_ay_b - x_by_a)$.'
  topic: Shoelace formula
- term: orientation test
  definition: 'Using the sign of a shoelace sum (or of $x_ay_b - x_by_a$ for a triangle) to tell whether points run counterclockwise (positive) or clockwise (negative).'
  topic: Shoelace formula
