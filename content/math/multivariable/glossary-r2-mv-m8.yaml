# Round 2 glossary for mv-m8 (honors lessons 38h1, 38h2)
- term: simple solid region
  aliases: [simple solid regions, simple solid]
  definition: 'A solid that is of type 1 (between two graphs over a region in the $xy$-plane) and also of the matching types for the $x$- and $y$-directions, such as a ball, a box or a cylinder. The Divergence theorem is first proved for these.'
  topic: Proofs of the big theorems
- term: generalized Stokes theorem
  aliases: [generalized Stokes' theorem]
  definition: 'The statement $\int_{\partial M}\omega = \int_M d\omega$ about differential forms, of which the FTC, the fundamental theorem for line integrals, Green''s, Stokes'' and the Divergence theorem are all special cases.'
  topic: Proofs of the big theorems
- term: normal derivative
  aliases: [normal derivatives]
  definition: 'On a surface with unit normal $\mathbf n$, the directional derivative $\dfrac{\partial v}{\partial n} = \nabla v\cdot\mathbf n$ of a function $v$ in the normal direction.'
  topic: Green's identities
- term: Green's first identity
  definition: '$\iiint_E\left(u\,\nabla^2v + \nabla u\cdot\nabla v\right)dV = \iint_S u\,\dfrac{\partial v}{\partial n}\,dS$, from the Divergence theorem applied to $u\nabla v$.'
  topic: Green's identities
- term: Green's second identity
  definition: '$\iiint_E\left(u\,\nabla^2v - v\,\nabla^2u\right)dV = \iint_S\left(u\,\dfrac{\partial v}{\partial n} - v\,\dfrac{\partial u}{\partial n}\right)dS$, the first identity minus its copy with $u$ and $v$ swapped.'
  topic: Green's identities
- term: Poisson's equation
  definition: 'The PDE $\nabla^2u = f$, where $f$ describes sources; with $f = 0$ it is Laplace''s equation.'
  topic: Green's identities
- term: Dirichlet problem
  aliases: [Dirichlet problems, Dirichlet condition]
  definition: 'Solving $\nabla^2u = f$ in a region with the values of $u$ prescribed on the boundary. It has at most one solution.'
  topic: Green's identities
- term: Neumann problem
  aliases: [Neumann problems, Neumann condition]
  definition: 'Solving $\nabla^2u = f$ in a region with the normal derivative $\partial u/\partial n$ prescribed on the boundary. Solutions differ only by a constant, and exist only if $\iint_S\partial u/\partial n\,dS = \iiint_E f\,dV$.'
  topic: Green's identities
- term: energy identity
  definition: 'Green''s first identity with $u = v = w$: $\iiint_E|\nabla w|^2\,dV = \iint_S w\,\dfrac{\partial w}{\partial n}\,dS - \iiint_E w\,\nabla^2w\,dV$; used to prove uniqueness.'
  topic: Green's identities
