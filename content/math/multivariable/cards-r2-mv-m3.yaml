# Module 3 round 2: cards for the honors lessons
# 16h1 Differentiability in depth
- {front: 'Definition: $f$ differentiable at $(a, b)$', back: '$\dfrac{f(a+h, b+k) - f(a,b) - f_xh - f_yk}{\sqrt{h^2 + k^2}} \to 0$: the tangent plane''s error shrinks faster than the distance.', topic: Differentiability}
- {front: 'What differentiability at a point guarantees', back: 'Continuity there, both partials, and $D_{\mathbf u}f = \nabla f\cdot\mathbf u$ for every unit $\mathbf u$.', topic: Differentiability}
- {front: 'Sufficient condition for differentiability', back: 'Partials exist near the point and are continuous at it ($C^1$). Proof: the mean value theorem on an $x$-leg and a $y$-leg.', topic: Differentiability}
- {front: 'Partials exist but not continuous', back: '$\dfrac{xy}{x^2 + y^2}$, $f(0,0) = 0$: $f_x = f_y = 0$ at the origin, but $f = \tfrac12$ on $y = x$.', topic: Differentiability}
- {front: 'Continuous, all directional derivatives, not differentiable', back: '$\dfrac{x^2y}{x^2 + y^2}$: $D_{\mathbf u}f(0,0) = u_1^2u_2$, not $\nabla f\cdot\mathbf u = 0$.', topic: Differentiability}
- {front: 'All directional derivatives exist, yet not continuous', back: '$\dfrac{xy^2}{x^2 + y^4}$: slopes $u_2^2/u_1$ along lines, but $f = \tfrac12$ on $x = y^2$.', topic: Differentiability}
- {front: 'Differentiable with discontinuous partials', back: '$(x^2 + y^2)\sin\dfrac{1}{\sqrt{x^2 + y^2}}$: $|f| \le \rho^2$ gives differentiability, but $f_x$ oscillates near 0.', topic: Differentiability}
- {front: 'Mixed partials that differ', back: '$\dfrac{xy(x^2 - y^2)}{x^2 + y^2}$: $f_{xy}(0,0) = -1$, $f_{yx}(0,0) = 1$; the mixed partials are not continuous at 0.', topic: Mixed partials}
- {front: 'Idea of the proof of Clairaut''s theorem', back: 'The second difference $\Delta$ equals $h^2f_{xy}(p) = h^2f_{yx}(q)$ (mean value theorem twice, in each order); let $h \to 0$ using continuity.', topic: Mixed partials}
# 16h2 The derivative as a matrix
- {front: 'Derivative matrix of $\mathbf F: \mathbb R^n \to \mathbb R^m$', back: '$m\times n$ matrix of $\partial F_i/\partial x_j$. Row $i$ = $\nabla F_i$; column $j$ = $\partial\mathbf F/\partial x_j$.', topic: Derivative matrices}
- {front: 'Linear approximation of a map', back: '$\mathbf F(\mathbf a + \mathbf h) \approx \mathbf F(\mathbf a) + D\mathbf F(\mathbf a)\,\mathbf h$', topic: Derivative matrices}
- {front: 'Matrix chain rule', back: '$D(\mathbf G\circ\mathbf F)(\mathbf a) = D\mathbf G(\mathbf F(\mathbf a))\,D\mathbf F(\mathbf a)$: outer (at $\mathbf F(\mathbf a)$) times inner.', topic: Derivative matrices}
- {front: 'Derivative matrix of the polar map', back: '$D\mathbf P = \begin{bmatrix}\cos\theta & -r\sin\theta\\ \sin\theta & r\cos\theta\end{bmatrix}$, $\det D\mathbf P = r$', topic: Derivative matrices}
- {front: 'Gradient in polar coordinates', back: '$f_x = z_r\cos\theta - \dfrac{z_\theta\sin\theta}{r}$, $f_y = z_r\sin\theta + \dfrac{z_\theta\cos\theta}{r}$, $|\nabla f|^2 = z_r^2 + \dfrac{z_\theta^2}{r^2}$', topic: Derivative matrices}
- {front: 'Inverse function theorem', back: '$C^1$ and $\det D\mathbf F(\mathbf a) \ne 0$ ⇒ a local $C^1$ inverse near $\mathbf a$, with $D(\mathbf F^{-1})(\mathbf F(\mathbf a)) = D\mathbf F(\mathbf a)^{-1}$.', topic: Derivative matrices}
- {front: 'Why the inverse is only local (polar map)', back: '$\det = r \ne 0$ for $r > 0$, but $\theta$ and $\theta + 2\pi$ give the same point, so $\mathbf P$ is not one-to-one overall.', topic: Derivative matrices}
- {front: 'Sizes in the chain rule', back: '$(p\times m)(m\times n) = p\times n$; if the sizes do not fit, the order is wrong.', topic: Derivative matrices}
- {front: 'Derivative matrix vs Jacobian', back: 'The derivative matrix is the whole matrix of partials; the Jacobian (Lesson 28) is the determinant of a square one.', topic: Derivative matrices}
# 16h3 PDEs and the chain rule
- {front: 'Heat, wave and Laplace equations', back: '$u_t = \alpha u_{xx}$; $u_{tt} = c^2u_{xx}$; $u_{xx} + u_{yy} = 0$', topic: Heat and wave equations}
- {front: 'Sine solutions of the heat equation', back: '$u = e^{-\alpha n^2t}\sin nx$ solves $u_t = \alpha u_{xx}$: higher frequencies decay faster.', topic: Heat and wave equations}
- {front: 'Superposition principle', back: 'For a linear homogeneous PDE, $c_1u_1 + c_2u_2$ is a solution whenever $u_1$ and $u_2$ are.', topic: Heat and wave equations}
- {front: 'General solution of $u_{tt} = c^2u_{xx}$', back: '$u = F(x - ct) + G(x + ct)$: a right-moving wave plus a left-moving wave, each at speed $c$.', topic: Heat and wave equations}
- {front: 'Characteristic coordinates', back: '$\xi = x - ct$, $\eta = x + ct$ turn the wave equation into $U_{\xi\eta} = 0$.', topic: Heat and wave equations}
- {front: 'd''Alembert''s formula', back: '$u = \tfrac12[\varphi(x - ct) + \varphi(x + ct)] + \tfrac{1}{2c}\int_{x-ct}^{x+ct}\psi(s)\,ds$', topic: Heat and wave equations}
- {front: 'Laplace''s equation in polar form', back: '$u_{rr} + \tfrac1r u_r + \tfrac{1}{r^2}u_{\theta\theta} = 0$', topic: Laplace's equation}
- {front: 'Harmonic functions in polar form', back: '$\ln r$ and $r^n\cos n\theta$, $r^n\sin n\theta$ (for example $r^2\cos2\theta = x^2 - y^2$).', topic: Laplace's equation}
- {front: 'Mean value property and maximum principle', back: 'A harmonic function equals its average on circles; if not constant, it has no interior max or min.', topic: Laplace's equation}
