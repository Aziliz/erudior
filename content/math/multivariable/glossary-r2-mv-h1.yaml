# Round 2 glossary for honors module mv-h1 (lessons 90-93)
- term: gravitational field
  aliases: [gravitational fields]
  definition: 'The gravitational force per unit mass at each point, $\mathbf g$; for a point mass $M$ at the origin, $\mathbf g = -GM\mathbf x/|\mathbf x|^3$.'
  topic: Gravitational fields
- term: Gauss's law for gravity
  definition: 'The flux of the gravitational field through any closed surface is $-4\pi G$ times the enclosed mass: $\iint_S\mathbf g\cdot d\mathbf S = -4\pi GM_{\text{enc}}$; in differential form $\nabla\cdot\mathbf g = -4\pi G\rho$.'
  topic: Gravitational fields
- term: spherically symmetric
  aliases: [spherical symmetry]
  definition: 'Of a mass or charge distribution: its density depends only on the distance from a center. Its field is then radial with a magnitude depending only on that distance.'
  topic: Gravitational fields
- term: shell theorem
  definition: 'Outside a spherically symmetric body, its gravity equals that of a point with the same mass at the center; inside a uniform hollow shell, the shell''s gravity is zero. Proved by Newton (1687); quick with Gauss''s law.'
  topic: Gravitational fields
- term: gravitational potential
  definition: 'Potential energy per unit mass, $\Phi$, with $\mathbf g = -\nabla\Phi$; $-GM/r$ for a point mass. It satisfies Poisson''s equation $\nabla^2\Phi = 4\pi G\rho$.'
  topic: Gravitational fields
- term: displacement current
  definition: 'Maxwell''s added term $\varepsilon_0\,\partial\mathbf E/\partial t$ in the Ampère–Maxwell law; it makes the law consistent with conservation of charge and lets a changing electric field produce a magnetic field.'
  topic: Electromagnetic waves
- term: vector Laplacian
  definition: 'The Laplacian applied to each component of a vector field: $\nabla^2\mathbf F = \langle\nabla^2P, \nabla^2Q, \nabla^2R\rangle$ in Cartesian coordinates. It appears in $\nabla\times(\nabla\times\mathbf F) = \nabla(\nabla\cdot\mathbf F) - \nabla^2\mathbf F$.'
  topic: Electromagnetic waves
- term: plane wave
  aliases: [plane waves]
  definition: 'A wave whose fields are the same over every plane perpendicular to its direction of travel, such as $\mathbf E = \mathbf E_0\cos(\mathbf k\cdot\mathbf x - \omega t)$.'
  topic: Electromagnetic waves
- term: transverse
  aliases: [transverse wave]
  definition: 'Of a wave: oscillating at right angles to the direction of travel. Electromagnetic waves in vacuum are transverse because $\nabla\cdot\mathbf E = \nabla\cdot\mathbf B = 0$.'
  topic: Electromagnetic waves
- term: Poynting's theorem
  definition: 'Energy conservation for electromagnetic fields: $\partial u/\partial t + \nabla\cdot\mathbf S = -\mathbf J\cdot\mathbf E$, with $u$ the field energy density and $\mathbf S$ the Poynting vector.'
  topic: Electromagnetic waves
- term: Poynting vector
  definition: 'The energy flux of an electromagnetic field, $\mathbf S = \frac{1}{\mu_0}\mathbf E\times\mathbf B$ (watts per square meter); for a wave it points along the direction of travel.'
  topic: Electromagnetic waves
- term: intensity
  definition: 'Of a wave: the time-averaged power carried per unit area; for an electromagnetic plane wave $I = \tfrac12c\varepsilon_0E_0^2$.'
  topic: Electromagnetic waves
- term: maximum principle
  definition: 'A harmonic function on a bounded connected region, continuous up to the boundary, takes its maximum and minimum on the boundary; if it takes either at an interior point, it is constant.'
  topic: Harmonic functions
- term: Earnshaw's theorem
  definition: 'No arrangement of fixed charges can hold a point charge in stable equilibrium by electrostatic forces alone, because the potential in a charge-free region is harmonic and has no strict local minimum (Earnshaw, 1842).'
  topic: Harmonic functions
- term: velocity potential
  definition: 'A function $\phi$ with $\mathbf v = \nabla\phi$ for an irrotational flow (one with no net circulation around obstacles).'
  topic: Harmonic functions
- term: potential flow
  definition: 'A model of an ideal fluid flow that is irrotational and incompressible, so $\mathbf v = \nabla\phi$ with $\nabla^2\phi = 0$ and $\partial\phi/\partial n = 0$ on solid walls. It ignores viscosity.'
  topic: Harmonic functions
- term: stagnation point
  aliases: [stagnation points]
  definition: 'A point in a flow where the velocity is zero, such as the front and back of a cylinder in potential flow.'
  topic: Harmonic functions
- term: d'Alembert's paradox
  definition: 'Potential flow predicts zero drag on an obstacle such as a cylinder, while real fluids exert drag; the gap comes from viscosity, which makes real flows separate and form a wake (d''Alembert, 1752).'
  topic: Harmonic functions
- term: Gaussian curvature
  definition: 'At a point of a surface, $K = \kappa_1\kappa_2$, the product of the principal curvatures. For a graph $z = f(x, y)$, $K = (f_{xx}f_{yy} - f_{xy}^2)/(1 + f_x^2 + f_y^2)^2$; a sphere of radius $R$ has $K = 1/R^2$.'
  topic: Curvature of surfaces
- term: normal curvature
  definition: 'The signed curvature of the curve cut from a surface by the plane containing the normal $\mathbf n$ and a tangent direction $\mathbf u$; positive if it bends toward $\mathbf n$.'
  topic: Curvature of surfaces
- term: principal curvatures
  aliases: [principal curvature]
  definition: 'The largest and smallest normal curvatures $\kappa_1$, $\kappa_2$ at a point; they occur in perpendicular principal directions. Where the tangent plane is horizontal, they are the eigenvalues of the Hessian.'
  topic: Curvature of surfaces
- term: mean curvature
  definition: 'The average of the principal curvatures, $H = (\kappa_1 + \kappa_2)/2$. Unlike Gaussian curvature it is not intrinsic: rolling a flat sheet into a cylinder changes it.'
  topic: Curvature of surfaces
- term: Euler's theorem
  aliases: [Euler's curvature theorem]
  definition: 'In differential geometry: the normal curvature at angle $\theta$ from the first principal direction is $\kappa_1\cos^2\theta + \kappa_2\sin^2\theta$.'
  topic: Curvature of surfaces
- term: elliptic point
  aliases: [elliptic points]
  definition: 'A point of a surface with $K > 0$: both principal curvatures have the same sign and the surface is dome-like there.'
  topic: Curvature of surfaces
- term: hyperbolic point
  aliases: [hyperbolic points]
  definition: 'A point of a surface with $K < 0$: the principal curvatures have opposite signs and the surface is saddle-like there.'
  topic: Curvature of surfaces
- term: planar point
  aliases: [planar points]
  definition: 'A point of a surface where both principal curvatures are 0. A point where exactly one is 0 (as on a cylinder) is called parabolic.'
  topic: Curvature of surfaces
- term: Theorema Egregium
  definition: 'Gauss''s "remarkable theorem" (1827): Gaussian curvature can be computed from distances and angles measured within the surface, so bending without stretching never changes it.'
  topic: Curvature of surfaces
- term: geodesic
  aliases: [geodesics]
  definition: 'A curve on a surface that is as straight as the surface allows, locally the shortest path between its points; on a sphere, an arc of a great circle.'
  topic: Curvature of surfaces
- term: geodesic triangle
  aliases: [geodesic triangles]
  definition: 'A triangle on a surface whose sides are geodesics; its angles satisfy $\alpha + \beta + \gamma = \pi + \iint_T K\,dA$.'
  topic: Curvature of surfaces
- term: Euler characteristic
  definition: '$\chi = V - E + F$ for any subdivision of a closed surface into polygons; it depends only on topology: 2 for a sphere, 0 for a torus, $2 - 2g$ for a surface with $g$ holes.'
  topic: Curvature of surfaces
- term: Gauss–Bonnet theorem
  aliases: [Gauss-Bonnet theorem, Gauss–Bonnet]
  definition: 'For a closed surface, $\iint_S K\,dA = 2\pi\chi(S)$; for a geodesic triangle, the angle sum exceeds $\pi$ by $\iint_T K\,dA$.'
  topic: Curvature of surfaces
