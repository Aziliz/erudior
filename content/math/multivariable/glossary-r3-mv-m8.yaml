# Round 3 glossary for mv-m8 (honors lesson 38h3: vector potentials)
- term: scalar potential
  aliases: [scalar potentials]
  definition: 'A function $f$ with $\mathbf F = \nabla f$ (physics often writes $\mathbf F = -\nabla\phi$ instead). The same thing as a potential function; the word "scalar" contrasts it with a vector potential.'
  topic: Vector potentials
- term: vector potential
  aliases: [vector potentials, magnetic vector potential]
  definition: 'A vector field $\mathbf A$ with $\nabla\times\mathbf A = \mathbf F$. Only divergence-free fields can have one; on all of space or a star-shaped region every one does. In magnetism, $\mathbf B = \nabla\times\mathbf A$.'
  topic: Vector potentials
- term: solenoidal
  aliases: [solenoidal field, solenoidal fields, divergence-free, divergence-free field]
  definition: 'Having divergence zero: $\nabla\cdot\mathbf F = 0$. Every curl is solenoidal; on all of space every solenoidal field is a curl.'
  topic: Vector potentials
- term: star-shaped
  aliases: [star-shaped region, star-shaped regions]
  definition: 'Describes a region containing a point that can be joined to every other point of the region by a straight segment inside the region. Balls, boxes and all of space are star-shaped; space minus a point is not.'
  topic: Vector potentials
- term: Poincaré lemma
  aliases: [Poincare lemma]
  definition: 'On a star-shaped region, a field with zero curl is a gradient and a field with zero divergence is a curl (stated here for vector fields in space; the general form is about differential forms).'
  topic: Vector potentials
- term: gauge transformation
  aliases: [gauge transformations, gauge freedom, gauge]
  definition: 'Replacing a vector potential $\mathbf A$ by $\mathbf A + \nabla\chi$. It does not change $\nabla\times\mathbf A$, so a vector potential is never unique.'
  topic: Vector potentials
- term: Coulomb gauge
  definition: 'The choice of vector potential with $\nabla\cdot\mathbf A = 0$, reached from any $\mathbf A$ by adding $\nabla\chi$ with $\nabla^2\chi = -\nabla\cdot\mathbf A$.'
  topic: Vector potentials
- term: Helmholtz decomposition
  aliases: [Helmholtz theorem, Helmholtz's theorem, fundamental theorem of vector calculus]
  definition: 'Writing a vector field that dies off at infinity as $\mathbf F = -\nabla\phi + \nabla\times\mathbf A$, a curl-free part plus a divergence-free part; $\nabla\cdot\mathbf F$ is the source of $\phi$ and $\nabla\times\mathbf F$ the source of $\mathbf A$.'
  topic: Helmholtz decomposition
