id: math-multivariable
title: Multivariable Calculus
description: >-
  A complete college Calculus III course. It opens with a bridge from single-variable
  calculus, then builds vectors and the geometry of space, vector functions and motion,
  partial derivatives and the gradient, optimization with Lagrange multipliers, double
  and triple integrals in every coordinate system, change of variables, and finishes
  with vector fields, line and surface integrals, and the theorems of Green, Stokes and
  Gauss with their uses in physics.
revision: 1
released: true
order: 8
