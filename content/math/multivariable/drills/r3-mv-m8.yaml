# Round 3 drills for mv-m8 (honors lesson 38h3: vector potentials)
- id: mv-m8-r3-component-potential
  title: A vector potential by Method 1
  topic: Vector potentials
  vars:
    a: {min: -4, max: 4}
    b: {choices: [-6, -4, -2, 2, 4, 6]}
    c: {choices: [-6, -4, -2, 2, 4, 6]}
  where: ["a != 0"]
  calc:
    hb: b/2
    mhc: -c/2
    ma: -a
    mc: -c
  prompt: 'The field $\mathbf F = \langle {a:coef}y^2,\; {b:coef}z,\; {c:coef}xy\rangle$ has divergence 0. Use Method 1 of the lesson ($A_3 = 0$, integrals starting from 0) to find $\mathbf A = \langle A_1, A_2, 0\rangle$ with $\nabla\times\mathbf A = \mathbf F$.'
  answers:
    - {kind: expression, expression: 'hb*z^2 + mhc*x*y^2', variables: [x, y, z], label: '$A_1 =$', show: '${hb:coef}z^2 {mhc:signedcoef}xy^2$'}
    - {kind: expression, expression: 'ma*y^2*z', variables: [x, y, z], label: '$A_2 =$', show: '${ma:coef}y^2z$'}
  solution: |-
    Here $P = {a:coef}y^2$, $Q = {b:coef}z$, $R = {c:coef}xy$, so $R(x, s, 0) = {c:coef}xs$.
    $A_2 = -\int_0^z P\,dt = -\int_0^z ({a:coef}y^2)\,dt = {ma:coef}y^2z$.
    $A_1 = \int_0^z ({b:coef}t)\,dt - \int_0^y ({c:coef}xs)\,ds = {hb:coef}z^2 {mhc:signedcoef}xy^2$.
    So $\mathbf A = \langle$ **${hb:coef}z^2 {mhc:signedcoef}xy^2$**, **${ma:coef}y^2z$**, $0\rangle$.
    Check: $\nabla\times\mathbf A = \langle -\partial_zA_2,\; \partial_zA_1,\; \partial_xA_2 - \partial_yA_1\rangle = \langle {a:coef}y^2,\; {b:coef}z,\; 0 - ({mc:coef}xy)\rangle = \mathbf F$.
- id: mv-m8-r3-uniform-field
  title: Vector potential of a uniform field
  topic: Vector potentials
  vars:
    b1: {min: -4, max: 4}
    b2: {min: -4, max: 4}
    b3: {min: -4, max: 4}
    x0: {min: -3, max: 3}
    y0: {min: -3, max: 3}
    z0: {min: -3, max: 3}
  where: ["b1 != 0 or b2 != 0", "b3 != 0", "x0 != 0", "y0 != 0"]
  calc:
    c1: b2*z0 - b3*y0
    c2: b3*x0 - b1*z0
    c3: b1*y0 - b2*x0
    A1: c1/2
    A2: c2/2
    A3: c3/2
  prompt: 'For the uniform field $\mathbf B = \langle {b1},\; {b2},\; {b3}\rangle$, take the vector potential $\mathbf A = \tfrac12\mathbf B\times\mathbf x$. Find $\mathbf A$ at the point $({x0}, {y0}, {z0})$. (Exact values or decimals.)'
  answers:
    - {name: A1, label: '$A_1 =$'}
    - {name: A2, label: '$A_2 =$'}
    - {name: A3, label: '$A_3 =$'}
  solution: |-
    $\mathbf B\times\mathbf x = \langle B_2z - B_3y,\; B_3x - B_1z,\; B_1y - B_2x\rangle$. At $({x0}, {y0}, {z0})$:
    $({b2})({z0}) - ({b3})({y0}) = {c1}$, $\;({b3})({x0}) - ({b1})({z0}) = {c2}$, $\;({b1})({y0}) - ({b2})({x0}) = {c3}$.
    Halving: $\mathbf A = \langle$ **{A1}**, **{A2}**, **{A3}** $\rangle$.
- id: mv-m8-r3-coulomb-gauge
  title: Moving a vector potential to the Coulomb gauge
  topic: Vector potentials
  vars:
    a: {choices: [-12, -6, 6, 12]}
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
  where: ["p != 0", "q != 0"]
  calc:
    k: -a/6
    h: -a/2
    k6: -a
    k3: -a/2
  prompt: 'The vector potential $\mathbf A = \langle {p:coef}z^2,\; {a:coef}xy,\; {q:coef}x\rangle$ has $\nabla\cdot\mathbf A = {a:coef}x$. Find $\chi = \chi(x)$, a function of $x$ alone with $\chi(0) = 0$ and $\chi''(0) = 0$, such that $\mathbf A + \nabla\chi$ is in the Coulomb gauge. Then give the first component of $\mathbf A + \nabla\chi$.'
  answers:
    - {kind: expression, expression: 'k*x^3', variables: [x], label: '$\chi =$', show: '${k:coef}x^3$'}
    - {kind: expression, expression: 'p*z^2 + h*x^2', variables: [x, z], label: 'First component', show: '${p:coef}z^2 {h:signedcoef}x^2$'}
  solution: |-
    We need $\nabla^2\chi = -\nabla\cdot\mathbf A = {k6:coef}x$, and for $\chi = \chi(x)$ that is $\chi'' ={k6:coef}x$.
    Integrating twice with $\chi(0) = 0$ and $\chi'(0) = 0$: $\chi' = {k3:coef}x^2$ and $\chi =$ **${k:coef}x^3$**.
    $\nabla\chi = \langle {k3:coef}x^2, 0, 0\rangle$, so the first component becomes **${p:coef}z^2 {h:signedcoef}x^2$**. The curl is unchanged, and the new divergence is ${a:coef}x {k6:signedcoef}x = 0$.
