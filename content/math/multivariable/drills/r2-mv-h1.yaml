# Round 2 drills for honors module mv-h1 (lessons 90-93)
# Lesson 90: gravity from Gauss's law
- id: mv-h1-r2-g-inside
  title: Gravity inside and outside a uniform planet
  topic: Gravitational fields
  vars:
    Rkm: {min: 1500, max: 7000, step: 100}
    gs: {choices: [1.6, 3.7, 8.9, 9.8, 11.2]}
    dep: {min: 200, max: 1400, step: 100}
    ht: {min: 200, max: 6000, step: 100}
  calc:
    rin: Rkm - dep
    rout: Rkm + ht
    gin: gs*(Rkm - dep)/Rkm
    gout: gs*Rkm^2/(Rkm + ht)^2
  prompt: 'A planet is modeled as a uniform ball of radius {Rkm} km with surface gravity {gs} m/s². Find the field strength $|\mathbf g|$ (a) {dep} km below the surface and (b) {ht} km above the surface. Give 3 significant figures.'
  answers:
    - {name: gin, label: '(a) m/s²', sigfigs: 3, format: sig3}
    - {name: gout, label: '(b) m/s²', sigfigs: 3, format: sig3}
  solution: |-
    Only the mass closer to the center counts. Inside a uniform ball the enclosed mass grows like $r^3$, so $|\mathbf g| = g_0\,r/R$: at $r = {rin}$ km, $|\mathbf g| = {gs}\cdot\dfrac{{rin}}{{Rkm}} =$ **{gin:sig3}** m/s². Outside, the planet acts like a point mass, so $|\mathbf g| = g_0R^2/r^2$: at $r = {rout}$ km, $|\mathbf g| = {gs}\cdot\left(\dfrac{{Rkm}}{{rout}}\right)^2 =$ **{gout:sig3}** m/s².
- id: mv-h1-r2-tunnel
  title: A tunnel through a uniform planet
  topic: Gravitational fields
  vars:
    Rkm: {min: 1500, max: 7000, step: 100}
    gs: {choices: [1.6, 3.7, 8.9, 9.8, 11.2]}
  calc:
    Rm: Rkm*1000
    per: 2*pi*sqrt(Rkm*1000/gs)
    oneway: pi*sqrt(Rkm*1000/gs)/60
  prompt: 'A uniform planet has radius {Rkm} km and surface gravity {gs} m/s². A stone is dropped into a straight frictionless tunnel through the center. How many minutes does it take to reach the far side? Give 3 significant figures.'
  answers:
    - {name: oneway, label: 'Time (minutes)', sigfigs: 3, format: sig3}
  solution: |-
    Inside, the force per kilogram along the tunnel is $-\dfrac{g_0}{R}x$, so $x'' = -\dfrac{g_0}{R}x$: simple harmonic motion with period $T = 2\pi\sqrt{R/g_0} = 2\pi\sqrt{{Rm}/{gs}} \approx {per:sig3}$ s. The far side is half a period away: $T/2 = {per:sig3}/2$ s $=$ **{oneway:sig3}** minutes.
- id: mv-h1-r2-poisson-density
  title: Density from the potential (Poisson's equation)
  topic: Gravitational fields
  vars:
    kk: {min: 3, max: 9.9, step: 0.1}
  calc:
    lap: 6*kk
    rho: 6*kk*1e-7/(4*pi*6.674e-11)
  prompt: 'Inside a body the gravitational potential is $\Phi = ({kk}\times10^{-7}\text{ s}^{-2})(x^2 + y^2 + z^2) + C$ (in J/kg, lengths in meters). Use Poisson''s equation with $G = 6.674\times10^{-11}$ N·m²/kg² to find the density, in kg/m³, to 3 significant figures.'
  answers:
    - {name: rho, label: '$\rho =$ (kg/m³)', sigfigs: 3, format: sig3}
  solution: |-
    $\nabla^2(x^2 + y^2 + z^2) = 2 + 2 + 2 = 6$, so $\nabla^2\Phi = {lap}\times10^{-7}$ s⁻². Poisson: $\rho = \dfrac{\nabla^2\Phi}{4\pi G} = \dfrac{{lap}\times10^{-7}}{4\pi(6.674\times10^{-11})} =$ **{rho:sig3}** kg/m³.
# Lesson 91: electromagnetic waves
- id: mv-h1-r2-curl-curl
  title: The curl of a curl
  topic: Electromagnetic waves
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    p: {min: -3, max: 3}
    q: {min: -3, max: 3}
    w: {min: -3, max: 3}
  where: ["a != 0", "b != 0", "c != 0", "b != c", "p != 0", "q != 0", "w != 0"]
  calc:
    ta: 2*a
    tb: 2*b
    tc: 2*c
    c1: 2*c*p
    c2: 2*a*p - 2*b*q
    c3: 2*(b - c)*w
    gx: 2*a*q + 2*c*p
    gy: 2*a*p
    gz: 2*b*w
    lx: 2*a*q
    ly: 2*b*q
    lz: 2*c*w
  prompt: 'Let $\mathbf F = \langle {a:coef}x^2y,\ {b:coef}yz^2,\ {c:coef}x^2z\rangle$. Find $\nabla\times(\nabla\times\mathbf F)$ at the point $({p}, {q}, {w})$.'
  answers:
    - {name: c1, label: 'first component', format: integer}
    - {name: c2, label: 'second component', format: integer}
    - {name: c3, label: 'third component', format: integer}
  solution: |-
    Use $\nabla\times(\nabla\times\mathbf F) = \nabla(\nabla\cdot\mathbf F) - \nabla^2\mathbf F$. Here $\nabla\cdot\mathbf F = {ta}xy + ({b})z^2 + ({c})x^2$, so $\nabla(\nabla\cdot\mathbf F) = \langle {ta}y + ({tc})x,\ {ta}x,\ {tb}z\rangle$, which is $\langle {gx}, {gy}, {gz}\rangle$ at the point. Componentwise Laplacians: $\nabla^2\mathbf F = \langle {ta}y,\ {tb}y,\ {tc}z\rangle = \langle {lx}, {ly}, {lz}\rangle$ there. Subtract: **{c1}**, **{c2}**, **{c3}**.
- id: mv-h1-r2-intensity
  title: Field amplitudes from intensity
  topic: Electromagnetic waves
  vars:
    inten: {min: 100, max: 5000, step: 50}
  calc:
    e0: sqrt(2*inten/(2.998e8*8.854e-12))
    b0: sqrt(2*inten/(2.998e8*8.854e-12))/2.998e8*1e6
  prompt: 'A plane electromagnetic wave in vacuum has intensity {inten} W/m². Using $c = 2.998\times10^8$ m/s and $\varepsilon_0 = 8.854\times10^{-12}$ F/m, find the amplitude $E_0$ of the electric field (V/m) and $B_0$ of the magnetic field (in microtesla, μT). Give 3 significant figures.'
  answers:
    - {name: e0, label: '$E_0 =$ (V/m)', sigfigs: 3, format: sig3}
    - {name: b0, label: '$B_0 =$ (μT)', sigfigs: 3, format: sig3}
  solution: |-
    $I = \tfrac12c\varepsilon_0E_0^2$, so $E_0 = \sqrt{\dfrac{2({inten})}{(2.998\times10^8)(8.854\times10^{-12})}} =$ **{e0:sig3}** V/m. Then $B_0 = E_0/c = {e0:sig3}/(2.998\times10^8)$ T $=$ **{b0:sig3}** μT.
# Lesson 92: harmonic functions
- id: mv-h1-r2-mean-value
  title: Averages of a harmonic function
  topic: Harmonic functions
  vars:
    a: {min: -3, max: 3}
    b: {min: -4, max: 4}
    c: {min: -5, max: 5}
    p: {min: -3, max: 3}
    q: {min: -3, max: 3}
    rad: {min: 2, max: 6}
  where: ["a != 0", "b != 0", "c != 0"]
  calc:
    na: -a
    ta: 2*a
    nta: -2*a
    val: a*p^2 - a*q^2 + b*p*q + c*p
  prompt: 'Let $u = {a:coef}x^2 {na:signedcoef}y^2 {b:signedcoef}xy {c:signedcoef}x$. Find the average value of $u$ over the circle of radius {rad} centered at $({p}, {q})$.'
  answers:
    - {name: val, label: 'Average', format: integer}
  solution: |-
    $u_{xx} + u_{yy} = {ta} + ({nta}) = 0$, so $u$ is harmonic. By the mean value property its average over any circle equals its value at the center, whatever the radius: $u({p}, {q}) =$ **{val}**.
- id: mv-h1-r2-make-harmonic
  title: Making a quadratic harmonic
  topic: Harmonic functions
  vars:
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    p: {min: -3, max: 3}
    q: {min: -3, max: 3}
    w: {min: -3, max: 3}
  where: ["a != 0", "b != 0", "a + b != 0"]
  calc:
    cc: -(a + b)
    ta: 2*a
    tb: 2*b
    val: a*p^2 + b*q^2 - (a + b)*w^2
  prompt: '(a) Find the constant $k$ that makes $u = {a:coef}x^2 {b:signedcoef}y^2 + kz^2$ harmonic. (b) With that $k$, find the average of $u$ over the sphere of radius 2 centered at $({p}, {q}, {w})$.'
  answers:
    - {name: cc, label: '(a) $k =$', format: integer}
    - {name: val, label: '(b) average', format: integer}
  solution: |-
    $\nabla^2u = {ta} + ({tb}) + 2k = 0$ gives $k =$ **{cc}**. Then $u$ is harmonic, so its average over a sphere is its value at the center: ${a}({p})^2 + ({b})({q})^2 + ({cc})({w})^2 =$ **{val}**.
# Lesson 93: curvature of surfaces
- id: mv-h1-r2-principal-curv
  title: Principal and Gaussian curvature at a flat spot
  topic: Curvature of surfaces
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
    s: {min: -4, max: 4}
  where: ["q != 0", "p != 0", "s != 0"]
  calc:
    tp: 2*p
    ts: 2*s
    ps: p + s
    pms: p - s
    k1: p + s + sqrt((p - s)^2 + q^2)
    k2: p + s - sqrt((p - s)^2 + q^2)
    kg: 4*p*s - q^2
    tr: 2*p + 2*s
  prompt: 'For the surface $z = {p:coef}x^2 {q:signedcoef}xy {s:signedcoef}y^2$ at the origin (normal $\mathbf k$), find the principal curvatures $\kappa_1 \ge \kappa_2$ (2 decimal places) and the Gaussian curvature $K$.'
  answers:
    - {name: k1, label: '$\kappa_1 =$', tolerance: 0.006, format: num2}
    - {name: k2, label: '$\kappa_2 =$', tolerance: 0.006, format: num2}
    - {name: kg, label: '$K =$', format: integer}
  solution: |-
    The gradient is zero at the origin, so the principal curvatures are the eigenvalues of the Hessian $\begin{bmatrix}{tp} & {q}\\ {q} & {ts}\end{bmatrix}$. Their sum is the trace ${tr}$ and their product the determinant ${kg}$, so $\lambda = {ps} \pm\sqrt{({pms})^2 + ({q})^2}$: $\kappa_1 =$ **{k1:num2}**, $\kappa_2 =$ **{k2:num2}**, and $K = \det = ({tp})({ts}) - ({q})^2 =$ **{kg}**.
- id: mv-h1-r2-graph-curv
  title: Gaussian curvature of a paraboloid
  topic: Curvature of surfaces
  vars:
    a: {choices: [0.5, 1, 1.5, 2, 3]}
    p: {min: -2, max: 2}
    q: {min: -2, max: 2}
  where: ["p != 0 or q != 0"]
  calc:
    ta: 2*a
    fx: 2*a*p
    fy: 2*a*q
    num: 4*a^2
    den: (1 + 4*a^2*(p^2 + q^2))^2
    kk: 4*a^2/(1 + 4*a^2*(p^2 + q^2))^2
  prompt: 'Find the Gaussian curvature of $z = {a}(x^2 + y^2)$ at the point above $({p}, {q})$. Give an exact fraction or 4 significant figures.'
  answers:
    - {name: kk, label: '$K =$', sigfigs: 4, format: sig4}
  solution: |-
    $f_{xx} = f_{yy} = {ta}$, $f_{xy} = 0$, $f_x = {fx}$, $f_y = {fy}$. So $K = \dfrac{f_{xx}f_{yy} - f_{xy}^2}{(1 + f_x^2 + f_y^2)^2} = \dfrac{{num}}{{den}} \approx$ **{kk:sig4}**.
- id: mv-h1-r2-sphere-triangle
  title: Area of a spherical triangle
  topic: Curvature of surfaces
  vars:
    A: {min: 60, max: 100}
    B: {min: 60, max: 100}
    C: {min: 30, max: 100}
    Rad: {choices: [1, 2, 5, 10, 6371]}
  where: ["A + B + C > 185", "A + B + C < 360"]
  calc:
    exc: A + B + C - 180
    area: (A + B + C - 180)*pi/180*Rad^2
  prompt: 'A geodesic triangle on a sphere of radius {Rad} has angles ${A}^\circ$, ${B}^\circ$ and ${C}^\circ$. Find its area (in square units of the radius) to 3 significant figures.'
  answers:
    - {name: area, label: 'Area', sigfigs: 3, format: sig3}
  solution: |-
    By Gauss–Bonnet with $K = 1/R^2$, the angle excess equals area$/R^2$. Excess: ${A} + {B} + {C} - 180 = {exc}^\circ = {exc}\cdot\dfrac{\pi}{180}$ rad. Area $= {exc}\cdot\dfrac{\pi}{180}\cdot{Rad}^2 =$ **{area:sig3}**.
