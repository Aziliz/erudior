# Module 7 drills
- id: mv-d-vf-eval
  title: Evaluate a vector field
  topic: Vector fields
  vars:
    a: {min: -2, max: 2}
    b: {min: -3, max: 3}
    c: {min: -2, max: 2}
    x0: {min: -2, max: 2}
    y0: {min: -2, max: 2}
  where: ["a != 0", "b != 0", "c != 0", "P0^2 + Q0^2 > 0"]
  calc:
    P0: a*x0*y0 + b
    Q0: c*x0^2 - y0
  prompt: 'For $\mathbf F(x, y) = \langle {a:coef}xy {b:signed},\; {c:coef}x^2 - y\rangle$, find $\mathbf F({x0}, {y0})$.'
  figure:
    type: plot
    x: [-3, 3]
    y: [-3, 3]
    equal: true
    vectorField: {u: 'a*x*y + b', v: 'c*x^2 - y', step: 0.6}
    points:
      - {at: [x0, y0], label: '({x0}, {y0})'}
    caption: 'The field F, with the point marked'
  answers:
    - {name: P0, label: 'first component'}
    - {name: Q0, label: 'second component'}
  solution: |-
    Substitute $x = {x0}$, $y = {y0}$ into each component:
    $P = ({a})({x0})({y0}) + ({b}) = {P0}$ and $Q = ({c})({x0})^2 - ({y0}) = {Q0}$.
    **$\mathbf F({x0}, {y0}) = \langle {P0}, {Q0}\rangle$**.
- id: mv-d-grad-field
  title: Gradient field
  topic: Gradient fields
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    c: {min: -5, max: 5}
  where: ["b != 0", "c != 0"]
  calc:
    a2: 2*a
    b3: 3*b
  prompt: 'Find the gradient field of $f(x, y) = {a:coef}x^2y {b:signedcoef}y^3 {c:signedcoef}x$.'
  answers:
    - {kind: expression, expression: 'a2*x*y + c', variables: [x, y], label: '$P = f_x =$', show: '${a2}xy {c:signed}$'}
    - {kind: expression, expression: 'a*x^2 + b3*y^2', variables: [x, y], label: '$Q = f_y =$', show: '${a:coef}x^2 {b3:signedcoef}y^2$'}
  solution: |-
    $\nabla f = \langle f_x, f_y\rangle$ with $f_x = {a2}xy {c:signed}$ and $f_y = {a:coef}x^2 {b3:signedcoef}y^2$.
    **$\nabla f = \langle {a2}xy {c:signed},\; {a:coef}x^2 {b3:signedcoef}y^2\rangle$**.
- id: mv-d-line-scalar
  title: Scalar line integral along a segment
  topic: Scalar line integrals
  vars:
    p: {min: -3, max: 3}
    q: {min: -3, max: 3}
    x1: {min: -3, max: 3}
    y1: {min: -3, max: 3}
    x2: {min: -3, max: 3}
    y2: {min: -3, max: 3}
  where: ["p != 0", "q != 0", "x1 != x2", "y1 != y2", "abs(ans) > 0.05"]
  calc:
    dx: x2 - x1
    dy: y2 - y1
    L: sqrt(dx^2 + dy^2)
    mx: (x1 + x2)/2
    my: (y1 + y2)/2
    avgf: p*mx + q*my
    ans: L*avgf
  prompt: 'Evaluate $\displaystyle\int_C({p:coef}x {q:signedcoef}y)\,ds$, where $C$ is the segment from $({x1}, {y1})$ to $({x2}, {y2})$. (2 decimals.)'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    Parametrize $\mathbf r(t) = \langle {x1} + ({dx})t,\; {y1} + ({dy})t\rangle$, $0 \le t \le 1$, so $|\mathbf r'(t)| = \sqrt{({dx})^2 + ({dy})^2} \approx {L:num4}$.
    The integrand is linear in $t$, so $\int_0^1 f(\mathbf r(t))\,dt$ is its value at the midpoint $({mx}, {my})$: ${p}({mx}) + ({q})({my}) = {avgf}$.
    Value $= {avgf}\cdot{L:num4} \approx$ **{ans:num2}**.
- id: mv-d-work-line
  title: Work along a power curve
  topic: Work and vector line integrals
  vars:
    a: {min: -3, max: 4}
    b: {min: -3, max: 4}
    n: {min: 2, max: 3}
  where: ["a != 0", "b != 0"]
  calc:
    n1: n + 1
    n2: 2*n + 1
    nm1: n - 1
    nn: 2*n
    W: a/3 + b*n/(2*n + 1)
  prompt: 'Find the work done by $\mathbf F = \langle {a:coef}x^2,\; {b:coef}xy\rangle$ on a particle moving along $y = x^{n}$ from $(0, 0)$ to $(1, 1)$. (Exact fraction.)'
  figure:
    type: plot
    x: [-0.2, 1.3]
    y: [-0.2, 1.3]
    equal: true
    vectorField: {u: 'a*x^2', v: 'b*x*y', step: 0.2}
    functions:
      - {f: 'x^n', from: 0, to: 1, label: 'y = x^{n}'}
    caption: 'The field and the path'
  answers:
    - {name: W, kind: fraction, label: '$W =$'}
  solution: |-
    Parametrize $\mathbf r(t) = \langle t, t^{n}\rangle$, $0 \le t \le 1$, so $\mathbf r'(t) = \langle 1, {n}t^{{n} - 1}\rangle$ and $\mathbf F(\mathbf r(t)) = \langle {a:coef}t^2,\; {b:coef}t^{{n1}}\rangle$.
    $\mathbf F\cdot\mathbf r' = {a:coef}t^2 + ({b})({n})\,t^{{nn}}$, so $W = \displaystyle\int_0^1\left({a:coef}t^2 + ({b})({n})\,t^{{nn}}\right)dt = \frac{{a}}{3} + \frac{{b}\cdot{n}}{{n2}} =$ **${W:texfrac}$**.
- id: mv-d-potential
  title: Find a potential function
  topic: Conservative fields and potentials
  vars:
    a: {min: -3, max: 3}
    b: {min: -4, max: 4}
    c: {min: -3, max: 3}
    d: {min: -5, max: 5}
  where: ["a != 0", "b != 0", "c != 0", "d != 0"]
  calc:
    a2: 2*a
    c2: 2*c
  prompt: 'The field $\mathbf F = \langle {a2}x {b:signedcoef}y {d:signed},\; {b:coef}x {c2:signedcoef}y\rangle$ is conservative. Find a potential function $f(x, y)$.'
  answers:
    - {kind: expression, expression: 'a*x^2 + b*x*y + c*y^2 + d*x', variables: [x, y], plusC: true, label: '$f(x, y) =$', show: '${a:coef}x^2 {b:signedcoef}xy {c:signedcoef}y^2 {d:signedcoef}x$'}
  solution: |-
    Check: $P_y = {b} = Q_x$. ✓ Integrate $P$ in $x$: $f = {a:coef}x^2 {b:signedcoef}xy {d:signedcoef}x + g(y)$.
    Then $f_y = {b:coef}x + g'(y)$ must equal ${b:coef}x {c2:signedcoef}y$, so $g'(y) = {c2}y$ and $g = {c:coef}y^2$.
    **$f(x, y) = {a:coef}x^2 {b:signedcoef}xy {c:signedcoef}y^2 {d:signedcoef}x$** (plus any constant).
- id: mv-d-ftli
  title: Fundamental theorem for line integrals
  topic: Fundamental theorem for line integrals
  vars:
    a: {min: -3, max: 3}
    b: {min: -4, max: 4}
    x1: {min: -3, max: 3}
    y1: {min: -3, max: 3}
    x2: {min: -3, max: 3}
    y2: {min: -3, max: 3}
  where: ["a != 0", "b != 0", "x1 != x2"]
  calc:
    a2: 2*a
    fA: a*x1^2*y1 + b*y1
    fB: a*x2^2*y2 + b*y2
    W: fB - fA
  prompt: 'Evaluate $\displaystyle\int_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle {a2}xy,\; {a:coef}x^2 {b:signed}\rangle$, where $C$ is any path from $({x1}, {y1})$ to $({x2}, {y2})$.'
  answers:
    - {name: W, label: 'Value'}
  solution: |-
    $P_y = {a2}x = Q_x$, so $\mathbf F$ is conservative, with potential $f = {a:coef}x^2y {b:signedcoef}y$ (check: $f_x = {a2}xy$, $f_y = {a:coef}x^2 {b:signed}$).
    By the fundamental theorem: $f({x2}, {y2}) - f({x1}, {y1}) = {fB} - ({fA}) =$ **{W}**.
- id: mv-d-green-rect
  title: Green's theorem on a rectangle
  topic: Green's theorem
  vars:
    a: {min: -3, max: 3}
    b: {min: -3, max: 3}
    c: {min: -4, max: 4}
    A: {min: 1, max: 4}
    B: {min: 1, max: 4}
  where: ["a != 0", "b != 0", "c != 0", "k != 0", "ans != 0"]
  calc:
    k: 2*b - a
    b2: 2*b
    ans: k*A^2*B/2 + c*A*B
  prompt: 'Use Green''s theorem to evaluate $\displaystyle\oint_C {a:coef}xy\,dx + ({b:coef}x^2 {c:signedcoef}x)\,dy$, where $C$ is the boundary of the rectangle $[0, {A}]\times[0, {B}]$, counterclockwise.'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    $Q_x - P_y = ({b2}x {c:signed}) - ({a:coef}x) = {k:coef}x {c:signed}$.
    $\displaystyle\iint_R({k:coef}x {c:signed})\,dA = {k}\cdot\frac{{A}^2}{2}\cdot{B} + ({c})\cdot{A}\cdot{B} =$ **{ans}**.
- id: mv-d-green-area
  title: Area of a triangle with Green's theorem
  topic: Green's theorem
  vars:
    x1: {min: -4, max: 4}
    y1: {min: -4, max: 4}
    x2: {min: -4, max: 4}
    y2: {min: -4, max: 4}
  where: ["cr > 0"]
  calc:
    cr: x1*y2 - x2*y1
    area: cr/2
  prompt: 'Use $A = \tfrac12\oint_C x\,dy - y\,dx$ to find the area of the triangle with vertices $O(0, 0)$, $P({x1}, {y1})$, $Q({x2}, {y2})$ (traversed $O \to P \to Q \to O$, which is counterclockwise).'
  figure:
    type: plot
    x: [-5, 5]
    y: [-5, 5]
    equal: true
    polygons:
      - {points: [[0, 0], [x1, y1], [x2, y2]], fill: true}
    points:
      - {at: [x1, y1], label: 'P'}
      - {at: [x2, y2], label: 'Q'}
    caption: 'The triangle OPQ'
  answers:
    - {name: area, label: 'Area'}
  solution: |-
    On a segment from $(x_a, y_a)$ to $(x_b, y_b)$, $\int x\,dy - y\,dx = x_ay_b - x_by_a$. The two sides through $O$ contribute 0.
    The side $P \to Q$ contributes $({x1})({y2}) - ({x2})({y1}) = {cr}$.
    $A = \tfrac12\cdot{cr} =$ **{area}**.
