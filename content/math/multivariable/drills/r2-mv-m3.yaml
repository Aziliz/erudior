# Module 3 (Partial derivatives), round 2: drills for the honors lessons
- id: mv-m3-r2-dir-origin
  title: A directional derivative from the definition
  topic: Differentiability
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
  where: ["p != 0", "q != 0", "gcd(abs(p), abs(q)) == 1"]
  calc:
    p2: p^2
    q2: q^2
    nn: p^2 + q^2
    len: sqrt(nn)
    D: p^2*q/nn^1.5
  prompt: 'Let $f(x, y) = \dfrac{x^2y}{x^2 + y^2}$ with $f(0, 0) = 0$. Using the definition $D_{\mathbf u}f(0,0) = \lim_{t\to0}\dfrac{f(tu_1, tu_2)}{t}$, find the directional derivative at the origin in the direction of $\mathbf v = \langle {p}, {q}\rangle$. (3 decimal places.)'
  answers:
    - {name: D, label: '$D_{\mathbf u}f(0,0) \approx$', tolerance: 0.0006}
  solution: |-
    Normalize: $|\mathbf v| = \sqrt{{p2} + {q2}} = \sqrt{{nn}}$, so $\mathbf u = \langle u_1, u_2\rangle = \tfrac{1}{\sqrt{{nn}}}\langle {p}, {q}\rangle$.
    Along the line, $f(tu_1, tu_2) = \dfrac{t^3u_1^2u_2}{t^2(u_1^2 + u_2^2)} = t\,u_1^2u_2$, so $D_{\mathbf u}f(0,0) = u_1^2u_2 = \dfrac{{p2}\cdot({q})}{{nn}\sqrt{{nn}}} \approx$ **{D:dp3}**.
    Both partials at the origin are 0, so if $f$ were differentiable this would be $\nabla f\cdot\mathbf u = 0$. It is not 0, which shows again that $f$ is not differentiable at the origin.
- id: mv-m3-r2-mixed-unequal
  title: Unequal mixed partials at the origin
  topic: Mixed partials
  vars:
    p: {min: 1, max: 6}
    q: {min: 1, max: 6}
  calc:
    mq: -q
  prompt: 'Let $f(x, y) = \dfrac{xy({p:coef}x^2 - {q:coef}y^2)}{x^2 + y^2}$ with $f(0, 0) = 0$. Find $f_{xy}(0, 0) = (f_x)_y(0,0)$ and $f_{yx}(0, 0) = (f_y)_x(0,0)$.'
  answers:
    - {name: mq, label: '$f_{xy}(0,0) =$', format: integer}
    - {name: p, label: '$f_{yx}(0,0) =$', format: integer}
  solution: |-
    Since $f(0, y) = 0$, $f_x(0, y) = \lim_{h\to0}\dfrac{f(h, y)}{h} = \lim_{h\to0}\dfrac{y({p:coef}h^2 - {q:coef}y^2)}{h^2 + y^2} = -{q:coef}y$ (also true at $y = 0$). So $f_{xy}(0,0) = \dfrac{d}{dy}(-{q:coef}y) =$ **{mq}**.
    Since $f(x, 0) = 0$, $f_y(x, 0) = \lim_{k\to0}\dfrac{f(x, k)}{k} = \lim_{k\to0}\dfrac{x({p:coef}x^2 - {q:coef}k^2)}{x^2 + k^2} = {p:coef}x$. So $f_{yx}(0,0) =$ **{p}**.
    They differ, so the mixed partials cannot be continuous at the origin (Clairaut's theorem would force them to agree).
- id: mv-m3-r2-deriv-matrix
  title: Derivative matrix of a map
  topic: Derivative matrices
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    u0: {min: -3, max: 3}
    v0: {min: -3, max: 3}
  where: ["b != 0", "u0 != 0", "v0 != 0"]
  calc:
    e11: 2*a*u0*v0
    e12: a*u0^2
    e21: v0
    e22: u0 + 2*b*v0
    a2: 2*a
    b2: 2*b
  prompt: 'Find the derivative matrix $D\mathbf F({u0}, {v0})$ of $\mathbf F(u, v) = \left({a:coef}u^2v,\ uv {b:signedcoef}v^2\right)$. Enter its entries.'
  answers:
    - {name: e11, label: 'Row 1, column 1', format: integer}
    - {name: e12, label: 'Row 1, column 2', format: integer}
    - {name: e21, label: 'Row 2, column 1', format: integer}
    - {name: e22, label: 'Row 2, column 2', format: integer}
  solution: |-
    Row 1 is the gradient of $F_1 = {a:coef}u^2v$ with respect to $(u, v)$: $\langle {a2}uv,\ {a:coef}u^2\rangle$, which at $({u0}, {v0})$ is $\langle {e11}, {e12}\rangle$.
    Row 2 is the gradient of $F_2 = uv {b:signedcoef}v^2$: $\langle v,\ u {b2:signedcoef}v\rangle$, which at $({u0}, {v0})$ is $\langle {e21}, {e22}\rangle$.
    **$D\mathbf F({u0}, {v0}) = \begin{bmatrix} {e11} & {e12}\\ {e21} & {e22}\end{bmatrix}$**
- id: mv-m3-r2-matrix-chain
  title: The chain rule as a matrix product
  topic: Derivative matrices
  vars:
    a11: {min: -3, max: 3}
    a12: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a22: {min: -3, max: 3}
    b11: {min: -3, max: 3}
    b12: {min: -3, max: 3}
    b21: {min: -3, max: 3}
    b22: {min: -3, max: 3}
  where: ["a11*a22 - a12*a21 != 0", "b11*b22 - b12*b21 != 0", "b11*a12 + b12*a22 != a11*b12 + a12*b22"]
  calc:
    c11: b11*a11 + b12*a21
    c12: b11*a12 + b12*a22
    c21: b21*a11 + b22*a21
    c22: b21*a12 + b22*a22
  prompt: 'At a point $\mathbf a$, $D\mathbf F(\mathbf a) = \begin{bmatrix} {a11} & {a12}\\ {a21} & {a22}\end{bmatrix}$, and at $\mathbf F(\mathbf a)$, $D\mathbf G = \begin{bmatrix} {b11} & {b12}\\ {b21} & {b22}\end{bmatrix}$. Find $D(\mathbf G\circ\mathbf F)(\mathbf a)$.'
  answers:
    - {name: c11, label: 'Row 1, column 1', format: integer}
    - {name: c12, label: 'Row 1, column 2', format: integer}
    - {name: c21, label: 'Row 2, column 1', format: integer}
    - {name: c22, label: 'Row 2, column 2', format: integer}
  solution: |-
    The chain rule multiplies outer times inner: $D(\mathbf G\circ\mathbf F)(\mathbf a) = D\mathbf G(\mathbf F(\mathbf a))\,D\mathbf F(\mathbf a)$.
    Row 1: $({b11})({a11}) + ({b12})({a21}) = {c11}$ and $({b11})({a12}) + ({b12})({a22}) = {c12}$.
    Row 2: $({b21})({a11}) + ({b22})({a21}) = {c21}$ and $({b21})({a12}) + ({b22})({a22}) = {c22}$.
    **$\begin{bmatrix} {c11} & {c12}\\ {c21} & {c22}\end{bmatrix}$**. (Multiplying in the other order, $D\mathbf F\,D\mathbf G$, usually gives a different matrix.)
- id: mv-m3-r2-heat-decay
  title: Decay rate in the heat equation
  topic: Heat and wave equations
  vars:
    al: {min: 1, max: 4}
    n: {min: 1, max: 5}
  calc:
    n2: n^2
    lam: al*n^2
    th: ln(2)/lam
  prompt: 'For which $\lambda$ does $u = e^{-\lambda t}\sin({n:coef}x)$ solve the heat equation $u_t = {al:coef}u_{xx}$? Then find the time at which the height of this profile has fallen to half its starting value (3 significant figures).'
  answers:
    - {name: lam, label: '$\lambda =$', format: integer}
    - {name: th, label: '$t =$', sigfigs: 3}
  solution: |-
    $u_t = -\lambda u$ and $u_{xx} = -{n2}u$, so $-\lambda = {al}\cdot(-{n2})$ and $\lambda =$ **{lam}**.
    The height is $e^{-{lam}t}$. Setting $e^{-{lam}t} = \tfrac12$ gives $t = \dfrac{\ln 2}{{lam}} \approx$ **{th:sig3}**.
- id: mv-m3-r2-dalembert
  title: Evaluate d'Alembert's solution
  topic: Heat and wave equations
  vars:
    c: {min: 1, max: 2}
    x0: {min: -2, max: 2}
    t0: {min: 1, max: 2}
  calc:
    d1: x0 - c*t0
    d2: x0 + c*t0
    q1: 1 + d1^2
    q2: 1 + d2^2
    num0: q1 + q2
    den0: 2*q1*q2
    g: gcd(num0, den0)
    num: num0/g
    den: den0/g
    U: num/den
  prompt: 'A string obeys $u_{tt} = {c}^2u_{xx}$. It starts at rest ($u_t(x, 0) = 0$) with shape $u(x, 0) = \dfrac{1}{1 + x^2}$. Use d''Alembert''s formula to find $u({x0}, {t0})$ as an exact fraction.'
  answers:
    - {name: U, kind: fraction, label: '$u({x0}, {t0}) =$'}
  solution: |-
    With $\psi = 0$, d'Alembert's formula is $u = \tfrac12\left[\varphi(x - ct) + \varphi(x + ct)\right]$ with $\varphi(s) = \dfrac{1}{1 + s^2}$.
    Here $x - ct = {d1}$ and $x + ct = {d2}$, so $u = \tfrac12\left(\dfrac{1}{{q1}} + \dfrac{1}{{q2}}\right) = \dfrac{{num0}}{{den0}} =$ **$\dfrac{{num}}{{den}}$**.
