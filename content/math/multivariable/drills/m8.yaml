# Module 8 drills
- id: mv-d-curl
  title: Compute a curl
  topic: Curl
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    c: {min: 1, max: 4}
    p: {min: -4, max: 4}
  where: ["b != 0", "p != 0"]
  calc:
    nb: -b
    nc: -c
    na: -a
  prompt: 'Find $\operatorname{curl}\mathbf F$ for $\mathbf F = \langle {a:coef}xy {p:signedcoef}z,\; {b:coef}yz,\; {c:coef}xz\rangle$.'
  answers:
    - {kind: expression, expression: 'nb*y', variables: [x, y, z], label: '$\mathbf i$ component', show: '${nb:coef}y$'}
    - {kind: expression, expression: 'p - c*z', variables: [x, y, z], label: '$\mathbf j$ component', show: '${p} {nc:signedcoef}z$'}
    - {kind: expression, expression: 'na*x', variables: [x, y, z], label: '$\mathbf k$ component', show: '${na:coef}x$'}
  solution: |-
    With $P = {a:coef}xy {p:signedcoef}z$, $Q = {b:coef}yz$, $R = {c:coef}xz$:
    $\mathbf i$: $R_y - Q_z = 0 - ({b})y$; $\mathbf j$: $P_z - R_x = {p} - ({c})z$; $\mathbf k$: $Q_x - P_y = 0 - ({a})x$.
    **$\operatorname{curl}\mathbf F = \langle {nb:coef}y,\; {p} {nc:signedcoef}z,\; {na:coef}x\rangle$**.
- id: mv-d-div
  title: Compute a divergence
  topic: Divergence
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    c: {min: -4, max: 4}
  where: ["b != 0", "c != 0"]
  calc:
    a2: 2*a
    b2: 2*b
  prompt: 'Find $\operatorname{div}\mathbf F$ for $\mathbf F = \langle {a:coef}x^2y,\; {b:coef}yz^2,\; {c:coef}xz\rangle$.'
  answers:
    - {kind: expression, expression: 'a2*x*y + b*z^2 + c*x', variables: [x, y, z], label: '$\operatorname{div}\mathbf F =$', show: '${a2}xy {b:signedcoef}z^2 {c:signedcoef}x$'}
  solution: |-
    $\operatorname{div}\mathbf F = P_x + Q_y + R_z = {a2}xy + ({b})z^2 + ({c})x$.
    **$\operatorname{div}\mathbf F = {a2}xy {b:signedcoef}z^2 {c:signedcoef}x$**.
- id: mv-d-param-normal
  title: Normal vector to a parametric surface
  topic: Parametric surfaces
  vars:
    a: {min: 1, max: 3}
    b: {min: 1, max: 3}
    u0: {min: -2, max: 2}
    v0: {min: -2, max: 2}
  where: ["u0 != 0", "v0 != 0"]
  calc:
    ru2: 2*a*u0
    rv3: 2*b*v0
    N1: ru2*rv3
    N2: -rv3
    N3: -ru2
  prompt: 'For $\mathbf r(u, v) = \langle u + v,\; {a:coef}u^2,\; {b:coef}v^2\rangle$, find the normal vector $\mathbf r_u\times\mathbf r_v$ at $u = {u0}$, $v = {v0}$.'
  answers:
    - {name: N1, label: 'first component'}
    - {name: N2, label: 'second component'}
    - {name: N3, label: 'third component'}
  solution: |-
    $\mathbf r_u = \langle 1,\; 2({a})u,\; 0\rangle = \langle 1, {ru2}, 0\rangle$ and $\mathbf r_v = \langle 1,\; 0,\; 2({b})v\rangle = \langle 1, 0, {rv3}\rangle$ at the point.
    $\mathbf r_u\times\mathbf r_v = \langle ({ru2})({rv3}) - 0,\; 0 - (1)({rv3}),\; 0 - ({ru2})(1)\rangle =$ **$\langle {N1}, {N2}, {N3}\rangle$**.
- id: mv-d-cone-area
  title: Surface area of a cone
  topic: Surface area
  vars:
    k: {choices: [1, 2, 3]}
    R: {min: 1, max: 4}
  calc:
    h: k*R
    fac: sqrt(1 + k^2)
    A: pi*R^2*fac
  prompt: 'Find the area of the cone $z = {k:coef}\sqrt{x^2 + y^2}$ between $z = 0$ and $z = {h}$. (2 decimals.)'
  answers:
    - {name: A, label: 'Area', relTolerance: 0.001}
  solution: |-
    Parametrize $\mathbf r(r, \theta) = \langle r\cos\theta,\; r\sin\theta,\; {k}r\rangle$ with $0 \le r \le {R}$ (since $z = {h}$ when $r = {R}$), $0 \le \theta \le 2\pi$.
    $\mathbf r_r\times\mathbf r_\theta = \langle -{k}r\cos\theta,\; -{k}r\sin\theta,\; r\rangle$, of length $r\sqrt{1 + {k}^2}$.
    $A = \displaystyle\int_0^{2\pi}\int_0^{{R}}r\sqrt{1 + {k}^2}\,dr\,d\theta = \pi\cdot{R}^2\sqrt{1 + {k}^2} \approx$ **{A:num2}**.
- id: mv-d-flux-plane
  title: Flux through a slanted triangle
  topic: Flux
  vars:
    a: {min: 1, max: 5}
    b: {min: 1, max: 5}
    c: {min: 1, max: 5}
  calc:
    flux: a*b*c/2
  prompt: 'Find the flux of $\mathbf F = \langle x, y, z\rangle$ upward through the part of the plane $\dfrac{x}{{a}} + \dfrac{y}{{b}} + \dfrac{z}{{c}} = 1$ in the first octant. (Exact or 2 decimals.)'
  answers:
    - {name: flux, label: 'Flux'}
  solution: |-
    Write the plane as $z = g(x, y) = {c}\left(1 - \frac{x}{{a}} - \frac{y}{{b}}\right)$, so $g_x = -\frac{{c}}{{a}}$ and $g_y = -\frac{{c}}{{b}}$.
    Upward flux integrand: $-Pg_x - Qg_y + R = \frac{{c}}{{a}}x + \frac{{c}}{{b}}y + {c}\left(1 - \frac{x}{{a}} - \frac{y}{{b}}\right) = {c}$, a constant.
    The shadow is a right triangle with legs {a} and {b}, area $\frac{{a}\cdot{b}}{2}$, so the flux is ${c}\cdot\frac{{a}\cdot{b}}{2} =$ **{flux}**.
- id: mv-d-surf-int
  title: Surface integral over a hemisphere
  topic: Surface integrals
  vars:
    a: {min: 1, max: 3}
    p: {min: 1, max: 4}
    q: {min: 1, max: 4}
  calc:
    t1: 2*pi*p*a^2
    t2: q*pi*a^3
    ans: t1 + t2
  prompt: 'Evaluate $\displaystyle\iint_S({p} + {q:coef}z)\,dS$, where $S$ is the upper hemisphere $x^2 + y^2 + z^2 = {a}^2$, $z \ge 0$. (2 decimals.)'
  answers:
    - {name: ans, label: 'Value', relTolerance: 0.001}
  solution: |-
    Parametrize with spherical angles: $z = {a}\cos\phi$ and $dS = {a}^2\sin\phi\,d\phi\,d\theta$ for $0 \le \phi \le \frac\pi2$.
    $\iint_S {p}\,dS = {p}\cdot2\pi\cdot{a}^2 \approx {t1:num2}$ (the area of the hemisphere is $2\pi a^2$), and $\iint_S {q}z\,dS = {q}\cdot\pi\cdot{a}^3 \approx {t2:num2}$.
    Total $\approx$ **{ans:num2}**.
- id: mv-d-stokes-disk
  title: Circulation by Stokes' theorem
  topic: Stokes' theorem
  vars:
    a: {min: 1, max: 3}
    b: {min: 1, max: 3}
    R: {min: 1, max: 3}
    h: {min: 0, max: 5}
  calc:
    ans: 3*(a + b)*pi*R^4/4
  prompt: 'Use Stokes'' theorem to evaluate $\displaystyle\oint_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle -{a:coef}y^3,\; {b:coef}x^3,\; z\rangle$, where $C$ is the circle $x^2 + y^2 = {R}^2$ in the plane $z = {h}$, counterclockwise seen from above. (2 decimals.)'
  answers:
    - {name: ans, label: 'Value', relTolerance: 0.001}
  solution: |-
    $\operatorname{curl}\mathbf F = \langle 0,\; 0,\; 3({b})x^2 + 3({a})y^2\rangle$. Use the flat disk at height {h} with $\mathbf n = \mathbf k$.
    Over a disk of radius $R$, $\iint x^2\,dA = \iint y^2\,dA = \frac{\pi R^4}{4}$, so the flux of the curl is $3({b} + {a})\cdot\frac{\pi\cdot{R}^4}{4} \approx$ **{ans:num2}**. (The height {h} does not matter.)
- id: mv-d-div-thm-box
  title: Divergence theorem on a box
  topic: Divergence theorem
  vars:
    a: {min: -2, max: 3}
    b: {min: -2, max: 3}
    c: {min: -2, max: 3}
    A: {min: 1, max: 3}
    B: {min: 1, max: 3}
    C: {min: 1, max: 3}
  where: ["a != 0", "b != 0", "c != 0", "ans != 0"]
  calc:
    a2: 2*a
    b2: 2*b
    c2: 2*c
    ans: a*A^2*B*C + b*A*B^2*C + c*A*B*C^2
  prompt: 'Use the Divergence theorem to find the outward flux of $\mathbf F = \langle {a:coef}x^2,\; {b:coef}y^2,\; {c:coef}z^2\rangle$ through the surface of the box $[0, {A}]\times[0, {B}]\times[0, {C}]$.'
  answers:
    - {name: ans, label: 'Flux'}
  solution: |-
    $\operatorname{div}\mathbf F = {a2}x + ({b2})y + ({c2})z$.
    $\displaystyle\iiint {a2}x\,dV = {a2}\cdot\frac{{A}^2}{2}\cdot{B}\cdot{C}$, and similarly for the other terms. Adding:
    ${a}\cdot{A}^2\cdot{B}\cdot{C} + ({b})\cdot{A}\cdot{B}^2\cdot{C} + ({c})\cdot{A}\cdot{B}\cdot{C}^2 =$ **{ans}**.
- id: mv-d-div-thm-ball
  title: Divergence theorem on a ball
  topic: Divergence theorem
  vars:
    a: {min: -3, max: 4}
    b: {min: -3, max: 4}
    c: {min: -3, max: 4}
    R: {min: 1, max: 3}
  where: ["d != 0", "a != 0", "b != 0", "c != 0"]
  calc:
    d: a + b + c
    ans: d*4*pi*R^3/3
  prompt: 'Find the outward flux of $\mathbf F = \langle {a:coef}x + y^2,\; {b:coef}y + z^2,\; {c:coef}z + x^2\rangle$ through the sphere $x^2 + y^2 + z^2 = {R}^2$. (2 decimals.)'
  answers:
    - {name: ans, label: 'Flux', relTolerance: 0.001}
  solution: |-
    $\operatorname{div}\mathbf F = {a} + {b} + {c} = {d}$ (the squared terms have zero partial derivatives in their own slots).
    By the Divergence theorem the flux is ${d}\cdot\frac43\pi\cdot{R}^3 \approx$ **{ans:num2}**.
- id: mv-d-gauss-flux
  title: Gauss's law
  topic: Applications to physics
  vars:
    qn: {min: 1, max: 50}
    r: {min: 1, max: 9}
  calc:
    flux: qn*1e-9/8.854e-12
  prompt: 'A point charge of {qn} nC sits inside a closed surface (a sphere of radius {r} cm around it). Using $\varepsilon_0 = 8.854\times10^{-12}\text{ C}^2/(\text{N·m}^2)$, find the electric flux through the surface in N·m²/C (3 significant figures).'
  answers:
    - {name: flux, label: 'Flux (N·m²/C)', sigfigs: 3}
  solution: |-
    By Gauss's law the flux is $Q_{\text{enc}}/\varepsilon_0$, whatever the radius: $\dfrac{{qn}\times10^{-9}}{8.854\times10^{-12}} \approx$ **{flux:sig3}** N·m²/C.
