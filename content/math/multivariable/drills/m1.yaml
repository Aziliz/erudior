# Module 1 drills
- id: mv-d-bridge-deriv
  title: Product rule with an exponential
  topic: Derivative review
  vars:
    n: {min: 3, max: 5}
    k: {min: -4, max: 4}
  where: ["k != 0"]
  calc:
    nm1: n - 1
  prompt: 'Differentiate $f(x) = x^{n}e^{{k:coef}x}$.'
  answers:
    - kind: expression
      expression: 'n*x^(n-1)*exp(k*x) + k*x^n*exp(k*x)'
      variables: [x]
      show: '${n}x^{{nm1}}e^{{k:coef}x} {k:signedcoef}x^{{n}}e^{{k:coef}x}$'
      label: '$f''(x) =$'
  solution: |-
    Product rule with $u = x^{n}$ and $v = e^{{k:coef}x}$: $u' = {n}x^{nm1}$ and, by the chain rule, $v' = {k:coef}e^{{k:coef}x}$.
    So $f'(x) = u'v + uv' =$ **${n}x^{nm1}e^{{k:coef}x} {k:signedcoef}x^{n}e^{{k:coef}x}$**.
- id: mv-d-bridge-integ
  title: Definite integral by substitution
  topic: Integral review
  vars:
    a: {min: 1, max: 2}
    k: {min: 1, max: 3}
    n: {min: 2, max: 3}
  calc:
    n1: n + 1
    den: 2*n1
    top: a^2 + k
    ans: (top^(n+1) - k^(n+1))/(2*(n+1))
  prompt: 'Evaluate $\displaystyle\int_0^{a} x\,(x^2 + {k})^{n}\,dx$. (Exact fraction or 2 decimals.)'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    Let $u = x^2 + {k}$, so $du = 2x\,dx$. The limits become $u = {k}$ and $u = {top}$:
    $\dfrac12\displaystyle\int_{{k}}^{{top}} u^{n}\,du = \dfrac{u^{{n1}}}{2\cdot {n1}}\Big|_{{k}}^{{top}} = \dfrac{{top}^{{n1}} - {k}^{{n1}}}{{den}} =$ **{ans}**.
- id: mv-d-dist3
  title: Distance between points in space
  topic: 3D coordinates
  vars:
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
    z1: {min: -6, max: 6}
    x2: {min: -6, max: 6}
    y2: {min: -6, max: 6}
    z2: {min: -6, max: 6}
  calc:
    dx: x2 - x1
    dy: y2 - y1
    dz: z2 - z1
    s: dx^2 + dy^2 + dz^2
    dist: sqrt(s)
  where: ["s > 0"]
  prompt: 'Find the distance between $P({x1}, {y1}, {z1})$ and $Q({x2}, {y2}, {z2})$. (2 decimals.)'
  answers:
    - {name: dist, label: '$|PQ| =$'}
  solution: |-
    Differences: $\Delta x = {dx}$, $\Delta y = {dy}$, $\Delta z = {dz}$.
    $|PQ| = \sqrt{({dx})^2 + ({dy})^2 + ({dz})^2} = \sqrt{{s}} \approx$ **{dist:num2}**.
- id: mv-d-vec-ops
  title: Linear combination of vectors
  topic: Vector algebra
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
    u1: {min: -5, max: 5}
    u2: {min: -5, max: 5}
    u3: {min: -5, max: 5}
    v1: {min: -5, max: 5}
    v2: {min: -5, max: 5}
    v3: {min: -5, max: 5}
  where: ["p != 0", "q != 0"]
  calc:
    w1: p*u1 + q*v1
    w2: p*u2 + q*v2
    w3: p*u3 + q*v3
  prompt: 'Let $\mathbf u = \langle {u1}, {u2}, {u3}\rangle$ and $\mathbf v = \langle {v1}, {v2}, {v3}\rangle$. Find ${p:coef}\mathbf u {q:signedcoef}\mathbf v$.'
  answers:
    - {name: w1, label: 'first component'}
    - {name: w2, label: 'second component'}
    - {name: w3, label: 'third component'}
  solution: |-
    Scale each vector, then add componentwise:
    first ${p}({u1}) + ({q})({v1}) = {w1}$, second ${p}({u2}) + ({q})({v2}) = {w2}$, third ${p}({u3}) + ({q})({v3}) = {w3}$.
    Result: **$\langle {w1}, {w2}, {w3}\rangle$**.
- id: mv-d-unit
  title: Unit vector in a given direction
  topic: Vector algebra
  vars:
    v1: {min: -9, max: 9}
    v2: {min: -9, max: 9}
    v3: {min: -9, max: 9}
  calc:
    L: sqrt(v1^2 + v2^2 + v3^2)
    e1: v1/L
    e2: v2/L
    e3: v3/L
  where: ["L > 1", "L == round(L)", "v1 != 0", "v2 != 0"]
  prompt: 'Find the unit vector in the direction of $\mathbf v = \langle {v1}, {v2}, {v3}\rangle$. (Exact fractions.)'
  answers:
    - {name: e1, label: 'first component', kind: fraction}
    - {name: e2, label: 'second component', kind: fraction}
    - {name: e3, label: 'third component', kind: fraction}
  solution: |-
    $|\mathbf v| = \sqrt{({v1})^2 + ({v2})^2 + ({v3})^2} = {L}$. Divide each component by {L}:
    **$\left\langle {e1:texfrac}, {e2:texfrac}, {e3:texfrac}\right\rangle$**.
- id: mv-d-dot-angle
  title: Angle between two vectors
  topic: Dot product
  vars:
    a1: {min: -5, max: 5}
    a2: {min: -5, max: 5}
    a3: {min: -5, max: 5}
    b1: {min: -5, max: 5}
    b2: {min: -5, max: 5}
    b3: {min: -5, max: 5}
  calc:
    dot: a1*b1 + a2*b2 + a3*b3
    la: sqrt(a1^2 + a2^2 + a3^2)
    lb: sqrt(b1^2 + b2^2 + b3^2)
    cs: dot/(la*lb)
    ang: acosd(cs)
  where: ["la > 0", "lb > 0", "abs(cs) < 0.999"]
  prompt: 'Find the angle between $\mathbf a = \langle {a1}, {a2}, {a3}\rangle$ and $\mathbf b = \langle {b1}, {b2}, {b3}\rangle$, in degrees (1 decimal).'
  answers:
    - {name: ang, label: '$\theta =$', tolerance: 0.1}
  solution: |-
    $\mathbf a\cdot\mathbf b = {dot}$, $|\mathbf a| \approx {la:num4}$, $|\mathbf b| \approx {lb:num4}$.
    $\cos\theta = \dfrac{\mathbf a\cdot\mathbf b}{|\mathbf a||\mathbf b|} \approx {cs:num4}$, so $\theta \approx$ **{ang:num1}°**.
- id: mv-d-proj
  title: Vector projection
  topic: Projections
  vars:
    a1: {min: -4, max: 4}
    a2: {min: -4, max: 4}
    a3: {min: -4, max: 4}
    b1: {min: -5, max: 5}
    b2: {min: -5, max: 5}
    b3: {min: -5, max: 5}
  calc:
    dot: a1*b1 + a2*b2 + a3*b3
    aa: a1^2 + a2^2 + a3^2
    f: dot/aa
    p1: f*a1
    p2: f*a2
    p3: f*a3
  where: ["aa > 0", "dot != 0"]
  prompt: 'Find $\operatorname{proj}_{\mathbf a}\mathbf b$ for $\mathbf a = \langle {a1}, {a2}, {a3}\rangle$ and $\mathbf b = \langle {b1}, {b2}, {b3}\rangle$. (Exact fractions.)'
  answers:
    - {name: p1, label: 'first component', kind: fraction}
    - {name: p2, label: 'second component', kind: fraction}
    - {name: p3, label: 'third component', kind: fraction}
  solution: |-
    $\mathbf a\cdot\mathbf b = {dot}$ and $|\mathbf a|^2 = {aa}$, so $\operatorname{proj}_{\mathbf a}\mathbf b = {f:texfrac}\,\mathbf a =$
    **$\left\langle {p1:texfrac}, {p2:texfrac}, {p3:texfrac}\right\rangle$**.
- id: mv-d-cross
  title: Compute a cross product
  topic: Cross product
  vars:
    a1: {min: -5, max: 5}
    a2: {min: -5, max: 5}
    a3: {min: -5, max: 5}
    b1: {min: -5, max: 5}
    b2: {min: -5, max: 5}
    b3: {min: -5, max: 5}
  calc:
    c1: a2*b3 - a3*b2
    c2: a3*b1 - a1*b3
    c3: a1*b2 - a2*b1
  where: ["c1^2 + c2^2 + c3^2 > 0"]
  prompt: 'Compute $\mathbf a\times\mathbf b$ for $\mathbf a = \langle {a1}, {a2}, {a3}\rangle$ and $\mathbf b = \langle {b1}, {b2}, {b3}\rangle$.'
  answers:
    - {name: c1, label: '$\mathbf i$ component'}
    - {name: c2, label: '$\mathbf j$ component'}
    - {name: c3, label: '$\mathbf k$ component'}
  solution: |-
    $\mathbf i$: $({a2})({b3}) - ({a3})({b2}) = {c1}$.
    $\mathbf j$: $-\left[({a1})({b3}) - ({a3})({b1})\right] = {c2}$.
    $\mathbf k$: $({a1})({b2}) - ({a2})({b1}) = {c3}$.
    So $\mathbf a\times\mathbf b =$ **$\langle {c1}, {c2}, {c3}\rangle$**.
- id: mv-d-tri-area
  title: Area of a triangle in space
  topic: Cross product
  vars:
    px: {min: -3, max: 3}
    py: {min: -3, max: 3}
    pz: {min: -3, max: 3}
    qx: {min: -3, max: 3}
    qy: {min: -3, max: 3}
    qz: {min: -3, max: 3}
    rx: {min: -3, max: 3}
    ry: {min: -3, max: 3}
    rz: {min: -3, max: 3}
  calc:
    u1: qx - px
    u2: qy - py
    u3: qz - pz
    v1: rx - px
    v2: ry - py
    v3: rz - pz
    c1: u2*v3 - u3*v2
    c2: u3*v1 - u1*v3
    c3: u1*v2 - u2*v1
    area: sqrt(c1^2 + c2^2 + c3^2)/2
  where: ["area > 0"]
  prompt: 'Find the area of the triangle with vertices $P({px}, {py}, {pz})$, $Q({qx}, {qy}, {qz})$, $R({rx}, {ry}, {rz})$. (2 decimals.)'
  answers:
    - {name: area, label: 'Area'}
  solution: |-
    $\overrightarrow{PQ} = \langle {u1}, {u2}, {u3}\rangle$, $\overrightarrow{PR} = \langle {v1}, {v2}, {v3}\rangle$.
    $\overrightarrow{PQ}\times\overrightarrow{PR} = \langle {c1}, {c2}, {c3}\rangle$, and half its length is the area: $\tfrac12\sqrt{({c1})^2 + ({c2})^2 + ({c3})^2} \approx$ **{area:num2}**.
- id: mv-d-triple
  title: Volume of a parallelepiped
  topic: Triple product
  vars:
    a1: {min: -3, max: 4}
    a2: {min: -3, max: 4}
    a3: {min: -3, max: 4}
    b1: {min: -3, max: 4}
    b2: {min: -3, max: 4}
    b3: {min: -3, max: 4}
    c1: {min: -3, max: 4}
    c2: {min: -3, max: 4}
    c3: {min: -3, max: 4}
  calc:
    det: a1*(b2*c3 - b3*c2) - a2*(b1*c3 - b3*c1) + a3*(b1*c2 - b2*c1)
    vol: abs(det)
  where: ["det != 0"]
  prompt: 'Find the volume of the parallelepiped with edges $\mathbf a = \langle {a1}, {a2}, {a3}\rangle$, $\mathbf b = \langle {b1}, {b2}, {b3}\rangle$, $\mathbf c = \langle {c1}, {c2}, {c3}\rangle$.'
  answers:
    - {name: vol, label: 'Volume'}
  solution: |-
    $\mathbf a\cdot(\mathbf b\times\mathbf c) = \begin{vmatrix} {a1} & {a2} & {a3}\\ {b1} & {b2} & {b3}\\ {c1} & {c2} & {c3}\end{vmatrix} = {det}$.
    The volume is its absolute value: **{vol}**.
- id: mv-d-plane-3pts
  title: Plane through three points
  topic: Planes
  vars:
    px: {min: -3, max: 3}
    py: {min: -3, max: 3}
    pz: {min: -3, max: 3}
    qx: {min: -3, max: 3}
    qy: {min: -3, max: 3}
    qz: {min: -3, max: 3}
    rx: {min: -3, max: 3}
    ry: {min: -3, max: 3}
    rz: {min: -3, max: 3}
  calc:
    u1: qx - px
    u2: qy - py
    u3: qz - pz
    v1: rx - px
    v2: ry - py
    v3: rz - pz
    n1: u2*v3 - u3*v2
    n2: u3*v1 - u1*v3
    n3: u1*v2 - u2*v1
    d: n1*px + n2*py + n3*pz
  where: ["n1 != 0", "n2 != 0", "n3 != 0"]
  prompt: 'Find the plane through $P({px}, {py}, {pz})$, $Q({qx}, {qy}, {qz})$, $R({rx}, {ry}, {rz})$. Use the normal $\mathbf n = \overrightarrow{PQ}\times\overrightarrow{PR}$ and write the plane as $n_1x + n_2y + n_3z = d$.'
  answers:
    - {name: n1, label: '$n_1 =$'}
    - {name: n2, label: '$n_2 =$'}
    - {name: n3, label: '$n_3 =$'}
    - {name: d, label: '$d =$'}
  solution: |-
    $\overrightarrow{PQ} = \langle {u1}, {u2}, {u3}\rangle$ and $\overrightarrow{PR} = \langle {v1}, {v2}, {v3}\rangle$, so $\mathbf n = \langle {n1}, {n2}, {n3}\rangle$.
    Then $d = \mathbf n\cdot P = ({n1})({px}) + ({n2})({py}) + ({n3})({pz}) = {d}$.
    The plane is **${n1:coef}x {n2:signedcoef}y {n3:signedcoef}z = {d}$**.
- id: mv-d-point-plane
  title: Distance from a point to a plane
  topic: Planes
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: 1, max: 4}
    d: {min: -8, max: 8}
    x1: {min: -5, max: 5}
    y1: {min: -5, max: 5}
    z1: {min: -5, max: 5}
  calc:
    num: abs(a*x1 + b*y1 + c*z1 - d)
    nn: sqrt(a^2 + b^2 + c^2)
    dist: num/nn
  where: ["a != 0", "b != 0", "num != 0"]
  prompt: 'Find the distance from $({x1}, {y1}, {z1})$ to the plane ${a:coef}x {b:signedcoef}y {c:signedcoef}z = {d}$. (2 decimals.)'
  answers:
    - {name: dist, label: '$D =$'}
  solution: |-
    $D = \dfrac{|ax_1 + by_1 + cz_1 - d|}{\sqrt{a^2 + b^2 + c^2}} = \dfrac{|({a})({x1}) + ({b})({y1}) + ({c})({z1}) - ({d})|}{\sqrt{({a})^2 + ({b})^2 + ({c})^2}} = \dfrac{{num}}{{nn:num4}} \approx$ **{dist:num2}**.
- id: mv-d-sphere-center
  title: Center and radius of a sphere
  topic: Quadric surfaces
  vars:
    h: {min: -5, max: 5}
    k: {min: -5, max: 5}
    l: {min: -5, max: 5}
    r: {min: 1, max: 7}
  calc:
    m1: -2*h
    m2: -2*k
    m3: -2*l
    cst: h^2 + k^2 + l^2 - r^2
  where: ["h != 0", "k != 0", "l != 0", "cst != 0"]
  prompt: 'Find the center $(h, k, l)$ and radius $r$ of the sphere $x^2 + y^2 + z^2 {m1:signedcoef}x {m2:signedcoef}y {m3:signedcoef}z {cst:signed} = 0$.'
  answers:
    - {name: h, label: '$h =$'}
    - {name: k, label: '$k =$'}
    - {name: l, label: '$l =$'}
    - {name: r, label: '$r =$'}
  solution: |-
    Complete the square in each variable: each center coordinate is minus half that variable's linear coefficient,
    so $h = -\tfrac12({m1}) = {h}$, $k = -\tfrac12({m2}) = {k}$ and $l = -\tfrac12({m3}) = {l}$.
    Then $(x - h)^2 + (y - k)^2 + (z - l)^2 = h^2 + k^2 + l^2 - ({cst}) = {r}^2$.
    Center **$({h}, {k}, {l})$**, radius **{r}**.
