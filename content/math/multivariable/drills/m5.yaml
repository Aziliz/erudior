# Module 5 drills
- id: mv-d-dbl-rect
  title: Double integral over a rectangle
  topic: Iterated integrals
  vars:
    p: {min: -4, max: 5}
    q: {min: 1, max: 4}
    a: {min: 0, max: 2}
    w: {min: 1, max: 3}
    c: {min: 0, max: 2}
    h: {min: 1, max: 3}
  where: ["p != 0"]
  calc:
    b: a + w
    d: c + h
    X2: (b^2 - a^2)/2
    Y2: (d^2 - c^2)/2
    ans: p*X2*h + q*X2*Y2
  prompt: 'Evaluate $\displaystyle\iint_R ({p:coef}x + {q:coef}xy)\,dA$ over $R = [{a}, {b}]\times[{c}, {d}]$. (Exact or 2 decimals.)'
  figure:
    type: plot
    x: [-1, 6]
    y: [-1, 6]
    equal: true
    polygons:
      - {points: [[a, c], [b, c], [b, d], [a, d]], fill: true}
    caption: 'R = [{a}, {b}] × [{c}, {d}]'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    Integrate in $y$ first: $\displaystyle\int_{{c}}^{{d}}({p:coef}x + {q:coef}xy)\,dy = {p}x({h}) + {q:coef}x\cdot\frac{{d}^2 - {c}^2}{2} = ({p}\cdot{h} + {q}\cdot{Y2})x$.
    Then in $x$: $\displaystyle\int_{{a}}^{{b}}x\,dx = \frac{{b}^2 - {a}^2}{2} = {X2}$, so the value is $\left({p}\cdot{h} + {q}\cdot{Y2}\right)({X2}) =$ **{ans}**.
- id: mv-d-dbl-avg
  title: Average value over a rectangle
  topic: Double integrals
  vars:
    A: {min: 1, max: 6}
    B: {min: 1, max: 6}
  calc:
    I: A*B*(A^2 + B^2)/3
    fav: (A^2 + B^2)/3
  prompt: 'Find the average value of $f(x, y) = x^2 + y^2$ over the rectangle $[0, {A}]\times[0, {B}]$. (Exact or 2 decimals.)'
  answers:
    - {name: fav, label: '$f_{\text{avg}} =$'}
  solution: |-
    $\displaystyle\iint_R(x^2 + y^2)\,dA = \int_0^{{B}}\int_0^{{A}}(x^2 + y^2)\,dx\,dy = {B}\cdot\frac{{A}^3}{3} + {A}\cdot\frac{{B}^3}{3} \approx {I:num2}$.
    The area is ${A}\cdot{B}$, so $f_{\text{avg}} = \dfrac{{A}^2 + {B}^2}{3} \approx$ **{fav:num2}**.
- id: mv-d-dbl-region
  title: Integral over the region between a line and a parabola
  topic: General regions
  vars:
    m: {min: 1, max: 3}
    p: {min: 1, max: 5}
    q: {min: -3, max: 3}
  calc:
    area: m^3/6
    mx: m^4/12
    ans: p*area + q*mx
  where: ["ans != 0"]
  prompt: 'Let $D$ be the region between $y = x^2$ and $y = {m:coef}x$. Evaluate $\displaystyle\iint_D({p} {q:signedcoef}x)\,dA$. (Exact or 2 decimals.)'
  figure:
    type: plot
    x: [-0.5, 3.5]
    y: [-0.5, 10]
    functions:
      - {f: 'm*x', label: 'y = {m}x'}
      - {f: 'x^2', label: 'y = x²'}
    shade:
      - {f: 'm*x', g: 'x^2', from: 0, to: m}
    caption: 'D lies between the parabola and the line for 0 ≤ x ≤ {m}'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    The curves meet at $x = 0$ and $x = {m}$, with the line on top. Type I:
    $\displaystyle\int_0^{{m}}\int_{x^2}^{{m}x}({p} {q:signedcoef}x)\,dy\,dx = \int_0^{{m}}({p} {q:signedcoef}x)({m}x - x^2)\,dx$.
    Since $\int_0^{{m}}({m}x - x^2)\,dx = \frac{{m}^3}{6}$ and $\int_0^{{m}}x({m}x - x^2)\,dx = \frac{{m}^4}{12}$, the value is ${p}\cdot\frac{{m}^3}{6} + ({q})\cdot\frac{{m}^4}{12} =$ **{ans:num2}**.
- id: mv-d-reverse
  title: Reverse the order of integration
  topic: Reversing the order
  vars:
    k: {min: 1, max: 4}
    b: {choices: [0.5, 1, 1.5]}
  calc:
    top: k*b
    ans: (k/2)*(exp(b^2) - 1)
  prompt: 'Evaluate $\displaystyle\int_0^{{top}}\int_{x/{k}}^{{b}}e^{y^2}\,dy\,dx$ by reversing the order of integration. (2 decimals.)'
  figure:
    type: plot
    x: [-0.3, 6.3]
    y: [-0.3, 2]
    functions:
      - {f: 'x/k', label: 'y = x/{k}'}
    shade:
      - {f: 'b', g: 'x/k', from: 0, to: top}
    caption: 'The region: 0 ≤ y ≤ {b}, 0 ≤ x ≤ {k}y'
  answers:
    - {name: ans, label: 'Value', relTolerance: 0.002}
  solution: |-
    $\int e^{y^2}\,dy$ is not elementary, so reverse. The region $0 \le x \le {top}$, $x/{k} \le y \le {b}$ is the triangle $0 \le y \le {b}$, $0 \le x \le {k}y$.
    $\displaystyle\int_0^{{b}}\int_0^{{k}y}e^{y^2}\,dx\,dy = \int_0^{{b}}{k}y\,e^{y^2}\,dy = \frac{{k}}{2}\left(e^{{b}^2} - 1\right) \approx$ **{ans:num2}**.
- id: mv-d-polar-disk
  title: Volume under a paraboloid (polar)
  topic: Polar double integrals
  vars:
    H: {min: 2, max: 12}
    k: {min: 1, max: 3}
  calc:
    R2: H/k
    V: pi*H^2/(2*k)
  prompt: 'Find the volume of the solid under $z = {H} - {k:coef}(x^2 + y^2)$ and above the $xy$-plane. (2 decimals.)'
  answers:
    - {name: V, label: '$V =$', relTolerance: 0.001}
  solution: |-
    The paraboloid meets $z = 0$ where $r^2 = {H}/{k}$, so the base is the disk $r \le \sqrt{{R2:num4}}$.
    $V = \displaystyle\int_0^{2\pi}\int_0^{\sqrt{{H}/{k}}}({H} - {k}r^2)\,r\,dr\,d\theta = 2\pi\left[\frac{{H}r^2}{2} - \frac{{k}r^4}{4}\right]_0^{\sqrt{{H}/{k}}} = \frac{\pi\cdot{H}^2}{2\cdot{k}} \approx$ **{V:num2}**.
- id: mv-d-polar-area
  title: Area of a rose petal
  topic: Polar double integrals
  vars:
    a: {min: 1, max: 4}
    n: {min: 2, max: 5}
  calc:
    half: pi/(2*n)
    A: pi*a^2/(4*n)
  prompt: 'Find the area of one petal of the rose $r = {a:coef}\cos({n}\theta)$. (2 decimals.)'
  figure:
    type: plot
    x: [-4.5, 4.5]
    y: [-4.5, 4.5]
    equal: true
    curves:
      - {x: 'a*cos(n*t)*cos(t)', y: 'a*cos(n*t)*sin(t)', t: [0, '2pi']}
    caption: 'r = {a} cos({n}θ)'
  answers:
    - {name: A, label: 'Area', relTolerance: 0.002}
  solution: |-
    One petal runs between consecutive zeros of $\cos({n}\theta)$: $-\frac{\pi}{2\cdot{n}} \le \theta \le \frac{\pi}{2\cdot{n}}$.
    Area $= \displaystyle\int\int_0^{{a:coef}\cos({n}\theta)}r\,dr\,d\theta = \frac{{a}^2}{2}\int_{-\pi/(2\cdot{n})}^{\pi/(2\cdot{n})}\cos^2({n}\theta)\,d\theta = \frac{{a}^2}{2}\cdot\frac{\pi}{2\cdot{n}} \approx$ **{A:num2}**.
- id: mv-d-mass-lamina
  title: Mass of a lamina
  topic: Mass and center of mass
  vars:
    A: {min: 1, max: 4}
    B: {min: 1, max: 4}
    p: {min: 1, max: 5}
    q: {min: 0, max: 3}
    s: {min: 0, max: 3}
  calc:
    m: p*A*B + q*A^2*B/2 + s*A*B^2/2
  prompt: 'A lamina occupies $[0, {A}]\times[0, {B}]$ and has density $\rho(x, y) = {p} + {q}x + {s}y$. Find its mass. (Exact or 2 decimals.)'
  answers:
    - {name: m, label: '$m =$'}
  solution: |-
    $m = \displaystyle\int_0^{{A}}\int_0^{{B}}({p} + {q}x + {s}y)\,dy\,dx = {p}({A})({B}) + {q}\cdot\frac{{A}^2}{2}\cdot{B} + {s}\cdot{A}\cdot\frac{{B}^2}{2} =$ **{m:num2}**.
- id: mv-d-centroid
  title: Centroid of the region under a power curve
  topic: Mass and center of mass
  vars:
    a: {min: 1, max: 3}
    n: {min: 1, max: 3}
    k: {min: 1, max: 2}
  calc:
    area: k*a^(n+1)/(n+1)
    xb: (n+1)*a/(n+2)
    yb: (n+1)*k*a^n/(2*(2*n+1))
  prompt: 'Find the centroid of the region under $y = {k:coef}x^{n}$ for $0 \le x \le {a}$ (above the $x$-axis). (2 decimals.)'
  figure:
    type: plot
    x: [-0.3, 3.3]
    y: [-0.5, 10]
    functions:
      - {f: 'k*x^n', from: 0, to: a}
    shade:
      - {f: 'k*x^n', from: 0, to: a}
    points:
      - {at: [xb, yb], label: 'centroid'}
    caption: 'The region under y = {k}x^{n}'
  answers:
    - {name: xb, label: '$\bar x =$'}
    - {name: yb, label: '$\bar y =$'}
  solution: |-
    Area $A = \int_0^{{a}}{k}x^{n}\,dx \approx {area:num4}$.
    $\bar x = \dfrac1A\displaystyle\int_0^{{a}}x\cdot{k}x^{n}\,dx$ and $\bar y = \dfrac1A\displaystyle\int_0^{{a}}\int_0^{{k}x^{n}}y\,dy\,dx = \dfrac1A\int_0^{{a}}\frac{({k}x^{n})^2}{2}\,dx$.
    These give **$\bar x \approx {xb:num2}$** and **$\bar y \approx {yb:num2}$**.
- id: mv-d-surf-area-graph
  title: Surface area of a plane over a rectangle
  topic: Surface area
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
    c: {min: 0, max: 5}
    A: {min: 1, max: 5}
    B: {min: 1, max: 5}
  where: ["p != 0", "q != 0"]
  calc:
    fac: sqrt(1 + p^2 + q^2)
    S: A*B*fac
  prompt: 'Find the area of the part of the plane $z = {c} {p:signedcoef}x {q:signedcoef}y$ that lies above the rectangle $[0, {A}]\times[0, {B}]$. (2 decimals.)'
  answers:
    - {name: S, label: 'Area', relTolerance: 0.001}
  solution: |-
    $f_x = {p}$ and $f_y = {q}$, so the stretch factor is $\sqrt{1 + ({p})^2 + ({q})^2} \approx {fac:num4}$, constant.
    Area $= \displaystyle\iint_R\sqrt{1 + f_x^2 + f_y^2}\,dA = {A}\cdot{B}\cdot{fac:num4} \approx$ **{S:num2}**.
