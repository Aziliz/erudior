# Module 5: Double integrals
- id: mv-q-2001
  lesson: mv-double-rect
  module_quiz: true
  topic: Iterated integrals
  stem: 'Evaluate $\displaystyle\int_0^2\int_0^2(x^2 + y)\,dy\,dx$.'
  choices: ['$\tfrac{28}{3}$', '$\tfrac{16}{3}$', '$9$', '$\tfrac{14}{3}$']
  answer: 0
  explanation: |-
    Inner: $\int_0^2(x^2 + y)\,dy = 2x^2 + 2$. Outer: $\int_0^2(2x^2 + 2)\,dx = \tfrac{16}{3} + 4 = \tfrac{28}{3}$.
    $9$ is the midpoint-rule estimate with four squares, not the exact value.
- id: mv-q-2002
  lesson: mv-double-rect
  topic: Iterated integrals
  stem: 'Fubini''s theorem says that for continuous $f$ on a rectangle $[a,b]\times[c,d]$,'
  choices: ['$\iint_R f\,dA$ equals the product $\int_a^b f\,dx\cdot\int_c^d f\,dy$', 'the iterated integrals in both orders are equal to the double integral', 'the double integral is always positive', 'only the $dy\,dx$ order may be used']
  answer: 1
  explanation: |-
    On a rectangle, $\iint_R f\,dA = \int_a^b\int_c^d f\,dy\,dx = \int_c^d\int_a^b f\,dx\,dy$. The product shortcut applies only when $f(x,y) = g(x)h(y)$.
- id: mv-q-2003
  lesson: mv-double-rect
  module_quiz: true
  topic: Iterated integrals
  stem: 'To evaluate $\iint_R y\cos(xy)\,dA$ over $[0, 1]\times[0, \tfrac{\pi}{2}]$, which order is easier, and what is the value?'
  choices: ['$dy$ first; value $\tfrac{\pi}{2}$', '$dy$ first; value $0$', '$dx$ first; value $1$', '$dx$ first; value $\tfrac{\pi}{2}$']
  answer: 2
  explanation: |-
    With $y$ constant, $\int_0^1 y\cos(xy)\,dx = \sin y$ directly (no integration by parts). Then $\int_0^{\pi/2}\sin y\,dy = 1$.
- id: mv-q-2004
  lesson: mv-double-rect
  topic: Double integrals
  stem: 'Evaluate $\iint_R xe^y\,dA$ over $R = [0, 1]\times[0, \ln2]$.'
  choices: ['$\ln2$', '$1$', '$\tfrac{\ln 2}{2}$', '$\tfrac12$']
  answer: 3
  explanation: |-
    The integrand factors over a rectangle: $\left(\int_0^1 x\,dx\right)\left(\int_0^{\ln2}e^y\,dy\right) = \tfrac12\cdot(2 - 1) = \tfrac12$.
- id: mv-q-2005
  lesson: mv-double-rect
  module_quiz: true
  topic: Double integrals
  stem: 'Find the average value of $f(x, y) = xy$ over $[0, 2]\times[0, 4]$.'
  choices: ['$2$', '$16$', '$4$', '$8$']
  answer: 0
  explanation: |-
    $\iint xy\,dA = \left(\int_0^2x\,dx\right)\left(\int_0^4y\,dy\right) = 2\cdot8 = 16$, and the area is 8. Average $= 16/8 = 2$.
    $16$ forgets to divide by the area.
- id: mv-q-2006
  lesson: mv-double-rect
  topic: Double integrals
  stem: 'Using the midpoint rule with the four unit squares of $[0, 2]\times[0, 2]$, estimate $\iint (x^2 + y)\,dA$.'
  choices: ['$7$', '$9$', '$11$', '$\tfrac{28}{3}$']
  answer: 1
  explanation: |-
    Midpoints $(0.5,0.5), (1.5,0.5), (0.5,1.5), (1.5,1.5)$ give $0.75 + 2.75 + 1.75 + 3.75 = 9$, times $\Delta A = 1$.
    $\tfrac{28}{3}$ is the exact value, not the midpoint estimate.
- id: mv-q-2007
  lesson: mv-double-rect
  topic: Iterated integrals
  stem: 'Evaluate $\displaystyle\int_0^3\int_1^2(2x + 6x^2y)\,dy\,dx$.'
  choices: ['$63$', '$81$', '$90$', '$108$']
  answer: 2
  explanation: |-
    Inner: $\int_1^2(2x + 6x^2y)\,dy = 2x + 6x^2\cdot\tfrac32 = 2x + 9x^2$. Outer: $\int_0^3(2x + 9x^2)\,dx = 9 + 81 = 90$.
- id: mv-q-2008
  lesson: mv-double-rect
  topic: Iterated integrals
  stem: 'What is the inner integral $\displaystyle\int_1^3(x^2 + 2y)\,dy$?'
  choices: ['$\tfrac{26}{3} + 4x$', '$x^2 + 8$', '$2x^2 + 6$', '$2x^2 + 8$']
  answer: 3
  explanation: |-
    Treat $x$ as constant: $\left[x^2y + y^2\right]_{1}^{3} = (3x^2 + 9) - (x^2 + 1) = 2x^2 + 8$. The result still depends on $x$, the outer variable.
- id: mv-q-2009
  lesson: mv-double-rect
  topic: Double integrals
  stem: 'If $f(x, y) \ge 0$ on $R$, then $\iint_R f(x, y)\,dA$ represents'
  choices: ['the volume of the solid above $R$ and below the surface $z = f(x,y)$', 'the area of $R$', 'the area of the surface $z = f(x, y)$', 'the average height of the surface']
  answer: 0
  explanation: |-
    Each term $f\,\Delta A$ of a Riemann sum is the volume of a thin column; their limit is the volume under the surface.
- id: mv-q-2010
  lesson: mv-double-rect
  topic: Double integrals
  stem: 'Evaluate $\iint_R \sin x\sin y\,dA$ over $R = [0, \pi]\times[0, \pi]$.'
  choices: ['$0$', '$4$', '$2$', '$\pi^2$']
  answer: 1
  explanation: |-
    It factors: $\left(\int_0^\pi\sin x\,dx\right)\left(\int_0^\pi\sin y\,dy\right) = 2\cdot2 = 4$.
- id: mv-q-2011
  lesson: mv-double-rect
  topic: Double integrals
  stem: 'Evaluate $\iint_R x\,dA$ over $R = [-1, 1]\times[0, 1]$.'
  choices: ['$1$', '$2$', '$0$', '$\tfrac12$']
  answer: 2
  explanation: |-
    $\int_0^1\int_{-1}^1 x\,dx\,dy = \int_0^1 0\,dy = 0$. The signed volume above the plane (where $x > 0$) cancels the part below (where $x < 0$).
- id: mv-q-2012
  lesson: mv-double-rect
  module_quiz: true
  topic: Double integrals
  stem: 'Find the volume under the plane $z = 6 - x - y$ over the rectangle $[0, 1]\times[0, 2]$.'
  choices: ['$12$', '$10$', '$8$', '$9$']
  answer: 3
  explanation: |-
    $\iint(6 - x - y)\,dA = 6\cdot2 - \iint x\,dA - \iint y\,dA = 12 - \tfrac12\cdot2 - 1\cdot2 = 12 - 1 - 2 = 9$.

- id: mv-q-2101
  lesson: mv-double-general
  module_quiz: true
  topic: General regions
  stem: 'Evaluate $\iint_D xy\,dA$, where $D$ is the region between $y = x^2$ and $y = x$.'
  choices: ['$\tfrac{1}{24}$', '$\tfrac{1}{12}$', '$-\tfrac{1}{24}$', '$\tfrac16$']
  answer: 0
  explanation: |-
    $\int_0^1\int_{x^2}^{x}xy\,dy\,dx = \int_0^1\tfrac{x^3 - x^5}{2}\,dx = \tfrac12\left(\tfrac14 - \tfrac16\right) = \tfrac{1}{24}$.
    Using $y = x^2$ as the upper limit gives the negative.
- id: mv-q-2102
  lesson: mv-double-general
  topic: General regions
  stem: 'Find the area of the region bounded by $x = y^2$ and $x = y + 2$.'
  choices: ['$\tfrac{7}{6}$', '$\tfrac92$', '$\tfrac{10}{3}$', '$\tfrac{27}{2}$']
  answer: 1
  explanation: |-
    They meet at $y = -1$ and $y = 2$. Area $= \int_{-1}^2(y + 2 - y^2)\,dy = \tfrac{10}{3} - \left(-\tfrac76\right) = \tfrac92$.
- id: mv-q-2103
  lesson: mv-double-general
  module_quiz: true
  topic: Reversing the order
  stem: 'Evaluate $\displaystyle\int_0^2\int_{x/2}^1 e^{y^2}\,dy\,dx$ by reversing the order.'
  choices: ['$\tfrac{e - 1}{2}$', '$2e$', '$e - 1$', '$e$']
  answer: 2
  explanation: |-
    The region is $0 \le y \le 1$, $0 \le x \le 2y$. Then $\int_0^1\int_0^{2y}e^{y^2}\,dx\,dy = \int_0^1 2ye^{y^2}\,dy = e - 1$.
- id: mv-q-2104
  lesson: mv-double-general
  module_quiz: true
  topic: General regions
  stem: 'Which iterated integral gives $\iint_D f\,dA$ for the triangle with vertices $(0,0)$, $(1,0)$, $(1,1)$?'
  choices: ['$\int_0^1\int_x^1 f\,dy\,dx$', '$\int_0^1\int_0^1 f\,dy\,dx$', '$\int_0^x\int_0^1 f\,dy\,dx$', '$\int_0^1\int_0^x f\,dy\,dx$']
  answer: 3
  explanation: |-
    The triangle lies below the line $y = x$ and above the $x$-axis, for $0 \le x \le 1$. A vertical line enters at $y = 0$ and leaves at $y = x$.
    $\int_x^1$ describes the triangle above $y = x$; $\int_0^x\int_0^1$ has a variable in the outer limits.
- id: mv-q-2105
  lesson: mv-double-general
  topic: Reversing the order
  stem: 'Reverse the order: $\displaystyle\int_0^1\int_y^1 f(x, y)\,dx\,dy$.'
  choices: ['$\int_0^1\int_0^x f\,dy\,dx$', '$\int_0^1\int_x^1 f\,dy\,dx$', '$\int_0^1\int_0^1 f\,dy\,dx$', '$\int_y^1\int_0^1 f\,dy\,dx$']
  answer: 0
  explanation: |-
    The region is $0 \le y \le 1$, $y \le x \le 1$: the triangle below $y = x$ with vertices $(0,0), (1,0), (1,1)$. Read vertically: $0 \le x \le 1$, $0 \le y \le x$.
- id: mv-q-2106
  lesson: mv-double-general
  topic: General regions
  stem: 'Evaluate $\displaystyle\int_0^1\int_0^x(x + y)\,dy\,dx$.'
  choices: ['$1$', '$\tfrac12$', '$\tfrac32$', '$\tfrac13$']
  answer: 1
  explanation: |-
    Inner: $\left[xy + \tfrac{y^2}{2}\right]_0^x = x^2 + \tfrac{x^2}{2} = \tfrac32x^2$. Outer: $\int_0^1\tfrac32x^2\,dx = \tfrac12$.
- id: mv-q-2107
  lesson: mv-double-general
  topic: General regions
  stem: 'A student sets up $\displaystyle\int_{x^2}^{x}\int_0^1 f\,dx\,dy$. What is wrong?'
  choices: ['The integrand must be 1', 'The order $dx\,dy$ is never allowed', 'The outer limits depend on $x$; outer limits must be constants', 'Nothing is wrong']
  answer: 2
  explanation: |-
    After both integrations the answer would still contain $x$. Outer limits must be constants, and inner limits may depend only on the outer variable. The correct setup is $\int_0^1\int_{x^2}^{x}f\,dy\,dx$.
- id: mv-q-2108
  lesson: mv-double-general
  module_quiz: true
  topic: General regions
  stem: 'Find the area between $y = x^2$ and $y = 4$.'
  choices: ['$\tfrac{16}{3}$', '$16$', '$8$', '$\tfrac{32}{3}$']
  answer: 3
  explanation: |-
    They meet at $x = \pm2$: $\int_{-2}^{2}(4 - x^2)\,dx = 16 - \tfrac{16}{3} = \tfrac{32}{3}$. $\tfrac{16}{3}$ covers only half ($0 \le x \le 2$).
- id: mv-q-2109
  lesson: mv-double-general
  topic: Reversing the order
  stem: 'Evaluate $\displaystyle\int_0^1\int_{\sqrt x}^1\sqrt{y^3 + 1}\,dy\,dx$ by reversing the order.'
  choices: ['$\tfrac29\left(2\sqrt2 - 1\right)$', '$\tfrac23\left(2\sqrt2 - 1\right)$', '$\tfrac29\cdot2\sqrt2$', '$2\sqrt2 - 1$']
  answer: 0
  explanation: |-
    The region $0 \le x \le 1$, $\sqrt x \le y \le 1$ is also $0 \le y \le 1$, $0 \le x \le y^2$. Then $\int_0^1 y^2\sqrt{y^3 + 1}\,dy = \tfrac29(y^3 + 1)^{3/2}\Big|_0^1 = \tfrac29(2\sqrt2 - 1) \approx 0.406$.
- id: mv-q-2110
  lesson: mv-double-general
  topic: General regions
  stem: 'If $1 \le f(x, y) \le 3$ on a region $D$ of area 2, what can you say about $\iint_D f\,dA$?'
  choices: ['It equals 4', 'It is between 2 and 6', 'It is between 1 and 3', 'It is at least 6']
  answer: 1
  explanation: |-
    $m\,A(D) \le \iint_D f\,dA \le M\,A(D)$ gives $2 \le \iint_D f\,dA \le 6$.
- id: mv-q-2111
  lesson: mv-double-general
  topic: General regions
  stem: 'For the region between $x = y^2$ and $x = y + 2$, why is the $dx\,dy$ order preferable?'
  choices: ['Because $x$ appears in the integrand', 'Because the $dy\,dx$ order is not allowed for this region', 'Because with vertical slices the lower boundary changes at $x = 1$, requiring two integrals', 'Because the region is symmetric']
  answer: 2
  explanation: |-
    Horizontal lines always enter at the parabola and leave at the line, so one integral suffices. Vertical lines meet the lower half of the parabola for $0 \le x \le 1$ but the line $y = x - 2$ for $1 \le x \le 4$.

- id: mv-q-2201
  lesson: mv-double-polar
  module_quiz: true
  topic: Polar double integrals
  stem: 'In polar coordinates, the area element $dA$ is'
  choices: ['$dr\,d\theta$', '$r^2\,dr\,d\theta$', '$\tfrac12r^2\,d\theta$ only', '$r\,dr\,d\theta$']
  answer: 3
  explanation: |-
    A small polar rectangle has sides $\Delta r$ and $r\,\Delta\theta$ (an arc), so its area is about $r\,\Delta r\,\Delta\theta$.
- id: mv-q-2202
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Evaluate $\iint_D (x^2 + y^2)\,dA$ over the disk $x^2 + y^2 \le 4$.'
  choices: ['$8\pi$', '$4\pi$', '$16\pi$', '$\tfrac{16\pi}{3}$']
  answer: 0
  explanation: |-
    $\int_0^{2\pi}\int_0^2 r^2\cdot r\,dr\,d\theta = 2\pi\cdot\tfrac{16}{4} = 8\pi$. Forgetting the factor $r$ gives $\tfrac{16\pi}{3}$.
- id: mv-q-2203
  lesson: mv-double-polar
  module_quiz: true
  topic: Polar double integrals
  stem: 'Find the volume under $z = 4 - x^2 - y^2$ and above the $xy$-plane.'
  choices: ['$4\pi$', '$8\pi$', '$16\pi$', '$\tfrac{32\pi}{3}$']
  answer: 1
  explanation: |-
    The base is the disk $r \le 2$. $V = \int_0^{2\pi}\int_0^2(4 - r^2)r\,dr\,d\theta = 2\pi\left[2r^2 - \tfrac{r^4}{4}\right]_0^2 = 2\pi\cdot4 = 8\pi$.
- id: mv-q-2204
  lesson: mv-double-polar
  module_quiz: true
  topic: Polar double integrals
  stem: 'Evaluate $\iint_D y\,dA$ over the part of the ring $1 \le x^2 + y^2 \le 4$ in the first quadrant.'
  choices: ['$\tfrac32$', '$\tfrac{7\pi}{6}$', '$\tfrac73$', '$\tfrac83$']
  answer: 2
  explanation: |-
    $\int_0^{\pi/2}\int_1^2 r\sin\theta\cdot r\,dr\,d\theta = \left(\int_0^{\pi/2}\sin\theta\,d\theta\right)\left(\int_1^2r^2\,dr\right) = 1\cdot\tfrac73$.
- id: mv-q-2205
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Find the area of one petal of $r = \cos2\theta$.'
  choices: ['$\tfrac{\pi}{2}$', '$\tfrac{\pi}{4}$', '$\tfrac{\pi}{16}$', '$\tfrac{\pi}{8}$']
  answer: 3
  explanation: |-
    One petal: $-\tfrac\pi4 \le \theta \le \tfrac\pi4$. Area $= \int_{-\pi/4}^{\pi/4}\int_0^{\cos2\theta}r\,dr\,d\theta = \tfrac12\int_{-\pi/4}^{\pi/4}\cos^22\theta\,d\theta = \tfrac12\cdot\tfrac\pi4 = \tfrac\pi8$.
- id: mv-q-2206
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Using a polar double integral, one finds that $\displaystyle\int_{-\infty}^{\infty}e^{-x^2}\,dx$ equals'
  choices: ['$\sqrt\pi$', '$\pi$', '$\tfrac{\sqrt\pi}{2}$', '$1$']
  answer: 0
  explanation: |-
    Its square is $\iint e^{-(x^2+y^2)}\,dA = \int_0^{2\pi}\int_0^\infty e^{-r^2}r\,dr\,d\theta = 2\pi\cdot\tfrac12 = \pi$, so the integral is $\sqrt\pi$.
- id: mv-q-2207
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Describe the half-disk $x^2 + y^2 \le 9$, $y \ge 0$ in polar coordinates.'
  choices: ['$0 \le r \le 9$, $0 \le \theta \le \pi$', '$0 \le r \le 3$, $0 \le \theta \le \pi$', '$0 \le r \le 3$, $0 \le \theta \le 2\pi$', '$0 \le r \le 3$, $-\tfrac\pi2 \le \theta \le \tfrac\pi2$']
  answer: 1
  explanation: |-
    Radius 3 (not 9: $r^2 = 9$), and $y \ge 0$ is the upper half, $0 \le \theta \le \pi$. $-\tfrac\pi2 \le \theta \le \tfrac\pi2$ gives the right half ($x \ge 0$).
- id: mv-q-2208
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Evaluate $\iint_D e^{x^2 + y^2}\,dA$ over the unit disk.'
  choices: ['$2\pi(e - 1)$', '$\pi e$', '$\pi(e - 1)$', '$e - 1$']
  answer: 2
  explanation: |-
    $\int_0^{2\pi}\int_0^1 e^{r^2}r\,dr\,d\theta = 2\pi\cdot\tfrac12(e - 1) = \pi(e - 1)$.
- id: mv-q-2209
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'A student computes the area of the unit disk as $\int_0^{2\pi}\int_0^1 dr\,d\theta$. What do they get, and why is it wrong?'
  choices: ['$\pi$; it is correct', '$\pi^2$; wrong limits', '$4\pi$; wrong integrand', '$2\pi$; the factor $r$ is missing']
  answer: 3
  explanation: |-
    Without $r$ the result is $2\pi$. The correct $\int_0^{2\pi}\int_0^1 r\,dr\,d\theta = 2\pi\cdot\tfrac12 = \pi$.
- id: mv-q-2210
  lesson: mv-double-polar
  module_quiz: true
  topic: Polar double integrals
  stem: 'Convert and evaluate $\displaystyle\int_{-1}^{1}\int_0^{\sqrt{1-x^2}}(x^2 + y^2)^{3/2}\,dy\,dx$.'
  choices: ['$\tfrac{\pi}{5}$', '$\tfrac{2\pi}{5}$', '$\tfrac{\pi}{4}$', '$\tfrac{\pi}{10}$']
  answer: 0
  explanation: |-
    The region is the upper half of the unit disk. $(x^2+y^2)^{3/2} = r^3$, so the integral is $\int_0^\pi\int_0^1 r^3\cdot r\,dr\,d\theta = \pi\cdot\tfrac15$.
    $\tfrac{\pi}{4}$ forgets the extra $r$.
- id: mv-q-2211
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Why are polar coordinates helpful for $\iint_D \sin(x^2 + y^2)\,dA$ over a disk centered at the origin?'
  choices: ['Because $\sin$ is periodic', 'Because the disk becomes a rectangle in $(r, \theta)$ and $x^2 + y^2 = r^2$, with the factor $r$ enabling substitution', 'Because the integrand becomes constant', 'Because polar integrals never need the factor $r$']
  answer: 1
  explanation: |-
    $\int_0^{2\pi}\int_0^a\sin(r^2)\,r\,dr\,d\theta = 2\pi\cdot\tfrac12(1 - \cos a^2)$: the $r$ from $dA$ is exactly the derivative needed for $u = r^2$.

- id: mv-q-2301
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A lamina occupies $D$ with density $\rho(x, y)$. Its mass is'
  choices: ['$\iint_D\rho\,dA$', '$\iint_D x\rho\,dA$', '$\rho\cdot A(D)$ always', '$\iint_D(x^2+y^2)\rho\,dA$']
  answer: 0
  explanation: |-
    Each patch has mass $\rho\,dA$; add them. $\rho\cdot A(D)$ holds only for constant density; the other two are a moment and a moment of inertia.
- id: mv-q-2302
  lesson: mv-double-apps
  module_quiz: true
  topic: Mass and center of mass
  stem: 'A square plate $[0, 1]\times[0, 1]$ has density $\rho = x + y$. Find its center of mass.'
  choices: ['$\left(\tfrac12, \tfrac12\right)$', '$\left(\tfrac{7}{12}, \tfrac{7}{12}\right)$', '$\left(\tfrac{5}{12}, \tfrac{5}{12}\right)$', '$\left(\tfrac{7}{6}, \tfrac{7}{6}\right)$']
  answer: 1
  explanation: |-
    $m = 1$, $M_y = \iint x(x + y)\,dA = \tfrac13 + \tfrac14 = \tfrac{7}{12}$, and by symmetry $M_x = \tfrac{7}{12}$. So $(\bar x, \bar y) = \left(\tfrac{7}{12}, \tfrac{7}{12}\right)$, shifted toward the denser corner.
- id: mv-q-2303
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'The moment about the $y$-axis is'
  choices: ['$M_y = \iint_D y\rho\,dA$', '$M_y = \iint_D y^2\rho\,dA$', '$M_y = \iint_D x\rho\,dA$', '$M_y = \iint_D\rho\,dA$']
  answer: 2
  explanation: |-
    The distance from the $y$-axis is $x$, so $M_y$ weights by $x$. It gives $\bar x = M_y/m$.
- id: mv-q-2304
  lesson: mv-double-apps
  module_quiz: true
  topic: Mass and center of mass
  stem: 'Where is the centroid of the upper half of the disk of radius $a$?'
  choices: ['$\left(0, \tfrac a2\right)$', '$\left(0, \tfrac{a}{\pi}\right)$', '$\left(0, \tfrac{2a}{3}\right)$', '$\left(0, \tfrac{4a}{3\pi}\right)$']
  answer: 3
  explanation: |-
    $\iint y\,dA = \tfrac{2a^3}{3}$ (polar) and the area is $\tfrac{\pi a^2}{2}$, so $\bar y = \tfrac{4a}{3\pi} \approx 0.424a$. By symmetry $\bar x = 0$.
- id: mv-q-2305
  lesson: mv-double-apps
  topic: Surface area
  stem: 'The area of the surface $z = f(x, y)$ over a region $D$ is'
  choices: ['$\iint_D\sqrt{1 + f_x^2 + f_y^2}\,dA$', '$\iint_D f(x, y)\,dA$', '$\iint_D\sqrt{f_x^2 + f_y^2}\,dA$', '$\iint_D(1 + f_x + f_y)\,dA$']
  answer: 0
  explanation: |-
    Over a small patch the surface is nearly a parallelogram of area $|\langle -f_x, -f_y, 1\rangle|\,dA$. Dropping the 1 gives zero area for a horizontal plane, which is wrong.
- id: mv-q-2306
  lesson: mv-double-apps
  module_quiz: true
  topic: Surface area
  stem: 'Find the area of the part of the plane $z = 2 + 3x + 4y$ above $[0, 5]\times[1, 4]$.'
  choices: ['$15\cdot 5$', '$15\sqrt{26}$', '$15\sqrt{8}$', '$\sqrt{26}$']
  answer: 1
  explanation: |-
    The stretch factor $\sqrt{1 + 3^2 + 4^2} = \sqrt{26}$ is constant; the shadow has area $5\cdot3 = 15$.
    $15\cdot5$ uses $\sqrt{9+16}$ and forgets the 1.
- id: mv-q-2307
  lesson: mv-double-apps
  topic: Surface area
  stem: 'Find the area of the part of $z = x^2 + y^2$ below $z = 4$.'
  choices: ['$8\pi$', '$\tfrac{\pi}{6}\cdot17\sqrt{17}$', '$\tfrac{\pi}{6}\left(17\sqrt{17} - 1\right)$', '$\tfrac{\pi}{12}\left(17\sqrt{17} - 1\right)$']
  answer: 2
  explanation: |-
    $\int_0^{2\pi}\int_0^2\sqrt{1 + 4r^2}\,r\,dr\,d\theta = 2\pi\cdot\tfrac{1}{12}\left(17^{3/2} - 1\right) = \tfrac{\pi}{6}\left(17\sqrt{17} - 1\right) \approx 36.2$.
- id: mv-q-2308
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A lamina of constant density is symmetric about the $y$-axis. What can you conclude?'
  choices: ['$\bar y = 0$', '$\bar x = \bar y$', 'The center of mass is the origin', '$\bar x = 0$']
  answer: 3
  explanation: |-
    Contributions $x\rho\,dA$ from mirror-image points cancel, so $M_y = 0$ and $\bar x = 0$. Nothing forces $\bar y = 0$.
- id: mv-q-2309
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A uniform disk of radius $a$ and mass $m$ spins about its center. Its moment of inertia $I_0$ is'
  choices: ['$\tfrac12ma^2$', '$ma^2$', '$\tfrac13ma^2$', '$\tfrac{2}{5}ma^2$']
  answer: 0
  explanation: |-
    $I_0 = \rho\int_0^{2\pi}\int_0^a r^2\cdot r\,dr\,d\theta = \tfrac12\pi\rho a^4$, and $m = \pi\rho a^2$, so $I_0 = \tfrac12ma^2$. ($\tfrac25ma^2$ is a solid ball.)
- id: mv-q-2310
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A disk of radius 2 has density equal to the distance from its center, $\rho = \sqrt{x^2 + y^2}$. Find its mass.'
  choices: ['$4\pi$', '$\tfrac{16\pi}{3}$', '$8\pi$', '$\tfrac{8\pi}{3}$']
  answer: 1
  explanation: |-
    $m = \int_0^{2\pi}\int_0^2 r\cdot r\,dr\,d\theta = 2\pi\cdot\tfrac83 = \tfrac{16\pi}{3}$.
- id: mv-q-2311
  lesson: mv-double-apps
  module_quiz: true
  topic: Mass and center of mass
  stem: 'Find the centroid of the triangle with vertices $(0, 0)$, $(3, 0)$, $(0, 3)$.'
  choices: ['$\left(\tfrac32, \tfrac32\right)$', '$(1, 2)$', '$(1, 1)$', '$(2, 2)$']
  answer: 2
  explanation: |-
    Area $\tfrac92$; $\iint x\,dA = \int_0^3 x(3 - x)\,dx = \tfrac{27}{2} - 9 = \tfrac92$, so $\bar x = 1$, and by symmetry $\bar y = 1$. (The centroid of a triangle is the average of its vertices.)
- id: mv-q-2312
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A plate $[0, 2]\times[0, 1]$ has density $\rho = y$. Find $\bar y$.'
  choices: ['$\tfrac12$', '$\tfrac13$', '$1$', '$\tfrac23$']
  answer: 3
  explanation: |-
    $m = \iint y\,dA = 2\cdot\tfrac12 = 1$, and $M_x = \iint y\cdot y\,dA = 2\cdot\tfrac13 = \tfrac23$. So $\bar y = \tfrac23$: the mass is concentrated toward the top edge.
