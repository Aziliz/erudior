# Round 2, honors module mv-h1 (Vector calculus in physics and geometry): lessons 90-93.
# --- Lesson 90: gravity from Gauss's law ---
- id: mv-h1-r2-h01
  lesson: mv-h1-gravity
  module_quiz: true
  topic: Gravitational fields
  stem: 'A closed surface $S$ encloses point masses of 3 kg and 5 kg; a 2 kg mass sits outside $S$. What is the flux $\iint_S\mathbf g\cdot d\mathbf S$ of the gravitational field?'
  choices: ['$-32\pi G$', '$-40\pi G$', '$32\pi G$', '$-8G$']
  answer: 0
  explanation: |-
    Gauss's law for gravity: flux $= -4\pi G M_{\text{enc}} = -4\pi G(3 + 5) = -32\pi G$. The 2 kg mass outside contributes zero net flux (its field enters and leaves $S$). The flux is negative because gravity points into the surface; $-8G$ forgets the factor $4\pi$.
- id: mv-h1-r2-h02
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'A uniform cube has mass $M$. What does Gauss''s law tell you about its gravitational field?'
  choices: ['The field outside is exactly $GM/r^2$ toward the center', 'The flux through any closed surface around the cube is $-4\pi GM$, but this alone does not give the field at each point', 'Nothing, since Gauss''s law only applies to spheres', 'The field is zero inside the cube']
  answer: 1
  explanation: |-
    Gauss's law holds for every closed surface, so the flux is $-4\pi GM$ through any surface enclosing the cube. But a cube has no spherical symmetry, so $\mathbf g\cdot\mathbf n$ is not constant on any simple surface and the single number can't be turned into the field. The point-mass formula outside is exact only for spherically symmetric bodies, and the field inside a solid cube is not zero.
- id: mv-h1-r2-h03
  lesson: mv-h1-gravity
  module_quiz: true
  topic: Gravitational fields
  stem: 'A planet is a uniform ball with surface gravity $g_0$. What is the field strength halfway from the surface to the center?'
  choices: ['$g_0/4$', '$4g_0$', '$g_0/2$', '$g_0$']
  answer: 2
  explanation: |-
    Inside a uniform ball $M_{\text{enc}} = Mr^3/R^3$, so $|\mathbf g| = GM_{\text{enc}}/r^2 = GMr/R^3 = g_0\,r/R$. At $r = R/2$ that is $g_0/2$. The answer $4g_0$ comes from using $1/r^2$ with the whole mass, which is right only outside; $g_0/4$ comes from $(r/R)^2$.
- id: mv-h1-r2-h04
  lesson: mv-h1-gravity
  module_quiz: true
  type: text
  topic: Gravitational fields
  stem: 'A uniform planet has radius 6000 km and surface gravity 9 m/s². At a distance of 2000 km from its center the field strength is ___ m/s². Give only the number.'
  accept: ['3']
  explanation: |-
    Inside a uniform ball the field grows linearly with $r$: $|\mathbf g| = g_0\,r/R = 9\cdot\dfrac{2000}{6000} = 3$ m/s².
- id: mv-h1-r2-h05
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'A small probe floats inside a hollow, uniform spherical shell of mass, off-center and close to one wall. What net gravitational force does the shell exert on it?'
  choices: ['A pull toward the nearer wall', 'A pull toward the center of the shell', 'A pull toward the farther wall', 'None: the field inside the shell is zero']
  answer: 3
  explanation: |-
    A Gaussian sphere through the probe, inside the shell, encloses no mass, and by symmetry $\mathbf g$ is radial with constant size on it, so $g(r)\cdot4\pi r^2 = 0$ and $\mathbf g = \mathbf 0$ everywhere in the cavity. The nearer part of the wall pulls harder per kilogram, but the farther part has proportionally more mass; Example 3's constant potential $-GM/R$ confirms the exact cancellation.
- id: mv-h1-r2-h06
  lesson: mv-h1-gravity
  module_quiz: true
  topic: Gravitational fields
  stem: 'Which statements are true for a planet whose density depends only on the distance from its center? Select all that apply.'
  choices: ['Outside the planet its field is the same as that of a point mass at the center', 'The field at radius $r$ depends only on the mass closer to the center than $r$', 'The field strength is largest at the center', 'Gauss''s law for gravity holds only for spherical surfaces', 'The field points toward the center']
  answer: [0, 1, 4]
  explanation: |-
    Symmetry makes $\mathbf g = g(r)\hat{\mathbf r}$, and Gauss's law on the sphere of radius $r$ gives $g(r) = -GM_{\text{enc}}(r)/r^2$: only the inner mass counts, outside it is the point-mass field, and the minus sign means it points to the center. At the center $M_{\text{enc}} = 0$, so the field there is zero, not largest. Gauss's law holds for every closed surface; spheres are just where it is easy to use.
- id: mv-h1-r2-h07
  lesson: mv-h1-gravity
  module_quiz: true
  type: label
  topic: Gravitational fields
  stem: 'The picture shows the shell theorem argument. Name the numbered parts.'
  image: {src: images/mv-h1-gauss-shell-blank.svg, alt: 'A thick circle with a dashed circle outside it and a smaller dashed circle inside it. Arrows outside point inward toward the center, where there is a dot. Five parts are numbered.'}
  labels:
    - {x: 29, y: 58.2, text: Shell of mass}
    - {x: 50, y: 9.6, text: Gaussian sphere enclosing the shell}
    - {x: 61, y: 50, text: Gaussian sphere inside the cavity}
    - {x: 83.7, y: 85.8, text: Field vector g}
    - {x: 50, y: 50, text: Center of the shell}
  distractors: [Outward normal n, Point where g is strongest]
  explanation: |-
    The thick circle is the shell of mass. The large dashed sphere encloses all of it, so the flux through it is $-4\pi GM$ and the field outside points inward (the arrows) with strength $GM/r^2$, as if all the mass sat at the center. The small dashed sphere lies in the cavity and encloses no mass, so the field there is zero. The arrows point inward, so they are field vectors, not outward normals.
- id: mv-h1-r2-h08
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'Model the Moon as a uniform ball with $R = 1737$ km and $g_0 = 1.62$ m/s². About how long would a stone take to fall through a frictionless tunnel from one side to the other?'
  choices: ['About 108 minutes', 'About 54 minutes', 'About 42 minutes', 'About 27 minutes']
  answer: 1
  explanation: |-
    The motion is simple harmonic with period $T = 2\pi\sqrt{R/g_0} = 2\pi\sqrt{1.737\times10^6/1.62} \approx 6506$ s $\approx 108$ min. The trip to the far side is half a period, about 54 minutes. 108 is the full round trip, 27 is a quarter period (surface to center), and 42 is the figure for Earth.
- id: mv-h1-r2-h09
  lesson: mv-h1-gravity
  type: order
  topic: Gravitational fields
  stem: 'Put the steps of the derivation of Poisson''s equation in order.'
  items:
    - 'Flux of a point mass''s field through any closed surface around it is $-4\pi GM$'
    - 'Add up masses: $\iint_S\mathbf g\cdot d\mathbf S = -4\pi G M_{\text{enc}}$'
    - 'Apply the Divergence theorem for every region: $\nabla\cdot\mathbf g = -4\pi G\rho$'
    - 'Substitute $\mathbf g = -\nabla\Phi$: $\nabla^2\Phi = 4\pi G\rho$'
  explanation: |-
    Each step uses the one before: the point-mass flux gives Gauss's law for many masses; Gauss's law for every region plus the Divergence theorem gives the pointwise divergence law; and writing $\mathbf g$ as $-\nabla\Phi$ turns $\nabla\cdot\mathbf g$ into $-\nabla^2\Phi$.
- id: mv-h1-r2-h10
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'Inside a body the gravitational potential is $\Phi = k(x^2 + y^2 + z^2) + C$ with $k > 0$. What is the density?'
  choices: ['$\dfrac{k}{4\pi G}$', '$\dfrac{2k}{4\pi G}$', '$-\dfrac{3k}{2\pi G}$', '$\dfrac{3k}{2\pi G}$']
  answer: 3
  explanation: |-
    $\nabla^2\Phi = 2k + 2k + 2k = 6k$, and Poisson's equation gives $\rho = \dfrac{6k}{4\pi G} = \dfrac{3k}{2\pi G}$, which is constant: a uniform body. Using only one second partial gives $2k/(4\pi G)$; the negative answer uses the sign of $\nabla\cdot\mathbf g = -4\pi G\rho$ by mistake.
- id: mv-h1-r2-h11
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'With $\mathbf g = -\nabla\Phi$, which pair of equations is correct?'
  choices: ['$\nabla\cdot\mathbf g = -4\pi G\rho$ and $\nabla^2\Phi = 4\pi G\rho$', '$\nabla\cdot\mathbf g = 4\pi G\rho$ and $\nabla^2\Phi = 4\pi G\rho$', '$\nabla\cdot\mathbf g = -4\pi G\rho$ and $\nabla^2\Phi = -4\pi G\rho$', '$\nabla\times\mathbf g = -4\pi G\rho$ and $\nabla^2\Phi = 4\pi G\rho$']
  answer: 0
  explanation: |-
    Mass is a sink of $\mathbf g$, so $\nabla\cdot\mathbf g = -4\pi G\rho$. Since $\nabla\cdot\mathbf g = \nabla\cdot(-\nabla\Phi) = -\nabla^2\Phi$, the signs flip: $\nabla^2\Phi = 4\pi G\rho$. The curl of a gradient field is zero, so a curl law makes no sense here.
- id: mv-h1-r2-h12
  lesson: mv-h1-gravity
  module_quiz: true
  type: match
  topic: Gravitational fields
  stem: 'Match each situation with its gravitational field strength ($r$ is the distance from the center, $R$ the body''s radius).'
  pairs:
    - ['Outside a spherical body of mass $M$', 'GM/r²']
    - ['Inside a uniform ball of mass $M$', 'GMr/R³']
    - ['Inside a hollow uniform shell', 'Zero']
    - ['Near an infinite sheet with mass $\sigma$ per unit area', '2πGσ at every distance']
  distractors: ['GM/R³']
  explanation: |-
    Outside, the body acts like a point mass. Inside a uniform ball only $Mr^3/R^3$ is enclosed, giving $GMr/R^3$. A hollow shell encloses nothing inside it. The pillbox argument for the sheet gives $2|\mathbf g|A = 4\pi G\sigma A$, so $|\mathbf g| = 2\pi G\sigma$, independent of distance.
- id: mv-h1-r2-h13
  lesson: mv-h1-gravity
  topic: Gravitational fields
  stem: 'For a thin uniform shell of mass $M$ and radius $R$, Example 3 found the potential inside to be $\Phi = -GM/R$. Why does that prove the field inside is zero?'
  choices: ['Because $\Phi$ is negative', 'Because $\Phi$ is the same at every point inside, so $\mathbf g = -\nabla\Phi = \mathbf 0$', 'Because $\Phi$ matches the outside formula at $r = R$', 'Because $-GM/R$ is smaller in size than $-GM/r$ for $r < R$']
  answer: 1
  explanation: |-
    The field is minus the gradient of the potential, and the gradient of a constant is zero. The sign of $\Phi$ and its continuity across the shell say nothing about the field inside.
- id: mv-h1-r2-h14
  lesson: mv-h1-gravity
  type: text
  topic: Gravitational fields
  stem: 'Above a wide flat layer of rock (modeled as an infinite sheet), you measure its gravitational pull at 10 m and again at 20 m above it. The pull at 20 m is ___ times the pull at 10 m. Give only the number.'
  accept: ['1', one]
  explanation: |-
    For an infinite sheet the pillbox argument gives $|\mathbf g| = 2\pi G\sigma$, with no dependence on the distance, so the ratio is 1. (A real layer is finite, so this holds only at heights small compared with its width.)
# --- Lesson 91: light from Maxwell's equations ---
- id: mv-h1-r2-h15
  lesson: mv-h1-em-waves
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'Why is Ampère''s law $\nabla\times\mathbf B = \mu_0\mathbf J$ inconsistent with conservation of charge when charge densities change?'
  choices: ['Because the curl of $\mathbf J$ is not zero', 'Because $\mathbf B$ is not conservative', 'Taking the divergence gives $\nabla\cdot\mathbf J = 0$, but continuity requires $\nabla\cdot\mathbf J = -\partial\rho/\partial t$', 'Because $\mu_0$ is not exactly $4\pi\times10^{-7}$']
  answer: 2
  explanation: |-
    $\operatorname{div}(\operatorname{curl}\mathbf B) = 0$ always, so Ampère's law forces $\nabla\cdot\mathbf J = 0$. The continuity equation says $\nabla\cdot\mathbf J = -\partial\rho/\partial t$, which is not zero while charge accumulates (a charging capacitor). Maxwell's term $\mu_0\varepsilon_0\,\partial\mathbf E/\partial t$ fixes this. The value of $\mu_0$ has nothing to do with it.
- id: mv-h1-r2-h16
  lesson: mv-h1-em-waves
  module_quiz: true
  type: text
  topic: Electromagnetic waves
  stem: 'A plane wave in vacuum has electric amplitude $E_0 = 600$ V/m. Using $c = 3.00\times10^8$ m/s, its magnetic amplitude is $B_0 =$ ___ μT (microtesla). Give only the number.'
  accept: ['2']
  explanation: |-
    Faraday's law for a plane wave forces $kE_0 = \omega B_0$, so $B_0 = E_0/c = 600/(3.00\times10^8) = 2.00\times10^{-6}$ T $= 2$ μT.
- id: mv-h1-r2-h17
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'Let $\mathbf F = \langle yz^2,\ x^2,\ 0\rangle$, which has $\nabla\cdot\mathbf F = 0$. What is $\nabla\times(\nabla\times\mathbf F)$?'
  choices: ['$\langle 2y, 2, 0\rangle$', '$\langle 0, 0, 0\rangle$', '$\langle 2y, 2, 2\rangle$', '$\langle -2y, -2, 0\rangle$']
  answer: 3
  explanation: |-
    With zero divergence the identity reduces to $\nabla\times(\nabla\times\mathbf F) = -\nabla^2\mathbf F$. Componentwise, $\nabla^2(yz^2) = 2y$, $\nabla^2(x^2) = 2$, $\nabla^2 0 = 0$, so the answer is $\langle -2y, -2, 0\rangle$. (Computing the curl twice directly gives the same.) $\langle 2y, 2, 0\rangle$ drops the minus sign.
- id: mv-h1-r2-h18
  lesson: mv-h1-em-waves
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'Which are true of a plane electromagnetic wave in vacuum? Select all that apply.'
  choices: ['$\mathbf E$ is perpendicular to the direction of travel', '$\mathbf B$ is perpendicular to $\mathbf E$', '$|\mathbf B| = |\mathbf E|/c$', '$\mathbf E$ has a component along the direction of travel', '$\mathbf E$ and $\mathbf B$ are a quarter cycle out of phase']
  answer: [0, 1, 2]
  explanation: |-
    $\nabla\cdot\mathbf E = 0$ forces $\mathbf k\cdot\mathbf E_0 = 0$, so the wave is transverse; Faraday's law gives $\mathbf B = \frac1\omega\mathbf k\times\mathbf E$, perpendicular to both, with $B_0 = E_0/c$; and both are proportional to the same $\cos(\mathbf k\cdot\mathbf x - \omega t)$, so they are in phase.
- id: mv-h1-r2-h19
  lesson: mv-h1-em-waves
  module_quiz: true
  type: label
  topic: Electromagnetic waves
  stem: 'Name the numbered parts of this picture of a plane electromagnetic wave.'
  image: {src: images/mv-h1-plane-wave-blank.svg, alt: 'Two sine waves along a horizontal axis: one oscillates vertically, the other oscillates in a slanted plane at right angles to it, crest for crest. A double arrow spans two neighboring crests of the vertical wave. Four parts are numbered.'}
  labels:
    - {x: 51.6, y: 27.4, text: Electric field E}
    - {x: 44.1, y: 58.8, text: Magnetic field B}
    - {x: 91.9, y: 47.6, text: Direction of travel}
    - {x: 67.7, y: 22.1, text: Wavelength}
  distractors: [Period, Direction of the electric field]
  explanation: |-
    In this picture $\mathbf E$ oscillates in the vertical plane and $\mathbf B$ in the perpendicular plane, both across the axis along which the wave moves (the direction of $\mathbf E\times\mathbf B$). The distance between neighboring crests is the wavelength $\lambda = 2\pi/k$. The period is a time, so it can't be shown as a distance along the axis.
- id: mv-h1-r2-h20
  lesson: mv-h1-em-waves
  type: order
  topic: Electromagnetic waves
  stem: 'Put the steps of the derivation of the wave equation for $\mathbf E$ in empty space in order.'
  items:
    - 'Start from Faraday''s law $\nabla\times\mathbf E = -\partial\mathbf B/\partial t$'
    - 'Take the curl of both sides'
    - 'Use the curl-of-curl identity with $\nabla\cdot\mathbf E = 0$ on the left and the Ampère–Maxwell law on the right'
    - 'Read off $\nabla^2\mathbf E = \mu_0\varepsilon_0\,\partial^2\mathbf E/\partial t^2$ and the speed $c = 1/\sqrt{\mu_0\varepsilon_0}$'
  explanation: |-
    Curling Faraday's law produces $\nabla\times(\nabla\times\mathbf E)$ on the left and $-\partial_t(\nabla\times\mathbf B)$ on the right. Simplifying both sides gives $-\nabla^2\mathbf E = -\mu_0\varepsilon_0\mathbf E_{tt}$, the wave equation, whose speed is $1/\sqrt{\mu_0\varepsilon_0}$.
- id: mv-h1-r2-h21
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'For $\mathbf E = E_0\cos(kz - \omega t)\,\mathbf i$ and $\mathbf B = B_0\cos(kz - \omega t)\,\mathbf j$, which condition does Faraday''s law $\nabla\times\mathbf E = -\partial\mathbf B/\partial t$ impose?'
  choices: ['$kE_0 = \omega B_0$', '$\omega E_0 = kB_0$', '$E_0 = B_0$', '$k = \omega$']
  answer: 0
  explanation: |-
    $\nabla\times\mathbf E = \langle 0, -kE_0\sin(kz - \omega t), 0\rangle$ and $-\partial\mathbf B/\partial t = \langle 0, -\omega B_0\sin(kz - \omega t), 0\rangle$, so $kE_0 = \omega B_0$. With $\omega = ck$ this is $B_0 = E_0/c$. The condition $\omega E_0 = kB_0$ swaps the roles.
- id: mv-h1-r2-h22
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'A plane wave travels in the $+x$ direction with $\mathbf E = E_0\cos(kx - \omega t)\,\mathbf j$. Along which direction does $\mathbf B$ point (when the cosine is positive)?'
  choices: ['$+\mathbf j$', '$-\mathbf k$', '$+\mathbf k$', '$+\mathbf i$']
  answer: 2
  explanation: |-
    $\mathbf B = \frac{1}{\omega}\mathbf k_{\text{wave}}\times\mathbf E$ with wave vector $k\,\mathbf i$: $\mathbf i\times\mathbf j = \mathbf k$, so $\mathbf B$ is along $+\mathbf k$. Check: $\mathbf E\times\mathbf B$ is along $\mathbf j\times\mathbf k = \mathbf i$, the direction of travel. $\mathbf B$ can't be along $\mathbf j$ (parallel to $\mathbf E$) or $\mathbf i$ (along the travel direction).
- id: mv-h1-r2-h23
  lesson: mv-h1-em-waves
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'A plane wave has $E_0 = 1000$ V/m. With $c = 2.998\times10^8$ m/s and $\varepsilon_0 = 8.854\times10^{-12}$ F/m, what is its intensity (average power per area)?'
  choices: ['$2.65\times10^3$ W/m²', '$1.33\times10^3$ W/m²', '$3.34\times10^{-6}$ W/m²', '$4.43\times10^{-6}$ W/m²']
  answer: 1
  explanation: |-
    $I = \tfrac12c\varepsilon_0E_0^2 = \tfrac12(2.998\times10^8)(8.854\times10^{-12})(10^6) \approx 1327$ W/m². Leaving out the $\tfrac12$ (using the peak of $|\mathbf S|$ instead of its average) gives $2.65\times10^3$; $3.34\times10^{-6}$ is $B_0$ in tesla, not an intensity.
- id: mv-h1-r2-h24
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'In a region of empty space (no charges or currents) the net Poynting flux out of a closed surface is 5 W. By Poynting''s theorem, what happens to the field energy inside?'
  choices: ['It increases at 5 W', 'It stays constant, since there are no charges', 'It decreases at $5/\mu_0$ W', 'It decreases at 5 W']
  answer: 3
  explanation: |-
    Integrating $u_t + \nabla\cdot\mathbf S = -\mathbf J\cdot\mathbf E$ over the region and using the Divergence theorem: $\dfrac{d}{dt}\iiint u\,dV = -\iint\mathbf S\cdot d\mathbf S - \iiint\mathbf J\cdot\mathbf E\,dV = -5 - 0$. The energy decreases at 5 W, all of it flowing out through the surface. ($\mathbf S$ already includes the $1/\mu_0$.)
- id: mv-h1-r2-h25
  lesson: mv-h1-em-waves
  type: match
  topic: Electromagnetic waves
  stem: 'Match each quantity with its meaning.'
  pairs:
    - ['$u = \frac{\varepsilon_0}{2}|\mathbf E|^2 + \frac{1}{2\mu_0}|\mathbf B|^2$', 'Energy stored per unit volume']
    - ['$\mathbf S = \frac{1}{\mu_0}\mathbf E\times\mathbf B$', 'Energy flux (power per unit area)']
    - ['$\mathbf J\cdot\mathbf E$', 'Rate at which the field does work on charges, per unit volume']
    - ['$\varepsilon_0\,\partial\mathbf E/\partial t$', 'Displacement current density']
  distractors: [Charge density]
  explanation: |-
    Poynting's theorem $u_t + \nabla\cdot\mathbf S = -\mathbf J\cdot\mathbf E$ reads like a continuity equation for energy: $u$ is the density, $\mathbf S$ the flux, and $\mathbf J\cdot\mathbf E$ the energy handed to charges. Maxwell's added term $\varepsilon_0\,\partial\mathbf E/\partial t$ is the displacement current density.
- id: mv-h1-r2-h26
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'For $\mathbf E = \mathbf E_0\cos(\mathbf k\cdot\mathbf x - \omega t)$ in empty space, which Maxwell equation forces $\mathbf k\cdot\mathbf E_0 = 0$ (light is transverse)?'
  choices: ['$\nabla\cdot\mathbf E = 0$', '$\nabla\cdot\mathbf B = 0$', 'Faraday''s law', 'The Ampère–Maxwell law']
  answer: 0
  explanation: |-
    $\nabla\cdot\mathbf E = -(\mathbf k\cdot\mathbf E_0)\sin(\mathbf k\cdot\mathbf x - \omega t)$, which is zero for all $\mathbf x$ and $t$ only if $\mathbf k\cdot\mathbf E_0 = 0$. The magnetic divergence law does the same job for $\mathbf B$; Faraday's law links $\mathbf B$ to $\mathbf E$.
- id: mv-h1-r2-h27
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'Which function does NOT solve the one-dimensional wave equation $u_{zz} = u_{tt}/c^2$?'
  choices: ['$\cos(z - ct)$', '$(z + ct)^3$', '$t\sin z$', '$e^{-(z - ct)^2}$']
  answer: 2
  explanation: |-
    Any $f(z - ct)$ or $f(z + ct)$ solves it (chain rule: both sides become $f''$). For $u = t\sin z$: $u_{zz} = -t\sin z$ but $u_{tt} = 0$, so it fails. The other three are functions of $z \mp ct$.
- id: mv-h1-r2-h28
  lesson: mv-h1-em-waves
  topic: Electromagnetic waves
  stem: 'Why does the lesson''s picture of a light wave draw $\mathbf B$ "far larger than its true size"?'
  choices: ['Because $\mathbf B$ is really zero in a light wave', 'Because in SI units $B_0 = E_0/c$, so the magnetic amplitude in tesla is tiny compared with the electric amplitude in V/m', 'Because $\mathbf B$ is a quarter cycle behind $\mathbf E$', 'Because the magnetic field only exists inside matter']
  answer: 1
  explanation: |-
    For sunlight, $E_0 \approx 1.01\times10^3$ V/m but $B_0 = E_0/c \approx 3.4\times10^{-6}$ T. The magnetic field is real, in phase with $\mathbf E$, and present in vacuum; it carries as much energy as the electric field ($\varepsilon_0E^2/2 = B^2/(2\mu_0)$), but its number in tesla is small.
# --- Lesson 92: harmonic functions ---
- id: mv-h1-r2-h29
  lesson: mv-h1-harmonic
  module_quiz: true
  topic: Harmonic functions
  stem: 'What is the average value of $u = x^2 - y^2 + 2xy$ over the circle of radius 5 centered at $(2, -1)$?'
  choices: ['$-1$', '$24$', '$7$', 'It depends on the radius, so it must be integrated']
  answer: 0
  explanation: |-
    $u_{xx} + u_{yy} = 2 - 2 = 0$, so $u$ is harmonic and its average over any circle equals its value at the center: $u(2, -1) = 4 - 1 + 2(2)(-1) = -1$. The radius doesn't matter. ($7$ forgets the sign of the $xy$ term.)
- id: mv-h1-r2-h30
  lesson: mv-h1-harmonic
  type: text
  topic: Harmonic functions
  stem: 'The average of $v = x^2 + y^2 + z^2$ over the sphere of radius 3 centered at the origin is ___, while $v$ at the origin is 0. Give only the number.'
  accept: ['9', nine]
  explanation: |-
    On that sphere $v = 9$ everywhere, so the average is 9. It differs from $v(\mathbf 0) = 0$ because $v$ is not harmonic: $\nabla^2v = 6 > 0$, and a positive Laplacian pulls sphere averages above the center value.
- id: mv-h1-r2-h31
  lesson: mv-h1-harmonic
  module_quiz: true
  topic: Harmonic functions
  stem: 'Which functions are harmonic on all of $\mathbb R^3$? Select all that apply.'
  choices: ['$x^2 - y^2$', '$xyz$', '$x^2 + y^2 + z^2$', '$e^x\cos y$', '$x^3$']
  answer: [0, 1, 3]
  explanation: |-
    $\nabla^2(x^2 - y^2) = 2 - 2 = 0$; every second partial $u_{xx}, u_{yy}, u_{zz}$ of $xyz$ is 0; $\nabla^2(e^x\cos y) = e^x\cos y - e^x\cos y = 0$. But $\nabla^2(x^2 + y^2 + z^2) = 6$ and $\nabla^2(x^3) = 6x$, not identically zero.
- id: mv-h1-r2-h32
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: 'A steady flow of water is irrotational and incompressible, with $\mathbf v = \nabla\phi$. Which equation does $\phi$ satisfy?'
  choices: ['$\nabla\times\phi = \mathbf 0$', '$\nabla\phi = \mathbf 0$', '$\nabla^2\phi = 0$', '$\partial\phi/\partial t = \nabla^2\phi$']
  answer: 2
  explanation: |-
    Incompressible means $\nabla\cdot\mathbf v = 0$, and $\nabla\cdot\nabla\phi = \nabla^2\phi$, so $\phi$ is harmonic. Irrotational is what allowed $\mathbf v = \nabla\phi$ in the first place. $\nabla\phi = \mathbf 0$ would mean no flow; the curl of a scalar is undefined; the last is a heat equation, not a steady flow.
- id: mv-h1-r2-h33
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: '$u$ is harmonic inside and on a closed surface $S$. What is $\iint_S\dfrac{\partial u}{\partial n}\,dS$?'
  choices: ['The area of $S$', 'The maximum of $u$ on $S$', 'It depends on the shape of $S$', '0']
  answer: 3
  explanation: |-
    Green's first identity with $f = 1$ (or just the Divergence theorem applied to $\nabla u$) gives $\iint_S\partial u/\partial n\,dS = \iiint_E\nabla^2u\,dV = 0$. In a steady temperature field, as much heat flows in as out.
- id: mv-h1-r2-h34
  lesson: mv-h1-harmonic
  module_quiz: true
  type: label
  topic: Harmonic functions
  stem: 'The picture shows the setting for Green''s identities and the mean value property. Name the numbered parts.'
  image: {src: images/mv-h1-dirichlet-blank.svg, alt: 'A shaded blob-shaped region. An arrow points outward from a point on its edge. Inside, a dashed circle with a radius drawn surrounds a center dot. Five parts are numbered.'}
  labels:
    - {x: 25.8, y: 30.8, text: Boundary surface S}
    - {x: 89.7, y: 26.3, text: Outward unit normal n}
    - {x: 30.2, y: 53.3, text: Sphere of the mean value property}
    - {x: 41.3, y: 53.3, text: Center point p}
    - {x: 66.3, y: 46.2, text: Solid region E}
  distractors: [Inward unit normal, Level surface of u]
  explanation: |-
    $E$ is the solid region and $S$ its closed boundary, where the boundary values $u = h$ are given in the Dirichlet problem. The arrow points out of $E$, so it is the outward normal used in the Divergence theorem. The dashed sphere around $p$ lies inside $E$; for harmonic $u$, $u(p)$ equals the average of $u$ over it.
- id: mv-h1-r2-h35
  lesson: mv-h1-harmonic
  module_quiz: true
  topic: Harmonic functions
  stem: 'The surface of a solid ball is held at temperatures between 10 °C and 40 °C (varying from place to place). Which value could the steady temperature at the center have?'
  choices: ['5 °C', '50 °C', 'It could be any value', '25 °C']
  answer: 3
  explanation: |-
    A steady temperature is harmonic, and by the maximum principle its interior values lie between its minimum and maximum on the boundary: here between 10 and 40 °C. (In fact, by the mean value property, the center value is the average over the boundary sphere.) 5 and 50 °C would be an interior minimum or maximum.
- id: mv-h1-r2-h36
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: 'What is the mathematical reason behind Earnshaw''s theorem (no stable electrostatic equilibrium for a point charge in a charge-free region)?'
  choices: ['The electric field is always zero in a charge-free region', 'The potential there is harmonic, and harmonic functions have no strict local minimum or maximum', 'The potential energy is always negative', 'Electric fields are not conservative']
  answer: 1
  explanation: |-
    A stable equilibrium needs a strict local minimum of the potential energy $qV$. In a charge-free region $\nabla^2V = 0$, and the mean value property rules out strict interior extrema. Electrostatic fields are conservative ($\mathbf E = -\nabla V$), and they need not be zero where there is no charge.
- id: mv-h1-r2-h37
  lesson: mv-h1-harmonic
  type: order
  topic: Harmonic functions
  stem: 'Put the steps of the proof of the mean value property in order.'
  items:
    - 'Let $A(r)$ be the average of $u$ over the sphere of radius $r$ around $\mathbf p$'
    - 'Differentiate under the integral: $A''(r)$ is a multiple of the flux of $\nabla u$ through that sphere'
    - 'Use the Divergence theorem: the flux equals $\iiint\nabla^2u\,dV = 0$'
    - 'So $A$ is constant; let $r \to 0$ to get $A(r) = u(\mathbf p)$'
  explanation: |-
    Define the sphere average, differentiate it with the chain rule (the radial derivative is the normal derivative), turn the flux into a volume integral of the Laplacian, which is zero, and finally use continuity at the center to identify the constant.
- id: mv-h1-r2-h38
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: 'In the potential flow $\phi = U(r + a^2/r)\cos\theta$ past a cylinder of radius $a$, where on the cylinder is the water fastest, and how fast?'
  choices: ['At the front and back, speed $2U$', 'At the top and bottom, speed $U$', 'At the front and back, speed 0', 'At the top and bottom, speed $2U$']
  answer: 3
  explanation: |-
    On $r = a$ the velocity is tangential with component $\frac1r\phi_\theta = -2U\sin\theta$, so the speed is $2U|\sin\theta|$: largest, $2U$, at $\theta = \pm\pi/2$ (top and bottom). The front and back ($\theta = \pi, 0$) are stagnation points, where the speed is 0, the slowest, not the fastest.
- id: mv-h1-r2-h39
  lesson: mv-h1-harmonic
  module_quiz: true
  type: match
  topic: Harmonic functions
  stem: 'Match each feature of potential flow with the equation that expresses it.'
  pairs:
    - [Irrotational, 'Curl of v is zero']
    - [Incompressible, 'Divergence of v is zero']
    - [Solid wall, 'Normal derivative of φ is zero']
    - [Stagnation point, 'v is the zero vector']
  distractors: ['φ is zero on the wall']
  explanation: |-
    No swirl is $\nabla\times\mathbf v = \mathbf 0$ (so $\mathbf v = \nabla\phi$); no compression is $\nabla\cdot\mathbf v = 0$ (so $\nabla^2\phi = 0$); water can't pass through a wall, so $\partial\phi/\partial n = \mathbf v\cdot\mathbf n = 0$ there (the value of $\phi$ itself is not fixed); and a stagnation point is where the fluid is momentarily at rest.
- id: mv-h1-r2-h40
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: 'The surface of the unit ball is held at temperature $x^2 + 2$. What is the steady temperature at the center?'
  choices: ['$\tfrac73$', '$2$', '$3$', '$\tfrac83$']
  answer: 0
  explanation: |-
    The center value is the average of the boundary values. The average of $x^2$ over the unit sphere is $\tfrac13$ (by symmetry $x^2$, $y^2$, $z^2$ have equal averages summing to 1), so the center is $\tfrac13 + 2 = \tfrac73$. Taking $x^2 + 2$ at the center ($x = 0$) gives 2, wrong because $x^2 + 2$ is not harmonic.
- id: mv-h1-r2-h41
  lesson: mv-h1-harmonic
  topic: Harmonic functions
  stem: '$f(x, y)$ is harmonic and has a critical point at $P$. What can the second-derivative test report there?'
  choices: ['Only a local minimum', 'A saddle point or an inconclusive result, never a strict local maximum or minimum', 'Only a local maximum', 'Always inconclusive']
  answer: 1
  explanation: |-
    $f_{xx} = -f_{yy}$, so $D = f_{xx}f_{yy} - f_{xy}^2 = -f_{xx}^2 - f_{xy}^2 \le 0$. If $D < 0$ it's a saddle (as for $x^2 - y^2$); if $D = 0$ the test is inconclusive. It can never give $D > 0$, matching the maximum principle.
- id: mv-h1-r2-h42
  lesson: mv-h1-harmonic
  type: text
  topic: Harmonic functions
  stem: 'Water approaches a cylindrical bridge pier at 3 m/s (far upstream). In the potential-flow model, the fastest water speed on the pier''s surface is ___ m/s. Give only the number.'
  accept: ['6', six]
  explanation: |-
    The speed on the cylinder is $2U|\sin\theta|$, largest at the sides: $2(3) = 6$ m/s, whatever the pier's radius. (Real piers also have a wake behind them, which the ideal model leaves out.)
# --- Lesson 93: curvature of surfaces and Gauss-Bonnet ---
- id: mv-h1-r2-h43
  lesson: mv-h1-gauss-bonnet
  module_quiz: true
  topic: Curvature of surfaces
  stem: 'At a point of a surface the principal curvatures are $\kappa_1 = 3$ and $\kappa_2 = -2$. What are the Gaussian curvature and the type of point?'
  choices: ['$K = 1$, elliptic', '$K = \tfrac12$, elliptic', '$K = -6$, parabolic', '$K = -6$, hyperbolic']
  answer: 3
  explanation: |-
    $K = \kappa_1\kappa_2 = -6 < 0$: the surface bends up in some directions and down in others, a saddle-shaped (hyperbolic) point. $1$ and $\tfrac12$ are the sum and the mean curvature $H = (\kappa_1 + \kappa_2)/2$, not $K$. Parabolic points have $K = 0$.
- id: mv-h1-r2-h44
  lesson: mv-h1-gauss-bonnet
  module_quiz: true
  type: text
  topic: Curvature of surfaces
  stem: 'For $z = 3x^2 + 2xy + 3y^2$ at the origin, the principal curvatures are $\kappa_1 =$ ___ and $\kappa_2 =$ ___, and the Gaussian curvature is $K =$ ___ (largest first; give only numbers).'
  accept:
    - ['8']
    - ['4']
    - ['32']
  explanation: |-
    The tangent plane is horizontal, so the principal curvatures are the eigenvalues of the Hessian $\begin{bmatrix}6 & 2\\ 2 & 6\end{bmatrix}$: $(6 - \lambda)^2 = 4$ gives $\lambda = 8$ (along $y = x$) and $\lambda = 4$ (along $y = -x$). $K = 8\cdot4 = 32 = \det\mathcal H = 36 - 4$.
- id: mv-h1-r2-h45
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'The surface $z = x^2 - 6xy + y^2$ bends upward along both the $x$-axis and the $y$-axis. What kind of point is the origin?'
  choices: ['Hyperbolic, since the Hessian has eigenvalues 8 and $-4$', 'Elliptic, since it bends up along both axes', 'Parabolic, since $f_{xx} = f_{yy}$', 'Planar, since the gradient is zero']
  answer: 0
  explanation: |-
    The Hessian $\begin{bmatrix}2 & -6\\ -6 & 2\end{bmatrix}$ has eigenvalues $2 \pm 6$: $8$ and $-4$, so $K = -32 < 0$. Along $y = x$ the surface is $z = -4x^2$, bending down. Checking only the axes misses the mixed term.
- id: mv-h1-r2-h46
  lesson: mv-h1-gauss-bonnet
  module_quiz: true
  type: label
  topic: Curvature of surfaces
  stem: 'Classify the curvature of each numbered surface.'
  image: {src: images/mv-h1-curvature-signs-blank.svg, alt: 'Three surfaces drawn as wire grids: a dome-shaped cap, a saddle, and a half-cylinder. Each is numbered.'}
  labels:
    - {x: 17.5, y: 46, text: K > 0 (principal curvatures of the same sign)}
    - {x: 50, y: 42, text: K < 0 (principal curvatures of opposite signs)}
    - {x: 82.5, y: 44, text: K = 0 (exactly one principal curvature is zero)}
  distractors: [K = 0 (both principal curvatures are zero)]
  explanation: |-
    The dome bends the same way in every direction ($K > 0$, like a sphere with $K = 1/R^2$). The saddle bends up one way and down the other ($K < 0$). The cylinder bends around its axis but is straight along it, so one principal curvature is 0 and $K = 0$. Both being zero describes a plane (a planar point), which none of the pictures shows.
- id: mv-h1-r2-h47
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'What is the Gaussian curvature of the paraboloid $z = x^2 + y^2$ at the point above $(1, 0)$?'
  choices: ['$4$', '$\tfrac45$', '$\tfrac{4}{25}$', '$\tfrac{2}{25}$']
  answer: 2
  explanation: |-
    $f_{xx} = f_{yy} = 2$, $f_{xy} = 0$, $f_x = 2$, $f_y = 0$ at $(1, 0)$, so $K = \dfrac{4}{(1 + 4 + 0)^2} = \dfrac{4}{25}$. The answer 4 forgets the denominator, which is needed because the tangent plane is tilted; $\tfrac45$ forgets to square it.
- id: mv-h1-r2-h48
  lesson: mv-h1-gauss-bonnet
  module_quiz: true
  topic: Curvature of surfaces
  stem: 'Which statements follow from Gauss''s Theorema Egregium? Select all that apply.'
  choices: ['Rolling a flat sheet into a cylinder (without stretching) leaves $K = 0$', 'No map of a region of a sphere onto a plane keeps all distances correct', 'The principal curvatures do not change when a surface is bent without stretching', 'Bending a surface without stretching never changes its mean curvature', 'A paper cone has $K = 0$ away from its tip']
  answer: [0, 1, 4]
  explanation: |-
    $K$ is intrinsic: bending without stretching preserves it. So a rolled sheet or a paper cone keeps $K = 0$, and a sphere ($K = 1/R^2$) can't be flattened without distortion. The principal curvatures and $H$ are not intrinsic: rolling paper changes $\kappa_1$ from 0 to $1/r$ and $H$ from 0 to $1/(2r)$.
- id: mv-h1-r2-h49
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'A geodesic triangle on a sphere of radius 2 has angles $90^\circ$, $90^\circ$ and $60^\circ$. What is its area?'
  choices: ['$\tfrac{\pi}{3}$', '$\tfrac{4\pi}{3}$', '$\tfrac{2\pi}{3}$', '$\tfrac{8\pi}{3}$']
  answer: 1
  explanation: |-
    Angle excess: $240^\circ - 180^\circ = 60^\circ = \tfrac{\pi}{3}$. By Gauss–Bonnet with $K = 1/R^2$, area $= R^2\cdot\tfrac\pi3 = \tfrac{4\pi}{3}$. Forgetting the $R^2$ gives $\tfrac\pi3$; multiplying by $R$ instead gives $\tfrac{2\pi}{3}$.
- id: mv-h1-r2-h50
  lesson: mv-h1-gauss-bonnet
  module_quiz: true
  topic: Curvature of surfaces
  stem: 'What is $\iint_S K\,dA$ over the surface of an ellipsoid $\frac{x^2}{a^2} + \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1$?'
  choices: ['$4\pi abc$', '$\tfrac{4\pi}{abc}$', '$4\pi$', 'It depends on $a$, $b$ and $c$ and has no simple formula']
  answer: 2
  explanation: |-
    The ellipsoid is shaped like a sphere topologically ($\chi = 2$), so by the Gauss–Bonnet theorem $\iint K\,dA = 2\pi\chi = 4\pi$, whatever $a$, $b$, $c$ are. Its curvature varies from point to point, but the total is fixed. ($4\pi abc$ is a mix-up with the ellipsoid''s volume $\tfrac43\pi abc$.)
- id: mv-h1-r2-h51
  lesson: mv-h1-gauss-bonnet
  type: match
  topic: Curvature of surfaces
  stem: 'Match each closed surface with its total curvature $\iint K\,dA$.'
  pairs:
    - [Sphere of radius 5, 4π]
    - [Egg-shaped surface, 4π]
    - [Torus, '0']
    - [Surface with two holes, −4π]
  distractors: [100π, 2π]
  explanation: |-
    $\iint K\,dA = 2\pi\chi$ with $\chi = 2 - 2g$ for a surface with $g$ holes: $4\pi$ for anything shaped like a sphere (the radius doesn't matter: $K = 1/25$ times area $100\pi$), 0 for the torus, and $2\pi(-2) = -4\pi$ for two holes.
- id: mv-h1-r2-h52
  lesson: mv-h1-gauss-bonnet
  type: order
  topic: Curvature of surfaces
  stem: 'Order these closed surfaces from largest to smallest total Gaussian curvature $\iint K\,dA$.'
  items: [Sphere, Torus (one hole), Surface with two holes, Surface with three holes]
  explanation: |-
    Total curvature is $2\pi\chi = 2\pi(2 - 2g)$: $4\pi$, $0$, $-4\pi$, $-8\pi$. Each extra hole subtracts $4\pi$.
- id: mv-h1-r2-h53
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'On the torus $\mathbf r(u, v) = \langle(a + b\cos v)\cos u, (a + b\cos v)\sin u, b\sin v\rangle$, $K\,dA = \cos v\,du\,dv$. What is the total curvature of the outer half, $-\tfrac\pi2 \le v \le \tfrac\pi2$?'
  choices: ['$4\pi$', '$0$', '$2\pi$', '$-4\pi$']
  answer: 0
  explanation: |-
    $\int_0^{2\pi}\!\int_{-\pi/2}^{\pi/2}\cos v\,dv\,du = 2\pi\cdot2 = 4\pi$. The inner half gives $-4\pi$, so the whole torus totals 0, as Gauss–Bonnet requires ($\chi = 0$).
- id: mv-h1-r2-h54
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'At a point the principal curvatures are $\kappa_1 = 4$ and $\kappa_2 = -2$. By Euler''s theorem, what is the normal curvature in the direction at $45^\circ$ to the first principal direction?'
  choices: ['$2$', '$-8$', '$3$', '$1$']
  answer: 3
  explanation: |-
    $\kappa(\theta) = \kappa_1\cos^2\theta + \kappa_2\sin^2\theta = 4\cdot\tfrac12 + (-2)\cdot\tfrac12 = 1$. Adding without the $\tfrac12$ factors gives 2; $-8$ is $K$.
- id: mv-h1-r2-h55
  lesson: mv-h1-gauss-bonnet
  topic: Curvature of surfaces
  stem: 'What is the Gaussian curvature of the saddle $z = xy$ at the point above $(1, 1)$?'
  choices: ['$-1$', '$-\tfrac19$', '$-\tfrac13$', '$\tfrac19$']
  answer: 1
  explanation: |-
    $f_{xx} = f_{yy} = 0$, $f_{xy} = 1$, and at $(1, 1)$: $f_x = y = 1$, $f_y = x = 1$. So $K = \dfrac{0 - 1}{(1 + 1 + 1)^2} = -\dfrac19$. The answer $-1$ (the value at the origin) leaves out the tilt correction; $-\tfrac13$ forgets to square it.
- id: mv-h1-r2-h56
  lesson: mv-h1-gauss-bonnet
  type: text
  topic: Curvature of surfaces
  stem: 'A closed surface is cut into triangles with $V = 9$ vertices, $E = 27$ edges and $F = 18$ faces. Its Euler characteristic is $\chi =$ ___, so it has ___ hole(s). Give only numbers.'
  accept:
    - ['0', zero]
    - ['1', one]
  explanation: |-
    $\chi = V - E + F = 9 - 27 + 18 = 0$, and $\chi = 2 - 2g$ gives $g = 1$: a torus. (Check $3F = 2E$: $54 = 54$.) Its total curvature is $2\pi\chi = 0$.
