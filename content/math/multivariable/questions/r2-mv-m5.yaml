# Round 2 questions for module mv-m5: core lessons 21-24 (q01-q20) and honors lessons 24h1, 24h2 (h01-h28)

# ---------- Lesson 21: double integrals over rectangles ----------
- id: mv-m5-r2-q01
  lesson: mv-double-rect
  type: label
  module_quiz: true
  topic: Iterated integrals
  stem: 'The picture shows the solid under a surface over a rectangle. Name the numbered parts.'
  image: {src: images/mv-m5-slice-blank.svg, alt: 'A curved surface above a rectangle in the xy-plane. Inside the solid there is a shaded vertical slice at a fixed x, and a thin rectangular column stands on a small piece of the rectangle and reaches up to the surface.'}
  labels:
    - {x: 68.0, y: 36.4, text: 'Surface z = f(x, y)'}
    - {x: 53.9, y: 89.1, text: Rectangle R in the xy-plane}
    - {x: 56.0, y: 73.3, text: Cross-section of area A(x)}
    - {x: 31.6, y: 71.3, text: Column from one term of a Riemann sum}
  distractors: [Level curve of f, Tangent plane]
  explanation: |-
    The top surface is the graph $z = f(x, y)$ (1) and the base is the rectangle $R$ (2). The shaded vertical slice at a fixed $x$ (3) has area $A(x) = \int_c^d f(x, y)\,dy$; integrating $A(x)$ from $a$ to $b$ gives the volume, which is the iterated integral. The thin column (4) has volume $f(x^*, y^*)\,\Delta A$, one term of a double Riemann sum.
- id: mv-m5-r2-q02
  lesson: mv-double-rect
  type: text
  module_quiz: true
  topic: Iterated integrals
  stem: 'Evaluate $\displaystyle\int_0^1\int_0^2(x + 2y)\,dy\,dx$. Give only the number: ___'
  accept: ['5']
  explanation: |-
    Inner integral, in $y$ with $x$ held constant: $\int_0^2(x + 2y)\,dy = \left[xy + y^2\right]_0^2 = 2x + 4$. Outer: $\int_0^1(2x + 4)\,dx = 1 + 4 = 5$.
- id: mv-m5-r2-q03
  lesson: mv-double-rect
  type: order
  topic: Iterated integrals
  stem: 'Put the steps for evaluating $\displaystyle\int_a^b\int_c^d f(x, y)\,dy\,dx$ in order.'
  items:
    - 'Hold $x$ constant and find an antiderivative of $f$ with respect to $y$'
    - 'Evaluate that antiderivative at $y = d$ and $y = c$ and subtract, leaving a function of $x$'
    - 'Integrate that function of $x$ from $a$ to $b$'
    - 'Check the result by integrating in the order $dx\,dy$'
  explanation: |-
    The inner differential $dy$ goes with the inner limits $c$ and $d$, so the $y$-integration comes first and produces $A(x)$, a function of $x$ only. The outer integral in $x$ then gives a number. By Fubini's theorem the other order must give the same number, which makes a good check.
- id: mv-m5-r2-q04
  lesson: mv-double-rect
  topic: Iterated integrals
  stem: 'Let $f$ be continuous on $R = [0, 2]\times[1, 3]$. Which iterated integrals equal $\iint_R f\,dA$? Select all that apply.'
  choices:
    - '$\displaystyle\int_0^2\int_1^3 f(x, y)\,dy\,dx$'
    - '$\displaystyle\int_1^3\int_0^2 f(x, y)\,dx\,dy$'
    - '$\displaystyle\int_0^2\int_1^3 f(x, y)\,dx\,dy$'
    - '$\displaystyle\int_1^3\int_0^2 f(x, y)\,dy\,dx$'
  answer: [0, 1]
  explanation: |-
    The $x$-limits are $0$ to $2$ and the $y$-limits are $1$ to $3$, and each pair of limits must sit with its own differential. The first two do this, in the two orders Fubini's theorem allows. The last two attach the $y$-limits to $dx$ and the $x$-limits to $dy$, so they integrate over $[1, 3]\times[0, 2]$, a different rectangle.
- id: mv-m5-r2-q05
  lesson: mv-double-rect
  type: match
  topic: Double integrals
  stem: 'Match each integral over the unit square $R = [0, 1]\times[0, 1]$ to its value.'
  pairs:
    - ['$\iint_R xy\,dA$', '1/4']
    - ['$\iint_R (x + y)\,dA$', '1']
    - ['$\iint_R x^2y\,dA$', '1/6']
    - ['$\iint_R 4xy^3\,dA$', '1/2']
  distractors: ['1/3']
  explanation: |-
    Each integrand is a product (or a sum of products), so it factors into single integrals: $\tfrac12\cdot\tfrac12 = \tfrac14$; $\tfrac12 + \tfrac12 = 1$; $\tfrac13\cdot\tfrac12 = \tfrac16$; $4\cdot\tfrac12\cdot\tfrac14 = \tfrac12$. The value $\tfrac13$ comes from forgetting the factor $y$ in $x^2y$.

# ---------- Lesson 22: general regions ----------
- id: mv-m5-r2-q06
  lesson: mv-double-general
  type: label
  module_quiz: true
  topic: General regions
  stem: 'The shaded region is Type I. Name the numbered parts used to set up $\int_a^b\int_{g_1(x)}^{g_2(x)} f\,dy\,dx$.'
  image: {src: images/mv-m5-type1-blank.svg, alt: 'A shaded region between an upper curve and a lower curve, with dashed vertical sides at x = a and x = b. An arrow at a fixed x runs up from the lower curve to the upper curve.'}
  labels:
    - {x: 34.4, y: 26.8, text: 'Top curve y = g₂(x), the upper inner limit'}
    - {x: 31.1, y: 73.0, text: 'Bottom curve y = g₁(x), the lower inner limit'}
    - {x: 48.8, y: 57.9, text: Vertical line at a fixed x}
    - {x: 20.0, y: 78.7, text: 'The line x = a, the lower outer limit'}
  distractors: ['The line y = c, the lower outer limit', Horizontal line at a fixed y]
  explanation: |-
    For a Type I region, a vertical line at a fixed $x$ (3) enters the region on the bottom curve $y = g_1(x)$ (2) and leaves on the top curve $y = g_2(x)$ (1); those curves are the inner limits. The outer limits are the constants $a$ and $b$, the dashed sides (4 is $x = a$). Horizontal lines and $y = c$ belong to the Type II description.
- id: mv-m5-r2-q07
  lesson: mv-double-general
  type: text
  topic: General regions
  stem: 'The area of the region between the line $y = 2x$ and the parabola $y = x^2$ is ___. Give only the number, as a fraction or to 2 decimals.'
  accept: ['4/3', '1.33', '1.333']
  explanation: |-
    The curves meet where $x^2 = 2x$: $x = 0$ and $x = 2$, and the line is on top between them. Area $= \displaystyle\int_0^2\int_{x^2}^{2x}1\,dy\,dx = \int_0^2(2x - x^2)\,dx = 4 - \frac83 = \frac43.$
- id: mv-m5-r2-q08
  lesson: mv-double-general
  type: order
  topic: Reversing the order
  stem: 'Put the steps for reversing the order of an iterated integral in order.'
  items:
    - 'Write the region as inequalities read off the given limits'
    - 'Sketch the region'
    - 'Describe the region with slices in the other direction: constant outer limits, inner limits where a slice enters and leaves'
    - 'Evaluate the new iterated integral'
  explanation: |-
    The limits are the only description of the region you are given, so turn them into inequalities first, then draw the region. Only from the sketch can you read the new limits correctly; swapping limits symbolically is the classic mistake. Evaluating comes last.
- id: mv-m5-r2-q09
  lesson: mv-double-general
  topic: General regions
  stem: 'Which regions are both Type I and Type II? Select all that apply.'
  choices:
    - 'The triangle with vertices $(0, 0)$, $(1, 0)$, $(1, 1)$'
    - 'The disk $x^2 + y^2 \le 1$'
    - 'The ring $1 \le x^2 + y^2 \le 4$'
    - 'The square $[0, 3]\times[0, 3]$ with the middle square $[1, 2]\times[1, 2]$ removed'
  answer: [0, 1]
  explanation: |-
    The triangle is $0 \le x \le 1$, $0 \le y \le x$ and also $0 \le y \le 1$, $y \le x \le 1$. The disk is $-1 \le x \le 1$, $-\sqrt{1 - x^2} \le y \le \sqrt{1 - x^2}$, and the same with $x$ and $y$ swapped. The ring and the square with a hole are neither: a vertical line through the hole (such as $x = 0$ for the ring, or $x = 1.5$ for the square) meets the region in two separate pieces, and so does a horizontal one. Split them into pieces and add.
- id: mv-m5-r2-q10
  lesson: mv-double-general
  type: match
  module_quiz: true
  topic: General regions
  stem: 'Match each iterated integral to the region it integrates over.'
  pairs:
    - ['$\int_0^1\int_0^x f\,dy\,dx$', 'Triangle with vertices (0, 0), (1, 0), (1, 1)']
    - ['$\int_0^1\int_x^1 f\,dy\,dx$', 'Triangle with vertices (0, 0), (0, 1), (1, 1)']
    - ['$\int_0^1\int_0^{1-x} f\,dy\,dx$', 'Triangle with vertices (0, 0), (1, 0), (0, 1)']
    - ['$\int_0^1\int_{x^2}^{x} f\,dy\,dx$', 'Region between the parabola y = x² and the line y = x']
  distractors: ['Triangle with vertices (1, 0), (1, 1), (0, 1)']
  explanation: |-
    Read each inner limit as "from the bottom curve to the top curve". $0 \le y \le x$ lies below the line $y = x$; $x \le y \le 1$ lies above it; $0 \le y \le 1 - x$ lies below the line $x + y = 1$; and $x^2 \le y \le x$ lies between the parabola and the line. The triangle $(1, 0), (1, 1), (0, 1)$ is $1 - x \le y \le 1$, which is not listed.

# ---------- Lesson 23: polar coordinates ----------
- id: mv-m5-r2-q11
  lesson: mv-double-polar
  type: label
  module_quiz: true
  topic: Polar double integrals
  stem: 'The shaded patch is a small polar rectangle. Name the numbered parts.'
  image: {src: images/mv-m5-polar-patch-blank.svg, alt: 'A shaded patch between two dashed rays from the origin and two circular arcs centered at the origin. A small arc near the origin marks the angle between the rays.'}
  labels:
    - {x: 59.7, y: 60.8, text: 'Radial side, of length Δr'}
    - {x: 62.5, y: 43.8, text: 'Outer arc, of length about r Δθ'}
    - {x: 23.1, y: 78.2, text: 'Angle Δθ between the rays'}
    - {x: 37.3, y: 73.5, text: Distance r from the origin}
  distractors: ['Side of length Δx', 'Arc of length Δθ']
  explanation: |-
    The patch is cut out by two circles a distance $\Delta r$ apart (1) and two rays an angle $\Delta\theta$ apart (3). An arc at distance $r$ (4) from the origin has length $r\,\Delta\theta$, not $\Delta\theta$ (2). So the patch is nearly a rectangle with sides $\Delta r$ and $r\,\Delta\theta$, and $dA = r\,dr\,d\theta$.
- id: mv-m5-r2-q12
  lesson: mv-double-polar
  type: text
  topic: Polar double integrals
  stem: 'The volume of the solid under $z = 9 - x^2 - y^2$ and above the $xy$-plane is ___$\,\pi$. Give only the number that multiplies $\pi$.'
  accept: ['81/2', '40.5']
  explanation: |-
    The paraboloid meets $z = 0$ on the circle $r = 3$. $V = \displaystyle\int_0^{2\pi}\int_0^3(9 - r^2)\,r\,dr\,d\theta = 2\pi\left[\frac{9r^2}{2} - \frac{r^4}{4}\right]_0^3 = 2\pi\left(\frac{81}{2} - \frac{81}{4}\right) = \frac{81\pi}{2}.$ Leaving out the factor $r$ gives $36\pi$ instead.
- id: mv-m5-r2-q13
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'For which of these integrals do polar coordinates make the work much easier? Select all that apply.'
  choices:
    - '$\iint_D e^{x^2 + y^2}\,dA$ over the unit disk'
    - '$\iint_D y\,dA$ over the quarter ring $1 \le x^2 + y^2 \le 4$, $x, y \ge 0$'
    - '$\iint_D xy\,dA$ over the square $[0, 1]\times[0, 1]$'
    - '$\iint_D (x + y)\,dA$ over the triangle with vertices $(0, 0)$, $(1, 0)$, $(0, 1)$'
  answer: [0, 1]
  explanation: |-
    The disk and the quarter ring become rectangles in $(r, \theta)$, and $e^{x^2 + y^2} = e^{r^2}$, which the factor $r$ lets you integrate by substitution. The square and the triangle have straight sides that are awkward in polar form (the triangle's edge is $r = 1/(\cos\theta + \sin\theta)$), and their integrands are simple polynomials in $x$ and $y$, so rectangular coordinates are easier.
- id: mv-m5-r2-q14
  lesson: mv-double-polar
  type: match
  module_quiz: true
  topic: Polar double integrals
  stem: 'Match each region to its description in polar coordinates.'
  pairs:
    - ['The disk $x^2 + y^2 \le 4$', '0 ≤ r ≤ 2, 0 ≤ θ ≤ 2π']
    - ['The half-disk $x^2 + y^2 \le 4$, $y \ge 0$', '0 ≤ r ≤ 2, 0 ≤ θ ≤ π']
    - ['The ring $1 \le x^2 + y^2 \le 4$', '1 ≤ r ≤ 2, 0 ≤ θ ≤ 2π']
    - ['The disk $x^2 + y^2 \le 2x$', '0 ≤ r ≤ 2 cos θ, −π/2 ≤ θ ≤ π/2']
  distractors: ['0 ≤ r ≤ 4, 0 ≤ θ ≤ 2π', '1 ≤ r ≤ 4, 0 ≤ θ ≤ 2π']
  explanation: |-
    $x^2 + y^2 = r^2$, so $x^2 + y^2 \le 4$ means $r \le 2$, not $r \le 4$. The upper half needs only $0 \le \theta \le \pi$. The ring is $1 \le r \le 2$. For $x^2 + y^2 \le 2x$, substitute: $r^2 \le 2r\cos\theta$, so $r \le 2\cos\theta$, which needs $\cos\theta \ge 0$: $-\tfrac\pi2 \le \theta \le \tfrac\pi2$.
- id: mv-m5-r2-q15
  lesson: mv-double-polar
  topic: Polar double integrals
  stem: 'Which integral equals $\iint_D f\,dA$ over the disk $x^2 + y^2 \le 2y$ (center $(0, 1)$, radius 1)?'
  choices:
    - '$\displaystyle\int_0^{2\pi}\int_0^{2\sin\theta} f(r\cos\theta, r\sin\theta)\,r\,dr\,d\theta$'
    - '$\displaystyle\int_{-\pi/2}^{\pi/2}\int_0^{2\cos\theta} f(r\cos\theta, r\sin\theta)\,r\,dr\,d\theta$'
    - '$\displaystyle\int_0^{\pi}\int_0^{2\sin\theta} f(r\cos\theta, r\sin\theta)\,r\,dr\,d\theta$'
    - '$\displaystyle\int_0^{\pi}\int_0^{2\sin\theta} f(r\cos\theta, r\sin\theta)\,dr\,d\theta$'
  answer: 2
  explanation: |-
    Substituting gives $r^2 \le 2r\sin\theta$, so $0 \le r \le 2\sin\theta$, which needs $\sin\theta \ge 0$: $0 \le \theta \le \pi$ (the disk lies above the $x$-axis). Going to $2\pi$ makes the upper limit negative for $\pi < \theta < 2\pi$; the $2\cos\theta$ version describes the disk centered at $(1, 0)$; and the last choice has lost the factor $r$.

# ---------- Lesson 24: applications ----------
- id: mv-m5-r2-q16
  lesson: mv-double-apps
  type: label
  module_quiz: true
  topic: Surface area
  stem: 'The picture shows how the surface-area formula is built. Name the numbered parts.'
  image: {src: images/mv-m5-surface-patch-blank.svg, alt: 'A curved surface above the xy-plane. A small rectangle in the xy-plane has dashed vertical lines rising from its corners to a parallelogram on the surface, which has two edge arrows. A red arrow points up from the center of the parallelogram.'}
  labels:
    - {x: 49.5, y: 84.5, text: 'Shadow in the xy-plane, of area ΔA'}
    - {x: 59.5, y: 34.8, text: Piece of the tangent plane}
    - {x: 51.8, y: 17.8, text: 'Normal vector (−fx, −fy, 1)'}
    - {x: 63.5, y: 22.3, text: 'Surface z = f(x, y)'}
  distractors: [Gradient of f in the xy-plane, Level curve of f]
  explanation: |-
    Above the small rectangle of area $\Delta A$ (1), the surface (4) is nearly a parallelogram in its tangent plane (2), spanned by $\langle\Delta x, 0, f_x\Delta x\rangle$ and $\langle 0, \Delta y, f_y\Delta y\rangle$. Their cross product is $\langle -f_x, -f_y, 1\rangle\Delta x\,\Delta y$, which points along the normal (3), and its length gives the patch area $\sqrt{1 + f_x^2 + f_y^2}\,\Delta A$. The gradient of $f$ lies in the $xy$-plane, not along the normal to the graph.
- id: mv-m5-r2-q17
  lesson: mv-double-apps
  type: text
  topic: Mass and center of mass
  stem: 'A disk of radius 2 has constant density $\rho = 3$. Its moment of inertia about its center is $I_0 =$ ___$\,\pi$. Give only the number that multiplies $\pi$.'
  accept: ['24']
  explanation: |-
    $I_0 = \displaystyle\iint_D (x^2 + y^2)\rho\,dA = 3\int_0^{2\pi}\int_0^2 r^2\cdot r\,dr\,d\theta = 3\cdot2\pi\cdot\frac{2^4}{4} = 24\pi.$ Check with $I_0 = \tfrac12ma^2$: $m = 3\cdot4\pi = 12\pi$, so $\tfrac12\cdot12\pi\cdot4 = 24\pi$.
- id: mv-m5-r2-q18
  lesson: mv-double-apps
  type: match
  topic: Mass and center of mass
  stem: 'A lamina occupies $D$ with density $\rho(x, y)$. Match each quantity to the double integral that defines it.'
  pairs:
    - ['$m$', 'Integral of ρ dA']
    - ['$M_y$', 'Integral of xρ dA']
    - ['$M_x$', 'Integral of yρ dA']
    - ['$I_0$', 'Integral of (x² + y²)ρ dA']
  distractors: ['Integral of (x + y)ρ dA']
  explanation: |-
    Mass adds up $\rho\,dA$. A moment weights mass by distance from the axis: $M_y$ (about the $y$-axis) uses the distance $x$, and $M_x$ uses $y$. The moment of inertia weights by the *square* of the distance, $x^2 + y^2$ for the origin. $(x + y)\rho$ is not a standard quantity.
- id: mv-m5-r2-q19
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'Which statements about the center of mass of a lamina are true? Select all that apply.'
  choices:
    - 'If the region and the density are both symmetric about the $y$-axis, then $\bar x = 0$.'
    - 'When the density is constant, the center of mass is the centroid.'
    - 'The center of mass always lies inside the lamina.'
    - 'Doubling the density everywhere doubles $\bar x$.'
  answer: [0, 1]
  explanation: |-
    Symmetry makes $M_y = 0$, so $\bar x = 0$; and a constant density cancels from $\bar x = M_y/m$, leaving the centroid. But the center of mass of a ring is its center, which is not part of the ring, so it need not lie inside. Doubling $\rho$ doubles both $M_y$ and $m$, so $\bar x$ does not change.
- id: mv-m5-r2-q20
  lesson: mv-double-apps
  topic: Mass and center of mass
  stem: 'A lamina occupies the disk $x^2 + y^2 \le 1$ and has density $\rho = 1 + x$. Where is its center of mass?'
  choices:
    - '$\left(0, \tfrac14\right)$'
    - '$\left(\tfrac14, 0\right)$'
    - '$\left(\tfrac{1}{4\pi}, 0\right)$'
    - '$\left(\tfrac12, 0\right)$'
  answer: 1
  explanation: |-
    The region and density are symmetric about the $x$-axis, so $\bar y = 0$. Mass: $m = \iint(1 + x)\,dA = \pi + 0 = \pi$ (the integral of $x$ over the disk is 0 by symmetry). $M_y = \iint x(1 + x)\,dA = \iint x^2\,dA = \int_0^{2\pi}\int_0^1 r^2\cos^2\theta\,r\,dr\,d\theta = \tfrac14\cdot\pi$. So $\bar x = \dfrac{\pi/4}{\pi} = \tfrac14$: pulled toward the heavier right side. The choice $\tfrac{1}{4\pi}$ comes from dividing by $\pi$ twice, and $\left(0, \tfrac14\right)$ puts the shift on the wrong axis.
