# Round 3 questions for mv-m8: honors lesson 38h3 (vector potentials and the Helmholtz decomposition)
- id: mv-m8-r3-h01
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'Which identity shows that a field with nonzero divergence cannot be the curl of any smooth field?'
  choices: ['$\nabla\times(\nabla f) = \mathbf 0$', '$\nabla\cdot(\nabla f) = \nabla^2 f$', '$\nabla\cdot(\nabla\times\mathbf A) = 0$', '$\nabla\times(\nabla\times\mathbf A) = \nabla(\nabla\cdot\mathbf A) - \nabla^2\mathbf A$']
  answer: 2
  explanation: |-
    If $\mathbf F = \nabla\times\mathbf A$, then $\nabla\cdot\mathbf F = \nabla\cdot(\nabla\times\mathbf A) = 0$. So a nonzero divergence rules out a vector potential. The identity $\nabla\times\nabla f = \mathbf 0$ is the matching test for scalar potentials (gradients), not for curls.
- id: mv-m8-r3-h02
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'On which region is every divergence-free field (with continuous partial derivatives) guaranteed to be a curl?'
  choices: ['An open ball', 'Space minus the origin', 'The region between two concentric spheres', 'Space minus two points']
  answer: 0
  explanation: |-
    A ball is star-shaped (about its center), so the Poincaré lemma applies. The other three regions each contain a closed surface around a missing point. There the field $(\mathbf x - \mathbf p)/|\mathbf x - \mathbf p|^3$, with $\mathbf p$ a missing point, is divergence-free but has flux $4\pi$ through that surface. The flux of a curl through a closed surface is 0, so this field is not a curl.
- id: mv-m8-r3-h03
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'On which regions is every curl-free field (with continuous partial derivatives) a gradient? Select all that apply.'
  choices: ['All of $\mathbb R^3$', 'Space minus the origin', 'Space minus the $z$-axis', 'An open box']
  answer: [0, 1, 3]
  explanation: |-
    The test needs a simply connected region. All of space and a box are simply connected. So is space minus a point: a loop can always slide off the missing point. Space minus the $z$-axis is not simply connected, and the vortex field $\langle -y, x, 0\rangle/(x^2 + y^2)$ is curl-free there but has circulation $2\pi$ around the axis, so it is not a gradient.
- id: mv-m8-r3-h04
  lesson: mv-m8-h-vector-potentials
  type: text
  topic: Vector potentials
  stem: 'For the uniform field $\mathbf B = \langle 0, 0, 4\rangle$, the vector potential $\mathbf A = \tfrac12\mathbf B\times\mathbf x$ is $\langle c\,y,\; 2x,\; 0\rangle$ with $c$ = ___. (Give only the number.)'
  accept: ['-2']
  explanation: |-
    $\mathbf B\times\mathbf x = \langle 0\cdot z - 4y,\; 4x - 0\cdot z,\; 0\cdot y - 0\cdot x\rangle = \langle -4y, 4x, 0\rangle$, and half of it is $\langle -2y, 2x, 0\rangle$. Check: its curl is $\langle 0, 0, 2 - (-2)\rangle = \langle 0, 0, 4\rangle$.
- id: mv-m8-r3-h05
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'Which field is a vector potential for $\mathbf F = \langle 0,\; x,\; 0\rangle$?'
  choices: ['$\langle 0,\; 0,\; xz\rangle$', '$\langle xz,\; 0,\; 0\rangle$', '$\langle -xz,\; 0,\; 0\rangle$', '$\langle 0,\; xz,\; 0\rangle$']
  answer: 1
  explanation: |-
    Method 1 with $P = 0$, $Q = x$, $R = 0$: $A_2 = 0$ and $A_1 = \int_0^z x\,dt = xz$. Check: $\nabla\times\langle xz, 0, 0\rangle = \langle 0,\; x,\; 0\rangle$.
    The others have curls $\langle 0, -z, 0\rangle$, $\langle 0, -x, 0\rangle$ (a sign error) and $\langle -x, 0, z\rangle$.
- id: mv-m8-r3-h06
  lesson: mv-m8-h-vector-potentials
  type: text
  topic: Vector potentials
  stem: 'The field $\mathbf F = \langle 2x,\; 3y,\; cz\rangle$ has a vector potential on all of $\mathbb R^3$ exactly when $c$ = ___. (Give only the number.)'
  accept: ['-5']
  explanation: |-
    On all of space, a vector potential exists exactly when $\nabla\cdot\mathbf F = 0$. Here $\nabla\cdot\mathbf F = 2 + 3 + c$, which is 0 when $c = -5$.
- id: mv-m8-r3-h07
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'Three of these fields have the same curl as $\langle -y,\; 0,\; 0\rangle$. Which one does not?'
  choices: ['$\langle 0,\; x,\; 0\rangle$', '$\tfrac12\langle -y,\; x,\; 0\rangle$', '$\langle y,\; 0,\; 0\rangle$', '$\langle -y,\; 0,\; z^2\rangle$']
  answer: 2
  explanation: |-
    $\nabla\times\langle -y, 0, 0\rangle = \langle 0, 0, 1\rangle$. The first two also have curl $\langle 0, 0, 1\rangle$; they differ from $\langle -y, 0, 0\rangle$ by $\nabla(xy)$ and $\nabla(xy/2)$. The last one adds $\nabla(z^3/3)$, a gauge transformation. But $\langle y, 0, 0\rangle$ has curl $\langle 0, 0, -1\rangle$.
- id: mv-m8-r3-h08
  lesson: mv-m8-h-vector-potentials
  type: match
  topic: Vector potentials
  stem: 'Match each field, on the region given, to the potentials it has there.'
  pairs:
    - ['$\mathbf x/|\mathbf x|^3$ on space minus the origin', Scalar potential only]
    - ['$\langle -y, x, 0\rangle/(x^2 + y^2)$ on space minus the $z$-axis', Vector potential only]
    - ['$\langle y, x, 0\rangle$ on all of space', Both]
    - ['$\langle x, y, z\rangle$ on all of space', Scalar potential only]
    - ['$\langle xy, 0, 0\rangle$ on all of space', Neither]
  explanation: |-
    $\mathbf x/|\mathbf x|^3 = \nabla(-1/|\mathbf x|)$, but its flux through a sphere is $4\pi$, so it is not a curl. The vortex field is curl-free but circulates $2\pi$ around the axis, so it is not a gradient; it is $\nabla\times(-\ln r\,\mathbf k)$. $\langle y, x, 0\rangle = \nabla(xy)$ has divergence 0 on all of space, so it is a curl too. $\langle x, y, z\rangle = \nabla\big(\tfrac12|\mathbf x|^2\big)$ has divergence 3. $\langle xy, 0, 0\rangle$ has curl $\langle 0, 0, -x\rangle$ and divergence $y$, so it has neither.
- id: mv-m8-r3-h09
  lesson: mv-m8-h-vector-potentials
  type: order
  topic: Vector potentials
  stem: 'Put the steps of Method 1 (finding a vector potential with $A_3 = 0$) in order.'
  items:
    - 'Check that $\nabla\cdot\mathbf F = 0$ on the region'
    - 'Set $A_3 = 0$ and integrate the first two equations in $z$, leaving an unknown $g(x, y)$ in $A_1$'
    - 'Use $\nabla\cdot\mathbf F = 0$ to rewrite the third equation as $R(x, y, z) - R(x, y, 0) - g_y = R$'
    - 'Choose $g = -\int_0^y R(x, s, 0)\,ds$'
    - 'Check that $\nabla\times\mathbf A = \mathbf F$'
  explanation: |-
    The divergence check comes first, since without it no vector potential exists. Integrating in $z$ gives $A_2$ and $A_1$ up to $g$. The third curl equation, simplified using $P_x + Q_y = -R_z$, tells you $g_y = -R(x, y, 0)$, which fixes $g$. A final curl check catches slips.
- id: mv-m8-r3-h10
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: '$\mathbf A = \langle xy,\; 0,\; 0\rangle$ has $\nabla\cdot\mathbf A = y$. Which $\chi$ makes $\mathbf A + \nabla\chi$ satisfy the Coulomb gauge $\nabla\cdot(\mathbf A + \nabla\chi) = 0$?'
  choices: ['$\chi = \tfrac16y^3$', '$\chi = -\tfrac12y^2$', '$\chi = -\tfrac12xy^2$', '$\chi = -\tfrac16y^3$']
  answer: 3
  explanation: |-
    We need $\nabla^2\chi = -\nabla\cdot\mathbf A = -y$. For $\chi = -\tfrac16y^3$, $\chi_{yy} = -y$ and the other second partials are 0. ✓
    $\tfrac16y^3$ has the wrong sign ($\nabla^2\chi = y$), $-\tfrac12y^2$ gives $-1$, and $-\tfrac12xy^2$ gives $-x$.
- id: mv-m8-r3-h11
  lesson: mv-m8-h-vector-potentials
  topic: Helmholtz decomposition
  stem: 'The constant field $\langle 1, 0, 0\rangle$ equals both $\nabla x$ and $\nabla\times\langle 0, 0, y\rangle$, so its Helmholtz-type split is not unique. Why does this not contradict the uniqueness theorem?'
  choices: ['Its divergence is not zero', 'It does not die off at infinity', 'Its curl is not zero', 'All of $\mathbb R^3$ is not simply connected']
  answer: 1
  explanation: |-
    Uniqueness needs the field, and both of its parts, to tend to $\mathbf 0$ at infinity. A constant field never does. Its divergence and curl are both 0, so the other "reasons" are false, and $\mathbb R^3$ is simply connected.
- id: mv-m8-r3-h12
  lesson: mv-m8-h-vector-potentials
  topic: Helmholtz decomposition
  stem: 'A smooth field $\mathbf F$ is zero outside some ball, and $\nabla\cdot\mathbf F = 0$ everywhere. What does the Helmholtz decomposition $\mathbf F = -\nabla\phi + \nabla\times\mathbf A$ give?'
  choices: ['$\phi = 0$, so $\mathbf F = \nabla\times\mathbf A$', '$\mathbf A = \mathbf 0$, so $\mathbf F = -\nabla\phi$', '$\phi$ is a nonzero constant', 'Nothing: the theorem needs $\nabla\cdot\mathbf F \ne 0$']
  answer: 0
  explanation: |-
    $\phi = \dfrac{1}{4\pi}\displaystyle\iiint\frac{\nabla\cdot\mathbf F}{|\mathbf x - \mathbf y|}\,dV$, and the integrand is 0, so $\phi = 0$. The divergence of $\mathbf F$ is the source of $\phi$, and the curl of $\mathbf F$ is the source of $\mathbf A$. (A nonzero constant $\phi$ would also give $\nabla\phi = \mathbf 0$, but the formula gives exactly 0.)
- id: mv-m8-r3-h13
  lesson: mv-m8-h-vector-potentials
  topic: Helmholtz decomposition
  stem: 'Which statements about the magnetic vector potential are true? Select all that apply.'
  choices: ['Because $\nabla\cdot\mathbf B = 0$ on all of space, $\mathbf B = \nabla\times\mathbf A$ for some $\mathbf A$', 'Replacing $\mathbf A$ by $\mathbf A + \nabla\chi$ changes $\mathbf B$', 'The Coulomb gauge is the condition $\nabla\cdot\mathbf A = 0$', 'In magnetostatics in the Coulomb gauge, $\nabla^2\mathbf A = -\mu_0\mathbf J$']
  answer: [0, 2, 3]
  explanation: |-
    All of space is star-shaped, so a solenoidal $\mathbf B$ is a curl. $\nabla\times(\mathbf A + \nabla\chi) = \nabla\times\mathbf A$, so a gauge transformation leaves $\mathbf B$ alone. Ampère's law $\nabla\times\mathbf B = \mu_0\mathbf J$ becomes $\nabla(\nabla\cdot\mathbf A) - \nabla^2\mathbf A = \mu_0\mathbf J$, and with $\nabla\cdot\mathbf A = 0$ this is $\nabla^2\mathbf A = -\mu_0\mathbf J$.
- id: mv-m8-r3-h14
  lesson: mv-m8-h-vector-potentials
  type: label
  topic: Vector potentials
  stem: 'The picture shows two regions of space with a hole. Name the numbered parts.'
  image: {src: images/mv-m8-potential-holes-blank.svg, alt: 'Two shaded boxes standing for regions of space. Left: a vertical dashed line with a loop around it. Right: a small hollow dot inside a sphere. Numbered markers sit on the line, the loop, the dot and the sphere.'}
  labels:
    - {x: 25, y: 16, text: Removed line}
    - {x: 14.8, y: 47, text: Loop that cannot shrink}
    - {x: 75, y: 35.3, text: Removed point}
    - {x: 87, y: 60, text: Sphere that cannot shrink}
  distractors: [Vector potential, Gauge function]
  explanation: |-
    Left: space minus a line. A loop around the line cannot shrink to a point, so a curl-free field there (the vortex field) can fail to be a gradient. Right: space minus a point. A sphere around the point cannot shrink to a point, so a divergence-free field there ($\mathbf x/|\mathbf x|^3$) can fail to be a curl.
- id: mv-m8-r3-h15
  lesson: mv-m8-h-vector-potentials
  topic: Vector potentials
  stem: 'With $r = \sqrt{x^2 + y^2}$, what is $\nabla\times\langle 0,\; 0,\; -\ln r\rangle$ (away from the $z$-axis)?'
  choices: ['$\dfrac{\langle y,\; -x,\; 0\rangle}{x^2 + y^2}$', '$\dfrac{\langle x,\; y,\; 0\rangle}{x^2 + y^2}$', '$\dfrac{\langle -y,\; x,\; 0\rangle}{\sqrt{x^2 + y^2}}$', '$\dfrac{\langle -y,\; x,\; 0\rangle}{x^2 + y^2}$']
  answer: 3
  explanation: |-
    For $\mathbf A = \langle 0, 0, h\rangle$, $\nabla\times\mathbf A = \langle h_y, -h_x, 0\rangle$. With $h = -\ln r$, $h_x = -x/r^2$ and $h_y = -y/r^2$, so the curl is $\langle -y, x, 0\rangle/r^2$: the vortex field. The first choice has the opposite sign, the second is $-\nabla h$ (a gradient, not a curl), and the third has the wrong power of $r$.
- id: mv-m8-r3-h16
  lesson: mv-m8-h-vector-potentials
  type: text
  topic: Helmholtz decomposition
  stem: 'Helmholtz published his paper on vortex motion, which gave the decomposition its name, in the year ___.'
  accept: ['1858']
  explanation: |-
    Hermann von Helmholtz's paper on vortex motion appeared in 1858 in Crelle's journal. George Stokes had used the same decomposition earlier, in an 1849 paper on diffraction.
