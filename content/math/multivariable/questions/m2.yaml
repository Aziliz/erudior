# Module 2: Vector functions and motion
- id: mv-q-0701
  lesson: mv-vector-functions
  module_quiz: true
  topic: Derivatives of vector functions
  stem: 'Find $\mathbf r''(t)$ for $\mathbf r(t) = \langle t^3,\, e^{2t},\, \cos t\rangle$.'
  choices: ['$\langle 3t^2,\, 2e^{2t},\, -\sin t\rangle$', '$\langle 3t^2,\, e^{2t},\, \sin t\rangle$', '$\langle 3t^2,\, 2e^{2t},\, \sin t\rangle$', '$3t^2 + 2e^{2t} - \sin t$']
  answer: 0
  explanation: |-
    Differentiate each component: $(t^3)' = 3t^2$, $(e^{2t})' = 2e^{2t}$, $(\cos t)' = -\sin t$.
    The derivative of a vector function is a vector, not the sum of the components.
- id: mv-q-0702
  lesson: mv-vector-functions
  topic: Vector functions
  stem: 'What is the domain of $\mathbf r(t) = \left\langle \sqrt t,\, \ln(4 - t),\, \dfrac{1}{t - 1}\right\rangle$?'
  choices: ['$(0, 4)$', '$[0, 1)\cup(1, 4)$', '$[0, 4]$', '$(1, 4)$']
  answer: 1
  explanation: |-
    All three components must be defined: $\sqrt t$ needs $t \ge 0$, $\ln(4-t)$ needs $t < 4$, and $\tfrac{1}{t-1}$ needs $t \ne 1$.
    Together: $[0, 1)\cup(1, 4)$.
- id: mv-q-0703
  lesson: mv-vector-functions
  module_quiz: true
  topic: Vector functions
  stem: 'Evaluate $\displaystyle\lim_{t\to0}\left\langle \frac{\sin t}{t},\, \frac{1 - \cos t}{t},\, e^t\right\rangle$.'
  choices: ['$\langle 0, 0, 1\rangle$', '$\langle 1, 1, 1\rangle$', '$\langle 1, 0, 1\rangle$', 'The limit does not exist']
  answer: 2
  explanation: |-
    Take each limit: $\tfrac{\sin t}{t}\to1$, $\tfrac{1-\cos t}{t}\to0$ (L'Hôpital: $\sin t/1 \to 0$), $e^t \to 1$.
- id: mv-q-0704
  lesson: mv-vector-functions
  topic: Derivatives of vector functions
  stem: 'Find the unit tangent vector of $\mathbf r(t) = \langle 3\cos t,\, 3\sin t,\, 4t\rangle$ at $t = 0$.'
  choices: ['$\langle 0, 3, 4\rangle$', '$\langle 1, 0, 0\rangle$', '$\left\langle 0, \tfrac37, \tfrac47\right\rangle$', '$\left\langle 0, \tfrac35, \tfrac45\right\rangle$']
  answer: 3
  explanation: |-
    $\mathbf r'(t) = \langle -3\sin t, 3\cos t, 4\rangle$, so $\mathbf r'(0) = \langle 0, 3, 4\rangle$ with length 5. Divide: $\mathbf T(0) = \langle 0, \tfrac35, \tfrac45\rangle$.
    $\langle 0,3,4\rangle$ is tangent but not unit; $\langle 1,0,0\rangle$ is the position direction.
- id: mv-q-0705
  lesson: mv-vector-functions
  module_quiz: true
  topic: Derivatives of vector functions
  stem: 'Which is the tangent line to $\mathbf r(t) = \langle t^2,\, t^3,\, t\rangle$ at $t = 1$?'
  choices: ['$\langle 1 + 2s,\, 1 + 3s,\, 1 + s\rangle$', '$\langle 2 + s,\, 3 + s,\, 1 + s\rangle$', '$\langle 2s,\, 3s,\, s\rangle$', '$\langle 1 + s,\, 1 + s,\, 1 + s\rangle$']
  answer: 0
  explanation: |-
    The point is $\mathbf r(1) = \langle 1,1,1\rangle$ and the direction is $\mathbf r'(1) = \langle 2t, 3t^2, 1\rangle\big|_{t=1} = \langle 2, 3, 1\rangle$.
    Line: point $+ s\cdot$direction. The second choice swaps point and direction; the third passes through the origin, not the curve.
- id: mv-q-0706
  lesson: mv-vector-functions
  topic: Vector functions
  stem: 'Evaluate $\displaystyle\int_0^1\langle 2t,\, 3t^2,\, 4t^3\rangle\,dt$.'
  choices: ['$3$', '$\langle 1, 1, 1\rangle$', '$\langle 2, 3, 4\rangle$', '$\langle 2, 6t, 12t^2\rangle$']
  answer: 1
  explanation: |-
    Integrate componentwise: $\left[t^2\right]_0^1 = 1$, $\left[t^3\right]_0^1 = 1$, $\left[t^4\right]_0^1 = 1$. The result is a vector.
- id: mv-q-0707
  lesson: mv-vector-functions
  module_quiz: true
  topic: Vector functions
  stem: 'Find $\mathbf r(t)$ if $\mathbf r''(t) = \langle 1,\, 2t,\, e^t\rangle$ and $\mathbf r(0) = \langle 0, 1, 0\rangle$.'
  choices: ['$\langle t,\, t^2,\, e^t\rangle$', '$\langle t,\, t^2 + 1,\, e^t\rangle$', '$\langle t,\, t^2 + 1,\, e^t - 1\rangle$', '$\langle 1,\, t^2 + 1,\, e^t - 1\rangle$']
  answer: 2
  explanation: |-
    Antiderivative: $\langle t, t^2, e^t\rangle + \mathbf C$. At $t = 0$ this is $\langle 0, 0, 1\rangle + \mathbf C = \langle 0, 1, 0\rangle$, so $\mathbf C = \langle 0, 1, -1\rangle$.
    The second choice forgets that $e^0 = 1$, not 0.
- id: mv-q-0708
  lesson: mv-vector-functions
  topic: Derivatives of vector functions
  stem: 'If $|\mathbf r(t)| = 5$ for all $t$, what can you conclude?'
  choices: ['$\mathbf r''(t) = \mathbf 0$', '$|\mathbf r''(t)| = 5$', '$\mathbf r''(t)$ is parallel to $\mathbf r(t)$', '$\mathbf r(t)\cdot\mathbf r''(t) = 0$']
  answer: 3
  explanation: |-
    Differentiate $\mathbf r\cdot\mathbf r = 25$: $2\,\mathbf r\cdot\mathbf r' = 0$. A point moving on a sphere moves perpendicular to its radius. It can still move, so $\mathbf r'$ need not be zero.
- id: mv-q-0709
  lesson: mv-vector-functions
  topic: Derivatives of vector functions
  stem: 'Which is the correct product rule for the cross product?'
  choices: ['$(\mathbf u\times\mathbf v)'' = \mathbf u''\times\mathbf v + \mathbf u\times\mathbf v''$', '$(\mathbf u\times\mathbf v)'' = \mathbf u''\times\mathbf v''$', '$(\mathbf u\times\mathbf v)'' = \mathbf v''\times\mathbf u + \mathbf v\times\mathbf u''$', '$(\mathbf u\times\mathbf v)'' = \mathbf u''\cdot\mathbf v + \mathbf u\cdot\mathbf v''$']
  answer: 0
  explanation: |-
    The product rule holds with the order of factors kept. The third choice reverses both orders and equals $-(\mathbf u\times\mathbf v)'$.
- id: mv-q-0710
  lesson: mv-vector-functions
  topic: Vector functions
  stem: 'The curve $\mathbf r(t) = \langle t\cos t,\, t\sin t,\, t\rangle$ lies on which surface?'
  choices: ['The cylinder $x^2 + y^2 = 1$', 'The cone $z^2 = x^2 + y^2$', 'The sphere $x^2 + y^2 + z^2 = 1$', 'The paraboloid $z = x^2 + y^2$']
  answer: 1
  explanation: |-
    $x^2 + y^2 = t^2\cos^2t + t^2\sin^2t = t^2 = z^2$, so every point satisfies $z^2 = x^2 + y^2$.
- id: mv-q-0711
  lesson: mv-vector-functions
  topic: Vector functions
  stem: 'What is the projection of the helix $\langle \cos t,\, \sin t,\, t\rangle$ onto the $xy$-plane?'
  choices: ['A line', 'A spiral', 'The unit circle', 'A parabola']
  answer: 2
  explanation: |-
    Drop the $z$-component: $\langle \cos t, \sin t\rangle$ traces the unit circle, again and again.
- id: mv-q-0712
  lesson: mv-vector-functions
  topic: Derivatives of vector functions
  stem: 'For $\mathbf u(t) = \langle t, 1, t^2\rangle$ and $\mathbf v(t) = \langle 1, t, t\rangle$, find $\dfrac{d}{dt}\left[\mathbf u\cdot\mathbf v\right]$ at $t = 1$.'
  choices: ['$3$', '$\langle 1, 1, 3\rangle$', '$4$', '$5$']
  answer: 3
  explanation: |-
    $\mathbf u\cdot\mathbf v = t + t + t^3 = 2t + t^3$, whose derivative is $2 + 3t^2 = 5$ at $t = 1$.
    The product rule $\mathbf u'\cdot\mathbf v + \mathbf u\cdot\mathbf v'$ gives the same: $\langle 1,0,2\rangle\cdot\langle 1,1,1\rangle + \langle 1,1,1\rangle\cdot\langle 0,1,1\rangle = 3 + 2$.

- id: mv-q-0801
  lesson: mv-arc-length
  module_quiz: true
  topic: Arc length
  stem: 'Find the length of the helix $\langle \cos t,\, \sin t,\, t\rangle$ for $0 \le t \le 2\pi$.'
  choices: ['$2\pi\sqrt2$', '$2\pi$', '$4\pi$', '$\sqrt2$']
  answer: 0
  explanation: |-
    $|\mathbf r'(t)| = |\langle -\sin t, \cos t, 1\rangle| = \sqrt2$, so $L = \int_0^{2\pi}\sqrt2\,dt = 2\pi\sqrt2$.
    $2\pi$ is the length of the projected circle only; $4\pi$ adds circumference and height instead of combining them with Pythagoras.
- id: mv-q-0802
  lesson: mv-arc-length
  topic: Arc length
  stem: 'Find the length of $\mathbf r(t) = \langle 2t,\, t^2,\, \tfrac13t^3\rangle$ for $0 \le t \le 3$.'
  choices: ['$9$', '$15$', '$21$', '$\sqrt{15}$']
  answer: 1
  explanation: |-
    $\mathbf r' = \langle 2, 2t, t^2\rangle$, $|\mathbf r'| = \sqrt{4 + 4t^2 + t^4} = t^2 + 2$.
    $L = \int_0^3(t^2 + 2)\,dt = 9 + 6 = 15$.
- id: mv-q-0803
  lesson: mv-arc-length
  module_quiz: true
  topic: Arc length
  stem: 'For $\mathbf r(t) = \langle 3\cos t,\, 3\sin t,\, 4t\rangle$, what is the arc length function $s(t)$ measured from $t = 0$?'
  choices: ['$s = 3t$', '$s = 4t$', '$s = 5t$', '$s = 7t$']
  answer: 2
  explanation: |-
    The speed is $\sqrt{9\sin^2t + 9\cos^2t + 16} = 5$, so $s(t) = \int_0^t5\,du = 5t$.
- id: mv-q-0804
  lesson: mv-arc-length
  topic: Curvature
  stem: 'What is the curvature of a circle of radius 4?'
  choices: ['$4$', '$16$', '$\tfrac{1}{16}$', '$\tfrac14$']
  answer: 3
  explanation: |-
    A circle of radius $a$ has curvature $1/a$. Larger circles bend more gently.
- id: mv-q-0805
  lesson: mv-arc-length
  topic: Curvature
  stem: 'What is the curvature of a straight line?'
  choices: ['$0$', '$1$', 'Undefined', 'It depends on the slope']
  answer: 0
  explanation: |-
    On a line the unit tangent $\mathbf T$ never changes, so $d\mathbf T/ds = \mathbf 0$ and $\kappa = 0$.
- id: mv-q-0806
  lesson: mv-arc-length
  module_quiz: true
  topic: Curvature
  stem: 'Find the curvature of $y = x^2$ at the origin.'
  choices: ['$1$', '$2$', '$\tfrac12$', '$0$']
  answer: 1
  explanation: |-
    $\kappa = \dfrac{|f''(x)|}{(1 + f'(x)^2)^{3/2}}$ with $f'(0) = 0$ and $f''(0) = 2$: $\kappa = \dfrac{2}{1} = 2$.
- id: mv-q-0807
  lesson: mv-arc-length
  topic: Curvature
  stem: 'Find the curvature of $y = x^3$ at $x = 1$ (to 3 decimals).'
  choices: ['$6.000$', '$0.600$', '$0.190$', '$0.060$']
  answer: 2
  explanation: |-
    $f'(1) = 3$ and $f''(1) = 6$, so $\kappa = \dfrac{6}{(1 + 9)^{3/2}} = \dfrac{6}{10^{3/2}} \approx 0.190$.
    $0.600$ uses the power 1 instead of $\tfrac32$; $6$ forgets the denominator.
- id: mv-q-0808
  lesson: mv-arc-length
  topic: Curvature
  stem: 'What is the radius of the osculating circle of $y = x^2$ at the origin?'
  choices: ['$2$', '$1$', '$4$', '$\tfrac12$']
  answer: 3
  explanation: |-
    The curvature there is 2, and the radius of curvature is $1/\kappa = \tfrac12$.
- id: mv-q-0809
  lesson: mv-arc-length
  module_quiz: true
  topic: Curvature
  stem: 'Find the curvature of the helix $\langle \cos t,\, \sin t,\, t\rangle$.'
  choices: ['$\tfrac12$', '$1$', '$\sqrt2$', '$\tfrac{1}{\sqrt2}$']
  answer: 0
  explanation: |-
    $\mathbf r'(t) = \langle -\sin t, \cos t, 1\rangle$ and $\mathbf r''(t) = \langle -\cos t, -\sin t, 0\rangle$; their cross product $\langle \sin t, -\cos t, 1\rangle$ has length $\sqrt2$.
    $\kappa = \dfrac{\sqrt2}{(\sqrt2)^3} = \dfrac12$. The helix bends less than the unit circle it projects onto, because it also climbs.
- id: mv-q-0810
  lesson: mv-arc-length
  topic: Curvature
  stem: 'Find the curvature of $\mathbf r(t) = \langle t,\, t^2,\, t^3\rangle$ at $t = 0$.'
  choices: ['$0$', '$2$', '$6$', '$1$']
  answer: 1
  explanation: |-
    At $t = 0$: first derivative $\langle 1, 0, 0\rangle$, second derivative $\langle 0, 2, 0\rangle$. Their cross product is $\langle 0, 0, 2\rangle$, length 2, and the speed is 1, so $\kappa = 2/1^3 = 2$.
- id: mv-q-0811
  lesson: mv-arc-length
  topic: Curvature
  stem: 'Why is curvature defined as $|d\mathbf T/ds|$ rather than $|d\mathbf T/dt|$?'
  choices: ['Because $\mathbf T$ cannot be differentiated with respect to $t$', 'Because $|d\mathbf T/dt|$ is always zero', 'So that it depends only on the shape of the curve, not on how fast it is traced', 'Because $s$ and $t$ are always equal']
  answer: 2
  explanation: |-
    $|d\mathbf T/dt| = \kappa\,|\mathbf r'|$ grows if the same curve is traced faster. Dividing by speed (using arc length) makes curvature a geometric property of the curve alone.
- id: mv-q-0812
  lesson: mv-arc-length
  topic: Curvature
  stem: 'Which formula for the curvature of a space curve $\mathbf r(t)$ is correct?'
  choices: ['$\kappa = \dfrac{|\mathbf r''\cdot\mathbf r''''|}{|\mathbf r''|^3}$', '$\kappa = |\mathbf T''(t)|$', '$\kappa = \dfrac{|\mathbf r''\times\mathbf r''''|}{|\mathbf r''|^2}$', '$\kappa = \dfrac{|\mathbf r''\times\mathbf r''''|}{|\mathbf r''|^3}$']
  answer: 3
  explanation: |-
    $\kappa = |\mathbf T'|/|\mathbf r'| = |\mathbf r'\times\mathbf r''|/|\mathbf r'|^3$. The cube matters, and the numerator uses the cross product, not the dot product.

- id: mv-q-0901
  lesson: mv-tnb
  module_quiz: true
  topic: TNB frame
  stem: 'The principal unit normal $\mathbf N(t)$ is defined as'
  choices: ['$\dfrac{\mathbf T''(t)}{|\mathbf T''(t)|}$', '$\dfrac{\mathbf r''''(t)}{|\mathbf r''''(t)|}$', '$\mathbf T\times\mathbf B$ normalized from $\mathbf r''$', '$\dfrac{\mathbf r''(t)}{|\mathbf r''(t)|}$']
  answer: 0
  explanation: |-
    $\mathbf N = \mathbf T'/|\mathbf T'|$. The direction of $\mathbf r''$ (acceleration) matches $\mathbf N$ only when speed is constant, and $\mathbf r'/|\mathbf r'|$ is $\mathbf T$.
- id: mv-q-0902
  lesson: mv-tnb
  topic: TNB frame
  stem: 'The binormal vector is'
  choices: ['$\mathbf N\times\mathbf T$', '$\mathbf T\times\mathbf N$', '$\mathbf T + \mathbf N$', '$\mathbf T\cdot\mathbf N$']
  answer: 1
  explanation: |-
    $\mathbf B = \mathbf T\times\mathbf N$ completes a right-handed frame. $\mathbf N\times\mathbf T = -\mathbf B$, and $\mathbf T\cdot\mathbf N = 0$.
- id: mv-q-0903
  lesson: mv-tnb
  module_quiz: true
  topic: TNB frame
  stem: 'For the helix $\langle \cos t,\, \sin t,\, t\rangle$, what is $\mathbf N(t)$?'
  choices: ['$\langle \cos t, \sin t, 0\rangle$', '$\tfrac{1}{\sqrt2}\langle -\sin t, \cos t, 1\rangle$', '$\langle -\cos t, -\sin t, 0\rangle$', '$\langle 0, 0, 1\rangle$']
  answer: 2
  explanation: |-
    $\mathbf T = \tfrac{1}{\sqrt2}\langle -\sin t, \cos t, 1\rangle$, so $\mathbf T' = \tfrac{1}{\sqrt2}\langle -\cos t, -\sin t, 0\rangle$; normalizing gives $\langle -\cos t, -\sin t, 0\rangle$, pointing horizontally at the $z$-axis.
    The second choice is $\mathbf T$; the first points away from the axis.
- id: mv-q-0904
  lesson: mv-tnb
  module_quiz: true
  topic: Tangential and normal acceleration
  stem: 'For $\mathbf r(t) = \langle t,\, t^2,\, 0\rangle$, find the tangential component of acceleration $a_T$ at $t = 1$.'
  choices: ['$2$', '$\tfrac{2}{\sqrt5}$', '$4$', '$\tfrac{4}{\sqrt5}$']
  answer: 3
  explanation: |-
    $\mathbf r'(1) = \langle 1, 2, 0\rangle$, $\mathbf r''(1) = \langle 0, 2, 0\rangle$. $a_T = \dfrac{\mathbf r'\cdot\mathbf r''}{|\mathbf r'|} = \dfrac{4}{\sqrt5}$.
    $\tfrac{2}{\sqrt5}$ is $a_N$.
- id: mv-q-0905
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'For $\mathbf r(t) = \langle t,\, t^2,\, 0\rangle$, find the normal component of acceleration $a_N$ at $t = 1$.'
  choices: ['$\tfrac{2}{\sqrt5}$', '$\tfrac{4}{\sqrt5}$', '$2$', '$\tfrac{2}{5}$']
  answer: 0
  explanation: |-
    $\mathbf r'\times\mathbf r'' = \langle 1,2,0\rangle\times\langle 0,2,0\rangle = \langle 0, 0, 2\rangle$, so $a_N = \dfrac{|\mathbf r'\times\mathbf r''|}{|\mathbf r'|} = \dfrac{2}{\sqrt5}$.
    Check: $a_T^2 + a_N^2 = \tfrac{16}{5} + \tfrac45 = 4 = |\mathbf a|^2$.
- id: mv-q-0906
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'A particle moves at constant speed along a curved path. Which is true?'
  choices: ['Its acceleration is zero', '$a_T = 0$ and the acceleration points along $\mathbf N$', '$a_N = 0$', 'Its acceleration points along $\mathbf T$']
  answer: 1
  explanation: |-
    $a_T = \tfrac{d}{dt}(\text{speed}) = 0$, but turning still requires $a_N = \kappa v^2 > 0$. All the acceleration is normal.
- id: mv-q-0907
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'A car takes a curve of radius 50 m at a steady 20 m/s. What is its normal acceleration?'
  choices: ['$0.4\text{ m/s}^2$', '$2.5\text{ m/s}^2$', '$8\text{ m/s}^2$', '$1000\text{ m/s}^2$']
  answer: 2
  explanation: |-
    $a_N = \kappa v^2 = \dfrac{v^2}{R} = \dfrac{400}{50} = 8\text{ m/s}^2$.
- id: mv-q-0908
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'If a car takes the same curve at twice the speed, its normal acceleration'
  choices: ['stays the same', 'doubles', 'halves', 'quadruples']
  answer: 3
  explanation: |-
    $a_N = \kappa v^2$ and $\kappa$ depends only on the curve, so doubling $v$ multiplies $a_N$ by 4.
- id: mv-q-0909
  lesson: mv-tnb
  module_quiz: true
  topic: TNB frame
  stem: 'The osculating plane at a point of a curve is'
  choices: ['the plane spanned by $\mathbf T$ and $\mathbf N$, with normal $\mathbf B$', 'the plane spanned by $\mathbf N$ and $\mathbf B$, with normal $\mathbf T$', 'the plane spanned by $\mathbf T$ and $\mathbf B$, with normal $\mathbf N$', 'the $xy$-plane']
  answer: 0
  explanation: |-
    The osculating plane contains the direction of motion and the direction of turning, so it is spanned by $\mathbf T$ and $\mathbf N$; its normal is $\mathbf B = \mathbf T\times\mathbf N$. The acceleration always lies in it.
    (The plane of $\mathbf N$ and $\mathbf B$, with normal $\mathbf T$, is the normal plane.)
- id: mv-q-0910
  lesson: mv-tnb
  topic: TNB frame
  stem: 'For a curve lying in the $xy$-plane, the binormal $\mathbf B$ is'
  choices: ['always $\mathbf 0$', 'constant, equal to $\mathbf k$ or $-\mathbf k$', 'equal to $\mathbf T$', 'parallel to $\mathbf N$']
  answer: 1
  explanation: |-
    $\mathbf T$ and $\mathbf N$ both lie in the $xy$-plane, so their cross product is a unit vector along $\pm\mathbf k$. It flips sign only where the curve changes from turning left to turning right.
- id: mv-q-0911
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'For the helix $\langle \cos t,\, \sin t,\, t\rangle$, find $a_T$ and $a_N$.'
  choices: ['$a_T = 1$, $a_N = 0$', '$a_T = \tfrac12$, $a_N = \tfrac12$', '$a_T = 0$, $a_N = 1$', '$a_T = 0$, $a_N = \tfrac12$']
  answer: 2
  explanation: |-
    The speed is constantly $\sqrt2$, so $a_T = 0$. Then $a_N = \kappa v^2 = \tfrac12\cdot2 = 1$, which matches $|\mathbf r''| = |\langle -\cos t, -\sin t, 0\rangle| = 1$.
    $\tfrac12$ is the curvature, not $a_N$.
- id: mv-q-0912
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'At some instant $|\mathbf a| = 5$ and $a_T = 3$. What is $a_N$?'
  choices: ['$2$', '$8$', '$\sqrt{34}$', '$4$']
  answer: 3
  explanation: |-
    $\mathbf T$ and $\mathbf N$ are perpendicular unit vectors, so $a_T^2 + a_N^2 = |\mathbf a|^2$: $a_N = \sqrt{25 - 9} = 4$ (it is never negative).

- id: mv-q-1001
  lesson: mv-motion
  module_quiz: true
  topic: Velocity and acceleration
  stem: 'A particle has position $\mathbf r(t) = \langle t^2,\, 2t,\, \ln t\rangle$. Find its speed at $t = 1$.'
  choices: ['$3$', '$\sqrt5$', '$9$', '$5$']
  answer: 0
  explanation: |-
    $\mathbf v(t) = \langle 2t, 2, 1/t\rangle$, so $\mathbf v(1) = \langle 2, 2, 1\rangle$ and the speed is $\sqrt{4 + 4 + 1} = 3$.
    $5$ adds the components; $9$ is the squared speed.
- id: mv-q-1002
  lesson: mv-motion
  topic: Velocity and acceleration
  stem: 'Find the acceleration of $\mathbf r(t) = \langle t^3,\, 4t,\, \cos 2t\rangle$ at $t = 0$.'
  choices: ['$\langle 0, 4, 1\rangle$', '$\langle 0, 0, -4\rangle$', '$\langle 0, 0, 4\rangle$', '$\langle 0, 0, -2\rangle$']
  answer: 1
  explanation: |-
    $\mathbf v = \langle 3t^2, 4, -2\sin2t\rangle$ and $\mathbf a = \langle 6t, 0, -4\cos2t\rangle$. At $t = 0$: $\langle 0, 0, -4\rangle$.
    $\langle 0,4,1\rangle$ is a mix of velocity and position; $-2$ forgets the second chain-rule factor.
- id: mv-q-1003
  lesson: mv-motion
  module_quiz: true
  topic: Velocity and acceleration
  stem: 'An object has $\mathbf a(t) = \langle 0, 0, -10\rangle$, $\mathbf v(0) = \langle 1, 2, 3\rangle$, and $\mathbf r(0) = \mathbf 0$. Find $\mathbf r(t)$.'
  choices: ['$\langle t, 2t, 3t - 10t^2\rangle$', '$\langle 1, 2, 3 - 10t\rangle$', '$\langle t, 2t, 3t - 5t^2\rangle$', '$\langle 0, 0, -5t^2\rangle$']
  answer: 2
  explanation: |-
    $\mathbf v(t) = \langle 1, 2, 3 - 10t\rangle$ (that is the second choice, the velocity). Integrate again with $\mathbf r(0) = \mathbf 0$: $\langle t, 2t, 3t - 5t^2\rangle$.
    The first choice forgets the $\tfrac12$ from integrating $t$.
- id: mv-q-1004
  lesson: mv-motion
  module_quiz: true
  topic: Projectile motion
  stem: 'A ball is launched at 30 m/s at $45^\circ$ over level ground ($g = 9.8\text{ m/s}^2$). What is its range?'
  choices: ['about $45.9$ m', 'about $64.9$ m', 'about $3.06$ m', 'about $91.8$ m']
  answer: 3
  explanation: |-
    $R = \dfrac{v_0^2\sin2\alpha}{g} = \dfrac{900\cdot\sin90^\circ}{9.8} \approx 91.8$ m.
    $45.9$ m is half the correct value; $64.9$ m uses $\sin45^\circ$ instead of $\sin90^\circ$.
- id: mv-q-1005
  lesson: mv-motion
  topic: Projectile motion
  stem: 'A projectile is launched at 20 m/s at $30^\circ$ ($g = 9.8\text{ m/s}^2$). What is its maximum height?'
  choices: ['about $5.10$ m', 'about $10.2$ m', 'about $15.3$ m', 'about $20.4$ m']
  answer: 0
  explanation: |-
    $H = \dfrac{(v_0\sin\alpha)^2}{2g} = \dfrac{10^2}{19.6} \approx 5.10$ m.
    $10.2$ m forgets the 2 in $2g$; $15.3$ m uses the horizontal component $v_0\cos\alpha$.
- id: mv-q-1006
  lesson: mv-motion
  topic: Projectile motion
  stem: 'Over level ground and without air resistance, which launch angle gives the greatest range for a fixed speed?'
  choices: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$90^\circ$']
  answer: 1
  explanation: |-
    $R = v_0^2\sin2\alpha/g$ is largest when $\sin2\alpha = 1$, that is $2\alpha = 90^\circ$.
- id: mv-q-1007
  lesson: mv-motion
  topic: Projectile motion
  stem: 'Two projectiles are launched with the same speed over level ground at $25^\circ$ and $65^\circ$. Compare their ranges.'
  choices: ['The $65^\circ$ one goes farther', 'The $25^\circ$ one goes farther', 'They land at the same distance', 'It depends on the speed']
  answer: 2
  explanation: |-
    $\sin(2\cdot25^\circ) = \sin50^\circ$ and $\sin(2\cdot65^\circ) = \sin130^\circ = \sin50^\circ$. Complementary angles give equal ranges (the higher one stays up longer but moves forward more slowly).
- id: mv-q-1008
  lesson: mv-motion
  module_quiz: true
  topic: Projectile motion
  stem: 'A stone is thrown horizontally at 12 m/s from the top of a 45 m cliff ($g = 9.8\text{ m/s}^2$). How long until it hits the ground below?'
  choices: ['about $3.75$ s', 'about $4.59$ s', 'about $9.18$ s', 'about $3.03$ s']
  answer: 3
  explanation: |-
    Vertical motion: $45 - 4.9t^2 = 0$, so $t = \sqrt{45/4.9} \approx 3.03$ s. The horizontal speed does not affect the fall time.
    $4.59$ s is $45/9.8$ with no square root; $3.75$ s is $45/12$, which mixes in the horizontal speed.
- id: mv-q-1009
  lesson: mv-motion
  topic: Velocity and acceleration
  stem: 'A 2 kg particle moves along $\mathbf r(t) = \langle t^2,\, t^3,\, 0\rangle$ (meters, seconds). What net force acts on it at $t = 1$?'
  choices: ['$\langle 4, 12, 0\rangle$ N', '$\langle 2, 6, 0\rangle$ N', '$\langle 4, 6, 0\rangle$ N', '$\langle 2, 3, 0\rangle$ N']
  answer: 0
  explanation: |-
    $\mathbf a = \mathbf r'' = \langle 2, 6t, 0\rangle = \langle 2, 6, 0\rangle$ at $t = 1$. Newton: $\mathbf F = m\mathbf a = \langle 4, 12, 0\rangle$ N.
    $\langle 2,6,0\rangle$ forgets the mass; $\langle 4,6,0\rangle$ uses velocity times mass.
- id: mv-q-1010
  lesson: mv-motion
  topic: Velocity and acceleration
  stem: 'A particle moves in a circle of radius 2 m at angular speed 3 rad/s. What is the magnitude of its acceleration?'
  choices: ['$6\text{ m/s}^2$', '$18\text{ m/s}^2$', '$12\text{ m/s}^2$', '$0$']
  answer: 1
  explanation: |-
    For $\mathbf r = \langle R\cos\omega t, R\sin\omega t\rangle$, $\mathbf a = -\omega^2\mathbf r$, so $|\mathbf a| = R\omega^2 = 2\cdot9 = 18\text{ m/s}^2$. $6$ is the speed $R\omega$.
- id: mv-q-1011
  lesson: mv-motion
  topic: Projectile motion
  stem: 'A ball is thrown straight up at 49 m/s ($g = 9.8\text{ m/s}^2$). How long is it in the air?'
  choices: ['$5$ s', '$20$ s', '$10$ s', '$2.5$ s']
  answer: 2
  explanation: |-
    Time of flight $= \dfrac{2v_0\sin\alpha}{g} = \dfrac{2\cdot49\cdot1}{9.8} = 10$ s. It takes 5 s to reach the top and 5 s to fall back.
