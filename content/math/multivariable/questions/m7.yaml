# Module 7: Vector fields and line integrals
- id: mv-q-2801
  lesson: mv-vector-fields
  module_quiz: true
  topic: Vector fields
  stem: 'For $\mathbf F(x, y) = \langle -y,\, x\rangle$, what is $\mathbf F(1, 2)$?'
  choices: ['$\langle -2, 1\rangle$', '$\langle -1, 2\rangle$', '$\langle 2, -1\rangle$', '$\langle 1, 2\rangle$']
  answer: 0
  explanation: |-
    Substitute $x = 1$, $y = 2$: $\langle -2, 1\rangle$. It is drawn as an arrow starting at the point $(1, 2)$.
- id: mv-q-2802
  lesson: mv-vector-fields
  topic: Vector fields
  stem: 'How does the field $\mathbf F = \langle x, y\rangle$ look?'
  choices: ['Arrows circling the origin counterclockwise', 'Arrows pointing directly away from the origin, longer farther out', 'Arrows all pointing in the same direction', 'Arrows pointing toward the origin, shorter farther out']
  answer: 1
  explanation: |-
    At each point the arrow is the position vector itself: radial, outward, with length equal to the distance from the origin.
- id: mv-q-2803
  lesson: mv-vector-fields
  module_quiz: true
  topic: Vector fields
  stem: 'Why is each arrow of $\mathbf F = \langle -y, x\rangle$ perpendicular to the position vector $\langle x, y\rangle$?'
  choices: ['Because $|\mathbf F| = 1$', 'Because the field is conservative', 'Because $\langle x, y\rangle\cdot\langle -y, x\rangle = 0$', 'Because $\mathbf F$ points toward the origin']
  answer: 2
  explanation: |-
    $-xy + xy = 0$. Perpendicular to the radius means tangent to circles about the origin, so the field swirls.
- id: mv-q-2804
  lesson: mv-vector-fields
  topic: Gradient fields
  stem: 'Find the gradient field of $f(x, y) = x^2y - y^3$.'
  choices: ['$\langle 2x, -3y^2\rangle$', '$\langle x^2 - 3y^2,\, 2xy\rangle$', '$\langle 2xy - 3y^2,\, x^2\rangle$', '$\langle 2xy,\, x^2 - 3y^2\rangle$']
  answer: 3
  explanation: |-
    $\nabla f = \langle f_x, f_y\rangle = \langle 2xy,\, x^2 - 3y^2\rangle$.
- id: mv-q-2805
  lesson: mv-vector-fields
  module_quiz: true
  topic: Gradient fields
  stem: 'A vector field $\mathbf F$ is called conservative if'
  choices: ['$\mathbf F = \nabla f$ for some scalar function $f$', '$|\mathbf F|$ is constant', '$\mathbf F$ is perpendicular to its position vector', '$\mathbf F(\mathbf 0) = \mathbf 0$']
  answer: 0
  explanation: |-
    Conservative means it is a gradient field; $f$ is then a potential function for $\mathbf F$.
- id: mv-q-2806
  lesson: mv-vector-fields
  topic: Vector fields
  stem: 'The gravitational field $\mathbf F = -\dfrac{mMG}{|\mathbf x|^3}\mathbf x$ has which properties?'
  choices: ['Points away from the origin, magnitude proportional to $|\mathbf x|$', 'Points toward the origin, magnitude proportional to $\dfrac{1}{|\mathbf x|^2}$', 'Swirls around the origin', 'Points toward the origin, magnitude proportional to $\dfrac{1}{|\mathbf x|^3}$']
  answer: 1
  explanation: |-
    The minus sign makes it point inward. Its magnitude is $\dfrac{mMG}{|\mathbf x|^3}|\mathbf x| = \dfrac{mMG}{|\mathbf x|^2}$: an inverse-square law.
- id: mv-q-2807
  lesson: mv-vector-fields
  topic: Gradient fields
  stem: 'Which function is a potential for $\mathbf F = \langle 2x + y,\, x + 2y\rangle$?'
  choices: ['$x^2 + y^2$', '$2xy$', '$x^2 + xy + y^2$', '$x^2y + xy^2$']
  answer: 2
  explanation: |-
    $\partial_x(x^2 + xy + y^2) = 2x + y$ and $\partial_y(x^2 + xy + y^2) = x + 2y$. ✓ The first choice misses the $xy$ term.
- id: mv-q-2808
  lesson: mv-vector-fields
  module_quiz: true
  topic: Vector fields
  stem: 'What are the flow lines of $\mathbf F = \langle -y, x\rangle$?'
  choices: ['Rays from the origin', 'Parabolas', 'Horizontal lines', 'Circles centered at the origin']
  answer: 3
  explanation: |-
    $\mathbf r(t) = \langle R\cos t, R\sin t\rangle$ has $\mathbf r' = \langle -R\sin t, R\cos t\rangle = \mathbf F(\mathbf r(t))$, so particles travel around circles.
- id: mv-q-2809
  lesson: mv-vector-fields
  topic: Gradient fields
  stem: 'On a contour map of $f$, how do the arrows of $\nabla f$ sit relative to the level curves?'
  choices: ['Perpendicular to them, pointing toward higher values', 'Tangent to them', 'Perpendicular, pointing toward lower values', 'At a $45^\circ$ angle']
  answer: 0
  explanation: |-
    The gradient is orthogonal to level curves and points in the direction of steepest increase.
- id: mv-q-2810
  lesson: mv-vector-fields
  topic: Vector fields
  stem: 'Find $|\mathbf F(3, 4)|$ for $\mathbf F = \langle -y, x\rangle$.'
  choices: ['$7$', '$5$', '$1$', '$25$']
  answer: 1
  explanation: |-
    $\mathbf F(3, 4) = \langle -4, 3\rangle$, of length 5: the distance from the origin.
- id: mv-q-2811
  lesson: mv-vector-fields
  topic: Vector fields
  stem: 'Which field satisfies $\mathbf F(1, 0) = \langle 0, 1\rangle$ and $\mathbf F(0, 1) = \langle -1, 0\rangle$?'
  choices: ['$\langle x, y\rangle$', '$\langle y, x\rangle$', '$\langle -y, x\rangle$', '$\langle y, -x\rangle$']
  answer: 2
  explanation: |-
    $\langle -y, x\rangle$ gives $\langle 0, 1\rangle$ at $(1, 0)$ and $\langle -1, 0\rangle$ at $(0, 1)$. $\langle y, -x\rangle$ rotates clockwise instead.

- id: mv-q-2901
  lesson: mv-line-integrals
  module_quiz: true
  topic: Scalar line integrals
  stem: 'Evaluate $\int_C xy^2\,ds$, where $C$ is the quarter circle $x^2 + y^2 = 4$ in the first quadrant.'
  choices: ['$\tfrac83$', '$\tfrac{32}{3}$', '$\tfrac43$', '$\tfrac{16}{3}$']
  answer: 3
  explanation: |-
    With $\mathbf r = \langle 2\cos t, 2\sin t\rangle$, $|\mathbf r'| = 2$: $\int_0^{\pi/2}(2\cos t)(4\sin^2t)(2)\,dt = 16\cdot\tfrac13$.
    $\tfrac83$ forgets the factor $|\mathbf r'| = 2$.
- id: mv-q-2902
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'Find the work done by $\mathbf F = \langle x^2, xy\rangle$ along $y = x^2$ from $(0,0)$ to $(1,1)$.'
  choices: ['$\tfrac{11}{15}$', '$\tfrac23$', '$\tfrac{7}{12}$', '$1$']
  answer: 0
  explanation: |-
    $\mathbf r = \langle t, t^2\rangle$: $\mathbf F(\mathbf r) = \langle t^2, t^3\rangle$, $\mathbf r' = \langle 1, 2t\rangle$, so $\int_0^1(t^2 + 2t^4)\,dt = \tfrac13 + \tfrac25 = \tfrac{11}{15}$.
- id: mv-q-2903
  lesson: mv-line-integrals
  module_quiz: true
  topic: Work and vector line integrals
  stem: 'The same field $\mathbf F = \langle x^2, xy\rangle$ along the straight segment from $(0,0)$ to $(1,1)$ does work $\tfrac23$. What does this show?'
  choices: ['A computation error, since work never depends on the path', 'The line integral of this field depends on the path, so the field is not conservative', 'The field is conservative', 'Straight paths always require less work']
  answer: 1
  explanation: |-
    Two paths with the same endpoints gave $\tfrac{11}{15}$ and $\tfrac23$. Conservative fields have path-independent integrals, so this field is not conservative.
- id: mv-q-2904
  lesson: mv-line-integrals
  module_quiz: true
  topic: Work and vector line integrals
  stem: 'If $\int_C\mathbf F\cdot d\mathbf r = 5$, what is $\int_{-C}\mathbf F\cdot d\mathbf r$, along the same curve traversed backward?'
  choices: ['$5$', '$0$', '$-5$', '$\tfrac15$']
  answer: 2
  explanation: |-
    Reversing direction reverses $\mathbf r'(t)$ and flips the sign of the vector line integral.
- id: mv-q-2905
  lesson: mv-line-integrals
  topic: Scalar line integrals
  stem: 'If $\int_C f\,ds = 5$, what is the scalar line integral of $f$ along $C$ traversed backward?'
  choices: ['$-5$', '$0$', 'It depends on the parametrization', '$5$']
  answer: 3
  explanation: |-
    $ds = |\mathbf r'(t)|\,dt$ is always positive: arc length does not care about direction, so the scalar line integral is unchanged.
- id: mv-q-2906
  lesson: mv-line-integrals
  topic: Scalar line integrals
  stem: 'Evaluate $\int_C 1\,ds$ along the segment from $(0, 0)$ to $(3, 4)$.'
  choices: ['$5$', '$7$', '$12$', '$25$']
  answer: 0
  explanation: |-
    With $f = 1$ the scalar line integral is the length of the curve: $\sqrt{9 + 16} = 5$.
- id: mv-q-2907
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'Evaluate $\int_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle y, z, x\rangle$ along $\mathbf r(t) = \langle\cos t, \sin t, t\rangle$, $0 \le t \le 2\pi$.'
  choices: ['$\pi$', '$-\pi$', '$0$', '$2\pi$']
  answer: 1
  explanation: |-
    $\mathbf F(\mathbf r)\cdot\mathbf r' = \langle\sin t, t, \cos t\rangle\cdot\langle -\sin t, \cos t, 1\rangle = -\sin^2t + t\cos t + \cos t$. Over $[0, 2\pi]$ these integrate to $-\pi + 0 + 0$.
- id: mv-q-2908
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'How much work does the radial field $\mathbf F = \langle x, y\rangle$ do on a particle moving once around the circle $x^2 + y^2 = 9$?'
  choices: ['$18\pi$', '$9\pi$', '$0$', '$-18\pi$']
  answer: 2
  explanation: |-
    The field is perpendicular to the circle at every point, so its tangential component, and the work, is 0. (It is also conservative: $\nabla\tfrac12(x^2 + y^2)$.)
- id: mv-q-2909
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'Evaluate $\int_C y\,dx + x\,dy$ along $\mathbf r(t) = \langle t, t^2\rangle$, $0 \le t \le 1$.'
  choices: ['$\tfrac12$', '$\tfrac43$', '$2$', '$1$']
  answer: 3
  explanation: |-
    $dx = dt$, $dy = 2t\,dt$: $\int_0^1(t^2 + t\cdot2t)\,dt = \int_0^1 3t^2\,dt = 1$. (Also $y\,dx + x\,dy = d(xy)$, and $xy$ goes from 0 to 1.)
- id: mv-q-2910
  lesson: mv-line-integrals
  topic: Scalar line integrals
  stem: 'A wire along the segment from $(0, 0)$ to $(1, 1)$ has density $\rho = x + y$. Find its mass.'
  choices: ['$\sqrt2$', '$1$', '$2$', '$\tfrac{\sqrt2}{2}$']
  answer: 0
  explanation: |-
    $\mathbf r = \langle t, t\rangle$, $|\mathbf r'| = \sqrt2$: $\int_0^1 2t\cdot\sqrt2\,dt = \sqrt2$. Forgetting $|\mathbf r'|$ gives 1.
- id: mv-q-2911
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'Which parametrizes the segment from $(1, 2)$ to $(4, 6)$ for $0 \le t \le 1$?'
  choices: ['$\langle 4 - 3t,\, 6 - 4t\rangle$', '$\langle 1 + 3t,\, 2 + 4t\rangle$', '$\langle 1 + 4t,\, 2 + 6t\rangle$', '$\langle 3t,\, 4t\rangle$']
  answer: 1
  explanation: |-
    $(1 - t)\langle 1, 2\rangle + t\langle 4, 6\rangle = \langle 1 + 3t, 2 + 4t\rangle$. The first choice runs backward, from $(4,6)$ to $(1,2)$.
- id: mv-q-2912
  lesson: mv-line-integrals
  module_quiz: true
  topic: Work and vector line integrals
  stem: 'Evaluate $\oint_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle y, -x\rangle$ once counterclockwise around the unit circle.'
  choices: ['$2\pi$', '$0$', '$-2\pi$', '$\pi$']
  answer: 2
  explanation: |-
    $\mathbf r = \langle\cos t, \sin t\rangle$: $\mathbf F\cdot\mathbf r' = \langle\sin t, -\cos t\rangle\cdot\langle -\sin t, \cos t\rangle = -1$, so the integral is $-2\pi$. The field rotates clockwise, against the direction of travel.

- id: mv-q-3001
  lesson: mv-conservative
  module_quiz: true
  topic: Fundamental theorem for line integrals
  stem: 'The Fundamental Theorem for Line Integrals states that $\int_C\nabla f\cdot d\mathbf r$ equals'
  choices: ['$f(\text{start}) - f(\text{end})$', '$0$ for every curve', '$|\nabla f|$ times the length of $C$', '$f(\text{end}) - f(\text{start})$']
  answer: 3
  explanation: |-
    It is the total change in $f$ along the curve. It is zero only for closed curves.
- id: mv-q-3002
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'For $\mathbf F = \langle 3 + 2xy,\, x^2 - 3y^2\rangle$, evaluate $\int_C\mathbf F\cdot d\mathbf r$ along any path from $(1, 0)$ to $(2, 1)$.'
  choices: ['$6$', '$9$', '$3$', '$-6$']
  answer: 0
  explanation: |-
    $f = 3x + x^2y - y^3$ is a potential. $f(2,1) - f(1,0) = 9 - 3 = 6$. $9$ is $f(2,1)$ alone; $-6$ subtracts in the wrong order.
- id: mv-q-3003
  lesson: mv-conservative
  module_quiz: true
  topic: Conservative fields and potentials
  stem: 'On a simply connected region, $\mathbf F = \langle P, Q\rangle$ (with continuous partials) is conservative exactly when'
  choices: ['$P_x = Q_y$', '$P_y = Q_x$', '$P = Q$', '$P_x + Q_y = 0$']
  answer: 1
  explanation: |-
    If $\mathbf F = \nabla f$ then $P_y = f_{xy} = f_{yx} = Q_x$, and on a region without holes the converse holds too. $P_x + Q_y$ is the divergence, a different quantity.
- id: mv-q-3004
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'Why is $\mathbf F = \langle -y, x\rangle$ not conservative?'
  choices: ['Because it is not continuous', 'Because $|\mathbf F|$ is not constant', 'Because $P_y = -1$ but $Q_x = 1$', 'Because it is zero at the origin']
  answer: 2
  explanation: |-
    The test fails: $\partial_y(-y) = -1 \ne 1 = \partial_x(x)$. Its circulation around the unit circle is $2\pi \ne 0$.
- id: mv-q-3005
  lesson: mv-conservative
  module_quiz: true
  topic: Conservative fields and potentials
  stem: 'Find a potential function for $\mathbf F = \langle 3 + 2xy,\, x^2 - 3y^2\rangle$.'
  choices: ['$3x + x^2y$', '$3 + x^2y - y^3$', '$3x + 2x^2y - 3y^3$', '$3x + x^2y - y^3$']
  answer: 3
  explanation: |-
    Integrate $P$ in $x$: $3x + x^2y + g(y)$. Matching $f_y = x^2 + g'(y) = x^2 - 3y^2$ gives $g = -y^3$. The first choice misses $g(y)$.
- id: mv-q-3006
  lesson: mv-conservative
  topic: Fundamental theorem for line integrals
  stem: 'If $\mathbf F$ is conservative on an open connected region containing the closed curve $C$, what is $\oint_C\mathbf F\cdot d\mathbf r$?'
  choices: ['$0$', 'the area enclosed by $C$', '$2\pi$', 'the length of $C$']
  answer: 0
  explanation: |-
    A closed curve ends where it starts, so $f(\text{end}) - f(\text{start}) = 0$.
- id: mv-q-3007
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'For $\mathbf F = \langle 2xz + y,\; x + z^2,\; x^2 + 2yz\rangle$, find the work from $(0,0,0)$ to $(1,2,3)$.'
  choices: ['$14$', '$23$', '$20$', '$32$']
  answer: 1
  explanation: |-
    A potential is $f = x^2z + xy + yz^2$. Work $= f(1,2,3) - f(0,0,0) = 3 + 2 + 18 = 23$.
- id: mv-q-3008
  lesson: mv-conservative
  module_quiz: true
  topic: Conservative fields and potentials
  stem: 'When finding $f$ from $f_x = P(x, y)$ by integrating in $x$, the "constant" of integration is'
  choices: ['always 0', 'a number that must be found from $P$', 'a function of $y$, found by matching $f_y$ to $Q$', 'a function of $x$']
  answer: 2
  explanation: |-
    Anything depending only on $y$ has zero $x$-derivative, so the general antiderivative is $\int P\,dx + g(y)$, and $g$ is determined by $f_y = Q$.
- id: mv-q-3009
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'The field $\mathbf F = \left\langle\dfrac{-y}{x^2 + y^2},\, \dfrac{x}{x^2 + y^2}\right\rangle$ satisfies $P_y = Q_x$ wherever it is defined, yet its circulation around the unit circle is $2\pi$. Why is there no contradiction?'
  choices: ['The test only works for polynomials', 'The circulation was computed incorrectly; it is 0', 'The field is conservative after all', 'Its domain (the plane minus the origin) is not simply connected, so the test does not apply']
  answer: 3
  explanation: |-
    The test $P_y = Q_x \Rightarrow$ conservative requires a region with no holes. The unit circle encloses the origin, where the field is undefined.
- id: mv-q-3010
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'Is $\mathbf F = \langle y^2,\, 2xy\rangle$ conservative? If so, give a potential.'
  choices: ['Yes; $f = xy^2$', 'Yes; $f = y^2 + 2xy$', 'No, since $P_x \ne Q_y$', 'Yes; $f = x^2y$']
  answer: 0
  explanation: |-
    $P_y = 2y = Q_x$ on the whole plane. $f = xy^2$ has $f_x = y^2$, $f_y = 2xy$. ✓
- id: mv-q-3011
  lesson: mv-conservative
  topic: Conservative fields and potentials
  stem: 'Which field is conservative on the plane?'
  choices: ['$\langle y, -x\rangle$', '$\langle x + y,\, x - y\rangle$', '$\langle x^2, xy\rangle$', '$\langle xy, x\rangle$']
  answer: 1
  explanation: |-
    For $\langle x + y, x - y\rangle$: $P_y = 1 = Q_x$ (potential $\tfrac{x^2}{2} + xy - \tfrac{y^2}{2}$). The others: $-1$ vs $1$; $0$ vs $y$; $x$ vs $1$.
- id: mv-q-3012
  lesson: mv-conservative
  module_quiz: true
  topic: Fundamental theorem for line integrals
  stem: 'If $f(A) = 2$ and $f(B) = 7$, what is $\int_C\nabla f\cdot d\mathbf r$ for a path $C$ from $A$ to $B$?'
  choices: ['$9$', '$-5$', '$5$', 'It depends on the path']
  answer: 2
  explanation: |-
    $f(B) - f(A) = 7 - 2 = 5$, for every path.
- id: mv-q-3013
  lesson: mv-conservative
  topic: Fundamental theorem for line integrals
  stem: 'For a particle moving under a conservative force, which quantity stays constant?'
  choices: ['Its speed', 'Its kinetic energy', 'Its potential energy', 'The sum of its kinetic and potential energy']
  answer: 3
  explanation: |-
    Work equals the gain in kinetic energy and also the loss in potential energy, so $K + U$ is constant: conservation of energy.

- id: mv-q-3101
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  stem: 'Green''s theorem states that for a positively oriented simple closed curve $C$ bounding $D$, $\oint_C P\,dx + Q\,dy$ equals'
  choices: ['$\iint_D\left(Q_x - P_y\right)dA$', '$\iint_D\left(P_y - Q_x\right)dA$', '$\iint_D\left(P_x + Q_y\right)dA$', '$\iint_D(P + Q)\,dA$']
  answer: 0
  explanation: |-
    The integrand is $\tfrac{\partial Q}{\partial x} - \tfrac{\partial P}{\partial y}$, the local rotation. $P_x + Q_y$ belongs to the flux form.
- id: mv-q-3102
  lesson: mv-green
  topic: Green's theorem
  stem: 'Evaluate $\oint_C xy\,dx + x^2\,dy$ counterclockwise around the rectangle $[0, 2]\times[0, 1]$.'
  choices: ['$4$', '$2$', '$0$', '$-2$']
  answer: 1
  explanation: |-
    $Q_x - P_y = 2x - x = x$, and $\iint_D x\,dA = \int_0^1\int_0^2x\,dx\,dy = 2$. A direct computation side by side gives $0 + 4 - 2 + 0 = 2$ as well.
- id: mv-q-3103
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  stem: 'Evaluate $\oint_C(2y + e^{x^2})\,dx + (5x - \cos(y^3))\,dy$ counterclockwise around $x^2 + y^2 = 4$.'
  choices: ['$28\pi$', '$7\pi$', '$12\pi$', '$3\pi$']
  answer: 2
  explanation: |-
    $Q_x - P_y = 5 - 2 = 3$, so the integral is $3\cdot\text{Area} = 3\cdot4\pi = 12\pi$. Adding instead of subtracting gives $28\pi$.
- id: mv-q-3104
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  stem: 'Which line integral gives the area enclosed by a positively oriented curve $C$?'
  choices: ['$\oint_C x\,dx + y\,dy$', '$\oint_C y\,dy$', '$\oint_C y\,dx$', '$\tfrac12\oint_C x\,dy - y\,dx$']
  answer: 3
  explanation: |-
    With $P = -\tfrac y2$, $Q = \tfrac x2$: $Q_x - P_y = \tfrac12 + \tfrac12 = 1$, so the integral is $\iint_D 1\,dA$. ($\oint y\,dx$ gives minus the area.)
- id: mv-q-3105
  lesson: mv-green
  topic: Green's theorem
  stem: 'The positive orientation of a simple closed curve is'
  choices: ['counterclockwise, keeping the region on the left', 'clockwise, keeping the region on the right', 'either direction', 'the direction in which $x$ increases']
  answer: 0
  explanation: |-
    Walking along the boundary with the region on your left means counterclockwise around the outer boundary.
- id: mv-q-3106
  lesson: mv-green
  topic: Green's theorem
  stem: 'Evaluate $\oint_C x\,dy$ counterclockwise around the circle $x^2 + y^2 = 9$.'
  choices: ['$3\pi$', '$9\pi$', '$18\pi$', '$0$']
  answer: 1
  explanation: |-
    $P = 0$, $Q = x$: $Q_x - P_y = 1$, so the integral is the area $9\pi$.
- id: mv-q-3107
  lesson: mv-green
  topic: Green's theorem
  stem: 'If $C$ is traversed clockwise, then $\oint_C P\,dx + Q\,dy$ equals'
  choices: ['$\iint_D(Q_x - P_y)\,dA$', '$0$', '$-\iint_D(Q_x - P_y)\,dA$', '$\iint_D(Q_x + P_y)\,dA$']
  answer: 2
  explanation: |-
    Reversing orientation flips the sign of the line integral.
- id: mv-q-3108
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  stem: 'Evaluate $\oint_C y\,dx - x\,dy$ counterclockwise around the unit circle.'
  choices: ['$2\pi$', '$\pi$', '$0$', '$-2\pi$']
  answer: 3
  explanation: |-
    $P = y$, $Q = -x$: $Q_x - P_y = -1 - 1 = -2$, times area $\pi$ gives $-2\pi$.
- id: mv-q-3109
  lesson: mv-green
  topic: Green's theorem
  stem: 'Evaluate $\oint_C(x^2 - y)\,dx + (x + y^2)\,dy$ counterclockwise around the unit square $[0, 1]\times[0, 1]$.'
  choices: ['$2$', '$1$', '$0$', '$4$']
  answer: 0
  explanation: |-
    $Q_x - P_y = 1 - (-1) = 2$, and the area is 1.
- id: mv-q-3110
  lesson: mv-green
  topic: Green's theorem
  stem: 'Evaluate $\oint_C(e^x + y^2)\,dx + (x^2 + \cos y)\,dy$ counterclockwise around the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$.'
  choices: ['$\tfrac13$', '$0$', '$\tfrac16$', '$1$']
  answer: 1
  explanation: |-
    $Q_x - P_y = 2x - 2y$. Over this triangle $\iint x\,dA = \iint y\,dA = \tfrac16$ (it is symmetric in $x$ and $y$), so the integral is $2\cdot\tfrac16 - 2\cdot\tfrac16 = 0$.
- id: mv-q-3111
  lesson: mv-green
  topic: Green's theorem
  stem: 'Why can''t Green''s theorem be applied directly to $\mathbf F = \left\langle\tfrac{-y}{x^2+y^2}, \tfrac{x}{x^2+y^2}\right\rangle$ on the unit disk?'
  choices: ['Because the unit circle is not closed', 'Because $Q_x - P_y$ is not constant', 'Because $P$ and $Q$ are undefined at the origin, inside the disk', 'Because the curve is not smooth']
  answer: 2
  explanation: |-
    The theorem needs continuous partials on a region containing $D$. Cutting out a small circle around the origin (a region with a hole) is the fix.
- id: mv-q-3112
  lesson: mv-green
  topic: Green's theorem
  stem: 'In its flux form, Green''s theorem says the outward flux $\oint_C\mathbf F\cdot\mathbf n\,ds$ of $\mathbf F = \langle P, Q\rangle$ equals'
  choices: ['$\iint_D(Q_x - P_y)\,dA$', '$\oint_C P\,dx + Q\,dy$', '$0$ always', '$\iint_D(P_x + Q_y)\,dA$']
  answer: 3
  explanation: |-
    Outward flux equals the integral of the divergence $P_x + Q_y$: the two-dimensional Divergence theorem.
