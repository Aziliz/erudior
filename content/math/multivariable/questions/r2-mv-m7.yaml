# Round 2 questions for mv-m7 (Vector fields and line integrals)
# Lesson 29: Vector fields
- id: mv-m7-r2-q01
  lesson: mv-vector-fields
  module_quiz: true
  topic: Gradient fields
  type: label
  stem: 'The picture shows level curves of $f(x, y) = x^2 + 2y^2$ with some arrows of its gradient field. Name the numbered parts.'
  image: {src: images/mv-m7-gradient-contours-blank.svg, alt: 'Three nested ellipses around a dot at the center. Short arrows start on the ellipses and point outward, each crossing its ellipse at a right angle. A curve starts at the center dot and bends outward, crossing the ellipses. Four parts are numbered.'}
  labels:
    - {x: 15.3, y: 51.2, text: Level curve of f}
    - {x: 23.2, y: 63.1, text: Gradient vector}
    - {x: 67.0, y: 43.6, text: Flow line of the gradient field}
    - {x: 50.0, y: 51.2, text: 'Minimum of f, where the gradient is zero'}
  distractors: [Tangent line to a level curve, Saddle point]
  explanation: 'The ellipses $x^2 + 2y^2 = c$ are level curves. The short arrows are values of $\nabla f = \langle 2x, 4y\rangle$; each crosses its level curve at a right angle and points toward larger $f$. The curve that every arrow is tangent to is a flow line of $\nabla f$, the path of steepest ascent. At the center, $\nabla f = \mathbf 0$: the minimum of $f$. No arrow runs along a level curve, so none is a tangent line, and $f$ has no saddle point.'
- id: mv-m7-r2-q02
  lesson: mv-vector-fields
  topic: Vector fields
  type: text
  stem: 'For $\mathbf F(x, y) = \langle xy,\; x - y\rangle$, $\mathbf F(2, 3) = \langle$ ___ , ___ $\rangle$.'
  accept:
    - ['6']
    - ['-1']
  explanation: 'Substitute $x = 2$, $y = 3$ into each component: $P = 2\cdot3 = 6$ and $Q = 2 - 3 = -1$. So $\mathbf F(2, 3) = \langle 6, -1\rangle$, an arrow drawn starting at the point $(2, 3)$.'
- id: mv-m7-r2-q03
  lesson: mv-vector-fields
  module_quiz: true
  topic: Vector fields
  type: match
  stem: 'Match each vector field to the description of its picture.'
  pairs:
    - ['$\langle -y,\, x\rangle$', Counterclockwise rotation about the origin]
    - ['$\langle y,\, -x\rangle$', Clockwise rotation about the origin]
    - ['$\langle x,\, y\rangle$', 'Radial, pointing away from the origin']
    - ['$\langle -x,\, -y\rangle$', 'Radial, pointing toward the origin']
    - ['$\langle 1,\, 0\rangle$', Constant arrows all pointing right]
  distractors: [Constant arrows all pointing up]
  explanation: 'At $(1, 0)$, $\langle -y, x\rangle = \langle 0, 1\rangle$ points up, so it turns counterclockwise; $\langle y, -x\rangle = \langle 0, -1\rangle$ points down there, so it turns clockwise. $\langle x, y\rangle$ is the position vector, pointing outward, and its negative points inward. $\langle 1, 0\rangle$ is the same arrow, $\mathbf i$, at every point.'
- id: mv-m7-r2-q04
  lesson: mv-vector-fields
  topic: Gradient fields
  stem: 'Which fields are gradient fields on the whole plane? Select all that apply.'
  choices: ['$\langle 2x,\, 2y\rangle$', '$\langle y,\, x\rangle$', '$\langle -y,\, x\rangle$', '$\langle x^2,\, xy\rangle$']
  answer: [0, 1]
  explanation: '$\langle 2x, 2y\rangle = \nabla(x^2 + y^2)$ and $\langle y, x\rangle = \nabla(xy)$. For $\langle -y, x\rangle$, integrating $f_x = -y$ gives $f = -xy + g(y)$, so $f_y = -x + g''(y)$, which can never equal $x$. For $\langle x^2, xy\rangle$, $f = \tfrac13x^3 + g(y)$ gives $f_y = g''(y)$, which cannot equal $xy$. (Lesson 31 gives a quicker test: $P_y = Q_x$.)'
- id: mv-m7-r2-q05
  lesson: mv-vector-fields
  topic: Vector fields
  type: text
  stem: 'A curve $\mathbf r(t)$ whose velocity always equals the field, $\mathbf r''(t) = \mathbf F(\mathbf r(t))$, is called a ___ of $\mathbf F$.'
  accept: [flow line, flow lines, flowline, flowlines, streamline, streamlines, stream line, stream lines, integral curve, integral curves]
  explanation: 'A flow line (or streamline) is the path a particle follows when its velocity is given by the field. On a picture of the field, the arrows are tangent to the flow lines; for $\langle -y, x\rangle$ the flow lines are circles about the origin.'
# Lesson 30: Line integrals
- id: mv-m7-r2-q06
  lesson: mv-line-integrals
  module_quiz: true
  topic: Work and vector line integrals
  type: label
  stem: 'A force acts on a particle moving along a path. Name the numbered parts.'
  image: {src: images/mv-m7-tangential-blank.svg, alt: 'A curve with an arrow at its end. At one point, a short red arrow points along the curve. At a second point, a blue arrow points up and to the right; a green arrow along the curve and a dashed arrow perpendicular to the curve form the sides of a rectangle whose diagonal is the blue arrow. Five parts are numbered.'}
  labels:
    - {x: 24.1, y: 62.7, text: Unit tangent vector T}
    - {x: 67.8, y: 31.7, text: Force F}
    - {x: 66.0, y: 46.5, text: Tangential component of F}
    - {x: 55.9, y: 30.0, text: Normal component of F}
    - {x: 83.3, y: 66.9, text: 'Path C, in its direction of travel'}
  distractors: [Binormal vector B, Position vector r]
  explanation: 'The force $\mathbf F$ (blue) splits into a part along the path, $(\mathbf F\cdot\mathbf T)\mathbf T$, and a part perpendicular to it. The short red arrow is the unit tangent $\mathbf T$. Only the tangential part does work, which is why $\int_C\mathbf F\cdot d\mathbf r = \int_C\mathbf F\cdot\mathbf T\,ds$.'
- id: mv-m7-r2-q07
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  type: order
  stem: 'Put the steps for evaluating $\int_C\mathbf F\cdot d\mathbf r$ in order.'
  items:
    - 'Parametrize $C$ as $\mathbf r(t)$, $a \le t \le b$, in the direction of travel'
    - 'Find $\mathbf r''(t)$ and $\mathbf F(\mathbf r(t))$'
    - 'Form the dot product $\mathbf F(\mathbf r(t))\cdot\mathbf r''(t)$'
    - 'Integrate the result from $t = a$ to $t = b$'
  explanation: 'Everything has to be written in terms of $t$ first, so the parametrization comes first. Then $\mathbf r''(t)$ and $\mathbf F(\mathbf r(t))$ are dotted to give a function of $t$, which is integrated over the parameter interval.'
- id: mv-m7-r2-q08
  lesson: mv-line-integrals
  topic: Scalar line integrals
  type: text
  stem: 'A wire lies along the segment from $(0, 0)$ to $(3, 4)$ and has density $\rho(x, y) = x$. Its mass $\int_C x\,ds$ is ___ . (Give only the number.)'
  accept: ['7.5', '15/2']
  explanation: 'Take $\mathbf r(t) = \langle 3t, 4t\rangle$, $0 \le t \le 1$, so $|\mathbf r''(t)| = 5$. Then $\int_C x\,ds = \int_0^1 3t\cdot5\,dt = \tfrac{15}{2} = 7.5$. Leaving out $|\mathbf r''(t)|$ gives $1.5$.'
- id: mv-m7-r2-q09
  lesson: mv-line-integrals
  module_quiz: true
  topic: Work and vector line integrals
  stem: 'Which statements are true? Select all that apply.'
  choices: ['Reversing the direction of $C$ changes the sign of $\int_C\mathbf F\cdot d\mathbf r$', 'Reversing the direction of $C$ changes the sign of $\int_C f\,ds$', 'A force that is perpendicular to the path at every point does zero work', '$\int_C\mathbf F\cdot d\mathbf r$ has the same value along every path between two given points']
  answer: [0, 2]
  explanation: 'A vector line integral changes sign with direction, because $\mathbf r''(t)$ flips. A scalar line integral uses $|\mathbf r''(t)|$ and so does not. If $\mathbf F\perp\mathbf T$ everywhere, then $\mathbf F\cdot\mathbf T = 0$ and the work is 0. Path independence holds only for conservative fields; $\langle x^2, xy\rangle$ gives $\tfrac{11}{15}$ and $\tfrac23$ on two paths with the same ends.'
- id: mv-m7-r2-q10
  lesson: mv-line-integrals
  topic: Work and vector line integrals
  stem: 'Find $\int_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle -y,\, x\rangle$ along the quarter circle $\mathbf r(t) = \langle\cos t, \sin t\rangle$, $0 \le t \le \tfrac{\pi}{2}$.'
  choices: ['$0$', '$1$', '$\pi$', '$\tfrac{\pi}{2}$']
  answer: 3
  explanation: '$\mathbf F(\mathbf r(t)) = \langle -\sin t, \cos t\rangle$ and $\mathbf r''(t) = \langle -\sin t, \cos t\rangle$, so the dot product is $\sin^2 t + \cos^2 t = 1$ and the integral is $\int_0^{\pi/2}1\,dt = \tfrac{\pi}{2}$. The field points along the circle here, not across it, so the work is not 0; $\pi$ would be a half circle.'
# Lesson 31: Conservative fields and the fundamental theorem
- id: mv-m7-r2-q11
  lesson: mv-conservative
  module_quiz: true
  topic: Conservative fields and potentials
  type: order
  stem: 'A field $\mathbf F = \langle P, Q\rangle$ is known to be conservative. Put the steps for finding a potential $f$ in order.'
  items:
    - 'Integrate $P$ with respect to $x$, adding an unknown function $g(y)$'
    - 'Differentiate that result with respect to $y$'
    - 'Set the derivative equal to $Q$ and solve for $g''(y)$'
    - 'Integrate $g''(y)$ to find $g(y)$'
    - 'Write out $f$ and check that $\nabla f = \mathbf F$'
  explanation: 'Integrating $P = f_x$ in $x$ gives $f$ up to a function of $y$. Its $y$-derivative must equal $Q = f_y$, which pins down $g''(y)$; integrating gives $g$. A final check of both partial derivatives catches slips.'
- id: mv-m7-r2-q12
  lesson: mv-conservative
  topic: Fundamental theorem for line integrals
  type: text
  stem: 'The field $\mathbf F = \langle 2xy,\; x^2 + 1\rangle$ has potential $f = x^2y + y$. Along any path from $(1, 1)$ to $(2, 3)$, $\int_C\mathbf F\cdot d\mathbf r =$ ___'
  accept: ['13']
  explanation: 'By the fundamental theorem, the integral is $f(2, 3) - f(1, 1) = (12 + 3) - (1 + 1) = 13$. Subtracting in the other order gives $-13$.'
- id: mv-m7-r2-q13
  lesson: mv-conservative
  topic: Conservative fields and potentials
  type: match
  stem: 'Classify each region.'
  pairs:
    - ['The disk $x^2 + y^2 < 4$', Simply connected]
    - ['The upper half-plane $y > 0$', Simply connected]
    - ['The annulus $1 < x^2 + y^2 < 4$', Not simply connected]
    - ['The plane with the origin removed', Not simply connected]
    - ['Two disks that do not touch', Not connected]
  explanation: 'A disk and a half-plane are connected and have no holes: every loop in them can be shrunk to a point. An annulus and the punctured plane have a hole, and a loop around it encloses points that are not in the region. Two separate disks are not even connected, so they cannot be simply connected.'
- id: mv-m7-r2-q14
  lesson: mv-conservative
  module_quiz: true
  topic: Conservative fields and potentials
  stem: 'Which fields are conservative on the whole plane? Select all that apply.'
  choices: ['$\langle e^y,\, xe^y\rangle$', '$\langle y\cos x,\, \sin x\rangle$', '$\langle x + y,\, x - y\rangle$', '$\langle xy,\, xy\rangle$']
  answer: [0, 1, 2]
  explanation: 'The plane is simply connected, so test $P_y = Q_x$. $\langle e^y, xe^y\rangle$: $e^y = e^y$ (potential $xe^y$). $\langle y\cos x, \sin x\rangle$: $\cos x = \cos x$ (potential $y\sin x$). $\langle x + y, x - y\rangle$: $1 = 1$ (potential $\tfrac12x^2 + xy - \tfrac12y^2$). $\langle xy, xy\rangle$: $P_y = x$ but $Q_x = y$, so it is not conservative.'
- id: mv-m7-r2-q15
  lesson: mv-conservative
  topic: Fundamental theorem for line integrals
  stem: 'Evaluate $\int_C\mathbf F\cdot d\mathbf r$ for $\mathbf F = \langle 2x + y,\; x\rangle$, where $C$ is a complicated spiral from $(0, 0)$ to $(1, 2)$.'
  choices: ['$2$', '$3$', '$5$', '$0$']
  answer: 1
  explanation: '$P_y = 1 = Q_x$, so $\mathbf F$ is conservative and the path does not matter. A potential is $f = x^2 + xy$ (check: $f_x = 2x + y$, $f_y = x$). The integral is $f(1, 2) - f(0, 0) = 1 + 2 = 3$. Leaving out the $x^2$ term gives 2, and 0 would be right only for a closed curve.'
# Lesson 32: Green's theorem
- id: mv-m7-r2-q16
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  type: label
  stem: 'The picture shows a region $D$ with a hole, oriented for Green''s theorem. Name the numbered parts.'
  image: {src: images/mv-m7-annulus-blank.svg, alt: 'A shaded ring between a large circle and a small circle, with a white disk in the middle containing a dot. Arrows on the large circle go counterclockwise; arrows on the small circle go clockwise. Four parts are numbered.'}
  labels:
    - {x: 55.4, y: 84.6, text: 'Outer boundary, counterclockwise'}
    - {x: 32.6, y: 40.0, text: 'Inner boundary, clockwise'}
    - {x: 21.4, y: 55.0, text: Region D}
    - {x: 41.1, y: 55.5, text: 'Hole, not part of D'}
  distractors: ['Inner boundary, counterclockwise']
  explanation: 'For a region with a hole, the boundary has two pieces, each oriented so that $D$ is on your left as you walk along it. That makes the outer circle counterclockwise and the inner circle clockwise. The white disk inside is the hole, which is not part of $D$.'
- id: mv-m7-r2-q17
  lesson: mv-green
  topic: Green's theorem
  type: text
  stem: 'Use Green''s theorem: $\oint_C 3y\,dx + 7x\,dy$, counterclockwise around the boundary of the rectangle $[0, 3]\times[0, 2]$, equals ___ .'
  accept: ['24']
  explanation: 'Here $P = 3y$ and $Q = 7x$, so $Q_x - P_y = 7 - 3 = 4$. The integral is $4$ times the area, $4\cdot6 = 24$. Using $P_y - Q_x$ gives $-24$.'
- id: mv-m7-r2-q18
  lesson: mv-green
  topic: Green's theorem
  type: order
  stem: 'Put the steps for evaluating $\oint_C P\,dx + Q\,dy$ with Green''s theorem in order.'
  items:
    - 'Check that $C$ is a simple closed curve and that $P$, $Q$ have continuous partials on $D$'
    - 'Compute $Q_x - P_y$'
    - 'Set up the double integral of $Q_x - P_y$ over $D$'
    - 'Evaluate the double integral, changing the sign if $C$ runs clockwise'
  explanation: 'The theorem applies only when its conditions hold, so check them first. The integrand $Q_x - P_y$ is needed before the double integral can be set up and evaluated. The sign rule uses the orientation of $C$: counterclockwise as stated, clockwise with a minus sign.'
- id: mv-m7-r2-q19
  lesson: mv-green
  module_quiz: true
  topic: Green's theorem
  stem: 'To which of these can Green''s theorem be applied directly? Select all that apply.'
  choices: ['$\oint_C -y\,dx + x\,dy$ counterclockwise around the unit circle', '$\oint_C\dfrac{-y\,dx + x\,dy}{x^2 + y^2}$ counterclockwise around the unit circle', '$\int_C y\,dx + x^2\,dy$ along the parabola $y = x^2$ from $(0, 0)$ to $(1, 1)$', '$\oint_C e^x\,dx + \sin y\,dy$ counterclockwise around the square $[0, 1]\times[0, 1]$']
  answer: [0, 3]
  explanation: 'The first and last are closed curves with $P$ and $Q$ smooth everywhere inside, so Green applies (giving $2\cdot\pi = 2\pi$ and $0$). The second field is undefined at the origin, inside the circle. The parabola is not a closed curve; you would have to close it up and subtract the added piece.'
- id: mv-m7-r2-q20
  lesson: mv-green
  topic: Green's theorem
  type: match
  stem: '$C$ is a positively oriented simple closed curve bounding a region $D$. Match each line integral to its value.'
  pairs:
    - ['$\oint_C x\,dy$', The area of D]
    - ['$\tfrac12\oint_C x\,dy - y\,dx$', The area of D]
    - ['$\oint_C y\,dx$', Minus the area of D]
    - ['$\oint_C 2x\,dy$', Twice the area of D]
    - ['$\oint_C x\,dx$', Zero]
  distractors: [Half the area of D]
  explanation: 'Apply Green: $x\,dy$ has $Q_x - P_y = 1$; $\tfrac12(x\,dy - y\,dx)$ has $\tfrac12 + \tfrac12 = 1$; $y\,dx$ has $0 - 1 = -1$; $2x\,dy$ has $2$; $x\,dx$ has $0 - 0 = 0$. Each integral equals that constant times the area.'
# Honors lesson 32h1: Holes and the winding number
- id: mv-m7-r2-h01
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  stem: 'Near any point other than the origin, the vortex field $\mathbf V$ equals $\nabla\theta$. Why is $\mathbf V$ still not conservative on the punctured plane?'
  choices: ['$\mathbf V$ fails the test $P_y = Q_x$ away from the origin', 'There is no single continuous angle function $\theta$ on the whole punctured plane', '$\theta$ is not differentiable anywhere', '$\mathbf V$ is not continuous at any point']
  answer: 1
  explanation: 'Following $\theta$ continuously once around the origin raises it by $2\pi$, so no single-valued continuous $\theta$ exists on the punctured plane. $\mathbf V$ is only locally conservative. It does pass $P_y = Q_x$, and both $\theta$ (locally) and $\mathbf V$ are smooth away from the origin.'
- id: mv-m7-r2-h02
  lesson: mv-m7-h-winding
  topic: Winding number
  stem: 'Find $\oint_C\mathbf V\cdot d\mathbf r$ for the vortex field $\mathbf V$, where $C$ is the circle $(x - 3)^2 + y^2 = 1$, counterclockwise.'
  choices: ['$2\pi$', '$-2\pi$', '$0$', '$\pi$']
  answer: 2
  explanation: 'The circle does not go around the origin, so its winding number is 0. (Equivalently, $\mathbf V$ is smooth with $Q_x = P_y$ on the disk inside, so Green''s theorem gives 0.) $2\pi$ would be right for a curve that circles the origin once.'
- id: mv-m7-r2-h03
  lesson: mv-m7-h-winding
  topic: Winding number
  stem: 'Find $\oint_C\mathbf V\cdot d\mathbf r$ for the vortex field $\mathbf V$ along $\mathbf r(t) = \langle\cos 3t, \sin 3t\rangle$, $0 \le t \le 2\pi$.'
  choices: ['$6\pi$', '$2\pi$', '$3\pi$', '$18\pi$']
  answer: 0
  explanation: 'As $t$ runs from 0 to $2\pi$, the angle $3t$ runs from 0 to $6\pi$: three counterclockwise turns, so $w = 3$ and the integral is $2\pi\cdot3 = 6\pi$. Directly: $\mathbf V\cdot\mathbf r'' = 3\sin^2 3t + 3\cos^2 3t = 3$, and $\int_0^{2\pi}3\,dt = 6\pi$.'
- id: mv-m7-r2-h04
  lesson: mv-m7-h-winding
  topic: Winding number
  stem: 'A closed curve goes around the origin twice clockwise. What is $\oint_C\mathbf V\cdot d\mathbf r$ for the vortex field?'
  choices: ['$4\pi$', '$-2\pi$', '$0$', '$-4\pi$']
  answer: 3
  explanation: 'Clockwise turns count negatively, so $w = -2$ and the integral is $2\pi(-2) = -4\pi$. $4\pi$ ignores the direction, and $-2\pi$ counts only one turn.'
- id: mv-m7-r2-h05
  lesson: mv-m7-h-winding
  topic: Winding number
  type: text
  stem: 'The curve $\mathbf r(t) = \langle 2\cos t,\; -2\sin t\rangle$, $0 \le t \le 2\pi$, has winding number ___ around the origin.'
  accept: ['-1']
  explanation: 'At $t = 0$ the point is $(2, 0)$; a little later $y = -2\sin t$ is negative, so the point moves down: the circle is traced once clockwise. That gives $w = -1$.'
- id: mv-m7-r2-h06
  lesson: mv-m7-h-winding
  topic: Winding number
  stem: 'For the square with vertices $(\pm1, \pm1)$, traversed counterclockwise, what does the right side ($x = 1$, $y$ from $-1$ to $1$) contribute to $\oint\mathbf V\cdot d\mathbf r$?'
  choices: ['$\tfrac{\pi}{4}$', '$\tfrac{\pi}{2}$', '$\pi$', '$2\pi$']
  answer: 1
  explanation: 'On that side $dx = 0$ and $Q = \dfrac{x}{x^2 + y^2} = \dfrac{1}{1 + y^2}$, so the side gives $\int_{-1}^{1}\dfrac{dy}{1 + y^2} = \arctan 1 - \arctan(-1) = \tfrac{\pi}{2}$. This is the angle the side covers as seen from the origin; the four sides add to $2\pi$.'
- id: mv-m7-r2-h07
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  stem: 'A field $\mathbf F$ has continuous partials and $Q_x = P_y$ on the punctured plane, and its circulation around the unit circle (counterclockwise) is $4\pi$. What is its circulation counterclockwise around the ellipse $\tfrac{x^2}{9} + \tfrac{y^2}{4} = 1$?'
  choices: ['$0$', '$24\pi$', '$4\pi$', '$12\pi$']
  answer: 2
  explanation: 'The ellipse and the unit circle bound a region with no singular point, on which $Q_x - P_y = 0$, so by the deformation principle the circulations are equal: $4\pi$. The answer does not scale with the size of the curve (that would give $24\pi$ from the area ratio 6).'
- id: mv-m7-r2-h08
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  stem: 'Let $\mathbf F = \left\langle\dfrac{2x - 5y}{x^2 + y^2},\; \dfrac{2y + 5x}{x^2 + y^2}\right\rangle$. What is $\oint_C\mathbf F\cdot d\mathbf r$ around a curve that winds once counterclockwise around the origin?'
  choices: ['$4\pi$', '$10\pi$', '$14\pi$', '$0$']
  answer: 1
  explanation: '$\mathbf F = 2\left\langle\frac{x}{x^2 + y^2}, \frac{y}{x^2 + y^2}\right\rangle + 5\mathbf V = \nabla(\ln(x^2 + y^2)) + 5\mathbf V$. The gradient part contributes 0 around a closed curve, and $5\mathbf V$ contributes $5\cdot2\pi = 10\pi$. Using the radial coefficient 2 gives $4\pi$, and adding both gives $14\pi$.'
- id: mv-m7-r2-h09
  lesson: mv-m7-h-winding
  topic: Winding number
  stem: 'Which statements about the winding number of a closed curve around the origin are true? Select all that apply.'
  choices: ['It is always an integer', 'For a circle centered at the origin, it grows with the radius', 'Clockwise turns count negatively', 'A large curve that does not go around the origin can have a nonzero winding number']
  answer: [0, 2]
  explanation: 'Following the angle continuously, the curve ends where it started, so the total change is a whole number of turns: $w$ is an integer, with clockwise turns negative. It counts turns, not size, so the radius does not matter, and a curve that does not go around the origin has $w = 0$ however large it is.'
- id: mv-m7-r2-h10
  lesson: mv-m7-h-winding
  topic: Winding number
  type: label
  stem: 'This closed curve is traced counterclockwise, as the arrows show. Give the winding number of the curve around each numbered point.'
  image: {src: images/mv-m7-winding-blank.svg, alt: 'A closed curve with a large outer loop and a small inner loop on its left, with arrows showing counterclockwise travel. Point 1 is inside the small inner loop, point 2 is inside the large loop but outside the small one, and point 3 is outside the curve.'}
  labels:
    - {x: 30.8, y: 50.0, text: Winding number 2}
    - {x: 58.3, y: 50.0, text: Winding number 1}
    - {x: 89.5, y: 14.2, text: Winding number 0}
  distractors: [Winding number −1, Winding number 3]
  explanation: 'Points inside the small loop are circled by both loops, both counterclockwise: $w = 2$. Points between the loops are circled once: $w = 1$. A point outside is not circled at all: $w = 0$. Each time you cross the curve, $w$ changes by 1.'
- id: mv-m7-r2-h11
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  type: match
  stem: 'Match each circulation to its value.'
  pairs:
    - ['$\oint\mathbf V\cdot d\mathbf r$ once counterclockwise around the origin', 2π]
    - ['Velocity of a point vortex of strength $\Gamma$, loop once counterclockwise around it', Γ]
    - ['Magnetic field of a long straight wire with current $I$, loop once around it in the right-hand sense', μ0 I]
    - ['$\oint\nabla f\cdot d\mathbf r$ around any closed curve where $\nabla f$ is continuous', '0']
  distractors: [4π, 2πΓ]
  explanation: '$\mathbf V$ sweeps out an angle of $2\pi$ per turn. The point vortex is $\tfrac{\Gamma}{2\pi}\mathbf V$, so its circulation is $\Gamma$. The wire''s field is $\tfrac{\mu_0 I}{2\pi}\mathbf V$, giving $\mu_0 I$ (Ampère''s law). A gradient field has zero circulation around every closed curve.'
- id: mv-m7-r2-h12
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  type: order
  stem: 'Put the steps of the proof that a curl-free field on the punctured plane has the form $\mathbf F = \nabla f + c\mathbf V$ in order.'
  items:
    - 'Define $\mathbf G = \mathbf F - c\mathbf V$, where $2\pi c$ is the circulation of $\mathbf F$ around the unit circle'
    - 'Show that $\mathbf G$ has zero circulation around the unit circle'
    - 'Use the deformation principle and Green''s theorem to get zero circulation around every simple closed curve'
    - 'Conclude that the line integrals of $\mathbf G$ are path independent'
    - 'Conclude that $\mathbf G = \nabla f$, so $\mathbf F = \nabla f + c\mathbf V$'
  explanation: 'The constant $c$ is chosen to cancel the circulation around the unit circle. Any simple closed curve can then be compared with the unit circle (or shrinks without meeting the origin), so $\mathbf G$ has zero circulation everywhere. Zero circulation means path independence, and a path-independent field is a gradient.'
- id: mv-m7-r2-h13
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  type: text
  stem: 'The plane with the origin removed is called the ___ plane.'
  accept: [punctured]
  explanation: 'It is the punctured plane. It is connected but not simply connected: a loop around the missing point cannot be shrunk to a point without leaving the region.'
- id: mv-m7-r2-h14
  lesson: mv-m7-h-winding
  topic: Fields on regions with holes
  stem: 'A long straight wire carries current $I$. A closed loop of wire winds around it twice in the right-hand sense. What is $\oint\mathbf B\cdot d\mathbf r$ around the loop?'
  choices: ['$\mu_0 I$', '$0$', '$2\mu_0 I$', '$4\pi\mu_0 I$']
  answer: 2
  explanation: '$\mathbf B = \tfrac{\mu_0 I}{2\pi}\mathbf V$, so $\oint\mathbf B\cdot d\mathbf r = \tfrac{\mu_0 I}{2\pi}\cdot2\pi w = \mu_0 I w$. With $w = 2$ this is $2\mu_0 I$. $4\pi\mu_0 I$ forgets to divide by $2\pi$.'
# Honors lesson 32h2: Polygons, the shoelace formula and centroids
- id: mv-m7-r2-h15
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'Find $\int x\,dy - y\,dx$ along the segment from $(2, 1)$ to $(5, 4)$.'
  choices: ['$3$', '$-3$', '$13$', '$8$']
  answer: 0
  explanation: 'One edge contributes $x_ay_b - x_by_a = 2\cdot4 - 5\cdot1 = 3$. Reversing the order gives $-3$; adding the products ($8 + 5$) gives 13.'
- id: mv-m7-r2-h16
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  type: text
  stem: 'Use the shoelace formula: the triangle with vertices $(0, 0)$, $(4, 1)$, $(1, 3)$ has area ___ .'
  accept: ['5.5', '11/2']
  explanation: 'The edge terms are $0\cdot1 - 4\cdot0 = 0$, $4\cdot3 - 1\cdot1 = 11$ and $1\cdot0 - 0\cdot3 = 0$. The sum is 11, so the area is $\tfrac{11}{2} = 5.5$. The vertices are counterclockwise, since the sum is positive.'
- id: mv-m7-r2-h17
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'Find the area of the pentagon with vertices $(0, 0)$, $(5, 0)$, $(5, 2)$, $(2, 4)$, $(0, 3)$, listed counterclockwise.'
  choices: ['$20$', '$32$', '$16$', '$13$']
  answer: 2
  explanation: 'Edge terms: $0$, $5\cdot2 - 5\cdot0 = 10$, $5\cdot4 - 2\cdot2 = 16$, $2\cdot3 - 0\cdot4 = 6$, $0\cdot0 - 0\cdot3 = 0$. The sum is 32, and the area is half of it, 16. Forgetting the $\tfrac12$ gives 32; 20 is the bounding rectangle.'
- id: mv-m7-r2-h18
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'A student applies $\tfrac12\sum(x_iy_{i+1} - x_{i+1}y_i)$ to a simple polygon and gets $-12$. What happened, and what is the area?'
  choices: ['The vertices were listed clockwise; the area is 12', 'The polygon crosses itself; the area cannot be found', 'An arithmetic error was made, since areas cannot be negative', 'The vertices were listed clockwise; the area is 24']
  answer: 0
  explanation: 'For a simple polygon, a negative result just means the vertices run clockwise, which reverses every edge and flips the sign. The area is the absolute value, 12. The factor $\tfrac12$ was already applied, so 24 is wrong.'
- id: mv-m7-r2-h19
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'What does the shoelace formula give for the outline $(0, 0)\to(4, 4)\to(4, 0)\to(0, 4)\to(0, 0)$?'
  choices: ['$8$', '$16$', '$-8$', '$0$, though the outline encloses two triangles of total area 8']
  answer: 3
  explanation: 'The terms are $0$, $4\cdot0 - 4\cdot4 = -16$, $4\cdot4 - 0\cdot0 = 16$ and $0$, so the result is 0. The outline crosses itself at $(2, 2)$: one triangle (area 4) is traversed counterclockwise and the other (area 4) clockwise, so they cancel.'
- id: mv-m7-r2-h20
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'Which statements about the shoelace formula are true? Select all that apply.'
  choices: ['The sign of the sum tells whether the vertices run counterclockwise or clockwise', 'The vertices may be listed in any order', 'The edge from the last vertex back to the first must be included', 'For a self-crossing outline it still gives the area covered']
  answer: [0, 2]
  explanation: 'Clockwise order flips every term, so the sign is an orientation test. The closing edge is part of the boundary and must be counted. The vertices must be in order around the boundary; any other order describes a different polygon. A self-crossing outline gives a signed total that can even be 0.'
- id: mv-m7-r2-h21
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  type: order
  stem: 'Put the steps of the shoelace computation in order.'
  items:
    - 'List the vertices in counterclockwise order around the boundary'
    - 'Repeat the first vertex at the end of the list'
    - 'For each pair of consecutive vertices, compute $x_iy_{i+1} - x_{i+1}y_i$'
    - 'Add up these terms'
    - 'Divide the sum by 2'
  explanation: 'The list must follow the boundary, and repeating the first vertex supplies the closing edge. Each edge gives one crisscross term; their sum is $\oint x\,dy - y\,dx$, which is twice the area.'
- id: mv-m7-r2-h22
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  type: match
  stem: 'Match each quantity to its meaning.'
  pairs:
    - ['The sign of $\sum(x_iy_{i+1} - x_{i+1}y_i)$', Whether the vertices run counterclockwise or clockwise]
    - ['$x_ay_b - x_by_a$', 'The integral of x dy − y dx along one edge']
    - ['$\tfrac12(x_iy_{i+1} - x_{i+1}y_i)$', Signed area of a fan triangle from the origin]
    - ['The centroid of a triangle', The average of its three vertices]
  distractors: [Twice the area of the polygon]
  explanation: 'Each edge contributes $x_ay_b - x_by_a$ to $\oint x\,dy - y\,dx$; half of it is the signed area of the triangle formed by the origin and that edge. The sign of the total gives the orientation. A triangle''s centroid is the average of its vertices, which is what the polygon centroid formula is built from.'
- id: mv-m7-r2-h23
  lesson: mv-m7-h-shoelace
  topic: Centroids from line integrals
  stem: 'Find the centroid of the quadrilateral with vertices $(0, 0)$, $(4, 0)$, $(2, 2)$, $(0, 2)$, listed counterclockwise.'
  choices: ['$\left(\tfrac32, 1\right)$', '$\left(\tfrac{14}{9}, \tfrac89\right)$', '$(1, 1)$', '$\left(\tfrac89, \tfrac{14}{9}\right)$']
  answer: 1
  explanation: 'Edge terms $c_i$: $0$, $8$, $4$, $0$, so $A = 6$ and $6A = 36$. $\sum(x_i + x_{i+1})c_i = 6\cdot8 + 2\cdot4 = 56$ and $\sum(y_i + y_{i+1})c_i = 2\cdot8 + 4\cdot4 = 32$. So $(\bar x, \bar y) = \left(\tfrac{56}{36}, \tfrac{32}{36}\right) = \left(\tfrac{14}{9}, \tfrac89\right)$. Check: a $2\times2$ square with centroid $(1, 1)$ plus a triangle of area 2 with centroid $\left(\tfrac83, \tfrac23\right)$. $\left(\tfrac32, 1\right)$ is the average of the vertices, which is not the centroid of a quadrilateral.'
- id: mv-m7-r2-h24
  lesson: mv-m7-h-shoelace
  topic: Centroids from line integrals
  type: text
  stem: 'In the polygon centroid formulas $\bar x = \dfrac{1}{kA}\sum(x_i + x_{i+1})c_i$ and $\bar y = \dfrac{1}{kA}\sum(y_i + y_{i+1})c_i$, the constant is $k =$ ___ .'
  accept: ['6', six]
  explanation: 'Each fan triangle has signed area $\tfrac12c_i$ and centroid $\tfrac13(x_i + x_{i+1})$, so the weighted sum is $\sum\tfrac12c_i\cdot\tfrac13(x_i + x_{i+1}) = \tfrac16\sum(x_i + x_{i+1})c_i$, divided by $A$.'
- id: mv-m7-r2-h25
  lesson: mv-m7-h-shoelace
  topic: Centroids from line integrals
  stem: 'Find the centroid of the triangle with vertices $(0, 0)$, $(6, 0)$, $(0, 3)$.'
  choices: ['$(3, 1.5)$', '$(2, 1.5)$', '$(3, 1)$', '$(2, 1)$']
  answer: 3
  explanation: 'A triangle''s centroid is the average of its vertices: $\left(\tfrac{0 + 6 + 0}{3}, \tfrac{0 + 0 + 3}{3}\right) = (2, 1)$. The formula agrees: $c_i = 0, 18, 0$, $A = 9$, $\bar x = \tfrac{(6 + 0)\cdot18}{54} = 2$ and $\bar y = \tfrac{(0 + 3)\cdot18}{54} = 1$. $(3, 1.5)$ is the midpoint of the hypotenuse.'
- id: mv-m7-r2-h26
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'A land parcel has corners at $(0, 0)$, $(60, 0)$, $(80, 50)$ and $(10, 40)$, in meters, listed counterclockwise. What is its area?'
  choices: ['$2{,}850\text{ m}^2$', '$5{,}700\text{ m}^2$', '$4{,}000\text{ m}^2$', '$3{,}000\text{ m}^2$']
  answer: 0
  explanation: 'Edge terms: $0$, $60\cdot50 - 80\cdot0 = 3000$, $80\cdot40 - 10\cdot50 = 2700$, $10\cdot0 - 0\cdot40 = 0$. The sum is 5,700, and the area is half: 2,850 m². 5,700 forgets the $\tfrac12$, and 4,000 is the bounding rectangle $80\times50$.'
- id: mv-m7-r2-h27
  lesson: mv-m7-h-shoelace
  topic: Shoelace formula
  stem: 'The origin lies inside a convex polygon whose vertices are listed counterclockwise. What can you say about the fan triangles $O P_i P_{i+1}$?'
  choices: ['Some have negative signed area, which cancels the parts outside the polygon', 'All have positive signed area, and together they tile the polygon', 'All have zero signed area', 'Their signed areas add up to twice the area of the polygon']
  answer: 1
  explanation: 'From an inside point of a convex polygon, each edge is seen turning counterclockwise, so every triangle is positive and the triangles fit together exactly. Negative triangles appear when the origin is outside. Their signed areas add to the area itself; it is the sum of the $c_i$ that is twice the area.'
- id: mv-m7-r2-h28
  lesson: mv-m7-h-shoelace
  topic: Centroids from line integrals
  stem: 'For a polygon of area 6, a student finds $\sum(x_i + x_{i+1})c_i = 54$ and reports $\bar x = 9$. What is the correct $\bar x$?'
  choices: ['$4.5$', '$0.75$', '$1.5$', '$9$']
  answer: 2
  explanation: 'The formula divides by $6A = 36$, not by $A$: $\bar x = \tfrac{54}{36} = 1.5$. Dividing by $A$ alone gives 9, six times too big. (This is the L-shaped plate of Example 3.)'
