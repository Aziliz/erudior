# Round 2 questions for mv-m2 (Vector functions and motion)
# Core lessons: mv-m2-r2-q01 ... ; honors lessons: mv-m2-r2-h01 ...

# ---------- Lesson 7: Vector functions and space curves ----------
- id: mv-m2-r2-q01
  lesson: mv-vector-functions
  type: label
  module_quiz: true
  topic: Vector functions
  stem: 'The picture shows the helix $\mathbf r(t) = \langle \cos t,\, \sin t,\, ct\rangle$ with two vectors drawn at one point. Name the numbered parts.'
  image: {src: images/mv-m2-helix-blank.svg, alt: 'A helix winding up around the z-axis, drawn in 3D with x, y and z axes. A shaded circle lies in the xy-plane under it. A blue arrow runs from the origin to a point on the helix, and a red arrow starts at that point and points along the helix.'}
  labels:
    - {x: 52.3, y: 60.7, text: 'Position vector r(t)'}
    - {x: 66.7, y: 41.0, text: 'Tangent vector r′(t)'}
    - {x: 23.4, y: 78.0, text: Projection onto the xy-plane}
    - {x: 23.2, y: 32.4, text: The space curve (helix)}
  distractors: [Principal unit normal, Binormal vector]
  explanation: |-
    1: the blue arrow from the origin to the point is the position vector $\mathbf r(t)$. 2: the red arrow starting at the point and running along the curve is the tangent vector $\mathbf r'(t)$. 3: the shaded circle is the projection (shadow) of the helix on the $xy$-plane, found by dropping the $z$-component. 4: the curve itself is the helix. The normal and binormal vectors belong to the TNB frame of Lesson 9 and are not drawn here.
- id: mv-m2-r2-q02
  lesson: mv-vector-functions
  type: text
  topic: Derivatives of vector functions
  stem: 'Let $\mathbf r(t) = \langle t^2,\, 3t,\, 5\rangle$. Then $\mathbf r''(2) = \langle$ ___ , ___ , ___ $\rangle$. Give only numbers.'
  accept:
    - ['4']
    - ['3']
    - ['0']
  explanation: |-
    Differentiate each component: $\mathbf r'(t) = \langle 2t,\, 3,\, 0\rangle$, so $\mathbf r'(2) = \langle 4, 3, 0\rangle$. The constant component 5 has derivative 0.
- id: mv-m2-r2-q03
  lesson: mv-vector-functions
  type: match
  topic: Derivatives of vector functions
  stem: 'Match each expression to what it gives for a curve $\mathbf r(t)$.'
  pairs:
    - ['$\mathbf r''(t)$', Tangent vector]
    - ['$\mathbf r''(t)/|\mathbf r''(t)|$', Unit tangent vector]
    - ['$\mathbf r(t_0) + s\,\mathbf r''(t_0)$', Tangent line at t0]
    - ['$\int_a^b\mathbf r''(t)\,dt$', Displacement from r(a) to r(b)]
  distractors: [Arc length from t = a to t = b]
  explanation: |-
    $\mathbf r'$ is tangent; dividing by its length gives the unit tangent $\mathbf T$; a point plus multiples of $\mathbf r'(t_0)$ is the tangent line. By the FTC, $\int_a^b\mathbf r'(t)\,dt = \mathbf r(b) - \mathbf r(a)$, a displacement vector. Arc length would integrate the length $|\mathbf r'(t)|$, not the vector.
- id: mv-m2-r2-q04
  lesson: mv-vector-functions
  module_quiz: true
  topic: Derivatives of vector functions
  stem: 'Which statements hold for all differentiable vector functions $\mathbf u(t)$, $\mathbf v(t)$, $\mathbf r(t)$? Select all that apply.'
  choices:
    - '$(\mathbf u\cdot\mathbf v)'' = \mathbf u''\cdot\mathbf v + \mathbf u\cdot\mathbf v''$'
    - '$(\mathbf u\times\mathbf v)'' = \mathbf v''\times\mathbf u + \mathbf v\times\mathbf u''$'
    - '$(\mathbf u\times\mathbf v)'' = \mathbf u''\times\mathbf v + \mathbf u\times\mathbf v''$'
    - 'If $|\mathbf r(t)|$ is constant, then $\mathbf r(t)\cdot\mathbf r''(t) = 0$'
    - '$(f\mathbf u)'' = f''\,\mathbf u''$ for a scalar function $f$'
  answer: [0, 2, 3]
  explanation: |-
    The dot and cross product rules hold with the order of factors kept. Reversing both cross products gives $\mathbf v'\times\mathbf u + \mathbf v\times\mathbf u' = -(\mathbf u\times\mathbf v)'$, wrong in sign. Constant length gives $\mathbf r\cdot\mathbf r = c^2$, and differentiating gives $2\,\mathbf r\cdot\mathbf r' = 0$. The scalar product rule is $(f\mathbf u)' = f'\mathbf u + f\mathbf u'$, not $f'\mathbf u'$.
- id: mv-m2-r2-q05
  lesson: mv-vector-functions
  type: order
  topic: Vector functions
  stem: 'Put the steps in order to find $\mathbf r(t)$ from a known velocity $\mathbf r''(t)$ and a starting position $\mathbf r(0)$.'
  items:
    - 'Integrate each component of $\mathbf r''(t)$'
    - 'Add a constant vector $\mathbf C$ to the antiderivative'
    - 'Set $t = 0$ and equate the result to $\mathbf r(0)$'
    - 'Solve for $\mathbf C$ and write out $\mathbf r(t)$'
  explanation: |-
    Integrate componentwise, include one constant vector, use the initial condition to pin it down, then substitute it back, exactly as in Lesson 7's Example 3.

# ---------- Lesson 8: Arc length and curvature ----------
- id: mv-m2-r2-q06
  lesson: mv-arc-length
  type: text
  module_quiz: true
  topic: Arc length
  stem: 'The helix $\langle 3\cos t,\, 3\sin t,\, 4t\rangle$ has constant speed ___, so its length for $0 \le t \le 2\pi$ is ___ $\pi$. Give only numbers.'
  accept:
    - ['5']
    - ['10']
  explanation: |-
    $\mathbf r' = \langle -3\sin t, 3\cos t, 4\rangle$ has length $\sqrt{9 + 16} = 5$. Length $= \int_0^{2\pi}5\,dt = 10\pi$.
- id: mv-m2-r2-q07
  lesson: mv-arc-length
  type: match
  topic: Curvature
  stem: 'Match each curve to its curvature.'
  pairs:
    - [A straight line, '0']
    - [A circle of radius 4, 1/4]
    - ['The helix $\langle\cos t,\, \sin t,\, t\rangle$', 1/2]
    - ['$y = x^2$ at the vertex', '2']
  distractors: ['4']
  explanation: |-
    A line does not bend: $\kappa = 0$. A circle of radius $a$ has $\kappa = 1/a = \tfrac14$ (not 4: larger circles bend less). The helix has $|\mathbf r'\times\mathbf r''| = \sqrt2$ and $|\mathbf r'|^3 = 2\sqrt2$, so $\kappa = \tfrac12$. For $y = x^2$, $\kappa = |f''|/(1 + f'^2)^{3/2} = 2/1 = 2$ at $x = 0$.
- id: mv-m2-r2-q08
  lesson: mv-arc-length
  module_quiz: true
  topic: Curvature
  stem: 'Which of these are correct formulas for the curvature of a smooth curve $\mathbf r(t)$? Select all that apply.'
  choices:
    - '$\left|\dfrac{d\mathbf T}{ds}\right|$'
    - '$|\mathbf T''(t)|$'
    - '$\dfrac{|\mathbf r''\times\mathbf r''''|}{|\mathbf r''|^3}$'
    - '$\dfrac{|\mathbf r''''|}{|\mathbf r''|^2}$'
    - '$\dfrac{|\mathbf T''(t)|}{|\mathbf r''(t)|}$'
  answer: [0, 2, 4]
  explanation: |-
    The definition is $|d\mathbf T/ds|$; the chain rule turns it into $|\mathbf T'(t)|/|\mathbf r'(t)|$, and Lesson 8 derives $|\mathbf r'\times\mathbf r''|/|\mathbf r'|^3$. $|\mathbf T'(t)|$ alone depends on how fast you travel. $|\mathbf r''|/|\mathbf r'|^2$ is wrong in general: for $\langle t, t^2\rangle$ at $t = 1$ it gives $2/5 = 0.4$, but the curvature is $2/5^{3/2} \approx 0.179$.
- id: mv-m2-r2-q09
  lesson: mv-arc-length
  type: order
  topic: Curvature
  stem: 'Put these points of the parabola $y = x^2$ in order from largest curvature to smallest.'
  items: ['$x = 0$', '$x = -0.4$', '$x = 1$', '$x = -2$']
  explanation: |-
    $\kappa(x) = \dfrac{2}{(1 + 4x^2)^{3/2}}$ depends only on $|x|$ and shrinks as $|x|$ grows: $\kappa(0) = 2$, $\kappa(-0.4) \approx 0.952$, $\kappa(1) \approx 0.179$, $\kappa(-2) \approx 0.029$. The sign of $x$ does not matter, by symmetry.
- id: mv-m2-r2-q10
  lesson: mv-arc-length
  topic: Arc length
  stem: 'A curve from $P$ to $Q$ is approximated by a chain of straight chords between points on it. How does the total length of the chords compare with the arc length?'
  choices: ['It can be larger or smaller, depending on the curve', 'It is always at least the arc length', 'It is always equal to the arc length', 'It is never more than the arc length']
  answer: 3
  explanation: |-
    A straight segment is the shortest path between its endpoints, so each chord is no longer than the piece of curve it replaces. The chords therefore underestimate (or, for a straight curve, equal) the arc length, and the estimate improves as the chords get shorter.

# ---------- Lesson 9: TNB frame ----------
- id: mv-m2-r2-q11
  lesson: mv-tnb
  type: label
  module_quiz: true
  topic: TNB frame
  stem: 'The picture shows the moving frame at a point $P$ of a curve. Name the numbered parts.'
  image: {src: images/mv-m2-tnb-blank.svg, alt: 'A curve passing through a point P on a shaded parallelogram. At P, one arrow points along the curve, a second points within the shaded plane toward the side the curve bends to, and a third points straight up, perpendicular to the plane. Beyond P the curve rises out of the plane.'}
  labels:
    - {x: 67.0, y: 63.3, text: Unit tangent T}
    - {x: 43.1, y: 50.0, text: Principal unit normal N}
    - {x: 53.6, y: 38.3, text: Binormal B}
    - {x: 41.6, y: 69.2, text: Osculating plane}
  distractors: [Position vector, Normal plane]
  explanation: |-
    1: $\mathbf T$ points along the curve. 2: $\mathbf N$ lies in the shaded plane and points toward the side the curve is bending to. 3: $\mathbf B = \mathbf T\times\mathbf N$ is perpendicular to both. 4: the plane containing $\mathbf T$ and $\mathbf N$ is the osculating plane. (The *normal plane* is a different plane: the one perpendicular to $\mathbf T$, spanned by $\mathbf N$ and $\mathbf B$.)
- id: mv-m2-r2-q12
  lesson: mv-tnb
  type: text
  module_quiz: true
  topic: Tangential and normal acceleration
  stem: 'A car drives at a constant 20 m/s around a curve of radius 50 m. Its acceleration components are $a_T =$ ___ m/s² and $a_N =$ ___ m/s². Give only numbers.'
  accept:
    - ['0']
    - ['8']
  explanation: |-
    Constant speed means $a_T = \tfrac{d}{dt}|\mathbf v| = 0$. The normal part is $a_N = \kappa v^2 = \tfrac{1}{50}\cdot 20^2 = 8$ m/s².
- id: mv-m2-r2-q13
  lesson: mv-tnb
  type: match
  topic: TNB frame
  stem: 'Match each quantity to its description.'
  pairs:
    - ['$a_T$', Rate of change of speed]
    - ['$a_N$', Part of the acceleration that turns the motion]
    - ['$\mathbf B$', Normal vector of the osculating plane]
    - ['$\mathbf N$', Points toward the center of the osculating circle]
  distractors: [Always parallel to the acceleration]
  explanation: |-
    $a_T = v'$ measures speeding up or slowing down; $a_N = \kappa v^2$ measures turning. $\mathbf B = \mathbf T\times\mathbf N$ is perpendicular to the osculating plane, and $\mathbf N$ points to the concave side, toward the osculating circle's center. Nothing in the frame is always parallel to $\mathbf a$: $\mathbf a = a_T\mathbf T + a_N\mathbf N$ is parallel to $\mathbf N$ only when the speed is constant.
- id: mv-m2-r2-q14
  lesson: mv-tnb
  topic: Tangential and normal acceleration
  stem: 'A particle moves at constant speed along a curved path (curvature $\kappa > 0$). Which statements must be true? Select all that apply.'
  choices: ['$a_T = 0$', 'The acceleration is $\mathbf 0$', 'The acceleration is perpendicular to the velocity', 'The acceleration has a nonzero $\mathbf B$ component']
  answer: [0, 2]
  explanation: |-
    Constant speed gives $a_T = v' = 0$, so $\mathbf a = \kappa v^2\,\mathbf N$, which is perpendicular to $\mathbf v = v\mathbf T$ and is not zero because $\kappa > 0$. Acceleration never has a $\mathbf B$ component: it always lies in the osculating plane.
- id: mv-m2-r2-q15
  lesson: mv-tnb
  type: order
  topic: TNB frame
  stem: 'Put the steps in order to find the binormal $\mathbf B(t)$ of a curve $\mathbf r(t)$.'
  items:
    - 'Differentiate to get $\mathbf r''(t)$'
    - 'Divide by $|\mathbf r''(t)|$ to get $\mathbf T(t)$'
    - 'Differentiate $\mathbf T$ and divide by $|\mathbf T''(t)|$ to get $\mathbf N(t)$'
    - 'Compute the cross product $\mathbf T\times\mathbf N$'
  explanation: |-
    Each vector is built from the previous one: $\mathbf T$ from $\mathbf r'$, $\mathbf N$ from $\mathbf T'$, and $\mathbf B = \mathbf T\times\mathbf N$ (in that order; $\mathbf N\times\mathbf T$ gives $-\mathbf B$).

# ---------- Lesson 10: Motion ----------
- id: mv-m2-r2-q16
  lesson: mv-motion
  type: label
  module_quiz: true
  topic: Projectile motion
  stem: 'The picture shows a projectile launched over level ground. Name the numbered parts.'
  image: {src: images/mv-m2-projectile-blank.svg, alt: 'A parabolic path over level ground. An arrow leaves the launch point at an angle marked by an arc. A dashed vertical line runs from the ground to the top of the path, and a double arrow runs along the ground from the launch point to the landing point.'}
  labels:
    - {x: 16.3, y: 55.0, text: Initial velocity}
    - {x: 17.7, y: 66.8, text: Launch angle}
    - {x: 50.0, y: 48.3, text: Maximum height}
    - {x: 50.0, y: 88.5, text: Range}
  distractors: [Time of flight, Acceleration due to gravity]
  explanation: |-
    1: the arrow at launch is the initial velocity $\mathbf v_0$. 2: the arc marks the launch angle $\alpha$. 3: the dashed line from the ground to the top is the maximum height $H = (v_0\sin\alpha)^2/(2g)$. 4: the ground distance to landing is the range $R = v_0^2\sin2\alpha/g$. Time of flight is a time, not a length in the picture, and gravity points straight down.
- id: mv-m2-r2-q17
  lesson: mv-motion
  type: text
  topic: Projectile motion
  stem: 'A ball is launched at 14 m/s at $30^\circ$ above level ground. With $g = 9.8\text{ m/s}^2$, its maximum height is ___ m. Give only the number.'
  accept: ['2.5']
  explanation: |-
    The vertical launch speed is $14\sin30^\circ = 7$ m/s, so $H = \dfrac{7^2}{2\cdot9.8} = \dfrac{49}{19.6} = 2.5$ m.
- id: mv-m2-r2-q18
  lesson: mv-motion
  type: order
  topic: Velocity and acceleration
  stem: 'A force $\mathbf F(t)$ acts on a particle of mass $m$ with known starting position and velocity. Put the steps for finding its position in order.'
  items:
    - 'Divide the force by $m$ to get $\mathbf a(t)$'
    - 'Integrate $\mathbf a(t)$ and use $\mathbf v(0)$ to get $\mathbf v(t)$'
    - 'Integrate $\mathbf v(t)$ and use $\mathbf r(0)$ to get $\mathbf r(t)$'
    - 'Evaluate $\mathbf r(t)$ at the time you need'
  explanation: |-
    Newton's law gives $\mathbf a = \mathbf F/m$; each integration brings in one initial condition, velocity first and then position.
- id: mv-m2-r2-q19
  lesson: mv-motion
  module_quiz: true
  topic: Projectile motion
  stem: 'A projectile is launched over level ground with no air resistance. Which statements are true? Select all that apply.'
  choices: ['The horizontal component of velocity stays constant', 'The vertical component of velocity is zero at the highest point', 'The acceleration is zero at the highest point', 'Launches at $30^\circ$ and $60^\circ$ with the same speed land at the same distance', 'The range is largest for a launch angle of $60^\circ$']
  answer: [0, 1, 3]
  explanation: |-
    The only force is gravity, straight down, so the horizontal velocity never changes and the acceleration is $\langle 0, -g\rangle$ throughout, including at the top, where only the vertical velocity is zero. $R = v_0^2\sin2\alpha/g$ and $\sin60^\circ = \sin120^\circ$, so $30^\circ$ and $60^\circ$ give the same range; the maximum is at $45^\circ$.
- id: mv-m2-r2-q20
  lesson: mv-motion
  type: match
  topic: Projectile motion
  stem: 'For a launch from ground level at speed $v_0$ and angle $\alpha$ (level ground, no air resistance), match each expression to the quantity it gives.'
  pairs:
    - ['$\dfrac{2v_0\sin\alpha}{g}$', Time of flight]
    - ['$\dfrac{v_0^2\sin2\alpha}{g}$', Range]
    - ['$\dfrac{(v_0\sin\alpha)^2}{2g}$', Maximum height]
    - ['$v_0\cos\alpha$', Horizontal component of velocity]
  distractors: [Time to reach the highest point]
  explanation: |-
    Flight time comes from setting the height to 0; the range is horizontal speed times flight time, $v_0\cos\alpha\cdot\tfrac{2v_0\sin\alpha}{g} = \tfrac{v_0^2\sin2\alpha}{g}$; the maximum height is reached when the vertical velocity is 0. The time to the top would be $v_0\sin\alpha/g$, half the flight time, which is not listed.

# ---------- Honors: Torsion and the Frenet–Serret formulas ----------
- id: mv-m2-r2-h01
  lesson: mv-m2-h-frenet-serret
  topic: Frenet–Serret formulas
  stem: 'Which is the Frenet–Serret formula for $d\mathbf N/ds$?'
  choices: ['$\kappa\mathbf T - \tau\mathbf B$', '$-\kappa\mathbf T + \tau\mathbf B$', '$-\kappa\mathbf T$', '$\tau\mathbf B - \kappa\mathbf N$']
  answer: 1
  explanation: |-
    From $\mathbf N = \mathbf B\times\mathbf T$: $\mathbf N' = \mathbf B'\times\mathbf T + \mathbf B\times\mathbf T' = -\tau\,\mathbf N\times\mathbf T + \kappa\,\mathbf B\times\mathbf N = \tau\mathbf B - \kappa\mathbf T$. Dropping $\tau\mathbf B$ forgets the twisting; an $\mathbf N$ term cannot appear, since $\mathbf N$ has constant length and so $\mathbf N'\perp\mathbf N$.
- id: mv-m2-r2-h02
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'Why must $d\mathbf B/ds$ be a multiple of $\mathbf N$?'
  choices: ['Because $\mathbf B$ is constant along every curve', 'Because $d\mathbf B/ds$ equals $d\mathbf T/ds$', 'Because $d\mathbf B/ds$ is perpendicular to both $\mathbf B$ and $\mathbf T$', 'Because $d\mathbf B/ds$ is perpendicular to $\mathbf N$']
  answer: 2
  explanation: |-
    $|\mathbf B| = 1$ gives $\mathbf B'\perp\mathbf B$. Differentiating $\mathbf B\cdot\mathbf T = 0$ gives $\mathbf B'\cdot\mathbf T = -\mathbf B\cdot\kappa\mathbf N = 0$. A vector perpendicular to $\mathbf T$ and $\mathbf B$ must be along $\mathbf N$. $\mathbf B$ is constant only for plane curves.
- id: mv-m2-r2-h03
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'Find the torsion of the helix $\mathbf r(t) = \langle 2\cos t,\, 2\sin t,\, t\rangle$.'
  choices: ['$\tfrac25$', '$\tfrac13$', '$\tfrac{1}{\sqrt5}$', '$\tfrac15$']
  answer: 3
  explanation: |-
    For $\langle a\cos t, a\sin t, bt\rangle$, $\tau = \dfrac{b}{a^2 + b^2}$. With $a = 2$, $b = 1$: $\tau = \tfrac15$. The value $\tfrac25 = \tfrac{a}{a^2 + b^2}$ is the curvature.
- id: mv-m2-r2-h04
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'The twisted cubic $\langle t,\, t^2,\, t^3\rangle$ has $\tau(t) = \dfrac{3}{9t^4 + 9t^2 + 1}$. What is its torsion at $t = -1$?'
  choices: ['$\tfrac{3}{19}$', '$-\tfrac{3}{19}$', '$3$', '$\tfrac{1}{19}$']
  answer: 0
  explanation: |-
    Only even powers of $t$ appear, so $\tau(-1) = \tau(1) = \tfrac{3}{9 + 9 + 1} = \tfrac{3}{19}$. A negative $t$ does not make the torsion negative; here the triple product $(\mathbf r'\times\mathbf r'')\cdot\mathbf r''' = 12$ for every $t$. The value 3 is $\tau(0)$.
- id: mv-m2-r2-h05
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'The curve $\mathbf r(t) = \langle t,\, t^2 + 1,\, 2t - t^2\rangle$ has $\mathbf r''''''(t) = \mathbf 0$, so its torsion is 0. Which plane contains it?'
  choices: ['$x + y + z = 1$', '$2x + y - z = 1$', '$-2x + y + z = 1$', '$y - z = 1$']
  answer: 2
  explanation: |-
    Torsion 0 means the curve is planar. Adding, $y + z = 1 + 2t = 1 + 2x$, so $-2x + y + z = 1$ for every $t$. Check another choice: $x + y + z = 1 + 3t$ is not constant.
- id: mv-m2-r2-h06
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'Find the curvature and torsion of $\mathbf r(t) = \langle \cos t,\, -\sin t,\, t\rangle$, a helix that winds clockwise as it climbs.'
  choices: ['$\kappa = \tfrac12$, $\tau = \tfrac12$', '$\kappa = -\tfrac12$, $\tau = -\tfrac12$', '$\kappa = \tfrac12$, $\tau = 0$', '$\kappa = \tfrac12$, $\tau = -\tfrac12$']
  answer: 3
  explanation: |-
    $\mathbf r' = \langle -\sin t, -\cos t, 1\rangle$, $\mathbf r'' = \langle -\cos t, \sin t, 0\rangle$, $\mathbf r''' = \langle \sin t, \cos t, 0\rangle$. Then $\mathbf r'\times\mathbf r'' = \langle -\sin t, -\cos t, -1\rangle$, of length $\sqrt2$, and the triple product is $-\sin^2t - \cos^2t = -1$. So $\kappa = \sqrt2/(\sqrt2)^3 = \tfrac12$ and $\tau = -1/2$. This is a left-handed helix: curvature is never negative, but torsion is.
- id: mv-m2-r2-h07
  lesson: mv-m2-h-frenet-serret
  topic: Frenet–Serret formulas
  stem: 'A curve has constant curvature $\kappa = \tfrac{3}{25}$ and constant torsion $\tau = \tfrac{4}{25}$. Up to a rigid motion, which curve is it?'
  choices: ['$\langle 3\cos t,\, 3\sin t,\, 4t\rangle$', '$\langle 4\cos t,\, 4\sin t,\, 3t\rangle$', '$\langle 5\cos t,\, 5\sin t,\, 0\rangle$', '$\langle 3\cos t,\, 3\sin t,\, -4t\rangle$']
  answer: 0
  explanation: |-
    By the fundamental theorem of space curves it is a helix with $a = \dfrac{\kappa}{\kappa^2 + \tau^2} = \dfrac{3/25}{1/25} = 3$ and $b = \dfrac{\tau}{\kappa^2 + \tau^2} = 4$. Check: $\tfrac{a}{a^2 + b^2} = \tfrac{3}{25}$, $\tfrac{b}{a^2 + b^2} = \tfrac{4}{25}$. Swapping 3 and 4 swaps $\kappa$ and $\tau$; $-4t$ gives $\tau = -\tfrac{4}{25}$; the circle has $\tau = 0$.
- id: mv-m2-r2-h08
  lesson: mv-m2-h-frenet-serret
  topic: Frenet–Serret formulas
  stem: 'A clothoid transition 80 m long leads into a curve of radius 400 m, for trains at a constant 25 m/s. About what is the lateral jerk along the transition (ignoring cant)?'
  choices: ['$1.56\text{ m/s}^3$', '$0.49\text{ m/s}^3$', '$0.020\text{ m/s}^3$', '$39.1\text{ m/s}^3$']
  answer: 1
  explanation: |-
    Sideways acceleration grows linearly from 0 to $v^2/R = 625/400 \approx 1.56\text{ m/s}^2$ over $L/v = 3.2$ s, so the jerk is $\dfrac{v^3}{RL} = \dfrac{15{,}625}{32{,}000} \approx 0.49\text{ m/s}^3$. 1.56 is the final acceleration, 0.020 is $v^2/(RL)$, and 39.1 is $v^3/R$.
- id: mv-m2-r2-h09
  lesson: mv-m2-h-frenet-serret
  topic: Frenet–Serret formulas
  stem: 'Why do railways and highways use clothoid transition curves between a straight and a circular arc?'
  choices: ['The clothoid is the shortest path between the straight and the arc', 'Its curvature, and so the sideways acceleration at constant speed, builds up steadily instead of jumping', 'It makes the curvature constant all the way through the bend', 'It keeps the torsion of the track equal to its curvature']
  answer: 1
  explanation: |-
    A straight joined directly to a circle makes $\kappa$, and with it $a_N = \kappa v^2$, jump from 0 to $v^2/R$ at once. The clothoid's curvature $\kappa = s/A^2$ grows in proportion to distance, so sideways acceleration builds at a constant rate. A track in a plane has zero torsion.
- id: mv-m2-r2-h10
  lesson: mv-m2-h-frenet-serret
  type: text
  topic: Torsion
  stem: 'For the helix $\langle 3\cos t,\, 3\sin t,\, 4t\rangle$, $\kappa =$ ___ and $\tau =$ ___. Give exact fractions or decimals.'
  accept:
    - ['3/25']
    - ['4/25']
  explanation: |-
    With $a = 3$, $b = 4$: $a^2 + b^2 = 25$, so $\kappa = \tfrac{a}{a^2 + b^2} = \tfrac{3}{25} = 0.12$ and $\tau = \tfrac{b}{a^2 + b^2} = \tfrac{4}{25} = 0.16$.
- id: mv-m2-r2-h11
  lesson: mv-m2-h-frenet-serret
  type: match
  topic: Frenet–Serret formulas
  stem: 'Match each derivative (with respect to arc length) to its value.'
  pairs:
    - ['$d\mathbf T/ds$', κN]
    - ['$d\mathbf N/ds$', −κT + τB]
    - ['$d\mathbf B/ds$', −τN]
  distractors: [τT, κB]
  explanation: |-
    These are the Frenet–Serret formulas. Curvature couples $\mathbf T$ and $\mathbf N$, torsion couples $\mathbf N$ and $\mathbf B$, with opposite signs in each pair.
- id: mv-m2-r2-h12
  lesson: mv-m2-h-frenet-serret
  type: order
  topic: Torsion
  stem: 'Put the steps for computing the torsion of $\mathbf r(t)$ in order.'
  items:
    - 'Compute $\mathbf r''$, $\mathbf r''''$ and $\mathbf r''''''$'
    - 'Find the cross product $\mathbf r''\times\mathbf r''''$'
    - 'Dot that cross product with $\mathbf r''''''$'
    - 'Divide the result by $|\mathbf r''\times\mathbf r''''|^2$'
  explanation: |-
    $\tau = \dfrac{(\mathbf r'\times\mathbf r'')\cdot\mathbf r'''}{|\mathbf r'\times\mathbf r''|^2}$: derivatives first, then the cross product, then the triple product, and finally the division.
- id: mv-m2-r2-h13
  lesson: mv-m2-h-frenet-serret
  topic: Torsion
  stem: 'Which statements are true for a smooth curve with $\kappa > 0$? Select all that apply.'
  choices: ['If $\tau = 0$ everywhere, the curve lies in a plane', 'If $\kappa$ is constant, the curve lies in a plane', 'The torsion can be negative', 'Rotating or moving the curve does not change $\kappa$ or $\tau$', 'The binormal of a helix is a constant vector']
  answer: [0, 2, 3]
  explanation: |-
    $\tau = 0$ makes $\mathbf B$ constant, and then $(\mathbf r - \mathbf r_0)\cdot\mathbf B = 0$: the curve is planar. Constant curvature does not imply planar: a helix has constant $\kappa$ and is not flat, and its binormal turns with it. Torsion has a sign (negative for left-handed twisting). $\kappa$ and $\tau$ are intrinsic, unchanged by rigid motions.
- id: mv-m2-r2-h14
  lesson: mv-m2-h-frenet-serret
  topic: Frenet–Serret formulas
  stem: 'The Darboux vector $\boldsymbol\omega = \tau\mathbf T + \kappa\mathbf B$ gives the rate at which the whole frame turns per unit length. For the helix $\langle\cos t,\, \sin t,\, t\rangle$, what is $|\boldsymbol\omega|$?'
  choices: ['$\tfrac{\sqrt2}{2}$', '$1$', '$\tfrac12$', '$\sqrt2$']
  answer: 0
  explanation: |-
    Here $\kappa = \tau = \tfrac12$, and $\mathbf T$, $\mathbf B$ are perpendicular unit vectors, so $|\boldsymbol\omega| = \sqrt{\kappa^2 + \tau^2} = \sqrt{\tfrac14 + \tfrac14} = \tfrac{\sqrt2}{2} \approx 0.707$. Adding $\kappa + \tau = 1$ ignores that the two parts are perpendicular.
- id: mv-m2-r2-h15
  lesson: mv-m2-h-frenet-serret
  type: text
  topic: Frenet–Serret formulas
  stem: 'A clothoid transition 120 m long ends on a curve of radius 600 m. Through what angle does the track turn along the transition? ___ radians. Give only the number.'
  accept: ['0.1', '1/10']
  explanation: |-
    The tangent angle is $\theta(s) = s^2/(2A^2)$ with $A^2 = RL$, so at the end $\theta = \dfrac{L^2}{2RL} = \dfrac{L}{2R} = \dfrac{120}{1200} = 0.1$ rad (about $5.7^\circ$).

# ---------- Honors: Kepler's laws ----------
- id: mv-m2-r2-h16
  lesson: mv-m2-h-kepler
  type: label
  topic: Kepler's laws
  stem: 'The picture shows a planet''s elliptical orbit (eccentricity exaggerated) with two shaded sectors swept in equal times. Name the numbered parts.'
  image: {src: images/mv-m2-orbit-blank.svg, alt: 'An ellipse with a circle drawn at a point on its long axis, right of center, and a small dot at the center. Two shaded sectors start at the circle: a short wide one reaching the nearer end of the long axis and a long thin one reaching the farther end. Dots mark both ends of the long axis.'}
  labels:
    - {x: 65.2, y: 46.2, text: The Sun (at a focus)}
    - {x: 83.8, y: 46.2, text: Perihelion}
    - {x: 16.2, y: 46.2, text: Aphelion}
    - {x: 50.0, y: 46.2, text: Center of the ellipse}
  distractors: [Empty focus, End of the minor axis]
  explanation: |-
    1: the Sun sits at a focus, not at the center. 2: the end of the long axis nearest the Sun is the perihelion, where the planet moves fastest. 3: the farthest point is the aphelion. 4: the dot midway between the two ends of the long axis is the center of the ellipse. The other (empty) focus is the same distance on the other side of the center and is not marked.
- id: mv-m2-r2-h17
  lesson: mv-m2-h-kepler
  topic: Central forces
  stem: 'For a central force, why is $\mathbf h = \mathbf r\times\mathbf v$ constant?'
  choices: ['Because the speed is constant', 'Because $\mathbf h'' = \mathbf v\times\mathbf v + \mathbf r\times\mathbf a$ and both terms are $\mathbf 0$', 'Because $\mathbf r$ and $\mathbf v$ are always perpendicular', 'Because the force has an inverse-square magnitude']
  answer: 1
  explanation: |-
    By the product rule, $\mathbf h' = \mathbf v\times\mathbf v + \mathbf r\times\mathbf a$. The first term is zero for any motion, and the second is zero because a central acceleration is parallel to $\mathbf r$. The speed is not constant on an ellipse, $\mathbf r\perp\mathbf v$ only at perihelion and aphelion, and the inverse square is not needed.
- id: mv-m2-r2-h18
  lesson: mv-m2-h-kepler
  topic: Central forces
  stem: 'Which assumption is enough to prove Kepler''s second law (equal areas in equal times)?'
  choices: ['The orbit is an ellipse', 'The force has an inverse-square magnitude', 'The planet''s mass is much smaller than the Sun''s', 'The force is central (always along the line to the Sun)']
  answer: 3
  explanation: |-
    A central force keeps $\mathbf h$ constant, and $dA/dt = \tfrac12r^2\theta' = h/2$. Nothing about the inverse square, the shape of the orbit or the masses is used.
- id: mv-m2-r2-h19
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'A comet''s perihelion distance is 0.5 AU and its aphelion distance is 1.5 AU. How does its speed at perihelion compare with its speed at aphelion?'
  choices: ['3 times as fast', '$\tfrac13$ as fast', '9 times as fast', '$\sqrt3$ times as fast']
  answer: 0
  explanation: |-
    At both points the velocity is perpendicular to $\mathbf r$, so $h = rv$ there, and $h$ is constant: $0.5\,v_p = 1.5\,v_a$, so $v_p = 3v_a$. Squaring the ratio (9) or taking its root ($\sqrt3$) has no basis here.
- id: mv-m2-r2-h20
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'The same comet (perihelion 0.5 AU, aphelion 1.5 AU) orbits the Sun. What is its period?'
  choices: ['About 0.35 years', 'About 1.84 years', '1 year', '2 years']
  answer: 2
  explanation: |-
    The semi-major axis is the average distance, $a = \tfrac12(0.5 + 1.5) = 1$ AU, and $T^2 = a^3$ in years and AU, so $T = 1$ year, the same as Earth's despite the very different shape. Using 0.5 AU or 1.5 AU as $a$ gives about 0.35 or 1.84 years.
- id: mv-m2-r2-h21
  lesson: mv-m2-h-kepler
  type: text
  topic: Kepler's laws
  stem: 'Jupiter''s semi-major axis is about 5.2 AU. By Kepler''s third law its period is about ___ years. Round to 1 decimal place.'
  accept: ['11.9']
  explanation: |-
    $T = a^{3/2} = 5.2^{1.5} \approx 11.86$, about 11.9 years (the observed value is about 11.86 years).
- id: mv-m2-r2-h22
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'Satellite B orbits Earth with a semi-major axis 4 times that of satellite A. How do their periods compare?'
  choices: ['B''s period is 4 times A''s', 'B''s period is 16 times A''s', 'B''s period is 8 times A''s', 'B''s period is 2 times A''s']
  answer: 2
  explanation: |-
    $T \propto a^{3/2}$, so the ratio is $4^{3/2} = 8$. Scaling $T$ like $a$ gives 4, like $a^2$ gives 16.
- id: mv-m2-r2-h23
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'Satellite A is in a circular orbit of radius $r$ and satellite B in a circular orbit of radius $4r$ about the same planet. How does B''s speed compare with A''s?'
  choices: ['Half as fast', 'A quarter as fast', 'Twice as fast', 'The same speed']
  answer: 0
  explanation: |-
    In a circular orbit $v = \sqrt{GM/r}$, so quadrupling $r$ divides the speed by $\sqrt4 = 2$. Higher orbits are slower, even though they are longer.
- id: mv-m2-r2-h24
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'An orbit has polar equation $r = \dfrac{2}{1 + 0.5\cos\theta}$ (distances in AU). What is its semi-major axis?'
  choices: ['$2$ AU', '$\tfrac43$ AU', '$4$ AU', '$\tfrac83$ AU']
  answer: 3
  explanation: |-
    Here $p = 2$ and $e = 0.5$. Perihelion ($\theta = 0$): $2/1.5 = \tfrac43$; aphelion ($\theta = \pi$): $2/0.5 = 4$. So $a = \tfrac12\left(\tfrac43 + 4\right) = \tfrac83$, which matches $p/(1 - e^2) = 2/0.75$. The other choices are $p$, the perihelion and the aphelion.
- id: mv-m2-r2-h25
  lesson: mv-m2-h-kepler
  type: match
  topic: Kepler's laws
  stem: 'In $r = \dfrac{p}{1 + e\cos\theta}$, match each eccentricity to the shape of the orbit.'
  pairs:
    - ['$e = 0$', Circle]
    - ['$0 < e < 1$', Ellipse]
    - ['$e = 1$', Parabola]
    - ['$e > 1$', Hyperbola]
  distractors: [Straight line]
  explanation: |-
    $e = 0$ makes $r = p$ constant, a circle. For $0 < e < 1$ the denominator stays positive, so $r$ stays bounded: an ellipse. At $e = 1$ the denominator reaches 0 at $\theta = \pi$ (a parabola, escaping to infinity), and for $e > 1$ it reaches 0 at two angles (a hyperbola).
- id: mv-m2-r2-h26
  lesson: mv-m2-h-kepler
  type: order
  topic: Kepler's laws
  stem: 'Put the steps of the derivation of Kepler''s laws from Newton''s law in logical order.'
  items:
    - 'Show that $\mathbf h = \mathbf r\times\mathbf v$ is constant'
    - 'Integrate $(\mathbf v\times\mathbf h)'' = GM\,\mathbf u''$ to get $\mathbf v\times\mathbf h = GM\,\mathbf u + \mathbf c$'
    - 'Dot with $\mathbf r$ to get $r = \dfrac{h^2/GM}{1 + e\cos\theta}$'
    - 'Compare the ellipse''s area $\pi ab$ with the sweep rate $h/2$ to get $T^2 = \dfrac{4\pi^2}{GM}a^3$'
  explanation: |-
    The integration step needs $\mathbf h$ constant (so that $\mathbf a\times\mathbf h$ is the derivative of $\mathbf v\times\mathbf h$); the conic comes from that integral; the third law needs both the ellipse and the constant sweep rate.
- id: mv-m2-r2-h27
  lesson: mv-m2-h-kepler
  topic: Central forces
  stem: 'A planet moves on an elliptical orbit about a fixed Sun (no other forces). Which of these stay constant? Select all that apply.'
  choices: ['The vector $\mathbf h = \mathbf r\times\mathbf v$', 'The planet''s speed', 'The rate $dA/dt$ at which area is swept', 'The plane of the orbit', 'The planet''s acceleration vector']
  answer: [0, 2, 3]
  explanation: |-
    Gravity is central, so $\mathbf h$ is constant; hence $dA/dt = h/2$ is constant and the orbit stays in the plane perpendicular to $\mathbf h$. The speed changes (fastest at perihelion), and the acceleration $-GM\mathbf u/r^2$ changes direction and size all the time.
- id: mv-m2-r2-h28
  lesson: mv-m2-h-kepler
  type: text
  topic: Kepler's laws
  stem: 'A satellite moves in a circular orbit of radius 7,000 km about Earth''s center. With $GM = 3.986\times10^{5}\text{ km}^3/\text{s}^2$, its speed is ___ km/s. Round to 2 decimal places.'
  accept: ['7.55']
  explanation: |-
    $v = \sqrt{GM/r} = \sqrt{398{,}600/7{,}000} = \sqrt{56.94} \approx 7.546$, about 7.55 km/s.
- id: mv-m2-r2-h29
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'A student computes the speed of a geostationary satellite as $\sqrt{GM/r}$ with $r = 35{,}786$ km and gets about 3.34 km/s. The true speed is about 3.07 km/s. What went wrong?'
  choices: ['The formula should be $\sqrt{2GM/r}$', 'The student used the altitude instead of the distance from Earth''s center', 'The student should have used the Sun''s $GM$', 'Geostationary orbits are not circular']
  answer: 1
  explanation: |-
    $r$ is measured from Earth's center: $r \approx 35{,}786 + 6{,}378 = 42{,}164$ km, and $\sqrt{398{,}600/42{,}164} \approx 3.07$ km/s. With the altitude, $\sqrt{398{,}600/35{,}786} \approx 3.34$ km/s. $\sqrt{2GM/r}$ is the escape speed, not the orbital speed.
- id: mv-m2-r2-h30
  lesson: mv-m2-h-kepler
  topic: Kepler's laws
  stem: 'In Kepler''s third law in the form $T^2 = \dfrac{4\pi^2}{GM}a^3$ (central body treated as fixed), whose mass is $M$?'
  choices: ['The orbiting body''s', 'The mass of the orbiting body divided by the central body''s', 'The central body''s', 'Neither: $M$ is a fixed universal constant']
  answer: 2
  explanation: |-
    $M$ is the mass of the body being orbited (the Sun for planets, Earth for its satellites); the orbiting mass cancels from $\mathbf a = \mathbf F/m$. That is why every planet shares the same $T^2/a^3$. (The exact two-body law uses $G(M + m)$, which differs very little when $m \ll M$.)
