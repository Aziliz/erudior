# Module 3 (Partial derivatives), round 2: new question types for the core lessons, and the honors lessons

# Lesson 11: Functions of several variables
- id: mv-m3-r2-q01
  lesson: mv-several-vars
  module_quiz: true
  topic: Level curves
  type: label
  stem: 'Name the numbered features of this contour map. The numbers on the curves are the function values.'
  image: {src: images/mv-m3-contour-terrain-blank.svg, alt: 'A contour map. On the left, closed loops labeled 0.5 up to 2.5 crowd together around a center. On the right, wider-spaced loops labeled 0.5 up to 2 surround another center. Between the two groups the curve labeled 0.5 pinches into an hourglass. Below, loops labeled −0.5, −1 and −1.5 surround a center. Five places are numbered.'}
  labels:
    - {x: 30.5, y: 41.6, text: 'Peak'}
    - {x: 49.0, y: 42.7, text: 'Saddle point (pass)'}
    - {x: 53.6, y: 78.1, text: 'Pit'}
    - {x: 18.8, y: 41.6, text: 'Steep slope'}
    - {x: 84.8, y: 44.4, text: 'Gentle slope'}
  distractors: ['Point where two level curves cross', 'Flat plateau']
  explanation: |-
    1 is inside loops whose values rise to 2.5: a peak. 3 is inside loops whose values fall to −1.5: a pit. At 2 the 0.5 curve pinches into an hourglass between the two peaks: a saddle point, lower than both peaks but higher than the valleys on either side of the gap. At 4 the curves for equally spaced values are packed close together (steep); at 5 they are far apart (gentle). Different level curves never cross, since each point has only one value.
- id: mv-m3-r2-q02
  lesson: mv-several-vars
  topic: Level curves
  type: text
  stem: 'For $f(x, y) = x^2 + y^2$, the level curve through $(3, 4)$ is $x^2 + y^2 = c$ with $c =$ ___, a circle of radius ___. Give only the numbers.'
  accept:
    - ['25']
    - ['5']
  explanation: |-
    $c = f(3, 4) = 9 + 16 = 25$, and $x^2 + y^2 = 25$ is the circle of radius $\sqrt{25} = 5$ centered at the origin.
- id: mv-m3-r2-q03
  lesson: mv-several-vars
  module_quiz: true
  topic: Level curves
  type: match
  stem: 'Match each function with the shape of its level curves $f(x, y) = c$ (for typical values of $c$).'
  pairs:
    - ['$f = x^2 + y^2$', 'Circles centered at the origin']
    - ['$f = 2x + 3y$', 'Parallel lines']
    - ['$f = y - x^2$', 'Parabolas, all shifted copies of one parabola']
    - ['$f = xy$', 'Hyperbolas']
    - ['$f = x^2 + 4y^2$', 'Ellipses']
  distractors: ['Spheres']
  explanation: |-
    $x^2 + y^2 = c$ is a circle; $2x + 3y = c$ is a line of slope $-\tfrac23$ for every $c$; $y = x^2 + c$ is the same parabola shifted up or down; $xy = c$ is a hyperbola for $c \ne 0$ (the two axes for $c = 0$); $x^2 + 4y^2 = c$ is an ellipse. Spheres are level surfaces of functions of three variables, not level curves.
- id: mv-m3-r2-q04
  lesson: mv-several-vars
  topic: Domain and range
  stem: 'Which points are in the domain of $f(x, y) = \dfrac{\sqrt{x + y + 1}}{x - 1}$? Select all that apply.'
  choices: ['$(0, 0)$', '$(1, 5)$', '$(-2, 1)$', '$(-3, 1)$', '$(2, -2)$']
  answer: [0, 2, 4]
  explanation: |-
    The domain needs $x + y + 1 \ge 0$ and $x \ne 1$.
    $(0, 0)$: $1 \ge 0$, $x = 0$. In.
    $(1, 5)$: $x = 1$ makes the denominator 0. Out.
    $(-2, 1)$: $x + y + 1 = 0$, and $\sqrt0 = 0$ is fine; $x = -2$. In.
    $(-3, 1)$: $x + y + 1 = -1 < 0$. Out.
    $(2, -2)$: $x + y + 1 = 1$, $x = 2$. In.
- id: mv-m3-r2-q05
  lesson: mv-several-vars
  topic: Level curves
  type: text
  stem: 'The level surfaces of $f(x, y, z) = x + 2y + 3z$ are parallel ___.'
  accept: [planes, plane]
  explanation: |-
    $x + 2y + 3z = c$ is a plane with normal vector $\langle 1, 2, 3\rangle$ for every $c$, so the level surfaces are parallel planes.

# Lesson 12: Limits and continuity
- id: mv-m3-r2-q06
  lesson: mv-limits
  module_quiz: true
  topic: Limits of several variables
  type: order
  stem: 'Put the steps of this proof that $\displaystyle\lim_{(x,y)\to(0,0)}\frac{3x^2y}{x^2 + y^2} = 0$ in order.'
  items:
    - 'Substitute $x = r\cos\theta$, $y = r\sin\theta$'
    - 'Simplify the fraction to $3r\cos^2\theta\sin\theta$'
    - 'Bound it: $|3r\cos^2\theta\sin\theta| \le 3r$, whatever $\theta$ is'
    - 'Let $r \to 0^+$: the bound goes to 0, so the limit is 0'
  explanation: |-
    Polar substitution first; then the $r^2$ cancels, leaving $\dfrac{3r^3\cos^2\theta\sin\theta}{r^2} = 3r\cos^2\theta\sin\theta$. Since $|\cos^2\theta\sin\theta| \le 1$, the bound $3r$ does not depend on $\theta$, and it goes to 0, so by the squeeze theorem the limit is 0.
- id: mv-m3-r2-q07
  lesson: mv-limits
  topic: Limits of several variables
  type: text
  stem: 'Along the line $y = 2x$ (with $x \ne 0$), the function $\dfrac{x^2 - y^2}{x^2 + y^2}$ is constant. What is its value? Give an exact number.'
  accept: ['-3/5']
  explanation: |-
    Substitute $y = 2x$: $\dfrac{x^2 - 4x^2}{x^2 + 4x^2} = \dfrac{-3x^2}{5x^2} = -\dfrac35$. Along the $x$-axis the value is 1, so this is another way to see the limit at the origin does not exist.
- id: mv-m3-r2-q08
  lesson: mv-limits
  module_quiz: true
  topic: Limits of several variables
  stem: 'Which limits at $(0, 0)$ exist? Select all that apply.'
  choices: ['$\displaystyle\lim\frac{3x^2y}{x^2 + y^2}$', '$\displaystyle\lim\frac{x^2 - y^2}{x^2 + y^2}$', '$\displaystyle\lim\frac{xy}{x^2 + y^2}$', '$\displaystyle\lim\frac{x^3 + y^3}{x^2 + y^2}$', '$\displaystyle\lim\frac{xy^2}{x^2 + y^4}$']
  answer: [0, 3]
  explanation: |-
    The first and fourth have numerator degree 3 over denominator degree 2; in polar form they are $3r\cos^2\theta\sin\theta$ and $r(\cos^3\theta + \sin^3\theta)$, both bounded by a multiple of $r$, so both limits are 0.
    The second is $\cos2\theta$ in polar form (1 on the $x$-axis, $-1$ on the $y$-axis). The third is 0 on the axes but $\tfrac12$ on $y = x$. The fifth is 0 on every line but $\tfrac12$ on $x = y^2$. None of those three has a limit.
- id: mv-m3-r2-q09
  lesson: mv-limits
  topic: Limits of several variables
  type: match
  stem: 'Match each method with the job it does.'
  pairs:
    - ['Two-path test', 'Proves that a limit does not exist']
    - ['Direct substitution', 'Works when the function is continuous at the point']
    - ['Squeeze theorem', 'Proves a limit exists by trapping the function']
    - ['Factoring and canceling', 'Removes a common factor that causes 0/0']
  distractors: ['Proves a limit exists by checking every straight line']
  explanation: |-
    Two paths with different limits prove nonexistence. Substitution is valid exactly when the function is continuous there. The squeeze theorem traps $|f - L|$ under something that goes to 0. Canceling a common factor, as in $\tfrac{x^2 - y^2}{x - y} = x + y$, removes the 0/0. Checking every line proves nothing: $\tfrac{xy^2}{x^2 + y^4}$ is 0 along every line and still has no limit.
- id: mv-m3-r2-q10
  lesson: mv-limits
  topic: Continuity
  type: text
  stem: 'The function $f(x, y) = \dfrac{3x^2y}{x^2 + y^2}$ is undefined at the origin. To make it continuous everywhere, define $f(0, 0) =$ ___.'
  accept: ['0']
  explanation: |-
    The limit at the origin is 0 (squeeze: $|f| \le 3|y|$). Defining $f(0, 0) = 0$ makes the value match the limit, so $f$ becomes continuous there too.

# Lesson 13: Partial derivatives
- id: mv-m3-r2-q11
  lesson: mv-partials
  module_quiz: true
  topic: Partial derivatives
  type: label
  stem: 'This picture shows the geometric meaning of $f_x(a, b)$. Name the numbered parts.'
  image: {src: images/mv-m3-partial-slice-blank.svg, alt: 'A dome-shaped surface with x, y and z axes. A vertical plane slices through the dome, and the curve where they meet is drawn in red. A green line touches the red curve at a marked point. Five places are numbered.'}
  labels:
    - {x: 63.0, y: 53.9, text: 'Surface z = f(x, y)'}
    - {x: 32.7, y: 79.5, text: 'Plane y = b'}
    - {x: 37.5, y: 54.3, text: 'Trace z = f(x, b)'}
    - {x: 66.2, y: 46.6, text: 'Tangent line with slope fx(a, b)'}
    - {x: 57.5, y: 42.8, text: 'Point (a, b, f(a, b))'}
  distractors: ['Level curve f(x, y) = c', 'Plane x = a']
  explanation: |-
    Holding $y = b$ fixed means slicing the surface (1) with the vertical plane $y = b$ (2). The slice is the trace curve $z = f(x, b)$ (3), a graph of one variable. At the point $(a, b, f(a, b))$ (5), the slope of the tangent line to the trace (4) is $f_x(a, b)$. Level curves are horizontal slices drawn in the $xy$-plane, and the plane $x = a$ would give $f_y$ instead.
- id: mv-m3-r2-q12
  lesson: mv-partials
