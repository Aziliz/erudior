  type: text
  stem: 'For $f(x, y) = x^2y - 3xy^3$, $f_y(2, 1) =$ ___. Give only the number.'
  accept: ['-14']
  explanation: |-
    Holding $x$ fixed, $f_y = x^2 - 9xy^2$. At $(2, 1)$: $4 - 18 = -14$.
- id: mv-m3-r2-q13
  lesson: mv-partials
  topic: Higher-order partials
  type: match
  stem: 'Match each notation with what it tells you to do to $f$.'
  pairs:
    - ['$f_{xy}$', 'Differentiate in x, then in y']
    - ['$\dfrac{\partial^2 f}{\partial x\,\partial y}$', 'Differentiate in y, then in x']
    - ['$f_{xx}$', 'Differentiate in x twice']
    - ['$\dfrac{\partial f}{\partial y}$', 'Differentiate in y once, holding x constant']
  distractors: ['Differentiate in x once, holding x constant']
  explanation: |-
    Subscripts read left to right: $f_{xy} = (f_x)_y$. Fraction notation reads right to left: $\dfrac{\partial^2 f}{\partial x\,\partial y} = \dfrac{\partial}{\partial x}\left(\dfrac{\partial f}{\partial y}\right) = f_{yx}$. For continuous mixed partials the two agree (Clairaut), but the orders are still different instructions.
- id: mv-m3-r2-q14
  lesson: mv-partials
  module_quiz: true
  topic: Higher-order partials
  stem: 'Let $f(x, y) = x^2e^y + y^3$. Which of these are correct? Select all that apply.'
  choices: ['$f_x = 2xe^y$', '$f_{xx} = 2xe^y$', '$f_y = x^2e^y + 3y^2$', '$f_{xy} = 2xe^y$', '$f_{yy} = x^2e^y + 3y$']
  answer: [0, 2, 3]
  explanation: |-
    $f_x = 2xe^y$ and $f_y = x^2e^y + 3y^2$. Then $f_{xx} = 2e^y$ (not $2xe^y$), $f_{xy} = \partial_y(2xe^y) = 2xe^y$ (and $f_{yx} = \partial_x(x^2e^y + 3y^2) = 2xe^y$ agrees), and $f_{yy} = x^2e^y + 6y$ (not $3y$).
- id: mv-m3-r2-q15
  lesson: mv-partials
  topic: Higher-order partials
  type: text
  stem: '$u = e^{-4t}\sin(kx)$ satisfies the heat equation $u_t = u_{xx}$ when $k =$ ___. Give the positive value.'
  accept: ['2']
  explanation: |-
    $u_t = -4e^{-4t}\sin kx$ and $u_{xx} = -k^2e^{-4t}\sin kx$. They are equal when $k^2 = 4$, so $k = 2$.

# Lesson 14: Tangent planes and linear approximation
- id: mv-m3-r2-q16
  lesson: mv-tangent-planes
  topic: Tangent planes
  type: text
  stem: 'The tangent plane to $z = xy^2$ at $(2, 1, 2)$ is $z = ax + by + c$ with $a =$ ___, $b =$ ___ and $c =$ ___.'
  accept:
    - ['1']
    - ['4']
    - ['-4']
  explanation: |-
    $f_x = y^2 = 1$ and $f_y = 2xy = 4$ at $(2, 1)$. So $z = 2 + 1(x - 2) + 4(y - 1) = x + 4y - 4$. Check: at $(2, 1)$, $2 + 4 - 4 = 2$.
- id: mv-m3-r2-q17
  lesson: mv-tangent-planes
  module_quiz: true
  topic: Linear approximation and differentials
  type: order
  stem: 'Put the steps of estimating $f(x, y)$ near a convenient point by linear approximation in order.'
  items:
    - 'Choose a nearby base point $(a, b)$ where $f$ is easy to compute'
    - 'Compute $f(a, b)$, $f_x(a, b)$ and $f_y(a, b)$'
    - 'Substitute those three values into $L(x, y) = f(a, b) + f_x(a, b)(x - a) + f_y(a, b)(y - b)$'
    - 'Evaluate $L$ at the point you want'
  explanation: |-
    The base point comes first, since every value in $L$ is computed there. With those numbers you can write $L$, and only then evaluate it. In Lesson 14's example: base $(3, 4)$, values $5, \tfrac35, \tfrac45$, then $L(3.02, 3.97) = 4.988$.
- id: mv-m3-r2-q18
  lesson: mv-tangent-planes
  module_quiz: true
  topic: Tangent planes
  stem: 'Which statements are true for a function $f(x, y)$ and a point $(a, b)$? Select all that apply.'
  choices: ['If $f_x$ and $f_y$ exist near $(a, b)$ and are continuous at $(a, b)$, then $f$ is differentiable at $(a, b)$', 'If $f$ is differentiable at $(a, b)$, then $f$ is continuous at $(a, b)$', 'If $f_x(a, b)$ and $f_y(a, b)$ both exist, then $f$ is continuous at $(a, b)$', 'If $f$ is continuous at $(a, b)$, then $f$ is differentiable at $(a, b)$', 'If $f$ is differentiable at $(a, b)$, then $f_x(a, b)$ and $f_y(a, b)$ exist']
  answer: [0, 1, 4]
  explanation: |-
    The first is the working test from the lesson. Differentiable functions are continuous and have both partials. The third is false: $\tfrac{xy}{x^2 + y^2}$ (with value 0 at the origin) has both partials at the origin but is not continuous there. The fourth is false: $\sqrt{x^2 + y^2}$ is continuous at the origin but has no tangent plane there (it is a cone's tip).
- id: mv-m3-r2-q19
  lesson: mv-tangent-planes
  topic: Linear approximation and differentials
  type: text
  stem: 'For $z = x^2y$ at $(3, 2)$ with $dx = 0.1$ and $dy = -0.05$, the differential is $dz =$ ___.'
  accept: ['0.75']
  explanation: |-
    $dz = 2xy\,dx + x^2\,dy = 12(0.1) + 9(-0.05) = 1.2 - 0.45 = 0.75$.
- id: mv-m3-r2-q20
  lesson: mv-tangent-planes
  topic: Linear approximation and differentials
  type: match
  stem: 'Match each expression (for $z = f(x, y)$ near $(a, b)$) with its name.'
  pairs:
    - ['$\langle f_x(a,b),\, f_y(a,b),\, -1\rangle$', 'Normal vector to the tangent plane']
    - ['$f_x\,dx + f_y\,dy$', 'Differential dz']
    - ['$f(a,b) + f_x(a,b)(x - a) + f_y(a,b)(y - b)$', 'Linearization L(x, y)']
    - ['$f(a + dx,\, b + dy) - f(a, b)$', 'Actual change in z']
  distractors: ['Second-order partial derivative']
  explanation: |-
    The tangent plane $z - f(a,b) = f_x(x - a) + f_y(y - b)$ has normal $\langle f_x, f_y, -1\rangle$. The differential is the change along the tangent plane; it approximates the actual change $\Delta z = f(a + dx, b + dy) - f(a, b)$. The linearization is the function whose graph is the tangent plane.

# Lesson 15: The chain rule
- id: mv-m3-r2-q21
  lesson: mv-chain-rule
  topic: Implicit differentiation
  type: order
  stem: 'Put the steps for finding $\partial z/\partial x$ from an equation such as $x^2z + yz^3 = 5 - xy$ in order.'
  items:
    - 'Move every term to one side to write the equation as $F(x, y, z) = 0$'
    - 'Compute the partial derivatives $F_x$ and $F_z$'
    - 'Form $\partial z/\partial x = -F_x/F_z$'
    - 'Substitute the coordinates of the point, if one is given, into that formula'
  explanation: |-
    The formula $-F_x/F_z$ only applies to an equation of the form $F = 0$, so rearranging comes first: here $F = x^2z + yz^3 + xy - 5$. Then $F_x = 2xz + y$ and $F_z = x^2 + 3yz^2$, so $\partial z/\partial x = -\dfrac{2xz + y}{x^2 + 3yz^2}$, and finally plug in a point.
- id: mv-m3-r2-q22
  lesson: mv-chain-rule
  module_quiz: true
  topic: Multivariable chain rule
  type: text
  stem: 'Let $z = x^2y$ with $x = t^2$ and $y = 3t$. At $t = 1$, $\dfrac{dz}{dt} =$ ___.'
  accept: ['15']
  explanation: |-
    $z_x = 2xy$, $z_y = x^2$, $x'(t) = 2t$, $y'(t) = 3$. At $t = 1$: $x = 1$, $y = 3$, so $\dfrac{dz}{dt} = (6)(2) + (1)(3) = 15$. Check by substituting first: $z = 3t^5$, $z'(1) = 15$.
- id: mv-m3-r2-q23
  lesson: mv-chain-rule
  topic: Multivariable chain rule
  type: match
  stem: 'Match each situation with the number of terms (tree paths) in the requested derivative.'
  pairs:
    - ['$z = f(x, y)$; $x$, $y$ functions of $t$; find $dz/dt$', '2 terms']
    - ['$w = f(x, y, z)$; $x$, $y$, $z$ functions of $t$; find $dw/dt$', '3 terms']
    - ['$z = f(x, y)$; $x = g(s, t)$, $y = h(s)$; find $\partial z/\partial t$', '1 term']
    - ['$z = f(x, y)$; $x$, $y$ functions of $s$, $t$, $u$; find $\partial z/\partial u$', '2 terms']
  distractors: ['6 terms']
  explanation: |-
    Count the paths from the top variable down to the one you differentiate with respect to: one per intermediate variable that depends on it. In the third case only $x$ depends on $t$, so $\partial z/\partial t = z_x\,x_t$. In the fourth, $x$ and $y$ both depend on $u$: two paths, however many other independent variables there are.
- id: mv-m3-r2-q24
  lesson: mv-chain-rule
  topic: Implicit differentiation
  stem: 'Suppose $F(x, y, z) = 0$ defines $z$ as a differentiable function of $x$ and $y$ near a point. Which statements are correct? Select all that apply.'
  choices: ['$\dfrac{\partial z}{\partial x} = -\dfrac{F_x}{F_z}$', '$\dfrac{\partial z}{\partial y} = -\dfrac{F_y}{F_z}$', '$\dfrac{\partial z}{\partial x} = \dfrac{F_x}{F_z}$', 'These formulas need $F_z \ne 0$ at the point', '$\dfrac{\partial z}{\partial y} = -\dfrac{F_z}{F_y}$']
  answer: [0, 1, 3]
  explanation: |-
    Differentiating $F(x, y, z(x, y)) = 0$ with respect to $x$ gives $F_x + F_z z_x = 0$, so $z_x = -F_x/F_z$; likewise $z_y = -F_y/F_z$. Dividing by $F_z$ needs $F_z \ne 0$ (the implicit function theorem's hypothesis). Dropping the minus sign or flipping the fraction gives wrong answers.
- id: mv-m3-r2-q25
  lesson: mv-chain-rule
  module_quiz: true
  topic: Implicit differentiation
  type: text
  stem: 'The curve $x^2 + xy + y^2 = 7$ passes through $(1, 2)$. There, $\dfrac{dy}{dx} =$ ___. Give an exact number.'
  accept: ['-4/5']
  explanation: |-
    $F = x^2 + xy + y^2 - 7$, so $F_x = 2x + y = 4$ and $F_y = x + 2y = 5$ at $(1, 2)$. Then $\dfrac{dy}{dx} = -\dfrac{F_x}{F_y} = -\dfrac45$.

# Lesson 16: Directional derivatives and the gradient
- id: mv-m3-r2-q26
  lesson: mv-gradient
  module_quiz: true
  topic: The gradient
  type: label
  stem: 'Three level curves of $f$ are drawn, labeled with their values, and several directions start at the point $P$. Name the numbered items.'
  image: {src: images/mv-m3-gradient-directions-blank.svg, alt: 'Three nested ellipses labeled 3, 6 and 10 from the inside out. A point P lies on the middle ellipse. From P, one arrow points outward across the ellipses, one points the opposite way, a dashed double arrow runs along the ellipse, and another arrow makes an angle theta with the first arrow. Five places are numbered.'}
  labels:
    - {x: 60.2, y: 29.0, text: 'Direction of the gradient (steepest ascent)'}
    - {x: 39.8, y: 59.5, text: 'Direction of steepest descent'}
    - {x: 60.2, y: 59.5, text: 'Direction where the rate of change is 0'}
    - {x: 47.5, y: 23.0, text: 'Direction at angle θ to the gradient'}
    - {x: 19.1, y: 76.5, text: 'Level curve f = 6'}
  distractors: ['Level curve f = 10', 'Direction of the positive x-axis']
  explanation: |-
    The gradient (1) is perpendicular to the level curve and points toward higher values (from 6 toward 10). Its opposite (2) is steepest descent. Along the level curve (3) $f$ does not change, so the rate is 0. A general unit direction (4) at angle $\theta$ to the gradient has rate $|\nabla f|\cos\theta$. Item 5 is on the middle curve, the one through $P$, labeled 6.
- id: mv-m3-r2-q27
  lesson: mv-gradient
  topic: Directional derivatives
  type: order
  stem: 'At a point where $\nabla f \ne \mathbf 0$, order these unit directions by the directional derivative of $f$, from largest to smallest.'
  items:
    - 'Along $\nabla f$ ($\theta = 0°$)'
    - 'At $\theta = 60°$ from $\nabla f$'
    - 'Along the level curve ($\theta = 90°$)'
    - 'At $\theta = 120°$ from $\nabla f$'
    - 'Along $-\nabla f$ ($\theta = 180°$)'
  explanation: |-
    $D_{\mathbf u}f = |\nabla f|\cos\theta$, and $\cos\theta$ decreases from $1$ to $-1$ as $\theta$ goes from $0°$ to $180°$: the rates are $|\nabla f|$, $\tfrac12|\nabla f|$, $0$, $-\tfrac12|\nabla f|$, $-|\nabla f|$.
- id: mv-m3-r2-q28
  lesson: mv-gradient
  topic: The gradient
  type: text
  stem: 'For $f(x, y) = x^2 + xy$, $\nabla f(1, 3) = \langle$ ___ , ___ $\rangle$.'
  accept:
    - ['5']
    - ['1']
  explanation: |-
    $f_x = 2x + y = 5$ and $f_y = x = 1$ at $(1, 3)$, so $\nabla f(1, 3) = \langle 5, 1\rangle$.
- id: mv-m3-r2-q29
  lesson: mv-gradient
  module_quiz: true
  topic: Directional derivatives
  stem: 'At a point $P$, $\nabla f(P) = \langle 3, 4\rangle$. Which statements are true? Select all that apply.'
  choices: ['The maximum rate of change of $f$ at $P$ is 5', 'The directional derivative toward $\langle 4, -3\rangle$ is 0', '$f$ decreases fastest in the direction of $\langle -3, -4\rangle$', 'The directional derivative toward $\langle 1, 0\rangle$ is 4', 'Some directional derivative at $P$ equals 7']
  answer: [0, 1, 2]
  explanation: |-
    $|\nabla f| = \sqrt{9 + 16} = 5$ is the maximum rate. $\langle 4, -3\rangle\cdot\langle 3, 4\rangle = 0$, so that direction runs along the level curve. Steepest descent is $-\nabla f = \langle -3, -4\rangle$. Toward $\mathbf i$ the rate is $f_x = 3$, not 4. No directional derivative can exceed $|\nabla f| = 5$.
- id: mv-m3-r2-q30
  lesson: mv-gradient
  topic: Directional derivatives
  type: text
  stem: 'For $f(x, y) = xy$, the directional derivative at $(2, 3)$ in the direction of $\mathbf v = \langle 3, 4\rangle$ is ___. Give an exact number.'
  accept: ['17/5']
  explanation: |-
    $\nabla f = \langle y, x\rangle = \langle 3, 2\rangle$. Normalize: $\mathbf u = \langle \tfrac35, \tfrac45\rangle$. Then $D_{\mathbf u}f = \tfrac95 + \tfrac85 = \tfrac{17}{5} = 3.4$. (Using $\mathbf v$ without normalizing gives 17, five times too big.)

# Honors 16h1: Differentiability in depth
- id: mv-m3-r2-h01
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: '$f$ is differentiable at $(a, b)$ if $\dfrac{E(h,k)}{\sqrt{h^2 + k^2}} \to 0$, where $E = f(a + h, b + k) - f(a, b) - Ah - Bk$. What must $A$ and $B$ be?'
  choices: ['$f_x(a, b)$ and $f_y(a, b)$', 'Any numbers, as long as $E \to 0$', '$f(a, b)$ and $0$', '$f_{xx}(a, b)$ and $f_{yy}(a, b)$']
  answer: 0
  explanation: |-
    Setting $k = 0$, the condition says $\dfrac{f(a + h, b) - f(a, b)}{h} \to A$, so $A = f_x(a, b)$; likewise $B = f_y(a, b)$. Merely having $E \to 0$ holds for any $A$, $B$ when $f$ is continuous; the definition demands that $E$ be small compared with the distance.
- id: mv-m3-r2-h02
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'For $f(x, y) = xy$ at $(1, 2)$, what is the error term $E(h, k) = f(1 + h, 2 + k) - f(1, 2) - f_x(1,2)h - f_y(1,2)k$?'
  choices: ['$2h + k$', '$hk$', '$h^2 + k^2$', '$2 + hk$']
  answer: 1
  explanation: |-
    $f(1 + h, 2 + k) = 2 + 2h + k + hk$, and $f_x = 2$, $f_y = 1$ at $(1, 2)$. Subtracting $2 + 2h + k$ leaves $E = hk$. Since $|hk| \le \tfrac12(h^2 + k^2)$, $|E|/\rho \le \rho/2 \to 0$.
- id: mv-m3-r2-h03
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'Suppose $f$ is differentiable at $(a, b)$. Which must be true? Select all that apply.'
  choices: ['$f$ is continuous at $(a, b)$', '$f_x(a, b)$ and $f_y(a, b)$ exist', '$D_{\mathbf u}f(a, b) = \nabla f(a, b)\cdot\mathbf u$ for every unit vector $\mathbf u$', '$f_x$ and $f_y$ are continuous at $(a, b)$', '$f_{xy}(a, b) = f_{yx}(a, b)$']
  answer: [0, 1, 2]
  explanation: |-
    The first three follow from the definition (facts 1–3 of the lesson). The fourth fails: $(x^2 + y^2)\sin(1/\sqrt{x^2 + y^2})$ is differentiable at the origin with discontinuous partials. The fifth is not even about first derivatives; second partials need not exist, and when they do, they can differ without continuity.
- id: mv-m3-r2-h04
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'Let $f(x, y) = \dfrac{x^2y}{x^2 + y^2}$, $f(0, 0) = 0$. For a unit vector $\mathbf u = \langle u_1, u_2\rangle$, what is $D_{\mathbf u}f(0, 0)$?'
  choices: ['$0$', '$u_1u_2^2$', '$u_1^2u_2$', '$2u_1u_2$']
  answer: 2
  explanation: |-
    $f(tu_1, tu_2) = \dfrac{t^3u_1^2u_2}{t^2(u_1^2 + u_2^2)} = t\,u_1^2u_2$ (since $u_1^2 + u_2^2 = 1$). Dividing by $t$ and letting $t \to 0$ gives $u_1^2u_2$. The answer 0 is what $\nabla f(0,0)\cdot\mathbf u$ would give, which is why $f$ is not differentiable.
- id: mv-m3-r2-h05
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: '$f(x, y) = \dfrac{x^2y}{x^2 + y^2}$ (with $f(0,0) = 0$) is continuous at the origin and has a directional derivative there in every direction. Why is it still not differentiable there?'
  choices: ['$f_x(0, 0)$ does not exist', 'It is not continuous along the parabola $x = y^2$', 'Its second partials are unequal at the origin', 'Its directional derivatives are not equal to $\nabla f(0,0)\cdot\mathbf u$']
  answer: 3
  explanation: |-
    Both partials are 0, so a differentiable $f$ would have $D_{\mathbf u}f(0,0) = 0$ in every direction. But $D_{\mathbf u}f(0,0) = u_1^2u_2$, which is $\tfrac{1}{2\sqrt2} \approx 0.354$ toward $\langle 1, 1\rangle$. The directional slopes are not a linear function of $\mathbf u$, so no tangent plane fits.
- id: mv-m3-r2-h06
  lesson: mv-h-differentiability
  topic: Differentiability
  type: text
  stem: 'For $f(x, y) = \dfrac{x^2y}{x^2 + y^2}$ with $f(0, 0) = 0$, the directional derivative at the origin in the direction of $\langle 3, 4\rangle$ is ___. Give an exact fraction.'
  accept: ['36/125']
  explanation: |-
    The unit vector is $\langle \tfrac35, \tfrac45\rangle$, and $D_{\mathbf u}f(0,0) = u_1^2u_2 = \tfrac{9}{25}\cdot\tfrac45 = \tfrac{36}{125} = 0.288$.
- id: mv-m3-r2-h07
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'For $f(x, y) = \dfrac{xy^2}{x^2 + y^4}$ with $f(0, 0) = 0$, which is true at the origin?'
  choices: ['$f$ is differentiable', 'Every directional derivative exists, but $f$ is not continuous', 'No directional derivative exists', '$f$ is continuous, but $f_x(0,0)$ does not exist']
  answer: 1
  explanation: |-
    For $u_1 \ne 0$, $f(t\mathbf u)/t = \dfrac{u_1u_2^2}{u_1^2 + t^2u_2^4} \to \dfrac{u_2^2}{u_1}$, and along the $y$-axis $f = 0$, so every directional derivative exists. Yet $f = \tfrac12$ along $x = y^2$, so $f$ is not continuous, and therefore not differentiable.
- id: mv-m3-r2-h08
  lesson: mv-h-differentiability
  topic: Differentiability
  type: order
  stem: 'Put the steps of the proof that continuous partial derivatives imply differentiability in order.'
  items:
    - 'Split the change $f(a + h, b + k) - f(a, b)$ into an $x$-leg and a $y$-leg'
    - 'Apply the mean value theorem to each leg'
    - 'Subtract $f_x(a,b)h + f_y(a,b)k$ to write $E$ as a bracket times $h$ plus a bracket times $k$'
    - 'Divide by $\rho = \sqrt{h^2 + k^2}$, using $|h|/\rho \le 1$ and $|k|/\rho \le 1$'
    - 'Use continuity of $f_x$ and $f_y$ to send both brackets to 0'
  explanation: |-
    The two legs turn a two-variable change into two one-variable changes, where the mean value theorem applies: $f_x(c_1, b + k)h + f_y(a, c_2)k$. Subtracting the linear part leaves brackets like $f_x(c_1, b + k) - f_x(a, b)$. After dividing by $\rho$, those brackets are all that remain, and continuity of the partials makes them go to 0.
- id: mv-m3-r2-h09
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'Let $f(x, y) = (x^2 + y^2)\sin\!\left(1/\sqrt{x^2 + y^2}\right)$ with $f(0, 0) = 0$. Which is true at the origin?'
  choices: ['$f$ is not continuous', '$f$ is not differentiable, because $f_x$ has no limit there', '$f$ is differentiable, but $f_x$ and $f_y$ are not continuous there', '$f$ is differentiable, and its partials are continuous there']
  answer: 2
  explanation: |-
    $|f| \le x^2 + y^2 = \rho^2$, so with $A = B = 0$ the error ratio is at most $\rho \to 0$: differentiable, with tangent plane $z = 0$. But on the positive $x$-axis $f_x = 2x\sin(1/x) - \cos(1/x)$, which oscillates as $x \to 0^+$. Continuous partials are sufficient for differentiability, not necessary.
- id: mv-m3-r2-h10
  lesson: mv-h-differentiability
  topic: Differentiability
  type: match
  stem: 'Each function is defined to be 0 at the origin. Match it with its behavior at the origin.'
  pairs:
    - ['$\dfrac{xy}{x^2 + y^2}$', 'Both partials exist, but not continuous']
    - ['$\dfrac{x^2y}{x^2 + y^2}$', 'Continuous with every directional derivative, but not differentiable']
    - ['$(x^2 + y^2)\sin\dfrac{1}{\sqrt{x^2 + y^2}}$', 'Differentiable, but the partials are not continuous']
    - ['$\dfrac{xy(x^2 - y^2)}{x^2 + y^2}$', 'The mixed partials are unequal']
  distractors: ['Not continuous, and neither partial exists']
  explanation: |-
    These are the lesson's counterexamples. $\tfrac{xy}{x^2+y^2}$ is 0 on the axes but $\tfrac12$ on $y = x$. $\tfrac{x^2y}{x^2+y^2}$ has slopes $u_1^2u_2$, not linear in $\mathbf u$. $\rho^2\sin(1/\rho)$ is squeezed by $\rho^2$, but its $f_x$ oscillates. The last one has $f_{xy}(0,0) = -1$ and $f_{yx}(0,0) = 1$.
- id: mv-m3-r2-h11
  lesson: mv-h-differentiability
  topic: Mixed partials
  type: text
  stem: 'For $f(x, y) = \dfrac{xy(x^2 - y^2)}{x^2 + y^2}$ with $f(0, 0) = 0$: $f_{xy}(0, 0) =$ ___ and $f_{yx}(0, 0) =$ ___. (Here $f_{xy} = (f_x)_y$.)'
  accept:
    - ['-1']
    - ['1']
  explanation: |-
    $f_x(0, y) = \lim_{h\to0}\dfrac{f(h, y)}{h} = \lim_{h\to0}\dfrac{y(h^2 - y^2)}{h^2 + y^2} = -y$, so $f_{xy}(0, 0) = -1$. And $f_y(x, 0) = \lim_{k\to0}\dfrac{x(x^2 - k^2)}{x^2 + k^2} = x$, so $f_{yx}(0, 0) = 1$.
- id: mv-m3-r2-h12
  lesson: mv-h-differentiability
  topic: Mixed partials
  stem: 'The function in the previous example has $f_{xy}(0,0) \ne f_{yx}(0,0)$. Which hypothesis of Clairaut''s theorem fails?'
  choices: ['Continuity of the mixed partials at the origin', 'Existence of $f_x$ and $f_y$ near the origin', 'Continuity of $f$ at the origin', 'Differentiability of $f$ at the origin']
  answer: 0
  explanation: |-
    The function is continuous, even $C^1$ (and so differentiable), with both partials existing everywhere. What fails is continuity of $f_{xy}$ and $f_{yx}$ at the origin: away from it their common formula is 1 on the $x$-axis and $-1$ on the $y$-axis, so it has no limit there.
- id: mv-m3-r2-h13
  lesson: mv-h-differentiability
  topic: Differentiability
  stem: 'Example 1 used the inequality $|hk| \le \tfrac12(h^2 + k^2)$. Why is it true?'
  choices: ['It follows from the mean value theorem', 'It holds only when $h$ and $k$ are small', 'It is the triangle inequality $|h + k| \le |h| + |k|$', 'Because $(|h| - |k|)^2 \ge 0$']
  answer: 3
  explanation: |-
    Expanding $(|h| - |k|)^2 \ge 0$ gives $h^2 - 2|hk| + k^2 \ge 0$, that is, $|hk| \le \tfrac12(h^2 + k^2)$. It holds for all $h$ and $k$, small or not.
- id: mv-m3-r2-h14
  lesson: mv-h-differentiability
  topic: Mixed partials
  type: text
  stem: 'For $f(x, y) = xy$, the second difference $\Delta = f(a + h, b + h) - f(a + h, b) - f(a, b + h) + f(a, b)$ simplifies to $\Delta =$ ___ (in terms of $h$).'
  accept: ['h^2', 'h²', 'h*h', 'hh', 'h**2']
  explanation: |-
    $(a + h)(b + h) - (a + h)b - a(b + h) + ab = ab + ah + bh + h^2 - ab - bh - ab - ah + ab = h^2$. So $\Delta/h^2 = 1$, matching $f_{xy} = f_{yx} = 1$, as the proof of Clairaut's theorem predicts.

# Honors 16h2: The derivative as a matrix
- id: mv-m3-r2-h15
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: '$\mathbf F$ takes points of $\mathbb R^3$ to points of $\mathbb R^2$. What size is $D\mathbf F(\mathbf a)$?'
  choices: ['$3\times2$', '$2\times3$', '$3\times3$', '$2\times2$']
  answer: 1
  explanation: |-
    One row per output ($m = 2$) and one column per input ($n = 3$): $2\times3$. Row $i$ is the gradient of $F_i$, which has 3 entries.
- id: mv-m3-r2-h16
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'For a function $f(x, y)$ with one output, what is its derivative matrix?'
  choices: ['A $2\times1$ column of second partials', 'The Hessian matrix', 'The gradient, written as a $1\times2$ row', 'A single number']
  answer: 2
  explanation: |-
    With $m = 1$ output and $n = 2$ inputs, the matrix is $1\times2$: $[f_x\ \ f_y]$, the gradient written as a row. Then $D f\,\mathbf h = \nabla f\cdot\mathbf h$, matching Lesson 14's linearization.
- id: mv-m3-r2-h17
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  type: text
  stem: 'For the polar map $\mathbf P(r, \theta) = (r\cos\theta, r\sin\theta)$, $\det D\mathbf P =$ ___ (in terms of $r$ and $\theta$).'
  accept: [r]
  explanation: |-
    $\det\begin{bmatrix}\cos\theta & -r\sin\theta\\ \sin\theta & r\cos\theta\end{bmatrix} = r\cos^2\theta + r\sin^2\theta = r$. This is the $r$ in $dA = r\,dr\,d\theta$.
- id: mv-m3-r2-h18
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'Find $D\mathbf F(1, 2)$ for $\mathbf F(u, v) = (u^2v,\ 2u - 3v)$.'
  choices: ['$\begin{bmatrix} 4 & 2\\ 1 & -3\end{bmatrix}$', '$\begin{bmatrix} 2 & 1\\ 2 & -3\end{bmatrix}$', '$\begin{bmatrix} 4 & 1\\ 2 & 3\end{bmatrix}$', '$\begin{bmatrix} 4 & 1\\ 2 & -3\end{bmatrix}$']
  answer: 3
  explanation: |-
    Row 1 is $\nabla(u^2v) = \langle 2uv, u^2\rangle = \langle 4, 1\rangle$; row 2 is $\nabla(2u - 3v) = \langle 2, -3\rangle$. The first choice is the transpose (columns and rows swapped), the second forgets the factor $v$ in $2uv$, and the third drops a sign.
- id: mv-m3-r2-h19
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'Which statements about the matrix chain rule $D(\mathbf G\circ\mathbf F)(\mathbf a) = D\mathbf G(\mathbf F(\mathbf a))\,D\mathbf F(\mathbf a)$ are true? Select all that apply.'
  choices: ['$D\mathbf G$ is evaluated at $\mathbf F(\mathbf a)$, not at $\mathbf a$', 'Each entry of the product is a sum over the paths of a tree diagram', 'The product $D\mathbf F(\mathbf a)\,D\mathbf G(\mathbf F(\mathbf a))$ gives the same matrix', 'If $\mathbf F: \mathbb R^2 \to \mathbb R^3$ and $G: \mathbb R^3 \to \mathbb R$, the result is $1\times2$', 'It only needs the partial derivatives of $\mathbf F$ and $\mathbf G$ to exist']
  answer: [0, 1, 3]
  explanation: |-
    The outer map's derivative is taken where the outer map acts, at $\mathbf F(\mathbf a)$. Entry $(i, j)$ is $\sum_k \tfrac{\partial G_i}{\partial y_k}\tfrac{\partial y_k}{\partial x_j}$, one term per path. Sizes $(1\times3)(3\times2) = 1\times2$. Matrix products do not commute in general (here the other order does not even fit), and the theorem needs both maps differentiable, not just to have partials.
- id: mv-m3-r2-h20
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  type: text
  stem: 'At a point, $D\mathbf F(\mathbf a) = \begin{bmatrix} 1 & 2\\ 0 & 1\end{bmatrix}$ and $D\mathbf G(\mathbf F(\mathbf a)) = \begin{bmatrix} 3 & 0\\ 1 & 1\end{bmatrix}$. The first row of $D(\mathbf G\circ\mathbf F)(\mathbf a)$ is $[\,$___ , ___$\,]$.'
  accept:
    - ['3']
    - ['6']
  explanation: |-
    Outer times inner: $\begin{bmatrix} 3 & 0\\ 1 & 1\end{bmatrix}\begin{bmatrix} 1 & 2\\ 0 & 1\end{bmatrix} = \begin{bmatrix} 3 & 6\\ 1 & 3\end{bmatrix}$. Row 1: $3\cdot1 + 0\cdot0 = 3$ and $3\cdot2 + 0\cdot1 = 6$. (The other order gives first row $[5, 2]$.)
- id: mv-m3-r2-h21
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  type: order
  stem: 'You know $\mathbf F$, $\mathbf G$, the point $\mathbf a$ and the matrix $D\mathbf F(\mathbf a)$. Put the remaining steps for $D(\mathbf G\circ\mathbf F)(\mathbf a)$ in order.'
  items:
    - 'Compute the point $\mathbf b = \mathbf F(\mathbf a)$'
    - 'Find $D\mathbf G$ and evaluate it at $\mathbf b$'
    - 'Multiply $D\mathbf G(\mathbf b)$ by $D\mathbf F(\mathbf a)$, outer matrix on the left'
  explanation: |-
    You cannot evaluate $D\mathbf G$ until you know where: at $\mathbf b = \mathbf F(\mathbf a)$. Only then can you form the product, with the outer derivative on the left.
- id: mv-m3-r2-h22
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'If $z = f(x, y)$ is written in polar coordinates, which formula gives $|\nabla f|^2$?'
  choices: ['$z_r^2 + z_\theta^2$', '$z_r^2 + \dfrac{z_\theta^2}{r^2}$', '$z_r^2 + r^2z_\theta^2$', '$\left(z_r + \dfrac{z_\theta}{r}\right)^2$']
  answer: 1
  explanation: |-
    From $f_x = z_r\cos\theta - \tfrac{z_\theta\sin\theta}{r}$ and $f_y = z_r\sin\theta + \tfrac{z_\theta\cos\theta}{r}$, squaring and adding cancels the cross terms: $f_x^2 + f_y^2 = z_r^2 + z_\theta^2/r^2$. The $1/r$ appears because a change $d\theta$ moves a point a distance $r\,d\theta$.
- id: mv-m3-r2-h23
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'What is the length of the gradient of the polar angle $\theta$, as a function of $(x, y)$ away from the origin?'
  choices: ['$1$', '$r$', '$1/r$', '$0$']
  answer: 2
  explanation: |-
    With $z = \theta$: $z_r = 0$, $z_\theta = 1$, so $|\nabla\theta|^2 = 0 + 1/r^2$ and $|\nabla\theta| = 1/r$. Directly: $\nabla\theta = \left\langle -\tfrac{y}{x^2 + y^2}, \tfrac{x}{x^2 + y^2}\right\rangle$, whose length is $1/\sqrt{x^2 + y^2}$.
- id: mv-m3-r2-h24
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  type: match
  stem: 'Match each object with what it represents.'
  pairs:
    - ['Row $i$ of $D\mathbf F$', 'The gradient of the i-th output']
    - ['Column $j$ of $D\mathbf F$', 'How all outputs change as input j alone moves']
    - ['$\det D\mathbf F$ (square case)', 'The local area or volume scaling factor (the Jacobian)']
    - ['$D\mathbf F(\mathbf a)^{-1}$', 'The derivative of the local inverse at F(a)']
  distractors: ['The matrix of second partial derivatives']
  explanation: |-
    Rows are output gradients; columns are partial derivative vectors $\partial\mathbf F/\partial x_j$. In the square case the determinant measures how small areas or volumes scale (Lesson 28), and by the inverse function theorem the inverse matrix is the derivative of the local inverse. Second partials form the Hessian, which is a different matrix.
- id: mv-m3-r2-h25
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'What does the inverse function theorem say about the polar map $\mathbf P(r, \theta)$ at a point with $r = 0$?'
  choices: ['Nothing: $\det D\mathbf P = 0$ there, so its hypothesis fails', '$\mathbf P$ has a local inverse there, because $\det D\mathbf P = 1$', '$\mathbf P$ is one-to-one everywhere, including there', 'It cannot be applied because $\mathbf P$ is not linear']
  answer: 0
  explanation: |-
    $\det D\mathbf P = r = 0$ at the origin, so the theorem says nothing there, and in fact every $\theta$ maps to the same point, so no local inverse exists. The theorem applies to nonlinear $C^1$ maps; that is its point. Even where $r > 0$, the inverse is only local, since $\theta$ and $\theta + 2\pi$ give the same point.
- id: mv-m3-r2-h26
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: 'At the given point, which maps satisfy the hypotheses of the inverse function theorem ($C^1$ with $\det D\mathbf F \ne 0$)? Select all that apply.'
  choices: ['$(u + v,\ u - v)$ at $(0, 0)$', '$(u^2,\ v)$ at $(0, 1)$', '$(r\cos\theta,\ r\sin\theta)$ at $(1, 0)$', '$(uv,\ u + v)$ at $(1, 1)$', '$(e^u\cos v,\ e^u\sin v)$ at $(0, 0)$']
  answer: [0, 2, 4]
  explanation: |-
    Determinants: $\begin{vmatrix} 1 & 1\\ 1 & -1\end{vmatrix} = -2$; $\begin{vmatrix} 2u & 0\\ 0 & 1\end{vmatrix} = 2u = 0$ at $u = 0$; polar: $r = 1$; $\begin{vmatrix} v & u\\ 1 & 1\end{vmatrix} = v - u = 0$ at $(1, 1)$; $\begin{vmatrix} e^u\cos v & -e^u\sin v\\ e^u\sin v & e^u\cos v\end{vmatrix} = e^{2u} = 1$. All five maps are $C^1$, so the first, third and fifth qualify.
- id: mv-m3-r2-h27
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: '$\mathbf F(1, 2) = (3, -1)$ and $D\mathbf F(1, 2) = \begin{bmatrix} 2 & 1\\ 0 & 3\end{bmatrix}$. Estimate $\mathbf F(1.1, 1.9)$.'
  choices: ['$(3.1, -1.3)$', '$(3.3, -1.3)$', '$(3.2, -1.2)$', '$(3.1, -0.7)$']
  answer: 0
  explanation: |-
    $\mathbf h = \langle 0.1, -0.1\rangle$, and $D\mathbf F\,\mathbf h = \langle 2(0.1) + 1(-0.1),\ 0(0.1) + 3(-0.1)\rangle = \langle 0.1, -0.3\rangle$. So $\mathbf F(1.1, 1.9) \approx (3.1, -1.3)$. Using the transpose of the matrix gives $(3.2, -1.2)$; the other two choices come from sign slips with the $-0.1$.
- id: mv-m3-r2-h28
  lesson: mv-h-derivative-matrix
  topic: Derivative matrices
  stem: '$\mathbf F: \mathbb R^2 \to \mathbb R^3$ and $\mathbf G: \mathbb R^3 \to \mathbb R^2$. What size is $D(\mathbf G\circ\mathbf F)$?'
  choices: ['$3\times3$', '$2\times3$', '$3\times2$', '$2\times2$']
  answer: 3
  explanation: |-
    $D\mathbf G$ is $2\times3$ and $D\mathbf F$ is $3\times2$; their product is $2\times2$, matching $\mathbf G\circ\mathbf F: \mathbb R^2 \to \mathbb R^2$. (The product in the other order, $D\mathbf F\,D\mathbf G$, would be $3\times3$, which is a sign of the wrong order.)

# Honors 16h3: Partial differential equations and the chain rule
