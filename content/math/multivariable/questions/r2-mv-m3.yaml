- id: mv-m3-r2-h31
  lesson: mv-h-pdes
  topic: Heat and wave equations
  type: match
  stem: 'Match each equation with a situation it models.'
  pairs:
    - ['$u_t = \alpha u_{xx}$', 'Temperature spreading along a rod']
    - ['$u_{tt} = c^2u_{xx}$', 'Small vibrations of a stretched string']
    - ['$u_{xx} + u_{yy} = 0$', 'Steady-state temperature in a flat plate']
  distractors: ['A population growing exponentially']
  explanation: |-
    The heat (diffusion) equation is first order in time; the wave equation is second order in time; Laplace's equation has no time at all, describing a steady state (or an electrostatic potential). Exponential growth is an ordinary differential equation, $y' = ky$, with no space variable.
- id: mv-m3-r2-h32
  lesson: mv-h-pdes
  topic: Heat and wave equations
  stem: 'Which functions solve the wave equation $u_{tt} = 4u_{xx}$? Select all that apply.'
  choices: ['$\sin(x - 2t)$', '$(x + 2t)^3$', '$e^{x - 2t} + \cos(x + 2t)$', '$\sin(x - 4t)$', '$x^2 + 2t$']
  answer: [0, 1, 2]
  explanation: |-
    Here $c = 2$, so any $F(x - 2t) + G(x + 2t)$ works: the first three. $\sin(x - 4t)$ travels at speed 4: $u_{tt} = -16u$ but $4u_{xx} = -4u$. For $x^2 + 2t$: $u_{tt} = 0$ while $4u_{xx} = 8$.
- id: mv-m3-r2-h33
  lesson: mv-h-pdes
  topic: Heat and wave equations
  stem: 'As $t$ increases, how does the graph of $u = F(x - ct)$ (with $c > 0$) move?'
  choices: ['Left, at speed $c$', 'Right, at speed $c$', 'Right, at speed $c^2$', 'It stays in place and grows']
  answer: 1
  explanation: |-
    The value $F(s)$ that sat at $x = s$ when $t = 0$ appears at $x = s + ct$ at time $t$, since then $x - ct = s$. So the shape shifts right by $ct$: speed $c$. $F(x + ct)$ moves left.
- id: mv-m3-r2-h34
  lesson: mv-h-pdes
  topic: Heat and wave equations
  type: order
  stem: 'Put the steps of solving the wave equation $u_{tt} = c^2u_{xx}$ with characteristic coordinates in order.'
  items:
    - 'Set $\xi = x - ct$ and $\eta = x + ct$, and write $u(x, t) = U(\xi, \eta)$'
    - 'Use the chain rule to express $u_{xx}$ and $u_{tt}$ in terms of $U_{\xi\xi}$, $U_{\xi\eta}$, $U_{\eta\eta}$'
    - 'Substitute to reduce the equation to $U_{\xi\eta} = 0$'
    - 'Integrate to get $U = F(\xi) + G(\eta)$'
  explanation: |-
    New variables first, then the chain rule gives $u_{xx} = U_{\xi\xi} + 2U_{\xi\eta} + U_{\eta\eta}$ and $u_{tt} = c^2(U_{\xi\xi} - 2U_{\xi\eta} + U_{\eta\eta})$. Substituting, $u_{tt} - c^2u_{xx} = -4c^2U_{\xi\eta}$, so $U_{\xi\eta} = 0$, and integrating twice gives $F(x - ct) + G(x + ct)$.
- id: mv-m3-r2-h35
  lesson: mv-h-pdes
  topic: Heat and wave equations
  stem: 'With $\xi = x - ct$, $\eta = x + ct$ and $u(x,t) = U(\xi, \eta)$, what does $u_{tt} - c^2u_{xx}$ equal?'
  choices: ['$4c^2U_{\xi\eta}$', '$0$', '$c^2(U_{\xi\xi} - U_{\eta\eta})$', '$-4c^2U_{\xi\eta}$']
  answer: 3
  explanation: |-
    $u_{tt} = c^2U_{\xi\xi} - 2c^2U_{\xi\eta} + c^2U_{\eta\eta}$ and $c^2u_{xx} = c^2U_{\xi\xi} + 2c^2U_{\xi\eta} + c^2U_{\eta\eta}$. The difference is $-4c^2U_{\xi\eta}$. (It equals 0 only for solutions of the wave equation.)
- id: mv-m3-r2-h36
  lesson: mv-h-pdes
  topic: Heat and wave equations
  type: text
  stem: 'A string with $c = 1$ starts at rest with shape $\varphi(x) = e^{-x^2}$. By d''Alembert''s formula, $u(2, 2) \approx$ ___ (2 decimal places).'
  accept: ['0.5', '0.50', '1/2']
  explanation: |-
    $u = \tfrac12\left[\varphi(x - t) + \varphi(x + t)\right] = \tfrac12\left(e^{0} + e^{-16}\right) \approx 0.50$. The right-moving half-height bump is centered at $x = 2$ at time 2.
- id: mv-m3-r2-h37
  lesson: mv-h-pdes
  topic: Heat and wave equations
  stem: 'A string with $c = 1$ starts at rest with shape $\varphi(x) = \dfrac{1}{1 + x^2}$. What is $u(1, 2)$?'
  choices: ['$\tfrac12$', '$\tfrac{3}{10}$', '$\tfrac35$', '$\tfrac{1}{10}$']
  answer: 1
  explanation: |-
    $u(1, 2) = \tfrac12\left[\varphi(-1) + \varphi(3)\right] = \tfrac12\left(\tfrac12 + \tfrac1{10}\right) = \tfrac{3}{10}$. Forgetting the $\tfrac12$ gives $\tfrac35$; $\tfrac12$ is the starting value $\varphi(1)$.
- id: mv-m3-r2-h38
  lesson: mv-h-pdes
  topic: Heat and wave equations
  stem: 'For which equation does the superposition principle fail?'
  choices: ['$u_t = 3u_{xx}$', '$u_{xx} + u_{yy} = 0$', '$u_t = u_{xx} + u^2$', '$u_{tt} = 9u_{xx}$']
  answer: 2
  explanation: |-
    The $u^2$ term makes the equation nonlinear: if $u_1$ and $u_2$ are solutions, $(u_1 + u_2)^2 = u_1^2 + 2u_1u_2 + u_2^2$ leaves an extra $2u_1u_2$, so $u_1 + u_2$ generally fails. The other three are linear and homogeneous.
- id: mv-m3-r2-h39
  lesson: mv-h-pdes
  topic: Laplace's equation
  stem: 'Which functions are harmonic (satisfy $u_{xx} + u_{yy} = 0$ where defined)? Select all that apply.'
  choices: ['$x^2 - y^2$', '$x^2 + y^2$', '$e^x\sin y$', '$x^3 + y^3$', '$\ln(x^2 + y^2)$']
  answer: [0, 2, 4]
  explanation: |-
    $x^2 - y^2$: $2 - 2 = 0$. $e^x\sin y$: $e^x\sin y - e^x\sin y = 0$. $\ln(x^2 + y^2)$: $u_{xx} = \tfrac{2(y^2 - x^2)}{(x^2 + y^2)^2}$ and $u_{yy} = \tfrac{2(x^2 - y^2)}{(x^2 + y^2)^2}$, which cancel. But $x^2 + y^2$ gives $4$ and $x^3 + y^3$ gives $6x + 6y$.
- id: mv-m3-r2-h40
  lesson: mv-h-pdes
  topic: Laplace's equation
  stem: 'Using $u_{rr} + \tfrac1r u_r + \tfrac{1}{r^2}u_{\theta\theta} = 0$, which function is harmonic?'
  choices: ['$r^2\cos3\theta$', '$r\cos2\theta$', '$r^3\cos\theta$', '$r^3\cos3\theta$']
  answer: 3
  explanation: |-
    For $r^n\cos m\theta$ the left side is $(n^2 - m^2)r^{n-2}\cos m\theta$, which is 0 only when $n = m$. So $r^3\cos3\theta$ (which equals $x^3 - 3xy^2$) is harmonic; the others have $n \ne m$.
- id: mv-m3-r2-h41
  lesson: mv-h-pdes
  topic: Laplace's equation
  stem: 'A steady temperature $u$ on a plate is harmonic and not constant. On the edge of the plate, $u$ ranges from 10 °C to 40 °C. Which value could $u$ take at an interior point?'
  choices: ['45 °C', '5 °C', '25 °C', '40.5 °C']
  answer: 2
  explanation: |-
    A nonconstant harmonic function has no maximum or minimum inside the region, so interior values lie strictly between the smallest and largest boundary values, here between 10 °C and 40 °C. Only 25 °C qualifies.
- id: mv-m3-r2-h42
  lesson: mv-h-pdes
  topic: Laplace's equation
  stem: 'For $u = \ln r$, what is $u_{rr} + \tfrac1r u_r$?'
  choices: ['$0$', '$-\dfrac{2}{r^2}$', '$\dfrac{2}{r^2}$', '$\dfrac1r$']
  answer: 0
  explanation: |-
    $u_r = \tfrac1r$ and $u_{rr} = -\tfrac{1}{r^2}$, so $u_{rr} + \tfrac1r u_r = -\tfrac1{r^2} + \tfrac1{r^2} = 0$. Since $u_{\theta\theta} = 0$ as well, $\ln r$ is harmonic away from the origin.
