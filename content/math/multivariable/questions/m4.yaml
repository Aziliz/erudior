# Module 4: Optimization
- id: mv-q-1701
  lesson: mv-extrema
  module_quiz: true
  topic: Critical points
  stem: 'Find the critical point of $f(x, y) = x^2 + y^2 - 2x - 6y + 14$.'
  choices: ['$(1, 3)$', '$(-1, -3)$', '$(2, 6)$', '$(0, 0)$']
  answer: 0
  explanation: |-
    $f_x = 2x - 2 = 0$ and $f_y = 2y - 6 = 0$ give $(1, 3)$. (Completing squares: $f = (x-1)^2 + (y-3)^2 + 4$, a minimum of 4 there.)
- id: mv-q-1702
  lesson: mv-extrema
  topic: Second-derivative test
  stem: 'In the second-derivative test, the discriminant is'
  choices: ['$D = f_{xx}f_{yy} + (f_{xy})^2$', '$D = f_{xx}f_{yy} - (f_{xy})^2$', '$D = f_{xx} + f_{yy}$', '$D = (f_x)^2 + (f_y)^2$']
  answer: 1
  explanation: |-
    $D = f_{xx}f_{yy} - f_{xy}^2$, the determinant of the Hessian matrix $\begin{bmatrix} f_{xx} & f_{xy}\\ f_{xy} & f_{yy}\end{bmatrix}$.
- id: mv-q-1703
  lesson: mv-extrema
  module_quiz: true
  topic: Second-derivative test
  stem: 'At a critical point, $D > 0$ and $f_{xx} < 0$. The point is'
  choices: ['a local minimum', 'a saddle point', 'a local maximum', 'impossible to classify']
  answer: 2
  explanation: |-
    $D > 0$ means the surface bends the same way in all directions; $f_{xx} < 0$ means downward, so it is a dome: a local maximum.
- id: mv-q-1704
  lesson: mv-extrema
  module_quiz: true
  topic: Second-derivative test
  stem: 'At a critical point, $D < 0$ and $f_{xx} > 0$. The point is'
  choices: ['a local minimum', 'a local maximum', 'inconclusive', 'a saddle point']
  answer: 3
  explanation: |-
    $D < 0$ always means a saddle, whatever the sign of $f_{xx}$. The surface curves up in some directions and down in others.
- id: mv-q-1705
  lesson: mv-extrema
  topic: Second-derivative test
  stem: 'If $D = 0$ at a critical point, then'
  choices: ['the test gives no information', 'the point is a saddle', 'the point is not an extremum', 'the point is a local minimum']
  answer: 0
  explanation: |-
    $D = 0$ is inconclusive. For example $x^4 + y^4$ (a minimum) and $x^4 - y^4$ (a saddle) both have $D = 0$ at the origin.
- id: mv-q-1706
  lesson: mv-extrema
  topic: Second-derivative test
  stem: 'Classify the critical point $(0, 0)$ of $f(x, y) = x^4 + y^4 - 4xy + 1$.'
  choices: ['Local minimum', 'Saddle point', 'Local maximum', 'Not a critical point']
  answer: 1
  explanation: |-
    $f_{xx} = 12x^2 = 0$, $f_{yy} = 12y^2 = 0$, $f_{xy} = -4$ at the origin, so $D = 0 - 16 < 0$: a saddle. (The minima are at $(1,1)$ and $(-1,-1)$.)
- id: mv-q-1707
  lesson: mv-extrema
  module_quiz: true
  topic: Second-derivative test
  stem: 'For $f(x, y) = x^3 - 3x + y^2 - 4y$, which describes the critical point $(1, 2)$?'
  choices: ['Saddle point, $f = -6$', 'Local maximum, $f = -6$', 'Local minimum, $f = -6$', 'Local minimum, $f = -2$']
  answer: 2
  explanation: |-
    $f_{xx} = 6x = 6$, $f_{yy} = 2$, $f_{xy} = 0$: $D = 12 > 0$ with $f_{xx} > 0$, a local minimum. $f(1, 2) = 1 - 3 + 4 - 8 = -6$.
    The other critical point $(-1, 2)$ has $D = -12$ and is a saddle.
- id: mv-q-1708
  lesson: mv-extrema
  topic: Critical points
  stem: 'What kind of critical point does $f(x, y) = xy$ have at the origin?'
  choices: ['Local maximum', 'Local minimum', 'The test is inconclusive', 'Saddle point']
  answer: 3
  explanation: |-
    $f_{xx} = f_{yy} = 0$ and $f_{xy} = 1$, so $D = -1 < 0$: a saddle. Indeed $f > 0$ in quadrants I and III and $f < 0$ in II and IV.
- id: mv-q-1709
  lesson: mv-extrema
  topic: Critical points
  stem: 'Find the minimum value of $f(x, y) = 2x^2 + 3y^2 - 4x + 12y$.'
  choices: ['$-14$', '$-2$', '$-12$', '$0$']
  answer: 0
  explanation: |-
    $f_x = 4x - 4 = 0$ gives $x = 1$; $f_y = 6y + 12 = 0$ gives $y = -2$. $D = 4\cdot6 > 0$, $f_{xx} > 0$: minimum.
    $f(1, -2) = 2 + 12 - 4 - 24 = -14$.
- id: mv-q-1710
  lesson: mv-extrema
  topic: Critical points
  stem: 'Find the local maximum value of $f(x, y) = -x^2 - y^2 + 4x$.'
  choices: ['$2$', '$4$', '$0$', '$8$']
  answer: 1
  explanation: |-
    $f_x = -2x + 4 = 0$, $f_y = -2y = 0$: the point $(2, 0)$. $D = 4 > 0$, $f_{xx} = -2 < 0$: a max, with $f(2,0) = -4 + 8 = 4$.
- id: mv-q-1711
  lesson: mv-extrema
  module_quiz: true
  topic: Critical points
  stem: 'An open-top box must hold $32\text{ m}^3$. Which dimensions (length × width × height) minimize the material used?'
  choices: ['$2 \times 2 \times 8$', '$\sqrt[3]{32}$ on every side', '$4 \times 4 \times 2$', '$4 \times 2 \times 4$']
  answer: 2
  explanation: |-
    Minimize $S = xy + \tfrac{64}{x} + \tfrac{64}{y}$ (after using $z = 32/(xy)$). $S_x = 0$, $S_y = 0$ give $x = y = 4$, then $z = 2$, with $S = 48\text{ m}^2$.
    A cube is optimal only for a closed box; without a lid the box is twice as wide as it is tall.
- id: mv-q-1712
  lesson: mv-extrema
  topic: Critical points
  stem: 'On a contour map, near a point $P$ the level curves look like two families of hyperbolas facing each other, with higher values to the north and south and lower values to the east and west. $P$ is most likely'
  choices: ['a local maximum', 'a local minimum', 'a point where $\nabla f$ is large', 'a saddle point']
  answer: 3
  explanation: |-
    Rising in one direction and falling in the perpendicular one is the signature of a saddle, like $y^2 - x^2$ at the origin.
- id: mv-q-1713
  lesson: mv-extrema
  topic: Second-derivative test
  stem: 'For $f(x, y) = x^4 + y^4$, the second-derivative test at the origin gives $D = 0$. What is the origin actually?'
  choices: ['An absolute minimum', 'A saddle point', 'A local maximum', 'Not a critical point']
  answer: 0
  explanation: |-
    $f \ge 0$ everywhere and $f(0,0) = 0$, so the origin is a minimum, even though the test was inconclusive. Inspect $f$ directly when $D = 0$.

- id: mv-q-1801
  lesson: mv-absolute-extrema
  module_quiz: true
  topic: Absolute extrema
  stem: 'The Extreme Value Theorem guarantees absolute extrema of $f$ on $D$ when'
  choices: ['$f$ is differentiable and $D$ is open', '$f$ is continuous and $D$ is closed and bounded', '$D$ is bounded, for any $f$', '$f$ has a critical point in $D$']
  answer: 1
  explanation: |-
    Continuity of $f$ and a closed, bounded domain are the hypotheses. Drop either and extrema may fail to exist.
- id: mv-q-1802
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'Why does $f(x, y) = x$ have no absolute maximum on the open disk $x^2 + y^2 < 1$?'
  choices: ['$f$ is not continuous', 'The disk is unbounded', 'The disk does not contain its boundary, so values approach 1 but never reach it', '$f$ has no critical points']
  answer: 2
  explanation: |-
    The supremum would be at $(1, 0)$, which is on the boundary circle and not in the open disk. The set is bounded but not closed.
- id: mv-q-1803
  lesson: mv-absolute-extrema
  module_quiz: true
  topic: Absolute extrema
  stem: 'Find the absolute maximum of $f(x, y) = x^2 - xy + y^2 - 3x$ on $0 \le x \le 3$, $0 \le y \le 2$.'
  choices: ['$-3$', '$0$', '$9$', '$4$']
  answer: 3
  explanation: |-
    Candidates: interior critical point $(2,1)$ with $f = -3$; edges give $-2.25$, $0$, $-2$ and the corner $(0, 2)$ with $f = 0 - 0 + 4 - 0 = 4$. The largest is 4.
- id: mv-q-1804
  lesson: mv-absolute-extrema
  module_quiz: true
  topic: Absolute extrema
  stem: 'Find the absolute minimum of $f(x, y) = x^2 - xy + y^2 - 3x$ on $0 \le x \le 3$, $0 \le y \le 2$.'
  choices: ['$-3$', '$-2.25$', '$-2$', '$0$']
  answer: 0
  explanation: |-
    The interior critical point $(2, 1)$ gives $f = 4 - 2 + 1 - 6 = -3$, lower than every boundary candidate (the edges bottom out at $-2.25$).
- id: mv-q-1805
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'Find the absolute maximum of $f(x, y) = x^2 + 2y^2 - x$ on the disk $x^2 + y^2 \le 1$.'
  choices: ['$2$', '$\tfrac94$', '$3$', '$-\tfrac14$']
  answer: 1
  explanation: |-
    On the circle $f = 2 - x - x^2$ for $-1 \le x \le 1$, maximized at $x = -\tfrac12$: $f = \tfrac94$. The interior critical point gives $-\tfrac14$ (the minimum), and the ends give $0$ and $2$.
- id: mv-q-1806
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'Find the absolute maximum of $f(x, y) = 4xy$ on the triangle with vertices $(0,0)$, $(2,0)$, $(0,2)$.'
  choices: ['$16$', '$8$', '$4$', '$0$']
  answer: 2
  explanation: |-
    On the legs $f = 0$. On the hypotenuse $y = 2 - x$: $4x(2 - x)$, largest at $x = 1$, value 4. No interior critical points (only the corner $(0,0)$).
- id: mv-q-1807
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'When finding absolute extrema on a rectangle, which candidates are most often forgotten?'
  choices: ['Interior critical points', 'Points where $f = 0$', 'Points where $D < 0$', 'The four corners']
  answer: 3
  explanation: |-
    The corners are endpoints of the edge pieces, and each edge's one-variable problem must include its endpoints.
- id: mv-q-1808
  lesson: mv-absolute-extrema
  module_quiz: true
  topic: Absolute extrema
  stem: 'Find the absolute maximum and minimum of $f(x, y) = x^2 + y^2$ on the square $-1 \le x \le 2$, $-1 \le y \le 2$.'
  choices: ['Max $8$ at $(2, 2)$, min $0$ at $(0, 0)$', 'Max $8$ at $(2, 2)$, min $2$ at $(-1, -1)$', 'Max $5$ at $(2, -1)$, min $0$ at $(0, 0)$', 'Max $4$ at $(2, 0)$, min $1$ at $(1, 0)$']
  answer: 0
  explanation: |-
    $f$ is the squared distance from the origin. The origin is inside the square (critical point, $f = 0$); the farthest point is the corner $(2, 2)$ with $f = 8$.
- id: mv-q-1809
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'Find the absolute maximum of $f(x, y) = x + y$ on the disk $x^2 + y^2 \le 2$.'
  choices: ['$\sqrt2$', '$2$', '$4$', '$2\sqrt2$']
  answer: 1
  explanation: |-
    No interior critical points ($\nabla f = \langle 1,1\rangle \ne \mathbf 0$). On the circle $x = \sqrt2\cos t$, $y = \sqrt2\sin t$: $f = \sqrt2(\cos t + \sin t) = 2\sin(t + \tfrac{\pi}{4})$, with max $2$ at $(1, 1)$.
- id: mv-q-1810
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'Find the absolute minimum of $f(x, y) = 3 - x - y$ on the triangle with vertices $(0,0)$, $(1,0)$, $(0,1)$.'
  choices: ['$3$', '$1$', '$2$', '$0$']
  answer: 2
  explanation: |-
    $f$ is linear, so its extremes are on the boundary. On the hypotenuse $x + y = 1$, $f = 2$; at the origin $f = 3$. Minimum 2 (along the whole hypotenuse), maximum 3.
- id: mv-q-1811
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'While finding absolute extrema on the rectangle $0 \le x \le 3$, $0 \le y \le 2$, you find a critical point at $(5, 1)$. What should you do with it?'
  choices: ['Include it as a candidate', 'Use the second-derivative test on it', 'Replace it with the nearest corner', 'Discard it, since it is outside the region']
  answer: 3
  explanation: |-
    Only critical points inside the region are candidates. Values outside the region are irrelevant to the extrema on the region.
- id: mv-q-1812
  lesson: mv-absolute-extrema
  topic: Absolute extrema
  stem: 'On the edge $y = 2$, the function $f(x, y) = x^2 - xy + y^2 - 3x$ restricts to which function of $x$?'
  choices: ['$x^2 - 5x + 4$', '$x^2 - 3x + 4$', '$x^2 - 2x + 4$', '$x^2 - 5x$']
  answer: 0
  explanation: |-
    Substitute $y = 2$: $x^2 - 2x + 4 - 3x = x^2 - 5x + 4$.

- id: mv-q-1901
  lesson: mv-lagrange
  module_quiz: true
  topic: Lagrange multipliers
  stem: 'To optimize $f$ subject to $g = k$ with Lagrange multipliers, you solve'
  choices: ['$\nabla f = \mathbf 0$ and $g = k$', '$\nabla f = \lambda\nabla g$ and $g = k$', '$\nabla f\cdot\nabla g = 0$', '$f = \lambda g$']
  answer: 1
  explanation: |-
    At a constrained extremum the gradients are parallel, $\nabla f = \lambda\nabla g$, and the point must satisfy the constraint. $\nabla f = \mathbf 0$ is the unconstrained condition.
- id: mv-q-1902
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'Why must $\nabla f$ be parallel to $\nabla g$ at a constrained extremum?'
  choices: ['Because $f$ and $g$ are equal there', 'Because $\nabla f = \mathbf 0$ there', 'Because the constraint curve is tangent to a level curve of $f$ there, so their normals are parallel', 'Because $\lambda$ must be positive']
  answer: 2
  explanation: |-
    If the constraint crossed a level curve of $f$, moving along it would raise or lower $f$. At an extremum it only touches the level curve, and touching curves share normals.
- id: mv-q-1903
  lesson: mv-lagrange
  module_quiz: true
  topic: Lagrange multipliers
  stem: 'Find the maximum of $f(x, y) = x + 2y$ on the circle $x^2 + y^2 = 5$.'
  choices: ['$\sqrt5$', '$3$', '$10$', '$5$']
  answer: 3
  explanation: |-
    $1 = 2\lambda x$, $2 = 2\lambda y$ give $y = 2x$; then $5x^2 = 5$, $x = \pm1$. $f(1,2) = 5$ is the max and $f(-1,-2) = -5$ the min.
- id: mv-q-1904
  lesson: mv-lagrange
  module_quiz: true
  topic: Lagrange multipliers
  stem: 'Which point of the plane $x + 2y + 2z = 9$ is closest to the origin?'
  choices: ['$(1, 2, 2)$', '$(9, 0, 0)$', '$(3, 3, 0)$', '$(2, 2, 1)$']
  answer: 0
  explanation: |-
    $\nabla(x^2+y^2+z^2) = \lambda\langle 1,2,2\rangle$ gives $(x,y,z) = \tfrac{\lambda}{2}\langle 1,2,2\rangle$; the constraint gives $\lambda = 2$, so $(1, 2, 2)$, at distance 3.
    $(2,2,1)$ is not even on the plane ($2 + 4 + 2 = 8$).
- id: mv-q-1905
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'A closed box has surface area $24\text{ m}^2$. What is its largest possible volume?'
  choices: ['$6\text{ m}^3$', '$8\text{ m}^3$', '$12\text{ m}^3$', '$4\text{ m}^3$']
  answer: 1
  explanation: |-
    The Lagrange equations force $x = y = z$; then $6x^2 = 24$, $x = 2$, and $V = 8\text{ m}^3$.
- id: mv-q-1906
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'Maximize $f(x, y) = xy$ subject to $x + y = 10$.'
  choices: ['$20$', '$50$', '$25$', '$100$']
  answer: 2
  explanation: |-
    $\langle y, x\rangle = \lambda\langle 1, 1\rangle$ gives $x = y$; then $x = y = 5$ and $f = 25$.
- id: mv-q-1907
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'Minimize $f(x, y) = x^2 + y^2$ subject to $x + y = 4$.'
  choices: ['$16$', '$4$', '$2\sqrt2$', '$8$']
  answer: 3
  explanation: |-
    $\langle 2x, 2y\rangle = \lambda\langle 1, 1\rangle$ gives $x = y = 2$, so $f = 8$. (The distance from the origin to the line is $\sqrt8$.)
- id: mv-q-1908
  lesson: mv-lagrange
  module_quiz: true
  topic: Lagrange multipliers
  stem: 'For $f(x, y, z)$ with one constraint $g(x, y, z) = k$, how many equations and unknowns does the Lagrange system have?'
  choices: ['4 equations in $x, y, z, \lambda$', '3 equations in $x, y, z$', '3 equations in $x, y, \lambda$', '6 equations in $x, y, z, \lambda, \mu, \nu$']
  answer: 0
  explanation: |-
    Three component equations of $\nabla f = \lambda\nabla g$, plus the constraint: four equations in four unknowns.
- id: mv-q-1909
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'What does the multiplier $\lambda$ measure at the optimum?'
  choices: ['The optimal value of $f$', 'How fast the optimal value of $f$ changes as the constraint level $k$ changes', 'The distance from the origin to the optimum', 'The angle between $\nabla f$ and $\nabla g$']
  answer: 1
  explanation: |-
    $\lambda = \dfrac{d f_{\text{opt}}}{dk}$: the "shadow price" of the constraint. For $x + 2y$ on $x^2 + y^2 = k$, the max is $\sqrt{5k}$, whose derivative at $k = 5$ is $\tfrac12 = \lambda$.
- id: mv-q-1910
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'With two constraints $g = k$ and $h = c$, the Lagrange condition is'
  choices: ['$\nabla f = \lambda\nabla g$ and $\nabla f = \mu\nabla h$', '$\nabla f = \lambda\nabla g\times\nabla h$', '$\nabla f = \lambda\nabla g + \mu\nabla h$', '$\nabla f = \lambda(\nabla g + \nabla h)$']
  answer: 2
  explanation: |-
    $\nabla f$ must lie in the plane spanned by the two constraint normals: $\nabla f = \lambda\nabla g + \mu\nabla h$, with two separate multipliers.
- id: mv-q-1911
  lesson: mv-lagrange
  module_quiz: true
  topic: Lagrange multipliers
  stem: 'Find the minimum of $f(x, y) = xy$ on the circle $x^2 + y^2 = 2$.'
  choices: ['$0$', '$-2$', '$1$', '$-1$']
  answer: 3
  explanation: |-
    $\langle y, x\rangle = \lambda\langle 2x, 2y\rangle$ gives $y^2 = x^2$, so $y = \pm x$ and $x^2 = 1$. Values: $f = 1$ at $(1,1), (-1,-1)$ and $f = -1$ at $(1,-1), (-1,1)$. Minimum $-1$.
- id: mv-q-1912
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'Solving $y = 2\lambda x$, $x = 2\lambda y$, a student divides the equations to get $\tfrac{y}{x} = \tfrac{x}{y}$. What risk does this step carry?'
  choices: ['It can lose solutions where $x = 0$ or $y = 0$', 'It always gives the wrong answer', 'It introduces complex solutions', 'It changes the value of $\lambda$']
  answer: 0
  explanation: |-
    Dividing assumes the denominators are nonzero. Check separately whether $x = 0$ or $y = 0$ (with the constraint) gives solutions before dividing.
- id: mv-q-1913
  lesson: mv-lagrange
  topic: Lagrange multipliers
  stem: 'Find the maximum of $f = x + y + z$ on the sphere $x^2 + y^2 + z^2 = 3$.'
  choices: ['$\sqrt3$', '$3$', '$9$', '$1$']
  answer: 1
  explanation: |-
    $\langle 1,1,1\rangle = \lambda\langle 2x,2y,2z\rangle$ forces $x = y = z$; then $3x^2 = 3$, so $x = \pm1$. The max is $f(1,1,1) = 3$.

- id: mv-q-1951
  lesson: mv-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'The least squares line $y = mx + b$ for data $(x_1, y_1), \dots, (x_n, y_n)$ is the line that minimizes which quantity?'
  choices: ['$\sum\left(y_i - mx_i - b\right)^2$', '$\sum\left(y_i - mx_i - b\right)$', '$\sum d_i^2$, with $d_i$ the perpendicular distance from point $i$ to the line', '$\sum\left|y_i - mx_i - b\right|$']
  answer: 0
  explanation: |-
    Least squares minimizes the sum of the squared vertical residuals, $S(m, b) = \sum(y_i - mx_i - b)^2$.
    The plain sum of residuals is useless as a target because positive and negative residuals cancel (every line through the point of means makes it zero). Perpendicular distances measure a different fit, not the one that predicts $y$ from $x$. The sum of absolute values is a different method; it has corners, so the calculus of this lesson does not apply.
- id: mv-q-1952
  lesson: mv-least-squares
  topic: Least squares
  stem: 'The line $y = 3x - 1$ is used to model data that include the point $(2, 7)$. What is the residual of this point?'
  choices: ['$-2$', '$2$', '$4$', '$5$']
  answer: 1
  explanation: |-
    The residual is observed minus predicted: the line predicts $3(2) - 1 = 5$, so $e = 7 - 5 = 2$.
    $-2$ subtracts in the wrong order (predicted minus observed), $4$ is the squared residual, and $5$ is the predicted value itself.
- id: mv-q-1953
  lesson: mv-least-squares
  topic: Least squares
  stem: 'Setting $\dfrac{\partial S}{\partial b} = 0$ for $S(m, b) = \sum(y_i - mx_i - b)^2$ gives which normal equation?'
  choices: ['$m\sum x_i + b = \sum y_i$', '$m\sum x_i^2 + b\sum x_i = \sum x_iy_i$', '$m\sum x_i + nb = \sum y_i$', '$m\sum x_i + nb = 0$']
  answer: 2
  explanation: |-
    $S_b = -2\sum(y_i - mx_i - b) = 0$ gives $\sum y_i = m\sum x_i + \sum b = m\sum x_i + nb$.
    Writing $b$ instead of $nb$ forgets that the constant $b$ is added once for each of the $n$ points. The equation with $\sum x_i^2$ comes from $\partial S/\partial m$, not $\partial S/\partial b$. Setting the right side to $0$ drops the $y_i$ terms when the sum is split.
- id: mv-q-1954
  lesson: mv-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'Find the least squares line for the points $(0, 0)$, $(1, 1)$, $(2, 1)$, $(3, 2)$.'
  choices: ['$y = \tfrac23x$', '$y = \tfrac35x + \tfrac25$', '$y = \tfrac{9}{14}x$', '$y = \tfrac35x + \tfrac{1}{10}$']
  answer: 3
  explanation: |-
    Sums: $n = 4$, $\sum x_i = 6$, $\sum y_i = 4$, $\sum x_i^2 = 14$, $\sum x_iy_i = 0 + 1 + 2 + 6 = 9$. Then $m = \dfrac{4(9) - 6(4)}{4(14) - 36} = \dfrac{12}{20} = \dfrac35$ and $b = \dfrac{4 - \frac35(6)}{4} = \dfrac{1}{10}$.
    $y = \tfrac23x$ just joins the first and last points. $y = \tfrac35x + \tfrac25$ has the right slope but forgets to divide by $n = 4$ when solving for $b$. $y = \tfrac{9}{14}x$ is the best line forced through the origin, $\sum x_iy_i/\sum x_i^2$, but this fit allows an intercept.
- id: mv-q-1955
  lesson: mv-least-squares
  topic: Least squares
  stem: 'A data set has $\bar x = 4$ and $\bar y = 13$, and its least squares line has slope $m = 2.5$. What is the intercept $b$?'
  choices: ['$3$', '$13$', '$23$', '$3.25$']
  answer: 0
  explanation: |-
    The least squares line passes through $(\bar x, \bar y)$, so $13 = 2.5(4) + b$ and $b = 3$.
    $13$ takes $b = \bar y$ and forgets the $m\bar x$ term; $23$ adds $m\bar x$ instead of subtracting it; $3.25$ is $\bar y/\bar x$, which mixes up the intercept with a slope.
- id: mv-q-1956
  lesson: mv-least-squares
  topic: Least squares
  stem: 'For which data set is there no unique least squares line $y = mx + b$?'
  choices: ['All the $y_i$ are equal', 'All the $x_i$ are equal', 'The points all lie on one non-vertical line', 'There are exactly three points']
  answer: 1
  explanation: |-
    The discriminant of $S(m, b)$ is $D = 4n\sum(x_i - \bar x)^2$, which is $0$ exactly when every $x_i$ is the same. Then the points are stacked vertically and infinitely many lines tie.
    If all $y_i$ are equal the unique best line is horizontal, $y = \bar y$. If the points are collinear the unique best line is that line, with $S = 0$. Three points with at least two different $x$-values give $D > 0$ and a unique line.
- id: mv-q-1957
  lesson: mv-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'For a data set, $n = 5$, $\sum x_i = 10$, $\sum y_i = 20$, $\sum x_i^2 = 30$ and $\sum x_iy_i = 48$. Find the least squares slope and intercept.'
  choices: ['$m = 0.1$, $b = 3.8$', '$m = 2.4$, $b = 0.8$', '$m = 0.8$, $b = 2.4$', '$m = 0.8$, $b = 4$']
  answer: 2
  explanation: |-
    Normal equations: $30m + 10b = 48$ and $10m + 5b = 20$. The second gives $b = 4 - 2m$; then $30m + 40 - 20m = 48$, so $m = 0.8$ and $b = 2.4$.
    $m = 0.1$, $b = 3.8$ uses $(\sum x_i)^2 = 100$ in place of $\sum x_i^2 = 30$. $m = 2.4$, $b = 0.8$ swaps the two unknowns. $b = 4$ takes $b = \bar y$ and forgets to subtract $m\bar x$.
- id: mv-q-1958
  lesson: mv-least-squares
  topic: Least squares
  stem: 'Why does the method of least squares square the residuals instead of using their absolute values?'
  choices: ['Squaring makes every residual smaller, so the fitted line is closer to the data', 'Absolute values can be negative, which would make the total misleading', 'Squaring reduces the influence of outliers, so one bad point cannot move the line', 'The sum of squares is differentiable, and setting its partials to zero gives linear equations']
  answer: 3
  explanation: |-
    $\sum e_i^2$ is a smooth quadratic in $m$ and $b$, so its critical point comes from the linear normal equations. $|e|$ has a corner at $0$, where the derivative does not exist.
    Squaring makes residuals larger than 1 bigger, not smaller; absolute values are never negative; and squaring increases the weight of outliers, since a residual of 10 contributes 100.
- id: mv-q-1959
  lesson: mv-least-squares
  topic: Least squares
  stem: 'Fit the model $y = kx$ (a line through the origin) to the points $(1, 2)$, $(2, 3)$, $(3, 7)$ by least squares.'
  choices: ['$k = \tfrac{29}{14}$', '$k = 2$', '$k = \tfrac{35}{18}$', '$k = \tfrac{29}{36}$']
  answer: 0
  explanation: |-
    $S(k) = \sum(y_i - kx_i)^2$ and $S'(k) = -2\sum x_i(y_i - kx_i) = 0$ give $k = \dfrac{\sum x_iy_i}{\sum x_i^2} = \dfrac{2 + 6 + 21}{1 + 4 + 9} = \dfrac{29}{14}$.
    $k = 2$ is the ratio of sums $\sum y_i/\sum x_i = 12/6$; $\tfrac{35}{18}$ averages the three slopes $y_i/x_i$; $\tfrac{29}{36}$ divides by $(\sum x_i)^2$ instead of $\sum x_i^2$.
- id: mv-q-1960
  lesson: mv-least-squares
  topic: Least squares
  stem: 'Compute the sum of squared errors $S$ for the line $y = 2x$ and the data $(1, 3)$, $(2, 2)$, $(3, 7)$.'
  choices: ['$0$', '$6$', '$4$', '$16$']
  answer: 1
  explanation: |-
    Predictions $2, 4, 6$; residuals $3 - 2 = 1$, $2 - 4 = -2$, $7 - 6 = 1$. Then $S = 1 + 4 + 1 = 6$.
    $0$ adds the residuals without squaring, so they cancel; $4$ adds their absolute values; $16$ squares the total of the absolute values instead of adding the squares.
- id: mv-q-1961
  lesson: mv-least-squares
  topic: Least squares
  stem: 'Which statement is always true of the residuals of a least squares line $y = mx + b$?'
  choices: ['Half of the data points lie above the line', 'Every residual is as small as possible', 'The residuals add up to zero', 'Every residual is zero']
  answer: 2
  explanation: |-
    The normal equation from $S_b = 0$ says $\sum(y_i - mx_i - b) = 0$: the residuals balance exactly.
    That balance is in total size, not in count, so the points above and below need not be equally many. Least squares makes the sum of squares smallest, not each residual separately (moving the line to shrink one residual can grow others). Residuals are all zero only when the data happen to be collinear.
- id: mv-q-1962
  lesson: mv-least-squares
  topic: Least squares
  stem: 'A student differentiates $S(m, b) = \sum(y_i - mx_i - b)^2$ and writes $S_m = -2\sum(y_i - mx_i - b)$ and $S_b = -2\sum(y_i - mx_i - b)$. What went wrong?'
  choices: ['$S_b$ should have a factor $x_i$ inside the sum', 'The factor $-2$ should be $+2$ in both', 'Nothing; the two partials really are equal', '$S_m$ is missing the chain-rule factor $x_i$ inside the sum']
  answer: 3
  explanation: |-
    The derivative of the inside $y_i - mx_i - b$ with respect to $m$ is $-x_i$, so $S_m = -2\sum x_i(y_i - mx_i - b)$. With the error, both equations say the same thing and $m$ and $b$ cannot both be found.
    $S_b$ is correct as written, since the inside has derivative $-1$ with respect to $b$. The sign $-2$ is right (it comes from the $-x_i$ and $-1$), and it would not matter anyway once each partial is set to zero.
- id: mv-q-1963
  lesson: mv-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'The data have $x$-values $1, 2, 3, 4$. Apply the second-derivative test to $S(m, b)$ at its critical point.'
  choices: ['$D = 80$ and $S_{mm} = 60 > 0$: a minimum', '$D = 80$ and $S_{mm} = 60 > 0$: a maximum', '$D = -80$: a saddle point', '$D = 0$: the test is inconclusive']
  answer: 0
  explanation: |-
    $S_{mm} = 2\sum x_i^2 = 60$, $S_{bb} = 2n = 8$, $S_{mb} = 2\sum x_i = 20$. So $D = 60\cdot8 - 20^2 = 80 > 0$, and $S_{mm} > 0$ means a minimum (in fact the absolute minimum, since $S$ is quadratic).
    $D > 0$ with $S_{mm} > 0$ is a bowl, not a dome, so it is not a maximum. $D = -80$ reverses the subtraction, computing $S_{mb}^2 - S_{mm}S_{bb}$, and $D = 0$ would require all the $x$-values to be equal.
