# Round 2 cards, module mv-m6 (honors lessons)
- {front: 'Moment of inertia of a solid about an axis', back: '$I = \iiint_E d^2\,\delta\,dV$, $d$ = distance from the axis; $I_z = \iiint(x^2 + y^2)\delta\,dV$', topic: Moments of inertia}
- {front: 'Rotational kinetic energy', back: '$\tfrac12I\omega^2$ (each piece moves at speed $\omega d$)', topic: Moments of inertia}
- {front: 'Radius of gyration', back: '$k = \sqrt{I/m}$', topic: Moments of inertia}
- {front: 'Solid cylinder about its axis; hoop about its axis', back: '$\tfrac12ma^2$; $ma^2$ (height does not matter)', topic: Moments of inertia}
- {front: 'Solid ball and thin spherical shell about a diameter', back: '$\tfrac25ma^2$ and $\tfrac23ma^2$', topic: Moments of inertia}
- {front: 'Solid cone about its axis; box about a central axis', back: '$\tfrac{3}{10}ma^2$; $\tfrac{1}{12}m(b^2 + c^2)$ with $b, c$ the edges across the axis', topic: Moments of inertia}
- {front: 'Symmetry trick for a ball with density depending only on $\rho$', back: '$I_x + I_y + I_z = 2\iiint\rho^2\delta\,dV$, so $I_{\text{diameter}} = \tfrac23\iiint\rho^2\delta\,dV$', topic: Moments of inertia}
- {front: 'Parallel axis theorem', back: '$I = I_{\text{cm}} + md^2$; one of the axes must pass through the center of mass', topic: Moments of inertia}
- {front: 'Speed after rolling down a height $h$ ($I = \beta mR^2$)', back: '$v = \sqrt{2gh/(1 + \beta)}$: independent of mass and radius', topic: Moments of inertia}
- {front: 'Rolling race order (first to last)', back: 'Solid ball $\left(\tfrac25\right)$, solid cylinder $\left(\tfrac12\right)$, thin spherical shell $\left(\tfrac23\right)$, hoop $(1)$', topic: Moments of inertia}
- {front: 'Moment of inertia factor $C/(MR^2)$', back: '0.4 for a uniform ball; about 0.331 for Earth, so mass is concentrated toward the center', topic: Moments of inertia}
- {front: 'Linear change of variables $\mathbf x = A\mathbf u$', back: 'Jacobian $\det A$ (constant); every volume is multiplied by $|\det A|$', topic: Custom coordinates}
- {front: 'Volume of the ellipsoid $\tfrac{x^2}{a^2} + \tfrac{y^2}{b^2} + \tfrac{z^2}{c^2} \le 1$', back: '$\tfrac43\pi abc$ (Jacobian $abc$ times the unit ball)', topic: Custom coordinates}
- {front: 'Jacobian of two substitutions in a row', back: 'The product of the two Jacobians (the inverse map has the reciprocal Jacobian)', topic: Custom coordinates}
- {front: 'Why $dV = \rho^2\sin\phi\,d\rho\,d\phi\,d\theta$', back: 'Polar in the half-plane gives factor $\rho$; cylindrical gives factor $r = \rho\sin\phi$; multiply', topic: Custom coordinates}
- {front: 'Toroidal coordinates', back: '$r = R + s\cos\alpha$, $z = s\sin\alpha$, $\theta$; $dV = s(R + s\cos\alpha)\,ds\,d\alpha\,d\theta$', topic: Custom coordinates}
- {front: 'Volume of a torus (tube radius $a$, center circle radius $R$)', back: '$2\pi^2Ra^2 = (\pi a^2)(2\pi R)$', topic: Custom coordinates}
- {front: 'Pappus''s centroid theorem', back: 'Volume of revolution $= 2\pi\bar rA$: area times the distance the centroid travels', topic: Custom coordinates}
- {front: 'Volume of the $n$-ball of radius $a$', back: '$V_n(1)a^n$ with $V_n(1) = \tfrac{2\pi}{n}V_{n-2}(1)$, $V_1 = 2$, $V_2 = \pi$; $V_4(a) = \tfrac12\pi^2a^4$', topic: Custom coordinates}
- {front: 'Which unit ball has the largest volume?', back: '$n = 5$: $V_5 = \tfrac{8\pi^2}{15} \approx 5.26$; volumes then shrink toward 0', topic: Custom coordinates}
- {front: 'Fraction of an $n$-ball within $\varepsilon$ of its surface', back: '$1 - (1 - \varepsilon)^n$, close to 1 in high dimensions', topic: Custom coordinates}
