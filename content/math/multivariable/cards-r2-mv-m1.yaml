# Round 2 cards for mv-m1 (honors lessons 06h1 and 06h2)
- {front: 'Cauchy–Schwarz inequality', back: '$|\mathbf a\cdot\mathbf b| \le |\mathbf a||\mathbf b|$; equality iff one vector is a multiple of the other', topic: Vector identities}
- {front: 'Proof idea of Cauchy–Schwarz', back: '$|\mathbf a + t\mathbf b|^2 \ge 0$ for all $t$, so the quadratic in $t$ has discriminant $\le 0$', topic: Vector identities}
- {front: 'Triangle inequality', back: '$|\mathbf u + \mathbf v| \le |\mathbf u| + |\mathbf v|$ (from Cauchy–Schwarz)', topic: Vector identities}
- {front: 'Cyclic property of the scalar triple product', back: '$\mathbf a\cdot(\mathbf b\times\mathbf c) = \mathbf b\cdot(\mathbf c\times\mathbf a) = \mathbf c\cdot(\mathbf a\times\mathbf b)$; swapping two vectors flips the sign', topic: Vector identities}
- {front: 'Vector triple product (BAC−CAB)', back: '$\mathbf a\times(\mathbf b\times\mathbf c) = \mathbf b(\mathbf a\cdot\mathbf c) - \mathbf c(\mathbf a\cdot\mathbf b)$', topic: Vector identities}
- {front: 'Distance from $Q$ to the line $P + t\mathbf v$', back: '$D = \dfrac{|\overrightarrow{PQ}\times\mathbf v|}{|\mathbf v|}$ (parallelogram height)', topic: Distances in space}
- {front: 'Closest point of the line $P + t\mathbf v$ to $Q$', back: '$t = \dfrac{\overrightarrow{PQ}\cdot\mathbf v}{\mathbf v\cdot\mathbf v}$ (foot of the perpendicular)', topic: Distances in space}
- {front: 'Distance between skew lines', back: '$D = \dfrac{|\overrightarrow{P_1P_2}\cdot(\mathbf v_1\times\mathbf v_2)|}{|\mathbf v_1\times\mathbf v_2|}$ (box height)', topic: Distances in space}
- {front: 'Closest points of two skew lines', back: 'Solve $\mathbf w\cdot\mathbf v_1 = 0$ and $\mathbf w\cdot\mathbf v_2 = 0$ for $t, s$, where $\mathbf w = \mathbf r_1(t) - \mathbf r_2(s)$', topic: Distances in space}
- {front: 'Two non-parallel lines with $\overrightarrow{P_1P_2}\cdot(\mathbf v_1\times\mathbf v_2) = 0$', back: 'They intersect (they lie in one plane)', topic: Distances in space}
- {front: 'Matrix of $Ax^2 + Bxy + Cy^2$', back: '$\begin{bmatrix} A & B/2\\ B/2 & C\end{bmatrix}$ (symmetric)', topic: Quadratic forms}
- {front: 'Angle that removes the $xy$ term', back: '$\cot 2\theta = \dfrac{A - C}{B}$', topic: Rotated quadrics}
- {front: 'Rotation invariants of $Ax^2 + Bxy + Cy^2$', back: '$A + C$ and $B^2 - 4AC$', topic: Rotated quadrics}
- {front: 'Classify $Ax^2 + Bxy + Cy^2 = 1$', back: '$B^2 - 4AC < 0$: ellipse (or no points); $> 0$: hyperbola; $= 0$: parallel lines (or no points)', topic: Rotated quadrics}
- {front: 'Eigenvalues of $\begin{bmatrix} A & h\\ h & C\end{bmatrix}$', back: '$\lambda = \dfrac{A + C}{2} \pm \sqrt{\left(\dfrac{A - C}{2}\right)^2 + h^2}$', topic: Quadratic forms}
- {front: 'Principal axes theorem', back: 'A real symmetric matrix has real eigenvalues and perpendicular eigenvectors; along them $Q = \lambda_1x''^2 + \lambda_2y''^2 + \lambda_3z''^2$', topic: Quadratic forms}
- {front: 'Quadric $Q(x, y, z) = 1$ from eigenvalue signs', back: 'No negatives: ellipsoid; one: hyperboloid of one sheet; two: two sheets; three: no points; a zero: degenerate', topic: Rotated quadrics}
- {front: '$z = xy$ in rotated coordinates', back: '$z = \tfrac12x''^2 - \tfrac12y''^2$: a saddle turned $45^\circ$', topic: Rotated quadrics}
- {front: 'Quadratic forms and the second-derivative test', back: '$D = f_{xx}f_{yy} - f_{xy}^2 > 0$: ellipse-like (extremum); $D < 0$: hyperbola-like (saddle)', topic: Quadratic forms}
