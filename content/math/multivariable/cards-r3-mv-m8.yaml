# Round 3 notecards for mv-m8 (honors lesson 38h3: vector potentials)
- {front: 'Necessary conditions for potentials', back: 'Gradient needs $\nabla\times\mathbf F = \mathbf 0$; curl needs $\nabla\cdot\mathbf F = 0$ (from $\nabla\times\nabla f = \mathbf 0$ and $\nabla\cdot(\nabla\times\mathbf A) = 0$).', topic: Vector potentials}
- {front: 'When is a divergence-free field a curl?', back: 'On all of $\mathbb R^3$, a ball, a box, or any star-shaped region (Poincaré lemma). It can fail on a region with a cavity, such as space minus a point.', topic: Vector potentials}
- {front: 'Solenoidal but not a curl', back: '$\mathbf x/|\mathbf x|^3$ on space minus the origin: divergence 0, but flux $4\pi$ through a sphere, while a curl has zero flux through every closed surface.', topic: Vector potentials}
- {front: 'Curl-free but not a gradient', back: 'The vortex field $\langle -y, x, 0\rangle/(x^2 + y^2)$ on space minus the $z$-axis: circulation $2\pi$. It is a curl there: $\nabla\times(-\ln r\,\mathbf k)$.', topic: Vector potentials}
- {front: 'Method 1 for a vector potential ($A_3 = 0$)', back: '$A_1 = \int_0^zQ(x, y, t)\,dt - \int_0^yR(x, s, 0)\,ds$, $\;A_2 = -\int_0^zP(x, y, t)\,dt$', topic: Vector potentials}
- {front: 'Integral formula for a vector potential (star-shaped about 0)', back: '$\mathbf A(\mathbf x) = \int_0^1 t\,\mathbf F(t\mathbf x)\times\mathbf x\,dt$', topic: Vector potentials}
- {front: 'Vector potential of a uniform field $\mathbf B$', back: '$\mathbf A = \tfrac12\mathbf B\times\mathbf x$ (or, for $\mathbf B = \mathbf k$, also $\langle -y, 0, 0\rangle$)', topic: Vector potentials}
- {front: 'Gauge transformation', back: '$\mathbf A \to \mathbf A + \nabla\chi$ leaves $\nabla\times\mathbf A$ unchanged; on a simply connected region any two vector potentials differ by a gradient.', topic: Vector potentials}
- {front: 'Reaching the Coulomb gauge', back: 'Solve $\nabla^2\chi = -\nabla\cdot\mathbf A$; then $\nabla\cdot(\mathbf A + \nabla\chi) = 0$.', topic: Vector potentials}
- {front: 'Helmholtz decomposition', back: '$\mathbf F = -\nabla\phi + \nabla\times\mathbf A$, $\;\phi = \dfrac{1}{4\pi}\displaystyle\iiint\frac{\nabla\cdot\mathbf F}{|\mathbf x - \mathbf y|}dV$, $\;\mathbf A = \dfrac{1}{4\pi}\displaystyle\iiint\frac{\nabla\times\mathbf F}{|\mathbf x - \mathbf y|}dV$, for $\mathbf F$ dying off at infinity', topic: Helmholtz decomposition}
- {front: 'Uniqueness of the Helmholtz decomposition', back: 'Unique if both parts tend to $\mathbf 0$ at infinity (their difference is harmonic and vanishes at infinity). Fails without it: $\langle 1, 0, 0\rangle = \nabla x = \nabla\times\langle 0, 0, y\rangle$.', topic: Helmholtz decomposition}
- {front: 'Magnetic vector potential', back: '$\mathbf B = \nabla\times\mathbf A$, $\mathbf E = -\nabla V - \partial\mathbf A/\partial t$; in the Coulomb gauge (magnetostatics) $\nabla^2\mathbf A = -\mu_0\mathbf J$.', topic: Helmholtz decomposition}
- {front: 'Who and when: Helmholtz decomposition', back: 'Helmholtz, 1858, in a paper on vortex motion in fluids; Stokes had used it in 1849 (diffraction).', topic: Helmholtz decomposition}
