# Round 2 glossary, module mv-m6
- term: parallel axis theorem
  aliases: [parallel-axis theorem]
  definition: '$I = I_{\text{cm}} + md^2$: the moment of inertia about any axis equals that about the parallel axis through the center of mass plus the mass times the squared distance between the axes.'
  topic: Moments of inertia
- term: radius of gyration
  definition: '$k = \sqrt{I/m}$: the distance from the axis at which all the mass, placed in a thin ring, would give the same moment of inertia.'
  topic: Moments of inertia
- term: rolling without slipping
  definition: 'Rolling in which the contact point is momentarily at rest, so the center moves at speed $v = \omega R$.'
  topic: Moments of inertia
- term: moment of inertia factor
  definition: 'The ratio $C/(MR^2)$ of a planet''s moment of inertia about its spin axis to $MR^2$; 0.4 for a uniform ball, smaller when mass is concentrated toward the center (about 0.331 for Earth).'
  topic: Moments of inertia
- term: torus
  aliases: [tori, solid torus]
  definition: 'The doughnut-shaped solid swept out by revolving a disk of radius $a$ about an axis at distance $R > a$ from its center; volume $2\pi^2Ra^2$.'
  topic: Custom coordinates
- term: toroidal coordinates
  definition: 'Coordinates $(s, \alpha, \theta)$ for a torus: $r = R + s\cos\alpha$, $z = s\sin\alpha$, with cylindrical $\theta$; $dV = s(R + s\cos\alpha)\,ds\,d\alpha\,d\theta$. (Other systems share the name.)'
  topic: Custom coordinates
- term: Pappus's centroid theorem
  aliases: [Pappus's theorem, theorem of Pappus, Pappus–Guldin theorem, Pappus-Guldin theorem]
  definition: 'Revolving a plane region $D$ about an axis in its plane that does not cross it sweeps out volume $2\pi\bar rA$, where $A$ is the area of $D$ and $\bar r$ the distance of its centroid from the axis.'
  topic: Custom coordinates
- term: n-ball
  aliases: [n-dimensional ball, unit n-ball]
  definition: 'The set of points with $x_1^2 + \dots + x_n^2 \le a^2$ in $\mathbb R^n$; its volume is $V_n(1)a^n$ with $V_n(1) = \tfrac{2\pi}{n}V_{n-2}(1)$.'
  topic: Custom coordinates
