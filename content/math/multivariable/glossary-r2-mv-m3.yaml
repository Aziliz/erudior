# Module 3 round 2: terms bolded in the honors lessons
- term: counterexample
  aliases: [counterexamples]
  definition: 'A specific example showing that a general statement is false, such as $\dfrac{xy}{x^2 + y^2}$, which has both partial derivatives at the origin but is not continuous there.'
  topic: Differentiability
- term: error term
  definition: 'In the definition of differentiability, $E(h, k) = f(a + h, b + k) - f(a, b) - f_x(a,b)h - f_y(a,b)k$, the gap between the function and its tangent plane. $f$ is differentiable when $E/\sqrt{h^2 + k^2} \to 0$.'
  topic: Differentiability
- term: continuously differentiable
  aliases: [C1 function, $C^1$ function]
  definition: 'Having first partial derivatives that exist and are continuous (on an open set); also called a $C^1$ function. Such a function is differentiable.'
  topic: Differentiability
- term: mean value theorem
  aliases: [MVT]
  definition: 'If $g$ is continuous on $[p, q]$ and differentiable inside it, then $g(q) - g(p) = g''(c)(q - p)$ for some $c$ between $p$ and $q$.'
  topic: Differentiability
- term: second difference
  definition: 'The quantity $f(a + h, b + h) - f(a + h, b) - f(a, b + h) + f(a, b)$, which is about $h^2 f_{xy}(a, b)$ for small $h$; used to prove Clairaut''s theorem.'
  topic: Mixed partials
- term: derivative matrix
  aliases: [Jacobian matrix, total derivative]
  definition: 'For $\mathbf F: \mathbb R^n \to \mathbb R^m$, the $m\times n$ matrix $D\mathbf F$ of first partials $\partial F_i/\partial x_j$. Row $i$ is $\nabla F_i$; $\mathbf F(\mathbf a + \mathbf h) \approx \mathbf F(\mathbf a) + D\mathbf F(\mathbf a)\mathbf h$.'
  topic: Derivative matrices
- term: matrix chain rule
  definition: '$D(\mathbf G\circ\mathbf F)(\mathbf a) = D\mathbf G(\mathbf F(\mathbf a))\,D\mathbf F(\mathbf a)$: the derivative of a composite is the product of the derivative matrices, outer times inner.'
  topic: Derivative matrices
- term: inverse function theorem
  definition: 'If $\mathbf F$ is $C^1$ and $\det D\mathbf F(\mathbf a) \ne 0$, then near $\mathbf a$ the map has a $C^1$ local inverse, whose derivative at $\mathbf F(\mathbf a)$ is $D\mathbf F(\mathbf a)^{-1}$.'
  topic: Derivative matrices
- term: local inverse
  definition: 'A map that undoes $\mathbf F$ on a small neighborhood of a point, though perhaps not everywhere (the polar map has local inverses but is not one-to-one overall).'
  topic: Derivative matrices
- term: wave equation
  definition: 'The PDE $u_{tt} = c^2u_{xx}$ for vibrations and waves traveling at speed $c$; its solutions are $u = F(x - ct) + G(x + ct)$.'
  topic: Heat and wave equations
- term: Laplace's equation
  definition: 'The PDE $u_{xx} + u_{yy} = 0$ (or $\nabla^2u = 0$ in three variables); its solutions are the harmonic functions. It describes steady temperatures and electrostatic potentials.'
  topic: Laplace's equation
- term: superposition principle
  aliases: [superposition]
  definition: 'For a linear homogeneous equation, any combination $c_1u_1 + c_2u_2$ of solutions is again a solution.'
  topic: Heat and wave equations
- term: traveling wave
  aliases: [traveling waves, travelling wave]
  definition: 'A solution of the form $F(x - ct)$ (moving right at speed $c$) or $F(x + ct)$ (moving left): a fixed shape that moves without changing.'
  topic: Heat and wave equations
- term: characteristic coordinates
  definition: 'The variables $\xi = x - ct$, $\eta = x + ct$ for the wave equation; in them it becomes $U_{\xi\eta} = 0$. The lines $x \pm ct = $ constant are the characteristics.'
  topic: Heat and wave equations
- term: d'Alembert's formula
  aliases: [d'Alembert's solution]
  definition: 'The solution of $u_{tt} = c^2u_{xx}$ with $u(x,0) = \varphi(x)$, $u_t(x,0) = \psi(x)$: $u = \tfrac12[\varphi(x - ct) + \varphi(x + ct)] + \tfrac{1}{2c}\int_{x-ct}^{x+ct}\psi(s)\,ds$.'
  topic: Heat and wave equations
- term: mean value property
  definition: 'A harmonic function''s value at the center of any circle (whose disk lies in its domain) equals its average value on that circle.'
  topic: Laplace's equation
