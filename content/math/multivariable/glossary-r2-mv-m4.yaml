# Round 2 glossary for module mv-m4 (Optimization): honors lessons
- term: positive definite
  definition: 'A quadratic form (or symmetric matrix) that is positive for every nonzero input. A positive definite Hessian at a critical point means a local minimum.'
  topic: Quadratic forms and the Hessian
- term: negative definite
  definition: 'A quadratic form (or symmetric matrix) that is negative for every nonzero input. A negative definite Hessian at a critical point means a local maximum.'
  topic: Quadratic forms and the Hessian
- term: indefinite
  aliases: [indefinite quadratic form]
  definition: 'A quadratic form that takes both positive and negative values (its matrix has eigenvalues of both signs). An indefinite Hessian at a critical point means a saddle point.'
  topic: Quadratic forms and the Hessian
- term: leading principal minors
  aliases: [leading principal minor]
  definition: 'The determinants $D_1, D_2, D_3, \dots$ of the top-left $1\times1$, $2\times2$, $3\times3$, … corners of a square matrix.'
  topic: Quadratic forms and the Hessian
- term: Sylvester's criterion
  definition: 'A symmetric matrix is positive definite exactly when all its leading principal minors are positive (and negative definite when their signs alternate $-, +, -, \dots$).'
  topic: Quadratic forms and the Hessian
- term: shadow price
  definition: 'The Lagrange multiplier $\lambda$ read as the rate $dF/dk$ at which the optimal value changes when the constraint level $k$ changes: the value of one more unit of the limited resource.'
  topic: Inequality constraints
- term: feasible region
  aliases: [feasible set]
  definition: 'The set of points that satisfy all the constraints of an optimization problem, such as $g(x, y) \le k$.'
  topic: Inequality constraints
- term: active constraint
  aliases: [active, binding constraint, binding]
  definition: 'An inequality constraint $g \le k$ that holds with equality ($g = k$) at the optimum; the optimum lies on the edge of the feasible region.'
  topic: Inequality constraints
- term: inactive constraint
  aliases: [inactive, nonbinding constraint]
  definition: 'An inequality constraint that holds strictly ($g < k$) at the optimum; it does not affect the answer, and its multiplier is 0.'
  topic: Inequality constraints
- term: KKT conditions
  aliases: [Karush-Kuhn-Tucker conditions, KKT]
  definition: 'Conditions for a maximum of $f$ subject to $g \le k$: $\nabla f = \lambda\nabla g$, $\lambda \ge 0$, $g \le k$ and $\lambda(g - k) = 0$. Named for Karush (1939) and Kuhn and Tucker (1951).'
  topic: Inequality constraints
- term: complementary slackness
  definition: 'The KKT condition $\lambda(g - k) = 0$: either the multiplier is zero or the constraint is active.'
  topic: Inequality constraints
- term: iterative methods
  aliases: [iterative method]
  definition: 'Methods that start from a guess and improve it step by step, stopping when the steps stop mattering.'
  topic: Numerical optimization
- term: gradient descent
  definition: 'The iteration $\mathbf x_{n+1} = \mathbf x_n - \alpha\nabla f(\mathbf x_n)$, which steps in the direction of steepest decrease to search for a minimum.'
  topic: Numerical optimization
- term: step size
  aliases: [learning rate]
  definition: 'The positive number $\alpha$ that scales the gradient in each gradient descent step; too large and the iterates diverge, too small and they crawl.'
  topic: Numerical optimization
- term: iterate
  aliases: [iterates]
  definition: 'One of the successive approximations $\mathbf x_0, \mathbf x_1, \mathbf x_2, \dots$ produced by an iterative method.'
  topic: Numerical optimization
- term: quadratic convergence
  definition: 'Convergence in which each error is roughly a constant times the square of the previous one, so the number of correct digits about doubles each step (typical of Newton''s method).'
  topic: Numerical optimization
- term: stopping criterion
  definition: 'The rule that ends an iteration, such as stopping when $|\nabla f|$ falls below a small tolerance or after a maximum number of steps.'
  topic: Numerical optimization
