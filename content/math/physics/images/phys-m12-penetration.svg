<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="sans-serif" font-size="15" role="img"><title>Three kinds of radiation passing through paper, aluminum and lead</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect width="680" height="340" fill="#ffffff"/>
<rect x="30" y="70" width="70" height="200" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<rect x="230" y="50" width="6" height="240" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/>
<rect x="360" y="50" width="16" height="240" fill="#b9c3cc" stroke="#1c2833" stroke-width="1.5"/>
<rect x="500" y="50" width="44" height="240" fill="#5d6d7e" stroke="#1c2833" stroke-width="1.5"/>
<line x1="100.0" y1="110.0" x2="228.0" y2="110.0" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="100.0" y1="170.0" x2="358.0" y2="170.0" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="100.0" y1="230.0" x2="498.0" y2="230.0" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="546.0" y1="230.0" x2="640.0" y2="230.0" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#ah)"/>
<text x="65.0" y="175.0" text-anchor="middle" font-size="14" fill="#1c2833">source</text>
<text x="150.0" y="100.0" text-anchor="middle" font-size="14" fill="#1c2833">alpha (α)</text>
<text x="150.0" y="160.0" text-anchor="middle" font-size="14" fill="#1c2833">beta (β)</text>
<text x="150.0" y="220.0" text-anchor="middle" font-size="14" fill="#1c2833">gamma (γ)</text>
<text x="233.0" y="315.0" text-anchor="middle" font-size="14" fill="#1c2833">paper</text>
<text x="368.0" y="315.0" text-anchor="middle" font-size="14" fill="#1c2833">aluminum, a few mm</text>
<text x="560.0" y="315.0" text-anchor="middle" font-size="14" fill="#1c2833">lead, several cm</text>
<text x="600.0" y="220.0" text-anchor="middle" font-size="14" fill="#1c2833">weakened</text>
</svg>
