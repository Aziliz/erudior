<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 405" width="660" height="405" font-family="sans-serif" font-size="16" role="img">
<title>Energy flow in a heat engine and in a refrigerator</title>
<rect x="0" y="0" width="660" height="405" fill="#ffffff"/>
<rect x="40" y="40" width="220" height="56" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2" />
<rect x="40" y="304" width="220" height="56" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2" />
<circle cx="150" cy="200" r="45" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/>
<line x1="150" y1="98" x2="150.0" y2="135.2" stroke="#9b2d20" stroke-width="9" stroke-linecap="round"/>
<polygon points="150.0,152.0 138.7,130.8 161.3,130.8" fill="#9b2d20" stroke="#9b2d20" stroke-width="1" stroke-linejoin="round"/>
<line x1="197" y1="200" x2="278.8" y2="200.0" stroke="#244d76" stroke-width="5" stroke-linecap="round"/>
<polygon points="290.0,200.0 275.9,207.5 275.9,192.5" fill="#244d76" stroke="#244d76" stroke-width="1" stroke-linejoin="round"/>
<line x1="150" y1="247" x2="150.0" y2="287.4" stroke="#9b2d20" stroke-width="6" stroke-linecap="round"/>
<polygon points="150.0,300.0 141.5,284.1 158.5,284.1" fill="#9b2d20" stroke="#9b2d20" stroke-width="1" stroke-linejoin="round"/>
<text x="150" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2833">Heat engine</text>
<text x="150" y="74" text-anchor="middle" font-size="16" fill="#1c2833">hot reservoir, T<tspan font-size="14" dy="4">H</tspan></text>
<text x="150" y="338" text-anchor="middle" font-size="16" fill="#1c2833">cold reservoir, T<tspan font-size="14" dy="4">C</tspan></text>
<text x="150" y="205" text-anchor="middle" font-size="16" font-weight="normal" fill="#1c2833">engine</text>
<text x="165" y="130" font-size="17" font-weight="bold" fill="#9b2d20">Q<tspan font-size="14" dy="4">H</tspan></text>
<text x="165" y="280" font-size="17" font-weight="bold" fill="#9b2d20">Q<tspan font-size="14" dy="4">C</tspan></text>
<text x="245" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#244d76">W</text>
<text x="150" y="390" text-anchor="middle" font-size="16" fill="#1c2833">W = Q<tspan font-size="14" dy="4">H</tspan><tspan dy="-4"> − Q</tspan><tspan font-size="14" dy="4">C</tspan></text>
<rect x="380" y="40" width="220" height="56" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2" />
<rect x="380" y="304" width="220" height="56" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="2" />
<circle cx="490" cy="200" r="45" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/>
<line x1="490" y1="152" x2="490.0" y2="116.8" stroke="#9b2d20" stroke-width="9" stroke-linecap="round"/>
<polygon points="490.0,100.0 501.3,121.2 478.7,121.2" fill="#9b2d20" stroke="#9b2d20" stroke-width="1" stroke-linejoin="round"/>
<line x1="630" y1="200" x2="550.2" y2="200.0" stroke="#244d76" stroke-width="5" stroke-linecap="round"/>
<polygon points="539.0,200.0 553.1,192.5 553.1,207.5" fill="#244d76" stroke="#244d76" stroke-width="1" stroke-linejoin="round"/>
<line x1="490" y1="302" x2="490.0" y2="261.6" stroke="#9b2d20" stroke-width="6" stroke-linecap="round"/>
<polygon points="490.0,249.0 498.5,264.9 481.5,264.9" fill="#9b2d20" stroke="#9b2d20" stroke-width="1" stroke-linejoin="round"/>
<text x="490" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1c2833">Refrigerator</text>
<text x="490" y="74" text-anchor="middle" font-size="16" fill="#1c2833">hot reservoir, T<tspan font-size="14" dy="4">H</tspan></text>
<text x="490" y="338" text-anchor="middle" font-size="16" fill="#1c2833">cold reservoir, T<tspan font-size="14" dy="4">C</tspan></text>
<text x="490" y="205" text-anchor="middle" font-size="16" font-weight="normal" fill="#1c2833">fridge</text>
<text x="505" y="130" font-size="17" font-weight="bold" fill="#9b2d20">Q<tspan font-size="14" dy="4">H</tspan></text>
<text x="505" y="280" font-size="17" font-weight="bold" fill="#9b2d20">Q<tspan font-size="14" dy="4">C</tspan></text>
<text x="585" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#244d76">W</text>
<text x="490" y="390" text-anchor="middle" font-size="16" fill="#1c2833">Q<tspan font-size="14" dy="4">C</tspan><tspan dy="-4"> + W = Q</tspan><tspan font-size="14" dy="4">H</tspan></text>
<line x1="320" y1="20" x2="320" y2="390" stroke="#5d6d7e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"/>
</svg>
