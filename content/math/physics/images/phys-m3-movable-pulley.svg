<text x="240.0" y="62.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">you pull</text>
<text x="212.0" y="388.0" font-size="18" text-anchor="start" fill="#1c2833" font-weight="normal" font-style="italic">W</text>
<text x="320.0" y="200.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">Two strands hold the load:</text>
<text x="320.0" y="224.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">2T = W, so T = W/2</text>
<text x="320.0" y="270.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">Pull 2 m of rope and each</text>
<text x="320.0" y="294.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">strand shortens by 1 m:</text>
<text x="320.0" y="318.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal">the load rises 1 m.</text>
