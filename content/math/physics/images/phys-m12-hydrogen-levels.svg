<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" font-family="sans-serif" font-size="15" role="img"><title>Energy levels of hydrogen with downward transitions grouped into series</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<rect width="640" height="420" fill="#ffffff"/>
<rect x="150" y="50.0" width="380" height="330.0" fill="#e8e2f3" opacity="0.35"/>
<line x1="150.0" y1="380.0" x2="530.0" y2="380.0" stroke="#1c2833" stroke-width="2.5"/>
<text x="540.0" y="385.0" text-anchor="start" font-size="14" fill="#1c2833">−13.60 eV</text>
<line x1="150.0" y1="235.0" x2="530.0" y2="235.0" stroke="#1c2833" stroke-width="2.5"/>
<text x="540.0" y="240.0" text-anchor="start" font-size="14" fill="#1c2833">−3.40 eV</text>
<line x1="150.0" y1="160.0" x2="530.0" y2="160.0" stroke="#1c2833" stroke-width="2.5"/>
<text x="540.0" y="165.0" text-anchor="start" font-size="14" fill="#1c2833">−1.51 eV</text>
<line x1="150.0" y1="100.0" x2="530.0" y2="100.0" stroke="#1c2833" stroke-width="2.5"/>
<text x="540.0" y="105.0" text-anchor="start" font-size="14" fill="#1c2833">−0.85 eV</text>
<line x1="150.0" y1="50.0" x2="530.0" y2="50.0" stroke="#1c2833" stroke-width="2.5" stroke-dasharray="8,5"/>
<text x="540.0" y="55.0" text-anchor="start" font-size="14" fill="#1c2833">0 eV</text>
<line x1="190.0" y1="235.0" x2="190.0" y2="377.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="215.0" y1="160.0" x2="215.0" y2="377.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="240.0" y1="100.0" x2="240.0" y2="377.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="330.0" y1="160.0" x2="330.0" y2="232.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="355.0" y1="100.0" x2="355.0" y2="232.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<line x1="450.0" y1="100.0" x2="450.0" y2="157.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/>
<text x="140.0" y="385.0" text-anchor="end" font-size="14" fill="#1c2833">n = 1</text>
<text x="140.0" y="240.0" text-anchor="end" font-size="14" fill="#1c2833">n = 2</text>
<text x="140.0" y="165.0" text-anchor="end" font-size="14" fill="#1c2833">n = 3</text>
<text x="140.0" y="105.0" text-anchor="end" font-size="14" fill="#1c2833">n = 4</text>
<text x="140.0" y="55.0" text-anchor="end" font-size="14" fill="#1c2833">n = ∞</text>
<text x="340.0" y="410.0" text-anchor="middle" font-size="14" fill="#1c2833">ground state (n = 1)</text>
<text x="340.0" y="40.0" text-anchor="middle" font-size="14" fill="#1c2833">ionization limit: electron free</text>
<text x="560.0" y="410.0" text-anchor="middle" font-size="13" fill="#1c2833" font-style="italic">spacing not to scale</text>
<text x="250.0" y="300.0" text-anchor="start" font-size="14" fill="#1c2833">Lyman series</text>
<text x="250.0" y="318.0" text-anchor="start" font-size="14" fill="#1c2833">(ultraviolet)</text>
<text x="366.0" y="200.0" text-anchor="start" font-size="14" fill="#1c2833">Balmer series (visible)</text>
<text x="462.0" y="124.0" text-anchor="start" font-size="14" fill="#1c2833">Paschen series</text>
<text x="462.0" y="142.0" text-anchor="start" font-size="14" fill="#1c2833">(infrared)</text>
</svg>
