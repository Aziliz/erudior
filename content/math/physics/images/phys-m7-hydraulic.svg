<svg xmlns="http://www.w3.org/2000/svg" viewBox="135 0 590 440" width="590" height="440" font-family="sans-serif" font-size="16" role="img">
<title>A hydraulic lift</title>
<rect x="135" y="0" width="590" height="440" fill="#ffffff"/>
<polygon points="160.0,180.0 220.0,180.0 220.0,340.0 420.0,340.0 420.0,250.0 680.0,250.0 680.0,390.0 160.0,390.0" fill="#dde8f3" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<polyline points="160.0,110.0 160.0,390.0 680.0,390.0 680.0,190.0" fill="none" stroke="#1c2833" stroke-width="4" stroke-linejoin="round"/>
<polyline points="220.0,110.0 220.0,340.0 420.0,340.0 420.0,190.0" fill="none" stroke="#1c2833" stroke-width="4" stroke-linejoin="round"/>
<rect x="162" y="160" width="56" height="20" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2" />
<rect x="422" y="230" width="256" height="20" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2" />
<rect x="480" y="160" width="140" height="70" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="2" />
<line x1="190" y1="50" x2="190.0" y2="145.8" stroke="#9b2d20" stroke-width="4" stroke-linecap="round"/>
<polygon points="190.0,157.0 182.5,142.9 197.5,142.9" fill="#9b2d20" stroke="#9b2d20" stroke-width="1" stroke-linejoin="round"/>
<line x1="650" y1="226" x2="650.0" y2="151.2" stroke="#244d76" stroke-width="4" stroke-linecap="round"/>
<polygon points="650.0,140.0 657.5,154.1 642.5,154.1" fill="#244d76" stroke="#244d76" stroke-width="1" stroke-linejoin="round"/>
<text x="205" y="75" text-anchor="start" font-size="16" font-weight="normal" fill="#1c2833">applied force F₁</text>
<line x1="232" y1="175" x2="216" y2="170" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/>
<text x="236" y="180" text-anchor="start" font-size="16" font-weight="normal" fill="#1c2833">small piston</text>
<text x="236" y="200" text-anchor="start" font-size="16" font-weight="normal" fill="#1c2833">(area A₁)</text>
<text x="410" y="220" text-anchor="end" font-size="16" font-weight="normal" fill="#1c2833">large piston</text>
<text x="410" y="240" text-anchor="end" font-size="16" font-weight="normal" fill="#1c2833">(area A₂)</text>
<line x1="412" y1="236" x2="436" y2="240" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/>
<text x="550" y="200" text-anchor="middle" font-size="16" font-weight="normal" fill="#1c2833">load</text>
<text x="320" y="372" text-anchor="middle" font-size="16" font-weight="normal" fill="#1c2833">hydraulic fluid</text>
<text x="662" y="130" text-anchor="start" font-size="16" font-weight="normal" fill="#1c2833">F₂</text>
<text x="420" y="425" text-anchor="middle" font-size="15" font-weight="normal" fill="#1c2833">Same pressure throughout: F₁/A₁ = F₂/A₂</text>
</svg>
