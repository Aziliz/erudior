# Round 2, honors module phys-h1 (Frontiers of physics): terms bolded in lessons 90-93.
# Lesson 90
- term: general relativity
  aliases: [GR, general theory of relativity]
  definition: 'Einstein''s 1915 theory of gravity: mass and energy curve spacetime, and objects with no other forces on them follow the straightest paths through it. For weak fields and slow speeds it reduces to Newton''s law of gravity.'
  topic: General relativity
- term: equivalence principle
  aliases: [principle of equivalence]
  definition: 'The principle that, in a small enough region, being in a gravitational field cannot be told apart from being in an accelerating frame. It rests on the equality of inertial and gravitational mass.'
  topic: General relativity
- term: gravitational redshift
  definition: 'The drop in frequency (rise in wavelength) of light climbing out of a gravitational field: by about $gh/c^2$ over a height $h$ near Earth. First measured by Pound and Rebka in 1959.'
  topic: General relativity
- term: gravitational time dilation
  definition: 'The slowing of clocks lower in a gravitational field. Near Earth a clock higher by $h$ runs fast by the fraction $gh/c^2$; GPS satellite clocks gain about 45.7 μs per day from it.'
  topic: General relativity
- term: gravitational lensing
  aliases: [gravitational lens, gravitational lenses]
  definition: 'The bending of light from a distant source by the mass of a galaxy or cluster in front of it, which can brighten, distort or multiply the image. Used to map mass that can''t be seen.'
  topic: General relativity
- term: black hole
  aliases: [black holes]
  definition: 'A region where spacetime is curved so strongly that nothing, not even light, can escape. Its boundary is the event horizon.'
  topic: Black holes and gravitational waves
- term: event horizon
  aliases: [horizon, event horizons]
  definition: 'The boundary of a black hole, the point of no return: inside it nothing can get out. For a non-rotating black hole it is a sphere with the Schwarzschild radius.'
  topic: Black holes and gravitational waves
- term: Schwarzschild radius
  aliases: [Schwarzschild radii]
  definition: 'The radius of a non-rotating black hole''s event horizon, $r_s = 2GM/c^2$: about 2.95 km per solar mass.'
  topic: Black holes and gravitational waves
- term: gravitational wave
  aliases: [gravitational waves]
  definition: 'A ripple in spacetime, produced by accelerating masses, that travels at the speed of light and stretches and squeezes lengths across its direction of travel by a tiny fraction $h = \Delta L/L$. First detected by LIGO in 2015.'
  topic: Black holes and gravitational waves
# Lesson 91
- term: Standard Model
  aliases: [Standard Model of particle physics]
  definition: 'The theory of the known fundamental particles (six quarks, six leptons, the gauge bosons and the Higgs boson) and of the strong, electromagnetic and weak interactions. Gravity is not part of it.'
  topic: Particle physics
- term: antiparticle
  aliases: [antiparticles, antimatter]
  definition: 'A particle with the same mass as another but opposite charge (and opposite baryon and lepton numbers). The positron is the electron''s antiparticle; antiparticles are written with a bar, such as $\bar\nu$.'
  topic: Particle physics
- term: positron
  aliases: [positrons, antielectron]
  definition: 'The electron''s antiparticle, $e^+$: same mass (0.511 MeV), charge $+e$. Predicted by Dirac (1928) and found by Anderson (1932).'
  topic: Particle physics
- term: annihilation
  aliases: [annihilate, annihilates, pair annihilation]
  definition: 'The conversion of a particle and its antiparticle into other particles, often photons. An electron and positron at rest give two 0.511 MeV photons moving in opposite directions.'
  topic: Particle physics
- term: pair production
  definition: 'The creation of a particle and its antiparticle from energy, for example a photon becoming an electron and a positron near a nucleus. The photon needs at least $2mc^2$ (1.022 MeV for an electron pair).'
  topic: Particle physics
- term: hadron
  aliases: [hadrons]
  definition: 'Any particle made of quarks and held together by the strong force: baryons (three quarks) and mesons (quark and antiquark).'
  topic: Particle physics
- term: quark
  aliases: [quarks]
  definition: 'A fundamental matter particle that feels the strong force and has fractional charge: up ($+\tfrac23e$), down ($-\tfrac13e$), and the heavier charm, strange, top and bottom. Quarks are always confined in hadrons.'
  topic: Particle physics
- term: baryon
  aliases: [baryons]
  definition: 'A hadron made of three quarks, such as the proton (uud) and the neutron (udd). Baryons have baryon number +1.'
  topic: Particle physics
- term: meson
  aliases: [mesons]
  definition: 'A hadron made of a quark and an antiquark, such as the pion $\pi^+$ (u and anti-d). Mesons have baryon number 0.'
  topic: Particle physics
- term: confinement
  aliases: [quark confinement]
  definition: 'The fact that quarks are never found alone: pulling them apart creates new quark–antiquark pairs, so they always come out bound into hadrons.'
  topic: Particle physics
- term: generation
  aliases: [generations]
  definition: 'One of the three families of matter particles in the Standard Model, each heavier than the last: (up, down, electron, electron neutrino), (charm, strange, muon, muon neutrino), (top, bottom, tau, tau neutrino).'
  topic: Particle physics
- term: lepton
  aliases: [leptons]
  definition: 'A fundamental matter particle that does not feel the strong force: the electron, muon and tau, and their three neutrinos.'
  topic: Particle physics
- term: neutrino
  aliases: [neutrinos]
  definition: 'A neutral lepton with a very small mass that interacts only through the weak force (and gravity). There are three types, paired with the electron, muon and tau.'
  topic: Particle physics
- term: fermion
  aliases: [fermions]
  definition: 'A particle, such as a quark, lepton, proton or neutron, that obeys the Pauli exclusion principle. The matter particles of the Standard Model are fermions.'
  topic: Particle physics
- term: boson
  aliases: [bosons]
  definition: 'A particle that does not obey the Pauli exclusion principle, such as the photon, gluon, W and Z, and Higgs boson.'
  topic: Particle physics
- term: gauge boson
  aliases: [gauge bosons, force carrier, force carriers]
  definition: 'A particle whose exchange produces a force: the gluon (strong), the photon (electromagnetic), and the W and Z bosons (weak).'
  topic: Particle physics
- term: gluon
  aliases: [gluons]
  definition: 'The massless gauge boson that carries the strong force between quarks.'
  topic: Particle physics
- term: W and Z bosons
  aliases: [W boson, Z boson, W bosons, Z bosons]
  definition: 'The heavy gauge bosons (rest energies about 80 GeV and 91 GeV) that carry the weak force; their large mass gives the weak force its short range, about $10^{-18}$ m.'
  topic: Particle physics
- term: Higgs boson
  aliases: [Higgs particle, Higgs field]
  definition: 'The particle of the Higgs field, which gives the W and Z bosons, quarks and charged leptons their masses. Discovered at CERN''s Large Hadron Collider in 2012, with a rest energy of about 125 GeV.'
  topic: Particle physics
- term: baryon number
  definition: 'A conserved count: $+\tfrac13$ per quark, so +1 per baryon, −1 per antibaryon, and 0 for mesons, leptons and photons.'
  topic: Conservation laws in particle reactions
- term: lepton number
  definition: 'A conserved count: +1 for each lepton, −1 for each antilepton, 0 for everything else. Electron-, muon- and tau-type lepton numbers are each conserved in reactions (only neutrino oscillations mix them).'
  topic: Conservation laws in particle reactions
# Lesson 92
- term: cosmology
  definition: 'The study of the universe as a whole: its size, structure, history and contents.'
  topic: Cosmology
- term: parallax angle
  aliases: [parallax, stellar parallax]
  definition: 'Half the yearly back-and-forth shift of a nearby star against distant ones: the angle the Earth–Sun distance makes as seen from the star. Distance in parsecs is $1/p$ with $p$ in arcseconds.'
  topic: Cosmology
- term: parsec
  aliases: [parsecs, pc, megaparsec, Mpc]
  definition: 'The distance at which a star''s parallax angle is one arcsecond: $3.086\times10^{16}$ m, or 3.26 light-years. A megaparsec (Mpc) is a million parsecs.'
  topic: Cosmology
- term: light-year
  aliases: [light-years, light year, light years, ly]
  definition: 'The distance light travels in one year, $9.46\times10^{15}$ m. It is a distance, not a time.'
  topic: Cosmology
- term: standard candle
  aliases: [standard candles]
  definition: 'An astronomical object of known luminosity, such as a Cepheid variable star or a type Ia supernova; comparing its known power with its measured brightness, $I = L/(4\pi d^2)$, gives its distance.'
  topic: Cosmology
- term: redshift
  aliases: [redshifts, red shift, redshifted]
  definition: 'The fractional increase in wavelength of light from a distant source, $z = (\lambda_{\text{obs}} - \lambda_{\text{emit}})/\lambda_{\text{emit}}$. For small $z$ the recession speed is $v \approx cz$.'
  topic: Cosmology
- term: Hubble's law
  aliases: [Hubble–Lemaître law, Hubble-Lemaitre law]
  definition: 'The proportionality between a galaxy''s recession speed and its distance, $v = H_0d$, found by Lemaître (1927) and Hubble (1929). It reflects the expansion of space.'
  topic: Cosmology
- term: Hubble constant
  aliases: [H₀, H0]
  definition: 'The constant $H_0$ in Hubble''s law, about 70 km/s per megaparsec. Different methods give about 67 and about 73, a disagreement called the Hubble tension.'
  topic: Cosmology
- term: Hubble time
  definition: 'The time $1/H_0$, about 14 billion years for $H_0 = 70$ km/s/Mpc: how long ago all galaxies would have been together if they had always moved at today''s speeds. The measured age of the universe is 13.8 billion years.'
  topic: Cosmology
- term: Big Bang
  aliases: [Big Bang theory, hot Big Bang]
  definition: 'The theory that the universe was once extremely hot and dense and has been expanding and cooling for about 13.8 billion years. It was not an explosion from a point: space itself expands everywhere.'
  topic: Cosmology
- term: cosmic microwave background
  aliases: [CMB, cosmic microwave background radiation, CMBR]
  definition: 'Blackbody radiation at 2.725 K arriving from every direction, released about 380 000 years after the Big Bang when the universe became transparent, and stretched into microwaves by the expansion.'
  topic: Cosmology
- term: rotation curve
  aliases: [rotation curves]
  definition: 'A graph of the orbital speed of stars and gas against distance from a galaxy''s center. Observed curves stay roughly flat far beyond the visible stars, evidence for dark matter.'
  topic: Dark matter and dark energy
- term: dark matter
  definition: 'Matter that has gravity but emits and absorbs no light, inferred from rotation curves, cluster motions, gravitational lensing and the CMB. It makes up about 27% of the universe; what it is remains unknown.'
  topic: Dark matter and dark energy
- term: dark energy
  definition: 'The unknown cause of the accelerating expansion of the universe, discovered in 1998 with distant supernovae. It makes up about 68% of the universe''s energy density.'
  topic: Dark matter and dark energy
- term: critical density
  definition: 'The density $\rho_c = 3H^2/(8\pi G)$ at which the universe''s geometry is flat, about $9\times10^{-27}$ kg/m³ (five or six hydrogen atoms per cubic meter) today. The measured total density is very close to it.'
  topic: Dark matter and dark energy
# Lesson 93
- term: solar constant
  definition: 'The intensity of sunlight at Earth''s distance, above the atmosphere, on a surface facing the Sun: about 1361 W/m².'
  topic: Planetary energy balance
- term: albedo
  aliases: [albedos]
  definition: 'The fraction of incoming sunlight a planet or surface reflects. Earth''s is about 0.30; fresh snow''s is much higher, the ocean''s much lower.'
  topic: Planetary energy balance
- term: effective temperature
  aliases: [radiating temperature]
  definition: 'The temperature a blackbody would need to radiate away the power a planet absorbs: $T_e = [S(1 - \alpha)/(4\sigma)]^{1/4}$. About 255 K for Earth.'
  topic: Planetary energy balance
- term: greenhouse effect
  definition: 'The warming of a planet''s surface by an atmosphere that lets sunlight through but absorbs the surface''s infrared and radiates part of it back down. It keeps Earth''s average surface about 33 K warmer than its effective temperature.'
  topic: Greenhouse effect and climate change
- term: greenhouse gas
  aliases: [greenhouse gases]
  definition: 'A gas, such as water vapor, carbon dioxide or methane, that is nearly transparent to sunlight but absorbs and emits infrared radiation.'
  topic: Greenhouse effect and climate change
- term: radiative forcing
  aliases: [forcing]
  definition: 'A change in the net energy flow into the climate system, in W/m², before temperatures respond. For CO₂, about $5.35\ln(C/C_0)$ W/m², or 3.7 W/m² per doubling.'
  topic: Greenhouse effect and climate change
- term: climate feedback
  aliases: [feedback, feedbacks, climate feedbacks]
  definition: 'A change caused by warming or cooling that alters the energy balance further. Amplifying (positive) feedbacks include water vapor and ice–albedo; the extra infrared a warmer planet radiates is stabilizing.'
  topic: Greenhouse effect and climate change
- term: climate sensitivity
  aliases: [equilibrium climate sensitivity, ECS]
  definition: 'The eventual global warming caused by doubling the CO₂ concentration, once the climate has settled: best estimate about 3 °C, likely 2.5 to 4 °C (IPCC, 2021).'
  topic: Greenhouse effect and climate change
