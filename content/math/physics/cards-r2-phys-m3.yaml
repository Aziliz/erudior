# Round 2 cards for phys-m3 (honors lessons)
- {front: 'Static friction as an unknown', back: 'Assume no slipping, find the friction needed for the shared acceleration, then check it is at most $\mu_s n$. If not, the surfaces slip: use $\mu_k n$ against the relative sliding.', topic: Friction in systems}
- {front: 'Which way does friction point?', back: 'Opposite to the relative sliding (or tendency to slide) of the two surfaces. It can point in the direction of motion, as on a block riding an accelerating cart.', topic: Friction in systems}
- {front: 'Impending motion', back: 'Static friction exactly at its limit, $f_s = \mu_s n$: use it for "largest force" or "steepest angle" questions.', topic: Friction in systems}
- {front: 'Stacked blocks, push F on the bottom block, frictionless floor: largest F before slipping', back: '$F_{\max} = (m + M)\mu_s g$; the top block''s largest acceleration is $\mu_s g$.', topic: Friction in systems}
- {front: 'Stacked blocks after slipping', back: 'Top block: $a = \mu_k g$ (friction forward). Bottom block: $a = (F - \mu_k mg)/M$.', topic: Friction in systems}
- {front: 'Ramp block $m_1$ tied over a pulley to hanging $m_2$: range that stays at rest', back: '$m_1(\sin\theta - \mu_s\cos\theta) \le m_2 \le m_1(\sin\theta + \mu_s\cos\theta)$', topic: Friction in systems}
- {front: 'Banked curve with friction: fastest speed', back: '$v_{\max}^2 = rg\dfrac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta}$ (friction points down the bank).', topic: Friction in systems}
- {front: 'Banked curve with friction: slowest speed', back: '$v_{\min}^2 = rg\dfrac{\sin\theta - \mu_s\cos\theta}{\cos\theta + \mu_s\sin\theta}$; no minimum if $\mu_s \ge \tan\theta$.', topic: Friction in systems}
- {front: 'Maximum acceleration of an all-wheel-drive car on level ground', back: 'About $\mu_s g$: static friction from the road on the tires is what pushes the car forward.', topic: Friction in systems}
- {front: 'Fictitious force in a frame accelerating at $\vec A$', back: '$-m\vec A$ on every object, opposite the frame''s acceleration; no third-law partner.', topic: Accelerating frames}
- {front: 'Effective gravity', back: '$\vec g_{\text{eff}} = \vec g - \vec A$. Elevator accelerating up: $g + A$; free fall: 0.', topic: Accelerating frames}
- {front: 'Pendulum in a car accelerating at A', back: 'Hangs backward at $\tan\theta = A/g$, with $T = m\sqrt{g^2 + A^2}$.', topic: Accelerating frames}
- {front: 'Centrifugal force', back: 'Fictitious force $m\omega^2 r$ outward, felt only in a rotating frame; never on the same diagram as a centripetal acceleration.', topic: Accelerating frames}
- {front: 'Artificial gravity in a station of radius r', back: '$\omega = \sqrt{g/r}$, period $2\pi\sqrt{r/g}$; "down" is outward.', topic: Accelerating frames}
- {front: 'Coriolis force', back: 'Acts on objects moving in a rotating frame, perpendicular to the velocity, size $2m\omega v$ (motion perpendicular to the axis); deflects to the right in the Northern Hemisphere.', topic: Accelerating frames}
- {front: 'Is Earth an inertial frame?', back: 'Nearly. Its rotation gives a centrifugal term of only $\omega^2R_E \approx 0.034$ m/s² at the equator, and a Coriolis effect that matters only for large, long-lasting motions.', topic: Accelerating frames}
