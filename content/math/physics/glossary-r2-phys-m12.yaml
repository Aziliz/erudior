# Round 2, module phys-m12: terms bolded in the honors lessons 49h1 (spacetime) and 49h2 (nuclear energy).
- term: spacetime
  definition: 'Space and time combined into one four-dimensional setting for events. Observers in relative motion divide it into space and time differently but agree on the spacetime interval.'
  topic: Spacetime geometry
- term: spacetime diagram
  aliases: [spacetime diagrams, Minkowski diagram]
  definition: 'A graph with position across and time up (often in years and light-years, so light moves at 45°). Events are points; the histories of objects are lines.'
  topic: Spacetime geometry
- term: event
  aliases: [events]
  definition: 'Something that happens at one place at one instant, such as a flash or a clock tick: a single point on a spacetime diagram.'
  topic: Spacetime geometry
- term: worldline
  aliases: [worldlines, world line]
  definition: 'The path of an object through spacetime. An object at rest has a vertical worldline; a moving object''s worldline tilts, always steeper than light''s 45° line.'
  topic: Spacetime geometry
- term: light cone
  aliases: [light cones]
  definition: 'The light paths through an event. Events inside its upper half are the event''s possible future, inside its lower half its possible past; events outside can''t be connected to it by any signal.'
  topic: Spacetime geometry
- term: spacetime interval
  aliases: [interval, invariant interval]
  definition: '$(\Delta s)^2 = (c\,\Delta t)^2 - (\Delta x)^2$ between two events: the same value in every inertial frame, even though $\Delta t$ and $\Delta x$ differ.'
  topic: Spacetime geometry
- term: timelike
  aliases: [timelike interval, timelike separation]
  definition: 'Two events with $(\Delta s)^2 > 0$: a clock can travel from one to the other, reading proper time $\Delta s/c$, and every observer agrees on their order.'
  topic: Spacetime geometry
- term: lightlike
  aliases: [lightlike interval, null interval]
  definition: 'Two events with $(\Delta s)^2 = 0$: only a light signal can connect them.'
  topic: Spacetime geometry
- term: spacelike
  aliases: [spacelike interval, spacelike separation]
  definition: 'Two events with $(\Delta s)^2 < 0$: too far apart for any signal to connect them. Some frame sees them as simultaneous, and observers can disagree about their order.'
  topic: Spacetime geometry
- term: twin paradox
  definition: 'The puzzle that a twin who travels away and back ages less, although each twin sees the other moving. It is resolved because only the stay-at-home twin stays in one inertial frame.'
  topic: Spacetime geometry
- term: relativistic Doppler effect
  aliases: [relativistic Doppler shift]
  definition: 'The change in frequency of light from a moving source: $f = f_0\sqrt{(1 - \beta)/(1 + \beta)}$ when receding and the inverse when approaching, with $\beta = v/c$.'
  topic: Spacetime geometry
- term: Q-value
  aliases: [Q-values, reaction energy]
  definition: 'The rest energy a nuclear reaction or decay converts: $Q = (\sum m_{\text{before}} - \sum m_{\text{after}})c^2$. Positive Q releases energy; negative Q needs energy supplied.'
  topic: Nuclear reactions
- term: neutrino
  aliases: [neutrinos, antineutrino, antineutrinos]
  definition: 'A neutral, nearly massless particle emitted in beta decay (an antineutrino in beta-minus, a neutrino in beta-plus). Proposed by Pauli in 1930 to explain the continuous beta spectrum; detected in 1956.'
  topic: Nuclear reactions
- term: positron
  aliases: [positrons]
  definition: 'The antiparticle of the electron: the same mass, charge $+e$. Emitted in beta-plus decay; it annihilates with an electron.'
  topic: Nuclear reactions
- term: annihilation
  aliases: [annihilate, annihilates, pair annihilation]
  definition: 'A particle and its antiparticle turning entirely into energy; an electron and positron at rest give two 0.511 MeV photons going in opposite directions.'
  topic: Nuclear reactions
- term: pair production
  definition: 'A photon of at least 1.022 MeV turning into an electron and a positron near a nucleus (which takes up some momentum).'
  topic: Nuclear reactions
- term: threshold energy
  aliases: [threshold]
  definition: 'The least kinetic energy a projectile needs to cause a reaction with $Q < 0$: $K_{\text{th}} = -Q(1 + m_{\text{projectile}}/m_{\text{target}})$ at nonrelativistic speeds.'
  topic: Nuclear reactions
- term: chain reaction
  aliases: [chain reactions]
  definition: 'A self-sustaining series of fissions, in which neutrons released by each fission cause further fissions.'
  topic: Nuclear reactions
- term: multiplication factor
  aliases: [neutron multiplication factor]
  definition: 'The average number of neutrons from one fission that cause another, $k$. $k < 1$: the reaction dies out; $k = 1$: steady (critical); $k > 1$: it grows.'
  topic: Nuclear reactions
- term: moderator
  aliases: [moderators]
  definition: 'Material in a reactor, such as water or graphite, whose light nuclei slow fast neutrons by collisions so that uranium-235 captures them more readily.'
  topic: Nuclear reactions
- term: control rod
  aliases: [control rods]
  definition: 'A rod of neutron-absorbing material (boron or cadmium) moved into or out of a reactor core to keep the multiplication factor at 1.'
  topic: Nuclear reactions
- term: Coulomb barrier
  definition: 'The electric repulsion two nuclei must overcome to get within range of the strong force, roughly 0.5 MeV for hydrogen isotopes; it is why fusion needs extreme temperatures (and quantum tunneling).'
  topic: Nuclear reactions
- term: absorbed dose
  definition: 'Radiation energy deposited per kilogram of tissue, $D = E/m$, measured in grays (1 Gy = 1 J/kg).'
  topic: Radiation dose
- term: gray
  aliases: [grays, Gy]
  definition: 'SI unit of absorbed dose: 1 Gy = 1 joule absorbed per kilogram.'
  topic: Radiation dose
- term: equivalent dose
  definition: 'Absorbed dose multiplied by the radiation weighting factor, $H = w_RD$, measured in sieverts; it accounts for how damaging each type of radiation is.'
  topic: Radiation dose
- term: radiation weighting factor
  aliases: [weighting factor]
  definition: 'The factor $w_R$ converting grays to sieverts: 1 for gamma rays, X-rays and electrons, 2 for protons, 20 for alpha particles, 2.5 to 20 for neutrons (ICRP 2007).'
  topic: Radiation dose
- term: sievert
  aliases: [sieverts, Sv, millisievert, millisieverts, mSv]
  definition: 'SI unit of equivalent dose (and effective dose). A typical U.S. resident receives about 6 mSv a year.'
  topic: Radiation dose
- term: linear no-threshold model
  aliases: [LNT, LNT model]
  definition: 'The assumption, used to set radiation protection limits, that cancer risk is proportional to dose with no completely safe level. Whether it holds at very low doses is debated.'
  topic: Radiation dose
