# Round 2 notecards for phys-m9
- {front: Voltage divider output (no load), back: '$V_{\text{out}} = \mathcal{E}\dfrac{R_2}{R_1 + R_2}$; attaching a load across $R_2$ lowers it', topic: Equivalent circuits}
- {front: Wheatstone bridge balance condition, back: '$\dfrac{R_1}{R_2} = \dfrac{R_3}{R_x}$, so $R_x = R_2R_3/R_1$; the emf cancels out', topic: Bridge circuits}
- {front: 'Why use a bridge instead of $R = V/I$?', back: 'The galvanometer only has to detect zero (a null measurement), and the result does not depend on the emf or meter calibration', topic: Bridge circuits}
- {front: Thévenin's theorem, back: 'A linear two-terminal network acts like one emf $V_{\text{th}}$ in series with one resistance $R_{\text{th}}$', topic: Equivalent circuits}
- {front: 'How to find $V_{\text{th}}$', back: 'The open-circuit voltage between the terminals (nothing connected)', topic: Equivalent circuits}
- {front: 'How to find $R_{\text{th}}$', back: 'Replace each ideal battery with a wire and find the resistance between the terminals; or $R_{\text{th}} = V_{\text{oc}}/I_{\text{sc}}$', topic: Equivalent circuits}
- {front: Load current from a Thévenin equivalent, back: '$I_L = \dfrac{V_{\text{th}}}{R_{\text{th}} + R_L}$; most power to the load when $R_L = R_{\text{th}}$', topic: Equivalent circuits}
- {front: Voltmeter reading with loading, back: '$V_{\text{read}} = V_{\text{th}}\dfrac{R_V}{R_V + R_{\text{th}}}$; small error only when $R_V \gg R_{\text{th}}$', topic: Equivalent circuits}
- {front: Superposition theorem, back: 'Add the currents from each source acting alone (others replaced by wires). Works for currents and voltages, not power.', topic: Equivalent circuits}
- {front: Ohm's law at a point, back: '$J = \sigma E$ (or $E = \rho J$), with $J = I/A$ and $\sigma = 1/\rho$', topic: Conduction models}
- {front: Drude model results, back: '$v_d = \dfrac{eE\tau}{m}$, $\sigma = \dfrac{ne^2\tau}{m}$, $\rho = \dfrac{m}{ne^2\tau}$', topic: Conduction models}
- {front: Mobility, back: '$\mu = v_d/E = e\tau/m$, in m²/(V·s); copper about $4.3\times10^{-3}$, lightly doped silicon about 0.1', topic: Conduction models}
- {front: Copper's mean free time and mean free path, back: 'About $2.5\times10^{-14}$ s and 40 nm at room temperature', topic: Conduction models}
- {front: Resistivity versus temperature (metal), back: '$\rho = \rho_0[1 + \alpha(T - T_0)]$; rises because lattice vibrations scatter electrons more often', topic: Conduction models}
- {front: Resistivity versus temperature (semiconductor), back: 'Falls as temperature rises: heat frees many more carriers (used in thermistors)', topic: Semiconductors}
- {front: Superconductor, back: 'Exactly zero resistivity below a critical temperature (mercury 4.2 K, 1911; YBCO about 90 K)', topic: Conduction models}
- {front: n-type versus p-type silicon, back: 'n-type: doped with 5-electron atoms (P, As), extra free electrons. p-type: doped with 3-electron atoms (B, Ga), extra holes.', topic: Semiconductors}
- {front: Conductivity with one kind of carrier, back: '$\sigma = ne\mu$', topic: Semiconductors}
- {front: Diode, back: 'A p–n junction: almost no current in reverse; conducts forward above about 0.6–0.7 V (silicon)', topic: Semiconductors}
- {front: LED forward voltage, back: 'Roughly the photon energy in eV: about 2 V for red, about 3 V for blue', topic: Semiconductors}
- {front: Capacitor snapshots in a DC circuit, back: 'Just after the switch closes: an uncharged capacitor acts as a wire. Long after: a charged capacitor acts as a break.', topic: RC circuits}
