# Round 2 glossary for phys-m7 honors lessons.
- term: laminar flow
  aliases: [laminar]
  definition: 'Smooth flow in which a fluid moves in layers that slide past each other without mixing; in a pipe the speed profile is a parabola.'
  topic: Viscosity and drag
- term: turbulent flow
  aliases: [turbulent, turbulence]
  definition: 'Irregular flow full of swirling eddies that mix the fluid; it needs a larger pressure difference than laminar flow for the same flow rate.'
  topic: Viscosity and drag
- term: Reynolds number
  aliases: [Re]
  definition: 'The dimensionless number $\text{Re} = \rho vD/\eta$, comparing a flow''s inertia with its viscous friction; pipe flow is usually laminar below about 2000 and turbulent above about 4000.'
  topic: Viscosity and drag
- term: Poiseuille's law
  aliases: [Poiseuille law]
  definition: 'Flow rate of a viscous fluid in laminar flow through a pipe: $Q = \pi R^4\Delta P/(8\eta L)$.'
  topic: Viscosity and drag
- term: Stokes's law
  aliases: [Stokes' law, Stokes law]
  definition: 'Drag on a small sphere moving slowly through a fluid (Reynolds number below about 1): $F_D = 6\pi\eta rv$.'
  topic: Viscosity and drag
- term: surface tension
  definition: 'The force per unit length (equivalently, energy per unit area) of a liquid''s surface, symbol $\gamma$; about 0.073 N/m for water at 20°C.'
  topic: Surface tension
- term: capillary action
  aliases: [capillarity, capillary rise]
  definition: 'The rise (or fall) of a liquid in a narrow tube caused by surface tension: $h = 2\gamma\cos\theta/(\rho gr)$.'
  topic: Surface tension
- term: meniscus
  aliases: [menisci]
  definition: 'The curved surface of a liquid in a narrow tube: concave for a liquid that wets the wall (water on glass), convex for one that does not (mercury).'
  topic: Surface tension
- term: contact angle
  definition: 'The angle at which a liquid surface meets a solid wall; below 90° the liquid wets the wall and rises in a narrow tube, above 90° it is pushed down.'
  topic: Surface tension
- term: four-stroke engine
  aliases: [four-stroke]
  definition: 'An engine whose pistons repeat intake, compression, power and exhaust strokes.'
  topic: Engine cycles
- term: Otto cycle
  definition: 'The idealized gasoline-engine cycle of two adiabats and two constant-volume steps; its efficiency is $1 - 1/r^{\gamma - 1}$.'
  topic: Engine cycles
- term: compression ratio
  definition: 'The ratio $r = V_{\max}/V_{\min}$ of an engine cylinder''s largest volume to its smallest.'
  topic: Engine cycles
- term: engine knock
  aliases: [knock, knocking]
  definition: 'Uncontrolled self-ignition of the fuel-air mixture in a gasoline engine before the spark, caused by too much compression heating; it limits the compression ratio.'
  topic: Engine cycles
- term: Diesel cycle
  definition: 'The idealized diesel-engine cycle: adiabatic compression of air alone, heat added at roughly constant pressure as fuel is injected and ignites, adiabatic expansion, and heat rejected at constant volume.'
  topic: Engine cycles
- term: vapor-compression cycle
  definition: 'The refrigeration cycle used in most refrigerators and heat pumps: compressor, condenser, expansion valve and evaporator, using the latent heat of the refrigerant.'
  topic: Refrigeration
- term: refrigerant
  aliases: [refrigerants]
  definition: 'The working fluid of a refrigerator or heat pump, chosen to boil at a low temperature so it can absorb heat by evaporating and release it by condensing.'
  topic: Refrigeration
- term: thermal resistance
  aliases: [R-value, R-values]
  definition: 'For a layer, $R = L/k$ (m²·K/W per unit area); resistances of layers that heat crosses one after another add, and $Q/t = A\Delta T/R_{\text{total}}$.'
  topic: Insulation and radiation
- term: emissivity
  definition: 'A number $e$ from 0 to 1 giving how well a surface radiates (and absorbs) thermal radiation compared with a perfect blackbody, as in $P = e\sigma AT^4$.'
  topic: Insulation and radiation
- term: solar constant
  definition: 'The intensity of sunlight at Earth''s average distance from the Sun, on a surface facing the Sun above the atmosphere: about 1361 W/m².'
  topic: Planetary energy balance
- term: albedo
  definition: 'The fraction of incoming sunlight a planet or surface reflects; about 0.30 for Earth as a whole.'
  topic: Planetary energy balance
- term: equilibrium temperature
  definition: 'The temperature at which a planet radiates energy as fast as it absorbs sunlight: $T_e = [(1 - a)S/(4\sigma)]^{1/4}$, about 255 K for Earth.'
  topic: Planetary energy balance
- term: greenhouse gas
  aliases: [greenhouse gases]
  definition: 'A gas, such as water vapor or carbon dioxide, that lets most sunlight through but absorbs and re-emits infrared radiation.'
  topic: Planetary energy balance
- term: greenhouse effect
  definition: 'The warming of a planet''s surface above its equilibrium temperature because the atmosphere absorbs the surface''s infrared radiation and sends part of it back down.'
  topic: Planetary energy balance
