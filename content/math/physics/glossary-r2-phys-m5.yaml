- term: angular impulse
  definition: 'A torque times the time it acts, $\tau\Delta t$; it equals the change in angular momentum it produces, $\Delta L$.'
  topic: Angular impulse
- term: center of percussion
  aliases: [centre of percussion]
  definition: 'The point on a pivoted object where a sharp blow causes no impulsive force at the pivot; for a uniform rod pivoted at one end it is $\tfrac23$ of the way from the pivot. Related to the "sweet spot" of a bat.'
  topic: Angular impulse
- term: precession angular speed
  aliases: [precession rate]
  definition: 'How fast a gyroscope''s spin axis swings around: $\Omega = \tau/L = Mgr/(I\omega)$ for a fast-spinning gyroscope with a horizontal axle.'
  topic: Precession
- term: truss
  aliases: [trusses]
  definition: 'A framework of straight members joined at their ends by pins, loaded at the joints, as in roof frames and bridges; each member is in pure tension or compression.'
  topic: Trusses
- term: two-force member
  aliases: [two-force members]
  definition: 'A light member acted on by forces at only two points; in equilibrium the two forces are equal, opposite and along the line joining those points.'
  topic: Trusses
- term: compression
  definition: 'The state of a member that is being pushed on at both ends, so it pushes outward on what it is attached to; the opposite of tension.'
  topic: Trusses
- term: periapsis
  aliases: [perigee, perihelion]
  definition: 'The point of an orbit closest to the central body (called perigee for Earth orbits and perihelion for orbits around the Sun).'
  topic: Elliptical orbits
- term: apoapsis
  aliases: [apogee, aphelion]
  definition: 'The point of an orbit farthest from the central body (apogee for Earth orbits, aphelion for orbits around the Sun).'
  topic: Elliptical orbits
- term: semimajor axis
  aliases: [semi-major axis]
  definition: 'Half the long axis of an elliptical orbit, $a = \tfrac12(r_p + r_a)$; it sets the orbit''s energy and period.'
  topic: Elliptical orbits
- term: orbital energy
  definition: 'The total mechanical energy of a body in orbit, $E = -GMm/(2a)$; it depends only on the semimajor axis.'
  topic: Elliptical orbits
- term: vis-viva equation
  aliases: [vis-viva]
  definition: 'The speed of an orbiting body at distance $r$: $v^2 = GM(2/r - 1/a)$, from energy conservation.'
  topic: Elliptical orbits
- term: Hohmann transfer
  aliases: [Hohmann transfer orbit]
  definition: 'A two-burn move between two circular orbits in the same plane along half of an ellipse that touches both; usually the most fuel-efficient two-burn transfer.'
  topic: Orbital transfers
- term: transfer orbit
  definition: 'An orbit used to travel from one orbit to another, such as the half ellipse of a Hohmann transfer.'
  topic: Orbital transfers
