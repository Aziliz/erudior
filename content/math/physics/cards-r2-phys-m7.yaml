# Round 2 cards for phys-m7 honors lessons.
- {front: Viscous force between layers, back: '$F = \eta Av/d$: area $A$, relative speed $v$, layer thickness $d$; viscosity $\eta$ in Pa·s', topic: Viscosity and drag}
- {front: 'Viscosity of water, air (about 20°C)', back: 'Water $1.0\times10^{-3}$ Pa·s; air $1.8\times10^{-5}$ Pa·s. Liquids get thinner when warmed; gases get slightly thicker.', topic: Viscosity and drag}
- {front: Poiseuille's law, back: '$Q = \dfrac{\pi R^4\Delta P}{8\eta L}$ (laminar flow only); halving $R$ cuts $Q$ to 1/16', topic: Viscosity and drag}
- {front: Flow resistance of a pipe, back: '$R_{\text{flow}} = \dfrac{8\eta L}{\pi R^4}$, with $\Delta P = QR_{\text{flow}}$; pipes in series add, like resistors', topic: Viscosity and drag}
- {front: Reynolds number, back: '$\text{Re} = \rho vD/\eta$ ($D$ = diameter). Pipe flow: laminar below about 2000, turbulent above about 4000', topic: Viscosity and drag}
- {front: Stokes's law and terminal speed, back: '$F_D = 6\pi\eta rv$ for small, slow spheres; $v_T = \dfrac{2r^2(\rho_s - \rho_f)g}{9\eta}$, so $v_T \propto r^2$', topic: Viscosity and drag}
- {front: Surface tension, back: '$\gamma$ = force per unit length along a surface (N/m) = energy per area (J/m²); water about 0.073 N/m', topic: Surface tension}
- {front: Pressure inside a drop and a bubble, back: 'Drop: $\Delta P = 2\gamma/r$. Soap bubble (two surfaces): $\Delta P = 4\gamma/r$', topic: Surface tension}
- {front: Capillary rise, back: '$h = \dfrac{2\gamma\cos\theta}{\rho gr}$; water on glass rises (concave meniscus), mercury is depressed (convex)', topic: Surface tension}
- {front: Efficiency of any cycle, back: '$e = W_{\text{net}}/Q_{\text{in}}$: divide by the heat taken in (positive $Q$ only), not the net heat', topic: Engine cycles}
- {front: Monatomic gas shortcut, back: '$E_{\text{int}} = \tfrac32nRT = \tfrac32PV$, so $\Delta E_{\text{int}} = \tfrac32\Delta(PV)$; and 1 kPa·L = 1 J', topic: Engine cycles}
- {front: Ideal Otto efficiency, back: '$e = 1 - \dfrac{1}{r^{\gamma - 1}}$ with compression ratio $r = V_{\max}/V_{\min}$; $r = 10$, $\gamma = 1.4$ gives 60%', topic: Engine cycles}
- {front: Temperature after adiabatic compression, back: '$T_2 = T_1r^{\gamma - 1}$ (kelvins); air at 300 K compressed 18:1 reaches about 950 K', topic: Engine cycles}
- {front: Four strokes of a gasoline engine, back: 'Intake, compression, power, exhaust', topic: Engine cycles}
- {front: Otto vs diesel, back: 'Gasoline: spark ignition, $r$ about 9–14, limited by knock. Diesel: compresses air alone, compression ignition, $r$ about 15–22, more efficient overall', topic: Engine cycles}
- {front: Why real cycles fall short of Carnot, back: 'Heat enters and leaves across large temperature differences (creating entropy), plus friction and heat leaks; a rectangular PV cycle reaches far less than Carnot between its extreme temperatures', topic: Engine cycles}
- {front: Engine knock, back: 'Self-ignition of a gasoline engine''s fuel-air mixture before the spark, from too much compression heating; it limits the compression ratio', topic: Engine cycles}
- {front: Vapor-compression refrigerator, back: 'Compressor (work in) → condenser (releases $Q_H$) → expansion valve (pressure drops) → evaporator (absorbs $Q_C$); $Q_H = Q_C + W$', topic: Refrigeration}
- {front: Thermal resistance, back: '$R = L/k$ per unit area (m²·K/W); layers in series add: $Q/t = A\Delta T/R_{\text{total}}$', topic: Insulation and radiation}
- {front: US R-value conversion, back: '1 ft²·°F·h/Btu = 0.176 m²·K/W (R-13 is about 2.3 m²·K/W)', topic: Insulation and radiation}
- {front: Net radiated power, back: '$P_{\text{net}} = e\sigma A(T^4 - T_s^4)$, kelvins; not $(T - T_s)^4$', topic: Insulation and radiation}
- {front: Solar constant, back: '$S = L_{\text{Sun}}/(4\pi d^2) \approx 1361$ W/m² at Earth; falls as $1/d^2$', topic: Planetary energy balance}
- {front: Equilibrium temperature of a planet, back: '$T_e = \left[\dfrac{(1 - a)S}{4\sigma}\right]^{1/4}$; Earth: 255 K with albedo 0.30', topic: Planetary energy balance}
- {front: Why the 4 in the planet formula, back: 'Sunlight is absorbed over the disk $\pi R^2$ but infrared leaves the whole sphere $4\pi R^2$', topic: Planetary energy balance}
- {front: Greenhouse effect, back: 'Atmosphere passes visible sunlight but absorbs surface infrared and sends some back down; Earth''s surface (288 K) is 33 K above $T_e$', topic: Planetary energy balance}
- {front: One-layer greenhouse model, back: '$T_s = 2^{1/4}T_e \approx 303$ K for Earth: a simplified teaching model that overestimates the real 288 K', topic: Planetary energy balance}
