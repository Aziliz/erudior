# Round 2 glossary for phys-m9 (honors lessons 37h1, 37h2)
- term: linear circuit
  aliases: [linear circuits]
  definition: 'A circuit made only of ideal sources and ohmic resistors, so that currents and voltages are proportional to the emfs. Thévenin''s theorem and superposition apply to linear circuits.'
  topic: Equivalent circuits
- term: voltage divider
  aliases: [voltage dividers, divider]
  definition: 'Two resistors in series across a source; the voltage across $R_2$ is $\mathcal{E}R_2/(R_1 + R_2)$ when nothing else is connected to it.'
  topic: Equivalent circuits
- term: Wheatstone bridge
  aliases: [bridge circuit]
  definition: 'Two voltage dividers across the same battery with a galvanometer between their midpoints. When the galvanometer reads zero, $R_1/R_2 = R_3/R_x$, which gives an unknown resistance from three known ones.'
  topic: Bridge circuits
- term: galvanometer
  aliases: [galvanometers]
  definition: 'A very sensitive current meter. In a bridge it is used as a null detector, showing when no current flows.'
  topic: Bridge circuits
- term: Thévenin's theorem
  aliases: [Thevenin's theorem, Thévenin equivalent, Thevenin equivalent]
  definition: 'Any linear network of sources and resistors, seen from two terminals, acts like a single emf $V_{\text{th}}$ (the open-circuit voltage) in series with a single resistance $R_{\text{th}}$.'
  topic: Equivalent circuits
- term: open-circuit voltage
  aliases: [open circuit voltage]
  definition: 'The voltage between two terminals of a network when nothing is connected to them; equal to the Thévenin voltage.'
  topic: Equivalent circuits
- term: short-circuit current
  aliases: [short circuit current]
  definition: 'The current that would flow through a wire connected directly across two terminals; the Thévenin resistance is $V_{\text{oc}}/I_{\text{sc}}$.'
  topic: Equivalent circuits
- term: loading effect
  aliases: [loading, meter loading]
  definition: 'The change a meter causes in the quantity it measures: a voltmeter with finite resistance $R_V$ reads $V_{\text{th}}R_V/(R_V + R_{\text{th}})$, and an ammeter adds its resistance to the branch.'
  topic: Equivalent circuits
- term: superposition theorem
  aliases: [superposition method]
  definition: 'In a linear circuit, each current or voltage is the sum of those produced by each source acting alone, with the other ideal sources replaced by wires. It does not apply to power.'
  topic: Equivalent circuits
- term: conductivity
  aliases: [electrical conductivity, σ]
  definition: 'The reciprocal of resistivity, $\sigma = 1/\rho$, in $(\Omega\cdot\text{m})^{-1}$ (siemens per meter). Ohm''s law at a point is $J = \sigma E$.'
  topic: Conduction models
- term: Drude model
  aliases: [free-electron model]
  definition: 'A model of a metal as a lattice of ions with free electrons that accelerate in the field and collide every mean free time $\tau$ on average; it gives $v_d = eE\tau/m$ and $\rho = m/(ne^2\tau)$. A simplified, classical picture.'
  topic: Conduction models
- term: mean free time
  aliases: [collision time]
  definition: 'The average time between an electron''s collisions in a conductor, about $2.5\times10^{-14}$ s in copper at room temperature.'
  topic: Conduction models
- term: mean free path
  definition: 'The average distance an electron travels between collisions; about 40 nm in copper at room temperature.'
  topic: Conduction models
- term: mobility
  aliases: [electron mobility]
  definition: 'Drift speed per unit electric field, $\mu = v_d/E$, in m²/(V·s); in the Drude model $\mu = e\tau/m$.'
  topic: Conduction models
- term: temperature coefficient of resistivity
  aliases: [temperature coefficient]
  definition: 'The fractional change in resistivity per degree, $\alpha$, in $\rho = \rho_0[1 + \alpha(T - T_0)]$; about $3.9\times10^{-3}$ per °C for copper. Negative for semiconductors.'
  topic: Conduction models
- term: critical temperature
  definition: 'The temperature below which a material becomes a superconductor, with exactly zero resistivity.'
  topic: Conduction models
- term: semiconductor
  aliases: [semiconductors]
  definition: 'A material such as silicon with far fewer free charge carriers than a metal, whose resistivity falls as temperature rises and can be changed enormously by doping.'
  topic: Semiconductors
- term: hole
  aliases: [holes]
  definition: 'In a semiconductor, a missing electron in a bond. Neighboring electrons can fill it, so the hole moves and acts like a positive charge carrier.'
  topic: Semiconductors
- term: thermistor
  aliases: [thermistors]
  definition: 'A resistor, usually a semiconductor, whose resistance changes strongly with temperature; used as a temperature sensor.'
  topic: Semiconductors
- term: doping
  aliases: [doped]
  definition: 'Adding a small, controlled amount of another element to a semiconductor to increase its free electrons (n-type) or holes (p-type).'
  topic: Semiconductors
- term: n-type
  aliases: [n-type semiconductor]
  definition: 'A semiconductor doped with atoms that have one more outer electron than the host (such as phosphorus in silicon), so its main carriers are free electrons.'
  topic: Semiconductors
- term: p-type
  aliases: [p-type semiconductor]
  definition: 'A semiconductor doped with atoms that have one fewer outer electron than the host (such as boron in silicon), so its main carriers are holes.'
  topic: Semiconductors
- term: p–n junction
  aliases: [p-n junction, pn junction]
  definition: 'The boundary between p-type and n-type regions of a semiconductor. It conducts readily in one direction only, which makes it a diode.'
  topic: Semiconductors
- term: diode
  aliases: [diodes]
  definition: 'A two-terminal device that lets current flow readily in one direction only; a silicon diode conducts forward above about 0.6–0.7 V.'
  topic: Semiconductors
- term: light-emitting diode
  aliases: [LED, LEDs, light-emitting diodes]
  definition: 'A diode in which electrons and holes meeting at the junction give off their energy as light. Its forward voltage, in volts, is roughly the photon energy in electron volts.'
  topic: Semiconductors
