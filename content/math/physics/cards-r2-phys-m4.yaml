# Round 2 cards for phys-m4 (honors lessons)
- {front: 'Rocket thrust', back: '$T = uR$: exhaust speed (relative to the rocket) times mass flow rate.', topic: Rockets and variable mass}
- {front: 'Liftoff condition and acceleration', back: 'Thrust must exceed weight, $T > mg$; then $a = T/m - g$, which grows as propellant is burned.', topic: Rockets and variable mass}
- {front: 'Rocket equation', back: '$\Delta v = u\ln(m_0/m_f)$ in free space; from adding $u\,\Delta m/m$ over many small steps.', topic: Rockets and variable mass}
- {front: 'Mass ratio for a given delta-v', back: '$m_0/m_f = e^{\Delta v/u}$: each extra $u$ of delta-v multiplies the needed ratio by $e \approx 2.72$.', topic: Rockets and variable mass}
- {front: 'What does a rocket''s delta-v depend on (free space)?', back: 'Only the exhaust speed and the mass ratio, not the thrust or how fast the propellant is burned.', topic: Rockets and variable mass}
- {front: 'Can a rocket go faster than its exhaust speed?', back: 'Yes: when $m_0/m_f > e$, $\Delta v > u$. The exhaust speed is measured relative to the rocket.', topic: Rockets and variable mass}
- {front: 'Why stage a rocket?', back: 'Dropping empty tanks and engines means later burns push less dead mass, so the same propellant gives more delta-v.', topic: Rockets and variable mass}
- {front: 'Sand onto a conveyor belt at rate R, speed v', back: 'Force $Rv$, power $Rv^2$; the sand gains only $\tfrac12Rv^2$ of kinetic energy per second, and the other half becomes heat.', topic: Rockets and variable mass}
- {front: 'Rain falling into a coasting cart', back: 'Horizontal momentum is conserved: $m_0v_0 = (m_0 + \Delta m)v$, so the cart slows down.', topic: Rockets and variable mass}
- {front: 'Sand leaking straight down out of a moving cart', back: 'The cart''s speed does not change: the sand leaves with the cart''s own velocity.', topic: Rockets and variable mass}
- {front: 'Restitution condition (1D)', back: '$v_{2f} - v_{1f} = e(v_{1i} - v_{2i})$; solve it together with momentum conservation.', topic: Restitution and gravity assists}
- {front: 'Kinetic energy lost in a collision with restitution e', back: '$K_{\text{lost}} = (1 - e^2)K_{\text{rel}}$, with $K_{\text{rel}} = \tfrac12\mu(v_{1i} - v_{2i})^2$.', topic: Restitution and gravity assists}
- {front: 'Reduced mass', back: '$\mu = \dfrac{m_1m_2}{m_1 + m_2}$', topic: Restitution and gravity assists}
- {front: 'Collision in the center-of-mass frame', back: 'Total momentum zero; each velocity reverses and is multiplied by $e$; every kinetic energy is multiplied by $e^2$.', topic: Restitution and gravity assists}
- {front: 'Measuring e with a bouncing ball', back: '$e = \sqrt{h_{\text{after}}/h_{\text{before}}}$; each bounce reaches $e^2$ times the previous height.', topic: Restitution and gravity assists}
- {front: 'Total distance of a bouncing ball', back: '$D = h_0\dfrac{1 + e^2}{1 - e^2}$; total time $t_0\dfrac{1 + e}{1 - e}$ with $t_0 = \sqrt{2h_0/g}$.', topic: Restitution and gravity assists}
- {front: 'Light ball off a heavy wall moving toward it at V', back: '$v_{\text{out}} = e(v + V) + V$; elastic: $v + 2V$.', topic: Restitution and gravity assists}
- {front: 'Gravity assist', back: 'Elastic in the planet''s frame (same speed in and out); in the Sun''s frame up to $2U$ is gained (head-on limit), paid for by the planet''s kinetic energy.', topic: Restitution and gravity assists}
- {front: 'Does e = 0.5 mean half the kinetic energy is lost?', back: 'No. Speeds in the CM frame are halved, so energies there drop to a quarter: 75% of $K_{\text{rel}}$ is lost.', topic: Restitution and gravity assists}
