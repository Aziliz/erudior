# Round 2, module phys-m2: cards for the honors lessons (chases and stopping; aiming; Galileo and measuring g).
- {front: 'Setting up a chase or meeting problem', back: 'One origin, one positive direction, one clock for both objects; they meet where $x_A(t) = x_B(t)$. Check each root against the assumptions.', topic: Chase problems}
- {front: 'Chaser from rest (constant $a$) catching a constant-speed object that is beside it at the start', back: 'It catches up when its speed is twice the other''s: equal distances in equal times mean equal average velocities.', topic: Chase problems}
- {front: 'When is the gap in a chase largest?', back: 'When the two speeds are equal (where the lines cross on a $v$–$t$ graph).', topic: Chase problems}
- {front: 'Relative-frame shortcut for a chase', back: 'Ride with the constant-velocity object: the other moves at the difference of the velocities, with the same acceleration.', topic: Chase problems}
- {front: 'Chase with a top speed', back: 'Solve the one-phase model; if the speed at the catch exceeds the top speed, split at the moment top speed is reached and close the remaining gap at the speed difference.', topic: Chase problems}
- {front: 'Stopping distance', back: '$d = vt_r + \dfrac{v^2}{2a}$: reaction distance grows with $v$, braking distance with $v^2$.', topic: Stopping distance}
- {front: 'Minimum braking to avoid a slower vehicle ahead (gap $D$, reaction $t_r$)', back: '$a = \dfrac{(\Delta v)^2}{2(D - \Delta v\,t_r)}$, with $\Delta v$ the closing speed.', topic: Stopping distance}
- {front: 'Dilemma zone', back: 'Where a driver can neither stop (the distance to the line is less than $vt_r + v^2/(2a)$) nor clear the intersection before red; gone if $vt_y - W \ge vt_r + v^2/(2a)$.', topic: Stopping distance}
- {front: 'Angle to hit a target $(x, y)$ at speed $v_0$', back: '$A\tan^2\theta - x\tan\theta + (y + A) = 0$, with $A = \dfrac{gx^2}{2v_0^2}$; discriminant positive: two angles, zero: one, negative: none.', topic: Aiming projectiles}
- {front: 'Safety parabola', back: '$y = \dfrac{v_0^2}{2g} - \dfrac{gx^2}{2v_0^2}$: the edge of what speed $v_0$ can reach.', topic: Aiming projectiles}
- {front: 'Farthest throw from height $h$', back: '$x = \dfrac{v_0}{g}\sqrt{v_0^2 + 2gh}$ at $\tan\theta = \dfrac{v_0}{\sqrt{v_0^2 + 2gh}}$ (below 45°).', topic: Aiming projectiles}
- {front: 'Best launch up a slope of angle $\alpha$', back: '$\theta = 45^\circ + \alpha/2$ from the horizontal; $d_{\max} = \dfrac{v_0^2}{g(1 + \sin\alpha)}$ along the slope.', topic: Aiming projectiles}
- {front: 'Aiming straight at a target released at the instant of firing', back: 'It hits (if it arrives before the target lands): both fall $\tfrac12gt^2$ below their gravity-free paths.', topic: Aiming projectiles}
- {front: 'Odd-number rule', back: 'From rest at constant $a$, successive equal intervals cover $1 : 3 : 5 : 7$, because $d_n = \tfrac12a\tau^2(2n - 1)$.', topic: Free-fall experiments}
- {front: 'Why Galileo used inclined planes', back: 'A gentle ramp lowers the acceleration but keeps it constant, so motion slow enough to time with a water clock follows the same law as free fall.', topic: Free-fall experiments}
- {front: 'Measuring $g$ from drop data', back: 'Plot $h$ against $t^2$: a straight line through the origin with slope $g/2$.', topic: Free-fall experiments}
- {front: 'Ruler-drop reaction time', back: '$t = \sqrt{2d/g}$; 18 cm gives about 0.19 s.', topic: Free-fall experiments}
- {front: 'How much does $g$ vary?', back: 'About 9.78 m/s² at the equator to 9.83 m/s² at the poles; standard gravity is defined as 9.80665 m/s².', topic: Free-fall experiments}
- {front: 'Evidence that heavy and light bodies fall together', back: 'Galileo''s tied-stones argument; Stevin and de Groot''s lead balls (Delft, 1586); the Apollo 15 hammer and feather (1971).', topic: Free-fall experiments}
- {front: 'Leaning Tower of Pisa drop', back: 'Reported by Viviani long afterward; historians doubt it happened as told.', topic: Free-fall experiments}
- {front: 'Rewriting the path in $\tan\theta$', back: 'Use $\dfrac{1}{\cos^2\theta} = 1 + \tan^2\theta$ in $y = x\tan\theta - \dfrac{gx^2}{2v_0^2\cos^2\theta}$ to get a quadratic in $\tan\theta$.', topic: Aiming projectiles}
- {front: 'Low shot vs lob to the same target', back: 'The lob (higher angle) has the smaller horizontal speed, so it stays up longer and lands more steeply.', topic: Aiming projectiles}
- {front: 'When do the two hitting angles add to 90°?', back: 'Only when the target is at launch height (level ground): $\sin 2\theta$ takes equal values at $\theta$ and $90^\circ - \theta$.', topic: Aiming projectiles}
- {front: 'Range up a slope at launch angle $\theta$ (slope $\alpha$)', back: '$x = \dfrac{2v_0^2\cos^2\theta(\tan\theta - \tan\alpha)}{g}$ horizontally; $d = x/\cos\alpha$ along the slope.', topic: Aiming projectiles}
- {front: 'Highest point reachable straight above the launcher', back: '$v_0^2/(2g)$, the top of the safety parabola (a straight-up throw).', topic: Aiming projectiles}
- {front: 'Galileo''s tied-stones argument', back: 'If heavier fell faster, a light stone tied to a heavy one would both slow it and (as a heavier pair) speed it up: a contradiction.', topic: Free-fall experiments}
- {front: 'Acceleration of a ball rolling down a ramp', back: 'Constant but less than $g\sin\theta$ (solid ball: $\tfrac57g\sin\theta$), so distance still grows as $t^2$.', topic: Free-fall experiments}
