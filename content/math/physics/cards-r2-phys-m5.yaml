- {front: Static friction on an object rolling down a slope, back: 'Points up the slope; $f = \dfrac{c}{1 + c}Mg\sin\theta$ with $I_{\text{cm}} = cMR^2$', topic: Rolling dynamics}
- {front: Condition to roll without slipping down a slope, back: '$\mu_s \ge \dfrac{c}{1 + c}\tan\theta$', topic: Rolling dynamics}
- {front: Sliding ball with no spin on a level floor, back: 'Kinetic friction slows $v$ and raises $R\omega$ until $v = R\omega$; final speed $v_0/(1 + c)$ ($\tfrac57v_0$ for a solid sphere)', topic: Rolling dynamics}
- {front: Why angular momentum about a point on the floor is conserved for a skidding ball, back: 'Friction acts along the floor (zero torque about it); gravity and the normal force cancel', topic: Rolling dynamics}
- {front: Energy lost while a solid sphere skids into rolling, back: '$\tfrac{c}{1 + c} = \tfrac27$ of its initial kinetic energy', topic: Rolling dynamics}
- {front: Angular impulse, back: '$\tau\Delta t = \Delta L$', topic: Angular impulse}
- {front: Center of percussion of a uniform rod pivoted at one end, back: '$\tfrac23L$ from the pivot: a blow there gives no impulse at the pivot', topic: Angular impulse}
- {front: Angular momentum of a rolling body about a point on the ground, back: '$L = Mv_{\text{cm}}R + I_{\text{cm}}\omega$', topic: Angular impulse}
- {front: Gyroscope precession rate, back: '$\Omega = \dfrac{\tau}{L} = \dfrac{Mgr}{I\omega}$ (fast spin); faster spin means slower precession', topic: Precession}
- {front: Two-force member, back: 'Force along the member: pure tension or compression', topic: Trusses}
- {front: Method of joints, back: 'Supports first; then $\sum F_x = 0$, $\sum F_y = 0$ at a joint with at most 2 unknowns; assume tension, negative means compression', topic: Trusses}
- {front: A-frame rafter force (load P at peak), back: '$F = \dfrac{P}{2\sin\theta}$ compression; tie tension $F\cos\theta$', topic: Trusses}
- {front: Chords of a bridge truss loaded in the middle, back: 'Top chord in compression, bottom chord in tension', topic: Trusses}
- {front: Ladder against a smooth wall, back: 'Stands if $\tan\theta \ge \dfrac{1}{2\mu_s}$; wall force $N_w = \dfrac{W}{2\tan\theta}$', topic: Friction in equilibrium}
- {front: Box on a tilting ramp, back: 'Tips first if $w/h < \mu_s$ (tips at $\tan\theta = w/h$); slides first if $\mu_s < w/h$', topic: Friction in equilibrium}
- {front: Box pushed horizontally at height H, back: 'Slides at $\mu_smg$, tips at $\dfrac{mgw}{2H}$; tips first above $H = \dfrac{w}{2\mu_s}$', topic: Friction in equilibrium}
- {front: Semimajor axis from periapsis and apoapsis, back: '$a = \tfrac12(r_p + r_a)$ (distances from the center of the central body)', topic: Elliptical orbits}
- {front: Speeds at periapsis and apoapsis, back: '$r_pv_p = r_av_a$ (angular momentum)', topic: Elliptical orbits}
- {front: Orbital energy, back: '$E = -\dfrac{GMm}{2a}$, set by the semimajor axis alone', topic: Elliptical orbits}
- {front: Vis-viva equation, back: '$v^2 = GM\left(\dfrac2r - \dfrac1a\right)$', topic: Elliptical orbits}
- {front: Hohmann transfer, back: 'Burn forward onto an ellipse with $a_t = \tfrac12(r_1 + r_2)$, coast half of it, burn forward again; trip time $\pi\sqrt{a_t^3/GM}$', topic: Orbital transfers}
- {front: Speed after moving to a higher circular orbit, back: 'Lower than before ($v = \sqrt{GM/r}$), though both burns sped the craft up', topic: Orbital transfers}
- {front: Mass from an orbit, back: '$M = \dfrac{4\pi^2a^3}{GT^2}$ (mass of the central body)', topic: Mass from orbits}
- {front: Binary star mass, back: '$M_1 + M_2 = a^3/T^2$ with $a$ in AU, $T$ in years, masses in solar masses', topic: Mass from orbits}
- {front: Climber on a ladder, back: 'The higher she climbs, the more floor friction is needed (her weight''s lever arm about the foot grows); the top rungs are the risky ones', topic: Friction in equilibrium}
