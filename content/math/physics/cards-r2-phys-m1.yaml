# Round 2, module phys-m1: cards for the honors lessons (uncertainty; vector algebra).
- {front: 'Absolute vs fractional uncertainty', back: 'Absolute: the ± value in the measurement''s unit (0.2 g). Fractional: absolute ÷ value, no unit (0.2/52.4 = 0.38%).', topic: Measurement uncertainty}
- {front: 'Rounding a reported result', back: 'Round the uncertainty to 1 significant figure (2 if it starts with 1), then round the value to the same decimal place: $9.80 \pm 0.06$.', topic: Measurement uncertainty}
- {front: 'Random vs systematic error', back: 'Random: scatter in both directions; averaging reduces it. Systematic: every reading shifted the same way; averaging does nothing, so check instruments and use another method.', topic: Measurement uncertainty}
- {front: 'Standard error of the mean', back: '$s_{\bar x} = s/\sqrt n$, where $s$ is the sample standard deviation (divide by $n - 1$). Four times the readings halve it.', topic: Measurement uncertainty}
- {front: 'Uncertainty of a sum or difference', back: 'Combine absolute uncertainties: $\delta q = \sqrt{(\delta x)^2 + (\delta y)^2}$ for independent random errors (never subtract them).', topic: Error propagation}
- {front: 'Uncertainty of a product or quotient', back: 'Combine fractional uncertainties: $\dfrac{\delta q}{|q|} = \sqrt{\left(\dfrac{\delta x}{x}\right)^2 + \left(\dfrac{\delta y}{y}\right)^2}$.', topic: Error propagation}
- {front: 'Uncertainty of a power $q = x^n$', back: '$\dfrac{\delta q}{|q|} = |n|\dfrac{\delta x}{|x|}$: squaring doubles the fractional uncertainty (add directly, not in quadrature).', topic: Error propagation}
- {front: 'Quadrature vs direct addition', back: 'Quadrature ($\sqrt{a^2 + b^2}$) for independent random errors; direct addition ($a + b$) gives a worst-case upper bound.', topic: Error propagation}
- {front: 'Do two results agree?', back: 'Rule of thumb: yes if their difference is less than about $\sqrt{\delta_1^2 + \delta_2^2}$; more than 2–3 times that is a real discrepancy.', topic: Measurement uncertainty}
- {front: 'Percent error', back: '$\dfrac{|\text{measured} - \text{accepted}|}{\text{accepted}} \times 100\%$ (divide by the accepted value).', topic: Measurement uncertainty}
- {front: 'Unit vector along $\vec A$', back: '$\hat A = \vec A/A$; its components are the direction cosines, and $\cos^2\alpha + \cos^2\beta + \cos^2\gamma = 1$.', topic: Vector algebra}
- {front: 'Scalar and vector projection of $\vec B$ onto $\vec A$', back: 'Scalar: $\vec A\cdot\vec B/A$. Vector: $(\vec A\cdot\vec B/A^2)\,\vec A$. The rest of $\vec B$ is perpendicular to $\vec A$.', topic: Vector algebra}
- {front: 'Cross product in components', back: '$\vec A\times\vec B = (A_yB_z - A_zB_y)\hat\imath + (A_zB_x - A_xB_z)\hat\jmath + (A_xB_y - A_yB_x)\hat k$. Check: perpendicular to both.', topic: Vector products}
- {front: 'Unit-vector cross products', back: 'Forward around $\hat\imath \to \hat\jmath \to \hat k \to \hat\imath$: $\hat\imath\times\hat\jmath = \hat k$, $\hat\jmath\times\hat k = \hat\imath$, $\hat k\times\hat\imath = \hat\jmath$. Backward gives a minus sign; any vector crossed with itself is 0.', topic: Vector products}
- {front: 'Geometric meaning of $|\vec A\times\vec B|$', back: 'The area of the parallelogram on $\vec A$ and $\vec B$ ($AB\sin\phi$); the triangle is half of it.', topic: Vector products}
- {front: 'Scalar triple product', back: '$|\vec A\cdot(\vec B\times\vec C)|$ = volume of the box on $\vec A$, $\vec B$, $\vec C$; zero means the three are coplanar. Cycling the order keeps its value; swapping two flips its sign.', topic: Vector products}
- {front: 'Components in rotated axes (rotated by α counterclockwise)', back: '$A_{x''} = A_x\cos\alpha + A_y\sin\alpha$, $A_{y''} = -A_x\sin\alpha + A_y\cos\alpha$. Magnitudes and dot products don''t change.', topic: Vector algebra}
