id: science-physics
title: Physics
description: >-
  Physics from the high school / AP Physics 1–2 level through calculus-based
  University Physics I–II. Each topic is taught first with algebra and then with
  calculus: measurement and vectors, kinematics, Newton's laws, energy and momentum,
  rotation and gravitation, oscillations, waves and sound, fluids and thermodynamics,
  electrostatics, circuits, magnetism and induction, optics, and modern physics.
revision: 1
order: 13
