# Round 2, honors module phys-h1 (Frontiers of physics): cards for lessons 90-93.
# Lesson 90
- {front: Equivalence principle, back: 'In a small enough region, gravity can''t be told apart from acceleration. It rests on inertial mass = gravitational mass (tested to about 1 part in $10^{15}$).', topic: General relativity}
- {front: Two consequences of the equivalence principle, back: 'Light bends in a gravitational field, and clocks lower in a gravitational field run slow.', topic: General relativity}
- {front: Gravitational time dilation near Earth, back: 'A clock higher by $h$ runs fast by the fraction $gh/c^2$ (about $1.1\times10^{-16}$ per meter). For large distances: $GM(1/r_{\text{low}} - 1/r_{\text{high}})/c^2$.', topic: General relativity}
- {front: GPS clock corrections, back: 'Gravity: satellite clock gains about 45.7 μs/day. Speed: loses about 7.2 μs/day. Net: about +38 μs/day, which would be kilometers of position error per day.', topic: General relativity}
- {front: General relativity in one sentence, back: 'Mass and energy curve spacetime, and free objects (and light) follow the straightest paths through it. Tested by light bending (1.75″ at the Sun), Mercury''s 43″ per century, clock rates and more.', topic: General relativity}
- {front: Schwarzschild radius, back: '$r_s = \dfrac{2GM}{c^2}$: about 2.95 km per solar mass (Earth: 9 mm).', topic: Black holes and gravitational waves}
- {front: Event horizon, back: 'The boundary of a black hole; inside it, nothing, not even light, can get out. Far away, a black hole''s gravity is the same as any object of equal mass.', topic: Black holes and gravitational waves}
- {front: Gravitational-wave strain, back: '$h = \Delta L/L$, about $10^{-21}$ for detected events; a 4 km LIGO arm changes by about $4\times10^{-18}$ m.', topic: Black holes and gravitational waves}
- {front: First gravitational-wave detection, back: '14 September 2015, LIGO: black holes of about 36 and 29 solar masses merged into about 62; about 3 solar masses ($5\times10^{47}$ J) left as gravitational waves.', topic: Black holes and gravitational waves}
- {front: How LIGO works, back: 'A laser, a beam splitter, two 4 km arms with end mirrors, and a photodetector. A wave stretches one arm and squeezes the other, changing how the returning beams interfere.', topic: Black holes and gravitational waves}
# Lesson 91
- {front: Quark charges, back: 'Up, charm, top: $+\tfrac23e$. Down, strange, bottom: $-\tfrac13e$. Antiquarks have the opposite signs.', topic: Particle physics}
- {front: Proton and neutron in quarks, back: 'Proton = uud (charge +1); neutron = udd (charge 0).', topic: Particle physics}
- {front: Baryons vs mesons, back: 'Both are hadrons. Baryons: three quarks (proton, neutron), baryon number +1. Mesons: quark + antiquark (pions), baryon number 0.', topic: Particle physics}
- {front: Leptons, back: 'Electron, muon, tau and their three neutrinos. They don''t feel the strong force.', topic: Particle physics}
- {front: Force carriers, back: 'Strong: gluons. Electromagnetic: photon. Weak: W and Z bosons. Gravity: not in the Standard Model (graviton hypothetical).', topic: Particle physics}
- {front: Range of a force from its carrier's mass, back: '$R \approx \dfrac{\hbar c}{mc^2}$, with $\hbar c = 197$ MeV·fm. W boson (80.4 GeV): about $2.5\times10^{-18}$ m. Massless carrier: unlimited range.', topic: Particle physics}
- {front: Higgs boson, back: 'Particle of the Higgs field, which gives the W, Z, quarks and charged leptons mass. Found at the LHC in 2012, about 125 GeV.', topic: Particle physics}
- {front: Where the proton's mass comes from, back: 'Mostly strong-interaction energy ($E = mc^2$). Its three quarks add up to only about 9 MeV of its 938 MeV.', topic: Particle physics}
- {front: Making a particle–antiparticle pair in a collider, back: 'Head-on with equal speeds, all the kinetic energy is available: each beam particle needs at least $mc^2$ to make a pair of mass $m$. A fixed target needs much more.', topic: Particle physics}
- {front: Momentum in a magnetic ring, back: '$p = qBr$, true at any speed with $p = \gamma mv$. For charge $e$: $p$ (GeV/$c$) $= 0.300\,B$ (T) $r$ (m).', topic: Particle physics}
- {front: Checking a particle reaction, back: 'Conserve charge, baryon number, lepton number, energy and momentum. A decay at rest also needs more rest energy before than after.', topic: Conservation laws in particle reactions}
- {front: Baryon number and lepton number, back: 'Baryon number: $+\tfrac13$ per quark (+1 per baryon). Lepton number: +1 per lepton, −1 per antilepton. Proton decay ($p \to e^+ + \gamma$) would break baryon number and has never been seen.', topic: Conservation laws in particle reactions}
# Lesson 92
- {front: Parallax distance, back: '$d$ (pc) $= 1/p$ (arcsec). 1 pc = $3.086\times10^{16}$ m = 3.26 light-years.', topic: Cosmology}
- {front: Standard candles, back: 'Objects of known luminosity (Cepheids, type Ia supernovae). Measured intensity $I = L/(4\pi d^2)$ gives the distance.', topic: Cosmology}
- {front: Redshift, back: '$z = \dfrac{\lambda_{\text{obs}} - \lambda_{\text{emit}}}{\lambda_{\text{emit}}}$; for $z \ll 1$, $v \approx cz$.', topic: Cosmology}
- {front: Hubble's law, back: '$v = H_0d$ with $H_0 \approx 70$ km/s/Mpc (about 67 or 73 depending on method: the Hubble tension).', topic: Cosmology}
- {front: Hubble time, back: '$1/H_0 \approx 14$ billion years for $H_0 = 70$ km/s/Mpc. The measured age of the universe is 13.8 billion years.', topic: Cosmology}
- {front: Evidence for the Big Bang, back: 'Expansion (Hubble''s law), the 2.725 K cosmic microwave background, and the light elements (about 25% helium by mass).', topic: Cosmology}
- {front: Cosmic microwave background, back: 'Released about 380 000 years after the start, at about 3000 K; stretched about 1100 times to a 2.725 K blackbody peaking near 1 mm.', topic: Cosmology}
- {front: Galaxy mass from a rotation speed, back: '$M(r) = \dfrac{v^2r}{G}$. Flat rotation curves mean $M(r)$ keeps growing with $r$: dark matter.', topic: Dark matter and dark energy}
- {front: Critical density, back: '$\rho_c = \dfrac{3H^2}{8\pi G} \approx 9\times10^{-27}$ kg/m³ today, about five or six hydrogen atoms per cubic meter.', topic: Dark matter and dark energy}
- {front: Makeup of the universe, back: 'About 5% ordinary matter, 27% dark matter, 68% dark energy (Planck, 2018).', topic: Dark matter and dark energy}
# Lesson 93
- {front: One-layer model with partial absorption, back: '$T_s = T_e\left(\dfrac{2}{2 - \varepsilon}\right)^{1/4}$; the layer is at $T_a = T_s/2^{1/4}$. $\varepsilon \approx 0.78$ gives Earth''s 288 K.', topic: Greenhouse models}
- {front: Emission height and lapse rate, back: 'Earth radiates to space from about 5 km up, where it is near $T_e = 255$ K; temperature falls about 6.5 K/km, so the surface is about 288 K.', topic: Greenhouse models}
- {front: Why more CO₂ warms even with a saturated band, back: 'It raises the emission height to colder air, so the planet radiates less until it warms; the band''s edges also absorb more.', topic: Greenhouse models}
- {front: CO₂ radiative forcing, back: '$\Delta F \approx 5.35\ln(C/C_0)$ W/m²: 3.7 W/m² per doubling; about 2.2 W/m² from 280 to 420 ppm.', topic: Climate forcing and feedbacks}
- {front: No-feedback warming, back: '$\Delta T_0 \approx \Delta F/(4\sigma T_e^3) = \Delta F/(3.7$ W/(m²·K)$)$: about 1 to 1.2 K per CO₂ doubling.', topic: Climate forcing and feedbacks}
- {front: Feedback factor, back: '$\Delta T = \dfrac{\Delta T_0}{1 - f}$ for $0 \le f < 1$. $f \approx 0.6$ gives about 3 K per doubling; small changes in $f$ near 1 give large changes in $\Delta T$.', topic: Climate forcing and feedbacks}
- {front: Main climate feedbacks, back: 'Water vapor and ice–albedo amplify; clouds are the largest uncertainty (probably slightly amplifying); lapse-rate changes and the extra infrared from a warmer planet reduce warming.', topic: Climate forcing and feedbacks}
- {front: Climate sensitivity, back: 'Eventual warming per CO₂ doubling: best estimate about 3 °C, likely 2.5 to 4 °C (IPCC, 2021). Arrhenius (1896) estimated 5 to 6 °C; Manabe and Wetherald (1967) about 2.3 °C.', topic: Climate forcing and feedbacks}
