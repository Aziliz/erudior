# Round 2, module phys-m4: new question types for the core lessons (q) and the honors lessons (h).
- id: phys-m4-r2-q01
  lesson: phys-work
  type: label
  topic: Work and kinetic energy
  stem: 'A sled is pulled across level snow by a rope at an angle. Name each numbered arrow.'
  image: {src: images/m4-sled-forces-blank.svg, alt: 'A sled on level snow with five numbered arrows: one along a rope pointing up and to the right at 25 degrees, one pointing left along the ground at the sled, one pointing straight up from the sled, one pointing straight down from the sled, and one pointing right along the ground away from the sled.'}
  labels:
    - {x: 69.3, y: 47.3, text: Tension}
    - {x: 25.8, y: 66.1, text: Kinetic friction}
    - {x: 46.8, y: 33.3, text: Normal force}
    - {x: 46.8, y: 83.3, text: Weight}
    - {x: 78.7, y: 84.7, text: Displacement}
  distractors: [Static friction, Net work]
  explanation: |-
    The rope pulls along its own direction (tension, 1). Kinetic friction opposes the sliding, so it points backward (2). The snow pushes up on the sled (normal force, 3), and gravity pulls down (weight, 4). The arrow along the ground in the direction of motion is the displacement (5). Of the four forces, only tension (positive work) and friction (negative work) have components along the displacement; work is a scalar, so it is never drawn as an arrow.
- id: phys-m4-r2-q02
  lesson: phys-work
  module_quiz: true
  topic: Work and kinetic energy
  stem: 'In which situations does the named force do zero work? Select all that apply.'
  choices: ['The normal force on a box sliding across a level floor', 'The string tension on a ball whirled in a horizontal circle at constant speed', 'Gravity on an apple falling from a tree', 'Kinetic friction on a box sliding to a stop', 'Your upward push on a heavy bag you hold still']
  answer: [0, 1, 4]
  explanation: |-
    Work is $Fd\cos\theta$. The normal force and the circular-motion tension are perpendicular to the motion ($\cos 90^\circ = 0$), and the held bag has no displacement, so all three do zero work. Gravity on the falling apple points along the motion (positive work), and friction on the sliding box points against it (negative work).
- id: phys-m4-r2-q03
  lesson: phys-work
  type: text
  topic: Work and kinetic energy
  stem: 'A spring with $k = 800$ N/m is stretched 0.050 m from its natural length. The work needed is ___ J. (Give only the number.)'
  accept: ['1', '1.0', '1.00']
  explanation: |-
    The force grows from 0 to $kx$, so the work is the triangle area $\tfrac12kx^2 = \tfrac12(800)(0.050)^2 = 1.0$ J. Writing $kx^2$ would give 2.0 J.
- id: phys-m4-r2-q04
  lesson: phys-work
  type: order
  topic: Work and kinetic energy
  stem: 'Put the steps for finding an object''s final speed with the work–energy theorem in order.'
  items: ['Identify every force acting on the object', 'Find the work done by each force', 'Add these works to get the net work', 'Set the net work equal to $\tfrac12mv_f^2 - \tfrac12mv_i^2$', 'Solve for $v_f$']
  explanation: |-
    You can't find a force's work until you know the force, you can't add works you haven't found, and the theorem $W_{\text{net}} = \Delta K$ needs the net work before it can be solved for the final speed. Each step depends on the one before it.
- id: phys-m4-r2-q05
  lesson: phys-work
  type: match
  topic: Work and kinetic energy
  stem: 'A rope pulls a sled forward across level snow, and then the sled is tossed upward onto a ledge. Match each force to the sign of the work it does.'
  pairs:
    - [The rope's pull on the sled as it moves forward, Positive work]
    - [The normal force from level snow, Zero work]
    - [Kinetic friction on the sliding sled, Negative work]
    - [Gravity on the sled while it rises, Negative work]
  explanation: |-
    The sign of $W = Fd\cos\theta$ depends on the angle between force and displacement. The rope pulls mostly along the motion ($\theta < 90^\circ$, positive). The normal force on level ground is perpendicular ($\theta = 90^\circ$, zero). Friction and gravity on a rising object point against the motion ($\theta > 90^\circ$, negative).
- id: phys-m4-r2-q06
  lesson: phys-energy
  type: label
  topic: Conservation of energy
  stem: 'A skateboarder is released from rest at the top of the left side of this frictionless track. Point 3 is halfway up the right side, and point 4 is at the starting height. Match each numbered point to its description.'
  image: {src: images/m4-energy-track-blank.svg, alt: 'A U-shaped frictionless track with a dashed line marking the zero level of potential energy at the bottom. Four numbered points: the top of the left side, the lowest point, a point halfway up the right side, and the top of the right side.'}
  labels:
    - {x: 11.6, y: 17.4, text: Release point (all potential energy)}
    - {x: 50.0, y: 86.8, text: Greatest speed}
    - {x: 78.7, y: 53.9, text: Kinetic and potential energy equal}
    - {x: 90.6, y: 21.1, text: Turning point on the far side}
  explanation: |-
    With no friction, $K + U$ stays equal to $mgh$. At the release point (1) it is all potential. At the lowest point (2) $U = 0$, so all of it is kinetic and the speed is greatest. Halfway up (3), $U = \tfrac12mgh$, so $K = \tfrac12mgh$ too. At the starting height on the far side (4), $K = 0$: the skateboarder stops and turns back. A frictionless track loses no energy to friction anywhere.
- id: phys-m4-r2-q07
  lesson: phys-energy
  type: order
  topic: Power
  stem: 'Order these from least to greatest power.'
  items: ['A 60 W light bulb', 'A 50 kg student climbing 3.0 m of stairs in 6.0 s', 'A 400 N force pushing a cart at a steady 1.5 m/s', 'An engine rated at 1 horsepower', 'A motor lifting a 900 kg elevator at a steady 2.0 m/s']
  explanation: |-
    Bulb: 60 W. Student: $mgh/t = 50(9.8)(3.0)/6.0 = 245$ W. Cart: $P = Fv = 400(1.5) = 600$ W. One horsepower: 746 W. Elevator: $mgv = 900(9.8)(2.0) = 17\,640$ W. ($g = 9.8$ m/s².)
- id: phys-m4-r2-q08
  lesson: phys-energy
  module_quiz: true
  type: text
  topic: Conservation of energy
  stem: 'A rock is dropped from rest and falls 5.0 m. Ignoring air resistance and using $g = 9.8$ m/s², its speed just before it lands is ___ m/s. (Give only the number, to 2 significant figures.)'
  accept: ['9.9', '9.90']
  explanation: |-
    $mgh = \tfrac12mv^2$, so $v = \sqrt{2gh} = \sqrt{2(9.8)(5.0)} = \sqrt{98} = 9.9$ m/s. The mass cancels.
- id: phys-m4-r2-q09
  lesson: phys-energy
  topic: Conservation of energy
  stem: 'In which of these is the mechanical energy ($K + U$) of the object (with Earth, and any spring) conserved? Select all that apply.'
  choices: ['A pendulum swinging with no air resistance', 'A skier gliding down a frictionless curved slope', 'A box sliding to a stop on a rough floor', 'An elevator car lifted at constant speed by a motor', 'A ball bouncing on an ideal, perfectly elastic spring']
  answer: [0, 1, 4]
  explanation: |-
    Mechanical energy is conserved when only conservative forces (gravity, ideal springs) do work. The pendulum's string tension and the slope's normal force do no work, so those two qualify, and so does the ideal spring. Friction on the box turns mechanical energy into thermal energy. The motor does positive work on the elevator, raising its potential energy while its kinetic energy stays fixed.
- id: phys-m4-r2-q10
  lesson: phys-energy
  type: match
  topic: Power
  stem: 'Match each quantity to its SI unit or the unit most often used for it.'
  pairs:
    - [Power, Watt]
    - [Work, Joule]
    - [Electrical energy on a utility bill, Kilowatt-hour]
    - [Spring constant, Newton per meter]
  distractors: [Newton-second]
  explanation: |-
    Power is energy per time: 1 W = 1 J/s. Work and energy are in joules. Utilities bill energy in kilowatt-hours ($3.6\times10^6$ J each). The spring constant is force per stretch, N/m. The newton-second is the unit of impulse, from the next lesson.
- id: phys-m4-r2-q11
  lesson: phys-momentum
  type: label
  topic: Momentum and impulse
  stem: 'This graph shows the force on a ball while it is struck. Name each numbered feature.'
  image: {src: images/m4-impulse-graph-blank.svg, alt: 'A graph of force against time: the force rises smoothly from zero to a high point and falls back to zero, with the area under the curve shaded. A dashed horizontal line crosses the curve at half its height, and a double-headed arrow below the time axis spans from where the force starts to where it ends. Four features are numbered.'}
  labels:
    - {x: 46.8, y: 17.5, text: Peak force}
    - {x: 79.0, y: 48.8, text: Average force}
    - {x: 46.8, y: 88.8, text: Contact time}
    - {x: 46.8, y: 67.0, text: Impulse}
  distractors: [Momentum of the ball before impact, Slope of the graph]
  explanation: |-
    The highest point of the curve is the peak force (1). The dashed line is the average force (2): a constant force at that height for the same time gives the same area. The span along the time axis is the contact time $\Delta t$ (3). The shaded area under the curve is the impulse (4), which equals the ball's change in momentum.
- id: phys-m4-r2-q12
  lesson: phys-momentum
  module_quiz: true
  type: text
  topic: Momentum and impulse
  stem: 'A 0.40 kg ball moving east at 5.0 m/s is hit and moves west at 3.0 m/s. The magnitude of the impulse on it is ___ N·s. (Give only the number.)'
  accept: ['3.2', '3.20']
  explanation: |-
    Taking west as positive, $\Delta p = 0.40(3.0 - (-5.0)) = 0.40(8.0) = 3.2$ N·s. Ignoring the reversal of direction would give $0.40(5.0 - 3.0) = 0.80$ N·s.
- id: phys-m4-r2-q13
  lesson: phys-momentum
  topic: Momentum and impulse
  stem: 'Which of these reduce the average force on a person who has to stop, by making the stopping time longer? Select all that apply.'
  choices: ['An air bag that inflates in front of the driver', 'A crumple zone at the front of a car', 'Bending your knees as you land from a jump', 'Landing stiff-legged on concrete']
  answer: [0, 1, 2]
  explanation: |-
    The change in momentum is fixed by the speed you must lose, and $F_{\text{avg}} = \Delta p/\Delta t$. Air bags, crumple zones and bent knees all spread the stop over a longer time, lowering the average force. Landing stiff-legged on concrete stops you in a very short time, so the average force is large.
- id: phys-m4-r2-q14
  lesson: phys-momentum
  type: match
  topic: Momentum and impulse
  stem: 'Match each problem to the principle that solves it most directly.'
  pairs:
    - [How fast a skater recoils after throwing a ball on ice, Conservation of momentum]
    - [The average force of a bat on a ball during a 1 ms hit, Impulse–momentum theorem]
    - [How far a raft moves when a person walks along it, Center of mass stays fixed]
    - [The speed of a cart after a known net force acts over a known distance, Work–energy theorem]
  explanation: |-
    The skater and ball start at rest with no horizontal external force, so their total momentum stays zero. A force over a known time is an impulse, equal to the change in momentum. With no external horizontal force, the raft-and-person center of mass can't move. A force over a distance is work, equal to the change in kinetic energy.
- id: phys-m4-r2-q15
  lesson: phys-momentum
  type: order
  topic: Center of mass
  stem: 'Each system has one mass at $x = 0$ and one at $x = 4.0$ m. Order the systems by the position of their center of mass, smallest $x_{\text{cm}}$ first.'
  items: ['3.0 kg at $x = 0$, 1.0 kg at $x = 4.0$ m', '1.0 kg at $x = 0$, 1.0 kg at $x = 4.0$ m', '1.0 kg at $x = 0$, 2.0 kg at $x = 4.0$ m', '1.0 kg at $x = 0$, 3.0 kg at $x = 4.0$ m']
  explanation: |-
    $x_{\text{cm}} = \dfrac{m_2(4.0)}{m_1 + m_2}$: $\dfrac{4.0}{4.0} = 1.0$ m, $\dfrac{4.0}{2.0} = 2.0$ m, $\dfrac{8.0}{3.0} = 2.67$ m, $\dfrac{12}{4.0} = 3.0$ m. The more of the mass sits at 4.0 m, the closer the center of mass is to it.
- id: phys-m4-r2-q16
  lesson: phys-collisions
  type: label
  topic: Collisions
  stem: 'Name the numbered parts of this ballistic pendulum.'
  image: {src: images/m4-ballistic-pendulum-blank.svg, alt: 'A small projectile moving right toward a block hanging from two strings, and a dashed outline of the block after it has swung up to the right, with a double arrow showing how much higher its bottom is. Four parts are numbered.'}
  labels:
    - {x: 13.7, y: 66.3, text: Bullet}
    - {x: 51.6, y: 66.3, text: Wooden block}
    - {x: 41.9, y: 36.8, text: Supporting string}
    - {x: 92.7, y: 67.3, text: Rise height h}
  distractors: [Spring, Pulley]
  explanation: |-
    The bullet (1) embeds in the hanging wooden block (2), which is held by strings (3). After the impact the block swings up until its kinetic energy has become potential energy; the rise height $h$ (4) gives the block's speed just after impact, $V = \sqrt{2gh}$.
- id: phys-m4-r2-q17
  lesson: phys-collisions
  module_quiz: true
  type: order
  topic: Collisions
  stem: 'Put the steps for finding a bullet''s speed with a ballistic pendulum in order.'
  items: ['Measure how high the block rises, $h$', 'Use energy conservation for the swing: $V = \sqrt{2gh}$', 'Use momentum conservation for the impact: $mv = (m + M)V$', 'Solve for the bullet''s speed $v$']
  explanation: |-
    Work backward from what you can measure. The rise height gives the speed just after the impact through energy conservation (valid for the swing only). That speed goes into the momentum equation for the impact, which is then solved for $v$. Using energy conservation across the impact would be wrong, because most of the bullet's kinetic energy becomes heat.
- id: phys-m4-r2-q18
  lesson: phys-collisions
  type: match
  topic: Collisions
  stem: 'Match each collision to its type.'
  pairs:
    - [Two railroad cars couple and roll on together, Perfectly inelastic]
    - [A bullet embeds in a wooden block, Perfectly inelastic]
    - [Two steel ball bearings bounce apart with no measurable loss of kinetic energy, Elastic]
    - [A dropped basketball rebounds to 60% of its starting height, Inelastic]
  explanation: |-
    Objects that stick together share one final velocity: perfectly inelastic (the coupled cars and the bullet in the block). If kinetic energy is unchanged, the collision is elastic (steel bearings come close). The basketball bounces but loses 40% of its kinetic energy, so it is inelastic but not perfectly inelastic.
- id: phys-m4-r2-q19
  lesson: phys-collisions
  type: text
  topic: Collisions
  stem: 'A 3.0 kg cart moving at 4.0 m/s collides with a 1.0 kg cart at rest, and they stick together. Their common speed is ___ m/s. (Give only the number.)'
  accept: ['3', '3.0']
  explanation: |-
    Momentum is conserved: $3.0(4.0) = (3.0 + 1.0)v_f$, so $v_f = 12/4.0 = 3.0$ m/s.
- id: phys-m4-r2-q20
  lesson: phys-collisions
  module_quiz: true
  topic: Collisions
  stem: 'Two carts on a level, frictionless track collide and stick together. Which quantities are the same just after the collision as just before? Select all that apply.'
  choices: ['The total momentum of the two carts', 'The total energy, including thermal energy', 'The total mass', 'The total kinetic energy', 'The velocity of each cart']
  answer: [0, 1, 2]
  explanation: |-
    Momentum is conserved because the collision forces are internal and no net external force acts along the track. Total energy and mass are always conserved. Kinetic energy is not: a perfectly inelastic collision turns some of it into heat and deformation. The carts' velocities change (that is what a collision does).

# ---------------- Honors: rockets and variable-mass systems ----------------
- id: phys-m4-r2-h01
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'A rocket engine expels 400 kg of gas per second at 2500 m/s relative to the rocket. What is its thrust?'
  choices: ['$6.25$ N', '$1.0\times10^6$ N', '$5.0\times10^5$ N', '$1.0\times10^3$ N']
  answer: 1
  explanation: |-
    $T = uR = (2500)(400) = 1.0\times10^6$ N. 6.25 divides instead of multiplying; $5.0\times10^5$ N puts in a stray $\tfrac12$ as if this were kinetic energy.
- id: phys-m4-r2-h02
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'A $2.0\times10^5$ kg rocket has a thrust of $3.0\times10^6$ N at liftoff. What is its upward acceleration? ($g = 9.8$ m/s²)'
  choices: ['15 m/s²', '24.8 m/s²', '5.2 m/s²', '1.5 m/s²']
  answer: 2
  explanation: |-
    $a = T/m - g = \dfrac{3.0\times10^6}{2.0\times10^5} - 9.8 = 15 - 9.8 = 5.2$ m/s². 15 m/s² ignores the weight; 24.8 m/s² adds $g$ instead of subtracting it.
- id: phys-m4-r2-h03
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'A rocket climbs with constant thrust. Ignoring air resistance and the small change in $g$, why does its acceleration increase during the burn?'
  choices: ['The exhaust speed increases as the tanks empty', 'Gravity stops acting once the rocket is moving fast', 'The thrust grows as the rocket speeds up', 'The rocket''s mass decreases as propellant is burned']
  answer: 3
  explanation: |-
    $a = T/m - g$ with $T$ constant, and $m$ drops steadily as propellant leaves. The thrust $uR$ does not depend on the rocket's speed, and gravity keeps acting.
- id: phys-m4-r2-h04
  lesson: phys-m4-h-rockets
  type: text
  topic: Rockets and variable mass
  stem: 'A probe in free space with exhaust speed 3000 m/s burns propellant until its mass is half of what it was. It gains ___ m/s. (Give only the number, to 3 significant figures.)'
  accept: ['2080', '2079', '2079.4']
  explanation: |-
    $\Delta v = u\ln(m_0/m_f) = 3000\ln 2 = 3000(0.693) = 2080$ m/s. Using the starting mass for the whole burn would give $3000(0.5) = 1500$ m/s, too small, because the later propellant pushes a lighter rocket.
- id: phys-m4-r2-h05
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'What mass ratio $m_0/m_f$ does a rocket need to reach a delta-v equal to twice its exhaust speed?'
  choices: ['2', '4', '7.4', '0.14']
  answer: 2
  explanation: |-
    $m_0/m_f = e^{\Delta v/u} = e^2 = 7.39$. The ratio grows exponentially, not in proportion: 2 or 4 assume it grows linearly or as a square. 0.14 is $m_f/m_0$, the upside-down ratio.
- id: phys-m4-r2-h06
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'For a rocket in free space, which changes increase the delta-v it can reach? Select all that apply.'
  choices: ['A higher exhaust speed', 'A larger fraction of its starting mass as propellant', 'Dropping empty tanks and engines partway through (staging)', 'Burning the same propellant faster, for more thrust', 'Carrying a heavier payload']
  answer: [0, 1, 2]
  explanation: |-
    $\Delta v = u\ln(m_0/m_f)$ depends only on the exhaust speed and the mass ratio. A higher $u$, more propellant, and staging (which lowers the mass the later burns must push) all raise it. Burning faster changes the thrust and the burn time but not $u$ or the mass ratio, so in free space the final $\Delta v$ is the same. A heavier payload raises $m_f$ and lowers the mass ratio.
- id: phys-m4-r2-h07
  lesson: phys-m4-h-rockets
  type: order
  topic: Rockets and variable mass
  stem: 'Put the events of a two-stage launch in order, for the usual sequence shown in the lesson, where the second stage ignites after separation.'
  items: ['The first-stage engines ignite at liftoff', 'The first stage runs out of propellant', 'The empty first stage separates and falls away', 'The second-stage engine ignites', 'The second stage burns out with the payload at its final speed']
  explanation: |-
    The first stage burns until it is empty; only then is it dropped, so its dead weight is no longer carried. The second stage then ignites and burns the rest of the way. (Some rockets "hot stage", lighting the second stage a moment before separation; this question asks about the usual sequence.)
- id: phys-m4-r2-h08
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'A 50 t two-stage rocket ($u = 3000$ m/s) burns 30 t of propellant in its first stage, drops the 5 t empty first stage, and then burns 10 t of propellant in its second stage. What total delta-v does it reach in free space?'
  choices: ['4830 m/s', '6050 m/s', '6910 m/s', '2750 m/s']
  answer: 1
  explanation: |-
    Stage 1: 50 t to 20 t, $3000\ln 2.5 = 2749$ m/s. Drop 5 t, leaving 15 t. Stage 2: 15 t to 5 t, $3000\ln 3 = 3296$ m/s. Total 6045 m/s. 4830 m/s keeps the empty stage the whole way ($3000\ln(50/10)$); 6910 m/s treats the dropped 5 t as if it were burned propellant ($3000\ln(50/5)$); 2750 m/s is stage 1 only.
- id: phys-m4-r2-h09
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'Sand falls straight down onto a conveyor belt at 30 kg/s. How much extra horizontal force must the motor supply to keep the belt moving at a steady 2.0 m/s?'
  choices: ['30 N', '120 N', '15 N', '60 N']
  answer: 3
  explanation: |-
    Each second, 30 kg of sand gains horizontal momentum $30(2.0) = 60$ kg·m/s, so $F = Rv = 60$ N. 30 N comes from setting the motor's power equal to only the sand's kinetic energy gain, $\tfrac12Rv^2$; 120 N multiplies by $v^2$.
- id: phys-m4-r2-h10
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'For sand dropped onto a steadily moving conveyor belt, what fraction of the motor''s extra power ends up as kinetic energy of the sand?'
  choices: ['One half, whatever the roughness of the belt', 'All of it, because the belt does no work against friction', 'One quarter', 'It depends on how rough the belt is']
  answer: 0
  explanation: |-
    The motor supplies $P = Fv = Rv^2$, but the sand gains only $\tfrac12Rv^2$ of kinetic energy per second. The other half becomes heat as the sand skids before catching up. A rougher belt makes the sand catch up sooner but with a larger friction force, and the two effects cancel, so the split is always half and half.
- id: phys-m4-r2-h11
  lesson: phys-m4-h-rockets
  type: text
  topic: Rockets and variable mass
  stem: 'An open 18 000 kg rail car coasts at 4.0 m/s on a level track with negligible friction. Rain falling straight down adds 2000 kg of water. The car''s new speed is ___ m/s. (Give only the number.)'
  accept: ['3.6', '3.60']
  explanation: |-
    The rain brings no horizontal momentum and no horizontal external force acts, so horizontal momentum is conserved: $18\,000(4.0) = 20\,000v$, giving $v = 3.6$ m/s.
- id: phys-m4-r2-h12
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'A rail car full of sand coasts on a level, frictionless track while sand drains straight down through a hole in its floor. What happens to the car''s speed?'
  choices: ['It increases, like a rocket losing mass', 'It decreases, because sand is being lost', 'It stays the same', 'It increases at first, then decreases']
  answer: 2
  explanation: |-
    The sand leaves with the car's own horizontal velocity, so it carries away exactly its share of the momentum, and no horizontal force acts on the car. Unlike rocket exhaust, the sand is not pushed backward relative to the car, so the car neither speeds up nor slows down.
- id: phys-m4-r2-h13
  lesson: phys-m4-h-rockets
  type: match
  topic: Rockets and variable mass
  stem: 'Match each rocket quantity to its meaning.'
  pairs:
    - [Exhaust speed, Speed of the gas relative to the rocket]
    - [Mass flow rate, Mass of propellant expelled per second]
    - [Mass ratio, Mass at the start of a burn divided by mass at the end]
    - [Thrust, Forward force on the rocket from expelling gas]
  distractors: [Weight of the rocket at liftoff]
  explanation: |-
    The exhaust speed $u$ is measured relative to the rocket. The mass flow rate $R$ is kilograms per second. The mass ratio $m_0/m_f$ goes into the rocket equation. Thrust is $T = uR$; the weight is a separate force that thrust must beat at liftoff.
- id: phys-m4-r2-h14
  lesson: phys-m4-h-rockets
  type: label
  topic: Rockets and variable mass
  stem: 'Name the numbered parts of this rocket.'
  image: {src: images/m4-rocket-blank.svg, alt: 'A rocket standing upright: a pointed nose section, two tank sections below it, a bell-shaped piece at the bottom, a flame-shaped region below that, a downward arrow beside the flame and an upward arrow to the right of the rocket. Five parts are numbered.'}
  labels:
    - {x: 44.6, y: 23.9, text: Payload}
    - {x: 44.6, y: 52.2, text: Propellant tanks}
    - {x: 44.6, y: 76.1, text: Nozzle}
    - {x: 44.6, y: 89.1, text: Exhaust gas}
    - {x: 85.7, y: 52.2, text: Thrust}
  distractors: [Weight, Heat shield]
  explanation: |-
    The payload (1) rides under the nose cone. Below it are the propellant tanks (2), holding fuel and oxidizer. The engine's nozzle (3) directs the exhaust gas (4) backward; the reaction to pushing that gas backward is the upward thrust (5).
- id: phys-m4-r2-h15
  lesson: phys-m4-h-rockets
  topic: Rockets and variable mass
  stem: 'An ion thruster has an exhaust speed about ten times that of a chemical rocket but a thrust of only a fraction of a newton. Which statement is correct?'
  choices: ['It reaches a much larger delta-v for the same mass ratio, but it accelerates very slowly', 'It reaches the same delta-v as a chemical rocket, only sooner', 'Its high exhaust speed lets it lift off from Earth easily', 'Its low thrust means it can never reach a large delta-v']
  answer: 0
  explanation: |-
    $\Delta v = u\ln(m_0/m_f)$, so ten times the exhaust speed gives ten times the delta-v for the same mass ratio. The tiny thrust means the acceleration is small, far below $g$, so it can't lift off, but over months in space the small push adds up.

# ---------------- Honors: restitution, bouncing, and gravity assists ----------------
- id: phys-m4-r2-h16
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A ball dropped from 2.00 m rebounds to 1.28 m. What is the coefficient of restitution between the ball and the floor?'
  choices: ['0.64', '0.80', '0.36', '0.41']
  answer: 1
  explanation: |-
    The rebound speed is $e$ times the impact speed, and height is proportional to speed squared, so $h_{\text{after}}/h_{\text{before}} = e^2 = 1.28/2.00 = 0.64$ and $e = 0.80$. 0.64 is the height ratio, not $e$; 0.36 is $1 - e^2$.
- id: phys-m4-r2-h17
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A 1.0 kg cart moving at 6.0 m/s hits a 2.0 kg cart at rest head-on. The coefficient of restitution is 0.50. What are the final velocities?'
  choices: ['$v_1 = 2.0$ m/s, $v_2 = 2.0$ m/s', '$v_1 = -2.0$ m/s, $v_2 = 4.0$ m/s', '$v_1 = 1.0$ m/s, $v_2 = 2.5$ m/s', '$v_1 = 0$, $v_2 = 3.0$ m/s']
  answer: 3
  explanation: |-
    Momentum: $v_1 + 2.0v_2 = 6.0$. Restitution: $v_2 - v_1 = 0.50(6.0) = 3.0$. Substituting $v_2 = v_1 + 3.0$: $3.0v_1 + 6.0 = 6.0$, so $v_1 = 0$ and $v_2 = 3.0$ m/s. The (2.0, 2.0) choice is the perfectly inelastic result ($e = 0$), and (−2.0, 4.0) is the elastic one ($e = 1$). (1.0, 2.5) conserves momentum but separates at only 1.5 m/s.
- id: phys-m4-r2-h18
  lesson: phys-m4-h-restitution
  type: text
  topic: Restitution and gravity assists
  stem: 'In a collision with coefficient of restitution 0.60, ___ % of the relative kinetic energy (the kinetic energy in the center-of-mass frame) is lost. (Give only the number.)'
  accept: ['64', '64%', '64 percent']
  explanation: |-
    In the center-of-mass frame every speed is multiplied by $e$, so every kinetic energy is multiplied by $e^2 = 0.36$. The fraction lost is $1 - e^2 = 0.64$, or 64%. (Not 40%: $e$ scales speeds, not energies.)
- id: phys-m4-r2-h19
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'What is the reduced mass of a 2.0 kg object and a 3.0 kg object?'
  choices: ['1.2 kg', '5.0 kg', '2.5 kg', '0.83 kg']
  answer: 0
  explanation: |-
    $\mu = \dfrac{m_1m_2}{m_1 + m_2} = \dfrac{6.0}{5.0} = 1.2$ kg, less than either mass. 5.0 kg is the total mass and 2.5 kg the average; 0.83 kg is $\dfrac{m_1 + m_2}{m_1m_2}$, the upside-down fraction.
- id: phys-m4-r2-h20
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'Which statements about a head-on collision, viewed in the center-of-mass frame, are true? Select all that apply.'
  choices: ['The total momentum is zero before and after', 'Each object''s velocity reverses and is multiplied by $e$', 'The kinetic energy $\tfrac12Mv_{\text{cm}}^2$ of the center of mass cannot be lost', 'Both objects always end at rest', 'The relative speed is the same after as before']
  answer: [0, 1, 2]
  explanation: |-
    In the CM frame the total momentum is zero by definition and stays zero, so the objects must leave with opposite momenta, each velocity reversed and scaled by $e$. The CM's own kinetic energy can't change because momentum is conserved. The objects end at rest only when $e = 0$, and the relative speed is unchanged only when $e = 1$.
- id: phys-m4-r2-h21
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A ball is dropped from 1.0 m with $e = 0.50$. Ignoring air resistance, what total distance does it travel before it comes to rest?'
  choices: ['1.33 m', '2.0 m', '3.0 m', '1.67 m']
  answer: 3
  explanation: |-
    $D = h_0\dfrac{1 + e^2}{1 - e^2} = 1.0\cdot\dfrac{1.25}{0.75} = 1.67$ m: down 1.0 m, then up and down $0.25 + 0.0625 + \dots = 0.333$ m each way. 1.33 m counts each bounce only once; 3.0 m uses $e$ instead of $e^2$ for the height ratio; 2.0 m is $h_0/(1 - e)$, which also uses $e$ in place of $e^2$.
- id: phys-m4-r2-h22
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A tennis ball dropped from 254 cm onto concrete rebounds to 140 cm. Ignoring air resistance, what is its coefficient of restitution?'
  choices: ['0.74', '0.55', '0.45', '0.30']
  answer: 0
  explanation: |-
    $e = \sqrt{h_{\text{after}}/h_{\text{before}}} = \sqrt{140/254} = \sqrt{0.551} = 0.74$, inside the 0.73–0.76 range implied by the tennis rules. 0.55 is the height ratio without the square root; 0.45 is $1 - 0.55$.
- id: phys-m4-r2-h23
  lesson: phys-m4-h-restitution
  type: order
  topic: Restitution and gravity assists
  stem: 'Put the steps for finding a spacecraft''s speed after an idealized head-on gravity assist in order.'
  items: ['Subtract the planet''s velocity to find the craft''s velocity in the planet''s frame', 'Reverse that velocity, keeping its speed, because the flyby is elastic in the planet''s frame', 'Add the planet''s velocity back to return to the Sun''s frame', 'Compare the new speed with the original speed']
  explanation: |-
    The flyby is simple only in the planet's frame, so change frames first, apply the elastic "bounce" there, change back, and only then compare speeds in the Sun's frame. For a craft at $v$ meeting a planet at $U$ head-on, the speed goes from $v$ to $v + 2U$.
- id: phys-m4-r2-h24
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A spacecraft moving at 8 km/s meets a planet moving at 12 km/s in the idealized head-on geometry, and swings around behind it. What is the craft''s speed afterward (in the Sun''s frame)?'
  choices: ['32 km/s', '20 km/s', '24 km/s', '4 km/s']
  answer: 0
  explanation: |-
    In the planet's frame the craft approaches at $8 + 12 = 20$ km/s and leaves at 20 km/s. Adding the planet's 12 km/s gives $v + 2U = 32$ km/s. 20 km/s forgets to change back to the Sun's frame; 24 km/s is just $2U$.
- id: phys-m4-r2-h25
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'Where does the extra kinetic energy a spacecraft gains in a gravity assist come from?'
  choices: ['From the spacecraft''s fuel, burned during the flyby', 'From the planet''s motion: the planet slows down by an extremely small amount', 'Nowhere: in the Sun''s frame the craft''s speed doesn''t really change', 'From the planet''s gravitational potential energy, which is used up']
  answer: 1
  explanation: |-
    The flyby is an elastic interaction between craft and planet. Momentum conservation means the planet's momentum changes by the opposite amount, so the planet slows very slightly and loses exactly the kinetic energy the craft gains. Because the planet is so massive, its change in speed is far too small to measure.
- id: phys-m4-r2-h26
  lesson: phys-m4-h-restitution
  type: match
  topic: Restitution and gravity assists
  stem: 'Match each coefficient of restitution to the kind of collision.'
  pairs:
    - [$e = 1$, Elastic]
    - [$e = 0$, Perfectly inelastic]
    - [$e = 0.75$, Inelastic]
    - [$e = 0.2$, Inelastic]
  distractors: [Explosion]
  explanation: |-
    $e = 1$ means the objects separate as fast as they approached, so no kinetic energy is lost: elastic. $e = 0$ means they don't separate at all: perfectly inelastic. Anything in between is inelastic, losing the fraction $1 - e^2$ of the relative kinetic energy. An explosion releases stored energy, which would correspond to $e > 1$.
- id: phys-m4-r2-h27
  lesson: phys-m4-h-restitution
  type: label
  topic: Restitution and gravity assists
  stem: 'This picture shows an idealized head-on gravity assist in the Sun''s frame. Name each numbered part.'
  image: {src: images/m4-gravity-assist-blank.svg, alt: 'A planet with an arrow pointing left from it, and a dashed spacecraft path that comes in from the left along the top moving right, loops around the right side of the planet, and goes back out to the left along the bottom. Arrows along the path show the craft moving right at the top and left at the bottom. Four parts are numbered.'}
  labels:
    - {x: 56.2, y: 50.0, text: Planet}
    - {x: 40.8, y: 50.0, text: Planet's velocity U}
    - {x: 20.3, y: 31.6, text: Incoming velocity v}
    - {x: 24.2, y: 68.4, text: Outgoing velocity v + 2U}
  distractors: [Outgoing velocity v, Sun's gravity]
  explanation: |-
    The circle is the planet (1), moving left at $U$ (2). The craft comes in moving right at $v$ (3), swings around the planet's trailing side, and leaves moving left (4). In the planet's frame its speed is $v + U$ both in and out; adding the planet's velocity back gives $v + 2U$ in the Sun's frame, not the original $v$.
- id: phys-m4-r2-h28
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A ball arrives at 30 m/s and meets a very heavy bat moving toward it at 20 m/s. With $e = 0.50$, how fast does the ball leave the bat (treating the bat''s speed as unchanged)?'
  choices: ['70 m/s', '25 m/s', '35 m/s', '45 m/s']
  answer: 3
  explanation: |-
    In the bat's frame the ball comes in at $30 + 20 = 50$ m/s and leaves at $0.50(50) = 25$ m/s. Back in the ground frame: $25 + 20 = 45$ m/s. 70 m/s is the elastic result $v + 2V$; 25 m/s forgets to add the bat's velocity back; 35 m/s applies $e$ to the ball's speed alone.
- id: phys-m4-r2-h29
  lesson: phys-m4-h-restitution
  topic: Restitution and gravity assists
  stem: 'A ball dropped from 4.9 m takes 1.0 s to reach the floor. If $e = 0.50$ and air resistance is ignored, how long after release does it stop bouncing?'
  choices: ['It never stops: the bounces go on forever', '2.0 s', '3.0 s', '1.5 s']
  answer: 2
  explanation: |-
    $T = t_0\dfrac{1 + e}{1 - e} = 1.0 \times \dfrac{1.5}{0.5} = 3.0$ s. The first fall takes 1.0 s; each later bounce lasts $2e^n t_0$: 1.0 s, 0.5 s, 0.25 s, …, adding to 2.0 s more. Infinitely many bounces fit in a finite time because the times form a geometric series. 2.0 s counts each bounce's flight only once.
