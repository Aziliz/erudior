# Round 2, module phys-m6: new question types for the core lessons (q01–q15)
# and quizzes for the three honors lessons (h01–h40).
- id: phys-m6-r2-q01
  lesson: phys-shm
  type: text
  topic: Simple harmonic motion
  stem: 'A 0.40 kg mass on a spring with $k = 160$ N/m oscillates. Its angular frequency is ___ rad/s. Give only the number.'
  accept: ['20']
  explanation: |-
    $\omega = \sqrt{k/m} = \sqrt{160/0.40} = \sqrt{400} = 20$ rad/s. (The period is $2\pi/20 = 0.314$ s.)
- id: phys-m6-r2-q02
  lesson: phys-shm
  type: order
  topic: Simple harmonic motion
  stem: 'A block on a horizontal spring is released from rest at $x = +A$. Put these moments of its first cycle in order.'
  items:
    - 'Released at rest at $x = +A$, with maximum acceleration toward equilibrium'
    - 'Passes equilibrium moving toward $-A$ at maximum speed'
    - 'Momentarily at rest at $x = -A$'
    - 'Passes equilibrium moving toward $+A$ at maximum speed'
    - 'Back at rest at $x = +A$, one period after release'
  explanation: |-
    The block accelerates toward equilibrium, overshoots at top speed, slows to a stop at $-A$, and comes back the same way. Each step takes a quarter period.
- id: phys-m6-r2-q03
  lesson: phys-shm
  module_quiz: true
  topic: Simple harmonic motion
  stem: 'A block oscillates on a horizontal spring with no friction. Which statements are true? Select all that apply.'
  choices:
    - 'The acceleration has its largest magnitude at the turning points.'
    - 'The kinetic energy is largest at equilibrium.'
    - 'Doubling the amplitude doubles the period.'
    - 'The total mechanical energy is $\tfrac12kA^2$.'
    - 'The acceleration is zero at the turning points.'
  answer: [0, 1, 3]
  explanation: |-
    At the turning points the spring force, and so the acceleration, is largest while the speed is zero; at equilibrium the force is zero and the speed (and kinetic energy) is largest. $E = \tfrac12kA^2$ throughout. The period $2\pi\sqrt{m/k}$ doesn't depend on amplitude, and the acceleration is zero at equilibrium, not at the turning points.
- id: phys-m6-r2-q04
  lesson: phys-shm
  type: label
  topic: Pendulums
  stem: 'The picture shows the forces on a pendulum bob pulled aside from the vertical. Name the numbered parts.'
  image: {src: images/phys-m6-pendulum-blank.svg, alt: 'A pendulum hanging from a ceiling, pulled aside from a dashed vertical line. Arrows start at the bob: one along the string toward the pivot, one straight down, one along the arc toward the bottom, and a dashed one along the string away from the pivot. An angle at the pivot and a dashed arc near the bottom are also marked. Six parts are numbered.'}
  labels:
    - {x: 51.1, y: 47.6, text: Tension}
    - {x: 56.6, y: 85.0, text: Weight}
    - {x: 45.0, y: 66.6, text: Restoring part of the weight (mg sin θ)}
    - {x: 67.0, y: 81.7, text: Part of the weight along the string (mg cos θ)}
    - {x: 37.6, y: 27.3, text: Angle from the vertical}
    - {x: 36.4, y: 64.2, text: Arc length from equilibrium}
  distractors: [Normal force, Friction]
  explanation: |-
    The tension (1) pulls along the string toward the pivot and the weight (2) acts straight down. Splitting the weight, the part along the arc, $mg\sin\theta$ (3), pulls the bob back toward the bottom; the part along the string, $mg\cos\theta$ (4), is balanced by the tension. The angle $\theta$ (5) is measured at the pivot from the vertical, and the arc (6) is $s = L\theta$. There is no surface, so no normal force or friction.
- id: phys-m6-r2-q05
  lesson: phys-shm
  type: match
  module_quiz: true
  topic: Pendulums
  stem: 'Match each change to its effect on the period.'
  pairs:
    - ['Mass on a spring: mass made 4 times larger', Period doubles]
    - ['Mass on a spring: spring constant made 4 times larger', Period halves]
    - ['Simple pendulum: bob mass doubled', Period unchanged]
    - ['Simple pendulum: taken where $g$ is 4 times smaller', Period doubles]
  distractors: [Period quadruples]
  explanation: |-
    Spring: $T = 2\pi\sqrt{m/k}$, so $4m$ gives $2T$ and $4k$ gives $T/2$. Pendulum: $T = 2\pi\sqrt{L/g}$ has no mass in it, and $g/4$ gives $2T$. Because of the square roots, a factor of 4 never changes the period by a factor of 4.
- id: phys-m6-r2-q06
  lesson: phys-waves
  type: label
  module_quiz: true
  topic: Wave properties
  stem: 'Name the numbered parts of this snapshot of a wave.'
  image: {src: images/phys-m6-wave-anatomy-blank.svg, alt: 'A sine-shaped wave drawn across a dashed horizontal line. A double arrow spans from one high point to the next, and a vertical arrow runs from the dashed line up to a high point. Five parts are numbered.'}
  labels:
    - {x: 15.0, y: 27.8, text: Crest}
    - {x: 33.6, y: 77.8, text: Trough}
    - {x: 33.6, y: 19.4, text: Wavelength}
    - {x: 52.1, y: 40.3, text: Amplitude}
    - {x: 11.4, y: 52.8, text: Rest (equilibrium) position}
  distractors: [Node, Period]
  explanation: |-
    The crest (1) and trough (2) are the highest and lowest points. One wavelength (3) is the distance from one crest to the next; the amplitude (4) is measured from the rest position (5) to a crest, not from trough to crest. A node belongs to a standing wave, and the period is a time, which a snapshot in space can't show.
- id: phys-m6-r2-q07
  lesson: phys-waves
  type: text
  topic: Wave properties
  stem: 'A wave has frequency 50 Hz and wavelength 4.0 m. Its speed is ___ m/s. Give only the number.'
  accept: ['200']
  explanation: |-
    $v = f\lambda = 50 \times 4.0 = 200$ m/s.
- id: phys-m6-r2-q08
  lesson: phys-waves
  type: match
  topic: Wave properties
  stem: 'Match each wave to the way the medium moves.'
  pairs:
    - [Sound traveling through air, Longitudinal]
    - [A wave on a guitar string, Transverse]
    - [A pulse pushed along the length of a Slinky, Longitudinal]
    - [A ripple on a pond, Mixture of transverse and longitudinal]
  explanation: |-
    In sound and in a pushed Slinky, the medium moves back and forth along the direction of travel (longitudinal). A guitar string moves sideways to the travel (transverse). Water parcels in a surface wave move in small circles, a mix of both.
- id: phys-m6-r2-q09
  lesson: phys-waves
  module_quiz: true
  topic: Wave properties
  stem: 'A wave passes from one medium into another in which it travels more slowly. Which statements are true? Select all that apply.'
  choices:
    - 'Its frequency stays the same.'
    - 'Its wavelength gets shorter.'
    - 'Its period changes.'
    - 'Its wavelength gets longer.'
  answer: [0, 1]
  explanation: |-
    The frequency (and so the period) is set by the source and doesn't change at the boundary. With $\lambda = v/f$, a lower speed at the same frequency means a shorter wavelength.
- id: phys-m6-r2-q10
  lesson: phys-waves
  type: order
  topic: Wave properties
  stem: 'Put these strings in order of wave speed, slowest first.'
  items:
    - '$F_T = 100$ N, $\mu = 0.040$ kg/m'
    - '$F_T = 100$ N, $\mu = 0.010$ kg/m'
    - '$F_T = 900$ N, $\mu = 0.040$ kg/m'
    - '$F_T = 400$ N, $\mu = 0.010$ kg/m'
  explanation: |-
    $v = \sqrt{F_T/\mu}$: $\sqrt{100/0.040} = 50$ m/s, $\sqrt{100/0.010} = 100$ m/s, $\sqrt{900/0.040} = 150$ m/s, $\sqrt{400/0.010} = 200$ m/s.
- id: phys-m6-r2-q11
  lesson: phys-sound
  type: label
  module_quiz: true
  topic: Sound
  stem: 'Each tube shows the air''s displacement pattern for one resonance. The thick bar marks a closed end; the other ends are open. Name each numbered mode.'
  image: {src: images/phys-m6-pipe-modes-blank.svg, alt: 'Four tubes of equal length, each with curves showing how far the air moves. Tube 1, open at both ends: largest at both ends, zero in the middle. Tube 2, open at both ends: largest at both ends and in the middle, zero at two points. Tube 3, closed at the left: zero at the closed end, rising to largest at the open end. Tube 4, closed at the left: zero at the closed end, then largest, zero, and largest again at the open end. The four tubes are numbered.'}
  labels:
    - {x: 90.6, y: 14.4, text: 'Open at both ends, fundamental'}
    - {x: 90.6, y: 37.9, text: 'Open at both ends, second harmonic'}
    - {x: 90.6, y: 61.3, text: 'Closed at one end, fundamental'}
    - {x: 90.6, y: 84.8, text: 'Closed at one end, third harmonic'}
  distractors: ['Closed at one end, second harmonic', 'Open at both ends, third harmonic']
  explanation: |-
    Open ends are displacement antinodes and closed ends are nodes. Tube 1 fits half a wavelength ($L = \lambda/2$, one node); tube 2 fits a whole wavelength (two nodes), the second harmonic. Tube 3 fits a quarter wavelength (the fundamental, $f_1 = v/4L$) and tube 4 three quarters (the third harmonic). A pipe closed at one end has no second harmonic, and an open pipe's third harmonic would show three nodes.
- id: phys-m6-r2-q12
  lesson: phys-sound
  type: text
  topic: Sound
  stem: 'Two identical machines each produce 60 dB at a certain spot. With both running, the level there is ___ dB (to the nearest decibel). Give only the number.'
  accept: ['63']
  explanation: |-
    Intensities add: twice the intensity adds $10\log_{10}2 = 3.0$ dB, so 63 dB, not 120 dB.
- id: phys-m6-r2-q13
  lesson: phys-sound
  type: match
  module_quiz: true
  topic: Doppler effect
  stem: 'Match each situation (in still air) to the pitch the listener hears compared with the pitch the source emits.'
  pairs:
    - [A siren drives toward a listener standing still, Higher]
    - [A listener drives away from a siren that is standing still, Lower]
    - [A siren drives away from a listener standing still, Lower]
    - [A listener and a siren move in the same direction at the same speed, Same]
  explanation: |-
    Approaching raises the pitch and receding lowers it, whichever one moves. With equal velocities in the same direction, the listener moving away ($v - u$ on top) and the source moving toward the listener ($v - u$ on the bottom) cancel exactly: no relative motion, no shift.
- id: phys-m6-r2-q14
  lesson: phys-sound
  topic: Sound
  stem: 'Which of these would raise the fundamental frequency of an organ pipe? Select all that apply.'
  choices:
    - 'Making the pipe shorter'
    - 'Opening the closed end of a pipe that was closed at one end'
    - 'Warming the air inside the pipe'
    - 'Closing one end of a pipe that was open at both ends'
    - 'Making the pipe longer'
  answer: [0, 1, 2]
  explanation: |-
    $f_1 = v/(2L)$ for an open pipe and $v/(4L)$ for a closed one. A shorter pipe raises $f_1$; opening the closed end changes $v/4L$ to $v/2L$, doubling it; warmer air raises $v$. Closing one end halves $f_1$, and a longer pipe lowers it.
- id: phys-m6-r2-q15
  lesson: phys-sound
  type: order
  topic: Sound
  stem: 'Put these sounds in order from quietest to loudest. ($I_0 = 10^{-12}$ W/m²)'
  items:
    - '$10^{-9}$ W/m²'
    - '50 dB'
    - '$10^{-4}$ W/m²'
    - '95 dB'
    - '1 W/m²'
  explanation: |-
    Convert all to decibels with $\beta = 10\log_{10}(I/I_0)$: $10^{-9}$ W/m² is 30 dB, $10^{-4}$ W/m² is 80 dB, and 1 W/m² is 120 dB. So 30, 50, 80, 95, 120 dB.

# Honors: Damped and driven oscillators
- id: phys-m6-r2-h01
  lesson: phys-m6-h-damped-driven
  topic: Damped oscillations
  stem: 'A 2.0 kg mass on a spring with $k = 800$ N/m has damping constant $b = 0.50$ kg/s. What is its quality factor?'
  choices: ['40', '80', '20', '160']
  answer: 1
  explanation: |-
    $Q = \sqrt{mk}/b = \sqrt{1600}/0.50 = 40/0.50 = 80$. 40 is $\sqrt{mk}$ without dividing by $b$; 20 rad/s is $\omega_0$; 160 uses $2\sqrt{mk}$, the critical damping constant, in place of $\sqrt{mk}$.
- id: phys-m6-r2-h02
  lesson: phys-m6-h-damped-driven
  topic: Damped oscillations
  stem: 'A lightly damped oscillator loses 5.0% of its amplitude each cycle. About what percentage of the starting amplitude is left after 20 cycles?'
  choices: ['0%', '64%', '5%', '36%']
  answer: 3
  explanation: |-
    The amplitude is multiplied by 0.95 each cycle: $0.95^{20} = 0.36$, so about 36%. Subtracting $20 \times 5\%$ gives 0%, but the losses compound; 64% is the fraction lost, not the fraction left.
- id: phys-m6-r2-h03
  lesson: phys-m6-h-damped-driven
  type: text
  topic: Damped oscillations
  stem: 'A 4.0 kg mass hangs on a spring with $k = 100$ N/m. The damping constant that makes it critically damped is ___ kg/s. Give only the number.'
  accept: ['40']
  explanation: |-
    $b_c = 2\sqrt{mk} = 2\sqrt{4.0 \times 100} = 2(20) = 40$ kg/s. (Check: $2m\omega_0 = 2(4.0)(5.0) = 40$.)
- id: phys-m6-r2-h04
  lesson: phys-m6-h-damped-driven
  topic: Damped oscillations
  stem: 'Which statements about a lightly damped oscillator (damping force $-bv$) are true? Select all that apply.'
  choices:
    - 'Its amplitude decreases by the same fraction each cycle.'
    - 'Its frequency is almost the same as without damping.'
    - 'Its amplitude decreases by the same amount each cycle.'
    - 'Its energy decays faster than its amplitude.'
    - 'Its period grows steadily as the amplitude shrinks.'
  answer: [0, 1, 3]
  explanation: |-
    The amplitude goes as $e^{-bt/(2m)}$: the same fraction each cycle, not the same amount. Energy goes as amplitude squared, $e^{-bt/m}$, so it decays twice as fast. $\omega_d = \sqrt{\omega_0^2 - (b/2m)^2}$ is almost $\omega_0$ for light damping and doesn't change as the amplitude shrinks.
- id: phys-m6-r2-h05
  lesson: phys-m6-h-damped-driven
  type: match
  topic: Damped oscillations
  stem: 'Match each amount of damping to how the system behaves after being displaced and released.'
  pairs:
    - ['$b < 2\sqrt{mk}$', Oscillates with shrinking amplitude]
    - ['$b = 2\sqrt{mk}$', Returns fastest without overshooting]
    - ['$b > 2\sqrt{mk}$', Creeps back slowly without overshooting]
  distractors: [Oscillates with constant amplitude]
  explanation: |-
    $2\sqrt{mk}$ is the critical damping constant. Below it the system is underdamped and oscillates; at it the return is fastest with no overshoot; above it (overdamped) the large drag slows the return. Constant amplitude needs no damping at all.
- id: phys-m6-r2-h06
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'An oscillator with $Q = 50$ stretches 2.0 mm under a steady force $F_0$. About what steady-state amplitude does it reach when driven at its natural frequency by a force of amplitude $F_0$?'
  choices: ['100 mm', '2.0 mm', '25 mm', '0.040 mm']
  answer: 0
  explanation: |-
    At resonance $A = QF_0/k = 50 \times 2.0$ mm $= 100$ mm. 2.0 mm is the static response (slow driving); 25 mm divides $Q$ by 2; 0.040 mm divides by $Q$ instead of multiplying.
- id: phys-m6-r2-h07
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'A mass on a spring with natural frequency 4.0 Hz is driven by a force at 2.5 Hz. Once the start-up motion has died away, it oscillates at'
  choices: ['4.0 Hz', '2.5 Hz', '6.5 Hz', '1.5 Hz']
  answer: 1
  explanation: |-
    In steady state a driven oscillator moves at the driving frequency. The natural frequency only sets how large the response is. 6.5 and 1.5 Hz are the sum and difference, which are not motions of the mass.
- id: phys-m6-r2-h08
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'An oscillator with $\omega_0 = 1000$ rad/s and $Q = 200$ is driven at various frequencies. About how wide is the band of driving frequencies over which it responds strongly?'
  choices: ['200 rad/s', '0.2 rad/s', '5 rad/s', '1000 rad/s']
  answer: 2
  explanation: |-
    $\Delta\omega \approx \omega_0/Q = 1000/200 = 5$ rad/s: a sharp, selective resonance. 200 rad/s is $Q$ itself and 0.2 rad/s is $Q/\omega_0$.
- id: phys-m6-r2-h09
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'An oscillator is driven exactly at its natural frequency. In steady state, how is its motion timed relative to the driving force?'
  choices: ['The displacement is in step with the force.', 'The displacement is half a cycle behind the force.', 'The displacement lags a quarter cycle, so the velocity is in step with the force.', 'The velocity is half a cycle behind the force.']
  answer: 2
  explanation: |-
    At resonance the displacement lags by $90^\circ$, which puts the velocity in step with the force, so the force does positive work throughout the cycle. In step is the slow-driving limit; half a cycle behind is the fast-driving limit.
- id: phys-m6-r2-h10
  lesson: phys-m6-h-damped-driven
  type: order
  topic: Driven oscillations
  stem: 'An oscillator has $\omega_0 = 10$ rad/s and $Q = 20$. Put these driving frequencies in order of steady-state amplitude, largest first.'
  items:
    - '$\omega = 10$ rad/s'
    - '$\omega = 9$ rad/s'
    - '$\omega = 11$ rad/s'
    - '$\omega = 5$ rad/s'
    - '$\omega = 20$ rad/s'
  explanation: |-
    In units of $F_0/k$ the amplitude is $1/\sqrt{(1 - r^2)^2 + (r/Q)^2}$ with $r = \omega/\omega_0$: 20 at $r = 1$, 5.1 at $r = 0.9$, 4.6 at $r = 1.1$, 1.33 at $r = 0.5$ and 0.33 at $r = 2$. The peak leans slightly toward low frequencies, which approach the static response $F_0/k$, while high frequencies fall toward zero.
- id: phys-m6-r2-h11
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'Why did London''s Millennium Bridge sway sideways when it opened in 2000?'
  choices: ['Walkers adjusted their steps to the sway and ended up pushing in step with it.', 'The wind gusted at exactly the bridge''s natural frequency.', 'Soldiers marched across it in step.', 'An earthquake shook its supports at resonance.']
  answer: 0
  explanation: |-
    It was a feedback loop: a small sway made walkers adjust their gait for balance, and their sideways pushes fell into step with the sway, feeding it more energy. Dampers fixed it, and the bridge reopened in 2002.
- id: phys-m6-r2-h12
  lesson: phys-m6-h-damped-driven
  topic: Driven oscillations
  stem: 'Which statement best describes how engineers explain the 1940 collapse of the Tacoma Narrows Bridge?'
  choices: ['The wind gusted at exactly the bridge''s natural frequency.', 'Traffic crossing in step drove it at resonance.', 'Steel fatigue from years of small earthquakes.', 'Flutter: the twisting changed the wind forces so that they fed energy into the twisting.']
  answer: 3
  explanation: |-
    A steady wind doesn't push at a fixed frequency, so "wind matching the natural frequency" is a simplification. The accepted explanation is aeroelastic flutter, a self-excited oscillation in which the structure's own motion controls the forces that drive it.
- id: phys-m6-r2-h13
  lesson: phys-m6-h-damped-driven
  type: text
  topic: Damped oscillations
  stem: 'A lightly damped oscillator loses 0.50% of its stored energy each cycle. Using $Q \approx 2\pi / (\text{fraction lost per cycle})$, its $Q$ is about ___ . Give the number to 2 significant figures.'
  accept: ['1300', '1260', '1257', '1256.6', '1256.64']
  explanation: |-
    $Q \approx 2\pi/0.0050 = 1257 \approx 1300$. (A tuning fork is in this range.)
- id: phys-m6-r2-h14
  lesson: phys-m6-h-damped-driven
  topic: Damped oscillations
  stem: 'A 1.0 kg oscillator has damping constant $b = 0.20$ kg/s. How long does its amplitude take to fall to half?'
  choices: ['3.5 s', '10 s', '6.9 s', '14 s']
  answer: 2
  explanation: |-
    $t_{1/2} = 2m\ln 2/b = 2(1.0)(0.693)/0.20 = 6.9$ s. 3.5 s ($m\ln 2/b$) is when the energy halves; 10 s is $2m/b$, forgetting the $\ln 2$; 14 s doubles the answer.

# Honors: Harmonics, timbre, and musical scales
- id: phys-m6-r2-h15
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'A sound contains components at 300, 500 and 700 Hz only. What pitch do most listeners hear?'
  choices: ['300 Hz', '100 Hz', '500 Hz', '200 Hz']
  answer: 1
  explanation: |-
    All three are multiples of 100 Hz (the 3rd, 5th and 7th harmonics), so the wave repeats 100 times a second and that's the pitch: the missing fundamental. 200 Hz is the spacing between components, but 300 Hz isn't a multiple of 200 Hz.
- id: phys-m6-r2-h16
  lesson: phys-m6-h-harmonics-music
  topic: Fourier analysis
  stem: 'Which harmonics does a square wave contain?'
  choices: ['Odd harmonics only, amplitudes falling as $1/n$', 'Even harmonics only, amplitudes falling as $1/n$', 'All harmonics, with equal amplitudes', 'Only the fundamental']
  answer: 0
  explanation: |-
    Square wave $= \tfrac4\pi[\sin(\omega t) + \tfrac13\sin(3\omega t) + \tfrac15\sin(5\omega t) + \cdots]$: odd harmonics with amplitudes $1/n$. A sawtooth has all harmonics with amplitudes $1/n$.
- id: phys-m6-r2-h17
  lesson: phys-m6-h-harmonics-music
  type: text
  topic: Musical acoustics
  stem: 'In equal temperament, the note 12 semitones above 220 Hz has frequency ___ Hz. Give only the number.'
  accept: ['440']
  explanation: |-
    12 semitones is an octave: $220 \times 2^{12/12} = 440$ Hz.
- id: phys-m6-r2-h18
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'With A4 = 440 Hz, what is the equal-tempered frequency of the note 9 semitones below A4 (middle C)?'
  choices: ['293.7 Hz', '246.9 Hz', '110 Hz', '261.6 Hz']
  answer: 3
  explanation: |-
    $f = 440 \cdot 2^{-9/12} = 440(0.5946) = 261.6$ Hz. 293.7 Hz is 7 semitones down and 246.9 Hz is 10 down; 110 Hz subtracts $\tfrac{9}{12}$ of 440 Hz, treating semitones as equal steps in hertz instead of equal ratios.
- id: phys-m6-r2-h19
  lesson: phys-m6-h-harmonics-music
  type: text
  topic: Musical acoustics
  stem: 'The interval from 300 Hz to 600 Hz is ___ cents. Give only the number.'
  accept: ['1200']
  explanation: |-
    cents $= 1200\log_2(600/300) = 1200\log_2 2 = 1200$: every octave is 1200 cents.
- id: phys-m6-r2-h20
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'An ideal string is plucked exactly at its midpoint. Which of these harmonics are present in its sound? Select all that apply.'
  choices: ['1st', '2nd', '3rd', '4th', '5th']
  answer: [0, 2, 4]
  explanation: |-
    The even harmonics all have a node at the midpoint, so plucking there doesn't excite them. The odd harmonics have an antinode there and are present.
- id: phys-m6-r2-h21
  lesson: phys-m6-h-harmonics-music
  type: match
  topic: Musical acoustics
  stem: 'Match each musical interval to its pure frequency ratio.'
  pairs:
    - [Octave, '2:1']
    - [Perfect fifth, '3:2']
    - [Perfect fourth, '4:3']
    - [Major third, '5:4']
  distractors: ['6:5']
  explanation: |-
    From 220 Hz: octave 440, fifth 330, fourth 293.3, major third 275 Hz. (6:5 is a minor third.)
- id: phys-m6-r2-h22
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'A 200 Hz note is played with a note of 301 Hz, meant as a pure fifth. At what rate do the nearly coinciding harmonics beat?'
  choices: ['1 Hz', '2 Hz', '3 Hz', '101 Hz']
  answer: 1
  explanation: |-
    The lower note's 3rd harmonic is 600 Hz and the upper note's 2nd is 602 Hz, so they beat at 2 Hz. The 1 Hz mistuning is doubled in the 2nd harmonic. 101 Hz is just the difference of the two notes, which is not heard as a beat.
- id: phys-m6-r2-h23
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'How does an equal-tempered perfect fifth compare with a pure 3:2 fifth?'
  choices: ['It is about 2 cents narrower.', 'It is exactly the same.', 'It is about 14 cents wider.', 'It is a whole semitone narrower.']
  answer: 0
  explanation: |-
    Tempered fifth: 7 semitones = 700 cents. Pure fifth: $1200\log_2 1.5 = 702.0$ cents. The 14-cent difference belongs to the major third (400 vs 386.3 cents).
- id: phys-m6-r2-h24
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'A flute and a violin play the same note at the same loudness, yet they sound different. The main physical reason is that they differ in'
  choices: ['their fundamental frequencies', 'the relative strengths of their harmonics', 'the speed of sound they produce', 'their wavelengths in air']
  answer: 1
  explanation: |-
    Same note means same fundamental, and therefore the same wavelength and speed in air. Timbre comes mainly from the spectrum, plus how each sound starts and decays.
- id: phys-m6-r2-h25
  lesson: phys-m6-h-harmonics-music
  type: order
  topic: Musical acoustics
  stem: 'Put these intervals in order of frequency ratio, smallest first.'
  items: [Equal-tempered semitone, Major third, Perfect fourth, Perfect fifth, Octave]
  explanation: |-
    Ratios: semitone $2^{1/12} \approx 1.06$, major third 1.25, fourth 1.33, fifth 1.5, octave 2.
- id: phys-m6-r2-h26
  lesson: phys-m6-h-harmonics-music
  topic: Musical acoustics
  stem: 'Why can''t a 12-note keyboard have every fifth tuned to a pure 3:2?'
  choices: ['Pure fifths would make every octave pure as well.', 'Pure fifths cannot be produced by strings.', 'Twelve pure fifths overshoot seven octaves by about 1.4%.', 'The ear cannot hear a pure fifth.']
  answer: 2
  explanation: |-
    Going up 12 fifths should land 7 octaves up, but $(3/2)^{12} = 129.7$ while $2^7 = 128$, a mismatch of about 1.4% (the Pythagorean comma). Equal temperament narrows each fifth by 2 cents to close the gap.
- id: phys-m6-r2-h27
  lesson: phys-m6-h-harmonics-music
  type: text
  topic: Fourier analysis
  stem: 'A periodic sound contains components at 240, 400 and 560 Hz. It repeats ___ times per second, which is the pitch heard. Give only the number.'
  accept: ['80']
  explanation: |-
    The largest frequency that divides all three is 80 Hz: $240 = 3(80)$, $400 = 5(80)$, $560 = 7(80)$. So these are the 3rd, 5th and 7th harmonics of 80 Hz.

# Honors: Wave reflection, impedance, and ultrasound imaging
- id: phys-m6-r2-h28
  lesson: phys-m6-h-impedance-ultrasound
  topic: Wave reflection
  stem: 'A material has density 1200 kg/m³ and sound speed 1500 m/s. What is its acoustic impedance?'
  choices: ['$0.80$ kg/(m²·s)', '$1.25$ kg/(m²·s)', '$2700$ kg/(m²·s)', '$1.8\times10^6$ kg/(m²·s)']
  answer: 3
  explanation: |-
    $Z = \rho v = 1200 \times 1500 = 1.8\times10^6$ kg/(m²·s). 0.80 and 1.25 divide instead of multiplying; 2700 adds.
- id: phys-m6-r2-h29
  lesson: phys-m6-h-impedance-ultrasound
  topic: Wave reflection
  stem: 'Sound hits a boundary straight on where $Z_2 = 3Z_1$. What fraction of the intensity is reflected?'
  choices: ['25%', '50%', '75%', '6.25%']
  answer: 0
  explanation: |-
    $R = \left(\dfrac{3 - 1}{3 + 1}\right)^2 = (0.5)^2 = 25\%$. 50% is the amplitude ratio without squaring; 75% is the transmitted fraction; 6.25% squares twice.
- id: phys-m6-r2-h30
  lesson: phys-m6-h-impedance-ultrasound
  type: text
  topic: Ultrasound imaging
  stem: 'An ultrasound echo returns 130 μs after the pulse was sent. Using $v = 1540$ m/s, the boundary is ___ cm deep. Give only the number, to the nearest centimeter.'
  accept: ['10']
  explanation: |-
    $d = vt/2 = 1540 \times 130\times10^{-6}/2 = 0.100$ m $= 10$ cm. Forgetting to halve the round trip gives 20 cm.
- id: phys-m6-r2-h31
  lesson: phys-m6-h-impedance-ultrasound
  topic: Wave reflection
  stem: 'Which statements about the fraction of a wave''s intensity reflected straight on at a boundary are true? Select all that apply.'
  choices:
    - 'It is zero when the two impedances are equal.'
    - 'It is the same whichever side the wave comes from.'
    - 'It depends only on the two densities.'
    - 'It is close to 100% at a tissue–air boundary.'
    - 'It is largest when the two impedances are nearly equal.'
  answer: [0, 1, 3]
  explanation: |-
    $R = \left(\dfrac{Z_2 - Z_1}{Z_2 + Z_1}\right)^2$ is zero for $Z_1 = Z_2$, unchanged if $Z_1$ and $Z_2$ swap, and about 0.999 for tissue and air. It depends on $Z = \rho v$, not density alone, and it is smallest, not largest, for nearly equal impedances.
- id: phys-m6-r2-h32
  lesson: phys-m6-h-impedance-ultrasound
  type: match
  topic: Ultrasound imaging
  stem: 'Match each boundary to the approximate fraction of ultrasound intensity it reflects.'
  pairs:
    - [Fat to muscle, About 1%]
    - [Muscle to bone, About 40%]
    - [Soft tissue to air, Nearly 100%]
    - [Water-like gel to soft tissue, About 0.2%]
  distractors: [About 10%]
  explanation: |-
    With $Z$ in units of $10^6$ kg/(m²·s): fat–muscle $\left(\tfrac{1.69 - 1.38}{3.07}\right)^2 = 0.010$; muscle–bone $\left(\tfrac{7.8 - 1.69}{9.49}\right)^2 = 0.41$; tissue–air 0.999; gel (1.48) to tissue (1.63) 0.002.
- id: phys-m6-r2-h33
  lesson: phys-m6-h-impedance-ultrasound
  type: label
  topic: Ultrasound imaging
  stem: 'This cross-section shows an ultrasound probe on the body, with a pulse going down and two echoes coming back (a thin one and a thick one). Name the numbered parts.'
  image: {src: images/phys-m6-ultrasound-layers-blank.svg, alt: 'A probe sits on a thin layer above three horizontal bands of tissue. A downward arrow passes through the top two bands; a thin upward arrow returns from the boundary between the first two bands and a thick upward arrow from the boundary between the second and third bands. Five parts are numbered.'}
  labels:
    - {x: 25.7, y: 14.4, text: Transducer}
    - {x: 14.3, y: 24.0, text: Coupling gel}
    - {x: 60, y: 35.6, text: Fat}
    - {x: 60, y: 57.7, text: Muscle}
    - {x: 60, y: 84.6, text: Bone}
  distractors: [Air gap, Blood vessel]
  explanation: |-
    The transducer (1) sends the pulse and hears the echoes; the gel (2) keeps air out. The fat–muscle boundary (between 3 and 4) gives a weak echo of about 1%, and the muscle–bone boundary (between 4 and 5) a strong one of about 40%, which is why the deepest band is bone. An air gap would reflect nearly everything at the surface.
- id: phys-m6-r2-h34
  lesson: phys-m6-h-impedance-ultrasound
  type: order
  topic: Ultrasound imaging
  stem: 'Put these steps in making one line of an ultrasound image in order.'
  items:
    - The transducer sends a short pulse into the body
    - The pulse reaches a boundary between two tissues
    - Part of the pulse reflects as an echo
    - The echo returns and the transducer turns it into an electrical signal
    - The scanner converts the delay to depth and the strength to brightness
  explanation: |-
    Pulse out, reflection at a boundary, echo back, then the scanner uses $d = vt/2$ for depth and the echo's strength for brightness. Sweeping the beam sideways repeats this line by line.
- id: phys-m6-r2-h35
  lesson: phys-m6-h-impedance-ultrasound
  topic: Wave reflection
  stem: 'A pulse on a light rope reaches a knot joining it to a heavier rope under the same tension. The reflected pulse is'
  choices: ['upright and larger than the incoming pulse', 'inverted and smaller than the incoming pulse', 'upright and smaller than the incoming pulse', 'absent: all of it passes into the heavy rope']
  answer: 1
  explanation: |-
    The heavy rope has higher impedance ($Z = \sqrt{F_T\mu}$), so the amplitude ratio $(Z_1 - Z_2)/(Z_1 + Z_2)$ is negative with magnitude less than 1: inverted and smaller, partway toward the fixed-end case. An upright reflection happens going from heavy to light.
- id: phys-m6-r2-h36
  lesson: phys-m6-h-impedance-ultrasound
  topic: Ultrasound imaging
  stem: 'A 4.0 MHz ultrasound beam points straight along an artery in which blood moves toward the probe at 0.60 m/s. About what Doppler shift is measured? (Sound speed in tissue 1540 m/s.)'
  choices: ['1.6 kHz', '14 kHz', '3.1 kHz', '0.31 kHz']
  answer: 2
  explanation: |-
    $\Delta f = 2fu/v = 2(4.0\times10^6)(0.60)/1540 = 3.1\times10^3$ Hz. 1.6 kHz leaves out the factor 2 (the shift happens twice); 14 kHz uses the speed of sound in air; 0.31 kHz is a power-of-ten slip.
- id: phys-m6-r2-h37
  lesson: phys-m6-h-impedance-ultrasound
  topic: Ultrasound imaging
  stem: 'Why are deep organs scanned at lower ultrasound frequencies than shallow tendons?'
  choices: ['Low frequencies give finer detail.', 'Low frequencies reflect more strongly at boundaries.', 'Low frequencies travel faster in tissue.', 'Low frequencies are absorbed less, so echoes from deep tissue are still strong enough.']
  answer: 3
  explanation: |-
    Absorption rises roughly in proportion to frequency (about 0.5 dB per cm per MHz in soft tissue), so high frequencies die out before reaching deep organs. Low frequencies give coarser detail, not finer; the speed and the reflected fraction don't depend much on frequency.
- id: phys-m6-r2-h38
  lesson: phys-m6-h-impedance-ultrasound
  type: text
  topic: Ultrasound imaging
  stem: 'The wavelength of 7.7 MHz ultrasound in soft tissue ($v = 1540$ m/s) is ___ mm. Give only the number.'
  accept: ['0.2', '0.20']
  explanation: |-
    $\lambda = v/f = 1540/(7.7\times10^6) = 2.0\times10^{-4}$ m $= 0.20$ mm, which sets the scale of the finest detail.
- id: phys-m6-r2-h39
  lesson: phys-m6-h-impedance-ultrasound
  topic: Ultrasound imaging
  stem: 'A Doppler ultrasound beam is held exactly perpendicular to a blood vessel. What Doppler shift does it measure?'
  choices: ['None, because $\cos 90^\circ = 0$', 'Twice the usual shift', 'The usual shift, since angle doesn''t matter', 'A shift that depends only on the beam frequency']
  answer: 0
  explanation: |-
    $\Delta f \approx 2fu\cos\theta/v$, and the blood has no velocity component along a perpendicular beam. Operators tilt the probe along the vessel to get a signal.
- id: phys-m6-r2-h40
  lesson: phys-m6-h-impedance-ultrasound
  topic: Wave reflection
  stem: 'Two materials have different densities and different sound speeds, but the same product $\rho v$. Sound crossing straight from one into the other'
  choices: ['reflects completely', 'reflects about half its intensity', 'reflects an amount set by the density ratio', 'passes through with no reflection']
  answer: 3
  explanation: |-
    Reflection depends only on the impedances $Z = \rho v$. Equal impedances give $R = 0$, even though the wave's speed and wavelength change at the boundary.
