# Round 2, module phys-m12 (Modern physics): new question types for the core lessons
# (q01–q20) and the two honors lessons (h01–h14 spacetime, h15–h28 nuclear energy).

# ---- Core: phys-relativity
- id: phys-m12-r2-q01
  lesson: phys-relativity
  type: label
  module_quiz: true
  topic: Special relativity
  stem: 'The picture shows a light clock at rest (left) and the same clock moving to the right (right). Name the numbered parts.'
  image: {src: images/phys-m12-light-clock-blank.svg, alt: 'Left: two horizontal mirrors one above the other with a pulse arrow going straight up and another straight down between them, and a double arrow (5) beside them spanning the gap. Marker 1 is on the top mirror and marker 2 on the vertical arrows. Right: the same pair of mirrors drawn at three positions moving right; a diagonal arrow (3) goes from the first bottom mirror up to the middle top mirror and another goes down to the last bottom mirror. A double arrow (4) along the bottom spans the sideways distance from the first position to the middle one.'}
  labels:
    - {x: 15.7, y: 21.2, text: A mirror}
    - {x: 18.9, y: 51.5, text: Light path in the clock's own frame}
    - {x: 56.4, y: 48.5, text: Light path seen by an observer the clock passes}
    - {x: 56.4, y: 88.5, text: Distance the clock moves in half a tick}
    - {x: 8.6, y: 60.6, text: Mirror separation D}
  distractors: [Proper length of the spaceship, Distance light travels in a full tick]
  explanation: |-
    In its own frame (left) the pulse (2) goes straight between the mirrors (1), a distance $D$ (5) apart, so a tick takes $2D/c$. An observer the clock passes sees the pulse follow the diagonal (3) while the clock moves sideways (4). The diagonal is longer than $D$, and light still moves at $c$, so the moving clock's tick takes longer: $\Delta t = \gamma\,\Delta t_0$.
- id: phys-m12-r2-q02
  lesson: phys-relativity
  type: text
  topic: Special relativity
  stem: 'A spaceship moves at $0.60c$ relative to Earth. Its Lorentz factor is $\gamma =$ ___. Give only the number.'
  accept: ['1.25', '5/4']
  explanation: |-
    $\gamma = \dfrac{1}{\sqrt{1 - 0.60^2}} = \dfrac{1}{\sqrt{0.64}} = \dfrac{1}{0.80} = 1.25$. So a 1.00 s tick of the ship's clock lasts 1.25 s by Earth clocks, and the ship is shortened to $1/1.25 = 80\%$ of its proper length.
- id: phys-m12-r2-q03
  lesson: phys-relativity
  type: match
  module_quiz: true
  topic: Special relativity
  stem: 'Match each formula to what it describes.'
  pairs:
    - ['$\Delta t = \gamma\,\Delta t_0$', Time dilation]
    - ['$L = L_0/\gamma$', Length contraction]
    - ['$u = \dfrac{u'' + v}{1 + u''v/c^2}$', Relativistic velocity addition]
    - ['$K = (\gamma - 1)mc^2$', Relativistic kinetic energy]
    - ['$E^2 = (pc)^2 + (mc^2)^2$', Energy–momentum relation]
  distractors: [Classical kinetic energy]
  explanation: |-
    Moving clocks run slow ($\Delta t = \gamma\Delta t_0$) and moving lengths shrink ($L = L_0/\gamma$). Velocities combine with the denominator $1 + u'v/c^2$, which keeps every result below $c$. Kinetic energy is total energy minus rest energy, $(\gamma - 1)mc^2$, and $E^2 = (pc)^2 + (mc^2)^2$ links energy, momentum and mass. Classical kinetic energy, $\tfrac12mv^2$, is none of these; it is the low-speed limit of $(\gamma - 1)mc^2$.
- id: phys-m12-r2-q04
  lesson: phys-relativity
  topic: Special relativity
  stem: 'A spaceship passes Earth at $0.80c$. Which statements are correct? Select all that apply.'
  choices:
    - Earth observers measure the ship's clocks running slow
    - Astronauts on the ship measure Earth's clocks running slow
    - The astronauts notice their own clocks ticking slowly
    - Earth observers measure the ship as shorter along its direction of motion
    - Earth observers measure the ship as narrower across its direction of motion
  answer: [0, 1, 3]
  explanation: |-
    The effects are symmetric: each frame measures the other's clocks running slow, because by the first postulate neither frame is special. Nobody notices anything odd about their own clocks; in the ship's own frame its clocks tick normally. Length contraction happens only along the direction of motion, so the ship is shorter but not narrower.
- id: phys-m12-r2-q05
  lesson: phys-relativity
  type: text
  topic: Special relativity
  stem: 'A ship moving at $0.60c$ relative to Earth fires a probe forward at $0.60c$ relative to the ship. The probe''s speed relative to Earth is ___ $c$. Give the number to 3 significant figures.'
  accept: ['0.882', '15/17', '0.8824']
  explanation: |-
    $u = \dfrac{u' + v}{1 + u'v/c^2} = \dfrac{0.60c + 0.60c}{1 + 0.36} = \dfrac{1.20c}{1.36} = 0.882c$. Adding classically would give $1.20c$, faster than light, which is impossible.

# ---- Core: phys-quantum
- id: phys-m12-r2-q06
  lesson: phys-quantum
  type: label
  module_quiz: true
  topic: Atomic structure
  stem: 'The diagram shows energy levels of hydrogen (spacing not to scale) with downward transitions. Name the numbered features.'
  image: {src: images/phys-m12-hydrogen-levels-blank.svg, alt: 'Horizontal energy levels at −13.60 eV (marker 1, the lowest), −3.40 eV, −1.51 eV and −0.85 eV, and a dashed line at 0 eV (marker 2, the top). Three downward arrows end on the −13.60 eV level (marker 3), two end on the −3.40 eV level (marker 4), and one short arrow goes from −0.85 eV to −1.51 eV (marker 5).'}
  labels:
    - {x: 62.5, y: 90.5, text: Ground state (n = 1)}
    - {x: 65.6, y: 11.9, text: Ionization limit (n = infinity)}
    - {x: 33.6, y: 71.4, text: Lyman series (ultraviolet)}
    - {x: 53.4, y: 47.6, text: Balmer series (visible)}
    - {x: 70.3, y: 31.0, text: Paschen series (infrared)}
  distractors: [Metastable state, Work function]
  explanation: |-
    The lowest level, $-13.6$ eV, is the ground state (1); at 0 eV (2) the electron is free, so 13.6 eV ionizes the atom. Each series is named for the level it ends on: Lyman at $n = 1$ (3, the biggest drops, ultraviolet), Balmer at $n = 2$ (4, visible), Paschen at $n = 3$ (5, small drops, infrared).
- id: phys-m12-r2-q07
  lesson: phys-quantum
  type: order
  topic: Atomic structure
  stem: 'Put these hydrogen transitions in order of the emitted photon''s wavelength, from longest to shortest.'
  items: ['$n = 4 \to 3$', '$n = 3 \to 2$', '$n = 4 \to 2$', '$n = 2 \to 1$', '$n = 4 \to 1$']
  explanation: |-
    Wavelength is longest for the smallest energy drop. With $E_n = -13.6/n^2$ eV the drops are: $4\to3$: 0.66 eV (1880 nm, infrared); $3\to2$: 1.89 eV (656 nm); $4\to2$: 2.55 eV (486 nm); $2\to1$: 10.2 eV (122 nm); $4\to1$: 12.75 eV (97 nm).
- id: phys-m12-r2-q08
  lesson: phys-quantum
  module_quiz: true
  topic: Photons
  stem: 'Which photoelectric observations could the wave theory of light NOT explain? Select all that apply.'
  choices:
    - Below a threshold frequency no electrons come out, however bright the light
    - Electrons come out at once, even in very dim light
    - Light reflects off the polished metal surface
    - The electrons' maximum kinetic energy depends on frequency, not brightness
  answer: [0, 1, 3]
  explanation: |-
    A wave spreads its energy smoothly, so bright enough light of any color should eventually free electrons, dim light should need time to build up energy, and brighter light should give faster electrons. All three predictions fail; one photon giving all its energy $hf$ to one electron explains each of them. Reflection is ordinary wave behavior and no puzzle at all.
- id: phys-m12-r2-q09
  lesson: phys-quantum
  type: text
  topic: Photons
  stem: 'A photon of wavelength 310 nm has energy ___ eV. Use $hc = 1240$ eV·nm and give only the number.'
  accept: ['4', '4.0']
  explanation: |-
    $E = \dfrac{hc}{\lambda} = \dfrac{1240\text{ eV·nm}}{310\text{ nm}} = 4.0$ eV, an ultraviolet photon.
- id: phys-m12-r2-q10
  lesson: phys-quantum
  type: match
  topic: Wave–particle duality
  stem: 'Match each experiment or observation to what it showed.'
  pairs:
    - [Photoelectric effect, 'Light''s energy arrives in packets of hf']
    - [Compton scattering, Photons carry momentum in collisions]
    - [Davisson–Germer experiment, Electrons diffract like waves]
    - [Hydrogen line spectrum, Atoms have discrete energy levels]
    - [Blackbody spectrum, Energy is exchanged in quanta (Planck)]
  distractors: [Light has the same speed for all observers]
  explanation: |-
    The photoelectric effect showed light's energy comes in photons of $hf$; Compton's X-ray shift showed photons carry momentum $h/\lambda$; electron diffraction from crystals (Davisson and Germer, 1927) confirmed de Broglie's matter waves; sharp spectral lines reveal discrete levels; and Planck's quantum assumption fixed the blackbody curve. The constancy of light's speed is a postulate of relativity, not one of these quantum results.

# ---- Core: phys-atomic
- id: phys-m12-r2-q11
  lesson: phys-atomic
  type: label
  module_quiz: true
  topic: X-rays and lasers
  stem: 'Name the numbered parts of this X-ray tube.'
  image: {src: images/phys-m12-xray-tube-blank.svg, alt: 'A long rounded glass tube. At the left end, a zigzag wire (1) is connected by leads to an external circuit. A dashed arrow of dots (2) runs right to an angled metal block (3) at the right end. Two wavy arrows (4) leave the block downward through the tube wall. Above the tube, a battery symbol (5) with minus on the left and plus on the right connects the zigzag wire to the metal block.'}
  labels:
    - {x: 24.7, y: 45.8, text: Heated filament (cathode)}
    - {x: 39.7, y: 47.8, text: Beam of electrons}
    - {x: 62.5, y: 47.8, text: Metal target (anode)}
    - {x: 59.9, y: 75.0, text: X-rays}
    - {x: 56.6, y: 16.7, text: High-voltage supply}
  distractors: [Control rod, Laser mirror]
  explanation: |-
    The hot filament (1) releases electrons, which the high voltage (5), often tens of kilovolts, accelerates across the tube (2) to the positive target (3). There each electron's kinetic energy $eV$ turns partly into X-rays (4): bremsstrahlung up to $hf_{\max} = eV$ plus the target's characteristic lines.
- id: phys-m12-r2-q12
  lesson: phys-atomic
  type: order
  topic: Multielectron atoms
  stem: 'Put these subshells in the order in which they fill as atoms get more electrons.'
  items: [3s, 3p, 4s, 3d, 4p]
  explanation: |-
    The filling order is 1s, 2s, 2p, 3s, 3p, 4s, 3d, 4p, … The 4s subshell fills before 3d because its electrons spend time close to the nucleus, where they are less screened, and so are more tightly bound. That is why the third row of the periodic table stops at argon and the 3d elements (scandium to zinc) appear in the fourth row.
- id: phys-m12-r2-q13
  lesson: phys-atomic
  type: text
  topic: Multielectron atoms
  stem: 'The $n = 4$ shell can hold at most ___ electrons. Give only the number.'
  accept: ['32']
  explanation: |-
    $l$ runs from 0 to 3 (4s, 4p, 4d, 4f), with $2l + 1 = 1, 3, 5, 7$ orbitals: 16 orbitals. Two spin states each give 32 electrons, matching $2n^2 = 2(16) = 32$.
- id: phys-m12-r2-q14
  lesson: phys-atomic
  module_quiz: true
  topic: X-rays and lasers
  stem: 'Which are properties of laser light? Select all that apply.'
  choices:
    - Monochromatic (one sharp wavelength)
    - Coherent (the waves are in step)
    - Tightly directional
    - Produced mainly by spontaneous emission
    - Spread evenly in all directions
  answer: [0, 1, 2]
  explanation: |-
    Stimulated emission makes each new photon a copy of the one that triggered it (same energy, direction and phase), so laser light is monochromatic, coherent and directional. Spontaneous emission, with random directions and phases, is how ordinary lamps glow and why their light spreads in all directions.
- id: phys-m12-r2-q15
  lesson: phys-atomic
  type: match
  topic: Multielectron atoms
  stem: 'Match each quantum number to what it describes.'
  pairs:
    - ['$n$', Size of the orbital and most of its energy]
    - ['$l$', 'Shape of the orbital (s, p, d, f)']
    - ['$m_l$', Orientation of the orbital]
    - ['$m_s$', Spin up or spin down]
  distractors: [Number of protons in the nucleus]
  explanation: |-
    The principal number $n$ sets the shell (size, and mostly energy); $l$ from 0 to $n - 1$ sets the subshell shape; $m_l$ from $-l$ to $l$ sets the orientation; $m_s = \pm\tfrac12$ is the spin. The number of protons is the atomic number $Z$, a property of the nucleus, not a quantum number of an electron.

# ---- Core: phys-nuclear
- id: phys-m12-r2-q16
  lesson: phys-nuclear
  type: label
  module_quiz: true
  topic: Radioactive decay
  stem: 'A source emits three kinds of radiation toward three absorbers. Name the numbered beams and absorbers.'
  image: {src: images/phys-m12-penetration-blank.svg, alt: 'A source on the left emits three beams to the right. Beam 1 (top) stops at a thin white sheet (4). Beam 2 (middle) passes the white sheet and stops at a thicker gray sheet (5). Beam 3 (bottom) passes both sheets and reaches a thick dark block (6), with only a faint dashed continuation beyond it.'}
  labels:
    - {x: 23.5, y: 32.4, text: Alpha particles}
    - {x: 23.5, y: 50.0, text: Beta particles}
    - {x: 23.5, y: 67.6, text: Gamma rays}
    - {x: 34.3, y: 20.6, text: A sheet of paper}
    - {x: 54.1, y: 20.6, text: Aluminum a few millimeters thick}
    - {x: 76.8, y: 20.6, text: Lead several centimeters thick}
  distractors: [Neutrons]
  explanation: |-
    Alpha particles (1) are heavy and doubly charged, so they ionize densely and stop in a sheet of paper (4). Beta particles (2) get through paper but stop in a few millimeters of aluminum (5). Gamma rays (3) are uncharged photons; even thick lead (6) only weakens them.
- id: phys-m12-r2-q17
  lesson: phys-nuclear
  type: order
  topic: Radioactive decay
  stem: 'Put the steps of carbon-14 dating in order.'
  items:
    - 'Measure the sample''s carbon-14 activity per gram of carbon'
    - 'Divide by the activity per gram of living material to get the fraction remaining'
    - 'Set the fraction equal to $(\tfrac12)^{t/5730}$'
    - 'Solve for $t$ by taking logarithms'
  explanation: |-
    You need the measured activity before you can compare it with living material, the fraction before you can write the decay law, and the equation before you can take logs: $t = 5730\,\dfrac{\ln(\text{fraction})}{\ln 0.5}$ years.
- id: phys-m12-r2-q18
  lesson: phys-nuclear
  type: text
  topic: Radioactive decay
  stem: 'Thorium-234 ($^{234}_{90}\text{Th}$) undergoes beta-minus decay. The daughter nucleus has atomic number ___ and mass number ___.'
  accept:
    - ['91']
    - ['234']
  explanation: |-
    In beta-minus decay a neutron becomes a proton and an electron (plus an antineutrino) is emitted: $Z$ rises by 1 and $A$ is unchanged. $^{234}_{90}\text{Th} \to {}^{234}_{91}\text{Pa} + e^- + \bar\nu$ (protactinium-234).
- id: phys-m12-r2-q19
  lesson: phys-nuclear
  module_quiz: true
  topic: Nuclear structure
  stem: 'Which quantities are conserved in every nuclear reaction and decay? Select all that apply.'
  choices:
    - Total electric charge
    - Total number of nucleons (sum of the mass numbers)
    - Number of protons
    - Number of neutrons
    - Total energy, including rest energy
  answer: [0, 1, 4]
  explanation: |-
    Charge, nucleon number and total energy (with rest energy counted, $E_0 = mc^2$) always balance. Protons and neutrons can change into each other: beta-minus decay turns a neutron into a proton, and beta-plus does the reverse, so their separate numbers are not conserved.
- id: phys-m12-r2-q20
  lesson: phys-nuclear
  type: match
  topic: Radioactive decay
  stem: 'Match each type of decay to how it changes the nucleus.'
  pairs:
    - [Alpha, Z falls by 2 and A falls by 4]
    - [Beta minus, Z rises by 1 and A is unchanged]
    - [Beta plus, Z falls by 1 and A is unchanged]
    - [Gamma, Z and A are both unchanged]
  distractors: [Z rises by 2 and A rises by 4]
  explanation: |-
    An alpha particle is a helium nucleus (2 protons, 2 neutrons). Beta minus turns a neutron into a proton; beta plus turns a proton into a neutron; neither changes the nucleon count. A gamma ray is a photon, carrying away energy only. No spontaneous decay adds nucleons.

# ---- Honors: phys-m12-h-spacetime
- id: phys-m12-r2-h01
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'On a spacetime diagram with position across and time up, what does the worldline of an object at rest look like?'
  choices: ['A vertical line', 'A horizontal line', 'A line at 45°', 'A single point']
  answer: 0
  explanation: |-
    An object at rest keeps the same $x$ as time goes on, so its worldline runs straight up. A horizontal line would mean many places at one instant (a line of simultaneity), a 45° line is a light pulse (with $c = 1$ ly/yr), and a single point is one event, not a history.
- id: phys-m12-r2-h02
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Two events are 5.0 years apart in time and 3.0 light-years apart in space. How much time passes for a traveler who goes from one to the other at constant velocity?'
  choices: ['5.8 yr', '4.0 yr', '2.0 yr', '5.0 yr']
  answer: 1
  explanation: |-
    The traveler's proper time is $\Delta s/c$: $(\Delta s)^2 = 5.0^2 - 3.0^2 = 16$, so 4.0 yr. (Check: the speed is $0.60c$, $\gamma = 1.25$, and $5.0/1.25 = 4.0$.) Adding the squares gives 5.8 yr, the wrong sign; 5.0 yr is the time in the frame where the events are 3 ly apart, not the traveler's.
- id: phys-m12-r2-h03
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Event B happens 2.0 years after event A and 3.0 light-years away. How is the pair classified?'
  choices: ['Timelike', 'Lightlike', 'Spacelike', 'It depends on the observer']
  answer: 2
  explanation: |-
    $(c\Delta t)^2 - (\Delta x)^2 = 2.0^2 - 3.0^2 = -5$ (ly)², negative, so spacelike: light from A has gone only 2 ly when B happens. The classification can't depend on the observer, because every inertial observer gets the same interval.
- id: phys-m12-r2-h04
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Two events have a spacelike separation. Which statements are true? Select all that apply.'
  choices:
    - Some inertial observer measures them as simultaneous
    - Different observers can disagree about which happened first
    - One of them could have caused the other
    - All inertial observers get the same value of $(c\,\Delta t)^2 - (\Delta x)^2$
    - A clock can travel from one event to the other
  answer: [0, 1, 3]
  explanation: |-
    For a spacelike pair, $|\Delta x| > c|\Delta t|$, so reaching one from the other would need a speed above $c$: no clock can make the trip and no cause can connect them. That's why it is harmless that their order depends on the frame, and there is a frame (moving at $v = c^2\Delta t/\Delta x$) where they are simultaneous. The interval itself is the same for everyone.
- id: phys-m12-r2-h05
  lesson: phys-m12-h-spacetime
  type: text
  topic: Spacetime geometry
  stem: 'With time in years and distance in light-years, a light pulse''s worldline makes an angle of ___ degrees with the time axis. Give only the number.'
  accept: ['45', '45°', '45 degrees']
  explanation: |-
    In these units $c = 1$ ly/yr, so light moves one unit across for each unit up: a 45° line. Every material object moves slower, so its worldline is steeper (closer to the time axis) than 45°.
- id: phys-m12-r2-h06
  lesson: phys-m12-h-spacetime
  type: order
  topic: Spacetime geometry
  stem: 'Blair flies to a star 4.0 ly away at $0.80c$ and straight back, sending a light signal home on each of Blair''s birthdays. Put these events in order of Earth time.'
  items:
    - Blair leaves Earth
    - 'Alex receives the signal from Blair''s first birthday on the trip'
    - Blair turns around at the star
    - Alex first sees Blair turn around
    - Blair arrives home
  explanation: |-
    Earth times: departure 0. Blair's first birthday on the trip comes when Earth time $\gamma(1\text{ yr}) = 1.67$ yr has passed, at $x = 0.80(1.67) = 1.33$ ly, so its signal reaches Earth at $1.67 + 1.33 = 3.0$ yr. Turnaround at 5.0 yr; its light needs 4.0 yr more, arriving at 9.0 yr; Blair is home at 10.0 yr.
- id: phys-m12-r2-h07
  lesson: phys-m12-h-spacetime
  type: label
  topic: Spacetime geometry
  stem: 'This spacetime diagram shows the twin paradox trip (time in years up, distance in light-years across). Name the numbered features.'
  image: {src: images/phys-m12-twin-spacetime-blank.svg, alt: 'Axes: x from 0 to 5 light-years across, t from 0 to 10 years up. A thick vertical line along the t axis (1). A line from the origin up to the point x = 4, t = 5 (2), a dot at that point (4), and a line from there back to x = 0, t = 10 (3). A dashed arrow at 45 degrees (5) runs from the dot back to the t axis, arriving at t = 9. A faint dashed 45-degree line also runs from the origin.'}
  labels:
    - {x: 16.1, y: 66.2, text: The stay-at-home twin's worldline}
    - {x: 31.1, y: 70.2, text: The traveler's outbound leg}
    - {x: 34.8, y: 34.9, text: The traveler's return leg}
    - {x: 46.1, y: 50.0, text: The turnaround event}
    - {x: 20.6, y: 22.5, text: Light signal from the turnaround}
  distractors: [A line of simultaneity, A spacelike interval]
  explanation: |-
    The Earth twin stays at $x = 0$, so that worldline (1) is vertical and straight. The traveler goes out at $0.8c$ (2, rising 5 yr while moving 4 ly), turns around at the event (4), and returns (3). The dashed 45° line (5) is light from the turnaround reaching Earth at $t = 9$ yr. Each straight leg has $(\Delta s)^2 = 5^2 - 4^2 = 9$, so the traveler ages 3 + 3 = 6 years against Alex's 10.
- id: phys-m12-r2-h08
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Two firecrackers 1200 m apart explode simultaneously in the ground frame. A rocket moves along the line joining them at $0.80c$. By how much do the explosion times differ in the rocket''s frame? ($c = 3.00\times10^8$ m/s)'
  choices: ['3.2 μs', '4.0 μs', '1.9 μs', '5.3 μs']
  answer: 3
  explanation: |-
    $\gamma = 1/\sqrt{1 - 0.64} = 5/3$. $|\Delta t'| = \gamma\dfrac{v\,\Delta x}{c^2} = \dfrac53 \cdot \dfrac{0.80(1200)}{3.00\times10^8} = \dfrac53(3.2\times10^{-6}) = 5.3\times10^{-6}$ s. Leaving out $\gamma$ gives 3.2 μs, dividing by it gives 1.9 μs, and 4.0 μs is just the light travel time $\Delta x/c$.
- id: phys-m12-r2-h09
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'In the previous situation, which explosion happens first according to the rocket?'
  choices: ['The one farther along the rocket''s direction of motion', 'The one behind the rocket''s direction of motion', 'They are simultaneous for the rocket too', 'It depends on where the rocket is when they explode']
  answer: 0
  explanation: |-
    From $t' = \gamma(t - vx/c^2)$: for equal $t$, a larger $x$ (farther along the direction of motion) gives a smaller $t'$, so that explosion comes first. The order can differ between frames because the explosions are spacelike-separated (1200 m apart, at the same time); neither could affect the other. The rocket's position doesn't matter; only its velocity does.
- id: phys-m12-r2-h10
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'A traveler goes to a star 6.0 ly away at $0.60c$ and returns at the same speed. How much does the traveler age during the trip?'
  choices: ['20 yr', '16 yr', '25 yr', '12.8 yr']
  answer: 1
  explanation: |-
    Earth time: $2(6.0/0.60) = 20$ yr. $\gamma = 1/\sqrt{1 - 0.36} = 1.25$, so the traveler ages $20/1.25 = 16$ yr. With the interval, each leg has $\sqrt{10^2 - 6^2} = 8$ yr. Multiplying by $\gamma$ (25 yr) or dividing twice (12.8 yr) are the usual slips; 20 yr is the Earth twin's age.
- id: phys-m12-r2-h11
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Why is the twin paradox not a contradiction?'
  choices:
    - 'The traveler''s clock is damaged by the high speed'
    - 'Each twin really is younger than the other in their own frame'
    - 'The traveler changes inertial frames at the turnaround, so the twins'' worldlines are not equivalent'
    - 'Time dilation only applies to light clocks, not to living things'
  answer: 2
  explanation: |-
    The stay-at-home twin's worldline is straight (one inertial frame), and between two events the straight worldline has the longest proper time. The traveler's worldline bends, so it is shorter in proper time. Both twins agree, when they meet, which one is younger. Time dilation applies to every process, biological ones included.
- id: phys-m12-r2-h12
  lesson: phys-m12-h-spacetime
  type: text
  topic: Spacetime geometry
  stem: 'A spacecraft approaching at $0.60c$ sends one light pulse per second by its own clock. The receiver gets ___ pulses per second. Give only the number.'
  accept: ['2', '2.0']
  explanation: |-
    Approaching: $f_{\text{received}} = f_{\text{sent}}\sqrt{\dfrac{1 + \beta}{1 - \beta}} = 1\cdot\sqrt{\dfrac{1.60}{0.40}} = \sqrt4 = 2$ per second. Receding at the same speed would give $\tfrac12$ per second.
- id: phys-m12-r2-h13
  lesson: phys-m12-h-spacetime
  type: match
  topic: Spacetime geometry
  stem: 'Match each condition or quantity to its meaning.'
  pairs:
    - ['$(\Delta s)^2 > 0$', A clock can travel between the events]
    - ['$(\Delta s)^2 = 0$', Only a light pulse connects the events]
    - ['$(\Delta s)^2 < 0$', Some observer sees the events as simultaneous]
    - ['$\Delta s/c$ for a timelike pair', Time read by a clock present at both events]
  distractors: [The events happen at the same place for everyone]
  explanation: |-
    Positive means timelike (a slower-than-light trip connects the events), zero means lightlike, and negative means spacelike (no signal connects them, and some frame sees them as simultaneous). For a timelike pair, $\Delta s/c$ is the proper time of a clock that travels straight from one to the other. No interval makes two separate events happen at the same place for every observer.
- id: phys-m12-r2-h14
  lesson: phys-m12-h-spacetime
  topic: Spacetime geometry
  stem: 'Blair (out and back at $0.80c$ to a star 4.0 ly away) says Earth''s clocks ran slow during each leg, so Earth should age only $1.8 + 1.8 = 3.6$ yr. Earth actually ages 10 yr. What accounts for the difference?'
  choices:
    - 'At the turnaround, the Earth event Blair''s frame calls "now" jumps from Earth time 1.8 yr to 8.2 yr'
    - 'Blair''s clock stops during the turnaround'
    - 'Earth''s clocks speed up while Blair is far away'
    - 'The light signals take 4 years to reach Blair'
  answer: 0
  explanation: |-
    Lines of simultaneity tilt with velocity. In the outbound frame the Earth event simultaneous with the turnaround is at $t = 5 - 0.80(4) = 1.8$ yr; in the return frame it is $5 + 0.80(4) = 8.2$ yr. Switching frames skips 6.4 yr of Earth time, and $1.8 + 6.4 + 1.8 = 10$. Nothing physical happens to Earth's clocks or to Blair's.

# ---- Honors: phys-m12-h-nuclear-energy
- id: phys-m12-r2-h15
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Radium-226 (226.025410 u) alpha-decays to radon-222 (222.017578 u). With He-4 at 4.002603 u and 1 u = 931.5 MeV, what is the Q-value?'
  choices: ['$4.78$ MeV', '$4.87$ MeV', '$3730$ MeV', '$0.00523$ MeV']
  answer: 1
  explanation: |-
    $\Delta m = 226.025410 - 222.017578 - 4.002603 = 0.005229$ u, and $Q = 0.005229(931.5) = 4.87$ MeV. 4.78 MeV is the alpha's share, $4.87(222/226)$; 3730 MeV comes from forgetting to subtract the helium; 0.00523 is the mass difference in u, not converted to MeV.
- id: phys-m12-r2-h16
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Polonium-210 decays at rest by alpha emission with $Q = 5.41$ MeV. What is the alpha particle''s kinetic energy?'
  choices: ['$5.41$ MeV', '$0.10$ MeV', '$5.31$ MeV', '$5.52$ MeV']
  answer: 2
  explanation: |-
    The alpha and the lead-206 nucleus get equal and opposite momenta, so energy divides in inverse proportion to mass: $K_\alpha = Q\dfrac{A - 4}{A} = 5.41 \times \dfrac{206}{210} = 5.31$ MeV. The recoiling nucleus gets the other 0.10 MeV. Giving the alpha all of $Q$ ignores the recoil, and $5.41(210/206) = 5.52$ MeV inverts the ratio.
- id: phys-m12-r2-h17
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Which statements about beta decay are correct? Select all that apply.'
  choices:
    - Beta electrons from one isotope come out with a range of energies up to $Q$
    - A neutrino or antineutrino carries off part of the energy
    - Every beta electron from a given isotope has the same energy
    - With atomic masses, $Q_{\beta^+}$ requires subtracting $2m_ec^2$
    - The neutrino was detected in the same year that Pauli proposed it
  answer: [0, 1, 3]
  explanation: |-
    Beta decay has three products, so the energy is shared in varying proportions and the electron spectrum is continuous up to $Q$; that is what led Pauli to propose the neutrino in 1930. It was detected only in 1956, by Cowan and Reines. For beta-plus, the atomic-mass difference must be reduced by $2m_ec^2 = 1.022$ MeV.
- id: phys-m12-r2-h18
  lesson: phys-m12-h-nuclear-energy
  type: text
  topic: Nuclear reactions
  stem: 'A slow positron and electron annihilate into two photons. Each photon has energy ___ MeV. Give only the number.'
  accept: ['0.511', '0.51']
  explanation: |-
    With almost no kinetic energy, the total energy is the pair's rest energy, $2m_ec^2 = 1.022$ MeV. The photons must have equal and opposite momenta (the pair had nearly none), so they share it equally: 0.511 MeV each, flying off in opposite directions. PET scanners detect exactly these photon pairs.
- id: phys-m12-r2-h19
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'A reaction has $Q = -1.80$ MeV. A proton (about 1 u) strikes a stationary target nucleus of about 9 u. What is the threshold kinetic energy of the proton?'
  choices: ['$1.80$ MeV', '$1.60$ MeV', '$16.2$ MeV', '$2.00$ MeV']
  answer: 3
  explanation: |-
    $K_{\text{th}} = -Q\left(1 + \dfrac{m_{\text{projectile}}}{m_{\text{target}}}\right) = 1.80\left(1 + \dfrac19\right) = 2.00$ MeV. Exactly 1.80 MeV is not enough, because the products must keep the incoming momentum. 1.60 MeV subtracts the correction instead of adding it, and 16.2 MeV multiplies by 9.
- id: phys-m12-r2-h20
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Why must a projectile have MORE kinetic energy than $|Q|$ to start a reaction with $Q < 0$?'
  choices:
    - 'Momentum is conserved, so the products must still be moving and keep some of the kinetic energy'
    - 'Some energy is always lost as heat in the target'
    - 'The Q-value is always measured too small'
    - 'The projectile must first overcome the strong nuclear force'
  answer: 0
  explanation: |-
    The projectile brings momentum, and momentum is conserved, so the products can't end up at rest; the kinetic energy they carry can't be turned into mass. Only the energy "in the center-of-mass frame" is available, which is the fraction $m_{\text{target}}/(m_{\text{projectile}} + m_{\text{target}})$ of the projectile's energy, hence the factor in the threshold formula.
- id: phys-m12-r2-h21
  lesson: phys-m12-h-nuclear-energy
  type: order
  topic: Nuclear reactions
  stem: 'Put the steps of one generation of a reactor chain reaction in order, starting from a slow neutron.'
  items:
    - A slow neutron is absorbed by a uranium-235 nucleus
    - The nucleus splits into two fragments, releasing about 200 MeV
    - Two or three fast neutrons are released
    - The neutrons slow down by colliding with the moderator
    - A slowed neutron is absorbed by another uranium-235 nucleus
  explanation: |-
    Absorption makes U-235 split; the split releases energy and fast neutrons; fast neutrons are unlikely to cause fission, so the moderator slows them first; a slow neutron then starts the next generation. Control rods remove some neutrons along the way to keep the average at exactly one new fission per fission.
- id: phys-m12-r2-h22
  lesson: phys-m12-h-nuclear-energy
  type: match
  topic: Nuclear reactions
  stem: 'Match each part or condition of a fission reactor to its role.'
  pairs:
    - [Moderator, Slows neutrons by collisions]
    - [Control rods, Absorb neutrons to hold k at 1]
    - [Uranium-235 fuel, Fissions and releases energy and neutrons]
    - ['$k = 1$', Steady chain reaction (critical)]
    - ['$k < 1$', The chain reaction dies out]
  distractors: [Speeds neutrons up so they cause fission]
  explanation: |-
    Water or graphite moderators slow fast neutrons, which U-235 captures far more readily when slow. Boron or cadmium control rods soak up neutrons. The multiplication factor $k$ is the average number of new fissions per fission: exactly 1 is steady (critical), below 1 the reaction fades, above 1 it grows.
- id: phys-m12-r2-h23
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'About how much energy is released by the complete fission of 1 kg of uranium-235, at about 200 MeV per fission?'
  choices: ['$5\times10^{7}$ J', '$9\times10^{16}$ J', '$2\times10^{8}$ J', '$8\times10^{13}$ J']
  answer: 3
  explanation: |-
    1 kg contains $1/(235 \times 1.66\times10^{-27}) = 2.56\times10^{24}$ nuclei; each gives $200\times10^6 \times 1.60\times10^{-19} = 3.2\times10^{-11}$ J; the product is $8.2\times10^{13}$ J. $9\times10^{16}$ J is $mc^2$ for the whole kilogram (fission converts only about 0.1% of the mass); $5\times10^7$ J is about what burning a kilogram of gasoline gives.
- id: phys-m12-r2-h24
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Deuterium–deuterium fusion can give helium-3 plus a neutron, with $Q = 3.27$ MeV. If the deuterons start with negligible energy, about how much kinetic energy does the neutron get?'
  choices: ['$0.82$ MeV', '$1.64$ MeV', '$2.45$ MeV', '$3.27$ MeV']
  answer: 2
  explanation: |-
    The neutron (mass 1) and helium-3 (mass 3) fly apart with equal and opposite momenta, so energy divides in inverse proportion to mass: the neutron gets $\tfrac34$ of $Q$, $0.75(3.27) = 2.45$ MeV, and helium-3 gets 0.82 MeV. Splitting equally (1.64 MeV) ignores momentum conservation.
- id: phys-m12-r2-h25
  lesson: phys-m12-h-nuclear-energy
  topic: Nuclear reactions
  stem: 'Why does fusion need temperatures of millions of kelvins?'
  choices:
    - 'Neutrons must be slowed down before nuclei can fuse'
    - 'The nuclei are positively charged and must get close enough, against their repulsion, for the strong force to act'
    - 'The fuel must be ionized before fusion can release energy'
    - 'High temperature increases the Q-value of the reaction'
  answer: 1
  explanation: |-
    The strong force acts only within a few femtometers, and at that distance two nuclei repel with a Coulomb barrier of roughly 0.5 MeV. Even at 15 million K, typical thermal energies are only about 1 keV; fusion relies on the fastest nuclei in the gas plus quantum tunneling through the barrier. The Q-value is fixed by the masses, not the temperature.
- id: phys-m12-r2-h26
  lesson: phys-m12-h-nuclear-energy
  type: text
  topic: Radiation dose
  stem: 'A 60 kg person absorbs 0.12 J of gamma radiation spread over the whole body. The absorbed dose is ___ mGy. Give only the number.'
  accept: ['2', '2.0']
  explanation: |-
    $D = \dfrac{E}{m} = \dfrac{0.12\text{ J}}{60\text{ kg}} = 0.0020$ J/kg $= 2.0$ mGy. For gamma rays $w_R = 1$, so the equivalent dose is 2.0 mSv, about a third of a typical U.S. resident's yearly dose.
- id: phys-m12-r2-h27
  lesson: phys-m12-h-nuclear-energy
  topic: Radiation dose
  stem: 'Tissue receives an absorbed dose of 1.5 mGy from alpha particles ($w_R = 20$). What is the equivalent dose?'
  choices: ['$1.5$ mSv', '$0.075$ mSv', '$3.0$ mSv', '$30$ mSv']
  answer: 3
  explanation: |-
    $H = w_RD = 20(1.5) = 30$ mSv. Alphas deposit their energy densely along short tracks, which damages cells more than the same energy from gamma rays. 1.5 mSv ignores the weighting, 0.075 divides instead of multiplying, and 3.0 mSv uses the proton factor of 2.
- id: phys-m12-r2-h28
  lesson: phys-m12-h-nuclear-energy
  topic: Radiation dose
  stem: 'Which statements about radiation dose are correct? Select all that apply.'
  choices:
    - One gray is one joule of absorbed energy per kilogram
    - Equal absorbed doses of alpha and gamma radiation give equal equivalent doses
    - Radiation protection limits are set using the linear no-threshold model
    - Doses below 10 mSv have been proven to carry no risk at all
    - Roughly half of the average U.S. resident's dose comes from natural sources
  answer: [0, 2, 4]
  explanation: |-
    The gray is J/kg. Equivalent dose multiplies by $w_R$, 20 for alphas and 1 for gammas, so equal grays are not equal sieverts. Protection rules assume risk proportional to dose with no safe threshold; whether that holds at very low doses is debated, but nothing has proven such doses risk-free. Natural sources (radon, cosmic rays, rocks, potassium-40) give about half the roughly 6 mSv a year.
