- id: phys-q-4401
  lesson: phys-relativity
  module_quiz: true
  topic: Special relativity
  stem: 'A spaceship passes Earth at $0.80c$. A clock on board ticks 1.0 s between two events at the clock. How long between those events according to Earth observers?'
  choices: ['0.60 s', '1.0 s', '1.25 s', '1.67 s']
  answer: 3
  explanation: |-
    $\gamma = 1/\sqrt{1 - 0.64} = 1.667$. The ship's clock measures proper time, so Earth measures $\Delta t = \gamma\Delta t_0 = 1.67$ s: moving clocks run slow. 0.60 s divides instead of multiplying.
- id: phys-q-4402
  lesson: phys-relativity
  topic: Special relativity
  stem: 'Which statement is one of Einstein''s postulates of special relativity?'
  choices: ['The speed of light in vacuum is the same in all inertial frames', 'Mass is always conserved', 'Time passes at the same rate for all observers', 'Nothing can move faster than sound']
  answer: 0
  explanation: |-
    The two postulates are the principle of relativity and the constancy of $c$. Absolute time is exactly what relativity abandons.
- id: phys-q-4403
  lesson: phys-relativity
  topic: Special relativity
  stem: 'A rod has proper length 50 m. How long is it measured by an observer it passes at $0.60c$ (moving along its length)?'
  choices: ['62.5 m', '50 m', '40 m', '30 m']
  answer: 2
  explanation: |-
    $\gamma = 1.25$; $L = L_0/\gamma = 50/1.25 = 40$ m. Multiplying by $\gamma$ (62.5 m) gets contraction backwards.
- id: phys-q-4404
  lesson: phys-relativity
  module_quiz: true
  topic: Special relativity
  stem: 'A ship moving at $0.50c$ fires a probe forward at $0.50c$ relative to the ship. What is the probe''s speed relative to the ground?'
  choices: ['$1.0c$', '$0.50c$', '$0.75c$', '$0.80c$']
  answer: 3
  explanation: |-
    $u = \dfrac{0.50c + 0.50c}{1 + (0.50)(0.50)} = \dfrac{1.0c}{1.25} = 0.80c$. Classical addition would give $1.0c$, which relativity forbids for a massive object.
- id: phys-q-4405
  lesson: phys-relativity
  topic: Special relativity
  stem: 'How much energy is equivalent to 1.0 g of mass? ($c = 3.0\times10^8$ m/s)'
  choices: ['$3.0\times10^5$ J', '$9.0\times10^{16}$ J', '$9.0\times10^{13}$ J', '$3.0\times10^{11}$ J']
  answer: 2
  explanation: |-
    $E = mc^2 = (1.0\times10^{-3}\text{ kg})(9.0\times10^{16}) = 9.0\times10^{13}$ J. Forgetting to convert grams to kilograms gives $9.0\times10^{16}$ J.
- id: phys-q-4406
  lesson: phys-relativity
  topic: Special relativity
  stem: 'An electron ($mc^2 = 0.511$ MeV) moves at $0.60c$. What is its kinetic energy?'
  choices: ['0.128 MeV', '0.092 MeV', '0.639 MeV', '0.511 MeV']
  answer: 0
  explanation: |-
    $\gamma = 1.25$; $K = (\gamma - 1)mc^2 = 0.25(0.511) = 0.128$ MeV. The classical $\tfrac12mv^2 = 0.092$ MeV underestimates it; 0.639 MeV is the total energy.
- id: phys-q-4407
  lesson: phys-relativity
  topic: Special relativity
  stem: 'Why can''t a massive object be accelerated to the speed of light?'
  choices: ['Air resistance becomes too large', 'Its momentum $\gamma mv$ and energy grow without limit as $v \to c$, requiring infinite work', 'Its mass becomes zero', 'Light would slow down to match it']
  answer: 1
  explanation: |-
    $\gamma \to \infty$ as $v \to c$, so the kinetic energy $(\gamma - 1)mc^2$ needed is infinite.
- id: phys-q-4408
  lesson: phys-relativity
  module_quiz: true
  topic: Special relativity
  stem: 'Muons from the upper atmosphere reach the ground in large numbers even though their rest-frame half-life would let them travel only a few hundred meters. In the muons'' own frame, the explanation is'
  choices: ['their half-life is longer', 'they move faster than light', 'the atmosphere''s thickness is length-contracted', 'gravity speeds them up']
  answer: 2
  explanation: |-
    From the ground, the muons' clocks run slow (time dilation). In the muons' frame their half-life is normal, but the atmosphere rushing past is contracted by $\gamma$. Both views agree on how many reach the ground.
- id: phys-q-4409
  lesson: phys-relativity
  topic: Special relativity
  stem: 'For a photon, which relationship between energy and momentum holds?'
  choices: ['$E = \tfrac12pc$', '$E = p^2/2m$', '$E = mc^2$ with its rest mass', '$E = pc$']
  answer: 3
  explanation: |-
    $E^2 = (pc)^2 + (mc^2)^2$ with $m = 0$ gives $E = pc$.
- id: phys-q-4410
  lesson: phys-relativity
  topic: Special relativity
  stem: 'Two lightning strikes hit the ends of a moving train simultaneously according to an observer on the platform. An observer on the train sees them'
  choices: ['simultaneously as well', 'at different times', 'not at all', 'in reversed order only if the train moves faster than light']
  answer: 1
  explanation: |-
    Simultaneity is relative: events simultaneous in one frame generally aren't in another moving relative to it. (The train observer sees the front strike first.)
- id: phys-q-4411
  lesson: phys-relativity
  topic: Special relativity
  stem: 'At what speed is a particle''s kinetic energy equal to its rest energy?'
  choices: ['$0.50c$', '$0.707c$', '$0.866c$', '$1.41c$']
  answer: 2
  explanation: |-
    $K = (\gamma - 1)mc^2 = mc^2$ requires $\gamma = 2$, so $1 - v^2/c^2 = \tfrac14$ and $v = \sqrt{0.75}\,c = 0.866c$. Setting $\tfrac12mv^2 = mc^2$ gives $1.41c$, which is impossible; $0.707c$ comes from $\gamma^2 = 2$ instead of $\gamma = 2$.
- id: phys-q-4501
  lesson: phys-quantum
  module_quiz: true
  topic: Photons
  stem: 'What is the energy of a photon of wavelength 620 nm? ($hc = 1240$ eV·nm)'
  choices: ['0.50 eV', '620 eV', '1240 eV', '2.0 eV']
  answer: 3
  explanation: |-
    $E = hc/\lambda = 1240/620 = 2.0$ eV. Dividing the other way gives 0.50 eV.
- id: phys-q-4502
  lesson: phys-quantum
  topic: Photons
  stem: 'In the photoelectric effect, making the light brighter (same frequency, above threshold)'
  choices: ['increases the number of ejected electrons, not their maximum energy', 'increases the maximum kinetic energy of the electrons', 'lowers the threshold frequency', 'has no effect']
  answer: 0
  explanation: |-
    Brighter light means more photons, so more electrons; each electron still absorbs one photon of the same energy, so $K_{\max} = hf - \phi$ is unchanged.
- id: phys-q-4503
  lesson: phys-quantum
  topic: Photons
  stem: 'Light of 250 nm strikes a metal with work function 4.5 eV. What is the maximum kinetic energy of the ejected electrons?'
  choices: ['4.96 eV', '9.5 eV', '0 eV, no electrons', '0.46 eV']
  answer: 3
  explanation: |-
    Photon energy: $1240/250 = 4.96$ eV. $K_{\max} = 4.96 - 4.5 = 0.46$ eV.
- id: phys-q-4504
  lesson: phys-quantum
  module_quiz: true
  topic: Atomic structure
  stem: 'What photon energy is emitted when a hydrogen electron drops from $n = 2$ to $n = 1$?'
  choices: ['3.4 eV', '13.6 eV', '10.2 eV', '6.8 eV']
  answer: 2
  explanation: |-
    $\Delta E = 13.6(1 - \tfrac14) = 10.2$ eV, an ultraviolet photon (122 nm). 3.4 eV is $|E_2|$.
- id: phys-q-4505
  lesson: phys-quantum
  topic: Atomic structure
  stem: 'Why does each element have its own unique line spectrum?'
  choices: ['Each element''s atoms have a unique set of energy levels, and photons carry the differences', 'Heavier elements emit brighter light', 'Each element absorbs all colors equally', 'The electrons move at different speeds']
  answer: 0
  explanation: |-
    Emitted photons have energies equal to differences between allowed levels, and those levels are set by the nucleus's charge and the electron arrangement, different for each element.
- id: phys-q-4506
  lesson: phys-quantum
  topic: Wave–particle duality
  stem: 'What is the de Broglie wavelength of an electron moving at $1.0\times10^6$ m/s? ($h = 6.63\times10^{-34}$ J·s, $m_e = 9.11\times10^{-31}$ kg)'
  choices: ['$7.3\times10^{-10}$ m', '$7.3\times10^{-4}$ m', '$1.4\times10^{9}$ m', '$6.6\times10^{-40}$ m']
  answer: 0
  explanation: |-
    $\lambda = h/(mv) = 6.63\times10^{-34}/(9.11\times10^{-31}\times10^6) = 7.3\times10^{-10}$ m, comparable to atomic spacings.
- id: phys-q-4507
  lesson: phys-quantum
  module_quiz: true
  topic: Wave–particle duality
  stem: 'Which experiment showed that electrons have wave properties?'
  choices: ['The photoelectric effect', 'Electron diffraction from crystals (Davisson–Germer)', 'Rutherford''s gold-foil scattering', 'Millikan''s oil drop']
  answer: 1
  explanation: |-
    Electrons scattered from a nickel crystal produced a diffraction pattern matching $\lambda = h/p$. The photoelectric effect showed the particle nature of light.
- id: phys-q-4508
  lesson: phys-quantum
  topic: Photons
  stem: 'Why don''t red photons eject electrons from a metal with a work function of 2.3 eV, no matter how bright the light?'
  choices: ['Red light is not an electromagnetic wave', 'Bright light is reflected', 'Each red photon has less energy (about 1.8 eV) than the work function', 'Red light is absorbed by air']
  answer: 2
  explanation: |-
    One photon frees one electron. A 700 nm photon carries $1240/700 = 1.8$ eV, short of the 2.3 eV needed, and electrons can't pool energy from several photons in ordinary light.
- id: phys-q-4509
  lesson: phys-quantum
  topic: Atomic structure
  stem: 'How much energy is needed to ionize a hydrogen atom from its ground state?'
  choices: ['3.4 eV', '10.2 eV', '1.51 eV', '13.6 eV']
  answer: 3
  explanation: |-
    Raising the electron from $E_1 = -13.6$ eV to $E_\infty = 0$ takes 13.6 eV.
- id: phys-q-4510
  lesson: phys-quantum
  topic: Wave–particle duality
  stem: 'A particle confined to a box of width $L$ has energies $E_n = n^2h^2/(8mL^2)$. If the box is made narrower, the energy levels'
  choices: ['move closer together and lower', 'spread farther apart and rise', 'stay the same', 'disappear']
  answer: 1
  explanation: |-
    $E_n \propto 1/L^2$, so tighter confinement raises every level and widens the spacing, a consequence of shorter allowed wavelengths (and the uncertainty principle).
- id: phys-q-4511
  lesson: phys-quantum
  topic: Photons
  stem: 'On a graph of maximum photoelectron kinetic energy versus light frequency, the slope equals'
  choices: ['the work function', 'Planck''s constant $h$', 'the threshold frequency', 'the electron charge']
  answer: 1
  explanation: |-
    $K_{\max} = hf - \phi$ is a line with slope $h$ (the same for every metal) and intercept $-\phi$.
- id: phys-q-4512
  lesson: phys-quantum
  module_quiz: true
  topic: Photons
  stem: 'A star''s spectrum peaks at 725 nm. Treating it as a blackbody, what is its surface temperature? (Wien constant $2.898\times10^{-3}$ m·K)'
  choices: ['$4.0\times10^{-6}$ K', '$2.1\times10^{-9}$ K', '$3.7\times10^{3}$ K', '$4.0\times10^{3}$ K']
  answer: 3
  explanation: |-
    $T = 2.898\times10^{-3}/\lambda_{\max} = 2.898\times10^{-3}/(725\times10^{-9}) = 4.0\times10^{3}$ K, a cool orange-red star. Leaving the wavelength in nm gives $4.0\times10^{-6}$ K, and multiplying instead of dividing gives $2.1\times10^{-9}$ K. Subtracting 273 gives $3.7\times10^{3}$, which is the temperature in °C, not kelvins.
- id: phys-q-4513
  lesson: phys-quantum
  topic: Photons
  stem: 'A blackbody is heated to a higher temperature. What happens to its spectrum?'
  choices: ['The peak moves to shorter wavelengths and the total power increases', 'The peak moves to longer wavelengths and the total power increases', 'The peak stays put and only the total power increases', 'The peak moves to shorter wavelengths and the total power stays the same']
  answer: 0
  explanation: |-
    Wien's law, $\lambda_{\max}T = \text{constant}$, moves the peak to shorter wavelengths as $T$ rises (red, then orange, then white-hot), and the total power grows as $T^4$. The other combinations each miss one of these two effects or reverse the direction of the shift.
- id: phys-q-4514
  lesson: phys-quantum
  module_quiz: true
  topic: Photons
  stem: 'X-rays of wavelength 50.0 pm scatter off nearly free electrons. What is the wavelength of the X-rays scattered through 90°? ($h/(m_ec) = 2.43$ pm)'
  choices: ['47.6 pm', '50.0 pm', '52.4 pm', '54.9 pm']
  answer: 2
  explanation: |-
    $\Delta\lambda = (2.43\text{ pm})(1 - \cos 90^\circ) = 2.43$ pm, so $\lambda' = 50.0 + 2.43 = 52.4$ pm. The photon loses energy to the electron, so the wavelength gets longer; subtracting the shift gives 47.6 pm. 54.9 pm uses the 180° shift ($1 - \cos\theta = 2$), and 50.0 pm takes $\cos 90^\circ$ as 1, giving no shift.
- id: phys-q-4515
  lesson: phys-quantum
  topic: Photons
  stem: 'Why is the Compton shift easy to see with X-rays but not with visible light?'
  choices: ['Visible-light photons carry no momentum', 'The shift is at most about 5 pm, a tiny fraction of a visible wavelength but a large fraction of an X-ray wavelength', 'Electrons cannot scatter visible light', 'Visible light behaves only as a wave and X-rays only as particles']
  answer: 1
  explanation: |-
    The shift $\dfrac{h}{m_ec}(1 - \cos\theta)$ is at most 4.86 pm whatever the wavelength. Against a 500 nm visible wavelength that is a change of one part in $10^{5}$; against a 50 pm X-ray it is about 10%. Visible photons do carry momentum $h/\lambda$ and do scatter from electrons, and both kinds of light show wave and particle behavior.
- id: phys-q-4516
  lesson: phys-quantum
  topic: Photons
  stem: 'In Compton scattering, at what scattering angle does the photon lose the most energy to the electron?'
  choices: ['0°', '90°', '45°', '180°']
  answer: 3
  explanation: |-
    The wavelength shift $\dfrac{h}{m_ec}(1 - \cos\theta)$ is largest when $\cos\theta = -1$, at 180° (bounced straight back), where it equals $2h/(m_ec) = 4.86$ pm. A longer wavelength means a lower-energy photon, so this is where the electron gains the most. At 0° the photon barely deflects and loses nothing; 90° and 45° give intermediate shifts.
- id: phys-q-at01
  lesson: phys-atomic
  module_quiz: true
  topic: Multielectron atoms
  stem: 'What is the largest number of electrons the $n = 3$ shell can hold?'
  choices: ['18', '9', '8', '6']
  answer: 0
  explanation: |-
    The shell has subshells $l = 0, 1, 2$ with $1 + 3 + 5 = 9$ orbitals, each holding two spin states: $2n^2 = 18$. Counting orbitals without spin gives 9. Eight is the number of elements in the third row of the periodic table, which is shorter because 3d fills after 4s. Six is $2n$.
- id: phys-q-at02
  lesson: phys-atomic
  topic: Multielectron atoms
  stem: 'Which values of the orbital quantum number $l$ are allowed when $n = 3$?'
  choices: ['$l = 1, 2, 3$', '$l = 0, 1, 2, 3$', '$l = 0, 1, 2$', '$l = -2, -1, 0, 1, 2$']
  answer: 2
  explanation: |-
    $l$ runs from 0 to $n - 1$, so 0, 1 and 2 (3s, 3p, 3d). Letting $l$ reach $n$ is the common slip. The list from $-2$ to 2 is the set of $m_l$ values for $l = 2$, not values of $l$.
- id: phys-q-at03
  lesson: phys-atomic
  module_quiz: true
  topic: Multielectron atoms
  stem: 'Which statement is the Pauli exclusion principle?'
  choices: ['No two electrons in an atom can be in the same shell', 'No two electrons in an atom can have the same set of four quantum numbers', 'Electrons always fill the highest energy levels first', 'Each orbital can hold only one electron']
  answer: 1
  explanation: |-
    Pauli forbids two electrons sharing all four of $n$, $l$, $m_l$, $m_s$. A shell holds many electrons (up to $2n^2$), and an orbital holds two, one with each spin; one per orbital forgets spin. Electrons fill the lowest available levels first, not the highest.
- id: phys-q-at04
  lesson: phys-atomic
  topic: Multielectron atoms
  stem: 'What is the maximum number of electrons in a d subshell?'
  choices: ['5', '6', '14', '10']
  answer: 3
  explanation: |-
    A d subshell has $l = 2$, so $m_l = -2$ to 2 (5 values), each with 2 spins: $2(2l + 1) = 10$. Five forgets spin, 6 is the p subshell, and 14 is the f subshell.
- id: phys-q-at05
  lesson: phys-atomic
  topic: Multielectron atoms
  stem: 'What is the ground-state electron configuration of magnesium ($Z = 12$)?'
  choices: ['$1s^2\,2s^2\,2p^8$', '$1s^2\,2s^2\,2p^6\,3p^2$', '$1s^2\,2s^2\,2p^6\,2d^2$', '$1s^2\,2s^2\,2p^6\,3s^2$']
  answer: 3
  explanation: |-
    After 1s (2), 2s (2) and 2p (6), the last two electrons go into 3s. A p subshell holds at most 6, so $2p^8$ breaks the Pauli principle. 3p lies above 3s, and there is no 2d subshell ($l$ can be at most $n - 1 = 1$).
- id: phys-q-at06
  lesson: phys-atomic
  module_quiz: true
  topic: X-rays and lasers
  stem: 'An X-ray tube operates at 25 kV. What is the shortest wavelength in its spectrum? ($hc = 1240$ eV·nm)'
  choices: ['49.6 nm', '0.0496 nm', '0.0992 nm', '20.2 nm']
  answer: 1
  explanation: |-
    The most energetic photon takes an electron's full energy, $eV = 25\,000$ eV, so $\lambda_{\min} = 1240/25\,000 = 0.0496$ nm (49.6 pm). Using 25 instead of 25 000 eV gives 49.6 nm. Halving the voltage, as if the energy were $\tfrac12eV$, gives 0.0992 nm, and dividing 25 000 by 1240 gives 20.2.
- id: phys-q-at07
  lesson: phys-atomic
  topic: X-rays and lasers
  stem: 'The voltage on an X-ray tube is increased. What happens to the X-ray spectrum?'
  choices: ['The cutoff wavelength and the characteristic lines both shift to shorter wavelengths', 'Neither the cutoff nor the characteristic lines change', 'The cutoff wavelength gets shorter, but the characteristic lines stay at the same wavelengths', 'The characteristic lines shift, but the cutoff wavelength stays the same']
  answer: 2
  explanation: |-
    The cutoff $\lambda_{\min} = hc/(eV)$ depends only on the voltage, so it shortens. The characteristic lines come from the target atoms' own inner energy levels, which don't depend on how hard the electrons hit, so they stay put (they may get brighter).
- id: phys-q-at08
  lesson: phys-atomic
  module_quiz: true
  topic: X-rays and lasers
  stem: 'Estimate the energy of the Kα X-ray line of molybdenum ($Z = 42$) using $E \approx 10.2\text{ eV}\,(Z - 1)^2$.'
  choices: ['17.1 keV', '18.0 keV', '22.9 keV', '0.42 keV']
  answer: 0
  explanation: |-
    $E \approx 10.2(41)^2 = 10.2(1681) = 1.71\times10^{4}$ eV $= 17.1$ keV (measured: 17.5 keV). Using $Z^2$ instead of $(Z - 1)^2$ gives 18.0 keV. Using 13.6 eV, which forgets the $(1 - \tfrac14)$ factor for the drop from $n = 2$ to $n = 1$, gives 22.9 keV. Forgetting to square gives 0.42 keV.
- id: phys-q-at09
  lesson: phys-atomic
  topic: X-rays and lasers
  stem: 'A photon whose energy matches an atom''s transition passes an atom in the upper state and causes stimulated emission. What comes out?'
  choices: ['One photon in a random direction with a random phase', 'Two photons with the same energy, direction and phase', 'One photon with twice the original energy', 'One photon and an ejected electron']
  answer: 1
  explanation: |-
    The passing photon continues, and the atom adds an exact copy of it (same energy, direction, phase and polarization). That copying is how a laser amplifies light. A random direction and phase describes spontaneous emission. The atom only releases its transition energy, so no photon of twice the energy appears, and no electron is ejected.
- id: phys-q-at10
  lesson: phys-atomic
  module_quiz: true
  topic: X-rays and lasers
  stem: 'Why must a laser have a population inversion?'
  choices: ['To make the emitted light polarized', 'To make spontaneous emission happen faster', 'To stop the atoms absorbing the pump energy', 'So that stimulated emission happens more often than absorption']
  answer: 3
  explanation: |-
    A passing photon can either be absorbed by an atom in the lower state or stimulate emission from one in the upper state. Only if more atoms are in the upper state does emission win, so the light grows. Polarization and the speed of spontaneous emission are not what the inversion is for, and the atoms must absorb pump energy to get into the upper state at all.
- id: phys-q-at11
  lesson: phys-atomic
  topic: X-rays and lasers
  stem: 'A laser transition runs from a level 2.10 eV above the ground state to one 0.30 eV above it. What is the laser wavelength? ($hc = 1240$ eV·nm)'
  choices: ['689 nm', '590 nm', '517 nm', '4130 nm']
  answer: 0
  explanation: |-
    The photon carries the difference, $2.10 - 0.30 = 1.80$ eV, so $\lambda = 1240/1.80 = 689$ nm (red). Using the upper level alone gives 590 nm, adding the two levels gives 517 nm, and using the lower level alone gives 4130 nm.
- id: phys-q-at12
  lesson: phys-atomic
  topic: Multielectron atoms
  stem: 'Why do lithium, sodium and potassium have similar chemical behavior?'
  choices: ['They have the same total number of electrons', 'They have the same number of filled shells', 'Each has a single s electron outside completely filled subshells', 'Each has a half-filled p subshell']
  answer: 2
  explanation: |-
    Chemistry depends mostly on the outermost electrons. Lithium ($2s^1$), sodium ($3s^1$) and potassium ($4s^1$) each have one loosely held s electron beyond filled subshells, which they give up easily. Their totals (3, 11, 19) and numbers of filled shells differ, and none has an unfilled p subshell in its ground state.
- id: phys-q-4601
  lesson: phys-nuclear
  module_quiz: true
  topic: Radioactive decay
  stem: 'A radioactive sample has a half-life of 3.0 hours. What fraction remains after 12 hours?'
  choices: ['1/16', '1/4', '1/12', '1/8']
  answer: 0
  explanation: |-
    12 hours is 4 half-lives: $(\tfrac12)^4 = 1/16$. Dividing 12 by 3 and calling it 1/4 confuses the number of half-lives with the fraction.
- id: phys-q-4602
  lesson: phys-nuclear
  topic: Nuclear structure
  stem: 'How many neutrons are in a nucleus of $^{235}_{92}\text{U}$?'
  choices: ['92', '235', '143', '327']
  answer: 2
  explanation: |-
    $N = A - Z = 235 - 92 = 143$.
- id: phys-q-4603
  lesson: phys-nuclear
  topic: Radioactive decay
  stem: '$^{226}_{88}\text{Ra}$ undergoes alpha decay. What is the daughter nucleus?'
  choices: ['$^{226}_{89}\text{Ac}$', '$^{222}_{86}\text{Rn}$', '$^{224}_{86}\text{Rn}$', '$^{222}_{88}\text{Ra}$']
  answer: 1
  explanation: |-
    Alpha emission removes 2 protons and 2 neutrons: $Z = 86$ (radon), $A = 222$. Both $Z$ and $A$ balance: $226 = 222 + 4$, $88 = 86 + 2$.
- id: phys-q-4604
  lesson: phys-nuclear
  module_quiz: true
  topic: Radioactive decay
  stem: 'In beta-minus decay, what happens inside the nucleus?'
  choices: ['A proton becomes a neutron', 'Two protons and two neutrons are emitted', 'The nucleus loses energy as a photon', 'A neutron becomes a proton, emitting an electron and an antineutrino']
  answer: 3
  explanation: |-
    β⁻: $n \to p + e^- + \bar\nu$, so $Z$ rises by 1 and $A$ is unchanged (e.g. carbon-14 → nitrogen-14).
- id: phys-q-4605
  lesson: phys-nuclear
  module_quiz: true
  topic: Nuclear structure
  stem: 'A nucleus has a mass defect of 0.100 u. What is its binding energy? (1 u = 931.5 MeV/$c^2$)'
  choices: ['93.2 MeV', '0.100 MeV', '931.5 MeV', '9.32 MeV']
  answer: 0
  explanation: |-
    $E_B = \Delta m\,c^2 = 0.100(931.5) = 93.2$ MeV.
- id: phys-q-4606
  lesson: phys-nuclear
  topic: Nuclear structure
  stem: 'Both fission of uranium and fusion of hydrogen release energy because'
  choices: ['both increase the total number of nucleons', 'both move toward nuclei with higher binding energy per nucleon (near iron)', 'both create mass from energy', 'both decrease the binding energy per nucleon']
  answer: 1
  explanation: |-
    Binding energy per nucleon peaks near iron-56. Splitting heavy nuclei or fusing light ones both produce more tightly bound products; the mass difference is released as energy.
- id: phys-q-4607
  lesson: phys-nuclear
  topic: Radioactive decay
  stem: 'A sample''s activity is 80 kBq. Its half-life is 5.0 days. What is the activity after 20 days?'
  choices: ['20 kBq', '10 kBq', '5.0 kBq', '0 kBq']
  answer: 2
  explanation: |-
    20 days is 4 half-lives: $80/2^4 = 5.0$ kBq. Activity decays with the same half-life as the number of nuclei.
- id: phys-q-4608
  lesson: phys-nuclear
  module_quiz: true
  topic: Radioactive decay
  stem: 'A decay constant is $\lambda = 0.0231$ per day. What is the half-life?'
  choices: ['43 days', '30 days', '0.016 days', '0.0231 days']
  answer: 1
  explanation: |-
    $T_{1/2} = \ln 2/\lambda = 0.693/0.0231 = 30$ days. 43 days is $1/\lambda$, which leaves out the factor $\ln 2$.
- id: phys-q-4609
  lesson: phys-nuclear
  topic: Nuclear structure
  stem: 'What holds protons together in a nucleus despite their electric repulsion?'
  choices: ['Gravity', 'The magnetic force', 'The strong nuclear force, which is very strong but short-ranged', 'The weak nuclear force']
  answer: 2
  explanation: |-
    The strong force attracts nucleons strongly over about $10^{-15}$ m, overcoming the Coulomb repulsion between nearby protons.
- id: phys-q-4610
  lesson: phys-nuclear
  topic: Radioactive decay
  stem: 'Which type of radiation is the most penetrating?'
  choices: ['Gamma', 'Alpha', 'Beta', 'They penetrate equally']
  answer: 0
  explanation: |-
    Gamma rays (photons) need thick lead or concrete to stop; beta particles are stopped by millimeters of aluminum; alpha particles by paper or skin.
- id: phys-q-4611
  lesson: phys-nuclear
  topic: Radioactive decay
  stem: 'A bone sample has 25% of the carbon-14 activity of living bone. With $T_{1/2} = 5730$ years, how old is it?'
  choices: ['1430 years', '4300 years', '22 900 years', '11 460 years']
  answer: 3
  explanation: |-
    25% is $(\tfrac12)^2$: two half-lives, $2(5730) = 11\,460$ years.
- id: phys-q-4612
  lesson: phys-nuclear
  topic: Radioactive decay
  stem: 'Sample A contains twice as many radioactive nuclei as sample B, but A''s isotope has a half-life twice as long as B''s. How do their activities compare right now?'
  choices: ['The activities are equal', 'A''s activity is twice B''s', 'A''s activity is half B''s', 'A''s activity is 4 times B''s']
  answer: 0
  explanation: |-
    Activity is $R = \lambda N = \dfrac{0.693\,N}{T_{1/2}}$. A has twice the $N$ but half the $\lambda$ (twice the half-life), so $R_A = \dfrac{0.693(2N)}{2T} = R_B$. Twice B's comes from counting nuclei only; a longer half-life means each nucleus decays less often.
