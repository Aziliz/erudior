# Round 2 questions for phys-m7 (Fluids and thermodynamics).
# phys-m7-r2-q01…q30: core lessons 24–29. phys-m7-r2-h01…h42: honors lessons 29h1–29h3.

# ---------- Lesson 24: Pressure and buoyancy ----------
- id: phys-m7-r2-q01
  lesson: phys-fluid-statics
  type: label
  topic: Pressure
  stem: 'Name the numbered parts of this hydraulic lift.'
  image: {src: images/phys-m7-hydraulic-blank.svg, alt: 'A hydraulic lift with five numbered parts: a downward arrow pushing on the narrow left column, the plate at the top of the narrow column, the plate at the top of the wide right column, the box resting on that plate, and the liquid in the channel joining the two columns.'}
  labels:
    - {x: 9.3, y: 21.6, text: Applied force}
    - {x: 9.3, y: 38.6, text: Small piston}
    - {x: 53.7, y: 54.5, text: Large piston}
    - {x: 70.3, y: 44.3, text: Load}
    - {x: 31.4, y: 83.6, text: Hydraulic fluid}
  distractors: [Valve, Spring]
  explanation: |-
    You push down (1) on the small piston (2). The pressure $F_1/A_1$ spreads undiminished through the hydraulic fluid (5) to the large piston (3), which pushes up on the load (4) with the larger force $F_2 = F_1A_2/A_1$. There is no valve or spring in this simple lift.
- id: phys-m7-r2-q02
  lesson: phys-fluid-statics
  type: text
  module_quiz: true
  topic: Pressure
  stem: 'The large piston of a hydraulic lift has 50 times the area of the small piston. A 120 N push on the small piston can hold up a load of ___ N. Give only the number.'
  accept: ['6000', '6,000', '6 000']
  explanation: |-
    Pascal's principle: the pressure is the same on both pistons, so $F_2 = F_1\dfrac{A_2}{A_1} = 120(50) = 6000$ N. The small piston must move 50 times as far as the large one, so no energy is created.
- id: phys-m7-r2-q03
  lesson: phys-fluid-statics
  topic: Buoyancy
  stem: 'Which of these change the buoyant force on an object that is completely under the surface of a liquid? Select all that apply.'
  choices:
    - 'The density of the liquid'
    - 'The volume of the object'
    - 'The density of the object'
    - 'How deep below the surface the object is'
  answer: [0, 1]
  explanation: |-
    Archimedes: $F_B = \rho_{\text{fluid}}V_{\text{disp}}g$. A fully submerged object displaces its own volume, so the fluid's density and the object's volume matter. The object's own density decides whether it sinks or floats, but not the size of $F_B$. Depth doesn't matter in a liquid: the pressure at the top and bottom both grow with depth, and their difference stays the same.
- id: phys-m7-r2-q04
  lesson: phys-fluid-statics
  type: order
  module_quiz: true
  topic: Pressure
  stem: 'Put these places in order from lowest to highest absolute pressure. (Fresh water 1000 kg/m³, seawater 1025 kg/m³, the same air pressure at both surfaces.)'
  items:
    - 'At the surface of a pond'
    - '2.0 m deep in fresh water'
    - '2.0 m deep in seawater'
    - '5.0 m deep in fresh water'
  explanation: |-
    $P = P_{\text{atm}} + \rho gh$: 101.3 kPa at the surface; $101.3 + 19.6 = 120.9$ kPa at 2.0 m in fresh water; $101.3 + 20.1 = 121.4$ kPa at 2.0 m in the denser seawater; $101.3 + 49.0 = 150.3$ kPa at 5.0 m.
- id: phys-m7-r2-q05
  lesson: phys-fluid-statics
  type: match
  topic: Pressure
  stem: 'Match each device or fact to the idea that explains it.'
  pairs:
    - [A hydraulic car lift, Pascal's principle]
    - [A steel ship floating, Archimedes' principle]
    - [A mercury barometer, Air pressure balancing the weight of a liquid column]
    - [A dam built thicker at its base, Pressure increasing with depth]
  distractors: [The Bernoulli effect]
  explanation: |-
    A lift transmits pressure through an enclosed fluid (Pascal). A ship floats because it displaces its own weight of water (Archimedes). In a barometer the atmosphere holds up a column with $P_{\text{atm}} = \rho gh$. The water pushes hardest near the bottom of a dam, where it is deepest. The Bernoulli effect is about moving fluids, and none of these involve flow.

# ---------- Lesson 25: Fluid flow and Bernoulli's equation ----------
- id: phys-m7-r2-q06
  lesson: phys-fluid-flow
  type: label
  topic: Fluid dynamics
  stem: 'Name the numbered parts of this Venturi tube, which has water flowing through it.'
  image: {src: images/phys-m7-venturi-blank.svg, alt: 'A horizontal pipe that narrows in the middle, with five numbered parts: an arrow at the left outside the pipe, one of the lines running along the pipe on the right, the narrow middle section, the tall column of liquid in the tube above the wide left section, and the short column in the tube above the narrow section.'}
  labels:
    - {x: 9.3, y: 49.2, text: Flow direction}
    - {x: 85.7, y: 63.1, text: Streamline}
    - {x: 58.6, y: 76.9, text: Constriction (narrow section)}
    - {x: 18.6, y: 30.8, text: Higher-pressure column}
    - {x: 52.9, y: 56.9, text: Lower-pressure column}
  distractors: [Pump, Valve]
  explanation: |-
    The arrow (1) shows the flow direction, and the lines (2) are streamlines, the paths the fluid follows. In the constriction (3) the streamlines crowd together because the fluid moves faster ($A_1v_1 = A_2v_2$). Faster flow means lower pressure (Bernoulli), so the column above the narrow section (5) is shorter than the one above the wide section (4).
- id: phys-m7-r2-q07
  lesson: phys-fluid-flow
  type: text
  module_quiz: true
  topic: Fluid dynamics
  stem: 'Water flows at 3.0 m/s in a pipe that narrows to half its diameter. In the narrow part it flows at ___ m/s. Give only the number.'
  accept: ['12']
  explanation: |-
    Half the diameter means a quarter of the area ($A \propto D^2$), so by continuity the speed is 4 times as large: $4(3.0) = 12$ m/s. Doubling the speed (6 m/s) is the mistake of scaling with diameter instead of diameter squared.
- id: phys-m7-r2-q08
  lesson: phys-fluid-flow
  type: order
  topic: Fluid dynamics
  stem: 'Water flows steadily through a horizontal pipe made of sections with these inside diameters. Put the sections in order from highest to lowest pressure.'
  items:
    - '4.0 cm'
    - '3.0 cm'
    - '2.0 cm'
    - '1.5 cm'
  explanation: |-
    The narrower the section, the faster the water ($v \propto 1/D^2$), and in a horizontal pipe $P + \tfrac12\rho v^2$ is constant, so faster means lower pressure. The widest section (4.0 cm) has the slowest flow and the highest pressure; the 1.5 cm section has the lowest.
- id: phys-m7-r2-q09
  lesson: phys-fluid-flow
  module_quiz: true
  topic: Fluid dynamics
  stem: 'Which of these are explained, at least in part, by the Bernoulli effect (faster flow, lower pressure)? Select all that apply.'
  choices:
    - 'A shower curtain bulging in toward the running water'
    - 'A roof lifting off in a strong wind'
    - 'A hydraulic jack lifting a car'
    - 'An iceberg floating with most of its volume under water'
  answer: [0, 1]
  explanation: |-
    Moving air and water inside the shower, and fast wind over a roof, lower the pressure on one side, so the higher pressure on the other side pushes. A hydraulic jack works by Pascal's principle and an iceberg floats by Archimedes' principle; both are fluids at rest.
- id: phys-m7-r2-q10
  lesson: phys-fluid-flow
  type: match
  topic: Fluid dynamics
  stem: 'Match each equation to what it describes.'
  pairs:
    - ['$A_1v_1 = A_2v_2$', Conservation of mass in steady flow]
    - ['$P + \tfrac12\rho v^2 + \rho gy = \text{constant}$', Conservation of energy along a streamline]
    - ['$v = \sqrt{2gh}$', Speed of liquid leaving a hole in a tank]
    - ['$Q = \dfrac{\pi R^4\Delta P}{8\eta L}$', Viscous flow through a pipe]
  distractors: [Buoyant force on a submerged object]
  explanation: |-
    Continuity says the volume flow rate is the same everywhere in a pipe; Bernoulli's equation is energy per unit volume; Torricelli's theorem gives the leak speed; Poiseuille's law gives viscous flow. The buoyant force is $\rho_{\text{fluid}}V_{\text{disp}}g$ from the previous lesson.

# ---------- Lesson 26: Temperature, heat, and phase changes ----------
- id: phys-m7-r2-q11
  lesson: phys-heat
  type: label
  topic: Heat and calorimetry
  stem: 'A pot of water sits on a gas burner. Name the numbered parts: the three ways heat moves, and where the heat comes from.'
  image: {src: images/phys-m7-heat-transfer-blank.svg, alt: 'A pot of water on a burner with four numbered parts: an arrow running along the pot''s metal handle, a loop of arrows circulating in the water, wavy arrows leaving the flames to the left, and the burner under the pot.'}
  labels:
    - {x: 81.6, y: 25.0, text: Conduction}
    - {x: 61.3, y: 34.6, text: Convection}
    - {x: 21.0, y: 62.9, text: Radiation}
    - {x: 53.2, y: 83.9, text: Heat source}
  distractors: [Evaporation, Insulation]
  explanation: |-
    The handle (1) warms by conduction, molecule to molecule through the metal. Warm water rises and cool water sinks in loops (2): convection, which needs a moving fluid. The wavy arrows (3) are radiation, electromagnetic waves that need no medium. The burner (4) is the heat source.
- id: phys-m7-r2-q12
  lesson: phys-heat
  type: text
  topic: Heat and calorimetry
  stem: 'Water has a specific heat of 4186 J/(kg·K). Heating 0.50 kg of water from 20°C to 60°C takes ___ J. Give only the exact number.'
  accept: ['83720', '83,720', '83 720']
  explanation: |-
    $Q = mc\Delta T = 0.50(4186)(60 - 20) = 0.50(4186)(40) = 83\,720$ J. A temperature change of 40°C is a change of 40 K, so no conversion is needed.
- id: phys-m7-r2-q13
  lesson: phys-heat
  type: order
  module_quiz: true
  topic: Heat and calorimetry
  stem: 'Heat is added steadily to 1 kg of ice at −20°C until it becomes steam at 120°C. Put the stages in order.'
  items:
    - 'The ice warms to 0°C'
    - 'The ice melts at 0°C'
    - 'The water warms from 0°C to 100°C'
    - 'The water boils at 100°C'
    - 'The steam warms above 100°C'
  explanation: |-
    The temperature rises only between phase changes. It stays flat at 0°C while the ice melts ($Q = mL_f$) and at 100°C while the water boils ($Q = mL_v$), which is the longest stage because $L_v$ is so large. That is the shape of the heating curve in the lesson.
- id: phys-m7-r2-q14
  lesson: phys-heat
  module_quiz: true
  topic: Temperature and expansion
  stem: 'In which of these calculations must temperatures be in kelvins, not degrees Celsius? Select all that apply.'
  choices:
    - 'Pressure from the ideal gas law, $PV = nRT$'
    - 'Power radiated by a hot surface, $P = e\sigma AT^4$'
    - 'Heat to warm water, $Q = mc\Delta T$'
    - 'Thermal expansion of a rod, $\Delta L = \alpha L\Delta T$'
  answer: [0, 1]
  explanation: |-
    The gas law and the Stefan–Boltzmann law use the temperature itself, so they need the absolute (kelvin) scale. $Q = mc\Delta T$ and $\Delta L = \alpha L\Delta T$ use only a temperature difference, which is the same in kelvins and Celsius degrees.
- id: phys-m7-r2-q15
  lesson: phys-heat
  type: match
  topic: Heat and calorimetry
  stem: 'Match each situation to the main way heat is transferred.'
  pairs:
    - [A metal spoon handle heating up in hot soup, Conduction]
    - [Warm air from a heater spreading around a room, Convection]
    - [Sunlight warming your face, Radiation]
    - [Heat leaking through a single pane of window glass, Conduction]
  explanation: |-
    Heat moves through a solid (the spoon, the glass) by conduction. A moving fluid carrying heat with it (warm air rising and circulating) is convection. Sunlight crosses the vacuum of space, so it can only be radiation.

# ---------- Lesson 27: Ideal gases and kinetic theory ----------
- id: phys-m7-r2-q16
  lesson: phys-gases
  type: text
  module_quiz: true
  topic: Ideal gas law
  stem: 'At constant temperature, a gas at 2.0 atm is compressed from 9.0 L to 3.0 L. Its new pressure is ___ atm. Give only the number.'
  accept: ['6', '6.0']
  explanation: |-
    Boyle's law: $P_1V_1 = P_2V_2$, so $P_2 = 2.0(9.0/3.0) = 6.0$ atm. A third of the volume means three times the pressure.
- id: phys-m7-r2-q17
  lesson: phys-gases
  type: match
  topic: Ideal gas law
  stem: 'For a fixed amount of gas, match each law to the condition it needs.'
  pairs:
    - [Boyle's law, Temperature held constant]
    - [Charles's law, Pressure held constant]
    - [Gay-Lussac's law, Volume held constant]
    - [Combined gas law, Nothing held constant]
  distractors: [Number of molecules changing]
  explanation: |-
    Boyle: $P_1V_1 = P_2V_2$ at constant $T$. Charles: $V/T$ constant at constant $P$. Gay-Lussac: $P/T$ constant at constant $V$. The combined law $P_1V_1/T_1 = P_2V_2/T_2$ covers any change of a fixed amount of gas. None of them allows the amount of gas to change; for that you need $PV = nRT$ with the new $n$.
- id: phys-m7-r2-q18
  lesson: phys-gases
  module_quiz: true
  topic: Kinetic theory
  stem: 'Helium and nitrogen are held at the same temperature. Which of these are the same for both gases? Select all that apply.'
  choices:
    - 'The average translational kinetic energy per molecule'
    - 'The rms speed of the molecules'
    - 'The mass of one molecule'
    - 'The ratio $PV/(nT)$'
  answer: [0, 3]
  explanation: |-
    $\tfrac12m\overline{v^2} = \tfrac32k_BT$ depends only on temperature, and $PV/(nT) = R$ for every ideal gas. Helium atoms are 7 times lighter than N₂ molecules, so with the same kinetic energy they move faster: $v_{\text{rms}} = \sqrt{3RT/M}$ is larger for helium.
- id: phys-m7-r2-q19
  lesson: phys-gases
  type: order
  topic: Kinetic theory
  stem: 'Put these gases in order from slowest to fastest rms molecular speed, all at the same temperature.'
  items:
    - 'Carbon dioxide, CO₂ (44 g/mol)'
    - 'Oxygen, O₂ (32 g/mol)'
    - 'Nitrogen, N₂ (28 g/mol)'
    - 'Helium, He (4 g/mol)'
  explanation: |-
    At the same temperature, $v_{\text{rms}} = \sqrt{3RT/M}$, so the heaviest molecules are slowest. Ordering by molar mass from largest to smallest gives CO₂, O₂, N₂, He.
- id: phys-m7-r2-q20
  lesson: phys-gases
  type: text
  topic: Kinetic theory
  stem: 'The absolute temperature of a gas is multiplied by 4. Its rms molecular speed becomes ___ times as large. Give only the number.'
  accept: ['2', two]
  explanation: |-
    $v_{\text{rms}} = \sqrt{3RT/M} \propto \sqrt T$, and $\sqrt4 = 2$. The average kinetic energy is 4 times as large, but speed goes as the square root of energy.

# ---------- Lesson 28: The first law of thermodynamics ----------
- id: phys-m7-r2-q21
  lesson: phys-first-law
  type: label
  topic: First law of thermodynamics
  stem: 'A gas in a cylinder is heated and lifts a weight. Name the numbered parts.'
  image: {src: images/phys-m7-piston-blank.svg, alt: 'A cylinder on a hot plate, with five numbered parts: the space inside the cylinder, the movable plate near the top of the cylinder, the block held up on a rod above it, an upward arrow beside the cylinder, and one of the upward arrows rising from the hot plate into the cylinder.'}
  labels:
    - {x: 38.5, y: 61.2, text: Gas (the system)}
    - {x: 26.0, y: 39.4, text: Piston}
    - {x: 38.5, y: 12.1, text: Weight being lifted}
    - {x: 65.4, y: 30.3, text: Work done by the gas}
    - {x: 49.0, y: 78.2, text: Heat flowing in}
  distractors: [Heat flowing out, Work done on the gas]
  explanation: |-
    The gas (1) is the system. Heat $Q$ flows into it from the hot plate (5). As it expands it pushes the piston (2) up and lifts the weight (3), doing positive work $W$ on its surroundings (4). Then $\Delta E_{\text{int}} = Q - W$.
- id: phys-m7-r2-q22
  lesson: phys-first-law
  type: text
  module_quiz: true
  topic: First law of thermodynamics
  stem: 'A gas absorbs 650 J of heat and does 250 J of work on its surroundings. Its internal energy changes by ___ J. Give only the number, with a minus sign if it decreases.'
  accept: ['400', '+400']
  explanation: |-
    $\Delta E_{\text{int}} = Q - W = 650 - 250 = +400$ J: the energy that came in as heat and did not leave as work stays in the gas. (Adding them, 900 J, is the sign mistake.)
- id: phys-m7-r2-q23
  lesson: phys-first-law
  type: match
  module_quiz: true
  topic: First law of thermodynamics
  stem: 'Match each process to the statement that is true of it for an ideal gas.'
  pairs:
    - [Isobaric, The pressure stays constant]
    - [Isochoric, The gas does no work]
    - [Isothermal, The internal energy does not change]
    - [Adiabatic, No heat flows in or out]
  distractors: [The entropy of the universe decreases]
  explanation: |-
    Isobaric means constant pressure. Isochoric means constant volume, so $W = 0$. Isothermal means constant temperature, and an ideal gas's internal energy depends only on $T$, so $\Delta E_{\text{int}} = 0$. Adiabatic means $Q = 0$. No real process decreases the entropy of the universe.
- id: phys-m7-r2-q24
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'An ideal gas expands isothermally. Which statements are true? Select all that apply.'
  choices:
    - 'The gas absorbs heat'
    - 'The gas does positive work on its surroundings'
    - 'The internal energy of the gas increases'
    - 'The pressure of the gas stays constant'
  answer: [0, 1]
  explanation: |-
    Expanding, the gas does positive work. Its temperature is fixed, so $\Delta E_{\text{int}} = 0$, and the first law gives $Q = W > 0$: it absorbs exactly as much heat as the work it does. With $T$ fixed, $PV$ is constant, so the pressure falls as the volume grows.
- id: phys-m7-r2-q25
  lesson: phys-first-law
  type: order
  topic: First law of thermodynamics
  stem: 'Samples of the same ideal gas start in the same state and expand to the same final volume by three different processes. Put the processes in order from least to most work done by the gas.'
  items:
    - 'Adiabatic expansion'
    - 'Isothermal expansion'
    - 'Expansion at constant pressure'
  explanation: |-
    Work is the area under each path on the PV diagram. At constant pressure the path stays at the starting pressure (most area). On an isotherm the pressure falls as $1/V$. On an adiabat it falls faster still, because the gas also cools, so it has the least area under it.

# ---------- Lesson 29: Heat engines, entropy, and the second law ----------
- id: phys-m7-r2-q26
  lesson: phys-second-law
  type: label
  topic: Heat engines
  stem: 'Name the numbered parts of this energy-flow diagram of a heat engine.'
  image: {src: images/phys-m7-engine-blank.svg, alt: 'An energy-flow diagram with five numbered parts: a box at the top, a box at the bottom, a thick arrow from the top box down into a circle, a thinner arrow leaving the circle to the right, and an arrow from the circle down to the bottom box.'}
  labels:
    - {x: 46.9, y: 12.6, text: Hot reservoir}
    - {x: 46.9, y: 82.1, text: Cold reservoir}
    - {x: 46.9, y: 26.8, text: Heat taken in from the hot reservoir}
    - {x: 78.1, y: 47.4, text: Work output}
    - {x: 46.9, y: 66.3, text: Heat exhausted to the cold reservoir}
  distractors: [Work input]
  explanation: |-
    An engine takes heat $Q_H$ (3) from the hot reservoir (1), turns part of it into work $W$ (4), and exhausts the rest, $Q_C$ (5), to the cold reservoir (2), so $W = Q_H - Q_C$. Work goes in only for a refrigerator or heat pump.
- id: phys-m7-r2-q27
  lesson: phys-second-law
  type: text
  module_quiz: true
  topic: Heat engines
  stem: 'A Carnot engine runs between reservoirs at 500 K and 300 K. Its efficiency is ___ %. Give only the number.'
  accept: ['40', '40.0']
  explanation: |-
    $e = 1 - T_C/T_H = 1 - 300/500 = 0.40$, or 40%. No engine working between these temperatures can do better.
- id: phys-m7-r2-q28
  lesson: phys-second-law
  type: order
  module_quiz: true
  topic: Heat engines
  stem: 'Put the four steps of a Carnot cycle in order, starting with the step in which the gas absorbs heat.'
  items:
    - 'Isothermal expansion at the hot temperature'
    - 'Adiabatic expansion, cooling the gas to the cold temperature'
    - 'Isothermal compression at the cold temperature'
    - 'Adiabatic compression, warming the gas to the hot temperature'
  explanation: |-
    Heat enters only during the hot isothermal expansion. The gas then expands adiabatically and cools to $T_C$, gives up $Q_C$ while being compressed at $T_C$, and is compressed adiabatically back up to $T_H$, ready to start again.
- id: phys-m7-r2-q29
  lesson: phys-second-law
  topic: Entropy
  stem: 'Which statements agree with the second law of thermodynamics? Select all that apply.'
  choices:
    - 'No cyclic device can turn heat completely into work'
    - 'The total entropy of an isolated system never decreases'
    - 'The entropy of any object can never decrease'
    - 'A refrigerator''s coefficient of performance can never be more than 1'
  answer: [0, 1]
  explanation: |-
    The first is the Kelvin–Planck statement and the second the entropy statement. An object's entropy can decrease (water freezing in a freezer) as long as the total increases. A refrigerator's COP is often 2 to 6, because it moves heat rather than converting it; only an engine's efficiency is limited to below 1.
- id: phys-m7-r2-q30
  lesson: phys-second-law
  type: match
  topic: Heat engines
  stem: 'Match each expression to what it gives.'
  pairs:
    - ['$1 - T_C/T_H$', Highest possible efficiency of an engine]
    - ['$Q_C/W$', Coefficient of performance of a refrigerator]
    - ['$Q/T$', Entropy change for heat transferred at constant temperature]
    - ['$Q_H - Q_C$', Work done by an engine in one cycle]
  distractors: [Heat absorbed from the cold reservoir by an engine]
  explanation: |-
    $1 - T_C/T_H$ is the Carnot limit (kelvins). A refrigerator's COP is the heat removed per unit of work, $Q_C/W$. $\Delta S = Q/T$ at constant $T$. The first law over a cycle gives $W = Q_H - Q_C$. An engine rejects heat to the cold reservoir; it does not absorb heat from it.

# ---------- Honors 29h1: Real fluids ----------
- id: phys-m7-r2-h01
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'A flat plate of area 0.10 m² slides at 0.50 m/s on a 1.0 mm layer of oil with viscosity 0.20 Pa·s. What force keeps it moving at constant speed?'
  choices: ['0.010 N', '10 N', '40 N', '1.0 N']
  answer: 1
  explanation: |-
    $F = \eta Av/d = (0.20)(0.10)(0.50)/(1.0\times10^{-3}) = 10$ N. Leaving the thickness in millimeters gives 0.010 N; dividing by $v$ instead of multiplying gives 40 N; using 10 mm for the film gives 1.0 N.
- id: phys-m7-r2-h02
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'Plaque narrows an artery''s radius by 10%. If the pressure difference along it stays the same and the flow is laminar, the blood flow becomes about'
  choices: ['90% of its old value', '81% of its old value', '73% of its old value', '66% of its old value']
  answer: 3
  explanation: |-
    Poiseuille: $Q \propto R^4$, and $0.9^4 = 0.66$. A 10% narrower vessel carries about a third less blood. (81% and 73% come from $0.9^2$ and $0.9^3$.) In practice the body partly compensates by raising blood pressure.
- id: phys-m7-r2-h03
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'A needle is replaced by one of the same length with half the inner radius. To keep the same flow rate of medicine, the pressure difference must be multiplied by'
  choices: ['2', '4', '16', '8']
  answer: 2
  explanation: |-
    $\Delta P = Q\,\dfrac{8\eta L}{\pi R^4}$. Halving $R$ multiplies $1/R^4$ by $2^4 = 16$, so the same $Q$ needs 16 times the pressure difference.
- id: phys-m7-r2-h04
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'Water (density 1000 kg/m³, viscosity $1.0\times10^{-3}$ Pa·s) flows at 0.50 m/s through a pipe 2.5 cm in diameter. What is the Reynolds number, and what kind of flow is it?'
  choices: ['12 500, turbulent', '12 500, laminar', '12.5, laminar', '1250, laminar']
  answer: 0
  explanation: |-
    $\text{Re} = \rho vD/\eta = (1000)(0.50)(0.025)/(1.0\times10^{-3}) = 12\,500$, well above about 4000, so the flow is turbulent. 12.5 comes from taking the viscosity as 1.0 instead of $1.0\times10^{-3}$; 1250 from converting 2.5 cm to 0.0025 m.
- id: phys-m7-r2-h05
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'Two water droplets fall through still air, both slowly enough for Stokes''s law to apply. One has 3 times the radius of the other. Its terminal speed is'
  choices: ['3 times as large', '9 times as large', '27 times as large', 'the same']
  answer: 1
  explanation: |-
    $v_T = \dfrac{2r^2(\rho_s - \rho_f)g}{9\eta} \propto r^2$, so tripling $r$ gives $3^2 = 9$ times the speed. Weight grows as $r^3$ but Stokes drag only as $r$, so bigger drops fall faster.
- id: phys-m7-r2-h06
  lesson: phys-m7-h-real-fluids
  topic: Surface tension
  stem: 'Water rises 3.0 cm in a clean glass tube. In a tube with half the inner radius, it rises'
  choices: ['1.5 cm', '3.0 cm', '12 cm', '6.0 cm']
  answer: 3
  explanation: |-
    $h = 2\gamma\cos\theta/(\rho gr) \propto 1/r$, so half the radius gives twice the rise: 6.0 cm. The upward pull grows with the circumference ($\propto r$) but the weight to hold up grows with the area ($\propto r^2$).
- id: phys-m7-r2-h07
  lesson: phys-m7-h-real-fluids
  topic: Surface tension
  stem: 'How high does water (surface tension 0.073 N/m, contact angle 0°) rise in a clean glass tube of inner radius 0.50 mm? ($g = 9.8$ m/s²)'
  choices: ['1.5 cm', '3.0 cm', '30 cm', '6.0 cm']
  answer: 1
  explanation: |-
    $h = \dfrac{2\gamma\cos\theta}{\rho gr} = \dfrac{2(0.073)(1)}{(1000)(9.8)(5.0\times10^{-4})} = 0.030$ m $= 3.0$ cm. Dropping the 2 gives 1.5 cm; using 0.05 mm for the radius gives 30 cm; using $4\gamma$ (as for a bubble) gives 6.0 cm.
- id: phys-m7-r2-h08
  lesson: phys-m7-h-real-fluids
  topic: Surface tension
  stem: 'A soap bubble of radius 2.0 cm is made from a solution with surface tension 0.025 N/m. How much higher is the pressure inside than outside?'
  choices: ['2.5 Pa', '0.050 Pa', '5.0 Pa', '10 Pa']
  answer: 2
  explanation: |-
    A soap film has two surfaces, so $\Delta P = 4\gamma/r = 4(0.025)/0.020 = 5.0$ Pa. Using $2\gamma/r$ (a drop, one surface) gives 2.5 Pa; leaving $r$ in centimeters gives 0.050 Pa.
- id: phys-m7-r2-h09
  lesson: phys-m7-h-real-fluids
  type: text
  topic: Viscosity and drag
  stem: 'The dimensionless quantity $\rho vD/\eta$, which predicts whether flow in a pipe is laminar or turbulent, is called the ___ number.'
  accept: [Reynolds, Reynolds', Reynold's, Reynold]
  explanation: |-
    The Reynolds number, named for Osborne Reynolds, who studied the change from smooth to turbulent pipe flow in the 1880s. Pipe flow is usually laminar below about 2000 and turbulent above about 4000.
- id: phys-m7-r2-h10
  lesson: phys-m7-h-real-fluids
  type: order
  topic: Viscosity and drag
  stem: 'Put these fluids in order from least to most viscous, all at about room temperature.'
  items: [Air, Water, Olive oil, Honey]
  explanation: |-
    Roughly: air $1.8\times10^{-5}$ Pa·s, water $1.0\times10^{-3}$, olive oil 0.08 and honey several Pa·s. Each step is a factor of about 25 to 100 or more.
- id: phys-m7-r2-h11
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'Which changes make flow through a pipe more likely to be laminar? Select all that apply.'
  choices:
    - 'Using a more viscous fluid'
    - 'Slowing the flow down'
    - 'Using a wider pipe at the same speed'
    - 'Using a denser fluid with the same viscosity'
  answer: [0, 1]
  explanation: |-
    Flow is laminar when $\text{Re} = \rho vD/\eta$ is small. Larger $\eta$ or smaller $v$ lowers Re. A wider pipe or a denser fluid raises Re, making turbulence more likely.
- id: phys-m7-r2-h12
  lesson: phys-m7-h-real-fluids
  type: label
  topic: Surface tension
  stem: 'Narrow glass tubes stand in water (left) and mercury (right). Name the numbered features.'
  image: {src: images/phys-m7-capillary-blank.svg, alt: 'Two beakers with a narrow tube in each, with four numbered features: the curved top of the liquid in the left tube, the curved top of the liquid in the right tube, the arrow measuring how far the left liquid stands above the outside level, and the arrow measuring how far the right liquid stands below the outside level.'}
  labels:
    - {x: 23.3, y: 26.7, text: Concave meniscus}
    - {x: 66.7, y: 74.6, text: Convex meniscus}
    - {x: 19.2, y: 41.3, text: Capillary rise}
    - {x: 70.8, y: 66.7, text: Capillary depression}
  distractors: [Vapor bubble, Air gap]
  explanation: |-
    Water wets glass (contact angle near 0°): its meniscus curves down in the middle (concave, 1) and it rises in the tube (3). Mercury doesn't wet glass (about 140°): its meniscus bulges up (convex, 2) and it sits below the outside level (4), since $h = 2\gamma\cos\theta/(\rho gr)$ is negative when $\theta > 90°$.
- id: phys-m7-r2-h13
  lesson: phys-m7-h-real-fluids
  type: match
  topic: Surface tension
  stem: 'Match each quantity to its meaning.'
  pairs:
    - [Viscosity, Internal friction between layers of a moving fluid]
    - [Surface tension, Force per unit length along a liquid surface]
    - [Reynolds number, Compares a fluid's inertia with its viscous friction]
    - [Contact angle, Angle at which a liquid surface meets a solid wall]
  distractors: [Pressure difference per unit length of pipe]
  explanation: |-
    Viscosity $\eta$ resists layers sliding past each other; surface tension $\gamma$ is in N/m (or J/m²); the Reynolds number $\rho vD/\eta$ predicts laminar versus turbulent flow; the contact angle $\theta$ decides whether a liquid rises or falls in a narrow tube.
- id: phys-m7-r2-h14
  lesson: phys-m7-h-real-fluids
  topic: Viscosity and drag
  stem: 'Why can fog hang in the air for hours?'
  choices:
    - 'Its droplets are so small that their terminal speed is only about a centimeter per second or less'
    - 'The droplets are less dense than air'
    - 'Surface tension holds the droplets up'
    - 'Air has no viscosity at the scale of a droplet'
  answer: 0
  explanation: |-
    By Stokes's law $v_T \propto r^2$; a 10 µm droplet settles at about 1.2 cm/s, so gentle air currents keep it aloft. Water is about 800 times denser than air, surface tension only shapes the drop, and it is air's viscosity that slows the fall.

# ---------- Honors 29h2: Engine cycles ----------
- id: phys-m7-r2-h15
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'A monatomic ideal gas runs a rectangular cycle: A (100 kPa, 2.0 L) → B (200 kPa, 2.0 L) → C (200 kPa, 5.0 L) → D (100 kPa, 5.0 L) → A. What is its efficiency? (1 kPa·L = 1 J)'
  choices: ['20%', '80%', '17%', '100%']
  answer: 2
  explanation: |-
    Net work = area $= (100)(3.0) = 300$ J. Heat in: A → B, $\tfrac32V\Delta P = 1.5(2.0)(100) = 300$ J; B → C, $\tfrac52P\Delta V = 2.5(200)(3.0) = 1500$ J; total 1800 J. $e = 300/1800 = 17\%$. Dividing by the B → C heat alone gives 20%; 80% is the Carnot limit between the hottest point C and the coldest point A ($PV$ = 1000 and 200); 100% comes from dividing by the net heat, which equals the net work.
- id: phys-m7-r2-h16
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'Why is an engine''s efficiency computed as net work divided by the heat taken in, rather than by the net heat?'
  choices:
    - 'The net heat is always negative'
    - 'Over a full cycle the net heat equals the net work, so the ratio would always be 100%'
    - 'The net heat cannot be measured'
    - 'The heat taken in includes the work done on the gas'
  answer: 1
  explanation: |-
    Over a cycle $\Delta E_{\text{int}} = 0$, so $Q_{\text{net}} = W_{\text{net}}$. Efficiency asks what fraction of the heat you had to supply came out as work, so the denominator is the heat taken in, $Q_{\text{in}}$.
- id: phys-m7-r2-h17
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'What is the ideal Otto-cycle efficiency for a compression ratio of 8, with $\gamma = 1.4$?'
  choices: ['44%', '88%', '95%', '56%']
  answer: 3
  explanation: |-
    $e = 1 - 1/r^{\gamma - 1} = 1 - 8^{-0.4} = 1 - 0.435 = 0.565$, about 56%. 88% is $1 - 1/8$ (forgot the exponent), 95% uses $r^\gamma$, and 44% is the fraction of the heat rejected.
- id: phys-m7-r2-h18
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'Air ($\gamma = 1.4$) at 300 K is compressed adiabatically to one-ninth of its volume. Its temperature becomes about'
  choices: ['2700 K', '722 K', '900 K', '6500 K']
  answer: 1
  explanation: |-
    $TV^{\gamma - 1}$ is constant, so $T_2 = 300(9)^{0.4} = 722$ K. 2700 K multiplies by the full compression ratio, 900 K uses an exponent of 0.5, and 6500 K uses $9^{1.4}$.
- id: phys-m7-r2-h19
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'A diesel engine has no spark plugs. What ignites its fuel?'
  choices:
    - 'Heat conducted from the exhaust'
    - 'A glowing catalyst in the cylinder head'
    - 'Air heated by rapid, nearly adiabatic compression to well above the fuel''s ignition temperature'
    - 'Friction between the piston and the cylinder wall'
  answer: 2
  explanation: |-
    With a compression ratio near 18, adiabatic compression heats the air to roughly 900 K or more, far above the temperature at which diesel fuel ignites by itself, so the fuel catches fire as soon as it is injected. (Some diesels use glow plugs only to help cold starts.)
- id: phys-m7-r2-h20
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'A higher compression ratio would raise a gasoline engine''s ideal efficiency. What mainly limits how high it can be?'
  choices:
    - 'The fuel-air mixture would ignite by itself before the spark (knock)'
    - 'The second law forbids ratios above 10'
    - 'The gas would be cooled too much by compression'
    - 'Higher ratios lower the ideal Otto efficiency'
  answer: 0
  explanation: |-
    Compression heats the mixture; too much and it ignites on its own, an uncontrolled burn called knock that can damage the engine. Diesel engines avoid this by compressing air alone. Compression heats a gas, and the Otto efficiency rises with $r$.
- id: phys-m7-r2-h21
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'Why does a real gasoline engine reach well below its ideal Otto efficiency? Select all that apply.'
  choices:
    - 'Friction between moving parts'
    - 'Heat leaking out through the cylinder walls during the cycle'
    - 'The first law of thermodynamics does not apply to real engines'
    - 'A real engine has no cold reservoir to reject heat to'
  answer: [0, 1]
  explanation: |-
    Friction and heat leaks (along with burning that takes time and real-gas effects) waste energy. The first law always applies, and a real engine does reject heat, to the outside air through the exhaust and radiator.
- id: phys-m7-r2-h22
  lesson: phys-m7-h-engine-cycles
  type: order
  topic: Engine cycles
  stem: 'Put the four strokes of a gasoline engine in order, starting with the intake stroke.'
  items: [Intake, Compression, Power, Exhaust]
  explanation: |-
    Intake draws in fuel and air, compression squeezes it, the spark fires and the power stroke pushes the piston down, and exhaust clears the cylinder for the next intake.
- id: phys-m7-r2-h23
  lesson: phys-m7-h-engine-cycles
  type: label
  topic: Refrigeration
  stem: 'Name the numbered parts of this refrigerator loop.'
  image: {src: images/phys-m7-fridge-loop-blank.svg, alt: 'A closed loop of tubing with four numbered parts: zigzag coils along the top in a warm-colored region with a heat arrow leaving upward, a round unit on the right side with an arrow of work going in, a small bow-tie shaped part on the left side, and zigzag coils along the bottom in a cool-colored region with a heat arrow entering from below.'}
  labels:
    - {x: 50.0, y: 22.5, text: Condenser}
    - {x: 81.2, y: 47.5, text: Compressor}
    - {x: 18.8, y: 47.5, text: Expansion valve}
    - {x: 50.0, y: 72.5, text: Evaporator}
  distractors: [Spark plug, Turbine]
  explanation: |-
    The compressor (2) takes in work and squeezes the refrigerant vapor, making it hot. In the condenser (1) it gives heat $Q_H$ to the room and liquefies. The expansion valve (3) drops its pressure, chilling it, and in the evaporator (4) inside the fridge it absorbs $Q_C$ from the food and boils.
- id: phys-m7-r2-h24
  lesson: phys-m7-h-engine-cycles
  type: order
  topic: Refrigeration
  stem: 'Refrigerant leaves the evaporator as a cool, low-pressure vapor. Put what happens to it next in order.'
  items:
    - 'It is compressed into a hot, high-pressure vapor'
    - 'It gives off heat to the room and condenses to a liquid'
    - 'It passes through a narrow valve and its pressure drops, chilling it'
    - 'It absorbs heat from inside the fridge and evaporates'
  explanation: |-
    Compressor, condenser, expansion valve, evaporator, and back to the compressor. Heat leaves at the condenser (high temperature) and enters at the evaporator (low temperature), which is possible only because the compressor does work.
- id: phys-m7-r2-h25
  lesson: phys-m7-h-engine-cycles
  type: text
  topic: Engine cycles
  stem: 'The ideal Otto efficiency is $1 - 1/r^{\gamma - 1}$, where $r = V_{\max}/V_{\min}$ is called the ___ ratio.'
  accept: [compression]
  explanation: |-
    The compression ratio compares the cylinder's volume with the piston at the bottom of its stroke to the volume at the top. Most gasoline car engines use about 9 to 14, diesels about 15 to 22.
- id: phys-m7-r2-h26
  lesson: phys-m7-h-engine-cycles
  type: match
  topic: Engine cycles
  stem: 'Match each step of the ideal Otto cycle to what happens in it.'
  pairs:
    - ['1 → 2: adiabatic compression', No heat flow; work is done on the gas]
    - ['2 → 3: constant-volume heating', Heat is absorbed; no work is done]
    - ['3 → 4: adiabatic expansion', No heat flow; the gas does work]
    - ['4 → 1: constant-volume cooling', Heat is rejected; no work is done]
  distractors: [Heat is absorbed at constant temperature]
  explanation: |-
    Adiabatic steps have $Q = 0$; compression takes work in and expansion (the power stroke) gives work out. Constant-volume steps do no work; heat enters when the fuel burns (2 → 3) and leaves with the exhaust (4 → 1). Heat absorbed at constant temperature belongs to the Carnot cycle.
- id: phys-m7-r2-h27
  lesson: phys-m7-h-engine-cycles
  topic: Refrigeration
  stem: 'A refrigerator with a coefficient of performance of 3.0 removes 90 kJ of heat from its interior. How much electrical energy does it use, and how much heat does it release into the kitchen?'
  choices: ['30 kJ used, 120 kJ released', '30 kJ used, 60 kJ released', '270 kJ used, 360 kJ released', '30 kJ used, 90 kJ released']
  answer: 0
  explanation: |-
    $W = Q_C/K = 90/3.0 = 30$ kJ, and $Q_H = Q_C + W = 120$ kJ. Subtracting the work instead of adding gives 60 kJ; multiplying by the COP gives 270 kJ.
- id: phys-m7-r2-h28
  lesson: phys-m7-h-engine-cycles
  topic: Engine cycles
  stem: 'According to the ideal Otto-cycle formula, which would raise the efficiency? Select all that apply.'
  choices:
    - 'A higher compression ratio'
    - 'A working gas with a larger $\gamma$'
    - 'Burning more fuel in each cycle'
    - 'A larger engine with the same compression ratio'
  answer: [0, 1]
  explanation: |-
    $e = 1 - 1/r^{\gamma - 1}$ depends only on $r$ and $\gamma$, and grows with both. More fuel or a bigger engine gives more work per cycle, but at the same efficiency in this model.

# ---------- Honors 29h3: Insulation, radiation, and a planet's temperature ----------
- id: phys-m7-r2-h29
  lesson: phys-m7-h-radiation-balance
  topic: Insulation and radiation
  stem: 'A 12 m² wall has two layers with thermal resistances 0.50 and 2.0 m²·K/W. The temperature difference across it is 20 K. At what rate does heat flow through it?'
  choices: ['600 W', '120 W', '480 W', '96 W']
  answer: 3
  explanation: |-
    The layers are in series, so $R = 0.50 + 2.0 = 2.5$ m²·K/W and $Q/t = A\Delta T/R = (12)(20)/2.5 = 96$ W. Combining them like parallel resistors ($R = 0.40$) gives 600 W; ignoring the thinner layer gives 120 W; multiplying by $R$ gives 480 W.
- id: phys-m7-r2-h30
  lesson: phys-m7-h-radiation-balance
  topic: Insulation and radiation
  stem: 'What is the thermal resistance per unit area of a 5.0 cm layer of foam with thermal conductivity 0.025 W/(m·K)?'
  choices: ['2.0 m²·K/W', '0.0013 m²·K/W', '200 m²·K/W', '0.50 m²·K/W']
  answer: 0
  explanation: |-
    $R = L/k = 0.050/0.025 = 2.0$ m²·K/W. Using 5.0 instead of 0.050 m gives 200; computing $k/L$ gives 0.50; $kL$ gives 0.0013.
- id: phys-m7-r2-h31
  lesson: phys-m7-h-radiation-balance
  topic: Insulation and radiation
  stem: 'An object of area 0.50 m² and emissivity 0.90 is at 400 K in surroundings at 300 K. What net power does it lose by radiation? ($\sigma = 5.67\times10^{-8}$ W/(m²·K⁴))'
  choices: ['2.6 W', '650 W', '450 W', '496 W']
  answer: 2
  explanation: |-
    $P = e\sigma A(T^4 - T_s^4) = (0.90)(5.67\times10^{-8})(0.50)(400^4 - 300^4) = 2.55\times10^{-8}(1.75\times10^{10}) = 450$ W. Using $(400 - 300)^4$ gives 2.6 W; forgetting the absorbed radiation (using $400^4$ alone) gives 650 W; leaving out the emissivity gives 496 W.
- id: phys-m7-r2-h32
  lesson: phys-m7-h-radiation-balance
  topic: Insulation and radiation
  stem: 'If a star''s surface temperature (in kelvins) were doubled with its size unchanged, the power it radiates would be multiplied by'
  choices: ['2', '4', '8', '16']
  answer: 3
  explanation: |-
    $P = e\sigma AT^4$, and $2^4 = 16$. The fourth power makes radiation extremely sensitive to temperature.
- id: phys-m7-r2-h33
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'Mars is 1.52 times as far from the Sun as Earth. The solar constant at Earth is 1361 W/m². About how intense is sunlight at Mars?'
  choices: ['895 W/m²', '590 W/m²', '3140 W/m²', '1361 W/m²']
  answer: 1
  explanation: |-
    Intensity falls as $1/d^2$: $1361/1.52^2 = 590$ W/m². Dividing by 1.52 only gives 895 W/m²; multiplying by $1.52^2$ gives 3140 W/m².
- id: phys-m7-r2-h34
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'In the equilibrium-temperature formula $T_e = [(1 - a)S/(4\sigma)]^{1/4}$, where does the factor of 4 come from?'
  choices:
    - 'The four seasons'
    - 'The fourth power in the Stefan–Boltzmann law'
    - 'The planet absorbs sunlight over a disk of area $\pi R^2$ but radiates from a sphere of area $4\pi R^2$'
    - 'Only a quarter of sunlight is visible light'
  answer: 2
  explanation: |-
    Setting $(1 - a)S\pi R^2 = 4\pi R^2\sigma T^4$ leaves $(1 - a)S/4$ on the left: averaged over the whole sphere, each square meter gets a quarter of the solar constant. The fourth power is why the result has a fourth root, not why there is a 4 in the denominator.
- id: phys-m7-r2-h35
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'Earth''s equilibrium temperature is 255 K with an albedo of 0.30. If the albedo rose to 0.35 with the same sunlight, the equilibrium temperature would be about'
  choices: ['237 K', '250 K', '255 K', '260 K']
  answer: 1
  explanation: |-
    $T_e \propto (1 - a)^{1/4}$, so $T = 255(0.65/0.70)^{1/4} = 250$ K. A brighter (more reflective) planet absorbs less sunlight and is cooler. 237 K would follow from $T \propto 1 - a$, forgetting the fourth root; 260 K has the change going the wrong way.
- id: phys-m7-r2-h36
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'In the one-layer greenhouse model, why is the surface warmer than the equilibrium temperature?'
  choices:
    - 'The atmosphere absorbs sunlight before it reaches the ground'
    - 'The surface receives infrared radiated down by the atmosphere in addition to sunlight'
    - 'The planet absorbs more energy than it radiates to space'
    - 'The atmosphere reflects sunlight back onto the surface'
  answer: 1
  explanation: |-
    The layer absorbs the surface's infrared and radiates half of its emission back down, so the surface absorbs $2F$ instead of $F$ and must reach $2^{1/4}T_e$. The planet as a whole still sends out exactly what it absorbs; in this model the layer is transparent to sunlight.
- id: phys-m7-r2-h37
  lesson: phys-m7-h-radiation-balance
  type: text
  topic: Planetary energy balance
  stem: 'The fraction of incoming sunlight that a planet reflects straight back to space is called its ___.'
  accept: [albedo, Bond albedo]
  explanation: |-
    Earth's albedo is about 0.30: clouds, ice, snow and deserts reflect strongly, oceans and forests weakly. It enters the energy balance as the factor $1 - a$.
- id: phys-m7-r2-h38
  lesson: phys-m7-h-radiation-balance
  type: text
  topic: Planetary energy balance
  stem: 'In the one-layer greenhouse model the surface temperature is $2^{1/4}$ times the equilibrium temperature. For $T_e = 255$ K, the surface temperature is ___ K. Give only the number, to the nearest kelvin.'
  accept: ['303']
  explanation: |-
    $2^{1/4} = 1.189$, and $1.189 \times 255 = 303$ K. The real average surface temperature, about 288 K, is lower, because the real atmosphere absorbs only part of the infrared and convection also carries heat upward.
- id: phys-m7-r2-h39
  lesson: phys-m7-h-radiation-balance
  type: order
  topic: Insulation and radiation
  stem: 'A wall is made of 1.2 cm of drywall ($k = 0.17$ W/(m·K)), 9.0 cm of fiberglass ($k = 0.040$) and 2.0 cm of wood ($k = 0.12$). Put the layers in order from largest to smallest temperature drop across them.'
  items: [Fiberglass, Wood, Drywall]
  explanation: |-
    The same heat flows through each layer, so each takes a share of the temperature drop proportional to its resistance $R = L/k$: fiberglass 2.25, wood 0.167, drywall 0.071 m²·K/W.
- id: phys-m7-r2-h40
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'Using the simple equilibrium-temperature model (no greenhouse effect), which changes would make a planet''s equilibrium temperature higher? Select all that apply.'
  choices:
    - 'Moving the planet closer to its star'
    - 'Lowering its albedo'
    - 'Making the planet larger'
    - 'Raising its albedo'
  answer: [0, 1]
  explanation: |-
    $T_e = [(1 - a)S/(4\sigma)]^{1/4}$. Closer means larger $S$; lower albedo means more sunlight absorbed. The radius cancels: a bigger planet absorbs more but also radiates more, in the same proportion.
- id: phys-m7-r2-h41
  lesson: phys-m7-h-radiation-balance
  type: match
  topic: Insulation and radiation
  stem: 'Match each term to its meaning.'
  pairs:
    - [Thermal resistance, A layer's thickness divided by its thermal conductivity]
    - [Albedo, Fraction of incoming sunlight reflected]
    - [Solar constant, Intensity of sunlight at Earth's distance from the Sun]
    - [Emissivity, How well a surface radiates compared with a perfect blackbody]
  distractors: [Total power the Sun radiates in all directions]
  explanation: |-
    $R = L/k$ (m²·K/W); albedo $a$ is about 0.30 for Earth; the solar constant is about 1361 W/m²; emissivity $e$ runs from 0 to 1. The Sun's total power, about $3.8\times10^{26}$ W, is its luminosity.
- id: phys-m7-r2-h42
  lesson: phys-m7-h-radiation-balance
  topic: Planetary energy balance
  stem: 'Sunlight peaks near 0.5 µm and Earth''s surface radiates most strongly near 10 µm. Why does that difference matter for the greenhouse effect?'
  choices:
    - 'Greenhouse gases absorb much of the infrared from the ground but let most visible sunlight through'
    - 'Longer wavelengths carry more energy per photon'
    - 'The difference means Earth absorbs no sunlight'
    - 'Infrared cannot travel through a vacuum'
  answer: 0
  explanation: |-
    By Wien's law the 5800 K Sun peaks in visible light and the 288 K ground in the infrared. Air is largely transparent to the first, while water vapor and CO₂ absorb strongly in parts of the second, so incoming energy gets in more easily than outgoing energy gets out. Longer wavelengths carry less energy per photon, and infrared crosses a vacuum like any light.
