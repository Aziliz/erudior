- id: phys-q-1501
  lesson: phys-rot-kin
  module_quiz: true
  topic: Rotational kinematics
  stem: 'A wheel turns at 120 rpm. What is its angular velocity in rad/s?'
  choices: ['2.0 rad/s', '12.6 rad/s', '754 rad/s', '720 rad/s']
  answer: 1
  explanation: |-
    $120\,\tfrac{\text{rev}}{\text{min}} \times \tfrac{2\pi\text{ rad}}{1\text{ rev}} \times \tfrac{1\text{ min}}{60\text{ s}} = 4\pi = 12.6$ rad/s. 2.0 is rev/s; 720 is degrees per second.
- id: phys-q-1502
  lesson: phys-rot-kin
  topic: Rotational kinematics
  stem: 'A wheel speeds up uniformly from rest to 20 rad/s in 5.0 s. How many revolutions does it make?'
  choices: ['50 rev', '4.0 rev', '8.0 rev', '16 rev']
  answer: 2
  explanation: |-
    $\Delta\theta = \tfrac12(\omega_0 + \omega)t = \tfrac12(0 + 20)(5.0) = 50$ rad $= 50/2\pi = 7.96 \approx 8.0$ rev. 50 is the answer in radians, not revolutions.
- id: phys-q-1503
  lesson: phys-rot-kin
  topic: Rotational kinematics
  stem: 'A disk of radius 0.40 m spins at 10 rad/s. What are the speed and centripetal acceleration of a point on its rim?'
  choices: ['4.0 m/s and 40 m/s²', '25 m/s and 250 m/s²', '4.0 m/s and 4.0 m/s²', '40 m/s and 4.0 m/s²']
  answer: 0
  explanation: |-
    $v = r\omega = 0.40(10) = 4.0$ m/s; $a_c = r\omega^2 = 0.40(100) = 40$ m/s² (equivalently $v^2/r$).
- id: phys-q-1504
  lesson: phys-rot-kin
  module_quiz: true
  topic: Moment of inertia
  stem: 'A hoop and a solid disk have the same mass and radius. About their central axes, which has the larger moment of inertia, and why?'
  choices: ['The disk, because it has more material', 'They are equal, because $I$ depends only on mass and radius', 'The disk, because its mass is spread over a larger area', 'The hoop, because all its mass is at the maximum distance from the axis']
  answer: 3
  explanation: |-
    $I = \sum mr^2$ weights mass by the square of its distance from the axis. The hoop has $I = MR^2$; the disk, with much of its mass nearer the center, has $\tfrac12MR^2$.
- id: phys-q-1505
  lesson: phys-rot-kin
  topic: Moment of inertia
  stem: 'A uniform rod of mass 3.0 kg and length 2.0 m rotates about one end. Use the parallel-axis theorem to find its moment of inertia.'
  choices: ['1.0 kg·m²', '4.0 kg·m²', '3.0 kg·m²', '12 kg·m²']
  answer: 1
  explanation: |-
    $I_{\text{cm}} = \tfrac1{12}ML^2 = 1.0$ kg·m². Shifting by $d = 1.0$ m: $I = 1.0 + 3.0(1.0)^2 = 4.0$ kg·m², matching $\tfrac13ML^2$.
- id: phys-q-1506
  lesson: phys-rot-kin
  topic: Moment of inertia
  stem: 'Two 2.0 kg masses are fixed to the ends of a light 2.0 m rod. What is the moment of inertia about the rod''s center?'
  choices: ['2.0 kg·m²', '8.0 kg·m²', '16 kg·m²', '4.0 kg·m²']
  answer: 3
  explanation: |-
    Each mass is 1.0 m from the center: $I = 2(2.0)(1.0)^2 = 4.0$ kg·m². Using the full rod length (2.0 m) as the distance gives 16 kg·m².
- id: phys-q-1507
  lesson: phys-rot-kin
  module_quiz: true
  topic: Moment of inertia
  stem: 'A 5.0 kg solid disk of radius 0.20 m spins at 20 rad/s. What is its rotational kinetic energy?'
  choices: ['20 J', '40 J', '10 J', '200 J']
  answer: 0
  explanation: |-
    $I = \tfrac12(5.0)(0.20)^2 = 0.10$ kg·m²; $K = \tfrac12I\omega^2 = \tfrac12(0.10)(400) = 20$ J. Using $I = MR^2$ gives 40 J.
- id: phys-q-1508
  lesson: phys-rot-kin
  topic: Rotational kinematics
  stem: 'Which quantity is the same for every point on a rigid wheel rotating about a fixed axle?'
  choices: ['Linear speed', 'Centripetal acceleration', 'Angular velocity', 'Distance traveled']
  answer: 2
  explanation: |-
    Every point turns through the same angle in the same time, so $\omega$ (and $\theta$, $\alpha$) are shared. Linear speed $r\omega$ and centripetal acceleration $r\omega^2$ grow with distance from the axis.
- id: phys-q-1509
  lesson: phys-rot-kin
  topic: Moment of inertia
  stem: 'Evaluating $I = \int r^2\,dm$ for a thin uniform rod of mass $M$ and length $L$ about its center gives'
  choices: ['$\tfrac13ML^2$', '$\tfrac1{12}ML^2$', '$\tfrac12ML^2$', '$ML^2$']
  answer: 1
  explanation: |-
    $\int_{-L/2}^{L/2}\tfrac{M}{L}x^2\,dx = \tfrac{M}{L}\cdot\tfrac{2(L/2)^3}{3} = \tfrac{ML^2}{12}$. $\tfrac13ML^2$ is about an end.
- id: phys-q-1510
  lesson: phys-rot-kin
  topic: Rotational kinematics
  stem: 'A turntable''s angle is $\theta(t) = 2t^3 - t^2$ rad. What is its angular acceleration at $t = 1$ s?'
  choices: ['10 rad/s²', '4 rad/s²', '1 rad/s²', '12 rad/s²']
  answer: 0
  explanation: |-
    $\omega = 6t^2 - 2t$ and $\alpha = 12t - 2$, so $\alpha(1) = 10$ rad/s². (4 rad/s is $\omega(1)$.)
- id: phys-q-1601
  lesson: phys-torque
  module_quiz: true
  topic: Torque
  stem: 'A 50 N force is applied at the end of a 0.25 m wrench, at $30^\circ$ to the handle. What torque does it produce?'
  choices: ['12.5 N·m', '10.8 N·m', '6.25 N·m', '200 N·m']
  answer: 2
  explanation: |-
    $\tau = rF\sin\theta = 0.25(50)\sin 30^\circ = 6.25$ N·m. Only the perpendicular component (25 N) turns the wrench; using cosine gives 10.8 N·m.
- id: phys-q-1602
  lesson: phys-torque
  topic: Torque
  stem: 'Where and in what direction should you push a door to open it with the least force?'
  choices: ['Near the hinges, perpendicular to the door', 'At the edge far from the hinges, perpendicular to the door', 'At the far edge, pushing toward the hinges', 'In the middle, at $45^\circ$']
  answer: 1
  explanation: |-
    Torque $= rF\sin\theta$ is largest for the largest $r$ and $\theta = 90^\circ$. Pushing toward the hinges gives zero torque.
- id: phys-q-1603
  lesson: phys-torque
  topic: Rotational dynamics
  stem: 'A 2.0 kg solid disk of radius 0.50 m on a frictionless axle has a 10 N force applied tangentially to its rim. What is its angular acceleration?'
  choices: ['10 rad/s²', '5.0 rad/s²', '20 rad/s²', '40 rad/s²']
  answer: 2
  explanation: |-
    $\tau = 0.50(10) = 5.0$ N·m; $I = \tfrac12(2.0)(0.50)^2 = 0.25$ kg·m²; $\alpha = \tau/I = 20$ rad/s². Using $I = MR^2$ gives 10 rad/s².
- id: phys-q-1604
  lesson: phys-torque
  module_quiz: true
  topic: Rotational dynamics
  stem: 'A 1.0 kg bucket hangs from a rope wound on a 2.0 kg solid cylinder (frictionless axle). What is the bucket''s acceleration? ($g = 9.8$ m/s²)'
  choices: ['9.8 m/s²', '3.3 m/s²', '6.5 m/s²', '4.9 m/s²']
  answer: 3
  explanation: |-
    $a = \dfrac{mg}{m + \tfrac12M} = \dfrac{9.8}{1.0 + 1.0} = 4.9$ m/s². 3.3 m/s² uses $m + M$, which would be right only for a hoop ($I = MR^2$), not a solid cylinder.
- id: phys-q-1605
  lesson: phys-torque
  topic: Rotational dynamics
  stem: 'Why are the rope tensions on the two sides of a pulley with mass different when the system accelerates?'
  choices: ['A net torque is needed to give the pulley angular acceleration', 'Friction in the rope changes the tension', 'The rope stretches more on one side', 'They are always equal; the difference is an approximation']
  answer: 0
  explanation: |-
    $(T_1 - T_2)R = I\alpha$. With $I > 0$ and $\alpha \ne 0$, the tensions must differ. Only a massless pulley has equal tensions.
- id: phys-q-1606
  lesson: phys-torque
  topic: Rotational dynamics
  stem: 'An engine produces 250 N·m of torque at 3000 rpm. What power is that?'
  choices: ['750 kW', '12.5 kW', '78.5 kW', '7.85 kW']
  answer: 2
  explanation: |-
    $\omega = 3000(2\pi/60) = 314$ rad/s; $P = \tau\omega = 250(314) = 78.5$ kW. Using rpm directly gives 750 kW.
- id: phys-q-1607
  lesson: phys-torque
  topic: Torque
  stem: 'A force $\vec F = 2\hat\imath + 5\hat\jmath$ N acts at $\vec r = 3\hat\imath + 1\hat\jmath$ m from an axis along $z$. What is $\tau_z$?'
  choices: ['17 N·m', '13 N·m', '11 N·m', '-13 N·m']
  answer: 1
  explanation: |-
    $\tau_z = xF_y - yF_x = 3(5) - 1(2) = 13$ N·m (counterclockwise). 17 adds the terms instead of subtracting.
- id: phys-q-1608
  lesson: phys-torque
  module_quiz: true
  topic: Rotational dynamics
  stem: 'Which equation is the rotational analog of $\sum F = ma$?'
  choices: ['$\sum\tau = I\omega$', '$\sum\tau = mr\alpha$', '$L = I\omega$', '$\sum\tau = I\alpha$']
  answer: 3
  explanation: |-
    Net torque produces angular acceleration in proportion to the moment of inertia: $\sum\tau = I\alpha$. $L = I\omega$ is the analog of $p = mv$.
- id: phys-q-1609
  lesson: phys-torque
  topic: Rotational dynamics
  stem: 'A constant 4.0 N·m torque turns a flywheel through 25 rad from rest. How much rotational kinetic energy does the flywheel gain (no friction)?'
  choices: ['100 J', '6.25 J', '50 J', '200 J']
  answer: 0
  explanation: |-
    $W = \tau\Delta\theta = 4.0(25) = 100$ J, and by the rotational work–energy theorem that all becomes $\tfrac12I\omega^2$.
- id: phys-q-1610
  lesson: phys-torque
  topic: Torque
  stem: 'By the right-hand rule, a wheel spinning counterclockwise when viewed from above has a torque or angular velocity vector pointing'
  choices: ['down', 'up', 'tangent to the rim', 'toward the center']
  answer: 1
  explanation: |-
    Curl the fingers of your right hand counterclockwise (seen from above): your thumb points up. Counterclockwise in the $xy$ plane corresponds to $+\hat k$.
- id: phys-q-1701
  lesson: phys-rolling
  module_quiz: true
  topic: Rolling motion
  stem: 'A solid sphere, a solid cylinder and a hoop roll without slipping from rest down the same incline. In what order do they reach the bottom?'
  choices: ['All together', 'Hoop, cylinder, sphere', 'Sphere, cylinder, hoop', 'Cylinder, sphere, hoop']
  answer: 2
  explanation: |-
    $v = \sqrt{2gh/(1 + c)}$ with $c = 0.4$ (sphere), $0.5$ (cylinder), $1$ (hoop). The smaller the fraction of energy tied up in rotation, the faster. Mass and radius don't matter.
- id: phys-q-1702
  lesson: phys-rolling
  topic: Rolling motion
  stem: 'A solid cylinder rolls without slipping from rest down a ramp 2.0 m high. What is its speed at the bottom? ($g = 9.8$ m/s²)'
  choices: ['6.3 m/s', '4.4 m/s', '5.6 m/s', '5.1 m/s']
  answer: 3
  explanation: |-
    $Mgh = \tfrac12(1 + \tfrac12)Mv^2$, so $v = \sqrt{\dfrac{2gh}{1.5}} = \sqrt{26.1} = 5.1$ m/s. 6.3 m/s ignores rotation.
- id: phys-q-1703
  lesson: phys-rolling
  topic: Rolling motion
  stem: 'A car tire rolls without slipping at 20 m/s. How fast is the top of the tire moving relative to the road?'
  choices: ['40 m/s', '20 m/s', '0 m/s', '10 m/s']
  answer: 0
  explanation: |-
    The top moves at $v_{\text{cm}} + R\omega = 2v_{\text{cm}} = 40$ m/s; the contact point is momentarily at rest.
- id: phys-q-1704
  lesson: phys-rolling
  topic: Rolling motion
  stem: 'For a ball rolling without slipping down a ramp, the work done by static friction is'
  choices: ['negative, slowing the ball', 'positive, speeding the ball up', 'equal to $\mu_s mgd$', 'zero, because the contact point does not slide']
  answer: 3
  explanation: |-
    Static friction acts at the contact point, which is instantaneously at rest, so it does no work. It redistributes energy between translation and rotation, and mechanical energy is conserved.
- id: phys-q-1705
  lesson: phys-rolling
  module_quiz: true
  topic: Angular momentum
  stem: 'A skater spinning at 3.0 rev/s with $I = 5.0$ kg·m² pulls in her arms, reducing $I$ to 1.5 kg·m². Her new spin rate is'
  choices: ['0.9 rev/s', '10 rev/s', '3.0 rev/s', '5.5 rev/s']
  answer: 1
  explanation: |-
    No external torque, so $I_i\omega_i = I_f\omega_f$: $\omega_f = (5.0/1.5)(3.0) = 10$ rev/s. 0.9 rev/s inverts the ratio.
- id: phys-q-1706
  lesson: phys-rolling
  topic: Angular momentum
  stem: 'When the skater above pulls her arms in, her rotational kinetic energy'
  choices: ['stays the same, because angular momentum is conserved', 'decreases', 'increases, because her muscles do work', 'becomes zero']
  answer: 2
  explanation: |-
    $K = L^2/(2I)$. With $L$ fixed and $I$ smaller, $K$ increases (here by a factor of 3.3). The energy comes from the work her arms do pulling mass inward.
- id: phys-q-1707
  lesson: phys-rolling
  topic: Angular momentum
  stem: 'A disk with $I = 0.020$ kg·m² spinning at 40 rad/s has an identical non-spinning disk dropped onto it; they spin together. What is the final angular speed?'
  choices: ['20 rad/s', '40 rad/s', '80 rad/s', '28 rad/s']
  answer: 0
  explanation: |-
    $I\omega = 2I\omega_f$, so $\omega_f = 20$ rad/s. (28 rad/s would conserve kinetic energy instead, which this "rotational sticking collision" doesn't.)
- id: phys-q-1708
  lesson: phys-rolling
  topic: Angular momentum
  stem: 'Kepler''s second law (equal areas in equal times) follows from conservation of'
  choices: ['energy', 'linear momentum', 'mass', 'angular momentum']
  answer: 3
  explanation: |-
    Gravity points toward the Sun, so it exerts no torque about the Sun. The planet's angular momentum $L = mvr_\perp$ is constant, and the area swept per unit time is $L/(2m)$.
- id: phys-q-1709
  lesson: phys-rolling
  topic: Angular momentum
  stem: 'A spinning gyroscope supported at one end of its axle doesn''t fall; its axle slowly circles horizontally. This happens because gravity''s torque'
  choices: ['is zero for a spinning object', 'is balanced by a centrifugal force', 'is perpendicular to $\vec L$, so it changes the direction of $\vec L$ rather than its size', 'increases the spin rate']
  answer: 2
  explanation: |-
    $\vec\tau = d\vec L/dt$. A torque perpendicular to $\vec L$ rotates $\vec L$ (precession) at rate $\Omega = \tau/L$.
- id: phys-q-1710
  lesson: phys-rolling
  module_quiz: true
  topic: Rolling motion
  stem: 'What fraction of a rolling solid sphere''s kinetic energy is rotational?'
  choices: ['2/5', '1/2', '2/7', '5/7']
  answer: 2
  explanation: |-
    $K_{\text{rot}} = \tfrac12\cdot\tfrac25MR^2\omega^2 = \tfrac15Mv^2$ and $K_{\text{total}} = \tfrac12(1.4)Mv^2 = 0.7Mv^2$. Ratio: $0.2/0.7 = 2/7$.
- id: phys-q-1801
  lesson: phys-equilibrium
  module_quiz: true
  topic: Static equilibrium
  stem: 'A 25 kg child sits 2.0 m from the center pivot of a uniform seesaw. Where must a 40 kg child sit to balance it?'
  choices: ['1.25 m from the pivot', '3.2 m from the pivot', '2.0 m from the pivot', '0.8 m from the pivot']
  answer: 0
  explanation: |-
    Equal torques: $25g(2.0) = 40g\,x$, so $x = 1.25$ m. The heavier child sits closer.
- id: phys-q-1802
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'Which conditions must hold for an extended rigid object to be in static equilibrium?'
  choices: ['Zero net force only', 'Zero net torque only', 'Zero net force and zero net torque', 'Zero velocity only']
  answer: 2
  explanation: |-
    Zero net force prevents translational acceleration and zero net torque prevents angular acceleration. Both are needed (two equal, opposite forces at different points give zero net force but a nonzero torque).
- id: phys-q-1803
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'A uniform 4.0 m, 100 N beam rests on supports at its ends. A 600 N load sits 1.0 m from the left end. What force does the right support exert?'
  choices: ['350 N', '500 N', '150 N', '200 N']
  answer: 3
  explanation: |-
    Torques about the left end: $F_R(4.0) = 100(2.0) + 600(1.0)$, so $F_R = 200$ N. Then $F_L = 700 - 200 = 500$ N. The support nearer the load carries more.
- id: phys-q-1804
  lesson: phys-equilibrium
  module_quiz: true
  topic: Static equilibrium
  stem: 'When solving for support forces, why is it smart to take torques about a point where an unknown force acts?'
  choices: ['Because that point is the center of mass', 'Because that force then has zero lever arm and drops out of the torque equation', 'Because torques are only zero about that point', 'Because forces there are always zero']
  answer: 1
  explanation: |-
    In equilibrium the net torque is zero about every point, so you may choose any pivot. Choosing one where an unknown acts eliminates it from that equation.
- id: phys-q-1805
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'A box on a ramp is about to tip over (rather than slide). At that moment its center of gravity is'
  choices: ['directly above the lower edge of its base', 'directly above the center of its base', 'below the ramp surface', 'above the upper edge of its base']
  answer: 0
  explanation: |-
    An object tips when gravity's line of action passes beyond the edge of its base. At the tipping point it passes exactly through the lower edge, so gravity's torque about that edge is zero.
- id: phys-q-1806
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'A uniform horizontal beam of weight $W$ is hinged at the wall and held by a cable from its far end at angle $\theta$ above the beam. The cable tension is'
  choices: ['$W$', '$\dfrac{W}{\sin\theta}$', '$\dfrac{W}{2\cos\theta}$', '$\dfrac{W}{2\sin\theta}$']
  answer: 3
  explanation: |-
    Torques about the hinge with beam length $L$: $T\sin\theta\cdot L = W\cdot\tfrac L2$, so $T = \dfrac{W}{2\sin\theta}$. The beam's weight acts at its center, not its end.
- id: phys-q-1807
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'In a hinged-beam problem, which forces can the hinge exert on the beam?'
  choices: ['Only a vertical force', 'Only a force along the beam', 'Both horizontal and vertical components', 'No force; it only allows rotation']
  answer: 2
  explanation: |-
    A hinge (pin) can push or pull in any direction in the plane, so treat its force as two unknown components. It exerts no torque about its own axis.
- id: phys-q-1808
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'A uniform 2.0 m board of mass 10 kg sticks out horizontally over a ledge with 0.50 m overhanging. How far past the edge can a 20 kg child walk before the board tips?'
  choices: ['0.50 m', '0.125 m', '0.25 m', '1.0 m']
  answer: 2
  explanation: |-
    The board's center is 0.50 m behind the edge (1.0 m from either end, the edge at 1.5 m from the back end). Tipping about the edge: $20g\,x = 10g(0.50)$, so $x = 0.25$ m past the edge.
- id: phys-q-1809
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'A beam carries a load that increases linearly from zero at one end to $w_0$ (N/m) at the other, over length $L$. The total load and where it effectively acts are'
  choices: ['$w_0L$ at $L/2$', '$\tfrac12w_0L$ at $\tfrac23L$ from the zero end', '$\tfrac12w_0L$ at $L/2$', '$w_0L$ at $\tfrac23L$']
  answer: 1
  explanation: |-
    $W = \int_0^L\tfrac{w_0x}{L}\,dx = \tfrac12w_0L$, and $\bar x = \dfrac{\int x\,w\,dx}{W} = \dfrac{w_0L^2/3}{w_0L/2} = \tfrac23L$, toward the heavier end.
- id: phys-q-1810
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'Why are racing cars built low and wide?'
  choices: ['To lower air resistance only', 'To increase their mass', 'To increase the normal force', 'To keep the center of gravity well inside the base so they resist tipping']
  answer: 3
  explanation: |-
    A low center of gravity and a wide base mean the car must tilt much farther before the center of gravity passes beyond the wheels' contact line, so cornering forces are less likely to roll it over.
- id: phys-q-1901
  lesson: phys-gravitation
  module_quiz: true
  topic: Gravitation
  stem: 'If the distance between two masses is tripled, the gravitational force between them becomes'
  choices: ['1/3 as large', '1/9 as large', '3 times as large', '1/6 as large']
  answer: 1
  explanation: |-
    $F \propto 1/r^2$, so tripling $r$ divides $F$ by $3^2 = 9$.
- id: phys-q-1902
  lesson: phys-gravitation
  topic: Gravitation
  stem: 'What is $g$ at a height above Earth''s surface equal to one Earth radius? (Surface $g = 9.8$ m/s².)'
  choices: ['4.9 m/s²', '9.8 m/s²', '2.45 m/s²', '1.1 m/s²']
  answer: 2
  explanation: |-
    The distance from Earth's center doubles ($R \to 2R$), so $g$ falls by $2^2$: $9.8/4 = 2.45$ m/s². Using the height (instead of distance from the center) leads to errors like 4.9.
- id: phys-q-1903
  lesson: phys-gravitation
  topic: Gravitation
  stem: 'Astronauts on the International Space Station float because'
  choices: ['there is no gravity in space', 'gravity there is about 1% of its surface value', 'the station''s walls shield them from gravity', 'they and the station are in free fall together']
  answer: 3
  explanation: |-
    At 400 km, $g$ is still about 89% of its surface value. Everything in the station falls around Earth with the same acceleration, so nothing presses on the floor: apparent weightlessness.
- id: phys-q-1904
  lesson: phys-gravitation
  module_quiz: true
  topic: Orbits
  stem: 'What is the orbital speed of a satellite in a circular orbit of radius $1.27\times10^7$ m (two Earth radii) around Earth? ($GM_E = 3.98\times10^{14}$ m³/s²)'
  choices: ['5.6 km/s', '7.9 km/s', '11.2 km/s', '3.1 km/s']
  answer: 0
  explanation: |-
    $v = \sqrt{GM/r} = \sqrt{3.98\times10^{14}/1.27\times10^7} = \sqrt{3.13\times10^7} = 5.6\times10^3$ m/s. 7.9 km/s is the speed for an orbit at Earth's surface radius.
- id: phys-q-1905
  lesson: phys-gravitation
  topic: Orbits
  stem: 'Planet B orbits a star at 4 times the orbital radius of planet A. How do their periods compare?'
  choices: ['$T_B = 4T_A$', '$T_B = 16T_A$', '$T_B = 2T_A$', '$T_B = 8T_A$']
  answer: 3
  explanation: |-
    Kepler's third law: $T^2 \propto r^3$, so $T_B/T_A = 4^{3/2} = 8$.
- id: phys-q-1906
  lesson: phys-gravitation
  topic: Orbits
  stem: 'Two satellites orbit Earth at the same radius; one has twice the mass of the other. Compared with the lighter one, the heavier satellite''s orbital speed is'
  choices: ['the same', 'twice as large', 'half as large', '$\sqrt2$ times as large']
  answer: 0
  explanation: |-
    $v = \sqrt{GM/r}$ depends only on the central mass and the radius; the satellite's mass cancels.
- id: phys-q-1907
  lesson: phys-gravitation
  module_quiz: true
  topic: Orbits
  stem: 'Find the escape speed from the Moon ($M = 7.35\times10^{22}$ kg, $R = 1.74\times10^6$ m, $G = 6.67\times10^{-11}$ N·m²/kg²).'
  choices: ['1.68 km/s', '2.37 km/s', '11.2 km/s', '5.63 km/s']
  answer: 1
  explanation: |-
    $v_{\text{esc}} = \sqrt{2GM/R} = \sqrt{\dfrac{2(6.67\times10^{-11})(7.35\times10^{22})}{1.74\times10^6}} = 2.37$ km/s. 1.68 km/s omits the 2 (that's the low-orbit speed).
- id: phys-q-1908
  lesson: phys-gravitation
  topic: Orbits
  stem: 'According to Kepler''s second law, a planet in an elliptical orbit moves fastest'
  choices: ['at aphelion (farthest from the Sun)', 'at perihelion (closest to the Sun)', 'at the same speed everywhere', 'halfway between perihelion and aphelion']
  answer: 1
  explanation: |-
    Equal areas in equal times means that near the Sun, where the radius is short, the planet must cover more arc per unit time. Equivalently $mvr_\perp$ is constant, so smaller $r$ means larger $v$.
- id: phys-q-1909
  lesson: phys-gravitation
  topic: Gravitation
  stem: 'Gravitational potential energy $U = -GMm/r$ is negative because'
  choices: ['gravity is a weak force', 'mass can be negative', 'the zero is chosen at infinite separation, and work must be done to separate the masses', 'it is measured below the surface']
  answer: 2
  explanation: |-
    With $U(\infty) = 0$, bringing masses together releases energy, so $U$ is lower (negative) at finite separation. $F = -dU/dr = -GMm/r^2$ (attractive).
- id: phys-q-1910
  lesson: phys-gravitation
  topic: Orbits
  stem: 'The total mechanical energy of a satellite in a circular orbit of radius $r$ is'
  choices: ['$-\dfrac{GMm}{2r}$', '$\dfrac{GMm}{2r}$', '$-\dfrac{GMm}{r}$', '0']
  answer: 0
  explanation: |-
    $K = \tfrac12mv^2 = \dfrac{GMm}{2r}$ and $U = -\dfrac{GMm}{r}$, so $E = -\dfrac{GMm}{2r}$: negative, meaning the satellite is bound.
- id: phys-q-1911
  lesson: phys-gravitation
  topic: Gravitation
  stem: 'What is the gravitational force between two 1000 kg masses whose centers are 1.0 m apart? ($G = 6.67\times10^{-11}$ N·m²/kg²)'
  choices: ['$6.67\times10^{-5}$ N', '$6.67\times10^{-8}$ N', '$6.67\times10^{-2}$ N', '$6.67\times10^{-11}$ N']
  answer: 0
  explanation: |-
    $F = Gm_1m_2/r^2 = (6.67\times10^{-11})(10^6)/1 = 6.67\times10^{-5}$ N, about the weight of a few grains of sand.
