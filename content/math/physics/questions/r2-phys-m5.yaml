# Round 2 questions for phys-m5 (core lessons 15-20 and honors lessons 20h1-20h3)

# ---------- Lesson 15: rotational kinematics ----------
- id: phys-m5-r2-q01
  lesson: phys-rot-kin
  type: text
  topic: Rotational kinematics
  stem: 'A point on the rim of a wheel is 0.50 m from the axle. The wheel turns at 12 rad/s. The point''s speed is ___ m/s. (Give only the number.)'
  accept: ['6', '6.0']
  explanation: |-
    $v = r\omega = 0.50(12) = 6.0$ m/s. This works because $\omega$ is in rad/s.
- id: phys-m5-r2-q02
  lesson: phys-rot-kin
  module_quiz: true
  type: match
  topic: Rotational kinematics
  stem: 'Match each quantity for straight-line motion to its rotational counterpart.'
  pairs:
    - ['Position $x$', 'Angle']
    - ['Velocity $v$', 'Angular velocity']
    - ['Acceleration $a$', 'Angular acceleration']
    - ['Mass $m$', 'Moment of inertia']
    - ['Kinetic energy $\tfrac12mv^2$', 'Rotational kinetic energy']
  distractors: [Torque]
  explanation: |-
    The rotational equations mirror the linear ones symbol by symbol: $\theta$ for $x$, $\omega$ for $v$, $\alpha$ for $a$, $I$ for $m$ and $\tfrac12I\omega^2$ for $\tfrac12mv^2$. Torque is the counterpart of force, which isn't listed.
- id: phys-m5-r2-q03
  lesson: phys-rot-kin
  topic: Rotational kinematics
  stem: 'In which of these must $\omega$ be in rad/s (not rpm or rev/s) to get the right answer? Select all that apply.'
  choices: ['$v = r\omega$', '$a_c = r\omega^2$', '$K = \tfrac12I\omega^2$', 'The ratio $\omega_2/\omega_1$ of two angular speeds']
  answer: [0, 1, 2]
  explanation: |-
    The relations $v = r\omega$, $a_c = r\omega^2$ and $K = \tfrac12I\omega^2$ come from $s = r\theta$, which holds only with $\theta$ in radians. A ratio of two angular speeds has the same value in any unit, because the unit cancels.
- id: phys-m5-r2-q04
  lesson: phys-rot-kin
  type: label
  topic: Rotational kinematics
  stem: 'A disk turns counterclockwise about its axis. Name the numbered parts of the picture for the point on its rim.'
  image: {src: images/phys-m5-rotating-disk-blank.svg, alt: 'A disk turning counterclockwise with four numbered parts: the center of the disk, the curved arc along the rim from a dashed reference line to the point, an arrow at the point pointing along the rim, and an arrow at the point pointing toward the center.'}
  labels:
    - {x: 41.1, y: 55.0, text: Axis of rotation}
    - {x: 65.3, y: 39.2, text: Arc length s}
    - {x: 46.7, y: 12.6, text: Velocity v}
    - {x: 53.1, y: 34.9, text: Centripetal acceleration}
  distractors: [Angular momentum, Torque, Angular acceleration]
  explanation: |-
    The disk turns about its axis (1). The arc (2) swept from the reference line to the point has length $s = r\theta$. The velocity (3) is tangent to the rim, $v = r\omega$, and the centripetal acceleration (4) points along the radius toward the axis, $a_c = r\omega^2$. The radius itself is the line the acceleration lies along, not an arrow.
- id: phys-m5-r2-q05
  lesson: phys-rot-kin
  module_quiz: true
  type: text
  topic: Moment of inertia
  stem: 'A 2.0 kg uniform solid disk of radius 0.30 m rotates about an axis through its rim, parallel to its central axis. Its moment of inertia is ___ kg·m². (Give only the number.)'
  accept: ['0.27']
  explanation: |-
    Parallel-axis theorem with $d = R$: $I = \tfrac12MR^2 + MR^2 = \tfrac32(2.0)(0.30)^2 = 0.27$ kg·m².

# ---------- Lesson 16: torque ----------
- id: phys-m5-r2-q06
  lesson: phys-torque
  type: text
  topic: Torque
  stem: 'A 50 N force pushes perpendicular to a 0.40 m wrench at its end. The torque about the bolt is ___ N·m. (Give only the number.)'
  accept: ['20']
  explanation: |-
    Perpendicular force: $\tau = rF = 0.40(50) = 20$ N·m.
- id: phys-m5-r2-q07
  lesson: phys-torque
  module_quiz: true
  type: order
  topic: Torque
  stem: 'Each force acts at the end of the same 0.30 m wrench, at the given angle to the handle. Put them in order of torque, smallest first.'
  items: ['200 N at $0^\circ$', '100 N at $15^\circ$', '80 N at $30^\circ$', '50 N at $90^\circ$', '60 N at $60^\circ$']
  explanation: |-
    $\tau = rF\sin\theta$ with $r = 0.30$ m: $200\sin 0^\circ$ gives 0 (aimed along the handle); $0.30(100)\sin 15^\circ = 7.8$; $0.30(80)\sin 30^\circ = 12.0$; $0.30(50) = 15.0$; $0.30(60)\sin 60^\circ = 15.6$ N·m.
- id: phys-m5-r2-q08
  lesson: phys-torque
  topic: Rotational dynamics
  stem: 'A bucket hangs from a rope wound on a heavy solid cylinder that turns on a frictionless axle. The bucket is released. Which statements are true? Select all that apply.'
  choices: ['The rope tension is less than the bucket''s weight', 'The bucket''s acceleration is less than $g$', 'The tension equals the bucket''s weight because the rope is light', 'A heavier cylinder gives the bucket a smaller acceleration']
  answer: [0, 1, 3]
  explanation: |-
    The bucket accelerates down, so $mg - T = ma > 0$ and $T < mg$. Since $a = mg/(m + \tfrac12M)$, $a < g$ and a heavier cylinder (larger $M$) gives a smaller $a$. A light rope doesn't make $T = mg$; that would need zero acceleration.
- id: phys-m5-r2-q09
  lesson: phys-torque
  type: label
  topic: Rotational dynamics
  stem: 'A bucket hangs from a rope wound on a solid cylinder. Name the numbered parts.'
  image: {src: images/phys-m5-windlass-blank.svg, alt: 'A cylinder on a fixed axle with a rope hanging from its right side to a bucket. Five numbered parts: the center of the cylinder, a dashed line from the center to the rim, a downward arrow at the cylinder''s rim beside the rope, an upward arrow on the bucket beside the rope, and a downward arrow below the bucket.'}
  labels:
    - {x: 39.6, y: 29.5, text: Axle}
    - {x: 33.3, y: 36.4, text: Radius (lever arm of the rope)}
    - {x: 59.8, y: 42.0, text: Rope tension on the cylinder}
    - {x: 50.6, y: 56.8, text: Rope tension on the bucket}
    - {x: 55.2, y: 90.9, text: Weight of the bucket}
  distractors: [Normal force on the bucket, Friction at the axle]
  explanation: |-
    The cylinder turns about its axle (1). The rope leaves the rim at a distance equal to the radius (2), which is the lever arm of the tension. The rope pulls down on the cylinder (3) and up on the bucket (4); the bucket's weight (5) pulls down. The axle is frictionless and nothing pushes on the bucket from below.
- id: phys-m5-r2-q10
  lesson: phys-torque
  type: text
  topic: Rotational dynamics
  stem: 'A motor delivers a torque of 200 N·m while turning at 300 rad/s. Its power output is ___ kW. (Give only the number.)'
  accept: ['60']
  explanation: |-
    $P = \tau\omega = 200(300) = 60\,000$ W $= 60$ kW.

# ---------- Lesson 17: rolling and angular momentum ----------
- id: phys-m5-r2-q11
  lesson: phys-rolling
  type: label
  topic: Rolling motion
  stem: 'A wheel rolls to the right without slipping; its center moves at speed $v$. Choose the motion of each numbered point.'
  image: {src: images/phys-m5-rolling-velocities-blank.svg, alt: 'A wheel rolling to the right on the ground, with arrows showing velocities. Four numbered points: the arrow at the top of the wheel, the arrow at the center, the point touching the ground, and the slanted arrow at the front of the wheel level with the center.'}
  labels:
    - {x: 57.0, y: 18.4, text: 'Forward at 2v'}
    - {x: 48.9, y: 52.6, text: 'Forward at v'}
    - {x: 39.3, y: 86.8, text: 'At rest'}
    - {x: 71.3, y: 65.7, text: 'About 1.41v, slanting down'}
  distractors: ['Backward at v']
  explanation: |-
    Rolling is the center's motion plus rotation about the center. At the top the two add: $v + R\omega = 2v$ (1). The center moves at $v$ (2). At the bottom they cancel, so the contact point is at rest (3). The front point adds $v$ forward and $R\omega = v$ downward, giving $\sqrt2v \approx 1.41v$ slanting down (4). No point of a wheel rolling forward moves backward at $v$.
- id: phys-m5-r2-q12
  lesson: phys-rolling
  type: text
  topic: Rolling motion
  stem: 'A ball rolls without slipping with its center moving at 5.0 m/s. The top of the ball moves at ___ m/s relative to the ground. (Give only the number.)'
  accept: ['10', '10.0']
  explanation: |-
    The top moves at $v + R\omega = 2v = 10$ m/s.
- id: phys-m5-r2-q13
  lesson: phys-rolling
  module_quiz: true
  type: match
  topic: Rolling motion
  stem: 'Writing $I_{\text{cm}} = cMR^2$, match each rolling object to its shape factor $c$.'
  pairs:
    - [Thin hoop, '1']
    - [Solid disk or cylinder, '1/2']
    - [Solid sphere, '2/5']
    - [Thin hollow sphere, '2/3']
  distractors: ['1/3']
  explanation: |-
    From the moment-of-inertia table: hoop $MR^2$, solid cylinder $\tfrac12MR^2$, solid sphere $\tfrac25MR^2$, spherical shell $\tfrac23MR^2$. $\tfrac13$ belongs to a rod about one end, which doesn't roll.
- id: phys-m5-r2-q14
  lesson: phys-rolling
  type: order
  topic: Rolling motion
  stem: 'All start from rest at the top of the same ramp: a block sliding without friction, and four objects rolling without slipping. Put them in the order they reach the bottom, first to last.'
  items: [Frictionless sliding block, Solid sphere, Solid cylinder, Thin hollow sphere, Thin hoop]
  explanation: |-
    $a = g\sin\theta/(1 + c)$, so smaller $c$ is faster: block $c = 0$, solid sphere 0.4, solid cylinder 0.5, hollow sphere 0.667, hoop 1.
- id: phys-m5-r2-q15
  lesson: phys-rolling
  topic: Angular momentum
  stem: 'In which situations is angular momentum (about the stated axis) conserved? Select all that apply.'
  choices: ['A skater on frictionless ice pulls in her arms (axis: her spin axis)', 'A disk is dropped onto another disk spinning on a frictionless axle (axis: the axle)', 'A motor spins up a fan from rest (axis: the fan''s shaft)', 'A diver somersaults in a tuck during the dive (axis: through her center of mass)']
  answer: [0, 1, 3]
  explanation: |-
    Angular momentum is conserved when the net external torque is zero. The skater's arms and the dropped disk exert only internal forces; gravity on the diver acts at her center of mass, so it has no torque about it. The motor exerts an external torque on the fan, so the fan's angular momentum grows.

# ---------- Lesson 18: static equilibrium ----------
- id: phys-m5-r2-q16
  lesson: phys-equilibrium
  type: label
  topic: Static equilibrium
  stem: 'A uniform ladder leans against a smooth wall. Name the numbered forces acting on it.'
  image: {src: images/phys-m5-ladder-blank.svg, alt: 'A ladder leaning against a wall with four numbered force arrows: a horizontal arrow at the top pointing away from the wall, a downward arrow at the middle of the ladder, an upward arrow at the foot, and a horizontal arrow along the floor at the foot pointing toward the wall.'}
  labels:
    - {x: 71.9, y: 23.7, text: Normal force from the wall}
    - {x: 66.1, y: 69.8, text: Weight of the ladder}
    - {x: 49.0, y: 72.7, text: Normal force from the floor}
    - {x: 37.5, y: 86.4, text: Static friction from the floor}
  distractors: [Friction from the wall, Tension]
  explanation: |-
    A smooth wall can only push perpendicular to itself (1). The weight of a uniform ladder acts at its middle (2). The floor pushes up (3) and its static friction (4) acts toward the wall, balancing the wall's push. A smooth wall gives no friction, and nothing here is a rope.
- id: phys-m5-r2-q17
  lesson: phys-equilibrium
  type: text
  topic: Static equilibrium
  stem: 'A 20 kg child sits 2.4 m from the pivot of a uniform seesaw pivoted at its center. A 40 kg child balances it by sitting ___ m from the pivot on the other side. (Give only the number.)'
  accept: ['1.2']
  explanation: |-
    Equal torques about the pivot: $20g(2.4) = 40g\,x$, so $x = 1.2$ m.
- id: phys-m5-r2-q18
  lesson: phys-equilibrium
  module_quiz: true
  type: match
  topic: Static equilibrium
  stem: 'Match each problem to the best point about which to take torques.'
  pairs:
    - ['Beam on supports A and B: find the force at B', 'Support A']
    - ['Beam hinged to a wall and held by a cable: find the cable tension', 'The hinge']
    - ['Ladder against a smooth wall: find the wall''s push', 'The foot of the ladder']
    - ['Seesaw: where should the second child sit?', 'The seesaw''s pivot']
  distractors: ['The top of the ladder']
  explanation: |-
    Pick the point where unknown forces you don't want act, so they drop out: support A removes $F_A$; the hinge removes both hinge components; the foot removes floor friction and the floor's normal force; the pivot removes the pivot force (and a uniform seesaw's weight). The top of the ladder would remove the very wall force you want.
- id: phys-m5-r2-q19
  lesson: phys-equilibrium
  topic: Static equilibrium
  stem: 'Which conditions are required for a rigid object to be in static equilibrium? Select all that apply.'
  choices: ['$\sum\vec F = 0$', '$\sum\tau = 0$ about every axis', 'Every individual force on it is zero', 'Its center of gravity is directly above its pivot']
  answer: [0, 1]
  explanation: |-
    Zero net force and zero net torque are both needed (and with zero net force, zero torque about one point means zero about all). The forces need not be zero individually, and a balanced seesaw with two children doesn't need its own center of gravity over the pivot to balance by itself.
- id: phys-m5-r2-q20
  lesson: phys-equilibrium
  type: text
  topic: Static equilibrium
  stem: 'A uniform 6.0 m beam weighing 300 N rests on supports at its ends A and B. A 600 N load sits 2.0 m from A. The force from support B is ___ N. (Give only the number.)'
  accept: ['350']
  explanation: |-
    Torques about A: $F_B(6.0) = 300(3.0) + 600(2.0) = 2100$, so $F_B = 350$ N (and $F_A = 900 - 350 = 550$ N).

# ---------- Lesson 19: elasticity ----------
- id: phys-m5-r2-q21
  lesson: phys-elasticity
  type: label
  topic: Elasticity
  stem: 'Each block is deformed by the forces shown (the dashed outlines are the original shapes). Name each kind of deformation.'
  image: {src: images/phys-m5-deformations-blank.svg, alt: 'Three blocks with dashed outlines of their original shapes. Block 1 is pulled outward at both ends and is longer. Block 2 has a force to the right along its top face and to the left along its bottom face and is slanted. Block 3 is pushed inward on all four sides and is smaller.'}
  labels:
    - {x: 16.7, y: 50.0, text: Tension}
    - {x: 51.4, y: 51.5, text: Shear}
    - {x: 81.9, y: 51.5, text: Bulk compression}
  distractors: [Plastic flow]
  explanation: |-
    Pulling along the length stretches the bar: tension, described by Young's modulus (1). Forces along opposite faces slant the block: shear, described by the shear modulus (2). Pressure on all sides shrinks the volume: bulk compression, described by the bulk modulus (3).
- id: phys-m5-r2-q22
  lesson: phys-elasticity
  type: text
  topic: Elasticity
  stem: 'A wire 2.0 m long stretches by 1.0 mm under a load. Its strain is ___ (a plain number with no units).'
  accept: ['0.0005', '5e-4', '5×10^-4', '5x10^-4', '5*10^-4']
  explanation: |-
    Strain $= \Delta L/L_0 = 0.0010\text{ m}/2.0\text{ m} = 5.0\times10^{-4}$. Convert both lengths to the same unit first.
- id: phys-m5-r2-q23
  lesson: phys-elasticity
  module_quiz: true
  type: match
  topic: Elasticity
  stem: 'Match each term to its meaning.'
  pairs:
    - [Elastic limit, Largest stress the material fully recovers from]
    - [Ultimate strength, Greatest stress the material can withstand]
    - [Plastic deformation, Permanent change of shape]
    - [Strain, Fractional change in length]
  distractors: [Force per unit length]
  explanation: |-
    Below the elastic limit the material springs back; beyond it, deformation is plastic (permanent). The ultimate strength is the top of the stress–strain curve. Strain is $\Delta L/L_0$, a ratio with no units; stress is force per unit area, not per unit length.
- id: phys-m5-r2-q24
  lesson: phys-elasticity
  topic: Elasticity
  stem: 'Which of these have no shear modulus (they cannot hold a sideways shear strain)? Select all that apply.'
  choices: [Water, Air, Steel, Rubber]
  answer: [0, 1]
  explanation: |-
    Fluids flow when sheared, so liquids and gases have no shear modulus. Steel and rubber are solids: steel's shear modulus is about $8\times10^{10}$ Pa and rubber's is small but not zero.
- id: phys-m5-r2-q25
  lesson: phys-elasticity
  type: order
  topic: Elasticity
  stem: 'A metal rod is pulled with a steadily increasing load until it breaks. Put the stages in order.'
  items: ['Stretches in proportion to the load (Hooke''s law)', 'Passes its elastic limit', 'Reaches its ultimate strength', 'Thins sharply at one spot (necks)', 'Fractures']
  explanation: |-
    The stress–strain curve is straight up to about the elastic limit, then the metal flows plastically up to the curve's peak (ultimate strength). After that it necks at one spot and breaks.

# ---------- Lesson 20: gravitation ----------
- id: phys-m5-r2-q26
  lesson: phys-gravitation
  type: label
  topic: Orbits
  stem: 'Name the numbered parts of this planetary orbit.'
  image: {src: images/phys-m5-orbit-blank.svg, alt: 'An ellipse with a large dot near its right end, two dots at the ends of the long axis, a dot at the middle, and a bar above the left half of the long axis. Five numbers: the large dot near the right end, the dot at the right end, the dot at the left end, the bar, and the middle dot.'}
  labels:
    - {x: 82.4, y: 52.6, text: Sun (at a focus)}
