- id: phys-q-0301
  lesson: phys-motion-1d
  module_quiz: true
  topic: Velocity and acceleration
  stem: 'A runner completes exactly two laps of a 400 m track in 160 s, finishing where she started. Her average speed and average velocity are'
  choices: ['5.0 m/s and 5.0 m/s', '5.0 m/s and 0', '2.5 m/s and 0', '0 and 5.0 m/s']
  answer: 1
  explanation: |-
    Average speed = distance/time = 800 m / 160 s = 5.0 m/s. Average velocity = displacement/time, and the displacement is zero because she ends at the start, so the average velocity is 0.
- id: phys-q-0302
  lesson: phys-motion-1d
  topic: Velocity and acceleration
  stem: 'A car moving in the $-x$ direction is slowing down. The signs of its velocity and acceleration are'
  choices: ['$v < 0$, $a < 0$', '$v > 0$, $a < 0$', '$v < 0$, $a > 0$', '$v > 0$, $a > 0$']
  answer: 2
  explanation: |-
    Moving in $-x$ means $v < 0$. Slowing down means $a$ is opposite to $v$, so $a > 0$. "Negative acceleration means slowing down" is only true when $v > 0$.
- id: phys-q-0303
  lesson: phys-motion-1d
  module_quiz: true
  topic: Motion graphs
  stem: 'On a position–time graph, the instantaneous velocity at a moment is'
  choices: ['the slope of the tangent line at that moment', 'the height of the graph at that moment', 'the area under the graph up to that moment', 'the curvature of the graph at that moment']
  answer: 0
  explanation: |-
    Velocity is the rate of change of position, which is the slope of the $x$–$t$ graph (for a curve, the slope of the tangent line). The height is the position itself; area under a $v$–$t$ (not $x$–$t$) graph gives displacement; curvature relates to acceleration.
- id: phys-q-0304
  lesson: phys-motion-1d
  topic: Motion graphs
  stem: 'A velocity–time graph is a straight line from $(0\text{ s}, 10\text{ m/s})$ to $(8\text{ s}, 30\text{ m/s})$. What are the acceleration and the displacement over the 8 s?'
  choices: ['2.5 m/s² and 240 m', '3.75 m/s² and 160 m', '2.5 m/s² and 80 m', '2.5 m/s² and 160 m']
  answer: 3
  explanation: |-
    Slope: $(30 - 10)/8 = 2.5$ m/s². Displacement is the area under the line, a trapezoid: $\tfrac12(10 + 30)(8) = 160$ m. 240 m would use the final speed for the whole time; 80 m is only the triangle part.
- id: phys-q-0305
  lesson: phys-motion-1d
  topic: Motion graphs
  stem: 'On a velocity–time graph, a segment lies below the $t$ axis between 4 s and 6 s. During that interval the object'
  choices: ['is at a negative position', 'moves in the negative direction', 'must be slowing down', 'has negative acceleration']
  answer: 1
  explanation: |-
    Below the axis means $v < 0$, motion in the $-x$ direction. That says nothing about where the object is (position), and whether it slows depends on the slope, not the sign of $v$.
- id: phys-q-0306
  lesson: phys-motion-1d
  topic: Velocity and acceleration
  stem: 'A cyclist rides 10 km at 20 km/h and then 10 km at 10 km/h. What is her average speed for the trip?'
  choices: ['15 km/h', '14.1 km/h', '13.3 km/h', '12.5 km/h']
  answer: 2
  explanation: |-
    The legs take $10/20 = 0.5$ h and $10/10 = 1.0$ h. Average speed $= 20\text{ km}/1.5\text{ h} = 13.3$ km/h. Averaging the speeds (15 km/h) is wrong because she spends more time at the slower speed.
- id: phys-q-0307
  lesson: phys-motion-1d
  module_quiz: true
  topic: Motion graphs
  stem: 'A position–time graph is a straight line from $(0\text{ s}, 12\text{ m})$ to $(4.0\text{ s}, 0\text{ m})$. What is the object''s velocity?'
  choices: ['$3.0$ m/s', '$-0.33$ m/s', '$0$ m/s', '$-3.0$ m/s']
  answer: 3
  explanation: |-
    Velocity is the slope: $\dfrac{0 - 12}{4.0 - 0} = -3.0$ m/s. The object moves in the $-x$ direction at a steady 3.0 m/s. Dropping the sign gives 3.0 m/s; run over rise gives $-0.33$ m/s; reaching $x = 0$ doesn't mean the velocity is zero.
- id: phys-q-0308
  lesson: phys-motion-1d
  topic: Motion graphs
  stem: 'On a curved position–time graph, the tangent line drawn at $t = 4$ s passes through $(2\text{ s}, 1\text{ m})$ and $(6\text{ s}, 13\text{ m})$. What is the instantaneous velocity at 4 s?'
  choices: ['3.0 m/s', '2.2 m/s', '0.33 m/s', '12 m/s']
  answer: 0
  explanation: |-
    The instantaneous velocity is the slope of the tangent: $\dfrac{13 - 1}{6 - 2} = \dfrac{12}{4} = 3.0$ m/s. Dividing one point's height by its time ($13/6 = 2.2$) is not a slope; $0.33$ is run over rise; 12 is the rise alone.
- id: phys-q-0309
  lesson: phys-motion-1d
  topic: Motion graphs
  stem: 'An acceleration–time graph shows a constant 3 m/s² from 0 to 4 s. If $v(0) = 2$ m/s, what is $v(4)$?'
  choices: ['12 m/s', '14 m/s', '24 m/s', '10 m/s']
  answer: 1
  explanation: |-
    The area under the $a$–$t$ graph is $\Delta v = 3 \times 4 = 12$ m/s, so $v(4) = 2 + 12 = 14$ m/s. 12 m/s forgets the initial velocity.
- id: phys-q-0310
  lesson: phys-motion-1d
  topic: Velocity and acceleration
  stem: 'Which statement about a ball at the very top of its vertical flight is true?'
  choices: ['Its velocity and acceleration are both zero', 'Its velocity is zero and its acceleration is less than 9.8 m/s²', 'Its velocity is zero and its acceleration is 9.8 m/s² downward', 'Its velocity is 9.8 m/s and its acceleration is zero']
  answer: 2
  explanation: |-
    Momentarily $v = 0$, but gravity still acts with full strength, so $a = 9.8$ m/s² downward, the same as at every other point of the flight. If the acceleration were zero, the ball would stay at the top forever.
- id: phys-q-0311
  lesson: phys-motion-1d
  module_quiz: true
  topic: Motion graphs
  stem: 'A velocity–time graph shows $v = +4.0$ m/s from 0 to 3.0 s, then $v = -2.0$ m/s from 3.0 s to 5.0 s. What are the displacement and the distance traveled over the 5.0 s?'
  choices: ['16 m and 16 m', '8.0 m and 16 m', '8.0 m and 8.0 m', '16 m and 8.0 m']
  answer: 1
  explanation: |-
    Areas: $+4.0 \times 3.0 = +12$ m, then $-2.0 \times 2.0 = -4.0$ m. Displacement is the signed sum, $12 - 4.0 = 8.0$ m. Distance counts every area as positive: $12 + 4.0 = 16$ m. Treating the area below the axis as positive in the displacement gives 16 m.
- id: phys-q-0312
  lesson: phys-motion-1d
  topic: Motion graphs
  stem: 'An object''s position–time graph is a straight line sloping downward. The object'
  choices: ['is slowing down to a stop', 'moves in the $+x$ direction while slowing', 'has a constant negative acceleration', 'moves in the $-x$ direction at constant speed']
  answer: 3
  explanation: |-
    A straight line has constant slope, so the velocity is constant; a downward slope means that velocity is negative. Constant velocity means zero acceleration. Reading the falling height of the line as "slowing down" confuses position with speed.
- id: phys-q-0401
  lesson: phys-const-accel
  module_quiz: true
  topic: Constant acceleration
  stem: 'A car traveling at 20 m/s brakes at a constant 4.0 m/s². How far does it travel before stopping?'
  choices: ['50 m', '100 m', '25 m', '80 m']
  answer: 0
  explanation: |-
    $v^2 = v_0^2 + 2a\Delta x$: $0 = 400 + 2(-4.0)\Delta x$, so $\Delta x = 50$ m. Forgetting the 2 gives 100 m.
- id: phys-q-0402
  lesson: phys-const-accel
  topic: Constant acceleration
  stem: 'If a car''s speed doubles, its braking distance (same deceleration) becomes'
  choices: ['the same', 'twice as large', 'four times as large', 'half as large']
  answer: 2
  explanation: |-
    From $0 = v_0^2 - 2a d$, $d = v_0^2/(2a)$. Distance is proportional to $v_0^2$, so doubling $v_0$ quadruples $d$.
- id: phys-q-0403
  lesson: phys-const-accel
  topic: Constant acceleration
  stem: 'A jet starts from rest and accelerates uniformly at 3.0 m/s² down a runway. How long must the runway be for it to reach 24 m/s?'
  choices: ['72 m', '192 m', '8 m', '96 m']
  answer: 3
  explanation: |-
    $v^2 = 2a\Delta x$ gives $\Delta x = 24^2/(2 \times 3.0) = 576/6 = 96$ m. (It takes 8 s; 192 m drops the factor of 2.)
- id: phys-q-0404
  lesson: phys-const-accel
  module_quiz: true
  topic: Free fall
  stem: 'A rock is dropped from a 45 m cliff. How long does it take to reach the bottom? ($g = 9.8$ m/s²)'
  choices: ['3.0 s', '4.6 s', '9.2 s', '2.1 s']
  answer: 0
  explanation: |-
    $45 = \tfrac12(9.8)t^2 \Rightarrow t^2 = 9.18$, $t = 3.0$ s. 4.6 s comes from $t = 45/9.8$ (forgetting the square).
- id: phys-q-0405
  lesson: phys-const-accel
  topic: Free fall
  stem: 'A ball is thrown straight up at 19.6 m/s. How long is it in the air before returning to the launch height? ($g = 9.8$ m/s²)'
  choices: ['2.0 s', '1.0 s', '8.0 s', '4.0 s']
  answer: 3
  explanation: |-
    It takes $19.6/9.8 = 2.0$ s to reach the top and the same time to fall back, so 4.0 s total. 2.0 s is only the trip up.
- id: phys-q-0406
  lesson: phys-const-accel
  topic: Free fall
  stem: 'Ignoring air resistance, a 10 kg bowling ball and a 1 kg ball are dropped together from the same height. Which lands first?'
  choices: ['They land together', 'The bowling ball', 'The 1 kg ball', 'It depends on their sizes']
  answer: 0
  explanation: |-
    In free fall every object has the same acceleration $g$, regardless of mass, so with the same start they land together.
- id: phys-q-0407
  lesson: phys-const-accel
  module_quiz: true
  topic: Constant acceleration
  stem: 'Which kinematic equation should you use if you know $v_0$, $a$ and $\Delta x$, and want $v$, with no time given?'
  choices: ['$v = v_0 + at$', '$\Delta x = v_0t + \tfrac12at^2$', '$v^2 = v_0^2 + 2a\Delta x$', '$\Delta x = \tfrac12(v_0 + v)t$']
  answer: 2
  explanation: |-
    Pick the equation that omits the quantity you don't know and don't need: here that's $t$, and $v^2 = v_0^2 + 2a\Delta x$ is the time-free equation.
- id: phys-q-0408
  lesson: phys-const-accel
  topic: Free fall
  stem: 'A student writes $y = v_0t - \tfrac12(-9.8)t^2$ for a ball thrown upward with up positive. What is wrong?'
  choices: ['Nothing is wrong', 'The sign of gravity is counted twice, so the ball would accelerate upward', 'The $v_0t$ term should be negative', 'The $\tfrac12$ should be 2']
  answer: 1
  explanation: |-
    With up positive, $a = -g = -9.8$ m/s², so $y = v_0t + \tfrac12(-9.8)t^2 = v_0t - 4.9t^2$. Writing $-\tfrac12(-9.8)$ makes the gravity term positive, an upward acceleration.
- id: phys-q-0409
  lesson: phys-const-accel
  topic: Constant acceleration
  stem: 'A train speeds up uniformly from 10 m/s to 30 m/s in 20 s. How far does it travel in that time?'
  choices: ['200 m', '600 m', '300 m', '400 m']
  answer: 3
  explanation: |-
    $\Delta x = \tfrac12(v_0 + v)t = \tfrac12(10 + 30)(20) = 400$ m. 600 m uses the final speed only; 200 m uses the initial speed only.
- id: phys-q-0410
  lesson: phys-const-accel
  topic: Free fall
  stem: 'A ball thrown upward at 15 m/s from a balcony lands on the ground below. With up positive and the origin at the balcony, the ball''s final displacement $\Delta y$ is'
  choices: ['negative', 'positive', 'zero', 'equal to the maximum height']
  answer: 0
  explanation: |-
    Displacement is final minus initial position. The ground is below the balcony, so $\Delta y < 0$, even though the ball went up first. Using a positive $\Delta y$ is a common error.
- id: phys-q-0411
  lesson: phys-const-accel
  topic: Constant acceleration
  stem: 'Substituting $t = (v - v_0)/a$ from $v = v_0 + at$ into $\Delta x = \tfrac12(v_0 + v)t$ gives'
  choices: ['$v = v_0 + at$', '$\Delta x = v_0t + \tfrac12at^2$', '$v^2 = v_0^2 + 2a\Delta x$', '$\Delta x = \tfrac12(v + v_0)t$']
  answer: 2
  explanation: |-
    $\Delta x = \tfrac12(v_0 + v)\dfrac{v - v_0}{a} = \dfrac{v^2 - v_0^2}{2a}$, and multiplying by $2a$ gives $v^2 = v_0^2 + 2a\Delta x$, the time-free equation. The other choices still contain $t$, which the substitution removed.
- id: phys-q-0412
  lesson: phys-const-accel
  topic: Constant acceleration
  stem: 'A cart starts from rest, accelerates at 3.0 m/s² for 4.0 s, then coasts at constant velocity for 5.0 s more. How far does it travel in total?'
  choices: ['108 m', '84 m', '60 m', '54 m']
  answer: 1
  explanation: |-
    Phase 1: $\Delta x = \tfrac12(3.0)(4.0)^2 = 24$ m, ending at $v = 12$ m/s. Phase 2: $12 \times 5.0 = 60$ m. Total 84 m. Using 12 m/s for all 9.0 s gives 108 m; using the average speed of phase 1 (6 m/s) for the whole 9.0 s gives 54 m; 60 m is phase 2 alone.
- id: phys-q-0501
  lesson: phys-projectiles
  module_quiz: true
  topic: Projectile motion
  stem: 'A ball is launched horizontally from a table. Ignoring air resistance, which quantity stays constant during its flight?'
  choices: ['Its speed', 'Its vertical velocity', 'Its horizontal velocity', 'Its direction of motion']
  answer: 2
  explanation: |-
    Gravity acts only vertically, so $v_x$ never changes. $v_y$ grows downward, which changes both the speed and the direction.
- id: phys-q-0502
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'A package is dropped from a plane flying horizontally at 60 m/s at a height of 490 m. How far ahead of the drop point does it land? ($g = 9.8$ m/s²)'
  choices: ['600 m', '294 m', '1200 m', '3000 m']
  answer: 0
  explanation: |-
    Fall time: $490 = 4.9t^2$, so $t = 10$ s. The package keeps the plane's horizontal speed: $x = 60 \times 10 = 600$ m.
- id: phys-q-0503
  lesson: phys-projectiles
  module_quiz: true
  topic: Projectile motion
  stem: 'A ball is kicked at 25 m/s at $40^\circ$ above level ground. What is its range? ($g = 9.8$ m/s²)'
  choices: ['63.8 m', '41.0 m', '62.8 m', '13.2 m']
  answer: 2
  explanation: |-
    $R = \dfrac{v_0^2\sin 2\theta}{g} = \dfrac{625\sin 80^\circ}{9.8} = 62.8$ m. 41.0 m uses $\sin 40^\circ$ instead of $\sin 80^\circ$; 63.8 m is $v_0^2/g$ (the 45° maximum); 13.2 m is the maximum height.
- id: phys-q-0504
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'At the highest point of a projectile''s path (launched at $30^\circ$), its velocity is'
  choices: ['zero', 'horizontal, equal to $v_0\cos 30^\circ$', 'vertical, equal to $v_0\sin 30^\circ$', 'horizontal, equal to $v_0$']
  answer: 1
  explanation: |-
    At the top $v_y = 0$, but $v_x = v_0\cos\theta$ is unchanged, so the velocity is horizontal with magnitude $v_0\cos 30^\circ$.
- id: phys-q-0505
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'Two balls are launched from level ground with the same speed, one at $25^\circ$ and one at $65^\circ$. Compared with the $25^\circ$ ball, the $65^\circ$ ball'
  choices: ['travels farther', 'lands at the same distance but stays up longer', 'lands at the same distance and same time', 'lands closer but sooner']
  answer: 1
  explanation: |-
    Complementary angles give equal ranges because $\sin 50^\circ = \sin 130^\circ$. The steeper launch has a larger $v_{0y}$, so it rises higher and its flight time $2v_0\sin\theta/g$ is longer.
- id: phys-q-0506
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'A ball rolls off a 19.6 m high cliff at 12 m/s. How far from the base does it land? ($g = 9.8$ m/s²)'
  choices: ['12 m', '48 m', '235 m', '24 m']
  answer: 3
  explanation: |-
    Fall time: $19.6 = 4.9t^2$, so $t = 2.0$ s. Horizontal distance $= 12 \times 2.0 = 24$ m.
- id: phys-q-0507
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'Ignoring air resistance, what launch angle maximizes the range on level ground, and why?'
  choices: ['$90^\circ$, because the ball stays up longest', '$30^\circ$, because the horizontal speed is large', '$45^\circ$, because $\sin 2\theta$ is largest there', '$60^\circ$, because height and speed balance']
  answer: 2
  explanation: |-
    $R = v_0^2\sin 2\theta/g$, and $\sin 2\theta$ reaches its maximum of 1 at $2\theta = 90^\circ$, i.e. $\theta = 45^\circ$. A $90^\circ$ launch has zero horizontal speed and lands where it started.
- id: phys-q-0508
  lesson: phys-projectiles
  module_quiz: true
  topic: Projectile motion
  stem: 'A projectile is launched at 20 m/s at $30^\circ$ above horizontal from a 15 m high platform. Why can''t you use $R = v_0^2\sin 2\theta/g$ to find where it lands?'
  choices: ['Because the angle is not $45^\circ$', 'Because it lands below its launch height, and the formula assumes equal heights', 'Because the formula only works for horizontal launches', 'Because $g$ changes with height']
  answer: 1
  explanation: |-
    The range formula comes from setting $y = 0$ at landing, i.e. landing at launch height. From a platform, solve $-15 = v_{0y}t - 4.9t^2$ for $t$ and then use $x = v_{0x}t$.
- id: phys-q-0509
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'A ball is thrown at 10 m/s at $53^\circ$ above horizontal ($\sin 53^\circ \approx 0.80$, $\cos 53^\circ \approx 0.60$). What is its velocity 0.50 s later? ($g = 9.8$ m/s²)'
  choices: ['$v_x = 6.0$ m/s, $v_y = 3.1$ m/s', '$v_x = 6.0$ m/s, $v_y = 8.0$ m/s', '$v_x = 1.1$ m/s, $v_y = 8.0$ m/s', '$v_x = 8.0$ m/s, $v_y = 1.1$ m/s']
  answer: 0
  explanation: |-
    $v_x = 10(0.60) = 6.0$ m/s, unchanged. $v_y = 10(0.80) - 9.8(0.50) = 8.0 - 4.9 = 3.1$ m/s.
- id: phys-q-0510
  lesson: phys-projectiles
  topic: Projectile motion
  stem: 'Eliminating time from the projectile equations shows that the path $y(x)$ is'
  choices: ['a straight line', 'a circle', 'an exponential curve', 'a parabola']
  answer: 3
  explanation: |-
    $y = x\tan\theta - \dfrac{g}{2v_0^2\cos^2\theta}x^2$ is quadratic in $x$, so the path is a parabola (without air resistance).

- id: phys-q-0511
  lesson: phys-projectiles
  module_quiz: true
  topic: Projectile motion
  stem: 'A ball is launched from level ground and lands 15 m away. It is launched again at the same angle with twice the speed. Ignoring air resistance, it now lands'
  choices: ['30 m away', '$15\sqrt2 \approx 21$ m away', '60 m away', '15 m away']
  answer: 2
  explanation: |-
    $R = v_0^2\sin 2\theta/g$ is proportional to $v_0^2$, so doubling the speed multiplies the range by 4: 60 m. Both the horizontal speed and the flight time double, and range is their product. 30 m doubles only one of them.
- id: phys-q-0601
  lesson: phys-motion-2d
  module_quiz: true
  topic: Relative motion
  stem: 'A river flows east at 3 m/s. A boat heads due north at 4 m/s relative to the water. What is the boat''s speed relative to the shore?'
  choices: ['7 m/s', '1 m/s', '4 m/s', '5 m/s']
  answer: 3
  explanation: |-
    $\vec v_{BG} = \vec v_{BW} + \vec v_{WG} = (3, 4)$ m/s, magnitude $\sqrt{9 + 16} = 5$ m/s. Adding magnitudes (7 m/s) ignores the directions.
- id: phys-q-0602
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'A river is 60 m wide and flows at 2.0 m/s. A swimmer swims at 3.0 m/s relative to the water, heading straight across. How long does she take to cross, and how far downstream does she land?'
  choices: ['12 s and 24 m', '20 s and 40 m', '20 s and 60 m', '26.8 s and 0 m']
  answer: 1
  explanation: |-
    Only the across component matters for the crossing time: $60/3.0 = 20$ s. Meanwhile the current carries her $2.0 \times 20 = 40$ m downstream. 26.8 s is the time if she aims upstream to land directly opposite.
- id: phys-q-0603
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'Same river (60 m wide, current 2.0 m/s), swimmer 3.0 m/s relative to the water. At what angle upstream from straight across must she head to land directly opposite?'
  choices: ['$33.7^\circ$', '$48.2^\circ$', '$41.8^\circ$', '$56.3^\circ$']
  answer: 2
  explanation: |-
    The upstream component of her velocity must cancel the current: $3.0\sin\alpha = 2.0$, so $\alpha = \sin^{-1}(2/3) = 41.8^\circ$. $33.7^\circ$ is $\tan^{-1}(2/3)$, the wrong trig function.
- id: phys-q-0604
  lesson: phys-motion-2d
  module_quiz: true
  topic: Two-dimensional motion
  stem: 'A car drives around a circular track at a constant 25 m/s. Is it accelerating?'
  choices: ['Yes, because the direction of its velocity changes', 'No, because its speed is constant', 'Only if the track is banked', 'Only when it brakes']
  answer: 0
  explanation: |-
    Acceleration is the rate of change of the velocity vector. Turning changes the vector's direction, so there is a (centripetal) acceleration even at constant speed.
- id: phys-q-0605
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'Car A drives north at 25 m/s and car B drives south at 20 m/s. What is the velocity of A relative to B?'
  choices: ['5 m/s north', '45 m/s south', '5 m/s south', '45 m/s north']
  answer: 3
  explanation: |-
    With north positive, $v_{AB} = v_{AG} + v_{GB} = v_{AG} - v_{BG} = 25 - (-20) = +45$ m/s, i.e. 45 m/s north.
- id: phys-q-0606
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'If $\vec v_{AB} = 4\hat\imath - 2\hat\jmath$ m/s, then $\vec v_{BA}$ is'
  choices: ['$4\hat\imath - 2\hat\jmath$ m/s', '$-4\hat\imath + 2\hat\jmath$ m/s', '$-4\hat\imath - 2\hat\jmath$ m/s', '$2\hat\imath - 4\hat\jmath$ m/s']
  answer: 1
  explanation: |-
    Reversing the observer reverses the relative velocity: $\vec v_{BA} = -\vec v_{AB}$.
- id: phys-q-0607
  lesson: phys-motion-2d
  topic: Two-dimensional motion
  stem: 'A drone flies from the origin to the point $(12\text{ m}, -9.0\text{ m})$ in 3.0 s. What is the magnitude of its average velocity?'
  choices: ['7.0 m/s', '1.0 m/s', '5.0 m/s', '15 m/s']
  answer: 2
  explanation: |-
    The displacement has magnitude $\sqrt{12^2 + 9.0^2} = 15$ m, so $v_{\text{avg}} = 15/3.0 = 5.0$ m/s. Adding the component sizes ($21/3.0 = 7.0$) or subtracting them ($3.0/3.0 = 1.0$) ignores how vectors combine; 15 m/s forgets to divide by the time.
- id: phys-q-0608
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'A plane with airspeed 300 km/h heads due north while a 40 km/h wind blows toward the east. What is its ground speed?'
  choices: ['340 km/h', '260 km/h', '297 km/h', '303 km/h']
  answer: 3
  explanation: |-
    $\vec v_{PG} = (40, 300)$ km/h, magnitude $\sqrt{40^2 + 300^2} = 302.7 \approx 303$ km/h, drifting $7.6^\circ$ east of north. 297 km/h would be the ground speed if it instead headed into the wind to fly due north.
- id: phys-q-0609
  lesson: phys-motion-2d
  module_quiz: true
  topic: Two-dimensional motion
  stem: 'An object''s velocity changes from $(3, 0)$ m/s to $(0, 4)$ m/s in 2.0 s. What is the magnitude of its average acceleration?'
  choices: ['0.5 m/s²', '2.5 m/s²', '3.5 m/s²', '0 m/s²']
  answer: 1
  explanation: |-
    $\Delta\vec v = (0 - 3, 4 - 0) = (-3, 4)$ m/s, magnitude 5 m/s. Divided by 2.0 s: 2.5 m/s². Subtracting speeds ($4 - 3 = 1$ m/s, giving 0.5 m/s²) ignores the change in direction.
- id: phys-q-0610
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'Observers in two frames moving at constant velocity relative to each other measure a ball''s motion. They agree on its'
  choices: ['velocity', 'position', 'acceleration', 'kinetic energy']
  answer: 2
  explanation: |-
    Their velocities for the ball differ by the constant relative velocity of the frames, $\vec v_{AC} = \vec v_{AB} + \vec v_{BC}$. A constant term doesn't change, so both see the same change in velocity over any interval, and hence the same acceleration. Velocities (and so kinetic energies) and positions differ between the frames.
- id: phys-q-0611
  lesson: phys-motion-2d
  topic: Relative motion
  stem: 'A passenger on a train moving east at constant velocity drops a ball. Ignoring air resistance, how does someone standing beside the track see the ball move?'
  choices: ['Along a parabola, moving east as it falls', 'Straight down', 'Along a parabola, curving west as it falls', 'Along a straight line slanting east']
  answer: 0
  explanation: |-
    To the passenger the ball falls straight down. Relative to the ground it starts with the train's eastward velocity, which stays constant while gravity speeds up its fall: a projectile launched horizontally, so a parabola moving east. It doesn't drift west because nothing slows its horizontal motion.
