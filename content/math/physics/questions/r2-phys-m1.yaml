- id: phys-m1-r2-h26
  lesson: phys-m1-h-vector-algebra
  type: text
  topic: Vector products
  stem: 'Write $\hat\imath\times\hat k$ as a signed unit vector (for example, -i). $\hat\imath\times\hat k =$ ___'
  accept: ['-j', '-ĵ', 'minus j', '-1j', '-y']
  explanation: |-
    Forward around the cycle, $\hat k\times\hat\imath = \hat\jmath$. Reversing the order flips the sign, so $\hat\imath\times\hat k = -\hat\jmath$. Check with the formula: $(1, 0, 0)\times(0, 0, 1) = (0\cdot1 - 0\cdot0,\ 0\cdot0 - 1\cdot1,\ 1\cdot0 - 0\cdot0) = (0, -1, 0)$.
- id: phys-m1-r2-h27
  lesson: phys-m1-h-vector-algebra
  type: text
  topic: Vector products
  stem: 'For $\vec A = 3\hat\imath - \hat\jmath + 2\hat k$ and $\vec B = \hat\imath + 2\hat\jmath$, $\vec A\times\vec B =$ ___ $\hat\imath$ + ___ $\hat\jmath$ + ___ $\hat k$. Give each component as a number.'
  accept:
    - ['-4']
    - ['2']
    - ['7']
  explanation: |-
    $x$: $A_yB_z - A_zB_y = (-1)(0) - (2)(2) = -4$. $y$: $A_zB_x - A_xB_z = (2)(1) - (3)(0) = 2$. $z$: $A_xB_y - A_yB_x = (3)(2) - (-1)(1) = 7$. Check: $\vec A\cdot(-4, 2, 7) = -12 - 2 + 14 = 0$ and $\vec B\cdot(-4, 2, 7) = -4 + 4 + 0 = 0$.
- id: phys-m1-r2-h28
  lesson: phys-m1-h-vector-algebra
  topic: Vector products
  stem: 'Which of these are true for all vectors $\vec A$, $\vec B$, $\vec C$? Select all that apply.'
  choices: ['$\vec A\times\vec B = -\vec B\times\vec A$', '$\vec A\cdot(\vec A\times\vec B) = 0$', '$\vec A\times\vec B = \vec B\times\vec A$', '$|\vec A\times\vec B| \le AB$', '$\vec A\times(\vec B\times\vec C) = (\vec A\times\vec B)\times\vec C$']
  answer: [0, 1, 3]
  explanation: |-
    The cross product is anticommutative (swapping flips the sign), so the third statement is false except when the product is zero. $\vec A\times\vec B$ is perpendicular to $\vec A$, so its dot product with $\vec A$ is 0. $|\vec A\times\vec B| = AB\sin\phi \le AB$. The cross product is not associative: for example, $\hat\imath\times(\hat\imath\times\hat\jmath) = \hat\imath\times\hat k = -\hat\jmath$, but $(\hat\imath\times\hat\imath)\times\hat\jmath = 0$.
- id: phys-m1-r2-h29
  lesson: phys-m1-h-vector-algebra
  type: match
  topic: Vector algebra
  stem: 'Match each expression to its geometric meaning.'
  pairs:
    - ['$|\vec A\times\vec B|$', 'Area of the parallelogram on A and B']
    - ['$|\vec A\cdot(\vec B\times\vec C)|$', 'Volume of the box on A, B and C']
    - ['$\vec A\cdot\vec B/A$', 'Component of B along A']
    - ['$\vec A/A$', 'Unit vector pointing along A']
  distractors: ['Angle between A and B']
  explanation: |-
    The cross product's magnitude $AB\sin\phi$ is base times height of the parallelogram. The triple product's absolute value is base area times height of the box. Dividing $\vec A\cdot\vec B$ by $A$ gives the scalar projection of $\vec B$ on $\vec A$. Dividing a vector by its magnitude gives a unit vector. The angle needs an inverse cosine: $\phi = \cos^{-1}[\vec A\cdot\vec B/(AB)]$.
- id: phys-m1-r2-h30
  lesson: phys-m1-h-vector-algebra
  topic: Vector products
  stem: 'A force $\vec F = 50\hat k$ N acts at $\vec r = 0.40\hat\imath$ m from a pivot. What is the torque $\vec\tau = \vec r\times\vec F$?'
  choices: ['$-20\hat\jmath$ N·m', '$20\hat\jmath$ N·m', '$20\hat k$ N·m', '$0$']
  answer: 0
  explanation: |-
    $\vec r\times\vec F = (0.40)(50)\,(\hat\imath\times\hat k) = 20(-\hat\jmath) = -20\hat\jmath$ N·m, since $\hat\imath\times\hat k = -\hat\jmath$. Getting $+20\hat\jmath$ means computing $\vec F\times\vec r$ (or $\hat k\times\hat\imath$). A torque is perpendicular to both $\vec r$ and $\vec F$, so it can't point along $\hat k$; it would be zero only if $\vec r$ and $\vec F$ were parallel.
