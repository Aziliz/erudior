# Round 2, module phys-m11 (Light and optics): new question types for the core lessons
# (q01–q20) and the two honors lessons (h01–h15 polarization, h16–h30 interferometers).

# ---- Core: phys-light
- id: phys-m11-r2-q01
  lesson: phys-light
  type: text
  topic: Reflection and refraction
  stem: 'Diamond has $n = 2.42$. The critical angle for light inside diamond reaching a diamond–air surface is ___ degrees, to the nearest degree. Give only the number.'
  accept: ['24', '24.4']
  explanation: |-
    $\sin\theta_c = n_2/n_1 = 1.00/2.42 = 0.413$, so $\theta_c = 24.4^\circ \approx 24^\circ$. The small critical angle traps light inside a cut diamond for many reflections, which is why diamonds sparkle.
- id: phys-m11-r2-q02
  lesson: phys-light
  type: order
  topic: Electromagnetic waves
  stem: 'Put these kinds of electromagnetic waves in order from lowest frequency to highest frequency.'
  items: [Radio waves, Microwaves, Infrared, Visible light, Ultraviolet, X-rays, Gamma rays]
  explanation: |-
    All travel at $c$, so $f = c/\lambda$: the longer the wavelength, the lower the frequency. Radio waves are longest (over a meter), then microwaves (mm to m), infrared, visible (400–700 nm), ultraviolet, X-rays, and gamma rays (shortest, highest frequency).
- id: phys-m11-r2-q03
  lesson: phys-light
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'Which statements about electromagnetic waves in vacuum are true? Select all that apply.'
  choices: ['The electric and magnetic fields are perpendicular to each other and to the direction of travel', 'All frequencies travel at the same speed, $3.00\times10^8$ m/s', 'They need a medium such as air to travel through', 'The field magnitudes are related by $E = cB$', 'Higher-frequency waves travel faster']
  answer: [0, 1, 3]
  explanation: |-
    EM waves are transverse, with $\vec E$, $\vec B$ and the direction of travel all mutually perpendicular, and in vacuum every frequency moves at $c = 1/\sqrt{\mu_0\varepsilon_0}$, with $E = cB$. They need no medium: light crosses empty space from the Sun. Their speed doesn't depend on frequency in vacuum; only in materials does the speed vary slightly with wavelength (dispersion).
- id: phys-m11-r2-q04
  lesson: phys-light
  type: label
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'The picture is a snapshot of an electromagnetic wave. Name the numbered parts.'
  image: {src: images/phys-m11-em-wave-blank.svg, alt: 'A wave traveling along a horizontal axis with an arrowhead at the right end, marked 4. One wave of vertical arrows has a trough marked 2. A second wave of slanted arrows, perpendicular to the first, is marked 3. A bracket between two crests of the vertical wave is marked 1.'}
  labels:
    - {x: 34.6, y: 18.6, text: Wavelength}
    - {x: 34.6, y: 76.2, text: Electric field}
    - {x: 12.7, y: 60.3, text: Magnetic field}
    - {x: 94.9, y: 50.0, text: Direction of travel}
  distractors: [Amplitude, Normal]
  explanation: |-
    The wave travels along the axis (4). The electric field (2) oscillates in one plane and the magnetic field (3) in the perpendicular plane, in step with it, so both peak at the same places. The distance from one crest to the next (1) is the wavelength. The amplitude would be the height of a crest above the axis, not the crest-to-crest distance.
- id: phys-m11-r2-q05
  lesson: phys-light
  type: match
  topic: Reflection and refraction
  stem: 'Match each everyday observation to the effect behind it.'
  pairs:
    - [A prism spreads white light into colors, Dispersion]
    - [An optical fiber carries light around bends, Total internal reflection]
    - [A straw looks bent where it enters water, Refraction]
    - [Polarized sunglasses cut glare from a road, Polarization]
    - [You see the trees reflected in a still pond, Reflection]
  distractors: [Diffraction]
  explanation: |-
    A prism's index depends slightly on wavelength (dispersion), so colors bend by different amounts. A fiber keeps light inside because it hits the wall beyond the critical angle (total internal reflection). Light from the underwater part of the straw bends at the surface (refraction), so it seems to come from a different place. Glare is partly polarized horizontally, and the glasses' vertical axis blocks it (polarization). A smooth surface gives a mirror image (reflection). Diffraction needs openings comparable to the wavelength and explains none of these.

# ---- Core: phys-mirrors-lenses
- id: phys-m11-r2-q06
  lesson: phys-mirrors-lenses
  type: text
  topic: Thin lenses
  stem: 'An object is 12 cm from a converging lens with a focal length of 8.0 cm. The image is ___ cm from the lens. Give only the number.'
  accept: ['24']
  explanation: |-
    $\dfrac1{d_i} = \dfrac1f - \dfrac1{d_o} = \dfrac18 - \dfrac1{12} = \dfrac{3 - 2}{24} = \dfrac1{24}$, so $d_i = 24$ cm. It is positive, so the image is real, on the far side of the lens; $m = -24/12 = -2$, inverted and twice as tall (the object is between $f$ and $2f$).
- id: phys-m11-r2-q07
  lesson: phys-mirrors-lenses
  type: label
  module_quiz: true
  topic: Mirrors
  stem: 'Name the numbered parts of this ray diagram for a concave mirror.'
  image: {src: images/phys-m11-concave-mirror-blank.svg, alt: 'A curved mirror on the right, marked 6, with a dashed horizontal axis marked 5. Two dots on the axis are marked 1 (farther from the mirror) and 2 (closer). An upright arrow on the left, beyond dot 1, is marked 3. Rays from its tip reflect and meet at a short inverted arrow between dots 1 and 2, marked 4.'}
  labels:
    - {x: 56.2, y: 52.5, text: Center of curvature}
    - {x: 71.9, y: 52.5, text: Focal point}
    - {x: 40.5, y: 40.0, text: Object}
    - {x: 60.9, y: 59.0, text: Real image}
    - {x: 12.5, y: 52.5, text: Principal axis}
    - {x: 87.2, y: 80.0, text: Concave mirror}
  distractors: [Virtual image]
  explanation: |-
    The focal point (2) is halfway between the mirror (6) and the center of curvature (1), since $f = R/2$. The object (3) stands beyond C, so the reflected rays really meet in front of the mirror, between C and F, forming a real, inverted, smaller image (4): here $d_o = 3f$ gives $d_i = 1.5f$ and $m = -0.5$. All of this is measured along the principal axis (5).
- id: phys-m11-r2-q08
  lesson: phys-mirrors-lenses
  type: order
  topic: Thin lenses
  stem: 'An object starts far from a converging lens and moves steadily toward it, ending very close to the lens. Put the images it produces in the order they appear.'
  items:
    - Real, inverted and smaller than the object
    - Real, inverted and the same size
    - Real, inverted and larger than the object
    - No image (rays leave the lens parallel)
    - Virtual, upright and larger than the object
  explanation: |-
    Beyond $2f$ the image is real, inverted and reduced; at exactly $2f$ it is the same size; between $f$ and $2f$ it is enlarged (a projector); at $f$ the rays emerge parallel, so no image forms; inside $f$ the image is virtual, upright and enlarged (a magnifying glass).
- id: phys-m11-r2-q09
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Mirrors
  stem: 'For a real object at any distance, which of these always form a virtual, upright image that is smaller than the object? Select all that apply.'
  choices: [A convex mirror, A diverging lens, A plane mirror, A concave mirror, A converging lens]
  answer: [0, 1]
  explanation: |-
    Convex mirrors and diverging lenses have $f < 0$, and with $d_o > 0$ the lens equation always gives $-|f| < d_i < 0$, so the image is virtual, upright and reduced. A plane mirror's image is virtual and upright but the same size. Concave mirrors and converging lenses give real inverted images for objects beyond $f$ and enlarged virtual images inside $f$, so they never give a reduced upright image.
- id: phys-m11-r2-q10
  lesson: phys-mirrors-lenses
  type: match
  topic: Thin lenses
  stem: 'Match each optical element to the sign of its focal length in the thin-lens and mirror equation.'
  pairs:
    - [Converging lens, Positive]
    - [Concave mirror, Positive]
    - [Diverging lens, Negative]
    - [Convex mirror, Negative]
    - [Plane mirror, No focal point (parallel rays stay parallel)]
  explanation: |-
    Optics that bring parallel rays to a real focus (converging lenses, concave mirrors) have $f > 0$. Optics that spread parallel rays as if from a point behind or in front of them (diverging lenses, convex mirrors) have $f < 0$. A plane mirror reflects parallel rays as parallel rays, so it has no focal point; you can think of its focal length as infinite, which makes the mirror equation give $d_i = -d_o$.

# ---- Core: phys-optical-instruments
- id: phys-m11-r2-q11
  lesson: phys-optical-instruments
  type: label
  module_quiz: true
  topic: Vision
  stem: 'Name the numbered parts of the eye.'
  image: {src: images/phys-m11-eye-blank.svg, alt: 'A cross-section of an eye with parallel rays entering from the left. Marker 1 is on the curved, clear front bulge. Marker 2 is on a dark bar beside the opening the rays pass through. Marker 3 is on the oval just behind that opening. Marker 4 is on the thick curved layer lining the back of the eye, where the rays meet. Marker 5 is on the band leaving the back of the eye.'}
  labels:
    - {x: 31.2, y: 64.8, text: Cornea}
    - {x: 37.8, y: 35.7, text: Iris}
    - {x: 42.5, y: 57.1, text: Lens}
    - {x: 71.9, y: 28.0, text: Retina}
    - {x: 87.5, y: 58.1, text: Optic nerve}
  distractors: [Pupil, Eyepiece]
  explanation: |-
    Light first bends at the curved cornea (1), which does most of the focusing. The iris (2) is the colored ring of tissue; the pupil is the opening in it, not the tissue itself. The lens (3) changes shape to fine-tune the focus (accommodation). The image forms on the retina (4), and the optic nerve (5) carries the signals to the brain. An eyepiece belongs to a microscope or telescope.
- id: phys-m11-r2-q12
  lesson: phys-optical-instruments
  type: text
  topic: Vision
  stem: 'A nearsighted person''s far point is 40 cm. Treating the lens as right at the eye, the contact lens they need has a power of ___ diopters. Give only the number, with its sign.'
  accept: ['-2.5', '−2.5']
  explanation: |-
    The lens must make a distant object's image at the far point on the object's side, so $f = -40$ cm $= -0.40$ m and $P = 1/f = 1/(-0.40\text{ m}) = -2.5$ D. The negative sign means a diverging lens; $+2.5$ would be the farsighted (converging) correction, and $-0.025$ comes from using centimeters instead of meters.
- id: phys-m11-r2-q13
  lesson: phys-optical-instruments
  type: match
  topic: Optical instruments
  stem: 'Match each instrument to its angular magnification ($f$ is a focal length; near point 25 cm).'
  pairs:
    - ['Magnifier, image at infinity', 25 cm divided by f]
    - ['Magnifier, image at the near point', 1 plus 25 cm divided by f]
    - [Compound microscope, Objective magnification times eyepiece magnification]
    - [Refracting telescope, Minus objective focal length over eyepiece focal length]
  distractors: [Objective focal length plus eyepiece focal length]
  explanation: |-
    A magnifier gives $M = 25\text{ cm}/f$ with the object at its focal point (relaxed eye) and $1 + 25\text{ cm}/f$ with the image at the near point. A microscope multiplies the objective's lateral magnification by the eyepiece's angular magnification. A telescope gives $M = -f_o/f_e$. The sum $f_o + f_e$ is the telescope's length, not a magnification.
- id: phys-m11-r2-q14
  lesson: phys-optical-instruments
  module_quiz: true
  topic: Optical instruments
  stem: 'A telescope''s objective is replaced by one with the same focal length but twice the diameter. Which of these change? Select all that apply.'
  choices: [It collects about four times as much light, It can resolve details about half as far apart in angle, Its angular magnification doubles, Its tube length doubles]
  answer: [0, 1]
  explanation: |-
    Light collected is proportional to the objective's area, which grows as $D^2$: four times as much. The smallest resolvable angle is proportional to $\lambda/D$, so it halves. Magnification $f_o/f_e$ and length $f_o + f_e$ depend only on focal lengths, which haven't changed.
- id: phys-m11-r2-q15
  lesson: phys-optical-instruments
  type: order
  topic: Optical instruments
  stem: 'Put the stages of image formation in a compound microscope in order, starting with the specimen.'
  items:
    - Specimen placed just outside the objective's focal point
    - Objective lens refracts the light
    - Real, inverted, enlarged image forms inside the tube
    - Eyepiece acts as a magnifier for that image
    - Eye views a final image at infinity
  explanation: |-
    The objective makes a real, enlarged intermediate image of a specimen placed just beyond its focal point. That image sits at the eyepiece's focal point, so the eyepiece, working as a magnifier, sends parallel rays to a relaxed eye. The overall magnification is the product of the two stages.

# ---- Core: phys-wave-optics
- id: phys-m11-r2-q16
  lesson: phys-wave-optics
  type: label
  module_quiz: true
  topic: Interference
  stem: 'Name the numbered parts of this double-slit setup.'
  image: {src: images/phys-m11-double-slit-blank.svg, alt: 'A box on the left, marked 1, sends a wide beam to a dark vertical barrier with two narrow openings, marked 2. A short bracket beside the openings is marked 3. A tall strip on the right with evenly spaced bright patches is marked 4, and its middle patch, straight ahead of the openings, is marked 5. A long bracket along the bottom from the barrier to the strip is marked 6.'}
  labels:
    - {x: 12.5, y: 47.6, text: Laser}
    - {x: 34.7, y: 16.7, text: Double slit}
    - {x: 30.6, y: 52.9, text: Slit separation d}
    - {x: 87.8, y: 81.0, text: Screen}
    - {x: 87.8, y: 47.6, text: Central bright fringe}
    - {x: 60.3, y: 90.5, text: Distance to the screen L}
  distractors: [Diffraction grating]
  explanation: |-
    A laser (1) provides coherent light, which passes through the double slit (2), two openings a distance $d$ apart (3). On the screen (4) at distance $L$ (6), bright fringes appear where $d\sin\theta = m\lambda$; the central one, $m = 0$ (5), is straight ahead, where the two paths are equal. A grating would have thousands of slits, not two.
- id: phys-m11-r2-q17
  lesson: phys-wave-optics
  type: text
  topic: Interference
  stem: 'In a double-slit experiment, $\lambda = 600$ nm, the slits are 0.30 mm apart and the screen is 1.5 m away. The bright fringes are ___ mm apart. Give only the number.'
  accept: ['3', '3.0']
  explanation: |-
    $\Delta y = \dfrac{\lambda L}{d} = \dfrac{(600\times10^{-9}\text{ m})(1.5\text{ m})}{0.30\times10^{-3}\text{ m}} = 3.0\times10^{-3}$ m $= 3.0$ mm.
- id: phys-m11-r2-q18
  lesson: phys-wave-optics
  type: match
  topic: Interference
  stem: 'Each condition locates fringes in a pattern. Match each one to whether it gives a bright or a dark fringe ($m$ is a whole number).'
  pairs:
    - ['Double slit: $d\sin\theta = m\lambda$', Bright]
    - ['Double slit: $d\sin\theta = (m + \tfrac12)\lambda$', Dark]
    - ['Single slit: $a\sin\theta = m\lambda$, $m \ne 0$', Dark]
    - ['Soap film in air (one flip), in reflection: $2nt = (m + \tfrac12)\lambda$', Bright]
    - ['Coating on glass (two flips), in reflection: $2nt = (m + \tfrac12)\lambda$', Dark]
  explanation: |-
    For two slits, a whole number of wavelengths of path difference gives a bright fringe and a half-integer number gives a dark one. The single-slit formula looks the same but marks dark fringes: pairing waves from the two halves of the slit, they cancel. In thin films the phase flips decide: with one flip the half-integer condition is bright; with two flips (which cancel each other) it is dark, the condition anti-reflection coatings use.
- id: phys-m11-r2-q19
  lesson: phys-wave-optics
  module_quiz: true
  topic: Interference
  stem: 'Which changes make the bright fringes in a double-slit pattern farther apart? Select all that apply.'
  choices: [Using red light instead of blue, Moving the screen farther from the slits, Moving the slits closer together, Using a brighter laser of the same color, Moving the slits farther apart]
  answer: [0, 1, 2]
  explanation: |-
    The spacing is $\Delta y = \lambda L/d$. It grows with a longer wavelength (red is longer than blue), a larger screen distance $L$, and a smaller slit spacing $d$. Brightness changes how bright the fringes are, not where they are, and moving the slits apart (larger $d$) squeezes the fringes together.
- id: phys-m11-r2-q20
  lesson: phys-wave-optics
  type: order
  topic: Interference
  stem: 'Put the steps for finding the thinnest anti-reflection coating (index $n$) on a glass lens in order.'
  items:
    - 'Count the reflections onto a higher index: two, at the top and bottom of the coating'
    - 'Note that the two phase flips cancel, so only the extra path $2t$ in the film matters'
    - 'For cancellation, set the extra path to half a wavelength in the film: $2nt = \tfrac12\lambda$'
    - 'Solve for the thickness: $t = \lambda/(4n)$'
  explanation: |-
    You can't choose the interference condition until you know how many flips there are, and you can't solve for $t$ until you have the condition. With $n = 1.38$ and $\lambda = 550$ nm this gives $t = 550/(4 \times 1.38) = 99.6$ nm.

# ---- Honors: phys-m11-h-polarization
- id: phys-m11-r2-h01
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'Light in air reflects from flint glass ($n = 1.66$). At what angle of incidence is the reflected light completely polarized?'
  choices: ['$37.0^\circ$', '$58.9^\circ$', '$31.1^\circ$', '$53.0^\circ$']
  answer: 1
  explanation: |-
    $\tan\theta_B = n_2/n_1 = 1.66$, so $\theta_B = 58.9^\circ$. $37.0^\circ$ comes from $\sin\theta = 1/1.66$ (the critical-angle formula, which doesn't even apply going into a denser medium); $31.1^\circ$ is the refraction angle at Brewster's angle, $90^\circ - 58.9^\circ$; $53.0^\circ$ uses $\cos\theta = 1/1.66$.
- id: phys-m11-r2-h02
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'Unpolarized light reflects from a lake at Brewster''s angle. The reflected light is'
  choices: ['polarized perpendicular to the plane of incidence, which is horizontal (parallel to the lake)', 'polarized in the plane of incidence, partly vertical', 'unpolarized but much weaker than the incident light', 'circularly polarized']
  answer: 0
  explanation: |-
    At Brewster's angle the p part (field in the plane of incidence) does not reflect at all, so only the s part, perpendicular to the plane of incidence, remains. For a horizontal surface that field is horizontal, which is why vertical-axis polarized sunglasses block this glare.
- id: phys-m11-r2-h03
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'Why does no p-polarized light reflect at Brewster''s angle?'
  choices: ['The p light is totally internally reflected inside the glass', 'The glass absorbs all of the p light at that angle', 'The electrons that would produce it oscillate along the direction the reflected ray would travel, and they cannot radiate along that line', 'The s and p reflections cancel each other by interference']
  answer: 2
  explanation: |-
    The refracted wave drives electrons along its field. For p light that field lies in the plane of incidence, perpendicular to the refracted ray. When the reflected direction is perpendicular to the refracted ray, it points along that oscillation, and an oscillating charge radiates nothing along its own line. Total internal reflection doesn't occur going into a denser medium, glass barely absorbs visible light, and s and p are perpendicular polarizations that don't cancel each other.
- id: phys-m11-r2-h04
  lesson: phys-m11-h-polarization
  type: text
  topic: Polarization by reflection and scattering
  stem: 'Light under water ($n = 1.33$) reaches the water–air surface. Its Brewster''s angle there is ___ degrees, to the nearest 0.1°. Give only the number.'
  accept: ['36.9']
  explanation: |-
    Now $n_1 = 1.33$ and $n_2 = 1.00$: $\tan\theta_B = 1.00/1.33 = 0.752$, so $\theta_B = 36.9^\circ$. It is the complement of the air-to-water value ($53.1^\circ$) and smaller than the critical angle, $48.8^\circ$, as Brewster's angle always is.
- id: phys-m11-r2-h05
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'Which of these are caused by Rayleigh scattering of sunlight by air molecules? Select all that apply.'
  choices: [The blue color of the clear sky, The red color of the setting Sun, The strong polarization of skylight $90^\circ$ from the Sun, The white color of clouds, The colors of a rainbow]
  answer: [0, 1, 2]
  explanation: |-
    Molecules are much smaller than the wavelength, so they scatter as $1/\lambda^4$: blue is scattered across the sky, leaving the long sunset path reddened, and scattering at $90^\circ$ is strongly polarized. Cloud droplets are larger than the wavelength and scatter all colors about equally (white), and rainbows come from refraction and dispersion inside raindrops.
- id: phys-m11-r2-h06
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'By what factor is 450 nm light scattered more strongly than 600 nm light by air molecules?'
  choices: ['1.33', '1.78', '2.37', '3.16']
  answer: 3
  explanation: |-
    Rayleigh scattering goes as $1/\lambda^4$: $(600/450)^4 = 1.333^4 = 3.16$. The other choices use the first, second and third powers of the ratio.
- id: phys-m11-r2-h07
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'A photographer rotates a polarizing filter to darken a clear blue sky. In which part of the sky does the filter have the strongest effect?'
  choices: ['Close to the Sun', 'About $90^\circ$ away from the Sun', 'Directly opposite the Sun', 'Everywhere equally']
  answer: 1
  explanation: |-
    Sunlight shakes the molecules' electrons perpendicular to the sunbeam. Looking $90^\circ$ from the Sun, the part of that motion along your line of sight sends you nothing, so you receive light polarized in one direction, which the filter can block. Near the Sun or directly opposite it, the scattering angle is small or near $180^\circ$ and the light is only weakly polarized.
- id: phys-m11-r2-h08
  lesson: phys-m11-h-polarization
  topic: Birefringence
  stem: 'A clear calcite crystal laid on a printed page shows every letter twice because calcite'
  choices: ['reflects light from both its top and bottom faces', 'has two indices of refraction, one for each of two perpendicular polarizations', 'spreads white light into colors more strongly than glass', 'diffracts light from its regular rows of atoms']
  answer: 1
  explanation: |-
    Calcite is birefringent: light polarized one way travels with $n_o = 1.658$ and light polarized at right angles with $n_e = 1.486$ (at 589 nm), so the two polarizations refract differently and form two images. A polarizer over the crystal can make either image vanish, which proves the two are polarized at right angles. Reflections and dispersion don't make two distinct images, and the atomic rows are far too close together to diffract visible light noticeably.
- id: phys-m11-r2-h09
  lesson: phys-m11-h-polarization
  type: text
  topic: Birefringence
  stem: 'Quartz has $|n_e - n_o| = 0.0091$. The thinnest quartz quarter-wave plate for 632.8 nm light is ___ μm thick, to 3 significant figures. Give only the number.'
  accept: ['17.4']
  explanation: |-
    A quarter-wave plate delays one polarization by $\lambda/4$: $t\,|n_e - n_o| = \lambda/4$, so $t = \dfrac{632.8\text{ nm}}{4(0.0091)} = 17\,400$ nm $= 17.4$ μm.
- id: phys-m11-r2-h10
  lesson: phys-m11-h-polarization
  topic: Birefringence
  stem: 'Linearly polarized light enters a half-wave plate with its polarization at $20^\circ$ to the plate''s fast axis. What comes out?'
  choices: ['Circularly polarized light', 'Linearly polarized light, rotated by $20^\circ$', 'Linearly polarized light, unchanged', 'Linearly polarized light, rotated by $40^\circ$']
  answer: 3
  explanation: |-
    A half-wave plate flips the component along one axis relative to the other, which mirrors the polarization across the fast axis: from $+20^\circ$ to $-20^\circ$, a rotation of $2(20^\circ) = 40^\circ$. Circular polarization comes from a quarter-wave plate with the light at $45^\circ$, and light is unchanged only if it is polarized along one of the axes.
- id: phys-m11-r2-h11
  lesson: phys-m11-h-polarization
  type: match
  topic: Birefringence
  stem: 'Match each optical element to what it does to polarized light.'
  pairs:
    - [Polarizer, Transmits only the field component along its axis]
    - ['Quarter-wave plate, light at $45^\circ$ to its axes', Turns linear polarization into circular]
    - [Half-wave plate, Rotates linear polarization by twice its angle to the fast axis]
    - [Glass surface at Brewster's angle, Reflects only light polarized parallel to the surface]
  distractors: [Doubles the frequency of the light]
  explanation: |-
    A polarizer absorbs the field component across its axis. Wave plates absorb nothing; they delay one component: a quarter-wave delay with equal components gives circular light, and a half-wave delay mirrors the polarization across the fast axis. At Brewster's angle only s light, polarized parallel to the surface, reflects. None of these changes the light's frequency.
- id: phys-m11-r2-h12
  lesson: phys-m11-h-polarization
  topic: Birefringence
  stem: 'In the simplified LCD model, a pixel between crossed polarizers turns the polarization by $\phi = 60^\circ$. What fraction of the unpolarized backlight $I_0$ gets through?'
  choices: ['$0.375I_0$', '$0.125I_0$', '$0.75I_0$', '$0.433I_0$']
  answer: 0
  explanation: |-
    The first polarizer passes $\tfrac12I_0$. The light is then at $60^\circ$ to the first axis, so at $30^\circ$ to the crossed second one: $I = \tfrac12I_0\cos^2 30^\circ = \tfrac12I_0\sin^2 60^\circ = 0.375I_0$. $0.125I_0$ uses $\cos^2 60^\circ$ (the angle to the wrong polarizer), $0.75I_0$ forgets the first polarizer's half, and $0.433I_0$ forgets to square.
- id: phys-m11-r2-h13
  lesson: phys-m11-h-polarization
  type: order
  topic: Birefringence
  stem: 'Put the stages of light passing through a bright (switched-off) twisted nematic LCD pixel in order.'
  items:
    - Unpolarized light leaves the backlight
    - The first polarizer passes half of it, polarized along its axis
    - The twisted liquid crystal rotates the polarization by 90°
    - The crossed second polarizer, now aligned with the light, lets it through
    - The light reaches the viewer
  explanation: |-
    The polarization must be set by the first polarizer before the liquid crystal can rotate it, and it must be rotated before it can pass the crossed second polarizer. With a voltage applied, the twist disappears and the third step no longer happens, so the second polarizer blocks the light.
- id: phys-m11-r2-h14
  lesson: phys-m11-h-polarization
  type: label
  topic: Polarization by reflection and scattering
  stem: 'Light reflects from glass at Brewster''s angle. Name the numbered parts.'
  image: {src: images/phys-m11-brewster-blank.svg, alt: 'A horizontal air–glass surface with a dashed vertical line (marker 4). A ray from the upper left (marker 1), with dots and double arrows along it, reaches the surface. A ray leaving to the upper right (marker 2) has only dots. A ray going down into the glass (marker 3) has mostly double arrows and one dot. Marker 5 is on an arc between the dashed line and the upper-left ray; marker 6 is on a square corner between the two outgoing rays.'}
  labels:
    - {x: 35.3, y: 37.2, text: Unpolarized incident light}
    - {x: 65.2, y: 36.7, text: Reflected light polarized parallel to the surface}
    - {x: 60.0, y: 72.9, text: Refracted light partly polarized}
    - {x: 50.0, y: 17.4, text: Normal}
    - {x: 46.7, y: 35.9, text: Brewster's angle}
    - {x: 53.9, y: 51.5, text: 90° between reflected and refracted rays}
  distractors: [Critical angle]
  explanation: |-
    Dots show the field perpendicular to the page (the s direction, parallel to the surface) and double arrows the field in the page (p). The incident light (1) has both. The reflected light (2) has only dots, because at Brewster's angle (5, measured from the normal, 4) no p light reflects. The refracted light (3) keeps all the p light and most of the s, so it is only partly polarized. The reflected and refracted rays are perpendicular (6), the condition that defines Brewster's angle. The critical angle applies only to light going toward a lower index.
- id: phys-m11-r2-h15
  lesson: phys-m11-h-polarization
  topic: Polarization by reflection and scattering
  stem: 'Unpolarized light of intensity 800 W/m² hits glass at Brewster''s angle, where the s part has a reflectance of 15.7% and the p part 0. What is the reflected intensity?'
  choices: ['126 W/m²', '0 W/m²', '63 W/m²', '400 W/m²']
  answer: 2
  explanation: |-
    Unpolarized light is half s and half p: 400 W/m² each. Only s reflects, so $I_r = 0.157 \times 400 = 63$ W/m², all s-polarized. 126 W/m² applies 15.7% to the full 800 W/m², forgetting that only half the light is s; 0 confuses "no p reflection" with no reflection at all; 400 W/m² is the whole s part.

# ---- Honors: phys-m11-h-interferometry
- id: phys-m11-r2-h16
  lesson: phys-m11-h-interferometry
  topic: Air wedges and Newton's rings
  stem: 'Two glass plates touching along one edge enclose a thin air wedge. In reflected light, the line where they touch is dark because'
  choices: ['no light reaches that line', 'the gap is zero there and exactly one of the two reflections is flipped, so they cancel', 'both reflections are flipped there, so they cancel', 'the glass absorbs light where the plates touch']
  answer: 1
  explanation: |-
    The reflection from glass into air (top plate's lower surface) has no flip; the reflection from air onto glass (bottom plate) has one. With zero gap there is no extra path, so the single half-wavelength flip makes the two reflections cancel. Two flips would cancel each other and give a bright line.
- id: phys-m11-r2-h17
  lesson: phys-m11-h-interferometry
  topic: Air wedges and Newton's rings
  stem: 'An air wedge is lit with 600 nm light. The spacer at the far end is 30 μm thick. How many dark fringes appear, counting the one at the touching edge?'
  choices: ['50', '51', '100', '101']
  answer: 3
  explanation: |-
    Dark fringes occur where $2t = m\lambda$, so $m$ runs from 0 to $2D/\lambda = 2(30\times10^{-6})/(600\times10^{-9}) = 100$: that's 101 dark fringes. 100 forgets the dark line at the touching edge; 50 and 51 use $D/\lambda$, forgetting that the light crosses the gap twice.
- id: phys-m11-r2-h18
  lesson: phys-m11-h-interferometry
  type: text
  topic: Air wedges and Newton's rings
  stem: 'An air wedge 5.0 cm long has a 25 μm spacer at its far end and is lit with 500 nm light. The dark fringes are ___ mm apart. Give only the number.'
  accept: ['0.5', '0.50']
  explanation: |-
    $\Delta x = \dfrac{\lambda L}{2D} = \dfrac{(500\times10^{-9})(0.050)}{2(25\times10^{-6})} = 5.0\times10^{-4}$ m $= 0.50$ mm.
- id: phys-m11-r2-h19
  lesson: phys-m11-h-interferometry
  topic: Air wedges and Newton's rings
  stem: 'An optical flat on a test surface shows straight fringes, except that one fringe bends aside by half the fringe spacing over a small region. With 600 nm light, about how high is the bump or dip there?'
  choices: ['600 nm', '300 nm', '75 nm', '150 nm']
  answer: 3
  explanation: |-
    Neighboring fringes are contour lines a height $\lambda/2 = 300$ nm apart. A shift of half a fringe spacing means half that height: $\lambda/4 = 150$ nm. 300 nm would be a full fringe of shift, and 600 nm forgets that the light crosses the gap twice.
- id: phys-m11-r2-h20
  lesson: phys-m11-h-interferometry
  topic: Air wedges and Newton's rings
  stem: 'A lens surface with radius of curvature 2.0 m rests on a flat plate and is lit with 550 nm light. What is the radius of the fourth dark ring (not counting the dark center)?'
  choices: ['2.10 mm', '1.48 mm', '2.97 mm', '1.05 mm']
  answer: 0
  explanation: |-
    $r_m = \sqrt{m\lambda R} = \sqrt{4(550\times10^{-9})(2.0)} = \sqrt{4.4\times10^{-6}}$ m $= 2.10$ mm. 1.48 mm uses $t = r^2/R$ instead of $r^2/(2R)$; 2.97 mm uses $t = m\lambda$, forgetting that the light crosses the gap twice; 1.05 mm is the first ring.
- id: phys-m11-r2-h21
  lesson: phys-m11-h-interferometry
  topic: Air wedges and Newton's rings
  stem: 'Which statements about Newton''s rings seen in reflected light are true? Select all that apply.'
  choices: ['The center, where the lens touches the plate, is dark', 'The rings get closer together farther from the center', 'The radius of the $m$th dark ring is proportional to $\sqrt m$', 'The rings are equally spaced', 'A flatter lens surface (larger $R$) gives smaller rings']
  answer: [0, 1, 2]
  explanation: |-
    With one phase flip and zero gap, the center is dark. The gap grows as $r^2/(2R)$, so dark rings sit at $r_m = \sqrt{m\lambda R}$: proportional to $\sqrt m$ and crowding together outward, not equally spaced. A larger $R$ makes every $r_m$ larger, not smaller.
- id: phys-m11-r2-h22
  lesson: phys-m11-h-interferometry
  type: text
  topic: Interferometers
  stem: 'The movable mirror of a Michelson interferometer lit with 632.8 nm light moves 0.200 mm. About ___ fringes pass the detector, to the nearest whole fringe. Give only the number.'
  accept: ['632']
  explanation: |-
    $N = \dfrac{2\Delta d}{\lambda} = \dfrac{2(0.200\times10^{-3})}{632.8\times10^{-9}} = 632.1$, about 632 fringes. Forgetting the factor of 2 (the light goes out and back) gives 316.
- id: phys-m11-r2-h23
  lesson: phys-m11-h-interferometry
  topic: Interferometers
  stem: 'A Michelson interferometer shows a bright spot at the center of its pattern. The movable mirror is then moved by a quarter of a wavelength. The center becomes'
  choices: ['dark, because the path difference changed by half a wavelength', 'bright again, because the path difference changed by a whole wavelength', 'unchanged, because a quarter wavelength is too small to matter', 'bright again after two fringes have passed']
  answer: 0
  explanation: |-
    Moving the mirror by $\lambda/4$ lengthens that arm's round trip by $2(\lambda/4) = \lambda/2$, turning constructive interference into destructive. A whole wavelength of path change needs a mirror motion of $\lambda/2$.
- id: phys-m11-r2-h24
  lesson: phys-m11-h-interferometry
  topic: Interferometers
  stem: 'A 4.00 cm cell in a Michelson interferometer is filled with helium ($n - 1 = 3.5\times10^{-5}$) while lit with 632.8 nm light. About how many fringes pass?'
  choices: ['2.2', '4.4', '44', '$1.3\times10^5$']
  answer: 1
  explanation: |-
    $N = \dfrac{2L(n - 1)}{\lambda} = \dfrac{2(0.0400)(3.5\times10^{-5})}{632.8\times10^{-9}} = 4.4$. 2.2 counts only one pass through the cell; 44 uses 40 cm for 4.00 cm; $1.3\times10^5$ uses $n$ instead of $n - 1$ (that is the total number of wavelengths in the cell, not the change).
- id: phys-m11-r2-h25
  lesson: phys-m11-h-interferometry
  type: order
  topic: Interferometers
  stem: 'Put the path of light through a Michelson interferometer in order.'
  items:
    - Light leaves the source
    - The beam splitter divides it into two beams
    - Each beam reflects from its mirror and returns
    - The beam splitter recombines the two beams
    - The combined light reaches the detector, where it interferes
  explanation: |-
    The beams must be split before they can travel separate arms, and they must return before they can be recombined. Any difference in the two round trips shows up as a shift in the fringes at the detector.
- id: phys-m11-r2-h26
  lesson: phys-m11-h-interferometry
  type: label
  topic: Interferometers
  stem: 'Name the numbered parts of this Michelson interferometer.'
  image: {src: images/phys-m11-michelson-blank.svg, alt: 'A box on the left, marked 1, sends a beam to a tilted plate at the center, marked 2. One beam goes right to a vertical plate with a double arrow beside it, marked 3, and back. Another goes up to a horizontal plate, marked 4, and back. The recombined beam goes down to a striped strip, marked 5.'}
  labels:
    - {x: 12.1, y: 51.9, text: Light source}
    - {x: 51.9, y: 47.7, text: Beam splitter}
    - {x: 84.7, y: 59.6, text: Movable mirror}
    - {x: 55.6, y: 14.0, text: Fixed mirror}
    - {x: 54.8, y: 85.0, text: Detector}
  distractors: [Diffraction grating]
  explanation: |-
    Light from the source (1) is split at the half-silvered beam splitter (2). One beam returns from the movable mirror (3, the double arrow shows it slides along the beam) and the other from the fixed mirror (4). The beam splitter recombines them and they interfere at the detector or screen (5). There is no grating: the two paths are separated by the beam splitter, not by diffraction.
- id: phys-m11-r2-h27
  lesson: phys-m11-h-interferometry
  topic: Interferometers
  stem: 'With white light, a Michelson interferometer shows colored fringes only when its two arms are equal to within about a micrometer. Why?'
  choices: ['The beam splitter absorbs white light unless the arms are equal', 'White light is not an electromagnetic wave', 'White light''s coherence length is only about a micrometer', 'White-light fringes are too close together to see unless the arms are equal']
  answer: 2
  explanation: |-
    White light spans about 300 nm of wavelengths, so its coherence length is roughly $\lambda^2/\Delta\lambda \approx (550\text{ nm})^2/300\text{ nm} \approx 1$ μm. Fringes form only when the path difference is shorter than that. (Laser light, with a far narrower spread of wavelengths, gives fringes over much larger path differences.)
- id: phys-m11-r2-h28
  lesson: phys-m11-h-interferometry
  topic: Interferometers
  stem: 'A light source has $\lambda = 600$ nm and a wavelength spread of $\Delta\lambda = 0.10$ nm. Estimate its coherence length.'
  choices: ['0.60 μm', '3.6 μm', '3.6 mm', '36 cm']
  answer: 2
  explanation: |-
    $\ell_c \approx \dfrac{\lambda^2}{\Delta\lambda} = \dfrac{(600\times10^{-9}\text{ m})^2}{0.10\times10^{-9}\text{ m}} = 3.6\times10^{-3}$ m $= 3.6$ mm, or about 6000 wavelengths. 0.60 μm is just one wavelength; 3.6 μm and 36 cm come from slipping powers of ten when converting nanometers to meters.
- id: phys-m11-r2-h29
  lesson: phys-m11-h-interferometry
  type: match
  topic: Interferometers
  stem: 'Match each interference measurement to what it measured or showed.'
  pairs:
    - [Michelson and Morley (1887), No sign of Earth's motion through an ether]
    - [LIGO (2015), Gravitational waves stretching and squeezing its arms]
    - [Air wedge, The thickness of a thin wire or hair]
    - [Gas cell in a Michelson interferometer, The index of refraction of a gas]
    - [Newton's rings, The radius of curvature of a lens surface]
  distractors: [The speed of sound in air]
  explanation: |-
    Michelson and Morley expected a shift of about 0.4 fringe from an ether wind and saw almost none. LIGO's 4 km arms changed length by a few times $10^{-18}$ m. An air wedge's fringe spacing gives the spacer thickness, a filling gas cell's fringe count gives $n - 1$, and the ring radii $r_m = \sqrt{m\lambda R}$ give $R$. None of these involves sound.
- id: phys-m11-r2-h30
  lesson: phys-m11-h-interferometry
  topic: Interferometers
  stem: 'Michelson and Morley expected their rotating interferometer to show a fringe shift of about 0.4 fringe from Earth''s motion through the ether. What did they observe?'
  choices: ['A shift of about 0.4 fringe, confirming the ether', 'A shift of about 0.8 fringe, twice the prediction', 'A shift that changed with the time of day exactly as predicted', 'At most a few hundredths of a fringe, consistent with no shift at all']
  answer: 3
  explanation: |-
    The "null result" of 1887 found far less than the predicted shift, consistent with zero. It stayed a puzzle until special relativity explained it: the speed of light is the same for every inertial observer, so there is no ether wind to detect.
