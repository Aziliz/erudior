- id: phys-q-4101
  lesson: phys-light
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'What is the wavelength of light with frequency $5.0\times10^{14}$ Hz in vacuum?'
  choices: ['$1.7\times10^{-6}$ m', '$1.5\times10^{23}$ m', '600 m', '600 nm']
  answer: 3
  explanation: |-
    $\lambda = c/f = (3.00\times10^8)/(5.0\times10^{14}) = 6.0\times10^{-7}$ m $= 600$ nm (orange light).
- id: phys-q-4102
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Which statement about electromagnetic waves is correct?'
  choices: ['They need a medium to travel', 'They are longitudinal', 'Their electric and magnetic fields are perpendicular to each other and to the direction of travel', 'Radio waves travel faster than visible light in vacuum']
  answer: 2
  explanation: |-
    EM waves are transverse, with $\vec E \perp \vec B \perp$ direction of travel, and all travel at $c$ in vacuum, needing no medium.
- id: phys-q-4103
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Order these from longest to shortest wavelength: X-rays, microwaves, visible light, ultraviolet.'
  choices: ['X-rays, ultraviolet, visible, microwaves', 'Microwaves, visible, ultraviolet, X-rays', 'Visible, microwaves, ultraviolet, X-rays', 'Microwaves, ultraviolet, visible, X-rays']
  answer: 1
  explanation: |-
    The spectrum runs radio, microwave, infrared, visible, ultraviolet, X-ray, gamma in order of decreasing wavelength (increasing frequency).
- id: phys-q-4104
  lesson: phys-light
  module_quiz: true
  topic: Reflection and refraction
  stem: 'Light passes from air into glass ($n = 1.50$) at $40^\circ$ to the normal. What is the angle of refraction?'
  choices: ['$25.4^\circ$', '$60.0^\circ$', '$74.6^\circ$', '$40^\circ$']
  answer: 0
  explanation: |-
    $\sin\theta_2 = \sin 40^\circ/1.50 = 0.429$, so $\theta_2 = 25.4^\circ$, bent toward the normal. 60° multiplies the angle by 1.5 instead of using sines.
- id: phys-q-4105
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'When light passes from air into water, which quantity does not change?'
  choices: ['Speed', 'Wavelength', 'Direction (at an angle)', 'Frequency']
  answer: 3
  explanation: |-
    The frequency is set by the source. Speed drops to $c/n$ and wavelength to $\lambda/n$, and the direction bends unless the light hits head-on.
- id: phys-q-4106
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'What is the critical angle for light going from water ($n = 1.33$) into air?'
  choices: ['$41.8^\circ$', '$53.1^\circ$', '$48.8^\circ$', 'There is none']
  answer: 2
  explanation: |-
    $\sin\theta_c = n_2/n_1 = 1.00/1.33 = 0.752$, so $\theta_c = 48.8^\circ$. Beyond this, light is totally internally reflected. (41.8° is the value for glass with $n = 1.5$.)
- id: phys-q-4107
  lesson: phys-light
  module_quiz: true
  topic: Reflection and refraction
  stem: 'Total internal reflection can occur when light travels'
  choices: ['from air into glass', 'only through optical fibers', 'from any medium into a mirror', 'from glass into air']
  answer: 3
  explanation: |-
    It requires going from higher to lower index, so the refracted ray bends away from the normal and can reach 90°. Going into a denser medium the light always refracts.
- id: phys-q-4108
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Unpolarized light of intensity $I_0$ passes through two polarizers whose axes are $60^\circ$ apart. The transmitted intensity is'
  choices: ['$0.125I_0$', '$0.25I_0$', '$0.50I_0$', '$0.75I_0$']
  answer: 0
  explanation: |-
    The first polarizer halves it: $0.5I_0$. Malus's law at the second: $0.5I_0\cos^2 60^\circ = 0.5I_0(0.25) = 0.125I_0$. Forgetting the first halving gives $0.25I_0$.
- id: phys-q-4109
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'A prism spreads white light into a spectrum because'
  choices: ['different colors travel at different speeds in glass (dispersion)', 'glass absorbs some colors', 'different colors reflect at different angles', 'white light is polarized by the prism']
  answer: 0
  explanation: |-
    The index of refraction depends on wavelength (violet is slowed and bent more than red), so each color refracts by a different angle.
- id: phys-q-4110
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'Light with a vacuum wavelength of 600 nm enters glass with $n = 1.50$. What are its wavelength and frequency inside the glass? ($c = 3.00\times10^8$ m/s)'
  choices: ['400 nm and $5.0\times10^{14}$ Hz', '900 nm and $5.0\times10^{14}$ Hz', '400 nm and $3.3\times10^{14}$ Hz', '600 nm and $3.3\times10^{14}$ Hz']
  answer: 0
  explanation: |-
    The frequency is fixed by the source: $f = c/\lambda = (3.00\times10^8)/(600\times10^{-9}) = 5.0\times10^{14}$ Hz, in air or glass. The speed drops to $c/n$, so the wavelength shrinks to $600/1.50 = 400$ nm. Multiplying by $n$ gives 900 nm; $3.3\times10^{14}$ Hz wrongly lets the frequency change with the speed.
- id: phys-q-4111
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Maxwell found the speed of electromagnetic waves to be $1/\sqrt{\mu_0\varepsilon_0}$. Why was this result so important?'
  choices: ['It showed light has mass', 'It matched the measured speed of light, revealing light as an EM wave', 'It proved the existence of an ether', 'It showed EM waves are longitudinal']
  answer: 1
  explanation: |-
    The constants from electricity and magnetism gave $3.00\times10^8$ m/s, the speed of light, uniting optics with electromagnetism.
- id: phys-q-4112
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Unpolarized light of intensity $I_0$ meets two crossed polarizers (axes at $90^\circ$), so nothing gets through. A third polarizer is then slipped between them at $45^\circ$ to each. Now the transmitted intensity is'
  choices: ['still zero', '$0.50I_0$', '$0.125I_0$', '$0.25I_0$']
  answer: 2
  explanation: |-
    First polarizer: $0.50I_0$. Middle one at $45^\circ$: $0.50I_0\cos^2 45^\circ = 0.25I_0$. Last one, at $45^\circ$ to the middle: $0.25I_0\cos^2 45^\circ = 0.125I_0$. Each polarizer re-polarizes the light along its own axis, so only the angle between neighbors matters. $0.25I_0$ stops after the middle polarizer.
- id: phys-q-4201
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Thin lenses
  stem: 'An object is 60 cm from a converging lens of focal length 20 cm. Where is the image?'
  choices: ['15 cm, virtual', '40 cm, real', '80 cm, real', '30 cm on the far side, real']
  answer: 3
  explanation: |-
    $\dfrac1{d_i} = \dfrac1{20} - \dfrac1{60} = \dfrac{2}{60}$, so $d_i = +30$ cm: real, on the far side, inverted, half size ($m = -0.5$).
- id: phys-q-4202
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'An object is 10 cm from a converging lens of focal length 15 cm. The image is'
  choices: ['real, inverted, 30 cm from the lens', 'virtual, upright, magnified 3 times', 'virtual, upright, reduced', 'real, upright, 6 cm away']
  answer: 1
  explanation: |-
    $\dfrac1{d_i} = \dfrac1{15} - \dfrac1{10} = -\dfrac1{30}$: $d_i = -30$ cm (virtual). $m = -(-30)/10 = +3$: upright and 3 times larger. Inside $f$, a converging lens is a magnifier.
- id: phys-q-4203
  lesson: phys-mirrors-lenses
  topic: Mirrors
  stem: 'A concave mirror has a radius of curvature of 20 cm. An object is 30 cm away. Where is the image?'
  choices: ['15 cm in front of the mirror, real', '12 cm behind the mirror', '60 cm in front of the mirror', '20 cm behind the mirror']
  answer: 0
  explanation: |-
    $f = R/2 = 10$ cm. $\dfrac1{d_i} = \dfrac1{10} - \dfrac1{30}$, so $d_i = 15$ cm, positive: real, in front of the mirror. Using $f = R = 20$ cm gives 60 cm.
- id: phys-q-4204
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Mirrors
  stem: 'A convex mirror always produces an image that is'
  choices: ['real and inverted', 'real and enlarged', 'virtual, upright and smaller', 'virtual and inverted']
  answer: 2
  explanation: |-
    With $f < 0$, the equation always gives $d_i < 0$ (virtual) and $0 < m < 1$ (upright, reduced). That's why convex mirrors give a wide field of view.
- id: phys-q-4205
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'An image has magnification $m = -2.0$. It is'
  choices: ['inverted and twice as large', 'upright and twice as large', 'inverted and half as large', 'upright and half as large']
  answer: 0
  explanation: |-
    A negative $m$ means inverted; $|m| = 2$ means twice the object's size.
- id: phys-q-4206
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'A diverging lens has focal length $-10$ cm. An object is 10 cm away. Where is the image?'
  choices: ['$d_i = -5.0$ cm, virtual', 'At infinity', '$d_i = +5.0$ cm, real', '$d_i = -20$ cm, virtual']
  answer: 0
  explanation: |-
    $\dfrac1{d_i} = -\dfrac1{10} - \dfrac1{10} = -\dfrac{2}{10}$, so $d_i = -5.0$ cm: virtual, upright, half size. Using $f = +10$ cm gives "at infinity".
- id: phys-q-4207
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'Where must an object be placed relative to a converging lens to form a real, enlarged image (as in a projector)?'
  choices: ['Inside $f$', 'Exactly at $f$', 'Beyond $2f$', 'Between $f$ and $2f$']
  answer: 3
  explanation: |-
    Between $f$ and $2f$ the image forms beyond $2f$ on the far side: real, inverted and enlarged. Beyond $2f$ it's reduced; inside $f$ it's virtual.
- id: phys-q-4208
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Thin lenses
  stem: 'A nearsighted person''s eyeglass prescription is $-2.5$ diopters. What kind of lens and focal length is that?'
  choices: ['Converging, 2.5 m', 'Diverging, 0.40 m', 'Diverging, 2.5 m', 'Converging, 0.40 m']
  answer: 1
  explanation: |-
    $P = 1/f$: $f = 1/(-2.5) = -0.40$ m. Negative power means a diverging lens, which corrects nearsightedness.
- id: phys-q-4209
  lesson: phys-mirrors-lenses
  topic: Mirrors
  stem: 'Your image in a flat bathroom mirror is'
  choices: ['real and the same size', 'virtual, upright, the same size, and as far behind the mirror as you are in front', 'virtual and half your size', 'real and inverted']
  answer: 1
  explanation: |-
    Rays only appear to come from behind a plane mirror (virtual); the image is upright, unmagnified, and $d_i = -d_o$.
- id: phys-q-4210
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'Two lenses are used in sequence; the first gives $m_1 = -4$ and the second $m_2 = -10$. The overall magnification is'
  choices: ['$-14$', '$+40$', '$-40$', '$+14$']
  answer: 1
  explanation: |-
    Magnifications multiply: $(-4)(-10) = +40$. The final image is upright relative to the object (inverted twice), as in some microscope arrangements.
- id: phys-q-4211
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'By the lensmaker''s equation, $1/f = (n - 1)(1/R_1 - 1/R_2)$, a lens immersed in water instead of air will have'
  choices: ['the same focal length', 'a shorter focal length', 'a longer focal length', 'no focal point']
  answer: 2
  explanation: |-
    In water, the relevant index is $n_{\text{lens}}/n_{\text{water}}$, closer to 1, so $(n - 1)$ shrinks and $f$ grows: the lens bends light less. That's why your vision is blurry underwater.
- id: phys-q-4212
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'An object starts far from a converging lens and moves toward it, stopping just outside the focal point. During this motion the real image'
  choices: ['moves toward the lens and shrinks', 'stays at the focal point', 'moves away from the lens and grows larger', 'becomes virtual and upright']
  answer: 2
  explanation: |-
    From $\dfrac{1}{d_i} = \dfrac1f - \dfrac{1}{d_o}$: as $d_o$ shrinks toward $f$, $\dfrac{1}{d_o}$ grows toward $\dfrac1f$, so $\dfrac{1}{d_i}$ shrinks toward zero and $d_i$ grows without limit. With $|m| = d_i/d_o$, the image also grows. It stays real while the object is outside $f$; only inside $f$ does it become virtual. The image is near the focal point only when the object is very far away.
- id: phys-q-4301
  lesson: phys-wave-optics
  module_quiz: true
  topic: Interference
  stem: 'In a double-slit experiment, $\lambda = 500$ nm, $d = 0.50$ mm and the screen is 1.5 m away. What is the spacing between bright fringes?'
  choices: ['1.5 mm', '0.15 mm', '15 mm', '0.75 mm']
  answer: 0
  explanation: |-
    $\Delta y = \lambda L/d = (500\times10^{-9})(1.5)/(0.50\times10^{-3}) = 1.5\times10^{-3}$ m.
- id: phys-q-4302
  lesson: phys-wave-optics
  topic: Interference
  stem: 'If the slit spacing in a double-slit experiment is halved, the fringe spacing'
  choices: ['halves', 'doubles', 'quadruples', 'stays the same']
  answer: 1
  explanation: |-
    $\Delta y = \lambda L/d$, inversely proportional to $d$: closer slits spread the pattern out.
- id: phys-q-4303
  lesson: phys-wave-optics
  topic: Interference
  stem: 'Why don''t two ordinary light bulbs produce a visible interference pattern?'
  choices: ['Their light is too bright', 'Their light travels too fast', 'They are not coherent; their phase relationship changes randomly', 'Light from bulbs is longitudinal']
  answer: 2
  explanation: |-
    A stable pattern requires a constant phase difference. Independent sources emit with randomly varying phases, so any fringes wash out instantly.
- id: phys-q-4304
  lesson: phys-wave-optics
  module_quiz: true
  topic: Diffraction
  stem: 'A grating with 600 lines/mm is lit with 500 nm light. At what angle is the first-order maximum?'
  choices: ['$0.017^\circ$', '$30^\circ$', '$1.7^\circ$', '$17.5^\circ$']
  answer: 3
  explanation: |-
    $d = 1/600$ mm $= 1.67\times10^{-6}$ m; $\sin\theta = \lambda/d = 0.30$, so $\theta = 17.5^\circ$.
- id: phys-q-4305
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'In single-slit diffraction, the condition $a\sin\theta = m\lambda$ ($m = \pm1, \pm2, \ldots$) locates'
  choices: ['the dark fringes', 'the bright fringes', 'the central maximum', 'the edges of the slit''s shadow']
  answer: 0
  explanation: |-
    For a single slit this is the condition for minima. (For double slits and gratings, $d\sin\theta = m\lambda$ gives maxima: a common mix-up.)
- id: phys-q-4306
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'Light of wavelength 600 nm passes through a slit 0.10 mm wide. What is the angle of the first dark fringe?'
  choices: ['$0.17^\circ$', '$34^\circ$', '$0.34^\circ$', '$3.4^\circ$']
  answer: 2
  explanation: |-
    $\sin\theta = \lambda/a = 600\times10^{-9}/1.0\times10^{-4} = 0.0060$, so $\theta = 0.34^\circ$. The central bright band spans twice this.
- id: phys-q-4307
  lesson: phys-wave-optics
  module_quiz: true
  topic: Diffraction
  stem: 'Why can a larger telescope mirror resolve finer detail?'
  choices: ['It collects light faster', 'It magnifies more', 'Its diffraction limit $1.22\lambda/D$ is smaller', 'It has a shorter focal length']
  answer: 2
  explanation: |-
    Diffraction blurs point sources into disks of angular size about $1.22\lambda/D$. A larger aperture $D$ shrinks the blur, separating closer objects.
- id: phys-q-4308
  lesson: phys-wave-optics
  topic: Interference
  stem: 'A soap film ($n = 1.33$) in air strongly reflects 532 nm light. What is its minimum thickness?'
  choices: ['200 nm', '100 nm', '400 nm', '266 nm']
  answer: 1
  explanation: |-
    One reflection (top surface) flips phase, so constructive reflection needs $2nt = \tfrac12\lambda$: $t = 532/(4 \times 1.33) = 100$ nm. Ignoring the phase flip gives 200 nm.
- id: phys-q-4309
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'Compared with a double slit of the same spacing, a diffraction grating produces maxima that are'
  choices: ['at different angles and broader', 'evenly spread across the screen', 'at the same angles and equally broad', 'at the same angles but much sharper and brighter']
  answer: 3
  explanation: |-
    The maxima still satisfy $d\sin\theta = m\lambda$, but with $N$ slits their width shrinks as $1/N$ and peak intensity grows as $N^2$.
- id: phys-q-4310
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'A grating has $d = 2.0$ μm. For 700 nm light, what is the highest order maximum that can appear?'
  choices: ['1', '3', '2', '4']
  answer: 2
  explanation: |-
    $\sin\theta = m\lambda/d \le 1$ requires $m \le 2.0/0.70 = 2.86$, so $m = 2$.
- id: phys-q-4311
  lesson: phys-wave-optics
  topic: Interference
  stem: 'In a double-slit pattern, the first dark fringe on either side of the central bright fringe is where the path difference $d\sin\theta$ from the two slits equals'
  choices: ['$\lambda$', '0', '$2\lambda$', '$\lambda/2$']
  answer: 3
  explanation: |-
    Dark fringes need the two waves to arrive exactly out of step: a path difference of $(m + \tfrac12)\lambda$, the smallest being $\lambda/2$. A path difference of $\lambda$ gives the first-order bright fringe, and 0 is the central bright fringe.
- id: phys-q-4312
  lesson: phys-wave-optics
  topic: Interference
  stem: 'A lens ($n = 1.52$) is coated with a film of $n = 1.38$ to cancel reflected 550 nm light. What is the minimum film thickness?'
  choices: ['199 nm', '100 nm', '138 nm', '50 nm']
  answer: 1
  explanation: |-
    Both reflections (air to film, film to glass) go to a higher index, so both flip and the flips cancel. Destructive interference then needs $2nt = \tfrac12\lambda$: $t = \dfrac{550}{4(1.38)} = 100$ nm. Using the one-flip soap-film condition, $2nt = \lambda$, gives 199 nm; 138 nm forgets that the wavelength in the film is $\lambda/n$.
