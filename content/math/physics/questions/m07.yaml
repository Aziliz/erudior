- id: phys-q-2301
  lesson: phys-fluid-statics
  module_quiz: true
  topic: Pressure
  stem: 'What is the absolute pressure 20 m below the surface of fresh water? ($P_{\text{atm}} = 1.013\times10^5$ Pa, $g = 9.8$ m/s²)'
  choices: ['$1.96\times10^5$ Pa', '$2.97\times10^5$ Pa', '$1.01\times10^5$ Pa', '$3.92\times10^5$ Pa']
  answer: 1
  explanation: |-
    $P = P_{\text{atm}} + \rho gh = 1.013\times10^5 + 1000(9.8)(20) = 2.97\times10^5$ Pa (about 3 atm). $1.96\times10^5$ Pa is the gauge pressure only.
- id: phys-q-2302
  lesson: phys-fluid-statics
  topic: Pressure
  stem: 'Three containers of different shapes are filled with water to the same depth. The pressure at the bottom is'
  choices: ['greatest in the widest container', 'greatest in the one holding the most water', 'the same in all three', 'greatest in the narrowest container']
  answer: 2
  explanation: |-
    Pressure in a static fluid depends only on depth: $P = P_0 + \rho gh$. Shape and total volume don't matter.
- id: phys-q-2303
  lesson: phys-fluid-statics
  topic: Pressure
  stem: 'A hydraulic lift has a small piston of radius 5.0 cm and a large piston of radius 50 cm. A 100 N force on the small piston can support'
  choices: ['1000 N', '100 N', '500 N', '10 000 N']
  answer: 3
  explanation: |-
    $F_2 = F_1(A_2/A_1) = 100(50/5.0)^2 = 100(100) = 10\,000$ N. Area scales with radius squared; using the radius ratio alone gives 1000 N.
- id: phys-q-2304
  lesson: phys-fluid-statics
  module_quiz: true
  topic: Buoyancy
  stem: 'A 50 N object with volume $2.0\times10^{-3}$ m³ is fully submerged in water. What is its apparent weight? ($g = 9.8$ m/s²)'
  choices: ['30.4 N', '50 N', '19.6 N', '69.6 N']
  answer: 0
  explanation: |-
    $F_B = \rho_{\text{water}}Vg = 1000(2.0\times10^{-3})(9.8) = 19.6$ N up. Apparent weight $= 50 - 19.6 = 30.4$ N. 19.6 N is the buoyant force itself.
- id: phys-q-2305
  lesson: phys-fluid-statics
  topic: Buoyancy
  stem: 'A block of wood with density 800 kg/m³ floats in water. What fraction of its volume is under water?'
  choices: ['20%', '80%', '50%', '100%']
  answer: 1
  explanation: |-
    A floating object displaces its own weight: $\rho_{\text{obj}}V = \rho_{\text{water}}V_{\text{sub}}$, so $V_{\text{sub}}/V = 800/1000 = 0.80$.
- id: phys-q-2306
  lesson: phys-fluid-statics
  topic: Buoyancy
  stem: 'The buoyant force on a fully submerged object depends on'
  choices: ['the object''s density', 'the object''s mass', 'the depth at which it is submerged', 'the volume of fluid it displaces and the fluid''s density']
  answer: 3
  explanation: |-
    Archimedes: $F_B = \rho_{\text{fluid}}V_{\text{disp}}g$. A lead block and an aluminum block of the same volume feel the same buoyant force; depth doesn't matter for an incompressible fluid.
- id: phys-q-2307
  lesson: phys-fluid-statics
  topic: Pressure
  stem: 'A tire gauge reads 220 kPa. The absolute pressure in the tire is about'
  choices: ['321 kPa', '220 kPa', '119 kPa', '101 kPa']
  answer: 0
  explanation: |-
    Gauges read pressure above atmospheric: absolute $= 220 + 101 = 321$ kPa.
- id: phys-q-2308
  lesson: phys-fluid-statics
  module_quiz: true
  topic: Pressure
  stem: 'Why does a mercury barometer stand about 760 mm tall at sea level, while a water barometer would need about 10.3 m?'
  choices: ['Water evaporates faster', 'Mercury is about 13.6 times denser, so a shorter column has the same weight per area', 'Mercury has lower surface tension', 'Atmospheric pressure pushes harder on mercury']
  answer: 1
  explanation: |-
    The column height satisfies $P_{\text{atm}} = \rho gh$, so $h \propto 1/\rho$. Mercury (13 600 kg/m³) needs a column 13.6 times shorter than water.
- id: phys-q-2309
  lesson: phys-fluid-statics
  topic: Pressure
  stem: 'The gauge pressure at the bottom of a tank of water is 30 kPa. Water is added until the depth is doubled. What is the absolute pressure at the bottom now? (Take $P_{\text{atm}} = 101$ kPa.)'
  choices: ['131 kPa', '262 kPa', '161 kPa', '60 kPa']
  answer: 2
  explanation: |-
    Gauge pressure is $\rho gh$, proportional to depth, so doubling the depth doubles it to 60 kPa. Absolute pressure adds the atmosphere: $101 + 60 = 161$ kPa. 60 kPa is the new gauge pressure alone; 262 kPa doubles the atmospheric part too, though the air above hasn't changed; 131 kPa is the absolute pressure before the water was added.
- id: phys-q-2310
  lesson: phys-fluid-statics
  topic: Buoyancy
  stem: 'A steel ship floats even though steel is about 8 times denser than water because'
  choices: ['steel becomes less dense in salt water', 'the ship''s average density, including the air inside its hull, is less than water''s', 'the engines push it up', 'the buoyant force on steel is larger than on other metals']
  answer: 1
  explanation: |-
    What matters is the average density of everything inside the hull's outline. A hull encloses a large volume of air, so it can displace its own weight of water before sinking too deep.
- id: phys-q-2311
  lesson: phys-fluid-statics
  topic: Pressure
  stem: 'A pool''s end wall is 4.0 m wide and the water against it is 2.5 m deep. What is the total force of the water on the wall, counting gauge pressure only? ($g = 9.8$ m/s²)'
  choices: ['$2.5\times10^5$ N', '$4.9\times10^4$ N', '$1.1\times10^6$ N', '$1.2\times10^5$ N']
  answer: 3
  explanation: |-
    Gauge pressure rises steadily from 0 at the surface to $\rho gD = 1000(9.8)(2.5) = 24\,500$ Pa at the bottom, so the average is 12 250 Pa. Force $=$ average pressure $\times$ area $= 12\,250(4.0)(2.5) = 1.2\times10^5$ N. Using the bottom pressure over the whole wall gives $2.5\times10^5$ N; multiplying by the width alone instead of the area gives $4.9\times10^4$ N; adding atmospheric pressure (which pushes equally on the other side) gives about $1.1\times10^6$ N.
- id: phys-q-2401
  lesson: phys-fluid-flow
  module_quiz: true
  topic: Fluid dynamics
  stem: 'Water flows at 2.0 m/s through a pipe of diameter 3.0 cm, which narrows to 1.0 cm. What is the speed in the narrow part?'
  choices: ['6.0 m/s', '0.67 m/s', '18 m/s', '4.0 m/s']
  answer: 2
  explanation: |-
    Continuity: $v_2 = v_1(A_1/A_2) = 2.0(3.0/1.0)^2 = 18$ m/s. Using the diameter ratio without squaring gives 6.0 m/s.
- id: phys-q-2402
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'In a horizontal pipe, where the flow speeds up through a constriction, the pressure'
  choices: ['decreases', 'increases', 'stays the same', 'drops to zero']
  answer: 0
  explanation: |-
    Bernoulli: $P + \tfrac12\rho v^2$ is constant at the same height. Higher $v$ means lower $P$; the pressure difference is what accelerates the fluid into the constriction.
- id: phys-q-2403
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'Water in a horizontal pipe has pressure $3.0\times10^5$ Pa where its speed is 2.0 m/s. What is the pressure where the speed is 8.0 m/s?'
  choices: ['$3.3\times10^5$ Pa', '$2.4\times10^5$ Pa', '$3.0\times10^5$ Pa', '$2.7\times10^5$ Pa']
  answer: 3
  explanation: |-
    $P_2 = P_1 + \tfrac12\rho(v_1^2 - v_2^2) = 3.0\times10^5 + 500(4 - 64) = 2.7\times10^5$ Pa. Adding instead of subtracting gives $3.3\times10^5$.
- id: phys-q-2404
  lesson: phys-fluid-flow
  module_quiz: true
  topic: Fluid dynamics
  stem: 'Water leaks from a small hole 5.0 m below the open surface of a large tank. How fast does it come out? ($g = 9.8$ m/s²)'
  choices: ['49 m/s', '7.0 m/s', '9.9 m/s', '5.0 m/s']
  answer: 2
  explanation: |-
    Torricelli: $v = \sqrt{2gh} = \sqrt{98} = 9.9$ m/s, the same as free fall from the surface. 7.0 m/s omits the 2.
- id: phys-q-2405
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'Which assumption is NOT part of the ideal fluid model used for Bernoulli''s equation?'
  choices: ['Incompressible', 'Nonviscous', 'Steady flow', 'Turbulent flow']
  answer: 3
  explanation: |-
    The ideal fluid is incompressible, nonviscous, steady and irrotational. Turbulence is exactly what it excludes.
- id: phys-q-2406
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'Strong wind blows over a house with closed windows during a storm. The roof may lift off because'
  choices: ['pressure above the roof is lower than the still air inside', 'the wind pushes up under the eaves only', 'pressure above the roof is higher than inside', 'the house is buoyant in air']
  answer: 0
  explanation: |-
    Fast-moving air above the roof has lower pressure (Bernoulli); the still air inside is at normal pressure, so the net force on the roof is upward.
- id: phys-q-2407
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'A garden hose delivers 0.50 L/s through a nozzle of area 0.50 cm². How fast does the water leave the nozzle?'
  choices: ['1.0 m/s', '0.25 m/s', '100 m/s', '10 m/s']
  answer: 3
  explanation: |-
    $Q = Av$: $v = \dfrac{5.0\times10^{-4}\text{ m}^3/\text{s}}{5.0\times10^{-5}\text{ m}^2} = 10$ m/s. (0.50 L $= 5.0\times10^{-4}$ m³; 0.50 cm² $= 5.0\times10^{-5}$ m².)
- id: phys-q-2408
  lesson: phys-fluid-flow
  module_quiz: true
  topic: Fluid dynamics
  stem: 'Bernoulli''s equation is a statement of conservation of'
  choices: ['mass', 'energy', 'momentum', 'volume']
  answer: 1
  explanation: |-
    Each term is energy per unit volume: pressure work, kinetic energy ($\tfrac12\rho v^2$) and gravitational energy ($\rho gy$). Conservation of mass gives the continuity equation.
- id: phys-q-2409
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'By Poiseuille''s law ($Q \propto R^4$ for viscous flow), if a pipe''s radius is halved with the same pressure difference, the flow rate becomes'
  choices: ['1/16 as large', '1/2 as large', '1/4 as large', '1/8 as large']
  answer: 0
  explanation: |-
    $(1/2)^4 = 1/16$. Viscous flow is extremely sensitive to radius, which is why narrowed arteries matter so much.
- id: phys-q-2410
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'A horizontal water main narrows. Bernoulli''s equation predicts a negative absolute pressure in the narrow section. What does this mean physically?'
  choices: ['The water flows backward', 'The pressure really is negative', 'The assumed flow is impossible; the water would cavitate (form vapor bubbles) first', 'The water speeds up even more']
  answer: 2
  explanation: |-
    Absolute pressure can't go below zero in a liquid. Before that, the liquid boils into vapor (cavitation), so the assumed steady flow can't occur.
- id: phys-q-2411
  lesson: phys-fluid-flow
  topic: Fluid dynamics
  stem: 'Water flows steadily up a pipe of constant diameter, rising 5.0 m. The pressure at the bottom is $2.0\times10^5$ Pa. What is the pressure at the top? ($g = 9.8$ m/s²)'
  choices: ['$2.5\times10^5$ Pa', '$2.0\times10^5$ Pa', '$4.9\times10^4$ Pa', '$1.5\times10^5$ Pa']
  answer: 3
  explanation: |-
    Constant diameter means constant speed (continuity), so the $\tfrac12\rho v^2$ terms cancel and only height matters: $P_2 = P_1 - \rho g\Delta y = 2.0\times10^5 - 1000(9.8)(5.0) = 1.51\times10^5$ Pa. Adding the $\rho gh$ term gives $2.5\times10^5$ Pa; ignoring the climb gives $2.0\times10^5$ Pa; $4.9\times10^4$ Pa is just the pressure change itself.
- id: phys-q-2501
  lesson: phys-heat
  module_quiz: true
  topic: Heat and calorimetry
  stem: 'How much heat raises the temperature of 2.0 kg of water by 30°C? ($c = 4186$ J/(kg·K))'
  choices: ['251 kJ', '125 kJ', '8.4 kJ', '2.51 kJ']
  answer: 0
  explanation: |-
    $Q = mc\Delta T = 2.0(4186)(30) = 251\,160$ J $\approx 251$ kJ. (A change of 30°C is a change of 30 K.)
- id: phys-q-2502
  lesson: phys-heat
  topic: Temperature and expansion
  stem: 'Room temperature, 25°C, is what in kelvins and in °F?'
  choices: ['298 K and 45°F', '248 K and 77°F', '298 K and 77°F', '25 K and 77°F']
  answer: 2
  explanation: |-
    $T = 25 + 273.15 = 298$ K. $T_F = \tfrac95(25) + 32 = 77$°F. 45°F forgets to add 32.
- id: phys-q-2503
  lesson: phys-heat
  topic: Heat and calorimetry
  stem: 'How much heat is needed to melt 0.50 kg of ice already at 0°C? ($L_f = 3.34\times10^5$ J/kg)'
  choices: ['$6.68\times10^5$ J', '$1.13\times10^6$ J', '0 J, since its temperature doesn''t change', '$1.67\times10^5$ J']
  answer: 3
  explanation: |-
    $Q = mL_f = 0.50(3.34\times10^5) = 1.67\times10^5$ J. Heat goes into breaking bonds, not raising temperature, during a phase change.
- id: phys-q-2504
  lesson: phys-heat
  module_quiz: true
  topic: Heat and calorimetry
  stem: 'A 0.10 kg copper block at 100°C ($c = 385$ J/(kg·K)) is placed in 0.40 kg of water at 20°C. Ignoring the container, what is the final temperature?'
  choices: ['60°C', '21.8°C', '28.0°C', '25.3°C']
  answer: 1
  explanation: |-
    $0.10(385)(T - 100) + 0.40(4186)(T - 20) = 0 \Rightarrow 38.5T - 3850 + 1674.4T - 33\,488 = 0$, so $T = 37\,338/1712.9 = 21.8$°C. Averaging the temperatures (60°C) ignores the very different heat capacities.
- id: phys-q-2505
  lesson: phys-heat
  module_quiz: true
  topic: Temperature and expansion
  stem: 'A 2.0 m aluminum rod ($\alpha = 23\times10^{-6}$ K⁻¹) is heated by 50 K. How much longer does it get?'
  choices: ['2.3 mm', '23 mm', '0.23 mm', '4.6 mm']
  answer: 0
  explanation: |-
    $\Delta L = \alpha L\Delta T = (23\times10^{-6})(2.0)(50) = 2.3\times10^{-3}$ m $= 2.3$ mm.
- id: phys-q-2506
  lesson: phys-heat
  topic: Heat and calorimetry
  stem: 'Why do coastal cities have milder temperature swings than inland cities?'
  choices: ['Water has a low specific heat', 'Water has a high specific heat, so the ocean changes temperature slowly', 'Water conducts heat very well', 'Sea breezes carry away all heat']
  answer: 1
  explanation: |-
    Water's specific heat (4186 J/(kg·K)) is several times that of soil or rock, so the ocean absorbs and releases large amounts of heat with small temperature changes.
- id: phys-q-2507
  lesson: phys-heat
  topic: Heat and calorimetry
  stem: 'A burn from 100°C steam is usually worse than one from the same mass of 100°C water because the steam'
  choices: ['is hotter', 'has a higher specific heat', 'releases its large latent heat of vaporization as it condenses on the skin', 'moves faster']
  answer: 2
  explanation: |-
    Condensing releases $L_v = 2.26\times10^6$ J/kg before the water even starts cooling, far more energy than cooling 100°C water to skin temperature.
- id: phys-q-2508
  lesson: phys-heat
  topic: Temperature and expansion
  stem: 'Lakes freeze from the top down because'
  choices: ['cold air is denser', 'ice sinks', 'water is densest at 0°C', 'water is densest near 4°C, so colder water stays near the top']
  answer: 3
  explanation: |-
    Below 4°C water expands as it cools, so the coldest water floats; ice (less dense still) forms on top and insulates the water below.
- id: phys-q-2509
  lesson: phys-heat
  module_quiz: true
  topic: Heat and calorimetry
  stem: 'Which mode of heat transfer can carry energy across a vacuum?'
  choices: ['Conduction', 'Convection', 'Radiation', 'All three']
  answer: 2
  explanation: |-
    Radiation is carried by electromagnetic waves and needs no medium; it's how sunlight reaches Earth. Conduction and convection need matter.
- id: phys-q-2510
  lesson: phys-heat
  topic: Heat and calorimetry
  stem: 'Heat conducts through a wall at 400 W. If the wall is replaced by one of the same material that is twice as thick, and the temperature difference across it is also doubled, the rate of heat flow becomes'
  choices: ['200 W', '800 W', '1600 W', '400 W']
  answer: 3
  explanation: |-
    $Q/t = kA\Delta T/L$. Doubling $\Delta T$ doubles the rate and doubling $L$ halves it, so the two changes cancel: still 400 W. 800 W counts only the temperature change; 200 W only the thickness change.
- id: phys-q-2511
  lesson: phys-heat
  topic: Heat and calorimetry
  stem: 'A mug of coffee at 70°C sits in a 20°C room and is losing heat at 10 W. Assuming the rate of heat loss is proportional to the temperature difference with the room, about how fast is it losing heat when it has cooled to 45°C?'
  choices: ['5.0 W', '6.4 W', '10 W', '2.5 W']
  answer: 0
  explanation: |-
    The temperature difference falls from $70 - 20 = 50$ K to $45 - 20 = 25$ K, half as much, so the rate halves to 5.0 W. 6.4 W comes from the ratio of the temperatures $45/70$ instead of the differences; the rate doesn't stay at 10 W because the driving difference has shrunk.
- id: phys-q-2601
  lesson: phys-gases
  module_quiz: true
  topic: Ideal gas law
  stem: 'What is the pressure of 2.0 mol of an ideal gas at 300 K in a 50 L container? ($R = 8.314$ J/(mol·K))'
  choices: ['99.8 Pa', '$1.0\times10^5$ Pa', '$5.0\times10^4$ Pa', '$2.5\times10^4$ Pa']
  answer: 1
  explanation: |-
    $P = nRT/V = 2.0(8.314)(300)/0.050 = 9.98\times10^4 \approx 1.0\times10^5$ Pa (about 1 atm). Using $V = 50$ instead of 0.050 m³ gives 99.8 Pa; leaving out $n = 2.0$ gives $5.0\times10^4$ Pa.
- id: phys-q-2602
  lesson: phys-gases
  topic: Ideal gas law
  stem: 'A sealed rigid container of gas is heated from 27°C to 327°C. Its pressure'
  choices: ['increases by a factor of 12', 'doubles', 'increases by 300 Pa', 'stays the same']
  answer: 1
  explanation: |-
    At constant volume $P \propto T$ in kelvins: $300\text{ K} \to 600$ K doubles the pressure. Using Celsius ($327/27$) gives the bogus factor of 12.
- id: phys-q-2603
  lesson: phys-gases
  topic: Ideal gas law
  stem: 'A gas at 1.0 atm occupies 6.0 L. At constant temperature it is compressed to 2.0 L. The new pressure is'
  choices: ['0.33 atm', '3.0 atm', '4.0 atm', '12 atm']
  answer: 1
  explanation: |-
    Boyle's law: $P_1V_1 = P_2V_2$, so $P_2 = 1.0(6.0/2.0) = 3.0$ atm.
- id: phys-q-2604
  lesson: phys-gases
  module_quiz: true
  topic: Kinetic theory
  stem: 'The absolute temperature of a gas is doubled. The rms speed of its molecules'
  choices: ['doubles', 'quadruples', 'increases by $\sqrt2$', 'stays the same']
  answer: 2
  explanation: |-
    $v_{\text{rms}} = \sqrt{3RT/M} \propto \sqrt T$, so doubling $T$ multiplies $v_{\text{rms}}$ by $\sqrt2 \approx 1.41$. It's the average kinetic energy that doubles.
- id: phys-q-2605
  lesson: phys-gases
  topic: Kinetic theory
  stem: 'Helium and oxygen are mixed at the same temperature. Compared with oxygen molecules, helium atoms have'
  choices: ['the same average kinetic energy but higher rms speed', 'higher average kinetic energy and higher speed', 'the same rms speed', 'lower average kinetic energy']
  answer: 0
  explanation: |-
    Average translational KE is $\tfrac32k_BT$, the same for any gas at the same $T$. With less mass, helium must move faster: $v_{\text{rms}} \propto 1/\sqrt M$.
- id: phys-q-2606
  lesson: phys-gases
  topic: Kinetic theory
  stem: 'What is the rms speed of O₂ molecules ($M = 0.032$ kg/mol) at 300 K?'
  choices: ['15.3 m/s', '279 m/s', '484 m/s', '342 m/s']
  answer: 2
  explanation: |-
    $v_{\text{rms}} = \sqrt{3RT/M} = \sqrt{3(8.314)(300)/0.032} = 484$ m/s. Using $M = 32$ (g/mol, not kg/mol) gives 15.3 m/s.
- id: phys-q-2607
  lesson: phys-gases
  topic: Kinetic theory
  stem: 'What is the average translational kinetic energy of a gas molecule at 600 K? ($k_B = 1.38\times10^{-23}$ J/K)'
  choices: ['$8.28\times10^{-21}$ J', '$1.24\times10^{-20}$ J', '$4.14\times10^{-21}$ J', '$2.48\times10^{-20}$ J']
  answer: 1
  explanation: |-
    $\overline K = \tfrac32k_BT = 1.5(1.38\times10^{-23})(600) = 1.24\times10^{-20}$ J.
- id: phys-q-2608
  lesson: phys-gases
  topic: Ideal gas law
  stem: 'The internal energy of a fixed amount of ideal gas depends only on its'
  choices: ['pressure', 'volume', 'density', 'temperature']
  answer: 3
  explanation: |-
    For an ideal gas the molecules don't interact, so internal energy is just their kinetic energy, $\tfrac32nRT$ for a monatomic gas: a function of $T$ alone.
- id: phys-q-2609
  lesson: phys-gases
  topic: Kinetic theory
  stem: 'A gas is heated from 300 K to 900 K. How does the graph of its molecular speed distribution change?'
  choices: ['The peak moves to higher speed and the curve becomes lower and broader', 'The peak moves to higher speed and the curve becomes taller and narrower', 'The peak stays at the same speed but the curve grows taller', 'The peak moves to lower speed and the curve becomes broader']
  answer: 0
  explanation: |-
    Hotter molecules move faster on average, so the peak shifts to higher speed, and the speeds spread over a wider range. The area under the curve represents all the molecules and can't change, so a wider curve must also be lower. A taller, narrower curve would describe a colder gas (or heavier molecules).
- id: phys-q-2610
  lesson: phys-gases
  module_quiz: true
  topic: Ideal gas law
  stem: 'A balloon holds 3.0 L of gas at 300 K and 1.0 atm. It is taken to where the pressure is 0.50 atm and the temperature 250 K. Its new volume is'
  choices: ['5.0 L', '7.2 L', '1.25 L', '3.6 L']
  answer: 0
  explanation: |-
    $\dfrac{P_1V_1}{T_1} = \dfrac{P_2V_2}{T_2}$: $V_2 = 3.0\cdot\dfrac{1.0}{0.50}\cdot\dfrac{250}{300} = 5.0$ L. Inverting the temperature ratio gives 7.2 L; inverting the pressure ratio gives 1.25 L.
- id: phys-q-2611
  lesson: phys-gases
  topic: Kinetic theory
  stem: 'The absolute temperature of a sample of monatomic ideal gas rises from 300 K to 450 K. By what factor does its internal energy change?'
  choices: ['2.25', '1.22', '1.5', 'It depends on whether the volume or the pressure is held fixed']
  answer: 2
  explanation: |-
    $E_{\text{int}} = \tfrac32nRT$ is proportional to $T$ in kelvins, so it changes by $450/300 = 1.5$, whatever the process. 1.22 is $\sqrt{1.5}$, the factor for the rms speed; 2.25 squares the temperature ratio.
- id: phys-q-2701
  lesson: phys-first-law
  module_quiz: true
  topic: First law of thermodynamics
  stem: 'A gas absorbs 800 J of heat and does 300 J of work on its surroundings. Its internal energy'
  choices: ['increases by 1100 J', 'decreases by 500 J', 'increases by 500 J', 'is unchanged']
  answer: 2
  explanation: |-
    $\Delta E_{\text{int}} = Q - W = 800 - 300 = +500$ J. Adding gives 1100 J, which would be the case if 300 J of work were done on the gas instead of by it.
- id: phys-q-2702
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'In an isothermal process for an ideal gas,'
  choices: ['no heat flows', 'no work is done', 'the pressure is constant', 'the internal energy doesn''t change, so $Q = W$']
  answer: 3
  explanation: |-
    Constant $T$ means constant $E_{\text{int}}$ for an ideal gas, so the heat absorbed equals the work done. "No heat flow" describes an adiabatic process.
- id: phys-q-2703
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'A gas expands at a constant pressure of $2.0\times10^5$ Pa from 1.0 L to 4.0 L. How much work does it do?'
  choices: ['600 J', '$6.0\times10^5$ J', '800 J', '200 J']
  answer: 0
  explanation: |-
    $W = P\Delta V = (2.0\times10^5)(3.0\times10^{-3}) = 600$ J. Forgetting to convert liters to m³ gives $6.0\times10^5$ J.
- id: phys-q-2704
  lesson: phys-first-law
  module_quiz: true
  topic: First law of thermodynamics
  stem: 'In an adiabatic expansion of an ideal gas, the gas'
  choices: ['warms up, because it does work', 'absorbs heat equal to the work it does', 'stays at the same temperature', 'cools, because it does work with no heat coming in']
  answer: 3
  explanation: |-
    $Q = 0$, so $\Delta E_{\text{int}} = -W < 0$ for an expansion: internal energy and temperature drop. This is why rising air cools.
- id: phys-q-2705
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'On a PV diagram, the work done by a gas during a process equals'
  choices: ['the slope of the curve', 'the area under the curve', 'the product of the final $P$ and $V$', 'the change in $PV$']
  answer: 1
  explanation: |-
    At constant pressure $W = P\Delta V$, the area of the rectangle under the path; for a changing pressure, add the areas of many thin strips. The slope of the curve is not work. Different paths between the same two states enclose different areas, so work is path-dependent.
- id: phys-q-2706
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'One mole of ideal gas at 400 K expands isothermally to twice its volume. How much work does it do? ($R = 8.314$ J/(mol·K))'
  choices: ['3326 J', '2305 J', '1153 J', '0 J']
  answer: 1
  explanation: |-
    $W = nRT\ln(V_f/V_i) = 8.314(400)\ln 2 = 2305$ J. 3326 J is $nRT$ without the logarithm.
- id: phys-q-2707
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'Why is the molar specific heat at constant pressure larger than at constant volume for a gas?'
  choices: ['At constant pressure some of the heat goes into work as the gas expands', 'Pressure adds kinetic energy to molecules', 'The gas has more molecules at constant pressure', 'It isn''t; they are equal']
  answer: 0
  explanation: |-
    At constant volume all heat raises $E_{\text{int}}$. At constant pressure the gas also expands and does work $nR\Delta T$, so $C_P = C_V + R$.
- id: phys-q-2708
  lesson: phys-first-law
  module_quiz: true
  topic: First law of thermodynamics
  stem: 'Over one complete cycle of a heat engine''s working gas, which is zero?'
  choices: ['The net work', 'The net heat', 'The change in internal energy', 'The efficiency']
  answer: 2
  explanation: |-
    The gas returns to its initial state, and internal energy is a state variable, so $\Delta E_{\text{int}} = 0$. Hence $Q_{\text{net}} = W_{\text{net}}$, the area enclosed by the cycle.
- id: phys-q-2709
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'Three moles of a monatomic ideal gas are heated at constant volume, raising the temperature by 50 K. How much heat is added?'
  choices: ['1247 J', '3118 J', '623 J', '1871 J']
  answer: 3
  explanation: |-
    $Q = nC_V\Delta T = 3(\tfrac32)(8.314)(50) = 1871$ J; no work is done at constant volume. 3118 J uses $C_P$.
- id: phys-q-2710
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'A monatomic gas ($\gamma = 5/3$) is compressed adiabatically to 1/8 of its volume. Its absolute temperature'
  choices: ['quadruples', 'increases 8 times', 'stays the same', 'doubles']
  answer: 0
  explanation: |-
    $TV^{\gamma - 1}$ is constant, so $T_f = T_i(8)^{2/3} = 4T_i$. Adiabatic compression heats a gas strongly (diesel ignition).
- id: phys-q-2711
  lesson: phys-first-law
  topic: First law of thermodynamics
  stem: 'A gas expands along a straight line on a PV diagram from 2.0 L at 400 kPa to 6.0 L at 200 kPa. How much work does the gas do?'
  choices: ['800 J', '1600 J', '1200 J', '$1.2\times10^6$ J']
  answer: 2
  explanation: |-
    The area under the line is a trapezoid: average pressure $300$ kPa times $\Delta V = 4.0\times10^{-3}$ m³ gives $1200$ J. Using only the final pressure gives 800 J and only the initial pressure 1600 J; forgetting to convert liters to m³ gives $1.2\times10^6$ J.
- id: phys-q-2801
  lesson: phys-second-law
  module_quiz: true
  topic: Heat engines
  stem: 'What is the maximum possible efficiency of an engine working between 600 K and 300 K?'
  choices: ['100%', '67%', '33%', '50%']
  answer: 3
  explanation: |-
    Carnot: $e = 1 - T_C/T_H = 1 - 300/600 = 0.50$.
- id: phys-q-2802
  lesson: phys-second-law
  topic: Heat engines
  stem: 'An engine takes in 1500 J of heat per cycle and exhausts 1050 J. What is its efficiency?'
  choices: ['30%', '70%', '43%', '58%']
  answer: 0
  explanation: |-
    $W = 1500 - 1050 = 450$ J; $e = W/Q_H = 450/1500 = 0.30$. 70% is $Q_C/Q_H$.
- id: phys-q-2803
  lesson: phys-second-law
  topic: Heat engines
  stem: 'A Carnot engine runs between 127°C and 7°C. Its efficiency is'
  choices: ['94%', '30%', '70%', '45%']
  answer: 1
  explanation: |-
    In kelvins: 400 K and 280 K. $e = 1 - 280/400 = 0.30$. Using Celsius ($1 - 7/127$) gives the impossible-looking 94%.
- id: phys-q-2804
  lesson: phys-second-law
  module_quiz: true
  topic: Heat engines
  stem: 'Which statement is a form of the second law of thermodynamics?'
  choices: ['Energy is conserved', 'No cyclic engine can convert heat entirely into work', 'The internal energy of an ideal gas depends only on temperature', 'Pressure is force per area']
  answer: 1
  explanation: |-
    That's the Kelvin–Planck statement; some heat must always be rejected to a colder reservoir. Energy conservation is the first law.
- id: phys-q-2805
  lesson: phys-second-law
  topic: Heat engines
  stem: 'A refrigerator removes 300 J of heat from its interior using 100 J of work. What is its coefficient of performance, and how much heat goes to the kitchen?'
  choices: ['3.0 and 400 J', '0.33 and 200 J', '3.0 and 200 J', '4.0 and 400 J']
  answer: 0
  explanation: |-
    $K = Q_C/W = 300/100 = 3.0$. Energy conservation: $Q_H = Q_C + W = 400$ J delivered to the kitchen.
- id: phys-q-2806
  lesson: phys-second-law
  topic: Entropy
  stem: 'A reservoir at 400 K absorbs 2000 J of heat. What is its entropy change?'
  choices: ['$+800\,000$ J/K', '$-5.0$ J/K', '$+0.20$ J/K', '$+5.0$ J/K']
  answer: 3
  explanation: |-
    $\Delta S = Q/T = 2000/400 = +5.0$ J/K (positive because heat flows in).
- id: phys-q-2807
  lesson: phys-second-law
  module_quiz: true
  topic: Entropy
  stem: 'When heat flows from a hot object to a cold object, the total entropy of the two'
  choices: ['decreases', 'stays the same', 'increases', 'becomes zero']
  answer: 2
  explanation: |-
    The hot object loses $Q/T_H$, the cold one gains $Q/T_C$, and since $T_C < T_H$ the gain is larger. Irreversible processes always raise total entropy.
- id: phys-q-2808
  lesson: phys-second-law
  topic: Entropy
  stem: 'What is the entropy change of 0.20 kg of ice melting at 0°C? ($L_f = 3.34\times10^5$ J/kg)'
  choices: ['$+245$ J/K', '$+6.68\times10^4$ J/K', '$-245$ J/K', 'Undefined, because the temperature is 0']
  answer: 0
  explanation: |-
    $\Delta S = mL_f/T = 0.20(3.34\times10^5)/273 = +245$ J/K. Using $T = 0$ (Celsius) would make it undefined; always use kelvins.
- id: phys-q-2809
  lesson: phys-second-law
  topic: Heat engines
  stem: 'A heat pump delivers 4 J of heat to a house for each 1 J of electrical work. Does this violate energy conservation?'
  choices: ['Yes, it creates 3 J', 'No: it moves 3 J of heat from outdoors plus the 1 J of work indoors', 'Yes, unless it is a Carnot engine', 'No, because heat is not energy']
  answer: 1
  explanation: |-
    $Q_H = Q_C + W$: 3 J extracted from the cold outdoors plus 1 J of work. A coefficient of performance above 1 is allowed; an efficiency above 1 is not.
- id: phys-q-2810
  lesson: phys-second-law
  topic: Entropy
  stem: '1.0 kg of ice melts at 0°C (273 K), taking its heat from a room at 20°C (293 K). What is the total entropy change of the ice and the room? ($L_f = 3.34\times10^5$ J/kg)'
  choices: ['$-84$ J/K', 'Zero, because the heat lost equals the heat gained', '$+84$ J/K', '$+2363$ J/K']
  answer: 2
  explanation: |-
    Ice: $+3.34\times10^5/273 = +1223.4$ J/K. Room: $-3.34\times10^5/293 = -1139.9$ J/K. Total: $+83.5 \approx +84$ J/K (keep extra digits when subtracting nearly equal numbers). The heat amounts are equal, but the room gives it up at a higher temperature, so its entropy loss is smaller than the ice's gain. Adding the two magnitudes gives 2363 J/K; reversing the signs gives $-84$ J/K.
- id: phys-q-2811
  lesson: phys-second-law
  topic: Heat engines
  stem: 'A Carnot engine absorbs 900 J per cycle from a reservoir at 450 K and rejects heat to a reservoir at 300 K. How much heat does it reject per cycle?'
  choices: ['300 J', '1350 J', 'Zero', '600 J']
  answer: 3
  explanation: |-
    For a reversible engine $Q_H/T_H = Q_C/T_C$, so $Q_C = 900(300/450) = 600$ J, and the work is $900 - 600 = 300$ J (efficiency $1/3$). 300 J is the work, not the rejected heat; 1350 J inverts the temperature ratio; zero would be a perfect engine, which the second law forbids.
