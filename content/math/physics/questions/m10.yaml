- id: phys-q-3701
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'A proton moves at $2.0\times10^6$ m/s perpendicular to a 0.50 T magnetic field. What force acts on it? ($e = 1.6\times10^{-19}$ C)'
  choices: ['$8.0\times10^{-14}$ N', '0 N', '$6.4\times10^{-13}$ N', '$1.6\times10^{-13}$ N']
  answer: 3
  explanation: |-
    $F = qvB\sin 90^\circ = (1.6\times10^{-19})(2.0\times10^6)(0.50) = 1.6\times10^{-13}$ N.
- id: phys-q-3702
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A charged particle moves parallel to a uniform magnetic field. The magnetic force on it is'
  choices: ['maximum', 'directed along the field', 'zero', 'directed opposite to its velocity']
  answer: 2
  explanation: |-
    $F = qvB\sin\theta$ with $\theta = 0$ gives zero. Only the velocity component perpendicular to $\vec B$ feels a force.
- id: phys-q-3703
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'Why does a magnetic field never change the speed of a charged particle?'
  choices: ['The force is too weak', 'The force is always perpendicular to the velocity, so it does no work', 'Magnetic fields only act on stationary charges', 'The force is parallel to the velocity']
  answer: 1
  explanation: |-
    The force is perpendicular to the velocity, so over any short step it acts at $90^\circ$ to the displacement and does work $Fd\cos 90^\circ = 0$. With no work done, kinetic energy and speed stay constant; only the direction changes.
- id: phys-q-3704
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'An electron moves at $1.0\times10^7$ m/s perpendicular to a 0.010 T field. What is the radius of its circular path? ($m_e = 9.11\times10^{-31}$ kg, $e = 1.6\times10^{-19}$ C)'
  choices: ['5.7 mm', '5.7 m', '0.57 mm', '57 cm']
  answer: 0
  explanation: |-
    $r = \dfrac{mv}{eB} = \dfrac{(9.11\times10^{-31})(1.0\times10^7)}{(1.6\times10^{-19})(0.010)} = 5.7\times10^{-3}$ m.
- id: phys-q-3705
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A wire carries current east in a magnetic field pointing up. With $x$ east, $y$ north and $z$ up, the force on the wire points'
  choices: ['north', 'down', 'up', 'south']
  answer: 3
  explanation: |-
    $\vec F = I\vec L\times\vec B \propto \hat\imath\times\hat k = -\hat\jmath$: south. Check with the right hand: fingers east, curl toward up, thumb points south.
- id: phys-q-3706
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A 0.40 m wire carrying 5.0 A lies perpendicular to a 0.20 T field. What force acts on it?'
  choices: ['10 N', '0.40 N', '0.10 N', '0.016 N']
  answer: 1
  explanation: |-
    $F = ILB = 5.0(0.40)(0.20) = 0.40$ N.
- id: phys-q-3707
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'The period of a charged particle circling in a uniform magnetic field'
  choices: ['increases with its speed', 'decreases with its speed', 'is independent of its speed', 'is proportional to its charge']
  answer: 2
  explanation: |-
    $r = mv/(qB)$ grows with $v$, so the circumference grows as fast as the speed: $T = 2\pi m/(qB)$ has no $v$. This makes the cyclotron possible.
- id: phys-q-3708
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'In a velocity selector with crossed fields $E = 2.0\times10^4$ V/m and $B = 0.10$ T, which particles pass straight through?'
  choices: ['Only positive ones', 'Only those with $v = 2.0\times10^3$ m/s', 'All particles regardless of speed', 'Those with $v = 2.0\times10^5$ m/s, of either sign']
  answer: 3
  explanation: |-
    Undeflected when $qE = qvB$: $v = E/B = 2.0\times10^5$ m/s. The charge cancels, so the sign and size of $q$ don't matter.
- id: phys-q-3709
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A current loop in a uniform magnetic field experiences'
  choices: ['a net force but no torque', 'a torque that tends to align its normal with the field, and zero net force', 'neither force nor torque', 'a force along the field']
  answer: 1
  explanation: |-
    Forces on opposite sides cancel in a uniform field, but they form a couple: $\tau = NIAB\sin\phi$. That torque drives electric motors.
- id: phys-q-3710
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'In a mass spectrometer, singly charged ions with the same speed enter a magnetic field. A heavier isotope'
  choices: ['travels in a larger circle', 'travels in a smaller circle', 'travels in a straight line', 'travels in the same circle']
  answer: 0
  explanation: |-
    $r = mv/(qB)$: at the same speed and charge, radius is proportional to mass, so heavier ions curve less and land farther away.
- id: phys-q-3711
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A velocity selector is set so that ions moving at speed $v_0$ pass straight through. An ion moving faster than $v_0$ is'
  choices: ['deflected in the direction of the electric force', 'deflected in the direction of the magnetic force', 'not deflected, because the forces still balance', 'slowed down until its speed is $v_0$']
  answer: 1
  explanation: |-
    The electric force $qE$ doesn't depend on speed, but the magnetic force $qvB$ grows with $v$. For a faster ion the magnetic force wins, so it bends toward the magnetic force's side. The magnetic force does no work, so the ion isn't slowed to $v_0$.
- id: phys-q-3712
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A proton moves in a circle in a uniform magnetic field. If its speed is doubled, its radius and its period become'
  choices: ['radius doubled, period doubled', 'radius halved, period unchanged', 'radius unchanged, period halved', 'radius doubled, period unchanged']
  answer: 3
  explanation: |-
    $r = \dfrac{mv}{|q|B}$ is proportional to $v$, so the radius doubles. The period $T = \dfrac{2\pi r}{v} = \dfrac{2\pi m}{|q|B}$ has no $v$: twice the circumference at twice the speed takes the same time. Doubling the period too would assume the speed stayed the same around a bigger circle.
- id: phys-q-3801
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'A long straight wire carries 10 A. What is the magnetic field 2.0 cm away? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$1.0\times10^{-4}$ T', '$3.1\times10^{-4}$ T', '$1.0\times10^{-6}$ T', '$5.0\times10^{-3}$ T']
  answer: 0
  explanation: |-
    $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{(4\pi\times10^{-7})(10)}{2\pi(0.020)} = 1.0\times10^{-4}$ T. Using the loop-center formula $\mu_0I/(2r)$ by mistake gives $3.1\times10^{-4}$ T.
- id: phys-q-3802
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Doubling the distance from a long straight current-carrying wire changes its field by a factor of'
  choices: ['1/4', '2', '1/2', '1']
  answer: 2
  explanation: |-
    $B \propto 1/r$ for a straight wire, so doubling $r$ halves $B$. (The $1/r^2$ law is for point sources.)
- id: phys-q-3803
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'A solenoid has 1000 turns per meter and carries 2.0 A. What is the field inside? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$2.5\times10^{-6}$ T', '$4.0\times10^{-4}$ T', '$1.3\times10^{-3}$ T', '$2.5\times10^{-3}$ T']
  answer: 3
  explanation: |-
    $B = \mu_0nI = (4\pi\times10^{-7})(1000)(2.0) = 2.5\times10^{-3}$ T, uniform across the interior.
- id: phys-q-3804
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'Two long parallel wires carry currents in the same direction. They'
  choices: ['repel', 'twist toward perpendicular', 'exert no force on each other', 'attract']
  answer: 3
  explanation: |-
    Each wire sits in the other's circular field; the right-hand rules give a force toward the other wire. Like currents attract and opposite currents repel, the reverse of electric charges.
- id: phys-q-3805
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Two parallel wires 10 cm apart each carry 5.0 A. What is the force per meter between them?'
  choices: ['$5.0\times10^{-5}$ N/m', '$2.5\times10^{-4}$ N/m', '$5.0\times10^{-6}$ N/m', '$1.6\times10^{-4}$ N/m']
  answer: 0
  explanation: |-
    $\dfrac FL = \dfrac{\mu_0I_1I_2}{2\pi d} = \dfrac{(2\times10^{-7})(5.0)(5.0)}{0.10} = 5.0\times10^{-5}$ N/m.
- id: phys-q-3806
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Current flows counterclockwise in a horizontal loop as seen from above. At the loop''s center the field points'
  choices: ['up', 'down', 'counterclockwise', 'toward the loop wire']
  answer: 0
  explanation: |-
    Curl right-hand fingers counterclockwise (seen from above): the thumb points up. The loop's upper face acts as a north pole.
- id: phys-q-3807
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'What is the field at the center of a single circular loop of radius 10 cm carrying 5.0 A? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$1.0\times10^{-5}$ T', '$6.3\times10^{-5}$ T', '$3.1\times10^{-6}$ T', '$3.1\times10^{-5}$ T']
  answer: 3
  explanation: |-
    $B = \dfrac{\mu_0I}{2R} = \dfrac{(4\pi\times10^{-7})(5.0)}{0.20} = 3.1\times10^{-5}$ T. $1.0\times10^{-5}$ is the straight-wire formula at 10 cm.
- id: phys-q-3808
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'For a path along which the field is constant and points along the path, Ampère''s law says $B\times(\text{path length}) = \mu_0I_{\text{enc}}$. Applied to a circle of radius $r$ centered on a long straight wire, it gives'
  choices: ['$B = \mu_0I/(4\pi r^2)$', '$B = \mu_0nI$', '$B = \mu_0I/(2\pi r)$', '$B = \mu_0I/(2r)$']
  answer: 2
  explanation: |-
    By symmetry $B$ is the same all the way around the circle and points along it. The path length is $2\pi r$, so $B(2\pi r) = \mu_0I$. $\mu_0I/(2r)$ is the field at the center of a loop, and $\mu_0nI$ is a solenoid's.
- id: phys-q-3809
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Inserting an iron core into a current-carrying solenoid greatly increases the field because'
  choices: ['iron conducts current better', 'the magnetic domains in the iron align with the field and add their own', 'iron increases the number of turns', 'iron stores charge']
  answer: 1
  explanation: |-
    Iron is ferromagnetic: its domains line up with the applied field, contributing a much larger field of their own. That's the principle of the electromagnet.
- id: phys-q-3810
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Two long parallel wires 10 cm apart each carry 20 A out of the page. What is the magnetic field at the point midway between them? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$8.0\times10^{-5}$ T', '$1.6\times10^{-4}$ T', '$4.0\times10^{-5}$ T', 'zero']
  answer: 3
  explanation: |-
    Each wire alone gives $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{(4\pi\times10^{-7})(20)}{2\pi(0.050)} = 8.0\times10^{-5}$ T at 5.0 cm. Both fields circle counterclockwise, so at the midpoint one points up the page and the other down: they cancel. Adding them gives $1.6\times10^{-4}$ T, which is the answer only if the currents are opposite; $4.0\times10^{-5}$ T uses the full 10 cm as the distance.
- id: phys-q-3811
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'A solenoid''s number of turns is doubled and its length is halved, with the same current. The field inside becomes'
  choices: ['twice as large', '4 times as large', 'the same', 'half as large']
  answer: 1
  explanation: |-
    $B = \mu_0nI$ with $n = N/\ell$. Doubling $N$ and halving $\ell$ multiplies $n$ by $2 \times 2 = 4$, so $B$ is 4 times larger. Twice as large comes from noticing only one of the two changes.
- id: phys-q-3901
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A 100-turn coil of area 0.020 m² is perpendicular to a field that rises from 0.20 T to 0.60 T in 0.10 s. What emf is induced?'
  choices: ['0.80 V', '8.0 V', '0.080 V', '12 V']
  answer: 1
  explanation: |-
    $|\mathcal{E}| = N\dfrac{\Delta\Phi}{\Delta t} = 100\dfrac{(0.40)(0.020)}{0.10} = 8.0$ V. Leaving out $N$ gives 0.080 V.
- id: phys-q-3902
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A strong magnet rests motionless inside a coil connected to a meter. The meter reads'
  choices: ['a large current', 'a small steady current', 'zero', 'an alternating current']
  answer: 2
  explanation: |-
    Only a changing flux induces an emf. A stationary magnet gives constant flux, so there's no induced current.
- id: phys-q-3903
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'The north pole of a magnet is pushed toward a loop. By Lenz''s law, the induced current makes the loop''s near face act like'
  choices: ['a south pole, attracting the magnet', 'nothing; there is no current', 'a north pole only if the loop is copper', 'a north pole, repelling the magnet']
  answer: 3
  explanation: |-
    The flux from the approaching north pole is increasing, so the induced current opposes it, making a north face that repels the magnet. You must do work to push it in, which becomes electrical energy.
- id: phys-q-3904
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A 0.50 m rod slides at 10 m/s along rails in a 2.0 T field perpendicular to the rails. What emf is induced?'
  choices: ['10 V', '1.0 V', '2.5 V', '40 V']
  answer: 0
  explanation: |-
    Motional emf $\mathcal{E} = BLv = 2.0(0.50)(10) = 10$ V.
- id: phys-q-3905
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Lenz''s law is ultimately a consequence of conservation of'
  choices: ['charge', 'energy', 'momentum', 'magnetic poles']
  answer: 1
  explanation: |-
    If induced currents aided the change, a small push would produce runaway motion and energy from nothing. Opposing the change means work must be done to generate electrical energy.
- id: phys-q-3906
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A transformer has 50 primary turns and 500 secondary turns. With 120 V AC on the primary, the secondary voltage is'
  choices: ['12 V', '120 V', '1200 V', '0 V']
  answer: 2
  explanation: |-
    $V_s = V_p(N_s/N_p) = 120(10) = 1200$ V. The current is stepped down by the same factor (ideal transformer).
- id: phys-q-3907
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Why won''t a transformer work with a steady DC current in the primary?'
  choices: ['DC is too weak', 'Iron cores block DC', 'DC produces no magnetic field', 'A steady current makes a constant flux, so no emf is induced in the secondary']
  answer: 3
  explanation: |-
    Faraday's law needs a changing flux. Steady DC produces a steady field, so the flux through the secondary doesn't change and no emf is induced. (DC does make a magnetic field; it just isn't changing.)
- id: phys-q-3908
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A generator coil rotates at angular speed $\omega$ in a uniform field. If $\omega$ is doubled, the peak emf'
  choices: ['doubles', 'halves', 'quadruples', 'is unchanged']
  answer: 0
  explanation: |-
    $\mathcal{E}_{\max} = NBA\omega$: proportional to $\omega$ (and the frequency of the AC doubles too).
- id: phys-q-3909
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'The flux through a single loop rises steadily from 0 to 0.060 Wb in 0.20 s, stays at 0.060 Wb for 0.50 s, then falls steadily to 0 in 0.10 s. When is the induced emf largest, and how large is it?'
  choices: ['During the rise: 0.30 V', 'During the steady part: 0.060 V', 'During the fall: 0.60 V', 'During the fall: 0.060 V']
  answer: 2
  explanation: |-
    The emf is the slope of the flux–time graph. Rise: $0.060/0.20 = 0.30$ V. Steady: slope zero, so no emf even though the flux is largest. Fall: $0.060/0.10 = 0.60$ V, the largest because the same change happens fastest. 0.060 V is the flux itself, not its rate of change.
- id: phys-q-3910
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Magnetic brakes on a roller coaster use fins passing between strong magnets. The braking force comes from'
  choices: ['friction between fin and magnet', 'eddy currents in the fins, whose fields oppose the motion', 'static electricity', 'air resistance around the magnets']
  answer: 1
  explanation: |-
    The changing flux through the moving metal induces eddy currents; by Lenz's law their magnetic forces oppose the motion, converting kinetic energy to heat without contact.
- id: phys-q-3911
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A coil rotates steadily in a uniform magnetic field. At the instant the flux through the coil is at its maximum, the induced emf is'
  choices: ['zero, because the flux is momentarily not changing', 'at its maximum, because the flux is at its maximum', 'half of its peak value', 'equal to $NBA$']
  answer: 0
  explanation: |-
    The emf depends on the rate of change of flux, the slope of the flux–time graph. At a maximum of the cosine-shaped flux curve the graph is momentarily flat, so the emf is zero. The emf peaks a quarter turn later, when the flux passes through zero and changes fastest.
- id: phys-q-3912
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A 100-turn coil of area 0.020 m² rotates at 60 revolutions per second in a 0.50 T field. What is the peak emf?'
  choices: ['60 V', '3.8 V', '377 V', '188 V']
  answer: 2
  explanation: |-
    $\omega = 2\pi f = 2\pi(60) = 377$ rad/s, so $\mathcal{E}_{\max} = NBA\omega = 100(0.50)(0.020)(377) = 377$ V. Using 60 in place of $\omega$ gives 60 V; leaving out $N$ gives 3.8 V.
- id: phys-q-4001
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'What is the time constant of a circuit with a 0.50 H inductor in series with a 10 Ω resistor?'
  choices: ['5.0 s', '20 s', '0.50 s', '0.050 s']
  answer: 3
  explanation: |-
    $\tau = L/R = 0.50/10 = 0.050$ s. $LR = 5.0$ is not a time constant; that would be confusing it with $RC$-style multiplication.
- id: phys-q-4002
  lesson: phys-inductance
  topic: Inductance
  stem: 'How much energy is stored in a 2.0 H inductor carrying 0.30 A?'
  choices: ['0.18 J', '0.090 J', '0.60 J', '0.30 J']
  answer: 1
  explanation: |-
    $U = \tfrac12LI^2 = \tfrac12(2.0)(0.090) = 0.090$ J.
- id: phys-q-4003
  lesson: phys-inductance
  topic: Inductance
  stem: 'Immediately after the switch is closed in a series circuit of a battery, a resistor and an inductor, the current is'
  choices: ['$\mathcal{E}/R$', 'zero', 'infinite', '$\mathcal{E}/(2R)$']
  answer: 1
  explanation: |-
    An inductor prevents sudden changes in current, so the current starts at zero and rises toward $\mathcal{E}/R$ with time constant $L/R$.
- id: phys-q-4004
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'An LC circuit has $L = 10$ mH and $C = 1.0$ μF. What is its oscillation frequency?'
  choices: ['10 kHz', '159 Hz', '1.6 kHz', '1.0 kHz']
  answer: 2
  explanation: |-
    $f = \dfrac{1}{2\pi\sqrt{LC}} = \dfrac{1}{2\pi\sqrt{(0.010)(1.0\times10^{-6})}} = \dfrac{1}{2\pi(10^{-4})} = 1.59$ kHz. $1/\sqrt{LC} = 10^4$ is $\omega$ in rad/s.
- id: phys-q-4005
  lesson: phys-inductance
  module_quiz: true
  topic: AC circuits
  stem: 'Household AC is rated 120 V (rms). What is the peak voltage?'
  choices: ['85 V', '120 V', '240 V', '170 V']
  answer: 3
  explanation: |-
    $V_0 = \sqrt2V_{\text{rms}} = 1.414(120) = 170$ V. Dividing instead of multiplying gives 85 V.
- id: phys-q-4006
  lesson: phys-inductance
  topic: AC circuits
  stem: 'As the frequency of an AC source increases, the reactance of a capacitor'
  choices: ['decreases', 'increases', 'stays the same', 'becomes negative']
  answer: 0
  explanation: |-
    $X_C = 1/(\omega C)$ falls as $\omega$ rises: capacitors pass high frequencies and block low ones (and block DC entirely). Inductors do the reverse, $X_L = \omega L$.
- id: phys-q-4007
  lesson: phys-inductance
  topic: AC circuits
  stem: 'In a series RLC circuit driven at its resonant frequency,'
  choices: ['$X_L = X_C$ and the impedance equals $R$', 'the current is zero', '$X_L = 0$', 'the impedance is maximum']
  answer: 0
  explanation: |-
    At $\omega_0 = 1/\sqrt{LC}$, $X_L = X_C$, so $Z = \sqrt{R^2 + 0} = R$, its minimum, and the current is largest.
- id: phys-q-4008
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'An inductor in a circuit opposes'
  choices: ['any current through it', 'changes in the current through it', 'only alternating voltages', 'the battery''s emf at all times']
  answer: 1
  explanation: |-
    $\mathcal{E}_L = -L\,\Delta I/\Delta t$: with a steady current, $\Delta I = 0$ and there's no induced emf, so the inductor acts like a plain wire. It's a kind of electrical inertia.
- id: phys-q-4009
  lesson: phys-inductance
  topic: Inductance
  stem: 'In the mechanical analogy for an LC circuit (mass on a spring), the inductance $L$ corresponds to'
  choices: ['the spring constant', 'the position', 'the mass', 'the friction']
  answer: 2
  explanation: |-
    Compare the energies. The inductor stores $\tfrac12LI^2$, like kinetic energy $\tfrac12mv^2$ with current playing velocity, so $L \leftrightarrow m$. The capacitor stores $\dfrac{q^2}{2C}$, like spring energy $\tfrac12kx^2$ with charge playing position, so $1/C \leftrightarrow k$. Like a mass resisting changes in velocity, an inductor resists changes in current.
- id: phys-q-4010
  lesson: phys-inductance
  topic: AC circuits
  stem: 'What is the reactance of a 10 μF capacitor at 60 Hz?'
  choices: ['$3.8\times10^{-3}$ Ω', '1670 Ω', '0.0060 Ω', '265 Ω']
  answer: 3
  explanation: |-
    $X_C = \dfrac{1}{2\pi fC} = \dfrac{1}{2\pi(60)(10\times10^{-6})} = 265$ Ω. Forgetting the $2\pi$ gives 1670 Ω.
- id: phys-q-4011
  lesson: phys-inductance
  topic: Inductance
  stem: 'An inductor and resistor with time constant $L/R = 20$ ms are connected to a battery at $t = 0$. About what fraction of the final current flows at $t = 20$ ms?'
  choices: ['37%', '50%', '63%', '100%']
  answer: 2
  explanation: |-
    $I = I_{\text{final}}(1 - e^{-t/\tau})$ with $t = \tau$: $1 - e^{-1} = 0.63$. 37% is $e^{-1}$, the fraction that would remain in a decay; 50% would be a half-life, which is $0.69\tau$, not $\tau$.
- id: phys-q-4012
  lesson: phys-inductance
  topic: AC circuits
  stem: 'A series circuit has $R = 40\ \Omega$, $X_L = 50\ \Omega$ and $X_C = 20\ \Omega$, driven by 100 V (rms). What is the rms current?'
  choices: ['2.0 A', '0.91 A', '2.5 A', '1.2 A']
  answer: 0
  explanation: |-
    $Z = \sqrt{R^2 + (X_L - X_C)^2} = \sqrt{40^2 + 30^2} = 50\ \Omega$, so $I_{\text{rms}} = 100/50 = 2.0$ A. Adding all three as resistors ($110\ \Omega$) gives 0.91 A; ignoring the reactances gives 2.5 A; adding $X_L$ and $X_C$ inside the root instead of subtracting ($\sqrt{40^2 + 70^2} = 81\ \Omega$) gives 1.2 A.
