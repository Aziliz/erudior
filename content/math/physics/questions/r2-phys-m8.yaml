# Round 2, module phys-m8 (Electrostatics): core lessons 30-34 and honors lessons 34h1-34h3.

# ---------- Lesson 30: Coulomb's law ----------
- id: phys-m8-r2-q01
  lesson: phys-coulomb
  topic: Electric charge
  type: label
  stem: 'A negatively charged rod is held near a neutral metal sphere. Name the numbered parts.'
  image: {src: images/phys-m8-polarization-blank.svg, alt: 'A charged rod at the left and a metal sphere at the right, with plus signs on the sphere''s left side, minus signs on its right side, and an arrow below the sphere pointing toward the rod. Four parts are numbered.'}
  labels:
    - {x: 18.9, y: 48.5, text: Charged rod}
    - {x: 56.1, y: 48.5, text: Positive near side}
    - {x: 77.3, y: 48.5, text: Negative far side}
    - {x: 59.8, y: 87.9, text: Net force on the sphere}
  distractors: [Ground connection, Excess protons]
  explanation: |-
    The rod's negative charge pushes the sphere's free electrons to the far side, leaving the near side positive. The sphere stays neutral overall, but its positive side is closer to the rod, so the attraction is stronger than the repulsion and the net force points toward the rod. No protons move; only electrons do.
- id: phys-m8-r2-q02
  lesson: phys-coulomb
  module_quiz: true
  topic: Electric charge
  type: order
  stem: 'Put the steps for charging a metal sphere positively by induction, using a negatively charged rod, in order.'
  items:
    - Bring the negative rod near the neutral sphere
    - Connect the sphere to ground while the rod is near
    - Disconnect the ground
    - Take the rod away
  explanation: |-
    With the rod near, the sphere's electrons are pushed away, and grounding lets them escape to Earth. The ground must be removed before the rod: if the rod went first, electrons would flow back up from Earth and the sphere would end up neutral. Only after both steps is the sphere left positive.
- id: phys-m8-r2-q03
  lesson: phys-coulomb
  topic: Coulomb's law
  type: text
  stem: 'Two point charges exert a force $F$ on each other. One charge is tripled and the distance between them is doubled. The new force is ___ times $F$. Give only the number.'
  accept: ['0.75', '3/4']
  explanation: |-
    $F \propto \dfrac{q_1q_2}{r^2}$: tripling one charge multiplies $F$ by 3 and doubling $r$ divides it by $2^2 = 4$, so the factor is $3/4 = 0.75$.
- id: phys-m8-r2-q04
  lesson: phys-coulomb
  topic: Electric charge
  stem: 'Which statements about electric charge are true? Select all that apply.'
  choices:
    - 'Rubbing a glass rod with silk creates new positive charge in the glass'
    - 'The total charge of an isolated system never changes'
    - 'A neutral object can be attracted by a charged rod'
    - 'Every free charge is a whole-number multiple of $e$'
    - 'When objects are rubbed together, protons move from one to the other'
  answer: [1, 2, 3]
  explanation: |-
    Charge is conserved and quantized ($q = ne$), and a neutral object is attracted by polarization. Rubbing doesn't create charge: it moves electrons from one object to the other (the glass loses electrons to the silk). Protons are bound in nuclei and don't move in ordinary charging.
- id: phys-m8-r2-q05
  lesson: phys-coulomb
  module_quiz: true
  topic: Coulomb's law
  type: match
  stem: 'Two point charges exert a force $F$ on each other. Match each change to the new force.'
  pairs:
    - ['Double one charge', '2 times as large']
    - ['Double the distance', 'One quarter as large']
    - ['Halve the distance', '4 times as large']
    - ['Double both charges and the distance', 'Unchanged']
  distractors: ['Half as large']
  explanation: |-
    $F \propto q_1q_2/r^2$. One charge doubled: $\times2$. Distance doubled: $\times\tfrac14$. Distance halved: $\times4$. Both charges and the distance doubled: $\dfrac{2\times2}{2^2} = 1$, unchanged. "Half as large" would need, for example, one charge halved.

# ---------- Lesson 31: The electric field ----------
- id: phys-m8-r2-q06
  lesson: phys-efield
  topic: Electric field
  type: label
  stem: 'An electron is fired between two charged plates and is deflected downward. Name the numbered parts. (The dashed arrows show the direction of the field.)'
  image: {src: images/phys-m8-crt-blank.svg, alt: 'An electron gun at the left fires a beam between two horizontal plates; dashed arrows between the plates point up; the beam curves downward and continues to a screen at the right. Five parts are numbered.'}
  labels:
    - {x: 12.1, y: 51.4, text: Electron gun}
    - {x: 47.1, y: 29.4, text: Negative plate}
    - {x: 47.1, y: 76.9, text: Positive plate}
    - {x: 44.3, y: 42.9, text: Electric field}
    - {x: 92.4, y: 34.3, text: Screen}
  distractors: [Magnet, Gaussian surface]
  explanation: |-
    The field points from the positive plate to the negative plate, so with the arrows pointing up, the bottom plate is positive and the top negative. That agrees with the beam: electrons are pushed opposite to the field, down toward the positive plate. The gun produces the beam and the screen shows where it lands.
- id: phys-m8-r2-q07
  lesson: phys-efield
  topic: Electric field
  type: order
  stem: 'Put the steps for finding the net electric field at a point P due to several point charges in order.'
  items:
    - Find the distance from each charge to P
    - Find each field's magnitude and direction at P
    - Split each field into x and y components
    - Add the x components and the y components separately
    - Combine the totals into the net field's magnitude and direction
  explanation: |-
    Each field's size $k|q|/r^2$ needs the distance first. Fields are vectors, so they're added by components, and only at the end are the component totals turned back into a magnitude and direction. Adding magnitudes directly is the classic mistake this order avoids.
- id: phys-m8-r2-q08
  lesson: phys-efield
  topic: Electric field
  type: text
  stem: 'What is the magnitude of the electric field 0.30 m from a $+6.0$ nC point charge? Give only the number, in N/C, to 2 significant figures. ($k = 8.99\times10^9$ N·m²/C²)'
  accept: ['600', '6.0e2', '6e2']
  explanation: |-
    $E = k\dfrac{|q|}{r^2} = (8.99\times10^9)\dfrac{6.0\times10^{-9}}{(0.30)^2} = 599$ N/C, or 600 N/C to 2 significant figures, pointing away from the charge. (Forgetting to square $r$ gives 180 N/C.)
- id: phys-m8-r2-q09
  lesson: phys-efield
  module_quiz: true
  topic: Electric field
  stem: 'A metal object is in electrostatic equilibrium. Which statements are true? Select all that apply.'
  choices:
    - 'Any excess charge sits on its outer surface'
    - 'The field inside the metal equals the field just outside it'
    - 'Just outside the surface, the field is perpendicular to the surface'
    - 'Excess charge spreads evenly over the surface whatever its shape'
    - 'The electric field inside the metal is zero'
  answer: [0, 2, 4]
  explanation: |-
    If there were a field inside the metal, free charges would still be moving, so in equilibrium it's zero and excess charge ends up on the surface. A field component along the surface would also push charges, so the field just outside is perpendicular. The inside field (zero) is not the same as the outside field, and charge is not spread evenly: it concentrates where the surface curves most sharply.
- id: phys-m8-r2-q10
  lesson: phys-efield
  module_quiz: true
  topic: Electric field
  stem: 'A proton moves horizontally into the space between two horizontal plates, where the electric field points straight down. While it is between the plates, the proton'
  choices: ['curves upward along a parabola', 'moves straight, because the field is perpendicular to its velocity', 'curves downward along a parabola', 'slows down along its original direction']
  answer: 2
  explanation: |-
    A positive charge is pushed along the field, so the proton feels a constant downward force $eE$ and has constant downward acceleration while its horizontal velocity stays the same: a parabola curving down, like a projectile. An electron in the same field would curve upward. A force perpendicular to the velocity still changes the direction of motion, and nothing acts along the original direction to slow it.

# ---------- Lesson 32: Gauss's law ----------
- id: phys-m8-r2-q11
  lesson: phys-gauss
  topic: Gauss's law
  type: label
  stem: 'Each charge distribution is shown with a dashed Gaussian surface. Name the numbered parts.'
  image: {src: images/phys-m8-gauss-surfaces-blank.svg, alt: 'Left: a small charged ball inside a larger dashed circle. Middle: a long charged line through a dashed cylinder. Right: a flat charged sheet pierced by a short dashed cylinder. Six parts are numbered.'}
  labels:
    - {x: 16.7, y: 17.2, text: Gaussian sphere}
    - {x: 16.7, y: 46.9, text: Charged ball}
    - {x: 57.7, y: 46.9, text: Gaussian cylinder}
    - {x: 50.0, y: 78.1, text: Line of charge}
    - {x: 91.7, y: 48.4, text: Pillbox}
    - {x: 83.3, y: 70.3, text: Charged sheet}
  distractors: [Gaussian cube]
  explanation: |-
    The Gaussian surface copies the symmetry of the charge: a concentric sphere around a spherical charge, a coaxial cylinder around a long line, and a short cylinder (pillbox) poking through a flat sheet. On each, the field is the same size everywhere it crosses the surface and perpendicular to it, so the flux is just $E$ times an area.
- id: phys-m8-r2-q12
  lesson: phys-gauss
  module_quiz: true
  topic: Gauss's law
  type: match
  stem: 'Match each location to how the electric field there depends on the distance $r$ (from the center, the line, or the sheet).'
  pairs:
    - ['Outside a uniformly charged ball', 'Falls off as 1/r²']
    - ['Inside a thin charged spherical shell', 'Zero']
    - ['Near a long straight line of charge', 'Falls off as 1/r']
    - ['Near a large flat charged sheet', 'Same at every distance']
    - ['Inside a uniformly charged solid ball', 'Grows in proportion to r']
  explanation: |-
    Outside a sphere: $E = kQ/r^2$. Inside a thin shell a Gaussian sphere encloses no charge: $E = 0$. Line: $E = 2k\lambda/r$. Sheet: $E = \sigma/(2\varepsilon_0)$, independent of distance. Inside a uniform ball the enclosed charge grows as $r^3$, giving $E = kQr/R^3$.
- id: phys-m8-r2-q13
  lesson: phys-gauss
  topic: Gauss's law
  type: text
  stem: 'A closed surface encloses a $+5.0$ nC charge and a $-2.0$ nC charge, and a $+4.0$ nC charge sits outside it. What is the net electric flux through the surface? Give only the number, in N·m²/C, to 3 significant figures. ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  accept: ['339', '3.39e2']
  explanation: |-
    Only enclosed charge counts: $Q_{\text{enc}} = 5.0 - 2.0 = 3.0$ nC, so $\Phi_E = \dfrac{3.0\times10^{-9}}{8.85\times10^{-12}} = 339$ N·m²/C. The outside charge's field lines enter and leave, adding zero net flux. (Including it would give 791.)
- id: phys-m8-r2-q14
  lesson: phys-gauss
  topic: Gauss's law
  stem: 'Which statements about Gauss''s law are true? Select all that apply.'
  choices:
    - 'If the enclosed charge is zero, the field is zero everywhere on the surface'
    - 'It holds for every closed surface, whatever its shape'
    - 'The flux through a closed surface depends on how big the surface is'
    - 'Charges outside the surface add no net flux through it'
    - 'It gives the field directly only for highly symmetric charge distributions'
  answer: [1, 3, 4]
  explanation: |-
    Gauss's law is always true, and outside charges contribute zero net flux. It finds $E$ easily only when symmetry makes $E$ constant on a well-chosen surface. Zero net flux doesn't mean zero field: an outside charge makes a field on the surface whose inward and outward flux cancel. For a fixed enclosed charge, the flux is the same for any surface size.
- id: phys-m8-r2-q15
  lesson: phys-gauss
  module_quiz: true
  topic: Gauss's law
  type: order
  stem: 'Put the steps for finding a field with Gauss''s law in order.'
  items:
    - Identify the symmetry of the charge distribution
    - Choose a Gaussian surface on which E is constant and perpendicular to the surface
    - Find the charge enclosed by that surface
    - Set E times the surface's area equal to the enclosed charge divided by ε0
    - Solve for E
  explanation: |-
    The symmetry decides the surface (sphere, cylinder or pillbox). The enclosed charge depends on which surface you chose, and only then can you write $E\cdot A = Q_{\text{enc}}/\varepsilon_0$ and solve it for $E$.

# ---------- Lesson 33: Electric potential ----------
- id: phys-m8-r2-q16
  lesson: phys-potential
  topic: Electric potential
  type: label
  stem: 'The picture shows two charged parallel plates. Name the numbered parts.'
  image: {src: images/phys-m8-plates-equipotentials-blank.svg, alt: 'Two vertical parallel plates with solid arrows running from the left plate to the right plate and three evenly spaced dashed vertical lines between them. Four parts are numbered.'}
  labels:
    - {x: 16.7, y: 50.0, text: Higher-potential plate}
    - {x: 83.3, y: 50.0, text: Lower-potential plate}
    - {x: 42.2, y: 41.7, text: Electric field line}
    - {x: 50.0, y: 66.7, text: Equipotential}
  distractors: [Gaussian surface, Dielectric]
  explanation: |-
    The field points from high potential to low, so the plate the arrows leave is at the higher potential. The dashed lines are equipotentials: they're perpendicular to the field lines, and evenly spaced because the field between the plates is uniform.
- id: phys-m8-r2-q17
  lesson: phys-potential
  module_quiz: true
  topic: Electric potential
  type: match
  stem: 'Match each quantity to its SI unit.'
  pairs:
    - ['Electric field', 'N/C (same as V/m)']
    - ['Electric potential', 'Volts (J/C)']
    - ['Electric potential energy', 'Joules']
    - ['Electric charge', 'Coulombs']
  distractors: ['Farads']
  explanation: |-
    Field is force per charge (N/C, which equals V/m). Potential is energy per charge (J/C = V). Potential energy is an energy (J). Charge is in coulombs. Farads measure capacitance.
- id: phys-m8-r2-q18
  lesson: phys-potential
  topic: Electric potential
  type: text
  stem: 'An electron starts from rest and is accelerated through a potential difference of 250 V. Its kinetic energy is ___ eV. Give only the number.'
  accept: ['250']
  explanation: |-
    The energy gained is $|q\Delta V| = e(250\text{ V}) = 250$ eV, which is $4.0\times10^{-17}$ J. That's the point of the electron volt: the answer in eV is the voltage, for a charge of $e$.
- id: phys-m8-r2-q19
  lesson: phys-potential
  topic: Electric potential
  type: order
  stem: 'Points are at different distances from a single negative point charge. Put them in order from highest potential to lowest (zero at infinity).'
  items:
    - 10 cm from the charge
    - 5 cm from the charge
    - 2 cm from the charge
    - 1 cm from the charge
  explanation: |-
    $V = kq/r$ with $q$ negative, so $V$ is negative and its size grows as $r$ shrinks. The farthest point has the potential closest to zero, which is the highest; the nearest point is the most negative. (For a positive charge the order would reverse.)
- id: phys-m8-r2-q20
  lesson: phys-potential
  module_quiz: true
  topic: Electric potential
  stem: 'Which statements are true? Select all that apply.'
  choices:
    - 'Wherever the potential is zero, the electric field must also be zero'
    - 'Electric field lines cross equipotential surfaces at right angles'
    - 'The potentials due to several charges add as vectors'
    - 'A positive charge released from rest moves toward lower potential'
    - 'The field does no work on a charge moved along an equipotential'
  answer: [1, 3, 4]
  explanation: |-
    Field lines are perpendicular to equipotentials, so moving along one involves no work, and positive charges go "downhill" to lower $V$. Zero potential doesn't mean zero field: at the midpoint of a dipole $V = 0$ but the field is strong. Potential is a scalar, so contributions add as plain numbers, not vectors.

# ---------- Lesson 34: Capacitance ----------
- id: phys-m8-r2-q21
  lesson: phys-capacitance
  topic: Capacitance
  type: label
  stem: 'The picture shows a parallel-plate capacitor filled with a dielectric. In each molecule, the negative end faces the positive plate. Name the numbered parts.'
  image: {src: images/phys-m8-capacitor-dielectric-blank.svg, alt: 'Two horizontal plates with a shaded slab between them containing oval molecules, each with a minus sign at its top end and a plus sign at its bottom end, and a double arrow at the right spanning the gap. Five parts are numbered.'}
  labels:
    - {x: 50.0, y: 17.1, text: Positive plate}
    - {x: 50.0, y: 81.3, text: Negative plate}
    - {x: 30.0, y: 40.8, text: Dielectric}
    - {x: 55.0, y: 49.2, text: Polarized molecule}
    - {x: 90.0, y: 50.0, text: Plate separation}
  distractors: [Battery, Gaussian surface]
  explanation: |-
    The molecules' negative ends point up, so the top plate is the positive one. The insulating slab is the dielectric; its molecules polarize, and their bound charges partly cancel the field inside, which raises $C$ by the factor $\kappa$. The double arrow marks the gap $d$ in $C = \kappa\varepsilon_0A/d$.
- id: phys-m8-r2-q22
  lesson: phys-capacitance
  topic: Capacitance
  type: text
  stem: 'A 2.0 μF capacitor and an 8.0 μF capacitor are connected in series. Their equivalent capacitance is ___ μF. Give only the number.'
  accept: ['1.6', '8/5']
  explanation: |-
    $\dfrac1{C_{\text{eq}}} = \dfrac1{2.0} + \dfrac1{8.0} = \dfrac{5}{8.0}$, so $C_{\text{eq}} = 1.6$ μF, smaller than the smaller capacitor. (Adding them, 10 μF, is the parallel rule.)
- id: phys-m8-r2-q23
  lesson: phys-capacitance
  module_quiz: true
  topic: Capacitance
  type: match
  stem: 'A charged air capacitor has a dielectric slid between its plates. Match each quantity to what happens to it.'
  pairs:
    - ['Capacitance (in either case)', 'Increases']
    - ['Voltage, battery still connected', 'Stays the same']
    - ['Charge, battery disconnected', 'Stays the same']
    - ['Voltage, battery disconnected', 'Decreases']
  distractors: ['Becomes zero']
  explanation: |-
    The dielectric raises $C$ by $\kappa$ either way. A connected battery holds $V$ fixed (so $Q = CV$ rises). A disconnected capacitor keeps its charge, so $V = Q/C$ falls by the factor $\kappa$.
- id: phys-m8-r2-q24
  lesson: phys-capacitance
  topic: Capacitance
  stem: 'Several capacitors are connected in series across a battery. Which statements are true? Select all that apply.'
  choices:
    - 'Each capacitor has the battery''s full voltage across it'
    - 'Each capacitor carries the same charge'
    - 'The equivalent capacitance is the sum of the capacitances'
    - 'The capacitors'' voltages add up to the battery''s voltage'
    - 'The equivalent capacitance is less than the smallest capacitance'
  answer: [1, 3, 4]
  explanation: |-
    In series there's one path, so every capacitor carries the same $Q$, the voltages add to the battery's, and $1/C_{\text{eq}} = \sum 1/C_i$ makes $C_{\text{eq}}$ smaller than the smallest. Full battery voltage on each and adding capacitances are the parallel rules.
- id: phys-m8-r2-q25
  lesson: phys-capacitance
  module_quiz: true
  topic: Capacitance
  stem: 'In the parallel circuit shown on the right, which capacitor stores more energy?'
  image: {src: images/phys-m8-cap-combos.svg, alt: 'Two circuits: on the left a 12 V battery with 3.0 μF and 6.0 μF capacitors in series; on the right the same battery with the two capacitors in parallel.'}
  choices: ['The 3.0 μF capacitor, twice as much', 'Both store the same energy', 'The 6.0 μF capacitor, four times as much', 'The 6.0 μF capacitor, twice as much']
  answer: 3
  explanation: |-
    In parallel both have the full 12 V, so $U = \tfrac12CV^2$ is proportional to $C$: $\tfrac12(6.0\times10^{-6})(12)^2 = 432$ μJ versus 216 μJ, twice as much for the 6.0 μF capacitor. (In the series circuit it's the reverse: same charge, so $U = Q^2/(2C)$ is larger for the 3.0 μF one.) "Four times" would come from wrongly squaring the capacitance ratio.

# ---------- Honors: Electric dipoles ----------
- id: phys-m8-r2-h01
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'The dipole moment $\vec p$ of a pair of charges $+q$ and $-q$ points'
  choices: ['from the negative charge to the positive charge', 'from the positive charge to the negative charge', 'perpendicular to the line joining the charges', 'along the external field, whatever the dipole''s orientation']
  answer: 0
  explanation: |-
    By convention $\vec p = q\vec d$ with $\vec d$ from $-$ to $+$. It's tied to the dipole itself, not to any outside field; note it points opposite to the field between the two charges.
- id: phys-m8-r2-h02
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Charges of $\pm3.0$ nC sit 2.0 mm apart in a uniform field of $4.0\times10^4$ N/C, with the dipole moment at $60^\circ$ to the field. What is the magnitude of the torque on the dipole?'
  choices: ['$1.2\times10^{-7}$ N·m', '$2.1\times10^{-7}$ N·m', '$2.4\times10^{-7}$ N·m', '$4.2\times10^{-7}$ N·m']
  answer: 1
  explanation: |-
    $p = qd = (3.0\times10^{-9})(2.0\times10^{-3}) = 6.0\times10^{-12}$ C·m, and $\tau = pE\sin60^\circ = (6.0\times10^{-12})(4.0\times10^4)(0.866) = 2.1\times10^{-7}$ N·m. Using $\cos60^\circ$ gives $1.2\times10^{-7}$; leaving out the angle gives $pE = 2.4\times10^{-7}$; doubling for "two forces" counts the couple twice ($4.2\times10^{-7}$).
- id: phys-m8-r2-h03
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'A dipole sits in a uniform electric field at some angle to it. The net force and the net torque on it are'
  choices: ['both zero', 'a nonzero force and zero torque', 'zero force and a nonzero torque', 'both nonzero']
  answer: 2
  explanation: |-
    The forces $+q\vec E$ and $-q\vec E$ are equal and opposite, so the net force is zero. They act at different points, though, forming a couple with torque $pE\sin\theta$ (zero only when $\vec p$ is parallel or antiparallel to $\vec E$). A net force appears only in a nonuniform field.
- id: phys-m8-r2-h04
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'A dipole with $p = 5.0\times10^{-12}$ C·m is aligned with a uniform field of $2.0\times10^4$ N/C. How much work does it take to turn it to point exactly against the field?'
  choices: ['$1.0\times10^{-7}$ J', '0 J', '$4.0\times10^{-7}$ J', '$2.0\times10^{-7}$ J']
  answer: 3
  explanation: |-
    $U = -pE\cos\theta$ goes from $-pE$ at $0^\circ$ to $+pE$ at $180^\circ$, so $W = 2pE = 2(5.0\times10^{-12})(2.0\times10^4) = 2.0\times10^{-7}$ J. $pE$ alone is the work to turn it only to $90^\circ$. It's not zero: the field resists the turn the whole way.
- id: phys-m8-r2-h05
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Far from a dipole, you double your distance from it (staying on its axis). The field becomes'
  choices: ['one-eighth as strong', 'one-quarter as strong', 'half as strong', 'one-sixteenth as strong']
  answer: 0
  explanation: |-
    Far away the two charges' fields nearly cancel, leaving $E \approx 2kp/r^3$. Doubling $r$ divides $E$ by $2^3 = 8$. One-quarter would be a single point charge's $1/r^2$ behavior.
- id: phys-m8-r2-h06
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Even in a field of $10^6$ N/C, water molecules at room temperature are only very slightly lined up with the field. Why?'
  choices: ['The field cannot exert a torque on a molecule with zero net charge', 'Their thermal energy is hundreds of times larger than the energy $2pE$ needed to flip them', 'Water molecules have no permanent dipole moment', 'The torque is exactly balanced by the net electric force']
  answer: 1
  explanation: |-
    For water, $2pE \approx 1.2\times10^{-23}$ J in that field, while $k_BT \approx 4.1\times10^{-21}$ J at 300 K. Collisions keep scrambling the orientations, and the field only slightly biases them. A neutral dipole does feel a torque, water is strongly polar ($p \approx 6.2\times10^{-30}$ C·m), and in a uniform field there's no net force at all.
- id: phys-m8-r2-h07
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Carbon dioxide molecules (O=C=O) have polar bonds, but CO₂ has no permanent dipole moment. Why?'
  choices: ['Carbon and oxygen pull on electrons equally', 'The molecule carries a net charge that hides its dipole', 'The molecule is straight, so its two bond dipoles point in opposite directions and cancel', 'Dipole moments only exist in liquids']
  answer: 2
  explanation: |-
    Each C=O bond is polar, but in a straight molecule the two bond dipoles are equal and opposite, adding to zero. Water is bent, so its two O–H contributions don't cancel. CO₂ is neutral, and dipole moments belong to molecules in any phase.
- id: phys-m8-r2-h08
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Why is a scrap of neutral paper attracted to a comb whether the comb is charged positively or negatively?'
  choices: ['The comb transfers charge of the opposite sign to the paper through the air', 'Paper always carries a small negative charge', 'Gravity between the comb and the paper becomes stronger', 'The comb''s field induces a dipole lined up with it, and the near end, in the stronger field, is pulled harder']
  answer: 3
  explanation: |-
    The induced dipole always lines up with the comb's field, so its near end has the opposite sign to the comb. The field is stronger nearer the comb, so the near end's attraction beats the far end's repulsion, for either sign of comb. No charge needs to jump across.
- id: phys-m8-r2-h09
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Which statement about how a microwave oven heats food is accurate?'
  choices: ['Water molecules are pushed toward the stronger field and rub against the walls', 'The oscillating field keeps turning polar water molecules, and collisions turn that motion into heat', 'The microwaves ionize water molecules, releasing energy', 'It works only because 2.45 GHz is a sharp resonance frequency of water']
  answer: 1
  explanation: |-
    The field reverses billions of times a second; water dipoles keep trying to follow it, and collisions with neighbors convert the motion into heat. Water absorbs over a broad range of microwave frequencies, so 2.45 GHz is not a special resonance, and microwave photons have far too little energy to ionize anything.
- id: phys-m8-r2-h10
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  type: text
  stem: 'Charges of $\pm4.0$ nC are 5.0 mm apart. Their dipole moment is ___ $\times10^{-11}$ C·m. Give only the number.'
  accept: ['2', '2.0']
  explanation: |-
    $p = qd = (4.0\times10^{-9})(5.0\times10^{-3}) = 2.0\times10^{-11}$ C·m. (Using 8.0 nC, the difference between the charges, would double it; $q$ is the size of one charge.)
- id: phys-m8-r2-h11
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  type: match
  stem: 'A dipole is in a uniform field. Match each orientation of $\vec p$ to its description.'
  pairs:
    - ['p points along the field', 'Lowest energy, stable']
    - ['p points against the field', 'Highest energy, unstable']
    - ['p perpendicular to the field', 'Largest torque']
  distractors: ['Largest net force']
  explanation: |-
    $U = -pE\cos\theta$ is $-pE$ when aligned (stable minimum) and $+pE$ when anti-aligned (unstable maximum). $\tau = pE\sin\theta$ is largest at $90^\circ$. In a uniform field the net force is zero at every orientation.
- id: phys-m8-r2-h12
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  type: order
  stem: 'A capacitor keeps the same charge on its plates while a dielectric is inserted. Put the chain of causes in order.'
  items:
    - The plates' field acts on the dielectric's molecules
    - The molecules' dipoles line up partly with the field
    - Bound charge appears at the two faces of the slab
    - The bound charge partly cancels the plates' field inside
    - The voltage drops, so the capacitance rises
  explanation: |-
    The plates' field polarizes the molecules (permanent dipoles turn, or dipoles are induced). Inside the slab the neighboring ends cancel, but thin layers of bound charge are left at the faces, opposite in sign to the nearby plates. That reduces the field to $E_0/\kappa$, so $V = Ed$ drops and $C = Q/V$ goes up.
- id: phys-m8-r2-h13
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  stem: 'Which statements about electric dipoles are true? Select all that apply.'
  choices:
    - 'In a uniform field the net force on a dipole is zero'
    - 'The torque on a dipole is greatest when $\vec p$ is parallel to $\vec E$'
    - 'Far from a dipole, its field falls off as $1/r^3$'
    - 'An aligned dipole in a nonuniform field is pulled toward the stronger field'
    - 'An aligned dipole has potential energy $U = +pE$'
  answer: [0, 2, 3]
  explanation: |-
    Uniform field: equal and opposite forces, zero net force. The far field goes as $1/r^3$. In a nonuniform field the end in the stronger field wins, pulling an aligned dipole toward stronger field. The torque $pE\sin\theta$ is zero when $\vec p \parallel \vec E$, and the aligned energy is $-pE$, the minimum.
- id: phys-m8-r2-h14
  lesson: phys-m8-h-dipoles
  topic: Electric dipoles
  type: label
  stem: 'A dipole is in a uniform field pointing to the right. Name the numbered parts.'
  image: {src: images/phys-m8-dipole-torque-blank.svg, alt: 'Horizontal field arrows pointing right at the top and bottom. A tilted rod has a plus charge at its upper right end and a minus charge at its lower left end; an arrow from the plus charge points right, an arrow from the minus charge points left, and a blue arrow along the rod points toward the plus charge. Five parts are numbered.'}
  labels:
    - {x: 64.1, y: 26.5, text: Positive charge}
    - {x: 35.9, y: 76.2, text: Negative charge}
    - {x: 75.0, y: 34.3, text: Force on the positive charge}
    - {x: 25.0, y: 68.4, text: Force on the negative charge}
    - {x: 53.2, y: 47.5, text: Dipole moment}
  distractors: [Net force on the dipole]
  explanation: |-
    The positive charge is pushed along the field (right) and the negative charge against it (left). The dipole moment points along the rod from $-$ to $+$. The two forces are equal and opposite, so there is no net force, only a torque turning $\vec p$ toward the field.

# ---------- Honors: The oil-drop experiment ----------
- id: phys-m8-r2-h15
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'An oil drop of mass $4.9\times10^{-15}$ kg hangs motionless between horizontal plates 1.0 cm apart when the voltage is 1000 V. What is the size of its charge? ($g = 9.8$ m/s²)'
  choices: ['$4.9\times10^{-20}$ C', '$1.6\times10^{-19}$ C', '$4.8\times10^{-19}$ C', '$4.8\times10^{-17}$ C']
  answer: 2
  explanation: |-
    $q = \dfrac{mgd}{V} = \dfrac{(4.9\times10^{-15})(9.8)(0.010)}{1000} = 4.8\times10^{-19}$ C, three electron charges. Using $d = 1.0$ (cm not converted) gives $4.8\times10^{-17}$; leaving out $g$ gives $4.9\times10^{-20}$, less than $e$, which is impossible for a free charge.
- id: phys-m8-r2-h16
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'To hold a negatively charged oil drop still between horizontal plates, the electric field must point'
  choices: ['upward, so the top plate is negative', 'downward, so the top plate is positive', 'horizontally, across the plates', 'upward, so the top plate is positive']
  answer: 1
  explanation: |-
    The electric force must be upward to balance gravity. A negative charge is pushed opposite to $\vec E$, so $\vec E$ must point down, which means the top plate is positive (fields point from $+$ to $-$). An upward field would push the drop down along with gravity.
- id: phys-m8-r2-h17
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Why does the experimenter time each drop falling with the field switched off?'
  choices: ['To measure the drop''s charge directly', 'To let the drop lose its charge', 'To check that the plates are level', 'To find the drop''s radius, and so its mass, from its terminal speed']
  answer: 3
  explanation: |-
    The drops are far too small to weigh. With the field off, drag balances weight at terminal speed: $6\pi\eta rv = \tfrac43\pi r^3\rho g$, which gives $r$ and then $m$. Only with $m$ known does the balance condition give $q$.
- id: phys-m8-r2-h18
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Drop B falls (field off) at 4 times the terminal speed of drop A, made of the same oil. By Stokes''s law, drop B''s radius is'
  choices: ['2 times A''s', '4 times A''s', '16 times A''s', '8 times A''s']
  answer: 0
  explanation: |-
    $r = \sqrt{9\eta v/(2\rho g)}$, so $r \propto \sqrt v$: four times the speed means twice the radius. (Its mass, $\propto r^3$, is 8 times larger.)
- id: phys-m8-r2-h19
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Four drops have charges of 4.8, 8.0, 11.2 and 14.4 (in units of $10^{-19}$ C). What is the best estimate of the elementary charge from these data?'
  choices: ['$0.8\times10^{-19}$ C', '$3.2\times10^{-19}$ C', '$4.8\times10^{-19}$ C', '$1.6\times10^{-19}$ C']
  answer: 3
  explanation: |-
    Differences are all 3.2, and every charge is a whole multiple of 1.6: 3, 5, 7 and 9 units. 3.2 doesn't divide 4.8 evenly, and 4.8 doesn't divide 8.0. A unit of 0.8 also fits but would make every count even (6, 10, 14, 18) with no odd values, an unlikely coincidence; the largest unit that fits all the data is the natural answer.
- id: phys-m8-r2-h20
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Millikan''s 1913 value of $e$ was about 0.6% below the modern value. What was the main cause?'
  choices: ['He used a value for the viscosity of air that was slightly too low', 'His oil evaporated during each measurement', 'He forgot to convert from centimeters to meters', 'Electrons had a different charge in 1913']
  answer: 0
  explanation: |-
    The air viscosity $\eta$ enters through Stokes's law, and the value he used was a little low, which made $e$ come out low. Oil was chosen precisely because it hardly evaporates, and the charge of the electron hasn't changed.
- id: phys-m8-r2-h21
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Why did the experiment use oil drops rather than water drops?'
  choices: ['Oil drops carry larger charges', 'Oil hardly evaporates, so a drop''s mass stays constant while it is watched', 'Oil is a conductor and spreads charge evenly', 'Water drops fall too slowly to time']
  answer: 1
  explanation: |-
    Earlier cloud methods suffered because water droplets evaporated, changing their mass during a measurement. An oil drop keeps its mass, so one drop can be timed for hours.
- id: phys-m8-r2-h22
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'During a run, the charge on a single drop could be changed by'
  choices: ['raising the voltage until the drop split in two', 'cooling the plates', 'ionizing the air with X-rays or a radioactive source, so the drop picked up an ion', 'switching the light source on and off']
  answer: 2
  explanation: |-
    Ionizing radiation makes ions in the air between the plates; a drop occasionally captures one and its charge jumps. Those jumps, always multiples of the same unit, are the most direct evidence that charge is quantized.
- id: phys-m8-r2-h23
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Quarks have charges of $\pm\tfrac13e$ and $\pm\tfrac23e$. Why doesn''t this contradict the rule that free charges are whole multiples of $e$?'
  choices: ['Quarks are always bound inside particles such as protons and neutrons, never found free', 'Quark charges are too small to measure', 'Quarks carry no charge when they are moving', 'The rule only applies to oil drops']
  answer: 0
  explanation: |-
    Quarks are confined: they occur only in combinations, such as a proton (two up quarks, one down: $\tfrac23 + \tfrac23 - \tfrac13 = 1$) whose total is a whole multiple of $e$. Every isolated charge ever measured is a whole multiple of $e$.
- id: phys-m8-r2-h24
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  type: text
  stem: 'A balanced oil drop is found to carry a charge of $6.4\times10^{-19}$ C. It has ___ excess electrons. Give only the number.'
  accept: ['4', 'four']
  explanation: |-
    $n = q/e = (6.4\times10^{-19})/(1.6\times10^{-19}) = 4$.
- id: phys-m8-r2-h25
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  type: order
  stem: 'Put the steps of finding one drop''s charge in order.'
  items:
    - Time the drop falling a known distance with the field off
    - Calculate its terminal speed
    - Use Stokes's law to find its radius
    - Use the radius and the oil's density to find its mass
    - Switch the field on and find the voltage that holds it still
    - Calculate its charge from q = mgd/V
  explanation: |-
    Each quantity depends on the one before: distance and time give $v$; $v$ gives $r$ through $6\pi\eta rv = \tfrac43\pi r^3\rho g$; $r$ gives $m$; and with $m$ known, the balancing voltage gives $q = mgd/V$.
- id: phys-m8-r2-h26
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  type: match
  stem: 'Match each person to their part in the story of measuring $e$.'
  pairs:
    - ['J. J. Thomson', 'Measured the charge-to-mass ratio of cathode-ray particles']
    - ['Harvey Fletcher', 'Graduate student who worked on the oil-drop experiment']
    - ['Gerald Holton', 'Historian who studied Millikan''s notebooks']
    - ['Felix Ehrenhaft', 'Claimed to see charges smaller than e']
  distractors: ['Discovered the neutron']
  explanation: |-
    Thomson measured $e/m$ in 1897; Fletcher worked with Millikan on the oil drops (and later said the use of oil was his idea); Holton's 1978 study of the notebooks started the debate about data selection; Ehrenhaft's "subelectrons" were not confirmed.
- id: phys-m8-r2-h27
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  type: label
  stem: 'Name the numbered parts of the oil-drop apparatus.'
  image: {src: images/phys-m8-millikan-blank.svg, alt: 'A bulb sprayer at the top left with small drops above a horizontal plate that has a gap in its center; a second plate below; a small drop between the plates; a lamp at the left with rays; a tube at the right; and a battery symbol with an arrow through it wired to both plates. Six parts are numbered.'}
  labels:
    - {x: 27.1, y: 16.3, text: Atomizer}
    - {x: 57.9, y: 36.5, text: Top plate}
    - {x: 45.7, y: 57.0, text: Oil drop}
    - {x: 10.0, y: 57.4, text: Light source}
    - {x: 80.0, y: 57.4, text: Microscope}
    - {x: 58.6, y: 90.7, text: Adjustable voltage}
  distractors: [Magnet]
  explanation: |-
    The atomizer sprays drops above the top plate; a few fall through its hole. The light makes a drop visible in the microscope, and the adjustable voltage across the plates sets the field $E = V/d$ used to balance or raise it.
- id: phys-m8-r2-h28
  lesson: phys-m8-h-millikan
  topic: Charge quantization
  stem: 'Which statements about the oil-drop experiment are supported by the historical record described in the lesson? Select all that apply.'
  choices:
    - 'Free charges of $\tfrac13e$ have been isolated in later oil-drop experiments'
    - 'Millikan''s notebooks record drops that he did not include in his 1913 results'
    - 'Since 2019, $e$ has an exact value fixed by the definition of the SI'
    - 'Later analyses found the excluded drops shifted $e$ by about 10%'
    - 'Millikan''s published value was about 0.6% below the modern value'
  answer: [1, 2, 4]
  explanation: |-
    The notebooks do record unused drops (Holton, 1978); $e = 1.602176634\times10^{-19}$ C exactly since 2019; and the 1913 value was about 0.6% low. Analyses such as Franklin's found that including the excluded drops would change $e$ little but enlarge its uncertainty, nothing like 10%. No free fractional charge has been found.

# ---------- Honors: Sharp points, sparks and lightning ----------
- id: phys-m8-r2-h29
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'A conducting sphere of radius 10 cm is in air that breaks down at $3.0\times10^6$ V/m. What is the highest potential it can reach?'
  choices: ['30 kV', '$3.0\times10^7$ V', '300 kV', '600 kV']
  answer: 2
  explanation: |-
    The surface field is $V/R$, so $V_{\max} = E_{\max}R = (3.0\times10^6)(0.10) = 3.0\times10^5$ V = 300 kV. Using the 20 cm diameter gives 600 kV; dividing instead of multiplying gives $3.0\times10^7$ V; using 0.01 m gives 30 kV.
- id: phys-m8-r2-h30
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'A large and a small conducting sphere, far apart, are joined by a wire and charged. Which statement is correct?'
  choices: ['The small sphere has more charge and a stronger surface field', 'The large sphere has more charge, but the small sphere has the stronger surface field', 'Both have the same charge and the same surface field', 'The large sphere has more charge and the stronger surface field']
  answer: 1
  explanation: |-
    Connected conductors share one potential: $kQ_1/R_1 = kQ_2/R_2$, so $Q \propto R$ and the large sphere holds more. The surface field is $E = V/R$, so the smaller sphere's field is larger, by the factor $R_1/R_2$.
- id: phys-m8-r2-h31
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'Spheres of radius 12 cm and 3.0 cm, far apart, are joined by a wire. What is the ratio of the large sphere''s charge to the small sphere''s?'
  choices: ['1', '16', '1/4', '4']
  answer: 3
  explanation: |-
    Equal potentials give $Q_1/Q_2 = R_1/R_2 = 12/3.0 = 4$. A ratio of 16 would come from wrongly using surface areas ($R^2$), as if the charge densities were equal.
- id: phys-m8-r2-h32
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'Why does a Van de Graaff generator have a large, smooth, rounded dome?'
  choices: ['A large radius and no sharp points keep the surface field below breakdown at higher voltages', 'A large dome has a smaller capacitance, so it charges faster', 'Smooth metal is a better conductor than rough metal', 'The belt needs the room inside to turn']
  answer: 0
  explanation: |-
    At the surface $E = V/R$, so a bigger radius allows a higher voltage before the air breaks down ($V_{\max} = E_{\max}R$). Bumps and points act like tiny spheres with strong local fields that leak charge by corona. A larger sphere has a larger capacitance ($4\pi\varepsilon_0R$).
- id: phys-m8-r2-h33
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'What is corona discharge?'
  choices: ['A full spark that jumps between two conductors', 'Charge flowing through a lightning rod to the ground', 'A faint glow where the air ionizes only in a thin region of very strong field near a sharp point', 'Light given off by a charged insulator as it is rubbed']
  answer: 2
  explanation: |-
    Near a sharp point the field can exceed the breakdown value in a small region while the field farther out is too weak for a complete spark, so the air ionizes only locally, giving a glow and a hiss (St. Elmo's fire). It slowly bleeds charge away.
- id: phys-m8-r2-h34
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'On a clear day the electric field just above flat ground is 150 V/m, pointing down. What is the surface charge density on the ground? ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['$-2.7\times10^{-9}$ C/m²', '$-1.3\times10^{-9}$ C/m²', '$+1.3\times10^{-9}$ C/m²', '$-1.7\times10^{13}$ C/m²']
  answer: 1
  explanation: |-
    The ground is a conductor, so just outside it $E = \sigma/\varepsilon_0$: $|\sigma| = (8.85\times10^{-12})(150) = 1.3\times10^{-9}$ C/m². The field points into the ground, so the charge is negative. Using the isolated-sheet formula $\sigma/(2\varepsilon_0)$ gives twice as much; dividing $E$ by $\varepsilon_0$ gives the absurd $10^{13}$.
- id: phys-m8-r2-h35
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'What starts dielectric breakdown in air?'
  choices: ['The field pulls protons out of the air''s nuclei', 'The air becomes a solid conductor when the voltage is high enough', 'Air molecules line up as dipoles and touch end to end', 'Free electrons gain enough energy between collisions to ionize molecules, setting off an avalanche']
  answer: 3
  explanation: |-
    A few free electrons are always present. In a strong enough field, each gains enough energy between collisions to knock another electron loose; the number doubles again and again, and the air along a path becomes a conducting channel of ionized gas.
- id: phys-m8-r2-h36
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'According to the modern view described in the lesson, what does a lightning rod mainly do?'
  choices: ['It gives a strike a safe, low-resistance path to ground that bypasses the building', 'It drains the cloud''s charge quietly so that lightning never strikes nearby', 'It repels lightning away from the building', 'It stores the lightning''s energy in the ground for later use']
  answer: 0
  explanation: |-
    Franklin hoped points would drain clouds and prevent strikes, but a rod can't stop lightning. What it does is intercept a strike and carry the current to ground through heavy conductors instead of through the building.
- id: phys-m8-r2-h37
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'What is the open puzzle about how lightning starts?'
  choices: ['Measured fields in thunderclouds are well below the breakdown strength of air, even at altitude', 'Nobody knows why clouds carry charge at all', 'Lightning moves faster than light', 'Thunder is heard before the flash']
  answer: 0
  explanation: |-
    Fields measured inside storms rarely exceed a few hundred kV/m, below air's breakdown strength. Proposed explanations include field enhancement near ice particles and avalanches seeded by cosmic-ray electrons. The leading charging mechanism (ice-graupel collisions) is also still being researched, but that clouds are charged is well established.
- id: phys-m8-r2-h38
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  type: text
  stem: 'Dry air at sea-level pressure breaks down at a field of about ___ $\times10^6$ V/m. Give only the number.'
  accept: ['3', '3.0']
  explanation: |-
    About $3\times10^6$ V/m, or 3 kV per millimeter, for gaps of about a centimeter. It's a rule of thumb that varies with pressure, humidity and gap size.
- id: phys-m8-r2-h39
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  type: order
  stem: 'Put the stages of a cloud-to-ground lightning flash in order.'
  items:
    - Charge separates in the cloud, leaving negative charge low down
    - A faint stepped leader works its way down from the cloud
    - Upward streamers rise from tall objects on the ground
    - A streamer meets the leader, completing the channel
    - A return stroke carries a huge current along the channel
  explanation: |-
    The leader must approach before streamers rise to meet it, and the return stroke can only flow once the channel is complete. Its current heats the air to about 30,000 K, producing the flash and thunder.
- id: phys-m8-r2-h40
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  type: match
  stem: 'Match each term to its description.'
  pairs:
    - ['Corona discharge', 'Glow from partial ionization near a sharp point']
    - ['Stepped leader', 'Faint ionized channel working down from a cloud in jumps']
    - ['Return stroke', 'Huge current surging along a completed channel']
    - ['Electrostatic precipitator', 'Uses corona to charge smoke particles and collect them']
  distractors: ['Belt that carries charge up into a dome']
  explanation: |-
    Corona is partial breakdown at a point; the stepped leader and return stroke are stages of a lightning flash; a precipitator uses corona to clean exhaust gases. The belt describes a Van de Graaff generator.
- id: phys-m8-r2-h41
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'Which changes would let a charged conducting sphere reach a higher potential before the gas around it breaks down? Select all that apply.'
  choices:
    - 'Polishing away bumps and points on its surface'
    - 'Lowering the pressure of the surrounding air'
    - 'Using a sphere of larger radius'
    - 'Attaching a thin metal spike to it'
    - 'Surrounding it with a gas of higher dielectric strength'
  answer: [0, 2, 4]
  explanation: |-
    $V_{\max} = E_{\max}R$: a larger radius or a gas that withstands a stronger field both help, and smooth surfaces avoid the strong local fields at bumps. A spike creates a tiny radius with a huge local field, and thinner air breaks down more easily.
- id: phys-m8-r2-h42
  lesson: phys-m8-h-breakdown
  topic: Dielectric breakdown
  stem: 'A lightning flash moves about 5 C through a potential difference of about $2\times10^8$ V. Roughly how much energy is released?'
  choices: ['$4\times10^7$ J', '$2\times10^8$ J', '$1\times10^9$ J', '$2.5\times10^{-8}$ J']
  answer: 2
  explanation: |-
    $E \approx Q\,\Delta V = (5)(2\times10^8) = 1\times10^9$ J, an order-of-magnitude estimate (the actual value is somewhat less, since the potential difference falls as charge flows). $2\times10^8$ J mistakes the voltage for the energy (it leaves out the charge); $4\times10^7$ J and $2.5\times10^{-8}$ J come from dividing one by the other instead of multiplying.
