# Round 2 questions for phys-m3 (Forces and Newton's laws): core lessons (q) and honors lessons (h)
# ---- Lesson 07: Newton's laws
- id: phys-m3-r2-q01
  lesson: phys-newton
  type: text
  module_quiz: true
  topic: Free-body diagrams
  stem: 'A 60 kg person stands on a bathroom scale in an elevator that is accelerating upward at 1.5 m/s². Using $g = 9.8$ m/s², the scale reads ___ N. Give only the number, to 3 significant figures.'
  accept: ['678']
  explanation: |-
    The scale reads the normal force. Up positive: $n - mg = ma$, so $n = m(g + a) = 60(9.8 + 1.5) = 60(11.3) = 678$ N. That is more than her true weight of 588 N because the floor must also accelerate her upward.
- id: phys-m3-r2-q02
  lesson: phys-newton
  type: order
  topic: Free-body diagrams
  stem: 'Put the steps for solving a Newton''s second law problem in order.'
  items:
    - 'Choose the object or system'
    - 'Draw its free-body diagram'
    - 'Choose axes, ideally one along the acceleration'
    - 'Write $\sum F = ma$ for each axis'
    - 'Solve the equations for the unknowns'
  explanation: |-
    You can't draw a free-body diagram until you know which object it is for, and you can't write component equations until the forces are drawn and the axes chosen. Solving comes last; afterward, check units and limiting cases.
- id: phys-m3-r2-q03
  lesson: phys-newton
  topic: Free-body diagrams
  stem: 'A book rests on a table. Which forces belong on the free-body diagram of the book? Select all that apply.'
  choices: ['Earth''s gravitational pull on the book', 'The table''s upward push on the book', 'The book''s downward push on the table', 'The book''s gravitational pull on Earth']
  answer: [0, 1]
  explanation: |-
    A free-body diagram shows only forces acting *on* the chosen object. The book's push on the table acts on the table, and its pull on Earth acts on Earth; those are the third-law partners of the two forces on the book.
- id: phys-m3-r2-q04
  lesson: phys-newton
  type: label
  module_quiz: true
  topic: Newton's laws
  stem: 'The picture pulls a book, a table and Earth apart to show four forces. Each arrow acts on the object it starts from. Name the numbered forces.'
  image: {src: images/phys-m3-third-law-blank.svg, alt: 'An exploded view of a book above a table above Earth with four numbered arrows: 1 points down from the book, 2 points up from the book, 3 points down from the table top, 4 points up from the surface of Earth.'}
  labels:
    - {x: 46.1, y: 30.5, text: Weight of the book (Earth pulls the book)}
    - {x: 53.9, y: 11.9, text: Normal force on the book}
    - {x: 53.9, y: 49.5, text: Book pushes down on the table}
    - {x: 46.1, y: 63.8, text: Book pulls up on Earth}
  distractors: [Floor pushes up on the table, Friction on the book]
  explanation: |-
    The two arrows on the book are its weight (1, down) and the table's normal force (2, up). Their third-law partners act on the other objects: the book pushes down on the table (3, partner of 2) and the book pulls up on Earth (4, partner of 1). Arrows 1 and 2 are equal and opposite but are not a third-law pair, because they act on the same object.
- id: phys-m3-r2-q05
  lesson: phys-newton
  type: match
  topic: Newton's laws
  stem: 'Match each law with what it says.'
  pairs:
    - ['Newton''s first law', 'With no net force, an object''s velocity stays constant']
    - ['Newton''s second law', 'The net force equals mass times acceleration']
    - ['Newton''s third law', 'Forces come in equal and opposite pairs acting on different objects']
  distractors: ['Every moving object needs a force in its direction of motion']
  explanation: |-
    First law: no net force, no change in velocity. Second law: $\sum\vec F = m\vec a$. Third law: $\vec F_{\text{A on B}} = -\vec F_{\text{B on A}}$. The distractor is the pre-Newtonian intuition the first law corrects: motion needs no force, only changes in motion do.
# ---- Lesson 08: friction and inclines
- id: phys-m3-r2-q06
  lesson: phys-friction
  type: text
  topic: Inclined planes
  stem: 'A coin on a book starts to slide when the book is tilted to $25^\circ$. The coefficient of static friction between coin and book is ___. Give the number to 2 decimal places.'
  accept: ['0.47', '0.466']
  explanation: |-
    At the verge of slipping, $mg\sin\theta = \mu_s mg\cos\theta$, so $\mu_s = \tan 25^\circ = 0.466 \approx 0.47$. ($\sin 25^\circ = 0.42$ and $\cos 25^\circ = 0.91$ are the usual wrong answers.)
- id: phys-m3-r2-q07
  lesson: phys-friction
  type: match
  module_quiz: true
  topic: Friction
  stem: 'A box on a floor has $\mu_s n = 50$ N and $\mu_k n = 35$ N. Match each situation with the friction force on the box.'
  pairs:
    - ['At rest, pushed horizontally with 20 N, does not move', 'Static friction of 20 N']
    - ['At rest, pushed horizontally with 49 N, does not move', 'Static friction of 49 N']
    - ['Already sliding, pushed with 60 N', 'Kinetic friction of 35 N']
    - ['Already sliding, pushed with 20 N (slowing down)', 'Kinetic friction of 35 N']
  distractors: ['Static friction of 50 N', 'Kinetic friction of 60 N']
  explanation: |-
    While the box doesn't move, static friction matches the push exactly (20 N, then 49 N); it reaches 50 N only at the verge of slipping. Once it slides, friction is $\mu_k n = 35$ N whatever the push: with a 60 N push the box speeds up, with a 20 N push it slows down, but friction is 35 N either way.
- id: phys-m3-r2-q08
  lesson: phys-friction
  topic: Friction
  stem: 'A box slides across a level floor. Which of these would change the kinetic friction force on it? Select all that apply.'
  choices: ['Loading extra weight into the box', 'Pulling it with a rope angled upward instead of horizontally', 'Sliding it faster', 'Turning it so it slides on a smaller face']
  answer: [0, 1]
  explanation: |-
    $f_k = \mu_k n$, so only things that change $n$ (or the surfaces) matter. Extra weight raises $n$; an upward-angled pull lifts part of the weight and lowers $n$. In this model kinetic friction doesn't depend on speed or contact area.
- id: phys-m3-r2-q09
  lesson: phys-friction
  type: label
  topic: Inclined planes
  stem: 'A block slides down a rough ramp. Name the numbered forces and components. (Dashed arrows are components of one of the solid arrows.)'
  image: {src: images/phys-m3-incline-blank.svg, alt: 'A block on a ramp tilted at angle theta with five numbered arrows from its center: 1 perpendicular to the ramp pointing out of it, 2 along the ramp pointing uphill, 3 straight down, 4 dashed along the ramp pointing downhill, 5 dashed perpendicular into the ramp.'}
  labels:
    - {x: 40.9, y: 29.9, text: Normal force}
    - {x: 51.9, y: 44.5, text: Kinetic friction}
    - {x: 47.6, y: 75.5, text: Weight}
    - {x: 43.7, y: 52.1, text: Component of the weight along the slope}
    - {x: 54.5, y: 67.6, text: Component of the weight into the slope}
  distractors: [Tension, Applied push]
  explanation: |-
    1 is the normal force, perpendicular to the surface. 2 is kinetic friction, pointing up the slope against the downhill sliding. 3 is the weight, straight down. The dashed arrows split the weight: 4 is $mg\sin\theta$ down the slope and 5 is $mg\cos\theta$ into the slope, which the normal force balances.
- id: phys-m3-r2-q10
  lesson: phys-friction
  type: order
  module_quiz: true
  topic: Friction
  stem: 'Put the stages of a skydiver''s fall (before she opens her parachute) in order.'
  items:
    - 'She steps out: drag is zero and she accelerates at $g$'
    - 'Drag grows with her speed, and her acceleration drops below $g$'
    - 'Drag equals her weight, and her speed stops changing'
  explanation: |-
    At the start her speed, and so the drag, is zero, and the net force is $mg$. As she speeds up, drag grows and the net force shrinks, so she keeps speeding up but more slowly. When drag equals her weight the net force is zero: she has reached terminal velocity.
# ---- Lesson 09: tension and pulleys
- id: phys-m3-r2-q11
  lesson: phys-tension
  type: text
  module_quiz: true
  topic: Tension and pulleys
  stem: 'An Atwood machine has 6.0 kg on one side and 4.0 kg on the other of an ideal pulley. Using $g = 9.8$ m/s², the acceleration is ___ m/s². Give only the number, to 3 significant figures.'
  accept: ['1.96']
  explanation: |-
    $a = \dfrac{m_1 - m_2}{m_1 + m_2}\,g = \dfrac{6.0 - 4.0}{10.0}(9.8) = 1.96$ m/s². Only the difference in weight drives the system, but the total mass has to be accelerated.
- id: phys-m3-r2-q12
  lesson: phys-tension
  type: order
  topic: Tension and pulleys
  stem: 'Put the steps for finding the acceleration and tension of two blocks joined by a rope in order.'
  items:
    - 'Draw a separate free-body diagram for each block'
    - 'Choose a positive direction for each block that matches the motion of the system'
    - 'Write $\sum F = ma$ along the motion for each block'
    - 'Solve the equations together for $a$ and $T$'
  explanation: |-
    The forces must be drawn before the signs can be chosen, the signs must be fixed before writing the equations (so both blocks share the same $a$), and the equations come before solving them.
- id: phys-m3-r2-q13
  lesson: phys-tension
  topic: Tension and pulleys
  stem: 'Two blocks are joined by a light rope over an ideal pulley, and they are accelerating. Which statements are true? Select all that apply.'
  choices: ['The tension is the same on both sides of the pulley', 'The rope can pull on the blocks but not push', 'The tension equals the weight of the hanging block', 'The two blocks have accelerations of the same magnitude']
  answer: [0, 1, 3]
  explanation: |-
    A massless rope over an ideal pulley has the same tension throughout, a rope can only pull, and a rope of fixed length makes both blocks move the same distance in each instant, so their accelerations have equal size. The tension equals a hanging block's weight only if that block is not accelerating.
- id: phys-m3-r2-q14
  lesson: phys-tension
  type: label
  module_quiz: true
  topic: Tension and pulleys
  stem: 'Block $m_1$ slides across a rough table toward the pulley as the hanging block $m_2$ falls. Name the numbered forces.'
  image: {src: images/phys-m3-table-pulley-blank.svg, alt: 'A block m1 on a table tied over a pulley at the table edge to a hanging block m2. Six numbered arrows: on m1, 1 points toward the pulley, 2 points away from the pulley, 3 points up, 4 points down; on m2, 5 points up and 6 points down.'}
  labels:
    - {x: 50.3, y: 26.5, text: Tension on the table block}
    - {x: 23.9, y: 35.9, text: Kinetic friction}
    - {x: 39.6, y: 17.4, text: Normal force}
    - {x: 32.6, y: 48.9, text: Weight of the table block}
    - {x: 81.2, y: 59.1, text: Tension on the hanging block}
    - {x: 81.2, y: 86.5, text: Weight of the hanging block}
  distractors: [Static friction, Centripetal force]
  explanation: |-
    On $m_1$: the rope pulls toward the pulley (1), kinetic friction opposes the sliding (2), the table pushes up (3) and gravity pulls down (4). On $m_2$: the rope pulls up (5) and gravity pulls down (6). The friction is kinetic because the block is sliding. The two tensions have the same size $T$ for an ideal rope and pulley.
- id: phys-m3-r2-q15
  lesson: phys-tension
  type: match
  topic: Tension and pulleys
  stem: 'A load of weight $W$ hangs in each setup. Match each setup with the tension in the rope or each cable.'
  pairs:
    - ['Hanging at rest from a single rope', 'T = W']
    - ['Hanging at rest from a movable pulley held by two strands of one rope', 'T = W/2']
    - ['Hanging from a single rope while accelerating upward', 'T greater than W']
    - ['Hanging from a single rope while accelerating downward (less than g)', 'T less than W']
  distractors: ['T = 2W']
  explanation: |-
    At rest, one rope holds the whole weight. Two strands share it, $2T = W$. Accelerating upward needs a net upward force, so $T > W$; accelerating downward needs a net downward force, so $T < W$.
# ---- Lesson 10: circular motion
- id: phys-m3-r2-q16
  lesson: phys-circular
  type: text
  topic: Circular motion
  stem: 'A runner moves at 12 m/s around a curve of radius 36 m. Her centripetal acceleration is ___ m/s². Give only the number.'
  accept: ['4']
  explanation: |-
    $a_c = v^2/r = 144/36 = 4.0$ m/s², pointing toward the center of the curve.
- id: phys-m3-r2-q17
  lesson: phys-circular
  type: match
  module_quiz: true
  topic: Circular motion
  stem: 'Match each motion with the real force that supplies its centripetal (inward) force.'
  pairs:
    - ['A car rounding a flat curve', 'Static friction']
    - ['The Moon orbiting Earth', 'Gravity']
    - ['A puck on a string circling on frictionless ice', 'Tension']
    - ['A car on a frictionless banked curve', 'Normal force']
  distractors: ['Centrifugal force', 'Kinetic friction']
  explanation: |-
    "Centripetal force" is a role. On a flat curve, sideways static friction on the tires does it (they aren't sliding sideways). Gravity holds the Moon. The string's tension pulls the puck inward. On a frictionless bank, the horizontal component of the tilted normal force does it. Centrifugal force is not a real force in an inertial frame.
- id: phys-m3-r2-q18
  lesson: phys-circular
  type: order
  topic: Circular motion
  stem: 'A roller coaster rider moves at the same speed $v$ in each place below, where $mv^2/r = 1.5\,mg$ for the loop. Order the places from the smallest to the largest normal force on the rider.'
  items:
    - 'At the top of the loop'
    - 'On a flat, level stretch of track'
    - 'At the bottom of the loop'
  explanation: |-
    Top: $n + mg = mv^2/r = 1.5mg$, so $n = 0.5mg$. Level track: no vertical acceleration, so $n = mg$. Bottom: $n - mg = 1.5mg$, so $n = 2.5mg$.
- id: phys-m3-r2-q19
  lesson: phys-circular
  topic: Circular motion
  stem: 'A ball on a string moves in a horizontal circle at constant speed. Which statements are true? Select all that apply.'
  choices: ['Its velocity is changing', 'Its acceleration points toward the center', 'The net force on it is zero', 'If the string breaks, it flies straight outward from the center']
  answer: [0, 1]
  explanation: |-
    The speed is constant but the direction changes, so the velocity changes and there is a centripetal acceleration toward the center. A nonzero acceleration needs a nonzero net force. If the string breaks, the ball continues along the tangent, not radially outward.
- id: phys-m3-r2-q20
  lesson: phys-circular
  type: label
  topic: Circular motion
  stem: 'A car rounds a frictionless banked curve at its design speed. The center of the curve is to the left. Name the numbered forces and components.'
  image: {src: images/phys-m3-banked-blank.svg, alt: 'A car on a road banked at angle theta, with the center of the curve to the left. Four numbered arrows from the car: 1 tilted up and toward the center, perpendicular to the road; 2 straight down; 3 dashed straight up; 4 dashed horizontal toward the center.'}
  labels:
    - {x: 44.3, y: 27.3, text: Normal force}
    - {x: 50.5, y: 86.3, text: Weight}
    - {x: 50.5, y: 27.3, text: Vertical component of the normal force}
    - {x: 40.6, y: 55.9, text: Horizontal component of the normal force}
  distractors: [Friction, Centrifugal force]
  explanation: |-
    The normal force (1) is perpendicular to the road, so it tilts toward the center. Its vertical component $n\cos\theta$ (3) balances the weight (2), and its horizontal component $n\sin\theta$ (4) points to the center and supplies $mv^2/r$. There is no friction on this curve, and no centrifugal force in the ground frame.
# ---- Honors 1: friction in systems
- id: phys-m3-r2-h01
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'A small block rests on a cart. The cart is pushed and speeds up to the right, and the block moves with it without slipping. The friction force on the block points'
  choices: ['to the left, opposite the motion', 'to the right, in the direction of motion', 'nowhere, because the block is not sliding', 'down, into the cart']
  answer: 1
  explanation: |-
    The block speeds up to the right, so it needs a net force to the right, and friction from the cart is the only horizontal force on it. Static friction opposes the *tendency to slide*: without it the cart would slide forward out from under the block.
- id: phys-m3-r2-h02
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'A 1.5 kg block sits on a 6.0 kg block on a frictionless floor, with $\mu_s = 0.50$ between them. A horizontal force pushes the bottom block. What is the largest force for which they move together? ($g = 9.8$ m/s²)'
  choices: ['7.4 N', '29 N', '73.5 N', '36.8 N']
  answer: 3
  explanation: |-
    At impending slip the top block's acceleration is $\mu_s g = 4.9$ m/s², and both blocks must have it: $F = (m + M)\mu_s g = 7.5(0.50)(9.8) = 36.8$ N. 7.4 N is the friction limit on the top block alone, 29 N uses only the bottom block's mass, and 73.5 N leaves out $\mu_s$.
- id: phys-m3-r2-h03
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'For the same blocks (1.5 kg on 6.0 kg, $\mu_s = 0.50$, frictionless floor), the bottom block is pushed with 30 N. What happens?'
  choices: ['They move together; friction on the top block is 6.0 N', 'They move together; friction on the top block is 7.4 N', 'The top block slips; friction on it is 7.4 N', 'The top block slips; friction on it is 6.0 N']
  answer: 0
  explanation: |-
    Assume no slip: $a = 30/7.5 = 4.0$ m/s². The top block needs $f = 1.5(4.0) = 6.0$ N, and the limit is $\mu_s mg = 7.35$ N. Since $6.0 < 7.35$, they move together with 6.0 N of static friction; static friction equals its limit only at impending slip.
- id: phys-m3-r2-h04
  lesson: phys-m3-h-friction-systems
  type: text
  topic: Friction in systems
  stem: 'A 2.0 kg block on an 8.0 kg block slips backward relative to it when the bottom block is pushed hard. Between the blocks $\mu_k = 0.30$. Using $g = 9.8$ m/s², the top block''s acceleration relative to the floor is ___ m/s². Give only the number, to 3 significant figures.'
  accept: ['2.94']
  explanation: |-
    While slipping, the only horizontal force on the top block is kinetic friction $\mu_k mg$, pointing forward because the bottom block slides forward relative to it. So $a = \mu_k g = 0.30(9.8) = 2.94$ m/s², whatever the push (as long as it slips).
- id: phys-m3-r2-h05
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'A 10 kg block is on a $30^\circ$ ramp with $\mu_s = 0.40$. A rope runs up the ramp, over a pulley, to a hanging 3.0 kg block. Released from rest, what happens? ($g = 9.8$ m/s²)'
  choices: ['The 10 kg block is dragged up the ramp', 'The 10 kg block slides down the ramp', 'Nothing moves; static friction on the 10 kg block is 19.6 N up the slope', 'Nothing moves; static friction on the 10 kg block is 33.9 N up the slope']
  answer: 2
  explanation: |-
    Compare driving forces: $m_1 g\sin 30^\circ = 49$ N down the slope versus $m_2 g = 29.4$ N pulling up it. The imbalance, 19.6 N, tends to slide the block down, so friction points up the slope. The limit is $\mu_s m_1 g\cos 30^\circ = 33.9$ N, more than enough, so nothing moves and friction is just the 19.6 N needed.
- id: phys-m3-r2-h06
  lesson: phys-m3-h-friction-systems
  module_quiz: true
  topic: Friction in systems
  stem: 'A 4.0 kg block is on a $30^\circ$ ramp with $\mu_s = 0.25$, tied over a pulley at the top to a hanging mass. What is the largest hanging mass that leaves the system at rest?'
  choices: ['1.13 kg', '2.00 kg', '2.87 kg', '3.00 kg']
  answer: 2
  explanation: |-
    At the upper limit the hanging mass is about to drag the block up, so friction points down the slope at its limit: $m_2 = m_1(\sin\theta + \mu_s\cos\theta) = 4.0(0.500 + 0.217) = 2.87$ kg. 1.13 kg is the lower limit, 2.00 kg ignores friction, and 3.00 kg leaves out the $\cos\theta$ in the normal force.
- id: phys-m3-r2-h07
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'A car takes a banked curve faster than its design speed without skidding. The static friction force on its tires points'
  choices: ['up the bank, away from the center', 'nowhere; friction is zero on a banked curve', 'straight forward, along the road', 'down the bank, toward the inside of the curve']
  answer: 3
  explanation: |-
    Above the design speed the normal force alone cannot supply enough inward force, and the car tends to slide up and out. Static friction opposes that tendency, pointing down the bank, and its horizontal component adds to the inward force.
- id: phys-m3-r2-h08
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'A curve of radius 80 m is banked at $10^\circ$ and $\mu_s = 0.40$. What is the fastest a car can take it without skidding? ($g = 9.8$ m/s²)'
  choices: ['22.0 m/s', '11.8 m/s', '17.7 m/s', '21.3 m/s']
  answer: 0
  explanation: |-
    $v_{\max}^2 = rg\dfrac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta} = 784\cdot\dfrac{0.1736 + 0.3939}{0.9848 - 0.0695} = 486$, so $v_{\max} = 22.0$ m/s. 11.8 m/s is the design speed (no friction), 17.7 m/s is the flat-road limit, and 21.3 m/s uses $rg(\tan\theta + \mu_s)$, leaving out the denominator.
- id: phys-m3-r2-h09
  lesson: phys-m3-h-friction-systems
  topic: Friction in systems
  stem: 'Which statements about static friction are true? Select all that apply.'
  choices: ['It can point in the direction an object is moving', 'It equals $\mu_s n$ only when the surfaces are about to slip', 'It is the force from the road that pushes a car forward when it speeds up', 'It always points opposite to the object''s velocity']
  answer: [0, 1, 2]
  explanation: |-
    Static friction opposes relative sliding between surfaces, not the velocity of the object, so it can point forward (a block on an accelerating cart, a car's driven tires). It takes whatever value is needed, up to $\mu_s n$, which it reaches only at impending motion.
- id: phys-m3-r2-h10
  lesson: phys-m3-h-friction-systems
  type: order
  topic: Friction in systems
  stem: 'Put the steps for deciding whether two surfaces slip in order.'
  items:
    - 'Assume the surfaces don''t slip, so the objects share one acceleration'
    - 'Find that shared acceleration'
    - 'Find the friction force needed to give it'
    - 'Compare the needed friction with $\mu_s n$'
  explanation: |-
    Each step uses the previous one: the no-slip assumption gives a shared acceleration, that acceleration tells you what friction is needed, and only then can you check it against the limit. If the check fails, redo the problem with kinetic friction.
- id: phys-m3-r2-h11
  lesson: phys-m3-h-friction-systems
  type: match
  topic: Friction in systems
  stem: 'Match each situation with the direction of the friction force described (forward means the direction the vehicle or box is moving).'
  pairs:
    - ['Box on the floor of a truck that is speeding up; the box does not slide', 'Forward']
    - ['Box on the floor of a truck that is braking; the box does not slide', 'Backward']
    - ['Road on the driven tires of a car that is speeding up', 'Forward']
    - ['Floor on a box sliding forward across it', 'Backward']
  distractors: ['Zero']
  explanation: |-
    Friction opposes relative sliding. In a speeding-up truck the box tends to slide back, so friction pushes it forward; when braking, the box tends to slide forward, so friction pushes it back. Driven tires push the road backward, and the road pushes the car forward. A box sliding over a fixed floor feels friction opposite its sliding.
- id: phys-m3-r2-h12
  lesson: phys-m3-h-friction-systems
  type: label
  topic: Friction in systems
  stem: 'A push on the bottom block makes two stacked blocks accelerate together on a frictionless floor. Name the numbered arrows.'
  image: {src: images/phys-m3-stacked-blank.svg, alt: 'A small block on top of a large block on a frictionless floor, with four numbered arrows: 1 points right into the left side of the large block, 2 points right along the bottom of the small block, 3 points left along the top of the large block, 4 points right above the blocks.'}
  labels:
    - {x: 18.0, y: 71.7, text: Push on the bottom block}
    - {x: 56.6, y: 56.7, text: Friction on the top block}
    - {x: 43.4, y: 64.0, text: Friction on the bottom block}
    - {x: 49.2, y: 23.3, text: Acceleration}
  distractors: [Friction from the floor, Normal force]
  explanation: |-
    The push (1) acts on the bottom block. Friction on the top block (2) points forward, giving it its acceleration; by the third law the top block exerts an equal friction force backward on the bottom block (3). Arrow 4 is the shared acceleration. The floor is frictionless.
- id: phys-m3-r2-h13
  lesson: phys-m3-h-friction-systems
  type: text
  topic: Friction in systems
  stem: 'A curve is banked at $20^\circ$. The smallest coefficient of static friction that lets a car park on the bank without sliding down is ___. Give the number to 2 decimal places.'
  accept: ['0.36', '0.364']
  explanation: |-
    A parked car is a block on an incline: it stays put if $\mu_s \ge \tan\theta = \tan 20^\circ = 0.364$. This is also the condition for the curve to have no minimum safe speed, since the top of the $v_{\min}^2$ formula, $\sin\theta - \mu_s\cos\theta$, is then zero or negative.
# ---- Honors 2: accelerating frames
- id: phys-m3-r2-h14
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'A pendulum hangs from the roof of a car that is speeding up steadily in a straight line. Compared with the vertical, the string'
  choices: ['tilts forward, in the direction of the acceleration', 'hangs straight down', 'tilts backward, opposite the acceleration', 'swings in a circle']
  answer: 2
  explanation: |-
    In the car's frame the fictitious force $-m\vec A$ points backward, so effective gravity tilts backward and the string lines up with it. In the ground frame, the string must tilt back so that its tension has a forward component to accelerate the bob.
- id: phys-m3-r2-h15
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'A pendulum in an accelerating car hangs at a steady $10^\circ$ from the vertical. What is the car''s acceleration? ($g = 9.8$ m/s²)'
  choices: ['55.6 m/s²', '1.73 m/s²', '9.65 m/s²', '0.176 m/s²']
  answer: 1
  explanation: |-
    $\tan\theta = A/g$, so $A = g\tan 10^\circ = 9.8(0.176) = 1.73$ m/s². 55.6 m/s² divides by $\tan\theta$ instead, 9.65 m/s² uses $\cos\theta$, and 0.176 m/s² forgets to multiply by $g$.
- id: phys-m3-r2-h16
  lesson: phys-m3-h-accelerating-frames
  type: text
  topic: Accelerating frames
  stem: 'An elevator accelerates upward at 1.2 m/s². Using $g = 9.8$ m/s², the effective gravity inside it is ___ m/s². Give only the number.'
  accept: ['11', '11.0']
  explanation: |-
    $\vec g_{\text{eff}} = \vec g - \vec A$. With $\vec A$ upward, subtracting it adds to the downward $g$: $g_{\text{eff}} = 9.8 + 1.2 = 11.0$ m/s² downward. Everything in the elevator feels about 12% heavier.
- id: phys-m3-r2-h17
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'A ring-shaped space station of radius 200 m spins to give Earth-normal gravity ($g = 9.8$ m/s²) at its rim. What is its rotation period?'
  choices: ['4.52 s', '128 s', '28.4 s', '9.03 s']
  answer: 2
  explanation: |-
    $\omega^2 r = g$ gives $\omega = \sqrt{9.8/200} = 0.221$ rad/s, so $T = 2\pi/\omega = 2\pi\sqrt{r/g} = 28.4$ s. 4.52 s is $\sqrt{r/g}$ without the $2\pi$, 9.03 s uses 2 in place of $2\pi$, and 128 s is $2\pi r/g$.
- id: phys-m3-r2-h18
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'What is the third-law partner of the centrifugal force on a passenger in a turning car?'
  choices: ['The passenger''s push on the car door', 'The centripetal force', 'There is none; a fictitious force is not exerted by any object', 'The friction of the road on the tires']
  answer: 2
  explanation: |-
    Third-law pairs are forces two objects exert on each other. No object exerts the centrifugal force; it appears only because the car's frame is accelerating, so it has no partner. The passenger's push on the door is the partner of the door's (real) push on the passenger.
- id: phys-m3-r2-h19
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'In the Northern Hemisphere, the Coriolis force deflects air moving horizontally'
  choices: ['to the right of its direction of motion', 'to the left of its direction of motion', 'straight up', 'toward the equator, whatever its direction']
  answer: 0
  explanation: |-
    Seen from above the North Pole, Earth turns counterclockwise, and in a counterclockwise-rotating frame the Coriolis force deflects moving objects to the right. In the Southern Hemisphere the deflection is to the left.
- id: phys-m3-r2-h20
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'Which of these are fictitious forces? Select all that apply.'
  choices: ['Centrifugal force', 'Coriolis force', 'Centripetal force', 'Tension']
  answer: [0, 1]
  explanation: |-
    Centrifugal and Coriolis forces appear only in rotating frames and are exerted by no object. "Centripetal force" is the name for the net inward real force in an inertial frame, and tension is a real force from a rope.
- id: phys-m3-r2-h21
  lesson: phys-m3-h-accelerating-frames
  type: match
  topic: Accelerating frames
  stem: 'Match each situation with the direction of the fictitious force on a passenger, in the car''s frame.'
  pairs:
    - ['Car speeding up on a straight road', 'Backward']
    - ['Car braking on a straight road', 'Forward']
    - ['Car turning left at constant speed', 'To the right (outward)']
    - ['Car at constant velocity on a straight road', 'None']
  distractors: ['To the left (inward)']
  explanation: |-
    The fictitious force is $-m\vec A$, opposite to the car's acceleration. Speeding up, $\vec A$ is forward, so the force is backward; braking, the reverse. Turning left, $\vec A$ points left toward the center, so the force (centrifugal) points right. At constant velocity $\vec A = 0$: the car is an inertial frame.
- id: phys-m3-r2-h22
  lesson: phys-m3-h-accelerating-frames
  type: label
  topic: Accelerating frames
  stem: 'A pendulum hangs at a steady angle in a car that is speeding up. Name the numbered arrows.'
  image: {src: images/phys-m3-car-pendulum-blank.svg, alt: 'A car with a pendulum hanging from its roof, tilted backward by angle theta. Four numbered arrows: 1 above the car pointing right, 2 along the string from the bob toward the pivot, 3 from the bob straight down, 4 dashed from the bob pointing left.'}
  labels:
    - {x: 46.9, y: 13.2, text: Acceleration of the car}
    - {x: 44.7, y: 43.4, text: Tension}
    - {x: 42.6, y: 65.9, text: Weight}
    - {x: 33.2, y: 50.9, text: Fictitious force (car frame only)}
  distractors: [Normal force, Centripetal force]
  explanation: |-
    The car accelerates forward (1). The string's tension (2) pulls the bob toward the pivot and gravity pulls it down (3). In the car's frame a fictitious force $-m\vec A$ (4) points backward; the three forces on the bob then balance, which is why the string hangs at $\tan\theta = A/g$.
- id: phys-m3-r2-h23
  lesson: phys-m3-h-accelerating-frames
  type: order
  topic: Accelerating frames
  stem: 'A passenger rides in an elevator. Order the situations from the smallest to the largest effective gravity she feels.'
  items:
    - 'The elevator is in free fall'
    - 'The elevator accelerates downward at 3 m/s²'
    - 'The elevator moves upward at constant speed'
    - 'The elevator accelerates upward at 3 m/s²'
  explanation: |-
    $g_{\text{eff}} = g - A$ with up positive for $A$: free fall gives 0, accelerating down at 3 m/s² gives 6.8 m/s², constant velocity gives 9.8 m/s², and accelerating up at 3 m/s² gives 12.8 m/s².
- id: phys-m3-r2-h24
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'Why doesn''t the Coriolis force decide which way water swirls down an ordinary sink?'
  choices: ['It only acts in the Southern Hemisphere', 'It acts only on objects at rest in the rotating frame', 'Water is too dense to be affected', 'Over such small distances and times it is far weaker than the water''s leftover motion']
  answer: 3
  explanation: |-
    The Coriolis acceleration is about $2\omega v$, and Earth's $\omega$ is only $7.29 \times 10^{-5}$ rad/s, so for slow water crossing a sink in a few seconds it is tiny compared with currents left over from filling. It matters for motions that are large and long-lasting, like storm systems. It acts in both hemispheres, and only on moving objects.
- id: phys-m3-r2-h25
  lesson: phys-m3-h-accelerating-frames
  topic: Accelerating frames
  stem: 'In an elevator accelerating upward at 2.0 m/s², a ball is released from rest (relative to the elevator) 2.0 m above the floor. How long does it take to reach the floor? ($g = 9.8$ m/s²)'
  choices: ['0.639 s', '0.716 s', '0.412 s', '0.582 s']
  answer: 3
  explanation: |-
    In the elevator frame the ball falls from rest with $g_{\text{eff}} = 9.8 + 2.0 = 11.8$ m/s², so $t = \sqrt{2(2.0)/11.8} = 0.582$ s. 0.639 s uses $g$ alone (an elevator at rest), 0.716 s uses $g - A$ (wrong sign), and 0.412 s forgets the factor 2 in $h = \tfrac12 gt^2$.
- id: phys-m3-r2-h26
  lesson: phys-m3-h-accelerating-frames
  type: text
  topic: Accelerating frames
  stem: 'A space station of radius 50 m must spin to give Earth-normal gravity ($g = 9.8$ m/s²) at its rim. Its rotation rate is ___ rpm. Give the number to 2 significant figures.'
  accept: ['4.2']
  explanation: |-
    $\omega = \sqrt{g/r} = \sqrt{9.8/50} = 0.443$ rad/s. One revolution is $2\pi$ rad, so that is $0.443/(2\pi) = 0.0705$ rev/s, times 60 is 4.2 rpm. A smaller station has to spin faster for the same artificial gravity.
