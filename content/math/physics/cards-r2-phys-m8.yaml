- {front: 'Electric dipole moment', back: '$\vec p = q\vec d$, from $-$ to $+$; units C·m. Water: $p \approx 6.2\times10^{-30}$ C·m.', topic: Electric dipoles}
- {front: 'Torque on a dipole in a uniform field', back: '$\tau = pE\sin\theta$; it turns $\vec p$ toward $\vec E$. Net force is zero.', topic: Electric dipoles}
- {front: 'Potential energy of a dipole', back: '$U = -pE\cos\theta$: $-pE$ aligned (stable), $+pE$ anti-aligned (unstable).', topic: Electric dipoles}
- {front: 'Work to flip a dipole from aligned to anti-aligned', back: '$W = 2pE$', topic: Electric dipoles}
- {front: 'Far field of a dipole', back: 'Axis: $E \approx 2kp/r^3$. Perpendicular bisector: $E \approx kp/r^3$ (opposite to $\vec p$). Valid for $r \gg d$.', topic: Electric dipoles}
- {front: 'Dipole in a nonuniform field', back: 'An aligned dipole is pulled toward the stronger field. That is why neutral objects are attracted to charges of either sign.', topic: Electric dipoles}
- {front: 'Polar vs nonpolar molecule', back: 'Polar: permanent dipole (water, bent). Nonpolar: bond dipoles cancel (CO₂, straight); can still get an induced dipole.', topic: Electric dipoles}
- {front: 'Why polar molecules align only slightly', back: 'Thermal energy $k_BT$ is far larger than $pE$ even in strong fields; the small bias still gives a large $\kappa$.', topic: Electric dipoles}
- {front: 'How a dielectric reduces the field', back: 'Lined-up dipoles leave bound charge at the slab faces, opposite to the nearby plates; field inside becomes $E_0/\kappa$.', topic: Electric dipoles}
- {front: 'Oil drop balanced in a field', back: '$qV/d = mg$, so $q = mgd/V$. For a negative drop, the top plate is positive.', topic: Charge quantization}
- {front: "Stokes's law", back: '$F_{\text{drag}} = 6\pi\eta rv$ for a small, slow sphere.', topic: Charge quantization}
- {front: 'Oil-drop radius from fall speed', back: '$6\pi\eta rv = \tfrac43\pi r^3\rho g$ gives $r = \sqrt{9\eta v/(2\rho g)}$.', topic: Charge quantization}
- {front: 'Rising-and-falling method', back: '$q = 6\pi\eta r(v_{\downarrow} + v_{\uparrow})/E$; jumps in one drop''s charge come in steps of $e$.', topic: Charge quantization}
- {front: 'Finding e from a set of drop charges', back: 'Find the largest unit that every charge is a whole multiple of; then $e = \sum q / \sum n$.', topic: Charge quantization}
- {front: "Millikan's result", back: '1913: $1.592\times10^{-19}$ C, about 0.6% low, mainly from a wrong air viscosity. Nobel Prize 1923.', topic: Charge quantization}
- {front: 'Exact value of e', back: '$1.602176634\times10^{-19}$ C, exact by definition since the 2019 SI.', topic: Charge quantization}
- {front: 'Quarks and charge quantization', back: 'Quarks have $\pm\tfrac13e$, $\pm\tfrac23e$ but are always bound; every free charge is a multiple of $e$.', topic: Charge quantization}
- {front: 'Dielectric strength of dry air', back: 'About $3\times10^6$ V/m (3 kV/mm) at sea level; depends on pressure, humidity and gap.', topic: Dielectric breakdown}
- {front: 'Highest potential of a sphere in air', back: '$E_{\text{surface}} = V/R$, so $V_{\max} = E_{\max}R$ and $Q_{\max} = E_{\max}R^2/k$.', topic: Dielectric breakdown}
- {front: 'Two connected spheres', back: 'Same $V$: $Q_1/Q_2 = R_1/R_2$, but $E_2/E_1 = R_1/R_2$: the small sphere has the stronger surface field.', topic: Dielectric breakdown}
- {front: 'Why sharp points leak charge', back: 'A point acts like a tiny sphere: small radius, strong surface field, so the air ionizes there (corona discharge).', topic: Dielectric breakdown}
- {front: 'Fair-weather field', back: 'About 100 V/m pointing down; ground negative, $\sigma = \varepsilon_0E \approx 9\times10^{-10}$ C/m², roughly $5\times10^5$ C on Earth.', topic: Dielectric breakdown}
- {front: 'Stages of a lightning flash', back: 'Charge separation, stepped leader, upward streamers, connection, return stroke (about 30 kA, about 30,000 K), thunder.', topic: Dielectric breakdown}
- {front: 'What a lightning rod does', back: 'Gives a strike a safe low-resistance path to ground; it does not prevent lightning.', topic: Dielectric breakdown}
- {front: 'Open question about lightning', back: 'Storm fields measured are below air''s breakdown strength; how flashes start is still researched.', topic: Dielectric breakdown}
