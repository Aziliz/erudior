- {front: 'Velocity-proportional damping: amplitude and energy over time', back: 'Amplitude $\propto e^{-bt/(2m)}$, energy $\propto e^{-bt/m}$: the same fraction is lost every cycle.', topic: Damped oscillations}
- {front: 'Damped angular frequency', back: '$\omega_d = \sqrt{\omega_0^2 - (b/2m)^2}$; light damping barely changes the frequency.', topic: Damped oscillations}
- {front: 'Critical damping constant', back: '$b_c = 2\sqrt{mk} = 2m\omega_0$ (equivalently $Q = \tfrac12$)', topic: Damped oscillations}
- {front: 'Underdamped vs critically damped vs overdamped', back: 'Under: oscillates with shrinking amplitude. Critical: fastest return with no overshoot. Over: creeps back slowly, no overshoot.', topic: Damped oscillations}
- {front: 'Quality factor Q', back: '$Q = m\omega_0/b = \sqrt{mk}/b$; large $Q$ means light damping.', topic: Damped oscillations}
- {front: 'Q rules of thumb (light damping)', back: 'Energy lost per cycle $\approx 2\pi/Q$ of the stored energy; amplitude falls to about 4% ($e^{-\pi}$) after $Q$ cycles.', topic: Damped oscillations}
- {front: 'Time for a damped amplitude to halve', back: '$t_{1/2} = \dfrac{2m\ln 2}{b}$', topic: Damped oscillations}
- {front: 'Steady-state amplitude of a driven oscillator', back: '$A = \dfrac{F_0/m}{\sqrt{(\omega_0^2 - \omega^2)^2 + (b\omega/m)^2}}$; it oscillates at the driving frequency $\omega$.', topic: Driven oscillations}
- {front: 'Driven oscillator: slow, resonant, fast driving', back: 'Slow: $A \approx F_0/k$. At $\omega_0$: $A = F_0/(b\omega_0) = QF_0/k$. Fast: $A \approx F_0/(m\omega^2)$, small.', topic: Driven oscillations}
- {front: 'Width of a resonance peak', back: '$\Delta\omega \approx \omega_0/Q$: high-$Q$ oscillators respond to a narrow band of frequencies.', topic: Driven oscillations}
- {front: 'Phase of a driven oscillator at resonance', back: 'Displacement lags the force by $90^\circ$, so velocity is in step with the force and the force always does positive work.', topic: Driven oscillations}
- {front: 'Fourier''s theorem', back: 'A periodic wave of frequency $f_1$ is a sum of sine waves at $f_1, 2f_1, 3f_1, \ldots$ (harmonics).', topic: Fourier analysis}
- {front: 'Spectrum of a square wave', back: 'Odd harmonics only, amplitudes $\propto 1/n$.', topic: Fourier analysis}
- {front: 'Spectrum of a sawtooth wave', back: 'All harmonics, amplitudes $\propto 1/n$.', topic: Fourier analysis}
- {front: 'What sets timbre?', back: 'Mainly the spectrum (which harmonics, how strong), plus how the sound starts and decays.', topic: Musical acoustics}
- {front: 'Missing fundamental', back: 'A tone at 600, 800, 1000 Hz is heard at 200 Hz: pitch follows the repetition rate $f_1$, even with no energy at $f_1$.', topic: Musical acoustics}
- {front: 'Plucking position and harmonics', back: 'Harmonics with a node at the pluck point are not excited; plucking the middle removes the even harmonics.', topic: Musical acoustics}
- {front: 'Ratios of consonant intervals', back: 'Octave 2:1, perfect fifth 3:2, perfect fourth 4:3, major third 5:4.', topic: Musical acoustics}
- {front: 'Equal-tempered semitone', back: 'Ratio $2^{1/12} \approx 1.0595$; $f = 440\cdot2^{n/12}$ Hz for $n$ semitones from A4.', topic: Musical acoustics}
- {front: 'Cents between two frequencies', back: '$1200\log_2(f_2/f_1)$; 100 cents per semitone, 1200 per octave.', topic: Musical acoustics}
- {front: 'Tempered vs pure intervals', back: 'Fifth: 700 vs 702.0 cents (2 cents narrow). Major third: 400 vs 386.3 cents (about 14 cents wide).', topic: Musical acoustics}
- {front: 'Wave impedance', back: 'String: $Z = \mu v = \sqrt{F_T\mu}$. Sound: $Z = \rho v$ (acoustic impedance, rayl).', topic: Wave reflection}
- {front: 'Fraction of intensity reflected at a boundary (straight on)', back: '$R = \left(\dfrac{Z_2 - Z_1}{Z_2 + Z_1}\right)^2$, $T = 1 - R$; equal impedances give no reflection.', topic: Wave reflection}
- {front: 'String pulse reflected from a heavier string', back: 'Inverted, with amplitude ratio $(Z_1 - Z_2)/(Z_1 + Z_2)$; fixed end is $-1$, free end $+1$.', topic: Wave reflection}
- {front: 'Why ultrasound needs coupling gel', back: 'Air–tissue impedance mismatch reflects about 99.9%; gel (near water''s $Z$) lets the sound in.', topic: Ultrasound imaging}
- {front: 'Typical reflections in the body', back: 'Soft tissue boundaries: about 1% or less. Soft tissue–bone: about 40%. Tissue–air: nearly 100%.', topic: Ultrasound imaging}
- {front: 'Echo depth', back: '$d = vt/2$ (round trip), with $v = 1540$ m/s assumed for soft tissue.', topic: Ultrasound imaging}
- {front: 'Ultrasound frequency trade-off', back: 'Higher $f$: shorter $\lambda$, finer detail, but more absorption (about 0.5 dB/cm/MHz), so less depth.', topic: Ultrasound imaging}
- {front: 'Doppler ultrasound shift', back: '$\Delta f \approx \dfrac{2fu\cos\theta}{v}$; the factor 2 is because the moving reflector shifts the wave twice.', topic: Ultrasound imaging}
- {front: 'Quarter-wave matching layer', back: 'A layer $\lambda/4$ thick with $Z = \sqrt{Z_1Z_2}$ cancels reflection at one frequency.', topic: Ultrasound imaging}
