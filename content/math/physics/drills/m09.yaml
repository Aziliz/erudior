- id: phys-ohms-law
  title: Ohm's law and power
  topic: Current and resistance
  vars:
    V: {min: 1.5, max: 240, step: 0.5}
    R: {min: 2, max: 2000, step: 2}
  calc:
    I: V/R
    P: V^2/R
  prompt: 'A {V} V source is connected across a {R:dp0} Ω resistor. Find the current (A) and the power dissipated (W), to 3 significant figures.'
  answers:
    - {format: sig4, name: I, label: 'Current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {format: sig4, name: P, label: 'Power', relTolerance: 0.01, units: {W: 1, mW: 0.001}}
  solution: |-
    $I = V/R = {V}/{R:dp0} =$ **{I:sig3} A**.

    $P = IV = V^2/R =$ **{P:sig3} W**.
- id: phys-resistivity
  title: Resistance of a wire
  topic: Current and resistance
  vars:
    mat: {choices: [{label: 'copper (ρ = 1.7 × 10⁻⁸ Ω·m)', value: 1.7}, {label: 'aluminum (ρ = 2.65 × 10⁻⁸ Ω·m)', value: 2.65}, {label: 'nichrome (ρ = 100 × 10⁻⁸ Ω·m)', value: 100}]}
    L: {min: 0.5, max: 200, step: 0.5}
    dmm: {min: 0.2, max: 3, step: 0.1}
    I: {min: 0.5, max: 10, step: 0.5}
  calc:
    A: pi*(dmm/2000)^2
    R: mat*1e-8*L/A
    V: I*R
  prompt: 'A {mat} wire is {L} m long with a diameter of {dmm} mm. Find its resistance (Ω) and the voltage drop across it (V) when it carries {I} A, to 3 significant figures.'
  answers:
    - {format: sig4, name: R, label: 'Resistance', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
    - {format: sig4, name: V, label: 'Voltage drop', relTolerance: 0.01, units: {V: 1, mV: 0.001}}
  solution: |-
    $A = \pi r^2 = \pi\left(\dfrac{{dmm}\times10^{-3}}{2}\right)^2 = {A:texsci}$ m².

    $R = \rho\dfrac{\,L}{\,A} = ({mat:num2}\times10^{-8})\dfrac{{L}}{{A:texsci}} =$ **{R:sig3} Ω**.

    $V = IR =$ **{V:sig3} V**.
- id: phys-energy-cost
  title: Cost of running an appliance
  topic: Electric power
  vars:
    P: {min: 5, max: 3000, step: 5}
    h: {min: 0.5, max: 12, step: 0.5}
    days: {min: 1, max: 31}
    rate: {min: 0.08, max: 0.35, step: 0.01}
  calc:
    E: P/1000*h*days
    cost: E*rate
  where: ['E >= 1']
  prompt: 'An appliance rated {P:dp0} W runs {h} hours a day for {days} days. Electricity costs {rate:money} per kWh. How many kWh does it use (3 significant figures), and what does it cost (to the nearest cent)?'
  answers:
    - {format: sig4, name: E, label: 'Energy', relTolerance: 0.01, units: {kWh: 1}}
    - {name: cost, label: 'Cost', format: money, tolerance: 0.02}
  solution: |-
    Energy $= P\times t = ({P:dp0}/1000\text{ kW})({h}\text{ h/day})({days}\text{ days}) =$ **{E:num2} kWh**.

    Cost $= {E:num4} \times {rate} =$ **{cost:money}**.
- id: phys-series-parallel
  title: Series–parallel resistor network
  topic: Series and parallel circuits
  vars:
    R1: {min: 1, max: 50}
    R2: {min: 2, max: 60}
    R3: {min: 2, max: 60}
    V: {min: 3, max: 48}
  calc:
    Rp: R2*R3/(R2 + R3)
    Req: R1 + Rp
    I: V/Req
    Vp: I*Rp
    I2: Vp/R2
  prompt: 'A {R1} Ω resistor is in series with a parallel pair of {R2} Ω and {R3} Ω, all connected to an ideal {V} V battery. Find the equivalent resistance (Ω), the battery current (A), and the current through the {R2} Ω resistor (A), to 3 significant figures.'
  answers:
    - {format: sig4, name: Req, label: '$R_{\text{eq}}$', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
    - {format: sig4, name: I, label: 'Battery current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {format: sig4, name: I2, label: 'Current in R₂', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    Parallel pair: $\dfrac{({R2})({R3})}{{R2} + {R3}} = {Rp:num2}$ Ω; total $R_{\text{eq}} = {R1} + {Rp:num2} =$ **{Req:num2} Ω**.

    $I = V/R_{\text{eq}} =$ **{I:num4} A**. Voltage across the pair: $IR_p = {Vp:num2}$ V.

    Current in the {R2} Ω resistor: ${Vp:num2}/{R2} =$ **{I2:num4} A**.
- id: phys-internal-resistance
  title: EMF and internal resistance
  topic: Series and parallel circuits
  vars:
    Ev: {min: 1.5, max: 24, step: 0.5}
    r: {min: 0.1, max: 3, step: 0.1}
    R: {min: 1, max: 50}
  calc:
    I: Ev/(R + r)
    Vt: Ev - I*r
    P: I^2*R
  prompt: 'A battery with emf {Ev} V and internal resistance {r} Ω is connected to a {R} Ω load. Find the current (A), the terminal voltage (V) and the power delivered to the load (W), to 3 significant figures.'
  answers:
    - {format: sig4, name: I, label: 'Current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {format: sig4, name: Vt, label: 'Terminal voltage', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: P, label: 'Load power', relTolerance: 0.01, units: {W: 1}}
  solution: |-
    $I = \dfrac{\mathcal{E}}{R + r} = \dfrac{{Ev}}{{R} + {r}} =$ **{I:num4} A**.

    $V = \mathcal{E} - Ir =$ **{Vt:num2} V**; $P = I^2R =$ **{P:num2} W**.
- id: phys-kirchhoff
  title: Two-battery circuit (Kirchhoff's rules)
  topic: Kirchhoff's rules
  vars:
    E1: {min: 3, max: 24}
    E2: {min: 1, max: 18}
    R1: {min: 1, max: 10}
    R2: {min: 1, max: 10}
    R3: {min: 1, max: 20}
  calc:
    det: (R1 + R3)*(R2 + R3) - R3^2
    I1: (E1*(R2 + R3) - E2*R3)/det
    I2: ((R1 + R3)*E2 - R3*E1)/det
    I3: I1 + I2
  where: ['abs(I1) > 0.01', 'abs(I2) > 0.01', 'abs(I3) > 0.01', 'abs(I1 + 15.54) > 0.5', 'abs(I2 + 15.54) > 0.5', 'abs(I3 + 15.54) > 0.5']
  prompt: 'Three branches connect junctions A (top) and B (bottom). Branch 1: a {E1} V battery and a {R1} Ω resistor. Branch 2: a {E2} V battery and a {R2} Ω resistor. Branch 3: a {R3} Ω resistor alone. Both batteries have their $+$ terminal toward A. Taking $I_1$, $I_2$ as upward currents in branches 1 and 2 and $I_3$ as the downward current in branch 3, find all three in amperes to 3 significant figures (a negative value means the opposite direction).'
  answers:
    - {format: sig4, name: I1, label: '$I_1 =$', relTolerance: 0.01, units: {A: 1}}
    - {format: sig4, name: I2, label: '$I_2 =$', relTolerance: 0.01, units: {A: 1}}
    - {format: sig4, name: I3, label: '$I_3 =$', relTolerance: 0.01, units: {A: 1}}
  solution: |-
    Junction A: $I_3 = I_1 + I_2$. Loop 1–3: ${E1} - {R1}I_1 - {R3}I_3 = 0$. Loop 2–3: ${E2} - {R2}I_2 - {R3}I_3 = 0$.

    Substituting: $({R1} + {R3})I_1 + {R3}I_2 = {E1}$ and ${R3}I_1 + ({R2} + {R3})I_2 = {E2}$. Solve these two equations simultaneously, for example by multiplying the first by ${R3}$ and the second by $({R1} + {R3})$ and subtracting to eliminate $I_1$.

    $I_1 =$ **{I1:num4} A**, $I_2 =$ **{I2:num4} A**, $I_3 = I_1 + I_2 =$ **{I3:num4} A**.
- id: phys-rc-charging
  title: Charging a capacitor
  topic: RC circuits
  vars:
    R: {min: 1, max: 500}
    C: {min: 1, max: 1000}
    Ev: {min: 3, max: 50}
    n: {min: 0.2, max: 4, step: 0.1}
  calc:
    tau: R*C/1000
    t: n*R*C/1000
    V: Ev*(1 - exp(-n))
    I: Ev/(R*1e3)*exp(-n)*1000
  prompt: 'A {C} μF capacitor, initially uncharged, charges through a {R} kΩ resistor from a {Ev} V battery. Find the time constant (s), and the capacitor''s voltage (V) and the current (mA) at $t = {t:num4}$ s. Give 3 significant figures.'
  answers:
    - {format: sig4, name: tau, label: 'Time constant', relTolerance: 0.01, units: {s: 1, ms: 0.001}}
    - {format: sig4, name: V, label: 'Capacitor voltage', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: I, label: 'Current', relTolerance: 0.01, units: {mA: 1, A: 1000}}
  solution: |-
    $\tau = RC = ({R}\times10^3)({C}\times10^{-6}) =$ **{tau:num4} s**, so $t/\tau = {t:num4}/{tau:num4} = {n}$.

    $V_C = \mathcal{E}(1 - e^{-t/\tau}) = {Ev}(1 - e^{-{n}}) =$ **{V:num2} V**.

    $I = \dfrac{\mathcal{E}}{\,R}e^{-t/\tau} =$ **{I:sig3} mA**.
- id: phys-rc-time
  title: Discharge time of a capacitor
  topic: RC circuits
  vars:
    R: {min: 1, max: 100}
    C: {min: 10, max: 2000, step: 10}
    V0: {min: 10, max: 500, step: 10}
    pct: {min: 5, max: 80, step: 5}
  calc:
    tau: R*1e3*C*1e-6
    Vf: V0*pct/100
    t: tau*ln(100/pct)
  prompt: 'A {C:dp0} μF capacitor charged to {V0} V discharges through a {R} kΩ resistor. How long until its voltage falls to {Vf:num1} V ({pct}% of the start)? Give seconds to 3 significant figures.'
  answers:
    - {format: sig4, name: t, label: 'Time', relTolerance: 0.01, units: {s: 1, ms: 0.001}}
  solution: |-
    $\tau = RC = {tau:sig3}$ s. From $V = V_0e^{-t/\tau}$: $t = \tau\ln\dfrac{V_0}{V} = {tau:sig3}\ln\dfrac{100}{{pct}} =$ **{t:sig3} s**.
