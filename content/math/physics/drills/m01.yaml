- id: phys-convert-speed
  title: Convert km/h to m/s
  topic: Units and conversions
  vars:
    v: {min: 18, max: 180, step: 1}
  calc:
    ms: v / 3.6
  prompt: 'A car travels at {v} km/h. Express this speed in m/s (3 significant figures).'
  answers:
    - {format: sig3, sigfigs: 3, name: ms, label: 'Speed', units: {'m/s': 1, 'km/h': 0.277777778}}
  solution: |-
    $${v}\,\frac{\text{km}}{\text{h}} \times \frac{1000\text{ m}}{1\text{ km}} \times \frac{1\text{ h}}{3600\text{ s}} = \frac{{v}}{3.6}\,\frac{\text{m}}{\text{s}}$$

    So the speed is **{ms:sig3} m/s**.
- id: phys-convert-area
  title: Convert an area from cm² to m²
  topic: Units and conversions
  vars:
    a: {min: 120, max: 9800, step: 10}
  calc:
    m2: a * 1e-4
  prompt: 'A solar cell has an area of {a} cm². What is its area in m²? (The conversion is exact, so give every digit.)'
  answers:
    - {format: sig4, name: m2, label: 'Area', relTolerance: 0.002, units: {'m²': 1, 'm^2': 1, 'cm²': 0.0001, 'cm^2': 0.0001}}
  solution: |-
    $1\text{ cm} = 10^{-2}\text{ m}$, so $1\text{ cm}^2 = 10^{-4}\text{ m}^2$ (square the factor).

    ${a:dp0}\text{ cm}^2 \times 10^{-4}\,\tfrac{\text{m}^2}{\text{cm}^2} =$ **{m2:num4} m²**.
- id: phys-sigfigs
  title: Area with significant figures
  topic: Significant figures
  vars:
    l: {min: 2.05, max: 9.95, step: 0.01}
    w: {min: 1.1, max: 4.9, step: 0.1}
  where: ['mod(round(l*100), 10) != 0', 'mod(round(w*10), 10) != 0']
  calc:
    A: l * w
  prompt: 'A rectangular sheet measures {l} m by {w} m. Find its area, rounded to the correct number of significant figures.'
  answers:
    - {name: A, label: 'Area', sigfigs: 2, format: sig2, units: {'m²': 1, 'm^2': 1}}
  solution: |-
    ${l} \times {w} = {A:num4}\text{ m}^2$. For a product, keep the fewest significant figures among the inputs: {l} has 3 and {w} has 2, so round to 2 significant figures: **{A:sig2} m²**.
- id: phys-vec-components
  title: Components of a vector
  topic: Vectors
  vars:
    A: {min: 5, max: 60}
    th: {min: 10, max: 350, step: 5}
  where: ['mod(th, 90) != 0', 'abs(A*cosd(th) + 15.54) > 1', 'abs(A*sind(th) + 15.54) > 1']
  calc:
    Ax: A * cosd(th)
    Ay: A * sind(th)
  prompt: 'A force of {A} N points at {th}° measured counterclockwise from the $+x$ axis. Find its $x$ and $y$ components (include the signs), each to 3 significant figures.'
  answers:
    - {format: sig4, name: Ax, label: '$F_x =$', relTolerance: 0.01, units: {N: 1}}
    - {format: sig4, name: Ay, label: '$F_y =$', relTolerance: 0.01, units: {N: 1}}
  figure:
    type: plot
    x: [-1.2, 1.2]
    y: [-1.2, 1.2]
    equal: true
    xLabel: x
    yLabel: y
    segments:
      - {from: [0, 0], to: ['cosd(th)', 'sind(th)'], arrow: true, label: 'F'}
    caption: 'F = {A} N at {th}°'
  solution: |-
    $F_x = F\cos\theta = {A}\cos {th}^\circ =$ **{Ax:sig3} N**

    $F_y = F\sin\theta = {A}\sin {th}^\circ =$ **{Ay:sig3} N**

    The signs come out of the trig functions automatically when the angle is measured from $+x$.
- id: phys-vec-add
  title: Add two displacement vectors
  topic: Vectors
  vars:
    a: {min: 3, max: 15}
    t1: {min: 0, max: 80, step: 5}
    b: {min: 3, max: 15}
    t2: {min: 95, max: 175, step: 5}
  calc:
    Rx: a*cosd(t1) + b*cosd(t2)
    Ry: a*sind(t1) + b*sind(t2)
    R: hypot(Rx, Ry)
    th: atan2d(Ry, Rx)
  where: ['R > 1', 'th > 1']
  prompt: 'A drone flies {a} km at {t1}° (counterclockwise from east), then {b} km at {t2}°. Find the magnitude of its total displacement and its direction in degrees counterclockwise from east (magnitude to 3 significant figures, direction to the nearest 0.1°).'
  answers:
    - {format: sig4, name: R, label: 'Magnitude', relTolerance: 0.01, units: {km: 1, m: 0.001}}
    - {format: sig4, name: th, label: 'Direction', tolerance: 0.5, units: {'°': 1, deg: 1}}
  solution: |-
    $R_x = {a}\cos {t1}^\circ + {b}\cos {t2}^\circ = {Rx:num2}$ km

    $R_y = {a}\sin {t1}^\circ + {b}\sin {t2}^\circ = {Ry:num2}$ km

    $R = \sqrt{R_x^2 + R_y^2} =$ **{R:sig3} km**, at $\theta =$ **{th:num1}°** (check the quadrant from the signs of $R_x$ and $R_y$).
- id: phys-dot-product
  title: Angle between two vectors
  topic: Vector products
  vars:
    a1: {min: -5, max: 5}
    a2: {min: -5, max: 5}
    a3: {min: -5, max: 5}
    b1: {min: -5, max: 5}
    b2: {min: -5, max: 5}
    b3: {min: -5, max: 5}
  calc:
    d: a1*b1 + a2*b2 + a3*b3
    A: sqrt(a1^2 + a2^2 + a3^2)
    B: sqrt(b1^2 + b2^2 + b3^2)
    phi: acosd(d / (A*B))
  where: ['a1 != 0', 'a2 != 0', 'a3 != 0', 'b1 != 0', 'b2 != 0', 'b3 != 0', 'd != 0', 'abs(d) < 0.98*A*B']
  prompt: 'For $\vec A = {a1:coef}\hat\imath {a2:signedcoef}\hat\jmath {a3:signedcoef}\hat k$ and $\vec B = {b1:coef}\hat\imath {b2:signedcoef}\hat\jmath {b3:signedcoef}\hat k$, find $\vec A\cdot\vec B$ and the angle between the vectors in degrees (to the nearest 0.1°).'
  answers:
    - {name: d, label: '$\vec A\cdot\vec B =$', format: integer}
    - {format: sig4, name: phi, label: 'Angle', tolerance: 0.5, units: {'°': 1, deg: 1}}
  solution: |-
    $\vec A\cdot\vec B = ({a1})({b1}) + ({a2})({b2}) + ({a3})({b3}) =$ **{d}**

    $|\vec A| = {A:num2}$, $|\vec B| = {B:num2}$, so $\cos\phi = \dfrac{{d}}{({A:num2})({B:num2})}$ and $\phi =$ **{phi:num1}°**.
