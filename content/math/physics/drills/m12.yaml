- id: phys-time-dilation
  title: Time dilation
  topic: Special relativity
  vars:
    b: {min: 0.10, max: 0.995, step: 0.005}
    t0: {min: 1, max: 100}
  calc:
    gam: 1/sqrt(1 - b^2)
    t: gam*t0
  prompt: 'A spacecraft moves at ${b:dp3}c$ relative to Earth. A clock on board measures {t0} μs between two ticks. Find the Lorentz factor (4 significant figures) and the time between those ticks measured from Earth (μs, 3 significant figures).'
  answers:
    - {format: sig4, name: gam, label: '$\gamma =$', relTolerance: 0.005}
    - {format: sig4, name: t, label: 'Earth time', relTolerance: 0.01, units: {'μs': 1, us: 1}}
  solution: |-
    $\gamma = \dfrac{1}{\sqrt{1 - ({b:dp3})^2}} =$ **{gam:num4}**.

    The ship's clock measures proper time, so $\Delta t = \gamma\Delta t_0 = {gam:num4}({t0}) =$ **{t:num2} μs**.
- id: phys-length-contraction
  title: Length contraction
  topic: Special relativity
  vars:
    b: {min: 0.10, max: 0.99, step: 0.01}
    L0: {min: 10, max: 500, step: 10}
  calc:
    L: L0*sqrt(1 - b^2)
  prompt: 'A spaceship has a proper length of {L0} m. What length do observers measure as it passes at ${b}c$? Give meters to 3 significant figures.'
  answers:
    - {format: sig4, name: L, label: 'Length', relTolerance: 0.01, units: {m: 1}}
  solution: |-
    $L = L_0\sqrt{1 - v^2/c^2} = {L0}\sqrt{1 - ({b})^2} =$ **{L:num2} m** (only the length along the motion contracts).
- id: phys-rel-energy
  title: Relativistic energy and momentum
  topic: Special relativity
  vars:
    part: {choices: [{label: 'an electron ($mc^2 = 0.511$ MeV)', value: 0.511}, {label: 'a proton ($mc^2 = 938.3$ MeV)', value: 938.3}]}
    b: {min: 0.10, max: 0.99, step: 0.01}
  calc:
    gam: 1/sqrt(1 - b^2)
    E: gam*part
    K: (gam - 1)*part
    pc: gam*part*b
  prompt: 'Consider {part} moving at ${b}c$. Find its total energy (MeV), kinetic energy (MeV) and momentum (in MeV/$c$), each to 3 significant figures.'
  answers:
    - {format: sig4, name: E, label: 'Total energy', relTolerance: 0.01, units: {MeV: 1, GeV: 1000}}
    - {format: sig4, name: K, label: 'Kinetic energy', relTolerance: 0.01, units: {MeV: 1, GeV: 1000}}
    - {format: sig4, name: pc, label: 'Momentum', relTolerance: 0.01, units: {'MeV/c': 1}}
  solution: |-
    $\gamma = 1/\sqrt{1 - ({b})^2} = {gam:num4}$.

    $E = \gamma mc^2 =$ **{E:num4} MeV**; $K = (\gamma - 1)mc^2 =$ **{K:num4} MeV**; $pc = \gamma mc^2(v/c) =$ **{pc:num4} MeV**, so $p$ = {pc:num4} MeV/$c$.
- id: phys-photon-energy
  title: Photon energy and photon rate
  topic: Photons
  vars:
    lam: {min: 200, max: 1000, step: 5}
    PmW: {min: 0.5, max: 100, step: 0.5}
  calc:
    EeV: 1240/lam
    EJ: EeV*1.602e-19
    N: PmW*1e-3/EJ
  prompt: 'A {PmW} mW light source emits {lam:dp0} nm light. Find the energy of each photon in eV and the number of photons emitted per second, each to 3 significant figures. ($hc = 1240$ eV·nm, $1\text{ eV} = 1.602\times10^{-19}$ J)'
  answers:
    - {format: sig4, name: EeV, label: 'Photon energy', relTolerance: 0.01, units: {eV: 1}}
    - {name: N, label: 'Photons per second', format: sci, relTolerance: 0.01, units: {'/s': 1}}
  solution: |-
    $E = \dfrac{hc}{\lambda} = \dfrac{1240}{{lam:dp0}} =$ **{EeV:num4} eV** $= {EJ:texsci}$ J.

    Rate $= \dfrac{P}{E} = \dfrac{{PmW}\times10^{-3}}{{EJ:texsci}} = \mathbf{{N:texsci}}$ photons/s.
- id: phys-photoelectric
  title: Photoelectric effect
  topic: Photons
  vars:
    metal: {choices: [{label: 'sodium (φ = 2.28 eV)', value: 2.28}, {label: 'potassium (φ = 2.30 eV)', value: 2.30}, {label: 'calcium (φ = 2.87 eV)', value: 2.87}, {label: 'zinc (φ = 4.30 eV)', value: 4.30}]}
    lam: {min: 150, max: 450, step: 5}
  calc:
    E: 1240/lam
    K: E - metal
    l0: 1240/metal
  where: ['K > 0.1']
  prompt: 'Light of wavelength {lam:dp0} nm shines on {metal}. Find the maximum kinetic energy of the ejected electrons (eV) and the metal''s threshold wavelength (nm), each to 3 significant figures. ($hc = 1240$ eV·nm)'
  answers:
    - {format: sig4, name: K, label: '$K_{\max}$', relTolerance: 0.01, units: {eV: 1}}
    - {format: sig4, name: l0, label: 'Threshold wavelength', relTolerance: 0.01, units: {nm: 1}}
  solution: |-
    Photon energy: $1240/{lam:dp0} = {E:num4}$ eV. $K_{\max} = hf - \phi = {E:num4} - {metal:num2} =$ **{K:num4} eV** (stopping potential {K:num4} V).

    Threshold: $\lambda_0 = hc/\phi = 1240/{metal:num2} =$ **{l0:num1} nm**.
- id: phys-wien
  title: Blackbody peak (Wien's law)
  topic: Photons
  vars:
    temp: {min: 1000, max: 30000, step: 100}
    lam2: {min: 200, max: 3000, step: 10}
  calc:
    lmax: 2.898e6/temp
    lmaxm: lmax*1e-9
    T2: 2.898e6/lam2
  prompt: 'Treat each object as a blackbody, with $\lambda_{\max}T = 2.898\times10^{-3}$ m·K. (a) A star''s surface is at {temp:dp0} K. At what wavelength (nm) does its spectrum peak? (b) Another object''s spectrum peaks at {lam2:dp0} nm. What is its temperature (K)? Give each to 3 significant figures.'
  answers:
    - {format: sig4, name: lmax, label: '(a) $\lambda_{\max} =$', relTolerance: 0.01, units: {nm: 1, m: 1e9, 'μm': 1000, um: 1000}}
    - {format: sig4, name: T2, label: '(b) $T =$', relTolerance: 0.01, units: {K: 1}}
  solution: |-
    (a) $\lambda_{\max} = \dfrac{2.898\times10^{-3}\text{ m·K}}{{temp:dp0}\text{ K}} = {lmaxm:texsci}$ m $=$ **{lmax:sig3} nm**.

    (b) $T = \dfrac{2.898\times10^{-3}}{{lam2:dp0}\times10^{-9}} =$ **{T2:sig3} K**.
- id: phys-compton
  title: Compton scattering
  topic: Photons
  vars:
    lam: {min: 5, max: 100, step: 0.5}
    th: {min: 30, max: 180, step: 5}
  calc:
    dl: 2.43*(1 - cosd(th))
    lp: lam + dl
    Ke: 1240*dl/(lam*lp)
  prompt: 'An X-ray photon of wavelength {lam:num1} pm scatters off a nearly free electron and leaves at {th}° to its original direction. Using $h/(m_ec) = 2.43$ pm and $hc = 1240$ keV·pm, find (a) the wavelength shift (pm), (b) the scattered wavelength (pm) and (c) the kinetic energy given to the electron (keV), each to 3 significant figures.'
  answers:
    - {format: sig4, name: dl, label: '(a) $\Delta\lambda =$', relTolerance: 0.01, units: {pm: 1, nm: 1000}}
    - {format: sig4, name: lp, label: '(b) $\lambda'' =$', relTolerance: 0.01, units: {pm: 1, nm: 1000}}
    - {format: sig4, name: Ke, label: '(c) $K =$', relTolerance: 0.01, units: {keV: 1, eV: 0.001}}
  solution: |-
    (a) $\Delta\lambda = \dfrac{h}{m_ec}(1 - \cos\theta) = 2.43(1 - \cos{th}^\circ) =$ **{dl:sig3} pm**.

    (b) $\lambda' = \lambda + \Delta\lambda = {lam:num1} + {dl:num4} =$ **{lp:sig3} pm**.

    (c) The electron gains the energy the photon loses: $K = \dfrac{hc}{\lambda} - \dfrac{hc}{\lambda'} = \dfrac{1240}{{lam:num1}} - \dfrac{1240}{{lp:num4}} =$ **{Ke:sig3} keV**. (Keep extra digits: the two energies are close.)
- id: phys-bohr
  title: Hydrogen transition (Bohr model)
  topic: Atomic structure
  vars:
    ni: {min: 2, max: 7}
    nf: {min: 1, max: 4}
  where: ['ni > nf']
  calc:
    dE: 13.6*(1/nf^2 - 1/ni^2)
    lam: 1240/dE
  prompt: 'A hydrogen atom''s electron drops from $n = {ni}$ to $n = {nf}$. Find the energy (eV) and wavelength (nm) of the emitted photon, each to 4 significant figures. ($E_n = -13.6\text{ eV}/n^2$, $hc = 1240$ eV·nm)'
  answers:
    - {format: sig4, name: dE, label: 'Photon energy', relTolerance: 0.005, units: {eV: 1}}
    - {format: sig4, name: lam, label: 'Wavelength', relTolerance: 0.005, units: {nm: 1}}
  solution: |-
    $\Delta E = 13.6\left(\dfrac{1}{{nf}^2} - \dfrac{1}{{ni}^2}\right) =$ **{dE:num4} eV**.

    $\lambda = 1240/\Delta E =$ **{lam:num1} nm** (visible if between about 400 and 700 nm; transitions to $n = 1$ are ultraviolet).
- id: phys-de-broglie
  title: de Broglie wavelength of an accelerated particle
  topic: Wave–particle duality
  vars:
    part: {choices: [{label: 'an electron', value: 9.11e-31}, {label: 'a proton', value: 1.673e-27}]}
    V: {min: 10, max: 10000, step: 10}
  calc:
    p: sqrt(2*part*1.602e-19*V)
    lam: 6.63e-34/p
    lnm: lam*1e9
  prompt: 'Starting from rest, {part} is accelerated through {V:dp0} V. Find its de Broglie wavelength in nm, to 3 significant figures (ignore relativistic effects). ($h = 6.63\times10^{-34}$ J·s, $e = 1.602\times10^{-19}$ C, $m_e = 9.11\times10^{-31}$ kg, $m_p = 1.673\times10^{-27}$ kg)'
  answers:
    - {name: lnm, label: 'Wavelength', format: sci, relTolerance: 0.01, units: {nm: 1, m: 1e9, pm: 0.001}}
  solution: |-
    $K = eV$ and $p = \sqrt{2mK} = \sqrt{2({part:texsci})(1.602\times10^{-19})({V:dp0})} = {p:texsci}$ kg·m/s.

    $\lambda = \dfrac hp = {lam:texsci}$ m $= \mathbf{{lnm:texsci}}$ nm.
- id: phys-atomic-states
  title: Counting quantum states
  topic: Multielectron atoms
  vars:
    n: {min: 1, max: 7}
    sub: {choices: [{label: 's', value: 0}, {label: 'p', value: 1}, {label: 'd', value: 2}, {label: 'f', value: 3}]}
  where: ['sub <= n - 1']
  calc:
    lval: sub
    nml: 2*sub + 1
    esub: 2*(2*sub + 1)
    eshell: 2*n^2
  prompt: 'Consider the {n}{sub} subshell of an atom. Give (a) its orbital quantum number $l$, (b) the number of allowed $m_l$ values, (c) the greatest number of electrons the subshell can hold, and (d) the greatest number of electrons the whole $n = {n}$ shell can hold.'
  answers:
    - {name: lval, label: '(a) $l =$', format: integer}
    - {name: nml, label: '(b) $m_l$ values', format: integer}
    - {name: esub, label: '(c) subshell', format: integer}
    - {name: eshell, label: '(d) shell', format: integer}
  solution: |-
    (a) The letters s, p, d, f stand for $l = 0, 1, 2, 3$, so {sub} means $l =$ **{lval:int}**.

    (b) $m_l$ runs from $-l$ to $l$, so the number of values is $2l + 1 =$ **{nml:int}**.

    (c) Each $m_l$ allows two spins ($m_s = \pm\tfrac12$), so the subshell holds $2(2l + 1) =$ **{esub:int}** electrons (Pauli exclusion principle).

    (d) The shell holds $2n^2 = 2({n})^2 =$ **{eshell:int}** electrons.
- id: phys-xray-tube
  title: X-ray tube cutoff
  topic: X-rays and lasers
  vars:
    kV: {min: 10, max: 150}
  calc:
    Emax: kV
    lmin: 1240/kV
    fmax: kV*1000*1.602e-19/6.63e-34
  prompt: 'An X-ray tube accelerates electrons through {kV} kV. Find (a) the energy of the most energetic X-ray photon (keV), (b) the cutoff wavelength (pm) and (c) the highest X-ray frequency (Hz), each to 3 significant figures. ($hc = 1240$ eV·nm, $h = 6.63\times10^{-34}$ J·s, $e = 1.602\times10^{-19}$ C)'
  answers:
    - {format: sig4, name: Emax, label: '(a) $E_{\max} =$', relTolerance: 0.01, units: {keV: 1, eV: 0.001}}
    - {format: sig4, name: lmin, label: '(b) $\lambda_{\min} =$', relTolerance: 0.01, units: {pm: 1, nm: 1000}}
    - {name: fmax, label: '(c) $f_{\max} =$', format: sci, relTolerance: 0.01, units: {Hz: 1}}
  solution: |-
    (a) The most energetic photon takes all of an electron's kinetic energy, $eV$: **{Emax} keV**.

    (b) $\lambda_{\min} = \dfrac{hc}{eV}$. With $hc = 1240$ eV·nm $= 1240$ keV·pm, $\lambda_{\min} = \dfrac{1240\text{ keV·pm}}{{kV}\text{ keV}} =$ **{lmin:sig3} pm**.

    (c) $f_{\max} = \dfrac{eV}{h} = \dfrac{(1.602\times10^{-19})({kV}\times10^{3})}{6.63\times10^{-34}} = \mathbf{{fmax:texsci}}$ Hz.
- id: phys-moseley
  title: Characteristic X-ray (Kα) estimate
  topic: X-rays and lasers
  vars:
    el: {choices: [{label: 'titanium ($Z = 22$)', value: 22}, {label: 'chromium ($Z = 24$)', value: 24}, {label: 'iron ($Z = 26$)', value: 26}, {label: 'cobalt ($Z = 27$)', value: 27}, {label: 'nickel ($Z = 28$)', value: 28}, {label: 'copper ($Z = 29$)', value: 29}, {label: 'zinc ($Z = 30$)', value: 30}, {label: 'molybdenum ($Z = 42$)', value: 42}, {label: 'silver ($Z = 47$)', value: 47}, {label: 'tungsten ($Z = 74$)', value: 74}]}
  calc:
    EeV: 10.2*(el - 1)^2
    EkeV: EeV/1000
    lam: 1240*1000/EeV
    lamnm: lam/1000
  prompt: 'Estimate the energy (keV) and wavelength (pm) of the Kα X-ray line of {el}, using $E \approx 10.2\text{ eV}\,(Z - 1)^2$ and $hc = 1240$ eV·nm. Give each to 3 significant figures.'
  answers:
    - {format: sig4, name: EkeV, label: 'Energy', relTolerance: 0.01, units: {keV: 1, eV: 0.001}}
    - {format: sig4, name: lam, label: 'Wavelength', relTolerance: 0.01, units: {pm: 1, nm: 1000}}
  solution: |-
    The remaining 1s electron screens one unit of nuclear charge, so the dropping electron sees about $Z - 1 = {el:dp0} - 1$.

    $E \approx 10.2({el:dp0} - 1)^2 = {EeV:dp0}$ eV $=$ **{EkeV:sig3} keV**.

    $\lambda = \dfrac{hc}{E} = \dfrac{1240\text{ eV·nm}}{{EeV:dp0}\text{ eV}} = {lamnm:num4}$ nm $=$ **{lam:sig3} pm**.
- id: phys-half-life
  title: Radioactive decay
  topic: Radioactive decay
  vars:
    T: {min: 1, max: 30}
    t: {min: 1, max: 100}
    A0: {min: 10, max: 1000, step: 10}
  calc:
    A: A0*0.5^(t/T)
    lam: ln(2)/T
  where: ['A > 0.5']
  prompt: 'A radioactive isotope has a half-life of {T} days. A sample starts with activity {A0:dp0} MBq. Find the decay constant (per day) and the activity after {t} days (MBq), each to 3 significant figures.'
  answers:
    - {format: sig4, name: lam, label: '$\lambda$', relTolerance: 0.01, units: {'/day': 1, 'per day': 1}}
    - {format: sig4, name: A, label: 'Activity', relTolerance: 0.01, units: {MBq: 1, kBq: 0.001}}
  solution: |-
    $\lambda = \dfrac{\ln 2}{T_{1/2}} = \dfrac{0.693}{{T}} =$ **{lam:num4} per day**.

    $A = A_0\left(\tfrac12\right)^{t/T_{1/2}} = {A0:dp0}\left(\tfrac12\right)^{{t}/{T}} =$ **{A:num2} MBq**.
- id: phys-binding-energy
  title: Nuclear binding energy
  topic: Nuclear structure
  vars:
    nuc: {choices: [{label: 'lithium-7 (Z = 3, A = 7, atomic mass 7.016004 u)', value: 7.016004}, {label: 'carbon-12 (Z = 6, A = 12, atomic mass 12.000000 u)', value: 12.0}, {label: 'oxygen-16 (Z = 8, A = 16, atomic mass 15.994915 u)', value: 15.994915}, {label: 'iron-56 (Z = 26, A = 56, atomic mass 55.934937 u)', value: 55.934937}, {label: 'helium-4 (Z = 2, A = 4, atomic mass 4.002603 u)', value: 4.002603}]}
  calc:
    Z: if(nuc < 5, 2, if(nuc < 8, 3, if(nuc < 13, 6, if(nuc < 17, 8, 26))))
    A: round(nuc)
    N: A - Z
    mtot: Z*1.007825 + (A - Z)*1.008665
    dm: Z*1.007825 + (A - Z)*1.008665 - nuc
    EB: dm*931.5
    per: EB/A
  prompt: 'Find the mass defect (u), binding energy (MeV) and binding energy per nucleon (MeV) of {nuc}, each to 4 significant figures. Use hydrogen-atom mass 1.007825 u, neutron mass 1.008665 u, and 1 u = 931.5 MeV/$c^2$.'
  answers:
    - {format: sig4, name: dm, label: 'Mass defect', relTolerance: 0.005, units: {u: 1}}
    - {format: sig4, name: EB, label: 'Binding energy', relTolerance: 0.005, units: {MeV: 1}}
    - {format: sig4, name: per, label: 'Per nucleon', relTolerance: 0.005, units: {MeV: 1}}
  solution: |-
    Separate parts: ${Z}(1.007825) + {N}(1.008665) = {mtot:dp6}$ u.

    Mass defect: $\Delta m = {mtot:dp6} - {nuc:dp6} =$ **{dm:dp6} u**.

    $E_B = \Delta m\,(931.5\text{ MeV/u}) =$ **{EB:num2} MeV**, or **{per:num4} MeV** per nucleon.
- id: phys-carbon-dating
  title: Carbon dating
  topic: Radioactive decay
  vars:
    pct: {min: 5, max: 95}
  calc:
    t: 5730*ln(pct/100)/ln(0.5)
  prompt: 'A sample of ancient charcoal has {pct}% of the carbon-14 activity of living wood. Using a half-life of 5730 years, how old is it, in years to 3 significant figures?'
  answers:
    - {format: sig4, name: t, label: 'Age', relTolerance: 0.01, units: {years: 1, yr: 1, y: 1}}
  solution: |-
    $\dfrac{A}{A_0} = \left(\tfrac12\right)^{t/5730}$, so $t = 5730\cdot\dfrac{\ln({pct}/100)}{\ln 0.5} =$ **{t:dp0} years**.
