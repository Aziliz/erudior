# Round 2 drills for phys-m3 (honors lessons)
- id: phys-m3-r2-stacked-blocks
  title: Stacked blocks on the verge of slipping
  topic: Friction in systems
  vars:
    m: {min: 1, max: 4, step: 0.5}
    M: {min: 4, max: 12}
    mus: {min: 0.2, max: 0.8, step: 0.05}
  calc:
    amax: mus*9.8
    Fmax: (m + M)*mus*9.8
  prompt: 'A {m} kg block rests on a {M} kg block on a frictionless floor. The coefficient of static friction between the blocks is {mus}. A horizontal force pushes the bottom block. Using $g = 9.8$ m/s², find the largest acceleration the blocks can have together and the largest force for which they move together. Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: amax, label: 'Largest acceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: Fmax, label: 'Largest force', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    The only horizontal force on the top block is static friction, at most $\mu_s m g$. So its acceleration can be at most $a_{\max} = \mu_s g = {mus}(9.8) =$ **{amax:sig3} m/s²**.

    Moving together, both blocks have this acceleration, and the only external horizontal force is the push: $F_{\max} = (m + M)a_{\max} = ({m} + {M})({amax:num4}) =$ **{Fmax:sig3} N**.
- id: phys-m3-r2-incline-pulley
  title: Block on a ramp pulled by a hanging mass
  topic: Friction in systems
  vars:
    m1: {min: 3, max: 10}
    th: {min: 15, max: 40}
    muk: {min: 0.1, max: 0.4, step: 0.05}
    m2: {min: 2, max: 12}
  calc:
    drive: m2*9.8 - m1*9.8*sind(th)
    fk: muk*m1*9.8*cosd(th)
    a: (drive - fk)/(m1 + m2)
    T: m2*(9.8 - a)
  where: ['a > 0.3']
  prompt: 'A {m1} kg block on a {th}° ramp is tied by a rope running up the ramp, over a pulley at the top, to a hanging {m2} kg block. The hanging block falls and drags the ramp block up the slope; the coefficient of kinetic friction on the ramp is {muk}. Using $g = 9.8$ m/s², find the acceleration and the rope tension. Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: a, label: 'Acceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: T, label: 'Tension', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    The ramp block moves up the slope, so kinetic friction on it points down the slope: $f_k = \mu_k m_1 g\cos\theta = {muk}({m1})(9.8)\cos {th}^\circ = {fk:num2}$ N.

    With the direction of motion positive for each block: $m_1$: $T - m_1g\sin\theta - f_k = m_1a$; $m_2$: $m_2g - T = m_2a$. Adding,

    $a = \dfrac{m_2g - m_1g\sin\theta - f_k}{m_1 + m_2} = \dfrac{{drive:num2} - {fk:num2}}{{m1} + {m2}} =$ **{a:sig3} m/s²**.

    Then $T = m_2(g - a) = {m2}(9.8 - {a:num4}) =$ **{T:sig3} N**.
- id: phys-m3-r2-banked-range
  title: Speed range on a banked curve with friction
  topic: Friction in systems
  vars:
    r: {min: 40, max: 200, step: 10}
    th: {min: 12, max: 30}
    mu: {min: 0.05, max: 0.4, step: 0.05}
  where: ['mu < tand(th) - 0.03']
  calc:
    vmax: sqrt(r*9.8*(sind(th) + mu*cosd(th))/(cosd(th) - mu*sind(th)))
    vmin: sqrt(r*9.8*(sind(th) - mu*cosd(th))/(cosd(th) + mu*sind(th)))
  prompt: 'A curve of radius {r} m is banked at {th}°, and the coefficient of static friction between tires and road is {mu}. Using $g = 9.8$ m/s², find the fastest and slowest speeds at which a car can take the curve without sliding. Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: vmax, label: 'Maximum speed', relTolerance: 0.01, units: {'m/s': 1, 'km/h': 0.277777778}}
    - {format: sig4, name: vmin, label: 'Minimum speed', relTolerance: 0.01, units: {'m/s': 1, 'km/h': 0.277777778}}
  solution: |-
    Too fast, the car tends to slide up the bank, so friction $\mu_s n$ points down it:

    $v_{\max} = \sqrt{rg\,\dfrac{\sin\theta + \mu_s\cos\theta}{\cos\theta - \mu_s\sin\theta}} = \sqrt{{r}(9.8)\,\dfrac{\sin {th}^\circ + {mu}\cos {th}^\circ}{\cos {th}^\circ - {mu}\sin {th}^\circ}} =$ **{vmax:sig3} m/s**.

    Too slow, it tends to slide down, so friction points up the bank and the signs of the $\mu_s$ terms flip:

    $v_{\min} = \sqrt{rg\,\dfrac{\sin\theta - \mu_s\cos\theta}{\cos\theta + \mu_s\sin\theta}} =$ **{vmin:sig3} m/s**.
- id: phys-m3-r2-car-pendulum
  title: Pendulum in an accelerating car
  topic: Accelerating frames
  vars:
    acc: {min: 0.5, max: 6, step: 0.1}
    mb: {min: 0.1, max: 1, step: 0.05}
  calc:
    ang: atand(acc/9.8)
    T: mb*sqrt(9.8^2 + acc^2)
  prompt: 'A {mb} kg ball hangs on a string from the roof of a car that accelerates forward at a steady {acc} m/s². Using $g = 9.8$ m/s², find the angle of the string from the vertical (in degrees) and the tension in it. Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: ang, label: 'Angle', relTolerance: 0.01, units: {'°': 1, deg: 1}}
    - {format: sig4, name: T, label: 'Tension', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    In the car's frame the ball is at rest under its weight $mg$ (down), the fictitious force $mA$ (backward) and the tension. So $T\cos\theta = mg$ and $T\sin\theta = mA$.

    Dividing: $\tan\theta = A/g = {acc}/9.8$, so $\theta =$ **{ang:sig3}°**, tilted backward.

    $T = m\sqrt{g^2 + A^2} = {mb}\sqrt{9.8^2 + {acc}^2} =$ **{T:sig3} N**.
- id: phys-m3-r2-space-station
  title: Artificial gravity in a rotating station
  topic: Accelerating frames
  vars:
    r: {min: 30, max: 900, step: 10}
    frac: {choices: [0.38, 0.5, 0.75, 1]}
  calc:
    geff: frac*9.8
    w: sqrt(geff/r)
    P: 2*pi/w
    rpm: 60/P
  prompt: 'A ring-shaped space station of radius {r} m spins so that people standing on the rim feel {frac} times Earth''s gravity ($g = 9.8$ m/s²). Find its angular speed, its rotation period and its rotation rate in rpm. Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: w, label: 'Angular speed', relTolerance: 0.01, units: {'rad/s': 1}}
    - {format: sig4, name: P, label: 'Period', relTolerance: 0.01, units: {s: 1}}
    - {format: sig4, name: rpm, label: 'Rate', relTolerance: 0.01, units: {rpm: 1}}
  solution: |-
    The rim must have centripetal acceleration $\omega^2 r = {frac}(9.8) = {geff:num4}$ m/s², so $\omega = \sqrt{{geff:num4}/{r}} =$ **{w:sig3} rad/s**.

    Period: $2\pi/\omega =$ **{P:sig3} s**. Rate: $60/{P:num4}$ revolutions per minute $=$ **{rpm:sig3} rpm**.
