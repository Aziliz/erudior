# Round 2 drills for phys-m9 (Electric circuits)
- id: phys-m9-r2-rc-snapshot
  title: Capacitor circuit just after and long after
  topic: RC circuits
  vars:
    Ev: {min: 3, max: 24}
    R1: {min: 1, max: 10}
    R2: {min: 1, max: 20}
    C: {min: 1, max: 100}
  calc:
    I0: Ev/R1
    If: Ev/(R1 + R2)
    VC: Ev*R2/(R1 + R2)
    Q: C*VC
  prompt: 'An ideal {Ev} V battery, a switch and a resistor $R_1 = {R1}$ kΩ are in series with a parallel pair: a resistor $R_2 = {R2}$ kΩ and an uncharged {C} μF capacitor. Find the battery current (mA) just after the switch closes, the battery current (mA) long after, and the final charge on the capacitor (μC), to 3 significant figures.'
  answers:
    - {format: sig4, name: I0, label: 'Current just after', relTolerance: 0.01, units: {mA: 1, A: 1000}}
    - {format: sig4, name: If, label: 'Current long after', relTolerance: 0.01, units: {mA: 1, A: 1000}}
    - {format: sig4, name: Q, label: 'Final charge', relTolerance: 0.01, units: {'μC': 1, uC: 1, C: 1000000}}
  solution: |-
    Just after: the uncharged capacitor acts as a wire and shorts out $R_2$, so $I = \dfrac{{Ev}\text{ V}}{{R1}\text{ k}\Omega} =$ **{I0:sig3} mA**.

    Long after: the charged capacitor acts as a break, so $R_1$ and $R_2$ are in series: $I = \dfrac{{Ev}}{{R1} + {R2}} =$ **{If:sig3} mA**.

    The capacitor has the same voltage as $R_2$: $V_C = I R_2 = {VC:sig3}$ V, so $Q = CV_C = ({C}\ \mu\text{F})({VC:sig3}\text{ V}) =$ **{Q:sig3} μC**.
- id: phys-m9-r2-bridge
  title: Balanced Wheatstone bridge
  topic: Bridge circuits
  vars:
    R1: {choices: [100, 200, 250, 500, 1000]}
    R2: {min: 50, max: 2000, step: 10}
    R3: {min: 10, max: 999, step: 1}
  calc:
    Rx: R2*R3/R1
  prompt: 'In a Wheatstone bridge, $R_1 = {R1}$ Ω and $R_2 = {R2}$ Ω form one side, and the adjustable $R_3$ and the unknown $R_x$ form the other ($R_1$ and $R_3$ meet at the top corner). The galvanometer reads zero when $R_3 = {R3}$ Ω. Find $R_x$ in ohms, to 3 significant figures.'
  answers:
    - {format: sig4, name: Rx, label: '$R_x =$', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1, 'kΩ': 1000}}
  solution: |-
    At balance P and Q are at the same potential, so both sides divide the voltage in the same ratio: $\dfrac{R_1}{R_2} = \dfrac{R_3}{R_x}$.

    $R_x = \dfrac{R_2R_3}{R_1} = \dfrac{({R2})({R3})}{{R1}} =$ **{Rx:sig3} Ω**.
- id: phys-m9-r2-thevenin
  title: Thévenin equivalent of a loaded divider
  topic: Equivalent circuits
  vars:
    Ev: {min: 3, max: 30}
    R1: {min: 1, max: 20}
    R2: {min: 1, max: 20}
    RL: {min: 1, max: 50}
  calc:
    Vth: Ev*R2/(R1 + R2)
    Rth: R1*R2/(R1 + R2)
    IL: Vth/(Rth + RL)
    VL: IL*RL
  prompt: 'An ideal {Ev} V battery drives a voltage divider: $R_1 = {R1}$ kΩ on top and $R_2 = {R2}$ kΩ below, with terminals across $R_2$. Find the Thévenin voltage (V) and resistance (kΩ) at the terminals, and the voltage (V) across a {RL} kΩ load connected to them. Give 3 significant figures.'
  answers:
    - {format: sig4, name: Vth, label: '$V_{\text{th}}$', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: Rth, label: '$R_{\text{th}}$', relTolerance: 0.01, units: {'kΩ': 1, kohm: 1, 'Ω': 0.001}}
    - {format: sig4, name: VL, label: 'Load voltage', relTolerance: 0.01, units: {V: 1}}
  solution: |-
    Open-circuit voltage (the unloaded divider): $V_{\text{th}} = {Ev}\cdot\dfrac{{R2}}{{R1} + {R2}} =$ **{Vth:sig3} V**.

    Replace the battery with a wire: $R_1$ and $R_2$ are then in parallel between the terminals, $R_{\text{th}} = \dfrac{({R1})({R2})}{{R1} + {R2}} =$ **{Rth:sig3} kΩ**.

    With the load: $I = \dfrac{V_{\text{th}}}{R_{\text{th}} + R_L} = {IL:sig3}$ mA, so $V_L = IR_L =$ **{VL:sig3} V**.
- id: phys-m9-r2-loading
  title: Voltmeter loading error
  topic: Equivalent circuits
  vars:
    Ev: {min: 5, max: 30}
    R1: {choices: [0.1, 0.22, 0.47, 1, 2.2, 4.7]}
    R2: {choices: [0.1, 0.22, 0.47, 1, 2.2, 4.7]}
    RV: {choices: [1, 10, 20]}
  calc:
    Vtrue: Ev*R2/(R1 + R2)
    Rth: R1*R2/(R1 + R2)
    Vread: Vtrue*RV/(RV + Rth)
    err: 100*(Vtrue - Vread)/Vtrue
  where: ['err > 2']
  prompt: 'Resistors $R_1 = {R1}$ MΩ and $R_2 = {R2}$ MΩ are in series across an ideal {Ev} V battery. A voltmeter with resistance {RV} MΩ is connected across $R_2$. Find the true voltage across $R_2$ with no meter attached (V), the meter''s reading (V), and the percentage by which the reading is low. Give 3 significant figures.'
  answers:
    - {format: sig4, name: Vtrue, label: 'True voltage', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: Vread, label: 'Reading', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: err, label: 'Percent low', relTolerance: 0.01, units: {'%': 1}}
  solution: |-
    True (open-circuit) voltage: $V_{\text{th}} = {Ev}\cdot\dfrac{{R2}}{{R1} + {R2}} =$ **{Vtrue:sig3} V**.

    Thévenin resistance seen by the meter: $R_{\text{th}} = \dfrac{({R1})({R2})}{{R1} + {R2}} = {Rth:sig3}$ MΩ.

    Reading: $V_{\text{th}}\dfrac{R_V}{R_V + R_{\text{th}}} = {Vtrue:sig3}\cdot\dfrac{{RV}}{{RV} + {Rth:sig3}} =$ **{Vread:sig3} V**, which is **{err:sig3}%** low.
- id: phys-m9-r2-drude
  title: Mean free time and drift speed (Drude model)
  topic: Conduction models
  vars:
    mat: {choices: [{label: 'copper (n = 8.5 × 10²⁸ m⁻³, ρ = 1.7 × 10⁻⁸ Ω·m)', value: 1}, {label: 'silver (n = 5.86 × 10²⁸ m⁻³, ρ = 1.59 × 10⁻⁸ Ω·m)', value: 2}, {label: 'gold (n = 5.90 × 10²⁸ m⁻³, ρ = 2.44 × 10⁻⁸ Ω·m)', value: 3}, {label: 'aluminum (n = 18.1 × 10²⁸ m⁻³, ρ = 2.65 × 10⁻⁸ Ω·m)', value: 4}]}
    Ef: {min: 0.01, max: 0.5, step: 0.01}
  calc:
    nn: if(mat == 1, 8.5e28, if(mat == 2, 5.86e28, if(mat == 3, 5.90e28, 18.1e28)))
    rho: if(mat == 1, 1.7e-8, if(mat == 2, 1.59e-8, if(mat == 3, 2.44e-8, 2.65e-8)))
    tauf: 9.109e-31/(nn*(1.602e-19)^2*rho)*1e15
    vd: Ef/(nn*1.602e-19*rho)*1000
  prompt: 'For {mat}, use the Drude model to find the mean free time (in femtoseconds, 1 fs = 10⁻¹⁵ s) and the drift speed (in mm/s) when the field inside the metal is {Ef} V/m. Take $m = 9.109\times10^{-31}$ kg and $e = 1.602\times10^{-19}$ C. Give 3 significant figures.'
  answers:
    - {format: sig4, name: tauf, label: 'Mean free time', relTolerance: 0.01, units: {fs: 1, s: 1e15}}
    - {format: sig4, name: vd, label: 'Drift speed', relTolerance: 0.01, units: {mm/s: 1, m/s: 1000}}
  solution: |-
    $\tau = \dfrac{m}{ne^2\rho}$ with $n = {nn:texsci}$ m⁻³ and $\rho = {rho:texsci}$ Ω·m gives **{tauf:sig3} fs**.

    Drift: $v_d = \dfrac{eE\tau}{m} = \dfrac{E}{ne\rho} =$ **{vd:sig3} mm/s**.
- id: phys-m9-r2-thermometer
  title: Platinum resistance thermometer
  topic: Conduction models
  vars:
    T1: {min: -50, max: 400, step: 5}
    T2: {min: 10, max: 500, step: 5}
  calc:
    R1: 100*(1 + 0.00385*T1)
    R2: round(100*(1 + 0.00385*T2), 2)
    T2c: (R2/100 - 1)/0.00385
  where: ['T1 != 0']
  prompt: 'A platinum thermometer has $R_0 = 100.0$ Ω at 0 °C and $\alpha = 3.85\times10^{-3}$ per °C. (a) What is its resistance at {T1} °C (3 significant figures)? (b) It later reads {R2:dp2} Ω. What is the temperature, to the nearest degree?'
  answers:
    - {format: sig4, name: R1, label: '(a) Resistance', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
    - {format: integer, name: T2c, label: '(b) Temperature', tolerance: 0.6, units: {'°C': 1, C: 1}}
  solution: |-
    (a) $R = R_0(1 + \alpha T) = 100.0[1 + (3.85\times10^{-3})({T1})] =$ **{R1:sig3} Ω**.

    (b) $T = \dfrac{R/R_0 - 1}{\alpha} = \dfrac{{R2:dp2}/100.0 - 1}{3.85\times10^{-3}} =$ **{T2c:int} °C**.
- id: phys-m9-r2-doped
  title: Resistivity of doped silicon
  topic: Semiconductors
  vars:
    Nd: {min: 1, max: 99, step: 1}
    pw: {choices: [21, 22]}
    mu: {choices: [0.05, 0.08, 0.10, 0.12, 0.14]}
    Lmm: {min: 2, max: 20}
  calc:
    nd: Nd*10^pw
    sig: nd*1.602e-19*mu
    rho: 1/sig
    R: rho*Lmm*1e-3/1e-6
  prompt: 'Silicon is doped with ${Nd}\times10^{{pw}}$ donor atoms per m³, each freeing one electron; take the electron mobility as {mu} m²/(V·s) and ignore the few carriers of pure silicon. Find the resistivity (Ω·m) and the resistance (Ω) of a bar {Lmm} mm long with a 1.0 mm² cross-section. Give 3 significant figures.'
  answers:
    - {format: sig4, name: rho, label: 'Resistivity', relTolerance: 0.01, units: {'Ω·m': 1, 'ohm m': 1}}
    - {format: sig4, name: R, label: 'Resistance', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1, 'kΩ': 1000}}
  solution: |-
    $\sigma = ne\mu = ({Nd}\times10^{{pw}})(1.602\times10^{-19})({mu}) = {sig:sig3}$ (Ω·m)⁻¹, so $\rho = 1/\sigma =$ **{rho:sig3} Ω·m**.

    $R = \rho\dfrac{L}{A} = {rho:sig3}\times\dfrac{{Lmm}\times10^{-3}}{1.0\times10^{-6}} =$ **{R:sig3} Ω**.
