# Round 2, module phys-m11 (Light and optics): drills for the honors lessons
# phys-m11-h-polarization (brewster, waveplate) and phys-m11-h-interferometry (air-wedge, michelson, gas-index).
- id: phys-m11-r2-brewster
  title: Brewster's angle
  topic: Polarization by reflection and scattering
  vars:
    m1: {choices: [{label: air, value: 1.00}, {label: water, value: 1.33}]}
    m2: {choices: [{label: 'acrylic (n = 1.49)', value: 1.49}, {label: 'crown glass (n = 1.52)', value: 1.52}, {label: 'flint glass (n = 1.66)', value: 1.66}, {label: 'diamond (n = 2.42)', value: 2.42}]}
  calc:
    tb: atand(m2/m1)
    tr: 90 - tb
  prompt: 'Light in {m1} (n = {m1:num2}) reflects from a flat surface of {m2}. At what angle of incidence is the reflected light completely polarized, and what is the angle of refraction at that angle of incidence? Give both to the nearest 0.1°.'
  answers:
    - {format: num1, name: tb, label: 'Brewster''s angle', tolerance: 0.2, units: {'°': 1, deg: 1}}
    - {format: num1, name: tr, label: 'Refraction angle', tolerance: 0.2, units: {'°': 1, deg: 1}}
  solution: |-
    At Brewster's angle $\tan\theta_B = \dfrac{n_2}{n_1} = \dfrac{{m2:num2}}{{m1:num2}}$, so $\theta_B =$ **{tb:num1}°**.

    There the reflected and refracted rays are perpendicular, so the refraction angle is $90^\circ - \theta_B =$ **{tr:num1}°**. (Check with Snell's law: ${m1:num2}\sin\theta_B = {m2:num2}\sin\theta_2$ gives the same angle.)
- id: phys-m11-r2-waveplate
  title: Thickness of a wave plate
  topic: Birefringence
  vars:
    mat: {choices: [{label: 'quartz, $|n_e - n_o| = 0.0091$', value: 0.0091}, {label: 'calcite, $|n_e - n_o| = 0.172$', value: 0.172}, {label: 'magnesium fluoride, $|n_e - n_o| = 0.0118$', value: 0.0118}]}
    kind: {choices: [{label: quarter-wave, value: 4}, {label: half-wave, value: 2}]}
    lam: {min: 400, max: 700, step: 1}
  calc:
    k: kind
    t: lam/(k*mat)/1000
  prompt: 'A {kind} plate for light of vacuum wavelength {lam} nm is cut from {mat}. What is its thinnest possible thickness, in micrometers to 3 significant figures?'
  answers:
    - {format: sig3, name: t, label: 'Thickness', relTolerance: 0.01, units: {'μm': 1, um: 1, nm: 0.001, mm: 1000}}
  solution: |-
    A {kind} plate delays one polarization by $\lambda/{k}$ relative to the other, and a thickness $t$ gives a path difference $t\,|n_e - n_o|$. So

    $t = \dfrac{\lambda}{{k}\,|n_e - n_o|} = \dfrac{{lam}\text{ nm}}{{k}({mat:num4})} =$ **{t:sig3} μm**.
- id: phys-m11-r2-air-wedge
  title: Thickness from air-wedge fringes
  topic: Air wedges and Newton's rings
  vars:
    lam: {choices: [{label: '546.1 nm (mercury green)', value: 546.1}, {label: '589.0 nm (sodium yellow)', value: 589.0}, {label: '632.8 nm (helium-neon red)', value: 632.8}]}
    Lc: {min: 4.0, max: 12.0, step: 0.5}
    dx: {min: 0.20, max: 1.50, step: 0.05}
  calc:
    D: lam*1e-9*(Lc/100)/(2*dx/1000)*1e6
  prompt: 'Two flat glass plates touch along one edge and are held apart by a thin wire {Lc:num1} cm from that edge. Light of wavelength {lam} shines straight down, and the dark fringes seen in reflection are {dx:num2} mm apart. How thick is the wire, in micrometers to 3 significant figures?'
  answers:
    - {format: sig3, name: D, label: 'Thickness', relTolerance: 0.01, units: {'μm': 1, um: 1, mm: 1000, m: 1e6}}
  solution: |-
    Neighboring dark fringes are where the air gap differs by $\lambda/2$, so the fringe spacing is $\Delta x = \dfrac{\lambda L}{2D}$. Solve for $D$:

    $D = \dfrac{\lambda L}{2\Delta x} = \dfrac{({lam:num1}\times10^{-9}\text{ m})({Lc:num1}\times10^{-2}\text{ m})}{2({dx:num2}\times10^{-3}\text{ m})} =$ **{D:sig3} μm**.
- id: phys-m11-r2-michelson
  title: Wavelength from a Michelson interferometer
  topic: Interferometers
  vars:
    dd: {min: 0.050, max: 0.500, step: 0.001}
    N: {min: 150, max: 1800}
  calc:
    lam: 2*dd*1e6/N
  where: ['lam >= 400', 'lam <= 700']
  prompt: 'The movable mirror of a Michelson interferometer is moved {dd:dp3} mm, and {N} bright fringes pass the detector. What is the wavelength of the light, in nanometers to 3 significant figures?'
  answers:
    - {format: sig3, name: lam, label: 'Wavelength', relTolerance: 0.01, units: {nm: 1, m: 1e9, 'μm': 1000, um: 1000}}
  solution: |-
    Moving the mirror by $\Delta d$ changes the path difference by $2\Delta d$ (the light goes out and back), and each wavelength of path change moves the pattern by one fringe: $N = \dfrac{2\Delta d}{\lambda}$. So

    $\lambda = \dfrac{2\Delta d}{\,N} = \dfrac{2({dd:dp3}\times10^{-3}\text{ m})}{{N}} =$ **{lam:sig3} nm**.
- id: phys-m11-r2-gas-index
  title: Index of a gas from fringe counting
  topic: Interferometers
  vars:
    Lc: {choices: [2.00, 3.00, 4.00, 5.00, 8.00, 10.00]}
    lam: {choices: [{label: '632.8 nm', value: 632.8}, {label: '589.0 nm', value: 589.0}, {label: '546.1 nm', value: 546.1}]}
    N: {min: 8, max: 150}
  calc:
    nm1: N*lam*1e-9/(2*Lc/100)
  where: ['nm1 < 1.5e-3']
  prompt: 'An evacuated glass cell with an inside length of {Lc:num2} cm sits in one arm of a Michelson interferometer lit with {lam} light. As a gas slowly fills the cell, {N} fringes pass the detector. Find $n - 1$ for the gas, to 3 significant figures (for example, 2.72e-4).'
  answers:
    - {format: sci, name: nm1, label: '$n - 1 =$', relTolerance: 0.01}
  solution: |-
    The light crosses the cell twice, and the gas adds $2L(n - 1)/\lambda$ wavelengths to that path, so $N = \dfrac{2L(n - 1)}{\lambda}$:

    $n - 1 = \dfrac{N\lambda}{2L} = \dfrac{{N}({lam:num1}\times10^{-9}\text{ m})}{2({Lc:num2}\times10^{-2}\text{ m})} = \mathbf{{nm1:texsci}}$.
