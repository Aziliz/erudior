# Round 2 drills for module phys-m2 (Kinematics), used by the honors lessons.
- id: phys-m2-r2-chase
  title: Police car catching a speeder
  topic: Chase problems
  vars:
    u: {min: 20, max: 35}
    acc: {min: 2.0, max: 4.0, step: 0.5}
    td: {min: 0.5, max: 3.0, step: 0.5}
  calc:
    head: u*td
    t: (u + sqrt(u^2 + 2*acc*head)) / acc
    d: acc*t^2/2
    vp: acc*t
  prompt: 'A car speeding at a steady {u} m/s passes a parked police car. {td} s later the police car starts from rest with constant acceleration {acc} m/s² (assume it can keep accelerating). How long after it starts does it catch the speeder, and how far from its starting point? Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: t, label: 'Time', relTolerance: 0.01, units: {s: 1}}
    - {format: sig4, name: d, label: 'Distance', relTolerance: 0.01, units: {m: 1}}
  solution: |-
    Start the clock when the police car starts. The speeder's head start is ${u} \times {td} = {head:num1}$ m, so $x_S = {head:num1} + {u}t$ and $x_P = \tfrac12({acc})t^2$.

    Setting them equal: $\tfrac12({acc})t^2 - {u}t - {head:num1} = 0$. The positive root is $t = \dfrac{ {u} + \sqrt{ {u}^2 + 2({acc})({head:num1})} }{ {acc} } =$ **{t:sig3} s**.

    Distance: $\tfrac12({acc})({t:sig4})^2 =$ **{d:sig3} m**. (The police car is then doing {vp:sig3} m/s.)
- id: phys-m2-r2-stopping-distance
  title: Reaction and braking distance
  topic: Stopping distance
  vars:
    kmh: {min: 30, max: 120, step: 10}
    tr: {min: 0.8, max: 2.0, step: 0.1}
    dec: {min: 4.0, max: 8.0, step: 0.5}
  calc:
    v: kmh/3.6
    dr: v*tr
    db: v^2/(2*dec)
    d: dr + db
  prompt: 'A driver traveling at {kmh} km/h sees a hazard. Her reaction time is {tr} s, and then the car brakes at a constant {dec} m/s². Find the reaction distance and the total stopping distance, each to 3 significant figures.'
  answers:
    - {format: sig4, name: dr, label: 'Reaction distance', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: d, label: 'Stopping distance', relTolerance: 0.01, units: {m: 1}}
  solution: |-
    Convert: $v = {kmh}/3.6 = {v:sig4}$ m/s.

    Reaction distance: $v t_r = {v:sig4} \times {tr} =$ **{dr:sig3} m**.

    Braking distance: $\dfrac{v^2}{2a} = \dfrac{ {v:sig4}^2 }{2({dec})} = {db:sig3}$ m, so the stopping distance is **{d:sig3} m**.
- id: phys-m2-r2-tailgate
  title: Braking needed to avoid a slower vehicle
  topic: Chase problems
  vars:
    v1: {min: 20, max: 35}
    v2: {min: 8, max: 18}
    gap: {min: 20, max: 60, step: 5}
    tr: {min: 0.3, max: 1.0, step: 0.1}
  where: ['v1 - v2 >= 5', 'gap - (v1 - v2)*tr >= 8', '(v1 - v2)^2/(2*(gap - (v1 - v2)*tr)) <= 10']
  calc:
    dv: v1 - v2
    left: gap - dv*tr
    amin: dv^2/(2*left)
  prompt: 'A car at {v1} m/s is {gap} m behind a truck moving at a steady {v2} m/s in the same lane. After a reaction time of {tr} s, the driver brakes. What is the smallest constant deceleration that avoids hitting the truck? Give the answer to 3 significant figures.'
  answers:
    - {format: sig4, name: amin, label: 'Deceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
  solution: |-
    Work in the truck's frame: the car approaches at ${v1} - {v2} = {dv}$ m/s, and its acceleration is the same as in the ground frame.

    During the reaction time there is no braking, so the gap shrinks by ${dv} \times {tr}$ m, leaving ${gap} - {dv}({tr}) = {left:num2}$ m.

    The car must lose its {dv} m/s of relative speed within that distance: $a = \dfrac{ {dv}^2 }{2({left:num2})} =$ **{amin:sig3} m/s²**.
- id: phys-m2-r2-aim-angles
  title: Two launch angles that hit a target
  topic: Aiming projectiles
  vars:
    v0: {min: 15, max: 30}
    tx: {min: 10, max: 40, step: 5}
    ty: {min: 0, max: 15}
  where: ['tx^2 - 4*(9.8*tx^2/(2*v0^2))*(ty + 9.8*tx^2/(2*v0^2)) > 0.05*tx^2']
  calc:
    A: 9.8*tx^2/(2*v0^2)
    disc: tx^2 - 4*A*(ty + A)
    ulo: (tx - sqrt(disc))/(2*A)
    uhi: (tx + sqrt(disc))/(2*A)
    lo: atand(ulo)
    hi: atand(uhi)
  prompt: 'A ball is launched at {v0} m/s toward a target {tx} m away horizontally and {ty} m above the launch point. Using $g = 9.8$ m/s² and ignoring air resistance, find the two launch angles above the horizontal that hit the target, each to the nearest 0.1°.'
  answers:
    - {format: num1, name: lo, label: 'Low angle', tolerance: 0.15, units: {'°': 1, deg: 1}}
    - {format: num1, name: hi, label: 'High angle', tolerance: 0.15, units: {'°': 1, deg: 1}}
  solution: |-
    With $u = \tan\theta$ and $A = \dfrac{9.8({tx})^2}{2({v0})^2} = {A:num4}$ m, the path gives $Au^2 - {tx}u + ({ty} + A) = 0$.

    Discriminant: ${tx}^2 - 4A({ty} + A) = {disc:num2} > 0$, so two angles work: $u = \dfrac{ {tx} \pm \sqrt{ {disc:num2} } }{2A} = {ulo:num4}$ or ${uhi:num4}$.

    $\theta = \tan^{-1}u$: **{lo:num1}°** and **{hi:num1}°**.
- id: phys-m2-r2-cliff-range
  title: Farthest throw from a cliff
  topic: Aiming projectiles
  vars:
    v0: {min: 10, max: 30}
    h: {min: 5, max: 60, step: 5}
  calc:
    root: sqrt(v0^2 + 2*9.8*h)
    X: v0*root/9.8
    th: atand(v0/root)
  prompt: 'A stone is thrown at {v0} m/s from the top of a cliff {h} m high. Using $g = 9.8$ m/s² and ignoring air resistance, what is the greatest distance from the base of the cliff at which it can land (3 significant figures), and at what angle above the horizontal must it be thrown (nearest 0.1°)?'
  answers:
    - {format: sig4, name: X, label: 'Greatest distance', relTolerance: 0.01, units: {m: 1}}
    - {format: num1, name: th, label: 'Angle', tolerance: 0.15, units: {'°': 1, deg: 1}}
  solution: |-
    The farthest landing point lies on the safety parabola at $y = -{h}$ m: $x = \dfrac{v_0}{g}\sqrt{v_0^2 + 2gh} = \dfrac{ {v0} }{9.8}\sqrt{ {v0}^2 + 2(9.8)({h}) } =$ **{X:sig3} m**.

    The angle: $\tan\theta = \dfrac{v_0}{\sqrt{v_0^2 + 2gh}} = \dfrac{ {v0} }{ {root:num2} }$, so $\theta =$ **{th:num1}°**, below $45^\circ$ as expected from a height.
- id: phys-m2-r2-incline-range
  title: Range along a slope
  topic: Aiming projectiles
  vars:
    v0: {min: 10, max: 25}
    th: {min: 30, max: 75, step: 5}
    al: {min: 5, max: 25, step: 5}
  where: ['th >= al + 15']
  calc:
    x: 2*v0^2*cosd(th)^2*(tand(th) - tand(al))/9.8
    d: x/cosd(al)
    best: 45 + al/2
    dmax: v0^2/(9.8*(1 + sind(al)))
  prompt: 'A ball is launched at {v0} m/s, {th}° above the horizontal, from a point on a hill that rises at {al}°. Using $g = 9.8$ m/s² and ignoring air resistance, how far up the slope (measured along it) does it land, and what is the greatest distance along the slope possible at this speed? Give both to 3 significant figures.'
  answers:
    - {format: sig4, name: d, label: 'Distance along slope', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: dmax, label: 'Greatest distance', relTolerance: 0.01, units: {m: 1}}
  solution: |-
    Horizontal distance to the landing point: $x = \dfrac{2v_0^2\cos^2\theta(\tan\theta - \tan\alpha)}{g} = {x:sig4}$ m, so along the slope $d = x/\cos {al}^\circ =$ **{d:sig3} m**.

    The best launch is $45^\circ + \alpha/2 = {best}^\circ$, giving $d_{\max} = \dfrac{v_0^2}{g(1 + \sin\alpha)} = \dfrac{ {v0}^2 }{9.8(1 + \sin {al}^\circ)} =$ **{dmax:sig3} m**.
- id: phys-m2-r2-odd-rule
  title: The odd-number rule
  topic: Free-fall experiments
  vars:
    d1: {min: 1.0, max: 5.0, step: 0.5}
    n: {min: 3, max: 7}
  calc:
    k: 2*n - 1
    dn: d1*(2*n - 1)
    tot: d1*n^2
  prompt: 'A ball released from rest rolls down a ramp with constant acceleration. Its position is marked at equal time intervals, and it rolls {d1} cm during the first interval. How far does it roll during interval number {n}, and how far has it rolled in total by the end of that interval? Give exact values in cm.'
  answers:
    - {format: num1, name: dn, label: 'Distance in that interval', tolerance: 0.01, units: {cm: 1}}
    - {format: num1, name: tot, label: 'Total distance', tolerance: 0.01, units: {cm: 1}}
  solution: |-
    The intervals cover $1 : 3 : 5 : \dots$ times the first, and interval {n} covers $(2 \times {n} - 1) = {k}$ times it: ${d1} \times {k} =$ **{dn:num1} cm**.

    The total grows as $n^2$: ${d1} \times {n}^2 =$ **{tot:num1} cm**.
- id: phys-m2-r2-g-from-slope
  title: Finding g from a height–time-squared graph
  topic: Free-fall experiments
  vars:
    gt: {min: 9.70, max: 9.90, step: 0.01}
    h1: {min: 0.20, max: 0.50, step: 0.05}
    h2: {min: 0.90, max: 1.60, step: 0.10}
  calc:
    t1: round(sqrt(2*h1/gt), 3)
    t2: round(sqrt(2*h2/gt), 3)
    s1: t1^2
    s2: t2^2
    slope: (h2 - h1)/(t2^2 - t1^2)
    gm: 2*slope
  prompt: 'A ball dropped from rest takes {t1} s to fall {h1} m and {t2} s to fall {h2} m. Using these two points on a graph of height against time squared, find the slope and the value of $g$ it gives, each to 3 significant figures.'
  answers:
    - {format: sig4, name: slope, label: 'Slope', relTolerance: 0.006, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: gm, label: '$g$', relTolerance: 0.006, units: {'m/s²': 1, 'm/s^2': 1}}
  solution: |-
    Square the times: ${t1}^2 = {s1:num4}$ s² and ${t2}^2 = {s2:num4}$ s².

    Slope $= \dfrac{ {h2} - {h1} }{ {s2:num4} - {s1:num4} } =$ **{slope:sig3} m/s²**.

    Since $h = \tfrac12 gt^2$, the slope is $g/2$, so $g =$ **{gm:sig3} m/s²**.
- id: phys-m2-r2-reaction-ruler
  title: Reaction time from a dropped ruler
  topic: Free-fall experiments
  vars:
    dcm: {min: 5, max: 30}
  calc:
    t: sqrt(2*(dcm/100)/9.8)
  prompt: 'You catch a dropped ruler after it has fallen {dcm} cm. Using $g = 9.8$ m/s², what is your reaction time, to 3 significant figures?'
  answers:
    - {format: sig4, name: t, label: 'Reaction time', relTolerance: 0.01, units: {s: 1, ms: 0.001}}
  solution: |-
    The ruler falls freely from rest: $d = \tfrac12gt^2$, so $t = \sqrt{2d/g} = \sqrt{2({dcm}/100)/9.8} =$ **{t:sig3} s**.
