- id: phys-m6-r2-damped-decay
  title: Decay of a lightly damped oscillator
  topic: Damped oscillations
  vars:
    m: {min: 0.2, max: 2, step: 0.1}
    k: {min: 20, max: 500, step: 10}
    b: {min: 0.05, max: 1.5, step: 0.05}
  where: ['sqrt(m*k)/b >= 3']
  calc:
    w0: sqrt(k/m)
    Q: sqrt(m*k)/b
    th: 2*m*ln(2)/b
    T0: 2*pi/w0
    ncyc: th/T0
  prompt: 'A {m} kg block on a spring with $k = {k:dp0}$ N/m is damped by a force $-bv$ with $b = {b:dp2}$ kg/s. Find the quality factor $Q$, the time for the amplitude to fall to half, and how many oscillations that takes. Give each to 3 significant figures (treat the period as the undamped period).'
  answers:
    - {format: sig4, name: Q, label: '$Q =$', relTolerance: 0.01}
    - {format: sig4, name: th, label: 'Half-amplitude time', relTolerance: 0.01, units: {s: 1, ms: 0.001}}
    - {format: sig4, name: ncyc, label: 'Oscillations', relTolerance: 0.01}
  solution: |-
    $\omega_0 = \sqrt{k/m} = {w0:num4}$ rad/s, so $Q = \dfrac{m\omega_0}{\,b} = \dfrac{\sqrt{mk}}{\,b} =$ **{Q:sig3}**.

    The amplitude goes as $e^{-bt/(2m)}$; setting it to $\tfrac12$ gives $t_{1/2} = \dfrac{2m\ln 2}{\,b} = \dfrac{2({m})(0.6931)}{{b:dp2}} =$ **{th:sig3} s**.

    The period is $2\pi/\omega_0 = {T0:num4}$ s, so that's $t_{1/2}/T =$ **{ncyc:sig3}** oscillations.
- id: phys-m6-r2-driven-amplitude
  title: Amplitude of a driven, damped oscillator
  topic: Driven oscillations
  vars:
    m: {min: 0.2, max: 2, step: 0.1}
    wn: {min: 5, max: 30}
    b: {min: 0.1, max: 2, step: 0.1}
    F0: {min: 0.5, max: 5, step: 0.5}
    r: {choices: [0.5, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 2]}
  where: ['m*wn/b >= 2', 'abs(r*wn - round(r*wn)) < 0.001']
  calc:
    k: m*wn^2
    w: r*wn
    Q: m*wn/b
    stat: F0/k*1000
    A: (F0/m)/sqrt((wn^2 - w^2)^2 + (b*w/m)^2)*1000
  prompt: 'A {m} kg mass on a spring with $k = {k:num1}$ N/m has damping constant $b = {b:num1}$ kg/s. It is driven by a force $F_0\cos(\omega t)$ with $F_0 = {F0:num1}$ N and $\omega = {w:dp0}$ rad/s. Find the static stretch $F_0/k$ and the steady-state amplitude, both in mm to 3 significant figures.'
  answers:
    - {format: sig4, name: stat, label: 'Static stretch', relTolerance: 0.01, units: {mm: 1, cm: 10, m: 1000}}
    - {format: sig4, name: A, label: 'Amplitude', relTolerance: 0.01, units: {mm: 1, cm: 10, m: 1000}}
  solution: |-
    $\omega_0 = \sqrt{k/m} = {wn}$ rad/s and $Q = m\omega_0/b = {Q:num2}$. The static stretch is $F_0/k =$ **{stat:sig3} mm**.

    $A = \dfrac{F_0/m}{\sqrt{(\omega_0^2 - \omega^2)^2 + (b\omega/m)^2}}$ with $\omega_0^2 - \omega^2 = {wn}^2 - {w:dp0}^2$ gives **{A:sig3} mm**. (At $\omega = \omega_0$ this is $Q$ times the static stretch.)
- id: phys-m6-r2-critical-damping
  title: Critical damping
  topic: Damped oscillations
  vars:
    m: {min: 100, max: 2000, step: 50}
    kk: {min: 5, max: 100}
    frac: {min: 0.1, max: 0.9, step: 0.05}
  calc:
    k: kk*1000
    w0: sqrt(k/m)
    f0: w0/(2*pi)
    bc: 2*sqrt(m*k)
    bact: frac*bc
    Q: sqrt(m*k)/bact
  prompt: 'A machine of mass {m:dp0} kg sits on mounts with total spring constant $k = {kk:dp0}\,000$ N/m. Find its natural frequency $f_0$ (Hz) and the damping constant (kg/s) that would make it critically damped, to 3 significant figures.'
  answers:
    - {format: sig4, name: f0, label: '$f_0$', relTolerance: 0.01, units: {Hz: 1}}
    - {format: sig4, name: bc, label: 'Critical $b$', relTolerance: 0.01, units: {'kg/s': 1, 'N*s/m': 1}}
  solution: |-
    $\omega_0 = \sqrt{k/m} = {w0:num4}$ rad/s, so $f_0 = \omega_0/2\pi =$ **{f0:sig3} Hz**.

    $b_c = 2\sqrt{mk} = 2m\omega_0 =$ **{bc:sig3} kg/s**. (With, say, $b = {frac:num2}\,b_c$ instead, $Q = \sqrt{mk}/b = {Q:num2}$: underdamped, so it would overshoot before settling.)
- id: phys-m6-r2-equal-temperament
  title: Equal-tempered note frequencies
  topic: Musical acoustics
  vars:
    n: {min: 1, max: 24}
    dir: {choices: [{label: above, value: 1}, {label: below, value: -1}]}
  calc:
    ex: dir*n
    freq: 440*2^(dir*n/12)
    ratio: 2^(dir*n/12)
  prompt: 'In equal temperament with A4 = 440 Hz, what is the frequency of the note {n} semitones {dir} A4? Give it in Hz to the nearest 0.1 Hz.'
  answers:
    - {format: num1, name: freq, label: 'Frequency', tolerance: 0.06, units: {Hz: 1}}
  solution: |-
    Each semitone multiplies the frequency by $2^{1/12}$, so $f = 440 \cdot 2^{\pm n/12}$ with the minus sign for notes below.

    $2^{{ex}/12} = {ratio:num4}$, so $f = 440 \times {ratio:num4} =$ **{freq:num1} Hz**.
- id: phys-m6-r2-cents
  title: Pitch difference in cents
  topic: Musical acoustics
  vars:
    f1: {min: 200, max: 800}
    d: {min: 1, max: 120}
  where: ['d < f1/3']
  calc:
    f2: f1 + d
    c: 1200*log2(f2/f1)
    semis: c/100
  prompt: 'How many cents higher is a {f2} Hz tone than a {f1} Hz tone? Give the answer to the nearest cent.'
  answers:
    - {format: num1, name: c, label: 'Cents', tolerance: 0.6}
  solution: |-
    cents $= 1200\log_2\dfrac{f_2}{f_1} = 1200\log_2\dfrac{{f2}}{{f1}} = 1200 \times \dfrac{\ln({f2}/{f1})}{\ln 2} =$ **{c:num1} cents**, about {semis:num2} equal-tempered semitones.
- id: phys-m6-r2-harmonic-beats
  title: Beats between harmonics of a mistuned interval
  topic: Musical acoustics
  vars:
    f1: {min: 120, max: 480, step: 12}
    iv: {choices: [{label: 'perfect fifth (3:2)', value: 1}, {label: 'perfect fourth (4:3)', value: 2}, {label: 'major third (5:4)', value: 3}, {label: 'octave (2:1)', value: 4}]}
    dl: {min: 0.2, max: 2, step: 0.1}
    sg: {choices: [1, -1]}
  calc:
    a: if(iv == 1, 3, if(iv == 2, 4, if(iv == 3, 5, 2)))
    bb: if(iv == 1, 2, if(iv == 2, 3, if(iv == 3, 4, 1)))
    pure: f1*a/bb
    f2: pure + sg*dl
    h1: a*f1
    h2: bb*f2
    fb: abs(h1 - h2)
  prompt: 'A note of {f1} Hz is played with a second note meant to be a pure {iv} above it, but the second note is actually {f2:num1} Hz. Which harmonics nearly coincide, and at what rate do they beat? Give the beat frequency in Hz to 1 decimal place.'
  answers:
    - {format: num1, name: fb, label: 'Beat frequency', tolerance: 0.06, units: {Hz: 1}}
  solution: |-
    A pure ratio of {a}:{bb} would put the upper note at {pure:num1} Hz, and then harmonic {a} of the lower note equals harmonic {bb} of the upper.

    Harmonic {a} of {f1} Hz: {h1:num1} Hz. Harmonic {bb} of {f2:num1} Hz: {h2:num1} Hz. Beat frequency $= |{h1:num1} - {h2:num1}| =$ **{fb:num1} Hz**.
- id: phys-m6-r2-reflection
  title: Reflection at an acoustic boundary
  topic: Wave reflection
  vars:
    rho1: {min: 900, max: 1100, step: 10}
    v1: {min: 1400, max: 1600, step: 10}
    rho2: {min: 1000, max: 2000, step: 50}
    v2: {min: 1500, max: 4000, step: 100}
  where: ['abs(rho2*v2 - rho1*v1) > 0.1*rho1*v1']
  calc:
    z1: rho1*v1/1e6
    z2: rho2*v2/1e6
    R: ((z2 - z1)/(z2 + z1))^2*100
    T: 100 - R
  prompt: 'Ultrasound passes straight on from a tissue with density {rho1:dp0} kg/m³ and sound speed {v1:dp0} m/s into one with density {rho2:dp0} kg/m³ and sound speed {v2:dp0} m/s. What percentage of the intensity is reflected, and what percentage is transmitted? Give both to 3 significant figures.'
  answers:
    - {format: sig4, name: R, label: 'Reflected (%)', relTolerance: 0.01, units: {'%': 1}}
    - {format: sig4, name: T, label: 'Transmitted (%)', relTolerance: 0.01, units: {'%': 1}}
  solution: |-
    $Z_1 = \rho_1 v_1 = {z1:num4}\times10^6$ and $Z_2 = \rho_2 v_2 = {z2:num4}\times10^6$ kg/(m²·s).

    $R = \left(\dfrac{Z_2 - Z_1}{Z_2 + Z_1}\right)^2 =$ **{R:sig3}%**, and $T = 100\% - R =$ **{T:sig3}%**.
- id: phys-m6-r2-echo-depth
  title: Echo depth and wavelength in ultrasound
  topic: Ultrasound imaging
  vars:
    tus: {min: 10, max: 200}
    fmhz: {min: 2, max: 15, step: 0.5}
  calc:
    dcm: 1540*tus*1e-6/2*100
    lmm: 1540/(fmhz*1e6)*1000
  prompt: 'A {fmhz:num1} MHz ultrasound pulse returns an echo {tus} μs after it was sent. Using $v = 1540$ m/s, find the depth of the reflecting boundary (cm) and the wavelength in tissue (mm), to 3 significant figures.'
  answers:
    - {format: sig4, name: dcm, label: 'Depth', relTolerance: 0.01, units: {cm: 1, mm: 0.1, m: 100}}
    - {format: sig4, name: lmm, label: 'Wavelength', relTolerance: 0.01, units: {mm: 1, m: 1000}}
  solution: |-
    The echo makes a round trip, so $d = \dfrac{vt}{2} = \dfrac{1540 \times {tus}\times10^{-6}}{2} =$ **{dcm:sig3} cm**.

    $\lambda = \dfrac{v}{f} = \dfrac{1540}{{fmhz:num1}\times10^6} =$ **{lmm:sig3} mm**.
- id: phys-m6-r2-doppler-ultrasound
  title: Doppler ultrasound of blood flow
  topic: Ultrasound imaging
  vars:
    fmhz: {min: 2, max: 10, step: 0.5}
    u: {min: 0.1, max: 1.5, step: 0.05}
    th: {min: 0, max: 70, step: 5}
  calc:
    df: 2*fmhz*1e6*u*cosd(th)/1540
  prompt: 'A {fmhz:num1} MHz ultrasound beam makes an angle of {th}° with blood flowing toward the probe at {u:num2} m/s. Using $\Delta f = 2fu\cos\theta/v$ with $v = 1540$ m/s, find the Doppler shift in Hz to 3 significant figures.'
  answers:
    - {format: sig4, name: df, label: '$\Delta f$', relTolerance: 0.01, units: {Hz: 1, kHz: 1000}}
  solution: |-
    $\Delta f = \dfrac{2fu\cos\theta}{v} = \dfrac{2({fmhz:num1}\times10^6)({u:num2})\cos {th}^\circ}{1540} =$ **{df:sig3} Hz**.
