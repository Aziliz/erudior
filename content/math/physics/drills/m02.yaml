- id: phys-avg-velocity
  title: Average velocity and average speed
  topic: Velocity and acceleration
  vars:
    d1: {min: 200, max: 900, step: 10}
    t1: {min: 20, max: 90, step: 5}
    d2: {min: 50, max: 600, step: 10}
    t2: {min: 10, max: 60, step: 5}
  where: ['d2 < d1']
  calc:
    dx: d1 - d2
    tt: t1 + t2
    vavg: (d1 - d2) / (t1 + t2)
    savg: (d1 + d2) / (t1 + t2)
  prompt: 'A jogger runs {d1} m east in {t1} s, then turns and runs {d2} m west in {t2} s. Find her average velocity (east positive) and her average speed for the whole run, each to 3 significant figures.'
  answers:
    - {format: sig4, name: vavg, label: 'Average velocity', relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: savg, label: 'Average speed', relTolerance: 0.01, units: {'m/s': 1}}
  solution: |-
    Displacement: $\Delta x = {d1} - {d2} = {dx}$ m; total time $\Delta t = {t1} + {t2} = {tt}$ s.

    Average velocity $= \dfrac{\Delta x}{\Delta t} =$ **{vavg:sig3} m/s** (east).

    Distance $= {d1} + {d2}$ m, so average speed $=$ **{savg:sig3} m/s**.
- id: phys-vt-graph
  title: Acceleration and displacement from a v–t graph
  topic: Motion graphs
  vars:
    v1: {min: 0, max: 15}
    v2: {min: 0, max: 30}
    dur: {min: 2, max: 12}
  where: ['v2 != v1']
  calc:
    acc: (v2 - v1) / dur
    disp: (v1 + v2) / 2 * dur
  prompt: 'A cart''s velocity–time graph is a straight line from {v1} m/s at $t = 0$ to {v2} m/s at $t = {dur}$ s. Find its acceleration and its displacement over this interval, each to 3 significant figures.'
  answers:
    - {format: sig4, name: acc, label: 'Acceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
    - {format: sig4, name: disp, label: 'Displacement', relTolerance: 0.01, units: {m: 1}}
  figure:
    type: plot
    x: [0, 'dur*1.1']
    y: [0, 'max(v1, v2)*1.2']
    xLabel: 't (s)'
    yLabel: 'v (m/s)'
    functions:
      - {f: 'v1 + (v2 - v1)*x/dur', from: 0, to: 'dur', label: 'v(t)'}
    shade:
      - {f: 'v1 + (v2 - v1)*x/dur', from: 0, to: 'dur'}
  solution: |-
    The acceleration is the slope of the line: $a = \dfrac{\Delta v}{\Delta t} = \dfrac{{v2} - {v1}}{{dur}} =$ **{acc:sig3} m/s²**.

    The displacement is the shaded area, a trapezoid: $\Delta x = \tfrac12({v1} + {v2})({dur}) =$ **{disp:sig3} m**.
- id: phys-stopping
  title: Braking distance and time
  topic: Constant acceleration
  vars:
    v0: {min: 10, max: 35}
    dec: {min: 3, max: 9, step: 0.5}
  calc:
    d: v0^2 / (2*dec)
    t: v0 / dec
  prompt: 'A car moving at {v0} m/s brakes with a constant acceleration of magnitude {dec} m/s². How far does it travel while stopping, and how long does it take? Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: d, label: 'Distance', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: t, label: 'Time', relTolerance: 0.01, units: {s: 1}}
  solution: |-
    With $v = 0$ and $a = -{dec}$ m/s²: $0 = v_0^2 - 2({dec})\Delta x$, so $\Delta x = \dfrac{{v0}^2}{2({dec})} =$ **{d:sig3} m**.

    $0 = {v0} - {dec}\,t$, so $t =$ **{t:sig3} s**.
- id: phys-free-fall
  title: Time and speed of a dropped object
  topic: Free fall
  vars:
    h: {min: 5, max: 120}
  calc:
    t: sqrt(2*h/9.8)
    v: 9.8*t
  prompt: 'A wrench is dropped from rest from a height of {h} m. Ignoring air resistance and using $g = 9.8$ m/s², how long does it fall, and how fast is it moving at the ground? Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: t, label: 'Time', relTolerance: 0.01, units: {s: 1}}
    - {format: sig4, name: v, label: 'Speed', relTolerance: 0.01, units: {'m/s': 1}}
  solution: |-
    $h = \tfrac12 g t^2 \Rightarrow t = \sqrt{2({h})/9.8} =$ **{t:sig3} s**.

    $v = gt = 9.8({t:sig3}) =$ **{v:sig3} m/s** (also $v = \sqrt{2gh}$).
- id: phys-thrown-up
  title: Ball thrown straight up
  topic: Free fall
  vars:
    v0: {min: 5, max: 30}
  calc:
    H: v0^2 / (2*9.8)
    T: 2*v0 / 9.8
  prompt: 'A ball is thrown straight up at {v0} m/s. Using $g = 9.8$ m/s², find its maximum height above the launch point and its total time in the air (until it returns to the launch height), each to 3 significant figures.'
  answers:
    - {format: sig4, name: H, label: 'Max height', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: T, label: 'Time in air', relTolerance: 0.01, units: {s: 1}}
  figure:
    type: plot
    x: [0, 'T*1.05']
    y: [0, 'H*1.2']
    xLabel: 't (s)'
    yLabel: 'y (m)'
    functions:
      - {f: 'v0*x - 4.9*x^2', from: 0, to: 'T', label: 'y(t)'}
  solution: |-
    At the top $v_y = 0$: $0 = {v0}^2 - 2(9.8)H$, so $H =$ **{H:sig3} m**.

    Time up $= {v0}/9.8$ s; time down is the same, so $T = 2({v0})/9.8 =$ **{T:sig3} s**.
- id: phys-proj-horizontal
  title: Horizontal launch from a height
  topic: Projectile motion
  vars:
    h: {min: 1.0, max: 60, step: 0.5}
    v: {min: 2, max: 25}
  calc:
    t: sqrt(2*h/9.8)
    x: v*t
    vy: 9.8*t
    s: hypot(v, vy)
  prompt: 'A ball leaves the edge of a {h} m high ledge moving horizontally at {v} m/s. Using $g = 9.8$ m/s², how far from the base of the ledge does it land, and what is its speed just before landing? Give answers to 3 significant figures.'
  answers:
    - {format: sig4, name: x, label: 'Distance', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: s, label: 'Impact speed', relTolerance: 0.01, units: {'m/s': 1}}
  figure:
    type: plot
    x: [0, 'x*1.15']
    y: [0, 'h*1.15']
    xLabel: 'x (m)'
    yLabel: 'y (m)'
    functions:
      - {f: 'h - 4.9*(x/v)^2', from: 0, to: 'x', label: 'path'}
    points:
      - {at: [0, 'h'], label: 'launch'}
  solution: |-
    Fall time from the vertical motion: $t = \sqrt{2h/g} = \sqrt{2({h})/9.8} = {t:sig3}$ s.

    Horizontal distance: $x = v t = {v}({t:sig3}) =$ **{x:sig3} m**.

    At impact $v_y = gt = {vy:num2}$ m/s, so speed $= \sqrt{{v}^2 + {vy:num2}^2} =$ **{s:sig3} m/s**.
- id: phys-proj-angle
  title: Range, height and flight time on level ground
  topic: Projectile motion
  vars:
    v0: {min: 10, max: 40}
    th: {min: 15, max: 75, step: 5}
  calc:
    vx: v0*cosd(th)
    vy: v0*sind(th)
    T: 2*vy/9.8
    H: vy^2/(2*9.8)
    R: vx*T
  prompt: 'A ball is launched from level ground at {v0} m/s, {th}° above horizontal. Using $g = 9.8$ m/s², find the time of flight, the maximum height and the range, each to 3 significant figures.'
  answers:
    - {format: sig4, name: T, label: 'Time of flight', relTolerance: 0.01, units: {s: 1}}
    - {format: sig4, name: H, label: 'Max height', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: R, label: 'Range', relTolerance: 0.01, units: {m: 1}}
  figure:
    type: plot
    x: [0, 'R*1.1']
    y: [0, 'max(H*1.3, R*0.2)']
    xLabel: 'x (m)'
    yLabel: 'y (m)'
    functions:
      - {f: 'x*tand(th) - 9.8*x^2/(2*vx^2)', from: 0, to: 'R'}
  solution: |-
    $v_{0x} = {v0}\cos {th}^\circ = {vx:num2}$ m/s, $v_{0y} = {v0}\sin {th}^\circ = {vy:num2}$ m/s.

    $T = 2v_{0y}/g =$ **{T:sig3} s**; $H = v_{0y}^2/(2g) =$ **{H:sig3} m**; $R = v_{0x}T = \dfrac{v_0^2\sin 2\theta}{g} =$ **{R:sig3} m**.
- id: phys-river-crossing
  title: Crossing a river
  topic: Relative motion
  vars:
    w: {min: 40, max: 200, step: 10}
    vs: {min: 1.5, max: 4.0, step: 0.1}
    vc: {min: 0.5, max: 3.0, step: 0.1}
  where: ['vc < vs - 0.3']
  calc:
    t: w / vs
    drift: vc * t
    ang: asind(vc / vs)
  prompt: 'A river {w} m wide flows at {vc} m/s. A boat moves at {vs} m/s relative to the water. (a) Heading straight across, how far downstream does it land? (b) To land directly opposite, how many degrees upstream from straight across must it head? Give the drift to 3 significant figures and the angle to the nearest 0.1°.'
  answers:
    - {format: sig4, name: drift, label: '(a) Drift', relTolerance: 0.01, units: {m: 1}}
    - {format: sig4, name: ang, label: '(b) Angle', tolerance: 0.3, units: {'°': 1, deg: 1}}
  solution: |-
    (a) Crossing time uses only the across component: $t = {w}/{vs} = {t:num2}$ s. Drift $= {vc} \times {t:num2} =$ **{drift:sig3} m**.

    (b) The upstream component must cancel the current: ${vs}\sin\alpha = {vc}$, so $\alpha = \sin^{-1}({vc}/{vs}) =$ **{ang:num1}°**.
- id: phys-plane-wind
  title: Airplane in a crosswind
  topic: Relative motion
  vars:
    va: {min: 150, max: 500, step: 10}
    vw: {min: 20, max: 90, step: 5}
  calc:
    head: asind(vw / va)
    vg: sqrt(va^2 - vw^2)
  prompt: 'A plane with airspeed {va} km/h must fly due north while a wind blows toward the east at {vw} km/h. How many degrees west of north must it head, and what is its ground speed? Give the heading to the nearest 0.1° and the ground speed to 3 significant figures.'
  answers:
    - {format: sig4, name: head, label: 'Heading', tolerance: 0.2, units: {'°': 1, deg: 1}}
    - {format: sig4, name: vg, label: 'Ground speed', relTolerance: 0.005, units: {'km/h': 1}}
  solution: |-
    $\vec v_{PG} = \vec v_{PA} + \vec v_{AG}$. The plane's eastward airspeed component must be $-{vw}$ km/h: ${va}\sin\alpha = {vw}$, so $\alpha =$ **{head:num1}°** west of north.

    Ground speed $= {va}\cos\alpha = \sqrt{{va}^2 - {vw}^2} =$ **{vg:sig3} km/h**.
- id: phys-avg-2d
  title: Average velocity and acceleration in two dimensions
  topic: Two-dimensional motion
  vars:
    px: {min: -90, max: 90, step: 5}
    py: {min: -90, max: 90, step: 5}
    dur: {min: 4, max: 30, step: 2}
    ux: {min: -8, max: 8}
    uy: {min: -8, max: 8}
    wx: {min: -8, max: 8}
    wy: {min: -8, max: 8}
  where: ['px != 0', 'py != 0', 'wx != ux', 'wy != uy']
  calc:
    vav: hypot(px, py) / dur
    dvx: wx - ux
    dvy: wy - uy
    aav: hypot(dvx, dvy) / dur
  prompt: 'A boat starts at the origin and is at ({px} m, {py} m) {dur} s later. Over the same {dur} s its velocity changes from ({ux}, {uy}) m/s to ({wx}, {wy}) m/s. Find the magnitudes of its average velocity and its average acceleration, each to 3 significant figures.'
  answers:
    - {format: sig4, name: vav, label: 'Average velocity', relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: aav, label: 'Average acceleration', relTolerance: 0.01, units: {'m/s²': 1, 'm/s^2': 1}}
  solution: |-
    Displacement $= ({px}, {py})$ m, of magnitude $\sqrt{({px})^2 + ({py})^2}$ m, so $|\vec v_{\text{avg}}| = \dfrac{|\Delta\vec r|}{\Delta t} =$ **{vav:sig3} m/s**.

    $\Delta\vec v = ({wx} - ({ux}),\ {wy} - ({uy})) = ({dvx}, {dvy})$ m/s, so $|\vec a_{\text{avg}}| = \dfrac{\sqrt{({dvx})^2 + ({dvy})^2}}{{dur}} =$ **{aav:sig3} m/s²**. Subtract the velocity vectors component by component; the change in speed alone would miss any change in direction.
