# Round 2, module phys-m12: drills for the honors lessons
# (phys-m12-h-spacetime and phys-m12-h-nuclear-energy).
- id: phys-m12-r2-interval
  title: The spacetime interval and proper time
  topic: Spacetime geometry
  vars:
    dty: {min: 1.0, max: 9.0, step: 0.1}
    dxl: {min: 0.5, max: 8.0, step: 0.1}
  where: ['dty >= dxl + 0.5']
  calc:
    s2: dty^2 - dxl^2
    tau: sqrt(s2)
    beta: dxl/dty
  prompt: 'Event B happens {dty:num1} years after event A and {dxl:num1} light-years away from it. A traveler goes from A to B at constant velocity. Find the interval $(c\,\Delta t)^2 - (\Delta x)^2$ in (light-years)² (to 2 decimal places), the traveler''s speed as a fraction of $c$ (to 3 significant figures), and the time the traveler''s clock measures between the events (years, to 3 significant figures).'
  answers:
    - {name: s2, label: '$(\Delta s)^2 =$', format: num2, tolerance: 0.006}
    - {name: beta, label: '$v/c =$', format: sig3, relTolerance: 0.006}
    - {name: tau, label: 'Traveler''s time', format: sig3, relTolerance: 0.006, units: {yr: 1, years: 1, year: 1}}
  solution: |-
    With $c = 1$ ly/yr: $(\Delta s)^2 = ({dty:num1})^2 - ({dxl:num1})^2 =$ **{s2:num2}** (ly)². It is positive, so the events are timelike-separated and a traveler can get from A to B.

    Speed: $v = \Delta x/\Delta t = {dxl:num1}/{dty:num1} =$ **{beta:sig3}**$c$.

    The traveler is present at both events, so the clock reads the proper time $\Delta s/c = \sqrt{{s2:num2}} =$ **{tau:sig3} yr** (the same as $\Delta t/\gamma$).
- id: phys-m12-r2-simultaneity
  title: Relativity of simultaneity (Lorentz transformation)
  topic: Spacetime geometry
  vars:
    bet: {min: 0.20, max: 0.95, step: 0.05}
    sep: {min: 100, max: 3000, step: 50}
  calc:
    gam: 1/sqrt(1 - bet^2)
    dtp: gam*bet*sep/3.00e8*1e6
    sepp: gam*sep
  prompt: 'Two lamps {sep} m apart flash at the same instant in the ground frame. A rocket moves at ${bet:num2}c$ along the line from the first lamp toward the second. In the rocket''s frame, how much earlier does the second lamp flash (μs, 3 significant figures), and how far apart are the flashes (m, 3 significant figures)? Use $c = 3.00\times10^8$ m/s.'
  answers:
    - {name: dtp, label: 'Earlier by', format: sig3, relTolerance: 0.006, units: {'μs': 1, us: 1, ns: 0.001}}
    - {name: sepp, label: 'Separation', format: sig3, relTolerance: 0.006, units: {m: 1, km: 1000}}
  solution: |-
    $\gamma = 1/\sqrt{1 - ({bet:num2})^2} = {gam:num4}$.

    With $\Delta t = 0$: $\Delta t' = \gamma\left(0 - \dfrac{v\,\Delta x}{c^2}\right) = -{gam:num4}\cdot\dfrac{{bet:num2}({sep})}{3.00\times10^8}$ s, so the second lamp (ahead, in the direction of motion) flashes **{dtp:sig3} μs** earlier.

    $\Delta x' = \gamma(\Delta x - v\,\Delta t) = {gam:num4}({sep}) =$ **{sepp:sig3} m**.
- id: phys-m12-r2-twin
  title: Twin paradox round trip
  topic: Spacetime geometry
  vars:
    dist: {min: 2.0, max: 20.0, step: 0.5}
    bet: {min: 0.50, max: 0.99, step: 0.01}
  calc:
    gam: 1/sqrt(1 - bet^2)
    tE: 2*dist/bet
    tT: tE/gam
    gap: tE - tT
  prompt: 'A traveler flies to a star {dist:num1} light-years away at ${bet:num2}c$, turns around at once, and returns at the same speed. Find the trip''s duration on Earth, the time on the traveler''s clock, and how much younger the traveler is than a twin who stayed home (all in years, to 3 significant figures; subtract unrounded values for the age difference).'
  answers:
    - {name: tE, label: 'Earth time', format: sig3, relTolerance: 0.006, units: {yr: 1, years: 1, year: 1}}
    - {name: tT, label: 'Traveler time', format: sig3, relTolerance: 0.006, units: {yr: 1, years: 1, year: 1}}
    - {name: gap, label: 'Age difference', format: sig3, relTolerance: 0.006, units: {yr: 1, years: 1, year: 1}}
  solution: |-
    Earth time: $2 \times \dfrac{{dist:num1}\text{ ly}}{{bet:num2}\text{ ly/yr}} =$ **{tE:sig3} yr**.

    $\gamma = 1/\sqrt{1 - ({bet:num2})^2} = {gam:num4}$. The traveler's clock reads $\Delta t/\gamma =$ **{tT:sig3} yr** (equivalently, each leg has proper time $\sqrt{(c\Delta t)^2 - (\Delta x)^2}$).

    Difference: **{gap:sig3} yr**. The Earth twin's worldline is straight, so that twin ages more.
- id: phys-m12-r2-alpha-q
  title: Q-value of an alpha decay
  topic: Nuclear reactions
  vars:
    iso:
      choices:
        - {label: 'uranium-238 (238.050787 u) decays to thorium-234 (234.043600 u)', value: 0}
        - {label: 'radium-226 (226.025410 u) decays to radon-222 (222.017578 u)', value: 1}
        - {label: 'polonium-210 (209.982874 u) decays to lead-206 (205.974465 u)', value: 2}
        - {label: 'americium-241 (241.056829 u) decays to neptunium-237 (237.048174 u)', value: 3}
  calc:
    mpar: if(iso == 0, 238.050787, if(iso == 1, 226.025410, if(iso == 2, 209.982874, 241.056829)))
    mdau: if(iso == 0, 234.043600, if(iso == 1, 222.017578, if(iso == 2, 205.974465, 237.048174)))
    anum: if(iso == 0, 238, if(iso == 1, 226, if(iso == 2, 210, 241)))
    dm: mpar - mdau - 4.002603
    qval: dm*931.5
    kal: qval*(anum - 4)/anum
  prompt: 'By alpha decay, {iso}. Using atomic masses (He-4: 4.002603 u) and 1 u = 931.5 MeV, find the Q-value and the alpha particle''s kinetic energy if the parent was at rest (both in MeV, to 3 significant figures).'
  answers:
    - {name: qval, label: '$Q =$', format: sig3, relTolerance: 0.006, units: {MeV: 1, keV: 0.001}}
    - {name: kal, label: '$K_\alpha =$', format: sig3, relTolerance: 0.006, units: {MeV: 1, keV: 0.001}}
  solution: |-
    Parent mass minus daughter mass minus 4.002603 u (use all six decimals): $\Delta m = {dm:sig4}$ u, so $Q = {dm:sig4}(931.5) =$ **{qval:sig3} MeV**.

    The daughter and the alpha share momentum equally, so energy divides in inverse proportion to mass: $K_\alpha = Q\dfrac{A - 4}{A} = {qval:sig4} \times \dfrac{{anum} - 4}{{anum}} =$ **{kal:sig3} MeV**.
- id: phys-m12-r2-fusion-split
  title: Fusion Q-value and energy sharing
  topic: Nuclear reactions
  vars:
    rx:
      choices:
        - {label: 'deuterium + tritium → helium-4 + neutron', value: 0}
        - {label: 'deuterium + deuterium → helium-3 + neutron', value: 1}
        - {label: 'deuterium + deuterium → tritium + proton', value: 2}
        - {label: 'deuterium + helium-3 → helium-4 + proton', value: 3}
  calc:
    min1: 2.014102 + 0
    min2: if(rx == 0, 3.016049, if(rx == 1, 2.014102, if(rx == 2, 2.014102, 3.016029)))
    mheavy: if(rx == 0, 4.002603, if(rx == 1, 3.016029, if(rx == 2, 3.016049, 4.002603)))
    mlight: if(rx == 0, 1.008665, if(rx == 1, 1.008665, if(rx == 2, 1.007825, 1.007825)))
    aheavy: if(rx == 1, 3, if(rx == 2, 3, 4))
    dm: min1 + min2 - mheavy - mlight
    qval: dm*931.5
    klight: qval*aheavy/(aheavy + 1)
  prompt: 'For the fusion reaction {rx}, find the Q-value and the kinetic energy of the lighter product, assuming the reacting nuclei start with negligible kinetic energy (both in MeV, to 3 significant figures). Masses (u): H-2 2.014102, H-3 3.016049, He-3 3.016029, He-4 4.002603, H-1 1.007825, neutron 1.008665; 1 u = 931.5 MeV. Use mass numbers for the momentum sharing.'
  answers:
    - {name: qval, label: '$Q =$', format: sig3, relTolerance: 0.006, units: {MeV: 1, keV: 0.001}}
    - {name: klight, label: 'Lighter product', format: sig3, relTolerance: 0.006, units: {MeV: 1, keV: 0.001}}
  solution: |-
    Add the two masses before and the two after, and subtract (keep all six decimals): $\Delta m = {dm:sig4}$ u. $Q = {dm:sig4}(931.5) =$ **{qval:sig3} MeV**.

    The two products fly apart with equal and opposite momenta, so the lighter one (mass number 1) gets the fraction $\dfrac{{aheavy}}{{aheavy} + 1}$: $K = {qval:sig4} \times \dfrac{{aheavy}}{{aheavy} + 1} =$ **{klight:sig3} MeV**.
- id: phys-m12-r2-dose
  title: Absorbed and equivalent dose
  topic: Radiation dose
  vars:
    kind:
      choices:
        - {label: 'gamma rays ($w_R = 1$)', value: 1}
        - {label: 'beta particles ($w_R = 1$)', value: 1}
        - {label: 'protons ($w_R = 2$)', value: 2}
        - {label: 'alpha particles ($w_R = 20$)', value: 20}
    emj: {min: 0.10, max: 5.00, step: 0.05}
    mkg: {min: 0.20, max: 2.00, step: 0.05}
  calc:
    wr: kind + 0
    dose: emj/mkg
    hdose: kind*dose
  prompt: 'An organ of mass {mkg:num2} kg absorbs {emj:num2} mJ of energy from {kind}. Find the absorbed dose (mGy) and the equivalent dose (mSv), each to 3 significant figures.'
  answers:
    - {name: dose, label: 'Absorbed dose', format: sig3, relTolerance: 0.006, units: {mGy: 1, Gy: 1000}}
    - {name: hdose, label: 'Equivalent dose', format: sig3, relTolerance: 0.006, units: {mSv: 1, Sv: 1000}}
  solution: |-
    Absorbed dose is energy per kilogram, and 1 mJ/kg = 1 mGy: $D = \dfrac{{emj:num2}\text{ mJ}}{{mkg:num2}\text{ kg}} =$ **{dose:sig3} mGy**.

    Equivalent dose: $H = w_RD = {wr}({dose:sig4}) =$ **{hdose:sig3} mSv**.
