# Round 2, honors module phys-h1 (Frontiers of physics): drills for lessons 90-93.
# Lesson 90: general relativity
- id: phys-h1-r2-grav-clock
  title: Gravitational time dilation near Earth
  topic: General relativity
  vars:
    hgt: {min: 100, max: 9000, step: 50}
    days: {min: 1, max: 365}
  calc:
    frac: 9.8*hgt/(3.00e8)^2
    gain: frac*days*86400*1e9
  prompt: 'Two identical clocks start together; one is {hgt} m higher than the other. Using $\Delta t/t \approx gh/c^2$ with $g = 9.8$ m/s² and $c = 3.00\times10^8$ m/s, find (a) the fractional rate difference and (b) how many nanoseconds the higher clock gains in {days} days. Give each to 3 significant figures.'
  answers:
    - {name: frac, label: '(a) $gh/c^2 =$', format: sci, relTolerance: 0.01}
    - {name: gain, label: '(b) Time gained', format: sig3, relTolerance: 0.01, units: {ns: 1, 'μs': 1000, us: 1000}}
  solution: |-
    (a) $\dfrac{gh}{c^2} = \dfrac{(9.8)({hgt:dp0})}{(3.00\times10^8)^2} = \mathbf{{frac:texsci}}$. The higher clock runs fast by this fraction.

    (b) {days} days $= {days} \times 86\,400$ s. Gain $= {frac:texsci} \times {days} \times 86\,400\text{ s} =$ **{gain:sig3} ns**.

- id: phys-h1-r2-schwarzschild
  title: Schwarzschild radius
  topic: Black holes and gravitational waves
  vars:
    msol: {min: 3, max: 80}
    rau: {min: 0.02, max: 2.00, step: 0.01}
  calc:
    rkm: 2*6.674e-11*msol*1.989e30/(2.998e8)^2/1000
    rsm: rau*1.496e11
    mbkg: rsm*(2.998e8)^2/(2*6.674e-11)
    mbh: mbkg/1.989e30
  prompt: '(a) Find the Schwarzschild radius, in km, of a black hole of {msol} solar masses. (b) A supermassive black hole has a horizon radius of {rau:num2} AU. What is its mass in solar masses? Use $G = 6.674\times10^{-11}$ N·m²/kg², $c = 2.998\times10^8$ m/s, $M_\odot = 1.989\times10^{30}$ kg and 1 AU $= 1.496\times10^{11}$ m. Give each to 3 significant figures.'
  answers:
    - {name: rkm, label: '(a) $r_s =$', format: sig3, relTolerance: 0.01, units: {km: 1, m: 0.001}}
    - {name: mbh, label: '(b) Mass (solar masses)', format: sci, relTolerance: 0.01}
  solution: |-
    (a) $r_s = \dfrac{2GM}{c^2} = \dfrac{2(6.674\times10^{-11})({msol} \times 1.989\times10^{30})}{(2.998\times10^8)^2}$ m $=$ **{rkm:sig3} km** (about 2.95 km per solar mass).

    (b) $r_s = {rau:num2} \times 1.496\times10^{11} = {rsm:texsci}$ m. Solve for the mass: $M = \dfrac{r_sc^2}{2G} = \dfrac{({rsm:texsci})(2.998\times10^8)^2}{2(6.674\times10^{-11})} = {mbkg:texsci}$ kg. Divide by $1.989\times10^{30}$ kg: $\mathbf{{mbh:texsci}}$ solar masses.

- id: phys-h1-r2-gw-strain
  title: Gravitational-wave strain
  topic: Black holes and gravitational waves
  vars:
    hs: {min: 0.5, max: 5.0, step: 0.1}
    det: {choices: [{label: 'LIGO (4.0 km arms)', value: 4000}, {label: 'Virgo (3.0 km arms)', value: 3000}, {label: 'GEO600 (0.60 km arms)', value: 600}]}
  calc:
    dl: hs*1e-21*det
    frac: dl/1.7e-15
  prompt: 'A gravitational wave with peak strain $h = {hs:num1}\times10^{-21}$ passes through the {det} detector. (a) By how much does one arm change in length (m)? (b) What fraction of a proton''s diameter ($1.7\times10^{-15}$ m) is that? Give each to 3 significant figures.'
  answers:
    - {name: dl, label: '(a) $\Delta L =$', format: sci, relTolerance: 0.01, units: {m: 1}}
    - {name: frac, label: '(b) Fraction', format: sci, relTolerance: 0.01}
  solution: |-
    (a) $\Delta L = hL = ({hs:num1}\times10^{-21})({det:sig4}\text{ m}) = \mathbf{{dl:texsci}}$ **m**.

    (b) $\dfrac{\Delta L}{1.7\times10^{-15}\text{ m}} = \mathbf{{frac:texsci}}$, a tiny fraction of a proton.

# Lesson 91: the Standard Model
- id: phys-h1-r2-annihilation
  title: Particle–antiparticle annihilation
  topic: Particle physics
  vars:
    part: {choices: [{label: 'an electron and a positron ($mc^2 = 0.511$ MeV each)', value: 0.511}, {label: 'a muon and an antimuon ($mc^2 = 105.7$ MeV each)', value: 105.7}, {label: 'a proton and an antiproton ($mc^2 = 938.3$ MeV each)', value: 938.3}]}
    kin: {min: 0.5, max: 5, step: 0.5}
  calc:
    eph: part + kin
    lam: 1240/eph
  prompt: 'Consider {part}. They collide head-on with equal speeds, each with kinetic energy {kin:num1} MeV, and annihilate into two photons. Find (a) the energy of each photon (MeV) and (b) its wavelength (fm). Use $hc = 1240$ MeV·fm and give each to 3 significant figures.'
  answers:
    - {name: eph, label: '(a) Photon energy', format: sig4, relTolerance: 0.01, units: {MeV: 1, keV: 0.001, GeV: 1000}}
    - {name: lam, label: '(b) Wavelength', format: sig3, relTolerance: 0.01, units: {fm: 1, pm: 1000}}
  solution: |-
    The total momentum is zero, so the two photons go off in opposite directions with equal energies.

    (a) Each photon takes one particle's total energy: $E = mc^2 + K = {part:num4} + {kin:num1} =$ **{eph:sig4} MeV**.

    (b) $\lambda = \dfrac{hc}{E} = \dfrac{1240\text{ MeV·fm}}{{eph:sig4}\text{ MeV}} =$ **{lam:sig3} fm**.

- id: phys-h1-r2-force-range
  title: Range of a force from its carrier's mass
  topic: Particle physics
  vars:
    carrier: {choices: [{label: 'the pion ($mc^2 = 139.6$ MeV)', value: 139.6}, {label: 'the rho meson ($mc^2 = 775$ MeV)', value: 775}, {label: 'the W boson ($mc^2 = 80\,400$ MeV)', value: 80400}, {label: 'the Z boson ($mc^2 = 91\,200$ MeV)', value: 91200}]}
    rng: {min: 0.20, max: 3.00, step: 0.05}
  calc:
    rfm: 197.3/carrier
    mass: 197.3/rng
  prompt: 'Use the estimate $R \approx \hbar c/(mc^2)$ with $\hbar c = 197.3$ MeV·fm. (a) Estimate the range (fm) of a force carried by {carrier}. (b) A force has a range of about {rng:num2} fm. Estimate its carrier''s rest energy (MeV). Give each to 3 significant figures.'
  answers:
    - {name: rfm, label: '(a) Range', format: sig3, relTolerance: 0.01, units: {fm: 1, m: 1e15}}
    - {name: mass, label: '(b) $mc^2 =$', format: sig3, relTolerance: 0.01, units: {MeV: 1, GeV: 1000}}
  solution: |-
    (a) $R \approx \dfrac{197.3\text{ MeV·fm}}{{carrier:sig5}\text{ MeV}} =$ **{rfm:sig3} fm**.

    (b) $mc^2 \approx \dfrac{\hbar c}{R} = \dfrac{197.3}{{rng:num2}} =$ **{mass:sig3} MeV**. Heavier carriers give shorter ranges.

- id: phys-h1-r2-accelerator
  title: Momentum of a particle in a magnetic ring
  topic: Particle physics
  vars:
    fld: {min: 1.0, max: 9.0, step: 0.1}
    rad: {min: 20, max: 3000, step: 10}
  calc:
    mom: 0.2998*fld*rad
    gam: sqrt(mom^2 + 0.9383^2)/0.9383
  prompt: 'Protons circle in a ring of radius {rad} m inside magnets of {fld:num1} T. Find (a) each proton''s momentum in GeV/$c$ and (b) its Lorentz factor $\gamma$. Use $p\ (\text{GeV}/c) = 0.2998\,B\ (\text{T})\,r\ (\text{m})$ and $m_pc^2 = 0.9383$ GeV, and give each to 3 significant figures.'
  answers:
    - {name: mom, label: '(a) $p =$', format: sig3, relTolerance: 0.01, units: {'GeV/c': 1, 'TeV/c': 1000, GeV: 1}}
    - {name: gam, label: '(b) $\gamma =$', format: sig3, relTolerance: 0.01}
  solution: |-
    (a) $p = 0.2998({fld:num1})({rad:dp0}) =$ **{mom:sig3} GeV/$c$**.

    (b) Total energy $E = \sqrt{(pc)^2 + (mc^2)^2} = \sqrt{({mom:sig4})^2 + 0.9383^2}$ GeV, and $\gamma = E/(mc^2) =$ **{gam:sig3}**.

# Lesson 92: cosmology
- id: phys-h1-r2-parallax
  title: Distance from parallax
  topic: Cosmology
  vars:
    par: {min: 0.010, max: 0.800, step: 0.001}
  calc:
    dpc: 1/par
    dly: 3.262/par
  prompt: 'A star''s parallax angle is {par:dp3} arcseconds. Find its distance (a) in parsecs and (b) in light-years (1 pc = 3.262 ly). Give each to 3 significant figures.'
  answers:
    - {name: dpc, label: '(a) Distance', format: sig3, relTolerance: 0.01, units: {pc: 1}}
    - {name: dly, label: '(b) Distance', format: sig3, relTolerance: 0.01, units: {ly: 1}}
  solution: |-
    (a) $d = \dfrac{1}{p} = \dfrac{1}{{par:dp3}} =$ **{dpc:sig3} pc**.

    (b) ${dpc:sig4} \times 3.262 =$ **{dly:sig3} ly**.

- id: phys-h1-r2-hubble
  title: Redshift, speed and Hubble distance
  topic: Cosmology
  vars:
    line: {choices: [{label: 'hydrogen''s red line (emitted at 656.3 nm)', value: 656.3}, {label: 'hydrogen''s blue-green line (emitted at 486.1 nm)', value: 486.1}, {label: 'calcium''s K line (emitted at 393.4 nm)', value: 393.4}]}
    zz: {min: 0.003, max: 0.050, step: 0.001}
    hub: {choices: [67, 70, 73]}
  calc:
    lobs: round(line*(1 + zz), 1)
    zed: (lobs - line)/line
    vel: zed*3.00e5
    dist: vel/hub
  prompt: 'In a galaxy''s spectrum, {line} is observed at {lobs:num1} nm. Find (a) the redshift $z$, (b) the recession speed (km/s, using $v \approx cz$ with $c = 3.00\times10^5$ km/s) and (c) the distance (Mpc) with $H_0 = {hub}$ km/s/Mpc. Give each to 3 significant figures.'
  answers:
    - {name: zed, label: '(a) $z =$', format: sig3, relTolerance: 0.01}
    - {name: vel, label: '(b) $v =$', format: sig3, relTolerance: 0.01, units: {'km/s': 1, 'm/s': 0.001}}
    - {name: dist, label: '(c) $d =$', format: sig3, relTolerance: 0.01, units: {Mpc: 1}}
  solution: |-
    (a) $z = \dfrac{{lobs:num1} - {line:num1}}{{line:num1}} =$ **{zed:sig3}**.

    (b) $v \approx cz = (3.00\times10^5)({zed:sig4}) =$ **{vel:sig3} km/s**.

    (c) $d = \dfrac{v}{H_0} = \dfrac{{vel:sig4}}{{hub}} =$ **{dist:sig3} Mpc**.

- id: phys-h1-r2-rotation-mass
  title: Galaxy mass from a rotation speed
  topic: Dark matter and dark energy
  vars:
    vkm: {min: 150, max: 300, step: 5}
    rkpc: {min: 2.0, max: 40.0, step: 0.5}
  calc:
    rm: rkpc*3.086e19
    mkg: (vkm*1000)^2*rm/6.674e-11
    msun: mkg/1.989e30
  prompt: 'Gas orbits a galaxy''s center at {vkm} km/s, {rkpc:num1} kpc from the center (1 kpc = $3.086\times10^{19}$ m). Treating the mass inside the orbit as if it were at the center, find that mass (a) in kg and (b) in solar masses ($M_\odot = 1.989\times10^{30}$ kg). Use $G = 6.674\times10^{-11}$ N·m²/kg² and give each to 3 significant figures.'
  answers:
    - {name: mkg, label: '(a) Mass', format: sci, relTolerance: 0.01, units: {kg: 1}}
    - {name: msun, label: '(b) Solar masses', format: sci, relTolerance: 0.01}
  solution: |-
    $r = {rkpc:num1} \times 3.086\times10^{19} = {rm:texsci}$ m and $v = {vkm}\,000$ m/s.

    (a) $M = \dfrac{v^2r}{G} = \dfrac{({vkm}\,000)^2({rm:texsci})}{6.674\times10^{-11}} = \mathbf{{mkg:texsci}}$ **kg**.

    (b) Divide by $1.989\times10^{30}$ kg: $\mathbf{{msun:texsci}}$ solar masses.

# Lesson 93: climate physics
- id: phys-h1-r2-layer-model
  title: The one-layer greenhouse model
  topic: Greenhouse models
  vars:
    teff: {min: 200, max: 300}
    eps: {min: 0.10, max: 1.00, step: 0.01}
  calc:
    tsurf: teff*(2/(2 - eps))^0.25
    tlay: tsurf/2^0.25
  prompt: 'A planet has an effective temperature of {teff} K. Its atmosphere is modeled as one layer, transparent to sunlight, that absorbs a fraction $\varepsilon = {eps:num2}$ of the surface''s infrared. Find (a) the surface temperature and (b) the layer''s temperature, in K to 3 significant figures.'
  answers:
    - {name: tsurf, label: '(a) $T_s =$', format: sig3, relTolerance: 0.01, units: {K: 1}}
    - {name: tlay, label: '(b) $T_a =$', format: sig3, relTolerance: 0.01, units: {K: 1}}
  solution: |-
    (a) $T_s = T_e\left(\dfrac{2}{2 - \varepsilon}\right)^{1/4} = {teff}\left(\dfrac{2}{2 - {eps:num2}}\right)^{1/4} =$ **{tsurf:sig3} K**.

    (b) The layer's balance gives $T_a^4 = \tfrac12T_s^4$, so $T_a = T_s/2^{1/4} = {tsurf:sig4}/1.189 =$ **{tlay:sig3} K**.

- id: phys-h1-r2-co2-forcing
  title: CO₂ forcing and warming
  topic: Climate forcing and feedbacks
  vars:
    ppm: {min: 300, max: 1120, step: 10}
    sens: {choices: [2.5, 3.0, 3.5, 4.0]}
  calc:
    dF: 5.35*ln(ppm/280)
    dT0: dF/3.74
    dTeq: sens*ln(ppm/280)/ln(2)
  prompt: 'CO₂ rises from 280 ppm to {ppm} ppm. Find (a) the radiative forcing, using $\Delta F = 5.35\ln(C/C_0)$ W/m²; (b) the no-feedback warming, using $\Delta T_0 = \Delta F/(3.74\text{ W/(m}^2\text{·K)})$; and (c) the eventual warming if the climate sensitivity is {sens:num1} K per doubling of CO₂. Give each to 3 significant figures.'
  answers:
    - {name: dF, label: '(a) $\Delta F =$', format: sig3, relTolerance: 0.01, units: {'W/m²': 1, 'W/m^2': 1}}
    - {name: dT0, label: '(b) $\Delta T_0 =$', format: sig3, relTolerance: 0.01, units: {K: 1}}
    - {name: dTeq, label: '(c) $\Delta T =$', format: sig3, relTolerance: 0.01, units: {K: 1}}
  solution: |-
    (a) $\Delta F = 5.35\ln\dfrac{{ppm:dp0}}{280} =$ **{dF:sig3} W/m²**.

    (b) $\Delta T_0 = \dfrac{{dF:sig4}}{3.74} =$ **{dT0:sig3} K**.

    (c) The number of doublings is $\dfrac{\ln({ppm:dp0}/280)}{\ln 2}$, so $\Delta T = {sens:num1} \times \dfrac{\ln({ppm:dp0}/280)}{\ln 2} =$ **{dTeq:sig3} K**.

- id: phys-h1-r2-feedback
  title: Feedbacks and climate sensitivity
  topic: Climate forcing and feedbacks
  vars:
    dt0: {min: 0.8, max: 1.5, step: 0.1}
    fb: {min: 0.20, max: 0.75, step: 0.05}
    sens: {min: 2.0, max: 5.0, step: 0.5}
  calc:
    dT: dt0/(1 - fb)
    fneed: 1 - dt0/sens
  where: ['sens > dt0 + 0.3']
  prompt: 'Without feedbacks, doubling CO₂ would warm a model climate by $\Delta T_0 = {dt0:num1}$ K. (a) If the net feedback factor is $f = {fb:num2}$, what is the eventual warming? (b) What feedback factor would make the eventual warming {sens:num1} K? Use $\Delta T = \Delta T_0/(1 - f)$ and give each to 3 significant figures.'
  answers:
    - {name: dT, label: '(a) $\Delta T =$', format: sig3, relTolerance: 0.01, units: {K: 1}}
    - {name: fneed, label: '(b) $f =$', format: sig3, relTolerance: 0.01}
  solution: |-
    (a) $\Delta T = \dfrac{{dt0:num1}}{1 - {fb:num2}} =$ **{dT:sig3} K**.

    (b) $1 - f = \dfrac{\Delta T_0}{\Delta T} = \dfrac{{dt0:num1}}{{sens:num1}}$, so $f = 1 - \dfrac{{dt0:num1}}{{sens:num1}} =$ **{fneed:sig3}**.
