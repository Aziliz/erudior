# Round 2 glossary for phys-m3 (honors lessons)
- term: impending motion
  aliases: [impending slip]
  definition: 'The point at which surfaces are just about to slip, where static friction is at its limit, $f_s = \mu_s n$; used to find a largest force, steepest angle or fastest speed.'
  topic: Friction in systems
- term: design speed
  definition: 'The speed at which a banked curve needs no friction: $v_0 = \sqrt{rg\tan\theta}$.'
  topic: Friction in systems
- term: fictitious force
  aliases: [fictitious forces, pseudo-force, pseudo-forces, inertial force]
  definition: 'A force added in an accelerating frame so that Newton''s second law works there: $-m\vec A$ for a frame with acceleration $\vec A$. No object exerts it, so it has no third-law partner.'
  topic: Accelerating frames
- term: non-inertial frame
  aliases: [non-inertial frames, noninertial frame, accelerating frame]
  definition: 'A reference frame that accelerates or rotates relative to an inertial frame; Newton''s laws hold in it only if fictitious forces are added.'
  topic: Accelerating frames
- term: effective gravity
  definition: 'The apparent gravitational field in an accelerating frame, $\vec g_{\text{eff}} = \vec g - \vec A$; a hanging string lines up with it.'
  topic: Accelerating frames
- term: centrifugal force
  definition: 'The fictitious force in a rotating frame, $m\omega^2 r = mv^2/r$, pointing directly away from the rotation axis. It does not exist in an inertial frame.'
  topic: Accelerating frames
- term: Coriolis force
  aliases: [Coriolis effect]
  definition: 'The fictitious force on an object moving relative to a rotating frame, perpendicular to its velocity (size $2m\omega v$ for motion perpendicular to the axis); on Earth it deflects moving air and water to the right in the Northern Hemisphere.'
  topic: Accelerating frames
