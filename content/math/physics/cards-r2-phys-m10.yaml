# Round 2, module phys-m10: cards for the honors lessons.
- {front: 'Helical motion in a uniform field', back: 'Split $\vec v$: $v_\parallel$ along $\vec B$ is unchanged; $v_\perp$ circles with $r = mv_\perp/(|q|B)$. Pitch $p = v_\parallel\cdot 2\pi m/(|q|B)$.', topic: Particle motion in fields}
- {front: 'Pitch of a helix: which velocity component?', back: 'The component along the field, $v_\parallel = v\cos\theta$. The radius uses $v_\perp = v\sin\theta$.', topic: Particle motion in fields}
- {front: 'Why a cyclotron can use one fixed frequency', back: 'The orbit period $2\pi m/(|q|B)$ does not depend on speed (until near light speed), so ions always return to the gap after half a period.', topic: Particle motion in fields}
- {front: 'Cyclotron exit energy', back: '$K_{\max} = \dfrac{q^2B^2R^2}{2m}$: set $r = R$ (dee radius) in $r = mv/(|q|B)$. Independent of the gap voltage.', topic: Particle motion in fields}
- {front: 'What limits a fixed-frequency cyclotron?', back: 'Relativity: near light speed the orbit period grows, so ions fall out of step. Synchrocyclotrons and synchrotrons adjust frequency or field.', topic: Particle motion in fields}
- {front: 'e/m from crossed fields then a circle', back: 'Undeflected: $v = E/B$. Then with $E$ off, $r = mv/(eB)$, so $e/m = E/(B^2r)$.', topic: Particle motion in fields}
- {front: 'Thomson, 1897', back: 'Measured the charge-to-mass ratio of cathode-ray particles (electrons) with electric and magnetic deflections; far larger than any ion''s, and with a charge about the same as a hydrogen ion''s, the particles had to be far lighter than atoms.', topic: Particle motion in fields}
- {front: 'Magnetic mirror (simplified)', back: 'Where field lines converge the field is stronger and pushes spiraling particles back; a field strong at both ends traps them (Van Allen belts).', topic: Particle motion in fields}
- {front: 'Hall voltage', back: '$V_H = \dfrac{IB}{nqt}$, from balancing $qE_H = qv_dB$ with $I = nqv_d(wt)$. $t$ = thickness along $\vec B$.', topic: The Hall effect}
- {front: 'What the sign of the Hall voltage tells you', back: 'The sign of the charge carriers: positive and negative carriers (moving opposite ways for the same current) are pushed to the same edge.', topic: The Hall effect}
- {front: 'Why Hall sensors are semiconductors', back: '$V_H \propto 1/n$; semiconductors have millions of times fewer carriers than metals, so the Hall voltage is much larger (microvolts in copper).', topic: The Hall effect}
- {front: 'Phase in single AC elements', back: 'Resistor: in phase. Inductor: current lags voltage by $90^\circ$. Capacitor: current leads by $90^\circ$ ("ELI the ICE man").', topic: Phase and power factor}
- {front: 'Series RLC phasor sum', back: '$V = \sqrt{V_R^2 + (V_L - V_C)^2} = IZ$; $V_L$ and $V_C$ point opposite ways, so each can exceed the source voltage.', topic: Phase and power factor}
- {front: 'Phase angle (series RLC)', back: '$\tan\varphi = \dfrac{X_L - X_C}{R}$; positive (current lags) if inductive, negative (current leads) if capacitive, 0 at resonance.', topic: Phase and power factor}
- {front: 'Average AC power', back: '$P_{\text{avg}} = I_{\text{rms}}V_{\text{rms}}\cos\varphi = I_{\text{rms}}^2R$; power factor $\cos\varphi = R/Z$. Ideal L and C use no average power.', topic: Phase and power factor}
- {front: 'Power factor correction', back: 'Inductive loads (motors) make current lag; adding capacitors (leading current) raises the power factor, cutting the current and wiring losses for the same real power.', topic: Phase and power factor}
- {front: 'Transmission line loss', back: '$P_{\text{loss}} = (P/V)^2R_{\text{line}}$: ten times the voltage gives one hundredth of the loss.', topic: Power transmission}
- {front: 'Why the grid is AC', back: 'Transformers step AC voltage up for low-loss transmission and down for safe use; 1880s–90s DC could not be transformed.', topic: Power transmission}
- {front: 'Line loss mistake', back: 'Use $I^2R_{\text{line}}$ with the line current, not $V^2/R_{\text{line}}$ with the transmission voltage (that voltage is across the load, not the wire).', topic: Power transmission}
- {front: 'Three-phase power', back: 'Three AC voltages $120^\circ$ apart; balanced currents sum to zero and total power is steady, so big motors run smoothly.', topic: Power transmission}
