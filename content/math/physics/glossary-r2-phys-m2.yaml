# Round 2, module phys-m2: terms bolded in the honors lessons 06h1, 06h2 and 06h3.
- term: meeting time
  aliases: [meeting times]
  definition: 'In a problem with two moving objects, a time at which their positions are equal, found by solving $x_A(t) = x_B(t)$ with one shared origin and clock.'
  topic: Chase problems
- term: reaction time
  aliases: [reaction times, perception-reaction time]
  definition: 'The time between seeing a hazard and starting to act (for a driver, until the brakes begin to work). The vehicle keeps its speed during it.'
  topic: Stopping distance
- term: reaction distance
  definition: 'The distance covered during the reaction time at constant speed, $v t_r$; proportional to speed.'
  topic: Stopping distance
- term: braking distance
  definition: 'The distance covered while braking to a stop at constant deceleration $a$: $v^2/(2a)$; proportional to the square of the speed.'
  topic: Stopping distance
- term: stopping distance
  aliases: [stopping distances]
  definition: 'Reaction distance plus braking distance: $d = v t_r + v^2/(2a)$.'
  topic: Stopping distance
- term: dilemma zone
  definition: 'A stretch of road before a traffic light where, when the light turns yellow, a driver can neither stop before the line nor clear the intersection before red. It disappears if the yellow is long enough.'
  topic: Stopping distance
- term: lob
  aliases: [lobs]
  definition: 'The higher of the two launch angles that hit the same target at the same speed: a longer, steeper flight than the low direct shot.'
  topic: Aiming projectiles
- term: safety parabola
  aliases: [envelope of trajectories]
  definition: 'The boundary of the points a projectile can reach at launch speed $v_0$: $y = \dfrac{v_0^2}{2g} - \dfrac{gx^2}{2v_0^2}$. Every trajectory touches it once; points below it can be hit at two angles, points above it not at all.'
  topic: Aiming projectiles
- term: odd-number rule
  aliases: [law of odd numbers]
  definition: 'For constant acceleration from rest, the distances covered in successive equal time intervals are in the ratio $1 : 3 : 5 : 7 : \dots$ (Galileo).'
  topic: Free-fall experiments
- term: photogate
  aliases: [photogates, light gate, light gates]
  definition: 'A light beam and detector that record the instant an object blocks the beam; used to time motion precisely.'
  topic: Free-fall experiments
- term: standard gravity
  aliases: [g_n]
  definition: 'The defined value $g_n = 9.80665$ m/s² used for calculations and units; the measured free-fall acceleration varies from about 9.78 m/s² (equator) to 9.83 m/s² (poles).'
  topic: Free-fall experiments
