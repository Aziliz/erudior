- term: electric dipole moment
  aliases: [dipole moment, dipole moments]
  definition: 'For charges $+q$ and $-q$ a distance $d$ apart, the vector $\vec p = q\vec d$, pointing from the negative to the positive charge; units C·m.'
  topic: Electric dipoles
- term: polar molecule
  aliases: [polar molecules]
  definition: 'A molecule with a permanent electric dipole moment because its positive and negative charge centers do not coincide, such as water.'
  topic: Electric dipoles
- term: induced dipole
  aliases: [induced dipoles]
  definition: 'A dipole created when an external field pushes an object''s positive and negative charges slightly apart; for modest fields its moment is proportional to the field.'
  topic: Electric dipoles
- term: bound charge
  definition: 'Charge that appears at the surfaces of a polarized dielectric because the ends of its lined-up dipoles are not cancelled there; it partly cancels the applied field inside.'
  topic: Electric dipoles
- term: Stokes's law
  aliases: [Stokes' law]
  definition: 'The drag on a small sphere of radius $r$ moving slowly at speed $v$ through a fluid of viscosity $\eta$: $F = 6\pi\eta rv$.'
  topic: Charge quantization
- term: electron avalanche
  definition: 'A runaway multiplication of free electrons in a gas: each electron, accelerated by a strong field, ionizes molecules and frees more electrons.'
  topic: Dielectric breakdown
- term: dielectric breakdown
  definition: 'The sudden failure of an insulator in a strong field, when it becomes conducting (in a gas, by an electron avalanche) and a spark or arc passes.'
  topic: Dielectric breakdown
- term: dielectric strength
  definition: 'The largest electric field a material can withstand before breakdown; about $3\times10^6$ V/m for dry air at sea level.'
  topic: Dielectric breakdown
- term: Van de Graaff generator
  definition: 'A machine that uses a moving belt to carry charge continuously into a large hollow metal dome, building up a high voltage.'
  topic: Dielectric breakdown
- term: corona discharge
  definition: 'A faint glowing discharge where the field near a sharp or thin conductor is strong enough to ionize the air in a thin layer, but not to make a full spark.'
  topic: Dielectric breakdown
- term: electrostatic precipitator
  definition: 'A pollution-control device that charges smoke or dust particles with a corona discharge and collects them on charged plates.'
  topic: Dielectric breakdown
- term: stepped leader
  definition: 'The faint channel of ionized air that works its way down from a thundercloud in jumps of tens of meters before a lightning strike.'
  topic: Dielectric breakdown
- term: return stroke
  definition: 'The bright main surge of current (typically tens of kiloamperes) along a lightning channel once the leader has connected with the ground.'
  topic: Dielectric breakdown
- term: lightning rod
  aliases: [lightning rods]
  definition: 'A pointed metal rod on a structure, connected to ground by heavy conductors, that gives a lightning strike a safe path to ground.'
  topic: Dielectric breakdown
