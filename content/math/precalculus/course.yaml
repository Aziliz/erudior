id: math-precalculus
title: Precalculus
description: >-
  Precalculus from the high school course through college precalculus, assuming Algebra 2:
  functions in depth, transformations, composition and inverses, polynomial and rational
  functions, exponential and logarithmic models, a compact trigonometry review, systems and
  matrices, conic sections, parametric and polar equations, vectors, sequences and series,
  induction, the binomial theorem, counting and probability, and a first look at limits and
  the derivative.
revision: 5
released: true
changelog: Honors lessons for every module, pictures and diagrams in every lesson, and new question types (fill in the blank, matching, labeling, ordering); corrections from a second full review of every lesson, question and drill; clearer graphs; answers shown at the precision each problem asks for. Fixes pictures that didn't show.
order: 6
