# Honors module pc-h1 (Proof, infinity and the road to calculus), round 2 cards
# Lesson 90: how to prove it
- {front: 'When is "If $P$, then $Q$" false?', back: 'Only when $P$ is true and $Q$ is false.', topic: Logic and proof}
- {front: 'Converse of "If $P$, then $Q$"', back: '"If $Q$, then $P$". Not equivalent: it can be false when the statement is true.', topic: Logic and proof}
- {front: 'Contrapositive of "If $P$, then $Q$"', back: '"If not $Q$, then not $P$". Always equivalent to the original statement.', topic: Logic and proof}
- {front: 'Inverse of "If $P$, then $Q$"', back: '"If not $P$, then not $Q$". Equivalent to the converse, not to the original.', topic: Logic and proof}
- {front: Direct proof, back: 'Assume the hypothesis; use definitions and algebra step by step to reach the conclusion.', topic: Logic and proof}
- {front: Proof by contrapositive, back: 'Prove "if not $Q$, then not $P$" instead of "if $P$, then $Q$". Example: $n$ odd $\Rightarrow$ $n^2$ odd proves $n^2$ even $\Rightarrow$ $n$ even.', topic: Logic and proof}
- {front: Proof by contradiction, back: 'Assume the claim is false and reach an impossibility, so the claim is true. Examples: $\sqrt2$ is irrational; there are infinitely many primes.', topic: Logic and proof}
- {front: 'Why is $\sqrt2$ irrational? (outline)', back: 'If $\sqrt2 = \frac ab$ in lowest terms, then $a^2 = 2b^2$, so $a$ is even; then $b^2 = 2c^2$, so $b$ is even. Both even contradicts lowest terms.', topic: Logic and proof}
- {front: 'Euclid: why infinitely many primes?', back: 'If $p_1, \dots, p_n$ were all the primes, $N = p_1 \cdots p_n + 1$ has a prime factor, but no $p_i$ divides $N$ (remainder 1). $N$ itself need not be prime: $30{,}031 = 59 \cdot 509$.', topic: Logic and proof}
- {front: 'Proving vs disproving a "for all" claim', back: 'No number of examples proves it; one counterexample disproves it. Negation of "every $x$ has $Q$": "some $x$ does not have $Q$".', topic: Logic and proof}
# Lesson 91: comparing infinite sets
- {front: Same cardinality, back: 'Two sets have the same size when there is a one-to-one correspondence (a function with an inverse) between them.', topic: Infinite sets}
- {front: Hilbert's hotel, back: 'A full hotel with rooms $1, 2, 3, \dots$ can take a new guest ($n \to n + 1$) or infinitely many ($n \to 2n$, new guests in odd rooms).', topic: Infinite sets}
- {front: Countable set, back: 'Finite, or listable as $a_1, a_2, a_3, \dots$ with every element appearing. $\mathbb{N}$, $\mathbb{Z}$, $\mathbb{Q}$ are countable.', topic: Infinite sets}
- {front: 'Listing $\mathbb{Z}$', back: '$0, 1, -1, 2, -2, \dots$: $f(n) = \frac n2$ ($n$ even), $f(n) = -\frac{n-1}{2}$ ($n$ odd).', topic: Infinite sets}
- {front: Cantor pairing function, back: '$\pi(a, b) = \frac{(a + b)(a + b + 1)}{2} + b$: the position (from 0) of the pair $(a, b)$ when pairs are listed by diagonals.', topic: Infinite sets}
- {front: 'Why is $\mathbb{Q}$ countable?', back: 'Arrange $\frac pq$ in a grid (column $p$, row $q$), walk the diagonals and skip fractions not in lowest terms; then alternate signs.', topic: Infinite sets}
- {front: Cantor's diagonal argument, back: 'From any list of numbers in $(0, 1)$, build $x$ whose $n$th digit differs from the $n$th digit of the $n$th number (use 5, or 4 if that digit is 5). $x$ is not on the list, so $(0, 1)$ is uncountable.', topic: Infinite sets}
- {front: 'Matching $(-1, 1)$ with $\mathbb{R}$', back: '$f(x) = \frac{x}{1 - |x|}$, with inverse $f^{-1}(y) = \frac{y}{1 + |y|}$. Every interval of positive length has the same cardinality as $\mathbb{R}$.', topic: Infinite sets}
- {front: Countable vs uncountable examples, back: 'Countable: $\mathbb{N}$, $\mathbb{Z}$, even numbers, $\mathbb{Q}$, pairs of whole numbers. Uncountable: $\mathbb{R}$, any interval of positive length.', topic: Infinite sets}
# Lesson 92: when infinite sums add up
- {front: Sum of an infinite series, back: 'The limit of the partial sums: $\sum a_k = S$ means $S_n = a_1 + \dots + a_n \to S$.', topic: Infinite series}
- {front: '$0.999\ldots$', back: 'Equals 1: the geometric series $\frac{9}{10} + \frac{9}{100} + \dots = \frac{9/10}{1 - 1/10} = 1$.', topic: Infinite series}
- {front: Divergence test, back: 'If $a_n \not\to 0$, $\sum a_n$ diverges. If $a_n \to 0$, the test says nothing.', topic: Infinite series}
- {front: Harmonic series, back: '$\sum \frac1k$ diverges, though $\frac1k \to 0$. Oresme: $S_{2^m} \ge 1 + \frac m2$.', topic: Infinite series}
- {front: 'Telescoping: $\sum_{k=1}^{\infty} \frac{1}{k(k+1)}$', back: '$\frac{1}{k(k+1)} = \frac1k - \frac{1}{k+1}$, so $S_n = 1 - \frac{1}{n+1} \to 1$.', topic: Infinite series}
- {front: 'Telescoping: $\sum_{k=1}^{\infty} \frac{1}{k(k+2)}$', back: '$\frac12\left(\frac1k - \frac{1}{k+2}\right)$; two terms survive at each end: $\frac12\left(1 + \frac12\right) = \frac34$.', topic: Infinite series}
- {front: Comparison test (positive terms), back: 'Smaller than a convergent series: converges. Larger than a divergent series: diverges. Other comparisons prove nothing.', topic: Infinite series}
- {front: p-series, back: '$\sum \frac{1}{k^p}$ converges when $p > 1$ and diverges when $p \le 1$. $\sum \frac{1}{k^2} = \frac{\pi^2}{6}$ (Euler).', topic: Infinite series}
- {front: Conditionally vs absolutely convergent, back: 'Absolutely: $\sum |a_k|$ converges; any rearrangement has the same sum. Conditionally: converges but $\sum |a_k|$ diverges; rearranging can change the sum.', topic: Infinite series}
- {front: Alternating harmonic series, back: '$1 - \frac12 + \frac13 - \dots = \ln 2$ (conditionally convergent). One rearrangement sums to $\frac{\ln 2}{2}$.', topic: Infinite series}
# Lesson 93: area under a curve
- {front: Archimedes' parabolic segment, back: 'Area $= \frac43$ of the inscribed triangle with the same base: $1 + \frac14 + \frac1{16} + \dots = \frac43$.', topic: Area and integration}
- {front: Method of exhaustion, back: 'Archimedes'' method: show by contradiction that an area is neither more nor less than a value.', topic: Area and integration}
- {front: 'Right-endpoint Riemann sum on $[0, b]$', back: '$R_n = \sum_{i=1}^{n} f\left(\frac{ib}{n}\right)\cdot\frac bn$ (width $\frac bn$, heights at right endpoints).', topic: Area and integration}
- {front: 'Riemann sums for $x^2$ on $[0, 1]$', back: '$R_n = \frac{(n+1)(2n+1)}{6n^2} \to \frac13$, using $\sum i^2 = \frac{n(n+1)(2n+1)}{6}$.', topic: Area and integration}
- {front: Definite integral, back: 'The limit of Riemann sums, $\int_a^b f(x)\,dx$; for $f \ge 0$ it is the area under the curve.', topic: Area and integration}
- {front: '$\int_0^b x^2\,dx$ and $\int_0^b x\,dx$', back: '$\frac{b^3}{3}$ and $\frac{b^2}{2}$. Over $[a, b]$, subtract: $\int_a^b x^2\,dx = \frac{b^3 - a^3}{3}$.', topic: Area and integration}
- {front: 'Rising curve: left vs right endpoints', back: 'For an increasing function, left sums underestimate and right sums overestimate: $L_n < \text{area} < R_n$.', topic: Area and integration}
- {front: Fundamental theorem of calculus (preview), back: 'The derivative of the area function is the original function: if $A(x) = \int_0^x f$, then $A''(x) = f(x)$. Example: $\left(\frac{x^3}{3}\right)'' = x^2$.', topic: Area and integration}
- {front: Distance from velocity, back: 'Distance traveled = area under the velocity graph (for velocity $\ge 0$). $v(t) = 3t^2$ on $[0, 2]$: $3 \cdot \frac83 = 8$.', topic: Area and integration}
- {front: The two problems of calculus, back: 'Tangent problem: limit of secant slopes (derivative). Area problem: limit of Riemann sums (integral). The FTC links them.', topic: Area and integration}
