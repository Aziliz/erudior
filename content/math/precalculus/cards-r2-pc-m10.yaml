# Honors lesson pc-m10-h-squeeze
- front: 'Squeeze theorem'
  back: 'If $g(x) \le f(x) \le h(x)$ near $a$ and $g, h \to L$, then $f \to L$. The two bounds must have the same limit.'
  topic: 'Squeeze theorem'
- front: '$\lim_{x\to0} x^2\sin\frac1x$'
  back: '$0$, by squeezing between $-x^2$ and $x^2$.'
  topic: 'Squeeze theorem'
- front: '$\lim_{x\to\infty}\frac{\sin x}{x}$'
  back: '$0$, by squeezing between $-\frac1x$ and $\frac1x$ (compare: the limit at 0 is 1).'
  topic: 'Squeeze theorem'
- front: 'The inequality behind $\frac{\sin x}{x} \to 1$'
  back: 'For $0 < x < \frac{\pi}{2}$, areas in the unit circle give $\sin x < x < \tan x$, so $\cos x < \frac{\sin x}{x} < 1$.'
  topic: 'Trigonometric limits'
- front: '$\lim_{x\to0}\frac{\sin kx}{x}$'
  back: '$k$ (substitute $u = kx$)'
  topic: 'Trigonometric limits'
- front: '$\lim_{x\to0}\frac{\tan x}{x}$'
  back: '$1$'
  topic: 'Trigonometric limits'
- front: '$\lim_{x\to0}\frac{1 - \cos x}{x}$'
  back: '$0$ (multiply by $1 + \cos x$)'
  topic: 'Trigonometric limits'
- front: '$\lim_{x\to0}\frac{1 - \cos x}{x^2}$'
  back: '$\frac12$, so $\cos x \approx 1 - \frac{x^2}{2}$ near 0'
  topic: 'Trigonometric limits'
- front: '$\lim_{x\to0}\frac{\sin x}{x}$ in degrees'
  back: '$\frac{\pi}{180} \approx 0.01745$: only radians give 1.'
  topic: 'Trigonometric limits'
- front: 'Derivatives of $\sin x$ and $\cos x$'
  back: '$(\sin x)'' = \cos x$ and $(\cos x)'' = -\sin x$ (radians)'
  topic: 'Trigonometric limits'
# Honors lesson pc-m10-h-rules
- front: 'Power rule'
  back: '$\frac{d}{dx}x^n = nx^{n-1}$'
  topic: 'Derivative rules'
- front: 'Why the power rule works (positive integer $n$)'
  back: 'Expand $(x + h)^n$ by the binomial theorem; after subtracting $x^n$ and dividing by $h$, every term but $nx^{n-1}$ still has a factor $h$.'
  topic: 'Derivative rules'
- front: 'Sum and constant multiple rules'
  back: '$(f + g)'' = f'' + g''$ and $(cf)'' = cf''$; the derivative of a constant is 0.'
  topic: 'Derivative rules'
- front: 'Is $(fg)'' = f''g''$?'
  back: 'No. With $f = g = x$: $(x^2)'' = 2x$ but $f''g'' = 1$.'
  topic: 'Derivative rules'
- front: 'Differentiable vs continuous'
  back: 'Differentiable at $a$ implies continuous at $a$. Not conversely: $|x|$ (corner) and $\sqrt[3]{x}$ (vertical tangent) are continuous at 0 but not differentiable.'
  topic: 'Derivative rules'
- front: 'Differentiable at the junction of a piecewise function'
  back: 'The pieces must meet (continuity) and the left and right difference quotients must have the same limit.'
  topic: 'Derivative rules'
- front: 'Linear approximation at $a$'
  back: '$f(x) \approx f(a) + f''(a)(x - a)$ for $x$ near $a$'
  topic: 'Linear approximation'
- front: 'Over- or underestimate?'
  back: 'If the graph bends downward ($\sqrt x$), the tangent lies above it: overestimate. If it bends upward ($x^{10}$ near 1): underestimate.'
  topic: 'Linear approximation'
- front: "Newton's method step"
  back: '$x_{n+1} = x_n - \dfrac{f(x_n)}{f''(x_n)}$: the tangent line''s $x$-intercept'
  topic: 'Linear approximation'
- front: "Newton's method for $\\sqrt{c}$"
  back: '$x_{n+1} = \frac12\left(x_n + \frac{c}{x_n}\right)$; near the root, correct digits roughly double each step.'
  topic: 'Linear approximation'
