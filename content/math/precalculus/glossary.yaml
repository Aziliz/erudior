- term: relation
  aliases: [relations]
  definition: 'Any set of ordered pairs $(x, y)$.'
  topic: Functions and notation
- term: function
  aliases: [functions]
  definition: 'A relation in which every input $x$ has exactly one output $y$.'
  topic: Functions and notation
- term: domain
  definition: 'The set of allowed inputs of a function.'
  topic: Domain and range
- term: range
  definition: 'The set of outputs a function actually produces.'
  topic: Domain and range
- term: vertical line test
  definition: 'A graph is the graph of a function exactly when no vertical line crosses it more than once.'
  topic: Functions and notation
- term: implied domain
  definition: 'For a formula with no stated domain, all real inputs that give a real output: exclude zeros of denominators, keep even-root radicands $\ge 0$ and log arguments $> 0$.'
  topic: Domain and range
- term: interval notation
  definition: 'Writing sets of numbers as intervals: $[a, b]$ includes the endpoints, $(a, b)$ excludes them, and $\cup$ joins pieces.'
  topic: Domain and range
- term: piecewise function
  aliases: [piecewise functions, piecewise]
  definition: 'A function defined by different formulas on different, non-overlapping parts of its domain.'
  topic: Piecewise functions
- term: closed dot
  definition: 'A filled dot on a graph showing that the endpoint belongs to the graph.'
  topic: Piecewise functions
- term: open dot
  definition: 'A hollow dot on a graph showing that the endpoint is not part of the graph.'
  topic: Piecewise functions
- term: jump discontinuity
  aliases: [jump]
  definition: 'A break in a graph where the left- and right-hand limits exist but are different.'
  topic: Limits
- term: absolute value
  definition: 'The distance of a number from 0: $|x| = x$ for $x \ge 0$ and $|x| = -x$ for $x < 0$.'
  topic: Piecewise functions
- term: greatest integer function
  aliases: [floor function]
  definition: '$\lfloor x \rfloor$, the largest integer less than or equal to $x$; its graph is a staircase.'
  topic: Piecewise functions
- term: zero
  aliases: [zeros, root, roots]
  definition: 'An input $c$ with $f(c) = 0$; a real zero is an $x$-intercept of the graph.'
  topic: Zeros of polynomials
- term: increasing
  definition: 'A function is increasing on an interval if its graph rises left to right there: $x_1 < x_2$ implies $f(x_1) < f(x_2)$.'
  topic: Function behavior
- term: decreasing
  definition: 'A function is decreasing on an interval if its graph falls left to right there: $x_1 < x_2$ implies $f(x_1) > f(x_2)$.'
  topic: Function behavior
- term: constant
  definition: 'A function is constant on an interval if it has the same output for every input there.'
  topic: Function behavior
- term: local maximum
  definition: 'A value $f(c)$ at least as large as all nearby values of $f$: the top of a hill.'
  topic: Function behavior
- term: local minimum
  definition: 'A value $f(c)$ no larger than all nearby values of $f$: the bottom of a valley.'
  topic: Function behavior
- term: local extrema
  definition: 'Local maxima and local minima together.'
  topic: Function behavior
- term: absolute maximum
  definition: 'The largest value a function takes on its whole domain, if there is one.'
  topic: Function behavior
- term: absolute minimum
  definition: 'The smallest value a function takes on its whole domain, if there is one.'
  topic: Function behavior
- term: average rate of change
  definition: 'The change in output over the change in input, $\dfrac{f(b) - f(a)}{b - a}$; the slope of the secant line.'
  topic: Average rate of change
- term: secant line
  definition: 'A line through two points of a graph; its slope is the average rate of change between them.'
  topic: Average rate of change
- term: difference quotient
  definition: '$\dfrac{f(x + h) - f(x)}{h}$, the average rate of change from $x$ to $x + h$.'
  topic: Average rate of change
- term: parent functions
  aliases: [parent function]
  definition: 'The basic functions ($x$, $x^2$, $x^3$, $\sqrt x$, $\sqrt[3]{x}$, $|x|$, $\frac1x$, $b^x$, $\log_b x$, …) that other functions transform.'
  topic: Parent functions
- term: even
  aliases: [even function]
  definition: 'A function with $f(-x) = f(x)$ for all $x$ in its domain; its graph is symmetric about the $y$-axis.'
  topic: Even and odd functions
- term: odd
  aliases: [odd function]
  definition: 'A function with $f(-x) = -f(x)$ for all $x$ in its domain; its graph has origin symmetry.'
  topic: Even and odd functions
- term: origin symmetry
  definition: 'A graph has origin symmetry if rotating it 180° about the origin leaves it unchanged: $(a, b)$ on it means $(-a, -b)$ is too.'
  topic: Even and odd functions
- term: transformation
  aliases: [transformations]
  definition: 'A shift, reflection, stretch or compression that moves or reshapes a graph.'
  topic: Transformations
- term: translation
  aliases: [translations, shift]
  definition: 'A transformation that slides a graph without changing its shape.'
  topic: Transformations
- term: reflection
  aliases: [reflections]
  definition: 'A transformation that flips a graph over a line: $-f(x)$ reflects over the $x$-axis, $f(-x)$ over the $y$-axis.'
  topic: Transformations
- term: vertical shift
  definition: '$y = f(x) + k$ moves the graph up $k$ units (down if $k < 0$).'
  topic: Transformations
- term: vertical stretch
  definition: '$y = af(x)$ with $|a| > 1$ multiplies every output by $a$, pulling the graph away from the $x$-axis.'
  topic: Transformations
- term: vertical compression
  definition: '$y = af(x)$ with $0 < |a| < 1$ squeezes the graph toward the $x$-axis.'
  topic: Transformations
- term: horizontal shift
  definition: '$y = f(x - h)$ moves the graph right $h$ units (left if $h < 0$).'
  topic: Transformations
- term: horizontal compression
  definition: '$y = f(bx)$ with $|b| > 1$ squeezes the graph toward the $y$-axis by a factor $\frac{1}{|b|}$ (and also reflects it over the $y$-axis if $b < 0$).'
  topic: Transformations
- term: horizontal stretch
  definition: '$y = f(bx)$ with $0 < |b| < 1$ stretches the graph away from the $y$-axis by a factor $\frac{1}{|b|}$ (and also reflects it over the $y$-axis if $b < 0$).'
  topic: Transformations
- term: composition
  aliases: [composite function]
  definition: '$(f \circ g)(x) = f(g(x))$: apply $g$ first, then $f$.'
  topic: Composition
- term: one-to-one
  definition: 'A function in which different inputs always give different outputs; it passes the horizontal line test.'
  topic: Inverse functions
- term: horizontal line test
  definition: 'A function is one-to-one exactly when no horizontal line meets its graph more than once.'
  topic: Inverse functions
- term: inverse function
  aliases: [inverse]
  definition: 'The function $f^{-1}$ that undoes $f$: $f^{-1}(y) = x$ exactly when $f(x) = y$. Its graph is the reflection of $f$ across $y = x$.'
  topic: Inverse functions
- term: polynomial function
  aliases: [polynomial, polynomials]
  definition: 'A function $a_nx^n + \dots + a_1x + a_0$ with whole-number exponents; smooth and unbroken, with domain all reals.'
  topic: Polynomial graphs
- term: degree
  definition: 'The highest power of the variable in a polynomial with a nonzero coefficient.'
  topic: Polynomial graphs
- term: leading term
  definition: 'The term of a polynomial with the highest power, $a_nx^n$; it controls end behavior.'
  topic: Polynomial graphs
- term: leading coefficient
  definition: 'The coefficient $a_n$ of the leading term.'
  topic: Polynomial graphs
- term: end behavior
  definition: 'What $f(x)$ does as $x \to \infty$ and $x \to -\infty$.'
  topic: Polynomial graphs
- term: multiplicity
  definition: 'The number of times a factor $(x - c)$ appears. Odd multiplicity: the graph crosses at $c$; even: it touches and turns.'
  topic: Polynomial graphs
- term: turning point
  aliases: [turning points]
  definition: 'A point where a graph changes from rising to falling or vice versa; degree $n$ allows at most $n - 1$.'
  topic: Polynomial graphs
- term: intermediate value theorem
  aliases: [IVT]
  definition: 'If $f$ is continuous on $[a, b]$ and $f(a)$, $f(b)$ have opposite signs, then $f$ has a zero between $a$ and $b$ (more generally, it takes every value between $f(a)$ and $f(b)$).'
  topic: Polynomial graphs
- term: division algorithm
  definition: 'For polynomials, $f(x) = d(x)q(x) + r(x)$ with $r = 0$ or $\deg r < \deg d$.'
  topic: Polynomial division
- term: quotient
  definition: 'The result $q(x)$ of dividing one polynomial by another.'
  topic: Polynomial division
- term: remainder
  definition: 'What is left over in a division, of lower degree than the divisor.'
  topic: Polynomial division
- term: synthetic division
  definition: 'A shortcut for dividing a polynomial by $x - c$ using only coefficients.'
  topic: Polynomial division
- term: remainder theorem
  definition: 'When $f(x)$ is divided by $x - c$, the remainder is $f(c)$.'
  topic: Polynomial division
- term: factor theorem
  definition: '$x - c$ is a factor of $f(x)$ exactly when $f(c) = 0$.'
  topic: Polynomial division
- term: depressed polynomial
  definition: 'The quotient left after dividing out a known zero; its degree is one less.'
  topic: Polynomial division
- term: rational zero theorem
  definition: 'If $\frac pq$ (lowest terms) is a zero of an integer-coefficient polynomial, then $p$ divides the constant term and $q$ divides the leading coefficient.'
  topic: Zeros of polynomials
- term: "Descartes' rule of signs"
  definition: 'For a polynomial with real coefficients, the number of positive real zeros (counted with multiplicity) equals the number of sign changes in its coefficients, or is less than it by an even number; apply it to $f(-x)$ for negative zeros.'
  topic: Zeros of polynomials
- term: fundamental theorem of algebra
  aliases: [FTA]
  definition: 'Every polynomial of degree $n \ge 1$ has at least one complex zero; hence exactly $n$ zeros counting multiplicity.'
  topic: Zeros of polynomials
- term: linear factorization theorem
  definition: 'A degree-$n$ polynomial factors as $a_n(x - c_1)\cdots(x - c_n)$ with complex $c_k$.'
  topic: Zeros of polynomials
- term: complex conjugate
  aliases: [conjugate]
  definition: 'The conjugate of $a + bi$ is $a - bi$.'
  topic: Zeros of polynomials
- term: conjugate pairs theorem
  definition: 'If a polynomial has real coefficients and $a + bi$ is a zero, then $a - bi$ is also a zero.'
  topic: Zeros of polynomials
- term: rational function
  aliases: [rational functions]
  definition: 'A quotient of two polynomials, $\frac{p(x)}{q(x)}$.'
  topic: Rational functions
- term: hole
  aliases: [holes]
  definition: 'A single missing point on a graph, from a factor that cancels in a rational function (a removable discontinuity).'
  topic: Rational functions
- term: vertical asymptote
  aliases: [vertical asymptotes, VA]
  definition: 'A vertical line $x = a$ near which $|f(x)| \to \infty$; for a reduced rational function, a zero of the denominator.'
  topic: Rational functions
- term: horizontal asymptote
  aliases: [horizontal asymptotes, HA]
  definition: 'A horizontal line $y = L$ that the graph approaches as $x \to \infty$ or $x \to -\infty$.'
  topic: Rational functions
- term: slant asymptote
  aliases: [oblique asymptote, slant asymptotes]
  definition: 'A non-horizontal line approached at the ends of a graph; for a rational function with numerator degree one more than the denominator, the quotient from division.'
  topic: Rational functions
- term: critical values
  aliases: [critical value, boundary points]
  definition: 'In an inequality, the zeros of the numerator and denominator, where the sign can change.'
  topic: Polynomial and rational inequalities
- term: sign chart
  definition: 'A number line marked with critical values and the sign of an expression on each interval.'
  topic: Polynomial and rational inequalities
- term: exponential function
  aliases: [exponential functions, exponential]
  definition: '$f(x) = b^x$ with $b > 0$, $b \ne 1$: the variable is in the exponent.'
  topic: Exponential functions
- term: exponential growth
  definition: 'Growth by a constant factor greater than 1 per unit of time.'
  topic: Exponential functions
- term: exponential decay
  definition: 'Shrinking by a constant factor between 0 and 1 per unit of time.'
  topic: Exponential functions
- term: principal
  definition: 'The amount of money initially invested or borrowed.'
  topic: Exponential functions
- term: compound interest
  definition: 'Interest added to the balance periodically, so later interest is earned on earlier interest: $A = P\left(1 + \frac rn\right)^{nt}$.'
  topic: Exponential functions
- term: natural base
  aliases: [e, "Euler's number"]
  definition: 'The constant $e \approx 2.71828$, the limit of $\left(1 + \frac1n\right)^n$.'
  topic: Exponential functions
- term: continuous compounding
  definition: 'Interest compounded at every instant: $A = Pe^{rt}$.'
  topic: Exponential functions
- term: natural exponential function
  definition: 'The function $e^x$.'
  topic: Exponential functions
- term: logarithm
  aliases: [logarithms, log]
  definition: '$\log_b x$ is the exponent you put on $b$ to get $x$: $\log_b x = y \iff b^y = x$.'
  topic: Logarithms
- term: common logarithm
  definition: 'The base-10 logarithm, written $\log x$.'
  topic: Logarithms
- term: natural logarithm
  aliases: [ln]
  definition: 'The base-$e$ logarithm, written $\ln x$.'
  topic: Logarithms
- term: change-of-base formula
  definition: '$\log_b x = \dfrac{\ln x}{\ln b} = \dfrac{\log x}{\log b}$.'
  topic: Logarithms
- term: extraneous solution
  aliases: [extraneous solutions, extraneous]
  definition: 'A value produced by solving that does not satisfy the original equation (for example, one that makes a log argument nonpositive).'
  topic: Exponential and logarithmic equations
- term: continuous growth rate
  definition: 'The constant $k$ in $Q = Q_0e^{kt}$; positive for growth, negative for decay.'
  topic: Exponential models
- term: doubling time
  definition: 'The time for an exponentially growing quantity to double: $\frac{\ln 2}{k}$.'
  topic: Exponential models
- term: half-life
  definition: 'The time for a decaying quantity to fall to half its amount.'
  topic: Exponential models
- term: "Newton's law of cooling"
  definition: 'An object''s temperature approaches the surrounding temperature exponentially: $T = T_s + (T_0 - T_s)e^{-kt}$.'
  topic: Exponential models
- term: logistic model
  aliases: [logistic growth, logistic function]
  definition: '$P = \dfrac{C}{1 + Ae^{-kt}}$: growth that starts nearly exponential and levels off at the carrying capacity $C$.'
  topic: Exponential models
- term: carrying capacity
  definition: 'The maximum value $C$ that a logistic model approaches.'
  topic: Exponential models
- term: radian
  aliases: [radians]
  definition: 'An angle measure: arc length divided by radius. A full turn is $2\pi$ radians, so $180^\circ = \pi$.'
  topic: Unit circle
- term: arc length
  definition: 'The length of an arc of a circle: $s = r\theta$ with $\theta$ in radians.'
  topic: Unit circle
- term: unit circle
  definition: 'The circle $x^2 + y^2 = 1$; the point at angle $\theta$ is $(\cos\theta, \sin\theta)$.'
  topic: Unit circle
- term: standard position
  definition: 'An angle with vertex at the origin and initial side on the positive $x$-axis; a vector drawn starting at the origin.'
  topic: Unit circle
- term: reciprocal functions
  definition: '$\sec\theta = \frac{1}{\cos\theta}$, $\csc\theta = \frac{1}{\sin\theta}$, $\cot\theta = \frac{\cos\theta}{\sin\theta}$.'
  topic: Unit circle
- term: reference angle
  definition: 'The acute angle between an angle''s terminal side and the $x$-axis.'
  topic: Unit circle
- term: periodic
  definition: 'A function is periodic if its values repeat at regular intervals: $f(x + p) = f(x)$.'
  topic: Trig graphs
- term: period
  definition: 'The length of the smallest interval after which a periodic function repeats; $\frac{2\pi}{|B|}$ for $\sin(Bx)$.'
  topic: Trig graphs
- term: sinusoid
  definition: 'A transformed sine or cosine curve, $y = A\sin(B(x - C)) + D$.'
  topic: Trig graphs
- term: amplitude
  definition: 'Half the distance between the maximum and minimum of a sinusoid: $|A|$.'
  topic: Trig graphs
- term: phase shift
  definition: 'The horizontal shift $C$ of a sinusoid $y = A\sin(B(x - C)) + D$.'
  topic: Trig graphs
- term: midline
  definition: 'The horizontal line $y = D$ halfway between a sinusoid''s maximum and minimum.'
  topic: Trig graphs
- term: identity
  aliases: [identities, trig identity]
  definition: 'An equation that is true for every input for which both sides are defined.'
  topic: Trig identities
- term: linear equation
  definition: 'An equation like $ax + by + cz = d$ in which each variable appears to the first power only.'
  topic: Systems and Gaussian elimination
- term: system of linear equations
  aliases: [linear system, system]
  definition: 'Several linear equations to be satisfied at the same time.'
  topic: Systems and Gaussian elimination
- term: inconsistent system
  aliases: [inconsistent]
  definition: 'A system with no solution.'
  topic: Systems and Gaussian elimination
- term: dependent system
  aliases: [dependent]
  definition: 'A consistent system with infinitely many solutions.'
  topic: Systems and Gaussian elimination
- term: matrix
  aliases: [matrices]
  definition: 'A rectangular array of numbers arranged in rows and columns.'
  topic: Systems and Gaussian elimination
- term: augmented matrix
  definition: 'The matrix of a system''s coefficients with an extra column of constants.'
  topic: Systems and Gaussian elimination
- term: row operations
  aliases: [elementary row operations, row operation]
  definition: 'Swapping two rows, multiplying a row by a nonzero constant, or adding a multiple of one row to another.'
  topic: Systems and Gaussian elimination
- term: Gaussian elimination
  definition: 'Using row operations to reach row-echelon form, then back-substituting.'
  topic: Systems and Gaussian elimination
- term: row-echelon form
  aliases: [REF]
  definition: 'A staircase matrix form: zero rows at the bottom, each pivot to the right of the one above, zeros below each pivot.'
  topic: Systems and Gaussian elimination
- term: pivot
  aliases: [leading entry]
  definition: 'The first nonzero entry in a row of a row-echelon matrix.'
  topic: Systems and Gaussian elimination
- term: back-substitution
  definition: 'Solving the last equation first and substituting upward.'
  topic: Systems and Gaussian elimination
- term: reduced row-echelon form
  aliases: [RREF]
  definition: 'Row-echelon form in which every pivot is 1 and is the only nonzero entry in its column.'
  topic: Systems and Gaussian elimination
- term: Gauss-Jordan elimination
  definition: 'Row reduction all the way to reduced row-echelon form.'
  topic: Systems and Gaussian elimination
- term: free variable
  aliases: [parameter (free variable)]
  definition: 'A variable without a pivot, which can take any value in a dependent system.'
  topic: Systems and Gaussian elimination
- term: dimensions
  definition: 'The size of a matrix, rows × columns.'
  topic: Matrix operations
- term: entry
  aliases: [entries]
  definition: 'One number in a matrix; $a_{ij}$ is in row $i$, column $j$.'
  topic: Matrix operations
- term: square matrix
  definition: 'A matrix with the same number of rows and columns.'
  topic: Matrix operations
- term: scalar
  aliases: [scalars]
  definition: 'A single real number, as opposed to a vector or matrix.'
  topic: Matrix operations
- term: zero matrix
  definition: 'A matrix whose entries are all 0, written $O$.'
  topic: Matrix operations
- term: dot product
  definition: 'Multiply matching components and add: $\vec u \cdot \vec v = u_1v_1 + u_2v_2 + \cdots$; a number.'
  topic: Dot product
- term: identity matrix
  definition: 'The square matrix $I$ with 1s on the main diagonal and 0s elsewhere; $AI = IA = A$.'
  topic: Matrix operations
- term: invertible
  aliases: [nonsingular]
  definition: 'A square matrix $A$ is invertible if some $A^{-1}$ satisfies $AA^{-1} = A^{-1}A = I$.'
  topic: Inverse matrices
- term: inverse matrix
  definition: 'The matrix $A^{-1}$ with $AA^{-1} = A^{-1}A = I$.'
  topic: Inverse matrices
- term: singular
  aliases: [singular matrix]
  definition: 'A square matrix with no inverse; its determinant is 0.'
  topic: Inverse matrices
- term: determinant
  aliases: [determinants, det]
  definition: 'A number computed from a square matrix; for $2 \times 2$, $ad - bc$. It is nonzero exactly when the matrix is invertible.'
  topic: Determinants and Cramer's rule
- term: minor
  definition: 'The determinant left after deleting an entry''s row and column.'
  topic: Determinants and Cramer's rule
- term: cofactor
  definition: 'A minor with the checkerboard sign: $C_{ij} = (-1)^{i+j}M_{ij}$.'
  topic: Determinants and Cramer's rule
- term: cofactor expansion
  definition: 'Computing a determinant by multiplying each entry of one row or column by its cofactor and adding.'
  topic: Determinants and Cramer's rule
- term: "Cramer's rule"
  definition: 'For $AX = B$ with $D = \det A \ne 0$: $x_i = \frac{D_i}{D}$, where $D_i$ replaces column $i$ with the constants.'
  topic: Determinants and Cramer's rule
- term: partial fraction decomposition
  aliases: [partial fractions]
  definition: 'Rewriting a rational expression as a sum of simpler fractions with linear or irreducible quadratic denominators.'
  topic: Partial fractions
- term: improper
  aliases: [improper fraction, improper rational expression]
  definition: 'A rational expression whose numerator degree is at least the denominator degree; divide before decomposing.'
  topic: Partial fractions
- term: proper
  aliases: [proper fraction, proper rational expression]
  definition: 'A rational expression whose numerator has lower degree than its denominator.'
  topic: Partial fractions
- term: conic sections
  aliases: [conic, conics, conic section]
  definition: 'Curves made by slicing a double cone with a plane: circles, ellipses, parabolas and hyperbolas.'
  topic: Parabolas
- term: parabola
  aliases: [parabolas]
  definition: 'The set of points equidistant from a focus and a directrix.'
  topic: Parabolas
- term: focus
  aliases: [foci]
  definition: 'A fixed point used to define a conic: one for a parabola, two for an ellipse or hyperbola.'
  topic: Parabolas
- term: directrix
  definition: 'The fixed line in the focus-directrix definition of a conic.'
  topic: Parabolas
- term: vertex
  aliases: [vertices]
  definition: 'A turning point of a parabola, or an endpoint of the major (ellipse) or transverse (hyperbola) axis.'
  topic: Parabolas
- term: axis of symmetry
  definition: 'The line through a parabola''s focus and vertex, perpendicular to the directrix.'
  topic: Parabolas
- term: focal width
  aliases: [latus rectum]
  definition: 'The length $|4p|$ of the chord through a parabola''s focus parallel to the directrix.'
  topic: Parabolas
- term: ellipse
  aliases: [ellipses]
  definition: 'The set of points whose distances to two foci add to a constant $2a$.'
  topic: Ellipses
- term: center
  definition: 'The midpoint of the foci of an ellipse or hyperbola (or the center of a circle).'
  topic: Ellipses
- term: major axis
  definition: 'The longest chord of an ellipse, through both foci; its length is $2a$.'
  topic: Ellipses
- term: minor axis
  definition: 'The chord of an ellipse through the center perpendicular to the major axis; length $2b$.'
  topic: Ellipses
- term: co-vertices
  aliases: [co-vertex]
  definition: 'The endpoints of an ellipse''s minor axis.'
  topic: Ellipses
- term: eccentricity
  definition: 'The number $e = \frac ca$ (or the focus-directrix ratio) that measures how far a conic is from circular: $e = 0$ circle, $e < 1$ ellipse, $e = 1$ parabola, $e > 1$ hyperbola.'
  topic: Ellipses
- term: circle
  definition: 'The set of points at a fixed distance $r$ from a center: $(x - h)^2 + (y - k)^2 = r^2$.'
  topic: Ellipses
- term: hyperbola
  aliases: [hyperbolas]
  definition: 'The set of points whose distances to two foci differ by a constant $2a$ in absolute value.'
  topic: Hyperbolas
- term: transverse axis
  definition: 'The segment joining a hyperbola''s two vertices.'
  topic: Hyperbolas
- term: central rectangle
  definition: 'The rectangle of sides $2a$ and $2b$ centered at a hyperbola''s center; its diagonals extend to the asymptotes.'
  topic: Hyperbolas
- term: degenerate conics
  aliases: [degenerate conic]
  definition: 'Point, line or line-pair graphs (or no graph) given by a second-degree equation.'
  topic: Identifying conics
- term: discriminant
  definition: 'For a quadratic, $b^2 - 4ac$ (its sign counts real roots). For a conic $Ax^2 + Bxy + Cy^2 + \dots = 0$, $B^2 - 4AC$: negative ellipse, zero parabola, positive hyperbola.'
  topic: Identifying conics
- term: parametric equations
  definition: 'Equations $x = f(t)$, $y = g(t)$ giving both coordinates in terms of a parameter.'
  topic: Parametric equations
- term: parameter
  definition: 'The third variable (often $t$) in parametric equations; it orders the points of the curve.'
  topic: Parametric equations
- term: orientation
  definition: 'The direction a parametric curve is traced as the parameter increases.'
  topic: Parametric equations
- term: polar coordinates
  definition: 'Coordinates $(r, \theta)$: distance $r$ from the pole in direction $\theta$.'
  topic: Polar coordinates
- term: pole
  definition: 'The origin of a polar coordinate system.'
  topic: Polar coordinates
- term: polar axis
  definition: 'The ray from the pole (the positive $x$-axis) from which polar angles are measured.'
  topic: Polar coordinates
- term: limaçon
  aliases: [limacon]
  definition: 'A polar curve $r = a + b\cos\theta$ or $a + b\sin\theta$.'
  topic: Polar coordinates
- term: cardioid
  definition: 'A heart-shaped limaçon, with $|a| = |b|$, passing through the pole.'
  topic: Polar coordinates
- term: rose curve
  aliases: [rose]
  definition: 'A polar curve $r = a\cos n\theta$ or $a\sin n\theta$ with integer $n \ge 2$: $n$ petals if $n$ is odd, $2n$ if $n$ is even.'
  topic: Polar coordinates
- term: vector
  aliases: [vectors]
  definition: 'A quantity with both magnitude and direction, drawn as an arrow or written $\langle a, b \rangle$.'
  topic: Vectors
- term: directed line segment
  definition: 'A segment with an initial point and a terminal point, representing a vector.'
  topic: Vectors
- term: magnitude
  definition: 'The length of a vector: $\lVert\langle a, b\rangle\rVert = \sqrt{a^2 + b^2}$.'
  topic: Vectors
- term: component form
  definition: 'Writing a vector as $\langle a, b \rangle$ (or $\langle a, b, c \rangle$), the coordinates of its tip in standard position.'
  topic: Vectors
- term: resultant
  definition: 'The sum of two or more vectors, such as a net force or a ground velocity.'
  topic: Vectors
- term: unit vector
  aliases: [unit vectors]
  definition: 'A vector of magnitude 1; $\frac{\vec v}{\lVert\vec v\rVert}$ points the same way as $\vec v$.'
  topic: Vectors
- term: direction angle
  definition: 'The angle a vector makes counterclockwise from the positive $x$-axis.'
  topic: Vectors
- term: orthogonal
  definition: 'Perpendicular; two vectors are orthogonal when their dot product is 0.'
  topic: Dot product
- term: vector projection
  aliases: [projection]
  definition: 'The part of $\vec u$ along $\vec v$: $\text{proj}_{\vec v}\vec u = \frac{\vec u \cdot \vec v}{\lVert\vec v\rVert^2}\vec v$.'
  topic: Dot product
- term: scalar projection
  aliases: [component of u along v]
  definition: 'The signed length $\frac{\vec u \cdot \vec v}{\lVert\vec v\rVert}$ of the projection of $\vec u$ on $\vec v$.'
  topic: Dot product
- term: work
  definition: 'Force times displacement in the direction of motion: $W = \vec F \cdot \vec d$.'
  topic: Dot product
- term: cross product
  definition: 'For 3D vectors, $\vec u \times \vec v$, a vector orthogonal to both, with magnitude equal to the area of their parallelogram.'
  topic: Vectors in 3D
- term: sequence
  aliases: [sequences]
  definition: 'A function whose domain is the positive integers (or another run of consecutive integers, such as $0, 1, 2, \dots$), written $a_1, a_2, a_3, \dots$'
  topic: Sequences and series
- term: term
  aliases: [terms]
  definition: 'One entry $a_n$ of a sequence (or one addend of a sum).'
  topic: Sequences and series
- term: explicit formula
  definition: 'A formula that gives $a_n$ directly from $n$.'
  topic: Sequences and series
- term: recursive formula
  definition: 'A starting term plus a rule giving each term from earlier ones.'
  topic: Sequences and series
- term: Fibonacci sequence
  definition: '$1, 1, 2, 3, 5, 8, \dots$, where each term is the sum of the two before it.'
  topic: Sequences and series
- term: factorial
  definition: '$n! = n(n - 1)\cdots 2 \cdot 1$, with $0! = 1$.'
  topic: Sequences and series
- term: series
  definition: 'The sum of the terms of a sequence.'
  topic: Sequences and series
- term: sigma notation
  aliases: [summation notation]
  definition: '$\sum_{k=1}^{n} a_k$, shorthand for $a_1 + a_2 + \dots + a_n$.'
  topic: Sequences and series
- term: index of summation
  definition: 'The variable (such as $k$) that runs through the integer values in sigma notation.'
  topic: Sequences and series
- term: arithmetic sequence
  aliases: [arithmetic sequences, arithmetic series]
  definition: 'A sequence with a constant difference $d$: $a_n = a_1 + (n - 1)d$.'
  topic: Arithmetic sequences
- term: common difference
  definition: 'The constant $d = a_{n+1} - a_n$ of an arithmetic sequence.'
  topic: Arithmetic sequences
- term: geometric sequence
  aliases: [geometric sequences, geometric series]
  definition: 'A sequence with a constant ratio $r$: $a_n = a_1r^{n-1}$.'
  topic: Geometric sequences
- term: common ratio
  definition: 'The constant $r = \frac{a_{n+1}}{a_n}$ of a geometric sequence.'
  topic: Geometric sequences
- term: converges
  aliases: [convergent, converge]
  definition: 'An infinite series converges if its partial sums approach a finite number.'
  topic: Geometric sequences
- term: diverges
  aliases: [divergent, diverge]
  definition: 'An infinite series diverges if its partial sums do not approach a finite number.'
  topic: Geometric sequences
- term: mathematical induction
  aliases: [induction]
  definition: 'Proving $P(n)$ for all $n \ge n_0$ by proving a base case and that $P(k)$ implies $P(k + 1)$.'
  topic: Mathematical induction
- term: base case
  definition: 'The first statement, such as $P(1)$, checked directly in an induction proof.'
  topic: Mathematical induction
- term: inductive step
  definition: 'The part of an induction proof showing that $P(k)$ implies $P(k + 1)$.'
  topic: Mathematical induction
- term: inductive hypothesis
  definition: 'The assumption that $P(k)$ is true, used to prove $P(k + 1)$.'
  topic: Mathematical induction
- term: "Pascal's triangle"
  definition: 'The triangle of binomial coefficients, where each entry is the sum of the two above it.'
  topic: Binomial theorem
- term: binomial coefficient
  aliases: [binomial coefficients, n choose k]
  definition: '$\binom nk = \frac{n!}{k!(n - k)!}$, the coefficient of $a^{n-k}b^k$ in $(a + b)^n$ and the number of ways to choose $k$ of $n$ items.'
  topic: Binomial theorem
- term: general term
  definition: 'In $(a + b)^n$, the term $\binom nk a^{n-k}b^k$ (the $(k + 1)$st term).'
  topic: Binomial theorem
- term: binomial theorem
  definition: '$(a + b)^n = \sum_{k=0}^{n}\binom nk a^{n-k}b^k$.'
  topic: Binomial theorem
- term: fundamental counting principle
  aliases: [counting principle, multiplication principle]
  definition: 'If a task has stages with $m_1, m_2, \dots$ choices, the total number of ways is $m_1 m_2\cdots$.'
  topic: Counting
- term: permutation
  aliases: [permutations]
  definition: 'An ordered arrangement; $_nP_r = \frac{n!}{(n - r)!}$.'
  topic: Counting
- term: combination
  aliases: [combinations]
  definition: 'An unordered selection; $_nC_r = \frac{n!}{r!(n - r)!}$.'
  topic: Counting
- term: sample space
  definition: 'The set of all possible outcomes of an experiment.'
  topic: Probability
- term: event
  aliases: [events]
  definition: 'A set of outcomes from the sample space.'
  topic: Probability
- term: complement
  definition: 'The event "not $E$": all outcomes not in $E$; $P(\text{not } E) = 1 - P(E)$.'
  topic: Probability
- term: mutually exclusive
  aliases: [disjoint]
  definition: 'Events that cannot happen at the same time: $P(A \text{ and } B) = 0$.'
  topic: Probability
- term: independent
  aliases: [independent events]
  definition: 'Events where one happening does not change the probability of the other: $P(A \text{ and } B) = P(A)P(B)$.'
  topic: Probability
- term: limit
  aliases: [limits]
  definition: '$\lim_{x\to a}f(x) = L$ means $f(x)$ gets as close to $L$ as we like when $x$ is close enough to (but not equal to) $a$.'
  topic: Limits
- term: left-hand limit
  definition: '$\lim_{x\to a^-}f(x)$, the limit using only $x < a$.'
  topic: Limits
- term: right-hand limit
  definition: '$\lim_{x\to a^+}f(x)$, the limit using only $x > a$.'
  topic: Limits
- term: continuous
  aliases: [continuity]
  definition: '$f$ is continuous at $a$ if $\lim_{x\to a}f(x) = f(a)$: the graph has no break there.'
  topic: Limits
- term: discontinuity
  aliases: [discontinuous]
  definition: 'A point where a function is not continuous: a hole, a jump, or a vertical asymptote.'
  topic: Limits
- term: removable discontinuity
  definition: 'A hole: the limit exists but $f(a)$ is undefined or different; redefining one point fixes it.'
  topic: Limits
- term: direct substitution
  definition: 'Finding a limit by plugging in $x = a$; valid when $f$ is continuous at $a$.'
  topic: Limits
- term: indeterminate form
  aliases: [indeterminate]
  definition: 'An expression like $\frac00$ from substitution that does not determine the limit; more algebra is needed.'
  topic: Limits
- term: tangent line
  aliases: [tangent]
  definition: 'The line through a point on a curve with the curve''s slope there; the limit of secant lines.'
  topic: The derivative
- term: derivative
  definition: '$f''(a) = \lim_{h\to0}\frac{f(a + h) - f(a)}{h}$, the slope of the tangent line at $a$.'
  topic: The derivative
- term: instantaneous rate of change
  definition: 'The rate of change at a single instant, given by the derivative.'
  topic: The derivative
- term: derivative function
  definition: '$f''(x)$, giving the slope of $f$ at each $x$.'
  topic: The derivative
- term: SOH-CAH-TOA
  definition: 'Memory aid for right-triangle trig: Sine = Opposite/Hypotenuse, Cosine = Adjacent/Hypotenuse, Tangent = Opposite/Adjacent.'
  topic: Unit circle
- term: ASTC
  aliases: [All Students Take Calculus]
  definition: 'Memory aid for which trig functions are positive in Quadrants I–IV: All, Sine, Tangent, Cosine.'
  topic: Unit circle
- term: point-slope form
  definition: 'The line through $(x_1, y_1)$ with slope $m$: $y - y_1 = m(x - x_1)$.'
  topic: The derivative
- term: interval
  aliases: [intervals]
  definition: 'A connected set of real numbers, such as $[a, b]$ or $(a, \infty)$.'
  topic: Domain and range
- term: irreducible quadratic
  aliases: [irreducible]
  definition: 'A quadratic with no real zeros (negative discriminant), so it has no real linear factors.'
  topic: Partial fractions
- term: annuity
  definition: 'A series of equal regular payments or deposits; its value is a geometric series.'
  topic: Geometric sequences
- term: telescoping sum
  aliases: [telescoping]
  definition: 'A sum in which consecutive terms cancel, leaving only a few terms, as in $\sum\left(\frac1k - \frac1{k+1}\right)$.'
  topic: Partial fractions
- term: cofunction
  definition: 'Sine and cosine (likewise tangent and cotangent) are cofunctions: $\cos x = \sin\left(\frac{\pi}{2} - x\right)$.'
  topic: Trig identities
- term: inverse trig functions
  aliases: [arcsin, arccos, arctan]
  definition: '$\sin^{-1}$, $\cos^{-1}$, $\tan^{-1}$: inverses of trig functions on restricted domains, returning angles.'
  topic: Trig graphs
- term: asymptote
  aliases: [asymptotes]
  definition: 'A line that a graph approaches more and more closely.'
  topic: Rational functions
- term: polar form of a complex number
  aliases: [trigonometric form]
  definition: '$z = r(\cos\theta + i\sin\theta)$, where the modulus $r = |z|$ is the distance from 0 to $z$ in the complex plane and the argument $\theta$ is its direction angle.'
  topic: Polar coordinates
- term: "De Moivre's theorem"
  definition: 'If $z = r(\cos\theta + i\sin\theta)$ and $n$ is a positive integer, then $z^n = r^n(\cos n\theta + i\sin n\theta)$.'
  topic: Polar coordinates
