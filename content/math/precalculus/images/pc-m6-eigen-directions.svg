ily="Helvetica, Arial, sans-serif">by 2 along its line.</text><text x="338.0" y="260.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">u = (0, 1) is turned</text><text x="338.0" y="280.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">off its line: u is not</text><text x="338.0" y="300.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">an eigenvector.</text><text x="338.0" y="330.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">Dashed: the two</text><text x="338.0" y="350.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">eigenvector lines.</text></svg>