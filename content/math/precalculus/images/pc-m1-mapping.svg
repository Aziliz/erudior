<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="sans-serif" role="img"><title>Mapping diagram for f(x) = x squared</title><rect width="600" height="380" fill="#ffffff"/>
