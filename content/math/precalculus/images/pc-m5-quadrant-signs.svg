<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="440" height="420" role="img"><title>The four quadrants, the signs of x and y, and which trig functions are positive in each</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="440" height="420" fill="#ffffff"/><rect x="220" y="25" width="180" height="180" fill="#dcf0e3"/><rect x="40" y="25" width="180" height="180" fill="#dde8f3"/><rect x="40" y="205" width="180" height="180" fill="#f7ebcf"/><rect x="220" y="205" width="180" height="180" fill="#e8e2f3"/><line x1="30.0" y1="205.0" x2="410.0" y2="205.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><line x1="220.0" y1="395.0" x2="220.0" y2="18.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="420.0" y="211.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">x</text><text x="230.0" y="22.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">y</text><text x="315.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Quadrant I</text><text x="315.0" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x &gt; 0, y &gt; 0</text><text x="315.0" y="104.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">all positive</text><text x="125.0" y="60.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Quadrant II</text><text x="125.0" y="82.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x &lt; 0, y &gt; 0</text><text x="125.0" y="104.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">sin positive</text><text x="125.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Quadrant III</text><text x="125.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x &lt; 0, y &lt; 0</text><text x="125.0" y="374.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">tan positive</text><text x="315.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Quadrant IV</text><text x="315.0" y="352.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x &gt; 0, y &lt; 0</text><text x="315.0" y="374.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">cos positive</text><line x1="220.0" y1="205.0" x2="90.1" y2="130.0" stroke="#b03a2e" stroke-width="3"/><circle cx="90.1" cy="130.0" r="5" fill="#b03a2e" stroke="#1c2833" stroke-width="1.5"/><path d="M 250 205 A 30 30 0 0 0 194.0 190.0" fill="none" stroke="#1c2833" stroke-width="1.5"/><path d="M 150 205 A 70 70 0 0 1 159.4 170.0" fill="none" stroke="#b03a2e" stroke-width="3"/><text x="250.0" y="171.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">150°</text><text x="120.0" y="191.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">30°</text><text x="220.0" y="416.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">Example: 150° has reference angle 30° (red), measured to the x-axis</text></svg>