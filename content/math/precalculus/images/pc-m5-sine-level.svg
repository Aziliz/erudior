<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 395" width="520" height="395" role="img"><title>The two angles in one turn whose sine equals c</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="520" height="395" fill="#ffffff"/><line x1="90.0" y1="200.0" x2="435.0" y2="200.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><line x1="260.0" y1="350.0" x2="260.0" y2="35.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="442.0" y="206.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">x</text><text x="268.0" y="32.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">y</text><circle cx="260" cy="200" r="140" fill="none" stroke="#1c2833" stroke-width="2"/><line x1="60.0" y1="137.0" x2="452.0" y2="137.0" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="9 6"/><text x="458.0" y="142.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">y = c</text><line x1="260.0" y1="200.0" x2="385.0" y2="137.0" stroke="#2e6da4" stroke-width="3"/><line x1="260.0" y1="200.0" x2="135.0" y2="137.0" stroke="#2e6da4" stroke-width="3"/><circle cx="385.0" cy="137.0" r="6" fill="#b03a2e" stroke="#1c2833" stroke-width="1.5"/><circle cx="135.0" cy="137.0" r="6" fill="#b03a2e" stroke="#1c2833" stroke-width="1.5"/><path d="M 300 200 A 40 40 0 0 0 295.7 182.0" fill="none" stroke="#1c2833" stroke-width="2"/><text x="308.0" y="194.0" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">α</text><path d="M 288 200 A 28 28 0 0 0 235.0 187.4" fill="none" stroke="#2e6da4" stroke-width="2"/><text x="389.0" y="121.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">angle α = sin⁻¹ c</text><text x="131.0" y="121.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="end" font-weight="normal" font-style="normal">angle π − α</text><text x="260.0" y="387.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">Both points have height c, so sin α = sin(π − α) = c</text></svg>