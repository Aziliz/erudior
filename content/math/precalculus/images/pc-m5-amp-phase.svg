<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img"><title>The point (a, b) gives the amplitude R and phase angle φ</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="440" height="330" fill="#ffffff"/><line x1="40.0" y1="270.0" x2="410.0" y2="270.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><line x1="70.0" y1="300.0" x2="70.0" y2="25.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><path d="M 70 270 L 304.0 270 L 304.0 93.2 Z" fill="#f7ebcf" stroke="none"/><line x1="70.0" y1="270.0" x2="304.0" y2="270.0" stroke="#2e6da4" stroke-width="4"/><line x1="304.0" y1="270.0" x2="304.0" y2="93.2" stroke="#b03a2e" stroke-width="4"/><line x1="70.0" y1="270.0" x2="304.0" y2="93.2" stroke="#1c2833" stroke-width="3"/><rect x="290.0" y="256" width="14" height="14" fill="none" stroke="#1c2833" stroke-width="1.5"/><circle cx="304.0" cy="93.2" r="6" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><path d="M 118 270 A 48 48 0 0 0 108.3 241.1" fill="none" stroke="#1c2833" stroke-width="2"/><text x="187.0" y="294.0" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">a  (coefficient of sin x)</text><text x="314.0" y="186.6" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">b</text><text x="314.0" y="206.6" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">(coefficient</text><text x="314.0" y="224.6" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">of cos x)</text><text x="240.0" y="232.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">R = √(a² + b²)</text><text x="136.4" y="253.7" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">φ</text><text x="314.0" y="85.2" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">(a, b)</text><text x="220.0" y="20.0" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">a sin x + b cos x = R sin(x + φ)</text></svg>