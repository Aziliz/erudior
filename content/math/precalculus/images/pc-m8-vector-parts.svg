<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img"><title>The parts of a vector from P to Q</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#244d76"/></marker></defs><rect x="0" y="0" width="520" height="360" fill="#ffffff"/><line x1="90.0" y1="290.0" x2="410.0" y2="290.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5"/><line x1="410.0" y1="290.0" x2="410.0" y2="90.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5"/><polyline points="396,290 396,276 410,276" fill="none" stroke="#1c2833" stroke-width="1.5"/><path d="M145.0,290.0 A55,55 0 0,0 136.6,260.9" fill="none" stroke="#1c2833" stroke-width="1.8"/><line x1="90.0" y1="290.0" x2="410.0" y2="90.0" stroke="#244d76" stroke-width="3.5" marker-end="url(#ahb)"/><circle cx="90.0" cy="290.0" r="5" fill="#1c2833"/><text x="95.0" y="318.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">initial point P(x₁, y₁)</text><text x="400.0" y="58.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">terminal point</text><text x="400.0" y="77.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Q(x₂, y₂)</text><text x="310.0" y="318.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">a = x₂ − x₁</text><text x="420.0" y="195.0" font-size="16" text-anchor="start" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">b = y₂ − y₁</text><text x="162.0" y="278.0" font-size="18" text-anchor="middle" fill="#1c2833" font-weight="normal" font-style="italic" font-family="Helvetica, Arial, sans-serif">θ</text><text x="205.0" y="160.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">magnitude</text><text x="205.0" y="180.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="normal" font-family="Helvetica, Arial, sans-serif">‖PQ‖ = √(a² + b²)</text></svg>