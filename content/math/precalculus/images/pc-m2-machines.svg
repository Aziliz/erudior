<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 215" width="720" height="215" role="img"><title>Composition as two machines in a row</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="720" height="215" fill="#ffffff"/><circle cx="50" cy="120" r="28" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="50" y="127" font-size="20" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2</text><text x="50" y="176" font-size="15" text-anchor="middle" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">input x</text><line x1="80" y1="120" x2="128" y2="120" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="132" y="75.0" width="160" height="90" rx="12" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="212.0" y="116" font-size="18" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">g</text><text x="212.0" y="140" font-size="16" text-anchor="middle" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">g(x) = 3x − 2</text><line x1="294" y1="120" x2="330" y2="120" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="362" cy="120" r="28" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="362" y="127" font-size="20" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">4</text><text x="362" y="176" font-size="15" text-anchor="middle" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">g(2)</text><line x1="392" y1="120" x2="428" y2="120" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="432" y="75.0" width="160" height="90" rx="12" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="512.0" y="116" font-size="18" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">f</text><text x="512.0" y="140" font-size="16" text-anchor="middle" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">f(x) = x² + 1</text><line x1="594" y1="120" x2="630" y2="120" stroke="#1c2833" stroke-width="2.5" marker-end="url(#arrow)"/><circle cx="664" cy="120" r="28" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="664" y="127" font-size="20" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">17</text><text x="664" y="176" font-size="15" text-anchor="middle" fill="#1c2833" font-family="Helvetica, Arial, sans-serif">f(g(2))</text><text x="360" y="30" font-size="17" text-anchor="middle" fill="#1c2833" font-weight="bold" font-family="Helvetica, Arial, sans-serif">f(g(2)): the inner function g acts first</text></svg>