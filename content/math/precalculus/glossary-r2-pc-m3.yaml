# Round 2 glossary entries for module pc-m3 (honors lessons 14h1-14h3)
- term: depressed cubic
  aliases: [depressed cubics]
  definition: 'A cubic with no squared term, $t^3 + pt + q$. Any cubic $x^3 + bx^2 + cx + d$ becomes one after the shift $x = t - \tfrac b3$.'
  topic: Cubic equations
- term: Cardano's formula
  aliases: [Cardano’s formula, cubic formula]
  definition: 'The solution $t = \sqrt[3]{-\tfrac q2 + \sqrt D} + \sqrt[3]{-\tfrac q2 - \sqrt D}$ of $t^3 + pt + q = 0$, where $D = \left(\tfrac q2\right)^2 + \left(\tfrac p3\right)^3$. Published by Gerolamo Cardano in 1545.'
  topic: Cubic equations
- term: casus irreducibilis
  aliases: [irreducible case]
  definition: 'The case $D < 0$ of a cubic: it has three different real roots, but Cardano''s formula can reach them only through non-real cube roots.'
  topic: Cubic equations
- term: discriminant of a cubic
  aliases: [cubic discriminant]
  definition: 'For $t^3 + pt + q$, the number $\Delta = -4p^3 - 27q^2$. $\Delta > 0$: three different real roots; $\Delta = 0$: a repeated root; $\Delta < 0$: one real root.'
  topic: Cubic equations
- term: polynomial interpolation
  definition: 'Finding a polynomial whose graph passes through given points. For $n + 1$ points with different $x$-values there is exactly one of degree at most $n$.'
  topic: Polynomial interpolation
- term: interpolating polynomial
  aliases: [interpolating polynomials]
  definition: 'The unique polynomial of degree at most $n$ that passes through $n + 1$ given points with different $x$-values.'
  topic: Polynomial interpolation
- term: Lagrange basis polynomial
  aliases: [Lagrange basis polynomials, Lagrange form, Lagrange's formula]
  definition: 'For data $x$-values $x_0, \dots, x_n$, the polynomial $L_k(x) = \prod_{j \ne k} \dfrac{x - x_j}{x_k - x_j}$, which is 1 at $x_k$ and 0 at the other $x_j$. The interpolating polynomial is $\sum y_k L_k(x)$.'
  topic: Polynomial interpolation
- term: Newton form
  aliases: [Newton's form]
  definition: 'Writing an interpolating polynomial as $c_0 + c_1(x - x_0) + c_2(x - x_0)(x - x_1) + \cdots$, so each new data point adds one term without changing the earlier coefficients.'
  topic: Polynomial interpolation
- term: secret sharing
  aliases: [Shamir secret sharing]
  definition: 'A scheme (Adi Shamir, 1979) that hides a secret as $p(0)$ for a random polynomial $p$ and hands out points on its graph; enough points recover $p$ and the secret, fewer reveal nothing.'
  topic: Polynomial interpolation
- term: Runge's phenomenon
  aliases: [Runge’s phenomenon]
  definition: 'The large oscillations, near the ends of the interval, of high-degree polynomials interpolated at equally spaced points (Carl Runge, 1901).'
  topic: Polynomial interpolation
- term: focal length
  definition: 'For a thin lens, the distance $f$ from the lens to the point where incoming parallel rays focus. In the thin-lens model, $\tfrac{1}{d_o} + \tfrac{1}{d_i} = \tfrac1f$.'
  topic: Linear fractional functions
