# Functions and notation / domain and range
- front: 'Definition of a function'
  back: 'A relation in which every input has exactly one output.'
  topic: 'Functions and notation'
- front: 'Vertical line test'
  back: 'A graph is a function exactly when no vertical line meets it more than once.'
  topic: 'Functions and notation'
- front: 'How do you evaluate $f(a + h)$?'
  back: 'Replace every $x$ in the formula with $(a + h)$, parentheses included, then simplify.'
  topic: 'Functions and notation'
- front: 'Three common domain restrictions'
  back: 'Denominator $\ne 0$; even-root radicand $\ge 0$; log argument $> 0$.'
  topic: 'Domain and range'
- front: 'Domain of $\sqrt[3]{x - 7}$'
  back: 'All real numbers: odd roots accept negatives.'
  topic: 'Domain and range'
- front: 'Three ways to find a range'
  back: 'Read the graph''s vertical shadow; use bounds on the building blocks (squares, roots $\ge 0$); or solve $y = f(x)$ for $x$.'
  topic: 'Domain and range'
- front: 'Interval notation for $-1 < x \le 4$'
  back: '$(-1, 4]$: parenthesis excludes, bracket includes.'
  topic: 'Domain and range'
# Piecewise
- front: 'Evaluating a piecewise function'
  back: 'First decide which condition the input satisfies, then use only that formula.'
  topic: 'Piecewise functions'
- front: 'Piecewise form of $|x|$'
  back: '$x$ if $x \ge 0$; $-x$ if $x < 0$.'
  topic: 'Piecewise functions'
- front: 'Solving $|A| = c$'
  back: 'If $c > 0$: $A = c$ or $A = -c$. If $c < 0$: no solution. If $c = 0$: $A = 0$.'
  topic: 'Piecewise functions'
- front: 'Floor of a negative: $\lfloor -2.5 \rfloor$'
  back: '$-3$ (floor rounds toward $-\infty$).'
  topic: 'Piecewise functions'
- front: 'Where is $f(x) > 0$ on a graph?'
  back: 'The $x$-intervals where the graph is above the $x$-axis.'
  topic: 'Reading graphs'
# Behavior / rate
- front: 'Vertex of $ax^2 + bx + c$'
  back: '$x = -\dfrac{b}{2a}$; a minimum if $a > 0$, a maximum if $a < 0$.'
  topic: 'Function behavior'
- front: 'Increasing on an interval'
  back: 'The graph rises left to right: $x_1 < x_2 \Rightarrow f(x_1) < f(x_2)$. Report open $x$-intervals.'
  topic: 'Function behavior'
- front: 'Local vs absolute maximum'
  back: 'Local: highest nearby (a hilltop). Absolute: highest on the whole domain.'
  topic: 'Function behavior'
- front: 'Average rate of change'
  back: '$\dfrac{f(b) - f(a)}{b - a}$, the slope of the secant line.'
  topic: 'Average rate of change'
- front: 'Difference quotient'
  back: '$\dfrac{f(x + h) - f(x)}{h}$; expand, cancel terms without $h$, then divide by $h$.'
  topic: 'Average rate of change'
- front: 'Difference quotient of $x^2$'
  back: '$2x + h$'
  topic: 'Average rate of change'
# Parent functions
- front: 'Domain and range of $\sqrt{x}$'
  back: 'Domain $[0, \infty)$, range $[0, \infty)$.'
  topic: 'Parent functions'
- front: 'Domain and range of $\dfrac1x$'
  back: 'Domain $x \ne 0$, range $y \ne 0$; asymptotes $x = 0$ and $y = 0$.'
  topic: 'Parent functions'
- front: 'Range of $\dfrac{1}{x^2}$'
  back: '$(0, \infty)$'
  topic: 'Parent functions'
- front: 'Two points on $x^2$, $x^3$, $\sqrt x$ and $|x|$'
  back: '$(0, 0)$ and $(1, 1)$.'
  topic: 'Parent functions'
- front: 'Even function test'
  back: '$f(-x) = f(x)$; symmetric about the $y$-axis.'
  topic: 'Even and odd functions'
- front: 'Odd function test'
  back: '$f(-x) = -f(x)$; symmetric about the origin (and $f(0) = 0$ if defined).'
  topic: 'Even and odd functions'
- front: 'Even/odd shortcut for polynomials'
  back: 'All even powers (constants count): even. All odd powers: odd. A mix: neither.'
  topic: 'Even and odd functions'
# Transformations
- front: '$y = f(x - h) + k$'
  back: 'Shift right $h$ and up $k$.'
  topic: 'Transformations'
- front: '$-f(x)$ vs $f(-x)$'
  back: '$-f(x)$ reflects over the $x$-axis; $f(-x)$ reflects over the $y$-axis.'
  topic: 'Transformations'
- front: '$y = f(2x)$'
  back: 'Horizontal compression by a factor $\frac12$ (inside changes act opposite).'
  topic: 'Transformations'
- front: 'Point map for $y = af(b(x - h)) + k$'
  back: '$(p, q) \mapsto \left(\frac pb + h,\ aq + k\right)$.'
  topic: 'Transformations'
- front: 'Shift in $\sqrt{3x - 6}$'
  back: 'Factor first: $\sqrt{3(x - 2)}$, so right 2 (not 6).'
  topic: 'Transformations'
- front: 'Order of transformations'
  back: 'Stretch/reflect before shifting (multiply, then add).'
  topic: 'Transformations'
# Composition
- front: '$(f \circ g)(x)$'
  back: '$f(g(x))$: apply $g$ first, then $f$.'
  topic: 'Composition'
- front: 'Domain of $f \circ g$'
  back: '$x$ in the domain of $g$ AND $g(x)$ in the domain of $f$.'
  topic: 'Composition'
- front: 'Domain of $\frac fg$'
  back: 'Both domains, and $g(x) \ne 0$.'
  topic: 'Combining functions'
- front: '$\sqrt{x^2}$'
  back: '$|x|$'
  topic: 'Composition'
- front: 'Decompose $(5x + 1)^7$'
  back: 'Inner $g(x) = 5x + 1$, outer $f(x) = x^7$.'
  topic: 'Composition'
# Inverses
- front: 'When does $f^{-1}$ exist?'
  back: 'When $f$ is one-to-one (passes the horizontal line test).'
  topic: 'Inverse functions'
- front: 'Steps to find $f^{-1}$'
  back: 'Write $y = f(x)$, swap $x$ and $y$, solve for $y$.'
  topic: 'Inverse functions'
- front: 'Graph of $f^{-1}$'
  back: 'The reflection of $f$ across $y = x$; $(a, b) \to (b, a)$.'
  topic: 'Inverse functions'
- front: 'Domain of $f^{-1}$'
  back: 'The range of $f$ (and range of $f^{-1}$ = domain of $f$).'
  topic: 'Inverse functions'
- front: 'Is $f^{-1}(x) = \frac{1}{f(x)}$?'
  back: 'No. The $-1$ is notation for the inverse, not a reciprocal.'
  topic: 'Inverse functions'
# Polynomials
- front: 'End behavior of a polynomial'
  back: 'Same as its leading term $a_nx^n$: even degree, both ends match; odd degree, ends opposite; $a_n < 0$ flips.'
  topic: 'Polynomial graphs'
- front: 'Odd vs even multiplicity'
  back: 'Odd: graph crosses the axis. Even: graph touches and turns.'
  topic: 'Polynomial graphs'
- front: 'Maximum turning points'
  back: 'Degree $n$ has at most $n - 1$ turning points.'
  topic: 'Polynomial graphs'
- front: 'Intermediate value theorem'
  back: 'Continuous $f$ with $f(a)$, $f(b)$ of opposite signs has a zero between $a$ and $b$.'
  topic: 'Polynomial graphs'
- front: 'Division algorithm'
  back: '$f = dq + r$ with $r = 0$ or $\deg r < \deg d$.'
  topic: 'Polynomial division'
- front: 'Remainder theorem'
  back: 'Dividing $f(x)$ by $x - c$ leaves remainder $f(c)$.'
  topic: 'Polynomial division'
- front: 'Factor theorem'
  back: '$x - c$ is a factor of $f(x)$ $\iff$ $f(c) = 0$.'
  topic: 'Polynomial division'
- front: 'Synthetic division by $x + 4$'
  back: 'Use $c = -4$ and include 0 placeholders for missing powers.'
  topic: 'Polynomial division'
- front: 'Rational zero candidates'
  back: '$\pm\dfrac{\text{factors of the constant}}{\text{factors of the leading coefficient}}$'
  topic: 'Zeros of polynomials'
- front: 'Fundamental theorem of algebra'
  back: 'Degree $n \ge 1$ has exactly $n$ complex zeros counting multiplicity.'
  topic: 'Zeros of polynomials'
- front: 'Conjugate pairs theorem'
  back: 'Real coefficients: if $a + bi$ is a zero, so is $a - bi$.'
  topic: 'Zeros of polynomials'
- front: 'Quadratic factor from $a \pm bi$'
  back: '$x^2 - 2ax + (a^2 + b^2)$'
  topic: 'Zeros of polynomials'
- front: 'Descartes'' rule of signs'
  back: 'Positive zeros = number of sign changes, or less by an even number.'
  topic: 'Zeros of polynomials'
# Rational functions
- front: 'Hole vs vertical asymptote'
  back: 'A factor that cancels gives a hole; a remaining denominator zero gives a vertical asymptote.'
  topic: 'Rational functions'
- front: 'Horizontal asymptote, $\deg p < \deg q$'
  back: '$y = 0$'
  topic: 'Rational functions'
- front: 'Horizontal asymptote, $\deg p = \deg q$'
  back: '$y = \dfrac{\text{leading coeff of } p}{\text{leading coeff of } q}$'
  topic: 'Rational functions'
- front: 'Slant asymptote'
  back: 'When $\deg p = \deg q + 1$: the quotient of $p \div q$ (drop the remainder).'
  topic: 'Rational functions'
- front: 'Can a graph cross an asymptote?'
  back: 'It can cross a horizontal (or slant) asymptote, never a vertical one.'
  topic: 'Rational functions'
- front: 'y-coordinate of a hole'
  back: 'Plug the $x$-value into the simplified (cancelled) formula.'
  topic: 'Rational functions'
- front: 'Graphing routine for rational functions'
  back: 'Factor; holes; vertical asymptotes; horizontal/slant asymptote; intercepts; sign chart; sketch.'
  topic: 'Rational functions'
# Inequalities
- front: 'Solving a polynomial or rational inequality'
  back: 'Get 0 on one side, factor, mark critical values, test each interval with a sign chart.'
  topic: 'Polynomial and rational inequalities'
- front: 'Why not multiply by $x - 3$ in an inequality?'
  back: 'Its sign is unknown, so you don''t know whether to flip the inequality.'
  topic: 'Polynomial and rational inequalities'
- front: 'Endpoints in rational inequalities'
  back: 'Include numerator zeros for $\le$/$\ge$; never include denominator zeros.'
  topic: 'Polynomial and rational inequalities'
- front: 'Solve $(x - 2)^2(x + 1) \le 0$'
  back: '$(-\infty, -1] \cup \{2\}$ (even power: no sign change; isolated point).'
  topic: 'Polynomial and rational inequalities'
# Exponential
- front: 'Key facts about $b^x$'
  back: 'Passes through $(0, 1)$; range $(0, \infty)$; asymptote $y = 0$; grows if $b > 1$, decays if $0 < b < 1$.'
  topic: 'Exponential functions'
- front: 'Compound interest formula'
  back: '$A = P\left(1 + \frac rn\right)^{nt}$'
  topic: 'Exponential functions'
- front: 'Continuous compounding'
  back: '$A = Pe^{rt}$'
  topic: 'Exponential functions'
- front: 'Definition of $e$'
  back: '$e = \lim\limits_{n\to\infty}\left(1 + \frac1n\right)^n \approx 2.71828$'
  topic: 'Exponential functions'
- front: 'Asymptote of $y = ab^{x - h} + k$'
  back: '$y = k$'
  topic: 'Exponential functions'
- front: 'A 20% decrease per year as a factor'
  back: 'Multiply by 0.80 each year.'
  topic: 'Exponential functions'
# Logs
- front: 'Definition of $\log_b x$'
  back: '$\log_b x = y \iff b^y = x$ (a logarithm is an exponent).'
  topic: 'Logarithms'
- front: 'Product rule for logs'
  back: '$\log_b(MN) = \log_b M + \log_b N$'
  topic: 'Logarithms'
- front: 'Quotient rule for logs'
  back: '$\log_b\frac MN = \log_b M - \log_b N$'
  topic: 'Logarithms'
- front: 'Power rule for logs'
  back: '$\log_b M^p = p\log_b M$'
  topic: 'Logarithms'
- front: 'Change of base'
  back: '$\log_b x = \dfrac{\ln x}{\ln b}$'
  topic: 'Logarithms'
- front: 'Inverse properties of logs'
  back: '$\log_b b^x = x$ and $b^{\log_b x} = x$.'
  topic: 'Logarithms'
- front: 'Graph of $\log_b x$ ($b > 1$)'
  back: 'Through $(1, 0)$ and $(b, 1)$; domain $(0, \infty)$; vertical asymptote $x = 0$.'
  topic: 'Logarithms'
- front: 'Is $\log(M + N) = \log M + \log N$?'
  back: 'No. There is no rule for the log of a sum.'
  topic: 'Logarithms'
# Equations
- front: 'Solving $a \cdot b^x = c$'
  back: 'Divide by $a$ first, then $x = \dfrac{\ln(c/a)}{\ln b}$.'
  topic: 'Exponential and logarithmic equations'
- front: 'Equations with $b^{2x}$ and $b^x$'
  back: 'Substitute $u = b^x$ to get a quadratic; reject $u \le 0$.'
  topic: 'Exponential and logarithmic equations'
- front: 'Solving log equations'
  back: 'Combine into one log, rewrite in exponential form, solve, and check for extraneous solutions.'
  topic: 'Exponential and logarithmic equations'
- front: 'Same-base exponential equations'
  back: '$b^u = b^v \Rightarrow u = v$ (rewrite both sides with a common base).'
  topic: 'Exponential and logarithmic equations'
# Models
- front: 'Doubling time'
  back: '$T = \dfrac{\ln 2}{k}$ for $Q = Q_0e^{kt}$.'
  topic: 'Exponential models'
- front: 'Half-life model'
  back: '$Q = Q_0\left(\frac12\right)^{t/T}$'
  topic: 'Exponential models'
- front: 'Newton''s law of cooling'
  back: '$T = T_s + (T_0 - T_s)e^{-kt}$'
  topic: 'Exponential models'
- front: 'Logistic model'
  back: '$P = \dfrac{C}{1 + Ae^{-kt}}$; $C$ is the carrying capacity; $A = \frac{C}{P_0} - 1$.'
  topic: 'Exponential models'
- front: 'When is logistic growth fastest?'
  back: 'At half the carrying capacity, $t = \frac{\ln A}{k}$.'
  topic: 'Exponential models'
- front: 'Decibels: +10 dB means…'
  back: '10 times the sound intensity.'
  topic: 'Exponential models'
# Trig
- front: 'Degrees to radians'
  back: 'Multiply by $\frac{\pi}{180}$ ($180^\circ = \pi$).'
  topic: 'Unit circle'
- front: 'Arc length'
  back: '$s = r\theta$ ($\theta$ in radians).'
  topic: 'Unit circle'
- front: 'Unit circle point at angle $\theta$'
  back: '$(\cos\theta, \sin\theta)$'
  topic: 'Unit circle'
- front: '$\sin$, $\cos$ of $\frac{\pi}{6}$, $\frac{\pi}{4}$, $\frac{\pi}{3}$'
  back: '$\sin$: $\frac12, \frac{\sqrt2}{2}, \frac{\sqrt3}{2}$; $\cos$: $\frac{\sqrt3}{2}, \frac{\sqrt2}{2}, \frac12$.'
  topic: 'Unit circle'
- front: 'Signs by quadrant'
  back: 'I: all positive; II: sine; III: tangent; IV: cosine.'
  topic: 'Unit circle'
- front: 'Reference angle'
  back: 'The acute angle between the terminal side and the $x$-axis.'
  topic: 'Unit circle'
- front: 'Sinusoid $y = A\sin(B(x - C)) + D$'
  back: 'Amplitude $|A|$, period $\frac{2\pi}{|B|}$, phase shift $C$, midline $y = D$.'
  topic: 'Trig graphs'
- front: 'Period of $\tan x$'
  back: '$\pi$ (asymptotes at $\frac{\pi}{2} + k\pi$).'
  topic: 'Trig graphs'
- front: 'Range of $\sin^{-1}x$'
  back: '$\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$'
  topic: 'Trig graphs'
- front: 'Pythagorean identities'
  back: '$\sin^2\theta + \cos^2\theta = 1$; $1 + \tan^2\theta = \sec^2\theta$.'
  topic: 'Trig identities'
- front: 'Sum formula for sine'
  back: '$\sin(a + b) = \sin a\cos b + \cos a\sin b$'
  topic: 'Trig identities'
- front: 'Sum formula for cosine'
  back: '$\cos(a + b) = \cos a\cos b - \sin a\sin b$'
  topic: 'Trig identities'
- front: 'Double-angle identities'
  back: '$\sin 2\theta = 2\sin\theta\cos\theta$; $\cos 2\theta = \cos^2\theta - \sin^2\theta = 1 - 2\sin^2\theta = 2\cos^2\theta - 1$.'
  topic: 'Trig identities'
# Systems and matrices
- front: 'Possible numbers of solutions of a linear system'
  back: '0, 1 or infinitely many.'
  topic: 'Systems and Gaussian elimination'
- front: 'Three row operations'
  back: 'Swap rows; multiply a row by a nonzero constant; add a multiple of one row to another.'
  topic: 'Systems and Gaussian elimination'
- front: 'Row $[0\ 0\ 0 \mid 5]$ means…'
  back: 'No solution (inconsistent): $0 = 5$.'
  topic: 'Systems and Gaussian elimination'
- front: 'Row $[0\ 0\ 0 \mid 0]$ with a free variable means…'
  back: 'Infinitely many solutions (dependent); write them with a parameter.'
  topic: 'Systems and Gaussian elimination'
- front: 'REF vs RREF'
  back: 'REF: staircase with zeros below pivots. RREF: pivots are 1 with zeros above and below.'
  topic: 'Systems and Gaussian elimination'
- front: 'When is $AB$ defined?'
  back: 'When columns of $A$ = rows of $B$; $(m \times n)(n \times p) = m \times p$.'
  topic: 'Matrix operations'
- front: 'Entry $(i, j)$ of $AB$'
  back: 'Row $i$ of $A$ dotted with column $j$ of $B$.'
  topic: 'Matrix operations'
- front: 'Is matrix multiplication commutative?'
  back: 'No: in general $AB \ne BA$.'
  topic: 'Matrix operations'
- front: 'Identity matrix'
  back: '1s on the diagonal, 0s elsewhere; $AI = IA = A$.'
  topic: 'Matrix operations'
- front: '$2 \times 2$ inverse'
  back: '$\begin{bmatrix} a & b \\ c & d \end{bmatrix}^{-1} = \dfrac{1}{ad - bc}\begin{bmatrix} d & -b \\ -c & a \end{bmatrix}$'
  topic: 'Inverse matrices'
- front: 'Inverse by row reduction'
  back: 'Row-reduce $[A \mid I]$ to $[I \mid A^{-1}]$.'
  topic: 'Inverse matrices'
- front: 'Solving $AX = B$ with an inverse'
  back: '$X = A^{-1}B$ (inverse on the left).'
  topic: 'Inverse matrices'
- front: '$(AB)^{-1}$'
  back: '$B^{-1}A^{-1}$'
  topic: 'Inverse matrices'
- front: 'When is a matrix singular?'
  back: 'When its determinant is 0 (no inverse).'
  topic: 'Inverse matrices'
- front: '$2 \times 2$ determinant'
  back: '$ad - bc$'
  topic: 'Determinants and Cramer''s rule'
- front: 'Cofactor sign pattern'
  back: 'Checkerboard: $+\ -\ +$ / $-\ +\ -$ / $+\ -\ +$.'
  topic: 'Determinants and Cramer''s rule'
- front: 'Determinant of a triangular matrix'
  back: 'The product of the diagonal entries.'
  topic: 'Determinants and Cramer''s rule'
- front: 'Cramer''s rule'
  back: '$x_i = \dfrac{D_i}{D}$, where $D_i$ replaces column $i$ with the constants; requires $D \ne 0$.'
  topic: 'Determinants and Cramer''s rule'
- front: 'Effect of a row swap on $\det$'
  back: 'It changes the sign.'
  topic: 'Determinants and Cramer''s rule'
- front: '$\det(kA)$ for $n \times n$ $A$'
  back: '$k^n\det A$'
  topic: 'Determinants and Cramer''s rule'
# Partial fractions
- front: 'First step for an improper fraction'
  back: 'Divide; decompose only the proper remainder part.'
  topic: 'Partial fractions'
- front: 'Terms for $(x - a)^2$'
  back: '$\dfrac{A}{x - a} + \dfrac{B}{(x - a)^2}$'
  topic: 'Partial fractions'
- front: 'Term for an irreducible quadratic'
  back: '$\dfrac{Bx + C}{x^2 + bx + c}$'
  topic: 'Partial fractions'
- front: 'Finding the constants'
  back: 'Clear denominators; substitute zeros of linear factors; match coefficients for the rest.'
  topic: 'Partial fractions'
# Conics
- front: 'Parabola definition'
  back: 'Points equidistant from the focus and the directrix.'
  topic: 'Parabolas'
- front: '$(x - h)^2 = 4p(y - k)$'
  back: 'Vertex $(h, k)$; opens up if $p > 0$; focus $(h, k + p)$; directrix $y = k - p$.'
  topic: 'Parabolas'
- front: '$(y - k)^2 = 4p(x - h)$'
  back: 'Opens right if $p > 0$; focus $(h + p, k)$; directrix $x = h - p$.'
  topic: 'Parabolas'
- front: 'Reflective property of a parabola'
  back: 'Rays parallel to the axis reflect through the focus.'
  topic: 'Parabolas'
- front: 'Ellipse definition'
  back: 'Sum of distances to two foci is constant ($2a$).'
  topic: 'Ellipses'
- front: 'Ellipse $a$, $b$, $c$ relation'
  back: '$c^2 = a^2 - b^2$ ($a$ = larger semi-axis).'
  topic: 'Ellipses'
- front: 'Which axis is major in an ellipse?'
  back: 'The one under the larger denominator.'
  topic: 'Ellipses'
- front: 'Eccentricity of an ellipse'
  back: '$e = \frac ca$, between 0 (circle) and 1.'
  topic: 'Ellipses'
- front: 'Hyperbola definition'
  back: 'Difference of distances to two foci is constant ($2a$).'
  topic: 'Hyperbolas'
- front: 'Hyperbola $a$, $b$, $c$ relation'
  back: '$c^2 = a^2 + b^2$'
  topic: 'Hyperbolas'
- front: 'Asymptotes of $\frac{x^2}{a^2} - \frac{y^2}{b^2} = 1$'
  back: '$y = \pm\frac bax$'
  topic: 'Hyperbolas'
- front: 'Asymptotes of $\frac{y^2}{a^2} - \frac{x^2}{b^2} = 1$'
  back: '$y = \pm\frac abx$'
  topic: 'Hyperbolas'
- front: 'Identify a conic with no $xy$ term'
  back: 'One square: parabola. Same signs: ellipse (circle if equal). Opposite signs: hyperbola.'
  topic: 'Identifying conics'
- front: 'Conic discriminant $B^2 - 4AC$'
  back: 'Negative: ellipse. Zero: parabola. Positive: hyperbola.'
  topic: 'Identifying conics'
- front: 'Rotation angle to remove $xy$'
  back: '$\cot 2\theta = \dfrac{A - C}{B}$'
  topic: 'Identifying conics'
# Parametric and polar
- front: 'Eliminating the parameter'
  back: 'Solve one equation for $t$ and substitute, or use $\cos^2 t + \sin^2 t = 1$.'
  topic: 'Parametric equations'
- front: 'Parametrize a segment'
  back: '$x = x_1 + (x_2 - x_1)t$, $y = y_1 + (y_2 - y_1)t$, $0 \le t \le 1$.'
  topic: 'Parametric equations'
- front: 'Parametrize a circle'
  back: '$x = h + r\cos t$, $y = k + r\sin t$ (counterclockwise).'
  topic: 'Parametric equations'
- front: 'Projectile motion'
  back: '$x = v_xt$, $y = h + v_yt - 4.9t^2$ (meters, seconds).'
  topic: 'Parametric equations'
- front: 'Polar to rectangular'
  back: '$x = r\cos\theta$, $y = r\sin\theta$'
  topic: 'Polar coordinates'
- front: 'Rectangular to polar'
  back: '$r^2 = x^2 + y^2$, $\tan\theta = \frac yx$ (check the quadrant).'
  topic: 'Polar coordinates'
- front: 'Negative $r$'
  back: '$(-r, \theta) = (r, \theta + \pi)$: go the opposite way.'
  topic: 'Polar coordinates'
- front: 'Rose curve petals'
  back: '$r = a\cos n\theta$: $n$ petals if $n$ odd, $2n$ if $n$ even.'
  topic: 'Polar coordinates'
- front: 'Cardioid'
  back: '$r = a + a\cos\theta$ (or $\sin$): a limaçon through the pole.'
  topic: 'Polar coordinates'
- front: 'Polar conic'
  back: '$r = \dfrac{ed}{1 \pm e\cos\theta}$ or $\dfrac{ed}{1 \pm e\sin\theta}$, focus at the pole.'
  topic: 'Polar conics'
- front: 'Reading a polar conic'
  back: 'Make the denominator constant 1; then the trig coefficient is $e$ and the numerator is $ed$.'
  topic: 'Polar conics'
- front: 'Eccentricity and conic type'
  back: '$e < 1$ ellipse; $e = 1$ parabola; $e > 1$ hyperbola.'
  topic: 'Polar conics'
# Vectors
- front: 'Component form of $\vec{PQ}$'
  back: '$\langle x_2 - x_1, y_2 - y_1 \rangle$ (terminal minus initial).'
  topic: 'Vectors'
- front: 'Magnitude of $\langle a, b \rangle$'
  back: '$\sqrt{a^2 + b^2}$'
  topic: 'Vectors'
- front: 'Unit vector in the direction of $\vec v$'
  back: '$\dfrac{\vec v}{\lVert\vec v\rVert}$'
  topic: 'Vectors'
- front: 'Vector from magnitude and direction angle'
  back: '$\langle \lVert\vec v\rVert\cos\theta, \lVert\vec v\rVert\sin\theta \rangle$'
  topic: 'Vectors'
- front: 'Dot product'
  back: '$u_1v_1 + u_2v_2 (+ u_3v_3) = \lVert\vec u\rVert\lVert\vec v\rVert\cos\theta$'
  topic: 'Dot product'
- front: 'Angle between vectors'
  back: '$\cos\theta = \dfrac{\vec u \cdot \vec v}{\lVert\vec u\rVert\lVert\vec v\rVert}$'
  topic: 'Dot product'
- front: 'Orthogonal vectors test'
  back: '$\vec u \cdot \vec v = 0$'
  topic: 'Dot product'
- front: 'Vector projection'
  back: '$\text{proj}_{\vec v}\vec u = \dfrac{\vec u \cdot \vec v}{\lVert\vec v\rVert^2}\vec v$'
  topic: 'Dot product'
- front: 'Work done by a constant force'
  back: '$W = \vec F \cdot \vec d = \lVert\vec F\rVert\lVert\vec d\rVert\cos\theta$'
  topic: 'Dot product'
- front: 'Distance in 3D'
  back: '$\sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2 + (z_2 - z_1)^2}$'
  topic: 'Vectors in 3D'
- front: 'Cross product property'
  back: '$\vec u \times \vec v$ is orthogonal to both; magnitude = area of their parallelogram.'
  topic: 'Vectors in 3D'
# Sequences
- front: 'Arithmetic $n$th term'
  back: '$a_n = a_1 + (n - 1)d$'
  topic: 'Arithmetic sequences'
- front: 'Arithmetic series sum'
  back: '$S_n = \dfrac{n(a_1 + a_n)}{2}$'
  topic: 'Arithmetic sequences'
- front: '$\sum_{k=1}^n k$'
  back: '$\dfrac{n(n + 1)}{2}$'
  topic: 'Sequences and series'
- front: '$\sum_{k=1}^n k^2$'
  back: '$\dfrac{n(n + 1)(2n + 1)}{6}$'
  topic: 'Sequences and series'
- front: '$\sum_{k=1}^n c$'
  back: '$cn$'
  topic: 'Sequences and series'
- front: 'Explicit vs recursive formula'
  back: 'Explicit: $a_n$ from $n$ directly. Recursive: a start and a rule from previous terms.'
  topic: 'Sequences and series'
- front: 'Geometric $n$th term'
  back: '$a_n = a_1r^{n-1}$'
  topic: 'Geometric sequences'
- front: 'Finite geometric sum'
  back: '$S_n = a_1\dfrac{1 - r^n}{1 - r}$ ($r \ne 1$)'
  topic: 'Geometric sequences'
- front: 'Infinite geometric sum'
  back: '$\dfrac{a_1}{1 - r}$ if $|r| < 1$; diverges otherwise.'
  topic: 'Geometric sequences'
- front: 'Repeating decimal to fraction'
  back: 'Treat it as a geometric series: $0.\overline{27} = \frac{0.27}{1 - 0.01} = \frac{3}{11}$.'
  topic: 'Geometric sequences'
# Induction
- front: 'Two parts of an induction proof'
  back: 'Base case $P(1)$; inductive step $P(k) \Rightarrow P(k + 1)$.'
  topic: 'Mathematical induction'
- front: 'Inductive hypothesis'
  back: 'The assumption that $P(k)$ is true for some $k$.'
  topic: 'Mathematical induction'
- front: 'Tip for sum formulas by induction'
  back: 'Add the $(k + 1)$st term to both sides of $P(k)$; factor toward the $P(k + 1)$ form.'
  topic: 'Mathematical induction'
# Binomial
- front: 'Binomial coefficient'
  back: '$\dbinom nk = \dfrac{n!}{k!(n - k)!}$'
  topic: 'Binomial theorem'
- front: 'Binomial theorem'
  back: '$(a + b)^n = \sum_{k=0}^{n}\binom nk a^{n-k}b^k$'
  topic: 'Binomial theorem'
- front: 'Pascal''s triangle rule'
  back: 'Each entry is the sum of the two above: $\binom nk + \binom n{k+1} = \binom{n+1}{k+1}$.'
  topic: 'Binomial theorem'
- front: 'Sum of row $n$ of Pascal''s triangle'
  back: '$2^n$'
  topic: 'Binomial theorem'
- front: 'Which term contains $b^k$?'
  back: 'The $(k + 1)$st term, $\binom nk a^{n-k}b^k$.'
  topic: 'Binomial theorem'
# Counting and probability
- front: 'Fundamental counting principle'
  back: 'Multiply the number of choices at each stage.'
  topic: 'Counting'
- front: 'Permutations'
  back: '$_nP_r = \dfrac{n!}{(n - r)!}$ (order matters).'
  topic: 'Counting'
- front: 'Combinations'
  back: '$_nC_r = \dfrac{n!}{r!(n - r)!}$ (order doesn''t matter).'
  topic: 'Counting'
- front: 'Permutation or combination?'
  back: 'Ask: does rearranging the selection give a different outcome? Yes: permutation. No: combination.'
  topic: 'Counting'
- front: 'Equally likely outcomes'
  back: '$P(E) = \dfrac{\text{outcomes in } E}{\text{outcomes in } S}$'
  topic: 'Probability'
- front: 'Complement rule'
  back: '$P(\text{not } E) = 1 - P(E)$; great for "at least one".'
  topic: 'Probability'
- front: 'Addition rule'
  back: '$P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)$'
  topic: 'Probability'
- front: 'Independent events'
  back: '$P(A \text{ and } B) = P(A)P(B)$'
  topic: 'Probability'
# Limits and derivative
- front: 'Meaning of $\lim_{x\to a}f(x) = L$'
  back: '$f(x)$ approaches $L$ as $x$ approaches $a$ (with $x \ne a$).'
  topic: 'Limits'
- front: 'When does a two-sided limit exist?'
  back: 'When the left- and right-hand limits exist and are equal.'
  topic: 'Limits'
- front: 'Three ways a limit fails'
  back: 'A jump, unbounded growth, or oscillation.'
  topic: 'Limits'
- front: 'Continuity at $a$'
  back: '$f(a)$ defined, $\lim_{x\to a}f(x)$ exists, and they are equal.'
  topic: 'Limits'
- front: '$\lim_{x\to0}\frac{\sin x}{x}$'
  back: '$1$ (radians)'
  topic: 'Limits'
- front: 'Handling $\frac00$'
  back: 'Factor and cancel, rationalize, or combine fractions; then substitute.'
  topic: 'Limits'
- front: '$\frac{\text{nonzero}}{0}$ on substitution'
  back: 'A vertical asymptote: no finite limit.'
  topic: 'Limits'
- front: 'Limits at infinity of rational functions'
  back: 'Divide by the highest power in the denominator; same rules as horizontal asymptotes.'
  topic: 'Limits at infinity'
- front: 'Definition of the derivative'
  back: '$f''(a) = \lim\limits_{h\to0}\dfrac{f(a + h) - f(a)}{h}$'
  topic: 'The derivative'
- front: 'Tangent line at $x = a$'
  back: '$y = f(a) + f''(a)(x - a)$'
  topic: 'The derivative'
- front: 'Derivative of $x^2$'
  back: '$2x$'
  topic: 'The derivative'
- front: 'Derivative of $\frac1x$'
  back: '$-\dfrac{1}{x^2}$'
  topic: 'The derivative'
- front: 'Sign of $f''$ and the graph'
  back: '$f'' > 0$: increasing; $f'' < 0$: decreasing; $f'' = 0$: horizontal tangent.'
  topic: 'The derivative'
- front: 'Does $|x|$ have a derivative at 0?'
  back: 'No: the slopes from the left ($-1$) and right ($1$) disagree (a corner).'
  topic: 'The derivative'
