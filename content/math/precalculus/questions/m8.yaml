- id: pc-q-3101
  lesson: pc-vectors-2d
  module_quiz: true
  topic: Vectors
  stem: 'What is the component form of the vector from $P(2, 5)$ to $Q(-1, 1)$?'
  choices: ['$\langle 3, 4 \rangle$', '$\langle 1, 6 \rangle$', '$\langle -3, 4 \rangle$', '$\langle -3, -4 \rangle$']
  answer: 3
  explanation: |-
    Terminal minus initial: $\langle -1 - 2,\ 1 - 5 \rangle = \langle -3, -4 \rangle$. Subtracting in the other order gives $\langle 3, 4 \rangle$, the opposite vector.
- id: pc-q-3102
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'What is the magnitude of $\langle -6, 8 \rangle$?'
  choices: ['$10$', '$2$', '$14$', '$100$']
  answer: 0
  explanation: |-
    $\sqrt{(-6)^2 + 8^2} = \sqrt{100} = 10$. 14 adds the absolute values; 100 forgets the square root.
- id: pc-q-3103
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'Let $\vec u = \langle 1, -3 \rangle$ and $\vec v = \langle 4, 2 \rangle$. Find $2\vec u + \vec v$.'
  choices: ['$\langle 5, -1 \rangle$', '$\langle 6, -4 \rangle$', '$\langle 10, -2 \rangle$', '$\langle 6, -1 \rangle$']
  answer: 1
  explanation: |-
    $2\vec u = \langle 2, -6 \rangle$; adding $\langle 4, 2 \rangle$ gives $\langle 6, -4 \rangle$.
- id: pc-q-3104
  lesson: pc-vectors-2d
  module_quiz: true
  topic: Vectors
  stem: 'Find the unit vector in the direction of $\langle 5, -12 \rangle$.'
  choices: ['$\left\langle \tfrac{5}{17}, -\tfrac{12}{17} \right\rangle$', '$\left\langle \tfrac{5}{13}, \tfrac{12}{13} \right\rangle$', '$\left\langle \tfrac{5}{13}, -\tfrac{12}{13} \right\rangle$', '$\langle 1, -1 \rangle$']
  answer: 2
  explanation: |-
    The magnitude is $\sqrt{25 + 144} = 13$; divide each component by 13. $\langle 1, -1 \rangle$ has magnitude $\sqrt2$, not 1.
- id: pc-q-3105
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'What is the component form of the vector with magnitude 8 and direction angle $30^\circ$?'
  choices: ['$\langle 4, 4\sqrt3 \rangle$', '$\langle 8, 30 \rangle$', '$\langle 4\sqrt3, 4 \rangle$', '$\langle 4\sqrt2, 4\sqrt2 \rangle$']
  answer: 2
  explanation: |-
    $\langle 8\cos 30^\circ, 8\sin 30^\circ \rangle = \left\langle 8 \cdot \frac{\sqrt3}{2}, 8 \cdot \frac12 \right\rangle = \langle 4\sqrt3, 4 \rangle$. Swapping sine and cosine gives the first choice (a $60^\circ$ vector).
- id: pc-q-3106
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'What is the direction angle of $\langle -1, \sqrt3 \rangle$?'
  choices: ['$-60^\circ$', '$120^\circ$', '$60^\circ$', '$150^\circ$']
  answer: 1
  explanation: |-
    The vector is in Quadrant II. $\tan\theta = -\sqrt3$; the reference angle is $60^\circ$, so $\theta = 180^\circ - 60^\circ = 120^\circ$. A calculator's $\tan^{-1}(-\sqrt3) = -60^\circ$ is in the wrong quadrant.
- id: pc-q-3107
  lesson: pc-vectors-2d
  module_quiz: true
  topic: Vectors
  stem: 'What is the direction angle of $\langle 2, -2 \rangle$ (between $0^\circ$ and $360^\circ$)?'
  choices: ['$45^\circ$', '$135^\circ$', '$225^\circ$', '$315^\circ$']
  answer: 3
  explanation: |-
    The vector points down and to the right (Quadrant IV) at a $45^\circ$ reference angle, so $\theta = 360^\circ - 45^\circ = 315^\circ$.
- id: pc-q-3108
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'Write $3\mathbf{i} - 2\mathbf{j}$ in component form.'
  choices: ['$\langle 3, -2 \rangle$', '$\langle -2, 3 \rangle$', '$\langle 1, 0 \rangle$', '$\langle 3, 2 \rangle$']
  answer: 0
  explanation: |-
    $\mathbf{i} = \langle 1, 0 \rangle$ and $\mathbf{j} = \langle 0, 1 \rangle$, so $3\mathbf{i} - 2\mathbf{j} = \langle 3, -2 \rangle$.
- id: pc-q-3109
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'If $\lVert\vec v\rVert = 4$, what is $\lVert -3\vec v \rVert$?'
  choices: ['$-12$', '$12$', '$7$', '$1$']
  answer: 1
  explanation: |-
    $\lVert k\vec v\rVert = |k|\,\lVert\vec v\rVert = 3 \cdot 4 = 12$. A magnitude is never negative; the minus sign only reverses the direction.
- id: pc-q-3110
  lesson: pc-vectors-2d
  module_quiz: true
  topic: Vectors
  stem: 'A plane flies due north at an airspeed of 300 mph while a 50 mph wind blows due east. What is its ground speed?'
  choices: ['About 350 mph', 'About 250 mph', 'About 304 mph', 'About 296 mph']
  answer: 2
  explanation: |-
    The resultant is $\langle 50, 300 \rangle$, with magnitude $\sqrt{50^2 + 300^2} \approx 304.1$ mph. Adding speeds (350) only works when the vectors point the same way.
- id: pc-q-3111
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'Forces of 40 N (pointing east) and 30 N (pointing north) act on an object. What is the magnitude of the resultant?'
  choices: ['70 N', '10 N', '35 N', '50 N']
  answer: 3
  explanation: |-
    $\langle 40, 0 \rangle + \langle 0, 30 \rangle = \langle 40, 30 \rangle$, with magnitude $\sqrt{1600 + 900} = 50$ N.
- id: pc-q-3112
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'When $\vec u$ and $\vec v$ are drawn from the same starting point, which arrow represents $\vec u - \vec v$?'
  choices: ['From the tip of $\vec v$ to the tip of $\vec u$', 'From the tip of $\vec u$ to the tip of $\vec v$', 'The diagonal of the parallelogram from the common start', 'From the common start to the midpoint of the tips']
  answer: 0
  explanation: |-
    $\vec v + (\vec u - \vec v) = \vec u$, so $\vec u - \vec v$ is what you add to the tip of $\vec v$ to reach the tip of $\vec u$. The parallelogram diagonal from the start is $\vec u + \vec v$.
- id: pc-q-3113
  lesson: pc-vectors-2d
  topic: Vectors
  stem: 'When are two vectors equal?'
  choices: ['When they start at the same point', 'When they have the same magnitude', 'When they have the same magnitude and direction', 'When they lie on the same line']
  answer: 2
  explanation: |-
    A vector is determined by its length and direction only; arrows drawn in different places with the same length and direction are the same vector (they have the same components).

- id: pc-q-3201
  lesson: pc-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'Compute $\langle 2, -5 \rangle \cdot \langle 3, 1 \rangle$.'
  choices: ['$\langle 6, -5 \rangle$', '$1$', '$11$', '$-1$']
  answer: 1
  explanation: |-
    $2(3) + (-5)(1) = 6 - 5 = 1$. The dot product is a number, not a vector.
- id: pc-q-3202
  lesson: pc-dot-product
  topic: Dot product
  stem: 'What is the angle between $\langle 1, 0 \rangle$ and $\langle 1, 1 \rangle$?'
  choices: ['$90^\circ$', '$30^\circ$', '$60^\circ$', '$45^\circ$']
  answer: 3
  explanation: |-
    $\cos\theta = \frac{1}{1 \cdot \sqrt2} = \frac{\sqrt2}{2}$, so $\theta = 45^\circ$.
- id: pc-q-3203
  lesson: pc-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'Which vector is orthogonal to $\langle 4, -6 \rangle$?'
  choices: ['$\langle 3, 2 \rangle$', '$\langle 2, -3 \rangle$', '$\langle -4, 6 \rangle$', '$\langle 6, -4 \rangle$']
  answer: 0
  explanation: |-
    $\langle 4, -6 \rangle \cdot \langle 3, 2 \rangle = 12 - 12 = 0$. The others give $26$, $-52$ and $48$. ($\langle 2, -3 \rangle$ and $\langle -4, 6 \rangle$ are parallel to $\langle 4, -6 \rangle$, the opposite of orthogonal.)
- id: pc-q-3204
  lesson: pc-dot-product
  topic: Dot product
  stem: 'For which $k$ are $\langle k, 3 \rangle$ and $\langle 2, -4 \rangle$ orthogonal?'
  choices: ['$k = -6$', '$k = 6$', '$k = \tfrac32$', '$k = 12$']
  answer: 1
  explanation: |-
    Need $2k - 12 = 0$, so $k = 6$.
- id: pc-q-3205
  lesson: pc-dot-product
  topic: Dot product
  stem: 'The dot product of two nonzero vectors is negative. What can you say about the angle between them?'
  choices: ['It is obtuse (between $90^\circ$ and $180^\circ$)', 'It is acute', 'It is exactly $90^\circ$', 'Someone made an error; dot products are never negative']
  answer: 0
  explanation: |-
    $\vec u \cdot \vec v = \lVert\vec u\rVert\lVert\vec v\rVert\cos\theta$, and the magnitudes are positive, so the sign is the sign of $\cos\theta$, which is negative for obtuse angles.
- id: pc-q-3206
  lesson: pc-dot-product
  topic: Dot product
  stem: 'Find $\text{proj}_{\vec v}\,\vec u$ for $\vec u = \langle 3, 4 \rangle$ and $\vec v = \langle 1, 1 \rangle$.'
  choices: ['$\langle 7, 7 \rangle$', '$\left\langle \tfrac{7}{\sqrt2}, \tfrac{7}{\sqrt2} \right\rangle$', '$\left\langle \tfrac75, \tfrac75 \right\rangle$', '$\left\langle \tfrac72, \tfrac72 \right\rangle$']
  answer: 3
  explanation: |-
    $\vec u \cdot \vec v = 7$ and $\lVert\vec v\rVert^2 = 2$, so the projection is $\frac72\langle 1, 1 \rangle$. Dividing by $\lVert\vec v\rVert$ instead of $\lVert\vec v\rVert^2$ gives the second choice.
- id: pc-q-3207
  lesson: pc-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'A force of 20 N directed $60^\circ$ above horizontal pulls a box 10 m along level ground. How much work is done?'
  choices: ['200 J', '173 J', '100 J', '20 J']
  answer: 2
  explanation: |-
    $W = \lVert\vec F\rVert\lVert\vec d\rVert\cos\theta = 20 \cdot 10 \cdot \cos 60^\circ = 100$ J. Only the horizontal part of the force does work; 200 J ignores the angle and 173 J uses $\sin 60^\circ$.
- id: pc-q-3208
  lesson: pc-dot-product
  module_quiz: true
  topic: Vectors in 3D
  stem: 'Find the distance between $(1, 2, 3)$ and $(3, -1, 9)$.'
  choices: ['$7$', '$\sqrt{29}$', '$11$', '$49$']
  answer: 0
  explanation: |-
    $\sqrt{(3 - 1)^2 + (-1 - 2)^2 + (9 - 3)^2} = \sqrt{4 + 9 + 36} = \sqrt{49} = 7$.
- id: pc-q-3209
  lesson: pc-dot-product
  topic: Vectors in 3D
  stem: 'What is the magnitude of $\langle 2, -1, 2 \rangle$?'
  choices: ['$5$', '$\sqrt5$', '$3$', '$9$']
  answer: 2
  explanation: |-
    $\sqrt{4 + 1 + 4} = \sqrt9 = 3$. Leaving out the $z$-component gives $\sqrt5$.
- id: pc-q-3210
  lesson: pc-dot-product
  topic: Vectors in 3D
  stem: 'Compute $\langle 1, 2, 3 \rangle \cdot \langle 4, -5, 6 \rangle$.'
  choices: ['$32$', '$\langle 4, -10, 18 \rangle$', '$-12$', '$12$']
  answer: 3
  explanation: |-
    $4 - 10 + 18 = 12$.
- id: pc-q-3211
  lesson: pc-dot-product
  topic: Vectors in 3D
  stem: 'What is true of $\vec u \times \vec v$ for nonparallel vectors $\vec u$ and $\vec v$ in space?'
  choices: ['It is a scalar', 'It is orthogonal to both $\vec u$ and $\vec v$', 'It points along $\vec u + \vec v$', 'It equals $\vec v \times \vec u$']
  answer: 1
  explanation: |-
    The cross product is a vector perpendicular to both factors (its magnitude is the area of their parallelogram). It reverses when the order is swapped: $\vec v \times \vec u = -\vec u \times \vec v$.
- id: pc-q-3212
  lesson: pc-dot-product
  topic: Vectors in 3D
  stem: 'Find the center and radius of the sphere $x^2 + y^2 + z^2 - 2x + 4z = 4$.'
  choices: ['Center $(-1, 0, 2)$, radius 3', 'Center $(1, 0, -2)$, radius 2', 'Center $(1, 0, -2)$, radius 3', 'Center $(1, -2, 0)$, radius 9']
  answer: 2
  explanation: |-
    $(x - 1)^2 + y^2 + (z + 2)^2 = 4 + 1 + 4 = 9$: center $(1, 0, -2)$, radius 3.
- id: pc-q-3213
  lesson: pc-dot-product
  topic: Dot product
  stem: 'Which equation is true for every vector $\vec v$?'
  choices: ['$\vec v \cdot \vec v = \lVert\vec v\rVert^2$', '$\vec v \cdot \vec v = \lVert\vec v\rVert$', '$\vec v \cdot \vec v = 2\vec v$', '$\vec v \cdot \vec v = 0$']
  answer: 0
  explanation: |-
    $\langle a, b \rangle \cdot \langle a, b \rangle = a^2 + b^2 = \lVert\vec v\rVert^2$. The angle between a vector and itself is 0, and $\cos 0 = 1$.
