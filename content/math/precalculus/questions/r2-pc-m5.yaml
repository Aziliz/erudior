# Module pc-m5 (Trigonometry review), round 2
# Lesson 20: radians and the unit circle
- id: pc-m5-r2-q01
  lesson: pc-unit-circle
  module_quiz: true
  type: text
  topic: Unit circle
  stem: 'A central angle cuts off an arc of length 15 cm on a circle of radius 6 cm. The angle measures ___ radians. Give only the number.'
  accept: ['2.5', '5/2', '2 1/2']
  explanation: |-
    By definition $\theta = \frac{s}{r} = \frac{15}{6} = 2.5$ radians (about $143^\circ$). The centimeters cancel, which is why radians carry no unit.
- id: pc-m5-r2-q02
  lesson: pc-unit-circle
  type: match
  topic: Unit circle
  stem: 'Match each angle to its point on the unit circle.'
  pairs:
    - ['$\dfrac{\pi}{6}$', '(√3/2, 1/2)']
    - ['$\dfrac{2\pi}{3}$', '(−1/2, √3/2)']
    - ['$\dfrac{5\pi}{4}$', '(−√2/2, −√2/2)']
    - ['$\dfrac{11\pi}{6}$', '(√3/2, −1/2)']
  distractors: ['(1/2, −√3/2)', '(−√3/2, 1/2)']
  explanation: |-
    The point is $(\cos\theta, \sin\theta)$. $\frac{\pi}{6}$: Quadrant I, $\left(\frac{\sqrt3}{2}, \frac12\right)$. $\frac{2\pi}{3}$: Quadrant II with reference angle $\frac{\pi}{3}$, so $\left(-\frac12, \frac{\sqrt3}{2}\right)$. $\frac{5\pi}{4}$: Quadrant III with reference angle $\frac{\pi}{4}$, both coordinates negative. $\frac{11\pi}{6}$: Quadrant IV with reference angle $\frac{\pi}{6}$, so $\left(\frac{\sqrt3}{2}, -\frac12\right)$. The distractors are the points at $\frac{5\pi}{3}$ and $\frac{5\pi}{6}$.
- id: pc-m5-r2-q03
  lesson: pc-unit-circle
  type: order
  topic: Unit circle
  stem: 'Put the steps for finding $\sin\dfrac{17\pi}{6}$ in order.'
  items:
    - 'Subtract $2\pi$: $\frac{17\pi}{6}$ ends where $\frac{5\pi}{6}$ does'
    - '$\frac{5\pi}{6}$ is in Quadrant II'
    - 'Its reference angle is $\pi - \frac{5\pi}{6} = \frac{\pi}{6}$'
    - '$\sin\frac{\pi}{6} = \frac12$'
    - 'Sine is positive in Quadrant II, so $\sin\frac{17\pi}{6} = \frac12$'
  explanation: |-
    Each step uses the one before it: the coterminal angle tells you the quadrant, the quadrant tells you how to compute the reference angle ($\pi - \theta$ in Quadrant II), the reference angle gives the table value, and the quadrant's sign finishes the job. $\frac{17\pi}{6} - 2\pi = \frac{5\pi}{6}$, and $\sin\frac{17\pi}{6} = \frac12$.
- id: pc-m5-r2-q04
  lesson: pc-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Which angles have the same sine as $\dfrac{\pi}{6}$? Select all that apply.'
  choices: ['$\dfrac{5\pi}{6}$', '$\dfrac{7\pi}{6}$', '$\dfrac{13\pi}{6}$', '$-\dfrac{\pi}{6}$', '$-\dfrac{7\pi}{6}$']
  answer: [0, 2, 4]
  explanation: |-
    $\sin\frac{\pi}{6} = \frac12$. $\frac{5\pi}{6}$ is in Quadrant II with reference angle $\frac{\pi}{6}$, and sine is positive there. $\frac{13\pi}{6} = \frac{\pi}{6} + 2\pi$ is the same point. $-\frac{7\pi}{6} + 2\pi = \frac{5\pi}{6}$, so it is also $\frac12$. But $\frac{7\pi}{6}$ (Quadrant III) and $-\frac{\pi}{6}$ (Quadrant IV) have sine $-\frac12$.
- id: pc-m5-r2-q05
  lesson: pc-unit-circle
  type: label
  topic: Unit circle
  stem: 'The picture shows a central angle on a circle. Name the numbered parts.'
  image: {src: images/pc-m5-radian-arc-blank.svg, alt: 'A circle with a shaded sector bounded by two radii, one horizontal and one rotated counterclockwise. The arc of the sector is drawn in red and a small arc marks the angle at the center. Five places are numbered.'}
  labels:
    - {x: 37.1, y: 58.9, text: Center}
    - {x: 61.1, y: 52.8, text: Initial side}
    - {x: 48.0, y: 30.3, text: Terminal side}
    - {x: 68.0, y: 30.8, text: Intercepted arc}
    - {x: 51.5, y: 44.0, text: Central angle}
  distractors: [Chord, Diameter]
  explanation: |-
    The angle's vertex is the center of the circle (1). It starts on the initial side (2), along the positive $x$-direction, and rotates counterclockwise to the terminal side (3). The red arc between them is the intercepted arc (4), of length $s$, and the angle at the center (5) measures $\theta = \frac{s}{r}$ radians. No chord (a segment joining two points of the circle) or diameter is drawn.
- id: pc-m5-r2-q06
  lesson: pc-unit-circle
  type: text
  topic: Unit circle
  stem: '$\sin\theta = 0.6$ and $\theta$ is in Quadrant II. Then $\cos\theta =$ ___.'
  accept: ['-0.8', '-4/5']
  explanation: |-
    $\cos^2\theta = 1 - 0.36 = 0.64$, so $\cos\theta = \pm 0.8$. Cosine (the $x$-coordinate) is negative in Quadrant II, so $\cos\theta = -0.8$.
# Lesson 21: trig graphs and key identities
- id: pc-m5-r2-q07
  lesson: pc-trig-graphs-identities
  module_quiz: true
  type: text
  topic: Trig graphs
  stem: 'The period of $y = 5\sin\left(\dfrac{\pi}{3}x\right)$ is ___. Give only the number.'
  accept: ['6']
  explanation: |-
    Period $= \frac{2\pi}{B} = \frac{2\pi}{\pi/3} = 2\pi\cdot\frac{3}{\pi} = 6$. The amplitude 5 does not affect the period.
- id: pc-m5-r2-q08
  lesson: pc-trig-graphs-identities
  type: label
  topic: Trig graphs
  stem: 'The graph shows $y = 2\sin x + 1$. Name the numbered features.'
  image: {src: images/pc-m5-sinusoid-features-blank.svg, alt: 'The graph of y = 2 sin x + 1 with a dashed horizontal line at y = 1, an arrow from that line up to the first peak, a double arrow between two neighboring peaks, and dots at a peak and at the lowest point. Five places are numbered.'}
  labels:
    - {x: 25.6, y: 41.2, text: Amplitude}
    - {x: 57.6, y: 17.4, text: Period}
    - {x: 65.7, y: 54.4, text: Midline}
    - {x: 89.7, y: 27.9, text: Maximum}
    - {x: 57.6, y: 80.9, text: Minimum}
  distractors: [Asymptote, Phase shift]
  explanation: |-
    The arrow from the midline to a peak (1) is the amplitude, $|A| = 2$. The double arrow from peak to peak (2) is one period, $2\pi$. The dashed line (3) is the midline $y = D = 1$. The dots mark a maximum (4), $1 + 2 = 3$, and the minimum (5), $1 - 2 = -1$. Sinusoids have no asymptotes, and this graph has no phase shift ($C = 0$).
- id: pc-m5-r2-q09
  lesson: pc-trig-graphs-identities
  type: order
  topic: Trig graphs
  stem: 'Put these functions in order of their periods, from shortest to longest.'
  items: ['$\sin 3x$', '$\tan x$', '$\cos x$', '$\sin\dfrac{x}{2}$', '$\tan\dfrac{x}{5}$']
  explanation: |-
    The periods are $\frac{2\pi}{3} \approx 2.09$, $\pi \approx 3.14$, $2\pi$, $\frac{2\pi}{1/2} = 4\pi$ and $\frac{\pi}{1/5} = 5\pi$. Remember that tangent's basic period is $\pi$, not $2\pi$.
- id: pc-m5-r2-q10
  lesson: pc-trig-graphs-identities
  type: match
  topic: Trig identities
  stem: 'Match each expression to an expression that is identically equal to it.'
  pairs:
    - ['$1 + \tan^2\theta$', 'sec²θ']
    - ['$\cos^2\theta - \sin^2\theta$', 'cos 2θ']
    - ['$2\sin\theta\cos\theta$', 'sin 2θ']
    - ['$\sin(-\theta)$', '−sin θ']
  distractors: ['2 sin θ', 'csc²θ']
  explanation: |-
    $1 + \tan^2\theta = \sec^2\theta$ (divide the Pythagorean identity by $\cos^2\theta$). $\cos^2\theta - \sin^2\theta$ and $2\sin\theta\cos\theta$ are the double-angle formulas for $\cos 2\theta$ and $\sin 2\theta$. Sine is odd, so $\sin(-\theta) = -\sin\theta$. $2\sin\theta$ is the classic wrong value of $\sin 2\theta$, and $\csc^2\theta$ equals $1 + \cot^2\theta$, not $1 + \tan^2\theta$.
- id: pc-m5-r2-q11
  lesson: pc-trig-graphs-identities
  module_quiz: true
  topic: Trig graphs
  stem: 'Which statements about $y = -2\cos(4x) + 3$ are true? Select all that apply.'
  choices: ['Its amplitude is 2.', 'Its period is $8\pi$.', 'Its midline is $y = 3$.', 'Its maximum value is 1.', 'Its minimum value is 1.']
  answer: [0, 2, 4]
  explanation: |-
    Amplitude $|A| = |-2| = 2$; period $\frac{2\pi}{4} = \frac{\pi}{2}$ ($8\pi$ multiplies instead of dividing); midline $y = 3$. The graph runs from $3 - 2 = 1$ up to $3 + 2 = 5$, so the minimum is 1 and the maximum is 5. The minus sign flips the graph but doesn't change those values.
- id: pc-m5-r2-q12
  lesson: pc-trig-graphs-identities
  type: text
  topic: Trig identities
  stem: 'If $\cos\theta = 0.6$, then $\cos 2\theta =$ ___.'
  accept: ['-0.28', '-7/25']
  explanation: |-
    Use the form that needs only cosine: $\cos 2\theta = 2\cos^2\theta - 1 = 2(0.36) - 1 = -0.28$. No quadrant information is needed.
# Honors lesson 21h1: solving trigonometric equations
- id: pc-m5-r2-h01
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Solve $\sin x = \dfrac{\sqrt2}{2}$ on $[0, 2\pi)$.'
  choices: ['$x = \dfrac{\pi}{4}$ or $x = \dfrac{3\pi}{4}$', '$x = \dfrac{\pi}{4}$ or $x = \dfrac{7\pi}{4}$', '$x = \dfrac{\pi}{4}$ only', '$x = \dfrac{\pi}{4}$ or $x = \dfrac{5\pi}{4}$']
  answer: 0
  explanation: |-
    The principal value is $\alpha = \frac{\pi}{4}$, and the partner for sine is $\pi - \alpha = \frac{3\pi}{4}$ (sine is positive in Quadrants I and II). $\frac{7\pi}{4}$ uses the cosine partner $2\pi - \alpha$, $\frac{5\pi}{4}$ adds $\pi$ as if this were tangent, and stopping at $\frac{\pi}{4}$ misses a solution.
- id: pc-m5-r2-h02
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'What is the general solution of $\cos x = -\dfrac12$? ($k$ is any integer.)'
  choices: ['$x = \dfrac{2\pi}{3} + k\pi$', '$x = \pm\dfrac{\pi}{3} + 2k\pi$', '$x = \pm\dfrac{2\pi}{3} + 2k\pi$', '$x = \dfrac{2\pi}{3} + 2k\pi$ or $x = \dfrac{\pi}{3} + 2k\pi$']
  answer: 2
  explanation: |-
    $\beta = \cos^{-1}\left(-\frac12\right) = \frac{2\pi}{3}$, and cosine solutions come in pairs $\pm\beta$, so $x = \pm\frac{2\pi}{3} + 2k\pi$ (in $[0, 2\pi)$: $\frac{2\pi}{3}$ and $\frac{4\pi}{3}$). $\pm\frac{\pi}{3}$ solves $\cos x = \frac12$; adding $k\pi$ is the tangent pattern; $\frac{\pi}{3}$ uses the sine partner $\pi - \beta$, where cosine is $+\frac12$.
- id: pc-m5-r2-h03
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Solve $\tan x = -\sqrt3$ on $[0, 2\pi)$.'
  choices: ['$x = \dfrac{2\pi}{3}$ only', '$x = \dfrac{4\pi}{3}$ or $x = \dfrac{5\pi}{3}$', '$x = -\dfrac{\pi}{3}$ or $x = \dfrac{2\pi}{3}$', '$x = \dfrac{2\pi}{3}$ or $x = \dfrac{5\pi}{3}$']
  answer: 3
  explanation: |-
    $\tan^{-1}(-\sqrt3) = -\frac{\pi}{3}$, and tangent solutions repeat every $\pi$: $-\frac{\pi}{3} + \pi = \frac{2\pi}{3}$ and $-\frac{\pi}{3} + 2\pi = \frac{5\pi}{3}$. Both lie in Quadrants II and IV, where tangent is negative. $-\frac{\pi}{3}$ is not in the interval, and $\frac{4\pi}{3}$ has tangent $+\sqrt3$.
- id: pc-m5-r2-h04
  lesson: pc-m5-h-trig-equations
  type: text
  topic: Trig equations
  stem: 'The equation $\sin 3x = 0.4$ has ___ solutions in $[0, 2\pi)$. Give only the number.'
  accept: ['6', 'six']
  explanation: |-
    With $u = 3x$, $u$ runs over $[0, 6\pi)$: three full turns. Since $-1 < 0.4 < 1$, each turn has two solutions of $\sin u = 0.4$, so there are $2 \cdot 3 = 6$ values of $x$.
- id: pc-m5-r2-h05
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Solve $\cos x = -0.6$ on $[0, 2\pi)$, to 4 decimal places.'
  choices: ['$x \approx 2.2143$ only', '$x \approx 0.9273$ or $x \approx 2.2143$', '$x \approx 2.2143$ or $x \approx 4.0689$', '$x \approx -2.2143$ or $x \approx 2.2143$']
  answer: 2
  explanation: |-
    $\beta = \cos^{-1}(-0.6) \approx 2.2143$ (Quadrant II). The partner is $-\beta$, which needs $2\pi$ added to land in the interval: $2\pi - 2.2143 \approx 4.0689$ (Quadrant III). Cosine is negative in both. $0.9273 = \pi - \beta$ is the sine-style partner, where cosine is $+0.6$, and $-2.2143$ is outside $[0, 2\pi)$.
- id: pc-m5-r2-h06
  lesson: pc-m5-h-trig-equations
  type: order
  topic: Trig equations
  stem: 'Put the steps for solving $2\sin^2 x - \sin x - 1 = 0$ on $[0, 2\pi)$ in order.'
  items:
    - 'Substitute $u = \sin x$ to get $2u^2 - u - 1 = 0$'
    - 'Factor: $(2u + 1)(u - 1) = 0$'
    - 'Solve for $u$: $u = -\frac12$ or $u = 1$'
    - 'Solve $\sin x = -\frac12$ and $\sin x = 1$: $x = \frac{7\pi}{6}, \frac{11\pi}{6}, \frac{\pi}{2}$'
  explanation: |-
    Each step needs the one before it: the substitution turns the equation into an ordinary quadratic, factoring gives the two values of $u$, and only then can you solve the two basic sine equations. Check: $(2u + 1)(u - 1) = 2u^2 - u - 1$. ✓
- id: pc-m5-r2-h07
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Which values are solutions of $\sin 2x = \cos x$? Select all that apply.'
  choices: ['$\dfrac{\pi}{6}$', '$\dfrac{\pi}{2}$', '$\dfrac{5\pi}{6}$', '$\pi$', '$\dfrac{7\pi}{6}$', '$\dfrac{3\pi}{2}$']
  answer: [0, 1, 2, 5]
  explanation: |-
    $2\sin x\cos x - \cos x = 0$ factors as $\cos x\,(2\sin x - 1) = 0$. $\cos x = 0$ at $\frac{\pi}{2}$ and $\frac{3\pi}{2}$; $\sin x = \frac12$ at $\frac{\pi}{6}$ and $\frac{5\pi}{6}$. At $\pi$, $\sin 2\pi = 0$ but $\cos\pi = -1$; at $\frac{7\pi}{6}$, $\sin\frac{7\pi}{3} = \frac{\sqrt3}{2}$ but $\cos\frac{7\pi}{6} = -\frac{\sqrt3}{2}$.
- id: pc-m5-r2-h08
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'A student solves $\sin x\cos x = \sin x$ on $[0, 2\pi)$ by dividing both sides by $\sin x$, gets $\cos x = 1$, and answers $x = 0$. Which solution is missing?'
  choices: ['$x = \dfrac{\pi}{2}$', '$x = \pi$', '$x = \dfrac{3\pi}{2}$', '$x = 2\pi$']
  answer: 1
  explanation: |-
    Factor instead: $\sin x\cos x - \sin x = \sin x\,(\cos x - 1) = 0$. So $\sin x = 0$ ($x = 0$ or $\pi$) or $\cos x = 1$ ($x = 0$). Dividing by $\sin x$ threw away $x = \pi$, where $\sin x = 0$. At $\frac{\pi}{2}$ and $\frac{3\pi}{2}$ the left side is 0 but the right side is $\pm1$, and $2\pi$ is not in the interval.
- id: pc-m5-r2-h09
  lesson: pc-m5-h-trig-equations
  type: match
  topic: Trig equations
  stem: 'Each equation has exactly one solution in $[0, 2\pi)$. Match each equation to it.'
  pairs:
    - ['$\sin x = 1$', 'π/2']
    - ['$\sin x = -1$', '3π/2']
    - ['$\cos x = 1$', '0']
    - ['$\cos x = -1$', 'π']
  distractors: ['2π', '−π/2']
  explanation: |-
    When $c = \pm 1$ the line touches the unit circle at a single point. The top of the circle $(0, 1)$ is at $\frac{\pi}{2}$, the bottom $(0, -1)$ at $\frac{3\pi}{2}$, the right end $(1, 0)$ at $0$, and the left end $(-1, 0)$ at $\pi$. $2\pi$ and $-\frac{\pi}{2}$ are outside the interval.
- id: pc-m5-r2-h10
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Squaring $\cos x - \sin x = 1$ gives $\sin 2x = 0$, with candidates $0, \dfrac{\pi}{2}, \pi, \dfrac{3\pi}{2}$ in $[0, 2\pi)$. Which candidates solve the original equation?'
  choices: ['$0$ and $\dfrac{\pi}{2}$', '$0$ and $\dfrac{3\pi}{2}$', 'All four', '$\pi$ and $\dfrac{3\pi}{2}$']
  answer: 1
  explanation: |-
    Check each in $\cos x - \sin x$: at $0$, $1 - 0 = 1$ ✓; at $\frac{\pi}{2}$, $0 - 1 = -1$ ✗; at $\pi$, $-1 - 0 = -1$ ✗; at $\frac{3\pi}{2}$, $0 - (-1) = 1$ ✓. The rejected candidates solve $\cos x - \sin x = -1$, which squares to the same equation.
- id: pc-m5-r2-h11
  lesson: pc-m5-h-trig-equations
  type: text
  topic: Trig equations
  stem: 'The smallest positive solution of $\sin 2x = 1$ is $x =$ ___. Give an exact value such as pi/6, or a decimal rounded to 3 decimal places.'
  accept: ['pi/4', 'π/4', '1/4 pi', '(1/4)pi', 'pi / 4', '0.785', '.785', '0.7854']
  explanation: |-
    $\sin u = 1$ only at $u = \frac{\pi}{2} + 2k\pi$. With $u = 2x$, the smallest positive one is $2x = \frac{\pi}{2}$, so $x = \frac{\pi}{4} \approx 0.785$.
- id: pc-m5-r2-h12
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Daylight on day $t$ is modeled by $H(t) = 2.9\cos\left(\dfrac{2\pi}{365}(t - 172)\right) + 12.1$ hours. On about which days does the model give 14 hours of daylight?'
  choices: ['Around day 122 only', 'Around days 171 and 173', 'Never: 14 hours is above the maximum', 'Around days 122 and 222']
  answer: 3
  explanation: |-
    $\cos\theta = \frac{14 - 12.1}{2.9} \approx 0.6552$, so $\theta \approx \pm 0.8564$. Then $t - 172 = \pm 0.8564 \cdot \frac{365}{2\pi} \approx \pm 49.7$, giving $t \approx 122.3$ and $t \approx 221.7$. Keeping only the $+$ or only the $-$ sign loses a day; forgetting to undo the factor $\frac{2\pi}{365}$ gives days 171 and 173; and the maximum is $12.1 + 2.9 = 15$ hours, so 14 is reachable.
- id: pc-m5-r2-h13
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Which equation has no solution?'
  choices: ['$2\sin x - 3 = 0$', '$3\cos x = 2$', '$\sin x = -1$', '$\tan x = 5$']
  answer: 0
  explanation: |-
    $2\sin x - 3 = 0$ means $\sin x = 1.5$, and sine never exceeds 1. $\cos x = \frac23$ has two solutions per turn, $\sin x = -1$ has one ($\frac{3\pi}{2}$), and tangent takes every real value, so $\tan x = 5$ has solutions too.
- id: pc-m5-r2-h14
  lesson: pc-m5-h-trig-equations
  topic: Trig equations
  stem: 'Which angles solve $\tan x = 1$? Select all that apply.'
  choices: ['$\dfrac{\pi}{4}$', '$\dfrac{5\pi}{4}$', '$-\dfrac{3\pi}{4}$', '$\dfrac{3\pi}{4}$', '$\dfrac{9\pi}{4}$', '$\dfrac{7\pi}{4}$']
  answer: [0, 1, 2, 4]
  explanation: |-
    The general solution is $x = \frac{\pi}{4} + k\pi$: $k = 0$ gives $\frac{\pi}{4}$, $k = 1$ gives $\frac{5\pi}{4}$, $k = -1$ gives $-\frac{3\pi}{4}$, $k = 2$ gives $\frac{9\pi}{4}$. $\frac{3\pi}{4}$ and $\frac{7\pi}{4}$ are in Quadrants II and IV, where tangent is $-1$.
# Honors lesson 21h2: adding waves
- id: pc-m5-r2-h15
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'What is the amplitude of $y = 5\sin x + 12\cos x$?'
  choices: ['$17$', '$13$', '$12$', '$7$']
  answer: 1
  explanation: |-
    $R = \sqrt{5^2 + 12^2} = \sqrt{169} = 13$. Adding the coefficients (17) overcounts, because the two waves don't peak at the same $x$; 12 is just the larger coefficient.
- id: pc-m5-r2-h16
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Write $\sin x - \cos x$ in the form $R\sin(x + \varphi)$.'
  choices: ['$\sqrt2\sin\left(x + \dfrac{\pi}{4}\right)$', '$2\sin\left(x - \dfrac{\pi}{4}\right)$', '$\sqrt2\sin\left(x + \dfrac{3\pi}{4}\right)$', '$\sqrt2\sin\left(x - \dfrac{\pi}{4}\right)$']
  answer: 3
  explanation: |-
    $a = 1$, $b = -1$, so $R = \sqrt2$, $\cos\varphi = \frac{1}{\sqrt2}$, $\sin\varphi = -\frac{1}{\sqrt2}$: the point $(1, -1)$ is in Quadrant IV, so $\varphi = -\frac{\pi}{4}$. Check: $\sqrt2\left(\sin x\cos\frac{\pi}{4} - \cos x\sin\frac{\pi}{4}\right) = \sin x - \cos x$. $\sqrt2\sin\left(x + \frac{\pi}{4}\right)$ is $\sin x + \cos x$, $\sqrt2\sin\left(x + \frac{3\pi}{4}\right)$ is $-\sin x + \cos x$, and $R = 2$ adds $1 + 1$ instead of using $\sqrt{1 + 1}$.
- id: pc-m5-r2-h17
  lesson: pc-m5-h-combining-waves
  type: text
  topic: Combining sinusoids
  stem: 'The maximum value of $y = 6\sin x + 8\cos x + 3$ is ___. Give only the number.'
  accept: ['13']
  explanation: |-
    $6\sin x + 8\cos x = 10\sin(x + \varphi)$ with $R = \sqrt{36 + 64} = 10$, which ranges from $-10$ to $10$. Adding 3 gives a maximum of $13$ (and a minimum of $-7$).
- id: pc-m5-r2-h18
  lesson: pc-m5-h-combining-waves
  type: label
  topic: Combining sinusoids
  stem: 'The picture shows how $a\sin x + b\cos x$ becomes $R\sin(x + \varphi)$. Name the numbered parts.'
  image: {src: images/pc-m5-amp-phase-blank.svg, alt: 'A right triangle with a vertex at the origin: a horizontal leg along the x-axis, a vertical leg up to a dot, the hypotenuse from the origin to the dot, and an angle marked at the origin. Four places are numbered.'}
  labels:
    - {x: 42.5, y: 81.8, text: 'a, the coefficient of sin x'}
    - {x: 69.1, y: 55.0, text: 'b, the coefficient of cos x'}
    - {x: 42.0, y: 54.4, text: 'R, the amplitude'}
    - {x: 30.1, y: 75.5, text: 'φ, the phase angle'}
  distractors: [The period, The midline]
  explanation: |-
    The point is $(a, b)$, so the horizontal leg (1) is $a$, the coefficient of $\sin x$, and the vertical leg (2) is $b$, the coefficient of $\cos x$. The hypotenuse (3) is $R = \sqrt{a^2 + b^2}$, the amplitude, and the angle at the origin (4) is $\varphi$, with $\cos\varphi = \frac{a}{R}$ and $\sin\varphi = \frac{b}{R}$. The period is $2\pi$ and doesn't appear in the triangle.
- id: pc-m5-r2-h19
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: '$\sqrt3\sin x + \cos x = 2\sin(x + \varphi)$. What is $\varphi$?'
  choices: ['$\dfrac{\pi}{6}$', '$\dfrac{\pi}{3}$', '$-\dfrac{\pi}{6}$', '$\dfrac{5\pi}{6}$']
  answer: 0
  explanation: |-
    $\cos\varphi = \frac{a}{R} = \frac{\sqrt3}{2}$ and $\sin\varphi = \frac{b}{R} = \frac12$, so $\varphi = \frac{\pi}{6}$. Choosing $\frac{\pi}{3}$ swaps the roles of $a$ and $b$ (that is the answer for $\sin x + \sqrt3\cos x$).
- id: pc-m5-r2-h20
  lesson: pc-m5-h-combining-waves
  type: order
  topic: Combining sinusoids
  stem: 'Put the steps for finding where $a\sin x + b\cos x$ reaches its maximum in order.'
  items:
    - 'Compute $R = \sqrt{a^2 + b^2}$'
    - 'Find $\varphi$ from $\cos\varphi = \frac{a}{R}$ and $\sin\varphi = \frac{b}{R}$'
    - 'Write the expression as $R\sin(x + \varphi)$'
    - 'Solve $x + \varphi = \frac{\pi}{2}$ for the location of the maximum $R$'
  explanation: |-
    $\varphi$ is found from ratios that use $R$, so $R$ comes first. Only once the expression is a single sine can you say where it peaks: $\sin$ reaches 1 when its input is $\frac{\pi}{2}$, so the maximum $R$ is at $x = \frac{\pi}{2} - \varphi$.
- id: pc-m5-r2-h21
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Write $-\sin x - \cos x$ in the form $R\sin(x + \varphi)$ with $R > 0$.'
  choices: ['$\sqrt2\sin\left(x - \dfrac{3\pi}{4}\right)$', '$\sqrt2\sin\left(x + \dfrac{\pi}{4}\right)$', '$\sqrt2\sin\left(x + \dfrac{3\pi}{4}\right)$', '$2\sin\left(x - \dfrac{3\pi}{4}\right)$']
  answer: 0
  explanation: |-
    $a = b = -1$, $R = \sqrt2$, $\cos\varphi = \sin\varphi = -\frac{1}{\sqrt2}$: the point $(-1, -1)$ is in Quadrant III, so $\varphi = -\frac{3\pi}{4}$. The shortcut $\tan^{-1}\frac{b}{a} = \tan^{-1}1 = \frac{\pi}{4}$ ignores that $a < 0$ and gives $\sin x + \cos x$, the negative of the target. $\sqrt2\sin\left(x + \frac{3\pi}{4}\right) = -\sin x + \cos x$, and $R = 2$ is not $\sqrt{1 + 1}$.
- id: pc-m5-r2-h22
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Which can be written as a single sinusoid $R\sin(x + \varphi)$? Select all that apply.'
  choices: ['$3\sin x + 4\cos x$', '$\sin x - 7\cos x$', '$\sin x + \sin 2x$', '$\cos x$', '$\sin x + \cos 3x$']
  answer: [0, 1, 3]
  explanation: |-
    Any $a\sin x + b\cos x$ with the same $x$ works: $3\sin x + 4\cos x = 5\sin(x + \varphi)$, $\sin x - 7\cos x = \sqrt{50}\sin(x + \varphi)$, and even $\cos x = \sin\left(x + \frac{\pi}{2}\right)$ ($a = 0$, $b = 1$). Sums of waves with different periods, like $\sin x + \sin 2x$ or $\sin x + \cos 3x$, are not sinusoids.
- id: pc-m5-r2-h23
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Two pure tones of equal loudness, at 256 Hz and 260 Hz, sound together. How many beats per second does a listener hear?'
  choices: ['$2$', '$258$', '$4$', '$516$']
  answer: 2
  explanation: |-
    The beat frequency is the difference $|260 - 256| = 4$ per second. The envelope $\cos(2\pi\cdot 2t)$ has frequency 2, but loudness peaks twice per envelope cycle. 258 Hz is the pitch heard (the average), and 516 is the sum.
- id: pc-m5-r2-h24
  lesson: pc-m5-h-combining-waves
  type: text
  topic: Combining sinusoids
  stem: 'A guitarist hears beats between a string at 199 Hz and a tuning reference at 196 Hz. The beat frequency is ___ beats per second. Give only the number.'
  accept: ['3']
  explanation: |-
    Beat frequency $= |f_1 - f_2| = 199 - 196 = 3$ per second. Tightening or loosening the string until the beats slow and disappear brings it to 196 Hz.
- id: pc-m5-r2-h25
  lesson: pc-m5-h-combining-waves
  type: match
  topic: Combining sinusoids
  stem: 'Match each expression to an equal one.'
  pairs:
    - ['$\sin A + \sin B$', '2 sin((A + B)/2) cos((A − B)/2)']
    - ['$\cos A + \cos B$', '2 cos((A + B)/2) cos((A − B)/2)']
    - ['$\sin u\cos v$', '(1/2)[sin(u + v) + sin(u − v)]']
  distractors: ['2 sin((A + B)/2) sin((A − B)/2)', 'sin(A + B)']
  explanation: |-
    Adding $\sin(u + v) = \sin u\cos v + \cos u\sin v$ and $\sin(u - v) = \sin u\cos v - \cos u\sin v$ gives $2\sin u\cos v$, which is the product-to-sum formula. Putting $A = u + v$, $B = u - v$ gives the sum-to-product formula for $\sin A + \sin B$, and the cosine sum identities give the one for $\cos A + \cos B$ the same way. $\sin A + \sin B$ is not $\sin(A + B)$.
- id: pc-m5-r2-h26
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Which product equals $\sin 5x + \sin 3x$?'
  choices: ['$2\sin 8x\cos 2x$', '$2\sin 4x\sin x$', '$2\sin 4x\cos x$', '$\sin 8x$']
  answer: 2
  explanation: |-
    $\sin A + \sin B = 2\sin\frac{A + B}{2}\cos\frac{A - B}{2}$ with $A = 5x$, $B = 3x$: $2\sin 4x\cos x$. Forgetting to halve gives $2\sin 8x\cos 2x$; $\sin 8x$ treats the sum as $\sin(A + B)$.
- id: pc-m5-r2-h27
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'An idealized spring has position $y = 5\sin 3t + 12\cos 3t$ cm after $t$ seconds. What are the amplitude and the period of the motion?'
  choices: ['17 cm and $\dfrac{2\pi}{3}$ s', '13 cm and $\dfrac{2\pi}{3}$ s', '13 cm and $6\pi$ s', '13 cm and $\dfrac{\pi}{3}$ s']
  answer: 1
  explanation: |-
    $R = \sqrt{25 + 144} = 13$ cm, and both terms have $B = 3$, so the period is $\frac{2\pi}{3} \approx 2.09$ s. 17 adds the coefficients; $6\pi$ multiplies by $B$ instead of dividing; $\frac{\pi}{3}$ uses tangent's period.
- id: pc-m5-r2-h28
  lesson: pc-m5-h-combining-waves
  topic: Combining sinusoids
  stem: 'Use $\sin x + \sqrt3\cos x = 2\sin\left(x + \dfrac{\pi}{3}\right)$ to solve $\sin x + \sqrt3\cos x = 1$ on $[0, 2\pi)$.'
  choices: ['$x = \dfrac{\pi}{6}$ or $x = \dfrac{5\pi}{6}$', '$x = \dfrac{\pi}{2}$ or $x = \dfrac{3\pi}{2}$', '$x = -\dfrac{\pi}{6}$ or $x = \dfrac{\pi}{2}$', '$x = \dfrac{\pi}{2}$ or $x = \dfrac{11\pi}{6}$']
  answer: 3
  explanation: |-
    $\sin\left(x + \frac{\pi}{3}\right) = \frac12$, so $x + \frac{\pi}{3} = \frac{\pi}{6} + 2k\pi$ or $\frac{5\pi}{6} + 2k\pi$. Then $x = -\frac{\pi}{6} + 2k\pi$ (in the interval: $\frac{11\pi}{6}$) or $x = \frac{\pi}{2}$. Check $\frac{11\pi}{6}$: $-\frac12 + \sqrt3\cdot\frac{\sqrt3}{2} = -\frac12 + \frac32 = 1$. ✓ $\frac{\pi}{6}$ and $\frac{5\pi}{6}$ solve for $x + \frac{\pi}{3}$ and forget to subtract; $-\frac{\pi}{6}$ is outside $[0, 2\pi)$.
