- id: pc-q-2501
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  stem: 'What is the focus of the parabola $x^2 = 8y$?'
  choices: ['$(0, 8)$', '$(2, 0)$', '$(0, -2)$', '$(0, 2)$']
  answer: 3
  explanation: |-
    $4p = 8$, so $p = 2$. The $x$ is squared and $p > 0$, so it opens up and the focus is $(0, p) = (0, 2)$. Using $4p$ as the distance gives $(0, 8)$.
- id: pc-q-2502
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'What is the directrix of $y^2 = -12x$?'
  choices: ['$x = 3$', '$x = -3$', '$y = 3$', '$x = 12$']
  answer: 0
  explanation: |-
    $4p = -12$, so $p = -3$: the parabola opens left with focus $(-3, 0)$. The directrix is on the other side of the vertex: $x = 3$.
- id: pc-q-2503
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Which way does $(x - 1)^2 = -4(y + 2)$ open?'
  choices: ['Up', 'Left', 'Down', 'Right']
  answer: 2
  explanation: |-
    $x$ is squared, so it opens up or down; $4p = -4$ is negative, so down. The vertex is $(1, -2)$.
- id: pc-q-2504
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'What is the vertex of $(y + 3)^2 = 6(x - 4)$?'
  choices: ['$(4, -3)$', '$(-3, 4)$', '$(-4, 3)$', '$(3, -4)$']
  answer: 0
  explanation: |-
    The form is $(y - k)^2 = 4p(x - h)$ with $h = 4$ and $k = -3$. The vertex is $(h, k) = (4, -3)$.
- id: pc-q-2505
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  stem: 'Which parabola has focus $(0, 5)$ and directrix $y = -5$?'
  choices: ['$x^2 = 5y$', '$y^2 = 20x$', '$x^2 = 10y$', '$x^2 = 20y$']
  answer: 3
  explanation: |-
    The vertex is halfway between, at the origin, with $p = 5$ (focus above). $x^2 = 4py = 20y$.
- id: pc-q-2506
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Write $x^2 - 4x - 8y + 20 = 0$ in standard form. What is the focus?'
  choices: ['$(2, 2)$', '$(2, 4)$', '$(4, 2)$', '$(2, 0)$']
  answer: 1
  explanation: |-
    $x^2 - 4x = 8y - 20$; add 4: $(x - 2)^2 = 8y - 16 = 8(y - 2)$. Vertex $(2, 2)$, $p = 2$, opens up, so the focus is $(2, 4)$. $(2, 2)$ is the vertex.
- id: pc-q-2507
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  stem: 'What is the focal width (latus rectum length) of $y^2 = 10x$?'
  choices: ['$2.5$', '$5$', '$20$', '$10$']
  answer: 3
  explanation: |-
    The focal width is $|4p|$, and here $4p = 10$. ($p = 2.5$ is the focus distance.)
- id: pc-q-2508
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Which describes every point on a parabola?'
  choices: ['It is equally far from the focus and the directrix', 'Its distances to two foci add to a constant', 'Its distances to two foci differ by a constant', 'It is a fixed distance from the focus']
  answer: 0
  explanation: |-
    That is the definition of a parabola. The sum property defines an ellipse, the difference property a hyperbola, and a fixed distance from one point a circle.
- id: pc-q-2509
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'A parabolic dish is 6 ft across and 1.5 ft deep. How far from the vertex should the receiver (at the focus) be?'
  choices: ['1.5 ft', '6 ft', '0.375 ft', '3 ft']
  answer: 0
  explanation: |-
    Use $x^2 = 4py$ with the rim at $(3, 1.5)$: $9 = 4p(1.5) = 6p$, so $p = 1.5$ ft. (It happens to equal the depth here; that's a coincidence of these numbers.)
- id: pc-q-2510
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Find the equation of the parabola with vertex $(1, 1)$ and focus $(1, -2)$.'
  choices: ['$(x - 1)^2 = 12(y - 1)$', '$(y - 1)^2 = -12(x - 1)$', '$(x - 1)^2 = -3(y - 1)$', '$(x - 1)^2 = -12(y - 1)$']
  answer: 3
  explanation: |-
    The focus is 3 units below the vertex, so $p = -3$ and the parabola opens down: $(x - 1)^2 = 4(-3)(y - 1) = -12(y - 1)$.
- id: pc-q-2511
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Light rays traveling parallel to a parabolic mirror''s axis hit the mirror. Where do they go?'
  choices: ['Back along their own paths', 'Through the vertex', 'Through the focus', 'To the directrix']
  answer: 2
  explanation: |-
    The reflective property: rays parallel to the axis reflect through the focus. Reversed, a light at the focus produces a parallel beam.
- id: pc-q-2512
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  stem: 'Which equation describes a parabola?'
  choices: ['$x^2 + y^2 - 4x = 0$', '$y^2 - 4x + 2y = 0$', '$x^2 - y^2 = 4$', '$4x^2 + y^2 = 16$']
  answer: 1
  explanation: |-
    Only $y$ is squared (no $x^2$ term), so it is a parabola: $(y + 1)^2 = 4x + 1$. The others have both squares: $x^2 + y^2 - 4x = 0$ is a circle, $x^2 - y^2 = 4$ a hyperbola and $4x^2 + y^2 = 16$ an ellipse.

- id: pc-q-2601
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  stem: 'What are the foci of $\dfrac{x^2}{36} + \dfrac{y^2}{20} = 1$?'
  choices: ['$(\pm 4, 0)$', '$(0, \pm 4)$', '$(\pm 2\sqrt{14}, 0)$', '$(\pm 16, 0)$']
  answer: 0
  explanation: |-
    $a^2 = 36$ is under $x^2$, so the major axis is horizontal. $c^2 = a^2 - b^2 = 16$, $c = 4$: foci $(\pm 4, 0)$. Using $c^2 = a^2 + b^2$ gives $\sqrt{56} = 2\sqrt{14}$.
- id: pc-q-2602
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'What are the vertices of $\dfrac{x^2}{9} + \dfrac{y^2}{25} = 1$?'
  choices: ['$(\pm 3, 0)$', '$(\pm 5, 0)$', '$(0, \pm 25)$', '$(0, \pm 5)$']
  answer: 3
  explanation: |-
    The larger denominator, 25, is under $y^2$, so the major axis is vertical with $a = 5$: vertices $(0, \pm 5)$. $(\pm 3, 0)$ are the co-vertices.
- id: pc-q-2603
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'What is the eccentricity of $\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$?'
  choices: ['$\tfrac45$', '$\tfrac35$', '$\tfrac53$', '$\tfrac{9}{25}$']
  answer: 1
  explanation: |-
    $a = 5$, $b = 4$, $c = \sqrt{25 - 16} = 3$, so $e = \frac{c}{a} = \frac35$.
- id: pc-q-2604
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  stem: 'Which ellipse has vertices $(\pm 6, 0)$ and foci $(\pm 4, 0)$?'
  choices: ['$\dfrac{x^2}{36} + \dfrac{y^2}{16} = 1$', '$\dfrac{x^2}{36} + \dfrac{y^2}{52} = 1$', '$\dfrac{x^2}{20} + \dfrac{y^2}{36} = 1$', '$\dfrac{x^2}{36} + \dfrac{y^2}{20} = 1$']
  answer: 3
  explanation: |-
    $a = 6$, $c = 4$, $b^2 = a^2 - c^2 = 36 - 16 = 20$, with $a^2$ under $x^2$ for a horizontal major axis.
- id: pc-q-2605
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'What is the center of $\dfrac{(x + 2)^2}{9} + \dfrac{(y - 1)^2}{4} = 1$?'
  choices: ['$(2, -1)$', '$(-2, 1)$', '$(3, 2)$', '$(-2, -1)$']
  answer: 1
  explanation: |-
    $(x - h)$ with $x + 2 = x - (-2)$ gives $h = -2$; $(y - 1)$ gives $k = 1$.
- id: pc-q-2606
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'Write $4x^2 + 9y^2 - 16x + 18y - 11 = 0$ in standard form.'
  choices: ['$\dfrac{(x - 2)^2}{9} + \dfrac{(y + 1)^2}{4} = 1$', '$\dfrac{(x - 2)^2}{4} + \dfrac{(y + 1)^2}{9} = 1$', '$\dfrac{(x + 2)^2}{9} + \dfrac{(y - 1)^2}{4} = 1$', '$\dfrac{(x - 2)^2}{9} + \dfrac{(y + 1)^2}{4} = 11$']
  answer: 0
  explanation: |-
    $4(x^2 - 4x) + 9(y^2 + 2y) = 11$. Completing squares adds $4 \cdot 4 = 16$ and $9 \cdot 1 = 9$: $4(x - 2)^2 + 9(y + 1)^2 = 36$. Divide by 36: $\frac{(x-2)^2}{9} + \frac{(y+1)^2}{4} = 1$.
- id: pc-q-2607
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  stem: 'What are the center and radius of $x^2 + y^2 - 6x + 4y - 12 = 0$?'
  choices: ['Center $(-3, 2)$, radius 5', 'Center $(3, -2)$, radius $\sqrt{12}$', 'Center $(3, -2)$, radius 25', 'Center $(3, -2)$, radius 5']
  answer: 3
  explanation: |-
    $(x^2 - 6x + 9) + (y^2 + 4y + 4) = 12 + 9 + 4$, so $(x - 3)^2 + (y + 2)^2 = 25$: center $(3, -2)$, radius $\sqrt{25} = 5$.
- id: pc-q-2608
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'For an ellipse with semi-major axis $a$, semi-minor axis $b$ and focal distance $c$, which relation is correct?'
  choices: ['$c^2 = a^2 + b^2$', '$c = a - b$', '$c^2 = a^2 - b^2$', '$a^2 = b^2 - c^2$']
  answer: 2
  explanation: |-
    From a co-vertex, each focus is $a$ away, forming a right triangle with legs $b$ and $c$: $b^2 + c^2 = a^2$. $c^2 = a^2 + b^2$ is the hyperbola relation.
- id: pc-q-2609
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'How long is the minor axis of $\dfrac{x^2}{49} + \dfrac{y^2}{24} = 1$?'
  choices: ['$4\sqrt6$', '$24$', '$2\sqrt6$', '$14$']
  answer: 0
  explanation: |-
    $b = \sqrt{24} = 2\sqrt6$, and the minor axis has length $2b = 4\sqrt6 \approx 9.8$. (14 is the major axis length $2a$.)
- id: pc-q-2610
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'An elliptical room is 26 ft long and 10 ft wide. How far apart are its foci?'
  choices: ['12 ft', '16 ft', '24 ft', '28 ft']
  answer: 2
  explanation: |-
    $a = 13$, $b = 5$, $c = \sqrt{169 - 25} = 12$. The foci are $2c = 24$ ft apart.
- id: pc-q-2611
  lesson: pc-ellipses
  topic: Ellipses
  stem: 'An ellipse has eccentricity very close to 0. What does it look like?'
  choices: ['Nearly a circle', 'Long and thin', 'Nearly a parabola', 'Nearly a line segment']
  answer: 0
  explanation: |-
    $e = \frac ca \approx 0$ means the foci are almost at the center, so the ellipse is nearly circular. $e$ near 1 gives a long, thin ellipse.
- id: pc-q-2612
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  stem: 'Which equation is an ellipse with a vertical major axis?'
  choices: ['$\dfrac{x^2}{9} + \dfrac{y^2}{4} = 1$', '$\dfrac{y^2}{9} - \dfrac{x^2}{4} = 1$', '$x^2 + y^2 = 9$', '$\dfrac{x^2}{4} + \dfrac{y^2}{9} = 1$']
  answer: 3
  explanation: |-
    The larger denominator (9) is under $y^2$, so the long axis is vertical. $\frac{x^2}{9} + \frac{y^2}{4} = 1$ has its long axis horizontal, $\frac{y^2}{9} - \frac{x^2}{4} = 1$ is a hyperbola, and $x^2 + y^2 = 9$ is a circle.

- id: pc-q-2701
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Hyperbolas
  stem: 'What are the foci of $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$?'
  choices: ['$(\pm 5, 0)$', '$(\pm\sqrt7, 0)$', '$(0, \pm 5)$', '$(\pm 3, 0)$']
  answer: 0
  explanation: |-
    For a hyperbola $c^2 = a^2 + b^2 = 9 + 16 = 25$, so $c = 5$. The $x^2$ term is positive, so the foci are on the $x$-axis. $\sqrt7$ uses the ellipse relation; $(\pm 3, 0)$ are the vertices.
- id: pc-q-2702
  lesson: pc-hyperbolas
  topic: Hyperbolas
  stem: 'What are the asymptotes of $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$?'
  choices: ['$y = \pm\tfrac34 x$', '$y = \pm\tfrac{16}{9}x$', '$y = \pm\tfrac43 x$', '$y = \pm\tfrac{9}{16}x$']
  answer: 2
  explanation: |-
    For a left/right hyperbola the slopes are $\pm\frac ba = \pm\frac43$. Using the squares gives $\frac{16}{9}$; flipping gives $\frac34$.
- id: pc-q-2703
  lesson: pc-hyperbolas
  topic: Hyperbolas
  stem: 'Which way does $\dfrac{y^2}{4} - \dfrac{x^2}{25} = 1$ open, and where are its vertices?'
  choices: ['Left/right; $(\pm 5, 0)$', 'Up/down; $(0, \pm 5)$', 'Left/right; $(\pm 2, 0)$', 'Up/down; $(0, \pm 2)$']
  answer: 3
  explanation: |-
    The positive term is $y^2$, so it opens up and down, with $a^2 = 4$ under it: vertices $(0, \pm 2)$. For hyperbolas $a$ goes with the positive term, even if it is the smaller number.
- id: pc-q-2704
  lesson: pc-hyperbolas
  topic: Hyperbolas
  stem: 'What are the asymptotes of $\dfrac{y^2}{4} - \dfrac{x^2}{25} = 1$?'
  choices: ['$y = \pm\tfrac25 x$', '$y = \pm\tfrac52 x$', '$y = \pm\tfrac{4}{25}x$', '$y = \pm 2x$']
  answer: 0
  explanation: |-
    Setting the right side to 0: $\frac{y^2}{4} = \frac{x^2}{25}$, so $y = \pm\frac25 x$. For up/down hyperbolas the slope is $\frac ab$ with $a = 2$, $b = 5$.
- id: pc-q-2705
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Identifying conics
  stem: 'Identify the conic $4x^2 - 9y^2 + 8x - 18y - 41 = 0$.'
  choices: ['Ellipse', 'Parabola', 'Hyperbola', 'Circle']
  answer: 2
  explanation: |-
    There is no $xy$ term, and the $x^2$ and $y^2$ coefficients have opposite signs ($AC = -36 < 0$): a hyperbola.
- id: pc-q-2706
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Identifying conics
  stem: 'Identify the conic $2x^2 + 2y^2 - 8x + 12y + 1 = 0$.'
  choices: ['Circle', 'Ellipse with $a \ne b$', 'Hyperbola', 'Parabola']
  answer: 0
  explanation: |-
    Both squared terms have the same coefficient (2) and no $xy$ term: a circle (dividing by 2 and completing squares gives $(x-2)^2 + (y+3)^2 = \frac{25}{2}$).
- id: pc-q-2707
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Identifying conics
  stem: 'Identify the conic $y^2 - 6x + 4y = 0$.'
  choices: ['Ellipse', 'Hyperbola', 'Circle', 'Parabola']
  answer: 3
  explanation: |-
    Only one variable is squared: a parabola, $(y + 2)^2 = 6x + 4$.
- id: pc-q-2708
  lesson: pc-hyperbolas
  topic: Identifying conics
  stem: 'Use the discriminant to classify $x^2 + 4xy + y^2 = 3$.'
  choices: ['Ellipse, since $B^2 - 4AC < 0$', 'Parabola, since $B^2 - 4AC = 0$', 'Hyperbola, since $B^2 - 4AC > 0$', 'Circle, since $A = C$']
  answer: 2
  explanation: |-
    $B^2 - 4AC = 16 - 4(1)(1) = 12 > 0$: a hyperbola (rotated $45^\circ$). $A = C$ only signals a circle when $B = 0$.
- id: pc-q-2709
  lesson: pc-hyperbolas
  topic: Hyperbolas
  stem: 'Which hyperbola has vertices $(\pm 3, 0)$ and foci $(\pm 5, 0)$?'
  choices: ['$\dfrac{x^2}{9} - \dfrac{y^2}{25} = 1$', '$\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$', '$\dfrac{x^2}{9} + \dfrac{y^2}{16} = 1$', '$\dfrac{y^2}{9} - \dfrac{x^2}{16} = 1$']
  answer: 1
  explanation: |-
    $a = 3$, $c = 5$, $b^2 = c^2 - a^2 = 16$, opening left/right: $\frac{x^2}{9} - \frac{y^2}{16} = 1$.
- id: pc-q-2710
  lesson: pc-hyperbolas
  topic: Hyperbolas
  stem: 'What is the eccentricity of $\dfrac{x^2}{16} - \dfrac{y^2}{9} = 1$?'
  choices: ['$\tfrac34$', '$\tfrac{\sqrt7}{4}$', '$\tfrac45$', '$\tfrac54$']
  answer: 3
  explanation: |-
    $c = \sqrt{16 + 9} = 5$ and $a = 4$, so $e = \frac54$. Every hyperbola has $e > 1$.
- id: pc-q-2711
  lesson: pc-hyperbolas
  topic: Identifying conics
  stem: 'Rotating the axes removes the $xy$ term from $Ax^2 + Bxy + Cy^2 + \dots = 0$. Which angle $\theta$ works?'
  choices: ['$\tan\theta = \dfrac{B}{A + C}$', '$\cot 2\theta = \dfrac{A - C}{B}$', '$\sin 2\theta = \dfrac{B}{A}$', '$\theta = 45^\circ$ always']
  answer: 1
  explanation: |-
    Choosing $\cot 2\theta = \frac{A - C}{B}$ makes the new $x'y'$ coefficient zero. It gives $45^\circ$ only when $A = C$, as in $xy = 1$.
- id: pc-q-2712
  lesson: pc-hyperbolas
  topic: Identifying conics
  stem: 'Completing the square on $x^2 - y^2 - 2x + 2y = 0$ gives $(x - 1)^2 - (y - 1)^2 = 0$. What is the graph?'
  choices: ['A hyperbola centered at $(1, 1)$', 'The single point $(1, 1)$', 'No graph', 'A pair of lines crossing at $(1, 1)$']
  answer: 3
  explanation: |-
    $(x - 1)^2 = (y - 1)^2$ means $y - 1 = \pm(x - 1)$: two lines, $y = x$ and $y = 2 - x$. A right side of 0 signals a degenerate conic.

- id: pc-q-2801
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'For $x = t^2 - 1$, $y = 3t + 1$, what point corresponds to $t = 2$?'
  choices: ['$(3, 7)$', '$(4, 7)$', '$(3, 6)$', '$(7, 3)$']
  answer: 0
  explanation: |-
    $x = 4 - 1 = 3$ and $y = 6 + 1 = 7$.
- id: pc-q-2802
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'Eliminate the parameter: $x = 2t + 1$, $y = t - 3$.'
  choices: ['$y = 2x - 7$', '$y = \tfrac{x}{2} - 3$', '$y = 2x + 1$', '$y = \tfrac{x}{2} - \tfrac72$']
  answer: 3
  explanation: |-
    $t = \frac{x - 1}{2}$, so $y = \frac{x - 1}{2} - 3 = \frac{x}{2} - \frac72$.
- id: pc-q-2803
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'What curve is traced by $x = 2\cos t$, $y = 5\sin t$, $0 \le t \le 2\pi$?'
  choices: ['The circle $x^2 + y^2 = 25$', 'The ellipse $\dfrac{x^2}{4} + \dfrac{y^2}{25} = 1$', 'The ellipse $\dfrac{x^2}{25} + \dfrac{y^2}{4} = 1$', 'The hyperbola $\dfrac{x^2}{4} - \dfrac{y^2}{25} = 1$']
  answer: 1
  explanation: |-
    $\cos t = \frac x2$ and $\sin t = \frac y5$, and $\cos^2 t + \sin^2 t = 1$ gives $\frac{x^2}{4} + \frac{y^2}{25} = 1$.
- id: pc-q-2804
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'As $t$ increases, in which direction does $x = \cos t$, $y = \sin t$ move around the unit circle?'
  choices: ['Clockwise', 'Counterclockwise', 'It moves back and forth', 'It stays at $(1, 0)$']
  answer: 1
  explanation: |-
    At $t = 0$ it is at $(1, 0)$; at $t = \frac{\pi}{2}$ it is at $(0, 1)$. Moving from the positive $x$-axis to the positive $y$-axis is counterclockwise.
- id: pc-q-2805
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'Which parametrizes the segment from $(2, -1)$ to $(6, 3)$, starting at $(2, -1)$ when $t = 0$ and ending at $(6, 3)$ when $t = 1$?'
  choices: ['$x = 2 + 6t$, $y = -1 + 3t$', '$x = 6 - 4t$, $y = 3 - 4t$', '$x = 2 + 4t$, $y = -1 + 4t$', '$x = 4 + 2t$, $y = 4 - t$']
  answer: 2
  explanation: |-
    Start at $(2, -1)$ and add $t$ times the change $(4, 4)$. At $t = 1$: $(6, 3)$. ✓ $x = 6 - 4t$, $y = 3 - 4t$ traces the same segment backward (from $(6, 3)$ to $(2, -1)$).
- id: pc-q-2806
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'Describe the curve $x = t$, $y = t^2$ for $0 \le t \le 2$.'
  choices: ['The whole parabola $y = x^2$', 'The line $y = x$ from $(0, 0)$ to $(2, 2)$', 'The part of $y = x^2$ from $(0, 0)$ to $(2, 4)$', 'The part of $x = y^2$ from $(0, 0)$ to $(4, 2)$']
  answer: 2
  explanation: |-
    $y = x^2$, but only for $x$ from 0 to 2, traced from $(0, 0)$ to $(2, 4)$. The parameter interval restricts the curve.
- id: pc-q-2807
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'A ball moves by $x = 30t$, $y = 20t - 4.9t^2$ (meters, seconds). How far does it travel horizontally before landing?'
  choices: ['About 61.2 m', 'About 20.4 m', 'About 4.08 m', 'About 122.4 m']
  answer: 3
  explanation: |-
    $y = 0$ when $t(20 - 4.9t) = 0$: $t = \frac{20}{4.9} \approx 4.08$ s. Then $x = 30(4.08) \approx 122.4$ m. 20.4 m is the maximum height.
- id: pc-q-2808
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'For the same ball, $y = 20t - 4.9t^2$, what is its maximum height?'
  choices: ['About 20.4 m', 'About 40.8 m', 'About 2.04 m', 'About 10.2 m']
  answer: 0
  explanation: |-
    The vertex of $y(t)$ is at $t = \frac{20}{9.8} \approx 2.04$ s, where $y \approx 20(2.04) - 4.9(2.04)^2 \approx 20.4$ m.
- id: pc-q-2809
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'Which parametrization traces the unit circle clockwise?'
  choices: ['$x = \cos t$, $y = \sin t$', '$x = \sin t$, $y = -\cos t$', '$x = \cos 2t$, $y = \sin 2t$', '$x = \cos t$, $y = -\sin t$']
  answer: 3
  explanation: |-
    At $t = 0$ it is at $(1, 0)$; at $t = \frac{\pi}{2}$ it is at $(0, -1)$: from the positive $x$-axis down to the negative $y$-axis, which is clockwise. $(\sin t, -\cos t)$ goes from $(0, -1)$ to $(1, 0)$, counterclockwise.
- id: pc-q-2810
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'Eliminate the parameter: $x = e^t$, $y = e^{2t}$.'
  choices: ['$y = x^2$ for $x > 0$', '$y = 2x$', '$y = x^2$ for all $x$', '$y = e^x$']
  answer: 0
  explanation: |-
    $y = (e^t)^2 = x^2$. Since $x = e^t > 0$, only the right half of the parabola is traced.
- id: pc-q-2811
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'What curve is $x = 3 + 2\cos t$, $y = -1 + 2\sin t$?'
  choices: ['Circle, center $(-3, 1)$, radius 2', 'Circle, center $(3, -1)$, radius 4', 'Ellipse, center $(3, -1)$', 'Circle, center $(3, -1)$, radius 2']
  answer: 3
  explanation: |-
    $(x - 3)^2 + (y + 1)^2 = 4\cos^2 t + 4\sin^2 t = 4$: center $(3, -1)$, radius 2.
- id: pc-q-2812
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'What information does a parametric description give that the rectangular equation of the same curve does not?'
  choices: ['The curve''s shape', 'The direction and timing of motion along the curve', 'The curve''s $x$-intercepts', 'Whether the curve is a function']
  answer: 1
  explanation: |-
    Eliminating $t$ keeps the shape but loses orientation (which way the point moves) and when it reaches each point.

- id: pc-q-2901
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Convert the polar point $\left(6, \tfrac{\pi}{3}\right)$ to rectangular coordinates.'
  choices: ['$(3\sqrt3, 3)$', '$(3, 3\sqrt3)$', '$(6, 2)$', '$(3, 3)$']
  answer: 1
  explanation: |-
    $x = 6\cos\frac{\pi}{3} = 3$ and $y = 6\sin\frac{\pi}{3} = 3\sqrt3$. Swapping sine and cosine gives $(3\sqrt3, 3)$.
- id: pc-q-2902
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'Convert $(0, -5)$ to polar coordinates with $r > 0$ and $0 \le \theta < 2\pi$.'
  choices: ['$\left(5, \tfrac{\pi}{2}\right)$', '$(-5, 0)$', '$(5, \pi)$', '$\left(5, \tfrac{3\pi}{2}\right)$']
  answer: 3
  explanation: |-
    The point is 5 units straight down from the origin, in the direction $\frac{3\pi}{2}$.
- id: pc-q-2903
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'Which polar pair names the same point as $\left(-3, \tfrac{\pi}{6}\right)$?'
  choices: ['$\left(3, \tfrac{\pi}{6}\right)$', '$\left(3, -\tfrac{\pi}{6}\right)$', '$\left(3, \tfrac{7\pi}{6}\right)$', '$\left(-3, \tfrac{7\pi}{6}\right)$']
  answer: 2
  explanation: |-
    Negative $r$ points in the opposite direction: $(-r, \theta) = (r, \theta + \pi)$, so $\left(3, \frac{\pi}{6} + \pi\right) = \left(3, \frac{7\pi}{6}\right)$.
- id: pc-q-2904
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Convert $(1, -\sqrt3)$ to polar with $r > 0$, $0 \le \theta < 2\pi$.'
  choices: ['$\left(2, \tfrac{5\pi}{3}\right)$', '$\left(2, \tfrac{2\pi}{3}\right)$', '$\left(2, -\tfrac{\pi}{3}\right)$', '$\left(4, \tfrac{5\pi}{3}\right)$']
  answer: 0
  explanation: |-
    $r = \sqrt{1 + 3} = 2$. $\tan\theta = -\sqrt3$ and the point is in Quadrant IV, so $\theta = \frac{5\pi}{3}$. ($-\frac{\pi}{3}$ is the same direction but outside the required range; $\frac{2\pi}{3}$ is in the wrong quadrant.)
- id: pc-q-2905
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'Which rectangular equation is equivalent to $r = 4\cos\theta$?'
  choices: ['$x = 4$', '$(x - 2)^2 + y^2 = 4$', '$x^2 + y^2 = 16$', '$x^2 + (y - 2)^2 = 4$']
  answer: 1
  explanation: |-
    Multiply by $r$: $r^2 = 4r\cos\theta$, so $x^2 + y^2 = 4x$, i.e. $(x - 2)^2 + y^2 = 4$: a circle through the pole, centered at $(2, 0)$.
- id: pc-q-2906
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Write the line $y = 3$ in polar form.'
  choices: ['$r = 3$', '$\theta = 3$', '$r = 3\sin\theta$', '$r = 3\csc\theta$']
  answer: 3
  explanation: |-
    $r\sin\theta = 3$, so $r = \frac{3}{\sin\theta} = 3\csc\theta$. $r = 3$ is a circle; $r = 3\sin\theta$ is a circle through the pole.
- id: pc-q-2907
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'How many petals does the rose $r = 5\sin 3\theta$ have?'
  choices: ['3', '6', '5', '15']
  answer: 0
  explanation: |-
    With $n = 3$ odd, the rose has $n = 3$ petals (of length 5).
- id: pc-q-2908
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'How many petals does $r = 2\cos 4\theta$ have?'
  choices: ['4', '2', '8', '16']
  answer: 2
  explanation: |-
    With $n = 4$ even, the rose has $2n = 8$ petals.
- id: pc-q-2909
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'What kind of curve is $r = 3 + 3\sin\theta$?'
  choices: ['A circle', 'A cardioid', 'A rose', 'A spiral']
  answer: 1
  explanation: |-
    It has the form $r = a + b\sin\theta$ with $|a| = |b|$: a limaçon of the special heart-shaped kind, a cardioid. It passes through the pole at $\theta = \frac{3\pi}{2}$.
- id: pc-q-2910
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'What is the graph of $\theta = \dfrac{\pi}{4}$ (all $r$)?'
  choices: ['A circle of radius $\tfrac{\pi}{4}$', 'The ray in Quadrant I only', 'The line $y = x$', 'The line $x = \tfrac{\pi}{4}$']
  answer: 2
  explanation: |-
    Every point in the direction $\frac{\pi}{4}$, including negative $r$ (which points into Quadrant III), lies on the line through the pole with slope $\tan\frac{\pi}{4} = 1$: $y = x$.
- id: pc-q-2911
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'Write $x^2 + y^2 = 16$ in polar form.'
  choices: ['$r = 4$', '$r = 16$', '$\theta = 4$', '$r = 4\cos\theta$']
  answer: 0
  explanation: |-
    $x^2 + y^2 = r^2$, so $r^2 = 16$ and $r = 4$ (a circle of radius 4 about the pole).
- id: pc-q-2912
  lesson: pc-polar
  topic: Polar coordinates
  stem: 'A student converts $(-1, 1)$ to polar and writes $\theta = \tan^{-1}(-1) = -\tfrac{\pi}{4}$, so $(\sqrt2, -\tfrac{\pi}{4})$. What is the correct answer with $r > 0$, $0 \le \theta < 2\pi$?'
  choices: ['$\left(\sqrt2, \tfrac{7\pi}{4}\right)$', '$\left(\sqrt2, \tfrac{\pi}{4}\right)$', '$\left(2, \tfrac{3\pi}{4}\right)$', '$\left(\sqrt2, \tfrac{3\pi}{4}\right)$']
  answer: 3
  explanation: |-
    $(-1, 1)$ is in Quadrant II, but $\tan^{-1}$ returned a Quadrant IV angle. Add $\pi$: $-\frac{\pi}{4} + \pi = \frac{3\pi}{4}$. $\frac{7\pi}{4}$ is the student's point, $(1, -1)$.

- id: pc-q-2913
  lesson: pc-polar
  module_quiz: true
  topic: Polar form of complex numbers
  stem: 'Write $z = 1 + \sqrt3\,i$ in polar form $r(\cos\theta + i\sin\theta)$ with $r > 0$ and $0 \le \theta < 2\pi$.'
  choices: ['$4\left(\cos\tfrac{\pi}{3} + i\sin\tfrac{\pi}{3}\right)$', '$2\left(\cos\tfrac{\pi}{6} + i\sin\tfrac{\pi}{6}\right)$', '$2\left(\cos\tfrac{2\pi}{3} + i\sin\tfrac{2\pi}{3}\right)$', '$2\left(\cos\tfrac{\pi}{3} + i\sin\tfrac{\pi}{3}\right)$']
  answer: 3
  explanation: |-
    $r = \sqrt{1^2 + (\sqrt3)^2} = 2$. The point $(1, \sqrt3)$ is in Quadrant I with $\tan\theta = \sqrt3$, so $\theta = \frac{\pi}{3}$. A modulus of 4 forgets the square root; $\frac{\pi}{6}$ comes from using $\frac xy$ instead of $\frac yx$; $\frac{2\pi}{3}$ puts the point in Quadrant II.
- id: pc-q-2914
  lesson: pc-polar
  topic: Polar form of complex numbers
  stem: 'Multiply $3\left(\cos\tfrac{\pi}{6} + i\sin\tfrac{\pi}{6}\right)$ by $2\left(\cos\tfrac{\pi}{3} + i\sin\tfrac{\pi}{3}\right)$.'
  choices: ['$6i$', '$5i$', '$3\sqrt3 + 3i$', '$6\left(\cos\tfrac{\pi^2}{18} + i\sin\tfrac{\pi^2}{18}\right)$']
  answer: 0
  explanation: |-
    Multiply the moduli and add the arguments: $6\left(\cos\frac{\pi}{2} + i\sin\frac{\pi}{2}\right) = 6(0 + i) = 6i$. $5i$ adds the moduli; $3\sqrt3 + 3i$ is $6\left(\cos\frac{\pi}{6} + i\sin\frac{\pi}{6}\right)$, from subtracting the arguments; $\frac{\pi^2}{18}$ multiplies the arguments.
- id: pc-q-2915
  lesson: pc-polar
  module_quiz: true
  topic: Polar form of complex numbers
  stem: 'Use De Moivre''s theorem to find $(\sqrt3 + i)^6$.'
  choices: ['$64$', '$-64$', '$64i$', '$-12$']
  answer: 1
  explanation: |-
    $\sqrt3 + i$ has $r = \sqrt{3 + 1} = 2$ and $\theta = \frac{\pi}{6}$. So $(\sqrt3 + i)^6 = 2^6\left(\cos\pi + i\sin\pi\right) = 64(-1 + 0i) = -64$. $64$ comes from using $\theta = \frac{\pi}{3}$ (so $6\theta = 2\pi$); $64i$ comes from $\theta = \frac{\pi}{12}$; $-12$ multiplies the modulus by 6 instead of raising it to the 6th power.
- id: pc-q-2916
  lesson: pc-polar
  topic: Polar form of complex numbers
  stem: 'A complex number $z$ has modulus 3 and argument $\theta$. What are the modulus and argument of $z^4$?'
  choices: ['Modulus $81$, argument $4\theta$', 'Modulus $12$, argument $4\theta$', 'Modulus $81$, argument $\theta + 4$', 'Modulus $81$, argument $\theta^4$']
  answer: 0
  explanation: |-
    By De Moivre's theorem, $z^4 = 3^4(\cos 4\theta + i\sin 4\theta)$: the modulus is raised to the 4th power ($81$) and the argument is multiplied by 4. Modulus 12 multiplies by 4 instead of raising to the 4th power; $\theta + 4$ and $\theta^4$ treat the argument wrongly, since multiplying adds arguments, so four equal factors give $4\theta$.
- id: pc-q-3001
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  stem: 'Identify the conic $r = \dfrac{12}{4 + 3\cos\theta}$.'
  choices: ['Ellipse, $e = \tfrac34$', 'Hyperbola, $e = 3$', 'Parabola, $e = 1$', 'Hyperbola, $e = \tfrac43$']
  answer: 0
  explanation: |-
    Divide top and bottom by 4: $r = \frac{3}{1 + \frac34\cos\theta}$. So $e = \frac34 < 1$: an ellipse. Reading $e = 3$ before normalizing is the classic mistake.
- id: pc-q-3002
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'Identify $r = \dfrac{5}{1 - \cos\theta}$ and its directrix.'
  choices: ['Ellipse, directrix $x = 5$', 'Parabola, directrix $x = -5$', 'Parabola, directrix $x = 5$', 'Hyperbola, directrix $y = -5$']
  answer: 1
  explanation: |-
    $e = 1$: parabola. $ed = 5$ gives $d = 5$, and $-\cos\theta$ puts the directrix to the left of the pole: $x = -5$.
- id: pc-q-3003
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'Identify $r = \dfrac{6}{2 + 6\sin\theta}$.'
  choices: ['Ellipse, $e = \tfrac13$', 'Parabola', 'Hyperbola, $e = 6$', 'Hyperbola, $e = 3$']
  answer: 3
  explanation: |-
    Divide by 2: $r = \frac{3}{1 + 3\sin\theta}$. $e = 3 > 1$: a hyperbola, with $d = 1$ and directrix $y = 1$.
- id: pc-q-3004
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  stem: 'For $r = \dfrac{15}{3 - 2\cos\theta}$, find $e$ and the directrix.'
  choices: ['$e = 2$, directrix $x = -\tfrac{15}{2}$', '$e = \tfrac23$, directrix $x = 5$', '$e = \tfrac23$, directrix $x = -\tfrac{15}{2}$', '$e = \tfrac23$, directrix $x = \tfrac{15}{2}$']
  answer: 2
  explanation: |-
    Normalize: $\frac{5}{1 - \frac23\cos\theta}$. $e = \frac23$, $ed = 5$, so $d = \frac{15}{2}$; the minus cosine puts the directrix on the left: $x = -\frac{15}{2}$. Using $ed$ as $d$ gives $x = 5$.
- id: pc-q-3005
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'Find the vertices (rectangular) of $r = \dfrac{6}{1 + 0.5\cos\theta}$.'
  choices: ['$(4, 0)$ and $(-12, 0)$', '$(6, 0)$ and $(-6, 0)$', '$(4, 0)$ and $(12, 0)$', '$(12, 0)$ and $(-4, 0)$']
  answer: 0
  explanation: |-
    $\theta = 0$: $r = \frac{6}{1.5} = 4$, the point $(4, 0)$. $\theta = \pi$: $r = \frac{6}{0.5} = 12$ in the direction $\pi$, the point $(-12, 0)$.
- id: pc-q-3006
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  stem: 'Which polar equation is a parabola with focus at the pole and directrix $y = -3$?'
  choices: ['$r = \dfrac{3}{1 + \sin\theta}$', '$r = \dfrac{3}{1 - \cos\theta}$', '$r = \dfrac{1}{1 - 3\sin\theta}$', '$r = \dfrac{3}{1 - \sin\theta}$']
  answer: 3
  explanation: |-
    Parabola: $e = 1$, so $r = \frac{d}{1 \pm \sin\theta}$ with $d = 3$; a directrix below the pole takes the minus sign.
- id: pc-q-3007
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  stem: 'Write a polar equation for the ellipse with a focus at the pole, $e = \tfrac13$ and directrix $x = 9$.'
  choices: ['$r = \dfrac{9}{1 + 3\cos\theta}$', '$r = \dfrac{9}{3 + \cos\theta}$', '$r = \dfrac{3}{3 + \cos\theta}$', '$r = \dfrac{9}{3 - \cos\theta}$']
  answer: 1
  explanation: |-
    $ed = 3$, so $r = \frac{3}{1 + \frac13\cos\theta}$; multiply top and bottom by 3: $\frac{9}{3 + \cos\theta}$. A directrix on the right uses $+\cos\theta$.
- id: pc-q-3008
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'In the focus-directrix definition, the eccentricity $e$ is:'
  choices: ['the distance from the focus to the directrix', 'the ratio (distance to focus) ÷ (distance to directrix)', 'the ratio (distance to directrix) ÷ (distance to focus)', 'the distance between the two foci']
  answer: 1
  explanation: |-
    Every point $P$ on the conic satisfies $\frac{PF}{PD} = e$. The distance from focus to directrix is $d$.
- id: pc-q-3009
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'For which eccentricity is $r = \dfrac{ed}{1 + e\cos\theta}$ a hyperbola?'
  choices: ['$e = 0$', '$e = 0.5$', '$e = 1$', '$e = 1.5$']
  answer: 3
  explanation: |-
    $e > 1$ gives a hyperbola, $e = 1$ a parabola, $0 < e < 1$ an ellipse.
- id: pc-q-3010
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'A comet''s orbit is $r = \dfrac{2}{1 + 0.2\cos\theta}$ (AU) with the sun at the pole. What is its closest distance to the sun?'
  choices: ['$2$ AU', '$\tfrac53$ AU', '$2.5$ AU', '$0.4$ AU']
  answer: 1
  explanation: |-
    The closest point is where the denominator is largest, $\theta = 0$: $r = \frac{2}{1.2} = \frac53 \approx 1.67$ AU. The farthest is $\frac{2}{0.8} = 2.5$ AU.
- id: pc-q-3011
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'Why is the eccentricity of $r = \dfrac{10}{3 + 2\cos\theta}$ equal to $\tfrac23$ rather than 2?'
  choices: ['Because the numerator is 10', 'The standard form needs a 1 in the denominator, so divide top and bottom by 3', 'Because cosine is at most 1', 'Because $e$ is always less than 1']
  answer: 1
  explanation: |-
    The form $\frac{ed}{1 + e\cos\theta}$ requires the constant term 1. Dividing by 3 gives $\frac{10/3}{1 + \frac23\cos\theta}$, so $e = \frac23$.
- id: pc-q-3012
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'For the hyperbola $r = \dfrac{6}{1 + 2\cos\theta}$, the value at $\theta = \pi$ is $r = -6$. Which rectangular point is that?'
  choices: ['$(-6, 0)$', '$(0, -6)$', '$(6, 0)$', '$(0, 6)$']
  answer: 2
  explanation: |-
    Direction $\pi$ points left, but negative $r$ reverses it, so the point is 6 units right: $(6, 0)$. It's the second vertex; the first is $(2, 0)$.
