- id: pc-q-0101
  lesson: pc-functions
  module_quiz: true
  topic: Functions and notation
  stem: 'Which relation is NOT a function of $x$?'
  choices: ['$\{(1, 4), (2, 4), (3, 4)\}$', '$\{(0, 1), (1, 2), (2, 3)\}$', '$\{(2, 5), (3, 7), (2, -5)\}$', '$\{(-1, 1), (1, 1), (0, 0)\}$']
  answer: 2
  explanation: |-
    The input 2 is paired with both 5 and $-5$, so one input has two outputs. Repeating an output (as in $\{(1, 4), (2, 4), (3, 4)\}$, where every input gives 4) is allowed.
- id: pc-q-0102
  lesson: pc-functions
  topic: Functions and notation
  stem: 'If $f(x) = x^2 - 3x$, what is $f(-2)$?'
  choices: ['$10$', '$2$', '$-2$', '$-10$']
  answer: 0
  explanation: |-
    $f(-2) = (-2)^2 - 3(-2) = 4 + 6 = 10$. Writing $-2^2$ without parentheses gives $-4 + 6 = 2$; losing the sign of $-3(-2)$ gives $4 - 6 = -2$.
- id: pc-q-0103
  lesson: pc-functions
  module_quiz: true
  topic: Functions and notation
  stem: 'If $f(x) = x^2 + 1$, simplify $f(a + 2)$.'
  choices: ['$a^2 + 5$', '$a^2 + 3$', '$a^2 + 4a + 5$', '$a^2 + 4a + 4$']
  answer: 2
  explanation: |-
    Replace $x$ with $(a + 2)$: $(a+2)^2 + 1 = a^2 + 4a + 4 + 1 = a^2 + 4a + 5$. $a^2 + 5$ forgets the middle term $4a$; $a^2 + 3$ is $f(a) + 2$, which is a different thing.
- id: pc-q-0104
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the domain of $f(x) = \sqrt{2x - 8}$?'
  choices: ['$(4, \infty)$', '$[4, \infty)$', '$[-4, \infty)$', '$(-\infty, 4]$']
  answer: 1
  explanation: |-
    The radicand must be nonnegative: $2x - 8 \ge 0$, so $x \ge 4$. The endpoint is included because $\sqrt{0} = 0$ is defined, so the domain is $[4, \infty)$, not $(4, \infty)$.
- id: pc-q-0105
  lesson: pc-functions
  module_quiz: true
  topic: Domain and range
  stem: 'What is the domain of $g(x) = \dfrac{x + 1}{x^2 - 4x}$?'
  choices: ['All real numbers except $-1$', 'All real numbers except $4$', 'All real numbers except $-4$ and $0$', 'All real numbers except $0$ and $4$']
  answer: 3
  explanation: |-
    The denominator $x^2 - 4x = x(x - 4)$ is zero at $x = 0$ and $x = 4$; those are excluded. The zero of the numerator ($x = -1$) is allowed: $g(-1) = 0$.
- id: pc-q-0106
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the domain of $h(x) = \dfrac{\sqrt{x + 3}}{x - 1}$?'
  choices: ['$[-3, 1) \cup (1, \infty)$', '$(-3, 1) \cup (1, \infty)$', '$[-3, \infty)$', '$(-\infty, 1) \cup (1, \infty)$']
  answer: 0
  explanation: |-
    The root needs $x + 3 \ge 0$, so $x \ge -3$ (included). The denominator needs $x \ne 1$. Remove 1 from $[-3, \infty)$: $[-3, 1) \cup (1, \infty)$.
- id: pc-q-0107
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the range of $f(x) = (x + 2)^2 - 5$?'
  choices: ['$[-2, \infty)$', '$(-\infty, -5]$', '$[-5, \infty)$', 'All real numbers']
  answer: 2
  explanation: |-
    $(x + 2)^2 \ge 0$ for every $x$ and equals 0 at $x = -2$, so $f(x) \ge -5$ and $-5$ is reached. Range: $[-5, \infty)$. The value $-2$ is where the minimum occurs, not the minimum value.
- id: pc-q-0108
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the range of $f(x) = 2 - \sqrt{x}$?'
  choices: ['$[2, \infty)$', '$(-\infty, 2]$', '$[0, \infty)$', '$(-\infty, 0]$']
  answer: 1
  explanation: |-
    $\sqrt{x}$ takes every value in $[0, \infty)$. Subtracting it from 2 gives every value in $(-\infty, 2]$: the largest output is $2 - 0 = 2$ at $x = 0$.
- id: pc-q-0109
  lesson: pc-functions
  module_quiz: true
  topic: Functions and notation
  stem: 'Which equation defines $y$ as a function of $x$?'
  choices: ['$x^2 + y^2 = 9$', '$x = y^2$', '$|y| = x$', '$y = |x| - 3$']
  answer: 3
  explanation: |-
    $y = |x| - 3$ gives one $y$ for each $x$. Each of the others has inputs with two outputs: for $x = 0$ in the circle, $y = \pm 3$; for $x = 4$ in $x = y^2$, $y = \pm 2$; for $x = 1$ in $|y| = x$, $y = \pm 1$. Their graphs fail the vertical line test.
- id: pc-q-0110
  lesson: pc-functions
  topic: Domain and range
  stem: 'Which interval describes $-2 \le x < 5$?'
  choices: ['$[-2, 5)$', '$(-2, 5]$', '$[-2, 5]$', '$(-2, 5)$']
  answer: 0
  explanation: |-
    $-2$ is included (square bracket) and 5 is excluded (parenthesis): $[-2, 5)$.
- id: pc-q-0111
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the domain of $f(x) = \sqrt[3]{x - 7}$?'
  choices: ['$[7, \infty)$', '$(7, \infty)$', 'All real numbers', 'All real numbers except 7']
  answer: 2
  explanation: |-
    Odd roots are defined for every real number, including negatives: $\sqrt[3]{-8} = -2$. So there is no restriction. The radicand rule $\ge 0$ is only for even roots.
- id: pc-q-0112
  lesson: pc-functions
  topic: Domain and range
  stem: 'A rectangle has perimeter 40 cm and width $w$ cm, so its area is $A(w) = w(20 - w)$. What is the practical domain of $A$?'
  choices: ['All real numbers', '$[0, 40]$', '$(0, 40)$', '$(0, 20)$']
  answer: 3
  explanation: |-
    The width must be positive and so must the length $20 - w$, giving $0 < w < 20$. The formula works for any real $w$, but negative or zero lengths are meaningless here.
- id: pc-q-0113
  lesson: pc-functions
  topic: Domain and range
  stem: 'What is the range of $r(x) = \dfrac{3x - 1}{x + 2}$?'
  choices: ['All real numbers except $-2$', 'All real numbers except $3$', 'All real numbers except $\tfrac13$', 'All real numbers']
  answer: 1
  explanation: |-
    Solve $y = \frac{3x-1}{x+2}$ for $x$: $yx + 2y = 3x - 1$, so $x(y - 3) = -2y - 1$ and $x = \frac{-2y-1}{y-3}$. Every $y$ works except $y = 3$. ($-2$ is excluded from the domain, not the range.)

- id: pc-q-0201
  lesson: pc-piecewise
  module_quiz: true
  topic: Piecewise functions
  stem: 'Let $f(x) = \begin{cases} 2x + 1 & x < 0 \\ x^2 & 0 \le x < 3 \\ 10 & x \ge 3 \end{cases}$. What is $f(3)$?'
  choices: ['$9$', '$10$', '$7$', '$3$']
  answer: 1
  explanation: |-
    $3$ satisfies $x \ge 3$, so $f(3) = 10$. Using $x^2$ gives 9, but that piece requires $x < 3$, which is false at 3.
- id: pc-q-0202
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'Using the same $f(x) = \begin{cases} 2x + 1 & x < 0 \\ x^2 & 0 \le x < 3 \\ 10 & x \ge 3 \end{cases}$, find $f(-2) + f(0)$.'
  choices: ['$1$', '$4$', '$-3$', '$-2$']
  answer: 2
  explanation: |-
    $f(-2) = 2(-2) + 1 = -3$ (since $-2 < 0$) and $f(0) = 0^2 = 0$ (since $0 \le 0 < 3$). The sum is $-3$. Using $2x + 1$ at $x = 0$ would give 1 instead of 0.
- id: pc-q-0203
  lesson: pc-piecewise
  module_quiz: true
  topic: Piecewise functions
  stem: 'Solve $|2x - 5| = 9$.'
  choices: ['$x = 7$ only', '$x = 7$ or $x = 2$', '$x = -7$ or $x = 2$', '$x = 7$ or $x = -2$']
  answer: 3
  explanation: |-
    $2x - 5 = 9$ gives $x = 7$; $2x - 5 = -9$ gives $2x = -4$, $x = -2$. Both check: $|9| = 9$ and $|-9| = 9$.
- id: pc-q-0204
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'How many solutions does $|x + 4| = -3$ have?'
  choices: ['None', 'One', 'Two', 'Infinitely many']
  answer: 0
  explanation: |-
    An absolute value is a distance, so it is never negative. No $x$ makes $|x + 4|$ equal to $-3$.
- id: pc-q-0205
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'What is $\lfloor -3.2 \rfloor$ (the greatest integer less than or equal to $-3.2$)?'
  choices: ['$-3$', '$-4$', '$3$', '$-3.2$']
  answer: 1
  explanation: |-
    The integers at or below $-3.2$ are $-4, -5, \dots$; the greatest is $-4$. $-3$ is larger than $-3.2$, so it does not qualify. Floor always rounds toward $-\infty$.
- id: pc-q-0206
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'Which is the piecewise form of $|x - 2|$?'
  choices: ['$\begin{cases} x - 2 & x \ge 0 \\ -x - 2 & x < 0 \end{cases}$', '$\begin{cases} x - 2 & x \ge 2 \\ x + 2 & x < 2 \end{cases}$', '$\begin{cases} x - 2 & x \ge 2 \\ 2 - x & x < 2 \end{cases}$', '$\begin{cases} 2 - x & x \ge 2 \\ x - 2 & x < 2 \end{cases}$']
  answer: 2
  explanation: |-
    Split where the inside is zero, $x = 2$. For $x \ge 2$ the inside is nonnegative, so $|x - 2| = x - 2$; for $x < 2$ it is negative, so $|x - 2| = -(x - 2) = 2 - x$.
- id: pc-q-0207
  lesson: pc-piecewise
  module_quiz: true
  topic: Piecewise functions
  stem: 'A garage charges \$4 for each hour or part of an hour. What does a stay of 2.5 hours cost?'
  choices: ['\$8', '\$10', '\$14', '\$12']
  answer: 3
  explanation: |-
    "Part of an hour" counts as a full hour, so 2.5 hours is billed as 3 hours: $3 \times 4 = 12$ dollars. (\$10 prorates the half hour, which this step-function rule does not do.)
- id: pc-q-0208
  lesson: pc-piecewise
  module_quiz: true
  topic: Reading graphs
  stem: |-
    A function has the values below. Which inputs are zeros of $f$?

    $\begin{array}{c|ccccc} x & -2 & -1 & 0 & 1 & 2 \\ \hline f(x) & 3 & 0 & -2 & 0 & 5 \end{array}$
  choices: ['$x = 0$ only', '$x = -1$ and $x = 1$', '$x = -2$ and $x = 0$', '$x = -2$ only']
  answer: 1
  explanation: |-
    A zero is an input where the output is 0. $f(-1) = 0$ and $f(1) = 0$. The value $-2$ is an output (at $x = 0$), not a zero.
- id: pc-q-0209
  lesson: pc-piecewise
  topic: Reading graphs
  stem: 'The graph of a cubic $f$ crosses the $x$-axis only at $-2$, $1$ and $3$, and rises to the right (it is above the axis for large $x$). Where is $f(x) < 0$?'
  choices: ['$(-2, 1) \cup (3, \infty)$', '$(1, 3)$ only', '$(-\infty, -2) \cup (1, 3)$', '$(-\infty, -2)$ only']
  answer: 2
  explanation: |-
    Starting from the right, $f > 0$ on $(3, \infty)$. The sign switches at each crossing: negative on $(1, 3)$, positive on $(-2, 1)$, negative on $(-\infty, -2)$.
- id: pc-q-0210
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'For which $k$ do the pieces of $f(x) = \begin{cases} x + k & x < 2 \\ x^2 & x \ge 2 \end{cases}$ meet at $x = 2$ (no jump)?'
  choices: ['$k = 2$', '$k = 4$', '$k = 0$', '$k = -2$']
  answer: 0
  explanation: |-
    The right piece starts at $2^2 = 4$. The left piece approaches $2 + k$. They meet when $2 + k = 4$, so $k = 2$.
- id: pc-q-0211
  lesson: pc-piecewise
  topic: Reading graphs
  stem: 'When you graph $f(x) = \begin{cases} x^2 & x < 1 \\ 3 & x \ge 1 \end{cases}$, which dots appear at $x = 1$?'
  choices: ['Closed at $(1, 1)$, open at $(1, 3)$', 'Open at $(1, 1)$, closed at $(1, 3)$', 'Closed at both $(1, 1)$ and $(1, 3)$', 'Open at both $(1, 1)$ and $(1, 3)$']
  answer: 1
  explanation: |-
    The parabola piece uses $x < 1$, so its endpoint $(1, 1)$ is excluded (open). The constant piece uses $x \ge 1$, so $(1, 3)$ is included (closed). Closing both would give the input 1 two outputs.
- id: pc-q-0212
  lesson: pc-piecewise
  topic: Piecewise functions
  stem: 'Shipping costs $C(w) = \begin{cases} 5 & 0 < w \le 2 \\ 5 + 1.5(w - 2) & w > 2 \end{cases}$ dollars for a package of $w$ pounds. What does a 6-pound package cost?'
  choices: ['\$9.00', '\$14.00', '\$11.00', '\$6.50']
  answer: 2
  explanation: |-
    $6 > 2$, so use the second piece: $5 + 1.5(6 - 2) = 5 + 6 = 11$ dollars. \$14 comes from $5 + 1.5 \cdot 6$, forgetting that only pounds beyond 2 are charged extra.

- id: pc-q-0301
  lesson: pc-behavior
  module_quiz: true
  topic: Function behavior
  stem: 'On which interval is $f(x) = x^2 - 4x$ increasing?'
  choices: ['$(-\infty, 2)$', '$(-4, \infty)$', '$(0, 4)$', '$(2, \infty)$']
  answer: 3
  explanation: |-
    The parabola opens up with vertex at $x = -\frac{-4}{2} = 2$. It falls on $(-\infty, 2)$ and rises on $(2, \infty)$. (0 and 4 are the zeros, not the turning point.)
- id: pc-q-0302
  lesson: pc-behavior
  module_quiz: true
  topic: Function behavior
  stem: 'What is the maximum value of $f(x) = -2x^2 + 8x + 1$?'
  choices: ['$9$', '$2$', '$25$', '$1$']
  answer: 0
  explanation: |-
    The vertex is at $x = -\frac{8}{2(-2)} = 2$, and $f(2) = -8 + 16 + 1 = 9$. The answer 2 is where the maximum occurs, not its value; 25 comes from computing $+2(2)^2$ instead of $-2(2)^2$.
- id: pc-q-0303
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'What is the average rate of change of $f(x) = x^3$ on $[1, 3]$?'
  choices: ['$26$', '$13$', '$9$', '$12$']
  answer: 1
  explanation: |-
    $\dfrac{f(3) - f(1)}{3 - 1} = \dfrac{27 - 1}{2} = 13$. 26 forgets to divide by the change in $x$.
- id: pc-q-0304
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'A town had 1,200 residents in 2010 and 1,800 in 2018. What was the average rate of change of its population?'
  choices: ['600 people per year', '50% per year', '75 people per year', '150 people per year']
  answer: 2
  explanation: |-
    $\dfrac{1800 - 1200}{2018 - 2010} = \dfrac{600}{8} = 75$ people per year. 600 is the total change, not the rate.
- id: pc-q-0305
  lesson: pc-behavior
  module_quiz: true
  topic: Average rate of change
  stem: 'Simplify the difference quotient $\dfrac{f(x+h) - f(x)}{h}$ for $f(x) = x^2 + 5x$.'
  choices: ['$2x + 5$', '$2xh + h^2 + 5h$', '$2x + h$', '$2x + h + 5$']
  answer: 3
  explanation: |-
    $f(x+h) - f(x) = (x^2 + 2xh + h^2 + 5x + 5h) - (x^2 + 5x) = 2xh + h^2 + 5h$. Dividing by $h$ gives $2x + h + 5$. $2xh + h^2 + 5h$ forgot to divide by $h$; $2x + 5$ is what you get after letting $h \to 0$ (the derivative), which is a later step.
- id: pc-q-0306
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'What is the difference quotient of the linear function $f(x) = 3x - 7$?'
  choices: ['$3$', '$3x$', '$3 + h$', '$-7$']
  answer: 0
  explanation: |-
    $f(x+h) - f(x) = 3x + 3h - 7 - 3x + 7 = 3h$, and $\frac{3h}{h} = 3$. A line has the same average rate of change (its slope) on every interval.
- id: pc-q-0307
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'The average rate of change of $f$ on $[a, b]$ is 0. Which must be true?'
  choices: ['$f$ is constant on $[a, b]$', '$f(a) = 0$ and $f(b) = 0$', '$f(a) = f(b)$', '$f$ has a maximum at the midpoint']
  answer: 2
  explanation: |-
    $\frac{f(b) - f(a)}{b - a} = 0$ means $f(b) - f(a) = 0$. The function may rise and fall in between (like a thrown ball), so it need not be constant, and the values need not be 0.
- id: pc-q-0308
  lesson: pc-behavior
  topic: Function behavior
  stem: 'Which statement about $f(x) = x^3 - 3x$ on its whole domain is true? (Its local max is $f(-1) = 2$ and its local min is $f(1) = -2$.)'
  choices: ['It has an absolute maximum of 2', 'It has an absolute minimum of $-2$', 'It has local extrema but no absolute extrema', 'It has no local extrema']
  answer: 2
  explanation: |-
    A cubic with positive leading coefficient goes to $\infty$ as $x \to \infty$ and to $-\infty$ as $x \to -\infty$, so no value is the largest or smallest overall. The hilltop at $x = -1$ and valley at $x = 1$ are only local.
- id: pc-q-0309
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'What is the slope of the secant line to $y = \sqrt{x}$ between $x = 4$ and $x = 9$?'
  choices: ['$\tfrac{1}{5}$', '$5$', '$\tfrac{1}{2}$', '$1$']
  answer: 0
  explanation: |-
    $\dfrac{\sqrt9 - \sqrt4}{9 - 4} = \dfrac{3 - 2}{5} = \dfrac15$. The answer 1 forgets to divide by 5; 5 inverts the fraction.
- id: pc-q-0310
  lesson: pc-behavior
  module_quiz: true
  topic: Function behavior
  stem: 'A ball''s height in feet is $h(t) = -16t^2 + 64t + 5$ after $t$ seconds. What is its maximum height?'
  choices: ['$69$ ft', '$2$ ft', '$133$ ft', '$64$ ft']
  answer: 0
  explanation: |-
    Vertex: $t = -\frac{64}{2(-16)} = 2$ s. $h(2) = -64 + 128 + 5 = 69$ ft. 133 comes from dropping the squared term, $64(2) + 5$.
- id: pc-q-0311
  lesson: pc-behavior
  topic: Average rate of change
  stem: |-
    A student simplifies the difference quotient for $f(x) = x^2$ like this. Which step is wrong?

    Step 1: $f(x+h) = x^2 + h^2$
    Step 2: $f(x+h) - f(x) = h^2$
    Step 3: $\dfrac{h^2}{h} = h$
  choices: ['Step 2', 'Step 3', 'No step is wrong', 'Step 1']
  answer: 3
  explanation: |-
    $(x + h)^2 = x^2 + 2xh + h^2$, not $x^2 + h^2$. With the correct expansion the quotient is $\frac{2xh + h^2}{h} = 2x + h$. Steps 2 and 3 follow correctly from the wrong step 1.
- id: pc-q-0312
  lesson: pc-behavior
  topic: Average rate of change
  stem: 'Simplify the difference quotient for $f(x) = \dfrac{1}{x}$.'
  choices: ['$\dfrac{1}{x(x+h)}$', '$-\dfrac{1}{x(x+h)}$', '$-\dfrac{1}{x^2}$', '$\dfrac{-h}{x(x+h)}$']
  answer: 1
  explanation: |-
    $\frac{1}{x+h} - \frac1x = \frac{x - (x+h)}{x(x+h)} = \frac{-h}{x(x+h)}$; dividing by $h$ gives $-\frac{1}{x(x+h)}$. $\frac{-h}{x(x+h)}$ forgot to divide by $h$; $-\frac{1}{x^2}$ is the limit as $h \to 0$.
