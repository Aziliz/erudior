  explanation: |-
    The corners are $(0, 0)$, $(4, 0)$, $(2, 4)$ and $(0, 6)$ (Lesson 27, Example 1). $P$ there: $0$, $12$, $6 + 20 = 26$ and $30$. The maximum is 30, at $(0, 6)$. With this objective the best corner is not the one where both slanted constraints are tight.

- id: pc-m6-r2-q28
  lesson: pc-linear-programming
  type: order
  topic: Linear programming
  stem: 'Put the steps of the corner point method in order.'
  items:
    - Name the variables
    - Write the objective function and the constraints
    - Graph the feasible region
    - Find the corner points
    - Evaluate the objective function at each corner point
  explanation: |-
    The objective and constraints are written in terms of the variables, the region comes from the constraints, the corners come from the region (by solving pairs of boundary equations), and only then can the objective be compared at the corners.

- id: pc-m6-r2-q29
  lesson: pc-linear-programming
  module_quiz: true
  topic: Systems of inequalities
  stem: 'Which points are in the feasible region of $x \ge 0$, $y \ge 0$, $x + 3y \ge 9$, $x + y \ge 5$? Select all that apply.'
  choices: ['$(0, 5)$', '$(2, 2)$', '$(6, 0)$', '$(10, 1)$']
  answer: [0, 3]
  explanation: |-
    Test each point in both inequalities. $(0, 5)$: $0 + 15 = 15 \ge 9$ and $5 \ge 5$, feasible. $(10, 1)$: $13 \ge 9$ and $11 \ge 5$, feasible. $(2, 2)$: $2 + 6 = 8$, which fails $x + 3y \ge 9$. $(6, 0)$: $6 \ge 5$ holds, but $6 \ge 9$ fails.

- id: pc-m6-r2-q30
  lesson: pc-linear-programming
  type: match
  topic: Systems of inequalities
  stem: 'Match each inequality to how its graph is drawn.'
  pairs:
    - ['$y < 2x + 1$', Dashed line; shade below it]
    - ['$y \ge 2x + 1$', Solid line; shade above it]
    - ['$y \le 2x + 1$', Solid line; shade below it]
    - ['$y > 2x + 1$', Dashed line; shade above it]
  explanation: |-
    Strict inequalities ($<$, $>$) leave out the boundary, so the line is dashed; $\le$ and $\ge$ include it, so it is solid. With $y$ alone on the left, "$y$ greater" is above the line and "$y$ less" is below. A test point confirms it: $(0, 0)$ gives $0 < 1$, true, and the origin is below the line.

# ---------- Honors 27h1: pc-m6-h-transformations ----------
- id: pc-m6-r2-h01
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Which matrix rotates the plane $90°$ counterclockwise about the origin?'
  choices: ['$\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix}$', '$\begin{bmatrix} -1 & 0 \\ 0 & -1 \end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$']
  answer: 0
  explanation: |-
    The columns are the images of $(1, 0)$ and $(0, 1)$. A quarter turn counterclockwise sends $(1, 0)$ to $(0, 1)$ and $(0, 1)$ to $(-1, 0)$, so the matrix is $\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$ ($\theta = 90°$ in the rotation matrix). $\begin{bmatrix} 0 & 1 \\ -1 & 0 \end{bmatrix}$ turns clockwise, $-I$ turns $180°$, and $\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$ reflects across $y = x$.

- id: pc-m6-r2-h02
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'A linear transformation sends $(1, 0)$ to $(2, 5)$ and $(0, 1)$ to $(-1, 3)$. What is its matrix?'
  choices: ['$\begin{bmatrix} 2 & 5 \\ -1 & 3 \end{bmatrix}$', '$\begin{bmatrix} 2 & -1 \\ 5 & 3 \end{bmatrix}$', '$\begin{bmatrix} 5 & 2 \\ 3 & -1 \end{bmatrix}$', '$\begin{bmatrix} -1 & 2 \\ 3 & 5 \end{bmatrix}$']
  answer: 1
  explanation: |-
    The image of $(1, 0)$ is the first column and the image of $(0, 1)$ is the second column: $\begin{bmatrix} 2 & -1 \\ 5 & 3 \end{bmatrix}$. Writing the images as rows gives $\begin{bmatrix} 2 & 5 \\ -1 & 3 \end{bmatrix}$, which sends $(1, 0)$ to $(2, -1)$ instead.

- id: pc-m6-r2-h03
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Where does $\begin{bmatrix} 1 & 2 \\ -1 & 3 \end{bmatrix}$ send the point $(4, -1)$?'
  choices: ['$(5, 5)$', '$(6, -1)$', '$(2, -7)$', '$(-2, 7)$']
  answer: 2
  explanation: |-
    $\begin{bmatrix} 1 & 2 \\ -1 & 3 \end{bmatrix}\begin{bmatrix} 4 \\ -1 \end{bmatrix} = \begin{bmatrix} 4 - 2 \\ -4 - 3 \end{bmatrix} = \begin{bmatrix} 2 \\ -7 \end{bmatrix}$. Multiplying by columns instead of rows gives $(5, 5)$; dropping the sign of $-1$ gives $(6, -1)$.

- id: pc-m6-r2-h04
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Rotate the point $(2, 0)$ by $30°$ counterclockwise about the origin. Where does it land?'
  choices: ['$(1, \sqrt3)$', '$(\sqrt3, -1)$', '$(-1, \sqrt3)$', '$(\sqrt3, 1)$']
  answer: 3
  explanation: |-
    $R(30°)\begin{bmatrix} 2 \\ 0 \end{bmatrix} = \begin{bmatrix} 2\cos 30° \\ 2\sin 30° \end{bmatrix} = \begin{bmatrix} \sqrt3 \\ 1 \end{bmatrix}$. $(\sqrt3, -1)$ is a clockwise turn, $(1, \sqrt3)$ is a $60°$ turn, and $(-1, \sqrt3)$ is a $120°$ turn.

- id: pc-m6-r2-h05
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: '$F$ reflects across the $x$-axis and $R$ rotates $90°$ counterclockwise. Which single transformation is "first $R$, then $F$", that is, $FR$?'
  choices: ['Reflection across the line $y = -x$', 'Reflection across the line $y = x$', 'Rotation by $90°$ clockwise', 'Rotation by $180°$']
  answer: 0
  explanation: |-
    $FR = \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix} = \begin{bmatrix} 0 & -1 \\ -1 & 0 \end{bmatrix}$, which sends $(x, y)$ to $(-y, -x)$: reflection across $y = -x$. The other order, $RF$, is reflection across $y = x$. It can't be a rotation, since its determinant is $-1$.

- id: pc-m6-r2-h06
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'The matrix $\begin{bmatrix} 2 & 5 \\ 1 & 4 \end{bmatrix}$ is applied to a triangle of area 6. What is the area of the image?'
  choices: ['78', '18', '3', '2']
  answer: 1
  explanation: |-
    Areas are multiplied by $|\det A| = |2(4) - 5(1)| = 3$, so the image has area $6 \times 3 = 18$. Using $ad + bc = 13$ gives 78; 3 is the scale factor itself, not the new area.

- id: pc-m6-r2-h07
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Which matrix reverses orientation, turning a triangle labeled counterclockwise into one labeled clockwise?'
  choices: ['$\begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$', '$\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$', '$\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$', '$\begin{bmatrix} 1 & 3 \\ 0 & 1 \end{bmatrix}$']
  answer: 2
  explanation: |-
    Orientation is reversed exactly when the determinant is negative. $\begin{bmatrix} 1 & 2 \\ 3 & 4 \end{bmatrix}$ has determinant $4 - 6 = -2$. The others have determinants $3$, $1$ (a rotation) and $1$ (a shear).

- id: pc-m6-r2-h08
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Geometrically, why does $\begin{bmatrix} 2 & 6 \\ 1 & 3 \end{bmatrix}$ have no inverse?'
  choices: ['It rotates the plane, and a rotation cannot be undone', 'It doubles every area, and areas cannot be halved', 'It moves the origin to another point', 'It squashes the plane onto a line, so different points land on the same image']
  answer: 3
  explanation: |-
    The determinant is $6 - 6 = 0$, so every area becomes 0: both columns, $(2, 1)$ and $(6, 3)$, lie on the line $y = \tfrac12 x$, and every image lands on that line. Many points share an image, so no transformation can send each image back to a single original point. Rotations can always be undone, and linear transformations never move the origin.

- id: pc-m6-r2-h09
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'What is the inverse of the shear $\begin{bmatrix} 1 & 3 \\ 0 & 1 \end{bmatrix}$?'
  choices: ['$\begin{bmatrix} 1 & -3 \\ 0 & 1 \end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ 3 & 1 \end{bmatrix}$', '$\begin{bmatrix} 1 & \frac13 \\ 0 & 1 \end{bmatrix}$', '$\begin{bmatrix} -1 & 3 \\ 0 & -1 \end{bmatrix}$']
  answer: 0
  explanation: |-
    The shear slides each point right by 3 times its height; sliding left by 3 times its height undoes it. The $2 \times 2$ formula agrees: the determinant is 1, so swap the diagonal (both 1) and negate the 3. Check: $\begin{bmatrix} 1 & 3 \\ 0 & 1 \end{bmatrix}\begin{bmatrix} 1 & -3 \\ 0 & 1 \end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1 \end{bmatrix}$.

- id: pc-m6-r2-h10
  lesson: pc-m6-h-transformations
  type: text
  topic: Linear transformations
  stem: 'The matrix $\begin{bmatrix} 3 & 1 \\ 1 & 2 \end{bmatrix}$ sends the unit square to a parallelogram. The area of that parallelogram is ___.'
  accept: ['5', five]
  explanation: |-
    The unit square has area 1, and areas are multiplied by $|\det A| = |3(2) - 1(1)| = 5$. The parallelogram has vertices $(0, 0)$, $(3, 1)$, $(4, 3)$ and $(1, 2)$.

- id: pc-m6-r2-h11
  lesson: pc-m6-h-transformations
  type: match
  topic: Linear transformations
  stem: 'Match each matrix to the transformation it performs.'
  pairs:
    - ['$\begin{bmatrix} -1 & 0 \\ 0 & 1 \end{bmatrix}$', Reflection across the y-axis]
    - ['$\begin{bmatrix} 3 & 0 \\ 0 & 3 \end{bmatrix}$', Enlargement by a factor of 3]
    - ['$\begin{bmatrix} 1 & 0 \\ 2 & 1 \end{bmatrix}$', Vertical shear]
    - ['$\begin{bmatrix} 0 & 0 \\ 0 & 1 \end{bmatrix}$', Projection onto the y-axis]
  distractors: [Reflection across the x-axis]
  explanation: |-
    Read each matrix by its columns, the images of $(1, 0)$ and $(0, 1)$. $\begin{bmatrix} -1 & 0 \\ 0 & 1 \end{bmatrix}$ sends $(x, y)$ to $(-x, y)$: reflection across the $y$-axis. $3I$ multiplies every vector by 3. $\begin{bmatrix} 1 & 0 \\ 2 & 1 \end{bmatrix}$ sends $(x, y)$ to $(x, y + 2x)$: points slide vertically by an amount proportional to $x$, a vertical shear. $\begin{bmatrix} 0 & 0 \\ 0 & 1 \end{bmatrix}$ sends $(x, y)$ to $(0, y)$: projection onto the $y$-axis.

- id: pc-m6-r2-h12
  lesson: pc-m6-h-transformations
  type: label
  topic: Linear transformations
  stem: 'Each numbered panel shows the letter F (dashed outline) and its image (shaded) under a $2 \times 2$ matrix. Name each transformation.'
  image: {src: images/pc-m6-transform-gallery-blank.svg, alt: 'Four coordinate grids, each with a dashed letter F standing on the positive x-axis next to the y-axis and a shaded image. Panel 1: the shaded F is twice as wide. Panel 2: the shaded F hangs upside down below the x-axis. Panel 3: the shaded F lies on its back to the left of the y-axis. Panel 4: the shaded F leans to the right like italic type.'}
  labels:
    - {x: 11.5, y: 39.2, text: 'Horizontal stretch, factor 2'}
    - {x: 59.0, y: 39.2, text: Reflection across the x-axis}
    - {x: 11.5, y: 89.2, text: Rotation by 90° counterclockwise}
    - {x: 59.0, y: 89.2, text: 'Horizontal shear, factor 0.5'}
  distractors: [Rotation by 90° clockwise, Reflection across the y-axis]
  explanation: |-
    Panel 1 keeps heights and doubles widths: $\begin{bmatrix} 2 & 0 \\ 0 & 1 \end{bmatrix}$. Panel 2 flips the F below the $x$-axis: $\begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}$. In panel 3 the top of the F, which pointed up, now points left: a quarter turn counterclockwise, $\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$ (a clockwise turn would have put it to the right of the $y$-axis, below the $x$-axis). In panel 4 each point slides right by half its height while the base stays put: $\begin{bmatrix} 1 & 0.5 \\ 0 & 1 \end{bmatrix}$.

- id: pc-m6-r2-h13
  lesson: pc-m6-h-transformations
  topic: Linear transformations
  stem: 'Which statements are true of every linear transformation $T(\mathbf{x}) = A\mathbf{x}$ of the plane, including those with $\det A = 0$? Select all that apply.'
  choices: ['It sends the origin to the origin', 'It sends the midpoint of a segment to the midpoint of the segment''s image', 'It keeps the length of every segment the same', 'It sends every line to a line']
  answer: [0, 1]
  explanation: |-
    $A\mathbf{0} = \mathbf{0}$ always. The midpoint of $\mathbf{u}$ and $\mathbf{v}$ is $\tfrac12(\mathbf{u} + \mathbf{v})$, and $A\left(\tfrac12(\mathbf{u} + \mathbf{v})\right) = \tfrac12(A\mathbf{u} + A\mathbf{v})$, the midpoint of the images. Lengths are kept only by special matrices such as rotations and reflections; a stretch changes them. And when $\det A = 0$ some lines collapse to a single point: the projection onto the $x$-axis sends the whole $y$-axis to the origin.

- id: pc-m6-r2-h14
  lesson: pc-m6-h-transformations
  type: order
  topic: Linear transformations
  stem: 'A point is reflected across the $x$-axis (matrix $F$), then rotated $90°$ counterclockwise (matrix $R$), then stretched horizontally by 2 (matrix $S$). Put the matrices in the order they appear, from left to right, in the single product that does all three.'
  items:
    - '$S = \begin{bmatrix} 2 & 0 \\ 0 & 1 \end{bmatrix}$'
    - '$R = \begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$'
    - '$F = \begin{bmatrix} 1 & 0 \\ 0 & -1 \end{bmatrix}$'
  explanation: |-
    The point is $\mathbf{x}$, and the first transformation must touch it first: $S(R(F\mathbf{x})) = (SRF)\mathbf{x}$. The matrix applied first is on the right, next to $\mathbf{x}$, and the last one is on the left. The product is $SRF = \begin{bmatrix} 0 & 2 \\ 1 & 0 \end{bmatrix}$.

# ---------- Honors 27h2: pc-m6-h-markov ----------
- id: pc-m6-r2-h15
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'Using this lesson''s convention (columns are "from" states), which matrix could be a transition matrix?'
  choices: ['$\begin{bmatrix} 0.7 & 0.3 \\ 0.5 & 0.5 \end{bmatrix}$', '$\begin{bmatrix} 0.7 & 0.5 \\ 0.3 & 0.5 \end{bmatrix}$', '$\begin{bmatrix} 0.6 & 0.6 \\ 0.4 & 0.6 \end{bmatrix}$', '$\begin{bmatrix} 1.2 & 0.5 \\ -0.2 & 0.5 \end{bmatrix}$']
  answer: 1
  explanation: |-
    Every entry must be between 0 and 1 and each column must add to 1. $\begin{bmatrix} 0.7 & 0.5 \\ 0.3 & 0.5 \end{bmatrix}$ qualifies. $\begin{bmatrix} 0.7 & 0.3 \\ 0.5 & 0.5 \end{bmatrix}$ has rows adding to 1 (the other convention), but its columns add to 1.2 and 0.8. $\begin{bmatrix} 0.6 & 0.6 \\ 0.4 & 0.6 \end{bmatrix}$ has a column adding to 1.2. The last one has columns adding to 1 but entries outside $[0, 1]$, which can't be probabilities.

- id: pc-m6-r2-h16
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'For the transition matrix $P = \begin{bmatrix} 0.9 & 0.3 \\ 0.1 & 0.7 \end{bmatrix}$ (states 1 and 2, columns are "from"), what is the probability of moving from state 2 to state 1 in one step?'
  choices: ['0.1', '0.7', '0.3', '0.9']
  answer: 2
  explanation: |-
    Entry $(i, j)$ is the probability of going from state $j$ to state $i$. From state 2 to state 1 is row 1, column 2: 0.3. The 0.1 in row 2, column 1 is the move from state 1 to state 2; 0.7 is staying in state 2.

- id: pc-m6-r2-h17
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'With $P = \begin{bmatrix} 0.9 & 0.3 \\ 0.1 & 0.7 \end{bmatrix}$, the process starts in state 1. What is the probability that it is in state 1 after two steps?'
  choices: ['0.81', '0.90', '0.75', '0.84']
  answer: 3
  explanation: |-
    $\mathbf{x}_1 = P\begin{bmatrix} 1 \\ 0 \end{bmatrix} = \begin{bmatrix} 0.9 \\ 0.1 \end{bmatrix}$, and the first entry of $\mathbf{x}_2 = P\mathbf{x}_1$ is $0.9(0.9) + 0.3(0.1) = 0.81 + 0.03 = 0.84$. The value 0.81 counts only the route that stays in state 1 both times and misses the route 1 → 2 → 1. 0.75 is the long-run (steady-state) value, not the two-step one.

- id: pc-m6-r2-h18
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'What is the steady-state vector of $P = \begin{bmatrix} 0.9 & 0.3 \\ 0.1 & 0.7 \end{bmatrix}$?'
  choices: ['$(0.75, 0.25)$', '$(0.25, 0.75)$', '$(0.5, 0.5)$', '$(0.9, 0.1)$']
  answer: 0
  explanation: |-
    Solve $(P - I)\mathbf{q} = \mathbf{0}$: the first row gives $-0.1q_1 + 0.3q_2 = 0$, so $q_1 = 3q_2$. With $q_1 + q_2 = 1$: $4q_2 = 1$, so $\mathbf{q} = (0.75, 0.25)$. Check: $0.9(0.75) + 0.3(0.25) = 0.675 + 0.075 = 0.75$. $(0.9, 0.1)$ is just the first column, the state after one step from state 1.

- id: pc-m6-r2-h19
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'Which transition matrix is NOT regular?'
  choices: ['$\begin{bmatrix} 0.5 & 1 \\ 0.5 & 0 \end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$', '$\begin{bmatrix} 0.9 & 0.2 \\ 0.1 & 0.8 \end{bmatrix}$', '$\begin{bmatrix} 0.3 & 0.6 \\ 0.7 & 0.4 \end{bmatrix}$']
  answer: 1
  explanation: |-
    A matrix is regular if some power has all positive entries. The powers of $\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$ alternate between itself and $I$, which always contain zeros: the chain just switches back and forth. $\begin{bmatrix} 0.5 & 1 \\ 0.5 & 0 \end{bmatrix}$ has a zero, but its square $\begin{bmatrix} 0.75 & 0.5 \\ 0.25 & 0.5 \end{bmatrix}$ is all positive, so it is regular. The other two are already all positive.

- id: pc-m6-r2-h20
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'What does the steady-state vector of a regular Markov chain tell you?'
  choices: ['The state probabilities after exactly one step', 'The starting probabilities that make the chain regular', 'The long-run probability of each state, whatever the starting state', 'The single state the chain stays in after a while']
  answer: 2
  explanation: |-
    For a regular chain, $P^n\mathbf{x}_0$ approaches the steady state $\mathbf{q}$ from any start, so $\mathbf{q}$ gives the long-run probabilities (and the long-run fraction of time in each state). The chain keeps moving between states forever; it is the probabilities that settle down, not the state itself.

- id: pc-m6-r2-h21
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'Why does each column of a transition matrix (columns are "from" states) add to 1?'
  choices: ['Because the process must arrive at each state from somewhere', 'Because the steady-state vector adds to 1', 'Because no probability can be larger than 1', 'Because from any state, the process must go to some state (possibly the same one)']
  answer: 3
  explanation: |-
    Column $j$ lists the probabilities of all possible next states starting from state $j$. Exactly one of those outcomes happens, so the probabilities add to 1. Nothing forces the probabilities of arriving at a state (a row) to add to 1, and "no probability exceeds 1" is true but doesn't make a column add to exactly 1.

- id: pc-m6-r2-h22
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'In the bike-share example, $P = \begin{bmatrix} 0.6 & 0.1 & 0.1 \\ 0.2 & 0.7 & 0.1 \\ 0.2 & 0.2 & 0.8 \end{bmatrix}$ (columns from A, B, C). Today there are 300 bikes at A, 300 at B and 400 at C. How many do we expect at A tomorrow?'
  choices: ['250', '320', '300', '200']
  answer: 0
  explanation: |-
    Station A's count tomorrow is row 1 of $P$ times today's counts: $0.6(300) + 0.1(300) + 0.1(400) = 180 + 30 + 40 = 250$. Using column 1 instead of row 1 gives $0.6(300) + 0.2(300) + 0.2(400) = 320$. 200 is the long-run count, not tomorrow's.

- id: pc-m6-r2-h23
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'In a three-state chain (columns are "from" states), state 3 is absorbing. What must be true of the transition matrix?'
  choices: ['Row 3 is $(0, 0, 1)$', 'Column 3 is $(0, 0, 1)$', 'Column 3 is $(\tfrac13, \tfrac13, \tfrac13)$', 'Every diagonal entry is 1']
  answer: 1
  explanation: |-
    Absorbing means that once in state 3 the process stays there: from state 3 the probability of going to state 3 is 1 and to the others is 0. That is column 3 ("from state 3"). Row 3 being $(0, 0, 1)$ would mean nothing ever enters state 3 from the other states. If every diagonal entry were 1, every state would be absorbing.

- id: pc-m6-r2-h24
  lesson: pc-m6-h-markov
  type: text
  topic: Markov chains
  stem: 'For the weather chain $P = \begin{bmatrix} 0.8 & 0.4 \\ 0.2 & 0.6 \end{bmatrix}$ (sunny, rainy), today is rainy. The probability of sun tomorrow is ___, and two days from now it is ___. Give decimals.'
  accept:
    - ['0.4', '.4', 40%, 2/5]
    - ['0.56', '.56', 56%, 14/25]
  explanation: |-
    $\mathbf{x}_0 = (0, 1)$, so $\mathbf{x}_1 = P\mathbf{x}_0 = (0.4, 0.6)$, the second column. Then the first entry of $\mathbf{x}_2 = P\mathbf{x}_1$ is $0.8(0.4) + 0.4(0.6) = 0.32 + 0.24 = 0.56$.

- id: pc-m6-r2-h25
  lesson: pc-m6-h-markov
  type: text
  topic: Markov chains
  stem: 'The chain $P = \begin{bmatrix} 0.7 & 0.2 \\ 0.3 & 0.8 \end{bmatrix}$ has steady-state vector $(q_1, q_2)$. Then $q_1 =$ ___.'
  accept: ['0.4', '.4', 2/5, 40%]
  explanation: |-
    $(P - I)\mathbf{q} = \mathbf{0}$ gives $-0.3q_1 + 0.2q_2 = 0$, so $q_2 = 1.5q_1$. Then $q_1 + 1.5q_1 = 1$, so $q_1 = 0.4$ and $q_2 = 0.6$. Check: $0.7(0.4) + 0.2(0.6) = 0.28 + 0.12 = 0.4$.

- id: pc-m6-r2-h26
  lesson: pc-m6-h-markov
  type: match
  topic: Markov chains
  stem: '$P$ is a transition matrix (columns are "from" states) and $\mathbf{x}_0$ is the starting state vector. Match each item to its meaning.'
  pairs:
    - ['$P\mathbf{x}_0$', State probabilities after one step]
    - ['$P^3\mathbf{x}_0$', State probabilities after three steps]
    - ['Entry $(2, 1)$ of $P^2$', Probability of going from state 1 to state 2 in two steps]
    - ['$\mathbf{q}$ with $P\mathbf{q} = \mathbf{q}$ and entries adding to 1', Steady-state vector]
  distractors: [Probability of going from state 2 to state 1 in two steps]
  explanation: |-
    Each multiplication by $P$ moves one step forward, so $P\mathbf{x}_0$ is one step and $P^3\mathbf{x}_0$ three steps. Entries of $P^2$ are two-step probabilities, and entry $(i, j)$ means from state $j$ to state $i$, so $(2, 1)$ is from 1 to 2. A probability vector unchanged by $P$ is the steady state.

- id: pc-m6-r2-h27
  lesson: pc-m6-h-markov
  type: order
  topic: Markov chains
  stem: 'Put the steps for finding the steady state of a regular transition matrix $P$ in order.'
  items:
    - Form the matrix $P - I$
    - Solve $(P - I)\mathbf{q} = \mathbf{0}$ in terms of a free variable
    - Use the condition that the entries of $\mathbf{q}$ add to 1 to find the free variable
    - Check that $P\mathbf{q} = \mathbf{q}$
  explanation: |-
    $P\mathbf{q} = \mathbf{q}$ is the system $(P - I)\mathbf{q} = \mathbf{0}$. Its equations are dependent, so the solution has a free variable; the "add to 1" condition fixes it. Multiplying $P\mathbf{q}$ at the end checks the arithmetic.

- id: pc-m6-r2-h28
  lesson: pc-m6-h-markov
  topic: Markov chains
  stem: 'Which statements are true for every regular transition matrix $P$? Select all that apply.'
  choices: ['$P$ has exactly one steady-state vector', 'Some power of $P$ has all entries positive', '$P^n\mathbf{x}_0$ approaches the steady state for every starting state vector $\mathbf{x}_0$', 'Every entry of $P$ itself is positive']
  answer: [0, 1, 2]
  explanation: |-
    "Some power of $P$ is all positive" is the definition of regular, and the main theorem gives a unique steady state approached from every start. $P$ itself can contain zeros: $\begin{bmatrix} 0.5 & 1 \\ 0.5 & 0 \end{bmatrix}$ is regular because its square is all positive.

# ---------- Honors 27h3: pc-m6-h-eigen ----------
- id: pc-m6-r2-h29
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'Which vector is an eigenvector of $\begin{bmatrix} 5 & -2 \\ 1 & 2 \end{bmatrix}$?'
  choices: ['$(1, 2)$', '$(1, 0)$', '$(2, 1)$', '$(0, 1)$']
  answer: 2
  explanation: |-
    $\begin{bmatrix} 5 & -2 \\ 1 & 2 \end{bmatrix}\begin{bmatrix} 2 \\ 1 \end{bmatrix} = \begin{bmatrix} 8 \\ 4 \end{bmatrix} = 4\begin{bmatrix} 2 \\ 1 \end{bmatrix}$, so $(2, 1)$ is an eigenvector with eigenvalue 4. The others are turned: $(1, 2) \to (1, 5)$, $(1, 0) \to (5, 1)$ and $(0, 1) \to (-2, 2)$, none a multiple of the original.

- id: pc-m6-r2-h30
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'What is the characteristic equation of $\begin{bmatrix} 3 & 2 \\ 1 & 4 \end{bmatrix}$?'
  choices: ['$\lambda^2 + 7\lambda + 10 = 0$', '$\lambda^2 - 7\lambda + 14 = 0$', '$\lambda^2 - 10\lambda + 7 = 0$', '$\lambda^2 - 7\lambda + 10 = 0$']
  answer: 3
  explanation: |-
    $\det\begin{bmatrix} 3 - \lambda & 2 \\ 1 & 4 - \lambda \end{bmatrix} = (3 - \lambda)(4 - \lambda) - 2 = \lambda^2 - 7\lambda + 10$: the trace is 7 and the determinant is $12 - 2 = 10$. Using $ad + bc = 14$ instead of $ad - bc$ gives the 14; the $+7\lambda$ has the sign of the trace term wrong.

- id: pc-m6-r2-h31
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'What are the eigenvalues of $\begin{bmatrix} 1 & 2 \\ 3 & 2 \end{bmatrix}$?'
  choices: ['$4$ and $-1$', '$1$ and $2$', '$-4$ and $1$', '$3$ and $2$']
  answer: 0
  explanation: |-
    The trace is 3 and the determinant is $2 - 6 = -4$, so $\lambda^2 - 3\lambda - 4 = (\lambda - 4)(\lambda + 1) = 0$, giving $\lambda = 4$ and $\lambda = -1$. Check: they add to 3 and multiply to $-4$. The diagonal entries 1 and 2 are the eigenvalues only for a triangular matrix.

- id: pc-m6-r2-h32
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'A $2 \times 2$ matrix has trace 6 and determinant 8. What are its eigenvalues?'
  choices: ['$1$ and $8$', '$2$ and $4$', '$3$ and $3$', '$-2$ and $-4$']
  answer: 1
  explanation: |-
    The eigenvalues solve $\lambda^2 - 6\lambda + 8 = (\lambda - 2)(\lambda - 4) = 0$: they must add to 6 and multiply to 8, and 2 and 4 do. 1 and 8 multiply to 8 but add to 9; 3 and 3 add to 6 but multiply to 9; $-2$ and $-4$ add to $-6$.

- id: pc-m6-r2-h33
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'A matrix rotates the plane by $60°$ about the origin. How many real eigenvalues does it have?'
  choices: ['One', 'Two', 'None', 'Infinitely many']
  answer: 2
  explanation: |-
    A $60°$ rotation turns every nonzero vector off its line, so no real eigenvector exists. Algebraically, the trace is $2\cos 60° = 1$ and the determinant is 1, so $\lambda^2 - \lambda + 1 = 0$, whose discriminant $1 - 4 = -3$ is negative: the eigenvalues are complex.

- id: pc-m6-r2-h34
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: '0 is an eigenvalue of the square matrix $A$. What follows?'
  choices: ['$A$ is the zero matrix', '$A$ is the identity matrix', 'Every vector is an eigenvector of $A$', '$A$ is singular (has no inverse)']
  answer: 3
  explanation: |-
    $\lambda = 0$ means $A\mathbf{v} = \mathbf{0}$ for some nonzero $\mathbf{v}$, so $\det(A - 0I) = \det A = 0$ and $A$ is singular. $A$ need not be zero: $\begin{bmatrix} 1 & 0 \\ 0 & 0 \end{bmatrix}$ has eigenvalues 1 and 0, and $(1, 1)$ is not one of its eigenvectors.

- id: pc-m6-r2-h35
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: '$\mathbf{v}$ is an eigenvector of $A$ with eigenvalue 3. What is $A^4\mathbf{v}$?'
  choices: ['$81\mathbf{v}$', '$12\mathbf{v}$', '$3\mathbf{v}$', '$64\mathbf{v}$']
  answer: 0
  explanation: |-
    Each multiplication by $A$ multiplies $\mathbf{v}$ by 3, so four of them multiply by $3^4 = 81$. Multiplying 3 by 4 gives the 12, and $4^3 = 64$ swaps base and exponent.

- id: pc-m6-r2-h36
  lesson: pc-m6-h-eigen
  type: order
  topic: Eigenvalues and eigenvectors
  stem: 'Put the steps for finding an eigenvector of a $2 \times 2$ matrix $A$ in order.'
  items:
    - 'Write the characteristic equation $\det(A - \lambda I) = 0$'
    - Solve it for the eigenvalues
    - 'For one eigenvalue $\lambda$, form the matrix $A - \lambda I$'
    - 'Solve $(A - \lambda I)\mathbf{v} = \mathbf{0}$ using a free variable'
    - 'Check that $A\mathbf{v} = \lambda\mathbf{v}$'
  explanation: |-
    The eigenvalues come from the characteristic equation, and each eigenvalue is needed to build $A - \lambda I$. That system is dependent, so a free variable gives the eigenvector, and multiplying by $A$ checks it.

- id: pc-m6-r2-h37
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'Why does every transition matrix $P$ (columns adding to 1) have 1 as an eigenvalue?'
  choices: ['Every entry of $P$ is at most 1', 'The columns of $P - I$ add to zero, so $P - I$ is singular', 'The trace of $P$ is always 1', 'The determinant of $P$ is always 1']
  answer: 1
  explanation: |-
    Each column of $P - I$ is a column of $P$ with 1 subtracted from one entry, so it adds to $1 - 1 = 0$. Then adding all the rows of $P - I$ gives a row of zeros, the rows are dependent, and $\det(P - I) = 0$, which is exactly the statement that 1 is an eigenvalue. The trace and determinant are not always 1: the weather matrix has trace 1.4 and determinant 0.4.

- id: pc-m6-r2-h38
  lesson: pc-m6-h-eigen
  type: text
  topic: Eigenvalues and eigenvectors
  stem: 'The eigenvalues of $\begin{bmatrix} 6 & -2 \\ 2 & 1 \end{bmatrix}$ are ___ (the smaller) and ___ (the larger).'
  accept:
    - ['2']
    - ['5']
  explanation: |-
    The trace is 7 and the determinant is $6 - (-4) = 10$, so $\lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5) = 0$. The eigenvalues are 2 and 5.

- id: pc-m6-r2-h39
  lesson: pc-m6-h-eigen
  type: text
  topic: Eigenvalues and eigenvectors
  stem: '$A = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$ has eigenvalue 2. Its eigenvectors of the form $(1, y)$ have $y =$ ___.'
  accept: ['-2', '−2']
  explanation: |-
    $A - 2I = \begin{bmatrix} 2 & 1 \\ 2 & 1 \end{bmatrix}$, so $2x + y = 0$. With $x = 1$, $y = -2$. Check: $A\begin{bmatrix} 1 \\ -2 \end{bmatrix} = \begin{bmatrix} 2 \\ -4 \end{bmatrix} = 2\begin{bmatrix} 1 \\ -2 \end{bmatrix}$.

- id: pc-m6-r2-h40
  lesson: pc-m6-h-eigen
  type: match
  topic: Eigenvalues and eigenvectors
  stem: 'Match each matrix to its eigenvalues.'
  pairs:
    - ['$\begin{bmatrix} 0 & 1 \\ 1 & 0 \end{bmatrix}$', 1 and −1]
    - ['$\begin{bmatrix} 0 & -1 \\ 1 & 0 \end{bmatrix}$', No real eigenvalues]
    - ['$\begin{bmatrix} 1 & 1 \\ 0 & 1 \end{bmatrix}$', 1 only (repeated)]
    - ['$\begin{bmatrix} 3 & 0 \\ 0 & 5 \end{bmatrix}$', 3 and 5]
  distractors: [0 and 1]
  explanation: |-
    The reflection across $y = x$ keeps $(1, 1)$ fixed ($\lambda = 1$) and flips $(1, -1)$ ($\lambda = -1$). The $90°$ rotation has $\lambda^2 + 1 = 0$, so no real eigenvalues. The shear has $(\lambda - 1)^2 = 0$. A diagonal (or triangular) matrix has its diagonal entries as eigenvalues.

- id: pc-m6-r2-h41
  lesson: pc-m6-h-eigen
  type: label
  topic: Eigenvalues and eigenvectors
  stem: 'Thin arrows show the vectors $(1, 1)$, $(1, -2)$ and $(0, 1)$; thick arrows show their images under $A = \begin{bmatrix} 4 & 1 \\ 2 & 3 \end{bmatrix}$; dashed lines pass through the origin. Name the numbered parts.'
  image: {src: images/pc-m6-eigen-directions-blank.svg, alt: 'Three thin arrows from the origin, each with a longer thick arrow. Two thick arrows lie along dashed lines through their thin arrows; the third thick arrow points in a different direction from its thin arrow.'}
  labels:
    - {x: 66.6, y: 21.6, text: Image of an eigenvector with eigenvalue 5}
    - {x: 40.1, y: 80.0, text: Image of an eigenvector with eigenvalue 2}
    - {x: 29.0, y: 39.4, text: Image of a vector that is not an eigenvector}
    - {x: 13.5, y: 60.6, text: Line of eigenvectors for eigenvalue 5}
  distractors: [Line of eigenvectors for eigenvalue 2]
  explanation: |-
    $A(1, 1) = (5, 5)$: same line, five times as long (marker 1, eigenvalue 5). $A(1, -2) = (2, -4)$: same line, twice as long (marker 2, eigenvalue 2). $A(0, 1) = (1, 3)$ points in a new direction, so $(0, 1)$ is not an eigenvector (marker 3). Marker 4 is on the dashed line $y = x$, every nonzero point of which is an eigenvector for eigenvalue 5; the other dashed line, $y = -2x$, holds the eigenvectors for eigenvalue 2.

- id: pc-m6-r2-h42
  lesson: pc-m6-h-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'Which statements about the two eigenvalues of every $2 \times 2$ matrix $A$ are true? Select all that apply.'
  choices: ['They add to the trace of $A$', 'They multiply to $\det A$', 'They are the diagonal entries of $A$', 'They are real numbers']
  answer: [0, 1]
  explanation: |-
    They are the roots of $\lambda^2 - (\text{trace})\lambda + \det A = 0$, so their sum is the trace and their product is the determinant (counting a repeated eigenvalue twice). They equal the diagonal entries only for triangular matrices, and they can be complex: a $90°$ rotation has eigenvalues $\pm i$.
