  image: {src: images/pc-m6-lp-parts-blank.svg, alt: 'A shaded quadrilateral with corners at (0, 0), (4, 0), (2, 4) and (0, 6), bounded by two solid lines; a dashed line crossing the shaded region; and an open dot at (5, 3) outside it.'}
