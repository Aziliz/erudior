- id: pc-q-1801
  lesson: pc-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Convert $150^\circ$ to radians.'
  choices: ['$\dfrac{5\pi}{6}$', '$\dfrac{3\pi}{4}$', '$\dfrac{6\pi}{5}$', '$\dfrac{5\pi}{3}$']
  answer: 0
  explanation: |-
    $150 \cdot \frac{\pi}{180} = \frac{150\pi}{180} = \frac{5\pi}{6}$.
- id: pc-q-1802
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Convert $\dfrac{3\pi}{4}$ radians to degrees.'
  choices: ['$75^\circ$', '$270^\circ$', '$135^\circ$', '$120^\circ$']
  answer: 2
  explanation: |-
    $\frac{3\pi}{4} \cdot \frac{180^\circ}{\pi} = \frac{3 \cdot 180^\circ}{4} = 135^\circ$.
- id: pc-q-1803
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'A central angle of $\dfrac{\pi}{3}$ radians cuts an arc on a circle of radius 6. How long is the arc?'
  choices: ['$\dfrac{\pi}{18}$', '$2\pi$', '$360$', '$18\pi$']
  answer: 1
  explanation: |-
    $s = r\theta = 6 \cdot \frac{\pi}{3} = 2\pi \approx 6.28$. Using degrees ($6 \cdot 60 = 360$) is the classic error: the formula needs radians.
- id: pc-q-1804
  lesson: pc-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Find $\sin\dfrac{7\pi}{6}$.'
  choices: ['$\dfrac12$', '$-\dfrac{\sqrt3}{2}$', '$\dfrac{\sqrt3}{2}$', '$-\dfrac12$']
  answer: 3
  explanation: |-
    $\frac{7\pi}{6}$ is in Quadrant III with reference angle $\frac{\pi}{6}$. $\sin\frac{\pi}{6} = \frac12$ and sine is negative in QIII, so $-\frac12$.
- id: pc-q-1805
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Find $\cos\dfrac{3\pi}{4}$.'
  choices: ['$-\dfrac{\sqrt2}{2}$', '$\dfrac{\sqrt2}{2}$', '$-\dfrac12$', '$-1$']
  answer: 0
  explanation: |-
    $\frac{3\pi}{4}$ is in Quadrant II with reference angle $\frac{\pi}{4}$. Cosine is negative there: $-\frac{\sqrt2}{2}$.
- id: pc-q-1806
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Find $\tan\dfrac{5\pi}{3}$.'
  choices: ['$\sqrt3$', '$-\dfrac{\sqrt3}{3}$', '$-\sqrt3$', '$\dfrac{\sqrt3}{3}$']
  answer: 2
  explanation: |-
    $\frac{5\pi}{3}$ is in Quadrant IV with reference angle $\frac{\pi}{3}$; $\tan\frac{\pi}{3} = \sqrt3$ and tangent is negative in QIV: $-\sqrt3$.
- id: pc-q-1807
  lesson: pc-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'What is the reference angle of $240^\circ$?'
  choices: ['$30^\circ$', '$60^\circ$', '$120^\circ$', '$150^\circ$']
  answer: 1
  explanation: |-
    $240^\circ$ is in Quadrant III; its distance past $180^\circ$ is $240^\circ - 180^\circ = 60^\circ$. Measuring to the $y$-axis ($30^\circ$) is the usual mistake.
- id: pc-q-1808
  lesson: pc-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'In which quadrant is $\sin\theta < 0$ and $\cos\theta > 0$?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant III', 'Quadrant IV']
  answer: 3
  explanation: |-
    $\cos\theta = x > 0$ means right of the $y$-axis; $\sin\theta = y < 0$ means below the $x$-axis. That is Quadrant IV.
- id: pc-q-1809
  lesson: pc-unit-circle
  topic: Unit circle
  stem: '$\cos\theta = -\dfrac{5}{13}$ and $\theta$ is in Quadrant III. Find $\sin\theta$.'
  choices: ['$\dfrac{12}{13}$', '$-\dfrac{12}{13}$', '$-\dfrac{8}{13}$', '$\dfrac{5}{12}$']
  answer: 1
  explanation: |-
    $\sin^2\theta = 1 - \frac{25}{169} = \frac{144}{169}$, so $\sin\theta = \pm\frac{12}{13}$. Sine is negative in QIII: $-\frac{12}{13}$.
- id: pc-q-1810
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Which point on the unit circle corresponds to $\theta = \dfrac{\pi}{2}$?'
  choices: ['$(1, 0)$', '$(-1, 0)$', '$(0, 1)$', '$(0, -1)$']
  answer: 2
  explanation: |-
    A quarter turn counterclockwise from $(1, 0)$ lands on $(0, 1)$. So $\cos\frac{\pi}{2} = 0$ and $\sin\frac{\pi}{2} = 1$.
- id: pc-q-1811
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Find $\sec\dfrac{\pi}{3}$.'
  choices: ['$2$', '$\dfrac12$', '$\dfrac{2\sqrt3}{3}$', '$\sqrt3$']
  answer: 0
  explanation: |-
    $\sec\frac{\pi}{3} = \frac{1}{\cos(\pi/3)} = \frac{1}{1/2} = 2$. $\frac{2\sqrt3}{3}$ is $\csc\frac{\pi}{3}$.
- id: pc-q-1812
  lesson: pc-unit-circle
  topic: Unit circle
  stem: 'Find $\sin\left(-\dfrac{5\pi}{4}\right)$.'
  choices: ['$-\dfrac{\sqrt2}{2}$', '$-1$', '$\dfrac12$', '$\dfrac{\sqrt2}{2}$']
  answer: 3
  explanation: |-
    $-\frac{5\pi}{4}$ ends in the same place as $-\frac{5\pi}{4} + 2\pi = \frac{3\pi}{4}$, in Quadrant II, where sine is positive. Reference angle $\frac{\pi}{4}$: $\frac{\sqrt2}{2}$.

- id: pc-q-1901
  lesson: pc-trig-graphs-identities
  module_quiz: true
  topic: Trig graphs
  stem: 'What are the amplitude and period of $y = -4\cos(3x)$?'
  choices: ['Amplitude $-4$, period $\dfrac{2\pi}{3}$', 'Amplitude 4, period $6\pi$', 'Amplitude 4, period $\dfrac{2\pi}{3}$', 'Amplitude 3, period $\dfrac{\pi}{2}$']
  answer: 2
  explanation: |-
    Amplitude is $|A| = 4$ (a distance, never negative; the minus sign reflects the graph). Period $= \frac{2\pi}{B} = \frac{2\pi}{3}$. $6\pi$ comes from multiplying instead of dividing.
- id: pc-q-1902
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'What is the phase shift of $y = \sin(2x - \pi)$?'
  choices: ['$\pi$ to the right', '$\dfrac{\pi}{2}$ to the right', '$\dfrac{\pi}{2}$ to the left', '$2\pi$ to the right']
  answer: 1
  explanation: |-
    Factor: $2x - \pi = 2\left(x - \frac{\pi}{2}\right)$, so $C = \frac{\pi}{2}$ to the right. Reading $\pi$ without factoring is the common error.
- id: pc-q-1903
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'What is the maximum value of $y = 2\sin x - 5$?'
  choices: ['$2$', '$-5$', '$-3$', '$7$']
  answer: 2
  explanation: |-
    $\sin x$ is at most 1, so $y \le 2(1) - 5 = -3$. Midline $-5$ plus amplitude 2.
- id: pc-q-1904
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'What is the midline of $y = 3\cos x + 7$?'
  choices: ['$y = 7$', '$y = 3$', '$y = 10$', '$y = 0$']
  answer: 0
  explanation: |-
    The vertical shift $D = 7$ moves the midline from $y = 0$ to $y = 7$. The graph runs between $7 - 3 = 4$ and $7 + 3 = 10$.
- id: pc-q-1905
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'Evaluate $\sin^{-1}\left(-\dfrac12\right)$.'
  choices: ['$\dfrac{7\pi}{6}$', '$\dfrac{11\pi}{6}$', '$-2$', '$-\dfrac{\pi}{6}$']
  answer: 3
  explanation: |-
    $\sin^{-1}$ returns an angle in $\left[-\frac{\pi}{2}, \frac{\pi}{2}\right]$. The angle there with sine $-\frac12$ is $-\frac{\pi}{6}$. $\frac{7\pi}{6}$ and $\frac{11\pi}{6}$ have the right sine but lie outside the restricted range; $-2$ is the reciprocal.
- id: pc-q-1906
  lesson: pc-trig-graphs-identities
  module_quiz: true
  topic: Trig identities
  stem: 'Find the exact value of $\cos 15^\circ$ using $15^\circ = 45^\circ - 30^\circ$.'
  choices: ['$\dfrac{\sqrt6 - \sqrt2}{4}$', '$\dfrac{\sqrt6 + \sqrt2}{4}$', '$\dfrac{\sqrt2 - \sqrt3}{2}$', '$\dfrac{\sqrt3 - 1}{2}$']
  answer: 1
  explanation: |-
    $\cos(a - b) = \cos a\cos b + \sin a\sin b$: $\frac{\sqrt2}{2}\cdot\frac{\sqrt3}{2} + \frac{\sqrt2}{2}\cdot\frac12 = \frac{\sqrt6 + \sqrt2}{4} \approx 0.9659$. $\frac{\sqrt6 - \sqrt2}{4}$ is $\cos 75^\circ$ (the sign in the formula flipped). Computing $\cos 45^\circ - \cos 30^\circ$ gives $\frac{\sqrt2 - \sqrt3}{2}$.
- id: pc-q-1907
  lesson: pc-trig-graphs-identities
  module_quiz: true
  topic: Trig identities
  stem: '$\sin\theta = \dfrac35$ and $\theta$ is in Quadrant II. Find $\sin 2\theta$.'
  choices: ['$\dfrac{24}{25}$', '$\dfrac65$', '$-\dfrac{24}{25}$', '$-\dfrac{7}{25}$']
  answer: 2
  explanation: |-
    $\cos\theta = -\frac45$ in QII. $\sin 2\theta = 2\cdot\frac35\cdot\left(-\frac45\right) = -\frac{24}{25}$. Forgetting the negative cosine gives $\frac{24}{25}$; $2\sin\theta = \frac65$ isn't an identity.
- id: pc-q-1908
  lesson: pc-trig-graphs-identities
  module_quiz: true
  topic: Trig identities
  stem: 'If $\cos\theta = \dfrac13$, find $\cos 2\theta$.'
  choices: ['$\dfrac23$', '$-\dfrac79$', '$\dfrac79$', '$\dfrac19$']
  answer: 1
  explanation: |-
    $\cos 2\theta = 2\cos^2\theta - 1 = 2\cdot\frac19 - 1 = -\frac79$. No quadrant is needed for this form.
- id: pc-q-1909
  lesson: pc-trig-graphs-identities
  topic: Trig identities
  stem: 'Which equation is an identity?'
  choices: ['$1 + \tan^2\theta = \sec^2\theta$', '$\sin 2\theta = 2\sin\theta$', '$\sin(a + b) = \sin a + \sin b$', '$\cos(-\theta) = -\cos\theta$']
  answer: 0
  explanation: |-
    Dividing $\sin^2\theta + \cos^2\theta = 1$ by $\cos^2\theta$ gives $\tan^2\theta + 1 = \sec^2\theta$. The others fail: at $\theta = \frac{\pi}{2}$, $\sin 2\theta = \sin\pi = 0$ but $2\sin\theta = 2$; at $a = b = \frac{\pi}{2}$, $\sin(a + b) = 0$ but $\sin a + \sin b = 2$; and cosine is even, so $\cos(-\theta) = \cos\theta$, not $-\cos\theta$.
- id: pc-q-1910
  lesson: pc-trig-graphs-identities
  topic: Trig identities
  stem: 'Simplify $\dfrac{1 - \cos^2 x}{\sin x}$.'
  choices: ['$\cos x$', '$1 - \cos x$', '$\sin x$', '$\tan x$']
  answer: 2
  explanation: |-
    $1 - \cos^2 x = \sin^2 x$, and $\frac{\sin^2 x}{\sin x} = \sin x$ (where $\sin x \ne 0$).
- id: pc-q-1911
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'What is the period of $y = \tan\left(\dfrac{x}{2}\right)$?'
  choices: ['$\dfrac{\pi}{2}$', '$\pi$', '$4\pi$', '$2\pi$']
  answer: 3
  explanation: |-
    Tangent has period $\pi$; with $B = \frac12$ the period is $\frac{\pi}{1/2} = 2\pi$.
- id: pc-q-1912
  lesson: pc-trig-graphs-identities
  topic: Trig graphs
  stem: 'Water at a dock is 10 ft deep at high tide and 2 ft deep at low tide, with 12 hours between high tides. In $y = A\cos(Bt) + D$, what are $A$, $B$ and $D$?'
  choices: ['$A = 8$, $B = 12$, $D = 2$', '$A = 4$, $B = \dfrac{\pi}{6}$, $D = 6$', '$A = 4$, $B = \dfrac{\pi}{12}$, $D = 6$', '$A = 5$, $B = \dfrac{\pi}{6}$, $D = 5$']
  answer: 1
  explanation: |-
    Midline $D = \frac{10 + 2}{2} = 6$; amplitude $A = \frac{10 - 2}{2} = 4$; period 12 so $B = \frac{2\pi}{12} = \frac{\pi}{6}$. $\frac{\pi}{12}$ would give a 24-hour period.
