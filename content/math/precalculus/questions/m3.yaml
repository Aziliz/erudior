- id: pc-q-0801
  lesson: pc-polynomial-graphs
  module_quiz: true
  topic: Polynomial graphs
  stem: 'What is the end behavior of $f(x) = -3x^5 + 2x^2 + 7$?'
  choices: ['Up on the left, down on the right', 'Down on both ends', 'Up on both ends', 'Down on the left, up on the right']
  answer: 0
  explanation: |-
    The leading term $-3x^5$ has odd degree and a negative coefficient. For large positive $x$ it is very negative (down on the right); for large negative $x$ it is very positive (up on the left).
- id: pc-q-0802
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'What is the end behavior of $f(x) = x^2(3 - x)(x + 2)$?'
  choices: ['Up on both ends', 'Down on both ends', 'Down on the left, up on the right', 'Up on the left, down on the right']
  answer: 1
  explanation: |-
    Multiply the leading parts of the factors: $x^2 \cdot (-x) \cdot x = -x^4$. Even degree, negative coefficient: down on both ends. Reading $(3 - x)$ as $+x$ is the usual slip.
- id: pc-q-0803
  lesson: pc-polynomial-graphs
  module_quiz: true
  topic: Polynomial graphs
  stem: 'How does the graph of $f(x) = (x + 1)^3(x - 4)^2$ behave at $x = 4$?'
  choices: ['It crosses the axis', 'It has a vertical asymptote', 'It touches the axis and turns back', 'It crosses the axis with a flattened S-shape']
  answer: 2
  explanation: |-
    $x = 4$ has multiplicity 2 (even), so the factor $(x - 4)^2$ does not change sign there: the graph touches and turns. At $x = -1$ (multiplicity 3) it would cross with a flattened S-shape.
- id: pc-q-0804
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'What is the greatest possible number of turning points of a polynomial of degree 5?'
  choices: ['5', '6', '3', '4']
  answer: 3
  explanation: |-
    A degree-$n$ polynomial has at most $n - 1$ turning points, so at most 4.
- id: pc-q-0805
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'A polynomial''s graph has exactly 3 turning points. What is the smallest degree it can have?'
  choices: ['3', '4', '2', '6']
  answer: 1
  explanation: |-
    Degree $n$ allows at most $n - 1$ turning points, so $n - 1 \ge 3$ and $n \ge 4$.
- id: pc-q-0806
  lesson: pc-polynomial-graphs
  module_quiz: true
  topic: Polynomial graphs
  stem: 'A polynomial $f$ has $f(1) = -3$ and $f(2) = 5$. What does the intermediate value theorem guarantee?'
  choices: ['$f$ has a zero between 1 and 2', '$f(1.5) = 1$', '$f$ is increasing on $[1, 2]$', '$f$ has exactly one zero between 1 and 2']
  answer: 0
  explanation: |-
    The values have opposite signs and a polynomial's graph has no breaks, so it crosses zero at least once in $(1, 2)$. The theorem says nothing about how many zeros, about monotonicity, or about the value at the midpoint.
- id: pc-q-0807
  lesson: pc-polynomial-graphs
  module_quiz: true
  topic: Polynomial graphs
  stem: 'A cubic has zeros $1$, $-2$ and $3$ and passes through $(0, 12)$. What is its leading coefficient?'
  choices: ['$12$', '$-2$', '$2$', '$6$']
  answer: 2
  explanation: |-
    $f(x) = a(x - 1)(x + 2)(x - 3)$. At $x = 0$: $a(-1)(2)(-3) = 6a = 12$, so $a = 2$.
- id: pc-q-0808
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'What are the zeros of $f(x) = x^3 - 6x^2 + 9x$ and their multiplicities?'
  choices: ['$0$ (mult. 1), $3$ (mult. 2)', '$0$ (mult. 2), $3$ (mult. 1)', '$3$ (mult. 3)', '$0$, $3$, $-3$ (each mult. 1)']
  answer: 0
  explanation: |-
    $x^3 - 6x^2 + 9x = x(x^2 - 6x + 9) = x(x - 3)^2$. So 0 has multiplicity 1 and 3 has multiplicity 2.
- id: pc-q-0809
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'Which number of $x$-intercepts is impossible for a polynomial of degree 4?'
  choices: ['0', '1', '3', '5']
  answer: 3
  explanation: |-
    A degree-4 polynomial has at most 4 real zeros, so 5 intercepts is impossible. 0 is possible ($x^4 + 1$), 1 is possible ($x^4$), 3 is possible ($x^2(x - 1)(x + 1)$).
- id: pc-q-0810
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'What is the $y$-intercept of $f(x) = (x - 2)(x + 3)(2x - 1)$?'
  choices: ['$-6$', '$6$', '$0$', '$-12$']
  answer: 1
  explanation: |-
    $f(0) = (-2)(3)(-1) = 6$. Two negative factors make a positive product.
- id: pc-q-0811
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'On which interval is $f(x) = (x + 2)(x - 1)^2$ negative?'
  choices: ['$(-2, 1)$', '$(1, \infty)$', '$(-\infty, -2)$', '$(-\infty, -2) \cup (1, \infty)$']
  answer: 2
  explanation: |-
    $(x - 1)^2 \ge 0$, so the sign of $f$ is the sign of $x + 2$ (except $f = 0$ at $x = 1$). That is negative only for $x < -2$. At $x = 1$ the graph touches without crossing.
- id: pc-q-0812
  lesson: pc-polynomial-graphs
  topic: Polynomial graphs
  stem: 'For $g(x) = x^3 - 2x - 5$: $g(2) = -1$, $g(2.5) = 5.625$, $g(3) = 16$. In which interval must a zero lie?'
  choices: ['$(2.5, 3)$', '$(2, 2.5)$', '$(0, 2)$', 'No zero is guaranteed']
  answer: 1
  explanation: |-
    The sign changes between $g(2) < 0$ and $g(2.5) > 0$, so by the IVT a zero lies in $(2, 2.5)$. Between 2.5 and 3 both values are positive, which guarantees nothing.

- id: pc-q-0901
  lesson: pc-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'What is the remainder when $x^3 - 4x^2 + 2x - 7$ is divided by $x - 3$?'
  choices: ['$-10$', '$-4$', '$56$', '$0$']
  answer: 0
  explanation: |-
    By the remainder theorem it is $f(3) = 27 - 36 + 6 - 7 = -10$. Using $f(-3)$ instead gives $-27 - 36 - 6 - 7 = -76$; using the wrong sign of $c$ is the most common error.
- id: pc-q-0902
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'Divide $3x^3 - 5x^2 + 4$ by $x + 1$. What are the quotient and remainder?'
  choices: ['$3x^2 - 2x - 2$, remainder $2$', '$3x^2 - 8x + 8$, remainder $-4$', '$3x^2 - 8x + 4$, remainder $0$', '$3x^2 + 8x + 8$, remainder $12$']
  answer: 1
  explanation: |-
    Use $c = -1$ and coefficients $3, -5, 0, 4$ (note the 0). Bring down 3; $3(-1) = -3$, $-5 - 3 = -8$; $-8(-1) = 8$, $0 + 8 = 8$; $8(-1) = -8$, $4 - 8 = -4$. Quotient $3x^2 - 8x + 8$, remainder $-4$. Check: $f(-1) = -3 - 5 + 4 = -4$. ✓
- id: pc-q-0903
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'Is $x + 2$ a factor of $x^3 + 8$?'
  choices: ['No, because the remainder is 16', 'No, because $x^3 + 8$ has no real zeros', 'Yes, because $(-2)^3 + 8 = 0$', 'Yes, because $2^3 = 8$']
  answer: 2
  explanation: |-
    Factor theorem with $c = -2$: $f(-2) = -8 + 8 = 0$, so $x + 2$ is a factor. Indeed $x^3 + 8 = (x + 2)(x^2 - 2x + 4)$. (16 is $f(2)$, which tests $x - 2$.)
- id: pc-q-0904
  lesson: pc-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'For which $k$ is $x - 2$ a factor of $x^3 + kx - 4$?'
  choices: ['$k = 2$', '$k = -6$', '$k = 6$', '$k = -2$']
  answer: 3
  explanation: |-
    Need $f(2) = 0$: $8 + 2k - 4 = 0$, so $2k = -4$ and $k = -2$.
- id: pc-q-0905
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'A polynomial is divided by $x^2 + 3$. What can the degree of the remainder be?'
  choices: ['Exactly 1', '0 or 1 (or the remainder is 0)', 'Exactly 2', 'Any degree less than the dividend''s']
  answer: 1
  explanation: |-
    The division algorithm stops when the remainder's degree is less than the divisor's, here 2. So the remainder is 0 or has degree 0 or 1.
- id: pc-q-0906
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'Simplify $\dfrac{x^3 - 1}{x - 1}$ (for $x \ne 1$).'
  choices: ['$x^2 + 1$', '$x^2 - 1$', '$x^2 + x + 1$', '$x^2 - x + 1$']
  answer: 2
  explanation: |-
    Synthetic division with $c = 1$ on $1, 0, 0, -1$ gives $1, 1, 1$, remainder 0: $x^2 + x + 1$. (This is the difference of cubes: $x^3 - 1 = (x - 1)(x^2 + x + 1)$.)
- id: pc-q-0907
  lesson: pc-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'Divide $2x^3 + x^2 - 3x + 5$ by $x^2 + 1$.'
  choices: ['Quotient $2x + 1$, remainder $-5x + 4$', 'Quotient $2x + 1$, remainder $-x + 6$', 'Quotient $2x^2 + x - 3$, remainder $5$', 'Quotient $2x - 1$, remainder $-5x + 6$']
  answer: 0
  explanation: |-
    $2x^3 \div x^2 = 2x$; subtract $2x^3 + 2x$: $x^2 - 5x + 5$. $x^2 \div x^2 = 1$; subtract $x^2 + 1$: $-5x + 4$. Check: $(x^2 + 1)(2x + 1) - 5x + 4 = 2x^3 + x^2 + 2x + 1 - 5x + 4$. ✓
- id: pc-q-0908
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'To divide by $x + 4$ with synthetic division, which number goes in the box?'
  choices: ['$4$', '$\tfrac14$', '$-\tfrac14$', '$-4$']
  answer: 3
  explanation: |-
    $x + 4 = x - (-4)$, so $c = -4$. Synthetic division divides by $x - c$.
- id: pc-q-0909
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'Suppose $f(x) = (x - 3)\,q(x) + 7$ for some polynomial $q$. What is $f(3)$?'
  choices: ['$0$', '$7$', '$q(3)$', '$3$']
  answer: 1
  explanation: |-
    At $x = 3$ the first term is $0 \cdot q(3) = 0$, leaving $f(3) = 7$. This is the remainder theorem in action.
- id: pc-q-0910
  lesson: pc-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: '$1$ is a zero of $f(x) = x^3 - 2x^2 - 5x + 6$. Factor $f$ completely.'
  choices: ['$(x - 1)(x + 3)(x - 2)$', '$(x - 1)(x - 3)(x + 2)$', '$(x + 1)(x - 3)(x - 2)$', '$(x - 1)(x^2 - x + 6)$']
  answer: 1
  explanation: |-
    Synthetic division by $c = 1$ on $1, -2, -5, 6$: $1, -1, -6$, remainder 0. Then $x^2 - x - 6 = (x - 3)(x + 2)$. So $f(x) = (x - 1)(x - 3)(x + 2)$.
- id: pc-q-0911
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'A student divides $x^3 + 2x - 1$ by $x - 2$ with synthetic division using the coefficient row $1, 2, -1$. What went wrong?'
  choices: ['Nothing; that is the correct row', 'The box should hold $-2$', 'The row needs a 0 for the missing $x^2$ term: $1, 0, 2, -1$', 'The remainder must be written first']
  answer: 2
  explanation: |-
    Every power from $x^3$ down to the constant needs a coefficient, so the missing $x^2$ term must be entered as 0. With $1, 0, 2, -1$ and $c = 2$: $1, 2, 6$, remainder 11, matching $f(2) = 8 + 4 - 1 = 11$.
- id: pc-q-0912
  lesson: pc-poly-division
  topic: Polynomial division
  stem: 'What is the remainder when $x^{100} - 1$ is divided by $x + 1$?'
  choices: ['$-2$', '$100$', '$0$', '$2$']
  answer: 2
  explanation: |-
    Remainder $= f(-1) = (-1)^{100} - 1 = 1 - 1 = 0$. An even power of $-1$ is 1. (So $x + 1$ is a factor.)

- id: pc-q-1001
  lesson: pc-poly-zeros
  module_quiz: true
  topic: Zeros of polynomials
  stem: 'Which number is **not** a possible rational zero of $3x^3 - 2x + 4$?'
  choices: ['$\tfrac43$', '$-2$', '$\tfrac32$', '$\tfrac13$']
  answer: 2
  explanation: |-
    Candidates are $\pm\frac{p}{q}$ with $p \mid 4$ and $q \mid 3$: $\pm1, \pm2, \pm4, \pm\frac13, \pm\frac23, \pm\frac43$. $\frac32$ would need 3 to divide 4 and 2 to divide 3, which inverts the rule.
- id: pc-q-1002
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'Find all zeros of $f(x) = 2x^3 - x^2 - 13x - 6$.'
  choices: ['$3, -2, -\tfrac12$', '$-3, 2, \tfrac12$', '$3, 2, -\tfrac12$', '$3, -2, \tfrac12$']
  answer: 0
  explanation: |-
    Testing candidates: $f(3) = 54 - 9 - 39 - 6 = 0$. Dividing by $x - 3$ leaves $2x^2 + 5x + 2 = (2x + 1)(x + 2)$. Zeros: $3, -2, -\frac12$.
- id: pc-q-1003
  lesson: pc-poly-zeros
  module_quiz: true
  topic: Zeros of polynomials
  stem: 'A polynomial with real coefficients has $2 + 3i$ as a zero. Which other number must be a zero?'
  choices: ['$-2 + 3i$', '$2 - 3i$', '$-2 - 3i$', '$3 + 2i$']
  answer: 1
  explanation: |-
    With real coefficients, non-real zeros come in conjugate pairs: $a + bi$ and $a - bi$. The conjugate of $2 + 3i$ is $2 - 3i$.
- id: pc-q-1004
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'How many complex zeros, counted with multiplicity, does a polynomial of degree 5 have?'
  choices: ['At most 5', 'At least 1 but it depends', 'Exactly 5', 'Exactly 4']
  answer: 2
  explanation: |-
    By the fundamental theorem of algebra (linear factorization), a degree-$n$ polynomial has exactly $n$ complex zeros counting multiplicity. Some may be real and some non-real.
- id: pc-q-1005
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'Which polynomial with real coefficients and leading coefficient 1 has lowest degree and zeros $3$ and $i$?'
  choices: ['$x^2 - (3 + i)x + 3i$', '$x^3 - 3x^2 - x + 3$', '$x^3 + 3x^2 + x + 3$', '$x^3 - 3x^2 + x - 3$']
  answer: 3
  explanation: |-
    $-i$ must also be a zero. $(x - i)(x + i) = x^2 + 1$, so $f(x) = (x - 3)(x^2 + 1) = x^3 - 3x^2 + x - 3$. The first choice has non-real coefficients; $x^3 - 3x^2 - x + 3 = (x - 3)(x^2 - 1)$ has zeros $\pm1$ instead of $\pm i$.
- id: pc-q-1006
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'By Descartes'' rule of signs, how many positive real zeros can $f(x) = x^4 - 3x^3 + 2x^2 - x + 5$ have?'
  choices: ['4, 2 or 0', 'Exactly 4', '3 or 1', '0 only']
  answer: 0
  explanation: |-
    The signs $+, -, +, -, +$ change 4 times, so the number of positive zeros is 4 or less by an even number: 4, 2 or 0.
- id: pc-q-1007
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'Why must every polynomial of odd degree with real coefficients have at least one real zero?'
  choices: ['Because its constant term is a zero', 'Because non-real zeros come in conjugate pairs, so an odd count cannot all be non-real', 'Because odd functions pass through the origin', 'Because the rational zero theorem always gives a zero']
  answer: 1
  explanation: |-
    Non-real zeros pair off as $a \pm bi$, so there is an even number of them. An odd total (the degree) leaves at least one real zero. Graphically, the ends go in opposite directions, so the graph must cross the axis.
- id: pc-q-1008
  lesson: pc-poly-zeros
  module_quiz: true
  topic: Zeros of polynomials
  stem: 'Which real quadratic factor corresponds to the conjugate pair of zeros $1 \pm 2i$?'
  choices: ['$x^2 - 2x - 3$', '$x^2 + 2x + 5$', '$x^2 - 2x + 5$', '$x^2 - 2x + 3$']
  answer: 2
  explanation: |-
    $(x - a)^2 + b^2$ with $a = 1$, $b = 2$: $(x - 1)^2 + 4 = x^2 - 2x + 5$. Check with the quadratic formula: $\frac{2 \pm \sqrt{4 - 20}}{2} = 1 \pm 2i$. ✓
- id: pc-q-1009
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'Find all zeros of $x^3 - 2x^2 + 4x - 8$.'
  choices: ['$2, -2, 4$', '$2, 2i, -2i$', '$-2, 2i, -2i$', '$2, 4i, -4i$']
  answer: 1
  explanation: |-
    Group: $x^2(x - 2) + 4(x - 2) = (x - 2)(x^2 + 4)$. $x^2 = -4$ gives $x = \pm 2i$. Zeros: $2, \pm 2i$.
- id: pc-q-1010
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'A degree-4 polynomial with real coefficients has $1 + i$ as a zero. What is the largest possible number of real zeros (counting multiplicity)?'
  choices: ['4', '3', '1', '2']
  answer: 3
  explanation: |-
    $1 - i$ is also a zero, so 2 of the 4 zeros are non-real, leaving at most 2 real zeros.
- id: pc-q-1011
  lesson: pc-poly-zeros
  topic: Zeros of polynomials
  stem: 'What does the fundamental theorem of algebra state?'
  choices: ['Every polynomial of degree $n \ge 1$ has at least one complex zero', 'Every polynomial has at least one rational zero', 'Every polynomial of degree $n$ has $n$ real zeros', 'Every polynomial can be factored over the integers']
  answer: 0
  explanation: |-
    The theorem guarantees one complex zero; repeating the argument on the quotient gives exactly $n$ zeros with multiplicity. Real or rational zeros are not guaranteed: $x^2 + 1$ has none.
- id: pc-q-1012
  lesson: pc-poly-zeros
  module_quiz: true
  topic: Zeros of polynomials
  stem: 'Find all zeros of $x^4 - 5x^2 - 36$.'
  choices: ['$\pm 3$ and $\pm 2$', '$\pm 6$ and $\pm i$', '$\pm 3$ and $\pm 2i$', '$\pm 3i$ and $\pm 2$']
  answer: 2
  explanation: |-
    Treat it as a quadratic in $x^2$: $(x^2 - 9)(x^2 + 4) = 0$. So $x^2 = 9$ gives $\pm 3$, and $x^2 = -4$ gives $\pm 2i$.

- id: pc-q-1101
  lesson: pc-rational-asymptotes
  module_quiz: true
  topic: Rational functions
  stem: 'What are the vertical asymptotes of $R(x) = \dfrac{x + 1}{x^2 - 9}$?'
  choices: ['$x = -1$', '$x = 9$', '$x = 3$ only', '$x = 3$ and $x = -3$']
  answer: 3
  explanation: |-
    $x^2 - 9 = (x - 3)(x + 3)$ and neither factor cancels with the numerator, so both zeros are vertical asymptotes. $x = -1$ is an $x$-intercept.
- id: pc-q-1102
  lesson: pc-rational-asymptotes
  module_quiz: true
  topic: Rational functions
  stem: 'What is the horizontal asymptote of $R(x) = \dfrac{3x^2 - 1}{2x^2 + x}$?'
  choices: ['$y = \tfrac32$', '$y = 0$', '$y = -1$', 'None']
  answer: 0
  explanation: |-
    The degrees are equal (2 and 2), so the asymptote is the ratio of leading coefficients, $\frac32$. Using the constant terms or "none" are the common errors.
- id: pc-q-1103
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'What is the horizontal asymptote of $R(x) = \dfrac{5x + 2}{x^2 + 1}$?'
  choices: ['$y = 5$', 'None', '$y = 0$', '$y = 2$']
  answer: 2
  explanation: |-
    The numerator's degree (1) is less than the denominator's (2), so $R(x) \to 0$ as $x \to \pm\infty$: $y = 0$.
- id: pc-q-1104
  lesson: pc-rational-asymptotes
  module_quiz: true
  topic: Rational functions
  stem: 'Where is the hole in the graph of $R(x) = \dfrac{x^2 - 9}{x^2 + x - 6}$?'
  choices: ['$(3, 0)$', '$(-3, \tfrac65)$', '$(2, 5)$', '$(-3, 0)$']
  answer: 1
  explanation: |-
    $\frac{(x - 3)(x + 3)}{(x + 3)(x - 2)}$: the factor $(x + 3)$ cancels, so the hole is at $x = -3$. The simplified form $\frac{x - 3}{x - 2}$ gives $y = \frac{-6}{-5} = \frac65$.
- id: pc-q-1105
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'What is the vertical asymptote of $R(x) = \dfrac{x^2 - 9}{x^2 + x - 6}$?'
  choices: ['$x = -3$', '$x = 3$', '$x = 2$', '$x = 2$ and $x = -3$']
  answer: 2
  explanation: |-
    After cancelling $(x + 3)$, the simplified denominator is $x - 2$, giving the vertical asymptote $x = 2$. At $x = -3$ there is a hole, not an asymptote.
- id: pc-q-1106
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'Which statement about asymptotes is true?'
  choices: ['A graph can never cross any asymptote', 'A graph can cross a vertical asymptote but not a horizontal one', 'A graph always crosses its horizontal asymptote', 'A graph can cross a horizontal asymptote but never a vertical one']
  answer: 3
  explanation: |-
    A horizontal asymptote only describes end behavior, so the graph may cross it at moderate $x$. A vertical asymptote is at an $x$ where the function is undefined, so the graph cannot be there.
- id: pc-q-1107
  lesson: pc-rational-asymptotes
  module_quiz: true
  topic: Rational functions
  stem: 'What is the horizontal asymptote of $R(x) = \dfrac{x^3 + 1}{x - 2}$?'
  choices: ['$y = 1$', 'There is none', '$y = 0$', '$y = -\tfrac12$']
  answer: 1
  explanation: |-
    The numerator's degree (3) exceeds the denominator's (1), so $|R(x)|$ grows without bound and there is no horizontal asymptote. ($-\frac12$ is $R(0)$, the $y$-intercept.)
- id: pc-q-1108
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'What is the domain of $R(x) = \dfrac{x - 1}{x^2 + 4}$?'
  choices: ['All real numbers', 'All real numbers except $\pm 2$', 'All real numbers except 1', 'All real numbers except $-4$']
  answer: 0
  explanation: |-
    $x^2 + 4 \ge 4 > 0$ for every real $x$, so the denominator is never zero. There are no vertical asymptotes or holes.
- id: pc-q-1109
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'How does $R(x) = \dfrac{1}{(x - 2)^2}$ behave near $x = 2$?'
  choices: ['$R \to -\infty$ on both sides', '$R \to +\infty$ on the left and $-\infty$ on the right', '$R \to +\infty$ on both sides', '$R \to 0$']
  answer: 2
  explanation: |-
    $(x - 2)^2$ is a small positive number on both sides of 2, so $\frac{1}{(x-2)^2}$ is a large positive number on both sides.
- id: pc-q-1110
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'As $x \to 1^+$ (from the right), what happens to $R(x) = \dfrac{2x}{x - 1}$?'
  choices: ['$R(x) \to 2$', '$R(x) \to -\infty$', '$R(x) \to 0$', '$R(x) \to +\infty$']
  answer: 3
  explanation: |-
    For $x$ slightly more than 1, the numerator is about 2 (positive) and the denominator is a tiny positive number, so the quotient is a large positive number. ($y = 2$ is the horizontal asymptote, which describes $x \to \pm\infty$.)
- id: pc-q-1111
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'Making $x$ items costs $C(x) = 500 + 3x$ dollars, so the average cost per item is $A(x) = \dfrac{500 + 3x}{x}$. What does the horizontal asymptote of $A$ tell you?'
  choices: ['The fixed cost is \$500', 'The average cost approaches \$3 per item as production grows', 'The average cost is never more than \$3', 'Production can''t exceed 500 items']
  answer: 1
  explanation: |-
    Equal degrees give the asymptote $y = \frac31 = 3$. As $x$ grows, the fixed \$500 is spread over more items, so $A(x) = 3 + \frac{500}{x}$ approaches \$3 from above.
- id: pc-q-1112
  lesson: pc-rational-asymptotes
  topic: Rational functions
  stem: 'Which function has a vertical asymptote $x = 2$ and a horizontal asymptote $y = -1$?'
  choices: ['$\dfrac{x + 3}{x - 2}$', '$\dfrac{-x}{x + 2}$', '$\dfrac{-x + 3}{x - 2}$', '$\dfrac{2 - x}{x - 2}$']
  answer: 2
  explanation: |-
    $\frac{-x + 3}{x - 2}$: the denominator is 0 at 2 and the numerator isn't, and the leading coefficients give $\frac{-1}{1} = -1$. The first has $y = 1$; the second has $x = -2$; the last simplifies to $-1$ with a hole at 2, not an asymptote.

- id: pc-q-1201
  lesson: pc-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'What is the slant asymptote of $R(x) = \dfrac{x^2 + 3x + 1}{x + 1}$?'
  choices: ['$y = x + 3$', '$y = x + 2$', '$y = x + 4$', '$y = x$']
  answer: 1
  explanation: |-
    Synthetic division by $c = -1$ on $1, 3, 1$: $1, 2$, remainder $-1$. So $R(x) = x + 2 - \frac{1}{x + 1}$, and the slant asymptote is the quotient $y = x + 2$.
- id: pc-q-1202
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'What is the slant asymptote of $R(x) = \dfrac{2x^2 - 5x + 1}{x - 2}$?'
  choices: ['$y = 2x - 1$', '$y = 2x - 9$', '$y = 2x + 1$', '$y = 2x - 5$']
  answer: 0
  explanation: |-
    Synthetic division by 2 on $2, -5, 1$: $2, -1$, remainder $-1$. Quotient $2x - 1$. ($2x - 9$ comes from using $c = -2$.)
- id: pc-q-1203
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'Which function has a slant asymptote?'
  choices: ['$\dfrac{x^2 + 1}{x^2 - 1}$', '$\dfrac{x^3}{x - 1}$', '$\dfrac{x + 1}{x^2}$', '$\dfrac{x^3 - 1}{x^2 + 1}$']
  answer: 3
  explanation: |-
    A slant asymptote needs the numerator's degree to be exactly one more than the denominator's: $3 = 2 + 1$. $\frac{x^3}{x-1}$ is two degrees higher (parabola-like end behavior); the others have horizontal asymptotes.
- id: pc-q-1204
  lesson: pc-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'What are the $x$-intercepts of $R(x) = \dfrac{x^2 - 4}{x^2 - x - 2}$?'
  choices: ['$x = -2$ only', '$x = 2$ and $x = -2$', '$x = 2$ only', '$x = -1$ and $x = 2$']
  answer: 0
  explanation: |-
    $\frac{(x - 2)(x + 2)}{(x - 2)(x + 1)}$: the factor $(x - 2)$ cancels, so $x = 2$ is a hole, not an intercept. The only $x$-intercept is $x = -2$.
- id: pc-q-1205
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'What is the $y$-intercept of $R(x) = \dfrac{x - 6}{x^2 + 3x + 2}$?'
  choices: ['$6$', '$-6$', '$-3$', '$3$']
  answer: 2
  explanation: |-
    $R(0) = \frac{-6}{2} = -3$.
- id: pc-q-1206
  lesson: pc-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'What is the sign of $R(x) = \dfrac{x - 1}{(x + 2)(x - 3)}$ on the interval $(1, 3)$?'
  choices: ['Positive', 'Negative', 'Zero', 'It changes sign within the interval']
  answer: 1
  explanation: |-
    Test $x = 2$: $\frac{1}{(4)(-1)} = -\frac14 < 0$. No critical value lies inside $(1, 3)$, so the sign is negative throughout.
- id: pc-q-1207
  lesson: pc-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'For $R(x) = \dfrac{x - 1}{(x + 2)(x - 3)}$, what happens as $x \to 3^+$?'
  choices: ['$R(x) \to -\infty$', '$R(x) \to 0$', '$R(x) \to +\infty$', '$R(x) \to 1$']
  answer: 2
  explanation: |-
    Just right of 3 (say 3.01): numerator $\approx 2$, $(x + 2) \approx 5$, $(x - 3)$ is a tiny positive number. The quotient is a large positive number.
- id: pc-q-1208
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'Where does the graph of $R(x) = \dfrac{x^2 - 4x}{x^2 - 4}$ cross its horizontal asymptote?'
  choices: ['It never crosses', 'At $x = 0$', 'At $x = 4$', 'At $x = 1$']
  answer: 3
  explanation: |-
    The horizontal asymptote is $y = 1$. Solve $\frac{x^2 - 4x}{x^2 - 4} = 1$: $x^2 - 4x = x^2 - 4$, so $-4x = -4$ and $x = 1$. The graph passes through $(1, 1)$.
- id: pc-q-1209
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'Can a rational function have both a horizontal asymptote and a slant asymptote?'
  choices: ['No; the degree comparison allows at most one of them', 'Yes, always', 'Yes, when the degrees are equal', 'Only when it has a hole']
  answer: 0
  explanation: |-
    A horizontal asymptote needs $\deg p \le \deg q$; a slant asymptote needs $\deg p = \deg q + 1$. Both cannot hold.
- id: pc-q-1210
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'Since $R(x) = x + 2 - \dfrac{1}{x + 1}$, where is the graph relative to its slant asymptote for large positive $x$?'
  choices: ['Above it', 'Below it', 'On it', 'It crosses it repeatedly']
  answer: 1
  explanation: |-
    For large positive $x$, $\frac{1}{x+1}$ is a small positive number, so $R(x)$ is slightly less than $x + 2$: just below the asymptote.
- id: pc-q-1211
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'How many vertical asymptotes does $R(x) = \dfrac{x + 3}{x^2(x - 5)}$ have?'
  choices: ['3', '1', '2', '0']
  answer: 2
  explanation: |-
    The distinct zeros of the denominator are 0 and 5, and neither cancels. Two vertical asymptotes, $x = 0$ and $x = 5$. (The squared factor counts once; near 0 both sides go the same direction.)
- id: pc-q-1212
  lesson: pc-rational-graphs
  topic: Rational functions
  stem: 'What is the slant asymptote of $R(x) = \dfrac{x^2}{x - 1}$?'
  choices: ['$y = x - 1$', '$y = x$', '$y = x + 1$', 'There is none']
  answer: 2
  explanation: |-
    Synthetic division by 1 on $1, 0, 0$: $1, 1$, remainder 1. So $R(x) = x + 1 + \frac{1}{x - 1}$, slant asymptote $y = x + 1$.

- id: pc-q-1301
  lesson: pc-inequalities
  module_quiz: true
  topic: Polynomial and rational inequalities
  stem: 'Solve $x^2 - 2x - 15 \le 0$.'
  choices: ['$(-\infty, -3] \cup [5, \infty)$', '$[-5, 3]$', '$(-3, 5)$', '$[-3, 5]$']
  answer: 3
  explanation: |-
    $(x - 5)(x + 3) \le 0$. The parabola opens up, so it is $\le 0$ between its zeros, endpoints included: $[-3, 5]$.
- id: pc-q-1302
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Solve $x^3 - 4x \ge 0$.'
  choices: ['$[-2, 0] \cup [2, \infty)$', '$[2, \infty)$', '$(-\infty, -2] \cup [0, 2]$', '$[-2, 2]$']
  answer: 0
  explanation: |-
    $x(x - 2)(x + 2) \ge 0$. Critical values $-2, 0, 2$. Signs from the left: $-, +, -, +$. Keep the $+$ intervals with endpoints: $[-2, 0] \cup [2, \infty)$. Dividing both sides by $x$ to get $x^2 \ge 4$ loses the interval $[-2, 0]$.
- id: pc-q-1303
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Solve $\dfrac{x - 1}{x + 2} < 0$.'
  choices: ['$(-\infty, -2) \cup (1, \infty)$', '$(-2, 1)$', '$[-2, 1]$', '$(-2, 1]$']
  answer: 1
  explanation: |-
    Critical values $-2$ and $1$. Test $x = 0$: $\frac{-1}{2} < 0$ ✓. The outer intervals are positive. Strict inequality and a denominator zero: both endpoints excluded, $(-2, 1)$.
- id: pc-q-1304
  lesson: pc-inequalities
  module_quiz: true
  topic: Polynomial and rational inequalities
  stem: 'Solve $\dfrac{x + 4}{x - 1} \le 3$.'
  choices: ['$(-\infty, \tfrac72]$', '$(1, \tfrac72]$', '$(-\infty, 1) \cup [\tfrac72, \infty)$', '$(-\infty, 1] \cup [\tfrac72, \infty)$']
  answer: 2
  explanation: |-
    $\frac{x + 4}{x - 1} - 3 = \frac{7 - 2x}{x - 1} \le 0$. Critical values $1$ and $\frac72$. Signs: $x = 0$ gives $-7 < 0$ ✓; $x = 2$ gives $3 > 0$; $x = 4$ gives $-\frac13 < 0$ ✓. Include $\frac72$ (numerator zero), exclude 1. Multiplying by $x - 1$ gives the wrong answer $x \ge \frac72$ only.
- id: pc-q-1305
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Why shouldn''t you solve $\dfrac{x + 1}{x - 3} \ge 2$ by multiplying both sides by $x - 3$?'
  choices: ['Because $x - 3$ might be negative, which would reverse the inequality', 'Because it creates a quadratic', 'Because you can only multiply by constants in an equation', 'Because $x - 3$ is never zero']
  answer: 0
  explanation: |-
    Multiplying by a negative number flips the inequality, and the sign of $x - 3$ depends on $x$. Subtracting 2 and using a sign chart avoids the problem.
- id: pc-q-1306
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Solve $(x + 3)^2(x - 1) < 0$.'
  choices: ['$(-3, 1)$', '$(-\infty, 1)$', '$(-\infty, -3) \cup (-3, 1)$', '$(-\infty, -3)$']
  answer: 2
  explanation: |-
    $(x + 3)^2 \ge 0$, so the sign is that of $x - 1$, negative for $x < 1$, except that the product is 0 (not $< 0$) at $x = -3$. Remove $-3$: $(-\infty, -3) \cup (-3, 1)$.
- id: pc-q-1307
  lesson: pc-inequalities
  module_quiz: true
  topic: Polynomial and rational inequalities
  stem: 'What is the domain of $f(x) = \sqrt{x^2 - 9}$?'
  choices: ['$[-3, 3]$', '$[3, \infty)$', '$(-\infty, -3) \cup (3, \infty)$', '$(-\infty, -3] \cup [3, \infty)$']
  answer: 3
  explanation: |-
    Need $x^2 - 9 \ge 0$, i.e. $(x - 3)(x + 3) \ge 0$: outside the zeros, endpoints included.
- id: pc-q-1308
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'What is the solution set of $x^2 + 4 \le 0$?'
  choices: ['$[-2, 2]$', 'All real numbers', 'No real numbers', '$\{-2, 2\}$']
  answer: 2
  explanation: |-
    $x^2 + 4 \ge 4$ for every real $x$, so it is never $\le 0$. The solution set is empty.
- id: pc-q-1309
  lesson: pc-inequalities
  module_quiz: true
  topic: Polynomial and rational inequalities
  stem: 'A student solves $\dfrac{2x}{x - 1} > 1$ by multiplying by $x - 1$ to get $2x > x - 1$, so $x > -1$. What is the correct solution?'
  choices: ['$x > -1$', '$(-1, 1)$', '$(1, \infty)$', '$(-\infty, -1) \cup (1, \infty)$']
  answer: 3
  explanation: |-
    $\frac{2x}{x - 1} - 1 = \frac{x + 1}{x - 1} > 0$. Critical values $-1, 1$; positive outside them: $(-\infty, -1) \cup (1, \infty)$. For example $x = 0$ satisfies $x > -1$ but gives $\frac{0}{-1} = 0$, which is not $> 1$.
- id: pc-q-1310
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Profit is $P(x) = -x^2 + 10x - 16$ thousand dollars when $x$ thousand units are sold. For which $x$ is the profit at least 5 thousand dollars?'
  choices: ['$2 \le x \le 8$', '$3 \le x \le 7$', '$x \le 3$ or $x \ge 7$', '$x \ge 7$']
  answer: 1
  explanation: |-
    $-x^2 + 10x - 16 \ge 5 \iff x^2 - 10x + 21 \le 0 \iff (x - 3)(x - 7) \le 0$, so $3 \le x \le 7$. $[2, 8]$ is where profit is $\ge 0$.
- id: pc-q-1311
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'A ball''s height is $h(t) = -16t^2 + 64t$ feet. During what time interval is it higher than 48 feet?'
  choices: ['$0 < t < 4$', '$t > 3$', '$1 < t < 3$', '$2 < t < 4$']
  answer: 2
  explanation: |-
    $-16t^2 + 64t > 48 \iff t^2 - 4t + 3 < 0 \iff (t - 1)(t - 3) < 0$, so $1 < t < 3$.
- id: pc-q-1312
  lesson: pc-inequalities
  topic: Polynomial and rational inequalities
  stem: 'Solve $x^4 - 5x^2 + 4 < 0$.'
  choices: ['$(-2, -1) \cup (1, 2)$', '$(-1, 1)$', '$(1, 4)$', '$(-2, 2)$']
  answer: 0
  explanation: |-
    $(x^2 - 1)(x^2 - 4) = (x - 1)(x + 1)(x - 2)(x + 2) < 0$. Critical values $-2, -1, 1, 2$; signs from the left $+, -, +, -, +$. Negative on $(-2, -1) \cup (1, 2)$. ($(1, 4)$ solves the inequality for $x^2$, not $x$.)
