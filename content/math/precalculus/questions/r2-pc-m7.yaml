# Round 2, module pc-m7: new question types for the core lessons (q) and the honors lessons (h).
# ---------- Lesson 28: Parabolas ----------
- id: pc-m7-r2-q01
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  type: label
  stem: 'Name the numbered parts of this parabola.'
  image: {src: images/pc-m7-parabola-parts-blank.svg, alt: 'A parabola opening upward with five numbered parts: a point inside the curve on its vertical center line, a dashed horizontal line below the curve, the lowest point of the curve, the dashed vertical center line itself, and a green horizontal chord through the inner point. A red point P on the curve is joined by equal segments to the inner point and straight down to the dashed line.'}
  labels:
    - {x: 50.0, y: 59.1, text: Focus}
    - {x: 11.4, y: 81.3, text: Directrix}
    - {x: 50.0, y: 70.2, text: Vertex}
    - {x: 50.0, y: 11.6, text: Axis of symmetry}
    - {x: 39.9, y: 59.1, text: Focal width (latus rectum)}
  distractors: [Asymptote, Co-vertex]
  explanation: |-
    The focus (1) is inside the curve and the directrix (2) is the line on the other side; every point P is the same distance from both, which is what the two equal red segments show. The vertex (3) is halfway between them, on the axis of symmetry (4). The chord through the focus parallel to the directrix (5) is the focal width, of length $|4p|$. Asymptotes belong to hyperbolas and co-vertices to ellipses.
- id: pc-m7-r2-q02
  lesson: pc-parabolas
  topic: Parabolas
  type: text
  stem: 'The parabola $(x - 2)^2 = 12(y + 1)$ has $p =$ ___, and its directrix is the line $y =$ ___. Give only the numbers.'
  accept:
    - ['3']
    - ['-4']
  explanation: |-
    $4p = 12$, so $p = 3$. The vertex is $(2, -1)$ and the parabola opens up, so the directrix is $p$ units below the vertex: $y = -1 - 3 = -4$. (The focus is $p$ units above, at $(2, 2)$.)
- id: pc-m7-r2-q03
  lesson: pc-parabolas
  topic: Parabolas
  type: order
  stem: 'Put the steps for finding the focus of $y^2 - 4y - 8x + 20 = 0$ in order.'
  items:
    - 'Keep the $y$ terms on the left: $y^2 - 4y = 8x - 20$'
    - 'Add 4 to both sides: $(y - 2)^2 = 8x - 16$'
    - 'Factor the right side: $(y - 2)^2 = 8(x - 2)$'
    - 'Read the vertex $(2, 2)$ and $p = 2$'
    - 'Move $p$ units in the opening direction: focus $(4, 2)$'
  explanation: |-
    Only $y$ is squared, so complete the square in $y$ alone: move everything else right, add $\left(\tfrac{-4}{2}\right)^2 = 4$ to both sides, then factor the 8 out of $8x - 16$ to show $x - h$. That gives vertex $(2, 2)$ and $4p = 8$, $p = 2 > 0$, so the parabola opens right and the focus is $(2 + 2, 2) = (4, 2)$.
- id: pc-m7-r2-q04
  lesson: pc-parabolas
  topic: Parabolas
  stem: 'Which of these parabolas open to the left or to the right? Select all that apply.'
  choices: ['$y^2 = -8x$', '$(y - 1)^2 = 3(x + 2)$', '$x^2 = -6y$', '$x^2 + 4x - y = 0$']
  answer: [0, 1]
  explanation: |-
    A parabola opens left or right when $y$ is the squared variable: $y^2 = -8x$ opens left ($p = -2$) and $(y - 1)^2 = 3(x + 2)$ opens right. In $x^2 = -6y$ and $x^2 + 4x - y = 0$ (which is $(x + 2)^2 = y + 4$), $x$ is squared, so they open down and up.
- id: pc-m7-r2-q05
  lesson: pc-parabolas
  module_quiz: true
  topic: Parabolas
  type: match
  stem: 'Match each parabola to the direction it opens.'
  pairs:
    - ['$x^2 = -5y$', Down]
    - ['$(y + 2)^2 = 7(x - 1)$', Right]
    - ['$y^2 = -2(x + 3)$', Left]
    - ['$(x - 4)^2 = y$', Up]
  distractors: [Toward the directrix]
  explanation: |-
    The squared variable decides the pair of directions ($x^2$: up or down; $y^2$: left or right) and the sign of $4p$ picks one: $-5 < 0$ down, $7 > 0$ right, $-2 < 0$ left, $1 > 0$ up. A parabola always opens away from its directrix.
- id: pc-m7-r2-q06
  lesson: pc-parabolas
  topic: Parabolas
  type: label
  stem: 'Each picture shows a double cone cut by a plane, seen edge-on. Name the conic each numbered plane makes.'
  image: {src: images/pc-m7-cone-slices-blank.svg, alt: 'Four side views of a double cone, each cut by a numbered red plane seen edge-on. Plane 1 is horizontal and cuts only the lower cone. Plane 2 is slightly tilted and cuts only the lower cone. Plane 3 is parallel to one side of the cone. Plane 4 is vertical and cuts both the upper and lower cones.'}
  labels:
    - {x: 37.0, y: 32.5, text: Circle}
    - {x: 86.6, y: 37.8, text: Ellipse}
    - {x: 31.4, y: 71.0, text: Parabola}
    - {x: 79.4, y: 56.4, text: Hyperbola}
  distractors: [Spiral, Cardioid]
  explanation: |-
    A plane perpendicular to the axis (1) cuts a circle. Tilting it a little (2) still cuts all the way across one cone: an ellipse. Tilting it until it is parallel to a side of the cone (3) gives a parabola, which never closes. Steeper than that (4), the plane cuts both cones and the slice has two branches: a hyperbola.
# ---------- Lesson 29: Ellipses ----------
- id: pc-m7-r2-q07
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  type: label
  stem: 'Name the numbered parts of this ellipse.'
  image: {src: images/pc-m7-ellipse-parts-blank.svg, alt: 'A horizontal ellipse with six numbered parts: the middle point, a red point on the long horizontal axis left of the middle, the right end of the long axis, the top end of the short vertical axis, the solid horizontal segment right of the middle, and the dashed vertical segment below the middle. Red segments join the top point to the two red points.'}
  labels:
    - {x: 50.0, y: 50.0, text: Center}
    - {x: 16.5, y: 50.0, text: Focus}
    - {x: 91.9, y: 50.0, text: Vertex}
    - {x: 50.0, y: 11.0, text: Co-vertex}
    - {x: 71.8, y: 50.0, text: Major axis}
    - {x: 50.0, y: 73.4, text: Minor axis}
  distractors: [Directrix, Asymptote]
  explanation: |-
    The center (1) is the midpoint of everything. The foci (2) lie on the long major axis (5), inside the ellipse; the vertices (3) are the ends of the major axis, and the co-vertices (4) are the ends of the short minor axis (6). The red segments from a co-vertex to the foci each have length $a$, which is why $c^2 = a^2 - b^2$. Asymptotes belong to hyperbolas.
- id: pc-m7-r2-q08
  lesson: pc-ellipses
  topic: Ellipses
  type: text
  stem: 'For the ellipse $\dfrac{x^2}{169} + \dfrac{y^2}{25} = 1$, the foci are $c =$ ___ units from the center, and the eccentricity is $e =$ ___ (as a fraction).'
  accept:
    - ['12']
    - ['12/13']
  explanation: |-
    $a^2 = 169$ (the larger denominator) and $b^2 = 25$, so $c^2 = 169 - 25 = 144$ and $c = 12$. The eccentricity is $e = \frac{c}{a} = \frac{12}{13}$, close to 1, so this ellipse is long and thin.
- id: pc-m7-r2-q09
  lesson: pc-ellipses
  topic: Ellipses
  type: order
  stem: 'Put the steps for rewriting $4x^2 + 9y^2 - 8x + 36y + 4 = 0$ in standard form in order.'
  items:
    - 'Group: $(4x^2 - 8x) + (9y^2 + 36y) = -4$'
    - 'Factor: $4(x^2 - 2x) + 9(y^2 + 4y) = -4$'
    - 'Complete the squares: $4(x - 1)^2 + 9(y + 2)^2 = -4 + 4 + 36$'
    - 'Divide by 36: $\dfrac{(x - 1)^2}{9} + \dfrac{(y + 2)^2}{4} = 1$'
    - 'Read the center $(1, -2)$, $a = 3$ and $b = 2$'
  explanation: |-
    Group like variables and move the constant, factor out the leading coefficients, then complete each square. Adding 1 inside $4(\ )$ really adds 4, and adding 4 inside $9(\ )$ adds 36, so the right side becomes $36$. Dividing by 36 makes the right side 1, and the larger denominator, 9, is $a^2$: a horizontal ellipse centered at $(1, -2)$.
- id: pc-m7-r2-q10
  lesson: pc-ellipses
  module_quiz: true
  topic: Ellipses
  stem: 'Which statements are true for every ellipse $\dfrac{(x - h)^2}{a^2} + \dfrac{(y - k)^2}{b^2} = 1$ with $a > b > 0$? Select all that apply.'
  choices: ['The foci lie on the major axis.', '$c^2 = a^2 - b^2$, where $c$ is the center-to-focus distance.', 'Its eccentricity is greater than 1.', 'The co-vertices are $a$ units from the center.']
  answer: [0, 1]
  explanation: |-
    The foci are on the major axis, $c$ units from the center, with $c^2 = a^2 - b^2$. An ellipse has $0 \le e < 1$ (eccentricity above 1 is a hyperbola), and the co-vertices are $b$ units from the center, not $a$.
- id: pc-m7-r2-q11
  lesson: pc-ellipses
  topic: Ellipses
  type: match
  stem: 'Match each equation to its graph.'
  pairs:
    - ['$\dfrac{x^2}{16} + \dfrac{y^2}{9} = 1$', Ellipse with a horizontal major axis]
    - ['$\dfrac{x^2}{9} + \dfrac{y^2}{16} = 1$', Ellipse with a vertical major axis]
    - ['$x^2 + y^2 = 16$', Circle]
    - ['$4x^2 + 9y^2 = 36$', Ellipse with a horizontal major axis]
  distractors: [Parabola]
  explanation: |-
    The larger denominator is $a^2$ and sits under the major-axis variable: 16 under $x^2$ is horizontal, 16 under $y^2$ is vertical. Equal coefficients give a circle. $4x^2 + 9y^2 = 36$ becomes $\frac{x^2}{9} + \frac{y^2}{4} = 1$ after dividing by 36, so the larger denominator is under $x^2$: horizontal.
# ---------- Lesson 30: Hyperbolas and identifying conics ----------
- id: pc-m7-r2-q12
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Hyperbolas
  type: label
  stem: 'Name the numbered parts of this hyperbola.'
  image: {src: images/pc-m7-hyperbola-parts-blank.svg, alt: 'A hyperbola opening left and right, drawn with a shaded rectangle in the middle and two dashed lines through the rectangle''s corners. Six numbered parts: the point where the right branch touches the rectangle, a red point farther right on the same horizontal line, the middle point, a point on one dashed line inside the rectangle, the middle of the rectangle''s top side, and the red segment left of the middle joining the two branches.'}
  labels:
    - {x: 64.8, y: 50.0, text: Vertex}
    - {x: 76.8, y: 50.0, text: Focus}
    - {x: 50.0, y: 50.0, text: Center}
    - {x: 57.4, y: 34.3, text: Asymptote}
    - {x: 50.0, y: 18.6, text: Central rectangle}
    - {x: 42.6, y: 50.0, text: Transverse axis}
  distractors: [Directrix, Focal width]
  explanation: |-
    Each branch starts at a vertex (1); the foci (2) are farther from the center (3) than the vertices, since $c^2 = a^2 + b^2$. The transverse axis (6) joins the vertices. The central rectangle (5), $2a$ by $2b$, has diagonals that extend to the asymptotes (4), the lines the branches approach.
- id: pc-m7-r2-q13
  lesson: pc-hyperbolas
  topic: Hyperbolas
  type: text
  stem: 'The hyperbola $\dfrac{x^2}{36} - \dfrac{y^2}{64} = 1$ has foci $(\pm c, 0)$ with $c =$ ___, and asymptotes $y = \pm mx$ with $m =$ ___ (as a fraction).'
  accept:
    - ['10']
    - ['4/3']
  explanation: |-
    $a = 6$ and $b = 8$, so $c^2 = a^2 + b^2 = 36 + 64 = 100$ and $c = 10$. It opens left and right, so the asymptote slopes are $\pm\frac{b}{a} = \pm\frac{8}{6} = \pm\frac43$.
- id: pc-m7-r2-q14
  lesson: pc-hyperbolas
  topic: Identifying conics
  stem: 'Which equations have a hyperbola as their graph? Select all that apply.'
  choices: ['$9x^2 - 4y^2 = 36$', '$xy = 4$', '$3x^2 + 2y^2 - 6 = 0$', '$-x^2 + y^2 + 2x = 5$']
  answer: [0, 1, 3]
  explanation: |-
    $9x^2 - 4y^2 = 36$ has squared terms of opposite signs: a hyperbola. $xy = 4$ has $B^2 - 4AC = 1 > 0$: a hyperbola (the rotated graph of $y = \frac4x$). $-x^2 + y^2 + 2x = 5$ completes to $y^2 - (x - 1)^2 = 4$: a hyperbola opening up and down. $3x^2 + 2y^2 = 6$ has same-sign squares: an ellipse.
- id: pc-m7-r2-q15
  lesson: pc-hyperbolas
  module_quiz: true
  topic: Identifying conics
  type: match
  stem: 'Use the discriminant (and the coefficients) to match each equation to its conic.'
  pairs:
    - ['$x^2 + xy + y^2 = 3$', Ellipse]
    - ['$x^2 + 2xy + y^2 + x = 0$', Parabola]
    - ['$x^2 + 3xy + y^2 = 5$', Hyperbola]
    - ['$2x^2 + 2y^2 - 8 = 0$', Circle]
  distractors: [Pair of parallel lines]
  explanation: |-
    $B^2 - 4AC$: $1 - 4 = -3 < 0$, ellipse; $4 - 4 = 0$, parabola; $9 - 4 = 5 > 0$, hyperbola. The last has no $xy$ term and equal squared coefficients, so it is the circle $x^2 + y^2 = 4$.
- id: pc-m7-r2-q16
  lesson: pc-hyperbolas
  topic: Identifying conics
  type: order
  stem: 'Put these conics in order of eccentricity, from smallest to largest.'
  items:
    - '$x^2 + y^2 = 9$'
    - '$\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$'
    - '$\dfrac{x^2}{4} + y^2 = 1$'
    - '$y^2 = 8x$'
    - '$\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$'
  explanation: |-
    Circle: $e = 0$. First ellipse: $c = 3$, $e = \frac35 = 0.6$. Second ellipse: $c = \sqrt{4 - 1} = \sqrt3$, $e = \frac{\sqrt3}{2} \approx 0.87$. Every parabola has $e = 1$. Hyperbola: $c = 5$, $e = \frac53 \approx 1.67$.
# ---------- Lesson 31: Parametric equations ----------
- id: pc-m7-r2-q17
  lesson: pc-parametric
  topic: Parametric equations
  type: text
  stem: 'Eliminating the parameter from $x = 2t$, $y = t^2 + 3$ gives $y = \dfrac{x^2}{k} + 3$. What is $k$? Give only the number.'
  accept: ['4']
  explanation: |-
    Solve the first equation for $t$: $t = \frac{x}{2}$. Substitute: $y = \left(\frac{x}{2}\right)^2 + 3 = \frac{x^2}{4} + 3$, so $k = 4$.
- id: pc-m7-r2-q18
  lesson: pc-parametric
  topic: Parametric equations
  type: order
  stem: 'For $x = \cos t$, $y = \sin t$, put these points in the order they are reached as $t$ increases from 0 to $2\pi$.'
  items: ['$(1, 0)$', '$(0, 1)$', '$(-1, 0)$', '$(0, -1)$']
  explanation: |-
    At $t = 0, \frac{\pi}{2}, \pi, \frac{3\pi}{2}$ the point is $(1, 0)$, $(0, 1)$, $(-1, 0)$, $(0, -1)$: the unit circle traced counterclockwise.
- id: pc-m7-r2-q19
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'Which parametrizations trace the whole circle $x^2 + y^2 = 4$ exactly once, counterclockwise, starting at $(2, 0)$? Select all that apply.'
  choices: ['$x = 2\cos t$, $y = 2\sin t$, $0 \le t \le 2\pi$', '$x = 2\cos 2t$, $y = 2\sin 2t$, $0 \le t \le \pi$', '$x = 2\cos t$, $y = -2\sin t$, $0 \le t \le 2\pi$', '$x = 2\sin t$, $y = 2\cos t$, $0 \le t \le 2\pi$']
  answer: [0, 1]
  explanation: |-
    The first is the standard counterclockwise circle. The second goes twice as fast, so $0 \le t \le \pi$ is exactly one lap, also counterclockwise from $(2, 0)$. The third starts at $(2, 0)$ but goes clockwise ($y$ is negative just after $t = 0$). The fourth starts at $(0, 2)$ and goes clockwise.
- id: pc-m7-r2-q20
  lesson: pc-parametric
  module_quiz: true
  topic: Parametric equations
  type: match
  stem: 'Match each parametrization to the curve it traces.'
  pairs:
    - ['$x = t$, $y = t^2$', Parabola]
    - ['$x = 3\cos t$, $y = 2\sin t$', Ellipse]
    - ['$x = 1 + 2t$, $y = 3 - t$', Line]
    - ['$x = 5\cos t$, $y = 5\sin t$', Circle]
    - ['$x = \sec t$, $y = \tan t$', Hyperbola]
  distractors: [Spiral]
  explanation: |-
    Eliminate the parameter: $y = x^2$; $\frac{x^2}{9} + \frac{y^2}{4} = 1$; $t = \frac{x - 1}{2}$ gives the line $y = 3 - \frac{x - 1}{2}$; $x^2 + y^2 = 25$; and $\sec^2 t - \tan^2 t = 1$ gives $x^2 - y^2 = 1$.
- id: pc-m7-r2-q21
  lesson: pc-parametric
  topic: Parametric equations
  stem: 'The segment $x = 1 + 4t$, $y = 2 - 6t$, $0 \le t \le 1$, runs from $(1, 2)$ to $(5, -4)$. Where is the point at $t = \tfrac34$?'
  choices: ['$(3, -1)$', '$(4, -4.5)$', '$(4, -2.5)$', '$(-2.5, 4)$']
  answer: 2
  explanation: |-
    $x = 1 + 4\left(\tfrac34\right) = 4$ and $y = 2 - 6\left(\tfrac34\right) = -2.5$. It is three quarters of the way along the segment. $(3, -1)$ is the midpoint ($t = \frac12$), and $(-2.5, 4)$ swaps the coordinates.
# ---------- Lesson 32: Polar coordinates ----------
- id: pc-m7-r2-q22
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  type: label
  stem: 'Name the numbered polar graphs. In each panel the pole is where the axes cross.'
  image: {src: images/pc-m7-polar-gallery-blank.svg, alt: 'Six small polar graphs, each numbered. 1: a circle passing through the pole, to its right. 2: a heart shape with a dimple at the pole. 3: a large loop with a small loop inside it. 4: a flower with three petals. 5: a flower with four petals. 6: a curve winding outward from the pole in two turns.'}
  labels:
    - {x: 23.3, y: 16.5, text: Circle through the pole}
    - {x: 58.9, y: 21.7, text: Cardioid}
    - {x: 96.7, y: 21.7, text: Limaçon with an inner loop}
    - {x: 25.6, y: 71.7, text: Three-petal rose}
    - {x: 58.9, y: 71.7, text: Four-petal rose}
    - {x: 92.6, y: 71.7, text: Spiral}
  distractors: [Eight-petal rose, Line through the pole]
  explanation: |-
    1 is $r = 2\cos\theta$, a circle through the pole. 2 is $r = 1 + \cos\theta$, a cardioid ($|a| = |b|$, so it just touches the pole). 3 is $r = 1 + 2\cos\theta$, a limaçon whose $r$ turns negative for part of the sweep, making the inner loop. 4 and 5 are $r = 2\cos 3\theta$ (odd $n = 3$: 3 petals) and $r = 2\cos 2\theta$ (even $n = 2$: 4 petals). 6 is the spiral $r = \frac{\theta}{6}$.
- id: pc-m7-r2-q23
  lesson: pc-polar
  topic: Polar coordinates
  type: text
  stem: 'The rectangular point $(-5, 12)$ has polar distance $r =$ ___ (with $r > 0$), and its angle $\theta$ is in Quadrant ___ (write I, II, III or IV).'
  accept:
    - ['13']
    - [II, '2', two, quadrant II]
  explanation: |-
    $r = \sqrt{(-5)^2 + 12^2} = \sqrt{169} = 13$. The point has $x < 0$ and $y > 0$, so it is in Quadrant II, and $\theta = \tan^{-1}\left(-\frac{12}{5}\right) + \pi \approx 1.97$ (not the calculator's Quadrant IV value).
- id: pc-m7-r2-q24
  lesson: pc-polar
  topic: Polar coordinates
  type: order
  stem: 'Put the steps for converting $r = 6\sin\theta$ to rectangular form in order.'
  items:
    - 'Multiply both sides by $r$: $r^2 = 6r\sin\theta$'
    - 'Substitute: $x^2 + y^2 = 6y$'
    - 'Complete the square: $x^2 + (y - 3)^2 = 9$'
    - 'Read the circle: center $(0, 3)$, radius 3'
  explanation: |-
    Multiplying by $r$ creates $r^2$ and $r\sin\theta$, which become $x^2 + y^2$ and $y$. Moving $6y$ left and completing the square in $y$ shows a circle of radius 3 centered at $(0, 3)$.
- id: pc-m7-r2-q25
  lesson: pc-polar
  module_quiz: true
  topic: Polar coordinates
  stem: 'Which polar pairs name the same point as $\left(2, \tfrac{\pi}{3}\right)$? Select all that apply.'
  choices: ['$\left(2, \tfrac{7\pi}{3}\right)$', '$\left(-2, \tfrac{4\pi}{3}\right)$', '$\left(-2, \tfrac{\pi}{3}\right)$', '$\left(2, -\tfrac{\pi}{3}\right)$']
  answer: [0, 1]
  explanation: |-
    Adding $2\pi$ to the angle gives the same point: $\frac{\pi}{3} + 2\pi = \frac{7\pi}{3}$. A negative $r$ points the opposite way, so $\left(-2, \frac{4\pi}{3}\right)$ is 2 units in direction $\frac{4\pi}{3} - \pi = \frac{\pi}{3}$: the same point. $\left(-2, \frac{\pi}{3}\right)$ is the opposite point, and $\left(2, -\frac{\pi}{3}\right)$ is its reflection across the polar axis.
- id: pc-m7-r2-q26
  lesson: pc-polar
  topic: Polar coordinates
  type: match
  stem: 'Match each polar equation to its graph.'
  pairs:
    - ['$r = 4$', Circle centered at the pole]
    - ['$\theta = \tfrac{\pi}{6}$', Line through the pole]
    - ['$r = 3 + 3\sin\theta$', Cardioid]
    - ['$r = 5\cos 4\theta$', Rose with 8 petals]
    - ['$r = 2 + 4\cos\theta$', Limaçon with an inner loop]
  distractors: [Rose with 4 petals]
  explanation: |-
    $r = 4$ keeps the same distance in every direction; $\theta = \frac{\pi}{6}$ keeps the same direction. $r = 3 + 3\sin\theta$ has $|a| = |b|$: a cardioid. $r = 5\cos 4\theta$ has even $n = 4$, so $2n = 8$ petals. $r = 2 + 4\cos\theta$ has $|a| < |b|$, so $r$ is negative for some angles and the limaçon has an inner loop.
# ---------- Lesson 33: Polar equations of conics ----------
- id: pc-m7-r2-q27
  lesson: pc-polar-conics
  topic: Polar conics
  type: label
  stem: 'A planet orbits the Sun. Name the numbered parts of the orbit.'
  image: {src: images/pc-m7-orbit-blank.svg, alt: 'An elliptical orbit with a yellow sun at one focus, right of the middle, and a green planet on the curve. Five numbered parts: the sun, the right end of the long axis, the left end of the long axis, the middle point of the ellipse, and a dashed vertical line to the right of the orbit.'}
  labels:
    - {x: 56.2, y: 50.0, text: Sun (at a focus)}
    - {x: 68.8, y: 50.0, text: Perihelion}
    - {x: 6.2, y: 50.0, text: Aphelion}
    - {x: 37.5, y: 50.0, text: Center}
    - {x: 89.6, y: 18.4, text: Directrix}
  distractors: [Empty focus, Asymptote]
  explanation: |-
    The Sun (1) is at a focus, not the center (4). The vertex nearest the Sun is the perihelion (2) and the far vertex is the aphelion (3). The directrix (5) that goes with the Sun's focus is the line on the perihelion side, outside the orbit. The empty focus is the point on the other side of the center, which is not numbered.
- id: pc-m7-r2-q28
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  type: text
  stem: 'For $r = \dfrac{12}{3 + 3\cos\theta}$, the eccentricity is $e =$ ___, and the directrix is the line $x =$ ___. Give only the numbers.'
  accept:
    - ['1']
    - ['4']
  explanation: |-
    Divide top and bottom by 3: $r = \dfrac{4}{1 + \cos\theta}$. So $e = 1$ (a parabola) and $ed = 4$, giving $d = 4$; "$+\cos\theta$" puts the directrix to the right, at $x = 4$.
- id: pc-m7-r2-q29
  lesson: pc-polar-conics
  module_quiz: true
  topic: Polar conics
  type: match
  stem: 'Match each polar equation to its conic.'
  pairs:
    - ['$r = \dfrac{8}{4 + 2\sin\theta}$', Ellipse]
    - ['$r = \dfrac{3}{1 - \cos\theta}$', Parabola]
    - ['$r = \dfrac{10}{2 + 5\cos\theta}$', Hyperbola]
    - ['$r = \dfrac{6}{5 - 3\cos\theta}$', Ellipse]
  distractors: [Circle]
  explanation: |-
    Make each denominator's constant 1 and read $e$: $\frac{2}{1 + \frac12\sin\theta}$ has $e = \frac12$; $\frac{3}{1 - \cos\theta}$ has $e = 1$; $\frac{5}{1 + \frac52\cos\theta}$ has $e = \frac52$; $\frac{6/5}{1 - \frac35\cos\theta}$ has $e = \frac35$. None has $e = 0$, so none is a circle.
- id: pc-m7-r2-q30
  lesson: pc-polar-conics
  topic: Polar conics
  stem: 'Which statements about $r = \dfrac{6}{1 - 2\sin\theta}$ are true? Select all that apply.'
  choices: ['It is a hyperbola.', 'Its directrix is $y = -3$.', 'Its directrix is $y = 3$.', 'Its eccentricity is $\tfrac12$.']
  answer: [0, 1]
  explanation: |-
    The constant is already 1, so $e = 2 > 1$: a hyperbola. $ed = 6$ gives $d = 3$, and "$-\sin\theta$" puts the directrix below the pole: $y = -3$.
- id: pc-m7-r2-q31
  lesson: pc-polar-conics
  topic: Polar conics
  type: order
  stem: 'Put the steps for reading $r = \dfrac{20}{4 + 5\cos\theta}$ in order.'
  items:
    - 'Divide top and bottom by 4: $r = \dfrac{5}{1 + \frac54\cos\theta}$'
    - 'Read $e = \frac54$: a hyperbola'
    - 'Find $d$ from $ed = 5$: $d = 4$'
    - 'Place the directrix $x = 4$, to the right of the pole'
  explanation: |-
    You can only read $e$ once the constant in the denominator is 1. Then $e$ gives the type, $d$ comes from the numerator $ed$, and the sign and trig function ($+\cos\theta$) put the directrix at $x = d = 4$.
# ---------- Honors: Rotation of axes ----------
- id: pc-m7-r2-h01
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'Which acute angle $\theta$ removes the $xy$ term from $x^2 + \sqrt3\,xy + 2y^2 = 5$?'
  choices: ['$60°$', '$30°$', '$15°$', '$120°$']
  answer: 0
  explanation: |-
    $\cot 2\theta = \frac{A - C}{B} = \frac{1 - 2}{\sqrt3} = -\frac{1}{\sqrt3}$. With $0° < 2\theta < 180°$, that means $2\theta = 120°$, so $\theta = 60°$. $120°$ is $2\theta$, not $\theta$; $30°$ comes from ignoring the minus sign.
- id: pc-m7-r2-h02
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'The axes are rotated counterclockwise by $\theta$. Which formulas give the old coordinates in terms of the new ones?'
  choices: ['$x = x''\cos\theta + y''\sin\theta$, $y = -x''\sin\theta + y''\cos\theta$', '$x = x''\sin\theta - y''\cos\theta$, $y = x''\cos\theta + y''\sin\theta$', '$x = x''\cos\theta - y''\sin\theta$, $y = -x''\sin\theta + y''\cos\theta$', '$x = x''\cos\theta - y''\sin\theta$, $y = x''\sin\theta + y''\cos\theta$']
  answer: 3
  explanation: |-
    From $x = r\cos\big((\varphi - \theta) + \theta\big)$ and $y = r\sin\big((\varphi - \theta) + \theta\big)$ with the sum formulas: $x = x'\cos\theta - y'\sin\theta$, $y = x'\sin\theta + y'\cos\theta$. The first choice is the reverse direction (new in terms of old).
- id: pc-m7-r2-h03
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  type: text
  stem: 'Rotating the axes by $30°$ turns $7x^2 - 6\sqrt3\,xy + 13y^2 = 16$ into $A''x''^2 + C''y''^2 = 16$. Find $A'' =$ ___ and $C'' =$ ___.'
  accept:
    - ['4']
    - ['16']
  explanation: |-
    $\cos^2 30° = \frac34$, $\sin^2 30° = \frac14$, $\sin 30°\cos 30° = \frac{\sqrt3}{4}$. $A' = 7\cdot\frac34 - 6\sqrt3\cdot\frac{\sqrt3}{4} + 13\cdot\frac14 = \frac{21 - 18 + 13}{4} = 4$ and $C' = 7\cdot\frac14 + 6\sqrt3\cdot\frac{\sqrt3}{4} + 13\cdot\frac34 = \frac{7 + 18 + 39}{4} = 16$. Check: $A' + C' = 20 = 7 + 13$. The ellipse is $\frac{x'^2}{4} + y'^2 = 1$.
- id: pc-m7-r2-h04
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'What does $3x^2 + 10xy + 3y^2 = 8$ become after the rotation that removes the $xy$ term (with $0° < \theta < 90°$)?'
  choices: ['$-2x''^2 + 8y''^2 = 8$', '$8x''^2 - 2y''^2 = 8$', '$8x''^2 + 2y''^2 = 8$', '$3x''^2 + 3y''^2 = 8$']
  answer: 1
  explanation: |-
    $A = C$, so $\theta = 45°$ and $\cos^2\theta = \sin^2\theta = \sin\theta\cos\theta = \frac12$. $A' = \frac32 + 5 + \frac32 = 8$, $C' = \frac32 - 5 + \frac32 = -2$. (Shortcut: $A' + C' = 6$ and $A'C' = 9 - 25 = -16$ give $8$ and $-2$; $B > 0$ makes $A'$ the larger.) The result is the hyperbola $x'^2 - \frac{y'^2}{4} = 1$.
- id: pc-m7-r2-h05
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'For $Ax^2 + Bxy + Cy^2 + Dx + Ey + F = 0$, which quantities are the same for every rotation of axes about the origin? Select all that apply.'
  choices: ['$A + C$', '$B^2 - 4AC$', '$F$', '$A - C$']
  answer: [0, 1, 2]
  explanation: |-
    $A' + C' = A + C$ and $B'^2 - 4A'C' = B^2 - 4AC$ are the two invariants, and $F' = F$ because a rotation about the origin does not move the origin. $A - C$ changes: in $5x^2 - 6xy + 5y^2 = 8$ it is 0, but after rotating $A' - C' = 2 - 8 = -6$.
- id: pc-m7-r2-h06
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  type: order
  stem: 'Put the steps for finding the vertices of a tilted conic $Ax^2 + Bxy + Cy^2 = F$ in order.'
  items:
    - 'Compute $\cot 2\theta = \frac{A - C}{B}$'
    - 'Find $\cos 2\theta$ with the same sign'
    - 'Use the half-angle formulas for $\cos\theta$ and $\sin\theta$'
    - 'Compute $A''$ and $C''$ and write the conic in $x''$, $y''$'
    - 'Rotate the vertices back with $x = x''\cos\theta - y''\sin\theta$, $y = x''\sin\theta + y''\cos\theta$'
  explanation: |-
    Each step needs the one before: the cotangent gives $\cos 2\theta$, which gives $\cos\theta$ and $\sin\theta$, which give the new coefficients. The vertices are easy to read only in the new coordinates, and then they are rotated back to $x$ and $y$.
- id: pc-m7-r2-h07
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'With $\theta = 45°$, the linear terms $4x - 4y$ become $D''x'' + E''y''$. What are $D''$ and $E''$?'
  choices: ['$D'' = 4\sqrt2$, $E'' = 0$', '$D'' = 0$, $E'' = 4\sqrt2$', '$D'' = 0$, $E'' = -4\sqrt2$', '$D'' = -4\sqrt2$, $E'' = 0$']
  answer: 2
  explanation: |-
    $D' = D\cos\theta + E\sin\theta = \frac{4 - 4}{\sqrt2} = 0$ and $E' = -D\sin\theta + E\cos\theta = \frac{-4 - 4}{\sqrt2} = -\frac{8}{\sqrt2} = -4\sqrt2$. Directly: $x - y = \frac{(x' - y') - (x' + y')}{\sqrt2} = -\sqrt2\,y'$, so $4x - 4y = -4\sqrt2\,y'$.
- id: pc-m7-r2-h08
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'Why does the sign of $B^2 - 4AC$ identify a (non-degenerate) conic even when it is tilted?'
  choices: ['Because $B^2 - 4AC$ equals the eccentricity of the conic', 'Because the $xy$ term never affects the shape of a conic', 'Because $B^2 - 4AC$ is always negative after a rotation', 'Because it is unchanged by rotation, and after the $xy$ term is removed it equals $-4A''C''$']
  answer: 3
  explanation: |-
    $B^2 - 4AC$ is an invariant. In the rotated coordinates $B' = 0$, so it equals $-4A'C'$: negative when $A'$ and $C'$ have the same sign (ellipse), zero when one is 0 (parabola), positive when they have opposite signs (hyperbola). It is not the eccentricity, and the $xy$ term does tilt the conic.
- id: pc-m7-r2-h09
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  type: match
  stem: 'Match each equation to the acute rotation angle that removes its $xy$ term.'
  pairs:
    - ['$x^2 + \sqrt3\,xy + 2y^2 = 5$', 60°]
    - ['$7x^2 - 6\sqrt3\,xy + 13y^2 = 16$', 30°]
    - ['$3x^2 + 10xy + 3y^2 = 8$', 45°]
    - ['$8x^2 + 12xy + 17y^2 = 20$', About 63.4°]
  distractors: [90°]
  explanation: |-
    $\cot 2\theta = \frac{A - C}{B}$: $-\frac{1}{\sqrt3}$ gives $2\theta = 120°$; $\frac{-6}{-6\sqrt3} = \frac{1}{\sqrt3}$ gives $2\theta = 60°$; $0$ gives $2\theta = 90°$; $-\frac34$ gives $\cos 2\theta = -\frac35$ and $\theta = \tan^{-1} 2 \approx 63.4°$. An acute $\theta$ is never $90°$.
- id: pc-m7-r2-h10
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'After a $30°$ rotation of axes, a parabola''s vertex is at $(x'', y'') = (2, 0)$. Where is it in the original $xy$-coordinates?'
  choices: ['$(\sqrt3, 1)$', '$(1, \sqrt3)$', '$(2, 0)$', '$(\sqrt3, -1)$']
  answer: 0
  explanation: |-
    $x = x'\cos 30° - y'\sin 30° = 2\cdot\frac{\sqrt3}{2} = \sqrt3$ and $y = x'\sin 30° + y'\cos 30° = 2\cdot\frac12 = 1$. The point is 2 units out along the $x'$-axis, which points $30°$ above the $x$-axis. $(1, \sqrt3)$ would be a $60°$ direction.
- id: pc-m7-r2-h11
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'Use the invariants to find the new coefficients for $2x^2 + 4xy + 5y^2 = 6$ (acute rotation angle).'
  choices: ['$A'' = 1$, $C'' = 6$', '$A'' = 6$, $C'' = 1$', '$A'' = 2$, $C'' = 5$', '$A'' = 7$, $C'' = 6$']
  answer: 1
  explanation: |-
    $A' + C' = 2 + 5 = 7$ and $A'C' = AC - \frac{B^2}{4} = 10 - 4 = 6$, so they are the roots of $\lambda^2 - 7\lambda + 6 = 0$: 6 and 1. Since $B = 4 > 0$, $A'$ is the larger: $A' = 6$, $C' = 1$, giving the ellipse $x'^2 + \frac{y'^2}{6} = 1$. (Check: $\cot 2\theta = -\frac34$, $\cos^2\theta = \frac15$, and $A' = \frac25 + \frac85 + 4 = 6$.)
- id: pc-m7-r2-h12
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  stem: 'The equation $x^2 - 2xy + y^2 = 0$ has $B^2 - 4AC = 0$. What is its graph?'
  choices: ['A parabola opening along the line $y = x$', 'The single point $(0, 0)$', 'The line $y = x$', 'Two crossing lines']
  answer: 2
  explanation: |-
    $x^2 - 2xy + y^2 = (x - y)^2 = 0$ exactly when $y = x$: a degenerate conic, a single line. A zero discriminant means "parabola" only when the conic is not degenerate. (Rotating by $45°$ gives $2y'^2 = 0$, the $x'$-axis.)
- id: pc-m7-r2-h13
  lesson: pc-m7-h-rotation
  topic: Rotation of axes
  type: text
  stem: 'Rotating by $45°$ turns $xy = 8$ into $\dfrac{x''^2}{k} - \dfrac{y''^2}{k} = 1$. What is $k$? Give only the number.'
  accept: ['16']
  explanation: |-
    With $x = \frac{x' - y'}{\sqrt2}$ and $y = \frac{x' + y'}{\sqrt2}$, $xy = \frac{x'^2 - y'^2}{2}$. So $\frac{x'^2 - y'^2}{2} = 8$, that is $\frac{x'^2}{16} - \frac{y'^2}{16} = 1$, and $k = 16$.
# ---------- Honors: Dandelin spheres and reflection ----------
- id: pc-m7-r2-h14
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  type: label
  stem: 'Name the numbered parts of this Dandelin-sphere picture.'
  image: {src: images/pc-m7-dandelin-blank.svg, alt: 'A side view of a cone with its point at the top, cut by a tilted red line. Five numbered parts: the point at the top of the cone, a small circle inside the cone above the red line, a large circle below the red line, the red line itself, and the point where the small circle touches the red line.'}
  labels:
    - {x: 50.0, y: 7.4, text: Apex of the cone}
    - {x: 50.0, y: 35.3, text: Small Dandelin sphere}
    - {x: 50.0, y: 75.5, text: Large Dandelin sphere}
    - {x: 26.9, y: 53.0, text: Cutting plane}
    - {x: 52.8, y: 45.3, text: Focus}
  distractors: [Directrix, Center of the ellipse]
  explanation: |-
    The cone comes to a point at its apex (1). The two Dandelin spheres (2 and 3) each fit snugly against the cone and touch the cutting plane (4) at exactly one point, and those touching points are the foci of the ellipse (5 is the small sphere's). The directrix is a line in the plane, not a point, and the center of the ellipse lies between the two foci.
- id: pc-m7-r2-h15
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'In the Dandelin-sphere proof, why is $PF_1 = PQ_1$, where $Q_1$ is where the generator through $P$ meets the small sphere''s circle?'
  choices: ['Because $F_1$ and $Q_1$ are both on the cutting plane', 'Because both are tangent segments from $P$ to the same sphere', 'Because $P$ is the midpoint of $F_1Q_1$', 'Because the cone''s generators are all the same length']
  answer: 1
  explanation: |-
    The plane touches the small sphere at $F_1$ and the generator touches it at $Q_1$, so $PF_1$ and $PQ_1$ are both tangent segments from $P$ to that sphere, and tangent segments from one point to a sphere are equal. $Q_1$ is not on the cutting plane, and nothing makes $P$ a midpoint.
- id: pc-m7-r2-h16
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  type: order
  stem: 'Put these milestones in the history of conics in order.'
  items:
    - 'Menaechmus is traditionally credited with discovering the conics'
    - 'Apollonius names the ellipse, parabola and hyperbola'
    - 'Pappus records the focus-directrix property'
    - 'Kepler coins the word focus'
    - 'Dandelin proves the focal properties with inscribed spheres'
  explanation: |-
    Menaechmus (about 350 BC), Apollonius (about 200 BC), Pappus (early 300s AD), Kepler (1604) and Dandelin (1822).
- id: pc-m7-r2-h17
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  type: text
  stem: 'The point $P$ on $\dfrac{x^2}{100} + \dfrac{y^2}{36} = 1$ with $x = 5$ is ___ units from $F_1 = (-8, 0)$ and ___ units from $F_2 = (8, 0)$.'
  accept:
    - ['14']
    - ['6']
  explanation: |-
    $a = 10$, $c = 8$, $e = 0.8$. $PF_1 = a + ex_0 = 10 + 4 = 14$ and $PF_2 = a - ex_0 = 10 - 4 = 6$; they add to $2a = 20$. Check: $y^2 = 36\left(1 - \frac{25}{100}\right) = 27$, and $PF_2 = \sqrt{(5 - 8)^2 + 27} = \sqrt{36} = 6$.
- id: pc-m7-r2-h18
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'A cone''s generators make $45°$ with its axis. A plane making $60°$ with the axis cuts it. What is the eccentricity of the slice?'
  choices: ['$e \approx 0.71$, an ellipse', '$e \approx 1.41$, a hyperbola', '$e = 1$, a parabola', '$e = 0.5$, an ellipse']
  answer: 0
  explanation: |-
    $e = \frac{\cos\beta}{\cos\alpha} = \frac{\cos 60°}{\cos 45°} = \frac{0.5}{0.7071} \approx 0.71 < 1$: an ellipse. The plane is closer to horizontal than the generators ($60° > 45°$ from the axis). $1.41$ is the ratio upside down, and $0.5$ forgets to divide by $\cos 45°$.
- id: pc-m7-r2-h19
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'A cone''s generators make $30°$ with its axis. Which cutting planes (angle $\beta$ with the axis, not through the apex) give an ellipse or a circle? Select all that apply.'
  choices: ['$\beta = 90°$', '$\beta = 50°$', '$\beta = 30°$', '$\beta = 20°$']
  answer: [0, 1]
  explanation: |-
    $e = \frac{\cos\beta}{\cos 30°}$. $\beta = 90°$ gives $e = 0$ (a circle) and $\beta = 50°$ gives $e \approx 0.74$ (an ellipse). $\beta = 30°$ is parallel to a generator: $e = 1$, a parabola. $\beta = 20°$ gives $e \approx 1.09$: a hyperbola.
- id: pc-m7-r2-h20
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'Where does the tangent line to $x^2 = 12y$ at $P = (6, 3)$ cross the axis of symmetry?'
  choices: ['$(0, 3)$', '$(0, -6)$', '$(-3, 0)$', '$(0, -3)$']
  answer: 3
  explanation: |-
    $p = 3$. The tangent at $(x_0, y_0)$ has slope $\frac{x_0}{2p} = 1$ and meets the axis at $(0, -y_0) = (0, -3)$: the line $y = x - 3$. As in the proof, $F = (0, 3)$ is $6$ from both $T$ and $P$.
- id: pc-m7-r2-h21
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'In the proof of the parabola''s reflective property, why is triangle $FPT$ isosceles ($F$ the focus, $T$ where the tangent at $P$ meets the axis)?'
  choices: ['Because the tangent is perpendicular to $PF$', 'Because $T$ is the vertex of the parabola', 'Because $FT = p + y_0$ and $FP = y_0 + p$', 'Because every triangle with a vertex at the focus is isosceles']
  answer: 2
  explanation: |-
    $T = (0, -y_0)$ is $p + y_0$ below $F = (0, p)$, and $FP$ equals the distance from $P$ to the directrix, $y_0 + p$. The tangent is not perpendicular to $PF$, and $T$ is the vertex only when $P$ is.
- id: pc-m7-r2-h22
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  type: match
  stem: 'Match each device to the conic whose reflective property it uses.'
  pairs:
    - [Satellite dish, Parabola]
    - [Whispering gallery, Ellipse]
    - [Lithotripter (kidney-stone reflector), Ellipse]
    - [Secondary mirror of a Cassegrain telescope, Hyperbola]
  distractors: [Circle]
  explanation: |-
    A dish gathers parallel rays at its focus (parabola). A whispering gallery and a lithotripter send waves from one focus to the other (ellipse; in 3D, an ellipsoid). A Cassegrain secondary mirror redirects light aimed at one focus to the other focus (hyperbola).
- id: pc-m7-r2-h23
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'What is the directrix that goes with the right focus of $\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$?'
  choices: ['$x = \tfrac{25}{3}$', '$x = \tfrac{16}{3}$', '$x = 5$', '$x = 3$']
  answer: 0
  explanation: |-
    $a = 5$, $c = 3$, $e = \frac35$. The directrix is $x = \frac{a}{e} = \frac{a^2}{c} = \frac{25}{3}$, outside the ellipse (beyond the vertex at 5). $x = 3$ is the focus and $x = 5$ the vertex.
- id: pc-m7-r2-h24
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'A ray aimed at focus $F_2$ hits the outside (convex side) of one branch of a hyperbolic mirror. Where does the reflected ray go?'
  choices: ['Parallel to the transverse axis', 'Back toward where it came from', 'Through the center of the hyperbola', 'Toward the other focus, $F_1$']
  answer: 3
  explanation: |-
    The tangent to a hyperbola bisects the angle $F_1PF_2$, so reflecting the line toward $F_2$ across the tangent gives the line toward $F_1$. This is how a Cassegrain telescope's secondary mirror redirects light.
- id: pc-m7-r2-h25
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'For a point $(x_0, y_0)$ on $\dfrac{x^2}{a^2} + \dfrac{y^2}{b^2} = 1$, what is $PF_1 - PF_2$, with $F_1 = (-c, 0)$ and $F_2 = (c, 0)$?'
  choices: ['$2a$', '$2ex_0$', '$0$', '$2c$']
  answer: 1
  explanation: |-
    $PF_1 = a + ex_0$ and $PF_2 = a - ex_0$, so the difference is $2ex_0$. Their sum is $2a$. The difference is 0 only on the minor axis ($x_0 = 0$) and $2c$ only at the right vertex.
- id: pc-m7-r2-h26
  lesson: pc-m7-h-conic-geometry
  topic: Geometry of conics
  stem: 'A plane that does not pass through the apex cuts a double cone parallel to one of its generators. What is the slice?'
  choices: ['A circle', 'An ellipse', 'A parabola', 'A hyperbola']
  answer: 2
  explanation: |-
    Parallel to a generator means $\beta = \alpha$, so $e = \frac{\cos\beta}{\cos\alpha} = 1$: a parabola. It cuts only one nappe and never closes up.
# ---------- Honors: Orbits ----------
- id: pc-m7-r2-h27
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'An asteroid has $a = 2.5$ AU and $e = 0.2$. What are its perihelion and aphelion distances?'
  choices: ['$0.5$ AU and $2.5$ AU', '$2.3$ AU and $2.7$ AU', '$2.5$ AU and $3.0$ AU', '$2.0$ AU and $3.0$ AU']
  answer: 3
  explanation: |-
    $q = a(1 - e) = 2.5(0.8) = 2.0$ AU and $Q = a(1 + e) = 2.5(1.2) = 3.0$ AU. Subtracting $e$ itself ($2.3$, $2.7$) is a common slip; the Sun is $c = ae = 0.5$ AU from the center.
- id: pc-m7-r2-h28
  lesson: pc-m7-h-orbits
  topic: Orbits
  type: text
  stem: 'A comet''s closest distance to the Sun is 1 AU and its farthest is 9 AU. Its semi-major axis is $a =$ ___ AU and its eccentricity is $e =$ ___.'
  accept:
    - ['5']
    - ['0.8', '4/5']
  explanation: |-
    $a = \frac{q + Q}{2} = \frac{1 + 9}{2} = 5$ AU and $e = \frac{Q - q}{Q + q} = \frac{8}{10} = 0.8$. Check: $a(1 - e) = 1$ and $a(1 + e) = 9$.
- id: pc-m7-r2-h29
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'An asteroid orbits the Sun with semi-major axis 4 AU. What is its period?'
  choices: ['8 years', '16 years', '64 years', '2 years']
  answer: 0
  explanation: |-
    $T^2 = a^3 = 64$, so $T = 8$ years. 64 is $T^2$, 16 is $a^2$, and 2 is $\sqrt a$.
- id: pc-m7-r2-h30
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'An orbit has $e = 0.5$. How many times faster does the object move at perihelion than at aphelion?'
  choices: ['2 times', '3 times', '1.5 times', '9 times']
  answer: 1
  explanation: |-
    $\frac{v_p}{v_a} = \frac{Q}{q} = \frac{1 + e}{1 - e} = \frac{1.5}{0.5} = 3$. This comes from equal areas: $\frac12 q v_p = \frac12 Q v_a$.
- id: pc-m7-r2-h31
  lesson: pc-m7-h-orbits
  topic: Orbits
  type: match
  stem: 'Match each eccentricity to the path of an object moving around the Sun under gravity.'
  pairs:
    - ['$e = 0$', Circle]
    - ['$e = 0.4$', Ellipse]
    - ['$e = 1$', Parabola]
    - ['$e = 1.2$', Hyperbola]
  distractors: [Straight line]
  explanation: |-
    $r = \frac{ed}{1 + e\cos\theta}$ covers every case: $e = 0$ is a circle, $0 < e < 1$ an ellipse (captured), $e = 1$ a parabola (just escaping), $e > 1$ a hyperbola (a one-time flyby, like 'Oumuamua at about 1.2).
- id: pc-m7-r2-h32
  lesson: pc-m7-h-orbits
  topic: Orbits
  type: order
  stem: 'Put these events in the history of planetary orbits in order.'
  items:
    - 'Tycho Brahe makes precise naked-eye observations of the planets'
    - 'Kepler publishes his first two laws in Astronomia nova'
    - 'Kepler publishes his third law in Harmonices mundi'
    - 'Newton derives all three laws from gravity in the Principia'
  explanation: |-
    Tycho's observations (late 1500s) came first; Kepler used them for the first two laws (1609) and the third (1619); Newton's Principia (1687) explained all three.
- id: pc-m7-r2-h33
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'According to Kepler''s laws, which statements are true for every planet orbiting the Sun? Select all that apply.'
  choices: ['The Sun is at a focus of the planet''s elliptical orbit.', 'The planet moves fastest at perihelion.', '$T^2 = a^3$, with $T$ in years and $a$ in AU (to a very good approximation).', 'The Sun is at the center of the planet''s orbit.']
  answer: [0, 1, 2]
  explanation: |-
    First law: an ellipse with the Sun at a focus, not the center. Second law: equal areas in equal times, so the planet is fastest where it is closest. Third law: $T^2 = a^3$ in years and AU (Newton's version adds a tiny correction for the planet's mass).
- id: pc-m7-r2-h34
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'Which polar equation describes an orbit with $a = 2$ AU and $e = 0.5$, with the Sun at the pole and perihelion at $\theta = 0$?'
  choices: ['$r = \dfrac{2}{1 + 0.5\cos\theta}$', '$r = \dfrac{1}{1 + 0.5\cos\theta}$', '$r = \dfrac{1.5}{1 + 0.5\cos\theta}$', '$r = \dfrac{1.5}{1 - 0.5\cos\theta}$']
  answer: 2
  explanation: |-
    The numerator is $ed = a(1 - e^2) = 2(0.75) = 1.5$. With $+\cos\theta$, $\theta = 0$ gives the smallest $r$: $\frac{1.5}{1.5} = 1 = a(1 - e)$, the perihelion. The last choice puts the perihelion at $\theta = \pi$.
- id: pc-m7-r2-h35
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'Treating both orbits as circles, about how long does a Hohmann transfer from Earth''s orbit (1 AU) to an asteroid orbit at 2.8 AU take?'
  choices: ['About 2.62 years', 'About 0.95 years', 'About 1.90 years', 'About 1.31 years']
  answer: 3
  explanation: |-
    The transfer ellipse has $a = \frac{1 + 2.8}{2} = 1.9$ AU, so a full lap would take $1.9^{3/2} \approx 2.62$ years. The trip is half of it: about 1.31 years.
- id: pc-m7-r2-h36
  lesson: pc-m7-h-orbits
  topic: Orbits
  type: text
  stem: 'An object orbits the Sun every 27 years. Its semi-major axis is ___ AU. Give only the number.'
  accept: ['9']
  explanation: |-
    $a^3 = T^2 = 729$, so $a = \sqrt[3]{729} = 9$ AU.
- id: pc-m7-r2-h37
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'Earth is closest to the Sun in early January. What does this tell you about the seasons?'
  choices: ['The distance to the Sun is not what causes them; Earth''s tilt does', 'Northern winter is caused by being closest to the Sun', 'Earth''s orbit must be a circle', 'The Sun must be at the center of Earth''s orbit']
  answer: 0
  explanation: |-
    If distance caused the seasons, January would be summer everywhere. Earth's distance changes by only about 3% ($e \approx 0.0167$); the seasons come from the tilt of its axis.
- id: pc-m7-r2-h38
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'Two comets orbit the Sun with the same semi-major axis, one with $e = 0.1$ and one with $e = 0.9$. Which has the longer period?'
  choices: ['The one with $e = 0.9$', 'They have the same period', 'The one with $e = 0.1$', 'It depends on where they are now']
  answer: 1
  explanation: |-
    By Kepler's third law $T = a^{3/2}$ depends only on $a$. The eccentric comet travels a different path, moving faster near the Sun and slower far away, but takes the same time.
- id: pc-m7-r2-h39
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'An object passes the Sun on a path with $e = 1.2$. What happens to it?'
  choices: ['It settles into a circular orbit', 'It falls into the Sun', 'It swings past the Sun once and leaves', 'It returns once every 1.2 years']
  answer: 2
  explanation: |-
    $e > 1$ is a hyperbola: an open path, so the object is not captured. 'Oumuamua, found in 2017, followed such a path with $e \approx 1.2$.
- id: pc-m7-r2-h40
  lesson: pc-m7-h-orbits
  topic: Orbits
  stem: 'An orbit has $a = 10$ AU and $e = 0.6$. How far is the object from the Sun at $\theta = 90°$ from perihelion?'
  choices: ['4 AU', '16 AU', '10 AU', '6.4 AU']
  answer: 3
  explanation: |-
    $r = \frac{a(1 - e^2)}{1 + e\cos 90°} = a(1 - e^2) = 10(0.64) = 6.4$ AU. 4 and 16 AU are the perihelion and aphelion distances, and 10 AU is $a$.
