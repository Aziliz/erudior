# Honors module pc-h1 (Proof, infinity and the road to calculus), round 2
# Lesson 90: how to prove it
- id: pc-h1-r2-h01
  lesson: pc-h1-proof
  module_quiz: true
  topic: Logic and proof
  stem: 'When is the conditional statement "If $P$, then $Q$" false?'
  choices: ['Only when $P$ is true and $Q$ is false', 'Only when $P$ is false and $Q$ is true', 'Whenever $P$ is false', 'Whenever $Q$ is true']
  answer: 0
  explanation: |-
    A conditional promises that $Q$ holds whenever $P$ does. The only way to break the promise is a case where $P$ is true and $Q$ is false. When $P$ is false the promise says nothing, so the statement counts as true; when $Q$ is true it can't be broken.
- id: pc-h1-r2-h02
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'What is the contrapositive of "If a quadrilateral is a square, then it has four right angles"?'
  choices: ['If a quadrilateral has four right angles, then it is a square.', 'If a quadrilateral does not have four right angles, then it is not a square.', 'If a quadrilateral is not a square, then it does not have four right angles.', 'A quadrilateral is a square and does not have four right angles.']
  answer: 1
  explanation: |-
    The contrapositive negates both parts and swaps them: "if not $Q$, then not $P$". It is true, like the original. Swapping without negating gives the converse (false: a rectangle has four right angles). Negating without swapping gives the inverse (also false, for the same reason). The last choice is the negation, the one situation that would break the statement.
- id: pc-h1-r2-h03
  lesson: pc-h1-proof
  module_quiz: true
  type: label
  topic: Logic and proof
  stem: 'Each box holds a statement built from "If $P$, then $Q$". Name each numbered box.'
  image: {src: images/pc-h1-conditionals-blank.svg, alt: 'Four boxes in a square, joined by arrows labeled swap and negate both, with dashed diagonals. Top left: if P then Q. Top right: if Q then P. Bottom left: if not P then not Q. Bottom right: if not Q then not P. Each box has a number.'}
  labels:
    - {x: 21.9, y: 18.1, text: Original statement}
    - {x: 78.1, y: 18.1, text: Converse}
    - {x: 21.9, y: 75.2, text: Inverse}
    - {x: 78.1, y: 75.2, text: Contrapositive}
  distractors: [Negation, Counterexample]
  explanation: |-
    "If $P$, then $Q$" is the original. Swapping the parts gives the converse, "If $Q$, then $P$". Negating both gives the inverse, "If not $P$, then not $Q$". Doing both gives the contrapositive, "If not $Q$, then not $P$", which is equivalent to the original. The negation of a conditional is not an if-then statement at all: it is "$P$ and not $Q$".
- id: pc-h1-r2-h04
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'The statement "If $x > 3$, then $x^2 > 9$" is true for all real $x$. Which of these must also be true?'
  choices: ['If $x^2 > 9$, then $x > 3$.', 'If $x \le 3$, then $x^2 \le 9$.', 'If $x^2 \le 9$, then $x \le 3$.', 'If $x^2 > 9$, then $x \le 3$.']
  answer: 2
  explanation: |-
    "If $x^2 \le 9$, then $x \le 3$" is the contrapositive, so it is true whenever the original is. The converse "if $x^2 > 9$ then $x > 3$" and the inverse "if $x \le 3$ then $x^2 \le 9$" both fail at $x = -4$. The last choice fails at $x = 4$.
- id: pc-h1-r2-h05
  lesson: pc-h1-proof
  module_quiz: true
  topic: Logic and proof
  stem: 'Which statements are true for all integers? Select all that apply.'
  choices: ['The sum of two odd integers is even.', 'If $n^2$ is a multiple of 4, then $n$ is a multiple of 4.', 'The product of two odd integers is odd.', 'The sum of two prime numbers is never prime.', 'If $n^2$ is even, then $n$ is even.']
  answer: [0, 2, 4]
  explanation: |-
    $(2a + 1) + (2b + 1) = 2(a + b + 1)$ is even, and $(2a + 1)(2b + 1) = 2(2ab + a + b) + 1$ is odd. "If $n^2$ is even then $n$ is even" was proved by contrapositive in the lesson. The other two have counterexamples: $n = 2$ gives $n^2 = 4$, a multiple of 4, while 2 is not; and $2 + 3 = 5$ is a prime that is the sum of two primes.
- id: pc-h1-r2-h06
  lesson: pc-h1-proof
  type: order
  topic: Logic and proof
  stem: 'Put the steps of the proof that $\sqrt2$ is irrational in order.'
  items:
    - 'Assume $\sqrt2 = \frac ab$ with the fraction in lowest terms'
    - 'Square both sides to get $a^2 = 2b^2$'
    - 'Since $a^2$ is even, $a$ is even, so $a = 2c$'
    - 'Substitute to get $b^2 = 2c^2$, so $b$ is even too'
    - 'Both $a$ and $b$ are even, contradicting lowest terms'
  explanation: |-
    The proof by contradiction starts by assuming the opposite of the claim, with the fraction reduced. Each later step uses the one before it: squaring gives $a^2 = 2b^2$; that makes $a$ even; substituting $a = 2c$ makes $b$ even; and two even numbers share the factor 2, which contradicts lowest terms.
- id: pc-h1-r2-h07
  lesson: pc-h1-proof
  type: text
  topic: Logic and proof
  stem: 'To disprove "every prime number is odd", give a counterexample: the prime ___.'
  accept: ['2', 'two']
  explanation: |-
    2 is prime and even, so it breaks the statement. One counterexample is enough to disprove a "for all" claim. It is the only possible one here: every other even number has 2 as a factor, so it is not prime.
- id: pc-h1-r2-h08
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'In Euclid''s proof with the primes $2, 3, 5, 7, 11, 13$, the number $N = 2 \cdot 3 \cdot 5 \cdot 7 \cdot 11 \cdot 13 + 1 = 30{,}031 = 59 \cdot 509$. What does this show?'
  choices: ['The proof is wrong, because the proof needs $N$ to be prime.', 'Dividing $N$ by 13 leaves no remainder.', '$N$ has a prime factor that is not on the list $2, 3, 5, 7, 11, 13$.', 'There are only finitely many primes after all.']
  answer: 2
  explanation: |-
    The proof never needs $N$ to be prime. It needs a prime factor of $N$ that is missing from the list, and 59 (or 509) is one. Dividing $N$ by any listed prime, 13 included, leaves remainder 1, because each listed prime divides the product exactly.
- id: pc-h1-r2-h09
  lesson: pc-h1-proof
  type: text
  topic: Logic and proof
  stem: 'Direct proof that the sum of two odd integers is even: write $m = 2a + 1$ and $n = 2b + 1$. Then $m + n = 2k$, which is even, where $k =$ ___ in terms of $a$ and $b$.'
  accept: ['a+b+1', 'b+a+1', '1+a+b', '1+b+a', 'a+1+b', 'b+1+a']
  explanation: |-
    $m + n = 2a + 2b + 2 = 2(a + b + 1)$. Since $a + b + 1$ is an integer, $m + n$ is twice an integer, which is the definition of even.
- id: pc-h1-r2-h10
  lesson: pc-h1-proof
  module_quiz: true
  topic: Logic and proof
  stem: 'Which fact shows that the claim "$2^p - 1$ is prime for every prime $p$" is false?'
  choices: ['$2^7 - 1 = 127$, which is prime', '$2^4 - 1 = 15 = 3 \cdot 5$', '$2^{13} - 1 = 8191$, which is prime', '$2^{11} - 1 = 2047 = 23 \cdot 89$']
  answer: 3
  explanation: |-
    A counterexample must satisfy the hypothesis ($p$ prime) and break the conclusion. $p = 11$ is prime and $2047 = 23 \cdot 89$ is not, so the claim is false. $p = 4$ breaks the conclusion but isn't prime, so it says nothing about the claim, and examples that work (7, 13) can never disprove it.
- id: pc-h1-r2-h11
  lesson: pc-h1-proof
  module_quiz: true
  type: match
  topic: Logic and proof
  stem: 'Match each argument to the method it uses.'
  pairs:
    - ['Assume $\sqrt2 = \frac ab$ in lowest terms and show $a$ and $b$ are both even', Proof by contradiction]
    - ['To show "if $n^2$ is even then $n$ is even", show that odd $n$ gives odd $n^2$', Proof by contrapositive]
    - ['Write $m = 2a + 1$, $n = 2b + 1$ and expand $mn$', Direct proof]
    - ['Check $n = 1$, then show the case $k$ implies the case $k + 1$', Mathematical induction]
    - ['Point out that $2^{11} - 1 = 23 \cdot 89$', Counterexample]
  distractors: [Proving the converse]
  explanation: |-
    Assuming the claim is false and reaching an impossibility is contradiction. Proving "if not $Q$ then not $P$" in place of "if $P$ then $Q$" is the contrapositive. Starting from the hypothesis and computing to the conclusion is a direct proof. A base case plus an inductive step is induction. A single case that breaks a "for all" claim is a counterexample.
- id: pc-h1-r2-h12
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'To prove "if $n$ is even, then $n^2$ is even", a student assumes $n^2$ is even and concludes that $n$ is even. What has the student proved?'
  choices: ['The converse of the statement, not the statement itself', 'The statement itself, by contrapositive', 'The statement itself, by contradiction', 'Nothing, because the conclusion is false']
  answer: 0
  explanation: |-
    Starting from $Q$ ($n^2$ even) and reaching $P$ ($n$ even) proves "if $Q$ then $P$", the converse. It happens to be true, but it is a different statement. A proof by contrapositive would start from "$n^2$ is not even", that is, odd. A direct proof is easy: $n = 2k$ gives $n^2 = 2(2k^2)$.
- id: pc-h1-r2-h13
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'Which is the negation of "Every continuous function is a polynomial"?'
  choices: ['No continuous function is a polynomial.', 'Some continuous function is not a polynomial.', 'Every continuous function is not a polynomial.', 'Some polynomial is not continuous.']
  answer: 1
  explanation: |-
    To deny "every $x$ has property $Q$", you only need one $x$ without it: "some continuous function is not a polynomial" (for example $e^x$). That is exactly what a counterexample supplies. "No continuous function is a polynomial" says far more than the denial, and it is false, since $x^2$ is both. The last choice changes the subject to polynomials.
- id: pc-h1-r2-h14
  lesson: pc-h1-proof
  topic: Logic and proof
  stem: 'The statement "If $x^2 = 4$, then $x = 2$" is false. Which value of $x$ shows this?'
  choices: ['$x = 2$', '$x = 0$', '$x = 4$', '$x = -2$']
  answer: 3
  explanation: |-
    A counterexample needs the hypothesis true and the conclusion false. For $x = -2$, $x^2 = 4$ but $x \ne 2$. For $x = 0$ and $x = 4$ the hypothesis $x^2 = 4$ is false, so they don't test the promise; $x = 2$ satisfies both parts.
# Lesson 91: comparing infinite sets
- id: pc-h1-r2-h15
  lesson: pc-h1-infinity
  module_quiz: true
  topic: Infinite sets
  stem: 'Two sets have the same cardinality exactly when...'
  choices: ['one of them is a subset of the other.', 'there is a one-to-one correspondence between them.', 'both of them are infinite.', 'they have the same smallest and largest elements.']
  answer: 1
  explanation: |-
    Cardinality is defined by matching: a one-to-one correspondence pairs every element of each set with exactly one element of the other. Being a subset doesn't decide it ($\mathbb{N}$ is a proper subset of $\mathbb{Z}$, yet they match), being infinite doesn't either ($\mathbb{N}$ and $\mathbb{R}$ differ), and $(0, 1)$ and $(0, 2)$ have different endpoints but the same cardinality.
- id: pc-h1-r2-h16
  lesson: pc-h1-infinity
  type: text
  topic: Infinite sets
  stem: 'The list $0, 1, -1, 2, -2, \dots$ is given by $f(n) = \frac n2$ for even $n$ and $f(n) = -\frac{n-1}{2}$ for odd $n$. Then $f(9) =$ ___, and the integer 6 is in position ___ of the list.'
  accept:
    - ['-4', '−4']
    - ['12']
  explanation: |-
    9 is odd, so $f(9) = -\frac{8}{2} = -4$. For a positive integer $z$ the position is $2z$, so 6 is in position 12. Check: $f(12) = \frac{12}{2} = 6$.
- id: pc-h1-r2-h17
  lesson: pc-h1-infinity
  module_quiz: true
  type: text
  topic: Infinite sets
  stem: 'With the Cantor pairing function $\pi(a, b) = \frac{(a + b)(a + b + 1)}{2} + b$, the pair $(3, 4)$ is in position ___.'
  accept: ['32']
  explanation: |-
    $a + b = 7$, so the diagonals before this one hold $\frac{7 \cdot 8}{2} = 28$ pairs. Add $b = 4$: $\pi(3, 4) = 28 + 4 = 32$.
- id: pc-h1-r2-h18
  lesson: pc-h1-infinity
  topic: Infinite sets
  stem: 'Hilbert''s hotel is full. A bus brings infinitely many new guests, so every current guest moves from room $n$ to room $2n$, and the new guests fill the odd rooms in order. Which room does the 5th new guest get?'
  choices: ['Room 10', 'Room 5', 'Room 9', 'Room 11']
  answer: 2
  explanation: |-
    The free rooms are the odd ones, $1, 3, 5, 7, 9, \dots$, and the $k$th of them is room $2k - 1$. The 5th new guest gets room $2 \cdot 5 - 1 = 9$. Room 10 is now taken by the guest who was in room 5, and room 11 goes to the 6th new guest.
- id: pc-h1-r2-h19
  lesson: pc-h1-infinity
  module_quiz: true
  topic: Infinite sets
  stem: 'Which sets are countable? Select all that apply.'
  choices: ['The integers $\mathbb{Z}$', 'The even positive integers', 'The rational numbers $\mathbb{Q}$', 'The real numbers in $(0, 1)$', 'All real numbers $\mathbb{R}$', 'All pairs $(a, b)$ of whole numbers']
  answer: [0, 1, 2, 5]
  explanation: |-
    $\mathbb{Z}$ is listed as $0, 1, -1, 2, -2, \dots$; the even numbers by $n \mapsto 2n$; pairs of whole numbers by diagonals (the Cantor pairing function); and $\mathbb{Q}$ by walking the diagonals of the fraction grid and skipping repeats. Cantor's diagonal argument shows $(0, 1)$ can't be listed, and $\mathbb{R}$ has the same cardinality as $(0, 1)$, so both are uncountable.
- id: pc-h1-r2-h20
  lesson: pc-h1-infinity
  type: order
  topic: Infinite sets
  stem: 'Put the steps of Cantor''s diagonal argument in order.'
  items:
    - 'Assume every number in $(0, 1)$ appears in a list $r_1, r_2, r_3, \dots$'
    - 'Look at the $n$th digit of $r_n$, the digit on the diagonal'
    - 'Build $x$ whose $n$th digit is 5, or 4 if the diagonal digit is 5'
    - 'Note that $x$ differs from each $r_n$ in digit $n$, so $x$ is not on the list'
    - 'Conclude that no list works: $(0, 1)$ is uncountable'
  explanation: |-
    It is a proof by contradiction, so it starts by assuming a complete list. The new number is built from the diagonal digits, so you read them before building $x$. Only once $x$ is built can you see it differs from every listed number, and that contradiction is the conclusion.
- id: pc-h1-r2-h21
  lesson: pc-h1-infinity
  module_quiz: true
  type: label
  topic: Infinite sets
  stem: 'This picture shows Cantor''s diagonal argument: a list of decimals in $(0, 1)$, and below the line a new number $x$. Name the numbered parts.'
  image: {src: images/pc-h1-diagonal-blank.svg, alt: 'Five rows of decimals, each starting with 0 point, with five digits in columns. The digits on the diagonal from top left to bottom right are shaded. Below a line is one more row of five shaded digits. Several places are numbered.'}
  labels:
    - {x: 45, y: 39, text: Diagonal digit}
    - {x: 53.3, y: 27, text: Digit not used by the argument}
    - {x: 10, y: 51, text: Fourth number in the list}
    - {x: 36.7, y: 89.5, text: Digit of the new number x}
  distractors: [Position of x in the list, Cantor pairing function]
  explanation: |-
    The shaded digits running down the diagonal are the $n$th digits of the $n$th numbers; the argument reads only these. Other digits, such as the fourth digit of the second number, are never used. The fourth row is the fourth number in the list. The row below the line is the new number $x$, each digit chosen to differ from the diagonal digit above it. $x$ has no position in the list; that is the point of the proof.
- id: pc-h1-r2-h22
  lesson: pc-h1-infinity
  topic: Infinite sets
  stem: 'In a proposed list, the first five diagonal digits are $2, 5, 7, 5, 0$. Using the rule "make the digit 5, or 4 if the diagonal digit is 5", what are the first five digits of $x$?'
  choices: ['$0.45454\ldots$', '$0.54545\ldots$', '$0.55555\ldots$', '$0.25750\ldots$']
  answer: 1
  explanation: |-
    $2 \to 5$, $5 \to 4$, $7 \to 5$, $5 \to 4$, $0 \to 5$: $x = 0.54545\ldots$ Writing 5 everywhere would match the diagonal in digits 2 and 4, copying the diagonal gives a number possibly on the list, and $0.45454\ldots$ swaps the rule.
- id: pc-h1-r2-h23
  lesson: pc-h1-infinity
  topic: Infinite sets
  stem: 'Why does the diagonal argument build $x$ from the digits 4 and 5 instead of allowing 0 and 9?'
  choices: ['Some numbers have two decimal forms, like $0.5000\ldots = 0.4999\ldots$, so a number built with 0s and 9s might equal a listed number written differently.', 'The digits 0 and 9 cannot appear in a number between 0 and 1.', 'Using 4 and 5 makes $x$ rational, which the proof needs.', 'Using 4 and 5 makes $x$ smaller than every number in the list.']
  answer: 0
  explanation: |-
    Differing in a digit proves two decimals are different numbers only if neither ends in repeating 0s or 9s. A number made of 4s and 5s has just one decimal form, so differing from $r_n$ in digit $n$ really makes $x \ne r_n$. Digits 0 and 9 are allowed in numbers in $(0, 1)$, $x$ need not be rational, and $x$ is not smaller than every listed number.
- id: pc-h1-r2-h24
  lesson: pc-h1-infinity
  module_quiz: true
  topic: Infinite sets
  stem: 'The function $f(x) = \dfrac{x}{1 - |x|}$ matches $(-1, 1)$ with $\mathbb{R}$, with inverse $f^{-1}(y) = \dfrac{y}{1 + |y|}$. Find $f^{-1}(-4)$.'
  choices: ['$\frac43$', '$\frac45$', '$-\frac45$', '$-\frac15$']
  answer: 2
  explanation: |-
    $f^{-1}(-4) = \dfrac{-4}{1 + 4} = -\dfrac45$. Check: $f\left(-\tfrac45\right) = \dfrac{-4/5}{1 - 4/5} = \dfrac{-4/5}{1/5} = -4$. Using $1 - |y|$ in the denominator gives $\frac{-4}{-3} = \frac43$, which isn't even in $(-1, 1)$; dropping the sign gives $\frac45$; and $-\frac15$ puts 1 in the numerator.
- id: pc-h1-r2-h25
  lesson: pc-h1-infinity
  type: match
  topic: Infinite sets
  stem: 'Sort each set by its size.'
  pairs:
    - ['$\{1, 2, 3, \dots, 100\}$', Finite]
    - ['$\mathbb{Z}$', Countably infinite]
    - ['$\mathbb{Q}$', Countably infinite]
    - ['The interval $[0, 0.001]$', Uncountable]
    - ['$\mathbb{R}$', Uncountable]
  explanation: |-
    The first set has 100 elements. $\mathbb{Z}$ and $\mathbb{Q}$ can both be listed, so they are countably infinite. Every interval of positive length, however short, has the same cardinality as $\mathbb{R}$, which Cantor's diagonal argument shows is uncountable.
- id: pc-h1-r2-h26
  lesson: pc-h1-infinity
  topic: Infinite sets
  stem: 'Which function is a one-to-one correspondence from $\mathbb{N} = \{1, 2, 3, \dots\}$ to the odd positive integers $\{1, 3, 5, \dots\}$?'
  choices: ['$f(n) = 2n + 1$', '$f(n) = n^2$', '$f(n) = 2n$', '$f(n) = 2n - 1$']
  answer: 3
  explanation: |-
    $f(n) = 2n - 1$ gives $1, 3, 5, \dots$, every odd positive integer exactly once; its inverse is $\frac{m + 1}{2}$. $2n + 1$ misses 1, $n^2$ misses odd numbers like 3 and also produces even numbers, and $2n$ gives the even numbers.
- id: pc-h1-r2-h27
  lesson: pc-h1-infinity
  topic: Infinite sets
  stem: 'A student says: "$\mathbb{N}$ is only part of $\mathbb{Z}$, so $\mathbb{Z}$ must have more elements." What is the best reply?'
  choices: ['Correct: a set always has more elements than any proper subset of it.', 'Correct, but only because $\mathbb{Z}$ contains negative numbers.', 'Wrong: neither set has a size, because both are infinite.', 'Wrong: the list $0, 1, -1, 2, -2, \dots$ is a one-to-one correspondence, so they have the same cardinality.']
  answer: 3
  explanation: |-
    For infinite sets, size is decided by matching, and $\mathbb{N}$ and $\mathbb{Z}$ match. "A proper subset is smaller" holds for finite sets only; an infinite set always matches some proper subset of itself. Infinite sets do have sizes (cardinalities), and some are bigger than others, as $\mathbb{R}$ is bigger than $\mathbb{N}$.
- id: pc-h1-r2-h28
  lesson: pc-h1-infinity
  type: text
  topic: Infinite sets
  stem: 'In the diagonal listing of pairs of whole numbers, positions numbered from 0 by $\pi(a, b) = \frac{(a + b)(a + b + 1)}{2} + b$, position 20 holds the pair (___, ___).'
  accept:
    - ['0']
    - ['5']
  explanation: |-
    The diagonals start at the triangular numbers $0, 1, 3, 6, 10, 15, 21, \dots$ Since $15 \le 20 < 21$, the pair is on the diagonal starting at 15, which is $a + b = 5$. Then $b = 20 - 15 = 5$ and $a = 5 - 5 = 0$: the pair $(0, 5)$. Check: $\pi(0, 5) = 15 + 5 = 20$.
# Lesson 92: when infinite sums add up
- id: pc-h1-r2-h29
  lesson: pc-h1-series
  module_quiz: true
  topic: Infinite series
  stem: 'What does it mean to say that the series $a_1 + a_2 + a_3 + \dots$ converges to $S$?'
  choices: ['The terms $a_n$ approach $S$.', 'The partial sums $S_n = a_1 + \dots + a_n$ approach $S$.', 'The terms $a_n$ approach 0.', 'Adding all the terms in any order gives $S$.']
  answer: 1
  explanation: |-
    An infinite sum is defined as the limit of the partial sums. Terms approaching 0 is necessary but not enough (the harmonic series), the terms themselves approach 0, not $S$, and some convergent series change their sum when rearranged.
- id: pc-h1-r2-h30
  lesson: pc-h1-series
  type: text
  topic: Infinite series
  stem: 'Written as a geometric series, $0.999\ldots = \frac{9}{10} + \frac{9}{100} + \dots$ has the exact sum ___.'
  accept: ['1', 'one']
  explanation: |-
    $a_1 = \frac{9}{10}$ and $r = \frac{1}{10}$, so the sum is $\dfrac{9/10}{1 - 1/10} = 1$. Every partial sum is below 1, but the series is the limit of its partial sums, and that limit is exactly 1.
- id: pc-h1-r2-h31
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'What does the divergence test say about $\displaystyle\sum_{n=1}^{\infty}\frac{2n}{3n + 1}$?'
  choices: ['Its terms approach $\frac23$, not 0, so it diverges.', 'Its terms approach 0, so it converges.', 'Its terms approach $\frac23$, so it converges to $\frac23$.', 'The test gives no information about this series.']
  answer: 0
  explanation: |-
    Divide by $n$: $\dfrac{2n}{3n + 1} = \dfrac{2}{3 + 1/n} \to \dfrac23$. Since the terms don't approach 0, the series diverges: from some point on, each partial sum adds about $\frac23$ more. The test gives no information only when the terms do approach 0.
- id: pc-h1-r2-h32
  lesson: pc-h1-series
  module_quiz: true
  topic: Infinite series
  stem: 'Which series diverge? Select all that apply.'
  choices: ['$\displaystyle\sum_{k=1}^{\infty}\frac1k$', '$\displaystyle\sum_{k=1}^{\infty}\frac{k}{k + 1}$', '$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k^2}$', '$\displaystyle\sum_{k=1}^{\infty}\left(\frac12\right)^k$', '$\displaystyle\sum_{k=1}^{\infty}\frac{1}{\sqrt k}$', '$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k(k + 1)}$']
  answer: [0, 1, 4]
  explanation: |-
    The harmonic series diverges (Oresme). $\frac{k}{k+1} \to 1$, so that one fails the divergence test. $\frac{1}{\sqrt k}$ is a p-series with $p = \frac12 \le 1$, and its terms are at least $\frac1k$, so it diverges too. $\sum\frac1{k^2}$ converges (p-series with $p = 2$), the geometric series with $r = \frac12$ converges to 1, and the telescoping series converges to 1.
- id: pc-h1-r2-h33
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'A student argues: "The terms of $\sum \frac1k$ approach 0, so the series converges." What is wrong?'
  choices: ['Nothing; the series converges to about 7.49.', 'The terms of $\sum\frac1k$ do not approach 0.', 'The divergence test only works for geometric series.', 'Terms approaching 0 is required for convergence but does not guarantee it; this series diverges.']
  answer: 3
  explanation: |-
    The divergence test says: if a series converges, its terms approach 0. The student used the converse, which is false, and the harmonic series is the counterexample. Its partial sums pass every bound (7.49 is only $S_{1000}$), and the test applies to every series.
- id: pc-h1-r2-h34
  lesson: pc-h1-series
  module_quiz: true
  type: order
  topic: Infinite series
  stem: 'Put the steps of Oresme''s proof that the harmonic series diverges in order.'
  items:
    - 'Group the terms after $1 + \frac12$ in blocks of 2, 4, 8, 16, … terms'
    - 'In each block, every term is at least the block''s last term'
    - 'So each block adds at least $\frac12$'
    - 'So $S_{2^m} \ge 1 + \frac m2$'
    - 'The partial sums grow without bound, so the series diverges'
  explanation: |-
    The blocks are $\frac13 + \frac14$, then $\frac15$ to $\frac18$, and so on. A block of $2^j$ terms ending in $\frac{1}{2^{j+1}}$ is at least $2^j \cdot \frac{1}{2^{j+1}} = \frac12$. Adding $m - 1$ such blocks to $1 + \frac12$ gives the bound $1 + \frac m2$, which grows without limit.
- id: pc-h1-r2-h35
  lesson: pc-h1-series
  module_quiz: true
  type: text
  topic: Infinite series
  stem: 'The partial sums of $\displaystyle\sum_{k=1}^{\infty}\frac{1}{k(k+1)}$ are $S_n = 1 - \frac{1}{n+1}$, so the series converges to ___.'
  accept: ['1', 'one']
  explanation: |-
    $\frac{1}{k(k+1)} = \frac1k - \frac{1}{k+1}$, so the partial sum telescopes to $1 - \frac{1}{n+1}$. As $n \to \infty$, $\frac{1}{n+1} \to 0$, and the sum is 1.
- id: pc-h1-r2-h36
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'Find $\displaystyle\sum_{k=1}^{\infty}\frac{2}{k(k+2)}$.'
  choices: ['$1$', '$\frac34$', '$2$', '$\frac32$']
  answer: 3
  explanation: |-
    Partial fractions: $\frac{2}{k(k+2)} = \frac1k - \frac{1}{k+2}$. In the partial sums each $-\frac{1}{k+2}$ cancels a term two places later, leaving $1 + \frac12 - \frac{1}{n+1} - \frac{1}{n+2} \to \frac32$. Keeping only the first surviving term gives 1, and $\frac34$ is the sum without the factor 2.
- id: pc-h1-r2-h37
  lesson: pc-h1-series
  type: text
  topic: Infinite series
  stem: 'Oresme''s bound $S_{2^m} \ge 1 + \frac m2$ for the harmonic series guarantees a partial sum of at least 4 once $m =$ ___, that is, after ___ terms.'
  accept:
    - ['6']
    - ['64']
  explanation: |-
    $1 + \frac m2 \ge 4$ needs $m \ge 6$, and $2^6 = 64$. (The actual partial sums pass 4 a little sooner, at $n = 31$; the bound is generous.)
- id: pc-h1-r2-h38
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'You know $\sum\frac{1}{k^2}$ converges. Which series does the comparison test then show converges?'
  choices: ['$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k^2 + 5}$', '$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k}$', '$\displaystyle\sum_{k=1}^{\infty}\frac{1}{\sqrt k}$', '$\displaystyle\sum_{k=1}^{\infty}\frac{k}{k^2}$']
  answer: 0
  explanation: |-
    $\frac{1}{k^2 + 5} < \frac{1}{k^2}$ for every $k$, and the terms are positive, so its partial sums are below those of a convergent series and it converges. The other three have terms *larger* than $\frac{1}{k^2}$, so the comparison says nothing about them; in fact all three diverge ($\frac{k}{k^2} = \frac1k$ is the harmonic series).
- id: pc-h1-r2-h39
  lesson: pc-h1-series
  module_quiz: true
  type: match
  topic: Infinite series
  stem: 'Match each series to what it does.'
  pairs:
    - ['$\displaystyle\sum_{k=0}^{\infty}\left(\frac13\right)^k$', Converges to 3/2]
    - ['$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k(k+1)}$', Converges to 1]
    - ['$\displaystyle\sum_{k=1}^{\infty}\frac1k$', Diverges]
    - ['$\displaystyle\sum_{k=1}^{\infty}\frac{1}{k^2}$', Converges to π²/6]
    - ['$1 - \frac12 + \frac13 - \frac14 + \dots$', Converges to ln 2]
  distractors: [Converges to 2]
  explanation: |-
    The geometric series starts at $k = 0$ with first term 1 and $r = \frac13$: $\frac{1}{1 - 1/3} = \frac32$. The telescoping series sums to 1. The harmonic series diverges. Euler showed $\sum \frac1{k^2} = \frac{\pi^2}{6}$, and the alternating harmonic series converges to $\ln 2$.
- id: pc-h1-r2-h40
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'Which of these p-series converges?'
  choices: ['$\displaystyle\sum\frac{1}{k^{0.99}}$', '$\displaystyle\sum\frac{1}{k^{1.01}}$', '$\displaystyle\sum\frac{1}{k}$', '$\displaystyle\sum\frac{1}{\sqrt k}$']
  answer: 1
  explanation: |-
    $\sum \frac{1}{k^p}$ converges exactly when $p > 1$. Only $p = 1.01$ qualifies, although it converges very slowly. $p = 0.99$, $p = 1$ and $p = \frac12$ all diverge.
- id: pc-h1-r2-h41
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'Rearranging the alternating harmonic series as $1 - \frac12 - \frac14 + \frac13 - \frac16 - \frac18 + \dots$ gives the sum $\frac{\ln 2}{2}$ instead of $\ln 2$. Why is that possible?'
  choices: ['The rearrangement leaves out some terms of the original series.', 'The original series actually diverges.', 'The series is conditionally convergent: its positive terms and its negative terms each diverge, so the order decides how they cancel.', 'Any convergent series changes its sum when its terms are rearranged.']
  answer: 2
  explanation: |-
    Every term of the original appears exactly once in the rearrangement. The alternating harmonic series does converge, but only conditionally: $1 + \frac13 + \frac15 + \dots$ and $\frac12 + \frac14 + \dots$ both diverge. Riemann showed such series can be rearranged to any sum. Absolutely convergent series, like geometric series with $|r| < 1$, keep their sum under any rearrangement.
- id: pc-h1-r2-h42
  lesson: pc-h1-series
  topic: Infinite series
  stem: 'A table shows partial sums $S_{10} \approx 2.93$, $S_{100} \approx 5.19$ and $S_{1000} \approx 7.49$ of a series of positive terms. What can you conclude from the table alone?'
  choices: ['The series converges, because the increases are getting smaller.', 'The series diverges, because the partial sums keep increasing.', 'Nothing certain: a finite table can''t show whether the partial sums level off, so an argument is needed.', 'The series converges to about 8.']
  answer: 2
  explanation: |-
    These are the harmonic series' partial sums, and that series diverges, so "the increases are shrinking" proves nothing. But increasing partial sums can also converge (those of $\sum \frac1{k^2}$ increase toward $\frac{\pi^2}{6}$). Only an argument, such as Oresme's grouping or a comparison, can settle it.
# Lesson 93: area under a curve
- id: pc-h1-r2-h43
  lesson: pc-h1-area
  module_quiz: true
  topic: Area and integration
  stem: 'Using Archimedes'' result, find the area of the region between $y = 4 - x^2$ and the $x$-axis.'
  choices: ['$8$', '$\frac{32}{3}$', '$16$', '$6$']
  answer: 1
  explanation: |-
    The parabola meets the axis at $x = \pm 2$. The inscribed triangle has base 4 and height 4, so area $\frac12 \cdot 4 \cdot 4 = 8$. The segment is $\frac43$ of that: $\frac{32}{3} \approx 10.67$. 8 is only the triangle, and 16 is the bounding rectangle.
- id: pc-h1-r2-h44
  lesson: pc-h1-area
  type: text
  topic: Area and integration
  stem: 'Archimedes'' triangles have total area $1 + \frac14 + \frac1{16} + \frac1{64} + \dots$ times the first triangle. This geometric series sums to ___.'
  accept: ['4/3', '1 1/3', '1.333', '1.33']
  explanation: |-
    $a_1 = 1$ and $r = \frac14$, so the sum is $\dfrac{1}{1 - 1/4} = \dfrac{1}{3/4} = \dfrac43$. That is why a parabolic segment has $\frac43$ the area of its inscribed triangle.
- id: pc-h1-r2-h45
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'Estimate the area under $y = x^2$ from 0 to 1 with 4 rectangles of width $\frac14$ whose heights come from the *left* endpoints.'
  choices: ['$\frac{15}{32}$', '$\frac{1}{3}$', '$\frac{7}{32}$', '$\frac{7}{8}$']
  answer: 2
  explanation: |-
    The left endpoints are $0, \frac14, \frac12, \frac34$, so $L_4 = \frac14\left(0 + \frac1{16} + \frac4{16} + \frac9{16}\right) = \frac14 \cdot \frac{14}{16} = \frac{7}{32} \approx 0.219$, an underestimate. $\frac{15}{32}$ is the right-endpoint sum, $\frac13$ the exact area, and $\frac78$ forgets to multiply by the width.
- id: pc-h1-r2-h46
  lesson: pc-h1-area
  module_quiz: true
  type: label
  topic: Area and integration
  stem: 'This picture estimates the area under a rising curve with four right-endpoint rectangles. Name the numbered parts.'
  image: {src: images/pc-h1-riemann-blank.svg, alt: 'A rising curve starting at the origin, with four rectangles of equal width standing on the x-axis. Each rectangle''s top right corner touches the curve at a dot, so the rectangles stick out above the curve. Five places are numbered.'}
  labels:
    - {x: 54.3, y: 60, text: Graph of the function}
    - {x: 55.8, y: 85.7, text: Width of one rectangle}
    - {x: 78.3, y: 14.3, text: Right endpoint on the curve}
    - {x: 67.5, y: 25, text: Extra area above the curve}
    - {x: 78.3, y: 50, text: Height of the last rectangle}
  distractors: [Tangent line, Left endpoint on the curve]
  explanation: |-
    The curve is the graph of the function. Each rectangle stands on a piece of the $x$-axis of width $\Delta x$, and its height is the function's value at the right end of that piece, marked by a dot on the curve. The right side of the last rectangle shows its height, $f$ at the right endpoint. Because the curve rises, each rectangle pokes above it, and that extra area makes the right-endpoint sum an overestimate.
- id: pc-h1-r2-h47
  lesson: pc-h1-area
  module_quiz: true
  type: text
  topic: Area and integration
  stem: 'Since $\int_0^b x^2\,dx = \frac{b^3}{3}$, the exact area under $y = x^2$ from 0 to 3 is ___.'
  accept: ['9', 'nine']
  explanation: |-
    $\frac{3^3}{3} = \frac{27}{3} = 9$. The right-endpoint sums $R_n = 27 \cdot \frac{(n+1)(2n+1)}{6n^2}$ approach $27 \cdot \frac13 = 9$.
- id: pc-h1-r2-h48
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'For $y = x^2$ on $[0, 1]$, $R_n = \frac{(n+1)(2n+1)}{6n^2}$ is the right-endpoint sum with $n$ rectangles. Which statements are true? Select all that apply.'
  choices: ['$R_n > \frac13$ for every $n$.', '$R_n$ gets larger as $n$ increases.', '$R_n \to \frac13$ as $n \to \infty$.', 'Every left-endpoint sum $L_n$ is less than $\frac13$.', '$R_4$ is the exact area.']
  answer: [0, 2, 3]
  explanation: |-
    The curve rises, so right-endpoint rectangles overshoot and left-endpoint rectangles fall short: $L_n < \frac13 < R_n$. As $n$ grows, $R_n = \frac{2n^2 + 3n + 1}{6n^2} = \frac13 + \frac{1}{2n} + \frac{1}{6n^2}$ *decreases* toward $\frac13$ (0.469, 0.385, 0.338, …). $R_4 = 0.46875$ is only an estimate.
- id: pc-h1-r2-h49
  lesson: pc-h1-area
  type: order
  topic: Area and integration
  stem: 'Put the steps for finding the exact area under $y = x^2$ from 0 to $b$ with Riemann sums in order.'
  items:
    - 'Cut $[0, b]$ into $n$ pieces of width $\Delta x = \frac bn$'
    - 'List the right endpoints $x_i = \frac{ib}{n}$'
    - 'Add the rectangle areas $x_i^2 \cdot \Delta x$ to get $R_n$'
    - 'Use $\sum i^2 = \frac{n(n+1)(2n+1)}{6}$ to write $R_n$ as a single expression in $n$'
    - 'Take the limit as $n \to \infty$ to get $\frac{b^3}{3}$'
  explanation: |-
    The width must be known before the endpoints can be listed, and the endpoints before the heights and areas. The sum formula turns $R_n$ into $b^3 \cdot \frac{(n+1)(2n+1)}{6n^2}$, and only then can you take the limit.
- id: pc-h1-r2-h50
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'Find the area under $y = x^2$ from $x = 2$ to $x = 4$.'
  choices: ['$\frac{56}{3}$', '$\frac{8}{3}$', '$\frac{64}{3}$', '$12$']
  answer: 0
  explanation: |-
    Subtract the area from 0 to 2 from the area from 0 to 4: $\frac{64}{3} - \frac{8}{3} = \frac{56}{3} \approx 18.67$. $\frac83$ uses $\frac{(4-2)^3}{3}$, $\frac{64}{3}$ forgets to subtract, and 12 is $4^2 - 2^2$, a difference of heights, not an area.
- id: pc-h1-r2-h51
  lesson: pc-h1-area
  module_quiz: true
  topic: Area and integration
  stem: 'The area under $y = x^2$ from 0 to $x$ is $A(x) = \frac{x^3}{3}$, and the derivative of $A$ is $x^2$. What does this example of the fundamental theorem of calculus say?'
  choices: ['The area under a curve equals its slope.', 'The rate at which the area under the curve grows equals the height of the curve.', 'Every curve has area $\frac{x^3}{3}$.', 'Riemann sums are exact once $n$ is large.']
  answer: 1
  explanation: |-
    $A(x + h) - A(x)$ is a thin strip of width $h$ and height about $f(x)$, so $\frac{A(x + h) - A(x)}{h} \to f(x)$. The FTC says the derivative of the area function is the original function. It does not say area equals slope, and Riemann sums are exact only in the limit.
- id: pc-h1-r2-h52
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'A cart''s velocity is $v(t) = 3t^2$ meters per second. How far does it travel from $t = 0$ to $t = 4$?'
  choices: ['48 m', '192 m', '24 m', '64 m']
  answer: 3
  explanation: |-
    Distance is the area under the velocity graph: $3\int_0^4 t^2\,dt = 3 \cdot \frac{64}{3} = 64$ m. Check: position $s(t) = t^3$ has $s'(t) = 3t^2$, and $s(4) - s(0) = 64$. 48 m/s is the velocity at $t = 4$, 192 forgets to divide by 3, and 24 is the acceleration $v'(4)$.
- id: pc-h1-r2-h53
  lesson: pc-h1-area
  module_quiz: true
  type: match
  topic: Area and integration
  stem: 'Match each idea to its description.'
  pairs:
    - [Riemann sum, A sum of rectangle areas that estimates the area under a curve]
    - [Definite integral, The limit of Riemann sums as the rectangles get thinner]
    - [Method of exhaustion, Archimedes' way of showing an area is neither more nor less than a value]
    - [Fundamental theorem of calculus, The derivative of the area function is the original function]
    - [Derivative, The limit of secant slopes]
  distractors: [The sum of a convergent geometric series]
  explanation: |-
    A Riemann sum is a finite estimate; its limit is the definite integral. Archimedes avoided limits with the method of exhaustion, a double proof by contradiction. The derivative solves the tangent problem as a limit of secant slopes, and the FTC links derivatives and areas.
- id: pc-h1-r2-h54
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'For $y = x^2$ on $[0, 1]$, the right-endpoint sum with $n$ rectangles is $R_n = \frac{(n+1)(2n+1)}{6n^2}$. What is $R_{10}$?'
  choices: ['$0.285$', '$0.3333$', '$0.385$', '$0.335$']
  answer: 2
  explanation: |-
    $R_{10} = \frac{11 \cdot 21}{600} = \frac{231}{600} = 0.385$, above the true area $\frac13$ because right endpoints overshoot a rising curve. 0.285 is the left-endpoint sum $\frac{9 \cdot 19}{600}$, and 0.3333 is the limit, not $R_{10}$.
- id: pc-h1-r2-h55
  lesson: pc-h1-area
  topic: Area and integration
  stem: 'Riemann sums with $\sum i = \frac{n(n+1)}{2}$ give $\int_0^b x\,dx = \frac{b^2}{2}$. Use this to find the area under $y = 2x$ from 0 to 5.'
  choices: ['$25$', '$12.5$', '$50$', '$10$']
  answer: 0
  explanation: |-
    Doubling the height doubles every rectangle, so the area is $2 \cdot \frac{5^2}{2} = 25$. Check with geometry: the region is a right triangle with base 5 and height 10, area $\frac12 \cdot 5 \cdot 10 = 25$. 12.5 forgets the factor 2, and 10 is the height at $x = 5$.
- id: pc-h1-r2-h56
  lesson: pc-h1-area
  type: text
  topic: Area and integration
  stem: 'For the region between $y = 9 - x^2$ and the $x$-axis, the inscribed triangle with vertices $(-3, 0)$, $(3, 0)$ and $(0, 9)$ has area ___, and the whole region has area ___.'
  accept:
    - ['27']
    - ['36']
  explanation: |-
    The triangle has base 6 and height 9: $\frac12 \cdot 6 \cdot 9 = 27$. Archimedes' segment is $\frac43$ of it: $\frac43 \cdot 27 = 36$.
