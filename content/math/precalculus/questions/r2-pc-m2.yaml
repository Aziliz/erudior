- id: pc-m2-r2-h29
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: '$f(x) = -x^3$ has inverse $f^{-1}(x) = -\sqrt[3]{x}$. Which point lies on both graphs but not on the line $y = x$?'
  choices: ['$(1, 1)$', '$(2, -8)$', '$(-1, -1)$', '$(1, -1)$']
  answer: 3
  explanation: |-
    $f(1) = -1$ and $f^{-1}(1) = -\sqrt[3]{1} = -1$, so $(1, -1)$ is on both. For a decreasing function the graphs of $f$ and $f^{-1}$ can meet off the line $y = x$. $(2, -8)$ is on $f$ only; $(1, 1)$ and $(-1, -1)$ are on neither.
- id: pc-m2-r2-h30
  lesson: pc-m2-h-composition-algebra
  topic: Fixed points and iteration
  stem: 'Iterate $f(x) = 0.5x + 3$ from $x_0 = 10$. What is $x_3$?'
  choices: ['$7$', '$6.25$', '$6.5$', '$5.5$']
  answer: 2
  explanation: |-
    $x_1 = 8$, $x_2 = 7$, $x_3 = 6.5$. Or use the fixed point $p = \frac{3}{1 - 0.5} = 6$: $x_3 - 6 = 0.5^3(10 - 6) = 0.5$, so $x_3 = 6.5$. The distance to 6 halves each step.
