# Round 2, module pc-m2: new question types for core lessons 04-07 and two honors lessons.
# ---------------------------------------------------------------- Lesson 04: parent functions
- id: pc-m2-r2-q01
  lesson: pc-parent-functions
  module_quiz: true
  topic: Parent functions
  type: label
  stem: 'Name the parent function shown in each numbered panel. All six panels use the same axes, from $-3$ to $3$.'
  image: {src: images/pc-m2-parent-gallery-blank.svg, alt: 'Six small graphs on identical axes. Panel 1 is a U shape with its lowest point at the origin. Panel 2 rises from the lower left through the origin to the upper right, flattening at the origin. Panel 3 starts at the origin and rises to the right, flattening. Panel 4 is an S shape on its side that is steep at the origin. Panel 5 is a V with its point at the origin. Panel 6 has two separate branches in the first and third quadrants that hug the axes.'}
  labels:
    - {x: 18.6, y: 44.1, text: Squaring}
    - {x: 50.0, y: 44.1, text: Cubing}
    - {x: 81.4, y: 44.1, text: Square root}
    - {x: 18.6, y: 91.2, text: Cube root}
    - {x: 50.0, y: 91.2, text: Absolute value}
    - {x: 81.4, y: 91.2, text: Reciprocal}
  distractors: [Reciprocal squared, Greatest integer]
  explanation: |-
    The U (1) is $x^2$. The graph that flattens at the origin and rises steeply on both sides in opposite directions (2) is $x^3$. The half-graph starting at the origin (3) is $\sqrt{x}$, which is only defined for $x \ge 0$. The sideways S that is steepest at the origin (4) is $\sqrt[3]{x}$. The V (5) is $\lvert x \rvert$. Two branches in opposite quadrants (6) is $\frac1x$; the reciprocal squared $\frac{1}{x^2}$ would have both branches above the $x$-axis.
- id: pc-m2-r2-q02
  lesson: pc-parent-functions
  topic: Even and odd functions
  type: text
  stem: '$f$ is an even function and $g$ is an odd function, with $f(4) = 6$ and $g(4) = -2$. Then $f(-4) =$ ___ and $g(-4) =$ ___.'
  accept:
    - ['6']
    - ['2']
  explanation: |-
    Even means $f(-4) = f(4) = 6$. Odd means $g(-4) = -g(4) = -(-2) = 2$.
- id: pc-m2-r2-q03
  lesson: pc-parent-functions
  module_quiz: true
  topic: Even and odd functions
  type: match
  stem: 'Match each function to its symmetry type.'
  pairs:
    - ['$x^5 - 2x$', Odd]
    - ['$x^4 + x^2 - 7$', Even]
    - ['$x^3 + x^2$', Neither]
    - ['$\lvert x \rvert + x^2$', Even]
    - ['$\dfrac{x}{x^2 + 1}$', Odd]
  explanation: |-
    $x^5 - 2x$ has only odd powers, so it is odd. $x^4 + x^2 - 7$ has only even powers (the constant counts as $x^0$), so it is even. $x^3 + x^2$ mixes odd and even powers, so it is neither. $\lvert -x \rvert + (-x)^2 = \lvert x \rvert + x^2$, so that one is even. $\frac{-x}{(-x)^2 + 1} = -\frac{x}{x^2 + 1}$, so the last is odd.
- id: pc-m2-r2-q04
  lesson: pc-parent-functions
  topic: Even and odd functions
  stem: 'Which of these parent functions are odd? Select all that apply.'
  choices: ['$x^3$', '$\sqrt[3]{x}$', '$\dfrac1x$', '$\lvert x \rvert$', '$\sqrt{x}$', '$\dfrac{1}{x^2}$']
  answer: [0, 1, 2]
  explanation: |-
    $(-x)^3 = -x^3$, $\sqrt[3]{-x} = -\sqrt[3]{x}$ and $\frac{1}{-x} = -\frac1x$, so these three are odd (origin symmetry). $\lvert x \rvert$ and $\frac{1}{x^2}$ are even. $\sqrt{x}$ is neither: its domain $[0, \infty)$ is not symmetric about 0, so $f(-x)$ is not even defined for $x > 0$.
- id: pc-m2-r2-q05
  lesson: pc-parent-functions
  topic: Parent functions
  type: order
  stem: 'Order these parent functions by their value at $x = 4$, smallest first.'
  items: ['$\dfrac1x$', '$\sqrt[3]{x}$', '$\sqrt{x}$', '$\lvert x \rvert$', '$x^2$', '$x^3$']
  explanation: |-
    At $x = 4$: $\frac14 = 0.25$, $\sqrt[3]{4} \approx 1.59$, $\sqrt{4} = 2$, $\lvert 4 \rvert = 4$, $4^2 = 16$, $4^3 = 64$. For inputs greater than 1, roots shrink a number and powers enlarge it.
# ---------------------------------------------------------------- Lesson 05: transformations
- id: pc-m2-r2-q06
  lesson: pc-transformations
  module_quiz: true
  topic: Transformations
  type: label
  stem: 'Each panel shows $y = \sqrt{x}$ (dashed) and one transformation of it (solid). Name the transformation in each numbered panel.'
  image: {src: images/pc-m2-transform-panels-blank.svg, alt: 'Four panels with grid lines and tick labels at −4, −2, 2 and 4. Each shows the dashed square root curve starting at the origin and a solid curve. Panel 1: the solid curve has the same shape but starts at (3, 0). Panel 2: it starts at (0, 2). Panel 3: it starts at the origin and goes down to the right, below the x-axis. Panel 4: it starts at the origin and goes up to the left.'}
  labels:
    - {x: 26.1, y: 44.2, text: Shifted right 3}
    - {x: 73.9, y: 44.2, text: Shifted up 2}
    - {x: 26.1, y: 91.6, text: Reflected across the x-axis}
    - {x: 73.9, y: 91.6, text: Reflected across the y-axis}
  distractors: [Shifted left 3, Shifted down 2, Vertically stretched by 2]
  explanation: |-
    Panel 1 starts at $(3, 0)$ with the same shape: $y = \sqrt{x - 3}$, a shift right 3. Panel 2 starts at $(0, 2)$: $y = \sqrt{x} + 2$, a shift up 2. Panel 3 is the parent flipped below the $x$-axis: $y = -\sqrt{x}$. Panel 4 is the parent flipped to the left of the $y$-axis: $y = \sqrt{-x}$.
- id: pc-m2-r2-q07
  lesson: pc-transformations
  topic: Transformations
  type: text
  stem: 'The point $(4, 2)$ is on $y = \sqrt{x}$. On the graph of $y = -2\sqrt{x + 5} + 1$ it moves to the point ( ___ , ___ ). Give each coordinate as a number.'
  accept:
    - ['-1']
    - ['-3']
  explanation: |-
    Here $a = -2$, $b = 1$, $h = -5$, $k = 1$. New $x$: $4 - 5 = -1$. New $y$: $-2(2) + 1 = -3$. Check: at $x = -1$, $-2\sqrt{4} + 1 = -3$. ✓
- id: pc-m2-r2-q08
  lesson: pc-transformations
  topic: Transformations
  type: order
  stem: 'Order these graphs by the $x$-coordinate of their vertex (for the square root graph, its starting point), from smallest to largest.'
  items: ['$y = \lvert x + 4 \rvert$', '$y = \lvert 2x + 6 \rvert$', '$y = (x + 1)^2 - 7$', '$y = \sqrt{3x - 6}$', '$y = (x - 5)^2$']
  explanation: |-
    $\lvert x + 4 \rvert$: vertex at $x = -4$. $\lvert 2x + 6 \rvert = 2\lvert x + 3 \rvert$: factor first, vertex at $x = -3$ (not $-6$). $(x + 1)^2 - 7$: $x = -1$. $\sqrt{3x - 6} = \sqrt{3(x - 2)}$: starts at $x = 2$ (not 6). $(x - 5)^2$: $x = 5$.
- id: pc-m2-r2-q09
  lesson: pc-transformations
  module_quiz: true
  topic: Transformations
  stem: 'Which transformations of $y = f(x)$ keep every $x$-intercept of the graph at exactly the same point? Select all that apply.'
  choices: ['$y = 3f(x)$', '$y = -f(x)$', '$y = f(x) + 2$', '$y = \tfrac12 f(x)$', '$y = f(x - 2)$', '$y = f(2x)$']
  answer: [0, 1, 3]
  explanation: |-
    An $x$-intercept has $f(p) = 0$. Multiplying the output by any number (3, $-1$, $\tfrac12$) still gives 0 at $x = p$, so those intercepts stay put. Adding 2 lifts the point to height 2. $f(x - 2)$ moves the intercept to $p + 2$, and $f(2x)$ moves it to $\tfrac p2$ (only an intercept at the origin would stay).
- id: pc-m2-r2-q10
  lesson: pc-transformations
  topic: Transformations
  type: match
  stem: 'Match each equation to how it changes the graph of $y = f(x)$.'
  pairs:
    - ['$y = f(x) - 4$', Shifted down 4]
    - ['$y = f(x - 4)$', Shifted right 4]
    - ['$y = f(x + 4)$', Shifted left 4]
    - ['$y = 4f(x)$', Vertical stretch by a factor of 4]
    - ['$y = f(4x)$', Horizontal compression by a factor of 1/4]
  distractors: [Shifted up 4, Horizontal stretch by a factor of 4]
  explanation: |-
    Outside changes act on outputs as written: $-4$ moves down, $\times 4$ stretches vertically. Inside changes do the opposite of what they look like: $x - 4$ moves right, $x + 4$ moves left, and $4x$ squeezes toward the $y$-axis by $\tfrac14$.
# ---------------------------------------------------------------- Lesson 06: composition
- id: pc-m2-r2-q11
  lesson: pc-composition
  topic: Composition
  type: text
  stem: |-
    Use the table. $f(g(1)) =$ ___ and $g(f(3)) =$ ___.

    $\begin{array}{c|cccc} x & 1 & 2 & 3 & 4 \\ \hline f(x) & 3 & 1 & 4 & 2 \\ g(x) & 2 & 3 & 1 & 4 \end{array}$
  accept:
    - ['1']
    - ['4']
  explanation: |-
    Inside first. $g(1) = 2$, so $f(g(1)) = f(2) = 1$. $f(3) = 4$, so $g(f(3)) = g(4) = 4$.
- id: pc-m2-r2-q12
  lesson: pc-composition
  topic: Composition
  type: order
  stem: 'To evaluate $F(x) = \left(\sqrt{x + 7}\right)^3 - 1$ at $x = 2$, put the steps in the order they are done.'
  items: [Add 7 to get 9, Take the square root to get 3, Cube to get 27, Subtract 1 to get 26]
  explanation: |-
    $F$ is a composition of four steps, applied from the inside out: $2 + 7 = 9$, $\sqrt9 = 3$, $3^3 = 27$, $27 - 1 = 26$.
- id: pc-m2-r2-q13
  lesson: pc-composition
  module_quiz: true
  topic: Composition
  stem: 'Let $f(x) = \dfrac{1}{x - 1}$ and $g(x) = \sqrt{x}$. Which numbers are in the domain of $f \circ g$? Select all that apply.'
  choices: ['$0$', '$1$', '$4$', '$-4$', '$\tfrac14$']
  answer: [0, 2, 4]
  explanation: |-
    $f(g(x)) = \dfrac{1}{\sqrt{x} - 1}$. First $x$ must be in the domain of $g$: $x \ge 0$, which rules out $-4$. Then $g(x) = \sqrt{x}$ must be in the domain of $f$: $\sqrt{x} \ne 1$, which rules out $x = 1$. So $0$, $4$ and $\tfrac14$ are in the domain.
- id: pc-m2-r2-q14
  lesson: pc-composition
  topic: Composition
  type: match
  stem: 'Each function is written as $H = f \circ g$. Match it to the natural inner function $g$ (the first chunk computed from $x$).'
  pairs:
    - ['$H(x) = (3x + 2)^4$', 3x + 2]
    - ['$H(x) = \sqrt{x^2 + 5}$', x² + 5]
    - ['$H(x) = \dfrac{1}{x - 6}$', x − 6]
    - ['$H(x) = \lvert 5 - x \rvert$', 5 − x]
  distractors: [x⁴, √x]
  explanation: |-
    In each case the inner function is the expression the outer operation acts on: raise $3x + 2$ to the 4th power, take the square root of $x^2 + 5$, take the reciprocal of $x - 6$, take the absolute value of $5 - x$. $x^4$ and $\sqrt{x}$ are outer functions, not inner ones.
# ---------------------------------------------------------------- Lesson 07: inverses
- id: pc-m2-r2-q15
  lesson: pc-inverses
  module_quiz: true
  topic: Inverse functions
  type: label
  stem: 'The graph shows $f(x) = 2^x - 1$, its inverse and one more line. Name the numbered items.'
  image: {src: images/pc-m2-inverse-mirror-blank.svg, alt: 'A coordinate grid from −2 to 6 on both axes. A steep rising curve and a slowly rising curve cross at the origin and at (1, 1). A dashed line passes diagonally through the origin. Two points, one on each curve, are joined by a short dashed segment that crosses the diagonal line at a right angle.'}
  labels:
    - {x: 56.9, y: 20.8, text: Graph of f}
    - {x: 85.1, y: 41.6, text: Graph of the inverse of f}
    - {x: 80.7, y: 19.3, text: Line y = x}
    - {x: 51.9, y: 37.0, text: 'Point (2, 3)'}
    - {x: 63.0, y: 48.1, text: 'Point (3, 2)'}
  distractors: [Line y = −x, 'Point (0, 1)']
  explanation: |-
    $2^x - 1$ grows faster and faster, so it is the steep curve (1); its inverse $\log_2(x + 1)$ is the slowly rising curve (2). The dashed diagonal (3) is $y = x$, the mirror line. $f(2) = 3$ puts $(2, 3)$ on $f$ (4), and swapping coordinates gives $(3, 2)$ on the inverse (5). The segment joining them is cut in half at a right angle by $y = x$.
- id: pc-m2-r2-q16
  lesson: pc-inverses
  topic: Inverse functions
  type: text
  stem: 'Let $f(x) = \sqrt{x - 2} + 5$. The domain of $f^{-1}$ is $x \ge$ ___. Give only the number.'
  accept: ['5']
  explanation: |-
    The domain of $f^{-1}$ is the range of $f$. A square root is never negative, so $\sqrt{x - 2} + 5 \ge 5$, and every value from 5 up is reached. So $x \ge 5$. (The 2 is the domain of $f$, which becomes the range of $f^{-1}$.)
- id: pc-m2-r2-q17
  lesson: pc-inverses
  module_quiz: true
  topic: Inverse functions
  type: order
  stem: 'Put the steps for finding the inverse of $f(x) = \dfrac{x - 4}{3}$ in order.'
  items: ['Write $y = \dfrac{x - 4}{3}$', 'Swap: $x = \dfrac{y - 4}{3}$', 'Multiply by 3: $3x = y - 4$', 'Add 4: $y = 3x + 4$', 'Check: $f(3x + 4) = \dfrac{3x}{3} = x$']
  explanation: |-
    Write $y = f(x)$, swap $x$ and $y$, then solve for $y$ (multiply by 3 before adding 4, since the 4 is inside the fraction), and finally check with a composition. So $f^{-1}(x) = 3x + 4$.
- id: pc-m2-r2-q18
  lesson: pc-inverses
  topic: Inverse functions
  stem: 'Which functions are one-to-one on their whole domain? Select all that apply.'
  choices: ['$x^3$', '$x^2$', '$\sqrt{x}$', '$\lvert x \rvert$', '$\dfrac1x$', '$x^4 - 1$']
  answer: [0, 2, 4]
  explanation: |-
    $x^3$ and $\sqrt{x}$ are always increasing, and $\frac1x$ never repeats an output (each $y \ne 0$ comes from exactly $x = \frac1y$). $x^2$, $\lvert x \rvert$ and $x^4 - 1$ fail the horizontal line test: $x$ and $-x$ give the same output.
- id: pc-m2-r2-q19
  lesson: pc-inverses
  topic: Inverse functions
  type: match
  stem: 'Match each one-to-one function to its inverse.'
  pairs:
    - ['$x + 3$', x − 3]
    - ['$2x$', x/2]
    - ['$x^3$', ∛x]
    - ['$\dfrac1x$', 1/x]
    - ['$\sqrt{x}$', 'x², for x ≥ 0']
  distractors: [2/x, 'x², for all x']
  explanation: |-
    Each inverse undoes its function: subtract 3 undoes add 3, halving undoes doubling, the cube root undoes cubing. $\frac1x$ is its own inverse, since $\frac{1}{1/x} = x$. The inverse of $\sqrt{x}$ is $x^2$ restricted to $x \ge 0$, because its domain must be the range of $\sqrt{x}$.
# ---------------------------------------------------------------- Honors 1: symmetry beyond even and odd
- id: pc-m2-r2-h01
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'About which vertical line is the graph of $f(x) = 3x^2 + 12x - 1$ symmetric?'
  choices: ['$x = 2$', '$x = -2$', '$x = -4$', '$x = -6$']
  answer: 1
  explanation: |-
    The axis is $x = -\tfrac{b}{2a} = -\tfrac{12}{6} = -2$. Check: $f(-2 + t) = 3t^2 - 13$, which is even in $t$. $x = 2$ has the wrong sign, and $x = -4$ comes from forgetting the 2 in $2a$.
- id: pc-m2-r2-h02
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'About which vertical line is the graph of $f(x) = \lvert x - 4 \rvert + \lvert x + 2 \rvert$ symmetric?'
  choices: ['$x = -1$', '$x = 3$', '$x = 2$', '$x = 1$']
  answer: 3
  explanation: |-
    The two corners are at $x = 4$ and $x = -2$, and their midpoint is $x = 1$. Test it: $f(1 + t) = \lvert t - 3 \rvert + \lvert t + 3 \rvert$, and replacing $t$ by $-t$ gives $\lvert -t - 3 \rvert + \lvert -t + 3 \rvert = \lvert t + 3 \rvert + \lvert t - 3 \rvert$, the same. So $f(1 + t)$ is even in $t$.
- id: pc-m2-r2-h03
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'What is the center of symmetry of the cubic $f(x) = x^3 + 3x^2 - 2$?'
  choices: ['$(1, 2)$', '$(0, -2)$', '$(-1, 0)$', '$(-1, -2)$']
  answer: 2
  explanation: |-
    With $A = 1$, $B = 3$: $x = -\tfrac{B}{3A} = -1$, and $f(-1) = -1 + 3 - 2 = 0$. The center is $(-1, 0)$. Check: $f(-1 + t) = t^3 - 3t$, which is odd.
- id: pc-m2-r2-h04
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'The graph of $f$ is symmetric about the point $(2, 5)$, and $f(-1) = 3$. Find $f(5)$.'
  choices: ['$7$', '$3$', '$-3$', '$13$']
  answer: 0
  explanation: |-
    $-1$ and $5$ are both 3 units from $x = 2$, so $f(-1) + f(5) = 2 \cdot 5 = 10$, giving $f(5) = 7$. The answer $-3$ comes from using origin symmetry; $3$ from using line symmetry.
- id: pc-m2-r2-h05
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'The function $f(x) = \dfrac{4x + 1}{x + 2}$ can be written $4 - \dfrac{7}{x + 2}$. What is its center of symmetry?'
  choices: ['$(2, 4)$', '$(4, -2)$', '$(-2, \tfrac12)$', '$(-2, 4)$']
  answer: 3
  explanation: |-
    $-\frac7x$ is odd, so it is symmetric about the origin. Shifting it left 2 and up 4 moves the center to $(-2, 4)$, where the asymptotes $x = -2$ and $y = 4$ cross. ($\tfrac12$ is $f(0)$, the $y$-intercept, not the center height.)
- id: pc-m2-r2-h06
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'Which function is odd?'
  choices: ['$x^2 \lvert x \rvert$', '$x\,(x^2 + 1)^3$', '$(x^3 - x)^2$', '$\lvert x \rvert + x$']
  answer: 1
  explanation: |-
    $x$ is odd and $(x^2 + 1)^3$ is even (a function of the even $x^2 + 1$), and odd $\times$ even is odd. $x^2 \lvert x \rvert$ is even $\times$ even, so even; $(x^3 - x)^2$ is a square of an odd function, so even; $\lvert x \rvert + x$ is a nonzero even plus a nonzero odd function, so neither.
- id: pc-m2-r2-h07
  lesson: pc-m2-h-symmetry
  topic: Even and odd parts
  stem: 'What is the even part of $f(x) = x^3 - 4x^2 + 2x + 7$?'
  choices: ['$x^3 + 2x$', '$-4x^2$', '$-4x^2 + 7$', '$x^3 - 4x^2$']
  answer: 2
  explanation: |-
    For a polynomial the even part is the even-power terms, including the constant ($x^0$): $-4x^2 + 7$. The odd part is $x^3 + 2x$. Check with the formula: $\frac{f(x) + f(-x)}{2} = \frac{2(-4x^2 + 7)}{2}$.
- id: pc-m2-r2-h08
  lesson: pc-m2-h-symmetry
  topic: Even and odd parts
  stem: 'A function has $f(3) = 10$ and $f(-3) = 4$. What is its odd part at 3, $O(3)$?'
  choices: ['$3$', '$7$', '$6$', '$-3$']
  answer: 0
  explanation: |-
    $O(3) = \frac{f(3) - f(-3)}{2} = \frac{10 - 4}{2} = 3$. The 7 is the even part $E(3) = \frac{10 + 4}{2}$; and $E(3) + O(3) = 10 = f(3)$, as it should.
- id: pc-m2-r2-h09
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  type: text
  stem: 'The center of symmetry of $f(x) = 2x^3 - 12x^2 + 5$ has $x$-coordinate ___ and $y$-coordinate ___.'
  accept:
    - ['2']
    - ['-27']
  explanation: |-
    $x = -\tfrac{B}{3A} = -\tfrac{-12}{6} = 2$ and $f(2) = 16 - 48 + 5 = -27$. The center is $(2, -27)$.
- id: pc-m2-r2-h10
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  type: match
  stem: 'Match each function to the symmetry of its graph.'
  pairs:
    - ['$x^2 - 6x$', Symmetric about the line x = 3]
    - ['$(x - 1)^3 + 2$', 'Symmetric about the point (1, 2)']
    - ['$\lvert x + 5 \rvert$', Symmetric about the line x = −5]
    - ['$\dfrac{1}{x - 3} - 1$', 'Symmetric about the point (3, −1)']
  distractors: [Symmetric about the line x = −3, 'Symmetric about the point (−1, 2)']
  explanation: |-
    $x^2 - 6x$ has axis $x = -\tfrac{-6}{2} = 3$. $(x - 1)^3 + 2$ is the odd $x^3$ moved right 1 and up 2, so its center is $(1, 2)$. $\lvert x + 5 \rvert$ is the even $\lvert x \rvert$ moved left 5. $\frac{1}{x - 3} - 1$ is the odd $\frac1x$ moved right 3 and down 1.
- id: pc-m2-r2-h11
  lesson: pc-m2-h-symmetry
  topic: Even and odd parts
  stem: 'All domains are symmetric about 0. Which statements are always true? Select all that apply.'
  choices: [The product of two odd functions is even., The sum of two odd functions is odd., The product of an even function and an odd function is even., 'If g is even, then f(g(x)) is even for every function f.', The sum of a nonzero even function and a nonzero odd function is even.]
  answer: [0, 1, 3]
  explanation: |-
    Odd $\times$ odd: $(-f)(-g) = fg$, even. Odd $+$ odd: $-f - g = -(f + g)$, odd. Even $\times$ odd is odd, not even. If $g$ is even, $f(g(-x)) = f(g(x))$ whatever $f$ is. A nonzero even plus a nonzero odd function is neither: if it were even, the odd part would have to be both even and odd, hence zero.
- id: pc-m2-r2-h12
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  type: label
  stem: 'The graph shows $f(x) = x^3 - 6x^2 + 9x + 1$. Name the numbered points.'
  image: {src: images/pc-m2-cubic-center-blank.svg, alt: 'A cubic curve on a grid from −1 to 5 horizontally and −1 to 7 vertically. It rises to a peak at (1, 5), falls through (2, 3) to a low point at (3, 1), then rises steeply. A dashed segment joins (0, 1) and (4, 5) through the point (2, 3), which is drawn larger.'}
  labels:
    - {x: 50.9, y: 48.9, text: Center of symmetry}
    - {x: 36.3, y: 26.6, text: Local maximum}
    - {x: 65.5, y: 71.2, text: Local minimum}
    - {x: 21.7, y: 71.2, text: y-intercept}
  distractors: [Vertex, x-intercept]
  explanation: |-
    The center is at $x = -\tfrac{-6}{3} = 2$, $f(2) = 3$: point 1, the midpoint of every pair of symmetric points. The peak $(1, 5)$ is the local maximum (2) and the low point $(3, 1)$ the local minimum (3); their midpoint is $(2, 3)$. Point 4 is $(0, f(0)) = (0, 1)$, the $y$-intercept. "Vertex" is a word for parabolas and absolute value graphs.
- id: pc-m2-r2-h13
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  type: order
  stem: 'Put the steps of the proof that every cubic $Ax^3 + Bx^2 + Cx + D$ has a center of symmetry in order.'
  items: ['Substitute $x = a + t$ and expand', 'Find the coefficient of $t^2$: $3Aa + B$', 'Choose $a = -\tfrac{B}{3A}$ so that coefficient is 0', 'Subtract $f(a)$, leaving only odd powers of $t$', 'Conclude the graph is symmetric about $(a, f(a))$']
  explanation: |-
    Shift first (substitute $x = a + t$), then look at the $t^2$ coefficient, choose $a$ to make it vanish, subtract $f(a)$ so that $f(a + t) - f(a) = At^3 + (\text{number})t$ is odd, and conclude point symmetry about $(a, f(a))$. Each step uses the one before it.
- id: pc-m2-r2-h14
  lesson: pc-m2-h-symmetry
  topic: Symmetry about a line or point
  stem: 'For a function $f$ defined for all real numbers, which of these is always an even function?'
  choices: ['$\lvert f(x) \rvert$', '$f(x) + \lvert x \rvert$', '$-f(x)$', '$f(\lvert x \rvert)$']
  answer: 3
  explanation: |-
    $f(\lvert -x \rvert) = f(\lvert x \rvert)$, so $f(\lvert x \rvert)$ is always even: it keeps the right half of $f$ and mirrors it. $\lvert f(x) \rvert$ only flips negative outputs up; for $f(x) = x - 2$, $\lvert f(1) \rvert = 1$ but $\lvert f(-1) \rvert = 3$. The other two are even only if $f$ is.
- id: pc-m2-r2-h15
  lesson: pc-m2-h-symmetry
  topic: Even and odd parts
  type: text
  stem: 'For $f(x) = 2^x$, the even part at $x = 2$ is $E(2) =$ ___.'
  accept: ['2.125', '17/8']
  explanation: |-
    $E(2) = \frac{2^2 + 2^{-2}}{2} = \frac{4 + 0.25}{2} = 2.125 = \frac{17}{8}$.
# ---------------------------------------------------------------- Honors 2: algebra of composition, inverses and iteration
- id: pc-m2-r2-h16
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: '$f$ and $g$ are one-to-one. Which function is $(f \circ g)^{-1}$?'
  choices: ['$f^{-1} \circ g^{-1}$', '$g^{-1} \circ f^{-1}$', '$\dfrac{1}{f(g(x))}$', '$g \circ f$']
  answer: 1
  explanation: |-
    $f \circ g$ applies $g$ first and $f$ last, so the inverse undoes $f$ first: $(f \circ g)^{-1} = g^{-1} \circ f^{-1}$. Check: $(f \circ g) \circ (g^{-1} \circ f^{-1}) = f \circ (g \circ g^{-1}) \circ f^{-1} = f \circ f^{-1} = I$. The $-1$ is not a reciprocal.
- id: pc-m2-r2-h17
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: 'Find the inverse of $h(x) = \left(\tfrac{x}{2} + 1\right)^3$.'
  choices: ['$2\sqrt[3]{x} - 1$', '$\sqrt[3]{2x} - 1$', '$2\left(\sqrt[3]{x} - 1\right)$', '$\sqrt[3]{\tfrac{x}{2} - 1}$']
  answer: 2
  explanation: |-
    $h$ divides by 2, adds 1, then cubes. Undo in reverse order: cube root, subtract 1, multiply by 2: $h^{-1}(x) = 2(\sqrt[3]{x} - 1)$. Check: $h(2) = 2^3 = 8$ and $2(\sqrt[3]{8} - 1) = 2$. ✓ The choice $2\sqrt[3]{x} - 1$ multiplies before subtracting.
- id: pc-m2-r2-h18
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: '$f$ is one-to-one with $f(1) = 4$. Let $g(x) = 3f(x - 2) + 1$. Find $g^{-1}(13)$.'
  choices: ['$1$', '$-1$', '$7$', '$3$']
  answer: 3
  explanation: |-
    By the formula $g^{-1}(x) = h + \frac1b f^{-1}\!\left(\frac{x - k}{a}\right)$ with $a = 3$, $b = 1$, $h = 2$, $k = 1$: $g^{-1}(13) = 2 + f^{-1}(4) = 2 + 1 = 3$. Directly: $3f(x - 2) + 1 = 13$ gives $f(x - 2) = 4$, so $x - 2 = 1$. Forgetting the shift gives 1; shifting the wrong way gives $-1$.
- id: pc-m2-r2-h19
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: 'Find the inverse of $f(x) = \dfrac{2x - 5}{x + 4}$.'
  choices: ['$\dfrac{4x + 5}{2 - x}$', '$\dfrac{4x - 5}{x - 2}$', '$\dfrac{x + 4}{2x - 5}$', '$\dfrac{-4x + 5}{x + 2}$']
  answer: 0
  explanation: |-
    With $a = 2$, $b = -5$, $c = 1$, $d = 4$ ($ad - bc = 13 \ne 0$): swap $a$ and $d$ and negate $b$ and $c$ to get $\dfrac{4x + 5}{-x + 2}$. Check: $f(0) = -\tfrac54$ and $\dfrac{-5 + 5}{2 + \frac54} = 0$. ✓ $\frac{x + 4}{2x - 5}$ is the reciprocal $\frac{1}{f(x)}$, not the inverse.
- id: pc-m2-r2-h20
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: 'Which function is an involution (its own inverse)?'
  choices: ['$\dfrac{3x + 1}{2x + 3}$', '$\dfrac{3x + 1}{2x - 3}$', '$\dfrac{x + 1}{x - 2}$', '$2x$']
  answer: 1
  explanation: |-
    A linear fractional function $\frac{ax + b}{cx + d}$ is its own inverse when $d = -a$ (and $ad - bc \ne 0$). For $\frac{3x + 1}{2x - 3}$, $d = -3 = -a$ and $ad - bc = -9 - 2 = -11 \ne 0$. The inverse of $2x$ is $\frac{x}{2}$, not itself.
- id: pc-m2-r2-h21
  lesson: pc-m2-h-composition-algebra
  topic: Fixed points and iteration
  stem: 'Find the fixed point of $f(x) = 3x - 4$ and describe what iteration does near it.'
  choices: ['$2$; the iterates approach it', '$-2$; the iterates approach it', '$2$; the iterates move away from it', '$1$; the iterates move away from it']
  answer: 2
  explanation: |-
    $3p - 4 = p$ gives $p = 2$. For $f(x) = mx + c$ the distance to the fixed point is multiplied by $\lvert m \rvert = 3$ each step, so iterates move away (from $x_0 = 3$: $5, 11, 29, \ldots$).
- id: pc-m2-r2-h22
  lesson: pc-m2-h-composition-algebra
  topic: Fixed points and iteration
  stem: 'Iterate $f(x) = x^2 - 1$ starting from $x_0 = 0$. What is $x_5$?'
  choices: ['$-1$', '$0$', '$1$', '$24$']
  answer: 0
  explanation: |-
    $x_1 = 0^2 - 1 = -1$, $x_2 = 1 - 1 = 0$, $x_3 = -1$, $x_4 = 0$, $x_5 = -1$. The iterates cycle between 0 and $-1$ forever instead of settling at a fixed point: iteration need not converge.
- id: pc-m2-r2-h23
  lesson: pc-m2-h-composition-algebra
  topic: Fixed points and iteration
  type: text
  stem: 'The function $f(x) = \sqrt{2x + 3}$ has exactly one fixed point, $x =$ ___. Give only the number.'
  accept: ['3']
  explanation: |-
    Solve $\sqrt{2x + 3} = x$. Squaring: $x^2 - 2x - 3 = 0$, so $x = 3$ or $x = -1$. But $f(-1) = 1 \ne -1$ (a square root is never negative), so $-1$ is extraneous. The fixed point is 3: $\sqrt{9} = 3$.
- id: pc-m2-r2-h24
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  type: text
  stem: 'Let $f(x) = \dfrac{5x - 2}{x + 3}$. Then $f^{-1}(1) =$ ___. Give an exact value.'
  accept: ['5/4', '1.25']
  explanation: |-
    $f^{-1}(x) = \dfrac{3x + 2}{-x + 5}$ (swap $a$ and $d$, negate $b$ and $c$), so $f^{-1}(1) = \frac{5}{4}$. Check: $f\!\left(\tfrac54\right) = \dfrac{\frac{25}{4} - 2}{\frac54 + 3} = \dfrac{17/4}{17/4} = 1$. ✓
- id: pc-m2-r2-h25
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  type: order
  stem: '$h(x) = 3\sqrt[3]{x + 2} - 1$. Put the steps of $h^{-1}$ in the order they are applied to $x$.'
  items: [Add 1, Divide by 3, Cube, Subtract 2]
  explanation: |-
    $h$ adds 2, takes the cube root, multiplies by 3, then subtracts 1. The inverse undoes these in reverse: add 1, divide by 3, cube, subtract 2. So $h^{-1}(x) = \left(\frac{x + 1}{3}\right)^3 - 2$.
- id: pc-m2-r2-h26
  lesson: pc-m2-h-composition-algebra
  topic: Fixed points and iteration
  type: match
  stem: 'Match each term to its description.'
  pairs:
    - [Identity function, Leaves every input unchanged]
    - [Involution, Is its own inverse]
    - [Fixed point, An input that the function sends to itself]
    - [Cobweb diagram, Pictures iteration using the graph and the line y = x]
  distractors: [Passes the horizontal line test]
  explanation: |-
    $I(x) = x$ is the identity. An involution satisfies $f(f(x)) = x$. A fixed point has $f(p) = p$. A cobweb diagram alternates vertical steps to the graph with horizontal steps to $y = x$. Passing the horizontal line test describes a one-to-one function.
- id: pc-m2-r2-h27
  lesson: pc-m2-h-composition-algebra
  topic: Algebra of composition
  stem: 'Which functions are involutions (equal to their own inverse)? Select all that apply.'
  choices: ['$-x$', '$7 - x$', '$x + 7$', '$\dfrac{2x + 1}{x - 2}$', '$\dfrac{x + 1}{x + 2}$']
  answer: [0, 1, 3]
  explanation: |-
    $-(-x) = x$ and $7 - (7 - x) = x$. For $\frac{2x + 1}{x - 2}$, $d = -2 = -a$, so it is an involution. $x + 7$ applied twice gives $x + 14$. For $\frac{x + 1}{x + 2}$, $d = 2 \ne -a$; its inverse is $\frac{2x - 1}{1 - x}$.
