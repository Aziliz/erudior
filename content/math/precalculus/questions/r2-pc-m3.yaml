    The upright arrow on the left is the object; the rays from its tip meet at the upside-down arrow, the real image. The dots at equal distances on each side of the lens are the focal points (the ray that enters parallel to the axis bends through the right one). The horizontal line through the lens's center is the optical axis. The image here is real (rays actually meet), not virtual.
- id: pc-m3-r2-h35
  lesson: pc-m3-h-linear-fractional
  topic: Linear fractional functions
  stem: 'Let $g(x) = \dfrac{1}{1 - x}$. What is $g(g(5))$?'
  choices: ['$-\tfrac14$', '$\tfrac45$', '$5$', '$\tfrac54$']
  answer: 1
  explanation: |-
    $g(5) = \frac{1}{-4} = -\frac14$, then $g\left(-\frac14\right) = \dfrac{1}{1 + \frac14} = \frac45$. This matches $g(g(x)) = \frac{x - 1}{x}$ at $x = 5$. One more application gives $g\left(\frac45\right) = 5$, since $g(g(g(x))) = x$. $-\frac14$ is only $g(5)$.
- id: pc-m3-r2-h36
  lesson: pc-m3-h-linear-fractional
  type: order
  topic: Linear fractional functions
  stem: 'Put the steps for finding the inverse of $y = \dfrac{2x + 1}{x - 3}$ in order.'
  items:
    - 'Multiply both sides by $x - 3$: $y(x - 3) = 2x + 1$'
    - 'Expand: $xy - 3y = 2x + 1$'
    - 'Collect the $x$ terms: $xy - 2x = 3y + 1$'
    - 'Factor out $x$: $x(y - 2) = 3y + 1$'
    - 'Divide: $x = \dfrac{3y + 1}{y - 2}$'
  explanation: |-
    Clear the fraction, expand, gather every term containing $x$ on one side, factor out $x$ and divide. Renaming the variable gives $f^{-1}(x) = \dfrac{3x + 1}{x - 2}$, which matches the shortcut (swap $a$ and $d$, negate $b$ and $c$).
- id: pc-m3-r2-h37
  lesson: pc-m3-h-linear-fractional
  topic: Linear fractional functions
  stem: '$f(x) = 2 + \dfrac{7}{x - 3}$ has $f(10) = 3$. Use the center of symmetry to find $f(-4)$.'
  choices: ['$-3$', '$3$', '$4$', '$1$']
  answer: 3
  explanation: |-
    The center is $(3, 2)$, and $10$ and $-4$ are both 7 units from 3. So $f(10) + f(-4) = 2 \cdot 2 = 4$, giving $f(-4) = 4 - 3 = 1$. Directly: $2 + \frac{7}{-7} = 1$. The choice $-3$ reflects through $y = 0$ instead of the center.
- id: pc-m3-r2-h38
  lesson: pc-m3-h-linear-fractional
  topic: Linear fractional functions
  stem: 'Where does the graph of $f(x) = \dfrac{-2x + 1}{x - 1}$ lie, relative to its center?'
  choices: ['Upper right and lower left of the center $(1, -2)$', 'Upper left and lower right of the center $(-2, 1)$', 'Upper left and lower right of the center $(1, -2)$', 'Upper right and lower left of the center $(-1, 2)$']
  answer: 2
  explanation: |-
    Divide: $-2x + 1 = -2(x - 1) - 1$, so $f(x) = -2 - \dfrac{1}{x - 1}$, centered at $(1, -2)$ with $k = -1 < 0$. A negative $k$ reflects $\frac1x$, putting the branches upper left and lower right of the center. Check: $f(2) = -3$, below and to the right of $(1, -2)$.
