# Round 2, module pc-m8: cards for the honors lessons.
- front: 'Cross product as a determinant'
  back: '$\vec u \times \vec v = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ u_1 & u_2 & u_3 \\ v_1 & v_2 & v_3 \end{vmatrix}$; the $\mathbf{j}$ term gets a minus sign.'
  topic: Cross product
- front: 'Checking a cross product'
  back: 'Dot it with $\vec u$ and with $\vec v$; both must be 0.'
  topic: Cross product
- front: 'Length of $\vec u \times \vec v$'
  back: '$\lVert\vec u\rVert\lVert\vec v\rVert\sin\theta$, the area of the parallelogram on $\vec u$ and $\vec v$.'
  topic: Cross product
- front: 'Area of a triangle in space'
  back: '$\tfrac12\lVert\vec{AB} \times \vec{AC}\rVert$'
  topic: Cross product
- front: 'Area of the parallelogram on $\langle a, b \rangle$ and $\langle c, d \rangle$ (plane)'
  back: '$\lvert ad - bc \rvert$'
  topic: Cross product
- front: '$\mathbf{i} \times \mathbf{j}$, $\mathbf{j} \times \mathbf{k}$, $\mathbf{k} \times \mathbf{i}$'
  back: '$\mathbf{k}$, $\mathbf{i}$, $\mathbf{j}$ (reverse the order and the sign flips)'
  topic: Cross product
- front: 'Order in the cross product'
  back: '$\vec v \times \vec u = -(\vec u \times \vec v)$ (anticommutative); also not associative.'
  topic: Cross product
- front: '$\vec u \times \vec v = \vec 0$ (nonzero vectors)'
  back: 'The vectors are parallel.'
  topic: Cross product
- front: 'Volume of a parallelepiped'
  back: '$\lvert\vec u \cdot (\vec v \times \vec w)\rvert$ = |determinant with rows $\vec u, \vec v, \vec w$|; 0 means coplanar.'
  topic: Cross product
- front: 'Torque'
  back: '$\vec\tau = \vec r \times \vec F$; size $\lVert\vec r\rVert\lVert\vec F\rVert\sin\theta$ (N·m).'
  topic: Cross product
- front: 'Line in space'
  back: '$x = x_0 + at$, $y = y_0 + bt$, $z = z_0 + ct$: a point and a direction vector $\langle a, b, c \rangle$.'
  topic: Lines and planes in space
- front: 'Plane in space'
  back: '$a(x - x_0) + b(y - y_0) + c(z - z_0) = 0$, or $ax + by + cz = d$, with normal $\langle a, b, c \rangle$.'
  topic: Lines and planes in space
- front: 'Plane through three points $A$, $B$, $C$'
  back: 'Normal $\vec n = \vec{AB} \times \vec{AC}$, then point-normal form with $A$.'
  topic: Lines and planes in space
- front: 'Parallel, intersecting or skew?'
  back: 'Directions multiples: parallel or the same line. Otherwise solve with separate parameters $t$, $s$: a solution means they intersect; none means skew.'
  topic: Lines and planes in space
- front: 'Where a line meets a plane'
  back: 'Substitute the parametric equations into the plane and solve for $t$.'
  topic: Lines and planes in space
- front: 'Distance from $(x_1, y_1, z_1)$ to $ax + by + cz = d$'
  back: '$\dfrac{\lvert ax_1 + by_1 + cz_1 - d \rvert}{\sqrt{a^2 + b^2 + c^2}}$'
  topic: Lines and planes in space
- front: 'Angle between two planes'
  back: 'The acute angle between their normals; perpendicular when the normals have dot product 0.'
  topic: Lines and planes in space
- front: 'Distance between parallel planes $ax + by + cz = d_1$ and $ax + by + cz = d_2$'
  back: '$\dfrac{\lvert d_1 - d_2 \rvert}{\sqrt{a^2 + b^2 + c^2}}$'
  topic: Lines and planes in space
