# Honors module pc-h1 (Proof, infinity and the road to calculus), round 2 glossary
- term: proof
  aliases: [proofs]
  definition: 'A chain of logical steps showing that a statement must be true, starting from definitions and facts already established. Checking examples is not a proof.'
  topic: Logic and proof
- term: conditional statement
  aliases: [if-then statement]
  definition: 'A statement of the form "If $P$, then $Q$" ($P \Rightarrow Q$). It is false only when $P$ is true and $Q$ is false.'
  topic: Logic and proof
- term: hypothesis
  definition: 'The "if" part $P$ of a conditional statement "If $P$, then $Q$": what is assumed.'
  topic: Logic and proof
- term: conclusion
  definition: 'The "then" part $Q$ of a conditional statement "If $P$, then $Q$": what is claimed to follow.'
  topic: Logic and proof
- term: converse
  definition: 'The converse of "If $P$, then $Q$" is "If $Q$, then $P$". It can be false even when the original statement is true.'
  topic: Logic and proof
- term: contrapositive
  definition: 'The contrapositive of "If $P$, then $Q$" is "If not $Q$, then not $P$". It is always true exactly when the original statement is.'
  topic: Logic and proof
- term: direct proof
  definition: 'A proof that assumes the hypothesis and reaches the conclusion step by step, using definitions and known facts.'
  topic: Logic and proof
- term: proof by contrapositive
  definition: 'Proving "If $P$, then $Q$" by proving the equivalent statement "If not $Q$, then not $P$".'
  topic: Logic and proof
- term: proof by contradiction
  aliases: [indirect proof]
  definition: 'A proof that assumes the statement is false and reasons to an impossibility, so the statement must be true. Example: the proof that $\sqrt2$ is irrational.'
  topic: Logic and proof
- term: contradiction
  aliases: [contradictions]
  definition: 'A statement that cannot be true, such as $1 = 0$ or "this fraction is and is not in lowest terms". Reaching one shows that an assumption was false.'
  topic: Logic and proof
- term: rational number
  aliases: [rational numbers]
  definition: 'A number that can be written as $\frac ab$ with integers $a$ and $b$, $b \ne 0$. Its decimal form ends or repeats.'
  topic: Logic and proof
- term: irrational number
  aliases: [irrational numbers]
  definition: 'A real number that cannot be written as a fraction of integers, such as $\sqrt2$ or $\pi$. Its decimal form neither ends nor repeats.'
  topic: Logic and proof
- term: counterexample
  aliases: [counterexamples]
  definition: 'A single case in which the hypothesis of a "for all" statement holds but the conclusion fails. One counterexample proves the statement false.'
  topic: Logic and proof
- term: one-to-one correspondence
  aliases: [one-to-one correspondences, bijection, bijections]
  definition: 'A pairing of two sets in which every element of each set is matched with exactly one element of the other; equivalently, a function from one set to the other that has an inverse.'
  topic: Infinite sets
- term: cardinality
  definition: 'The size of a set. Two sets have the same cardinality when there is a one-to-one correspondence between them; this works for infinite sets too.'
  topic: Infinite sets
- term: countable
  aliases: [countably infinite, countable set]
  definition: 'A set is countable if it is finite or can be matched one-to-one with the positive integers, that is, written as a list $a_1, a_2, a_3, \dots$ that includes every element. $\mathbb{Z}$ and $\mathbb{Q}$ are countable.'
  topic: Infinite sets
- term: uncountable
  aliases: [uncountable set, uncountably infinite]
  definition: 'Infinite but not countable: no list can include every element. The real numbers, and every interval of them, are uncountable.'
  topic: Infinite sets
- term: diagonal argument
  aliases: [Cantor's diagonal argument, diagonalization]
  definition: 'Cantor''s proof that the reals in $(0, 1)$ cannot be listed: from any list, build a number whose $n$th digit differs from the $n$th digit of the $n$th number, so it is missing from the list.'
  topic: Infinite sets
- term: Cantor pairing function
  aliases: [pairing function]
  definition: 'The function $\pi(a, b) = \frac{(a + b)(a + b + 1)}{2} + b$, which gives each pair of whole numbers its position (from 0) in a list ordered by diagonals. It shows that pairs of whole numbers are countable.'
  topic: Infinite sets
- term: partial sum
  aliases: [partial sums]
  definition: 'The sum $S_n = a_1 + a_2 + \dots + a_n$ of the first $n$ terms of a series. The series converges when its partial sums approach a limit.'
  topic: Infinite series
- term: divergence test
  aliases: [nth-term test, n-th term test]
  definition: 'If the terms $a_n$ of a series do not approach 0, the series diverges. Terms approaching 0 do not prove convergence.'
  topic: Infinite series
- term: harmonic series
  definition: 'The series $1 + \frac12 + \frac13 + \frac14 + \dots = \sum \frac1k$. Its terms approach 0, but it diverges (slowly).'
  topic: Infinite series
- term: comparison test
  definition: 'For series of positive terms: if each term is at most the matching term of a convergent series, the series converges; if each is at least the matching term of a divergent series, it diverges.'
  topic: Infinite series
- term: p-series
  definition: 'A series $\sum_{k=1}^{\infty} \frac{1}{k^p}$. It converges when $p > 1$ and diverges when $p \le 1$.'
  topic: Infinite series
- term: alternating harmonic series
  definition: 'The series $1 - \frac12 + \frac13 - \frac14 + \dots$, which converges to $\ln 2 \approx 0.693$.'
  topic: Infinite series
- term: conditionally convergent
  aliases: [conditional convergence]
  definition: 'A series that converges, but whose absolute values $\sum |a_k|$ diverge, such as the alternating harmonic series. Rearranging its terms can change its sum.'
  topic: Infinite series
- term: absolutely convergent
  aliases: [absolute convergence]
  definition: 'A series whose absolute values $\sum |a_k|$ converge. It converges, and every rearrangement has the same sum.'
  topic: Infinite series
- term: method of exhaustion
  definition: 'The ancient Greek method for areas: fill a region with shapes of known area and show by contradiction that the area can be neither more nor less than a certain value.'
  topic: Area and integration
- term: Riemann sum
  aliases: [Riemann sums]
  definition: 'An estimate of the area under a curve by rectangles: $\sum f(x_i)\,\Delta x$, where each $x_i$ is a sample point (such as a right endpoint) in a piece of width $\Delta x$.'
  topic: Area and integration
- term: definite integral
  aliases: [definite integrals]
  definition: 'The limit of Riemann sums as the rectangles get thinner, written $\int_a^b f(x)\,dx$. For $f \ge 0$ it is the area under the curve from $a$ to $b$.'
  topic: Area and integration
- term: fundamental theorem of calculus
  aliases: [FTC]
  definition: 'The theorem connecting derivatives and areas: for a continuous $f$, the derivative of the area function $A(x)$ (area under $f$ from a fixed point to $x$) is $f(x)$.'
  topic: Area and integration
