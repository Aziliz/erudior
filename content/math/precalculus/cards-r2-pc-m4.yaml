# Round 2 notecards for pc-m4 honors lessons
- {front: Definition of cosh x, back: '$\cosh x = \dfrac{e^x + e^{-x}}{2}$ (even; minimum 1 at $x = 0$)', topic: Hyperbolic functions}
- {front: Definition of sinh x, back: '$\sinh x = \dfrac{e^x - e^{-x}}{2}$ (odd; increasing)', topic: Hyperbolic functions}
- {front: Definition of tanh x, back: '$\tanh x = \dfrac{\sinh x}{\cosh x}$; it stays between $-1$ and $1$', topic: Hyperbolic functions}
- {front: 'cosh x + sinh x and cosh x − sinh x', back: '$\cosh x + \sinh x = e^x$ and $\cosh x - \sinh x = e^{-x}$', topic: Hyperbolic functions}
- {front: Fundamental hyperbolic identity, back: '$\cosh^2 x - \sinh^2 x = 1$ (minus sign, unlike $\cos^2 + \sin^2 = 1$)', topic: Hyperbolic functions}
- {front: Why "hyperbolic"?, back: 'The point $(\cosh t, \sinh t)$ lies on the unit hyperbola $x^2 - y^2 = 1$; the sector from $(1, 0)$ to it has area $\frac t2$.', topic: Hyperbolic functions}
- {front: Hyperbolic double-angle formulas, back: '$\sinh 2x = 2\sinh x\cosh x$ and $\cosh 2x = \cosh^2 x + \sinh^2 x$', topic: Hyperbolic functions}
- {front: Formula for the inverse of sinh, back: '$\sinh^{-1} y = \ln\left(y + \sqrt{y^2 + 1}\right)$, from the quadratic in $u = e^x$', topic: Hyperbolic functions}
- {front: Formula for the inverse of cosh, back: '$\cosh^{-1} y = \ln\left(y + \sqrt{y^2 - 1}\right)$ for $y \ge 1$ (the nonnegative solution; $\cosh x = y$ also has its negative)', topic: Hyperbolic functions}
- {front: Shape of a hanging cable, back: 'A catenary, $y = a\cosh\dfrac xa + c$, not a parabola', topic: Hyperbolic functions}
- {front: Logistic midpoint, back: '$t_m = \dfrac{\ln A}{k}$, when $P = \dfrac C2$ and growth is fastest', topic: Logistic models}
- {front: Midpoint form of the logistic model, back: '$P = \dfrac{C}{1 + e^{-k(t - t_m)}}$', topic: Logistic models}
- {front: Symmetry of the logistic curve, back: '$P(t_m + s) + P(t_m - s) = C$: symmetric about the point $\left(t_m, \frac C2\right)$', topic: Logistic models}
- {front: Time for a logistic model to reach P, back: '$t = \dfrac1k\ln\dfrac{AP}{C - P}$', topic: Logistic models}
- {front: The logit, back: '$\ln\dfrac{P}{C - P} = kt - \ln A$: linear in $t$ with slope $k$ and intercept $-\ln A$', topic: Logistic models}
- {front: Reciprocal of a logistic model, back: '$\dfrac1P = \dfrac1C + \dfrac AC e^{-kt}$, an exponential plus a constant', topic: Logistic models}
- {front: Three-point method for C, back: 'Equally spaced $P_0, P_1, P_2$: $C = \dfrac{P_1(P_0P_1 + P_1P_2 - 2P_0P_2)}{P_1^2 - P_0P_2}$ (sensitive to measurement error)', topic: Logistic models}
- {front: Logistic rise time (10% to 90%), back: '$\dfrac{\ln 81}{k} \approx \dfrac{4.39}{k}$, independent of $C$ and $A$', topic: Logistic models}
- {front: 'Pearl and Reed''s forecast (1920)', back: 'A logistic fit to U.S. censuses through 1910 predicted a ceiling of about 197 million; the U.S. passed 200 million in 1967. Fitted ceilings are unreliable.', topic: Logistic models}
- {front: Number of digits of a positive whole number N, back: '$\lfloor\log N\rfloor + 1$; the fractional part of $\log N$ gives the leading digits', topic: Comparing growth}
- {front: Comparing huge numbers, back: 'For $a, b > 0$: $a < b \iff \log a < \log b$. Compare exponents times logs, e.g. $300\log 2$ vs. $200\log 3$.', topic: Comparing growth}
- {front: The growth hierarchy, back: 'For $p > 0$, $b > 1$: $\ln x \ll x^p \ll b^x$ as $x \to \infty$ (each is dominated by the next)', topic: Comparing growth}
- {front: Key inequality for logs, back: '$\ln y \le y - 1$ for all $y > 0$ (from $e^u \ge 1 + u$)', topic: Comparing growth}
- {front: Why ln x / x → 0, back: '$\ln x = 2\ln\sqrt x < 2\sqrt x$, so $0 < \dfrac{\ln x}{x} < \dfrac{2}{\sqrt x}$ for $x > 1$', topic: Comparing growth}
- {front: 'Crossovers of 1.1ˣ and x¹⁰', back: 'Near $x \approx 1.01$ and $x \approx 685$; $x^{10}$ is larger in between. "Eventually" can take a long time.', topic: Comparing growth}
- {front: Bisection method, back: 'Start with $[a, b]$ where continuous $g$ changes sign; test the midpoint and keep the half with the sign change. Width after $n$ steps: $\dfrac{b - a}{2^n}$.', topic: Comparing growth}
- {front: Bisection steps per decimal place, back: 'About 3.3 steps ($\log_2 10 \approx 3.32$) for each extra correct decimal place', topic: Comparing growth}
- {front: 'Exponential-time jobs and faster computers', back: 'Doubling speed lets a $2^n$ job grow by only 1 in $n$; an $n^3$ job grows by a factor $\sqrt[3]{2} \approx 1.26$.', topic: Comparing growth}
