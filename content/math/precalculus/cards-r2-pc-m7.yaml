- front: Rotation formulas (axes turned by $\theta$)
  back: $x = x'\cos\theta - y'\sin\theta$, $y = x'\sin\theta + y'\cos\theta$
  topic: Rotation of axes
- front: Angle that removes the $xy$ term
  back: $\cot 2\theta = \dfrac{A - C}{B}$ with $0° < 2\theta < 180°$; $A = C$ gives $\theta = 45°$
  topic: Rotation of axes
- front: From $\cos 2\theta$ to $\cos\theta$ and $\sin\theta$
  back: $\cos\theta = \sqrt{\frac{1 + \cos 2\theta}{2}}$, $\sin\theta = \sqrt{\frac{1 - \cos 2\theta}{2}}$ (acute $\theta$)
  topic: Rotation of axes
- front: $A'$ after a rotation
  back: $A\cos^2\theta + B\sin\theta\cos\theta + C\sin^2\theta$
  topic: Rotation of axes
- front: $C'$ after a rotation
  back: $A\sin^2\theta - B\sin\theta\cos\theta + C\cos^2\theta$
  topic: Rotation of axes
- front: $B'$ after a rotation
  back: $B\cos 2\theta - (A - C)\sin 2\theta$
  topic: Rotation of axes
- front: $D'$, $E'$ and $F'$ after a rotation
  back: $D' = D\cos\theta + E\sin\theta$, $E' = -D\sin\theta + E\cos\theta$, $F' = F$
  topic: Rotation of axes
- front: Rotation invariants
  back: $A' + C' = A + C$ and $B'^2 - 4A'C' = B^2 - 4AC$
  topic: Rotation of axes
- front: Shortcut for $A'$ and $C'$
  back: Roots of $\lambda^2 - (A + C)\lambda + AC - \frac{B^2}{4} = 0$; with acute $\theta$, $A' - C'$ has the sign of $B$
  topic: Rotation of axes
- front: Why the discriminant test works
  back: $B^2 - 4AC$ is invariant and equals $-4A'C'$ once the $xy$ term is gone
  topic: Rotation of axes
- front: Dandelin spheres
  back: Spheres inscribed in the cone, touching the cutting plane at the foci
  topic: Geometry of conics
- front: Key fact in the Dandelin proof
  back: Tangent segments from one point to a sphere are equal, so $PF_1 + PF_2$ is the distance between the contact circles along a generator
  topic: Geometry of conics
- front: Eccentricity of a slice of a cone
  back: '$e = \dfrac{\cos\beta}{\cos\alpha}$ ($\alpha$: generator to axis, $\beta$: plane to axis)'
  topic: Geometry of conics
- front: Which slice gives which conic
  back: $\beta = 90°$ circle; $\beta > \alpha$ ellipse; $\beta = \alpha$ parabola; $\beta < \alpha$ hyperbola
  topic: Geometry of conics
- front: Focal radii of an ellipse
  back: $PF_1 = a + ex_0$, $PF_2 = a - ex_0$ (foci $(-c, 0)$ and $(c, 0)$)
  topic: Geometry of conics
- front: Directrices of $\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$
  back: $x = \pm\dfrac{a}{e} = \pm\dfrac{a^2}{c}$
  topic: Geometry of conics
- front: Tangent to $x^2 = 4py$ at $(x_0, y_0)$
  back: Slope $\dfrac{x_0}{2p}$; it meets the axis at $(0, -y_0)$
  topic: Geometry of conics
- front: Tangent to $\frac{x^2}{a^2} + \frac{y^2}{b^2} = 1$ at $(x_0, y_0)$
  back: $\dfrac{x_0x}{a^2} + \dfrac{y_0y}{b^2} = 1$
  topic: Geometry of conics
- front: Reflective property of an ellipse
  back: 'The tangent makes equal angles with the focal radii: rays from one focus reflect to the other'
  topic: Geometry of conics
- front: Reflective property of a hyperbola
  back: 'The tangent bisects angle $F_1PF_2$: a ray aimed at one focus reflects toward the other'
  topic: Geometry of conics
- front: Kepler's three laws
  back: 1) ellipse with the Sun at a focus; 2) equal areas in equal times; 3) $T^2 \propto a^3$
  topic: Orbits
- front: Polar equation of an orbit
  back: $r = \dfrac{a(1 - e^2)}{1 + e\cos\theta}$, with $\theta$ measured from perihelion
  topic: Orbits
- front: Perihelion and aphelion distances
  back: $q = a(1 - e)$, $Q = a(1 + e)$
  topic: Orbits
- front: $a$ and $e$ from $q$ and $Q$
  back: $a = \dfrac{q + Q}{2}$, $e = \dfrac{Q - q}{Q + q}$
  topic: Orbits
- front: Speed at perihelion vs. aphelion
  back: $\dfrac{v_p}{v_a} = \dfrac{Q}{q} = \dfrac{1 + e}{1 - e}$
  topic: Orbits
- front: Kepler's third law around the Sun
  back: $T^2 = a^3$ ($T$ in years, $a$ in AU); the period depends only on $a$
  topic: Orbits
- front: Hohmann transfer time
  back: Half the period of the ellipse with $a = \frac{r_1 + r_2}{2}$
  topic: Orbits
- front: Eccentricity and capture
  back: $e < 1$ captured (ellipse); $e = 1$ just escaping (parabola); $e > 1$ flyby (hyperbola)
  topic: Orbits
- front: 1 astronomical unit
  back: About 149.6 million km, roughly Earth's average distance from the Sun
  topic: Orbits
- front: Earth's orbit
  back: $a = 1$ AU, $e \approx 0.0167$; closest in early January (about 0.983 AU)
  topic: Orbits
