# Round 2, module pc-m6: drills for the honors lessons (transformations, Markov chains, eigenvalues).

- id: pc-m6-r2-transform-point
  title: Apply a matrix to a point
  topic: Linear transformations
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    d: {min: -4, max: 4}
    p: {min: -5, max: 5}
    q: {min: -5, max: 5}
  where: ["b != 0", "c != 0", "p != 0", "q != 0", "a*d - b*c != 0"]
  calc:
    xn: a*p + b*q
    yn: c*p + d*q
  prompt: 'The matrix $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$ transforms the plane. Where does it send the point $({p}, {q})$?'
  answers:
    - {name: xn, label: '$x$-coordinate'}
    - {name: yn, label: '$y$-coordinate'}
  solution: |-
    Multiply the matrix by the column $\begin{bmatrix} {p} \\ {q} \end{bmatrix}$, row times column: the first row gives $({a})({p}) + ({b})({q}) = {xn}$ and the second row gives $({c})({p}) + ({d})({q}) = {yn}$. The image is **({xn}, {yn})**.

- id: pc-m6-r2-image-area
  title: Area of the image under a matrix
  topic: Linear transformations
  vars:
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    c: {min: -5, max: 5}
    d: {min: -5, max: 5}
    w: {min: 2, max: 6}
    h: {min: 2, max: 5}
  where: ["dt != 0", "b*c != 0"]
  calc:
    dt: a*d - b*c
    ad: abs(dt)
    area0: w*h
    area: ad*w*h
  prompt: 'A rectangle {w} units wide and {h} units tall is transformed by $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$. What is the area of its image?'
  answers:
    - {name: area, label: 'Area', format: integer}
  solution: |-
    A linear transformation multiplies every area by $|\det A|$. Here $\det A = ({a})({d}) - ({b})({c}) = {dt}$, so the scale factor is {ad}. The rectangle has area ${w} \times {h} = {area0}$, so the image has area ${ad} \times {area0} =$ **{area}**.

- id: pc-m6-r2-markov-step
  title: Two steps of a Markov chain
  topic: Markov chains
  vars:
    P10: {min: 1, max: 9}
    Q10: {min: 1, max: 9}
    S10: {min: 0, max: 10}
  where: ["P10 != Q10"]
  calc:
    p: P10/10
    q: Q10/10
    s: S10/10
    p2: 1 - p
    q2: 1 - q
    s2: 1 - s
    x1: p*s + q*(1 - s)
    y1: 1 - x1
    x2: round(p*x1 + q*y1, 6)
  prompt: 'A two-state Markov chain has transition matrix $P = \begin{bmatrix} {p} & {q} \\ {p2} & {q2} \end{bmatrix}$ (column $j$ lists the probabilities of moving from state $j$). Today the probability of state 1 is {s}, so $\mathbf{x}_0 = ({s}, {s2})$. What is the probability of state 1 two steps from now? Give the exact decimal.'
  answers:
    - {name: x2, label: 'Probability', format: dp3, tolerance: 0.0001}
  solution: |-
    One step: the first entry of $P\mathbf{x}_0$ is $({p})({s}) + ({q})({s2}) = {x1:dp3}$, so $\mathbf{x}_1 = ({x1:dp3}, {y1:dp3})$. Second step: $({p})({x1:dp3}) + ({q})({y1:dp3}) =$ **{x2:dp3}**.

- id: pc-m6-r2-markov-steady
  title: Steady state of a two-state chain
  topic: Markov chains
  vars:
    A10: {min: 1, max: 9}
    B10: {min: 1, max: 9}
  where: ["A10 != B10"]
  calc:
    a: A10/10
    b: B10/10
    p11: 1 - a
    p22: 1 - b
    q1: B10/(A10 + B10)
    q2: A10/(A10 + B10)
    ratio: B10/A10
  prompt: 'Find the steady-state vector $(q_1, q_2)$ of the transition matrix $P = \begin{bmatrix} {p11} & {b} \\ {a} & {p22} \end{bmatrix}$ (columns add to 1). Give exact fractions.'
  answers:
    - {name: q1, label: '$q_1 =$', kind: fraction}
    - {name: q2, label: '$q_2 =$', kind: fraction}
  solution: |-
    Solve $(P - I)\mathbf{q} = \mathbf{0}$. The first row is $-{a}\,q_1 + {b}\,q_2 = 0$, so $q_1 = {ratio:texfrac}\,q_2$. With $q_1 + q_2 = 1$: $q_2 = {q2:texfrac}$ and $q_1 = {q1:texfrac}$. The steady state is **({q1:frac}, {q2:frac})**; check that $P\mathbf{q} = \mathbf{q}$.

- id: pc-m6-r2-eigenvalues
  title: Eigenvalues of a 2×2 matrix
  topic: Eigenvalues and eigenvectors
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  where: ["b*c != 0", "disc > 0", "sqrt(disc) == round(sqrt(disc))", "tr != 0", "dt != 0"]
  calc:
    tr: a + d
    dt: a*d - b*c
    disc: tr^2 - 4*dt
    rt: sqrt(disc)
    l1: (tr + rt)/2
    l2: (tr - rt)/2
    ntr: -tr
    nl1: -l1
    nl2: -l2
  prompt: 'Find the eigenvalues of $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$. Enter the larger one first.'
  answers:
    - {name: l1, label: 'Larger $\lambda =$'}
    - {name: l2, label: 'Smaller $\lambda =$'}
  solution: |-
    The trace is ${a} + ({d}) = {tr}$ and $\det A = ({a})({d}) - ({b})({c}) = {dt}$. The characteristic equation is $\lambda^2 {ntr:signedcoef}\lambda {dt:signed} = 0$, which factors as $(\lambda {nl1:signed})(\lambda {nl2:signed}) = 0$. The eigenvalues are **{l1}** and **{l2}** (check: they add to {tr} and multiply to {dt}).

- id: pc-m6-r2-eigenvector
  title: Eigenvector for a given eigenvalue
  topic: Eigenvalues and eigenvectors
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  where: ["b*c != 0", "disc > 0", "sqrt(disc) == round(sqrt(disc))", "a != l1", "l1 != 0"]
  calc:
    tr: a + d
    dt: a*d - b*c
    disc: tr^2 - 4*dt
    l1: (tr + sqrt(disc))/2
    am: a - l1
    nam: l1 - a
    nl1: -l1
    y: (l1 - a)/b
  prompt: 'The matrix $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$ has eigenvalue $\lambda = {l1}$. Find the eigenvector of the form $(1, y)$. Give $y$ as an exact fraction or integer.'
  answers:
    - {name: y, label: '$y =$', kind: fraction}
  solution: |-
    Solve $(A {nl1:signed}I)\mathbf{v} = \mathbf{0}$. The first row of $A {nl1:signed}I$ is $({am}, {b})$, so ${am:coef}x {b:signedcoef}y = 0$ (the second row is a multiple of it, because $\det(A {nl1:signed}I) = 0$). With $x = 1$: ${am} {b:signedcoef}y = 0$, so ${b:coef}y = {nam}$ and $y =$ **{y:frac}**. Check: $A\begin{bmatrix} 1 \\ y \end{bmatrix} = {l1}\begin{bmatrix} 1 \\ y \end{bmatrix}$.
