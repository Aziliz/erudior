# Round 2 drills for module pc-m3 (honors lessons 14h1-14h3)
- id: pc-m3-r2-depress
  title: Depress a cubic
  topic: Cubic equations
  vars:
    m: {choices: [-3, -2, -1, 1, 2, 3]}
    c: {min: -9, max: 9}
    d: {min: -9, max: 9}
  where: ["d != 0", "c != 0", "pp != 0", "qq != 0"]
  calc:
    bb: 3*m
    nm: -m
    msq: m^2
    pp: c - 3*m^2
    qq: 2*m^3 - m*c + d
  prompt: 'Substitute $x = t {nm:signed}$ into $x^3 {bb:signedcoef}x^2 {c:signedcoef}x {d:signed} = 0$ to get a depressed cubic $t^3 + pt + q = 0$. Find $p$ and $q$.'
  answers:
    - {name: pp, label: '$p =$'}
    - {name: qq, label: '$q =$'}
  solution: |-
    Here $b = {bb}$, so the shift is $x = t - \tfrac{b}{3} = t {nm:signed}$. Use $p = c - \tfrac{b^2}{3}$ and $q = \tfrac{2b^3}{27} - \tfrac{bc}{3} + d$ with $\tfrac{b}{3} = {m}$:
    $p = {c} - 3({msq}) =$ **{pp}** and $q = 2({m})^3 - ({m})({c}) + ({d}) =$ **{qq}**.

- id: pc-m3-r2-cardano-type
  title: How many real roots? (sign of D)
  topic: Cubic equations
  vars:
    pp: {choices: [-12, -9, -6, -3, 3, 6, 9, 12]}
    qq: {min: -20, max: 20, step: 2}
  where: ["qq != 0", "DD != 0"]
  calc:
    hq: qq/2
    tp: pp/3
    DD: (qq/2)^2 + (pp/3)^3
    nreal: if(DD > 0, 1, 3)
  prompt: 'For $t^3 {pp:signedcoef}t {qq:signed} = 0$, compute $D = \left(\tfrac{q}{2}\right)^2 + \left(\tfrac{p}{3}\right)^3$ and state how many different real roots the cubic has.'
  answers:
    - {name: DD, label: '$D =$'}
    - {name: nreal, label: 'Number of different real roots'}
  solution: |-
    $\tfrac{q}{2} = {hq}$ and $\tfrac{p}{3} = {tp}$, so $D = ({hq})^2 + ({tp})^3 =$ **{DD}**.
    $D > 0$ means one real root (and two non-real conjugates); $D < 0$ means three different real roots. Here: **{nreal}**.

- id: pc-m3-r2-cardano-root
  title: Real root by Cardano's formula
  topic: Cubic equations
  vars:
    pp: {min: 1, max: 12}
    qq: {min: -20, max: 20}
  where: ["qq != 0"]
  calc:
    mq: -qq/2
    DD: (qq/2)^2 + (pp/3)^3
    sd: sqrt(DD)
    u: cbrt(-qq/2 + sqrt(DD))
    v: cbrt(-qq/2 - sqrt(DD))
    root: u + v
    uin: -qq/2 + sqrt(DD)
    vin: -qq/2 - sqrt(DD)
  prompt: 'Use Cardano''s formula to find the real root of $t^3 {pp:signedcoef}t {qq:signed} = 0$. Give it to 4 decimal places.'
  answers:
    - {name: root, label: '$t \approx$', format: num4, tolerance: 0.0001}
  solution: |-
    $p = {pp}$, $q = {qq}$, so $-\tfrac q2 = {mq}$ and $D = \left(\tfrac q2\right)^2 + \left(\tfrac p3\right)^3 = {DD:num4}$, $\sqrt D \approx {sd:num4}$.
    $t = \sqrt[3]{ {uin:num4} } + \sqrt[3]{ {vin:num4} } \approx {u:num4} + ({v:num4}) \approx$ **{root:num4}**.
    (Since $p > 0$, $D > 0$ and this is the only real root.)

- id: pc-m3-r2-lagrange
  title: Interpolate a value (Lagrange)
  topic: Polynomial interpolation
  vars:
    x0: {min: -4, max: 1}
    g1: {min: 1, max: 3}
    g2: {min: 1, max: 3}
    y0: {min: -9, max: 9}
    y1: {min: -9, max: 9}
    y2: {min: -9, max: 9}
    xs: {min: -5, max: 7}
  where: ["xs != x0", "xs != x1", "xs != x2"]
  calc:
    x1: x0 + g1
    x2: x1 + g2
    L0: (xs - x1)*(xs - x2)/((x0 - x1)*(x0 - x2))
    L1: (xs - x0)*(xs - x2)/((x1 - x0)*(x1 - x2))
    L2: (xs - x0)*(xs - x1)/((x2 - x0)*(x2 - x1))
    val: y0*L0 + y1*L1 + y2*L2
    a1: xs - x1
    a2: xs - x2
    a0: xs - x0
    e01: x0 - x1
    e02: x0 - x2
    e10: x1 - x0
    e12: x1 - x2
    e20: x2 - x0
    e21: x2 - x1
  prompt: 'The polynomial $p$ of degree at most 2 passes through $({x0}, {y0})$, $({x1}, {y1})$ and $({x2}, {y2})$. Find $p({xs})$ exactly (an integer or a fraction).'
  answers:
    - {name: val, label: '$p({xs}) =$', kind: fraction}
  solution: |-
    Evaluate the Lagrange basis polynomials at $x = {xs}$:
    $L_0 = \dfrac{({a1})({a2})}{({e01})({e02})} = {L0:texfrac}$, $L_1 = \dfrac{({a0})({a2})}{({e10})({e12})} = {L1:texfrac}$, $L_2 = \dfrac{({a0})({a1})}{({e20})({e21})} = {L2:texfrac}$.
    Then $p({xs}) = ({y0})({L0:texfrac}) + ({y1})({L1:texfrac}) + ({y2})({L2:texfrac}) =$ **{val:frac}**.

- id: pc-m3-r2-newton-form
  title: Newton form coefficients
  topic: Polynomial interpolation
  vars:
    x0: {min: -3, max: 1}
    g1: {min: 1, max: 3}
    g2: {min: 1, max: 3}
    y0: {min: -9, max: 9}
    c1: {min: -6, max: 6}
    c2: {min: -3, max: 3}
  where: ["c2 != 0", "x0 != 0", "x1 != 0"]
  calc:
    x1: x0 + g1
    x2: x1 + g2
    y1: y0 + c1*(x1 - x0)
    y2: y0 + c1*(x2 - x0) + c2*(x2 - x0)*(x2 - x1)
    nx0: -x0
    nx1: -x1
    d1: x1 - x0
    d2: x2 - x0
    d3: x2 - x1
    pr: (x2 - x0)*(x2 - x1)
    lin: y0 + c1*(x2 - x0)
    rest: y2 - y0 - c1*(x2 - x0)
  prompt: 'Write the quadratic through $({x0}, {y0})$, $({x1}, {y1})$ and $({x2}, {y2})$ in Newton form $p(x) = c_0 + c_1(x {nx0:signed}) + c_2(x {nx0:signed})(x {nx1:signed})$. Find $c_0$, $c_1$ and $c_2$.'
  answers:
    - {name: y0, label: '$c_0 =$'}
    - {name: c1, label: '$c_1 =$'}
    - {name: c2, label: '$c_2 =$'}
  solution: |-
    At $x = {x0}$ only $c_0$ survives: $c_0 =$ **{y0}**.
    At $x = {x1}$: ${y0} + c_1({d1}) = {y1}$, so $c_1 =$ **{c1}**.
    At $x = {x2}$: ${y0} + ({c1})({d2}) + c_2({d2})({d3}) = {y2}$, so ${lin} + {pr}\,c_2 = {y2}$ and $c_2 = \tfrac{ {rest} }{ {pr} } =$ **{c2}**.

- id: pc-m3-r2-secret
  title: Recover a shared secret
  topic: Polynomial interpolation
  vars:
    s: {min: 10, max: 99}
    a: {min: 1, max: 20}
    b: {min: 1, max: 9}
  calc:
    y1: s + a + b
    y2: s + 2*a + 4*b
    y3: s + 3*a + 9*b
    t1: 3*y1
    t2: 3*y2
  prompt: 'A secret $S$ is the constant term of a quadratic $p(x) = S + ax + bx^2$. Three shares are $(1, {y1})$, $(2, {y2})$ and $(3, {y3})$. Find $S = p(0)$.'
  answers:
    - {name: s, label: '$S =$'}
  solution: |-
    At $x = 0$ the Lagrange basis values for $x = 1, 2, 3$ are $3$, $-3$ and $1$, so $S = 3y_1 - 3y_2 + y_3 = {t1} - {t2} + {y3} =$ **{s}**.

- id: pc-m3-r2-lf-form
  title: A linear fractional function as a transformed 1/x
  topic: Linear fractional functions
  vars:
    a: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
    b: {min: -9, max: 9}
    d: {min: -6, max: 6}
  where: ["b != 0", "d != 0", "kk != 0"]
  calc:
    hh: -d
    vv: a
    kk: b - a*d
  prompt: 'Write $f(x) = \dfrac{ {a:coef}x {b:signed} }{ x {d:signed} }$ in the form $f(x) = \dfrac{k}{x - h} + v$. Find $h$, $v$ and $k$.'
  answers:
    - {name: hh, label: '$h =$'}
    - {name: vv, label: '$v =$'}
    - {name: kk, label: '$k =$'}
  solution: |-
    Divide: ${a:coef}x {b:signed} = {a}(x {d:signed}) + ({kk})$, so $f(x) = {a} + \dfrac{ {kk} }{x {d:signed}}$.
    So $h =$ **{hh}**, $v =$ **{vv}**, $k =$ **{kk}**: the graph of $\tfrac1x$ stretched by $k$ and centered at $({hh}, {vv})$.

- id: pc-m3-r2-lf-reflect
  title: Use the center of symmetry
  topic: Linear fractional functions
  vars:
    a: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
    kk: {choices: [-12, -6, -4, -3, -2, 2, 3, 4, 6, 12]}
    hh: {min: -5, max: 5}
    s: {choices: [1, 2, 3, 4, 6]}
  where: ["hh != 0", "bb != 0"]
  calc:
    nh: -hh
    bb: kk - a*hh
    x1: hh + s
    x2: hh - s
    y1: a + kk/s
    y2: a - kk/s
    twov: 2*a
  prompt: 'For $f(x) = \dfrac{ {a:coef}x {bb:signed} }{ x {nh:signed} }$, you are told that $f({x1}) = {y1:texfrac}$. Use the center of symmetry (no substitution) to find $f({x2})$. Give an exact answer.'
  answers:
    - {name: y2, label: '$f({x2}) =$', kind: fraction}
  solution: |-
    The asymptotes are $x = {hh}$ and $y = {a}$, so the center is $({hh}, {a})$. The inputs ${x1}$ and ${x2}$ are both {s} units from ${hh}$, so $f({x1}) + f({x2}) = 2({a}) = {twov}$.
    Then $f({x2}) = {twov} - \left({y1:texfrac}\right) =$ **{y2:frac}**.

- id: pc-m3-r2-lens
  title: Thin-lens image distance
  topic: Linear fractional functions
  vars:
    fl: {min: 5, max: 20}
    dob: {min: 4, max: 60}
  where: ["abs(dob - fl) >= 2"]
  calc:
    di: fl*dob/(dob - fl)
    mag: -di/dob
    prod: fl*dob
    diff: dob - fl
  prompt: 'A thin lens has focal length {fl} cm. An object is {dob} cm from the lens. Use $d_i = \dfrac{f\,d_o}{d_o - f}$ to find the image distance (to 1 decimal place; negative means a virtual image) and the magnification $m = -\dfrac{d_i}{d_o}$ (to 2 decimal places).'
  answers:
    - {name: di, label: '$d_i \approx$', format: num1, tolerance: 0.06, units: {cm: 1}}
    - {name: mag, label: '$m \approx$', format: num2, tolerance: 0.02}
  solution: |-
    $d_i = \dfrac{ ({fl})({dob}) }{ {dob} - {fl} } = \dfrac{ {prod} }{ {diff} } \approx$ **{di:num1} cm**.
    $m = -\dfrac{d_i}{d_o} \approx$ **{mag:num2}** (negative: the image is upside down; positive: upright and virtual).
