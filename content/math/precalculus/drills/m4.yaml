- id: pc-compound
  title: Compound interest
  topic: Exponential functions
  vars:
    P: {min: 1000, max: 20000, step: 500}
    r: {choices: [2, 2.5, 3, 3.5, 4, 4.5, 5, 6]}
    n: {choices: [{label: 'annually', value: 1}, {label: 'quarterly', value: 4}, {label: 'monthly', value: 12}]}
    t: {min: 2, max: 20}
  calc:
    rd: r/100
    nt: n*t
    nv: n
    A: P*(1 + rd/n)^(n*t)
  prompt: '{P:money0} is invested at {r}% annual interest, compounded {n}. What is the balance after {t} years? (Nearest cent.)'
  answers:
    - {name: A, label: 'Balance', format: money, tolerance: 0.02}
  solution: |-
    $A = P\left(1 + \dfrac{\,r}{\,n}\right)^{\,nt}$ with $r = {rd:num4}$ and ${nt}$ compounding periods: $A = {P:dp0}\left(1 + \dfrac{ {rd:num4} }{ {nv} }\right)^{ {nt} } \approx$ **{A:money}**.

- id: pc-continuous
  title: Continuous compounding
  topic: Exponential functions
  vars:
    P: {min: 1000, max: 20000, step: 500}
    r: {choices: [2, 2.5, 3, 3.5, 4, 4.5, 5, 6, 7]}
    t: {min: 2, max: 25}
  calc:
    rd: r/100
    rt: rd*t
    A: P*exp(rd*t)
  prompt: '{P:money0} is invested at {r}% compounded continuously. What is it worth after {t} years? (Nearest cent.)'
  answers:
    - {name: A, label: 'Balance', format: money, tolerance: 0.02}
  solution: |-
    $A = Pe^{\,rt} = {P:dp0}\,e^{ {rd:num4} \cdot {t} } = {P:dp0}\,e^{ {rt:num4} } \approx$ **{A:money}**.

- id: pc-log-eval
  title: Evaluate a logarithm exactly
  topic: Logarithms
  vars:
    b: {choices: [2, 3, 4, 5, 10]}
    k: {min: -3, max: 4}
  where: ["abs(b^k) <= 10000", "k != 1"]
  calc:
    arg: b^k
  prompt: 'Evaluate $\log_{ {b} } {arg:texfrac}$ exactly.'
  answers:
    - {name: k, label: 'Value'}
  solution: |-
    Ask: {b} to what power gives ${arg:texfrac}$? Since ${b}^{ {k} } = {arg:texfrac}$, the logarithm is **{k}**.

- id: pc-change-base
  title: Change of base
  topic: Logarithms
  vars:
    b: {choices: [2, 3, 5, 6, 7, 12]}
    x: {min: 2, max: 300}
  where: ["abs(log(x, b) - round(log(x, b))) > 0.01"]
  calc:
    lx: ln(x)
    lb: ln(b)
    v: ln(x)/ln(b)
  prompt: 'Use the change-of-base formula to evaluate $\log_{ {b} } {x}$ to four decimal places.'
  answers:
    - {name: v, label: 'Value', tolerance: 0.0001, format: num4}
  solution: |-
    $\log_{ {b} } {x} = \dfrac{\ln {x}}{\ln {b}} \approx \dfrac{ {lx:num4} }{ {lb:num4} } \approx$ **{v:num4}**.

- id: pc-log-combine
  title: Use log properties with given values
  topic: Logarithms
  vars:
    b: {choices: [5, 6, 7, 11, 13]}
    p: {min: -2, max: 3}
    q: {min: -2, max: 3}
  where: ["p != 0", "q != 0"]
  calc:
    u: round(log(2, b), 4)
    v: round(log(3, b), 4)
    ans: p*u + q*v
    val: 2^p*3^q
  prompt: 'Given $\log_{ {b} } 2 \approx {u:num4}$ and $\log_{ {b} } 3 \approx {v:num4}$, find $\log_{ {b} }\left({val:texfrac}\right)$ using properties of logarithms. (Four decimals.)'
  answers:
    - {name: ans, label: 'Value', tolerance: 0.0006, format: num4}
  solution: |-
    ${val:texfrac} = 2^{ {p} } \cdot 3^{ {q} }$, so $\log_{ {b} } {val:texfrac} = {p:coef}\log_{ {b} }2 {q:signedcoef}\log_{ {b} }3 \approx {p}({u:num4}) + ({q})({v:num4}) =$ **{ans:num4}**.

- id: pc-exp-solve
  title: Solve an exponential equation with logs
  topic: Exponential and logarithmic equations
  vars:
    a: {min: 2, max: 9}
    b: {choices: [2, 3, 5, 7, 1.5, 1.08]}
    c: {min: 10, max: 500}
  where: ["c > a", "abs(log(c/a, b) - round(log(c/a, b))) > 0.01"]
  calc:
    ratio: c/a
    x: ln(c/a)/ln(b)
  prompt: 'Solve ${a} \cdot {b}^x = {c}$. Round to four decimal places.'
  answers:
    - {name: x, label: '$x =$', tolerance: 0.0001, format: num4}
  solution: |-
    Isolate the power: ${b}^x = \dfrac{ {c} }{ {a} } \approx {ratio:num4}$. Take $\ln$: $x\ln {b} = \ln\dfrac{ {c} }{ {a} }$, so $x = \dfrac{\ln({c}/{a})}{\ln {b}} \approx$ **{x:num4}**.

- id: pc-log-solve
  title: Solve a logarithmic equation
  topic: Exponential and logarithmic equations
  vars:
    b: {choices: [2, 3, 5, 10]}
    n: {min: 1, max: 3}
    m: {min: 1, max: 6}
    a: {min: -9, max: 9}
  where: ["a != 0", "b^n <= 125"]
  calc:
    pw: b^n
    pwa: b^n - a
    x: (b^n - a)/m
  prompt: 'Solve $\log_{ {b} }({m:coef}x {a:signed}) = {n}$. Give an exact answer (fraction if needed).'
  answers:
    - {name: x, label: '$x =$', kind: fraction, lowestTerms: true}
  solution: |-
    Rewrite in exponential form: ${m:coef}x {a:signed} = {b}^{ {n} } = {pw}$. Move the constant to the right side: ${m:coef}x = {pwa}$, so $x =$ **${x:texfrac}$**. (The argument equals {pw} > 0, so the answer checks.)

- id: pc-same-base
  title: Exponential equation with a common base
  topic: Exponential and logarithmic equations
  vars:
    B: {choices: [2, 3]}
    e1: {min: 1, max: 3}
    e2: {min: 1, max: 3}
    a1: {min: 1, max: 4}
    c1: {min: -5, max: 5}
    a2: {min: 1, max: 4}
    c2: {min: -5, max: 5}
  where: ["e1 != e2", "e1*a1 - e2*a2 != 0", "c1 != 0", "c2 != 0", "B^e1 <= 27", "B^e2 <= 27"]
  calc:
    b1: B^e1
    b2: B^e2
    x: (e2*c2 - e1*c1)/(e1*a1 - e2*a2)
  prompt: 'Solve ${b1}^{ {a1:coef}x {c1:signed} } = {b2}^{ {a2:coef}x {c2:signed} }$. Give an exact answer.'
  answers:
    - {name: x, label: '$x =$', kind: fraction, lowestTerms: true}
  solution: |-
    Write both sides as powers of {B}: ${B}^{ {e1:coef}({a1:coef}x {c1:signed}) } = {B}^{ {e2:coef}({a2:coef}x {c2:signed}) }$. Set the exponents equal: ${e1:coef}({a1:coef}x {c1:signed}) = {e2:coef}({a2:coef}x {c2:signed})$, which gives $x =$ **${x:texfrac}$**.

- id: pc-half-life
  title: Half-life decay
  topic: Exponential models
  vars:
    Q0: {min: 50, max: 900, step: 10}
    T: {choices: [3, 5, 8, 12, 20, 30, 1600, 5730]}
    f: {choices: [0.5, 1.5, 2.5, 3, 4.2]}
  calc:
    t: round(T*f)
    Q: Q0*0.5^(t/T)
  prompt: 'A substance has a half-life of {T} years. Starting with {Q0} grams, how much remains after {t} years? (2 decimals.)'
  answers:
    - {name: Q, label: 'Amount', relTolerance: 0.002, format: num2, units: {g: 1, grams: 1}}
  solution: |-
    $Q = Q_0\left(\tfrac12\right)^{t/T} = {Q0}\left(\tfrac12\right)^{ {t:dp0}/{T:dp0} } \approx$ **{Q:num2} g**.

- id: pc-doubling
  title: Doubling time from data
  topic: Exponential models
  vars:
    A: {min: 100, max: 900, step: 50}
    g: {choices: [1.2, 1.3, 1.5, 1.6, 1.8, 2.5, 3]}
    t: {min: 2, max: 12}
  calc:
    B: A*g
    k: ln(g)/t
    D: ln(2)/k
  prompt: 'A population grows exponentially from {A} to {B:num1} in {t} years. What is its doubling time in years? (2 decimals.)'
  answers:
    - {name: D, label: 'Doubling time', relTolerance: 0.002, format: num2, units: {years: 1, yr: 1}}
  solution: |-
    $e^{ {t}k} = \dfrac{ {B:num1} }{ {A} } = {g}$, so $k = \dfrac{\ln {g}}{ {t} } \approx {k:num4}$. Doubling time $= \dfrac{\ln 2}{\,k} \approx$ **{D:num2} years**.

- id: pc-logistic
  title: Logistic model
  topic: Exponential models
  vars:
    C: {choices: [500, 800, 1000, 2000, 5000, 10000]}
    A: {choices: [4, 9, 19, 24, 49, 99]}
    k: {choices: [0.2, 0.25, 0.3, 0.4, 0.5, 0.8]}
    t: {min: 1, max: 10}
  calc:
    P0: C/(1 + A)
    Pt: C/(1 + A*exp(-k*t))
    th: ln(A)/k
  prompt: 'A population follows $P(t) = \dfrac{ {C:dp0} }{1 + {A}e^{-{k}t}}$. Find $P({t})$ and the time when $P$ reaches half the carrying capacity. (2 decimals each.)'
  answers:
    - {name: Pt, label: '$P({t})$', relTolerance: 0.002}
    - {name: th, label: 'Time to reach half', relTolerance: 0.002}
  solution: |-
    $P({t}) = \dfrac{ {C:dp0} }{1 + {A}e^{-{k}\cdot{t}}} \approx$ **{Pt:num2}**. Half capacity means $1 + {A}e^{-{k}t} = 2$, so $e^{-{k}t} = \tfrac{1}{ {A} }$ and $t = \dfrac{\ln {A}}{ {k} } \approx$ **{th:num2}**.

- id: pc-cooling
  title: Newton's law of cooling
  topic: Exponential models
  vars:
    Ts: {min: 15, max: 25}
    T0: {min: 80, max: 100}
    d: {min: 10, max: 30}
    t1: {choices: [5, 10, 15]}
    t2: {choices: [20, 25, 30, 40]}
  calc:
    T1: T0 - d
    k: ln((T0 - Ts)/(T1 - Ts))/t1
    T2: Ts + (T0 - Ts)*exp(-k*t2)
    D0: T0 - Ts
  prompt: 'A drink at {T0}°C is placed in a room at {Ts}°C. After {t1} minutes it is {T1}°C. Using Newton''s law of cooling, what is its temperature after {t2} minutes? (1 decimal.)'
  answers:
    - {name: T2, label: 'Temperature', tolerance: 0.1, format: num1, units: {'°C': 1, C: 1}}
  solution: |-
    $T(t) = {Ts} + {D0}e^{-kt}$. From $T({t1}) = {T1}$: $k = \dfrac{1}{ {t1} }\ln\dfrac{ {D0} }{ {T1} - {Ts} } \approx {k:num4}$. Then $T({t2}) = {Ts} + {D0}e^{-{k:num4}\cdot{t2}} \approx$ **{T2:num1}°C**.

- id: pc-linreg
  title: Least-squares line by hand
  topic: Fitting models to data
  vars:
    m0: {min: -3, max: 4}
    b0: {min: 8, max: 14}
    e1: {min: -2, max: 2}
    e2: {min: -2, max: 2}
    e3: {min: -2, max: 2}
    e4: {min: -2, max: 2}
    e5: {min: -2, max: 2}
  where: ["m0 != 0", "min(y1, y2, y3, y4, y5) >= 1", "m != 0", "b != 0"]
  calc:
    y1: b0 + m0 + e1
    y2: b0 + 2*m0 + e2
    y3: b0 + 3*m0 + e3
    y4: b0 + 4*m0 + e4
    y5: b0 + 5*m0 + e5
    ybar: (y1 + y2 + y3 + y4 + y5)/5
    sxy: -2*y1 - y2 + y4 + 2*y5
    m: sxy/10
    b: round(ybar - 3*m, 6)
  prompt: 'Find the least-squares regression line $\hat y = mx + b$ for the data $\begin{array}{c|ccccc} x & 1 & 2 & 3 & 4 & 5 \\ \hline y & {y1} & {y2} & {y3} & {y4} & {y5} \end{array}$ (exact or 2 decimals).'
  answers:
    - {name: m, label: '$m =$', tolerance: 0.01}
    - {name: b, label: '$b =$', tolerance: 0.01}
  solution: |-
    $\bar x = 3$ and $\bar y = {ybar}$. The deviations $x - \bar x$ are $-2, -1, 0, 1, 2$, so $\sum (x - \bar x)^2 = 10$, and because those deviations add to 0 the $\bar y$ terms cancel: $\sum (x - \bar x)(y - \bar y) = -2({y1}) - ({y2}) + ({y4}) + 2({y5}) = {sxy}$. So $m = \dfrac{ {sxy} }{10} =$ **{m}** and $b = \bar y - m\bar x = {ybar} - 3({m}) =$ **{b}**.

- id: pc-exp-fit
  title: Exponential model through two points
  topic: Fitting models to data
  vars:
    a: {min: 2, max: 12}
    b: {choices: [0.5, 1.5, 2, 3, 4]}
    x1: {min: 1, max: 2}
    k: {min: 1, max: 3}
  where: ["y1 == round(y1, 2)", "y2 == round(y2, 2)", "y1 < 1000", "y2 < 1000"]
  calc:
    x2: x1 + k
    y1: a*b^x1
    y2: a*b^x2
    ratio: y2/y1
    bx: b^x1
  prompt: 'An exponential model $y = ab^x$ passes through $({x1}, {y1})$ and $({x2}, {y2})$. Find $a$ and $b$.'
  answers:
    - {name: a, label: '$a =$', tolerance: 0.01}
    - {name: b, label: '$b =$', tolerance: 0.01}
  solution: |-
    Divide the two equations: $\dfrac{ab^{ {x2} }}{ab^{ {x1} }} = b^{ {k} } = \dfrac{ {y2} }{ {y1} } = {ratio:num4}$, so $b = {ratio:num4}^{1/{k}} =$ **{b}**. Then $a = \dfrac{ {y1} }{ {b}^{ {x1} } } = \dfrac{ {y1} }{ {bx:num4} } =$ **{a}**.

- id: pc-residual
  title: Predicted value and residual
  topic: Fitting models to data
  vars:
    m: {min: -3, max: 3, step: 0.5}
    c: {min: 2, max: 20, step: 0.5}
    x: {min: 1, max: 20}
    e: {min: -5, max: 5, step: 0.5}
  where: ["m != 0", "e != 0", "yhat > 0"]
  calc:
    yhat: m*x + c
    yobs: yhat + e
    res: e
  prompt: 'A regression model is $\hat y = {m:coef}x {c:signed}$. For the data point $({x}, {yobs})$, find the predicted value $\hat y$ and the residual.'
  answers:
    - {name: yhat, label: 'Predicted $\hat y =$', tolerance: 0.01}
    - {name: res, label: 'Residual', tolerance: 0.01}
  solution: |-
    Predicted: $\hat y = {m} \cdot {x} {c:signed} =$ **{yhat}**. Residual $=$ observed $-$ predicted $= {yobs} - {yhat} =$ **{res}**. (A positive residual means the point lies above the line; a negative one, below it.)
