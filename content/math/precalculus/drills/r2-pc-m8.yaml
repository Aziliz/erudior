# Round 2, module pc-m8: drills for the honors lessons (cross product; lines and planes in space).
- id: pc-m8-r2-cross
  title: Compute a cross product
  topic: Cross product
  vars:
    u1: {min: -5, max: 5}
    u2: {min: -5, max: 5}
    u3: {min: -5, max: 5}
    v1: {min: -5, max: 5}
    v2: {min: -5, max: 5}
    v3: {min: -5, max: 5}
  where: ["c1 != 0 or c2 != 0 or c3 != 0"]
  calc:
    c1: u2*v3 - u3*v2
    c2: u3*v1 - u1*v3
    c3: u1*v2 - u2*v1
    j0: u1*v3 - u3*v1
  prompt: 'Find $\vec u \times \vec v$ for $\vec u = \langle {u1}, {u2}, {u3} \rangle$ and $\vec v = \langle {v1}, {v2}, {v3} \rangle$.'
  answers:
    - {name: c1, label: '$\mathbf{i}$ component'}
    - {name: c2, label: '$\mathbf{j}$ component'}
    - {name: c3, label: '$\mathbf{k}$ component'}
  solution: |-
    Expand the determinant with rows $\mathbf{i}, \mathbf{j}, \mathbf{k}$; $\vec u$; $\vec v$ along the first row.
    $\mathbf{i}$: $({u2})({v3}) - ({u3})({v2}) = {c1}$.
    $\mathbf{j}$: $-\big[({u1})({v3}) - ({u3})({v1})\big] = -({j0}) = {c2}$.
    $\mathbf{k}$: $({u1})({v2}) - ({u2})({v1}) = {c3}$.
    So $\vec u \times \vec v =$ **$\langle {c1}, {c2}, {c3} \rangle$**. Check: dotting it with $\vec u$ or $\vec v$ gives 0.

- id: pc-m8-r2-triangle-area
  title: Area of a triangle in space
  topic: Cross product
  vars:
    ax: {min: -3, max: 3}
    ay: {min: -3, max: 3}
    az: {min: -3, max: 3}
    p1: {min: -4, max: 4}
    p2: {min: -4, max: 4}
    p3: {min: -4, max: 4}
    q1: {min: -4, max: 4}
    q2: {min: -4, max: 4}
    q3: {min: -4, max: 4}
  where: ["n1^2 + n2^2 + n3^2 > 0"]
  calc:
    bx: ax + p1
    by: ay + p2
    bz: az + p3
    cx: ax + q1
    cy: ay + q2
    cz: az + q3
    n1: p2*q3 - p3*q2
    n2: p3*q1 - p1*q3
    n3: p1*q2 - p2*q1
    nn: n1^2 + n2^2 + n3^2
    area: sqrt(nn)/2
  prompt: 'Find the area of the triangle with vertices $A({ax}, {ay}, {az})$, $B({bx}, {by}, {bz})$ and $C({cx}, {cy}, {cz})$. (Exact like sqrt(41)/2, or 2 decimals.)'
  answers:
    - {name: area, label: 'Area', tolerance: 0.01, format: num2}
  solution: |-
    Sides from $A$: $\vec{AB} = \langle {p1}, {p2}, {p3} \rangle$ and $\vec{AC} = \langle {q1}, {q2}, {q3} \rangle$.
    Cross product: $\vec{AB} \times \vec{AC} = \langle {n1}, {n2}, {n3} \rangle$, with length $\sqrt{ {nn} }$.
    The triangle is half the parallelogram: area $= \tfrac12\sqrt{ {nn} } \approx$ **{area:num2}**.

- id: pc-m8-r2-box-volume
  title: Volume from the triple scalar product
  topic: Cross product
  vars:
    u1: {min: -3, max: 4}
    u2: {min: -3, max: 4}
    u3: {min: -3, max: 4}
    v1: {min: -3, max: 4}
    v2: {min: -3, max: 4}
    v3: {min: -3, max: 4}
    w1: {min: -3, max: 4}
    w2: {min: -3, max: 4}
    w3: {min: -3, max: 4}
  where: ["det != 0"]
  calc:
    m1: v2*w3 - v3*w2
    m2: v1*w3 - v3*w1
    m3: v1*w2 - v2*w1
    det: u1*m1 - u2*m2 + u3*m3
    vol: abs(det)
  prompt: 'Find the volume of the parallelepiped spanned by $\vec u = \langle {u1}, {u2}, {u3} \rangle$, $\vec v = \langle {v1}, {v2}, {v3} \rangle$ and $\vec w = \langle {w1}, {w2}, {w3} \rangle$.'
  answers:
    - {name: vol, label: 'Volume'}
  solution: |-
    The triple product $\vec u \cdot (\vec v \times \vec w)$ is the determinant with rows $\vec u, \vec v, \vec w$. Expanding along the first row:
    $({u1})({m1}) - ({u2})({m2}) + ({u3})({m3}) = {det}$.
    The volume is its absolute value: **{vol}**.

- id: pc-m8-r2-plane-equation
  title: Plane through three points
  topic: Lines and planes in space
  vars:
    x0: {min: -3, max: 3}
    y0: {min: -3, max: 3}
    z0: {min: -3, max: 3}
    p1: {min: -3, max: 3}
    p2: {min: -3, max: 3}
    p3: {min: -3, max: 3}
    q1: {min: -3, max: 3}
    q2: {min: -3, max: 3}
    q3: {min: -3, max: 3}
  where: ["n1 != 0", "n2 != 0", "n3 != 0", "x0 != 0", "y0 != 0", "z0 != 0"]
  calc:
    bx: x0 + p1
    by: y0 + p2
    bz: z0 + p3
    cx: x0 + q1
    cy: y0 + q2
    cz: z0 + q3
    n1: p2*q3 - p3*q2
    n2: p3*q1 - p1*q3
    n3: p1*q2 - p2*q1
    rhs: n1*x0 + n2*y0 + n3*z0
    mx: -x0
    my: -y0
    mz: -z0
  prompt: 'Find the plane through $A({x0}, {y0}, {z0})$, $B({bx}, {by}, {bz})$ and $C({cx}, {cy}, {cz})$. Use the normal $\vec n = \vec{AB} \times \vec{AC}$ exactly as computed (don''t divide out a common factor), and write the plane as $ax + by + cz = d$.'
  answers:
    - {name: n1, label: '$a =$'}
    - {name: n2, label: '$b =$'}
    - {name: n3, label: '$c =$'}
    - {name: rhs, label: '$d =$'}
  solution: |-
    $\vec{AB} = \langle {p1}, {p2}, {p3} \rangle$ and $\vec{AC} = \langle {q1}, {q2}, {q3} \rangle$, so $\vec n = \vec{AB} \times \vec{AC} = \langle {n1}, {n2}, {n3} \rangle$.
    Point-normal form with $A$: ${n1}(x {mx:signed}) {n2:signed}(y {my:signed}) {n3:signed}(z {mz:signed}) = 0$.
    Multiplying out: **${n1:coef}x {n2:signedcoef}y {n3:signedcoef}z = {rhs}$**. Check: $B$ and $C$ give {rhs} too.

- id: pc-m8-r2-plane-distance
  title: Distance from a point to a plane
  topic: Lines and planes in space
  vars:
    pa: {min: -4, max: 4}
    pb: {min: -4, max: 4}
    pc: {min: -4, max: 4}
    rhs: {min: -9, max: 9}
    x1: {min: -5, max: 5}
    y1: {min: -5, max: 5}
    z1: {min: -5, max: 5}
  where: ["pa != 0", "pb != 0", "pc != 0", "val != 0"]
  calc:
    val: pa*x1 + pb*y1 + pc*z1 - rhs
    num: abs(val)
    nn: pa^2 + pb^2 + pc^2
    dist: num/sqrt(nn)
  prompt: 'Find the distance from the point $({x1}, {y1}, {z1})$ to the plane ${pa:coef}x {pb:signedcoef}y {pc:signedcoef}z = {rhs}$. (Exact like 5/sqrt(14), or 2 decimals.)'
  answers:
    - {name: dist, label: 'Distance', tolerance: 0.01, format: num2}
  solution: |-
    $D = \dfrac{\lvert ax_1 + by_1 + cz_1 - d \rvert}{\sqrt{a^2 + b^2 + c^2}}$.
    Numerator: $({pa})({x1}) + ({pb})({y1}) + ({pc})({z1}) - ({rhs}) = {val}$, absolute value {num}.
    Denominator: $\sqrt{ {nn} }$.
    So $D = \dfrac{ {num} }{\sqrt{ {nn} }} \approx$ **{dist:num2}**.

- id: pc-m8-r2-line-plane
  title: Where a line meets a plane
  topic: Lines and planes in space
  vars:
    x0: {min: -4, max: 4}
    y0: {min: -4, max: 4}
    z0: {min: -4, max: 4}
    d1: {min: -3, max: 3}
    d2: {min: -3, max: 3}
    d3: {min: -3, max: 3}
    pa: {min: -3, max: 3}
    pb: {min: -3, max: 3}
    pc: {min: -3, max: 3}
    t0: {min: -3, max: 3}
  where: ["pa != 0", "pb != 0", "pc != 0", "d1 != 0", "d2 != 0", "d3 != 0", "nd != 0", "x0 != 0", "y0 != 0", "z0 != 0"]
  calc:
    nd: pa*d1 + pb*d2 + pc*d3
    xi: x0 + t0*d1
    yi: y0 + t0*d2
    zi: z0 + t0*d3
    rhs: pa*xi + pb*yi + pc*zi
    k0: pa*x0 + pb*y0 + pc*z0
  prompt: 'Where does the line $x = {x0} {d1:signedcoef}t$, $y = {y0} {d2:signedcoef}t$, $z = {z0} {d3:signedcoef}t$ meet the plane ${pa:coef}x {pb:signedcoef}y {pc:signedcoef}z = {rhs}$? Give $t$ and the point.'
  answers:
    - {name: t0, label: '$t =$'}
    - {name: xi, label: '$x =$'}
    - {name: yi, label: '$y =$'}
    - {name: zi, label: '$z =$'}
  solution: |-
    Substitute the line into the plane: ${pa}({x0} {d1:signedcoef}t) + ({pb})({y0} {d2:signedcoef}t) + ({pc})({z0} {d3:signedcoef}t) = {rhs}$.
    Collect terms: ${k0} {nd:signedcoef}t = {rhs}$, so $t =$ **{t0}**.
    Then the point is **$({xi}, {yi}, {zi})$**.
