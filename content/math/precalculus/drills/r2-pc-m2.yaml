- id: pc-m2-r2-cubic-center
  title: Find the center of symmetry of a cubic
  topic: Symmetry about a line or point
  vars:
    A: {choices: [1, -1, 2, -2]}
    k: {min: -3, max: 3}
    C: {min: -9, max: 9}
    D: {min: -9, max: 9}
  where: ["k != 0", "C != 0", "D != 0"]
  calc:
    bb: -3*A*k
    cy: A*k^3 + bb*k^2 + C*k + D
    A3: 3*A
  prompt: 'Find the center of symmetry of $f(x) = {A:coef}x^3 {bb:signedcoef}x^2 {C:signedcoef}x {D:signed}$.'
  answers:
    - {name: k, label: '$x$-coordinate'}
    - {name: cy, label: '$y$-coordinate'}
  solution: |-
    The center is at $x = -\dfrac{B}{3A} = -\dfrac{ {bb} }{ {A3} } = {k}$. Its height is $f({k}) = {A}({k})^3 + ({bb})({k})^2 + ({C})({k}) + ({D}) = {cy}$. Center: **({k}, {cy})**.

- id: pc-m2-r2-even-odd-parts
  title: Even and odd parts from two values
  topic: Even and odd parts
  vars:
    p: {min: 1, max: 9}
    u: {min: -20, max: 20}
    v: {min: -20, max: 20}
  where: ["u != v", "u != -v"]
  calc:
    ep: (u + v)/2
    om: (v - u)/2
  prompt: 'A function $f$ has $f({p}) = {u}$ and $f(-{p}) = {v}$. Find its even part $E({p})$ and its odd part $O(-{p})$.'
  answers:
    - {name: ep, label: '$E({p}) =$'}
    - {name: om, label: '$O(-{p}) =$'}
  solution: |-
    $E({p}) = \dfrac{f({p}) + f(-{p})}{2} = \dfrac{ {u} + ({v}) }{2} =$ **{ep}**. $O(-{p}) = \dfrac{f(-{p}) - f({p})}{2} = \dfrac{ {v} - ({u}) }{2} =$ **{om}** (the opposite of $O({p})$, since $O$ is odd).

- id: pc-m2-r2-lft-inverse
  title: Inverse of a linear fractional function
  topic: Algebra of composition
  vars:
    a: {min: -6, max: 6}
    b: {min: -9, max: 9}
    c: {min: -4, max: 4}
    d: {min: -9, max: 9}
  where: ["a != 0", "b != 0", "c != 0", "d != 0", "a*d - b*c != 0"]
  calc:
    nb: -b
    nc: -c
    det: a*d - b*c
  prompt: 'Find $f^{-1}(x)$ for $f(x) = \dfrac{ {a:coef}x {b:signed} }{ {c:coef}x {d:signed} }$.'
  answers:
    - {kind: expression, expression: '(d*x - b)/(-c*x + a)', variables: [x], label: '$f^{-1}(x) =$', show: '$\dfrac{ {d:coef}x {nb:signed} }{ {nc:coef}x {a:signed} }$'}
  solution: |-
    Here $ad - bc = {det} \ne 0$, so $f$ is one-to-one. Swap $a$ and $d$ and change the signs of $b$ and $c$: **$f^{-1}(x) = \dfrac{ {d:coef}x {nb:signed} }{ {nc:coef}x {a:signed} }$**. (Solving $x = \frac{ay + b}{cy + d}$ for $y$ gives the same result.)

- id: pc-m2-r2-fixed-point
  title: Fixed point and iterates of a linear function
  topic: Fixed points and iteration
  vars:
    p: {min: -6, max: 6}
    m: {choices: [0.5, -0.5, 2, -2, 3]}
    e: {min: -4, max: 4}
  where: ["p != 0", "e != 0"]
  calc:
    c: p*(1 - m)
    x0: p + e
    x3: p + m^3*e
    m3: m^3
  prompt: 'Let $f(x) = {m}x {c:signed}$. Find the fixed point $p$ of $f$, and $x_3$ when you iterate $x_{n+1} = f(x_n)$ starting from $x_0 = {x0}$.'
  answers:
    - {name: p, label: '$p =$'}
    - {name: x3, label: '$x_3 =$'}
  solution: |-
    Fixed point: ${m}p {c:signed} = p$ gives $p = \dfrac{ {c} }{1 - ({m})} =$ **{p}**. The distance to $p$ is multiplied by $m$ each step: $x_3 - p = m^3(x_0 - p) = {m3} \cdot ({e})$, so $x_3 =$ **{x3}**.
