# Round 2 drills for pc-m4 (honors lessons 19h1-19h3)

- id: pc-m4-r2-hyperbolic-value
  title: From sinh x to cosh x and x
  topic: Hyperbolic functions
  vars:
    p: {min: 2, max: 7}
    q: {min: 1, max: 6}
  where: ["q < p", "gcd(p, q) == 1"]
  calc:
    top: p^2 - q^2
    bot: 2*p*q
    ctop: p^2 + q^2
    g1: gcd(top, bot)
    g2: gcd(ctop, bot)
    sn: top/g1
    sd: bot/g1
    cn: ctop/g2
    cd: bot/g2
    ch: ctop/bot
    ex: p/q
    xv: ln(p/q)
  prompt: 'Given $\sinh x = \dfrac{ {sn} }{ {sd} }$, find $\cosh x$ (exact fraction) and $x$ (4 decimal places).'
  answers:
    - {name: ch, label: '$\cosh x =$', kind: fraction, lowestTerms: true}
    - {name: xv, label: '$x =$', tolerance: 0.0001, format: num4}
  solution: |-
    $\cosh^2 x = 1 + \sinh^2 x = 1 + \left(\dfrac{ {sn} }{ {sd} }\right)^2$, and $\cosh x > 0$, so $\cosh x =$ **$\dfrac{ {cn} }{ {cd} }$**. Then $e^x = \cosh x + \sinh x = \dfrac{ {cn} }{ {cd} } + \dfrac{ {sn} }{ {sd} } = {ex:num4}$ (exactly $\tfrac{ {p} }{ {q} }$), so $x = \ln\tfrac{ {p} }{ {q} } \approx$ **{xv:num4}**.

- id: pc-m4-r2-arsinh
  title: Solve sinh x = c
  topic: Hyperbolic functions
  vars:
    c: {min: -9, max: 9, step: 0.5}
  where: ["c != 0"]
  calc:
    rt: sqrt(c^2 + 1)
    ux: c + sqrt(c^2 + 1)
    xv: ln(c + sqrt(c^2 + 1))
  prompt: 'Solve $\sinh x = {c}$. Round to 4 decimal places.'
  answers:
    - {name: xv, label: '$x =$', tolerance: 0.0001, format: num4}
  solution: |-
    With $u = e^x$: $\dfrac{u - 1/u}{2} = {c}$, so $u^2 - 2({c})u - 1 = 0$ and $u = {c} \pm \sqrt{({c})^2 + 1}$. Only the plus sign gives $u > 0$: $e^x = {c} + {rt:num4} \approx {ux:num4}$. So $x = \ln\left({c} + \sqrt{({c})^2 + 1}\right) \approx$ **{xv:num4}**.

- id: pc-m4-r2-catenary
  title: Sag of a hanging cable
  topic: Hyperbolic functions
  vars:
    a: {min: 10, max: 40, step: 5}
    half: {min: 10, max: 50, step: 5}
  where: ["half/a <= 1.5"]
  calc:
    span: 2*half
    ratio: half/a
    ch: cosh(half/a)
    sag: a*(cosh(half/a) - 1)
  prompt: 'A cable hangs in the shape $y = {a}\cosh\dfrac{x}{ {a} }$ (meters) between supports at $x = -{half}$ and $x = {half}$, a span of {span} m. How far below the supports is its lowest point? (Meters, 2 decimal places.)'
  answers:
    - {name: sag, label: 'Sag', tolerance: 0.005, format: num2}
  solution: |-
    At the supports $y = {a}\cosh\dfrac{ {half} }{ {a} } = {a}\cosh({ratio:num4}) \approx {a}({ch:num4})$; at the lowest point $x = 0$ and $y = {a}\cosh 0 = {a}$. Sag $= {a}\left(\cosh({ratio:num4}) - 1\right) \approx$ **{sag:num2}** m.

- id: pc-m4-r2-logistic-time
  title: When does a logistic model reach a level?
  topic: Logistic models
  vars:
    C: {choices: [500, 800, 1000, 2000, 5000]}
    A: {min: 4, max: 49}
    k: {choices: [0.2, 0.25, 0.3, 0.4, 0.5, 0.6]}
    pct: {choices: [60, 75, 80, 90, 95]}
  calc:
    target: C*pct/100
    rest: C - C*pct/100
    inside: A*(C*pct/100)/(C - C*pct/100)
    tv: ln(A*(C*pct/100)/(C - C*pct/100))/k
  prompt: 'For $P(t) = \dfrac{ {C:dp0} }{1 + {A}e^{-{k}t} }$, at what time $t$ does $P$ reach {target} ({pct}% of capacity)? Round to 2 decimal places.'
  answers:
    - {name: tv, label: '$t =$', tolerance: 0.005, format: num2}
  solution: |-
    Solve for $t$: $t = \dfrac1k\ln\dfrac{AP}{C - P} = \dfrac{1}{ {k} }\ln\dfrac{ {A} \cdot {target:dp0} }{ {rest:dp0} } = \dfrac{\ln({inside:num4})}{ {k} } \approx$ **{tv:num2}**.

- id: pc-m4-r2-logit-rate
  title: Growth rate from the logit
  topic: Logistic models
  vars:
    C: {choices: [500, 1000, 2000, 5000]}
    fr: {choices: [2, 4, 5, 8, 10]}
    kk: {choices: [0.3, 0.4, 0.5, 0.6, 0.8]}
    T: {min: 2, max: 6}
  calc:
    P0: C*fr/100
    A: C/(C*fr/100) - 1
    P1: round(C/(1 + (C/(C*fr/100) - 1)*exp(-kk*T)))
    L0: ln((C*fr/100)/(C - C*fr/100))
    L1: ln(P1/(C - P1))
    kv: (L1 - L0)/T
  where: ["P1 < 0.97*C"]
  prompt: 'A logistic process has carrying capacity {C}. It is at {P0} when $t = 0$ and at {P1} when $t = {T}$. Use the logit $\ln\dfrac{P}{C - P}$ to find $k$. (3 decimal places.)'
  answers:
    - {name: kv, label: '$k =$', tolerance: 0.0006, format: dp3}
  solution: |-
    Logits: $\ln\dfrac{ {P0:dp0} }{ {C:dp0} - {P0:dp0} } \approx {L0:num4}$ and $\ln\dfrac{ {P1:dp0} }{ {C:dp0} - {P1:dp0} } \approx {L1:num4}$. The logit is linear with slope $k$: $k = \dfrac{ {L1:num4} - ({L0:num4})}{ {T} } \approx$ **{kv:dp3}**.

- id: pc-m4-r2-three-point
  title: Carrying capacity from three points
  topic: Logistic models
  vars:
    C: {choices: [600, 800, 1000, 1200, 1500, 2000, 2400, 3000, 3600]}
    A: {choices: [3, 4, 5, 7, 9, 15, 24, 39]}
    m: {choices: [2, 3, 4, 5, 6]}
    h: {choices: [1, 2, 5, 10]}
  calc:
    P0: C/(1 + A)
    P1: C/(1 + A/m)
    P2: C/(1 + A/m^2)
    num: P1*(P0*P1 + P1*P2 - 2*P0*P2)
    den: P1^2 - P0*P2
    Cv: C
  where: ["abs(P0 - round(P0)) < 1e-9", "abs(P1 - round(P1)) < 1e-9", "abs(P2 - round(P2)) < 1e-9"]
  prompt: 'A quantity follows a logistic model. It is {P0:int} at $t = 0$, {P1:int} at $t = {h}$ and {P2:int} at $t = 2 \cdot {h}$. Find the carrying capacity $C$.'
  answers:
    - {name: Cv, label: '$C =$', tolerance: 0.5, format: integer}
  solution: |-
    Take reciprocals $y_n = 1/P_n$; they follow $y_n = c + Bq^n$ with $c = 1/C$. The differences give $q = \dfrac{y_2 - y_1}{y_1 - y_0} = \dfrac{1}{ {m} }$. Then $B = \dfrac{y_1 - y_0}{q - 1}$ and $c = y_0 - B = \dfrac{1}{ {Cv:dp0} }$. Equivalently, $C = \dfrac{P_1(P_0P_1 + P_1P_2 - 2P_0P_2)}{P_1^2 - P_0P_2} = \dfrac{ {num:dp0} }{ {den:dp0} } =$ **{Cv}**.

- id: pc-m4-r2-digits
  title: Count the digits of a power
  topic: Comparing growth
  vars:
    b: {choices: [2, 3, 5, 6, 7, 11, 12, 13]}
    n: {min: 20, max: 400}
  calc:
    lg: n*log10(b)
    dg: floor(n*log10(b)) + 1
  prompt: 'How many digits does ${b}^{ {n} }$ have?'
  answers:
    - {name: dg, label: 'Digits', format: integer}
  solution: |-
    $\log {b}^{ {n} } = {n}\log {b} \approx {lg:num4}$. A whole number $N$ has $\lfloor\log N\rfloor + 1$ digits, so ${b}^{ {n} }$ has **{dg}** digits.

- id: pc-m4-r2-largest-n
  title: Largest exponential job in a time budget
  topic: Comparing growth
  vars:
    s: {min: 6, max: 10}
    tt: {choices: [{label: 'one second', value: 1}, {label: 'one minute', value: 60}, {label: 'one hour', value: 3600}, {label: 'one day', value: 86400}]}
    b: {choices: [2, 3]}
  calc:
    ttv: tt
    budget: 10^s*tt
    lgb: log10(10^s*tt)
    nmax: floor(log10(10^s*tt)/log10(b))
    nexact: log10(10^s*tt)/log10(b)
  prompt: 'A computer does $10^{ {s} }$ operations per second. A job of size $n$ takes ${b}^n$ operations. What is the largest $n$ it can finish in {tt}?'
  answers:
    - {name: nmax, label: '$n =$', format: integer}
  solution: |-
    The budget is $10^{ {s} } \times {ttv:dp0} = {budget:texsci}$ operations, with common log ${lgb:num4}$. We need ${b}^n \le$ budget, so $n \le \dfrac{ {lgb:num4} }{\log {b}} \approx {nexact:num4}$. The largest whole number is **{nmax}**.

- id: pc-m4-r2-bisection-steps
  title: How many bisection steps?
  topic: Comparing growth
  vars:
    w: {choices: [0.5, 1, 2, 4]}
    d: {min: 2, max: 6}
  calc:
    tol: 10^(-d)
    ratio: w*10^d
    nn: floor(log(w*10^d)/log(2)) + 1
    lg2: log(w*10^d)/log(2)
  prompt: 'Bisection starts on an interval of width {w}. What is the smallest number of steps that makes the interval narrower than $10^{-{d}}$?'
  answers:
    - {name: nn, label: 'Steps', format: integer}
  solution: |-
    After $n$ steps the width is $\dfrac{ {w} }{2^n}$. We need $\dfrac{ {w} }{2^n} < 10^{-{d}}$, that is $2^n > {w} \times 10^{ {d} } = {ratio:dp0}$. Since $\log_2 {ratio:dp0} \approx {lg2:num4}$, the smallest whole $n$ is **{nn}**.
