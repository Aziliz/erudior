# Functions in depth (pc-m1), round 2 drills for the honors lessons
- id: pc-m1-r2-quad-midpoint-rate
  title: Average rate of a quadratic from the midpoint
  topic: Average rate of change
  vars:
    a: {choices: [-4, -3, -2, -1, 1, 2, 3, 4, 5]}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    m: {min: -5, max: 6}
    d: {min: 1, max: 5}
  where: ['b != 0', 'c != 0']
  calc:
    p: m - d
    q: m + d
    s: p + q
    rate: a*(p + q) + b
    asum: a*(p + q)
  prompt: 'Find the average rate of change of $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$ on the interval $[{p}, {q}]$.'
  answer: rate
  format: integer
  solution: |-
    For a quadratic $ax^2 + bx + c$, the average rate on $[p, q]$ is $a(p + q) + b$; the constant cancels. Here $p + q = {p} + ({q}) = {s}$, so the rate is ${a}({s}) {b:signed} = {asum} {b:signed} =$ **{rate}**.
    (Equivalently $2am + b$ with midpoint $m = {m}$.)

- id: pc-m1-r2-symmetric-dq
  title: Symmetric difference quotient of a cubic
  topic: Concavity
  vars:
    a: {choices: [-2, -1, 1, 2, 3]}
    b: {min: -6, max: 6}
    x0: {min: -3, max: 3}
    hh: {choices: [0.5, 0.2, 0.1]}
  where: ['b != 0', 'x0 != 0']
  calc:
    xp: x0 + hh
    xm: x0 - hh
    fp: a*xp^3 + b*xp
    fm: a*xm^3 + b*xm
    h2: 2*hh
    sdq: a*(3*x0^2 + hh^2) + b
    exact: 3*a*x0^2 + b
  prompt: 'Let $f(x) = {a:coef}x^3 {b:signedcoef}x$. Compute the symmetric difference quotient $\dfrac{f(x_0 + h) - f(x_0 - h)}{2h}$ at $x_0 = {x0}$ with $h = {hh}$. Give the exact decimal.'
  answer: sdq
  tolerance: 0.0005
  solution: |-
    $f({xp}) = {fp:num4}$ and $f({xm}) = {fm:num4}$. Divide their difference by $2h = {h2}$: $\dfrac{ {fp:num4} - ({fm:num4}) }{ {h2} } =$ **{sdq:num4}**.
    Shortcut: for $ax^3 + bx$ the quotient simplifies to $a(3x_0^2 + h^2) + b$. As $h$ shrinks it approaches $3ax_0^2 + b = {exact}$, the rate at $x_0$.

- id: pc-m1-r2-cubic-inflection
  title: Inflection point of a cubic
  topic: Concavity
  vars:
    a: {choices: [-3, -2, -1, 1, 2, 3]}
    xi: {min: -4, max: 4}
    cc: {min: -9, max: 9}
    dd: {min: -9, max: 9}
  where: ['xi != 0', 'cc != 0', 'abs(yi) <= 200']
  calc:
    bq: -3*a*xi
    a3: 3*a
    nb: -bq
    yi: a*xi^3 + bq*xi^2 + cc*xi + dd
  prompt: 'Find the inflection point of $f(x) = {a:coef}x^3 {bq:signedcoef}x^2 {cc:signedcoef}x {dd:signed}$.'
  answers:
    - {name: xi, label: '$x =$'}
    - {name: yi, label: '$y =$'}
  solution: |-
    A cubic $ax^3 + bx^2 + cx + d$ changes concavity at $x = -\dfrac{b}{\,3a} = \dfrac{ {nb} }{ {a3} } =$ **{xi}**.
    Then $f({xi}) =$ **{yi}**, so the inflection point is $({xi}, {yi})$.

- id: pc-m1-r2-abs-sum-min
  title: Minimize a sum of distances
  topic: Piecewise models
  vars:
    p: {min: -9, max: 2}
    g1: {min: 1, max: 8}
    g2: {min: 1, max: 8}
  where: ['p != 0', 'p + g1 != 0', 'p + g1 + g2 != 0']
  calc:
    q: p + g1
    r: q + g2
    dmin: r - p
    np: -p
    nq: -q
    nr: -r
  prompt: 'Find where $D(x) = |x {np:signed}| + |x {nq:signed}| + |x {nr:signed}|$ is smallest, and its smallest value.'
  answers:
    - {name: q, label: '$x =$'}
    - {name: dmin, label: 'Smallest value'}
  solution: |-
    $D(x)$ is the total distance from $x$ to {p}, {q} and {r}. Its slope is (points to the left) − (points to the right), which changes from negative to positive at the median, **{q}**.
    There $D({q}) = ({q} - ({p})) + 0 + ({r} - ({q})) = {r} - ({p}) =$ **{dmin}**.

- id: pc-m1-r2-tiered-tax
  title: Tax under a tiered schedule
  topic: Piecewise models
  vars:
    k: {min: 5, max: 120}
    r1: {choices: [10, 12]}
    r2: {choices: [20, 22, 25]}
    r3: {choices: [30, 32, 35]}
  calc:
    inc: 1000*k
    full1: 20000*r1/100
    full2: full1 + 30000*r2/100
    tax: if(inc <= 20000, inc*r1/100, if(inc <= 50000, full1 + (inc - 20000)*r2/100, full2 + (inc - 50000)*r3/100))
    over20: max(0, min(inc, 50000) - 20000)
    over50: max(0, inc - 50000)
    in1: min(inc, 20000)
    t1: min(inc, 20000)*r1/100
    t2: max(0, min(inc, 50000) - 20000)*r2/100
    t3: max(0, inc - 50000)*r3/100
  prompt: 'A made-up tax schedule charges {r1}% on the first 20,000 dollars of taxable income, {r2}% on the next 30,000 dollars (from 20,000 to 50,000), and {r3}% on income above 50,000 dollars. Find the tax on a taxable income of {inc:money0}.'
  answer: tax
  format: money
  solution: |-
    Tax each part at its own bracket's rate.
    First bracket: {r1}% of {in1:money0} = {t1:money}. Second bracket: {r2}% of {over20:money0} = {t2:money}. Third bracket: {r3}% of {over50:money0} = {t3:money}.
    Total: **{tax:money}**.

- id: pc-m1-r2-floor-equation
  title: Solve a floor equation
  topic: Piecewise models
  vars:
    a: {min: 2, max: 5}
    b: {min: -6, max: 6}
    n: {min: -8, max: 8}
  where: ['b != 0']
  calc:
    lo: (n - b)/a
    hi: (n + 1 - b)/a
    n1: n + 1
    nb1: n - b
    nb2: n + 1 - b
  prompt: 'The solutions of $\lfloor {a}x {b:signed} \rfloor = {n}$ form an interval $L \le x < R$. Find $L$ and $R$ as exact fractions or integers.'
  answers:
    - {name: lo, label: '$L =$', kind: fraction}
    - {name: hi, label: '$R =$', kind: fraction}
  solution: |-
    $\lfloor A \rfloor = {n}$ means ${n} \le A < {n1}$. So ${n} \le {a}x {b:signed} < {n1}$.
    Subtract the constant term from all three parts: ${nb1} \le {a}x < {nb2}$. Divide by {a}: ${lo:texfrac} \le x < {hi:texfrac}$.
    So $L =$ **{lo:frac}** and $R =$ **{hi:frac}**.
