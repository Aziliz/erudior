# Module pc-m5, round 2: drills for the honors lessons
- id: pc-m5-r2-solve-sin
  title: Solve sin x = c on [0, 2π)
  topic: Trig equations
  vars:
    k: {min: 1, max: 9}
    sgn: {choices: [1, -1]}
  calc:
    c: sgn*k/10
    al: asin(c)
    x1: if(c > 0, al, pi - al)
    x2: if(c > 0, pi - al, 2*pi + al)
  prompt: 'Solve $\sin x = {c}$ on $[0, 2\pi)$. Give both solutions in radians to 3 decimal places, smaller first.'
  answers:
    - {name: x1, label: 'Smaller $x =$', tolerance: 0.001, format: num4}
    - {name: x2, label: 'Larger $x =$', tolerance: 0.001, format: num4}
  solution: |-
    Principal value: $\alpha = \sin^{-1}({c}) \approx {al:num4}$. The partner is $\pi - \alpha$, and any negative angle gets $2\pi$ added. In $[0, 2\pi)$ the solutions are $x \approx$ **{x1:num4}** and $x \approx$ **{x2:num4}**.

- id: pc-m5-r2-solve-cos
  title: Solve cos x = c on [0, 2π)
  topic: Trig equations
  vars:
    k: {min: 1, max: 9}
    sgn: {choices: [1, -1]}
  calc:
    c: sgn*k/10
    be: acos(c)
    x2: 2*pi - be
  prompt: 'Solve $\cos x = {c}$ on $[0, 2\pi)$. Give both solutions in radians to 3 decimal places, smaller first.'
  answers:
    - {name: be, label: 'Smaller $x =$', tolerance: 0.001, format: num4}
    - {name: x2, label: 'Larger $x =$', tolerance: 0.001, format: num4}
  solution: |-
    Principal value: $\beta = \cos^{-1}({c}) \approx {be:num4}$, which is in $[0, \pi]$. The partner is $-\beta$; adding $2\pi$ puts it in the interval: $2\pi - \beta$. The solutions are $x \approx$ **{be:num4}** and $x \approx$ **{x2:num4}**.

- id: pc-m5-r2-multiple-angle
  title: Multiple-angle equations
  topic: Trig equations
  vars:
    B: {choices: [2, 3, 4]}
    k: {min: 1, max: 9}
  calc:
    c: k/10
    al: asin(c)
    xs: al/B
    n: 2*B
    tb: 2*B
  prompt: 'For $\sin({B}x) = {c}$, find the smallest positive solution (radians, 3 decimal places) and the number of solutions in $[0, 2\pi)$.'
  answers:
    - {name: xs, label: 'Smallest positive $x =$', tolerance: 0.001, format: num4}
    - {name: n, label: 'Number of solutions'}
  solution: |-
    Let $u = {B}x$. The smallest positive solution of $\sin u = {c}$ is $u = \sin^{-1}({c}) \approx {al:num4}$, so $x = \dfrac{ {al:num4} }{ {B} } \approx$ **{xs:num4}**. As $x$ runs over $[0, 2\pi)$, $u$ runs over $[0, {tb}\pi)$: {B} full turns with 2 solutions each, so **{n}** solutions.

- id: pc-m5-r2-amp-phase
  title: Amplitude-phase form
  topic: Combining sinusoids
  vars:
    a: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    b: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
  calc:
    R2: a^2 + b^2
    R: sqrt(R2)
    phi: atan2(b, a)
  prompt: 'Write ${a:coef}\sin x {b:signedcoef}\cos x$ as $R\sin(x + \varphi)$ with $R > 0$ and $-\pi < \varphi \le \pi$. Give $R$ (exact, like sqrt(13), or to 3 decimals) and $\varphi$ in radians to 3 decimal places.'
  answers:
    - {name: R, label: '$R =$', tolerance: 0.001, format: num4}
    - {name: phi, label: '$\varphi =$', tolerance: 0.001, format: num4}
  solution: |-
    $R = \sqrt{a^2 + b^2} = \sqrt{ {R2} } \approx$ **{R:num4}**. Then $\cos\varphi = \dfrac{ {a} }{\,R}$ and $\sin\varphi = \dfrac{ {b} }{\,R}$, so $\varphi$ is the direction of the point $({a}, {b})$; choose the angle in that point's quadrant (when the first coefficient is negative, add $\pi$ to the arctangent of the ratio and bring the result into $(-\pi, \pi]$): $\varphi \approx$ **{phi:num4}**.

- id: pc-m5-r2-wave-max
  title: Range and period of a combined wave
  topic: Combining sinusoids
  vars:
    a: {choices: [-8, -6, -5, -4, -3, 3, 4, 5, 6, 8, 12]}
    b: {choices: [-8, -6, -5, -4, -3, 3, 4, 5, 6, 8, 12]}
    B: {choices: [1, 2, 3, 4]}
    D: {min: -5, max: 5}
  where: ["D != 0"]
  calc:
    R2: a^2 + b^2
    R: sqrt(R2)
    mx: D + R
    mn: D - R
    per: 2*pi/B
  prompt: 'For $y = {a:coef}\sin({B:coef}x) {b:signedcoef}\cos({B:coef}x) {D:signed}$, find the maximum and minimum values (exact or 3 decimals) and the period (exact, like pi/2, or 3 decimals).'
  answers:
    - {name: mx, label: 'Maximum', tolerance: 0.001, format: num4}
    - {name: mn, label: 'Minimum', tolerance: 0.001, format: num4}
    - {name: per, label: 'Period', tolerance: 0.001, format: num4}
  solution: |-
    The two waves combine into one with amplitude $R = \sqrt{ {R2} } \approx {R:num4}$, so $y$ runs from ${D} - R$ to ${D} + R$: maximum **{mx:num4}**, minimum **{mn:num4}**. The period is $\dfrac{2\pi}{ {B} } \approx$ **{per:num4}**.

- id: pc-m5-r2-beats
  title: Beats
  topic: Combining sinusoids
  vars:
    f1: {min: 200, max: 500}
    d: {min: 1, max: 8}
  calc:
    f2: f1 + d
    avg: f1 + d/2
  prompt: 'Two pure tones of equal loudness, {f1} Hz and {f2} Hz, sound together. How many beats per second are heard, and what is the frequency (in Hz) of the tone inside the beats?'
  answers:
    - {name: d, label: 'Beats per second'}
    - {name: avg, label: 'Tone (Hz)', tolerance: 0.01, format: num1}
  solution: |-
    $\sin(2\pi f_1 t) + \sin(2\pi f_2 t) = 2\cos\left(\pi(f_2 - f_1)t\right)\sin\left(\pi(f_1 + f_2)t\right)$. The beat frequency is $|f_2 - f_1| =$ **{d}** per second, and the tone is at the average frequency $\dfrac{ {f1} + {f2} }{2} =$ **{avg:num1}** Hz.
