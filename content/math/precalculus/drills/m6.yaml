- id: pc-system3
  title: Solve a 3×3 linear system
  topic: Systems and Gaussian elimination
  vars:
    sx: {min: -5, max: 5}
    sy: {min: -5, max: 5}
    sz: {min: -5, max: 5}
    p1: {choices: [1, 1, 2, -1]}
    q1: {min: -3, max: 3}
    r1: {min: -3, max: 3}
    p2: {min: -3, max: 3}
    q2: {min: -3, max: 3}
    r2: {min: -3, max: 3}
    p3: {min: -3, max: 3}
    q3: {min: -3, max: 3}
    r3: {min: -3, max: 3}
  where: ["q1 != 0", "r1 != 0", "p2 != 0", "q2 != 0", "r2 != 0", "p3 != 0", "q3 != 0", "r3 != 0", "det != 0", "abs(det) <= 30"]
  calc:
    det: p1*(q2*r3 - r2*q3) - q1*(p2*r3 - r2*p3) + r1*(p2*q3 - q2*p3)
    d1: p1*sx + q1*sy + r1*sz
    d2: p2*sx + q2*sy + r2*sz
    d3: p3*sx + q3*sy + r3*sz
  prompt: |-
    Solve the system:

    $$\begin{cases} {p1:coef}x {q1:signedcoef}y {r1:signedcoef}z = {d1} \\ {p2:coef}x {q2:signedcoef}y {r2:signedcoef}z = {d2} \\ {p3:coef}x {q3:signedcoef}y {r3:signedcoef}z = {d3} \end{cases}$$
  answers:
    - {name: sx, label: '$x =$'}
    - {name: sy, label: '$y =$'}
    - {name: sz, label: '$z =$'}
  solution: |-
    Use row 1 to eliminate $x$ from rows 2 and 3, then use the new row 2 to eliminate $y$ from row 3, and back-substitute. (The coefficient determinant is {det}, so the solution is unique.) The solution is $x =$ **{sx}**, $y =$ **{sy}**, $z =$ **{sz}**; check it in each equation.

- id: pc-row-op
  title: Apply a row operation
  topic: Systems and Gaussian elimination
  vars:
    a1: {min: 1, max: 4}
    b1: {min: -6, max: 6}
    c1: {min: -9, max: 9}
    a2: {min: -6, max: 6}
    b2: {min: -6, max: 6}
    c2: {min: -9, max: 9}
    k: {choices: [-3, -2, -1, 2, 3]}
  where: ["a2 != 0", "b1 != 0", "b2 != 0"]
  calc:
    n1: a2 + k*a1
    n2: b2 + k*b1
    n3: c2 + k*c1
  prompt: 'Apply $R_2 {k:signedcoef}R_1 \to R_2$ to $\left[\begin{array}{cc|c} {a1} & {b1} & {c1} \\ {a2} & {b2} & {c2} \end{array}\right]$. What is the new row 2?'
  answers:
    - {name: n1, label: 'First entry'}
    - {name: n2, label: 'Second entry'}
    - {name: n3, label: 'Constant'}
  solution: |-
    Add ${k}$ times row 1 to row 2, entry by entry (including the constant): ${a2} + ({k})({a1}) = {n1}$, ${b2} + ({k})({b1}) = {n2}$, ${c2} + ({k})({c1}) = {n3}$. New row 2: **[{n1}, {n2} | {n3}]**.

- id: pc-matmul-2x2
  title: Multiply 2×2 matrices
  topic: Matrix operations
  vars:
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    c: {min: -5, max: 5}
    d: {min: -5, max: 5}
    e: {min: -5, max: 5}
    f: {min: -5, max: 5}
    g: {min: -5, max: 5}
    h: {min: -5, max: 5}
  where: ["a*b*c*d != 0", "e*f*g*h != 0"]
  calc:
    m11: a*e + b*g
    m12: a*f + b*h
    m21: c*e + d*g
    m22: c*f + d*h
  prompt: 'Find $AB$ for $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$ and $B = \begin{bmatrix} {e} & {f} \\ {g} & {h} \end{bmatrix}$.'
  answers:
    - {name: m11, label: 'Row 1, col 1'}
    - {name: m12, label: 'Row 1, col 2'}
    - {name: m21, label: 'Row 2, col 1'}
    - {name: m22, label: 'Row 2, col 2'}
  solution: |-
    Row times column: $({a})({e}) + ({b})({g}) = {m11}$, $({a})({f}) + ({b})({h}) = {m12}$, $({c})({e}) + ({d})({g}) = {m21}$, $({c})({f}) + ({d})({h}) = {m22}$. So $AB = \begin{bmatrix} {m11} & {m12} \\ {m21} & {m22} \end{bmatrix}$; the entries are **{m11}, {m12}, {m21}, {m22}**.

- id: pc-mat-combo
  title: Linear combination of matrices
  topic: Matrix operations
  vars:
    p: {choices: [2, 3, -2, 4]}
    q: {choices: [-1, -2, -3, 2, 3]}
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    c: {min: -5, max: 5}
    d: {min: -5, max: 5}
    e: {min: -5, max: 5}
    f: {min: -5, max: 5}
    g: {min: -5, max: 5}
    h: {min: -5, max: 5}
  calc:
    m11: p*a + q*e
    m12: p*b + q*f
    m21: p*c + q*g
    m22: p*d + q*h
  prompt: 'Let $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$ and $B = \begin{bmatrix} {e} & {f} \\ {g} & {h} \end{bmatrix}$. Find ${p}A {q:signedcoef}B$.'
  answers:
    - {name: m11, label: 'Row 1, col 1'}
    - {name: m12, label: 'Row 1, col 2'}
    - {name: m21, label: 'Row 2, col 1'}
    - {name: m22, label: 'Row 2, col 2'}
  solution: |-
    Entry by entry: ${p}({a}) + ({q})({e}) = {m11}$, ${p}({b}) + ({q})({f}) = {m12}$, ${p}({c}) + ({q})({g}) = {m21}$, ${p}({d}) + ({q})({h}) = {m22}$. Result: **{m11}, {m12}, {m21}, {m22}**.

- id: pc-matmul-entry
  title: One entry of a matrix product
  topic: Matrix operations
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    d: {min: -4, max: 4}
    e: {min: -4, max: 4}
    f: {min: -4, max: 4}
    g: {min: -4, max: 4}
    h: {min: -4, max: 4}
    u: {min: -4, max: 4}
    v: {min: -4, max: 4}
    w: {min: -4, max: 4}
    z: {min: -4, max: 4}
    i: {choices: [1, 2]}
    j: {choices: [1, 2]}
  calc:
    e11: a*g + b*u + c*w
    e12: a*h + b*v + c*z
    e21: d*g + e*u + f*w
    e22: d*h + e*v + f*z
    ans: if(i == 1, if(j == 1, e11, e12), if(j == 1, e21, e22))
  prompt: 'Find the entry in row {i}, column {j} of $\begin{bmatrix} {a} & {b} & {c} \\ {d} & {e} & {f} \end{bmatrix}\begin{bmatrix} {g} & {h} \\ {u} & {v} \\ {w} & {z} \end{bmatrix}$.'
  answers:
    - {name: ans, label: 'Entry'}
  solution: |-
    Dot row {i} of the first matrix with column {j} of the second. The full product is $\begin{bmatrix} {e11} & {e12} \\ {e21} & {e22} \end{bmatrix}$, so the entry is **{ans}**.

- id: pc-inverse-2x2
  title: Inverse of a 2×2 matrix
  topic: Inverse matrices
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  where: ["det != 0", "abs(det) <= 4", "a*b*c*d != 0"]
  calc:
    det: a*d - b*c
    i11: d/det
    i12: -b/det
    i21: -c/det
    i22: a/det
    nb: -b
    nc: -c
  prompt: 'Find $A^{-1}$ for $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$. Fractions are fine (type 1/2).'
  answers:
    - {name: i11, label: 'Row 1, col 1', kind: fraction}
    - {name: i12, label: 'Row 1, col 2', kind: fraction}
    - {name: i21, label: 'Row 2, col 1', kind: fraction}
    - {name: i22, label: 'Row 2, col 2', kind: fraction}
  solution: |-
    $\det A = ({a})({d}) - ({b})({c}) = {det}$. Swap the diagonal, negate the others, divide by {det}: $A^{-1} = \dfrac{1}{ {det} }\begin{bmatrix} {d} & {nb} \\ {nc} & {a} \end{bmatrix} = \begin{bmatrix} {i11:texfrac} & {i12:texfrac} \\ {i21:texfrac} & {i22:texfrac} \end{bmatrix}$.

- id: pc-solve-inverse
  title: Solve a system with an inverse matrix
  topic: Inverse matrices
  vars:
    a: {min: -5, max: 5}
    b: {min: -5, max: 5}
    c: {min: -5, max: 5}
    d: {min: -5, max: 5}
    sx: {min: -6, max: 6}
    sy: {min: -6, max: 6}
  where: ["det == 1 or det == -1", "a*b*c*d != 0"]
  calc:
    det: a*d - b*c
    e1: a*sx + b*sy
    e2: c*sx + d*sy
    i11: d/det
    i12: -b/det
    i21: -c/det
    i22: a/det
  prompt: 'The matrix $A = \begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$ has determinant {det}. Use $A^{-1}$ to solve ${a:coef}x {b:signedcoef}y = {e1}$, ${c:coef}x {d:signedcoef}y = {e2}$.'
  answers:
    - {name: sx, label: '$x =$'}
    - {name: sy, label: '$y =$'}
  solution: |-
    $A^{-1} = \begin{bmatrix} {i11} & {i12} \\ {i21} & {i22} \end{bmatrix}$, so $X = A^{-1}B = \begin{bmatrix} ({i11})({e1}) + ({i12})({e2}) \\ ({i21})({e1}) + ({i22})({e2}) \end{bmatrix}$, giving $x =$ **{sx}** and $y =$ **{sy}**.

- id: pc-det-3x3
  title: 3×3 determinant
  topic: Determinants and Cramer's rule
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    d: {min: -4, max: 4}
    e: {min: -4, max: 4}
    f: {min: -4, max: 4}
    g: {min: -4, max: 4}
    h: {min: -4, max: 4}
    k: {min: -4, max: 4}
  where: ["a != 0", "b != 0", "c != 0"]
  calc:
    m1: e*k - f*h
    m2: d*k - f*g
    m3: d*h - e*g
    det: a*m1 - b*m2 + c*m3
  prompt: 'Evaluate $\det\begin{bmatrix} {a} & {b} & {c} \\ {d} & {e} & {f} \\ {g} & {h} & {k} \end{bmatrix}$.'
  answers:
    - {name: det, label: 'Determinant'}
  solution: |-
    Expand along row 1 with signs $+, -, +$. Minors: ${m1}$, ${m2}$, ${m3}$. So $\det = {a}({m1}) - ({b})({m2}) + ({c})({m3}) =$ **{det}**.

- id: pc-cramer
  title: Cramer's rule for a 2×2 system
  topic: Determinants and Cramer's rule
  vars:
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
    e: {min: -12, max: 12}
    f: {min: -12, max: 12}
  where: ["a*b*c*d != 0", "D != 0", "e != 0", "f != 0"]
  calc:
    D: a*d - b*c
    Dx: e*d - b*f
    Dy: a*f - e*c
    xs: Dx/D
    ys: Dy/D
  prompt: 'Use Cramer''s rule to solve ${a:coef}x {b:signedcoef}y = {e}$, ${c:coef}x {d:signedcoef}y = {f}$. Give exact fractions.'
  answers:
    - {name: xs, label: '$x =$', kind: fraction, lowestTerms: true}
    - {name: ys, label: '$y =$', kind: fraction, lowestTerms: true}
  solution: |-
    $D = ({a})({d}) - ({b})({c}) = {D}$, $D_x = ({e})({d}) - ({b})({f}) = {Dx}$, $D_y = ({a})({f}) - ({e})({c}) = {Dy}$. So $x = \dfrac{D_x}{\,D} =$ **${xs:texfrac}$** and $y = \dfrac{D_y}{\,D} =$ **${ys:texfrac}$**.

- id: pc-pf-linear
  title: Partial fractions with linear factors
  topic: Partial fractions
  vars:
    A: {min: -6, max: 6}
    B: {min: -6, max: 6}
    p: {min: -5, max: 5}
    q: {min: -5, max: 5}
  where: ["A != 0", "B != 0", "p < q", "m != 0", "n != 0", "p != 0", "q != 0"]
  calc:
    m: A + B
    n: -(A*q + B*p)
    np: -p
    nq: -q
    dp: p - q
    dq: q - p
    vp: m*p + n
    vq: m*q + n
  prompt: 'Find $A$ and $B$ so that $\dfrac{ {m:coef}x {n:signed} }{(x {np:signed})(x {nq:signed})} = \dfrac{\,A}{x {np:signed}} + \dfrac{\,B}{x {nq:signed}}$.'
  answers:
    - {name: A, label: '$A =$'}
    - {name: B, label: '$B =$'}
  solution: |-
    Clear denominators: ${m:coef}x {n:signed} = A(x {nq:signed}) + B(x {np:signed})$. At $x = {p}$: ${vp} = {dp:coef}A$, so $A =$ **{A}**. At $x = {q}$: ${vq} = {dq:coef}B$, so $B =$ **{B}**.

- id: pc-pf-repeated
  title: Partial fractions with a repeated factor
  topic: Partial fractions
  vars:
    A: {min: -4, max: 4}
    B: {min: -5, max: 5}
    C: {min: -4, max: 4}
    p: {min: -3, max: 3}
    q: {min: -4, max: 4}
  where: ["A != 0", "B != 0", "C != 0", "p != q", "p != 0", "q != 0", "c2 != 0", "c1 != 0", "c0 != 0"]
  calc:
    c2: A + C
    c1: -A*(p + q) + B - 2*p*C
    c0: A*p*q - B*q + C*p^2
    np: -p
    nq: -q
  prompt: 'Find $A$, $B$ and $C$: $\dfrac{ {c2:coef}x^2 {c1:signedcoef}x {c0:signed} }{(x {np:signed})^2(x {nq:signed})} = \dfrac{\,A}{x {np:signed}} + \dfrac{\,B}{(x {np:signed})^2} + \dfrac{\,C}{x {nq:signed}}$.'
  answers:
    - {name: A, label: '$A =$'}
    - {name: B, label: '$B =$'}
    - {name: C, label: '$C =$'}
  solution: |-
    Clear denominators: ${c2:coef}x^2 {c1:signedcoef}x {c0:signed} = A(x {np:signed})(x {nq:signed}) + B(x {nq:signed}) + C(x {np:signed})^2$. At $x = {p}$ only the $B$ term survives, giving $B =$ **{B}**. At $x = {q}$ only the $C$ term survives, giving $C =$ **{C}**. Matching $x^2$ coefficients: $A + C = {c2}$, so $A =$ **{A}**.
