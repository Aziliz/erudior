- id: pc-even-odd-value
  title: Use even and odd symmetry
  topic: Even and odd functions
  vars:
    p: {min: 1, max: 9}
    u: {min: -12, max: 12}
    v: {min: -12, max: 12}
    m: {min: 2, max: 4}
  where: ["u != 0", "v != 0"]
  calc:
    fm: u
    gm: -v
    ans: u - m*gm
  prompt: '$f$ is an even function and $g$ is an odd function. You know $f({p}) = {u}$ and $g({p}) = {v}$. Find $f(-{p}) - {m}\,g(-{p})$.'
  answers:
    - {name: ans, label: 'Value'}
  solution: |-
    Even: $f(-{p}) = f({p}) = {fm}$. Odd: $g(-{p}) = -g({p}) = {gm}$. So $f(-{p}) - {m}\,g(-{p}) = {fm} - {m}({gm}) =$ **{ans}**.

- id: pc-transform-point
  title: Move a point through a transformation
  topic: Transformations
  vars:
    B: {choices: [1, 2, 3, -1, -2]}
    m: {min: -4, max: 4}
    q: {min: -6, max: 6}
    A: {choices: [-3, -2, -1, 2, 3]}
    H: {min: -5, max: 5}
    K: {min: -6, max: 6}
  where: ["H != 0", "K != 0"]
  calc:
    p: B*m
    cc: -B*H
    nx: p/B + H
    ny: A*q + K
  prompt: 'The point $({p}, {q})$ is on the graph of $y = f(x)$. Find the point it moves to on the graph of $y = {A:coef}f({B:coef}x {cc:signed}) {K:signed}$.'
  answers:
    - {name: nx, label: 'New $x$'}
    - {name: ny, label: 'New $y$'}
  solution: |-
    Factor the inside: ${B:coef}x {cc:signed} = {B}(x - ({H}))$, so the inside needs to equal {p}: $x = \dfrac{ {p} }{ {B} } + ({H}) = {nx}$. Outside: $y = {A}({q}) + ({K}) = {ny}$. The point is **({nx}, {ny})**.

- id: pc-transform-write
  title: Write the equation of a transformed absolute value graph
  topic: Transformations
  vars:
    a: {choices: [-3, -2, -1, -0.5, 0.5, 2, 3]}
    h: {min: -4, max: 4}
    k: {min: -4, max: 4}
  where: ["h != 0", "k != 0"]
  calc:
    nh: -h
    h1: h + 1
    k1: a + k
  prompt: 'The solid graph is $y = \lvert x \rvert$ (dashed) after a vertical stretch or reflection and a shift. The marked points are the vertex and the point one unit to its right. Write its equation.'
  figure:
    type: plot
    x: [-8, 8]
    y: [-8, 8]
    functions:
      - {f: 'abs(x)', dashed: true}
      - {f: 'a*abs(x - h) + k'}
    points:
      - {at: [h, k], label: '({h}, {k})'}
      - {at: [h1, k1], label: '({h1}, {k1})'}
  answers:
    - {kind: expression, expression: 'a*abs(x - h) + k', variables: [x], label: '$y =$', show: '$y = {a:coef}\lvert x {nh:signed} \rvert {k:signed}$'}
  solution: |-
    The vertex $({h}, {k})$ gives the shift: $\lvert x {nh:signed} \rvert$ and ${k:signed}$. Moving 1 right from the vertex changes $y$ by ${k1} - ({k}) = {a}$, so the stretch factor is $a = {a}$. Equation: **$y = {a:coef}\lvert x {nh:signed} \rvert {k:signed}$**.

- id: pc-compose-eval
  title: Evaluate compositions
  topic: Composition
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    t: {min: -4, max: 4}
  where: ["a != 0", "a != 1", "b != 0", "c != 0"]
  calc:
    gt: t^2 + c
    fgt: a*gt + b
    ft: a*t + b
    gft: ft^2 + c
  prompt: 'Let $f(x) = {a:coef}x {b:signed}$ and $g(x) = x^2 {c:signed}$. Find $f(g({t}))$ and $g(f({t}))$.'
  answers:
    - {name: fgt, label: '$f(g({t})) =$'}
    - {name: gft, label: '$g(f({t})) =$'}
  solution: |-
    Inside first. $g({t}) = {gt}$, so $f(g({t})) = f({gt}) =$ **{fgt}**. And $f({t}) = {ft}$, so $g(f({t})) = g({ft}) =$ **{gft}**.

- id: pc-compose-expr
  title: Find a composition formula
  topic: Composition
  vars:
    b: {min: -6, max: 6}
    p: {min: -4, max: 4}
    q: {min: -6, max: 6}
  where: ["b != 0", "p != 0", "p != 1", "q != 0", "c1 != 0", "c0 != 0"]
  calc:
    c2: p^2
    c1: 2*p*q + b*p
    c0: q^2 + b*q
  prompt: 'Let $f(x) = x^2 {b:signedcoef}x$ and $g(x) = {p:coef}x {q:signed}$. Find $(f \circ g)(x)$ and simplify.'
  answers:
    - {kind: expression, expression: '(p*x + q)^2 + b*(p*x + q)', variables: [x], label: '$(f \circ g)(x) =$', show: '${c2:coef}x^2 {c1:signedcoef}x {c0:signed}$'}
  solution: |-
    Substitute $g(x)$ for every $x$ in $f$: $({p:coef}x {q:signed})^2 + ({b})({p:coef}x {q:signed})$. Expand: **${c2:coef}x^2 {c1:signedcoef}x {c0:signed}$**.

- id: pc-inverse-linear
  title: Inverse of a linear function
  topic: Inverse functions
  vars:
    a: {min: 2, max: 7}
    b: {min: -9, max: 9}
    c: {min: 2, max: 7}
  where: ["a != c", "b != 0"]
  calc:
    nb: -b
  prompt: 'Find $f^{-1}(x)$ for $f(x) = \dfrac{ {a}x {b:signed} }{ {c} }$.'
  answers:
    - {kind: expression, expression: '(c*x - b)/a', variables: [x], label: '$f^{-1}(x) =$', show: '$\dfrac{ {c}x {nb:signed} }{ {a} }$'}
  solution: |-
    Write $y = \dfrac{ {a}x {b:signed} }{ {c} }$ and swap: $x = \dfrac{ {a}y {b:signed} }{ {c} }$. Multiply by {c}: ${c}x = {a}y {b:signed}$. Then ${a}y = {c}x {nb:signed}$, so **$f^{-1}(x) = \dfrac{ {c}x {nb:signed} }{ {a} }$**.

- id: pc-inverse-rational
  title: Inverse of a rational function
  topic: Inverse functions
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    d: {min: -6, max: 6}
  where: ["a != 0", "b != 0", "d != 0", "a*d - b != 0"]
  calc:
    nd: -d
    na: -a
  prompt: 'Find $f^{-1}(x)$ for $f(x) = \dfrac{ {a:coef}x {b:signed} }{ x {d:signed} }$.'
  answers:
    - {kind: expression, expression: '(b - d*x)/(x - a)', variables: [x], label: '$f^{-1}(x) =$', show: '$\dfrac{ {nd:coef}x {b:signed} }{ x {na:signed} }$'}
  solution: |-
    Swap: $x = \dfrac{ {a:coef}y {b:signed} }{ y {d:signed} }$. Clear the fraction: $xy {d:signedcoef}x = {a:coef}y {b:signed}$. Gather the $y$ terms: $xy {na:signedcoef}y = {b} {nd:signedcoef}x$, so $y(x {na:signed}) = {nd:coef}x {b:signed}$ and **$f^{-1}(x) = \dfrac{ {nd:coef}x {b:signed} }{ x {na:signed} }$**.

- id: pc-inverse-value
  title: Evaluate an inverse without its formula
  topic: Inverse functions
  vars:
    a: {min: 1, max: 4}
    b: {min: -9, max: 9}
    r: {min: -3, max: 3}
  where: ["b != 0", "r != 0"]
  calc:
    kk: r^3 + a*r + b
  prompt: '$f(x) = x^3 {a:signedcoef}x {b:signed}$ is one-to-one (it is always increasing). Find $f^{-1}({kk})$. (Hint: try small integers.)'
  answers:
    - {name: r, label: 'Input $x =$'}
  solution: |-
    $f^{-1}({kk})$ is the input that gives output {kk}. Trying $x = {r}$: $({r})^3 + {a}({r}) + ({b}) = {kk}$. ✓ Since $f$ is one-to-one, that input is unique: **{r}**.
