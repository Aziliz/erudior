# Round 2, module pc-m9: drills for the honors lessons.

- id: pc-m9-r2-affine-term
  title: Solve a first-order recurrence
  topic: Recurrence relations
  vars:
    rat: {choices: [2, 3, -2, 0.5, -0.5]}
    add: {min: -9, max: 9}
    st: {min: -10, max: 10}
    m: {min: 3, max: 6}
  where: ["add != 0", "st*(1 - rat) != add"]
  calc:
    fix: add/(1 - rat)
    gap: st - fix
    rm: rat^m
    am: fix + gap*rat^m
  prompt: 'A sequence has $a_0 = {st}$ and $a_{n+1} = {rat:texfrac}\,a_n {add:signed}$. Find its fixed point $L$ and the term $a_{ {m} }$ (exact; fractions are fine).'
  answers:
    - {name: fix, label: '$L =$', kind: fraction}
    - {name: am, label: '$a_{ {m} } =$', kind: fraction}
  solution: |-
    The fixed point solves $L = {rat:texfrac}L {add:signed}$, so $L = \dfrac{ {add} }{1 - \left({rat:texfrac}\right)} =$ **${fix:texfrac}$**. The distance from $L$ is multiplied by ${rat:texfrac}$ each step, so $a_n = L + (a_0 - L)\left({rat:texfrac}\right)^n$ with $a_0 - L = {gap:texfrac}$. Then $a_{ {m} } = {fix:texfrac} + \left({gap:texfrac}\right)\left({rm:texfrac}\right) =$ **${am:texfrac}$**.

- id: pc-m9-r2-affine-limit
  title: Long-run level of a repeated dose
  topic: Recurrence relations
  vars:
    dose: {min: 50, max: 500, step: 25}
    keep: {choices: [0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.75, 0.8]}
  calc:
    kp: keep*100
    a2: dose*(1 + keep)
    a3: dose*(1 + keep + keep^2)
    lim: dose/(1 - keep)
  prompt: 'A patient takes {dose} mg of a drug once a day. By the next day, {kp}% of the drug in the body remains. Let $A_n$ be the amount right after the $n$th dose, so $A_1 = {dose}$ and $A_{n+1} = {keep}A_n + {dose}$. Find $A_3$ and the long-run level (the fixed point), each to 1 decimal place.'
  answers:
    - {name: a3, label: '$A_3 =$', tolerance: 0.051, units: {mg: 1}}
    - {name: lim, label: 'Long-run level', tolerance: 0.051, units: {mg: 1}}
  solution: |-
    $A_2 = {keep}({dose}) + {dose} = {a2:num2}$ and $A_3 = {keep}({a2:num2}) + {dose} =$ **{a3:num2} mg**. The fixed point solves $L = {keep}L + {dose}$: $L = \dfrac{ {dose} }{1 - {keep}} =$ **{lim:num2} mg**. Since $|{keep}| < 1$, the amounts approach this level.

- id: pc-m9-r2-second-order
  title: Solve a second-order recurrence
  topic: Recurrence relations
  vars:
    s: {min: -3, max: 4}
    t: {min: -3, max: 4}
    cA: {min: -3, max: 3}
    cB: {min: -3, max: 3}
  where: ["s > t", "s != 0", "t != 0", "s + t != 0", "cA != 0", "cB != 0"]
  calc:
    p: s + t
    q: -s*t
    mp: -p
    mq: s*t
    z0: cA + cB
    z1: cA*s + cB*t
    z2: p*z1 + q*z0
  prompt: 'Solve $a_n = {p:coef}a_{n-1} {q:signedcoef}a_{n-2}$ with $a_0 = {z0}$ and $a_1 = {z1}$. Write the answer as $a_n = A\,x_1^{\,n} + B\,x_2^{\,n}$, where $x_1 > x_2$ are the roots of the characteristic equation.'
  answers:
    - {name: s, label: '$x_1 =$'}
    - {name: t, label: '$x_2 =$'}
    - {name: cA, label: '$A =$'}
    - {name: cB, label: '$B =$'}
  solution: |-
    Trying $a_n = x^n$ gives $x^2 = {p:coef}x {q:signed}$, so the characteristic equation is $x^2 {mp:signedcoef}x {mq:signed} = 0$, with roots $x_1 =$ **{s}** and $x_2 =$ **{t}** (their sum is {p} and their product is {s}·({t})). Then $A + B = {z0}$ and $A({s}) + B({t}) = {z1}$, which give $A =$ **{cA}** and $B =$ **{cB}**. Check: the rule gives $a_2 = {p}({z1}) + ({q})({z0}) = {z2}$, and the formula gives ${cA}({s})^2 + ({cB})({t})^2 = {z2}$.

- id: pc-m9-r2-multiset
  title: Arrangements with repeated objects
  topic: Advanced counting
  vars:
    nr: {min: 1, max: 5}
    nb: {min: 1, max: 4}
    ng: {min: 1, max: 3}
  where: ["nr + nb + ng >= 5"]
  calc:
    tot: nr + nb + ng
    ft: fact(tot)
    ans: fact(tot)/(fact(nr)*fact(nb)*fact(ng))
  prompt: 'A signal is a row of {nr} identical red flags, {nb} identical blue flags and {ng} identical green flags ({tot} flags in all). How many different signals are possible?'
  answers:
    - {name: ans, label: 'Signals'}
  solution: |-
    Arrange {tot} flags, then divide out the orders of identical flags: $\dfrac{ {tot}! }{ {nr}!\,{nb}!\,{ng}! } = \dfrac{ {ft:dp0} }{ {nr}!\,{nb}!\,{ng}! } =$ **{ans:dp0}**.

- id: pc-m9-r2-stars-bars
  title: Identical objects into groups
  topic: Advanced counting
  vars:
    items: {min: 5, max: 15}
    kids: {min: 2, max: 5}
    mode: {choices: [{label: 'any child may get none', value: 0}, {label: 'every child gets at least one', value: 1}]}
  where: ["items >= kids"]
  calc:
    left: items - mode*kids
    km1: kids - 1
    top: left + kids - 1
    ans: nCr(top, km1)
  prompt: 'In how many ways can {items} identical marbles be given to {kids} children if {mode}?'
  answers:
    - {name: ans, label: 'Ways'}
  solution: |-
    After first handing out one marble to each child when that is required, {left} marbles are left to share freely among {kids} children. Stars and bars: {left} stars and {km1} bars in {top} positions, so $\dbinom{ {top} }{ {km1} } =$ **{ans:dp0}**.

- id: pc-m9-r2-incl-excl
  title: Divisible by one number or another
  topic: Advanced counting
  vars:
    big: {min: 100, max: 1000, step: 50}
    d1: {choices: [2, 3, 4, 5, 6]}
    d2: {choices: [3, 4, 5, 6, 7, 9, 10]}
  where: ["d1 < d2", "lcm(d1, d2) != d2"]
  calc:
    m1: floor(big/d1)
    m2: floor(big/d2)
    l: lcm(d1, d2)
    m12: floor(big/l)
    either: m1 + m2 - m12
    neither: big - either
  prompt: 'How many integers from 1 to {big} are divisible by {d1} or by {d2}? How many are divisible by neither?'
  answers:
    - {name: either, label: 'Divisible by either'}
    - {name: neither, label: 'Divisible by neither'}
  solution: |-
    Multiples of {d1}: $\lfloor {big}/{d1} \rfloor = {m1}$. Multiples of {d2}: ${m2}$. Numbers divisible by both are multiples of $\operatorname{lcm}({d1}, {d2}) = {l}$: ${m12}$, counted twice. So ${m1} + {m2} - {m12} =$ **{either}**, and ${big} - {either} =$ **{neither}** are divisible by neither.

- id: pc-m9-r2-binom-exact
  title: Probability of exactly k successes
  topic: Binomial probability
  vars:
    n: {min: 4, max: 10}
    k: {min: 0, max: 10}
    p: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9]}
  where: ["k <= n", "binompdf(n, p, k) > 0.002"]
  calc:
    q: 1 - p
    nk: n - k
    C: nCr(n, k)
    P: binompdf(n, p, k)
  prompt: 'Each of {n} independent trials succeeds with probability {p}. What is the probability of exactly {k} successes? Give it to 4 decimal places.'
  answers:
    - {name: P, label: '$P(X = {k}) =$', tolerance: 0.0001}
  solution: |-
    $P(X = {k}) = \dbinom{ {n} }{ {k} }({p})^{ {k} }({q})^{ {nk} } = {C:dp0}\cdot({p})^{ {k} }({q})^{ {nk} } \approx$ **{P:dp4}**.

- id: pc-m9-r2-binom-atleast
  title: At least one success, and the mean
  topic: Binomial probability
  vars:
    n: {min: 3, max: 12}
    p: {choices: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5]}
  calc:
    q: 1 - p
    qn: q^n
    P: 1 - q^n
    mu: n*p
  prompt: 'Each of {n} independent trials succeeds with probability {p}. Find the probability of at least one success (to 4 decimal places) and the expected number of successes.'
  answers:
    - {name: P, label: '$P(X \ge 1) =$', tolerance: 0.0001}
    - {name: mu, label: '$E(X) =$', tolerance: 0.001}
  solution: |-
    The complement of "at least one" is "none": $P(X = 0) = ({q})^{ {n} } \approx {qn:dp4}$, so $P(X \ge 1) = 1 - {qn:dp4} \approx$ **{P:dp4}**. The expected number is $np = {n}({p}) =$ **{mu:num2}**.

- id: pc-m9-r2-expected-game
  title: Expected value of a dice game
  topic: Expected value
  vars:
    cost: {min: 1, max: 6}
    prize: {min: 3, max: 20}
    need: {choices: [4, 5, 6]}
  calc:
    wins: 7 - need
    pw: wins/6
    payout: prize*wins/6
    E: payout - cost
  prompt: 'You pay \${cost} to roll a die. If the roll is {need} or higher you receive \${prize}; otherwise you receive nothing. What is your expected net gain per game, in dollars, to the nearest cent? (Negative means a loss.)'
  answers:
    - {name: E, label: 'Expected net gain', tolerance: 0.006, format: money}
  solution: |-
    You win on {wins} of the 6 faces, so $P(\text{win}) = {pw:texfrac}$. The expected payout is ${prize} \cdot {pw:texfrac} \approx {payout:num2}$, and the cost is {cost}, so $E \approx {payout:num2} - {cost} =$ **{E:num2}** dollars per game.
