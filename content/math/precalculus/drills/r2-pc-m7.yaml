- id: pc-m7-r2-rotation-angle
  title: Angle that removes the xy term
  topic: Rotation of axes
  vars:
    A: {min: -6, max: 9}
    C: {min: -6, max: 9}
    B: {choices: [-8, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 8]}
    G: {choices: [4, 6, 8, 10, 12, 20]}
  where: ["A != 0", "C != 0", "A != C", "max(max(A, C), B^2 - 4*A*C) > 0"]
  calc:
    ct: (A - C)/B
    tt: atan2d(abs(B), sign(B)*(A - C))
    th: tt/2
  prompt: 'Rotating the axes through an acute angle $\theta$ removes the $xy$ term from ${A:coef}x^2 {B:signedcoef}xy {C:signedcoef}y^2 = {G}$. Find $\theta$ in degrees, to 1 decimal place.'
  answers:
    - {name: th, label: '$\theta =$', tolerance: 0.06}
  solution: |-
    $\cot 2\theta = \dfrac{A - C}{\,B} = \dfrac{ {A} - ({C}) }{ {B} } \approx {ct:num4}$. For $0° < 2\theta < 180°$ this gives $2\theta \approx {tt:num2}°$, so $\theta \approx$ **{th:num1}°**. (A negative cotangent puts $2\theta$ between $90°$ and $180°$.)

- id: pc-m7-r2-rotated-coefs
  title: New coefficients after a rotation
  topic: Rotation of axes
  vars:
    Ap: {min: -6, max: 9}
    k: {choices: [-2, -1, 1, 2]}
    tp: {choices: [1, 2]}
    G: {choices: [4, 6, 8, 10, 12, 20]}
  where: ["Ap != 0", "Cp != 0", "A != 0", "C != 0", "max(Ap, Cp) > 0"]
  calc:
    Cp: Ap + 5*k
    A: if(tp == 1, (4*Ap + Cp)/5, (Ap + 4*Cp)/5)
    C: if(tp == 1, (Ap + 4*Cp)/5, (4*Ap + Cp)/5)
    B: 4*(Ap - Cp)/5
    ct: (A - C)/B
    c2: if(tp == 1, 3/5, -3/5)
    cs: if(tp == 1, 4/5, 1/5)
    sn: if(tp == 1, 1/5, 4/5)
    tot2: A + C
  prompt: 'Rotate the axes through the acute angle $\theta$ with $\cot 2\theta = \dfrac{A - C}{\,B}$ to remove the $xy$ term from ${A:coef}x^2 {B:signedcoef}xy {C:signedcoef}y^2 = {G}$. The result is $A''x''^2 + C''y''^2 = {G}$. Find $A''$ and $C''$.'
  answers:
    - {name: Ap, label: '$A'' =$'}
    - {name: Cp, label: '$C'' =$'}
  solution: |-
    $\cot 2\theta = \dfrac{ {A} - ({C}) }{ {B} } = {ct:texfrac}$, so $\cos 2\theta = {c2:texfrac}$ (same sign). Half-angle formulas: $\cos^2\theta = \dfrac{1 + \cos 2\theta}{2} = {cs:texfrac}$, $\sin^2\theta = {sn:texfrac}$, and $\sin\theta\cos\theta = \tfrac25$.

    $A' = A\cos^2\theta + B\sin\theta\cos\theta + C\sin^2\theta = {A}\cdot{cs:texfrac} + ({B})\cdot\tfrac25 + ({C})\cdot{sn:texfrac} =$ **{Ap}**.

    $C' = A\sin^2\theta - B\sin\theta\cos\theta + C\cos^2\theta = {A}\cdot{sn:texfrac} - ({B})\cdot\tfrac25 + ({C})\cdot{cs:texfrac} =$ **{Cp}**.

    Check with the invariant: $A' + C' = {tot2} = A + C$.

- id: pc-m7-r2-focal-radii
  title: Focal radii of a point on an ellipse
  topic: Geometry of conics
  vars:
    tr: {choices: [1, 2, 3, 4]}
    x0: {min: -16, max: 16}
  where: ["abs(x0) < a", "x0 != 0"]
  calc:
    b: if(tr == 1, 3, if(tr == 2, 5, if(tr == 3, 6, 8)))
    c: if(tr == 1, 4, if(tr == 2, 12, if(tr == 3, 8, 15)))
    a: if(tr == 1, 5, if(tr == 2, 13, if(tr == 3, 10, 17)))
    a2: a^2
    b2: b^2
    ecc: c/a
    d1: a + c*x0/a
    d2: a - c*x0/a
    tot: d1 + d2
  prompt: 'The point $P$ on the ellipse $\dfrac{x^2}{ {a2} } + \dfrac{y^2}{ {b2} } = 1$ has $x$-coordinate ${x0}$. Find its distances to the foci $F_1 = (-{c}, 0)$ and $F_2 = ({c}, 0)$. Give exact fractions or decimals to 2 places.'
  answers:
    - {name: d1, label: '$PF_1 =$', tolerance: 0.006}
    - {name: d2, label: '$PF_2 =$', tolerance: 0.006}
  solution: |-
    $a = {a}$ and $c = \sqrt{ {a2} - {b2} } = {c}$, so $e = \dfrac{\,c}{\,a} = {ecc:texfrac}$. The focal radii are $PF_1 = a + ex_0 = {a} + {ecc:texfrac}({x0}) =$ **${d1:texfrac} \approx {d1:num2}$** and $PF_2 = a - ex_0 = {a} - {ecc:texfrac}({x0}) =$ **${d2:texfrac} \approx {d2:num2}$**. Check: they add to $2a = {tot}$.

- id: pc-m7-r2-parabola-tangent
  title: Tangent line and focal distance of a parabola
  topic: Geometry of conics
  vars:
    p: {choices: [1, 2, 3, 4]}
    m: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    x0: 2*p*m
    y0: p*m^2
    fp: 4*p
    ny: -y0
    fd: y0 + p
    tp: 2*p
  prompt: 'For the parabola $x^2 = {fp}y$, find the slope of the tangent line at $P = ({x0}, {y0})$, the $y$-intercept of that tangent line, and the distance from $P$ to the focus.'
  answers:
    - {name: m, label: 'Slope'}
    - {name: ny, label: '$y$-intercept'}
    - {name: fd, label: '$PF =$'}
  solution: |-
    $4p = {fp}$, so $p = {p}$ and the focus is $(0, {p})$. The tangent to $x^2 = 4py$ at $(x_0, y_0)$ has slope $\dfrac{x_0}{2p} = \dfrac{ {x0} }{ {tp} } =$ **{m}** and meets the axis at $(0, -y_0)$, so the $y$-intercept is **{ny}**. The distance to the focus equals the distance to the directrix $y = -{p}$: $PF = y_0 + p = {y0} + {p} =$ **{fd}**.

- id: pc-m7-r2-apsides
  title: Perihelion and aphelion distances
  topic: Orbits
  vars:
    a: {min: 0.4, max: 40, step: 0.1}
    ecc: {min: 0.01, max: 0.95, step: 0.01}
  calc:
    q: a*(1 - ecc)
    Q: a*(1 + ecc)
    ome: 1 - ecc
    ope: 1 + ecc
  prompt: 'An object orbits the Sun on an ellipse with semi-major axis $a = {a:num1}$ AU and eccentricity $e = {ecc:num2}$. Find its perihelion and aphelion distances in AU (exact decimals).'
  answers:
    - {name: q, label: 'Perihelion (AU)', tolerance: 0.001}
    - {name: Q, label: 'Aphelion (AU)', tolerance: 0.001}
  solution: |-
    The Sun is at a focus, $c = ae$ from the center. Perihelion: $a(1 - e) = {a:num1}({ome:num2}) =$ **{q:dp3}** AU. Aphelion: $a(1 + e) = {a:num1}({ope:num2}) =$ **{Q:dp3}** AU.

- id: pc-m7-r2-orbit-from-apsides
  title: Orbit size and shape from its closest and farthest points
  topic: Orbits
  vars:
    q: {min: 0.3, max: 5, step: 0.1}
    Q: {min: 1, max: 40, step: 0.5}
  where: ["Q > q + 0.5"]
  calc:
    a: (q + Q)/2
    ecc: (Q - q)/(Q + q)
    df: Q - q
    sm: Q + q
  prompt: 'An object orbiting the Sun comes within {q:num1} AU of it and reaches {Q:num1} AU at its farthest. Find the semi-major axis $a$ (exactly) and the eccentricity $e$ (to 3 decimal places).'
  answers:
    - {name: a, label: '$a =$ (AU)', tolerance: 0.001}
    - {name: ecc, label: '$e =$', tolerance: 0.0006}
  solution: |-
    The major axis runs from perihelion to aphelion, so $a = \dfrac{q + Q}{2} = \dfrac{ {sm:num1} }{2} =$ **{a:num2}** AU, and $e = \dfrac{Q - q}{Q + q} = \dfrac{ {df:num1} }{ {sm:num1} } \approx$ **{ecc:dp3}**.

- id: pc-m7-r2-kepler-period
  title: "Period from Kepler's third law"
  topic: Orbits
  vars:
    a: {min: 0.3, max: 45, step: 0.01}
  calc:
    T: a^1.5
  prompt: 'An asteroid orbits the Sun with semi-major axis {a:num2} AU. Use Kepler''s third law to find its period in years, to 2 decimal places.'
  answers:
    - {name: T, label: '$T =$ (years)', tolerance: 0.006}
  solution: |-
    With $T$ in years and $a$ in AU, $T^2 = a^3$, so $T = a^{3/2} = ({a:num2})^{3/2} \approx$ **{T:num2}** years. (Equivalently, $T = \sqrt{a^3}$.)
