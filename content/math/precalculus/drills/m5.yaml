- id: pc-deg-to-rad
  title: Degrees to radians
  topic: Unit circle
  vars:
    d: {min: 1, max: 23}
    sgn: {choices: [1, 1, 1, -1]}
  where: ["mod(d, 12) != 0"]
  calc:
    deg: sgn*15*d
    k: deg/180
    rad: deg*pi/180
  prompt: 'Convert ${deg}^\circ$ to radians. Give an exact answer such as 5pi/6 (or a decimal to 4 places).'
  answers:
    - {name: rad, label: 'Radians', tolerance: 0.0005, format: num4}
  solution: |-
    Multiply by $\dfrac{\pi}{180}$: ${deg} \cdot \dfrac{\pi}{180} = {k:texfrac}\,\pi \approx$ **{rad:num4}**.

- id: pc-exact-trig
  title: Exact values on the unit circle
  topic: Unit circle
  vars:
    t: {choices: [{label: '\frac{\pi}{6}', value: 30}, {label: '\frac{\pi}{4}', value: 45}, {label: '\frac{\pi}{3}', value: 60}, {label: '\frac{2\pi}{3}', value: 120}, {label: '\frac{3\pi}{4}', value: 135}, {label: '\frac{5\pi}{6}', value: 150}, {label: '\frac{7\pi}{6}', value: 210}, {label: '\frac{5\pi}{4}', value: 225}, {label: '\frac{4\pi}{3}', value: 240}, {label: '\frac{5\pi}{3}', value: 300}, {label: '\frac{7\pi}{4}', value: 315}, {label: '\frac{11\pi}{6}', value: 330}, {label: '-\frac{\pi}{3}', value: -60}, {label: '-\frac{3\pi}{4}', value: -135}]}
    fn: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}, {label: '\tan', value: 2}]}
  calc:
    td: t
    v: if(fn == 0, sind(t), if(fn == 1, cosd(t), tand(t)))
    ra: if(mod(t, 180) <= 90, mod(t, 180), 180 - mod(t, 180))
  prompt: 'Find the exact value of ${fn}\left({t}\right)$. Type it like sqrt(3)/2 or -1/2.'
  answers:
    - {name: v, label: 'Value', tolerance: 0.0005, format: num4}
  solution: |-
    ${t}$ is ${td}^\circ$. Its reference angle is ${ra}^\circ$; take the special-angle value and attach the sign for the quadrant: ${fn}\left({t}\right) \approx$ **{v:num4}**.

- id: pc-ref-angle
  title: Reference angles
  topic: Unit circle
  vars:
    t: {min: -350, max: 710, step: 5}
  where: ["mod(t, 90) != 0"]
  calc:
    m: mod(t, 360)
    m2: mod(t, 180)
    ra: if(m2 <= 90, m2, 180 - m2)
  prompt: 'What is the reference angle of ${t}^\circ$ (in degrees)?'
  answers:
    - {name: ra, label: 'Reference angle', units: {'°': 1, deg: 1}}
  solution: |-
    ${t}^\circ$ ends in the same place as ${m}^\circ$. The acute angle between that side and the $x$-axis is **{ra}°**.

- id: pc-sinusoid
  title: Features of a sinusoid
  topic: Trig graphs
  vars:
    A: {choices: [-3, -2, 2, 3, 4]}
    B: {choices: [1, 2, 3, 4]}
    C: {min: -2, max: 2}
    D: {min: -3, max: 3}
  where: ["C != 0", "D != 0"]
  calc:
    amp: abs(A)
    per: 2*pi/B
    pc: -B*C
  funcs:
    y(x): A*sin(B*x + pc) + D
  prompt: 'For $y = {A:coef}\sin({B:coef}x {pc:signed}) {D:signed}$, find the amplitude, the period (exact, like pi/2, or decimal), the phase shift (positive = right) and the midline $y = D$.'
  figure:
    type: plot
    x: [-4, 8]
    y: ['D - amp - 1', 'D + amp + 1']
    functions: ['y', {f: 'D', dashed: true}]
  answers:
    - {name: amp, label: 'Amplitude'}
    - {name: per, label: 'Period', tolerance: 0.001, format: num4}
    - {name: C, label: 'Phase shift'}
    - {name: D, label: 'Midline $y =$'}
  solution: |-
    Factor the inside: ${B:coef}x {pc:signed} = {B}(x - ({C}))$. Amplitude $|{A}| =$ **{amp}**; period $\dfrac{2\pi}{ {B} } \approx$ **{per:num4}**; phase shift **{C}**; midline $y =$ **{D}**.

- id: pc-identity-value
  title: Find trig values from one value and the quadrant
  topic: Trig identities
  vars:
    tr: {choices: [1, 2, 3, 4]}
    Q: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}, {label: 'III', value: 3}, {label: 'IV', value: 4}]}
  calc:
    a: if(tr == 1, 3, if(tr == 2, 5, if(tr == 3, 8, 7)))
    b: if(tr == 1, 4, if(tr == 2, 12, if(tr == 3, 15, 24)))
    c: if(tr == 1, 5, if(tr == 2, 13, if(tr == 3, 17, 25)))
    sx: if(Q == 1 or Q == 4, 1, -1)
    sy: if(Q <= 2, 1, -1)
    s: sy*a/c
    co: sx*b/c
    ta: (sy*a)/(sx*b)
    c2: c^2
    bb: b^2
  prompt: '$\sin\theta = {s:texfrac}$ and $\theta$ is in Quadrant {Q}. Find $\cos\theta$ and $\tan\theta$ as exact fractions.'
  answers:
    - {name: co, label: '$\cos\theta =$', kind: fraction, lowestTerms: true}
    - {name: ta, label: '$\tan\theta =$', kind: fraction, lowestTerms: true}
  solution: |-
    $\cos^2\theta = 1 - \sin^2\theta = \dfrac{ {bb} }{ {c2} }$, so $\cos\theta = \pm\dfrac{ {b} }{ {c} }$; the sign in Quadrant {Q} gives $\cos\theta =$ **${co:texfrac}$**. Then $\tan\theta = \dfrac{\sin\theta}{\cos\theta} =$ **${ta:texfrac}$**.

- id: pc-double-angle
  title: Double-angle values
  topic: Trig identities
  vars:
    tr: {choices: [1, 2, 3, 4]}
    Q: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}, {label: 'III', value: 3}, {label: 'IV', value: 4}]}
  calc:
    a: if(tr == 1, 3, if(tr == 2, 5, if(tr == 3, 8, 7)))
    b: if(tr == 1, 4, if(tr == 2, 12, if(tr == 3, 15, 24)))
    c: if(tr == 1, 5, if(tr == 2, 13, if(tr == 3, 17, 25)))
    sx: if(Q == 1 or Q == 4, 1, -1)
    sy: if(Q <= 2, 1, -1)
    co: sx*b/c
    s: sy*a/c
    s2: 2*s*co
    c2t: co^2 - s^2
  prompt: '$\cos\theta = {co:texfrac}$ and $\theta$ is in Quadrant {Q}. Find $\sin 2\theta$ and $\cos 2\theta$ as exact fractions.'
  answers:
    - {name: s2, label: '$\sin 2\theta =$', kind: fraction, lowestTerms: true}
    - {name: c2t, label: '$\cos 2\theta =$', kind: fraction, lowestTerms: true}
  solution: |-
    In Quadrant {Q}, $\sin\theta = {s:texfrac}$. Then $\sin 2\theta = 2\sin\theta\cos\theta =$ **${s2:texfrac}$** and $\cos 2\theta = \cos^2\theta - \sin^2\theta =$ **${c2t:texfrac}$**.
