# Round 2 glossary terms for pc-m4 honors lessons
- term: hyperbolic cosine
  aliases: [cosh]
  definition: 'The function $\cosh x = \dfrac{e^x + e^{-x}}{2}$, the even part of $e^x$. It is even, has minimum value 1 at $x = 0$, and has range $[1, \infty)$.'
  topic: Hyperbolic functions
- term: hyperbolic sine
  aliases: [sinh]
  definition: 'The function $\sinh x = \dfrac{e^x - e^{-x}}{2}$, the odd part of $e^x$. It is odd and increasing, with range all real numbers.'
  topic: Hyperbolic functions
- term: hyperbolic tangent
  aliases: [tanh]
  definition: 'The function $\tanh x = \dfrac{\sinh x}{\cosh x} = \dfrac{e^x - e^{-x}}{e^x + e^{-x}}$. It is odd and increasing, with horizontal asymptotes $y = 1$ and $y = -1$.'
  topic: Hyperbolic functions
- term: unit hyperbola
  definition: 'The hyperbola $x^2 - y^2 = 1$. Because $\cosh^2 t - \sinh^2 t = 1$, the point $(\cosh t, \sinh t)$ lies on its right branch.'
  topic: Hyperbolic functions
- term: arsinh
  aliases: [inverse hyperbolic sine]
  definition: 'The inverse of $\sinh$, written $\sinh^{-1}$ or arsinh: $\sinh^{-1} y = \ln\left(y + \sqrt{y^2 + 1}\right)$ for every real $y$.'
  topic: Hyperbolic functions
- term: catenary
  aliases: [catenaries]
  definition: 'The curve $y = a\cosh\dfrac{x}{a} + c$, the shape of a uniform flexible cable or chain hanging under its own weight.'
  topic: Hyperbolic functions
- term: logistic midpoint
  definition: 'In a logistic model $P = \dfrac{C}{1 + Ae^{-kt}}$, the time $t_m = \dfrac{\ln A}{k}$ when $P = \dfrac C2$ and growth is fastest; the curve is symmetric about the point $\left(t_m, \frac C2\right)$.'
  topic: Logistic models
- term: midpoint form
  definition: 'The logistic model written as $P = \dfrac{C}{1 + e^{-k(t - t_m)}}$, where $t_m$ is the logistic midpoint.'
  topic: Logistic models
- term: logit
  aliases: [log-odds]
  definition: 'For a logistic quantity $P$ with capacity $C$, the logit is $\ln\dfrac{P}{C - P}$. It equals $kt - \ln A$, a linear function of $t$, so it linearizes logistic data.'
  topic: Logistic models
- term: dominates
  aliases: [dominate, dominated]
  definition: 'A function $f$ dominates $g$ if $\dfrac{f(x)}{g(x)}$ grows without bound as $x \to \infty$. For $p > 0$ and $b > 1$, $x^p$ dominates $\ln x$ and $b^x$ dominates $x^p$.'
  topic: Comparing growth
- term: crossover point
  aliases: [crossover points, crossover]
  definition: 'An input where one function overtakes another: a solution of $f(x) = g(x)$ at which the larger of the two changes.'
  topic: Comparing growth
- term: bisection method
  aliases: [bisection]
  definition: 'A numerical method for solving $g(x) = 0$: start with an interval where a continuous $g$ changes sign, and repeatedly keep the half in which the sign change occurs. After $n$ steps the interval width is divided by $2^n$.'
  topic: Comparing growth
