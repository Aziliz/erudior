# Module pc-m6 (Systems and matrices), round 2 glossary: terms from the honors lessons
- term: linear transformation
  aliases: [linear transformations, linear map]
  definition: 'A rule $T(\mathbf{x}) = A\mathbf{x}$ that moves every point of the plane (or space) by multiplying by a matrix. It keeps the origin fixed, sends lines to lines (or to a point) and satisfies $T(\mathbf{u} + \mathbf{v}) = T(\mathbf{u}) + T(\mathbf{v})$ and $T(k\mathbf{u}) = kT(\mathbf{u})$.'
  topic: Linear transformations
- term: rotation matrix
  aliases: [rotation matrices]
  definition: 'The matrix $\begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{bmatrix}$, which rotates the plane by $\theta$ counterclockwise about the origin. Its determinant is 1.'
  topic: Linear transformations
- term: shear
  aliases: [shears, shear transformation]
  definition: 'A transformation that slides each point parallel to an axis by an amount proportional to its distance from that axis, such as $\begin{bmatrix} 1 & k \\ 0 & 1 \end{bmatrix}$, which sends $(x, y)$ to $(x + ky, y)$. It keeps areas the same (determinant 1).'
  topic: Linear transformations
- term: homogeneous coordinates
  definition: 'Writing the point $(x, y)$ as $(x, y, 1)$ so that a $3 \times 3$ matrix can shift points as well as rotate and stretch them; used in computer graphics.'
  topic: Linear transformations
- term: Markov chain
  aliases: [Markov chains, Markov process]
  definition: 'A process that is always in one of finitely many states and moves at each step according to fixed probabilities that depend only on the current state.'
  topic: Markov chains
- term: state
  aliases: [states]
  definition: 'In a Markov chain, one of the possible conditions the process can be in at a given step (for example, sunny or rainy).'
  topic: Markov chains
- term: transition probability
  aliases: [transition probabilities]
  definition: 'In a Markov chain, the probability of moving from one state to another (or staying put) in one step.'
  topic: Markov chains
- term: transition matrix
  aliases: [transition matrices, stochastic matrix]
  definition: 'The matrix $P$ of a Markov chain''s transition probabilities. In the column convention, entry $(i, j)$ is the probability of moving from state $j$ to state $i$, so each column adds to 1. (Some books use rows instead.)'
  topic: Markov chains
- term: state vector
  aliases: [state vectors, probability vector]
  definition: 'A vector listing the probability (or share) of each state of a Markov chain at one step; its entries are nonnegative and add to 1. The next one is $\mathbf{x}_{n+1} = P\mathbf{x}_n$.'
  topic: Markov chains
- term: steady-state vector
  aliases: [steady state, steady-state, stationary distribution]
  definition: 'A state vector $\mathbf{q}$ with $P\mathbf{q} = \mathbf{q}$: the chain leaves it unchanged. Found by solving $(P - I)\mathbf{q} = \mathbf{0}$ with entries adding to 1.'
  topic: Markov chains
- term: regular
  aliases: [regular transition matrix, regular Markov chain, regular chain]
  definition: 'A transition matrix is regular if some power of it has all entries positive. A regular chain has exactly one steady-state vector, and every starting state vector approaches it.'
  topic: Markov chains
- term: absorbing state
  aliases: [absorbing states]
  definition: 'A state of a Markov chain that can be entered but never left: the probability of staying in it is 1.'
  topic: Markov chains
- term: eigenvector
  aliases: [eigenvectors]
  definition: 'A nonzero vector $\mathbf{v}$ that a square matrix $A$ only stretches, shrinks or flips: $A\mathbf{v} = \lambda\mathbf{v}$ for some number $\lambda$.'
  topic: Eigenvalues and eigenvectors
- term: eigenvalue
  aliases: [eigenvalues]
  definition: 'A number $\lambda$ with $A\mathbf{v} = \lambda\mathbf{v}$ for some nonzero vector $\mathbf{v}$; the eigenvalues are the solutions of $\det(A - \lambda I) = 0$.'
  topic: Eigenvalues and eigenvectors
- term: characteristic equation of the matrix
  aliases: [characteristic equation of a matrix, characteristic polynomial]
  definition: 'The equation $\det(A - \lambda I) = 0$, whose solutions are the eigenvalues of $A$. For a $2 \times 2$ matrix it is $\lambda^2 - (\text{trace})\lambda + \det A = 0$.'
  topic: Eigenvalues and eigenvectors
- term: trace
  definition: 'The sum of the main-diagonal entries of a square matrix; for $\begin{bmatrix} a & b \\ c & d \end{bmatrix}$ it is $a + d$. It equals the sum of the eigenvalues.'
  topic: Eigenvalues and eigenvectors
