- id: stat-phat-dist
  title: Mean and SD of the sample proportion
  topic: Sampling distributions
  vars:
    pp: {min: 0.05, max: 0.95, step: 0.01}
    nn: {min: 50, max: 2000, step: 50}
  calc:
    sd: sqrt(pp*(1 - pp)/nn)
    qq: 1 - pp
  prompt: |-
    In a large population, a proportion $p = {pp}$ of households have solar panels. For
    SRSs of size $n = {nn:dp0}$, find the mean and standard deviation of the sampling
    distribution of $\hat{p}$ (SD to 4 decimals).
  answers:
    - {name: pp, label: '$\mu_{\hat{p}} =$', tolerance: 0.0001}
    - {name: sd, label: '$\sigma_{\hat{p}} =$', tolerance: 0.0002, format: num4}
  solution: |-
    $\hat{p}$ is unbiased: $\mu_{\hat{p}} = p =$ **{pp}**.
    $\sigma_{\hat{p}} = \sqrt{\dfrac{p(1-p)}{n}} = \sqrt{\dfrac{{pp}({qq})}{{nn:dp0}}} =$ **{sd:num4}**.

- id: stat-phat-prob
  title: Probability for a sample proportion
  topic: Sampling distributions
  vars:
    pp: {min: 0.15, max: 0.85, step: 0.01}
    nn: {min: 100, max: 1500, step: 50}
    dd: {min: 0.01, max: 0.06, step: 0.01}
    side: {choices: [{label: 'at least', value: 1}, {label: 'at most', value: 0}]}
  where: ['nn*pp >= 10', 'nn*(1 - pp) >= 10', 'dd/sd >= 0.3', 'dd/sd <= 3']
  calc:
    sd: sqrt(pp*(1 - pp)/nn)
    cut: pp + if(side == 1, dd, -dd)
    zz: (cut - pp)/sd
    pr: if(side == 1, 1 - normcdf(zz), normcdf(zz))
  prompt: |-
    Suppose {pp} of all customers prefer paperless billing. In an SRS of {nn} customers, what
    is the approximate probability that the sample proportion is **{side} {cut}**? Give 4
    decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.002, format: num4}
  solution: |-
    $\sigma_{\hat{p}} = \sqrt{{pp}(1 - {pp})/{nn:dp0}} \approx {sd:num4}$. Large counts hold, so $\hat{p}$ is
    approximately normal. $z = \dfrac{{cut} - {pp}}{{sd:num4}} \approx {zz:num2}$; the area
    {side} that point (right tail for "at least", left tail for "at most") is **{pr:num4}**.

- id: stat-xbar-prob
  title: Probability for a sample mean (CLT)
  topic: Central Limit Theorem
  vars:
    mu: {min: 20, max: 200, step: 5}
    sig: {min: 4, max: 40}
    nn: {choices: [30, 36, 40, 49, 50, 64, 81, 100]}
    kk: {min: -2.5, max: 2.5, step: 0.1}
    side: {choices: [{label: 'greater than', value: 1}, {label: 'less than', value: 0}]}
  where: ['abs(kk) >= 0.3']
  calc:
    se: sig/sqrt(nn)
    cut: round(mu + kk*se, 1)
    zz: (cut - mu)/se
    pr: if(side == 1, 1 - normcdf(zz), normcdf(zz))
    rt: sqrt(nn)
  prompt: |-
    Repair times have mean {mu} minutes and standard deviation {sig} minutes (the distribution is
    skewed). For a random sample of {nn} repairs, find the probability that the sample mean is
    {side} {cut} minutes. Give 4 decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.002, format: num4}
  solution: |-
    By the CLT ($n = {nn}$), $\bar{x}$ is approximately normal with mean {mu} and
    $\sigma_{\bar{x}} = {sig}/\sqrt{{nn}} = {sig}/{rt} \approx {se:num4}$.
    $z = \dfrac{{cut} - {mu}}{{se:num4}} \approx {zz:num2}$, so the probability is **{pr:num4}**.

- id: stat-sum-prob
  title: Probability for a total (CLT)
  topic: Central Limit Theorem
  vars:
    mu: {min: 5, max: 25}
    sig: {min: 1, max: 6}
    nn: {choices: [30, 40, 50, 60, 80, 100]}
    kk: {min: 0.4, max: 2.6, step: 0.1}
  calc:
    tm: nn*mu
    ts: sqrt(nn)*sig
    cap: round(tm + kk*ts)
    zz: (cap - tm)/ts
    pr: 1 - normcdf(zz)
    xb: cap/nn
  prompt: |-
    Packages have mean weight {mu} kg and standard deviation {sig} kg. A van carries {nn}
    randomly selected packages and is rated for {cap} kg. What is the probability the total
    weight exceeds the rating? Give 4 decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.002, format: num4}
  solution: |-
    The total has mean ${nn} \times {mu} = {tm:dp0}$ and SD $\sqrt{{nn}} \times {sig} \approx {ts:num4}$, and
    is approximately normal by the CLT. $z = \dfrac{{cap:dp0} - {tm:dp0}}{{ts:num4}} \approx {zz:num2}$, so
    $P(\text{total} > {cap:dp0}) \approx$ **{pr:num4}**. (Equivalently, $\bar{x} > {xb:num4}$.)

- id: stat-ci-prop
  title: One-proportion z interval
  topic: Confidence intervals for proportions
  vars:
    nn: {min: 100, max: 1500, step: 10}
    ph: {min: 0.1, max: 0.9, step: 0.01}
    lev: {choices: [{label: '90%', value: 1.645}, {label: '95%', value: 1.96}, {label: '99%', value: 2.576}]}
  calc:
    xx: round(nn*ph)
    phat: xx/nn
    se: sqrt(phat*(1 - phat)/nn)
    me: lev*se
    lo: phat - me
    hi: phat + me
  where: ['xx >= 10', 'nn - xx >= 10']
  prompt: |-
    In a random sample of {nn} rail passengers, {xx} said they would pay for onboard Wi-Fi.
    Construct a {lev} confidence interval for the population proportion. Give the endpoints
    to 4 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.001, format: num4}
    - {name: hi, label: 'Upper', tolerance: 0.001, format: num4}
  solution: |-
    $\hat{p} = {xx:dp0}/{nn:dp0} = {phat:num4}$. $SE = \sqrt{\hat{p}(1-\hat{p})/n} \approx {se:num4}$. With
    $z^* = {lev:num4}$, $ME \approx {me:num4}$. Interval: ${phat:num4} \pm {me:num4}$, from
    **{lo:num4}** to **{hi:num4}**.

- id: stat-moe-prop
  title: Margin of error for a proportion
  topic: Confidence intervals for proportions
  vars:
    nn: {min: 200, max: 3000, step: 50}
    ph: {min: 0.1, max: 0.9, step: 0.01}
    lev: {choices: [{label: '90%', value: 1.645}, {label: '95%', value: 1.96}, {label: '99%', value: 2.576}]}
  calc:
    se: sqrt(ph*(1 - ph)/nn)
    me: lev*se
    mepct: 100*me
  prompt: |-
    A poll of {nn} randomly selected adults finds $\hat{p} = {ph}$. What is the margin of error
    for a {lev} confidence interval, in percentage points (2 decimals)?
  answers:
    - {name: mepct, label: 'ME (points)', tolerance: 0.02, format: num2}
  solution: |-
    $ME = z^*\sqrt{\hat{p}(1-\hat{p})/n} = {lev:num4}\sqrt{{ph}(1 - {ph})/{nn:dp0}} \approx {me:num4}$, or
    **{mepct:num2}** percentage points.

- id: stat-sample-size-prop
  title: Sample size for a proportion
  topic: Confidence intervals for proportions
  vars:
    mm: {choices: [0.01, 0.015, 0.02, 0.025, 0.03, 0.04, 0.05]}
    lev: {choices: [{label: '90% (use 1.645)', value: 1.645}, {label: '95% (use 1.96)', value: 1.96}, {label: '99% (use 2.576)', value: 2.576}]}
    guess: {choices: [{label: 'no prior estimate (use 0.5)', value: 0.5}, {label: 'a prior estimate of 0.2', value: 0.2}, {label: 'a prior estimate of 0.1', value: 0.1}, {label: 'a prior estimate of 0.35', value: 0.35}]}
  calc:
    raw: (lev/mm)^2*guess*(1 - guess)
    nn: ceil(raw - 1e-9)
  prompt: |-
    How large a sample is needed to estimate a proportion with a margin of error of at most
    {mm} at confidence level {lev}, with {guess}?
  answers:
    - {name: nn, label: '$n =$', tolerance: 0.001}
  solution: |-
    $n \ge \left(\dfrac{z^*}{M}\right)^2 p^*(1 - p^*) = \left(\dfrac{{lev:num4}}{{mm}}\right)^2({guess:num4})(1 - {guess:num4}) \approx {raw:dp2}$.
    Round **up**: $n =$ **{nn}**.

- id: stat-tstar
  title: Critical value t*
  topic: Confidence intervals for means
  vars:
    dfree: {choices: [4, 5, 7, 9, 11, 14, 19, 24, 29, 39, 49]}
    cl: {choices: [{label: '90%', value: 0.90}, {label: '95%', value: 0.95}, {label: '98%', value: 0.98}, {label: '99%', value: 0.99}]}
  calc:
    area: (1 + cl)/2
    ts: invt(area, dfree)
    nn: dfree + 1
  prompt: |-
    Find the critical value $t^*$ for a {cl} confidence interval for a mean based on a sample of
    $n = {nn}$ observations (3 decimals).
  answers:
    - {name: ts, label: '$t^* =$', tolerance: 0.002, format: dp3}
  solution: |-
    df $= n - 1 = {dfree}$. The middle {cl} leaves {area:num4} to the left of $t^*$, so
    $t^* = \text{invT}({area:num4}, {dfree}) \approx$ **{ts:dp3}**.

- id: stat-ci-mean-t
  title: One-sample t interval
  topic: Confidence intervals for means
  vars:
    xbar: {min: 20, max: 120, step: 0.1}
    sx: {min: 2, max: 20, step: 0.1}
    nn: {min: 8, max: 40}
    cl: {choices: [{label: '90%', value: 0.90}, {label: '95%', value: 0.95}, {label: '99%', value: 0.99}]}
  calc:
    dfree: nn - 1
    ts: invt((1 + cl)/2, dfree)
    se: sx/sqrt(nn)
    me: ts*se
    lo: xbar - me
    hi: xbar + me
  prompt: |-
    A random sample of {nn} measurements (no outliers or strong skew) has $\bar{x} = {xbar}$ and
    $s = {sx}$. Construct a {cl} confidence interval for $\mu$. Give the endpoints to 2 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.011, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.011, format: num2}
  solution: |-
    df $= {dfree}$, $t^* \approx {ts:dp3}$. $SE = {sx}/\sqrt{{nn}} \approx {se:num4}$;
    $ME = {ts:dp3} \times {se:num4} \approx {me:num4}$. Interval: ${xbar} \pm {me:num4}$, from
    **{lo:num2}** to **{hi:num2}**.

- id: stat-sample-size-mean
  title: Sample size for a mean
  topic: Confidence intervals for means
  vars:
    sig: {min: 2, max: 40}
    mm: {choices: [0.5, 1, 1.5, 2, 2.5, 3, 4, 5]}
    lev: {choices: [{label: '90% (use 1.645)', value: 1.645}, {label: '95% (use 1.96)', value: 1.96}, {label: '99% (use 2.576)', value: 2.576}]}
  calc:
    raw: (lev*sig/mm)^2
    nn: ceil(raw - 1e-9)
  where: ['raw >= 5', 'raw <= 20000']
  prompt: |-
    A pilot study suggests $\sigma \approx {sig}$. How many observations are needed to estimate
    the mean within {mm} units at confidence level {lev}?
  answers:
    - {name: nn, label: '$n =$', tolerance: 0.001}
  solution: |-
    $n \ge \left(\dfrac{z^*\sigma}{M}\right)^2 = \left(\dfrac{{lev:num4}({sig})}{{mm}}\right)^2 \approx {raw:dp2}$.
    Round up: $n =$ **{nn}**.

- id: stat-ci-two-prop
  title: Two-proportion z interval
  topic: Two-sample intervals
  vars:
    n1: {min: 100, max: 600, step: 10}
    n2: {min: 100, max: 600, step: 10}
    q1: {min: 0.15, max: 0.85, step: 0.01}
    q2: {min: 0.15, max: 0.85, step: 0.01}
    lev: {choices: [{label: '90%', value: 1.645}, {label: '95%', value: 1.96}, {label: '99%', value: 2.576}]}
  calc:
    x1: round(n1*q1)
    x2: round(n2*q2)
    p1: x1/n1
    p2: x2/n2
    diff: p1 - p2
    se: sqrt(p1*(1 - p1)/n1 + p2*(1 - p2)/n2)
    me: lev*se
    lo: diff - me
    hi: diff + me
  where: ['x1 != x2']
  prompt: |-
    In a randomized experiment, {x1} of {n1} patients improved on treatment 1 and {x2} of {n2}
    improved on treatment 2. Construct a {lev} confidence interval for $p_1 - p_2$ (endpoints
    to 4 decimals).
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.001, format: num4}
    - {name: hi, label: 'Upper', tolerance: 0.001, format: num4}
  solution: |-
    $\hat{p}_1 = {p1:num4}$, $\hat{p}_2 = {p2:num4}$, difference ${diff:num4}$.
    $SE = \sqrt{\hat{p}_1(1-\hat{p}_1)/n_1 + \hat{p}_2(1-\hat{p}_2)/n_2} \approx {se:num4}$;
    $ME = {lev:num4}({se:num4}) \approx {me:num4}$. Interval: **{lo:num4}** to **{hi:num4}**.

- id: stat-ci-two-mean
  title: Two-sample t interval (conservative df)
  topic: Two-sample intervals
  vars:
    n1: {min: 10, max: 40}
    n2: {min: 10, max: 40}
    m1: {min: 40, max: 90, step: 0.1}
    m2: {min: 40, max: 90, step: 0.1}
    s1: {min: 3, max: 15, step: 0.1}
    s2: {min: 3, max: 15, step: 0.1}
  calc:
    dfree: min(n1, n2) - 1
    ts: invt(0.975, dfree)
    se: sqrt(s1^2/n1 + s2^2/n2)
    diff: m1 - m2
    lo: diff - ts*se
    hi: diff + ts*se
  where: ['m1 - m2 >= 1', 'm1 - m2 <= 20']
  prompt: |-
    Independent random samples: group 1 has $n_1 = {n1}$, $\bar{x}_1 = {m1}$, $s_1 = {s1}$; group 2 has
    $n_2 = {n2}$, $\bar{x}_2 = {m2}$, $s_2 = {s2}$. Construct a 95% confidence interval for
    $\mu_1 - \mu_2$ using the conservative df $= \min(n_1, n_2) - 1$. Endpoints to 2 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.011, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.011, format: num2}
  solution: |-
    Difference ${m1} - {m2} = {diff:num2}$. $SE = \sqrt{{s1}^2/{n1} + {s2}^2/{n2}} \approx {se:num4}$.
    df $= {dfree}$, $t^* \approx {ts:dp3}$. Interval: ${diff:num2} \pm {ts:dp3}({se:num4})$, from
    **{lo:num2}** to **{hi:num2}**.

- id: stat-ci-paired
  title: Paired t interval
  topic: Two-sample intervals
  vars:
    b1: {min: 50, max: 90}
    b2: {min: 50, max: 90}
    b3: {min: 50, max: 90}
    b4: {min: 50, max: 90}
    b5: {min: 50, max: 90}
    b6: {min: 50, max: 90}
    e1: {min: -4, max: 9}
    e2: {min: -4, max: 9}
    e3: {min: -4, max: 9}
    e4: {min: -4, max: 9}
    e5: {min: -4, max: 9}
    e6: {min: -4, max: 9}
  calc:
    a1: b1 + e1
    a2: b2 + e2
    a3: b3 + e3
    a4: b4 + e4
    a5: b5 + e5
    a6: b6 + e6
    dbar: mean(e1, e2, e3, e4, e5, e6)
    sd: stdev(e1, e2, e3, e4, e5, e6)
    ts: invt(0.95, 5)
    me: ts*sd/sqrt(6)
    lo: dbar - me
    hi: dbar + me
  where: ['sd > 0']
  prompt: |-
    Six workers' scores before and after a training course:

    | Worker | 1 | 2 | 3 | 4 | 5 | 6 |
    |---|---|---|---|---|---|---|
    | Before | {b1} | {b2} | {b3} | {b4} | {b5} | {b6} |
    | After | {a1} | {a2} | {a3} | {a4} | {a5} | {a6} |

    Construct a 90% confidence interval for the mean improvement (after − before). Endpoints to
    2 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.011, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.011, format: num2}
  solution: |-
    Differences (after − before): {e1}, {e2}, {e3}, {e4}, {e5}, {e6}. $\bar{d} = {dbar:num4}$,
    $s_d \approx {sd:num4}$, df $= 5$, $t^* \approx {ts:dp3}$.
    $ME = {ts:dp3}({sd:num4})/\sqrt{6} \approx {me:num4}$. Interval: **{lo:num2}** to **{hi:num2}**.
