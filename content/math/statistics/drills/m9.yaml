- id: stat-chi-gof
  title: Chi-square goodness-of-fit statistic
  topic: Chi-square goodness of fit
  vars:
    set: {choices: [1, 2, 3]}
    nn: {choices: [100, 200, 300, 400]}
    u1: {min: -15, max: 15}
    u2: {min: -15, max: 15}
    u3: {min: -12, max: 12}
  calc:
    q1: if(set == 1, 0.4, if(set == 2, 0.25, 0.5))
    q2: if(set == 1, 0.3, if(set == 2, 0.25, 0.25))
    q3: if(set == 1, 0.2, if(set == 2, 0.25, 0.15))
    q4: 1 - q1 - q2 - q3
    e1: nn*q1
    e2: nn*q2
    e3: nn*q3
    e4: nn*q4
    o1: e1 + u1
    o2: e2 + u2
    o3: e3 + u3
    o4: nn - o1 - o2 - o3
    c1: (o1 - e1)^2/e1
    c2: (o2 - e2)^2/e2
    c3: (o3 - e3)^2/e3
    c4: (o4 - e4)^2/e4
    chi: c1 + c2 + c3 + c4
    pv: 1 - chi2cdf(chi, 3)
  where: ['o4 >= 1', 'chi > 0.5']
  prompt: |-
    A model claims four categories occur in proportions {q1}, {q2}, {q3} and {q4:num2}. A random
    sample of {nn} gives counts {o1}, {o2}, {o3} and {o4}. Find the chi-square statistic
    (3 decimals) and the p-value (4 decimals).
  answers:
    - {name: chi, label: '$\chi^2 =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Expected counts: {e1}, {e2}, {e3}, {e4:num2}. Contributions $(O - E)^2/E$: {c1:num4}, {c2:num4},
    {c3:num4}, {c4:num4}. $\chi^2 =$ **{chi:dp3}**, df $= 4 - 1 = 3$, p-value
    $= P(\chi^2_3 \ge {chi:dp3}) \approx$ **{pv:num4}**.

- id: stat-chi-expected
  title: Expected count in a two-way table
  topic: Chi-square two-way tables
  vars:
    aa: {min: 10, max: 80}
    ab: {min: 10, max: 80}
    ba: {min: 10, max: 80}
    bb: {min: 10, max: 80}
    ca: {min: 10, max: 80}
    cb: {min: 10, max: 80}
    cell: {choices: [{label: 'Region 1, Yes', value: 1}, {label: 'Region 2, No', value: 2}, {label: 'Region 3, Yes', value: 3}]}
  calc:
    r1: aa + ab
    r2: ba + bb
    r3: ca + cb
    cy: aa + ba + ca
    cn: ab + bb + cb
    tot: r1 + r2 + r3
    rt: if(cell == 1, r1, if(cell == 2, r2, r3))
    ct: if(cell == 2, cn, cy)
    ex: rt*ct/tot
  prompt: |-
    A survey asks residents of three regions whether they support a new rail line.

    | | Yes | No | Total |
    |---|---|---|---|
    | Region 1 | {aa} | {ab} | {r1} |
    | Region 2 | {ba} | {bb} | {r2} |
    | Region 3 | {ca} | {cb} | {r3} |
    | Total | {cy} | {cn} | {tot} |

    For a chi-square test of independence, find the expected count for the cell **{cell}**
    (2 decimals).
  answers:
    - {name: ex, label: 'Expected', tolerance: 0.006, format: num2}
  solution: |-
    Expected $= \dfrac{\text{row total} \times \text{column total}}{\text{grand total}} = \dfrac{{rt} \times {ct}}{{tot}} =$ **{ex:num2}**.

- id: stat-chi-indep
  title: Chi-square test for a 2×2 table
  topic: Chi-square two-way tables
  vars:
    aa: {min: 10, max: 90}
    ab: {min: 10, max: 90}
    ba: {min: 10, max: 90}
    bb: {min: 10, max: 90}
  calc:
    r1: aa + ab
    r2: ba + bb
    k1: aa + ba
    k2: ab + bb
    tot: r1 + r2
    eaa: r1*k1/tot
    eab: r1*k2/tot
    eba: r2*k1/tot
    ebb: r2*k2/tot
    chi: (aa - eaa)^2/eaa + (ab - eab)^2/eab + (ba - eba)^2/eba + (bb - ebb)^2/ebb
    pv: 1 - chi2cdf(chi, 1)
  where: ['chi > 0.2', 'chi < 20']
  prompt: |-
    A random sample of commuters is classified by shift and by whether they take the train:

    | | Train | No train |
    |---|---|---|
    | Day shift | {aa} | {ab} |
    | Night shift | {ba} | {bb} |

    Test for independence: find $\chi^2$ (3 decimals) and the p-value (4 decimals).
  answers:
    - {name: chi, label: '$\chi^2 =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Totals: rows {r1}, {r2}; columns {k1}, {k2}; grand {tot}. Expected counts:
    {eaa:num2}, {eab:num2}, {eba:num2}, {ebb:num2}. $\chi^2 = \sum (O - E)^2/E =$ **{chi:dp3}**,
    df $= (2-1)(2-1) = 1$, p-value $\approx$ **{pv:num4}**.

- id: stat-reg-slope-t
  title: t test for the regression slope
  topic: Regression inference
  vars:
    bb: {min: 0.2, max: 6, step: 0.01}
    rat: {min: 0.6, max: 4.5, step: 0.05}
    nn: {min: 8, max: 40}
  calc:
    se: round(bb/rat, 3)
    tt: bb/se
    dfree: nn - 2
    pv: 2*(1 - tcdf(tt, dfree))
  prompt: |-
    A regression on $n = {nn}$ points gives slope $b = {bb}$ with $SE_b = {se}$. Test
    $H_0: \beta_1 = 0$ vs. $H_a: \beta_1 \ne 0$. Find $t$ (3 decimals) and the p-value (4 decimals).
  answers:
    - {name: tt, label: '$t =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    $t = b/SE_b = {bb}/{se} \approx$ **{tt:dp3}**, with df $= n - 2 = {dfree}$. Two-sided p-value
    $= 2P(t_{{dfree}} \ge {tt:dp3}) \approx$ **{pv:num4}**.

- id: stat-reg-slope-ci
  title: Confidence interval for the slope
  topic: Regression inference
  vars:
    bb: {min: -4, max: 4, step: 0.01}
    sres: {min: 0.5, max: 8, step: 0.1}
    sx: {min: 1, max: 12, step: 0.1}
    nn: {min: 10, max: 40}
  where: ['abs(bb) >= 0.2']
  calc:
    se: sres/(sx*sqrt(nn - 1))
    dfree: nn - 2
    ts: invt(0.975, dfree)
    lo: bb - ts*se
    hi: bb + ts*se
    nm1: nn - 1
  prompt: |-
    A regression on $n = {nn}$ points has slope $b = {bb}$, residual standard deviation $s = {sres}$
    and $s_x = {sx}$. Find $SE_b$ (4 decimals) and a 95% confidence interval for $\beta_1$
    (endpoints to 3 decimals).
  answers:
    - {name: se, label: '$SE_b =$', tolerance: 0.0006, format: num4}
    - {name: lo, label: 'Lower', tolerance: 0.004, format: dp3}
    - {name: hi, label: 'Upper', tolerance: 0.004, format: dp3}
  solution: |-
    $SE_b = \dfrac{s}{s_x\sqrt{n-1}} = \dfrac{{sres}}{{sx}\sqrt{{nm1}}} \approx$ **{se:num4}**. df $= {dfree}$,
    $t^* \approx {ts:dp3}$. Interval: ${bb} \pm {ts:dp3}({se:num4})$, from **{lo:dp3}** to **{hi:dp3}**.

- id: stat-anova-f
  title: One-way ANOVA F statistic
  topic: ANOVA and nonparametric tests
  vars:
    ng: {min: 4, max: 12}
    m1: {min: 15, max: 25, step: 0.5}
    m2: {min: 15, max: 25, step: 0.5}
    m3: {min: 15, max: 25, step: 0.5}
    s1: {min: 1, max: 6, step: 0.5}
    s2: {min: 1, max: 6, step: 0.5}
    s3: {min: 1, max: 6, step: 0.5}
  calc:
    gm: (m1 + m2 + m3)/3
    ssg: ng*((m1 - gm)^2 + (m2 - gm)^2 + (m3 - gm)^2)
    sse: (ng - 1)*(s1^2 + s2^2 + s3^2)
    bign: 3*ng
    dfe: bign - 3
    msg: ssg/2
    mse: sse/dfe
    ff: msg/mse
    pv: 1 - fcdf(ff, 2, dfe)
  where: ['ff > 0.3', 'ff < 9', 'max(s1, s2, s3) <= 2*min(s1, s2, s3)']
  prompt: |-
    Three groups of {ng} observations each have means {m1}, {m2}, {m3} and standard deviations
    {s1}, {s2}, {s3}. Find the ANOVA $F$ statistic (3 decimals) and its p-value (4 decimals).
  answers:
    - {name: ff, label: '$F =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Grand mean $= {gm:num4}$. SSG $= {ng}\sum(\bar{x}_i - \bar{x})^2 = {ssg:dp3}$; SSE $= ({ng} - 1)\sum s_i^2 = {sse:dp3}$.
    MSG $= {ssg:dp3}/2 = {msg:dp3}$; MSE $= {sse:dp3}/{dfe} = {mse:dp3}$.
    $F =$ **{ff:dp3}** with df 2 and {dfe}; p-value $\approx$ **{pv:num4}**.

- id: stat-sign-test
  title: Sign test p-value
  topic: ANOVA and nonparametric tests
  vars:
    nn: {min: 8, max: 20}
    kk: {min: 5, max: 20}
  where: ['kk <= nn', 'kk > nn/2']
  calc:
    pv: 1 - binomcdf(nn, 0.5, kk - 1)
    km1: kk - 1
  prompt: |-
    In a paired study with {nn} nonzero differences, {kk} are positive. Use the sign test for
    $H_a$: the median difference is positive. Find the p-value (4 decimals).
  answers:
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Under $H_0$ the number of positive signs is $B({nn}, 0.5)$. p-value $= P(X \ge {kk}) = 1 - P(X \le {km1}) \approx$
    **{pv:num4}**.

- id: stat-rank-sum
  title: Wilcoxon rank-sum statistic
  topic: ANOVA and nonparametric tests
  vars:
    a1: {min: 10, max: 60}
    a2: {min: 10, max: 60}
    a3: {min: 10, max: 60}
    a4: {min: 10, max: 60}
    b1: {min: 10, max: 60}
    b2: {min: 10, max: 60}
    b3: {min: 10, max: 60}
    b4: {min: 10, max: 60}
  calc:
    ra1: 1 + (a1 > a2) + (a1 > a3) + (a1 > a4) + (a1 > b1) + (a1 > b2) + (a1 > b3) + (a1 > b4)
    ra2: 1 + (a2 > a1) + (a2 > a3) + (a2 > a4) + (a2 > b1) + (a2 > b2) + (a2 > b3) + (a2 > b4)
    ra3: 1 + (a3 > a1) + (a3 > a2) + (a3 > a4) + (a3 > b1) + (a3 > b2) + (a3 > b3) + (a3 > b4)
    ra4: 1 + (a4 > a1) + (a4 > a2) + (a4 > a3) + (a4 > b1) + (a4 > b2) + (a4 > b3) + (a4 > b4)
    ww: ra1 + ra2 + ra3 + ra4
    nd: (a1 != a2) + (a1 != a3) + (a1 != a4) + (a1 != b1) + (a1 != b2) + (a1 != b3) + (a1 != b4) + (a2 != a3) + (a2 != a4) + (a2 != b1) + (a2 != b2) + (a2 != b3) + (a2 != b4) + (a3 != a4) + (a3 != b1) + (a3 != b2) + (a3 != b3) + (a3 != b4) + (a4 != b1) + (a4 != b2) + (a4 != b3) + (a4 != b4) + (b1 != b2) + (b1 != b3) + (b1 != b4) + (b2 != b3) + (b2 != b4) + (b3 != b4)
  where: ['nd == 28']
  prompt: |-
    Group A: {a1}, {a2}, {a3}, {a4}. Group B: {b1}, {b2}, {b3}, {b4}. Rank all eight values together
    (1 = smallest). What is the rank sum $W$ for group A? (Under $H_0$ its expected value is 18.)
  answers:
    - {name: ww, label: '$W =$', tolerance: 0.001}
  solution: |-
    The ranks of group A's values are {ra1}, {ra2}, {ra3} and {ra4}, so $W =$ **{ww}**.
