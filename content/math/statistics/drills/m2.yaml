- id: stat-zscore
  title: Compute a z-score
  topic: Percentiles and z-scores
  vars:
    mu: {min: 40, max: 120}
    sd: {min: 3, max: 15}
    xv: {min: 20, max: 160}
  calc:
    zz: (xv - mu) / sd
  where: ['abs(zz) <= 3.2', 'xv != mu']
  prompt: |-
    A distribution has mean {mu} and standard deviation {sd}. Find the z-score of the
    value {xv} (2 decimal places).
  answers:
    - {name: zz, label: '$z =$', tolerance: 0.006, format: num2}
  solution: |-
    $z = \dfrac{x - \mu}{\sigma} = \dfrac{{xv} - {mu}}{{sd}} =$ **{zz:num2}**. The value is
    {zz:num2} standard deviations from the mean (negative means below).

- id: stat-z-to-x
  title: Value from a z-score
  topic: Percentiles and z-scores
  vars:
    mu: {min: 50, max: 600, step: 10}
    sd: {min: 4, max: 80, step: 2}
    zz: {min: -2.8, max: 2.8, step: 0.05}
  where: ['zz != 0']
  calc:
    xv: mu + zz*sd
  prompt: |-
    Scores have mean {mu} and standard deviation {sd}. What score has a z-score of
    {zz}?
  answers:
    - {name: xv, label: '$x =$', tolerance: 0.01}
  solution: |-
    $x = \mu + z\sigma = {mu} + ({zz})({sd}) =$ **{xv}**.

- id: stat-lin-transform
  title: Mean and SD after y = a + bx
  topic: Transforming data
  vars:
    mx: {min: 10, max: 80}
    sx: {min: 2, max: 15}
    aa: {min: -20, max: 40}
    bb: {choices: [0.5, 1.5, 2, 3, -1, -2, 0.25, 4]}
  calc:
    my: aa + bb*mx
    sy: abs(bb)*sx
  prompt: |-
    A data set has mean {mx} and standard deviation {sx}. Every value is transformed by
    $y = {aa} {bb:signed}x$. Find the mean and standard deviation of $y$.
  answers:
    - {name: my, label: 'Mean of $y$', tolerance: 0.01}
    - {name: sy, label: 'SD of $y$', tolerance: 0.01}
  solution: |-
    Mean: $\bar{y} = a + b\bar{x} = {aa} + ({bb})({mx}) =$ **{my}**. SD: adding $a$ doesn't
    change spread, and multiplying by $b$ multiplies the SD by $|b|$:
    $s_y = |{bb}| \times {sx} =$ **{sy}**.

- id: stat-unit-convert
  title: Convert summaries from Celsius to Fahrenheit
  topic: Transforming data
  vars:
    mc: {min: -5, max: 35}
    sc: {min: 1, max: 9, step: 0.5}
    iq: {min: 2, max: 12}
  calc:
    mf: 32 + 1.8*mc
    sf: 1.8*sc
    iqf: 1.8*iq
  prompt: |-
    Daily temperatures at a station have mean {mc} °C, standard deviation {sc} °C and
    IQR {iq} °C. Using $F = 32 + 1.8C$, find the mean, standard deviation and IQR in °F.
  answers:
    - {name: mf, label: 'Mean (°F)', tolerance: 0.01}
    - {name: sf, label: 'SD (°F)', tolerance: 0.01}
    - {name: iqf, label: 'IQR (°F)', tolerance: 0.01}
  solution: |-
    The mean transforms fully: $32 + 1.8({mc}) =$ **{mf}** °F. Spreads ignore the added 32:
    SD $= 1.8({sc}) =$ **{sf}** °F and IQR $= 1.8({iq}) =$ **{iqf}** °F.

- id: stat-empirical
  title: Empirical rule percentages
  topic: Normal distribution
  vars:
    mu: {min: 50, max: 200, step: 5}
    sd: {min: 2, max: 20}
    ka: {min: -3, max: 2}
    kb: {min: -2, max: 3}
  funcs:
    cum(k): if(k == -3, 0.15, if(k == -2, 2.5, if(k == -1, 16, if(k == 0, 50, if(k == 1, 84, if(k == 2, 97.5, 99.85))))))
  where: ['kb > ka']
  calc:
    xa: mu + ka*sd
    xb: mu + kb*sd
    pct: cum(kb) - cum(ka)
    cb: cum(kb)
    ca: cum(ka)
  prompt: |-
    A variable is approximately normal with mean {mu} and standard deviation {sd}. Use the
    68–95–99.7 rule to find the percent of values between {xa} and {xb}.
  answers:
    - {name: pct, label: 'Percent', tolerance: 0.01, format: num4}
  solution: |-
    {xa} is at $z = {ka}$ and {xb} is at $z = {kb}$. By the empirical rule
    the percent below each is {ca}% and {cb}%, so the percent between is
    ${cb} - {ca} =$ **{pct:num4}%**.

- id: stat-normal-below
  title: Normal probability (one tail)
  topic: Normal calculations
  vars:
    mu: {min: 40, max: 160}
    sd: {choices: [2, 4, 5, 10, 20, 25]}
    xv: {min: 10, max: 220}
    side: {choices: [{label: 'less than', value: 0}, {label: 'greater than', value: 1}]}
  calc:
    zz: (xv - mu) / sd
    left: normcdf(zz)
    prob: if(side == 0, left, 1 - left)
  where: ['abs(zz) <= 2.8', 'abs(zz) >= 0.3']
  prompt: |-
    $X$ is normal with mean {mu} and standard deviation {sd}. Find the probability that
    $X$ is {side} {xv}. Give 4 decimal places.
  figure:
    type: plot
    x: ['mu - 3.5*sd', 'mu + 3.5*sd']
    y: [-0.05, 0.45]
    grid: false
    functions: ['normpdf((x - mu)/sd)']
    shade:
      - {f: 'normpdf((x - mu)/sd)', from: 'if(side == 0, mu - 3.5*sd, xv)', to: 'if(side == 0, xv, mu + 3.5*sd)'}
    segments:
      - {from: ['mu - 3.5*sd', 0], to: ['mu + 3.5*sd', 0]}
    labels:
      - {at: [mu, -0.03], text: '{mu}'}
      - {at: [xv, -0.03], text: '{xv}'}
  answers:
    - {name: prob, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    Standardize: $z = \dfrac{{xv} - {mu}}{{sd}} = {zz:num2}$. The area to the left is
    $\Phi({zz:num2}) = {left:num4}$. For "{side}" the answer is **{prob:num4}**
    (for a right tail, subtract the left area from 1).

- id: stat-normal-between
  title: Normal probability between two values
  topic: Normal calculations
  vars:
    mu: {min: 50, max: 150}
    sd: {choices: [4, 5, 10, 20]}
    za: {min: -2.6, max: 1.8, step: 0.2}
    wd: {min: 0.4, max: 3, step: 0.2}
  calc:
    zb: za + wd
    xa: mu + za*sd
    xb: mu + zb*sd
    pa: normcdf(za)
    pb: normcdf(zb)
    prob: pb - pa
  where: ['zb <= 2.8']
  prompt: |-
    The weights of packages are normal with mean {mu} g and standard deviation {sd} g.
    What proportion of packages weigh between {xa} g and {xb} g? Give 4 decimals.
  figure:
    type: plot
    x: ['mu - 3.5*sd', 'mu + 3.5*sd']
    y: [-0.05, 0.45]
    grid: false
    functions: ['normpdf((x - mu)/sd)']
    shade:
      - {f: 'normpdf((x - mu)/sd)', from: xa, to: xb}
    segments:
      - {from: ['mu - 3.5*sd', 0], to: ['mu + 3.5*sd', 0]}
    labels:
      - {at: [xa, -0.03], text: '{xa}'}
      - {at: [xb, -0.03], text: '{xb}'}
  answers:
    - {name: prob, label: 'Proportion', tolerance: 0.0006, format: num4}
  solution: |-
    $z_1 = \dfrac{{xa} - {mu}}{{sd}} = {za:num2}$ and $z_2 = \dfrac{{xb} - {mu}}{{sd}} = {zb:num2}$.
    Area between $= \Phi({zb:num2}) - \Phi({za:num2}) = {pb:num4} - {pa:num4} =$ **{prob:num4}**.

- id: stat-invnorm
  title: Inverse normal (cutoff for the top or bottom)
  topic: Normal calculations
  vars:
    mu: {min: 200, max: 600, step: 10}
    sd: {min: 10, max: 100, step: 5}
    pc: {choices: [1, 2.5, 5, 10, 15, 20, 25, 30]}
    side: {choices: [{label: 'top', value: 1}, {label: 'bottom', value: 0}]}
  calc:
    area: if(side == 1, 1 - pc/100, pc/100)
    zz: invnorm(area)
    xv: mu + zz*sd
  prompt: |-
    Exam scores are normal with mean {mu} and standard deviation {sd}. What score marks
    the cutoff for the **{side} {pc}%**? Give 1 decimal place.
  answers:
    - {name: xv, label: 'Cutoff', tolerance: 0.6, format: num1}
  solution: |-
    The {side} {pc}% leaves an area of {area:num4} to the left of the cutoff, so
    $z = \Phi^{-1}({area:num4}) \approx {zz:num4}$. Unstandardize:
    $x = {mu} + ({zz:num4})({sd}) \approx$ **{xv:num1}**.

- id: stat-normal-find-sd
  title: Find σ from a percentile condition
  topic: Normal calculations
  vars:
    mu: {min: 12, max: 20, step: 0.1}
    gap: {min: 0.2, max: 1.2, step: 0.1}
    pc: {choices: [1, 2, 5, 10]}
  calc:
    lim: mu - gap
    zz: invnorm(pc/100)
    sig: (lim - mu) / zz
  prompt: |-
    A machine fills bottles with a mean of {mu} oz. The amount is normally distributed.
    What standard deviation would make exactly {pc}% of bottles contain less than {lim} oz?
    Give 4 decimal places.
  answers:
    - {name: sig, label: '$\sigma =$', relTolerance: 0.005, format: num4}
  solution: |-
    {pc}% to the left means $z = \Phi^{-1}({pc}/100) \approx {zz:num4}$. Set
    $z = \dfrac{x - \mu}{\sigma}$: ${zz:num4} = \dfrac{{lim} - {mu}}{\sigma}$, so
    $\sigma = \dfrac{{lim} - {mu}}{{zz:num4}} \approx$ **{sig:num4}** oz.
