- id: stat-pvalue-z
  title: p-value from a z statistic
  topic: Significance tests
  vars:
    zz: {min: -3, max: 3, step: 0.01}
    alt: {choices: [{label: '$H_a: p > p_0$', value: 1}, {label: '$H_a: p < p_0$', value: 2}, {label: '$H_a: p \ne p_0$', value: 3}]}
  where: ['abs(zz) >= 0.2']
  calc:
    left: normcdf(zz)
    pv: if(alt == 1, 1 - left, if(alt == 2, left, 2*(1 - normcdf(abs(zz)))))
  prompt: |-
    A one-proportion z test gives $z = {zz}$. Find the p-value for {alt}. Give 4 decimals.
  answers:
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    $\Phi({zz}) = {left:num4}$. Use the right tail for ">", the left tail for "<", and twice the
    tail beyond $|z|$ for "≠". p-value $=$ **{pv:num4}**.

- id: stat-pvalue-t
  title: p-value from a t statistic
  topic: Significance tests
  vars:
    tt: {min: 0.5, max: 3.5, step: 0.01}
    dfree: {choices: [5, 8, 10, 12, 15, 19, 24, 29, 40]}
    alt: {choices: [{label: 'one-sided ($H_a: \mu > \mu_0$)', value: 1}, {label: 'two-sided ($H_a: \mu \ne \mu_0$)', value: 2}]}
  calc:
    tail: 1 - tcdf(tt, dfree)
    pv: alt*tail
  prompt: |-
    A one-sample t test with {dfree} degrees of freedom gives $t = {tt}$. Find the
    {alt} p-value (4 decimals).
  answers:
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Upper tail: $P(t_{{dfree}} \ge {tt}) = {tail:num4}$. For a one-sided test that is the p-value;
    for two-sided, double it. Answer: **{pv:num4}**.

- id: stat-power-z
  title: Power of a one-sided z test
  topic: Errors and power
  vars:
    mu0: {min: 40, max: 100, step: 5}
    sig: {min: 4, max: 20}
    nn: {choices: [16, 25, 36, 49, 64, 100]}
    shift: {min: 0.5, max: 3, step: 0.25}
    al: {choices: [{label: '0.05', value: 0.05}, {label: '0.01', value: 0.01}, {label: '0.10', value: 0.1}]}
  calc:
    se: sig/sqrt(nn)
    mua: mu0 + shift*se
    zs: invnorm(1 - al)
    cut: mu0 + zs*se
    pw: 1 - normcdf((cut - mua)/se)
    beta: 1 - pw
    zb: (cut - mua)/se
  prompt: |-
    Test $H_0: \mu = {mu0}$ vs. $H_a: \mu > {mu0}$ at $\alpha = {al}$, with known $\sigma = {sig}$
    and $n = {nn}$. Find the power of the test if the true mean is $\mu = {mua:num2}$, and the
    probability of a Type II error (4 decimals each).
  answers:
    - {name: pw, label: 'Power', tolerance: 0.003, format: num4}
    - {name: beta, label: '$\beta =$', tolerance: 0.003, format: num4}
  solution: |-
    $\sigma_{\bar{x}} = {sig}/\sqrt{{nn}} = {se:num4}$. Reject when $\bar{x} \ge {mu0} + {zs:dp3}({se:num4}) = {cut:num4}$.
    If $\mu = {mua:num2}$: power $= P\!\left(Z \ge \dfrac{{cut:num4} - {mua:num4}}{{se:num4}}\right) = P(Z \ge {zb:num2}) \approx$
    **{pw:num4}**, and $\beta = 1 - \text{power} \approx$ **{beta:num4}**.

- id: stat-z-test-prop
  title: One-proportion z test
  topic: Tests for proportions
  vars:
    p0: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9]}
    nn: {min: 100, max: 1000, step: 20}
    dd: {min: -0.07, max: 0.07, step: 0.005}
  calc:
    xx: round(nn*(p0 + dd))
    ph: xx/nn
    se: sqrt(p0*(1 - p0)/nn)
    zz: (ph - p0)/se
    pv: 2*(1 - normcdf(abs(zz)))
    q0: 1 - p0
  where: ['abs(zz) >= 0.3', 'abs(zz) <= 3.3', 'nn*p0 >= 10', 'nn*(1 - p0) >= 10']
  prompt: |-
    A manufacturer claims {p0} of its customers are repeat buyers. In a random sample of {nn}
    customers, {xx} are repeat buyers. Test $H_0: p = {p0}$ against $H_a: p \ne {p0}$. Find the
    z statistic (2 decimals) and the p-value (4 decimals).
  answers:
    - {name: zz, label: '$z =$', tolerance: 0.011, format: num2}
    - {name: pv, label: 'p-value', tolerance: 0.003, format: num4}
  solution: |-
    $\hat{p} = {xx}/{nn:dp0} = {ph:num4}$. Under $H_0$, $SE = \sqrt{{p0}({q0})/{nn:dp0}} \approx {se:num4}$.
    $z = \dfrac{{ph:num4} - {p0}}{{se:num4}} \approx$ **{zz:num2}**. Two-sided p-value
    $= 2P(Z \ge |z|) \approx$ **{pv:num4}**.

- id: stat-two-prop-test
  title: Two-proportion z test (pooled)
  topic: Tests for proportions
  vars:
    n1: {min: 80, max: 500, step: 10}
    n2: {min: 80, max: 500, step: 10}
    q1: {min: 0.2, max: 0.8, step: 0.01}
    gap: {min: -0.12, max: 0.12, step: 0.01}
  calc:
    x1: round(n1*q1)
    x2: round(n2*(q1 - gap))
    p1: x1/n1
    p2: x2/n2
    pc: (x1 + x2)/(n1 + n2)
    se: sqrt(pc*(1 - pc)*(1/n1 + 1/n2))
    zz: (p1 - p2)/se
    pv: 2*(1 - normcdf(abs(zz)))
    xt: x1 + x2
    nt: n1 + n2
  where: ['gap != 0', 'abs(zz) >= 0.3', 'abs(zz) <= 3.5']
  prompt: |-
    In an experiment, {x1} of {n1} subjects responded to treatment 1 and {x2} of {n2} responded
    to treatment 2. Test $H_0: p_1 = p_2$ vs. $H_a: p_1 \ne p_2$. Find the pooled proportion
    (4 decimals), the z statistic (2 decimals) and the p-value (4 decimals).
  answers:
    - {name: pc, label: '$\hat{p}_c =$', tolerance: 0.0006, format: num4}
    - {name: zz, label: '$z =$', tolerance: 0.011, format: num2}
    - {name: pv, label: 'p-value', tolerance: 0.003, format: num4}
  solution: |-
    $\hat{p}_1 = {p1:num4}$, $\hat{p}_2 = {p2:num4}$. Pooled $\hat{p}_c = \dfrac{{xt}}{{nt}} =$ **{pc:num4}**.
    $SE = \sqrt{\hat{p}_c(1-\hat{p}_c)(1/{n1} + 1/{n2})} \approx {se:num4}$;
    $z = ({p1:num4} - {p2:num4})/{se:num4} \approx$ **{zz:num2}**; p-value $\approx$ **{pv:num4}**.

- id: stat-t-test-one
  title: One-sample t test
  topic: Tests for means
  vars:
    mu0: {min: 20, max: 100}
    nn: {min: 10, max: 40}
    sx: {min: 2, max: 15, step: 0.1}
    tgt: {min: -3, max: 3, step: 0.05}
  where: ['abs(tgt) >= 0.4']
  calc:
    se: sx/sqrt(nn)
    xbar: round(mu0 + tgt*se, 2)
    tt: (xbar - mu0)/se
    dfree: nn - 1
    pv: 2*(1 - tcdf(abs(tt), dfree))
  prompt: |-
    A random sample of {nn} observations (no outliers or strong skew) has $\bar{x} = {xbar}$ and
    $s = {sx}$. Test $H_0: \mu = {mu0}$ vs. $H_a: \mu \ne {mu0}$. Find $t$ (3 decimals) and the
    p-value (4 decimals).
  answers:
    - {name: tt, label: '$t =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    $SE = {sx}/\sqrt{{nn}} \approx {se:num4}$. $t = \dfrac{{xbar} - {mu0}}{{se:num4}} \approx$ **{tt:dp3}**,
    df $= {dfree}$. Two-sided p-value $= 2P(t_{{dfree}} \ge |t|) \approx$ **{pv:num4}**.

- id: stat-t-test-paired
  title: Paired t test from data
  topic: Tests for means
  vars:
    e1: {min: -3, max: 8}
    e2: {min: -3, max: 8}
    e3: {min: -3, max: 8}
    e4: {min: -3, max: 8}
    e5: {min: -3, max: 8}
    e6: {min: -3, max: 8}
    e7: {min: -3, max: 8}
    b1: {min: 20, max: 40}
    b2: {min: 20, max: 40}
    b3: {min: 20, max: 40}
    b4: {min: 20, max: 40}
    b5: {min: 20, max: 40}
    b6: {min: 20, max: 40}
    b7: {min: 20, max: 40}
  calc:
    a1: b1 + e1
    a2: b2 + e2
    a3: b3 + e3
    a4: b4 + e4
    a5: b5 + e5
    a6: b6 + e6
    a7: b7 + e7
    dbar: mean(e1, e2, e3, e4, e5, e6, e7)
    sd: stdev(e1, e2, e3, e4, e5, e6, e7)
    tt: dbar/(sd/sqrt(7))
    pv: 1 - tcdf(tt, 6)
  where: ['sd > 0', 'tt > 0.3', 'tt < 6']
  prompt: |-
    Seven operators are timed (units per hour) with an old tool and a new tool:

    | Operator | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
    |---|---|---|---|---|---|---|---|
    | Old | {b1} | {b2} | {b3} | {b4} | {b5} | {b6} | {b7} |
    | New | {a1} | {a2} | {a3} | {a4} | {a5} | {a6} | {a7} |

    Test $H_0: \mu_d = 0$ vs. $H_a: \mu_d > 0$ (difference = new − old). Find $t$ (3 decimals) and the
    p-value (4 decimals).
  answers:
    - {name: tt, label: '$t =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Differences: {e1}, {e2}, {e3}, {e4}, {e5}, {e6}, {e7}. $\bar{d} = {dbar:num4}$, $s_d \approx {sd:num4}$.
    $t = \dfrac{{dbar:num4}}{{sd:num4}/\sqrt{7}} \approx$ **{tt:dp3}**, df $= 6$; one-sided p-value
    $= P(t_6 \ge {tt:dp3}) \approx$ **{pv:num4}**.

- id: stat-t-test-two
  title: Two-sample t statistic
  topic: Tests for means
  vars:
    n1: {min: 10, max: 40}
    n2: {min: 10, max: 40}
    m1: {min: 30, max: 80, step: 0.1}
    s1: {min: 2, max: 12, step: 0.1}
    s2: {min: 2, max: 12, step: 0.1}
    gap: {min: -8, max: 8, step: 0.1}
  calc:
    m2: m1 - gap
    se: sqrt(s1^2/n1 + s2^2/n2)
    tt: (m1 - m2)/se
    dfree: min(n1, n2) - 1
    pv: 2*(1 - tcdf(abs(tt), dfree))
  where: ['abs(tt) >= 0.3', 'abs(tt) <= 4.5']
  prompt: |-
    Independent random samples: group 1 has $n_1 = {n1}$, $\bar{x}_1 = {m1}$, $s_1 = {s1}$; group 2 has
    $n_2 = {n2}$, $\bar{x}_2 = {m2:num2}$, $s_2 = {s2}$. Test $H_0: \mu_1 = \mu_2$ vs. $H_a: \mu_1 \ne \mu_2$.
    Find $t$ (3 decimals) and the p-value using the conservative df $= \min(n_1, n_2) - 1$ (4 decimals).
  answers:
    - {name: tt, label: '$t =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    $SE = \sqrt{{s1}^2/{n1} + {s2}^2/{n2}} \approx {se:num4}$; $t = \dfrac{{m1} - {m2:num2}}{{se:num4}} \approx$ **{tt:dp3}**.
    df $= {dfree}$; p-value $= 2P(t_{{dfree}} \ge |t|) \approx$ **{pv:num4}**.
