id: math-statistics
title: Statistics and Probability
description: >-
  Statistics from the first bar chart through a college intro course: describing data
  with graphs and numbers, z-scores and the normal model, correlation and regression,
  sampling and experimental design, probability rules and Bayes' theorem, counting,
  random variables (binomial, geometric, Poisson, and a short calculus-based look at
  continuous distributions), sampling distributions and the Central Limit Theorem,
  confidence intervals, significance tests for proportions and means, chi-square tests,
  inference for regression, one-way ANOVA and nonparametric tests.
revision: 1
modules:
  - id: stat-m1
    title: Exploring one-variable data
  - id: stat-m2
    title: Position and the normal model
  - id: stat-m3
    title: Two-variable data
  - id: stat-m4
    title: Collecting data
  - id: stat-m5
    title: Probability
  - id: stat-m6
    title: Random variables
  - id: stat-m7
    title: Sampling distributions and confidence intervals
  - id: stat-m8
    title: Significance tests
  - id: stat-m9
    title: Chi-square, regression inference and ANOVA
