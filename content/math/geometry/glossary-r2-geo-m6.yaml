- term: primitive Pythagorean triple
  aliases: [primitive Pythagorean triples, primitive triple, primitive triples]
  definition: 'A Pythagorean triple whose three numbers have no common factor greater than 1, such as 3, 4, 5. Every Pythagorean triple is a whole-number multiple of exactly one primitive triple.'
  topic: Pythagorean triples
- term: Euclid's formula
  definition: 'For whole numbers $m > n > 0$, the numbers $a = m^2 - n^2$, $b = 2mn$, $c = m^2 + n^2$ form a Pythagorean triple. Every primitive triple arises from some $m$, $n$ with no common factor and one of them even.'
  topic: Pythagorean triples
- term: rational point
  aliases: [rational points]
  definition: 'A point whose coordinates are both fractions (rational numbers). Pythagorean triples $a, b, c$ correspond to rational points $\left(\tfrac{a}{c}, \tfrac{b}{c}\right)$ on the unit circle.'
  topic: Pythagorean triples
- term: Generalized Pythagorean theorem
  definition: 'If similar figures are drawn on the three sides of a right triangle, with corresponding edges along the sides, the area of the figure on the hypotenuse equals the sum of the areas on the legs.'
  topic: Proofs of the Pythagorean theorem
- term: bearing
  aliases: [bearings]
  definition: 'A direction given as an angle measured clockwise from north, usually written with three digits: north $000^\circ$, east $090^\circ$, south $180^\circ$, west $270^\circ$.'
  topic: Bearings
- term: back bearing
  aliases: [back bearings]
  definition: 'The bearing for the return direction: the original bearing plus or minus $180^\circ$. If $B$ is on bearing $030^\circ$ from $A$, then $A$ is on bearing $210^\circ$ from $B$.'
  topic: Bearings
- term: triangulation
  definition: 'Surveying by measuring one length (the baseline) and then only angles, computing all other distances triangle by triangle, usually with the Law of Sines.'
  topic: Triangulation
- term: baseline
  definition: 'In triangulation, the one distance that is measured directly and carefully; every other length is computed from it and measured angles.'
  topic: Triangulation
- term: golden ratio
  aliases: [phi, φ]
  definition: 'The number $\varphi = \tfrac{1 + \sqrt5}{2} \approx 1.618$, the positive solution of $x^2 = x + 1$. It satisfies $\varphi^2 = \varphi + 1$ and $\tfrac{1}{\varphi} = \varphi - 1$.'
  topic: Golden ratio
- term: golden rectangle
  aliases: [golden rectangles]
  definition: 'A rectangle whose long side is $\varphi$ times its short side. Cutting a square off one end leaves a smaller golden rectangle, similar to the original.'
  topic: Golden ratio
- term: logarithmic spiral
  aliases: [logarithmic spirals]
  definition: 'A spiral that grows by the same factor every time it turns through the same angle, so every part of it has the same shape. The squares of a golden rectangle trace an approximate one.'
  topic: Golden ratio
- term: extreme and mean ratio
  definition: 'Euclid''s name for dividing a segment so that the whole is to the longer piece as the longer piece is to the shorter; the ratio is the golden ratio.'
  topic: Golden ratio
- term: golden triangle
  aliases: [golden triangles]
  definition: 'An isosceles triangle with angles $36^\circ$, $72^\circ$, $72^\circ$; its legs are $\varphi$ times its base. Two diagonals and a side of a regular pentagon form one.'
  topic: Golden ratio
- term: Fibonacci sequence
  aliases: [Fibonacci numbers, Fibonacci number]
  definition: 'The sequence 1, 1, 2, 3, 5, 8, 13, …, in which each term is the sum of the two before it. Ratios of consecutive terms approach the golden ratio.'
  topic: Golden ratio
