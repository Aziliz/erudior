# Round 2, module geo-m1: cards for the honors lessons
- {front: 'When is $B$ between $A$ and $C$?', back: 'When $A$, $B$, $C$ are distinct and collinear and $AB + BC = AC$ (on a number line: $B$''s coordinate is between theirs).', topic: Betweenness and convexity}
- {front: 'Three distinct points on a line: how many are between the other two?', back: 'Exactly one.', topic: Betweenness and convexity}
- {front: Convex set, back: 'Contains the whole segment joining any two of its points. A disk is convex; a circle (curve) is not.', topic: Betweenness and convexity}
- {front: Intersection of convex sets, back: 'Always convex. So interiors of angles and triangles (intersections of half-planes) are convex.', topic: Betweenness and convexity}
- {front: Plane Separation Postulate, back: 'A line splits the rest of the plane into two convex half-planes; a segment joining opposite sides meets the line.', topic: Plane separation}
- {front: 'Coordinate test: same side of $y = mx + b$?', back: 'Compute $d = y - (mx + b)$ for each point. Same sign: same side. Opposite signs: the segment crosses at $t = \tfrac{d_P}{d_P - d_Q}$ of the way from $P$.', topic: Plane separation}
- {front: 'Interior of $\angle ABC$', back: 'Points on $C$''s side of $\overleftrightarrow{BA}$ AND on $A$''s side of $\overleftrightarrow{BC}$.', topic: Plane separation}
- {front: 'Pasch''s axiom', back: 'A line crossing one side of a triangle (not through a vertex) crosses exactly one other side.', topic: Plane separation}
- {front: Crossbar Theorem, back: 'If $D$ is inside $\angle BAC$, ray $\overrightarrow{AD}$ meets $\overline{BC}$. Used whenever an angle bisector of a triangle is said to meet the opposite side.', topic: Plane separation}
- {front: 'Flaw in "every triangle is isosceles"', back: 'It assumes both perpendicular feet lie on the sides. Really $P$ is outside the triangle and one foot is on an extension, so one sum is a difference.', topic: Plane separation}
- {front: 'Lines through $n$ points, no three collinear', back: '$\binom{n}{2} = \tfrac{n(n-1)}{2}$', topic: Counting lines and planes}
- {front: '$n$ points, $k$ of them collinear (no other three collinear): lines?', back: '$\binom{n}{2} - \binom{k}{2} + 1$', topic: Counting lines and planes}
- {front: 'Planes through $n$ points in space, no four coplanar', back: '$\binom{n}{3} = \tfrac{n(n-1)(n-2)}{6}$', topic: Counting lines and planes}
- {front: '$n$ lines in general position: crossing points', back: '$\binom{n}{2}$', topic: Counting regions and angles}
- {front: '$n$ lines in general position: regions', back: '$\tfrac{n^2 + n + 2}{2}$ (1, 2, 4, 7, 11, 16, …); each new line adds one region per piece.', topic: Counting regions and angles}
- {front: '$n$ lines in general position: bounded and unbounded regions', back: 'Unbounded $2n$; bounded $\binom{n-1}{2} = \tfrac{(n-1)(n-2)}{2}$.', topic: Counting regions and angles}
- {front: 'A new line crosses earlier lines at $c$ distinct points. Regions added?', back: '$c + 1$ (it is cut into $c + 1$ pieces, each splitting a region).', topic: Counting regions and angles}
- {front: '$n$ concurrent lines: angles and vertical pairs', back: '$2n(n-1)$ angles (straight angles not counted) in $n(n-1)$ vertical pairs; equally spaced, the smallest is $\tfrac{180^\circ}{n}$.', topic: Counting regions and angles}
- {front: 'Regions from all chords of $n$ points on a circle', back: '$1 + \binom{n}{2} + \binom{n}{4}$ (no three chords concurrent): 1, 2, 4, 8, 16, 31, 57, …', topic: Counting regions and angles}
- {front: 'Why does $2^{n-1}$ fail for circle regions?', back: 'It matches only for $n \le 5$; six points give 31. A pattern is a conjecture until proved.', topic: Counting regions and angles}
