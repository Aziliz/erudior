# Notecards: honors module geo-h1 (Constructions and classic theorems), round 2
# Lesson 90
- {front: 'Constructible number', back: 'A length you can build from a unit segment with compass and straightedge. Exactly the numbers reached from 1 by $+$, $-$, $\times$, $\div$ and square roots.', topic: Constructible lengths}
- {front: 'Multiply lengths with parallel lines', back: 'Mark $OU = 1$, $OB = b$ on one side of an angle and $OA = a$ on the other. The parallel to $\overline{UA}$ through $B$ meets the second side at $P$, and $OP = ab$ (similar triangles).', topic: Constructible lengths}
- {front: 'Construct $\sqrt a$', back: 'Put $AB = a$ and $BC = 1$ on a line, draw the semicircle on $\overline{AC}$, and raise the perpendicular at $B$ to meet it at $D$. Then $BD = \sqrt a$ (geometric mean).', topic: Constructible lengths}
- {front: 'Divide a segment into $n$ equal parts', back: 'Step off $n$ equal pieces on a ray from $A$, join the last mark to $B$, and draw parallels through the other marks (Side Splitter Theorem).', topic: Constructible lengths}
- {front: 'Why each construction step adds at most a square root', back: 'New points come from intersecting lines and circles, which means solving linear or quadratic equations.', topic: Constructible lengths}
- {front: 'Test for non-constructible numbers', back: 'A root of a cubic with rational coefficients and no rational root is not constructible.', topic: Impossible constructions}
- {front: 'The three classical impossible problems', back: 'Doubling the cube (needs $\sqrt[3]{2}$), trisecting every angle ($60^\circ$ needs $\cos 20^\circ$), squaring the circle (needs $\sqrt\pi$).', topic: Impossible constructions}
- {front: 'Who proved them impossible, and when?', back: 'Wantzel (1837): doubling the cube and trisection. Lindemann (1882): $\pi$ is transcendental, so the circle can''t be squared.', topic: Impossible constructions}
- {front: 'Equation for $c = \cos 20^\circ$', back: '$8c^3 - 6c - 1 = 0$, from $\cos 3\theta = 4\cos^3\theta - 3\cos\theta$ with $\cos 60^\circ = \tfrac12$. It has no rational root.', topic: Impossible constructions}
- {front: 'Gauss–Wantzel theorem', back: 'A regular $n$-gon is constructible exactly when $n$ is a power of 2 times distinct Fermat primes (known: 3, 5, 17, 257, 65537).', topic: Impossible constructions}
- {front: 'Constructible regular polygons up to 20 sides', back: '3, 4, 5, 6, 8, 10, 12, 15, 16, 17, 20. Not 7, 9, 11, 13, 14, 18, 19.', topic: Impossible constructions}
# Lesson 91
- {front: 'Cevian', back: 'A segment from a vertex of a triangle to a point on the opposite side.', topic: Ceva's theorem}
- {front: 'Ceva''s theorem', back: 'Cevians $\overline{AD}$, $\overline{BE}$, $\overline{CF}$ (feet on the sides) are concurrent exactly when $\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} \cdot \tfrac{CE}{EA} = 1$.', topic: Ceva's theorem}
- {front: 'How to write the Ceva product', back: 'Go around the triangle: $A \to F \to B \to D \to C \to E \to A$. Each ratio starts where the last one ended.', topic: Ceva's theorem}
- {front: 'Proof idea of Ceva''s theorem', back: 'Triangles with the same height have areas in the ratio of their bases, so $\tfrac{BD}{DC} = \tfrac{[ABP]}{[ACP]}$, and so on; the areas cancel in the product.', topic: Ceva's theorem}
- {front: 'Ceva for medians and angle bisectors', back: 'Medians: $1 \cdot 1 \cdot 1 = 1$. Angle bisectors: $\tfrac ba \cdot \tfrac cb \cdot \tfrac ac = 1$ by the Triangle Angle Bisector Theorem.', topic: Ceva's theorem}
- {front: 'Gergonne point', back: 'Where the cevians to the incircle''s touch points meet. Ceva works because tangent lengths from a vertex are equal: $\tfrac xy \cdot \tfrac yz \cdot \tfrac zx = 1$.', topic: Ceva's theorem}
- {front: 'Menelaus''s theorem', back: 'If a line meets lines $BC$, $CA$, $AB$ at $D$, $E$, $F$ (not vertices), then $\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} \cdot \tfrac{CE}{EA} = 1$.', topic: Menelaus's theorem}
- {front: 'Proof idea of Menelaus''s theorem', back: 'Drop perpendiculars $h_A$, $h_B$, $h_C$ to the line. Similar right triangles give $\tfrac{AF}{FB} = \tfrac{h_A}{h_B}$, and so on; the heights cancel.', topic: Menelaus's theorem}
- {front: 'Ceva or Menelaus?', back: 'Three lines through the vertices meeting at a point: Ceva (feet on the sides). Three points on one line: Menelaus (one or three on extended sides).', topic: Menelaus's theorem}
# Lesson 92
- {front: 'Medial triangle', back: 'The triangle of the three side midpoints. A half-turn about $G$ plus a dilation by $\tfrac12$ from $G$ maps a triangle onto it.', topic: Euler line}
- {front: 'Why $O$, $G$, $H$ are collinear', back: 'The map $T$ (half-turn about $G$, dilate by $\tfrac12$) sends each altitude to a perpendicular bisector, so it sends $H$ to $O$. Hence $O$ is on line $HG$ with $GO = \tfrac12 GH$.', topic: Euler line}
- {front: 'Euler line in coordinates', back: '$G = \tfrac{2O + H}{3}$ and $H = 3G - 2O$.', topic: Euler line}
- {front: 'Order and spacing on the Euler line', back: '$O$, $G$, $N$, $H$ with $OG : GN : NH = 2 : 1 : 3$.', topic: Euler line}
- {front: 'The nine points of the nine-point circle', back: 'The 3 side midpoints, the 3 feet of the altitudes, and the 3 midpoints of $\overline{AH}$, $\overline{BH}$, $\overline{CH}$ (Euler points).', topic: Nine-point circle}
- {front: 'Center and radius of the nine-point circle', back: 'Center $N$ = midpoint of $\overline{OH}$; radius $\tfrac R2$.', topic: Nine-point circle}
- {front: 'Proof idea of the nine-point circle', back: 'Dilate the circumcircle by $\tfrac12$ from $H$. It passes through the Euler points and the side midpoints ($BHCA^*$ is a parallelogram), and the feet follow from Thales'' theorem.', topic: Nine-point circle}
- {front: 'Euler line of a right triangle', back: '$H$ is the right-angle vertex, $O$ the midpoint of the hypotenuse, $OH$ = half the hypotenuse, and the nine-point radius is a quarter of the hypotenuse.', topic: Nine-point circle}
- {front: 'Feuerbach''s theorem', back: 'The nine-point circle is tangent to the incircle (Feuerbach, 1822).', topic: Nine-point circle}
# Lesson 93
- {front: 'Ptolemy''s theorem', back: 'In cyclic $ABCD$: $AC \cdot BD = AB \cdot CD + AD \cdot BC$ (diagonals versus opposite sides).', topic: Ptolemy's theorem}
- {front: 'Proof idea of Ptolemy''s theorem', back: 'Pick $K$ on $\overline{AC}$ with $\angle ABK \cong \angle DBC$. Then $\triangle ABK \sim \triangle DBC$ and $\triangle KBC \sim \triangle ABD$; add $AK \cdot BD$ and $KC \cdot BD$.', topic: Ptolemy's theorem}
- {front: 'Ptolemy for a rectangle', back: '$d^2 = a^2 + b^2$: the Pythagorean theorem.', topic: Ptolemy's theorem}
- {front: 'Diagonal of an isosceles trapezoid', back: '$d^2 = (\text{base}_1)(\text{base}_2) + (\text{leg})^2$.', topic: Ptolemy's theorem}
- {front: 'Diagonal of a regular pentagon with side 1', back: 'Ptolemy gives $d^2 = d + 1$, so $d = \tfrac{1 + \sqrt5}{2} \approx 1.618$.', topic: Ptolemy's theorem}
- {front: 'Point $P$ on arc $BC$ of equilateral $\triangle ABC$', back: '$PA = PB + PC$ (Ptolemy in $ABPC$).', topic: Ptolemy's theorem}
- {front: 'Ptolemy''s inequality', back: 'For any quadrilateral, $AC \cdot BD \le AB \cdot CD + AD \cdot BC$, with equality only for cyclic ones.', topic: Ptolemy's theorem}
- {front: 'Brahmagupta''s formula', back: 'Cyclic quadrilateral with sides $a$, $b$, $c$, $d$: area $= \sqrt{(s - a)(s - b)(s - c)(s - d)}$, $s$ = semiperimeter. With $d = 0$ it becomes Heron''s formula.', topic: Cyclic quadrilaterals}
- {front: 'Before using Ptolemy or Brahmagupta', back: 'Check that the quadrilateral is cyclic: supplementary opposite angles, equal angles on one side, or equal diagonal products.', topic: Cyclic quadrilaterals}
