# Module 5, round 2: drills for the honors lessons
- id: geo-m5-r2-orthocenter
  title: Orthocenter from coordinates
  topic: Concurrency proofs
  vars:
    xa: {min: -6, max: -1}
    xb: {min: 2, max: 9}
    xc: {min: -3, max: 10}
    ht: {min: 2, max: 8}
  where: ["xc != xa", "xc != xb", "mod((xc - xa)*(xc - xb), ht) == 0", "abs((xc - xa)*(xc - xb)/ht) <= 15"]
  calc:
    dcb: xc - xb
    dca: xc - xa
    nxa: -xa
    ms: ht/dcb
    ma: -dcb/ht
    hy: -(dca*dcb)/ht
    ylo: min(-1, hy - 1)
    yhi: max(ht, hy) + 1
  prompt: 'Find the orthocenter $H$ of the triangle with vertices $A({xa}, 0)$, $B({xb}, 0)$ and $C({xc}, {ht})$.'
  answers:
    - {name: xc, label: '$H$: $x =$'}
    - {name: hy, label: '$y =$'}
  figure:
    type: plot
    x: [-7, 11]
    y: [ylo, yhi]
    equal: true
    polygons:
      - points: [[xa, 0], [xb, 0], [xc, ht]]
    points:
      - {at: [xa, 0], label: 'A'}
      - {at: [xb, 0], label: 'B'}
      - {at: [xc, ht], label: 'C'}
  solution: |-
    Side $\overline{AB}$ lies on the $x$-axis, so the altitude from $C$ is the vertical line $x = {xc}$. Side $\overline{BC}$ has slope $\dfrac{{ht}}{{xc} - {xb}} = {ms:texfrac}$, so the altitude from $A$, perpendicular to it, has slope ${ma:texfrac}$ and passes through $A({xa}, 0)$: $y = {ma:texfrac}\,(x {nxa:signed})$. At $x = {xc}$, $y = {ma:texfrac} \cdot {dca} = {hy}$. So $H =$ **({xc}, {hy})**. (It is outside the triangle exactly when the triangle is obtuse.)

- id: geo-m5-r2-euler
  title: Orthocenter from the Euler line
  topic: Euler line
  vars:
    ox: {min: -5, max: 5}
    oy: {min: -5, max: 5}
    gx: {min: -5, max: 5}
    gy: {min: -5, max: 5}
  where: ["ox != gx or oy != gy"]
  calc:
    hx: 3*gx - 2*ox
    hy: 3*gy - 2*oy
    dx: gx - ox
    dy: gy - oy
    dx2: 2*dx
    dy2: 2*dy
  prompt: 'A triangle has circumcenter $O({ox}, {oy})$ and centroid $G({gx}, {gy})$. Find its orthocenter $H$.'
  answers:
    - {name: hx, label: '$H$: $x =$'}
    - {name: hy, label: '$y =$'}
  solution: |-
    The centroid is one-third of the way from $O$ to $H$, so $3G = H + 2O$ and $H = 3G - 2O$. In $x$: $3({gx}) - 2({ox}) = {hx}$. In $y$: $3({gy}) - 2({oy}) = {hy}$. So $H =$ **({hx}, {hy})**. Check: going from $O$ to $G$ changes the coordinates by $({dx}, {dy})$, and going from $G$ to $H$ changes them by $({dx2}, {dy2})$, twice as much in the same direction.

- id: geo-m5-r2-varignon
  title: Varignon parallelogram perimeter and area
  topic: Varignon's theorem
  vars:
    bx: {min: 6, max: 12}
    cx: {min: 5, max: 12}
    cy: {min: 3, max: 10}
    dx: {min: -3, max: 4}
    dy: {min: 4, max: 10}
  where: ["(cx - bx)*(dy - cy) - cy*(dx - cx) > 0", "(dx - cx)*(0 - dy) - (dy - cy)*(0 - dx) > 0", "abs(dx - cx) >= 3"]
  calc:
    K: (bx*cy + cx*dy - dx*cy)/2
    va: K/2
    ac: hypot(cx, cy)
    bd: hypot(dx - bx, dy)
    per: ac + bd
  prompt: 'Quadrilateral $ABCD$ has vertices $A(0, 0)$, $B({bx}, 0)$, $C({cx}, {cy})$ and $D({dx}, {dy})$, and its area is {K}. Find the perimeter (to 2 decimal places) and the area of its Varignon parallelogram, the parallelogram whose vertices are the midpoints of the sides.'
  answers:
    - {name: per, label: 'Perimeter', tolerance: 0.02}
    - {name: va, label: 'Area'}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [bx, 0], [cx, cy], [dx, dy]]
    segments:
      - {from: [0, 0], to: [cx, cy], dashed: true}
      - {from: [bx, 0], to: [dx, dy], dashed: true}
    labels:
      - {at: [-0.6, -0.6], text: 'A'}
      - {at: [bx + 0.6, -0.6], text: 'B'}
      - {at: [cx + 0.7, cy], text: 'C'}
      - {at: [dx - 0.7, dy], text: 'D'}
  solution: |-
    Each side of the Varignon parallelogram is half a diagonal, and there are two sides for each diagonal, so its perimeter is $AC + BD$. $AC = \sqrt{{cx}^2 + {cy}^2} \approx {ac:num2}$ and $BD = \sqrt{({dx} - {bx})^2 + {dy}^2} \approx {bd:num2}$, so the perimeter is about **{per:num2}**. Its area is half the quadrilateral's: $\tfrac12 \cdot {K} =$ **{va}**.

- id: geo-m5-r2-star-angle
  title: Tip angles of a star polygon
  topic: Turning and star polygons
  vars:
    n: {min: 5, max: 12}
    k: {choices: [2, 3, 4, 5]}
  where: ["2*k < n", "gcd(n, k) == 1"]
  calc:
    turn: 360*k
    each: 360*k/n
    tip: 180 - 360*k/n
    tsum: 180*(n - 2*k)
  prompt: 'Find each tip angle of the star polygon $\{{n}/{k}\}$ (to 2 decimal places if needed) and the sum of its {n} tip angles, in degrees.'
  answers:
    - {name: tip, label: 'Each tip angle'}
    - {name: tsum, label: 'Sum of the tips'}
  solution: |-
    Walking once around $\{{n}/{k}\}$ you circle the center {k} times, so you turn $360^\circ \cdot {k} = {turn}^\circ$ in all, in {n} equal turns of $\dfrac{{turn}^\circ}{{n}} \approx {each}^\circ$. Each tip angle is what's left of a straight angle: $180^\circ - {each}^\circ \approx$ **{tip}°**. The {n} tips add to $180({n} - 2 \cdot {k}) =$ **{tsum}°**.

- id: geo-m5-r2-vertex-fill
  title: The third polygon at a vertex
  topic: Tilings
  vars:
    p: {choices: [3, 4, 5, 6, 7, 8, 9, 10, 12]}
    q: {choices: [3, 4, 5, 6, 7, 8, 9, 10, 12, 15, 18, 20, 24, 42]}
  where: ["1/2 - 1/p - 1/q > 0.01", "abs(1/(1/2 - 1/p - 1/q) - round(1/(1/2 - 1/p - 1/q))) < 0.000001"]
  calc:
    inv: 1/2 - 1/p - 1/q
    r: round(1/inv)
    a1: 180 - 360/p
    a2: 180 - 360/q
    a3: 180 - 360/r
  prompt: 'A regular polygon with {p} sides and a regular polygon with {q} sides meet at a point. One more regular polygon fills the rest of the $360^\circ$ around the point exactly. How many sides does it have?'
  answer: r
  format: integer
  solution: |-
    For three regular polygons with $a$, $b$ and $c$ sides around a point, $\tfrac1a + \tfrac1b + \tfrac1c = \tfrac12$. So $\tfrac1c = \tfrac12 - \tfrac1{{p}} - \tfrac1{{q}} = {inv:texfrac}$, and $c =$ **{r}**. Check with angles: about ${a1}^\circ + {a2}^\circ + {a3}^\circ = 360^\circ$. (Fitting around one point does not guarantee that a whole tiling exists.)
