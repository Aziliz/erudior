# Round 2 drills for geo-m2 (honors: mathematical induction)
- id: geo-m2-r2-line-regions
  title: Regions made by lines in general position
  topic: Mathematical induction
  vars:
    n: {min: 4, max: 25}
  calc:
    R: n*(n + 1)/2 + 1
    T: n*(n + 1)/2
    n1: n + 1
  prompt: '{n} lines are drawn in a plane so that no two are parallel and no three pass through one point. Into how many regions do they divide the plane?'
  answers:
    - {name: R, label: 'Regions'}
  solution: |-
    The plane starts as 1 region, and the $k$th line crosses the $k - 1$ earlier lines at $k - 1$ different points, so it is cut into $k$ pieces and adds $k$ regions. So $R = 1 + (1 + 2 + \dots + {n}) = \dfrac{{n} \cdot {n1}}{2} + 1 = {T} + 1 =$ **{R}**.

- id: geo-m2-r2-odd-sum
  title: Sum of consecutive odd numbers
  topic: Mathematical induction
  vars:
    n: {min: 6, max: 40}
  calc:
    last: 2*n - 1
    S: n^2
  prompt: 'Find the sum $1 + 3 + 5 + \dots + {last}$.'
  answers:
    - {name: S, label: 'Sum'}
  solution: |-
    The last term is $2n - 1 = {last}$, so there are $n = {n}$ odd numbers. The sum of the first $n$ odd numbers is $n^2$, so the sum is ${n}^2 =$ **{S}**.
