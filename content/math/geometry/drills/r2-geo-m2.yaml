# Round 2 drills for geo-m2 (honors: mathematical induction)
- id: geo-m2-r2-odd-sum
  title: Sum of consecutive odd numbers
  topic: Mathematical induction
  vars:
    n: {min: 6, max: 40}
  calc:
    last: 2*n - 1
    S: n^2
  prompt: 'Find the sum $1 + 3 + 5 + \dots + {last}$.'
  answers:
    - {name: S, label: 'Sum'}
  solution: |-
    The last term is $2n - 1 = {last}$, so there are $n = {n}$ odd numbers. The sum of the first $n$ odd numbers is $n^2$, so the sum is ${n}^2 =$ **{S}**.

- id: geo-m2-r2-odd-range
  title: Sum of odd numbers that starts later
  topic: Mathematical induction
  vars:
    a: {min: 3, max: 15}
    b: {min: 10, max: 40}
  where: ["b - a >= 4"]
  calc:
    first: 2*a + 1
    second: 2*a + 3
    last: 2*b - 1
    below: 2*a - 1
    S: b^2 - a^2
    B2: b^2
    A2: a^2
  prompt: 'Find the sum of the odd numbers ${first} + {second} + \dots + {last}$.'
  answers:
    - {name: S, label: 'Sum'}
  solution: |-
    $1 + 3 + \dots + {last}$ is the sum of the first {b} odd numbers (since $2 \cdot {b} - 1 = {last}$), which is ${b}^2 = {B2}$. The odd numbers below {first} are $1 + 3 + \dots + {below}$, the first {a} odd numbers, with sum ${a}^2 = {A2}$. So the sum is ${B2} - {A2} =$ **{S}**.
