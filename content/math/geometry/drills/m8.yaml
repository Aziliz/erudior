# Module 8 drills
- id: geo-area-trap
  title: Area of a trapezoid
  topic: Area of polygons
  vars:
    b1: {min: 3, max: 20}
    b2: {min: 4, max: 30}
    h: {min: 2, max: 15}
  where: ["b1 < b2"]
  calc:
    A: (b1 + b2)*h/2
    s: b1 + b2
    sh: (b2 - b1)/2
  prompt: 'A trapezoid has bases {b1} and {b2} and height {h}. Find its area.'
  answers:
    - {name: A, label: 'Area'}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [b2, 0], ['sh + b1', h], [sh, h]]
    segments:
      - {from: [sh, h], to: [sh, 0], dashed: true, label: '{h}'}
    labels:
      - {at: ['b2/2', '-0.07*b2'], text: '{b2}'}
      - {at: ['sh + b1/2', 'h + 0.07*b2'], text: '{b1}'}
  solution: |-
    $A = \tfrac12(b_1 + b_2)h = \tfrac12({b1} + {b2})({h}) = \tfrac12 \cdot {s} \cdot {h} =$ **{A}**.

- id: geo-area-kite
  title: Area of a rhombus or kite
  topic: Area of polygons
  vars:
    d1: {min: 2, max: 30}
    d2: {min: 2, max: 30}
    shape: {choices: [{label: rhombus, value: 0.5}, {label: kite, value: 0.3}]}
  where: ["d1 != d2"]
  calc:
    A: d1*d2/2
  prompt: 'A {shape} has diagonals {d1} and {d2}. Find its area.'
  answers:
    - {name: A, label: 'Area'}
  figure:
    type: shape
    polygons:
      - points: [['-d1/2', 0], [0, 'd2*shape'], ['d1/2', 0], [0, '-d2*(1 - shape)']]
    segments:
      - {from: ['-d1/2', 0], to: ['d1/2', 0], dashed: true}
      - {from: [0, 'd2*shape'], to: [0, '-d2*(1 - shape)'], dashed: true}
  solution: |-
    The diagonals are perpendicular, so the area is half their product: $\tfrac12 \cdot {d1} \cdot {d2} =$ **{A}**.

- id: geo-area-tri-sas
  title: Triangle area from two sides and an angle
  topic: Area of polygons
  vars:
    a: {min: 3, max: 20}
    b: {min: 3, max: 20}
    C: {min: 15, max: 165}
  calc:
    A: a*b*sind(C)/2
  prompt: 'A triangle has sides {a} and {b} with an included angle of ${C}^\circ$. Find its area (2 decimals).'
  answers:
    - {name: A, label: 'Area', tolerance: 0.01}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [a, 0], ['b*cosd(C)', 'b*sind(C)']]
    labels:
      - {at: ['a/2', '-0.08*(a + b)'], text: '{a}'}
      - {at: ['0.1*(a + b)*cosd(C/2)', '0.1*(a + b)*sind(C/2)'], text: '{C}°'}
  solution: |-
    The height to side {a} is ${b}\sin {C}^\circ$, so $A = \tfrac12 ab\sin C = \tfrac12 \cdot {a} \cdot {b} \cdot \sin {C}^\circ \approx$ **{A:num2}**.

- id: geo-circle-area
  title: Circle area from circumference
  topic: Area of circles and sectors
  vars:
    r: {min: 2, max: 25}
  calc:
    C2: 2*r
    A: pi*r^2
    r2: r^2
  prompt: 'A circle has circumference ${C2}\pi$. Find its area (exact, like 49pi, or 2 decimals).'
  answers:
    - {name: A, label: 'Area', tolerance: 0.01}
  solution: |-
    $2\pi r = {C2}\pi$ gives $r = {r}$. Then $A = \pi r^2 = {r2}\pi \approx$ **{A:num2}**.

- id: geo-sector-area
  title: Sector area
  topic: Area of circles and sectors
  vars:
    r: {min: 2, max: 20}
    ang: {min: 10, max: 350, step: 5}
  calc:
    A: ang/360*pi*r^2
    r2: r^2
  prompt: 'Find the area of a sector with central angle ${ang}^\circ$ in a circle of radius {r} (exact or 2 decimals).'
  answers:
    - {name: A, label: 'Area', tolerance: 0.01}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r}
    segments:
      - {from: [0, 0], to: [r, 0]}
      - {from: [0, 0], to: ['r*cosd(ang)', 'r*sind(ang)']}
    labels:
      - {at: ['0.3*r*cosd(ang/2)', '0.3*r*sind(ang/2)'], text: '{ang}°'}
  solution: |-
    The sector is $\tfrac{{ang}}{360}$ of the circle: $\dfrac{{ang}}{360} \cdot \pi \cdot {r2} \approx$ **{A:num2}**.

- id: geo-reg-poly-area
  title: Area of a regular polygon
  topic: Regular polygons
  vars:
    n: {choices: [5, 6, 7, 8, 9, 10, 12]}
    s: {min: 2, max: 20}
  calc:
    half: 180/n
    a: (s/2)/tand(half)
    P: n*s
    A: a*P/2
  prompt: 'Find the apothem and the area of a regular {n}-gon with side {s} (2 decimals).'
  answers:
    - {name: a, label: 'Apothem', tolerance: 0.01}
    - {name: A, label: 'Area', relTolerance: 0.004}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [1, 0], ['cos(2*pi/n)', 'sin(2*pi/n)']]
    segments:
      - {from: [0, 0], to: ['(1 + cos(2*pi/n))/2', 'sin(2*pi/n)/2'], dashed: true, label: 'a'}
    rightAngles:
      - [['(1 + cos(2*pi/n))/2', 'sin(2*pi/n)/2'], [1, 0], [0, 0]]
    labels:
      - {at: ['1.12*(1 + cos(2*pi/n))/2', '1.12*sin(2*pi/n)/2'], text: 's = {s}'}
    points:
      - {at: [0, 0], label: 'center'}
  solution: |-
    Half the central angle is $\tfrac{180}{{n}} \approx {half:num2}^\circ$. In the right triangle with half a side ($\tfrac{{s}}{2}$) opposite that angle, the apothem is $a = \dfrac{{s}/2}{\tan {half:num2}^\circ} \approx$ **{a:num2}**. Perimeter $P = {n} \cdot {s} = {P}$, so $A = \tfrac12 aP \approx$ **{A:num2}**.

- id: geo-sa-prism
  title: Surface area of a box
  topic: Surface area
  vars:
    l: {min: 2, max: 20}
    w: {min: 2, max: 20}
    h: {min: 2, max: 20}
  calc:
    S: 2*(l*w + l*h + w*h)
    lw: l*w
    lh: l*h
    wh: w*h
  prompt: 'Find the surface area of a rectangular prism {l} by {w} by {h}.'
  answers:
    - {name: S, label: 'Surface area'}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [l, 0], [l, h], [0, h]]
      - points: [[l, 0], ['l + 0.5*w', '0.35*w'], ['l + 0.5*w', 'h + 0.35*w'], [l, h]]
      - points: [[0, h], [l, h], ['l + 0.5*w', 'h + 0.35*w'], ['0.5*w', 'h + 0.35*w']]
  solution: |-
    Three pairs of faces: $2({l} \cdot {w} + {l} \cdot {h} + {w} \cdot {h}) = 2({lw} + {lh} + {wh}) =$ **{S}**.

- id: geo-sa-cyl
  title: Surface area of a cylinder
  topic: Surface area
  vars:
    r: {min: 1, max: 15}
    h: {min: 1, max: 25}
  calc:
    L: 2*pi*r*h
    S: 2*pi*r*h + 2*pi*r^2
    kL: 2*r*h
    kB: 2*r^2
    k: kL + kB
  prompt: 'A cylinder has radius {r} and height {h}. Find its lateral area and total surface area (exact like 48pi, or 2 decimals).'
  answers:
    - {name: L, label: 'Lateral area', tolerance: 0.01}
    - {name: S, label: 'Surface area', tolerance: 0.01}
  solution: |-
    Lateral area $= 2\pi rh = {kL:dp0}\pi \approx$ **{L:num2}**. Adding the two bases ($2\pi r^2 = {kB:dp0}\pi$): $S = {k:dp0}\pi \approx$ **{S:num2}**.

- id: geo-sa-cone
  title: Surface area of a cone
  topic: Surface area
  vars:
    r: {min: 2, max: 15}
    h: {min: 2, max: 20}
  calc:
    l: sqrt(r^2 + h^2)
    S: pi*r*l + pi*r^2
    l2: r^2 + h^2
  prompt: 'A right cone has radius {r} and height {h}. Find its slant height and total surface area (2 decimals).'
  answers:
    - {name: l, label: 'Slant height', tolerance: 0.01}
    - {name: S, label: 'Surface area', relTolerance: 0.001}
  figure:
    type: shape
    polygons:
      - points: [['-r', 0], [r, 0], [0, h]]
    segments:
      - {from: [0, 0], to: [0, h], dashed: true, label: '{h}'}
      - {from: [0, 0], to: [r, 0], label: '{r}'}
    rightAngles:
      - [[0, 0], [r, 0], [0, h]]
  solution: |-
    The slant height is the hypotenuse of the right triangle with legs $r$ and $h$: $\ell = \sqrt{{r}^2 + {h}^2} = \sqrt{{l2}} \approx$ **{l:num2}**. Then $S = \pi r\ell + \pi r^2 \approx$ **{S:num2}**.

- id: geo-vol-cone
  title: Volume of a cone
  topic: Volume
  vars:
    r: {min: 1, max: 15}
    h: {min: 1, max: 30}
  calc:
    V: pi*r^2*h/3
  prompt: 'Find the volume of a cone with radius {r} and height {h} (2 decimals).'
  answers:
    - {name: V, label: 'Volume', tolerance: 0.01}
  figure:
    type: shape
    polygons:
      - points: [['-r', 0], [r, 0], [0, h]]
    segments:
      - {from: [0, 0], to: [0, h], dashed: true, label: '{h}'}
      - {from: [0, 0], to: [r, 0], label: '{r}'}
  solution: |-
    $V = \tfrac13 \pi r^2 h = \tfrac13 \pi \cdot {r}^2 \cdot {h} \approx$ **{V:num2}**.

- id: geo-vol-pyramid
  title: Volume of a square pyramid from its slant height
  topic: Volume
  vars:
    hb: {min: 2, max: 12}
    h: {min: 2, max: 20}
  calc:
    s: 2*hb
    l: sqrt(hb^2 + h^2)
    V: s^2*h/3
    s2: s^2
    l2: hb^2 + h^2
    hb2: hb^2
  prompt: 'A square pyramid has base edge {s} and slant height $\ell = \sqrt{{l2}}$. Find its height and its volume (2 decimals if needed).'
  answers:
    - {name: h, label: 'Height', tolerance: 0.01}
    - {name: V, label: 'Volume', relTolerance: 0.001}
  solution: |-
    The height, half the base edge ({hb}) and the slant height form a right triangle: $h = \sqrt{\ell^2 - {hb}^2} = \sqrt{{l2} - {hb2}} =$ **{h}**. Then $V = \tfrac13 Bh = \tfrac13 \cdot {s2} \cdot {h} \approx$ **{V:num2}**.

- id: geo-vol-sphere
  title: Sphere from its volume
  topic: Volume
  vars:
    r: {min: 1, max: 12}
  calc:
    V: 4/3*pi*r^3
    k: 4*r^3
    S: 4*pi*r^2
  prompt: 'A sphere has volume $\tfrac{{k:dp0}}{3}\pi$. Find its radius and its surface area (2 decimals).'
  answers:
    - {name: r, label: 'Radius', tolerance: 0.01}
    - {name: S, label: 'Surface area', relTolerance: 0.001}
  solution: |-
    $\tfrac43 \pi r^3 = \tfrac{{k:dp0}}{3}\pi$ gives $4r^3 = {k:dp0}$, so $r^3 = {k:dp0}/4$ and $r =$ **{r}**. Then $S = 4\pi r^2 \approx$ **{S:num2}**.

- id: geo-vol-cyl
  title: Volume of a cylinder
  topic: Volume
  vars:
    r: {min: 1, max: 15}
    h: {min: 1, max: 25}
  calc:
    V: pi*r^2*h
    kV: r^2*h
  prompt: 'A cylinder has radius {r} and height {h}. Find its volume (exact like 48pi, or 2 decimals).'
  answers:
    - {name: V, label: 'Volume', tolerance: 0.01}
  solution: |-
    $V = Bh = \pi r^2 h = \pi({r})^2({h}) = {kV:dp0}\pi \approx$ **{V:num2}**.
