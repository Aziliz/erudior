# Round 2 drills for geo-m9 honors lessons (geo-h-isometries, geo-h-matrices, geo-h-conics)
- id: geo-m9-r2-two-mirrors
  title: Two reflections make a rotation
  topic: Classifying isometries
  vars:
    al: {choices: [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165]}
    be: {choices: [0, 15, 30, 45, 60, 75, 90, 105, 120, 135, 150, 165]}
  where: ["al != be"]
  calc:
    df: be - al
    r: 2*(be - al)
    ang: if(r < 0, r + 360, r)
  prompt: 'A figure is reflected in the line through the origin that makes an angle of ${al}^\circ$ with the positive $x$-axis, and then in the line through the origin at ${be}^\circ$. The result is a rotation about the origin. Through what counterclockwise angle, between $0^\circ$ and $360^\circ$?'
  answers:
    - {name: ang, label: 'Angle (degrees)'}
  figure:
    type: plot
    x: [-6, 6]
    y: [-6, 6]
    equal: true
    segments:
      - {from: ['-5.5*cosd(al)', '-5.5*sind(al)'], to: ['5.5*cosd(al)', '5.5*sind(al)'], label: 'first'}
      - {from: ['-5.5*cosd(be)', '-5.5*sind(be)'], to: ['5.5*cosd(be)', '5.5*sind(be)'], dashed: true, label: 'second'}
    points:
      - {at: [0, 0], label: 'O'}
  solution: |-
    A reflection in a line through the origin at angle $\alpha$ keeps each point's distance from $O$ and sends its angle $\varphi$ to $2\alpha - \varphi$. Two in a row: $\varphi \to 2\beta - (2\alpha - \varphi) = \varphi + 2(\beta - \alpha)$.
    Here $2({be} - {al}) = 2({df}) = {r}$ degrees. A turn of ${r}^\circ$ is the same as one of ${ang}^\circ$ counterclockwise (add $360^\circ$ to a negative angle), so the answer is **{ang}°**.

- id: geo-m9-r2-mirror-shift
  title: Reflect, then translate
  topic: Classifying isometries
  vars:
    k: {min: -5, max: 5}
    a: {min: -6, max: 6}
    b: {min: -6, max: 6}
  where: ["a != 0", "b != 0", "k != 0"]
  calc:
    kk2: 2*k + b
    m: k + b/2
    t: a
  prompt: 'Reflect in the line $y = {k}$, then translate by $\langle {a}, {b} \rangle$. The result is a glide reflection: a reflection in a horizontal line $y = m$ followed by a slide of $t$ units along that line (positive means to the right). Find $m$ and $t$.'
  answers:
    - {name: m, label: '$m =$'}
    - {name: t, label: '$t =$'}
  solution: |-
    Reflecting in $y = {k}$ sends $(x, y)$ to $(x,\; 2({k}) - y)$; the translation then gives $(x {a:signed},\; {kk2} - y)$.
    A point's $y$-coordinate and its image's always average $\tfrac{{kk2}}{2} = {m}$, so the mirror of the glide reflection is $y =$ **{m}** (the vertical part of the translation just moves the mirror by half of it). The horizontal part is the slide: $t =$ **{t}**.

- id: geo-m9-r2-rotate-angle
  title: Rotate a point by any angle
  topic: Rotations by any angle
  vars:
    x: {min: -6, max: 6}
    y: {min: -6, max: 6}
    th: {choices: [30, 45, 60, 120, 135, 150, 210, 225, 240, 300, 315, 330]}
  where: ["x != 0", "y != 0"]
  calc:
    cs: cosd(th)
    sn: sind(th)
    xr: x*cs - y*sn
    yr: x*sn + y*cs
  prompt: 'Rotate $({x}, {y})$ by ${th}^\circ$ counterclockwise about the origin. Give each coordinate to 2 decimal places.'
  answers:
    - {name: xr, label: '$x'' =$', tolerance: 0.01}
    - {name: yr, label: '$y'' =$', tolerance: 0.01}
  figure:
    type: plot
    x: [-9, 9]
    y: [-9, 9]
    equal: true
    points:
      - {at: [x, y], label: 'P'}
      - {at: [0, 0], label: 'O'}
  solution: |-
    $\cos {th}^\circ \approx {cs:num4}$ and $\sin {th}^\circ \approx {sn:num4}$.
    $x' = x\cos\theta - y\sin\theta = ({x})({cs:num4}) - ({y})({sn:num4}) \approx$ **{xr:num2}**.
    $y' = x\sin\theta + y\cos\theta = ({x})({sn:num4}) + ({y})({cs:num4}) \approx$ **{yr:num2}**.

- id: geo-m9-r2-matrix-image
  title: Apply a matrix to a point
  topic: Transformation matrices
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    d: {min: -4, max: 4}
    x: {min: -5, max: 5}
    y: {min: -5, max: 5}
  where: ["a*d - b*c != 0", "x != 0", "y != 0"]
  calc:
    ix: a*x + b*y
    iy: c*x + d*y
  prompt: 'Find the image of the point $({x}, {y})$ under the matrix $\begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$.'
  answers:
    - {name: ix, label: '$x'' =$'}
    - {name: iy, label: '$y'' =$'}
  solution: |-
    Each row times the column $({x}, {y})$:
    $x' = ({a})({x}) + ({b})({y}) =$ **{ix}** and $y' = ({c})({x}) + ({d})({y}) =$ **{iy}**.

- id: geo-m9-r2-det-area
  title: Determinant and area of an image
  topic: Transformation matrices
  vars:
    a: {min: -4, max: 4}
    b: {min: -4, max: 4}
    c: {min: -4, max: 4}
    d: {min: -4, max: 4}
    p: {min: 1, max: 6}
    q: {min: 1, max: 6}
  where: ["a*d - b*c != 0"]
  calc:
    det: a*d - b*c
    ar0: p*q/2
    ar1: abs(a*d - b*c)*p*q/2
  prompt: 'The triangle with vertices $(0, 0)$, $({p}, 0)$ and $(0, {q})$ is transformed by the matrix $\begin{bmatrix} {a} & {b} \\ {c} & {d} \end{bmatrix}$. Find the determinant of the matrix and the area of the image triangle.'
  answers:
    - {name: det, label: 'Determinant'}
    - {name: ar1, label: 'Image area'}
  solution: |-
    $\det = ({a})({d}) - ({b})({c}) =$ **{det}**.
    The original triangle has area $\tfrac12 \cdot {p} \cdot {q} = {ar0}$. Every area is multiplied by $|\det|$, so the image has area $|{det}| \cdot {ar0} =$ **{ar1}**. (A negative determinant also means the image has the opposite orientation.)

- id: geo-m9-r2-ellipse
  title: Foci of an ellipse
  topic: Ellipses
  vars:
    m: {min: 2, max: 3}
    n: {min: 1, max: 2}
    sw: {choices: [0, 1]}
    dir: {choices: [{label: 'x', value: 1}, {label: 'y', value: 2}]}
    h: {min: -5, max: 5}
    k: {min: -5, max: 5}
  where: ["n < m", "h != 0", "k != 0"]
  calc:
    aa: m^2 + n^2
    bb: if(sw == 0, 2*m*n, m^2 - n^2)
    cc: if(sw == 0, m^2 - n^2, 2*m*n)
    a2: aa^2
    b2: bb^2
    c2: cc^2
    d1: if(dir == 1, aa^2, bb^2)
    d2: if(dir == 1, bb^2, aa^2)
    fx: if(dir == 1, h + cc, h)
    fy: if(dir == 1, k, k + cc)
    nh: -h
    nk: -k
  prompt: 'For the ellipse $\dfrac{(x {nh:signed})^2}{{d1}} + \dfrac{(y {nk:signed})^2}{{d2}} = 1$, find $c$, the distance from the center to each focus, and the coordinates of the focus that lies to the right of or above the center.'
  answers:
    - {name: cc, label: '$c =$'}
    - {name: fx, label: 'Focus $x =$'}
    - {name: fy, label: 'Focus $y =$'}
  solution: |-
    The center is $({h}, {k})$. The larger denominator, $a^2 = {a2}$, is under the ${dir}$-term, so the major axis (and both foci) run parallel to the ${dir}$-axis; the other denominator is $b^2 = {b2}$.
    $c^2 = a^2 - b^2 = {a2} - {b2} = {c2}$, so $c =$ **{cc}**. Moving {cc} from the center along the major axis (right or up) gives the focus **({fx}, {fy})**.

- id: geo-m9-r2-ellipse-eq
  title: Ellipse from its foci
  topic: Ellipses
  vars:
    m: {min: 2, max: 3}
    n: {min: 1, max: 2}
    sw: {choices: [0, 1]}
    dir: {choices: [{label: 'x', value: 1}, {label: 'y', value: 2}]}
    h: {min: -5, max: 5}
    k: {min: -5, max: 5}
  where: ["n < m", "h != 0", "k != 0"]
  calc:
    aa: m^2 + n^2
    bb: if(sw == 0, 2*m*n, m^2 - n^2)
    cc: if(sw == 0, m^2 - n^2, 2*m*n)
    a2: aa^2
    b2: bb^2
    c2: cc^2
    s: 2*aa
    d1: if(dir == 1, aa^2, bb^2)
    d2: if(dir == 1, bb^2, aa^2)
    f1x: if(dir == 1, h - cc, h)
    f1y: if(dir == 1, k, k - cc)
    f2x: if(dir == 1, h + cc, h)
    f2y: if(dir == 1, k, k + cc)
    nh: -h
    nk: -k
  prompt: 'An ellipse has foci $({f1x}, {f1y})$ and $({f2x}, {f2y})$, and for every point on it the distances to the two foci add up to {s}. Its equation is $\dfrac{(x {nh:signed})^2}{A} + \dfrac{(y {nk:signed})^2}{B} = 1$. Find $A$ and $B$.'
  answers:
    - {name: d1, label: '$A =$'}
    - {name: d2, label: '$B =$'}
  solution: |-
    The center is the midpoint of the foci, $({h}, {k})$, and each focus is $c = {cc}$ from it. The sum is $2a = {s}$, so $a = {aa}$ and $b^2 = a^2 - c^2 = {a2} - {c2} = {b2}$.
    The foci lie on a line parallel to the ${dir}$-axis, so $a^2 = {a2}$ goes under the ${dir}$-term: $A =$ **{d1}** and $B =$ **{d2}**.

- id: geo-m9-r2-hyperbola
  title: Hyperbola from its foci
  topic: Hyperbolas
  vars:
    m: {min: 2, max: 3}
    n: {min: 1, max: 2}
    sw: {choices: [0, 1]}
  where: ["n < m"]
  calc:
    cc: m^2 + n^2
    aa: if(sw == 0, 2*m*n, m^2 - n^2)
    bb: if(sw == 0, m^2 - n^2, 2*m*n)
    a2: aa^2
    b2: bb^2
    c2: cc^2
    s: 2*aa
    sl: bb/aa
  prompt: 'A hyperbola has foci $(-{cc}, 0)$ and $({cc}, 0)$, and for every point on it the distances to the two foci differ by {s}. Its equation is $\dfrac{x^2}{a^2} - \dfrac{y^2}{b^2} = 1$. Find $b^2$ and the positive slope of the asymptotes (as a fraction or to 2 decimal places).'
  answers:
    - {name: b2, label: '$b^2 =$'}
    - {name: sl, label: 'Slope', tolerance: 0.006}
  figure:
    type: plot
    x: ['-1.5*cc', '1.5*cc']
    y: ['-1.5*cc', '1.5*cc']
    equal: true
    points:
      - {at: ['-cc', 0], label: 'F₁'}
      - {at: [cc, 0], label: 'F₂'}
  solution: |-
    The difference is $2a = {s}$, so $a = {aa}$, and $c = {cc}$. For a hyperbola $b^2 = c^2 - a^2 = {c2} - {a2} =$ **{b2}**, so $b = {bb}$.
    The asymptotes are $y = \pm\tfrac{b}{a}x = \pm\tfrac{{bb}}{{aa}}x$, so the positive slope is $\tfrac{{bb}}{{aa}} \approx$ **{sl:num2}**.
