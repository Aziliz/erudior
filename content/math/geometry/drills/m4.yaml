# Module 4 drills
- id: geo-tri-sum
  title: Triangle angle sum with algebra
  topic: Triangle angle sum
  vars:
    p: {min: 5, max: 30}
    a: {min: 1, max: 5}
    b: {min: -15, max: 30}
    c: {min: 1, max: 5}
    d: {min: -15, max: 30}
  where: ["b != 0", "d != 0", "a*p + b >= 20", "c*p + d >= 20", "a*p + b + c*p + d <= 160", "a + c < 9", "f != 0"]
  calc:
    A: a*p + b
    B: c*p + d
    C: 180 - A - B
    e: 9 - a - c
    f: C - e*p
    k: b + d + f
    AC: 10*sind(B)/sind(C)
  prompt: 'In $\triangle ABC$, $m\angle A = ({a:coef}x {b:signed})^\circ$, $m\angle B = ({c:coef}x {d:signed})^\circ$ and $m\angle C = ({e:coef}x {f:signed})^\circ$. Find $x$ and $m\angle C$.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: C, label: '$m\angle C =$'}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [10, 0], ['AC*cosd(A)', 'AC*sind(A)']]
    labels:
      - {at: [-0.5, -0.5], text: 'A'}
      - {at: [10.5, -0.5], text: 'B'}
      - {at: ['AC*cosd(A)', 'AC*sind(A) + 0.6'], text: 'C'}
  solution: |-
    The angles add to $180^\circ$: $({a:coef}x {b:signed}) + ({c:coef}x {d:signed}) + ({e:coef}x {f:signed}) = 180$, so $9x {k:signed} = 180$ and $x =$ **{p}**. Then $m\angle C = {e}({p}) {f:signed} =$ **{C}°** (with $m\angle A = {A}^\circ$, $m\angle B = {B}^\circ$).

- id: geo-ext-angle
  title: Exterior Angle Theorem
  topic: Triangle angle sum
  vars:
    p: {min: 4, max: 25}
    a: {min: 1, max: 4}
    b: {min: -10, max: 30}
    c: {min: 1, max: 4}
    d: {min: -10, max: 30}
    e: {min: 3, max: 9}
  where: ["b != 0", "d != 0", "a*p + b >= 15", "c*p + d >= 15", "a*p + b + c*p + d <= 165", "e != a + c", "a*p + b + c*p + d - e*p != 0"]
  calc:
    R1: a*p + b
    R2: c*p + d
    X: R1 + R2
    f: X - e*p
    adj: 180 - X
    s: a + c
    k: b + d
    lc: e - s
    rc: k - f
    AC: 8*sind(X)/sind(R2)
  prompt: 'An exterior angle of a triangle measures $({e}x {f:signed})^\circ$. Its remote interior angles measure $({a:coef}x {b:signed})^\circ$ and $({c:coef}x {d:signed})^\circ$. Find $x$, the exterior angle, and the interior angle adjacent to it.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: X, label: 'Exterior angle'}
    - {name: adj, label: 'Adjacent interior angle'}
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [8, 0], ['AC*cosd(R1)', 'AC*sind(R1)']]
    segments:
      - {from: [8, 0], to: [12, 0]}
    labels:
      - {at: [9.4, 0.5], text: '({e}x {f:signed})°'}
      - {at: [1.6, 0.4], text: '({a:coef}x {b:signed})°'}
      - {at: ['AC*cosd(R1)', 'AC*sind(R1) + 0.6'], text: '({c:coef}x {d:signed})°'}
  solution: |-
    Exterior Angle Theorem: ${e}x {f:signed} = ({a:coef}x {b:signed}) + ({c:coef}x {d:signed}) = {s}x {k:signed}$. So ${lc:coef}x = {rc}$ and $x =$ **{p}**. The exterior angle is ${R1} + {R2} =$ **{X}°**, and the adjacent interior angle is $180 - {X} =$ **{adj}°**.

- id: geo-cong-x
  title: Corresponding parts of congruent triangles
  topic: Congruent figures
  vars:
    pr: {choices: [{label: 'AB', value: 1}, {label: 'BC', value: 2}, {label: 'AC', value: 3}]}
    a: {min: 2, max: 9}
    c: {min: 1, max: 8}
    p: {min: 2, max: 15}
    b: {min: -12, max: 12}
  where: ["a > c", "b != 0", "a*p + b > 2", "a*p + b - c*p != 0"]
  calc:
    L: a*p + b
    d: L - c*p
    da: a - c
    db: d - b
  prompt: '$\triangle ABC \cong \triangle DEF$. The side of $\triangle ABC$ named {pr} has length ${a}x {b:signed}$, and the corresponding side of $\triangle DEF$ has length ${c:coef}x {d:signed}$. Find $x$ and the length of that side.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: L, label: 'Length'}
  solution: |-
    In $\triangle ABC \cong \triangle DEF$ the letters correspond in order ($A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$), so the matching sides are equal: ${a}x {b:signed} = {c:coef}x {d:signed}$. Then ${da:coef}x = {db}$, so $x =$ **{p}** and the side is ${a}({p}) {b:signed} =$ **{L}**.

- id: geo-cpctc
  title: CPCTC with angles
  topic: CPCTC
  vars:
    p: {min: 3, max: 20}
    a: {min: 2, max: 7}
    c: {min: 1, max: 6}
    b: {min: -15, max: 25}
    B: {min: 20, max: 100}
  where: ["a > c", "b != 0", "a*p + b >= 20", "a*p + b + B <= 165", "a*p + b - c*p != 0"]
  calc:
    A: a*p + b
    d: A - c*p
    F: 180 - A - B
    da: a - c
    db: d - b
  prompt: '$\triangle ABC \cong \triangle DEF$. $m\angle A = ({a}x {b:signed})^\circ$, $m\angle D = ({c:coef}x {d:signed})^\circ$ and $m\angle E = {B}^\circ$. Find $x$ and $m\angle F$.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: F, label: '$m\angle F =$'}
  solution: |-
    $\angle A$ and $\angle D$ correspond, so by CPCTC ${a}x {b:signed} = {c:coef}x {d:signed}$: ${da:coef}x = {db}$ and $x =$ **{p}**, making $m\angle D = {A}^\circ$. In $\triangle DEF$, $m\angle F = 180 - {A} - {B} =$ **{F}°**.

- id: geo-isos-base
  title: Angles of an isosceles triangle
  topic: Isosceles triangles
  vars:
    v: {min: 30, max: 160, step: 2}
  calc:
    base: (180 - v)/2
    h: 5/tand(v/2)
  prompt: 'The vertex angle of an isosceles triangle measures ${v}^\circ$. Find each base angle.'
  answers:
    - {name: base, label: 'Base angle'}
  figure:
    type: shape
    polygons:
      - points: [[-5, 0], [5, 0], [0, h]]
    labels:
      - {at: [0, 'h + 0.6'], text: '{v}°'}
  solution: |-
    The base angles are congruent and share what's left of $180^\circ$: $\dfrac{180 - {v}}{2} =$ **{base}°**.

- id: geo-isos-alg
  title: Isosceles triangle with algebra
  topic: Isosceles triangles
  vars:
    a: {min: 2, max: 8}
    c: {min: 1, max: 7}
    p: {min: 3, max: 20}
    b: {min: -20, max: 30}
  where: ["a > c", "b != 0", "a*p + b >= 15", "a*p + b <= 75", "a*p + b - c*p != 0"]
  calc:
    base: a*p + b
    d: base - c*p
    v: 180 - 2*base
    da: a - c
    db: d - b
    h: 5*tand(base)
  prompt: 'In $\triangle PQR$, $\overline{PQ} \cong \overline{PR}$, $m\angle Q = ({a}x {b:signed})^\circ$ and $m\angle R = ({c:coef}x {d:signed})^\circ$. Find $x$ and $m\angle P$.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: v, label: '$m\angle P =$'}
  figure:
    type: shape
    polygons:
      - points: [[-5, 0], [5, 0], [0, h]]
    labels:
      - {at: [-5.5, -0.5], text: 'Q'}
      - {at: [5.5, -0.5], text: 'R'}
      - {at: [0, 'h + 0.6'], text: 'P'}
  solution: |-
    $\angle Q$ and $\angle R$ are opposite the congruent sides, so they are congruent: ${a}x {b:signed} = {c:coef}x {d:signed}$, giving ${da:coef}x = {db}$ and $x =$ **{p}**. Each base angle is ${base}^\circ$, so $m\angle P = 180 - 2({base}) =$ **{v}°**.

- id: geo-tri-range
  title: Range for the third side
  topic: Triangle inequalities
  vars:
    s1: {min: 3, max: 30}
    s2: {min: 3, max: 30}
  where: ["s1 < s2"]
  calc:
    lo: s2 - s1
    hi: s1 + s2
  prompt: 'Two sides of a triangle measure {s1} and {s2}. The third side $x$ satisfies $L < x < U$. Find $L$ and $U$.'
  answers:
    - {name: lo, label: '$L =$'}
    - {name: hi, label: '$U =$'}
  solution: |-
    By the Triangle Inequality, the third side is less than the sum, ${s1} + {s2} = {hi}$, and more than the difference, ${s2} - {s1} = {lo}$. So **{lo}** $< x <$ **{hi}**.

- id: geo-tri-count
  title: Whole-number third sides
  topic: Triangle inequalities
  vars:
    s1: {min: 2, max: 25}
    s2: {min: 2, max: 25}
  where: ["s1 <= s2"]
  calc:
    lo: s2 - s1
    hi: s1 + s2
    n: hi - lo - 1
    first: lo + 1
    last: hi - 1
  prompt: 'Two sides of a triangle are {s1} and {s2}. How many whole-number lengths are possible for the third side?'
  answers:
    - {name: n, label: 'Number of lengths'}
  solution: |-
    The third side satisfies ${lo} < x < {hi}$. The whole numbers strictly between are ${first}, \ldots, {last}$: that's ${last} - {first} + 1 =$ **{n}** lengths.
