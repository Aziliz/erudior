# Round 2 drills, module geo-m4
- id: geo-m4-r2-isos-ext
  title: Exterior angle at the vertex of an isosceles triangle
  topic: Isosceles triangles
  vars:
    base: {min: 15, max: 80}
  calc:
    ext: 2*base
    vert: 180 - 2*base
  prompt: 'In an isosceles triangle, one leg is extended past the vertex angle. The exterior angle formed there measures ${ext}^\circ$. Find each base angle and the vertex angle, in degrees.'
  answers:
    - {name: base, label: 'Each base angle $=$'}
    - {name: vert, label: 'Vertex angle $=$'}
  solution: |-
    The exterior angle equals the sum of the two remote interior angles, which are the two equal base angles: $2b = {ext}$, so each base angle is $b =$ **{base}°**. The vertex angle forms a linear pair with the exterior angle: $180 - {ext} =$ **{vert}°**. Check: ${base} + {base} + {vert} = 180$.

- id: geo-m4-r2-ssa-count
  title: How many triangles from SSA?
  topic: SSA and congruence
  vars:
    b: {min: 8, max: 20}
    d: {min: 3, max: 19}
    a: {min: 2, max: 26}
  where: ["d < b"]
  calc:
    n: if(a < d, 0, if(a == d, 1, if(a < b, 2, 1)))
  prompt: '$\angle A$ is acute, $AC = {b}$, and $C$ is ${d}$ units from the other side of $\angle A$. How many different triangles $ABC$ have $BC = {a}$? (Count two triangles as the same only if they are congruent.)'
  answers:
    - {name: n, label: 'Number of triangles'}
  solution: |-
    Compare $a = {a}$ with $d = {d}$ and $b = {b}$. If $a < d$ the circle of radius $a$ around $C$ misses the other side: none. If $a = d$ it touches once: one right triangle. If $d < a < b$ it crosses the ray twice: two triangles. If $a \ge b$ the second crossing is at $A$ or behind it: one triangle. Here the answer is **{n}**.

- id: geo-m4-r2-ssa-two
  title: The two SSA triangles
  topic: SSA and congruence
  vars:
    d: {min: 3, max: 15}
    k: {min: 3, max: 15}
    p: {min: 5, max: 30}
  where: ["hypot(d, k) == round(hypot(d, k))", "k < p"]
  calc:
    a: hypot(d, k)
    short: p - k
    long: p + k
  prompt: 'In the SSA construction with an acute $\angle A$, the perpendicular from $C$ to the other side of the angle lands at $F$, with $AF = {p}$ and $CF = {d}$. If $BC = {a}$, find the two possible lengths of $\overline{AB}$.'
  answers:
    - {name: short, label: 'Shorter $AB =$'}
    - {name: long, label: 'Longer $AB =$'}
  solution: |-
    The two possible positions of $B$ are the same distance from $F$, one on each side. By the Pythagorean theorem that distance is $\sqrt{ {a}^2 - {d}^2 } = {k}$. Both lie on the ray because ${k} < {p}$. So $AB = {p} - {k} =$ **{short}** or $AB = {p} + {k} =$ **{long}**.

- id: geo-m4-r2-quad-side
  title: Range for the fourth side of a quadrilateral
  topic: Shortest paths
  vars:
    p: {min: 2, max: 9}
    q: {min: 2, max: 9}
    r: {min: 12, max: 30}
  where: ["r > p + q"]
  calc:
    lo: r - p - q
    hi: p + q + r
  prompt: 'Three sides of a quadrilateral are {p}, {q} and {r}. The fourth side $s$ satisfies $L < s < U$. Find $L$ and $U$.'
  answers:
    - {name: lo, label: '$L =$'}
    - {name: hi, label: '$U =$'}
  solution: |-
    Each side must be shorter than the sum of the other three. If $s$ is longest: $s < {p} + {q} + {r} = {hi}$. If {r} is longest: ${r} < {p} + {q} + s$, so $s > {r} - {p} - {q} = {lo}$. So **{lo}** $< s <$ **{hi}**.

- id: geo-m4-r2-heron
  title: Shortest path by way of a line
  topic: Shortest paths
  vars:
    ya: {min: 1, max: 9}
    yb: {min: 1, max: 9}
    xb: {min: 4, max: 20}
  where: ["ya != yb", "mod(ya*xb, ya + yb) == 0"]
  calc:
    s: ya + yb
    xp: ya*xb/(ya + yb)
    plen: hypot(xb, ya + yb)
  prompt: 'A path starts at $A(0, {ya})$, touches the $x$-axis at a point $P$, and ends at $B({xb}, {yb})$. Find the $x$-coordinate of the point $P$ that makes the path shortest, and the shortest length (to 2 decimal places).'
  answers:
    - {name: xp, label: '$x$-coordinate of $P =$'}
    - {name: plen, label: 'Shortest length $=$', tolerance: 0.01}
  solution: |-
    Reflect $A$ across the $x$-axis to $A'(0, -{ya})$. The best $P$ is where segment $\overline{A'B}$ crosses the axis. That segment rises ${s}$ over a run of ${xb}$, and it must rise ${ya}$ to reach the axis, so $x = {xb} \cdot \dfrac{ {ya} }{ {s} } =$ **{xp}**. The shortest length is $A'B = \sqrt{ {xb}^2 + {s}^2 } \approx$ **{plen:num2}**.
