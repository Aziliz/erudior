# Module 7 drills
- id: geo-arc-length
  title: Arc length
  topic: Arcs and arc length
  vars:
    r: {min: 2, max: 20}
    ang: {min: 10, max: 350, step: 5}
  calc:
    s: ang/360*2*pi*r
    frac: ang/360
  prompt: 'Find the length of an arc of ${ang}^\circ$ in a circle of radius {r}. (Exact, like 6pi, or 2 decimals.)'
  answers:
    - {name: s, label: 'Arc length', tolerance: 0.01}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r}
    segments:
      - {from: [0, 0], to: [r, 0], label: '{r}'}
      - {from: [0, 0], to: ['r*cosd(ang)', 'r*sind(ang)']}
    curves:
      - {x: '1.05*r*cos(t)', y: '1.05*r*sin(t)', t: [0, 'rad(ang)']}
  solution: |-
    The arc is $\tfrac{{ang}}{360}$ of the circumference $2\pi({r})$: $\dfrac{{ang}}{360} \cdot 2\pi \cdot {r} \approx$ **{s:num2}**.

- id: geo-arc-measure
  title: Arc measures
  topic: Arcs and arc length
  vars:
    t: {min: 20, max: 170}
  calc:
    major: 360 - t
    other: 180 - t
  prompt: 'In $\odot O$, $\overline{AC}$ is a diameter and $m\angle AOB = {t}^\circ$. Find $m\overset{\frown}{AB}$, $m\overset{\frown}{BC}$ and the major arc $m\overset{\frown}{ACB}$.'
  answers:
    - {name: t, label: '$m\overset{\frown}{AB} =$'}
    - {name: other, label: '$m\overset{\frown}{BC} =$'}
    - {name: major, label: '$m\overset{\frown}{ACB} =$'}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: 5}
    segments:
      - {from: [-5, 0], to: [5, 0]}
      - {from: [0, 0], to: ['5*cosd(180 - t)', '5*sind(180 - t)']}
    points:
      - {at: [-5, 0], label: 'A'}
      - {at: [5, 0], label: 'C'}
      - {at: ['5*cosd(180 - t)', '5*sind(180 - t)'], label: 'B'}
      - {at: [0, 0], label: 'O'}
  solution: |-
    A minor arc equals its central angle: $m\overset{\frown}{AB} =$ **{t}°**. $\overset{\frown}{ABC}$ is a semicircle, so $m\overset{\frown}{BC} = 180 - {t} =$ **{other}°**. The major arc $\overset{\frown}{ACB}$ is the rest of the circle: $360 - {t} =$ **{major}°**.

- id: geo-radians
  title: Degrees and radians
  topic: Arcs and arc length
  vars:
    d: {choices: [15, 20, 30, 36, 40, 45, 60, 72, 90, 120, 135, 150, 180, 210, 225, 240, 270, 300, 315, 330]}
  calc:
    r: d*pi/180
    num: d/gcd(d, 180)
    den: 180/gcd(d, 180)
  prompt: 'Convert ${d}^\circ$ to radians. (Exact, like 3pi/4, or 4 decimals.)'
  answers:
    - {name: r, label: 'Radians', tolerance: 0.0001, format: num4}
  solution: |-
    Multiply by $\tfrac{\pi}{180}$: ${d} \cdot \dfrac{\pi}{180} = \dfrac{{num}\pi}{{den}} \approx$ **{r:num4}**.

- id: geo-chord-dist
  title: Chord, radius and distance from center
  topic: Chords
  vars:
    hc: {min: 3, max: 15}
    dd: {min: 2, max: 15}
  calc:
    chord: 2*hc
    r2: hc^2 + dd^2
    r: sqrt(r2)
  prompt: 'A chord of length {chord} is {dd} units from the center of a circle. Find the radius (exact or 2 decimals).'
  answers:
    - {name: r, label: 'Radius', tolerance: 0.01}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r}
    segments:
      - {from: ['-hc', '-dd'], to: [hc, '-dd'], label: '{chord}'}
      - {from: [0, 0], to: [0, '-dd'], dashed: true, label: '{dd}'}
      - {from: [0, 0], to: [hc, '-dd'], dashed: true, label: 'r'}
    rightAngles:
      - [[0, '-dd'], [hc, '-dd'], [0, 0]]
  solution: |-
    The perpendicular from the center bisects the chord, so half the chord is {hc}. The radius is the hypotenuse: $r = \sqrt{{hc}^2 + {dd}^2} = \sqrt{{r2}} \approx$ **{r:num2}**.

- id: geo-tangent-len
  title: Tangent length
  topic: Tangents
  vars:
    r: {min: 2, max: 15}
    t: {min: 3, max: 20}
  calc:
    d2: r^2 + t^2
    d: sqrt(d2)
  prompt: '$\overline{PT}$ is tangent to $\odot O$ at $T$. The radius is {r} and $PT = {t}$. Find $PO$ (exact or 2 decimals).'
  answers:
    - {name: d, label: '$PO =$', tolerance: 0.01}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r}
    segments:
      - {from: [0, 0], to: [0, r], label: '{r}'}
      - {from: [0, r], to: [t, r], label: '{t}'}
      - {from: [0, 0], to: [t, r], dashed: true}
    rightAngles:
      - [[0, r], [0, 0], [t, r]]
    points:
      - {at: [0, 0], label: 'O'}
      - {at: [0, r], label: 'T'}
      - {at: [t, r], label: 'P'}
  solution: |-
    A tangent is perpendicular to the radius at the point of tangency, so $\triangle OTP$ has a right angle at $T$ and $PO$ is the hypotenuse: $\sqrt{{r}^2 + {t}^2} = \sqrt{{d2}} \approx$ **{d:num2}**.

- id: geo-tangent-radius
  title: Radius from a tangent
  topic: Tangents
  vars:
    r: {min: 2, max: 15}
    t: {min: 3, max: 20}
  calc:
    d: sqrt(r^2 + t^2)
    d2: r^2 + t^2
  prompt: '$\overline{PT}$ is tangent to $\odot O$ at $T$, with $PT = {t}$ and $PO = \sqrt{{d2}}$. Find the radius.'
  answers:
    - {name: r, label: 'Radius'}
  solution: |-
    $\angle OTP = 90^\circ$, so $r^2 + {t}^2 = {d2}$, giving $r^2 = {d2} - {t}^2$ and $r =$ **{r}**.

- id: geo-inscribed
  title: Inscribed angles
  topic: Inscribed angles
  vars:
    a: {min: 20, max: 170, step: 2}
    mode: {choices: [{label: 'the intercepted arc measures', value: 1}, {label: 'the inscribed angle measures', value: 2}]}
  calc:
    ang: a/2
    given: if(mode == 1, a, ang)
    ans: if(mode == 1, ang, a)
  prompt: 'An inscribed angle intercepts an arc. If {mode} ${given}^\circ$, find the other measure (the angle if the arc is given, the arc if the angle is given).'
  answers:
    - {name: ans, label: 'Answer (degrees)'}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: 5}
    segments:
      - {from: [-5, 0], to: ['5*cosd(a/2)', '5*sind(a/2)']}
      - {from: [-5, 0], to: ['5*cosd(a/2)', '-5*sind(a/2)']}
    points:
      - {at: [-5, 0]}
      - {at: ['5*cosd(a/2)', '5*sind(a/2)']}
      - {at: ['5*cosd(a/2)', '-5*sind(a/2)']}
  solution: |-
    An inscribed angle is half its intercepted arc. Here the arc is ${a}^\circ$ and the angle is ${ang}^\circ$, so the answer is **{ans}°**.

- id: geo-secant-angle
  title: Angles from chords and secants
  topic: Angles from secants and tangents
  vars:
    big: {min: 60, max: 200, step: 2}
    small: {min: 10, max: 100, step: 2}
    loc: {choices: [{label: 'two chords intersecting inside the circle', value: 1}, {label: 'two secants meeting outside the circle', value: 2}]}
  where: ["small < big", "big + small < 360"]
  calc:
    ans: if(loc == 1, (big + small)/2, (big - small)/2)
    sm: big + small
    df: big - small
  prompt: 'An angle is formed by {loc}. The arcs it (and, for chords, its vertical angle) intercepts measure ${big}^\circ$ and ${small}^\circ$. Find the angle.'
  answers:
    - {name: ans, label: 'Angle (degrees)'}
  solution: |-
    Vertex inside: half the sum, $\tfrac12({big} + {small}) = \tfrac12({sm})$. Vertex outside: half the difference, $\tfrac12({big} - {small}) = \tfrac12({df})$. For {loc}, the angle is **{ans}°**.

- id: geo-cyclic-quad
  title: Inscribed quadrilateral
  topic: Inscribed angles
  vars:
    a: {min: 2, max: 7}
    c: {min: 1, max: 7}
    p: {min: 5, max: 25}
    b: {min: -20, max: 30}
    Bq: {min: 50, max: 130}
  where: ["b != 0", "a*p + b >= 40", "a*p + b <= 140", "180 - a*p - b - c*p != 0"]
  calc:
    A: a*p + b
    C: 180 - A
    d: C - c*p
    D: 180 - Bq
    s: a + c
    k: b + d
  prompt: 'Quadrilateral $ABCD$ is inscribed in a circle. $m\angle A = ({a}x {b:signed})^\circ$, $m\angle C = ({c:coef}x {d:signed})^\circ$ and $m\angle B = {Bq}^\circ$. Find $x$, $m\angle A$ and $m\angle D$.'
  answers:
    - {name: p, label: '$x =$'}
    - {name: A, label: '$m\angle A =$'}
    - {name: D, label: '$m\angle D =$'}
  solution: |-
    Opposite angles of an inscribed quadrilateral are supplementary: ${s}x {k:signed} = 180$, so $x =$ **{p}** and $m\angle A =$ **{A}°** (with $m\angle C = {C}^\circ$). Also $m\angle D = 180 - {Bq} =$ **{D}°**.

- id: geo-chord-chord
  title: Intersecting chords
  topic: Segment lengths in circles
  vars:
    a: {min: 2, max: 15}
    b: {min: 2, max: 15}
    c: {min: 2, max: 15}
  where: ["mod(a*b, c) == 0", "c != a", "c != b"]
  calc:
    x: a*b/c
    ab: a*b
  prompt: 'Two chords intersect inside a circle. One is cut into pieces {a} and {b}. The other has one piece {c}. Find its other piece.'
  answers:
    - {name: x, label: 'Other piece'}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: 5}
    segments:
      - {from: [-5, 0], to: [4, 3]}
      - {from: [-3, 4], to: [3, -4]}
  solution: |-
    The products of the pieces are equal: ${a} \cdot {b} = {c} \cdot x$, so ${ab} = {c}x$ and $x =$ **{x}**.

- id: geo-secant-secant
  title: Secant and tangent segments
  topic: Segment lengths in circles
  vars:
    o1: {min: 2, max: 12}
    i1: {min: 2, max: 20}
    o2: {min: 2, max: 15}
  where: ["mod(o1*(o1 + i1), o2) == 0", "o2 != o1", "o1*(o1 + i1)/o2 > o2", "o1*(o1 + i1)/o2 <= 60"]
  calc:
    w1: o1 + i1
    pw: o1*w1
    w2: pw/o2
    i2: w2 - o2
    t: sqrt(pw)
  prompt: 'From point $P$ outside a circle, secant 1 has external segment {o1} and an internal chord of {i1}. Secant 2 has external segment {o2}. Find the internal chord of secant 2, and the length of a tangent segment from $P$ (2 decimals if needed).'
  answers:
    - {name: i2, label: 'Chord of secant 2'}
    - {name: t, label: 'Tangent', tolerance: 0.01}
  solution: |-
    Outside · whole is the same for every line from $P$: ${o1} \cdot {w1} = {pw}$. For secant 2, ${o2} \cdot w = {pw}$ gives $w = {w2}$, so its chord is ${w2} - {o2} =$ **{i2}**. For a tangent, $t^2 = {pw}$, so $t = \sqrt{{pw}} \approx$ **{t:num2}**.

- id: geo-circle-eq
  title: Center and radius by completing the square
  topic: Equation of a circle
  vars:
    h: {min: -8, max: 8}
    k: {min: -8, max: 8}
    r: {min: 1, max: 9}
  where: ["h != 0", "k != 0", "h^2 + k^2 != r^2"]
  calc:
    D: -2*h
    E: -2*k
    F: h^2 + k^2 - r^2
    r2: r^2
    hh: h^2
    kk: k^2
    nF: -F
  prompt: 'Find the center $(h, k)$ and radius $r$ of the circle $x^2 + y^2 {D:signedcoef}x {E:signedcoef}y {F:signed} = 0$.'
  answers:
    - {name: h, label: '$h =$'}
    - {name: k, label: '$k =$'}
    - {name: r, label: '$r =$'}
  solution: |-
    Complete the square: add $\left(\tfrac{{D}}{2}\right)^2 = {hh}$ and $\left(\tfrac{{E}}{2}\right)^2 = {kk}$ to both sides of $x^2 {D:signedcoef}x + y^2 {E:signedcoef}y = {nF}$. That gives $(x - ({h}))^2 + (y - ({k}))^2 = {r2}$, so the center is **({h}, {k})** and the radius is $\sqrt{{r2}} =$ **{r}**.
