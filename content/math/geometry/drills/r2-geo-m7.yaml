# Round 2 drills for geo-m7 (honors lessons 30h1 and 30h2)
- id: geo-m7-r2-power
  title: Power of a point and tangent length
  topic: Power of a point
  vars:
    h: {min: -6, max: 6}
    k: {min: -6, max: 6}
    r: {min: 2, max: 8}
    px: {min: -9, max: 9}
    py: {min: -9, max: 9}
  where: ["h != 0", "k != 0", "h^2 + k^2 != r^2", "(px - h)^2 + (py - k)^2 > r^2", "px != 0", "py != 0"]
  calc:
    D: -2*h
    E: -2*k
    F: h^2 + k^2 - r^2
    pw: px^2 + py^2 + D*px + E*py + F
    t: sqrt(pw)
    d2: (px - h)^2 + (py - k)^2
    r2: r^2
  prompt: 'Find the power of $P({px}, {py})$ with respect to the circle $x^2 + y^2 {D:signedcoef}x {E:signedcoef}y {F:signed} = 0$, and the length of a tangent segment from $P$ (exact, like sqrt(20), or 2 decimals).'
  answers:
    - {name: pw, label: 'Power'}
    - {name: t, label: 'Tangent length', tolerance: 0.01}
  solution: |-
    Substitute $P$ into the left side: $({px})^2 + ({py})^2 + ({D})({px}) + ({E})({py}) + ({F}) =$ **{pw}**. It's positive, so $P$ is outside, and the tangent length is $\sqrt{{pw}} \approx$ **{t:num2}**. (Check: the center is $({h}, {k})$ and $r^2 = {r2}$; $P$'s squared distance from the center is ${d2}$, and ${d2} - {r2} = {pw}$.)

- id: geo-m7-r2-radical-axis
  title: Radical axis and common chord
  topic: Radical axis
  vars:
    dd: {min: 3, max: 12}
    r1: {min: 2, max: 9}
    r2: {min: 2, max: 9}
  where: ["abs(r1 - r2) < dd", "dd < r1 + r2", "dd^2 - r2^2 != 0"]
  calc:
    r1sq: r1^2
    r2sq: r2^2
    d2: 2*dd
    k2: dd^2 - r2^2
    num: dd^2 + r1^2 - r2^2
    c: num/(2*dd)
    half: sqrt(r1^2 - c^2)
    chord: 2*half
  prompt: 'The circles $x^2 + y^2 = {r1sq}$ and $(x - {dd})^2 + y^2 = {r2sq}$ cross at two points. Their radical axis is a vertical line $x = c$. Find $c$ and the length of the common chord (exact or 2 decimals).'
  answers:
    - {name: c, label: '$c =$', tolerance: 0.01}
    - {name: chord, label: 'Common chord', tolerance: 0.01}
  figure:
    type: shape
    circles:
      - {center: [0, 0], r: r1}
      - {center: [dd, 0], r: r2}
    segments:
      - {from: [c, '-half'], to: [c, half]}
    points:
      - {at: [0, 0]}
      - {at: [dd, 0]}
  solution: |-
    General forms: $x^2 + y^2 - {r1sq} = 0$ and $x^2 + y^2 - {d2}x {k2:signed} = 0$. Subtracting the second from the first cancels $x^2$ and $y^2$: ${d2}x = {num}$, so $c = \dfrac{{num}}{{d2}} \approx$ **{c:num2}**. On that line the first circle gives $y^2 = {r1sq} - c^2$, so $y = \pm\sqrt{{r1sq} - c^2} \approx \pm{half:num4}$, and the common chord is $2\sqrt{{r1sq} - c^2} \approx$ **{chord:num2}**.

- id: geo-m7-r2-circumradius
  title: Circumradius from the Law of Sines
  topic: Circumradius
  vars:
    side: {min: 4, max: 30}
    angA: {min: 20, max: 140, step: 5}
    angB: {min: 20, max: 140, step: 5}
  where: ["angA + angB <= 160", "angA != 90", "angA != angB"]
  calc:
    twoR: side/sind(angA)
    R: twoR/2
    b: twoR*sind(angB)
  prompt: 'In $\triangle ABC$, side $a = {side}$, $m\angle A = {angA}^\circ$ and $m\angle B = {angB}^\circ$. Find the circumradius $R$ and side $b$ (2 decimals).'
  answers:
    - {name: R, label: '$R =$', tolerance: 0.01}
    - {name: b, label: '$b =$', tolerance: 0.02}
  solution: |-
    Extended Law of Sines: $2R = \dfrac{a}{\sin A} = \dfrac{{side}}{\sin {angA}^\circ} \approx {twoR:num4}$, so $R \approx$ **{R:num2}**. Then $b = 2R\sin B \approx {twoR:num4} \cdot \sin {angB}^\circ \approx$ **{b:num2}**. (Keep $2R$ unrounded until the end.)

- id: geo-m7-r2-isosceles-circumradius
  title: Circumradius of an isosceles triangle
  topic: Circumradius
  vars:
    m: {min: 2, max: 12}
    hh: {min: 2, max: 15}
  calc:
    base: 2*m
    l2: m^2 + hh^2
    leg: sqrt(l2)
    K: m*hh
    h2: 2*hh
    R: l2/(2*hh)
    cy: hh - R
  prompt: 'An isosceles triangle has base {base} and height {hh} to that base. Find the radius of its circumscribed circle (exact fraction or 2 decimals).'
  answers:
    - {name: R, label: '$R =$', tolerance: 0.01}
  figure:
    type: shape
    polygons:
      - {points: [['-m', 0], [m, 0], [0, hh]]}
    circles:
      - {center: [0, cy], r: R}
    segments:
      - {from: [0, 0], to: [0, hh], dashed: true, label: '{hh}'}
  solution: |-
    The height bisects the base, so each leg is $\sqrt{{m}^2 + {hh}^2} = \sqrt{{l2}}$. The area is $K = \tfrac12 \cdot {base} \cdot {hh} = {K}$. Then $R = \dfrac{abc}{4K} = \dfrac{\sqrt{{l2}} \cdot \sqrt{{l2}} \cdot {base}}{4 \cdot {K}} = \dfrac{{l2}}{{h2}} \approx$ **{R:num2}**.

- id: geo-m7-r2-circle-3-points
  title: The circle through three points
  topic: Concyclic points
  vars:
    h: {min: -6, max: 6}
    k: {min: -6, max: 6}
    sc: {min: 1, max: 3}
  where: ["h != 0", "k != 0", "h^2 + k^2 != 25*sc^2"]
  calc:
    x1: h + 3*sc
    y1: k + 4*sc
    x2: h - 4*sc
    y2: k + 3*sc
    x3: h + 4*sc
    y3: k - 3*sc
    r: 5*sc
    r2: 25*sc^2
    D: -2*h
    E: -2*k
    F: h^2 + k^2 - 25*sc^2
    nh: -h
    nk: -k
  prompt: 'Find the center $(h, k)$ and radius $r$ of the circle through $({x1}, {y1})$, $({x2}, {y2})$ and $({x3}, {y3})$.'
  answers:
    - {name: h, label: '$h =$'}
    - {name: k, label: '$k =$'}
    - {name: r, label: '$r =$'}
  solution: |-
    Substitute each point into $x^2 + y^2 + Dx + Ey + F = 0$. Subtracting the equations in pairs cancels $F$ and leaves two linear equations in $D$ and $E$; solving gives $D = {D}$ and $E = {E}$, and then any one equation gives $F = {F}$. So the circle is $x^2 + y^2 {D:signedcoef}x {E:signedcoef}y {F:signed} = 0$. Completing the square: $(x {nh:signed})^2 + (y {nk:signed})^2 = {r2}$. Center **({h}, {k})**, radius $\sqrt{{r2}} =$ **{r}**. (Or intersect the perpendicular bisectors of two of the segments, as in Lesson 15.)
