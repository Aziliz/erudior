# Round 2 drills for geo-m8 (honors lessons 34h1-34h3)
- id: geo-m8-r2-vef-family
  title: Vertices, edges and faces of prisms, pyramids and bipyramids
  topic: Polyhedra
  vars:
    n: {min: 3, max: 12}
    kind:
      choices:
        - {label: prism, value: 1}
        - {label: pyramid, value: 2}
        - {label: bipyramid, value: 3}
  calc:
    V: if(kind == 1, 2*n, if(kind == 2, n + 1, n + 2))
    E: if(kind == 2, 2*n, 3*n)
    F: if(kind == 1, n + 2, if(kind == 2, n + 1, 2*n))
  prompt: 'Count the vertices, edges and faces of a {kind} whose base is a polygon with {n} sides. (A bipyramid is two pyramids glued base to base.)'
  answers:
    - {name: V, label: '$V =$'}
    - {name: E, label: '$E =$'}
    - {name: F, label: '$F =$'}
  solution: |-
    For a base with $n$ sides: a prism has $V = 2n$, $E = 3n$, $F = n + 2$ (two copies of the base, joined by $n$ side faces); a pyramid has $V = n + 1$, $E = 2n$, $F = n + 1$ (the base plus an apex); a bipyramid has $V = n + 2$, $E = 3n$, $F = 2n$ (two apexes, $n$ triangles on each side). Here the {kind} has $V =$ **{V}**, $E =$ **{E}** and $F =$ **{F}**. Check with Euler's formula: ${V} - {E} + {F} = 2$.

- id: geo-m8-r2-angle-defect
  title: Angle defect and the number of vertices
  topic: Polyhedra
  vars:
    config:
      choices:
        - {label: 'an equilateral triangle and two regular hexagons', value: 300}
        - {label: 'an equilateral triangle and two regular octagons', value: 330}
        - {label: 'a square and two regular hexagons', value: 330}
        - {label: 'a regular pentagon and two regular hexagons', value: 348}
        - {label: 'an equilateral triangle and two regular decagons', value: 348}
        - {label: 'two equilateral triangles and two squares', value: 300}
        - {label: 'two equilateral triangles and two regular pentagons', value: 336}
        - {label: 'an equilateral triangle and three squares', value: 330}
        - {label: 'a square, a regular hexagon and a regular octagon', value: 345}
        - {label: 'a square, a regular hexagon and a regular decagon', value: 354}
        - {label: 'four equilateral triangles and a square', value: 330}
        - {label: 'four equilateral triangles and a regular pentagon', value: 348}
        - {label: 'two squares and a regular pentagon', value: 288}
        - {label: 'two squares and a regular hexagon', value: 300}
  calc:
    angsum: config
    d: 360 - config
    V: 720/d
  prompt: 'Every vertex of a convex polyhedron looks the same: {config} meet there. Find the angle defect at each vertex (in degrees) and the number of vertices.'
  answers:
    - {name: d, label: 'Defect (°)'}
    - {name: V, label: 'Vertices'}
  solution: |-
    Interior angles: triangle $60^\circ$, square $90^\circ$, pentagon $108^\circ$, hexagon $120^\circ$, octagon $135^\circ$, decagon $144^\circ$. The angles at each vertex add to ${angsum}^\circ$, so the defect is $360^\circ - {angsum}^\circ =$ **{d}°**. By Descartes' theorem all the defects add to $720^\circ$, so there are $720 \div {d} =$ **{V}** vertices.

- id: geo-m8-r2-frustum-volume
  title: Volume of a frustum of a cone
  topic: Frustums and caps
  vars:
    R: {min: 4, max: 20}
    r: {min: 1, max: 19}
    h: {min: 3, max: 30}
  where: ["r < R", "mod(h*(R^2 + R*r + r^2), 3) == 0"]
  calc:
    S3: R^2 + R*r + r^2
    k: h*S3/3
    V: pi*k
    R2: R^2
    Rr: R*r
    r2: r^2
  prompt: 'A frustum of a cone has bottom radius {R}, top radius {r} and height {h}. Find its volume (exact, like 3800pi, or to 2 decimal places).'
  answers:
    - {name: V, label: 'Volume', tolerance: 0.01, format: dp2}
  figure:
    type: shape
    polygons:
      - points: [['-R', 0], [R, 0], [r, h], ['-r', h]]
    segments:
      - {from: [0, 0], to: [0, h], dashed: true, label: '{h}'}
      - {from: [0, 0], to: [R, 0], label: '{R}'}
      - {from: [0, h], to: [r, h], label: '{r}'}
  solution: |-
    $V = \dfrac{\pi h}{3}\left(R^2 + Rr + r^2\right) = \dfrac{\pi \cdot {h}}{3}\left({R2:dp0} + {Rr:dp0} + {r2:dp0}\right) = \dfrac{{h} \cdot {S3:dp0}}{3}\pi = {k:dp0}\pi \approx$ **{V:num2}**.

- id: geo-m8-r2-cap-volume
  title: Volume and curved area of a spherical cap
  topic: Frustums and caps
  vars:
    R: {min: 3, max: 20}
    h: {min: 1, max: 39}
  where: ["h < 2*R", "mod(h^2*(3*R - h), 3) == 0"]
  calc:
    k: h^2*(3*R - h)/3
    V: pi*k
    kS: 2*R*h
    S: pi*kS
    h2: h^2
    t: 3*R - h
  prompt: 'A plane cuts a cap of height {h} from a sphere of radius {R}. Find the cap''s volume and the area of its curved surface (exact, like 48pi, or to 2 decimal places).'
  answers:
    - {name: V, label: 'Volume', tolerance: 0.01}
    - {name: S, label: 'Curved area', tolerance: 0.01}
  solution: |-
    Volume: $V = \dfrac{\pi h^2}{3}(3R - h) = \dfrac{\pi \cdot {h2:dp0}}{3}({t:dp0}) = {k:dp0}\pi \approx$ **{V:num2}**.
    Curved area (Archimedes' hat-box theorem): $S = 2\pi R h = 2\pi \cdot {R} \cdot {h} = {kS:dp0}\pi \approx$ **{S:num2}**.

- id: geo-m8-r2-torus
  title: Volume and surface area of a torus (Pappus)
  topic: Pappus's theorem
  vars:
    R: {min: 3, max: 15}
    r: {min: 1, max: 14}
  where: ["r < R", "r != 2"]
  calc:
    V: 2*pi^2*R*r^2
    S: 4*pi^2*R*r
    kV: 2*R*r^2
    kS: 4*R*r
    r2: r^2
  prompt: 'A circle of radius {r} is spun around an axis in its plane, {R} units from its center. Find the volume and surface area of the torus it sweeps out (to 2 decimal places).'
  answers:
    - {name: V, label: 'Volume', tolerance: 0.01}
    - {name: S, label: 'Surface area', tolerance: 0.01}
  solution: |-
    The centroid (the circle's center) travels $2\pi \cdot {R}$. Volume $=$ area × distance $= \pi \cdot {r2} \cdot 2\pi \cdot {R} = {kV:dp0}\pi^2 \approx$ **{V:num2}**. Surface area $=$ circumference × distance $= 2\pi \cdot {r} \cdot 2\pi \cdot {R} = {kS:dp0}\pi^2 \approx$ **{S:num2}**.

- id: geo-m8-r2-fence-wall
  title: Largest pen against a wall
  topic: Optimal shapes
  vars:
    P: {min: 20, max: 400, step: 4}
  calc:
    W: P/4
    L: P/2
    A: P^2/8
  prompt: 'You have {P} m of fence for a rectangular pen against a long straight wall, so only three sides need fence. Find the width (each side touching the wall), the length (the side parallel to the wall) and the largest possible area.'
  answers:
    - {name: W, label: 'Width (m)'}
    - {name: L, label: 'Length (m)'}
    - {name: A, label: 'Area (m²)'}
  solution: |-
    With width $W$ and length $L$, the fence gives $L + 2W = {P:dp0}$. By AM–GM the product $L \cdot 2W$ is largest when $L = 2W$, so $4W = {P:dp0}$: $W =$ **{W}** m and $L =$ **{L}** m. Area $= {L:dp0} \times {W:dp0} =$ **{A}** m².

- id: geo-m8-r2-ngon-perimeter
  title: Regular polygon with a given perimeter
  topic: Optimal shapes
  vars:
    n: {choices: [3, 4, 5, 6, 8, 10, 12]}
    P: {min: 6, max: 120, step: 6}
  calc:
    s: P/n
    half: 180/n
    A: P^2/(4*n*tand(half))
    Q: pi/(n*tand(half))
    Acirc: P^2/(4*pi)
  prompt: 'A regular {n}-gon has perimeter {P}. Find its area (to 2 decimal places) and its isoperimetric quotient $Q = \dfrac{4\pi A}{P^2}$ (to 3 decimal places).'
  answers:
    - {name: A, label: 'Area', tolerance: 0.01}
    - {name: Q, label: '$Q =$', tolerance: 0.0006}
  solution: |-
    Each side is $\tfrac{{P}}{{n}}$ and the apothem is $\dfrac{s/2}{\tan(180^\circ/n)}$, so $A = \dfrac{P^2}{4n\tan(180^\circ/n)} = \dfrac{{P}^2}{4 \cdot {n} \cdot \tan {half:num2}^\circ} \approx$ **{A:num2}**. Then $Q = \dfrac{4\pi A}{P^2} = \dfrac{\pi}{{n}\tan {half:num2}^\circ} \approx$ **{Q:dp3}**. (A circle with the same perimeter would enclose $\tfrac{P^2}{4\pi} \approx {Acirc:dp2}$, with $Q = 1$.)

- id: geo-m8-r2-best-can
  title: The can that uses the least metal
  topic: Optimal shapes
  vars:
    V: {min: 100, max: 2000, step: 50}
  calc:
    r: cbrt(V/(2*pi))
    h: 2*r
    S: 6*pi*r^2
  prompt: 'A closed cylindrical can must hold {V} cm³. Find the radius and height that use the least metal (to 2 decimal places), and that least surface area (to the nearest whole cm²).'
  answers:
    - {name: r, label: 'Radius (cm)', tolerance: 0.01}
    - {name: h, label: 'Height (cm)', tolerance: 0.011}
    - {name: S, label: 'Surface area (cm²)', relTolerance: 0.01}
  solution: |-
    The best can has $h = 2r$, so $V = \pi r^2 h = 2\pi r^3$: $r = \sqrt[3]{\dfrac{{V:dp0}}{2\pi}} \approx$ **{r:num2}** cm and $h = 2r \approx$ **{h:num2}** cm. Then $S = 2\pi r^2 + 2\pi r h = 6\pi r^2 \approx$ **{S:num2}** cm², about {S:dp0} cm².
