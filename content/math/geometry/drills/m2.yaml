# Module 2 drills
- id: geo-pattern-lines
  title: Lines through n points
  topic: Inductive reasoning
  vars:
    n: {min: 5, max: 30}
  calc:
    L: n*(n - 1)/2
    n1: n - 1
  prompt: 'With 2, 3, 4 and 5 points (no three collinear) there are 1, 3, 6 and 10 lines through pairs of points. How many lines pass through pairs of {n} such points?'
  answers:
    - {name: L, label: 'Lines'}
  solution: |-
    Each point pairs with the other {n1} points, giving ${n} \cdot {n1}$ ordered pairs, but each line is counted twice (once from each end). So there are $\dfrac{{n} \cdot {n1}}{2} =$ **{L}** lines.

- id: geo-seq-term
  title: Extend a pattern
  topic: Inductive reasoning
  vars:
    a: {min: -10, max: 15}
    d: {min: 2, max: 9}
    k: {min: 15, max: 60}
  calc:
    t2: a + d
    t3: a + 2*d
    t4: a + 3*d
    tk: a + (k - 1)*d
    k1: k - 1
  prompt: 'The pattern {a}, {t2}, {t3}, {t4}, … continues the same way. Find term number {k}.'
  answers:
    - {name: tk, label: 'Term'}
  solution: |-
    Each term adds {d}. Term $n$ is $a_1 + (n - 1)d$, so term {k} is ${a} + {k1} \cdot {d} =$ **{tk}**.

- id: geo-alg-proof
  title: Solve the equation in an algebraic proof
  topic: Algebraic proof
  vars:
    a: {min: 2, max: 7}
    b: {min: -9, max: 9}
    c: {min: 1, max: 9}
    x: {min: -6, max: 12}
  where: ["a != c", "b != 0", "a*(x + b) - c*x != 0"]
  calc:
    d: a*(x + b) - c*x
    ab: a*b
    lc: a - c
    rc: d - ab
  prompt: 'Solve ${a}(x {b:signed}) = {c:coef}x {d:signed}$. (In a two-column proof, each step would be justified by a property of equality.)'
  answers:
    - {name: x, label: '$x =$'}
  solution: |-
    Distributive property: ${a}x {ab:signed} = {c:coef}x {d:signed}$. Subtraction and addition properties (collect $x$-terms left, numbers right): ${lc:coef}x = {rc}$. Division property: $x =$ **{x}**.
