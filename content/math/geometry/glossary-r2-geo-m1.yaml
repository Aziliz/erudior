# Round 2, module geo-m1: terms from the honors lessons
- term: betweenness
  definition: 'The relation "$B$ is between $A$ and $C$": the three points are distinct and collinear and $AB + BC = AC$. On a number line, $B$''s coordinate lies between the other two.'
  topic: Betweenness and convexity
- term: convex set
  aliases: [convex sets]
  definition: 'A set of points that contains the whole segment joining any two of its points, such as a segment, a ray, a half-plane or a disk (but not a circle curve).'
  topic: Betweenness and convexity
- term: Plane Separation Postulate
  definition: 'A line in a plane divides the other points of the plane into two convex half-planes, and a segment joining points in different half-planes meets the line.'
  topic: Plane separation
- term: half-planes
  aliases: [half-plane, half plane, half planes]
  definition: 'Either of the two regions into which a line divides a plane; the line is its edge and is not part of it.'
  topic: Plane separation
- term: half-spaces
  aliases: [half-space, half space, half spaces]
  definition: 'Either of the two regions into which a plane divides space; the plane itself is not part of it.'
  topic: Plane separation
- term: interior of an angle
  definition: 'For $\angle ABC$, the points on the same side of $\overleftrightarrow{BA}$ as $C$ and on the same side of $\overleftrightarrow{BC}$ as $A$; an intersection of two half-planes.'
  topic: Plane separation
- term: exterior of an angle
  definition: 'The points of the plane that are neither on the angle nor in its interior.'
  topic: Plane separation
- term: interior of a triangle
  definition: 'The points inside a triangle: the intersection of the three half-planes that each have one side''s line as edge and contain the opposite vertex.'
  topic: Plane separation
- term: Pasch's axiom
  aliases: [Pasch's theorem]
  definition: 'If a line in the plane of a triangle crosses one side between its endpoints and passes through no vertex, it crosses exactly one of the other two sides (Moritz Pasch, 1882).'
  topic: Plane separation
- term: Crossbar Theorem
  definition: 'If $D$ is in the interior of $\angle BAC$, then ray $\overrightarrow{AD}$ meets segment $\overline{BC}$.'
  topic: Plane separation
- term: combination
  aliases: [combinations, binomial coefficient, n choose k]
  definition: 'A choice of $k$ objects from $n$ where order does not matter; there are $\binom{n}{k}$ of them, for example $\binom{n}{2} = \tfrac{n(n-1)}{2}$.'
  topic: Counting lines and planes
- term: general position
  definition: 'Lines in a plane are in general position when no two are parallel and no three pass through one point.'
  topic: Counting regions and angles
- term: recurrence
  aliases: [recurrence relation, recursive formula]
  definition: 'A rule that gives each term of a sequence from earlier terms, such as $R(k) = R(k-1) + k$ for regions made by lines.'
  topic: Counting regions and angles
- term: bounded regions
  aliases: [bounded region]
  definition: 'Regions that are completely enclosed and have finite area; $n$ lines in general position make $\binom{n-1}{2}$ of them.'
  topic: Counting regions and angles
- term: unbounded regions
  aliases: [unbounded region]
  definition: 'Regions that stretch off without end; $n$ lines in general position make $2n$ of them.'
  topic: Counting regions and angles
- term: Moser's circle problem
  definition: 'Count the regions made inside a circle by all chords joining $n$ points on it (no three chords through one point): $1 + \binom{n}{2} + \binom{n}{4}$, giving 1, 2, 4, 8, 16, 31, …'
  topic: Counting regions and angles
