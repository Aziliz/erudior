- id: geo-m5-r2-h34
  lesson: geo-m5-h-tilings
  type: order
  topic: Turning and star polygons
  stem: 'Put these star polygons in order from the smallest tip angle to the largest.'
  items: ['$\{7/3\}$', '$\{5/2\}$', '$\{8/3\}$', '$\{7/2\}$']
  explanation: |-
    Tip angle $180 - \tfrac{360k}{n}$: $\{7/3\}$ about $25.71^\circ$, $\{5/2\}$ $36^\circ$, $\{8/3\}$ $45^\circ$, $\{7/2\}$ about $77.14^\circ$.
- id: geo-m5-r2-h35
  lesson: geo-m5-h-tilings
  type: match
  topic: Tilings
  stem: 'Match each vertex type to what is true of it.'
  pairs:
    - ['3.7.42', Fits around a point but appears in no tiling]
    - ['4.8.8', A semiregular tiling]
    - ['6.6.6', A regular tiling]
    - ['3.3.6.6', Appears only mixed with other vertex types]
  distractors: [Does not fit around a point]
  explanation: |-
    $60 + \tfrac{900}{7} + \tfrac{1200}{7} = 360$, so $3.7.42$ fits, but the odd-triangle argument rules it out. $4.8.8$ is one of the 8 semiregular tilings and $6.6.6$ is a regular one. $3.3.6.6$ fits ($60 + 60 + 120 + 120$) but can't be the only vertex type; it appears in tilings with more than one kind of vertex.
- id: geo-m5-r2-h36
  lesson: geo-m5-h-tilings
  topic: Tilings
  stem: 'Why can''t a tiling have every vertex of type $5.5.10$?'
  choices: ['Around one of the pentagons, the neighbors across its sides would have to alternate between pentagons and 10-gons, which is impossible with 5 sides.', 'The angles at the vertex add to more than $360^\circ$.', 'Regular pentagons can''t tile the plane by themselves, so they can''t appear in any tiling.', 'The number 10 does not divide 360.']
  answer: 0
  explanation: |-
    The angles do fit: $108 + 108 + 144 = 360$. But at each corner of a pentagon, its two sides touch the other two polygons, a pentagon and a 10-gon, so the neighbors must alternate; an odd number of sides can't alternate. A polygon that can't tile alone can still appear in mixed tilings (regular octagons can't, yet they appear in $4.8.8$), and 10 not dividing 360 is irrelevant.
- id: geo-m5-r2-h37
  lesson: geo-m5-h-tilings
  topic: Tilings
  stem: 'How many tilings of the plane by regular polygons have every vertex alike (regular and semiregular together)?'
  choices: ['8', '17', '11', '21']
  answer: 2
  explanation: |-
    3 regular tilings plus 8 semiregular ones make 11. 17 counts the combinations of polygons that fit around a point and 21 counts the vertex types; most of those can't be the only vertex type.
- id: geo-m5-r2-h38
  lesson: geo-m5-h-tilings
  topic: Turning and star polygons
  stem: 'Which star polygon has tip angles of $100^\circ$?'
  choices: ['$\{9/4\}$', '$\{5/2\}$', '$\{7/2\}$', '$\{9/2\}$']
  answer: 3
  explanation: |-
    $180 - \tfrac{360k}{n} = 100$ gives $\tfrac{k}{n} = \tfrac{80}{360} = \tfrac29$, so $\{9/2\}$. Check: $180 - \tfrac{720}{9} = 100$. The others have tips of $20^\circ$, $36^\circ$ and about $77.14^\circ$.
- id: geo-m5-r2-h39
  lesson: geo-m5-h-tilings
  topic: Tilings
  stem: 'Three regular polygons with $a$, $b$ and $c$ sides fit exactly around a point. Which equation must hold?'
  choices: ['$\tfrac1a + \tfrac1b + \tfrac1c = 1$', '$\tfrac1a + \tfrac1b + \tfrac1c = \tfrac12$', '$a + b + c = 360$', '$\tfrac1a + \tfrac1b + \tfrac1c = \tfrac32$']
  answer: 1
  explanation: |-
    Adding the angles $180 - \tfrac{360}{a}$ and so on gives $540 - 360\left(\tfrac1a + \tfrac1b + \tfrac1c\right) = 360$, so the sum of reciprocals is $\tfrac12$. The sum is 1 for four polygons and $\tfrac32$ for five.
