    - {x: 37.8, y: 92.8, text: 4.8.8}
    - {x: 62.4, y: 92.8, text: 4.6.12}
    - {x: 86.9, y: 92.8, text: 3.6.3.6}
  distractors: [3.4.6.4, 6.6.6]
