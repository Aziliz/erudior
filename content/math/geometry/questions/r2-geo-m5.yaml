# Module 5, round 2: new question types for the core lessons (q) and the honors lessons (h)
# ---------------------------------------------------------------- Lesson 15 (geo-bisectors)
- id: geo-m5-r2-q01
  lesson: geo-bisectors
  type: text
  module_quiz: true
  topic: Points of concurrency
  stem: 'The perpendicular bisectors of a triangle''s sides meet at the ___, and the angle bisectors meet at the ___.'
  accept:
    - [circumcenter, circumcentre, circumcenter O]
    - [incenter, incentre, incenter I]
  explanation: |-
    Perpendicular bisectors of the sides meet at the circumcenter, which is equidistant from the three vertices. Angle bisectors meet at the incenter, which is equidistant from the three sides.
- id: geo-m5-r2-q02
  lesson: geo-bisectors
  type: match
  topic: Bisectors
  stem: 'Match each point to what it is equidistant from.'
  pairs:
    - ['A point on the perpendicular bisector of $\overline{AB}$', The endpoints A and B]
    - ['A point on the bisector of $\angle A$', The two sides of angle A]
    - [The circumcenter of a triangle, The three vertices]
    - [The incenter of a triangle, The three sides]
  distractors: [The midpoints of the three sides]
  explanation: |-
    The Perpendicular Bisector Theorem gives equal distances to the endpoints, and the Angle Bisector Theorem gives equal distances to the sides of the angle. The circumcenter is on all three perpendicular bisectors, so it is equidistant from all three vertices; the incenter is on all three angle bisectors, so it is equidistant from all three sides.
- id: geo-m5-r2-q03
  lesson: geo-bisectors
  topic: Points of concurrency
  stem: 'Which statements are true for every triangle? Select all that apply.'
  choices: ['The incenter lies inside the triangle.', 'The circumcenter lies inside the triangle.', 'The circumcenter is equidistant from the three vertices.', 'The incenter is equidistant from the three vertices.']
  answer: [0, 2]
  explanation: |-
    The incenter is always inside, and the circumcenter is always equidistant from the vertices. The circumcenter is outside an obtuse triangle (and on the hypotenuse of a right triangle), and the incenter is equidistant from the sides, not the vertices.
- id: geo-m5-r2-q04
  lesson: geo-bisectors
  type: order
  topic: Points of concurrency
  stem: 'Put the steps for constructing the inscribed circle of a triangle in order.'
  items:
    - Construct the bisectors of two of the angles.
    - Mark the point $I$ where the two bisectors cross.
    - Construct the perpendicular from $I$ to one side.
    - Draw the circle centered at $I$ through the foot of that perpendicular.
  explanation: |-
    You need the incenter $I$ before you can drop a perpendicular from it, and you need the perpendicular to know the radius. The perpendicular segment's length is the distance from $I$ to the sides, which is the inradius.
- id: geo-m5-r2-q05
  lesson: geo-bisectors
  type: text
  module_quiz: true
  topic: Points of concurrency
  stem: 'A right triangle has legs 9 and 12. How far is its circumcenter from each vertex? Give only the number.'
  accept: ['7.5']
  explanation: |-
    The hypotenuse is $\sqrt{9^2 + 12^2} = 15$. A right triangle's circumcenter is the midpoint of the hypotenuse, so the circumradius is half of 15: $7.5$.
# ---------------------------------------------------------------- Lesson 16 (geo-medians)
- id: geo-m5-r2-q06
  lesson: geo-medians
  type: label
  module_quiz: true
  topic: Medians and altitudes
  stem: 'Name the numbered lines. Tick marks show equal lengths, and small squares show right angles.'
  image: {src: images/geo-m5-special-segments-blank.svg, alt: 'Triangle ABC with three segments from vertex C to side AB, and a dashed line through the midpoint of AB. Segment 1 meets AB at a right angle. Segment 2 splits angle C into two equal angles. Segment 3 ends at the midpoint of AB. Line 4 is dashed, passes through the midpoint of AB at a right angle, and misses C.'}
  labels:
    - {x: 20.8, y: 59.5, text: Altitude}
    - {x: 29.3, y: 54.7, text: Angle bisector}
    - {x: 34.8, y: 49.8, text: Median}
    - {x: 50.0, y: 16.3, text: Perpendicular bisector}
  distractors: [Midsegment]
  explanation: |-
    1 meets the opposite side at a right angle: an altitude. 2 splits angle $C$ into two equal parts (the matching arcs): an angle bisector. 3 goes from $C$ to the midpoint of $\overline{AB}$ (the tick marks): a median. 4 passes through the midpoint at a right angle but needn't go through a vertex: the perpendicular bisector of $\overline{AB}$. A midsegment joins the midpoints of two sides, and none is drawn.
- id: geo-m5-r2-q07
  lesson: geo-medians
  type: text
  topic: Medians and altitudes
  stem: 'In $\triangle ABC$, $G$ is the centroid and median $\overline{AD}$ has length 27. Then $AG =$ ___ and $GD =$ ___.'
  accept:
    - ['18']
    - ['9']
  explanation: |-
    The centroid is two-thirds of the way from the vertex: $AG = \tfrac23 \cdot 27 = 18$ and $GD = \tfrac13 \cdot 27 = 9$. Check: $18 = 2 \cdot 9$.
- id: geo-m5-r2-q08
  lesson: geo-medians
  type: match
  module_quiz: true
  topic: Medians and altitudes
  stem: 'Match each triangle center to the lines that meet there.'
  pairs:
    - [Circumcenter, Perpendicular bisectors of the sides]
    - [Incenter, Angle bisectors]
    - [Centroid, Medians]
    - [Orthocenter, Altitudes]
  distractors: [Midsegments]
  explanation: |-
    Circumcenter: perpendicular bisectors. Incenter: angle bisectors. Centroid: medians. Orthocenter: altitudes (or the lines containing them). The three midsegments form a triangle; they don't meet at one point.
- id: geo-m5-r2-q09
  lesson: geo-medians
  topic: Medians and altitudes
  stem: 'Which statements are true for every obtuse triangle? Select all that apply.'
  choices: ['Its orthocenter lies outside the triangle.', 'Its centroid lies outside the triangle.', 'Two of its altitudes lie outside the triangle.', 'Its circumcenter lies inside the triangle.']
  answer: [0, 2]
  explanation: |-
    The altitudes from the two acute angles fall outside, onto extensions of the opposite sides, and the lines containing the altitudes meet outside, so the orthocenter is outside. The centroid is always inside (two-thirds of the way along each median, which lies inside the triangle). The circumcenter of an obtuse triangle is outside.
- id: geo-m5-r2-q10
  lesson: geo-medians
  type: text
  topic: Midsegments
  stem: '$\overline{DE}$ is a midsegment of $\triangle ABC$, parallel to $\overline{BC}$, and $BC = 19$. Find $DE$. Give only the number.'
  accept: ['9.5']
  explanation: |-
    A midsegment is half as long as the side it is parallel to: $DE = \tfrac12 \cdot 19 = 9.5$.
# ---------------------------------------------------------------- Lesson 17 (geo-polygons)
- id: geo-m5-r2-q11
  lesson: geo-polygons
  type: label
  topic: Polygon angles
  stem: 'Name the numbered parts of this pentagon.'
  image: {src: images/geo-m5-polygon-parts-blank.svg, alt: 'A convex pentagon. Marker 1 is on the left side. Marker 2 is on the upper left corner point. Marker 3 is on a dashed segment joining two corners that are not next to each other. Marker 4 is on a shaded angle inside the top corner. Marker 5 is on a shaded angle at the lower right corner, between one side and the dashed extension of the bottom side.'}
  labels:
    - {x: 15.6, y: 58.3, text: Side}
    - {x: 14.1, y: 38.1, text: Vertex}
    - {x: 45.3, y: 61.4, text: Diagonal}
    - {x: 46.9, y: 26.2, text: Interior angle}
    - {x: 72.5, y: 72.4, text: Exterior angle}
  distractors: [Midsegment]
  explanation: |-
    1 is one of the segments forming the polygon: a side. 2 is where two sides meet: a vertex. 3 joins two non-adjacent vertices: a diagonal. 4 is the angle inside the polygon at a vertex: an interior angle. 5 is formed by one side and the extension of the next: an exterior angle, which forms a linear pair with the interior angle there.
- id: geo-m5-r2-q12
  lesson: geo-polygons
  type: text
  module_quiz: true
  topic: Polygon angles
  stem: 'Each exterior angle of a regular polygon is $24^\circ$. How many sides does it have? Give only the number.'
  accept: ['15']
  explanation: |-
    The exterior angles add to $360^\circ$ and are all equal, so $n = 360 / 24 = 15$.
- id: geo-m5-r2-q13
  lesson: geo-polygons
  type: order
  topic: Polygon angles
  stem: 'Put these regular polygons in order from smallest to largest interior angle.'
  items: [Equilateral triangle, Square, Regular pentagon, Regular octagon, Regular 20-gon]
  explanation: |-
    Each interior angle of a regular $n$-gon is $180^\circ - \tfrac{360^\circ}{n}$, which grows with $n$: $60^\circ$, $90^\circ$, $108^\circ$, $135^\circ$, $162^\circ$.
- id: geo-m5-r2-q14
  lesson: geo-polygons
  module_quiz: true
  topic: Polygon angles
  stem: 'Which of these could be the measure of each interior angle of a regular polygon? Select all that apply.'
  choices: ['$150^\circ$', '$130^\circ$', '$140^\circ$', '$100^\circ$']
  answer: [0, 2]
  explanation: |-
    Check the exterior angle: $360$ divided by it must be a whole number. $150^\circ$: exterior $30^\circ$, $n = 12$. $140^\circ$: exterior $40^\circ$, $n = 9$. $130^\circ$: exterior $50^\circ$, $360/50 = 7.2$. $100^\circ$: exterior $80^\circ$, $360/80 = 4.5$. So only $150^\circ$ and $140^\circ$ work.
- id: geo-m5-r2-q15
  lesson: geo-polygons
  type: match
  topic: Polygon angles
  stem: 'Match each number of sides to the polygon''s name.'
  pairs:
    - ['5', Pentagon]
    - ['7', Heptagon]
    - ['9', Nonagon]
    - ['12', Dodecagon]
  distractors: [Decagon, Octagon]
  explanation: |-
    5 pentagon, 7 heptagon, 9 nonagon, 12 dodecagon. A decagon has 10 sides and an octagon 8.
# ---------------------------------------------------------------- Lesson 18 (geo-parallelograms)
- id: geo-m5-r2-q16
  lesson: geo-parallelograms
  module_quiz: true
  topic: Parallelograms
  stem: 'Which facts about quadrilateral $ABCD$ are enough, on their own, to prove it is a parallelogram? Select all that apply.'
  choices: ['Both pairs of opposite angles are congruent.', 'The diagonals bisect each other.', 'One pair of opposite sides is parallel and the other pair is congruent.', 'The diagonals are congruent.']
  answer: [0, 1]
  explanation: |-
    Congruent opposite angles (both pairs) and diagonals that bisect each other are both parallelogram tests. "One pair parallel, the other pair congruent" describes an isosceles trapezoid too, and so do congruent diagonals, so neither is enough.
- id: geo-m5-r2-q17
  lesson: geo-parallelograms
  type: order
  topic: Parallelograms
  stem: 'In quadrilateral $ABCD$, $\overline{AB} \parallel \overline{DC}$ and $AB = DC$. Put the steps of the proof that $ABCD$ is a parallelogram in order.'
  items:
    - 'Draw diagonal $\overline{AC}$.'
    - '$\angle BAC \cong \angle DCA$, because they are alternate interior angles for $\overline{AB} \parallel \overline{DC}$.'
    - '$\triangle BAC \cong \triangle DCA$ by SAS.'
    - '$\angle BCA \cong \angle DAC$ by CPCTC.'
    - '$\overline{BC} \parallel \overline{AD}$, so both pairs of opposite sides are parallel.'
  explanation: |-
    The diagonal must exist before you can name angles on it; the angle pair gives the A in SAS (with $AB = DC$ and the shared side $\overline{AC}$); CPCTC then gives the second pair of angles, which are alternate interior angles for $\overline{BC}$ and $\overline{AD}$, so those sides are parallel.
- id: geo-m5-r2-q18
  lesson: geo-parallelograms
  type: text
  module_quiz: true
  topic: Parallelograms
  stem: 'In $\square ABCD$, $m\angle A = 68^\circ$. Then $m\angle B =$ ___ degrees and $m\angle C =$ ___ degrees.'
  accept:
    - ['112']
    - ['68']
  explanation: |-
    Consecutive angles are supplementary: $m\angle B = 180 - 68 = 112^\circ$. Opposite angles are congruent: $m\angle C = 68^\circ$.
- id: geo-m5-r2-q19
  lesson: geo-parallelograms
  type: match
  topic: Parallelograms
  stem: 'For a parallelogram, is each statement always true or not always true?'
  pairs:
    - [Opposite sides are congruent., Always true]
    - [The diagonals are congruent., Not always true]
    - [Consecutive angles are supplementary., Always true]
    - [The diagonals are perpendicular., Not always true]
    - [The diagonals bisect each other., Always true]
  explanation: |-
    The four parallelogram properties are congruent opposite sides, congruent opposite angles, supplementary consecutive angles and diagonals that bisect each other. Congruent diagonals belong to rectangles and perpendicular diagonals to rhombuses; a general parallelogram has neither.
- id: geo-m5-r2-q20
  lesson: geo-parallelograms
  topic: Parallelograms
  stem: 'Three vertices of $\square ABCD$ are $A(1, 1)$, $B(6, 2)$ and $C(8, 6)$. Where is $D$?'
  choices: ['$(13, 7)$', '$(-1, -3)$', '$(3, 5)$', '$(4, 5)$']
  answer: 2
  explanation: |-
    The diagonals $\overline{AC}$ and $\overline{BD}$ share a midpoint. The midpoint of $\overline{AC}$ is $(4.5, 3.5)$, so $D = (2 \cdot 4.5 - 6, 2 \cdot 3.5 - 2) = (3, 5)$. Equivalently $D = A + C - B$. $(13, 7)$ is $B + C - A$ and $(-1, -3)$ is $A + B - C$: those complete parallelograms with the vertices in a different order. $(4, 5)$ comes from using the midpoint of $\overline{AC}$ wrongly.
# ---------------------------------------------------------------- Lesson 19 (geo-special-quads)
- id: geo-m5-r2-q21
  lesson: geo-special-quads
  type: label
  module_quiz: true
  topic: Trapezoids and kites
  stem: 'Name the numbered parts of this trapezoid. Arrowheads mark parallel sides; tick marks show equal lengths.'
  image: {src: images/geo-m5-trapezoid-parts-blank.svg, alt: 'A trapezoid with a long bottom side and a short top side, both marked parallel. Marker 1 is on the bottom side. Marker 2 is on the right slanted side. Marker 3 is on a dashed segment joining the midpoints of the two slanted sides. Marker 4 is on the shaded angle at the bottom left corner.'}
  labels:
    - {x: 65.6, y: 82.5, text: Base}
    - {x: 83.6, y: 64.5, text: Leg}
    - {x: 59.4, y: 52.5, text: Midsegment}
    - {x: 17.5, y: 79.0, text: Base angle}
  distractors: [Diagonal, Altitude]
  explanation: |-
    The parallel sides are the bases (1); the other two sides are the legs (2). The segment joining the midpoints of the legs is the midsegment (3), whose length is the average of the bases. The two angles along one base are base angles (4). No diagonal or altitude is drawn.
- id: geo-m5-r2-q22
  lesson: geo-special-quads
  module_quiz: true
  topic: Special parallelograms
  stem: 'Which quadrilaterals always have perpendicular diagonals? Select all that apply.'
  choices: [Rhombus, Rectangle, Kite, Isosceles trapezoid]
  answer: [0, 2]
  explanation: |-
    Rhombus diagonals are perpendicular bisectors of each other, and a kite's diagonals are perpendicular. A rectangle's diagonals are congruent but perpendicular only when it's a square; an isosceles trapezoid's diagonals are congruent but generally not perpendicular.
- id: geo-m5-r2-q23
  lesson: geo-special-quads
  type: match
  topic: Special parallelograms
  stem: 'Match each quadrilateral to its definition in this course.'
  pairs:
    - [Rectangle, A parallelogram with four right angles]
    - [Rhombus, A parallelogram with four congruent sides]
    - [Trapezoid, A quadrilateral with exactly one pair of parallel sides]
    - [Kite, Two pairs of congruent consecutive sides and no congruent opposite sides]
  distractors: [A quadrilateral with both pairs of opposite sides congruent]
  explanation: |-
    Those are the definitions from the lesson. "Both pairs of opposite sides congruent" is a test for a parallelogram, not the definition of any of these four.
- id: geo-m5-r2-q24
  lesson: geo-special-quads
  type: text
  topic: Trapezoids and kites
  stem: 'A trapezoid has bases 11 and 25. How long is its midsegment? Give only the number.'
  accept: ['18']
  explanation: |-
    The midsegment is the average of the bases: $\tfrac{11 + 25}{2} = 18$.
- id: geo-m5-r2-q25
  lesson: geo-special-quads
  type: order
  topic: Special parallelograms
  stem: 'Put these in order from the most general to the most specific, so that each is a special case of the one before it.'
  items: [Quadrilateral, Parallelogram, Rhombus, Square]
  explanation: |-
    Every square is a rhombus (four congruent sides), every rhombus is a parallelogram, and every parallelogram is a quadrilateral. None of the reverse statements is true.
# ================================================================ Honors: proving the triangle centers exist
- id: geo-m5-r2-h01
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'In the proof that the centroid splits each median $2 : 1$, why is $MNDE$ a parallelogram?'
  choices: ['$\overline{MN}$ and $\overline{ED}$ are both parallel to $\overline{AB}$ and both half as long as $\overline{AB}$.', 'Its diagonals $\overline{MD}$ and $\overline{NE}$ are congruent.', 'Its opposite angles at $G$ are vertical angles.', '$M$, $N$, $D$ and $E$ are all midpoints of segments.']
  answer: 0
  explanation: |-
    $\overline{ED}$ is a midsegment of $\triangle ABC$ and $\overline{MN}$ is a midsegment of $\triangle ABG$, so both are parallel to $\overline{AB}$ and half its length. One pair of opposite sides both parallel and congruent makes a parallelogram. The diagonals' congruence isn't known, and $G$ is where the diagonals cross, not a vertex of $MNDE$. Being midpoints alone proves nothing.
- id: geo-m5-r2-h02
  lesson: geo-m5-h-concurrency
  type: order
  topic: Concurrency proofs
  stem: 'Medians $\overline{AD}$ and $\overline{BE}$ meet at $G$; $M$ and $N$ are the midpoints of $\overline{AG}$ and $\overline{BG}$. Put the steps of the proof in order.'
  items:
    - '$\overline{ED}$ and $\overline{MN}$ are midsegments, each parallel to $\overline{AB}$ and half as long.'
    - '$MNDE$ is a parallelogram.'
    - 'Its diagonals bisect each other, so $MG = GD$.'
    - '$AM = MG = GD$, so $AG = 2\,GD$.'
    - 'The third median also meets $\overline{AD}$ two-thirds of the way from $A$, so it passes through $G$.'
  explanation: |-
    The midsegments give the parallelogram; the parallelogram gives bisected diagonals; with $AM = MG$ that cuts the median into thirds; and since only one point of $\overline{AD}$ is two-thirds of the way from $A$, the third median must pass through it.
- id: geo-m5-r2-h03
  lesson: geo-m5-h-concurrency
  type: text
  topic: Concurrency proofs
  stem: 'Medians $\overline{AD}$ and $\overline{BE}$ of $\triangle ABC$ meet at $G$, and $GD = 4$. How long is median $\overline{AD}$? Give only the number.'
  accept: ['12']
  explanation: |-
    The proof shows $AM = MG = GD$, so the median is three times $GD$: $AD = 3 \cdot 4 = 12$ (and $AG = 8$).
- id: geo-m5-r2-h04
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'In the picture, lines through $A$, $B$ and $C$ parallel to the opposite sides form $\triangle A''B''C''$. Why is $A$ the midpoint of $\overline{B''C''}$?'
  image: {src: images/geo-m5-anticomplementary.svg, alt: 'A small triangle ABC inside a larger triangle A′B′C′, with A, B and C the midpoints of the big triangle''s sides. The altitudes of ABC are dashed and meet at H.'}
  choices: ['Because $A$ is equidistant from $B$ and $C$.', 'Because the altitude from $A$ is perpendicular to $\overline{B''C''}$.', 'Because $\triangle ABC$ is the medial triangle of every triangle.', 'Because $AB''CB$ and $AC''BC$ are parallelograms, so $AB'' = BC = AC''$.']
  answer: 3
  explanation: |-
    Both quadrilaterals have both pairs of opposite sides parallel by construction, so they are parallelograms, and opposite sides give $AB' = BC$ and $AC' = BC$. A perpendicular through $A$ says nothing about lengths, and $A$ is generally not equidistant from $B$ and $C$.
- id: geo-m5-r2-h05
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'Triangle $A''B''C''$ is formed by the lines through $A$, $B$ and $C$ parallel to the opposite sides of $\triangle ABC$. Which statements are true for every triangle $ABC$? Select all that apply.'
  choices: ['$A$ is the midpoint of $\overline{B''C''}$.', 'The altitudes of $\triangle ABC$ lie on the perpendicular bisectors of the sides of $\triangle A''B''C''$.', 'The orthocenter of $\triangle ABC$ is the circumcenter of $\triangle A''B''C''$.', 'The centroid of $\triangle ABC$ is the orthocenter of $\triangle A''B''C''$.']
  answer: [0, 1, 2]
  explanation: |-
    The first three are the steps and conclusion of the orthocenter proof. The fourth is false in general: the orthocenter of $\triangle A'B'C'$ is a different point (the two triangles actually share the same centroid).
- id: geo-m5-r2-h06
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'Find the orthocenter of the triangle with vertices $A(0, 0)$, $B(8, 0)$ and $C(10, 4)$.'
  choices: ['$(10, 5)$', '$(10, -5)$', '$(6, \tfrac43)$', '$(8, -4)$']
  answer: 1
  explanation: |-
    The altitude from $C$ is vertical: $x = 10$. $\overline{BC}$ has slope $\tfrac{4}{2} = 2$, so the altitude from $A$ has slope $-\tfrac12$: $y = -\tfrac12 x$, which gives $y = -5$ at $x = 10$. The orthocenter $(10, -5)$ is outside, below the triangle, since the angle at $B$ is obtuse. $(10, 5)$ is a sign slip, $(6, \tfrac43)$ is the centroid.
- id: geo-m5-r2-h07
  lesson: geo-m5-h-concurrency
  type: text
  topic: Euler line
  stem: 'A triangle has circumcenter $O(2, 1)$ and centroid $G(4, 3)$. Its orthocenter is $H($___, ___$)$.'
  accept:
    - ['8']
    - ['7']
  explanation: |-
    $3G = H + 2O$, so $H = 3G - 2O = (12 - 4, 9 - 2) = (8, 7)$. Check: $G - O = (2, 2)$ and $H - G = (4, 4)$, twice as far in the same direction.
- id: geo-m5-r2-h08
  lesson: geo-m5-h-concurrency
  topic: Euler line
  stem: 'For the circumcenter $O$, centroid $G$ and orthocenter $H$ of a triangle that isn''t equilateral, which is always true?'
  choices: ['$OG : GH = 2 : 1$', '$OG = GH$', '$OG : GH = 1 : 2$', '$OH : HG = 1 : 2$']
  answer: 2
  explanation: |-
    From $G - O = \tfrac13(H - O)$, the centroid is one-third of the way from $O$ to $H$, so $OG : GH = 1 : 2$. The centroid sits closer to the circumcenter.
- id: geo-m5-r2-h09
  lesson: geo-m5-h-concurrency
  type: match
  topic: Concurrency proofs
  stem: 'Match each result to the idea its proof in this lesson used.'
  pairs:
    - [The medians meet two-thirds of the way along each, Two midsegments form a parallelogram]
    - [The altitudes are concurrent, They are perpendicular bisectors of a larger triangle]
    - ['$O$, $G$ and $H$ are collinear', Coordinates with the altitude from C on the y-axis]
    - [A right triangle's circumcenter is the midpoint of the hypotenuse, Completing the triangle to a rectangle]
  distractors: [Points on angle bisectors are equidistant from the sides]
  explanation: |-
    Those are the four proofs in the lesson. Equidistance from the sides is the idea behind the incenter, which was proved in Lesson 15.
- id: geo-m5-r2-h10
  lesson: geo-m5-h-concurrency
  topic: Euler line
  stem: 'Which points always lie on the Euler line of a triangle that isn''t equilateral? Select all that apply.'
  choices: [Incenter, Circumcenter, Orthocenter, Centroid]
  answer: [1, 2, 3]
  explanation: |-
    The Euler line is defined by the circumcenter and orthocenter, and the centroid always lies between them. The incenter is on it only when the triangle is isosceles.
- id: geo-m5-r2-h11
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'A right triangle has legs 6 and 8. How far is the vertex of the right angle from the circumcenter?'
  choices: ['4.8', '7', '10', '5']
  answer: 3
  explanation: |-
    The hypotenuse is 10 and the circumcenter is its midpoint $M$. Completing the triangle to a rectangle makes $\overline{CM}$ half of a diagonal, and the diagonals are congruent, so $CM = \tfrac12 \cdot 10 = 5$. 4.8 is the altitude to the hypotenuse ($\tfrac{6 \cdot 8}{10}$), not the distance to $M$.
- id: geo-m5-r2-h12
  lesson: geo-m5-h-concurrency
  type: text
  topic: Concurrency proofs
  stem: '$\triangle ABC$ has its right angle at $C$. Its orthocenter is the vertex ___. (Give the letter.)'
  accept: [C, vertex C, point C]
  explanation: |-
    The legs $\overline{CA}$ and $\overline{CB}$ are altitudes (each is perpendicular to the other leg), and they meet at $C$. So all three altitude lines pass through $C$.
- id: geo-m5-r2-h13
  lesson: geo-m5-h-concurrency
  topic: Concurrency proofs
  stem: 'The last step of the proof that the altitudes are concurrent quotes which theorem?'
  choices: ['The Triangle Midsegment Theorem', 'The Circumcenter Theorem', 'The Centroid Theorem', 'The Incenter Theorem']
  answer: 1
  explanation: |-
    The altitude lines of $\triangle ABC$ are the perpendicular bisectors of $\triangle A'B'C'$, and the Circumcenter Theorem says those are concurrent. Midsegments appear earlier in the course but not in that step.
# ================================================================ Honors: Varignon and diagonals
- id: geo-m5-r2-h14
  lesson: geo-m5-h-varignon
  topic: Varignon's theorem
  stem: 'Join the midpoints of the sides of a rhombus that isn''t a square. What shape do you get?'
  choices: ['A rhombus', 'A square', 'A kite', 'A rectangle']
  answer: 3
  explanation: |-
    The Varignon parallelogram's sides are parallel to the diagonals. A rhombus's diagonals are perpendicular, so the Varignon parallelogram has right angles: a rectangle. Its sides are half the diagonals, which differ unless the rhombus is a square, so it isn't a square.
- id: geo-m5-r2-h15
  lesson: geo-m5-h-varignon
  type: text
  topic: Varignon's theorem
  stem: 'A quadrilateral has diagonals of lengths 14 and 20. What is the perimeter of its Varignon parallelogram? Give only the number.'
  accept: ['34']
  explanation: |-
    Two sides are $\tfrac12 \cdot 14 = 7$ and two are $\tfrac12 \cdot 20 = 10$, so the perimeter is $2(7 + 10) = 34$, the sum of the diagonals.
- id: geo-m5-r2-h16
  lesson: geo-m5-h-varignon
  type: text
  topic: Varignon's theorem
  stem: 'A convex quadrilateral has area 90. What is the area of its Varignon parallelogram? Give only the number.'
  accept: ['45']
  explanation: |-
    The four corner triangles cut off by the Varignon parallelogram take half the area, so the parallelogram has the other half: 45.
- id: geo-m5-r2-h17
  lesson: geo-m5-h-varignon
  type: label
  topic: Classifying quadrilaterals
  stem: 'Each picture shows only the diagonals of a convex quadrilateral. Matching tick marks show equal lengths and a small square shows a right angle; lengths without matching marks are not equal, and angles without a square are not right. Name each quadrilateral.'
  image: {src: images/geo-m5-diagonal-patterns-blank.svg, alt: 'Five pairs of crossing segments. 1: perpendicular; the horizontal one is cut in half, the vertical one is not. 2: perpendicular; each is cut in half, and they have different lengths. 3: not perpendicular; each is cut in half, and they have different lengths. 4: not perpendicular; they cut each other into a short piece and a long piece, with the two short pieces equal and the two long pieces equal. 5: not perpendicular; all four half-diagonals are equal.'}
  labels:
    - {x: 16.7, y: 43.9, text: Kite}
    - {x: 50.0, y: 43.9, text: Rhombus}
    - {x: 83.3, y: 43.9, text: Parallelogram}
    - {x: 16.7, y: 92.7, text: Isosceles trapezoid}
    - {x: 50.0, y: 92.7, text: Rectangle}
  distractors: [Square]
  explanation: |-
    1: one diagonal is the perpendicular bisector of the other, which isn't bisected: kite. 2: bisect each other and perpendicular, different lengths: rhombus. 3: bisect each other only: parallelogram. 4: same two lengths without bisecting: isosceles trapezoid. 5: bisect each other and congruent, not perpendicular: rectangle. A square would need all four halves equal and a right angle.
- id: geo-m5-r2-h18
  lesson: geo-m5-h-varignon
  type: match
  topic: Classifying quadrilaterals
  stem: 'Match each fact about the diagonals of a convex quadrilateral to the shape it guarantees.'
  pairs:
    - [They bisect each other., Parallelogram]
    - [They bisect each other and are congruent., Rectangle]
    - [They bisect each other and are perpendicular., Rhombus]
    - ['They bisect each other, are congruent and are perpendicular.', Square]
  distractors: [Kite]
  explanation: |-
    Bisecting diagonals make a parallelogram; adding congruent diagonals makes it a rectangle, adding perpendicular ones makes it a rhombus, and both make a square. A kite's diagonals don't bisect each other.
- id: geo-m5-r2-h19
  lesson: geo-m5-h-varignon
  topic: Classifying quadrilaterals
  stem: 'Using only its diagonals, classify the quadrilateral $W(0, 0)$, $X(5, 1)$, $Y(6, 6)$, $Z(1, 5)$ as precisely as possible.'
  choices: ['Rhombus', 'Square', 'Rectangle', 'Kite']
  answer: 0
  explanation: |-
    Both diagonals have midpoint $(3, 3)$, so they bisect each other. $\overrightarrow{WY} = (6, 6)$ and $\overrightarrow{XZ} = (-4, 4)$ have dot product $-24 + 24 = 0$, so they're perpendicular. Their lengths are $\sqrt{72}$ and $\sqrt{32}$, not equal. Bisecting and perpendicular but not congruent: a rhombus, not a square.
- id: geo-m5-r2-h20
  lesson: geo-m5-h-varignon
  topic: Classifying quadrilaterals
  stem: 'Which facts about the diagonals of a convex quadrilateral guarantee that it is a parallelogram? Select all that apply.'
  choices: ['They bisect each other.', 'They are congruent and bisect each other.', 'They are perpendicular.', 'They are congruent and perpendicular.']
  answer: [0, 1]
  explanation: |-
    Bisecting each other is the parallelogram test (with congruence added, it's a rectangle, still a parallelogram). Perpendicular diagonals occur in kites, and congruent perpendicular diagonals occur in irregular quadrilaterals like Example 4, neither of which is a parallelogram.
- id: geo-m5-r2-h21
  lesson: geo-m5-h-varignon
  topic: Classifying quadrilaterals
  stem: 'Which quadrilateral is a counterexample to "A quadrilateral with congruent diagonals is a rectangle"?'
  choices: ['A square', 'A rhombus that isn''t a square', 'An isosceles trapezoid', 'A parallelogram that isn''t a rectangle']
  answer: 2
  explanation: |-
    An isosceles trapezoid has congruent diagonals but is not a rectangle (not even a parallelogram). A square is a rectangle, so it isn't a counterexample; the other two don't have congruent diagonals, so they don't satisfy the hypothesis.
- id: geo-m5-r2-h22
  lesson: geo-m5-h-varignon
  topic: Classifying quadrilaterals
  stem: 'Under the inclusive definition (a trapezoid has at least one pair of parallel sides), which statement is true?'
  choices: ['Every parallelogram is a trapezoid.', 'Every trapezoid is a parallelogram.', 'No rectangle is a trapezoid.', 'Every kite is a trapezoid.']
  answer: 0
  explanation: |-
    A parallelogram has two pairs of parallel sides, so it has at least one: under the inclusive definition it's a trapezoid. Rectangles are parallelograms, so they're trapezoids too. A trapezoid with only one pair of parallel sides isn't a parallelogram, and a kite (other than a rhombus) has no parallel sides.
- id: geo-m5-r2-h23
  lesson: geo-m5-h-varignon
  type: order
  topic: Varignon's theorem
  stem: '$E$, $F$, $G$, $H$ are the midpoints of sides $\overline{AB}$, $\overline{BC}$, $\overline{CD}$, $\overline{DA}$ of quadrilateral $ABCD$. Put the steps of the proof that $EFGH$ is a parallelogram in order.'
  items:
    - 'Draw diagonal $\overline{AC}$.'
    - '$\overline{EF}$ and $\overline{HG}$ are midsegments of $\triangle ABC$ and $\triangle ADC$, each parallel to $\overline{AC}$ and half as long.'
    - '$\overline{EF} \parallel \overline{HG}$ and $EF = HG$.'
    - '$EFGH$ is a parallelogram, because one pair of opposite sides is parallel and congruent.'
  explanation: |-
    The diagonal creates the two triangles; the Triangle Midsegment Theorem relates both segments to $\overline{AC}$; that makes them parallel and congruent to each other; and test 5 from Lesson 18 finishes the proof.
- id: geo-m5-r2-h24
  lesson: geo-m5-h-varignon
  type: text
  topic: Varignon's theorem
  stem: 'A quadrilateral''s diagonals are perpendicular, with lengths 6 and 8. Its Varignon parallelogram is a rectangle. How long is a diagonal of that rectangle? Give only the number.'
  accept: ['5']
  explanation: |-
    The rectangle's sides are half the quadrilateral's diagonals: 3 and 4. Its diagonal is $\sqrt{3^2 + 4^2} = 5$.
- id: geo-m5-r2-h25
  lesson: geo-m5-h-varignon
  topic: Classifying quadrilaterals
  stem: 'In quadrilateral $ABCD$, diagonal $\overline{AC}$ is the perpendicular bisector of diagonal $\overline{BD}$. Which conclusion follows?'
  choices: ['$AB = BC$ and $CD = DA$', '$AC = BD$', '$AB = AD$ and $CB = CD$', '$\angle A \cong \angle C$']
  answer: 2
  explanation: |-
    $A$ and $C$ are on the perpendicular bisector of $\overline{BD}$, so each is equidistant from $B$ and $D$: $AB = AD$ and $CB = CD$. That makes $ABCD$ a kite (or a rhombus). Nothing forces the diagonals to be congruent, and in a kite the congruent angles are $\angle B$ and $\angle D$.
- id: geo-m5-r2-h26
  lesson: geo-m5-h-varignon
  topic: Varignon's theorem
  stem: 'What is the Varignon parallelogram of an isosceles trapezoid?'
  choices: ['A rectangle', 'A rhombus', 'A square', 'A trapezoid']
  answer: 1
  explanation: |-
    An isosceles trapezoid has congruent diagonals, so the Varignon parallelogram's sides (half the diagonals) are all equal: a rhombus. Its diagonals are generally not perpendicular, so it's usually not a rectangle or square.
# ================================================================ Honors: turning, star polygons, tilings
- id: geo-m5-r2-h27
  lesson: geo-m5-h-tilings
  topic: Turning and star polygons
  stem: 'A concave hexagon has five interior angles of $100^\circ$ each. What is its sixth angle?'
  choices: ['$140^\circ$', '$40^\circ$', '$260^\circ$', '$220^\circ$']
  answer: 3
  explanation: |-
    Every hexagon whose sides don't cross has an angle sum of $(6 - 2) \cdot 180 = 720^\circ$, so the sixth angle is $720 - 500 = 220^\circ$, a reflex angle (as a concave polygon needs). $140^\circ$ is $360 - 220$, and $40^\circ$ is what's left from $540^\circ$, a pentagon's sum.
- id: geo-m5-r2-h28
  lesson: geo-m5-h-tilings
  type: text
  topic: Turning and star polygons
  stem: 'Walking once around a polygon whose sides don''t cross, counting left turns as positive and right turns as negative, the turns add to ___ degrees. Give only the number.'
  accept: ['360']
  explanation: |-
    You end facing the way you started after one net revolution, so the signed turns add to $360^\circ$, whether the polygon is convex or concave.
- id: geo-m5-r2-h29
  lesson: geo-m5-h-tilings
  type: text
  topic: Turning and star polygons
  stem: 'What is the tip angle of the star polygon $\{9/4\}$, in degrees? Give only the number.'
  accept: ['20']
  explanation: |-
    Tip angle $= 180 - \tfrac{360 \cdot 4}{9} = 180 - 160 = 20^\circ$.
- id: geo-m5-r2-h30
  lesson: geo-m5-h-tilings
  topic: Turning and star polygons
  stem: 'Which symbols name a single star polygon? Select all that apply.'
  choices: ['$\{7/2\}$', '$\{8/3\}$', '$\{6/2\}$', '$\{8/2\}$']
  answer: [0, 1]
  explanation: |-
    $\{n/k\}$ is a single star when $k$ and $n$ have no common factor and $1 < k < \tfrac n2$. 7 and 2 share no factor, nor do 8 and 3. $\{6/2\}$ and $\{8/2\}$ share the factor 2: joining every second point closes up after 3 or 4 points, giving a triangle or a square, not a star.
- id: geo-m5-r2-h31
  lesson: geo-m5-h-tilings
  topic: Turning and star polygons
  stem: 'What is the sum of the five tip angles of a pentagram $\{5/2\}$?'
  choices: ['$36^\circ$', '$180^\circ$', '$360^\circ$', '$540^\circ$']
  answer: 1
  explanation: |-
    Each tip is $180 - \tfrac{360 \cdot 2}{5} = 36^\circ$, and $5 \cdot 36 = 180^\circ$; the formula $180(n - 2k) = 180(5 - 4)$ agrees. $540^\circ$ is the sum for a convex pentagon, and $36^\circ$ is one tip.
- id: geo-m5-r2-h32
  lesson: geo-m5-h-tilings
  type: text
  topic: Tilings
  stem: 'A square and a regular octagon meet at a vertex, and one more regular polygon fills the rest of the $360^\circ$. How many sides does it have? Give only the number.'
  accept: ['8']
  explanation: |-
    $90 + 135 = 225$, leaving $135^\circ$, the angle of a regular octagon. The vertex is $4.8.8$.
- id: geo-m5-r2-h33
  lesson: geo-m5-h-tilings
  type: label
  topic: Tilings
  stem: 'Give the vertex configuration of each tiling.'
  image: {src: images/geo-m5-tilings-blank.svg, alt: 'Four square patches of tilings by regular polygons, numbered 1 to 4. 1: dodecagons with small triangles in the gaps. 2: octagons with small squares in the gaps. 3: dodecagons separated by squares, with hexagons filling the remaining gaps. 4: hexagons meeting corner to corner with triangles between them.'}
  labels:
