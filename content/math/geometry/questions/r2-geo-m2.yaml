# Round 2 questions for geo-m2 (Reasoning and proof): core lessons 05-07 and honors lessons 07h1-07h3
# ---- Lesson 05: inductive reasoning and conditional statements
- id: geo-m2-r2-q01
  lesson: geo-conditional
  type: text
  topic: Inductive reasoning
  stem: 'A case in which the hypothesis of a conjecture is true but its conclusion is false is called a ___.'
  accept: [counterexample, counterexamples, counter-example, counter example, a counterexample]
  explanation: |-
    A counterexample satisfies the hypothesis and breaks the conclusion. One counterexample is enough to show a conjecture is false, but no number of examples proves one.
- id: geo-m2-r2-q02
  lesson: geo-conditional
  module_quiz: true
  type: match
  topic: Conditional statements
  stem: 'Start from the conditional "If a quadrilateral is a square, then it has four right angles." Match each related statement to its name.'
  pairs:
    - ['If a quadrilateral has four right angles, then it is a square.', Converse]
    - ['If a quadrilateral is not a square, then it does not have four right angles.', Inverse]
    - ['If a quadrilateral does not have four right angles, then it is not a square.', Contrapositive]
  distractors: [Biconditional]
  explanation: |-
    The converse swaps hypothesis and conclusion. The inverse negates both. The contrapositive swaps and negates. Only the contrapositive is guaranteed to be true here; the converse and inverse are false (a 2-by-5 rectangle has four right angles but is not a square). A biconditional would be an "if and only if" statement.
- id: geo-m2-r2-q03
  lesson: geo-conditional
  module_quiz: true
  topic: Conditional statements
  stem: 'The statement "If two angles are vertical angles, then they are congruent" is true. Which of these must also be true? Select all that apply.'
  choices:
    - 'If two angles are not congruent, then they are not vertical angles.'
    - 'If two angles are congruent, then they are vertical angles.'
    - 'If two angles are not vertical angles, then they are not congruent.'
    - 'Any two vertical angles are congruent.'
    - 'Two angles are vertical angles if and only if they are congruent.'
  answer: [0, 3]
  explanation: |-
    The first choice is the contrapositive, which always has the same truth value as the conditional. "Any two vertical angles are congruent" is the same statement in different words. The second is the converse and the third is the inverse; both are false, because two $40^\circ$ angles in different corners of a page are congruent but not vertical. The biconditional needs the converse, so it is false too.
- id: geo-m2-r2-q04
  lesson: geo-conditional
  type: label
  topic: Conditional statements
  stem: 'The diagram pictures the true statement "If a quadrilateral is a square, then it is a rectangle." The outer box holds all quadrilaterals. Name the numbered regions.'
  image: {src: images/geo-m2-square-rectangle-blank.svg, alt: 'Inside a box, a large oval contains a smaller circle. A small square is drawn inside the circle, a long thin rectangle inside the oval but outside the circle, and a trapezoid outside the oval. Marker 1 is in the circle, marker 2 in the oval outside the circle, and marker 3 outside the oval.'}
  labels:
    - {x: 33.9, y: 46.3, text: Squares}
    - {x: 58.9, y: 48.8, text: Rectangles that are not squares}
    - {x: 85.7, y: 67.5, text: Quadrilaterals that are not rectangles}
  distractors: [Squares that are not rectangles, Rectangles that are not quadrilaterals]
  explanation: |-
    A true conditional puts the hypothesis set (squares, 1) inside the conclusion set (rectangles). Region 2 holds rectangles that are not squares, such as a 2-by-5 rectangle; each one is a counterexample to the converse. Region 3 holds quadrilaterals that are not rectangles, such as a trapezoid. There is no region for "squares that are not rectangles", because the conditional is true.
- id: geo-m2-r2-q05
  lesson: geo-conditional
  type: text
  topic: Inductive reasoning
  stem: 'Twenty points are marked on a circle and every pair is joined by a segment. How many segments are there? Give only the number.'
  accept: ['190']
  explanation: |-
    Each of the 20 points joins the 19 others, giving $20 \cdot 19 = 380$ ends of segments, but every segment has two ends, so there are $\tfrac{20 \cdot 19}{2} = 190$ segments.
# ---- Lesson 06: deductive reasoning and algebraic proof
- id: geo-m2-r2-q06
  lesson: geo-deductive
  type: match
  topic: Deductive reasoning
  stem: 'Match each argument to the rule it uses or the error it makes.'
  pairs:
    - ['If an angle is obtuse, it measures more than $90^\circ$. $\angle K$ is obtuse. So $m\angle K > 90^\circ$.', Law of Detachment]
    - ['If $x = 2$, then $x^2 = 4$. If $x^2 = 4$, then $x^2 + 1 = 5$. So if $x = 2$, then $x^2 + 1 = 5$.', Law of Syllogism]
    - ['If a figure is a square, it has four sides. Figure $F$ has four sides. So $F$ is a square.', Affirming the consequent (invalid)]
  distractors: [Reflexive property]
  explanation: |-
    The first argument meets the hypothesis and detaches the conclusion: detachment. The second chains two conditionals whose middle parts match: syllogism. The third starts from the conclusion of the conditional and runs it backward, which is affirming the consequent; $F$ could be a rectangle or a trapezoid.
- id: geo-m2-r2-q07
  lesson: geo-deductive
  module_quiz: true
  type: match
  topic: Algebraic proof
  stem: 'Match each step to the property that justifies it.'
  pairs:
    - ['If $AB = CD$, then $CD = AB$.', Symmetric property]
    - ['If $m\angle 1 = m\angle 2$ and $m\angle 2 = m\angle 3$, then $m\angle 1 = m\angle 3$.', Transitive property]
    - ['$\overline{PQ} \cong \overline{PQ}$', Reflexive property]
    - ['If $x = 7$ and $2x + y = 20$, then $2(7) + y = 20$.', Substitution property]
  distractors: [Distributive property, Division property of equality]
  explanation: |-
    Symmetric flips one equation. Transitive links two equations through the shared middle quantity $m\angle 2$. Reflexive says anything is congruent (or equal) to itself. Substitution replaces $x$ by the equal value 7 inside a larger expression.
- id: geo-m2-r2-q08
  lesson: geo-deductive
  type: order
  topic: Algebraic proof
  stem: 'Put the statements of this algebraic proof in order, from the given equation to the conclusion.'
  items:
    - '$4(x + 2) = 2x - 6$'
    - '$4x + 8 = 2x - 6$'
    - '$2x + 8 = -6$'
    - '$2x = -14$'
    - '$x = -7$'
  explanation: |-
    Given; distributive property; subtraction property (subtract $2x$); subtraction property (subtract 8); division property (divide by 2). Each statement is the only one that follows from the one before it. Check: $4(-7 + 2) = -20$ and $2(-7) - 6 = -20$.
- id: geo-m2-r2-q09
  lesson: geo-deductive
  type: label
  topic: Deductive reasoning
  stem: 'The diagram pictures the chain "If a quadrilateral is a square, then it is a rhombus" and "If a quadrilateral is a rhombus, then its diagonals are perpendicular." The outer box holds all quadrilaterals. Name the numbered regions.'
  image: {src: images/geo-m2-syllogism-sets-blank.svg, alt: 'Inside a box, three nested regions: a large oval, a smaller oval inside it, and a circle inside that. A square with its diagonals is in the circle (marker 1), a rhombus with unequal perpendicular diagonals is in the middle oval (marker 2), a kite with perpendicular diagonals is in the large oval only (marker 3), and a rectangle whose diagonals are not perpendicular is outside all three (marker 4).'}
  labels:
    - {x: 32.1, y: 52.9, text: Squares}
    - {x: 51.8, y: 48.8, text: Rhombuses that are not squares}
    - {x: 75, y: 42.9, text: Perpendicular diagonals but not a rhombus}
    - {x: 87.5, y: 76.2, text: Diagonals not perpendicular}
  distractors: [Squares that are not rhombuses]
  explanation: |-
    Each true conditional puts its hypothesis set inside its conclusion set, so squares (1) sit inside rhombuses (2), which sit inside the quadrilaterals with perpendicular diagonals (3). Following the nesting from 1 to 3 is the Law of Syllogism: every square has perpendicular diagonals. The kite in region 3 shows the converse fails, and the rectangle (4) has diagonals that are not perpendicular. No square lies outside the rhombus region.
- id: geo-m2-r2-q10
  lesson: geo-deductive
  module_quiz: true
  topic: Deductive reasoning
  stem: 'You know the true statement "If two angles form a linear pair, then they are supplementary." Which conclusions are valid? Select all that apply.'
  choices:
    - '$\angle 1$ and $\angle 2$ form a linear pair, so they are supplementary.'
    - '$\angle 3$ and $\angle 4$ are supplementary, so they form a linear pair.'
    - '$\angle 5$ and $\angle 6$ are not supplementary, so they do not form a linear pair.'
    - '$\angle 7$ and $\angle 8$ do not form a linear pair, so they are not supplementary.'
  answer: [0, 2]
  explanation: |-
    The first is the Law of Detachment. The third uses the contrapositive ("if not supplementary, then not a linear pair"), which is true whenever the conditional is. The second affirms the consequent and the fourth uses the inverse: supplementary angles can sit in different places, such as $100^\circ$ and $80^\circ$ angles in two corners of a page.
- id: geo-m2-r2-q11
  lesson: geo-deductive
  type: text
  topic: Deductive reasoning
  stem: 'From "If $p$, then $q$" and "If $q$, then $r$", the Law of ___ lets you conclude "If $p$, then $r$."'
  accept: [Syllogism]
  explanation: |-
    The Law of Syllogism chains two conditionals when the conclusion of the first matches the hypothesis of the second.
# ---- Lesson 07: two-column and paragraph proofs
- id: geo-m2-r2-q12
  lesson: geo-proofs
  module_quiz: true
  type: order
  topic: Geometric proof
  stem: 'Put the statements of the proof of the Vertical Angles Theorem in order.'
  items:
    - '$\angle 1$ and $\angle 3$ are vertical angles.'
    - '$\angle 1$ and $\angle 2$ form a linear pair; $\angle 2$ and $\angle 3$ form a linear pair.'
    - '$\angle 1$ and $\angle 2$ are supplementary; $\angle 2$ and $\angle 3$ are supplementary.'
    - '$\angle 1 \cong \angle 3$'
  explanation: |-
    Given; definition of linear pair (opposite rays in the diagram); Linear Pair Postulate; Congruent Supplements Theorem. Each step needs the one before it: you can't call the angles supplementary until you know they form linear pairs.
- id: geo-m2-r2-q13
  lesson: geo-proofs
  type: text
  topic: Geometric proof
  stem: '$\angle A$ and $\angle B$ are complementary, and $\angle C$ and $\angle B$ are complementary. If $m\angle A = 28^\circ$, then $m\angle C$ is ___ degrees. Give only the number.'
  accept: ['28']
  explanation: |-
    By the Congruent Complements Theorem, complements of the same angle are congruent, so $m\angle C = m\angle A = 28^\circ$. (Directly: $m\angle B = 90^\circ - 28^\circ = 62^\circ$, so $m\angle C = 90^\circ - 62^\circ = 28^\circ$.)
- id: geo-m2-r2-q14
  lesson: geo-proofs
  type: match
  topic: Geometric proof
  stem: 'Given: $M$ is the midpoint of $\overline{AB}$. Prove: $AM = \tfrac{1}{2}AB$. Match each statement of the proof to its reason.'
  pairs:
    - ['$AM = MB$', Definition of midpoint]
    - ['$AM + MB = AB$', Segment Addition Postulate]
    - ['$AM + AM = AB$', Substitution property]
    - ['$AM = \tfrac{1}{2}AB$', Division property of equality]
  distractors: [Transitive property, Linear Pair Postulate]
  explanation: |-
    The definition of midpoint turns the geometry word into the equation $AM = MB$. Segment addition gives $AM + MB = AB$. Substituting $AM$ for $MB$ gives $AM + AM = AB$, that is $2 \cdot AM = AB$, and dividing both sides by 2 gives $AM = \tfrac12 AB$.
- id: geo-m2-r2-q15
  lesson: geo-proofs
  module_quiz: true
  topic: Geometric proof
  stem: 'Which of these may be used as a reason in a geometric proof? Select all that apply.'
  choices:
    - 'A definition'
    - 'A previously proved theorem'
    - 'The angles look congruent in the diagram'
    - 'The statement you are trying to prove'
    - 'A postulate'
  answer: [0, 1, 4]
  explanation: |-
    Allowed reasons are given information, definitions, postulates, properties and previously proved theorems. Appearance in a diagram is never a reason for a measure or congruence, and using the statement you are proving assumes the conclusion.
- id: geo-m2-r2-q16
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'In the flowchart version of the proof of the Vertical Angles Theorem, two arrows lead into the box "$\angle 1 \cong \angle 3$". Why two?'
  choices:
    - 'The theorem is proved twice, once from each side.'
    - 'Each arrow is a separate case, and either one alone would be enough.'
    - 'The Congruent Supplements Theorem needs both supplementary pairs.'
    - 'The arrows show the order in which the statements were discovered.'
  answer: 2
  explanation: |-
    Arrows show what each statement depends on. The Congruent Supplements Theorem needs two angles that are each supplementary to the same angle, so the conclusion depends on both "$\angle 1$ and $\angle 2$ are supplementary" and "$\angle 2$ and $\angle 3$ are supplementary".
# ---- Honors 07h1: symbolic logic
- id: geo-m2-r2-h01
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'How many rows does a truth table need for a compound statement built from $p$, $q$ and $r$?'
  choices: ['6', '8', '9', '3']
  answer: 1
  explanation: |-
    Each simple statement can be T or F, and each one doubles the number of cases: $2^3 = 8$. 6 comes from $2 \cdot 3$, 9 from $3^2$.
- id: geo-m2-r2-h02
  lesson: geo-m2-h-symbolic-logic
  type: text
  topic: Symbolic logic
  stem: 'A compound statement that is true in every row of its truth table, such as $p \vee \sim p$, is called a ___.'
  accept: [tautology, tautologies, a tautology]
  explanation: |-
    A tautology is true in every case. A statement that is false in every case, such as $p \wedge \sim p$, is a contradiction.
- id: geo-m2-r2-h03
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'When is the disjunction $p \vee q$ false?'
  choices: ['When exactly one part is false', 'When $p$ is false', 'When both parts are true', 'When both parts are false']
  answer: 3
  explanation: |-
    "Or" in logic is inclusive: $p \vee q$ is true when at least one part is true, including when both are. It is false only when both parts are false.
- id: geo-m2-r2-h04
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'Which is the negation of "If $\angle A$ is a right angle, then $m\angle A = 90^\circ$"?'
  choices:
    - '$\angle A$ is a right angle and $m\angle A \ne 90^\circ$.'
    - 'If $\angle A$ is not a right angle, then $m\angle A \ne 90^\circ$.'
    - 'If $\angle A$ is a right angle, then $m\angle A \ne 90^\circ$.'
    - 'If $m\angle A \ne 90^\circ$, then $\angle A$ is not a right angle.'
  answer: 0
  explanation: |-
    A conditional is false only when its hypothesis is true and its conclusion is false, so $\sim(p \to q) \equiv p \wedge \sim q$. The second choice is the inverse, the fourth is the contrapositive (equivalent to the original, not its negation), and the third is another conditional that is true whenever $\angle A$ is not a right angle.
- id: geo-m2-r2-h05
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'Which is the negation of "All rectangles are squares"?'
  choices: ['No rectangle is a square.', 'All squares are rectangles.', 'Some rectangle is not a square.', 'Some square is not a rectangle.']
  answer: 2
  explanation: |-
    To negate "All A are B", switch to "some" and negate what follows: some A is not B. "No rectangle is a square" is the opposite extreme, and it is false (a square is a rectangle), while the original is also false; a statement and its negation can't both be false. "All squares are rectangles" is the converse.
- id: geo-m2-r2-h06
  lesson: geo-m2-h-symbolic-logic
  type: match
  topic: Symbolic logic
  stem: 'Match each negation to an equivalent statement.'
  pairs:
    - ['$\sim(p \wedge q)$', not p or not q]
    - ['$\sim(p \vee q)$', not p and not q]
    - ['$\sim(p \to q)$', p and not q]
    - ['$\sim(\sim p)$', p]
  distractors: ['if not p, then not q']
  explanation: |-
    De Morgan's laws: "not both" is "at least one fails", and "not either" is "both fail". A conditional fails only when $p$ is true and $q$ is false. Negating twice returns the original. "If not $p$, then not $q$" is the inverse, which is not the negation of anything here.
- id: geo-m2-r2-h07
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'Which argument forms are valid? Select all that apply.'
  choices:
    - 'From $p \to q$ and $\sim q$, conclude $\sim p$.'
    - 'From $p \to q$ and $q$, conclude $p$.'
    - 'From $p \vee q$ and $\sim p$, conclude $q$.'
    - 'From $p \to q$ and $\sim p$, conclude $\sim q$.'
    - 'From $p \to q$ and $q \to r$, conclude $p \to r$.'
  answer: [0, 2, 4]
  explanation: |-
    Valid: modus tollens, disjunctive syllogism and the Law of Syllogism. The second is affirming the consequent and the fourth is denying the antecedent; in each, the row with $p$ false and $q$ true makes the premises true and the conclusion false.
- id: geo-m2-r2-h08
  lesson: geo-m2-h-symbolic-logic
  type: text
  topic: Symbolic logic
  stem: 'If $p$ is true, $q$ is false and $r$ is true, then $(p \vee q) \to (q \wedge r)$ is ___. (Type true or false.)'
  accept: ['false', 'F']
  explanation: |-
    $p \vee q$ is true (because $p$ is). $q \wedge r$ is false (because $q$ is). A conditional with a true hypothesis and a false conclusion is false.
- id: geo-m2-r2-h09
  lesson: geo-m2-h-symbolic-logic
  type: order
  topic: Symbolic logic
  stem: 'Put the steps of testing an argument with a truth table in order.'
  items:
    - 'List the simple statements in the argument.'
    - 'Write every combination of T and F as a row.'
    - 'Fill in a column for each premise and for the conclusion.'
    - 'Mark the rows where every premise is true.'
    - 'Check whether the conclusion is true in every marked row.'
  explanation: |-
    You can't write the rows until you know the statements, can't mark rows until the premise columns are filled in, and can only judge the conclusion in the marked rows. If it is true in all of them, the argument is valid; a marked row with a false conclusion is a counterexample.
- id: geo-m2-r2-h10
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: '"If two angles are vertical angles, then they are congruent. $\angle P$ and $\angle Q$ are not congruent. Therefore $\angle P$ and $\angle Q$ are not vertical angles." Which describes this argument?'
  choices:
    - 'Invalid: it denies the antecedent.'
    - 'Valid: it is modus tollens.'
    - 'Invalid: it affirms the consequent.'
    - 'Valid: it is the Law of Syllogism.'
  answer: 1
  explanation: |-
    The form is $p \to q$; $\sim q$; therefore $\sim p$. That is modus tollens, which is valid: it is detachment applied to the contrapositive "if not congruent, then not vertical".
- id: geo-m2-r2-h11
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'Which statement is logically equivalent to $p \to q$?'
  choices: ['$\sim p \vee q$', '$p \vee \sim q$', '$\sim p \wedge q$', '$q \to p$']
  answer: 0
  explanation: |-
    $\sim p \vee q$ is false only when $\sim p$ and $q$ are both false, that is, when $p$ is true and $q$ is false: exactly the row where $p \to q$ is false. $p \vee \sim q$ is equivalent to the converse $q \to p$, and $\sim p \wedge q$ is true in only one row.
- id: geo-m2-r2-h12
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: 'Which statements mean the same as "Not every angle in the figure is acute"? Select all that apply.'
  choices:
    - 'Some angle in the figure is not acute.'
    - 'There is at least one angle in the figure that is not acute.'
    - 'No angle in the figure is acute.'
    - 'Every angle in the figure is obtuse.'
  answer: [0, 1]
  explanation: |-
    "Not every A is B" is "some A is not B", which can also be said as "there is at least one A that is not B". "No angle is acute" and "every angle is obtuse" are much stronger: a figure with one right angle and two acute angles makes the original true but both of those false.
- id: geo-m2-r2-h13
  lesson: geo-m2-h-symbolic-logic
  topic: Symbolic logic
  stem: '"If a polygon has three sides, then it is a quadrilateral. Polygon $ABC$ has three sides. Therefore $ABC$ is a quadrilateral." Which describes this argument?'
  choices:
    - 'Invalid, because the conclusion is false'
    - 'Sound, because it uses modus ponens'
    - 'Invalid, because it affirms the consequent'
    - 'Valid but not sound, because a premise is false'
  answer: 3
  explanation: |-
    The form is modus ponens ($p \to q$; $p$; so $q$), so the argument is valid. But the first premise is false (a three-sided polygon is a triangle), so the argument is not sound, and its false conclusion is no surprise. A false conclusion does not by itself make an argument invalid.
# ---- Honors 07h2: proof strategies
- id: geo-m2-r2-h14
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'To prove "If $p$, then $q$" by contrapositive, which statement do you prove directly?'
  choices: ['If $q$, then $p$.', 'If not $p$, then not $q$.', 'If not $q$, then not $p$.', '$p$ and not $q$.']
  answer: 2
  explanation: |-
    The contrapositive $\sim q \to \sim p$ is logically equivalent to $p \to q$, so proving it proves the original. Proving the converse ($q \to p$) or the inverse proves nothing about the original, and "$p$ and not $q$" is the negation, which is what a proof by contradiction would assume.
- id: geo-m2-r2-h15
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'An indirect proof of "A triangle has at most one obtuse angle" begins by assuming what?'
  choices:
    - 'A triangle has at least two obtuse angles.'
    - 'A triangle has no obtuse angles.'
    - 'A triangle has exactly one obtuse angle.'
    - 'Every angle of a triangle is acute.'
  answer: 0
  explanation: |-
    An indirect proof assumes the negation of the statement. The negation of "at most one" is "at least two". (The contradiction comes in Module 4: two obtuse angles already add to more than $180^\circ$.)
- id: geo-m2-r2-h16
  lesson: geo-m2-h-proof-methods
  type: text
  topic: Proof methods
  stem: 'A proof by contradiction is also called an ___ proof.'
  accept: [indirect]
  explanation: |-
    It proves a statement indirectly, by showing that its negation leads to something impossible.
- id: geo-m2-r2-h17
  lesson: geo-m2-h-proof-methods
  type: order
  topic: Proof methods
  stem: 'Put the steps of the proof that $\sqrt{2}$ is irrational in order.'
  items:
    - 'Assume $\sqrt{2} = \tfrac{a}{b}$ with the fraction in lowest terms.'
    - 'Then $a^2 = 2b^2$, so $a^2$ is even and $a$ is even.'
    - 'Write $a = 2c$; then $b^2 = 2c^2$, so $b$ is even.'
    - 'Both $a$ and $b$ are even, which contradicts lowest terms.'
    - 'So $\sqrt{2}$ cannot be written as a fraction of whole numbers.'
  explanation: |-
    The assumption comes first, then the chain of consequences ($a$ even must be known before writing $a = 2c$, which is needed to show $b$ even), then the contradiction, then the conclusion that the assumption was false.
- id: geo-m2-r2-h18
  lesson: geo-m2-h-proof-methods
  type: match
  topic: Proof methods
  stem: 'Match each proof outline to its method.'
  pairs:
    - ['Assume the statement is false and reason until something impossible appears.', Proof by contradiction]
    - ['To show "if $p$, then $q$", show "if not $q$, then not $p$".', Proof by contrapositive]
    - ['Show the result separately for even $n$ and for odd $n$.', Proof by cases]
    - ['Start from the givens and chain forward to the conclusion.', Direct proof]
  distractors: [Mathematical induction]
  explanation: |-
    Contradiction assumes the negation; contrapositive proves the equivalent statement $\sim q \to \sim p$; cases split the possibilities and handle each; a direct proof goes straight from hypothesis to conclusion. Induction (base case plus inductive step) matches none of these outlines.
- id: geo-m2-r2-h19
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'You want to prove a fact about every angle $\angle A$ with $0^\circ < m\angle A \le 180^\circ$ by cases. Which lists of cases cover every possibility? Select all that apply.'
  choices:
    - '$m\angle A < 90^\circ$; $m\angle A \ge 90^\circ$'
    - '$m\angle A < 90^\circ$; $m\angle A > 90^\circ$'
    - '$\angle A$ is acute; right; obtuse; straight'
    - '$m\angle A \le 90^\circ$; $m\angle A \ge 90^\circ$'
  answer: [0, 2, 3]
  explanation: |-
    Cases must leave no gap; they may overlap. The first and third lists cover every measure from just above $0^\circ$ to $180^\circ$. The fourth overlaps at exactly $90^\circ$, which is allowed. The second misses the right angle, $m\angle A = 90^\circ$.
- id: geo-m2-r2-h20
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'What is the negation of "Neither $\angle 1$ nor $\angle 2$ is a right angle"?'
  choices:
    - 'Both $\angle 1$ and $\angle 2$ are right angles.'
    - 'At least one of $\angle 1$ and $\angle 2$ is a right angle.'
    - '$\angle 1$ is a right angle and $\angle 2$ is not.'
    - 'Neither $\angle 1$ nor $\angle 2$ is acute.'
  answer: 1
  explanation: |-
    "Neither is right" means "$\angle 1$ is not right and $\angle 2$ is not right". By De Morgan's law its negation is "$\angle 1$ is right or $\angle 2$ is right", that is, at least one is right. "Both are right" is only one of the ways that can happen.
- id: geo-m2-r2-h21
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'Which statement can be proved by giving a single example?'
  choices:
    - 'Every right angle measures $90^\circ$.'
    - 'All linear pairs are supplementary.'
    - 'No two vertical angles are supplementary.'
    - 'Some angle is congruent to its own complement.'
  answer: 3
  explanation: |-
    "Some angle is …" is an existential statement, so one example proves it: a $45^\circ$ angle has a $45^\circ$ complement. The two universal statements need general arguments. "No two vertical angles are supplementary" is a universal claim too, and it is false: two $90^\circ$ vertical angles are supplementary.
- id: geo-m2-r2-h22
  lesson: geo-m2-h-proof-methods
  type: text
  topic: Proof methods
  stem: 'In the proof that an odd number has an odd square, $n = 2k + 1$ gives $n^2 = 2m + 1$, where $m =$ ___ (write $m$ in terms of $k$).'
  accept: ['2k^2+2k', '2k²+2k', '2k+2k^2', '2k+2k²', '2k(k+1)', '2(k^2+k)', '2(k²+k)', '2k*k+2k', '2*k^2+2*k', '2k^2+2k^1']
  explanation: |-
    $n^2 = (2k + 1)^2 = 4k^2 + 4k + 1 = 2(2k^2 + 2k) + 1$, so $m = 2k^2 + 2k$. Since $m$ is a whole number, $n^2$ is one more than an even number, so it is odd.
- id: geo-m2-r2-h23
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'A student wants to prove "If two angles are congruent, then they are vertical angles." She correctly proves that vertical angles are congruent. What has she shown?'
  choices:
    - 'The original statement, by contrapositive'
    - 'The original statement, directly'
    - 'Only the converse, which says nothing about the original'
    - 'That the original statement is false'
  answer: 2
  explanation: |-
    She proved "if vertical, then congruent", the converse of her statement. A conditional and its converse are independent. Her original statement is in fact false (two congruent angles can be far apart), but proving the converse doesn't show that either.
- id: geo-m2-r2-h24
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'In the indirect proof that two distinct lines meet in at most one point, what does the assumption contradict?'
  choices:
    - 'The given fact that the lines are distinct, because exactly one line passes through two points'
    - 'The Linear Pair Postulate, because the lines would form a straight angle'
    - 'The Ruler Postulate, because the points would have no distance between them'
    - 'The definition of parallel lines, because the lines would not intersect'
  answer: 0
  explanation: |-
    Assuming the lines share two points $P$ and $Q$, both lines pass through $P$ and $Q$. Exactly one line does, so the two lines are the same, contradicting the given fact that they are distinct.
- id: geo-m2-r2-h25
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'A proof by cases shows $n^2 + n$ is even for every whole number $n$. Which fact finishes the case where $n$ is odd?'
  choices:
    - '$n^2$ is even.'
    - '$n + 1$ is even, so $n(n + 1)$ is even.'
    - '$n$ is even, so $n(n + 1)$ is even.'
    - '$n^2 + n$ is odd plus odd, which is odd.'
  answer: 1
  explanation: |-
    $n^2 + n = n(n + 1)$. If $n$ is odd, then $n + 1$ is even, and a product with an even factor is even. (Odd plus odd is actually even, so the last choice has its arithmetic wrong.)
- id: geo-m2-r2-h26
  lesson: geo-m2-h-proof-methods
  topic: Proof methods
  stem: 'Why does Example 1 of the lesson prove "if $\angle 1 \not\cong \angle 2$, then neither angle is right" by contrapositive instead of directly?'
  choices:
    - 'The statement is false, so it can''t be proved directly.'
    - 'A contrapositive proof is shorter than every direct proof.'
    - 'Direct proofs can''t use the Linear Pair Postulate.'
    - '"Not congruent" gives no equation to work with, but "one angle is right" gives $m = 90^\circ$.'
  answer: 3
  explanation: |-
    The contrapositive turns two negative statements into positive ones: "at least one angle is right" supplies a measure of $90^\circ$, and "congruent" is the goal. Contrapositive proofs aren't always shorter; they help when the negated conclusion gives you something concrete to use.
# ---- Honors 07h3: mathematical induction
- id: geo-m2-r2-h27
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'Which two parts make up a proof by mathematical induction?'
  choices:
    - 'Checking several cases and finding a pattern'
    - 'Assuming the statement is false and reaching a contradiction'
    - 'Proving the converse and the contrapositive'
    - 'A base case and an inductive step'
  answer: 3
  explanation: |-
    The base case proves the first case; the inductive step proves that each case implies the next. Checking cases is inductive reasoning, which proves nothing; the second choice describes proof by contradiction.
- id: geo-m2-r2-h28
  lesson: geo-m2-h-induction
  type: text
  topic: Mathematical induction
  stem: 'In the inductive step you assume that $P(k)$ is true. This assumption is called the inductive ___.'
  accept: [hypothesis]
  explanation: |-
    The inductive hypothesis is the "if" part of the conditional $P(k) \to P(k + 1)$ that the inductive step proves.
- id: geo-m2-r2-h29
  lesson: geo-m2-h-induction
  type: text
  topic: Mathematical induction
  stem: 'Ten lines are drawn in a plane so that no two are parallel and no three pass through one point. Into how many regions do they divide the plane? Give only the number.'
  accept: ['56']
  explanation: |-
    $R(n) = \tfrac{n(n+1)}{2} + 1$, so $R(10) = \tfrac{10 \cdot 11}{2} + 1 = 55 + 1 = 56$.
- id: geo-m2-r2-h30
  lesson: geo-m2-h-induction
  type: text
  topic: Mathematical induction
  stem: 'Find $1 + 3 + 5 + \dots + 39$. Give only the number.'
  accept: ['400']
  explanation: |-
    The last term $39 = 2n - 1$ gives $n = 20$ odd numbers, and the sum of the first $n$ odd numbers is $n^2 = 400$.
- id: geo-m2-r2-h31
  lesson: geo-m2-h-induction
  type: order
  topic: Mathematical induction
  stem: 'Put the inductive step for "$n$ points have $\tfrac{n(n-1)}{2}$ connecting segments" in order.'
  items:
    - 'Assume that $k$ points have $\tfrac{k(k-1)}{2}$ segments.'
    - 'Add one more point; it joins each of the $k$ old points, adding $k$ segments.'
    - 'So $k + 1$ points have $\tfrac{k(k-1)}{2} + k = \tfrac{(k+1)k}{2}$ segments.'
    - 'With the base case $n = 2$, the formula holds for every $n \ge 2$.'
  explanation: |-
    The step starts from the inductive hypothesis, counts what the new point adds, and simplifies to the formula for $k + 1$. Only then, together with the base case, does induction give the result for every $n$.
- id: geo-m2-r2-h32
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'Five lines in general position divide the plane into 16 regions. A sixth line is added, still in general position. How many new regions does it create?'
  choices: ['5', '7', '6', '16']
  answer: 2
  explanation: |-
    The new line crosses the 5 old lines at 5 different points, which cut it into 6 pieces. Each piece splits a region in two, so it adds 6 regions: $16 + 6 = 22 = \tfrac{6 \cdot 7}{2} + 1$. Answering 5 counts crossing points instead of pieces.
- id: geo-m2-r2-h33
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'The formula $\tfrac{n(n+1)}{2} + 1$ for the regions made by $n$ lines needs which conditions? Select all that apply.'
  choices:
    - 'No two of the lines are parallel.'
    - 'No three of the lines pass through one point.'
    - 'All of the lines pass through one common point.'
    - 'Every pair of lines is perpendicular.'
  answer: [0, 1]
  explanation: |-
    The inductive step needs the new line to cross every old line (no parallels) at points that are all different (no three concurrent). If all lines passed through one point, $n$ lines would make only $2n$ regions, and three or more lines can't all be pairwise perpendicular in a plane.
- id: geo-m2-r2-h34
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'A student "proves" that $n^2 + n + 1$ is even for every $n \ge 1$. Her inductive step correctly shows that if $k^2 + k + 1$ is even, so is $(k+1)^2 + (k+1) + 1$. What is wrong?'
  choices:
    - 'The base case fails: $1^2 + 1 + 1 = 3$ is odd.'
    - 'The inductive step is wrong, because $2k + 2$ is odd.'
    - 'Induction can''t be used for statements about even numbers.'
    - 'Nothing; the statement is true.'
  answer: 0
  explanation: |-
    The step is fine: $(k+1)^2 + (k+1) + 1 = (k^2 + k + 1) + (2k + 2)$, and $2k + 2$ is even. But the base case is false, so the dominoes never start. In fact $n^2 + n = n(n+1)$ is always even, so $n^2 + n + 1$ is always odd.
- id: geo-m2-r2-h35
  lesson: geo-m2-h-induction
  type: match
  topic: Mathematical induction
  stem: 'Match each count to its formula.'
  pairs:
    - ['Segments joining every pair of $n$ points', 'n(n − 1)/2']
    - ['Regions made by $n$ lines in general position', 'n(n + 1)/2 + 1']
    - ['Sum of the first $n$ odd numbers', 'n squared']
  distractors: ['2 to the power n − 1']
  explanation: |-
    These are the three results proved by induction in the lesson. Powers of 2 come from the doubling pattern, which looked right for small cases but fails for both the lines and the circle regions.
- id: geo-m2-r2-h36
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'Suppose the base case $P(1)$ and the inductive step are proved, but $P(n)$ fails for some $n$. Let $m$ be the smallest such $n$. Why is that impossible?'
  choices:
    - 'Because $m$ would have to be negative'
    - 'Because $P(m - 1)$ is true, and the inductive step then makes $P(m)$ true'
    - 'Because the inductive hypothesis assumes $P(m)$ is true'
    - 'Because there is no smallest whole number'
  answer: 1
  explanation: |-
    $m \ne 1$ because the base case holds, so $m - 1 \ge 1$. Since $m$ is the smallest failure, $P(m - 1)$ is true, and the inductive step gives $P(m)$, a contradiction. The argument relies on the well-ordering principle: every nonempty set of whole numbers does have a smallest member.
- id: geo-m2-r2-h37
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'Seven points on a circle are joined in every possible way, with no three chords meeting at one point. Using $1 + \tfrac{n(n-1)}{2} + \tfrac{n(n-1)(n-2)(n-3)}{24}$, how many regions are inside the circle?'
  choices: ['64', '63', '42', '57']
  answer: 3
  explanation: |-
    $1 + \tfrac{7 \cdot 6}{2} + \tfrac{7 \cdot 6 \cdot 5 \cdot 4}{24} = 1 + 21 + 35 = 57$. The doubling pattern would predict $2^6 = 64$, which is wrong.
- id: geo-m2-r2-h38
  lesson: geo-m2-h-induction
  type: text
  topic: Mathematical induction
  stem: 'A 5-by-5 square of unit squares is turned into a 6-by-6 square by adding an L-shaped layer. How many unit squares are in the layer? Give only the number.'
  accept: ['11']
  explanation: |-
    The layer around a $k$-by-$k$ square has $2k + 1$ squares: here $2 \cdot 5 + 1 = 11$. Check: $36 - 25 = 11$.
- id: geo-m2-r2-h39
  lesson: geo-m2-h-induction
  topic: Mathematical induction
  stem: 'The joke "proof" that all horses are the same color says: in a group of $k + 1$ horses, the first $k$ match and the last $k$ match, and the two groups overlap, so all match. For which step does this break?'
  choices:
    - 'From 2 horses to 3'
    - 'From 5 horses to 6'
    - 'From 1 horse to 2'
    - 'It never breaks; the base case is the problem.'
  answer: 2
  explanation: |-
    With $k + 1 = 2$ horses, "the first 1" and "the last 1" are different horses with no overlap, so nothing links their colors. For larger groups the overlap exists, but one broken link is enough to stop the chain. The base case (one horse matches itself) is fine.
