# Honors module geo-h1 (Constructions and classic theorems), round 2
# Lesson 90: What compass and straightedge can build
- id: geo-h1-r2-h01
  lesson: geo-h1-constructible
  module_quiz: true
  topic: Constructible lengths
  stem: 'In the product construction, $OU = 1$ and $OB = b$ on one side of an angle, $OA = a$ on the other, and the line through $B$ parallel to $\overline{UA}$ meets the second side at $P$. Why is $OP = ab$?'
  choices: ['Triangles $OUA$ and $OBP$ are similar, so $\tfrac{OP}{OA} = \tfrac{OB}{OU}$', 'Triangles $OUA$ and $OBP$ are congruent by SAS', '$\overline{BP}$ is the perpendicular bisector of $\overline{UA}$', '$OP$ is the geometric mean of $OA$ and $OB$']
  answer: 0
  explanation: 'The parallel lines make corresponding angles congruent, and the triangles share $\angle O$, so $\triangle OUA \sim \triangle OBP$ by AA. Then $\tfrac{OP}{a} = \tfrac{b}{1}$, so $OP = ab$. The triangles are different sizes, so they aren''t congruent; the parallel isn''t a perpendicular bisector; and the geometric mean $\sqrt{ab}$ comes from the semicircle construction, not this one.'
- id: geo-h1-r2-h02
  lesson: geo-h1-constructible
  topic: Constructible lengths
  stem: 'Points $A$, $B$, $C$ lie on a line in that order with $AB = 7$ and $BC = 1$. A semicircle is drawn on diameter $\overline{AC}$, and the perpendicular at $B$ meets it at $D$. What is $BD$?'
  choices: ['$4$', '$\sqrt7$', '$\tfrac72$', '$\sqrt8$']
  answer: 1
  explanation: '$\angle ADC$ is inscribed in a semicircle, so it is right, and $\overline{DB}$ is the altitude to the hypotenuse: $BD = \sqrt{AB \cdot BC} = \sqrt{7 \cdot 1} = \sqrt7$. The radius is $\tfrac{8}{2} = 4$ (that''s the height above the center $M$, not above $B$); $\tfrac72$ halves $AB$; $\sqrt8$ uses the whole diameter.'
- id: geo-h1-r2-h03
  lesson: geo-h1-constructible
  module_quiz: true
  topic: Impossible constructions
  stem: 'Starting from a unit segment, which length can NOT be constructed with compass and straightedge?'
  choices: ['$\sqrt{2 + \sqrt3}$', '$\tfrac{1 + \sqrt5}{2}$', '$\sqrt[3]{2}$', '$\tfrac{3}{\sqrt7}$']
  answer: 2
  explanation: 'Constructible numbers are exactly those reached from 1 by $+$, $-$, $\times$, $\div$ and square roots. The other three use only those operations. $\sqrt[3]{2}$ is a root of $x^3 - 2 = 0$, a cubic with no rational root, so it is not constructible; that is why doubling the cube is impossible.'
- id: geo-h1-r2-h04
  lesson: geo-h1-constructible
  topic: Impossible constructions
  stem: 'Why is it impossible to square a circle (construct a square with the same area as a given circle) with compass and straightedge?'
  choices: ['$\pi$ is irrational, and no irrational length can be constructed', 'A square and a circle can never have equal areas', 'No method has been found yet, though one may exist', '$\pi$ is transcendental: it is not a root of any polynomial equation with rational coefficients']
  answer: 3
  explanation: 'A unit circle has area $\pi$, so the square''s side would be $\sqrt\pi$. Every constructible number is a root of a polynomial with rational coefficients, and Lindemann proved in 1882 that $\pi$ is not. Irrational alone isn''t the reason: $\sqrt2$ is irrational and constructible. Squares with area $\pi$ certainly exist; they just can''t be built with these tools, and that is proved, not merely unknown.'
- id: geo-h1-r2-h05
  lesson: geo-h1-constructible
  module_quiz: true
  topic: Impossible constructions
  stem: 'Which statement about trisecting angles with compass and straightedge is correct?'
  choices: ['Some angles, such as $90^\circ$, can be trisected, but no method trisects every angle', 'No angle can ever be trisected with compass and straightedge', 'Every angle can be trisected, but the method is very long', 'Every acute angle can be trisected; only obtuse angles cause trouble']
  answer: 0
  explanation: 'Trisecting $90^\circ$ means constructing $30^\circ$, which is easy. But trisecting $60^\circ$ needs $\cos 20^\circ$, a root of $8c^3 - 6c - 1 = 0$, which has no rational root, so it is not constructible. Since $60^\circ$ is acute, the last choice is false too.'
- id: geo-h1-r2-h06
  lesson: geo-h1-constructible
  topic: Impossible constructions
  stem: 'By the Gauss–Wantzel theorem, which regular polygon can be constructed with compass and straightedge?'
  choices: ['9 sides', '17 sides', '7 sides', '18 sides']
  answer: 1
  explanation: '17 is a Fermat prime ($2^{2^2} + 1$), so the 17-gon is constructible, as Gauss found in 1796. 7 is a prime but not a Fermat prime. $9 = 3 \cdot 3$ and $18 = 2 \cdot 3 \cdot 3$ repeat the Fermat prime 3, so they fail the "distinct" condition.'
- id: geo-h1-r2-h07
  lesson: geo-h1-constructible
  topic: Impossible constructions
  stem: 'Trisecting a $60^\circ$ angle means constructing $c = \cos 20^\circ$. Using $\cos 3\theta = 4\cos^3\theta - 3\cos\theta$, which equation does $c$ satisfy?'
  choices: ['$4c^3 - 3c - 1 = 0$', '$8c^3 - 6c + 1 = 0$', '$8c^3 - 6c - 1 = 0$', '$4c^3 - 3c = 0$']
  answer: 2
  explanation: 'With $\theta = 20^\circ$, $4c^3 - 3c = \cos 60^\circ = \tfrac12$. Multiply by 2 and move everything to one side: $8c^3 - 6c - 1 = 0$. Setting the left side equal to 1 or 0 uses the wrong value of $\cos 60^\circ$, and $8c^3 - 6c + 1 = 0$ would mean $\cos 3\theta = -\tfrac12$.'
- id: geo-h1-r2-h08
  lesson: geo-h1-constructible
  topic: Constructible lengths
  stem: 'To divide $\overline{AB}$ into 7 congruent parts, you step off 7 equal segments along a ray from $A$, ending at $X_7$, and draw $\overline{X_7B}$. What comes next?'
  choices: ['Bisect $\overline{AB}$ repeatedly', 'Draw perpendiculars to $\overline{AB}$ through the six other marks', 'Draw circles through $B$ centered at the six other marks', 'Draw parallels to $\overline{X_7B}$ through the six other marks']
  answer: 3
  explanation: 'By the Side Splitter Theorem, lines parallel to $\overline{X_7B}$ cut $\overline{AB}$ in the same ratios as they cut $\overline{AX_7}$, which is in 7 equal pieces. Repeated bisection only gives 2, 4, 8, … parts, and perpendiculars to $\overline{AB}$ through the marks don''t produce equal pieces in general.'
- id: geo-h1-r2-h09
  lesson: geo-h1-constructible
  topic: Impossible constructions
  stem: 'Which angle can be constructed with compass and straightedge?'
  choices: ['$12^\circ$', '$20^\circ$', '$10^\circ$', '$40^\circ$']
  answer: 0
  explanation: 'A whole number of degrees is constructible exactly when it is a multiple of $3^\circ$. $12^\circ$ is the central angle of a regular 30-gon, and $30 = 2 \cdot 3 \cdot 5$ is allowed by Gauss–Wantzel. $20^\circ$ would trisect $60^\circ$; $10^\circ$ doubled and $40^\circ$ halved would give $20^\circ$, so none of them is constructible.'
- id: geo-h1-r2-h10
  lesson: geo-h1-constructible
  module_quiz: true
  topic: Constructible lengths
  type: text
  stem: 'A length that can be built from a unit segment in finitely many compass-and-straightedge steps is called a ___ number.'
  accept: [constructible, constructable]
  explanation: 'Constructible numbers are exactly those reached from 1 by adding, subtracting, multiplying, dividing and taking square roots.'
- id: geo-h1-r2-h11
  lesson: geo-h1-constructible
  topic: Impossible constructions
  stem: 'Which regular polygons can be constructed with compass and straightedge? Select all that apply.'
  choices: ['Regular pentagon', 'Regular heptagon (7 sides)', 'Regular 15-gon', 'Regular 9-gon', 'Regular 20-gon']
  answer: [0, 2, 4]
  explanation: 'Gauss–Wantzel: $n$ must be a power of 2 times distinct Fermat primes (3, 5, 17, 257, 65537). $5$, $15 = 3 \cdot 5$ and $20 = 4 \cdot 5$ qualify. 7 is not a Fermat prime, and $9 = 3 \cdot 3$ repeats one.'
- id: geo-h1-r2-h12
  lesson: geo-h1-constructible
  module_quiz: true
  topic: Impossible constructions
  type: match
  stem: 'Match each classical problem to the length it would require.'
  pairs:
    - [Doubling a cube with edge 1, The cube root of 2]
    - ['Trisecting a $60^\circ$ angle', cos 20°]
    - [Squaring a circle of radius 1, The square root of π]
  distractors: [The golden ratio]
  explanation: 'Doubling the cube needs $x^3 = 2$; trisecting $60^\circ$ needs $\cos 20^\circ$, a root of $8c^3 - 6c - 1 = 0$; squaring the unit circle needs a side of $\sqrt\pi$. The golden ratio $\tfrac{1 + \sqrt5}{2}$ is constructible and belongs to the regular pentagon.'
- id: geo-h1-r2-h13
  lesson: geo-h1-constructible
  topic: Impossible constructions
  type: order
  stem: 'Put these events in the history of constructions in order, earliest first.'
  items: ['Euclid''s Elements collects the classical constructions (about 300 BCE)', 'Gauss finds that the regular 17-gon is constructible (1796)', 'Wantzel proves that trisection and doubling the cube are impossible (1837)', 'Lindemann proves that $\pi$ is transcendental (1882)']
  explanation: 'Euclid wrote around 300 BCE. Gauss found the 17-gon at 18, in 1796. Wantzel''s 1837 paper settled trisection and cube doubling and completed the polygon theorem. Lindemann''s 1882 proof about $\pi$ settled squaring the circle.'
- id: geo-h1-r2-h14
  lesson: geo-h1-constructible
  topic: Constructible lengths
  type: label
  stem: 'This is the square root construction, with $AB = a$ and $BC = 1$. Name the numbered parts.'
  image: {src: images/geo-h1-sqrt-blank.svg, alt: 'A semicircle on diameter AC with a perpendicular segment rising from a point on AC to the semicircle; four numbered markers'}
  labels:
    - {x: 72.2, y: 28.1, text: Point where the perpendicular meets the semicircle}
    - {x: 50, y: 78.1, text: Center of the semicircle}
    - {x: 72.2, y: 53.1, text: Segment of length √a}
    - {x: 79.6, y: 78.1, text: Unit segment}
  distractors: [Segment of length (a + 1)/2, Endpoint of the diameter]
  explanation: 'The diameter $\overline{AC}$ is split at $B$ into $AB = a$ (the long piece) and $BC = 1$. The center is the midpoint of $\overline{AC}$. The perpendicular at $B$ meets the semicircle at $D$, and $BD = \sqrt{a \cdot 1} = \sqrt a$ by the geometric mean theorem. The radius would be $\tfrac{a + 1}{2}$.'
# Lesson 91: Ceva's and Menelaus's theorems
- id: geo-h1-r2-h15
  lesson: geo-h1-ceva-menelaus
  module_quiz: true
  topic: Ceva's theorem
  stem: 'Which segment is always a cevian of $\triangle ABC$?'
  choices: ['A midsegment', 'A median', 'A segment through the centroid parallel to a side', 'The segment from the circumcenter to the orthocenter']
  answer: 1
  explanation: 'A cevian joins a vertex to a point on the opposite side, and a median joins a vertex to the midpoint of the opposite side. A midsegment joins two midpoints, and the other two segments don''t start at a vertex.'
- id: geo-h1-r2-h16
  lesson: geo-h1-ceva-menelaus
  module_quiz: true
  topic: Ceva's theorem
  stem: 'Cevians $\overline{AD}$, $\overline{BE}$, $\overline{CF}$ of $\triangle ABC$ are concurrent. $AF = 2$, $FB = 3$, $BD = 4$ and $DC = 6$. Find $\tfrac{CE}{EA}$.'
  choices: ['$\tfrac49$', '$\tfrac32$', '$\tfrac94$', '$1$']
  answer: 2
  explanation: '$\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} = \tfrac23 \cdot \tfrac46 = \tfrac49$, so Ceva needs $\tfrac{CE}{EA} = \tfrac94$ to make the product 1. $\tfrac49$ is the product itself (the reciprocal of what''s needed), and $\tfrac32$ is just $\tfrac{FB}{AF}$.'
- id: geo-h1-r2-h17
  lesson: geo-h1-ceva-menelaus
  topic: Menelaus's theorem
  stem: 'Points $D$, $E$, $F$ on lines $BC$, $CA$, $AB$ lie on one straight line, and none of them is a vertex. How many of the three can lie on the sides themselves (rather than on extensions)?'
  choices: ['All three', 'Exactly one', 'Exactly three or exactly one', 'Exactly two, or none']
  answer: 3
  explanation: 'A line that misses the vertices either crosses two sides and the extension of the third, or misses the triangle and meets all three extensions. It can''t cross all three sides. So two or none of the points are on the sides (one or three on extensions).'
- id: geo-h1-r2-h18
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  stem: 'The cevians to the incircle''s touch points meet at the Gergonne point. Why is this point usually not the incenter?'
  choices: ['$\overline{AD}$ bisects $\angle A$ only when $AB = AC$, so these cevians are usually not angle bisectors', 'The Gergonne point always lies outside the triangle', 'The two tangent segments from a vertex are usually unequal', 'The cevians to the touch points are never concurrent']
  answer: 0
  explanation: 'The incenter is where the angle bisectors meet. The cevian from $A$ to the touch point $D$ divides $\overline{BC}$ into the tangent lengths from $B$ and $C$, which match the angle-bisector split only for isosceles triangles. The tangent segments from one vertex are always equal (that''s what proves concurrency), and the point is inside the triangle.'
- id: geo-h1-r2-h19
  lesson: geo-h1-ceva-menelaus
  module_quiz: true
  topic: Menelaus's theorem
  stem: 'A line crosses side $\overline{AB}$ of $\triangle ABC$ at $F$, side $\overline{AC}$ at $E$, and the extension of $\overline{BC}$ beyond $C$ at $D$. $AF = 6$, $FB = 3$, $BC = 8$, $CD = 4$ and $AC = 14$. Find $CE$.'
  choices: ['$12$', '$2$', '$\tfrac{14}{5}$', '$7$']
  answer: 1
  explanation: '$BD = 8 + 4 = 12$, so $\tfrac{BD}{DC} = 3$, and $\tfrac{AF}{FB} = 2$. Menelaus: $2 \cdot 3 \cdot \tfrac{CE}{EA} = 1$, so $\tfrac{CE}{EA} = \tfrac16$ and $CE = \tfrac{14}{7} = 2$. 12 is $EA$; $\tfrac{14}{5}$ comes from using $BD = 8$; 7 just halves $AC$.'
- id: geo-h1-r2-h20
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  stem: 'In acute $\triangle ABC$, $a = BC$, $b = CA$, $c = AB$, and $D$ is the foot of the altitude from $A$. Which expression equals $BD$?'
  choices: ['$b\cos C$', '$c\sin B$', '$c\cos B$', '$a\cos B$']
  answer: 2
  explanation: 'In right triangle $ABD$, the hypotenuse is $AB = c$ and $BD$ is the side next to $\angle B$, so $BD = c\cos B$. $b\cos C$ is the other piece, $DC$; $c\sin B$ is the altitude $AD$; $a\cos B$ uses the wrong hypotenuse.'
- id: geo-h1-r2-h21
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  stem: 'In the Ceva proof that the angle bisectors are concurrent, the bisector from $A$ meets $\overline{BC}$ at $D$. What is $\tfrac{BD}{DC}$?'
  choices: ['$\tfrac{AC}{AB}$', '$\tfrac{BC}{AB}$', '$1$', '$\tfrac{AB}{AC}$']
  answer: 3
  explanation: 'The Triangle Angle Bisector Theorem: the bisector divides the opposite side in the ratio of the adjacent sides, with $BD$ next to $AB$: $\tfrac{BD}{DC} = \tfrac{AB}{AC}$. The ratio is 1 only when $AB = AC$, and $\tfrac{AC}{AB}$ is upside down.'
- id: geo-h1-r2-h22
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  stem: 'A student writes the condition for concurrent cevians as $\tfrac{AF}{FB} \cdot \tfrac{DC}{BD} \cdot \tfrac{CE}{EA} = 1$. What is wrong?'
  choices: ['The middle ratio is upside down; going around the triangle in order it must be $\tfrac{BD}{DC}$', 'The ratios should be added, not multiplied', 'Each ratio should compare a piece to the whole side', 'The product should be 0 for concurrent cevians']
  answer: 0
  explanation: 'The letters go around $A \to F \to B \to D \to C \to E \to A$, so each ratio starts where the last ended: $\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} \cdot \tfrac{CE}{EA}$. Flipping one ratio gives a different condition that is wrong in general. The other choices describe no version of the theorem.'
- id: geo-h1-r2-h23
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  stem: 'In $\triangle ABC$, $F$ is the midpoint of $\overline{AB}$ and $D$ is on $\overline{BC}$ with $BD = 2\,DC$. Where must $E$ be on $\overline{CA}$ for $\overline{AD}$, $\overline{BE}$, $\overline{CF}$ to be concurrent?'
  choices: ['$\tfrac{CE}{EA} = 2$', '$\tfrac{CE}{EA} = 1$', '$\tfrac{CE}{EA} = \tfrac12$', '$\tfrac{CE}{EA} = \tfrac13$']
  answer: 2
  explanation: 'Ceva: $1 \cdot 2 \cdot \tfrac{CE}{EA} = 1$, so $\tfrac{CE}{EA} = \tfrac12$: $E$ is one-third of the way from $C$ to $A$. 2 copies the other ratio instead of undoing it; 1 would make $\overline{BE}$ a median, which doesn''t pass through the same point.'
- id: geo-h1-r2-h24
  lesson: geo-h1-ceva-menelaus
  module_quiz: true
  topic: Ceva's theorem
  type: text
  stem: 'A segment from a vertex of a triangle to a point on the opposite side is called a ___.'
  accept: [cevian, cevians]
  explanation: 'Cevians are named after Giovanni Ceva. Medians, angle bisectors and (in acute triangles) altitudes are special cevians.'
- id: geo-h1-r2-h25
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  type: text
  stem: 'Cevians $\overline{AD}$, $\overline{BE}$, $\overline{CF}$ are concurrent, with $AF = 4$, $FB = 4$, $BD = 6$ and $DC = 3$. Then $\tfrac{CE}{EA} =$ ___. (Give a number or fraction.)'
  accept: ['1/2']
  explanation: '$\tfrac{AF}{FB} = 1$ and $\tfrac{BD}{DC} = 2$, so Ceva gives $1 \cdot 2 \cdot \tfrac{CE}{EA} = 1$ and $\tfrac{CE}{EA} = \tfrac12$ (0.5 is also accepted).'
- id: geo-h1-r2-h26
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  type: match
  stem: 'Ceva''s theorem proves each set of cevians concurrent. Match each set to the fact that makes the ratio product equal 1.'
  pairs:
    - [Medians, Each foot is a midpoint so every ratio is 1]
    - [Angle bisectors, Each foot divides its side in the ratio of the adjacent sides]
    - [Altitudes of an acute triangle, Each piece of a side is a side length times a cosine]
    - [Cevians to the incircle's touch points, Two tangent segments from a vertex are equal]
  distractors: [Each foot is equally far from all three vertices]
  explanation: 'Medians: $1 \cdot 1 \cdot 1$. Bisectors: $\tfrac ba \cdot \tfrac cb \cdot \tfrac ac$. Altitudes: $BD = c\cos B$ and so on, and the cosines cancel. Touch points: $\tfrac xy \cdot \tfrac yz \cdot \tfrac zx$ with equal tangent lengths $x$, $y$, $z$.'
- id: geo-h1-r2-h27
  lesson: geo-h1-ceva-menelaus
  module_quiz: true
  topic: Ceva's theorem
  stem: 'Which sets of three cevians of a triangle are always concurrent? Select all that apply.'
  choices: ['The three medians', 'The three angle bisectors', 'Three cevians with $\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} \cdot \tfrac{CE}{EA} = 1$', 'Three cevians with $\tfrac{AF}{FB} = \tfrac{BD}{DC} = \tfrac{CE}{EA} = 2$', 'Three cevians with $\tfrac{AF}{FB} = \tfrac{BD}{DC} = \tfrac{CE}{EA} = \tfrac12$']
  answer: [0, 1, 2]
  explanation: 'Medians and angle bisectors give product 1, and the converse of Ceva''s theorem says any product of 1 means concurrency. If every ratio is 2, the product is 8; if every ratio is $\tfrac12$, it is $\tfrac18$. Neither is 1, so those cevians form a small triangle instead of meeting at a point.'
- id: geo-h1-r2-h28
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  type: order
  stem: 'Put the steps of the proof of the converse of Ceva''s theorem in order.'
  items: ['Assume $\tfrac{AF}{FB} \cdot \tfrac{BD}{DC} \cdot \tfrac{CE}{EA} = 1$', 'Let $\overline{AD}$ and $\overline{BE}$ meet at $P$', 'Let ray $CP$ meet $\overline{AB}$ at $F''$', 'Apply the first part of Ceva''s theorem to the three cevians through $P$', 'Conclude $\tfrac{AF''}{F''B} = \tfrac{AF}{FB}$, so $F'' = F$']
  explanation: 'You need $P$ before you can draw ray $CP$, and $F''$ before applying the forward theorem to the cevians through $P$. Comparing the two products shows $F''$ and $F$ divide $\overline{AB}$ in the same ratio, so they are the same point.'
- id: geo-h1-r2-h29
  lesson: geo-h1-ceva-menelaus
  topic: Ceva's theorem
  type: label
  stem: 'Name the numbered parts of this figure.'
  image: {src: images/geo-h1-ceva-blank.svg, alt: 'A triangle ABC with three segments from the vertices to the opposite sides, all meeting at one interior point; five numbered markers'}
  labels:
    - {x: 54.3, y: 56.8, text: Point where the three cevians meet}
    - {x: 73, y: 74.6, text: Cevian}
    - {x: 66.4, y: 47.5, text: Foot of a cevian}
    - {x: 74.5, y: 89.2, text: Side of the triangle}
    - {x: 50, y: 16.2, text: Vertex}
  distractors: [Midsegment, Transversal]
  explanation: 'Each cevian runs from a vertex to its foot on the opposite side, and the three cevians here meet at one point. No segment in the figure joins two midpoints (a midsegment), and no single line crosses all three side lines (a transversal).'
# Lesson 92: The Euler line and the nine-point circle
- id: geo-h1-r2-h30
  lesson: geo-h1-nine-point
  module_quiz: true
  topic: Euler line
  stem: 'In a triangle that is not equilateral, in what order do the circumcenter $O$, centroid $G$, nine-point center $N$ and orthocenter $H$ lie along the Euler line?'
  choices: ['$O$, $N$, $G$, $H$', '$O$, $G$, $H$, $N$', '$O$, $G$, $N$, $H$', '$G$, $O$, $N$, $H$']
  answer: 2
  explanation: '$OG = \tfrac13 OH$ and $ON = \tfrac12 OH$, so starting from $O$ you reach $G$ first, then $N$ (the midpoint), then $H$. The distances are $OG : GN : NH = 2 : 1 : 3$.'
- id: geo-h1-r2-h31
  lesson: geo-h1-nine-point
  module_quiz: true
  topic: Euler line
  stem: 'A triangle has circumcenter $O(1, 2)$ and centroid $G(3, 4)$. Where is its orthocenter?'
  choices: ['$(7, 8)$', '$(5, 6)$', '$(2, 3)$', '$(8, 10)$']
  answer: 0
  explanation: '$H = 3G - 2O = (9 - 2,\ 12 - 4) = (7, 8)$. Check: $G$ is one-third of the way from $O$ to $H$: $(1 + \tfrac{6}{3},\ 2 + \tfrac63) = (3, 4)$. $(5, 6) = 2G - O$ puts $G$ at the midpoint; $(2, 3)$ is the midpoint of $\overline{OG}$; $(8, 10) = 3G - O$.'
- id: geo-h1-r2-h32
  lesson: geo-h1-nine-point
  topic: Nine-point circle
  stem: 'A triangle has circumradius 10. What is the radius of its nine-point circle?'
  choices: ['$10$', '$20$', '$\tfrac{10}{3}$', '$5$']
  answer: 3
  explanation: 'The nine-point circle is the circumcircle dilated by $\tfrac12$ from $H$, so its radius is $\tfrac R2 = 5$. The factor $\tfrac13$ belongs to the position of $G$, not to the radius.'
- id: geo-h1-r2-h33
  lesson: geo-h1-nine-point
  topic: Euler line
  stem: 'The map $T$ (a half-turn about $G$ followed by a dilation by $\tfrac12$ from $G$) sends $A$ to the midpoint $D$ of $\overline{BC}$. Where does it send the altitude from $A$?'
  choices: ['To the median from $A$', 'To the perpendicular bisector of $\overline{BC}$', 'To the line $EF$', 'To the bisector of $\angle A$']
  answer: 1
  explanation: '$T$ sends lines to parallel lines. The altitude from $A$ is perpendicular to $\overline{BC}$, so its image is perpendicular to $\overline{BC}$ and passes through $T(A) = D$, the midpoint: the perpendicular bisector of $\overline{BC}$. That is why $T(H) = O$.'
- id: geo-h1-r2-h34
  lesson: geo-h1-nine-point
  topic: Nine-point circle
  stem: 'Which point is generally NOT on the nine-point circle of $\triangle ABC$?'
  choices: ['The midpoint of $\overline{AB}$', 'The foot of the altitude from $C$', 'The centroid $G$', 'The midpoint of $\overline{CH}$']
  answer: 2
  explanation: 'The nine points are the three side midpoints, the three feet of the altitudes and the three midpoints of $\overline{AH}$, $\overline{BH}$, $\overline{CH}$. The centroid is on the Euler line with the circle''s center, but it is not on the circle.'
- id: geo-h1-r2-h35
  lesson: geo-h1-nine-point
  module_quiz: true
  topic: Nine-point circle
  stem: 'A right triangle has legs 9 and 12. What is the radius of its nine-point circle?'
  choices: ['$3.75$', '$7.5$', '$2.5$', '$15$']
  answer: 0
  explanation: 'The hypotenuse is $\sqrt{81 + 144} = 15$, and the circumcenter is its midpoint, so $R = 7.5$. The nine-point radius is $\tfrac R2 = 3.75$. 7.5 is $R$ itself (and also $OH$), and 2.5 is $OG = \tfrac13 OH$.'
- id: geo-h1-r2-h36
  lesson: geo-h1-nine-point
  topic: Euler line
  stem: 'On the Euler line of a triangle, $OH = 12$. How far is the centroid $G$ from the nine-point center $N$?'
  choices: ['$4$', '$6$', '$3$', '$2$']
  answer: 3
  explanation: '$OG = \tfrac13 \cdot 12 = 4$ and $ON = \tfrac12 \cdot 12 = 6$, so $GN = 6 - 4 = 2$. In general $OG : GN : NH = 2 : 1 : 3$, and here $4 : 2 : 6$.'
- id: geo-h1-r2-h37
  lesson: geo-h1-nine-point
  topic: Nine-point circle
  stem: 'In the proof of the nine-point circle, the dilation centered at $H$ with scale factor $\tfrac12$ sends vertex $A$ to which point?'
  choices: ['The midpoint of $\overline{BC}$', 'The midpoint of $\overline{AH}$', 'The foot of the altitude from $A$', 'The point of the circumcircle opposite $A$']
  answer: 1
  explanation: 'A dilation from $H$ by $\tfrac12$ sends each point to the midpoint of its segment to $H$, so $A$ goes to the midpoint of $\overline{AH}$, one of the Euler points. The side midpoint $D$ is the image of $A^*$, the point opposite $A$.'
- id: geo-h1-r2-h38
  lesson: geo-h1-nine-point
  topic: Nine-point circle
  stem: '$A^*$ is the point of the circumcircle diametrically opposite $A$. Why is $BHCA^*$ a parallelogram?'
  choices: ['$\overline{BA^*}$ and $\overline{CH}$ are both perpendicular to $\overline{AB}$, and $\overline{CA^*}$ and $\overline{BH}$ are both perpendicular to $\overline{AC}$', 'Its diagonals are congruent because both are diameters', 'All four of its vertices lie on the circumcircle', 'Its sides are midsegments of $\triangle ABC$']
  answer: 0
  explanation: 'Angles $ABA^*$ and $ACA^*$ are inscribed in semicircles, so they are right angles. Two lines perpendicular to the same line are parallel, so both pairs of opposite sides are parallel. $H$ is usually not on the circumcircle, and $\overline{HA^*}$ is not a diameter.'
- id: geo-h1-r2-h39
  lesson: geo-h1-nine-point
  module_quiz: true
  topic: Euler line
  type: text
  stem: 'The triangle whose vertices are the midpoints of the three sides of a triangle is called the ___ triangle.'
  accept: [medial]
  explanation: 'The medial triangle''s sides are the three midsegments. The map $T$ about the centroid sends a triangle onto its medial triangle.'
- id: geo-h1-r2-h40
  lesson: geo-h1-nine-point
  topic: Euler line
  type: text
  stem: 'A triangle has circumcenter $O(0, 0)$ and centroid $G(2, -1)$. Its orthocenter $H$ has $x$-coordinate ___ and $y$-coordinate ___.'
  accept:
    - ['6']
    - ['-3']
  explanation: '$H = 3G - 2O = (6, -3) - (0, 0) = (6, -3)$. With $O$ at the origin, $H$ is simply $3G$.'
- id: geo-h1-r2-h41
  lesson: geo-h1-nine-point
  topic: Euler line
  type: order
  stem: 'Put the steps of the proof of the Euler line theorem in order.'
  items: ['$G$ divides each median in the ratio $2 : 1$', 'So $T$ (half-turn about $G$, then dilation by $\tfrac12$) sends each vertex to the midpoint of the opposite side', '$T$ sends each altitude to the perpendicular bisector of that side', 'So $T$ sends $H$ to $O$', 'So $O$ lies on line $HG$ with $GO = \tfrac12 GH$']
  explanation: 'The $2 : 1$ ratio is what makes $T$ send $A$ to $D$. Knowing where the vertices go tells you where the altitudes go; the altitudes'' common point $H$ must then go to the bisectors'' common point $O$; and the definition of $T$ gives the collinearity and the distances.'
- id: geo-h1-r2-h42
  lesson: geo-h1-nine-point
  topic: Euler line
  type: match
  stem: 'Match each point on the Euler line to its description.'
  pairs:
    - [Circumcenter O, Meeting point of the perpendicular bisectors of the sides]
    - [Centroid G, One-third of the way from O to H]
    - [Nine-point center N, Midpoint of OH]
    - [Orthocenter H, Meeting point of the altitudes]
  distractors: [Meeting point of the angle bisectors]
  explanation: 'The angle bisectors meet at the incenter, which is generally not on the Euler line (it is on it only for isosceles triangles).'
- id: geo-h1-r2-h43
  lesson: geo-h1-nine-point
  module_quiz: true
  topic: Nine-point circle
  stem: 'Which points lie on the nine-point circle of every triangle? Select all that apply.'
  choices: ['The midpoints of the three sides', 'The feet of the three altitudes', 'The midpoints of $\overline{AH}$, $\overline{BH}$ and $\overline{CH}$', 'The circumcenter $O$', 'The centroid $G$']
  answer: [0, 1, 2]
  explanation: 'Those are the nine points. $O$ and $G$ lie on the Euler line with the center $N$, but not on the circle in general.'
- id: geo-h1-r2-h44
  lesson: geo-h1-nine-point
  topic: Euler line
  type: label
  stem: 'The dashed line is the Euler line of $\triangle ABC$, and the circle is its nine-point circle. Name the four numbered points.'
  image: {src: images/geo-h1-euler-blank.svg, alt: 'Triangle ABC with its nine-point circle and a dashed line through four numbered points'}
  labels:
    - {x: 51.5, y: 55.7, text: Circumcenter}
    - {x: 39.8, y: 62.7, text: Centroid}
    - {x: 33.9, y: 66.2, text: Nine-point center}
    - {x: 16.3, y: 76.8, text: Orthocenter}
  distractors: [Incenter]
  explanation: 'The nine-point center is the center of the drawn circle and the midpoint of $\overline{OH}$. The orthocenter and circumcenter are the two ends of the marked group, with the centroid one-third of the way from the circumcenter to the orthocenter. In this triangle the orthocenter is near vertex $A$ because the triangle is close to having a right angle there.'
# Lesson 93: Cyclic quadrilaterals and Ptolemy's theorem
- id: geo-h1-r2-h45
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Ptolemy's theorem
  stem: 'Cyclic quadrilateral $ABCD$ has $AB = 3$, $BC = 5$, $CD = 7$, $DA = 7$ and diagonal $AC = 7$. Find the other diagonal, $BD$.'
  choices: ['$\tfrac{64}{7}$', '$56$', '$\sqrt{58}$', '$8$']
  answer: 3
  explanation: 'Ptolemy: $AC \cdot BD = AB \cdot CD + AD \cdot BC$, so $7 \cdot BD = 3 \cdot 7 + 7 \cdot 5 = 56$ and $BD = 8$. $\tfrac{64}{7}$ pairs adjacent sides ($3 \cdot 5 + 7 \cdot 7$), 56 forgets to divide by $AC$, and $\sqrt{58}$ treats two sides as legs of a right triangle.'
- id: geo-h1-r2-h46
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Ptolemy's theorem
  stem: 'For a cyclic quadrilateral $ABCD$ (vertices in order around the circle), what does Ptolemy''s theorem say?'
  choices: ['$AB \cdot BC = AC \cdot BD + CD \cdot DA$', '$AC \cdot BD = AB \cdot CD + AD \cdot BC$', '$AC + BD = AB + CD$', '$AC \cdot BD = AB \cdot BC + CD \cdot DA$']
  answer: 1
  explanation: 'The product of the diagonals equals the sum of the products of opposite sides: $AB$ with $CD$, and $AD$ with $BC$. The last choice pairs adjacent sides, and the first puts sides where the diagonals belong.'
- id: geo-h1-r2-h47
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  stem: 'An isosceles trapezoid has bases 4 and 9 and legs 6. How long is each diagonal?'
  choices: ['$6\sqrt2$', '$\sqrt{117}$', '$9$', '$\sqrt{52}$']
  answer: 0
  explanation: 'Ptolemy: $d^2 = 4 \cdot 9 + 6 \cdot 6 = 36 + 36 = 72$, so $d = \sqrt{72} = 6\sqrt2 \approx 8.49$. $\sqrt{117}$ uses $9^2$ instead of $4 \cdot 9$, and $\sqrt{52}$ uses $4^2$. Check: the height is $\sqrt{36 - 2.5^2} = \sqrt{29.75}$ and the diagonal is $\sqrt{6.5^2 + 29.75} = \sqrt{72}$.'
- id: geo-h1-r2-h48
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  stem: 'In the proof of Ptolemy''s theorem, $K$ is chosen on diagonal $\overline{AC}$ so that $\angle ABK \cong \angle DBC$. Which two triangles are then shown similar to get $AK \cdot BD = AB \cdot CD$?'
  choices: ['$\triangle ABK$ and $\triangle CBK$', '$\triangle ABD$ and $\triangle CBD$', '$\triangle ABK$ and $\triangle DBC$', '$\triangle AKB$ and $\triangle CKD$']
  answer: 2
  explanation: '$\triangle ABK$ and $\triangle DBC$ have $\angle ABK \cong \angle DBC$ by the choice of $K$, and $\angle BAK \cong \angle BDC$ as inscribed angles on arc $BC$, so they are similar by AA. Then $\tfrac{AK}{AB} = \tfrac{DC}{DB}$. The second pair used in the proof is $\triangle KBC$ and $\triangle ABD$.'
- id: geo-h1-r2-h49
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  stem: 'Equilateral triangle $ABC$ is inscribed in a circle, and $P$ is on arc $BC$ (not containing $A$) with $PB = 2$ and $PC = 7$. Find $PA$.'
  choices: ['$5$', '$9$', '$\sqrt{53}$', '$14$']
  answer: 1
  explanation: 'Ptolemy in $ABPC$: $PA \cdot s = s \cdot PC + s \cdot PB$, so $PA = PB + PC = 9$. 5 is the difference, $\sqrt{53}$ treats $PB$ and $PC$ as legs of a right triangle, and 14 is their product.'
- id: geo-h1-r2-h50
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Ptolemy's theorem
  stem: 'A regular pentagon has side 1. Ptolemy''s theorem in a quadrilateral made of four of its vertices gives $d^2 = d + 1$ for the diagonal $d$. What is $d$?'
  choices: ['$\sqrt2$', '$2$', '$\tfrac{1 + \sqrt3}{2}$', '$\tfrac{1 + \sqrt5}{2}$']
  answer: 3
  explanation: '$d^2 - d - 1 = 0$, so $d = \tfrac{1 \pm \sqrt{1 + 4}}{2}$, and the positive root is $\tfrac{1 + \sqrt5}{2} \approx 1.618$, the golden ratio. Check: $1.618^2 \approx 2.618 = 1.618 + 1$. None of the other values satisfies the equation.'
- id: geo-h1-r2-h51
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Cyclic quadrilaterals
  stem: 'A cyclic quadrilateral has sides 4, 5, 7 and 10. Use Brahmagupta''s formula to find its area.'
  choices: ['$36$', '$\sqrt{1400} \approx 37.42$', '$26$', '$72$']
  answer: 0
  explanation: '$s = \tfrac{4 + 5 + 7 + 10}{2} = 13$, so $K = \sqrt{(13 - 4)(13 - 5)(13 - 7)(13 - 10)} = \sqrt{9 \cdot 8 \cdot 6 \cdot 3} = \sqrt{1296} = 36$. $\sqrt{1400}$ multiplies the sides themselves, 26 is the perimeter, and 72 is double the area.'
- id: geo-h1-r2-h52
  lesson: geo-h1-ptolemy
  topic: Cyclic quadrilaterals
  stem: 'A rhombus has side 5 and diagonals 6 and 8. What does Ptolemy''s inequality tell you about it?'
  choices: ['$AC \cdot BD = 48$ and $AB \cdot CD + AD \cdot BC = 48$, so it is cyclic', 'Nothing: Ptolemy''s inequality applies only to cyclic quadrilaterals', '$48 < 50$, so the rhombus is not cyclic', '$48 < 50$, so the rhombus is cyclic']
  answer: 2
  explanation: 'The diagonals give $6 \cdot 8 = 48$ and the opposite sides give $5 \cdot 5 + 5 \cdot 5 = 50$. The inequality holds for every quadrilateral, with equality only for cyclic ones, so the strict inequality shows this rhombus is not cyclic (as expected: its angles aren''t right angles).'
- id: geo-h1-r2-h53
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  stem: 'In the proof of Ptolemy''s theorem, why is $\angle BAC \cong \angle BDC$?'
  choices: ['They are vertical angles', 'Both are inscribed angles that intercept arc $BC$', 'They are alternate interior angles of parallel lines', '$\triangle ABD$ is isosceles']
  answer: 1
  explanation: 'Inscribed angles that intercept the same arc are congruent (Lesson 29); $A$ and $D$ are both on the circle, on the same side of chord $\overline{BC}$. Nothing in the figure is parallel or isosceles, and the angles don''t share a vertex.'
- id: geo-h1-r2-h54
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Ptolemy's theorem
  type: text
  stem: 'For every quadrilateral, $AC \cdot BD \le AB \cdot CD + AD \cdot BC$, with equality only when the quadrilateral is cyclic. This fact is called Ptolemy''s ___.'
  accept: [inequality]
  explanation: 'Ptolemy''s inequality turns the theorem into a test: if the product of the diagonals is less than the sum of the products of opposite sides, the quadrilateral is not cyclic.'
- id: geo-h1-r2-h55
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  type: text
  stem: 'A rectangle has sides 5 and 12. Ptolemy''s theorem gives $d \cdot d = 5 \cdot 5 + 12 \cdot 12$ for its diagonal $d$, so $d =$ ___.'
  accept: ['13']
  explanation: '$d^2 = 25 + 144 = 169$, so $d = 13$. For a rectangle, Ptolemy''s theorem is exactly the Pythagorean theorem.'
- id: geo-h1-r2-h56
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  stem: 'For which quadrilaterals $ABCD$ is $AC \cdot BD = AB \cdot CD + AD \cdot BC$ true? Select all that apply.'
  choices: ['A square', 'A 3-by-4 rectangle', 'A rhombus with angles of $60^\circ$ and $120^\circ$', 'An isosceles trapezoid', 'A parallelogram with sides 3 and 5 and a $60^\circ$ angle']
  answer: [0, 1, 3]
  explanation: 'Equality holds exactly for cyclic quadrilaterals, and squares, rectangles and isosceles trapezoids are cyclic. For the rectangle: $5 \cdot 5 = 3 \cdot 3 + 4 \cdot 4$. The rhombus and the parallelogram are not rectangles, so they are not cyclic and the left side is strictly smaller. For the rhombus with side 1: diagonals $1$ and $\sqrt3$, product $1.73 < 2$.'
- id: geo-h1-r2-h57
  lesson: geo-h1-ptolemy
  module_quiz: true
  topic: Ptolemy's theorem
  type: match
  stem: 'Match each special case to the result the lesson''s formulas give.'
  pairs:
    - [Ptolemy for a rectangle, The Pythagorean theorem]
    - [Ptolemy for four vertices of a regular pentagon with side 1, The diagonal is the golden ratio]
    - [Ptolemy for an equilateral triangle and a point P on arc BC, PA = PB + PC]
    - [Brahmagupta's formula with one side shrunk to 0, Heron's formula]
  distractors: [The Law of Sines]
  explanation: 'Rectangle: $d^2 = a^2 + b^2$. Pentagon: $d^2 = d + 1$, so $d = \tfrac{1 + \sqrt5}{2}$. Equilateral triangle: dividing by the side leaves $PA = PB + PC$. Brahmagupta with $d = 0$: $\sqrt{s(s - a)(s - b)(s - c)}$.'
- id: geo-h1-r2-h58
  lesson: geo-h1-ptolemy
  topic: Ptolemy's theorem
  type: order
  stem: 'Put the steps for finding the diagonal of an isosceles trapezoid with Ptolemy''s theorem in order.'
  items: ['Note that an isosceles trapezoid is cyclic, with congruent diagonals $d$', 'Pair the opposite sides: the two bases, and the two legs', 'Write $d^2 = (\text{base}_1)(\text{base}_2) + (\text{leg})^2$', 'Take the positive square root of the right side']
  explanation: 'Ptolemy applies only after you know the quadrilateral is cyclic. Then the products of opposite sides go on the right side of the equation, and the square root gives $d$. Example 2 in the lesson: bases 6 and 12, legs 5, so $d^2 = 72 + 25 = 97$.'
