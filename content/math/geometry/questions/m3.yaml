# Module 3 — Parallel and perpendicular lines
- id: geo-q-0801
  lesson: geo-transversals
  module_quiz: true
  topic: Parallel lines
  stem: 'A transversal crosses two lines. Two angles lie between the lines on opposite sides of the transversal. What are they called?'
  choices: ['Corresponding angles', 'Consecutive interior angles', 'Alternate exterior angles', 'Alternate interior angles']
  answer: 3
  explanation: |-
    "Interior" means between the two lines; "alternate" means on opposite sides of the transversal.
- id: geo-q-0802
  lesson: geo-transversals
  topic: Parallel lines
  stem: 'Two parallel lines are cut by a transversal. Which pair of angles is supplementary (not necessarily congruent)?'
  choices: ['Consecutive interior angles', 'Corresponding angles', 'Alternate interior angles', 'Alternate exterior angles']
  answer: 0
  explanation: |-
    Consecutive (same-side) interior angles add to $180^\circ$. The other three pairs are congruent.
- id: geo-q-0803
  lesson: geo-transversals
  module_quiz: true
  topic: Parallel lines
  stem: '$\ell \parallel m$ and a transversal makes a $47^\circ$ angle with $\ell$. What are the possible measures of the eight angles formed?'
  choices: ['Only $47^\circ$', '$47^\circ$ and $133^\circ$', '$47^\circ$ and $43^\circ$', '$47^\circ$, $43^\circ$ and $133^\circ$']
  answer: 1
  explanation: |-
    With parallel lines every angle is congruent or supplementary to the given one: $47^\circ$ or $180 - 47 = 133^\circ$. $43^\circ$ would be a complement, which plays no role here.
- id: geo-q-0804
  lesson: geo-transversals
  topic: Parallel lines
  stem: '$\ell \parallel m$. Corresponding angles measure $(6x - 8)^\circ$ and $(4x + 22)^\circ$. Find the angle measure.'
  choices: ['$15^\circ$', '$98^\circ$', '$82^\circ$', '$7^\circ$']
  answer: 2
  explanation: |-
    Corresponding angles are congruent: $6x - 8 = 4x + 22$, so $x = 15$ and the angle is $6(15) - 8 = 82^\circ$. $98^\circ$ is its supplement.
- id: geo-q-0805
  lesson: geo-transversals
  topic: Parallel lines
  stem: '$\ell \parallel m$. Consecutive interior angles measure $(2x + 20)^\circ$ and $(3x + 10)^\circ$. Find the smaller angle.'
  choices: ['$30^\circ$', '$100^\circ$', '$76^\circ$', '$80^\circ$']
  answer: 3
  explanation: |-
    Supplementary: $5x + 30 = 180$, so $x = 30$. The angles are $2(30) + 20 = 80^\circ$ and $3(30) + 10 = 100^\circ$; the smaller is $80^\circ$. 30 is $x$, not an angle.
- id: geo-q-0806
  lesson: geo-transversals
  module_quiz: true
  topic: Proving lines parallel
  stem: 'Two lines are cut by a transversal and alternate exterior angles measure $(5x + 3)^\circ$ and $(7x - 21)^\circ$. For what $x$ are the lines parallel?'
  choices: ['$x = 12$', '$x = 9$', '$x = 63$', '$x = 1.5$']
  answer: 0
  explanation: |-
    By the Alternate Exterior Angles Converse, the lines are parallel when the angles are congruent: $5x + 3 = 7x - 21$, so $2x = 24$ and $x = 12$ (each angle $63^\circ$).
- id: geo-q-0807
  lesson: geo-transversals
  topic: Proving lines parallel
  stem: 'Which statement uses a converse to conclude lines are parallel?'
  choices: ['Lines $\ell \parallel m$, so $\angle 1 \cong \angle 5$.', '$\angle 3 \cong \angle 6$ (alternate interior), so $\ell \parallel m$.', '$\ell \parallel m$, so $m\angle 3 + m\angle 5 = 180^\circ$.', '$\angle 1$ and $\angle 4$ are vertical, so they are congruent.']
  answer: 1
  explanation: |-
    The converse runs from angles to lines: congruent alternate interior angles prove the lines parallel. The two statements that start from $\ell \parallel m$ use the forward theorems, and the vertical-angles statement says nothing about parallel lines.
- id: geo-q-0808
  lesson: geo-transversals
  topic: Proving lines parallel
  stem: 'In a plane, line $a \perp t$ and line $b \perp t$. What can you conclude?'
  choices: ['$a \perp b$', '$a$ and $b$ are skew.', '$a \parallel b$', '$a$ and $b$ intersect at $t$.']
  answer: 2
  explanation: |-
    Both lines make $90^\circ$ corresponding angles with $t$, so by the Corresponding Angles Converse they are parallel.
- id: geo-q-0809
  lesson: geo-transversals
  topic: Parallel lines
  stem: 'Which statement is Playfair''s form of the parallel postulate?'
  choices: ['Parallel lines never meet.', 'Two lines perpendicular to the same line are parallel.', 'Corresponding angles are congruent.', 'Through a point not on a line there is exactly one line parallel to it.']
  answer: 3
  explanation: |-
    Playfair's axiom: exactly one parallel through an outside point. It is equivalent to Euclid's fifth postulate and to the Corresponding Angles Postulate.
- id: geo-q-0810
  lesson: geo-transversals
  topic: Parallel lines
  stem: 'A student proves alternate interior angles congruent: "$\angle 3 \cong \angle 2$ (vertical angles); $\angle 2 \cong \angle 6$ (?); so $\angle 3 \cong \angle 6$." What is the missing reason?'
  choices: ['Corresponding Angles Postulate', 'Linear Pair Postulate', 'Alternate Interior Angles Converse', 'Congruent Supplements Theorem']
  answer: 0
  explanation: |-
    $\angle 2$ and $\angle 6$ are corresponding angles, congruent because the lines are parallel.
- id: geo-q-0811
  lesson: geo-transversals
  topic: Proving lines parallel
  stem: 'Lines $p$ and $q$ are cut by a transversal. Consecutive interior angles measure $72^\circ$ and $118^\circ$. What can you conclude?'
  choices: ['$p \parallel q$', '$p$ and $q$ are not parallel.', '$p \perp q$', 'Nothing about $p$ and $q$.']
  answer: 1
  explanation: |-
    If the lines were parallel, these angles would add to $180^\circ$. They add to $190^\circ$, so the lines are not parallel (by the contrapositive of the Consecutive Interior Angles Theorem).
- id: geo-q-0812
  lesson: geo-transversals
  module_quiz: true
  topic: Parallel lines
  stem: '$\ell \parallel m$. One angle formed with the transversal is $(9x + 4)^\circ$ and an alternate interior angle on the other line is $(11x - 16)^\circ$. Find the angle that forms a linear pair with the $(9x + 4)^\circ$ angle.'
  choices: ['$94^\circ$', '$10^\circ$', '$86^\circ$', '$76^\circ$']
  answer: 2
  explanation: |-
    Alternate interior angles are congruent: $9x + 4 = 11x - 16$, so $x = 10$ and the angle is $94^\circ$. Its linear-pair partner is $180 - 94 = 86^\circ$.
- id: geo-q-0813
  lesson: geo-transversals
  topic: Proving lines parallel
  stem: 'Line $a \parallel b$ and $b \parallel c$. Which must be true?'
  choices: ['$a \perp c$', '$a$ and $c$ are skew.', '$a$ and $c$ intersect.', '$a \parallel c$ (or $a$ and $c$ are the same line)']
  answer: 3
  explanation: |-
    Lines parallel to the same line are parallel to each other (transitivity of parallels).

- id: geo-q-0901
  lesson: geo-perp-slope
  module_quiz: true
  topic: Slope
  stem: 'Find the slope of the line through $(-2, 5)$ and $(4, -7)$.'
  choices: ['$-2$', '$-\tfrac12$', '$2$', '$-\tfrac{1}{3}$']
  answer: 0
  explanation: |-
    $m = \dfrac{-7 - 5}{4 - (-2)} = \dfrac{-12}{6} = -2$. Flipping rise and run gives $-\tfrac12$.
- id: geo-q-0902
  lesson: geo-perp-slope
  module_quiz: true
  topic: Slope
  stem: 'A line has slope $\tfrac{2}{5}$. What is the slope of a line perpendicular to it?'
  choices: ['$\tfrac{5}{2}$', '$-\tfrac{5}{2}$', '$-\tfrac{2}{5}$', '$\tfrac{2}{5}$']
  answer: 1
  explanation: |-
    Perpendicular slopes are negative reciprocals: $-\tfrac52$. Check: $\tfrac25 \cdot \left(-\tfrac52\right) = -1$.
- id: geo-q-0903
  lesson: geo-perp-slope
  topic: Slope
  stem: 'Which line is parallel to $y = -3x + 7$?'
  choices: ['$y = \tfrac13 x + 7$', '$y = 3x - 2$', '$y = -3x - 4$', '$y = -\tfrac13 x$']
  answer: 2
  explanation: |-
    Parallel lines have equal slopes, so the slope must be $-3$ with a different intercept: $y = -3x - 4$. $y = \tfrac13 x + 7$ is perpendicular.
- id: geo-q-0904
  lesson: geo-perp-slope
  topic: Slope
  stem: 'Classify the lines $2x - y = 4$ and $x + 2y = 6$.'
  choices: ['Parallel', 'Neither', 'The same line', 'Perpendicular']
  answer: 3
  explanation: |-
    The first is $y = 2x - 4$ (slope 2); the second is $y = -\tfrac12 x + 3$ (slope $-\tfrac12$). The product is $-1$, so they are perpendicular.
- id: geo-q-0905
  lesson: geo-perp-slope
  module_quiz: true
  topic: Slope
  stem: 'Which equation is the line through $(2, 3)$ perpendicular to $y = \tfrac12 x + 1$?'
  choices: ['$y = -2x + 7$', '$y = \tfrac12 x + 2$', '$y = -2x - 1$', '$y = 2x - 1$']
  answer: 0
  explanation: |-
    Perpendicular slope: $-2$. Point-slope: $y - 3 = -2(x - 2)$, so $y = -2x + 7$. Check: $-2(2) + 7 = 3$. $y = -2x - 1$ has the right slope but misses the point.
- id: geo-q-0906
  lesson: geo-perp-slope
  topic: Slope
  stem: 'What is the slope of the vertical line $x = 4$, and of a line perpendicular to it?'
  choices: ['0 and undefined', 'Undefined and 0', '4 and $-\tfrac14$', '1 and $-1$']
  answer: 1
  explanation: |-
    A vertical line has undefined slope (zero run). Lines perpendicular to it are horizontal, with slope 0.
- id: geo-q-0907
  lesson: geo-perp-slope
  topic: Perpendicular lines
  stem: 'Why is the distance from a point to a line measured along the perpendicular?'
  choices: ['Because perpendicular lines are parallel', 'By the definition of a midpoint', 'Any other segment is a hypotenuse of a right triangle with the perpendicular as a leg, so it is longer.', 'Because all segments to the line have equal length']
  answer: 2
  explanation: |-
    A slanted segment is the hypotenuse of a right triangle whose leg is the perpendicular segment, and the hypotenuse is the longest side. So the perpendicular is the shortest distance.
- id: geo-q-0908
  lesson: geo-perp-slope
  topic: Perpendicular lines
  stem: 'Find the distance from $(1, 2)$ to the line $5x + 12y + 10 = 0$.'
  choices: ['$\tfrac{39}{17}$', '$39$', '$\tfrac{29}{13}$', '$3$']
  answer: 3
  explanation: |-
    $d = \dfrac{|5(1) + 12(2) + 10|}{\sqrt{25 + 144}} = \dfrac{39}{13} = 3$. Forgetting the square root (or dividing by 17 = 5 + 12) gives the wrong denominators.
- id: geo-q-0909
  lesson: geo-perp-slope
  topic: Perpendicular lines
  stem: 'In a plane, $\ell \parallel m$ and line $t \perp \ell$. What is the relationship between $t$ and $m$?'
  choices: ['$t \perp m$', '$t \parallel m$', '$t$ and $m$ are skew.', 'It cannot be determined.']
  answer: 0
  explanation: |-
    By the Perpendicular Transversal Theorem, a line perpendicular to one of two parallel lines is perpendicular to the other (corresponding angles are both $90^\circ$).
- id: geo-q-0910
  lesson: geo-perp-slope
  topic: Slope
  stem: 'A student finds the slope through $(3, 1)$ and $(7, 9)$ as $\dfrac{9 - 1}{3 - 7} = -2$. What went wrong?'
  choices: ['Nothing; the slope is $-2$.', 'The $x$-differences were subtracted in the opposite order from the $y$-differences; the slope is $2$.', 'Slope is run over rise; it is $\tfrac12$.', 'The points must be added, not subtracted.']
  answer: 1
  explanation: |-
    Use the same point first in both: $\dfrac{9 - 1}{7 - 3} = \dfrac{8}{4} = 2$.
- id: geo-q-0911
  lesson: geo-perp-slope
  module_quiz: true
  topic: Perpendicular lines
  stem: 'Two lines meet and form a linear pair of congruent angles. What is each angle, and what are the lines?'
  choices: ['$45^\circ$; parallel', '$180^\circ$; collinear', '$90^\circ$; perpendicular', '$60^\circ$; skew']
  answer: 2
  explanation: |-
    A linear pair sums to $180^\circ$; if the two angles are equal, each is $90^\circ$, so the lines are perpendicular.
- id: geo-q-0912
  lesson: geo-perp-slope
  topic: Slope
  stem: 'For what value of $k$ is the line through $(0, 0)$ and $(4, k)$ perpendicular to the line $y = 2x - 3$?'
  choices: ['$8$', '$-8$', '$2$', '$-2$']
  answer: 3
  explanation: |-
    The required slope is $-\tfrac12$, so $\tfrac{k}{4} = -\tfrac12$ and $k = -2$. $k = 8$ would make the lines parallel.
- id: geo-q-0913
  lesson: geo-perp-slope
  topic: Perpendicular lines
  stem: 'What is the distance between the parallel lines $y = 3$ and $y = -5$?'
  choices: ['$8$', '$2$', '$-2$', '$15$']
  answer: 0
  explanation: |-
    A vertical segment is perpendicular to both horizontal lines; its length is $|3 - (-5)| = 8$.
