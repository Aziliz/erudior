# Module 6 — Similarity and right triangles
- id: geo-q-2001
  lesson: geo-similar
  module_quiz: true
  topic: Proportions
  stem: 'Solve $\dfrac{x}{12} = \dfrac{5}{8}$.'
  choices: ['$7.5$', '$9.6$', '$15$', '$6.4$']
  answer: 0
  explanation: |-
    Cross multiply: $8x = 5 \cdot 12 = 60$, so $x = 7.5$. Check: $\tfrac{7.5}{12} = 0.625 = \tfrac58$.
- id: geo-q-2002
  lesson: geo-similar
  topic: Proportions
  stem: 'What is the geometric mean of 8 and 18?'
  choices: ['13', '12', '144', '26']
  answer: 1
  explanation: |-
    $\sqrt{8 \cdot 18} = \sqrt{144} = 12$. 13 is the arithmetic mean (average).
- id: geo-q-2003
  lesson: geo-similar
  module_quiz: true
  topic: Similar polygons
  stem: '$\triangle ABC \sim \triangle XYZ$, $AB = 8$, $BC = 12$ and $XY = 6$. Find $YZ$.'
  choices: ['16', '10', '9', '4']
  answer: 2
  explanation: |-
    Scale factor from $ABC$ to $XYZ$: $\tfrac{6}{8} = \tfrac34$. So $YZ = \tfrac34 \cdot 12 = 9$. 16 uses the factor upside down.
- id: geo-q-2004
  lesson: geo-similar
  topic: Similar polygons
  stem: 'Two similar triangles have scale factor 3. If the smaller has area 10, what is the larger''s area?'
  choices: ['30', '60', '270', '90']
  answer: 3
  explanation: |-
    Areas scale by $k^2 = 9$: $10 \cdot 9 = 90$. 30 scales by $k$ instead of $k^2$; 270 by $k^3$.
- id: geo-q-2005
  lesson: geo-similar
  topic: Similar polygons
  stem: 'Two similar solids have surface areas 16 and 100. What is the ratio of their volumes (small to large)?'
  choices: ['$8 : 125$', '$4 : 25$', '$16 : 100$', '$2 : 5$']
  answer: 0
  explanation: |-
    Area ratio $= k^2 = \tfrac{16}{100}$, so $k = \tfrac{4}{10} = \tfrac25$. Volume ratio $= k^3 = \tfrac{8}{125}$.
- id: geo-q-2006
  lesson: geo-similar
  module_quiz: true
  topic: Similar polygons
  stem: 'Which pair of figures must be similar?'
  choices: ['Any two rectangles', 'Any two squares', 'Any two rhombuses', 'Any two isosceles triangles']
  answer: 1
  explanation: |-
    All squares have $90^\circ$ angles and side ratios that are all equal, so they're similar. Rectangles can have different proportions, rhombuses different angles, isosceles triangles different vertex angles.
- id: geo-q-2007
  lesson: geo-similar
  topic: Similar polygons
  stem: 'Quadrilateral $ABCD \sim PQRS$ with perimeters 36 and 54. If $CD = 10$, find $RS$.'
  choices: ['$6\tfrac23$', '22.5', '15', '28']
  answer: 2
  explanation: |-
    Perimeters scale like lengths: $k = \tfrac{54}{36} = \tfrac32$, so $RS = \tfrac32 \cdot 10 = 15$.
- id: geo-q-2008
  lesson: geo-similar
  topic: Proportions
  stem: 'If $\dfrac{a}{b} = \dfrac{3}{7}$, which must also be true?'
  choices: ['$\dfrac{a}{7} = \dfrac{b}{3}$', '$\dfrac{a + 3}{b + 7} = 1$', '$7b = 3a$', '$\dfrac{a + b}{b} = \dfrac{10}{7}$']
  answer: 3
  explanation: |-
    Adding 1 to both sides: $\tfrac{a + b}{b} = \tfrac{3 + 7}{7}$. Cross products give $7a = 3b$ (not $7b = 3a$), and swapping the means gives $\tfrac{a}{3} = \tfrac{b}{7}$.
- id: geo-q-2009
  lesson: geo-similar
  topic: Similar polygons
  stem: 'A map has scale 1 : 50,000. Two points are 4.6 cm apart on the map. How far apart are they in real life?'
  choices: ['2.3 km', '23 km', '230 m', '0.92 km']
  answer: 0
  explanation: |-
    $4.6 \times 50{,}000 = 230{,}000$ cm $= 2300$ m $= 2.3$ km.
- id: geo-q-2010
  lesson: geo-similar
  topic: Similar polygons
  stem: 'Two similar cones have volumes in the ratio $27 : 64$. What is the ratio of their heights?'
  choices: ['$9 : 16$', '$3 : 4$', '$27 : 64$', '$\sqrt{27} : 8$']
  answer: 1
  explanation: |-
    Volume ratio is $k^3$, so $k = \sqrt[3]{27/64} = \tfrac34$. Heights, like all lengths, are in ratio $3 : 4$.
- id: geo-q-2011
  lesson: geo-similar
  topic: Proportions
  stem: 'Solve $\dfrac{x - 1}{4} = \dfrac{9}{x - 1}$ for $x > 1$.'
  choices: ['$x = 6$', '$x = 37$', '$x = 7$', '$x = 10$']
  answer: 2
  explanation: |-
    Cross multiply: $(x - 1)^2 = 36$, so $x - 1 = 6$ (positive) and $x = 7$. Here $x - 1$ is the geometric mean of 4 and 9.

- id: geo-q-2101
  lesson: geo-sim-thm
  module_quiz: true
  topic: Similarity tests
  stem: 'Two triangles each have a $40^\circ$ angle and a $75^\circ$ angle. What can you conclude?'
  choices: ['They are congruent by ASA.', 'Nothing, without side lengths', 'They are similar only if they are isosceles.', 'They are similar by AA.']
  answer: 3
  explanation: |-
    Two pairs of congruent angles prove similarity (AA). Without a pair of congruent sides, congruence doesn't follow.
- id: geo-q-2102
  lesson: geo-sim-thm
  topic: Similarity tests
  stem: 'Which pair of triangles (side lengths given) is similar?'
  choices: ['4, 6, 9 and 8, 12, 18', '3, 4, 5 and 4, 5, 6', '5, 7, 9 and 10, 14, 20', '2, 3, 4 and 3, 4, 5']
  answer: 0
  explanation: |-
    $\tfrac84 = \tfrac{12}{6} = \tfrac{18}{9} = 2$: SSS similarity. In 5, 7, 9 vs 10, 14, 20 the last ratio is $\tfrac{20}{9} \ne 2$.
- id: geo-q-2103
  lesson: geo-sim-thm
  module_quiz: true
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$ with $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$. $AD = 6$, $DB = 9$, $AE = 8$. Find $EC$.'
  choices: ['$5\tfrac13$', '12', '11', '$13\tfrac12$']
  answer: 1
  explanation: |-
    Side Splitter: $\tfrac{AD}{DB} = \tfrac{AE}{EC}$, so $\tfrac69 = \tfrac{8}{EC}$ and $EC = 12$.
- id: geo-q-2104
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$, $AD = 4$, $DB = 6$, $DE = 7$. Find $BC$.'
  choices: ['10.5', '11', '17.5', '4.2']
  answer: 2
  explanation: |-
    $\triangle ADE \sim \triangle ABC$, so $\tfrac{DE}{BC} = \tfrac{AD}{AB} = \tfrac{4}{10}$. Then $BC = \tfrac{70}{4} = 17.5$. 10.5 wrongly uses $\tfrac{AD}{DB}$ (piece to piece).
- id: geo-q-2105
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'In $\triangle PQR$, the bisector of $\angle P$ meets $\overline{QR}$ at $S$. $PQ = 12$, $PR = 18$ and $QR = 20$. Find $QS$.'
  choices: ['12', '10', '13.3', '8']
  answer: 3
  explanation: |-
    Angle Bisector Theorem: $\tfrac{QS}{SR} = \tfrac{PQ}{PR} = \tfrac{12}{18} = \tfrac23$. Split 20 in ratio $2 : 3$: $QS = \tfrac25 \cdot 20 = 8$.
- id: geo-q-2106
  lesson: geo-sim-thm
  topic: Similarity tests
  stem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle B \cong \angle E$, $AB = 6$, $BC = 10$, $DE = 9$, $EF = 15$. Are they similar?'
  choices: ['Yes, by SAS similarity', 'Yes, by AA', 'No, the ratios differ', 'Only if $AC = DF$']
  answer: 0
  explanation: |-
    $\tfrac{DE}{AB} = \tfrac96 = 1.5$ and $\tfrac{EF}{BC} = \tfrac{15}{10} = 1.5$, with the included angles $\angle B \cong \angle E$: SAS similarity.
- id: geo-q-2107
  lesson: geo-sim-thm
  module_quiz: true
  topic: Similarity tests
  stem: 'A 2 m pole casts a 3.5 m shadow. At the same time a building casts a 28 m shadow. How tall is the building?'
  choices: ['49 m', '16 m', '14 m', '18.5 m']
  answer: 1
  explanation: |-
    Similar right triangles: $\tfrac{h}{28} = \tfrac{2}{3.5}$, so $h = \tfrac{56}{3.5} = 16$ m. 49 m flips the ratio.
- id: geo-q-2108
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'Three parallel lines cut transversal $s$ into segments 5 and 8, and transversal $t$ into segments 7.5 and $x$. Find $x$.'
  choices: ['10.5', '4.7', '12', '11.5']
  answer: 2
  explanation: |-
    Parallel lines cut transversals proportionally: $\tfrac{5}{8} = \tfrac{7.5}{x}$, so $x = \tfrac{60}{5} = 12$.
- id: geo-q-2109
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'A line meets sides $\overline{AB}$ and $\overline{AC}$ of $\triangle ABC$ at $D$ and $E$, with $AD = 5$, $DB = 4$, $AE = 7.5$, $EC = 6$. What can you conclude?'
  choices: ['$\overline{DE} \perp \overline{BC}$', '$D$ and $E$ are midpoints.', '$DE = \tfrac12 BC$', '$\overline{DE} \parallel \overline{BC}$']
  answer: 3
  explanation: |-
    $\tfrac{AD}{DB} = \tfrac54 = 1.25$ and $\tfrac{AE}{EC} = \tfrac{7.5}{6} = 1.25$. The sides are divided proportionally, so by the converse of the Side Splitter Theorem, $\overline{DE} \parallel \overline{BC}$.
- id: geo-q-2110
  lesson: geo-sim-thm
  topic: Similarity tests
  stem: 'Why is AA enough for similarity but not for congruence?'
  choices: ['Two angles fix the third angle and so the shape, but not the size.', 'Two angles fix the size but not the shape.', 'AA only works for right triangles.', 'AA is the same as ASA.']
  answer: 0
  explanation: |-
    With two angles known, the third is determined, so all triangles with those angles have the same shape. They can be scaled to any size, so AA can't prove congruence.
- id: geo-q-2111
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $\overline{AD}$ bisects $\angle A$, with $BD = 6$, $DC = 9$ and $AB = 10$. Find $AC$.'
  choices: ['$6\tfrac23$', '15', '13', '5.4']
  answer: 1
  explanation: |-
    $\tfrac{BD}{DC} = \tfrac{AB}{AC}$: $\tfrac69 = \tfrac{10}{AC}$, so $AC = 15$.

- id: geo-q-2201
  lesson: geo-pythag
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A right triangle has legs 7 and 24. Find the hypotenuse.'
  choices: ['31', '$\sqrt{527}$', '25', '17']
  answer: 2
  explanation: |-
    $\sqrt{49 + 576} = \sqrt{625} = 25$ (a 7-24-25 triple). 31 adds the legs; $\sqrt{527}$ subtracts.
- id: geo-q-2202
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'A right triangle has hypotenuse 17 and one leg 8. Find the other leg.'
  choices: ['$\sqrt{353}$', '9', '25', '15']
  answer: 3
  explanation: |-
    $\sqrt{17^2 - 8^2} = \sqrt{289 - 64} = \sqrt{225} = 15$. $\sqrt{353}$ adds instead of subtracting.
- id: geo-q-2203
  lesson: geo-pythag
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A triangle has sides 9, 12 and 16. Classify it.'
  choices: ['Obtuse', 'Right', 'Acute', 'Not a triangle']
  answer: 0
  explanation: |-
    It is a triangle ($9 + 12 > 16$). Compare $16^2 = 256$ with $9^2 + 12^2 = 225$: $256 > 225$, so obtuse.
- id: geo-q-2204
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'Which set of side lengths forms a right triangle?'
  choices: ['6, 8, 11', '10, 24, 26', '5, 11, 13', '4, 5, 6']
  answer: 1
  explanation: |-
    $10^2 + 24^2 = 100 + 576 = 676 = 26^2$ (double the 5-12-13 triple).
- id: geo-q-2205
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'Find the distance between $(-3, 4)$ and $(5, -2)$.'
  choices: ['14', '$\sqrt{28}$', '10', '$2\sqrt{5}$']
  answer: 2
  explanation: |-
    $\sqrt{(5 - (-3))^2 + (-2 - 4)^2} = \sqrt{64 + 36} = \sqrt{100} = 10$.
- id: geo-q-2206
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'A TV screen is 48 in wide and 27 in tall. About how long is its diagonal?'
  choices: ['75 in', '45 in', '51 in', '55 in']
  answer: 3
  explanation: |-
    $\sqrt{48^2 + 27^2} = \sqrt{2304 + 729} = \sqrt{3033} \approx 55.1$ in.
- id: geo-q-2207
  lesson: geo-pythag
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'A triangle has sides 8, 10 and 12. Classify it.'
  choices: ['Acute', 'Right', 'Obtuse', 'Not a triangle']
  answer: 0
  explanation: |-
    $12^2 = 144$ and $8^2 + 10^2 = 164$. Since $144 < 164$, the triangle is acute.
- id: geo-q-2208
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'In the rearrangement proof, four right triangles with legs $a$, $b$ sit inside a square of side $a + b$, around a tilted square of side $c$. Which equation does the proof use?'
  choices: ['$(a + b)^2 = c^2$', '$(a + b)^2 = 2ab + c^2$', '$a^2 + b^2 = 4ab + c^2$', '$(a + b)^2 = ab + c^2$']
  answer: 1
  explanation: |-
    The big square's area equals the four triangles ($4 \cdot \tfrac12 ab = 2ab$) plus the inner square ($c^2$). Expanding $(a + b)^2$ and cancelling $2ab$ gives $a^2 + b^2 = c^2$.
- id: geo-q-2209
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'A 13 ft ladder reaches 12 ft up a wall. How far is its foot from the wall?'
  choices: ['1 ft', '25 ft', '5 ft', '$\sqrt{313}$ ft']
  answer: 2
  explanation: |-
    $\sqrt{13^2 - 12^2} = \sqrt{169 - 144} = \sqrt{25} = 5$ ft.
- id: geo-q-2210
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'A student computes $\sqrt{6^2 + 8^2} = 6 + 8 = 14$. What is the error?'
  choices: ['Nothing; the answer is 14.', 'The legs should be subtracted.', 'The hypotenuse should be squared, giving 196.', 'A square root doesn''t split over a sum; the answer is $\sqrt{100} = 10$.']
  answer: 3
  explanation: |-
    $\sqrt{a^2 + b^2} \ne a + b$. Compute first: $36 + 64 = 100$, and $\sqrt{100} = 10$.
- id: geo-q-2211
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'A square has diagonal 10. What is its side length?'
  choices: ['$5\sqrt2$', '5', '$10\sqrt2$', '$\sqrt{50}/2$']
  answer: 0
  explanation: |-
    $s^2 + s^2 = 100$, so $s^2 = 50$ and $s = \sqrt{50} = 5\sqrt2 \approx 7.07$.

- id: geo-q-2301
  lesson: geo-special-right
  module_quiz: true
  topic: Special right triangles
  stem: 'A 45°-45°-90° triangle has legs of length 9. Find the hypotenuse.'
  choices: ['$9\sqrt3$', '$9\sqrt2$', '18', '$\tfrac{9\sqrt2}{2}$']
  answer: 1
  explanation: |-
    Hypotenuse $=$ leg $\cdot \sqrt2 = 9\sqrt2 \approx 12.73$.
- id: geo-q-2302
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'A 45°-45°-90° triangle has hypotenuse 14. Find a leg.'
  choices: ['$14\sqrt2$', '7', '$7\sqrt2$', '$7\sqrt3$']
  answer: 2
  explanation: |-
    Leg $= \tfrac{14}{\sqrt2} = \tfrac{14\sqrt2}{2} = 7\sqrt2 \approx 9.90$.
- id: geo-q-2303
  lesson: geo-special-right
  module_quiz: true
  topic: Special right triangles
  stem: 'A 30°-60°-90° triangle has hypotenuse 16. Find the leg opposite the $60^\circ$ angle.'
  choices: ['8', '$16\sqrt3$', '$8\sqrt2$', '$8\sqrt3$']
  answer: 3
  explanation: |-
    Short leg $= 16 / 2 = 8$ (opposite $30^\circ$). Long leg (opposite $60^\circ$) $= 8\sqrt3 \approx 13.86$.
- id: geo-q-2304
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'In a 30°-60°-90° triangle the long leg is 9. Find the hypotenuse.'
  choices: ['$6\sqrt3$', '18', '$3\sqrt3$', '$9\sqrt3$']
  answer: 0
  explanation: |-
    Short leg $= \tfrac{9}{\sqrt3} = 3\sqrt3$; hypotenuse $= 2 \cdot 3\sqrt3 = 6\sqrt3 \approx 10.39$.
- id: geo-q-2305
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'Find the area of an equilateral triangle with side 8.'
  choices: ['32', '$16\sqrt3$', '$32\sqrt3$', '$8\sqrt3$']
  answer: 1
  explanation: |-
    Height $= 4\sqrt3$ (long leg of a 30°-60°-90° with short leg 4). Area $= \tfrac12 \cdot 8 \cdot 4\sqrt3 = 16\sqrt3$, matching $\tfrac{\sqrt3}{4} \cdot 64$.
- id: geo-q-2306
  lesson: geo-special-right
  module_quiz: true
  topic: Geometric mean
  stem: 'The altitude to the hypotenuse of a right triangle divides the hypotenuse into pieces 3 and 12. Find the altitude.'
  choices: ['7.5', '$\sqrt{15}$', '6', '36']
  answer: 2
  explanation: |-
    $h = \sqrt{3 \cdot 12} = \sqrt{36} = 6$. 7.5 is the arithmetic mean.
- id: geo-q-2307
  lesson: geo-special-right
  topic: Geometric mean
  stem: 'The altitude to the hypotenuse divides it into pieces 5 and 15. Find the leg adjacent to the piece of length 5.'
  choices: ['$5\sqrt3$', '$10\sqrt3$', '20', '10']
  answer: 3
  explanation: |-
    Leg $= \sqrt{(\text{hypotenuse})(\text{adjacent piece})} = \sqrt{20 \cdot 5} = 10$. $5\sqrt3 = \sqrt{75}$ is the altitude $\sqrt{5 \cdot 15}$, and $10\sqrt3 = \sqrt{20 \cdot 15}$ pairs the hypotenuse with the far piece (it is the other leg).
- id: geo-q-2308
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'Where does the 30°-60°-90° triangle come from?'
  choices: ['Half of an equilateral triangle, cut by an altitude', 'Half of a square, cut by a diagonal', 'A triangle inscribed in a semicircle', 'A third of a regular hexagon']
  answer: 0
  explanation: |-
    The altitude of an equilateral triangle (side $2s$) creates two 30°-60°-90° triangles with short leg $s$, hypotenuse $2s$ and long leg $s\sqrt3$. Half a square gives 45°-45°-90°.
- id: geo-q-2309
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'A square has side 6. How long is its diagonal?'
  choices: ['12', '$6\sqrt2$', '$6\sqrt3$', '$3\sqrt2$']
  answer: 1
  explanation: |-
    The diagonal is the hypotenuse of a 45°-45°-90° triangle with legs 6: $6\sqrt2 \approx 8.49$.
- id: geo-q-2310
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'In a 30°-60°-90° triangle the short leg is 5. A student says the long leg is 10. What is correct?'
  choices: ['Correct: the long leg is twice the short leg.', 'The long leg is $5\sqrt2$.', 'The long leg is $5\sqrt3$; 10 is the hypotenuse.', 'The long leg is $\tfrac{5}{\sqrt3}$.']
  answer: 2
  explanation: |-
    The ratio is $1 : \sqrt3 : 2$. The hypotenuse (not the long leg) is twice the short leg.
- id: geo-q-2311
  lesson: geo-special-right
  topic: Geometric mean
  stem: 'In right $\triangle ABC$, altitude $\overline{CD}$ to hypotenuse $\overline{AB}$ has length 8 and $AD = 4$. Find $DB$.'
  choices: ['2', '12', '32', '16']
  answer: 3
  explanation: |-
    $CD^2 = AD \cdot DB$: $64 = 4 \cdot DB$, so $DB = 16$.

- id: geo-q-2401
  lesson: geo-trig
  module_quiz: true
  topic: Trigonometric ratios
  stem: 'In right $\triangle ABC$ with right angle $C$, $BC = 5$, $AC = 12$, $AB = 13$. Find $\sin A$.'
  choices: ['$\tfrac{5}{13}$', '$\tfrac{12}{13}$', '$\tfrac{5}{12}$', '$\tfrac{13}{5}$']
  answer: 0
  explanation: |-
    The side opposite $\angle A$ is $BC = 5$, and the hypotenuse is 13: $\sin A = \tfrac{5}{13}$. $\tfrac{12}{13}$ is $\cos A$; $\tfrac{5}{12}$ is $\tan A$.
- id: geo-q-2402
  lesson: geo-trig
  topic: Trigonometric ratios
  stem: 'Using the same triangle ($BC = 5$, $AC = 12$, $AB = 13$, right angle $C$), find $\tan B$.'
  choices: ['$\tfrac{5}{12}$', '$\tfrac{12}{5}$', '$\tfrac{12}{13}$', '$\tfrac{5}{13}$']
  answer: 1
  explanation: |-
    For $\angle B$, the opposite side is $AC = 12$ and the adjacent side is $BC = 5$: $\tan B = \tfrac{12}{5}$. Opposite and adjacent swap when you switch angles.
- id: geo-q-2403
  lesson: geo-trig
  module_quiz: true
  topic: Solving right triangles
  stem: 'A right triangle has hypotenuse 20 and an acute angle of $40^\circ$. Find the side opposite the $40^\circ$ angle, to two decimals.'
  choices: ['15.32', '16.78', '12.86', '23.84']
  answer: 2
  explanation: |-
    $\text{opp} = 20\sin 40^\circ \approx 20(0.6428) \approx 12.86$. 15.32 is $20\cos 40^\circ$ (the adjacent side).
- id: geo-q-2404
  lesson: geo-trig
  topic: Solving right triangles
  stem: 'A right triangle has legs 9 and 14. Find the angle opposite the leg of 9, to the nearest tenth of a degree.'
  choices: ['$57.3^\circ$', '$40.0^\circ$', '$39.7^\circ$', '$32.7^\circ$']
  answer: 3
  explanation: |-
    $\tan\theta = \tfrac{9}{14}$, so $\theta = \tan^{-1}(0.6429) \approx 32.7^\circ$. $57.3^\circ$ is the other acute angle.
- id: geo-q-2405
  lesson: geo-trig
  topic: Trigonometric ratios
  stem: 'Which value equals $\sin 25^\circ$?'
  choices: ['$\cos 65^\circ$', '$\cos 25^\circ$', '$\sin 65^\circ$', '$\tan 65^\circ$']
  answer: 0
  explanation: |-
    $\sin\theta = \cos(90^\circ - \theta)$, so $\sin 25^\circ = \cos 65^\circ$.
- id: geo-q-2406
  lesson: geo-trig
  module_quiz: true
  topic: Solving right triangles
  stem: 'From 50 m away on level ground, the angle of elevation to the top of a tower is $35^\circ$. About how tall is the tower?'
  choices: ['28.7 m', '35.0 m', '41.0 m', '71.4 m']
  answer: 1
  explanation: |-
    $h = 50\tan 35^\circ \approx 50(0.7002) \approx 35.0$ m. 28.7 uses sine; 71.4 divides by $\tan 35^\circ$.
- id: geo-q-2407
  lesson: geo-trig
  topic: Trigonometric ratios
  stem: 'What is the exact value of $\cos 30^\circ$?'
  choices: ['$\tfrac12$', '$\tfrac{\sqrt2}{2}$', '$\tfrac{\sqrt3}{2}$', '$\sqrt3$']
  answer: 2
  explanation: |-
    In a 30°-60°-90° triangle with sides $1, \sqrt3, 2$, the side adjacent to $30^\circ$ is $\sqrt3$: $\cos 30^\circ = \tfrac{\sqrt3}{2}$.
- id: geo-q-2408
  lesson: geo-trig
  topic: Solving right triangles
  stem: 'A right triangle has an acute angle of $28^\circ$ whose adjacent leg is 15. Find the hypotenuse, to two decimals.'
  choices: ['13.24', '7.04', '31.95', '16.99']
  answer: 3
  explanation: |-
    $\cos 28^\circ = \tfrac{15}{h}$, so $h = \tfrac{15}{\cos 28^\circ} \approx \tfrac{15}{0.8829} \approx 16.99$. 13.24 multiplies instead of dividing.
- id: geo-q-2409
  lesson: geo-trig
  topic: Solving right triangles
  stem: 'A pilot 2000 m above the ground sees a landmark at an angle of depression of $15^\circ$. About how far is the landmark horizontally from the plane?'
  choices: ['7464 m', '536 m', '1932 m', '7727 m']
  answer: 0
  explanation: |-
    The angle of elevation from the landmark is also $15^\circ$: $\tan 15^\circ = \tfrac{2000}{d}$, so $d = \tfrac{2000}{\tan 15^\circ} \approx \tfrac{2000}{0.2679} \approx 7464$ m. 7727 m is the line-of-sight distance $\tfrac{2000}{\sin 15^\circ}$.
- id: geo-q-2410
  lesson: geo-trig
  topic: Trigonometric ratios
  stem: 'Why does $\sin 37^\circ$ have the same value in every right triangle with a $37^\circ$ angle?'
  choices: ['All right triangles are congruent.', 'All right triangles with a $37^\circ$ angle are similar by AA, so their side ratios are equal.', 'Because $37^\circ$ is acute.', 'Because the hypotenuse is always 1.']
  answer: 1
  explanation: |-
    Each has a $90^\circ$ and a $37^\circ$ angle, so they're similar (AA), and corresponding side ratios like opposite/hypotenuse are equal.
- id: geo-q-2411
  lesson: geo-trig
  topic: Solving right triangles
  stem: 'A 4 m ramp rises 1 m. What angle does it make with the ground, to the nearest tenth of a degree?'
  choices: ['$75.5^\circ$', '$14.0^\circ$', '$0.25^\circ$', '$14.5^\circ$']
  answer: 3
  explanation: |-
    The ramp is the hypotenuse and the rise is opposite the angle: $\theta = \sin^{-1}\left(\tfrac14\right) \approx 14.5^\circ$. $14.0^\circ$ uses tangent (treating 4 m as the horizontal run), and $75.5^\circ$ is $\cos^{-1}(0.25)$, the angle at the top.
# Lesson 25 — The Law of Sines
- id: geo-q-2451
  lesson: geo-law-sines
  module_quiz: true
  topic: Law of Sines
  stem: 'In $\triangle ABC$, $m\angle A = 48^\circ$, $m\angle B = 72^\circ$ and $a = 10$. Find $b$, to two decimals.'
  choices: ['12.80', '7.81', '10.98', '15.00']
  answer: 0
  explanation: |-
    $\dfrac{b}{\sin 72^\circ} = \dfrac{10}{\sin 48^\circ}$, so $b = \dfrac{10\sin 72^\circ}{\sin 48^\circ} \approx \dfrac{10(0.9511)}{0.7431} \approx 12.80$. 7.81 turns the ratio upside down; 10.98 divides by $\sin 60^\circ$ (the third angle), pairing $a = 10$ with the wrong angle instead of its own opposite angle, $48^\circ$; 15.00 uses the angles themselves, $10 \cdot \tfrac{72}{48}$, instead of their sines.
- id: geo-q-2452
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'In $\triangle ABC$, side $a$ is opposite $\angle A$, and so on. Which equation is the Law of Sines?'
  choices: ['$\dfrac{a}{\sin B} = \dfrac{b}{\sin A}$', '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$', '$a\sin A = b\sin B$', '$\dfrac{a}{\cos A} = \dfrac{b}{\cos B}$']
  answer: 1
  explanation: |-
    Each side is divided by the sine of the angle opposite it, and these ratios are equal. Pairing $a$ with $\sin B$ uses the wrong angle; $a\sin A = b\sin B$ multiplies where it should divide; the cosine version is not a law at all (the altitude in the proof is $b\sin A = a\sin B$, which involves sines).
- id: geo-q-2453
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'Which value equals $\sin 130^\circ$?'
  choices: ['$-\sin 50^\circ$', '$\sin 40^\circ$', '$\sin 50^\circ$', '$-\cos 50^\circ$']
  answer: 2
  explanation: |-
    $\sin\theta = \sin(180^\circ - \theta)$, so $\sin 130^\circ = \sin 50^\circ \approx 0.766$. The sine of an obtuse angle is positive (the point is above the $x$-axis), so $-\sin 50^\circ$ has the wrong sign; $\sin 40^\circ$ subtracts from $90^\circ$ instead of $180^\circ$; $-\cos 50^\circ$ mixes in the cosine rule.
- id: geo-q-2454
  lesson: geo-law-sines
  module_quiz: true
  topic: Law of Sines
  stem: 'What is the exact value of $\cos 120^\circ$?'
  choices: ['$\tfrac12$', '$-\tfrac{\sqrt3}{2}$', '$\tfrac{\sqrt3}{2}$', '$-\tfrac12$']
  answer: 3
  explanation: |-
    $\cos 120^\circ = -\cos(180^\circ - 120^\circ) = -\cos 60^\circ = -\tfrac12$. The point on the $120^\circ$ side is left of the $y$-axis, so the cosine is negative; $\tfrac12$ forgets the sign. $\pm\tfrac{\sqrt3}{2}$ uses $\cos 30^\circ$ instead of $\cos 60^\circ$.
- id: geo-q-2455
  lesson: geo-law-sines
  module_quiz: true
  topic: Ambiguous case
  stem: 'How many triangles have $m\angle A = 40^\circ$, $a = 8$ and $b = 10$?'
  choices: ['Exactly two', 'None', 'Exactly one', 'Exactly one, a right triangle']
  answer: 0
  explanation: |-
    The altitude from $C$ is $h = b\sin A = 10\sin 40^\circ \approx 6.43$. Since $h < a < b$ ($6.43 < 8 < 10$), side $a$ reaches the base at two points: two triangles. "None" would need $a < h$, "one right triangle" would need $a = h$, and "exactly one" would need $a \ge b$.
- id: geo-q-2456
  lesson: geo-law-sines
  topic: Ambiguous case
  stem: 'How many triangles have $m\angle A = 30^\circ$, $a = 3$ and $b = 10$?'
  choices: ['Exactly one', 'None', 'Exactly two', 'Exactly one, a right triangle']
  answer: 1
  explanation: |-
    $h = 10\sin 30^\circ = 5$, and $a = 3 < 5$, so side $a$ is too short to reach: no triangle. The Law of Sines agrees: $\sin B = \tfrac{10(0.5)}{3} \approx 1.67 > 1$. Answering "two" because $a < b$ skips the check against $h$; a right triangle would need $a = 5$ exactly.
- id: geo-q-2457
  lesson: geo-law-sines
  topic: Ambiguous case
  stem: 'How many triangles have $m\angle A = 65^\circ$, $a = 12$ and $b = 9$?'
  choices: ['None', 'Exactly two', 'Exactly one', 'Exactly one, a right triangle']
  answer: 2
  explanation: |-
    When $a \ge b$ the side opposite the given angle is the longer one, so there is exactly one triangle: $\sin B = \tfrac{9\sin 65^\circ}{12} \approx 0.680$, $B \approx 42.8^\circ$, and the supplement $137.2^\circ$ would make $A + B > 180^\circ$. "Two" forgets to test the supplement; the triangle is not right because $a \ne b\sin A \approx 8.16$.
- id: geo-q-2458
  lesson: geo-law-sines
  topic: Ambiguous case
  stem: 'In $\triangle ABC$, $m\angle A = 35^\circ$, $a = 6$ and $b = 9$. What are the possible measures of $\angle B$?'
  choices: ['$B \approx 59.36^\circ$ only', '$B \approx 22.48^\circ$ only', '$B \approx 22.48^\circ$ or $B \approx 157.52^\circ$', '$B \approx 59.36^\circ$ or $B \approx 120.64^\circ$']
  answer: 3
  explanation: |-
    $\sin B = \dfrac{9\sin 35^\circ}{6} \approx 0.8604$, so $B_1 \approx 59.36^\circ$ and $B_2 = 180^\circ - 59.36^\circ = 120.64^\circ$. Both work, since $35^\circ + 120.64^\circ < 180^\circ$ (and $h = 9\sin 35^\circ \approx 5.16 < 6 < 9$). "59.36° only" forgets the supplement; the $22.48^\circ$ answers come from swapping the sides, $\sin B = \tfrac{6\sin 35^\circ}{9}$.
- id: geo-q-2459
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'Two ranger towers $A$ and $B$ are 10 km apart. Each sights a fire $F$: $m\angle FAB = 38^\circ$ and $m\angle FBA = 61^\circ$. How far is the fire from tower $A$, to two decimals?'
  choices: ['8.86 km', '6.23 km', '11.29 km', '14.21 km']
  answer: 0
  explanation: |-
    $m\angle F = 180^\circ - 38^\circ - 61^\circ = 81^\circ$, opposite the known 10 km. $AF$ is opposite $\angle B$: $AF = \dfrac{10\sin 61^\circ}{\sin 81^\circ} \approx 8.86$ km. 6.23 km is $BF$ (opposite the $38^\circ$ angle); 11.29 km inverts the ratio; 14.21 km divides by $\sin 38^\circ$ instead of the sine of the angle opposite the 10 km side.
- id: geo-q-2460
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'For which given information can the Law of Sines NOT be used to start solving the triangle?'
  choices: ['Two angles and a side not between them (AAS)', 'Two sides and the angle between them (SAS)', 'Two angles and the side between them (ASA)', 'Two sides and an angle opposite one of them (SSA)']
  answer: 1
  explanation: |-
    The Law of Sines needs one side together with its opposite angle. In SAS the known angle is between the known sides, so neither side's opposite angle is known; that case needs the Law of Cosines. AAS and ASA give the third angle by the angle sum, completing a pair, and SSA gives a pair directly (though it may be ambiguous).
- id: geo-q-2461
  lesson: geo-law-sines
  topic: Ambiguous case
  stem: 'A student solves $\triangle ABC$ with $m\angle A = 25^\circ$, $a = 6$, $b = 10$ and reports a single answer, $m\angle B \approx 44.78^\circ$. What did the student miss?'
  choices: ['Nothing: SSA always gives one triangle', 'No triangle exists, because $a < b$', 'A second triangle with $m\angle B \approx 135.22^\circ$', 'The angle should be $180^\circ - 25^\circ - 44.78^\circ = 110.22^\circ$']
  answer: 2
  explanation: |-
    $h = 10\sin 25^\circ \approx 4.23$ and $4.23 < 6 < 10$, so there are two triangles. $\sin^{-1}$ gives only the acute angle; the supplement $135.22^\circ$ also works because $25^\circ + 135.22^\circ < 180^\circ$. SSA does not always give one triangle; $a < b$ alone doesn't rule a triangle out (that needs $a < h$); and $110.22^\circ$ is angle $C$ of the first triangle, not another value of $B$.
- id: geo-q-2462
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'The proof of the Law of Sines drops the altitude $h$ from $C$ to line $AB$. Which two expressions for $h$ does it set equal?'
  choices: ['$h = a\sin A$ and $h = b\sin B$', '$h = b\cos A$ and $h = a\cos B$', '$h = c\sin C$ and $h = b\sin B$', '$h = b\sin A$ and $h = a\sin B$']
  answer: 3
  explanation: |-
    In the right triangle containing $\angle A$, the hypotenuse is $b$ and $h$ is opposite $A$: $h = b\sin A$. In the one containing $\angle B$, the hypotenuse is $a$: $h = a\sin B$. Then $b\sin A = a\sin B$ rearranges to $\tfrac{a}{\sin A} = \tfrac{b}{\sin B}$. Pairing each side with its own opposite angle puts the wrong hypotenuse in each triangle; cosines give the pieces of the base, not the height; and $c$ is the base, not a hypotenuse.
- id: geo-q-2463
  lesson: geo-law-sines
  module_quiz: true
  topic: Law of Sines
  stem: 'In $\triangle ABC$, $m\angle A = 105^\circ$, $m\angle B = 40^\circ$ and $a = 15$. Find $c$, to two decimals.'
  choices: ['8.91', '25.26', '9.98', '13.38']
  answer: 0
  explanation: |-
    $m\angle C = 180^\circ - 105^\circ - 40^\circ = 35^\circ$. Then $c = \dfrac{15\sin 35^\circ}{\sin 105^\circ} \approx \dfrac{15(0.5736)}{0.9659} \approx 8.91$. 25.26 inverts the ratio; 9.98 is side $b$ (it uses $\sin 40^\circ$); 13.38 divides by $\sin 40^\circ$, pairing $a$ with the wrong angle.
# Lesson 26 — The Law of Cosines and solving any triangle
- id: geo-q-2471
  lesson: geo-law-cosines
  module_quiz: true
  topic: Law of Cosines
  stem: 'In $\triangle ABC$, $b = 5$, $c = 8$ and $m\angle A = 60^\circ$. Find $a$.'
  choices: ['$\sqrt{89}$', '$7$', '$\sqrt{129}$', '$\sqrt{4.5}$']
  answer: 1
  explanation: |-
    $a^2 = 5^2 + 8^2 - 2(5)(8)\cos 60^\circ = 25 + 64 - 80(0.5) = 49$, so $a = 7$. $\sqrt{89}$ leaves out the $-2bc\cos A$ term (that's only right for a $90^\circ$ angle); $\sqrt{129}$ adds the term instead of subtracting; $\sqrt{4.5}$ computes $(25 + 64 - 80)\cos 60^\circ$, subtracting $2bc$ before multiplying by the cosine.
- id: geo-q-2472
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'A triangle has sides 5, 7 and 8. Find the angle opposite the side of length 7.'
  choices: ['$81.79^\circ$', '$38.21^\circ$', '$60^\circ$', '$120^\circ$']
  answer: 2
  explanation: |-
    $\cos\theta = \dfrac{5^2 + 8^2 - 7^2}{2(5)(8)} = \dfrac{40}{80} = \tfrac12$, so $\theta = 60^\circ$. $120^\circ$ comes from a sign slip ($\cos\theta = -\tfrac12$); $81.79^\circ$ and $38.21^\circ$ are the angles opposite 8 and 5, from putting the wrong side in the subtracted position.
- id: geo-q-2473
  lesson: geo-law-cosines
  module_quiz: true
  topic: Law of Cosines
  stem: 'A triangle has sides 6, 8 and 11. What is its largest angle?'
  choices: ['Acute, about $77.36^\circ$', 'Acute, about $32.16^\circ$', 'Right, $90^\circ$', 'Obtuse, about $102.64^\circ$']
  answer: 3
  explanation: |-
    The largest angle is opposite 11: $\cos C = \dfrac{36 + 64 - 121}{2(6)(8)} = \dfrac{-21}{96} \approx -0.2188$, so $C \approx 102.64^\circ$. The negative cosine signals an obtuse angle (also $11^2 > 6^2 + 8^2$). $77.36^\circ$ drops the minus sign; $32.16^\circ$ is the smallest angle, opposite 6; it isn't right because $6^2 + 8^2 = 100 \ne 121$.
- id: geo-q-2474
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'Two hikers leave the same point. One walks 5 km and the other 7 km, on straight paths that make a $130^\circ$ angle. How far apart are they, to two decimals?'
  choices: ['10.91 km', '5.39 km', '8.60 km', '12.00 km']
  answer: 0
  explanation: |-
    $d^2 = 5^2 + 7^2 - 2(5)(7)\cos 130^\circ \approx 74 - 70(-0.6428) \approx 118.99$, so $d \approx 10.91$ km. 5.39 km treats $\cos 130^\circ$ as positive (subtracting 45 instead of adding); 8.60 km is $\sqrt{74}$, the Pythagorean answer for a right angle; 12.00 km just adds the distances, which only happens for a $180^\circ$ angle.
- id: geo-q-2475
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'What does the Law of Cosines $a^2 = b^2 + c^2 - 2bc\cos A$ become when $m\angle A = 90^\circ$?'
  choices: ['$a^2 = b^2 + c^2 - 2bc$', '$a^2 = b^2 + c^2$', '$a = b + c$', '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$']
  answer: 1
  explanation: |-
    $\cos 90^\circ = 0$, so the correction term vanishes and $a^2 = b^2 + c^2$: the Pythagorean theorem, with $a$ as the hypotenuse. Keeping $-2bc$ treats $\cos 90^\circ$ as 1 (that's $\cos 0^\circ$); $a = b + c$ drops the squares; the Law of Sines is a different relationship.
- id: geo-q-2476
  lesson: geo-law-cosines
  topic: Solving triangles
  stem: 'You know all three sides of a triangle. What is the safest first step?'
  choices: ['Use the Law of Sines to find any angle', 'Use the angle sum to find the third angle', 'Use the Law of Cosines to find the largest angle', 'Nothing: three sides do not determine a triangle']
  answer: 2
  explanation: |-
    With SSS no angle is known, so start with the Law of Cosines, and use it on the largest angle (opposite the longest side), the only one that might be obtuse. After that, every remaining angle is acute and either law works. The Law of Sines needs a known angle to start; the angle sum needs two angles; and SSS does determine a unique triangle (it's a congruence test).
- id: geo-q-2477
  lesson: geo-law-cosines
  module_quiz: true
  topic: Law of Cosines
  stem: 'Which formula gives $\cos B$ in $\triangle ABC$?'
  choices: ['$\dfrac{a^2 + b^2 - c^2}{2ab}$', '$\dfrac{b^2 - a^2 - c^2}{2ac}$', '$\dfrac{a^2 + c^2 - b^2}{ac}$', '$\dfrac{a^2 + c^2 - b^2}{2ac}$']
  answer: 3
  explanation: |-
    Start from $b^2 = a^2 + c^2 - 2ac\cos B$ (the angle is between sides $a$ and $c$) and solve: $\cos B = \dfrac{a^2 + c^2 - b^2}{2ac}$. The $2ab$ version is $\cos C$; flipping the signs in the numerator gives $-\cos B$; dropping the 2 in the denominator doubles the value.
- id: geo-q-2478
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'A student applies the Law of Cosines to sides 4, 5 and 10 to find the angle opposite 10. What happens?'
  choices: ['$\cos C = -1.475$, so no such triangle exists', '$\cos C = -1.475$, so $C$ is a very obtuse angle', '$\cos C = 1.475$, so $C$ is acute', '$\cos C = 0$, so $C = 90^\circ$']
  answer: 0
  explanation: |-
    $\cos C = \dfrac{16 + 25 - 100}{2(4)(5)} = \dfrac{-59}{40} = -1.475$. No angle has a cosine less than $-1$, so no triangle exists, which matches the triangle inequality ($4 + 5 < 10$). A negative cosine means obtuse only when it is between $-1$ and 0; the positive value comes from reversing the numerator; and $4^2 + 5^2 \ne 10^2$, so it is not a right angle.
- id: geo-q-2479
  lesson: geo-law-cosines
  topic: Solving triangles
  stem: 'In $\triangle ABC$, $b = 6$, $c = 10$, $m\angle A = 40^\circ$, and the student found $a \approx 6.64$. Then the student used $\sin C = \tfrac{10\sin 40^\circ}{6.64} \approx 0.968$ and wrote $m\angle C \approx 75.5^\circ$. What is correct?'
  choices: ['$m\angle C \approx 75.5^\circ$ is correct', '$m\angle C \approx 104.5^\circ$, because $\angle C$ is the largest angle and $\sin^{-1}$ only returns acute angles', '$m\angle C \approx 64.5^\circ$, the remaining angle', 'No triangle exists, because $\sin C$ is close to 1']
  answer: 1
  explanation: |-
    $\angle C$ is opposite the longest side, so it is the one angle that may be obtuse, and $\sin C \approx 0.968$ fits both $75.5^\circ$ and $104.5^\circ$. The Law of Cosines settles it: $\cos C = \tfrac{6.64^2 + 36 - 100}{2(6.64)(6)} \approx -0.250$, so $C \approx 104.5^\circ$. (Equivalently, the smaller angle $B \approx 35.5^\circ$, and $180^\circ - 40^\circ - 35.5^\circ = 104.5^\circ$.) Accepting $75.5^\circ$ is the Law of Sines trap; $64.5^\circ$ comes from $180^\circ - 40^\circ - 75.5^\circ$, building on that wrong angle; and a sine below 1 means a triangle exists.
- id: geo-q-2480
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'A triangular garden has two sides of 12 m and 15 m that meet at a $72^\circ$ angle. How long is the third side, to two decimals?'
  choices: ['19.21 m', '21.91 m', '16.05 m', '1.67 m']
  answer: 2
  explanation: |-
    $x^2 = 12^2 + 15^2 - 2(12)(15)\cos 72^\circ \approx 369 - 360(0.3090) \approx 257.75$, so $x \approx 16.05$ m. 19.21 m is $\sqrt{369}$, ignoring the angle; 21.91 m adds $360\cos 72^\circ$ instead of subtracting it; 1.67 m multiplies $(369 - 360)$ by $\cos 72^\circ$, an order-of-operations slip.
- id: geo-q-2481
  lesson: geo-law-cosines
  module_quiz: true
  topic: Solving triangles
  stem: 'Which set of given information does NOT determine a single triangle?'
  choices: ['Three sides (SSS)', 'Two sides and the included angle (SAS)', 'Two angles and the included side (ASA)', 'Three angles (AAA)']
  answer: 3
  explanation: |-
    Three angles fix only the shape: every triangle similar to one solution is another solution, so AAA gives infinitely many triangles of different sizes. SSS and SAS are solved by the Law of Cosines, and ASA by the angle sum and the Law of Sines; each gives exactly one triangle (they are congruence tests).
- id: geo-q-2482
  lesson: geo-law-cosines
  topic: Law of Cosines
  stem: 'A triangle has sides 8, 10 and 12. Find its smallest angle, to two decimals.'
  choices: ['$41.41^\circ$', '$55.77^\circ$', '$82.82^\circ$', '$138.59^\circ$']
  answer: 0
  explanation: |-
    The smallest angle is opposite the shortest side, 8: $\cos\theta = \dfrac{10^2 + 12^2 - 8^2}{2(10)(12)} = \dfrac{180}{240} = 0.75$, so $\theta \approx 41.41^\circ$. $55.77^\circ$ and $82.82^\circ$ are the angles opposite 10 and 12; $138.59^\circ$ is the supplement, from a sign slip in the numerator.
