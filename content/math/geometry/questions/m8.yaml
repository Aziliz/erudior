# Module 8 — Area, surface area and volume
- id: geo-q-2901
  lesson: geo-area-poly
  module_quiz: true
  topic: Area of polygons
  stem: 'A trapezoid has bases 7 and 13 and height 6. Find its area.'
  choices: ['120', '60', '546', '39']
  answer: 1
  explanation: |-
    $A = \tfrac12(7 + 13)(6) = \tfrac12 \cdot 20 \cdot 6 = 60$. 120 forgets the $\tfrac12$.
- id: geo-q-2902
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'A parallelogram has sides 12 and 9, and the height to the side of 12 is 7. Find its area.'
  choices: ['108', '63', '84', '42']
  answer: 2
  explanation: |-
    $A = bh = 12 \cdot 7 = 84$. The slanted side 9 is not the height.
- id: geo-q-2903
  lesson: geo-area-poly
  module_quiz: true
  topic: Area of polygons
  stem: 'A rhombus has diagonals 14 and 20. Find its area.'
  choices: ['280', '34', '70', '140']
  answer: 3
  explanation: |-
    $A = \tfrac12 d_1 d_2 = \tfrac12 \cdot 14 \cdot 20 = 140$.
- id: geo-q-2904
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'A triangle has sides 10 and 14 with an included angle of $30^\circ$. Find its area.'
  choices: ['35', '70', '$35\sqrt3$', '140']
  answer: 0
  explanation: |-
    $A = \tfrac12 ab\sin C = \tfrac12 \cdot 10 \cdot 14 \cdot \tfrac12 = 35$. $35\sqrt3$ uses $\cos 30^\circ$.
- id: geo-q-2905
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'An isosceles trapezoid has bases 10 and 22 and legs 10. Find its area.'
  choices: ['160', '128', '320', '176']
  answer: 1
  explanation: |-
    Each overhang is $\tfrac{22 - 10}{2} = 6$, so the height is $\sqrt{10^2 - 6^2} = 8$. $A = \tfrac12(10 + 22)(8) = 128$. 160 uses the leg as the height.
- id: geo-q-2906
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'Why is the area of a triangle $\tfrac12 bh$?'
  choices: ['Because a triangle has three sides', 'Because the height is half the base', 'Two copies of the triangle form a parallelogram with base $b$ and height $h$.', 'By the Pythagorean theorem']
  answer: 2
  explanation: |-
    Rotating a copy of the triangle and joining it along a side makes a parallelogram of area $bh$; the triangle is half of it.
- id: geo-q-2907
  lesson: geo-area-poly
  module_quiz: true
  topic: Area of polygons
  stem: 'A $15 \times 12$ rectangle has a $4 \times 3$ rectangle removed from one corner. Find the area of what remains.'
  choices: ['168', '180', '54', '192']
  answer: 0
  explanation: |-
    $15 \cdot 12 - 4 \cdot 3 = 180 - 12 = 168$. (Its perimeter is still 54, but the question asks for area.)
- id: geo-q-2908
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'Use Heron''s formula to find the area of a triangle with sides 5, 5 and 6.'
  choices: ['15', '24', '30', '12']
  answer: 3
  explanation: |-
    $s = 8$, so $A = \sqrt{8 \cdot 3 \cdot 3 \cdot 2} = \sqrt{144} = 12$. Check: the height to the base 6 is $\sqrt{25 - 9} = 4$, and $\tfrac12 \cdot 6 \cdot 4 = 12$.
- id: geo-q-2909
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'A room is 4 yd by 5 yd. How many square feet is that?'
  choices: ['60', '180', '540', '20']
  answer: 1
  explanation: |-
    $4 \text{ yd} = 12$ ft and $5 \text{ yd} = 15$ ft, so the area is $180$ ft². (Equivalently $20 \text{ yd}^2 \times 9 = 180$.) 60 multiplies by 3 instead of 9.
- id: geo-q-2910
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'A triangle has vertices $(0, 0)$, $(8, 0)$ and $(3, 6)$. Find its area.'
  choices: ['48', '18', '24', '30']
  answer: 2
  explanation: |-
    Use the side on the $x$-axis as the base (8); the height is the $y$-coordinate of the third vertex (6). $A = \tfrac12 \cdot 8 \cdot 6 = 24$.
- id: geo-q-2911
  lesson: geo-area-poly
  topic: Area of polygons
  stem: 'A kite has area 54 and one diagonal 9. Find the other diagonal.'
  choices: ['6', '3', '24', '12']
  answer: 3
  explanation: |-
    $\tfrac12 \cdot 9 \cdot d = 54$, so $d = 12$.

- id: geo-q-3001
  lesson: geo-area-circle
  module_quiz: true
  topic: Area of circles and sectors
  stem: 'A circle has diameter 14. Find its area.'
  choices: ['$49\pi$', '$196\pi$', '$14\pi$', '$28\pi$']
  answer: 0
  explanation: |-
    $r = 7$, so $A = 49\pi \approx 153.94$. $196\pi$ squares the diameter; $14\pi$ is the circumference.
- id: geo-q-3002
  lesson: geo-area-circle
  module_quiz: true
  topic: Area of circles and sectors
  stem: 'Find the area of a $120^\circ$ sector of a circle with radius 9.'
  choices: ['$6\pi$', '$27\pi$', '$81\pi$', '$54\pi$']
  answer: 1
  explanation: |-
    $\tfrac{120}{360} \cdot 81\pi = 27\pi \approx 84.82$. $6\pi$ is the arc length.
- id: geo-q-3003
  lesson: geo-area-circle
  topic: Area of circles and sectors
  stem: 'A circle has circumference $20\pi$. Find its area.'
  choices: ['$20\pi$', '$400\pi$', '$100\pi$', '$40\pi$']
  answer: 2
  explanation: |-
    $2\pi r = 20\pi$ gives $r = 10$, so $A = 100\pi$.
- id: geo-q-3004
  lesson: geo-area-circle
  topic: Regular polygons
  stem: 'A regular hexagon has side 6. Find its apothem.'
  choices: ['6', '$6\sqrt3$', '3', '$3\sqrt3$']
  answer: 3
  explanation: |-
    Half a side is 3 and half the central angle is $30^\circ$, so the apothem is the long leg of a 30°-60°-90° triangle with short leg 3: $3\sqrt3$. 6 is the radius.
- id: geo-q-3005
  lesson: geo-area-circle
  module_quiz: true
  topic: Regular polygons
  stem: 'A regular octagon has side 10 and apothem about 12.07. Find its area.'
  choices: ['About 482.8', 'About 965.6', 'About 120.7', 'About 241.4']
  answer: 0
  explanation: |-
    $P = 80$, so $A = \tfrac12 aP \approx \tfrac12 \cdot 12.07 \cdot 80 \approx 482.8$. 965.6 forgets the $\tfrac12$.
- id: geo-q-3006
  lesson: geo-area-circle
  topic: Area of circles and sectors
  stem: 'Find the area of the segment cut off by a chord that subtends a $90^\circ$ central angle in a circle of radius 4.'
  choices: ['$4\pi$', '$4\pi - 8$', '$8 - 4\pi$', '$16\pi - 8$']
  answer: 1
  explanation: |-
    Sector: $\tfrac14 \cdot 16\pi = 4\pi$. Triangle (right, legs 4 and 4): 8. Segment $= 4\pi - 8 \approx 4.57$.
- id: geo-q-3007
  lesson: geo-area-circle
  topic: Regular polygons
  stem: 'What is the apothem of a regular polygon?'
  choices: ['The distance from the center to a vertex', 'The length of a side', 'The perpendicular distance from the center to a side', 'Half a diagonal']
  answer: 2
  explanation: |-
    The apothem is the perpendicular from the center to the midpoint of a side; the radius goes to a vertex.
- id: geo-q-3008
  lesson: geo-area-circle
  topic: Area of circles and sectors
  stem: 'A pizza of diameter 16 in is cut into 8 equal slices. What is the area of one slice, to the nearest square inch?'
  choices: ['6', '50', '201', '25']
  answer: 3
  explanation: |-
    $r = 8$: whole area $64\pi \approx 201.06$; one slice is $\tfrac18$ of it, $8\pi \approx 25$ in².
- id: geo-q-3009
  lesson: geo-area-circle
  topic: Regular polygons
  stem: 'Find the area of a regular hexagon with side 4.'
  choices: ['$24\sqrt3$', '$12\sqrt3$', '48', '$48\sqrt3$']
  answer: 0
  explanation: |-
    Six equilateral triangles of side 4, each $\tfrac{\sqrt3}{4} \cdot 16 = 4\sqrt3$: total $24\sqrt3 \approx 41.57$. (Or $\tfrac12 \cdot 2\sqrt3 \cdot 24$.)
- id: geo-q-3010
  lesson: geo-area-circle
  topic: Area of circles and sectors
  stem: 'If the radius of a circle is tripled, what happens to its area?'
  choices: ['It triples.', 'It is multiplied by 9.', 'It is multiplied by 6.', 'It is multiplied by 27.']
  answer: 1
  explanation: |-
    $\pi(3r)^2 = 9\pi r^2$. Area scales with the square of the scale factor.
- id: geo-q-3011
  lesson: geo-area-circle
  topic: Area of circles and sectors
  stem: 'A sector of a circle with radius 10 has area $15\pi$. Find its central angle.'
  choices: ['$15^\circ$', '$27^\circ$', '$54^\circ$', '$108^\circ$']
  answer: 2
  explanation: |-
    $\tfrac{\theta}{360} \cdot 100\pi = 15\pi$, so $\theta = 360 \cdot 0.15 = 54^\circ$.

- id: geo-q-3101
  lesson: geo-surface
  module_quiz: true
  topic: Surface area
  stem: 'Find the surface area of a cylinder with radius 3 and height 8.'
  choices: ['$48\pi$', '$72\pi$', '$57\pi$', '$66\pi$']
  answer: 3
  explanation: |-
    $S = 2\pi rh + 2\pi r^2 = 48\pi + 18\pi = 66\pi \approx 207.3$. $48\pi$ is only the lateral area; $57\pi$ includes one base.
- id: geo-q-3102
  lesson: geo-surface
  topic: Surface area
  stem: 'Find the surface area of a rectangular prism 6 by 4 by 2.'
  choices: ['88', '48', '44', '96']
  answer: 0
  explanation: |-
    $2(6 \cdot 4 + 6 \cdot 2 + 4 \cdot 2) = 2(24 + 12 + 8) = 88$. 48 is the volume.
- id: geo-q-3103
  lesson: geo-surface
  module_quiz: true
  topic: Surface area
  stem: 'A cone has radius 6 and height 8. Find its total surface area.'
  choices: ['$60\pi$', '$96\pi$', '$84\pi$', '$108\pi$']
  answer: 1
  explanation: |-
    Slant height $\ell = \sqrt{36 + 64} = 10$. $S = \pi r\ell + \pi r^2 = 60\pi + 36\pi = 96\pi$. $84\pi$ uses the height 8 instead of the slant height.
- id: geo-q-3104
  lesson: geo-surface
  topic: Surface area
  stem: 'Find the surface area of a sphere with radius 7.'
  choices: ['$49\pi$', '$\tfrac{1372}{3}\pi$', '$196\pi$', '$98\pi$']
  answer: 2
  explanation: |-
    $S = 4\pi r^2 = 4\pi(49) = 196\pi \approx 615.8$. $\tfrac{1372}{3}\pi$ is the volume.
- id: geo-q-3105
  lesson: geo-surface
  module_quiz: true
  topic: Solids
  stem: 'A polyhedron has 12 vertices and 30 edges. How many faces does it have?'
  choices: ['18', '16', '42', '20']
  answer: 3
  explanation: |-
    Euler: $V - E + F = 2$, so $12 - 30 + F = 2$ and $F = 20$ (an icosahedron).
- id: geo-q-3106
  lesson: geo-surface
  topic: Surface area
  stem: 'A square pyramid has base edge 6 and slant height 5. Find its surface area.'
  choices: ['96', '66', '60', '156']
  answer: 0
  explanation: |-
    Lateral area $= \tfrac12 P\ell = \tfrac12 \cdot 24 \cdot 5 = 60$; base $= 36$. Total $96$.
- id: geo-q-3107
  lesson: geo-surface
  module_quiz: true
  topic: Surface area
  stem: 'A square pyramid has base edge 16 and height 6. What is its slant height?'
  choices: ['$\sqrt{292}$', '10', '$2\sqrt{7}$', '22']
  answer: 1
  explanation: |-
    The slant height is the hypotenuse of a right triangle with legs 6 (height) and 8 (half the base edge): $\sqrt{36 + 64} = 10$. $\sqrt{292}$ uses the full base edge.
- id: geo-q-3108
  lesson: geo-surface
  topic: Solids
  stem: 'Which solid has two congruent parallel circular bases?'
  choices: ['Cone', 'Sphere', 'Cylinder', 'Pyramid']
  answer: 2
  explanation: |-
    A cylinder has two congruent parallel circular bases; a cone has one.
- id: geo-q-3109
  lesson: geo-surface
  topic: Surface area
  stem: 'A can''s label covers its curved side. The can has diameter 8 cm and height 12 cm. Find the label''s area.'
  choices: ['$192\pi$ cm²', '$128\pi$ cm²', '$48\pi$ cm²', '$96\pi$ cm²']
  answer: 3
  explanation: |-
    Lateral area $= 2\pi rh = 2\pi(4)(12) = 96\pi \approx 301.6$ cm². $192\pi$ uses the diameter as the radius.
- id: geo-q-3110
  lesson: geo-surface
  topic: Solids
  stem: 'What is the net of a cylinder?'
  choices: ['Two circles and a rectangle', 'Two circles and a triangle', 'One circle and a sector', 'Six rectangles']
  answer: 0
  explanation: |-
    The curved side unrolls into a rectangle of width $2\pi r$ and height $h$, attached to two circular bases. (One circle and a sector is a cone's net.)
- id: geo-q-3111
  lesson: geo-surface
  topic: Surface area
  stem: 'A cube has surface area 150 cm². Find its edge length.'
  choices: ['25 cm', '5 cm', '$\sqrt{150}$ cm', '6 cm']
  answer: 1
  explanation: |-
    Six square faces: $6s^2 = 150$, so $s^2 = 25$ and $s = 5$ cm.

- id: geo-q-3201
  lesson: geo-volume
  module_quiz: true
  topic: Volume
  stem: 'Find the volume of a cone with radius 4 and height 9.'
  choices: ['$144\pi$', '$36\pi$', '$48\pi$', '$12\pi$']
  answer: 2
  explanation: |-
    $V = \tfrac13 \pi r^2 h = \tfrac13 \pi (16)(9) = 48\pi \approx 150.8$. $144\pi$ is the cylinder (forgot the $\tfrac13$).
- id: geo-q-3202
  lesson: geo-volume
  module_quiz: true
  topic: Volume
  stem: 'Find the volume of a sphere with radius 3.'
  choices: ['$12\pi$', '$27\pi$', '$108\pi$', '$36\pi$']
  answer: 3
  explanation: |-
    $V = \tfrac43 \pi r^3 = \tfrac43 \pi (27) = 36\pi \approx 113.1$. $36\pi$ is also the surface area here, a coincidence that happens only at $r = 3$.
- id: geo-q-3203
  lesson: geo-volume
  topic: Volume
  stem: 'A square pyramid has base edge 10 and height 12. Find its volume.'
  choices: ['400', '1200', '600', '520']
  answer: 0
  explanation: |-
    $V = \tfrac13 Bh = \tfrac13 \cdot 100 \cdot 12 = 400$.
- id: geo-q-3204
  lesson: geo-volume
  module_quiz: true
  topic: Cavalieri's principle
  stem: 'An oblique cylinder has radius 5 and slanted side 13, and its perpendicular height is 12. Find its volume.'
  choices: ['$325\pi$', '$300\pi$', '$100\pi$', '$650\pi$']
  answer: 1
  explanation: |-
    By Cavalieri's principle, $V = \pi r^2 h$ with the perpendicular height: $25\pi \cdot 12 = 300\pi$. Using the slanted side gives $325\pi$.
- id: geo-q-3205
  lesson: geo-volume
  topic: Cavalieri's principle
  stem: 'What does Cavalieri''s principle say?'
  choices: ['A pyramid is one third of a prism.', 'Similar solids have volumes in ratio $k^3$.', 'Solids with the same height and equal cross-section areas at every level have equal volumes.', 'The surface area of a sphere is $4\pi r^2$.']
  answer: 2
  explanation: |-
    That's the principle: slice both solids at every height; if the slices always match in area, the volumes match.
- id: geo-q-3206
  lesson: geo-volume
  topic: Volume
  stem: 'A cylinder and a cone have the same base and height. The cylinder holds 90 mL. How much does the cone hold?'
  choices: ['270 mL', '45 mL', '60 mL', '30 mL']
  answer: 3
  explanation: |-
    A cone is $\tfrac13$ of the cylinder with the same base and height: $30$ mL.
- id: geo-q-3207
  lesson: geo-volume
  module_quiz: true
  topic: Volume
  stem: 'A square pyramid has base edge 12 and slant height 10. Find its volume.'
  choices: ['384', '480', '1152', '1440']
  answer: 0
  explanation: |-
    Height: $\sqrt{10^2 - 6^2} = 8$. $V = \tfrac13 \cdot 144 \cdot 8 = 384$. 480 uses the slant height as the height.
- id: geo-q-3208
  lesson: geo-volume
  topic: Volume
  stem: 'Two similar cylinders have radii 2 and 6. The smaller has volume $10\pi$. Find the larger''s volume.'
  choices: ['$30\pi$', '$270\pi$', '$90\pi$', '$60\pi$']
  answer: 1
  explanation: |-
    $k = 3$, so volumes scale by $27$: $270\pi$. $90\pi$ scales by $k^2$.
- id: geo-q-3209
  lesson: geo-volume
  topic: Volume
  stem: 'How many cubic centimeters are in one cubic meter?'
  choices: ['100', '10,000', '1,000,000', '1,000']
  answer: 2
  explanation: |-
    $1 \text{ m} = 100$ cm, so $1 \text{ m}^3 = 100^3 = 1{,}000{,}000$ cm³.
- id: geo-q-3210
  lesson: geo-volume
  topic: Volume
  stem: 'A cone of radius 2 and height 6 is topped by a hemisphere of radius 2. Find the total volume.'
  choices: ['$8\pi$', '$\tfrac{56}{3}\pi$', '$\tfrac{32}{3}\pi$', '$\tfrac{40}{3}\pi$']
  answer: 3
  explanation: |-
    Cone: $\tfrac13 \pi(4)(6) = 8\pi$. Hemisphere: $\tfrac23 \pi(8) = \tfrac{16}{3}\pi$. Total $\tfrac{40}{3}\pi \approx 41.9$.
- id: geo-q-3211
  lesson: geo-volume
  topic: Cavalieri's principle
  stem: 'In Archimedes'' argument, a hemisphere of radius $r$ is compared with a cylinder (radius $r$, height $r$) minus a cone. Why do they have equal volumes?'
  choices: ['At every height $y$, both cross sections have area $\pi(r^2 - y^2)$.', 'They have equal surface areas.', 'They are similar solids.', 'They have the same base and the same slant height.']
  answer: 0
  explanation: |-
    The hemisphere's slice is a circle of area $\pi(r^2 - y^2)$; the other solid's slice is a ring of area $\pi r^2 - \pi y^2$. Equal slices at every level give equal volumes by Cavalieri.
- id: geo-q-3212
  lesson: geo-volume
  topic: Volume
  stem: 'A rectangular tank 50 cm by 40 cm by 30 cm is full of water. How many liters does it hold?'
  choices: ['6 L', '60 L', '600 L', '6000 L']
  answer: 1
  explanation: |-
    $50 \cdot 40 \cdot 30 = 60{,}000$ cm³, and $1 \text{ L} = 1000$ cm³, so 60 L.
