# Module 3, round 2: new question types for lessons 08-09, and the two honors lessons (09h1, 09h2)

# ---------- Lesson 08: parallel lines and transversals ----------
- id: geo-m3-r2-q01
  lesson: geo-transversals
  type: label
  module_quiz: true
  topic: Parallel lines
  stem: 'Lines $\ell$ and $m$ are cut by transversal $t$, and one angle is shaded. Name how each numbered angle is related to the shaded angle.'
  image: {src: images/geo-m3-transversal-blank.svg, alt: 'Two horizontal lines, l on top and m below, cut by a transversal t that slants up to the right. At the top intersection, the angle below l and to the left of t is shaded. Numbered markers sit in four other angles.'}
  labels:
    - {x: 67.1, y: 23.2, text: Vertical angle}
    - {x: 36.8, y: 55.3, text: Consecutive interior angle}
    - {x: 50.4, y: 60.7, text: Alternate interior angle}
    - {x: 32.9, y: 74.3, text: Corresponding angle}
  distractors: [Alternate exterior angle, Linear pair partner]
  explanation: |-
    The shaded angle is below $\ell$ and left of $t$, so it is an interior angle. Marker 1 (above $\ell$, right of $t$, same intersection) shares its vertex and is opposite it: a vertical angle. At the lower intersection, marker 2 (above $m$, left of $t$) is interior on the same side: consecutive interior. Marker 3 (above $m$, right of $t$) is interior on the opposite side: alternate interior. Marker 4 (below $m$, left of $t$) is in the same position as the shaded angle: corresponding. No marker is outside both lines, so none is alternate exterior, and the shaded angle's linear-pair partners are at the top intersection, next to it.
- id: geo-m3-r2-q02
  lesson: geo-transversals
  type: match
  module_quiz: true
  topic: Parallel lines
  stem: 'Two parallel lines are cut by a transversal. Match each kind of angle pair to how its two angles are related.'
  pairs:
    - [Corresponding angles, Congruent]
    - [Alternate interior angles, Congruent]
    - [Alternate exterior angles, Congruent]
    - [Consecutive interior angles, Supplementary]
  distractors: [Complementary]
  explanation: |-
    With parallel lines, corresponding angles are congruent (the postulate), and so are alternate interior and alternate exterior angles (theorems proved from it). Consecutive interior angles add to $180^\circ$. Complementary angles (sum $90^\circ$) play no role here.
- id: geo-m3-r2-q03
  lesson: geo-transversals
  type: order
  topic: Parallel lines
  stem: '$\ell \parallel m$, and consecutive interior angles measure $(4x + 12)^\circ$ and $(2x + 30)^\circ$. Put the steps for finding the angles in order.'
  items:
    - 'Write $(4x + 12) + (2x + 30) = 180$'
    - 'Combine like terms: $6x + 42 = 180$'
    - 'Solve: $x = 23$'
    - 'Substitute: the angles are $104^\circ$ and $76^\circ$'
  explanation: |-
    Consecutive interior angles are supplementary, so their sum is $180$. Then $6x = 138$, $x = 23$, and the angles are $4(23) + 12 = 104^\circ$ and $2(23) + 30 = 76^\circ$, which add to $180^\circ$.
- id: geo-m3-r2-q04
  lesson: geo-transversals
  topic: Parallel lines
  stem: '$\ell \parallel m$, with the angles numbered as in the lesson''s figure: at $\ell$, angles 1 and 2 are above the line and 3 and 4 below it (left to right), and angles 5–8 sit the same way at $m$. If $m\angle 2 = 65^\circ$, which angles also measure $65^\circ$? Select all that apply.'
  choices: ['$\angle 3$', '$\angle 4$', '$\angle 6$', '$\angle 7$']
  answer: [0, 2, 3]
  explanation: |-
    $\angle 3$ is vertical to $\angle 2$, $\angle 6$ corresponds to $\angle 2$, and $\angle 7$ is its alternate exterior angle, so all three measure $65^\circ$. $\angle 4$ forms a linear pair with $\angle 2$, so it measures $180 - 65 = 115^\circ$.
- id: geo-m3-r2-q05
  lesson: geo-transversals
  type: text
  topic: Proving lines parallel
  stem: 'Two lines are cut by a transversal, and a pair of corresponding angles measure $(5x - 20)^\circ$ and $(3x + 16)^\circ$. The lines are parallel exactly when each of these angles measures ___ degrees. Give only the number.'
  accept: ['70']
  explanation: |-
    By the Corresponding Angles Converse, the lines are parallel when the angles are congruent: $5x - 20 = 3x + 16$, so $2x = 36$, $x = 18$, and each angle is $5(18) - 20 = 70^\circ$. (18 is $x$, not the angle.)
- id: geo-m3-r2-q06
  lesson: geo-transversals
  type: text
  topic: Parallel lines
  stem: 'Consecutive interior angles are also called ___ interior angles, because they lie on the same side of the transversal.'
  accept: [same-side, same side, sameside]
  explanation: |-
    "Consecutive interior" and "same-side interior" name the same pair: both angles are between the two lines and on the same side of the transversal. With parallel lines they are supplementary.

# ---------- Lesson 09: perpendicular lines and slope ----------
- id: geo-m3-r2-q07
  lesson: geo-perp-slope
  type: label
  module_quiz: true
  topic: Perpendicular lines
  stem: 'The picture shows a line with a shaded slope triangle, and a point $P$ with two segments drawn from it to the line. Name the numbered parts.'
  image: {src: images/geo-m3-slope-perp-blank.svg, alt: 'A line on a grid rising to the right. Under its left end, a shaded right triangle has a dashed horizontal leg and a dashed vertical leg. From a point P below the line, a solid segment meets the line at a right angle, and a dotted segment runs from P to a point farther up the line.'}
  labels:
    - {x: 25.0, y: 84.6, text: Run}
    - {x: 37.5, y: 73.1, text: Rise}
    - {x: 66.8, y: 55.7, text: Distance from P to the line}
    - {x: 58.5, y: 42.2, text: Foot of the perpendicular}
    - {x: 81.2, y: 42.3, text: A longer slanted segment}
  distractors: [y-intercept]
  explanation: |-
    In the slope triangle the horizontal leg is the run and the vertical leg is the rise (here 4 and 3, so the slope is $\tfrac34$). The segment from $P$ that meets the line at a right angle is the shortest one, so its length is the distance from $P$ to the line; it meets the line at the foot of the perpendicular. Any other segment from $P$ to the line, like the dotted one, is the hypotenuse of a right triangle with the perpendicular as a leg, so it is longer.
- id: geo-m3-r2-q08
  lesson: geo-perp-slope
  type: match
  module_quiz: true
  topic: Slope
  stem: 'Match each pair of lines to how they are related.'
  pairs:
    - ['$y = 2x + 1$ and $y = 2x - 3$', Parallel]
    - ['$y = 2x + 1$ and $y = -\tfrac12 x + 4$', Perpendicular]
    - ['$y = 2x + 1$ and $y = -2x + 1$', Neither parallel nor perpendicular]
    - ['$x = 3$ and $y = -1$', Perpendicular]
    - ['$2x - y = 2$ and $y = 2x - 2$', The same line]
  distractors: [Skew]
  explanation: |-
    Equal slopes with different intercepts are parallel ($2$ and $2$). Slopes $2$ and $-\tfrac12$ multiply to $-1$: perpendicular. Slopes $2$ and $-2$ multiply to $-4$: neither. A vertical and a horizontal line are perpendicular. $2x - y = 2$ rearranges to $y = 2x - 2$, the same line. Skew lines are not in one plane, so two lines in the coordinate plane are never skew.
- id: geo-m3-r2-q09
  lesson: geo-perp-slope
  type: text
  topic: Slope
  stem: 'A line passes through $(-1, 4)$ and $(3, -2)$. As a fraction, the slope of a line perpendicular to it is ___.'
  accept: ['2/3']
  explanation: |-
    The slope of the given line is $\dfrac{-2 - 4}{3 - (-1)} = \dfrac{-6}{4} = -\dfrac32$. The perpendicular slope is the negative reciprocal, $\dfrac23$. Check: $-\tfrac32 \cdot \tfrac23 = -1$.
- id: geo-m3-r2-q10
  lesson: geo-perp-slope
  topic: Slope
  stem: 'Which lines are perpendicular to $y = -\tfrac34 x + 2$? Select all that apply.'
  choices: ['$y = \tfrac43 x - 1$', '$4x - 3y = 6$', '$3x + 4y = 8$', '$y = -\tfrac43 x$']
  answer: [0, 1]
  explanation: |-
    The perpendicular slope is $\tfrac43$. $y = \tfrac43 x - 1$ has it, and $4x - 3y = 6$ becomes $y = \tfrac43 x - 2$, slope $\tfrac43$ too. $3x + 4y = 8$ has slope $-\tfrac34$, so it is parallel; $y = -\tfrac43 x$ has the reciprocal without the sign change (product $1$, not $-1$).
- id: geo-m3-r2-q11
  lesson: geo-perp-slope
  type: order
  topic: Slope
  stem: 'Put the steps for writing the equation of the line through a given point perpendicular to a given line in order.'
  items:
    - 'Find the slope of the given line'
    - 'Take the negative reciprocal to get the new slope'
    - 'Put the point and the new slope into point-slope form'
    - 'Solve for $y$ to get slope-intercept form'
  explanation: |-
    You need the given slope before you can take its negative reciprocal, and you need the new slope and the point before you can write point-slope form, which is then rearranged into $y = mx + b$.
- id: geo-m3-r2-q12
  lesson: geo-perp-slope
  type: text
  topic: Perpendicular lines
  stem: 'The distance from $(-1, 3)$ to the line $5x - 12y + 2 = 0$ is ___. Give only the number.'
  accept: ['3']
  explanation: |-
    $d = \dfrac{|5(-1) - 12(3) + 2|}{\sqrt{5^2 + 12^2}} = \dfrac{|-39|}{13} = 3$. Without the absolute value you would get $-3$, but a distance is never negative.

# ---------- Honors 09h1: proofs with parallel lines ----------
- id: geo-m3-r2-h01
  lesson: geo-h-parallel-proofs
  topic: Parallel line proofs
  stem: 'In the proof of the Corresponding Angles Converse, a line $\ell''$ through $P$ parallel to $m$ is constructed and shown to make the same angle with $t$ as $\ell$. Which fact then shows that $\ell''$ and $\ell$ are the same line?'
  choices: ['The Protractor Postulate: only one ray on a given side makes a given angle', 'The Ruler Postulate: points on a line can be matched with real numbers', 'The Vertical Angles Theorem', 'The Linear Pair Postulate']
  answer: 0
  explanation: |-
    $\ell$ and $\ell'$ both pass through $P$ and make angles of the same measure with the same ray of $t$, on the same side. The Protractor Postulate allows only one such ray, so the lines share a ray and coincide. The other facts say nothing about uniqueness of a ray.
- id: geo-m3-r2-h02
  lesson: geo-h-parallel-proofs
  topic: Parallel line proofs
  stem: 'In Book I of Euclid''s *Elements*, which proposition is the first to use the parallel postulate?'
  choices: ['Proposition 16: an exterior angle of a triangle is greater than each remote interior angle', 'Proposition 27: congruent alternate angles imply parallel lines', 'Proposition 29: parallel lines make congruent alternate angles', 'Proposition 47: the Pythagorean theorem']
  answer: 2
  explanation: |-
    Propositions 16 and 27 are proved without the fifth postulate. Proposition 29, the forward direction ("parallel lines make congruent alternate angles"), is the first place Euclid uses it. Proposition 47 depends on it too, but comes much later.
- id: geo-m3-r2-h03
  lesson: geo-h-parallel-proofs
  topic: Parallel line proofs
  stem: 'Euclid proves "congruent alternate interior angles imply parallel lines" indirectly: if the lines met at $R$, they would form a triangle. Which fact about that triangle gives the contradiction?'
  choices: ['The angles of a triangle add to $180^\circ$', 'An exterior angle is greater than each remote interior angle', 'The base angles of an isosceles triangle are congruent', 'Any two sides add to more than the third side']
  answer: 1
  explanation: |-
    One of the congruent alternate interior angles is an exterior angle of the triangle and the other is a remote interior angle, so the Exterior Angle Inequality says one is strictly larger: a contradiction. The angle sum would also work in Euclidean geometry, but it depends on the parallel postulate, which Euclid was avoiding here.
- id: geo-m3-r2-h04
  lesson: geo-h-parallel-proofs
  topic: Parallel line proofs
  stem: 'Which statement can be proved in neutral geometry, that is, without the parallel postulate?'
  choices: ['The angles of every triangle add to exactly $180^\circ$.', 'Parallel lines cut by a transversal make congruent alternate interior angles.', 'Through a point not on a line there is exactly one parallel to the line.', 'Through a point not on a line there is at least one parallel to the line.']
  answer: 3
  explanation: |-
    Copy an angle to make congruent alternate interior angles; Euclid's Proposition 27 (proved without the fifth postulate) then says the new line is parallel. So a parallel always exists. Uniqueness ("exactly one") is the parallel postulate itself, and the forward theorem and the $180^\circ$ angle sum both depend on it.
- id: geo-m3-r2-h05
  lesson: geo-h-parallel-proofs
  topic: Auxiliary lines
  stem: '$\ell \parallel m$. A path goes from $A$ on $\ell$ to a point $P$ between the lines and on to $B$ on $m$. The angles at $A$ and $B$ between the path and the lines, on the side toward which the path bends, are $34^\circ$ and $51^\circ$. Find $m\angle APB$.'
  choices: ['$95^\circ$', '$17^\circ$', '$85^\circ$', '$42.5^\circ$']
  answer: 2
  explanation: |-
    Draw the auxiliary line through $P$ parallel to $\ell$ and $m$. It splits $\angle APB$ into a $34^\circ$ part and a $51^\circ$ part (alternate interior angles), so $m\angle APB = 34 + 51 = 85^\circ$. $95^\circ$ is its supplement, $17^\circ$ is the difference, and $42.5^\circ$ is half the sum.
- id: geo-m3-r2-h06
  lesson: geo-h-parallel-proofs
  topic: Auxiliary lines
  stem: '$\ell \parallel m$ and a path bends once at $P$ between them. At $A$ the angle between the path and $\ell$ on the side *away* from the bend is $140^\circ$; at $B$ the angle between the path and $m$ on the side *toward* the bend is $30^\circ$. Find $m\angle APB$.'
  choices: ['$70^\circ$', '$170^\circ$', '$110^\circ$', '$40^\circ$']
  answer: 0
  explanation: |-
    The bend theorem needs the angles that open toward the bend. At $A$ that angle is the supplement of $140^\circ$, namely $40^\circ$. So $m\angle APB = 40 + 30 = 70^\circ$. $170^\circ$ comes from adding $140 + 30$ (the wrong angle at $A$), $110^\circ$ from $140 - 30$, and $40^\circ$ is only the corrected angle at $A$.
- id: geo-m3-r2-h07
  lesson: geo-h-parallel-proofs
  topic: Auxiliary lines
  stem: '$\ell \parallel m$ and a single bend at $P$ has $m\angle APB = (4x + 6)^\circ$. The angles at $A$ and $B$ that open toward the bend measure $(x + 20)^\circ$ and $(2x + 1)^\circ$. Find $m\angle APB$.'
  choices: ['$15^\circ$', '$35^\circ$', '$31^\circ$', '$66^\circ$']
  answer: 3
  explanation: |-
    Bend theorem: $4x + 6 = (x + 20) + (2x + 1) = 3x + 21$, so $x = 15$ and $m\angle APB = 4(15) + 6 = 66^\circ$. Check: $35 + 31 = 66$. The other choices are $x$ and the two smaller angles.
- id: geo-m3-r2-h08
  lesson: geo-h-parallel-proofs
  topic: Auxiliary lines
  stem: 'A student''s proof begins: "Draw the line through $P$ that is parallel to $\ell$ and passes through the midpoint $M$ of $\overline{AB}$." What is wrong with this step?'
  choices: ['Nothing: any line may be added to a figure.', 'The line must meet two conditions, and the parallel through $P$ usually misses $M$, so such a line need not exist.', 'Lines through a midpoint cannot be parallel to anything.', 'Auxiliary lines must be perpendicular, not parallel.']
  answer: 1
  explanation: |-
    Exactly one line through $P$ is parallel to $\ell$, and exactly one line passes through both $P$ and $M$. Unless these happen to be the same line, no line meets both conditions, so the proof rests on an object that may not exist. An auxiliary line should be fixed by one condition.
- id: geo-m3-r2-h09
  lesson: geo-h-parallel-proofs
  type: text
  topic: Auxiliary lines
  stem: 'Parallel lines are cut by a transversal, and the bisectors of the two consecutive interior angles on one side meet at $P$. The angle between the bisectors at $P$ measures ___ degrees. Give only the number.'
  accept: ['90']
  explanation: |-
    The consecutive interior angles add to $180^\circ$, so their halves add to $90^\circ$. The bisectors form a bend between the parallel lines, and by the bend theorem the angle at $P$ is the sum of the halves: $90^\circ$. This is true whatever the transversal's angle.
- id: geo-m3-r2-h10
  lesson: geo-h-parallel-proofs
  type: text
  topic: Auxiliary lines
  stem: '$\ell \parallel m$. A path from $\ell$ to $m$ switches between heading right and heading left at each of its two bends. The angles that open to the right are $30^\circ$ (where it leaves $\ell$) and $85^\circ$ (at the second bend); the angle at the first bend, opening left, is $50^\circ$. The acute angle where the path meets $m$, which opens left, measures ___ degrees. Give only the number.'
  accept: ['65']
  explanation: |-
    Zigzag rule: right-opening angles total the same as left-opening ones, so $30 + 85 = 50 + x$ and $x = 65$. Check the long way: the segments make $30^\circ$, $50 - 30 = 20^\circ$ and $85 - 20 = 65^\circ$ with the parallels, and the last one meets $m$ at $65^\circ$.
- id: geo-m3-r2-h11
  lesson: geo-h-parallel-proofs
  type: order
  topic: Parallel line proofs
  stem: 'Put the steps of Euclid''s indirect proof that congruent alternate interior angles make the lines parallel in order.'
  items:
    - 'Assume the two lines are not parallel.'
    - 'Then they meet at a point $R$, forming a triangle with the transversal.'
    - 'One of the congruent angles is an exterior angle of that triangle, and the other is a remote interior angle.'
    - 'By the Exterior Angle Inequality, the exterior angle is larger.'
    - 'This contradicts the angles being congruent, so the lines are parallel.'
  explanation: |-
    An indirect proof starts by assuming the opposite of the conclusion, follows the consequences (a triangle, then an exterior angle and a remote interior angle), applies a known theorem to reach a contradiction, and concludes the original statement.
- id: geo-m3-r2-h12
  lesson: geo-h-parallel-proofs
  type: match
  topic: Parallel line proofs
  stem: 'Match each statement to whether it depends on the parallel postulate.'
  pairs:
    - [Congruent alternate interior angles imply parallel lines, Provable without the parallel postulate]
    - [Parallel lines make congruent alternate interior angles, Needs the parallel postulate]
    - [An exterior angle of a triangle is greater than each remote interior angle, Provable without the parallel postulate]
    - [The angles of a triangle add to 180 degrees, Needs the parallel postulate]
    - [Through a point off a line there is at least one parallel, Provable without the parallel postulate]
  distractors: [False in Euclidean geometry]
  explanation: |-
    Euclid proved the Exterior Angle Inequality (I.16) and the converse (I.27) without the fifth postulate, and the converse gives the existence of parallels. The forward theorem (I.29) is his first use of the postulate, and the $180^\circ$ angle sum depends on it; in hyperbolic geometry both fail. All five statements are true in Euclidean geometry.
- id: geo-m3-r2-h13
  lesson: geo-h-parallel-proofs
  topic: Auxiliary lines
  stem: 'Which of these auxiliary objects can always be drawn in a plane (they exist and are unique)? Select all that apply.'
  choices: ['The line through a point $P$ parallel to a line $\ell$ not containing $P$', 'The segment joining two given points', 'The line through a point $P$ perpendicular to a line $\ell$', 'The line through $P$ parallel to $\ell$ that also passes through the midpoint of a given segment']
  answer: [0, 1, 2]
  explanation: |-
    One parallel through an outside point (parallel postulate), one segment between two points, and one perpendicular through a point in a plane all exist and are unique, so each may be drawn in a proof. A line asked to satisfy a parallel condition and also pass through another chosen point is overdetermined and generally does not exist.

# ---------- Honors 09h2: slopes and vectors ----------
- id: geo-m3-r2-h14
  lesson: geo-h-lines-vectors
  topic: Slope criteria proofs
  stem: 'To prove the perpendicular slope rule, take $O = (0, 0)$, $A = (1, m_1)$ and $B = (1, m_2)$. What does the Pythagorean condition $OA^2 + OB^2 = AB^2$ simplify to?'
  choices: ['$m_1 = m_2$', '$m_1 m_2 = -1$', '$m_1 + m_2 = 0$', '$m_1 m_2 = 1$']
  answer: 1
  explanation: |-
    $OA^2 + OB^2 = 2 + m_1^2 + m_2^2$ and $AB^2 = m_1^2 - 2m_1 m_2 + m_2^2$. Setting them equal leaves $2 = -2m_1 m_2$, so $m_1 m_2 = -1$.
- id: geo-m3-r2-h15
  lesson: geo-h-lines-vectors
  topic: Slope criteria proofs
  stem: 'The lines $y = m x + b_1$ and $y = m x + b_2$ have the same slope and $b_1 \ne b_2$. Why do they never meet?'
  choices: ['Because a slope can only belong to one line', 'Because their $y$-intercepts are both positive', 'Because they are perpendicular to the same line', 'Because $mx + b_1 = mx + b_2$ would mean $b_1 = b_2$, which is false']
  answer: 3
  explanation: |-
    A common point would satisfy both equations, so $mx + b_1 = mx + b_2$; subtracting $mx$ leaves $b_1 = b_2$, a contradiction. Many lines share a slope, so the first choice is false; the other two are not reasons.
- id: geo-m3-r2-h16
  lesson: geo-h-lines-vectors
  type: text
  topic: Slope criteria proofs
  stem: 'The dot product $\langle 3, -2 \rangle \cdot \langle 4, 6 \rangle$ equals ___. Give only the number.'
  accept: ['0']
  explanation: |-
    $3(4) + (-2)(6) = 12 - 12 = 0$. A zero dot product means the vectors are perpendicular: slopes $-\tfrac23$ and $\tfrac32$ multiply to $-1$.
- id: geo-m3-r2-h17
  lesson: geo-h-lines-vectors
  topic: Slope criteria proofs
  stem: 'Which vector is a normal vector (perpendicular) to the line $2x - 5y = 7$?'
  choices: ['$\langle 2, -5 \rangle$', '$\langle 5, 2 \rangle$', '$\langle 2, 5 \rangle$', '$\langle -2, -5 \rangle$']
  answer: 0
  explanation: |-
    For $Ax + By = C$ the normal vector is $\langle A, B \rangle = \langle 2, -5 \rangle$. $\langle 5, 2 \rangle$ is a direction vector: it runs along the line (slope $\tfrac25$). $\langle 2, 5 \rangle$ and $\langle -2, -5 \rangle$ are not multiples of $\langle 2, -5 \rangle$, so they are not normal vectors (their dot products with the direction vector $\langle 5, 2 \rangle$ are $20$ and $-20$, not $0$).
- id: geo-m3-r2-h18
  lesson: geo-h-lines-vectors
  topic: Slope criteria proofs
  stem: 'Which is the line through $(1, 4)$ parallel to $3x - 7y = 2$?'
  choices: ['$3x - 7y = 25$', '$7x + 3y = 19$', '$3x - 7y = -25$', '$3x - 7y = 2$']
  answer: 2
  explanation: |-
    Keep $A$ and $B$ and put in the point: $3x - 7y = 3(1) - 7(4) = -25$. $7x + 3y = 19$ is the perpendicular through $(1, 4)$; $3x - 7y = 25$ has a sign error; $3x - 7y = 2$ is the original line, which misses the point.
- id: geo-m3-r2-h19
  lesson: geo-h-lines-vectors
  topic: Angle between lines
  stem: 'To the nearest tenth of a degree, what is the angle between the lines $y = x$ and $y = 3x$?'
  choices: ['$63.4^\circ$', '$45.0^\circ$', '$71.6^\circ$', '$26.6^\circ$']
  answer: 3
  explanation: |-
    Direction vectors $\langle 1, 1 \rangle$ and $\langle 1, 3 \rangle$: dot product $4$, lengths $\sqrt2$ and $\sqrt{10}$. $\cos\varphi = \tfrac{4}{\sqrt{20}} \approx 0.894$, so $\varphi \approx 26.6^\circ$. ($45^\circ$ and $71.6^\circ$ are the two lines' angles with the $x$-axis, whose difference is the answer; $63.4^\circ$ is the complement.)
- id: geo-m3-r2-h20
  lesson: geo-h-lines-vectors
  type: text
  topic: Angle between lines
  stem: 'The angle between the lines $y = 3x$ and $y = -2x$ is ___ degrees. Give only the number.'
  accept: ['45']
  explanation: |-
    Direction vectors $\langle 1, 3 \rangle$ and $\langle 1, -2 \rangle$: dot product $1 - 6 = -5$, lengths $\sqrt{10}$ and $\sqrt5$. $\cos\varphi = \tfrac{|-5|}{\sqrt{50}} = \tfrac{1}{\sqrt2}$, so $\varphi = 45^\circ$. (Without the absolute value you get $135^\circ$, the obtuse angle at the crossing.)
- id: geo-m3-r2-h21
  lesson: geo-h-lines-vectors
  topic: Foot of the perpendicular
  stem: 'What is the foot of the perpendicular from $(5, 1)$ to the line $x + 2y = 2$?'
  choices: ['$(6, 3)$', '$(4, -1)$', '$(3, -3)$', '$(2, 0)$']
  answer: 1
  explanation: |-
    Write $x + 2y - 2 = 0$. Then $Ax_0 + By_0 + C = 5 + 2 - 2 = 5$ and $A^2 + B^2 = 5$, so $t = -1$ and the foot is $(5 - 1,\ 1 - 2) = (4, -1)$. Check: $4 + 2(-1) = 2$. $(6, 3)$ uses $t = +1$, $(3, -3)$ is the reflection (using $2t$), and $(2, 0)$ is on the line but not at the foot.
- id: geo-m3-r2-h22
  lesson: geo-h-lines-vectors
  type: text
  topic: Foot of the perpendicular
  stem: 'The reflection of the point $(5, 1)$ in the line $x + 2y = 2$ is the point (___, ___).'
  accept:
    - ['3']
    - ['-3']
  explanation: |-
    Here $t = -\tfrac{5 + 2 - 2}{1 + 4} = -1$. The reflection is $(5 + 2t \cdot 1,\ 1 + 2t \cdot 2) = (3, -3)$. Its midpoint with $(5, 1)$ is $(4, -1)$, the foot of the perpendicular, which lies on the line.
- id: geo-m3-r2-h23
  lesson: geo-h-lines-vectors
  topic: Foot of the perpendicular
  stem: 'What is the distance between the parallel lines $4x - 3y = 10$ and $8x - 6y = -5$?'
  choices: ['$2.5$', '$3$', '$1$', '$12.5$']
  answer: 0
  explanation: |-
    Divide the second equation by 2: $4x - 3y = -2.5$. In the form $Ax + By + C = 0$ the constants are $-10$ and $2.5$, so $d = \dfrac{|-10 - 2.5|}{\sqrt{16 + 9}} = \dfrac{12.5}{5} = 2.5$. Using $-5$ without scaling gives $3$ or $1$; $12.5$ forgets to divide by $5$.
- id: geo-m3-r2-h24
  lesson: geo-h-lines-vectors
  type: order
  topic: Foot of the perpendicular
  stem: 'Put the steps for finding the foot of the perpendicular from $P(x_0, y_0)$ to a line in order.'
  items:
    - 'Write the line as $Ax + By + C = 0$'
    - 'Compute $t = -\dfrac{Ax_0 + By_0 + C}{A^2 + B^2}$'
    - 'Move from $P$ along the normal vector: $F = (x_0 + tA,\ y_0 + tB)$'
    - 'Check that $F$ satisfies the equation of the line'
  explanation: |-
    You need $A$, $B$ and $C$ before computing $t$, and $t$ before finding $F$; the check comes last.
- id: geo-m3-r2-h25
  lesson: geo-h-lines-vectors
  type: match
  topic: Slope criteria proofs
  stem: 'For the line $Ax + By = C$ and vectors $\vec u$, $\vec v$, match each expression to what it is.'
  pairs:
    - ['$\langle A, B \rangle$', A normal vector of the line]
    - ['$\langle B, -A \rangle$', A direction vector of the line]
    - ['$\vec u \cdot \vec v = 0$', The condition for perpendicular vectors]
    - ['$\dfrac{|\vec u \cdot \vec v|}{|\vec u|\,|\vec v|}$', The cosine of the angle between two lines]
  distractors: [The slope of the line]
  explanation: |-
    $\langle A, B \rangle$ is perpendicular to the line and $\langle B, -A \rangle$ runs along it. A zero dot product means perpendicular, and $\cos\varphi = \tfrac{|\vec u \cdot \vec v|}{|\vec u||\vec v|}$ gives the non-obtuse angle between lines with direction vectors $\vec u$ and $\vec v$. The slope of the line is $-\tfrac{A}{B}$, a number rather than a vector.
- id: geo-m3-r2-h26
  lesson: geo-h-lines-vectors
  topic: Slope criteria proofs
  stem: 'Which pairs of lines are perpendicular? Select all that apply.'
  choices: ['$x = 4$ and $y = -2$', 'Lines with direction vectors $\langle 2, 5 \rangle$ and $\langle 5, -2 \rangle$', '$2x + 3y = 1$ and $3x - 2y = 4$', '$y = 2x$ and $y = -2x$', '$2x + 3y = 1$ and $2x + 3y = 7$']
  answer: [0, 1, 2]
  explanation: |-
    A vertical and a horizontal line are perpendicular. $\langle 2, 5 \rangle \cdot \langle 5, -2 \rangle = 10 - 10 = 0$. The normals $\langle 2, 3 \rangle$ and $\langle 3, -2 \rangle$ have dot product $6 - 6 = 0$. Slopes $2$ and $-2$ multiply to $-4$, so $y = 2x$ and $y = -2x$ are not perpendicular; and $2x + 3y = 1$, $2x + 3y = 7$ are parallel.
- id: geo-m3-r2-h27
  lesson: geo-h-lines-vectors
  topic: Angle between lines
  stem: 'The slope formula $\tan\varphi = \left|\dfrac{m_2 - m_1}{1 + m_1 m_2}\right|$ for the angle between two lines cannot be used when…'
  choices: ['the slopes are both positive', 'the lines cross at the origin', 'the slopes multiply to $-1$, or one line is vertical', 'the slopes are fractions']
  answer: 2
  explanation: |-
    If $m_1 m_2 = -1$ the denominator is $0$ (the lines are perpendicular, and $\tan 90^\circ$ is undefined), and a vertical line has no slope. The cosine formula with direction vectors handles both cases.
