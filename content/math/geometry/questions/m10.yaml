# Module 10 — Axioms, other geometries and probability
- id: geo-q-3601
  lesson: geo-axiomatic
  module_quiz: true
  topic: Axiomatic systems
  stem: 'Which list gives the four parts of an axiomatic system?'
  choices: ['Points, lines, planes, angles', 'Undefined terms, axioms, definitions, theorems', 'Givens, diagrams, proofs, conclusions', 'Postulates, corollaries, lemmas, models']
  answer: 1
  explanation: |-
    An axiomatic system starts with undefined terms and axioms, then builds definitions and proves theorems.
- id: geo-q-3602
  lesson: geo-axiomatic
  topic: Axiomatic systems
  stem: 'How do mathematicians usually show that a set of axioms is consistent?'
  choices: ['By proving every possible theorem', 'By checking that no contradiction has been found yet', 'By exhibiting a model in which all the axioms are true', 'By showing each axiom is independent']
  answer: 2
  explanation: |-
    If a concrete interpretation satisfies every axiom, the axioms can't contradict each other. Not having found a contradiction yet proves nothing.
- id: geo-q-3603
  lesson: geo-axiomatic
  module_quiz: true
  topic: Axiomatic systems
  stem: 'To show axiom $A_3$ is independent of axioms $A_1$ and $A_2$, you should:'
  choices: ['prove $A_3$ from $A_1$ and $A_2$', 'find a model where $A_1$, $A_2$ and $A_3$ all hold', 'show $A_3$ contradicts $A_1$', 'find a model where $A_1$ and $A_2$ hold but $A_3$ fails']
  answer: 3
  explanation: |-
    If $A_3$ followed from $A_1$ and $A_2$, it would hold in every model of them. A model where it fails shows it can't be proved from them.
- id: geo-q-3604
  lesson: geo-axiomatic
  topic: Axiomatic systems
  stem: 'In a geometry with exactly 5 points, where each pair of points lies on exactly one line and each line contains exactly 2 points, how many lines are there?'
  choices: ['10', '5', '20', '25']
  answer: 0
  explanation: |-
    Each line corresponds to exactly one pair of points: $\binom52 = \tfrac{5 \cdot 4}{2} = 10$.
- id: geo-q-3605
  lesson: geo-axiomatic
  topic: Euclid's postulates
  stem: 'Which of Euclid''s postulates is the parallel postulate?'
  choices: ['The first', 'The fifth', 'The third', 'The fourth']
  answer: 1
  explanation: |-
    The fifth postulate: if a transversal makes interior angles on one side summing to less than two right angles, the lines meet on that side.
- id: geo-q-3606
  lesson: geo-axiomatic
  module_quiz: true
  topic: Euclid's postulates
  stem: 'Which statement is equivalent to Euclid''s parallel postulate (given the other four)?'
  choices: ['All right angles are congruent.', 'A circle can be drawn with any center and radius.', 'The angles of every triangle add to $180^\circ$.', 'Vertical angles are congruent.']
  answer: 2
  explanation: |-
    The $180^\circ$ triangle sum is equivalent to the parallel postulate. The other statements hold without it (vertical angles need only linear pairs; the first two are postulates 4 and 3).
- id: geo-q-3607
  lesson: geo-axiomatic
  topic: Euclid's postulates
  stem: 'Why did mathematicians spend centuries trying to prove the fifth postulate?'
  choices: ['It was false.', 'Euclid forgot to state it.', 'It contradicted the other postulates.', 'It seemed less self-evident than the others, more like a theorem.']
  answer: 3
  explanation: |-
    The fifth postulate is long and complicated compared with the first four, so many believed it should be provable from them. It turned out to be independent.
- id: geo-q-3608
  lesson: geo-axiomatic
  topic: Axiomatic systems
  stem: 'A model of the four-point geometry uses the corners of a square with its 4 sides and 2 diagonals as lines. Do the two diagonals intersect in this geometry?'
  choices: ['No: their crossing in the picture is not one of the four points.', 'Yes, at the center of the square.', 'Yes, at a corner.', 'They are the same line.']
  answer: 0
  explanation: |-
    The only points of this geometry are the four corners. The diagonals share no corner, so in this geometry they have no common point; they are parallel.
- id: geo-q-3609
  lesson: geo-axiomatic
  topic: Axiomatic systems
  stem: 'Who published a complete, rigorous set of axioms for Euclidean geometry in 1899, filling the gaps in Euclid''s reasoning?'
  choices: ['Gauss', 'Hilbert', 'Lobachevsky', 'Euler']
  answer: 1
  explanation: |-
    David Hilbert's *Foundations of Geometry* (1899) used undefined terms point, line, plane, between and congruent with axioms of incidence, order, congruence, continuity and parallels.
- id: geo-q-3610
  lesson: geo-axiomatic
  topic: Euclid's postulates
  stem: 'Euclid''s common notion "things equal to the same thing are equal to each other" is today called the:'
  choices: ['reflexive property', 'symmetric property', 'transitive property', 'substitution property']
  answer: 2
  explanation: |-
    If $a = c$ and $b = c$, then $a = b$: that is the transitive property (combined with symmetry).
- id: geo-q-3611
  lesson: geo-axiomatic
  topic: Axiomatic systems
  stem: 'What is a model of an axiomatic system?'
  choices: ['A diagram drawn to scale', 'A list of the theorems', 'A proof that the axioms are independent', 'An interpretation of the undefined terms that makes every axiom true']
  answer: 3
  explanation: |-
    A model gives the undefined terms a meaning in which all the axioms hold; every theorem is then true in that model.

- id: geo-q-3701
  lesson: geo-non-euclid
  module_quiz: true
  topic: Non-Euclidean geometry
  stem: 'In hyperbolic geometry, through a point not on a line there are:'
  choices: ['infinitely many parallels', 'no parallels', 'exactly one parallel', 'exactly two parallels']
  answer: 0
  explanation: |-
    Hyperbolic geometry replaces the parallel postulate with "more than one parallel", which gives infinitely many. Elliptic geometry has none; Euclidean has exactly one.
- id: geo-q-3702
  lesson: geo-non-euclid
  module_quiz: true
  topic: Non-Euclidean geometry
  stem: 'In spherical geometry, the angle sum of a triangle is:'
  choices: ['exactly $180^\circ$', 'more than $180^\circ$', 'less than $180^\circ$', 'always $270^\circ$']
  answer: 1
  explanation: |-
    Spherical triangles have angle sums greater than $180^\circ$; the excess is proportional to the area. $270^\circ$ is one special example.
- id: geo-q-3703
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'What plays the role of straight lines on a sphere?'
  choices: ['Lines of latitude', 'Any circle on the sphere', 'Great circles', 'Radii of the sphere']
  answer: 2
  explanation: |-
    Great circles (centered at the sphere's center) are the shortest paths. Lines of latitude other than the equator are not great circles.
- id: geo-q-3704
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'A spherical triangle on a sphere of radius 10 has angles $90^\circ$, $90^\circ$ and $60^\circ$. Find its area.'
  choices: ['$60\pi$', '$\tfrac{\pi}{3}$', '$100\pi$', '$\tfrac{100\pi}{3}$']
  answer: 3
  explanation: |-
    Excess $E = 240 - 180 = 60^\circ = \tfrac{\pi}{3}$ rad. Area $= R^2E = 100 \cdot \tfrac{\pi}{3} = \tfrac{100\pi}{3} \approx 104.7$. $\tfrac{\pi}{3}$ forgets $R^2$.
- id: geo-q-3705
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'Why does the existence of hyperbolic geometry prove the parallel postulate is independent?'
  choices: ['It is a consistent geometry in which Euclid''s first four postulates hold but the fifth fails.', 'It shows the fifth postulate is false.', 'It proves the fifth postulate from the other four.', 'It has no parallel lines.']
  answer: 0
  explanation: |-
    A model where the other axioms hold and this one fails shows it can't be derived from them: exactly the test for independence.
- id: geo-q-3706
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'Which statement is true in hyperbolic geometry but false in Euclidean geometry?'
  choices: ['Vertical angles are congruent.', 'Similar triangles must be congruent.', 'Two points determine a line.', 'Base angles of an isosceles triangle are congruent.']
  answer: 1
  explanation: |-
    In hyperbolic geometry, the angles determine the area (through the defect), so AAA forces congruence. The other statements don't depend on the parallel postulate and hold in both.
- id: geo-q-3707
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'A triangle on a sphere has angles $85^\circ$, $70^\circ$ and $40^\circ$. What is its spherical excess in degrees?'
  choices: ['$195^\circ$', '$5^\circ$', '$15^\circ$', '$-15^\circ$']
  answer: 2
  explanation: |-
    $85 + 70 + 40 - 180 = 15^\circ$.
- id: geo-q-3708
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'In the Poincaré disk model of hyperbolic geometry, what are the "lines"?'
  choices: ['All chords of the disk', 'Concentric circles', 'Straight lines extending past the disk', 'Diameters and arcs that meet the boundary circle at right angles']
  answer: 3
  explanation: |-
    Hyperbolic lines in the Poincaré disk are diameters and circular arcs perpendicular to the boundary circle.
- id: geo-q-3709
  lesson: geo-non-euclid
  module_quiz: true
  topic: Non-Euclidean geometry
  stem: 'A spherical triangle with three right angles covers what fraction of the sphere?'
  choices: ['$\tfrac18$', '$\tfrac14$', '$\tfrac13$', '$\tfrac12$']
  answer: 0
  explanation: |-
    Excess $= \tfrac{\pi}{2}$, so the area is $\tfrac{\pi}{2}R^2$, and $\tfrac{\pi R^2/2}{4\pi R^2} = \tfrac18$: one octant.
- id: geo-q-3710
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'Why does a city map look perfectly Euclidean even though Earth is curved?'
  choices: ['Cities are flat.', 'Small triangles on a large sphere have tiny spherical excess.', 'Maps use hyperbolic geometry.', 'The parallel postulate holds on a sphere.']
  answer: 1
  explanation: |-
    Excess is proportional to area divided by $R^2$; for regions much smaller than Earth it is negligible, so the angle sum is very close to $180^\circ$.
- id: geo-q-3711
  lesson: geo-non-euclid
  topic: Non-Euclidean geometry
  stem: 'Which mathematicians independently developed hyperbolic geometry in the early 1800s?'
  choices: ['Euclid and Archimedes', 'Hilbert and Gödel', 'Gauss, Bolyai and Lobachevsky', 'Pythagoras and Thales']
  answer: 2
  explanation: |-
    Gauss (unpublished), János Bolyai and Nikolai Lobachevsky each worked out a consistent geometry with many parallels.

- id: geo-q-3801
  lesson: geo-probability
  module_quiz: true
  topic: Geometric probability
  stem: 'A point is chosen at random on a segment from 0 to 20. What is the probability it lies between 5 and 9?'
  choices: ['$\tfrac{9}{20}$', '$\tfrac{4}{9}$', '$\tfrac14$', '$\tfrac15$']
  answer: 3
  explanation: |-
    Favorable length $9 - 5 = 4$ out of 20: $\tfrac{4}{20} = \tfrac15$.
- id: geo-q-3802
  lesson: geo-probability
  module_quiz: true
  topic: Geometric probability
  stem: 'A dart lands at a random point on a $10 \times 10$ square board containing a circle of radius 2. What is the probability it lands in the circle?'
  choices: ['$\tfrac{\pi}{25}$', '$\tfrac{\pi}{50}$', '$\tfrac{1}{5}$', '$\tfrac{2\pi}{5}$']
  answer: 0
  explanation: |-
    $\tfrac{\pi \cdot 4}{100} = \tfrac{\pi}{25} \approx 0.126$. $\tfrac15$ compares the radius with the side instead of areas.
- id: geo-q-3803
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A bus comes every 12 minutes. You arrive at a random time. What is the probability you wait more than 9 minutes?'
  choices: ['$\tfrac34$', '$\tfrac14$', '$\tfrac{9}{12}$', '$\tfrac13$']
  answer: 1
  explanation: |-
    You wait more than 9 minutes only if you arrive in the first 3 minutes after a bus leaves: $\tfrac{3}{12} = \tfrac14$.
- id: geo-q-3804
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A target has a bull''s-eye of radius 1 and rings out to radius 2 and radius 3. A dart hits the target (radius 3) at random. What is the probability it hits the outer ring (between radius 2 and 3)?'
  choices: ['$\tfrac13$', '$\tfrac19$', '$\tfrac59$', '$\tfrac49$']
  answer: 2
  explanation: |-
    Outer ring area $= 9\pi - 4\pi = 5\pi$, out of $9\pi$: $\tfrac59$. Equal widths don't give equal areas; $\tfrac13$ uses widths.
- id: geo-q-3805
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A point is chosen at random inside a cube of edge 2. What is the probability it lies within the inscribed sphere?'
  choices: ['$\tfrac{\pi}{4}$', '$\tfrac{\pi}{3}$', '$\tfrac{4\pi}{3}$', '$\tfrac{\pi}{6}$']
  answer: 3
  explanation: |-
    $\tfrac{\tfrac43\pi(1)^3}{8} = \tfrac{\pi}{6} \approx 0.524$. $\tfrac{\pi}{4}$ is the 2-D version (circle in a square).
- id: geo-q-3806
  lesson: geo-probability
  module_quiz: true
  topic: Geometric probability
  stem: 'Two people each arrive at a random time in the same hour and wait 20 minutes for each other. What is the probability they meet?'
  choices: ['$\tfrac59$', '$\tfrac49$', '$\tfrac13$', '$\tfrac23$']
  answer: 0
  explanation: |-
    In the $60 \times 60$ square, they miss each other in two corner triangles with legs 40: total area $40^2 = 1600$. $P = 1 - \tfrac{1600}{3600} = \tfrac{5}{9}$.
- id: geo-q-3807
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A circle is inscribed in a square. A point is chosen at random in the square. What is the probability it is outside the circle?'
  choices: ['$\tfrac{\pi}{4}$', '$1 - \tfrac{\pi}{4}$', '$\tfrac{4 - \pi}{2}$', '$\tfrac14$']
  answer: 1
  explanation: |-
    With side $2r$, the circle fills $\tfrac{\pi r^2}{4r^2} = \tfrac{\pi}{4}$ of the square, so the outside part is $1 - \tfrac{\pi}{4} \approx 0.215$.
- id: geo-q-3808
  lesson: geo-probability
  topic: Geometric probability
  stem: 'In Buffon''s needle problem with needle length equal to the line spacing, what is the probability the needle crosses a line?'
  choices: ['$\tfrac12$', '$\tfrac{1}{\pi}$', '$\tfrac{2}{\pi}$', '$\tfrac{\pi}{4}$']
  answer: 2
  explanation: |-
    $P = \tfrac{2\ell}{\pi d}$ with $\ell = d$ gives $\tfrac{2}{\pi} \approx 0.637$.
- id: geo-q-3809
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A point is chosen at random inside a triangle with vertices $(0, 0)$, $(6, 0)$ and $(0, 6)$. What is the probability that $x < 3$ and $y < 3$?'
  choices: ['$\tfrac14$', '$\tfrac13$', '$\tfrac34$', '$\tfrac12$']
  answer: 3
  explanation: |-
    The triangle has area 18. The region $x < 3$, $y < 3$ is a $3 \times 3$ square, which lies entirely inside the triangle (its far corner $(3, 3)$ is on the hypotenuse $x + y = 6$): area 9. $P = \tfrac{9}{18} = \tfrac12$.
- id: geo-q-3810
  lesson: geo-probability
  topic: Geometric probability
  stem: 'What does "chosen uniformly at random" mean for a point in a region?'
  choices: ['Every sub-region of equal size is equally likely to contain it.', 'The point is always at the center.', 'The point is on the boundary.', 'Every point has probability $\tfrac12$.']
  answer: 0
  explanation: |-
    Uniform means probability depends only on the size (length, area or volume) of a region, which is what makes "favorable ÷ total" work.
- id: geo-q-3811
  lesson: geo-probability
  topic: Geometric probability
  stem: 'A spinner is a circle with a $72^\circ$ sector shaded. What is the probability the spinner stops on the shaded sector?'
  choices: ['$\tfrac{1}{72}$', '$\tfrac15$', '$\tfrac14$', '$\tfrac{72}{180}$']
  answer: 1
  explanation: |-
    The probability is the sector's share of the full turn: $\tfrac{72}{360} = \tfrac15$.
