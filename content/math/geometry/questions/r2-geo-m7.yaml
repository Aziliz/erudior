# Round 2, module geo-m7 (Circles): new question types for the core lessons, and the two honors lessons.

# ---------- Lesson 27: circles, arcs and arc length ----------
- id: geo-m7-r2-q01
  lesson: geo-circle-basics
  type: label
  module_quiz: true
  topic: Circle vocabulary
  stem: 'Name the numbered parts of this circle. Each number marks a whole segment, line or point, not part of one.'
  image: {src: images/geo-m7-circle-parts-blank.svg, alt: 'A circle with a dot at its center. A horizontal segment crosses the whole circle through the center; another segment runs from the center to the circle at the upper right; a shorter segment joins two points on the lower left of the circle; a long line crosses the circle at two points and extends beyond it; a horizontal line touches the top of the circle at one marked point.'}
  labels:
    - {x: 48.1, y: 53.8, text: Center}
    - {x: 60.4, y: 42.6, text: Radius}
    - {x: 33.1, y: 53.7, text: Diameter}
    - {x: 42.6, y: 73.4, text: Chord}
    - {x: 80.8, y: 77.5, text: Secant}
    - {x: 76.9, y: 21.2, text: Tangent}
  distractors: [Arc, Central angle]
  explanation: |-
    1 is the fixed point every point of the circle is equidistant from: the center. 2 runs from the center to the circle: a radius. 3 is a chord through the center: a diameter (twice the radius). 4 joins two points of the circle without passing through the center: a chord. 5 is a whole line meeting the circle at two points: a secant. 6 touches the circle at exactly one point: a tangent. An arc is a piece of the circle itself, and a central angle is an angle with its vertex at the center; neither is numbered.

- id: geo-m7-r2-q02
  lesson: geo-circle-basics
  type: text
  topic: Arcs and arc length
  stem: 'A $45^\circ$ arc of a circle with radius 12 has length ___. Give the exact value in terms of π (type pi or π).'
  accept: [3pi, 3π, 3*pi, 3*π, 3 pi, 3 π]
  explanation: |-
    The arc is $\tfrac{45}{360} = \tfrac18$ of the circle, and the circumference is $2\pi(12) = 24\pi$. So the arc length is $\tfrac18 \cdot 24\pi = 3\pi \approx 9.42$. (In radians: $45^\circ = \tfrac{\pi}{4}$ and $s = r\theta = 12 \cdot \tfrac{\pi}{4} = 3\pi$.)

- id: geo-m7-r2-q03
  lesson: geo-circle-basics
  type: match
  module_quiz: true
  topic: Arcs and arc length
  stem: 'In $\odot O$, $\overline{AC}$ is a diameter and $m\angle AOB = 50^\circ$. Match each arc to its measure.'
  pairs:
    - ['$m\overset{\frown}{AB}$', '50°']
    - ['$m\overset{\frown}{BC}$', '130°']
    - ['$m\overset{\frown}{BAC}$', '230°']
    - ['$m\overset{\frown}{ABC}$', '180°']
  distractors: ['310°', '100°']
  explanation: |-
    A minor arc equals its central angle, so $m\overset{\frown}{AB} = 50^\circ$. $\overset{\frown}{ABC}$ runs from one end of a diameter to the other: a semicircle, $180^\circ$. So $m\overset{\frown}{BC} = 180 - 50 = 130^\circ$. The major arc $\overset{\frown}{BAC}$ is the rest of the circle after $\overset{\frown}{BC}$: $360 - 130 = 230^\circ$. ($310^\circ$ would be the major arc $\overset{\frown}{ACB}$, and $100^\circ$ comes from doubling the central angle, which only inscribed angles call for.)

- id: geo-m7-r2-q04
  lesson: geo-circle-basics
  topic: Arcs and arc length
  stem: 'In a circle of radius 6, which arcs have length $2\pi$? Select all that apply.'
  choices: ['A $120^\circ$ arc', 'A $60^\circ$ arc', 'An arc of 2 radians', 'An arc of $\tfrac{\pi}{3}$ radians']
  answer: [1, 3]
  explanation: |-
    The circumference is $12\pi$. A $60^\circ$ arc is $\tfrac16$ of it: $2\pi$. An arc of $\tfrac{\pi}{3}$ radians has $s = r\theta = 6 \cdot \tfrac{\pi}{3} = 2\pi$ (and $\tfrac{\pi}{3}$ rad is $60^\circ$, the same arc). A $120^\circ$ arc is $\tfrac13 \cdot 12\pi = 4\pi$. An arc of 2 radians has $s = 6 \cdot 2 = 12$, about $5.72$ units longer than $2\pi \approx 6.28$.

- id: geo-m7-r2-q05
  lesson: geo-circle-basics
  type: order
  topic: Arcs and arc length
  stem: 'All of these arcs are on the same circle, of radius 10. Put them in order from shortest to longest.'
  items: ['An arc of 1 radian', 'A $60^\circ$ arc', 'An arc of $\tfrac{\pi}{2}$ radians', 'A $100^\circ$ arc', 'An arc of 3 radians']
  explanation: |-
    On one circle, arc length is proportional to the angle, so compare angles in degrees: 1 radian $\approx 57.3^\circ$, then $60^\circ$, then $\tfrac{\pi}{2} = 90^\circ$, then $100^\circ$, then 3 radians $\approx 171.9^\circ$. The lengths are about 10, 10.47, 15.71, 17.45 and 30.

# ---------- Lesson 28: chords and tangents ----------
- id: geo-m7-r2-q06
  lesson: geo-chords-tangents
  type: label
  module_quiz: true
  topic: Tangents
  stem: 'Each circle has a right triangle drawn in it: one for a chord (left) and one for a tangent (right). Name the numbered sides of the two right triangles.'
  image: {src: images/geo-m7-chord-tangent-blank.svg, alt: 'Left: a circle with a horizontal chord, a short vertical segment from the center down to the middle of the chord with a right-angle mark, and a slanted segment from the center to the right end of the chord. Right: a smaller circle with a horizontal line touching its top at one point, a vertical segment from the center up to that point with a right-angle mark, and a dashed segment from the center to a point farther along the line.'}
  labels:
    - {x: 32.5, y: 64.6, text: Half of the chord}
    - {x: 25.0, y: 55.0, text: Distance from the center to the chord}
    - {x: 32.5, y: 55.0, text: Radius to the chord's endpoint}
    - {x: 65.8, y: 37.9, text: Radius to the point of tangency}
    - {x: 80.5, y: 25.8, text: Tangent segment}
    - {x: 81.8, y: 35.5, text: Segment from the exterior point to the center}
  distractors: [Whole chord, Diameter]
  explanation: |-
    Left: the perpendicular from the center (2) bisects the chord, so the bottom leg (1) is half of the chord, and the slanted side (3) is a radius to the chord's endpoint: the hypotenuse. Right: the radius to the point of tangency (4) meets the tangent segment (5) at a right angle, so the hypotenuse is the segment from the exterior point to the center (6). The radius is the hypotenuse in the chord triangle but a leg in the tangent triangle.

- id: geo-m7-r2-q07
  lesson: geo-chords-tangents
  type: text
  topic: Chords
  stem: 'A circle has radius 17. A chord is 8 units from the center. The chord''s length is ___.'
  accept: ['30']
  explanation: |-
    The perpendicular from the center bisects the chord. Half the chord is $\sqrt{17^2 - 8^2} = \sqrt{289 - 64} = \sqrt{225} = 15$, so the whole chord is $30$. (Answering 15 forgets to double the half-chord.)

- id: geo-m7-r2-q08
  lesson: geo-chords-tangents
  topic: Chords
  stem: 'Which statements are true for every circle? Select all that apply.'
  choices: ['A tangent is perpendicular to the radius drawn to the point of tangency.', 'A chord farther from the center is longer than one closer to it.', 'The perpendicular bisector of any chord passes through the center.', 'Two congruent chords can be different distances from the center.']
  answer: [0, 2]
  explanation: |-
    The Tangent–Radius Theorem gives the first, and the converse of the Perpendicular Chord Bisector Theorem gives the third (the center is equidistant from the chord's endpoints). Chords get shorter as they move away from the center: the diameter, at distance 0, is the longest. And by the Equidistant Chords Theorem, congruent chords in one circle are always the same distance from the center.

- id: geo-m7-r2-q09
  lesson: geo-chords-tangents
  type: order
  module_quiz: true
  topic: Chords
  stem: 'A chord of length 24 is 5 units from the center of a circle. Put the steps for finding the radius in order.'
  items: ['Draw the perpendicular from the center to the chord.', 'It bisects the chord, so half the chord is 12.', 'Radius, half-chord and distance form a right triangle with legs 12 and 5.', 'By the Pythagorean theorem, $r = \sqrt{12^2 + 5^2} = 13$.']
  explanation: |-
    The perpendicular has to be drawn before you can use that it bisects the chord; the bisection gives the leg 12; the right triangle needs both legs; and the Pythagorean theorem comes last: $r = \sqrt{144 + 25} = \sqrt{169} = 13$.

- id: geo-m7-r2-q10
  lesson: geo-chords-tangents
  type: match
  topic: Tangents
  stem: 'Each problem leads to a right triangle. Match each one to the segment that is the hypotenuse.'
  pairs:
    - ['A chord, with the perpendicular from the center to it', 'The radius to an endpoint of the chord']
    - ['A tangent segment from an exterior point $P$', 'The segment from P to the center']
    - ['A belt along a common external tangent of two pulleys', 'The segment joining the two centers']
  distractors: ['The tangent segment', 'Half of the chord']
  explanation: |-
    For a chord, the legs are the half-chord and the distance to the center, so the radius is the hypotenuse. For a tangent, the right angle is at the point of tangency, between the radius and the tangent, so the segment from $P$ to the center is the hypotenuse. For the pulley belt (Lesson 28, Example 6), sliding the belt toward the centers makes a right triangle whose legs are the belt length and the difference of the radii, with the segment joining the centers as hypotenuse. The tangent segment and the half-chord are always legs.

# ---------- Lesson 29: inscribed angles ----------
- id: geo-m7-r2-q11
  lesson: geo-inscribed
  type: label
  module_quiz: true
  topic: Angles from secants and tangents
  stem: 'Each numbered point is the vertex of an angle whose sides are drawn in black; the arcs it intercepts are in color. Pick the rule that gives each angle''s measure.'
  image: {src: images/geo-m7-angle-types-blank.svg, alt: 'Four circles. In the first, two segments meet at the center. In the second, two chords meet at a point on the circle. In the third, two chords cross inside the circle. In the fourth, two lines from a point outside the circle each cut through it. The arcs between the sides of each angle are drawn in color.'}
  labels:
    - {x: 25.0, y: 25.0, text: Equals its intercepted arc}
    - {x: 70.6, y: 39.1, text: Half its intercepted arc}
    - {x: 27.4, y: 72.9, text: Half the sum of the two arcs}
    - {x: 95.8, y: 73.1, text: Half the difference of the two arcs}
  distractors: [Twice its intercepted arc, The sum of the two arcs]
  explanation: |-
    1 has its vertex at the center: a central angle equals its arc. 2 has its vertex on the circle: an inscribed angle is half its arc. 3 is formed by two chords crossing inside: half the sum of the arc inside the angle and the arc inside its vertical angle. 4 is formed by two secants from an outside point: half of the far arc minus the near arc. No angle in a circle is twice its arc; it's the other way around (the arc is twice the inscribed angle).

- id: geo-m7-r2-q12
  lesson: geo-inscribed
  type: text
  topic: Angles from secants and tangents
  stem: 'Two tangents from a point $P$ touch a circle, and the minor arc between the points of tangency measures $130^\circ$. Then $m\angle P =$ ___ degrees. (Give only the number.)'
  accept: ['50']
  explanation: |-
    The major arc is $360 - 130 = 230^\circ$. For a vertex outside the circle, $m\angle P = \tfrac12(230 - 130) = 50^\circ$. Shortcut for two tangents: $180^\circ - 130^\circ = 50^\circ$ (the quadrilateral formed with the two radii has right angles at the points of tangency).

- id: geo-m7-r2-q13
  lesson: geo-inscribed
  topic: Inscribed angles
  stem: 'Inscribed $\angle ABC$ intercepts a $100^\circ$ arc, so it measures $50^\circ$. Which of these angles also measure $50^\circ$? Select all that apply.'
  choices: ['The central angle that intercepts the same arc', 'A different inscribed angle that intercepts the same arc', 'An angle formed by two secants from outside the circle, with far arc $100^\circ$ and some near arc', 'The angle between a tangent and a chord that intercepts the same arc']
  answer: [1, 3]
  explanation: |-
    Every inscribed angle on a $100^\circ$ arc is $\tfrac12 \cdot 100 = 50^\circ$, and a tangent–chord angle is also half its arc, $50^\circ$. The central angle equals the arc, $100^\circ$. Two secants give $\tfrac12(100 - \text{near arc})$, which is less than $50^\circ$ because the near arc is more than 0.

- id: geo-m7-r2-q14
  lesson: geo-inscribed
  type: order
  module_quiz: true
  topic: Angles from secants and tangents
  stem: 'Put these angles in order from smallest to largest.'
  items: ['Two secants meeting outside the circle, with far arc $100^\circ$ and near arc $40^\circ$', 'An inscribed angle that intercepts an $80^\circ$ arc', 'Two chords crossing inside the circle, with intercepted arcs $60^\circ$ and $40^\circ$', 'A central angle that intercepts a $60^\circ$ arc', 'A tangent–chord angle that intercepts a $140^\circ$ arc']
  explanation: |-
    Secants: $\tfrac12(100 - 40) = 30^\circ$. Inscribed: $\tfrac12 \cdot 80 = 40^\circ$. Chords: $\tfrac12(60 + 40) = 50^\circ$. Central: $60^\circ$. Tangent–chord: $\tfrac12 \cdot 140 = 70^\circ$.

- id: geo-m7-r2-q15
  lesson: geo-inscribed
  type: match
  topic: Inscribed angles
  stem: 'Quadrilateral $ABCD$ is inscribed in a circle, with $m\angle A = 70^\circ$ and $m\angle B = 105^\circ$. Match each measure.'
  pairs:
    - ['$m\angle C$', '110°']
    - ['$m\angle D$', '75°']
    - ['$m\overset{\frown}{BCD}$, the arc intercepted by $\angle A$', '140°']
    - ['$m\overset{\frown}{DAB}$, the arc intercepted by $\angle C$', '220°']
  distractors: ['70°', '105°']
  explanation: |-
    Opposite angles of a cyclic quadrilateral are supplementary: $m\angle C = 180 - 70 = 110^\circ$ and $m\angle D = 180 - 105 = 75^\circ$. An inscribed angle is half its arc, so $\angle A$'s arc is $2 \cdot 70 = 140^\circ$ and $\angle C$'s arc is $2 \cdot 110 = 220^\circ$. Check: the two arcs make the whole circle, $140 + 220 = 360^\circ$.

# ---------- Lesson 30: segment lengths and the equation of a circle ----------
- id: geo-m7-r2-q16
  lesson: geo-circle-seg
  type: label
  module_quiz: true
  topic: Segment lengths in circles
  stem: 'A tangent and a secant are drawn to a circle from the same outside point. Name the numbered parts.'
  image: {src: images/geo-m7-secant-tangent-blank.svg, alt: 'A circle with a marked center and a dashed radius up to a point on the circle. From a point to the right of the circle, one segment touches the circle at the end of that radius, at a right angle to it. A second segment from the same point enters the circle on its right side and crosses it to the far left side; the outside part is blue and the part inside the circle is red.'}
  labels:
    - {x: 71.2, y: 49.9, text: Tangent segment}
    - {x: 72.2, y: 70.4, text: External segment}
    - {x: 33.5, y: 67.2, text: Chord inside the circle}
    - {x: 44.8, y: 22.8, text: Point of tangency}
    - {x: 33.9, y: 51.5, text: Center}
  distractors: [Exterior point, Diameter]
  explanation: |-
    1 touches the circle at one point: the tangent segment, which meets the radius at the point of tangency (4) at a right angle. Along the secant, 2 is the external segment (from the outside point to the near intersection) and 3 is the chord inside the circle; together they make the whole secant segment. 5 is the center. The secant–tangent rule says tangent² = external segment × whole secant. The exterior point is the unnumbered dot on the right; the red chord does not pass through the center, so it is not a diameter.

- id: geo-m7-r2-q17
  lesson: geo-circle-seg
  type: text
  topic: Equation of a circle
  stem: 'The circle $x^2 + y^2 + 8x - 2y - 8 = 0$ has center $(h, k)$ with $h =$ ___ and $k =$ ___, and radius ___.'
  accept:
    - ['-4']
    - ['1']
    - ['5']
  explanation: |-
    Group and move the constant: $(x^2 + 8x) + (y^2 - 2y) = 8$. Add $\left(\tfrac82\right)^2 = 16$ and $\left(\tfrac{-2}{2}\right)^2 = 1$ to both sides: $(x + 4)^2 + (y - 1)^2 = 25$. The center is $(-4, 1)$ (watch the signs) and the radius is $\sqrt{25} = 5$, not 25.

- id: geo-m7-r2-q18
  lesson: geo-circle-seg
  type: order
  module_quiz: true
  topic: Equation of a circle
  stem: 'Put the steps for finding the center and radius of $x^2 + y^2 - 6x + 4y - 3 = 0$ in order.'
  items: ['Group and move the constant: $(x^2 - 6x) + (y^2 + 4y) = 3$', 'Add 9 and 4 to both sides: $(x^2 - 6x + 9) + (y^2 + 4y + 4) = 16$', 'Write as squares: $(x - 3)^2 + (y + 2)^2 = 16$', 'Read off the center $(3, -2)$ and the radius 4']
  explanation: |-
    Completing the square needs the $x$ and $y$ terms grouped first, then $\left(\tfrac{-6}{2}\right)^2 = 9$ and $\left(\tfrac42\right)^2 = 4$ added to both sides ($3 + 9 + 4 = 16$), then each group written as a square. Only then can you read the center $(3, -2)$ and radius $\sqrt{16} = 4$.

- id: geo-m7-r2-q19
  lesson: geo-circle-seg
  topic: Equation of a circle
  stem: 'Which points lie outside the circle $(x - 1)^2 + (y + 2)^2 = 25$? Select all that apply.'
  choices: ['$(6, 0)$', '$(-2, 1)$', '$(1, 4)$', '$(-4, -2)$']
  answer: [0, 2]
  explanation: |-
    Compare $(x - 1)^2 + (y + 2)^2$ with 25. $(6, 0)$: $25 + 4 = 29 > 25$, outside. $(-2, 1)$: $9 + 9 = 18 < 25$, inside. $(1, 4)$: $0 + 36 = 36 > 25$, outside. $(-4, -2)$: $25 + 0 = 25$, exactly on the circle, so not outside.

- id: geo-m7-r2-q20
  lesson: geo-circle-seg
  type: match
  topic: Segment lengths in circles
  stem: 'Match each situation to the length $x$.'
  pairs:
    - ['Two chords cross: pieces 6 and 4 on one, 3 and $x$ on the other', '8']
    - ['Two secants from $P$: outside 5 and whole 12 on one, outside 4 and whole $x$ on the other', '15']
    - ['From $P$: tangent $x$, and a secant with outside 8 and whole 18', '12']
    - ['From $P$: tangent 6, and a secant with outside 4 and whole $x$', '9']
  distractors: ['10', '11']
  explanation: |-
    Chords: $6 \cdot 4 = 3x$, so $x = 8$. Secants: $5 \cdot 12 = 4x$, so $x = 15$. Tangent and secant: $x^2 = 8 \cdot 18 = 144$, so $x = 12$. Tangent 6: $36 = 4x$, so $x = 9$. (10 is the chord inside the third secant, $18 - 8$; 11 would be the chord inside the second, $15 - 4$.)

# ---------- Honors: the power of a point and the radical axis ----------
- id: geo-m7-r2-h01
  lesson: geo-m7-h-power-radical
  topic: Power of a point
  stem: 'Point $P$ is 13 units from the center of a circle of radius 5. What is the power of $P$ with respect to the circle?'
  choices: ['$144$', '$8$', '$-144$', '$194$']
  answer: 0
  explanation: |-
    $\operatorname{pow}(P) = d^2 - r^2 = 169 - 25 = 144$, positive because $P$ is outside. (A tangent from $P$ has length 12.) 8 is $d - r$, only one of the two distances along the line through the center; $-144$ has the sign backward; 194 adds the squares.

- id: geo-m7-r2-h02
  lesson: geo-m7-h-power-radical
  topic: Power of a point
  stem: 'Point $P$ is 4 units from the center of a circle of radius 9. A chord through $P$ has one piece of length 5. How long is the whole chord?'
  choices: ['$13$', '$18$', '$10$', '$24.4$']
  answer: 1
  explanation: |-
    The power is $4^2 - 9^2 = -65$, so every chord through $P$ has piece $\cdot$ piece $= 65$. The other piece is $65 \div 5 = 13$, and the chord is $5 + 13 = 18$. 13 is only the other piece; 10 assumes $P$ is the chord's midpoint; 24.4 uses $r^2 + d^2 = 97$ in place of $r^2 - d^2$.

- id: geo-m7-r2-h03
  lesson: geo-m7-h-power-radical
  type: text
  topic: Power of a point
  stem: 'For the circle $x^2 + y^2 - 6x + 2y - 15 = 0$, the power of $P(1, 4)$ is ___, so a tangent segment from $P$ has length ___.'
  accept:
    - ['4']
    - ['2']
  explanation: |-
    Substitute into the left side: $1 + 16 - 6 + 8 - 15 = 4$. The power is positive, so $P$ is outside and the tangent length is $\sqrt4 = 2$. Check: the circle is $(x - 3)^2 + (y + 1)^2 = 25$, and $P$'s squared distance from $(3, -1)$ is $4 + 25 = 29$; $29 - 25 = 4$.

- id: geo-m7-r2-h04
  lesson: geo-m7-h-power-radical
  topic: Power of a point
  stem: 'What is the power of the point $(1, 1)$ with respect to the circle $2x^2 + 2y^2 - 8x + 4y - 10 = 0$?'
  choices: ['$-10$', '$5$', '$-5$', '$\sqrt5$']
  answer: 2
  explanation: |-
    First divide by 2 so $x^2$ and $y^2$ have coefficient 1: $x^2 + y^2 - 4x + 2y - 5 = 0$. Then $1 + 1 - 4 + 2 - 5 = -5$: the point is inside. Plugging into the undivided equation gives $-10$, twice the power. Check: the circle is $(x - 2)^2 + (y + 1)^2 = 10$, and $(1, 1)$ has $d^2 = 1 + 4 = 5$, so the power is $5 - 10 = -5$.

- id: geo-m7-r2-h05
  lesson: geo-m7-h-power-radical
  topic: Radical axis
  stem: 'Which statements about the radical axis of two circles with different centers are true? Select all that apply.'
  choices: ['It is perpendicular to the line through the two centers.', 'It always passes through the midpoint of the segment joining the centers.', 'If the circles cross, it contains their common chord.', 'From any point on it outside both circles, the tangent segments to the two circles are equal.']
  answer: [0, 2, 3]
  explanation: |-
    Subtracting the general forms gives a line whose normal vector points along the line of centers, so the axis is perpendicular to it. The crossing points have power 0 for both circles, so they lie on the axis. A point on the axis has the same power $p$ for both circles, and each tangent is $\sqrt{p}$. The axis passes through the midpoint of the centers only when the radii are equal: for $x^2 + y^2 = 25$ and $(x - 6)^2 + y^2 = 13$ the axis is $x = 4$, not $x = 3$.

- id: geo-m7-r2-h06
  lesson: geo-m7-h-power-radical
  topic: Radical axis
  stem: 'Find the radical axis of $x^2 + y^2 = 16$ and $(x - 10)^2 + y^2 = 36$.'
  choices: ['$x = 5$', '$x = 2.4$', '$x = 6$', '$x = 4$']
  answer: 3
  explanation: |-
    General forms: $x^2 + y^2 - 16 = 0$ and $x^2 + y^2 - 20x + 64 = 0$. Subtracting, $20x - 80 = 0$, so $x = 4$. Here the radii add to $4 + 6 = 10$, the distance between centers, so the circles are tangent at $(4, 0)$ and the radical axis is their common tangent line. $x = 5$ is the midpoint of the centers (right only for equal radii); $x = 6$ is $10 - 4$, the distance from the second center; $x = 2.4$ comes from $20x = 100 - 36 - 16$, a sign slip.

- id: geo-m7-r2-h07
  lesson: geo-m7-h-power-radical
  type: text
  topic: Radical axis
  stem: 'The circles $x^2 + y^2 = 25$ and $(x - 7)^2 + y^2 = 32$ have radical axis $x =$ ___, and their common chord has length ___.'
  accept:
    - ['3']
    - ['8']
  explanation: |-
    General forms: $x^2 + y^2 - 25 = 0$ and $x^2 + y^2 - 14x + 17 = 0$. Subtracting, $14x - 42 = 0$, so $x = 3$. On that line the first circle gives $9 + y^2 = 25$, so $y = \pm 4$ (check in the second: $16 + 16 = 32$). The common chord runs from $(3, -4)$ to $(3, 4)$: length 8.

- id: geo-m7-r2-h08
  lesson: geo-m7-h-power-radical
  type: order
  topic: Radical axis
  stem: 'Put the steps for finding the radical axis of $(x - 2)^2 + y^2 = 9$ and $x^2 + (y - 4)^2 = 1$ in order.'
  items: ['Expand both into general form: $x^2 + y^2 - 4x - 5 = 0$ and $x^2 + y^2 - 8y + 15 = 0$', 'Subtract the equations: $-4x + 8y - 20 = 0$', 'Simplify to the line $x - 2y + 5 = 0$', 'Check that this line (slope $\tfrac12$) is perpendicular to the line of centers through $(2, 0)$ and $(0, 4)$ (slope $-2$)']
  explanation: |-
    Subtracting only cancels $x^2$ and $y^2$ when both equations are in general form, so expanding comes first. Subtracting gives $(-4x - 5) - (-8y + 15) = -4x + 8y - 20$; dividing by $-4$ gives $x - 2y + 5 = 0$. The check uses the finished line: slopes $\tfrac12$ and $-2$ multiply to $-1$.

- id: geo-m7-r2-h09
  lesson: geo-m7-h-power-radical
  type: match
  topic: Radical axis
  stem: 'Match each pair of circles to its radical axis.'
  pairs:
    - ['Two circles that cross at $X$ and $Y$', 'The line through X and Y']
    - ['Two circles tangent to each other at $T$', 'The common tangent line at T']
    - ['Two circles of equal radius that don''t meet', 'The perpendicular bisector of the segment joining the centers']
    - ['Two concentric circles of different radii', 'There is no radical axis']
  distractors: ['The line through the two centers']
  explanation: |-
    Crossing circles: $X$ and $Y$ have power 0 for both, so the axis is line $XY$. Tangent circles: $T$ has power 0 for both, and the axis is perpendicular to the line of centers there, which is the common tangent. Equal radii: equal power means $d_1^2 - r^2 = d_2^2 - r^2$, so $d_1 = d_2$, the perpendicular bisector. Concentric circles: subtracting leaves $F_1 - F_2 = 0$, which is false, so no point qualifies. The radical axis is never the line of centers; it is perpendicular to it.

- id: geo-m7-r2-h10
  lesson: geo-m7-h-power-radical
  type: label
  topic: Radical axis
  stem: 'Two circles cross, and the dashed line is the set of points with equal power with respect to both. $P$ is a point on it. Name the numbered parts.'
  image: {src: images/geo-m7-radical-axis-blank.svg, alt: 'Two overlapping circles with their centers on a horizontal line. A vertical dashed line passes through both crossing points of the circles; the part between the crossing points is drawn solid and thick. A point on the dashed line above the circles has a segment to a point on each circle, touching it there.'}
  labels:
    - {x: 44.0, y: 87.0, text: Radical axis}
    - {x: 44.0, y: 46.1, text: Common chord}
    - {x: 60.5, y: 54.8, text: Line of centers}
    - {x: 53.4, y: 26.2, text: Tangent segment from P}
  distractors: [Common external tangent, Diameter]
  explanation: |-
    The dashed line of equal power is the radical axis (1). The part of it between the two crossing points is the common chord (2). The horizontal line through both centers is the line of centers (3), perpendicular to the radical axis. Segment 4 runs from $P$ to a point where it just touches the right circle: a tangent segment, equal in length to the tangent from $P$ to the left circle, since $P$ has the same power for both.

- id: geo-m7-r2-h11
  lesson: geo-m7-h-power-radical
  topic: Radical axis
  stem: 'Find the radical center of $x^2 + y^2 = 4$, $(x - 6)^2 + y^2 = 4$ and $x^2 + (y - 8)^2 = 4$.'
  choices: ['$(3, 0)$', '$(3, 4)$', '$(2, \tfrac83)$', '$(4, 3)$']
  answer: 1
  explanation: |-
    General forms: $x^2 + y^2 - 4 = 0$, $x^2 + y^2 - 12x + 32 = 0$, $x^2 + y^2 - 16y + 60 = 0$. First and second: $12x - 36 = 0$, so $x = 3$. First and third: $16y - 64 = 0$, so $y = 4$. The radical center is $(3, 4)$, where the power is $9 + 16 - 4 = 21$ for all three circles. (With equal radii, it is also the circumcenter of the three centers.) $(3, 0)$ uses only the first axis; $(2, \tfrac83)$ is the centroid of the centers; $(4, 3)$ swaps the coordinates.

- id: geo-m7-r2-h12
  lesson: geo-m7-h-power-radical
  topic: Radical axis
  stem: 'Three circles with non-collinear centers cross each other in pairs. Why do their three common chords, extended to lines, pass through one point?'
  choices: ['Each common chord lies on a radical axis, and the three radical axes meet at the radical center.', 'Each common chord is a median of the triangle formed by the centers.', 'Each common chord is the perpendicular bisector of a side of the triangle formed by the centers.', 'Any three chords drawn in circles meet at one point.']
  answer: 0
  explanation: |-
    The line of each common chord is the radical axis of that pair. A point on two of the axes has equal power for all three circles, so it lies on the third axis too. The chords are perpendicular to the sides of the triangle of centers, but they are perpendicular bisectors only when the two radii are equal, and they are not medians. Chords in general don't meet at one point.

- id: geo-m7-r2-h13
  lesson: geo-m7-h-power-radical
  topic: Power of a point
  stem: 'Point $Q$ is on the radical axis of two circles, outside both. The tangent segment from $Q$ to the first circle has length 7. What is the power of $Q$ with respect to the second circle?'
  choices: ['$7$', '$14$', '$\sqrt7$', '$49$']
  answer: 3
  explanation: |-
    The power with respect to the first circle is (tangent)² $= 49$. On the radical axis the two powers are equal, so it is 49 for the second circle too (and the tangent to it is also 7). 7 is the tangent length, not the power.

- id: geo-m7-r2-h14
  lesson: geo-m7-h-power-radical
  topic: Power of a point
  stem: 'Point $P$ has power $-12$ with respect to a circle. Which statements are true? Select all that apply.'
  choices: ['$P$ is inside the circle.', 'A tangent segment from $P$ has length $\sqrt{12}$.', 'Every chord through $P$ is cut by $P$ into two pieces whose product is 12.', '$P$ is 12 units from the center.']
  answer: [0, 2]
  explanation: |-
    A negative power, $d^2 - r^2 < 0$, means $d < r$: inside. For an inside point the product of the pieces of any chord is $r^2 - d^2 = 12$. There is no tangent from an inside point. The power is $d^2 - r^2$, not the distance itself.

# ---------- Honors: concyclic points and the circumcircle ----------
- id: geo-m7-r2-h15
  lesson: geo-m7-h-concyclic
  topic: Concyclic points
  stem: 'Convex quadrilateral $ABCD$ has $m\angle A = 76^\circ$, $m\angle B = 98^\circ$ and $m\angle C = 104^\circ$. Is it cyclic?'
  choices: ['No: $\angle A$ and $\angle B$ are not supplementary.', 'It can''t be decided without the side lengths.', 'Yes: $\angle A$ and $\angle C$ are supplementary.', 'No: $\angle B$ and $\angle C$ add to more than $180^\circ$.']
  answer: 2
  explanation: |-
    $76 + 104 = 180$, so one pair of opposite angles is supplementary, and a convex quadrilateral with that property is cyclic. (Then $m\angle D = 360 - 278 = 82^\circ$, and $98 + 82 = 180$ too.) $\angle A$ and $\angle B$, and $\angle B$ and $\angle C$, are adjacent, not opposite, so their sums don't matter. Angles alone settle the question.

- id: geo-m7-r2-h16
  lesson: geo-m7-h-concyclic
  topic: Concyclic points
  stem: 'In convex quadrilateral $ABCD$, $m\angle ABD = 40^\circ$, $m\angle ACD = 40^\circ$ and $m\angle ABC = 110^\circ$. Find $m\angle ADC$.'
  choices: ['$70^\circ$', '$110^\circ$', '$40^\circ$', '$140^\circ$']
  answer: 0
  explanation: |-
    $B$ and $C$ are on the same side of $\overline{AD}$ (the quadrilateral is convex) and see $\overline{AD}$ at equal angles, $40^\circ$. So $A$, $B$, $C$, $D$ are concyclic, and $ABCD$ is a cyclic quadrilateral. Its opposite angles are supplementary: $m\angle ADC = 180 - 110 = 70^\circ$. 110° assumes opposite angles are equal, as in a parallelogram.

- id: geo-m7-r2-h17
  lesson: geo-m7-h-concyclic
  type: text
  topic: Concyclic points
  stem: 'Segments $\overline{AB}$ and $\overline{CD}$ cross at $E$, with $EA = 3$, $EB = 10$ and $EC = 5$. For $A$, $B$, $C$, $D$ to lie on one circle, $ED$ must be ___.'
  accept: ['6']
  explanation: |-
    The four points are concyclic exactly when $EA \cdot EB = EC \cdot ED$: $3 \cdot 10 = 5 \cdot ED$, so $ED = 6$. (The Intersecting Chords Theorem gives "only if", and its converse gives "if".)

- id: geo-m7-r2-h18
  lesson: geo-m7-h-concyclic
  topic: Concyclic points
  stem: 'Which quadrilaterals are always cyclic? Select all that apply.'
  choices: [Rhombus, Rectangle, Kite, Isosceles trapezoid]
  answer: [1, 3]
  explanation: |-
    A rectangle's opposite angles are both $90^\circ$, summing to $180^\circ$. An isosceles trapezoid's angles along a leg are supplementary and its base angles are equal, so its opposite angles are supplementary. A rhombus has equal opposite angles, which are supplementary only if both are $90^\circ$ (a square). A kite is cyclic only when its two equal angles are right angles.

- id: geo-m7-r2-h19
  lesson: geo-m7-h-concyclic
  type: match
  topic: Concyclic points
  stem: 'Match each quadrilateral to when its vertices lie on one circle.'
  pairs:
    - [Parallelogram, Only when it is a rectangle]
    - [Kite, Only when its two equal angles are right angles]
    - [Isosceles trapezoid, Always]
    - [Trapezoid that is not isosceles, Never]
    - [Rhombus, Only when it is a square]
  explanation: |-
    Use the opposite-angle test. A parallelogram's opposite angles are equal, so supplementary means $90^\circ$ each: a rectangle. A rhombus is a parallelogram, and a rhombus with right angles is a square. A kite's one pair of equal opposite angles must sum to $180^\circ$, so each is $90^\circ$. An isosceles trapezoid always passes. In any trapezoid the angles along a leg are supplementary, so if opposite angles were also supplementary the base angles would be equal and the trapezoid would be isosceles.

- id: geo-m7-r2-h20
  lesson: geo-m7-h-concyclic
  type: order
  topic: Concyclic points
  stem: 'Segments $\overline{AB}$ and $\overline{CD}$ cross at $E$ with $EA \cdot EB = EC \cdot ED$. Put the steps of the proof that $A$, $B$, $C$, $D$ are concyclic in order.'
  items: ['Rewrite the equation as the proportion $\tfrac{EA}{ED} = \tfrac{EC}{EB}$.', 'With the vertical angles at $E$, conclude $\triangle AEC \sim \triangle DEB$ by SAS similarity.', 'Corresponding angles of the similar triangles give $\angle CAB \cong \angle CDB$.', '$A$ and $D$ see $\overline{CB}$ at equal angles from the same side, so the equal-angle test applies.', 'Conclude that $A$, $B$, $C$, $D$ lie on one circle.']
  explanation: |-
    SAS similarity needs the proportion first; the equal angles come from the similar triangles; the equal-angle test needs those angles; and the conclusion comes last.

- id: geo-m7-r2-h21
  lesson: geo-m7-h-concyclic
  topic: Circumradius
  stem: 'In a triangle, $a = 10$ and $m\angle A = 30^\circ$. What is the radius of its circumscribed circle?'
  choices: ['$20$', '$10$', '$5$', '$5\sqrt3$']
  answer: 1
  explanation: |-
    $\tfrac{a}{\sin A} = 2R$, so $2R = \tfrac{10}{0.5} = 20$ and $R = 10$. 20 is the diameter (forgetting the 2); 5 is half the side; $5\sqrt3 = 10\cos 30^\circ$ uses the wrong trig function.

- id: geo-m7-r2-h22
  lesson: geo-m7-h-concyclic
  type: text
  topic: Circumradius
  stem: 'An equilateral triangle has side 6. Its circumradius is ___. (Exact, like 2sqrt(3), or to 2 decimal places.)'
  accept: ['2sqrt(3)', '2sqrt3', '2√3', '2√(3)', '2*sqrt(3)', '2*sqrt3', '2*√3', 'sqrt(12)', 'sqrt12', '√12', '3.46', '3.464', '3.4641']
  explanation: |-
    Each angle is $60^\circ$, so $2R = \tfrac{6}{\sin 60^\circ} = \tfrac{6}{\sqrt3/2} = \tfrac{12}{\sqrt3} = 4\sqrt3$, and $R = 2\sqrt3 \approx 3.46$. (The circumcenter is also the centroid, two-thirds of the way down the altitude $3\sqrt3$: $\tfrac23 \cdot 3\sqrt3 = 2\sqrt3$.)

- id: geo-m7-r2-h23
  lesson: geo-m7-h-concyclic
  topic: Circumradius
  stem: 'A triangle has sides 5, 5 and 6. Find its circumradius.'
  choices: ['$3$', '$6.25$', '$2.5$', '$3.125$']
  answer: 3
  explanation: |-
    The altitude to the side 6 bisects it (isosceles), so it is $\sqrt{5^2 - 3^2} = 4$ and the area is $K = \tfrac12 \cdot 6 \cdot 4 = 12$. Then $R = \tfrac{abc}{4K} = \tfrac{5 \cdot 5 \cdot 6}{48} = \tfrac{150}{48} = 3.125$. 6.25 is $2R$; 3 is half the base; 2.5 is half a leg.

- id: geo-m7-r2-h24
  lesson: geo-m7-h-concyclic
  topic: Circumradius
  stem: 'A right triangle has legs 9 and 12. Where is the center of its circumscribed circle, and what is the radius?'
  choices: ['At the incenter; $R = 3$', 'At the midpoint of the hypotenuse; $R = 7.5$', 'At the vertex of the right angle; $R = 7.5$', 'At the midpoint of the hypotenuse; $R = 15$']
  answer: 1
  explanation: |-
    The hypotenuse is $\sqrt{81 + 144} = 15$. A right angle is inscribed in a semicircle, so the hypotenuse is a diameter: the center is its midpoint and $R = 7.5$. The extended Law of Sines agrees: $2R = \tfrac{15}{\sin 90^\circ} = 15$. (3 is the radius of the inscribed circle, $\tfrac{9 + 12 - 15}{2}$.)

- id: geo-m7-r2-h25
  lesson: geo-m7-h-concyclic
  type: text
  topic: Concyclic points
  stem: 'The circle through $(0, 0)$, $(8, 0)$ and $(0, 6)$ has its center at $x =$ ___, $y =$ ___ and radius ___.'
  accept:
    - ['4']
    - ['3']
    - ['5']
  explanation: |-
    The angle at the origin is a right angle, so the segment from $(8, 0)$ to $(0, 6)$ is a diameter. Its midpoint $(4, 3)$ is the center, and the radius is half its length, $\tfrac12\sqrt{64 + 36} = 5$. With the general form: $(0, 0)$ gives $F = 0$; $(8, 0)$ gives $64 + 8D = 0$, $D = -8$; $(0, 6)$ gives $36 + 6E = 0$, $E = -6$; so $x^2 + y^2 - 8x - 6y = 0$, which is $(x - 4)^2 + (y - 3)^2 = 25$.

- id: geo-m7-r2-h26
  lesson: geo-m7-h-concyclic
  topic: Concyclic points
  stem: 'The circle through three given points is $x^2 + y^2 - 2x + 4y - 20 = 0$. Which point is concyclic with them?'
  choices: ['$(3, 1)$', '$(6, 0)$', '$(4, 2)$', '$(0, 3)$']
  answer: 2
  explanation: |-
    A point is on the circle when the left side is 0. $(4, 2)$: $16 + 4 - 8 + 8 - 20 = 0$. ✓ The others: $(3, 1)$ gives $-12$ (inside), $(6, 0)$ gives $4$ (outside), $(0, 3)$ gives $1$ (outside). In standard form the circle is $(x - 1)^2 + (y + 2)^2 = 25$.

- id: geo-m7-r2-h27
  lesson: geo-m7-h-concyclic
  topic: Concyclic points
  stem: '$A$, $B$, $C$, $D$ lie on one circle, with $C$ and $D$ on opposite sides of $\overline{AB}$. If $m\angle ACB = 65^\circ$, what is $m\angle ADB$?'
  choices: ['$65^\circ$', '$130^\circ$', '$115^\circ$', '$25^\circ$']
  answer: 2
  explanation: |-
    $ACBD$ is a cyclic quadrilateral with $\angle C$ and $\angle D$ opposite, so they are supplementary: $180 - 65 = 115^\circ$. Equal angles ($65^\circ$) happen only for points on the same side of $\overline{AB}$. 130° is the arc $\overset{\frown}{AB}$ intercepted by $\angle ACB$; 25° is the complement.

- id: geo-m7-r2-h28
  lesson: geo-m7-h-concyclic
  topic: Circumradius
  stem: 'A triangle has sides 7, 15 and 20 and area 42. Use $R = \tfrac{abc}{4K}$ to find its circumradius.'
  choices: ['$12.5$', '$25$', '$50$', '$6.25$']
  answer: 0
  explanation: |-
    $R = \tfrac{7 \cdot 15 \cdot 20}{4 \cdot 42} = \tfrac{2100}{168} = 12.5$. 25 is $\tfrac{2100}{84}$, dividing by $2K$ (that's $2R$); 50 divides by $K$ alone; 6.25 divides by $8K$. (The area 42 can be checked with Heron's formula, Lesson 31: $s = 21$, $\sqrt{21 \cdot 14 \cdot 6 \cdot 1} = 42$.)
