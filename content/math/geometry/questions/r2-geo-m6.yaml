- id: geo-m6-r2-h41
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'A 20 cm segment is divided in extreme and mean ratio. About how long is the longer piece?'
  choices: ['7.64 cm', '12.36 cm', '10.00 cm', '32.36 cm']
  answer: 1
  explanation: |-
    The whole is $\varphi$ times the longer piece, so the longer piece is $\tfrac{20}{\varphi} \approx 12.36$ cm, and the shorter is $\approx 7.64$ cm. Check: $\tfrac{20}{12.36} \approx \tfrac{12.36}{7.64} \approx 1.618$.
- id: geo-m6-r2-h42
  lesson: geo-m6-h-golden
  type: text
  topic: Golden ratio
  stem: 'A $2 \times 1$ rectangle has a $1 \times 1$ square cut off one end. The piece left over is a ___.'
  accept: [square, a square, 1 by 1 square, 1x1 square]
  explanation: |-
    $2 - 1 = 1$, so what remains is another $1 \times 1$ square, not a rectangle similar to the $2 \times 1$ original. Only the golden rectangle leaves a piece similar to itself.
