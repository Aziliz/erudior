  type: label
  module_quiz: true
  topic: Solving right triangles
  stem: 'A person on the ground looks up at a person on top of a cliff. Name the numbered parts.'
  image: {src: images/geo-m6-elevation-blank.svg, alt: 'A person on level ground and another person standing on top of a cliff, joined by a straight line. Dashed horizontal lines run from each person''s eye level, and a shaded angle is marked at each end of the straight line.'}
