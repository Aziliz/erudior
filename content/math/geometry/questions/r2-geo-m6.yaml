  explanation: |-
    The line of sight (4) joins the two observers. The angle from the horizontal up to it is the angle of elevation (1); the angle from the upper horizontal (3) down to it is the angle of depression (2). The two horizontals are parallel, so these are alternate interior angles and are equal.
- id: geo-m6-r2-q22
  lesson: geo-trig
  type: match
  topic: Trigonometric ratios
  stem: 'Right $\triangle ABC$ has its right angle at $C$, with $BC = 8$, $AC = 15$ and $AB = 17$. Match each ratio to its value.'
  pairs:
    - ['$\sin A$', '8/17']
    - ['$\cos A$', '15/17']
    - ['$\tan A$', '8/15']
    - ['$\tan B$', '15/8']
  distractors: ['17/8']
  explanation: |-
    For $\angle A$, the opposite leg is $BC = 8$, the adjacent leg is $AC = 15$ and the hypotenuse is 17. For $\angle B$ the legs swap roles, so $\tan B = \tfrac{15}{8}$. No sine, cosine or tangent of an acute angle here is $\tfrac{17}{8}$ (that is a hypotenuse over a leg).
- id: geo-m6-r2-q23
  lesson: geo-trig
  type: text
  topic: Trigonometric ratios
  stem: 'Give the exact value: $\sin 30^\circ =$ ___.'
  accept: ['1/2']
  explanation: |-
    In a 30°-60°-90° triangle with sides $1 : \sqrt3 : 2$, the side opposite $30^\circ$ is 1 and the hypotenuse is 2, so $\sin 30^\circ = \tfrac12 = 0.5$.
- id: geo-m6-r2-q24
  lesson: geo-trig
  topic: Trigonometric ratios
  stem: 'Which of these are equal to $\cos 60^\circ$? Select all that apply.'
  choices: ['$\sin 30^\circ$', '$\tfrac12$', '$\sin 60^\circ$', '$\tan 45^\circ$']
  answer: [0, 1]
  explanation: |-
    $\cos 60^\circ = \tfrac12$, and $\sin 30^\circ = \cos(90^\circ - 30^\circ) = \cos 60^\circ$. But $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\tan 45^\circ = 1$.
- id: geo-m6-r2-q25
  lesson: geo-trig
  type: order
  topic: Solving right triangles
  stem: 'From 25 m away on level ground, the angle of elevation to the top of a flagpole is $40^\circ$. Put the steps for finding its height in order.'
  items:
    - 'Sketch the right triangle with the $40^\circ$ angle at the observer'
    - 'Name the sides: the 25 m is adjacent to the angle and the height is opposite it'
    - 'Opposite and adjacent call for tangent: $\tan 40^\circ = \tfrac{h}{25}$'
    - 'Multiply: $h = 25\tan 40^\circ \approx 20.98$ m'
  explanation: |-
    Draw the picture, name the sides relative to the angle, choose the ratio that uses those two sides, then solve. $25 \tan 40^\circ \approx 25(0.8391) \approx 20.98$ m.

# ---------- Lesson 25: Law of Sines ----------
- id: geo-m6-r2-q26
  lesson: geo-law-sines
  type: text
  topic: Ambiguous case
  stem: 'In $\triangle ABC$, $m\angle A = 30^\circ$, $a = 5$ and $b = 6$. By the Law of Sines, $\sin B =$ ___. (Give the exact decimal.)'
  accept: ['0.6', '3/5']
  explanation: |-
    $\sin B = \dfrac{b\sin A}{a} = \dfrac{6(0.5)}{5} = 0.6$. Since $h = 6\sin 30^\circ = 3 < 5 < 6$, both $B \approx 36.87^\circ$ and $B \approx 143.13^\circ$ give triangles.
- id: geo-m6-r2-q27
  lesson: geo-law-sines
  type: match
  module_quiz: true
  topic: Ambiguous case
  stem: 'In $\triangle ABC$, $m\angle A = 30^\circ$ and $b = 10$, so $h = b\sin A = 5$. Match each value of $a$ to the number of triangles.'
  pairs:
    - ['$a = 4$', No triangle]
    - ['$a = 5$', One right triangle]
    - ['$a = 7$', Two triangles]
    - ['$a = 12$', One triangle that is not right]
  distractors: [Three triangles]
  explanation: |-
    $4 < h$: too short to reach. $a = h = 5$: it just touches, a right angle at $B$. $5 < 7 < 10$: it reaches the base at two points. $12 \ge 10$: the second crossing falls behind $A$, leaving one triangle. Two circle-and-line crossings can never give three triangles.
- id: geo-m6-r2-q28
  lesson: geo-law-sines
  topic: Law of Sines
  stem: 'For which kinds of given information can the Law of Sines be used to start solving a triangle? Select all that apply.'
  choices: [ASA, AAS, SSA, SAS, SSS]
  answer: [0, 1, 2]
  explanation: |-
    The Law of Sines needs a side together with its opposite angle. ASA and AAS give that after the angle sum supplies the third angle; SSA gives it directly (with the ambiguous-case check). SAS and SSS have no known side–angle pair, so they start with the Law of Cosines.
- id: geo-m6-r2-q29
  lesson: geo-law-sines
  type: order
  topic: Ambiguous case
  stem: 'Put the steps for finding $\angle B$ in an SSA problem in order.'
  items:
    - 'Compute $\sin B = \tfrac{b\sin A}{a}$ (no triangle if it exceeds 1)'
    - 'Find $B_1 = \sin^{-1}(\sin B)$ on the calculator'
    - 'Find the supplement $B_2 = 180^\circ - B_1$'
    - 'Keep $B_2$ only if $A + B_2 < 180^\circ$'
  explanation: |-
    The calculator gives only the acute angle $B_1$. The supplement has the same sine, so it must be tested too, and it is a real triangle only if it leaves room for a positive third angle.
- id: geo-m6-r2-q30
  lesson: geo-law-sines
  type: text
  topic: Law of Sines
  stem: 'Give the exact value: $\sin 150^\circ =$ ___.'
  accept: ['1/2']
  explanation: |-
    $\sin 150^\circ = \sin(180^\circ - 150^\circ) = \sin 30^\circ = \tfrac12$. An angle and its supplement have the same sine.

# ---------- Lesson 26: Law of Cosines ----------
- id: geo-m6-r2-q31
  lesson: geo-law-cosines
  type: text
  topic: Law of Cosines
  stem: 'In $\triangle ABC$, $b = 3$, $c = 5$ and $m\angle A = 120^\circ$. Then $a =$ ___.'
  accept: ['7']
  explanation: |-
    $a^2 = 3^2 + 5^2 - 2(3)(5)\cos 120^\circ = 9 + 25 - 30(-0.5) = 34 + 15 = 49$, so $a = 7$. (Dropping the sign of the cosine gives $a^2 = 19$.)
- id: geo-m6-r2-q32
  lesson: geo-law-cosines
  type: match
  module_quiz: true
  topic: Solving triangles
  stem: 'Match each case to the best first step for solving the triangle.'
  pairs:
    - [ASA, Angle sum for the third angle]
    - [SAS, Law of Cosines for the third side]
    - [SSS, Law of Cosines for the largest angle]
    - [SSA, Law of Sines for a second angle]
  distractors: [Pythagorean theorem for the hypotenuse]
  explanation: |-
    ASA has two angles, so the angle sum gives the third and the Law of Sines does the rest. SAS and SSS have no side–angle pair, so they start with the Law of Cosines (for SSS, settle the largest angle first). SSA starts with the Law of Sines and the ambiguous-case check. The Pythagorean theorem only applies to right triangles.
- id: geo-m6-r2-q33
  lesson: geo-law-cosines
  topic: Solving triangles
  stem: 'Which sets of information determine exactly one triangle? Select all that apply.'
  choices: ['Sides 5, 7 and 9', 'Sides 4 and 6 with a $50^\circ$ angle between them', 'Angles $40^\circ$, $60^\circ$ and $80^\circ$', 'Sides 3, 4 and 8']
  answer: [0, 1]
  explanation: |-
    SSS with lengths that satisfy the triangle inequality ($5 + 7 > 9$) fixes one triangle, and so does SAS. Three angles fix only the shape: there are infinitely many similar triangles. Sides 3, 4 and 8 fail the triangle inequality ($3 + 4 < 8$), so no triangle exists.
- id: geo-m6-r2-q34
  lesson: geo-law-cosines
  type: order
  topic: Solving triangles
  stem: 'Put the steps for solving a triangle from its three sides in order.'
  items:
    - 'Check the triangle inequality'
    - 'Find the largest angle with the Law of Cosines'
    - 'Find a second angle with either law'
    - 'Find the last angle from the $180^\circ$ angle sum'
  explanation: |-
    First make sure a triangle exists. Settling the largest angle (the only one that can be obtuse) with the Law of Cosines means the other angles are acute, so either law gives them safely. The last angle comes from subtraction.
- id: geo-m6-r2-q35
  lesson: geo-law-cosines
  type: text
  topic: Law of Cosines
  stem: 'A triangle has sides $a = 5$, $b = 8$ and $c = 7$. Then $m\angle C =$ ___ degrees. (Give only the number.)'
  accept: ['60']
  explanation: |-
    $\cos C = \dfrac{a^2 + b^2 - c^2}{2ab} = \dfrac{25 + 64 - 49}{80} = \dfrac{40}{80} = \tfrac12$, so $m\angle C = 60^\circ$.

# ---------- Honors: Pythagorean triples and more proofs ----------
- id: geo-m6-r2-h01
  lesson: geo-m6-h-triples
  topic: Proofs of the Pythagorean theorem
  stem: 'Garfield''s proof counts the area of a trapezoid with parallel sides $a$ and $b$ and height $a + b$ in two ways. Which equation does it set up?'
  choices: ['$\tfrac12(a + b)^2 = ab + c^2$', '$\tfrac12(a + b)c = ab + \tfrac12 c^2$', '$\tfrac12(a + b)^2 = ab + \tfrac12 c^2$', '$(a + b)^2 = ab + c^2$']
  answer: 2
  explanation: |-
    Trapezoid area $= \tfrac12(\text{sum of parallel sides})(\text{height}) = \tfrac12(a + b)(a + b)$. The pieces are two triangles of area $\tfrac12 ab$ (total $ab$) and one right triangle with legs $c$ and $c$ (area $\tfrac12 c^2$). Doubling gives $a^2 + 2ab + b^2 = 2ab + c^2$, so $a^2 + b^2 = c^2$. The other choices use the wrong height or forget a factor of $\tfrac12$.
- id: geo-m6-r2-h02
  lesson: geo-m6-h-triples
  topic: Proofs of the Pythagorean theorem
  stem: 'In Garfield''s trapezoid, why is the angle of the middle triangle (where the two copies meet) a right angle?'
  choices: ['The trapezoid''s parallel sides are perpendicular to its base', 'Its legs are both hypotenuses, and hypotenuses always meet at right angles', 'The middle triangle is isosceles, so its angles must be $45^\circ$, $45^\circ$ and $90^\circ$', 'The two angles beside it are the two acute angles of the right triangle, which add to $90^\circ$, and all three fill a straight angle']
  answer: 3
  explanation: |-
    Along the bottom edge, three angles meet to make $180^\circ$: one acute angle from each copy and the middle one. The two acute angles are complementary (the two acute angles of one right triangle), so the middle angle is $180^\circ - 90^\circ = 90^\circ$. Being isosceles alone doesn't force a right angle, and the parallel sides being perpendicular to the base doesn't involve that angle.
- id: geo-m6-r2-h03
  lesson: geo-m6-h-triples
  topic: Proofs of the Pythagorean theorem
  stem: 'Semicircles are drawn on the sides of a right triangle with legs 5 and 12, each with a side as its diameter. What is the area of the semicircle on the hypotenuse?'
  choices: ['$\tfrac{169\pi}{8}$', '$\tfrac{169\pi}{2}$', '$\tfrac{289\pi}{8}$', '$\tfrac{169\pi}{4}$']
  answer: 0
  explanation: |-
    The hypotenuse is 13. A semicircle with diameter $s$ has area $\tfrac12\pi\left(\tfrac{s}{2}\right)^2 = \tfrac{\pi}{8}s^2$, so the area is $\tfrac{169\pi}{8}$. Check: $\tfrac{25\pi}{8} + \tfrac{144\pi}{8} = \tfrac{169\pi}{8}$. ($\tfrac{169\pi}{2}$ uses 13 as the radius; $\tfrac{289\pi}{8}$ uses $5 + 12 = 17$.)
- id: geo-m6-r2-h04
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'Which of these are primitive Pythagorean triples? Select all that apply.'
  choices: ['8, 15, 17', '12, 16, 20', '20, 21, 29', '15, 36, 39', '11, 60, 61']
  answer: [0, 2, 4]
  explanation: |-
    $64 + 225 = 289$, $400 + 441 = 841$ and $121 + 3600 = 3721 = 61^2$, and none of these triples has a common factor. 12-16-20 is $4 \times$ (3-4-5) and 15-36-39 is $3 \times$ (5-12-13): triples, but not primitive.
- id: geo-m6-r2-h05
  lesson: geo-m6-h-triples
  type: text
  topic: Pythagorean triples
  stem: 'Euclid''s formula with $m = 6$ and $n = 1$ gives $a = m^2 - n^2 =$ ___, $b = 2mn =$ ___ and $c = m^2 + n^2 =$ ___.'
  accept:
    - ['35']
    - ['12']
    - ['37']
  explanation: |-
    $a = 36 - 1 = 35$, $b = 2(6)(1) = 12$, $c = 36 + 1 = 37$. Check: $1225 + 144 = 1369 = 37^2$. Since 6 and 1 share no factor and have opposite parity, 35-12-37 is primitive.
- id: geo-m6-r2-h06
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'Which pair $(m, n)$ in Euclid''s formula gives a triple that is NOT primitive?'
  choices: ['$(4, 1)$', '$(5, 2)$', '$(6, 5)$', '$(5, 3)$']
  answer: 3
  explanation: |-
    Both 5 and 3 are odd, so all three numbers come out even: $(5, 3)$ gives 16-30-34, which is $2 \times$ (8-15-17). The other pairs share no factor and have one even and one odd number: they give 15-8-17, 21-20-29 and 11-60-61, all primitive.
- id: geo-m6-r2-h07
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'Why can''t both legs of a Pythagorean triple be odd?'
  choices: ['Odd numbers can''t be the sides of a right triangle', 'The sum of two odd numbers is even, and a hypotenuse must be odd', 'The sum of two odd squares leaves remainder 2 when divided by 4, and no perfect square does', 'Euclid''s formula always makes $b = 2mn$ even']
  answer: 2
  explanation: |-
    An odd square is 1 more than a multiple of 4, so the sum of two is 2 more than a multiple of 4. But every square is either a multiple of 4 or 1 more than one, so $c^2$ can't equal that sum. The third choice talks about $a + b$, not $a^2 + b^2$, and the fourth assumes the formula already covers every triple, which is what needs proving.
- id: geo-m6-r2-h08
  lesson: geo-m6-h-triples
  type: order
  topic: Pythagorean triples
  stem: 'Put the steps of the proof that every primitive triple (with even leg $b$) comes from Euclid''s formula in order.'
  items:
    - 'Write $b^2 = c^2 - a^2 = (c - a)(c + a)$'
    - 'Divide by 4: $\left(\tfrac{b}{2}\right)^2 = \tfrac{c + a}{2} \cdot \tfrac{c - a}{2}$'
    - 'Show $\tfrac{c + a}{2}$ and $\tfrac{c - a}{2}$ have no common factor'
    - 'Conclude that each is a perfect square, $m^2$ and $n^2$'
    - 'Read off $c = m^2 + n^2$, $a = m^2 - n^2$ and $b = 2mn$'
  explanation: |-
    Factoring a difference of squares comes first; both factors are even, so dividing by 4 leaves whole numbers. Once the two whole numbers are known to share no factor, the fact that their product is a perfect square forces each to be a square. Adding and subtracting $m^2$ and $n^2$ then gives $c$ and $a$.
- id: geo-m6-r2-h09
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'Which pair $(m, n)$ produces the primitive triple 9, 40, 41 in Euclid''s formula?'
  choices: ['$(20, 1)$', '$(5, 4)$', '$(10, 2)$', '$(6, 5)$']
  answer: 1
  explanation: |-
    The even leg is $40 = 2mn$, so $mn = 20$, and $m^2 + n^2 = 41$. The pair $(5, 4)$ works: $25 + 16 = 41$ and $25 - 16 = 9$. $(20, 1)$ gives $c = 401$, $(10, 2)$ gives $c = 104$, and $(6, 5)$ gives 11-60-61.
- id: geo-m6-r2-h10
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'The triple 5, 12, 13 gives which rational point on the circle $x^2 + y^2 = 1$?'
  choices: ['$\left(\tfrac{5}{12}, \tfrac{12}{13}\right)$', '$(5, 12)$', '$\left(\tfrac{25}{169}, \tfrac{144}{169}\right)$', '$\left(\tfrac{5}{13}, \tfrac{12}{13}\right)$']
  answer: 3
  explanation: |-
    Divide by $c$: $\left(\tfrac{5}{13}\right)^2 + \left(\tfrac{12}{13}\right)^2 = \tfrac{25 + 144}{169} = 1$. The point $\left(\tfrac{25}{169}, \tfrac{144}{169}\right)$ divides the squares instead, and its coordinates add (not their squares) to 1.
- id: geo-m6-r2-h11
  lesson: geo-m6-h-triples
  type: match
  topic: Pythagorean triples
  stem: 'Match each pair $(m, n)$ to the triple Euclid''s formula $\left(m^2 - n^2,\ 2mn,\ m^2 + n^2\right)$ gives.'
  pairs:
    - ['$(2, 1)$', '3, 4, 5']
    - ['$(3, 2)$', '5, 12, 13']
    - ['$(4, 1)$', '15, 8, 17']
    - ['$(4, 3)$', '7, 24, 25']
  distractors: ['6, 8, 10']
  explanation: |-
    $(2, 1)$: $4 - 1$, $4$, $4 + 1$. $(3, 2)$: $9 - 4$, $12$, $13$. $(4, 1)$: $16 - 1$, $8$, $17$. $(4, 3)$: $16 - 9$, $24$, $25$. 6-8-10 is not primitive, and no pair with opposite parity and no common factor gives it.
- id: geo-m6-r2-h12
  lesson: geo-m6-h-triples
  topic: Pythagorean triples
  stem: 'Which statement about the history of the Pythagorean theorem is best supported by the evidence?'
  choices: ['Pythagoras''s own written proof survives and is the oldest known', 'The relationship was unknown before the Greeks', 'A Babylonian tablet from roughly 1800 BCE lists numbers from Pythagorean triples, long before Pythagoras', 'Euclid discovered the theorem around 300 BCE']
  answer: 2
  explanation: |-
    Plimpton 322, an Old Babylonian clay tablet usually dated to about 1800 BCE, lists numbers such as 119 and 169 from the triple 119-120-169, though its exact purpose is debated. No writings of Pythagoras survive, and Euclid recorded proofs of a result that was already old.
- id: geo-m6-r2-h13
  lesson: geo-m6-h-triples
  topic: Proofs of the Pythagorean theorem
  stem: 'Figures are drawn on the three sides of a right triangle, with corresponding edges along the sides. For which families is the area on the hypotenuse always the sum of the areas on the legs? Select all that apply.'
  choices: ['Semicircles with the sides as diameters', 'Equilateral triangles with the sides as bases', 'Squares on the legs and an equilateral triangle on the hypotenuse', 'Regular hexagons with the sides as edges']
  answer: [0, 1, 3]
  explanation: |-
    The generalized theorem needs three similar figures. All semicircles are similar, and so are all equilateral triangles and all regular hexagons; each family has area $K s^2$ for one constant $K$, so $Ka^2 + Kb^2 = Kc^2$. Squares and an equilateral triangle are not similar, so their constants differ and the areas don't add up.
- id: geo-m6-r2-h14
  lesson: geo-m6-h-triples
  type: text
  topic: Pythagorean triples
  stem: 'The only primitive Pythagorean triple with hypotenuse 25 has legs 7 and ___.'
  accept: ['24']
  explanation: |-
    $25 = 16 + 9 = 4^2 + 3^2$, so $(m, n) = (4, 3)$ and the legs are $16 - 9 = 7$ and $2 \cdot 4 \cdot 3 = 24$. Check: $49 + 576 = 625$. The other triple with hypotenuse 25, 15-20-25, is $5 \times$ (3-4-5).

# ---------- Honors: triangulation and bearings ----------
- id: geo-m6-r2-h15
  lesson: geo-m6-h-triangulation
  topic: Triangulation
  stem: 'From $P$ the angle of elevation of a peak $T$ is $\alpha$; from $Q$, closer on the same straight line, it is $\beta$. What is the angle at $T$ in $\triangle PQT$?'
  choices: ['$180^\circ - \beta$', '$\alpha + \beta$', '$\beta - \alpha$', '$90^\circ - \alpha$']
  answer: 2
  explanation: |-
    $\beta$ is an exterior angle of $\triangle PQT$ at $Q$, so it equals the sum of the two remote interior angles: $\beta = \alpha + \angle T$. Hence $\angle T = \beta - \alpha$. $180^\circ - \beta$ is the triangle's angle at $Q$.
- id: geo-m6-r2-h16
  lesson: geo-m6-h-triangulation
  topic: Triangulation
  stem: 'The angle of elevation of a tower top is $30^\circ$ from point $P$ and $45^\circ$ from point $Q$, 100 m closer on level ground. About how tall is the tower?'
  choices: ['86.60 m', '136.60 m', '236.60 m', '50.00 m']
  answer: 1
  explanation: |-
    $h = \dfrac{d\sin\alpha\sin\beta}{\sin(\beta - \alpha)} = \dfrac{100\sin 30^\circ\sin 45^\circ}{\sin 15^\circ} \approx \dfrac{100(0.5)(0.7071)}{0.2588} \approx 136.60$ m (exactly $50(\sqrt3 + 1)$). 236.60 m is the distance from $P$ to the foot of the tower, $h/\tan 30^\circ$.
- id: geo-m6-r2-h17
  lesson: geo-m6-h-triangulation
  type: text
  topic: Bearings
  stem: 'As a three-digit bearing, due west is ___ degrees. (Give only the number.)'
  accept: ['270']
  explanation: |-
    Bearings go clockwise from north: north $000^\circ$, east $090^\circ$, south $180^\circ$, west $270^\circ$.
- id: geo-m6-r2-h18
  lesson: geo-m6-h-triangulation
  type: text
  topic: Bearings
  stem: 'Point $B$ is on a bearing of $065^\circ$ from point $A$. The bearing of $A$ from $B$ is ___ degrees. (Give only the number.)'
  accept: ['245']
  explanation: |-
    The back bearing differs by $180^\circ$: $065^\circ + 180^\circ = 245^\circ$.
- id: geo-m6-r2-h19
  lesson: geo-m6-h-triangulation
  topic: Bearings
  stem: 'A boat sails 30 km on a bearing of $090^\circ$, then 40 km on a bearing of $180^\circ$. How far is it from its starting point?'
  choices: ['70 km', '10 km', '50 km', '35 km']
  answer: 2
  explanation: |-
    It goes 30 km east, then 40 km south. Those directions are perpendicular, so the distance is $\sqrt{30^2 + 40^2} = 50$ km. 70 km adds the legs; 10 km subtracts them.
- id: geo-m6-r2-h20
  lesson: geo-m6-h-triangulation
  topic: Bearings
  stem: 'For the boat in the last question (30 km on $090^\circ$, then 40 km on $180^\circ$), what is the bearing of its final position from the start, to the nearest tenth of a degree?'
  choices: ['$036.9^\circ$', '$143.1^\circ$', '$126.9^\circ$', '$323.1^\circ$']
  answer: 1
  explanation: |-
    The final position is 30 km east and 40 km south. Measured from south toward east, the angle is $\tan^{-1}\tfrac{30}{40} \approx 36.87^\circ$, so the bearing is $180^\circ - 36.87^\circ \approx 143.1^\circ$. $323.1^\circ$ is the back bearing (the way home), and $126.9^\circ$ comes from swapping the legs.
- id: geo-m6-r2-h21
  lesson: geo-m6-h-triangulation
  topic: Triangulation
  stem: 'Which statements describe the method of triangulation? Select all that apply.'
  choices: ['One length, the baseline, is measured directly', 'Other distances are computed from measured angles with the Law of Sines', 'Long, thin triangles give the most accurate results', 'Each solved triangle supplies a known side for the next one']
  answer: [0, 1, 3]
  explanation: |-
    Triangulation measures one baseline carefully and otherwise only angles, solving triangle after triangle, each sharing a side with the one before. Thin triangles are avoided because a small angle where sight lines cross magnifies measurement errors.
- id: geo-m6-r2-h22
  lesson: geo-m6-h-triangulation
  type: order
  topic: Triangulation
  stem: 'Put the steps for locating a new landmark from a known baseline in order.'
  items:
    - 'Measure the baseline length carefully'
    - 'Measure the angles at both ends of the baseline to the landmark'
    - 'Find the third angle from the $180^\circ$ sum'
    - 'Use the Law of Sines to find the two new sides'
  explanation: |-
    The Law of Sines needs each side's opposite angle, so the third angle (opposite the baseline) must be found before the new sides can be computed.
- id: geo-m6-r2-h23
  lesson: geo-m6-h-triangulation
  type: match
  topic: Bearings
  stem: 'Match each bearing to the direction it describes.'
  pairs:
    - ['$045^\circ$', Northeast]
    - ['$135^\circ$', Southeast]
    - ['$225^\circ$', Southwest]
    - ['$315^\circ$', Northwest]
  distractors: [Due east]
  explanation: |-
    Counting clockwise from north: halfway to east ($045^\circ$) is northeast, halfway from east to south ($135^\circ$) is southeast, then southwest ($225^\circ$) and northwest ($315^\circ$). Due east is $090^\circ$.
- id: geo-m6-r2-h24
  lesson: geo-m6-h-triangulation
  topic: Triangulation
  stem: 'In the two-sighting method for a height, why does a $1^\circ$ error in $\alpha$ matter much more when $\beta - \alpha$ is small?'
  choices: ['Because $\sin(\beta - \alpha)$ is in the denominator, so a small change to a small angle changes $h$ a lot', 'Because the tangent of a small angle is always negative', 'Because the baseline $d$ grows when the angles get closer', 'Because the Law of Sines does not work for angles under $10^\circ$']
  answer: 0
  explanation: |-
    $h = \dfrac{d\sin\alpha\sin\beta}{\sin(\beta - \alpha)}$. When $\beta - \alpha$ is small, the two sight lines are nearly parallel and cross at a shallow angle; changing either one slightly moves the crossing point far. In the lesson, changing $\alpha$ from $20^\circ$ to $21^\circ$ raised $h$ by about 14%.
- id: geo-m6-r2-h25
  lesson: geo-m6-h-triangulation
  topic: Triangulation
  stem: 'A baseline $AB$ is 400 m. A landmark $C$ is sighted with $m\angle CAB = 50^\circ$ and $m\angle CBA = 60^\circ$. About how far is $C$ from $A$?'
  choices: ['326.1 m', '425.7 m', '368.6 m', '400.0 m']
  answer: 2
  explanation: |-
    $m\angle C = 180^\circ - 50^\circ - 60^\circ = 70^\circ$, opposite the baseline. $AC$ is opposite the $60^\circ$ angle: $AC = \dfrac{400\sin 60^\circ}{\sin 70^\circ} \approx \dfrac{400(0.8660)}{0.9397} \approx 368.6$ m. 326.1 m is $BC$ (opposite $50^\circ$).
- id: geo-m6-r2-h26
  lesson: geo-m6-h-triangulation
  type: label
  topic: Triangulation
  stem: 'The picture shows the two-sighting method for the height of a mountain. Name the numbered parts.'
  image: {src: images/geo-m6-two-angles-blank.svg, alt: 'A mountain on level ground with a dashed vertical line from its peak to the ground. Two points on the ground to the left are joined to the peak by straight lines. Small angles are shaded at both ground points and at the peak, between the two lines.'}
  labels:
    - {x: 17.1, y: 79.2, text: Angle of elevation from the farther point}
    - {x: 46.3, y: 78.6, text: Angle of elevation from the nearer point}
    - {x: 78.0, y: 34.8, text: Angle between the sight lines at the peak}
    - {x: 25.0, y: 81.8, text: Measured distance between the two points}
    - {x: 84.2, y: 55.4, text: Unknown height}
  distractors: [Angle of depression, Bearing]
  explanation: |-
    1 is $\alpha$ and 2 is $\beta$, the two angles of elevation (the nearer point sees the peak at the larger angle). 3 is the angle $\beta - \alpha$ at the peak. 4 is the measured distance $d$ between the observation points, and 5 is the height $h$, found from $h = \tfrac{d\sin\alpha\sin\beta}{\sin(\beta - \alpha)}$.
- id: geo-m6-r2-h27
  lesson: geo-m6-h-triangulation
  topic: Bearings
  stem: 'A hiker walks 20 km on a bearing of $030^\circ$. With east as $x$ and north as $y$, where does she end up (to two decimals)?'
  choices: ['$(17.32, 10)$', '$(10, -17.32)$', '$(-10, 17.32)$', '$(10, 17.32)$']
  answer: 3
  explanation: |-
    Bearings start from north, so east $= 20\sin 30^\circ = 10$ and north $= 20\cos 30^\circ \approx 17.32$. $(17.32, 10)$ comes from measuring $30^\circ$ from the east axis, as in ordinary coordinates.
- id: geo-m6-r2-h28
  lesson: geo-m6-h-triangulation
  type: text
  topic: Bearings
  stem: 'A ship sails from $A$ to $B$ on a bearing of $040^\circ$, then turns and sails from $B$ to $C$ on a bearing of $120^\circ$. The angle $\angle ABC$ is ___ degrees. (Give only the number.)'
  accept: ['100']
  explanation: |-
    At $B$, the direction back to $A$ is the back bearing $040^\circ + 180^\circ = 220^\circ$, and the direction to $C$ is $120^\circ$. The angle between them is $220^\circ - 120^\circ = 100^\circ$.

# ---------- Honors: the golden ratio ----------
- id: geo-m6-r2-h29
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'A rectangle with long side $x$ and short side 1 leaves a similar rectangle when a $1 \times 1$ square is cut off. What is $x$?'
  choices: ['$\tfrac{1 + \sqrt5}{2}$', '$\tfrac{\sqrt5 - 1}{2}$', '$\sqrt2$', '$\tfrac{1 + \sqrt3}{2}$']
  answer: 0
  explanation: |-
    The leftover rectangle is $1$ by $x - 1$, so similarity needs $\tfrac{x}{1} = \tfrac{1}{x - 1}$, which gives $x^2 - x - 1 = 0$ and $x = \tfrac{1 + \sqrt5}{2} \approx 1.618$. $\tfrac{\sqrt5 - 1}{2} \approx 0.618$ is its reciprocal. ($\sqrt2$ is the ratio for paper that stays similar when cut in half.)
- id: geo-m6-r2-h30
  lesson: geo-m6-h-golden
  type: text
  topic: Golden ratio
  stem: 'To three decimal places, $\tfrac{1}{\varphi} \approx$ ___.'
  accept: ['0.618']
  explanation: |-
    From $\varphi^2 = \varphi + 1$, dividing by $\varphi$ gives $\tfrac{1}{\varphi} = \varphi - 1 \approx 1.618 - 1 = 0.618$.
- id: geo-m6-r2-h31
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'A golden rectangle has a short side of 8 cm. About how long is its long side?'
  choices: ['4.94 cm', '20.94 cm', '13.00 cm', '12.94 cm']
  answer: 3
  explanation: |-
    Long side $= 8\varphi \approx 8(1.618) \approx 12.94$ cm. 4.94 cm divides by $\varphi$ instead, and 20.94 cm multiplies by $\varphi^2$.
- id: geo-m6-r2-h32
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'Which expressions are equal to $\varphi^2$? Select all that apply.'
  choices: ['$\varphi + 1$', '$\tfrac{3 + \sqrt5}{2}$', '$2\varphi$', '$\tfrac{1}{\varphi} + 2$']
  answer: [0, 1, 3]
  explanation: |-
    $\varphi^2 = \varphi + 1 = \tfrac{1 + \sqrt5}{2} + 1 = \tfrac{3 + \sqrt5}{2} \approx 2.618$. Since $\varphi = \tfrac{1}{\varphi} + 1$, also $\varphi + 1 = \tfrac{1}{\varphi} + 2$. But $2\varphi \approx 3.236$.
- id: geo-m6-r2-h33
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'A regular pentagon has sides of 6 cm. About how long is each diagonal?'
  choices: ['9.71 cm', '3.71 cm', '10.39 cm', '8.49 cm']
  answer: 0
  explanation: |-
    Diagonal $= \varphi \cdot \text{side} \approx 1.618 \cdot 6 \approx 9.71$ cm. 3.71 cm divides by $\varphi$; 10.39 cm is $6\sqrt3$ and 8.49 cm is $6\sqrt2$, ratios from the wrong triangles.
- id: geo-m6-r2-h34
  lesson: geo-m6-h-golden
  type: match
  topic: Golden ratio
  stem: 'Match each triangle, given by its angles, to its name or origin.'
  pairs:
    - ['36°, 72°, 72°', Golden triangle]
    - ['36°, 36°, 108°', Golden gnomon]
    - ['30°, 60°, 90°', Half of an equilateral triangle]
    - ['45°, 45°, 90°', Half of a square]
  distractors: [Golden rectangle]
  explanation: |-
    The golden triangle (legs $\varphi$ times the base) has a $36^\circ$ apex; cutting it with a base-angle bisector leaves a golden gnomon with angles $36^\circ$, $36^\circ$, $108^\circ$. The 30-60-90 and 45-45-90 triangles come from Lesson 23. A golden rectangle is not a triangle.
- id: geo-m6-r2-h35
  lesson: geo-m6-h-golden
  type: order
  topic: Golden ratio
  stem: 'Golden triangle $ABC$ has apex $\angle A = 36^\circ$, legs $AB = AC = 1$ and base $BC = b$. Put the steps for finding $b$ in order.'
  items:
    - 'Bisect $\angle B$, meeting $\overline{AC}$ at $D$'
    - 'Note $\triangle BCD$ has angles $36^\circ$, $72^\circ$, $72^\circ$, so $\triangle BCD \sim \triangle ABC$ and $BD = BC = b$'
    - 'Note $\triangle ABD$ is isosceles, so $AD = BD = b$ and $DC = 1 - b$'
    - 'Use the similarity: $\tfrac{1 - b}{b} = \tfrac{b}{1}$'
    - 'Solve $b^2 + b - 1 = 0$ to get $b = \tfrac{\sqrt5 - 1}{2}$'
  explanation: |-
    The bisector creates the smaller similar triangle, which gives $BD = b$; then $\triangle ABD$ (two $36^\circ$ angles) gives $AD = b$, so $DC = 1 - b$. Only then can the similarity ratio be written and solved: $b = \tfrac{1}{\varphi} \approx 0.618$.
- id: geo-m6-r2-h36
  lesson: geo-m6-h-golden
  type: text
  topic: Golden ratio
  stem: 'To three decimal places, $\cos 72^\circ = \tfrac{\sqrt5 - 1}{4} \approx$ ___.'
  accept: ['0.309']
  explanation: |-
    $\sqrt5 \approx 2.2361$, so $\tfrac{\sqrt5 - 1}{4} \approx \tfrac{1.2361}{4} \approx 0.309$. A calculator in degree mode agrees: $\cos 72^\circ \approx 0.3090$.
- id: geo-m6-r2-h37
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'In a regular pentagon $ABCDE$, why does each of the three angles at $A$ formed by the diagonals $\overline{AC}$ and $\overline{AD}$ measure $36^\circ$?'
  choices: ['Because $360^\circ \div 10 = 36^\circ$', 'Because the diagonals of a regular polygon always bisect its angles', 'Because triangles $ABC$ and $AED$ are isosceles with $108^\circ$ apexes, so their base angles at $A$ are $36^\circ$, leaving $108^\circ - 72^\circ = 36^\circ$ in the middle', 'Because the pentagon''s exterior angle is $36^\circ$']
  answer: 2
  explanation: |-
    The interior angle is $108^\circ$. $\triangle ABC$ has $AB = BC$ and apex $108^\circ$, so its base angles are $\tfrac{180^\circ - 108^\circ}{2} = 36^\circ$; the same holds in $\triangle AED$. The middle angle is $108^\circ - 36^\circ - 36^\circ = 36^\circ$. The exterior angle of a regular pentagon is $72^\circ$, not $36^\circ$.
- id: geo-m6-r2-h38
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'The Fibonacci numbers continue …, 34, 55, 89. What is $\tfrac{89}{55}$ to four decimals, and what does it approach?'
  choices: ['1.6182, approaching $\varphi$', '1.6182, approaching $\sqrt{2.5}$', '0.6180, approaching $\tfrac{1}{\varphi}$', '1.6000, approaching 1.6']
  answer: 0
  explanation: |-
    $\tfrac{89}{55} \approx 1.61818$. Ratios of consecutive Fibonacci numbers ($\tfrac{F_{n+1}}{F_n}$) approach $\varphi \approx 1.61803$. (The reciprocals $\tfrac{55}{89}$ approach $\tfrac{1}{\varphi}$.)
- id: geo-m6-r2-h39
  lesson: geo-m6-h-golden
  topic: Golden ratio
  stem: 'Which claims about the golden ratio are mathematically proved or well supported by evidence? Select all that apply.'
  choices: ['The ratio of a regular pentagon''s diagonal to its side is $\varphi$', 'Ratios of consecutive Fibonacci numbers approach $\varphi$', 'The Parthenon''s builders designed it using $\varphi$', 'Nautilus shells grow in exact golden spirals']
  answer: [0, 1]
  explanation: |-
    The pentagon fact follows from the golden triangle, and the Fibonacci limit is a theorem. There is no surviving evidence that the Parthenon was designed with $\varphi$, and measurements of real nautilus shells generally do not match the golden spiral.
