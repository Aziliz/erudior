# Round 2, module geo-m6: new question types for the core lessons (q) and the honors lessons (h)

# ---------- Lesson 20: similar polygons ----------
- id: geo-m6-r2-q01
  lesson: geo-similar
  type: text
  topic: Similar polygons
  stem: 'Two similar triangles have areas 18 and 50. The scale factor from the smaller to the larger is ___. (A fraction or a decimal is fine.)'
  accept: ['5/3', '1.67', '1.667', '1 2/3']
  explanation: |-
    The area ratio is $\tfrac{50}{18} = \tfrac{25}{9}$, and the area ratio is $k^2$. So $k = \sqrt{\tfrac{25}{9}} = \tfrac53 \approx 1.67$. (Answering $\tfrac{25}{9}$ forgets to take the square root.)
- id: geo-m6-r2-q02
  lesson: geo-similar
  type: match
  module_quiz: true
  topic: Similar polygons
  stem: 'Two similar prisms have scale factor 4 (large to small). Match each measure of the large prism to how it compares with the small one.'
  pairs:
    - [Perimeter of a face, Multiplied by 4]
    - [Length of a diagonal, Multiplied by 4]
    - [Surface area, Multiplied by 16]
    - [Volume, Multiplied by 64]
  distractors: [Multiplied by 8]
  explanation: |-
    Every length (perimeters and diagonals included) scales by $k = 4$, areas by $k^2 = 16$ and volumes by $k^3 = 64$. Multiplying by 8 would be $2k$, which matches nothing.
- id: geo-m6-r2-q03
  lesson: geo-similar
  topic: Similar polygons
  stem: 'Which pairs of figures must be similar? Select all that apply.'
  choices: [Any two squares, Any two equilateral triangles, Any two rectangles, Any two isosceles right triangles, Any two rhombuses]
  answer: [0, 1, 3]
  explanation: |-
    Squares all have right angles and four equal sides, so the side ratios are all equal. Equilateral triangles all have $60^\circ$ angles and equal sides. Isosceles right triangles all have angles $45^\circ$, $45^\circ$, $90^\circ$, so they are similar by AA. Rectangles can have different side ratios ($2 \times 3$ vs $2 \times 5$), and rhombuses can have different angles, so neither pair must be similar.
- id: geo-m6-r2-q04
  lesson: geo-similar
  type: order
  topic: Similar polygons
  stem: 'Two similar hexagons have perimeters 24 and 36, and the smaller has area 40. Put the steps for finding the larger area in order.'
  items:
    - 'Divide the perimeters to get the scale factor: $k = \tfrac{36}{24} = 1.5$'
    - 'Square it to get the area ratio: $k^2 = 2.25$'
    - 'Multiply the smaller area by $k^2$: $40 \cdot 2.25 = 90$'
  explanation: |-
    Perimeters are lengths, so their ratio is $k$. Areas scale by $k^2$, so square $k$ before multiplying. The larger hexagon's area is 90.
- id: geo-m6-r2-q05
  lesson: geo-similar
  type: text
  topic: Similar polygons
  stem: 'A cube is enlarged so that each edge is twice as long. Its volume is multiplied by ___.'
  accept: ['8']
  explanation: |-
    Volume scales by $k^3 = 2^3 = 8$. (Multiplying by 2 treats volume like a length; by 4 treats it like an area.)

# ---------- Lesson 21: similarity theorems ----------
- id: geo-m6-r2-q06
  lesson: geo-sim-thm
  type: label
  module_quiz: true
  topic: Proportional segments
  stem: 'A person and a tree stand in the sun at the same time. Name the numbered parts of the picture used to find the tree''s height.'
  image: {src: images/geo-m6-shadow-blank.svg, alt: 'A person and a taller tree stand on level ground with the sun at the upper left. Each casts a shadow to the right, and a dashed line runs from the top of each to the tip of its shadow. A dashed vertical measuring line is drawn beside the tree.'}
  labels:
    - {x: 40.6, y: 53.0, text: Tree height (unknown)}
    - {x: 78.7, y: 83.9, text: Tree's shadow}
    - {x: 21.6, y: 83.9, text: Person's shadow}
    - {x: 71.2, y: 49.8, text: Parallel ray of sunlight}
  distractors: [Angle of depression, Altitude to the hypotenuse]
  explanation: |-
    1 is the height being found, 2 the tree's long shadow, 3 the person's short shadow and 4 a sun ray from the treetop to the tip of its shadow. Because the sun's rays are parallel, both triangles have the same angle at the shadow tip and a right angle at the ground, so they are similar by AA, and $\tfrac{\text{height}}{\text{shadow}}$ is the same for both.
- id: geo-m6-r2-q07
  lesson: geo-sim-thm
  type: match
  module_quiz: true
  topic: Similarity tests
  stem: 'Match what is known about $\triangle ABC$ and $\triangle DEF$ to the conclusion it supports.'
  pairs:
    - ['$\angle A \cong \angle D$ and $\angle B \cong \angle E$', Similar by AA]
    - ['$\tfrac{AB}{DE} = \tfrac{BC}{EF} = \tfrac{AC}{DF}$', Similar by SSS similarity]
    - ['$\tfrac{AB}{DE} = \tfrac{AC}{DF}$ and $\angle A \cong \angle D$', Similar by SAS similarity]
    - ['$\tfrac{AB}{DE} = \tfrac{BC}{EF}$ and $\angle A \cong \angle D$', Not enough to prove similarity]
  distractors: [Similar by HL]
  explanation: |-
    Two angle pairs give AA. Three proportional side pairs give SSS similarity. $\angle A$ is between $\overline{AB}$ and $\overline{AC}$, so the third line is SAS similarity. In the last line $\angle A$ is not between $\overline{AB}$ and $\overline{BC}$ (the included angle is $\angle B$), which is the SSA pattern and proves nothing. HL is a congruence test for right triangles.
- id: geo-m6-r2-q08
  lesson: geo-sim-thm
  type: text
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$ with $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$. If $AD = 9$, $DB = 6$ and $AE = 12$, then $EC =$ ___.'
  accept: ['8']
  explanation: |-
    Side Splitter Theorem: $\tfrac{AD}{DB} = \tfrac{AE}{EC}$, so $\tfrac{9}{6} = \tfrac{12}{EC}$ and $9 \cdot EC = 72$, giving $EC = 8$.
- id: geo-m6-r2-q09
  lesson: geo-sim-thm
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $\overline{DE} \parallel \overline{BC}$ with $D$ on $\overline{AB}$ and $E$ on $\overline{AC}$. Which statements must be true? Select all that apply.'
  choices: ['$\triangle ADE \sim \triangle ABC$', '$\tfrac{AD}{DB} = \tfrac{AE}{EC}$', '$\tfrac{DE}{BC} = \tfrac{AD}{DB}$', '$\angle ADE \cong \angle ABC$']
  answer: [0, 1, 3]
  explanation: |-
    The parallel lines make $\angle ADE \cong \angle ABC$ (corresponding angles), and $\angle A$ is shared, so the triangles are similar by AA. The Side Splitter Theorem gives $\tfrac{AD}{DB} = \tfrac{AE}{EC}$. But $\tfrac{DE}{BC}$ compares a side of the small triangle with a side of the large one, so it equals $\tfrac{AD}{AB}$ (piece to whole), not $\tfrac{AD}{DB}$ (piece to piece).
- id: geo-m6-r2-q10
  lesson: geo-sim-thm
  type: order
  topic: Proportional segments
  stem: 'In $\triangle ABC$, $AB = 15$, $AC = 21$ and $BC = 24$, and the bisector of $\angle A$ meets $\overline{BC}$ at $D$. Put the steps for finding $BD$ in order.'
  items:
    - 'Write the Angle Bisector Theorem: $\tfrac{BD}{DC} = \tfrac{AB}{AC} = \tfrac{15}{21}$'
    - 'Simplify the ratio to $5 : 7$'
    - 'Add the parts: $5 + 7 = 12$'
    - 'Take that fraction of $BC$: $BD = \tfrac{5}{12} \cdot 24 = 10$'
  explanation: |-
    The bisector splits $BC$ in the ratio of the adjacent sides, $15 : 21 = 5 : 7$. Out of $12$ equal parts, $BD$ gets 5, so $BD = 10$ and $DC = 14$.

# ---------- Lesson 22: Pythagorean theorem ----------
- id: geo-m6-r2-q11
  lesson: geo-pythag
  type: label
  module_quiz: true
  topic: Pythagorean theorem
  stem: 'This is the picture behind the rearrangement proof: four copies of a right triangle with legs $a < b$ inside a large square. Name the numbered parts.'
  image: {src: images/geo-m6-rearrangement-blank.svg, alt: 'A large square with a tilted square inside it whose corners touch the four sides. The four corner regions are right triangles. Each side of the large square is split into a shorter piece and a longer piece.'}
  labels:
    - {x: 49.8, y: 49.7, text: 'Square with area c²'}
    - {x: 74.3, y: 80.6, text: 'Right triangle with area ab/2'}
    - {x: 29.3, y: 91.4, text: 'Shorter leg, a'}
    - {x: 65.1, y: 91.4, text: 'Longer leg, b'}
  distractors: ['Square with area a²', Altitude to the hypotenuse]
  explanation: |-
    The hypotenuses enclose the tilted square of side $c$ (1). Each corner piece is a right triangle with area $\tfrac12 ab$ (2). Each side of the big square is a shorter leg $a$ (3) plus a longer leg $b$ (4). Counting the big square's area two ways gives $(a + b)^2 = 4 \cdot \tfrac12 ab + c^2$, so $a^2 + b^2 = c^2$.
- id: geo-m6-r2-q12
  lesson: geo-pythag
  type: text
  topic: Pythagorean theorem
  stem: 'A right triangle has legs 20 and 21. Its hypotenuse is ___.'
  accept: ['29']
  explanation: |-
    $c = \sqrt{20^2 + 21^2} = \sqrt{400 + 441} = \sqrt{841} = 29$. (20-21-29 is a Pythagorean triple.)
- id: geo-m6-r2-q13
  lesson: geo-pythag
  type: order
  topic: Pythagorean theorem
  stem: 'A triangle has sides 7, 11 and 13. Put the steps for classifying it in order.'
  items:
    - 'Name the longest side $c = 13$'
    - 'Compute $c^2 = 169$ and $7^2 + 11^2 = 170$'
    - 'Compare: $169 < 170$, so the triangle is acute'
  explanation: |-
    The test always uses the longest side as $c$. Since $c^2$ is (just) less than the sum of the other two squares, the angle opposite 13 is a little less than $90^\circ$ and the triangle is acute.
- id: geo-m6-r2-q14
  lesson: geo-pythag
  topic: Pythagorean theorem
  stem: 'Which sets of side lengths form a right triangle? Select all that apply.'
  choices: ['9, 40, 41', '10, 24, 26', '6, 7, 10', '12, 16, 21']
  answer: [0, 1]
  explanation: |-
    $9^2 + 40^2 = 81 + 1600 = 1681 = 41^2$ and $10^2 + 24^2 = 676 = 26^2$ (twice 5-12-13). For 6, 7, 10: $36 + 49 = 85 \ne 100$. For 12, 16, 21: $144 + 256 = 400 \ne 441$ (12-16-20 would be right).
- id: geo-m6-r2-q15
  lesson: geo-pythag
  type: match
  topic: Pythagorean theorem
  stem: 'Match each set of side lengths to the kind of triangle it makes.'
  pairs:
    - ['5, 12, 13', Right]
    - ['4, 5, 6', Acute]
    - ['4, 5, 7', Obtuse]
    - ['2, 3, 6', No triangle]
  distractors: [Equilateral]
  explanation: |-
    $13^2 = 169 = 25 + 144$: right. $6^2 = 36 < 16 + 25 = 41$: acute. $7^2 = 49 > 41$: obtuse. $2 + 3 = 5 < 6$ fails the triangle inequality, so there is no triangle. None of the sets has three equal sides.

# ---------- Lesson 23: special right triangles ----------
- id: geo-m6-r2-q16
  lesson: geo-special-right
  type: label
  module_quiz: true
  topic: Special right triangles
  stem: 'On the left, a square with side $s$ is cut by a diagonal. On the right, an equilateral triangle with side $2s$ is cut by an altitude, and the left half is shaded. Name the numbered segments.'
  image: {src: images/geo-m6-special-halves-blank.svg, alt: 'Left: a square with one diagonal drawn and the lower triangle shaded. Right: an equilateral triangle with an altitude from the top vertex to the base, the left half shaded.'}
  labels:
    - {x: 65.2, y: 83.3, text: 'Short leg, s'}
    - {x: 74.2, y: 60.1, text: 'Long leg, s√3'}
    - {x: 65.2, y: 50.1, text: 'Hypotenuse, 2s'}
    - {x: 21.9, y: 53.3, text: 'Diagonal, s√2'}
  distractors: ['Long leg, s√2', 'Hypotenuse, s√3']
  explanation: |-
    The altitude bisects the base of side $2s$, so the short leg (1) is $s$. The hypotenuse (3) is a full side of the equilateral triangle, $2s$. The altitude (2) is the long leg, $\sqrt{(2s)^2 - s^2} = s\sqrt3$. The diagonal of the square (4) is $\sqrt{s^2 + s^2} = s\sqrt2$.
- id: geo-m6-r2-q17
  lesson: geo-special-right
  type: text
  topic: Special right triangles
  stem: 'A 30°-60°-90° triangle has a long leg of $7\sqrt3$. Its hypotenuse is ___.'
  accept: ['14']
  explanation: |-
    Find the short leg first: $\tfrac{7\sqrt3}{\sqrt3} = 7$. The hypotenuse is twice the short leg: $14$.
- id: geo-m6-r2-q18
  lesson: geo-special-right
  type: order
  topic: Special right triangles
  stem: 'Put the sides of a 30°-60°-90° triangle in order from shortest to longest.'
  items: ['The side opposite the 30° angle', 'The side opposite the 60° angle', 'The hypotenuse']
  explanation: |-
    The ratio is $1 : \sqrt3 : 2$ with $1 < \sqrt3 \approx 1.73 < 2$. The shortest side is opposite the smallest angle, and the hypotenuse (opposite $90^\circ$) is the longest.
- id: geo-m6-r2-q19
  lesson: geo-special-right
  topic: Special right triangles
  stem: 'A 30°-60°-90° triangle has a short leg of 4. Which statements are true? Select all that apply.'
  choices: ['The hypotenuse is 8.', 'The long leg is $4\sqrt3$.', 'The long leg is $4\sqrt2$.', 'The area is $8\sqrt3$.']
  answer: [0, 1, 3]
  explanation: |-
    Hypotenuse $= 2 \cdot 4 = 8$ and long leg $= 4\sqrt3$. The area is $\tfrac12 \cdot 4 \cdot 4\sqrt3 = 8\sqrt3$. $4\sqrt2$ would be the hypotenuse of a 45°-45°-90° triangle with legs 4.
- id: geo-m6-r2-q20
  lesson: geo-special-right
  type: match
  topic: Geometric mean
  stem: 'The altitude to the hypotenuse of a right triangle splits the hypotenuse into pieces 2 and 8. Match each length to its value.'
  pairs:
    - [The altitude, '4']
    - [The leg next to the piece of 2, '2√5']
    - [The leg next to the piece of 8, '4√5']
    - [The hypotenuse, '10']
  distractors: ['16', '√10']
  explanation: |-
    $h = \sqrt{2 \cdot 8} = 4$. The hypotenuse is $2 + 8 = 10$. Each leg is $\sqrt{c \cdot \text{adjacent piece}}$: $\sqrt{10 \cdot 2} = \sqrt{20} = 2\sqrt5$ and $\sqrt{10 \cdot 8} = \sqrt{80} = 4\sqrt5$. Check: $20 + 80 = 100 = 10^2$. (16 is $2 \cdot 8$ without the square root.)

