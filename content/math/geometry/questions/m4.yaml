# Module 4 — Triangles and congruence
- id: geo-q-1001
  lesson: geo-tri-angles
  module_quiz: true
  topic: Triangle angle sum
  stem: 'Two angles of a triangle measure $48^\circ$ and $67^\circ$. Find the third angle.'
  choices: ['$65^\circ$', '$115^\circ$', '$245^\circ$', '$75^\circ$']
  answer: 0
  explanation: |-
    The angles add to $180^\circ$: $180 - 48 - 67 = 65^\circ$. $115^\circ$ is the sum of the given two (that's the exterior angle at the third vertex).
- id: geo-q-1002
  lesson: geo-tri-angles
  topic: Triangle classification
  stem: 'A triangle has sides 7, 7 and 10. How is it classified by sides?'
  choices: ['Equilateral', 'Isosceles', 'Scalene', 'Right']
  answer: 1
  explanation: |-
    Two congruent sides make it isosceles. "Right" classifies by angles, and $7^2 + 7^2 = 98 \ne 100$ anyway.
- id: geo-q-1003
  lesson: geo-tri-angles
  topic: Triangle classification
  stem: 'A triangle''s angles measure $35^\circ$, $45^\circ$ and $100^\circ$. Classify it by angles.'
  choices: ['Acute', 'Right', 'Obtuse', 'Equiangular']
  answer: 2
  explanation: |-
    One angle ($100^\circ$) is obtuse, so the triangle is obtuse.
- id: geo-q-1004
  lesson: geo-tri-angles
  module_quiz: true
  topic: Triangle angle sum
  stem: 'An exterior angle of a triangle measures $128^\circ$. One remote interior angle is $57^\circ$. Find the other remote interior angle.'
  choices: ['$52^\circ$', '$123^\circ$', '$185^\circ$', '$71^\circ$']
  answer: 3
  explanation: |-
    Exterior angle $=$ sum of remote interior angles: $128 - 57 = 71^\circ$. $52^\circ$ is the interior angle adjacent to the exterior angle.
- id: geo-q-1005
  lesson: geo-tri-angles
  topic: Triangle angle sum
  stem: 'In $\triangle ABC$, $m\angle A = (3x)^\circ$, $m\angle B = (2x + 10)^\circ$, $m\angle C = (x + 20)^\circ$. Find $m\angle B$.'
  choices: ['$60^\circ$', '$75^\circ$', '$45^\circ$', '$25^\circ$']
  answer: 0
  explanation: |-
    $6x + 30 = 180$, so $x = 25$ and $m\angle B = 2(25) + 10 = 60^\circ$. ($\angle A = 75^\circ$, $\angle C = 45^\circ$.)
- id: geo-q-1006
  lesson: geo-tri-angles
  topic: Triangle angle sum
  stem: 'One acute angle of a right triangle is $5^\circ$ more than four times the other. Find the larger acute angle.'
  choices: ['$17^\circ$', '$73^\circ$', '$85^\circ$', '$68^\circ$']
  answer: 1
  explanation: |-
    The acute angles are complementary: $a + (4a + 5) = 90$, so $a = 17$ and the larger is $4(17) + 5 = 73^\circ$.
- id: geo-q-1007
  lesson: geo-tri-angles
  topic: Triangle angle sum
  stem: 'In the proof that a triangle''s angles add to $180^\circ$, a line is drawn through one vertex parallel to the opposite side. Which theorem then matches the angles?'
  choices: ['Vertical Angles Theorem', 'Consecutive Interior Angles Theorem', 'Alternate Interior Angles Theorem', 'Exterior Angle Theorem']
  answer: 2
  explanation: |-
    The two sides act as transversals of the parallel lines, and alternate interior angles are congruent, so the three angles at the vertex match the triangle's three angles and form a straight angle.
- id: geo-q-1008
  lesson: geo-tri-angles
  module_quiz: true
  topic: Triangle classification
  stem: 'Which triangle is impossible?'
  choices: ['An obtuse isosceles triangle', 'A right scalene triangle', 'An acute equilateral triangle', 'A triangle with two obtuse angles']
  answer: 3
  explanation: |-
    Two obtuse angles would sum to more than $180^\circ$, leaving nothing for the third. The other three exist (e.g. $30$-$30$-$120$, $3$-$4$-$5$, and any equilateral triangle).
- id: geo-q-1009
  lesson: geo-tri-angles
  module_quiz: true
  topic: Triangle angle sum
  stem: 'An exterior angle of a triangle is $(6x - 4)^\circ$; the remote interior angles are $(2x + 8)^\circ$ and $(3x + 1)^\circ$. Find the exterior angle.'
  choices: ['$74^\circ$', '$13^\circ$', '$106^\circ$', '$34^\circ$']
  answer: 0
  explanation: |-
    $6x - 4 = 5x + 9$ gives $x = 13$; the exterior angle is $6(13) - 4 = 74^\circ$ (remote angles $34^\circ$ and $40^\circ$). $106^\circ$ is the adjacent interior angle.
- id: geo-q-1010
  lesson: geo-tri-angles
  topic: Triangle classification
  stem: 'What does each angle of an equiangular triangle measure?'
  choices: ['$90^\circ$', '$60^\circ$', '$45^\circ$', '$180^\circ$']
  answer: 1
  explanation: |-
    Three equal angles summing to $180^\circ$ are each $60^\circ$.
- id: geo-q-1011
  lesson: geo-tri-angles
  topic: Triangle angle sum
  stem: 'The angles of a triangle are in the ratio $2 : 3 : 7$. What is the largest angle?'
  choices: ['$45^\circ$', '$90^\circ$', '$105^\circ$', '$84^\circ$']
  answer: 2
  explanation: |-
    $2k + 3k + 7k = 12k = 180$, so $k = 15$ and the largest is $7 \cdot 15 = 105^\circ$.

- id: geo-q-1101
  lesson: geo-congruent
  module_quiz: true
  topic: Congruent figures
  stem: '$\triangle RST \cong \triangle XYZ$. Which pair of parts must be congruent?'
  choices: ['$\angle S$ and $\angle Z$', '$\overline{RT}$ and $\overline{XY}$', '$\overline{ST}$ and $\overline{XZ}$', '$\overline{RS}$ and $\overline{XY}$']
  answer: 3
  explanation: |-
    The order gives $R \leftrightarrow X$, $S \leftrightarrow Y$, $T \leftrightarrow Z$. So $\overline{RS}$ (first two letters) matches $\overline{XY}$. $\angle S$ matches $\angle Y$, $\overline{RT}$ matches $\overline{XZ}$, $\overline{ST}$ matches $\overline{YZ}$.
- id: geo-q-1102
  lesson: geo-congruent
  topic: Congruent figures
  stem: '$\triangle ABC \cong \triangle DEF$, $BC = 2x + 3$ and $EF = 5x - 9$. Find $BC$.'
  choices: ['11', '4', '16', '22']
  answer: 0
  explanation: |-
    Corresponding sides: $2x + 3 = 5x - 9$, so $x = 4$ and $BC = 11$.
- id: geo-q-1103
  lesson: geo-congruent
  topic: Congruent figures
  stem: 'In $\triangle ABC$ and $\triangle DEF$, $\angle A \cong \angle D$ and $\angle B \cong \angle E$. What can you conclude?'
  choices: ['$\triangle ABC \cong \triangle DEF$', '$\angle C \cong \angle F$', '$\overline{AB} \cong \overline{DE}$', 'Nothing more']
  answer: 1
  explanation: |-
    By the Third Angles Theorem, the third angles are congruent. With no side information, the triangles need not be congruent (they could be different sizes).
- id: geo-q-1104
  lesson: geo-congruent
  module_quiz: true
  topic: SSS and SAS
  stem: 'In $\triangle PQR$, which angle is included between sides $\overline{PQ}$ and $\overline{QR}$?'
  choices: ['$\angle P$', '$\angle R$', '$\angle Q$', 'None']
  answer: 2
  explanation: |-
    The included angle is at the vertex the two sides share: $Q$.
- id: geo-q-1105
  lesson: geo-congruent
  topic: SSS and SAS
  stem: 'Two triangles have two pairs of congruent sides and a pair of congruent angles that are not between those sides. Which is true?'
  choices: ['They are congruent by SAS.', 'They are congruent by SSS.', 'They are congruent by ASA.', 'This (SSA) does not guarantee congruence.']
  answer: 3
  explanation: |-
    SSA can fit two different triangles (the ambiguous case), so it is not a congruence test. SAS requires the included angle.
- id: geo-q-1106
  lesson: geo-congruent
  topic: SSS and SAS
  stem: '$\overline{AB} \cong \overline{CB}$ and $\overline{BD}$ bisects $\angle ABC$, with $D$ on $\overline{AC}$. Which shortcut proves $\triangle ABD \cong \triangle CBD$?'
  choices: ['SAS', 'SSS', 'SSA', 'AAA']
  answer: 0
  explanation: |-
    $\overline{AB} \cong \overline{CB}$ (given), $\angle ABD \cong \angle CBD$ (bisector) and $\overline{BD} \cong \overline{BD}$ (reflexive): the angle is between the two sides, so SAS.
- id: geo-q-1107
  lesson: geo-congruent
  topic: SSS and SAS
  stem: 'Why are triangles used in bridge trusses?'
  choices: ['Triangles have the most area for their perimeter.', 'By SSS, three fixed side lengths determine a unique triangle, so the shape can''t deform.', 'Their angles always add to $180^\circ$.', 'They have no diagonals to brace.']
  answer: 1
  explanation: |-
    SSS says the side lengths fix the shape, so a triangle of rigid bars is rigid. A four-bar frame can flex into different shapes with the same side lengths.
- id: geo-q-1108
  lesson: geo-congruent
  module_quiz: true
  topic: SSS and SAS
  stem: 'Triangles $ABC$ and $DEF$ have $AB = DE = 6$, $BC = EF = 9$, $m\angle B = m\angle E = 50^\circ$. Which is a correct conclusion?'
  choices: ['$\triangle ABC \cong \triangle DEF$ by SSS', '$\triangle ABC \cong \triangle EDF$ by SAS', '$\triangle ABC \cong \triangle DEF$ by SAS', 'They are not necessarily congruent.']
  answer: 2
  explanation: |-
    $\angle B$ is between $\overline{AB}$ and $\overline{BC}$, and $\angle E$ is between $\overline{DE}$ and $\overline{EF}$: SAS with $A \leftrightarrow D$, $B \leftrightarrow E$, $C \leftrightarrow F$. Writing $\triangle EDF$ would mismatch the vertices.
- id: geo-q-1109
  lesson: geo-congruent
  topic: SSS and SAS
  stem: 'Is $\triangle ABC$ with $A(0, 0)$, $B(5, 0)$, $C(0, 12)$ congruent to $\triangle PQR$ with $P(3, 1)$, $Q(3, 6)$, $R(15, 1)$?'
  choices: ['No, the hypotenuses differ.', 'Only if the triangles face the same way.', 'No, they are only similar.', 'Yes, by SAS: each has legs 5 and 12 with a right angle between them.']
  answer: 3
  explanation: |-
    $\overline{AB}$ is horizontal with $AB = 5$ and $\overline{AC}$ is vertical with $AC = 12$, so $\angle A$ is a right angle between them. $\overline{PQ}$ is vertical with $PQ = 5$ and $\overline{PR}$ is horizontal with $PR = 12$, so $\angle P$ is a right angle between them. Two sides and the included angle match: SAS. Orientation doesn't matter, and both hypotenuses come out to 13 (Pythagorean theorem, Module 6).
- id: geo-q-1110
  lesson: geo-congruent
  topic: Congruent figures
  stem: 'Which information is NOT enough to prove two triangles congruent?'
  choices: ['Three pairs of congruent angles', 'Three pairs of congruent sides', 'Two sides and the included angle', 'Two pairs of congruent sides and a shared third side']
  answer: 0
  explanation: |-
    AAA only fixes the shape: a small and a large equilateral triangle have the same angles. Three pairs of congruent sides (a shared side counts, by the reflexive property) give SSS, and two sides with the included angle give SAS.
- id: geo-q-1111
  lesson: geo-congruent
  topic: Congruent figures
  stem: '$\triangle KLM \cong \triangle NOP$, $m\angle K = 52^\circ$, $m\angle O = 71^\circ$. Find $m\angle M$.'
  choices: ['$71^\circ$', '$57^\circ$', '$52^\circ$', '$123^\circ$']
  answer: 1
  explanation: |-
    $\angle O$ corresponds to $\angle L$, so $m\angle L = 71^\circ$. Then $m\angle M = 180 - 52 - 71 = 57^\circ$.

- id: geo-q-1201
  lesson: geo-asa-hl
  module_quiz: true
  topic: ASA AAS and HL
  stem: '$\angle A \cong \angle D$, $\overline{AB} \cong \overline{DE}$ and $\angle B \cong \angle E$. Which shortcut proves $\triangle ABC \cong \triangle DEF$?'
  choices: ['AAS', 'SAS', 'ASA', 'HL']
  answer: 2
  explanation: |-
    $\overline{AB}$ lies between $\angle A$ and $\angle B$ (the included side), so this is ASA.
- id: geo-q-1202
  lesson: geo-asa-hl
  topic: ASA AAS and HL
  stem: '$\angle A \cong \angle D$, $\angle B \cong \angle E$ and $\overline{BC} \cong \overline{EF}$. Which shortcut applies?'
  choices: ['ASA', 'SSA', 'SAS', 'AAS']
  answer: 3
  explanation: |-
    $\overline{BC}$ is not between $\angle A$ and $\angle B$ (the included side would be $\overline{AB}$), so this is AAS, which is valid.
- id: geo-q-1203
  lesson: geo-asa-hl
  topic: ASA AAS and HL
  stem: 'Why is AAS a theorem rather than a postulate?'
  choices: ['By the Third Angles Theorem the third angles match, which turns AAS into ASA.', 'It follows from SSS.', 'It is only true for right triangles.', 'It follows from the Hinge Theorem.']
  answer: 0
  explanation: |-
    Two pairs of congruent angles force the third pair. Then the given side lies between two known pairs of angles, and ASA applies.
- id: geo-q-1204
  lesson: geo-asa-hl
  module_quiz: true
  topic: ASA AAS and HL
  stem: 'Two right triangles have congruent hypotenuses and one pair of congruent legs. What can you conclude?'
  choices: ['Nothing, since this is SSA', 'They are congruent by HL.', 'They are congruent by ASA.', 'They are similar but not congruent.']
  answer: 1
  explanation: |-
    HL is a valid test for right triangles: the Pythagorean theorem makes the third sides equal too.
- id: geo-q-1205
  lesson: geo-asa-hl
  topic: CPCTC
  stem: 'What does CPCTC stand for?'
  choices: ['Congruent Polygons Contain Two Congruent sides', 'Corresponding Points Create Triangle Congruence', 'Corresponding Parts of Congruent Triangles are Congruent', 'Complementary Parts of Congruent Triangles Coincide']
  answer: 2
  explanation: |-
    Corresponding Parts of Congruent Triangles are Congruent: after proving triangles congruent, any pair of matching parts is congruent.
- id: geo-q-1206
  lesson: geo-asa-hl
  topic: CPCTC
  stem: 'In a proof, when may you use CPCTC?'
  choices: ['As the first step, to get congruent sides', 'Whenever two angles look equal', 'Only in right triangles', 'Only after proving the two triangles congruent']
  answer: 3
  explanation: |-
    CPCTC depends on the triangles already being congruent. Using it earlier assumes what you are trying to show.
- id: geo-q-1207
  lesson: geo-asa-hl
  module_quiz: true
  topic: CPCTC
  stem: 'Segments $\overline{AD}$ and $\overline{BC}$ bisect each other at $M$. Which reasons prove $\overline{AB} \cong \overline{DC}$?'
  choices: ['Midpoint definition, vertical angles, SAS, then CPCTC', 'Midpoint definition, SSS, then CPCTC', 'Vertical angles, ASA, then CPCTC', 'HL, then CPCTC']
  answer: 0
  explanation: |-
    $AM = DM$ and $BM = CM$ (midpoints), $\angle AMB \cong \angle DMC$ (vertical), so $\triangle AMB \cong \triangle DMC$ by SAS, and $\overline{AB} \cong \overline{DC}$ by CPCTC.
- id: geo-q-1208
  lesson: geo-asa-hl
  topic: CPCTC
  stem: '$\triangle ABC \cong \triangle DEF$ by ASA. $AC = 4y - 7$ and $DF = 2y + 9$. Find $DF$.'
  choices: ['8', '25', '18', '50']
  answer: 1
  explanation: |-
    By CPCTC, $AC = DF$: $4y - 7 = 2y + 9$, so $y = 8$ and $DF = 25$.
- id: geo-q-1209
  lesson: geo-asa-hl
  topic: ASA AAS and HL
  stem: '$\overline{QS} \perp \overline{PR}$ and $\overline{PQ} \cong \overline{RQ}$. Which shortcut proves $\triangle QSP \cong \triangle QSR$?'
  choices: ['SAS', 'ASA', 'HL', 'SSS']
  answer: 2
  explanation: |-
    Both are right triangles (right angles at $S$), with congruent hypotenuses $\overline{PQ}$ and $\overline{RQ}$ and a shared leg $\overline{QS}$: HL.
- id: geo-q-1210
  lesson: geo-asa-hl
  topic: ASA AAS and HL
  stem: 'Which combination is NOT a valid way to prove triangles congruent?'
  choices: ['ASA', 'AAS', 'HL', 'SSA']
  answer: 3
  explanation: |-
    SSA (two sides and a non-included angle) can produce two different triangles. ASA, AAS and HL are all valid.
- id: geo-q-1211
  lesson: geo-asa-hl
  topic: CPCTC
  stem: '$\triangle JKL \cong \triangle MNL$ by AAS, with $m\angle J = 3z + 12$ and $m\angle M = 5z - 6$ (degrees). Find $m\angle J$.'
  choices: ['$39^\circ$', '$9^\circ$', '$51^\circ$', '$27^\circ$']
  answer: 0
  explanation: |-
    $\angle J$ corresponds to $\angle M$, so by CPCTC $3z + 12 = 5z - 6$, giving $z = 9$ and $m\angle J = 39^\circ$.

- id: geo-q-1301
  lesson: geo-isosceles
  module_quiz: true
  topic: Isosceles triangles
  stem: 'The vertex angle of an isosceles triangle is $46^\circ$. Find a base angle.'
  choices: ['$134^\circ$', '$67^\circ$', '$46^\circ$', '$88^\circ$']
  answer: 1
  explanation: |-
    The base angles are equal and share $180 - 46 = 134^\circ$: each is $67^\circ$. $88^\circ$ would be the vertex angle if $46^\circ$ were a base angle.
- id: geo-q-1302
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'A base angle of an isosceles triangle measures $34^\circ$. Find the vertex angle.'
  choices: ['$73^\circ$', '$146^\circ$', '$112^\circ$', '$34^\circ$']
  answer: 2
  explanation: |-
    Both base angles are $34^\circ$: $180 - 2(34) = 112^\circ$. $73^\circ$ treats $34^\circ$ as the vertex angle.
- id: geo-q-1303
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'In $\triangle ABC$, $\overline{AB} \cong \overline{AC}$. Which angles are congruent?'
  choices: ['$\angle A$ and $\angle B$', '$\angle A$ and $\angle C$', 'All three', '$\angle B$ and $\angle C$']
  answer: 3
  explanation: |-
    The angles opposite the congruent sides are congruent: $\angle C$ is opposite $\overline{AB}$, and $\angle B$ is opposite $\overline{AC}$.
- id: geo-q-1304
  lesson: geo-isosceles
  module_quiz: true
  topic: Isosceles triangles
  stem: 'In $\triangle PQR$, $\overline{PQ} \cong \overline{PR}$, $m\angle Q = (5x - 4)^\circ$ and $m\angle R = (3x + 20)^\circ$. Find $m\angle P$.'
  choices: ['$68^\circ$', '$56^\circ$', '$12^\circ$', '$112^\circ$']
  answer: 0
  explanation: |-
    Base angles are congruent: $5x - 4 = 3x + 20$, so $x = 12$ and each base angle is $56^\circ$. Then $m\angle P = 180 - 112 = 68^\circ$.
- id: geo-q-1305
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'Each angle of an equilateral triangle measures:'
  choices: ['$45^\circ$', '$60^\circ$', '$90^\circ$', 'It depends on the side length.']
  answer: 1
  explanation: |-
    Equilateral triangles are equiangular, and three equal angles summing to $180^\circ$ are $60^\circ$ each, regardless of size.
- id: geo-q-1306
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'In isosceles $\triangle ABC$ with $\overline{BA} \cong \overline{BC}$, the bisector of $\angle B$ meets $\overline{AC}$ at $D$. Which is NOT necessarily true?'
  choices: ['$AD = DC$', '$\overline{BD} \perp \overline{AC}$', '$BD = AD$', '$\angle A \cong \angle C$']
  answer: 2
  explanation: |-
    The vertex-angle bisector is the perpendicular bisector of the base, and the base angles are congruent. $BD = AD$ only happens in special cases (a right isosceles triangle).
- id: geo-q-1307
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'In $\triangle XYZ$, $m\angle X = 70^\circ$ and $m\angle Z = 70^\circ$. If $XY = 3a + 2$ and $ZY = 5a - 8$, find $XY$.'
  choices: ['5', '34', '40', '17']
  answer: 3
  explanation: |-
    $\angle X \cong \angle Z$, so the opposite sides are congruent: $\overline{ZY}$ (opposite $X$) and $\overline{XY}$ (opposite $Z$). $3a + 2 = 5a - 8$ gives $a = 5$, so $XY = 17$.
- id: geo-q-1308
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'The vertex angle of an isosceles triangle is three times a base angle. Find the vertex angle.'
  choices: ['$108^\circ$', '$36^\circ$', '$135^\circ$', '$90^\circ$']
  answer: 0
  explanation: |-
    $b + b + 3b = 180$ gives $b = 36^\circ$, so the vertex angle is $108^\circ$.
- id: geo-q-1309
  lesson: geo-isosceles
  module_quiz: true
  topic: Isosceles triangles
  stem: 'Points $A$ and $B$ lie on a circle with center $O$, and $m\angle AOB = 50^\circ$. Find $m\angle OAB$.'
  choices: ['$50^\circ$', '$65^\circ$', '$130^\circ$', '$25^\circ$']
  answer: 1
  explanation: |-
    $OA = OB$ (radii), so $\triangle OAB$ is isosceles with vertex angle $50^\circ$; each base angle is $\tfrac{180 - 50}{2} = 65^\circ$.
- id: geo-q-1310
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'An isosceles triangle has a $100^\circ$ angle. What are the other two angles?'
  choices: ['$100^\circ$ and $-20^\circ$', '$80^\circ$ and $0^\circ$', '$40^\circ$ and $40^\circ$', '$50^\circ$ and $30^\circ$']
  answer: 2
  explanation: |-
    A $100^\circ$ angle can't be a base angle (two of them would exceed $180^\circ$), so it is the vertex angle and the base angles are $\tfrac{80}{2} = 40^\circ$ each.
- id: geo-q-1311
  lesson: geo-isosceles
  topic: Isosceles triangles
  stem: 'Which theorem is used to prove the Base Angles Theorem by drawing the vertex-angle bisector?'
  choices: ['SSS then the Exterior Angle Theorem', 'HL then the Triangle Inequality', 'ASA then Third Angles', 'SAS then CPCTC']
  answer: 3
  explanation: |-
    The bisector gives two triangles with two pairs of congruent sides (a leg and the shared bisector) and the congruent included angles: SAS. Then the base angles are congruent by CPCTC.

- id: geo-q-1401
  lesson: geo-tri-ineq
  module_quiz: true
  topic: Triangle inequalities
  stem: 'Which set of lengths can form a triangle?'
  choices: ['5, 8, 12', '3, 4, 8', '2, 6, 8', '1, 1, 3']
  answer: 0
  explanation: |-
    Check the two shorter sides against the longest: $5 + 8 = 13 > 12$ works. $3 + 4 = 7 < 8$, $2 + 6 = 8$ (degenerate) and $1 + 1 < 3$ fail.
- id: geo-q-1402
  lesson: geo-tri-ineq
  module_quiz: true
  topic: Triangle inequalities
  stem: 'Two sides of a triangle are 8 and 13. Which describes the possible lengths $x$ of the third side?'
  choices: ['$8 < x < 13$', '$5 < x < 21$', '$5 \le x \le 21$', '$0 < x < 21$']
  answer: 1
  explanation: |-
    The third side lies strictly between the difference and the sum: $13 - 8 = 5$ and $13 + 8 = 21$. The endpoints would give a degenerate (flat) triangle.
- id: geo-q-1403
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'In $\triangle ABC$, $AB = 9$, $BC = 12$, $AC = 7$. Which angle is largest?'
  choices: ['$\angle B$', '$\angle C$', '$\angle A$', 'They are equal.']
  answer: 2
  explanation: |-
    The largest angle is opposite the longest side. The longest side is $\overline{BC}$, which is opposite $\angle A$.
- id: geo-q-1404
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'In $\triangle DEF$, $m\angle D = 40^\circ$ and $m\angle E = 75^\circ$. Which side is shortest?'
  choices: ['$\overline{DE}$', '$\overline{DF}$', 'They are all equal.', '$\overline{EF}$']
  answer: 3
  explanation: |-
    $m\angle F = 65^\circ$. The smallest angle is $\angle D$ ($40^\circ$), and the side opposite it, $\overline{EF}$, is shortest.
- id: geo-q-1405
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'Two sides of a triangle are 6 and 10, and the third side is a whole number. How many lengths are possible?'
  choices: ['11', '12', '10', '16']
  answer: 0
  explanation: |-
    $4 < x < 16$, so $x = 5, 6, \ldots, 15$: that is $15 - 5 + 1 = 11$ lengths.
- id: geo-q-1406
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'Triangles $ABC$ and $DEF$ have $AB = DE$, $AC = DF$, and $m\angle A = 82^\circ$, $m\angle D = 67^\circ$. Which is true?'
  choices: ['$BC < EF$', '$BC > EF$', '$BC = EF$', 'It cannot be determined.']
  answer: 1
  explanation: |-
    By the Hinge Theorem, with two pairs of equal sides, the larger included angle ($82^\circ > 67^\circ$) is opposite the longer third side.
- id: geo-q-1407
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'What is the first step of an indirect proof?'
  choices: ['Draw an auxiliary line.', 'List the given facts.', 'Assume the statement to be proved is false.', 'Find a counterexample.']
  answer: 2
  explanation: |-
    An indirect proof assumes the opposite of the conclusion and reasons to a contradiction, which shows the assumption must be false.
- id: geo-q-1408
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'In right $\triangle ABC$ with right angle $C$, which side is longest?'
  choices: ['$\overline{AC}$', '$\overline{BC}$', 'It depends on the other angles.', '$\overline{AB}$']
  answer: 3
  explanation: |-
    The right angle is the largest angle, so the side opposite it, the hypotenuse $\overline{AB}$, is longest.
- id: geo-q-1409
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'Triangles $PQR$ and $STU$ have $PQ = ST = 5$, $QR = TU = 8$, $PR = 9$ and $SU = 11$. Compare $\angle Q$ and $\angle T$.'
  choices: ['$m\angle Q < m\angle T$', '$m\angle Q > m\angle T$', '$m\angle Q = m\angle T$', 'It cannot be determined.']
  answer: 0
  explanation: |-
    Converse Hinge Theorem: the included angles are $\angle Q$ and $\angle T$, and the third side opposite $\angle T$ is longer ($11 > 9$), so $\angle T$ is larger.
- id: geo-q-1410
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'A student checks whether 3, 9, 10 form a triangle by noting $9 + 10 > 3$. Is the check complete?'
  choices: ['Yes, any one sum is enough.', 'No; the test that matters is that the two shorter sides exceed the longest: $3 + 9 = 12 > 10$, so it is a triangle.', 'No; $3 + 9 < 10$, so it is not a triangle.', 'Yes, but only for right triangles.']
  answer: 1
  explanation: |-
    The sum of the two longest sides always beats the shortest, so that check proves nothing. The decisive check is the two shorter sides against the longest: $3 + 9 = 12 > 10$, so these lengths do form a triangle.
- id: geo-q-1411
  lesson: geo-tri-ineq
  topic: Triangle inequalities
  stem: 'In $\triangle ABC$, $m\angle A = (2x + 10)^\circ$, $m\angle B = (3x)^\circ$, $m\angle C = (x + 20)^\circ$. Which side is longest?'
  choices: ['$\overline{AB}$', '$\overline{BC}$', '$\overline{AC}$', '$\overline{AB}$ and $\overline{BC}$ tie']
  answer: 2
  explanation: |-
    $6x + 30 = 180$ gives $x = 25$: $\angle A = 60^\circ$, $\angle B = 75^\circ$, $\angle C = 45^\circ$. The largest angle is $\angle B$, so the longest side is the one opposite it, $\overline{AC}$.
