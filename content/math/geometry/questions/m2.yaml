# Module 2 — Reasoning and proof
- id: geo-q-0501
  lesson: geo-conditional
  module_quiz: true
  topic: Inductive reasoning
  stem: 'Each point on a circle is connected to every other point by a segment. With 2, 3, 4, 5 points there are 1, 3, 6, 10 segments. How many segments are there with 12 points?'
  choices: ['66', '132', '78', '55']
  answer: 0
  explanation: |-
    Each of the $n$ points connects to $n - 1$ others, and each segment is counted twice: $\tfrac{12 \cdot 11}{2} = 66$. 132 forgets to halve; 78 uses $\tfrac{13 \cdot 12}{2}$.
- id: geo-q-0502
  lesson: geo-conditional
  topic: Inductive reasoning
  stem: 'Which is a counterexample to "If a number is prime, then it is odd"?'
  choices: ['9', '2', '15', '7']
  answer: 1
  explanation: |-
    A counterexample must make the hypothesis true and the conclusion false. 2 is prime but even. 9 and 15 are not prime, and 7 is prime and odd.
- id: geo-q-0503
  lesson: geo-conditional
  topic: Inductive reasoning
  stem: 'Why can''t inductive reasoning by itself prove a conjecture?'
  choices: ['It only works for numbers, not shapes.', 'It requires a counterexample.', 'A pattern that holds for many cases can still fail for a later case.', 'It uses the converse instead of the conditional.']
  answer: 2
  explanation: |-
    Checking cases never covers *all* cases. The circle-regions pattern 1, 2, 4, 8, 16 suggests doubling, but six points give 31 regions, not 32.
- id: geo-q-0504
  lesson: geo-conditional
  module_quiz: true
  topic: Conditional statements
  stem: 'What is the hypothesis of "If two angles are vertical angles, then they are congruent"?'
  choices: ['They are congruent.', 'If two angles are vertical angles', 'Two angles are congruent.', 'Two angles are vertical angles.']
  answer: 3
  explanation: |-
    The hypothesis is the part after "if", without the word "if": two angles are vertical angles. The conclusion is that they are congruent.
- id: geo-q-0505
  lesson: geo-conditional
  module_quiz: true
  topic: Conditional statements
  stem: 'Which is the contrapositive of "If an angle is a right angle, then it measures $90^\circ$"?'
  choices: ['If an angle does not measure $90^\circ$, then it is not a right angle.', 'If an angle measures $90^\circ$, then it is a right angle.', 'If an angle is not a right angle, then it does not measure $90^\circ$.', 'An angle is a right angle if it measures $90^\circ$.']
  answer: 0
  explanation: |-
    The contrapositive swaps and negates both parts: "if not $q$, then not $p$". "If an angle measures $90^\circ$, then it is a right angle" is the converse, and "If an angle is not a right angle, then it does not measure $90^\circ$" is the inverse.
- id: geo-q-0506
  lesson: geo-conditional
  topic: Conditional statements
  stem: 'A conditional statement is true. Which related statement must also be true?'
  choices: ['Its converse', 'Its contrapositive', 'Its inverse', 'Its negation']
  answer: 1
  explanation: |-
    A conditional and its contrapositive are logically equivalent. The converse and inverse may be true or false.
- id: geo-q-0507
  lesson: geo-conditional
  topic: Conditional statements
  stem: 'When is the conditional $p \to q$ false?'
  choices: ['When $p$ is false', 'When $q$ is true', 'When $p$ is true and $q$ is false', 'When $p$ and $q$ are both false']
  answer: 2
  explanation: |-
    A conditional fails only when its hypothesis holds and its conclusion doesn't. If $p$ is false, the conditional is counted as true.
- id: geo-q-0508
  lesson: geo-conditional
  topic: Conditional statements
  stem: 'Statement: "If a quadrilateral is a square, then it is a rectangle." Which is true?'
  choices: ['The converse is true.', 'The inverse is true.', 'The statement can be written as a biconditional.', 'The contrapositive is true.']
  answer: 3
  explanation: |-
    The conditional is true, so its contrapositive ("if not a rectangle, then not a square") is true. The converse fails (a 2-by-5 rectangle is not a square), so the inverse fails and no biconditional is possible.
- id: geo-q-0509
  lesson: geo-conditional
  module_quiz: true
  topic: Conditional statements
  stem: 'Which statement is a correct biconditional?'
  choices: ['Two angles are supplementary if and only if their measures add to $180^\circ$.', 'An angle is acute if and only if it measures $40^\circ$.', 'Two angles are congruent if and only if they are vertical angles.', 'A figure is a square if and only if it has four sides.']
  answer: 0
  explanation: |-
    The first is the definition of supplementary, which works in both directions. Each of the others has a false converse or conditional (an acute angle need not be $40^\circ$, congruent angles need not be vertical, a four-sided figure need not be a square).
- id: geo-q-0510
  lesson: geo-conditional
  topic: Conditional statements
  stem: 'The converse and the inverse of a conditional are related how?'
  choices: ['They are always both true.', 'They are contrapositives of each other, so they have the same truth value.', 'One is true exactly when the other is false.', 'They have no relationship.']
  answer: 1
  explanation: |-
    The inverse $\sim p \to \sim q$ is the contrapositive of the converse $q \to p$, so they are logically equivalent.
- id: geo-q-0511
  lesson: geo-conditional
  topic: Inductive reasoning
  stem: 'Look at the sequence 3, 7, 11, 15, … . Using the pattern, what is the 20th term?'
  choices: ['80', '83', '79', '84']
  answer: 2
  explanation: |-
    The terms increase by 4 starting at 3, so term $n$ is $3 + 4(n - 1)$. Term 20 is $3 + 4 \cdot 19 = 79$. 83 is the 21st term.

- id: geo-q-0601
  lesson: geo-deductive
  module_quiz: true
  topic: Deductive reasoning
  stem: 'Given: "If a triangle is equilateral, then it is isosceles," and "$\triangle ABC$ is equilateral." Which law lets you conclude $\triangle ABC$ is isosceles?'
  choices: ['Law of Syllogism', 'Inductive reasoning', 'Converse', 'Law of Detachment']
  answer: 3
  explanation: |-
    A true conditional plus its true hypothesis gives the conclusion: that is the Law of Detachment.
- id: geo-q-0602
  lesson: geo-deductive
  topic: Deductive reasoning
  stem: 'Given: "If it is a hawk, then it is a bird," and "Rio is a bird." What can you conclude?'
  choices: ['Nothing about whether Rio is a hawk', 'Rio is a hawk.', 'Rio is not a hawk.', 'All birds are hawks.']
  answer: 0
  explanation: |-
    The fact matches the conclusion, not the hypothesis. Concluding "Rio is a hawk" is the converse error (affirming the conclusion).
- id: geo-q-0603
  lesson: geo-deductive
  module_quiz: true
  topic: Deductive reasoning
  stem: 'If $p \to q$ and $q \to r$ are true, which statement must be true?'
  choices: ['$r \to p$', '$p \to r$', '$q \to p$', '$r \to q$']
  answer: 1
  explanation: |-
    By the Law of Syllogism, the chain $p \to q \to r$ gives $p \to r$. The others reverse an arrow.
- id: geo-q-0604
  lesson: geo-deductive
  topic: Algebraic proof
  stem: 'Which property justifies: "If $m\angle A = m\angle B$ and $m\angle B = m\angle C$, then $m\angle A = m\angle C$"?'
  choices: ['Symmetric property', 'Reflexive property', 'Transitive property', 'Substitution property']
  answer: 2
  explanation: |-
    Linking two equalities through a common middle term is the transitive property.
- id: geo-q-0605
  lesson: geo-deductive
  topic: Algebraic proof
  stem: 'Which property justifies $\overline{PQ} \cong \overline{PQ}$?'
  choices: ['Symmetric property', 'Transitive property', 'Substitution property', 'Reflexive property']
  answer: 3
  explanation: |-
    Anything is congruent (or equal) to itself: the reflexive property. It's how shared sides are justified in triangle proofs.
- id: geo-q-0606
  lesson: geo-deductive
  module_quiz: true
  topic: Algebraic proof
  stem: 'In solving $4x - 9 = 23$, the step from $4x - 9 = 23$ to $4x = 32$ is justified by which property?'
  choices: ['Addition property of equality', 'Subtraction property of equality', 'Distributive property', 'Division property of equality']
  answer: 0
  explanation: |-
    Adding 9 to both sides gives $4x = 32$: the addition property of equality. The next step, dividing by 4, uses the division property.
- id: geo-q-0607
  lesson: geo-deductive
  topic: Algebraic proof
  stem: 'Solve $3(x + 4) = 5x - 8$, the equation of an algebraic proof.'
  choices: ['$x = 2$', '$x = 10$', '$x = -2$', '$x = 6$']
  answer: 1
  explanation: |-
    Distribute: $3x + 12 = 5x - 8$. Subtract $3x$: $12 = 2x - 8$. Add 8: $20 = 2x$. Divide: $x = 10$. Choosing 6 comes from forgetting to distribute: $3x + 4 = 5x - 8$.
- id: geo-q-0608
  lesson: geo-deductive
  topic: Algebraic proof
  stem: 'Given $AB + BC = AC$ and $AB = 7$, a student writes $7 + BC = AC$. Which property is this?'
  choices: ['Transitive property', 'Symmetric property', 'Substitution property', 'Reflexive property']
  answer: 2
  explanation: |-
    Replacing $AB$ by an equal quantity inside a larger expression is substitution.
- id: geo-q-0609
  lesson: geo-deductive
  topic: Deductive reasoning
  stem: 'Given: "If two lines are perpendicular, they form right angles," and "If angles are right angles, they are congruent." Which conclusion follows by the Law of Syllogism?'
  choices: ['If angles are congruent, the lines are perpendicular.', 'If lines form right angles, they are perpendicular.', 'All congruent angles are right angles.', 'If two lines are perpendicular, they form congruent angles.']
  answer: 3
  explanation: |-
    The conclusion of the first statement matches the hypothesis of the second, so they chain: perpendicular $\to$ right angles $\to$ congruent.
- id: geo-q-0610
  lesson: geo-deductive
  topic: Algebraic proof
  stem: '$B$ is between $A$ and $C$, $AB = 4x - 3$, $BC = 2x + 5$, $AC = 32$. In the proof that $x = 5$, which reason justifies writing $(4x - 3) + (2x + 5) = 32$?'
  choices: ['Segment Addition Postulate and substitution', 'Definition of midpoint', 'Transitive property only', 'Angle Addition Postulate']
  answer: 0
  explanation: |-
    Segment addition gives $AB + BC = AC$; substituting the given expressions gives the equation. (Then $6x + 2 = 32$, so $x = 5$.)
- id: geo-q-0611
  lesson: geo-deductive
  topic: Algebraic proof
  stem: 'Which step of this proof is wrong? (1) $2(x - 5) = 14$ Given. (2) $2x - 5 = 14$ Distributive property. (3) $2x = 19$ Addition property. (4) $x = 9.5$ Division property.'
  choices: ['Step 3', 'Step 2', 'Step 4', 'No step is wrong.']
  answer: 1
  explanation: |-
    Distributing gives $2x - 10 = 14$, not $2x - 5$. The correct solution is $2x = 24$, $x = 12$. Steps 3 and 4 follow correctly from the wrong step 2.

- id: geo-q-0701
  lesson: geo-proofs
  module_quiz: true
  topic: Geometric proof
  stem: 'In a two-column proof, which is NOT an acceptable reason?'
  choices: ['Given', 'Definition of midpoint', 'It looks congruent in the diagram', 'Vertical Angles Theorem']
  answer: 2
  explanation: |-
    Measures and congruences cannot be read from a picture. Reasons must be given facts, definitions, postulates, properties or proven theorems.
- id: geo-q-0702
  lesson: geo-proofs
  topic: Geometric proof
  stem: '$\angle 1$ and $\angle 2$ are complementary, and $\angle 3$ and $\angle 2$ are complementary. Which theorem gives $\angle 1 \cong \angle 3$?'
  choices: ['Vertical Angles Theorem', 'Linear Pair Postulate', 'Congruent Supplements Theorem', 'Congruent Complements Theorem']
  answer: 3
  explanation: |-
    Complements of the same angle are congruent: $m\angle 1 = 90 - m\angle 2 = m\angle 3$.
- id: geo-q-0703
  lesson: geo-proofs
  module_quiz: true
  topic: Geometric proof
  stem: 'In the proof of the Vertical Angles Theorem, why are $\angle 1$ and $\angle 2$ supplementary?'
  choices: ['They form a linear pair.', 'They are vertical angles.', 'They are congruent.', 'They are both acute.']
  answer: 0
  explanation: |-
    Adjacent angles at an intersection form a linear pair, and the Linear Pair Postulate says a linear pair is supplementary.
- id: geo-q-0704
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'Which statement correctly uses $=$ and $\cong$?'
  choices: ['$\angle A = \angle B$', '$m\angle A \cong m\angle B$', '$\overline{AB} = 5$', '$\overline{AB} \cong \overline{CD}$']
  answer: 3
  explanation: |-
    Figures (segments, angles) are congruent; numbers (lengths, measures) are equal. Only $\overline{AB} \cong \overline{CD}$ pairs the right symbol with the right objects.
- id: geo-q-0705
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'Points $A, B, C, D$ lie on a line in that order with $AB = CD$. To prove $AC = BD$, which fact is used?'
  choices: ['$B$ is the midpoint of $\overline{AC}$.', '$BC = BC$, added to both sides', '$AC = CD$', 'Vertical angles are congruent.']
  answer: 1
  explanation: |-
    $AC = AB + BC$ and $BD = BC + CD$. Adding the shared piece $BC$ (reflexive) to equal pieces $AB = CD$ gives $AC = BD$.
- id: geo-q-0706
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'A proof step reads "$m\angle 1 + m\angle 2 = 180^\circ$". If the previous statement was "$\angle 1$ and $\angle 2$ are supplementary", what is the reason?'
  choices: ['Linear Pair Postulate', 'Angle Addition Postulate', 'Definition of supplementary angles', 'Congruent Supplements Theorem']
  answer: 2
  explanation: |-
    Turning "supplementary" into the equation "sum is $180^\circ$" uses the definition of supplementary angles.
- id: geo-q-0707
  lesson: geo-proofs
  module_quiz: true
  topic: Geometric proof
  stem: '$\angle 1$ and $\angle 2$ are supplementary, $\angle 2$ and $\angle 3$ are supplementary, and $m\angle 1 = (3x + 10)^\circ$, $m\angle 3 = (5x - 30)^\circ$. Find $m\angle 1$.'
  choices: ['$20^\circ$', '$110^\circ$', '$70^\circ$', '$40^\circ$']
  answer: 2
  explanation: |-
    By the Congruent Supplements Theorem $\angle 1 \cong \angle 3$: $3x + 10 = 5x - 30$, so $x = 20$ and $m\angle 1 = 70^\circ$. $110^\circ$ is $m\angle 2$.
- id: geo-q-0708
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'Which is the best first step when you can''t see how a proof goes?'
  choices: ['Measure the diagram carefully.', 'Assume the conclusion and work forward from it as a given.', 'Write what each given fact means as an equation, and what you''d need just before the conclusion.', 'Pick a theorem at random.']
  answer: 2
  explanation: |-
    Working forward from the givens and backward from the goal is the standard strategy. Assuming the conclusion is circular reasoning, and measuring is not a reason.
- id: geo-q-0709
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'In a paragraph proof that all right angles are congruent, which property connects $m\angle A = 90^\circ$ and $m\angle B = 90^\circ$ to $m\angle A = m\angle B$?'
  choices: ['Transitive property (or substitution)', 'Reflexive property', 'Distributive property', 'Addition property']
  answer: 0
  explanation: |-
    Both equal 90, so they equal each other: the transitive property (equivalently, substitute $m\angle B$ for 90).
- id: geo-q-0710
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'Two lines meet. $m\angle 1 = 2x + 14$ and its vertical angle $m\angle 3 = 4x - 22$. Find $m\angle 2$, which is adjacent to $\angle 1$.'
  choices: ['$50^\circ$', '$130^\circ$', '$18^\circ$', '$140^\circ$']
  answer: 1
  explanation: |-
    Vertical angles: $2x + 14 = 4x - 22$, so $x = 18$ and $m\angle 1 = 50^\circ$. $\angle 2$ forms a linear pair with $\angle 1$: $180 - 50 = 130^\circ$.
- id: geo-q-0711
  lesson: geo-proofs
  topic: Geometric proof
  stem: 'A student''s last two lines are "4. $m\angle 1 = m\angle 3$" and "5. $\angle 1 \cong \angle 3$". What is the reason for line 5?'
  choices: ['Reflexive property', 'Vertical Angles Theorem', 'Substitution property', 'Definition of congruent angles']
  answer: 3
  explanation: |-
    Equal measures mean congruent angles by definition. The definition is used here in the "if equal, then congruent" direction.
