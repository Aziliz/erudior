# Module 9 — Coordinate geometry and transformations
- id: geo-q-3301
  lesson: geo-coord
  module_quiz: true
  topic: Distance and midpoint
  stem: 'Find the midpoint of the segment from $(-4, 7)$ to $(10, -3)$.'
  choices: ['$(7, -5)$', '$(3, 2)$', '$(6, 4)$', '$(14, -10)$']
  answer: 1
  explanation: |-
    Average the coordinates: $\left(\tfrac{-4 + 10}{2}, \tfrac{7 - 3}{2}\right) = (3, 2)$. $(7, -5)$ is half the change in coordinates, not the midpoint.
- id: geo-q-3302
  lesson: geo-coord
  topic: Distance and midpoint
  stem: 'Find the distance between $(2, -3)$ and $(-4, 5)$.'
  choices: ['14', '$2\sqrt{7}$', '10', '$\sqrt{20}$']
  answer: 2
  explanation: |-
    $\sqrt{(-6)^2 + 8^2} = \sqrt{36 + 64} = 10$.
- id: geo-q-3303
  lesson: geo-coord
  topic: Distance and midpoint
  stem: '$M(1, 4)$ is the midpoint of $\overline{AB}$ with $A(-3, 9)$. Find $B$.'
  choices: ['$(-1, 6.5)$', '$(-7, 14)$', '$(4, -5)$', '$(5, -1)$']
  answer: 3
  explanation: |-
    From $A$ to $M$ is $+4$ in $x$ and $-5$ in $y$. Repeat from $M$: $B = (5, -1)$. $(-1, 6.5)$ is the midpoint of $A$ and $M$.
- id: geo-q-3304
  lesson: geo-coord
  module_quiz: true
  topic: Distance and midpoint
  stem: 'Point $P$ divides $\overline{AB}$ from $A(0, 0)$ to $B(12, 8)$ in the ratio $3 : 1$. Find $P$.'
  choices: ['$(9, 6)$', '$(4, \tfrac83)$', '$(3, 2)$', '$(36, 24)$']
  answer: 0
  explanation: |-
    $k = \tfrac{3}{3 + 1} = \tfrac34$, so $P = \left(\tfrac34 \cdot 12, \tfrac34 \cdot 8\right) = (9, 6)$. $(3, 2)$ uses $k = \tfrac14$ (the ratio $1 : 3$).
- id: geo-q-3305
  lesson: geo-coord
  topic: Distance and midpoint
  stem: 'Find the point one-third of the way from $A(-6, 1)$ to $B(3, 10)$.'
  choices: ['$(0, 7)$', '$(-3, 4)$', '$(-1.5, 5.5)$', '$(-2, \tfrac{11}{3})$']
  answer: 1
  explanation: |-
    $A + \tfrac13(B - A) = (-6 + \tfrac13 \cdot 9,\; 1 + \tfrac13 \cdot 9) = (-3, 4)$. $(0, 7)$ is two-thirds of the way.
- id: geo-q-3306
  lesson: geo-coord
  module_quiz: true
  topic: Coordinate proof
  stem: 'Quadrilateral $ABCD$ has $A(0, 0)$, $B(4, 0)$, $C(5, 3)$, $D(1, 3)$. What is it?'
  choices: ['A rectangle', 'A rhombus', 'A parallelogram that is not a rectangle or rhombus', 'A trapezoid that is not a parallelogram']
  answer: 2
  explanation: |-
    $\overline{AB}$ and $\overline{DC}$ are horizontal (parallel) with length 4; $\overline{AD}$ and $\overline{BC}$ both have slope 3 and length $\sqrt{10}$. Opposite sides are parallel, but adjacent sides differ (4 vs $\sqrt{10}$) and slopes 0 and 3 aren't perpendicular.
- id: geo-q-3307
  lesson: geo-coord
  topic: Coordinate proof
  stem: 'To prove something about a general isosceles triangle with coordinates, which placement is most convenient?'
  choices: ['$(0, 0)$, $(a, 0)$, $(a, a)$', '$(0, 0)$, $(1, 0)$, $(0, 1)$', '$(a, b)$, $(c, d)$, $(e, f)$', '$(-a, 0)$, $(a, 0)$, $(0, b)$']
  answer: 3
  explanation: |-
    Putting the base symmetric about the $y$-axis with the apex on it makes the legs congruent automatically and keeps the algebra simple while staying general. The placements $(0, 0)$, $(a, 0)$, $(a, a)$ and $(0, 0)$, $(1, 0)$, $(0, 1)$ are special (right isosceles) triangles, and $(a, b)$, $(c, d)$, $(e, f)$ ignores the isosceles condition.
- id: geo-q-3308
  lesson: geo-coord
  topic: Coordinate proof
  stem: 'Why use $A(2a, 0)$ and $B(0, 2b)$ rather than $A(a, 0)$ and $B(0, b)$ in a proof about midpoints?'
  choices: ['So the midpoint $(a, b)$ has no fractions', 'Because the triangle must be twice as large', 'So the slopes are integers', 'It is required for the distance formula.']
  answer: 0
  explanation: |-
    Doubling the coordinates makes midpoints come out as $(a, b)$ instead of $(\tfrac{a}{2}, \tfrac{b}{2})$. It loses no generality because $a$ and $b$ can be any numbers.
- id: geo-q-3309
  lesson: geo-coord
  topic: Coordinate proof
  stem: 'A student shows that $ABCD$ has four equal sides and concludes it is a square. What is missing?'
  choices: ['Nothing', 'A right angle (or equal diagonals)', 'Parallel sides', 'The midpoints of the sides']
  answer: 1
  explanation: |-
    Four equal sides only make a rhombus. A rhombus with one right angle (or congruent diagonals) is a square.
- id: geo-q-3310
  lesson: geo-coord
  topic: Distance and midpoint
  stem: 'Is the triangle with vertices $(0, 0)$, $(6, 0)$ and $(3, 5)$ equilateral, isosceles or scalene?'
  choices: ['Equilateral', 'Scalene', 'Isosceles', 'Right isosceles']
  answer: 2
  explanation: |-
    The base is 6, and both other sides are $\sqrt{9 + 25} = \sqrt{34} \approx 5.83$. Two equal sides, so isosceles (not equilateral, since $\sqrt{34} \ne 6$).
- id: geo-q-3311
  lesson: geo-coord
  topic: Coordinate proof
  stem: 'In the coordinate proof that a rectangle''s diagonals are congruent, the rectangle is placed at $(0, 0)$, $(a, 0)$, $(a, b)$, $(0, b)$. What are both diagonal lengths?'
  choices: ['$a + b$', '$\sqrt{a + b}$', '$a^2 + b^2$', '$\sqrt{a^2 + b^2}$']
  answer: 3
  explanation: |-
    Each diagonal spans $a$ horizontally and $b$ vertically: $\sqrt{a^2 + b^2}$. They're equal, proving the theorem for every rectangle.

- id: geo-q-3401
  lesson: geo-rigid
  module_quiz: true
  topic: Rigid motions
  stem: 'Translate $(4, -2)$ by $\langle -6, 5 \rangle$.'
  choices: ['$(-2, 3)$', '$(10, -7)$', '$(-24, -10)$', '$(2, 3)$']
  answer: 0
  explanation: |-
    $(4 - 6, -2 + 5) = (-2, 3)$.
- id: geo-q-3402
  lesson: geo-rigid
  module_quiz: true
  topic: Rigid motions
  stem: 'Reflect $(3, -7)$ in the line $y = x$.'
  choices: ['$(-3, 7)$', '$(-7, 3)$', '$(7, -3)$', '$(3, 7)$']
  answer: 1
  explanation: |-
    Reflection in $y = x$ swaps the coordinates: $(-7, 3)$.
- id: geo-q-3403
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Rotate $(5, 2)$ by $90^\circ$ counterclockwise about the origin.'
  choices: ['$(2, -5)$', '$(-5, -2)$', '$(-2, 5)$', '$(2, 5)$']
  answer: 2
  explanation: |-
    $(x, y) \to (-y, x)$: $(-2, 5)$. $(2, -5)$ is a $90^\circ$ clockwise rotation.
- id: geo-q-3404
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Reflect $(6, 1)$ in the vertical line $x = 2$.'
  choices: ['$(-6, 1)$', '$(4, 1)$', '$(8, 1)$', '$(-2, 1)$']
  answer: 3
  explanation: |-
    $(2h - x, y) = (4 - 6, 1) = (-2, 1)$. The point is 4 right of the line, so its image is 4 left of it.
- id: geo-q-3405
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Which property is NOT preserved by every rigid motion?'
  choices: ['Orientation (clockwise order of vertices)', 'Distance', 'Angle measure', 'Parallelism']
  answer: 0
  explanation: |-
    Reflections reverse orientation. All rigid motions preserve distance, angle measure and parallelism.
- id: geo-q-3406
  lesson: geo-rigid
  module_quiz: true
  topic: Rigid motions
  stem: 'Rotate $(-3, 4)$ by $180^\circ$ about the origin.'
  choices: ['$(4, -3)$', '$(3, -4)$', '$(-4, -3)$', '$(3, 4)$']
  answer: 1
  explanation: |-
    $(x, y) \to (-x, -y)$: $(3, -4)$.
- id: geo-q-3407
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Rotate $P(5, 1)$ by $90^\circ$ counterclockwise about $C(2, 3)$.'
  choices: ['$(-1, 5)$', '$(1, 5)$', '$(4, 6)$', '$(0, 0)$']
  answer: 2
  explanation: |-
    Relative to $C$: $(3, -2)$. Rotate: $(2, 3)$. Add $C$ back: $(4, 6)$. $(-1, 5)$ rotates about the origin instead.
- id: geo-q-3408
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'In a reflection in line $\ell$, how is $\ell$ related to the segment joining a point and its image?'
  choices: ['$\ell$ is parallel to it.', '$\ell$ contains it.', '$\ell$ makes a $45^\circ$ angle with it.', '$\ell$ is its perpendicular bisector.']
  answer: 3
  explanation: |-
    That is the definition of a reflection: the mirror line is the perpendicular bisector of $\overline{PP'}$.
- id: geo-q-3409
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Which rule describes a reflection in the $x$-axis?'
  choices: ['$(x, y) \to (x, -y)$', '$(x, y) \to (-x, y)$', '$(x, y) \to (y, x)$', '$(x, y) \to (-x, -y)$']
  answer: 0
  explanation: |-
    The $x$-coordinate stays and the $y$-coordinate changes sign. $(-x, y)$ reflects in the $y$-axis; $(-x, -y)$ is a $180^\circ$ rotation.
- id: geo-q-3410
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Under the modern definition, two figures are congruent when:'
  choices: ['they have the same area', 'some sequence of rigid motions maps one onto the other', 'some dilation maps one onto the other', 'they have the same perimeter']
  answer: 1
  explanation: |-
    Congruence means one can be carried exactly onto the other by translations, reflections and rotations. Equal area or perimeter isn't enough, and dilations change size.
- id: geo-q-3411
  lesson: geo-rigid
  topic: Rigid motions
  stem: 'Triangle $ABC$ has $A(1, 2)$. After a $270^\circ$ counterclockwise rotation about the origin, where is $A''$?'
  choices: ['$(-2, 1)$', '$(-1, -2)$', '$(2, -1)$', '$(2, 1)$']
  answer: 2
  explanation: |-
    $270^\circ$ counterclockwise is $90^\circ$ clockwise: $(x, y) \to (y, -x)$, giving $(2, -1)$.

- id: geo-q-3501
  lesson: geo-dilation
  module_quiz: true
  topic: Dilations
  stem: 'Dilate $(6, -4)$ by scale factor $\tfrac12$ centered at the origin.'
  choices: ['$(12, -8)$', '$(6.5, -3.5)$', '$(-3, 2)$', '$(3, -2)$']
  answer: 3
  explanation: |-
    Multiply both coordinates by $\tfrac12$: $(3, -2)$.
- id: geo-q-3502
  lesson: geo-dilation
  topic: Dilations
  stem: 'A figure with area 20 is dilated by scale factor 3. What is the image''s area?'
  choices: ['180', '60', '540', '23']
  answer: 0
  explanation: |-
    Area scales by $k^2 = 9$: $20 \cdot 9 = 180$.
- id: geo-q-3503
  lesson: geo-dilation
  module_quiz: true
  topic: Dilations
  stem: 'Dilate $P(9, 4)$ with center $C(3, 1)$ and scale factor 2.'
  choices: ['$(18, 8)$', '$(15, 7)$', '$(12, 5)$', '$(6, 3)$']
  answer: 1
  explanation: |-
    $C + 2(P - C) = (3 + 2 \cdot 6, 1 + 2 \cdot 3) = (15, 7)$. $(18, 8)$ dilates about the origin instead.
- id: geo-q-3504
  lesson: geo-dilation
  topic: Dilations
  stem: 'Under a dilation, a line that does not pass through the center maps to:'
  choices: ['a perpendicular line', 'the same line', 'a parallel line', 'a circle']
  answer: 2
  explanation: |-
    Dilations map lines to parallel lines (lines through the center map to themselves).
- id: geo-q-3505
  lesson: geo-dilation
  topic: Compositions and symmetry
  stem: 'A point is reflected in $x = 2$ and then in $x = 7$. What single transformation does this equal?'
  choices: ['A rotation of $180^\circ$', 'A reflection in $x = 4.5$', 'A translation 5 units right', 'A translation 10 units right']
  answer: 3
  explanation: |-
    Reflections in two parallel lines make a translation by twice the distance between them, from the first line toward the second: $2 \cdot 5 = 10$ units right.
- id: geo-q-3506
  lesson: geo-dilation
  module_quiz: true
  topic: Compositions and symmetry
  stem: 'How many lines of symmetry does a regular octagon have, and what is its angle of rotational symmetry?'
  choices: ['8 lines; $45^\circ$', '4 lines; $90^\circ$', '8 lines; $135^\circ$', '16 lines; $22.5^\circ$']
  answer: 0
  explanation: |-
    A regular $n$-gon has $n$ lines of symmetry and rotational symmetry of $\tfrac{360^\circ}{n}$: 8 lines and $45^\circ$. $135^\circ$ is the interior angle.
- id: geo-q-3507
  lesson: geo-dilation
  topic: Compositions and symmetry
  stem: 'Which figure has rotational symmetry but no line symmetry?'
  choices: ['A square', 'A parallelogram that is not a rhombus or rectangle', 'An isosceles trapezoid', 'An isosceles triangle']
  answer: 1
  explanation: |-
    A general parallelogram maps onto itself under a $180^\circ$ rotation about its center but has no mirror line. An isosceles trapezoid and isosceles triangle have a line of symmetry but no rotational symmetry.
- id: geo-q-3508
  lesson: geo-dilation
  topic: Compositions and symmetry
  stem: 'Reflect $(2, 5)$ in the $y$-axis, then translate by $\langle 3, -1 \rangle$. Where does it land?'
  choices: ['$(5, 4)$', '$(-5, 4)$', '$(1, 4)$', '$(-1, 6)$']
  answer: 2
  explanation: |-
    Reflect: $(-2, 5)$. Translate: $(-2 + 3, 5 - 1) = (1, 4)$. $(-5, 4)$ translates first and then reflects; order matters.
- id: geo-q-3509
  lesson: geo-dilation
  topic: Compositions and symmetry
  stem: 'Reflections in two lines that intersect at a $40^\circ$ angle combine to give:'
  choices: ['a translation', 'a reflection', 'a rotation by $40^\circ$', 'a rotation by $80^\circ$']
  answer: 3
  explanation: |-
    Two reflections in intersecting lines make a rotation about the intersection point by twice the angle between the lines: $80^\circ$.
- id: geo-q-3510
  lesson: geo-dilation
  topic: Dilations
  stem: 'Under the modern definition, two figures are similar when:'
  choices: ['a sequence of rigid motions and dilations maps one onto the other', 'they have the same area', 'they have equal perimeters', 'a single reflection maps one onto the other']
  answer: 0
  explanation: |-
    Similarity allows a change of size (a dilation) as well as rigid motions.
- id: geo-q-3511
  lesson: geo-dilation
  topic: Dilations
  stem: 'A segment of length 12 is dilated to length 4. What is the scale factor, and is it an enlargement or a reduction?'
  choices: ['3; enlargement', '$\tfrac13$; reduction', '$\tfrac13$; enlargement', '$-3$; reduction']
  answer: 1
  explanation: |-
    $k = \tfrac{4}{12} = \tfrac13$, which is less than 1, so it's a reduction.
# Lesson 38 — Parabolas from focus and directrix; all circles are similar
- id: geo-q-3551
  lesson: geo-parabola
  module_quiz: true
  topic: Parabolas
  stem: 'A parabola is the set of all points in a plane that are equally distant from what?'
  choices: ['Two fixed points', 'Two fixed lines', 'A fixed point and a fixed line not through it', 'A single fixed point']
  answer: 2
  explanation: |-
    A parabola is the set of points equidistant from a focus (a point) and a directrix (a line not through the focus). Points equidistant from two fixed points form a perpendicular bisector; from two intersecting lines, angle bisectors; and a fixed distance from one point gives a circle.
- id: geo-q-3552
  lesson: geo-parabola
  topic: Parabolas
  stem: 'Which equation describes the parabola with focus $(0, 3)$ and directrix $y = -3$?'
  choices: ['$x^2 = 12y$', '$x^2 = 3y$', '$x^2 = 6y$', '$y^2 = 12x$']
  answer: 0
  explanation: |-
    The vertex is halfway between, at the origin, and the focus is $p = 3$ above it, so $x^2 = 4py = 12y$. $x^2 = 3y$ uses $p$ in place of $4p$; $x^2 = 6y$ uses the focus-to-directrix distance 6 in place of $4p$; $y^2 = 12x$ opens to the right, which needs a vertical directrix.
- id: geo-q-3553
  lesson: geo-parabola
  module_quiz: true
  topic: Parabolas
  stem: 'Where is the focus of $y = \tfrac18 x^2$?'
  choices: ['$(0, 8)$', '$(0, 2)$', '$\left(0, \tfrac{1}{32}\right)$', '$\left(0, \tfrac12\right)$']
  answer: 1
  explanation: |-
    Write it as $x^2 = 8y$, so $4p = 8$ and $p = 2$: the focus is $(0, 2)$. In general $p = \tfrac{1}{4a}$. $(0, 8)$ uses $p = \tfrac1a$; $\left(0, \tfrac{1}{32}\right)$ uses $p = \tfrac{a}{4}$; $\left(0, \tfrac12\right)$ uses $p = 4a$.
- id: geo-q-3554
  lesson: geo-parabola
  topic: Parabolas
  stem: 'Which equation describes the parabola with focus $(-1, 4)$ and directrix $y = 0$?'
  choices: ['$(x + 1)^2 = 16(y - 2)$', '$(x - 1)^2 = 8(y - 2)$', '$(x + 1)^2 = 8(y - 4)$', '$(x + 1)^2 = 8(y - 2)$']
  answer: 3
  explanation: |-
    The vertex is halfway between $(-1, 4)$ and the line $y = 0$: $(-1, 2)$. The focus is $p = 2$ above it, so $4p = 8$ and $(x + 1)^2 = 8(y - 2)$. The 16 version takes $p$ to be the whole focus-to-directrix distance 4; $(x - 1)^2$ has the sign of $h$ wrong; $(y - 4)$ puts the vertex at the focus.
- id: geo-q-3555
  lesson: geo-parabola
  topic: Parabolas
  stem: 'What is the directrix of $(x - 3)^2 = -12(y + 1)$?'
  choices: ['$y = 2$', '$y = -4$', '$y = 11$', '$y = 4$']
  answer: 0
  explanation: |-
    The vertex is $(3, -1)$ and $4p = -12$, so $p = -3$ (opens down). The directrix is $y = k - p = -1 - (-3) = 2$. $y = -4$ is where the focus is (the sign of $p$ was flipped); $y = 11$ uses $p = -12$; $y = 4$ reads the vertex as $(-3, 1)$.
- id: geo-q-3556
  lesson: geo-parabola
  topic: Parabolas
  stem: 'Where is the focus of $y^2 = 8x$?'
  choices: ['$(0, 2)$', '$(8, 0)$', '$(2, 0)$', '$(-2, 0)$']
  answer: 2
  explanation: |-
    $y$ is squared, so the parabola opens left or right. $4p = 8$ gives $p = 2 > 0$: it opens right and the focus is $(2, 0)$, with directrix $x = -2$. $(0, 2)$ puts the focus on the wrong axis; $(8, 0)$ uses $4p$ as $p$; $(-2, 0)$ is on the directrix side.
- id: geo-q-3557
  lesson: geo-parabola
  topic: Parabolas
  stem: 'The point $P(6, 9)$ is on the parabola $x^2 = 4y$, whose focus is $(0, 1)$. How far is $P$ from the focus?'
  choices: ['9', '10', '8', '$\sqrt{117} \approx 10.82$']
  answer: 1
  explanation: |-
    By the definition, it equals the distance to the directrix $y = -1$: $9 - (-1) = 10$. Directly: $\sqrt{6^2 + (9 - 1)^2} = \sqrt{100} = 10$. 9 measures to the $x$-axis instead of the directrix; 8 is only the vertical gap to the focus; $\sqrt{117}$ is the distance to the vertex.
- id: geo-q-3558
  lesson: geo-parabola
  topic: Parabolas
  stem: 'Which way does the parabola $(y - 2)^2 = -6(x + 1)$ open?'
  choices: ['Up', 'Down', 'Right', 'Left']
  answer: 3
  explanation: |-
    $y$ is squared, so it opens left or right, and $4p = -6$ is negative, so it opens left (the focus is at $x = -1 - 1.5 = -2.5$). Up and down belong to equations with $x$ squared; right would need a positive $4p$.
- id: geo-q-3559
  lesson: geo-parabola
  topic: Parabolas
  stem: 'A parabola has focus $(4, 1)$ and directrix $x = -2$. Where is its vertex?'
  choices: ['$(4, 1)$', '$(-2, 1)$', '$(1, 1)$', '$(1, 4)$']
  answer: 2
  explanation: |-
    The vertex is on the axis through the focus perpendicular to the directrix (the line $y = 1$), halfway between $x = 4$ and $x = -2$: $(1, 1)$. Here $p = 3$ and the equation is $(y - 1)^2 = 12(x - 1)$. $(4, 1)$ is the focus and $(-2, 1)$ is the directrix point; $(1, 4)$ swaps the coordinates.
- id: geo-q-3560
  lesson: geo-parabola
  module_quiz: true
  topic: Similar circles
  stem: 'Circle $P$ has center $(0, 0)$ and radius 2. Circle $Q$ has center $(3, -1)$ and radius 5. Which sequence maps $P$ onto $Q$?'
  choices: ['Translate by $\langle 3, -1 \rangle$, then dilate about $(3, -1)$ by $\tfrac52$', 'Translate by $\langle 3, -1 \rangle$, then dilate about the origin by $\tfrac52$', 'Translate by $\langle -3, 1 \rangle$, then dilate about $(3, -1)$ by $\tfrac52$', 'Translate by $\langle 3, -1 \rangle$, then dilate about $(3, -1)$ by $\tfrac25$']
  answer: 0
  explanation: |-
    Translating center to center gives a circle at $(3, -1)$ with radius 2; dilating about that center by $\tfrac{5}{2}$ scales the radius to 5 without moving the center. Dilating about the origin would move the center to $(7.5, -2.5)$; the vector $\langle -3, 1 \rangle$ points the wrong way; and $\tfrac25$ is the scale factor upside down (radius 0.8).
- id: geo-q-3561
  lesson: geo-parabola
  module_quiz: true
  topic: Similar circles
  stem: 'Why is the ratio of circumference to diameter, $\pi$, the same for every circle?'
  choices: ['Because every circle has the same radius', 'Because circles have no corners', 'Because $\pi$ is defined to be 3.14', 'Because all circles are similar, so every length scales by the same factor']
  answer: 3
  explanation: |-
    A translation and a dilation map any circle onto any other, so the circles are similar and every length (circumference and diameter alike) is multiplied by the same scale factor; their ratio stays the same. Circles have many different radii; having no corners says nothing about ratios; and 3.14 is only an approximation of $\pi$, not its definition.
- id: geo-q-3562
  lesson: geo-parabola
  topic: Similar circles
  stem: 'A translation followed by a dilation maps the circle $x^2 + y^2 = 4$ onto the circle $(x - 1)^2 + (y - 5)^2 = 36$. What is the scale factor of the dilation?'
  choices: ['9', '3', '6', '$\tfrac13$']
  answer: 1
  explanation: |-
    The radii are $\sqrt4 = 2$ and $\sqrt{36} = 6$, so $k = \tfrac62 = 3$. 9 divides $36$ by $4$, the ratio of the squared radii (that is the area ratio, $k^2$); 6 is just the second radius; $\tfrac13$ maps the larger circle to the smaller.
- id: geo-q-3563
  lesson: geo-parabola
  topic: Parabolas
  stem: 'Where is the focus of $y = 2(x - 1)^2 + 3$?'
  choices: ['$(1, 5)$', '$(1, 3.5)$', '$(1, 3.125)$', '$(1, 2.875)$']
  answer: 2
  explanation: |-
    The vertex is $(1, 3)$ and $p = \tfrac{1}{4a} = \tfrac18$, so the focus is $(1, 3 + 0.125) = (1, 3.125)$. $(1, 5)$ uses $p = a$; $(1, 3.5)$ uses $p = \tfrac{a}{4}$; $(1, 2.875)$ subtracts $p$, which is where the directrix crosses the axis.
