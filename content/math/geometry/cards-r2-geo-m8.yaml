# Round 2 cards for geo-m8
# Core lessons
- {front: 'Which formula gives a trapezoid''s area, and which parts does it use?', back: '$A = \tfrac12(b_1 + b_2)h$: the two bases and the perpendicular height. The legs are not used (except to find a missing height).', topic: Area of polygons}
- {front: Parts of a regular polygon, back: 'Center; radius (center to a vertex); apothem (center to the midpoint of a side, perpendicular to it); central angle $\tfrac{360^\circ}{n}$.', topic: Regular polygons}
- {front: 'Cone: height, radius, slant height', back: 'They form a right triangle with the slant height as hypotenuse: $\ell = \sqrt{r^2 + h^2}$. Volume uses $h$; lateral area uses $\ell$.', topic: Surface area}
- {front: 'Cone, sphere and cylinder with radius $r$ and height $2r$', back: 'Volumes $\tfrac23\pi r^3$, $\tfrac43\pi r^3$, $2\pi r^3$: in the ratio $1 : 2 : 3$.', topic: Volume}
# Honors 34h1: polyhedra
- {front: Regular polyhedron, back: 'Convex; every face the same regular polygon; the same number of faces at every vertex. Exactly five exist (the Platonic solids).', topic: Polyhedra}
- {front: The five regular polyhedra (V, E, F), back: 'Tetrahedron 4, 6, 4; cube 8, 12, 6; octahedron 6, 12, 8; dodecahedron 20, 30, 12; icosahedron 12, 30, 20.', topic: Polyhedra}
- {front: 'Why are there only five regular polyhedra?', back: 'At least 3 faces meet at a vertex and their angles must total less than $360^\circ$: 3, 4 or 5 triangles, 3 squares, or 3 pentagons. Hexagons ($3 \times 120^\circ = 360^\circ$) lie flat.', topic: Polyhedra}
- {front: Counting edges and vertices from the faces, back: '$E = \tfrac12$(total face sides); with $q$ faces at every vertex, $V = \tfrac1q$(total face corners).', topic: Polyhedra}
- {front: Dual polyhedra, back: 'Join the centers of neighboring faces. $V$ and $F$ swap, $E$ stays. Cube ↔ octahedron, dodecahedron ↔ icosahedron, tetrahedron ↔ itself.', topic: Polyhedra}
- {front: Angle defect, back: '$360^\circ$ minus the sum of the face angles at a vertex. Cube: $360^\circ - 270^\circ = 90^\circ$.', topic: Polyhedra}
- {front: Descartes' theorem, back: 'The angle defects of a convex polyhedron total $720^\circ$. It follows from (and is equivalent to) $V - E + F = 2$.', topic: Polyhedra}
- {front: 'Soccer ball (truncated icosahedron)', back: '12 pentagons, 20 hexagons, 60 vertices, 90 edges; each vertex has defect $360^\circ - 348^\circ = 12^\circ$.', topic: Polyhedra}
- {front: Pentagons and hexagons with 3 at each vertex, back: 'Euler''s formula forces exactly 12 pentagons, however many hexagons there are.', topic: Polyhedra}
- {front: Euler characteristic, back: '$V - E + F$: 2 for a polyhedron without holes, 0 for a ring-shaped one (one hole); it drops by 2 per hole.', topic: Polyhedra}
# Honors 34h2: frustums, caps, Pappus
- {front: Volume of a frustum of a cone, back: '$V = \tfrac{\pi h}{3}(R^2 + Rr + r^2)$ (big cone minus the similar small cone).', topic: Frustums and caps}
- {front: Lateral area of a frustum of a cone, back: '$L = \pi(R + r)s$, with slant height $s = \sqrt{h^2 + (R - r)^2}$.', topic: Frustums and caps}
- {front: Volume of a pyramid frustum, back: '$V = \tfrac{h}{3}\left(B_1 + B_2 + \sqrt{B_1 B_2}\right)$; known in Egypt by about 1850 BCE (Moscow Papyrus).', topic: Frustums and caps}
- {front: Base radius of a spherical cap, back: '$a^2 = h(2R - h)$, from the right triangle with legs $R - h$ and $a$ and hypotenuse $R$.', topic: Frustums and caps}
- {front: Volume of a spherical cap, back: '$V = \tfrac{\pi h^2}{3}(3R - h)$; $h = R$ gives a hemisphere, $h = 2R$ the whole ball.', topic: Frustums and caps}
- {front: Archimedes' hat-box theorem, back: 'A band of a sphere between parallel planes $h$ apart has curved area $2\pi R h$, the same as the matching band of the surrounding cylinder.', topic: Frustums and caps}
- {front: Pappus's theorem (volume), back: 'Spinning a region of area $A$ around an axis that does not cut it: $V = A \cdot 2\pi d$, where $d$ is the distance from the axis to the centroid.', topic: Pappus's theorem}
- {front: Pappus's theorem (surface area), back: 'A curve of length $\ell$ whose centroid is $d$ from the axis sweeps out area $\ell \cdot 2\pi d$.', topic: Pappus's theorem}
- {front: Torus, back: 'Circle of radius $r$ spun around an axis $R$ from its center: $V = 2\pi^2 R r^2$, $S = 4\pi^2 R r$.', topic: Pappus's theorem}
# Honors 34h3: isoperimetric problem
- {front: Best rectangle for a fixed perimeter $P$, back: 'The square, with area $\tfrac{P^2}{16}$, since $LW = \left(\tfrac{P}{4}\right)^2 - t^2$.', topic: Optimal shapes}
- {front: AM–GM inequality, back: 'For positive $a$, $b$: $\sqrt{ab} \le \tfrac{a + b}{2}$, equal only when $a = b$. A fixed sum gives the largest product when the parts are equal.', topic: Optimal shapes}
- {front: Geometric proof of AM–GM, back: 'In a semicircle on a diameter split into $a$ and $b$, the perpendicular at the split point is $\sqrt{ab}$; it can''t exceed the radius $\tfrac{a + b}{2}$.', topic: Optimal shapes}
- {front: Best pen against a wall (fence on 3 sides), back: 'Length (parallel to the wall) twice the width: with $P$ of fence, $W = \tfrac{P}{4}$, $L = \tfrac{P}{2}$, area $\tfrac{P^2}{8}$.', topic: Optimal shapes}
- {front: Isoperimetric inequality, back: '$4\pi A \le P^2$ for every closed curve, with equality only for a circle.', topic: Optimal shapes}
- {front: Isoperimetric quotient, back: '$Q = \tfrac{4\pi A}{P^2}$: circle 1, regular hexagon 0.907, square 0.785, equilateral triangle 0.605.', topic: Optimal shapes}
- {front: Area of a regular $n$-gon with perimeter $P$, back: '$A = \dfrac{P^2}{4n\tan(180^\circ/n)}$; it increases with $n$ toward the circle''s $\tfrac{P^2}{4\pi}$.', topic: Optimal shapes}
- {front: Can that uses the least metal, back: 'Height equals diameter ($h = 2r$), from AM–GM on $2\pi r^2 + \tfrac{V}{r} + \tfrac{V}{r}$. Among boxes, the cube; among all solids, the sphere.', topic: Optimal shapes}
