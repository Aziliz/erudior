# Module 10, round 2: terms from honors lessons 41h1 (projective planes), 41h2 (Saccheri quadrilaterals), 41h3 (Buffon and Bertrand)
- term: finite geometry
  aliases: [finite geometries]
  definition: 'An axiom system for geometry whose models have only finitely many points, such as the four-point geometry or the Fano plane.'
  topic: Finite geometries
- term: projective plane
  aliases: [projective planes]
  definition: 'A geometry in which any two points are on exactly one line, any two lines meet in exactly one point, and four points exist with no three on a line. It has no parallel lines.'
  topic: Projective planes
- term: Fano plane
  definition: 'The smallest projective plane: 7 points and 7 lines, with 3 points on each line and 3 lines through each point.'
  topic: Projective planes
- term: order of a projective plane
  definition: 'The number $n$ such that each line of a finite projective plane has $n + 1$ points. The plane then has $n^2 + n + 1$ points and $n^2 + n + 1$ lines.'
  topic: Projective planes
- term: affine plane
  aliases: [affine planes]
  definition: 'A geometry in which any two points are on exactly one line, Playfair''s axiom holds, and three points exist that are not on one line. One of order $n$ has $n^2$ points and $n^2 + n$ lines.'
  topic: Finite geometries
- term: parallel classes
  aliases: [parallel class]
  definition: 'In an affine plane, the groups of lines that are all parallel to each other. An affine plane of order $n$ has $n + 1$ classes of $n$ lines each.'
  topic: Finite geometries
- term: point at infinity
  aliases: [points at infinity]
  definition: 'A point added to a family of parallel lines so that they meet. Adding one for each parallel class, plus a line through all of them, turns an affine plane into a projective plane.'
  topic: Finite geometries
- term: principle of duality
  aliases: [duality]
  definition: 'In projective plane geometry, swapping the words point and line in any theorem gives another theorem, because the axioms stay true when swapped.'
  topic: Projective planes
- term: Saccheri–Legendre theorem
  aliases: [Saccheri-Legendre theorem]
  definition: 'In neutral geometry (without the parallel postulate), the angles of every triangle add to at most $180^\circ$.'
  topic: Neutral geometry
- term: Saccheri quadrilateral
  aliases: [Saccheri quadrilaterals]
  definition: 'A quadrilateral $ABCD$ with base $\overline{AB}$ and two congruent legs $\overline{AD}$ and $\overline{BC}$ perpendicular to the base. Its summit angles are congruent: right in Euclidean geometry, acute in hyperbolic geometry.'
  topic: Saccheri quadrilaterals
- term: summit
  definition: 'In a Saccheri quadrilateral, the side opposite the base, joining the tops of the two legs.'
  topic: Saccheri quadrilaterals
- term: summit angles
  aliases: [summit angle]
  definition: 'The two angles of a Saccheri quadrilateral at the ends of its summit. They are always congruent and never obtuse.'
  topic: Saccheri quadrilaterals
- term: Lambert quadrilateral
  aliases: [Lambert quadrilaterals]
  definition: 'A quadrilateral with three right angles. Its fourth angle is right in Euclidean geometry and acute in hyperbolic geometry; half of a Saccheri quadrilateral is one.'
  topic: Saccheri quadrilaterals
- term: sample space
  definition: 'The set of all possible outcomes of a random experiment. For Buffon''s needle it is the rectangle of all pairs (angle, distance).'
  topic: Buffon's needle
- term: Buffon's noodle
  aliases: [Barbier's theorem]
  definition: 'Barbier''s 1860 extension of Buffon''s needle: a wire of any shape and length $L$ dropped on lines $d$ apart crosses them $\tfrac{2L}{\pi d}$ times on average.'
  topic: Buffon's needle
- term: Monte Carlo method
  aliases: [Monte Carlo]
  definition: 'Estimating a number by repeated random sampling, such as estimating $\pi$ from needle drops. Its error shrinks roughly like $\tfrac{1}{\sqrt{N}}$ for $N$ trials.'
  topic: Buffon's needle
- term: Bertrand's paradox
  definition: 'Bertrand''s 1889 problem of a random chord, where three natural methods give three different probabilities ($\tfrac13$, $\tfrac12$, $\tfrac14$); "at random" must be specified.'
  topic: Random chords
