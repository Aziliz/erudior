# Round 2 notecards for geo-m7 (honors lessons 30h1 and 30h2)
- {front: 'Power of a point (signed)', back: '$\operatorname{pow}(P) = d^2 - r^2$, with $d$ the distance from $P$ to the center: positive outside, 0 on the circle, negative inside.', topic: Power of a point}
- {front: 'Power of an outside point and tangents', back: 'outside · whole $= d^2 - r^2$ for every secant; tangent length $= \sqrt{d^2 - r^2}$.', topic: Power of a point}
- {front: 'Power of an inside point and chords', back: 'Every chord through $P$ is cut into pieces with product $r^2 - d^2$.', topic: Power of a point}
- {front: 'Power from a circle''s equation', back: 'For $x^2 + y^2 + Dx + Ey + F = 0$ (square terms with coefficient 1), the power of $(x_0, y_0)$ is $x_0^2 + y_0^2 + Dx_0 + Ey_0 + F$.', topic: Power of a point}
- {front: 'Shortest chord through an inside point $P$', back: 'The chord perpendicular to $\overline{OP}$; $P$ is its midpoint, so each half is $\sqrt{r^2 - d^2}$.', topic: Power of a point}
- {front: 'Finding the radical axis', back: 'Write both circles in general form and subtract; the square terms cancel, leaving a line.', topic: Radical axis}
- {front: 'Radical axis and the line of centers', back: 'Always perpendicular. It passes through the midpoint of the centers only when the radii are equal.', topic: Radical axis}
- {front: 'Radical axis of two crossing circles', back: 'The line through the two crossing points (it contains the common chord). For tangent circles: the common tangent line.', topic: Radical axis}
- {front: 'Tangents from a point on the radical axis', back: 'The tangent segments to the two circles are equal (each is the square root of the same power).', topic: Radical axis}
- {front: 'Radical center', back: 'Three circles with non-collinear centers: the three radical axes meet at one point, with equal power for all three circles.', topic: Radical axis}
- {front: 'Concentric circles and the radical axis', back: 'Concentric circles with different radii have no radical axis.', topic: Radical axis}
- {front: 'Opposite-angle test for a cyclic quadrilateral', back: 'A convex quadrilateral is cyclic if and only if a pair of opposite angles is supplementary.', topic: Concyclic points}
- {front: 'Equal-angle test for concyclic points', back: 'If $C$ and $D$ are on the same side of $\overline{AB}$ and $\angle ACB \cong \angle ADB$, then $A$, $B$, $C$, $D$ are concyclic.', topic: Concyclic points}
- {front: 'Converse of the Intersecting Chords Theorem', back: 'If $\overline{AB}$ and $\overline{CD}$ cross at $E$ and $EA \cdot EB = EC \cdot ED$, then $A$, $B$, $C$, $D$ are concyclic.', topic: Concyclic points}
- {front: 'Which quadrilaterals are always cyclic?', back: 'Rectangles (including squares) and isosceles trapezoids. A parallelogram only if it is a rectangle; a kite only if its equal angles are right angles.', topic: Concyclic points}
- {front: 'Circle through three points (coordinates)', back: 'Substitute each point into $x^2 + y^2 + Dx + Ey + F = 0$ and solve for $D$, $E$, $F$; or intersect two perpendicular bisectors.', topic: Concyclic points}
- {front: 'Testing a fourth point', back: 'It is concyclic with the other three exactly when it satisfies the equation of their circle (power 0).', topic: Concyclic points}
- {front: Extended Law of Sines, back: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C} = 2R$', topic: Circumradius}
- {front: 'Circumradius from sides and area', back: '$R = \dfrac{abc}{4K}$', topic: Circumradius}
- {front: 'Circumradius of a right triangle', back: 'Half the hypotenuse; the center is the midpoint of the hypotenuse.', topic: Circumradius}
- {front: 'Circumradius of an equilateral triangle with side $s$', back: '$R = \dfrac{s}{\sqrt3} = \dfrac{s\sqrt3}{3}$', topic: Circumradius}
