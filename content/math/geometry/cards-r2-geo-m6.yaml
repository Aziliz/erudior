# Round 2 cards for geo-m6 honors lessons
- {front: Garfield's trapezoid proof, back: 'Two copies of the right triangle and an isosceles right triangle with legs $c$ form a trapezoid: $\tfrac12(a + b)^2 = ab + \tfrac12 c^2$, so $a^2 + b^2 = c^2$.', topic: Proofs of the Pythagorean theorem}
- {front: Generalized Pythagorean theorem, back: 'Similar figures on the three sides of a right triangle: area on the hypotenuse = sum of areas on the legs (areas scale like $a^2$, $b^2$, $c^2$).', topic: Proofs of the Pythagorean theorem}
- {front: Semicircle on a side of length s, back: 'Area $\tfrac{\pi}{8}s^2$; semicircles on the legs add up to the semicircle on the hypotenuse.', topic: Proofs of the Pythagorean theorem}
- {front: Primitive Pythagorean triple, back: 'A triple with no common factor greater than 1 (3-4-5, 5-12-13, 8-15-17, 7-24-25, 20-21-29, 9-40-41).', topic: Pythagorean triples}
- {front: Parity in a primitive triple, back: 'The hypotenuse is odd and exactly one leg is even (two odd squares sum to 2 more than a multiple of 4, which no square is).', topic: Pythagorean triples}
- {front: Euclid's formula, back: '$a = m^2 - n^2$, $b = 2mn$, $c = m^2 + n^2$ for whole numbers $m > n > 0$.', topic: Pythagorean triples}
- {front: When Euclid's formula gives a primitive triple, back: 'When $m$ and $n$ have no common factor and one is even, the other odd.', topic: Pythagorean triples}
- {front: 'Euclid''s formula: (m, n) = (2, 1), (3, 2), (4, 1), (4, 3)', back: '3-4-5, 5-12-13, 15-8-17, 7-24-25', topic: Pythagorean triples}
- {front: Triples and the unit circle, back: 'A triple $a, b, c$ gives the rational point $\left(\tfrac{a}{c}, \tfrac{b}{c}\right)$ on $x^2 + y^2 = 1$.', topic: Pythagorean triples}
- {front: Plimpton 322, back: 'An Old Babylonian clay tablet (roughly 1800 BCE) listing numbers from Pythagorean triples, such as 119 and 169; its purpose is debated.', topic: Pythagorean triples}
- {front: Height from two angles of elevation, back: '$h = \dfrac{d\sin\alpha\sin\beta}{\sin(\beta - \alpha)} = \dfrac{d\tan\alpha\tan\beta}{\tan\beta - \tan\alpha}$, with $d$ the distance walked toward the object.', topic: Triangulation}
- {front: Angle at the top in the two-sighting method, back: '$\beta - \alpha$ (Exterior Angle Theorem: $\beta = \alpha + \angle T$).', topic: Triangulation}
- {front: Bearing, back: 'Angle measured clockwise from north, three digits: N $000^\circ$, E $090^\circ$, S $180^\circ$, W $270^\circ$.', topic: Bearings}
- {front: Back bearing, back: 'Add or subtract $180^\circ$: the return direction.', topic: Bearings}
- {front: Coordinates from a bearing θ and distance r, back: 'East $= r\sin\theta$, north $= r\cos\theta$ (sine and cosine swap roles because bearings start from north).', topic: Bearings}
- {front: Angle at a turn between two bearings, back: 'Find the back bearing of the first leg, then the angle between it and the second leg''s bearing.', topic: Bearings}
- {front: Triangulation, back: 'Measure one baseline, then only angles; solve triangle after triangle with the Law of Sines.', topic: Triangulation}
- {front: Why surveyors avoid thin triangles, back: 'Where sight lines cross at a small angle, a small angle error moves the crossing point a long way.', topic: Triangulation}
- {front: 'Golden ratio φ', back: '$\varphi = \tfrac{1 + \sqrt5}{2} \approx 1.618$, the positive root of $x^2 = x + 1$.', topic: Golden ratio}
- {front: 'Identities for φ', back: '$\varphi^2 = \varphi + 1 \approx 2.618$ and $\tfrac{1}{\varphi} = \varphi - 1 \approx 0.618$.', topic: Golden ratio}
- {front: Golden rectangle, back: 'Long side $= \varphi \times$ short side; cutting off a square leaves a smaller similar golden rectangle.', topic: Golden ratio}
- {front: Extreme and mean ratio, back: 'Whole : longer piece = longer piece : shorter piece; the longer piece is the geometric mean, and the ratio is $\varphi$.', topic: Golden ratio}
- {front: Regular pentagon diagonal, back: 'Diagonal $= \varphi \times$ side.', topic: Golden ratio}
- {front: Golden triangle, back: 'Isosceles with angles 36°, 72°, 72°; legs $= \varphi \times$ base. Bisecting a base angle cuts off a smaller golden triangle.', topic: Golden ratio}
- {front: Golden gnomon, back: 'Isosceles with angles 36°, 36°, 108°; base $= \varphi \times$ leg.', topic: Golden ratio}
- {front: Exact cos 36° and cos 72°, back: '$\cos 36^\circ = \tfrac{1 + \sqrt5}{4} = \tfrac{\varphi}{2} \approx 0.809$; $\cos 72^\circ = \tfrac{\sqrt5 - 1}{4} \approx 0.309$.', topic: Golden ratio}
- {front: Fibonacci ratios, back: 'Ratios of consecutive Fibonacci numbers (8/5, 13/8, 21/13, …) approach $\varphi$.', topic: Golden ratio}
- {front: Golden ratio claims in art and nature, back: 'Pentagon and Fibonacci facts are proved; claims about the Parthenon, famous paintings or nautilus shells are mostly unsupported.', topic: Golden ratio}
