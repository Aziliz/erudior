# Round 2 glossary entries for geo-m7 (honors lessons 30h1 and 30h2)
- term: signed power
  definition: 'The power of a point $P$ with respect to a circle taken with a sign: $d^2 - r^2$, where $d$ is the distance from $P$ to the center. Positive outside the circle, 0 on it, negative inside.'
  topic: Power of a point
- term: general form
  definition: 'A circle''s equation written as $x^2 + y^2 + Dx + Ey + F = 0$. Substituting a point into the left side gives that point''s power.'
  topic: Power of a point
- term: radical axis
  definition: 'For two circles with different centers, the line of points that have equal power with respect to both. It is perpendicular to the line of centers; find it by subtracting the circles'' general forms.'
  topic: Radical axis
- term: common chord
  definition: 'The segment joining the two points where two circles cross. It lies on their radical axis.'
  topic: Radical axis
- term: radical center
  definition: 'The point where the three radical axes of three circles (with non-collinear centers) meet. It has equal power with respect to all three circles.'
  topic: Radical axis
- term: concyclic
  definition: 'Lying on one circle. Any three non-collinear points are concyclic; four points may or may not be.'
  topic: Concyclic points
- term: circumradius
  definition: 'The radius $R$ of the circle through a triangle''s three vertices: $R = \tfrac{a}{2\sin A} = \tfrac{abc}{4K}$.'
  topic: Circumradius
- term: Extended Law of Sines
  definition: 'In any triangle, $\tfrac{a}{\sin A} = \tfrac{b}{\sin B} = \tfrac{c}{\sin C} = 2R$, where $R$ is the circumradius.'
  topic: Circumradius
