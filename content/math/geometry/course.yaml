id: math-geometry
title: Geometry
description: >-
  Euclidean geometry from the first definitions through a college introduction:
  points, lines and angles; logic and proof; parallel lines; triangle congruence
  and similarity; special segments and quadrilaterals; right triangles and
  trigonometry; circles; area, surface area and volume; coordinates and
  transformations; and, at the college level, axiomatic systems, the parallel
  postulate, non-Euclidean geometry and geometric probability.
