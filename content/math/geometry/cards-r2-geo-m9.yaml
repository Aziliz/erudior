# Round 2 cards: geo-m9 honors lessons
# geo-h-isometries
- {front: An isometry is determined by…, back: 'The images of any three noncollinear points.', topic: Classifying isometries}
- {front: Every isometry of the plane is a composition of…, back: 'At most three reflections.', topic: Classifying isometries}
- {front: 'Reflections in two parallel lines a distance $d$ apart', back: 'A translation by $2d$, perpendicular to the lines, from the first line toward the second.', topic: Classifying isometries}
- {front: 'Reflections in two lines crossing at $O$ at angle $\theta$', back: 'A rotation about $O$ by $2\theta$, turning from the first line toward the second.', topic: Classifying isometries}
- {front: 'Reflection in a line through $O$ at angle $\alpha$ (polar angle)', back: 'Keeps the distance from $O$ and sends angle $\varphi$ to $2\alpha - \varphi$.', topic: Classifying isometries}
- {front: Direct vs opposite isometries, back: 'Direct (even number of reflections, keeps orientation): identity, translation, rotation. Opposite (odd number, reverses it): reflection, glide reflection.', topic: Classifying isometries}
- {front: Fixed points of each rigid motion, back: 'Translation: none. Rotation: the center. Reflection: its mirror line. Glide reflection: none.', topic: Classifying isometries}
- {front: Reflect in a line then translate perpendicular to it, back: 'A reflection in a parallel line moved by half the translation.', topic: Classifying isometries}
- {front: 'Leonardo''s theorem', back: 'A bounded figure with finitely many symmetries has group $C_n$ ($n$ rotations) or $D_n$ ($n$ rotations and $n$ reflections).', topic: Symmetry groups}
- {front: 'Number of symmetries in $D_n$', back: '$2n$: $n$ rotations (including $0^\circ$) and $n$ reflections.', topic: Symmetry groups}
- {front: Symmetry group of a non-square rectangle, back: '$D_2$: identity, $180^\circ$ rotation and two reflections.', topic: Symmetry groups}
- {front: 'Why a bounded figure has no translation symmetry', back: 'Repeating a translation (or glide reflection) would carry the figure arbitrarily far away.', topic: Symmetry groups}
# geo-h-matrices
- {front: 'Rotation by $\theta$ about the origin', back: '$(x, y) \to (x\cos\theta - y\sin\theta,\; x\sin\theta + y\cos\theta)$', topic: Rotations by any angle}
- {front: 'Rotation matrix $R_\theta$', back: '$\begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{bmatrix}$', topic: Rotations by any angle}
- {front: Columns of a transformation matrix, back: 'The images of $(1, 0)$ and $(0, 1)$.', topic: Transformation matrices}
- {front: 'Reflection in a line through $O$ at angle $\alpha$ (matrix)', back: '$\begin{bmatrix} \cos 2\alpha & \sin 2\alpha \\ \sin 2\alpha & -\cos 2\alpha \end{bmatrix}$', topic: Transformation matrices}
- {front: 'Reflection in $y = mx$: $\cos 2\alpha$ and $\sin 2\alpha$', back: '$\cos 2\alpha = \tfrac{1 - m^2}{1 + m^2}$, $\sin 2\alpha = \tfrac{2m}{1 + m^2}$', topic: Transformation matrices}
- {front: 'Matrix for "do $A$, then $B$"', back: 'The product $BA$: the first transformation is on the right.', topic: Transformation matrices}
- {front: 'Determinant of a $2 \times 2$ matrix', back: '$ad - bc$; areas are multiplied by $|ad - bc|$, and a negative value reverses orientation.', topic: Transformation matrices}
- {front: Determinants of rigid motions fixing the origin, back: 'Rotation: $+1$. Reflection: $-1$.', topic: Transformation matrices}
- {front: Angle-addition formulas from rotation matrices, back: '$R_\alpha R_\beta = R_{\alpha+\beta}$ gives $\cos(\alpha+\beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$ and $\sin(\alpha+\beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$.', topic: Rotations by any angle}
# geo-h-conics
- {front: Ellipse (definition), back: 'All points whose distances to two foci add to $2a$.', topic: Ellipses}
- {front: 'Ellipse centered at the origin, major axis horizontal', back: '$\tfrac{x^2}{a^2} + \tfrac{y^2}{b^2} = 1$ with $a > b$; vertices $(\pm a, 0)$, co-vertices $(0, \pm b)$, foci $(\pm c, 0)$.', topic: Ellipses}
- {front: 'Ellipse: relation among $a$, $b$, $c$', back: '$c^2 = a^2 - b^2$ ($a$ is the largest).', topic: Ellipses}
- {front: 'Which way is an ellipse''s major axis?', back: 'Along the variable with the larger denominator.', topic: Ellipses}
- {front: Reflection property of an ellipse, back: 'A ray from one focus reflects off the ellipse through the other focus.', topic: Ellipses}
- {front: Hyperbola (definition), back: 'All points whose distances to two foci differ by $2a$.', topic: Hyperbolas}
- {front: 'Hyperbola centered at the origin, opening left and right', back: '$\tfrac{x^2}{a^2} - \tfrac{y^2}{b^2} = 1$; vertices $(\pm a, 0)$, foci $(\pm c, 0)$, $c^2 = a^2 + b^2$.', topic: Hyperbolas}
- {front: 'Asymptotes of $\tfrac{x^2}{a^2} - \tfrac{y^2}{b^2} = 1$', back: '$y = \pm\tfrac{b}{a}x$, the diagonals of the $2a \times 2b$ box.', topic: Hyperbolas}
- {front: Eccentricity of the conics, back: '$e = \tfrac{c}{a}$. Circle 0; ellipse between 0 and 1; parabola 1; hyperbola greater than 1.', topic: Hyperbolas}
- {front: Fixed difference of distances (or arrival times) to two points, back: 'Puts the point on a hyperbola with those two points as foci.', topic: Hyperbolas}
