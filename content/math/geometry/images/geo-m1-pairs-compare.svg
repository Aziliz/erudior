<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img"><title>Three panels. Left: a right angle split by a ray into adjacent angles of 35 and 55 degrees, which are complementary. Middle: a ray from a point on a line makes adjacent angles of 60 and 120 degrees, a linear pair. Right: two separate angles of 120 and 60 degrees that are supplementary but not adjacent.</title><rect x="0" y="0" width="720" height="280" fill="#ffffff"/><path d="M75,220 L135,220 A60,60 0 0 0 124.1,185.6 Z" fill="#dde8f3"/><path d="M75,220 L124.1,185.6 A60,60 0 0 0 75,160 Z" fill="#f7ebcf"/><line x1="75.0" y1="220.0" x2="205.0" y2="220.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="205.0,220.0 194.9,224.3 194.9,215.7" fill="#1c2833"/><line x1="75.0" y1="220.0" x2="181.5" y2="145.4" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="181.5,145.4 175.6,154.8 170.7,147.7" fill="#1c2833"/><line x1="75.0" y1="220.0" x2="75.0" y2="90.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="75.0,90.0 79.3,100.1 70.7,100.1" fill="#1c2833"/><polygon points="75.0,220.0 89.0,220.0 89.0,206.0 75.0,206.0" fill="none" stroke="#1c2833" stroke-width="1.5" stroke-linejoin="round"/><text x="165.0" y="198.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">35°</text><text x="115.0" y="135.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">55°</text><text x="120.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Adjacent and</text><text x="120.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">complementary</text><text x="120.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">35° + 55° = 90°</text><path d="M360,210 L415,210 A55,55 0 0 0 387.5,162.4 Z" fill="#dde8f3"/><path d="M360,210 L387.5,162.4 A55,55 0 0 0 305,210 Z" fill="#f7ebcf"/><line x1="250.0" y1="210.0" x2="470.0" y2="210.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="246.0,210.0 256.1,205.7 256.1,214.3" fill="#1c2833"/><polygon points="474.0,210.0 463.9,214.3 463.9,205.7" fill="#1c2833"/><line x1="360.0" y1="210.0" x2="420.0" y2="106.1" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="420.0,106.1 418.6,117.0 411.2,112.7" fill="#1c2833"/><text x="432.0" y="190.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">60°</text><text x="300.0" y="160.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">120°</text><text x="360.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Linear pair</text><text x="360.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">(adjacent, outer sides opposite)</text><text x="360.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">60° + 120° = 180°</text><path d="M535,200 L580,200 A45,45 0 0 0 512.5,161.0 Z" fill="#f7ebcf"/><line x1="535.0" y1="200.0" x2="615.0" y2="200.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="615.0,200.0 604.9,204.3 604.9,195.7" fill="#1c2833"/><line x1="535.0" y1="200.0" x2="495.0" y2="130.7" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="495.0,130.7 503.8,137.4 496.4,141.6" fill="#1c2833"/><text x="565.0" y="150.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">120°</text><path d="M645,150 L690,150 A45,45 0 0 0 667.5,111.0 Z" fill="#dde8f3"/><line x1="645.0" y1="150.0" x2="710.0" y2="150.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="710.0,150.0 699.9,154.3 699.9,145.7" fill="#1c2833"/><line x1="645.0" y1="150.0" x2="677.5" y2="93.7" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><polygon points="677.5,93.7 676.1,104.6 668.7,100.3" fill="#1c2833"/><text x="679.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">60°</text><text x="615.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Supplementary,</text><text x="615.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">not adjacent</text><text x="615.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">120° + 60° = 180°</text><line x1="240.0" y1="20.0" x2="240.0" y2="270.0" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 5" stroke-linecap="round"/><line x1="485.0" y1="20.0" x2="485.0" y2="270.0" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 5" stroke-linecap="round"/></svg>