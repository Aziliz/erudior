<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" width="620" height="340" role="img"><title>Line l divides the plane into two shaded half-planes. P and Q are in the same half-plane and segment PQ does not touch l. R is in the other half-plane, and the dashed segment PR crosses l at a point X.</title><rect x="0" y="0" width="620" height="340" fill="#ffffff"/><polygon points="0.0,0.0 620.0,0.0 620.0,20.7 0.0,319.3" fill="#dde8f3" stroke="#1c2833" stroke-width="0" stroke-linejoin="round"/><polygon points="0.0,319.3 620.0,20.7 620.0,340.0 0.0,340.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="0" stroke-linejoin="round"/><line x1="0.0" y1="319.3" x2="620.0" y2="20.7" stroke="#1c2833" stroke-width="3" stroke-linecap="round"/><text x="590.0" y="54.7" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">ℓ</text><line x1="120.0" y1="120.0" x2="300.0" y2="60.0" stroke="#1c2833" stroke-width="2.5" stroke-linecap="round"/><line x1="120.0" y1="120.0" x2="380.0" y2="270.0" stroke="#1c2833" stroke-width="2.5" stroke-dasharray="8 6" stroke-linecap="round"/><circle cx="120.0" cy="120.0" r="5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="102.0" y="112.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">P</text><circle cx="300.0" cy="60.0" r="5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="300.0" y="46.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Q</text><circle cx="380.0" cy="270.0" r="5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="396.0" y="288.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">R</text><circle cx="253.7" cy="197.1" r="5" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/><text x="253.7" y="226.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">X</text><text x="150.0" y="40.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">one half-plane</text><text x="470.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">the other half-plane</text></svg>