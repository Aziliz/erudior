<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img"><title>Two drawings for the false proof that every triangle is isosceles. Left, the false drawing: point P, where the bisector of angle A meets the perpendicular bisector of BC, sits inside the triangle, and the perpendiculars from P land at E on side AB and F on side AC. Right, an accurate drawing of a triangle with AB shorter than AC: P lies outside the triangle below BC, E lands on side AB, but E lands on line AB extended beyond B, outside the triangle.</title><rect x="0" y="0" width="760" height="400" fill="#ffffff"/><polygon points="150.0,75.0 60.0,340.0 330.0,340.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><line x1="150.0" y1="75.0" x2="195.0" y2="255.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="195.0" y1="255.0" x2="195.0" y2="340.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="195.0" y1="255.0" x2="99.8" y2="222.7" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><line x1="195.0" y1="255.0" x2="247.9" y2="219.1" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><line x1="195.0" y1="255.0" x2="60.0" y2="340.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><line x1="195.0" y1="255.0" x2="330.0" y2="340.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><circle cx="150.0" cy="75.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="150.0" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">A</text><circle cx="60.0" cy="340.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="44.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">B</text><circle cx="330.0" cy="340.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="346.0" y="354.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">C</text><circle cx="195.0" cy="255.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="213.0" y="259.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">P</text><circle cx="195.0" cy="340.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="195.0" y="366.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">D</text><circle cx="99.8" cy="222.7" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="81.8" y="222.7" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">E</text><circle cx="247.9" cy="219.1" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="265.9" y="219.1" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">F</text><text x="195.0" y="22.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">The false drawing: P inside,</text><text x="195.0" y="40.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">E and F on the sides</text><polygon points="505.0,70.0 425.0,290.0 705.0,290.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><line x1="425.0" y1="290.0" x2="402.2" y2="352.7" stroke="#1c2833" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="505.0" y1="70.0" x2="565.0" y2="374.5" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-line