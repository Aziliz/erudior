<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="760" height="410" role="img"><title>Two drawings for the false proof that every triangle is isosceles. Left, the false drawing: point P, where the bisector of angle A meets the perpendicular bisector of BC, sits inside the triangle, and the perpendiculars from P land at E on side AB and F on side AC. Right, an accurate drawing of a triangle with AB shorter than AC: P lies outside the triangle below BC, E lands on side AB, but F lands on line AC beyond C.</title><rect x="0" y="0" width="760" height="410" fill="#ffffff"/><polygon points="200.0,60.0 60.0,330.0 330.0,330.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><line x1="200.0" y1="60.0" x2="195.0" y2="245.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="195.0" y1="245.0" x2="195.0" y2="330.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="195.0" y1="245.0" x2="123.3" y2="207.8" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><line x1="195.0" y1="245.0" x2="271.4" y2="208.2" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><line x1="195.0" y1="245.0" x2="60.0" y2="330.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><line x1="195.0" y1="245.0" x2="330.0" y2="330.0" stroke="#1c2833" stroke-width="1.5" stroke-linecap="round"/><circle cx="200.0" cy="60.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="200.0" y="48.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">A</text><circle cx="60.0" cy="330.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="44.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">B</text><circle cx="330.0" cy="330.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="346.0" y="344.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">C</text><circle cx="195.0" cy="245.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="213.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">P</text><circle cx="195.0" cy="330.0" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="195.0" y="356.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">D</text><circle cx="123.3" cy="207.8" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="105.3" y="207.8" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">E</text><circle cx="271.4" cy="208.2" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="289.4" y="208.2" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">F</text><text x="195.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">The false drawing: P inside,</text><text x="195.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">E and F on the sides</text><polygon points="503.2,71.2 420.0,300.0 711.2,300.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><line x1="420.0" y1="300.0" x2="396.3" y2="365.2" stroke="#1c2833" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round"/><line x1="503.2" y1="71.2" x2="565.6" y2="387.9" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round"/><line x1="565