-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">E</text><circle cx="689.1" cy="275.7" r="4.5" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><text x="707.1" y="281.7" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">F</text><text x="580.0" y="385.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">An accurate drawing: P is outside,</text><text x="580.0" y="401.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">and F lands on AC extended</text><line x1="390.0" y1="20.0" x2="390.0" y2="400.0" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 5" stroke-linecap="round"/></svg>