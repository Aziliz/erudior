<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img"><title>Four shaded regions. An oval region and a triangular region are convex: a segment joining two points inside stays inside. An L-shaped region and a ring are not convex: a dashed segment joining two of their points passes outside the region.</title><rect x="0" y="0" width="720" height="260" fill="#ffffff"/><ellipse cx="90" cy="115" rx="70" ry="50" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5"/><circle cx="55.0" cy="100.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><circle cx="130.0" cy="135.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><line x1="55.0" y1="100.0" x2="130.0" y2="135.0" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><polygon points="210.0,165.0 330.0,165.0 260.0,60.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><circle cx="240.0" cy="145.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><circle cx="290.0" cy="120.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><line x1="240.0" y1="145.0" x2="290.0" y2="120.0" stroke="#1c2833" stroke-width="2" stroke-linecap="round"/><polygon points="390.0,50.0 440.0,50.0 440.0,130.0 520.0,130.0 520.0,175.0 390.0,175.0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round"/><circle cx="415.0" cy="70.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><circle cx="500.0" cy="152.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><line x1="415.0" y1="70.0" x2="500.0" y2="152.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 650 55 A 60 60 0 1 0 650.01 55 Z M 650 85 A 30 30 0 1 1 649.99 85 Z" fill="#f8e1dc" fill-rule="evenodd" stroke="#1c2833" stroke-width="2.5"/><circle cx="610.0" cy="115.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><circle cx="690.0" cy="115.0" r="4" fill="#1c2833" stroke="#1c2833" stroke-width="1.5"/><line x1="610.0" y1="115.0" x2="690.0" y2="115.0" stroke="#1c2833" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><text x="90.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">convex</text><text x="270.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">convex</text><text x="455.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">not convex</text><text x="650.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">not convex</text><text x="180.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">Every segment joining two points stays inside.</text><text x="550.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">Some segment leaves the set.</text><line x1="360.0" y1="30.0" x2="360.0" y2="250.0" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 5" stroke-linecap="round"/></svg>