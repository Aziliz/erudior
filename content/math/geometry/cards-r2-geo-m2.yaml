# Round 2 cards for geo-m2 (core lessons 05-07 and honors lessons 07h1-07h3)
- {front: 'A true conditional as a picture', back: 'The hypothesis set sits inside the conclusion set. Anything in the outer set but not the inner one is a counterexample to the converse.', topic: Conditional statements}
- {front: 'From "if $p$, then $q$" and "$q$ is false"', back: 'Conclude $p$ is false (use the contrapositive). From "$q$ is true" or "$p$ is false", nothing follows.', topic: Deductive reasoning}
- {front: 'Flowchart (flow) proof', back: 'Each statement in a box with its reason; arrows show which statements each one depends on.', topic: Geometric proof}
# ---- honors 07h1
- {front: 'Rows in a truth table', back: '$2^n$ rows for $n$ simple statements: 4 for two, 8 for three.', topic: Symbolic logic}
- {front: 'Conjunction vs disjunction', back: '$p \wedge q$ ("and"): true only when both are true. $p \vee q$ ("or", inclusive): false only when both are false.', topic: Symbolic logic}
- {front: 'When is $p \to q$ false?', back: 'Only when $p$ is true and $q$ is false. With a false hypothesis it is (vacuously) true.', topic: Symbolic logic}
- {front: 'De Morgan''s laws', back: '$\sim(p \wedge q) \equiv \sim p \vee \sim q$; $\sim(p \vee q) \equiv \sim p \wedge \sim q$.', topic: Symbolic logic}
- {front: 'Negation of $p \to q$', back: '$p \wedge \sim q$: the hypothesis holds and the conclusion fails. Not the inverse, and not a conditional at all.', topic: Symbolic logic}
- {front: 'Another form of $p \to q$', back: '$\sim p \vee q$: either the hypothesis fails or the conclusion holds.', topic: Symbolic logic}
- {front: 'Negating "all" and "some"', back: 'Not (all A are B) = some A is not B. Not (some A is B) = no A is B.', topic: Symbolic logic}
- {front: 'Tautology vs contradiction', back: 'Tautology: true in every row ($p \vee \sim p$). Contradiction: false in every row ($p \wedge \sim p$).', topic: Symbolic logic}
- {front: 'Modus tollens', back: 'From $p \to q$ and $\sim q$, conclude $\sim p$. Valid.', topic: Symbolic logic}
- {front: 'Denying the antecedent', back: 'From $p \to q$ and $\sim p$, conclude $\sim q$. Invalid (the inverse error).', topic: Symbolic logic}
- {front: 'Valid vs sound', back: 'Valid: the conclusion is true whenever all premises are true (a matter of form). Sound: valid AND the premises are actually true.', topic: Symbolic logic}
# ---- honors 07h2
- {front: 'Proof by contrapositive', back: 'To prove $p \to q$, prove $\sim q \to \sim p$ directly. Useful when the conclusion is a "not" statement.', topic: Proof methods}
- {front: 'Proof by contradiction (indirect proof)', back: 'Assume the statement is false, reason to something impossible, and conclude the statement is true.', topic: Proof methods}
- {front: 'Negation of "at most one"', back: '"At least two". (Not "exactly two", not "none".)', topic: Proof methods}
- {front: 'Proof by cases', back: 'List cases that cover every possibility (they may overlap), and prove the conclusion in each.', topic: Proof methods}
- {front: 'Why $\sqrt{2}$ is irrational', back: 'If $\sqrt2 = a/b$ in lowest terms, then $a^2 = 2b^2$ makes $a$ even, then $b$ even: both even contradicts lowest terms.', topic: Proof methods}
- {front: 'If $n^2$ is even, then $n$ is even', back: 'Proved by contrapositive: if $n = 2k + 1$, then $n^2 = 2(2k^2 + 2k) + 1$ is odd.', topic: Proof methods}
- {front: 'What one example can do', back: 'Prove an existential statement, or disprove a universal one (a counterexample). It can never prove a universal statement.', topic: Proof methods}
- {front: 'Two lines meet in at most one point: why', back: 'If distinct lines shared two points, two different lines would pass through those points, but exactly one line does.', topic: Proof methods}
# ---- honors 07h3
- {front: 'Mathematical induction', back: 'Base case: prove $P(n_0)$. Inductive step: prove $P(k) \to P(k+1)$ for every $k \ge n_0$. Then $P(n)$ holds for all $n \ge n_0$.', topic: Mathematical induction}
- {front: 'Inductive hypothesis', back: 'The assumption $P(k)$ at the start of the inductive step. Legitimate because the step proves a conditional.', topic: Mathematical induction}
- {front: 'Why induction works', back: 'A smallest failure $m$ can''t be the base case, and $P(m - 1)$ true would force $P(m)$ by the step (well-ordering principle).', topic: Mathematical induction}
- {front: 'Sum of odd numbers that starts later', back: '$(2a + 1) + \dots + (2b - 1) = b^2 - a^2$, e.g. $11 + 13 + \dots + 39 = 20^2 - 5^2 = 375$.', topic: Mathematical induction}
- {front: 'Sum of the first $n$ odd numbers', back: '$1 + 3 + \dots + (2n - 1) = n^2$. Each L-shaped gnomon of $2k + 1$ squares grows a $k$-by-$k$ square to $(k + 1)$-by-$(k + 1)$.', topic: Mathematical induction}
- {front: 'Segments joining $n$ points, by induction', back: 'The new point adds $k$ segments: $\tfrac{k(k-1)}{2} + k = \tfrac{(k+1)k}{2}$.', topic: Mathematical induction}
- {front: 'Mathematical induction vs inductive reasoning', back: 'Inductive reasoning guesses a rule from cases (no proof). Mathematical induction is deductive: base case plus inductive step proves the rule for every $n$.', topic: Mathematical induction}
- {front: 'Induction pitfalls', back: 'No base case ($n^2 + n + 1$ "is even"); a step that fails for one $k$ (the all-horses-one-color joke breaks from 1 to 2).', topic: Mathematical induction}
