# Notecards — formulas, definitions, theorems and "when to use which"
# Module 1
- {front: The three undefined terms, back: 'Point, line and plane. They are described by postulates, not defined.', topic: Undefined terms}
- {front: 'Notation: $\overline{AB}$, $AB$, $\overrightarrow{AB}$, $\overleftrightarrow{AB}$', back: 'Segment, length of the segment (a number), ray starting at $A$, line.', topic: Undefined terms}
- {front: Two points determine…, back: 'exactly one line.', topic: Postulates}
- {front: Three noncollinear points determine…, back: 'exactly one plane.', topic: Postulates}
- {front: Intersection of two distinct planes, back: 'A line.', topic: Postulates}
- {front: Segment Addition Postulate, back: 'If $B$ is between $A$ and $C$, then $AB + BC = AC$.', topic: Postulates}
- {front: Skew lines, back: 'Lines that are not coplanar: they never meet and are not parallel.', topic: Undefined terms}
- {front: Distance on a number line, back: '$AB = |b - a|$', topic: Segments and midpoints}
- {front: Midpoint on a number line, back: '$\dfrac{a + b}{2}$', topic: Segments and midpoints}
- {front: Angle Addition Postulate, back: 'If $D$ is in the interior of $\angle ABC$, then $m\angle ABD + m\angle DBC = m\angle ABC$.', topic: Angle measure}
- {front: 'Acute, right, obtuse, straight angles', back: 'Less than $90^\circ$; exactly $90^\circ$; between $90^\circ$ and $180^\circ$; exactly $180^\circ$.', topic: Angle measure}
- {front: Complementary vs supplementary, back: 'Complementary angles sum to $90^\circ$; supplementary angles sum to $180^\circ$.', topic: Angle pairs}
- {front: Linear pair, back: 'Adjacent angles whose outer sides are opposite rays; they are supplementary.', topic: Angle pairs}
- {front: Vertical Angles Theorem, back: 'Vertical angles are congruent.', topic: Angle pairs}
- {front: Angles around a point, back: 'Sum to $360^\circ$.', topic: Angle pairs}
- {front: Perpendicular bisector construction, back: 'Equal arcs (more than half the segment) from both endpoints; the line through the two crossings.', topic: Constructions}
- {front: Why the angle-bisector construction works, back: 'The two triangles formed are congruent by SSS.', topic: Constructions}
- {front: Impossible compass-and-straightedge task, back: 'Trisecting an arbitrary angle.', topic: Constructions}
# Module 2
- {front: Conditional statement, back: '$p \to q$: "if $p$, then $q$". False only when $p$ is true and $q$ is false.', topic: Conditional statements}
- {front: Converse, back: '$q \to p$', topic: Conditional statements}
- {front: Inverse, back: '$\sim p \to \sim q$', topic: Conditional statements}
- {front: Contrapositive, back: '$\sim q \to \sim p$; always has the same truth value as $p \to q$.', topic: Conditional statements}
- {front: Biconditional, back: '$p \leftrightarrow q$ ("if and only if"): both $p \to q$ and $q \to p$ are true. Every good definition is one.', topic: Conditional statements}
- {front: How to disprove a conjecture, back: 'Give one counterexample: a case where the hypothesis is true and the conclusion is false.', topic: Inductive reasoning}
- {front: Law of Detachment, back: 'From $p \to q$ and $p$, conclude $q$.', topic: Deductive reasoning}
- {front: Law of Syllogism, back: 'From $p \to q$ and $q \to r$, conclude $p \to r$.', topic: Deductive reasoning}
- {front: Affirming the consequent (converse error), back: 'From $p \to q$ and $q$, you CANNOT conclude $p$.', topic: Deductive reasoning}
- {front: 'Reflexive, symmetric, transitive', back: '$a = a$; if $a = b$ then $b = a$; if $a = b$ and $b = c$ then $a = c$.', topic: Algebraic proof}
- {front: Congruent Supplements Theorem, back: 'Angles supplementary to the same (or congruent) angles are congruent.', topic: Geometric proof}
- {front: '$=$ vs $\cong$', back: 'Numbers (lengths, measures) are equal; figures (segments, angles) are congruent.', topic: Geometric proof}
- {front: Acceptable reasons in a proof, back: 'Given, definitions, postulates, properties, previously proved theorems. Never "it looks like it".', topic: Geometric proof}
# Module 3
- {front: 'Parallel lines: congruent angle pairs', back: 'Corresponding, alternate interior and alternate exterior angles.', topic: Parallel lines}
- {front: 'Parallel lines: supplementary angle pairs', back: 'Consecutive (same-side) interior angles.', topic: Parallel lines}
- {front: Proving lines parallel, back: 'Show corresponding, alternate interior or alternate exterior angles congruent, or consecutive interior angles supplementary (the converses).', topic: Proving lines parallel}
- {front: Playfair's axiom, back: 'Through a point not on a line there is exactly one parallel to the line.', topic: Parallel lines}
- {front: Slope, back: '$m = \dfrac{y_2 - y_1}{x_2 - x_1}$', topic: Slope}
- {front: Slopes of parallel lines, back: 'Equal.', topic: Slope}
- {front: Slopes of perpendicular lines, back: 'Negative reciprocals: $m_1 m_2 = -1$.', topic: Slope}
- {front: Point-slope form, back: '$y - y_1 = m(x - x_1)$', topic: Slope}
- {front: 'Distance from $(x_0, y_0)$ to $Ax + By + C = 0$', back: '$\dfrac{|Ax_0 + By_0 + C|}{\sqrt{A^2 + B^2}}$', topic: Perpendicular lines}
- {front: Slope of a vertical line, back: 'Undefined (horizontal lines have slope 0).', topic: Slope}
# Module 4
- {front: Triangle Angle Sum Theorem, back: 'The interior angles of a triangle add to $180^\circ$.', topic: Triangle angle sum}
- {front: Exterior Angle Theorem, back: 'An exterior angle equals the sum of the two remote interior angles.', topic: Triangle angle sum}
- {front: Acute angles of a right triangle, back: 'Complementary.', topic: Triangle angle sum}
- {front: Congruence shortcuts that work, back: 'SSS, SAS, ASA, AAS, HL (right triangles).', topic: SSS and SAS}
- {front: Congruence "shortcuts" that fail, back: 'SSA and AAA.', topic: SSS and SAS}
- {front: SAS requires…, back: 'the INCLUDED angle (between the two sides).', topic: SSS and SAS}
- {front: CPCTC, back: 'Corresponding Parts of Congruent Triangles are Congruent; use it only after proving the triangles congruent.', topic: CPCTC}
- {front: Third Angles Theorem, back: 'If two angles of one triangle are congruent to two angles of another, the third angles are congruent.', topic: Congruent figures}
- {front: Base Angles Theorem, back: 'If two sides of a triangle are congruent, the angles opposite them are congruent (and conversely).', topic: Isosceles triangles}
- {front: Base angle from vertex angle $v$, back: '$\dfrac{180^\circ - v}{2}$', topic: Isosceles triangles}
- {front: Vertex-angle bisector of an isosceles triangle, back: 'It is the perpendicular bisector of the base.', topic: Isosceles triangles}
- {front: Equilateral triangle angles, back: 'Each is $60^\circ$ (equilateral ⟺ equiangular).', topic: Isosceles triangles}
- {front: Triangle Inequality Theorem, back: 'Any two sides add to more than the third. Third side $x$: difference $< x <$ sum.', topic: Triangle inequalities}
- {front: Longest side of a triangle, back: 'Opposite the largest angle (and the largest angle is opposite the longest side).', topic: Triangle inequalities}
- {front: Hinge Theorem, back: 'Two pairs of equal sides: the larger included angle is opposite the longer third side.', topic: Triangle inequalities}
- {front: Indirect proof, back: 'Assume the opposite of the conclusion and reason to a contradiction.', topic: Triangle inequalities}
# Module 5
- {front: Perpendicular Bisector Theorem, back: 'A point is on the perpendicular bisector of a segment if and only if it is equidistant from the endpoints.', topic: Bisectors}
- {front: Angle Bisector Theorem (equidistance), back: 'A point on an angle bisector is equidistant from the sides of the angle.', topic: Bisectors}
- {front: Circumcenter, back: 'Where the perpendicular bisectors meet; equidistant from the vertices; center of the circumscribed circle.', topic: Points of concurrency}
- {front: Incenter, back: 'Where the angle bisectors meet; equidistant from the sides; center of the inscribed circle; always inside.', topic: Points of concurrency}
- {front: Centroid, back: 'Where the medians meet; $\tfrac23$ of the way from each vertex; average of the vertices.', topic: Medians and altitudes}
- {front: Orthocenter, back: 'Where the lines containing the altitudes meet.', topic: Medians and altitudes}
- {front: Circumcenter of a right triangle, back: 'The midpoint of the hypotenuse.', topic: Points of concurrency}
- {front: Inradius formula, back: '$r = \dfrac{K}{s}$ (area over semiperimeter).', topic: Points of concurrency}
- {front: Triangle Midsegment Theorem, back: 'A midsegment is parallel to the third side and half as long.', topic: Midsegments}
- {front: Interior angle sum of an $n$-gon, back: '$(n - 2) \cdot 180^\circ$', topic: Polygon angles}
- {front: Exterior angle sum of a convex polygon, back: '$360^\circ$ (one per vertex), for any number of sides.', topic: Polygon angles}
- {front: Each angle of a regular $n$-gon, back: 'Exterior $\tfrac{360^\circ}{n}$; interior $180^\circ - \tfrac{360^\circ}{n}$.', topic: Polygon angles}
- {front: Number of diagonals of an $n$-gon, back: '$\dfrac{n(n - 3)}{2}$', topic: Polygon angles}
- {front: Parallelogram properties, back: 'Opposite sides parallel and congruent; opposite angles congruent; consecutive angles supplementary; diagonals bisect each other.', topic: Parallelograms}
- {front: Quick test for a parallelogram, back: 'Diagonals bisect each other, or one pair of opposite sides is both parallel and congruent.', topic: Parallelograms}
- {front: Rectangle diagonals, back: 'Congruent (and they bisect each other).', topic: Special parallelograms}
- {front: Rhombus diagonals, back: 'Perpendicular, and they bisect the angles.', topic: Special parallelograms}
- {front: Trapezoid midsegment, back: '$\dfrac{b_1 + b_2}{2}$, parallel to the bases.', topic: Trapezoids and kites}
- {front: Isosceles trapezoid, back: 'Congruent legs, congruent base angles, congruent diagonals.', topic: Trapezoids and kites}
- {front: Kite properties, back: 'Perpendicular diagonals; one pair of opposite angles (between the unequal sides) congruent.', topic: Trapezoids and kites}
# Module 6
- {front: Cross Products Property, back: 'If $\tfrac{a}{b} = \tfrac{c}{d}$, then $ad = bc$.', topic: Proportions}
- {front: Geometric mean of $a$ and $b$, back: '$\sqrt{ab}$', topic: Proportions}
- {front: Similar polygons, back: 'Corresponding angles congruent and corresponding sides proportional.', topic: Similar polygons}
- {front: 'Scale factor $k$: lengths, areas, volumes', back: 'Lengths × $k$, areas × $k^2$, volumes × $k^3$.', topic: Similar polygons}
- {front: Triangle similarity tests, back: 'AA, SSS similarity, SAS similarity.', topic: Similarity tests}
- {front: Side Splitter Theorem, back: 'A line parallel to one side divides the other two proportionally: $\tfrac{AD}{DB} = \tfrac{AE}{EC}$.', topic: Proportional segments}
- {front: Triangle Angle Bisector Theorem, back: '$\dfrac{BD}{DC} = \dfrac{AB}{AC}$ when $\overline{AD}$ bisects $\angle A$.', topic: Proportional segments}
- {front: Pythagorean Theorem, back: '$a^2 + b^2 = c^2$ ($c$ = hypotenuse).', topic: Pythagorean theorem}
- {front: Classifying a triangle by sides ($c$ longest), back: '$c^2 = a^2 + b^2$ right; $c^2 < a^2 + b^2$ acute; $c^2 > a^2 + b^2$ obtuse.', topic: Pythagorean theorem}
- {front: Common Pythagorean triples, back: '3-4-5, 5-12-13, 8-15-17, 7-24-25 (and multiples).', topic: Pythagorean theorem}
- {front: 45°-45°-90° triangle, back: '$1 : 1 : \sqrt2$; hypotenuse $=$ leg $\cdot \sqrt2$.', topic: Special right triangles}
- {front: 30°-60°-90° triangle, back: '$1 : \sqrt3 : 2$ (short leg : long leg : hypotenuse).', topic: Special right triangles}
- {front: Equilateral triangle with side $s$, back: 'Height $\tfrac{\sqrt3}{2}s$; area $\tfrac{\sqrt3}{4}s^2$.', topic: Special right triangles}
- {front: Altitude to the hypotenuse, back: '$h = \sqrt{xy}$ (geometric mean of the two pieces); each leg $= \sqrt{c \cdot \text{adjacent piece}}$.', topic: Geometric mean}
- {front: SOH-CAH-TOA, back: '$\sin = \tfrac{\text{opp}}{\text{hyp}}$, $\cos = \tfrac{\text{adj}}{\text{hyp}}$, $\tan = \tfrac{\text{opp}}{\text{adj}}$', topic: Trigonometric ratios}
- {front: 'Exact values at $30^\circ$', back: '$\sin = \tfrac12$, $\cos = \tfrac{\sqrt3}{2}$, $\tan = \tfrac{\sqrt3}{3}$', topic: Trigonometric ratios}
- {front: 'Exact values at $45^\circ$', back: '$\sin = \cos = \tfrac{\sqrt2}{2}$, $\tan = 1$', topic: Trigonometric ratios}
- {front: 'Exact values at $60^\circ$', back: '$\sin = \tfrac{\sqrt3}{2}$, $\cos = \tfrac12$, $\tan = \sqrt3$', topic: Trigonometric ratios}
- {front: Cofunction identity, back: '$\sin\theta = \cos(90^\circ - \theta)$', topic: Trigonometric ratios}
- {front: Finding an angle from two sides, back: 'Use an inverse ratio: $\theta = \tan^{-1}\left(\tfrac{\text{opp}}{\text{adj}}\right)$, etc.', topic: Solving right triangles}
- {front: Angle of elevation vs depression, back: 'Both measured from the horizontal (up vs down); they are equal (alternate interior angles).', topic: Solving right triangles}
# Module 7
- {front: Arc measure, back: 'Minor arc = its central angle; major arc = $360^\circ$ − minor arc; semicircle = $180^\circ$.', topic: Arcs and arc length}
- {front: Arc length, back: '$\dfrac{\theta}{360^\circ} \cdot 2\pi r$, or $r\theta$ with $\theta$ in radians.', topic: Arcs and arc length}
- {front: Degrees to radians, back: 'Multiply by $\tfrac{\pi}{180}$; $180^\circ = \pi$ rad.', topic: Arcs and arc length}
- {front: Radius perpendicular to a chord, back: 'It bisects the chord and its arc.', topic: Chords}
- {front: 'Radius, half-chord, distance to center', back: 'They form a right triangle: $r^2 = (\tfrac{c}{2})^2 + d^2$.', topic: Chords}
- {front: Congruent chords, back: 'Same circle: congruent chords ⟺ congruent arcs ⟺ equidistant from the center.', topic: Chords}
- {front: Tangent and radius, back: 'A tangent is perpendicular to the radius at the point of tangency.', topic: Tangents}
- {front: Two tangents from one point, back: 'The tangent segments are congruent.', topic: Tangents}
- {front: Inscribed angle, back: 'Half its intercepted arc.', topic: Inscribed angles}
- {front: Angle inscribed in a semicircle, back: 'A right angle (Thales).', topic: Inscribed angles}
- {front: Cyclic quadrilateral, back: 'Opposite angles are supplementary.', topic: Inscribed angles}
- {front: Tangent–chord angle, back: 'Half the intercepted arc.', topic: Angles from secants and tangents}
- {front: Two chords crossing inside a circle (angle), back: '$\tfrac12$(sum of the intercepted arcs).', topic: Angles from secants and tangents}
- {front: Secants/tangents meeting outside (angle), back: '$\tfrac12$(far arc − near arc).', topic: Angles from secants and tangents}
- {front: Two tangents from $P$ (angle), back: '$m\angle P = 180^\circ -$ minor arc.', topic: Angles from secants and tangents}
- {front: Intersecting chords (lengths), back: '$AE \cdot EB = CE \cdot ED$', topic: Segment lengths in circles}
- {front: Two secants from a point (lengths), back: 'outside · whole = outside · whole', topic: Segment lengths in circles}
- {front: Tangent and secant from a point (lengths), back: 'tangent² = outside · whole', topic: Segment lengths in circles}
- {front: Equation of a circle, back: '$(x - h)^2 + (y - k)^2 = r^2$, center $(h, k)$, radius $r$.', topic: Equation of a circle}
- {front: General form to standard form, back: 'Complete the square in $x$ and in $y$, adding the same amounts to both sides.', topic: Equation of a circle}
# Module 8
- {front: Parallelogram area, back: '$A = bh$ (perpendicular height).', topic: Area of polygons}
- {front: Triangle area, back: '$A = \tfrac12 bh$, or $\tfrac12 ab\sin C$.', topic: Area of polygons}
- {front: Trapezoid area, back: '$A = \tfrac12(b_1 + b_2)h$', topic: Area of polygons}
- {front: Rhombus or kite area, back: '$A = \tfrac12 d_1 d_2$', topic: Area of polygons}
- {front: Heron's formula, back: '$A = \sqrt{s(s-a)(s-b)(s-c)}$, $s = \tfrac{a+b+c}{2}$', topic: Area of polygons}
- {front: Circle circumference and area, back: '$C = 2\pi r$, $A = \pi r^2$', topic: Area of circles and sectors}
- {front: Sector area, back: '$\dfrac{\theta}{360^\circ}\pi r^2$, or $\tfrac12 r^2\theta$ in radians.', topic: Area of circles and sectors}
- {front: Segment of a circle (area), back: 'Sector area − triangle area.', topic: Area of circles and sectors}
- {front: Regular polygon area, back: '$A = \tfrac12 aP$ (apothem × perimeter ÷ 2).', topic: Regular polygons}
- {front: Apothem of a regular $n$-gon with side $s$, back: '$a = \dfrac{s/2}{\tan(180^\circ/n)}$', topic: Regular polygons}
- {front: Prism and cylinder surface area, back: '$S = Ph + 2B$; cylinder $2\pi rh + 2\pi r^2$.', topic: Surface area}
- {front: Pyramid and cone surface area, back: '$S = \tfrac12 P\ell + B$; cone $\pi r\ell + \pi r^2$ ($\ell$ = slant height).', topic: Surface area}
- {front: Sphere surface area, back: '$S = 4\pi r^2$', topic: Surface area}
- {front: Slant height of a cone, back: '$\ell = \sqrt{r^2 + h^2}$', topic: Surface area}
- {front: Euler's formula, back: '$V - E + F = 2$ for convex polyhedra.', topic: Solids}
- {front: Prism and cylinder volume, back: '$V = Bh$; cylinder $\pi r^2 h$.', topic: Volume}
- {front: Pyramid and cone volume, back: '$V = \tfrac13 Bh$; cone $\tfrac13\pi r^2 h$.', topic: Volume}
- {front: Sphere volume, back: '$V = \tfrac43\pi r^3$', topic: Volume}
- {front: Cavalieri's Principle, back: 'Same height and equal cross-section areas at every level ⇒ equal volumes. (Oblique solids use perpendicular height.)', topic: Cavalieri's principle}
- {front: Cubic unit conversion, back: '$1 \text{ m}^3 = 1{,}000{,}000 \text{ cm}^3$; $1 \text{ L} = 1000 \text{ cm}^3$.', topic: Volume}
# Module 9
- {front: Distance formula, back: '$d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}$', topic: Distance and midpoint}
- {front: Midpoint formula, back: '$\left(\tfrac{x_1 + x_2}{2}, \tfrac{y_1 + y_2}{2}\right)$', topic: Distance and midpoint}
- {front: 'Point dividing $\overline{AB}$ in ratio $m : n$', back: '$A + \tfrac{m}{m+n}(B - A)$, applied to each coordinate.', topic: Distance and midpoint}
- {front: Coordinate proof placement tips, back: 'Vertex at the origin, side on the $x$-axis, use symmetry, and use $2a$, $2b$ when midpoints are needed.', topic: Coordinate proof}
- {front: 'Translation by $\langle a, b \rangle$', back: '$(x, y) \to (x + a, y + b)$', topic: Rigid motions}
- {front: Reflection in the $x$-axis / $y$-axis, back: '$(x, -y)$ / $(-x, y)$', topic: Rigid motions}
- {front: Reflection in $y = x$ / $y = -x$, back: '$(y, x)$ / $(-y, -x)$', topic: Rigid motions}
- {front: Rotation $90^\circ$ counterclockwise about the origin, back: '$(x, y) \to (-y, x)$', topic: Rigid motions}
- {front: Rotation $180^\circ$ about the origin, back: '$(x, y) \to (-x, -y)$', topic: Rigid motions}
- {front: Rotation $270^\circ$ counterclockwise about the origin, back: '$(x, y) \to (y, -x)$', topic: Rigid motions}
- {front: Rigid motions preserve…, back: 'Distance, angle measure, collinearity and parallelism (reflections reverse orientation).', topic: Rigid motions}
- {front: Dilation centered at the origin, back: '$(x, y) \to (kx, ky)$; lengths × $k$, angles unchanged.', topic: Dilations}
- {front: Congruent vs similar (transformations), back: 'Congruent: rigid motions map one onto the other. Similar: rigid motions and dilations.', topic: Dilations}
- {front: Two reflections, back: 'Parallel lines: a translation by twice the gap. Intersecting lines: a rotation by twice the angle.', topic: Compositions and symmetry}
- {front: Symmetries of a regular $n$-gon, back: '$n$ lines of symmetry; rotational symmetry with angle $\tfrac{360^\circ}{n}$.', topic: Compositions and symmetry}
# Module 10
- {front: Parts of an axiomatic system, back: 'Undefined terms, axioms, definitions, theorems.', topic: Axiomatic systems}
- {front: Consistent axiom system, back: 'Has no contradictions; shown by exhibiting a model.', topic: Axiomatic systems}
- {front: Independent axiom, back: 'Cannot be proved from the others; shown by a model where the others hold and it fails.', topic: Axiomatic systems}
- {front: Euclid's fifth postulate, back: 'If a transversal makes same-side interior angles summing to less than $180^\circ$, the lines meet on that side.', topic: Euclid's postulates}
- {front: Statements equivalent to the parallel postulate, back: 'Playfair''s axiom; triangle angle sum $= 180^\circ$; existence of non-congruent similar triangles; existence of a rectangle.', topic: Euclid's postulates}
- {front: 'Euclidean vs hyperbolic vs elliptic', back: 'Parallels through an outside point: 1, infinitely many, none. Triangle angle sum: $=$, $<$, $> 180^\circ$.', topic: Non-Euclidean geometry}
- {front: Lines on a sphere, back: 'Great circles.', topic: Non-Euclidean geometry}
- {front: Area of a spherical triangle, back: '$R^2 E$, with excess $E = A + B + C - 180^\circ$ in radians.', topic: Non-Euclidean geometry}
- {front: Geometric probability, back: 'Favorable length/area/volume ÷ total length/area/volume.', topic: Geometric probability}
- {front: Meeting problem setup, back: 'Treat the two random times as a point in a square; find the area of the favorable region.', topic: Geometric probability}
- {front: Buffon's needle ($\ell \le d$), back: '$P(\text{cross}) = \dfrac{2\ell}{\pi d}$', topic: Geometric probability}
