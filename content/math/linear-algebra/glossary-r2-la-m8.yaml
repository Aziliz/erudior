# Round 2 glossary terms for module la-m8 (honors lessons 32h1-32h3)
- term: matrix polynomial
  aliases: [polynomial in a matrix, q(A)]
  definition: 'For a polynomial $q(t) = c_0 + c_1t + \cdots + c_mt^m$ and a square matrix $A$, the matrix $q(A) = c_0I + c_1A + \cdots + c_mA^m$. If $A\mathbf{v} = \lambda\mathbf{v}$, then $q(A)\mathbf{v} = q(\lambda)\mathbf{v}$.'
  topic: Cayley–Hamilton theorem
- term: Cayley–Hamilton theorem
  aliases: [Cayley-Hamilton theorem, Cayley–Hamilton]
  definition: 'Every square matrix satisfies its own characteristic equation: if $p(\lambda) = \det(A - \lambda I)$, then $p(A) = 0$. For $2 \times 2$ matrices, $A^2 - (\operatorname{tr} A)A + (\det A)I = 0$.'
  topic: Cayley–Hamilton theorem
- term: annihilating polynomial
  aliases: [annihilating polynomials]
  definition: 'A polynomial $q$ with $q(A) = 0$. The characteristic polynomial is one (Cayley–Hamilton); every annihilating polynomial is a multiple of the minimal polynomial.'
  topic: Minimal polynomial
- term: minimal polynomial
  aliases: [minimal polynomials]
  definition: 'The monic polynomial $m$ of smallest degree with $m(A) = 0$. It divides the characteristic polynomial and has the same roots; $A$ is diagonalizable (over the reals) exactly when $m$ is a product of distinct real linear factors.'
  topic: Minimal polynomial
- term: defective
  aliases: [defective matrix, defective matrices]
  definition: 'Describes a square matrix with too few independent eigenvectors to form a basis: some eigenvalue has geometric multiplicity smaller than its algebraic multiplicity. Defective matrices are exactly the ones that are not diagonalizable over the complex numbers.'
  topic: Jordan form
- term: generalized eigenvector
  aliases: [generalized eigenvectors]
  definition: 'A nonzero vector $\mathbf{v}$ with $(A - \lambda I)^k\mathbf{v} = \mathbf{0}$ for some $k \ge 1$. Eigenvectors are the case $k = 1$.'
  topic: Jordan form
- term: Jordan chain
  aliases: [Jordan chains, chain of generalized eigenvectors]
  definition: 'Vectors $\mathbf{v}_1, \dots, \mathbf{v}_k$ with $(A - \lambda I)\mathbf{v}_1 = \mathbf{0}$ and $(A - \lambda I)\mathbf{v}_{j+1} = \mathbf{v}_j$, so $A\mathbf{v}_{j+1} = \lambda\mathbf{v}_{j+1} + \mathbf{v}_j$. The first vector is an eigenvector.'
  topic: Jordan form
- term: Jordan block
  aliases: [Jordan blocks]
  definition: 'A square matrix with one number $\lambda$ repeated on the diagonal, 1s just above the diagonal and zeros elsewhere; it equals $\lambda I + N$ with $N$ nilpotent.'
  topic: Jordan form
- term: nilpotent
  aliases: [nilpotent matrix, nilpotent matrices]
  definition: 'Describes a square matrix $N$ with $N^k = 0$ for some power $k$. Its only eigenvalue is 0.'
  topic: Jordan form
- term: Jordan form
  aliases: [Jordan canonical form, Jordan normal form]
  definition: 'A block diagonal matrix $J$ of Jordan blocks with $A = PJP^{-1}$. It exists for every matrix whose eigenvalues are all real (and, with complex numbers, for every square matrix) and is unique up to the order of the blocks.'
  topic: Jordan form
- term: Leslie matrix
  aliases: [Leslie matrices, Leslie model]
  definition: 'The matrix of an age-structured population model $\mathbf{x}_{k+1} = L\mathbf{x}_k$: fecundities across the first row, survival rates just below the diagonal, zeros elsewhere.'
  topic: Leslie models
- term: stable age distribution
  definition: 'The long-run shares of the age classes in a Leslie model: the positive eigenvector for the dominant eigenvalue, scaled so its entries add up to 1.'
  topic: Leslie models
- term: primitive matrix
  aliases: [primitive, primitive matrices]
  definition: 'A square matrix with nonnegative entries some power of which has all entries positive. A regular stochastic matrix is a primitive stochastic matrix.'
  topic: Perron–Frobenius theorem
- term: net reproductive number
  aliases: [$R_0$, R0]
  definition: 'In a Leslie model, $R_0 = f_1\ell_1 + f_2\ell_2 + \cdots$, the expected number of daughters of a newborn female over her lifetime ($\ell_i$ is the chance of surviving to class $i$). The population grows in the long run exactly when $R_0 > 1$.'
  topic: Leslie models
