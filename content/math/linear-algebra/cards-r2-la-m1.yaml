# Round 2 cards for la-m1 honors lessons
# 03h1 Proving geometry with vectors
- {front: 'Midpoint of $AB$ (vectors)', back: '$\mathbf{m} = \dfrac{\mathbf{a} + \mathbf{b}}{2}$', topic: Points and lines with vectors}
- {front: 'Point a fraction $t$ of the way from $A$ to $B$', back: '$\mathbf{a} + t(\mathbf{b} - \mathbf{a}) = (1 - t)\mathbf{a} + t\mathbf{b}$', topic: Points and lines with vectors}
- {front: 'Section formula: $R$ on $AB$ with $AR : RB = m : n$', back: '$\mathbf{r} = \dfrac{n\mathbf{a} + m\mathbf{b}}{m + n}$ (the weight on $\mathbf{a}$ is the part next to $B$)', topic: Points and lines with vectors}
- {front: 'Line through $P$ with direction $\mathbf{d}$', back: '$\mathbf{r}(t) = \mathbf{p} + t\mathbf{d}$, $t$ any real number', topic: Points and lines with vectors}
- {front: 'Test: are $A$, $B$, $C$ collinear?', back: 'Yes exactly when $\overrightarrow{AC} = k\,\overrightarrow{AB}$ for some scalar $k$ (with $A \ne B$)', topic: Points and lines with vectors}
- {front: 'Midsegment theorem (vector form)', back: '$\overrightarrow{MN} = \tfrac12\overrightarrow{BC}$: parallel to the third side and half as long', topic: Vector proofs}
- {front: 'Parallelogram $ABCD$ in vectors', back: '$\mathbf{a} + \mathbf{c} = \mathbf{b} + \mathbf{d}$: the diagonals share a midpoint; $\mathbf{d} = \mathbf{a} + \mathbf{c} - \mathbf{b}$', topic: Vector proofs}
- {front: 'Centroid of triangle $ABC$', back: '$\mathbf{g} = \dfrac{\mathbf{a} + \mathbf{b} + \mathbf{c}}{3}$, two-thirds of the way along each median from the vertex', topic: Vector proofs}
- {front: 'Varignon''s theorem', back: 'The midpoints of the sides of any quadrilateral form a parallelogram, since $\overrightarrow{PQ} = \overrightarrow{SR} = \tfrac12\overrightarrow{AC}$', topic: Vector proofs}
- {front: 'Vector proof: how to show two points coincide; how to show parallel', back: 'Show the two position-vector expressions are equal; show one vector is a scalar multiple of the other', topic: Vector proofs}
# 03h2 The Leontief input–output model
- {front: 'Entry $c_{ij}$ of a consumption matrix', back: 'Units of sector $i$''s output used to make one unit of sector $j$''s output (column $j$ = sector $j$''s inputs)', topic: Input–output model}
- {front: 'Intermediate demand', back: '$C\mathbf{x}$: what the sectors use up to produce $\mathbf{x}$', topic: Input–output model}
- {front: 'Leontief production equation', back: '$\mathbf{x} = C\mathbf{x} + \mathbf{d}$, so $(I - C)\mathbf{x} = \mathbf{d}$', topic: Input–output model}
- {front: 'Solve for production in the input–output model', back: '$\mathbf{x} = (I - C)^{-1}\mathbf{d}$ (or solve $(I - C)\mathbf{x} = \mathbf{d}$ by elimination)', topic: Input–output model}
- {front: 'Why $I - C$ and not $1 - C$?', back: '$\mathbf{x} - C\mathbf{x} = I\mathbf{x} - C\mathbf{x} = (I - C)\mathbf{x}$; a number minus a matrix is undefined', topic: Input–output model}
- {front: 'Who built the input–output model?', back: 'Wassily Leontief (1905–1999); Nobel Memorial Prize in Economic Sciences, 1973', topic: Input–output model}
- {front: 'Meaning of column $j$ of $(I - C)^{-1}$', back: 'Total production needed for one extra unit of final demand for sector $j$', topic: The Leontief inverse}
- {front: 'Effect of a demand change $\Delta\mathbf{d}$', back: '$\Delta\mathbf{x} = (I - C)^{-1}\Delta\mathbf{d}$', topic: The Leontief inverse}
- {front: 'Rounds of production', back: '$\mathbf{x} = \mathbf{d} + C\mathbf{d} + C^2\mathbf{d} + \cdots = (I - C)^{-1}\mathbf{d}$ when $C$ is productive', topic: The Leontief inverse}
- {front: 'Test for a productive consumption matrix', back: 'Nonnegative entries and every column sum below 1 (sufficient, not necessary); then $(I - C)^{-1} \ge 0$', topic: The Leontief inverse}
