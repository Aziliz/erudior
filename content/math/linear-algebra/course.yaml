id: math-linear-algebra
title: Linear Algebra
description: >-
  A first course in linear algebra, starting from high school vectors, elimination and
  matrix arithmetic and building through row reduction, span and independence, linear
  transformations, matrix algebra and factorizations, determinants, vector spaces,
  eigenvalues, orthogonality and least squares, symmetric matrices, quadratic forms and
  the singular value decomposition, with applications to networks, chemistry, graphics,
  Markov chains and regression.
revision: 4
released: true
changelog: Honors lessons for every module, pictures and diagrams in every lesson, and new question types (fill in the blank, matching, labeling, ordering); corrections from a second full review of every lesson, question and drill; clearer graphs; answers shown at the precision each problem asks for.
