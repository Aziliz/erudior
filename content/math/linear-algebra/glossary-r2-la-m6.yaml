# Round 2 glossary for la-m6 (Determinants): honors lessons 21h1 and 21h2

- term: permutation
  aliases: [permutations]
  definition: 'A rearrangement $\sigma = (\sigma(1), \dots, \sigma(n))$ of the numbers $1, \dots, n$; there are $n!$ of them.'
  topic: Permutation formula
- term: inversion
  aliases: [inversions]
  definition: 'A pair of positions $i < j$ in a permutation whose entries are out of order, $\sigma(i) > \sigma(j)$.'
  topic: Permutation formula
- term: sign of a permutation
  aliases: [sgn, signature of a permutation]
  definition: '$\operatorname{sgn}\sigma = (-1)^{\text{number of inversions}}$: $+1$ for an even permutation, $-1$ for an odd one. Swapping two entries flips it.'
  topic: Permutation formula
- term: even permutation
  aliases: [even permutations]
  definition: 'A permutation with an even number of inversions (sign $+1$), such as the identity or $(2, 3, 1)$.'
  topic: Permutation formula
- term: odd permutation
  aliases: [odd permutations]
  definition: 'A permutation with an odd number of inversions (sign $-1$), such as a single swap $(2, 1, 3)$.'
  topic: Permutation formula
- term: transposition
  aliases: [transpositions]
  definition: 'A permutation that swaps two entries and leaves the rest alone; applying one changes the sign of a permutation.'
  topic: Permutation formula
- term: permutation formula
  aliases: [Leibniz formula, Leibniz formula for determinants]
  definition: '$\det A = \sum_\sigma \operatorname{sgn}(\sigma)\, a_{1\sigma(1)}a_{2\sigma(2)}\cdots a_{n\sigma(n)}$, a sum of $n!$ signed products that each use one entry from every row and every column.'
  topic: Permutation formula
- term: multilinear
  aliases: [multilinearity, linear in each row]
  definition: 'Linear in each row separately when the other rows are held fixed; the determinant is multilinear in the rows (and in the columns).'
  topic: Defining properties of the determinant
- term: alternating
  aliases: [alternating property]
  definition: 'A function of the rows is alternating if swapping two rows multiplies it by $-1$; it is then 0 whenever two rows are equal.'
  topic: Defining properties of the determinant
- term: Vandermonde determinant
  definition: 'The determinant of the matrix with rows $(1, x_i, x_i^2, \dots, x_i^{n-1})$; it equals $\prod_{i < j}(x_j - x_i)$, which is nonzero exactly when the $x_i$ are distinct.'
  topic: Defining properties of the determinant
- term: cross product
  aliases: [vector product, 'u × v']
  definition: '$\mathbf{u} \times \mathbf{v} = (u_2v_3 - u_3v_2,\; u_3v_1 - u_1v_3,\; u_1v_2 - u_2v_1)$ for vectors in $\mathbb{R}^3$: perpendicular to both, with length equal to the area of the parallelogram they span.'
  topic: Cross product
- term: scalar triple product
  aliases: [triple product]
  definition: '$\mathbf{w} \cdot (\mathbf{u} \times \mathbf{v}) = \det[\,\mathbf{u} \;\; \mathbf{v} \;\; \mathbf{w}\,]$; its absolute value is the volume of the parallelepiped on the three vectors.'
  topic: Cross product
- term: right-hand rule
  definition: 'Curl the fingers of your right hand from $\mathbf{u}$ toward $\mathbf{v}$; your thumb points along $\mathbf{u} \times \mathbf{v}$.'
  topic: Cross product
- term: orientation
  aliases: [orientations]
  definition: 'The sign of a determinant read as a direction of turning: for points $\mathbf{p}, \mathbf{q}, \mathbf{r}$ in the plane, $\det[\,\mathbf{q} - \mathbf{p} \;\; \mathbf{r} - \mathbf{p}\,] > 0$ means counterclockwise (a left turn), $< 0$ clockwise, $= 0$ collinear.'
  topic: Orientation and polygon area
- term: shoelace formula
  aliases: [surveyor's formula]
  definition: 'The area of a polygon with corners $(x_i, y_i)$ listed counterclockwise is $\tfrac12\sum(x_iy_{i+1} - x_{i+1}y_i)$, wrapping around from the last corner to the first.'
  topic: Orientation and polygon area
- term: signed area
  definition: 'Area with a sign that records orientation: positive for a region traced counterclockwise, negative for clockwise; $\det[\,\mathbf{u} \;\; \mathbf{v}\,]$ is the signed area of the parallelogram on $\mathbf{u}, \mathbf{v}$.'
  topic: Orientation and polygon area
