- {front: 'Is $\mathbf{b}$ a linear combination of $\mathbf{a}_1, \dots, \mathbf{a}_n$?', back: 'Yes exactly when $[\,\mathbf{a}_1 \cdots \mathbf{a}_n \;\; \mathbf{b}\,]$ is consistent', topic: Linear combinations}
