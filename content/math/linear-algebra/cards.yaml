- {front: 'Matrix of $ax_1^2 + bx_1x_2 + cx_2^2$', back: '$\begin{bmatrix} a & b/2 \\ b/2 & c\end{bmatrix}$', topic: Quadratic forms}
- {front: 'Principal axes theorem', back: '$\mathbf{x} = P\mathbf{y}$ (orthonormal eigenvectors) gives $\mathbf{x}^TA\mathbf{x} = \sum\lambda_iy_i^2$', topic: Quadratic forms}
- {front: 'Classify a quadratic form by eigenvalues', back: 'All $> 0$: positive definite; all $< 0$: negative definite; mixed signs: indefinite; all $\ge 0$: positive semidefinite; all $\le 0$: negative semidefinite', topic: Quadratic forms}
- {front: 'Max and min of $\mathbf{x}^TA\mathbf{x}$ on $\|\mathbf{x}\| = 1$', back: 'Largest and smallest eigenvalues of $A$ (at unit eigenvectors)', topic: Quadratic forms}
- {front: '$2 \times 2$ determinant test for quadratic forms', back: '$\det < 0$: indefinite; $\det > 0$ and $a > 0$: positive definite; $\det > 0$ and $a < 0$: negative definite', topic: Quadratic forms}
- {front: 'Singular values of $A$', back: '$\sigma_i = \sqrt{\lambda_i(A^TA)}$, decreasing; $\sigma_i = \|A\mathbf{v}_i\|$', topic: Singular value decomposition}
- {front: 'SVD', back: '$A = U\Sigma V^T$: $V$ eigenvectors of $A^TA$, $\mathbf{u}_i = A\mathbf{v}_i/\sigma_i$, $\Sigma$ same shape as $A$', topic: Singular value decomposition}
- {front: 'Rank from the SVD', back: 'Number of nonzero singular values', topic: Singular value decomposition}
- {front: 'Condition number', back: '$\sigma_1/\sigma_n$ (invertible $A$); large means sensitive to errors', topic: Singular value decomposition}
- {front: 'Best rank-$k$ approximation', back: '$\sigma_1\mathbf{u}_1\mathbf{v}_1^T + \cdots + \sigma_k\mathbf{u}_k\mathbf{v}_k^T$', topic: Singular value decomposition}

