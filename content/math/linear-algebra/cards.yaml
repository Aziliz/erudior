- {front: 'Reduced echelon form (RREF)', back: 'Echelon form plus: leading entries are 1 and are the only nonzero entries in their columns', topic: Echelon forms}
- {front: 'Which form is unique: echelon or reduced echelon?', back: 'Only the reduced echelon form', topic: Echelon forms}
- {front: 'Pivot position', back: 'Location of a leading 1 in the RREF of $A$', topic: Echelon forms}
- {front: 'Maximum number of pivots of an $m \times n$ matrix', back: '$\min(m, n)$', topic: Echelon forms}
- {front: 'Forward vs backward phase of row reduction', back: 'Forward: clear below pivots (echelon form). Backward: clear above pivots from the right, scale to 1 (RREF).', topic: Row reduction}

# Existence and uniqueness
- {front: 'When is a linear system consistent?', back: 'When the last column of the augmented matrix is not a pivot column', topic: Existence and uniqueness}
- {front: 'Consistent system: when is the solution unique?', back: 'When there are no free variables', topic: Existence and uniqueness}
- {front: 'More unknowns than equations', back: 'A free variable is forced: no solution or infinitely many', topic: Existence and uniqueness}
- {front: 'Basic vs free variables', back: 'Basic: pivot columns. Free: non-pivot columns of the coefficient matrix.', topic: General solution}

# Applications
- {front: 'Network flow rule', back: 'At each node, flow in = flow out', topic: Applications of linear systems}
- {front: 'Balancing a chemical equation', back: 'One homogeneous equation per element; pick the free variable to make all coefficients the smallest whole numbers', topic: Applications of linear systems}
