<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360" role="img"><title>Two vectors u and v in a horizontal plane, the parallelogram they span, and their cross product pointing straight up</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="520" height="360" fill="#ffffff"/><polygon points="46.4,304.4 372.0,304.4 507.2,210.8 181.6,210.8" fill="#f4f6f8" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 4"/><polygon points="120.0,290.0 296.0,290.0 409.0,227.0 233.0,227.0" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><line x1="120.0" y1="290.0" x2="296.0" y2="290.0" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/><line x1="120.0" y1="290.0" x2="233.0" y2="227.0" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/><line x1="120.0" y1="290.0" x2="120.0" y2="96.4" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/><polyline points="134.0,290.0 134.0,276.0 120.0,276.0" fill="none" stroke="#1c2833" stroke-width="1.5"/><path d="M 214.7 282.4 A 95 95 0 0 0 205.6 248.8" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="234.4" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">u</text><text x="171.8" y="252.2" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">v</text><text x="134.0" y="140.4" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="italic">u × v</text><text x="330.4" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">area = |u × v|</text><text x="260.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">u × v is perpendicular to u and v; u → v turns counterclockwise seen from its tip</text></svg>
