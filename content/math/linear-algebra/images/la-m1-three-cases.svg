<text x="390.0" y="32.0" font-size="18" text-anchor="middle" font-weight="bold">Two lines in the plane: three possibilities</text>
<text x="140.0" y="296.0" font-size="17" text-anchor="middle" font-weight="bold">One solution</text>
<text x="140.0" y="318.0" font-size="15" text-anchor="middle">lines cross once</text>
<text x="390.0" y="296.0" font-size="17" text-anchor="middle" font-weight="bold">No solution</text>
<text x="390.0" y="318.0" font-size="15" text-anchor="middle">parallel lines</text>
<text x="640.0" y="296.0" font-size="17" text-anchor="middle" font-weight="bold">Infinitely many</text>
