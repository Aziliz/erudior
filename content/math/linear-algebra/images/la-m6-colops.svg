<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" width="740" height="300" role="img"><title>Three column operations on the parallelogram spanned by u and v: a shear keeps the area, scaling v by 2 doubles it, and swapping u and v reverses the orientation</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="740" height="300" fill="#ffffff"/><text x="125.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Shear: v → v + u</text><text x="125.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">same base and height: area 6 → 6</text><polygon points="25.0,210.0 100.0,210.0 125.0,160.0 50.0,160.0" fill="none" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="25.0,210.0 100.0,210.0 200.0,160.0 125.0,160.0" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><line x1="25.0" y1="210.0" x2="100.0" y2="210.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><line x1="25.0" y1="210.0" x2="125.0" y2="160.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="65.0" y="232.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">u</text><text x="140.0" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">v + u</text><text x="42.5" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">v</text><text x="365.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Scale: v → 2v</text><text x="365.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">area 6 → area 12</text><polygon points="265.0,210.0 340.0,210.0 365.0,160.0 290.0,160.0" fill="none" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 4"/><polygon points="265.0,210.0 340.0,210.0 390.0,110.0 315.0,110.0" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><polygon points="265.0,210.0 340.0,210.0 365.0,160.0 290.0,160.0" fill="none" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="265.0" y1="210.0" x2="340.0" y2="210.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><line x1="265.0" y1="210.0" x2="315.0" y2="110.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="305.0" y="232.5" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">u</text><text x="280.0" y="120.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">2v</text><text x="595.0" y="32.0" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1c2833" text-anchor="middle" font-weight="bold" font-style="normal">Swap u and v</text><text x="595.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">det 6 → det −6</text><polygon points="495.0,210.0 570.0,210.0 595.0,160.0 520.0,160.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><line x1="495.0" y1="210.0" x2="570.0" y2="210.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><line x1="495.0" y1="210.0" x2="520.0" y2="160.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="535.0" y="232.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">u (now second)</text><text x="510.0" y="147.5" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">v (now first)</text><path d="M 510.7 178.7 A 35.0 35.0 0 0 1 529.7 205.8" fill="none" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="592.5" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">turn is</text><text x="592.5" y="201.2" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1c2833" text-anchor="start" font-weight="normal" font-style="normal">clockwise</text></svg>
