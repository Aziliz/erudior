<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="sans-serif" fill="#1c2833">
<rect width="640" height="500" fill="#ffffff"/>
<text x="320.0" y="34" font-size="18" text-anchor="middle" font-weight="bold">Hamming (7,4) code: three parity checks</text>
<circle cx="255" cy="210" r="118" fill="#dde8f3" fill-opacity="0.55" stroke="#1c2833" stroke-width="2.5"/>
<circle cx="385" cy="210" r="118" fill="#dcf0e3" fill-opacity="0.55" stroke="#1c2833" stroke-width="2.5"/>
<circle cx="320" cy="320" r="118" fill="#f7ebcf" fill-opacity="0.55" stroke="#1c2833" stroke-width="2.5"/>
<text x="120" y="92" font-size="17" text-anchor="middle">check 1</text>
<text x="520" y="92" font-size="17" text-anchor="middle">check 2</text>
<text x="452" y="410" font-size="17" text-anchor="start">check 4</text>
<text x="195" y="183" font-size="22" text-anchor="middle" font-weight="bold" font-style="italic">1</text>
<text x="445" y="183" font-size="22" text-anchor="middle" font-weight="bold" font-style="italic">2</text>
<text x="320" y="393" font-size="22" text-anchor="middle" font-weight="bold" font-style="italic">4</text>
<text x="320" y="173" font-size="22" text-anchor="middle" font-weight="bold" >3</text>
<text x="262" y="298" font-size="22" text-anchor="middle" font-weight="bold" >5</text>
<text x="378" y="298" font-size="22" text-anchor="middle" font-weight="bold" >6</text>
<text x="320" y="258" font-size="22" text-anchor="middle" font-weight="bold" >7</text>
<text x="320.0" y="478" font-size="15" text-anchor="middle">Bits 1, 2 and 4 are parity bits; bits 3, 5, 6 and 7 carry the data.</text>
<text x="320.0" y="456" font-size="15" text-anchor="middle">Each circle must hold an even number of 1s.</text>
</svg>