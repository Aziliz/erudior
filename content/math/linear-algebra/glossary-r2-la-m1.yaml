# Round 2 glossary for la-m1 honors lessons
- term: midpoint formula
  definition: 'The midpoint of segment $AB$ has position vector $\mathbf{m} = \frac{\mathbf{a} + \mathbf{b}}{2}$: average the coordinates.'
  topic: Points and lines with vectors
- term: section formula
  definition: 'The point $R$ on segment $AB$ with $AR : RB = m : n$ has position vector $\mathbf{r} = \frac{n\mathbf{a} + m\mathbf{b}}{m + n}$; it is $\frac{m}{m+n}$ of the way from $A$ to $B$.'
  topic: Points and lines with vectors
- term: direction vector
  aliases: [direction vectors]
  definition: 'A nonzero vector $\mathbf{d}$ along a line; the line through point $P$ is $\mathbf{r}(t) = \mathbf{p} + t\mathbf{d}$ for all real $t$.'
  topic: Points and lines with vectors
- term: collinear
  definition: 'Lying on one line. $A$, $B$, $C$ (with $A \ne B$) are collinear exactly when $\overrightarrow{AC}$ is a scalar multiple of $\overrightarrow{AB}$.'
  topic: Points and lines with vectors
- term: midsegment
  aliases: [midsegments]
  definition: 'The segment joining the midpoints of two sides of a triangle; it is parallel to the third side and half as long.'
  topic: Vector proofs
- term: median
  aliases: [medians, median of a triangle]
  definition: 'A segment joining a vertex of a triangle to the midpoint of the opposite side.'
  topic: Vector proofs
- term: centroid
  definition: 'The point where the three medians of a triangle meet, $\mathbf{g} = \frac{\mathbf{a} + \mathbf{b} + \mathbf{c}}{3}$; it is two-thirds of the way along each median from the vertex.'
  topic: Vector proofs
- term: input–output model
  aliases: [input-output model, Leontief model, Leontief input–output model, input–output analysis]
  definition: 'A model of an economy in which production $\mathbf{x}$ must cover what the sectors use up, $C\mathbf{x}$, plus final demand $\mathbf{d}$: $\mathbf{x} = C\mathbf{x} + \mathbf{d}$, so $(I - C)\mathbf{x} = \mathbf{d}$.'
  topic: Input–output model
- term: consumption matrix
  definition: 'In the input–output model, the matrix $C$ whose entry $c_{ij}$ is the amount of sector $i$''s output used to make one unit of sector $j$''s output; column $j$ is sector $j$''s list of inputs.'
  topic: Input–output model
- term: production vector
  definition: 'In the input–output model, the vector $\mathbf{x}$ of total output of each sector.'
  topic: Input–output model
- term: intermediate demand
  definition: 'In the input–output model, $C\mathbf{x}$: the output the sectors use up in producing $\mathbf{x}$.'
  topic: Input–output model
- term: final demand
  definition: 'In the input–output model, the vector $\mathbf{d}$ of output wanted outside production (households, government, exports).'
  topic: Input–output model
- term: Leontief inverse
  definition: 'The matrix $(I - C)^{-1}$. Column $j$ is the total production needed to deliver one extra unit of final demand for sector $j$.'
  topic: The Leontief inverse
- term: productive
  aliases: [productive consumption matrix, productive economy]
  definition: 'A consumption matrix $C$ is productive when every nonnegative final demand can be met by nonnegative production. If $C$ has nonnegative entries and every column sum is below 1, it is productive and $(I - C)^{-1}$ has no negative entries.'
  topic: The Leontief inverse
