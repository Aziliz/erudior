# Module 5 drills

- id: la-mat-mult23
  title: Multiply a 2×3 matrix by a 3×2 matrix
  topic: Matrix multiplication
  vars:
    a11: {min: -3, max: 3}
    a12: {min: -3, max: 3}
    a13: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a22: {min: -3, max: 3}
    a23: {min: -3, max: 3}
    b11: {min: -3, max: 3}
    b12: {min: -3, max: 3}
    b21: {min: -3, max: 3}
    b22: {min: -3, max: 3}
    b31: {min: -3, max: 3}
    b32: {min: -3, max: 3}
  calc:
    r11: a11*b11 + a12*b21 + a13*b31 + 0
    r12: a11*b12 + a12*b22 + a13*b32 + 0
    r21: a21*b11 + a22*b21 + a23*b31 + 0
    r22: a21*b12 + a22*b22 + a23*b32 + 0
  prompt: |-
    Compute $AB$ for $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23}\end{bmatrix}$ and $B = \begin{bmatrix} {b11} & {b12} \\ {b21} & {b22} \\ {b31} & {b32}\end{bmatrix}$.
  answers:
    - {name: r11, label: 'row 1, col 1'}
    - {name: r12, label: 'row 1, col 2'}
    - {name: r21, label: 'row 2, col 1'}
    - {name: r22, label: 'row 2, col 2'}
  solution: |-
    $(2 \times 3)(3 \times 2)$ gives a $2 \times 2$ matrix. Each entry is a row of $A$ times a column of $B$, e.g. $(1,1)$: $({a11})({b11}) + ({a12})({b21}) + ({a13})({b31}) = {r11}$.
    $AB =$ **$\begin{bmatrix} {r11} & {r12} \\ {r21} & {r22}\end{bmatrix}$**.

- id: la-mat-power
  title: Cube a 2×2 matrix
  topic: Matrix multiplication
  vars:
    a11: {min: -2, max: 2}
    a12: {min: -2, max: 2}
    a21: {min: -2, max: 2}
    a22: {min: -2, max: 2}
  calc:
    s11: a11*a11 + a12*a21 + 0
    s12: a11*a12 + a12*a22 + 0
    s21: a21*a11 + a22*a21 + 0
    s22: a21*a12 + a22*a22 + 0
    c11: s11*a11 + s12*a21 + 0
    c12: s11*a12 + s12*a22 + 0
    c21: s21*a11 + s22*a21 + 0
    c22: s21*a12 + s22*a22 + 0
  where: ["a12 != 0 or a21 != 0"]
  prompt: |-
    Compute $A^3$ for $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$.
  answers:
    - {name: c11, label: 'row 1, col 1'}
    - {name: c12, label: 'row 1, col 2'}
    - {name: c21, label: 'row 2, col 1'}
    - {name: c22, label: 'row 2, col 2'}
  solution: |-
    First $A^2 = AA = \begin{bmatrix} {s11} & {s12} \\ {s21} & {s22}\end{bmatrix}$. Then $A^3 = A^2A =$ **$\begin{bmatrix} {c11} & {c12} \\ {c21} & {c22}\end{bmatrix}$**. (Cubing each entry would be wrong: matrix powers are repeated matrix products.)

- id: la-homog
  title: Translate, then transform, in homogeneous coordinates
  topic: Computer graphics
  vars:
    px: {min: -4, max: 4}
    py: {min: -4, max: 4}
    hh: {min: -3, max: 3}
    kk: {min: -3, max: 3}
    op:
      choices:
        - {label: 'rotate $90^\circ$ counterclockwise about the origin', value: 0}
        - {label: 'rotate $180^\circ$ about the origin', value: 1}
        - {label: 'reflect across the $x$-axis', value: 2}
        - {label: 'scale by a factor of 2 from the origin', value: 3}
  where: ["hh != 0 or kk != 0"]
  calc:
    tx: px + hh + 0
    ty: py + kk + 0
    m11: if(op == 0, 0, if(op == 1, -1, if(op == 2, 1, 2))) + 0
    m12: if(op == 0, -1, 0) + 0
    m21: if(op == 0, 1, 0) + 0
    m22: if(op == 0, 0, if(op == 1, -1, if(op == 2, -1, 2))) + 0
    qx: m11*(px + hh) + m12*(py + kk) + 0
    qy: m21*(px + hh) + m22*(py + kk) + 0
    c13: m11*hh + m12*kk + 0
    c23: m21*hh + m22*kk + 0
  prompt: |-
    A graphics program first translates by $({hh}, {kk})$ and then applies a map that will {op}. Where does the point $({px}, {py})$ end up?
  answers:
    - {name: qx, label: '$x$'}
    - {name: qy, label: '$y$'}
  solution: |-
    In homogeneous coordinates the composite matrix is (second map)(translation):
    $$\begin{bmatrix} {m11} & {m12} & 0 \\ {m21} & {m22} & 0 \\ 0 & 0 & 1\end{bmatrix}\begin{bmatrix} 1 & 0 & {hh} \\ 0 & 1 & {kk} \\ 0 & 0 & 1\end{bmatrix} = \begin{bmatrix} {m11} & {m12} & {c13} \\ {m21} & {m22} & {c23} \\ 0 & 0 & 1\end{bmatrix}.$$
    Step by step: the translation gives $({tx}, {ty})$, and the second map sends that to **({qx}, {qy})**.

- id: la-inv3
  title: First column of a 3×3 inverse
  topic: Matrix inverse
  vars:
    l21: {min: -2, max: 2}
    l31: {min: -2, max: 2}
    l32: {min: -2, max: 2}
    u12: {min: -2, max: 2}
    u13: {min: -2, max: 2}
    u23: {min: -2, max: 2}
  where: ["l21 != 0 or l31 != 0", "u12 != 0 or u23 != 0"]
  calc:
    a12: u12 + 0
    a13: u13 + 0
    a21: l21 + 0
    a22: l21*u12 + 1 + 0
    a23: l21*u13 + u23 + 0
    a31: l31 + 0
    a32: l31*u12 + l32 + 0
    a33: l31*u13 + l32*u23 + 1 + 0
    mm: l21*l32 - l31 + 0
    i11: 1 + u12*l21 + (u12*u23 - u13)*(l21*l32 - l31) + 0
    i21: -l21 - u23*(l21*l32 - l31) + 0
    i31: l21*l32 - l31 + 0
  prompt: |-
    Find the first column of $A^{-1}$ for $A = \begin{bmatrix} 1 & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$. (Its determinant is 1, so the inverse has integer entries.)
  answers:
    - {name: i11, label: 'row 1'}
    - {name: i21, label: 'row 2'}
    - {name: i31, label: 'row 3'}
  solution: |-
    The first column of $A^{-1}$ is the solution of $A\mathbf{x} = \mathbf{e}_1$, so row-reduce $[\,A \;\; \mathbf{e}_1\,]$ (or all of $[\,A \;\; I\,]$). The result is $\mathbf{x} =$ **$({i11}, {i21}, {i31})$**.
    Check row 1 of $A$ times $\mathbf{x}$: ${i11} + ({a12})({i21}) + ({a13})({i31}) = 1$. ✓

- id: la-inv-solve
  title: Solve a 2×2 system with the inverse
  topic: Matrix inverse
  vars:
    a11: {min: -5, max: 5}
    a12: {min: -5, max: 5}
    a21: {min: -5, max: 5}
    a22: {min: -5, max: 5}
    b1: {min: -6, max: 6}
    b2: {min: -6, max: 6}
  where: ["a11*a22 - a12*a21 != 0", "abs(a11*a22 - a12*a21) <= 10", "b1 != 0 or b2 != 0"]
  calc:
    det: a11*a22 - a12*a21 + 0
    n12: -a12 + 0
    n21: -a21 + 0
    x1: (a22*b1 - a12*b2)/(a11*a22 - a12*a21) + 0
    x2: (-a21*b1 + a11*b2)/(a11*a22 - a12*a21) + 0
    t1: a22*b1 - a12*b2 + 0
    t2: -a21*b1 + a11*b2 + 0
  prompt: |-
    Use $A^{-1}$ to solve $A\mathbf{x} = \mathbf{b}$ for $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ and $\mathbf{b} = \begin{bmatrix} {b1} \\ {b2}\end{bmatrix}$. Give exact fractions.
  answers:
    - {name: x1, label: '$x_1 =$', kind: fraction, lowestTerms: true}
    - {name: x2, label: '$x_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    $\det A = {det}$, so $A^{-1} = \dfrac{1}{{det}}\begin{bmatrix} {a22} & {n12} \\ {n21} & {a11}\end{bmatrix}$ and
    $$\mathbf{x} = A^{-1}\mathbf{b} = \frac{1}{{det}}\begin{bmatrix} {t1} \\ {t2}\end{bmatrix} = \begin{bmatrix} {x1:texfrac} \\ {x2:texfrac}\end{bmatrix}.$$
    **Answer:** $x_1 = {x1:texfrac}$, $x_2 = {x2:texfrac}$.

- id: la-elem
  title: Row operation as an elementary matrix
  topic: Elementary matrices
  vars:
    pr:
      choices:
        - {label: 'R_2 \leftarrow R_2', value: 0}
        - {label: 'R_3 \leftarrow R_3', value: 1}
        - {label: 'R_3 \leftarrow R_3', value: 2}
    km: {choices: [-3, -2, 2, 3, 4]}
    a11: {min: -4, max: 4}
    a12: {min: -4, max: 4}
    a13: {min: -4, max: 4}
    a21: {min: -4, max: 4}
    a22: {min: -4, max: 4}
    a23: {min: -4, max: 4}
    a31: {min: -4, max: 4}
    a32: {min: -4, max: 4}
    a33: {min: -4, max: 4}
  calc:
    ii: if(pr == 0, 2, 3) + 0
    jj: if(pr == 2, 2, 1) + 0
    ri1: if(pr == 0, a21, a31) + 0
    ri2: if(pr == 0, a22, a32) + 0
    ri3: if(pr == 0, a23, a33) + 0
    rj1: if(pr == 2, a21, a11) + 0
    rj2: if(pr == 2, a22, a12) + 0
    rj3: if(pr == 2, a23, a13) + 0
    n1: if(pr == 0, a21, a31) + km*if(pr == 2, a21, a11) + 0
    n2: if(pr == 0, a22, a32) + km*if(pr == 2, a22, a12) + 0
    n3: if(pr == 0, a23, a33) + km*if(pr == 2, a23, a13) + 0
    inv: -km + 0
  prompt: |-
    Let $E$ be the $3 \times 3$ elementary matrix for the row operation $R_{ii} \leftarrow R_{ii} {km:signedcoef}R_{jj}$ and $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$. Find row {ii} of $EA$, and the $({ii}, {jj})$ entry of $E^{-1}$.
  answers:
    - {name: n1, label: 'changed row of $EA$: entry 1'}
    - {name: n2, label: 'entry 2'}
    - {name: n3, label: 'entry 3'}
    - {name: inv, label: 'the requested entry of $E^{-1}$'}
  solution: |-
    $EA$ is $A$ after the row operation, so only row {ii} changes: $({ri1}, {ri2}, {ri3}) + ({km})({rj1}, {rj2}, {rj3}) =$ **$({n1}, {n2}, {n3})$**.
    $E^{-1}$ undoes the operation, adding $-({km})$ times row {jj} instead, so its $({ii}, {jj})$ entry is **{inv}**.

- id: la-singular-h
  title: Choose h to make a matrix singular
  topic: Invertible matrix theorem
  vars:
    a12: {min: -3, max: 3}
    a13: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a23: {min: -3, max: 3}
    a31: {min: -3, max: 3}
    a32: {min: -3, max: 3}
    ss: {choices: [1, -1]}
  calc:
    a33: a13*a31 + ss + 0
    rest: -a23*a32 - a12*(a21*(a13*a31 + ss) - a23*a31) + a13*a21*a32 + 0
    hval: -(-a23*a32 - a12*(a21*(a13*a31 + ss) - a23*a31) + a13*a21*a32)/ss + 0
    mp22: -a21*a12 + 0
    q23: a23 - a21*a13 + 0
    q32: a32 - a31*a12 + 0
  where: ["abs(hval) <= 30", "a12*a21*a31 != 0"]
  prompt: |-
    For what value of $h$ is $A = \begin{bmatrix} 1 & {a12} & {a13} \\ {a21} & h & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$ not invertible?
  answers:
    - {name: hval, label: '$h =$'}
  solution: |-
    $A$ is singular exactly when it has fewer than 3 pivots. Row-reduce with $h$ kept as a letter: $R_2 \leftarrow R_2 - ({a21})R_1$ and $R_3 \leftarrow R_3 - ({a31})R_1$ clear column 1 and leave the lower-right block
    $$\begin{bmatrix} h {mp22:signed} & {q23} \\ {q32} & {ss}\end{bmatrix}.$$
    $A$ has 3 pivots exactly when this $2 \times 2$ block has 2 pivots, i.e. when its $ad - bc \ne 0$. Setting $({ss})(h {mp22:signed}) - ({q23})({q32}) = 0$ gives $h =$ **{hval}**. For that $h$ an echelon form of $A$ has a zero row.

- id: la-lu2
  title: LU factorization of a 2×2 matrix
  topic: LU factorization
  vars:
    p1: {choices: [1, 2, 3, -1, -2]}
    q1: {min: -5, max: 5}
    ll: {min: -4, max: 4}
    u22: {min: -6, max: 6}
  where: ["ll != 0", "u22 != 0"]
  calc:
    a21: ll*p1 + 0
    a22: ll*q1 + u22 + 0
  prompt: |-
    Find the LU factorization $A = \begin{bmatrix} 1 & 0 \\ \ell_{21} & 1\end{bmatrix}\begin{bmatrix} u_{11} & u_{12} \\ 0 & u_{22}\end{bmatrix}$ of $A = \begin{bmatrix} {p1} & {q1} \\ {a21} & {a22}\end{bmatrix}$. Give $\ell_{21}$ and $u_{22}$.
  answers:
    - {name: ll, label: '$\ell_{21} =$'}
    - {name: u22, label: '$u_{22} =$'}
  solution: |-
    The pivot is {p1}; to clear {a21} use $R_2 \leftarrow R_2 - \ell_{21}R_1$ with $\ell_{21} = {a21}/({p1}) =$ **{ll}**. Then $u_{22} = {a22} - ({ll})({q1}) =$ **{u22}**, and $U = \begin{bmatrix} {p1} & {q1} \\ 0 & {u22}\end{bmatrix}$.

- id: la-lu3
  title: LU factorization of a 3×3 matrix
  topic: LU factorization
  vars:
    l21: {min: -3, max: 3}
    l31: {min: -3, max: 3}
    l32: {min: -3, max: 3}
    u11: {choices: [1, 2, -1, 3]}
    u12: {min: -3, max: 3}
    u13: {min: -3, max: 3}
    u22: {choices: [1, 2, -1, -2, 3]}
    u23: {min: -3, max: 3}
    u33: {min: -4, max: 4}
  where: ["u33 != 0", "l21 != 0", "l32 != 0"]
  calc:
    a11: u11 + 0
    a12: u12 + 0
    a13: u13 + 0
    a21: l21*u11 + 0
    a22: l21*u12 + u22 + 0
    a23: l21*u13 + u23 + 0
    a31: l31*u11 + 0
    a32: l31*u12 + l32*u22 + 0
    a33: l31*u13 + l32*u23 + u33 + 0
    r32: l32*u22 + 0
  prompt: |-
    Find the LU factorization of $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$ (with $L$ unit lower triangular). Give the multipliers $\ell_{21}, \ell_{31}, \ell_{32}$ and the last pivot $u_{33}$.
  answers:
    - {name: l21, label: '$\ell_{21} =$'}
    - {name: l31, label: '$\ell_{31} =$'}
    - {name: l32, label: '$\ell_{32} =$'}
    - {name: u33, label: '$u_{33} =$'}
  solution: |-
    Column 1: $\ell_{21} = {a21}/({a11}) = {l21}$ and $\ell_{31} = {a31}/({a11}) = {l31}$. After those replacements row 2 is $[\,0 \;\; {u22} \;\; {u23}\,]$ and row 3 starts $[\,0 \;\; {a32} - ({l31})({a12}) = {r32}\,]$.
    Column 2: $\ell_{32} = {r32}/({u22}) = {l32}$. Clearing it leaves the last pivot $u_{33} = {u33}$.
    **Answer:** $\ell_{21} = {l21}$, $\ell_{31} = {l31}$, $\ell_{32} = {l32}$, $u_{33} = {u33}$, so
    $$L = \begin{bmatrix} 1 & 0 & 0 \\ {l21} & 1 & 0 \\ {l31} & {l32} & 1\end{bmatrix}, \quad U = \begin{bmatrix} {u11} & {u12} & {u13} \\ 0 & {u22} & {u23} \\ 0 & 0 & {u33}\end{bmatrix}.$$

- id: la-block-mult
  title: Multiply partitioned matrices block by block
  topic: Matrix multiplication
  vars:
    a11: {min: -3, max: 3}
    a12: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a22: {min: -3, max: 3}
    c1: {min: -3, max: 3}
    c2: {min: -3, max: 3}
    b11: {min: -3, max: 3}
    b12: {min: -3, max: 3}
    b21: {min: -3, max: 3}
    b22: {min: -3, max: 3}
    d1: {min: -3, max: 3}
    d2: {min: -3, max: 3}
  where: ["c1 != 0", "c2 != 0", "d1 != 0", "d2 != 0"]
  calc:
    p11: a11*b11 + a12*b21 + 0
    p12: a11*b12 + a12*b22 + 0
    p21: a21*b11 + a22*b21 + 0
    p22: a21*b12 + a22*b22 + 0
    q11: c1*d1 + 0
    q12: c1*d2 + 0
    q21: c2*d1 + 0
    q22: c2*d2 + 0
    r11: p11 + q11 + 0
    r12: p12 + q12 + 0
    r21: p21 + q21 + 0
    r22: p22 + q22 + 0
  prompt: |-
    $A = [\,A_1 \;\; A_2\,]$ and $B = \begin{bmatrix} B_1 \\ B_2\end{bmatrix}$ are partitioned with $A_1 = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$, $A_2 = \begin{bmatrix} {c1} \\ {c2}\end{bmatrix}$, $B_1 = \begin{bmatrix} {b11} & {b12} \\ {b21} & {b22}\end{bmatrix}$ and $B_2 = \begin{bmatrix} {d1} & {d2}\end{bmatrix}$. Compute $AB = A_1B_1 + A_2B_2$.
  answers:
    - {name: r11, label: 'row 1, col 1'}
    - {name: r12, label: 'row 1, col 2'}
    - {name: r21, label: 'row 2, col 1'}
    - {name: r22, label: 'row 2, col 2'}
  solution: |-
    The column split of $A$ ($2 + 1$) matches the row split of $B$, so multiply block by block, keeping each product in order.
    $A_1B_1 = \begin{bmatrix} {p11} & {p12} \\ {p21} & {p22}\end{bmatrix}$, and $A_2B_2$ (a column times a row) $= \begin{bmatrix} {q11} & {q12} \\ {q21} & {q22}\end{bmatrix}$.
    Adding: $AB =$ **$\begin{bmatrix} {r11} & {r12} \\ {r21} & {r22}\end{bmatrix}$**.
