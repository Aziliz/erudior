# Module 2 drills

- id: la-row-op
  title: Apply a row replacement
  topic: Row operations
  vars:
    a11: {choices: [1, -1, 2, -2, 3]}
    a12: {min: -5, max: 5}
    a13: {min: -5, max: 5}
    a14: {min: -9, max: 9}
    a21: {min: -6, max: 6}
    a22: {min: -6, max: 6}
    a23: {min: -6, max: 6}
    a24: {min: -9, max: 9}
    km: {choices: [-3, -2, -1, 2, 3, 4]}
  where: ["km*a11 != -a21"]
  calc:
    r1: a21 + km*a11 + 0
    r2: a22 + km*a12 + 0
    r3: a23 + km*a13 + 0
    r4: a24 + km*a14 + 0
  prompt: |-
    Apply the row operation $R_2 \leftarrow R_2 {km:signedcoef}R_1$ to
    $$\left[\begin{array}{ccc|c} {a11} & {a12} & {a13} & {a14} \\ {a21} & {a22} & {a23} & {a24}\end{array}\right]$$
    and give the new row 2.
  answers:
    - {name: r1, label: 'entry 1'}
    - {name: r2, label: 'entry 2'}
    - {name: r3, label: 'entry 3'}
    - {name: r4, label: 'entry 4 (right side)'}
  solution: |-
    Only row 2 changes. Add ${km}$ times each entry of row 1 to the entry below it:
    ${a21} + ({km})({a11}) = {r1}$, ${a22} + ({km})({a12}) = {r2}$, ${a23} + ({km})({a13}) = {r3}$, ${a24} + ({km})({a14}) = {r4}$.
    New row 2: **$[\,{r1} \;\; {r2} \;\; {r3} \;\; {r4}\,]$**.

- id: la-back-sub
  title: Back-substitution from echelon form
  topic: Linear systems
  vars:
    sx: {min: -6, max: 6}
    sy: {min: -6, max: 6}
    sz: {min: -6, max: 6}
    a12: {min: -4, max: 4}
    a13: {min: -4, max: 4}
    a23: {min: -4, max: 4}
    a22: {choices: [1, 2, -1, 3]}
    a33: {choices: [2, 3, -2, 4, 5, -3]}
  calc:
    c1: sx + a12*sy + a13*sz + 0
    c2: a22*sy + a23*sz + 0
    c3: a33*sz + 0
    t2: c2 - a23*sz + 0
  prompt: |-
    Solve the system whose augmented matrix is in echelon form:
    $$\left[\begin{array}{ccc|c} 1 & {a12} & {a13} & {c1} \\ 0 & {a22} & {a23} & {c2} \\ 0 & 0 & {a33} & {c3}\end{array}\right]$$
  answers:
    - {name: sx, label: '$x_1 =$'}
    - {name: sy, label: '$x_2 =$'}
    - {name: sz, label: '$x_3 =$'}
  solution: |-
    Start at the bottom. Row 3: ${a33}x_3 = {c3}$, so $x_3 = {sz}$.
    Row 2: ${a22}x_2 + ({a23})({sz}) = {c2}$, so ${a22}x_2 = {t2}$ and $x_2 = {sy}$.
    Row 1: $x_1 = {c1} - ({a12})({sy}) - ({a13})({sz}) = {sx}$.
    **Answer:** $(x_1, x_2, x_3) = ({sx}, {sy}, {sz})$.

- id: la-rref-2x3
  title: Reduced echelon form of a 2×3 matrix
  topic: Row reduction
  vars:
    e11: {min: -4, max: 4}
    e12: {min: -4, max: 4}
    e21: {min: -4, max: 4}
    e22: {min: -4, max: 4}
    m1: {min: -6, max: 6}
    n1: {min: -6, max: 6}
  where: ["e11*e22 - e12*e21 != 0", "e11 != 0"]
  calc:
    a13: e11*m1 + e12*n1 + 0
    a23: e21*m1 + e22*n1 + 0
  prompt: |-
    Row-reduce $A = \begin{bmatrix} {e11} & {e12} & {a13} \\ {e21} & {e22} & {a23}\end{bmatrix}$. Its reduced echelon form is $\begin{bmatrix} 1 & 0 & p \\ 0 & 1 & q\end{bmatrix}$; find $p$ and $q$.
  answers:
    - {name: m1, label: '$p =$'}
    - {name: n1, label: '$q =$'}
  solution: |-
    Read $A$ as the augmented matrix of ${e11}x_1 + ({e12})x_2 = {a13}$, ${e21}x_1 + ({e22})x_2 = {a23}$. Reducing it to $\begin{bmatrix} 1 & 0 & p \\ 0 & 1 & q\end{bmatrix}$ is the same as solving that system, so $p = x_1$ and $q = x_2$.
    Eliminating gives $x_1 = {m1}$, $x_2 = {n1}$. Check row 1: ${e11}({m1}) + ({e12})({n1}) = {a13}$. ✓
    **Answer:** $p = {m1}$, $q = {n1}$.

- id: la-h-inconsistent
  title: Choose h to make a system inconsistent
  topic: Existence and uniqueness
  vars:
    a1: {choices: [1, 2, -1, 3]}
    b1: {min: -5, max: 5}
    c1: {min: -9, max: 9}
    km: {choices: [-3, -2, 2, 3, 4]}
    d2: {min: -12, max: 12}
  where: ["b1 != 0", "d2 != km*c1"]
  calc:
    a2: km*a1 + 0
    hval: km*b1 + 0
    rhs: d2 - km*c1 + 0
  prompt: |-
    For what value of $h$ is the system with augmented matrix $\left[\begin{array}{cc|c} {a1} & {b1} & {c1} \\ {a2} & h & {d2}\end{array}\right]$ inconsistent?
  answers:
    - {name: hval, label: '$h =$'}
  solution: |-
    Apply $R_2 \leftarrow R_2 - ({km})R_1$: row 2 becomes $[\,0 \;\; h - ({hval}) \;\; {rhs}\,]$. Since ${rhs} \ne 0$, the system is inconsistent exactly when the middle entry is 0, i.e. $h =$ **{hval}**. (For any other $h$ it has a unique solution.)

- id: la-free-var
  title: A solution from the general solution
  topic: General solution
  vars:
    p1: {min: -5, max: 5}
    q1: {min: -9, max: 9}
    p2: {min: -5, max: 5}
    q2: {min: -9, max: 9}
    tv: {choices: [-3, -2, -1, 1, 2, 3, 4]}
  where: ["p1 != 0", "p2 != 0"]
  calc:
    x1v: q1 - p1*tv + 0
    x2v: q2 - p2*tv + 0
  prompt: |-
    A system's augmented matrix reduces to $\left[\begin{array}{ccc|c} 1 & 0 & {p1} & {q1} \\ 0 & 1 & {p2} & {q2} \\ 0 & 0 & 0 & 0\end{array}\right]$. Find the solution with $x_3 = {tv}$.
  answers:
    - {name: x1v, label: '$x_1 =$'}
    - {name: x2v, label: '$x_2 =$'}
  solution: |-
    $x_3$ is free. Row 1: $x_1 = {q1} - ({p1})x_3$. Row 2: $x_2 = {q2} - ({p2})x_3$.
    With $x_3 = {tv}$: $x_1 = {q1} - ({p1})({tv}) =$ **{x1v}** and $x_2 = {q2} - ({p2})({tv}) =$ **{x2v}**.

- id: la-network
  title: Traffic around a block
  topic: Applications of linear systems
  vars:
    inA: {min: 4, max: 10, step: 1}
    inB: {min: 1, max: 6}
    outB: {min: 1, max: 8}
    inC: {min: 1, max: 6}
    outC: {min: 1, max: 9}
    inD: {min: 1, max: 6}
  calc:
    fA: 50*inA + 0
    fBi: 50*inB + 0
    fBo: 50*outB + 0
    fCi: 50*inC + 0
    fCo: 50*outC + 0
    fDi: 50*inD + 0
    fDo: 50*(inA + inB - outB + inC - outC + inD) + 0
    o2: 50*(inA + inB - outB) + 0
    o3: 50*(inA + inB - outB + inC - outC) + 0
    x4min: max(0, -o2, -o3) + 0
    x1min: 50*inA + max(0, -o2, -o3) + 0
  where: ["fDo > 0", "x4min > 0"]
  prompt: |-
    One-way streets circle a block: $x_1$ on $A \to B$, $x_2$ on $B \to C$, $x_3$ on $C \to D$, $x_4$ on $D \to A$ (cars per hour). Outside traffic: {fA} enter at $A$; {fBi} enter and {fBo} leave at $B$; {fCi} enter and {fCo} leave at $C$; {fDi} enter and {fDo} leave at $D$. Flows can't be negative. What is the smallest possible $x_4$, and what is $x_1$ then?
  answers:
    - {name: x4min, label: 'smallest $x_4$'}
    - {name: x1min, label: '$x_1$ then'}
  figure:
    type: shape
    polygons:
      - {points: [[0, 0], [4, 0], [4, 4], [0, 4]]}
    segments:
      - {from: [0, 4], to: [4, 4], arrow: true, label: 'x₁'}
      - {from: [4, 4], to: [4, 0], arrow: true, label: 'x₂'}
      - {from: [4, 0], to: [0, 0], arrow: true, label: 'x₃'}
      - {from: [0, 0], to: [0, 4], arrow: true, label: 'x₄'}
    labels:
      - {at: [-0.4, 4.3], text: A}
      - {at: [4.4, 4.3], text: B}
      - {at: [4.4, -0.3], text: C}
      - {at: [-0.4, -0.3], text: D}
  solution: |-
    In = out at each node: $A$: $x_1 = {fA} + x_4$. $B$: $x_2 = x_1 + {fBi} - {fBo} = {o2} + x_4$. $C$: $x_3 = x_2 + {fCi} - {fCo} = {o3} + x_4$. (Node $D$'s equation is redundant.)
    So $x_4$ is free, and all flows are nonnegative exactly when $x_4 \ge 0$, $x_4 \ge -({o2})$ and $x_4 \ge -({o3})$. The smallest choice is $x_4 =$ **{x4min}**, giving $x_1 = {fA} + {x4min} =$ **{x1min}**.

- id: la-chem
  title: Balance a chemical equation
  topic: Applications of linear systems
  vars:
    rx:
      choices:
        - {label: 'x_1\,\text{CH}_4 + x_2\,\text{O}_2 \to x_3\,\text{CO}_2 + x_4\,\text{H}_2\text{O}', value: 0}
        - {label: 'x_1\,\text{C}_3\text{H}_8 + x_2\,\text{O}_2 \to x_3\,\text{CO}_2 + x_4\,\text{H}_2\text{O}', value: 1}
        - {label: 'x_1\,\text{Fe}_2\text{O}_3 + x_2\,\text{C} \to x_3\,\text{Fe} + x_4\,\text{CO}_2', value: 2}
        - {label: 'x_1\,\text{C}_2\text{H}_6 + x_2\,\text{O}_2 \to x_3\,\text{CO}_2 + x_4\,\text{H}_2\text{O}', value: 3}
        - {label: 'x_1\,\text{C}_6\text{H}_{12}\text{O}_6 + x_2\,\text{O}_2 \to x_3\,\text{CO}_2 + x_4\,\text{H}_2\text{O}', value: 4}
        - {label: 'x_1\,\text{NH}_3 + x_2\,\text{O}_2 \to x_3\,\text{NO} + x_4\,\text{H}_2\text{O}', value: 5}
        - {label: 'x_1\,\text{C}_2\text{H}_6\text{O} + x_2\,\text{O}_2 \to x_3\,\text{CO}_2 + x_4\,\text{H}_2\text{O}', value: 6}
        - {label: 'x_1\,\text{Fe} + x_2\,\text{H}_2\text{O} \to x_3\,\text{Fe}_3\text{O}_4 + x_4\,\text{H}_2', value: 7}
  calc:
    k1: if(rx == 0, 1, if(rx == 1, 1, if(rx == 2, 2, if(rx == 3, 2, if(rx == 4, 1, if(rx == 5, 4, if(rx == 6, 1, 3))))))) + 0
    k2: if(rx == 0, 2, if(rx == 1, 5, if(rx == 2, 3, if(rx == 3, 7, if(rx == 4, 6, if(rx == 5, 5, if(rx == 6, 3, 4))))))) + 0
    k3: if(rx == 0, 1, if(rx == 1, 3, if(rx == 2, 4, if(rx == 3, 4, if(rx == 4, 6, if(rx == 5, 4, if(rx == 6, 2, 1))))))) + 0
    k4: if(rx == 0, 2, if(rx == 1, 4, if(rx == 2, 3, if(rx == 3, 6, if(rx == 4, 6, if(rx == 5, 6, if(rx == 6, 3, 4))))))) + 0
  prompt: |-
    Balance the equation with the smallest positive whole numbers:
    $${rx}$$
  answers:
    - {name: k1, label: '$x_1 =$'}
    - {name: k2, label: '$x_2 =$'}
    - {name: k3, label: '$x_3 =$'}
    - {name: k4, label: '$x_4 =$'}
  solution: |-
    Write one equation per element (atoms on the left = atoms on the right). That's a homogeneous system with one free variable; solve for the others in terms of it, then choose the free variable to make every coefficient the smallest possible whole number.
    **Answer:** $x_1 = {k1}$, $x_2 = {k2}$, $x_3 = {k3}$, $x_4 = {k4}$. Check by counting each element on both sides.

- id: la-interp
  title: Parabola through three points
  topic: Applications of linear systems
  vars:
    c0: {min: -5, max: 5}
    c1: {min: -4, max: 4}
    c2: {choices: [-2, -1, 1, 2]}
    xa: {min: -3, max: -1}
    xb: {min: 0, max: 1}
    xc: {min: 2, max: 3}
  calc:
    ya: c0 + c1*xa + c2*xa^2 + 0
    yb: c0 + c1*xb + c2*xb^2 + 0
    yc: c0 + c1*xc + c2*xc^2 + 0
    sa: xa^2 + 0
    sb: xb^2 + 0
    sc: xc^2 + 0
  prompt: |-
    Find the coefficients of the parabola $y = a_0 + a_1x + a_2x^2$ that passes through $({xa}, {ya})$, $({xb}, {yb})$ and $({xc}, {yc})$.
  answers:
    - {name: c0, label: '$a_0 =$'}
    - {name: c1, label: '$a_1 =$'}
    - {name: c2, label: '$a_2 =$'}
  figure:
    type: plot
    x: [-4, 4]
    y: ['min(ya, yb, yc) - 3', 'max(ya, yb, yc) + 3']
    points:
      - {at: [xa, ya]}
      - {at: [xb, yb]}
      - {at: [xc, yc]}
  solution: |-
    Each point gives one equation, so solve
    $$\left[\begin{array}{ccc|c} 1 & {xa} & {sa} & {ya} \\ 1 & {xb} & {sb} & {yb} \\ 1 & {xc} & {sc} & {yc}\end{array}\right]$$
    by row reduction. The result is $a_0 =$ **{c0}**, $a_1 =$ **{c1}**, $a_2 =$ **{c2}**. Check: at $x = {xb}$, ${c0} + ({c1})({xb}) + ({c2})({sb}) = {yb}$. ✓
