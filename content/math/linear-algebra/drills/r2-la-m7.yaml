# Round 2, module la-m7 (Vector spaces): drills for the honors lessons.

- id: la-m7-r2-intersection
  title: The line where two planes through the origin meet
  topic: Sums of subspaces
  vars:
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
    a1: {min: -3, max: 3}
    a2: {min: -3, max: 3}
    b1: {min: -3, max: 3}
    b2: {min: -3, max: 3}
  where: ["a1 != 0", "a2 != 0", "b1 != 0", "b2 != 0", "a1*b2 - a2*b1 != 0", "a1*p + a2*q != 0", "b1*p + b2*q != 0"]
  calc:
    a3: -(a1*p + a2*q) + 0
    b3: -(b1*p + b2*q) + 0
    na3: -a3 + 0
    nb3: -b3 + 0
    det: a1*b2 - a2*b1 + 0
  prompt: |-
    In $\mathbb{R}^3$, $H$ is the plane ${a1:coef}x_1 {a2:signedcoef}x_2 {a3:signedcoef}x_3 = 0$ and $K$ is the plane ${b1:coef}x_1 {b2:signedcoef}x_2 {b3:signedcoef}x_3 = 0$. Their intersection $H \cap K$ is a line spanned by a vector of the form $(p, q, 1)$. Find $p$ and $q$.
  answers:
    - {name: p, label: '$p =$'}
    - {name: q, label: '$q =$'}
  solution: |-
    The planes are different (their coefficient rows aren't multiples), so $\dim(H + K) = 3$ and $\dim(H \cap K) = 2 + 2 - 3 = 1$: a line. Put $x_3 = 1$ in both equations:
    $${a1:coef}p {a2:signedcoef}q = {na3}, \qquad {b1:coef}p {b2:signedcoef}q = {nb3}.$$
    The determinant $({a1})({b2}) - ({a2})({b1}) = {det}$ is not 0, so there is exactly one solution: $p =$ **{p}**, $q =$ **{q}**. Check in the first equation: $({a1})({p}) + ({a2})({q}) + ({a3})(1) = 0$. ✓

- id: la-m7-r2-sum-dim
  title: Dimension of a sum and an intersection
  topic: Sums of subspaces
  vars:
    n: {min: 4, max: 9}
    h: {min: 2, max: 8}
    k: {min: 2, max: 8}
    i: {min: 0, max: 7}
  where: ["h < n", "k < n", "i <= min(h, k)", "h + k - i <= n", "i < min(h, k)"]
  calc:
    s: h + k - i
    mn: max(0, h + k - n)
    hk: h + k
  prompt: |-
    $H$ and $K$ are subspaces of $\mathbb{R}^{n}$ with $\dim H = {h}$ and $\dim K = {k}$.
    (a) If $\dim(H \cap K) = {i}$, what is $\dim(H + K)$?
    (b) Whatever $H$ and $K$ are (with these dimensions), what is the smallest possible value of $\dim(H \cap K)$?
  answers:
    - {name: s, label: '(a) $\dim(H + K) =$'}
    - {name: mn, label: '(b) smallest $\dim(H \cap K) =$'}
  solution: |-
    (a) $\dim(H + K) = \dim H + \dim K - \dim(H \cap K) = {h} + {k} - {i} =$ **{s}**.
    (b) $H + K$ lies in $\mathbb{R}^{n}$, so $\dim(H + K) \le {n}$, and $\dim(H \cap K) = {hk} - \dim(H + K) \ge {hk} - {n}$. A dimension can't be negative, so the smallest possible value is $\max(0, {hk} - {n}) =$ **{mn}** (it is reached by taking $H$ and $K$ spanned by standard basis vectors that overlap as little as possible).

- id: la-m7-r2-shift-map
  title: The matrix of a shift on polynomials
  topic: Matrices of linear maps
  vars:
    sh: {choices: [-3, -2, -1, 1, 2, 3]}
    c0: {min: -5, max: 5}
    c1: {min: -5, max: 5}
    c2: {min: -3, max: 3}
  where: ["c2 != 0", "c1 != 0", "c0 != 0"]
  calc:
    sh2: sh^2 + 0
    tsh: 2*sh + 0
    d0: c0 + c1*sh + c2*sh^2 + 0
    d1: c1 + 2*c2*sh + 0
    d2: c2 + 0
  prompt: |-
    Let $S: \mathbb{P}_2 \to \mathbb{P}_2$, $S(p)(t) = p(t {sh:signed})$, with the basis $\{1, t, t^2\}$. Use the matrix of $S$ to write $S(p)$ for $p(t) = {c0} {c1:signedcoef}t {c2:signedcoef}t^2$ as $d_0 + d_1t + d_2t^2$.
  answers:
    - {name: d0, label: '$d_0 =$'}
    - {name: d1, label: '$d_1 =$'}
    - {name: d2, label: '$d_2 =$'}
  solution: |-
    Columns: $S(1) = 1$, $S(t) = t {sh:signed}$, $S(t^2) = (t {sh:signed})^2 = t^2 {tsh:signedcoef}t {sh2:signed}$. So
    $$M = \begin{bmatrix} 1 & {sh} & {sh2} \\ 0 & 1 & {tsh} \\ 0 & 0 & 1\end{bmatrix}, \qquad M\begin{bmatrix} {c0} \\ {c1} \\ {c2}\end{bmatrix} = \begin{bmatrix} {d0} \\ {d1} \\ {d2}\end{bmatrix}.$$
    **Answer:** $d_0 = {d0}$, $d_1 = {d1}$, $d_2 = {d2}$.

- id: la-m7-r2-eval-kernel
  title: Kernel of an evaluation map
  topic: Matrices of linear maps
  vars:
    u1: {min: -4, max: 4}
    u2: {min: -4, max: 4}
  where: ["u1 < u2", "u1 + u2 != 0", "u1 != 0", "u2 != 0"]
  calc:
    sq1: u1^2 + 0
    sq2: u2^2 + 0
    bb: -(u1 + u2) + 0
    cc: u1*u2 + 0
    dd: u2 - u1 + 0
    ee: u2^2 - u1^2 + 0
  prompt: |-
    Let $T: \mathbb{P}_2 \to \mathbb{R}^2$, $T(p) = (p({u1}),\ p({u2}))$. Its kernel is spanned by one polynomial of the form $t^2 + bt + c$. Find $b$ and $c$.
  answers:
    - {name: bb, label: '$b =$'}
    - {name: cc, label: '$c =$'}
  solution: |-
    Relative to $\{1, t, t^2\}$ and the standard basis of $\mathbb{R}^2$, $M = \begin{bmatrix} 1 & {u1} & {sq1} \\ 1 & {u2} & {sq2}\end{bmatrix}$ (columns $T(1)$, $T(t)$, $T(t^2)$). $R_2 - R_1$ gives $[\,0 \;\; {dd} \;\; {ee}\,]$, so $x_2 = {bb}x_3$, and then $x_1 = -({u1})x_2 - ({sq1})x_3 = {cc}x_3$. With $x_3 = 1$ the kernel is spanned by $t^2 {bb:signedcoef}t {cc:signed}$, which is $(t - ({u1}))(t - ({u2}))$: the quadratic that vanishes at both points. **Answer:** $b = {bb}$, $c = {cc}$. (Rank 2, nullity 1: $2 + 1 = 3 = \dim\mathbb{P}_2$.)

- id: la-m7-r2-lagrange
  title: Extrapolating with Lagrange weights
  topic: Interpolation
  vars:
    xs: {choices: [-2, -1, 3, 4]}
    y0: {min: -5, max: 5}
    y1: {min: -5, max: 5}
    y2: {min: -5, max: 5}
  where: ["y0 - 2*y1 + y2 != 0"]
  calc:
    w0: (xs - 1)*(xs - 2)/2 + 0
    w1: -xs*(xs - 2) + 0
    w2: xs*(xs - 1)/2 + 0
    val: y0*w0 + y1*w1 + y2*w2 + 0
  prompt: |-
    The quadratic $p$ has $p(0) = {y0}$, $p(1) = {y1}$ and $p(2) = {y2}$. With the Lagrange basis for the nodes $0, 1, 2$, find the weights $w_0 = L_0({xs})$, $w_1 = L_1({xs})$, $w_2 = L_2({xs})$, and then $p({xs})$.
  answers:
    - {name: w0, label: '$w_0 =$'}
    - {name: w1, label: '$w_1 =$'}
    - {name: w2, label: '$w_2 =$'}
    - {name: val, label: 'value of $p$'}
  solution: |-
    $L_0(t) = \tfrac12(t - 1)(t - 2)$, $L_1(t) = -t(t - 2)$, $L_2(t) = \tfrac12t(t - 1)$. At $t = {xs}$: $L_0 = {w0}$, $L_1 = {w1}$, $L_2 = {w2}$. Since $p = p(0)L_0 + p(1)L_1 + p(2)L_2$,
    $$p({xs}) = ({y0})({w0}) + ({y1})({w1}) + ({y2})({w2}) = {val}.$$
    **Answer:** weights {w0}, {w1}, {w2}; $p({xs}) =$ **{val}**.

- id: la-m7-r2-recurrence
  title: Solve a second-order linear recurrence
  topic: Linear recurrences
  vars:
    r1: {min: -3, max: 4}
    r2: {min: -3, max: 4}
    c1: {min: -3, max: 3}
    c2: {min: -3, max: 3}
  where: ["r1 < r2", "r1 != 0", "r2 != 0", "r1 + r2 != 0", "c1 != 0", "c2 != 0"]
  calc:
    aa: -(r1 + r2) + 0
    bb: r1*r2 + 0
    nr1: -r1 + 0
    nr2: -r2 + 0
    y0: c1 + c2 + 0
    y1: c1*r1 + c2*r2 + 0
    y4: c1*r1^4 + c2*r2^4 + 0
    dr: r2 - r1 + 0
    num: y1 - r1*y0 + 0
  prompt: |-
    Solve $y_{k+2} {aa:signedcoef}y_{k+1} {bb:signedcoef}y_k = 0$ with $y_0 = {y0}$ and $y_1 = {y1}$. Write the solution as $y_k = c_1 r_1^k + c_2 r_2^k$, where $r_1 < r_2$ are the roots of the auxiliary equation, and find $c_1$, $c_2$ and $y_4$.
  answers:
    - {name: c1, label: '$c_1 =$'}
    - {name: c2, label: '$c_2 =$'}
    - {name: y4, label: '$y_4 =$'}
  solution: |-
    Auxiliary equation: $r^2 {aa:signedcoef}r {bb:signed} = (r {nr1:signed})(r {nr2:signed}) = 0$, so $r_1 = {r1}$ and $r_2 = {r2}$. Initial values: $c_1 + c_2 = {y0}$ and $({r1})c_1 + ({r2})c_2 = {y1}$. Subtract $({r1})$ times the first from the second: $({dr})c_2 = {num}$, so $c_2 = {c2}$ and $c_1 = {c1}$.
    Then $y_4 = ({c1})({r1})^4 + ({c2})({r2})^4 =$ **{y4}**. **Answer:** $c_1 = {c1}$, $c_2 = {c2}$, $y_4 = {y4}$.
