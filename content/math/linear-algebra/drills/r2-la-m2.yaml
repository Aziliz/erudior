# Round 2 drills: la-m2 honors lessons

- id: la-m2-r2-col-relation
  title: Rebuild a column from the RREF
  topic: Uniqueness of the RREF
  vars:
    u1: {min: -3, max: 3}
    u2: {min: -3, max: 3}
    u3: {min: -3, max: 3}
    v1: {min: -3, max: 3}
    v2: {min: -3, max: 3}
    v3: {min: -3, max: 3}
    p: {choices: [-3, -2, -1, 2, 3, 4]}
    q: {choices: [-3, -2, -1, 2, 3, 4]}
  where:
    - 'abs(u2*v3 - u3*v2) + abs(u3*v1 - u1*v3) + abs(u1*v2 - u2*v1) > 0'
  calc:
    w1: p*u1 + q*v1 + 0
    w2: p*u2 + q*v2 + 0
    w3: p*u3 + q*v3 + 0
  prompt: |-
    A $3 \times 3$ matrix $A$ has first two columns $\mathbf{a}_1 = \begin{bmatrix} {u1} \\ {u2} \\ {u3}\end{bmatrix}$ and $\mathbf{a}_2 = \begin{bmatrix} {v1} \\ {v2} \\ {v3}\end{bmatrix}$, and its reduced echelon form is
    $$\begin{bmatrix} 1 & 0 & {p} \\ 0 & 1 & {q} \\ 0 & 0 & 0\end{bmatrix}.$$
    Find the third column $\mathbf{a}_3$ of $A$.
  answers:
    - {name: w1, label: 'entry 1'}
    - {name: w2, label: 'entry 2'}
    - {name: w3, label: 'entry 3'}
  solution: |-
    In the RREF, column 3 is $({p})\mathbf{e}_1 + ({q})\mathbf{e}_2$: that many times the first pivot column plus that many times the second. Row operations keep column relations, so the same holds in $A$: $\mathbf{a}_3 = ({p})\mathbf{a}_1 + ({q})\mathbf{a}_2$.
    Entry by entry: $({p})({u1}) + ({q})({v1}) = {w1}$, $({p})({u2}) + ({q})({v2}) = {w2}$, $({p})({u3}) + ({q})({v3}) = {w3}$.
    **Answer:** $\mathbf{a}_3 = ({w1}, {w2}, {w3})$.

- id: la-m2-r2-relation-to-rref
  title: Find the RREF from a column relation
  topic: Uniqueness of the RREF
  vars:
    u2: {min: -3, max: 3}
    u3: {min: -3, max: 3}
    v1: {min: -3, max: 3}
    v2: {min: -3, max: 3}
    v3: {min: -3, max: 3}
    p: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
    q: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
  where:
    - 'v2 - u2*v1 != 0'
  calc:
    dd: v2 - u2*v1 + 0
    c1: p + q*v1 + 0
    c2: p*u2 + q*v2 + 0
    c3: p*u3 + q*v3 + 0
    e2: c2 - u2*c1 + 0
  prompt: |-
    Let $A = \begin{bmatrix} 1 & {v1} & {c1} \\ {u2} & {v2} & {c2} \\ {u3} & {v3} & {c3}\end{bmatrix}$. Its first two columns are not multiples of each other, and its third column is a combination of them, so its reduced echelon form is $\begin{bmatrix} 1 & 0 & r \\ 0 & 1 & s \\ 0 & 0 & 0\end{bmatrix}$. Find $r$ and $s$.
  answers:
    - {name: p, label: '$r =$'}
    - {name: q, label: '$s =$'}
  solution: |-
    Column 3 of the RREF is $r\mathbf{e}_1 + s\mathbf{e}_2$, so in $A$ the same relation holds: $\mathbf{a}_3 = r\mathbf{a}_1 + s\mathbf{a}_2$. The first two rows give
    $$r + ({v1})s = {c1}, \qquad ({u2})r + ({v2})s = {c2}.$$
    Subtract $({u2})$ times the first equation from the second: $({dd})s = {e2}$, so $s = {q}$. Then $r = {c1} - ({v1})({q}) = {p}$.
    Check row 3: $({p})({u3}) + ({q})({v3}) = {c3}$. ✓
    **Answer:** $r = {p}$, $s = {q}$.

- id: la-m2-r2-flops
  title: Count the flops of elimination
  topic: Cost and accuracy of elimination
  vars:
    n: {choices: [4, 5, 6, 8, 10, 12, 15, 20, 30, 50, 100]}
  calc:
    fw: (4*n^3 + 3*n^2 - 7*n)/6
    bk: n^2
    tot: fw + bk
  prompt: |-
    Gaussian elimination (forward phase, no row swaps) on the augmented matrix of an $n \times n$ system takes $\tfrac23 n^3 + \tfrac12 n^2 - \tfrac76 n$ flops, and back-substitution takes $n^2$. For $n = {n}$, find the number of flops for the forward phase and for the whole solve.
  answers:
    - {name: fw, label: 'forward phase', format: integer}
    - {name: tot, label: 'whole solve', format: integer}
  solution: |-
    Forward phase: $\tfrac23({n})^3 + \tfrac12({n})^2 - \tfrac76({n}) = \dfrac{4({n})^3 + 3({n})^2 - 7({n})}{6} =$ **{fw}** flops.
    Back-substitution: ${n}^2 = {bk}$ flops.
    Whole solve: ${fw} + {bk} =$ **{tot}** flops.

- id: la-m2-r2-scale-time
  title: How solve time grows with size
  topic: Cost and accuracy of elimination
  vars:
    t0: {choices: [0.1, 0.2, 0.25, 0.4, 0.5, 0.8, 1.5, 2]}
    n0: {choices: [500, 1000, 2000]}
    k: {choices: [2, 3, 4, 5, 10]}
  calc:
    n1: k*n0
    cube: k^3
    t1: t0*k^3
  prompt: 'A program solves a dense ${n0} \times {n0}$ system by elimination in {t0} seconds. Assuming the time is proportional to $n^3$, estimate the time in seconds for a ${n1} \times {n1}$ system on the same machine.'
  answers:
    - {name: t1, label: 'time (seconds)', relTolerance: 0.01}
  solution: |-
    The size grows by a factor of ${n1} / {n0} = {k}$, so the work grows by ${k}^3 = {cube}$.
    Estimated time: ${t0} \times {cube} =$ **{t1}** seconds.

- id: la-m2-r2-ill-cond
  title: A nearly singular system
  topic: Cost and accuracy of elimination
  vars:
    sv: {min: 1, max: 9}
    k: {choices: [-4, -3, -2, -1, 0, 2, 3, 4, 5, 6]}
  calc:
    x0: sv - 1
    r0: sv + 0.001
    r1: sv + k*0.001
    xk: sv - k
    yk: k + 0
  prompt: |-
    The system $x + y = {sv}$, $x + 1.001y = {r0:dp3}$ has the solution $x = {x0}$, $y = 1$. Change the second right side to ${r1:dp3}$ and solve the new system
    $$x + y = {sv}, \qquad x + 1.001y = {r1:dp3}.$$
  answers:
    - {name: xk, label: '$x =$'}
    - {name: yk, label: '$y =$'}
  solution: |-
    Subtract the first equation from the second: $0.001y = {r1:dp3} - {sv}$, so $y =$ **{yk}**. Then $x = {sv} - ({yk}) =$ **{xk}**.
    A change of less than $0.01$ in one right-hand side moved the solution from $({x0}, 1)$ to $({xk}, {yk})$: the two lines are nearly parallel, so the system is ill-conditioned.
