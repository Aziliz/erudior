# Round 2 drills: la-m2 honors lessons

- id: la-m2-r2-col-relation
  title: Rebuild a column from the RREF
  topic: Uniqueness of the RREF
  vars:
    u1: {min: -3, max: 3}
    u2: {min: -3, max: 3}
    u3: {min: -3, max: 3}
    v1: {min: -3, max: 3}
    v2: {min: -3, max: 3}
    v3: {min: -3, max: 3}
    p: {choices: [-3, -2, -1, 2, 3, 4]}
    q: {choices: [-3, -2, -1, 2, 3, 4]}
  where:
    - 'abs(u2*v3 - u3*v2) + abs(u3*v1 - u1*v3) + abs(u1*v2 - u2*v1) > 0'
  calc:
    w1: p*u1 + q*v1 + 0
    w2: p*u2 + q*v2 + 0
    w3: p*u3 + q*v3 + 0
  prompt: |-
    A $3 \times 3$ matrix $A$ has first two columns $\mathbf{a}_1 = \begin{bmatrix} {u1} \\ {u2} \\ {u3}\end{bmatrix}$ and $\mathbf{a}_2 = \begin{bmatrix} {v1} \\ {v2} \\ {v3}\end{bmatrix}$, and its reduced echelon form is
    $$\begin{bmatrix} 1 & 0 & {p} \\ 0 & 1 & {q} \\ 0 & 0 & 0\end{bmatrix}.$$
    Find the third column $\mathbf{a}_3$ of $A$.
  answers:
    - {name: w1, label: 'entry 1'}
    - {name: w2, label: 'entry 2'}
    - {name: w3, label: 'entry 3'}
  solution: |-
    In the RREF, column 3 is $({p})\mathbf{e}_1 + ({q})\mathbf{e}_2$: that many times the first pivot column plus that many times the second. Row operations keep column relations, so the same holds in $A$: $\mathbf{a}_3 = ({p})\mathbf{a}_1 + ({q})\mathbf{a}_2$.
    Entry by entry: $({p})({u1}) + ({q})({v1}) = {w1}$, $({p})({u2}) + ({q})({v2}) = {w2}$, $({p})({u3}) + ({q})({v3}) = {w3}$.
    **Answer:** $\mathbf{a}_3 = ({w1}, {w2}, {w3})$.

- id: la-m2-r2-relation-to-rref
  title: Find the RREF from a column relation
  topic: Uniqueness of the RREF
  vars:
    u2: {min: -3, max: 3}
    u3: {min: -3, max: 3}
    v1: {min: -3, max: 3}
    v2: {min: -3, max: 3}
    v3: {min: -3, max: 3}
    p: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
    q: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
  where:
    - 'v2 - u2*v1 != 0'
    - 'u2 != 0'
    - 'v1 != 0'
    - 'v2 != 0'
  calc:
    dd: v2 - u2*v1 + 0
    c1: p + q*v1 + 0
    c2: p*u2 + q*v2 + 0
    c3: p*u3 + q*v3 + 0
    e2: c2 - u2*c1 + 0
  prompt: |-
    Let $A = \begin{bmatrix} 1 & {v1} & {c1} \\ {u2} & {v2} & {c2} \\ {u3} & {v3} & {c3}\end{bmatrix}$. Its first two columns are not multiples of each other, and its third column is a combination of them, so its reduced echelon form is $\begin{bmatrix} 1 & 0 & r \\ 0 & 1 & s \\ 0 & 0 & 0\end{bmatrix}$. Find $r$ and $s$.
  answers:
    - {name: p, label: '$r =$'}
    - {name: q, label: '$s =$'}
  solution: |-
    Column 3 of the RREF is $r\mathbf{e}_1 + s\mathbf{e}_2$, so in $A$ the same relation holds: $\mathbf{a}_3 = r\mathbf{a}_1 + s\mathbf{a}_2$. The first two rows give
    $$r + ({v1})s = {c1}, \qquad ({u2})r + ({v2})s = {c2}.$$
    Subtract $({u2})$ times the first equation from the second: $({dd})s = {e2}$, so $s = {q}$. Then $r = {c1} - ({v1})({q}) = {p}$.
    Check row 3: $({p})({u3}) + ({q})({v3}) = {c3}$. ✓
    **Answer:** $r = {p}$, $s = {q}$.

- id: la-m2-r2-jacobi
  title: One Jacobi sweep
  topic: Iterative methods
  vars:
    a11: {choices: [3, 4, 5, 6]}
    a22: {choices: [3, 4, 5, 6]}
    a12: {choices: [-2, -1, 1, 2]}
    a21: {choices: [-2, -1, 1, 2]}
    x0: {min: -4, max: 4}
    y0: {min: -4, max: 4}
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
  calc:
    b1: a11*x1 + a12*y0 + 0
    b2: a22*y1 + a21*x0 + 0
    n1: b1 - a12*y0 + 0
    n2: b2 - a21*x0 + 0
  prompt: |-
    Apply one sweep of the Jacobi method to
    $$\begin{aligned} {a11}x {a12:signedcoef}y &= {b1} \\ {a21:coef}x + {a22}y &= {b2} \end{aligned}$$
    starting from the guess $(x_0, y_0) = ({x0}, {y0})$. Find $(x_1, y_1)$.
  answers:
    - {name: x1, label: '$x_1 =$'}
    - {name: y1, label: '$y_1 =$'}
  solution: |-
    Solve equation 1 for $x$ and equation 2 for $y$, and plug in the old values $x_0 = {x0}$, $y_0 = {y0}$:
    $x_1 = \dfrac{{b1} - ({a12})({y0})}{{a11}} = \dfrac{{n1}}{{a11}} =$ **{x1}**,
    $y_1 = \dfrac{{b2} - ({a21})({x0})}{{a22}} = \dfrac{{n2}}{{a22}} =$ **{y1}**.

- id: la-m2-r2-gauss-seidel
  title: One Gauss–Seidel sweep
  topic: Iterative methods
  vars:
    a11: {choices: [3, 4, 5, 6]}
    a22: {choices: [3, 4, 5, 6]}
    a12: {choices: [-2, -1, 1, 2]}
    a21: {choices: [-2, -1, 1, 2]}
    x0: {min: -4, max: 4}
    y0: {min: -4, max: 4}
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
  where: ['x1 != x0']
  calc:
    b1: a11*x1 + a12*y0 + 0
    b2: a22*y1 + a21*x1 + 0
    n1: b1 - a12*y0 + 0
    n2: b2 - a21*x1 + 0
  prompt: |-
    Apply one sweep of the Gauss–Seidel method to
    $$\begin{aligned} {a11}x {a12:signedcoef}y &= {b1} \\ {a21:coef}x + {a22}y &= {b2} \end{aligned}$$
    starting from the guess $(x_0, y_0) = ({x0}, {y0})$. Find $(x_1, y_1)$.
  answers:
    - {name: x1, label: '$x_1 =$'}
    - {name: y1, label: '$y_1 =$'}
  solution: |-
    First update $x$ from equation 1, using the old $y_0 = {y0}$:
    $x_1 = \dfrac{{b1} - ({a12})({y0})}{{a11}} = \dfrac{{n1}}{{a11}} =$ **{x1}**.
    Then update $y$ from equation 2, using the *new* $x_1 = {x1}$ (not $x_0$):
    $y_1 = \dfrac{{b2} - ({a21})({x1})}{{a22}} = \dfrac{{n2}}{{a22}} =$ **{y1}**.
