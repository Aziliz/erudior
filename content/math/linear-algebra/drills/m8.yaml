# Module 8 drills
# Many 2×2 drills build A = P D P^{-1} with P = [[1, p], [q, pq + 1]] (det 1), so eigenvectors are
# (1, q) for l1 and (p, pq + 1) for l2, and every entry of A is an integer.

- id: la-eig-check
  title: Eigenvalue of a given eigenvector
  topic: Eigenvalues and eigenvectors
  vars:
    pp: {min: -2, max: 2}
    qq: {min: -2, max: 2}
    l1: {min: -4, max: 5}
    l2: {min: -4, max: 5}
    kk: {choices: [1, 2, -1, 3]}
  where: ["l1 != l2", "pp != 0 or qq != 0"]
  calc:
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
    v1: kk*pp + 0
    v2: kk*(pp*qq + 1) + 0
    w1: l2*kk*pp + 0
    w2: l2*kk*(pp*qq + 1) + 0
  prompt: |-
    $\mathbf{v} = ({v1}, {v2})$ is an eigenvector of $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$. What is its eigenvalue?
  answers:
    - {name: l2, label: '$\lambda =$'}
  solution: |-
    Multiply: $A\mathbf{v} = (({a11})({v1}) + ({a12})({v2}),\ ({a21})({v1}) + ({a22})({v2})) = ({w1}, {w2})$, which is ${l2}\,\mathbf{v}$. So $\lambda =$ **{l2}**.

- id: la-eig2
  title: Eigenvalues of a 2×2 matrix
  topic: Characteristic equation
  vars:
    pp: {min: -2, max: 2}
    qq: {min: -2, max: 2}
    l1: {min: -5, max: 6}
    l2: {min: -5, max: 6}
  where: ["l1 < l2", "pp != 0", "qq != 0"]
  calc:
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
    trv: l1 + l2 + 0
    dt: l1*l2 + 0
    ntr: -(l1 + l2) + 0
  prompt: |-
    Find the eigenvalues of $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$.
  answers:
    - {name: l1, label: 'Smaller eigenvalue'}
    - {name: l2, label: 'Larger eigenvalue'}
  solution: |-
    The characteristic equation is $\lambda^2 - (\operatorname{tr} A)\lambda + \det A = 0$ with $\operatorname{tr} A = {trv}$ and $\det A = {dt}$. Its roots are the two numbers that add to {trv} and multiply to {dt}.
    **Answer:** $\lambda = {l1}$ and $\lambda = {l2}$. (Check: they add to the trace and multiply to the determinant.)

- id: la-char-poly
  title: Characteristic polynomial of a 2×2 matrix
  topic: Characteristic equation
  vars:
    a11: {min: -6, max: 6}
    a12: {min: -6, max: 6}
    a21: {min: -6, max: 6}
    a22: {min: -6, max: 6}
  calc:
    bb: -(a11 + a22) + 0
    cc: a11*a22 - a12*a21 + 0
    trv: a11 + a22 + 0
  prompt: |-
    Write the characteristic polynomial of $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ in the form $\lambda^2 + b\lambda + c$.
  answers:
    - {name: bb, label: '$b =$'}
    - {name: cc, label: '$c =$'}
  solution: |-
    $\det(A - \lambda I) = ({a11} - \lambda)({a22} - \lambda) - ({a12})({a21}) = \lambda^2 - (\operatorname{tr} A)\lambda + \det A$ with $\operatorname{tr} A = {trv}$ and $\det A = {cc}$.
    **Answer:** $b = {bb}$, $c = {cc}$.

- id: la-eig-tri
  title: Eigenvalues of a 3×3 block matrix
  topic: Characteristic equation
  vars:
    pp: {min: -1, max: 1}
    qq: {min: -1, max: 1}
    l1: {min: -4, max: 5}
    l2: {min: -4, max: 5}
    gg: {min: -4, max: 6}
    u1: {min: -3, max: 3}
    u2: {min: -3, max: 3}
  where: ["l1 != l2", "gg != l1", "gg != l2", "pp != 0 or qq != 0"]
  calc:
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
    lo: min(l1, l2, gg) + 0
    hi: max(l1, l2, gg) + 0
    mid: l1 + l2 + gg - min(l1, l2, gg) - max(l1, l2, gg) + 0
    tr: l1 + l2 + 0
    dt: l1*l2 + 0
  prompt: |-
    Find the eigenvalues of $A = \begin{bmatrix} {a11} & {a12} & 0 \\ {a21} & {a22} & 0 \\ {u1} & {u2} & {gg}\end{bmatrix}$, from smallest to largest.
  answers:
    - {name: lo, label: 'smallest'}
    - {name: mid, label: 'middle'}
    - {name: hi, label: 'largest'}
  solution: |-
    Expand $\det(A - \lambda I)$ down column 3: $({gg} - \lambda)\det\begin{bmatrix} {a11} - \lambda & {a12} \\ {a21} & {a22} - \lambda\end{bmatrix}$. The $2 \times 2$ block has trace {tr} and determinant {dt}, so its eigenvalues are {l1} and {l2}.
    **Answer:** {lo}, {mid}, {hi}.

- id: la-eigvec
  title: Find eigenvectors of a 2×2 matrix
  topic: Eigenvalues and eigenvectors
  vars:
    pp: {min: -3, max: 3}
    qq: {min: -3, max: 3}
    l1: {min: -4, max: 5}
    l2: {min: -4, max: 5}
  where: ["l1 != l2", "pp != 0", "qq != 0", "pp*qq + 1 != 0"]
  calc:
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
    s2: pp/(pp*qq + 1) + 0
    d2: pp*qq + 1 + 0
  prompt: |-
    $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ has eigenvalues {l1} and {l2}. Find an eigenvector $(1, y)$ for $\lambda = {l1}$, and an eigenvector $(x, 1)$ for $\lambda = {l2}$. Use exact fractions.
  answers:
    - {name: qq, label: '$y =$', kind: fraction, lowestTerms: true}
    - {name: s2, label: '$x =$', kind: fraction, lowestTerms: true}
  solution: |-
    For $\lambda = {l1}$, row-reduce $A - ({l1})I$; its null space is spanned by $(1, {qq})$. Check: $A(1, {qq})$ is ${l1}$ times $(1, {qq})$.
    For $\lambda = {l2}$, the null space of $A - ({l2})I$ is spanned by $({pp}, {d2})$; dividing by {d2} gives $({s2:texfrac}, 1)$.
    **Answer:** $y = {qq}$, $x = {s2:texfrac}$.

- id: la-diag-power
  title: Matrix powers by diagonalization
  topic: Diagonalization
  vars:
    pp: {min: -1, max: 1}
    qq: {min: -1, max: 1}
    l1: {choices: [-2, -1, 1, 2, 3]}
    l2: {choices: [-2, -1, 1, 2, 3]}
    kp: {choices: [2, 3, 4]}
  where: ["l1 != l2", "pp != 0 or qq != 0"]
  calc:
    d11: pp*qq + 1 + 0
    np: -pp + 0
    nq: -qq + 0
    m1: l1^kp + 0
    m2: l2^kp + 0
    r11: l1^kp*(pp*qq + 1) - pp*qq*l2^kp + 0
    r12: pp*(l2^kp - l1^kp) + 0
    r21: qq*(pp*qq + 1)*(l1^kp - l2^kp) + 0
    r22: -qq*pp*l1^kp + (pp*qq + 1)*l2^kp + 0
  prompt: |-
    $A = PDP^{-1}$ with $P = \begin{bmatrix} 1 & {pp} \\ {qq} & {d11}\end{bmatrix}$ and $D = \begin{bmatrix} {l1} & 0 \\ 0 & {l2}\end{bmatrix}$. Compute $A^{{kp}}$.
  answers:
    - {name: r11, label: 'row 1, col 1'}
    - {name: r12, label: 'row 1, col 2'}
    - {name: r21, label: 'row 2, col 1'}
    - {name: r22, label: 'row 2, col 2'}
  solution: |-
    $A^{{kp}} = PD^{{kp}}P^{-1}$ with $D^{{kp}} = \begin{bmatrix} {m1} & 0 \\ 0 & {m2}\end{bmatrix}$ and ($\det P = 1$) $P^{-1} = \begin{bmatrix} {d11} & {np} \\ {nq} & 1\end{bmatrix}$. Multiplying out:
    $$A^{{kp}} = \begin{bmatrix} {r11} & {r12} \\ {r21} & {r22}\end{bmatrix}.$$

- id: la-b-matrix
  title: Matrix of a transformation relative to a basis
  topic: Diagonalization
  vars:
    pp: {min: -2, max: 2}
    qq: {min: -1, max: 1}
    m11: {min: -3, max: 3}
    m12: {min: -3, max: 3}
    m21: {min: -3, max: 3}
    m22: {min: -3, max: 3}
  where: ["pp != 0 or qq != 0", "m12 != 0 or m21 != 0", "max(abs(a11), abs(a12), abs(a21), abs(a22)) <= 15"]
  calc:
    dd: pp*qq + 1 + 0
    np: -pp + 0
    nq: -qq + 0
    s11: m11 + pp*m21 + 0
    s12: m12 + pp*m22 + 0
    s21: qq*m11 + (pp*qq + 1)*m21 + 0
    s22: qq*m12 + (pp*qq + 1)*m22 + 0
    a11: (m11 + pp*m21)*(pp*qq + 1) - (m12 + pp*m22)*qq + 0
    a12: -(m11 + pp*m21)*pp + m12 + pp*m22 + 0
    a21: (qq*m11 + (pp*qq + 1)*m21)*(pp*qq + 1) - (qq*m12 + (pp*qq + 1)*m22)*qq + 0
    a22: -(qq*m11 + (pp*qq + 1)*m21)*pp + qq*m12 + (pp*qq + 1)*m22 + 0
  prompt: |-
    Let $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ and let $\mathcal{B}$ be the basis formed by the columns of $P = \begin{bmatrix} 1 & {pp} \\ {qq} & {dd}\end{bmatrix}$. Find the matrix of $\mathbf{x} \mapsto A\mathbf{x}$ relative to $\mathcal{B}$, that is, $P^{-1}AP$.
  answers:
    - {name: m11, label: 'row 1, col 1'}
    - {name: m12, label: 'row 1, col 2'}
    - {name: m21, label: 'row 2, col 1'}
    - {name: m22, label: 'row 2, col 2'}
  solution: |-
    First $AP = \begin{bmatrix} {s11} & {s12} \\ {s21} & {s22}\end{bmatrix}$ (column $j$ is $A$ times basis vector $j$). Since $\det P = 1$, $P^{-1} = \begin{bmatrix} {dd} & {np} \\ {nq} & 1\end{bmatrix}$. Then
    $$P^{-1}AP = \begin{bmatrix} {dd} & {np} \\ {nq} & 1\end{bmatrix}\begin{bmatrix} {s11} & {s12} \\ {s21} & {s22}\end{bmatrix} = \begin{bmatrix} {m11} & {m12} \\ {m21} & {m22}\end{bmatrix}.$$
    Column $j$ holds the $\mathcal{B}$-coordinates of $A$ times basis vector $j$. (Check: it has the same trace and determinant as $A$.)

- id: la-complex-eig
  title: Complex eigenvalues of a 2×2 matrix
  topic: Complex eigenvalues
  vars:
    a11: {min: -4, max: 4}
    a12: {min: -5, max: 5}
    a21: {min: -5, max: 5}
    a22: {min: -4, max: 4}
  calc:
    trv: a11 + a22 + 0
    dt: a11*a22 - a12*a21 + 0
    disc: (a11 + a22)^2 - 4*(a11*a22 - a12*a21) + 0
    nd: -((a11 + a22)^2 - 4*(a11*a22 - a12*a21)) + 0
    re: (a11 + a22)/2 + 0
    im: sqrt(4*(a11*a22 - a12*a21) - (a11 + a22)^2)/2 + 0
    md: sqrt(a11*a22 - a12*a21) + 0
  where: ["disc < 0"]
  prompt: |-
    $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ has complex eigenvalues $a \pm bi$ with $b > 0$. Find $a$, $b$, and $|\lambda|$ (exact like sqrt(5), or 2 decimals).
  answers:
    - {name: re, label: '$a =$', tolerance: 0.01}
    - {name: im, label: '$b =$', tolerance: 0.01}
    - {name: md, label: '$|\lambda| =$', tolerance: 0.01}
  solution: |-
    $\operatorname{tr} A = {trv}$, $\det A = {dt}$. The discriminant $({trv})^2 - 4({dt}) = {disc}$ is negative, so
    $\lambda = \dfrac{{trv} \pm i\sqrt{{nd}}}{2}$: $a =$ **{re:num2}**, $b =$ **{im:num2}**.
    $|\lambda| = \sqrt{a^2 + b^2} = \sqrt{\det A} = \sqrt{{dt}} \approx$ **{md:num2}**.

- id: la-rot-scale
  title: Rotation angle and scale of a rotation–scaling matrix
  topic: Complex eigenvalues
  vars:
    aa: {min: -4, max: 4}
    bb: {min: -4, max: 4}
  where: ["bb != 0"]
  calc:
    nb: -bb + 0
    ab: abs(bb) + 0
    rr: sqrt(aa^2 + bb^2) + 0
    ang: atan2d(bb, aa) + 0
    s2: aa^2 + bb^2 + 0
  prompt: |-
    $C = \begin{bmatrix} {aa} & {nb} \\ {bb} & {aa}\end{bmatrix}$ is a rotation followed by a scaling. Find the scale factor $r$ and the rotation angle $\varphi$ in degrees, with $-180^\circ < \varphi \le 180^\circ$ (1 decimal).
  answers:
    - {name: rr, label: '$r =$', tolerance: 0.01}
    - {name: ang, label: '$\varphi =$', tolerance: 0.1, units: {'°': 1, deg: 1}}
  figure:
    type: plot
    equal: true
    x: [-5, 5]
    y: [-5, 5]
    segments:
      - {from: [0, 0], to: [1, 0], arrow: true, label: 'e₁'}
      - {from: [0, 0], to: [aa, bb], arrow: true, label: 'Ce₁'}
  solution: |-
    $C = \begin{bmatrix} a & -b \\ b & a\end{bmatrix}$ with $a = {aa}$, $b = {bb}$; its eigenvalues are ${aa} \pm {ab:coef}i$. The scale factor is $r = \sqrt{{s2}} \approx$ **{rr:num2}**, and $\varphi$ is the angle of the point $({aa}, {bb})$, which is where $\mathbf{e}_1$ goes: $\varphi \approx$ **{ang:num1}°**.

- id: la-markov-step
  title: Two steps of a Markov chain
  topic: Markov chains
  vars:
    pa: {min: 1, max: 5}
    pb: {min: 1, max: 5}
    x0: {min: 1, max: 9}
  calc:
    p11: 1 - pa/10 + 0
    p21: pa/10 + 0
    p12: pb/10 + 0
    p22: 1 - pb/10 + 0
    y0: 1 - x0/10 + 0
    xs: x0/10 + 0
    x11: (1 - pa/10)*x0/10 + pb/10*(1 - x0/10) + 0
    x12: pa/10*x0/10 + (1 - pb/10)*(1 - x0/10) + 0
    x21: (1 - pa/10)*((1 - pa/10)*x0/10 + pb/10*(1 - x0/10)) + pb/10*(pa/10*x0/10 + (1 - pb/10)*(1 - x0/10)) + 0
    x22: pa/10*((1 - pa/10)*x0/10 + pb/10*(1 - x0/10)) + (1 - pb/10)*(pa/10*x0/10 + (1 - pb/10)*(1 - x0/10)) + 0
  prompt: |-
    A Markov chain has $P = \begin{bmatrix} {p11} & {p12} \\ {p21} & {p22}\end{bmatrix}$ and $\mathbf{x}_0 = ({xs}, {y0})$. Find $\mathbf{x}_2$ (3 decimals).
  answers:
    - {name: x21, label: 'entry 1', tolerance: 0.001, format: dp3}
    - {name: x22, label: 'entry 2', tolerance: 0.001, format: dp3}
  solution: |-
    $\mathbf{x}_1 = P\mathbf{x}_0 = ({x11:dp3}, {x12:dp3})$, then $\mathbf{x}_2 = P\mathbf{x}_1 =$ **({x21:dp3}, {x22:dp3})**. (The entries still add to 1, as they must.)

- id: la-steady
  title: Steady state of a two-state Markov chain
  topic: Markov chains
  vars:
    pa: {min: 1, max: 6}
    pb: {min: 1, max: 6}
  calc:
    p11: 1 - pa/10 + 0
    p21: pa/10 + 0
    p12: pb/10 + 0
    p22: 1 - pb/10 + 0
    q1: pb/(pa + pb) + 0
    q2: pa/(pa + pb) + 0
  where: ["pa != pb"]
  prompt: |-
    Find the steady-state vector of $P = \begin{bmatrix} {p11} & {p12} \\ {p21} & {p22}\end{bmatrix}$. Give exact fractions.
  answers:
    - {name: q1, label: '$q_1 =$', kind: fraction, lowestTerms: true}
    - {name: q2, label: '$q_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    Solve $(P - I)\mathbf{x} = \mathbf{0}$: row 1 is $-{p21}x_1 + {p12}x_2 = 0$, so $x_1 : x_2 = {p12} : {p21}$, i.e. ${pb} : {pa}$. Divide by the sum ${pb} + {pa}$ to get a probability vector:
    **$\mathbf{q} = ({q1:texfrac}, {q2:texfrac})$**. Check: $P\mathbf{q} = \mathbf{q}$.

- id: la-dyn-long
  title: A dynamical system from its eigenvectors
  topic: Dynamical systems
  vars:
    la: {choices: [2, -2, 3]}
    lb: {choices: [1, -1, 0.5]}
    kk: {choices: [2, 3, 4]}
    v11: {min: -2, max: 2}
    v12: {min: -2, max: 2}
    v21: {min: -2, max: 2}
    v22: {min: -2, max: 2}
    c1: {min: -2, max: 2}
    c2: {min: -3, max: 3}
  where: ["v11*v22 - v12*v21 != 0", "c1 != 0", "c2 != 0"]
  calc:
    x01: c1*v11 + c2*v21 + 0
    x02: c1*v12 + c2*v22 + 0
    f1: c1*la^kk + 0
    f2: c2*lb^kk + 0
    xk1: c1*la^kk*v11 + c2*lb^kk*v21 + 0
    xk2: c1*la^kk*v12 + c2*lb^kk*v22 + 0
  prompt: |-
    $A$ has eigenvectors $\mathbf{v}_1 = ({v11}, {v12})$ with eigenvalue {la} and $\mathbf{v}_2 = ({v21}, {v22})$ with eigenvalue {lb}. For $\mathbf{x}_{k+1} = A\mathbf{x}_k$ with $\mathbf{x}_0 = ({x01}, {x02})$, find $\mathbf{x}_{{kk}}$ (exact, or to 2 decimals).
  answers:
    - {name: xk1, label: 'entry 1', tolerance: 0.01}
    - {name: xk2, label: 'entry 2', tolerance: 0.01}
  solution: |-
    First write $\mathbf{x}_0 = {c1:coef}\mathbf{v}_1 {c2:signedcoef}\mathbf{v}_2$ (solve for the weights). Then
    $\mathbf{x}_{{kk}} = {c1:coef}({la})^{{kk}}\mathbf{v}_1 {c2:signedcoef}({lb})^{{kk}}\mathbf{v}_2 = {f1:coef}\,\mathbf{v}_1 {f2:signedcoef}\,\mathbf{v}_2 =$ **({xk1:num4}, {xk2:num4})**.

- id: la-ode-solve
  title: Solve x' = Ax from eigenvectors
  topic: Systems of differential equations
  vars:
    pp: {min: -2, max: 2}
    qq: {min: -2, max: 2}
    l1: {choices: [-3, -2, -1, 1, 2]}
    l2: {choices: [-3, -2, -1, 1, 2]}
    c1: {min: -3, max: 3}
    c2: {min: -3, max: 3}
  where: ["l1 != l2", "pp != 0", "c1 != 0", "c2 != 0"]
  calc:
    dd: pp*qq + 1 + 0
    np: -pp + 0
    nq: -qq + 0
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
    x01: c1 + c2*pp + 0
    x02: c1*qq + c2*(pp*qq + 1) + 0
    k2: c2*pp + 0
  prompt: |-
    $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ has eigenvectors $\mathbf{v}_1 = (1, {qq})$ for $\lambda_1 = {l1}$ and $\mathbf{v}_2 = ({pp}, {dd})$ for $\lambda_2 = {l2}$. The solution of $\mathbf{x}' = A\mathbf{x}$ with $\mathbf{x}(0) = ({x01}, {x02})$ is $\mathbf{x}(t) = c_1e^{\lambda_1t}\mathbf{v}_1 + c_2e^{\lambda_2t}\mathbf{v}_2$. Find $c_1$, $c_2$ and the first entry $x_1(t)$ (type e^(2t) for $e^{2t}$).
  answers:
    - {name: c1, label: '$c_1 =$'}
    - {name: c2, label: '$c_2 =$'}
    - {kind: expression, expression: 'c1*exp(l1*t) + c2*pp*exp(l2*t)', variables: [t], label: '$x_1(t) =$', show: '${c1:coef}e^{{l1:coef}t} {k2:signedcoef}e^{{l2:coef}t}$'}
  solution: |-
    The weights solve $P\mathbf{c} = \mathbf{x}(0)$ with $P = \begin{bmatrix} 1 & {pp} \\ {qq} & {dd}\end{bmatrix}$. Since $\det P = 1$, $P^{-1} = \begin{bmatrix} {dd} & {np} \\ {nq} & 1\end{bmatrix}$, and $\mathbf{c} = P^{-1}({x01}, {x02}) = ({c1}, {c2})$.
    So $\mathbf{x}(t) = {c1:coef}e^{{l1:coef}t}(1, {qq}) {c2:signedcoef}e^{{l2:coef}t}({pp}, {dd})$, and the first entry is $x_1(t) =$ **${c1:coef}e^{{l1:coef}t} {k2:signedcoef}e^{{l2:coef}t}$**. Check: at $t = 0$ it equals ${c1} + ({k2}) = {x01}$.

- id: la-ode-exp
  title: Matrix exponential of a diagonalizable matrix
  topic: Matrix exponential
  vars:
    pp: {min: -2, max: 2}
    qq: {choices: [-1, 1]}
    l1: {choices: [-3, -2, -1, 1, 2]}
    l2: {choices: [-3, -2, -1, 1, 2]}
  where: ["l1 != l2", "pp != 0", "pp*qq != -1"]
  calc:
    dd: pp*qq + 1 + 0
    np: -pp + 0
    nq: -qq + 0
    npq: -pp*qq + 0
    qd: qq*(pp*qq + 1) + 0
    a11: l1*(pp*qq + 1) - pp*qq*l2 + 0
    a12: pp*(l2 - l1) + 0
    a21: qq*(pp*qq + 1)*(l1 - l2) + 0
    a22: -qq*pp*l1 + (pp*qq + 1)*l2 + 0
  prompt: |-
    $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix} = PDP^{-1}$ with $P = \begin{bmatrix} 1 & {pp} \\ {qq} & {dd}\end{bmatrix}$ and $D = \begin{bmatrix} {l1} & 0 \\ 0 & {l2}\end{bmatrix}$. Find the entries of $e^{At}$ (type e^(2t) for $e^{2t}$).
  answers:
    - {kind: expression, expression: '(pp*qq + 1)*exp(l1*t) - pp*qq*exp(l2*t)', variables: [t], label: 'row 1, col 1', show: '${dd:coef}e^{{l1:coef}t} {npq:signedcoef}e^{{l2:coef}t}$'}
    - {kind: expression, expression: 'pp*(exp(l2*t) - exp(l1*t))', variables: [t], label: 'row 1, col 2', show: '${pp:coef}(e^{{l2:coef}t} - e^{{l1:coef}t})$'}
    - {kind: expression, expression: 'qq*(pp*qq + 1)*(exp(l1*t) - exp(l2*t))', variables: [t], label: 'row 2, col 1', show: '${qd:coef}(e^{{l1:coef}t} - e^{{l2:coef}t})$'}
    - {kind: expression, expression: '-pp*qq*exp(l1*t) + (pp*qq + 1)*exp(l2*t)', variables: [t], label: 'row 2, col 2', show: '${npq:coef}e^{{l1:coef}t} {dd:signedcoef}e^{{l2:coef}t}$'}
  solution: |-
    $e^{At} = Pe^{Dt}P^{-1}$ with $e^{Dt} = \begin{bmatrix} e^{{l1:coef}t} & 0 \\ 0 & e^{{l2:coef}t}\end{bmatrix}$ and ($\det P = 1$) $P^{-1} = \begin{bmatrix} {dd} & {np} \\ {nq} & 1\end{bmatrix}$. First
    $$Pe^{Dt} = \begin{bmatrix} e^{{l1:coef}t} & {pp:coef}e^{{l2:coef}t} \\ {qq:coef}e^{{l1:coef}t} & {dd:coef}e^{{l2:coef}t}\end{bmatrix},$$
    then multiply by $P^{-1}$ on the right (row of $Pe^{Dt}$ times column of $P^{-1}$):
    $$e^{At} = \begin{bmatrix} {dd:coef}e^{{l1:coef}t} {npq:signedcoef}e^{{l2:coef}t} & {pp:coef}(e^{{l2:coef}t} - e^{{l1:coef}t}) \\ {qd:coef}(e^{{l1:coef}t} - e^{{l2:coef}t}) & {npq:coef}e^{{l1:coef}t} {dd:signedcoef}e^{{l2:coef}t}\end{bmatrix}.$$
    Check: at $t = 0$ this is $I$.

- id: la-ode-spiral
  title: Solve x' = Cx for a rotation–scaling matrix
  topic: Matrix exponential
  vars:
    aa: {choices: [-2, -1, 1]}
    bb: {choices: [1, 2, 3]}
    u: {min: -3, max: 3}
    v: {min: -3, max: 3}
  where: ["u != 0", "v != 0"]
  calc:
    nb: -bb + 0
    nv: -v + 0
  prompt: |-
    Solve $\mathbf{x}' = C\mathbf{x}$ with $C = \begin{bmatrix} {aa} & {nb} \\ {bb} & {aa}\end{bmatrix}$ and $\mathbf{x}(0) = ({u}, {v})$. Give both entries of $\mathbf{x}(t)$ (type e^(-t), cos(2t), sin(2t)).
  answers:
    - {kind: expression, expression: 'exp(aa*t)*(u*cos(bb*t) - v*sin(bb*t))', variables: [t], label: '$x_1(t) =$', show: '$e^{{aa:coef}t}({u:coef}\cos {bb:coef}t {nv:signedcoef}\sin {bb:coef}t)$'}
    - {kind: expression, expression: 'exp(aa*t)*(u*sin(bb*t) + v*cos(bb*t))', variables: [t], label: '$x_2(t) =$', show: '$e^{{aa:coef}t}({u:coef}\sin {bb:coef}t {v:signedcoef}\cos {bb:coef}t)$'}
  solution: |-
    $C$ has the form $\begin{bmatrix} a & -b \\ b & a\end{bmatrix}$ with $a = {aa}$, $b = {bb}$, so $e^{Ct} = e^{{aa:coef}t}\begin{bmatrix} \cos {bb:coef}t & -\sin {bb:coef}t \\ \sin {bb:coef}t & \cos {bb:coef}t\end{bmatrix}$ and $\mathbf{x}(t) = e^{Ct}({u}, {v})$:
    $x_1(t) =$ **$e^{{aa:coef}t}({u:coef}\cos {bb:coef}t {nv:signedcoef}\sin {bb:coef}t)$**, $x_2(t) =$ **$e^{{aa:coef}t}({u:coef}\sin {bb:coef}t {v:signedcoef}\cos {bb:coef}t)$**.
    The eigenvalues are ${aa} \pm {bb:coef}i$: solutions turn counterclockwise through the angle ${bb:coef}t$ (radians), and the factor $e^{{aa:coef}t}$ makes them spiral in when $a < 0$ and spiral out when $a > 0$ (with $a = 0$ they would circle forever).
