# Honors module la-h1 (Linear algebra at work) drills.
# Graph used in lesson 90: edges e1 1->2, e2 2->3, e3 1->3, e4 3->4, e5 1->4.

- id: la-h1-r2-edge-diffs
  title: Potential differences on a graph
  topic: Graphs and networks
  vars:
    pa: {min: -5, max: 5}
    pb: {min: -5, max: 5}
    pc: {min: -5, max: 5}
    pd: {min: -5, max: 5}
  where: ["pa != pb or pb != pc or pc != pd"]
  calc:
    b1: pb - pa + 0
    b2: pc - pb + 0
    b3: pc - pa + 0
    b4: pd - pc + 0
    b5: pd - pa + 0
  prompt: |-
    The graph has edges $e_1: 1 \to 2$, $e_2: 2 \to 3$, $e_3: 1 \to 3$, $e_4: 3 \to 4$, $e_5: 1 \to 4$, and node potentials $(x_1, x_2, x_3, x_4) = ({pa}, {pb}, {pc}, {pd})$. Find $A\mathbf{x}$, where $A$ is the incidence matrix ($-1$ at each edge's tail, $+1$ at its head).
  figure:
    type: shape
    segments:
      - {from: [0, 3], to: [4, 3], arrow: true, label: e1}
      - {from: [4, 3], to: [4, 0], arrow: true, label: e2}
      - {from: [0, 3], to: [4, 0], arrow: true, label: e3}
      - {from: [4, 0], to: [0, 0], arrow: true, label: e4}
      - {from: [0, 3], to: [0, 0], arrow: true, label: e5}
    points:
      - {at: [0, 3], label: '1'}
      - {at: [4, 3], label: '2'}
      - {at: [4, 0], label: '3'}
      - {at: [0, 0], label: '4'}
  answers:
    - {name: b1, label: 'Edge $e_1$'}
    - {name: b2, label: 'Edge $e_2$'}
    - {name: b3, label: 'Edge $e_3$'}
    - {name: b4, label: 'Edge $e_4$'}
    - {name: b5, label: 'Edge $e_5$'}
  solution: |-
    Each entry of $A\mathbf{x}$ is (potential at the head) minus (potential at the tail):
    $e_1$: ${pb} - ({pa}) = {b1}$; $e_2$: ${pc} - ({pb}) = {b2}$; $e_3$: ${pc} - ({pa}) = {b3}$; $e_4$: ${pd} - ({pc}) = {b4}$; $e_5$: ${pd} - ({pa}) = {b5}$.
    So $A\mathbf{x} =$ **({b1}, {b2}, {b3}, {b4}, {b5})**. (Check the loop $1 \to 2 \to 3 \to 1$: ${b1} + ({b2}) - ({b3}) = 0$.)

- id: la-h1-r2-laplacian-energy
  title: The Laplacian quadratic form
  topic: Graphs and networks
  vars:
    pa: {min: -4, max: 4}
    pb: {min: -4, max: 4}
    pc: {min: -4, max: 4}
    pd: {min: -4, max: 4}
  where: ["pa != pb or pb != pc or pc != pd"]
  calc:
    q1: (pb - pa)^2
    q2: (pc - pb)^2
    q3: (pc - pa)^2
    q4: (pd - pc)^2
    q5: (pd - pa)^2
    en: q1 + q2 + q3 + q4 + q5
  prompt: |-
    The graph with edges $1 \to 2$, $2 \to 3$, $1 \to 3$, $3 \to 4$, $1 \to 4$ has Laplacian $L = \begin{bmatrix} 3 & -1 & -1 & -1 \\ -1 & 2 & -1 & 0 \\ -1 & -1 & 3 & -1 \\ -1 & 0 & -1 & 2\end{bmatrix}$. For $\mathbf{x} = ({pa}, {pb}, {pc}, {pd})$, find $\mathbf{x}^TL\mathbf{x}$.
  answer: en
  format: integer
  solution: |-
    $\mathbf{x}^TL\mathbf{x} = \|A\mathbf{x}\|^2$ is the sum of the squared differences across the edges:
    $({pb} - ({pa}))^2 + ({pc} - ({pb}))^2 + ({pc} - ({pa}))^2 + ({pd} - ({pc}))^2 + ({pd} - ({pa}))^2 = {q1} + {q2} + {q3} + {q4} + {q5} =$ **{en}**.

- id: la-h1-r2-circuit
  title: Potentials in a three-resistor circuit
  topic: Graphs and networks
  vars:
    ca: {min: 1, max: 4}
    cb: {min: 1, max: 4}
    cc: {min: 1, max: 4}
    kk: {min: 1, max: 2}
  where: ["ca*cb + ca*cc + cb*cc <= 20"]
  calc:
    dt: ca*cb + ca*cc + cb*cc
    cur: kk*dt
    l11: ca + cb
    l22: ca + cc
    v1: kk*(ca + cc)
    v2: kk*ca
  prompt: |-
    Node 3 of a triangle circuit is grounded ($x_3 = 0$). The conductances are {ca} S between nodes 1 and 2, {cb} S between nodes 1 and 3, and {cc} S between nodes 2 and 3. A current of {cur} A is fed into node 1 and leaves at node 3. Solve $A^TCA\mathbf{x} = \mathbf{s}$ for the potentials $x_1$ and $x_2$ (in volts).
  answers:
    - {name: v1, label: '$x_1 =$'}
    - {name: v2, label: '$x_2 =$'}
  solution: |-
    Grounding node 3 leaves the rows and columns of nodes 1 and 2. Diagonal entries are the total conductance at each node, off-diagonal entries are minus the conductance between them:
    $\begin{bmatrix} {l11} & -{ca} \\ -{ca} & {l22}\end{bmatrix}\begin{bmatrix} x_1 \\ x_2\end{bmatrix} = \begin{bmatrix} {cur} \\ 0\end{bmatrix}$.
    The determinant is $({l11})({l22}) - {ca}^2 = {dt}$, so $x_1 = \dfrac{{cur}\cdot {l22}}{{dt}}$ and $x_2 = \dfrac{{cur}\cdot {ca}}{{dt}}$.
    **$x_1 = {v1}$ V, $x_2 = {v2}$ V.**

- id: la-h1-r2-google-step
  title: One step of the PageRank iteration
  topic: PageRank and the power method
  vars:
    xa: {min: 1, max: 8}
    xb: {min: 1, max: 8}
    alpha: {choices: [0.8, 0.85, 0.9]}
  where: ["xa + xb <= 9"]
  calc:
    xc: 10 - xa - xb
    fa: xa/10
    fb: xb/10
    fc: xc/10
    sa: fc
    sb: fa/2
    sc: fa/2 + fb
    jump: (1 - alpha)/3
    na: alpha*sa + jump
    nb: alpha*sb + jump
    nc: alpha*sc + jump
  prompt: |-
    Three pages: A links to B and C, B links to C, and C links to A. With damping factor $\alpha = {alpha}$, compute one step $\mathbf{x}_1 = G\mathbf{x}_0$ of the PageRank iteration from $\mathbf{x}_0 = ({fa}, {fb}, {fc})$ (pages in the order A, B, C). Give each entry to 3 decimal places.
  answers:
    - {name: na, label: 'A', tolerance: 0.0006, format: dp3}
    - {name: nb, label: 'B', tolerance: 0.0006, format: dp3}
    - {name: nc, label: 'C', tolerance: 0.0006, format: dp3}
  solution: |-
    The link matrix is $S = \begin{bmatrix} 0 & 0 & 1 \\ \tfrac12 & 0 & 0 \\ \tfrac12 & 1 & 0\end{bmatrix}$, so $S\mathbf{x}_0 = ({fc},\ {fa}/2,\ {fa}/2 + {fb}) = ({sa}, {sb}, {sc})$.
    For a probability vector, $G\mathbf{x}_0 = \alpha S\mathbf{x}_0 + \tfrac{1 - \alpha}{3}(1, 1, 1)$, and $\tfrac{1 - {alpha}}{3} \approx {jump:num4}$.
    $\mathbf{x}_1 \approx$ **({na:dp3}, {nb:dp3}, {nc:dp3})**.

- id: la-h1-r2-power-step
  title: One step of the power method
  topic: PageRank and the power method
  vars:
    a11: {min: 1, max: 6}
    a12: {min: 1, max: 6}
    a21: {min: 1, max: 6}
    a22: {min: 1, max: 6}
    qq: {choices: [0.5, 0.25, 0.75, 2]}
  calc:
    y1: a11 + a12*qq
    y2: a21 + a22*qq
    mm: max(y1, y2)
    z1: y1/mm
    z2: y2/mm
  prompt: |-
    Apply one step of the power method to $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ with $\mathbf{x}_k = (1, {qq})$: multiply, then divide by the largest entry. Give the scale factor (the eigenvalue estimate) and the entries of $\mathbf{x}_{k+1}$, to 3 decimal places.
  answers:
    - {name: mm, label: 'Scale factor', tolerance: 0.0006, format: dp3}
    - {name: z1, label: 'First entry', tolerance: 0.0006, format: dp3}
    - {name: z2, label: 'Second entry', tolerance: 0.0006, format: dp3}
  solution: |-
    $A\mathbf{x}_k = ({a11} + {a12}({qq}),\ {a21} + {a22}({qq})) = ({y1}, {y2})$. The largest entry is {mm}, so the eigenvalue estimate is **{mm:dp3}** and $\mathbf{x}_{k+1} = ({y1}, {y2})/{mm} \approx$ **({z1:dp3}, {z2:dp3})**.

- id: la-h1-r2-power-iters
  title: How many power-method steps?
  topic: PageRank and the power method
  vars:
    lb: {choices: [5, 6, 7, 9]}
    la: {min: 1, max: 8}
    dd: {choices: [3, 4, 6]}
  where: ["la < lb"]
  calc:
    rr: la/lb
    kk: floor(ln(10^(-dd))/ln(rr)) + 1
  prompt: |-
    A matrix has dominant eigenvalue $\lambda_1 = {lb}$ and next-largest $|\lambda_2| = {la}$. Assuming the power method's error shrinks by exactly the factor $|\lambda_2/\lambda_1|$ each step, what is the smallest number of steps $k$ for which $|\lambda_2/\lambda_1|^k < 10^{-{dd}}$?
  answer: kk
  format: integer
  solution: |-
    The ratio is ${la}/{lb} \approx {rr:num4}$. We need $k \ln({la}/{lb}) < \ln(10^{-{dd}})$; dividing by the negative number $\ln({la}/{lb})$ flips the inequality: $k > \dfrac{\ln 10^{-{dd}}}{\ln({la}/{lb})}$. The smallest whole number that works is $k =$ **{kk}**.

- id: la-h1-r2-covariance
  title: Covariance matrix of four points
  topic: Principal component analysis
  vars:
    xa: {min: 0, max: 8}
    xb: {min: 0, max: 8}
    xc: {min: 0, max: 8}
    xd: {min: 0, max: 8}
    ya: {min: 0, max: 8}
    yb: {min: 0, max: 8}
    yc: {min: 0, max: 8}
    yd: {min: 0, max: 8}
  where: ["mod(xa + xb + xc + xd, 4) == 0", "mod(ya + yb + yc + yd, 4) == 0", "xa != xb", "ya != yc"]
  calc:
    mx: (xa + xb + xc + xd)/4
    my: (ya + yb + yc + yd)/4
    da: xa - mx + 0
    db: xb - mx + 0
    dc: xc - mx + 0
    dd: xd - mx + 0
    ea: ya - my + 0
    eb: yb - my + 0
    ec: yc - my + 0
    ed: yd - my + 0
    sxx: (da^2 + db^2 + dc^2 + dd^2)/3
    syy: (ea^2 + eb^2 + ec^2 + ed^2)/3
    sxy: (da*ea + db*eb + dc*ec + dd*ed)/3
    nxx: da^2 + db^2 + dc^2 + dd^2
    nyy: ea^2 + eb^2 + ec^2 + ed^2
    nxy: da*ea + db*eb + dc*ec + dd*ed
  prompt: |-
    Four data points $(x, y)$: $({xa}, {ya})$, $({xb}, {yb})$, $({xc}, {yc})$, $({xd}, {yd})$. Find the entries of the sample covariance matrix $S = \tfrac{1}{N-1}BB^T$, to 2 decimal places.
  answers:
    - {name: sxx, label: 'Variance of $x$', tolerance: 0.006, format: num2}
    - {name: syy, label: 'Variance of $y$', tolerance: 0.006, format: num2}
    - {name: sxy, label: 'Covariance', tolerance: 0.006, format: num2}
  solution: |-
    Means: $\bar x = {mx}$, $\bar y = {my}$. Deviations: $x$: ${da}, {db}, {dc}, {dd}$; $y$: ${ea}, {eb}, {ec}, {ed}$.
    Sums: $\sum d_x^2 = {nxx}$, $\sum d_y^2 = {nyy}$, $\sum d_xd_y = {nxy}$. Divide each by $N - 1 = 3$.
    $S \approx$ **$\begin{bmatrix} {sxx:num2} & {sxy:num2} \\ {sxy:num2} & {syy:num2}\end{bmatrix}$**.

- id: la-h1-r2-explained
  title: Variance explained by principal components
  topic: Principal component analysis
  vars:
    l1: {min: 8, max: 30}
    l2: {min: 2, max: 12}
    l3: {min: 1, max: 5}
    kk: {choices: [1, 2]}
  where: ["l1 > l2", "l2 > l3"]
  calc:
    tot: l1 + l2 + l3
    kept: if(kk == 1, l1, l1 + l2)
    pct: 100*kept/tot
  prompt: |-
    A covariance matrix of three variables has eigenvalues {l1}, {l2} and {l3}. What percent of the total variance do the first {kk} principal component(s) explain? Give the percent to 1 decimal place.
  answer: pct
  format: num1
  tolerance: 0.06
  solution: |-
    Total variance = trace = sum of the eigenvalues = ${l1} + {l2} + {l3} = {tot}$. The first {kk} component(s) carry {kept} of it: ${kept}/{tot} \approx$ **{pct:num1}%**.

- id: la-h1-r2-pc-direction
  title: First principal component of a 2×2 covariance matrix
  topic: Principal component analysis
  vars:
    pp: {min: 1, max: 3}
    qq: {choices: [-3, -2, -1, 1, 2, 3]}
    l1: {min: 4, max: 20}
    l2: {min: 1, max: 6}
  where: ["l1 > l2", "gcd(pp, abs(qq)) == 1", "mod(l1*pp^2 + l2*qq^2, pp^2 + qq^2) == 0", "mod((l1 - l2)*pp*qq, pp^2 + qq^2) == 0", "mod(l1*qq^2 + l2*pp^2, pp^2 + qq^2) == 0"]
  calc:
    nn: pp^2 + qq^2
    s11: (l1*pp^2 + l2*qq^2)/nn
    s12: (l1 - l2)*pp*qq/nn
    s22: (l1*qq^2 + l2*pp^2)/nn
    trv: s11 + s22
    dt: s11*s22 - s12^2
    a11: s11 - l1 + 0
    slope: qq/pp
    pct: 100*l1/(l1 + l2)
  prompt: |-
    A data set has covariance matrix $S = \begin{bmatrix} {s11} & {s12} \\ {s12} & {s22}\end{bmatrix}$. Find the variance along the first principal component, the slope of the first component's direction (as a fraction), and the percent of the total variance it explains (1 decimal place).
  answers:
    - {name: l1, label: 'Variance $\lambda_1$'}
    - {name: slope, label: 'Slope', kind: fraction, lowestTerms: true}
    - {name: pct, label: 'Percent explained', tolerance: 0.06, format: num1}
  solution: |-
    The eigenvalues satisfy $\lambda^2 - {trv}\lambda + {dt} = 0$, so $\lambda_1 = {l1}$ and $\lambda_2 = {l2}$ (they add to {trv} and multiply to {dt}).
    For $\lambda_1$: row 1 of $S - {l1}I$ is $({a11})u_1 + ({s12})u_2 = 0$, which holds for $\mathbf{u} = ({pp}, {qq})$, so the first component points along $({pp}, {qq})$ and its slope is **{slope:frac}**.
    Variance **{l1}**; it explains ${l1}/{trv} \approx$ **{pct:num1}%** of the total.

- id: la-h1-r2-trilaterate
  title: Position from three distances
  topic: Positioning from distances
  vars:
    aa: {min: 4, max: 10}
    bb: {min: -2, max: 6}
    cc: {min: 3, max: 9}
    xx: {min: 0, max: 8}
    yy: {min: 0, max: 8}
  where: ["xx != 0 or yy != 0", "bb != 0"]
  calc:
    r1s: xx^2 + yy^2
    r2s: (xx - aa)^2 + yy^2
    r3s: (xx - bb)^2 + (yy - cc)^2
    ta: 2*aa
    tb: 2*bb
    tc: 2*cc
    asq: aa^2
    bcsq: bb^2 + cc^2
    rhs1: r1s - r2s + aa^2
    rhs2: r1s - r3s + bb^2 + cc^2
    rem: rhs2 - tb*xx
  prompt: |-
    Beacons sit at $\mathbf{p}_1 = (0, 0)$, $\mathbf{p}_2 = ({aa}, 0)$ and $\mathbf{p}_3 = ({bb}, {cc})$. The squared distances from you to them are $r_1^2 = {r1s}$, $r_2^2 = {r2s}$ and $r_3^2 = {r3s}$. Find your position $(x, y)$.
  answers:
    - {name: xx, label: '$x =$'}
    - {name: yy, label: '$y =$'}
  solution: |-
    Subtract the first circle equation from the others: $2(\mathbf{p}_i - \mathbf{p}_1)\cdot\mathbf{x} = r_1^2 - r_i^2 + \|\mathbf{p}_i\|^2$.
    Beacon 2: ${ta}x = {r1s} - {r2s} + {asq} = {rhs1}$, so $x = {xx}$.
    Beacon 3: ${tb}x + {tc}y = {r1s} - {r3s} + {bcsq} = {rhs2}$. With $x = {xx}$: ${tc}y = {rem}$, so $y = {yy}$.
    Position: **({xx}, {yy})**.

- id: la-h1-r2-position-ls
  title: Least-squares position from four beacons
  topic: Positioning from distances
  vars:
    xx: {min: 2, max: 8}
    yy: {min: 2, max: 8}
    e1: {min: -3, max: 3}
    e2: {min: -3, max: 3}
    e3: {min: -3, max: 3}
    e4: {min: -3, max: 3}
  where: ["e1 - e2 + e3 - e4 != 0 or e1 - e2 - e3 + e4 != 0"]
  calc:
    m1: xx^2 + yy^2 + e1
    m2: (xx - 10)^2 + yy^2 + e2
    m3: xx^2 + (yy - 10)^2 + e3
    m4: (xx - 10)^2 + (yy - 10)^2 + e4
    a1: (m1 - m2 + 100)/20
    a2: (m1 - m3 + 100)/20
    a3: (m1 - m4 + 200)/20
    xh: (2*a1 - a2 + a3)/3
    yh: (2*a2 - a1 + a3)/3
  prompt: |-
    Beacons sit at the corners $(0, 0)$, $(10, 0)$, $(0, 10)$, $(10, 10)$ of a square. The measured squared distances to them are {m1}, {m2}, {m3} and {m4} (with small errors). Subtract the first equation from the others and find the least-squares estimate of your position, to 2 decimal places.
  answers:
    - {name: xh, label: '$\hat x =$', tolerance: 0.006, format: num2}
    - {name: yh, label: '$\hat y =$', tolerance: 0.006, format: num2}
  solution: |-
    Subtracting and dividing by 20 gives $x = {a1}$, $y = {a2}$, $x + y = {a3}$: $M = \begin{bmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1\end{bmatrix}$, $\mathbf{c} = ({a1}, {a2}, {a3})$.
    Normal equations: $\begin{bmatrix} 2 & 1 \\ 1 & 2\end{bmatrix}\hat{\mathbf{x}} = ({a1} + {a3},\ {a2} + {a3})$, so $\hat x = \tfrac{2({a1}) - ({a2}) + {a3}}{3}$ and $\hat y = \tfrac{2({a2}) - ({a1}) + {a3}}{3}$.
    **$\hat x \approx {xh:num2}$, $\hat y \approx {yh:num2}$.**

- id: la-h1-r2-dop
  title: Dilution of precision for two beacons
  topic: Positioning from distances
  vars:
    th: {choices: [15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90]}
  calc:
    sn: sind(th)
    dop: sqrt(2)/sind(th)
  prompt: |-
    In the plane, a receiver measures ranges to two beacons whose directions (unit line-of-sight vectors) differ by ${th}^\circ$. Find the dilution of precision $\sqrt{\operatorname{tr}((J^TJ)^{-1})}$, to 2 decimal places.
  answer: dop
  format: num2
  tolerance: 0.006
  solution: |-
    With rows $(1, 0)$ and $(\cos\theta, \sin\theta)$, $J^TJ$ has trace 2 and determinant $\sin^2\theta$, so $\operatorname{tr}((J^TJ)^{-1}) = 2/\sin^2\theta$ and $\text{DOP} = \sqrt2/\sin\theta = 1.4142/{sn:num4} \approx$ **{dop:num2}**.
