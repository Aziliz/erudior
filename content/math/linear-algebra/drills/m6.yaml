# Module 6 drills

- id: la-det3
  title: Determinant of a 3×3 matrix
  topic: Cofactor expansion
  vars:
    a11: {min: -4, max: 4}
    a12: {min: -4, max: 4}
    a13: {min: -4, max: 4}
    a21: {min: -4, max: 4}
    a22: {min: -4, max: 4}
    a23: {min: -4, max: 4}
    a31: {min: -4, max: 4}
    a32: {min: -4, max: 4}
    a33: {min: -4, max: 4}
  calc:
    m11: a22*a33 - a23*a32 + 0
    m12: a21*a33 - a23*a31 + 0
    m13: a21*a32 - a22*a31 + 0
    det: a11*(a22*a33 - a23*a32) - a12*(a21*a33 - a23*a31) + a13*(a21*a32 - a22*a31) + 0
  prompt: |-
    Compute $\det\begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$.
  answers:
    - {name: det, label: '$\det A =$'}
  solution: |-
    Expand along row 1 with signs $+, -, +$:
    $${a11}({m11}) - ({a12})({m12}) + ({a13})({m13}) = $$
    **{det}**. (The minors are ${a22}\cdot{a33} - ({a23})({a32}) = {m11}$, and so on.)

- id: la-cofactor
  title: Cofactors along a row
  topic: Cofactor expansion
  vars:
    a11: {min: -4, max: 4}
    a12: {min: -4, max: 4}
    a13: {min: -4, max: 4}
    a21: {min: -4, max: 4}
    a22: {min: -4, max: 4}
    a23: {min: -4, max: 4}
    a31: {min: -4, max: 4}
    a32: {min: -4, max: 4}
    a33: {min: -4, max: 4}
  calc:
    c21: -(a12*a33 - a13*a32) + 0
    c22: a11*a33 - a13*a31 + 0
    c23: -(a11*a32 - a12*a31) + 0
    det: a21*(-(a12*a33 - a13*a32)) + a22*(a11*a33 - a13*a31) + a23*(-(a11*a32 - a12*a31)) + 0
  prompt: |-
    For $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$, find the cofactors $C_{21}, C_{22}, C_{23}$ and then $\det A$ by expanding along row 2.
  answers:
    - {name: c21, label: '$C_{21} =$'}
    - {name: c22, label: '$C_{22} =$'}
    - {name: c23, label: '$C_{23} =$'}
    - {name: det, label: '$\det A =$'}
  solution: |-
    Row 2 has signs $-, +, -$.
    $C_{21} = -\begin{vmatrix} {a12} & {a13} \\ {a32} & {a33}\end{vmatrix} = {c21}$, $C_{22} = +\begin{vmatrix} {a11} & {a13} \\ {a31} & {a33}\end{vmatrix} = {c22}$, $C_{23} = -\begin{vmatrix} {a11} & {a12} \\ {a31} & {a32}\end{vmatrix} = {c23}$.
    $\det A = ({a21})({c21}) + ({a22})({c22}) + ({a23})({c23}) =$ **{det}**.

- id: la-det4
  title: A 4×4 determinant with a sparse column
  topic: Cofactor expansion
  vars:
    kk: {choices: [-3, -2, -1, 1, 2, 3]}
    b11: {min: -3, max: 3}
    b12: {min: -3, max: 3}
    b13: {min: -3, max: 3}
    b21: {min: -3, max: 3}
    b22: {min: -3, max: 3}
    b23: {min: -3, max: 3}
    b31: {min: -3, max: 3}
    b32: {min: -3, max: 3}
    b33: {min: -3, max: 3}
    w1: {min: -5, max: 5}
    w2: {min: -5, max: 5}
    w3: {min: -5, max: 5}
  calc:
    md: b11*(b22*b33 - b23*b32) - b12*(b21*b33 - b23*b31) + b13*(b21*b32 - b22*b31) + 0
    det: kk*(b11*(b22*b33 - b23*b32) - b12*(b21*b33 - b23*b31) + b13*(b21*b32 - b22*b31)) + 0
  where: ["md != 0"]
  prompt: |-
    Compute $\det\begin{bmatrix} {b11} & 0 & {b12} & {b13} \\ {b21} & 0 & {b22} & {b23} \\ {b31} & 0 & {b32} & {b33} \\ {w1} & {kk} & {w2} & {w3}\end{bmatrix}$.
  answers:
    - {name: det, label: '$\det =$'}
  solution: |-
    Expand down column 2: its only nonzero entry is {kk} in position $(4, 2)$, with sign $(-1)^{4+2} = +$. Deleting row 4 and column 2 leaves
    $$\det = {kk}\begin{vmatrix} {b11} & {b12} & {b13} \\ {b21} & {b22} & {b23} \\ {b31} & {b32} & {b33}\end{vmatrix} = {kk}({md}) =$$
    **{det}**. (The bottom-row entries other than {kk} never matter.)

- id: la-det-props
  title: Determinant properties
  topic: Determinant properties
  vars:
    nn: {choices: [2, 3, 4]}
    cc: {choices: [-2, -1, 2, 3]}
    dA: {choices: [-6, -4, -3, -2, -1, 1, 2, 3, 4, 5]}
    dB: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    v1: cc^nn*dA/dB + 0
    v2: dB^2/dA + 0
    cn: cc^nn + 0
  prompt: |-
    $A$ and $B$ are ${nn} \times {nn}$ matrices with $\det A = {dA}$ and $\det B = {dB}$. Find $\det({cc}AB^{-1})$ and $\det(A^{-1}B^2)$ as exact fractions.
  answers:
    - {name: v1, label: 'first determinant', kind: fraction, lowestTerms: true}
    - {name: v2, label: '$\det(A^{-1}B^2) =$', kind: fraction, lowestTerms: true}
  solution: |-
    $\det({cc}M) = ({cc})^{{nn}}\det M = {cn}\det M$ for any ${nn} \times {nn}$ matrix $M$, and determinants multiply:
    $\det({cc}AB^{-1}) = {cn} \cdot ({dA}) \cdot \dfrac{1}{{dB}} =$ **${v1:texfrac}$**, and
    $\det(A^{-1}B^2) = \dfrac{1}{{dA}}\cdot({dB})^2 =$ **${v2:texfrac}$**.

- id: la-det-rowops
  title: Determinant after row operations
  topic: Determinant properties
  vars:
    dA: {choices: [-5, -4, -3, -2, 2, 3, 4, 5, 6]}
    sw:
      choices:
        - {label: 'swap rows 1 and 3, then', value: 1}
        - {label: '', value: 0}
    kk: {choices: [-3, -2, 2, 3, 4]}
    mm: {choices: [-4, -2, -1, 2, 5]}
  calc:
    sg: if(sw == 1, -1, 1) + 0
    dB: if(sw == 1, -1, 1)*kk*dA + 0
  prompt: |-
    $A$ is $3 \times 3$ with $\det A = {dA}$. To get $B$ you {sw} multiply row 2 by {kk}, then replace row 3 by $R_3 {mm:signedcoef}R_1$. What is $\det B$?
  answers:
    - {name: dB, label: '$\det B =$'}
  solution: |-
    A row swap (if there is one) multiplies the determinant by $-1$, scaling a row by {kk} multiplies it by {kk}, and a replacement changes nothing. The overall factor is $({sg})({kk})$, so $\det B = ({sg})({kk})({dA}) =$ **{dB}**.

- id: la-cramer
  title: Cramer's rule for one unknown
  topic: Cramer's rule
  vars:
    a11: {min: -3, max: 3}
    a12: {min: -3, max: 3}
    a13: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a22: {min: -3, max: 3}
    a23: {min: -3, max: 3}
    a31: {min: -3, max: 3}
    a32: {min: -3, max: 3}
    a33: {min: -3, max: 3}
    b1: {min: -5, max: 5}
    b2: {min: -5, max: 5}
    b3: {min: -5, max: 5}
  calc:
    det: a11*(a22*a33 - a23*a32) - a12*(a21*a33 - a23*a31) + a13*(a21*a32 - a22*a31) + 0
    d2: a11*(b2*a33 - a23*b3) - b1*(a21*a33 - a23*a31) + a13*(a21*b3 - b2*a31) + 0
    x2: (a11*(b2*a33 - a23*b3) - b1*(a21*a33 - a23*a31) + a13*(a21*b3 - b2*a31))/(a11*(a22*a33 - a23*a32) - a12*(a21*a33 - a23*a31) + a13*(a21*a32 - a22*a31)) + 0
  where: ["det != 0", "abs(det) <= 15", "b1 != 0 or b2 != 0 or b3 != 0"]
  prompt: |-
    Use Cramer's rule to find $x_2$ (exact fraction) for $A\mathbf{x} = \mathbf{b}$ with $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$ and $\mathbf{b} = \begin{bmatrix} {b1} \\ {b2} \\ {b3}\end{bmatrix}$.
  answers:
    - {name: x2, label: '$x_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    $\det A = {det}$. Replace column 2 of $A$ by $\mathbf{b}$:
    $$\det A_2(\mathbf{b}) = \begin{vmatrix} {a11} & {b1} & {a13} \\ {a21} & {b2} & {a23} \\ {a31} & {b3} & {a33}\end{vmatrix} = {d2}.$$
    So $x_2 = \dfrac{{d2}}{{det}} =$ **${x2:texfrac}$**.

- id: la-area
  title: Area of a parallelogram from two vectors
  topic: Area and volume
  vars:
    u1: {min: -5, max: 5}
    u2: {min: -5, max: 5}
    v1: {min: -5, max: 5}
    v2: {min: -5, max: 5}
  calc:
    det: u1*v2 - u2*v1 + 0
    area: abs(u1*v2 - u2*v1) + 0
    s1: u1 + v1 + 0
    s2: u2 + v2 + 0
  where: ["det != 0"]
  prompt: |-
    Find the area of the parallelogram determined by $\mathbf{u} = ({u1}, {u2})$ and $\mathbf{v} = ({v1}, {v2})$.
  answers:
    - {name: area, label: 'Area'}
  figure:
    type: plot
    equal: true
    x: ['min(0, u1, v1, s1) - 1', 'max(0, u1, v1, s1) + 1']
    y: ['min(0, u2, v2, s2) - 1', 'max(0, u2, v2, s2) + 1']
    polygons:
      - {points: [[0, 0], [u1, u2], [s1, s2], [v1, v2]]}
    segments:
      - {from: [0, 0], to: [u1, u2], arrow: true, label: u}
      - {from: [0, 0], to: [v1, v2], arrow: true, label: v}
  solution: |-
    Area $= \left|\det\begin{bmatrix} {u1} & {v1} \\ {u2} & {v2}\end{bmatrix}\right| = |({u1})({v2}) - ({v1})({u2})| = |{det}| =$ **{area}**.

- id: la-area-image
  title: Area of the image of a region
  topic: Area and volume
  vars:
    a11: {min: -4, max: 4}
    a12: {min: -4, max: 4}
    a21: {min: -4, max: 4}
    a22: {min: -4, max: 4}
    rg:
      choices:
        - {label: 'a rectangle 3 units wide and 2 units tall', value: 6}
        - {label: 'the triangle with vertices $(0, 0)$, $(4, 0)$, $(0, 5)$', value: 10}
        - {label: 'a square with side 4', value: 16}
        - {label: 'the triangle with vertices $(1, 1)$, $(3, 1)$, $(1, 4)$', value: 3}
  calc:
    det: a11*a22 - a12*a21 + 0
    img: abs(a11*a22 - a12*a21)*rg + 0
    ad: abs(a11*a22 - a12*a21) + 0
  where: ["det != 0"]
  prompt: |-
    $T(\mathbf{x}) = A\mathbf{x}$ with $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$. What is the area of the image under $T$ of {rg}?
  answers:
    - {name: img, label: 'Area of image'}
  solution: |-
    The region has area {rg:int}, and $T$ multiplies every area by $|\det A| = |({a11})({a22}) - ({a12})({a21})| = {ad}$. So the image has area ${ad} \times {rg:int} =$ **{img}**.
