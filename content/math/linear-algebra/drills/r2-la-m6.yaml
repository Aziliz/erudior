# Round 2 drills for la-m6 (Determinants): honors lessons 21h1 and 21h2

- id: la-m6-r2-perm-sign
  title: Inversions and sign of a permutation
  topic: Permutation formula
  vars:
    pp: {choices: [12354, 12435, 12453, 12534, 12543, 13245, 13254, 13425, 13452, 13524, 13542, 14235, 14253, 14325, 14352, 14523, 14532, 15234, 15243, 15324, 15342, 15423, 15432, 21345, 21354, 21435, 21453, 21534, 21543, 23145, 23154, 23415, 23451, 23514, 23541, 24135, 24153, 24315, 24351, 24513, 24531, 25134, 25143, 25314, 25341, 25413, 25431, 31245, 31254, 31425, 31452, 31524, 31542, 32145, 32154, 32415, 32451, 32514, 32541, 34125, 34152, 34215, 34251, 34512, 34521, 35124, 35142, 35214, 35241, 35412, 35421, 41235, 41253, 41325, 41352, 41523, 41532, 42135, 42153, 42315, 42351, 42513, 42531, 43125, 43152, 43215, 43251, 43512, 43521, 45123, 45132, 45213, 45231, 45312, 45321, 51234, 51243, 51324, 51342, 51423, 51432, 52134, 52143, 52314, 52341, 52413, 52431, 53124, 53142, 53214, 53241, 53412, 53421, 54123, 54132, 54213, 54231, 54312, 54321]}
  calc:
    d1: floor(pp/10000) + 0
    d2: mod(floor(pp/1000), 10) + 0
    d3: mod(floor(pp/100), 10) + 0
    d4: mod(floor(pp/10), 10) + 0
    d5: mod(pp, 10) + 0
    c1: (d1 > d2) + (d1 > d3) + (d1 > d4) + (d1 > d5) + 0
    c2: (d2 > d3) + (d2 > d4) + (d2 > d5) + 0
    c3: (d3 > d4) + (d3 > d5) + 0
    c4: (d4 > d5) + 0
    inv: c1 + c2 + c3 + c4 + 0
    sg: (-1)^inv + 0
  where: ["inv >= 3"]
  prompt: |-
    Find the number of inversions and the sign of the permutation $\sigma = ({d1}, {d2}, {d3}, {d4}, {d5})$.
  answers:
    - {name: inv, label: 'Number of inversions'}
    - {name: sg, label: '$\operatorname{sgn}\sigma =$'}
  solution: |-
    For each entry, count the entries to its right that are smaller: {d1} has {c1}, {d2} has {c2}, {d3} has {c3}, {d4} has {c4}, and the last entry has none.
    Inversions: ${c1} + {c2} + {c3} + {c4} = {inv}$, so $\operatorname{sgn}\sigma = (-1)^{{inv}} = {sg}$.
    Answers: **{inv}** inversions, sign **{sg}**.

- id: la-m6-r2-perm-det
  title: Determinant of a matrix with one nonzero entry per row and column
  topic: Permutation formula
  vars:
    pp: {choices: [1243, 1324, 1342, 1423, 1432, 2134, 2143, 2314, 2341, 2413, 2431, 3124, 3142, 3214, 3241, 3412, 3421, 4123, 4132, 4213, 4231, 4312, 4321]}
    k1: {choices: [-3, -2, -1, 1, 2, 3, 4]}
    k2: {choices: [-3, -2, -1, 1, 2, 3, 4]}
    k3: {choices: [-3, -2, -1, 1, 2, 3, 4]}
    k4: {choices: [-3, -2, -1, 1, 2, 3, 4]}
  calc:
    s1: floor(pp/1000) + 0
    s2: mod(floor(pp/100), 10) + 0
    s3: mod(floor(pp/10), 10) + 0
    s4: mod(pp, 10) + 0
    e11: if(s1 == 1, k1, 0) + 0
    e12: if(s1 == 2, k1, 0) + 0
    e13: if(s1 == 3, k1, 0) + 0
    e14: if(s1 == 4, k1, 0) + 0
    e21: if(s2 == 1, k2, 0) + 0
    e22: if(s2 == 2, k2, 0) + 0
    e23: if(s2 == 3, k2, 0) + 0
    e24: if(s2 == 4, k2, 0) + 0
    e31: if(s3 == 1, k3, 0) + 0
    e32: if(s3 == 2, k3, 0) + 0
    e33: if(s3 == 3, k3, 0) + 0
    e34: if(s3 == 4, k3, 0) + 0
    e41: if(s4 == 1, k4, 0) + 0
    e42: if(s4 == 2, k4, 0) + 0
    e43: if(s4 == 3, k4, 0) + 0
    e44: if(s4 == 4, k4, 0) + 0
    inv: (s1 > s2) + (s1 > s3) + (s1 > s4) + (s2 > s3) + (s2 > s4) + (s3 > s4) + 0
    sg: (-1)^inv + 0
    det: (-1)^inv*k1*k2*k3*k4 + 0
  where: ["abs(k1*k2*k3*k4) <= 48"]
  prompt: |-
    Use the permutation formula to compute $\det\begin{bmatrix} {e11} & {e12} & {e13} & {e14} \\ {e21} & {e22} & {e23} & {e24} \\ {e31} & {e32} & {e33} & {e34} \\ {e41} & {e42} & {e43} & {e44}\end{bmatrix}$.
  answers:
    - {name: det, label: '$\det =$'}
  solution: |-
    Each row has one nonzero entry, in columns {s1}, {s2}, {s3}, {s4}, so only the term for $\sigma = ({s1}, {s2}, {s3}, {s4})$ is nonzero.
    That permutation has {inv} inversions, so its sign is $(-1)^{{inv}} = {sg}$.
    $\det = ({sg})({k1})({k2})({k3})({k4}) =$ **{det}**.

- id: la-m6-r2-cross
  title: Cross product of two vectors
  topic: Cross product
  vars:
    u1: {min: -4, max: 4}
    u2: {min: -4, max: 4}
    u3: {min: -4, max: 4}
    v1: {min: -4, max: 4}
    v2: {min: -4, max: 4}
    v3: {min: -4, max: 4}
  calc:
    c1: u2*v3 - u3*v2 + 0
    c2: u3*v1 - u1*v3 + 0
    c3: u1*v2 - u2*v1 + 0
  where: ["c1 != 0 or c2 != 0 or c3 != 0", "u1*u2*u3 != 0 or v1*v2*v3 != 0"]
  prompt: |-
    Find $\mathbf{u} \times \mathbf{v}$ for $\mathbf{u} = ({u1}, {u2}, {u3})$ and $\mathbf{v} = ({v1}, {v2}, {v3})$.
  answers:
    - {name: c1, label: 'first component'}
    - {name: c2, label: 'second component'}
    - {name: c3, label: 'third component'}
  solution: |-
    Expand $\begin{vmatrix} \mathbf{e}_1 & \mathbf{e}_2 & \mathbf{e}_3 \\ {u1} & {u2} & {u3} \\ {v1} & {v2} & {v3}\end{vmatrix}$ along row 1:
    - first: $({u2})({v3}) - ({u3})({v2}) = {c1}$
    - second: $({u3})({v1}) - ({u1})({v3}) = {c2}$ (the middle cofactor carries a minus sign)
    - third: $({u1})({v2}) - ({u2})({v1}) = {c3}$

    So $\mathbf{u} \times \mathbf{v} =$ **({c1}, {c2}, {c3})**. Check: its dot product with $\mathbf{u}$ and with $\mathbf{v}$ is 0.

- id: la-m6-r2-tetra
  title: Volume of a tetrahedron
  topic: Cross product
  vars:
    a1: {min: -2, max: 2}
    a2: {min: -2, max: 2}
    a3: {min: -2, max: 2}
    b1: {min: -3, max: 3}
    b2: {min: -3, max: 3}
    b3: {min: -3, max: 3}
    q1: {min: -3, max: 3}
    q2: {min: -3, max: 3}
    q3: {min: -3, max: 3}
    w1: {min: -3, max: 3}
    w2: {min: -3, max: 3}
    w3: {min: -3, max: 3}
  calc:
    p11: b1 - a1 + 0
    p12: b2 - a2 + 0
    p13: b3 - a3 + 0
    p21: q1 - a1 + 0
    p22: q2 - a2 + 0
    p23: q3 - a3 + 0
    p31: w1 - a1 + 0
    p32: w2 - a2 + 0
    p33: w3 - a3 + 0
    m1: p22*p33 - p23*p32 + 0
    m2: p21*p33 - p23*p31 + 0
    m3: p21*p32 - p22*p31 + 0
    det: p11*m1 - p12*m2 + p13*m3 + 0
    vol: abs(det)/6
  where: ["det != 0"]
  prompt: |-
    Find the volume of the tetrahedron with corners $({a1}, {a2}, {a3})$, $({b1}, {b2}, {b3})$, $({q1}, {q2}, {q3})$ and $({w1}, {w2}, {w3})$. Give an exact fraction.
  answers:
    - {name: vol, label: 'Volume', kind: fraction, lowestTerms: true}
  solution: |-
    Subtract the first corner from the others to get the edge vectors $({p11}, {p12}, {p13})$, $({p21}, {p22}, {p23})$, $({p31}, {p32}, {p33})$. With them as rows, expand along row 1:
    $$\begin{vmatrix} {p11} & {p12} & {p13} \\ {p21} & {p22} & {p23} \\ {p31} & {p32} & {p33}\end{vmatrix} = ({p11})({m1}) - ({p12})({m2}) + ({p13})({m3}) = {det}.$$
    The tetrahedron is $\tfrac16$ of the parallelepiped on these edges, so its volume is $\dfrac{|{det}|}{6} =$ **${vol:texfrac}$**.

- id: la-m6-r2-shoelace
  title: Area of a quadrilateral by the shoelace formula
  topic: Orientation and polygon area
  vars:
    x1: {min: 1, max: 6}
    y1: {min: 1, max: 6}
    x2: {min: 1, max: 6}
    y2: {min: 1, max: 6}
    x3: {min: 1, max: 6}
    y3: {min: 1, max: 6}
    x4: {min: 1, max: 6}
    y4: {min: 1, max: 6}
  calc:
    nx2: -x2 + 0
    nx3: -x3 + 0
    ny3: -y3 + 0
    ny4: -y4 + 0
    t1: x1*y2 + x2*y1 + 0
    t2: x2*y3 + x3*y2 + 0
    t3: x3*y4 + x4*y3 + 0
    t4: x4*y1 + x1*y4 + 0
    tot: t1 + t2 + t3 + t4 + 0
    area: (t1 + t2 + t3 + t4)/2
  prompt: |-
    Find the area of the quadrilateral with corners $P_1 = ({x1}, {y1})$, $P_2 = ({nx2}, {y2})$, $P_3 = ({nx3}, {ny3})$, $P_4 = ({x4}, {ny4})$, listed counterclockwise. (A decimal such as 22.5 is fine.)
  answers:
    - {name: area, label: 'Area', format: num1}
  figure:
    type: plot
    equal: true
    x: [-7, 7]
    y: [-7, 7]
    polygons:
      - {points: [[x1, y1], [nx2, y2], [nx3, ny3], [x4, ny4]]}
    points:
      - {at: [x1, y1], label: P1}
      - {at: [nx2, y2], label: P2}
      - {at: [nx3, ny3], label: P3}
      - {at: [x4, ny4], label: P4}
  solution: |-
    Shoelace terms $x_iy_{i+1} - x_{i+1}y_i$, wrapping from $P_4$ back to $P_1$:
    - $P_1, P_2$: $({x1})({y2}) - ({nx2})({y1}) = {t1}$
    - $P_2, P_3$: $({nx2})({ny3}) - ({nx3})({y2}) = {t2}$
    - $P_3, P_4$: $({nx3})({ny4}) - ({x4})({ny3}) = {t3}$
    - $P_4, P_1$: $({x4})({y1}) - ({x1})({ny4}) = {t4}$

    The sum is {tot}, so the area is $\tfrac12({tot}) =$ **{area}**.
