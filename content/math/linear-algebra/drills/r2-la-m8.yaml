# Round 2 drills for module la-m8 (honors lessons 32h1-32h3)

- id: la-m8-r2-ch-cube
  title: Cayley–Hamilton for a 2×2 power
  topic: Cayley–Hamilton theorem
  vars:
    a11: {min: -4, max: 5}
    a12: {min: -3, max: 4}
    a21: {min: -3, max: 4}
    a22: {min: -4, max: 5}
  where: ["a12 != 0", "a21 != 0", "a11 + a22 != 0"]
  calc:
    trc: a11 + a22 + 0
    dt: a11*a22 - a12*a21 + 0
    ndt: -(a11*a22 - a12*a21) + 0
    al: (a11 + a22)^2 - (a11*a22 - a12*a21) + 0
    be: -(a11 + a22)*(a11*a22 - a12*a21) + 0
    tdt: (a11 + a22)*(a11*a22 - a12*a21) + 0
    trsq: (a11 + a22)^2 + 0
  prompt: |-
    Let $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$. Use the Cayley–Hamilton theorem to write $A^3 = \alpha A + \beta I$. Find $\alpha$ and $\beta$.
  answers:
    - {name: al, label: '$\alpha =$'}
    - {name: be, label: '$\beta =$'}
  solution: |-
    $\operatorname{tr} A = {trc}$ and $\det A = {dt}$, so Cayley–Hamilton gives $A^2 - ({trc})A + ({dt})I = 0$, that is, $A^2 = {trc:coef}A + ({ndt})I$.
    Multiply by $A$: $A^3 = {trc:coef}A^2 + ({ndt})A$. Replace $A^2$ again: $A^3 = ({trc})\big({trc:coef}A + ({ndt})I\big) + ({ndt})A = ({trsq} + ({ndt}))A + ({trc})({ndt})I$.
    So $\alpha =$ **{al}** and $\beta =$ **{be}**. (In general $\alpha = (\operatorname{tr} A)^2 - \det A$ and $\beta = -(\operatorname{tr} A)(\det A)$.)

- id: la-m8-r2-ch-inverse
  title: Inverse from Cayley–Hamilton
  topic: Cayley–Hamilton theorem
  vars:
    a11: {min: -4, max: 5}
    a12: {min: -3, max: 4}
    a21: {min: -3, max: 4}
    a22: {min: -4, max: 5}
  where: ["a12 != 0", "a11*a22 - a12*a21 != 0", "a11 + a22 != 0"]
  calc:
    trc: a11 + a22 + 0
    dt: a11*a22 - a12*a21 + 0
    pc: -1/(a11*a22 - a12*a21)
    qc: (a11 + a22)/(a11*a22 - a12*a21)
  prompt: |-
    Let $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$. Use the Cayley–Hamilton theorem to write $A^{-1} = pA + qI$. Find $p$ and $q$ as exact fractions or whole numbers.
  answers:
    - {name: pc, label: '$p =$', kind: fraction}
    - {name: qc, label: '$q =$', kind: fraction}
  solution: |-
    $\operatorname{tr} A = {trc}$ and $\det A = {dt}$, so $A^2 - ({trc})A + ({dt})I = 0$. Rearrange: $A\big(({trc})I - A\big) = ({dt})I$, so
    $$A^{-1} = \frac{1}{{dt}}\big(({trc})I - A\big) = -\frac{1}{{dt}}A + \frac{{trc}}{{dt}}I.$$
    So $p =$ **${pc:texfrac}$** and $q =$ **${qc:texfrac}$**.

- id: la-m8-r2-jordan-power
  title: Power of a Jordan block
  topic: Jordan form
  vars:
    lam: {choices: [-3, -2, 2, 3]}
    kk: {min: 3, max: 6}
  calc:
    km1: kk - 1
    dg: lam^kk + 0
    up: kk*lam^(kk - 1) + 0
    lp: lam^(kk - 1) + 0
  prompt: |-
    Let $J = \begin{bmatrix} {lam} & 1 \\ 0 & {lam}\end{bmatrix}$. Find the diagonal entry and the top-right entry of $J^{{kk}}$.
  answers:
    - {name: dg, label: 'diagonal entry'}
    - {name: up, label: 'top-right entry'}
  solution: |-
    Write $J = {lam}I + N$ with $N = \begin{bmatrix} 0 & 1 \\ 0 & 0\end{bmatrix}$. The two parts commute and $N^2 = 0$, so the binomial expansion stops after two terms:
    $J^{{kk}} = ({lam})^{{kk}}I + {kk}({lam})^{{km1}}N$.
    Diagonal entry: $({lam})^{{kk}} =$ **{dg}**. Top-right entry: ${kk} \cdot ({lam})^{{km1}} = {kk} \cdot ({lp}) =$ **{up}**.

- id: la-m8-r2-jordan-ode
  title: Solve x' = Jx for a Jordan block
  topic: Jordan form
  vars:
    lam: {choices: [-3, -2, -1, 1, 2]}
    u: {min: -4, max: 4}
    v: {min: -4, max: 4}
  where: ["u != 0", "v != 0"]
  prompt: |-
    Solve $\mathbf{x}' = J\mathbf{x}$ with $J = \begin{bmatrix} {lam} & 1 \\ 0 & {lam}\end{bmatrix}$ and $\mathbf{x}(0) = ({u}, {v})$. Give both entries of $\mathbf{x}(t)$ (type e^(2t) for $e^{2t}$).
  answers:
    - {kind: expression, expression: 'exp(lam*t)*(u + v*t)', variables: [t], label: '$x_1(t) =$', show: '$e^{{lam:coef}t}({u} {v:signedcoef}t)$'}
    - {kind: expression, expression: 'v*exp(lam*t)', variables: [t], label: '$x_2(t) =$', show: '${v:coef}e^{{lam:coef}t}$'}
  solution: |-
    $J = {lam}I + N$ with $N^2 = 0$, so $e^{Jt} = e^{{lam:coef}t}(I + tN) = e^{{lam:coef}t}\begin{bmatrix} 1 & t \\ 0 & 1\end{bmatrix}$.
    Then $\mathbf{x}(t) = e^{Jt}\mathbf{x}(0) = e^{{lam:coef}t}({u} {v:signedcoef}t,\ {v})$:
    $x_1(t) =$ **$e^{{lam:coef}t}({u} {v:signedcoef}t)$** and $x_2(t) =$ **${v:coef}e^{{lam:coef}t}$**.
    Check: the second equation $x_2' = {lam}x_2$ is solved by $x_2$ alone, and at $t = 0$ the solution is $({u}, {v})$.

- id: la-m8-r2-leslie-step
  title: One step of a Leslie model
  topic: Leslie models
  vars:
    f2: {choices: [0.5, 1, 1.5, 2, 2.5, 3]}
    f3: {choices: [0.5, 1, 1.5, 2]}
    s1: {choices: [0.4, 0.5, 0.6, 0.7, 0.8, 0.9]}
    s2: {choices: [0.3, 0.4, 0.5, 0.6, 0.8]}
    p1: {min: 4, max: 20}
    p2: {min: 2, max: 12}
    p3: {min: 1, max: 8}
  calc:
    x1: 10*p1
    x2: 10*p2
    x3: 10*p3
    y1: round(f2*10*p2 + f3*10*p3, 2)
    y2: round(s1*10*p1, 2)
    y3: round(s2*10*p2, 2)
    t1: round(f2*10*p2, 2)
    t2: round(f3*10*p3, 2)
  prompt: |-
    A population has three age classes and Leslie matrix $L = \begin{bmatrix} 0 & {f2} & {f3} \\ {s1} & 0 & 0 \\ 0 & {s2} & 0\end{bmatrix}$. This year's counts are $\mathbf{x}_0 = ({x1}, {x2}, {x3})$. Find next year's counts $\mathbf{x}_1 = L\mathbf{x}_0$.
  answers:
    - {name: y1, label: 'class 1 (newborns)'}
    - {name: y2, label: 'class 2'}
    - {name: y3, label: 'class 3'}
  solution: |-
    Newborns come from classes 2 and 3: ${f2}({x2}) + {f3}({x3}) = {t1} + {t2} =$ **{y1}**.
    Survivors move up one class: class 2 gets ${s1}({x1}) =$ **{y2}** and class 3 gets ${s2}({x2}) =$ **{y3}**.
    (Class 3 animals that survive leave the model: there is no class 4.)

- id: la-m8-r2-leslie-growth
  title: Growth rate and stable age distribution (2 classes)
  topic: Leslie models
  vars:
    rr: {choices: [0.8, 0.9, 1.2, 1.25, 1.5, 2]}
    mu: {choices: [-0.2, -0.25, -0.3, -0.4, -0.5, -0.6]}
    s: {choices: [0.4, 0.5, 0.6, 0.75, 0.8]}
  where: ["rr + mu > 0", "abs(-rr*mu/s - round(-rr*mu/s, 2)) < 0.000001"]
  calc:
    f1: round(rr + mu, 2)
    f2: round(-rr*mu/s, 2)
    prod: round(-rr*mu, 4)
    frac1: rr/(rr + s)
    ratio: round(s/rr, 4)
    r0: round(rr + mu + (-rr*mu), 4)
  prompt: |-
    A population has two age classes with Leslie matrix $L = \begin{bmatrix} {f1} & {f2} \\ {s} & 0\end{bmatrix}$. Find the long-run growth factor $r$ (the dominant eigenvalue), the fraction of the population in class 1 in the stable age distribution (to 3 decimal places), and $R_0$.
  answers:
    - {name: rr, label: '$r =$'}
    - {name: frac1, label: 'fraction in class 1', tolerance: 0.0006}
    - {name: r0, label: '$R_0 =$'}
  solution: |-
    The characteristic equation is $\lambda^2 - {f1}\lambda - ({f2})({s}) = \lambda^2 - {f1}\lambda - {prod} = 0$. Its roots are {rr} and {mu} (they add to {f1} and multiply to $-{prod}$), so $r =$ **{rr}**.
    Eigenvector for $r$: the second row says ${s}x_1 = {rr}x_2$, so $\mathbf{v} = (1, {ratio})$. The fraction in class 1 is $\dfrac{1}{1 + {ratio}} \approx$ **{frac1:dp3}**.
    $R_0 = f_1 + f_2 s_1 = {f1} + ({f2})({s}) =$ **{r0}**, which is on the same side of 1 as $r$.
