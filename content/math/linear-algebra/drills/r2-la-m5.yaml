# Round 2 drills for module la-m5 (honors lessons 18h1 and 18h2)

- id: la-m5-r2-plu
  title: PA = LU when a zero pivot forces a row swap
  topic: Pivoting and LDU
  vars:
    u11: {choices: [1, 2, -1, -2]}
    u12: {min: -3, max: 3}
    u13: {min: -3, max: 3}
    u22: {choices: [1, 2, 3, -1, -2, -3]}
    u23: {min: -3, max: 3}
    u33: {choices: [1, 2, 3, 4, -1, -2, -3]}
    m2: {choices: [1, 2, 3, -1, -2, -3]}
    m3: {choices: [1, 2, 3, -1, -2, -3]}
  where: ["m2 != m3"]
  calc:
    a21: m2*u11 + 0
    a22: m2*u12 + 0
    a23: m2*u13 + u33 + 0
    a31: m3*u11 + 0
    a32: m3*u12 + u22 + 0
    a33: m3*u13 + u23 + 0
  prompt: |-
    Row-reduce $A = \begin{bmatrix} {u11} & {u12} & {u13} \\ {a21} & {a22} & {a23} \\ {a31} & {a32} & {a33}\end{bmatrix}$ using row replacements, swapping rows only when a zero pivot forces it (no partial pivoting). Write the result as $PA = LU$ with $L$ unit lower triangular. Give $\ell_{21}$, $\ell_{31}$, $u_{22}$ and $u_{33}$.
  answers:
    - {name: m3, label: '$\ell_{21} =$'}
    - {name: m2, label: '$\ell_{31} =$'}
    - {name: u22, label: '$u_{22} =$'}
    - {name: u33, label: '$u_{33} =$'}
  solution: |-
    Column 1: $R_2 \leftarrow R_2 - ({m2})R_1$ gives $[\,0 \;\; 0 \;\; {u33}\,]$ (multiplier {m2}), and $R_3 \leftarrow R_3 - ({m3})R_1$ gives $[\,0 \;\; {u22} \;\; {u23}\,]$ (multiplier {m3}).
    Column 2: the pivot position holds 0, so swap rows 2 and 3, and their multipliers with them. Now row 2 is $[\,0 \;\; {u22} \;\; {u23}\,]$ and the entry below its pivot is already 0, so $\ell_{32} = 0$.
    $$P = \begin{bmatrix} 1 & 0 & 0 \\ 0 & 0 & 1 \\ 0 & 1 & 0\end{bmatrix}, \quad L = \begin{bmatrix} 1 & 0 & 0 \\ {m3} & 1 & 0 \\ {m2} & 0 & 1\end{bmatrix}, \quad U = \begin{bmatrix} {u11} & {u12} & {u13} \\ 0 & {u22} & {u23} \\ 0 & 0 & {u33}\end{bmatrix}.$$
    **Answer:** $\ell_{21} = {m3}$, $\ell_{31} = {m2}$, $u_{22} = {u22}$, $u_{33} = {u33}$.

- id: la-m5-r2-plu-solve
  title: Solve Ax = b from PA = LU
  topic: Pivoting and LDU
  vars:
    sw:
      choices:
        - {label: '1 and 2', value: 0}
        - {label: '2 and 3', value: 1}
    l21: {min: -3, max: 3}
    l31: {min: -3, max: 3}
    l32: {min: -3, max: 3}
    u11: {choices: [1, 2, -1]}
    u12: {min: -3, max: 3}
    u13: {min: -3, max: 3}
    u22: {choices: [1, 2, -1, -2]}
    u23: {min: -3, max: 3}
    u33: {choices: [1, 2, 3, -1, -2]}
    x1: {min: -4, max: 4}
    x2: {min: -4, max: 4}
    x3: {min: -4, max: 4}
  where: ["l21 != 0 or l31 != 0", "x1 != 0 or x2 != 0"]
  calc:
    y1: u11*x1 + u12*x2 + u13*x3 + 0
    y2: u22*x2 + u23*x3 + 0
    y3: u33*x3 + 0
    z2: l21*(u11*x1 + u12*x2 + u13*x3) + u22*x2 + u23*x3 + 0
    z3: l31*(u11*x1 + u12*x2 + u13*x3) + l32*(u22*x2 + u23*x3) + u33*x3 + 0
    b1: if(sw == 0, l21*(u11*x1 + u12*x2 + u13*x3) + u22*x2 + u23*x3, u11*x1 + u12*x2 + u13*x3) + 0
    b2: if(sw == 0, u11*x1 + u12*x2 + u13*x3, l31*(u11*x1 + u12*x2 + u13*x3) + l32*(u22*x2 + u23*x3) + u33*x3) + 0
    b3: if(sw == 0, l31*(u11*x1 + u12*x2 + u13*x3) + l32*(u22*x2 + u23*x3) + u33*x3, l21*(u11*x1 + u12*x2 + u13*x3) + u22*x2 + u23*x3) + 0
  prompt: |-
    $PA = LU$, where $P$ swaps rows {sw}, $L = \begin{bmatrix} 1 & 0 & 0 \\ {l21} & 1 & 0 \\ {l31} & {l32} & 1\end{bmatrix}$ and $U = \begin{bmatrix} {u11} & {u12} & {u13} \\ 0 & {u22} & {u23} \\ 0 & 0 & {u33}\end{bmatrix}$. Solve $A\mathbf{x} = \mathbf{b}$ for $\mathbf{b} = ({b1}, {b2}, {b3})$.
  answers:
    - {name: x1, label: '$x_1 =$'}
    - {name: x2, label: '$x_2 =$'}
    - {name: x3, label: '$x_3 =$'}
  solution: |-
    Multiply by $P$: $LU\mathbf{x} = P\mathbf{b}$. Swapping entries {sw} of $\mathbf{b}$ gives $P\mathbf{b} = ({y1}, {z2}, {z3})$.
    Forward substitution in $L\mathbf{y} = P\mathbf{b}$: $y_1 = {y1}$, $y_2 = {z2} - ({l21})({y1}) = {y2}$, $y_3 = {z3} - ({l31})({y1}) - ({l32})({y2}) = {y3}$.
    Back-substitution in $U\mathbf{x} = \mathbf{y}$: $x_3 = {y3}/({u33}) = {x3}$, then $x_2 = ({y2} - ({u23})({x3}))/({u22}) = {x2}$, then $x_1 = ({y1} - ({u12})({x2}) - ({u13})({x3}))/({u11}) = {x1}$.
    **Answer:** $\mathbf{x} = ({x1}, {x2}, {x3})$.

- id: la-m5-r2-ldlt
  title: LDLᵀ factorization of a symmetric 2×2 matrix
  topic: Pivoting and LDU
  vars:
    a: {choices: [1, 2, 3, 4, 5, -2, -3]}
    b: {min: -6, max: 6}
    c: {min: -5, max: 9}
  where: ["b != 0", "a*c - b*b != 0"]
  calc:
    ell: b/a
    d2: c - b*b/a
  prompt: |-
    Write the symmetric matrix $S = \begin{bmatrix} {a} & {b} \\ {b} & {c}\end{bmatrix}$ as $S = LDL^T$ with $L = \begin{bmatrix} 1 & 0 \\ \ell & 1\end{bmatrix}$ and $D = \begin{bmatrix} d_1 & 0 \\ 0 & d_2\end{bmatrix}$. Give exact fractions.
  answers:
    - {name: ell, label: '$\ell =$', kind: fraction, lowestTerms: true}
    - {name: a, label: '$d_1 =$', kind: fraction, lowestTerms: true}
    - {name: d2, label: '$d_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    The first pivot is $d_1 = {a}$. The multiplier is $\ell = {b}/({a}) = {ell:texfrac}$, and $R_2 \leftarrow R_2 - \ell R_1$ leaves the second pivot $d_2 = {c} - ({ell:texfrac})({b}) = {d2:texfrac}$.
    Because $S$ is symmetric, the unit upper factor is $L^T$, so $S = LDL^T$.
    **Answer:** $\ell = {ell:texfrac}$, $d_1 = {a}$, $d_2 = {d2:texfrac}$.

- id: la-m5-r2-block-inv
  title: Inverse of a block upper triangular matrix
  topic: Block elimination
  vars:
    p: {min: -2, max: 2}
    q: {min: -2, max: 2}
    e1: {min: -3, max: 3}
    e2: {min: -3, max: 3}
    dd: {choices: [1, -1, 2, -2]}
  where: ["p != 0 or q != 0", "e1 != 0 or e2 != 0"]
  calc:
    a11: 1 + p*q + 0
    ai12: -p + 0
    ai21: -q + 0
    ai22: 1 + p*q + 0
    w1: e1 - p*e2 + 0
    w2: -q*e1 + (1 + p*q)*e2 + 0
    y1: -(e1 - p*e2)/dd + 0
    y2: -(-q*e1 + (1 + p*q)*e2)/dd + 0
  prompt: |-
    $M = \begin{bmatrix} A & B \\ 0 & D\end{bmatrix} = \begin{bmatrix} {a11} & {p} & {e1} \\ {q} & 1 & {e2} \\ 0 & 0 & {dd}\end{bmatrix}$, with $A$ the upper-left $2 \times 2$ block. Find the upper-right block $Y = -A^{-1}BD^{-1}$ of $M^{-1}$. Give exact fractions.
  answers:
    - {name: y1, label: '$Y$, entry 1', kind: fraction, lowestTerms: true}
    - {name: y2, label: '$Y$, entry 2', kind: fraction, lowestTerms: true}
  solution: |-
    $\det A = ({a11})(1) - ({p})({q}) = 1$, so $A^{-1} = \begin{bmatrix} 1 & {ai12} \\ {ai21} & {ai22}\end{bmatrix}$ and $A^{-1}B = A^{-1}\begin{bmatrix} {e1} \\ {e2}\end{bmatrix} = \begin{bmatrix} {w1} \\ {w2}\end{bmatrix}$.
    $D^{-1} = 1/({dd})$, so $Y = -\dfrac{1}{{dd}}\begin{bmatrix} {w1} \\ {w2}\end{bmatrix} =$ **$\begin{bmatrix} {y1:texfrac} \\ {y2:texfrac}\end{bmatrix}$**.

- id: la-m5-r2-schur
  title: Schur complement of a 2×2 block
  topic: Block elimination
  vars:
    p: {min: -2, max: 2}
    q: {min: -2, max: 2}
    e1: {min: -3, max: 3}
    e2: {min: -3, max: 3}
    c1: {min: -3, max: 3}
    c2: {min: -3, max: 3}
    dd: {min: -6, max: 9}
  where: ["p != 0 or q != 0", "e1 != 0 or e2 != 0", "c1 != 0 or c2 != 0"]
  calc:
    a11: 1 + p*q + 0
    ai12: -p + 0
    ai21: -q + 0
    ai22: 1 + p*q + 0
    w1: e1 - p*e2 + 0
    w2: -q*e1 + (1 + p*q)*e2 + 0
    cw: c1*(e1 - p*e2) + c2*(-q*e1 + (1 + p*q)*e2) + 0
    s: dd - (c1*(e1 - p*e2) + c2*(-q*e1 + (1 + p*q)*e2)) + 0
  prompt: |-
    Partition $M = \begin{bmatrix} {a11} & {p} & {e1} \\ {q} & 1 & {e2} \\ {c1} & {c2} & {dd}\end{bmatrix}$ as $\begin{bmatrix} A & B \\ C & D\end{bmatrix}$ with $A$ the upper-left $2 \times 2$ block. Find $A^{-1}B$ and the Schur complement $S = D - CA^{-1}B$ (a single number).
  answers:
    - {name: w1, label: '$A^{-1}B$, entry 1'}
    - {name: w2, label: '$A^{-1}B$, entry 2'}
    - {name: s, label: '$S =$'}
  solution: |-
    $\det A = ({a11})(1) - ({p})({q}) = 1$, so $A^{-1} = \begin{bmatrix} 1 & {ai12} \\ {ai21} & {ai22}\end{bmatrix}$ and $A^{-1}B = \begin{bmatrix} {w1} \\ {w2}\end{bmatrix}$.
    Then $CA^{-1}B = ({c1})({w1}) + ({c2})({w2}) = {cw}$, and $S = {dd} - ({cw}) =$ **{s}**. ($M$ is invertible exactly when $S \ne 0$.)

- id: la-m5-r2-sherman
  title: Update an inverse with the Sherman–Morrison formula
  topic: Block elimination
  vars:
    pos:
      choices:
        - {label: '(3, 3)', value: 0}
        - {label: '(1, 2)', value: 1}
        - {label: '(2, 1)', value: 2}
        - {label: '(3, 1)', value: 3}
    dl: {choices: [1, 2, -1, -2, 3]}
    l21: {min: -2, max: 2}
    l31: {min: -2, max: 2}
    l32: {min: -2, max: 2}
    v12: {min: -2, max: 2}
    v13: {min: -2, max: 2}
    v23: {min: -2, max: 2}
  calc:
    n11: 1 + 0
    n12: v12 + 0
    n13: v13 + 0
    n21: l21 + 0
    n22: l21*v12 + 1 + 0
    n23: l21*v13 + v23 + 0
    n31: l31 + 0
    n32: l31*v12 + l32 + 0
    n33: l31*v13 + l32*v23 + 1 + 0
    ii: if(pos == 0, 3, if(pos == 1, 1, if(pos == 2, 2, 3))) + 0
    jj: if(pos == 0, 3, if(pos == 1, 2, 1)) + 0
    nji: if(pos == 0, l31*v13 + l32*v23 + 1, if(pos == 1, l21, if(pos == 2, v12, v13))) + 0
    n1i: if(pos == 0, v13, if(pos == 1, 1, if(pos == 2, v12, v13))) + 0
    nj1: if(pos == 0, l31, if(pos == 1, l21, 1)) + 0
    den: 1 + dl*if(pos == 0, l31*v13 + l32*v23 + 1, if(pos == 1, l21, if(pos == 2, v12, v13))) + 0
    new11: 1 - dl*if(pos == 0, v13, if(pos == 1, 1, if(pos == 2, v12, v13)))*if(pos == 0, l31, if(pos == 1, l21, 1))/(1 + dl*if(pos == 0, l31*v13 + l32*v23 + 1, if(pos == 1, l21, if(pos == 2, v12, v13)))) + 0
  where: ["den != 0", "n1i*nj1 != 0", "l21 != 0 or l31 != 0"]
  prompt: |-
    An invertible matrix $A$ has $A^{-1} = \begin{bmatrix} {n11} & {n12} & {n13} \\ {n21} & {n22} & {n23} \\ {n31} & {n32} & {n33}\end{bmatrix}$. The entry of $A$ in position {pos} changes by adding {dl}, giving $A' = A {dl:signedcoef}\mathbf{e}_{ii}\mathbf{e}_{jj}^T$. Use the Sherman–Morrison formula to find the denominator $1 + \mathbf{v}^TA^{-1}\mathbf{u}$ and the $(1, 1)$ entry of $(A')^{-1}$. Give exact fractions.
  answers:
    - {name: den, label: 'Denominator', kind: fraction, lowestTerms: true}
    - {name: new11, label: '$(1, 1)$ entry of $(A'')^{-1}$', kind: fraction, lowestTerms: true}
  solution: |-
    Take $\mathbf{u} = {dl}\,\mathbf{e}_{ii}$ and $\mathbf{v} = \mathbf{e}_{jj}$. Then $\mathbf{v}^TA^{-1}\mathbf{u} = {dl}\,(A^{-1})_{{jj},{ii}} = ({dl})({nji})$, so the denominator is $1 + ({dl})({nji}) =$ **{den}**, nonzero, so $A'$ is invertible.
    The correction to entry $(1, 1)$ is $\dfrac{(A^{-1}\mathbf{u})_1(\mathbf{v}^TA^{-1})_1}{{den}} = \dfrac{({dl})({n1i})({nj1})}{{den}}$, using entry 1 of column {ii} and entry 1 of row {jj} of $A^{-1}$.
    So the new $(1, 1)$ entry is $1 - \dfrac{({dl})({n1i})({nj1})}{{den}} =$ **${new11:texfrac}$**.
