# Module 9 drills

- id: la-dot-len
  title: Dot product and distance
  topic: Inner product
  vars:
    u1: {min: -5, max: 5}
    u2: {min: -5, max: 5}
    u3: {min: -5, max: 5}
    v1: {min: -5, max: 5}
    v2: {min: -5, max: 5}
    v3: {min: -5, max: 5}
  calc:
    dot: u1*v1 + u2*v2 + u3*v3 + 0
    d1: u1 - v1 + 0
    d2: u2 - v2 + 0
    d3: u3 - v3 + 0
    dsq: (u1 - v1)^2 + (u2 - v2)^2 + (u3 - v3)^2 + 0
    dst: sqrt((u1 - v1)^2 + (u2 - v2)^2 + (u3 - v3)^2) + 0
  where: ["dsq > 0"]
  prompt: |-
    For $\mathbf{u} = ({u1}, {u2}, {u3})$ and $\mathbf{v} = ({v1}, {v2}, {v3})$, find $\mathbf{u}\cdot\mathbf{v}$ and $\operatorname{dist}(\mathbf{u}, \mathbf{v})$ (exact like sqrt(29), or 2 decimals).
  answers:
    - {name: dot, label: '$\mathbf{u}\cdot\mathbf{v} =$'}
    - {name: dst, label: 'distance', tolerance: 0.01}
  solution: |-
    $\mathbf{u}\cdot\mathbf{v} = ({u1})({v1}) + ({u2})({v2}) + ({u3})({v3}) =$ **{dot}**.
    $\mathbf{u} - \mathbf{v} = ({d1}, {d2}, {d3})$, so $\operatorname{dist} = \sqrt{{dsq}} \approx$ **{dst:num2}**.

- id: la-angle
  title: Angle between two vectors
  topic: Inner product
  vars:
    u1: {min: -4, max: 4}
    u2: {min: -4, max: 4}
    u3: {min: -4, max: 4}
    v1: {min: -4, max: 4}
    v2: {min: -4, max: 4}
    v3: {min: -4, max: 4}
  calc:
    dot: u1*v1 + u2*v2 + u3*v3 + 0
    nu: sqrt(u1^2 + u2^2 + u3^2) + 0
    nv: sqrt(v1^2 + v2^2 + v3^2) + 0
    cs: (u1*v1 + u2*v2 + u3*v3)/(sqrt(u1^2 + u2^2 + u3^2)*sqrt(v1^2 + v2^2 + v3^2)) + 0
    ang: acosd((u1*v1 + u2*v2 + u3*v3)/(sqrt(u1^2 + u2^2 + u3^2)*sqrt(v1^2 + v2^2 + v3^2))) + 0
  where: ["u1^2 + u2^2 + u3^2 > 0", "v1^2 + v2^2 + v3^2 > 0", "abs(cs) < 0.999"]
  prompt: |-
    Find the angle between $\mathbf{u} = ({u1}, {u2}, {u3})$ and $\mathbf{v} = ({v1}, {v2}, {v3})$ in degrees (1 decimal).
  answers:
    - {name: ang, label: '$\theta =$', tolerance: 0.1, units: {'°': 1, deg: 1}}
  solution: |-
    $\cos\theta = \dfrac{\mathbf{u}\cdot\mathbf{v}}{\|\mathbf{u}\|\,\|\mathbf{v}\|} = \dfrac{{dot}}{({nu:num4})({nv:num4})} \approx {cs:num4}$, so $\theta = \cos^{-1}({cs:num4}) \approx$ **{ang:num1}°**.

- id: la-unit
  title: Normalize a vector
  topic: Inner product
  vars:
    pick:
      choices:
        - {label: '1', value: 0}
        - {label: '2', value: 1}
        - {label: '3', value: 2}
        - {label: '4', value: 3}
        - {label: '5', value: 4}
        - {label: '6', value: 5}
    s1: {choices: [1, -1]}
    s2: {choices: [1, -1]}
    s3: {choices: [1, -1]}
  calc:
    w1: s1*if(pick == 0, 1, if(pick == 1, 2, if(pick == 2, 1, if(pick == 3, 2, if(pick == 4, 4, 3))))) + 0
    w2: s2*if(pick == 0, 2, if(pick == 1, 3, if(pick == 2, 4, if(pick == 3, 6, if(pick == 4, 4, 4))))) + 0
    w3: s3*if(pick == 0, 2, if(pick == 1, 6, if(pick == 2, 8, if(pick == 3, 9, if(pick == 4, 7, 12))))) + 0
    nn: if(pick == 0, 3, if(pick == 1, 7, if(pick == 2, 9, if(pick == 3, 11, if(pick == 4, 9, 13))))) + 0
    e1: w1/nn + 0
    e2: w2/nn + 0
    e3: w3/nn + 0
  prompt: |-
    Find the unit vector in the direction of $\mathbf{v} = ({w1}, {w2}, {w3})$. Give exact fractions.
  answers:
    - {name: e1, label: 'entry 1', kind: fraction, lowestTerms: true}
    - {name: e2, label: 'entry 2', kind: fraction, lowestTerms: true}
    - {name: e3, label: 'entry 3', kind: fraction, lowestTerms: true}
  solution: |-
    $\|\mathbf{v}\| = \sqrt{({w1})^2 + ({w2})^2 + ({w3})^2} = {nn}$. Divide each entry by {nn}:
    **$\left({e1:texfrac},\ {e2:texfrac},\ {e3:texfrac}\right)$**.

- id: la-proj-line
  title: Project onto a line
  topic: Orthogonal projections
  vars:
    y1: {min: -6, max: 6}
    y2: {min: -6, max: 6}
    u1: {min: -4, max: 4}
    u2: {min: -4, max: 4}
  where: ["u1 != 0 or u2 != 0", "y1*u2 - y2*u1 != 0"]
  calc:
    yu: y1*u1 + y2*u2 + 0
    uu: u1^2 + u2^2 + 0
    p1: (y1*u1 + y2*u2)/(u1^2 + u2^2)*u1 + 0
    p2: (y1*u1 + y2*u2)/(u1^2 + u2^2)*u2 + 0
    z1: y1 - (y1*u1 + y2*u2)/(u1^2 + u2^2)*u1 + 0
    z2: y2 - (y1*u1 + y2*u2)/(u1^2 + u2^2)*u2 + 0
    cf: (y1*u1 + y2*u2)/(u1^2 + u2^2) + 0
  prompt: |-
    Find the orthogonal projection of $\mathbf{y} = ({y1}, {y2})$ onto the line spanned by $\mathbf{u} = ({u1}, {u2})$. Give exact fractions.
  answers:
    - {name: p1, label: 'entry 1', kind: fraction, lowestTerms: true}
    - {name: p2, label: 'entry 2', kind: fraction, lowestTerms: true}
  figure:
    type: plot
    equal: true
    x: [-7, 7]
    y: [-7, 7]
    segments:
      - {from: [0, 0], to: [y1, y2], arrow: true, label: y}
      - {from: [0, 0], to: [u1, u2], arrow: true, label: u}
  solution: |-
    $\mathbf{y}\cdot\mathbf{u} = {yu}$ and $\mathbf{u}\cdot\mathbf{u} = {uu}$, so
    $\hat{\mathbf{y}} = {cf:texfrac}\,({u1}, {u2}) =$ **$({p1:texfrac}, {p2:texfrac})$**.
    Check: $\mathbf{y} - \hat{\mathbf{y}} = ({z1:texfrac}, {z2:texfrac})$ has dot product 0 with $\mathbf{u}$.

- id: la-orth-coords
  title: Coordinates in an orthogonal basis
  topic: Orthogonal bases
  vars:
    aa: {min: 1, max: 3}
    bb: {min: -2, max: 2}
    cc: {choices: [1, -1, 2]}
    dd: {choices: [1, 2, -1, 3]}
    w1: {min: -3, max: 3}
    w2: {min: -3, max: 3}
    w3: {min: -2, max: 2}
  calc:
    u21: -bb*cc + 0
    u22: aa*cc + 0
    u23: dd + 0
    u31: bb*dd + 0
    u32: -aa*dd + 0
    u33: cc*(aa^2 + bb^2) + 0
    y1: w1*aa + w2*(-bb*cc) + w3*bb*dd + 0
    y2: w1*bb + w2*aa*cc + w3*(-aa*dd) + 0
    y3: w2*dd + w3*cc*(aa^2 + bb^2) + 0
    n1: aa^2 + bb^2 + 0
    n2: bb^2*cc^2 + aa^2*cc^2 + dd^2 + 0
    n3: bb^2*dd^2 + aa^2*dd^2 + cc^2*(aa^2 + bb^2)^2 + 0
    t1: w1*(aa^2 + bb^2) + 0
    t2: w2*(bb^2*cc^2 + aa^2*cc^2 + dd^2) + 0
    t3: w3*(bb^2*dd^2 + aa^2*dd^2 + cc^2*(aa^2 + bb^2)^2) + 0
  where: ["bb != 0", "w1 != 0 or w2 != 0", "abs(y1) + abs(y2) + abs(y3) <= 40"]
  prompt: |-
    $\mathbf{u}_1 = ({aa}, {bb}, 0)$, $\mathbf{u}_2 = ({u21}, {u22}, {u23})$, $\mathbf{u}_3 = ({u31}, {u32}, {u33})$ form an orthogonal basis of $\mathbb{R}^3$. Write $\mathbf{y} = ({y1}, {y2}, {y3})$ as $c_1\mathbf{u}_1 + c_2\mathbf{u}_2 + c_3\mathbf{u}_3$.
  answers:
    - {name: w1, label: '$c_1 =$'}
    - {name: w2, label: '$c_2 =$'}
    - {name: w3, label: '$c_3 =$'}
  solution: |-
    Use $c_j = \dfrac{\mathbf{y}\cdot\mathbf{u}_j}{\mathbf{u}_j\cdot\mathbf{u}_j}$ (no system to solve):
    $c_1 = \dfrac{{t1}}{{n1}} =$ **{w1}**, $c_2 = \dfrac{{t2}}{{n2}} =$ **{w2}**, $c_3 = \dfrac{{t3}}{{n3}} =$ **{w3}**.

- id: la-gs
  title: One step of Gram–Schmidt
  topic: Gram–Schmidt
  vars:
    x11: {min: -2, max: 2}
    x12: {min: -2, max: 2}
    x13: {min: -2, max: 2}
    x21: {min: -3, max: 3}
    x22: {min: -3, max: 3}
    x23: {min: -3, max: 3}
  calc:
    dd: x11*x21 + x12*x22 + x13*x23 + 0
    nn: x11^2 + x12^2 + x13^2 + 0
    v1: x21 - (x11*x21 + x12*x22 + x13*x23)/(x11^2 + x12^2 + x13^2)*x11 + 0
    v2: x22 - (x11*x21 + x12*x22 + x13*x23)/(x11^2 + x12^2 + x13^2)*x12 + 0
    v3: x23 - (x11*x21 + x12*x22 + x13*x23)/(x11^2 + x12^2 + x13^2)*x13 + 0
    cf: (x11*x21 + x12*x22 + x13*x23)/(x11^2 + x12^2 + x13^2) + 0
    cr: (x12*x23 - x13*x22)^2 + (x13*x21 - x11*x23)^2 + (x11*x22 - x12*x21)^2 + 0
  where: ["nn > 0", "cr > 0", "dd != 0"]
  prompt: |-
    Apply Gram–Schmidt to $\mathbf{x}_1 = ({x11}, {x12}, {x13})$ and $\mathbf{x}_2 = ({x21}, {x22}, {x23})$: $\mathbf{v}_1 = \mathbf{x}_1$. Find $\mathbf{v}_2$ (exact fractions).
  answers:
    - {name: v1, label: 'entry 1', kind: fraction, lowestTerms: true}
    - {name: v2, label: 'entry 2', kind: fraction, lowestTerms: true}
    - {name: v3, label: 'entry 3', kind: fraction, lowestTerms: true}
  solution: |-
    $\mathbf{x}_2\cdot\mathbf{v}_1 = {dd}$ and $\mathbf{v}_1\cdot\mathbf{v}_1 = {nn}$, so
    $\mathbf{v}_2 = \mathbf{x}_2 - \left({cf:texfrac}\right)\mathbf{v}_1 =$ **$\left({v1:texfrac},\ {v2:texfrac},\ {v3:texfrac}\right)$**. Check that $\mathbf{v}_2\cdot\mathbf{v}_1 = 0$.

- id: la-qr
  title: The R factor of a QR factorization
  topic: QR factorization
  vars:
    x11: {min: -2, max: 2}
    x12: {min: -2, max: 2}
    x13: {min: -2, max: 2}
    x21: {min: -3, max: 3}
    x22: {min: -3, max: 3}
    x23: {min: -3, max: 3}
  calc:
    nn: x11^2 + x12^2 + x13^2 + 0
    dd: x11*x21 + x12*x22 + x13*x23 + 0
    r11: sqrt(x11^2 + x12^2 + x13^2) + 0
    r12: (x11*x21 + x12*x22 + x13*x23)/sqrt(x11^2 + x12^2 + x13^2) + 0
    r22: sqrt(x21^2 + x22^2 + x23^2 - (x11*x21 + x12*x22 + x13*x23)^2/(x11^2 + x12^2 + x13^2)) + 0
    cr: (x12*x23 - x13*x22)^2 + (x13*x21 - x11*x23)^2 + (x11*x22 - x12*x21)^2 + 0
    m2: x21^2 + x22^2 + x23^2 + 0
  where: ["nn > 0", "cr > 0"]
  prompt: |-
    $A = QR$ where $A$ has columns $\mathbf{x}_1 = ({x11}, {x12}, {x13})$ and $\mathbf{x}_2 = ({x21}, {x22}, {x23})$. Find the entries $r_{11}$, $r_{12}$, $r_{22}$ of $R$ (2 decimals, or exact like sqrt(6)).
  answers:
    - {name: r11, label: '$r_{11} =$', tolerance: 0.01}
    - {name: r12, label: '$r_{12} =$', tolerance: 0.01}
    - {name: r22, label: '$r_{22} =$', tolerance: 0.01}
  solution: |-
    $r_{11} = \|\mathbf{x}_1\| = \sqrt{{nn}} \approx$ **{r11:num2}**. With $\mathbf{q}_1 = \mathbf{x}_1/\|\mathbf{x}_1\|$, $r_{12} = \mathbf{q}_1\cdot\mathbf{x}_2 = {dd}/\sqrt{{nn}} \approx$ **{r12:num2}**.
    $r_{22}$ is the length of $\mathbf{v}_2 = \mathbf{x}_2 - r_{12}\mathbf{q}_1$; by Pythagoras, $r_{22} = \sqrt{\|\mathbf{x}_2\|^2 - r_{12}^2} = \sqrt{{m2} - ({r12:num4})^2} \approx$ **{r22:num2}**.

- id: la-ls-line
  title: Least-squares line through four points
  topic: Linear regression
  vars:
    xs: {min: -1, max: 2}
    ya: {min: -3, max: 6}
    yb: {min: -3, max: 6}
    yc: {min: -3, max: 6}
    yd: {min: -3, max: 6}
  calc:
    xa: xs + 0
    xb: xs + 1 + 0
    xc: xs + 2 + 0
    xd: xs + 3 + 0
    sx: xa + xb + xc + xd + 0
    sy: ya + yb + yc + yd + 0
    sxx: xa^2 + xb^2 + xc^2 + xd^2 + 0
    sxy: xa*ya + xb*yb + xc*yc + xd*yd + 0
    b1: (4*(xa*ya + xb*yb + xc*yc + xd*yd) - (xa + xb + xc + xd)*(ya + yb + yc + yd))/(4*(xa^2 + xb^2 + xc^2 + xd^2) - (xa + xb + xc + xd)^2) + 0
    b0: ((ya + yb + yc + yd) - (4*(xa*ya + xb*yb + xc*yc + xd*yd) - (xa + xb + xc + xd)*(ya + yb + yc + yd))/(4*(xa^2 + xb^2 + xc^2 + xd^2) - (xa + xb + xc + xd)^2)*(xa + xb + xc + xd))/4 + 0
  prompt: |-
    Find the least-squares line $y = \beta_0 + \beta_1x$ for the points $({xa}, {ya})$, $({xb}, {yb})$, $({xc}, {yc})$, $({xd}, {yd})$. Give exact fractions.
  answers:
    - {name: b0, label: '$\beta_0 =$', kind: fraction, lowestTerms: true}
    - {name: b1, label: '$\beta_1 =$', kind: fraction, lowestTerms: true}
  figure:
    type: plot
    x: [-3, 7]
    y: [-5, 8]
    functions:
      - {f: 'b0 + b1*x', dashed: true}
    points:
      - {at: [xa, ya]}
      - {at: [xb, yb]}
      - {at: [xc, yc]}
      - {at: [xd, yd]}
  solution: |-
    $\sum x = {sx}$, $\sum x^2 = {sxx}$, $\sum y = {sy}$, $\sum xy = {sxy}$. The normal equations are
    $$\begin{aligned} 4\beta_0 + {sx}\beta_1 &= {sy} \\ {sx}\beta_0 + {sxx}\beta_1 &= {sxy} \end{aligned}$$
    Solving: $\beta_1 =$ **${b1:texfrac}$** and $\beta_0 =$ **${b0:texfrac}$**. (The dashed line in the figure is this fit.)

- id: la-normal-eq
  title: Least-squares solution from the normal equations
  topic: Least squares
  vars:
    a11: {min: -2, max: 2}
    a12: {min: -2, max: 2}
    a21: {min: -2, max: 2}
    a22: {min: -2, max: 2}
    a31: {min: -2, max: 2}
    a32: {min: -2, max: 2}
    b1: {min: -4, max: 4}
    b2: {min: -4, max: 4}
    b3: {min: -4, max: 4}
  calc:
    m11: a11^2 + a21^2 + a31^2 + 0
    m12: a11*a12 + a21*a22 + a31*a32 + 0
    m22: a12^2 + a22^2 + a32^2 + 0
    c1: a11*b1 + a21*b2 + a31*b3 + 0
    c2: a12*b1 + a22*b2 + a32*b3 + 0
    det: (a11^2 + a21^2 + a31^2)*(a12^2 + a22^2 + a32^2) - (a11*a12 + a21*a22 + a31*a32)^2 + 0
    x1: ((a12^2 + a22^2 + a32^2)*(a11*b1 + a21*b2 + a31*b3) - (a11*a12 + a21*a22 + a31*a32)*(a12*b1 + a22*b2 + a32*b3))/((a11^2 + a21^2 + a31^2)*(a12^2 + a22^2 + a32^2) - (a11*a12 + a21*a22 + a31*a32)^2) + 0
    x2: ((a11^2 + a21^2 + a31^2)*(a12*b1 + a22*b2 + a32*b3) - (a11*a12 + a21*a22 + a31*a32)*(a11*b1 + a21*b2 + a31*b3))/((a11^2 + a21^2 + a31^2)*(a12^2 + a22^2 + a32^2) - (a11*a12 + a21*a22 + a31*a32)^2) + 0
  where: ["det != 0", "det <= 60"]
  prompt: |-
    Find the least-squares solution of $A\mathbf{x} = \mathbf{b}$ for $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22} \\ {a31} & {a32}\end{bmatrix}$ and $\mathbf{b} = ({b1}, {b2}, {b3})$. Give exact fractions.
  answers:
    - {name: x1, label: '$\hat{x}_1 =$', kind: fraction, lowestTerms: true}
    - {name: x2, label: '$\hat{x}_2 =$', kind: fraction, lowestTerms: true}
  solution: |-
    $A^TA = \begin{bmatrix} {m11} & {m12} \\ {m12} & {m22}\end{bmatrix}$ and $A^T\mathbf{b} = ({c1}, {c2})$. Solve the normal equations $A^TA\hat{\mathbf{x}} = A^T\mathbf{b}$ ($\det A^TA = {det}$):
    **$\hat{\mathbf{x}} = \left({x1:texfrac},\ {x2:texfrac}\right)$**.

- id: la-sym-eig
  title: Eigenvalues of a symmetric 2×2 matrix
  topic: Symmetric matrices
  vars:
    aa: {min: -5, max: 5}
    bb: {min: -4, max: 4}
    cc: {min: -5, max: 5}
  where: ["bb != 0"]
  calc:
    trv: aa + cc + 0
    dt: aa*cc - bb^2 + 0
    disc: (aa - cc)^2 + 4*bb^2 + 0
    lmax: (aa + cc + sqrt((aa - cc)^2 + 4*bb^2))/2 + 0
    lmin: (aa + cc - sqrt((aa - cc)^2 + 4*bb^2))/2 + 0
  prompt: |-
    Find the eigenvalues of the symmetric matrix $A = \begin{bmatrix} {aa} & {bb} \\ {bb} & {cc}\end{bmatrix}$ (exact or 2 decimals).
  answers:
    - {name: lmax, label: 'larger', tolerance: 0.01}
    - {name: lmin, label: 'smaller', tolerance: 0.01}
  solution: |-
    The characteristic equation is $\lambda^2 - (\operatorname{tr} A)\lambda + \det A = 0$ with $\operatorname{tr} A = {trv}$ and $\det A = {dt}$, so $\lambda = \dfrac{{trv} \pm \sqrt{{disc}}}{2}$. The discriminant $(a - c)^2 + 4b^2 = {disc}$ is positive, as it must be for a symmetric matrix (real eigenvalues).
    **Answer:** $\lambda \approx$ **{lmax:num2}** and **{lmin:num2}**.

- id: la-sym-unit
  title: Orthonormal eigenvector of a symmetric matrix
  topic: Symmetric matrices
  vars:
    dir:
      choices:
        - {label: 'a', value: 0}
        - {label: 'b', value: 1}
        - {label: 'c', value: 2}
        - {label: 'd', value: 3}
        - {label: 'e', value: 4}
        - {label: 'f', value: 5}
    l2: {min: -4, max: 4}
    mm: {choices: [1, 2, -1]}
  calc:
    pp: if(dir == 0, 1, if(dir == 1, 1, if(dir == 2, 1, if(dir == 3, 2, if(dir == 4, 1, 2))))) + 0
    qq: if(dir == 0, 1, if(dir == 1, -1, if(dir == 2, 2, if(dir == 3, 1, if(dir == 4, -2, -1))))) + 0
    a11: l2 + mm*pp^2 + 0
    a12: mm*pp*qq + 0
    a22: l2 + mm*qq^2 + 0
    d2: pp^2 + qq^2 + 0
    l1: l2 + mm*(pp^2 + qq^2) + 0
    e1: pp/sqrt(pp^2 + qq^2) + 0
    e2: qq/sqrt(pp^2 + qq^2) + 0
  prompt: |-
    $A = \begin{bmatrix} {a11} & {a12} \\ {a12} & {a22}\end{bmatrix}$ has eigenvalues {l1} and {l2}. Find a unit eigenvector $(u_1, u_2)$ for $\lambda = {l1}$ with $u_1 > 0$ (exact like 1/sqrt(5), or 3 decimals).
  answers:
    - {name: e1, label: '$u_1 =$', tolerance: 0.001, format: dp3}
    - {name: e2, label: '$u_2 =$', tolerance: 0.001, format: dp3}
  solution: |-
    Row-reduce $A - ({l1})I$: its null space is spanned by $({pp}, {qq})$. (The other eigenvector, for {l2}, is the perpendicular direction $({qq}, -{pp})$ up to sign.) Normalize: $\|({pp}, {qq})\| = \sqrt{{d2}}$, so
    $\mathbf{u} = \dfrac{1}{\sqrt{{d2}}}({pp}, {qq}) \approx$ **({e1:dp3}, {e2:dp3})**.

- id: la-qf-matrix
  title: Matrix of a quadratic form
  topic: Quadratic forms
  vars:
    ca: {min: -5, max: 5}
    cb: {min: -5, max: 5}
    cc: {min: -5, max: 5}
    cd: {min: -7, max: 7}
    ce: {min: -7, max: 7}
    cf: {min: -7, max: 7}
  where: ["ca != 0", "cb != 0", "cc != 0", "cd != 0", "ce != 0", "cf != 0"]
  calc:
    h12: cd/2 + 0
    h13: ce/2 + 0
    h23: cf/2 + 0
  prompt: |-
    Find the symmetric matrix $A$ with $\mathbf{x}^TA\mathbf{x} = {ca:coef}x_1^2 {cb:signedcoef}x_2^2 {cc:signedcoef}x_3^2 {cd:signedcoef}x_1x_2 {ce:signedcoef}x_1x_3 {cf:signedcoef}x_2x_3$. Give $a_{11}$, $a_{12}$, $a_{13}$, $a_{23}$ (fractions allowed).
  answers:
    - {name: ca, label: '$a_{11} =$', kind: fraction}
    - {name: h12, label: '$a_{12} =$', kind: fraction, lowestTerms: true}
    - {name: h13, label: '$a_{13} =$', kind: fraction, lowestTerms: true}
    - {name: h23, label: '$a_{23} =$', kind: fraction, lowestTerms: true}
  solution: |-
    Squared terms go on the diagonal; each cross coefficient is split in half between the two symmetric positions:
    $$A = \begin{bmatrix} {ca} & {h12:texfrac} & {h13:texfrac} \\ {h12:texfrac} & {cb} & {h23:texfrac} \\ {h13:texfrac} & {h23:texfrac} & {cc}\end{bmatrix}.$$
    **Answer:** $a_{11} = {ca}$, $a_{12} = {h12:texfrac}$, $a_{13} = {h13:texfrac}$, $a_{23} = {h23:texfrac}$.

- id: la-qf-eval
  title: Evaluate a quadratic form
  topic: Quadratic forms
  vars:
    a11: {min: -3, max: 4}
    a12: {min: -3, max: 3}
    a13: {min: -3, max: 3}
    a22: {min: -3, max: 4}
    a23: {min: -3, max: 3}
    a33: {min: -3, max: 4}
    x1: {min: -2, max: 2}
    x2: {min: -2, max: 2}
    x3: {min: -2, max: 2}
  where: ["x1 != 0 or x2 != 0 or x3 != 0"]
  calc:
    y1: a11*x1 + a12*x2 + a13*x3 + 0
    y2: a12*x1 + a22*x2 + a23*x3 + 0
    y3: a13*x1 + a23*x2 + a33*x3 + 0
    qv: x1*(a11*x1 + a12*x2 + a13*x3) + x2*(a12*x1 + a22*x2 + a23*x3) + x3*(a13*x1 + a23*x2 + a33*x3) + 0
  prompt: |-
    Evaluate $Q(\mathbf{x}) = \mathbf{x}^TA\mathbf{x}$ for $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a12} & {a22} & {a23} \\ {a13} & {a23} & {a33}\end{bmatrix}$ and $\mathbf{x} = ({x1}, {x2}, {x3})$.
  answers:
    - {name: qv, label: '$Q(\mathbf{x}) =$'}
  solution: |-
    First $A\mathbf{x} = ({y1}, {y2}, {y3})$. Then $\mathbf{x}^T(A\mathbf{x}) = ({x1})({y1}) + ({x2})({y2}) + ({x3})({y3}) =$ **{qv}**.

- id: la-pd-minors
  title: Leading principal minors with a parameter
  topic: Positive definite matrices
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    c: {min: -3, max: 3}
    d: {min: 1, max: 6}
    e: {min: -3, max: 3}
  where: ["a*d - b^2 > 0", "c != 0", "e != 0", "R0 != 0"]
  calc:
    D2: a*d - b^2 + 0
    m31: b*e - c*d + 0
    m32: b*c - a*e + 0
    R0: c*(b*e - c*d) + e*(b*c - a*e) + 0
    k0: -(c*(b*e - c*d) + e*(b*c - a*e))/(a*d - b^2) + 0
  prompt: |-
    For which $k$ is $A = \begin{bmatrix} {a} & {b} & {c} \\ {b} & {d} & {e} \\ {c} & {e} & k\end{bmatrix}$ positive definite? Find the leading minor $D_2$ and the number $k_0$ such that $A$ is positive definite exactly when $k > k_0$ (exact fraction).
  answers:
    - {name: D2, label: '$D_2 =$'}
    - {name: k0, label: '$k_0 =$', kind: fraction, lowestTerms: true}
  solution: |-
    $D_1 = {a} > 0$ and $D_2 = ({a})({d}) - ({b})^2 = {D2} > 0$, whatever $k$ is.
    Expand $D_3 = \det A$ along row 3: the cofactors are $C_{31} = ({b})({e}) - ({c})({d}) = {m31}$, $C_{32} = -\big(({a})({e}) - ({c})({b})\big) = {m32}$ and $C_{33} = D_2 = {D2}$, so $D_3 = ({c})({m31}) + ({e})({m32}) + {D2}k = {D2:coef}k {R0:signed}$.
    $D_3 > 0$ exactly when $k > k_0 =$ **${k0:texfrac}$**.

- id: la-pd-pivots
  title: Test positive definiteness by pivots
  topic: Positive definite matrices
  vars:
    a: {min: 1, max: 4}
    b: {min: -3, max: 3}
    c: {min: -3, max: 3}
    d: {min: 1, max: 8}
    e: {min: -3, max: 3}
    f: {min: 1, max: 8}
  where: ["a*d - b*b != 0", "b != 0", "c != 0", "dt3 != 0"]
  calc:
    u22: d - b*b/a + 0
    u23: e - b*c/a + 0
    u33: f - c*c/a + 0
    p1: a + 0
    p2: d - b*b/a + 0
    dt3: a*(d*f - e*e) - b*(b*f - e*c) + c*(b*e - d*c) + 0
    p3: (a*(d*f - e*e) - b*(b*f - e*c) + c*(b*e - d*c))/(a*d - b*b) + 0
    ml: (e - b*c/a)/(d - b*b/a) + 0
    mb: b/a + 0
    mc: c/a + 0
    pdf: if(a*d - b*b > 0 and a*(d*f - e*e) - b*(b*f - e*c) + c*(b*e - d*c) > 0, 1, 0)
  prompt: |-
    Use elimination without row swaps to find the pivots of $A = \begin{bmatrix} {a} & {b} & {c} \\ {b} & {d} & {e} \\ {c} & {e} & {f}\end{bmatrix}$ (exact fractions). Then enter 1 if $A$ is positive definite and 0 if it is not.
  answers:
    - {name: p1, label: '$p_1 =$', kind: fraction, lowestTerms: true}
    - {name: p2, label: '$p_2 =$', kind: fraction, lowestTerms: true}
    - {name: p3, label: '$p_3 =$', kind: fraction, lowestTerms: true}
    - {name: pdf, label: 'positive definite? (1 = yes, 0 = no)'}
  solution: |-
    Clear column 1 with the multipliers ${mb:texfrac}$ (row 2) and ${mc:texfrac}$ (row 3): the lower-right block becomes $\begin{bmatrix} {u22:texfrac} & {u23:texfrac} \\ {u23:texfrac} & {u33:texfrac}\end{bmatrix}$ (still symmetric).
    Clear below its first entry with the multiplier ${ml:texfrac}$: the last pivot is ${u33:texfrac} - ({ml:texfrac})({u23:texfrac}) = {p3:texfrac}$.
    Pivots: **${p1}$, ${p2:texfrac}$, ${p3:texfrac}$**. $A$ is positive definite exactly when all three are positive, so the answer is **{pdf}**. (Check: $p_1p_2p_3 = \det A$.)

- id: la-cholesky
  title: Cholesky factorization of a 3×3 matrix
  topic: Cholesky factorization
  vars:
    r11: {min: 1, max: 3}
    r22: {min: 1, max: 3}
    r33: {min: 1, max: 3}
    r12: {min: -3, max: 3}
    r13: {min: -3, max: 3}
    r23: {min: -3, max: 3}
  where: ["r12 != 0 or r13 != 0", "r23 != 0"]
  calc:
    a11: r11^2 + 0
    a12: r11*r12 + 0
    a13: r11*r13 + 0
    a22: r12^2 + r22^2 + 0
    a23: r12*r13 + r22*r23 + 0
    a33: r13^2 + r23^2 + r33^2 + 0
    s22: r22^2 + 0
    t23: r22*r23 + 0
    s33: r33^2 + 0
  prompt: |-
    Find the Cholesky factor of $A = \begin{bmatrix} {a11} & {a12} & {a13} \\ {a12} & {a22} & {a23} \\ {a13} & {a23} & {a33}\end{bmatrix}$: the upper triangular $R$ with positive diagonal and $A = R^TR$.
  answers:
    - {name: r11, label: '$r_{11} =$'}
    - {name: r12, label: '$r_{12} =$'}
    - {name: r13, label: '$r_{13} =$'}
    - {name: r22, label: '$r_{22} =$'}
    - {name: r23, label: '$r_{23} =$'}
    - {name: r33, label: '$r_{33} =$'}
  solution: |-
    Row 1: $r_{11} = \sqrt{{a11}} = {r11}$, $r_{12} = {a12}/{r11} = {r12}$, $r_{13} = {a13}/{r11} = {r13}$.
    Row 2: $r_{22} = \sqrt{{a22} - ({r12})^2} = \sqrt{{s22}} = {r22}$, $r_{23} = \big({a23} - ({r12})({r13})\big)/{r22} = {t23}/{r22} = {r23}$.
    Row 3: $r_{33} = \sqrt{{a33} - ({r13})^2 - ({r23})^2} = \sqrt{{s33}} = {r33}$.
    $R =$ **$\begin{bmatrix} {r11} & {r12} & {r13} \\ 0 & {r22} & {r23} \\ 0 & 0 & {r33}\end{bmatrix}$**. Every square root was of a positive number, which confirms that $A$ is positive definite.

- id: la-singular
  title: Singular values of a 2×2 matrix
  topic: Singular value decomposition
  vars:
    a11: {min: -4, max: 4}
    a12: {min: -4, max: 4}
    a21: {min: -4, max: 4}
    a22: {min: -4, max: 4}
  calc:
    m11: a11^2 + a21^2 + 0
    m12: a11*a12 + a21*a22 + 0
    m22: a12^2 + a22^2 + 0
    tr: a11^2 + a21^2 + a12^2 + a22^2 + 0
    dt: (a11*a22 - a12*a21)^2 + 0
    dsc: (a11^2 + a21^2 + a12^2 + a22^2)^2 - 4*(a11*a22 - a12*a21)^2 + 0
    s1: sqrt((a11^2 + a21^2 + a12^2 + a22^2 + sqrt((a11^2 + a21^2 + a12^2 + a22^2)^2 - 4*(a11*a22 - a12*a21)^2))/2) + 0
    s2: sqrt(abs((a11^2 + a21^2 + a12^2 + a22^2 - sqrt((a11^2 + a21^2 + a12^2 + a22^2)^2 - 4*(a11*a22 - a12*a21)^2))/2)) + 0
  where: ["tr > 0"]
  prompt: |-
    Find the singular values of $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22}\end{bmatrix}$ (2 decimals), largest first.
  answers:
    - {name: s1, label: '$\sigma_1 =$', tolerance: 0.01}
    - {name: s2, label: '$\sigma_2 =$', tolerance: 0.01}
  solution: |-
    $A^TA = \begin{bmatrix} {m11} & {m12} \\ {m12} & {m22}\end{bmatrix}$ has trace {tr} and determinant $(\det A)^2 = {dt}$. Its eigenvalues are $\lambda = \dfrac{{tr} \pm \sqrt{{dsc}}}{2}$ (the roots of $\lambda^2 - (\operatorname{trace})\lambda + \det = 0$), and the singular values are their square roots:
    $\sigma_1 \approx$ **{s1:num2}**, $\sigma_2 \approx$ **{s2:num2}**. (Check: $\sigma_1\sigma_2 = |\det A|$.)

- id: la-ata
  title: Compute A-transpose-A
  topic: Singular value decomposition
  vars:
    a11: {min: -3, max: 3}
    a12: {min: -3, max: 3}
    a21: {min: -3, max: 3}
    a22: {min: -3, max: 3}
    a31: {min: -3, max: 3}
    a32: {min: -3, max: 3}
  calc:
    m11: a11^2 + a21^2 + a31^2 + 0
    m12: a11*a12 + a21*a22 + a31*a32 + 0
    m22: a12^2 + a22^2 + a32^2 + 0
  where: ["m11 > 0", "m22 > 0"]
  prompt: |-
    For $A = \begin{bmatrix} {a11} & {a12} \\ {a21} & {a22} \\ {a31} & {a32}\end{bmatrix}$, compute $A^TA$ (it is symmetric, so give the three distinct entries).
  answers:
    - {name: m11, label: 'row 1, col 1'}
    - {name: m12, label: 'row 1, col 2 (= row 2, col 1)'}
    - {name: m22, label: 'row 2, col 2'}
  solution: |-
    Entry $(i, j)$ of $A^TA$ is (column $i$ of $A$) $\cdot$ (column $j$ of $A$):
    $({a11})^2 + ({a21})^2 + ({a31})^2 =$ **{m11}**, $({a11})({a12}) + ({a21})({a22}) + ({a31})({a32}) =$ **{m12}**, $({a12})^2 + ({a22})^2 + ({a32})^2 =$ **{m22}**.
    Its eigenvalues are the squares of the singular values of $A$.
