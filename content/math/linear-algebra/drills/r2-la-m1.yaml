# Round 2 drills for la-m1 honors lessons (03h1 vector geometry, 03h2 sensitive systems)

- id: la-m1-r2-section
  title: Point dividing a segment in a given ratio
  topic: Points and lines with vectors
  vars:
    p1: {min: -8, max: 8}
    p2: {min: -8, max: 8}
    q1: {min: -8, max: 8}
    q2: {min: -8, max: 8}
    rm: {min: 1, max: 4}
    rn: {min: 1, max: 4}
  where: ["gcd(rm, rn) == 1", "rm != rn", "p1 != q1", "p2 != q2"]
  calc:
    s: rm + rn + 0
    d1: q1 - p1 + 0
    d2: q2 - p2 + 0
    np1: rn*p1 + 0
    np2: rn*p2 + 0
    mq1: rm*q1 + 0
    mq2: rm*q2 + 0
    t1: rn*p1 + rm*q1 + 0
    t2: rn*p2 + rm*q2 + 0
    r1: (rn*p1 + rm*q1)/(rm + rn) + 0
    r2: (rn*p2 + rm*q2)/(rm + rn) + 0
  prompt: |-
    $P = ({p1}, {p2})$ and $Q = ({q1}, {q2})$. Find the point $R$ on segment $PQ$ with $PR : RQ = {rm} : {rn}$. Give each coordinate as a whole number or a fraction (like 7/3), not a decimal.
  answers:
    - {name: r1, label: '$x$-coordinate', kind: fraction}
    - {name: r2, label: '$y$-coordinate', kind: fraction}
  figure:
    type: plot
    equal: true
    x: ['min(p1, q1) - 1', 'max(p1, q1) + 1']
    y: ['min(p2, q2) - 1', 'max(p2, q2) + 1']
    points:
      - {at: [p1, p2], label: P}
      - {at: [q1, q2], label: Q}
    segments:
      - {from: [p1, p2], to: [q1, q2]}
  solution: |-
    $R$ is $\frac{{rm}}{{s}}$ of the way from $P$ to $Q$, and $\overrightarrow{PQ} = ({d1}, {d2})$. By the section formula, the weight on $P$ is the part of the ratio next to $Q$:
    $$\mathbf{r} = \frac{{rn}\,\mathbf{p} + {rm}\,\mathbf{q}}{{s}} = \left(\frac{{np1} + ({mq1})}{{s}},\ \frac{{np2} + ({mq2})}{{s}}\right) = \left(\frac{{t1}}{{s}},\ \frac{{t2}}{{s}}\right).$$
    So $R =$ **$\left({r1:texfrac},\ {r2:texfrac}\right)$**.

- id: la-m1-r2-centroid
  title: Centroid of a triangle
  topic: Vector proofs
  vars:
    a1: {min: -7, max: 7}
    a2: {min: -7, max: 7}
    b1: {min: -7, max: 7}
    b2: {min: -7, max: 7}
    c1: {min: -7, max: 7}
    c2: {min: -7, max: 7}
  where: ["(b1 - a1)*(c2 - a2) - (b2 - a2)*(c1 - a1) != 0"]
  calc:
    s1: a1 + b1 + c1 + 0
    s2: a2 + b2 + c2 + 0
    g1: (a1 + b1 + c1)/3 + 0
    g2: (a2 + b2 + c2)/3 + 0
  prompt: |-
    Find the centroid $G$ of the triangle with vertices $A = ({a1}, {a2})$, $B = ({b1}, {b2})$ and $C = ({c1}, {c2})$. Give each coordinate as a whole number or a fraction (like 7/3), not a decimal.
  answers:
    - {name: g1, label: '$x$-coordinate', kind: fraction}
    - {name: g2, label: '$y$-coordinate', kind: fraction}
  figure:
    type: plot
    equal: true
    x: [-8, 8]
    y: [-8, 8]
    polygons:
      - {points: [[a1, a2], [b1, b2], [c1, c2]]}
    points:
      - {at: [a1, a2], label: A}
      - {at: [b1, b2], label: B}
      - {at: [c1, c2], label: C}
  solution: |-
    The centroid is the average of the vertices, $\mathbf{g} = \frac{\mathbf{a} + \mathbf{b} + \mathbf{c}}{3}$. Add the coordinates: $x$: ${a1} + ({b1}) + ({c1}) = {s1}$ and $y$: ${a2} + ({b2}) + ({c2}) = {s2}$. Divide by 3: $G =$ **$\left({g1:texfrac},\ {g2:texfrac}\right)$**.

- id: la-m1-r2-parallelogram
  title: Fourth vertex and center of a parallelogram
  topic: Vector proofs
  vars:
    a1: {min: -6, max: 6}
    a2: {min: -6, max: 6}
    b1: {min: -6, max: 6}
    b2: {min: -6, max: 6}
    c1: {min: -6, max: 6}
    c2: {min: -6, max: 6}
  where: ["(b1 - a1)*(c2 - a2) - (b2 - a2)*(c1 - a1) != 0", "abs(a1 + c1 - b1) <= 9", "abs(a2 + c2 - b2) <= 9"]
  calc:
    dd1: a1 + c1 - b1 + 0
    dd2: a2 + c2 - b2 + 0
    m1: (a1 + c1)/2 + 0
    m2: (a2 + c2)/2 + 0
  prompt: |-
    $ABCD$ is a parallelogram with its vertices in that order, and $A = ({a1}, {a2})$, $B = ({b1}, {b2})$, $C = ({c1}, {c2})$. Find $D$ and the point $M$ where the diagonals cross. Give fractions (like 3/2), not decimals, where needed.
  answers:
    - {name: dd1, label: '$D$: $x$-coordinate', kind: fraction}
    - {name: dd2, label: '$D$: $y$-coordinate', kind: fraction}
    - {name: m1, label: '$M$: $x$-coordinate', kind: fraction}
    - {name: m2, label: '$M$: $y$-coordinate', kind: fraction}
  figure:
    type: plot
    equal: true
    x: [-10, 10]
    y: [-10, 10]
    points:
      - {at: [a1, a2], label: A}
      - {at: [b1, b2], label: B}
      - {at: [c1, c2], label: C}
    segments:
      - {from: [a1, a2], to: [b1, b2]}
      - {from: [b1, b2], to: [c1, c2]}
  solution: |-
    In a parallelogram $\overrightarrow{AB} = \overrightarrow{DC}$, so $\mathbf{b} - \mathbf{a} = \mathbf{c} - \mathbf{d}$ and $\mathbf{d} = \mathbf{a} + \mathbf{c} - \mathbf{b} = ({a1} + ({c1}) - ({b1}),\ {a2} + ({c2}) - ({b2})) = ({dd1}, {dd2})$. The diagonals bisect each other, so they cross at the midpoint of $AC$: $\frac{\mathbf{a} + \mathbf{c}}{2} = \left({m1:texfrac},\ {m2:texfrac}\right)$. **Answer:** $D = ({dd1}, {dd2})$, $M = \left({m1:texfrac},\ {m2:texfrac}\right)$.

- id: la-m1-r2-leontief-solve
  title: Production in a two-sector Leontief model
  topic: The Leontief inverse
  vars:
    k11: {min: 1, max: 4}
    k12: {min: 1, max: 4}
    k21: {min: 1, max: 4}
    k22: {min: 1, max: 4}
    x1: {min: 50, max: 300, step: 10}
    x2: {min: 50, max: 300, step: 10}
  calc:
    c11: k11/10
    c12: k12/10
    c21: k21/10
    c22: k22/10
    d1: round(x1 - (k11*x1 + k12*x2)/10, 4)
    d2: round(x2 - (k21*x1 + k22*x2)/10, 4)
    m11: round(1 - k11/10, 4)
    m22: round(1 - k22/10, 4)
    det: round((1 - k11/10)*(1 - k22/10) - k12*k21/100, 4)
    n1: round((1 - k22/10)*(x1 - (k11*x1 + k12*x2)/10) + (k12/10)*(x2 - (k21*x1 + k22*x2)/10), 4)
    n2: round((k21/10)*(x1 - (k11*x1 + k12*x2)/10) + (1 - k11/10)*(x2 - (k21*x1 + k22*x2)/10), 4)
  where: ["x1 - (k11*x1 + k12*x2)/10 > 0", "x2 - (k21*x1 + k22*x2)/10 > 0"]
  prompt: |-
    An economy has consumption matrix $C = \begin{bmatrix} {c11} & {c12} \\ {c21} & {c22}\end{bmatrix}$ (one column per producing sector) and final demand $\mathbf{d} = ({d1:num4}, {d2:num4})$. Find the production $\mathbf{x}$ that meets it.
  answers:
    - {name: x1, label: '$x_1 =$', tolerance: 0.01}
    - {name: x2, label: '$x_2 =$', tolerance: 0.01}
  solution: |-
    Solve $(I - C)\mathbf{x} = \mathbf{d}$ with $I - C = \begin{bmatrix} {m11} & -{c12} \\ -{c21} & {m22}\end{bmatrix}$. Its determinant is $({m11})({m22}) - ({c12})({c21}) = {det}$, so
    $$\mathbf{x} = \frac{1}{{det}}\begin{bmatrix} {m22} & {c12} \\ {c21} & {m11}\end{bmatrix}\begin{bmatrix} {d1:num4} \\ {d2:num4}\end{bmatrix} = \frac{1}{{det}}\begin{bmatrix} {n1:num4} \\ {n2:num4}\end{bmatrix}.$$
    So $x_1 =$ **{x1}** and $x_2 =$ **{x2}**. Check: $\mathbf{x} - C\mathbf{x} = \mathbf{d}$.

- id: la-m1-r2-leontief-change
  title: Effect of a change in final demand
  topic: The Leontief inverse
  vars:
    k11: {min: 1, max: 4}
    k12: {min: 1, max: 4}
    k21: {min: 1, max: 4}
    k22: {min: 1, max: 4}
    sec: {choices: [1, 2]}
    amt: {min: 5, max: 30, step: 5}
  calc:
    c11: k11/10
    c12: k12/10
    c21: k21/10
    c22: k22/10
    m11: round(1 - k11/10, 4)
    m22: round(1 - k22/10, 4)
    det: round((1 - k11/10)*(1 - k22/10) - k12*k21/100, 4)
    top: if(sec == 1, round(1 - k22/10, 4), k12/10)
    bot: if(sec == 1, k21/10, round(1 - k11/10, 4))
    dx1: amt*if(sec == 1, 1 - k22/10, k12/10)/((1 - k11/10)*(1 - k22/10) - k12*k21/100)
    dx2: amt*if(sec == 1, k21/10, 1 - k11/10)/((1 - k11/10)*(1 - k22/10) - k12*k21/100)
  prompt: |-
    An economy has consumption matrix $C = \begin{bmatrix} {c11} & {c12} \\ {c21} & {c22}\end{bmatrix}$ (one column per producing sector). Final demand for sector {sec} rises by {amt} units and nothing else changes. By how much must each sector's production rise? Give exact values (fractions are fine) or round to 2 decimal places.
  answers:
    - {name: dx1, label: 'Sector 1:', tolerance: 0.006}
    - {name: dx2, label: 'Sector 2:', tolerance: 0.006}
  solution: |-
    The change is $\Delta\mathbf{x} = (I - C)^{-1}\Delta\mathbf{d}$, and $\Delta\mathbf{d}$ is {amt} times $\mathbf{e}_{sec}$, so $\Delta\mathbf{x}$ is {amt} times column {sec} of the Leontief inverse. With $\det(I - C) = ({m11})({m22}) - ({c12})({c21}) = {det}$,
    $$(I - C)^{-1} = \frac{1}{{det}}\begin{bmatrix} {m22} & {c12} \\ {c21} & {m11}\end{bmatrix},$$
    and column {sec} is $\frac{1}{{det}}({top}, {bot})$. Multiply by {amt}: **$\Delta x_1 \approx {dx1:num2}$, $\Delta x_2 \approx {dx2:num2}$**.
