# Round 2 notecards for module la-m8 (honors lessons 32h1-32h3)

# Cayley–Hamilton theorem and minimal polynomial
- {front: Cayley–Hamilton theorem, back: 'If $p(\lambda) = \det(A - \lambda I)$, then $p(A) = 0$: every square matrix satisfies its own characteristic equation.', topic: Cayley–Hamilton theorem}
- {front: 'Cayley–Hamilton for a $2 \times 2$ matrix', back: '$A^2 - (\operatorname{tr} A)A + (\det A)I = 0$', topic: Cayley–Hamilton theorem}
- {front: 'Matrix polynomial $q(A)$ acting on an eigenvector', back: 'If $A\mathbf{v} = \lambda\mathbf{v}$, then $q(A)\mathbf{v} = q(\lambda)\mathbf{v}$.', topic: Cayley–Hamilton theorem}
- {front: 'Inverse of a $2 \times 2$ matrix from Cayley–Hamilton', back: '$A^{-1} = \dfrac{1}{\det A}\big((\operatorname{tr} A)I - A\big)$, when $\det A \ne 0$.', topic: Cayley–Hamilton theorem}
- {front: 'Why every power of an $n \times n$ matrix is a combination of $I, A, \dots, A^{n-1}$', back: 'Cayley–Hamilton expresses $A^n$ through lower powers; repeat to lower any higher power.', topic: Cayley–Hamilton theorem}
- {front: 'Computing $A^k$ by remainders', back: '$A^k = r(A)$, where $r$ has degree less than $n$ and $r(\lambda_i) = \lambda_i^k$ at each eigenvalue (for distinct eigenvalues).', topic: Cayley–Hamilton theorem}
- {front: 'Why "$\det(A - AI) = 0$" does not prove Cayley–Hamilton', back: 'It produces the number 0; the theorem says the matrix $p(A) = c_0I + c_1A + \cdots$ is the zero matrix.', topic: Cayley–Hamilton theorem}
- {front: History of the Cayley–Hamilton theorem, back: 'Hamilton proved a quaternion case (1853); Cayley stated it and checked $2 \times 2$ (1858); Frobenius gave the first general proof (1878).', topic: Cayley–Hamilton theorem}
- {front: Minimal polynomial, back: 'The monic polynomial $m$ of least degree with $m(A) = 0$. It divides every annihilating polynomial, including the characteristic polynomial.', topic: Minimal polynomial}
- {front: Roots of the minimal polynomial, back: 'Exactly the eigenvalues of $A$ (only the multiplicities can be smaller than in the characteristic polynomial).', topic: Minimal polynomial}
- {front: Diagonalizability test with the minimal polynomial, back: 'A real matrix is diagonalizable ⟺ $m(t) = (t - \lambda_1)\cdots(t - \lambda_s)$ with distinct real $\lambda_i$, i.e. $(A - \lambda_1I)\cdots(A - \lambda_sI) = 0$.', topic: Minimal polynomial}

# Jordan form
- {front: Defective matrix, back: 'A matrix without an eigenvector basis: some eigenvalue has geometric multiplicity less than its algebraic multiplicity.', topic: Jordan form}
- {front: Jordan chain, back: '$(A - \lambda I)\mathbf{v}_1 = \mathbf{0}$, $(A - \lambda I)\mathbf{v}_2 = \mathbf{v}_1$, …; equivalently $A\mathbf{v}_{j+1} = \lambda\mathbf{v}_{j+1} + \mathbf{v}_j$.', topic: Jordan form}
- {front: Jordan block, back: '$\lambda$ on the diagonal, 1s just above it, zeros elsewhere: $J = \lambda I + N$ with $N$ nilpotent.', topic: Jordan form}
- {front: Jordan form theorem, back: 'If all eigenvalues of $A$ are real, $A = PJP^{-1}$ with $J$ block diagonal made of Jordan blocks, unique up to block order (always possible over the complex numbers).', topic: Jordan form}
- {front: 'Number of Jordan blocks for $\lambda$', back: 'The geometric multiplicity $\dim\operatorname{Nul}(A - \lambda I)$; the block sizes add up to the algebraic multiplicity.', topic: Jordan form}
- {front: 'Block sizes from ranks', back: 'Number of blocks for $\lambda$ of size at least $j$ = $\operatorname{rank}(A - \lambda I)^{j-1} - \operatorname{rank}(A - \lambda I)^{j}$.', topic: Jordan form}
- {front: 'Powers of a $2 \times 2$ Jordan block', back: '$\begin{bmatrix} \lambda & 1 \\ 0 & \lambda\end{bmatrix}^k = \begin{bmatrix} \lambda^k & k\lambda^{k-1} \\ 0 & \lambda^k\end{bmatrix}$', topic: Jordan form}
- {front: 'Exponential of a $2 \times 2$ Jordan block', back: '$e^{Jt} = e^{\lambda t}\begin{bmatrix} 1 & t \\ 0 & 1\end{bmatrix}$', topic: Jordan form}
- {front: 'Solutions of $\mathbf{x}'' = A\mathbf{x}$ from a Jordan chain $\mathbf{v}_1, \mathbf{v}_2$', back: '$\mathbf{x}(t) = c_1e^{\lambda t}\mathbf{v}_1 + c_2e^{\lambda t}(t\mathbf{v}_1 + \mathbf{v}_2)$', topic: Jordan form}
- {front: Largest Jordan block and the minimal polynomial, back: 'The size of the largest block for $\lambda$ is the power of $(t - \lambda)$ in the minimal polynomial.', topic: Jordan form}
- {front: Why software avoids the Jordan form, back: 'It changes abruptly under tiny perturbations: $\begin{bmatrix} 2 & 1 \\ \varepsilon & 2\end{bmatrix}$ is diagonalizable for every $\varepsilon > 0$ but a single Jordan block at $\varepsilon = 0$.', topic: Jordan form}

# Leslie models and Perron–Frobenius
- {front: Leslie matrix, back: 'Fecundities $f_i$ across the first row, survival rates $s_i$ just below the diagonal (row $i + 1$, column $i$), zeros elsewhere; $\mathbf{x}_{k+1} = L\mathbf{x}_k$.', topic: Leslie models}
- {front: 'Growth rate of a Leslie model', back: 'The dominant eigenvalue $r$: in the long run the population is multiplied by about $r$ each step.', topic: Leslie models}
- {front: Stable age distribution, back: 'The positive eigenvector for $r$, $(1, s_1/r, s_1s_2/r^2, \dots)$, scaled so its entries add up to 1.', topic: Leslie models}
- {front: Net reproductive number $R_0$, back: '$R_0 = \sum f_i\ell_i$ with $\ell_1 = 1$, $\ell_{i+1} = \ell_is_i$; the population grows ⟺ $R_0 > 1$ (when the last class reproduces).', topic: Leslie models}
- {front: Primitive matrix, back: 'A nonnegative square matrix some power of which has all entries positive.', topic: Perron–Frobenius theorem}
- {front: Perron–Frobenius theorem (primitive matrices), back: 'A primitive matrix has a positive eigenvalue $r$, simple and strictly larger in absolute value than all others, with a positive eigenvector; no other eigenvalue has a nonnegative eigenvector.', topic: Perron–Frobenius theorem}
- {front: Bounds on the Perron root, back: 'For a nonnegative matrix, $\rho(A)$ lies between the smallest and largest row sums, and between the smallest and largest column sums.', topic: Perron–Frobenius theorem}
- {front: 'Speed of convergence to the stable distribution', back: 'The leftover part shrinks by about $|\lambda_2|/r$ per step, where $\lambda_2$ is the next-largest eigenvalue in absolute value.', topic: Perron–Frobenius theorem}
- {front: 'Why a non-primitive matrix may never settle', back: '$\begin{bmatrix} 0 & 4 \\ 0.25 & 0\end{bmatrix}$ has eigenvalues $\pm1$: no dominant eigenvalue, so the age distribution oscillates forever.', topic: Perron–Frobenius theorem}
