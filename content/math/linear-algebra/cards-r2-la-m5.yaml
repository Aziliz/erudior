# Round 2 cards for module la-m5 (honors lessons 18h1 and 18h2)
# Pivoting and LDU
- {front: 'Permutation matrix', back: '$I$ with its rows reordered: exactly one 1 in each row and column. $PA$ reorders the rows of $A$; $AP$ reorders the columns.', topic: Pivoting and LDU}
- {front: 'Inverse of a permutation matrix', back: '$P^{-1} = P^T$. A single swap is its own inverse; a general reordering is not.', topic: Pivoting and LDU}
- {front: 'How many $n \times n$ permutation matrices?', back: '$n!$, one for each ordering of the rows (24 when $n = 4$).', topic: Pivoting and LDU}
- {front: 'Permuted LU: existence', back: 'Every matrix has $PA = LU$ ($L$ unit lower triangular, $U$ echelon), even when $A = LU$ fails.', topic: Pivoting and LDU}
- {front: 'Row swap during LU bookkeeping', back: 'Multipliers already recorded for the two rows are swapped with them: each row carries its own multipliers.', topic: Pivoting and LDU}
- {front: 'Solving with $PA = LU$', back: 'Forward-substitute $L\mathbf{y} = P\mathbf{b}$, then back-substitute $U\mathbf{x} = \mathbf{y}$. Don''t forget to permute $\mathbf{b}$.', topic: Pivoting and LDU}
- {front: 'Partial pivoting rule', back: 'In each column, pivot on the entry of largest absolute value at or below the pivot position; then every $|\ell_{ij}| \le 1$.', topic: Pivoting and LDU}
- {front: 'Why $\begin{bmatrix} 0 & 1 \\ 1 & 1\end{bmatrix}$ has no LU', back: '$u_{11} = a_{11} = 0$ forces $a_{21} = \ell_{21}u_{11} = 0$, but $a_{21} = 1$. Swapping the rows fixes it.', topic: Pivoting and LDU}
- {front: 'From LU to LDU', back: 'Divide each row of $U$ by its pivot: $U = DU_1$ with $D$ = diagonal of pivots, $U_1$ unit upper triangular, so $A = LDU_1$.', topic: Pivoting and LDU}
- {front: 'Uniqueness of LDU', back: 'Invertible $A$ with no row swaps needed has exactly one LDU factorization (unit lower × diagonal × unit upper).', topic: Pivoting and LDU}
- {front: 'Symmetric $A$ and LDU', back: '$A = A^T$ and uniqueness force the unit upper factor to be $L^T$: $A = LDL^T$. Positive pivots in $D$ ⟺ positive definite.', topic: Pivoting and LDU}
# Block elimination
- {front: 'Column–row expansion of $AB$', back: '$AB = \sum_k (\text{column } k \text{ of } A)(\text{row } k \text{ of } B)$, a sum of outer products.', topic: Block elimination}
- {front: 'Outer product vs inner product', back: '$\mathbf{u}\mathbf{v}^T$ is a matrix with entries $u_iv_j$; $\mathbf{v}^T\mathbf{u}$ is a single number.', topic: Block elimination}
- {front: 'Inverse of $\begin{bmatrix} A & B \\ 0 & D\end{bmatrix}$', back: '$\begin{bmatrix} A^{-1} & -A^{-1}BD^{-1} \\ 0 & D^{-1}\end{bmatrix}$ ($A$, $D$ square and invertible).', topic: Block elimination}
- {front: 'Inverse of $\begin{bmatrix} I & B \\ 0 & I\end{bmatrix}$', back: '$\begin{bmatrix} I & -B \\ 0 & I\end{bmatrix}$: undo the block row replacement.', topic: Block elimination}
- {front: 'Schur complement of $A$ in $\begin{bmatrix} A & B \\ C & D\end{bmatrix}$', back: '$S = D - CA^{-1}B$ (needs $A$ invertible). Same size as $D$.', topic: Block elimination}
- {front: 'Block LU factorization', back: '$\begin{bmatrix} A & B \\ C & D\end{bmatrix} = \begin{bmatrix} I & 0 \\ CA^{-1} & I\end{bmatrix}\begin{bmatrix} A & B \\ 0 & S\end{bmatrix}$', topic: Block elimination}
- {front: 'Invertibility from the Schur complement', back: 'With $A$ invertible, $M$ is invertible exactly when $S = D - CA^{-1}B$ is.', topic: Block elimination}
- {front: 'Schur complement of $a_{11}$', back: 'The block left in rows and columns 2 to $n$ after clearing column 1: one step of elimination.', topic: Block elimination}
- {front: 'Solving a block system', back: 'Solve $S\mathbf{x}_2 = \mathbf{g} - CA^{-1}\mathbf{f}$, then $\mathbf{x}_1 = A^{-1}(\mathbf{f} - B\mathbf{x}_2)$.', topic: Block elimination}
- {front: 'Sherman–Morrison formula', back: '$(A + \mathbf{u}\mathbf{v}^T)^{-1} = A^{-1} - \dfrac{A^{-1}\mathbf{u}\,\mathbf{v}^TA^{-1}}{1 + \mathbf{v}^TA^{-1}\mathbf{u}}$', topic: Block elimination}
- {front: 'When is $A + \mathbf{u}\mathbf{v}^T$ singular?', back: 'Exactly when $1 + \mathbf{v}^TA^{-1}\mathbf{u} = 0$ (for invertible $A$).', topic: Block elimination}
- {front: 'Cost of a rank-one update of $A^{-1}$', back: 'About $n^2$ operations, versus about $n^3$ to invert again from scratch.', topic: Block elimination}
