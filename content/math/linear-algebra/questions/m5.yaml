# Module 5: matrix algebra

# --- Lesson 15: matrix operations ---
- id: la-q-1501
  lesson: la-matrix-ops
  module_quiz: true
  topic: Matrix multiplication
  stem: 'Let $A = \begin{bmatrix} 1 & 2 \\ 0 & -1\end{bmatrix}$ and $B = \begin{bmatrix} 3 & 1 \\ 1 & 4\end{bmatrix}$. What is column 2 of $AB$?'
  choices: ['$\begin{bmatrix} 9 \\ -4\end{bmatrix}$', '$\begin{bmatrix} 5 \\ -1\end{bmatrix}$', '$\begin{bmatrix} 3 \\ 4\end{bmatrix}$', '$\begin{bmatrix} 1 \\ -4\end{bmatrix}$']
  answer: 0
  explanation: |-
    Column 2 of $AB$ is $A$ times column 2 of $B$: $A\begin{bmatrix} 1 \\ 4\end{bmatrix} = \begin{bmatrix} 1 + 8 \\ 0 - 4\end{bmatrix} = \begin{bmatrix} 9 \\ -4\end{bmatrix}$. $(5, -1)$ is column 1.

- id: la-q-1502
  lesson: la-matrix-ops
  topic: Matrix multiplication
  stem: '$A$ is $3 \times 4$ and $B$ is $4 \times 2$. Which is true?'
  choices: ['$AB$ is $4 \times 4$ and $BA$ is $2 \times 3$', '$AB$ is $3 \times 2$ and $BA$ is undefined', 'Both $AB$ and $BA$ are undefined', '$AB$ is $3 \times 2$ and $BA$ is $2 \times 3$']
  answer: 1
  explanation: |-
    $(3 \times 4)(4 \times 2)$ is $3 \times 2$. For $BA$, $(4 \times 2)(3 \times 4)$ has inner sizes 2 and 3, which don't match.

- id: la-q-1503
  lesson: la-matrix-ops
  module_quiz: true
  topic: Matrix multiplication
  stem: '$T(\mathbf{x}) = A\mathbf{x}$ and $S(\mathbf{x}) = B\mathbf{x}$ map $\mathbb{R}^2$ to $\mathbb{R}^2$. What is the standard matrix of "apply $T$, then apply $S$"?'
  choices: ['$AB$', '$A + B$', '$BA$', '$A^TB$']
  answer: 2
  explanation: |-
    $S(T(\mathbf{x})) = B(A\mathbf{x}) = (BA)\mathbf{x}$. The matrix applied first sits on the right, next to $\mathbf{x}$.

- id: la-q-1504
  lesson: la-matrix-ops
  module_quiz: true
  topic: Transpose
  stem: 'Which equals $(AB)^T$?'
  choices: ['$B^TA^T$', '$A^TB^T$', '$BA$', '$(BA)^T$']
  answer: 0
  explanation: |-
    The transpose of a product is the product of the transposes in reverse order. $A^TB^T$ often isn't even defined (check sizes).

- id: la-q-1505
  lesson: la-matrix-ops
  topic: Transpose
  stem: 'What is $\begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6\end{bmatrix}^T$?'
  choices: ['$\begin{bmatrix} 3 & 2 & 1 \\ 6 & 5 & 4\end{bmatrix}$', '$\begin{bmatrix} 4 & 5 & 6 \\ 1 & 2 & 3\end{bmatrix}$', '$\begin{bmatrix} 6 & 3 \\ 5 & 2 \\ 4 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 4 \\ 2 & 5 \\ 3 & 6\end{bmatrix}$']
  answer: 3
  explanation: |-
    The rows of $A$ become the columns of $A^T$, so a $2 \times 3$ matrix becomes $3 \times 2$ with $(A^T)_{ij} = a_{ji}$.

- id: la-q-1506
  lesson: la-matrix-ops
  module_quiz: true
  topic: Matrix multiplication
  stem: 'For $n \times n$ matrices, which statement can fail?'
  choices: ['$A(BC) = (AB)C$', '$A(B + C) = AB + AC$', 'If $AB = AC$ then $B = C$', '$IA = A$']
  answer: 2
  explanation: |-
    There is no cancellation law in general. For example with $A = \begin{bmatrix} 1 & 0 \\ 0 & 0\end{bmatrix}$, $B = \begin{bmatrix} 0 & 0 \\ 0 & 1\end{bmatrix}$ and $C = 0$, $AB = AC = 0$ but $B \ne C$. Cancellation does work when $A$ is invertible.

- id: la-q-1507
  lesson: la-matrix-ops
  topic: Matrix multiplication
  stem: 'Let $A = \begin{bmatrix} 1 & 1 \\ 0 & 1\end{bmatrix}$. What is $A^3$?'
  choices: ['$\begin{bmatrix} 1 & 1 \\ 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 3 \\ 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 3 & 3 \\ 0 & 3\end{bmatrix}$', '$\begin{bmatrix} 1 & 1 \\ 0 & 1\end{bmatrix}^T$']
  answer: 1
  explanation: |-
    $A^2 = \begin{bmatrix} 1 & 2 \\ 0 & 1\end{bmatrix}$ and $A^3 = A^2A = \begin{bmatrix} 1 & 3 \\ 0 & 1\end{bmatrix}$. Geometrically, three shears by 1 make a shear by 3. Cubing each entry would give $A$ back, which is wrong.

- id: la-q-1508
  lesson: la-matrix-ops
  module_quiz: true
  topic: Computer graphics
  stem: 'In homogeneous coordinates, which matrix translates every point by $(3, -2)$?'
  choices: ['$\begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 3 & -2 & 1\end{bmatrix}$', '$\begin{bmatrix} 3 & 0 & 0 \\ 0 & -2 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 & 3 \\ 0 & 1 & -2 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 3 \\ -2 & 1\end{bmatrix}$']
  answer: 2
  explanation: |-
    $\begin{bmatrix} 1 & 0 & 3 \\ 0 & 1 & -2 \\ 0 & 0 & 1\end{bmatrix}\begin{bmatrix} x \\ y \\ 1\end{bmatrix} = \begin{bmatrix} x + 3 \\ y - 2 \\ 1\end{bmatrix}$. The translation goes in the last column; the diagonal matrix with 3 and $-2$ on the diagonal is a scaling, and putting $3, -2$ in the bottom row is the transposed (wrong) layout.

- id: la-q-1509
  lesson: la-matrix-ops
  topic: Computer graphics
  stem: 'Why do graphics programs use homogeneous coordinates $(x, y, 1)$?'
  choices: ['To make every transformation invertible', 'To store colors in the third entry', 'Because $3 \times 3$ matrices are faster to multiply', 'So that translations, which are not linear on $\mathbb{R}^2$, can be done by matrix multiplication']
  answer: 3
  explanation: |-
    A translation moves the origin, so it can't be a $2 \times 2$ matrix. In homogeneous coordinates it becomes a $3 \times 3$ matrix, and sequences of rotations, scalings and translations combine into one product.

- id: la-q-1510
  lesson: la-matrix-ops
  topic: Computer graphics
  stem: 'A point $(1, 0)$ is rotated $90^\circ$ counterclockwise about the origin and then translated by $(1, 0)$. Where does it end up?'
  choices: ['$(1, 1)$', '$(0, 2)$', '$(2, 0)$', '$(-1, 1)$']
  answer: 0
  explanation: |-
    Rotation sends $(1, 0)$ to $(0, 1)$; translating by $(1, 0)$ gives $(1, 1)$. Doing it in the other order (translate first) would give $(0, 2)$.

- id: la-q-1511
  lesson: la-matrix-ops
  topic: Transpose
  stem: 'The $(2, 3)$ entry of $A^T$ equals which entry of $A$?'
  choices: ['$a_{23}$', '$a_{33}$', '$a_{22}$', '$a_{32}$']
  answer: 3
  explanation: |-
    $(A^T)_{ij} = a_{ji}$, so the $(2, 3)$ entry of $A^T$ is $a_{32}$.

- id: la-q-1512
  lesson: la-matrix-ops
  topic: Matrix multiplication
  stem: 'Compute $\begin{bmatrix} 2 & 0 \\ 0 & 3\end{bmatrix}\begin{bmatrix} 4 & 0 \\ 0 & -1\end{bmatrix}$.'
  choices: ['$\begin{bmatrix} 6 & 0 \\ 0 & 2\end{bmatrix}$', '$\begin{bmatrix} 0 & 8 \\ -3 & 0\end{bmatrix}$', '$\begin{bmatrix} 8 & 0 \\ 0 & -3\end{bmatrix}$', '$\begin{bmatrix} 8 & 0 \\ 0 & 3\end{bmatrix}$']
  answer: 2
  explanation: |-
    Diagonal matrices multiply entry by entry along the diagonal: $2 \cdot 4 = 8$ and $3 \cdot (-1) = -3$. (This is one of the few cases where $AB = BA$.)

- id: la-q-1513
  lesson: la-matrix-ops
  module_quiz: true
  topic: Matrix multiplication
  stem: 'Assuming the block sizes are compatible, what is $\begin{bmatrix} I & B \\ 0 & I\end{bmatrix}\begin{bmatrix} X \\ Y\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} X + YB \\ Y\end{bmatrix}$', '$\begin{bmatrix} X + B \\ Y\end{bmatrix}$', '$\begin{bmatrix} X + BY \\ Y\end{bmatrix}$', '$\begin{bmatrix} X \\ BX + Y\end{bmatrix}$']
  answer: 2
  explanation: |-
    Use the row–column rule on the blocks, keeping each product in order: the top block is $IX + BY = X + BY$ and the bottom block is $0X + IY = Y$. Writing $YB$ reverses a product, which matrices don't allow. Dropping the $Y$ from $BY$ forgets to multiply. Putting $BX$ in the bottom block uses the bottom row of blocks wrongly: it is $0$ and $I$, not $B$ and $I$.

- id: la-q-1514
  lesson: la-matrix-ops
  topic: Matrix multiplication
  stem: 'A $4 \times 5$ matrix is partitioned as $A = [\,A_1 \;\; A_2\,]$, where $A_1$ is $4 \times 2$ and $A_2$ is $4 \times 3$. To compute $AB = A_1B_1 + A_2B_2$ with $B = \begin{bmatrix} B_1 \\ B_2\end{bmatrix}$, how many rows must $B_1$ have?'
  choices: ['2', '4', '3', '5']
  answer: 0
  explanation: |-
    The product $A_1B_1$ needs the number of columns of $A_1$ (2) to equal the number of rows of $B_1$. In general the column split of $A$ (here $2 + 3$) must match the row split of $B$. The answer 4 uses the rows of $A_1$ instead of its columns, 3 belongs to $B_2$, and 5 is the number of rows of all of $B$.

- id: la-q-1515
  lesson: la-matrix-ops
  topic: Matrix multiplication
  stem: 'Let $A = [\,A_1 \;\; A_2\,]$ and $B = \begin{bmatrix} B_1 \\ B_2\end{bmatrix}$ with $A_1 = \begin{bmatrix} 1 & 2 \\ 0 & 1\end{bmatrix}$, $A_2 = \begin{bmatrix} 0 \\ 3\end{bmatrix}$, $B_1 = \begin{bmatrix} 1 & 0 \\ 1 & 1\end{bmatrix}$ and $B_2 = \begin{bmatrix} 2 & -1\end{bmatrix}$. Find $AB$.'
  choices: ['$\begin{bmatrix} 3 & 2 \\ 1 & 1\end{bmatrix}$', '$\begin{bmatrix} 3 & 2 \\ -5 & 4\end{bmatrix}$', '$\begin{bmatrix} 1 & 2 \\ 7 & 0\end{bmatrix}$', '$\begin{bmatrix} 3 & 2 \\ 7 & -2\end{bmatrix}$']
  answer: 3
  explanation: |-
    $AB = A_1B_1 + A_2B_2$. Here $A_1B_1 = \begin{bmatrix} 3 & 2 \\ 1 & 1\end{bmatrix}$ and $A_2B_2 = \begin{bmatrix} 0 & 0 \\ 6 & -3\end{bmatrix}$ (a column times a row), so $AB = \begin{bmatrix} 3 & 2 \\ 7 & -2\end{bmatrix}$. Stopping at $A_1B_1$ leaves out the second block term, subtracting $A_2B_2$ is a sign slip, and the matrix with first row $(1, 2)$ comes from computing $B_1A_1$ instead of $A_1B_1$.

- id: la-q-1516
  lesson: la-matrix-ops
  topic: Computer graphics
  stem: 'In homogeneous coordinates a $2 \times 2$ linear map $M$ becomes $\begin{bmatrix} M & \mathbf{0} \\ \mathbf{0}^T & 1\end{bmatrix}$. Multiplying block by block, what is $\begin{bmatrix} M & \mathbf{0} \\ \mathbf{0}^T & 1\end{bmatrix}\begin{bmatrix} \mathbf{x} \\ 1\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} M\mathbf{x} \\ 0\end{bmatrix}$', '$\begin{bmatrix} M\mathbf{x} \\ 1\end{bmatrix}$', '$\begin{bmatrix} \mathbf{x}M \\ 1\end{bmatrix}$', '$\begin{bmatrix} M\mathbf{x} \\ \mathbf{x}\end{bmatrix}$']
  answer: 1
  explanation: |-
    Top block: $M\mathbf{x} + \mathbf{0}\cdot 1 = M\mathbf{x}$. Bottom block: $\mathbf{0}^T\mathbf{x} + 1 \cdot 1 = 1$. So the point is moved by $M$ and keeps its final 1. A bottom entry of 0 forgets the $1 \cdot 1$ term; $\mathbf{x}M$ reverses the order of a product (and isn't even defined for a column $\mathbf{x}$); a bottom block $\mathbf{x}$ treats $\mathbf{0}^T\mathbf{x}$ as $\mathbf{x}$ instead of the number 0.

# --- Lesson 16: inverse ---
- id: la-q-1601
  lesson: la-inverse
  module_quiz: true
  topic: Matrix inverse
  stem: 'If $A$ and $B$ are invertible $n \times n$ matrices, what is $(AB)^{-1}$?'
  choices: ['$A^{-1}B^{-1}$', '$B^{-1}A^{-1}$', '$BA$', '$(BA)^{-1}$']
  answer: 1
  explanation: |-
    $(AB)(B^{-1}A^{-1}) = A(BB^{-1})A^{-1} = AA^{-1} = I$. To undo "$B$, then $A$", undo $A$ first.

- id: la-q-1602
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'What is the inverse of $\begin{bmatrix} 2 & 0 \\ 0 & -\tfrac13\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} -2 & 0 \\ 0 & \tfrac13\end{bmatrix}$', '$\begin{bmatrix} \tfrac12 & 0 \\ 0 & -3\end{bmatrix}$', '$\begin{bmatrix} \tfrac12 & 0 \\ 0 & 3\end{bmatrix}$', '$\begin{bmatrix} 0 & 2 \\ -\tfrac13 & 0\end{bmatrix}$']
  answer: 1
  explanation: |-
    A diagonal matrix with nonzero diagonal entries is inverted by taking the reciprocal of each diagonal entry: $\tfrac12$ and $-3$.

- id: la-q-1603
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'What is the inverse of $\begin{bmatrix} 1 & 0 \\ 3 & 1\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} 1 & 0 \\ -3 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & -3 \\ 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ \tfrac13 & 1\end{bmatrix}$', '$\begin{bmatrix} -1 & 0 \\ -3 & -1\end{bmatrix}$']
  answer: 0
  explanation: |-
    Determinant $1$; swap the diagonal (both 1) and negate the off-diagonal: $\begin{bmatrix} 1 & 0 \\ -3 & 1\end{bmatrix}$. Geometrically, a vertical shear by 3 is undone by a shear by $-3$.

- id: la-q-1604
  lesson: la-inverse
  module_quiz: true
  topic: Matrix inverse
  stem: 'Suppose $A^{-1} = \begin{bmatrix} 2 & -1 \\ 1 & 1\end{bmatrix}$. Solve $A\mathbf{x} = \begin{bmatrix} 1 \\ 3\end{bmatrix}$.'
  choices: ['$\begin{bmatrix} 5 \\ 4\end{bmatrix}$', '$\begin{bmatrix} -1 \\ 2\end{bmatrix}$', '$\begin{bmatrix} -1 \\ 4\end{bmatrix}$', 'Not enough information without $A$']
  answer: 2
  explanation: |-
    $\mathbf{x} = A^{-1}\mathbf{b} = \begin{bmatrix} 2 - 3 \\ 1 + 3\end{bmatrix} = \begin{bmatrix} -1 \\ 4\end{bmatrix}$. You don't need $A$ itself.

- id: la-q-1605
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'Which matrix is singular?'
  choices: ['$\begin{bmatrix} 2 & 4 \\ 3 & 5\end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ 1 & 0\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ 0 & 7\end{bmatrix}$', '$\begin{bmatrix} 2 & 4 \\ 3 & 6\end{bmatrix}$']
  answer: 3
  explanation: |-
    $2(6) - 4(3) = 0$: the columns are multiples of each other, so there's no inverse. By contrast $\begin{bmatrix} 2 & 4 \\ 3 & 5\end{bmatrix}$ has $ad - bc = 10 - 12 = -2 \ne 0$.

- id: la-q-1606
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'Row-reducing $[\,A \;\; I\,]$ for a $3 \times 3$ matrix $A$, you get a row of zeros in the left block. What does that mean?'
  choices: ['$A^{-1}$ is the right block', '$A^{-1}$ has a zero row', 'You made an arithmetic error, since this can''t happen', '$A$ is singular']
  answer: 3
  explanation: |-
    The left block can then never become $I$, so $A$ is not row equivalent to $I$ and has no inverse.

- id: la-q-1607
  lesson: la-inverse
  module_quiz: true
  topic: Matrix inverse
  stem: 'If $A$ is invertible, which equals $(A^T)^{-1}$?'
  choices: ['$A^{-1}$', '$-A^T$', '$(A^{-1})^T$', '$A$']
  answer: 2
  explanation: |-
    Transpose $AA^{-1} = I$ to get $(A^{-1})^TA^T = I$, so $(A^{-1})^T$ is the inverse of $A^T$.

- id: la-q-1608
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'If $A$ is invertible, what is $(2A)^{-1}$?'
  choices: ['$2A^{-1}$', '$\tfrac12 A^{-1}$', '$-2A^{-1}$', '$A^{-1} - 2I$']
  answer: 1
  explanation: |-
    $(2A)\left(\tfrac12A^{-1}\right) = (2 \cdot \tfrac12)AA^{-1} = I$.

- id: la-q-1609
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'What is the inverse of $\begin{bmatrix} 1 & 0 & 0 \\ 2 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} 1 & 0 & 0 \\ -2 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & -2 & 0 \\ 0 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 & 0 \\ \tfrac12 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} -1 & 0 & 0 \\ -2 & -1 & 0 \\ 0 & 0 & -1\end{bmatrix}$']
  answer: 0
  explanation: |-
    Row-reduce $[\,A \;\; I\,]$: one step, $R_2 \leftarrow R_2 - 2R_1$, turns $A$ into $I$ and $I$ into $\begin{bmatrix} 1 & 0 & 0 \\ -2 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$.

- id: la-q-1610
  lesson: la-inverse
  module_quiz: true
  topic: Matrix inverse
  stem: 'If $A$ is an invertible $n \times n$ matrix, how many solutions does $A\mathbf{x} = \mathbf{b}$ have?'
  choices: ['Exactly one for each $\mathbf{b}$', 'None for some $\mathbf{b}$', 'Infinitely many for each $\mathbf{b}$', 'It depends on $\mathbf{b}$']
  answer: 0
  explanation: |-
    $\mathbf{x} = A^{-1}\mathbf{b}$ is a solution, and multiplying $A\mathbf{u} = \mathbf{b}$ by $A^{-1}$ shows any solution equals it.

- id: la-q-1611
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'Find the inverse of $\begin{bmatrix} 3 & 1 \\ 5 & 2\end{bmatrix}$.'
  choices: ['$\begin{bmatrix} 2 & -1 \\ -5 & 3\end{bmatrix}$', '$\begin{bmatrix} 2 & 1 \\ 5 & 3\end{bmatrix}$', '$\begin{bmatrix} -2 & 1 \\ 5 & -3\end{bmatrix}$', '$\begin{bmatrix} 3 & -1 \\ -5 & 2\end{bmatrix}$']
  answer: 0
  explanation: |-
    $ad - bc = 6 - 5 = 1$, so the inverse is $\begin{bmatrix} 2 & -1 \\ -5 & 3\end{bmatrix}$. Check: $\begin{bmatrix} 3 & 1 \\ 5 & 2\end{bmatrix}\begin{bmatrix} 2 & -1 \\ -5 & 3\end{bmatrix} = \begin{bmatrix} 1 & 0 \\ 0 & 1\end{bmatrix}$.

- id: la-q-1612
  lesson: la-inverse
  topic: Matrix inverse
  stem: 'Why does row-reducing $[\,A \;\; I\,]$ produce $A^{-1}$ in the right block?'
  choices: ['Because row operations don''t change $I$', 'Because the right block is always the transpose of the left', 'Because $A^{-1} = A^T$', 'Because the columns of $A^{-1}$ are the solutions of $A\mathbf{x} = \mathbf{e}_1, \dots, A\mathbf{x} = \mathbf{e}_n$, which are all solved at once']
  answer: 3
  explanation: |-
    $AA^{-1} = I$ means $A$ times column $j$ of $A^{-1}$ is $\mathbf{e}_j$. Putting all the $\mathbf{e}_j$ beside $A$ solves these $n$ systems simultaneously.

# --- Lesson 17: elementary matrices and the IMT ---
- id: la-q-1701
  lesson: la-imt
  topic: Elementary matrices
  stem: 'Which $2 \times 2$ elementary matrix performs $R_2 \leftarrow R_2 + 3R_1$?'
  choices: ['$\begin{bmatrix} 1 & 3 \\ 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ 0 & 3\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ -3 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ 3 & 1\end{bmatrix}$']
  answer: 3
  explanation: |-
    Do the operation to $I$: row 2 of $I$ becomes $(0, 1) + 3(1, 0) = (3, 1)$. The matrix with the 3 in the upper-right corner would add 3 times row 2 to row 1.

- id: la-q-1702
  lesson: la-imt
  module_quiz: true
  topic: Elementary matrices
  stem: 'What is the inverse of $E = \begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ -4 & 0 & 1\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ 4 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 & -4 \\ 0 & 1 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 & 0 \\ 0 & 1 & 0 \\ -\tfrac14 & 0 & 1\end{bmatrix}$', '$E$ itself']
  answer: 0
  explanation: |-
    $E$ subtracts 4 times row 1 from row 3; the inverse operation adds it back.

- id: la-q-1703
  lesson: la-imt
  topic: Elementary matrices
  stem: '$E$ is the $3 \times 3$ identity with rows 1 and 3 swapped. What is $EA$ for a $3 \times 4$ matrix $A$?'
  choices: ['$A$ with columns 1 and 3 swapped', '$A$ with rows 1 and 3 swapped', '$A^T$', 'Undefined']
  answer: 1
  explanation: |-
    Left-multiplying by an elementary matrix performs its row operation on $A$. (Right-multiplying, $AE'$ with a $4 \times 4$ $E'$, would act on columns.)

- id: la-q-1704
  lesson: la-imt
  module_quiz: true
  topic: Invertible matrix theorem
  stem: '$A$ is $4 \times 4$ and $A\mathbf{x} = \mathbf{0}$ has only the trivial solution. Which must be true?'
  choices: ['$A\mathbf{x} = \mathbf{b}$ has a solution for every $\mathbf{b}$ in $\mathbb{R}^4$', '$A$ has a row of zeros', '$A$ is the identity', 'The columns of $A$ are dependent']
  answer: 0
  explanation: |-
    By the IMT, only the trivial solution means $A$ is invertible, so the columns span $\mathbb{R}^4$ and every $\mathbf{b}$ is reachable (uniquely, in fact).

- id: la-q-1705
  lesson: la-imt
  topic: Invertible matrix theorem
  stem: 'The columns of a $5 \times 5$ matrix $A$ do not span $\mathbb{R}^5$. Which follows?'
  choices: ['$A\mathbf{x} = \mathbf{0}$ has a nontrivial solution', '$A$ is invertible', '$A$ has 5 pivots', '$A^T$ is invertible']
  answer: 0
  explanation: |-
    Failing to span means the IMT statements are all false: $A$ is singular, has fewer than 5 pivots, and so has a free variable in $A\mathbf{x} = \mathbf{0}$.

- id: la-q-1706
  lesson: la-imt
  topic: Invertible matrix theorem
  stem: 'To which matrices does the invertible matrix theorem apply?'
  choices: ['All matrices', 'Only square matrices', 'Only matrices with nonzero entries', 'Only triangular matrices']
  answer: 1
  explanation: |-
    Its equivalences depend on the matrix being $n \times n$, so that "pivot in every column" and "pivot in every row" both mean $n$ pivots. A $3 \times 2$ matrix can have independent columns that don't span $\mathbb{R}^3$.

- id: la-q-1707
  lesson: la-imt
  module_quiz: true
  topic: Invertible matrix theorem
  stem: '$A$ and $C$ are $n \times n$ and $CA = I$. What can you conclude?'
  choices: ['Nothing; you also need $AC = I$', '$C$ is singular', '$A = I$', '$A$ is invertible and $A^{-1} = C$']
  answer: 3
  explanation: |-
    $CA = I$ gives $A\mathbf{x} = \mathbf{0} \Rightarrow \mathbf{x} = CA\mathbf{x} = \mathbf{0}$, so by the IMT $A$ is invertible; then $C = CAA^{-1} = A^{-1}$. For square matrices a one-sided inverse is automatically two-sided.

- id: la-q-1708
  lesson: la-imt
  topic: Invertible matrix theorem
  stem: 'For which $h$ is $\begin{bmatrix} 1 & h \\ 2 & 6\end{bmatrix}$ singular?'
  choices: ['$h = 2$', '$h = 3$', '$h = 6$', '$h = 12$']
  answer: 1
  explanation: |-
    $R_2 - 2R_1 = [\,0 \;\; 6 - 2h\,]$, so there is only one pivot when $h = 3$. Equivalently $ad - bc = 6 - 2h = 0$.

- id: la-q-1709
  lesson: la-imt
  topic: Elementary matrices
  stem: 'What does right-multiplying $A$ by an elementary matrix, $AE$, do?'
  choices: ['The same row operation as $EA$', 'Nothing; $AE = EA$', 'It transposes $A$', 'The corresponding column operation on $A$']
  answer: 3
  explanation: |-
    $AE$ combines the columns of $A$ using the columns of $E$. Use $EA$ for row operations.

- id: la-q-1710
  lesson: la-imt
  topic: Invertible matrix theorem
  stem: 'Why is every invertible matrix a product of elementary matrices?'
  choices: ['Because $E_k\cdots E_1A = I$ gives $A = E_1^{-1}\cdots E_k^{-1}$, and inverses of elementary matrices are elementary', 'Because every matrix is triangular', 'Because $A = A^T$', 'Because elementary matrices commute']
  answer: 0
  explanation: |-
    Row-reduce $A$ to $I$ and record the operations; undoing them in reverse order rebuilds $A$ from $I$.

- id: la-q-1711
  lesson: la-imt
  module_quiz: true
  topic: Invertible matrix theorem
  stem: 'Which property guarantees that a $3 \times 3$ matrix $A$ is invertible?'
  choices: ['$A$ has no zero entries', '$A$ has a nonzero first column', 'Its columns are linearly independent', '$A\mathbf{x} = \mathbf{b}$ has a solution for $\mathbf{b} = \mathbf{0}$']
  answer: 2
  explanation: |-
    Independent columns is one of the IMT statements. $A\mathbf{x} = \mathbf{0}$ always has a solution, and nonzero entries don't prevent dependence, e.g. $\begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9\end{bmatrix}$ is singular.

- id: la-q-1712
  lesson: la-imt
  topic: Invertible matrix theorem
  stem: 'Is the transformation $T(x_1, x_2) = (x_1 + 2x_2,\ 3x_1 + 6x_2)$ invertible?'
  choices: ['Yes, its inverse is $(x_1 - 2x_2, -3x_1 + 6x_2)$', 'Yes, because it is linear', 'No, because its standard matrix $\begin{bmatrix} 1 & 2 \\ 3 & 6\end{bmatrix}$ is singular', 'No, because it is not linear']
  answer: 2
  explanation: |-
    $T$ is invertible exactly when its standard matrix is, and $1(6) - 2(3) = 0$. Indeed $T(2, -1) = \mathbf{0}$, so $T$ isn't one-to-one.

# --- Lesson 18: LU factorization ---
- id: la-q-1801
  lesson: la-lu
  topic: LU factorization
  stem: 'While finding $U$, you perform $R_2 \leftarrow R_2 - 3R_1$. What entry goes in position $(2, 1)$ of $L$?'
  choices: ['$-3$', '$\tfrac13$', '$3$', '$1$']
  answer: 2
  explanation: |-
    $L$ stores the multiplier $\ell_{21}$ from $R_2 \leftarrow R_2 - \ell_{21}R_1$, so $\ell_{21} = 3$. (The elementary matrix has $-3$; $L$ is built from the inverses.)

- id: la-q-1802
  lesson: la-lu
  module_quiz: true
  topic: LU factorization
  stem: 'Find the LU factorization of $A = \begin{bmatrix} 2 & 1 \\ 6 & 5\end{bmatrix}$.'
  choices: ['$L = \begin{bmatrix} 1 & 0 \\ -3 & 1\end{bmatrix}$, $U = \begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix}$', '$L = \begin{bmatrix} 1 & 0 \\ 3 & 1\end{bmatrix}$, $U = \begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix}$', '$L = \begin{bmatrix} 1 & 0 \\ 3 & 1\end{bmatrix}$, $U = \begin{bmatrix} 2 & 1 \\ 0 & 8\end{bmatrix}$', '$L = \begin{bmatrix} 2 & 0 \\ 6 & 1\end{bmatrix}$, $U = \begin{bmatrix} 1 & 1 \\ 0 & 2\end{bmatrix}$']
  answer: 1
  explanation: |-
    $\ell_{21} = 6/2 = 3$; $R_2 - 3R_1 = [\,0 \;\; 2\,]$. Check: $\begin{bmatrix} 1 & 0 \\ 3 & 1\end{bmatrix}\begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix} = \begin{bmatrix} 2 & 1 \\ 6 & 5\end{bmatrix}$. ✓

- id: la-q-1803
  lesson: la-lu
  topic: LU factorization
  stem: 'Find $L$ in the LU factorization of $A = \begin{bmatrix} 1 & 2 \\ -2 & 1\end{bmatrix}$.'
  choices: ['$\begin{bmatrix} 1 & 0 \\ 2 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ -2 & 5\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ -2 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & -2 \\ 0 & 1\end{bmatrix}$']
  answer: 2
  explanation: |-
    Clearing $-2$ uses $R_2 \leftarrow R_2 - (-2)R_1$, so $\ell_{21} = -2$, and $U = \begin{bmatrix} 1 & 2 \\ 0 & 5\end{bmatrix}$. Storing $+2$ is the classic sign slip.

- id: la-q-1804
  lesson: la-lu
  module_quiz: true
  topic: LU factorization
  stem: 'Given $A = LU$, in what order do you solve $A\mathbf{x} = \mathbf{b}$?'
  choices: ['Solve $U\mathbf{y} = \mathbf{b}$, then $L\mathbf{x} = \mathbf{y}$', 'Solve $L\mathbf{y} = \mathbf{b}$, then $U\mathbf{x} = \mathbf{y}$', 'Compute $L^{-1}U^{-1}\mathbf{b}$', 'Solve $L\mathbf{x} = \mathbf{b}$ and $U\mathbf{x} = \mathbf{b}$ separately']
  answer: 1
  explanation: |-
    $A\mathbf{x} = L(U\mathbf{x})$. Let $\mathbf{y} = U\mathbf{x}$: first $L\mathbf{y} = \mathbf{b}$ (forward substitution), then $U\mathbf{x} = \mathbf{y}$ (back-substitution). Note $A^{-1} = U^{-1}L^{-1}$, not $L^{-1}U^{-1}$.

- id: la-q-1805
  lesson: la-lu
  topic: LU factorization
  stem: 'Solve $L\mathbf{y} = \mathbf{b}$ for $L = \begin{bmatrix} 1 & 0 \\ 2 & 1\end{bmatrix}$ and $\mathbf{b} = \begin{bmatrix} 3 \\ 8\end{bmatrix}$.'
  choices: ['$\mathbf{y} = (3, 2)$', '$\mathbf{y} = (3, 14)$', '$\mathbf{y} = (3, 8)$', '$\mathbf{y} = (1, 3)$']
  answer: 0
  explanation: |-
    Forward substitution: $y_1 = 3$, then $2(3) + y_2 = 8$, so $y_2 = 2$. Adding instead of subtracting gives 14.

- id: la-q-1806
  lesson: la-lu
  topic: LU factorization
  stem: 'When is an LU factorization most worth computing?'
  choices: ['When $A$ is diagonal', 'When you only need $\det A$ once', 'When $A$ is not square', 'When you need to solve $A\mathbf{x} = \mathbf{b}$ for many different $\mathbf{b}$ with the same $A$']
  answer: 3
  explanation: |-
    The expensive elimination on $A$ (about $\tfrac23n^3$ operations) is done once; each new $\mathbf{b}$ then costs two triangular solves (about $n^2$ operations each).

- id: la-q-1807
  lesson: la-lu
  topic: LU factorization
  stem: 'Which matrix has no LU factorization (without row interchanges)?'
  choices: ['$\begin{bmatrix} 2 & 1 \\ 4 & 3\end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ 1 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 \\ 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 1 \\ 1 & 2\end{bmatrix}$']
  answer: 1
  explanation: |-
    The $(1, 1)$ entry is 0, so you can't clear below it with a replacement; a row swap is needed. Software handles this with $PA = LU$.

- id: la-q-1808
  lesson: la-lu
  topic: LU factorization
  stem: 'In $A = LU$ (as defined in this course), what are $L$ and $U$?'
  choices: ['$L$ is unit lower triangular and $U$ is an echelon form of $A$', '$L$ is upper triangular and $U$ is lower triangular', '$L$ and $U$ are both diagonal', '$L$ is the RREF of $A$ and $U = A^{-1}$']
  answer: 0
  explanation: |-
    $L$ has 1s on the diagonal and the multipliers below it; $U$ is the echelon form produced by downward row replacements.

- id: la-q-1809
  lesson: la-lu
  module_quiz: true
  topic: LU factorization
  stem: 'Let $L = \begin{bmatrix} 1 & 0 \\ 2 & 1\end{bmatrix}$, $U = \begin{bmatrix} 1 & 3 \\ 0 & 2\end{bmatrix}$, $\mathbf{b} = \begin{bmatrix} 4 \\ 12\end{bmatrix}$. Solve $LU\mathbf{x} = \mathbf{b}$.'
  choices: ['$\mathbf{x} = (-2, 2)$', '$\mathbf{x} = (4, 2)$', '$\mathbf{x} = (1, 1)$', '$\mathbf{x} = (-2, 4)$']
  answer: 0
  explanation: |-
    $L\mathbf{y} = \mathbf{b}$: $y_1 = 4$, $y_2 = 12 - 8 = 4$. $U\mathbf{x} = \mathbf{y}$: $2x_2 = 4$ so $x_2 = 2$; $x_1 + 3(2) = 4$ so $x_1 = -2$.
    Check with $A = LU = \begin{bmatrix} 1 & 3 \\ 2 & 8\end{bmatrix}$: $(-2 + 6,\ -4 + 16) = (4, 12)$. ✓

- id: la-q-1810
  lesson: la-lu
  topic: LU factorization
  stem: |-
    Finding $L$ for $A = \begin{bmatrix} 2 & 1 & -1 \\ 4 & 5 & 1 \\ -2 & 2 & 6\end{bmatrix}$, after clearing column 1 the rows are $[\,2 \;\; 1 \;\; {-1}\,]$, $[\,0 \;\; 3 \;\; 3\,]$, $[\,0 \;\; 3 \;\; 5\,]$. A student sets $\ell_{32} = 2/3$ (using the original $a_{32} = 2$). What's wrong?
  choices: ['Nothing', '$\ell_{32}$ should be $-2/3$', 'Multipliers are always 1', 'The multiplier must use the current entry: $\ell_{32} = 3/3 = 1$']
  answer: 3
  explanation: |-
    Each multiplier is (entry being cleared) ÷ (pivot) at the moment you clear it. Row 3 now has a 3 below the pivot 3, so $\ell_{32} = 1$.

- id: la-q-1811
  lesson: la-lu
  topic: LU factorization
  stem: 'For an $n \times n$ system with $n$ large, roughly how does the work of two triangular substitutions compare with a full row reduction?'
  choices: ['They take about the same time', 'Substitutions take about $n^2$ operations versus about $\tfrac23n^3$ for elimination', 'Substitutions take about $n^3$ operations versus $n^2$ for elimination', 'Substitutions are slower because there are two of them']
  answer: 1
  explanation: |-
    Each triangular solve touches each of the roughly $n^2/2$ entries once. Elimination's cost grows like $n^3$, so for $n = 1000$ the difference is a factor of hundreds.

- id: la-q-1812
  lesson: la-lu
  topic: LU factorization
  stem: 'What is the purpose of the permutation matrix $P$ in $PA = LU$?'
  choices: ['It reorders the rows of $A$ so that elimination needs no further interchanges', 'It makes $U$ diagonal', 'It scales the rows to make pivots 1', 'It transposes $A$']
  answer: 0
  explanation: |-
    When a zero (or a tiny number) would land in a pivot position, rows must be swapped; doing all the swaps up front with $P$ lets the rest proceed as an ordinary LU factorization.
