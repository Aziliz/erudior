# Module 6: determinants

# --- Lesson 19: cofactor expansion ---
- id: la-q-1901
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 3 & -2 \\ 4 & 1\end{bmatrix}$.'
  choices: ['$-5$', '$11$', '$5$', '$-11$']
  answer: 1
  explanation: |-
    $ad - bc = 3(1) - (-2)(4) = 3 + 8 = 11$. Getting $-5$ means the product $(-2)(4)$ was subtracted with the wrong sign.

- id: la-q-1902
  lesson: la-cofactor
  module_quiz: true
  topic: Cofactor expansion
  stem: 'For $A = \begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 10\end{bmatrix}$, what is the cofactor $C_{12}$?'
  choices: ['$-2$', '$40$', '$-3$', '$2$']
  answer: 3
  explanation: |-
    Delete row 1 and column 2: the minor is $\begin{vmatrix} 4 & 6 \\ 7 & 10\end{vmatrix} = 40 - 42 = -2$. The sign for position $(1, 2)$ is $(-1)^{3} = -1$, so $C_{12} = -(-2) = 2$. $-2$ is the minor, not the cofactor.

- id: la-q-1903
  lesson: la-cofactor
  module_quiz: true
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 2 & 0 & 1 \\ 1 & 3 & -1 \\ 0 & 1 & 4\end{bmatrix}$.'
  choices: ['$25$', '$27$', '$23$', '$13$']
  answer: 1
  explanation: |-
    Expand along row 1: $2\begin{vmatrix} 3 & -1 \\ 1 & 4\end{vmatrix} - 0 + 1\begin{vmatrix} 1 & 3 \\ 0 & 1\end{vmatrix} = 2(12 + 1) + 1(1) = 27$.
    23 comes from computing the first minor as $12 - 1$ (a sign slip on $-(-1)(1)$); 13 is the first minor alone.

- id: la-q-1904
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'In a cofactor expansion, what sign goes with position $(3, 2)$?'
  choices: ['$+$', 'It depends on the size of the matrix', 'It depends on the entry', '$-$']
  answer: 3
  explanation: |-
    The sign is $(-1)^{i+j} = (-1)^{5} = -1$. On the checkerboard, positions with $i + j$ odd are negative.

- id: la-q-1905
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'Which is the most efficient row or column to expand along for $\begin{bmatrix} 5 & 0 & 2 \\ 1 & 0 & 3 \\ 4 & 7 & 6\end{bmatrix}$?'
  choices: ['Row 1', 'Row 3', 'Column 3', 'Column 2']
  answer: 3
  explanation: |-
    Column 2 has two zeros, leaving one term: $7 \cdot (-1)^{3+2}\begin{vmatrix} 5 & 2 \\ 1 & 3\end{vmatrix} = -7(13) = -91$.

- id: la-q-1906
  lesson: la-cofactor
  module_quiz: true
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 2 & 7 & -1 \\ 0 & -3 & 5 \\ 0 & 0 & 4\end{bmatrix}$.'
  choices: ['$-24$', '$24$', '$3$', '$-12$']
  answer: 0
  explanation: |-
    The matrix is upper triangular, so the determinant is the product of the diagonal: $2(-3)(4) = -24$. The entries above the diagonal don't matter.

- id: la-q-1907
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'A $4 \times 4$ matrix has a row of all zeros. What is its determinant?'
  choices: ['$0$', '$1$', 'It depends on the other rows', 'It is undefined']
  answer: 0
  explanation: |-
    Expand along the zero row: every term has a factor of 0.

- id: la-q-1908
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 1 & 0 & 0 \\ 5 & 2 & 0 \\ 3 & -1 & -3\end{bmatrix}$.'
  choices: ['$6$', '$-6$', '$-1$', '$0$']
  answer: 1
  explanation: |-
    Lower triangular: $1 \cdot 2 \cdot (-3) = -6$.

- id: la-q-1909
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'Roughly how many multiplications does cofactor expansion need for an $n \times n$ matrix with no zero entries?'
  choices: ['About $n^2$', 'About $n^3$', 'About $2^n$', 'About $n!$']
  answer: 3
  explanation: |-
    An $n \times n$ expansion needs $n$ determinants of size $n - 1$, each needing $n - 1$ of size $n - 2$, and so on: about $n!$ products. That's why large determinants are computed by row reduction (about $n^3$).

- id: la-q-1910
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 1 & 2 & 3 \\ 4 & 5 & 6 \\ 7 & 8 & 9\end{bmatrix}$.'
  choices: ['$0$', '$-3$', '$45$', '$3$']
  answer: 0
  explanation: |-
    Row 1: $1(45 - 48) - 2(36 - 42) + 3(32 - 35) = -3 + 12 - 9 = 0$. The rows are dependent (row 3 = 2·row 2 − row 1), so the matrix is singular.

- id: la-q-1911
  lesson: la-cofactor
  module_quiz: true
  topic: Cofactor expansion
  stem: 'Compute $\det\begin{bmatrix} 2 & 0 & 0 & 0 \\ 1 & 3 & 0 & 0 \\ 4 & 1 & -1 & 0 \\ 5 & 2 & 7 & 2\end{bmatrix}$.'
  choices: ['$12$', '$6$', '$-12$', '$-6$']
  answer: 2
  explanation: |-
    Lower triangular: $2 \cdot 3 \cdot (-1) \cdot 2 = -12$.

- id: la-q-1912
  lesson: la-cofactor
  topic: Cofactor expansion
  stem: |-
    A student computes $\det\begin{bmatrix} 1 & 2 & 3 \\ 0 & 4 & 5 \\ 1 & 0 & 6\end{bmatrix}$ as $1(24) + 2(-5) + 3(-4) = 2$. Where is the error?
  choices: ['The first minor should be $24 - 5$', 'There is no error', 'The last minor should be $4$', 'The middle term needs the cofactor sign: $2 \cdot (-1)(0 - 5) = +10$, so $\det = 22$']
  answer: 3
  explanation: |-
    The cofactor $C_{12} = (-1)^{1+2}(0 \cdot 6 - 5 \cdot 1) = 5$, not $-5$. The correct value is $24 + 10 - 12 = 22$.

# --- Lesson 20: properties ---
- id: la-q-2001
  lesson: la-det-props
  module_quiz: true
  topic: Determinant properties
  stem: '$\det A = 5$. $B$ is obtained from $A$ by swapping rows 1 and 3. What is $\det B$?'
  choices: ['$5$', '$-5$', '$15$', '$0$']
  answer: 1
  explanation: |-
    Each row interchange multiplies the determinant by $-1$.

- id: la-q-2002
  lesson: la-det-props
  topic: Determinant properties
  stem: '$\det A = 5$. $B$ is obtained from $A$ by $R_2 \leftarrow R_2 + 4R_1$. What is $\det B$?'
  choices: ['$20$', '$9$', '$5$', '$-5$']
  answer: 2
  explanation: |-
    Row replacement doesn't change the determinant. That's why row reduction is a good way to compute determinants.

- id: la-q-2003
  lesson: la-det-props
  topic: Determinant properties
  stem: '$\det A = 5$. $B$ is obtained from $A$ by multiplying row 2 by 3. What is $\det B$?'
  choices: ['$15$', '$5$', '$135$', '$\tfrac53$']
  answer: 0
  explanation: |-
    Scaling one row by $k$ multiplies the determinant by $k$. (Scaling every row of a $3 \times 3$ matrix by 3 would multiply it by $27$.)

- id: la-q-2004
  lesson: la-det-props
  module_quiz: true
  topic: Determinant properties
  stem: '$\det A = 2$ and $\det B = -3$ for $n \times n$ matrices. What is $\det(AB)$?'
  choices: ['$-6$', '$-1$', '$6$', 'It can''t be determined']
  answer: 0
  explanation: |-
    $\det(AB) = \det A \det B = 2(-3) = -6$. There's no corresponding rule for sums.

- id: la-q-2005
  lesson: la-det-props
  topic: Determinant properties
  stem: 'If $\det A = 4$, what is $\det A^{-1}$?'
  choices: ['$-4$', '$4$', '$\tfrac14$', '$16$']
  answer: 2
  explanation: |-
    $\det A \det A^{-1} = \det I = 1$, so $\det A^{-1} = 1/4$.

- id: la-q-2006
  lesson: la-det-props
  module_quiz: true
  topic: Determinant properties
  stem: '$A$ is $3 \times 3$ with $\det A = 2$. What is $\det(3A)$?'
  choices: ['$6$', '$18$', '$54$', '$8$']
  answer: 2
  explanation: |-
    $3A$ multiplies each of the 3 rows by 3, so $\det(3A) = 3^3 \det A = 27 \cdot 2 = 54$. The answer 6 forgets the power.

- id: la-q-2007
  lesson: la-det-props
  topic: Determinant properties
  stem: 'Which statement is true for every square matrix $A$?'
  choices: ['$\det A^T = -\det A$', '$\det A^T = \det A$', '$\det A^T = 1/\det A$', '$\det A^T = (\det A)^2$']
  answer: 1
  explanation: |-
    Transposing doesn't change the determinant, which is why column operations affect determinants the same way row operations do.

- id: la-q-2008
  lesson: la-det-props
  topic: Determinant properties
  stem: 'For a square matrix $A$, $\det A = 0$ exactly when:'
  choices: ['$A$ has a zero entry', '$A$ is symmetric', '$A$ is triangular', '$A$ is not invertible']
  answer: 3
  explanation: |-
    $\det A \ne 0$ is one of the IMT conditions, so $\det A = 0$ means singular, with dependent columns and a nontrivial null solution. Zero entries alone don't force $\det A = 0$.

- id: la-q-2009
  lesson: la-det-props
  topic: Determinant properties
  stem: 'Which shows that $\det(A + B) = \det A + \det B$ is false in general?'
  choices: ['$A = B = I_2$: $\det(2I_2) = 4$ but $\det I_2 + \det I_2 = 2$', '$A = B = 0$', '$A = I_2$, $B = 0$: both sides are 1', 'It''s actually always true']
  answer: 0
  explanation: |-
    One counterexample is enough. Taking $A = B = 0$, or $A = I_2$ and $B = 0$, gives cases where the two sides happen to agree, which proves nothing.

- id: la-q-2010
  lesson: la-det-props
  module_quiz: true
  topic: Determinant properties
  stem: 'Use row reduction to compute $\det\begin{bmatrix} 1 & 2 & 1 \\ 2 & 5 & 4 \\ 1 & 4 & 6\end{bmatrix}$.'
  choices: ['$1$', '$-1$', '$3$', '$0$']
  answer: 0
  explanation: |-
    $R_2 - 2R_1 = [\,0 \;\; 1 \;\; 2\,]$, $R_3 - R_1 = [\,0 \;\; 2 \;\; 5\,]$, then $R_3 - 2R_2 = [\,0 \;\; 0 \;\; 1\,]$. Only replacements were used, so $\det = 1 \cdot 1 \cdot 1 = 1$.

- id: la-q-2011
  lesson: la-det-props
  topic: Determinant properties
  stem: 'If $\det A = -3$, what is $\det(A^2)$?'
  choices: ['$-9$', '$9$', '$-6$', '$6$']
  answer: 1
  explanation: |-
    $\det(A^2) = \det(A)\det(A) = (-3)^2 = 9$. Determinants of squares are never negative.

- id: la-q-2012
  lesson: la-det-props
  topic: Determinant properties
  stem: 'A $4 \times 4$ matrix $A$ has $\det A = 7$. What is $\det(-A)$?'
  choices: ['$-7$', '$28$', '$-28$', '$7$']
  answer: 3
  explanation: |-
    $\det(cA) = c^n\det A = (-1)^4 \cdot 7 = 7$. For an odd-size matrix it would be $-7$.

# --- Lesson 21: Cramer's rule, adjugate, area ---
- id: la-q-2101
  lesson: la-cramer-volume
  module_quiz: true
  topic: Cramer's rule
  stem: 'Use Cramer''s rule to find $x_2$ for $2x_1 + x_2 = 4$, $x_1 + 3x_2 = 7$.'
  choices: ['$x_2 = 1$', '$x_2 = 2$', '$x_2 = 3$', '$x_2 = 10$']
  answer: 1
  explanation: |-
    $\det A = 6 - 1 = 5$. Replace column 2 with $\mathbf{b}$: $\det\begin{bmatrix} 2 & 4 \\ 1 & 7\end{bmatrix} = 14 - 4 = 10$. So $x_2 = 10/5 = 2$ (and $x_1 = 1$).

- id: la-q-2102
  lesson: la-cramer-volume
  topic: Cramer's rule
  stem: 'In Cramer''s rule, what is $A_i(\mathbf{b})$?'
  choices: ['$A$ with row $i$ replaced by $\mathbf{b}^T$', '$A$ with column $i$ deleted', '$A$ with column $i$ replaced by $\mathbf{b}$', '$A$ times $\mathbf{b}$']
  answer: 2
  explanation: |-
    The unknown $x_i$ is the weight on column $i$, so column $i$ is the one replaced by the right-hand side.

- id: la-q-2103
  lesson: la-cramer-volume
  topic: Area and volume
  stem: 'Find the area of the parallelogram determined by $(3, 1)$ and $(1, 4)$.'
  choices: ['$13$', '$11$', '$7$', '$5.5$']
  answer: 1
  explanation: |-
    $\left|\det\begin{bmatrix} 3 & 1 \\ 1 & 4\end{bmatrix}\right| = |12 - 1| = 11$. 5.5 is the area of the triangle with these two sides.

- id: la-q-2104
  lesson: la-cramer-volume
  module_quiz: true
  topic: Area and volume
  stem: 'Find the area of the triangle with vertices $(0, 0)$, $(4, 1)$ and $(1, 3)$.'
  choices: ['$11$', '$13$', '$5.5$', '$6.5$']
  answer: 2
  explanation: |-
    The triangle is half the parallelogram spanned by $(4, 1)$ and $(1, 3)$: $\tfrac12|12 - 1| = 5.5$.

- id: la-q-2105
  lesson: la-cramer-volume
  topic: Area and volume
  stem: 'Find the volume of the parallelepiped determined by $(1, 0, 0)$, $(0, 2, 0)$ and $(1, 1, 3)$.'
  choices: ['$3$', '$5$', '$6$', '$9$']
  answer: 2
  explanation: |-
    The matrix with these columns, $\begin{bmatrix} 1 & 0 & 1 \\ 0 & 2 & 1 \\ 0 & 0 & 3\end{bmatrix}$, is upper triangular with determinant $1 \cdot 2 \cdot 3 = 6$.

- id: la-q-2106
  lesson: la-cramer-volume
  module_quiz: true
  topic: Area and volume
  stem: '$T(\mathbf{x}) = A\mathbf{x}$ with $\det A = -3$. A region $S$ has area 5. What is the area of $T(S)$?'
  choices: ['$-15$', '$8$', '$5/3$', '$15$']
  answer: 3
  explanation: |-
    Areas scale by $|\det A| = 3$, so the image has area 15. The negative sign means $T$ reverses orientation, not that area is negative.

- id: la-q-2107
  lesson: la-cramer-volume
  topic: Cramer's rule
  stem: 'Using the adjugate, $(A^{-1})_{12}$ equals:'
  choices: ['$C_{12}/\det A$', '$C_{21}/\det A$', '$a_{21}/\det A$', '$\det A / C_{12}$']
  answer: 1
  explanation: |-
    $A^{-1} = \frac{1}{\det A}\operatorname{adj} A$, and the adjugate is the transpose of the cofactor matrix, so its $(1, 2)$ entry is $C_{21}$.

- id: la-q-2108
  lesson: la-cramer-volume
  topic: Cramer's rule
  stem: 'What is the adjugate of $\begin{bmatrix} a & b \\ c & d\end{bmatrix}$?'
  choices: ['$\begin{bmatrix} d & -c \\ -b & a\end{bmatrix}$', '$\begin{bmatrix} a & -b \\ -c & d\end{bmatrix}$', '$\begin{bmatrix} d & -b \\ -c & a\end{bmatrix}$', '$\begin{bmatrix} d & b \\ c & a\end{bmatrix}$']
  answer: 2
  explanation: |-
    The cofactors are $C_{11} = d$, $C_{12} = -c$, $C_{21} = -b$, $C_{22} = a$. Transposing the cofactor matrix $\begin{bmatrix} d & -c \\ -b & a\end{bmatrix}$ gives $\begin{bmatrix} d & -b \\ -c & a\end{bmatrix}$, matching the familiar $2 \times 2$ inverse formula.

- id: la-q-2109
  lesson: la-cramer-volume
  topic: Area and volume
  stem: 'A $2 \times 2$ matrix has a negative determinant. What does the sign tell you about $\mathbf{x} \mapsto A\mathbf{x}$?'
  choices: ['It shrinks areas', 'It is a rotation', 'It is not invertible', 'It reverses orientation (like a reflection)']
  answer: 3
  explanation: |-
    $|\det A|$ gives the area factor; the sign says whether orientation is kept (positive) or flipped (negative). Rotations have determinant $+1$; a reflection has $-1$.

- id: la-q-2110
  lesson: la-cramer-volume
  topic: Area and volume
  stem: 'What is the area of the image of the unit square under $\begin{bmatrix} 2 & 1 \\ 1 & 3\end{bmatrix}$?'
  choices: ['$5$', '$7$', '$6$', '$1$']
  answer: 0
  explanation: |-
    The unit square has area 1 and $\det A = 6 - 1 = 5$, so the image parallelogram (spanned by the columns) has area 5.

- id: la-q-2111
  lesson: la-cramer-volume
  topic: Cramer's rule
  stem: 'When can Cramer''s rule be used to solve $A\mathbf{x} = \mathbf{b}$?'
  choices: ['Whenever $A$ is square', 'When $A$ is square and $\det A \neq 0$', 'When $\mathbf{b} = \mathbf{0}$', 'For any consistent system']
  answer: 1
  explanation: |-
    The formula divides by $\det A$, so $A$ must be square and invertible. For singular or non-square systems, use row reduction.

- id: la-q-2112
  lesson: la-cramer-volume
  module_quiz: true
  topic: Cramer's rule
  stem: 'Use Cramer''s rule to find $x_3$ for $A\mathbf{x} = \mathbf{b}$ with $A = \begin{bmatrix} 1 & 0 & 0 \\ 0 & 2 & 0 \\ 1 & 1 & 1\end{bmatrix}$ and $\mathbf{b} = (1, 4, 5)$.'
  choices: ['$x_3 = 4$', '$x_3 = 1$', '$x_3 = 2$', '$x_3 = 5$']
  answer: 2
  explanation: |-
    $\det A = 1 \cdot 2 \cdot 1 = 2$ (lower triangular). $\det A_3(\mathbf{b}) = \det\begin{bmatrix} 1 & 0 & 1 \\ 0 & 2 & 4 \\ 1 & 1 & 5\end{bmatrix} = 1(10 - 4) + 1(0 - 2) = 4$. So $x_3 = 4/2 = 2$.
    Check: $x_1 = 1$, $x_2 = 2$, and $1 + 2 + x_3 = 5$ gives $x_3 = 2$. ✓
