# Honors module la-h1: Linear algebra at work (lessons 90-93).

# --- Lesson 90: graphs, networks and the incidence matrix ---
- id: la-h1-r2-h01
  lesson: la-h1-graphs
  module_quiz: true
  topic: Graphs and networks
  stem: 'A directed graph has 6 nodes and 9 edges. What is the size of its incidence matrix?'
  choices: ['$9 \times 6$', '$6 \times 9$', '$6 \times 6$', '$9 \times 9$']
  answer: 0
  explanation: |-
    The incidence matrix has one row per edge and one column per node, so it is $9 \times 6$. The $6 \times 9$ matrix is its transpose, which has one row per node.

- id: la-h1-r2-h02
  lesson: la-h1-graphs
  module_quiz: true
  topic: Graphs and networks
  stem: 'A connected graph has 6 nodes and 9 edges. What is $\dim\operatorname{Nul} A^T$, the number of independent loops?'
  choices: ['$3$', '$4$', '$5$', '$15$']
  answer: 1
  explanation: |-
    For a connected graph, $\operatorname{rank} A = n - 1 = 5$, so $\dim\operatorname{Nul} A^T = m - \operatorname{rank} A = 9 - 5 = 4$. The answer 3 uses $m - n$ and forgets the $+1$; 15 adds instead of subtracting.

- id: la-h1-r2-h03
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'For the incidence matrix $A$ of a connected graph, what is $\operatorname{Nul} A$?'
  choices: ['Only the zero vector', 'All vectors whose entries add to zero', 'All vectors with every entry equal', 'All loop vectors']
  answer: 2
  explanation: |-
    $A\mathbf{x} = \mathbf{0}$ means the potentials at the two ends of every edge are equal. In a connected graph you can walk from any node to any other, so all potentials are equal: $\operatorname{Nul} A = \operatorname{Span}\{(1, \dots, 1)\}$. It is not just $\mathbf{0}$, since each row of $A$ adds to 0. Loop vectors live in $\operatorname{Nul} A^T$, which is a subspace of $\mathbb{R}^m$, not $\mathbb{R}^n$.

- id: la-h1-r2-h04
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'In the lesson''s graph (edges $1 \to 2$, $2 \to 3$, $1 \to 3$, $3 \to 4$, $1 \to 4$), is $\mathbf{b} = (1, 2, 3, 1, -1)$ a list of potential differences, that is, in $\operatorname{Col} A$?'
  choices: ['Yes, because around the loop $1 \to 2 \to 3 \to 1$ the entries add to 0', 'Yes, because every vector in $\mathbb{R}^5$ is in $\operatorname{Col} A$', 'No, because $\mathbf{b}$ has a negative entry', 'No, because around the loop $1 \to 3 \to 4 \to 1$ the entries add to 5']
  answer: 3
  explanation: |-
    $\mathbf{b}$ must pass the voltage law around every loop. Loop $1 \to 2 \to 3 \to 1$: $b_1 + b_2 - b_3 = 1 + 2 - 3 = 0$, which passes. Loop $1 \to 3 \to 4 \to 1$: $b_3 + b_4 - b_5 = 3 + 1 + 1 = 5 \neq 0$, which fails. So $\mathbf{b}$ is not in $\operatorname{Col} A$. One passing loop is not enough, $\operatorname{Col} A$ has dimension only 3, and negative differences are allowed.

- id: la-h1-r2-h05
  lesson: la-h1-graphs
  module_quiz: true
  topic: Graphs and networks
  stem: 'Let $\mathbf{y}$ list the flows on the edges of a network with incidence matrix $A$. Which equation says that flow in equals flow out at every node (Kirchhoff''s current law)?'
  choices: ['$A\mathbf{y} = \mathbf{0}$', '$A^T\mathbf{y} = \mathbf{0}$', '$A^TA\mathbf{y} = \mathbf{0}$', '$\mathbf{y}^TA = \mathbf{y}$']
  answer: 1
  explanation: |-
    Column $k$ of $A$ has $+1$ for each edge entering node $k$ and $-1$ for each edge leaving it, so $(A^T\mathbf{y})_k$ is flow in minus flow out at node $k$. Setting it to zero at every node gives $A^T\mathbf{y} = \mathbf{0}$. $A\mathbf{y}$ doesn't even make sense: $A$ needs a vector with one entry per node.

- id: la-h1-r2-h06
  lesson: la-h1-graphs
  module_quiz: true
  topic: Graphs and networks
  stem: 'What is the graph Laplacian $L = A^TA$ of the path graph with edges $1 \to 2$ and $2 \to 3$?'
  choices: ['$\begin{bmatrix} 0 & 1 & 0 \\ 1 & 0 & 1 \\ 0 & 1 & 0\end{bmatrix}$', '$\begin{bmatrix} 1 & 1 & 0 \\ 1 & 2 & 1 \\ 0 & 1 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & -1 & 0 \\ -1 & 2 & -1 \\ 0 & -1 & 1\end{bmatrix}$', '$\begin{bmatrix} 2 & -1 & 0 \\ -1 & 2 & -1 \\ 0 & -1 & 2\end{bmatrix}$']
  answer: 2
  explanation: |-
    $L = D - W$: the diagonal holds the degrees (1, 2, 1) and each pair of joined nodes gets $-1$. The first matrix is the adjacency matrix $W$ alone, the second adds $W$ instead of subtracting it, and the last puts 2 on every diagonal entry although the end nodes touch only one edge each.

- id: la-h1-r2-h07
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'Use the matrix-tree theorem to count the spanning trees of a triangle (3 nodes, each pair joined by one edge).'
  choices: ['$1$', '$2$', '$4$', '$3$']
  answer: 3
  explanation: |-
    $L = \begin{bmatrix} 2 & -1 & -1 \\ -1 & 2 & -1 \\ -1 & -1 & 2\end{bmatrix}$. Delete row 3 and column 3: $\det\begin{bmatrix} 2 & -1 \\ -1 & 2\end{bmatrix} = 4 - 1 = 3$. Check by listing: any two of the three edges form a spanning tree, and there are 3 ways to choose two. (4 comes from forgetting the off-diagonal product.)

- id: la-h1-r2-h08
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'Why is the graph Laplacian $L = A^TA$ always singular?'
  choices: ['$L(1, 1, \dots, 1) = \mathbf{0}$, because every row of $A$ adds to zero', '$L$ is not symmetric', 'Some diagonal entry of $L$ is always zero', 'Every graph contains a loop']
  answer: 0
  explanation: |-
    Each row of $A$ has one $-1$ and one $+1$, so $A\mathbf{1} = \mathbf{0}$ and $L\mathbf{1} = A^T(A\mathbf{1}) = \mathbf{0}$: a nonzero vector in the null space. $L$ is symmetric, its diagonal entries are the degrees (positive for a connected graph with more than one node), and a tree has no loop but its Laplacian is still singular.

- id: la-h1-r2-h09
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'In the lesson''s circuit (1-ohm resistors, 1 A fed in at node 2 and taken out at node 4), the network acted like a single 1-ohm resistor. If the diagonal resistor $e_3$ (between nodes 1 and 3) is removed, what is the resistance between nodes 2 and 4?'
  choices: ['$2$ ohms', '$1$ ohm', '$1.5$ ohms', '$0.5$ ohm']
  answer: 1
  explanation: |-
    The diagonal carried no current, because nodes 1 and 3 were at the same potential ($\tfrac12$ V). Removing it changes nothing: two 2-ohm paths ($2 \to 1 \to 4$ and $2 \to 3 \to 4$) in parallel still give 1 ohm.

- id: la-h1-r2-h10
  lesson: la-h1-graphs
  type: text
  topic: Graphs and networks
  stem: 'A connected graph has 10 nodes and 14 edges. Its incidence matrix has rank ___. (Give only the number.)'
  accept: ['9']
  explanation: |-
    For a connected graph, $\operatorname{Nul} A$ is the line of constant vectors (dimension 1), so by the rank theorem $\operatorname{rank} A = n - 1 = 10 - 1 = 9$. The number of edges doesn't matter.

- id: la-h1-r2-h11
  lesson: la-h1-graphs
  topic: Graphs and networks
  stem: 'Let $A$ be the incidence matrix of a connected graph with $n$ nodes and $m$ edges. Which statements are true? Select all that apply.'
  choices: ['Each row of $A$ adds to 0', '$\operatorname{rank} A = n - 1$', 'The rows of the edges around any loop are linearly dependent', '$A$ is always a square matrix', 'Every off-diagonal entry of $A^TA$ is $-1$']
  answer: [0, 1, 2]
  explanation: |-
    Each row has one $-1$ and one $+1$. Connectedness makes $\operatorname{Nul} A$ one-dimensional, so the rank is $n - 1$. The loop vector gives a dependence relation among the rows of its edges. $A$ is $m \times n$, square only by coincidence, and $A^TA$ has $-1$ only for pairs of nodes joined by an edge (0 for the others).

- id: la-h1-r2-h12
  lesson: la-h1-graphs
  type: label
  topic: Graphs and networks
  stem: 'Each numbered marker sits on an edge of this directed graph (nodes 1 to 4). Give that edge''s row of the incidence matrix ($-1$ at the tail, $+1$ at the head; columns in node order 1, 2, 3, 4).'
  image: {src: images/la-h1-graph-blank.svg, alt: 'A directed graph with four numbered nodes at the corners of a square: 1 top left, 2 top right, 3 bottom right, 4 bottom left. Arrows run from 1 to 2, from 2 to 3, diagonally from 1 to 3, from 3 to 4, and from 1 to 4. A numbered marker sits on each arrow.'}
  labels:
    - {x: 50.0, y: 26.1, text: 'Row (−1, 1, 0, 0)'}
    - {x: 76.6, y: 52.2, text: 'Row (0, −1, 1, 0)'}
    - {x: 50.0, y: 52.2, text: 'Row (−1, 0, 1, 0)'}
    - {x: 50.0, y: 78.3, text: 'Row (0, 0, −1, 1)'}
    - {x: 23.4, y: 52.2, text: 'Row (−1, 0, 0, 1)'}
  distractors: ['Row (1, −1, 0, 0)', 'Row (0, 1, 0, −1)']
  explanation: |-
    Marker 1 is on the edge from node 1 to node 2: $-1$ in column 1 and $+1$ in column 2. Marker 2 is $2 \to 3$, marker 3 is the diagonal $1 \to 3$, marker 4 is $3 \to 4$ (the arrow points left, into node 4), and marker 5 is $1 \to 4$. The distractor $(1, -1, 0, 0)$ has the signs reversed, and $(0, 1, 0, -1)$ would be an edge from 4 to 2, which the graph doesn't have.

- id: la-h1-r2-h13
  lesson: la-h1-graphs
  type: match
  module_quiz: true
  topic: Graphs and networks
  stem: 'Match each fundamental subspace of the incidence matrix $A$ of a connected graph with what it describes.'
  pairs:
    - ['$\operatorname{Nul} A$', 'Constant potentials: every node the same']
    - ['$\operatorname{Col} A$', 'Edge differences that obey the voltage law']
    - ['$\operatorname{Nul} A^T$', 'Edge flows that balance at every node']
    - ['$\operatorname{Row} A$', 'Spanned by the rows of any spanning tree']
  distractors: ['Potentials that differ at every node']
  explanation: |-
    $A\mathbf{x} = \mathbf{0}$ forces equal potentials. $\operatorname{Col} A$ is the set of potential differences, exactly the vectors that add to zero around every loop. $A^T\mathbf{y} = \mathbf{0}$ is Kirchhoff's current law. A spanning tree's $n - 1$ rows are independent, so they form a basis of the row space. Potentials that differ at every node are not a subspace, and they are exactly what $\operatorname{Nul} A$ rules out.

- id: la-h1-r2-h14
  lesson: la-h1-graphs
  type: order
  topic: Graphs and networks
  stem: 'Put the steps for finding the currents in a resistor network in order.'
  items:
    - 'Write the incidence matrix $A$ and the conductance matrix $C$'
    - 'Form $A^TCA$'
    - 'Ground one node: delete its row and column of $A^TCA$'
    - 'Solve the reduced system for the node potentials'
    - 'Use Ohm''s law on each edge to get the edge currents'
  explanation: |-
    $A^TCA$ is built from $A$ and $C$. It is singular, so a node is grounded (its row and column removed) before solving. Only once the potentials are known can Ohm's law give each current as conductance times potential drop.

# --- Lesson 91: PageRank and the power method ---
- id: la-h1-r2-h15
  lesson: la-h1-pagerank
  module_quiz: true
  topic: PageRank and the power method
  stem: 'A web has four pages A, B, C, D (in that order). Page A links to B, C and D. What is column A of the link matrix $S$?'
  choices: ['$(\tfrac13, \tfrac13, \tfrac13, 0)$', '$(0, \tfrac13, \tfrac13, \tfrac13)$', '$(0, 1, 1, 1)$', '$(\tfrac14, \tfrac14, \tfrac14, \tfrac14)$']
  answer: 1
  explanation: |-
    Column A lists where A's links go: $\tfrac13$ for each of its 3 links (to B, C, D) and 0 for A itself. Using 1 instead of $\tfrac13$ makes the column add to 3, not 1. The uniform $\tfrac14$ column is the fix for a dangling page, which A is not.

- id: la-h1-r2-h16
  lesson: la-h1-pagerank
  module_quiz: true
  topic: PageRank and the power method
  stem: 'Why does PageRank use the Google matrix $G = \alpha S + \tfrac{1-\alpha}{n}J$ instead of the link matrix $S$ alone?'
  choices: ['To make the columns of the matrix add to 1', 'To make the dominant eigenvalue larger than 1', 'To make every entry positive, so there is a unique steady state', 'To remove pages that no one links to']
  answer: 2
  explanation: |-
    With damping every entry of $G$ is positive, so $G$ is a regular stochastic matrix and has exactly one steady-state vector, reached from any start. The columns of $S$ already add to 1 (after the dangling-page fix), the dominant eigenvalue stays 1, and pages with no incoming links stay in the web (they get the score $\tfrac{1-\alpha}{n}$).

- id: la-h1-r2-h17
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'A web has $n = 4$ pages and damping factor $\alpha = 0.8$. For a probability vector $\mathbf{x}$, $G\mathbf{x} = 0.8S\mathbf{x} + c\,(1, 1, 1, 1)$. What is $c$?'
  choices: ['$0.2$', '$0.8$', '$0.25$', '$0.05$']
  answer: 3
  explanation: |-
    $c = \tfrac{1 - \alpha}{n} = \tfrac{0.2}{4} = 0.05$. This uses $J\mathbf{x} = (1, 1, 1, 1)$, true because the entries of $\mathbf{x}$ add to 1. Forgetting to divide by $n$ gives 0.2.

- id: la-h1-r2-h18
  lesson: la-h1-pagerank
  module_quiz: true
  topic: PageRank and the power method
  stem: 'A matrix has eigenvalues $10$, $-8$ and $3$. By about what factor does the power method''s error shrink each step?'
  choices: ['$0.8$', '$0.3$', '$1.25$', '$0.2$']
  answer: 0
  explanation: |-
    The error shrinks like $|\lambda_2/\lambda_1|^k$, where $\lambda_2$ is the next-largest eigenvalue in absolute value: $|-8|/10 = 0.8$. Using the smallest eigenvalue gives 0.3; $10/8 = 1.25$ inverts the ratio.

- id: la-h1-r2-h19
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'The power method is applied to a matrix with eigenvalues $3$ and $-3$, from a vector with components along both eigenvectors. What happens?'
  choices: ['It converges to the eigenvector for 3', 'It converges to the eigenvector for $-3$', 'The direction keeps alternating, because no eigenvalue is strictly largest in absolute value', 'It converges to the zero vector']
  answer: 2
  explanation: |-
    $A^k\mathbf{x}_0 = 3^k(c_1\mathbf{v}_1 + (-1)^kc_2\mathbf{v}_2)$. The ratio $|\lambda_2/\lambda_1| = 1$, so the second term never fades; its sign flips every step and the direction alternates between two vectors. The power method needs a strictly dominant eigenvalue. Rescaling keeps the iterates from shrinking to zero.

- id: la-h1-r2-h20
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'For a Google matrix with damping factor $\alpha = 0.9$, what bound holds for its second-largest eigenvalue $\lambda_2$ (in absolute value)?'
  choices: ['$|\lambda_2| \le 0.1$', '$|\lambda_2| \le 0.9$', '$|\lambda_2| \le 0.81$', '$|\lambda_2| \le 1$, and no better bound']
  answer: 1
  explanation: |-
    If $S$ has eigenvalues $1, \lambda_2, \dots, \lambda_n$, then $G$ has eigenvalues $1, \alpha\lambda_2, \dots, \alpha\lambda_n$, and every $|\lambda_i| \le 1$ for a stochastic matrix. So $|\lambda_2| \le \alpha = 0.9$, whatever the link structure.

- id: la-h1-r2-h21
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'Three pages: A links to B; B links to A and C; C links to A. Starting from $\mathbf{x}_0 = (\tfrac13, \tfrac13, \tfrac13)$, find $S\mathbf{x}_0$ (no damping; order A, B, C).'
  choices: ['$(\tfrac13, \tfrac13, \tfrac13)$', '$(\tfrac16, \tfrac13, \tfrac12)$', '$(\tfrac12, \tfrac14, \tfrac14)$', '$(\tfrac12, \tfrac13, \tfrac16)$']
  answer: 3
  explanation: |-
    Columns of $S$: A gives $(0, 1, 0)$, B gives $(\tfrac12, 0, \tfrac12)$, C gives $(1, 0, 0)$. Then page A receives $\tfrac12\cdot\tfrac13 + 1\cdot\tfrac13 = \tfrac12$, page B receives $\tfrac13$ (all of A's), and page C receives $\tfrac12\cdot\tfrac13 = \tfrac16$. The uniform answer comes from using rows as "from" (multiplying by $S^T$).

- id: la-h1-r2-h22
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'For the symmetric matrix $A = \begin{bmatrix} 2 & 1 \\ 1 & 2\end{bmatrix}$ and $\mathbf{x} = (1, 1)$, what is the Rayleigh quotient $\dfrac{\mathbf{x}^TA\mathbf{x}}{\mathbf{x}^T\mathbf{x}}$?'
  choices: ['$3$', '$6$', '$1.5$', '$2$']
  answer: 0
  explanation: |-
    $A\mathbf{x} = (3, 3)$, so $\mathbf{x}^TA\mathbf{x} = 3 + 3 = 6$ and $\mathbf{x}^T\mathbf{x} = 2$; the quotient is 3. Since $(1, 1)$ is an eigenvector for eigenvalue 3, the estimate is exact. Forgetting to divide gives 6.

- id: la-h1-r2-h23
  lesson: la-h1-pagerank
  type: text
  module_quiz: true
  topic: PageRank and the power method
  stem: 'Suppose the PageRank error shrinks by exactly the factor $0.85$ per step. The smallest number of steps $k$ with $0.85^k < 0.01$ is ___. (Give only the number.)'
  accept: ['29']
  explanation: |-
    $k > \dfrac{\ln 0.01}{\ln 0.85} \approx \dfrac{-4.605}{-0.1625} \approx 28.3$, so $k = 29$. Check: $0.85^{28} \approx 0.0105$ is still above 0.01, and $0.85^{29} \approx 0.0089$ is below.

- id: la-h1-r2-h24
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'Let $S$ be a stochastic link matrix and $G = \alpha S + \tfrac{1-\alpha}{n}J$ with $0 < \alpha < 1$. Which statements are true? Select all that apply.'
  choices: ['Every column of $G$ adds to 1', 'Every entry of $G$ is positive', '$G$ has exactly one steady-state vector', '$G$ is symmetric', 'A page''s PageRank equals its number of incoming links']
  answer: [0, 1, 2]
  explanation: |-
    Each column of $G$ adds to $\alpha \cdot 1 + n\cdot\tfrac{1-\alpha}{n} = 1$, and the $\tfrac{1-\alpha}{n}$ term makes every entry positive, so $G$ is regular with a unique steady state. $G$ is usually not symmetric (page A can link to B without B linking back), and PageRank weighs links by the importance of the linking page rather than counting them.

- id: la-h1-r2-h25
  lesson: la-h1-pagerank
  type: order
  topic: PageRank and the power method
  stem: 'Put the steps of one PageRank computation by the power method in order.'
  items:
    - 'Start from the uniform vector $\mathbf{x}_0 = (\tfrac1n, \dots, \tfrac1n)$'
    - 'Multiply the current vector by the sparse link matrix $S$'
    - 'Multiply by $\alpha$ and add $\tfrac{1-\alpha}{n}$ to every entry'
    - 'Compare the new vector with the previous one'
    - 'Stop once the change is below the tolerance'
  explanation: |-
    Each step computes $G\mathbf{x}_k = \alpha S\mathbf{x}_k + \tfrac{1-\alpha}{n}(1, \dots, 1)$: first the sparse product, then the scaling and the constant. Only then can the new vector be compared with the old one to decide whether to stop.

- id: la-h1-r2-h26
  lesson: la-h1-pagerank
  type: match
  module_quiz: true
  topic: PageRank and the power method
  stem: 'Match each term with its meaning.'
  pairs:
    - ['Dangling node', 'A page with no outgoing links']
    - ['Damping factor $\alpha$', 'Probability the surfer follows a link']
    - ['Dominant eigenvalue', 'The eigenvalue largest in absolute value']
    - ['PageRank vector', 'Steady-state vector of the Google matrix']
  distractors: ['A page that no other page links to']
  explanation: |-
    A dangling node has no outgoing links, so its column of $S$ would be zero (a page with no incoming links is a different thing, like page D in the lesson). With probability $\alpha$ the surfer follows a link and with $1 - \alpha$ jumps at random. The power method finds the dominant eigenvector, and for $G$ that is the PageRank vector, its steady state.

- id: la-h1-r2-h27
  lesson: la-h1-pagerank
  topic: PageRank and the power method
  stem: 'In the lesson''s four-page web with $\alpha = 0.85$, page D gets PageRank $0.0375$. Why exactly that number?'
  choices: ['No page links to D, so it only receives random jumps: $\tfrac{0.15}{4} = 0.0375$', 'D has two outgoing links, so it keeps half of $0.075$', 'D is a dangling page, so it gets $\tfrac14$ of the damping factor', 'D links to A and C, which pass back $0.85 \times 0.044$']
  answer: 0
  explanation: |-
    Row D of $S$ is zero, so $(G\mathbf{x})_D = 0.85 \cdot 0 + \tfrac{0.15}{4} = 0.0375$ for every probability vector $\mathbf{x}$. D is not dangling (it links to A and C), and its outgoing links affect the scores of A and C, not its own.

- id: la-h1-r2-h28
  lesson: la-h1-pagerank
  type: text
  topic: PageRank and the power method
  stem: 'A page with no outgoing links, whose column in the link matrix is replaced by $\tfrac1n$ in every entry, is called a ___ node.'
  accept: [dangling]
  explanation: |-
    A dangling node would leak probability (its column of $S$ is zero), so the standard fix sends the surfer to a random page.

# --- Lesson 92: principal component analysis ---
- id: la-h1-r2-h29
  lesson: la-h1-pca
  module_quiz: true
  topic: Principal component analysis
  stem: 'Three individuals have deviations from the mean $B = \begin{bmatrix} -2 & 0 & 2 \\ -1 & -1 & 2\end{bmatrix}$. What is the sample covariance matrix $S$?'
  choices: ['$\begin{bmatrix} 8 & 6 \\ 6 & 6\end{bmatrix}$', '$\begin{bmatrix} 4 & 3 \\ 3 & 3\end{bmatrix}$', '$\begin{bmatrix} \tfrac83 & 2 \\ 2 & 2\end{bmatrix}$', '$\begin{bmatrix} 4 & -3 \\ -3 & 3\end{bmatrix}$']
  answer: 1
  explanation: |-
    $BB^T = \begin{bmatrix} 4 + 0 + 4 & 2 + 0 + 4 \\ 6 & 1 + 1 + 4\end{bmatrix} = \begin{bmatrix} 8 & 6 \\ 6 & 6\end{bmatrix}$, and $S = \tfrac{1}{N-1}BB^T = \tfrac12BB^T$. Not dividing gives the first matrix; dividing by $N = 3$ gives the third. The covariance is positive: the two variables rise together.

- id: la-h1-r2-h30
  lesson: la-h1-pca
  module_quiz: true
  topic: Principal component analysis
  stem: 'A covariance matrix is $S = \begin{bmatrix} 3 & 2 \\ 2 & 3\end{bmatrix}$. What fraction of the total variance does the first principal component explain?'
  choices: ['$\tfrac16$', '$\tfrac12$', '$\tfrac53$', '$\tfrac56$']
  answer: 3
  explanation: |-
    Eigenvalues: trace 6, determinant 5, so $\lambda = 5$ and $1$. The total variance is the trace, 6, and the first component carries $\lambda_1 = 5$ of it: $\tfrac56$. $\tfrac16$ is the second component's share, $\tfrac12$ is one variable's share of the trace, and $\tfrac53$ divides by a single variance.

- id: la-h1-r2-h31
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'For the covariance matrix $S = \begin{bmatrix} 3 & 2 \\ 2 & 3\end{bmatrix}$, what is the first principal component?'
  choices: ['$\tfrac{1}{\sqrt2}(1, -1)$', '$\tfrac{1}{\sqrt{13}}(3, 2)$', '$\tfrac{1}{\sqrt2}(1, 1)$', '$(1, 0)$']
  answer: 2
  explanation: |-
    $S(1, 1) = (5, 5)$, so $(1, 1)$ is an eigenvector for the largest eigenvalue 5; as a unit vector, $\tfrac{1}{\sqrt2}(1, 1)$. $(1, -1)$ is the eigenvector for 1 (the second component). $(3, 2)$ is just the first column of $S$.

- id: la-h1-r2-h32
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'For centered data with covariance matrix $S$, what is the variance of the scores along a unit vector $\mathbf{u}$?'
  choices: ['$S\mathbf{u}$', '$\mathbf{u}^TS\mathbf{u}$', '$\|S\mathbf{u}\|$', '$\mathbf{u}^T\mathbf{u}$']
  answer: 1
  explanation: |-
    The scores are the entries of $B^T\mathbf{u}$, and their variance is $\tfrac{1}{N-1}\|B^T\mathbf{u}\|^2 = \mathbf{u}^T\left(\tfrac{1}{N-1}BB^T\right)\mathbf{u} = \mathbf{u}^TS\mathbf{u}$, a quadratic form. $S\mathbf{u}$ is a vector, not a number, and $\mathbf{u}^T\mathbf{u} = 1$ for every unit vector.

- id: la-h1-r2-h33
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'The mean-deviation matrix $B$ of $N$ individuals has singular values $\sigma_i$. What are the eigenvalues $\lambda_i$ of the covariance matrix $S = \tfrac{1}{N-1}BB^T$?'
  choices: ['$\lambda_i = \sigma_i$', '$\lambda_i = \sigma_i^2$', '$\lambda_i = \dfrac{\sigma_i}{N-1}$', '$\lambda_i = \dfrac{\sigma_i^2}{N-1}$']
  answer: 3
  explanation: |-
    With $B = U\Sigma V^T$, $BB^T = U\Sigma\Sigma^TU^T$, whose eigenvalues are the $\sigma_i^2$. Dividing by $N - 1$ gives $\lambda_i = \sigma_i^2/(N-1)$, and the principal components are the left singular vectors $\mathbf{u}_i$.

- id: la-h1-r2-h34
  lesson: la-h1-pca
  module_quiz: true
  topic: Principal component analysis
  stem: 'The line through the mean in the direction of the first principal component minimizes which quantity over all lines through the mean?'
  choices: ['The sum of squared perpendicular distances from the points to the line', 'The sum of squared vertical distances from the points to the line', 'The sum of squared horizontal distances from the points to the line', 'The largest distance from a point to the line']
  answer: 0
  explanation: |-
    Each squared deviation length splits into (squared score along the line) + (squared perpendicular distance), and the total is fixed. Maximizing the variance along the line therefore minimizes the perpendicular distances. Vertical distances are what the least-squares regression line minimizes, which is why the two lines usually differ.

- id: la-h1-r2-h35
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'Two variables have variances 100 and 1 and covariance 6. What is the off-diagonal entry of their correlation matrix?'
  choices: ['$0.06$', '$6$', '$0.6$', '$0.36$']
  answer: 2
  explanation: |-
    Standardizing divides each variable by its standard deviation (10 and 1), so the covariance becomes $\tfrac{6}{10 \cdot 1} = 0.6$. Dividing by the variance 100 gives 0.06, and 0.36 is $0.6^2$.

- id: la-h1-r2-h36
  lesson: la-h1-pca
  module_quiz: true
  topic: Principal component analysis
  stem: 'Data on 11 individuals have covariance eigenvalues 6, 3 and 1. If each deviation is replaced by its projection onto the first two principal components, what is the total of the squared lengths of the parts that are lost?'
  choices: ['$1$', '$11$', '$90$', '$10$']
  answer: 3
  explanation: |-
    The lost part of each deviation is its component along $\mathbf{u}_3$, and the squared scores along $\mathbf{u}_3$ add to $(N - 1)\lambda_3 = 10 \times 1 = 10$. The answer 1 forgets the factor $N - 1$; 90 is $(N - 1)(\lambda_1 + \lambda_2)$, the part that is kept.

- id: la-h1-r2-h37
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'A data set records height in centimeters and income in dollars. Why should each variable be standardized before PCA?'
  choices: ['Otherwise the variable with the largest numbers dominates the first component', 'Otherwise the covariance matrix is not symmetric', 'Otherwise the eigenvalues can be negative', 'Otherwise the data cannot be centered']
  answer: 0
  explanation: |-
    Variances depend on units: incomes in dollars vary by thousands while heights vary by a few centimeters, so the first component would just point along income. Dividing each variable by its standard deviation puts them on equal footing (PCA on the correlation matrix). $S$ is symmetric and positive semidefinite either way.

- id: la-h1-r2-h38
  lesson: la-h1-pca
  type: text
  topic: Principal component analysis
  stem: 'A covariance matrix has eigenvalues 9, 4, 2 and 1. The first two principal components explain ___% of the total variance. (Give the number to 2 decimal places.)'
  accept: ['81.25', '81.25%']
  explanation: |-
    Total variance = $9 + 4 + 2 + 1 = 16$. The first two components carry $9 + 4 = 13$: $13/16 = 0.8125 = 81.25\%$.

- id: la-h1-r2-h39
  lesson: la-h1-pca
  type: label
  topic: Principal component analysis
  stem: 'The picture shows a cloud of data with its principal component directions drawn from the center. Name each numbered part.'
  image: {src: images/la-h1-pca-blank.svg, alt: 'A cloud of data points inside a tilted ellipse. Two arrows start at a dot in the middle: a long one along the length of the cloud and a short one across it. One highlighted point is joined by a dashed line to a hollow point on the long arrow. Five parts are numbered.'}
  labels:
    - {x: 47.1, y: 56.2, text: 'Mean of the data'}
    - {x: 76.2, y: 33.8, text: 'First principal component'}
    - {x: 41.1, y: 39.7, text: 'Second principal component'}
    - {x: 69.5, y: 55.4, text: 'A data point'}
    - {x: 64.8, y: 42.6, text: 'Projection onto the first component'}
  distractors: ['Origin of the coordinates', 'Covariance matrix']
  explanation: |-
    The components are drawn from the mean (the center of the cloud), since PCA works with deviations from the mean. The long arrow points along the direction of greatest variance, the first component; the short perpendicular arrow is the second. The dashed segment drops from a data point perpendicular to the first component, and its foot is the projection, whose signed distance from the mean is the point's score.

- id: la-h1-r2-h40
  lesson: la-h1-pca
  topic: Principal component analysis
  stem: 'Which statements are true of every sample covariance matrix $S = \tfrac{1}{N-1}BB^T$? Select all that apply.'
  choices: ['$S$ is symmetric', '$S$ is positive semidefinite', 'The trace of $S$ is the total variance', 'Every entry of $S$ is nonnegative', '$S$ is invertible']
  answer: [0, 1, 2]
  explanation: |-
    $(BB^T)^T = BB^T$; $\mathbf{u}^TS\mathbf{u} = \tfrac{1}{N-1}\|B^T\mathbf{u}\|^2 \ge 0$; and the diagonal holds the variances, whose sum is the total variance. Covariances (off-diagonal entries) can be negative, and $S$ is singular whenever the data lie in a lower-dimensional subspace, for example with fewer individuals than variables.

- id: la-h1-r2-h41
  lesson: la-h1-pca
  type: order
  topic: Principal component analysis
  stem: 'Put the steps of principal component analysis in order.'
  items:
    - 'Arrange the data with one column per individual'
    - 'Subtract the mean from every column'
    - 'Form $S = BB^T/(N - 1)$'
    - 'Find the eigenvalues and unit eigenvectors of $S$'
    - 'Project each deviation onto the leading eigenvectors'
  explanation: |-
    The mean is computed from the arranged data and subtracted to get $B$; the covariance matrix needs $B$; its eigenvectors are the components; and the scores are projections onto them.

- id: la-h1-r2-h42
  lesson: la-h1-pca
  type: match
  module_quiz: true
  topic: Principal component analysis
  stem: 'Match each term with its meaning.'
  pairs:
    - ['Mean-deviation form', 'Data with the mean subtracted from each column']
    - ['Total variance', 'Trace of the covariance matrix']
    - ['Principal components', 'Unit eigenvectors of the covariance matrix']
    - ['Scores', 'Projections of the deviations onto a component']
  distractors: ['Largest entry of the covariance matrix']
  explanation: |-
    Centering gives $B$; the total variance is the sum of the variances, the trace of $S$ (and the sum of its eigenvalues); the principal components are the orthonormal eigenvectors of $S$; and an individual's score along $\mathbf{u}$ is $\mathbf{u}^T(\mathbf{x} - \mathbf{m})$.

# --- Lesson 93: trilateration, least squares and GPS ---
- id: la-h1-r2-h43
  lesson: la-h1-gps
  module_quiz: true
  topic: Positioning from distances
  stem: 'Why does trilateration subtract the first circle equation $\|\mathbf{x} - \mathbf{p}_1\|^2 = r_1^2$ from the others?'
  choices: ['To remove the measurement errors', 'To make every distance positive', 'To find the beacons'' positions', 'To cancel the quadratic term $\mathbf{x}\cdot\mathbf{x}$, leaving linear equations']
  answer: 3
  explanation: |-
    Every equation expands to $\mathbf{x}\cdot\mathbf{x} - 2\mathbf{p}_i\cdot\mathbf{x} + \mathbf{p}_i\cdot\mathbf{p}_i = r_i^2$, with the same $\mathbf{x}\cdot\mathbf{x}$. Subtracting cancels it, and what remains is linear in $\mathbf{x}$. Errors are not removed (that is the job of least squares), and the beacon positions are known from the start.

- id: la-h1-r2-h44
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'Beacons sit at $(0, 0)$ and $(6, 0)$, and your squared distances to them are $r_1^2 = 13$ and $r_2^2 = 25$. What is your $x$-coordinate?'
  choices: ['$x = 3$', '$x = 2$', '$x = -1$', '$x = 4$']
  answer: 1
  explanation: |-
    Subtracting: $2(6, 0)\cdot\mathbf{x} = 13 - 25 + 36$, so $12x = 24$ and $x = 2$. Check: $y^2 = 13 - 4 = 9$, and $(2 - 6)^2 + 9 = 25$. (Two beacons leave $y = \pm 3$ undecided; a third beacon off the line would settle it.)

- id: la-h1-r2-h45
  lesson: la-h1-gps
  module_quiz: true
  topic: Positioning from distances
  stem: 'Why does a GPS receiver need signals from at least four satellites for a position in space?'
  choices: ['Three for the coordinates and one spare to check the answer', 'Each satellite only measures one coordinate, plus one for the time of day', 'Its own clock offset is a fourth unknown alongside $x$, $y$ and $z$', 'Two satellites are needed per coordinate pair']
  answer: 2
  explanation: |-
    The pseudorange $\rho_i = \|\mathbf{x} - \mathbf{s}_i\| + cb$ involves the unknown clock offset $b$ as well as the three coordinates. Four unknowns need at least four equations. Each satellite gives a whole distance, not one coordinate.

- id: la-h1-r2-h46
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'Light travels about 300 m per microsecond. If a receiver''s clock were off by 2 microseconds and nothing corrected it, about how large would the distance errors be?'
  choices: ['About 600 m', 'About 300 m', 'About 6 m', 'About 60 km']
  answer: 0
  explanation: |-
    $2\ \mu\text{s} \times 300\ \text{m}/\mu\text{s} = 600$ m. This is why the clock offset is solved for as an unknown instead of trusted.

- id: la-h1-r2-h47
  lesson: la-h1-gps
  module_quiz: true
  topic: Positioning from distances
  stem: 'In the plane, two beacons have perpendicular lines of sight from the receiver. What is the dilution of precision $\sqrt{\operatorname{tr}((J^TJ)^{-1})}$?'
  choices: ['$1$', '$\sqrt2 \approx 1.41$', '$2$', '$0.5$']
  answer: 1
  explanation: |-
    The rows of $J$ are perpendicular unit vectors, so $J^TJ = I$ and $\operatorname{tr}(I^{-1}) = 2$; the DOP is $\sqrt2$. In general it is $\sqrt2/\sin\theta$, smallest at $\theta = 90^\circ$. Forgetting the square root gives 2.

- id: la-h1-r2-h48
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'Why do satellites bunched in one part of the sky give a poor position?'
  choices: ['Their signals interfere with each other', 'They are farther away from the receiver', 'The rows of $J$ are nearly parallel, so $J^TJ$ is nearly singular and $(J^TJ)^{-1}$ is large', 'Their clocks disagree more']
  answer: 2
  explanation: |-
    Nearly equal line-of-sight vectors make $J$ nearly rank-deficient. Then $(J^TJ)^{-1}$, which sets the size of the position errors, has large entries: a large DOP. It is a geometric, ill-conditioning problem, not a signal or clock problem.

- id: la-h1-r2-h49
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'When a GPS receiver linearizes the pseudorange equations at a guess $\mathbf{x}_0$, what is row $i$ of the matrix $J$ (unknowns: position correction, then $c$ times the clock correction)?'
  choices: ['$[\,\mathbf{s}_i^T\ \ 1\,]$, the satellite position and a 1', '$[\,\mathbf{x}_0^T\ \ 1\,]$, the guess and a 1', '$[\,\mathbf{e}_i^T\ \ 0\,]$, the unit line-of-sight vector and a 0', '$[\,\mathbf{e}_i^T\ \ 1\,]$, the unit line-of-sight vector and a 1']
  answer: 3
  explanation: |-
    A small move $\boldsymbol{\delta}$ changes the distance by about $\mathbf{e}_i\cdot\boldsymbol{\delta}$, with $\mathbf{e}_i = (\mathbf{x}_0 - \mathbf{s}_i)/\|\mathbf{x}_0 - \mathbf{s}_i\|$, and a clock correction adds $c\,\Delta b$ to every pseudorange with coefficient 1. A 0 would ignore the clock.

- id: la-h1-r2-h50
  lesson: la-h1-gps
  module_quiz: true
  topic: Positioning from distances
  stem: 'After subtracting equations, four beacons give $x = 3$, $y = 4$ and $x + y = 7.3$. What is the least-squares estimate of $(x, y)$?'
  choices: ['$(3.1, 4.1)$', '$(3, 4)$', '$(3.3, 4.3)$', '$(3.65, 3.65)$']
  answer: 0
  explanation: |-
    $M = \begin{bmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1\end{bmatrix}$, $M^TM = \begin{bmatrix} 2 & 1 \\ 1 & 2\end{bmatrix}$, $M^T\mathbf{c} = (10.3, 11.3)$. So $\hat x = \tfrac{2(10.3) - 11.3}{3} = 3.1$ and $\hat y = \tfrac{2(11.3) - 10.3}{3} = 4.1$. The mismatch of 0.3 is shared out: each equation is off by 0.1. $(3, 4)$ ignores the third equation.

- id: la-h1-r2-h51
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'Three beacons in the plane all lie on one straight line. Why can''t they fix your position?'
  choices: ['Three distances are never enough in the plane', 'The circles never intersect', 'Your reflection across that line has the same distances to all three beacons', 'The linear equations become nonlinear']
  answer: 2
  explanation: |-
    Reflecting across the line keeps every distance to a point on the line, so two positions fit equally well. In the linear equations, the vectors $\mathbf{p}_i - \mathbf{p}_1$ are parallel, so the two equations cannot pin down both coordinates.

- id: la-h1-r2-h52
  lesson: la-h1-gps
  type: text
  topic: Positioning from distances
  stem: 'A GPS distance computed from signal travel time, which still includes the error of the receiver''s clock, is called a ___.'
  accept: [pseudorange, pseudoranges, pseudo-range, pseudo range]
  explanation: |-
    The pseudorange is $\rho_i = \|\mathbf{x} - \mathbf{s}_i\| + cb$: the true distance plus the speed of light times the clock offset.

- id: la-h1-r2-h53
  lesson: la-h1-gps
  type: label
  topic: Positioning from distances
  stem: 'The picture compares two satellite arrangements seen from a receiver. Name each numbered part.'
  image: {src: images/la-h1-gps-blank.svg, alt: 'Two panels, each with a receiver on the curved surface of the Earth and four satellites joined to it by dashed lines. In the left panel the satellites are scattered across the sky; in the right panel they are bunched almost straight overhead. Four parts are numbered.'}
  labels:
    - {x: 25.0, y: 79.5, text: 'Receiver (unknown position)'}
    - {x: 11.7, y: 30.1, text: 'Satellite (known position)'}
    - {x: 32.0, y: 53.8, text: 'Measured range'}
    - {x: 74.3, y: 11.8, text: 'Clustered satellites: large DOP'}
  distractors: ['Clock offset', 'Center of the Earth']
  explanation: |-
    The receiver sits on the ground and its position is the unknown; each satellite broadcasts its known position; the dashed line is the measured range. The right-hand group, bunched in one direction, gives nearly parallel rows of $J$ and a large dilution of precision. A clock offset has no place in a picture; it is a number.

- id: la-h1-r2-h54
  lesson: la-h1-gps
  topic: Positioning from distances
  stem: 'Which of these make a GPS position estimate more reliable? Select all that apply.'
  choices: ['Satellites spread widely across the sky', 'Using more than four satellites and least squares', 'Solving for the receiver''s clock offset', 'Choosing satellites that all lie in nearly the same direction', 'Solving the linearized equations once, without repeating']
  answer: [0, 1, 2]
  explanation: |-
    Spread-out directions give a small DOP; extra measurements average out errors through least squares; and solving for the clock offset removes the largest error source. Bunched satellites give a large DOP, and a single linearized step is only accurate near the starting guess, so the receiver repeats it.

- id: la-h1-r2-h55
  lesson: la-h1-gps
  type: order
  topic: Positioning from distances
  stem: 'Put one round of the Gauss–Newton method in a GPS receiver in order.'
  items:
    - 'Guess the position and clock offset'
    - 'Predict the pseudorange to each satellite from the guess'
    - 'Subtract the predicted pseudoranges from the measured ones'
    - 'Solve the linear least-squares problem for the correction'
    - 'Add the correction to the guess'
  explanation: |-
    Predictions need a guess; the mismatches need the predictions; the least-squares correction is computed from the mismatches; and the updated guess starts the next round.

- id: la-h1-r2-h56
  lesson: la-h1-gps
  type: match
  module_quiz: true
  topic: Positioning from distances
  stem: 'Match each term with its meaning.'
  pairs:
    - ['Trilateration', 'Finding a position from distances to known points']
    - ['Pseudorange', 'Range that includes the receiver clock error']
    - ['Dilution of precision', 'How much the geometry magnifies range errors']
    - ['Gauss–Newton method', 'Repeated linearize-and-least-squares updates']
  distractors: ['Distance measured along the ground']
  explanation: |-
    Trilateration uses distances (not angles). The pseudorange is $\|\mathbf{x} - \mathbf{s}_i\| + cb$. DOP is $\sqrt{\operatorname{tr}((J^TJ)^{-1})}$. Gauss–Newton fits a nonlinear model by solving a linear least-squares problem at each step.
