# Round 2 questions: la-m2 (systems of linear equations)

# ---------- Lesson 04: linear systems and row operations ----------
- id: la-m2-r2-q01
  lesson: la-systems
  module_quiz: true
  topic: Linear systems
  type: text
  stem: 'A linear system has 5 equations in 3 unknowns. Its augmented matrix has ___ rows and ___ columns.'
  accept:
    - ['5', five]
    - ['4', four]
  explanation: |-
    One row per equation gives 5 rows. One column per unknown (3) plus one column for the right-hand sides gives 4 columns, so the augmented matrix is $5 \times 4$. (The coefficient matrix alone is $5 \times 3$.)

- id: la-m2-r2-q02
  lesson: la-systems
  topic: Row operations
  type: order
  stem: 'Put the steps for solving a $3 \times 3$ system by row operations and back-substitution in order.'
  items:
    - 'Write the augmented matrix'
    - 'Use row 1 to create zeros below the pivot in column 1'
    - 'Use row 2 to create a zero below the pivot in column 2'
    - 'Solve the last row for $x_3$'
    - 'Substitute into row 2 to find $x_2$'
    - 'Substitute into row 1 to find $x_1$'
  explanation: |-
    The matrix comes first. Column 1 is cleared before column 2 (clearing column 2 first would be undone when row 1 is used later). Once the matrix is triangular, back-substitution starts at the bottom: row 3 has only $x_3$, row 2 then has only $x_2$ unknown, and row 1 is last because it needs both $x_2$ and $x_3$.

- id: la-m2-r2-q03
  lesson: la-systems
  topic: Row operations
  type: match
  stem: 'Match each row operation with the operation that undoes it.'
  pairs:
    - ['$R_2 \leftarrow R_2 - 3R_1$', 'Add 3 times row 1 to row 2']
    - ['$R_1 \leftrightarrow R_3$', 'Swap rows 1 and 3 again']
    - ['$R_2 \leftarrow 5R_2$', 'Multiply row 2 by 1/5']
  distractors: ['Multiply row 2 by -5', 'Subtract 3 times row 2 from row 1']
  explanation: |-
    A replacement is undone by adding back the same multiple of the same row: $R_2 \leftarrow R_2 + 3R_1$. A swap is undone by the same swap. Scaling by 5 is undone by scaling by $\tfrac15$. Every elementary row operation can be undone this way, which is why row-equivalent systems have the same solutions.

- id: la-m2-r2-q04
  lesson: la-systems
  topic: Row operations
  stem: 'Which of these are elementary row operations? Select all that apply.'
  choices: ['$R_2 \leftarrow R_2 + 4R_1$', '$R_1 \leftrightarrow R_2$', '$R_3 \leftarrow -2R_3$', '$R_2 \leftarrow 0R_2$', '$R_1 \leftarrow R_1 + 1$ (add 1 to every entry)']
  answer: [0, 1, 2]
  explanation: |-
    Replacement (add a multiple of another row), interchange and scaling by a nonzero constant are the three elementary row operations; $-2$ is nonzero, so $R_3 \leftarrow -2R_3$ counts.
    Scaling by 0 wipes out the equation and cannot be undone. Adding 1 to every entry is not a row operation at all: it changes the equation $x_1 + x_2 = 3$ into $2x_1 + 2x_2 = 4$, which has different solutions.

- id: la-m2-r2-q05
  lesson: la-systems
  module_quiz: true
  topic: Linear systems
  type: label
  stem: 'Each panel shows three planes edge-on, so each plane looks like a line. Name each numbered arrangement.'
  image: {src: images/la-m2-planes-blank.svg, alt: 'Four numbered panels, each with three colored lines. Panel 1: three lines through one point. Panel 2: three lines forming a triangle. Panel 3: two parallel lines crossed by a third line. Panel 4: three parallel lines.'}
  labels:
    - {x: 25.7, y: 46.1, text: 'Three planes through one line'}
    - {x: 74.3, y: 46.1, text: 'Tent: planes meet in pairs only'}
    - {x: 25.7, y: 91.6, text: 'Two parallel planes and a third'}
    - {x: 74.3, y: 91.6, text: 'Three parallel planes'}
  distractors: ['Three planes through one point only', 'Three copies of the same plane']
  explanation: |-
    Seen edge-on, a plane is a line. Panel 1: all three lines pass through one point, which is a line seen end-on that lies in all three planes, so there are infinitely many solutions. Panel 2: each pair crosses, but no point is on all three (a tent), so there is no solution. Panel 3: two lines never meet (parallel planes), so there is no solution. Panel 4: all three are parallel, so no solution.
    Three planes meeting in a single point cannot be drawn this way, since they do not share a common direction; three copies of one plane would look like a single line.

# ---------- Lesson 05: row reduction and echelon forms ----------
- id: la-m2-r2-q06
  lesson: la-row-reduction
  module_quiz: true
  topic: Echelon forms
  type: label
  stem: 'This echelon pattern ($\blacksquare$ = nonzero, $*$ = any number) has five numbered parts. Name each one.'
  image: {src: images/la-m2-echelon-blank.svg, alt: 'A 4 by 5 echelon pattern with column headings. Nonzero leading entries are circled in row 1 column 1, row 2 column 3 and row 3 column 4; columns 1, 3 and 4 are shaded. A dashed staircase separates zeros below it; row 4 is all zeros. Marker 1 is on the circled entry in row 2, marker 2 above column 4, marker 3 above column 2, marker 4 beside row 4, and marker 5 on the 0 in row 2, column 1.'}
  labels:
    - {x: 45.4, y: 46.9, text: 'Pivot position'}
    - {x: 54.6, y: 13.8, text: 'Pivot column'}
    - {x: 36.2, y: 13.8, text: 'Column with no pivot'}
    - {x: 76.3, y: 74.5, text: 'Row of zeros'}
    - {x: 27.0, y: 46.9, text: 'Zero below a leading entry'}
  distractors: ['Augmented column', 'Main diagonal entry']
  explanation: |-
    The circled leading entries are the pivot positions (marker 1 is the one in row 2, column 3). Columns 1, 3 and 4 contain pivots, so column 4 (marker 2) is a pivot column, while column 2 (marker 3) has no pivot: the staircase skips it. Row 4 (marker 4) is the zero row, which must sit at the bottom. Marker 5 is one of the zeros required below the leading entry in column 1. Nothing in the pattern says which column is an augmented column, and the second pivot is not on the main diagonal.

- id: la-m2-r2-q07
  lesson: la-row-reduction
  topic: Row reduction
  type: order
  stem: 'Put the steps of the row reduction algorithm in order.'
  items:
    - 'Take the leftmost nonzero column as the pivot column'
    - 'Swap rows if needed to put a nonzero pivot at the top'
    - 'Create zeros below the pivot'
    - 'Cover the pivot row and repeat on the rows below until none are left'
    - 'Starting with the rightmost pivot, create zeros above each pivot and scale it to 1'
  explanation: |-
    The forward phase (Gaussian elimination) finds a pivot column, puts a nonzero pivot on top, clears below it and repeats on the remaining rows, producing an echelon form. Only then does the backward phase work from the rightmost pivot up, clearing above pivots and scaling them to 1, giving the reduced echelon form.

- id: la-m2-r2-q08
  lesson: la-row-reduction
  topic: Row reduction
  type: text
  stem: 'The reduced echelon form of $A$ is $\begin{bmatrix} 1 & 0 & 4 & 0 \\ 0 & 1 & -2 & 0 \\ 0 & 0 & 0 & 1\end{bmatrix}$. List the pivot columns of $A$ in increasing order: columns ___, ___ and ___.'
  accept:
    - ['1']
    - ['2']
    - ['4']
  explanation: |-
    The leading 1s are in columns 1, 2 and 4, so those are the pivot columns (of $A$ as well as of its RREF). Column 3 has no leading 1; its entries 4 and $-2$ sit in rows that already have their leading entries further left.

- id: la-m2-r2-q09
  lesson: la-row-reduction
  module_quiz: true
  topic: Echelon forms
  stem: 'Which matrices are in reduced echelon form? Select all that apply.'
  choices: ['$\begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & -1\end{bmatrix}$', '$\begin{bmatrix} 1 & 3 & 0 \\ 0 & 0 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 2 & 1 \\ 0 & 1 & 3\end{bmatrix}$', '$\begin{bmatrix} 0 & 1 & 0 \\ 1 & 0 & 0\end{bmatrix}$', '$\begin{bmatrix} 1 & 0 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 1\end{bmatrix}$']
  answer: [0, 1]
  explanation: |-
    The first two have leading 1s that step to the right, with zeros above and below each one (a non-pivot column like the 3 in column 2 is allowed).
    $\begin{bmatrix} 1 & 2 & 1 \\ 0 & 1 & 3\end{bmatrix}$ is in echelon form but has a 2 above the leading 1 of row 2. $\begin{bmatrix} 0 & 1 & 0 \\ 1 & 0 & 0\end{bmatrix}$ has its second leading entry to the left of the first. The $3 \times 3$ matrix has a zero row above a nonzero row.

- id: la-m2-r2-q10
  lesson: la-row-reduction
  topic: Echelon forms
  type: match
  stem: 'Classify each matrix.'
  pairs:
    - ['$\begin{bmatrix} 1 & 4 & 0 \\ 0 & 0 & 1\end{bmatrix}$', 'Reduced echelon form']
    - ['$\begin{bmatrix} 2 & 4 & 1 \\ 0 & 3 & 5\end{bmatrix}$', 'Echelon form but not reduced']
    - ['$\begin{bmatrix} 0 & 0 & 1 \\ 1 & 2 & 0\end{bmatrix}$', 'Not in echelon form']
    - ['$\begin{bmatrix} 0 & 1 & -3 \\ 0 & 0 & 0\end{bmatrix}$', 'Reduced echelon form']
  explanation: |-
    $\begin{bmatrix} 1 & 4 & 0 \\ 0 & 0 & 1\end{bmatrix}$: leading 1s in columns 1 and 3, each alone in its column. $\begin{bmatrix} 0 & 1 & -3 \\ 0 & 0 & 0\end{bmatrix}$: one leading 1 (column 2), zero row at the bottom; a matrix may start with a zero column.
    $\begin{bmatrix} 2 & 4 & 1 \\ 0 & 3 & 5\end{bmatrix}$ has a staircase, but its leading entries are 2 and 3, not 1, and there is a 4 above the second one.
    $\begin{bmatrix} 0 & 0 & 1 \\ 1 & 2 & 0\end{bmatrix}$ has row 2's leading entry to the left of row 1's, so it isn't in echelon form (a swap would fix it).

# ---------- Lesson 06: existence, uniqueness and the general solution ----------
- id: la-m2-r2-q11
  lesson: la-solutions
  module_quiz: true
  topic: General solution
  type: text
  stem: 'A system''s augmented matrix reduces to $\left[\begin{array}{ccc|c} 1 & 0 & 2 & 5 \\ 0 & 1 & -1 & 3\end{array}\right]$. For the solution with $x_3 = 2$, $x_1 =$ ___ and $x_2 =$ ___.'
  accept:
    - ['1']
    - ['5']
  explanation: |-
    $x_3$ is free. Row 1: $x_1 + 2x_3 = 5$, so $x_1 = 5 - 2x_3 = 5 - 4 = 1$. Row 2: $x_2 - x_3 = 3$, so $x_2 = 3 + x_3 = 5$. Check row 2: $5 - 2 = 3$. ✓

- id: la-m2-r2-q12
  lesson: la-solutions
  topic: Existence and uniqueness
  type: match
  stem: 'Each matrix is an echelon form of an augmented matrix. Match it with the number of solutions of its system.'
  pairs:
    - ['$\left[\begin{array}{cc|c} 1 & 2 & 3 \\ 0 & 1 & 4\end{array}\right]$', 'Exactly one solution']
    - ['$\left[\begin{array}{cc|c} 1 & 2 & 3 \\ 0 & 0 & 4\end{array}\right]$', 'No solution']
    - ['$\left[\begin{array}{ccc|c} 1 & 2 & 0 & 3 \\ 0 & 0 & 1 & 4\end{array}\right]$', 'Infinitely many solutions']
    - ['$\left[\begin{array}{cc|c} 1 & 2 & 3 \\ 0 & 0 & 0\end{array}\right]$', 'Infinitely many solutions']
    - ['$\left[\begin{array}{ccc|c} 1 & 0 & 2 & 3 \\ 0 & 1 & 1 & 4 \\ 0 & 0 & 0 & 5\end{array}\right]$', 'No solution']
  explanation: |-
    First look for a pivot in the last column (a row $[\,0 \;\cdots\; 0 \;\; b\,]$ with $b \ne 0$): the second and fifth matrices have one, so they have no solution, even though the fifth also has a non-pivot column.
    The others are consistent. The first has a pivot in both variable columns, so exactly one solution. The third ($x_2$ free) and fourth ($x_2$ free; its zero row just says $0 = 0$) have a free variable, so infinitely many.

- id: la-m2-r2-q13
  lesson: la-solutions
  topic: Existence and uniqueness
  type: order
  stem: 'Put the steps for describing all solutions of a linear system in order.'
  items:
    - 'Row-reduce the augmented matrix to an echelon form'
    - 'Check for a pivot in the last column; if there is one, stop: no solution'
    - 'Continue to the reduced echelon form'
    - 'Write the equations of the reduced system'
    - 'Solve each equation for its basic variable in terms of the free variables'
  explanation: |-
    An echelon form already answers the existence question, so check it before doing more work. If the system is consistent, finish the reduction, write the equations, and solve each one for its basic variable; that list is the general solution.

- id: la-m2-r2-q14
  lesson: la-solutions
  topic: Existence and uniqueness
  stem: 'A consistent linear system has 4 equations in 6 unknowns. Which statements must be true? Select all that apply.'
  choices: ['It has at least two free variables', 'It has infinitely many solutions', 'It has exactly one solution', 'Its coefficient matrix has a pivot in every column', 'It has at most 4 basic variables']
  answer: [0, 1, 4]
  explanation: |-
    A $4 \times 6$ coefficient matrix has at most 4 pivots (one per row), so at most 4 basic variables and at least $6 - 4 = 2$ free variables. A consistent system with a free variable has infinitely many solutions.
    "Exactly one solution" would need a pivot in all 6 columns, which 4 rows cannot provide.

- id: la-m2-r2-q15
  lesson: la-solutions
  module_quiz: true
  topic: Existence and uniqueness
  type: text
  stem: 'For which value of $h$ does the system $x_1 + 2x_2 = 3$, $3x_1 + hx_2 = 9$ have infinitely many solutions? Give only the number: $h =$ ___'
  accept: ['6', 'h = 6']
  explanation: |-
    $R_2 \leftarrow R_2 - 3R_1$ gives the row $[\,0 \;\; h - 6 \;\; 0\,]$. If $h \ne 6$, $h - 6$ is a pivot and the solution is unique. If $h = 6$, the row is all zeros, $x_2$ is free, and there are infinitely many solutions. (The right side is 0 either way, so the system is never inconsistent.)

# ---------- Lesson 07: applications ----------
- id: la-m2-r2-q16
  lesson: la-applications-systems
  module_quiz: true
  topic: Applications of linear systems
  type: label
  stem: 'Name the numbered parts of this flow network.'
  image: {src: images/la-m2-network-blank.svg, alt: 'A network of three unlabeled circles joined by arrows: one along the top from the left circle to the right circle, and one from each of them down to the bottom circle. An arrow enters the left circle from outside, and arrows leave the right and bottom circles. Marker 1 is on the left circle, marker 2 on the top arrow, marker 3 on the arrow coming in from outside, and marker 4 on the arrow leaving the right circle.'}
  labels:
    - {x: 30.3, y: 31.0, text: 'Node (junction)'}
    - {x: 50.0, y: 27.6, text: 'Branch with an unknown flow'}
    - {x: 15.8, y: 31.0, text: 'Flow entering from outside'}
    - {x: 84.2, y: 31.0, text: 'Flow leaving the network'}
  distractors: ['Free variable', 'Pivot position']
  explanation: |-
    The circles are nodes, where branches meet and flow is conserved. The arrows between nodes are branches whose flows are the unknowns. The arrow from the left edge brings flow in from outside, and the arrow at the right carries flow out. Free variables and pivot positions belong to the matrix you build later, not to the picture.

- id: la-m2-r2-q17
  lesson: la-applications-systems
  topic: Applications of linear systems
  type: text
  stem: 'In the three-node network of the lesson, 500 units enter at $A$, 300 leave at $B$ and 200 leave at $C$, with $x_1$ on $A \to B$, $x_2$ on $B \to C$ and $x_3$ on $A \to C$. If $x_2 = 50$, then $x_1 =$ ___ and $x_3 =$ ___.'
  accept:
    - ['350']
    - ['150']
  explanation: |-
    Node $B$: in = out gives $x_1 = x_2 + 300 = 350$. Node $C$: $x_2 + x_3 = 200$, so $x_3 = 150$. Check node $A$: $x_1 + x_3 = 500$. ✓

- id: la-m2-r2-q18
  lesson: la-applications-systems
  topic: Applications of linear systems
  type: order
  stem: 'Put the steps for solving an applied problem with a linear system in order.'
  items:
    - 'Identify the conservation or matching rule'
    - 'Choose the unknowns'
    - 'Write one equation per node, element or data point'
    - 'Row-reduce the augmented matrix'
    - 'Write the general solution'
    - 'Apply the real-world constraints'
  explanation: |-
    The rule tells you what to balance, the unknowns let you write it as equations, and row reduction turns the equations into a general solution. Constraints such as nonnegative flows or whole-number coefficients come last, because they pick out the meaningful solutions from the general one.

- id: la-m2-r2-q19
  lesson: la-applications-systems
  topic: Applications of linear systems
  type: match
  stem: 'Match each application with the rule that gives its equations.'
  pairs:
    - ['Traffic network', 'Flow in equals flow out at each node']
    - ['Balancing a chemical equation', 'Same number of atoms of each element on both sides']
    - ['Interpolating polynomial', 'The curve passes through each given point']
  distractors: ['Every unknown must equal zero']
  explanation: |-
    Networks use flow conservation at each node, chemistry uses conservation of atoms for each element, and interpolation uses one equation per data point. Requiring every unknown to be zero would give only the trivial answer, which is never what these problems want.

- id: la-m2-r2-q20
  lesson: la-applications-systems
  topic: Applications of linear systems
  stem: 'In the three-node network ($x_1 = 300 + x_2$, $x_3 = 200 - x_2$, $x_2$ free), no flow can be negative. Which values of $x_2$ are possible? Select all that apply.'
  choices: ['$x_2 = 0$', '$x_2 = 150$', '$x_2 = 200$', '$x_2 = 250$', '$x_2 = -20$']
  answer: [0, 1, 2]
  explanation: |-
    Need $x_2 \ge 0$, $x_1 = 300 + x_2 \ge 0$ and $x_3 = 200 - x_2 \ge 0$, so $0 \le x_2 \le 200$. That allows 0, 150 and 200. $x_2 = 250$ makes $x_3 = -50$, and $x_2 = -20$ is itself negative.

# ---------- Honors 07h1: why the reduced echelon form is unique ----------
- id: la-m2-r2-h01
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Which of these is kept by every elementary row operation?'
  choices: ['The column relations of the matrix', 'The entries of each column', 'The first row of the matrix', 'The value of each leading entry']
  answer: 0
  explanation: |-
    A column relation $c_1\mathbf{a}_1 + \cdots + c_n\mathbf{a}_n = \mathbf{0}$ is a solution of the homogeneous system with coefficient matrix $A$, and row operations never change that solution set. The entries, the first row and the leading entries' values all change (a scaling changes a leading entry; a swap changes the first row).

- id: la-m2-r2-h02
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Two students reduce the same matrix to echelon form and get different matrices. What must their echelon forms have in common?'
  choices: ['The same entries in the first row', 'The same leading entry values', 'The same pivot positions', 'The same entries above the staircase']
  answer: 2
  explanation: |-
    Both echelon forms reduce further to the one RREF, and finishing the reduction (scaling, clearing above pivots) never moves a leading entry. So the leading entries sit in the same positions. Their values and the other entries can differ, as in the lesson's example with leading entries 3, 2 in one form and 1, $-6$ in the other.

- id: la-m2-r2-h03
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  type: text
  stem: 'The RREF of $A$ is $\begin{bmatrix} 1 & 0 & 3 & -2 \\ 0 & 1 & -1 & 4 \\ 0 & 0 & 0 & 0\end{bmatrix}$. Then column 3 of $A$ equals ___ times column 1 of $A$ plus ___ times column 2 of $A$.'
  accept:
    - ['3']
    - ['-1']
  explanation: |-
    Column 3 of the RREF is $(3, -1, 0) = 3\mathbf{e}_1 - 1\mathbf{e}_2$, which is 3 times the first pivot column minus the second. Column relations are the same for $A$ and its RREF, so $\mathbf{a}_3 = 3\mathbf{a}_1 - \mathbf{a}_2$. (Likewise $\mathbf{a}_4 = -2\mathbf{a}_1 + 4\mathbf{a}_2$.)

- id: la-m2-r2-h04
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'A $3 \times 3$ matrix $A$ has $\mathbf{a}_1 = (1, 0, 2)$ and $\mathbf{a}_2 = (0, 1, 1)$, and its RREF is $\begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & -3 \\ 0 & 0 & 0\end{bmatrix}$. What is $\mathbf{a}_3$?'
  choices: ['$(2, -3, 0)$', '$(2, 3, 7)$', '$(-2, 3, -1)$', '$(2, -3, 1)$']
  answer: 3
  explanation: |-
    Column 3 of the RREF says $\mathbf{a}_3 = 2\mathbf{a}_1 - 3\mathbf{a}_2 = (2, 0, 4) - (0, 3, 3) = (2, -3, 1)$.
    $(2, -3, 0)$ is column 3 of the RREF itself, not of $A$; $(2, 3, 7)$ adds $3\mathbf{a}_2$ instead of subtracting it; $(-2, 3, -1)$ has every sign reversed.

- id: la-m2-r2-h05
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Which statements are true? Select all that apply.'
  choices: ['The number of pivots of a matrix does not depend on how it is row-reduced', 'Row-equivalent matrices have the same reduced echelon form', 'Every echelon form of a matrix has the same entries', 'Row-equivalent matrices have the same columns', 'Which variables of a system are free does not depend on the order of the row operations']
  answer: [0, 1, 4]
  explanation: |-
    Uniqueness of the RREF fixes the pivot positions, so the number of pivots and the choice of free variables are the same however you reduce. Row-equivalent matrices share their RREF.
    Echelon forms are not unique (only the reduced form is), and row operations change the columns; they keep only the relations among them.

- id: la-m2-r2-h06
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  type: order
  stem: '$R$ and $S$ are both reduced echelon forms of $A$. Put the steps of the proof that $R = S$ in order.'
  items:
    - '$R$, $S$ and $A$ are row equivalent, so they have the same column relations'
    - 'A column is a pivot column exactly when it is not a combination of earlier columns, so $R$ and $S$ have the same pivot columns'
    - 'The pivot columns of both are $\mathbf{e}_1, \mathbf{e}_2, \dots$, and each non-pivot column uses the same weights in both'
    - 'Every column of $R$ equals the matching column of $S$, so $R = S$'
  explanation: |-
    The invariant (same column relations) comes first. It decides the pivot columns; once the pivot columns match, they are the same standard columns $\mathbf{e}_k$, and the shared relations give each non-pivot column the same entries. That covers every column.

- id: la-m2-r2-h07
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  type: match
  stem: 'Each list $(c_1, c_2, c_3)$ is a column relation $c_1\mathbf{a}_1 + c_2\mathbf{a}_2 + c_3\mathbf{a}_3 = \mathbf{0}$ of some matrix. Match it with what it says about the columns.'
  pairs:
    - ['$(2, -1, -1)$', 'Column 3 = 2(column 1) − (column 2)']
    - ['$(1, 1, 0)$', 'Column 2 = −(column 1)']
    - ['$(0, 3, -1)$', 'Column 3 = 3(column 2)']
  distractors: ['Column 1 = 2(column 3)']
  explanation: |-
    $2\mathbf{a}_1 - \mathbf{a}_2 - \mathbf{a}_3 = \mathbf{0}$ rearranges to $\mathbf{a}_3 = 2\mathbf{a}_1 - \mathbf{a}_2$. $\mathbf{a}_1 + \mathbf{a}_2 = \mathbf{0}$ gives $\mathbf{a}_2 = -\mathbf{a}_1$. $3\mathbf{a}_2 - \mathbf{a}_3 = \mathbf{0}$ gives $\mathbf{a}_3 = 3\mathbf{a}_2$. None of them says $\mathbf{a}_1 = 2\mathbf{a}_3$, which would be the relation $(1, 0, -2)$.

- id: la-m2-r2-h08
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Is $A = \begin{bmatrix} 1 & 2 & 3 \\ 2 & 4 & 7\end{bmatrix}$ row equivalent to $B = \begin{bmatrix} 1 & 2 & 0 \\ 0 & 0 & 1\end{bmatrix}$?'
  choices: ['No, because their entries are different', 'Yes, because $A$ reduces to $B$, which is already in reduced echelon form', 'No, because $A$ has a pivot in column 2', 'Only if both matrices are square']
  answer: 1
  explanation: |-
    $R_2 \leftarrow R_2 - 2R_1$ gives $[\,0 \;\; 0 \;\; 1\,]$, and $R_1 \leftarrow R_1 - 3R_2$ gives $[\,1 \;\; 2 \;\; 0\,]$. So the RREF of $A$ is $B$, and they are row equivalent. Row-equivalent matrices usually have different entries; column 2 of $A$ is twice column 1, so it is not a pivot column; size, not squareness, is all that matters.

- id: la-m2-r2-h09
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  type: text
  stem: 'A $3 \times 3$ matrix has columns with $\mathbf{a}_1$ and $\mathbf{a}_2$ not multiples of each other and $\mathbf{a}_3 = 4\mathbf{a}_1 + 5\mathbf{a}_2$. Without row-reducing, column 3 of its RREF is $(\;$___, ___, $0)$.'
  accept:
    - ['4']
    - ['5']
  explanation: |-
    Columns 1 and 2 are pivot columns ($\mathbf{a}_1 \ne \mathbf{0}$, and $\mathbf{a}_2$ is not a multiple of $\mathbf{a}_1$), so in the RREF they are $\mathbf{e}_1$ and $\mathbf{e}_2$. The relation $\mathbf{a}_3 = 4\mathbf{a}_1 + 5\mathbf{a}_2$ holds in the RREF too, so column 3 is $4\mathbf{e}_1 + 5\mathbf{e}_2 = (4, 5, 0)$.

- id: la-m2-r2-h10
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'In mathematics, an invariant of a process is:'
  choices: ['A step of the process that can be undone', 'A quantity or property that the process never changes', 'The final result the process produces', 'A quantity that changes by the same amount at every step']
  answer: 1
  explanation: |-
    An invariant is something the process leaves unchanged; for row operations, the column relations (equivalently the solutions of the homogeneous system). Reversibility is a different property of row operations, and the RREF is the result, not an invariant.

- id: la-m2-r2-h11
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Which of these can an elementary row operation change?'
  choices: ['Whether column 3 equals column 1 plus column 2', 'The solution set of the homogeneous system with coefficient matrix $A$', 'Which columns are pivot columns', 'The entries of column 2']
  answer: 3
  explanation: |-
    Row operations change entries all the time; for example $R_2 \leftarrow R_2 - R_1$ changes every column whose first two entries differ. The other three are all fixed by the column relations, which no row operation can change.

- id: la-m2-r2-h12
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'The RREF of $A$ is $\begin{bmatrix} 1 & 2 & 0 & -1 \\ 0 & 0 & 1 & 3 \\ 0 & 0 & 0 & 0\end{bmatrix}$. Which statements about the columns of $A$ are true? Select all that apply.'
  choices: ['$\mathbf{a}_2 = 2\mathbf{a}_1$', '$\mathbf{a}_4 = -\mathbf{a}_1 + 3\mathbf{a}_3$', '$\mathbf{a}_3$ is a combination of $\mathbf{a}_1$ and $\mathbf{a}_2$', '$\mathbf{a}_1 \ne \mathbf{0}$', '$\mathbf{a}_4 = -\mathbf{a}_1 + 3\mathbf{a}_2$']
  answer: [0, 1, 3]
  explanation: |-
    The pivot columns are 1 and 3. Column 2 of the RREF is $2\mathbf{e}_1$, so $\mathbf{a}_2 = 2\mathbf{a}_1$. Column 4 is $-\mathbf{e}_1 + 3\mathbf{e}_2$, and $\mathbf{e}_2$ is the second pivot column, which is column 3, so $\mathbf{a}_4 = -\mathbf{a}_1 + 3\mathbf{a}_3$. Column 1 is a pivot column, so it is nonzero.
    Column 3 is a pivot column, so it is not a combination of the columns to its left. The last choice uses column 2 instead of the second pivot column.

- id: la-m2-r2-h13
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'Why is comparing echelon forms (not reduced) a poor test of whether two matrices are row equivalent?'
  choices: ['Echelon forms never exist for non-square matrices', 'Comparing them takes more arithmetic than the RREF', 'One matrix can have many different echelon forms, so different echelon forms prove nothing', 'Echelon forms change the solution set of the system']
  answer: 2
  explanation: |-
    The same matrix can reduce to different echelon forms (the lesson's example gave $\begin{bmatrix} 3 & 6 & 3 \\ 0 & 2 & 4\end{bmatrix}$ and $\begin{bmatrix} 1 & 4 & 5 \\ 0 & -6 & -12\end{bmatrix}$), so two different echelon forms could still come from row-equivalent matrices. The RREF is unique, so comparing RREFs settles the question. Every matrix has echelon forms, and row operations never change solution sets.

- id: la-m2-r2-h14
  lesson: la-m2-h-rref-unique
  topic: Uniqueness of the RREF
  stem: 'The columns of a $3 \times 3$ matrix $A$ have no column relation except $c_1 = c_2 = c_3 = 0$. What is the RREF of $A$?'
  choices: ['The $3 \times 3$ identity matrix', 'The $3 \times 3$ zero matrix', '$A$ itself', 'It depends on the row operations used']
  answer: 0
  explanation: |-
    With no nontrivial relation, no column is a combination of the columns to its left (column 1 is not even zero), so all three columns are pivot columns: $\mathbf{e}_1, \mathbf{e}_2, \mathbf{e}_3$. That is the identity matrix. The RREF never depends on the row operations used.

# ---------- Honors 07h2: the cost and accuracy of elimination ----------
- id: la-m2-r2-h15
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'How many flops does the forward phase take on the augmented matrix of a $3 \times 3$ system (no row swaps)?'
  choices: ['9', '18', '28', '19']
  answer: 3
  explanation: |-
    Clearing column 1: 2 rows, each 1 division plus 3 entries at 2 flops, so $2 \times 7 = 14$. Clearing column 2: 1 row, $1 + 2 \times 2 = 5$. Total 19, matching $\tfrac23 n^3 + \tfrac12 n^2 - \tfrac76 n$ at $n = 3$.
    18 is just the leading term $\tfrac23 \cdot 27$; 9 is back-substitution; 28 is the whole solve.

- id: la-m2-r2-h16
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  type: text
  stem: 'How many flops does back-substitution take for a $10 \times 10$ triangular system? Give only the number: ___'
  accept: ['100']
  explanation: |-
    Finding $x_i$ takes $n - i$ multiplications, $n - i$ subtractions and 1 division, which adds up to exactly $n^2$ flops; here $10^2 = 100$.

- id: la-m2-r2-h17
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'Elimination solves a dense $1000 \times 1000$ system in 0.2 seconds. About how long should a $3000 \times 3000$ system take on the same machine?'
  choices: ['0.6 seconds', '1.8 seconds', '5.4 seconds', '3.6 seconds']
  answer: 2
  explanation: |-
    The work grows like $n^3$. Tripling $n$ multiplies it by $3^3 = 27$, so about $0.2 \times 27 = 5.4$ seconds.
    0.6 s assumes the work grows like $n$, 1.8 s like $n^2$; 3.6 s doubles 1.8 by mistake.

- id: la-m2-r2-h18
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'About how many flops does the forward phase take for a $300 \times 300$ system?'
  choices: ['$1.8 \times 10^7$', '$9 \times 10^4$', '$2.7 \times 10^7$', '$6 \times 10^4$']
  answer: 0
  explanation: |-
    The leading term is $\tfrac23 n^3 = \tfrac23 (2.7 \times 10^7) = 1.8 \times 10^7$; the lower-order terms add only about $4.5 \times 10^4$.
    $9 \times 10^4$ is $n^2$ (back-substitution), $2.7 \times 10^7$ is $n^3$ without the $\tfrac23$, and $6 \times 10^4$ is $\tfrac23 n^2$.

- id: la-m2-r2-h19
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  type: order
  stem: 'Put the steps for clearing one column with partial pivoting in order.'
  items:
    - 'Look at the entries of the current column from the pivot row down'
    - 'Find the one with the largest absolute value'
    - 'Swap its row into the pivot position'
    - 'Subtract multiples of the pivot row to create zeros below the pivot'
  explanation: |-
    Partial pivoting chooses the pivot before any elimination: scan the candidates, pick the largest in absolute value, swap it into place. Only then are the entries below cleared, and every multiplier has absolute value at most 1.

- id: la-m2-r2-h20
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'Which statements about partial pivoting are true? Select all that apply.'
  choices: ['Every multiplier has absolute value at most 1', 'It picks the candidate pivot with the largest absolute value', 'It turns an ill-conditioned system into a well-behaved one', 'It is needed only when a pivot is exactly 0', 'It changes the solution of the system']
  answer: [0, 1]
  explanation: |-
    The pivot is the largest candidate in absolute value, so each multiplier (entry $\div$ pivot) is at most 1 in size.
    Pivoting cannot fix an ill-conditioned problem, which is sensitive to its data however it is solved. A tiny nonzero pivot is already dangerous in floating-point arithmetic (as in $0.0001x + y = 1$). Swapping rows never changes the solution set.

- id: la-m2-r2-h21
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'With partial pivoting, the first column of a matrix is $(0.5, -4, 2)$. Which entry becomes the first pivot?'
  choices: ['$0.5$, the entry already on top', '$2$, the largest positive entry', '$-4$, the entry of largest absolute value', '$0.5$, the entry of smallest absolute value']
  answer: 2
  explanation: |-
    Partial pivoting compares absolute values: $|0.5| = 0.5$, $|-4| = 4$, $|2| = 2$. So row 2 is swapped to the top and $-4$ is the pivot. The multipliers are then $0.5/(-4) = -0.125$ and $2/(-4) = -0.5$, both at most 1 in size.

- id: la-m2-r2-h22
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  type: text
  stem: 'Solve $x + y = 2$, $x + 1.001y = 2.003$. Then $y =$ ___ and $x =$ ___.'
  accept:
    - ['3']
    - ['-1']
  explanation: |-
    Subtract the first equation from the second: $0.001y = 0.003$, so $y = 3$ and $x = 2 - 3 = -1$. Changing the right side from $2.001$ (solution $(1, 1)$) to $2.003$ moved the solution to $(-1, 3)$: the system is ill-conditioned.

- id: la-m2-r2-h23
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  type: match
  stem: 'Match each term with its meaning.'
  pairs:
    - ['Flop', 'One floating-point addition, subtraction, multiplication or division']
    - ['Round-off error', 'The difference between a computed and an exact value caused by rounding']
    - ['Partial pivoting', 'Swapping the largest available entry, in absolute value, into the pivot position']
    - ['Ill-conditioned system', 'Small changes in the data cause large changes in the solution']
  distractors: ['A pivot that is exactly zero']
  explanation: |-
    A flop is the unit of cost; round-off error is what rounding leaves behind; partial pivoting chooses pivots to keep multipliers small; an ill-conditioned system is sensitive to its data. A zero pivot is simply a reason to swap rows; none of the terms means that.

- id: la-m2-r2-h24
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'Solving $0.0001x + y = 1$, $x + y = 2$ with 3-digit arithmetic and no row swap gives $x = 0$, far from the true $x \approx 1$. What went wrong?'
  choices: ['The system is inconsistent', 'The tiny pivot gave a huge multiplier, and rounding wiped out the other numbers in row 2', 'Back-substitution was done in the wrong order', 'Three digits are too few to store the number 2']
  answer: 1
  explanation: |-
    The multiplier was $1/0.0001 = 10000$, so row 2 became $-9999y = -9998$, and both numbers rounded to $-10000$. The information in the "2" and the "1" was lost, giving $y = 1.00$, and then dividing by the tiny pivot turned the leftover error into $x = 0$. The system has a unique solution, and swapping rows first fixes the problem.

- id: la-m2-r2-h25
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'Suppose that at every column you scale the pivot row and clear the entries both above and below the pivot, in one pass. For an $n \times n$ system this costs about'
  choices: ['$n^3$ flops', '$\tfrac23 n^3$ flops', '$n^2$ flops', '$2n^3$ flops']
  answer: 0
  explanation: |-
    Each of the $n$ steps updates $n - 1$ rows, giving about $n^3$ flops: half again as much as the $\tfrac23 n^3$ of elimination followed by back-substitution (or a bottom-up backward phase), which costs only about $n^2$ more. Computing $A^{-1}$ costs about $2n^3$.

- id: la-m2-r2-h26
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'A computed answer to an ill-conditioned system satisfies the equations to within $0.001$. What can you conclude?'
  choices: ['It is correct to about three decimal places', 'It is exactly right, since only rounding is left', 'It must be wrong, because the system is ill-conditioned', 'Not much: it may still be far from the true solution']
  answer: 3
  explanation: |-
    In the lesson, $(0, 2)$ satisfies $x + y = 2$, $x + 1.001y = 2.001$ to within $0.001$, yet the true solution is $(1, 1)$. For an ill-conditioned system a small leftover in the equations says little about the error in the answer. It need not be wrong either; you just can't tell from the leftover.

- id: la-m2-r2-h27
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  stem: 'Which statements about solving an $n \times n$ system are true? Select all that apply.'
  choices: ['For large $n$, the forward phase takes far more work than back-substitution', 'Doubling $n$ multiplies the work by about 8', 'Back-substitution costs about as much as the forward phase', 'Computing $A^{-1}$ and then $A^{-1}\mathbf{b}$ is cheaper than elimination']
  answer: [0, 1]
  explanation: |-
    The forward phase costs about $\tfrac23 n^3$ and back-substitution $n^2$, so for large $n$ the forward phase dominates, and doubling $n$ multiplies $n^3$ by $2^3 = 8$.
    Computing the inverse costs about $2n^3$, three times as much as elimination.

- id: la-m2-r2-h28
  lesson: la-m2-h-cost-accuracy
  topic: Cost and accuracy of elimination
  type: text
  stem: 'Use $\tfrac23 n^3 + \tfrac12 n^2 - \tfrac76 n$ to find the number of flops in the forward phase for a $4 \times 4$ system. Give only the number: ___'
  accept: ['46']
  explanation: |-
    $\tfrac23(64) + \tfrac12(16) - \tfrac76(4) = \tfrac{128}{3} + 8 - \tfrac{14}{3} = 38 + 8 = 46$. Counting directly: clearing column 1 is $3 \times (1 + 2 \cdot 4) = 27$, column 2 is $2 \times (1 + 2 \cdot 3) = 14$, column 3 is $1 \times (1 + 2 \cdot 2) = 5$, total 46.
