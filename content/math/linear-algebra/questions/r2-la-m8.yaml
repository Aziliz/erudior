# --- Lesson 27: eigenvalues and eigenvectors ---
- id: la-m8-r2-q01
  lesson: la-eigen
  module_quiz: true
  type: text
  topic: Eigenvalues and eigenvectors
  stem: '$\mathbf{v} = (2, 1)$ is an eigenvector of $A = \begin{bmatrix} 5 & 2 \\ 2 & 2\end{bmatrix}$. Its eigenvalue is ___. (Give only the number.)'
  accept: ['6']
  explanation: |-
    $A\mathbf{v} = (5 \cdot 2 + 2 \cdot 1,\ 2 \cdot 2 + 2 \cdot 1) = (12, 6) = 6(2, 1)$, so the eigenvalue is 6.

- id: la-m8-r2-q02
  lesson: la-eigen
  type: order
  topic: Eigenvalues and eigenvectors
  stem: 'Put the steps for finding a basis of the eigenspace of $A$ for a given eigenvalue $\lambda$ in order.'
  items:
    - 'Subtract $\lambda$ from each diagonal entry to form $A - \lambda I$'
    - 'Row-reduce $A - \lambda I$'
    - 'Identify the free variables'
    - 'Write the solutions of $(A - \lambda I)\mathbf{x} = \mathbf{0}$ in parametric vector form'
    - 'Take the vectors multiplying the free variables as the basis'
  explanation: |-
    The eigenspace is $\operatorname{Nul}(A - \lambda I)$, so it is found exactly like any null space: form the matrix, row-reduce it, read off the free variables, write the general solution in parametric vector form, and keep the vectors that multiply the free variables.

- id: la-m8-r2-q03
  lesson: la-eigen
  topic: Eigenvalues and eigenvectors
  stem: 'Which of these are eigenvectors of $A = \begin{bmatrix} 4 & -2 \\ 1 & 1\end{bmatrix}$? Select all that apply.'
  choices: ['$(1, 1)$', '$(1, 0)$', '$(-4, -2)$', '$(0, 0)$']
  answer: [0, 2]
  explanation: |-
    $A(1, 1) = (2, 2)$, twice $(1, 1)$: eigenvalue 2. $A(-4, -2) = (-16 + 4,\ -4 - 2) = (-12, -6) = 3(-4, -2)$: eigenvalue 3 (it is a multiple of the eigenvector $(2, 1)$). $A(1, 0) = (4, 1)$ is not a multiple of $(1, 0)$. The zero vector is never an eigenvector, even though $A\mathbf{0} = \mathbf{0}$.

- id: la-m8-r2-q04
  lesson: la-eigen
  module_quiz: true
  type: label
  topic: Eigenvalues and eigenvectors
  stem: 'The picture shows the reflection $T$ across the line $x_2 = x_1$. Solid arrows are vectors and dashed arrows are their images. Name the numbered parts.'
  image: {src: images/la-m8-reflection-blank.svg, alt: 'Coordinate axes with a dashed green line through the origin at 45 degrees. A blue arrow lies along the line. A second blue arrow points down and to the right, perpendicular to the line, with a dashed blue arrow pointing the opposite way labeled Tv. An orange arrow points right and slightly up, with a dashed orange image labeled Tw pointing up and slightly right.'}
  labels:
    - {x: 23.9, y: 79.1, text: Mirror line}
    - {x: 60.5, y: 35.6, text: Eigenvector with eigenvalue 1}
    - {x: 58.9, y: 66.1, text: Eigenvector with eigenvalue -1}
    - {x: 72.0, y: 41.9, text: Vector that is not an eigenvector}
  distractors: [Eigenvector with eigenvalue 0, Eigenvector with eigenvalue 2]
  explanation: |-
    1 is the mirror line $x_2 = x_1$. 2 lies on the mirror, so the reflection leaves it unchanged: eigenvalue 1. 3 is perpendicular to the mirror, so its image (dashed) points the opposite way: eigenvalue $-1$. 4 is sent to a vector in a different direction (its dashed image), so it is not an eigenvector. A reflection never has eigenvalue 0 (it is invertible) or 2 (it doesn't change lengths).

- id: la-m8-r2-q05
  lesson: la-eigen
  type: match
  topic: Eigenvalues and eigenvectors
  stem: 'Match each transformation of the plane to its real eigenvalues.'
  pairs:
    - ['Reflection across a line through the origin', '1 and -1']
    - ['Projection onto a line through the origin', '1 and 0']
    - ['Rotation by 90°', 'No real eigenvalues']
    - ['Multiplying every vector by 3', '3 only']
  distractors: ['0 and -1']
  explanation: |-
    A reflection keeps vectors on the mirror (1) and flips those perpendicular to it ($-1$). A projection keeps vectors on the line (1) and sends perpendicular ones to $\mathbf{0}$ (0). A $90^\circ$ rotation turns every nonzero vector, so no real eigenvector exists (its eigenvalues are $\pm i$). Scaling by 3 makes every nonzero vector an eigenvector with eigenvalue 3.

# --- Lesson 28: the characteristic equation ---
- id: la-m8-r2-q06
  lesson: la-char-eq
  type: text
  topic: Characteristic equation
  stem: 'The characteristic polynomial of $\begin{bmatrix} 5 & 2 \\ 1 & 4\end{bmatrix}$ is $\lambda^2 - b\lambda + c$ with $b =$ ___ and $c =$ ___. (Give only the numbers.)'
  accept:
    - ['9']
    - ['18']
  explanation: |-
    For a $2 \times 2$ matrix the characteristic polynomial is $\lambda^2 - (\operatorname{tr} A)\lambda + \det A$. Here $\operatorname{tr} A = 5 + 4 = 9$ and $\det A = 20 - 2 = 18$, so it is $\lambda^2 - 9\lambda + 18 = (\lambda - 3)(\lambda - 6)$.

- id: la-m8-r2-q07
  lesson: la-char-eq
  type: match
  topic: Characteristic equation
  stem: 'Match each matrix to its characteristic polynomial.'
  pairs:
    - ['$\begin{bmatrix} 1 & 2 \\ 3 & 4\end{bmatrix}$', 'λ² − 5λ − 2']
    - ['$\begin{bmatrix} 0 & -1 \\ 1 & 0\end{bmatrix}$', 'λ² + 1']
    - ['$\begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix}$', 'λ² − 4λ + 4']
    - ['$\begin{bmatrix} 3 & 0 \\ 0 & -1\end{bmatrix}$', 'λ² − 2λ − 3']
  distractors: ['λ² + 5λ − 2']
  explanation: |-
    Use $\lambda^2 - (\operatorname{tr} A)\lambda + \det A$. First matrix: trace 5, determinant $4 - 6 = -2$. Rotation: trace 0, determinant 1. Triangular matrix: trace 4, determinant 4. Diagonal matrix: trace 2, determinant $-3$. The distractor has the wrong sign on the middle term.

- id: la-m8-r2-q08
  lesson: la-char-eq
  module_quiz: true
  topic: Characteristic equation
  stem: '$B = P^{-1}AP$ for an invertible matrix $P$. Which must $A$ and $B$ have in common? Select all that apply.'
  choices: ['The characteristic polynomial', 'The determinant', 'The trace', 'The eigenvectors', 'The diagonal entries']
  answer: [0, 1, 2]
  explanation: |-
    $\det(B - \lambda I) = \det P^{-1}\det(A - \lambda I)\det P = \det(A - \lambda I)$, so the characteristic polynomials agree, and with them the eigenvalues, their sum (the trace) and their product (the determinant). Eigenvectors generally change: if $A\mathbf{v} = \lambda\mathbf{v}$, then $B(P^{-1}\mathbf{v}) = \lambda P^{-1}\mathbf{v}$, so the eigenvectors of $B$ are $P^{-1}$ times those of $A$. The diagonal entries can differ too; only their sum is fixed.

- id: la-m8-r2-q09
  lesson: la-char-eq
  type: order
  topic: Characteristic equation
  stem: 'Put the steps for finding the eigenvalues of a $3 \times 3$ matrix $A$ by hand in order.'
  items:
    - 'Subtract $\lambda$ from each diagonal entry to get $A - \lambda I$'
    - 'Expand $\det(A - \lambda I)$ along a row or column with many zeros'
    - 'Set the characteristic polynomial equal to 0 and factor it'
    - 'Check that the roots add up to the trace of $A$'
  explanation: |-
    The characteristic polynomial is $\det(A - \lambda I)$, so first form $A - \lambda I$, then expand the determinant (choosing a row or column with zeros keeps it short), then solve the characteristic equation. The trace check comes last because it needs the roots.

- id: la-m8-r2-q10
  lesson: la-char-eq
  type: text
  topic: Characteristic equation
  stem: 'A $2 \times 2$ matrix has trace 7 and determinant 10. Its larger eigenvalue is ___.'
  accept: ['5']
  explanation: |-
    The characteristic equation is $\lambda^2 - 7\lambda + 10 = (\lambda - 2)(\lambda - 5) = 0$, so the eigenvalues are 2 and 5. Check: $2 + 5 = 7$ and $2 \cdot 5 = 10$.

# --- Lesson 29: diagonalization ---
- id: la-m8-r2-q11
  lesson: la-diagonalization
  type: text
  topic: Diagonalization
  stem: '$A = PDP^{-1}$ with $D = \begin{bmatrix} 2 & 0 \\ 0 & -1\end{bmatrix}$. Then $A^5 = PD^5P^{-1}$, where $D^5$ has diagonal entries ___ and ___ (in order).'
  accept:
    - ['32']
    - ['-1']
  explanation: |-
    A power of a diagonal matrix just raises each diagonal entry to that power: $2^5 = 32$ and $(-1)^5 = -1$.

- id: la-m8-r2-q12
  lesson: la-diagonalization
  type: order
  topic: Diagonalization
  stem: 'Put the steps for diagonalizing an $n \times n$ matrix $A$ in order.'
  items:
    - 'Find the eigenvalues of $A$'
    - 'Find a basis for each eigenspace'
    - 'Check that there are $n$ independent eigenvectors in all'
    - 'Form $P$ from the eigenvectors and $D$ from the matching eigenvalues'
    - 'Check that $AP = PD$'
  explanation: |-
    Eigenvectors are found from the eigenvalues, and only after counting them do you know whether $A$ is diagonalizable at all. Then build $P$ and $D$ (in matching order) and confirm with $AP = PD$, which avoids computing $P^{-1}$.

- id: la-m8-r2-q13
  lesson: la-diagonalization
  module_quiz: true
  topic: Diagonalization
  stem: 'Which of these matrices are diagonalizable using real matrices $P$ and $D$? Select all that apply.'
  choices: ['$\begin{bmatrix} 2 & 1 \\ 0 & 3\end{bmatrix}$', '$\begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix}$', '$\begin{bmatrix} 0 & -1 \\ 1 & 0\end{bmatrix}$', '$\begin{bmatrix} 1 & 1 \\ 1 & 1\end{bmatrix}$']
  answer: [0, 3]
  explanation: |-
    The first matrix is triangular with distinct eigenvalues 2 and 3, so it is diagonalizable. The all-ones matrix has trace 2 and determinant 0, so its eigenvalues are 2 and 0, also distinct. $\begin{bmatrix} 2 & 1 \\ 0 & 2\end{bmatrix}$ has eigenvalue 2 twice but only a 1-dimensional eigenspace. The rotation has eigenvalues $\pm i$, which are not real.

- id: la-m8-r2-q14
  lesson: la-diagonalization
  type: match
  topic: Diagonalization
  stem: 'Match each $3 \times 3$ matrix description to the conclusion.'
  pairs:
    - ['Eigenvalues 1, 2 and 3', 'Diagonalizable']
    - ['Eigenvalues 2, 2, 5; the eigenspace for 2 is 1-dimensional', 'Not diagonalizable: too few eigenvectors']
    - ['Eigenvalues 4 and $1 \pm i$', 'Not diagonalizable with real matrices']
    - ['Eigenvalues 2, 2, 5; the eigenspace for 2 is 2-dimensional', 'Diagonalizable']
  distractors: ['Diagonalizable only if it is invertible']
  explanation: |-
    Three distinct real eigenvalues guarantee three independent eigenvectors. With a repeated eigenvalue, compare the eigenspace dimension with the multiplicity: 1 is less than 2 (not diagonalizable), 2 equals 2 (diagonalizable, $2 + 1 = 3$ eigenvectors). Non-real eigenvalues rule out a real $D$. Invertibility has nothing to do with diagonalizability.

- id: la-m8-r2-q15
  lesson: la-diagonalization
  type: text
  topic: Diagonalization
  stem: 'For $S = \begin{bmatrix} 3 & 1 & 0 \\ 0 & 3 & 0 \\ 0 & 0 & 3\end{bmatrix}$, the eigenspace for $\lambda = 3$ has dimension ___.'
  accept: ['2', 'two']
  explanation: |-
    $S - 3I = \begin{bmatrix} 0 & 1 & 0 \\ 0 & 0 & 0 \\ 0 & 0 & 0\end{bmatrix}$ has one pivot, so it has $3 - 1 = 2$ free variables. The geometric multiplicity is 2, less than the algebraic multiplicity 3, so $S$ is not diagonalizable.

# --- Lesson 30: complex eigenvalues ---
