- id: la-q-3802
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'What are the singular values of $\begin{bmatrix} 3 & 0 \\ 0 & -2\end{bmatrix}$?'
  choices: ['$3$ and $-2$', '$\sqrt3$ and $\sqrt2$', '$9$ and $4$', '$3$ and $2$']
  answer: 3
  explanation: |-
    $A^TA = \operatorname{diag}(9, 4)$, so $\sigma = 3, 2$. Singular values are never negative, even when eigenvalues are.

- id: la-q-3803
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'How is the rank of $A$ related to its singular values?'
  choices: ['It equals the largest singular value', 'It equals the number of nonzero singular values', 'It equals the sum of the singular values', 'It equals the number of singular values greater than 1']
  answer: 1
  explanation: |-
    The nonzero singular values correspond to $\mathbf{u}_1, \dots, \mathbf{u}_r$, an orthonormal basis of $\operatorname{Col} A$, so $r$ = rank.

- id: la-q-3804
  lesson: la-svd
  module_quiz: true
  topic: Singular value decomposition
  stem: 'In $A = U\Sigma V^T$, how is the left singular vector $\mathbf{u}_i$ (for $\sigma_i > 0$) obtained from $\mathbf{v}_i$?'
  choices: ['$\mathbf{u}_i = \dfrac{1}{\sigma_i}A\mathbf{v}_i$', '$\mathbf{u}_i = A^T\mathbf{v}_i$', '$\mathbf{u}_i = \sigma_iA\mathbf{v}_i$', '$\mathbf{u}_i = \mathbf{v}_i$']
  answer: 0
  explanation: |-
    $\|A\mathbf{v}_i\| = \sigma_i$, so dividing by $\sigma_i$ gives a unit vector, and these are automatically orthogonal.

- id: la-q-3805
  lesson: la-svd
  topic: Singular value decomposition
  stem: '$A$ is $3 \times 2$. What size is $\Sigma$ in $A = U\Sigma V^T$?'
  choices: ['$2 \times 2$', '$3 \times 3$', '$3 \times 2$', '$2 \times 3$']
  answer: 2
  explanation: |-
    $\Sigma$ has the same shape as $A$; $U$ is $3 \times 3$ and $V$ is $2 \times 2$.

- id: la-q-3806
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'What does the largest singular value $\sigma_1$ of $A$ measure?'
  choices: ['The largest entry of $A$', 'The maximum of $\|A\mathbf{x}\|$ over unit vectors $\mathbf{x}$', 'The determinant of $A$', 'The number of pivots']
  answer: 1
  explanation: |-
    $\|A\mathbf{x}\|^2 = \mathbf{x}^TA^TA\mathbf{x}$, whose maximum on unit vectors is the largest eigenvalue $\sigma_1^2$ of $A^TA$. Geometrically, $\sigma_1$ is the longest semi-axis of the image of the unit sphere.

- id: la-q-3807
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'A $2 \times 2$ matrix has singular values 6 and 2. What is $|\det A|$?'
  choices: ['$8$', '$36$', '$4$', '$12$']
  answer: 3
  explanation: |-
    $\det A = \det U\det\Sigma\det V^T$ and $\det U, \det V = \pm1$, so $|\det A| = \sigma_1\sigma_2 = 12$.

- id: la-q-3808
  lesson: la-svd
  module_quiz: true
  topic: Singular value decomposition
  stem: 'An invertible matrix has largest singular value 10 and smallest 0.1. What is its condition number, and what does it suggest?'
  choices: ['$1$; perfectly conditioned', '$100$; errors in $\mathbf{b}$ can be magnified up to about 100 times in $\mathbf{x}$', '$0.01$; very stable', '$9.9$; singular']
  answer: 1
  explanation: |-
    The condition number is $\sigma_1/\sigma_n = 10/0.1 = 100$. Larger condition numbers mean the matrix is closer to singular and solutions are more sensitive to errors.

- id: la-q-3809
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'Which matrix is the best rank-1 approximation of $A = \sum_{i=1}^r \sigma_i\mathbf{u}_i\mathbf{v}_i^T$?'
  choices: ['$\sigma_r\mathbf{u}_r\mathbf{v}_r^T$', '$\sigma_1 I$', '$\mathbf{u}_1\mathbf{v}_1^T$', '$\sigma_1\mathbf{u}_1\mathbf{v}_1^T$']
  answer: 3
  explanation: |-
    Keeping the terms with the largest singular values gives the best low-rank approximations; for rank 1, keep the first term. This is the idea behind SVD image compression.

- id: la-q-3810
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'What are the singular values of $A = \begin{bmatrix} 1 & 1 \\ 1 & 1 \\ 0 & 0\end{bmatrix}$?'
  choices: ['$2$ and $0$', '$\sqrt2$ and $\sqrt2$', '$1$ and $1$', '$4$ and $0$']
  answer: 0
  explanation: |-
    $A^TA = \begin{bmatrix} 2 & 2 \\ 2 & 2\end{bmatrix}$ has eigenvalues 4 and 0, so $\sigma_1 = 2$, $\sigma_2 = 0$, and $A$ has rank 1.

- id: la-q-3811
  lesson: la-svd
  topic: Singular value decomposition
  stem: 'For which matrices are the singular values the same as the eigenvalues?'
  choices: ['All square matrices', 'Symmetric positive semidefinite matrices', 'All invertible matrices', 'Triangular matrices']
  answer: 1
  explanation: |-
    If $A = PDP^T$ with $D \ge 0$, that's already an SVD. In general they differ: $\begin{bmatrix} 3 & 0 \\ 4 & 5\end{bmatrix}$ has eigenvalues 3, 5 but singular values about 6.71 and 2.24.
