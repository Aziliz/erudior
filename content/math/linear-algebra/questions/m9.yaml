  topic: Symmetric matrices
  stem: 'Which matrix is symmetric?'
  choices: ['$\begin{bmatrix} 1 & 2 \\ 3 & 1\end{bmatrix}$', '$\begin{bmatrix} 2 & -1 & 0 \\ -1 & 5 & 4 \\ 0 & 4 & 1\end{bmatrix}$', '$\begin{bmatrix} 1 & 2 & 3 \\ 2 & 1 & 4\end{bmatrix}$', '$\begin{bmatrix} 0 & 1 \\ -1 & 0\end{bmatrix}$']
  answer: 1
  explanation: |-
    $a_{ij} = a_{ji}$ for every pair. The matrix with off-diagonal entries $1$ and $-1$ satisfies $A^T = -A$ (skew-symmetric); the one with off-diagonal entries 2 and 3 isn't symmetric; non-square matrices can't be symmetric.

