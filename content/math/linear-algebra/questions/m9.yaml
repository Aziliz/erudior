    $(\mathbf{u}_j\mathbf{u}_j^T)\mathbf{x} = (\mathbf{u}_j\cdot\mathbf{x})\mathbf{u}_j$, the projection onto $\mathbf{u}_j$ (a unit vector). So $A$ is a weighted sum of projections onto perpendicular axes.

