# Module 9: orthogonality, least squares and symmetric matrices

# --- Lesson 33: inner product, length, orthogonality (ids la-q-32NN) ---
- id: la-q-3201
  lesson: la-inner-product
  module_quiz: true
  topic: Inner product
  stem: 'Compute $\mathbf{u}\cdot\mathbf{v}$ for $\mathbf{u} = (2, -1, 3)$ and $\mathbf{v} = (1, 4, 2)$.'
  choices: ['$4$', '$12$', '$(2, -4, 6)$', '$-4$']
  answer: 0
  explanation: |-
    $2(1) + (-1)(4) + 3(2) = 2 - 4 + 6 = 4$. The dot product is a number, not a vector; $(2, -4, 6)$ multiplies entries without adding.

- id: la-q-3202
  lesson: la-inner-product
  topic: Inner product
  stem: 'What is $\|(1, 2, 2)\|$?'
  choices: ['$5$', '$9$', '$3$', '$\sqrt5$']
  answer: 2
  explanation: |-
    $\sqrt{1 + 4 + 4} = \sqrt9 = 3$. Forgetting the square root gives 9.

- id: la-q-3203
  lesson: la-inner-product
  topic: Inner product
  stem: 'What is the distance between $(1, 5)$ and $(4, 1)$?'
  choices: ['$7$', '$\sqrt{7}$', '$25$', '$5$']
  answer: 3
  explanation: |-
    $\|(1, 5) - (4, 1)\| = \|(-3, 4)\| = \sqrt{9 + 16} = 5$.

- id: la-q-3204
  lesson: la-inner-product
  module_quiz: true
  topic: Orthogonality
  stem: 'Which pair of vectors is orthogonal?'
  choices: ['$(1, 2, 3)$ and $(3, 2, 1)$', '$(1, 1, 0)$ and $(1, 1, 1)$', '$(2, 1, -1)$ and $(1, -1, 1)$', '$(1, 0, 1)$ and $(1, 0, -2)$']
  answer: 2
  explanation: |-
    $2(1) + 1(-1) + (-1)(1) = 0$. The other dot products are 10, 2 and $-1$.

- id: la-q-3205
  lesson: la-inner-product
  topic: Inner product
  stem: 'What is the angle between $(1, 0)$ and $(1, 1)$?'
  choices: ['$30^\circ$', '$45^\circ$', '$60^\circ$', '$90^\circ$']
  answer: 1
  explanation: |-
    $\cos\theta = \dfrac{1}{1 \cdot \sqrt2} = \dfrac{\sqrt2}{2}$, so $\theta = 45^\circ$.

- id: la-q-3206
  lesson: la-inner-product
  topic: Inner product
  stem: 'What is the unit vector in the direction of $(2, -1, 2)$?'
  choices: ['$\tfrac13(2, -1, 2)$', '$\tfrac19(2, -1, 2)$', '$\tfrac15(2, -1, 2)$', '$\tfrac13(2, 1, 2)$']
  answer: 0
  explanation: |-
    $\|(2, -1, 2)\| = \sqrt{4 + 1 + 4} = 3$, so divide by 3. $\tfrac19$ divides by the squared length; $\tfrac15$ divides by the sum of the absolute entries.

- id: la-q-3207
  lesson: la-inner-product
  module_quiz: true
  topic: Orthogonality
  stem: 'For an $m \times n$ matrix $A$, what is $(\operatorname{Row} A)^\perp$?'
  choices: ['$\operatorname{Col} A$', '$\operatorname{Row} A^T$', '$\operatorname{Nul} A^T$', '$\operatorname{Nul} A$']
  answer: 3
  explanation: |-
    $A\mathbf{x} = \mathbf{0}$ says $\mathbf{x}$ has dot product 0 with every row of $A$, which is exactly what it means to be orthogonal to $\operatorname{Row} A$. Similarly $(\operatorname{Col} A)^\perp = \operatorname{Nul} A^T$.

- id: la-q-3208
  lesson: la-inner-product
  topic: Orthogonality
  stem: '$W = \operatorname{Span}\{(1, 2, 3)\}$ in $\mathbb{R}^3$. What is $\dim W^\perp$?'
  choices: ['0', '1', '2', '3']
  answer: 2
  explanation: |-
    $W^\perp$ is the plane $x_1 + 2x_2 + 3x_3 = 0$, of dimension 2. In general $\dim W + \dim W^\perp = n$.

- id: la-q-3209
  lesson: la-inner-product
  topic: Orthogonality
  stem: '$\mathbf{u}$ and $\mathbf{v}$ are orthogonal with $\|\mathbf{u}\| = 3$ and $\|\mathbf{v}\| = 4$. What is $\|\mathbf{u} + \mathbf{v}\|$?'
  choices: ['$7$', '$5$', '$25$', '$1$']
  answer: 1
  explanation: |-
    By the Pythagorean theorem, $\|\mathbf{u} + \mathbf{v}\|^2 = 9 + 16 = 25$, so the length is 5. Seven would require the vectors to point the same way.

- id: la-q-3210
  lesson: la-inner-product
  topic: Inner product
  stem: '$\mathbf{u}\cdot\mathbf{v} < 0$ for nonzero vectors $\mathbf{u}$ and $\mathbf{v}$. What can you say about the angle between them?'
  choices: ['It is acute', 'It is a right angle', 'It is obtuse', 'Nothing']
  answer: 2
  explanation: |-
    $\cos\theta = \dfrac{\mathbf{u}\cdot\mathbf{v}}{\|\mathbf{u}\|\|\mathbf{v}\|}$ has the sign of $\mathbf{u}\cdot\mathbf{v}$, and a negative cosine means $90^\circ < \theta \le 180^\circ$.

- id: la-q-3211
  lesson: la-inner-product
  module_quiz: true
  topic: Orthogonality
  stem: '$W = \operatorname{Span}\{\mathbf{w}_1, \mathbf{w}_2\}$. How do you check whether $\mathbf{z}$ is in $W^\perp$?'
  choices: ['Check $\mathbf{z}\cdot\mathbf{w}_1 = 0$ only', 'Check $\|\mathbf{z}\| = 0$', 'Check $\mathbf{z}\cdot(\mathbf{w}_1 + \mathbf{w}_2) = 0$ only', 'Check $\mathbf{z}\cdot\mathbf{w}_1 = 0$ and $\mathbf{z}\cdot\mathbf{w}_2 = 0$']
  answer: 3
  explanation: |-
    If $\mathbf{z}$ is orthogonal to both spanning vectors, it's orthogonal to every combination $c_1\mathbf{w}_1 + c_2\mathbf{w}_2$. Checking only the sum isn't enough: $(1, -1, 0)$ is orthogonal to $(1, 0, 0) + (0, 1, 0)$ but not to either one.

# --- Lesson 34: orthogonal sets and projections (ids la-q-33NN) ---
- id: la-q-3301
  lesson: la-projections
  topic: Orthogonal bases
  stem: '$\{\mathbf{u}_1, \mathbf{u}_2, \mathbf{u}_3\}$ is an orthogonal basis with $\mathbf{u}_2 = (1, -1, 1)$. What is the $\mathbf{u}_2$-coordinate of $\mathbf{y} = (3, 1, 4)$?'
  choices: ['$6$', '$2$', '$6/\sqrt3$', '$3$']
  answer: 1
  explanation: |-
    $c_2 = \dfrac{\mathbf{y}\cdot\mathbf{u}_2}{\mathbf{u}_2\cdot\mathbf{u}_2} = \dfrac{3 - 1 + 4}{3} = 2$. Forgetting to divide gives 6; dividing by $\|\mathbf{u}_2\|$ instead of $\|\mathbf{u}_2\|^2$ gives $6/\sqrt3$.

- id: la-q-3302
  lesson: la-projections
  module_quiz: true
  topic: Orthogonal projections
  stem: 'Find the orthogonal projection of $\mathbf{y} = (2, 6)$ onto the line spanned by $\mathbf{u} = (3, 1)$.'
  choices: ['$(3.6, 1.2)$', '$(-1.6, 4.8)$', '$(36, 12)$', '$(1.2, 3.6)$']
  answer: 0
  explanation: |-
    $\dfrac{\mathbf{y}\cdot\mathbf{u}}{\mathbf{u}\cdot\mathbf{u}}\mathbf{u} = \dfrac{12}{10}(3, 1) = (3.6, 1.2)$. $(-1.6, 4.8)$ is the orthogonal component $\mathbf{y} - \hat{\mathbf{y}}$.

- id: la-q-3303
  lesson: la-projections
  topic: Orthogonal bases
  stem: 'Why is an orthogonal set of nonzero vectors linearly independent?'
  choices: ['Dotting a dependence relation with $\mathbf{u}_j$ leaves $c_j\|\mathbf{u}_j\|^2 = 0$, forcing $c_j = 0$', 'Because orthogonal vectors have length 1', 'Because there are at most $n$ of them', 'Because they span $\mathbb{R}^n$']
  answer: 0
  explanation: |-
    All the cross terms $\mathbf{u}_i\cdot\mathbf{u}_j$ vanish, and $\|\mathbf{u}_j\|^2 > 0$, so every weight must be 0.

- id: la-q-3304
  lesson: la-projections
  topic: Orthogonal bases
  stem: 'A matrix $U$ has orthonormal columns. Which is always true?'
  choices: ['$UU^T = I$', '$U^TU = I$', '$U$ is square', '$U$ is symmetric']
  answer: 1
  explanation: |-
    Entry $(i, j)$ of $U^TU$ is $\mathbf{u}_i\cdot\mathbf{u}_j$, which is 1 on the diagonal and 0 off it. $UU^T = I$ only when $U$ is also square.

- id: la-q-3305
  lesson: la-projections
  module_quiz: true
  topic: Orthogonal bases
  stem: 'If $U$ is an orthogonal (square) matrix, what is $U^{-1}$?'
  choices: ['$U$', '$-U$', '$U^T$', 'It may not exist']
  answer: 2
  explanation: |-
    $U^TU = I$ and $U$ is square, so $U^T$ is its inverse. That's what makes orthogonal matrices so convenient numerically.

- id: la-q-3306
  lesson: la-projections
  topic: Orthogonal projections
  stem: 'The formula $\operatorname{proj}_W\mathbf{y} = \sum \dfrac{\mathbf{y}\cdot\mathbf{u}_i}{\mathbf{u}_i\cdot\mathbf{u}_i}\mathbf{u}_i$ requires that $\{\mathbf{u}_i\}$ be:'
  choices: ['any basis of $W$', 'an orthogonal basis of $W$', 'a spanning set for $\mathbb{R}^n$', 'a set of unit vectors']
  answer: 1
  explanation: |-
    The formula adds projections onto each direction separately, which is only valid when the directions are mutually perpendicular. With a non-orthogonal basis, first apply Gram–Schmidt.

- id: la-q-3307
  lesson: la-projections
  topic: Orthogonal projections
  stem: 'What is the distance from $\mathbf{y} = (2, 6)$ to the line through $\mathbf{u} = (3, 1)$?'
  choices: ['$\sqrt{25.6} \approx 5.06$', '$\sqrt{40} \approx 6.32$', '$\sqrt{14.4} \approx 3.79$', '$1.2$']
  answer: 0
  explanation: |-
    The distance is the length of $\mathbf{z} = \mathbf{y} - \hat{\mathbf{y}} = (-1.6, 4.8)$: $\sqrt{2.56 + 23.04} = \sqrt{25.6}$. $\sqrt{40}$ is $\|\mathbf{y}\|$ and $\sqrt{14.4}$ is $\|\hat{\mathbf{y}}\|$.

- id: la-q-3308
  lesson: la-projections
  module_quiz: true
  topic: Orthogonal projections
  stem: 'What does the best approximation theorem say about $\hat{\mathbf{y}} = \operatorname{proj}_W\mathbf{y}$?'
  choices: ['It is the longest vector in $W$', 'It equals $\mathbf{y}$ whenever $\mathbf{y} \neq \mathbf{0}$', 'It is orthogonal to $W$', 'It is the point of $W$ closest to $\mathbf{y}$']
  answer: 3
  explanation: |-
    $\|\mathbf{y} - \hat{\mathbf{y}}\| < \|\mathbf{y} - \mathbf{v}\|$ for every other $\mathbf{v}$ in $W$. The difference $\mathbf{y} - \hat{\mathbf{y}}$ is orthogonal to $W$; $\hat{\mathbf{y}}$ itself lies in $W$.

- id: la-q-3309
  lesson: la-projections
  topic: Orthogonal projections
  stem: 'What is the projection of $(1, 2, 3)$ onto $W = \operatorname{Span}\{\mathbf{e}_1, \mathbf{e}_2\}$?'
  choices: ['$(1, 2, 0)$', '$(0, 0, 3)$', '$(1, 2, 3)$', '$(1, 0, 0)$']
  answer: 0
  explanation: |-
    $\mathbf{e}_1, \mathbf{e}_2$ are orthonormal, so $\operatorname{proj}_W\mathbf{y} = (\mathbf{y}\cdot\mathbf{e}_1)\mathbf{e}_1 + (\mathbf{y}\cdot\mathbf{e}_2)\mathbf{e}_2 = (1, 2, 0)$. The leftover $(0, 0, 3)$ is in $W^\perp$.

- id: la-q-3310
  lesson: la-projections
  topic: Orthogonal bases
  stem: '$\{(1, 2), (2, -1)\}$ is an orthogonal basis of $\mathbb{R}^2$. Find the coordinates of $(5, 0)$ in it.'
  choices: ['$(5, 0)$', '$(1, 2)$', '$(2, 1)$', '$(5, 10)$']
  answer: 1
  explanation: |-
    $c_1 = \dfrac{5}{5} = 1$ and $c_2 = \dfrac{10}{5} = 2$. Check: $1(1, 2) + 2(2, -1) = (5, 0)$. ✓

- id: la-q-3311
  lesson: la-projections
  topic: Orthogonal bases
  stem: 'If $U$ has orthonormal columns, which is true for every $\mathbf{x}$?'
  choices: ['$\|U\mathbf{x}\| = \|\mathbf{x}\|$', '$U\mathbf{x} = \mathbf{x}$', '$\|U\mathbf{x}\| = 1$', '$U\mathbf{x}$ is orthogonal to $\mathbf{x}$']
  answer: 0
  explanation: |-
    $\|U\mathbf{x}\|^2 = \mathbf{x}^TU^TU\mathbf{x} = \mathbf{x}^T\mathbf{x} = \|\mathbf{x}\|^2$. Such matrices preserve lengths and angles, like rotations and reflections.

# --- Lesson 35: Gram–Schmidt and QR (ids la-q-34NN) ---
- id: la-q-3401
  lesson: la-gram-schmidt
  module_quiz: true
  topic: Gram–Schmidt
  stem: 'Apply Gram–Schmidt to $\mathbf{x}_1 = (1, 1)$, $\mathbf{x}_2 = (1, 3)$. What is $\mathbf{v}_2$?'
  choices: ['$(1, 3)$', '$(0, 2)$', '$(2, 2)$', '$(-1, 1)$']
  answer: 3
  explanation: |-
    $\mathbf{v}_2 = \mathbf{x}_2 - \dfrac{\mathbf{x}_2\cdot\mathbf{v}_1}{\mathbf{v}_1\cdot\mathbf{v}_1}\mathbf{v}_1 = (1, 3) - \dfrac42(1, 1) = (-1, 1)$. Check: $(-1, 1)\cdot(1, 1) = 0$. ✓ $(2, 2)$ is the projection that was subtracted.

- id: la-q-3402
  lesson: la-gram-schmidt
  topic: Gram–Schmidt
  stem: 'In Gram–Schmidt, $\mathbf{v}_3$ is $\mathbf{x}_3$ minus its projections onto:'
  choices: ['$\mathbf{x}_1$ and $\mathbf{x}_2$', '$\mathbf{e}_1$ and $\mathbf{e}_2$', '$\mathbf{v}_1$ and $\mathbf{v}_2$', '$\mathbf{x}_3$ itself']
  answer: 2
  explanation: |-
    The projection formula needs an orthogonal set, so subtract projections onto the already-orthogonalized $\mathbf{v}_1, \mathbf{v}_2$. Using $\mathbf{x}_1, \mathbf{x}_2$ (not orthogonal) gives a wrong result.

- id: la-q-3403
  lesson: la-gram-schmidt
  topic: Gram–Schmidt
  stem: 'Apply Gram–Schmidt to $(1, 0, 1)$ and $(1, 1, 0)$. Which is (a multiple of) $\mathbf{v}_2$?'
  choices: ['$(1, 2, -1)$', '$(1, 1, 0)$', '$(0, 1, -1)$', '$(1, -1, 1)$']
  answer: 0
  explanation: |-
    $\mathbf{v}_2 = (1, 1, 0) - \tfrac12(1, 0, 1) = \left(\tfrac12, 1, -\tfrac12\right)$, a multiple of $(1, 2, -1)$. Check: $(1, 2, -1)\cdot(1, 0, 1) = 0$. ✓

- id: la-q-3404
  lesson: la-gram-schmidt
  module_quiz: true
  topic: QR factorization
  stem: 'In $A = QR$ for a matrix with independent columns, what are $Q$ and $R$?'
  choices: ['$Q$ is upper triangular, $R$ has orthonormal columns', '$Q$ has orthonormal columns spanning $\operatorname{Col} A$; $R$ is upper triangular with positive diagonal', 'Both are orthogonal', '$Q$ is the RREF and $R$ the remainder']
  answer: 1
  explanation: |-
    $Q$ holds the normalized Gram–Schmidt vectors, and $R = Q^TA$ records the dot products, which vanish below the diagonal.

- id: la-q-3405
  lesson: la-gram-schmidt
  topic: QR factorization
  stem: 'Given $Q$ in a QR factorization of $A$, how do you get $R$?'
  choices: ['$R = AQ$', '$R = Q^{-1}A^T$', '$R = A^TQ$', '$R = Q^TA$']
  answer: 3
  explanation: |-
    $Q^TQ = I$, so multiplying $A = QR$ on the left by $Q^T$ gives $Q^TA = R$.

- id: la-q-3406
  lesson: la-gram-schmidt
  topic: QR factorization
  stem: 'In the QR factorization, what is $r_{11}$?'
  choices: ['$1$', '$\|\mathbf{x}_1\|$', '$\mathbf{x}_1\cdot\mathbf{x}_2$', '$a_{11}$']
  answer: 1
  explanation: |-
    $\mathbf{q}_1 = \mathbf{x}_1/\|\mathbf{x}_1\|$, so $r_{11} = \mathbf{q}_1\cdot\mathbf{x}_1 = \|\mathbf{x}_1\|$. In general $r_{jj} = \|\mathbf{v}_j\|$.

- id: la-q-3407
  lesson: la-gram-schmidt
  topic: Gram–Schmidt
  stem: 'During Gram–Schmidt you get $\mathbf{v}_2 = \left(-\tfrac12, -\tfrac12, 1\right)$. May you replace it by $(-1, -1, 2)$ before computing $\mathbf{v}_3$?'
  choices: ['No, this changes the span', 'Only if $\mathbf{v}_2$ is a unit vector', 'Only at the very end', 'Yes, scaling doesn''t affect orthogonality or the spans']
  answer: 3
  explanation: |-
    Projections onto a direction don't depend on the length of the vector used, and spans are unchanged by nonzero scaling, so clearing fractions is a common convenience.

- id: la-q-3408
  lesson: la-gram-schmidt
  topic: Gram–Schmidt
  stem: 'Normalize $\mathbf{v} = (3, 4)$.'
  choices: ['$(0.6, 0.8)$', '$(3/7, 4/7)$', '$(0.3, 0.4)$', '$(0.8, 0.6)$']
  answer: 0
  explanation: |-
    $\|\mathbf{v}\| = 5$, so the unit vector is $(3/5, 4/5)$.

- id: la-q-3409
  lesson: la-gram-schmidt
  module_quiz: true
  topic: Gram–Schmidt
  stem: 'Which property holds for the output of Gram–Schmidt applied to $\mathbf{x}_1, \mathbf{x}_2, \mathbf{x}_3$?'
  choices: ['$\mathbf{v}_k = \mathbf{x}_k$ for every $k$', '$\operatorname{Span}\{\mathbf{v}_1, \mathbf{v}_2\} = \operatorname{Span}\{\mathbf{x}_1, \mathbf{x}_2\}$', 'The $\mathbf{v}_k$ are unit vectors', '$\mathbf{v}_3$ is parallel to $\mathbf{x}_3$']
  answer: 1
  explanation: |-
    Each $\mathbf{v}_k$ is $\mathbf{x}_k$ minus a combination of earlier vectors, so the spans match at every stage. Only $\mathbf{v}_1 = \mathbf{x}_1$ in general, and the $\mathbf{v}$'s are unit vectors only after normalizing.

- id: la-q-3410
  lesson: la-gram-schmidt
  topic: Gram–Schmidt
  stem: 'Why can''t Gram–Schmidt produce $\mathbf{v}_k = \mathbf{0}$ when the $\mathbf{x}$''s are linearly independent?'
  choices: ['Because $\mathbf{v}_k = \mathbf{0}$ would mean $\mathbf{x}_k$ lies in the span of $\mathbf{x}_1, \dots, \mathbf{x}_{k-1}$', 'Because projections are never zero', 'Because the $\mathbf{x}$''s are unit vectors', 'It can; you just skip that vector']
  answer: 0
  explanation: |-
    $\mathbf{v}_k = \mathbf{0}$ means $\mathbf{x}_k$ equals its projection onto $\operatorname{Span}\{\mathbf{v}_1, \dots, \mathbf{v}_{k-1}\} = \operatorname{Span}\{\mathbf{x}_1, \dots, \mathbf{x}_{k-1}\}$, contradicting independence. (With dependent inputs, a zero does appear and that vector is dropped.)

# --- Lesson 36: least squares (ids la-q-35NN) ---
- id: la-q-3501
  lesson: la-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'The least-squares solutions of $A\mathbf{x} = \mathbf{b}$ are the solutions of:'
  choices: ['$A\mathbf{x} = \mathbf{b}$', '$AA^T\mathbf{x} = \mathbf{b}$', '$A^TA\mathbf{x} = A^T\mathbf{b}$', '$A^T\mathbf{x} = \mathbf{b}$']
  answer: 2
  explanation: |-
    The residual $\mathbf{b} - A\hat{\mathbf{x}}$ must be orthogonal to $\operatorname{Col} A$, i.e. $A^T(\mathbf{b} - A\hat{\mathbf{x}}) = \mathbf{0}$: the normal equations.

- id: la-q-3502
  lesson: la-least-squares
  topic: Least squares
  stem: 'When is the least-squares solution of $A\mathbf{x} = \mathbf{b}$ unique?'
  choices: ['Always', 'When $A$ is square', 'When the columns of $A$ are linearly independent', 'When $\mathbf{b} = \mathbf{0}$']
  answer: 2
  explanation: |-
    Then $A^TA$ is invertible and $\hat{\mathbf{x}} = (A^TA)^{-1}A^T\mathbf{b}$. With dependent columns the normal equations have free variables.

- id: la-q-3503
  lesson: la-least-squares
  module_quiz: true
  topic: Linear regression
  stem: 'Find the least-squares line $y = \beta_0 + \beta_1x$ for the points $(0, 0)$, $(1, 2)$, $(2, 2)$.'
  choices: ['$y = x$', '$y = \tfrac13 + x$', '$y = \tfrac23 + \tfrac23x$', '$y = 1 + \tfrac12x$']
  answer: 1
  explanation: |-
    $n = 3$, $\sum x = 3$, $\sum x^2 = 5$, $\sum y = 4$, $\sum xy = 6$. Normal equations: $3\beta_0 + 3\beta_1 = 4$ and $3\beta_0 + 5\beta_1 = 6$. Subtracting, $2\beta_1 = 2$, so $\beta_1 = 1$ and $\beta_0 = 1/3$.

- id: la-q-3504
  lesson: la-least-squares
  topic: Linear regression
  stem: 'Fitting $y = \beta_0 + \beta_1x$, which row of the design matrix does the data point $(5, 2)$ give?'
  choices: ['$[\,5 \;\; 2\,]$', '$[\,1 \;\; 2\,]$', '$[\,1 \;\; 5\,]$', '$[\,2 \;\; 5\,]$']
  answer: 2
  explanation: |-
    Each row is $(1, x_i)$, matching $\beta_0 \cdot 1 + \beta_1 \cdot x_i$. The $y$-value 2 goes in the observation vector, not the design matrix.

- id: la-q-3505
  lesson: la-least-squares
  topic: Least squares
  stem: 'For $A = \begin{bmatrix} 2 & 0 \\ 0 & 1 \\ 1 & 1\end{bmatrix}$, what is $A^TA$?'
  choices: ['$\begin{bmatrix} 5 & 1 \\ 1 & 2\end{bmatrix}$', '$\begin{bmatrix} 4 & 0 & 2 \\ 0 & 1 & 1 \\ 2 & 1 & 2\end{bmatrix}$', '$\begin{bmatrix} 4 & 1 \\ 1 & 2\end{bmatrix}$', '$\begin{bmatrix} 5 & 0 \\ 0 & 2\end{bmatrix}$']
  answer: 0
  explanation: |-
    Entries are dot products of columns: $(2, 0, 1)\cdot(2, 0, 1) = 5$, $(2, 0, 1)\cdot(0, 1, 1) = 1$, $(0, 1, 1)\cdot(0, 1, 1) = 2$. The $3 \times 3$ choice is $AA^T$.

- id: la-q-3506
  lesson: la-least-squares
  topic: Least squares
  stem: 'What is the least-squares error?'
  choices: ['$\|\mathbf{b} - A\hat{\mathbf{x}}\|$', '$\|\hat{\mathbf{x}}\|$', '$\|A\hat{\mathbf{x}}\|$', '$\|\mathbf{b}\|^2$']
  answer: 0
  explanation: |-
    It's the distance from $\mathbf{b}$ to the closest point $A\hat{\mathbf{x}}$ of $\operatorname{Col} A$.

- id: la-q-3507
  lesson: la-least-squares
  module_quiz: true
  topic: Least squares
  stem: 'If $\hat{\mathbf{x}}$ is a least-squares solution, the residual vector $\mathbf{b} - A\hat{\mathbf{x}}$ is:'
  choices: ['zero', 'in $\operatorname{Col} A$', 'orthogonal to every column of $A$', 'parallel to $\mathbf{b}$']
  answer: 2
  explanation: |-
    $A\hat{\mathbf{x}}$ is the orthogonal projection of $\mathbf{b}$ onto $\operatorname{Col} A$, so what's left over lies in $(\operatorname{Col} A)^\perp = \operatorname{Nul} A^T$. It's zero only when the system is consistent.

- id: la-q-3508
  lesson: la-least-squares
  topic: Linear regression
  stem: 'To fit a parabola $y = \beta_0 + \beta_1x + \beta_2x^2$ by least squares, what does a data point $(x_i, y_i)$ contribute to the design matrix?'
  choices: ['The row $(1, x_i, x_i^2)$', 'The row $(x_i, y_i)$', 'The row $(1, x_i, y_i)$', 'The column $(1, x_i, x_i^2)$']
  answer: 0
  explanation: |-
    The model is linear in the parameters, so each point gives the equation $\beta_0 + \beta_1x_i + \beta_2x_i^2 = y_i$, with coefficient row $(1, x_i, x_i^2)$.

- id: la-q-3509
  lesson: la-least-squares
  topic: Least squares
  stem: 'Given $A = QR$ with $A$ having independent columns, the least-squares solution satisfies:'
  choices: ['$Q\hat{\mathbf{x}} = R^T\mathbf{b}$', '$Q^TR\hat{\mathbf{x}} = \mathbf{b}$', '$\hat{\mathbf{x}} = QR\mathbf{b}$', '$R\hat{\mathbf{x}} = Q^T\mathbf{b}$']
  answer: 3
  explanation: |-
    Substitute into the normal equations: $R^TQ^TQR\hat{\mathbf{x}} = R^TQ^T\mathbf{b}$, i.e. $R^TR\hat{\mathbf{x}} = R^TQ^T\mathbf{b}$; $R^T$ is invertible, so $R\hat{\mathbf{x}} = Q^T\mathbf{b}$, a triangular system.

- id: la-q-3510
  lesson: la-least-squares
  topic: Least squares
  stem: 'If $\mathbf{b}$ happens to lie in $\operatorname{Col} A$, what is the least-squares error?'
  choices: ['$\|\mathbf{b}\|$', '$0$', '$1$', 'It is undefined']
  answer: 1
  explanation: |-
    Then $A\mathbf{x} = \mathbf{b}$ is consistent, and any exact solution is a least-squares solution with residual $\mathbf{0}$.

