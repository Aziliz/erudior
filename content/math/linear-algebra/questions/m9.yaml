  explanation: |-
    Column 1 must be a unit eigenvector for 4, i.e. along $(1, 1)$; column 2 one for 2, along $(1, -1)$. Without the factor $\tfrac{1}{\sqrt2}$ (or with $\tfrac12$) the columns aren't unit vectors; the matrix with columns $(1, -1)$ and $(1, 1)$ puts the eigenvector for 2 first, mismatching $D$.

