    $\lambda_1\mathbf{v}_1\cdot\mathbf{v}_2 = \mathbf{v}_1^TA\mathbf{v}_2 = \lambda_2\mathbf{v}_1\cdot\mathbf{v}_2$ forces $\mathbf{v}_1\cdot\mathbf{v}_2 = 0$ when $\lambda_1 \ne \lambda_2$.

