  stem: 'In the spectral decomposition $A = \lambda_1\mathbf{u}_1\mathbf{u}_1^T + \cdots + \lambda_n\mathbf{u}_n\mathbf{u}_n^T$, what does the matrix $\mathbf{u}_j\mathbf{u}_j^T$ do to a vector $\mathbf{x}$?'
