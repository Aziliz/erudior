  distractors: ['Manufacturing used per dollar of manufacturing output', 'Total production']
  explanation: |-
    An arrow shows output flowing from the sector that makes it to the sector that uses it. Arrow 1 carries energy into manufacturing ($c_{12}$), arrow 2 carries manufactured goods into energy production ($c_{21}$), and loop 3 is energy used to make energy ($c_{11}$). The box that receives output from both sectors without sending anything back is final demand. The loop on Manufacturing ($c_{22}$) is not numbered.

- id: la-m1-r2-h21
  lesson: la-m1-h-leontief
  topic: The Leontief inverse
  stem: 'An economy has $C = \begin{bmatrix} 0.1 & 0.2 \\ 0.4 & 0.3\end{bmatrix}$ and final demand $\mathbf{d} = (50, 100)$. What production $\mathbf{x}$ meets it?'
  choices: ['$(75, 150)$', '$(50, 100)$', '$(55.6, 142.9)$', '$(100, 200)$']
  answer: 3
  explanation: |-
    $I - C = \begin{bmatrix} 0.9 & -0.2 \\ -0.4 & 0.7\end{bmatrix}$ has determinant $0.63 - 0.08 = 0.55$, and $\mathbf{x} = \frac{1}{0.55}\begin{bmatrix} 0.7 & 0.2 \\ 0.4 & 0.9\end{bmatrix}\begin{bmatrix} 50 \\ 100\end{bmatrix} = \frac{1}{0.55}\begin{bmatrix} 55 \\ 110\end{bmatrix} = (100, 200)$. Check: $C\mathbf{x} = (50, 100)$ and $\mathbf{x} - C\mathbf{x} = (50, 100)$. ✓
    $(75, 150)$ is $\mathbf{d} + C\mathbf{d}$, only the first round of production; $(50, 100)$ forgets intermediate demand; $(55.6, 142.9)$ divides by the diagonal of $I - C$ and ignores what the sectors buy from each other.

- id: la-m1-r2-h22
  lesson: la-m1-h-leontief
  topic: The Leontief inverse
  type: text
  stem: 'For $C = \begin{bmatrix} 0.2 & 0.4 \\ 0.3 & 0.1\end{bmatrix}$ the Leontief inverse is $\begin{bmatrix} 1.5 & 2/3 \\ 0.5 & 4/3\end{bmatrix}$. If final demand for energy (sector 1) rises by 20 and nothing else changes, energy production rises by ___ and manufacturing production by ___.'
  accept:
    - ['30']
    - ['10']
  explanation: |-
    $\Delta\mathbf{x} = (I - C)^{-1}\Delta\mathbf{d} = (I - C)^{-1}(20, 0) = 20 \times (\text{column } 1) = 20(1.5, 0.5) = (30, 10)$.

- id: la-m1-r2-h23
  lesson: la-m1-h-leontief
  topic: The Leontief inverse
  stem: 'Why are the diagonal entries of a Leontief inverse at least 1 for a productive economy?'
  choices: ['Because $(I - C)^{-1}$ always equals $I + C$', 'Because delivering one unit of a sector''s output to final demand also requires extra output of that sector to be used up in production', 'Because every column of $C$ adds up to less than 1', 'Because the determinant of $I - C$ is less than 1']
  answer: 1
  explanation: |-
    Column $j$ of $(I - C)^{-1}$ is the total production behind one unit of final demand for sector $j$. That includes the unit itself plus whatever of sector $j$'s output the rounds of production use up, so the $j$th entry is at least 1. In symbols, $(I - C)^{-1} = I + C + C^2 + \cdots$, and the terms after $I$ have no negative entries. $(I - C)^{-1}$ is not just $I + C$, and the column-sum condition and the determinant don't by themselves explain the meaning.

- id: la-m1-r2-h24
  lesson: la-m1-h-leontief
  topic: The Leontief inverse
  stem: 'With $C = \begin{bmatrix} 0.2 & 0.4 \\ 0.3 & 0.1\end{bmatrix}$ and $\mathbf{d} = (10, 20)$, what is the running total of production after the first two rounds, $\mathbf{d} + C\mathbf{d}$?'
  choices: ['$(10, 5)$', '$(18, 26)$', '$(20, 25)$', '$(10, 20)$']
  answer: 2
  explanation: |-
    $C\mathbf{d} = (0.2 \cdot 10 + 0.4 \cdot 20,\ 0.3 \cdot 10 + 0.1 \cdot 20) = (10, 5)$, so $\mathbf{d} + C\mathbf{d} = (20, 25)$. Later rounds keep adding smaller amounts.
    $(10, 5)$ is the second round alone, $(18, 26)$ multiplies by the columns of $C$ instead of the rows (using $C^T$), and $(10, 20)$ is the final demand with no production rounds at all.

- id: la-m1-r2-h25
  lesson: la-m1-h-leontief
  topic: The Leontief inverse
  stem: 'For $C = \begin{bmatrix} 0.5 & 0.6 \\ 0.7 & 0.5\end{bmatrix}$ and $\mathbf{d} = (17, 17)$, solving $(I - C)\mathbf{x} = \mathbf{d}$ gives $\mathbf{x} = (-110, -120)$. What does this tell you?'
  choices: ['The sectors use up more than they make, so $C$ is not productive and no real production plan meets this demand', 'There is an arithmetic slip, because $(I - C)\mathbf{x} = \mathbf{d}$ always has a positive solution', 'Both sectors should shut down and import their goods', 'The final demand is too small and should be increased']
  answer: 0
  explanation: |-
    The column sums are 1.2 and 1.1: each sector uses more than a dollar of inputs per dollar of output. Here $\det(I - C) = 0.25 - 0.42 = -0.17$ and every entry of $(I - C)^{-1}$ is negative, so every positive demand leads to negative "production", which is meaningless. The solution is correct algebra; the model's assumption (a productive economy) fails. Making the demand larger would only make the answer more negative, and the model says nothing about importing.

- id: la-m1-r2-h26
  lesson: la-m1-h-leontief
  topic: Input–output model
  type: text
  stem: 'For $C = \begin{bmatrix} 0.2 & 0.4 \\ 0.3 & 0.1\end{bmatrix}$, the entry in row 1, column 2 of $I - C$ is ___.'
  accept: ['-0.4', '-2/5']
  explanation: |-
    $I - C$ subtracts every entry of $C$ from the identity. Off the diagonal $I$ has 0, so the entry is $0 - 0.4 = -0.4$. (Only the diagonal entries become $1 - c_{ii}$.)
