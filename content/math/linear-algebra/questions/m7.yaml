# Module 7: vector spaces

# --- Lesson 22: vector spaces and subspaces ---
- id: la-q-2201
  lesson: la-vector-spaces
  module_quiz: true
  topic: Subspaces
  stem: 'Which set is a subspace of $\mathbb{R}^2$?'
  choices: ['The line $y = 3x$', 'The line $y = 3x + 1$', 'The first quadrant $\{(x, y) : x \ge 0, y \ge 0\}$', 'The union of the $x$-axis and the $y$-axis']
  answer: 0
  explanation: |-
    $y = 3x$ is $\operatorname{Span}\{(1, 3)\}$, a line through the origin. $y = 3x + 1$ misses the origin; the quadrant isn't closed under multiplication by $-1$; the union of axes isn't closed under addition.

- id: la-q-2202
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'Which set is **not** a subspace of $\mathbb{R}^3$?'
  choices: ['The plane $x + y + z = 0$', 'The $z$-axis', '$\{\mathbf{0}\}$', 'The plane $x + y + z = 1$']
  answer: 3
  explanation: |-
    $(0, 0, 0)$ doesn't satisfy $x + y + z = 1$, so that plane isn't a subspace. The others are a plane and a line through the origin, and the zero subspace.

- id: la-q-2203
  lesson: la-vector-spaces
  module_quiz: true
  topic: Vector spaces
  stem: 'Which of these is a vector in $\mathbb{P}_2$?'
  choices: ['$t^3 - 1$', '$4 - t^2$', '$\dfrac{1}{t}$', '$\sqrt{t}$']
  answer: 1
  explanation: |-
    $\mathbb{P}_2$ contains polynomials of degree at most 2. $t^3 - 1$ has degree 3, and $1/t$ and $\sqrt t$ aren't polynomials.

- id: la-q-2204
  lesson: la-vector-spaces
  module_quiz: true
  topic: Subspaces
  stem: 'Why is $\{p \in \mathbb{P}_2 : p(0) = 3\}$ not a subspace of $\mathbb{P}_2$?'
  choices: ['It contains polynomials of degree 2', 'It has infinitely many elements', 'It is not closed under multiplication by $1$', 'It does not contain the zero polynomial']
  answer: 3
  explanation: |-
    The zero polynomial has value 0 at $t = 0$, not 3. (It also fails closure: the sum of two such polynomials has value 6 at 0.) By contrast, $\{p : p(0) = 0\}$ is a subspace.

- id: la-q-2205
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'Write $H = \{(a + 2b,\ a,\ -b) : a, b \text{ real}\}$ as a span.'
  choices: ['$\operatorname{Span}\{(1, 2, 0), (1, 0, -1)\}$', '$\operatorname{Span}\{(1, 1, 0), (2, 0, -1)\}$', '$\operatorname{Span}\{(1, 1, -1)\}$', '$\operatorname{Span}\{(3, 1, -1)\}$']
  answer: 1
  explanation: |-
    $(a + 2b, a, -b) = a(1, 1, 0) + b(2, 0, -1)$. Since it's a span, $H$ is a subspace of $\mathbb{R}^3$ (a plane through the origin).

- id: la-q-2206
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'The first quadrant $\{(x, y) : x \ge 0, y \ge 0\}$ fails which subspace condition?'
  choices: ['It doesn''t contain $\mathbf{0}$', 'It isn''t closed under addition', 'It isn''t closed under scalar multiplication', 'It satisfies all three']
  answer: 2
  explanation: |-
    $(1, 1)$ is in it but $-1 \cdot (1, 1) = (-1, -1)$ is not. It does contain $\mathbf{0}$ and sums of first-quadrant vectors stay in the first quadrant.

- id: la-q-2207
  lesson: la-vector-spaces
  module_quiz: true
  topic: Subspaces
  stem: 'Which set of $2 \times 2$ matrices is a subspace of $M_{2\times 2}$?'
  choices: ['The invertible matrices', 'The matrices with determinant 1', 'The matrices whose diagonal entries add to 0', 'The matrices with all entries positive']
  answer: 2
  explanation: |-
    If $a + d = 0$ and $a' + d' = 0$, then sums and multiples also have diagonal sum 0, and the zero matrix qualifies. The invertible matrices and the determinant-1 matrices don't contain the zero matrix; positive matrices fail under negative scalars.

- id: la-q-2208
  lesson: la-vector-spaces
  topic: Vector spaces
  stem: 'Why is the set of polynomials of degree **exactly** 2 (with the usual operations) not a vector space?'
  choices: ['It has no negatives', 'Multiplication by 2 can raise the degree', 'Polynomials can''t be added', 'It isn''t closed under addition: $t^2 + (-t^2 + t) = t$ has degree 1']
  answer: 3
  explanation: |-
    The sum of two degree-2 polynomials can have lower degree, and the zero polynomial isn't in the set at all. That's why we use $\mathbb{P}_2$, degree *at most* 2.

- id: la-q-2209
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'Which statement is always true for vectors $\mathbf{v}_1, \dots, \mathbf{v}_p$ in a vector space $V$?'
  choices: ['$\operatorname{Span}\{\mathbf{v}_1, \dots, \mathbf{v}_p\}$ is a subspace of $V$', '$\operatorname{Span}\{\mathbf{v}_1, \dots, \mathbf{v}_p\} = V$', 'The span has exactly $p$ elements', 'The span does not contain $\mathbf{0}$']
  answer: 0
  explanation: |-
    It contains $\mathbf{0}$ and is closed under addition and scaling, because combinations of combinations are combinations. It equals $V$ only if the vectors span $V$, and it's infinite unless it's $\{\mathbf{0}\}$.

- id: la-q-2210
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'Which list gives all the subspaces of $\mathbb{R}^3$?'
  choices: ['Lines and planes', 'Lines through the origin and planes through the origin', '$\{\mathbf{0}\}$, lines through the origin, planes through the origin, and $\mathbb{R}^3$', 'Every line and every plane, plus $\mathbb{R}^3$']
  answer: 2
  explanation: |-
    A subspace must contain $\mathbf{0}$, so only flats through the origin qualify, and the zero subspace and $\mathbb{R}^3$ itself count too (dimensions 0 and 3).

- id: la-q-2211
  lesson: la-vector-spaces
  topic: Vector spaces
  stem: 'What is the zero vector of the vector space $M_{2\times 3}$?'
  choices: ['The number 0', 'The zero vector in $\mathbb{R}^6$', 'The $2 \times 2$ identity matrix', 'The $2 \times 3$ matrix with every entry 0']
  answer: 3
  explanation: |-
    Vectors in $M_{2\times 3}$ are $2 \times 3$ matrices, and $A + 0 = A$ requires the zero matrix of that size.

- id: la-q-2212
  lesson: la-vector-spaces
  topic: Subspaces
  stem: 'A student says $\{(x, y) : xy = 0\}$ is a subspace of $\mathbb{R}^2$ because it contains $(0, 0)$ and $3(x, y)$ stays in the set. What''s the flaw?'
  choices: ['It doesn''t contain $(0, 0)$', 'It isn''t closed under addition: $(1, 0) + (0, 1) = (1, 1)$, and $1 \cdot 1 \ne 0$', 'It isn''t closed under scalar multiplication', 'There is no flaw']
  answer: 1
  explanation: |-
    This set is the union of the two axes. All three conditions must hold for all vectors; one failure, like this sum, rules it out.

# --- Lesson 23: null space and column space ---
- id: la-q-2301
  lesson: la-nul-col
  module_quiz: true
  topic: Null space
  stem: 'Let $A = \begin{bmatrix} 1 & -2 & 0 & 3 \\ 2 & -4 & 1 & 4\end{bmatrix}$. Which vector is in $\operatorname{Nul} A$?'
  choices: ['$(1, 2, 0, 0)$', '$(3, 0, 2, 1)$', '$(2, 1, 0, 0)$', '$(0, 0, 1, 0)$']
  answer: 2
  explanation: |-
    $A(2, 1, 0, 0) = (2 - 2,\ 4 - 4) = (0, 0)$. ✓ For $(1, 2, 0, 0)$ you get $(-3, -6)$; for $(3, 0, 2, 1)$, $(6, 12)$; for $(0, 0, 1, 0)$, $(0, 1)$.

- id: la-q-2302
  lesson: la-nul-col
  topic: Null space
  stem: '$A$ is $3 \times 5$. $\operatorname{Nul} A$ and $\operatorname{Col} A$ are subspaces of which spaces?'
  choices: ['$\operatorname{Nul} A \subseteq \mathbb{R}^3$, $\operatorname{Col} A \subseteq \mathbb{R}^5$', 'Both of $\mathbb{R}^3$', 'Both of $\mathbb{R}^5$', '$\operatorname{Nul} A \subseteq \mathbb{R}^5$, $\operatorname{Col} A \subseteq \mathbb{R}^3$']
  answer: 3
  explanation: |-
    Null-space vectors are inputs $\mathbf{x}$ (5 entries, one per column). Column-space vectors are outputs $A\mathbf{x}$ (3 entries, like the columns).

- id: la-q-2303
  lesson: la-nul-col
  topic: Column space
  stem: 'For an $m \times n$ matrix $A$, $\operatorname{Col} A = \mathbb{R}^m$ exactly when:'
  choices: ['$A$ has a pivot in every row', '$A$ has a pivot in every column', '$\operatorname{Nul} A = \{\mathbf{0}\}$', '$A$ is square']
  answer: 0
  explanation: |-
    $\operatorname{Col} A = \mathbb{R}^m$ means $A\mathbf{x} = \mathbf{b}$ is solvable for every $\mathbf{b}$, i.e. a pivot in every row.

- id: la-q-2304
  lesson: la-nul-col
  module_quiz: true
  topic: Null space
  stem: '$A$ has RREF $\begin{bmatrix} 1 & 3 & 0 & -2 \\ 0 & 0 & 1 & 4\end{bmatrix}$. Which set spans $\operatorname{Nul} A$?'
  choices: ['$\{(-3, 1, 0, 0),\ (2, 0, -4, 1)\}$', '$\{(3, 1, 0, 0),\ (-2, 0, 4, 1)\}$', '$\{(1, 0),\ (0, 1)\}$', '$\{(1, 3, 0, -2),\ (0, 0, 1, 4)\}$']
  answer: 0
  explanation: |-
    $x_1 = -3x_2 + 2x_4$ and $x_3 = -4x_4$ with $x_2, x_4$ free, so $\mathbf{x} = x_2(-3, 1, 0, 0) + x_4(2, 0, -4, 1)$. The last choice lists the rows of the RREF, which span $\operatorname{Row} A$, not $\operatorname{Nul} A$.

- id: la-q-2305
  lesson: la-nul-col
  topic: Column space
  stem: 'How do you decide whether a given $\mathbf{b}$ is in $\operatorname{Col} A$?'
  choices: ['Compute $A\mathbf{b}$ and see if it is $\mathbf{0}$', 'Check whether $A\mathbf{x} = \mathbf{b}$ is consistent', 'Check whether $\mathbf{b}$ is a row of $A$', 'Check whether $\mathbf{b}$ has as many entries as $A$ has columns']
  answer: 1
  explanation: |-
    $\mathbf{b}$ is in $\operatorname{Col} A$ exactly when it's a combination of the columns, i.e. when $A\mathbf{x} = \mathbf{b}$ has a solution. Computing $A\mathbf{b}$ is the test for the *null* space.

- id: la-q-2306
  lesson: la-nul-col
  module_quiz: true
  topic: Column space
  stem: 'Which subspaces are unchanged by row operations on $A$?'
  choices: ['$\operatorname{Col} A$ only', 'None of them', 'All three', '$\operatorname{Nul} A$ and $\operatorname{Row} A$, but not $\operatorname{Col} A$']
  answer: 3
  explanation: |-
    Row operations don't change the solutions of $A\mathbf{x} = \mathbf{0}$ or the span of the rows, but they do change the columns: $\begin{bmatrix} 1 \\ 1\end{bmatrix}$ spans a different line than its echelon form $\begin{bmatrix} 1 \\ 0\end{bmatrix}$.

- id: la-q-2307
  lesson: la-nul-col
  topic: Null space
  stem: 'For $T(\mathbf{x}) = A\mathbf{x}$, what is the kernel of $T$?'
  choices: ['$\operatorname{Col} A$', '$\operatorname{Row} A$', '$\operatorname{Nul} A$', 'The codomain']
  answer: 2
  explanation: |-
    The kernel is the set of inputs sent to $\mathbf{0}$, i.e. the solutions of $A\mathbf{x} = \mathbf{0}$. The range is $\operatorname{Col} A$.

- id: la-q-2308
  lesson: la-nul-col
  topic: Null space
  stem: 'The differentiation map $D(p) = p''$ goes from $\mathbb{P}_3$ to $\mathbb{P}_2$. What is its kernel?'
  choices: ['$\{0\}$ only', 'The constant polynomials', 'All of $\mathbb{P}_2$', 'The polynomials of degree 3']
  answer: 1
  explanation: |-
    $p' = 0$ exactly when $p$ is constant, so the kernel is $\{c : c \text{ real}\}$, a 1-dimensional subspace.

- id: la-q-2309
  lesson: la-nul-col
  topic: Null space
  stem: '$\operatorname{Nul} A = \{\mathbf{0}\}$ exactly when:'
  choices: ['the columns of $A$ are linearly independent', 'the columns of $A$ span $\mathbb{R}^m$', '$A$ has a zero column', '$A$ has more columns than rows']
  answer: 0
  explanation: |-
    $\operatorname{Nul} A = \{\mathbf{0}\}$ means $A\mathbf{x} = \mathbf{0}$ has only the trivial solution, which is the definition of independent columns (and of $T$ being one-to-one).

- id: la-q-2310
  lesson: la-nul-col
  topic: Column space
  stem: 'Describe $\operatorname{Col} A$ for $A = \begin{bmatrix} 1 & 2 \\ 2 & 4 \\ -1 & -2\end{bmatrix}$.'
  choices: ['All of $\mathbb{R}^3$', 'A plane through the origin in $\mathbb{R}^3$', 'The line spanned by $(1, 2, -1)$', 'The line spanned by $(-2, 1)$']
  answer: 2
  explanation: |-
    Column 2 is twice column 1, so the columns span only the line through $(1, 2, -1)$. $(-2, 1)$ spans $\operatorname{Nul} A$, which lives in $\mathbb{R}^2$.

- id: la-q-2311
  lesson: la-nul-col
  topic: Null space
  stem: '$A$ is $4 \times 6$. $\operatorname{Nul} A$ is a subspace of:'
  choices: ['$\mathbb{R}^4$', '$\mathbb{R}^{24}$', '$\mathbb{R}^{10}$', '$\mathbb{R}^6$']
  answer: 3
  explanation: |-
    $A\mathbf{x}$ requires $\mathbf{x}$ to have 6 entries (one per column).

- id: la-q-2312
  lesson: la-nul-col
  module_quiz: true
  topic: Column space
  stem: 'Which vector is in $\operatorname{Col} A$ for $A = \begin{bmatrix} 1 & 0 \\ 0 & 1 \\ 1 & 1\end{bmatrix}$?'
  choices: ['$(2, 3, 1)$', '$(1, 1, 0)$', '$(0, 0, 1)$', '$(2, 3, 5)$']
  answer: 3
  explanation: |-
    $A(x_1, x_2) = (x_1, x_2, x_1 + x_2)$, so a vector is in $\operatorname{Col} A$ exactly when its third entry is the sum of the first two: $2 + 3 = 5$. ✓

# --- Lesson 24: bases ---
- id: la-q-2401
  lesson: la-bases
  topic: Bases
  stem: 'Which set is a basis for $\mathbb{R}^2$?'
  choices: ['$\{(1, 2), (2, 4)\}$', '$\{(1, 0)\}$', '$\{(1, 0), (0, 1), (1, 1)\}$', '$\{(1, 2), (3, 5)\}$']
  answer: 3
  explanation: |-
    $\det\begin{bmatrix} 1 & 3 \\ 2 & 5\end{bmatrix} = -1 \neq 0$, so the two vectors are independent and span $\mathbb{R}^2$. The others are dependent, too small, or too large.

- id: la-q-2402
  lesson: la-bases
  module_quiz: true
  topic: Bases
  stem: 'Which vectors form a basis for $\operatorname{Col} A$?'
  choices: ['The pivot columns of the RREF of $A$', 'All the columns of $A$', 'The pivot columns of $A$ itself', 'The nonzero rows of the RREF']
  answer: 2
  explanation: |-
    Row operations preserve the dependence relations among columns, so the RREF tells you *which* columns to take; but row operations change the column space, so take those columns from $A$.

- id: la-q-2403
  lesson: la-bases
  topic: Bases
  stem: '$A = \begin{bmatrix} 1 & 2 & -1 & 3 \\ 2 & 4 & 1 & 0 \\ 3 & 6 & 0 & 3\end{bmatrix}$ has RREF $\begin{bmatrix} 1 & 2 & 0 & 1 \\ 0 & 0 & 1 & -2 \\ 0 & 0 & 0 & 0\end{bmatrix}$. Which is a basis for $\operatorname{Col} A$?'
  choices: ['$\{(1, 0, 0), (0, 1, 0)\}$', '$\{(1, 2, 3), (-1, 1, 0)\}$', '$\{(1, 2, 3), (2, 4, 6)\}$', '$\{(1, 2, 0, 1), (0, 0, 1, -2)\}$']
  answer: 1
  explanation: |-
    Pivots are in columns 1 and 3, so take columns 1 and 3 of $A$. $(1, 0, 0)$ and $(0, 1, 0)$ are pivot columns of the RREF and aren't in $\operatorname{Col} A$; the last choice is a basis for $\operatorname{Row} A$.

- id: la-q-2404
  lesson: la-bases
  topic: Bases
  stem: 'Which gives a basis for $\operatorname{Row} A$?'
  choices: ['The rows of $A$', 'The nonzero rows of an echelon form of $A$', 'The pivot columns of $A$', 'The columns of $A^{-1}$']
  answer: 1
  explanation: |-
    Row operations preserve the row space, and the staircase of leading entries makes the nonzero echelon rows independent. The rows of $A$ themselves may be dependent.

- id: la-q-2405
  lesson: la-bases
  topic: Bases
  stem: 'What is the standard basis for $\mathbb{P}_2$?'
  choices: ['$\{1, t, t^2\}$', '$\{t, t^2\}$', '$\{1, t^2\}$', '$\{1, 2, 3\}$']
  answer: 0
  explanation: |-
    Every $a_0 + a_1t + a_2t^2$ is a unique combination of $1, t, t^2$. Leaving out $1$ would miss the constants.

- id: la-q-2406
  lesson: la-bases
  module_quiz: true
  topic: Bases
  stem: 'Is $\{(1, 0, 2), (0, 1, -1), (1, 1, 2)\}$ a basis for $\mathbb{R}^3$?'
  choices: ['No, the vectors are dependent', 'No, three vectors can''t span $\mathbb{R}^3$', 'Yes, the matrix with these columns has 3 pivots', 'Only if they are orthogonal']
  answer: 2
  explanation: |-
    Row-reducing $\begin{bmatrix} 1 & 0 & 1 \\ 0 & 1 & 1 \\ 2 & -1 & 2\end{bmatrix}$ gives pivots in all three columns (its determinant is 1), so by the IMT the columns are independent and span $\mathbb{R}^3$.

- id: la-q-2407
  lesson: la-bases
  topic: Bases
  stem: '$\{\mathbf{v}_1, \mathbf{v}_2\}$ is independent and $\mathbf{v}_3 = 2\mathbf{v}_1 - \mathbf{v}_2$. What is a basis for $H = \operatorname{Span}\{\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3\}$?'
  choices: ['$\{\mathbf{v}_1, \mathbf{v}_2, \mathbf{v}_3\}$', '$\{\mathbf{v}_3\}$', '$\{\mathbf{v}_1, \mathbf{v}_2\}$', '$\{\mathbf{v}_1\}$']
  answer: 2
  explanation: |-
    By the spanning set theorem, removing $\mathbf{v}_3$ (a combination of the others) doesn't shrink the span, and $\{\mathbf{v}_1, \mathbf{v}_2\}$ is independent. $\{\mathbf{v}_1\}$ alone doesn't reach $\mathbf{v}_2$.

- id: la-q-2408
  lesson: la-bases
  topic: Bases
  stem: 'Can a basis contain the zero vector?'
  choices: ['Yes, if the space is $\{\mathbf{0}\}$', 'Yes, always', 'Only in $\mathbb{R}^n$', 'No, any set containing $\mathbf{0}$ is linearly dependent']
  answer: 3
  explanation: |-
    $1\cdot\mathbf{0} = \mathbf{0}$ is a nontrivial dependence relation. (The zero subspace has the empty set as its basis.)

- id: la-q-2409
  lesson: la-bases
  topic: Bases
  stem: 'Which description of a basis for a subspace $H$ is correct?'
  choices: ['Any spanning set of $H$', 'Any independent set in $H$', 'A spanning set of $H$ that is as small as possible', 'A set with more vectors than $H$ has dimensions']
  answer: 2
  explanation: |-
    A basis is a minimal spanning set (and also a maximal independent set). A spanning set may have extra vectors; an independent set may not span.

- id: la-q-2410
  lesson: la-bases
  module_quiz: true
  topic: Bases
  stem: '$A$ has RREF $\begin{bmatrix} 1 & 0 & 2 \\ 0 & 1 & -1\end{bmatrix}$. Find a basis for $\operatorname{Nul} A$.'
  choices: ['$\{(2, -1, 1)\}$', '$\{(-2, 1, 1)\}$', '$\{(1, 0), (0, 1)\}$', '$\{(-2, 1, 0)\}$']
  answer: 1
  explanation: |-
    $x_1 = -2x_3$, $x_2 = x_3$, $x_3$ free, so $\mathbf{x} = x_3(-2, 1, 1)$. The first choice forgets to flip signs; the last forgets the 1 in the $x_3$ slot.

- id: la-q-2411
  lesson: la-bases
  topic: Bases
  stem: 'Why are the columns of an invertible $n \times n$ matrix a basis for $\mathbb{R}^n$?'
  choices: ['Because invertible matrices are triangular', 'Because by the IMT they are linearly independent and span $\mathbb{R}^n$', 'Because their entries are nonzero', 'Because they are orthogonal']
  answer: 1
  explanation: |-
    Both basis conditions are IMT statements, so they hold together for an invertible matrix.

- id: la-q-2412
  lesson: la-bases
  topic: Bases
  stem: 'Why do row operations not change the dependence relations among the columns of a matrix?'
  choices: ['Because they don''t change the columns', 'Because the determinant is unchanged', 'Because row operations are linear', 'Because row-equivalent $A$ and $B$ have the same solutions to $A\mathbf{x} = \mathbf{0}$ and $B\mathbf{x} = \mathbf{0}$, and those solutions are the dependence relations']
  answer: 3
  explanation: |-
    A dependence relation $x_1\mathbf{a}_1 + \cdots + x_n\mathbf{a}_n = \mathbf{0}$ is just a solution of $A\mathbf{x} = \mathbf{0}$, and row operations preserve that solution set. So relations visible in the RREF also hold for the original columns.

# --- Lesson 25: coordinates and change of basis ---
- id: la-q-2501
  lesson: la-coordinates
  module_quiz: true
  topic: Coordinates
  stem: 'Let $\mathcal{B} = \{(1, 1), (1, -1)\}$. Find $[\mathbf{x}]_{\mathcal{B}}$ for $\mathbf{x} = (5, 1)$.'
  choices: ['$(5, 1)$', '$(2, 3)$', '$(3, 2)$', '$(6, 4)$']
  answer: 2
  explanation: |-
    Solve $c_1(1, 1) + c_2(1, -1) = (5, 1)$: $c_1 + c_2 = 5$ and $c_1 - c_2 = 1$, so $c_1 = 3$, $c_2 = 2$. Check: $(3 + 2, 3 - 2) = (5, 1)$. ✓

- id: la-q-2502
  lesson: la-coordinates
  topic: Coordinates
  stem: '$\mathcal{B} = \{(1, 3), (2, 1)\}$ and $[\mathbf{x}]_{\mathcal{B}} = (2, -1)$. What is $\mathbf{x}$?'
  choices: ['$(0, 5)$', '$(2, -1)$', '$(4, 5)$', '$(-3, 5)$']
  answer: 0
  explanation: |-
    $\mathbf{x} = 2(1, 3) - 1(2, 1) = (0, 5)$. The coordinate vector lists weights, not the vector itself.

- id: la-q-2503
  lesson: la-coordinates
  topic: Coordinates
  stem: 'With $P_{\mathcal{B}} = [\,\mathbf{b}_1 \;\cdots\; \mathbf{b}_n\,]$, which equation is correct?'
  choices: ['$[\mathbf{x}]_{\mathcal{B}} = P_{\mathcal{B}}\mathbf{x}$', '$\mathbf{x} = P_{\mathcal{B}}[\mathbf{x}]_{\mathcal{B}}$', '$\mathbf{x} = P_{\mathcal{B}}^T[\mathbf{x}]_{\mathcal{B}}$', '$\mathbf{x} = [\mathbf{x}]_{\mathcal{B}}P_{\mathcal{B}}$']
  answer: 1
  explanation: |-
    $P_{\mathcal{B}}[\mathbf{x}]_{\mathcal{B}} = c_1\mathbf{b}_1 + \cdots + c_n\mathbf{b}_n = \mathbf{x}$. To go the other way, use $P_{\mathcal{B}}^{-1}$.

- id: la-q-2504
  lesson: la-coordinates
  topic: Coordinates
  stem: 'What is the coordinate vector of $p(t) = 2 - t + 4t^2$ relative to the standard basis $\{1, t, t^2\}$ of $\mathbb{P}_2$?'
  choices: ['$(4, -1, 2)$', '$(2, 1, 4)$', '$(2, -1, 4)$', '$(2, -1, 4, 0)$']
  answer: 2
  explanation: |-
    The weights on $1, t, t^2$ in that order are $2, -1, 4$. The order of the basis determines the order of the coordinates.

- id: la-q-2505
  lesson: la-coordinates
  module_quiz: true
  topic: Coordinates
  stem: '$\mathcal{B} = \{1,\ 1 + t\}$ is a basis for $\mathbb{P}_1$. Find the $\mathcal{B}$-coordinates of $p(t) = 5 + 3t$.'
  choices: ['$(5, 3)$', '$(3, 2)$', '$(8, 3)$', '$(2, 3)$']
  answer: 3
  explanation: |-
    $a\cdot 1 + b(1 + t) = (a + b) + bt$. Matching: $b = 3$ and $a + b = 5$, so $a = 2$. Check: $2 + 3(1 + t) = 5 + 3t$. ✓

- id: la-q-2506
  lesson: la-coordinates
  topic: Change of basis
  stem: 'The columns of $P_{\mathcal{C} \leftarrow \mathcal{B}}$ are:'
  choices: ['the vectors of $\mathcal{C}$', 'the $\mathcal{B}$-coordinates of the vectors of $\mathcal{C}$', 'the $\mathcal{C}$-coordinates of the vectors of $\mathcal{B}$', 'the vectors of $\mathcal{B}$']
  answer: 2
  explanation: |-
    $[\mathbf{x}]_{\mathcal{C}} = P_{\mathcal{C} \leftarrow \mathcal{B}}[\mathbf{x}]_{\mathcal{B}}$; applying it to $[\mathbf{b}_j]_{\mathcal{B}} = \mathbf{e}_j$ shows column $j$ must be $[\mathbf{b}_j]_{\mathcal{C}}$.

- id: la-q-2507
  lesson: la-coordinates
  topic: Change of basis
  stem: 'In $\mathbb{R}^n$, which row reduction produces $P_{\mathcal{C} \leftarrow \mathcal{B}}$?'
  choices: ['$[\,\mathcal{B} \;|\; \mathcal{C}\,] \sim [\,I \;|\; P_{\mathcal{C} \leftarrow \mathcal{B}}\,]$', '$[\,\mathcal{C} \;|\; \mathcal{B}\,] \sim [\,I \;|\; P_{\mathcal{C} \leftarrow \mathcal{B}}\,]$', '$[\,\mathcal{C} \;|\; I\,] \sim [\,I \;|\; P_{\mathcal{C} \leftarrow \mathcal{B}}\,]$', '$[\,\mathcal{B} \;|\; I\,] \sim [\,I \;|\; P_{\mathcal{C} \leftarrow \mathcal{B}}\,]$']
  answer: 1
  explanation: |-
    Reducing $[\,\mathbf{c}_1 \cdots \mathbf{c}_n \;|\; \mathbf{b}_j\,]$ solves for $[\mathbf{b}_j]_{\mathcal{C}}$; doing all $j$ at once gives $P_{\mathcal{C} \leftarrow \mathcal{B}} = P_{\mathcal{C}}^{-1}P_{\mathcal{B}}$. The target basis $\mathcal{C}$ goes on the left.

- id: la-q-2508
  lesson: la-coordinates
  topic: Change of basis
  stem: 'How is $P_{\mathcal{B} \leftarrow \mathcal{C}}$ related to $P_{\mathcal{C} \leftarrow \mathcal{B}}$?'
  choices: ['They are equal', 'They are transposes', 'They are inverses', 'They are negatives']
  answer: 2
  explanation: |-
    Converting $\mathcal{B}$-coordinates to $\mathcal{C}$-coordinates and back must return the original coordinates, so the product is $I$.

- id: la-q-2509
  lesson: la-coordinates
  module_quiz: true
  topic: Change of basis
  stem: '$P_{\mathcal{C} \leftarrow \mathcal{B}} = \begin{bmatrix} 0 & -1 \\ 1 & 2\end{bmatrix}$ and $[\mathbf{x}]_{\mathcal{B}} = (1, 1)$. Find $[\mathbf{x}]_{\mathcal{C}}$.'
  choices: ['$(-1, 3)$', '$(1, 1)$', '$(1, 2)$', '$(3, -1)$']
  answer: 0
  explanation: |-
    $[\mathbf{x}]_{\mathcal{C}} = P_{\mathcal{C} \leftarrow \mathcal{B}}[\mathbf{x}]_{\mathcal{B}} = (0 - 1,\ 1 + 2) = (-1, 3)$.

- id: la-q-2510
  lesson: la-coordinates
  topic: Coordinates
  stem: 'For a basis $\mathcal{B}$ of an $n$-dimensional space $V$, the coordinate mapping $\mathbf{x} \mapsto [\mathbf{x}]_{\mathcal{B}}$ is:'
  choices: ['linear but not one-to-one', 'one-to-one but not onto $\mathbb{R}^n$', 'a one-to-one linear transformation from $V$ onto $\mathbb{R}^n$ (an isomorphism)', 'not linear']
  answer: 2
  explanation: |-
    Unique representation makes it one-to-one, every list of weights gives some vector (onto), and coordinates of sums and multiples are sums and multiples of coordinates (linear).

- id: la-q-2511
  lesson: la-coordinates
  topic: Coordinates
  stem: 'If $[\mathbf{x}]_{\mathcal{B}} = (4, 7)$ for $\mathcal{B} = \{\mathbf{b}_1, \mathbf{b}_2\}$, what is $[\mathbf{x}]$ relative to $\mathcal{B}'' = \{\mathbf{b}_2, \mathbf{b}_1\}$?'
  choices: ['$(7, 4)$', '$(4, 7)$', '$(-4, -7)$', 'It can''t be determined']
  answer: 0
  explanation: |-
    $\mathbf{x} = 4\mathbf{b}_1 + 7\mathbf{b}_2 = 7\mathbf{b}_2 + 4\mathbf{b}_1$. Reordering the basis reorders the coordinates, which is why a basis is treated as an ordered list.

- id: la-q-2512
  lesson: la-coordinates
  topic: Coordinates
  stem: 'Why are $\mathcal{B}$-coordinates unique?'
  choices: ['Because $\mathcal{B}$ spans $V$', 'Because $\mathcal{B}$ is linearly independent: two different weight lists would give a nontrivial dependence relation', 'Because $\mathcal{B}$ contains the standard basis', 'Because $V = \mathbb{R}^n$']
  answer: 1
  explanation: |-
    If $\sum c_i\mathbf{b}_i = \sum d_i\mathbf{b}_i$, then $\sum (c_i - d_i)\mathbf{b}_i = \mathbf{0}$, so independence forces $c_i = d_i$. Spanning gives existence, not uniqueness.

# --- Lesson 26: dimension and rank ---
- id: la-q-2601
  lesson: la-dim-rank
  module_quiz: true
  topic: Dimension
  stem: 'What is $\dim \mathbb{P}_3$?'
  choices: ['3', 'Infinite', '2', '4']
  answer: 3
  explanation: |-
    The standard basis $\{1, t, t^2, t^3\}$ has 4 vectors. Don't forget the constant term.

- id: la-q-2602
  lesson: la-dim-rank
  module_quiz: true
  topic: Rank
  stem: 'A $7 \times 5$ matrix has rank 3. What is $\dim\operatorname{Nul} A$?'
  choices: ['4', '2', '3', '5']
  answer: 1
  explanation: |-
    Rank theorem: rank + nullity = number of columns $= 5$, so nullity $= 5 - 3 = 2$. Using the number of rows (7) gives the wrong answer 4.

- id: la-q-2603
  lesson: la-dim-rank
  topic: Rank
  stem: 'Can a $4 \times 7$ matrix have a 2-dimensional null space?'
  choices: ['Yes, if its rank is 5', 'Yes, always', 'No: its rank is at most 4, so its nullity is at least 3', 'No: its nullity must be exactly 4']
  answer: 2
  explanation: |-
    Nullity 2 would require rank $7 - 2 = 5$, but a matrix with 4 rows has at most 4 pivots.

- id: la-q-2604
  lesson: la-dim-rank
  topic: Rank
  stem: 'Which is true for every matrix $A$?'
  choices: ['$\operatorname{rank} A = \operatorname{rank} A^T$', '$\operatorname{rank} A$ equals the number of rows', '$\operatorname{Col} A = \operatorname{Row} A$', '$\dim\operatorname{Nul} A = \dim\operatorname{Nul} A^T$']
  answer: 0
  explanation: |-
    Both ranks count the pivots of $A$: $\dim\operatorname{Col} A = \dim\operatorname{Row} A = \dim\operatorname{Col} A^T$. The column and row spaces are usually different subspaces (they may live in different $\mathbb{R}^k$), and the two null spaces can have different dimensions for non-square $A$.

- id: la-q-2605
  lesson: la-dim-rank
  topic: Dimension
  stem: 'What is the dimension of a plane through the origin in $\mathbb{R}^3$?'
  choices: ['1', '3', '2', '0']
  answer: 2
  explanation: |-
    It's spanned by two non-parallel vectors, which form a basis. It is a 2-dimensional subspace of $\mathbb{R}^3$ (not equal to $\mathbb{R}^2$).

- id: la-q-2606
  lesson: la-dim-rank
  topic: Dimension
  stem: 'Three linearly independent vectors in $\mathbb{R}^3$:'
  choices: ['might not span $\mathbb{R}^3$', 'must be orthogonal', 'must include the standard basis vectors', 'automatically form a basis for $\mathbb{R}^3$']
  answer: 3
  explanation: |-
    By the basis theorem, in a space of dimension 3, any 3 independent vectors form a basis. You only need to check one condition when the count matches the dimension.

- id: la-q-2607
  lesson: la-dim-rank
  module_quiz: true
  topic: Rank
  stem: 'A $3 \times 5$ matrix has an echelon form with 2 pivots. What are its rank and nullity?'
  choices: ['Rank 2, nullity 3', 'Rank 3, nullity 2', 'Rank 2, nullity 1', 'Rank 5, nullity 0']
  answer: 0
  explanation: |-
    Rank = number of pivots = 2; nullity = number of free variables = $5 - 2 = 3$.

- id: la-q-2608
  lesson: la-dim-rank
  topic: Rank
  stem: 'A $5 \times 5$ matrix has rank 5. Which is true?'
  choices: ['$\operatorname{Nul} A$ is a line', '$A$ is invertible and $\operatorname{Nul} A = \{\mathbf{0}\}$', '$\operatorname{Col} A$ is a 4-dimensional subspace', '$A$ is the identity']
  answer: 1
  explanation: |-
    Rank $n$ for an $n \times n$ matrix is an IMT statement. Then nullity $= 5 - 5 = 0$.

- id: la-q-2609
  lesson: la-dim-rank
  topic: Dimension
  stem: 'What is $\dim M_{2\times 3}$ (the space of $2 \times 3$ matrices)?'
  choices: ['5', '2', '3', '6']
  answer: 3
  explanation: |-
    A basis is the six matrices with a single 1 and zeros elsewhere: one for each entry.

- id: la-q-2610
  lesson: la-dim-rank
  topic: Rank
  stem: '$A$ is $5 \times 7$ with rank 4. What is $\dim\operatorname{Nul} A^T$?'
  choices: ['3', '2', '4', '1']
  answer: 3
  explanation: |-
    $A^T$ is $7 \times 5$ with the same rank 4, so its nullity is $5 - 4 = 1$.

- id: la-q-2611
  lesson: la-dim-rank
  topic: Rank
  stem: 'What is the largest possible rank of a $4 \times 6$ matrix?'
  choices: ['6', '10', '24', '4']
  answer: 3
  explanation: |-
    The rank is the number of pivots, at most one per row: $\min(4, 6) = 4$.

- id: la-q-2612
  lesson: la-dim-rank
  module_quiz: true
  topic: Rank
  stem: '$A$ is $6 \times 8$ and $\dim\operatorname{Nul} A = 2$. Is $A\mathbf{x} = \mathbf{b}$ consistent for every $\mathbf{b}$ in $\mathbb{R}^6$?'
  choices: ['No, because $A$ is not square', 'Yes: rank $= 8 - 2 = 6$, so $\operatorname{Col} A$ is a 6-dimensional subspace of $\mathbb{R}^6$, i.e. all of it', 'No, because the null space is nonzero', 'It depends on $\mathbf{b}$']
  answer: 1
  explanation: |-
    The only 6-dimensional subspace of $\mathbb{R}^6$ is $\mathbb{R}^6$ itself, so every $\mathbf{b}$ is in $\operatorname{Col} A$. The nonzero null space means solutions aren't unique, not that they fail to exist.
