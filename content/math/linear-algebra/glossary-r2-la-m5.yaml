# Round 2 glossary terms for module la-m5 (honors lessons 18h1 and 18h2).
# "permutation matrix" and "partial pivoting" are bolded in 18h1 but defined by other modules'
# round 2 glossaries (la-m6 and la-m1/la-m2), so they are not repeated here.
- term: LDU factorization
  aliases: [LDU, LDU decomposition, A = LDU]
  definition: 'A factorization $A = LDU$ with $L$ unit lower triangular, $D$ diagonal (holding the pivots) and $U$ unit upper triangular. It comes from $A = LU$ by dividing each row of $U$ by its pivot, and it is unique when $A$ is invertible and needs no row swaps.'
  topic: Pivoting and LDU
- term: LDLᵀ factorization
  aliases: [LDL^T factorization, LDLT factorization, $LDL^T$]
  definition: 'The LDU factorization of a symmetric matrix, $A = LDL^T$: by uniqueness the unit upper factor is $L^T$. It exists when elimination needs no row swaps and gives nonzero pivots.'
  topic: Pivoting and LDU
- term: outer product
  aliases: [outer products]
  definition: 'The product $\mathbf{u}\mathbf{v}^T$ of a column vector and a row vector: a matrix with $(i, j)$ entry $u_iv_j$. Every column is a multiple of $\mathbf{u}$, so a nonzero outer product has rank 1. Compare the inner product $\mathbf{v}^T\mathbf{u}$, a number.'
  topic: Block elimination
- term: column–row expansion
  aliases: [column-row expansion, column–row expansion of a product]
  definition: 'Writing a product as a sum of outer products: $AB = \mathbf{a}_1\mathbf{b}_1^T + \cdots + \mathbf{a}_n\mathbf{b}_n^T$, where $\mathbf{a}_k$ is column $k$ of $A$ and $\mathbf{b}_k^T$ is row $k$ of $B$.'
  topic: Block elimination
- term: block upper triangular
  aliases: [block triangular, block upper triangular matrix]
  definition: 'A partitioned matrix $\begin{bmatrix} A & B \\ 0 & D\end{bmatrix}$ with square diagonal blocks and a zero block below them. If $A$ and $D$ are invertible, its inverse is $\begin{bmatrix} A^{-1} & -A^{-1}BD^{-1} \\ 0 & D^{-1}\end{bmatrix}$.'
  topic: Block elimination
- term: Schur complement
  aliases: [Schur complements]
  definition: 'For $M = \begin{bmatrix} A & B \\ C & D\end{bmatrix}$ with $A$ invertible, the matrix $S = D - CA^{-1}B$ left after block elimination clears $C$. $M$ is invertible exactly when $S$ is.'
  topic: Block elimination
- term: block LU factorization
  aliases: [block LU]
  definition: 'The factorization $\begin{bmatrix} A & B \\ C & D\end{bmatrix} = \begin{bmatrix} I & 0 \\ CA^{-1} & I\end{bmatrix}\begin{bmatrix} A & B \\ 0 & S\end{bmatrix}$, where $S$ is the Schur complement; LU with blocks in place of entries.'
  topic: Block elimination
- term: rank-one update
  aliases: [rank-one updates, rank one update]
  definition: 'Changing a matrix by adding one outer product: $A \to A + \mathbf{u}\mathbf{v}^T$. Changing a single entry $(i, j)$ by $\delta$ is the rank-one update $\delta\,\mathbf{e}_i\mathbf{e}_j^T$.'
  topic: Block elimination
- term: Sherman–Morrison formula
  aliases: [Sherman-Morrison formula, Sherman–Morrison]
  definition: 'If $A$ is invertible and $1 + \mathbf{v}^TA^{-1}\mathbf{u} \ne 0$, then $(A + \mathbf{u}\mathbf{v}^T)^{-1} = A^{-1} - \dfrac{A^{-1}\mathbf{u}\,\mathbf{v}^TA^{-1}}{1 + \mathbf{v}^TA^{-1}\mathbf{u}}$: an inverse updated in about $n^2$ operations.'
  topic: Block elimination
