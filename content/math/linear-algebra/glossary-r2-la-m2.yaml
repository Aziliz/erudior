# Round 2 glossary: la-m2 honors lessons
- term: invariant
  aliases: [invariants]
  definition: 'A quantity or property that a process never changes. Elementary row operations change the entries of a matrix but keep its column relations (the solutions of the homogeneous system with that coefficient matrix).'
  topic: Uniqueness of the RREF
- term: column relation
  aliases: [column relations]
  definition: 'For a matrix with columns $\mathbf{a}_1, \dots, \mathbf{a}_n$, a list of numbers $c_1, \dots, c_n$ with $c_1\mathbf{a}_1 + \cdots + c_n\mathbf{a}_n = \mathbf{0}$; equivalently, a solution of the homogeneous system with that coefficient matrix. Row-equivalent matrices have the same column relations.'
  topic: Uniqueness of the RREF
- term: canonical form
  aliases: [canonical forms]
  definition: 'A standard representative chosen from a family of equivalent objects, so that two objects are equivalent exactly when they have the same canonical form. The RREF is a canonical form for row equivalence.'
  topic: Uniqueness of the RREF
- term: sparse
  aliases: [sparse matrix, sparse matrices, sparse system, sparse systems]
  definition: 'Describes a matrix (or the system it comes from) in which most entries are 0, as when each equation involves only a few neighboring unknowns.'
  topic: Iterative methods
- term: direct method
  aliases: [direct methods]
  definition: 'A method, such as row reduction, that reaches the exact solution of a linear system (apart from rounding) in a fixed, finite number of steps.'
  topic: Iterative methods
- term: iterative method
  aliases: [iterative methods]
  definition: 'A method that starts from a guess at the solution of a system and improves it repeatedly, stopping when the guesses have settled down.'
  topic: Iterative methods
- term: Jacobi method
  aliases: [Jacobi iteration]
  definition: 'An iterative method for $A\mathbf{x} = \mathbf{b}$: solve equation $i$ for $x_i$, and compute every new value from the previous guess only.'
  topic: Iterative methods
- term: sweep
  aliases: [sweeps]
  definition: 'One round of an iterative method in which every unknown is updated once.'
  topic: Iterative methods
- term: Gauss–Seidel method
  aliases: [Gauss-Seidel method, Gauss–Seidel, Gauss-Seidel, Gauss–Seidel iteration]
  definition: 'An iterative method like the Jacobi method, except that each new value is used as soon as it is computed, within the same sweep.'
  topic: Iterative methods
- term: strictly diagonally dominant
  aliases: [diagonally dominant, strict diagonal dominance, diagonal dominance]
  definition: 'Describes a square matrix in which, in every row, the diagonal entry is larger in absolute value than the sum of the absolute values of the other entries. Then the system has one solution and the Jacobi and Gauss–Seidel methods converge to it.'
  topic: Iterative methods
