# Round 2, la-m7 honors lessons: new glossary terms.
- term: exchange lemma
  aliases: [Steinitz exchange lemma, replacement theorem]
  definition: 'If $\{\mathbf{u}_1, \dots, \mathbf{u}_m\}$ is linearly independent in a space spanned by $\{\mathbf{w}_1, \dots, \mathbf{w}_n\}$, then $m \le n$, and the $\mathbf{u}$''s can be swapped in for $m$ of the $\mathbf{w}$''s without losing the span. It shows that every basis of a space has the same size.'
  topic: Dimension
- term: sum of subspaces
  aliases: [H + K, sum of two subspaces]
  definition: 'For subspaces $H$ and $K$, the set $H + K = \{\mathbf{h} + \mathbf{k} : \mathbf{h} \in H, \mathbf{k} \in K\}$: the smallest subspace containing both. Its dimension is $\dim H + \dim K - \dim(H \cap K)$.'
  topic: Sums of subspaces
- term: direct sum
  aliases: [H ⊕ K, $H \oplus K$]
  definition: 'A sum $H + K$ of subspaces with $H \cap K = \{\mathbf{0}\}$, written $H \oplus K$. Every vector in it splits as $\mathbf{h} + \mathbf{k}$ in exactly one way, and $\dim(H \oplus K) = \dim H + \dim K$.'
  topic: Sums of subspaces
- term: complementary subspace
  aliases: [complementary subspaces]
  definition: 'A subspace $K$ with $V = H \oplus K$ (so $H \cap K = \{\mathbf{0}\}$ and $H + K = V$). A subspace usually has many complements; the orthogonal complement is one particular choice.'
  topic: Sums of subspaces
- term: matrix of a linear transformation
  aliases: [matrix of T relative to bases B and C, matrix of a linear map]
  definition: 'For linear $T: V \to W$ with bases $\mathcal{B}$ of $V$ and $\mathcal{C}$ of $W$, the matrix $M$ whose column $j$ is $[T(\mathbf{b}_j)]_{\mathcal{C}}$. It satisfies $[T(\mathbf{x})]_{\mathcal{C}} = M[\mathbf{x}]_{\mathcal{B}}$ and has size $\dim W \times \dim V$.'
  topic: Matrices of linear maps
- term: linear operator
  aliases: [linear operators]
  definition: 'A linear transformation from a vector space to itself, $T: V \to V$.'
  topic: Matrices of linear maps
- term: isomorphic
  aliases: [isomorphic spaces]
  definition: 'Two vector spaces are isomorphic if there is a one-to-one, onto linear map (an isomorphism) between them. Finite-dimensional spaces are isomorphic exactly when they have the same dimension.'
  topic: Matrices of linear maps
- term: Lagrange basis
  aliases: [Lagrange polynomials, Lagrange basis polynomials]
  definition: 'For different nodes $t_0, \dots, t_n$, the polynomials $L_0, \dots, L_n$ in $\mathbb{P}_n$ with $L_i(t_j) = 1$ if $i = j$ and $0$ otherwise. The coordinates of $p$ in this basis are its values $p(t_0), \dots, p(t_n)$.'
  topic: Interpolation
- term: linear difference equation
  aliases: [linear recurrence, linear recurrences, recurrence relation, difference equation]
  definition: 'An equation such as $y_{k+2} + a\,y_{k+1} + b\,y_k = 0$ for a sequence $(y_k)$. The solutions of this second-order homogeneous one form a 2-dimensional subspace of the space of sequences.'
  topic: Linear recurrences
- term: auxiliary equation
  aliases: [characteristic equation of a recurrence]
  definition: 'For $y_{k+2} + a\,y_{k+1} + b\,y_k = 0$, the equation $r^2 + ar + b = 0$ obtained by trying $y_k = r^k$. Different real roots $r_1, r_2$ give the basis $r_1^k, r_2^k$; a repeated root $r$ gives $r^k, k\,r^k$.'
  topic: Linear recurrences
- term: Casorati matrix
  definition: 'For two solutions $u$, $v$ of the same second-order linear recurrence, the matrix $\begin{bmatrix} u_0 & v_0 \\ u_1 & v_1\end{bmatrix}$. The solutions are linearly independent exactly when it is invertible.'
  topic: Linear recurrences
