# Round 2, module stat-m6: cards for the two honors lessons.
# Linearity of expectation and indicator variables
- {front: 'Linearity of expectation', back: '$E(aX + bY + c) = aE(X) + bE(Y) + c$ for any random variables, independent or not.', topic: 'Linearity of expectation'}
- {front: 'What needs independence (or zero covariance), and what doesn''t?', back: 'Means always add. Adding variances and $E(XY) = E(X)E(Y)$ need zero covariance, which independence guarantees.', topic: 'Linearity of expectation'}
- {front: 'Indicator variable', back: '$I_A = 1$ if $A$ occurs, 0 if not; $E(I_A) = P(A)$ and $\text{Var}(I_A) = P(A)(1 - P(A))$.', topic: 'Linearity of expectation'}
- {front: 'Indicator method for an expected count', back: 'Write the count as a sum of indicators, one per item that might be counted; the expected count is the sum of their probabilities.', topic: 'Linearity of expectation'}
- {front: 'Does E(X²) equal [E(X)]²?', back: 'No: $E(X^2) - [E(X)]^2 = \text{Var}(X)$. Expectation passes through sums and constant multiples, not through squares or other nonlinear functions.', topic: 'Linearity of expectation'}
- {front: 'Matching problem: expected matches', back: '1, for every $n$ (each of $n$ items matches with probability $1/n$).', topic: 'Linearity of expectation'}
- {front: 'Expected count in a sample without replacement', back: '$n \cdot \tfrac{K}{N}$, the same as $np$: each draw is a success with probability $K/N$, even though the draws are dependent.', topic: 'Linearity of expectation'}
- {front: 'Coupon collector: expected draws to see all n types', back: '$n\left(1 + \tfrac12 + \cdots + \tfrac1n\right) = nH_n$; stage $k$ is geometric with $p = (n - k)/n$. For $n = 6$: 14.7.', topic: 'Linearity of expectation'}
- {front: 'Expected number of pairs sharing a birthday among n people', back: '$\binom{n}{2}/365$ (about 1.19 for $n = 30$), assuming 365 equally likely days.', topic: 'Linearity of expectation'}
- {front: 'Expected count vs probability of at least one', back: 'Different things: linearity gives the expected count; "at least one" needs the complement rule or the full distribution.', topic: 'Linearity of expectation'}
# Covariance
- {front: 'Covariance', back: '$\text{Cov}(X, Y) = E[(X - \mu_X)(Y - \mu_Y)] = E(XY) - \mu_X\mu_Y$.', topic: 'Covariance'}
- {front: 'Correlation of two random variables', back: '$\rho = \dfrac{\text{Cov}(X, Y)}{\sigma_X\sigma_Y}$; unitless, between $-1$ and 1.', topic: 'Covariance'}
- {front: 'Variance of X ± Y (general)', back: '$\text{Var}(X) + \text{Var}(Y) \pm 2\,\text{Cov}(X, Y)$.', topic: 'Covariance'}
- {front: 'Variance of aX + bY', back: '$a^2\sigma_X^2 + b^2\sigma_Y^2 + 2ab\,\text{Cov}(X, Y)$.', topic: 'Covariance'}
- {front: 'Independent vs uncorrelated', back: 'Independent ⇒ Cov = 0. Cov = 0 does not imply independent (example: $X = -1, 0, 1$ and $Y = X^2$).', topic: 'Covariance'}
- {front: 'Checking independence in a joint table', back: 'Every cell must equal (row total) × (column total); one failing cell shows dependence.', topic: 'Covariance'}
- {front: 'Cov(X, X)', back: '$\text{Var}(X)$.', topic: 'Covariance'}
- {front: 'SD of a 50-50 mix of two assets, each SD σ, correlation ρ', back: '$\sigma\sqrt{(1 + \rho)/2}$: equal to $\sigma$ when $\rho = 1$, $0.71\sigma$ when $\rho = 0$, 0 when $\rho = -1$.', topic: 'Covariance'}
- {front: 'Variance of a count drawn without replacement', back: '$np(1-p)\cdot\dfrac{N - n}{N - 1}$ (finite population correction); smaller than binomial because different draws have negative covariance.', topic: 'Covariance'}
- {front: 'Why the 10% condition works', back: 'With $n \le 0.1N$ the correction factor is at least about 0.9, so the binomial SD is at most about 5% too large.', topic: 'Covariance'}
