# Round 2, module stat-m2: terms introduced by the two honors lessons.
- term: plotting position
  aliases: [plotting positions]
  definition: 'The proportion assigned to the $i$-th smallest of $n$ values when making a normal probability plot, usually $(i - 0.5)/n$. Other conventions, such as $i/(n + 1)$, give nearly the same plot.'
  topic: Normal probability plots
- term: expected z-score
  aliases: [expected z-scores, expected z]
  definition: 'The z-score a value would have if the data were exactly normal: $\Phi^{-1}$ of its plotting position. A normal probability plot puts each data value against its expected z-score.'
  topic: Normal probability plots
- term: quantile
  aliases: [quantiles]
  definition: 'The value with a given proportion $p$ of the distribution at or below it. The 0.90 quantile is the 90th percentile; for $N(\mu, \sigma)$ it is $\mu + z_p\sigma$.'
  topic: Normal probability plots
- term: heavy tails
  aliases: [heavy-tailed, heavy tail]
  definition: 'A distribution has heavy tails when its extreme values on both sides lie farther from the center than a normal model predicts. On a normal probability plot: an S shape with the lowest points below the line and the highest above it.'
  topic: Normal probability plots
- term: light tails
  aliases: [light-tailed, short tails, light tail]
  definition: 'A distribution has light tails when its extreme values lie closer to the center than a normal model predicts, as in a uniform distribution. On a normal probability plot: flat at both ends, with the lowest points above the line and the highest below it.'
  topic: Normal probability plots
- term: probability plot correlation
  aliases: [probability plot correlation coefficient]
  definition: 'The correlation $r$ between the expected z-scores and the sorted data in a normal probability plot. Values near 1 mean a straight plot; compare with cutoffs for the sample size (about 0.919 for $n = 10$).'
  topic: Normal probability plots
- term: specification limits
  aliases: [specification limit, LSL, USL, lower specification limit, upper specification limit]
  definition: 'The lower and upper limits (LSL and USL) that a part or product must fall between, set by the design or customer. They are requirements, not a description of what the process produces.'
  topic: Process capability
- term: parts per million
  aliases: [ppm]
  definition: 'A way to state small proportions: the proportion times 1,000,000. A proportion of 0.0027 is 2,700 ppm.'
  topic: Process capability
- term: Cp index
  aliases: [Cp]
  definition: 'The capability index $C_p = (\text{USL} - \text{LSL})/(6\sigma)$: the width of the specification compared with the process''s natural variation. It ignores where the mean is.'
  topic: Process capability
- term: Cpk index
  aliases: [Cpk]
  definition: 'The capability index $C_{pk} = \min(\text{USL} - \mu, \mu - \text{LSL})/(3\sigma)$: the distance from the mean to the nearer specification limit in units of $3\sigma$. It accounts for centering and is never larger than $C_p$.'
  topic: Process capability
- term: Six Sigma
  definition: 'A quality program begun at Motorola in the 1980s, aiming for specification limits 6 SDs from the mean ($C_p = 2$). Its quoted 3.4 defects per million assumes a conventional $1.5\sigma$ drift of the mean.'
  topic: Process capability
