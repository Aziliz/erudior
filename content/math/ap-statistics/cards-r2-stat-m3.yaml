# Round 2, module stat-m3: cards for the honors lessons 15h1–15h3.

# ---- The mathematics of least squares
- {front: 'The mean minimizes squared deviations', back: '$\sum (d_i - c)^2 = \sum (d_i - \bar{d})^2 + n(\bar{d} - c)^2$, smallest at $c = \bar{d}$.', topic: Least-squares theory}
- {front: 'Why the LSRL passes through $(\bar{x}, \bar{y})$', back: 'For any slope $b$, the best intercept is the mean of $y_i - bx_i$, which is $\bar{y} - b\bar{x}$.', topic: Least-squares theory}
- {front: 'SSE as a function of the slope (line through the means)', back: '$\text{SSE}(b) = S_{xx}(b - S_{xy}/S_{xx})^2 + S_{yy} - S_{xy}^2/S_{xx}$, minimized at $b = S_{xy}/S_{xx}$.', topic: Least-squares theory}
- {front: 'SSE of any line $y = a + bx$', back: '$\text{SSE}_{\min} + S_{xx}(b - \hat{b})^2 + n(\bar{y} - a - b\bar{x})^2$: a slope penalty plus a penalty for missing the point of means.', topic: Least-squares theory}
- {front: 'Minimum SSE in terms of r', back: '$\text{SSE}_{\min} = \text{SST}(1 - r^2) = (n - 1)s_y^2(1 - r^2)$.', topic: Least-squares theory}
- {front: 'Sum-of-squares decomposition', back: '$\text{SST} = \text{SSR} + \text{SSE}$, with $\text{SSR} = \sum (\hat{y} - \bar{y})^2 = b^2 S_{xx}$; $r^2 = \text{SSR}/\text{SST}$.', topic: Least-squares theory}
- {front: 'Two equations every set of LSRL residuals satisfies', back: '$\sum e_i = 0$ and $\sum (x_i - \bar{x})e_i = 0$ (residuals are uncorrelated with $x$).', topic: Least-squares theory}
- {front: 'Why $s$ divides by $n - 2$', back: 'The residuals satisfy two equations (one per estimated coefficient), so only $n - 2$ are free.', topic: Least-squares theory}
- {front: 'Who published least squares first?', back: 'Legendre in 1805 (comet orbits). Gauss published in 1809 and said he had used it since 1795.', topic: Least-squares theory}
- {front: 'Least squares vs. least absolute deviations', back: 'Squares: closed-form formulas, SST = SSR + SSE, not resistant. Absolute deviations: more resistant, found by an algorithm, may not be unique.', topic: Least-squares theory}

# ---- Regression to the mean
- {front: 'Regression line in z-scores', back: '$\hat{z}_y = r\,z_x$: predictions are $|r|$ times as many SDs from the mean as the predictor.', topic: Regression to the mean}
- {front: 'Galton (1886)', back: 'Children''s height deviations averaged about two-thirds of the mid-parent''s deviation: "regression towards mediocrity."', topic: Regression to the mean}
- {front: 'Why regression to the mean happens', back: 'Score = ability + luck. An extreme group was partly lucky; the luck doesn''t repeat, so the next measurement is closer to the mean.', topic: Regression to the mean}
- {front: 'Regression fallacy', back: 'Crediting a treatment, praise or jinx for a change that regression to the mean alone would produce.', topic: Regression to the mean}
- {front: 'Guarding against the regression fallacy', back: 'Compare with a control group chosen the same way (ideally by random assignment among the selected); credit only the difference.', topic: Regression to the mean}
- {front: 'Does regression to the mean shrink a population''s spread?', back: 'No. Predictions are pulled in, but scatter around them refills the tails; and the effect runs in both directions.', topic: Regression to the mean}
- {front: 'Two regression slopes', back: '$b_{y \cdot x} = r\,s_y/s_x$ and $b_{x \cdot y} = r\,s_x/s_y$; their product is $r^2$.', topic: Regression to the mean}
- {front: 'SD line', back: 'Through $(\bar{x}, \bar{y})$ with slope $\pm s_y/s_x$; it lies between the two regression lines, and the $y$-on-$x$ line is flatter.', topic: Regression to the mean}
- {front: 'Retest prediction (equal means and SDs)', back: '$\hat{y} = \mu + r(x - \mu)$.', topic: Regression to the mean}

# ---- Relative risk, odds ratios and standardization
- {front: 'Risk, risk difference, relative risk', back: 'Risk $p$ is the proportion with the outcome. RD $= p_1 - p_2$; RR $= p_1/p_2$.', topic: Relative risk and odds ratios}
- {front: 'Odds and probability', back: 'odds $= p/(1 - p)$; $p = \text{odds}/(1 + \text{odds})$. Probability 0.75 ↔ odds 3.', topic: Relative risk and odds ratios}
- {front: 'Odds ratio in a 2×2 table', back: '$\text{OR} = \dfrac{a/b}{c/d} = \dfrac{ad}{bc}$.', topic: Relative risk and odds ratios}
- {front: 'When is OR ≈ RR?', back: 'When the outcome is rare in both groups. Otherwise OR is farther from 1 than RR.', topic: Relative risk and odds ratios}
- {front: 'Why case-control studies report odds ratios', back: 'Researchers fix the numbers of cases and controls, so risks are meaningless; $ad/bc$ is unchanged by sampling more or fewer controls.', topic: Relative risk and odds ratios}
- {front: 'Absolute vs. relative risk', back: 'Report the baseline risk or the risk difference with any relative risk: "triples the risk" may mean 1 → 3 in 50,000.', topic: Relative risk and odds ratios}
- {front: 'Overall rate as a weighted average', back: 'Overall = (share in stratum 1)(rate 1) + (share in stratum 2)(rate 2). Different weights can cause Simpson''s paradox.', topic: Relative risk and odds ratios}
- {front: 'Direct standardization', back: 'Apply each group''s stratum rates to one standard mix and add, so groups are compared at the same mix.', topic: Relative risk and odds ratios}
- {front: 'Kidney stones (Charig et al., 1986)', back: 'Open surgery beat the keyhole procedure for small and for large stones but lost overall (78% vs. 83%), because it got more of the hard large stones.', topic: Relative risk and odds ratios}
- {front: 'Limit of adjustment', back: 'Stratifying or standardizing removes only the variables adjusted for; only random assignment balances unmeasured ones.', topic: Relative risk and odds ratios}
