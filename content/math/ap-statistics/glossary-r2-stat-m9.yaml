# Round 2 glossary for stat-m9 (honors lessons 39h2, 39h3)
- term: adjusted residual
  aliases: [adjusted residuals, adjusted standardized residual]
  definition: 'For a cell of a two-way table, $(O - E)\big/\sqrt{E(1 - \text{row total}/n)(1 - \text{column total}/n)}$. Under independence it is approximately standard normal, so values beyond about ±2 mark cells that depart from independence.'
  topic: Chi-square follow-up
- term: Cramér's V
  aliases: [Cramer's V, Cramér V]
  definition: 'A measure of the strength of association in a two-way table: $V = \sqrt{\chi^2/(n \cdot \min(r - 1, c - 1))}$, from 0 (no association) to 1. Unlike $\chi^2$, it does not grow with the sample size.'
  topic: Chi-square follow-up
- term: phi coefficient
  aliases: [phi coefficients]
  definition: 'Cramér''s V for a 2 × 2 table: $\phi = \sqrt{\chi^2/n}$. It equals the size of the correlation between the two variables coded as 0 and 1.'
  topic: Chi-square follow-up
- term: Fisher's exact test
  aliases: [Fisher exact test]
  definition: 'A test for a 2 × 2 table that fixes the row and column totals and adds exact hypergeometric probabilities of tables at least as extreme as the observed one. It needs no large-counts condition.'
  topic: Chi-square follow-up
- term: mean response
  aliases: [mean responses]
  definition: 'In regression, the mean of $y$ for all individuals with a given $x^*$: $\mu_y = \beta_0 + \beta_1 x^*$, estimated by $\hat{y} = a + bx^*$.'
  topic: Regression intervals
- term: prediction interval
  aliases: [prediction intervals]
  definition: 'An interval for a single new response at $x^*$: $\hat{y} \pm t^* \sqrt{s^2 + SE_{\hat{\mu}}^2}$ with df $= n - 2$. It is wider than the confidence interval for the mean response because it includes the new value''s own scatter.'
  topic: Regression intervals
- term: confidence band
  aliases: [confidence bands]
  definition: 'The confidence intervals for the mean response drawn at every $x$; it curves away from the regression line and is narrowest at $\bar{x}$.'
  topic: Regression intervals
- term: prediction band
  aliases: [prediction bands]
  definition: 'The prediction intervals for single new responses drawn at every $x$; it lies outside the confidence band and is narrowest at $\bar{x}$.'
  topic: Regression intervals
