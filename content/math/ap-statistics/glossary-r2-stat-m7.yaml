# Round 2, module stat-m7: terms introduced by the two honors lessons.
- term: Wald interval
  aliases: [Wald intervals]
  definition: 'The usual large-sample interval for a proportion, $\hat{p} \pm z^*\sqrt{\hat{p}(1-\hat{p})/n}$, with the standard error estimated from $\hat{p}$. Its actual coverage often falls short of the stated level, badly so with few successes or failures.'
  topic: Better proportion intervals
- term: nominal confidence level
  aliases: [nominal level]
  definition: 'The confidence level a method is designed to achieve, such as 95%. The coverage it really achieves for a given $n$ and parameter value can be different.'
  topic: Better proportion intervals
- term: coverage probability
  aliases: [coverage, actual coverage]
  definition: 'The long-run proportion of intervals produced by a method that capture the true parameter, for a given sample size and parameter value. For a proportion it is a sum of binomial probabilities over the counts whose intervals contain $p$.'
  topic: Better proportion intervals
- term: plus four interval
  aliases: [plus four, plus-four interval, Agresti–Coull interval, Agresti-Coull interval]
  definition: 'An interval for a proportion that adds two successes and two failures before using the usual formula: $\tilde{p} \pm z^*\sqrt{\tilde{p}(1-\tilde{p})/(n+4)}$ with $\tilde{p} = (x+2)/(n+4)$. Its coverage stays close to the nominal level even with few successes.'
  topic: Better proportion intervals
- term: Wilson score interval
  aliases: [Wilson interval, Wilson intervals, score interval]
  definition: 'The interval of all $p_0$ with $|\hat{p} - p_0| \le z^*\sqrt{p_0(1-p_0)/n}$, found by solving a quadratic. It always lies within [0, 1], has good coverage, and is centered at $(x + z^{*2}/2)/(n + z^{*2})$.'
  topic: Better proportion intervals
- term: Clopper–Pearson interval
  aliases: [Clopper-Pearson interval, exact interval, exact binomial interval]
  definition: 'An interval for a proportion computed directly from binomial probabilities (1934). It guarantees coverage of at least the nominal level for every $p$, so it is conservative and usually wider than Wilson or plus four.'
  topic: Better proportion intervals
- term: rule of three
  aliases: [rule of 3]
  definition: 'After 0 successes in $n$ trials, $3/n$ is an approximate one-sided 95% upper bound for $p$ (the exact bound is $1 - 0.05^{1/n}$).'
  topic: Better proportion intervals
- term: Welch–Satterthwaite approximation
  aliases: [Welch-Satterthwaite approximation, Welch–Satterthwaite df, Welch's df, Satterthwaite approximation]
  definition: 'The degrees of freedom used by technology for the two-sample t procedures: $\dfrac{(a+b)^2}{a^2/(n_1-1) + b^2/(n_2-1)}$ with $a = s_1^2/n_1$, $b = s_2^2/n_2$. Always between $\min(n_1, n_2) - 1$ and $n_1 + n_2 - 2$.'
  topic: The t distribution in depth
