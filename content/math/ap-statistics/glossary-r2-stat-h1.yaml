# Round 2, honors module stat-h1: terms introduced by its four lessons.
# Resampling
- term: resampling
  aliases: [resampling methods]
  definition: 'Inference methods that reuse the one sample you have, by drawing from it again (the bootstrap) or reshuffling its group labels (permutation tests), instead of relying on a formula for the sampling distribution.'
  topic: Resampling methods
- term: bootstrap
  aliases: [bootstrapping, the bootstrap]
  definition: 'A resampling method (Efron, 1979) that estimates the variability of a statistic by treating the sample as the population: draw many samples of size $n$ with replacement from the data and recompute the statistic each time.'
  topic: Resampling methods
- term: bootstrap sample
  aliases: [bootstrap samples, resample, resamples]
  definition: 'A sample of $n$ values drawn at random with replacement from the original $n$ data values; some values appear more than once and some not at all.'
  topic: Resampling methods
- term: with replacement
  aliases: [sampling with replacement]
  definition: 'Drawing so that each selected item is put back before the next draw, so the same item can be chosen more than once and the draws are independent.'
  topic: Resampling methods
- term: bootstrap distribution
  aliases: [bootstrap distributions]
  definition: 'The distribution of a statistic over many bootstrap samples. Its spread and shape approximate those of the sampling distribution; its center sits near the original statistic.'
  topic: Resampling methods
- term: bootstrap standard error
  aliases: [bootstrap SE]
  definition: 'The standard deviation of the bootstrap distribution, used as an estimate of a statistic''s standard error. For the mean it equals $\sqrt{(n-1)/n}\cdot s/\sqrt{n}$.'
  topic: Resampling methods
- term: percentile interval
  aliases: [bootstrap percentile interval, percentile intervals]
  definition: 'A bootstrap confidence interval made from the middle of the bootstrap distribution, for 95% from its 2.5th to its 97.5th percentile. Tends to be too narrow for small samples.'
  topic: Resampling methods
- term: permutation test
  aliases: [permutation tests, exact permutation test]
  definition: 'A test that computes the statistic for every way of reassigning the observed responses to groups of the original sizes (or a large random set of them); the p-value is the fraction of these at least as extreme as the observed result. Justified by random assignment.'
  topic: Resampling methods
- term: permutation distribution
  definition: 'The values a statistic takes over all possible reassignments of the responses to the groups, each equally likely if the null hypothesis of no effect is true.'
  topic: Resampling methods
# Bayesian inference
- term: frequentist
  aliases: [frequentist inference, frequentist statistics]
  definition: 'The approach to inference used in the AP course: parameters are fixed unknown numbers, and probabilities describe how statistics and methods behave over repeated samples.'
  topic: Bayesian inference
- term: Bayesian inference
  aliases: [Bayesian statistics, Bayesian]
  definition: 'Inference in which probability also describes uncertainty about parameters: a prior distribution is updated by the data, through Bayes'' theorem, into a posterior distribution.'
  topic: Bayesian inference
- term: prior distribution
  aliases: [prior distributions]
  definition: 'In Bayesian inference, the probability distribution that describes what is believed about a parameter before the data are seen.'
  topic: Bayesian inference
- term: posterior distribution
  aliases: [posterior distributions]
  definition: 'In Bayesian inference, the distribution of a parameter after the data are seen: proportional to prior × likelihood.'
  topic: Bayesian inference
- term: likelihood
  aliases: [likelihood function]
  definition: 'The probability of the observed data, $P(\text{data} \mid \theta)$, viewed as a function of the parameter $\theta$. For $x$ successes in $n$ trials it is $\binom{n}{x}p^x(1-p)^{n-x}$.'
  topic: Bayesian inference
- term: beta distribution
  aliases: [beta distributions]
  definition: 'A family of density curves on $[0, 1]$, written $\text{Beta}(a, b)$, with density proportional to $p^{a-1}(1-p)^{b-1}$ and mean $a/(a+b)$. $\text{Beta}(1, 1)$ is the flat (uniform) curve.'
  topic: Bayesian inference
- term: conjugate prior
  aliases: [conjugate priors]
  definition: 'A prior whose posterior is in the same family. The beta prior is conjugate to binomial data: $\text{Beta}(a, b)$ becomes $\text{Beta}(a + x,\ b + n - x)$.'
  topic: Bayesian inference
- term: posterior mean
  definition: 'The mean of the posterior distribution, a common Bayesian point estimate. With a $\text{Beta}(a, b)$ prior and $x$ successes in $n$ trials it is $(a + x)/(a + b + n)$.'
  topic: Bayesian inference
- term: shrinkage
  definition: 'Pulling an estimate from the raw sample value toward a prior or overall mean, by more when the sample is small. The beta-binomial posterior mean shrinks $\hat{p}$ toward the prior mean.'
  topic: Bayesian inference
- term: credible interval
  aliases: [credible intervals, Bayesian credible interval]
  definition: 'An interval that contains the parameter with a stated posterior probability (for example 0.95), given the prior and the data. Unlike a confidence interval, it supports a direct probability statement about the parameter.'
  topic: Bayesian inference
- term: rule of succession
  aliases: [Laplace's rule of succession]
  definition: 'Laplace''s estimate $(x + 1)/(n + 2)$ of a success probability after $x$ successes in $n$ trials: the posterior mean under a flat prior.'
  topic: Bayesian inference
- term: sensitivity analysis
  aliases: [sensitivity analyses, prior sensitivity analysis]
  definition: 'Rerunning an analysis under several reasonable assumptions (in Bayesian work, several priors) to see whether the conclusion changes.'
  topic: Bayesian inference
# Multiple testing
- term: familywise error rate
  aliases: [FWER, family-wise error rate]
  definition: 'The probability of at least one Type I error among a family of tests. For $m$ independent tests of true nulls at level $\alpha$ it is $1 - (1 - \alpha)^m$.'
  topic: Multiple testing
- term: Bonferroni correction
  aliases: [Bonferroni method, Bonferroni adjustment]
  definition: 'Running each of $m$ tests at level $\alpha/m$ (or multiplying each p-value by $m$), which keeps the familywise error rate at most $\alpha$ by the union bound, with no independence needed.'
  topic: Multiple testing
- term: false discovery rate
  aliases: [FDR]
  definition: 'The expected proportion of rejected null hypotheses that are actually true (false discoveries among all discoveries).'
  topic: Multiple testing
- term: Benjamini–Hochberg procedure
  aliases: [Benjamini-Hochberg procedure, BH procedure, Benjamini–Hochberg]
  definition: 'A procedure (1995) that controls the false discovery rate at $q$: sort the $m$ p-values, find the largest $k$ with $p_{(k)} \le kq/m$, and reject the $k$ smallest.'
  topic: Multiple testing
- term: p-hacking
  aliases: [p hacking]
  definition: 'Trying several analyses (outcomes, exclusions, adjustments, stopping points) and reporting the one that reaches significance, which inflates the false-positive rate.'
  topic: Multiple testing
- term: replication crisis
  aliases: [reproducibility crisis]
  definition: 'The discovery, from the 2010s on, that many published findings (notably in psychology and medicine) fail to hold up when the studies are repeated.'
  topic: Multiple testing
- term: preregistration
  aliases: [preregistered, pre-registration]
  definition: 'Publicly recording a study''s hypotheses, outcomes and analysis plan before collecting data, so planned tests can be told apart from exploration.'
  topic: Multiple testing
# Effect sizes and meta-analysis
- term: meta-analysis
  aliases: [meta-analyses, meta-analytic]
  definition: 'A statistical combination of the results of several studies of the same question into one pooled estimate, usually weighting each study by its precision.'
  topic: Effect sizes and meta-analysis
- term: Cohen's d
  aliases: [Cohens d]
  definition: 'A standardized effect size for two groups: $d = (\bar{x}_1 - \bar{x}_2)/s_p$, the difference in means in pooled standard deviations. 0.2, 0.5 and 0.8 are often called small, medium and large (rough conventions).'
  topic: Effect sizes and meta-analysis
- term: inverse-variance weight
  aliases: [inverse-variance weights, inverse-variance weighting]
  definition: 'The weight $w_i = 1/\text{SE}_i^2$ given to study $i$ in a meta-analysis, so more precise studies count more.'
  topic: Effect sizes and meta-analysis
- term: fixed-effect model
  aliases: [common-effect model, fixed-effect meta-analysis]
  definition: 'A meta-analysis model assuming every study estimates one common true effect: pooled estimate $\sum w_i y_i/\sum w_i$ with SE $1/\sqrt{\sum w_i}$.'
  topic: Effect sizes and meta-analysis
- term: random-effects model
  aliases: [random-effects meta-analysis, random effects model]
  definition: 'A meta-analysis model in which the studies'' true effects vary around an average with variance $\tau^2$; weights become $1/(\text{SE}_i^2 + \tau^2)$ and the pooled interval is wider.'
  topic: Effect sizes and meta-analysis
- term: forest plot
  aliases: [forest plots]
  definition: 'The standard meta-analysis display: one row per study with a square at its estimate (sized by weight) and a line for its confidence interval, a diamond for the pooled estimate, and a vertical line at no effect.'
  topic: Effect sizes and meta-analysis
- term: heterogeneity
  definition: 'In a meta-analysis, variation among the true effects of the studies beyond what sampling error explains.'
  topic: Effect sizes and meta-analysis
- term: Cochran's Q
  aliases: [Q statistic, Cochrans Q]
  definition: 'The heterogeneity statistic $Q = \sum w_i(y_i - \hat{\theta})^2$; with no heterogeneity it is roughly chi-square with $k - 1$ degrees of freedom.'
  topic: Effect sizes and meta-analysis
- term: I-squared
  aliases: [I²]
  definition: 'The estimated share of variation among study estimates due to real heterogeneity: $I^2 = \max(0, (Q - (k-1))/Q)$. About 25%, 50%, 75% are often read as low, moderate, high.'
  topic: Effect sizes and meta-analysis
- term: publication bias
  definition: 'Distortion of the published evidence because studies with significant or striking results are more likely to be published; it makes pooled estimates too large.'
  topic: Effect sizes and meta-analysis
- term: file drawer problem
  aliases: [file-drawer problem]
  definition: 'Rosenthal''s (1979) name for unpublished studies with null results sitting in researchers'' file drawers, a source of publication bias.'
  topic: Effect sizes and meta-analysis
- term: funnel plot
  aliases: [funnel plots]
  definition: 'A graph of each study''s estimate against its precision. Without publication bias the points form a symmetric funnel; a missing corner of small studies suggests bias.'
  topic: Effect sizes and meta-analysis
