id: math-ap-statistics
title: AP Statistics
description: >-
  AP Statistics: exploring one- and two-variable data, z-scores and the normal model,
  correlation and regression, sampling and experimental design, probability, random
  variables (binomial and geometric), sampling distributions and the Central Limit
  Theorem, confidence intervals and significance tests for proportions and means,
  chi-square tests and inference for the regression slope, with AP-style four-step
  inference throughout.
