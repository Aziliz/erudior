# Round 2, module stat-m8 (Significance tests): terms bolded in the new core-lesson text and the
# three honors lessons. Checked against every glossary*.yaml in the course for duplicates.
- term: rejection region
  aliases: [rejection regions, critical region]
  definition: 'The set of values of the test statistic (or of the sample statistic) for which a test at level $\alpha$ rejects $H_0$. Its probability, computed assuming $H_0$ is true, is $\alpha$; its boundary is the critical value.'
  topic: Significance tests
- term: power curve
  aliases: [power curves, power function]
  definition: 'A graph of a test''s power against the true value of the parameter. It equals $\alpha$ at the null value and rises toward 1 as the true value moves away from it, more steeply for larger samples.'
  topic: Power and sample size
- term: effect size
  aliases: [effect sizes, standardized effect size]
  definition: 'The size of an effect measured on a scale that does not depend on the sample size; in power planning, $d = \delta/\sigma$, the difference to detect in standard deviations of individual values.'
  topic: Power and sample size
- term: winner's curse
  aliases: [Type M error, exaggeration ratio]
  definition: 'The tendency of statistically significant estimates from low-power studies to overstate the true effect, because only estimates that landed far from 0 cleared the significance bar.'
  topic: Power and sample size
- term: observed power
  aliases: [post hoc power, retrospective power]
  definition: 'Power computed after a study by treating the observed effect as the true one. It is a fixed function of the p-value and adds no information; confidence intervals are the right after-the-fact summary.'
  topic: Power and sample size
- term: equivalence margin
  aliases: [margin of equivalence, equivalence margins]
  definition: 'The largest difference $\Delta$ that would not matter in practice, fixed before the data are collected; an equivalence test tries to show the true difference lies between $-\Delta$ and $\Delta$.'
  topic: Equivalence testing
- term: equivalence test
  aliases: [equivalence tests, equivalence testing]
  definition: 'A test whose null hypothesis is that a difference is at least $\Delta$ in size ($\theta \le -\Delta$ or $\theta \ge \Delta$), so that rejecting it gives convincing evidence the difference is practically negligible.'
  topic: Equivalence testing
- term: TOST
  aliases: [two one-sided tests]
  definition: 'Two one-sided tests: the standard equivalence test. Test $\theta \le -\Delta$ and $\theta \ge \Delta$ separately, each at level $\alpha$; conclude equivalence if both reject. Same as a $(1 - 2\alpha)$ confidence interval lying inside $(-\Delta, \Delta)$.'
  topic: Equivalence testing
- term: non-inferiority test
  aliases: [non-inferiority tests, noninferiority test, non-inferiority, noninferiority]
  definition: 'A one-sided test of $H_0: \theta \le -\Delta$ against $H_a: \theta > -\Delta$ (higher is better), used to show a new option is not worse than a standard by more than the margin $\Delta$.'
  topic: Equivalence testing
- term: bioequivalence
  aliases: [bioequivalent]
  definition: 'Equivalence of two drug products in how much active ingredient reaches the blood. Usually shown by a 90% confidence interval for the ratio of mean blood levels lying within 80% to 125%.'
  topic: Equivalence testing
- term: exact test
  aliases: [exact tests]
  definition: 'A test whose p-value comes from the exact null distribution of its test statistic (for example binomial, or by listing equally likely outcomes) rather than a normal or t approximation, so it is valid for any sample size.'
  topic: Exact tests
- term: exact binomial test
  aliases: [binomial test]
  definition: 'A test of $H_0: p = p_0$ that takes the p-value from the binomial distribution $B(n, p_0)$ of the number of successes, used when large counts fail.'
  topic: Exact tests
- term: conservative test
  aliases: [conservative]
  definition: 'A test whose actual Type I error rate is at most its nominal $\alpha$, often less; exact tests on discrete data usually are. (For intervals: actual coverage at least the stated level.)'
  topic: Exact tests
- term: sign test
  aliases: [sign tests]
  definition: 'A test for paired data that drops zero differences and compares the number of positive differences with $B(n, 0.5)$, where $n$ is the number of nonzero differences. It assumes nothing about the shape of the distribution.'
  topic: Exact tests
- term: Wilcoxon signed-rank test
  aliases: [signed-rank test, Wilcoxon test]
  definition: 'A test for paired data: rank the nonzero differences by size, add the ranks of the positive ones ($W^+$), and compare with the $2^n$ equally likely sign patterns. It assumes the differences are symmetric about 0 under $H_0$.'
  topic: Exact tests
- term: nonparametric test
  aliases: [nonparametric, distribution-free]
  definition: 'A test whose null distribution does not depend on a normal or other parametric model for the data, such as the sign test or the signed-rank test. It still assumes random data.'
  topic: Exact tests
