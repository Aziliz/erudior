# Round 2, module stat-m2 (Position and the normal model): new question types for the core
# lessons (stat-m2-r2-q..) and questions for the two honors lessons (stat-m2-r2-h..).

# ---- Lesson 7: percentiles and z-scores
- id: stat-m2-r2-q01
  lesson: stat-percentiles-z
  type: label
  module_quiz: true
  topic: Percentiles and z-scores
  stem: 'This cumulative relative frequency graph shows commute times. Dashed lines go across from four heights on the vertical axis to the graph and then down. Name the percentile marked by each number.'
  image: {src: images/stat-m2-ogive-blank.svg, alt: 'A cumulative relative frequency graph of commute times from 0 to 60 minutes, rising through (10, 0.08), (20, 0.30), (30, 0.65), (40, 0.85), (50, 0.95) and (60, 1). Dashed lines go across from 0.25, 0.50, 0.75 and 0.90 to the graph and down to the time axis. Marker 1 is where the 0.25 line meets the axis, near 18 minutes; marker 2 where the 0.50 line meets it, near 26; marker 3 where the 0.75 line meets it, at 35; marker 4 where the 0.90 line meets it, at 45.'}
  labels:
    - {x: 36.7, y: 80.0, text: First quartile (25th percentile)}
    - {x: 47.5, y: 80.0, text: Median (50th percentile)}
    - {x: 59.9, y: 80.0, text: Third quartile (75th percentile)}
    - {x: 73.4, y: 80.0, text: 90th percentile}
  distractors: [Mean, 10th percentile]
  explanation: |-
    A cumulative relative frequency graph gives the proportion of values at or below each time. Read across from a proportion and down to the axis to find that percentile: 0.25 gives $Q_1 \approx 18$ minutes, 0.50 the median $\approx 26$, 0.75 gives $Q_3 = 35$ and 0.90 the 90th percentile, 45. The mean cannot be read from this graph.

- id: stat-m2-r2-q02
  lesson: stat-percentiles-z
  type: text
  topic: Percentiles and z-scores
  stem: 'Of 200 commuters, 170 have commutes of 40 minutes or less. Using "percent at or below," a 40-minute commute is at the ___th percentile. Give only the number.'
  accept: ['85']
  explanation: |-
    $170/200 = 0.85$, so 85% of commutes are at or below 40 minutes: the 85th percentile.

- id: stat-m2-r2-q03
  lesson: stat-percentiles-z
  type: text
  topic: Percentiles and z-scores
  stem: 'A distribution has mean 25 and standard deviation 4. The value 31 has a z-score of ___. Give only the number.'
  accept: ['1.5']
  explanation: |-
    $z = (31 - 25)/4 = 6/4 = 1.5$: the value is 1.5 standard deviations above the mean.

- id: stat-m2-r2-q04
  lesson: stat-percentiles-z
  type: order
  module_quiz: true
  topic: Percentiles and z-scores
  stem: 'Four students took different tests. Put their scores in order from the LOWEST to the HIGHEST standing relative to their own test.'
  items:
    - 'Score 62 on a test with mean 70 and SD 4'
    - 'Score 66 on a test with mean 70 and SD 8'
    - 'Score 81 on a test with mean 75 and SD 12'
    - 'Score 88 on a test with mean 80 and SD 5'
  explanation: |-
    Compare z-scores: $(62 - 70)/4 = -2$, $(66 - 70)/8 = -0.5$, $(81 - 75)/12 = 0.5$ and $(88 - 80)/5 = 1.6$. The raw scores happen to be in the same order here, but only the z-scores make the comparison fair.

- id: stat-m2-r2-q05
  lesson: stat-percentiles-z
  topic: Percentiles and z-scores
  stem: 'Which statements are true for EVERY distribution, whatever its shape? Select all that apply.'
  choices:
    - 'A value with $z = 0$ is equal to the mean'
    - 'At least 75% of the values have z-scores between $-2$ and $2$'
    - 'A value with $z = 1$ is at about the 84th percentile'
    - 'About 95% of the values lie within 2 standard deviations of the mean'
  answer: [0, 1]
  explanation: |-
    $z = 0$ means $x - \text{mean} = 0$, for any shape. Chebyshev's inequality guarantees at least $1 - 1/2^2 = 75\%$ within 2 SDs for any distribution. The 84th percentile and the 95% figure come from the normal model; for a skewed distribution they can be far off.

- id: stat-m2-r2-q06
  lesson: stat-percentiles-z
  type: match
  topic: Percentiles and z-scores
  stem: 'Match each description to its value.'
  pairs:
    - [The z-score of a value equal to the mean, '0']
    - [The percentile of the median, 50th]
    - [The percentile of the third quartile, About the 75th]
    - [The standard deviation of a complete set of z-scores, '1']
  distractors: [100th, Depends on the shape]
  explanation: |-
    A value at the mean is 0 SDs from it. Half the data lie at or below the median (50th percentile) and about three quarters at or below $Q_3$, for any shape. Standardizing every value always gives mean 0 and SD 1; only the shape is left unchanged.

# ---- Lesson 8: linear transformations
- id: stat-m2-r2-q07
  lesson: stat-transformations
  type: match
  module_quiz: true
  topic: Transforming data
  stem: 'A variable $x$ has mean 20, median 18, standard deviation 4, IQR 6 and variance 16. Every value is transformed by $y = 10 + 3x$. Match each summary of $y$ to its value.'
  pairs:
    - [Mean of y, '70']
    - [Median of y, '64']
    - [Standard deviation of y, '12']
    - [IQR of y, '18']
    - [Variance of y, '144']
  distractors: ['22', '48']
  explanation: |-
    Centers become $10 + 3(\text{old})$: mean $10 + 60 = 70$, median $10 + 54 = 64$. Spreads are multiplied by 3 and ignore the 10: SD $3 \times 4 = 12$, IQR $3 \times 6 = 18$. Variance is multiplied by $3^2 = 9$: $9 \times 16 = 144$. (22 adds 10 to the SD; 48 multiplies the variance by 3 instead of 9.)

- id: stat-m2-r2-q08
  lesson: stat-transformations
  type: text
  topic: Transforming data
  stem: 'Every value in a data set is multiplied by $-2$ and then 5 is added. The original standard deviation was 3.5. The new standard deviation is ___. Give only the number.'
  accept: ['7']
  explanation: |-
    Adding 5 has no effect on spread, and multiplying by $-2$ multiplies the SD by $|-2| = 2$: $2 \times 3.5 = 7$. A standard deviation is never negative, so $-7$ is wrong.

- id: stat-m2-r2-q09
  lesson: stat-transformations
  topic: Transforming data
  stem: 'Masses are converted from kilograms to grams (every value multiplied by 1000). Which summaries are multiplied by exactly 1000? Select all that apply.'
  choices:
    - 'The mean'
    - 'The IQR'
    - 'The variance'
    - 'The z-score of each mass'
  answer: [0, 1]
  explanation: |-
    With $b = 1000$, centers and spreads such as the mean and IQR are multiplied by 1000. The variance is multiplied by $1000^2 = 1{,}000{,}000$. Each z-score is unchanged, because changing units does not change how many SDs a value is from the mean.

- id: stat-m2-r2-q10
  lesson: stat-transformations
  type: order
  module_quiz: true
  topic: Transforming data
  stem: 'Before a curve, test scores had mean 70 and SD 8; after the curve $y = a + bx$ they have mean 80 and SD 6. Put the steps for finding $a$ and $b$ in order.'
  items:
    - 'Divide the new SD by the old SD: $b = 6/8 = 0.75$'
    - 'Multiply the old mean by $b$: $0.75 \times 70 = 52.5$'
    - 'Subtract from the new mean: $a = 80 - 52.5 = 27.5$'
    - 'Write the curve: $y = 27.5 + 0.75x$'
  explanation: |-
    The spread gives $b$ first, because the added constant $a$ doesn't affect the SD. Only then can the mean equation $80 = a + b(70)$ be solved for $a$. This is Example 4 of the lesson.

- id: stat-m2-r2-q11
  lesson: stat-transformations
  topic: Transforming data
  stem: 'In the dotplots, $x$ has mean 4 and SD 1.79. Which new variable would have mean 1 and SD 1.79?'
  image: {src: images/stat-m2-shift-scale.svg, alt: 'Three dotplots on a scale from 0 to 16. x: dots at 2, 3, 3, 4, 5, 7, mean 4, SD 1.79. x + 5: dots at 7, 8, 8, 9, 10, 12, mean 9, SD 1.79. 2x: dots at 4, 6, 6, 8, 10, 14, mean 8, SD 3.58.'}
  choices: ['$0.25x$', '$x - 4$', '$x - 3$', '$3 - x$']
  answer: 2
  explanation: |-
    To keep the SD at 1.79 the multiplier must be $\pm 1$, and to move the mean from 4 to 1 you subtract 3: $x - 3$. $0.25x$ has mean 1 but SD $0.25 \times 1.79 \approx 0.45$; $x - 4$ has mean 0; $3 - x$ has SD 1.79 but mean $3 - 4 = -1$.

# ---- Lesson 9: density curves and normal distributions
- id: stat-m2-r2-q12
  lesson: stat-normal
  type: label
  module_quiz: true
  topic: Normal distribution
  stem: 'A normal curve is divided at the mean and at 1, 2 and 3 standard deviations on each side. Name each numbered part: the percent of values in regions 1 to 4, and what point 5 is.'
  image: {src: images/stat-m2-empirical-blank.svg, alt: 'A normal curve with vertical lines at μ and at μ ± σ, μ ± 2σ and μ ± 3σ, and no percentages written in. Marker 1 is in the region from μ to μ + σ; marker 2 in the region from μ + σ to μ + 2σ; marker 3 in the thin region from μ + 2σ to μ + 3σ; marker 4 in the tail beyond μ + 3σ; marker 5 is on the curve directly above μ + σ.'}
  labels:
    - {x: 56.0, y: 56.5, text: 34%}
    - {x: 67.9, y: 73.3, text: 13.5%}
    - {x: 79.8, y: 79.3, text: 2.35%}
    - {x: 89.9, y: 79.4, text: 0.15%}
    - {x: 61.9, y: 41.8, text: Inflection point}
  distractors: [2.5%, 47.5%]
  explanation: |-
    68% lies within $\mu \pm \sigma$, half of it (34%) on each side. 95% lies within $\mu \pm 2\sigma$, so $47.5\% - 34\% = 13.5\%$ lies between $\sigma$ and $2\sigma$. 99.7% lies within $\mu \pm 3\sigma$, so $49.85\% - 47.5\% = 2.35\%$ lies between $2\sigma$ and $3\sigma$, leaving 0.15% beyond $3\sigma$. The curve changes from concave down to concave up at $\mu \pm \sigma$, its inflection points. (2.5% is everything beyond $2\sigma$; 47.5% is everything from $\mu$ to $2\sigma$.)

- id: stat-m2-r2-q13
  lesson: stat-normal
  type: text
  topic: Normal distribution
  stem: 'Heights are approximately $N(170, 7)$ cm. By the empirical rule, about ___% of heights are above 184 cm. Give only the number.'
  accept: ['2.5', '2.5%']
  explanation: |-
    $184 = 170 + 2(7)$, two SDs above the mean. 95% lies within $\pm 2\sigma$, so 5% is outside, half in each tail: 2.5%.

- id: stat-m2-r2-q14
  lesson: stat-normal
  type: order
  module_quiz: true
  topic: Normal distribution
  stem: 'For a normal distribution $N(\mu, \sigma)$, put these regions in order from the LARGEST to the SMALLEST proportion of values.'
  items:
    - 'Between $\mu - \sigma$ and $\mu + \sigma$'
    - 'Below $\mu - \sigma$'
    - 'Between $\mu + \sigma$ and $\mu + 2\sigma$'
    - 'Above $\mu + 2\sigma$'
    - 'Above $\mu + 3\sigma$'
  explanation: |-
    By the empirical rule the proportions are 68%, 16% (half of the 32% outside $\pm\sigma$), 13.5%, 2.5% and 0.15%.

- id: stat-m2-r2-q15
  lesson: stat-normal
  topic: Normal distribution
  stem: 'Which statements are true of EVERY normal density curve? Select all that apply.'
  choices:
    - 'It is symmetric about its mean $\mu$'
    - 'Its inflection points are at $\mu - \sigma$ and $\mu + \sigma$'
    - 'The total area under it is 1'
    - 'Its height at a value $x$ is the proportion of values equal to $x$'
  answer: [0, 1, 2]
  explanation: |-
    Every normal curve is symmetric about $\mu$, has inflection points one SD from the mean and, like every density curve, has total area 1. Heights are not proportions: only areas are, and the proportion at any single exact value of a continuous variable is 0.

- id: stat-m2-r2-q16
  lesson: stat-normal
  topic: Normal distribution
  stem: 'Curve A is $N(50, 5)$ and curve B is $N(50, 10)$. Which statement is true?'
  choices:
    - 'B''s peak is half as high as A''s'
    - 'B''s peak is twice as high as A''s'
    - 'Both peaks are equally high, because both areas are 1'
    - 'B is A shifted 5 units to the right'
  answer: 0
  explanation: |-
    Both are centered at 50. B is twice as wide, and since both areas must be 1, B is half as tall. (The peak height is $1/(\sigma\sqrt{2\pi})$: about 0.080 for A and 0.040 for B.) Shifting would change the mean, not the SD.

# ---- Lesson 10: normal calculations
- id: stat-m2-r2-q17
  lesson: stat-normal-calc
  type: match
  module_quiz: true
  topic: Normal calculations
  stem: '$X$ is $N(100, 15)$. Match each question to the calculation that answers it.'
  pairs:
    - ['$P(X < 130)$', 'Φ(2)']
    - ['$P(X > 130)$', '1 − Φ(2)']
    - ['$P(85 < X < 130)$', 'Φ(2) − Φ(−1)']
    - ['The 90th percentile of $X$', '100 + 1.28 × 15']
  distractors: ['Φ(2) − Φ(1)', '100 − 1.28 × 15']
  explanation: |-
    130 is $z = (130 - 100)/15 = 2$ and 85 is $z = -1$. Left area: $\Phi(2)$; right area: $1 - \Phi(2)$; between: $\Phi(2) - \Phi(-1)$. The 90th percentile has $z = \Phi^{-1}(0.90) \approx 1.28$, so $x = 100 + 1.28(15) \approx 119.2$. ($100 - 1.28 \times 15$ is the 10th percentile.)

- id: stat-m2-r2-q18
  lesson: stat-normal-calc
  type: order
  module_quiz: true
  topic: Normal calculations
  stem: 'Scores are $N(500, 100)$. Put the steps for finding the cutoff for the top 15% in order.'
  items:
    - 'Turn "top 15%" into an area of 0.85 to the left'
    - 'Find $z = \Phi^{-1}(0.85) \approx 1.04$'
    - 'Unstandardize: $x = 500 + 1.04(100)$'
    - 'Answer in context: about 604 or higher is in the top 15%'
  explanation: |-
    Inverse normal needs a LEFT area, so convert first; then find $z$, then unstandardize, then answer the question that was asked. ($\Phi^{-1}(0.85) \approx 1.036$, giving about 603.6.)

- id: stat-m2-r2-q19
  lesson: stat-normal-calc
  type: text
  topic: Normal calculations
  stem: 'For a standard normal $Z$, $P(Z > 1.25) = 0.1056$. By symmetry, $P(Z < -1.25) =$ ___.'
  accept: ['0.1056']
  explanation: |-
    The normal curve is symmetric about 0, so the area to the left of $-1.25$ equals the area to the right of $1.25$: 0.1056. This is $\Phi(-z) = 1 - \Phi(z)$.

- id: stat-m2-r2-q20
  lesson: stat-normal-calc
  topic: Normal calculations
  stem: 'For which of these variables would normal calculations be appropriate? Select all that apply.'
  choices:
    - 'Heights of adult women in a large sample, whose histogram is symmetric and bell-shaped'
    - 'Measurement errors of a lab scale, whose normal probability plot is close to a straight line'
    - 'Waiting times with mean 6 minutes and SD 5 minutes (times cannot be negative)'
    - 'Household incomes in a city, which are strongly right-skewed'
  answer: [0, 1]
  explanation: |-
    The first two have been checked: a bell-shaped histogram and a straight normal probability plot. Waiting times with the minimum, 0, only 1.2 SDs below the mean must be right-skewed (a normal model would put about 11.5% below 0). Strongly skewed incomes are not normal either.

- id: stat-m2-r2-q21
  lesson: stat-normal-calc
  topic: Normal calculations
  stem: 'For a standard normal $Z$, $P(Z < -0.84) \approx 0.20$. What is $P(-0.84 < Z < 0.84)$?'
  image: {src: images/stat-m2-three-areas.svg, alt: 'Three standard normal curves. Left: the area left of z is shaded, labeled Φ(z). Middle: the area right of z is shaded, labeled 1 − Φ(z). Right: the area between z₁ and z₂ is shaded, labeled Φ(z₂) − Φ(z₁).'}
  choices: ['0.80', '0.40', '0.20', '0.60']
  answer: 3
  explanation: |-
    By symmetry $P(Z > 0.84) \approx 0.20$ too, so the middle area is $1 - 0.20 - 0.20 = 0.60$. Equivalently, $\Phi(0.84) - \Phi(-0.84) = 0.80 - 0.20$. (0.80 is $\Phi(0.84)$ alone; 0.40 is both tails together.)

# ---- Honors: normal probability plots in depth
- id: stat-m2-r2-h01
  lesson: stat-m2-h-quantile-plots
  type: label
  topic: Normal probability plots
  stem: 'Name the numbered parts of this normal probability plot (data value up, expected z-score across).'
  image: {src: images/stat-m2-qq-parts-blank.svg, alt: 'A normal probability plot of twelve values with expected z-scores from −2 to +2 across and data values from 40 to 70 up. Eleven points lie close to a dashed line. Marker 1 is on a single point far above the line at the upper right (value 72). Marker 2 is on the dashed line near z = 1.6. Marker 3 is where the dashed line crosses z = 0, at a value of about 50. Marker 4 is on the lowest point, at the lower left (value 41).'}
  labels:
    - {x: 86.5, y: 14.8, text: Outlier}
    - {x: 84.1, y: 41.4, text: Reference line}
    - {x: 55.0, y: 56.7, text: Center of the data (line at z = 0)}
    - {x: 23.5, y: 73.8, text: Smallest observation}
  distractors: [Inflection point, Upper fence]
  explanation: |-
    Point 1 lies far above the line the other points follow: an outlier. The dashed reference line (2) is fitted to the middle of the data; its slope estimates the SD. Where it crosses $z = 0$ (3) is the center of the data, about 50. The lowest point (4) is the smallest observation, plotted against the most negative expected z-score. Inflection points belong to density curves, and fences to boxplots.

- id: stat-m2-r2-h02
  lesson: stat-m2-h-quantile-plots
  type: text
  topic: Normal probability plots
  stem: 'Using plotting positions $(i - 0.5)/n$, the plotting position of the 3rd smallest of 10 values is ___.'
  accept: ['0.25']
  explanation: |-
    $(3 - 0.5)/10 = 2.5/10 = 0.25$. Its expected z-score would be $\Phi^{-1}(0.25) \approx -0.67$.

- id: stat-m2-r2-h03
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'A sample has 20 values. Using plotting positions $(i - 0.5)/n$, what is the expected z-score of the smallest value?'
  choices: ['$-1.64$', '$-1.96$', '$-2.33$', '$0.025$']
  answer: 1
  explanation: |-
    $p_1 = (1 - 0.5)/20 = 0.025$, and $\Phi^{-1}(0.025) \approx -1.96$. ($-1.64$ comes from using $i/n = 0.05$; $-2.33$ is the 1st percentile; 0.025 is the plotting position, not the z-score.)

- id: stat-m2-r2-h04
  lesson: stat-m2-h-quantile-plots
  type: match
  topic: Normal probability plots
  stem: 'Each plot shows data value (up) against expected z-score (across), with a dashed line through the quartiles. Match each plot to the shape of the data.'
  image: {src: images/stat-m2-qq-letters.svg, alt: 'Four normal probability plots. A: an S shape, with the lowest points below the line and the highest points above it. B: a curve bending upward, flat at the left and steep at the right, with both ends above the line. C: the opposite S, with the lowest points above the line and the highest points below it, flat at both ends. D: a curve bending downward, steep at the left and flat at the right, with both ends below the line.'}
  pairs:
    - [Plot A, Heavy tails]
    - [Plot B, Right-skewed]
    - [Plot C, Light tails]
    - [Plot D, Left-skewed]
  distractors: [Approximately normal]
  explanation: |-
    Skew bends both ends the same way: B is concave up (right skew, the high values stretched out) and D concave down (left skew). Tails bend the ends opposite ways: in A the extremes on both sides are farther out than normal (heavy tails, steep ends); in C they are closer in (light tails, flat ends, as in a uniform distribution). None of the four follows its line, so none is approximately normal.

- id: stat-m2-r2-h05
  lesson: stat-m2-h-quantile-plots
  type: order
  topic: Normal probability plots
  stem: 'Put the steps for making a normal probability plot by hand in order.'
  items:
    - 'Sort the data from smallest to largest'
    - 'Give the $i$-th value the plotting position $(i - 0.5)/n$'
    - 'Convert each plotting position to an expected z-score with $\Phi^{-1}$'
    - 'Plot each data value against its expected z-score'
    - 'Judge whether the points follow a straight line'
  explanation: |-
    The plotting position depends on the rank $i$, so sorting comes first; z-scores come from the positions; only then can the points be plotted and judged.

- id: stat-m2-r2-h06
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'A normal probability plot (data up, expected z across) is close to the straight line $\text{value} = 120 + 15z$. What does this suggest?'
  choices:
    - 'The data are roughly normal with mean about 15 and SD about 120'
    - 'The data are right-skewed with median 120'
    - 'The data are roughly normal with mean about 120 and SD about 15'
    - 'About 15% of the values are above 120'
  answer: 2
  explanation: |-
    For normal data the $i$-th value is close to $\mu + \sigma z_i$, a line with intercept $\mu$ and slope $\sigma$. So the mean is about 120 and the SD about 15. A straight plot shows no skewness.

- id: stat-m2-r2-h07
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'Why are plotting positions $(i - 0.5)/n$ used rather than $i/n$?'
  choices:
    - 'With $i/n$ the largest value gets position 1, whose z-score is infinite'
    - 'With $i/n$ the plot would curve even for normal data'
    - 'With $i/n$ the smallest value would get a negative position'
    - 'With $i/n$ the slope of the line would no longer estimate the SD'
  answer: 0
  explanation: |-
    The largest of $n$ values would get $n/n = 1$, and $\Phi^{-1}(1)$ does not exist (it is infinitely far out). Subtracting 0.5 puts each value in the middle of its share of the distribution and keeps the positions symmetric about 0.5. Other conventions, such as $i/(n+1)$, also avoid 0 and 1.

- id: stat-m2-r2-h08
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'On a normal probability plot (data up, expected z across), both the lowest and the highest points lie ABOVE a line fitted through the middle, and the plot bends upward. What does this show?'
  choices:
    - 'Left skew'
    - 'Light tails'
    - 'Heavy tails'
    - 'Right skew'
  answer: 3
  explanation: |-
    A plot that is flat at the left and steep at the right (concave up) has bunched low values and stretched-out high values: right skew. Left skew bends the other way (both ends below the line). With heavy or light tails the two ends fall on opposite sides of the line.

- id: stat-m2-r2-h09
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'On a normal probability plot (data up, expected z across), the lowest points fall well BELOW the line and the highest points rise well ABOVE it, while the middle follows the line. What does this show?'
  choices:
    - 'Light tails'
    - 'Heavy tails'
    - 'Left skew'
    - 'Right skew'
  answer: 1
  explanation: |-
    Low values lower than normal and high values higher than normal mean the extremes on both sides are farther out than a normal model predicts: heavy tails. Light tails give the opposite S. Skewness bends both ends the same way.

- id: stat-m2-r2-h10
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'A sample of 10 values has probability plot correlation $r = 0.93$. About 5% of truly normal samples of size 10 have $r$ below 0.919. Which conclusions are justified? Select all that apply.'
  choices:
    - 'The plot''s departure from a line is within what normal samples of this size often show'
    - 'This check gives no strong evidence against a normal model'
    - 'The data are proven to come from a normal distribution'
    - 'The data must be skewed, because $r$ is less than 1'
  answer: [0, 1]
  explanation: |-
    $0.93 > 0.919$, so the wiggle is the kind truly normal samples often produce, and the check gives no strong evidence against normality. That is not proof: with only 10 values, real skewness can pass. And $r < 1$ by itself means nothing, since samples are never perfectly straight.

- id: stat-m2-r2-h11
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'Sorted data: 2, 9, 13, 15, 16, 17, 18, 18, 19, 20. What shape will the normal probability plot (data up, expected z across) have?'
  choices:
    - 'It bends downward, with both ends below the line: left-skewed'
    - 'It bends upward, with both ends above the line: right-skewed'
    - 'An S shape with steep ends: heavy tails'
    - 'Close to a straight line: approximately normal'
  answer: 0
  explanation: |-
    Look at the gaps: 7, 4, 2, 1, 1, 1, 0, 1, 1. The low values are spread far apart and the high values are bunched together. So the plot is steep at the left and flat at the right (concave down): left skew. The long tail is toward small values.

- id: stat-m2-r2-h12
  lesson: stat-m2-h-quantile-plots
  type: text
  topic: Normal probability plots
  stem: 'Right-skewed data with only positive values can often be made close to normal by taking the ___ of each value.'
  accept: [log, logs, logarithm, logarithms, log10, ln, natural log, natural logarithm, log base 10, logarithm base 10]
  explanation: |-
    Taking logarithms pulls in large values much more than small ones, which can remove right skew. In Example 3 the repair times' plot had $r = 0.946$; their base-10 logs gave $r = 0.9985$.

- id: stat-m2-r2-h13
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'For the repair times in the lesson, a normal model for the raw times says about 3% of repairs take over 20 hours, while a normal model for the logs (which fits) says about 6%. Why can models that agree well near the center differ so much here?'
  choices:
    - 'Because 20 hours is below the mean'
    - 'Because the logs have a smaller standard deviation than the raw times'
    - 'Because tail proportions depend on the shape of the distribution far from the center, where the models differ most'
    - 'Because a normal model can never be used for times'
  answer: 2
  explanation: |-
    20 hours is far out in the right tail, and tail areas depend on exactly how the curve thins out there. The right-skewed log model has a longer right tail than the symmetric raw model, so it puts twice as much area beyond 20. Comparing the SD of the logs with the raw SD means nothing, since they are in different units.

- id: stat-m2-r2-h14
  lesson: stat-m2-h-quantile-plots
  topic: Normal probability plots
  stem: 'Temperatures recorded to the nearest whole degree give a normal probability plot with several short horizontal runs of points, but overall the points follow a straight line. What is the best interpretation?'
  choices:
    - 'The data are bimodal'
    - 'The data have heavy tails'
    - 'A normal model is ruled out'
    - 'The runs come from rounding; a normal model is still reasonable'
  answer: 3
  explanation: |-
    Rounding makes several values exactly equal, and equal values plot at the same height: horizontal steps. Steps alone are not evidence against normality. Bimodality would show as a gap or cluster; heavy tails as an S shape.

# ---- Honors: specification limits and process capability
- id: stat-m2-r2-h15
  lesson: stat-m2-h-capability
  type: label
  topic: Process capability
  stem: 'Bolt lengths are normal, and a specification is drawn on the curve. Name the numbered parts.'
  image: {src: images/stat-m2-capability-blank.svg, alt: 'A normal curve of bolt lengths on an axis from 146 to 155 mm. Two solid vertical lines stand at 147 and 153, and a dashed vertical line at 150.3 through the peak. The small tail left of 147 and the larger tail right of 153 are shaded. Marker 1 is at the top of the line at 147; marker 2 at the top of the line at 153; marker 3 at the top of the dashed line at 150.3; marker 4 on the shaded tail right of 153; marker 5 on the shaded tail left of 147.'}
  labels:
    - {x: 19.2, y: 13.9, text: Lower specification limit}
    - {x: 72.0, y: 13.9, text: Upper specification limit}
    - {x: 48.2, y: 13.9, text: Process mean}
    - {x: 78.1, y: 76.1, text: Bolts that are too long}
    - {x: 15.7, y: 76.9, text: Bolts that are too short}
  distractors: [Inflection point, Upper fence]
  explanation: |-
    The solid lines at 147 and 153 mm are the specification limits, set by the design. The dashed line through the peak is the process mean, 150.3 mm. The shaded tails are the parts outside the limits: beyond 153 the bolts are too long, below 147 too short. Because the mean is above the middle (150), the right tail is larger.

- id: stat-m2-r2-h16
  lesson: stat-m2-h-capability
  type: text
  topic: Process capability
  stem: 'A specification is 9.1 to 10.9 mm and the process SD is 0.2 mm. $C_p =$ ___. Give only the number.'
  accept: ['1.5']
  explanation: |-
    $C_p = (\text{USL} - \text{LSL})/(6\sigma) = 1.8/(6 \times 0.2) = 1.8/1.2 = 1.5$.

- id: stat-m2-r2-h17
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'A specification is 47 to 53 mm. The process has mean 51 mm and SD 0.5 mm. What is $C_{pk}$?'
  choices: ['2.00', '1.33', '2.67', '0.67']
  answer: 1
  explanation: |-
    Distances to the limits: $53 - 51 = 2$ and $51 - 47 = 4$. The nearer is 2, so $C_{pk} = 2/(3 \times 0.5) = 1.33$. (2.00 is $C_p$, which ignores centering; 2.67 uses the farther limit; 0.67 divides by $6\sigma$ instead of $3\sigma$.)

- id: stat-m2-r2-h18
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'A normal process is centered with $C_p = 1$. About what fraction of its output is out of specification?'
  choices: ['0.135%', '5%', '0.27%', '32%']
  answer: 2
  explanation: |-
    $C_p = 1$ with centering puts each limit $3\sigma$ from the mean. The area beyond $\pm 3\sigma$ is $1 - 0.9973 = 0.0027$, or 0.27% (2,700 ppm). 0.135% counts only one tail; 5% is beyond $\pm 2\sigma$ and 32% beyond $\pm \sigma$.

- id: stat-m2-r2-h19
  lesson: stat-m2-h-capability
  type: order
  topic: Process capability
  stem: 'All four processes have the specification 47 to 53 mm. Put them in order from MOST capable to LEAST capable, judged by $C_{pk}$.'
  items:
    - 'Mean 50, SD 0.5'
    - 'Mean 51, SD 0.5'
    - 'Mean 50, SD 1'
    - 'Mean 51.5, SD 1'
  explanation: |-
    $C_{pk}$ values: $3/1.5 = 2$; $2/1.5 \approx 1.33$; $3/3 = 1$; $1.5/3 = 0.5$.

- id: stat-m2-r2-h20
  lesson: stat-m2-h-capability
  type: match
  topic: Process capability
  stem: 'Match each term to its meaning.'
  pairs:
    - [Specification limits, 'The range a part must fall in, set by the design or customer']
    - [Natural variation, 'The range the process actually produces, about μ ± 3σ']
    - ['$C_p$', 'Width of the specification divided by 6σ, ignoring centering']
    - ['$C_{pk}$', 'Distance from the mean to the nearer limit, divided by 3σ']
    - [ppm, Out-of-spec parts per million]
  distractors: ['Distance from the mean to the farther limit, divided by 3σ']
  explanation: |-
    Specification limits are requirements; natural variation is what the process does. $C_p$ compares their widths and would be achieved only by a centered process; $C_{pk}$ uses the nearer limit, so it accounts for centering. ppm is the out-of-spec proportion times 1,000,000.

- id: stat-m2-r2-h21
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'Which of these would raise a process''s $C_{pk}$? Select all that apply.'
  choices:
    - 'Moving an off-center mean toward the middle of the specification'
    - 'Reducing the process standard deviation'
    - 'Widening the specification limits, if the design safely allows it'
    - 'Measuring more parts without changing the process'
    - 'Moving the mean toward the nearer limit'
  answer: [0, 1, 2]
  explanation: |-
    $C_{pk} = \min(\text{USL} - \mu, \mu - \text{LSL})/(3\sigma)$. Centering increases the smaller distance, a smaller $\sigma$ shrinks the denominator, and wider limits increase both distances. Measuring more parts gives a better estimate but does not change the process. Moving toward the nearer limit makes the smaller distance smaller still.

- id: stat-m2-r2-h22
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'A specification is 9.7 to 10.3 mm. The process is $N(10.2, 0.1)$, so about 16% of parts are too long. Option A: re-center the mean at 10.0 (SD stays 0.1). Option B: cut the SD to 0.05 (mean stays 10.2). Which gives fewer out-of-spec parts?'
  choices:
    - 'Option B, about 0.27% out of spec versus 2.3% for A'
    - 'They are equal, because both double $C_{pk}$'
    - 'Option A, about 0.27% out of spec versus 2.3% for B'
    - 'Option B, because reducing σ always helps more than centering'
  answer: 2
  explanation: |-
    A: limits at $z = \pm 3$, so $2(0.00135) = 0.27\%$ out. B: the upper limit is $(10.3 - 10.2)/0.05 = 2$ SDs away, so $1 - \Phi(2) \approx 2.3\%$ are too long (the lower limit is 10 SDs away). Here the process was narrow but badly off center, so centering wins. A raises $C_{pk}$ from 0.33 to 1 and B to 0.67, so they don't both double it.

- id: stat-m2-r2-h23
  lesson: stat-m2-h-capability
  type: text
  topic: Process capability
  stem: 'A specification is 147 to 153 mm and the mean is held at 150 mm. For a "six sigma" process, $C_{pk} = 2$. The largest SD that achieves this is ___ mm. Give only the number.'
  accept: ['0.5']
  explanation: |-
    $C_{pk} = 3/(3\sigma) \ge 2$ gives $\sigma \le 3/6 = 0.5$ mm. Then each limit is $3/0.5 = 6$ SDs from the mean.

- id: stat-m2-r2-h24
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'Six Sigma is often described as "3.4 defects per million." What assumption produces that number?'
  choices:
    - 'The mean is assumed to drift $1.5\sigma$ toward one limit, leaving it $4.5\sigma$ away'
    - 'The limits are exactly $6\sigma$ from a perfectly centered mean'
    - 'Defects are counted in both tails beyond $3\sigma$'
    - 'The distribution is assumed to have heavy tails'
  answer: 0
  explanation: |-
    With a $1.5\sigma$ drift, the nearer limit is $6 - 1.5 = 4.5$ SDs away, and $1 - \Phi(4.5) \approx 3.4 \times 10^{-6}$. A centered six-sigma process would give only about 0.002 ppm. The $1.5\sigma$ shift is an industrial convention, not a law of statistics.

- id: stat-m2-r2-h25
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'From 50 measured parts, a centered process has $C_{pk} = 1.33$, and the normal model predicts about 63 out-of-spec parts per million. Why should this prediction be treated with caution?'
  choices:
    - 'Because $C_{pk}$ cannot be computed from 50 parts'
    - 'Because 63 ppm is too high for any real process'
    - 'Because the normal model always overstates defect rates'
    - 'Because it depends on the normal curve 4 SDs from the mean, far beyond the data, where heavier tails would mean many more defects'
  answer: 3
  explanation: |-
    The limits are $4\sigma$ away, and 50 parts give almost no information about the distribution that far out. If the real tails are heavier than normal, the true rate can be many times 63 ppm. The model can understate defects, not only overstate them.

- id: stat-m2-r2-h26
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'A process is predicted to produce 63 ppm out of specification. About how many out-of-spec parts would you expect in a run of 40,000 parts?'
  choices: ['About 0.25', 'About 2.5', 'About 25', 'About 252']
  answer: 1
  explanation: |-
    63 ppm is a proportion of $63/1{,}000{,}000 = 0.000063$. Expected count: $40{,}000 \times 0.000063 \approx 2.5$ parts.

- id: stat-m2-r2-h27
  lesson: stat-m2-h-capability
  topic: Process capability
  stem: 'A process has $C_p = 1.5$ but $C_{pk} = 0.6$. What does this tell you?'
  choices:
    - 'The spread is small enough, but the mean is far off center'
    - 'The process is centered, but the spread is too large'
    - 'The process is unstable'
    - 'An arithmetic error, because $C_{pk}$ is always at least $C_p$'
  answer: 0
  explanation: |-
    $C_p = 1.5$ says the specification is 1.5 times as wide as $6\sigma$, so the spread would be fine if centered. $C_{pk}$ is much lower only when the mean sits close to one limit. The fix is to re-center. $C_{pk}$ is never more than $C_p$, so this combination is possible. The indices alone cannot show instability; that needs a control chart.
