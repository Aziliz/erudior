# Module 3 — Two-variable data
# ---- Lesson 11: scatterplots and correlation
- id: stat-q-1101
  lesson: stat-scatter-corr
  module_quiz: true
  topic: Scatterplots and correlation
  stem: 'Which value of $r$ indicates the strongest linear relationship?'
  choices: ['0.75', '−0.20', '0.05', '−0.88']
  answer: 3
  explanation: |-
    Strength depends on $|r|$, not the sign. $|-0.88| = 0.88$ is the largest, so it is the
    strongest (a strong negative association).

- id: stat-q-1102
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'A researcher uses daily high temperature to predict electricity demand. Which is the response variable?'
  choices: ['Daily high temperature', 'The date', 'Electricity demand', 'Both are explanatory']
  answer: 2
  explanation: |-
    The response is the outcome being predicted — electricity demand. Temperature is the
    explanatory variable and goes on the horizontal axis.

- id: stat-q-1103
  lesson: stat-scatter-corr
  module_quiz: true
  topic: Scatterplots and correlation
  stem: 'A scatterplot shows points lying exactly on the curve $y = (x - 5)^2$ for $x = 1, 2, \ldots, 9$. What is the correlation?'
  choices: ['1', 'Close to −1', '0', 'Undefined']
  answer: 2
  explanation: |-
    The points are symmetric about $x = 5$: the products of z-scores on the left cancel those
    on the right, so $r = 0$. There is a perfect curved relationship, but no linear
    association. Always plot before computing $r$.

- id: stat-q-1104
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'Heights are converted from inches to centimeters and weights from pounds to kilograms. The correlation between height and weight'
  choices: ['is multiplied by 2.54', 'stays the same', 'changes sign', 'becomes 1']
  answer: 1
  explanation: |-
    $r$ is computed from z-scores, which are unchanged by positive linear changes of units.
    So $r$ is unchanged.

- id: stat-q-1105
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'Find $r$ for the points $(2, 10), (4, 14), (6, 15), (8, 21)$.'
  choices: ['0.932', '0.966', '0.850', '1.700']
  answer: 1
  explanation: |-
    $\bar{x} = 5$, $\bar{y} = 15$. Deviations: $x$: $-3, -1, 1, 3$; $y$: $-5, -1, 0, 6$.
    $S_{xy} = 15 + 1 + 0 + 18 = 34$, $S_{xx} = 20$, $S_{yy} = 25 + 1 + 0 + 36 = 62$.
    $r = 34/\sqrt{20 \cdot 62} = 34/35.21 \approx 0.966$. (1.7 is the slope, not $r$.)

- id: stat-q-1106
  lesson: stat-scatter-corr
  module_quiz: true
  topic: Scatterplots and correlation
  stem: 'Across cities, the number of fire trucks sent to a fire is strongly positively correlated with the amount of damage. The most reasonable explanation is'
  choices: ['fire trucks cause damage', 'a lurking variable — the size of the fire — increases both', 'damage causes more trucks to break down', 'the correlation must be a calculation error']
  answer: 1
  explanation: |-
    Bigger fires bring more trucks and do more damage. Fire size is a lurking variable
    behind the association. Correlation alone never establishes causation.

- id: stat-q-1107
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'Which statement about the correlation $r$ is FALSE?'
  choices: ['$r$ has no units', '$r$ is the same if $x$ and $y$ are swapped', '$r$ is resistant to outliers', '$r$ is always between −1 and 1']
  answer: 2
  explanation: |-
    $r$ is built from means and standard deviations, which are not resistant; a single
    outlier can change $r$ dramatically. The other statements are true.

- id: stat-q-1108
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'In a scatterplot, a point lies above the mean of $y$ and to the left of the mean of $x$. Its contribution $z_x z_y$ to $r$ is'
  choices: ['negative', 'positive', 'zero', 'impossible to determine']
  answer: 0
  explanation: |-
    Left of $\bar{x}$ means $z_x < 0$; above $\bar{y}$ means $z_y > 0$. The product is
    negative, pulling $r$ toward a negative association.

- id: stat-q-1109
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'Average income and average years of schooling for 50 states have $r = 0.86$. What can you say about the correlation for individual people?'
  choices: ['It is also exactly 0.86', 'It is likely stronger than 0.86', 'It is negative', 'It is likely weaker, because averages hide individual variation']
  answer: 3
  explanation: |-
    Correlations based on averages (ecological correlations) are usually much stronger
    than correlations among individuals, because averaging removes person-to-person
    scatter.

- id: stat-q-1110
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'A complete description of a scatterplot includes'
  choices: ['the mean and median of each variable', 'the slope of the regression line', 'only the value of $r$', 'direction, form, strength and unusual features']
  answer: 3
  explanation: |-
    Describe direction (positive/negative), form (linear/curved), strength (how tightly
    points follow the form), and outliers or clusters — in context.

- id: stat-q-1111
  lesson: stat-scatter-corr
  topic: Scatterplots and correlation
  stem: 'Every $y$ value in a data set is replaced by $-2y + 5$. What happens to $r$?'
  choices: ['It is unchanged', 'It is multiplied by −2', 'It becomes $-2r + 5$', 'Its sign flips but its size stays the same']
  answer: 3
  explanation: |-
    A negative multiplier reverses the direction of every $y$ deviation, flipping the sign
    of each $z_y$ and therefore of $r$. Its magnitude is unchanged; $r$ always stays within
    $[-1, 1]$.

# ---- Lesson 12: least-squares regression
- id: stat-q-1201
  lesson: stat-lsrl
  module_quiz: true
  topic: Least-squares regression
  stem: 'For a data set, $\bar{x} = 20$, $s_x = 3$, $\bar{y} = 80$, $s_y = 12$, $r = 0.6$. What is the slope of the least-squares line?'
  choices: ['0.15', '2.4', '0.6', '4']
  answer: 1
  explanation: |-
    $b = r\,s_y/s_x = 0.6 \times 12/3 = 2.4$. Using $s_x/s_y$ upside down gives 0.15; 4 is
    $s_y/s_x$ without $r$.

- id: stat-q-1202
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'For the same data ($\bar{x} = 20$, $\bar{y} = 80$, $b = 2.4$), what is the intercept?'
  choices: ['32', '128', '78', '48']
  answer: 0
  explanation: |-
    $a = \bar{y} - b\bar{x} = 80 - 2.4(20) = 80 - 48 = 32$. Adding instead of subtracting
    gives 128.

- id: stat-q-1203
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'The least-squares line always passes through which point?'
  choices: ['$(0, 0)$', '$(0, \bar{y})$', '$(\bar{x}, \bar{y})$', 'The point with the largest $x$']
  answer: 2
  explanation: |-
    From $a = \bar{y} - b\bar{x}$, plugging $x = \bar{x}$ into $\hat{y} = a + bx$ gives
    $\hat{y} = \bar{y}$. The line passes through the point of means.

- id: stat-q-1204
  lesson: stat-lsrl
  module_quiz: true
  topic: Least-squares regression
  stem: 'A regression of fuel efficiency (mpg) on vehicle weight (thousands of lb) gives $\widehat{\text{mpg}} = 48 - 6.2(\text{weight})$. Which interpretation of the slope is correct?'
  choices: ['Each additional 1,000 lb is associated with a predicted decrease of 6.2 mpg, on average', 'Each car loses exactly 6.2 mpg per 1,000 lb', 'A car weighing 0 lb gets 48 mpg', 'Fuel efficiency causes weight to decrease']
  answer: 0
  explanation: |-
    The slope is the predicted change in $y$ per unit of $x$: $-6.2$ mpg per 1,000 lb, on
    average. It describes the line, not a guaranteed change for each car, and doesn't
    establish causation. A weightless car is extrapolation.

- id: stat-q-1205
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'Using $\widehat{\text{mpg}} = 48 - 6.2(\text{weight})$, predict the mpg of a 3,500 lb vehicle.'
  choices: ['26.3 mpg', '21.7 mpg', '69.7 mpg', '44.5 mpg']
  answer: 0
  explanation: |-
    Weight is in thousands of pounds, so $x = 3.5$: $48 - 6.2(3.5) = 48 - 21.7 = 26.3$ mpg.
    21.7 is the amount subtracted; adding gives 69.7.

- id: stat-q-1206
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'A line was fitted to children''s heights for ages 2 to 10. Using it to predict height at age 30 is an example of'
  choices: ['interpolation', 'regression toward the mean', 'a residual', 'extrapolation']
  answer: 3
  explanation: |-
    Predicting far outside the range of the observed $x$ values is extrapolation. Growth
    stops in the late teens, so the linear pattern won't continue.

- id: stat-q-1207
  lesson: stat-lsrl
  module_quiz: true
  topic: Least-squares regression
  stem: 'The least-squares line is the line that'
  choices: ['passes through the most data points', 'minimizes the sum of the residuals', 'minimizes the sum of the squared residuals', 'has slope equal to $r$']
  answer: 2
  explanation: |-
    Least squares minimizes $\sum (y - \hat{y})^2$. The plain sum of residuals is zero for many
    lines (any line through $(\bar{x}, \bar{y})$), so it can't single one out.

- id: stat-q-1208
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'Fathers'' and sons'' heights have $r = 0.5$, with equal means and SDs. A father is 2 SDs above the mean. The regression line predicts his son will be'
  choices: ['2 SDs above the mean', '1 SD above the mean', '0.5 SDs above the mean', 'at the mean']
  answer: 1
  explanation: |-
    In standardized units, the predicted $z_y = r \cdot z_x = 0.5 \times 2 = 1$. The prediction
    is less extreme than the father's height — regression toward the mean.

- id: stat-q-1209
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'Find the least-squares line for $(2, 10), (4, 14), (6, 15), (8, 21)$, given $S_{xy} = 34$ and $S_{xx} = 20$.'
  choices: ['$\hat{y} = 1.7 + 6.5x$', '$\hat{y} = 6.5 + 1.7x$', '$\hat{y} = 15 + 1.7x$', '$\hat{y} = 6.5 + 0.59x$']
  answer: 1
  explanation: |-
    $b = 34/20 = 1.7$ and $a = \bar{y} - b\bar{x} = 15 - 1.7(5) = 6.5$. So
    $\hat{y} = 6.5 + 1.7x$. The line $\hat{y} = 1.7 + 6.5x$ swaps slope and intercept; 0.59 is $S_{xx}/S_{xy}$.

- id: stat-q-1210
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'If the correlation is $r = 0$, the least-squares line is'
  choices: ['vertical at $x = \bar{x}$', 'undefined', 'the line $y = x$', 'horizontal at $y = \bar{y}$']
  answer: 3
  explanation: |-
    $b = r\,s_y/s_x = 0$, and $a = \bar{y}$. With no linear association, the best prediction
    for every $x$ is just the mean of $y$.

- id: stat-q-1211
  lesson: stat-lsrl
  topic: Least-squares regression
  stem: 'You computed the line predicting $y$ from $x$. To predict $x$ from $y$, you should'
  choices: ['solve the same equation for $x$', 'take the reciprocal of the slope', 'use the same slope', 'refit a new least-squares line with $y$ as the explanatory variable']
  answer: 3
  explanation: |-
    Regression is not symmetric: predicting $x$ from $y$ minimizes horizontal errors and gives
    slope $r\,s_x/s_y$, which is generally not the reciprocal of $r\,s_y/s_x$ (unless $|r| = 1$).

# ---- Lesson 13: residuals, r², influence
- id: stat-q-1301
  lesson: stat-residuals
  module_quiz: true
  topic: Residuals and r-squared
  stem: 'A regression predicts a house price of \$312,000; the house actually sold for \$298,000. What is the residual?'
  choices: ['−\$14,000', '\$14,000', '\$610,000', '−\$298,000']
  answer: 0
  explanation: |-
    Residual = observed − predicted $= 298{,}000 - 312{,}000 = -14{,}000$. The negative
    residual means the line over-predicted; the point is below the line.

- id: stat-q-1302
  lesson: stat-residuals
  module_quiz: true
  topic: Residuals and r-squared
  stem: 'A regression has $r = -0.85$. Which statement about $r^2$ is correct?'
  choices: ['$r^2 = -0.7225$', 'About 85% of the variation in $y$ is explained by $x$', 'About 72% of the variation in $y$ is explained by the linear relationship with $x$', '$r^2$ cannot be computed for a negative correlation']
  answer: 2
  explanation: |-
    $r^2 = (-0.85)^2 = 0.7225$ — always nonnegative. About 72% of the variation in $y$ is
    accounted for by the linear relationship. 85% confuses $r$ with $r^2$.

- id: stat-q-1303
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'A residual plot shows residuals that are negative for small $x$, positive in the middle and negative again for large $x$. What does this mean?'
  choices: ['The linear model is appropriate', 'There is an outlier', 'The relationship is curved, so a straight line is not the best model', 'The correlation is zero']
  answer: 2
  explanation: |-
    A systematic curved pattern in the residuals shows the line misses the form of the
    relationship. A good linear model leaves random scatter around zero.

- id: stat-q-1304
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'A regression of $y$ on $x$ has $r^2 = 0.49$ and a negative slope. What is $r$?'
  choices: ['0.7', '−0.49', '−0.2401', '−0.7']
  answer: 3
  explanation: |-
    $|r| = \sqrt{0.49} = 0.7$, and $r$ has the same sign as the slope: $r = -0.7$.

- id: stat-q-1305
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'For a regression on $n = 12$ points, SSE $= 250$. What is the standard deviation of the residuals $s$?'
  choices: ['4.77', '5.00', '20.8', '25.0']
  answer: 1
  explanation: |-
    $s = \sqrt{\text{SSE}/(n - 2)} = \sqrt{250/10} = \sqrt{25} = 5$. Dividing by $n = 12$ gives
    4.56; dividing by 11 gives 4.77 — both use the wrong degrees of freedom.

- id: stat-q-1306
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'Which point is most likely to be influential in a regression?'
  choices: ['A point with $x$ near $\bar{x}$ and a large residual', 'A point with $x$ far from all the other $x$ values that doesn''t follow the pattern', 'A point exactly on the line near $(\bar{x}, \bar{y})$', 'Any point with a negative residual']
  answer: 1
  explanation: |-
    High leverage (an extreme $x$) combined with not following the pattern gives a point
    great pull on the slope. A point near $\bar{x}$ mostly shifts the intercept slightly even
    if its residual is large.

- id: stat-q-1307
  lesson: stat-residuals
  module_quiz: true
  topic: Residuals and r-squared
  stem: 'Why might an influential point have a small residual?'
  choices: ['Because influential points are always near the mean', 'Because the residual plot is curved', 'Because $r^2$ is large', 'Because it pulls the regression line toward itself']
  answer: 3
  explanation: |-
    A high-leverage point drags the fitted line close to it, which shrinks its own residual.
    That is why you detect influence by refitting without the point, not by residual size.

- id: stat-q-1308
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'For a least-squares line, the residuals always'
  choices: ['sum to zero', 'are all positive', 'sum to SSE', 'equal the deviations $y - \bar{y}$']
  answer: 0
  explanation: |-
    Because the LSRL passes through $(\bar{x}, \bar{y})$ with the least-squares slope, its
    residuals sum (and average) to exactly zero. Their squares sum to SSE.

- id: stat-q-1309
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'A regression has SST $= 400$ and SSE $= 100$. What is $r^2$?'
  choices: ['0.25', '0.75', '0.50', '4.00']
  answer: 1
  explanation: |-
    $r^2 = 1 - \text{SSE}/\text{SST} = 1 - 100/400 = 0.75$. 0.25 is $\text{SSE}/\text{SST}$, the
    fraction not explained.

- id: stat-q-1310
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'A student says "$r^2 = 0.64$, so 64% of the data points lie on the regression line." What is wrong?'
  choices: ['Nothing; that is the correct interpretation', '$r^2$ should be read as 0.8', '$r^2$ is the fraction of the variation in $y$ explained by the line, not a fraction of points', '$r^2$ measures the slope']
  answer: 2
  explanation: |-
    $r^2$ compares squared prediction errors with and without the line: 64% of the variation
    in $y$ is accounted for. It says nothing about how many points are on the line.

- id: stat-q-1311
  lesson: stat-residuals
  topic: Residuals and r-squared
  stem: 'A residual plot shows no curved pattern, but the spread of residuals grows steadily as $x$ increases (a fan shape). What does this suggest?'
  choices: ['Predictions are less precise for larger $x$', 'The relationship is curved', 'There are no outliers, so the model is perfect', 'The slope is zero']
  answer: 0
  explanation: |-
    A fan shape means the size of typical errors depends on $x$: predictions for large $x$
    are less reliable. A single $s$ understates error there. (A transformation such as
    $\log y$ often helps.)

# ---- Lesson 14: transformations
- id: stat-q-1401
  lesson: stat-transform-linear
  module_quiz: true
  topic: Nonlinear models
  stem: 'A plot of $\log y$ against $x$ is linear. Which model fits the original data?'
  choices: ['Linear: $y = a + bx$', 'Power: $y = ax^p$', 'Exponential: $y = ab^x$', 'Quadratic: $y = ax^2$']
  answer: 2
  explanation: |-
    $y = ab^x$ gives $\log y = \log a + x\log b$, which is linear in $x$. A power model is
    linear when both variables are logged.

- id: stat-q-1402
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'A model is $\widehat{\log_{10} y} = 0.9 + 0.12x$. Predict $y$ at $x = 10$.'
  choices: ['2.1', '8.17', '13.2', '125.9']
  answer: 3
  explanation: |-
    $\widehat{\log y} = 0.9 + 1.2 = 2.1$, so $\hat{y} = 10^{2.1} \approx 125.9$. Reporting 2.1
    forgets to back-transform; 8.17 uses $e^{2.1}$, the wrong inverse for a base-10 log.

- id: stat-q-1403
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'For the model $\widehat{\log_{10} y} = 0.9 + 0.12x$, by what factor does the predicted $y$ change for each unit increase in $x$?'
  choices: ['It increases by 0.12', 'It multiplies by about 1.32', 'It multiplies by 0.12', 'It increases by 12%']
  answer: 1
  explanation: |-
    Each unit adds 0.12 to $\log y$, which multiplies $y$ by $10^{0.12} \approx 1.318$ — about
    a 32% increase per unit.

- id: stat-q-1404
  lesson: stat-transform-linear
  module_quiz: true
  topic: Nonlinear models
  stem: 'A plot of $\ln y$ against $\ln x$ is linear with slope 3. What kind of relationship is this?'
  choices: ['$y$ is proportional to $x^3$ (a power model)', '$y$ grows by a factor of 3 per unit of $x$', '$y$ increases by 3 per unit of $x$', '$y$ is proportional to $3^x$']
  answer: 0
  explanation: |-
    $\ln y = c + 3\ln x$ means $y = e^c x^3$: a power model with exponent 3 (like volume
    versus length).

- id: stat-q-1405
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'A power model is $\widehat{\ln y} = 1.2 + 0.5\ln x$. Predict $y$ when $x = 9$.'
  choices: ['2.30', '6.00', '9.96', '3.32']
  answer: 2
  explanation: |-
    $\widehat{\ln y} = 1.2 + 0.5\ln 9 = 1.2 + 1.0986 = 2.2986$, so $\hat{y} = e^{2.2986} \approx 9.96$.
    Equivalently $\hat{y} = e^{1.2}\sqrt{9} = 3.32 \times 3$.

- id: stat-q-1406
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'Two transformations of the same data give $r^2 = 0.97$ (log y vs. x) and $r^2 = 0.95$ (log y vs. log x). The first residual plot shows a clear curve; the second shows random scatter. Which model is better?'
  choices: ['The exponential model, because its $r^2$ is higher', 'Neither; use the untransformed line', 'They are equally good', 'The power model, because its residuals show no pattern']
  answer: 3
  explanation: |-
    A curved residual plot means the model has the wrong form, regardless of a slightly
    higher $r^2$. The power model's patternless residuals indicate a better fit.

- id: stat-q-1407
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'Why do logarithms straighten exponential growth?'
  choices: ['They turn repeated multiplication by $b$ into repeated addition of $\log b$', 'They remove outliers', 'They make all values positive', 'They reduce the number of data points']
  answer: 0
  explanation: |-
    Multiplying $y$ by $b$ each step adds $\log b$ to $\log y$ each step. Constant additions
    are exactly what a straight line describes.

- id: stat-q-1408
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'A car''s value follows $\widehat{\log_{10} V} = 4.4 - 0.05t$, with $t$ in years. About what percent of its value does the car lose each year?'
  choices: ['5%', '0.05%', '10.9%', '89.1%']
  answer: 2
  explanation: |-
    Each year multiplies $V$ by $10^{-0.05} \approx 0.891$, a loss of about 10.9%. The slope
    $-0.05$ is on the log scale and isn't a percent; 89.1% is the fraction kept.

- id: stat-q-1409
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'Which data would most likely be well described by an exponential model?'
  choices: ['Area of a square versus side length', 'Distance traveled at constant speed versus time', 'Height of children versus age (ages 3–10)', 'Value of an investment earning a fixed percent each year versus years']
  answer: 3
  explanation: |-
    A fixed percent growth multiplies the value by the same factor each year — exponential.
    Area vs. side is a power model; constant-speed distance and child height (in that range)
    are roughly linear.

- id: stat-q-1410
  lesson: stat-transform-linear
  topic: Nonlinear models
  stem: 'After fitting $\widehat{\sqrt{y}} = 2 + 0.5x$, what is the predicted $y$ at $x = 6$?'
  choices: ['5', '25', '2.24', '10']
  answer: 1
  explanation: |-
    $\widehat{\sqrt{y}} = 2 + 3 = 5$; undo the square root by squaring: $\hat{y} = 25$.

# ---- Lesson 15: two-way tables
- id: stat-q-1501
  lesson: stat-two-way
  module_quiz: true
  topic: Two-way tables
  stem: |-
    A survey: of 120 dog owners, 84 exercise daily; of 180 non-owners, 72 exercise daily.
    What percent of dog owners exercise daily?
  choices: ['28%', '70%', '40%', '53.8%']
  answer: 1
  explanation: |-
    Condition on dog owners: $84/120 = 70\%$. 28% divides by the grand total (300); 40% is
    the rate for non-owners ($72/180$).

- id: stat-q-1502
  lesson: stat-two-way
  topic: Two-way tables
  stem: |-
    Using the same survey (dog owners: 84 of 120 exercise daily; non-owners: 72 of 180),
    what percent of daily exercisers own a dog?
  choices: ['70%', '28%', '53.8%', '46.2%']
  answer: 2
  explanation: |-
    Condition on daily exercisers: $84 + 72 = 156$ total, so $84/156 \approx 53.8\%$. Same
    cell, different denominator than "percent of owners who exercise."

- id: stat-q-1503
  lesson: stat-two-way
  module_quiz: true
  topic: Two-way tables
  stem: 'Which comparison shows whether dog ownership and daily exercise are associated?'
  choices: ['Compare 84 with 72', 'Compare the marginal totals 120 and 180', 'Compare the percent of owners who exercise (70%) with the percent of non-owners who exercise (40%)', 'Compare 84 with 300']
  answer: 2
  explanation: |-
    Association means the conditional distributions differ across groups. 70% versus 40%
    shows a clear association. Raw counts are misleading because the groups have different
    sizes.

- id: stat-q-1504
  lesson: stat-two-way
  topic: Two-way tables
  stem: 'In a two-way table, the joint relative frequency of a cell is computed by dividing the cell count by'
  choices: ['its row total', 'its column total', 'the grand total', 'the largest cell']
  answer: 2
  explanation: |-
    Joint distribution: cell ÷ grand total. Dividing by a row or column total gives a
    conditional distribution.

- id: stat-q-1505
  lesson: stat-two-way
  topic: Two-way tables
  stem: |-
    In a study of 500 people, 200 are smokers. Of the smokers, 30 have a lung condition; of
    the non-smokers, 15 do. What is the marginal percent of people with the condition?
  choices: ['15%', '9%', '6%', '3%']
  answer: 1
  explanation: |-
    Marginal: total with the condition ÷ grand total $= (30 + 15)/500 = 45/500 = 9\%$.
    15% is the rate among smokers ($30/200$); 6% is $30/500$ (a joint percent).

- id: stat-q-1506
  lesson: stat-two-way
  topic: Two-way tables
  stem: 'Hospital A has higher survival than Hospital B for mild cases and for severe cases, yet lower survival overall. This is an example of'
  choices: ['regression toward the mean', 'extrapolation', 'a residual', 'Simpson''s paradox']
  answer: 3
  explanation: |-
    An association that reverses when groups are combined is Simpson's paradox. Here
    Hospital A treats a much higher share of severe cases, a lurking variable.

- id: stat-q-1507
  lesson: stat-two-way
  module_quiz: true
  topic: Two-way tables
  stem: 'Which graph is best for showing the conditional distribution of a categorical variable within each of several groups?'
  choices: ['A segmented bar chart with each bar scaled to 100%', 'A scatterplot', 'A histogram', 'A boxplot']
  answer: 0
  explanation: |-
    Scaling each group's bar to 100% and dividing it by category shows the conditional
    distribution directly, so groups of different sizes compare fairly.

- id: stat-q-1508
  lesson: stat-two-way
  topic: Two-way tables
  stem: |-
    For 40 men, 26 prefer brand X; for 60 women, 39 prefer brand X. What do you conclude?
  choices: ['Men prefer X more, since 26 < 39 means fewer women', 'Gender and brand preference are not associated: 65% of each group prefers X', 'Women prefer X more, since 39 > 26', 'The data cannot be compared']
  answer: 1
  explanation: |-
    $26/40 = 65\%$ and $39/60 = 65\%$. Identical conditional distributions mean no
    association. Comparing counts misleads because the groups differ in size.

- id: stat-q-1509
  lesson: stat-two-way
  topic: Two-way tables
  stem: |-
    Two airlines' on-time rates: at Airport 1, Airline P is on time for 90 of 100 flights and
    Q for 340 of 400; at Airport 2, P is on time for 240 of 400 and Q for 55 of 100. Which
    statement is true?
  choices: ['Q is better at both airports and overall', 'P is better at both airports but Q is better overall', 'P is better at both airports and overall', 'Q is better at both airports but P is better overall']
  answer: 1
  explanation: |-
    Airport 1: P 90%, Q 85%. Airport 2: P 60%, Q 55%. P wins at each airport. Overall: P
    $330/500 = 66\%$, Q $395/500 = 79\%$. Q wins overall because most of its flights use the
    easier Airport 1 — Simpson's paradox.

- id: stat-q-1510
  lesson: stat-two-way
  topic: Two-way tables
  stem: 'The marginal distribution of a variable in a two-way table'
  choices: ['describes that variable alone, ignoring the other variable', 'describes one variable within a single category of the other', 'is always uniform', 'is found by dividing each cell by its row total']
  answer: 0
  explanation: |-
    Marginal distributions come from the row or column totals divided by the grand total —
    the other variable is ignored. Within one category is a conditional distribution.

- id: stat-q-1511
  lesson: stat-two-way
  module_quiz: true
  topic: Two-way tables
  stem: 'In a mosaic plot of commuters by age group (one bar per age group) and transit mode (segments), what does the width of each bar show?'
  choices: ['The percent of that age group who take the train', 'The proportion of all commuters who are in that age group', 'The number of transit modes used by that age group', 'The conditional distribution of age group among train riders']
  answer: 1
  explanation: |-
    Bar widths are proportional to group sizes, so they show the marginal distribution of age
    group. The percent of an age group taking the train is a segment height (a conditional
    distribution), not a width. The number of modes is the number of segments, and age group
    among train riders conditions the other way round.

- id: stat-q-1512
  lesson: stat-two-way
  topic: Two-way tables
  stem: 'A mosaic plot shows 400 rail passengers by ticket type and trip purpose. The weekend-ticket bar takes up 30% of the total width, and its leisure segment fills 70% of that bar''s height. How many passengers bought weekend tickets for leisure trips?'
  choices: ['280', '120', '84', '21']
  answer: 2
  explanation: |-
    The width gives the group: $0.30 \times 400 = 120$ weekend-ticket passengers. The height gives
    the share of that group: $0.70 \times 120 = 84$. Using only the height ($0.70 \times 400 = 280$)
    ignores the width, and stopping at 120 ignores the height. 21 is $0.30 \times 0.70 = 0.21$
    read as a count instead of multiplied by 400.

- id: stat-q-1513
  lesson: stat-two-way
  topic: Two-way tables
  stem: 'What does a mosaic plot show that a segmented bar chart of the same two-way table does not?'
  choices: ['The sizes of the groups, because bar widths are proportional to group totals and so rectangle areas are proportional to cell counts', 'Raw counts instead of percents, because its bars are not scaled to 100%', 'Each category as a separate bar side by side instead of stacked segments', 'The whole data set as one bar instead of one bar per group']
  answer: 0
  explanation: |-
    Both charts scale each bar to 100% and stack the conditional distribution; the mosaic plot
    adds varying bar widths, so each rectangle's area is proportional to its count. Saying its
    bars aren't scaled to 100% is false. Separate bars side by side describe a side-by-side bar
    chart, and a single bar for all the data would show only one distribution.

- id: stat-q-1514
  lesson: stat-two-way
  module_quiz: true
  topic: Two-way tables
  stem: 'A survey of 250 students has 100 juniors and 150 seniors; 40 juniors and 105 seniors drive to school. In a mosaic plot with one bar per class year, what fraction of the total width is the seniors'' bar, and what fraction of that bar''s height is the "drive" segment?'
  choices: ['Width 0.6; drive segment $105/250 = 0.42$', 'Width 0.5; drive segment 0.7', 'Width 0.6; drive segment $105/145 \approx 0.72$', 'Width 0.6; drive segment 0.7']
  answer: 3
  explanation: |-
    Width: $150/250 = 0.6$ of the students are seniors. Height: $105/150 = 0.7$ of seniors drive.
    Dividing 105 by the grand total gives the joint proportion 0.42, not the conditional one.
    Equal widths of 0.5 describe a segmented bar chart, not a mosaic plot. $105/145$ is the
    share of drivers who are seniors, which conditions on the wrong variable.
