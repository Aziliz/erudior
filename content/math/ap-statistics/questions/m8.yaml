# Module 8 — Significance tests
# ---- Lesson 33: logic of tests
- id: stat-q-3301
  lesson: stat-test-logic
  module_quiz: true
  topic: Significance tests
  stem: 'A p-value of 0.03 means'
  choices: ['there is a 3% chance the null hypothesis is true', 'if $H_0$ were true, there would be a 3% chance of getting a result at least as extreme as the one observed', 'there is a 97% chance the alternative is true', 'the result will occur 3% of the time in the future']
  answer: 1
  explanation: |-
    The p-value is computed assuming $H_0$ is true; it is the probability of data this extreme
    (or more), not the probability of any hypothesis.

- id: stat-q-3302
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'Which pair of hypotheses is written correctly?'
  choices: ['$H_0: \hat{p} = 0.4$, $H_a: \hat{p} > 0.4$', '$H_0: \mu > 20$, $H_a: \mu = 20$', '$H_0: p = 0.4$, $H_a: p > 0.4$', '$H_0: \bar{x} = 20$, $H_a: \bar{x} \ne 20$']
  answer: 2
  explanation: |-
    Hypotheses concern parameters ($p$, $\mu$), never statistics ($\hat{p}$, $\bar{x}$), and the null
    states a single value with "=".

- id: stat-q-3303
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A two-sided z test gives $z = 2.40$. What is the p-value?'
  choices: ['0.0082', '0.9918', '0.0164', '0.0328']
  answer: 2
  explanation: |-
    $P(Z \ge 2.40) \approx 0.0082$; double it for a two-sided test: 0.0164.

- id: stat-q-3304
  lesson: stat-test-logic
  module_quiz: true
  topic: Significance tests
  stem: 'A test gives p-value 0.12 at $\alpha = 0.05$. Which conclusion is correct?'
  choices: ['Accept $H_0$; it is true', 'Fail to reject $H_0$; there is not convincing evidence for $H_a$', 'Reject $H_0$', 'The test proves there is no effect']
  answer: 1
  explanation: |-
    $0.12 > 0.05$, so we fail to reject $H_0$. That means the evidence isn't strong enough — not
    that $H_0$ has been shown true.

- id: stat-q-3305
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A researcher suspects a new process reduces the defect rate from its current 6%. Which alternative hypothesis fits?'
  choices: ['$H_a: p \ne 0.06$', '$H_a: p > 0.06$', '$H_a: \hat{p} < 0.06$', '$H_a: p < 0.06$']
  answer: 3
  explanation: |-
    The research question specifies a direction (reduction), so the alternative is one-sided:
    $p < 0.06$, stated about the parameter.

- id: stat-q-3306
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'For $H_a: \mu > \mu_0$, a z test gives $z = 1.20$. What is the p-value?'
  choices: ['0.1151', '0.8849', '0.2302', '0.0575']
  answer: 0
  explanation: |-
    One-sided, upper tail: $P(Z \ge 1.20) = 1 - 0.8849 = 0.1151$.

- id: stat-q-3307
  lesson: stat-test-logic
  module_quiz: true
  topic: Significance tests
  stem: 'A 95% confidence interval for $\mu$ is (12.4, 15.8). At $\alpha = 0.05$, a two-sided test of $H_0: \mu = 16$ would'
  choices: ['fail to reject $H_0$', 'need more information', 'reject $H_0$, because 16 is outside the interval', 'reject $H_0$ only if the test is one-sided']
  answer: 2
  explanation: |-
    A two-sided level-$\alpha$ test rejects exactly the null values outside the $(1 - \alpha)$
    interval. 16 is not plausible, so reject.

- id: stat-q-3308
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A study of 80,000 people finds a statistically significant (p < 0.001) difference in mean blood pressure of 0.4 mmHg between two groups. What is the best comment?'
  choices: ['The difference is clinically important because it is significant', 'The study must have an error', 'The difference is real but probably too small to matter in practice', 'The p-value is too small to be trusted']
  answer: 2
  explanation: |-
    Huge samples can detect tiny effects. Statistical significance says the difference is
    unlikely to be chance, not that it's important.

- id: stat-q-3309
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'Which value of the test statistic gives the strongest evidence against $H_0: p = 0.5$ in favor of $H_a: p < 0.5$?'
  choices: ['$z = 2.5$', '$z = -0.5$', '$z = 0$', '$z = -2.5$']
  answer: 3
  explanation: |-
    For a "<" alternative, evidence comes from values far below 0. $z = -2.5$ has the smallest
    left-tail area. $z = 2.5$ points the other way and gives a p-value near 1.

- id: stat-q-3310
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'Why must the significance level $\alpha$ be chosen before seeing the data?'
  choices: ['So the result can''t be made "significant" by picking $\alpha$ after the fact', 'Because $\alpha$ depends on the sample mean', 'Because $\alpha$ is always 0.05', 'Because the p-value depends on $\alpha$']
  answer: 0
  explanation: |-
    Choosing $\alpha$ after seeing a p-value of, say, 0.08 invites picking 0.10 to get a
    significant result. Fixing it in advance keeps the Type I error rate honest.

- id: stat-q-3311
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A t statistic of 2.5 with 9 degrees of freedom, two-sided. Approximately what is the p-value?'
  choices: ['0.017', '0.034', '0.012', '0.066']
  answer: 1
  explanation: |-
    $P(t_9 \ge 2.5) \approx 0.017$; doubling for two sides gives about 0.034. (Using the normal
    table instead would give 0.012.)

# ---- Lesson 34: errors and power
- id: stat-q-3401
  lesson: stat-errors-power
  module_quiz: true
  topic: Errors and power
  stem: 'A Type I error occurs when we'
  choices: ['fail to reject a false $H_0$', 'reject a true $H_0$', 'reject a false $H_0$', 'fail to reject a true $H_0$']
  answer: 1
  explanation: |-
    Type I: a false alarm — rejecting a null hypothesis that is actually true. Failing to
    reject a false $H_0$ is a Type II error.

- id: stat-q-3402
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'A food-safety lab tests $H_0$: a batch is safe vs. $H_a$: the batch is contaminated. Describe a Type II error and its consequence.'
  choices: ['Concluding a safe batch is contaminated; it is destroyed unnecessarily', 'Concluding a contaminated batch is contaminated; it is destroyed', 'Concluding a safe batch is safe; it is sold', 'Concluding a contaminated batch is safe; contaminated food is sold']
  answer: 3
  explanation: |-
    A Type II error fails to reject a false $H_0$: the batch really is contaminated but the
    test doesn't detect it, so it reaches customers.

- id: stat-q-3403
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'If a test uses $\alpha = 0.05$, what is the probability of a Type I error (when $H_0$ is true)?'
  choices: ['0.95', '0.05', 'It depends on the sample size', 'It equals the power']
  answer: 1
  explanation: |-
    When $H_0$ is true, the test rejects with probability $\alpha$. Sample size affects the Type
    II error, not the Type I error rate.

- id: stat-q-3404
  lesson: stat-errors-power
  module_quiz: true
  topic: Errors and power
  stem: 'Which change increases the power of a test, with everything else fixed?'
  choices: ['Decreasing the sample size', 'Decreasing $\alpha$ from 0.05 to 0.01', 'Increasing the sample size', 'Choosing a true parameter value closer to the null value']
  answer: 2
  explanation: |-
    Larger $n$ shrinks the standard error, making real effects easier to detect. Smaller $n$,
    smaller $\alpha$ and smaller effects all reduce power.

- id: stat-q-3405
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'A test has power 0.85 against the alternative $\mu = 54$. What is $\beta$ for that alternative?'
  choices: ['0.15', '0.85', '0.05', '0.95']
  answer: 0
  explanation: |-
    $\beta = 1 - \text{power} = 0.15$: the probability of failing to detect that the true mean is
    54.

- id: stat-q-3406
  lesson: stat-errors-power
  topic: Errors and power
  stem: '$H_0: \mu = 100$, $H_a: \mu > 100$, $\sigma = 8$, $n = 25$, $\alpha = 0.05$. The test rejects when $\bar{x} \ge 102.63$. What is the power if $\mu = 104$?'
  choices: ['0.196', '0.950', '0.804', '0.660']
  answer: 2
  explanation: |-
    $\sigma_{\bar{x}} = 8/5 = 1.6$. Power $= P(\bar{x} \ge 102.63 \mid \mu = 104) = P(Z \ge (102.63 - 104)/1.6) = P(Z \ge -0.855) \approx 0.804$.
    0.196 is $\beta$.

- id: stat-q-3407
  lesson: stat-errors-power
  module_quiz: true
  topic: Errors and power
  stem: 'With the sample size fixed, lowering $\alpha$ from 0.05 to 0.01'
  choices: ['reduces both error probabilities', 'reduces the Type I error probability but increases the Type II error probability', 'increases power', 'has no effect on errors']
  answer: 1
  explanation: |-
    A stricter $\alpha$ makes rejection harder: fewer false alarms but more missed effects. Only
    more data (or less noise) reduces both.

- id: stat-q-3408
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'A small study finds no significant effect of a drug (p = 0.40); its power to detect a meaningful effect was 0.25. What should you conclude?'
  choices: ['The drug has no effect', 'The drug works', 'The study had little chance of detecting a real effect, so its non-significant result is weak evidence of no effect', 'The p-value proves the null hypothesis']
  answer: 2
  explanation: |-
    With power only 0.25, a real effect would usually be missed. A non-significant result from
    a low-power study says little either way.

- id: stat-q-3409
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'Power is the probability of'
  choices: ['rejecting $H_0$ when a specific alternative is true', 'rejecting $H_0$ when it is true', 'failing to reject $H_0$', 'the null hypothesis being false']
  answer: 0
  explanation: |-
    Power $= P(\text{reject } H_0 \mid \text{a particular } H_a \text{ value is true}) = 1 - \beta$.

- id: stat-q-3410
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'A track-inspection test has $H_0$: segment is sound. Missing a flaw could cause a derailment. How should $\alpha$ be set?'
  choices: ['Very small (0.001), to avoid unnecessary repairs', 'Exactly 0.05, by convention', 'Relatively large (e.g. 0.10), to reduce the chance of a Type II error', 'At 0, so no errors occur']
  answer: 2
  explanation: |-
    The serious error is a Type II error (missing a flaw). A larger $\alpha$ increases power,
    trading more false alarms for fewer missed flaws.

- id: stat-q-3411
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'Which design change increases power by reducing variability, without increasing the number of subjects?'
  choices: ['Using a matched pairs or blocked design', 'Raising $\alpha$', 'Testing a two-sided alternative instead of one-sided', 'Rounding the data']
  answer: 0
  explanation: |-
    Pairing or blocking removes subject-to-subject variation, shrinking the standard error and
    increasing power. Raising $\alpha$ also increases power, but by accepting more Type I errors,
    not by reducing variability.

# ---- Lesson 35: tests for proportions
- id: stat-q-3501
  lesson: stat-test-prop
  module_quiz: true
  topic: Tests for proportions
  stem: 'In a one-proportion z test of $H_0: p = 0.5$ with $n = 150$ and $\hat{p} = 0.58$, what is the test statistic?'
  choices: ['1.99', '0.08', '1.96', '2.18']
  answer: 2
  explanation: |-
    $SE = \sqrt{0.5(0.5)/150} \approx 0.0408$; $z = (0.58 - 0.5)/0.0408 \approx 1.96$. Using $\hat{p}$ in
    the SE ($\sqrt{0.58 \cdot 0.42/150} \approx 0.0403$) gives about 1.99 — the interval's SE, not the test's.

- id: stat-q-3502
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'Why does the one-proportion z test use $p_0$ (not $\hat{p}$) in the standard error?'
  choices: ['Because $\hat{p}$ is biased', 'Because the p-value is computed assuming $H_0$ is true, and then the SD of $\hat{p}$ is $\sqrt{p_0(1-p_0)/n}$', 'Because $p_0$ is always 0.5', 'To make the test more powerful']
  answer: 1
  explanation: |-
    Everything in a p-value calculation assumes $H_0$. If $p = p_0$, the standard deviation of
    $\hat{p}$ is known exactly using $p_0$.

- id: stat-q-3503
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'For $H_0: p = 0.04$ with $n = 150$, are the large counts conditions met?'
  choices: ['Yes, because $n > 30$', 'No, because $np_0 = 6 < 10$', 'Yes, because $n(1-p_0) = 144$', 'No, because the sample is too large']
  answer: 1
  explanation: |-
    Both $np_0$ and $n(1 - p_0)$ must be at least 10. $150(0.04) = 6$ fails, so the normal
    approximation for the p-value is unreliable (use an exact binomial test instead).

- id: stat-q-3504
  lesson: stat-test-prop
  module_quiz: true
  topic: Tests for proportions
  stem: 'Treatment 1: 45 of 150 improved. Treatment 2: 30 of 150 improved. What is the pooled proportion $\hat{p}_c$?'
  choices: ['0.25', '0.30', '0.20', '0.50']
  answer: 0
  explanation: |-
    $\hat{p}_c = (45 + 30)/(150 + 150) = 75/300 = 0.25$. 0.30 and 0.20 are the individual sample
    proportions.

- id: stat-q-3505
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'Continuing (45/150 vs 30/150, $\hat{p}_c = 0.25$), find the z statistic for $H_0: p_1 = p_2$.'
  choices: ['1.73', '0.10', '2.00', '2.01']
  answer: 2
  explanation: |-
    $SE = \sqrt{0.25(0.75)(1/150 + 1/150)} = \sqrt{0.0025} = 0.05$. $z = (0.30 - 0.20)/0.05 = 2.00$.
    The unpooled SE ($\approx 0.0497$) gives about 2.01.

- id: stat-q-3506
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'Continuing ($z = 2.00$, two-sided), what is the p-value and the conclusion at $\alpha = 0.05$?'
  choices: ['p ≈ 0.023; reject $H_0$', 'p ≈ 0.046; fail to reject $H_0$', 'p ≈ 0.046; reject $H_0$', 'p ≈ 0.977; fail to reject $H_0$']
  answer: 2
  explanation: |-
    Two-sided p-value $= 2P(Z \ge 2) \approx 0.0455 < 0.05$, so reject $H_0$: convincing evidence the
    improvement rates differ. 0.023 is the one-tail area.

- id: stat-q-3507
  lesson: stat-test-prop
  module_quiz: true
  topic: Tests for proportions
  stem: 'Why is the pooled proportion used in the two-proportion z test but not in the confidence interval?'
  choices: ['The test assumes $p_1 = p_2$ under $H_0$, so a single combined estimate is appropriate; the interval makes no such assumption', 'Pooling makes the interval narrower', 'The interval uses $z$ but the test uses $t$', 'Pooling is only valid for large samples']
  answer: 0
  explanation: |-
    Under $H_0$ both groups share one proportion, best estimated by pooling. An interval estimates
    the difference without assuming it is 0.

- id: stat-q-3508
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'A survey of 400 random adults finds 228 support a policy. Testing $H_0: p = 0.5$ vs. $H_a: p > 0.5$, $z = 2.80$, p ≈ 0.0026. Which is a correct interpretation of the p-value?'
  choices: ['There is a 0.26% chance that half of adults support the policy', 'If exactly half of all adults supported the policy, there would be about a 0.26% chance of a sample proportion of 0.57 or higher', '99.74% of adults support the policy', 'The policy has a 0.26% chance of passing']
  answer: 1
  explanation: |-
    The p-value is a conditional probability of the data (or more extreme) assuming $H_0$, stated
    in context. It is not the probability that $H_0$ is true.

- id: stat-q-3509
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'An observational study finds a significantly higher cancer rate among workers exposed to a chemical than among unexposed workers. What can be concluded?'
  choices: ['The chemical causes cancer', 'Exposure is associated with higher cancer rates; causation is not established because exposure wasn''t randomly assigned', 'There is no relationship', 'The p-value must be wrong']
  answer: 1
  explanation: |-
    A significant difference shows an association beyond chance. Without random assignment,
    confounders (age, smoking, other exposures) can't be ruled out.

- id: stat-q-3510
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'A two-sided one-proportion test gives p-value 0.08. What would the p-value be for the one-sided test in the direction of the observed result?'
  choices: ['0.16', '0.92', '0.04', '0.08']
  answer: 2
  explanation: |-
    The two-sided p-value doubles one tail; the one-sided p-value in the observed direction is
    half: 0.04. (The one-sided alternative must be chosen in advance, not after seeing the data.)

- id: stat-q-3511
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'In a two-proportion z test, the large counts condition is checked using'
  choices: ['the observed successes and failures in each group (or expected counts with $\hat{p}_c$)', 'only the total sample size', '$\hat{p}_1$ and $\hat{p}_2$ being equal', 'the p-value']
  answer: 0
  explanation: |-
    Each group needs at least about 10 successes and 10 failures; using the pooled proportion
    ($n_1\hat{p}_c$, $n_1(1 - \hat{p}_c)$, …) is the most consistent with $H_0$.

# ---- Lesson 36: tests for means
- id: stat-q-3601
  lesson: stat-test-mean
  module_quiz: true
  topic: Tests for means
  stem: 'A random sample of 25 has $\bar{x} = 103.2$ and $s = 8$. For $H_0: \mu = 100$ vs. $H_a: \mu > 100$, what is $t$?'
  choices: ['0.40', '10.0', '2.00', '3.20']
  answer: 2
  explanation: |-
    $SE = 8/\sqrt{25} = 1.6$; $t = (103.2 - 100)/1.6 = 2.00$. Dividing by $s$ instead of $s/\sqrt{n}$
    gives 0.40.

- id: stat-q-3602
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'Continuing ($t = 2.00$, df = 24, one-sided), the p-value is about'
  choices: ['0.057', '0.023', '0.028', '0.014']
  answer: 2
  explanation: |-
    $P(t_{24} \ge 2.00) \approx 0.028$. The normal value would be 0.023; the two-sided value 0.057.

- id: stat-q-3603
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'Twenty students take a pretest and a posttest. Which procedure tests whether scores improved?'
  choices: ['Two-sample t test', 'Paired t test on the differences', 'Two-proportion z test', 'Chi-square test']
  answer: 1
  explanation: |-
    The two scores come from the same students, so they are paired. Analyze the 20
    differences with a one-sample t test.

- id: stat-q-3604
  lesson: stat-test-mean
  module_quiz: true
  topic: Tests for means
  stem: 'Sixteen pairs give mean difference $\bar{d} = 1.5$ and $s_d = 2.4$. Test $H_0: \mu_d = 0$ vs. $H_a: \mu_d \ne 0$. Find $t$ and the approximate p-value.'
  choices: ['$t = 2.5$, p ≈ 0.012', '$t = 0.625$, p ≈ 0.54', '$t = 10.0$, p < 0.001', '$t = 2.5$, p ≈ 0.025']
  answer: 3
  explanation: |-
    $t = 1.5/(2.4/\sqrt{16}) = 1.5/0.6 = 2.5$, df = 15; two-sided p $= 2P(t_{15} \ge 2.5) \approx 0.025$.
    0.012 is one tail only; $t = 10.0$ comes from dividing $s_d$ by $n$ instead of $\sqrt{n}$.

- id: stat-q-3605
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'Two independent groups: $n_1 = 12$, $n_2 = 15$. Using the conservative method, the two-sample t test uses how many degrees of freedom?'
  choices: ['25', '26', '11', '14']
  answer: 2
  explanation: |-
    Conservative df $= \min(n_1, n_2) - 1 = 11$. Technology would give a (larger) Welch df.

- id: stat-q-3606
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'Why would a two-sample t test on before/after measurements of the same people be a mistake?'
  choices: ['The samples aren''t independent; ignoring the pairing inflates the standard error and wastes the design''s power', 'The t test requires different people', 'It would always give a significant result', 'The means would be wrong']
  answer: 0
  explanation: |-
    The measurements are dependent. The two-sample SE includes person-to-person variability that
    pairing removes, so the test loses power (and its assumptions are violated).

- id: stat-q-3607
  lesson: stat-test-mean
  module_quiz: true
  topic: Tests for means
  stem: 'Line A: $n = 15$, $\bar{x} = 24.3$, $s = 4.1$; Line B: $n = 18$, $\bar{x} = 21.0$, $s = 5.2$. What is the two-sample $t$ statistic?'
  choices: ['2.04', '0.64', '3.30', '1.62']
  answer: 0
  explanation: |-
    $SE = \sqrt{4.1^2/15 + 5.2^2/18} \approx 1.620$; $t = (24.3 - 21.0)/1.620 \approx 2.04$. 1.62 is the SE.

- id: stat-q-3608
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'A sample of 8 measurements contains one extreme outlier. Before running a one-sample t test, you should'
  choices: ['run the test anyway, since t procedures are always robust', 'switch to a z test', 'investigate the outlier; with $n = 8$, it can distort $\bar{x}$ and $s$ enough to invalidate the test', 'double the p-value']
  answer: 2
  explanation: |-
    t procedures are robust to mild non-normality, but small samples with outliers violate the
    conditions. Check whether it's an error; if it is a genuine value, the t test's results can't be trusted.

- id: stat-q-3609
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'A t test of $H_0: \mu = 12$ vs. $H_a: \mu < 12$ gives $t = -2.10$ with df = 19. From a t table, 2.093 has one-tail area 0.025 and 2.205 has 0.02. What can you say about the p-value?'
  choices: ['$p > 0.05$', '$0.02 < p < 0.025$', '$p < 0.01$', '$0.04 < p < 0.05$']
  answer: 1
  explanation: |-
    $|t| = 2.10$ lies between 2.093 and 2.205, so the one-tail area is between 0.02 and 0.025.
    The two-sided range would be 0.04 to 0.05.

- id: stat-q-3610
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'A two-sample t test gives p = 0.0502 (Welch) and p = 0.061 (conservative df). At $\alpha = 0.05$, what is the appropriate summary?'
  choices: ['The difference is proven', 'There is no difference', 'The evidence is borderline: not convincing at the 5% level, and a larger study would help', 'Use whichever p-value is smaller']
  answer: 2
  explanation: |-
    Neither p-value is at or below 0.05 (0.0502 is just above it). The honest conclusion is
    insufficient evidence at this level, with the effect size and a confidence interval
    reported.

- id: stat-q-3611
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'Which situation calls for a one-sample t test?'
  choices: ['Comparing average commute times of two cities', 'Testing whether the mean fill of bottles differs from the labeled 500 ml, using one sample', 'Testing whether the proportion of defective parts exceeds 2%', 'Comparing before/after weights of the same dieters']
  answer: 1
  explanation: |-
    One sample's mean compared with a standard value is a one-sample t test. Two cities is
    two-sample; a proportion uses a z test; before/after is paired.
