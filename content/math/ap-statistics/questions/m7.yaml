# Module 7 — Sampling distributions and confidence intervals
# ---- Lesson 28: sampling distributions
- id: stat-q-2801
  lesson: stat-sampling-dist
  module_quiz: true
  topic: Sampling distributions
  stem: 'The sampling distribution of a statistic is'
  choices: ['the distribution of the data in one sample', 'the distribution of the population', 'the distribution of the statistic''s values over all possible samples of the same size', 'a list of all possible samples']
  answer: 2
  explanation: |-
    A sampling distribution describes how a statistic (like $\hat{p}$ or $\bar{x}$) varies from
    sample to sample. One sample's data and the population each have their own, different
    distributions.

- id: stat-q-2802
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: '20% of a large population are left-handed. For SRSs of 400 people, what is the standard deviation of $\hat{p}$?'
  choices: ['0.16', '0.0004', '0.02', '0.4']
  answer: 2
  explanation: |-
    $\sigma_{\hat{p}} = \sqrt{0.2(0.8)/400} = \sqrt{0.0004} = 0.02$. 0.0004 is the variance;
    0.16 is $p(1-p)$ without dividing by $n$.

- id: stat-q-2803
  lesson: stat-sampling-dist
  module_quiz: true
  topic: Sampling distributions
  stem: 'With $p = 0.2$ and $n = 400$ (so $\sigma_{\hat{p}} = 0.02$), what is the approximate probability that $\hat{p}$ exceeds 0.225?'
  choices: ['0.8944', '0.2500', '0.0228', '0.1056']
  answer: 3
  explanation: |-
    Large counts: $400(0.2) = 80$, $400(0.8) = 320$ ✓. $z = (0.225 - 0.2)/0.02 = 1.25$;
    $P(Z > 1.25) \approx 0.1056$. 0.8944 is the left tail.

- id: stat-q-2804
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'A statistic is an unbiased estimator of a parameter if'
  choices: ['the mean of its sampling distribution equals the parameter', 'it always equals the parameter', 'its sampling distribution has small spread', 'it comes from a large sample']
  answer: 0
  explanation: |-
    Unbiased means no systematic error: the statistic is right on average over all
    samples. Low spread is a separate property (low variability).

- id: stat-q-2805
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'To cut the standard deviation of $\hat{p}$ in half, the sample size must be'
  choices: ['doubled', 'halved', 'multiplied by 4', 'multiplied by 16']
  answer: 2
  explanation: |-
    $\sigma_{\hat{p}}$ is proportional to $1/\sqrt{n}$. Halving it requires $\sqrt{n}$ to double, so
    $n$ must be multiplied by 4.

- id: stat-q-2806
  lesson: stat-sampling-dist
  module_quiz: true
  topic: Sampling distributions
  stem: 'An SRS of 1,500 adults is taken in a city of 400,000 and another of 1,500 in a nation of 300 million. Which statement is true about the variability of $\hat{p}$?'
  choices: ['The city poll is much more precise', 'The national poll is much more precise', 'Neither is useful', 'They are about equally precise, because both samples are a small fraction of their populations']
  answer: 3
  explanation: |-
    When the sample is under 10% of the population, $\sigma_{\hat{p}} \approx \sqrt{p(1-p)/n}$ depends
    on $n$, not on the population size. Equal $n$ gives about equal precision.

- id: stat-q-2807
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'For $p = 0.03$ and $n = 100$, why is a normal approximation for $\hat{p}$ inappropriate?'
  choices: ['Because $n$ is less than 1,000', 'Because $np = 3 < 10$, so the sampling distribution is right-skewed', 'Because $p$ must equal 0.5', 'Because the 10% condition fails']
  answer: 1
  explanation: |-
    The large counts condition needs $np \ge 10$ and $n(1-p) \ge 10$. With only about 3 expected
    successes, $\hat{p}$ piles up near 0 with a right tail.

- id: stat-q-2808
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'In the target analogy, a sampling method that is unbiased but highly variable looks like'
  choices: ['shots tightly clustered away from the bullseye', 'shots tightly clustered on the bullseye', 'shots widely scattered but centered on the bullseye', 'shots widely scattered and centered away from the bullseye']
  answer: 2
  explanation: |-
    Unbiased: centered on the target. Highly variable: wide scatter. A tight cluster off center
    is biased with low variability.

- id: stat-q-2809
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'Why is the 10% condition checked when sampling without replacement?'
  choices: ['So that the formula $\sqrt{p(1-p)/n}$ for the standard deviation is accurate', 'So that the sampling distribution is normal', 'So that the sample is random', 'So that $\hat{p}$ is unbiased']
  answer: 0
  explanation: |-
    Without replacement, draws are slightly dependent, making the true SD a bit smaller than
    the formula. If $n \le 10\%$ of $N$, the difference is negligible. Normality comes from
    large counts; randomness from the design.

- id: stat-q-2810
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'A population has $p = 0.5$. Which sample size gives a sampling distribution of $\hat{p}$ with standard deviation 0.025?'
  choices: ['100', '400', '200', '1,600']
  answer: 1
  explanation: |-
    $\sqrt{0.25/n} = 0.025$ gives $0.25/n = 0.000625$, so $n = 400$.

- id: stat-q-2811
  lesson: stat-sampling-dist
  topic: Sampling distributions
  stem: 'A company claims 30% of riders use passes. An SRS of 400 riders finds $\hat{p} = 0.33$, and the probability of $\hat{p} \ge 0.33$ if the claim is true is about 0.095. What is a reasonable conclusion?'
  choices: ['The claim is definitely false', 'A result like this is not very unusual if the claim is true, so it isn''t strong evidence against the claim', 'The sample must be biased', 'The true proportion is exactly 0.33']
  answer: 1
  explanation: |-
    A result this extreme would happen in nearly 10% of samples even if $p = 0.30$, so it is
    consistent with the claim. This reasoning previews significance tests.

# ---- Lesson 29: CLT
- id: stat-q-2901
  lesson: stat-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'A population has mean 100 and SD 15. For SRSs of size 25, what are the mean and SD of $\bar{x}$?'
  choices: ['Mean 100, SD 15', 'Mean 100, SD 0.6', 'Mean 4, SD 3', 'Mean 100, SD 3']
  answer: 3
  explanation: |-
    $\mu_{\bar{x}} = \mu = 100$; $\sigma_{\bar{x}} = 15/\sqrt{25} = 3$. Dividing by $n$ instead of $\sqrt{n}$
    gives 0.6.

- id: stat-q-2902
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'With $\mu = 100$, $\sigma = 15$ and $n = 25$ (normal population), find $P(\bar{x} > 106)$.'
  choices: ['0.0228', '0.3446', '0.1587', '0.9772']
  answer: 0
  explanation: |-
    $z = (106 - 100)/3 = 2$; $P(Z > 2) \approx 0.0228$. Using $\sigma = 15$ instead of 3 gives
    $z = 0.4$ and 0.3446 — the probability for a single observation.

- id: stat-q-2903
  lesson: stat-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'Which statement correctly describes the Central Limit Theorem?'
  choices: ['Large samples always have normally distributed data', 'For large $n$, the sampling distribution of $\bar{x}$ is approximately normal, whatever the population''s shape', 'The population becomes normal as $n$ increases', 'The sample mean equals the population mean for large $n$']
  answer: 1
  explanation: |-
    The CLT is about the distribution of $\bar{x}$ across samples. The data in a large sample
    still resemble the population, skewed or not.

- id: stat-q-2904
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'Incomes in a town are strongly right-skewed. For which sample size is a normal model for $\bar{x}$ least appropriate?'
  choices: ['$n = 5$', '$n = 40$', '$n = 100$', '$n = 500$']
  answer: 0
  explanation: |-
    The CLT needs a large enough $n$; with strong skew, $n = 5$ is far too small, and $\bar{x}$
    will itself be right-skewed.

- id: stat-q-2905
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'Bags of gravel have mean 7 kg and SD 2 kg. For 50 bags, what are the mean and SD of the total weight?'
  choices: ['Mean 350 kg, SD 100 kg', 'Mean 350 kg, SD 2 kg', 'Mean 7 kg, SD 0.28 kg', 'Mean 350 kg, SD 14.1 kg']
  answer: 3
  explanation: |-
    Total: mean $50 \times 7 = 350$; SD $\sqrt{50} \times 2 \approx 14.1$ (variances add for
    independent bags). $50 \times 2 = 100$ would treat the bags as perfectly correlated.

- id: stat-q-2906
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'If the population itself is normal, the sampling distribution of $\bar{x}$ is'
  choices: ['normal only if $n \ge 30$', 'exactly normal for any sample size', 'skewed for small samples', 'uniform']
  answer: 1
  explanation: |-
    Sums (and averages) of independent normal variables are exactly normal, so no
    large-sample condition is needed.

- id: stat-q-2907
  lesson: stat-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'A population has $\sigma = 20$. What sample size makes $\sigma_{\bar{x}} = 2$?'
  choices: ['10', '40', '400', '100']
  answer: 3
  explanation: |-
    $20/\sqrt{n} = 2$ gives $\sqrt{n} = 10$, so $n = 100$.

- id: stat-q-2908
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'A machine fills bottles with mean 500 ml and SD 4 ml. For a random sample of 16 bottles, what is $P(\bar{x} < 498)$? (Assume fills are normal.)'
  choices: ['0.0228', '0.3085', '0.1587', '0.0062']
  answer: 0
  explanation: |-
    $\sigma_{\bar{x}} = 4/\sqrt{16} = 1$; $z = (498 - 500)/1 = -2$; $\Phi(-2) \approx 0.0228$. Using
    $\sigma = 4$ gives 0.3085, the probability for a single bottle.

- id: stat-q-2909
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'Why is a sample mean less variable than a single observation?'
  choices: ['Because large and small values in a sample tend to offset each other, so $\text{Var}(\bar{x}) = \sigma^2/n$', 'Because the sample mean is always closer to the median', 'Because outliers are removed', 'Because the sample mean is normal']
  answer: 0
  explanation: |-
    Averaging independent observations divides the variance by $n$: highs and lows partly
    cancel. That is why $\sigma_{\bar{x}} = \sigma/\sqrt{n}$.

- id: stat-q-2910
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'A sample of 200 waiting times from a right-skewed population is plotted in a histogram. The histogram will most likely be'
  choices: ['approximately normal, by the CLT', 'right-skewed, resembling the population', 'left-skewed', 'uniform']
  answer: 1
  explanation: |-
    A large sample's data look like the population — skewed. The CLT concerns the
    distribution of $\bar{x}$ over many samples, not the data within one sample.

- id: stat-q-2911
  lesson: stat-clt
  topic: Central Limit Theorem
  stem: 'Delivery times have mean 50 and SD 12 minutes (skewed). For $n = 36$ deliveries, about what is the probability that $\bar{x}$ is between 48 and 52?'
  choices: ['0.13', '0.95', '0.68', '0.50']
  answer: 2
  explanation: |-
    $\sigma_{\bar{x}} = 12/6 = 2$, so 48 and 52 are $\pm 1$ standard deviation, and by the CLT
    $\bar{x}$ is approximately normal: about 68%. Using $\sigma = 12$ gives about 13%.

# ---- Lesson 30: CI for a proportion
- id: stat-q-3001
  lesson: stat-ci-prop
  module_quiz: true
  topic: Confidence intervals for proportions
  stem: 'In an SRS of 500 adults, 36% favor a proposal. What is the 95% margin of error?'
  choices: ['0.021', '0.042', '0.036', '0.084']
  answer: 1
  explanation: |-
    $SE = \sqrt{0.36(0.64)/500} \approx 0.0215$; $ME = 1.96(0.0215) \approx 0.042$. 0.021 is the
    standard error alone.

- id: stat-q-3002
  lesson: stat-ci-prop
  module_quiz: true
  topic: Confidence intervals for proportions
  stem: 'A 95% confidence interval for the proportion of commuters who bike is (0.12, 0.18). Which interpretation is correct?'
  choices: ['95% of commuters bike between 12% and 18% of the time', 'There is a 95% probability that the true proportion is between 0.12 and 0.18', 'We are 95% confident the interval from 0.12 to 0.18 captures the true proportion of commuters who bike', '95% of samples will have $\hat{p}$ between 0.12 and 0.18']
  answer: 2
  explanation: |-
    The confidence is in the method: 95% of intervals built this way capture $p$. The
    parameter is fixed, so "95% probability" about this particular interval is incorrect, and
    the interval is about $p$, not about individuals or future $\hat{p}$ values.

- id: stat-q-3003
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'Which critical value $z^*$ is used for a 90% confidence interval?'
  choices: ['1.282', '1.960', '2.576', '1.645']
  answer: 3
  explanation: |-
    90% in the middle leaves 5% in each tail: $z^* = \Phi^{-1}(0.95) \approx 1.645$. 1.282 leaves
    10% in one tail (an 80% interval).

- id: stat-q-3004
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'With everything else unchanged, how does going from 95% to 99% confidence change the interval?'
  choices: ['It becomes wider', 'It becomes narrower', 'It stays the same width', 'It shifts toward 0.5']
  answer: 0
  explanation: |-
    Higher confidence requires a larger critical value (2.576 vs 1.96), so the margin of error
    grows.

- id: stat-q-3005
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'What sample size is needed for a 90% margin of error of at most 0.05, with no prior estimate of $p$?'
  choices: ['270', '664', '385', '271']
  answer: 3
  explanation: |-
    $n \ge (1.645/0.05)^2(0.5)(0.5) = 270.6$; always round up, so 271. 385 is the 95% answer;
    664 is the 99% answer.

- id: stat-q-3006
  lesson: stat-ci-prop
  module_quiz: true
  topic: Confidence intervals for proportions
  stem: 'A pollster wants to halve the margin of error of a poll that used 600 people. About how many people are needed?'
  choices: ['1,200', '900', '2,400', '300']
  answer: 2
  explanation: |-
    ME is proportional to $1/\sqrt{n}$, so halving it requires 4 times the sample: 2,400.

- id: stat-q-3007
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'An online news site posts a "poll" with 5,000 responses and reports a margin of error of ±1.4%. What is the main problem?'
  choices: ['The margin of error should be larger because of the large sample', 'Voluntary response is biased, and the margin of error only accounts for random sampling variability', 'The margin of error is computed incorrectly for 5,000 responses', 'Nothing; large samples are reliable']
  answer: 1
  explanation: |-
    The margin of error assumes a random sample. It says nothing about bias from
    self-selection, so it gives a false sense of precision here.

- id: stat-q-3008
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'In a sample of 60 rail inspectors, 46 passed a new certification on the first try. Are the conditions for a one-proportion z interval met?'
  choices: ['No: the sample size is under 100', 'No: there are only 14 failures, fewer than 15', 'Yes, if the sample is random: 46 successes and 14 failures are both at least 10', 'Yes, because $\hat{p} > 0.5$']
  answer: 2
  explanation: |-
    The large counts condition needs at least 10 successes and 10 failures; 46 and 14 qualify.
    The randomness of the sample still must be checked.

- id: stat-q-3009
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'A 95% CI for the proportion of voters favoring a candidate is (0.47, 0.53). What can be concluded?'
  choices: ['The candidate will lose', 'The candidate will win', 'Exactly 50% favor the candidate', 'It is plausible that either a majority or a minority favor the candidate']
  answer: 3
  explanation: |-
    The interval contains values below and above 0.5, so the data don't settle whether a
    majority favors the candidate.

- id: stat-q-3010
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'Why is $p^* = 0.5$ used for sample size planning when nothing is known about $p$?'
  choices: ['Because $p$ is usually 0.5', 'Because $p^*(1-p^*)$ is largest at 0.5, giving a sample size large enough for any $p$', 'Because it makes the interval centered at 0.5', 'Because it minimizes the sample size']
  answer: 1
  explanation: |-
    $p(1-p) \le 0.25$ with equality at 0.5. Planning with 0.25 guarantees the margin of error
    goal is met whatever the true $p$.

- id: stat-q-3011
  lesson: stat-ci-prop
  topic: Confidence intervals for proportions
  stem: 'A standard error differs from a standard deviation of a statistic in that it'
  choices: ['is computed from the population', 'is always larger', 'is estimated from the sample data, replacing unknown parameters with statistics', 'applies only to means']
  answer: 2
  explanation: |-
    $\sigma_{\hat{p}} = \sqrt{p(1-p)/n}$ needs the unknown $p$; the standard error
    $\sqrt{\hat{p}(1-\hat{p})/n}$ estimates it from the data.

# ---- Lesson 31: CI for a mean
- id: stat-q-3101
  lesson: stat-ci-mean
  module_quiz: true
  topic: Confidence intervals for means
  stem: 'Why do we use a t distribution rather than $z$ when constructing a confidence interval for $\mu$ with $s$?'
  choices: ['Because the population is never normal', 'Because the sample mean is biased', 'Because estimating $\sigma$ with $s$ adds variability, making the standardized statistic more spread out than $z$', 'Because $t$ values are always smaller']
  answer: 2
  explanation: |-
    $(\bar{x} - \mu)/(s/\sqrt{n})$ varies more than $(\bar{x} - \mu)/(\sigma/\sqrt{n})$ because $s$ itself
    varies. The t distribution's heavier tails account for that.

- id: stat-q-3102
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'What is the critical value $t^*$ for a 95% confidence interval with $n = 12$?'
  choices: ['2.179', '1.960', '2.228', '2.201']
  answer: 3
  explanation: |-
    df $= 11$, and $t^* = \text{invT}(0.975, 11) \approx 2.201$. 2.179 uses df 12; 2.228 uses df 10;
    1.960 is the normal value.

- id: stat-q-3103
  lesson: stat-ci-mean
  module_quiz: true
  topic: Confidence intervals for means
  stem: 'A random sample of 12 has $\bar{x} = 52.3$ and $s = 6$ (no outliers). A 95% CI for $\mu$ is'
  choices: ['(48.49, 56.11)', '(48.90, 55.70)', '(40.10, 64.50)', '(46.30, 58.30)']
  answer: 0
  explanation: |-
    $SE = 6/\sqrt{12} \approx 1.732$; $t^* = 2.201$; $ME \approx 3.81$; $52.3 \pm 3.81 = (48.49, 56.11)$.
    (48.90, 55.70) uses $z^* = 1.96$.

- id: stat-q-3104
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'As the degrees of freedom increase, the t distribution'
  choices: ['becomes more skewed', 'gets heavier tails', 'approaches the standard normal distribution', 'shifts to the right']
  answer: 2
  explanation: |-
    With more data, $s$ estimates $\sigma$ more precisely, and $t$ behaves more and more like $z$.

- id: stat-q-3105
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'A sample of $n = 10$ shows a strong outlier. Why is a t interval for $\mu$ risky?'
  choices: ['t procedures require $n \ge 100$', 'The outlier strongly affects $\bar{x}$ and $s$, which are not resistant, so the interval may be misleading', 't procedures can''t be used with decimals', 'Outliers make the interval too narrow only for proportions']
  answer: 1
  explanation: |-
    t procedures are robust to mild non-normality but not to outliers in small samples, because
    both $\bar{x}$ and $s$ are pulled by extreme values.

- id: stat-q-3106
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'To estimate a mean within 1.5 units with 95% confidence, with $\sigma \approx 8$, how many observations are needed?'
  choices: ['109', '11', '42', '110']
  answer: 3
  explanation: |-
    $n \ge (1.96 \times 8/1.5)^2 \approx 109.3$; round up to 110. Rounding down (109) would give a
    margin slightly larger than 1.5.

- id: stat-q-3107
  lesson: stat-ci-mean
  module_quiz: true
  topic: Confidence intervals for means
  stem: 'A 95% CI for the mean weight of a product is (498.2, 503.6) g. A student says "95% of products weigh between 498.2 and 503.6 g." What is wrong?'
  choices: ['Nothing', 'The interval estimates the population mean, not the range of individual weights, which vary much more', 'It should say 5% of products', 'The interval should be centered at 500']
  answer: 1
  explanation: |-
    A confidence interval for $\mu$ describes where the mean plausibly lies. Individual values
    are spread over a much wider range (roughly $\sqrt{n}$ times wider).

- id: stat-q-3108
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'The standard error of the mean for a sample with $s = 9$ and $n = 36$ is'
  choices: ['0.25', '9', '0.5', '1.5']
  answer: 3
  explanation: |-
    $SE = s/\sqrt{n} = 9/6 = 1.5$.

- id: stat-q-3109
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'Which change makes a t interval for $\mu$ narrower?'
  choices: ['Increasing the confidence level', 'Increasing the sample size', 'A larger sample standard deviation', 'Using fewer degrees of freedom']
  answer: 1
  explanation: |-
    A larger $n$ reduces $s/\sqrt{n}$ and also reduces $t^*$ (more df). Higher confidence, larger
    $s$ and fewer df all widen the interval.

- id: stat-q-3110
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'A sample of 45 commute times is strongly right-skewed. Can a t interval for the mean be used?'
  choices: ['No, the data must be normal', 'No, t requires $n < 30$', 'Yes, but only at 99% confidence', 'Yes, $n = 45 \ge 30$ so the CLT makes $\bar{x}$ approximately normal (assuming a random sample and no extreme outliers)']
  answer: 3
  explanation: |-
    With $n \ge 30$, the sampling distribution of $\bar{x}$ is approximately normal even for a
    skewed population, so t procedures are reasonable (very extreme outliers would still be
    a concern).

- id: stat-q-3111
  lesson: stat-ci-mean
  topic: Confidence intervals for means
  stem: 'For df = 14, what is $t^*$ for a 90% confidence interval?'
  choices: ['1.761', '1.645', '2.145', '1.345']
  answer: 0
  explanation: |-
    90% leaves 5% in each tail: $t^* = \text{invT}(0.95, 14) \approx 1.761$. 2.145 is the 95% value;
    1.645 is the normal value.

# ---- Lesson 32: two-sample intervals
- id: stat-q-3201
  lesson: stat-ci-two
  module_quiz: true
  topic: Two-sample intervals
  stem: 'In independent random samples, 60% of 200 city residents and 50% of 250 suburban residents support a transit tax. What is the standard error of $\hat{p}_1 - \hat{p}_2$?'
  choices: ['0.0469', '0.0100', '0.0022', '0.0663']
  answer: 0
  explanation: |-
    $SE = \sqrt{0.6(0.4)/200 + 0.5(0.5)/250} = \sqrt{0.0012 + 0.001} = \sqrt{0.0022} \approx 0.0469$.
    0.0022 is the variance (not its square root); 0.0663 adds the two separate standard errors
    ($0.03464 + 0.03162$) instead of adding the variances.

- id: stat-q-3202
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Using the transit-tax samples (difference 0.10, $SE \approx 0.0469$), what is the 95% interval for $p_1 - p_2$?'
  choices: ['(0.053, 0.147)', '(0.008, 0.192)', '(−0.003, 0.203)', '(0.023, 0.177)']
  answer: 1
  explanation: |-
    $0.10 \pm 1.96(0.0469) = 0.10 \pm 0.092$, giving $(0.008, 0.192)$. The interval is entirely
    above 0, so city residents plausibly have higher support.

- id: stat-q-3203
  lesson: stat-ci-two
  module_quiz: true
  topic: Two-sample intervals
  stem: 'Which situation calls for a paired t interval?'
  choices: ['Comparing test scores of 30 randomly chosen boys and 30 randomly chosen girls', 'Comparing the proportion of defective parts from two factories', 'Comparing blood pressure of 25 patients before and after a medication', 'Comparing the mean income in two cities']
  answer: 2
  explanation: |-
    Before-and-after measurements on the same patients form natural pairs, so analyze the
    differences. The other situations involve independent groups.

- id: stat-q-3204
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'A 95% CI for $\mu_1 - \mu_2$ is (−2.4, 5.1). What does this suggest?'
  choices: ['$\mu_1$ is greater than $\mu_2$', '$\mu_1$ is less than $\mu_2$', 'A difference of 0 between the means is plausible, since 0 is in the interval', 'The means differ by exactly 1.35']
  answer: 2
  explanation: |-
    An interval containing 0 includes "no difference" among the plausible values, so the
    data don't show convincingly which mean is larger.

- id: stat-q-3205
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Group 1: $n = 20$, $s = 4$. Group 2: $n = 25$, $s = 6$. Using the conservative method, how many degrees of freedom does the two-sample t interval use?'
  choices: ['43', '45', '24', '19']
  answer: 3
  explanation: |-
    Conservative df $= \min(n_1 - 1, n_2 - 1) = \min(19, 24) = 19$. 43 is $n_1 + n_2 - 2$ (the
    pooled df).

- id: stat-q-3206
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Why is the standard error of $\bar{x}_1 - \bar{x}_2$ computed by adding $s_1^2/n_1$ and $s_2^2/n_2$?'
  choices: ['Because for independent samples, the variance of a difference is the sum of the variances', 'Because the means are added', 'Because the samples are paired', 'Because it makes the interval narrower']
  answer: 0
  explanation: |-
    $\text{Var}(\bar{x}_1 - \bar{x}_2) = \text{Var}(\bar{x}_1) + \text{Var}(\bar{x}_2)$ for independent samples —
    subtracting doesn't cancel variability.

- id: stat-q-3207
  lesson: stat-ci-two
  module_quiz: true
  topic: Two-sample intervals
  stem: '12 drivers each drive two car models in random order; the mean difference in fuel economy (A − B) is 1.8 mpg with $s_d = 2.0$. What is the 95% CI for $\mu_d$?'
  choices: ['(0.53, 3.07)', '(0.67, 2.93)', '(−0.20, 3.80)', '(1.23, 2.37)']
  answer: 0
  explanation: |-
    df $= 11$, $t^* = 2.201$; $SE = 2.0/\sqrt{12} \approx 0.577$; $ME \approx 1.27$. Interval
    $1.8 \pm 1.27 = (0.53, 3.07)$. (0.67, 2.93) uses $z^* = 1.96$.

- id: stat-q-3208
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Why does pairing often produce a narrower interval than treating the same data as two independent samples?'
  choices: ['Because it uses more observations', 'Because differences within pairs remove variation between individuals, so $s_d$ is small', 'Because the df are larger', 'Because $t^*$ is replaced with $z^*$']
  answer: 1
  explanation: |-
    Each subject serves as their own control; person-to-person differences cancel in $d$, leaving
    a smaller standard deviation.

- id: stat-q-3209
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'For a two-proportion z interval, the large counts condition requires'
  choices: ['at least 10 successes in total', '$n_1 + n_2 \ge 30$', 'at least 10 successes and 10 failures in each sample', '$\hat{p}_1 = \hat{p}_2$']
  answer: 2
  explanation: |-
    Each $\hat{p}$ must be approximately normal, so each group needs at least 10 successes and
    10 failures.

- id: stat-q-3210
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Volunteers were randomly assigned to two diets, and a 95% CI for the difference in mean weight loss (diet A − diet B) is (1.2, 4.6) kg. Which conclusion is justified?'
  choices: ['Diet A causes more weight loss than diet B for people like these volunteers', 'Diet A causes more weight loss for all adults', 'There is no difference', 'The diets are associated with weight loss but causation can''t be claimed']
  answer: 0
  explanation: |-
    Random assignment supports causation; volunteers limit generalization to people like them.
    The interval is entirely positive, so A plausibly produces more loss.

- id: stat-q-3211
  lesson: stat-ci-two
  topic: Two-sample intervals
  stem: 'Compared with the Welch (technology) df, using the conservative df $\min(n_1, n_2) - 1$ gives'
  choices: ['a narrower interval', 'an identical interval', 'a slightly wider interval with at least the stated confidence', 'an invalid interval']
  answer: 2
  explanation: |-
    Fewer df means a larger $t^*$ and a wider interval, so the true capture rate is at least the
    nominal level — a safe, conservative choice.
