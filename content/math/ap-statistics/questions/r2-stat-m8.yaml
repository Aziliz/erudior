# Round 2, module stat-m8 (Significance tests): new question types for the core lessons
# (stat-m8-r2-q..) and questions for the three honors lessons (stat-m8-r2-h..).

# ---- Lesson 33: the logic of significance tests
- id: stat-m8-r2-q01
  lesson: stat-test-logic
  type: label
  module_quiz: true
  topic: Significance tests
  stem: 'A one-sided test of $H_0: p = 0.80$ against $H_a: p < 0.80$ uses $n = 200$ and $\alpha = 0.05$. The curve is the sampling distribution of $\hat{p}$ if $H_0$ is true; the sample gave $\hat{p} = 0.74$, and $\hat{p} = 0.7535$ is the boundary of the rejection region. Name each numbered part.'
  image: {src: images/stat-m8-test-anatomy-blank.svg, alt: 'A normal curve over a sample-proportion axis from 0.72 to 0.88, centered at 0.80 with a dotted center line (marker 1). A dashed vertical line at about 0.7535 (marker 2) and a solid vertical line at 0.74 (marker 3). The region left of the dashed line is shaded; the small tail left of the solid line is shaded darker (marker 4).'}
  labels:
    - {x: 58.5, y: 55.3, text: Null value}
    - {x: 40.5, y: 19.7, text: Critical value}
    - {x: 35.4, y: 19.7, text: Observed statistic}
    - {x: 31.5, y: 77.1, text: p-value}
  distractors: [Power, Margin of error]
  explanation: |-
    1: the curve is centered at the null value $p_0 = 0.80$, because it is drawn assuming $H_0$ is true. 2: the dashed line at 0.7535 ($z = -1.645$) is the critical value; everything to its left is the rejection region, with area $\alpha = 0.05$. 3: the solid line is the observed $\hat{p} = 0.74$ ($z = -2.12$). 4: the darker tail beyond the observed value is the p-value, about 0.017. Power needs a curve drawn for a specific alternative, and a margin of error belongs to a confidence interval.

- id: stat-m8-r2-q02
  lesson: stat-test-logic
  type: order
  module_quiz: true
  topic: Significance tests
  stem: 'Put the steps of a significance test in order.'
  items:
    - 'State $H_0$, $H_a$ and $\alpha$ before looking at the data'
    - 'Name the test and check its conditions'
    - 'Compute the test statistic and the p-value, assuming $H_0$ is true'
    - 'Compare the p-value with $\alpha$ and conclude in context'
  explanation: |-
    This is State, Plan, Do, Conclude. The hypotheses and $\alpha$ come first so the data can't influence them; the conditions are checked before any probability is trusted; the p-value has to exist before it can be compared with $\alpha$.

- id: stat-m8-r2-q03
  lesson: stat-test-logic
  type: text
  topic: Significance tests
  stem: 'A test of $H_0: \mu = 80$ against $H_a: \mu \ne 80$ gives $z = -1.70$. The p-value, rounded to 3 decimal places, is ___.'
  accept: ['0.089']
  explanation: |-
    $P(Z \le -1.70) \approx 0.0446$. The alternative is two-sided, so double it: $2(0.0446) \approx 0.089$. (Forgetting to double gives 0.045, which would wrongly look significant at $\alpha = 0.05$.)

- id: stat-m8-r2-q04
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A test of $H_0: p = 0.5$ against $H_a: p > 0.5$ gives a p-value of 0.03. Which statements are correct? Select all that apply.'
  choices:
    - 'If $p$ really were 0.5, about 3% of samples would give a result at least as extreme as this one.'
    - 'There is a 3% chance that the null hypothesis is true.'
    - 'At $\alpha = 0.05$ the result is statistically significant.'
    - 'At $\alpha = 0.01$ the test shows that $p = 0.5$.'
  answer: [0, 2]
  explanation: |-
    The p-value is computed assuming $H_0$, so it is a probability about the data, not about $H_0$. Since $0.03 \le 0.05$, the result is significant at the 5% level. At $\alpha = 0.01$ we would fail to reject $H_0$, which is not the same as showing that $H_0$ is true.

- id: stat-m8-r2-q05
  lesson: stat-test-logic
  topic: Significance tests
  stem: 'A 95% confidence interval for a mean $\mu$ is $(48.2, 53.6)$. A two-sided test at $\alpha = 0.05$ would reject which null hypothesis?'
  choices: ['$H_0: \mu = 49$', '$H_0: \mu = 53.5$', '$H_0: \mu = 47.5$', '$H_0: \mu = 50.9$']
  answer: 2
  explanation: |-
    A two-sided test at level $\alpha$ rejects exactly the null values that fall outside the $(1 - \alpha)$ confidence interval. Only 47.5 is outside $(48.2, 53.6)$. The other three values are plausible, so those tests would fail to reject.

# ---- Lesson 34: Type I and Type II errors and power
- id: stat-m8-r2-q06
  lesson: stat-errors-power
  type: label
  module_quiz: true
  topic: Errors and power
  stem: 'The grid crosses the truth (columns: $H_0$ true, $H_0$ false) with the decision (rows: reject $H_0$, fail to reject $H_0$). Name each numbered cell.'
  image: {src: images/stat-m8-error-grid-blank.svg, alt: 'A two-by-two grid with column headings H0 is true and H0 is false and row headings Reject H0 and Fail to reject H0. Marker 1: reject, H0 true. Marker 2: reject, H0 false. Marker 3: fail to reject, H0 true. Marker 4: fail to reject, H0 false.'}
  labels:
    - {x: 48.4, y: 40.6, text: Type I error}
    - {x: 80.6, y: 40.6, text: Power (correct rejection)}
    - {x: 48.4, y: 70.6, text: 'Correct decision, probability 1 − α'}
    - {x: 80.6, y: 70.6, text: Type II error}
  distractors: [p-value, Margin of error]
  explanation: |-
    1: rejecting a true $H_0$ is a Type I error (probability $\alpha$). 2: rejecting a false $H_0$ is the correct detection whose probability is the power, $1 - \beta$. 3: failing to reject a true $H_0$ is correct, with probability $1 - \alpha$. 4: failing to reject a false $H_0$ is a Type II error (probability $\beta$).

- id: stat-m8-r2-q07
  lesson: stat-errors-power
  type: label
  topic: Errors and power
  stem: 'Test $H_0: \mu = 50$ against $H_a: \mu > 50$ with $\sigma_{\bar{x}} = 2$ and $\alpha = 0.05$. The solid curve is the sampling distribution of $\bar{x}$ if $H_0$ is true; the dashed curve is the sampling distribution if the true mean is 55. Name each numbered part.'
  image: {src: images/stat-m8-alpha-beta-blank.svg, alt: 'Two normal curves over a sample-mean axis from 44 to 60: a solid one centered at 50 and a dashed one centered at 55. A vertical line at about 53.3 (marker 4). Marker 1 is on the small shaded area right of the line under the solid curve; marker 2 is on the shaded area left of the line under the dashed curve; marker 3 is on the large shaded area right of the line under the dashed curve.'}
  labels:
    - {x: 57.8, y: 76.6, text: 'α, the Type I error probability'}
    - {x: 50.3, y: 72.4, text: 'β, the Type II error probability'}
    - {x: 73.3, y: 52.6, text: Power}
    - {x: 54.5, y: 19.7, text: Rejection cutoff}
  distractors: [p-value, Confidence level]
  explanation: |-
    The vertical line is the cutoff $50 + 1.645(2) = 53.29$: reject $H_0$ when $\bar{x}$ lands to its right. 1: the area right of the cutoff under the $H_0$ curve is $\alpha = 0.05$, the chance of rejecting when $H_0$ is true. 2: the area left of the cutoff under the true ($\mu = 55$) curve is $\beta \approx 0.20$, the chance of missing the effect. 3: the area right of the cutoff under the true curve is the power, about 0.80. A p-value would need an observed $\bar{x}$, which this picture doesn't have.

- id: stat-m8-r2-q08
  lesson: stat-errors-power
  type: match
  topic: Errors and power
  stem: 'Match each description to its name.'
  pairs:
    - [Rejecting a null hypothesis that is true, Type I error]
    - [Failing to reject a null hypothesis that is false, Type II error]
    - ['The probability of rejecting $H_0$ when a specific alternative is true', Power]
    - ['The probability of rejecting $H_0$ when $H_0$ is true', Significance level]
  distractors: [p-value]
  explanation: |-
    A Type I error is a false alarm and a Type II error a missed effect. Power is the probability of correctly rejecting against a stated alternative ($1 - \beta$), and the significance level $\alpha$ is the Type I error probability, fixed before the data are collected. A p-value is computed from the data, after the fact.

- id: stat-m8-r2-q09
  lesson: stat-errors-power
  topic: Errors and power
  stem: 'A one-sided z test for a mean is planned. With everything else unchanged, which changes increase its power against a fixed alternative? Select all that apply.'
  choices:
    - 'Increasing the sample size from 25 to 64'
    - 'Raising $\alpha$ from 0.01 to 0.05'
    - 'A true mean closer to the null value'
    - 'Measuring more precisely, so $\sigma$ is smaller'
    - 'Switching to a two-sided alternative'
  answer: [0, 1, 3]
  explanation: |-
    A larger $n$ or a smaller $\sigma$ shrinks the standard error, so the two sampling distributions overlap less. A larger $\alpha$ moves the cutoff toward the null value, so more outcomes reject. A true mean closer to $\mu_0$ is a smaller effect, which is harder to detect. A two-sided test splits $\alpha$ between two tails, so it has less power in the true direction than the one-sided test.

- id: stat-m8-r2-q10
  lesson: stat-errors-power
  type: text
  topic: Errors and power
  stem: 'Test $H_0: \mu = 50$ against $H_a: \mu > 50$ with $\sigma = 10$, $n = 25$ and $\alpha = 0.05$, so the test rejects when $\bar{x} \ge 53.29$. If the true mean is 54, the power, rounded to 2 decimal places, is ___.'
  accept: ['0.64']
  explanation: |-
    If $\mu = 54$, $\bar{x}$ is $N(54, 2)$. Power $= P(\bar{x} \ge 53.29) = P\!\left(Z \ge \dfrac{53.29 - 54}{2}\right) = P(Z \ge -0.355) \approx 0.64$. It lies between the lesson's 0.44 (for $\mu = 53$) and 0.80 (for $\mu = 55$), as it should.

# ---- Lesson 35: tests for proportions
- id: stat-m8-r2-q11
  lesson: stat-test-prop
  type: text
  topic: Tests for proportions
  stem: 'A one-proportion z test of $H_0: p = 0.40$ uses a sample of $n = 150$. The standard error in the test statistic is ___. Give only the number.'
  accept: ['0.04']
  explanation: |-
    A test uses the null value: $SE = \sqrt{p_0(1 - p_0)/n} = \sqrt{0.40(0.60)/150} = \sqrt{0.0016} = 0.04$. The sample proportion is not needed for the standard error.

- id: stat-m8-r2-q12
  lesson: stat-test-prop
  type: match
  module_quiz: true
  topic: Tests for proportions
  stem: 'Match each standard error to the procedure that uses it.'
  pairs:
    - ['$\sqrt{p_0(1-p_0)/n}$', One-proportion z test]
    - ['$\sqrt{\hat{p}(1-\hat{p})/n}$', One-proportion z interval]
    - ['$\sqrt{\hat{p}_c(1-\hat{p}_c)\left(\frac{1}{n_1}+\frac{1}{n_2}\right)}$', Two-proportion z test]
    - ['$\sqrt{\frac{\hat{p}_1(1-\hat{p}_1)}{n_1}+\frac{\hat{p}_2(1-\hat{p}_2)}{n_2}}$', Two-proportion z interval]
  explanation: |-
    Tests compute probabilities assuming $H_0$, so they use what $H_0$ implies: the null value $p_0$ for one sample, and the pooled proportion $\hat{p}_c$ for two samples (since $H_0$ says $p_1 = p_2$). Intervals assume nothing about the parameter, so they use the sample proportions.

- id: stat-m8-r2-q13
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'A one-proportion z test of $H_0: p = 0.06$ will use a simple random sample of 150 parts from a batch of 5,000. Which conditions are met? Select all that apply.'
  choices:
    - 'Random: the data come from a simple random sample'
    - '10%: the sample is at most 10% of the batch'
    - 'Large counts: $np_0 \ge 10$'
    - 'Large counts: $n(1 - p_0) \ge 10$'
  answer: [0, 1, 3]
  explanation: |-
    The sample is random, and $150 \le 0.10(5{,}000) = 500$. Large counts uses $p_0$: $150(0.06) = 9$, which is below 10, while $150(0.94) = 141$ is fine. With one large-counts check failing, the normal approximation is doubtful; an exact binomial calculation is the safer choice, as in the lesson's Example 4.

- id: stat-m8-r2-q14
  lesson: stat-test-prop
  type: order
  topic: Tests for proportions
  stem: 'Put the calculation steps of a two-proportion z test in order.'
  items:
    - 'Pool: $\hat{p}_c = (X_1 + X_2)/(n_1 + n_2)$'
    - 'Compute the standard error from $\hat{p}_c$, $n_1$ and $n_2$'
    - 'Divide $\hat{p}_1 - \hat{p}_2$ by the standard error to get $z$'
    - 'Find the tail area(s) beyond $z$ named by $H_a$'
    - 'Compare the p-value with $\alpha$'
  explanation: |-
    Each step uses the result of the one before: the pooled standard error needs $\hat{p}_c$, the z statistic needs the standard error, the p-value needs $z$, and the decision needs the p-value.

- id: stat-m8-r2-q15
  lesson: stat-test-prop
  topic: Tests for proportions
  stem: 'Before an experiment, researchers stated that they expected treatment 1 to have a higher success rate than treatment 2. The two-proportion z test gives $z = 2.10$. What is the p-value?'
  choices: ['0.0357', '0.9821', '0.0089', '0.0179']
  answer: 3
  explanation: |-
    The alternative $H_a: p_1 > p_2$ was set in advance, so the p-value is the upper tail only: $P(Z \ge 2.10) \approx 0.0179$. Doubling (0.0357) is for a two-sided test, 0.9821 is the area to the left, and 0.0089 halves the tail instead of using it.

# ---- Lesson 36: tests for means
- id: stat-m8-r2-q16
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'The picture shows eight operators'' output with an old and a new jig (the differences match the lesson''s Example 2). Why is a paired t test the right choice here rather than a two-sample t test?'
  image: {src: images/stat-m8-paired-lines.svg, alt: 'A slope graph joining each of eight operators'' old-jig and new-jig outputs. Operators range from about 16 to 31 units per hour, and six of the eight lines rise by 2 to 5 units.'}
  choices:
    - 'Pairing uses twice as many observations as the two-sample test.'
    - 'The two-sample test needs the two groups to have different sizes.'
    - 'Each operator used both jigs, so the two columns are not independent; the differences remove the large operator-to-operator variation.'
    - 'Most operators did worse with the new jig, which only a paired test can detect.'
  answer: 2
  explanation: |-
    The same operator appears in both columns, so the samples are dependent, and the two-sample test's independence condition fails. Working with each operator's difference removes the operator-to-operator spread (16 to 31 units), leaving the much smaller jig effect. Both tests use the same 16 numbers, the two-sample test doesn't need different sizes, and six of the eight operators improved.

- id: stat-m8-r2-q17
  lesson: stat-test-mean
  type: match
  module_quiz: true
  topic: Tests for means
  stem: 'Match each study to the significance test it calls for.'
  pairs:
    - ['Mean weight of 30 randomly chosen bags compared with the labeled 500 g', One-sample t test]
    - ['Blood pressure of 20 patients measured before and after a medication', Paired t test]
    - ['Test scores of 25 students taught online and 28 different students taught in person, randomly assigned', Two-sample t test]
    - ['Defect rates of parts from two machines', Two-proportion z test]
  distractors: [One-proportion z test]
  explanation: |-
    One sample compared with a standard: one-sample t. The same patients measured twice: paired t on the differences. Two separate randomly assigned groups: two-sample t. Defect rates are proportions (a categorical response), so the two-machine comparison is a two-proportion z test, not a t test.

- id: stat-m8-r2-q18
  lesson: stat-test-mean
  type: text
  topic: Tests for means
  stem: 'A random sample of $n = 16$ has $\bar{x} = 52.4$ and $s = 6$. For $H_0: \mu = 50$, the t statistic is $t =$ ___. Give only the number.'
  accept: ['1.6']
  explanation: |-
    $SE = s/\sqrt{n} = 6/\sqrt{16} = 1.5$, so $t = (52.4 - 50)/1.5 = 1.6$, with $\text{df} = 15$.

- id: stat-m8-r2-q19
  lesson: stat-test-mean
  topic: Tests for means
  stem: 'In which situations are the conditions for a one-sample t test for a mean met? Select all that apply.'
  choices:
    - 'A random sample of 40 values whose dotplot is moderately skewed, with no outliers'
    - 'A random sample of 10 values from a population known to be normal'
    - 'A random sample of 12 values with one extreme outlier'
    - 'The first 50 volunteers who answered an online ad'
  answer: [0, 1]
  explanation: |-
    With $n = 40 \ge 30$, moderate skew is fine (the central limit theorem helps). A small sample from a normal population is fine too. A small sample with an extreme outlier violates the normal condition, and volunteers who answer an ad are not a random sample, so the random condition fails.

- id: stat-m8-r2-q20
  lesson: stat-test-mean
  type: order
  module_quiz: true
  topic: Tests for means
  stem: 'Put the calculation steps of a paired t test in order.'
  items:
    - 'Subtract within each pair to get the differences'
    - 'Find the mean $\bar{d}$ and standard deviation $s_d$ of the differences'
    - 'Compute $t = \bar{d}/(s_d/\sqrt{n})$'
    - 'Find the p-value from the t distribution with $n - 1$ df'
  explanation: |-
    A paired t test is a one-sample t test on the differences, so the differences come first; their mean and SD give $t$, and $t$ gives the p-value, with $n$ the number of pairs.

# ---- Honors 1: planning a study (power curves and sample size)
- id: stat-m8-r2-h01
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'A one-sided z test is run at significance level $\alpha$. What is the height of its power curve at the null value $\mu_0$?'
  choices: ['0', '$\alpha$', '$1 - \alpha$', '0.5']
  answer: 1
  explanation: |-
    At $\mu = \mu_0$ the null hypothesis is true, so "power" there is the probability of rejecting a true $H_0$, which is the Type I error rate $\alpha$. The curve rises from $\alpha$ toward 1 as the true mean moves away from $\mu_0$ in the direction of $H_a$.

- id: stat-m8-r2-h02
  lesson: stat-m8-h-power-planning
  type: text
  topic: Power and sample size
  stem: 'A one-sided z test at $\alpha = 0.05$ ($z_\alpha = 1.645$) should have power 0.80 ($z_\beta = 0.842$) to detect a mean 2 units above $\mu_0$. The individual measurements have $\sigma = 8$. The smallest sample size that does this is $n =$ ___.'
  accept: ['99']
  explanation: |-
    $n = \left(\dfrac{(1.645 + 0.842)(8)}{2}\right)^2 = (9.948)^2 \approx 98.96$. Always round up, to 99; with 98 the power would fall just short of 0.80.

- id: stat-m8-r2-h03
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'A study was planned to detect a difference of 6 units. The investigators decide that a difference of 3 units also matters. Keeping $\alpha$, the power and $\sigma$ the same, the required sample size is multiplied by about'
  choices: ['4', '2', '$\sqrt{2}$', '8']
  answer: 0
  explanation: |-
    $n = \left((z_\alpha + z_\beta)\sigma/\delta\right)^2$ depends on $1/\delta^2$. Halving $\delta$ multiplies $n$ by $2^2 = 4$. Small effects are expensive to detect.

- id: stat-m8-r2-h04
  lesson: stat-m8-h-power-planning
  type: match
  topic: Power and sample size
  stem: 'Match each term to its meaning.'
  pairs:
    - [Power curve, Power plotted against the true value of the parameter]
    - [Effect size, The effect measured in standard deviations of individual values]
    - [Winner's curse, Significant estimates from low-power studies overstate the effect]
    - [Observed power, Power computed from the observed effect after the study]
  distractors: [The probability that the null hypothesis is true]
  explanation: |-
    A power curve shows power at every possible true value. The effect size $d = \delta/\sigma$ is measured in units of $\sigma$, not of the standard error. The winner's curse (a Type M error) is the exaggeration of effects that survive a low-power test. Observed power is computed after the fact and is just a restatement of the p-value. No test gives the probability that $H_0$ is true.

- id: stat-m8-r2-h05
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'Which statements describe the power curve of a one-sided z test of $H_0: \mu = \mu_0$ against $H_a: \mu > \mu_0$? Select all that apply.'
  choices:
    - 'It equals $\alpha$ at $\mu = \mu_0$.'
    - 'It rises toward 1 as the true mean increases above $\mu_0$.'
    - 'A larger sample size makes it rise more steeply.'
    - 'It equals $1 - \alpha$ at $\mu = \mu_0$.'
    - 'It decreases as the true effect grows.'
  answer: [0, 1, 2]
  explanation: |-
    At the null value the rejection probability is $\alpha$ (not $1 - \alpha$, which is the chance of correctly failing to reject). Bigger effects are easier to detect, so the curve rises with the true mean, and a larger $n$ shrinks the standard error, so the curve climbs faster. With $n = 25$ the lesson's curve is at 0.44 when $\mu = 53$; with $n = 100$ it is at 0.91.

- id: stat-m8-r2-h06
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'A training program is expected to raise a test score by 6 points. Scores of individual students have a standard deviation of 15 points. What is the effect size $d$?'
  choices: ['2.5', '0.04', '0.4', '0.6']
  answer: 2
  explanation: |-
    $d = \delta/\sigma = 6/15 = 0.4$, a little under Cohen's rough "medium" of 0.5. Dividing the other way gives 2.5; 0.04 and 0.6 are slips with the decimal point or the subtraction.

- id: stat-m8-r2-h07
  lesson: stat-m8-h-power-planning
  type: text
  topic: Power and sample size
  stem: 'Two independent groups of equal size will be compared with a two-sided test at $\alpha = 0.05$ ($z_{\alpha/2} = 1.960$). With $\sigma = 10$ in each group, the study needs power 0.80 ($z_\beta = 0.842$) to detect a difference of 5. How many subjects are needed in each group? ___'
  accept: ['63']
  explanation: |-
    $n = 2\left(\dfrac{(1.960 + 0.842)(10)}{5}\right)^2 = 2(5.604)^2 \approx 62.8$, rounded up to 63 per group (126 in all). Forgetting the factor 2 gives 32, too few.

- id: stat-m8-r2-h08
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'The sample size formula gives $n = 95.2$. Why should the planner use 96 rather than 95?'
  choices:
    - 'Sample sizes must be even numbers.'
    - 'Rounding up makes $\alpha$ smaller.'
    - 'The formula always underestimates by exactly one observation.'
    - 'With 95 observations the power would be slightly below the target.'
  answer: 3
  explanation: |-
    Power increases with $n$, and 95.2 is the size that gives exactly the target power. Any smaller $n$, including 95, gives a little less (0.8996 instead of 0.90 in the lesson's Example 1), so round up. The significance level is fixed by the cutoff, not by the rounding.

- id: stat-m8-r2-h09
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'A small study with power about 0.2 against a realistic effect finds a statistically significant improvement of 8 points. What is the most reasonable reading?'
  choices:
    - 'The true effect is very likely 8 points or more, since the result survived a hard test.'
    - 'The effect is probably real, but its true size is likely smaller than 8 points.'
    - 'The result must be a Type I error, because the power was low.'
    - 'Low power means the p-value was computed incorrectly.'
  answer: 1
  explanation: |-
    With low power, only estimates that happened to land far from 0 reach significance, so significant estimates tend to overstate the effect (the winner's curse). In the lesson's Example 4 the exaggeration averaged about 2.5 times. Low power does not make a significant result automatically false, and it doesn't affect how the p-value is computed.

- id: stat-m8-r2-h10
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'A study finds p-value 0.30. A colleague plugs the observed effect into the power formula, gets "observed power" 0.18, and concludes that the effect might exist but the study lacked power. What is wrong with this reasoning?'
  choices:
    - 'Observed power is determined by the p-value, so it adds no new information; a confidence interval shows which effects are still plausible.'
    - 'Observed power should be computed with $\alpha = 0.30$.'
    - 'Power can only be computed for two-sided tests.'
    - 'A p-value of 0.30 proves that the effect does not exist.'
  answer: 0
  explanation: |-
    For a given test, observed power is a fixed function of the p-value: a large p-value always comes with low observed power, so it cannot be independent evidence of anything. Power is for planning; after the study, the confidence interval reports which effect sizes the data rule out. A large p-value never proves the null hypothesis.

- id: stat-m8-r2-h11
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'To plan the sample size for a two-sided test at $\alpha = 0.05$, which value replaces $z_\alpha$ in the formula?'
  choices: ['1.645', '0.842', '1.960', '2.576']
  answer: 2
  explanation: |-
    A two-sided test puts $\alpha/2 = 0.025$ in each tail, so the cutoff is $z_{0.025} = 1.960$. 1.645 is the one-sided value, 0.842 is $z_\beta$ for power 0.80, and 2.576 is the two-sided value for $\alpha = 0.01$.

- id: stat-m8-r2-h12
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'The sample size formula for a one-proportion test has two different square roots, $\sqrt{p_0(1-p_0)}$ and $\sqrt{p_1(1-p_1)}$. Why?'
  choices:
    - 'One is for the sample and one is for the population.'
    - 'One is for a one-sided test and one for a two-sided test.'
    - 'Because the test pools the two proportions.'
    - 'The SD of $\hat{p}$ depends on $p$, so it is different when $H_0$ is true (setting the cutoff) and when the alternative $p_1$ is true (giving the power).'
  answer: 3
  explanation: |-
    The cutoff is placed using the SD of $\hat{p}$ under $H_0$, $\sqrt{p_0(1-p_0)/n}$, while the chance of landing beyond it is computed under the alternative, with SD $\sqrt{p_1(1-p_1)/n}$. For means, $\sigma$ is the same under both hypotheses, so one $\sigma$ appears.

- id: stat-m8-r2-h13
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'The z-based formula gives $n = 96$ for a study that will actually be analyzed with a t test (because $\sigma$ will be estimated). What should the planner expect?'
  choices:
    - 'The t test needs far fewer observations, about half.'
    - 'The t test needs slightly more observations, here about 97.'
    - 'Exactly 96, since z and t tests have the same power.'
    - 'Power cannot be computed for a t test.'
  answer: 1
  explanation: |-
    Critical values of $t$ are a little larger than those of $z$, so a t test needs slightly more data for the same power. Exact calculations (with the noncentral t distribution) give 97 for the lesson's Example 1. Usually the larger uncertainty is in the planning value of $\sigma$.

- id: stat-m8-r2-h14
  lesson: stat-m8-h-power-planning
  topic: Power and sample size
  stem: 'With everything else unchanged, which changes reduce the sample size needed for a test? Select all that apply.'
  choices:
    - 'Deciding that only a larger effect is worth detecting'
    - 'Using a larger planning value for $\sigma$'
    - 'Accepting power 0.80 instead of 0.90'
    - 'Lowering $\alpha$ from 0.05 to 0.01'
    - 'Using matched pairs that reduce the SD of the differences'
  answer: [0, 2, 4]
  explanation: |-
    $n = \left((z_\alpha + z_\beta)\sigma/\delta\right)^2$ shrinks when $\delta$ grows, when $z_\beta$ shrinks (lower power) and when the relevant SD shrinks, which is what good pairing does. A larger $\sigma$ and a smaller $\alpha$ (larger $z_\alpha$) both increase $n$.

# ---- Honors 2: equivalence and non-inferiority
- id: stat-m8-r2-h15
  lesson: stat-m8-h-equivalence
  type: label
  topic: Equivalence testing
  stem: 'Each bar is a 90% confidence interval for a difference, drawn against an equivalence margin $\pm\Delta$ (the shaded zone). Using a TOST at $\alpha = 0.05$, name the conclusion for each numbered interval.'
  image: {src: images/stat-m8-equivalence-blank.svg, alt: 'Four horizontal confidence intervals against an axis marked minus delta, 0 and plus delta, with the zone between the margins shaded. Interval 1 runs from inside the zone, across 0, to beyond plus delta. Interval 2 lies inside the zone and contains 0. Interval 3 lies entirely beyond plus delta. Interval 4 lies inside the zone, entirely to the right of 0.'}
  labels:
    - {x: 53.7, y: 24.3, text: Inconclusive}
    - {x: 43.4, y: 42.1, text: 'Equivalent; the interval includes 0'}
    - {x: 77.1, y: 60.0, text: Not equivalent}
    - {x: 52.6, y: 77.9, text: 'Equivalent; the interval excludes 0'}
  distractors: [Proves the difference is exactly 0]
  explanation: |-
    TOST at $\alpha = 0.05$ concludes equivalence exactly when the 90% interval lies inside $(-\Delta, \Delta)$. Intervals 2 and 4 do; interval 4 also excludes 0, so the difference is real but too small to matter. Interval 1 contains 0 but reaches past $+\Delta$, so the data can't rule out an important difference: inconclusive. Interval 3 lies entirely beyond $+\Delta$: the difference is larger than the margin. No interval can show a difference is exactly 0.

- id: stat-m8-r2-h16
  lesson: stat-m8-h-equivalence
  type: text
  topic: Equivalence testing
  stem: 'In a TOST, the test against $-\Delta$ has p-value 0.003 and the test against $+\Delta$ has p-value 0.041. The TOST p-value is ___.'
  accept: ['0.041']
  explanation: |-
    Equivalence needs both one-sided tests to reject, so the evidence is only as strong as the weaker of the two: the TOST p-value is the larger p-value, 0.041. At $\alpha = 0.05$ equivalence is shown; at $\alpha = 0.01$ it is not.

- id: stat-m8-r2-h17
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A TOST at $\alpha = 0.05$ gives the same decision as checking whether which confidence interval lies inside $(-\Delta, \Delta)$?'
  choices: ['The 95% interval', 'The 90% interval', 'The 97.5% interval', 'The 99% interval']
  answer: 1
  explanation: |-
    Each one-sided test at level $\alpha$ matches one end of a $(1 - 2\alpha)$ interval, so $\alpha = 0.05$ goes with a 90% interval. Using the 95% interval would make the procedure stricter than the stated level.

- id: stat-m8-r2-h18
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A study comparing two gauges finds no significant difference (p-value 0.40). Why doesn''t this show that the gauges are equivalent?'
  choices:
    - 'A p-value of 0.40 is too small to support equivalence.'
    - 'Equivalence can only be shown for proportions.'
    - 'A small or noisy study can fail to detect even a large difference; the data may still allow differences bigger than any acceptable margin.'
    - 'Ordinary tests can only be used for one-sided alternatives.'
  answer: 2
  explanation: |-
    Failing to reject "difference = 0" only says the data are consistent with 0. They may be consistent with large differences too, as in the lesson's 6-section study, whose 90% interval reached 0.45 mm. To support equivalence, the null hypothesis must be "the difference is at least $\Delta$," and the data must reject it.

- id: stat-m8-r2-h19
  lesson: stat-m8-h-equivalence
  type: match
  topic: Equivalence testing
  stem: 'Match each research goal to the null hypothesis its test uses.'
  pairs:
    - [Show that a new method gives different results from the old one, The difference is 0]
    - [Show that two methods are practically the same, The difference is at least Δ in size]
    - [Show that a new treatment is not much worse than the standard, The new one is worse by Δ or more]
  distractors: [The difference is less than Δ in size]
  explanation: |-
    The null hypothesis is always what we want to find evidence against. To show a difference, test "no difference." To show equivalence, test "the difference is at least $\Delta$ in size" (TOST). To show non-inferiority, test "the new one is worse by at least $\Delta$." "Less than $\Delta$ in size" is what equivalence hopes to show, so it is the alternative, not a null.

- id: stat-m8-r2-h20
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A paired equivalence study has $\bar{d} = 0.5$, $SE = 0.2$ and margin $\Delta = 1$. What is the statistic $t_2 = (\bar{d} - \Delta)/SE$ for the test against $+\Delta$?'
  choices: ['$2.5$', '$-7.5$', '$7.5$', '$-2.5$']
  answer: 3
  explanation: |-
    $t_2 = (0.5 - 1)/0.2 = -2.5$, a lower-tail test of $H_{02}: \mu_d \ge 1$. The other statistic is $t_1 = (0.5 + 1)/0.2 = 7.5$. The positive 2.5 and the $-7.5$ come from sign slips.

- id: stat-m8-r2-h21
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'With margin $\Delta = 0.30$, a study''s 90% confidence interval for a difference is $(0.05, 0.22)$. Which statements are justified? Select all that apply.'
  choices:
    - 'A TOST at $\alpha = 0.05$ concludes equivalence.'
    - 'A two-sided test of "difference = 0" at $\alpha = 0.10$ would reject.'
    - 'The true difference is exactly 0.'
    - 'The study is inconclusive.'
  answer: [0, 1]
  explanation: |-
    The interval lies inside $(-0.30, 0.30)$, so equivalence is shown at $\alpha = 0.05$. It also excludes 0, and a 90% interval matches a two-sided test at 0.10, so that test rejects "difference = 0": the difference is real but small. That contradicts "exactly 0," and the study is not inconclusive.

- id: stat-m8-r2-h22
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'Why can each of the two one-sided tests in a TOST use the full level $\alpha$ rather than $\alpha/2$?'
  choices:
    - 'Because equivalence is claimed only when both tests reject, and if the true difference is outside the margin only one test''s null hypothesis can be true, so a false claim has probability at most $\alpha$.'
    - 'Because one-sided tests always have smaller error rates than two-sided tests.'
    - 'Because the two tests are independent.'
    - 'Because the margin $\Delta$ absorbs the extra error.'
  answer: 0
  explanation: |-
    If, say, $\theta \ge \Delta$, a false claim of equivalence requires test 2 to reject, which happens with probability at most $\alpha$ because test 2 is a valid level-$\alpha$ test there. Requiring test 1 to reject as well only lowers the chance. Splitting $\alpha$ is for "either one rejects" conclusions, like Bonferroni. The two tests use the same data, so they are not independent.

- id: stat-m8-r2-h23
  lesson: stat-m8-h-equivalence
  type: text
  topic: Equivalence testing
  stem: 'A non-inferiority test uses margin $\Delta = 0.08$. The observed difference (new − standard) is $-0.03$ with standard error 0.025. The test statistic is $z =$ ___. Give only the number.'
  accept: ['2']
  explanation: |-
    The test compares the estimate with $-\Delta$, not with 0: $z = \dfrac{-0.03 - (-0.08)}{0.025} = \dfrac{0.05}{0.025} = 2$, with one-sided p-value $P(Z \ge 2) \approx 0.023$.

- id: stat-m8-r2-h24
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'Bioequivalence of a generic drug is usually shown by a 90% interval for the ratio of mean blood levels lying within 80% to 125%. Why is the upper limit 125% rather than 120%?'
  choices:
    - 'Because generic drugs are allowed to be stronger than the original.'
    - 'Because the 90% interval is wider on the upper side.'
    - 'Because 120% was found to be unsafe.'
    - 'Because the limits are symmetric on the log scale: a ratio of 0.80 one way is 1/0.80 = 1.25 the other way.'
  answer: 3
  explanation: |-
    Ratios are compared on the log scale, where $\ln 0.80 = -\ln 1.25$. A product with 80% of the reference's level means the reference has 125% of the product's, so the two limits describe the same size of difference in either direction.

- id: stat-m8-r2-h25
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A small study gives a 90% interval of $(-0.21, 0.45)$ for a mean difference, with margin $\Delta = 0.30$. An ordinary test of "difference = 0" has p-value 0.50. What is the right conclusion?'
  choices:
    - 'The methods are equivalent, because the ordinary test was not significant.'
    - 'Inconclusive: the data neither show equivalence nor show a difference, since the interval reaches past the margin and also contains 0.'
    - 'The methods differ by more than the margin.'
    - 'The methods are equivalent, because the interval contains 0.'
  answer: 1
  explanation: |-
    The interval includes 0, so there is no evidence of a difference, but it also reaches 0.45, beyond $+0.30$, so an important difference hasn't been ruled out. Only an interval entirely inside $(-0.30, 0.30)$ would show equivalence, and only one entirely beyond the margin would show a difference larger than $\Delta$.

- id: stat-m8-r2-h26
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A non-inferiority trial (higher cure rate is better, margin $\Delta = 0.10$) gives a 95% interval of $(-0.095, 0.015)$ for $p_{\text{new}} - p_{\text{std}}$. Which conclusion is correct?'
  choices:
    - 'The new treatment is non-inferior, and the trial gives no evidence that it is better or worse than the standard.'
    - 'The new treatment is better than the standard.'
    - 'The new treatment is worse by more than 10 points.'
    - 'Nothing can be concluded, because the interval contains 0.'
  answer: 0
  explanation: |-
    Non-inferiority needs the lower bound above $-\Delta$: $-0.095 > -0.10$, so it is shown (at one-sided level 0.025). The interval contains 0, so there is no evidence of a real difference in either direction; "not much worse" is not "better." Containing 0 is not a problem for a non-inferiority claim.

- id: stat-m8-r2-h27
  lesson: stat-m8-h-equivalence
  type: order
  topic: Equivalence testing
  stem: 'Put the steps of an equivalence study analyzed by TOST in order.'
  items:
    - 'Choose the equivalence margin $\Delta$ before collecting data'
    - 'Collect the data and compute the estimate and its standard error'
    - 'Compute the two one-sided test statistics and their p-values'
    - 'Take the larger p-value and compare it with $\alpha$'
  explanation: |-
    The margin must be fixed first, so it can't be tuned to the results. The test statistics need the estimate and its standard error, and the decision uses the larger of the two p-values.

- id: stat-m8-r2-h28
  lesson: stat-m8-h-equivalence
  topic: Equivalence testing
  stem: 'A study of 40,000 people finds that a new diet lowers weight by 0.2 kg on average (p-value < 0.001), with 90% interval $(0.12, 0.28)$ kg. A loss under 1 kg is considered unimportant. What is the best summary?'
  choices:
    - 'The diet has a large and important effect, since the p-value is tiny.'
    - 'The diet has no effect, since 0.2 kg is small.'
    - 'The result is inconclusive.'
    - 'The effect is real (the interval excludes 0) but practically negligible (the interval lies inside ±1 kg).'
  answer: 3
  explanation: |-
    Both questions can be asked of the same interval. It excludes 0, so the effect is statistically significant; it also lies entirely inside the margin of ±1 kg, so a TOST would conclude equivalence with "no effect" for practical purposes. A tiny p-value measures how surely the effect differs from 0, not how big it is.

# ---- Honors 3: exact tests
- id: stat-m8-r2-h29
  lesson: stat-m8-h-exact-tests
  type: text
  topic: Exact tests
  stem: 'In a paired study of 10 pairs, 7 differences are positive, 2 are negative and 1 is zero. The one-sided sign test p-value for "the median difference is positive" is ___ (4 decimal places).'
  accept: ['0.0898']
  explanation: |-
    Drop the zero, leaving $n = 9$. Under $H_0$ the number of positive signs is $B(9, 0.5)$, so the p-value is $P(X \ge 7) = \dfrac{\binom{9}{7} + \binom{9}{8} + \binom{9}{9}}{2^9} = \dfrac{36 + 9 + 1}{512} \approx 0.0898$. Keeping the zero ($B(10, 0.5)$) would give a different, wrong answer.

- id: stat-m8-r2-h30
  lesson: stat-m8-h-exact-tests
  type: text
  topic: Exact tests
  stem: 'Five paired differences are 4, −1, 6, 3 and 8. For the Wilcoxon signed-rank test, the sum of the ranks of the positive differences is $W^+ =$ ___.'
  accept: ['14']
  explanation: |-
    Rank the sizes 1, 3, 4, 6, 8 as 1 to 5. Only the −1 (rank 1) is negative, so $W^+ = 2 + 3 + 4 + 5 = 14$, which is also the total $5(6)/2 = 15$ minus 1. Ranking the signed values instead of their sizes is the common mistake.

- id: stat-m8-r2-h31
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'Test $H_0: p = 0.5$ against $H_a: p > 0.5$ with an exact binomial test. In 12 independent trials there are 10 successes. What is the p-value?'
  choices: ['0.0193', '0.0161', '0.0386', '0.0002']
  answer: 0
  explanation: |-
    $P(X \ge 10) = \dfrac{\binom{12}{10} + \binom{12}{11} + \binom{12}{12}}{2^{12}} = \dfrac{66 + 12 + 1}{4096} \approx 0.0193$. 0.0161 is $P(X = 10)$ alone (not "at least as extreme"), 0.0386 doubles the tail for a two-sided test, and 0.0002 is $P(X = 12)$.

- id: stat-m8-r2-h32
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'An exact test is called conservative. What does that mean?'
  choices:
    - 'It always gives a smaller p-value than the normal approximation.'
    - 'It can only be used for one-sided alternatives.'
    - 'Its actual probability of a Type I error is at most the nominal $\alpha$, often less.'
    - 'It assumes the population is normal.'
  answer: 2
  explanation: |-
    Discrete statistics allow only certain p-values, so "reject when p-value $\le \alpha$" usually has a true Type I error rate below $\alpha$, as in the lesson's coin example (0.0107 instead of 0.05). That protects against false alarms at some cost in power. Exact tests make no normality assumption.

- id: stat-m8-r2-h33
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'With $n = 10$ trials, an exact binomial test of $H_0: p = 0.5$ against $H_a: p > 0.5$ rejects when the p-value is at most 0.05. If $H_0$ is true, what is the actual probability of a Type I error?'
  choices: ['0.0547', '0.0500', '0.0010', '0.0107']
  answer: 3
  explanation: |-
    $P(X \ge 8) = 56/1024 \approx 0.0547$ is above 0.05, but $P(X \ge 9) = 11/1024 \approx 0.0107$ is not, so the test rejects only when $X \ge 9$. The real Type I error rate is therefore 0.0107. No count gives exactly 0.05.

- id: stat-m8-r2-h34
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'For the lesson''s jig data, the paired t test gave a p-value of 0.0074 but the sign test gave 0.0625. What best explains the difference?'
  choices:
    - 'The sign test made an arithmetic error by dropping the zero.'
    - 'The sign test uses only the directions of the differences, not their sizes, so it has less power when the t test''s conditions hold.'
    - 'The t test is exact and the sign test is approximate.'
    - 'The sign test is two-sided and the t test is one-sided.'
  answer: 1
  explanation: |-
    Both tests here are one-sided. The sign test throws away the sizes of the differences and keeps only their signs, so it needs stronger evidence to reject; in exchange it needs no normality assumption and isn't affected by outliers. The sign test is the exact one, and dropping the zero difference is the correct rule.

- id: stat-m8-r2-h35
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'For the five differences 4, −1, 6, 3, 8 ($W^+ = 14$), what is the exact one-sided signed-rank p-value for "the differences tend to be positive"?'
  choices: ['0.0313', '0.1875', '0.0625', '0.1250']
  answer: 2
  explanation: |-
    All $2^5 = 32$ sign patterns are equally likely under $H_0$. $W^+ \ge 14$ means the negative ranks add to at most 1: either none negative or only rank 1 negative, 2 patterns. p-value $= 2/32 = 0.0625$. 0.0313 counts only the all-positive pattern, 0.1250 doubles for a two-sided test, and 0.1875 is the sign test's $P(X \ge 4) = 6/32$ for 4 positives out of 5.

- id: stat-m8-r2-h36
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'Of the sign test, the Wilcoxon signed-rank test and the paired t test, which makes the weakest assumption about the shape of the distribution of the differences?'
  choices: ['The paired t test', 'The Wilcoxon signed-rank test', 'All three make the same assumption', 'The sign test']
  answer: 3
  explanation: |-
    The sign test needs only that, under $H_0$, each nonzero difference is equally likely to be positive or negative (median 0). The signed-rank test adds symmetry about 0, and the t test needs the differences to be roughly normal (or the sample to be large). The price of the weaker assumptions is less power.

- id: stat-m8-r2-h37
  lesson: stat-m8-h-exact-tests
  type: match
  topic: Exact tests
  stem: 'Match each test to the null distribution its p-value comes from.'
  pairs:
    - [Exact binomial test, Binomial with n trials and the null value p0]
    - [Sign test, Binomial with p = 0.5 for the nonzero differences]
    - [Wilcoxon signed-rank test, All 2^n equally likely sign patterns of the ranks]
    - [Paired t test, t distribution with n − 1 degrees of freedom]
  distractors: [Normal curve with mean p0]
  explanation: |-
    The exact binomial test uses $B(n, p_0)$ itself, and the sign test is the special case $B(n, 0.5)$ applied to signs. The signed-rank test lists every way of attaching signs to the ranks. The paired t test uses a t curve, which is exact only when the differences are normal. A normal curve with mean $p_0$ is the approximation the z test uses.

- id: stat-m8-r2-h38
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'In which situations do the conditions for the usual z or t procedure fail, so that an exact test is the better choice? Select all that apply.'
  choices:
    - 'A one-proportion test with $np_0 = 3$'
    - 'A two-way table in which one expected count is 3.8'
    - 'Eight paired differences that include one extreme outlier'
    - 'A simple random sample of 500 with $np_0 = 150$ and $n(1 - p_0) = 350$'
  answer: [0, 1, 2]
  explanation: |-
    Expected counts below 10 break the large counts condition for z tests (use the exact binomial or Fisher's test), and a small sample with an extreme outlier breaks the t test's normal condition (a sign or permutation test is safer). With 150 and 350 expected successes and failures, the z test is accurate.

- id: stat-m8-r2-h39
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'The sign and signed-rank tests are called nonparametric. What does that mean?'
  choices:
    - 'They have no assumptions at all.'
    - 'They can only be used with fewer than 30 observations.'
    - 'They don''t estimate anything, so they give no p-value.'
    - 'Their null distributions don''t depend on a normal or other parametric model for the data.'
  answer: 3
  explanation: |-
    Their p-values come from counting equally likely sign patterns, not from a normal or t curve, so they are also called distribution-free. They still have assumptions: random data, and for the signed-rank test, symmetry. They give p-values, and they work for any sample size.

- id: stat-m8-r2-h40
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'For the train-cancellation data ($n = 150$, $p_0 = 0.02$, 6 cancellations), a two-sided exact p-value is 0.164 by doubling the tail but 0.130 by summing all outcomes no more likely than 6. Why do the two conventions disagree?'
  choices:
    - 'The binomial distribution with $p_0 = 0.02$ is lopsided, so the two tails are not mirror images.'
    - 'One of the two calculations must contain an error.'
    - 'Doubling is only allowed for proportions above 0.5.'
    - 'The sample is too small for any two-sided test.'
  answer: 0
  explanation: |-
    With mean 3 and a floor at 0, $B(150, 0.02)$ is strongly skewed: the lower tail cannot mirror the upper one. The two rules handle that asymmetry differently, and both are in use, so a report should say which one it used. When $p_0 = 0.5$ the distribution is symmetric and the two agree.

- id: stat-m8-r2-h41
  lesson: stat-m8-h-exact-tests
  type: order
  topic: Exact tests
  stem: 'Put the steps of the Wilcoxon signed-rank test in order.'
  items:
    - 'Drop any differences that are exactly 0'
    - 'Rank the remaining differences by absolute value'
    - 'Add the ranks of the positive differences to get $W^+$'
    - 'Find the share of the $2^n$ equally likely sign patterns with a $W^+$ at least as extreme'
  explanation: |-
    Zeros are removed before ranking (they would otherwise take up ranks), the ranks are needed to form $W^+$, and $W^+$ is compared with its exact null distribution to get the p-value.

- id: stat-m8-r2-h42
  lesson: stat-m8-h-exact-tests
  topic: Exact tests
  stem: 'A paired study of 12 pairs has 8 positive differences, 1 negative and 3 equal to zero. Under $H_0$, the number of positive signs in the sign test has which distribution?'
  choices: ['$B(12, 0.5)$', '$B(9, 0.5)$', '$B(8, 0.5)$', '$B(11, 0.5)$']
  answer: 1
  explanation: |-
    Zero differences have no sign and are dropped, leaving $8 + 1 = 9$ nonzero differences, each positive with probability 0.5 under $H_0$: $B(9, 0.5)$. The p-value would be $P(X \ge 8) = 10/512 \approx 0.0195$.
