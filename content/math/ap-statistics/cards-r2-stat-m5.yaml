# Round 2, module stat-m5: cards for the core additions and the two honors lessons.
- {front: Area model for conditional probability, back: 'Strip widths are $P(A)$; shaded heights are $P(B \mid A)$; each rectangle''s area is $P(A \cap B) = P(A)P(B \mid A)$. "Given $A$" means looking only inside $A$''s strip.', topic: Conditional probability}
- {front: Inclusion–exclusion for three events, back: '$P(A \cup B \cup C) = P(A) + P(B) + P(C) - P(A \cap B) - P(A \cap C) - P(B \cap C) + P(A \cap B \cap C)$', topic: Inclusion–exclusion}
- {front: Why the triple term is added back, back: 'An outcome in all three events is added 3 times by the singles and removed 3 times by the pairs; adding $P(A \cap B \cap C)$ counts it once.', topic: Inclusion–exclusion}
- {front: Filling in a three-circle Venn diagram, back: 'Center first, then "exactly two" (pair minus center), then "only" regions (single minus its two pair regions and the center), then "none" (total minus all seven).', topic: Inclusion–exclusion}
- {front: Inclusion–exclusion for n events, back: 'Add all singles, subtract all pairs, add all triples, … with alternating signs, ending with $\pm P(A_1 \cap \cdots \cap A_n)$.', topic: Inclusion–exclusion}
- {front: Union bound (Boole's inequality), back: '$P(A_1 \cup \cdots \cup A_n) \le \sum P(A_i)$ for any events, dependent or not. Exact only for mutually exclusive events.', topic: Inclusion–exclusion}
- {front: Birthday problem formula, back: '$P(\text{all } n \text{ birthdays different}) = \dfrac{_{365}P_n}{365^n}$, assuming 365 equally likely days and independent people.', topic: Inclusion–exclusion}
- {front: Birthday problem with 23 people, back: 'About 0.507 chance of a shared birthday: 23 people form 253 pairs. (Someone sharing *your* birthday among 22 others: only about 0.059.)', topic: Inclusion–exclusion}
- {front: Birthday approximation, back: '$P(\text{no match}) \approx e^{-\binom{n}{2}/365}$; for 23 people, about 0.500 (exact 0.493).', topic: Inclusion–exclusion}
- {front: Matching problem (derangements), back: '$P(\text{no object in its own place}) = \sum_{k=0}^{n} \dfrac{(-1)^k}{k!} \to 1/e \approx 0.368$, almost regardless of $n$.', topic: Inclusion–exclusion}
- {front: Derangements of 4 objects, back: '9 of the 24 arrangements: $24(1 - 1 + \tfrac12 - \tfrac16 + \tfrac1{24}) = 9$.', topic: Inclusion–exclusion}
- {front: Probability to odds and back, back: 'odds $= \dfrac{p}{1-p}$; $p = \dfrac{\text{odds}}{1 + \text{odds}}$. $p = 0.2$ is odds 0.25 (1 to 4).', topic: Odds and likelihood ratios}
- {front: Bayes' theorem in odds form, back: 'Posterior odds = prior odds × likelihood ratio, with $\text{LR} = \dfrac{P(E \mid H)}{P(E \mid H^c)}$.', topic: Odds and likelihood ratios}
- {front: Likelihood ratios of a test, back: '$\text{LR}_+ = \dfrac{\text{sens}}{1 - \text{spec}}$, $\text{LR}_- = \dfrac{1 - \text{sens}}{\text{spec}}$. They describe the test; the prior describes the population.', topic: Odds and likelihood ratios}
- {front: Reading a likelihood ratio, back: 'LR > 1 supports the hypothesis, LR < 1 counts against it, LR = 1 is useless evidence. No LR alone gives the posterior: it multiplies the prior odds.', topic: Odds and likelihood ratios}
- {front: Several pieces of evidence, back: 'If they are conditionally independent, multiply their likelihood ratios (add their logs, the weights of evidence). Repeating the same test may break this.', topic: Odds and likelihood ratios}
- {front: Screening example in odds form, back: 'Prior odds $1/49$, $\text{LR}_+ = 0.95/0.10 = 9.5$, posterior odds $9.5/49 \approx 0.194$, so $P(D \mid +) \approx 0.162$.', topic: Odds and likelihood ratios}
- {front: Prosecutor's fallacy, back: 'Confusing $P(\text{evidence} \mid \text{innocent})$ with $P(\text{innocent} \mid \text{evidence})$. A 1-in-10,000 match among 500,000 possible sources leaves about 50 other matches.', topic: Odds and likelihood ratios}
- {front: Monty Hall problem, back: 'If the host knows where the car is and always opens an unchosen goat door, switching wins with probability 2/3. If he opens a random door that happens to show a goat, switching wins 1/2.', topic: Odds and likelihood ratios}
- {front: Sally Clark case (statistics), back: '"1 in 73 million" came from squaring 1 in 8,543, wrongly assuming independent deaths, and was then misread as the chance of innocence (the prosecutor''s fallacy).', topic: Odds and likelihood ratios}
