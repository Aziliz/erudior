# Module 4 (stat-m4), round 2: terms bolded in the honors lessons 18h1-18h3
- term: sampling weight
  aliases: [sampling weights]
  definition: 'The number of population members a sampled individual represents; in a stratified sample, $N_h/n_h$ (stratum size divided by the number sampled from it).'
  topic: Survey estimation
- term: oversampling
  aliases: [oversample, oversampled]
  definition: 'Deliberately sampling a larger share of a small stratum than its share of the population, so that the stratum''s own estimate is precise. The overall estimate must then be weighted.'
  topic: Survey estimation
- term: Neyman allocation
  aliases: [optimal allocation]
  definition: 'Splitting a stratified sample so that $n_h$ is proportional to $N_h S_h$ (stratum size times stratum standard deviation), which gives the most precise overall estimate for a fixed total sample size.'
  topic: Survey estimation
- term: design effect
  aliases: [design effects, deff]
  definition: 'The variance of an estimate under the actual sampling design divided by its variance under a simple random sample of the same size. For clusters of size $m$, approximately $1 + (m - 1)\rho$.'
  topic: Survey estimation
- term: intraclass correlation
  aliases: [ICC, intraclass correlation coefficient]
  definition: 'A measure, usually between 0 and 1, of how alike members of the same cluster are; written $\rho$ in the design effect formula.'
  topic: Survey estimation
- term: effective sample size
  definition: 'The size of a simple random sample that would give the same precision as a complex sample: the actual sample size divided by the design effect.'
  topic: Survey estimation
- term: post-stratification
  aliases: [poststratification, post-stratified]
  definition: 'Weighting survey respondents so that groups (such as age groups) match their known population shares; each group''s weight is its population share divided by its sample share.'
  topic: Survey estimation
- term: factorial design
  aliases: [factorial designs, factorial experiment, factorial experiments]
  definition: 'An experimental design that uses every combination of the levels of two or more factors as its treatments.'
  topic: Factorial experiments
- term: main effect
  aliases: [main effects]
  definition: 'The change in mean response when a factor moves from one level to another, averaged over the levels of the other factors.'
  topic: Factorial experiments
- term: interaction
  aliases: [interactions]
  definition: 'In a multifactor experiment, the situation in which the effect of one factor depends on the level of another factor; shown by nonparallel lines on an interaction plot.'
  topic: Factorial experiments
- term: simple effect
  aliases: [simple effects]
  definition: 'The effect of one factor at a single, fixed level of another factor.'
  topic: Factorial experiments
- term: interaction plot
  aliases: [interaction plots]
  definition: 'A graph of treatment means with one factor''s levels on the horizontal axis and one line for each level of the other factor. Parallel lines mean no interaction.'
  topic: Factorial experiments
- term: one-factor-at-a-time
  aliases: [OFAT, one factor at a time]
  definition: 'An approach that varies one factor while holding the others fixed. It uses units less efficiently than a factorial design and cannot detect interactions.'
  topic: Factorial experiments
- term: fractional factorial design
  aliases: [fractional factorial, fractional factorial designs]
  definition: 'An experiment that runs a carefully chosen subset of all the factor-level combinations, at the cost of not being able to separate some interactions from each other.'
  topic: Factorial experiments
- term: potential outcomes
  aliases: [potential outcome]
  definition: 'The outcomes a unit would have with the treatment, $Y(1)$, and without it, $Y(0)$. Only one of them is ever observed for any unit.'
  topic: Causal inference
- term: average treatment effect
  aliases: [ATE, average causal effect]
  definition: 'The mean of $Y(1) - Y(0)$ over all units in a group: the mean outcome if everyone were treated minus the mean outcome if no one were.'
  topic: Causal inference
- term: selection bias
  definition: 'Bias from comparing groups that differed before treatment, for example because people chose their own treatment; in potential-outcome terms, a difference in the groups'' average $Y(0)$.'
  topic: Causal inference
- term: standardization
  aliases: [direct standardization, standardized rate, standardized rates]
  definition: 'Adjusting for a measured confounder by applying each group''s rates within strata of that variable to one common standard population, so the groups are compared at the same mix.'
  topic: Causal inference
- term: natural experiment
  aliases: [natural experiments]
  definition: 'An observational study in which something close to random assignment happened without the researchers imposing it, such as a lottery or an arbitrary boundary.'
  topic: Causal inference
- term: Bradford Hill criteria
  aliases: [Hill's criteria, Hill's viewpoints, Bradford Hill viewpoints]
  definition: 'Questions proposed by Austin Bradford Hill in 1965 for judging whether an association is causal: strength, consistency, specificity, temporality, biological gradient, plausibility, coherence, experiment and analogy. Not a checklist; only temporality is generally treated as essential.'
  topic: Causal inference
- term: dose-response relationship
  aliases: [dose-response, biological gradient]
  definition: 'A pattern in which more of an exposure goes with more of the effect; one of the strongest signs, in observational data, that an association is causal.'
  topic: Causal inference
