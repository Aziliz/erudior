<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 554" width="744" height="554" role="img"><title>The values 4, 7, 8, 10 and 11, each with a square whose side is its distance from the mean of 8; the square areas are 16, 1, 0, 4 and 9</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="744" height="554" fill="#ffffff"/><rect x="108.0" y="40.0" width="136.0" height="136.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><circle cx="108.0" cy="176.0" r="7" fill="#2f6fa8" stroke="#1c2833" stroke-width="1.5"/><text x="429.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">x = 4: deviation −4, square 16</text><rect x="210.0" y="190.0" width="34.0" height="34.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><circle cx="210.0" cy="224.0" r="7" fill="#2f6fa8" stroke="#1c2833" stroke-width="1.5"/><text x="429.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">x = 7: deviation −1, square 1</text><circle cx="244.0" cy="250.0" r="7" fill="#2f6fa8" stroke="#1c2833" stroke-width="1.5"/><text x="429.0" y="255.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">x = 8: deviation 0, square 0</text><rect x="244.0" y="276.0" width="68.0" height="68.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><circle cx="312.0" cy="344.0" r="7" fill="#2f6fa8" stroke="#1c2833" stroke-width="1.5"/><text x="429.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">x = 10: deviation +2, square 4</text><rect x="244.0" y="358.0" width="102.0" height="102.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><ci