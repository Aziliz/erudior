<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img"><title>Frequency tree of 1,000 tested hypotheses</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="660" height="380" fill="#ffffff"/><rect x="16.0" y="165.0" width="130.0" height="50.0" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="81.0" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">1,000</text><text x="81.0" y="205.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">hypotheses</text><rect x="236.0" y="70.0" width="150.0" height="50.0" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="311.0" y="91.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">100</text><text x="311.0" y="110.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">real effect</text><rect x="236.0" y="260.0" width="150.0" height="50.0" rx="8" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="311.0" y="281.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">900</text><text x="311.0" y="300.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">no effect</text><line x1="146.0" y1="182.0" x2="236.0" y2="95.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="178.0" y="125.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">10%</text><line x1="146.0" y1="198.0" x2="236.0" y2="285.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="178.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">90%</text><rect x="476.0" y="16.0" width="168.0" height="50.0" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="560.0" y="37.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">80 significant</text><text x="560.0" y="56.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">true positives</text><rect x="476.0" y="106.0" width="168.0" height="50.0" rx="8" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="560.0" y="127.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">20 not significant</text><text x="560.0" y="146.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">missed (false neg.)</text><rect x="476.0" y="206.0" width="168.0" height="50.0" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="560.0" y="227.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">45 significant</text><text x="560.0" y="246.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">false positives</text><rect x="476.0" y="296.0" width="168.0" height="50.0" rx="8" fill="#ffffff" stroke="#1c2833" stroke-width="2"/><text x="560.0" y="317.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">855 not significant</text><text x="560.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">true negatives</text><line x1="386.0" y1="88.0" x2="476.0" y2="41.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="424.0" y="54.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">power 0.8</text><line x1="386.0" y1="102.0" x2="476.0" y2="131.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="430.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">0.2</text><line x1="386.0" y1="278.0" x2="476.0" y2="231.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="424.0" y="244.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">α = 0.05</text><line x1="386.0" y1="292.0" x2="476.0" y2="321.0" stroke="#1c2833" stroke-width="2" marker-end="url(#ah)"/><text x="430.0" y="324.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">0.95</text><text x="16.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">Significant results: 80 + 45 = 125</text><text x="16.0" y="50.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="bold" fill="#1c2833">False share: 45 ÷ 125 = 0.36</text></svg>