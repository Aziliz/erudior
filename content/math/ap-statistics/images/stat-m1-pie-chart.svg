amily="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">16%</text><text x="430.0" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">Angle = share × 360°</text><rect x="370.0" y="89.0" width="20.0" height="20.0" rx="0" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/><text x="400.0" y="105.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">Walk: 136.8°</text><rect x="370.0" y="123.0" width="20.0" height="20.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/><text x="400.0" y="139.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">Bus: 86.4°</text><rect x="370.0" y="157.0" width="20.0" height="20.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><text x="400.0" y="173.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">Car: 79.2°</text><rect x="370.0" y="191.0" width="20.0" height="20.0" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/><text x="400.0" y="207.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="start" font-weight="normal" fill="#1c2833">Bike: 57.6°</text><text x="430.0" y="247.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">Total: 360°</text></svg>