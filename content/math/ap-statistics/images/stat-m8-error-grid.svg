<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" role="img"><title>Decisions and errors in a significance test</title><rect x="0" y="0" width="620" height="350" fill="#ffffff"/><text x="400.0" y="30.0" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">The truth about H₀</text><text x="300.0" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">H₀ is true</text><text x="500.0" y="72.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">H₀ is false</text><text x="95.0" y="138.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">Reject H₀</text><text x="95.0" y="235.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">Fail to</text><text x="95.0" y="253.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">reject H₀</text><text x="22" y="195.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1c2833" text-anchor="middle" transform="rotate(-90 22 195.0)">The decision</text><rect x="200" y="90" width="200" height="105" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="300.0" y="138.5" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Type I error</text><text x="300.0" y="160.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">probability α</text><rect x="400" y="90" width="200" height="105" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="500.0" y="138.5" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Correct: power</text><text x="500.0" y="160.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">probability 1 − β</text><rect x="200" y="195" width="200" height="105" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="300.0" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Correct decision</text><text x="300.0" y="265.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">probability 1 − α</text><rect x="400" y="195" width="200" height="105" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="500.0" y="243.5" font-family="Helvetica, Arial, sans-serif" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Type II error</text><text x="500.0" y="265.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">probability β</text><text x="400.0" y="330.0" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">Each column adds to 1: α + (1 − α) = 1 and (1 − β) + β = 1.</text></svg>