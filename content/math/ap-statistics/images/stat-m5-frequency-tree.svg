<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img"><title>Natural-frequency tree for a screening test in 10,000 people</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="660" height="380" fill="#ffffff"/><rect x="16" y="165" width="130" height="50" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><text x="81.0" y="185.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">10,000</text><text x="81.0" y="204.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">people</text><rect x="230" y="75" width="150" height="50" rx="8" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="305.0" y="95.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">200</text><text x="305.0" y="114.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">have condition</text><rect x="230" y="255" width="150" height="50" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="305.0" y="275.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">9,800</text><text x="305.0" y="294.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">do not</text><line x1="146" y1="190" x2="230" y2="100" stroke="#1c2833" stroke-width="2"/><text x="172.0" y="132.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">2%</text><line x1="146" y1="190" x2="230" y2="280" stroke="#1c2833" stroke-width="2"/><text x="176.0" y="262.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">98%</text><rect x="470" y="20" width="170" height="60" rx="8" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="555.0" y="45.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">190 test +</text><text x="555.0" y="64.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">true positives</text><line x1="380" y1="100" x2="470" y2="50" stroke="#1c2833" stroke-width="2"/><text x="425.0" y="69.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">95%</text><rect x="470" y="110" width="170" height="60" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="555.0" y="135.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">10 test −</text><text x="555.0" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">false negatives</text><line x1="380" y1="100" x2="470" y2="140" stroke="#1c2833" stroke-width="2"/><text x="425.0" y="138.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">5%</text><rect x="470" y="200" width="170" height="60" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="555.0" y="225.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">980 test +</text><text x="555.0" y="244.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">false positives</text><line x1="380" y1="280" x2="470" y2="230" stroke="#1c2833" stroke-width="2"/><text x="425.0" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">10%</text><rect x="470" y="290" width="170" height="60" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="555.0" y="315.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">8,820 test −</text><text x="555.0" y="334.5" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">true negatives</text><line x1="380" y1="280" x2="470" y2="320" stroke="#1c2833" stroke-width="2"/><text x="425.0" y="318.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">90%</text><text x="330.0" y="365.0" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" font-weight="normal" fill="#1c2833">Of 190 + 980 = 1,170 positives, 190 have the condition: 190/1,170 ≈ 0.162</text></svg>