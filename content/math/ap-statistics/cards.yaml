# Notecards — AP Statistics
# Types of data
- {front: 'Categorical vs. quantitative variable', back: 'Categorical: places individuals into groups. Quantitative: numbers for which averaging makes sense. Test: does the mean mean anything?', topic: 'Types of data'}
- {front: 'Discrete vs. continuous variable', back: 'Discrete: countable values (counts). Continuous: any value in an interval (measurements).', topic: 'Types of data'}
- {front: 'Parameter vs. statistic', back: 'Parameter describes a population ($\mu, \sigma, p$); statistic describes a sample ($\bar{x}, s, \hat{p}$). Population–parameter, sample–statistic.', topic: 'Types of data'}
- {front: 'Levels of measurement', back: 'Nominal (unordered categories), ordinal (ordered categories), interval (differences meaningful, no true zero), ratio (true zero).', topic: 'Types of data'}
- {front: 'Census', back: 'Data from every individual in the population; its summaries are parameters.', topic: 'Types of data'}
- {front: 'Descriptive vs. inferential statistics', back: 'Descriptive summarizes the data in hand; inferential draws conclusions about a population from a sample, with a measure of uncertainty.', topic: 'Types of data'}
- {front: 'Relative frequency', back: '$\text{count} / \text{total}$; relative frequencies of all categories sum to 1.', topic: 'Types of data'}
- {front: 'Investigative question', back: 'The question a study is designed to answer, set before collecting data. It names the population, the variables, and the kind of answer wanted (estimate a parameter, compare, or check an association).', topic: 'Types of data'}
# Categorical displays
- {front: 'Pie chart angle', back: '$\text{angle} = \text{relative frequency} \times 360^\circ$.', topic: 'Categorical displays'}
- {front: 'When is a pie chart appropriate?', back: 'Only when the categories are parts of one whole: every individual in exactly one category, totals 100%.', topic: 'Categorical displays'}
- {front: 'Bar chart vs. histogram', back: 'Bar chart: categorical, separated bars, order arbitrary for nominal data. Histogram: quantitative, touching bars on a number line.', topic: 'Categorical displays'}
- {front: 'How do truncated axes mislead?', back: 'Starting a bar chart above zero exaggerates differences, because readers compare bar lengths.', topic: 'Categorical displays'}
- {front: 'Comparing a categorical variable across groups of different sizes', back: 'Use relative frequencies within each group (conditional percents) — e.g. segmented bar charts scaled to 100%.', topic: 'Categorical displays'}
# Quantitative displays
- {front: 'Describe a distribution (4 things)', back: 'Shape, center, spread and unusual features (outliers, gaps, clusters) — in context.', topic: 'Quantitative displays'}
- {front: 'Skewed right', back: 'Long tail toward large values; peak on the left; mean usually > median.', topic: 'Quantitative displays'}
- {front: 'Skewed left', back: 'Long tail toward small values; mean usually < median.', topic: 'Quantitative displays'}
- {front: 'Which displays keep every data value?', back: 'Dotplots and stemplots. Histograms, boxplots and ogives summarize.', topic: 'Quantitative displays'}
- {front: 'Histogram bin boundary rule', back: 'A value on a boundary goes in the bin that starts there (e.g. 20 goes in 20–<30).', topic: 'Quantitative displays'}
- {front: 'Ogive', back: 'Graph of cumulative relative frequency vs. upper boundary; read across from 0.5 to estimate the median.', topic: 'Quantitative displays'}
- {front: 'Bimodal distribution', back: 'Two clear peaks — often two different groups mixed together.', topic: 'Quantitative displays'}
# Center
- {front: 'Mean formula', back: '$\bar{x} = \dfrac{\sum x_i}{n}$.', topic: 'Measures of center'}
- {front: 'Median location', back: 'Sort the data; the median is at position $(n+1)/2$ (average the two middle values when $n$ is even).', topic: 'Measures of center'}
- {front: 'Which is resistant, mean or median?', back: 'The median. One extreme value can move the mean a lot but barely moves the median.', topic: 'Measures of center'}
- {front: 'Mean vs. median in skewed data', back: 'The mean is pulled toward the long tail: right skew → mean > median; left skew → mean < median.', topic: 'Measures of center'}
- {front: 'Weighted mean', back: '$\bar{x}_w = \dfrac{\sum w_i x_i}{\sum w_i}$.', topic: 'Measures of center'}
- {front: 'Find a missing value from the mean', back: 'Total must be $n\bar{x}$; subtract the known values.', topic: 'Measures of center'}
- {front: 'Why the mean is a balance point', back: 'Deviations from the mean always sum to zero: $\sum (x_i - \bar{x}) = 0$.', topic: 'Measures of center'}
- {front: 'Mean of grouped data', back: 'Use bin midpoints weighted by counts: $\sum f_i m_i / \sum f_i$.', topic: 'Measures of center'}
# Spread
- {front: 'Sample standard deviation', back: '$s = \sqrt{\dfrac{\sum (x_i - \bar{x})^2}{n - 1}}$.', topic: 'Measures of spread'}
- {front: 'Population standard deviation', back: '$\sigma = \sqrt{\dfrac{\sum (x_i - \mu)^2}{N}}$.', topic: 'Measures of spread'}
- {front: 'Why divide by n − 1?', back: 'Deviations from $\bar{x}$ run small; $n - 1$ (degrees of freedom) makes $s^2$ unbiased for $\sigma^2$.', topic: 'Measures of spread'}
- {front: 'IQR', back: '$\text{IQR} = Q_3 - Q_1$: spread of the middle 50%; resistant.', topic: 'Measures of spread'}
- {front: 'Quartiles when n is odd', back: 'Leave the median out of both halves; $Q_1$ and $Q_3$ are the medians of the halves.', topic: 'Measures of spread'}
- {front: 'Shortcut variance formula', back: '$s^2 = \dfrac{\sum x_i^2 - n\bar{x}^2}{n-1}$.', topic: 'Measures of spread'}
- {front: 'Pair the summaries', back: 'Mean with SD for roughly symmetric data; median with IQR for skewed data or outliers.', topic: 'Measures of spread'}
# Boxplots
- {front: 'Five-number summary', back: 'Min, $Q_1$, median, $Q_3$, max.', topic: 'Boxplots and outliers'}
- {front: '1.5 × IQR outlier rule', back: 'Outliers lie below $Q_1 - 1.5\,\text{IQR}$ or above $Q_3 + 1.5\,\text{IQR}$.', topic: 'Boxplots and outliers'}
- {front: 'Modified boxplot whiskers', back: 'Whiskers run to the most extreme data values that are not outliers; outliers are plotted individually.', topic: 'Boxplots and outliers'}
- {front: 'What fraction of data is in each part of a boxplot?', back: 'About 25% in each of the four sections, regardless of their lengths.', topic: 'Boxplots and outliers'}
- {front: 'What a boxplot cannot show', back: 'The number of peaks (modality) and individual values within each quarter.', topic: 'Boxplots and outliers'}
# z-scores
- {front: 'z-score', back: '$z = \dfrac{x - \text{mean}}{\text{SD}}$; number of SDs above (+) or below (−) the mean.', topic: 'Percentiles and z-scores'}
- {front: 'Value from a z-score', back: '$x = \text{mean} + z \cdot \text{SD}$.', topic: 'Percentiles and z-scores'}
- {front: 'Percentile', back: 'The percent of the distribution at or below a value.', topic: 'Percentiles and z-scores'}
- {front: 'Chebyshev''s inequality', back: 'For any distribution, at least $1 - 1/k^2$ of values lie within $k$ SDs of the mean (75% for $k = 2$, 88.9% for $k = 3$).', topic: 'Percentiles and z-scores'}
- {front: 'Mean and SD of z-scores', back: 'Always 0 and 1; standardizing does not change shape.', topic: 'Percentiles and z-scores'}
# Transformations
- {front: 'Effect of y = a + bx on center', back: 'Mean, median, quartiles, percentiles become $a + b(\text{old})$.', topic: 'Transforming data'}
- {front: 'Effect of y = a + bx on spread', back: 'SD, IQR, range become $|b|(\text{old})$; variance becomes $b^2(\text{old})$; adding $a$ has no effect.', topic: 'Transforming data'}
- {front: 'Celsius to Fahrenheit for an SD', back: '$\sigma_F = 1.8\,\sigma_C$ (the +32 does not affect spread).', topic: 'Transforming data'}
- {front: 'Do linear rules work for log or square?', back: 'No: the mean of $\log x$ is not $\log \bar{x}$. Nonlinear transformations change shape.', topic: 'Transforming data'}
# Normal
- {front: 'Empirical rule', back: '68% within $1\sigma$, 95% within $2\sigma$, 99.7% within $3\sigma$ of the mean (normal only).', topic: 'Normal distribution'}
- {front: 'Percent above μ + σ (normal)', back: '16%.', topic: 'Normal distribution'}
- {front: 'Percent between μ + σ and μ + 2σ', back: '13.5%.', topic: 'Normal distribution'}
- {front: 'Density curve properties', back: 'On or above the axis, total area 1; areas are proportions.', topic: 'Normal distribution'}
- {front: 'Inflection points of a normal curve', back: 'At $\mu - \sigma$ and $\mu + \sigma$.', topic: 'Normal distribution'}
- {front: 'Probability of a single exact value (continuous)', back: '0 — only intervals have positive probability.', topic: 'Normal distribution'}
# Normal calculations
- {front: 'Standardize for normal probabilities', back: '$P(X < x) = \Phi\!\left(\dfrac{x - \mu}{\sigma}\right)$.', topic: 'Normal calculations'}
- {front: 'Right-tail and between areas', back: 'Right: $1 - \Phi(z)$. Between: $\Phi(z_2) - \Phi(z_1)$.', topic: 'Normal calculations'}
- {front: 'Inverse normal', back: '$x = \mu + z\sigma$ with $z = \Phi^{-1}(\text{area to the left})$. "Top 10%" uses area 0.90.', topic: 'Normal calculations'}
- {front: 'Key z-values', back: '$\Phi(1) \approx 0.8413$; $z = 1.645$ (95th pct), $1.96$ (97.5th), $2.576$ (99.5th).', topic: 'Normal calculations'}
- {front: 'Normal probability plot', back: 'Data vs. expected z-scores; a straight line suggests normality; curves signal skew, isolated points outliers.', topic: 'Normal calculations'}
- {front: 'IQR of a normal distribution', back: 'About $1.35\sigma$ (quartiles at $z = \pm 0.674$).', topic: 'Normal calculations'}
# Scatterplots and correlation
- {front: 'Describe a scatterplot', back: 'Direction, form, strength, unusual features (outliers, clusters) — in context.', topic: 'Scatterplots and correlation'}
- {front: 'Correlation formula', back: '$r = \dfrac{1}{n-1}\sum z_x z_y = \dfrac{S_{xy}}{\sqrt{S_{xx}S_{yy}}}$.', topic: 'Scatterplots and correlation'}
- {front: 'Properties of r', back: '$-1 \le r \le 1$; unitless; unchanged by positive linear unit changes or swapping $x$ and $y$; not resistant; linear only.', topic: 'Scatterplots and correlation'}
- {front: 'r = 0 means…', back: 'No linear relationship — a strong curved relationship is still possible.', topic: 'Scatterplots and correlation'}
- {front: 'Correlation and causation', back: 'Correlation does not imply causation; look for lurking variables, reverse causation, coincidence.', topic: 'Scatterplots and correlation'}
- {front: 'Explanatory vs. response', back: 'Explanatory ($x$) helps explain or predict; response ($y$) is the outcome.', topic: 'Scatterplots and correlation'}
# LSRL
- {front: 'LSRL slope', back: '$b = r\dfrac{s_y}{s_x} = \dfrac{S_{xy}}{S_{xx}}$.', topic: 'Least-squares regression'}
- {front: 'LSRL intercept', back: '$a = \bar{y} - b\bar{x}$; the line passes through $(\bar{x}, \bar{y})$.', topic: 'Least-squares regression'}
- {front: 'Interpret the slope', back: 'For each one-unit increase in $x$, the predicted $y$ changes by $b$ units, on average.', topic: 'Least-squares regression'}
- {front: 'What least squares minimizes', back: '$\sum (y - \hat{y})^2$, the sum of squared residuals.', topic: 'Least-squares regression'}
- {front: 'Extrapolation', back: 'Predicting far outside the observed $x$ range — unreliable.', topic: 'Least-squares regression'}
- {front: 'Regression toward the mean', back: 'Predicted $z_{\hat{y}} = r\,z_x$, so predictions are less extreme than the $x$ values when $|r| < 1$.', topic: 'Least-squares regression'}
# Residuals
- {front: 'Residual', back: '$y - \hat{y}$ (observed − predicted). Positive: point above the line.', topic: 'Residuals and r-squared'}
- {front: 'Good residual plot', back: 'Random scatter around 0 with no curve or fan.', topic: 'Residuals and r-squared'}
- {front: 'Interpret r²', back: 'The fraction of variation in $y$ explained by the linear relationship with $x$.', topic: 'Residuals and r-squared'}
- {front: 'r² formula', back: '$r^2 = 1 - \dfrac{\text{SSE}}{\text{SST}}$.', topic: 'Residuals and r-squared'}
- {front: 'SD of residuals', back: '$s = \sqrt{\dfrac{\sum (y - \hat{y})^2}{n - 2}}$ — typical prediction error.', topic: 'Residuals and r-squared'}
- {front: 'r from r²', back: '$r = \pm\sqrt{r^2}$ with the sign of the slope.', topic: 'Residuals and r-squared'}
- {front: 'Outlier vs. high leverage vs. influential', back: 'Outlier: large residual. High leverage: extreme $x$. Influential: removing it changes the fit a lot.', topic: 'Residuals and r-squared'}
# Nonlinear
- {front: 'Linear plot of log y vs. x means…', back: 'An exponential model $y = ab^x$; $b = 10^{\text{slope}}$ for base-10 logs.', topic: 'Nonlinear models'}
- {front: 'Linear plot of log y vs. log x means…', back: 'A power model $y = ax^p$ with $p$ = slope.', topic: 'Nonlinear models'}
- {front: 'Predicting from a log model', back: 'Compute the predicted log, then back-transform: $\hat{y} = 10^{\widehat{\log y}}$ or $e^{\widehat{\ln y}}$.', topic: 'Nonlinear models'}
- {front: 'Choosing a transformation', back: 'Choose the one whose scatterplot is straightest and whose residual plot shows no pattern.', topic: 'Nonlinear models'}
# Two-way tables
- {front: 'Marginal, joint, conditional', back: 'Marginal: total ÷ grand total. Joint: cell ÷ grand total. Conditional: cell ÷ the given row/column total.', topic: 'Two-way tables'}
- {front: 'Association in a two-way table', back: 'Conditional distributions differ across the categories of the other variable.', topic: 'Two-way tables'}
- {front: 'Simpson''s paradox', back: 'An association reverses when groups are combined, because of a lurking variable.', topic: 'Two-way tables'}
- {front: 'Mosaic plot', back: 'A segmented bar chart whose bar widths are proportional to group sizes: heights show conditional distributions, widths show the marginal distribution, and each rectangle''s area is proportional to its cell count.', topic: 'Two-way tables'}
# Sampling
- {front: 'Convenience and voluntary response samples', back: 'Both are biased; a larger sample does not remove bias.', topic: 'Sampling and bias'}
- {front: 'Simple random sample', back: 'Every set of $n$ individuals is equally likely to be chosen.', topic: 'Sampling and bias'}
- {front: 'Stratified vs. cluster sample', back: 'Stratified: SRS within every stratum (similar inside). Cluster: all individuals in a few randomly chosen clusters (mixed inside).', topic: 'Sampling and bias'}
- {front: 'Systematic sample', back: 'Random start among the first $k$, then every $k$th individual, $k = N/n$.', topic: 'Sampling and bias'}
- {front: 'Proportional allocation', back: 'Stratum sample size = $n \times$ (stratum size ÷ $N$).', topic: 'Sampling and bias'}
- {front: 'Biases in surveys even with random sampling', back: 'Undercoverage, nonresponse, response bias, question wording.', topic: 'Sampling and bias'}
- {front: 'Bias vs. sampling variability', back: 'Bias: systematic error; random selection removes selection bias, but not nonresponse, response or wording bias. Variability: chance error, reduced by larger samples.', topic: 'Sampling and bias'}
# Experiments
- {front: 'Principles of experimental design', back: 'Comparison, random assignment, replication, control of other variables.', topic: 'Experimental design'}
- {front: 'Treatments in a multifactor experiment', back: 'Number of treatments = product of the numbers of levels of each factor.', topic: 'Experimental design'}
- {front: 'Double-blind', back: 'Neither subjects nor those measuring the response know who got which treatment.', topic: 'Experimental design'}
- {front: 'Purpose of blocking', back: 'Reduce variability by comparing treatments within groups of similar units; randomize within blocks.', topic: 'Experimental design'}
- {front: 'Matched pairs design', back: 'Blocks of two: pairs of similar units, or each unit gets both treatments in random order; analyze differences.', topic: 'Experimental design'}
- {front: 'Placebo effect', back: 'Improvement from expecting treatment; controlled with a placebo group.', topic: 'Experimental design'}
- {front: 'Statistically significant', back: 'An observed effect too large to plausibly be due to chance alone.', topic: 'Experimental design'}
# Scope of inference
- {front: 'Random sampling allows…', back: 'Generalizing results to the population sampled.', topic: 'Scope of inference'}
- {front: 'Random assignment allows…', back: 'Cause-and-effect conclusions.', topic: 'Scope of inference'}
- {front: 'Confounding variable', back: 'Associated with the explanatory variable and affects the response, so their effects cannot be separated.', topic: 'Scope of inference'}
- {front: 'Observational study vs. experiment', back: 'Observational: observe without intervening. Experiment: impose treatments. Only experiments can establish causation.', topic: 'Scope of inference'}
- {front: 'Ethics requirements for studies with people', back: 'Informed consent, independent review board approval, confidentiality.', topic: 'Scope of inference'}
# Probability rules
- {front: 'Complement rule', back: '$P(A^c) = 1 - P(A)$.', topic: 'Probability rules'}
- {front: 'General addition rule', back: '$P(A \cup B) = P(A) + P(B) - P(A \cap B)$.', topic: 'Probability rules'}
- {front: 'Mutually exclusive', back: '$P(A \cap B) = 0$, so $P(A \cup B) = P(A) + P(B)$.', topic: 'Probability rules'}
- {front: 'Law of large numbers', back: 'The long-run proportion of an outcome approaches its probability; says nothing about the short run.', topic: 'Probability rules'}
- {front: 'Equally likely outcomes', back: '$P(A) = \dfrac{\text{outcomes in } A}{\text{total outcomes}}$.', topic: 'Probability rules'}
- {front: 'Valid probability model', back: 'Every probability between 0 and 1; all probabilities sum to 1.', topic: 'Probability rules'}
- {front: 'Gambler''s fallacy', back: 'Believing a streak makes the other outcome "due"; independent trials have no memory.', topic: 'Probability rules'}
# Simulation
- {front: 'Four steps of a simulation', back: 'State the question; Plan the model (assign random numbers to outcomes, define one trial and what to record); Do many trials; Conclude with the proportion of trials where the event happened.', topic: 'Simulation'}
- {front: 'Assigning random digits', back: 'One digit for probabilities in tenths (0.7: digits 0–6), two digits for hundredths (0.13: 00–12). Ignore labels you don''t use.', topic: 'Simulation'}
- {front: 'Simulating sampling without replacement', back: 'Skip any label that already appeared in the current trial, since the same individual can''t be chosen twice.', topic: 'Simulation'}
- {front: 'How many simulation trials?', back: 'As many as practical: the estimate settles toward the true probability (law of large numbers). 1,000 trials typically land within about 0.03. More trials can''t fix a wrong model.', topic: 'Simulation'}
- {front: 'Simulation-based inference', back: 'Simulate many data sets under a null model; the proportion of simulated results at least as extreme as the observed one estimates the p-value. Rare (under about 5%) means convincing evidence against the model.', topic: 'Simulation'}
- {front: 'Randomization test', back: 'For an experiment: reshuffle the responses into groups many times assuming no treatment effect; see how often a difference as large as the observed one happens.', topic: 'Simulation'}
# Conditional probability
- {front: 'Conditional probability', back: '$P(A \mid B) = \dfrac{P(A \cap B)}{P(B)}$.', topic: 'Conditional probability'}
- {front: 'General multiplication rule', back: '$P(A \cap B) = P(A)\,P(B \mid A)$.', topic: 'Conditional probability'}
- {front: 'Independence test', back: '$P(A \mid B) = P(A)$, or equivalently $P(A \cap B) = P(A)P(B)$.', topic: 'Conditional probability'}
- {front: 'At least one success in n independent trials', back: '$1 - (1 - p)^n$.', topic: 'Conditional probability'}
- {front: 'Mutually exclusive vs. independent', back: 'Mutually exclusive events with positive probabilities are always dependent.', topic: 'Conditional probability'}
- {front: '10% rule for independence', back: 'Draws without replacement are nearly independent if the sample is under 10% of the population.', topic: 'Conditional probability'}
# Bayes
- {front: 'Law of total probability', back: '$P(A) = \sum P(B_i)\,P(A \mid B_i)$.', topic: "Bayes' theorem"}
- {front: 'Bayes'' theorem', back: '$P(B_j \mid A) = \dfrac{P(B_j)P(A \mid B_j)}{\sum P(B_i)P(A \mid B_i)}$ — one path over all paths to $A$.', topic: "Bayes' theorem"}
- {front: 'Tree diagram rule', back: 'Multiply along branches; add the paths that end in the same outcome.', topic: "Bayes' theorem"}
- {front: 'Sensitivity vs. specificity', back: 'Sensitivity $= P(+ \mid D)$; specificity $= P(- \mid \text{no } D)$.', topic: "Bayes' theorem"}
- {front: 'Why rare conditions give many false positives', back: 'A small false-positive rate times a huge healthy group outnumbers true positives (base rate).', topic: "Bayes' theorem"}
# Counting
- {front: 'Multiplication principle', back: 'Stages with $n_1, n_2, \ldots$ choices give $n_1 n_2 \cdots$ outcomes.', topic: 'Counting'}
- {front: 'Permutations', back: '$_nP_r = \dfrac{n!}{(n-r)!}$ — order matters.', topic: 'Counting'}
- {front: 'Combinations', back: '$\binom{n}{r} = \dfrac{n!}{r!(n-r)!}$ — order does not matter.', topic: 'Counting'}
- {front: 'Arrangements with repeated letters', back: '$\dfrac{n!}{n_1!\,n_2!\cdots}$, dividing by the factorial of each repeat count.', topic: 'Counting'}
- {front: 'Hypergeometric probability', back: '$\dfrac{\binom{K}{k}\binom{N-K}{n-k}}{\binom{N}{n}}$.', topic: 'Counting'}
- {front: '0!', back: '1.', topic: 'Counting'}
# Discrete RVs
- {front: 'Expected value (discrete)', back: '$\mu_X = \sum x_i p_i$.', topic: 'Discrete random variables'}
- {front: 'Variance (discrete)', back: '$\sigma_X^2 = \sum (x_i - \mu_X)^2 p_i = E(X^2) - \mu_X^2$.', topic: 'Discrete random variables'}
- {front: 'Fair game', back: 'Expected net gain is 0.', topic: 'Discrete random variables'}
- {front: 'Meaning of expected value', back: 'The long-run average over many repetitions; need not be a possible value.', topic: 'Discrete random variables'}
# Combining RVs
- {front: 'Mean of a + bX', back: '$\mu = a + b\mu_X$.', topic: 'Combining random variables'}
- {front: 'SD of a + bX', back: '$\sigma = |b|\sigma_X$.', topic: 'Combining random variables'}
- {front: 'Mean of X ± Y', back: '$\mu_X \pm \mu_Y$ (always).', topic: 'Combining random variables'}
- {front: 'Variance of X ± Y (independent)', back: '$\sigma_X^2 + \sigma_Y^2$ — variances add for sums and differences.', topic: 'Combining random variables'}
- {front: 'SD of a sum of n independent copies vs. nX', back: 'Sum: $\sqrt{n}\,\sigma$. $nX$: $n\sigma$.', topic: 'Combining random variables'}
- {front: 'Sum of independent normals', back: 'Also normal, with means added and variances added.', topic: 'Combining random variables'}
# Binomial
- {front: 'Binomial conditions (BINS)', back: 'Binary outcomes, Independent trials, fixed Number $n$, Same probability $p$.', topic: 'Binomial distribution'}
- {front: 'Binomial probability', back: '$P(X = k) = \binom{n}{k}p^k(1-p)^{n-k}$.', topic: 'Binomial distribution'}
- {front: 'Binomial mean and SD', back: '$\mu = np$, $\sigma = \sqrt{np(1-p)}$.', topic: 'Binomial distribution'}
- {front: '"At least k" with a cdf', back: '$P(X \ge k) = 1 - P(X \le k - 1)$.', topic: 'Binomial distribution'}
- {front: 'Normal approximation to the binomial', back: 'OK if $np \ge 10$ and $n(1-p) \ge 10$; use $N(np, \sqrt{np(1-p)})$.', topic: 'Binomial distribution'}
# Geometric
- {front: 'Geometric probability', back: '$P(X = k) = (1-p)^{k-1}p$.', topic: 'Geometric distribution'}
- {front: 'Geometric tail', back: '$P(X > k) = (1-p)^k$; $P(X \le k) = 1 - (1-p)^k$.', topic: 'Geometric distribution'}
- {front: 'Geometric mean and SD', back: '$\mu = 1/p$, $\sigma = \sqrt{1-p}/p$.', topic: 'Geometric distribution'}
# Sampling distributions
- {front: 'Sampling distribution', back: 'The distribution of a statistic over all possible samples of size $n$.', topic: 'Sampling distributions'}
- {front: 'Mean and SD of p̂', back: '$\mu_{\hat{p}} = p$; $\sigma_{\hat{p}} = \sqrt{p(1-p)/n}$ (10% condition).', topic: 'Sampling distributions'}
- {front: 'When is p̂ approximately normal?', back: 'Large counts: $np \ge 10$ and $n(1-p) \ge 10$.', topic: 'Sampling distributions'}
- {front: 'Effect of quadrupling n', back: 'Halves the standard deviation of $\hat{p}$ or $\bar{x}$.', topic: 'Sampling distributions'}
- {front: 'Does population size affect precision?', back: 'Barely, as long as the sample is under 10% of the population; $n$ matters.', topic: 'Sampling distributions'}
# CLT
- {front: 'Mean and SD of x̄', back: '$\mu_{\bar{x}} = \mu$; $\sigma_{\bar{x}} = \sigma/\sqrt{n}$.', topic: 'Central Limit Theorem'}
- {front: 'Central Limit Theorem', back: 'For a random sample from a population with finite mean and SD, $\bar{x}$ is approximately normal for large $n$ (often $n \ge 30$), whatever the population''s shape.', topic: 'Central Limit Theorem'}
- {front: 'Normal population and x̄', back: '$\bar{x}$ is exactly normal for every $n$.', topic: 'Central Limit Theorem'}
- {front: 'Probability about a total of n values', back: 'Total has mean $n\mu$ and SD $\sqrt{n}\,\sigma$ (or convert to $\bar{x}$ = total/$n$).', topic: 'Central Limit Theorem'}
# CI proportions
- {front: 'One-proportion z interval', back: '$\hat{p} \pm z^*\sqrt{\dfrac{\hat{p}(1-\hat{p})}{n}}$.', topic: 'Confidence intervals for proportions'}
- {front: 'Critical values z*', back: '90%: 1.645; 95%: 1.960; 99%: 2.576.', topic: 'Confidence intervals for proportions'}
- {front: 'Structure of a confidence interval', back: 'Point estimate ± (critical value)(standard error).', topic: 'Confidence intervals for proportions'}
- {front: 'Interpret a 95% confidence level', back: 'About 95% of intervals from repeated samples would capture the true parameter.', topic: 'Confidence intervals for proportions'}
- {front: 'Sample size for a proportion', back: '$n \ge \left(\dfrac{z^*}{M}\right)^2 p^*(1-p^*)$; use $p^* = 0.5$ if unknown; round up.', topic: 'Confidence intervals for proportions'}
- {front: 'Conditions for proportion inference', back: 'Random, 10%, large counts (≥ 10 successes and failures).', topic: 'Confidence intervals for proportions'}
- {front: 'What the margin of error does NOT cover', back: 'Bias from undercoverage, nonresponse, wording or voluntary response.', topic: 'Confidence intervals for proportions'}
# CI means
- {front: 'One-sample t interval', back: '$\bar{x} \pm t^*\dfrac{s}{\sqrt{n}}$, df $= n - 1$.', topic: 'Confidence intervals for means'}
- {front: 't vs. z distributions', back: 't has heavier tails, approaches $z$ as df grows; used when $s$ estimates $\sigma$.', topic: 'Confidence intervals for means'}
- {front: 'Conditions for t procedures', back: 'Random, 10%, population normal or $n \ge 30$ (small samples: no strong skew or outliers).', topic: 'Confidence intervals for means'}
- {front: 'Sample size for a mean', back: '$n \ge \left(\dfrac{z^*\sigma}{M}\right)^2$, rounded up.', topic: 'Confidence intervals for means'}
- {front: 'Robust', back: 'Still works when conditions are moderately violated; t procedures are robust except to outliers and strong skew in small samples.', topic: 'Confidence intervals for means'}
# Two-sample
- {front: 'SE for a difference of proportions (interval)', back: '$\sqrt{\dfrac{\hat{p}_1(1-\hat{p}_1)}{n_1} + \dfrac{\hat{p}_2(1-\hat{p}_2)}{n_2}}$.', topic: 'Two-sample intervals'}
- {front: 'SE for a difference of means', back: '$\sqrt{\dfrac{s_1^2}{n_1} + \dfrac{s_2^2}{n_2}}$.', topic: 'Two-sample intervals'}
- {front: 'Conservative df for two-sample t', back: '$\min(n_1, n_2) - 1$.', topic: 'Two-sample intervals'}
- {front: 'Paired vs. two-sample', back: 'Paired: each value has a natural partner → analyze differences. Otherwise independent two-sample.', topic: 'Two-sample intervals'}
- {front: 'Interval for a difference contains 0', back: '"No difference" is plausible; the data do not show which is larger.', topic: 'Two-sample intervals'}
# Tests
- {front: 'Null and alternative hypotheses', back: '$H_0$: parameter = null value. $H_a$: $<$, $>$ or $\ne$. Always about parameters.', topic: 'Significance tests'}
- {front: 'Test statistic', back: '$\dfrac{\text{statistic} - \text{null value}}{\text{standard error}}$.', topic: 'Significance tests'}
- {front: 'p-value', back: 'Probability, assuming $H_0$ true, of a result at least as extreme as observed.', topic: 'Significance tests'}
- {front: 'Decision rule', back: 'p-value ≤ α: reject $H_0$. p-value > α: fail to reject (never "accept").', topic: 'Significance tests'}
- {front: 'Two-sided p-value', back: 'Twice the tail area beyond $|$test statistic$|$.', topic: 'Significance tests'}
- {front: 'Tests and intervals', back: 'A two-sided level-α test rejects $H_0: \mu = \mu_0$ exactly when $\mu_0$ is outside the $(1-\alpha)$ interval.', topic: 'Significance tests'}
- {front: 'Statistical vs. practical significance', back: 'Huge samples can make tiny effects significant; report effect sizes with intervals.', topic: 'Significance tests'}
- {front: 'Four-step process', back: 'State, Plan, Do, Conclude.', topic: 'Significance tests'}
# Errors and power
- {front: 'Type I error', back: 'Reject a true $H_0$; probability $\alpha$.', topic: 'Errors and power'}
- {front: 'Type II error', back: 'Fail to reject a false $H_0$; probability $\beta$.', topic: 'Errors and power'}
- {front: 'Power', back: '$1 - \beta$: probability of rejecting $H_0$ when a specific alternative is true.', topic: 'Errors and power'}
- {front: 'Ways to increase power', back: 'Larger $n$, larger $\alpha$, larger effect, less variability (blocking/pairing).', topic: 'Errors and power'}
- {front: 'Trade-off between α and β', back: 'With $n$ fixed, lowering $\alpha$ raises $\beta$.', topic: 'Errors and power'}
# Tests for proportions
- {front: 'One-proportion z test statistic', back: '$z = \dfrac{\hat{p} - p_0}{\sqrt{p_0(1-p_0)/n}}$ — SE uses $p_0$.', topic: 'Tests for proportions'}
- {front: 'Pooled proportion', back: '$\hat{p}_c = \dfrac{X_1 + X_2}{n_1 + n_2}$.', topic: 'Tests for proportions'}
- {front: 'Two-proportion z test statistic', back: '$z = \dfrac{\hat{p}_1 - \hat{p}_2}{\sqrt{\hat{p}_c(1-\hat{p}_c)(1/n_1 + 1/n_2)}}$.', topic: 'Tests for proportions'}
- {front: 'Large counts for a one-proportion test', back: '$np_0 \ge 10$ and $n(1 - p_0) \ge 10$.', topic: 'Tests for proportions'}
# Tests for means
- {front: 'One-sample t statistic', back: '$t = \dfrac{\bar{x} - \mu_0}{s/\sqrt{n}}$, df $= n - 1$.', topic: 'Tests for means'}
- {front: 'Paired t test', back: 'One-sample t test on the differences: $t = \bar{d}/(s_d/\sqrt{n})$, df = pairs − 1.', topic: 'Tests for means'}
- {front: 'Two-sample t statistic', back: '$t = \dfrac{\bar{x}_1 - \bar{x}_2}{\sqrt{s_1^2/n_1 + s_2^2/n_2}}$.', topic: 'Tests for means'}
# Chi-square
- {front: 'Chi-square statistic', back: '$\chi^2 = \sum \dfrac{(O - E)^2}{E}$.', topic: 'Chi-square goodness of fit'}
- {front: 'GOF degrees of freedom', back: 'Number of categories − 1.', topic: 'Chi-square goodness of fit'}
- {front: 'Chi-square conditions', back: 'Random, 10%, all expected counts ≥ 5.', topic: 'Chi-square goodness of fit'}
- {front: 'Chi-square p-value', back: 'Always the upper-tail area.', topic: 'Chi-square goodness of fit'}
- {front: 'Expected count in a two-way table', back: '$\dfrac{\text{row total} \times \text{column total}}{\text{grand total}}$.', topic: 'Chi-square two-way tables'}
- {front: 'Two-way table df', back: '$(r - 1)(c - 1)$.', topic: 'Chi-square two-way tables'}
- {front: 'Independence vs. homogeneity', back: 'Independence: one sample, two variables. Homogeneity: several samples/treatments, one variable.', topic: 'Chi-square two-way tables'}
- {front: '2×2 chi-square and z', back: '$\chi^2 = z^2$ (pooled two-proportion z); same two-sided p-value.', topic: 'Chi-square two-way tables'}
# Regression inference
- {front: 'Regression model', back: '$y = \beta_0 + \beta_1 x + \varepsilon$, $\varepsilon \sim N(0, \sigma)$.', topic: 'Regression inference'}
- {front: 'Conditions for regression inference', back: 'LINER: Linear, Independent, Normal, Equal SD, Random.', topic: 'Regression inference'}
- {front: 'Standard error of the slope', back: '$SE_b = \dfrac{s}{s_x\sqrt{n-1}}$.', topic: 'Regression inference'}
- {front: 't test for slope', back: '$t = b/SE_b$, df $= n - 2$; interval $b \pm t^* SE_b$.', topic: 'Regression inference'}
- {front: 'Computer output p-value for slope', back: 'Two-sided; halve it for a one-sided test when $b$ has the right sign.', topic: 'Regression inference'}
