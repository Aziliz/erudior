# Round 2, module stat-m8: cards for the new core-lesson pictures and the three honors lessons.
# Core additions
- {front: 'Rejection region', back: 'Values of the statistic that lead to rejecting $H_0$ at level $\alpha$; its area under the $H_0$ sampling distribution is $\alpha$. Observed statistic in it ⇔ p-value $\le \alpha$.', topic: 'Significance tests'}
- {front: 'Reading the error grid', back: 'Columns = truth, rows = decision. $H_0$ true: reject with prob. $\alpha$ (Type I), else $1 - \alpha$. $H_0$ false: reject with prob. $1 - \beta$ (power), else $\beta$ (Type II).', topic: 'Errors and power'}
# Power and sample size
- {front: 'Power curve', back: 'Power plotted against the true parameter value. Equals $\alpha$ at the null value; rises toward 1 away from it; steeper for larger $n$.', topic: 'Power and sample size'}
- {front: 'Sample size, one-sided z test for a mean', back: '$n = \left(\dfrac{(z_\alpha + z_\beta)\,\sigma}{\delta}\right)^2$, always rounded up.', topic: 'Power and sample size'}
- {front: 'Sample size for a two-sided test', back: 'Replace $z_\alpha$ with $z_{\alpha/2}$ (1.960 for $\alpha = 0.05$).', topic: 'Power and sample size'}
- {front: 'Common $z_\beta$ values', back: 'Power 0.80: $z_\beta = 0.842$. Power 0.90: $z_\beta = 1.282$.', topic: 'Power and sample size'}
- {front: 'Halving the effect to detect', back: 'Multiplies the required $n$ by 4 (since $n \propto 1/\delta^2$). Doubling $\sigma$ also multiplies $n$ by 4.', topic: 'Power and sample size'}
- {front: 'Effect size $d$', back: '$d = \delta/\sigma$: the effect in SDs of individual values. Cohen''s rough labels: 0.2 small, 0.5 medium, 0.8 large.', topic: 'Power and sample size'}
- {front: 'Sample size, one proportion', back: '$n = \left(\dfrac{z_\alpha\sqrt{p_0(1-p_0)} + z_\beta\sqrt{p_1(1-p_1)}}{|p_1 - p_0|}\right)^2$', topic: 'Power and sample size'}
- {front: 'Sample size, two means (per group)', back: '$n = 2\left(\dfrac{(z_{\alpha/2} + z_\beta)\,\sigma}{\delta}\right)^2$ in each group (two-sided).', topic: 'Power and sample size'}
- {front: 'z formula vs. t test', back: 'A t test needs slightly more data than the z formula says (e.g. 97 vs. 96). The planning value of $\sigma$ is the bigger uncertainty.', topic: 'Power and sample size'}
- {front: 'Winner''s curse (Type M error)', back: 'Significant results from low-power studies overstate the effect: with power 0.17 they average about 2.5 times the true effect.', topic: 'Power and sample size'}
- {front: 'Observed (post hoc) power', back: 'A function of the p-value; adds nothing. Plan power before the study; report a confidence interval after.', topic: 'Power and sample size'}
# Equivalence and non-inferiority
- {front: 'Why "not significant" ≠ "equivalent"', back: 'A small or noisy study can miss a large difference. To show sameness, make "the difference is at least $\Delta$" the null hypothesis and reject it.', topic: 'Equivalence testing'}
- {front: 'Equivalence margin $\Delta$', back: 'Largest difference that doesn''t matter in practice. A subject-matter choice, fixed before the data.', topic: 'Equivalence testing'}
- {front: 'Equivalence hypotheses', back: '$H_0: \theta \le -\Delta$ or $\theta \ge \Delta$ (not equivalent). $H_a: -\Delta < \theta < \Delta$ (equivalent).', topic: 'Equivalence testing'}
- {front: 'TOST', back: 'Two one-sided tests: $t_1 = (\text{est} + \Delta)/SE$ (upper tail) and $t_2 = (\text{est} - \Delta)/SE$ (lower tail), each at level $\alpha$. Equivalent if both reject.', topic: 'Equivalence testing'}
- {front: 'TOST p-value', back: 'The larger of the two one-sided p-values.', topic: 'Equivalence testing'}
- {front: 'TOST and confidence intervals', back: 'TOST at level $\alpha$ ⇔ the $(1 - 2\alpha)$ interval lies inside $(-\Delta, \Delta)$. For $\alpha = 0.05$: a 90% interval.', topic: 'Equivalence testing'}
- {front: 'Significant yet equivalent', back: 'An interval that excludes 0 but lies inside $(-\Delta, \Delta)$: a real difference too small to matter (common with huge samples).', topic: 'Equivalence testing'}
- {front: 'Non-inferiority test', back: '$H_0: \theta \le -\Delta$ vs. $H_a: \theta > -\Delta$ (higher is better). Shown when the lower confidence bound is above $-\Delta$. Not the same as superiority.', topic: 'Equivalence testing'}
- {front: 'Standard error in a non-inferiority test for proportions', back: 'Unpooled (simplest version): $\sqrt{\hat{p}_1(1-\hat{p}_1)/n_1 + \hat{p}_2(1-\hat{p}_2)/n_2}$, because $H_0$ does not say $p_1 = p_2$.', topic: 'Equivalence testing'}
- {front: 'Bioequivalence (usual standard)', back: '90% interval for the ratio of mean blood levels within 80% to 125%; symmetric on the log scale since $1/0.8 = 1.25$.', topic: 'Equivalence testing'}
# Exact tests
- {front: 'Exact test', back: 'p-value from the exact null distribution (binomial, or listing equally likely outcomes), not a normal or t approximation. Valid for any $n$.', topic: 'Exact tests'}
- {front: 'Exact binomial test', back: 'For $H_a: p > p_0$, p-value $= P(X \ge x)$ with $X \sim B(n, p_0)$; for $p < p_0$, $P(X \le x)$.', topic: 'Exact tests'}
- {front: 'Two-sided exact binomial p-values', back: 'No single rule when $p_0 \ne 0.5$: double the smaller tail (capped at 1), or add all outcomes no more likely than the observed one. State which.', topic: 'Exact tests'}
- {front: 'Conservative test', back: 'Actual Type I error rate at most $\alpha$, often less. Exact tests on discrete data usually are: with $n = 10$, $p_0 = 0.5$, nominal 0.05 gives actual 0.0107.', topic: 'Exact tests'}
- {front: 'Sign test', back: 'Drop zero differences; number of positive signs is $B(n, 0.5)$ under $H_0$ ($n$ = nonzero differences). Uses only directions.', topic: 'Exact tests'}
- {front: 'Wilcoxon signed-rank test', back: 'Rank the nonzero differences by absolute value (ties get average ranks); $W^+$ = sum of ranks of positive differences; all $2^n$ sign patterns equally likely under $H_0$.', topic: 'Exact tests'}
- {front: 'Sign vs. signed-rank vs. paired t', back: 'Use more and more information (signs, ranks, values) and assume more (nothing about shape, symmetry, near-normality). Jig data: 0.0625, 0.0156, 0.0074.', topic: 'Exact tests'}
- {front: 'Nonparametric (distribution-free)', back: 'Null distribution doesn''t depend on a normal or other parametric model. Still needs random data (and symmetry for signed-rank).', topic: 'Exact tests'}
