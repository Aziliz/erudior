# Round 2 drills for stat-m9 (honors lessons 39h1–39h3)
# ---- 39h1: where the chi-square test comes from
- id: stat-m9-r2-two-cat
  title: Two-category chi-square equals z squared
  topic: Chi-square theory
  vars:
    p0: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5]}
    nn: {choices: [100, 200, 300, 400, 500]}
    u: {min: -30, max: 30}
  calc:
    e1: nn*p0
    e2: nn - e1
    o1: e1 + u
    o2: nn - o1
    chi: u^2/e1 + u^2/e2
    ph: o1/nn
    se: sqrt(p0*(1 - p0)/nn)
    zz: (ph - p0)/se
    pct: p0*100
    pv: 1 - chi2cdf(chi, 1)
  where: ['o1 >= 1', 'o2 >= 1', 'abs(u) >= 3']
  prompt: |-
    A supplier claims that {pct}% of its parts are defective. In a random sample of {nn} parts, {o1}
    are defective. Find the chi-square goodness-of-fit statistic for the two categories (3 decimals)
    and the one-proportion z statistic (2 decimals, with its sign).
  answers:
    - {name: chi, label: '$\chi^2 =$', tolerance: 0.002, format: dp3}
    - {name: zz, label: '$z =$', tolerance: 0.01, format: num2}
  solution: |-
    Expected counts: {e1} defective and {e2} not. The observed counts miss them by {u} and by its
    opposite, so
    $\chi^2 = \dfrac{({u})^2}{{e1}} + \dfrac{({u})^2}{{e2}} =$ **{chi:dp3}**.
    For z: $\hat{p} = {o1}/{nn} = {ph:num4}$, $SE = \sqrt{{p0}(1 - {p0})/{nn}} = {se:num4}$, so
    $z = ({ph:num4} - {p0})/{se:num4} =$ **{zz:num2}**. Check: $z^2 \approx {chi:dp3}$, and both tests give the
    two-sided p-value {pv:num4}.

- id: stat-m9-r2-gof-df
  title: Degrees of freedom with estimated parameters
  topic: Chi-square theory
  vars:
    kk: {min: 4, max: 9}
    mm: {choices: [{label: 'a distribution whose proportions are all stated in $H_0$', value: 0}, {label: 'a binomial model, with $p$ estimated from the data', value: 1}, {label: 'a normal model, with the mean and SD estimated from the data', value: 2}]}
    chi: {min: 2, max: 18, step: 0.01}
  calc:
    mval: mm + 0
    dfree: kk - 1 - mm
    pv: 1 - chi2cdf(chi, dfree)
  where: ['pv > 0.0005', 'pv < 0.6']
  prompt: |-
    A chi-square goodness-of-fit test checks the fit of {mm}. After combining sparse categories,
    the test uses {kk} categories and gives $\chi^2 = {chi}$. Find the degrees of freedom and the
    p-value (4 decimals).
  answers:
    - {name: dfree, label: 'df', format: integer}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    df $=$ categories $- 1 -$ parameters estimated $= {kk} - 1 - {mval} =$ **{dfree}**. p-value
    $= P(\chi^2_{{dfree}} \ge {chi}) \approx$ **{pv:num4}**.

# ---- 39h2: after the chi-square test
- id: stat-m9-r2-adj-resid
  title: Adjusted residual for a cell
  topic: Chi-square follow-up
  vars:
    aa: {min: 8, max: 60}
    ab: {min: 8, max: 60}
    ac: {min: 8, max: 60}
    ba: {min: 8, max: 60}
    bb: {min: 8, max: 60}
    bc: {min: 8, max: 60}
  calc:
    r1: aa + ab + ac
    r2: ba + bb + bc
    c1: aa + ba
    c2: ab + bb
    c3: ac + bc
    tot: r1 + r2
    ee: r1*c1/tot
    std: (aa - ee)/sqrt(ee)
    adj: (aa - ee)/sqrt(ee*(1 - r1/tot)*(1 - c1/tot))
  where: ['abs(aa - ee) >= 3', 'min(r1*c1, r1*c2, r1*c3, r2*c1, r2*c2, r2*c3)/tot >= 5']
  prompt: |-
    A random sample of passengers is classified by ticket type and by line:

    | | Single | Return | Pass | Total |
    |---|---|---|---|---|
    | Line A | {aa} | {ab} | {ac} | {r1} |
    | Line B | {ba} | {bb} | {bc} | {r2} |
    | Total | {c1} | {c2} | {c3} | {tot} |

    Find the adjusted residual for the cell Line A, Single (2 decimals).
  answers:
    - {name: adj, label: 'Adjusted residual', tolerance: 0.01, format: num2}
  solution: |-
    Expected count: $E = {r1} \times {c1}/{tot} = {ee:num4}$. Then
    $\dfrac{O - E}{\sqrt{E(1 - {r1}/{tot})(1 - {c1}/{tot})}} = \dfrac{{aa} - {ee:num4}}{\sqrt{{ee:num4}(1 - {r1}/{tot})(1 - {c1}/{tot})}} =$ **{adj:num2}**.
    (The standardized residual $(O - E)/\sqrt{E}$ is only {std:num2}.)

- id: stat-m9-r2-cramers-v
  title: Chi-square and Cramér's V
  topic: Chi-square follow-up
  vars:
    aa: {min: 8, max: 70}
    ab: {min: 8, max: 70}
    ac: {min: 8, max: 70}
    ba: {min: 8, max: 70}
    bb: {min: 8, max: 70}
    bc: {min: 8, max: 70}
  calc:
    r1: aa + ab + ac
    r2: ba + bb + bc
    c1: aa + ba
    c2: ab + bb
    c3: ac + bc
    tot: r1 + r2
    eaa: r1*c1/tot
    eab: r1*c2/tot
    eac: r1*c3/tot
    eba: r2*c1/tot
    ebb: r2*c2/tot
    ebc: r2*c3/tot
    chi: (aa - eaa)^2/eaa + (ab - eab)^2/eab + (ac - eac)^2/eac + (ba - eba)^2/eba + (bb - ebb)^2/ebb + (bc - ebc)^2/ebc
    vv: sqrt(chi/tot)
  where: ['min(eaa, eab, eac, eba, ebb, ebc) >= 5', 'chi > 1']
  prompt: |-
    A random sample of commuters is classified by shift and by how they get to work:

    | | Train | Bus | Car |
    |---|---|---|---|
    | Day shift | {aa} | {ab} | {ac} |
    | Night shift | {ba} | {bb} | {bc} |

    Find $\chi^2$ for a test of independence (2 decimals) and Cramér's V (3 decimals).
  answers:
    - {name: chi, label: '$\chi^2 =$', tolerance: 0.03, format: num2}
    - {name: vv, label: '$V =$', tolerance: 0.002, format: dp3}
  solution: |-
    Totals: rows {r1}, {r2}; columns {c1}, {c2}, {c3}; grand {tot}. Expected counts: {eaa:num2},
    {eab:num2}, {eac:num2} (day) and {eba:num2}, {ebb:num2}, {ebc:num2} (night).
    $\chi^2 = \sum (O - E)^2/E =$ **{chi:num2}**. The table is 2 × 3, so $\min(r - 1, c - 1) = 1$ and
    $V = \sqrt{{chi:num2}/{tot}} =$ **{vv:dp3}**.

- id: stat-m9-r2-fisher
  title: Fisher's exact test (one-sided)
  topic: Chi-square follow-up
  vars:
    n1: {min: 6, max: 12}
    n2: {min: 6, max: 12}
    kk: {min: 4, max: 9}
    a: {min: 0, max: 2}
  funcs:
    h(j): nCr(n1, j)*nCr(n2, kk - j)/nCr(n1 + n2, kk)
  calc:
    tot: n1 + n2
    b: n1 - a
    c: kk - a
    d: n2 - c
    nk: tot - kk
    p0: h(0)
    p1: h(1)
    p2: h(2)
    pv: h(0) + if(a >= 1, h(1), 0) + if(a >= 2, h(2), 0)
  where: ['kk <= n2', 'c <= n2', 'a < n1*kk/tot - 1', 'pv < 0.3', 'min(n1, n2)*min(kk, nk)/tot < 5']
  prompt: |-
    A new part is fitted to {n1} randomly chosen machines and the old part to {n2} others. Failures:

    | | Failed | Did not fail | Total |
    |---|---|---|---|
    | New | {a} | {b} | {n1} |
    | Old | {c} | {d} | {n2} |
    | Total | {kk} | {nk} | {tot} |

    Some expected counts are below 5, so use Fisher's exact test of $H_a$: the new part fails less
    often. Find the p-value (4 decimals).
  answers:
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    With the margins fixed, the number of new-part failures $A$ is hypergeometric:
    $P(A = j) = \dfrac{\binom{{n1}}{j}\binom{{n2}}{{kk} - j}}{\binom{{tot}}{{kk}}}$.
    Tables at least as extreme as the observed one have $A \le {a}$. $P(A = 0) = {p0:num4}$,
    $P(A = 1) = {p1:num4}$, $P(A = 2) = {p2:num4}$; add those with $j \le {a}$: p-value $=$ **{pv:num4}**.

# ---- 39h3: confidence and prediction intervals for regression
- id: stat-m9-r2-mean-ci
  title: Confidence interval for a mean response
  topic: Regression intervals
  vars:
    nn: {min: 10, max: 30}
    xbar: {min: 10, max: 50}
    sx: {min: 2, max: 10}
    aa: {min: -5, max: 20, step: 0.5}
    bb: {min: 0.2, max: 3, step: 0.05}
    sres: {min: 0.5, max: 5, step: 0.1}
    k: {min: -15, max: 15}
  where: ['abs(k) <= 2*sx', 'aa != 0', 'abs(bb - 1) > 0.01']
  calc:
    xs: xbar + k
    yh: aa + bb*xs
    dfree: nn - 2
    nm1: nn - 1
    ts: invt(0.975, dfree)
    sem: sres*sqrt(1/nn + k^2/((nn - 1)*sx^2))
    lo: yh - ts*sem
    hi: yh + ts*sem
  prompt: |-
    A regression on $n = {nn}$ points gives $\hat{y} = {aa} + {bb}x$, with $\bar{x} = {xbar}$,
    $s_x = {sx}$ and residual SD $s = {sres}$. Find a 95% confidence interval for the mean response at
    $x^* = {xs}$ (endpoints to 2 decimals).
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.015, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.015, format: num2}
  solution: |-
    $\hat{y} = {aa} + {bb}({xs}) = {yh:num4}$. $SE_{\hat{\mu}} = {sres}\sqrt{\dfrac{1}{{nn}} + \dfrac{({xs} - {xbar})^2}{{nm1}({sx})^2}} = {sem:num4}$.
    df $= {dfree}$, $t^* = {ts:dp3}$. Interval: ${yh:num4} \pm {ts:dp3}({sem:num4})$, from **{lo:num2}** to **{hi:num2}**.

- id: stat-m9-r2-pred-int
  title: Prediction interval for one new value
  topic: Regression intervals
  vars:
    nn: {min: 10, max: 30}
    xbar: {min: 10, max: 50}
    sx: {min: 2, max: 10}
    aa: {min: -5, max: 20, step: 0.5}
    bb: {min: 0.2, max: 3, step: 0.05}
    sres: {min: 0.5, max: 5, step: 0.1}
    k: {min: -15, max: 15}
  where: ['abs(k) <= 2*sx', 'aa != 0', 'abs(bb - 1) > 0.01']
  calc:
    xs: xbar + k
    yh: aa + bb*xs
    dfree: nn - 2
    nm1: nn - 1
    ts: invt(0.975, dfree)
    sep: sres*sqrt(1 + 1/nn + k^2/((nn - 1)*sx^2))
    lo: yh - ts*sep
    hi: yh + ts*sep
  prompt: |-
    A regression on $n = {nn}$ points gives $\hat{y} = {aa} + {bb}x$, with $\bar{x} = {xbar}$,
    $s_x = {sx}$ and residual SD $s = {sres}$. Find a 95% prediction interval for one new observation
    at $x^* = {xs}$ (endpoints to 2 decimals).
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.015, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.015, format: num2}
  solution: |-
    $\hat{y} = {aa} + {bb}({xs}) = {yh:num4}$. $SE_{\text{pred}} = {sres}\sqrt{1 + \dfrac{1}{{nn}} + \dfrac{({xs} - {xbar})^2}{{nm1}({sx})^2}} = {sep:num4}$.
    df $= {dfree}$, $t^* = {ts:dp3}$. Interval: ${yh:num4} \pm {ts:dp3}({sep:num4})$, from **{lo:num2}** to **{hi:num2}**.

- id: stat-m9-r2-corr-t
  title: t test for a correlation
  topic: Regression intervals
  vars:
    r: {min: -0.9, max: 0.9, step: 0.01}
    nn: {min: 6, max: 60}
  where: ['abs(r) >= 0.1', 'pv > 0.0001']
  calc:
    dfree: nn - 2
    tt: r*sqrt(nn - 2)/sqrt(1 - r^2)
    pv: 2*(1 - tcdf(abs(tt), dfree))
  prompt: |-
    A random sample of {nn} pairs has correlation $r = {r}$. Test $H_0: \rho = 0$ against
    $H_a: \rho \ne 0$. Find $t$ (3 decimals, with its sign) and the p-value (4 decimals).
  answers:
    - {name: tt, label: '$t =$', tolerance: 0.002, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    $t = \dfrac{r\sqrt{n - 2}}{\sqrt{1 - r^2}} = \dfrac{{r}\sqrt{{dfree}}}{\sqrt{1 - ({r})^2}} =$ **{tt:dp3}**, df $= {dfree}$.
    Two-sided p-value $= 2P(t_{{dfree}} \ge |{tt:dp3}|) \approx$ **{pv:num4}**.
