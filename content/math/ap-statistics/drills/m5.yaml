- id: stat-union
  title: General addition rule
  topic: Probability rules
  vars:
    pa: {min: 0.2, max: 0.7, step: 0.01}
    pb: {min: 0.1, max: 0.6, step: 0.01}
    pab: {min: 0.02, max: 0.4, step: 0.01}
  where: ['pab < pa', 'pab < pb', 'pa + pb - pab <= 1']
  calc:
    pu: pa + pb - pab
    pn: 1 - pu
  prompt: |-
    For events $A$ and $B$, $P(A) = {pa}$, $P(B) = {pb}$ and $P(A \cap B) = {pab}$. Find
    $P(A \cup B)$ and the probability that **neither** event occurs.
  answers:
    - {name: pu, label: '$P(A \cup B) =$', tolerance: 0.0001}
    - {name: pn, label: 'Neither', tolerance: 0.0001}
  solution: |-
    $P(A \cup B) = P(A) + P(B) - P(A \cap B) = {pa} + {pb} - {pab} =$ **{pu}**.
    Neither $= 1 - P(A \cup B) =$ **{pn}**.

- id: stat-venn-regions
  title: Fill in a Venn diagram
  topic: Probability rules
  vars:
    pa: {min: 0.2, max: 0.7, step: 0.01}
    pb: {min: 0.1, max: 0.6, step: 0.01}
    pu: {min: 0.3, max: 0.95, step: 0.01}
  where: ['pu >= pa', 'pu >= pb', 'pu < pa + pb', 'pa + pb - pu < min(pa, pb)']
  calc:
    pab: pa + pb - pu
    aonly: pa - pab
    bonly: pb - pab
  prompt: |-
    At a rail yard, $P(\text{crew A on duty}) = {pa}$, $P(\text{crew B on duty}) = {pb}$ and
    $P(\text{A or B on duty}) = {pu}$. Find the probability that both crews are on duty, and
    the probability that **only** crew A is on duty.
  figure:
    type: shape
    polygons:
      - points: [[0, 0], [10, 0], [10, 6], [0, 6]]
    circles:
      - {center: [3.8, 3], r: 2.2, fill: true, color: '#2c5e8f'}
      - {center: [6.2, 3], r: 2.2, fill: true, color: '#c2570c'}
    labels:
      - {at: [2.6, 3.1], text: 'A only'}
      - {at: [5, 3.1], text: 'both'}
      - {at: [7.4, 3.1], text: 'B only'}
  answers:
    - {name: pab, label: 'Both', tolerance: 0.0001}
    - {name: aonly, label: 'A only', tolerance: 0.0001}
  solution: |-
    Rearrange the addition rule: $P(A \cap B) = P(A) + P(B) - P(A \cup B) = {pa} + {pb} - {pu} =$
    **{pab}**. A only $= P(A) - P(A \cap B) = {pa} - {pab} =$ **{aonly}**.

- id: stat-cond-table
  title: Conditional probability from a table
  topic: Conditional probability
  vars:
    aa: {min: 10, max: 90}
    ab: {min: 10, max: 90}
    ba: {min: 10, max: 90}
    bb: {min: 10, max: 90}
    q: {choices: [{label: '$P(\text{late} \mid \text{rain})$', value: 1}, {label: '$P(\text{rain} \mid \text{late})$', value: 2}, {label: '$P(\text{late} \mid \text{no rain})$', value: 3}, {label: '$P(\text{no rain} \mid \text{on time})$', value: 4}]}
  calc:
    tot: aa + ab + ba + bb
    rr: aa + ab
    nr: ba + bb
    lt: aa + ba
    ot: ab + bb
    num: if(q == 1, aa, if(q == 2, aa, if(q == 3, ba, bb)))
    den: if(q == 1, rr, if(q == 2, lt, if(q == 3, nr, ot)))
    pr: num/den
  prompt: |-
    Records for {tot} commuter trains:

    | | Late | On time | Total |
    |---|---|---|---|
    | Rain | {aa} | {ab} | {rr} |
    | No rain | {ba} | {bb} | {nr} |
    | Total | {lt} | {ot} | {tot} |

    A train is chosen at random. Find {q} to 4 decimal places.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    Restrict to the "given" row or column (total {den}) and take the matching cell ({num}):
    $\dfrac{{num}}{{den}} =$ **{pr:num4}**.

- id: stat-indep-atleast
  title: At least one (independent trials)
  topic: Conditional probability
  vars:
    pf: {min: 0.01, max: 0.2, step: 0.01}
    nn: {min: 3, max: 25}
  calc:
    none: (1 - pf)^nn
    atl: 1 - none
    qq: 1 - pf
  prompt: |-
    Each of {nn} independent sensors fails during a storm with probability {pf}. What is the
    probability that **at least one** sensor fails? Give 4 decimal places.
  answers:
    - {name: atl, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    $P(\text{none fail}) = (1 - {pf})^{{nn}} = {qq}^{{nn}} = {none:num4}$, so
    $P(\text{at least one}) = 1 - {none:num4} =$ **{atl:num4}**.

- id: stat-tree-total
  title: Total probability from a tree
  topic: Bayes' theorem
  vars:
    sa: {min: 20, max: 60}
    sb: {min: 10, max: 50}
    da: {min: 1, max: 8}
    db: {min: 1, max: 8}
    dc: {min: 1, max: 8}
  where: ['sa + sb <= 90']
  calc:
    sc: 100 - sa - sb
    pd: (sa*da + sb*db + sc*dc)/10000
    ta: sa*da/10000
    tb: sb*db/10000
    tc: sc*dc/10000
  prompt: |-
    A factory gets a component from three suppliers: {sa}% from A, {sb}% from B and {sc}%
    from C. Their defect rates are {da}%, {db}% and {dc}%. What is the probability that a
    randomly chosen component is defective? Give 4 decimal places.
  answers:
    - {name: pd, label: '$P(\text{defective}) =$', tolerance: 0.00006, format: num4}
  solution: |-
    Multiply along each path and add: ${ta:num4} + {tb:num4} + {tc:num4} =$ **{pd:num4}**.
    (For example, path A: ${sa}\% \times {da}\% = {ta:num4}$.)

- id: stat-bayes
  title: Bayes' theorem (screening test)
  topic: Bayes' theorem
  vars:
    prev: {choices: [0.001, 0.005, 0.01, 0.02, 0.03, 0.05, 0.1, 0.2]}
    sens: {min: 0.8, max: 0.99, step: 0.01}
    spec: {min: 0.8, max: 0.99, step: 0.01}
  calc:
    tp: prev*sens
    fp: (1 - prev)*(1 - spec)
    ppos: tp + fp
    post: tp/ppos
    fpr: 1 - spec
    npv: 1 - prev
  prompt: |-
    A condition has prevalence {prev:num4}. A test has sensitivity {sens} (positive when the
    condition is present) and specificity {spec} (negative when it is absent). A randomly
    chosen person tests positive. What is the probability they have the condition?
    Give 4 decimal places.
  answers:
    - {name: post, label: '$P(D \mid +) =$', tolerance: 0.0006, format: num4}
  solution: |-
    True positives: ${prev:num4} \times {sens} = {tp:sig4}$. False positives:
    ${npv:num4} \times {fpr:num4} = {fp:sig4}$. $P(+) = {ppos:sig4}$.
    $P(D \mid +) = \dfrac{{tp:sig4}}{{ppos:sig4}} =$ **{post:num4}**.

- id: stat-perm
  title: Permutations
  topic: Counting
  vars:
    nn: {min: 5, max: 15}
    rr: {min: 2, max: 5}
  where: ['rr < nn']
  calc:
    ans: nPr(nn, rr)
  prompt: |-
    In a contest with {nn} entrants, a different prize is awarded to each of the top {rr}
    places (no ties). How many different prize outcomes are possible?
  answers:
    - {name: ans, label: 'Number', tolerance: 0.001}
  solution: |-
    Order matters, so use a permutation: $_{{nn}}P_{{rr}} = \dfrac{{nn}!}{({nn} - {rr})!} =$ **{ans:int}**.

- id: stat-comb
  title: Combinations
  topic: Counting
  vars:
    nn: {min: 6, max: 25}
    rr: {min: 2, max: 6}
  where: ['rr < nn']
  calc:
    ans: nCr(nn, rr)
  prompt: |-
    How many different {rr}-person committees can be formed from {nn} people?
  answers:
    - {name: ans, label: 'Number', tolerance: 0.001}
  solution: |-
    Order doesn't matter: $\binom{{nn}}{{rr}} = \dfrac{{nn}!}{{rr}!\,({nn} - {rr})!} =$ **{ans:int}**.

- id: stat-comb-prob
  title: Probability by counting (hypergeometric)
  topic: Counting
  vars:
    bigk: {min: 3, max: 8}
    good: {min: 6, max: 15}
    nn: {min: 3, max: 6}
    kk: {min: 1, max: 4}
  where: ['kk <= bigk', 'kk <= nn', 'nn - kk <= good']
  calc:
    tot: bigk + good
    rest: nn - kk
    fav: nCr(bigk, kk)*nCr(good, nn - kk)
    all: nCr(tot, nn)
    pr: fav/all
  prompt: |-
    A bin holds {tot} parts: {bigk} defective and {good} good. An inspector picks {nn} parts at
    random without replacement. What is the probability that **exactly {kk}** are defective?
    Give 4 decimal places.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    Favorable: $\binom{{bigk}}{{kk}}\binom{{good}}{{rest}} = {fav:dp0}$. Total:
    $\binom{{tot}}{{nn}} = {all:dp0}$. Probability $= {fav:dp0}/{all:dp0} =$ **{pr:num4}**.
