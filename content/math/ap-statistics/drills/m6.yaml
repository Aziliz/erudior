- id: stat-ev
  title: Expected value of a discrete distribution
  topic: Discrete random variables
  vars:
    v1: {min: 0, max: 2}
    g2: {min: 1, max: 3}
    g3: {min: 1, max: 3}
    g4: {min: 1, max: 4}
    p1: {min: 0.05, max: 0.5, step: 0.05}
    p2: {min: 0.05, max: 0.5, step: 0.05}
    p3: {min: 0.05, max: 0.5, step: 0.05}
  calc:
    v2: v1 + g2
    v3: v2 + g3
    v4: v3 + g4
    p4: round(1 - p1 - p2 - p3, 2)
    mu: v1*p1 + v2*p2 + v3*p3 + v4*p4
  where: ['p4 >= 0.05']
  prompt: |-
    A random variable $X$ has this distribution:

    | $x$ | {v1} | {v2} | {v3} | {v4} |
    |---|---|---|---|---|
    | $P(X = x)$ | {p1} | {p2} | {p3} | {p4} |

    Find $E(X)$.
  answers:
    - {name: mu, label: '$\mu_X =$', tolerance: 0.001, format: num4}
  solution: |-
    $\mu_X = \sum x_i p_i = {v1}({p1}) + {v2}({p2}) + {v3}({p3}) + {v4}({p4}) =$ **{mu:num4}**.

- id: stat-rv-sd
  title: Standard deviation of a discrete distribution
  topic: Discrete random variables
  vars:
    p0: {min: 0.1, max: 0.5, step: 0.05}
    p1: {min: 0.1, max: 0.5, step: 0.05}
    p2: {min: 0.05, max: 0.4, step: 0.05}
  calc:
    p3: round(1 - p0 - p1 - p2, 2)
    mu: p1 + 2*p2 + 3*p3
    ex2: p1 + 4*p2 + 9*p3
    var: ex2 - mu^2
    sd: sqrt(var)
  where: ['p3 >= 0.05']
  prompt: |-
    The number of late trains $X$ on a route per day has distribution

    | $x$ | 0 | 1 | 2 | 3 |
    |---|---|---|---|---|
    | $P(X = x)$ | {p0} | {p1} | {p2} | {p3} |

    Find the mean and standard deviation of $X$ (4 decimals).
  answers:
    - {name: mu, label: '$\mu_X =$', tolerance: 0.001, format: num4}
    - {name: sd, label: '$\sigma_X =$', tolerance: 0.001, format: num4}
  solution: |-
    $\mu_X = 0({p0}) + 1({p1}) + 2({p2}) + 3({p3}) =$ **{mu:num4}**.
    $E(X^2) = 0 + 1({p1}) + 4({p2}) + 9({p3}) = {ex2:num4}$, so
    $\sigma_X^2 = {ex2:num4} - ({mu:num4})^2 = {var:num4}$ and $\sigma_X =$ **{sd:num4}**.

- id: stat-ev-game
  title: Expected net gain of a game
  topic: Discrete random variables
  vars:
    cost: {min: 1, max: 10}
    big: {choices: [20, 25, 50, 100, 200]}
    pbig: {choices: [0.01, 0.02, 0.04, 0.05, 0.1]}
    small: {min: 2, max: 15}
    psmall: {choices: [0.1, 0.15, 0.2, 0.25, 0.3]}
  calc:
    pnone: 1 - pbig - psmall
    gain: pbig*(big - cost) + psmall*(small - cost) + pnone*(0 - cost)
    nb: big - cost
    ns: small - cost
  prompt: |-
    A carnival game costs \${cost} to play. You win a \${big} prize with probability {pbig}, a
    \${small} prize with probability {psmall}, and nothing otherwise. What is your expected
    **net** gain per game (negative if you lose on average)? Give dollars to the cent.
  answers:
    - {name: gain, label: 'Net gain (dollars)', tolerance: 0.006, format: num2}
  solution: |-
    Net outcomes: ${nb}$ with probability {pbig}, ${ns}$ with probability {psmall}, and
    $-{cost}$ with probability {pnone:num4}. Expected net gain
    $= {nb}({pbig}) + ({ns})({psmall}) + (-{cost})({pnone:num4}) =$ **{gain:num2}** dollars.

- id: stat-linear-rv
  title: Mean and SD of a + bX
  topic: Combining random variables
  vars:
    mx: {min: 5, max: 60}
    sx: {min: 1, max: 12}
    fee: {min: 10, max: 100, step: 5}
    rate: {choices: [1.5, 2, 2.5, 3, 4, 5, 12, 15]}
  calc:
    my: fee + rate*mx
    sy: rate*sx
  prompt: |-
    The number of hours $X$ a repair takes has mean {mx} and standard deviation {sx}. The bill
    is $C = {fee} + {rate}X$ dollars. Find the mean and standard deviation of $C$.
  answers:
    - {name: my, label: '$\mu_C =$', tolerance: 0.01}
    - {name: sy, label: '$\sigma_C =$', tolerance: 0.01}
  solution: |-
    $\mu_C = {fee} + {rate}({mx}) =$ **{my}**. The fixed {fee} doesn't change spread:
    $\sigma_C = {rate}({sx}) =$ **{sy}**.

- id: stat-combine-rv
  title: Mean and SD of a sum or difference
  topic: Combining random variables
  vars:
    mx: {min: 10, max: 80}
    sx: {min: 2, max: 15}
    my: {min: 10, max: 80}
    sy: {min: 2, max: 15}
    op: {choices: [{label: '$X + Y$', value: 1}, {label: '$X - Y$', value: -1}]}
  calc:
    mt: mx + op*my
    st: sqrt(sx^2 + sy^2)
    vt: sx^2 + sy^2
  prompt: |-
    $X$ and $Y$ are **independent** with $\mu_X = {mx}$, $\sigma_X = {sx}$, $\mu_Y = {my}$,
    $\sigma_Y = {sy}$. Find the mean and standard deviation of {op} (SD to 3 decimals).
  answers:
    - {name: mt, label: 'Mean', tolerance: 0.001}
    - {name: st, label: 'SD', tolerance: 0.002, format: dp3}
  solution: |-
    Means combine directly: mean of {op} $=$ **{mt}**. For independent variables the
    variances add (for sums *and* differences): ${sx}^2 + {sy}^2 = {vt}$, so
    SD $= \sqrt{{vt}} \approx$ **{st:dp3}**.

- id: stat-binom-pdf
  title: Binomial probability P(X = k)
  topic: Binomial distribution
  vars:
    nn: {min: 5, max: 20}
    pp: {choices: [0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9]}
    kk: {min: 0, max: 12}
  where: ['kk <= nn', 'binompdf(nn, pp, kk) > 0.005']
  calc:
    pr: binompdf(nn, pp, kk)
    co: nCr(nn, kk)
    nk: nn - kk
    qq: 1 - pp
  prompt: |-
    A machine produces parts that independently fail inspection with probability {pp}. In a
    sample of {nn} parts, what is the probability that **exactly {kk}** fail? Give 4 decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    $X \sim B({nn}, {pp})$. $P(X = {kk}) = \binom{{nn}}{{kk}}({pp})^{{kk}}({qq})^{{nk}} = {co:dp0} \times ({pp})^{{kk}}({qq})^{{nk}} =$ **{pr:num4}**.

- id: stat-binom-cdf
  title: Binomial cumulative probability
  topic: Binomial distribution
  vars:
    nn: {min: 8, max: 30}
    pp: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7]}
    kk: {min: 1, max: 15}
    kind: {choices: [{label: 'at most', value: 1}, {label: 'at least', value: 2}, {label: 'fewer than', value: 3}, {label: 'more than', value: 4}]}
  where: ['kk < nn', 'pr > 0.01', 'pr < 0.99']
  calc:
    km1: kk - 1
    pr: if(kind == 1, binomcdf(nn, pp, kk), if(kind == 2, 1 - binomcdf(nn, pp, kk - 1), if(kind == 3, binomcdf(nn, pp, kk - 1), 1 - binomcdf(nn, pp, kk))))
    how: if(kind == 1, kk, if(kind == 2, kk - 1, if(kind == 3, kk - 1, kk)))
    cdfv: binomcdf(nn, pp, how)
  prompt: |-
    Each of {nn} independent trials succeeds with probability {pp}. Find the probability of
    **{kind} {kk}** successes. Give 4 decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    $X \sim B({nn}, {pp})$. Translate "{kind} {kk}" into the cumulative probability
    $P(X \le {how}) = {cdfv:num4}$ (binomcdf({nn}, {pp}, {how})). Use it directly for "at most"
    or "fewer than", or subtract it from 1 for "at least" or "more than". Result: **{pr:num4}**.

- id: stat-binom-mean-sd
  title: Binomial mean and standard deviation
  topic: Binomial distribution
  vars:
    nn: {min: 10, max: 500, step: 10}
    pp: {min: 0.05, max: 0.95, step: 0.05}
  calc:
    mu: nn*pp
    sd: sqrt(nn*pp*(1 - pp))
    qq: 1 - pp
  prompt: |-
    A survey contacts {nn} randomly chosen people; each independently agrees to participate
    with probability {pp}. Find the mean and standard deviation of the number who agree
    (SD to 3 decimals).
  answers:
    - {name: mu, label: '$\mu =$', tolerance: 0.01}
    - {name: sd, label: '$\sigma =$', tolerance: 0.002, format: dp3}
  solution: |-
    $\mu = np = {nn}({pp}) =$ **{mu}**; $\sigma = \sqrt{np(1-p)} = \sqrt{{nn}({pp})({qq})} =$ **{sd:dp3}**.

- id: stat-geom
  title: Geometric probability
  topic: Geometric distribution
  vars:
    pp: {choices: [0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5]}
    kk: {min: 1, max: 10}
  calc:
    pr: geompdf(pp, kk)
    km1: kk - 1
    qq: 1 - pp
    mu: 1/pp
  prompt: |-
    A salesperson makes independent calls; each results in a sale with probability {pp}. What
    is the probability the **first** sale is on call {kk}? Also give the expected number of
    calls until the first sale. (Probability to 4 decimals.)
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
    - {name: mu, label: 'Expected calls', tolerance: 0.01}
  solution: |-
    $P(X = {kk}) = (1 - p)^{k-1}p = ({qq})^{{km1}}({pp}) =$ **{pr:num4}**. Mean
    $\mu = 1/p = 1/{pp} =$ **{mu}** calls.

- id: stat-geom-cdf
  title: Geometric "within k trials"
  topic: Geometric distribution
  vars:
    pp: {choices: [0.02, 0.05, 0.08, 0.1, 0.12, 0.15, 0.2, 0.25]}
    kk: {min: 2, max: 20}
  calc:
    pr: geomcdf(pp, kk)
    qq: 1 - pp
    tail: qq^kk
  prompt: |-
    A tester runs independent trials of a system; each trial reveals the bug with probability
    {pp}. What is the probability the bug is found **within the first {kk} trials**? Give 4
    decimals.
  answers:
    - {name: pr, label: 'Probability', tolerance: 0.0006, format: num4}
  solution: |-
    Not found in {kk} trials means {kk} straight failures: $({qq})^{{kk}} = {tail:num4}$. So
    $P(X \le {kk}) = 1 - {tail:num4} =$ **{pr:num4}**.
