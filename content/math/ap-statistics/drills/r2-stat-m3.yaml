# Round 2, module stat-m3 (Two-variable data): drills for the three honors lessons.

# ---- Honors: the mathematics of least squares
- id: stat-m3-r2-ss-decomp
  title: Split SST into SSR and SSE
  topic: Least-squares theory
  vars:
    x1: {min: 1, max: 3}
    x2: {min: 3, max: 5}
    x3: {min: 5, max: 7}
    x4: {min: 7, max: 9}
    x5: {min: 9, max: 12}
    y1: {min: 1, max: 15}
    y2: {min: 1, max: 15}
    y3: {min: 1, max: 15}
    y4: {min: 1, max: 15}
    y5: {min: 1, max: 15}
  calc:
    mx: (x1 + x2 + x3 + x4 + x5) / 5
    my: (y1 + y2 + y3 + y4 + y5) / 5
    sxy: (x1-mx)*(y1-my) + (x2-mx)*(y2-my) + (x3-mx)*(y3-my) + (x4-mx)*(y4-my) + (x5-mx)*(y5-my)
    sxx: (x1-mx)^2 + (x2-mx)^2 + (x3-mx)^2 + (x4-mx)^2 + (x5-mx)^2
    sst: (y1-my)^2 + (y2-my)^2 + (y3-my)^2 + (y4-my)^2 + (y5-my)^2
    bb: sxy / sxx
    ssr: sxy^2 / sxx
    sse: sst - ssr
    r2: ssr / sst
  where: ['sst > 0', 'r2 >= 0.1', 'r2 <= 0.95', 'x1 < x2', 'x2 < x3', 'x3 < x4', 'x4 < x5']
  prompt: |-
    For the points $({x1}, {y1}),\ ({x2}, {y2}),\ ({x3}, {y3}),\ ({x4}, {y4}),\ ({x5}, {y5})$,
    split the total sum of squares $\text{SST} = \sum (y - \bar{y})^2$ into the regression sum of
    squares SSR and the residual sum of squares SSE of the least-squares line. Give SSR and SSE
    to 2 decimal places and $r^2$ to 3 decimal places.
  answers:
    - {name: ssr, label: 'SSR', tolerance: 0.02, format: dp2}
    - {name: sse, label: 'SSE', tolerance: 0.02, format: dp2}
    - {name: r2, label: '$r^2 =$', tolerance: 0.001, format: dp3}
  solution: |-
    $\bar{x} = {mx:num4}$, $\bar{y} = {my:num4}$, $S_{xy} = {sxy:num4}$, $S_{xx} = {sxx:num4}$, and
    $\text{SST} = S_{yy} = {sst:num4}$. The slope is $b = S_{xy}/S_{xx} = {bb:num4}$, so
    $\text{SSR} = b^2 S_{xx} = S_{xy}^2/S_{xx} =$ **{ssr:dp2}**. Then
    $\text{SSE} = \text{SST} - \text{SSR} =$ **{sse:dp2}**, and
    $r^2 = \text{SSR}/\text{SST} =$ **{r2:dp3}**.

- id: stat-m3-r2-sse-summary
  title: SSE and s from summary statistics
  topic: Least-squares theory
  vars:
    nn: {min: 8, max: 40}
    sy: {min: 2, max: 20}
    rr: {min: -0.95, max: 0.95, step: 0.05}
  where: ['abs(rr) >= 0.2']
  calc:
    sst: (nn - 1)*sy^2
    sse: sst*(1 - rr^2)
    sres: sqrt(sse/(nn - 2))
    dfr: nn - 2
    df1: nn - 1
  prompt: |-
    A least-squares regression on $n = {nn}$ points has $s_y = {sy}$ and $r = {rr}$. Find the
    residual sum of squares SSE (1 decimal place) and the standard deviation of the residuals $s$
    (2 decimal places).
  answers:
    - {name: sse, label: 'SSE', tolerance: 0.06, format: dp1}
    - {name: sres, label: '$s =$', tolerance: 0.006, format: dp2}
  solution: |-
    $\text{SST} = (n - 1)s_y^2 = {df1} \times {sy}^2 = {sst}$. Since $\text{SSE} = \text{SST}(1 - r^2)$,
    $\text{SSE} = {sst}(1 - ({rr})^2) =$ **{sse:dp1}**. Then
    $s = \sqrt{\text{SSE}/(n - 2)} = \sqrt{{sse:num4}/{dfr}} =$ **{sres:dp2}**.

# ---- Honors: regression to the mean
- id: stat-m3-r2-retest
  title: Predict a retest score
  topic: Regression to the mean
  vars:
    mu: {choices: [50, 70, 100]}
    sd: {choices: [8, 10, 12, 15]}
    dev: {min: -30, max: 30}
    rr: {min: 0.3, max: 0.9, step: 0.05}
  where: ['abs(dev) >= 8', 'abs(dev) <= 2.5*sd', 'mu + dev > 0']
  calc:
    xs: mu + dev
    pred: mu + rr*dev
    closer: (1 - rr)*abs(dev)
    zx: dev/sd
    zy: rr*dev/sd
    ad: abs(dev)
  prompt: |-
    A test and a retest both have mean {mu} and standard deviation {sd}, and scores on the two
    have correlation $r = {rr}$. A student scored {xs} on the first test. Use the least-squares
    line to predict the student's retest score, and find how many points closer to the mean the
    prediction is than the first score. Give both to 1 decimal place.
  answers:
    - {name: pred, label: 'Predicted retest', tolerance: 0.06, format: dp1}
    - {name: closer, label: 'Points closer to the mean', tolerance: 0.06, format: dp1}
  solution: |-
    The first score is $z = ({xs} - {mu})/{sd} = {zx:num4}$. The line predicts
    $\hat{z} = r z = {rr} \times ({zx:num4}) = {zy:num4}$, so the predicted retest is
    ${mu} + ({zy:num4})({sd}) =$ **{pred:dp1}**. (With equal SDs this is just
    ${mu} + {rr}({xs} - {mu})$.) The first score was {ad} points from the mean; the prediction is
    ${rr} \times {ad}$ points from it, which is **{closer:dp1}** points closer.

- id: stat-m3-r2-two-lines
  title: The two regression slopes
  topic: Regression to the mean
  vars:
    rr: {min: -0.95, max: 0.95, step: 0.05}
    sx: {min: 2, max: 20}
    sy: {min: 2, max: 20}
  where: ['abs(rr) >= 0.2', 'sx != sy']
  calc:
    byx: rr*sy/sx
    bxy: rr*sx/sy
    prod: byx*bxy
  prompt: |-
    Two variables have $r = {rr}$, $s_x = {sx}$ and $s_y = {sy}$. Find the slope of the
    least-squares line for predicting $y$ from $x$, and the slope of the line for predicting $x$
    from $y$ (3 decimal places each).
  answers:
    - {name: byx, label: '$y$ from $x$: slope', tolerance: 0.0006, format: dp3}
    - {name: bxy, label: '$x$ from $y$: slope', tolerance: 0.0006, format: dp3}
  solution: |-
    Predicting $y$ from $x$: $b = r\,s_y/s_x = {rr} \times {sy}/{sx} =$ **{byx:dp3}**.
    Predicting $x$ from $y$: $b = r\,s_x/s_y = {rr} \times {sx}/{sy} =$ **{bxy:dp3}**.
    Check: the product is ${prod:num4} = r^2$. The second slope is not the reciprocal of the
    first.

# ---- Honors: relative risk, odds ratios and standardization
- id: stat-m3-r2-rr-or
  title: Relative risk and odds ratio
  topic: Relative risk and odds ratios
  vars:
    aa: {min: 5, max: 60}
    bb: {min: 40, max: 300}
    cc: {min: 5, max: 60}
    dd: {min: 40, max: 300}
  calc:
    n1: aa + bb
    n2: cc + dd
    p1: aa/n1
    p2: cc/n2
    rrisk: p1/p2
    orr: (aa*dd)/(bb*cc)
    adp: aa*dd
    bcp: bb*cc
  where: ['rrisk >= 0.2', 'rrisk <= 6', 'orr <= 10', 'abs(rrisk - 1) >= 0.1']
  prompt: |-
    A cohort study records whether people were exposed to a risk factor and whether they later
    developed a condition.

    | | Condition | No condition |
    |---|---|---|
    | Exposed | {aa} | {bb} |
    | Not exposed | {cc} | {dd} |

    Find the relative risk (exposed ÷ not exposed) and the odds ratio, each to 2 decimal places.
  answers:
    - {name: rrisk, label: 'Relative risk', tolerance: 0.01, format: dp2}
    - {name: orr, label: 'Odds ratio', tolerance: 0.01, format: dp2}
  solution: |-
    Risks: exposed ${aa}/{n1} = {p1:num4}$, not exposed ${cc}/{n2} = {p2:num4}$. Relative risk
    $= {p1:num4}/{p2:num4} =$ **{rrisk:dp2}**. Odds ratio
    $= \dfrac{ad}{bc} = \dfrac{{aa} \times {dd}}{{bb} \times {cc}} = \dfrac{{adp}}{{bcp}} =$ **{orr:dp2}**.

- id: stat-m3-r2-standardize
  title: Crude and standardized rates
  topic: Relative risk and odds ratios
  vars:
    n1: {choices: [100, 200, 300, 400, 500, 600, 800]}
    n2: {choices: [50, 100, 200, 300, 400]}
    p1: {min: 85, max: 99}
    p2: {min: 30, max: 80}
    ww: {min: 50, max: 90, step: 5}
  calc:
    s1: n1*p1/100
    s2: n2*p2/100
    crude: 100*(s1 + s2)/(n1 + n2)
    adj: ww*p1/100 + (100 - ww)*p2/100
    w2: 100 - ww
    nt: n1 + n2
    st: s1 + s2
  where: ['s1 == round(s1)', 's2 == round(s2)']
  prompt: |-
    A hospital treated {n1} mild cases, of whom {s1} survived, and {n2} severe cases, of whom {s2}
    survived. Find (a) its overall (crude) survival rate and (b) its standardized survival rate for
    a standard population that is {ww}% mild and {w2}% severe. Give both as percents to 1 decimal
    place.
  answers:
    - {name: crude, label: '(a) %', tolerance: 0.06, format: dp1}
    - {name: adj, label: '(b) %', tolerance: 0.06, format: dp1}
  solution: |-
    (a) Crude: $\dfrac{{s1} + {s2}}{{n1} + {n2}} = \dfrac{{st}}{{nt}} =$ **{crude:dp1}%**.
    (b) Stratum rates: mild ${s1}/{n1} = {p1}\%$, severe ${s2}/{n2} = {p2}\%$. Weight them by the
    standard mix and add: ${ww}\% \times {p1}\% + {w2}\% \times {p2}\% =$ **{adj:dp1}%**. The crude rate
    uses the hospital's own mix ({n1} mild to {n2} severe), so it changes with the case mix; the
    standardized rate doesn't.
