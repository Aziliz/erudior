- id: stat-strat-alloc
  title: Proportional allocation in a stratified sample
  topic: Sampling and bias
  vars:
    kk: {choices: [10, 20, 25, 40, 50]}
    m1: {min: 4, max: 40}
    m2: {min: 4, max: 40}
    m3: {min: 4, max: 40}
    pick: {choices: [{label: 'Region A', value: 1}, {label: 'Region B', value: 2}, {label: 'Region C', value: 3}]}
  calc:
    na: m1*kk
    nb: m2*kk
    nc: m3*kk
    bign: na + nb + nc
    nn: m1 + m2 + m3
    sz: if(pick == 1, na, if(pick == 2, nb, nc))
    ans: if(pick == 1, m1, if(pick == 2, m2, m3))
  prompt: |-
    A utility has {na} customers in Region A, {nb} in Region B and {nc} in Region C. It
    takes a stratified random sample of {nn} customers with proportional allocation. How
    many customers should be sampled from **{pick}**?
  answers:
    - {name: ans, label: 'Sample size', tolerance: 0.001}
  solution: |-
    Total $N = {bign:dp0}$, so the sampling fraction is $\dfrac{{nn}}{{bign:dp0}} = \dfrac{1}{{kk}}$.
    {pick} has {sz} customers: $\dfrac{{sz:dp0}}{{kk}} =$ **{ans}**.

- id: stat-systematic
  title: Systematic sample
  topic: Sampling and bias
  vars:
    nn: {choices: [20, 25, 40, 50, 80, 100]}
    kk: {min: 5, max: 40}
    st: {min: 1, max: 40}
    jj: {min: 4, max: 15}
  where: ['st <= kk']
  calc:
    bign: nn*kk
    sel: st + (jj - 1)*kk
  prompt: |-
    A quality inspector takes a 1-in-$k$ systematic sample of {nn} items from a production run
    of {bign} items. The random start is item {st}. Find $k$ and the number of the
    {jj}th item selected.
  answers:
    - {name: kk, label: '$k =$', tolerance: 0.001}
    - {name: sel, label: 'Item number', tolerance: 0.001}
  solution: |-
    $k = N/n = {bign:dp0}/{nn} =$ **{kk}**. Selected items are ${st}, {st} + {kk}, {st} + 2({kk}), \ldots$;
    the {jj}th is ${st} + ({jj} - 1)({kk}) =$ **{sel}**.

- id: stat-factorial-design
  title: Treatments in a multifactor experiment
  topic: Experimental design
  vars:
    la: {min: 2, max: 4}
    lb: {min: 2, max: 4}
    lc: {min: 2, max: 3}
    rep: {min: 3, max: 12}
  calc:
    trt: la*lb*lc
    units: trt*rep
  prompt: |-
    An experiment on concrete strength has three factors: cement type ({la} levels), curing
    temperature ({lb} levels) and additive dose ({lc} levels). Each
    treatment is applied to {rep} test cylinders. How many treatments are there, and how many
    cylinders are needed?
  answers:
    - {name: trt, label: 'Treatments', tolerance: 0.001}
    - {name: units, label: 'Cylinders', tolerance: 0.001}
  solution: |-
    A treatment is one combination of levels: ${la} \times {lb} \times {lc} =$ **{trt}**
    treatments. With {rep} cylinders each: ${trt} \times {rep} =$ **{units}** cylinders.
