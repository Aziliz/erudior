# Round 2, module stat-m1: drills for the three honors lessons.

# ---- Honors: density histograms and smoothing
- id: stat-m1-r2-density-height
  title: Height of a density-histogram bar
  topic: Density histograms and smoothing
  vars:
    ntot: {choices: [200, 250, 400, 500, 800, 1000]}
    lo: {choices: [0, 10, 15, 20, 25, 30, 40, 50]}
    wid: {choices: [2, 4, 5, 8, 10, 15, 20, 25]}
    cnt: {min: 8, max: 300}
  where: ['cnt < 0.5*ntot']
  calc:
    hi: lo + wid
    rf: cnt / ntot
    dens: rf / wid
  prompt: |-
    A histogram of {ntot} values uses bins of different widths. The bin from {lo} to {hi}
    holds {cnt} values. How tall is its bar on a **density** scale? Give 3 significant figures.
  answers:
    - {name: dens, label: 'Density', sigfigs: 3}
  solution: |-
    Relative frequency $= \dfrac{{cnt}}{{ntot}} = {rf:num4}$. The bin is ${hi} - {lo} = {wid}$ units wide,
    so the density is $\dfrac{{rf:num4}}{{wid}} =$ **{dens:sig3}** per unit. Check: height × width
    $= {rf:num4}$, the bin's share of the data.

- id: stat-m1-r2-fd-width
  title: Bin-width rules (Freedman–Diaconis and Sturges)
  topic: Density histograms and smoothing
  vars:
    ntot: {choices: [125, 216, 343, 512, 1000, 1728, 8000]}
    iqr: {min: 6, max: 60}
  calc:
    croot: cbrt(ntot)
    fd: 2 * iqr / croot
    lg: log2(ntot)
    stu: ceil(1 + lg)
  prompt: |-
    A data set has $n = {ntot}$ values and $\text{IQR} = {iqr}$. Find the bin width suggested by the
    Freedman–Diaconis rule (2 decimal places) and the number of bins suggested by Sturges' rule
    ($1 + \log_2 n$, rounded up).
  answers:
    - {name: fd, label: 'Freedman–Diaconis width', tolerance: 0.006}
    - {name: stu, label: 'Sturges bins', tolerance: 0.001}
  solution: |-
    $n^{1/3} = {croot:num4}$, so $h = 2 \cdot \text{IQR} \cdot n^{-1/3} = \dfrac{2 \times {iqr}}{{croot:num4}} =$ **{fd:dp2}**.
    Sturges: $1 + \log_2 {ntot} = 1 + {lg:num4}$, rounded up to **{stu}** bins.

- id: stat-m1-r2-kde-point
  title: Value of a kernel density estimate
  topic: Density histograms and smoothing
  vars:
    xa: {min: 1, max: 9}
    xb: {min: 1, max: 9}
    xc: {min: 1, max: 9}
    xd: {min: 1, max: 9}
    bw: {choices: [0.5, 1, 1.5, 2]}
    xq: {min: 2, max: 8}
  calc:
    ka: normpdf((xq - xa) / bw)
    kb: normpdf((xq - xb) / bw)
    kc: normpdf((xq - xc) / bw)
    kd: normpdf((xq - xd) / bw)
    ksum: ka + kb + kc + kd
    fhat: ksum / (4 * bw)
  where: ['fhat > 0.02']
  prompt: |-
    Four data values are {xa}, {xb}, {xc} and {xd}. Using a normal kernel with bandwidth
    $h = {bw}$, find the kernel density estimate $\hat{f}({xq})$. Give 3 significant figures.
  answers:
    - {name: fhat, label: '$\hat{f}$', sigfigs: 3}
  solution: |-
    Standardize each distance, $z_i = ({xq} - x_i)/{bw}$, and evaluate the standard normal curve:
    $K$ values {ka:num4}, {kb:num4}, {kc:num4}, {kd:num4}, which add to {ksum:num4}.
    Divide by $nh = 4 \times {bw}$: $\hat{f}({xq}) =$ **{fhat:sig3}**.

# ---- Honors: robust statistics
- id: stat-m1-r2-trimmed-mean
  title: Trimmed and winsorized means
  topic: Robust statistics
  vars:
    a1: {min: 2, max: 20}
    g1: {min: 5, max: 15}
    g2: {min: 0, max: 4}
    g3: {min: 0, max: 4}
    g4: {min: 0, max: 4}
    g5: {min: 0, max: 4}
    g6: {min: 0, max: 4}
    g7: {min: 0, max: 4}
    g8: {min: 0, max: 4}
    g9: {min: 15, max: 60}
  calc:
    a2: a1 + g1
    a3: a2 + g2
    a4: a3 + g3
    a5: a4 + g4
    a6: a5 + g5
    a7: a6 + g6
    a8: a7 + g7
    a9: a8 + g8
    a10: a9 + g9
    mid: a2 + a3 + a4 + a5 + a6 + a7 + a8 + a9
    tm: mid / 8
    wsum: mid + a2 + a9
    wm: wsum / 10
    mn: (mid + a1 + a10) / 10
  prompt: |-
    Ten sorted values: {a1}, {a2}, {a3}, {a4}, {a5}, {a6}, {a7}, {a8}, {a9}, {a10}.
    Find the 10% trimmed mean and the 10% winsorized mean (3 decimal places where needed).
  answers:
    - {name: tm, label: 'Trimmed mean', tolerance: 0.0006}
    - {name: wm, label: 'Winsorized mean', tolerance: 0.0006}
  solution: |-
    10% of 10 values is one value at each end. **Trimmed:** drop {a1} and {a10}; the other eight
    add to {mid}, so the trimmed mean is ${mid}/8 =$ **{tm:dp3}**. **Winsorized:** replace {a1} by
    {a2} and {a10} by {a9}; the ten values add to {wsum}, so the winsorized mean is
    ${wsum}/10 =$ **{wm:dp3}**. (The ordinary mean is {mn:dp3}, pulled up by {a10}.)

- id: stat-m1-r2-mad
  title: Median absolute deviation
  topic: Robust statistics
  vars:
    d1: {min: 10, max: 60}
    d2: {min: 10, max: 60}
    d3: {min: 10, max: 60}
    d4: {min: 10, max: 60}
    d5: {min: 10, max: 60}
    d6: {min: 10, max: 60}
    d7: {min: 10, max: 99}
  calc:
    med: median(d1, d2, d3, d4, d5, d6, d7)
    e1: abs(d1 - med)
    e2: abs(d2 - med)
    e3: abs(d3 - med)
    e4: abs(d4 - med)
    e5: abs(d5 - med)
    e6: abs(d6 - med)
    e7: abs(d7 - med)
    mad: median(e1, e2, e3, e4, e5, e6, e7)
    sig: 1.4826 * mad
  where: ['mad > 0']
  prompt: |-
    For the data {d1}, {d2}, {d3}, {d4}, {d5}, {d6}, {d7}, find the median absolute deviation
    (MAD) and the MAD-based estimate of $\sigma$, $1.4826 \times \text{MAD}$ (2 decimal places).
  answers:
    - {name: mad, label: 'MAD', tolerance: 0.001}
    - {name: sig, label: '$1.4826 \times$ MAD', tolerance: 0.006}
  solution: |-
    The median is {med}. Distances from it: {e1}, {e2}, {e3}, {e4}, {e5}, {e6}, {e7}. Sort them; the
    4th of 7 is the median distance, so $\text{MAD} =$ **{mad}**. Estimate of $\sigma$:
    $1.4826 \times {mad} =$ **{sig:dp2}**.

- id: stat-m1-r2-modified-z
  title: Modified z-score
  topic: Robust statistics
  vars:
    mdn: {min: 20, max: 80}
    mad: {min: 2, max: 12}
    dv: {min: -60, max: 60}
  where: ['dv != 0', 'mdn + dv > 0']
  calc:
    val: mdn + dv
    mz: 0.6745 * (val - mdn) / mad
    flag: if(abs(mz) > 3.5, 1, 0)
  prompt: |-
    A data set has median {mdn} and $\text{MAD} = {mad}$. Find the modified z-score of the value {val}
    (2 decimal places). Then enter 1 if the value would be flagged as a possible outlier, or 0 if not.
  answers:
    - {name: mz, label: '$M =$', tolerance: 0.006}
    - {name: flag, label: 'Flagged? (1 = yes, 0 = no)', tolerance: 0.001}
  solution: |-
    $M = \dfrac{0.6745\,({val} - {mdn})}{{mad}} =$ **{mz:dp2}**. Values with $|M| > 3.5$ are flagged,
    so the answer to the second box is **{flag:int}**.

# ---- Honors: grouped and combined data
- id: stat-m1-r2-freq-table
  title: Mean and SD from a frequency table
  topic: Grouped and combined data
  vars:
    f0: {min: 2, max: 15}
    f1: {min: 2, max: 15}
    f2: {min: 1, max: 12}
    f3: {min: 0, max: 8}
    f4: {min: 0, max: 5}
  calc:
    nn: f0 + f1 + f2 + f3 + f4
    sx: f1 + 2*f2 + 3*f3 + 4*f4
    mn: sx / nn
    ss: f0*mn^2 + f1*(1 - mn)^2 + f2*(2 - mn)^2 + f3*(3 - mn)^2 + f4*(4 - mn)^2
    sd: sqrt(ss / (nn - 1))
  prompt: |-
    Number of defects found on each rail segment inspected:

    | Defects | 0 | 1 | 2 | 3 | 4 |
    |---|---|---|---|---|---|
    | Segments | {f0} | {f1} | {f2} | {f3} | {f4} |

    Find the mean and the sample standard deviation of the number of defects (3 decimal places).
  answers:
    - {name: mn, label: '$\bar{x} =$', tolerance: 0.0006}
    - {name: sd, label: '$s =$', tolerance: 0.0006}
  solution: |-
    $n = \sum f = {nn}$ and $\sum fx = {sx}$, so $\bar{x} = {sx}/{nn} =$ **{mn:dp3}**.
    $\sum f(x - \bar{x})^2 = {ss:num4}$, so $s^2 = {ss:num4}/({nn} - 1)$ and $s =$ **{sd:dp3}**.

- id: stat-m1-r2-grouped-median
  title: Median of grouped data by interpolation
  topic: Grouped and combined data
  vars:
    wid: {choices: [5, 10, 20]}
    c1: {min: 1, max: 12}
    c2: {min: 3, max: 18}
    c3: {min: 3, max: 18}
    c4: {min: 2, max: 14}
    c5: {min: 1, max: 10}
  calc:
    nn: c1 + c2 + c3 + c4 + c5
    half: nn / 2
    k1: c1
    k2: c1 + c2
    k3: c1 + c2 + c3
    k4: c1 + c2 + c3 + c4
    lb: if(half <= k1, 0, if(half <= k2, wid, if(half <= k3, 2*wid, if(half <= k4, 3*wid, 4*wid))))
    below: if(half <= k1, 0, if(half <= k2, k1, if(half <= k3, k2, if(half <= k4, k3, k4))))
    inbin: if(half <= k1, c1, if(half <= k2, c2, if(half <= k3, c3, if(half <= k4, c4, c5))))
    med: lb + (half - below) / inbin * wid
    b1: wid
    b2: 2*wid
    b3: 3*wid
    b4: 4*wid
    b5: 5*wid
  prompt: |-
    Waiting times (minutes), grouped into bins:

    | Minutes | 0–<{b1} | {b1}–<{b2} | {b2}–<{b3} | {b3}–<{b4} | {b4}–<{b5} |
    |---|---|---|---|---|---|
    | Count | {c1} | {c2} | {c3} | {c4} | {c5} |

    Estimate the median by linear interpolation (2 decimal places).
  answers:
    - {name: med, label: 'Median', tolerance: 0.006}
  solution: |-
    $n = {nn}$, so the median is at position $n/2 = {half}$. The cumulative counts are {k1}, {k2},
    {k3}, {k4}, {nn}, so position {half} falls in the bin starting at $L = {lb}$, which holds
    $f = {inbin}$ values with $F = {below}$ values below it. Median
    $\approx {lb} + \dfrac{{half} - {below}}{{inbin}} \times {wid} =$ **{med:dp2}** minutes.

- id: stat-m1-r2-combined-sd
  title: Combine two groups' means and SDs
  topic: Grouped and combined data
  vars:
    na: {min: 5, max: 40}
    nb: {min: 5, max: 40}
    ma: {min: 50, max: 90}
    mb: {min: 50, max: 90}
    sa: {min: 3, max: 15}
    sb: {min: 3, max: 15}
  calc:
    nt: na + nb
    mc: (na*ma + nb*mb) / nt
    within: (na - 1)*sa^2 + (nb - 1)*sb^2
    between: na*(ma - mc)^2 + nb*(mb - mc)^2
    vc: (within + between) / (nt - 1)
    sc: sqrt(vc)
  prompt: |-
    Section A: $n = {na}$, mean {ma}, standard deviation {sa}. Section B: $n = {nb}$, mean {mb},
    standard deviation {sb}. Find the mean and the sample standard deviation of all {nt} scores
    combined (2 decimal places).
  answers:
    - {name: mc, label: 'Combined mean', tolerance: 0.006}
    - {name: sc, label: 'Combined SD', tolerance: 0.006}
  solution: |-
    Mean: $\dfrac{{na}({ma}) + {nb}({mb})}{{nt}} =$ **{mc:dp2}**. Within groups:
    $({na} - 1)({sa})^2 + ({nb} - 1)({sb})^2 = {within}$. Between groups:
    ${na}({ma} - {mc:num4})^2 + {nb}({mb} - {mc:num4})^2 = {between:num4}$.
    $s^2 = \dfrac{{within} + {between:num4}}{{nt} - 1} = {vc:num4}$, so $s =$ **{sc:dp2}**.
