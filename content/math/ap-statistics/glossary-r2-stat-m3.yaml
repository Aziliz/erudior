# Round 2, module stat-m3: terms bolded in the honors lessons 15h1–15h3.
# (odds, standardization, control group and case-control are defined in other glossary files.)
- term: fitted value
  aliases: [fitted values]
  definition: 'The value $\hat{y}_i = a + bx_i$ that a regression line gives at an observed $x_i$; the residual is $y_i - \hat{y}_i$.'
  topic: Least-squares theory
- term: regression sum of squares
  aliases: [SSR, explained sum of squares, model sum of squares]
  definition: 'SSR $= \sum (\hat{y}_i - \bar{y})^2 = b^2 S_{xx}$, the part of the total variation in $y$ accounted for by the regression line. $r^2 = \text{SSR}/\text{SST}$. (A few books use "SSR" for the residual sum of squares, so check the definition.)'
  topic: Least-squares theory
- term: sum-of-squares decomposition
  aliases: [sum of squares decomposition, analysis of variance identity]
  definition: 'For a least-squares line, $\text{SST} = \text{SSR} + \text{SSE}$: total variation in $y$ splits exactly into the part explained by the line and the part left in the residuals.'
  topic: Least-squares theory
- term: least absolute deviations
  aliases: [least absolute deviations line, LAD regression, least absolute deviation]
  definition: 'Fitting a line by minimizing $\sum |y - \hat{y}|$ instead of the sum of squares. More resistant to outliers than least squares, but found by an algorithm rather than a formula.'
  topic: Least-squares theory
- term: mid-parent height
  aliases: [mid-parent, mid-parental height]
  definition: 'Galton''s summary of a pair of parents: the average of the two parents'' heights (he first multiplied women''s heights by 1.08).'
  topic: Regression to the mean
- term: regression fallacy
  definition: 'Crediting a cause (a treatment, praise, a jinx) for a change that regression to the mean alone would produce, usually in a group chosen because its first measurement was extreme.'
  topic: Regression to the mean
- term: reliability
  aliases: [test reliability, test-retest reliability]
  definition: 'The correlation between two measurements of the same thing, such as a test and a retest. Low reliability (more luck in each score) means more regression to the mean.'
  topic: Regression to the mean
- term: SD line
  aliases: [standard deviation line]
  definition: 'The line through $(\bar{x}, \bar{y})$ with slope $\pm s_y/s_x$ (the sign of $r$), along the long axis of a scatterplot. The least-squares line of $y$ on $x$ is flatter than it when $|r| < 1$.'
  topic: Regression to the mean
- term: risk
  aliases: [absolute risk]
  definition: 'The proportion of a group that has an outcome over a stated time, such as $a/(a + b)$ for the exposed row of a 2×2 table: a conditional proportion.'
  topic: Relative risk and odds ratios
- term: risk difference
  aliases: [absolute risk difference, absolute risk reduction]
  definition: 'The difference between two risks, $p_1 - p_2$ (exposed minus unexposed), often given in percentage points. 0 means no association.'
  topic: Relative risk and odds ratios
- term: relative risk
  aliases: [RR, risk ratio]
  definition: 'The ratio of two risks, $p_1/p_2$ (exposed divided by unexposed). 1 means no association; 2 means twice the risk.'
  topic: Relative risk and odds ratios
- term: odds ratio
  aliases: [OR, odds ratios]
  definition: 'The odds of an outcome in one group divided by the odds in another, $ad/bc$ in a 2×2 table. Unchanged by how many cases and controls are sampled, so it is the measure case-control studies report; close to the relative risk when the outcome is rare.'
  topic: Relative risk and odds ratios
