# Round 2, module stat-m2: cards for the two honors lessons.
# Normal probability plots
- {front: 'Plotting position for a normal probability plot', back: 'The $i$-th smallest of $n$ values gets $p_i = (i - 0.5)/n$; its expected z-score is $\Phi^{-1}(p_i)$.', topic: 'Normal probability plots'}
- {front: 'Why normal data make a straight normal probability plot', back: 'Normal quantiles are $\mu + z\sigma$, so $x_{(i)} \approx \mu + \sigma z_i$: a line with intercept $\approx$ mean and slope $\approx$ SD.', topic: 'Normal probability plots'}
- {front: 'Why $(i - 0.5)/n$ and not $i/n$?', back: 'With $i/n$ the largest value gets position 1, and $\Phi^{-1}(1)$ is infinite.', topic: 'Normal probability plots'}
- {front: 'Normal probability plot: concave up (both ends above the line)', back: 'Right skew: low values bunched, high values stretched out.', topic: 'Normal probability plots'}
- {front: 'Normal probability plot: concave down (both ends below the line)', back: 'Left skew: low values stretched out, high values bunched.', topic: 'Normal probability plots'}
- {front: 'Normal probability plot: S shape, low end below and high end above the line', back: 'Heavy tails: extremes on both sides farther out than normal.', topic: 'Normal probability plots'}
- {front: 'Normal probability plot: flat at both ends (opposite S)', back: 'Light tails: extremes closer in than normal, as in a uniform distribution.', topic: 'Normal probability plots'}
- {front: 'Skew or tails?', back: 'Skew bends both ends of the plot the SAME way; heavy or light tails bend them OPPOSITE ways.', topic: 'Normal probability plots'}
- {front: 'Horizontal steps in a normal probability plot', back: 'Usually rounded data (tied values); not by themselves evidence against normality.', topic: 'Normal probability plots'}
- {front: 'How straight is straight enough?', back: 'Compare the plot correlation $r$ with cutoffs: only about 5% of normal samples fall below 0.919 ($n = 10$), 0.951 (20), 0.977 (50), 0.987 (100).', topic: 'Normal probability plots'}
- {front: 'Plot not straight: options', back: 'Transform (logs for right skew), use the data directly for tail questions, or rely on averages (CLT).', topic: 'Normal probability plots'}
# Process capability
- {front: 'Fraction out of specification', back: '$\Phi\!\left(\frac{\text{LSL} - \mu}{\sigma}\right) + 1 - \Phi\!\left(\frac{\text{USL} - \mu}{\sigma}\right)$; times 1,000,000 for ppm.', topic: 'Process capability'}
- {front: '$C_p$', back: '$(\text{USL} - \text{LSL})/(6\sigma)$: spec width vs. natural width; ignores centering.', topic: 'Process capability'}
- {front: '$C_{pk}$', back: '$\min(\text{USL} - \mu, \mu - \text{LSL})/(3\sigma)$: distance to the nearer limit in units of $3\sigma$; $C_{pk} \le C_p$.', topic: 'Process capability'}
- {front: '$C_{pk}$ and z-scores', back: 'The nearer limit is $3C_{pk}$ SDs from the mean: 1 → $3\sigma$, 1.33 → $4\sigma$, 2 → $6\sigma$.', topic: 'Process capability'}
- {front: 'Centered process: ppm out of spec', back: '$C_p = 1$: about 2,700 ppm. 1.33: about 63. 1.67: about 0.6. 2: about 0.002.', topic: 'Process capability'}
- {front: '$C_{pk}$ much lower than $C_p$', back: 'The spread may be fine, but the mean is off center: re-center first.', topic: 'Process capability'}
- {front: 'Largest σ for a target $C_{pk}$', back: '$\sigma_{\max} = \dfrac{\text{distance to the nearer limit}}{3 \times \text{target } C_{pk}}$.', topic: 'Process capability'}
- {front: 'Six Sigma''s 3.4 per million', back: 'Assumes the mean drifts $1.5\sigma$ toward a limit, leaving it $4.5\sigma$ away: $1 - \Phi(4.5) \approx 3.4 \times 10^{-6}$. A convention, not a law.', topic: 'Process capability'}
- {front: 'Specification limits vs. natural variation', back: 'Specs: what the design requires. Natural variation: what the process produces, about $\mu \pm 3\sigma$.', topic: 'Process capability'}
- {front: 'Why distrust tiny ppm predictions?', back: 'They come from the normal curve 4–6 SDs out, beyond the data; heavier tails mean many more defects. Check against real counts.', topic: 'Process capability'}
