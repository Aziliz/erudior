id: math-trigonometry
title: Trigonometry
description: >-
  Trigonometry from the first angle through a full college course: degrees and radians,
  arc length and angular speed, right-triangle trig, the unit circle, graphs of all six
  functions and sinusoidal models, inverse functions, identities and equations, the laws
  of sines and cosines, vectors, polar coordinates, parametric equations, and complex numbers in trigonometric
  form with De Moivre's theorem.
revision: 4
released: true
changelog: Honors lessons for every module, pictures and diagrams in every lesson, and new question types (fill in the blank, matching, labeling, ordering); corrections from a second full review of every lesson, question and drill; clearer graphs; answers shown at the precision each problem asks for.
