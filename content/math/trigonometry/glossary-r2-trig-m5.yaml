# Round 2, module trig-m5: terms bolded in the honors lessons 20h1 and 20h2.
- term: arctangent addition formula
  aliases: [arctangent addition formulas]
  definition: '$\tan^{-1}a + \tan^{-1}b = \tan^{-1}\tfrac{a + b}{1 - ab}$ when $ab < 1$; add $\pi$ when $ab > 1$ and $a > 0$, subtract $\pi$ when $ab > 1$ and $a < 0$. The sum is the direction angle of the point $(1 - ab, a + b)$.'
  topic: Arctangent identities
- term: Machin's formula
  definition: '$\tfrac{\pi}{4} = 4\tan^{-1}\tfrac15 - \tan^{-1}\tfrac{1}{239}$, found by John Machin in 1706 and used by him to compute $\pi$ to 100 decimal places.'
  topic: Arctangent identities
- term: Machin-like formula
  aliases: [Machin-like formulas]
  definition: 'Any formula that writes $\tfrac{\pi}{4}$ as a combination of arctangents of small numbers, such as $\tan^{-1}\tfrac12 + \tan^{-1}\tfrac13$; small inputs make the arctangent series converge quickly.'
  topic: Arctangent identities
- term: arctangent series
  definition: '$\tan^{-1}x = x - \tfrac{x^3}{3} + \tfrac{x^5}{5} - \tfrac{x^7}{7} + \cdots$ for $-1 \le x \le 1$ (proved in calculus); it converges fast when $|x|$ is small and very slowly at $x = 1$.'
  topic: Arctangent identities
- term: transcendental equation
  aliases: [transcendental equations]
  definition: 'An equation that mixes trig, exponential or logarithmic functions with polynomials, such as $\cos x = x$, so that no algebraic steps can isolate $x$; it is solved numerically.'
  topic: Numerical solutions
- term: bisection method
  aliases: [bisection]
  definition: 'A way to find a root of $f(x) = 0$: start with an interval where $f$ changes sign, test the midpoint, keep the half where the sign still changes, and repeat. Each step halves the interval.'
  topic: Numerical solutions
- term: fixed-point iteration
  definition: 'A way to solve an equation written as $x = g(x)$: from a guess $x_0$, compute $x_1 = g(x_0)$, $x_2 = g(x_1)$, and so on. If the values settle down, they settle on a solution.'
  topic: Numerical solutions
- term: Kepler's equation
  definition: '$M = E - e\sin E$, linking the mean anomaly $M$ (an angle that grows steadily with time) to the eccentric anomaly $E$ (which locates an orbiting body on its ellipse); $e$ is the eccentricity. It has no algebraic solution for $E$.'
  topic: Numerical solutions
