# Round 2 cards for trig-m8 (Vectors in the plane)
- {front: 'Normal force on a ramp at angle $\theta$ (no other forces across the ramp)', back: '$N = W\cos\theta$, perpendicular to the ramp surface', topic: Vector applications}
- {front: 'Angle between the weight and the "into the ramp" component', back: 'The ramp angle $\theta$ (both pairs of directions are perpendicular to each other)', topic: Vector applications}
# Honors: rotations and signed area
- {front: 'Rotate $\langle a, b\rangle$ counterclockwise by $\theta$', back: '$\langle a\cos\theta - b\sin\theta,\ a\sin\theta + b\cos\theta\rangle$', topic: Rotations and signed area}
- {front: 'Rotate $\langle a, b\rangle$ by $90^\circ$ counterclockwise', back: '$\langle -b, a\rangle$', topic: Rotations and signed area}
- {front: 'Rotate $\langle a, b\rangle$ by $90^\circ$ clockwise', back: '$\langle b, -a\rangle$', topic: Rotations and signed area}
- {front: 'Rotate a point $P$ about a center $C$', back: 'Rotate the vector $P - C$, then add $C$ back.', topic: Rotations and signed area}
- {front: 'Determinant of $\mathbf{u}$ and $\mathbf{v}$', back: '$u_1v_2 - u_2v_1 = \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert\sin\varphi$ ($\varphi$ = signed angle from $\mathbf{u}$ to $\mathbf{v}$)', topic: Rotations and signed area}
- {front: 'Sign of $\det(\mathbf{u}, \mathbf{v})$', back: 'Positive: $\mathbf{v}$ is counterclockwise from $\mathbf{u}$. Negative: clockwise. Zero: parallel.', topic: Rotations and signed area}
- {front: '$\det(\mathbf{v}, \mathbf{u})$ compared with $\det(\mathbf{u}, \mathbf{v})$', back: 'Opposite sign: $\det(\mathbf{v}, \mathbf{u}) = -\det(\mathbf{u}, \mathbf{v})$', topic: Rotations and signed area}
- {front: 'Signed angle from $\mathbf{u}$ to $\mathbf{v}$', back: '$\cos\varphi : \sin\varphi = (\mathbf{u}\cdot\mathbf{v}) : \det(\mathbf{u}, \mathbf{v})$; place it by the signs (atan2(det, dot)).', topic: Rotations and signed area}
- {front: 'Lagrange''s identity (plane)', back: '$(\mathbf{u}\cdot\mathbf{v})^2 + \det(\mathbf{u}, \mathbf{v})^2 = \lVert\mathbf{u}\rVert^2\lVert\mathbf{v}\rVert^2$', topic: Rotations and signed area}
- {front: 'Area of the parallelogram spanned by $\mathbf{u}$ and $\mathbf{v}$', back: '$|\det(\mathbf{u}, \mathbf{v})| = |u_1v_2 - u_2v_1|$', topic: Rotations and signed area}
- {front: 'Area of triangle $ABC$ from coordinates', back: '$\tfrac12\left|\det(\overrightarrow{AB}, \overrightarrow{AC})\right|$', topic: Rotations and signed area}
- {front: 'Shoelace formula', back: 'Area $= \tfrac12\left|\sum (x_k y_{k+1} - x_{k+1} y_k)\right|$, vertices in order, wrapping around', topic: Rotations and signed area}
- {front: 'Does the path $A \to B \to C$ turn left or right?', back: 'Sign of $\det(\overrightarrow{AB}, \overrightarrow{BC})$: positive = left, negative = right, zero = straight line', topic: Rotations and signed area}
# Honors: vector geometry
- {front: 'Point dividing $AB$ with $AP : PB = m : n$', back: '$\dfrac{nA + mB}{m + n}$ (section formula)', topic: Vector geometry}
- {front: 'Point a fraction $t$ of the way from $A$ to $B$', back: '$A + t(B - A) = (1 - t)A + tB$', topic: Vector geometry}
- {front: 'Centroid of triangle $ABC$', back: '$G = \dfrac{A + B + C}{3}$, two thirds of the way down each median from the vertex', topic: Vector geometry}
- {front: 'Vector form of a line', back: '$P = P_0 + t\mathbf{d}$ ($\mathbf{d}$ a direction vector), or $\mathbf{n}\cdot(P - P_0) = 0$ ($\mathbf{n}$ a normal vector)', topic: Vector geometry}
- {front: 'Normal vector of $ax + by = c$', back: '$\langle a, b\rangle$', topic: Vector geometry}
- {front: 'Distance from $(x_0, y_0)$ to $ax + by = c$', back: '$\dfrac{|ax_0 + by_0 - c|}{\sqrt{a^2 + b^2}}$', topic: Vector geometry}
- {front: 'Foot of the perpendicular from $Q(x_0, y_0)$ to $ax + by = c$', back: '$Q - \dfrac{ax_0 + by_0 - c}{a^2 + b^2}\langle a, b\rangle$', topic: Vector geometry}
- {front: '$(\mathbf{u} + \mathbf{v})\cdot(\mathbf{u} - \mathbf{v})$', back: '$\lVert\mathbf{u}\rVert^2 - \lVert\mathbf{v}\rVert^2$', topic: Vector geometry}
- {front: 'Thales''s theorem (vector proof)', back: 'Center at the origin, $A = -\mathbf{a}$, $B = \mathbf{a}$, $\lVert\mathbf{p}\rVert = \lVert\mathbf{a}\rVert$: $(A - P)\cdot(B - P) = \lVert\mathbf{p}\rVert^2 - \lVert\mathbf{a}\rVert^2 = 0$', topic: Vector geometry}
- {front: 'Parallelogram law', back: '$\lVert\mathbf{u} + \mathbf{v}\rVert^2 + \lVert\mathbf{u} - \mathbf{v}\rVert^2 = 2\lVert\mathbf{u}\rVert^2 + 2\lVert\mathbf{v}\rVert^2$', topic: Vector geometry}
- {front: 'A parallelogram has perpendicular diagonals exactly when', back: 'it is a rhombus (all sides equal)', topic: Vector geometry}
- {front: 'Algebraic proof of Cauchy–Schwarz', back: '$\lVert\mathbf{u} - t\mathbf{v}\rVert^2 \ge 0$ for all $t$, so the quadratic''s discriminant $4(\mathbf{u}\cdot\mathbf{v})^2 - 4\lVert\mathbf{u}\rVert^2\lVert\mathbf{v}\rVert^2 \le 0$', topic: Vector geometry}
- {front: 'Length of the median to side $a$', back: '$\tfrac12\sqrt{2b^2 + 2c^2 - a^2}$', topic: Vector geometry}
