# Cards for the trig-m1 honors lessons (round 2)
# Measuring the Earth and the sky with arcs
- {front: 'Eratosthenes'' method', back: 'Parallel sun rays make the shadow angle at one city equal the central angle between two cities on a meridian; then circumference $= \tfrac{360^\circ}{\theta}\times$ distance.', topic: Measuring the Earth}
- {front: 'Eratosthenes'' numbers (as reported)', back: 'Shadow angle $7.2^\circ = \tfrac{1}{50}$ of a circle, distance 5000 stadia, so circumference 250,000 stadia. Accuracy is debated because the stadion''s length is uncertain.', topic: Measuring the Earth}
- {front: 'Finding a radius from an arc', back: '$r = \dfrac{s}{\theta}$, with $\theta$ in radians.', topic: Measuring the Earth}
- {front: 'Nautical mile', back: 'Exactly 1852 m; about one minute of latitude. On a meridian, distance in nautical miles $\approx$ angle in minutes.', topic: Measuring the Earth}
- {front: 'Knot', back: 'One nautical mile per hour.', topic: Measuring the Earth}
- {front: 'One degree of latitude', back: 'About 111 km ($6371 \cdot \tfrac{\pi}{180}$), or 60 nautical miles.', topic: Measuring the Earth}
- {front: 'Great circle', back: 'A circle on a sphere centered at the sphere''s center (the equator, a meridian circle). The shortest surface path is an arc of one.', topic: Measuring the Earth}
- {front: 'Small-angle rule for angular size', back: '$\theta \approx \dfrac{D}{d}$ radians for an object of width $D$ at distance $d \gg D$.', topic: Small angles}
- {front: 'One radian in arcminutes and arcseconds', back: '$1 \text{ rad} \approx 3438'' \approx 206{,}265''''$', topic: Small angles}
- {front: 'Milliradian rule', back: '1 mrad covers 1 m at 1 km (or 10 cm at 100 m).', topic: Small angles}
- {front: 'Angular size of the Sun and the Moon', back: 'Both about $0.5^\circ$ (about $31''$ and $32''$), which is why total solar eclipses are possible.', topic: Small angles}
- {front: 'Parsec', back: 'Distance at which 1 au subtends $1''''$: $\tfrac{648{,}000}{\pi}$ au $\approx 3.26$ light-years.', topic: Small angles}
- {front: 'Distance from parallax', back: '$d \text{ (pc)} = \dfrac{1}{p \text{ (arcseconds)}}$', topic: Small angles}
# Relative rotation
- {front: 'Relative angular speed (same direction)', back: '$\omega_1 - \omega_2$; they meet every $\dfrac{360^\circ}{\omega_1 - \omega_2}$.', topic: Relative rotation}
- {front: 'Clock hand speeds', back: 'Minute hand $6^\circ$/min; hour hand $0.5^\circ$/min; the gap changes $5.5^\circ$/min.', topic: Relative rotation}
- {front: 'Hour hand position at $h$:$m$', back: '$30h + 0.5m$ degrees clockwise from 12 (minute hand: $6m$).', topic: Relative rotation}
- {front: 'How often clock hands overlap', back: 'Every $\tfrac{720}{11} \approx 65.45$ minutes: 11 times in 12 hours.', topic: Relative rotation}
- {front: 'Sidereal day', back: 'One turn relative to the stars: about 23 h 56 min 4 s ($24 \text{ h} \times \tfrac{365.24}{366.24}$).', topic: Relative rotation}
- {front: 'Synodic period', back: '$\dfrac{1}{T} = \dfrac{1}{T_1} - \dfrac{1}{T_2}$; for the Moon, $T \approx 29.5$ days.', topic: Relative rotation}
- {front: 'Meshing gears', back: '$N_1\omega_1 = N_2\omega_2$ (tooth counts), and they turn in opposite directions.', topic: Gears and rolling}
- {front: 'Idler gear', back: 'Changes the direction of the output but not the speed ratio.', topic: Gears and rolling}
- {front: 'Gears on one shaft', back: 'Turn with the same angular speed.', topic: Gears and rolling}
- {front: 'Overall ratio of a gear train', back: 'Multiply the ratios of the stages: $\tfrac{N_1}{N_2}\cdot\tfrac{N_3}{N_4}\cdots$; each mesh reverses the direction.', topic: Gears and rolling}
- {front: 'Rolling without slipping', back: 'Distance $= r\theta$ and center speed $= r\omega$. The top moves at $2v$; the contact point is momentarily at rest.', topic: Gears and rolling}
- {front: 'Bigger tires, same speedometer reading', back: 'True speed $=$ reading $\times \dfrac{\text{new diameter}}{\text{old diameter}}$; the odometer under-reads.', topic: Gears and rolling}
