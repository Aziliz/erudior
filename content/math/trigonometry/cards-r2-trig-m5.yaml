# Round 2, module trig-m5: cards for the honors lessons 20h1 and 20h2.
- {front: '$\tan^{-1}a + \tan^{-1}b$ is the direction angle of which point?', back: '$(1 - ab,\ a + b)$', topic: Arctangent identities}
- {front: '$\tan^{-1}a + \tan^{-1}b$ when $ab < 1$', back: '$\tan^{-1}\dfrac{a + b}{1 - ab}$', topic: Arctangent identities}
- {front: '$\tan^{-1}a + \tan^{-1}b$ when $ab > 1$', back: '$\tan^{-1}\dfrac{a + b}{1 - ab} + \pi$ if $a > 0$; $- \pi$ if $a < 0$.', topic: Arctangent identities}
- {front: '$\tan^{-1}x + \tan^{-1}\tfrac1x$', back: '$\tfrac{\pi}{2}$ for $x > 0$, $-\tfrac{\pi}{2}$ for $x < 0$.', topic: Arctangent identities}
- {front: '$\tan^{-1}a - \tan^{-1}b$ (when $ab > -1$)', back: '$\tan^{-1}\dfrac{a - b}{1 + ab}$', topic: Arctangent identities}
- {front: '$2\tan^{-1}a$ (when $|a| < 1$)', back: '$\tan^{-1}\dfrac{2a}{1 - a^2}$', topic: Arctangent identities}
- {front: '$\tan^{-1}\tfrac12 + \tan^{-1}\tfrac13$', back: '$\tfrac{\pi}{4}$', topic: Arctangent identities}
- {front: '$\tan^{-1}1 + \tan^{-1}2 + \tan^{-1}3$', back: '$\pi$', topic: Arctangent identities}
- {front: 'Machin''s formula (1706)', back: '$\tfrac{\pi}{4} = 4\tan^{-1}\tfrac15 - \tan^{-1}\tfrac{1}{239}$', topic: Arctangent identities}
- {front: 'Arctangent series', back: '$\tan^{-1}x = x - \tfrac{x^3}{3} + \tfrac{x^5}{5} - \cdots$ for $-1 \le x \le 1$; fast when $|x|$ is small.', topic: Arctangent identities}
- {front: 'All solutions of $\sin A = \sin B$', back: '$A = B + 2k\pi$ or $A = \pi - B + 2k\pi$', topic: General solutions}
- {front: 'All solutions of $\cos A = \cos B$', back: '$A = \pm B + 2k\pi$', topic: General solutions}
- {front: 'All solutions of $\tan A = \tan B$', back: '$A = B + k\pi$ (both sides defined)', topic: General solutions}
- {front: 'One-line general solution of $\sin x = \sin\alpha$', back: '$x = (-1)^n\alpha + n\pi$, $n$ an integer', topic: General solutions}
- {front: 'Comparing $\sin(\ldots)$ with $\cos x$', back: 'Rewrite $\cos x = \sin\left(\tfrac{\pi}{2} - x\right)$, then use the rule for equal sines.', topic: General solutions}
- {front: 'Shifted argument such as $\sin\left(2x - \tfrac{\pi}{3}\right) = c$', back: 'Let $u$ be the argument, find the interval $u$ runs over, solve there, then convert back to $x$.', topic: General solutions}
- {front: 'Bisection method', back: 'Keep halving an interval where $f$ changes sign; each step halves the width.', topic: Numerical solutions}
- {front: 'Fixed-point iteration', back: 'For $x = g(x)$: compute $x_{n+1} = g(x_n)$ until the values settle.', topic: Numerical solutions}
- {front: 'Solution of $\cos x = x$', back: '$x \approx 0.7391$ (the only one)', topic: Numerical solutions}
- {front: 'Kepler''s equation', back: '$M = E - e\sin E$; solve for $E$ numerically, e.g. by iterating $E_{n+1} = M + e\sin E_n$.', topic: Numerical solutions}
