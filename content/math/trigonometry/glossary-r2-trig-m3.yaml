# Glossary terms introduced in the trig-m3 honors lessons (round 2)
- term: tangent line
  aliases: [tangent lines, tangent line to a circle]
  definition: 'A line that touches a circle at exactly one point. It is perpendicular to the radius at that point; the line $x = 1$ is tangent to the unit circle at $(1, 0)$.'
  topic: Trig functions as lengths
- term: secant line
  aliases: [secant lines]
  definition: 'A line that cuts through a circle at two points (Latin secare, "to cut"). The segment $OT$ that measures $\sec\theta$ lies on one.'
  topic: Trig functions as lengths
- term: directed length
  aliases: [directed lengths, signed length, signed lengths]
  definition: 'A length with a sign that records direction: positive one way along a line and negative the other. Read this way, $\tan\theta$ and $\sec\theta$ are lengths in the unit-circle picture in every quadrant.'
  topic: Trig functions as lengths
- term: versine
  aliases: [versin, versed sine]
  definition: 'An older trig function, $\text{versin}\,\theta = 1 - \cos\theta$: on the unit circle, the distance from the foot of the sine to the point $(1, 0)$. Half of it is the haversine.'
  topic: Trig functions as lengths
- term: exsecant
  aliases: [exsec]
  definition: 'An older trig function, $\text{exsec}\,\theta = \sec\theta - 1$: the part of the secant segment that lies outside the unit circle.'
  topic: Trig functions as lengths
- term: squeeze theorem
  aliases: [squeeze principle, sandwich theorem]
  definition: 'If a quantity always lies between two others, and those two approach the same number, then it approaches that number too. It shows that $\tfrac{\sin t}{t} \to 1$ as $t \to 0$, because $\cos t < \tfrac{\sin t}{t} < 1$.'
  topic: Small-angle behavior
- term: linear approximation
  aliases: [linear approximations]
  definition: 'Replacing a function near a point by a straight line that matches it there, such as $\sin t \approx t$ and $\tan t \approx t$ for small $t$ in radians.'
  topic: Small-angle behavior
