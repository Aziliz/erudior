# Notecards: formulas, definitions, facts and "when to use which"
# Angles
- {front: 'Positive vs negative angle', back: 'Counterclockwise rotation is positive; clockwise is negative.', topic: Angles}
- {front: 'Standard position', back: 'Vertex at the origin, initial side on the positive $x$-axis.', topic: Angles}
- {front: 'Coterminal angles', back: '$\theta$ and $\theta + 360^\circ k$ (or $\theta + 2k\pi$) share a terminal side.', topic: Angles}
- {front: 'Coterminal angle of $-250^\circ$ in $[0^\circ, 360^\circ)$', back: '$-250^\circ + 360^\circ = 110^\circ$', topic: Angles}
- {front: 'Complementary / supplementary', back: 'Complementary angles add to $90^\circ$; supplementary angles add to $180^\circ$.', topic: Angles}
- {front: 'Quadrantal angle', back: 'Terminal side on an axis: $0^\circ, 90^\circ, 180^\circ, 270^\circ$ (plus full turns). It lies in no quadrant.', topic: Angles}
- {front: 'DMS to decimal degrees', back: '$D^\circ M'' S'''' = D + \dfrac{M}{60} + \dfrac{S}{3600}$ degrees', topic: Degree measure}
- {front: 'Decimal degrees to DMS', back: 'Keep the whole degrees; multiply the leftover by 60 for minutes; multiply the new leftover by 60 for seconds.', topic: Degree measure}
- {front: '$25^\circ\,30''$ as a decimal', back: '$25.5^\circ$ (30 minutes is half a degree)', topic: Degree measure}
# Radians
- {front: 'Definition of a radian', back: 'The central angle that subtends an arc as long as the radius; $\theta = \tfrac{s}{r}$.', topic: Radian measure}
- {front: 'Degrees ↔ radians', back: '$\pi \text{ rad} = 180^\circ$. Degrees to radians: $\times\tfrac{\pi}{180}$. Radians to degrees: $\times\tfrac{180}{\pi}$.', topic: Radian measure}
- {front: 'One radian in degrees', back: '$\tfrac{180^\circ}{\pi} \approx 57.3^\circ$', topic: Radian measure}
- {front: '$30^\circ, 45^\circ, 60^\circ, 90^\circ$ in radians', back: '$\tfrac{\pi}{6}, \tfrac{\pi}{4}, \tfrac{\pi}{3}, \tfrac{\pi}{2}$', topic: Radian measure}
- {front: '$120^\circ, 135^\circ, 150^\circ$ in radians', back: '$\tfrac{2\pi}{3}, \tfrac{3\pi}{4}, \tfrac{5\pi}{6}$', topic: Radian measure}
- {front: '$210^\circ, 225^\circ, 240^\circ, 270^\circ$ in radians', back: '$\tfrac{7\pi}{6}, \tfrac{5\pi}{4}, \tfrac{4\pi}{3}, \tfrac{3\pi}{2}$', topic: Radian measure}
- {front: '$300^\circ, 315^\circ, 330^\circ$ in radians', back: '$\tfrac{5\pi}{3}, \tfrac{7\pi}{4}, \tfrac{11\pi}{6}$', topic: Radian measure}
- {front: 'An angle written with no unit, like $\sin 2$', back: 'It is in radians.', topic: Radian measure}
# Arc length and sector area
- {front: 'Arc length', back: '$s = r\theta$, $\theta$ in radians', topic: Arc length}
- {front: 'Sector area', back: '$A = \tfrac12 r^2\theta = \tfrac12 rs$, $\theta$ in radians', topic: Sector area}
- {front: 'Arc length with $\theta$ in degrees', back: '$s = \tfrac{\theta}{360^\circ}\cdot 2\pi r$', topic: Arc length}
- {front: 'Distance between two places on the same meridian', back: '$s = R\theta$ with $\theta$ the latitude difference in radians and $R \approx 3960$ mi (Earth).', topic: Arc length}
# Speed
- {front: 'Angular speed', back: '$\omega = \tfrac{\theta}{t}$ (radians per unit time)', topic: Angular and linear speed}
- {front: 'Linear speed from angular speed', back: '$v = r\omega$ ($\omega$ in radians per unit time)', topic: Angular and linear speed}
- {front: 'rpm to rad/min', back: 'Multiply by $2\pi$ (one revolution = $2\pi$ rad).', topic: Angular and linear speed}
- {front: 'Belt or chain linking two pulleys', back: 'Equal linear speeds: $r_1\omega_1 = r_2\omega_2$.', topic: Angular and linear speed}
# Right-triangle ratios
- {front: 'SOH-CAH-TOA', back: '$\sin = \tfrac{\text{opp}}{\text{hyp}}$, $\cos = \tfrac{\text{adj}}{\text{hyp}}$, $\tan = \tfrac{\text{opp}}{\text{adj}}$', topic: Trig ratios}
- {front: 'Reciprocal functions', back: '$\csc = \tfrac{1}{\sin}$, $\sec = \tfrac{1}{\cos}$, $\cot = \tfrac{1}{\tan}$', topic: Trig ratios}
- {front: 'Which function pairs with secant?', back: 'Cosine: $\sec\theta = \tfrac{1}{\cos\theta}$ (not sine).', topic: Trig ratios}
- {front: '$\cos^{-1}x$ vs $\sec x$', back: '$\cos^{-1}x$ is the inverse cosine (an angle); $\sec x = \tfrac{1}{\cos x}$ (a ratio). They are different.', topic: Trig ratios}
- {front: 'Given one ratio of an acute angle', back: 'Draw a right triangle with those two sides, find the third with the Pythagorean theorem, read off the rest.', topic: Trig ratios}
- {front: 'Common Pythagorean triples', back: '3-4-5, 5-12-13, 8-15-17, 7-24-25, 20-21-29, 9-40-41', topic: Trig ratios}
- {front: 'Range of $\sin\theta$, $\cos\theta$ for an acute angle', back: 'Between 0 and 1, since the hypotenuse is the longest side.', topic: Trig ratios}
# Special triangles
- {front: '45°–45°–90° side ratios', back: '$1 : 1 : \sqrt2$', topic: Special angles}
- {front: '30°–60°–90° side ratios', back: '$1 : \sqrt3 : 2$ (short leg : long leg : hypotenuse)', topic: Special angles}
- {front: '$\sin 30^\circ$, $\sin 45^\circ$, $\sin 60^\circ$', back: '$\tfrac12$, $\tfrac{\sqrt2}{2}$, $\tfrac{\sqrt3}{2}$', topic: Special angles}
- {front: '$\cos 30^\circ$, $\cos 45^\circ$, $\cos 60^\circ$', back: '$\tfrac{\sqrt3}{2}$, $\tfrac{\sqrt2}{2}$, $\tfrac12$', topic: Special angles}
- {front: '$\tan 30^\circ$, $\tan 45^\circ$, $\tan 60^\circ$', back: '$\tfrac{\sqrt3}{3}$, $1$, $\sqrt3$', topic: Special angles}
- {front: '$\csc 30^\circ$, $\sec 45^\circ$, $\sec 60^\circ$', back: '$2$, $\sqrt2$, $2$', topic: Special angles}
- {front: 'Cofunction identities', back: '$\sin\theta = \cos(90^\circ - \theta)$, $\tan\theta = \cot(90^\circ - \theta)$, $\sec\theta = \csc(90^\circ - \theta)$', topic: Cofunctions}
- {front: '$\sin 25^\circ = \cos\,?$', back: '$\cos 65^\circ$', topic: Cofunctions}
# Solving right triangles
- {front: 'Solving a right triangle: what is needed?', back: 'Two parts besides the right angle, at least one of them a side.', topic: Solving right triangles}
- {front: 'Unknown in the denominator: $\tan 40^\circ = \tfrac{9}{b}$', back: '$b = \tfrac{9}{\tan 40^\circ}$ (divide, don''t multiply).', topic: Solving right triangles}
- {front: 'Angle from two legs', back: '$A = \tan^{-1}\left(\tfrac{\text{opp}}{\text{adj}}\right)$', topic: Solving right triangles}
- {front: 'Checks for a solved right triangle', back: '$A + B = 90^\circ$, $a^2 + b^2 = c^2$, longest side opposite largest angle.', topic: Solving right triangles}
# Elevation and bearings
- {front: 'Angle of elevation / depression', back: 'Measured from the horizontal, up or down to the line of sight. For the same line of sight they are equal.', topic: Elevation and depression}
- {front: 'Height from distance $d$ and elevation angle $\theta$', back: '$h = d\tan\theta$ (plus eye height if given)', topic: Elevation and depression}
- {front: 'Two observations of the same height', back: 'Write $h = x\tan\beta = (x + d)\tan\alpha$ and solve for $x$.', topic: Elevation and depression}
- {front: 'Three-digit bearing', back: 'Clockwise from north: N = $000^\circ$, E = $090^\circ$, S = $180^\circ$, W = $270^\circ$.', topic: Bearings}
- {front: 'S $20^\circ$ W as a three-digit bearing', back: '$200^\circ$', topic: Bearings}
- {front: 'N $70^\circ$ W as a three-digit bearing', back: '$290^\circ$', topic: Bearings}
- {front: 'Components of a trip of $d$ on bearing $\beta$', back: 'north $= d\cos\beta$, east $= d\sin\beta$', topic: Bearings}
# Any angle
- {front: 'Trig functions from a point $(x, y)$', back: '$r = \sqrt{x^2 + y^2}$; $\sin\theta = \tfrac{y}{r}$, $\cos\theta = \tfrac{x}{r}$, $\tan\theta = \tfrac{y}{x}$', topic: Trig functions of any angle}
- {front: 'ASTC', back: 'All positive in QI, Sine in QII, Tangent in QIII, Cosine in QIV.', topic: Trig functions of any angle}
- {front: 'Sign of $r$', back: 'Always positive; signs of trig values come from $x$ and $y$.', topic: Trig functions of any angle}
- {front: 'Why is $\tan 90^\circ$ undefined?', back: 'At $90^\circ$, $x = 0$, so $\tfrac{y}{x}$ divides by zero.', topic: Trig functions of any angle}
- {front: 'Values at $180^\circ$', back: '$\sin = 0$, $\cos = -1$, $\tan = 0$, $\sec = -1$, $\csc$ and $\cot$ undefined.', topic: Trig functions of any angle}
- {front: 'Values at $270^\circ$', back: '$\sin = -1$, $\cos = 0$, $\tan$ undefined, $\csc = -1$, $\cot = 0$.', topic: Trig functions of any angle}
# Reference angles
- {front: 'Reference angle formulas (degrees)', back: 'QII: $180^\circ - \theta$; QIII: $\theta - 180^\circ$; QIV: $360^\circ - \theta$', topic: Reference angles}
- {front: 'Reference angle formulas (radians)', back: 'QII: $\pi - \theta$; QIII: $\theta - \pi$; QIV: $2\pi - \theta$', topic: Reference angles}
- {front: 'Evaluating with a reference angle', back: 'trig$(\theta) = \pm$ trig$(\theta'')$; the quadrant of $\theta$ decides the sign.', topic: Reference angles}
- {front: '$\cos 210^\circ$', back: '$-\tfrac{\sqrt3}{2}$ (reference $30^\circ$, cosine negative in QIII)', topic: Reference angles}
- {front: 'Reference angle of $120^\circ$', back: '$60^\circ$ (measured to the $x$-axis, never the $y$-axis)', topic: Reference angles}
# Unit circle
- {front: 'Point on the unit circle at angle $t$', back: '$(\cos t, \sin t)$', topic: Unit circle}
- {front: 'Unit circle point for $\tfrac{\pi}{6}$', back: '$\left(\tfrac{\sqrt3}{2}, \tfrac12\right)$', topic: Unit circle}
- {front: 'Unit circle point for $\tfrac{\pi}{3}$', back: '$\left(\tfrac12, \tfrac{\sqrt3}{2}\right)$', topic: Unit circle}
- {front: 'Unit circle point for $\tfrac{3\pi}{4}$', back: '$\left(-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\right)$', topic: Unit circle}
- {front: 'Unit circle point for $\tfrac{7\pi}{6}$', back: '$\left(-\tfrac{\sqrt3}{2}, -\tfrac12\right)$', topic: Unit circle}
- {front: 'Unit circle point for $\tfrac{5\pi}{3}$', back: '$\left(\tfrac12, -\tfrac{\sqrt3}{2}\right)$', topic: Unit circle}
- {front: 'Denominator patterns on the unit circle', back: 'Denominator 6 ($\tfrac{\pi}{6}, \tfrac{5\pi}{6}, \ldots$): near the $x$-axis ($|y| = \tfrac12$). Denominator 3 ($\tfrac{\pi}{3}, \tfrac{2\pi}{3}, \ldots$): near the $y$-axis ($|x| = \tfrac12$). Denominator 4: on the diagonals.', topic: Unit circle}
- {front: '$\tan t$ on the unit circle', back: '$\tfrac{y}{x}$, the slope of the terminal side', topic: Unit circle}
# Properties
- {front: 'Domain and range of sine and cosine', back: 'Domain all reals; range $[-1, 1]$.', topic: Properties of trig functions}
- {front: 'Domain of tangent and secant', back: '$x \ne \tfrac{\pi}{2} + k\pi$', topic: Properties of trig functions}
- {front: 'Domain of cotangent and cosecant', back: '$x \ne k\pi$', topic: Properties of trig functions}
- {front: 'Range of secant and cosecant', back: '$(-\infty, -1] \cup [1, \infty)$', topic: Properties of trig functions}
- {front: 'Periods of the six functions', back: '$\sin, \cos, \sec, \csc$: $2\pi$. $\tan, \cot$: $\pi$.', topic: Properties of trig functions}
- {front: 'Even trig functions', back: 'Cosine and secant: $\cos(-x) = \cos x$.', topic: Properties of trig functions}
- {front: 'Odd trig functions', back: 'Sine, tangent, cosecant, cotangent: $\sin(-x) = -\sin x$.', topic: Properties of trig functions}
- {front: '$\sin(t + \pi)$ and $\cos(t + \pi)$', back: '$-\sin t$ and $-\cos t$ (the opposite point on the circle)', topic: Properties of trig functions}
# Graphs
- {front: 'Key points of $y = \sin x$ on $[0, 2\pi]$', back: '$(0,0), (\tfrac{\pi}{2},1), (\pi,0), (\tfrac{3\pi}{2},-1), (2\pi,0)$', topic: Graphs of sine and cosine}
- {front: 'Key points of $y = \cos x$ on $[0, 2\pi]$', back: '$(0,1), (\tfrac{\pi}{2},0), (\pi,-1), (\tfrac{3\pi}{2},0), (2\pi,1)$', topic: Graphs of sine and cosine}
- {front: 'Cosine as a shifted sine', back: '$\cos x = \sin\left(x + \tfrac{\pi}{2}\right)$', topic: Graphs of sine and cosine}
- {front: 'Amplitude of $y = A\sin(Bx - c) + D$', back: '$|A|$', topic: Sinusoidal transformations}
- {front: 'Period of $y = A\sin(Bx)$', back: '$\tfrac{2\pi}{B}$', topic: Sinusoidal transformations}
- {front: 'Phase shift of $y = \sin(Bx - c)$', back: '$\tfrac{c}{B}$ (factor out $B$ first)', topic: Sinusoidal transformations}
- {front: 'Midline of $y = A\sin(B(x - C)) + D$', back: '$y = D$', topic: Sinusoidal transformations}
- {front: 'Max and min of $A\sin(\cdots) + D$', back: '$D + |A|$ and $D - |A|$', topic: Sinusoidal transformations}
- {front: 'One cycle of $A\sin(B(x - C)) + D$', back: 'From $x = C$ to $x = C + \tfrac{2\pi}{B}$; quarter points every $\tfrac{\pi}{2B}$.', topic: Sinusoidal transformations}
- {front: 'Frequency', back: 'Cycles per unit: $\tfrac{B}{2\pi} = \tfrac{1}{\text{period}}$', topic: Sinusoidal transformations}
- {front: '$y = \tan x$: asymptotes, zeros, period', back: 'Asymptotes $x = \tfrac{\pi}{2} + k\pi$; zeros $x = k\pi$; period $\pi$; increasing.', topic: Graphs of tangent and cotangent}
- {front: '$y = \cot x$: asymptotes, zeros, period', back: 'Asymptotes $x = k\pi$; zeros $x = \tfrac{\pi}{2} + k\pi$; period $\pi$; decreasing.', topic: Graphs of tangent and cotangent}
- {front: 'Period of $y = A\tan(Bx)$', back: '$\tfrac{\pi}{B}$', topic: Graphs of tangent and cotangent}
- {front: 'Asymptotes of $y = \tan(B(x - C))$', back: 'Where $B(x - C) = \pm\tfrac{\pi}{2} + k\pi$', topic: Graphs of tangent and cotangent}
- {front: 'Graphing $\sec x$ or $\csc x$', back: 'Draw $\cos x$ or $\sin x$; its zeros become asymptotes, its peaks become the turning points of U-shaped branches.', topic: Graphs of secant and cosecant}
- {front: 'Range of $A\sec(\cdots) + D$', back: '$(-\infty, D - |A|] \cup [D + |A|, \infty)$', topic: Graphs of secant and cosecant}
- {front: 'Asymptotes of $y = \sec x$ and $y = \csc x$', back: '$\sec$: $x = \tfrac{\pi}{2} + k\pi$. $\csc$: $x = k\pi$.', topic: Graphs of secant and cosecant}
# Modeling
- {front: 'Sinusoidal model from max and min', back: '$D = \tfrac{\max + \min}{2}$, $|A| = \tfrac{\max - \min}{2}$', topic: Sinusoidal models}
- {front: 'Model starting at a maximum / minimum / midline going up', back: '$A\cos$ / $-A\cos$ / $A\sin$', topic: Sinusoidal models}
- {front: 'Peak to next trough', back: 'Half a period', topic: Sinusoidal models}
- {front: 'Ferris wheel boarding at the bottom', back: '$h(t) = c - r\cos\left(\tfrac{2\pi t}{T}\right)$ with center height $c$, radius $r$, period $T$', topic: Sinusoidal models}
- {front: 'Simple harmonic motion', back: '$d = a\sin\omega t$ or $a\cos\omega t$; period $\tfrac{2\pi}{\omega}$; frequency $\tfrac{\omega}{2\pi}$', topic: Simple harmonic motion}
- {front: '$\omega$ from a frequency $f$', back: '$\omega = 2\pi f$', topic: Simple harmonic motion}
- {front: 'Damped harmonic motion', back: 'Amplitude decays, e.g. $d = ae^{-kt}\cos\omega t$.', topic: Simple harmonic motion}
# Inverses
- {front: 'Range of $\sin^{-1}x$', back: '$\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ (QI and QIV)', topic: Inverse trig functions}
- {front: 'Range of $\cos^{-1}x$', back: '$[0, \pi]$ (QI and QII)', topic: Inverse trig functions}
- {front: 'Range of $\tan^{-1}x$', back: '$\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$', topic: Inverse trig functions}
- {front: 'Domain of $\sin^{-1}$ and $\cos^{-1}$', back: '$[-1, 1]$', topic: Inverse trig functions}
- {front: '$\sin^{-1}\left(-\tfrac12\right)$', back: '$-\tfrac{\pi}{6}$', topic: Inverse trig functions}
- {front: '$\cos^{-1}\left(-\tfrac12\right)$', back: '$\tfrac{2\pi}{3}$', topic: Inverse trig functions}
- {front: '$\tan^{-1}(-1)$', back: '$-\tfrac{\pi}{4}$', topic: Inverse trig functions}
- {front: '$\cos^{-1}(-x)$', back: '$\pi - \cos^{-1}x$', topic: Inverse trig functions}
- {front: 'When does $\sin^{-1}(\sin x) = x$?', back: 'Only for $-\tfrac{\pi}{2} \le x \le \tfrac{\pi}{2}$.', topic: Inverse compositions}
- {front: 'When does $\sin(\sin^{-1}x) = x$?', back: 'For every $x$ in $[-1, 1]$.', topic: Inverse compositions}
- {front: '$\cos(\sin^{-1}x)$', back: '$\sqrt{1 - x^2}$', topic: Inverse compositions}
- {front: '$\sin(\tan^{-1}x)$', back: '$\dfrac{x}{\sqrt{1 + x^2}}$', topic: Inverse compositions}
- {front: 'Evaluating trig(inverse trig$(a)$)', back: 'Name the angle, place it using the inverse''s range, draw a reference triangle, read off the outer function with the sign.', topic: Inverse compositions}
- {front: '$\sec^{-1}x$, $\csc^{-1}x$, $\cot^{-1}x$', back: '$\cos^{-1}\tfrac1x$, $\sin^{-1}\tfrac1x$, $\tfrac{\pi}{2} - \tan^{-1}x$', topic: Inverse compositions}
# Equations
- {front: 'General solution of $\sin x = c$', back: '$x = \sin^{-1}c + 2k\pi$ or $x = \pi - \sin^{-1}c + 2k\pi$', topic: Trig equations}
- {front: 'General solution of $\cos x = c$', back: '$x = \pm\cos^{-1}c + 2k\pi$', topic: Trig equations}
- {front: 'General solution of $\tan x = c$', back: '$x = \tan^{-1}c + k\pi$', topic: Trig equations}
- {front: 'Equation with $\sin(nx)$ on $[0, 2\pi)$', back: 'Solve for $nx$ with the general solution first, then divide by $n$; expect $n$ times as many solutions.', topic: Trig equations}
- {front: 'Never divide an equation by $\sin x$ — why?', back: 'You lose the solutions where $\sin x = 0$. Factor instead.', topic: Trig equations}
- {front: 'Strategy for harder trig equations', back: 'One angle, one function (identities), set to 0, factor, solve each factor, check.', topic: Trig equations with identities}
- {front: 'After squaring both sides of a trig equation', back: 'Check every candidate in the original: squaring can create extraneous solutions.', topic: Trig equations with identities}
# Identities
- {front: 'Pythagorean identities', back: '$\sin^2 x + \cos^2 x = 1$, $1 + \tan^2 x = \sec^2 x$, $1 + \cot^2 x = \csc^2 x$', topic: Fundamental identities}
- {front: 'Quotient identities', back: '$\tan x = \tfrac{\sin x}{\cos x}$, $\cot x = \tfrac{\cos x}{\sin x}$', topic: Fundamental identities}
- {front: 'Finding $\cos\theta$ from $\sin\theta$', back: '$\cos\theta = \pm\sqrt{1 - \sin^2\theta}$, sign from the quadrant', topic: Fundamental identities}
- {front: '$\tan x + \cot x$', back: '$\sec x\csc x$', topic: Fundamental identities}
- {front: 'Ground rule for verifying identities', back: 'Transform one side into the other; never do the same operation to both sides.', topic: Verifying identities}
- {front: 'Denominator $1 - \sin x$ in an identity', back: 'Multiply top and bottom by the conjugate $1 + \sin x$; the bottom becomes $\cos^2 x$.', topic: Verifying identities}
- {front: 'Showing an equation is not an identity', back: 'One counterexample is enough (e.g. $x = \tfrac{\pi}{4}$ in $\sin x + \cos x = 1$).', topic: Verifying identities}
- {front: '$\sin(\alpha \pm \beta)$', back: '$\sin\alpha\cos\beta \pm \cos\alpha\sin\beta$', topic: Sum and difference formulas}
- {front: '$\cos(\alpha \pm \beta)$', back: '$\cos\alpha\cos\beta \mp \sin\alpha\sin\beta$', topic: Sum and difference formulas}
- {front: '$\tan(\alpha \pm \beta)$', back: '$\dfrac{\tan\alpha \pm \tan\beta}{1 \mp \tan\alpha\tan\beta}$', topic: Sum and difference formulas}
- {front: '$\cos 15^\circ$ and $\sin 15^\circ$', back: '$\tfrac{\sqrt6 + \sqrt2}{4}$ and $\tfrac{\sqrt6 - \sqrt2}{4}$', topic: Sum and difference formulas}
- {front: '$\tan 15^\circ$ and $\tan 75^\circ$', back: '$2 - \sqrt3$ and $2 + \sqrt3$', topic: Sum and difference formulas}
- {front: '$a\sin x + b\cos x$ as one sinusoid', back: '$R\sin(x + \varphi)$, $R = \sqrt{a^2 + b^2}$, $\cos\varphi = \tfrac{a}{R}$, $\sin\varphi = \tfrac{b}{R}$', topic: Sum and difference formulas}
- {front: '$\sin 2x$', back: '$2\sin x\cos x$', topic: Double-angle formulas}
- {front: '$\cos 2x$ (three forms)', back: '$\cos^2 x - \sin^2 x = 2\cos^2 x - 1 = 1 - 2\sin^2 x$', topic: Double-angle formulas}
- {front: '$\tan 2x$', back: '$\dfrac{2\tan x}{1 - \tan^2 x}$', topic: Double-angle formulas}
- {front: 'Power reducing: $\sin^2 x$ and $\cos^2 x$', back: '$\tfrac{1 - \cos 2x}{2}$ and $\tfrac{1 + \cos 2x}{2}$', topic: Double-angle formulas}
- {front: '$\cos 3x$ in terms of $\cos x$', back: '$4\cos^3 x - 3\cos x$', topic: Double-angle formulas}
- {front: 'Projectile range', back: '$R = \tfrac{v^2\sin 2\theta}{g}$, largest at $\theta = 45^\circ$', topic: Double-angle formulas}
- {front: 'Half-angle: $\sin\tfrac{\theta}{2}$ and $\cos\tfrac{\theta}{2}$', back: '$\pm\sqrt{\tfrac{1 - \cos\theta}{2}}$ and $\pm\sqrt{\tfrac{1 + \cos\theta}{2}}$', topic: Half-angle formulas}
- {front: 'Half-angle: $\tan\tfrac{\theta}{2}$', back: '$\tfrac{1 - \cos\theta}{\sin\theta} = \tfrac{\sin\theta}{1 + \cos\theta}$ (no $\pm$)', topic: Half-angle formulas}
- {front: 'Sign in a half-angle formula', back: 'From the quadrant of $\tfrac{\theta}{2}$, not of $\theta$.', topic: Half-angle formulas}
- {front: '$\sin 22.5^\circ$ and $\cos 22.5^\circ$', back: '$\tfrac{\sqrt{2 - \sqrt2}}{2}$ and $\tfrac{\sqrt{2 + \sqrt2}}{2}$', topic: Half-angle formulas}
- {front: '$\tan\tfrac{\pi}{8}$', back: '$\sqrt2 - 1$', topic: Half-angle formulas}
- {front: '$\sin\alpha\cos\beta$', back: '$\tfrac12[\sin(\alpha + \beta) + \sin(\alpha - \beta)]$', topic: Product-to-sum formulas}
- {front: '$\cos\alpha\cos\beta$', back: '$\tfrac12[\cos(\alpha - \beta) + \cos(\alpha + \beta)]$', topic: Product-to-sum formulas}
- {front: '$\sin\alpha\sin\beta$', back: '$\tfrac12[\cos(\alpha - \beta) - \cos(\alpha + \beta)]$', topic: Product-to-sum formulas}
- {front: '$\sin u + \sin v$', back: '$2\sin\tfrac{u + v}{2}\cos\tfrac{u - v}{2}$', topic: Product-to-sum formulas}
- {front: '$\cos u + \cos v$', back: '$2\cos\tfrac{u + v}{2}\cos\tfrac{u - v}{2}$', topic: Product-to-sum formulas}
- {front: '$\cos u - \cos v$', back: '$-2\sin\tfrac{u + v}{2}\sin\tfrac{u - v}{2}$', topic: Product-to-sum formulas}
- {front: 'Beat frequency', back: 'The difference of the two frequencies (440 Hz and 444 Hz give 4 beats per second).', topic: Product-to-sum formulas}
# Oblique triangles
- {front: 'Law of sines', back: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C}$', topic: Law of sines}
- {front: 'Law of cosines', back: '$c^2 = a^2 + b^2 - 2ab\cos C$', topic: Law of cosines}
- {front: 'Angle from three sides', back: '$\cos C = \dfrac{a^2 + b^2 - c^2}{2ab}$', topic: Law of cosines}
- {front: 'Which law? AAS or ASA', back: 'Find the third angle, then use the law of sines.', topic: Law of sines}
- {front: 'Which law? SAS', back: 'Law of cosines for the third side.', topic: Law of cosines}
- {front: 'Which law? SSS', back: 'Law of cosines, largest angle first.', topic: Law of cosines}
- {front: 'Which law? SSA', back: 'Law of sines, then check for 0, 1 or 2 triangles.', topic: Ambiguous case}
- {front: 'SSA with $A$ acute: number of triangles', back: '$h = b\sin A$. None if $a < h$; one if $a = h$; two if $h < a < b$; one if $a \ge b$.', topic: Ambiguous case}
- {front: 'SSA with $A$ obtuse', back: 'One triangle if $a > b$; none if $a \le b$.', topic: Ambiguous case}
- {front: 'In SSA, $\sin B = k$ gives which candidates?', back: '$B_1 = \sin^{-1}k$ and $B_2 = 180^\circ - B_1$; keep those with $A + B < 180^\circ$.', topic: Ambiguous case}
- {front: 'Why find the largest angle with the law of cosines?', back: 'It may be obtuse, and $\sin^{-1}$ only returns acute angles; $\cos^{-1}$ handles obtuse angles.', topic: Law of cosines}
- {front: 'Triangle area (SAS)', back: '$\tfrac12 ab\sin C$', topic: Triangle area}
- {front: 'Heron''s formula', back: '$\sqrt{s(s-a)(s-b)(s-c)}$, $s = \tfrac{a + b + c}{2}$', topic: Triangle area}
- {front: 'Area from one side and all angles', back: '$\dfrac{a^2\sin B\sin C}{2\sin A}$', topic: Triangle area}
- {front: 'Parallelogram area with sides $a$, $b$ and angle $\theta$', back: '$ab\sin\theta$', topic: Triangle area}
# Vectors
- {front: 'Vector from $P(x_1, y_1)$ to $Q(x_2, y_2)$', back: '$\langle x_2 - x_1, y_2 - y_1\rangle$', topic: Vectors}
- {front: 'Magnitude of $\langle a, b\rangle$', back: '$\sqrt{a^2 + b^2}$', topic: Vectors}
- {front: 'Vector from magnitude $m$ and direction $\theta$', back: '$\langle m\cos\theta, m\sin\theta\rangle$', topic: Vectors}
- {front: 'Direction angle of $\langle a, b\rangle$', back: '$\tan\theta = \tfrac{b}{a}$, placed in the quadrant of $(a, b)$', topic: Vectors}
- {front: 'Unit vector in the direction of $\mathbf{v}$', back: '$\dfrac{\mathbf{v}}{\lVert\mathbf{v}\rVert}$', topic: Vectors}
- {front: 'Standard unit vectors', back: '$\mathbf{i} = \langle 1, 0\rangle$, $\mathbf{j} = \langle 0, 1\rangle$; $\langle a, b\rangle = a\mathbf{i} + b\mathbf{j}$', topic: Vectors}
- {front: 'Dot product', back: '$\mathbf{u}\cdot\mathbf{v} = u_1v_1 + u_2v_2 = \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert\cos\theta$', topic: Dot product}
- {front: 'Angle between two vectors', back: '$\cos\theta = \dfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert}$', topic: Dot product}
- {front: 'Test for orthogonal vectors', back: '$\mathbf{u}\cdot\mathbf{v} = 0$', topic: Dot product}
- {front: 'Vector projection of $\mathbf{u}$ onto $\mathbf{v}$', back: '$\dfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{v}\rVert^2}\mathbf{v}$', topic: Dot product}
- {front: 'Sign of the dot product (nonzero vectors)', back: 'Positive: acute angle. Zero: right angle. Negative: obtuse angle.', topic: Dot product}
- {front: 'Work done by a constant force', back: '$W = \mathbf{F}\cdot\mathbf{D} = \lVert\mathbf{F}\rVert\lVert\mathbf{D}\rVert\cos\theta$', topic: Vector applications}
- {front: 'Object on a ramp of angle $\theta$', back: 'Along the ramp: $W\sin\theta$. Into the ramp: $W\cos\theta$.', topic: Vector applications}
- {front: 'Ground velocity of a plane', back: 'Air velocity + wind velocity (as vectors)', topic: Vector applications}
- {front: 'Bearing to direction angle', back: 'Direction angle $= 90^\circ - \text{bearing}$ (add $360^\circ$ if negative).', topic: Vector applications}
- {front: '"Wind from the west"', back: 'Blows toward the east: $\langle w, 0\rangle$.', topic: Vector applications}
- {front: 'Equilibrium', back: 'The forces sum to the zero vector: horizontal and vertical components each total 0.', topic: Vector applications}
# Polar
- {front: 'Polar to rectangular', back: '$x = r\cos\theta$, $y = r\sin\theta$', topic: Polar coordinates}
- {front: 'Rectangular to polar', back: '$r = \sqrt{x^2 + y^2}$, $\tan\theta = \tfrac{y}{x}$ with the quadrant checked', topic: Polar coordinates}
- {front: 'Other names for the polar point $(r, \theta)$', back: '$(r, \theta + 2k\pi)$ and $(-r, \theta + \pi)$', topic: Polar coordinates}
- {front: 'Polar equation $r = 2a\cos\theta$', back: 'A circle of radius $|a|$ through the pole, centered at $(a, 0)$', topic: Polar graphs}
- {front: 'Rose $r = a\cos n\theta$: petals', back: '$n$ petals if $n$ is odd, $2n$ if $n$ is even; length $|a|$', topic: Polar graphs}
- {front: 'Limaçon $r = a + b\cos\theta$ shapes', back: '$a < b$: inner loop. $a = b$: cardioid. $b < a < 2b$: dimpled. $a \ge 2b$: convex.', topic: Polar graphs}
- {front: 'Lemniscate', back: '$r^2 = a^2\cos 2\theta$ or $r^2 = a^2\sin 2\theta$: a figure eight through the pole', topic: Polar graphs}
- {front: 'Polar symmetry tests', back: '$\theta \to -\theta$: polar axis. $\theta \to \pi - \theta$: line $\theta = \tfrac{\pi}{2}$. $r \to -r$: pole.', topic: Polar graphs}
# Complex numbers
- {front: 'Modulus of $a + bi$', back: '$\sqrt{a^2 + b^2}$', topic: Trigonometric form of complex numbers}
- {front: 'Trigonometric form', back: '$z = r(\cos\theta + i\sin\theta) = r\operatorname{cis}\theta$', topic: Trigonometric form of complex numbers}
- {front: 'Product in trigonometric form', back: '$r_1r_2\operatorname{cis}(\theta_1 + \theta_2)$: multiply moduli, add arguments', topic: Trigonometric form of complex numbers}
- {front: 'Quotient in trigonometric form', back: '$\tfrac{r_1}{r_2}\operatorname{cis}(\theta_1 - \theta_2)$: divide moduli, subtract arguments', topic: Trigonometric form of complex numbers}
- {front: 'Multiplying by $i$', back: 'Rotates $90^\circ$ counterclockwise about the origin.', topic: Trigonometric form of complex numbers}
- {front: '$-2 + 2\sqrt3\,i$ in trigonometric form', back: '$4\operatorname{cis}120^\circ$', topic: Trigonometric form of complex numbers}
- {front: 'De Moivre''s theorem', back: '$\left[r\operatorname{cis}\theta\right]^n = r^n\operatorname{cis}(n\theta)$', topic: De Moivre's theorem}
- {front: '$n$th roots of $r\operatorname{cis}\theta$', back: '$\sqrt[n]{r}\operatorname{cis}\dfrac{\theta + 2k\pi}{n}$, $k = 0, \ldots, n - 1$', topic: De Moivre's theorem}
- {front: 'Spacing of the $n$th roots', back: '$\tfrac{360^\circ}{n}$ apart on a circle of radius $\sqrt[n]{r}$: a regular $n$-gon', topic: De Moivre's theorem}
- {front: '$(1 + i)^8$', back: '$16$', topic: De Moivre's theorem}
- {front: 'Cube roots of $8i$', back: '$\sqrt3 + i$, $-\sqrt3 + i$, $-2i$', topic: De Moivre's theorem}
- {front: 'Sixth roots of unity', back: '$\operatorname{cis}(60^\circ k)$: $\pm1$, $\pm\tfrac12 \pm \tfrac{\sqrt3}{2}i$', topic: De Moivre's theorem}
