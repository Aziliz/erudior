# Glossary: every bolded term, plus notation and abbreviations
- term: angle
  aliases: [angles]
  definition: 'A rotation of a ray about its endpoint, from an initial side to a terminal side. Counterclockwise rotations are positive.'
  topic: Angles
- term: initial side
  definition: 'The starting position of the ray that forms an angle; in standard position it lies along the positive $x$-axis.'
  topic: Angles
- term: terminal side
  definition: 'The final position of the ray that forms an angle.'
  topic: Angles
- term: vertex
  aliases: [vertices]
  definition: 'The common endpoint of the two sides of an angle; also a corner of a triangle or polygon.'
  topic: Angles
- term: positive angle
  definition: 'An angle formed by a counterclockwise rotation.'
  topic: Angles
- term: negative angle
  definition: 'An angle formed by a clockwise rotation.'
  topic: Angles
- term: standard position
  definition: 'An angle with its vertex at the origin and its initial side on the positive $x$-axis.'
  topic: Angles
- term: quadrantal angle
  aliases: [quadrantal angles]
  definition: 'An angle in standard position whose terminal side lies on an axis, such as $0^\circ$, $90^\circ$, $180^\circ$ or $270^\circ$.'
  topic: Angles
- term: degree
  aliases: [degrees]
  definition: 'A unit of angle measure equal to $\tfrac{1}{360}$ of a full rotation.'
  topic: Degree measure
- term: acute angle
  definition: 'An angle between $0^\circ$ and $90^\circ$.'
  topic: Angles
- term: right angle
  definition: 'An angle of exactly $90^\circ$ (a quarter turn).'
  topic: Angles
- term: obtuse angle
  definition: 'An angle between $90^\circ$ and $180^\circ$.'
  topic: Angles
- term: straight angle
  definition: 'An angle of exactly $180^\circ$ (a half turn).'
  topic: Angles
- term: complementary
  aliases: [complementary angles, complement]
  definition: 'Two positive angles are complementary if their measures add to $90^\circ$.'
  topic: Angles
- term: supplementary
  aliases: [supplementary angles, supplement]
  definition: 'Two positive angles are supplementary if their measures add to $180^\circ$.'
  topic: Angles
- term: minute
  aliases: [minutes]
  definition: 'One sixtieth of a degree: $1^\circ = 60''$.'
  topic: Degree measure
- term: second
  aliases: [seconds]
  definition: 'One sixtieth of a minute of angle: $1'' = 60''''$, so $1^\circ = 3600''''$.'
  topic: Degree measure
- term: DMS
  aliases: [degrees–minutes–seconds, degrees-minutes-seconds, degrees–minutes–seconds (DMS)]
  definition: 'Degrees–minutes–seconds notation for angles, such as $47^\circ\,21''\,36''''$.'
  topic: Degree measure
- term: coterminal angles
  aliases: [coterminal]
  definition: 'Angles in standard position with the same terminal side; they differ by a multiple of $360^\circ$ ($2\pi$).'
  topic: Angles
- term: central angle
  definition: 'An angle whose vertex is at the center of a circle.'
  topic: Radian measure
- term: radian
  aliases: [radians, rad]
  definition: 'The central angle that subtends an arc equal in length to the radius. $\pi$ radians $= 180^\circ$.'
  topic: Radian measure
- term: arc
  definition: 'The part of a circle between two points on it.'
  topic: Arc length
- term: arc length
  definition: 'The length of an arc: $s = r\theta$ with $\theta$ in radians.'
  topic: Arc length
- term: chord
  definition: 'The straight segment joining two points of a circle; always shorter than the arc between them.'
  topic: Arc length
- term: sector
  definition: 'The pie-shaped region bounded by two radii and the arc between them; area $\tfrac12 r^2\theta$.'
  topic: Sector area
- term: angular speed
  definition: 'Angle swept per unit time, $\omega = \theta/t$, usually in radians per second or per minute.'
  topic: Angular and linear speed
- term: linear speed
  definition: 'Distance traveled along a path per unit time, $v = s/t$. For circular motion $v = r\omega$.'
  topic: Angular and linear speed
- term: rpm
  aliases: [revolutions per minute, revolutions per minute (rpm)]
  definition: 'Revolutions per minute, an angular speed. Multiply by $2\pi$ to get radians per minute.'
  topic: Angular and linear speed
- term: similar
  aliases: [similar triangles]
  definition: 'Triangles with equal corresponding angles; their corresponding sides are proportional.'
  topic: Trig ratios
- term: hypotenuse
  definition: 'The side of a right triangle opposite the right angle; the longest side.'
  topic: Trig ratios
- term: opposite side
  definition: 'In a right triangle, the leg across from the acute angle being considered.'
  topic: Trig ratios
- term: adjacent side
  definition: 'In a right triangle, the leg that forms the acute angle being considered (not the hypotenuse).'
  topic: Trig ratios
- term: sine
  aliases: [sin]
  definition: 'In a right triangle, opposite over hypotenuse. For any angle, $y/r$; on the unit circle, the $y$-coordinate.'
  topic: Trig ratios
- term: cosine
  aliases: [cos]
  definition: 'In a right triangle, adjacent over hypotenuse. For any angle, $x/r$; on the unit circle, the $x$-coordinate.'
  topic: Trig ratios
- term: tangent
  aliases: [tan]
  definition: 'In a right triangle, opposite over adjacent; in general $\tan\theta = \tfrac{\sin\theta}{\cos\theta} = \tfrac{y}{x}$.'
  topic: Trig ratios
- term: cosecant
  aliases: [csc]
  definition: 'The reciprocal of sine: $\csc\theta = \tfrac{1}{\sin\theta}$ (hypotenuse over opposite).'
  topic: Trig ratios
- term: secant
  aliases: [sec]
  definition: 'The reciprocal of cosine: $\sec\theta = \tfrac{1}{\cos\theta}$ (hypotenuse over adjacent).'
  topic: Trig ratios
- term: cotangent
  aliases: [cot]
  definition: 'The reciprocal of tangent: $\cot\theta = \tfrac{1}{\tan\theta} = \tfrac{\cos\theta}{\sin\theta}$ (adjacent over opposite).'
  topic: Trig ratios
- term: SOH-CAH-TOA
  definition: 'Mnemonic: Sine = Opposite/Hypotenuse, Cosine = Adjacent/Hypotenuse, Tangent = Opposite/Adjacent.'
  topic: Trig ratios
- term: reciprocal
  definition: 'The reciprocal of a nonzero number $x$ is $\tfrac1x$. Cosecant, secant and cotangent are the reciprocals of sine, cosine and tangent.'
  topic: Trig ratios
- term: Pythagorean theorem
  definition: 'In a right triangle with legs $a$, $b$ and hypotenuse $c$: $a^2 + b^2 = c^2$.'
  topic: Trig ratios
- term: Pythagorean triple
  aliases: [Pythagorean triples]
  definition: 'Three whole numbers that satisfy $a^2 + b^2 = c^2$, such as 3, 4, 5 or 5, 12, 13.'
  topic: Trig ratios
- term: exact value
  aliases: [exact values]
  definition: 'A value written with integers, fractions, radicals and $\pi$, not rounded, such as $\tfrac{\sqrt3}{2}$.'
  topic: Special angles
- term: 45°–45°–90° triangle
  aliases: [45-45-90 triangle]
  definition: 'An isosceles right triangle; its sides are in the ratio $1 : 1 : \sqrt2$.'
  topic: Special angles
- term: 30°–60°–90° triangle
  aliases: [30-60-90 triangle]
  definition: 'Half of an equilateral triangle; sides in the ratio $1 : \sqrt3 : 2$ (short leg : long leg : hypotenuse).'
  topic: Special angles
- term: cofunctions
  aliases: [cofunction]
  definition: 'Pairs of functions related by complementary angles: sine and cosine, tangent and cotangent, secant and cosecant.'
  topic: Cofunctions
- term: cofunction identities
  definition: 'A function of $\theta$ equals its cofunction of the complement: $\sin\theta = \cos(90^\circ - \theta)$, $\tan\theta = \cot(90^\circ - \theta)$, $\sec\theta = \csc(90^\circ - \theta)$.'
  topic: Cofunctions
- term: solve a triangle
  aliases: [solving a triangle]
  definition: 'Find all three sides and all three angles of a triangle from the parts that are given.'
  topic: Solving right triangles
- term: inverse trig
  aliases: [inverse trig function, inverse trigonometric function, inverse trig functions]
  definition: 'Functions such as $\sin^{-1}$, $\cos^{-1}$, $\tan^{-1}$ that take a ratio and return an angle.'
  topic: Inverse trig functions
- term: line of sight
  definition: 'The straight line from an observer''s eye to the object being viewed.'
  topic: Elevation and depression
- term: angle of elevation
  definition: 'The angle from the horizontal up to the line of sight of an object above the observer.'
  topic: Elevation and depression
- term: angle of depression
  definition: 'The angle from the horizontal down to the line of sight of an object below the observer.'
  topic: Elevation and depression
- term: bearing
  aliases: [bearings]
  definition: 'A direction given relative to north or south: either clockwise from north in three digits ($125^\circ$) or as N/S, an acute angle, then E/W (S $55^\circ$ E).'
  topic: Bearings
- term: three-digit bearing
  aliases: [true bearing, Three-digit (true) bearing]
  definition: 'A bearing measured clockwise from north and written with three digits, such as $040^\circ$ or $200^\circ$.'
  topic: Bearings
- term: compass bearing
  aliases: [quadrant bearing, Quadrant (compass) bearing]
  definition: 'A bearing written as N or S, an acute angle, then E or W, such as N $35^\circ$ E.'
  topic: Bearings
- term: ASTC
  aliases: [All Students Take Calculus]
  definition: 'Mnemonic for signs: All functions positive in quadrant I, Sine in II, Tangent in III, Cosine in IV (with their reciprocals).'
  topic: Trig functions of any angle
- term: quadrant
  aliases: [quadrants]
  definition: 'One of the four regions of the plane cut out by the axes, numbered I to IV counterclockwise from the upper right.'
  topic: Trig functions of any angle
- term: reference angle
  aliases: [reference angles]
  definition: 'The acute angle between the terminal side of an angle and the $x$-axis.'
  topic: Reference angles
- term: unit circle
  definition: 'The circle $x^2 + y^2 = 1$. The point at angle $t$ is $(\cos t, \sin t)$.'
  topic: Unit circle
- term: circular functions
  definition: 'Sine, cosine and the others viewed as functions of a real number $t$, the arc length along the unit circle.'
  topic: Unit circle
- term: terminal point
  definition: 'The point on the unit circle reached by traveling a distance $t$ from $(1, 0)$; its coordinates are $(\cos t, \sin t)$. For a vector, the head (ending point) of the arrow.'
  topic: Unit circle
- term: domain
  definition: 'The set of inputs for which a function is defined.'
  topic: Properties of trig functions
- term: range
  definition: 'The set of output values a function takes.'
  topic: Properties of trig functions
- term: periodic
  aliases: [periodic function]
  definition: 'A function is periodic if $f(t + p) = f(t)$ for some $p > 0$ and all $t$ in its domain.'
  topic: Properties of trig functions
- term: period
  definition: 'The smallest positive $p$ with $f(t + p) = f(t)$; $2\pi$ for sine and cosine, $\pi$ for tangent. For $\sin Bx$ it is $\tfrac{2\pi}{|B|}$.'
  topic: Properties of trig functions
- term: even function
  aliases: [even]
  definition: 'A function with $f(-x) = f(x)$; its graph is symmetric about the $y$-axis. Cosine and secant are even.'
  topic: Properties of trig functions
- term: odd function
  aliases: [odd]
  definition: 'A function with $f(-x) = -f(x)$; its graph is symmetric about the origin. Sine, tangent, cosecant and cotangent are odd.'
  topic: Properties of trig functions
- term: cycle
  definition: 'One complete repetition of a periodic graph, spanning one period.'
  topic: Graphs of sine and cosine
- term: key points
  definition: 'The five points that divide one cycle of a sinusoid into quarters: the midline crossings, the maximum and the minimum.'
  topic: Graphs of sine and cosine
- term: zeros
  aliases: [zero, x-intercepts]
  definition: 'Inputs where a function equals 0; where its graph crosses the $x$-axis.'
  topic: Graphs of sine and cosine
- term: sinusoid
  aliases: [sinusoids, sinusoidal]
  definition: 'Any graph of the form $y = A\sin(B(x - C)) + D$ or the cosine version: a stretched, shifted sine wave.'
  topic: Graphs of sine and cosine
- term: amplitude
  definition: 'For a sinusoid, $|A|$: half the distance from the minimum to the maximum.'
  topic: Sinusoidal transformations
- term: reflection
  definition: 'A flip of a graph across a line; a negative $A$ reflects a sinusoid across its midline.'
  topic: Graphs of sine and cosine
- term: frequency
  definition: 'Number of cycles per unit of the input variable; the reciprocal of the period. In hertz (Hz) when time is in seconds.'
  topic: Sinusoidal transformations
- term: phase shift
  definition: 'The horizontal shift $C$ of $y = A\sin(B(x - C)) + D$; for $\sin(Bx - c)$ it is $\tfrac{c}{B}$.'
  topic: Sinusoidal transformations
- term: midline
  definition: 'The horizontal line $y = D$ halfway between the maximum and minimum of a sinusoid.'
  topic: Sinusoidal transformations
- term: vertical shift
  definition: 'The constant $D$ added to a sinusoid, moving the graph up or down.'
  topic: Sinusoidal transformations
- term: vertical asymptote
  aliases: [vertical asymptotes, asymptote, asymptotes]
  definition: 'A vertical line $x = a$ that a graph approaches but never reaches, with the function growing without bound.'
  topic: Graphs of tangent and cotangent
- term: local minimum
  definition: 'A point where a function is lower than at all nearby points (not necessarily lowest overall).'
  topic: Graphs of secant and cosecant
- term: local maximum
  definition: 'A point where a function is higher than at all nearby points (not necessarily highest overall).'
  topic: Graphs of secant and cosecant
- term: equilibrium
  definition: 'The rest position of an oscillating object; for forces, the state in which the forces on an object sum to zero.'
  topic: Simple harmonic motion
- term: simple harmonic motion
  definition: 'Oscillation described by $d = a\sin\omega t$ or $d = a\cos\omega t$, with amplitude $|a|$ and period $\tfrac{2\pi}{\omega}$.'
  topic: Simple harmonic motion
- term: damped harmonic motion
  definition: 'Oscillation whose amplitude shrinks over time, such as $d = ae^{-kt}\cos\omega t$.'
  topic: Simple harmonic motion
- term: hertz
  aliases: [Hz]
  definition: 'Unit of frequency: one cycle per second.'
  topic: Simple harmonic motion
- term: one-to-one
  definition: 'A function in which each output comes from exactly one input; only one-to-one functions have inverses.'
  topic: Inverse trig functions
- term: restrict the domain
  aliases: [restricted domain]
  definition: 'Use only part of a function''s domain so that the function becomes one-to-one and has an inverse.'
  topic: Inverse trig functions
- term: inverse sine
  aliases: [arcsine, arcsin]
  definition: '$\sin^{-1}x$: the angle in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ whose sine is $x$; domain $[-1, 1]$.'
  topic: Inverse trig functions
- term: inverse cosine
  aliases: [arccosine, arccos]
  definition: '$\cos^{-1}x$: the angle in $[0, \pi]$ whose cosine is $x$; domain $[-1, 1]$.'
  topic: Inverse trig functions
- term: inverse tangent
  aliases: [arctangent, arctan]
  definition: '$\tan^{-1}x$: the angle in $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$ whose tangent is $x$; domain all reals.'
  topic: Inverse trig functions
- term: inverse secant
  aliases: [arcsecant]
  definition: '$\sec^{-1}x = \cos^{-1}\tfrac1x$ for $|x| \ge 1$; range $[0, \pi]$ excluding $\tfrac{\pi}{2}$ (some calculus texts use $\left[0, \tfrac{\pi}{2}\right) \cup \left[\pi, \tfrac{3\pi}{2}\right)$ instead).'
  topic: Inverse compositions
- term: inverse cosecant
  aliases: [arccosecant]
  definition: '$\csc^{-1}x = \sin^{-1}\tfrac1x$ for $|x| \ge 1$; range $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ excluding 0.'
  topic: Inverse compositions
- term: inverse cotangent
  aliases: [arccotangent]
  definition: '$\cot^{-1}x = \tfrac{\pi}{2} - \tan^{-1}x$, with range $(0, \pi)$.'
  topic: Inverse compositions
- term: undefined
  definition: 'Having no value; for trig functions, the result of a zero denominator (as in $\tan 90^\circ$) or an input outside the domain (as in $\sin^{-1}2$).'
  topic: Inverse trig functions
- term: trigonometric equation
  aliases: [trig equation, trig equations]
  definition: 'An equation involving trig functions of an unknown angle, true only for certain values.'
  topic: Trig equations
- term: general solution
  definition: 'A formula listing every solution of a trig equation, such as $x = \tfrac{\pi}{6} + 2k\pi$ or $\tfrac{5\pi}{6} + 2k\pi$.'
  topic: Trig equations
- term: identity
  aliases: [identities]
  definition: 'An equation that is true for every value of the variable for which both sides are defined.'
  topic: Fundamental identities
- term: reciprocal identities
  definition: '$\csc x = \tfrac{1}{\sin x}$, $\sec x = \tfrac{1}{\cos x}$, $\cot x = \tfrac{1}{\tan x}$.'
  topic: Fundamental identities
- term: quotient identities
  definition: '$\tan x = \tfrac{\sin x}{\cos x}$ and $\cot x = \tfrac{\cos x}{\sin x}$.'
  topic: Fundamental identities
- term: Pythagorean identities
  definition: '$\sin^2 x + \cos^2 x = 1$, $1 + \tan^2 x = \sec^2 x$, $1 + \cot^2 x = \csc^2 x$.'
  topic: Fundamental identities
- term: even–odd identities
  aliases: [even-odd identities]
  definition: '$\cos(-x) = \cos x$ and $\sec(-x) = \sec x$; $\sin(-x) = -\sin x$, $\tan(-x) = -\tan x$, and likewise for $\csc$ and $\cot$.'
  topic: Fundamental identities
- term: simplify
  definition: 'Rewrite a trig expression with fewer terms or functions, using identities and algebra.'
  topic: Fundamental identities
- term: verify
  aliases: [verifying an identity]
  definition: 'Show that an identity holds by transforming one side step by step into the other.'
  topic: Verifying identities
- term: conjugate
  definition: 'For an expression $a + b$, the expression $a - b$; multiplying $1 - \sin x$ by its conjugate $1 + \sin x$ gives $\cos^2 x$. For a complex number $a + bi$, the conjugate is $a - bi$.'
  topic: Verifying identities
- term: sum formulas
  aliases: [sum formula]
  definition: '$\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$, $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$, and the tangent version.'
  topic: Sum and difference formulas
- term: difference formulas
  aliases: [difference formula]
  definition: '$\sin(\alpha - \beta) = \sin\alpha\cos\beta - \cos\alpha\sin\beta$, $\cos(\alpha - \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta$, and the tangent version.'
  topic: Sum and difference formulas
- term: double-angle formulas
  aliases: [double-angle formula]
  definition: '$\sin 2x = 2\sin x\cos x$, $\cos 2x = \cos^2 x - \sin^2 x = 2\cos^2 x - 1 = 1 - 2\sin^2 x$, $\tan 2x = \tfrac{2\tan x}{1 - \tan^2 x}$.'
  topic: Double-angle formulas
- term: power-reducing formulas
  aliases: [power-reducing formula]
  definition: '$\sin^2 x = \tfrac{1 - \cos 2x}{2}$ and $\cos^2 x = \tfrac{1 + \cos 2x}{2}$.'
  topic: Double-angle formulas
- term: half-angle formulas
  aliases: [half-angle formula]
  definition: '$\sin\tfrac{\theta}{2} = \pm\sqrt{\tfrac{1 - \cos\theta}{2}}$, $\cos\tfrac{\theta}{2} = \pm\sqrt{\tfrac{1 + \cos\theta}{2}}$, $\tan\tfrac{\theta}{2} = \tfrac{1 - \cos\theta}{\sin\theta}$; sign from the quadrant of $\tfrac{\theta}{2}$.'
  topic: Half-angle formulas
- term: product-to-sum formulas
  aliases: [product-to-sum formula]
  definition: 'Formulas rewriting products like $\sin\alpha\cos\beta$ as $\tfrac12[\sin(\alpha + \beta) + \sin(\alpha - \beta)]$.'
  topic: Product-to-sum formulas
- term: sum-to-product formulas
  aliases: [sum-to-product formula]
  definition: 'Formulas rewriting sums like $\sin u + \sin v$ as $2\sin\tfrac{u + v}{2}\cos\tfrac{u - v}{2}$.'
  topic: Product-to-sum formulas
- term: beats
  definition: 'The pulsing loudness heard when two tones of nearly equal frequency combine; the beat frequency is the difference of the two frequencies.'
  topic: Product-to-sum formulas
- term: extraneous solution
  aliases: [extraneous solutions]
  definition: 'A value that solves a transformed equation (for example after squaring) but not the original equation.'
  topic: Trig equations with identities
- term: oblique triangle
  aliases: [oblique triangles]
  definition: 'A triangle with no right angle.'
  topic: Law of sines
- term: AAS
  definition: 'Angle–angle–side: two angles and a side not between them are known.'
  topic: Law of sines
- term: ASA
  definition: 'Angle–side–angle: two angles and the side between them are known.'
  topic: Law of sines
- term: SSA
  definition: 'Side–side–angle: two sides and an angle opposite one of them are known; may give 0, 1 or 2 triangles.'
  topic: Ambiguous case
- term: SAS
  definition: 'Side–angle–side: two sides and the angle between them are known; solve with the law of cosines.'
  topic: Law of cosines
- term: SSS
  definition: 'Side–side–side: all three sides are known; solve with the law of cosines.'
  topic: Law of cosines
- term: law of sines
  definition: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C}$ in any triangle.'
  topic: Law of sines
- term: ambiguous case
  definition: 'The SSA situation, in which the given data may fit no triangle, one triangle or two triangles.'
  topic: Ambiguous case
- term: height
  aliases: [altitude]
  definition: 'The perpendicular distance from a vertex to the opposite side (or its extension). In SSA problems, $h = b\sin A$.'
  topic: Ambiguous case
- term: law of cosines
  definition: '$c^2 = a^2 + b^2 - 2ab\cos C$ (and its rotations) in any triangle.'
  topic: Law of cosines
- term: semiperimeter
  definition: 'Half the perimeter of a triangle: $s = \tfrac{a + b + c}{2}$.'
  topic: Triangle area
- term: Heron's formula
  definition: 'Area of a triangle from its sides: $\sqrt{s(s - a)(s - b)(s - c)}$, where $s$ is the semiperimeter.'
  topic: Triangle area
- term: scalar
  aliases: [scalars]
  definition: 'A quantity described by a single number (size only), such as mass or temperature.'
  topic: Vectors
- term: vector
  aliases: [vectors]
  definition: 'A quantity with both magnitude and direction, drawn as an arrow and written $\langle a, b\rangle$.'
  topic: Vectors
- term: initial point
  definition: 'The tail (starting point) of a vector arrow.'
  topic: Vectors
- term: terminal point of a vector
  definition: 'The head (ending point) of a vector arrow. Components are terminal minus initial.'
  topic: Vectors
- term: magnitude
  definition: 'The length of a vector: $\lVert\langle a, b\rangle\rVert = \sqrt{a^2 + b^2}$.'
  topic: Vectors
- term: equivalent vectors
  definition: 'Vectors with the same magnitude and direction, wherever they are drawn.'
  topic: Vectors
- term: component form
  aliases: [components]
  definition: 'Writing a vector as $\langle a, b\rangle$, its horizontal and vertical components.'
  topic: Vectors
- term: direction angle
  definition: 'The angle from the positive $x$-axis, counterclockwise, to a vector.'
  topic: Vectors
- term: resultant
  aliases: [resultant force]
  definition: 'The sum of two or more vectors, such as the combined effect of several forces.'
  topic: Vectors
- term: scalar multiplication
  definition: 'Multiplying a vector by a number: $k\langle a, b\rangle = \langle ka, kb\rangle$; stretches by $|k|$ and reverses if $k < 0$.'
  topic: Vectors
- term: zero vector
  definition: 'The vector $\langle 0, 0\rangle$, with magnitude 0 and no direction.'
  topic: Vectors
- term: unit vector
  aliases: [unit vectors]
  definition: 'A vector of magnitude 1; $\tfrac{\mathbf{v}}{\lVert\mathbf{v}\rVert}$ is the unit vector in the direction of $\mathbf{v}$.'
  topic: Vectors
- term: standard unit vectors
  aliases: [i and j]
  definition: '$\mathbf{i} = \langle 1, 0\rangle$ and $\mathbf{j} = \langle 0, 1\rangle$; every vector is $a\mathbf{i} + b\mathbf{j}$.'
  topic: Vectors
- term: dot product
  definition: '$\mathbf{u}\cdot\mathbf{v} = u_1v_1 + u_2v_2 = \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert\cos\theta$, a scalar.'
  topic: Dot product
- term: orthogonal
  definition: 'Perpendicular; two vectors are orthogonal when their dot product is 0.'
  topic: Dot product
- term: vector projection
  aliases: [projection]
  definition: '$\text{proj}_{\mathbf{v}}\mathbf{u} = \dfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{v}\rVert^2}\mathbf{v}$, the part of $\mathbf{u}$ along $\mathbf{v}$.'
  topic: Dot product
- term: scalar projection
  aliases: [component of u along v]
  definition: 'The signed length $\dfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{v}\rVert} = \lVert\mathbf{u}\rVert\cos\theta$ of the projection of $\mathbf{u}$ onto $\mathbf{v}$.'
  topic: Dot product
- term: heading
  definition: 'The direction in which a plane or ship is pointed, usually given as a bearing.'
  topic: Vector applications
- term: airspeed
  definition: 'A plane''s speed relative to the air around it.'
  topic: Vector applications
- term: ground speed
  definition: 'The magnitude of a plane''s velocity relative to the ground: air velocity plus wind velocity.'
  topic: Vector applications
- term: course
  aliases: [track]
  definition: 'The actual direction of travel over the ground, usually given as a bearing.'
  topic: Vector applications
- term: work
  definition: 'Force times distance along the motion: $W = \mathbf{F}\cdot\mathbf{D} = \lVert\mathbf{F}\rVert\lVert\mathbf{D}\rVert\cos\theta$; in joules for newtons and meters.'
  topic: Vector applications
- term: pole
  definition: 'The origin of a polar coordinate system.'
  topic: Polar coordinates
- term: polar axis
  definition: 'The ray from the pole (the positive $x$-axis) from which polar angles are measured.'
  topic: Polar coordinates
- term: polar coordinates
  definition: 'A pair $(r, \theta)$ locating a point by rotating through $\theta$ and moving a directed distance $r$; $x = r\cos\theta$, $y = r\sin\theta$.'
  topic: Polar coordinates
- term: polar equation
  definition: 'An equation in $r$ and $\theta$, usually $r = f(\theta)$.'
  topic: Polar graphs
- term: cardioid
  definition: 'The heart-shaped limaçon $r = a(1 \pm \cos\theta)$ or $r = a(1 \pm \sin\theta)$.'
  topic: Polar graphs
- term: limaçon
  aliases: [limaçons, limacon]
  definition: 'A polar curve $r = a + b\cos\theta$ or $r = a + b\sin\theta$: inner loop if $a < b$, cardioid if $a = b$, dimpled or convex if $a > b$.'
  topic: Polar graphs
- term: rose curve
  aliases: [rose curves, rose]
  definition: '$r = a\cos n\theta$ or $r = a\sin n\theta$: $n$ petals if $n$ is odd, $2n$ if $n$ is even, each of length $|a|$.'
  topic: Polar graphs
- term: lemniscate
  aliases: [lemniscates]
  definition: 'A figure-eight polar curve such as $r^2 = a^2\cos 2\theta$.'
  topic: Polar graphs
- term: complex plane
  definition: 'The plane in which $a + bi$ is drawn as the point $(a, b)$: real part horizontal, imaginary part vertical.'
  topic: Trigonometric form of complex numbers
- term: real axis
  definition: 'The horizontal axis of the complex plane.'
  topic: Trigonometric form of complex numbers
- term: imaginary axis
  definition: 'The vertical axis of the complex plane.'
  topic: Trigonometric form of complex numbers
- term: modulus
  aliases: [moduli, absolute value of a complex number]
  definition: 'The distance from $a + bi$ to the origin: $|z| = \sqrt{a^2 + b^2}$.'
  topic: Trigonometric form of complex numbers
- term: argument
  definition: 'An angle $\theta$ from the positive real axis to the point $z$ in the complex plane; $\tan\theta = \tfrac{b}{a}$ with the quadrant checked.'
  topic: Trigonometric form of complex numbers
- term: trigonometric form
  aliases: [polar form]
  definition: 'Writing a complex number as $r(\cos\theta + i\sin\theta)$, with modulus $r$ and argument $\theta$.'
  topic: Trigonometric form of complex numbers
- term: cis
  definition: 'Shorthand for "$\cos + i\sin$": $\operatorname{cis}\theta = \cos\theta + i\sin\theta$.'
  topic: Trigonometric form of complex numbers
- term: complex number
  aliases: [complex numbers]
  definition: 'A number $a + bi$, where $a$ and $b$ are real and $i^2 = -1$.'
  topic: Trigonometric form of complex numbers
- term: De Moivre's theorem
  definition: '$\left[r\operatorname{cis}\theta\right]^n = r^n\operatorname{cis}(n\theta)$ for every positive integer $n$.'
  topic: De Moivre's theorem
- term: nth root
  aliases: [nth roots]
  definition: 'A number $w$ with $w^n = z$. A nonzero complex number has $n$ of them: $\sqrt[n]{r}\operatorname{cis}\tfrac{\theta + 2k\pi}{n}$, $k = 0, \ldots, n - 1$.'
  topic: De Moivre's theorem
- term: roots of unity
  definition: 'The $n$th roots of 1, $\operatorname{cis}\tfrac{2\pi k}{n}$; they form a regular $n$-gon on the unit circle.'
  topic: De Moivre's theorem
- term: rotation
  definition: 'Turning about a fixed point; an angle measures a rotation, and multiplying by $\operatorname{cis}\theta$ rotates a complex number by $\theta$.'
  topic: Angles
- term: angular frequency
  definition: 'The constant $\omega$ in $\sin\omega t$, in radians per unit time; the frequency is $\tfrac{\omega}{2\pi}$.'
  topic: Simple harmonic motion
- term: triangle inequality
  definition: 'In any triangle each side is shorter than the sum of the other two; also $\lVert\mathbf{u} + \mathbf{v}\rVert \le \lVert\mathbf{u}\rVert + \lVert\mathbf{v}\rVert$ for vectors.'
  topic: Law of cosines
