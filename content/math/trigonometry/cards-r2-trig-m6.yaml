# Round 2 cards: trig-m6 honors lessons
- {front: 'Tangent half-angle substitution: $\sin x$ and $\cos x$', back: 'With $t = \tan\tfrac{x}{2}$: $\sin x = \dfrac{2t}{1 + t^2}$, $\cos x = \dfrac{1 - t^2}{1 + t^2}$', topic: Tangent half-angle substitution}
- {front: '$\tan x$ in terms of $t = \tan\tfrac{x}{2}$', back: '$\tan x = \dfrac{2t}{1 - t^2}$ (the double-angle formula for tangent)', topic: Tangent half-angle substitution}
- {front: 'Which angles does $t = \tan\tfrac{x}{2}$ miss?', back: '$x = \pi + 2k\pi$. Always check $x = \pi$ separately when solving with this substitution.', topic: Tangent half-angle substitution}
- {front: 'Geometric meaning of $t = \tan\tfrac{x}{2}$', back: 'The slope of the line from $(-1, 0)$ to $(\cos x, \sin x)$; that line crosses the $y$-axis at $(0, t)$.', topic: Tangent half-angle substitution}
- {front: 'Pythagorean triples from $t = \tfrac{p}{q}$', back: '$(q^2 - p^2,\; 2pq,\; q^2 + p^2)$, for whole numbers $q > p > 0$', topic: Tangent half-angle substitution}
- {front: '$a\sin x + b\cos x = c$ as a quadratic in $t = \tan\tfrac{x}{2}$', back: '$(b + c)t^2 - 2at + (c - b) = 0$', topic: Tangent half-angle substitution}
- {front: 'When does $a\sin x + b\cos x = c$ have solutions?', back: 'Exactly when $c^2 \le a^2 + b^2$ (the discriminant is $4(a^2 + b^2 - c^2)$)', topic: Tangent half-angle substitution}
- {front: '$dx$ under the substitution $t = \tan\tfrac{x}{2}$', back: '$dx = \dfrac{2\,dt}{1 + t^2}$, since $x = 2\tan^{-1}t$', topic: Tangent half-angle substitution}
- {front: 'Is it really the "Weierstrass" substitution?', back: 'The name is a later tradition with no clear source; the method appears in Euler (1768) and was described in general by Legendre.', topic: Tangent half-angle substitution}
- {front: 'Recursion for $\cos nx$', back: '$\cos(n + 1)x = 2\cos x\cos nx - \cos(n - 1)x$', topic: Multiple-angle formulas}
- {front: 'Chebyshev polynomials $T_2$, $T_3$, $T_4$', back: '$2c^2 - 1$, $\;4c^3 - 3c$, $\;8c^4 - 8c^2 + 1$, with $T_n(\cos x) = \cos nx$', topic: Multiple-angle formulas}
- {front: 'Leading term of $T_n$ ($n \ge 1$)', back: '$2^{n-1}c^n$', topic: Multiple-angle formulas}
- {front: '$\sin 3x$ in terms of $\sin x$', back: '$\sin 3x = 3\sin x - 4\sin^3 x$', topic: Multiple-angle formulas}
- {front: '$\sin 18^\circ$ and $\cos 36^\circ$ exactly', back: '$\sin 18^\circ = \dfrac{\sqrt5 - 1}{4}$, $\cos 36^\circ = \dfrac{1 + \sqrt5}{4}$ (from $5 \cdot 18^\circ = 90^\circ$)', topic: Multiple-angle formulas}
- {front: 'Solve $4c^3 - 3c = k$ with $|k| \le 1$', back: 'Put $c = \cos\theta$: $\cos 3\theta = k$, so $\theta = \tfrac13\cos^{-1}k + 120^\circ m$; three roots $\cos\theta$', topic: Multiple-angle formulas}
- {front: 'Why $60^\circ$ cannot be trisected (straightedge and compass)', back: '$\cos 20^\circ$ is a root of $8c^3 - 6c - 1 = 0$, which has no rational roots; Wantzel (1837) showed such numbers are not constructible.', topic: Multiple-angle formulas}
- {front: '$\sin x + \sin 2x + \cdots + \sin nx$', back: '$\dfrac{\sin\frac{nx}{2}\,\sin\frac{(n + 1)x}{2}}{\sin\frac{x}{2}}$', topic: Multiple-angle formulas}
- {front: '$\cos x + \cos 2x + \cdots + \cos nx$', back: '$\dfrac{\sin\frac{nx}{2}\,\cos\frac{(n + 1)x}{2}}{\sin\frac{x}{2}}$', topic: Multiple-angle formulas}
- {front: 'Chord of a central angle $\theta$', back: '$\text{crd}\,\theta = 2R\sin\tfrac{\theta}{2}$', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s theorem', back: 'For $A, B, C, D$ in order on a circle: $AC \cdot BD = AB \cdot CD + AD \cdot BC$', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s theorem for a rectangle', back: 'Diagonals $d$, sides $a$, $b$: $d^2 = a^2 + b^2$, the Pythagorean theorem', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s theorem gives the sine sum formula', back: 'Circle of diameter $AC = 1$: $AB = \cos\alpha$, $BC = \sin\alpha$, $AD = \cos\beta$, $CD = \sin\beta$, $BD = \sin(\alpha + \beta)$', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s circle and number system', back: 'Radius 60 (diameter 120 parts), sexagesimal fractions: $a;b,c = a + \tfrac{b}{60} + \tfrac{c}{3600}$', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s table of chords', back: 'Arcs from $\tfrac12^\circ$ to $180^\circ$ in steps of $\tfrac12^\circ$, in the Almagest (2nd century CE)', topic: Chords and Ptolemy's theorem}
- {front: 'Chord of the supplement (radius 60)', back: '$\text{crd}^2\,\theta + \text{crd}^2(180^\circ - \theta) = 120^2$', topic: Chords and Ptolemy's theorem}
- {front: 'Ptolemy''s inequality for chords', back: 'For $\beta < \alpha \le 180^\circ$: $\dfrac{\text{crd}\,\alpha}{\text{crd}\,\beta} < \dfrac{\alpha}{\beta}$ (because $\tfrac{\sin u}{u}$ decreases)', topic: Chords and Ptolemy's theorem}
- {front: 'How Ptolemy trapped the chord of $1^\circ$', back: '$\tfrac23\,\text{crd}\,1\tfrac12^\circ < \text{crd}\,1^\circ < \tfrac43\,\text{crd}\,\tfrac34^\circ$; both bounds round to $1;2,50$', topic: Chords and Ptolemy's theorem}
