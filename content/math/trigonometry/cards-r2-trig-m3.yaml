# Cards for the trig-m3 honors lessons (round 2)
# The six functions as lengths
- {front: 'The six functions as segments (unit circle, $0^\circ < \theta < 90^\circ$)', back: '$\sin\theta = MP$, $\cos\theta = OM$; on the tangent line $x = 1$: $\tan\theta = AT$, $\sec\theta = OT$; on the tangent line $y = 1$: $\cot\theta = BC$, $\csc\theta = OC$.', topic: Trig functions as lengths}
- {front: 'Where the ray at angle $\theta$ meets $x = 1$ and $y = 1$', back: '$T = (1, \tan\theta) = \sec\theta\cdot P$ and $C = (\cot\theta, 1) = \csc\theta\cdot P$, with $P = (\cos\theta, \sin\theta)$; valid in every quadrant with signed lengths.', topic: Trig functions as lengths}
- {front: 'Why "tangent" and "secant"?', back: '$\tan\theta$ is a segment on a line tangent to the unit circle; $\sec\theta$ lies on a line that cuts it (Latin secare). Thomas Fincke introduced both names in 1583.', topic: Trig functions as lengths}
- {front: 'Pythagorean identities from the picture', back: 'Triangle $OMP$: $\cos^2\theta + \sin^2\theta = 1$. Triangle $OAT$: $1 + \tan^2\theta = \sec^2\theta$. Triangle $OBC$: $1 + \cot^2\theta = \csc^2\theta$.', topic: Trig functions as lengths}
- {front: 'Why $\tan 90^\circ$ is undefined (geometrically)', back: 'At $90^\circ$ the ray is vertical, parallel to the tangent line $x = 1$, so it never meets it: there is no point $T$.', topic: Trig functions as lengths}
- {front: 'Chord of a central angle $\theta$', back: '$2\sin\tfrac{\theta}{2}$ in a unit circle; $2R\sin\tfrac{\theta}{2}$ in a circle of radius $R$.', topic: Trig functions as lengths}
- {front: 'Ptolemy''s chord table (radius 60)', back: '$\text{crd}\,2x = 120\sin x$, so $\sin x = \tfrac{\text{crd}\,2x}{120}$: a chord table is a sine table in disguise.', topic: Trig functions as lengths}
- {front: 'Versine and exsecant', back: '$\text{versin}\,\theta = 1 - \cos\theta$ (segment $MA$); $\text{exsec}\,\theta = \sec\theta - 1$ (segment $PT$, outside the circle).', topic: Trig functions as lengths}
- {front: 'Where the word "sine" comes from (usual account)', back: 'Sanskrit jyā/jīvā (half-chord, "bowstring") → Arabic jība → read as jayb ("fold, bosom") → Latin sinus (12th century).', topic: Trig functions as lengths}
- {front: 'Rise of a circular arch (sagitta)', back: 'For radius $R$ and central angle $\theta$: rise $= R - R\cos\tfrac{\theta}{2} = R\,\text{versin}\tfrac{\theta}{2}$.', topic: Trig functions as lengths}
# Small angles
- {front: 'The key small-angle inequality', back: 'For $0 < t < \tfrac{\pi}{2}$: $\sin t < t < \tan t$ (areas $\tfrac12\sin t < \tfrac12 t < \tfrac12\tan t$).', topic: Small-angle behavior}
- {front: 'Squeeze for $\tfrac{\sin t}{t}$', back: '$\cos t < \tfrac{\sin t}{t} < 1$ for $0 < |t| < \tfrac{\pi}{2}$, so $\displaystyle\lim_{t\to 0}\tfrac{\sin t}{t} = 1$ ($t$ in radians).', topic: Small-angle behavior}
- {front: '$\tfrac{\sin x^\circ}{x}$ as $x \to 0$ (degrees)', back: 'Approaches $\tfrac{\pi}{180} \approx 0.01745$, not 1. The limit 1 needs radians.', topic: Small-angle behavior}
- {front: 'Small-angle approximations', back: '$\sin t \approx t$, $\tan t \approx t$, $\cos t \approx 1 - \tfrac{t^2}{2}$ ($t$ in radians, $|t|$ small).', topic: Small-angle behavior}
- {front: 'Size of the small-angle errors', back: 'About $\tfrac{t^3}{6}$ for $\sin t \approx t$, $\tfrac{t^3}{3}$ for $\tan t \approx t$, $\tfrac{t^4}{24}$ for $\cos t \approx 1 - \tfrac{t^2}{2}$; relative errors about $\tfrac{t^2}{6}$ and $\tfrac{t^2}{3}$.', topic: Small-angle behavior}
- {front: 'When are $\sin t \approx t$ and $\tan t \approx t$ within 1%?', back: 'Sine: $|t| < 0.244$ (about $14^\circ$). Tangent: $|t| < 0.173$ (about $9.9^\circ$).', topic: Small-angle behavior}
- {front: 'Where $\cos t \approx 1 - \tfrac{t^2}{2}$ comes from', back: 'The chord from $(1, 0)$ to $(\cos t, \sin t)$: $1 - \cos t = 2\sin^2\tfrac{t}{2} \approx \tfrac{t^2}{2}$. The estimate is always slightly low.', topic: Small-angle behavior}
- {front: 'Inequalities for every real $t$', back: '$|\sin t| \le |t|$ and $\cos t \ge 1 - \tfrac{t^2}{2}$. ($\sin t < t$ fails for negative $t$; $\tan t > t$ fails past $\tfrac{\pi}{2}$.)', topic: Small-angle behavior}
- {front: 'Is $\tfrac{\sin t}{t}$ even or odd?', back: 'Even: $\tfrac{\sin(-t)}{-t} = \tfrac{\sin t}{t}$, since both $\sin t$ and $t$ are odd.', topic: Small-angle behavior}
