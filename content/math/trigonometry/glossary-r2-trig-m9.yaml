# Round 2 glossary entries for module trig-m9 (honors lessons 39h1, 39h2, 39h3)
- term: focus
  aliases: [foci]
  definition: 'A fixed point used to define a conic: the conic is the set of points whose distance to the focus is $e$ times their distance to the directrix. In the polar form $r = \tfrac{ed}{1 + e\cos\theta}$ the focus is at the pole.'
  topic: Polar conics
- term: directrix
  aliases: [directrices]
  definition: 'A fixed line used with a focus to define a conic; for every point $P$ of the conic, $PF = e \cdot PD$, where $PD$ is the distance from $P$ to the directrix.'
  topic: Polar conics
- term: eccentricity
  definition: 'The constant ratio $e = \tfrac{PF}{PD}$ in the focus–directrix definition of a conic: $0 < e < 1$ for an ellipse, $e = 1$ for a parabola, $e > 1$ for a hyperbola. For an ellipse, $e = \tfrac{c}{a}$.'
  topic: Polar conics
- term: conic section
  aliases: [conic sections, conic, conics]
  definition: 'An ellipse, parabola or hyperbola (originally, a curve cut from a double cone by a plane). With a focus at the pole, every conic has a polar equation $r = \tfrac{ed}{1 \pm e\cos\theta}$ or $r = \tfrac{ed}{1 \pm e\sin\theta}$.'
  topic: Polar conics
- term: perihelion
  definition: 'The point of an orbit around the Sun closest to the Sun, at distance $a(1 - e)$ for an elliptical orbit with semi-major axis $a$ and eccentricity $e$.'
  topic: Polar conics
- term: aphelion
  definition: 'The point of an elliptical orbit around the Sun farthest from the Sun, at distance $a(1 + e)$.'
  topic: Polar conics
- term: cusp
  aliases: [cusps]
  definition: 'A sharp point on a curve where the tracing point stops for an instant and reverses direction, such as where a cycloid touches the ground.'
  topic: Rolling curves
- term: trochoid
  aliases: [trochoids]
  definition: 'The path of a point at distance $b$ from the center of a circle of radius $a$ rolling along a line: $x = at - b\sin t$, $y = a - b\cos t$. It is wavy if $b < a$, a cycloid if $b = a$, and looped if $b > a$.'
  topic: Rolling curves
- term: epicycloid
  aliases: [epicycloids]
  definition: 'The path of a point on a circle of radius $b$ rolling around the outside of a fixed circle of radius $a$; it has $\tfrac ab$ cusps when that is a whole number. The cardioid is the case $a = b$.'
  topic: Rolling curves
- term: hypocycloid
  aliases: [hypocycloids]
  definition: 'The path of a point on a circle of radius $b$ rolling around the inside of a fixed circle of radius $a$; it has $\tfrac ab$ cusps when that is a whole number of at least 3.'
  topic: Rolling curves
- term: astroid
  aliases: [astroids]
  definition: 'The four-cusped hypocycloid ($a = 4b$): $x = a\cos^3 t$, $y = a\sin^3 t$, or $x^{2/3} + y^{2/3} = a^{2/3}$.'
  topic: Rolling curves
- term: deltoid
  aliases: [deltoids, tricuspoid]
  definition: 'The three-cusped hypocycloid, traced by a point on a circle rolling inside a circle three times its radius.'
  topic: Rolling curves
- term: tautochrone
  definition: 'A curve on which a bead sliding without friction reaches the lowest point in the same time from any starting point. An upside-down cycloid arch has this property (Huygens, 1659).'
  topic: Rolling curves
- term: brachistochrone
  definition: 'The curve of fastest descent between two points for a bead sliding without friction under gravity: an arch of an upside-down cycloid. The problem was posed by Johann Bernoulli in 1696.'
  topic: Rolling curves
- term: primitive root of unity
  aliases: [primitive roots of unity, primitive nth root of unity]
  definition: 'An $n$th root of unity whose powers give all $n$ of them, such as $\omega = \operatorname{cis}\tfrac{2\pi}{n}$: the roots are $1, \omega, \omega^2, \ldots, \omega^{n-1}$.'
  topic: Roots of unity
- term: conjugate pair
  aliases: [conjugate pairs]
  definition: 'Two complex numbers $a + bi$ and $a - bi$, mirror images across the real axis. Their sum $2a$ and product $a^2 + b^2$ are real, so $(z - (a + bi))(z - (a - bi))$ is a real quadratic.'
  topic: Roots of unity
