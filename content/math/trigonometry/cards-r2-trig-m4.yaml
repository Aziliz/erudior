# Cards for the trig-m4 honors lessons (round 2)
# Sums, products and envelopes
- {front: 'Addition of ordinates', back: 'Graph $f + g$ by adding heights at each $x$. Shortcut: where $g(x) = 0$ the sum lies on $f$; where $g$ peaks, the sum is $f$ plus that peak.', topic: Combining trig graphs}
- {front: 'Graph of $y = x + \sin x$', back: 'Winds around the line $y = x$: on it where $\sin x = 0$, 1 above at $\tfrac{\pi}{2} + 2k\pi$, 1 below at $\tfrac{3\pi}{2} + 2k\pi$. Not periodic.', topic: Combining trig graphs}
- {front: 'Period of a sum with periods $p$ and $q$', back: 'If $\tfrac{p}{q} = \tfrac{m}{n}$ in lowest terms, the sum repeats after $L = np = mq$ (the least common multiple). Usually the smallest period.', topic: Combining trig graphs}
- {front: 'Period of $\sin\tfrac{\pi x}{3} + \cos\tfrac{\pi x}{2}$', back: 'Periods 6 and 4, ratio $\tfrac32$, so $L = 2 \cdot 6 = 3 \cdot 4 = 12$.', topic: Combining trig graphs}
- {front: 'Period of $\sin 2x + \cos 3x$', back: 'Periods $\pi$ and $\tfrac{2\pi}{3}$, ratio $\tfrac32$, so $L = 2\pi$ (not their product or sum).', topic: Combining trig graphs}
- {front: 'When is a sum of two sinusoids not periodic?', back: 'When the ratio of their periods is irrational, e.g. $\sin x + \sin(\sqrt2\,x)$ or $\sin x + \sin(\pi x)$.', topic: Combining trig graphs}
- {front: 'A sum that repeats sooner than the LCM', back: '$|\sin x| + |\cos x|$: each term has period $\pi$, but the sum has period $\tfrac{\pi}{2}$ (a quarter-turn shift swaps the terms).', topic: Combining trig graphs}
- {front: 'Envelope of $y = f(x)\sin x$', back: '$y = \pm|f(x)|$. The graph touches it where $\sin x = \pm1$ and is zero where $\sin x = 0$.', topic: Combining trig graphs}
- {front: 'Are the peaks of $x\sin x$ on its envelope?', back: 'No. It touches $y = x$ at $\tfrac{\pi}{2}$, but its first peak is near $x \approx 2.03$ (height $\approx 1.82$), below the envelope there.', topic: Combining trig graphs}
- {front: 'How long a damped wave $Ae^{-kt}\cos(\omega t)$ lasts', back: 'The envelope falls to a fraction $p$ of its start when $t = \tfrac{\ln(1/p)}{k}$; half when $t = \tfrac{\ln 2}{k}$. The cosine only sets how often it swings.', topic: Combining trig graphs}
- {front: '$\tfrac{\sin x}{x}$ near 0', back: 'Undefined at 0, but approaches 1 ($x$ in radians). Envelope $\pm\tfrac{1}{|x|}$; zeros at $k\pi$, $k \ne 0$; even function.', topic: Combining trig graphs}
# Slopes, speeds and the pendulum
- {front: 'Average rate of change on $[a, b]$', back: '$\dfrac{f(b) - f(a)}{b - a}$: the slope of the secant line joining the two points.', topic: Rates of change of sinusoids}
- {front: 'Slope of $y = \sin x$ at $x$', back: '$\cos x$ ($x$ in radians). In calculus: $\tfrac{d}{dx}\sin x = \cos x$.', topic: Rates of change of sinusoids}
- {front: 'Slope of $y = \cos x$ at $x$', back: '$-\sin x$, because $\cos x = \sin\left(x + \tfrac{\pi}{2}\right)$ has the slope of sine at $x + \tfrac{\pi}{2}$.', topic: Rates of change of sinusoids}
- {front: 'Why the slope of $\sin x$ is $\cos x$', back: '$\tfrac{\sin(x+h) - \sin x}{h} = \sin x\cdot\tfrac{\cos h - 1}{h} + \cos x\cdot\tfrac{\sin h}{h} \to \sin x\cdot 0 + \cos x\cdot 1$.', topic: Rates of change of sinusoids}
- {front: 'Slope of $y = A\sin(B(x - C)) + D$', back: '$AB\cos(B(x - C))$: $A$ and $B$ scale slopes; shifts $C$ and $D$ do not change them.', topic: Rates of change of sinusoids}
- {front: 'Steepest slope of a sinusoid', back: '$|A|B = \tfrac{2\pi|A|}{\text{period}}$, at the midline crossings. The slope is 0 at peaks and troughs.', topic: Rates of change of sinusoids}
- {front: 'Fastest vertical speed on a Ferris wheel', back: 'Radius × angular speed, $r\omega$, at the height of the hub, where the rim moves straight up or down.', topic: Rates of change of sinusoids}
- {front: 'Rule of twelfths (tides)', back: 'Over the ~6 hours from high to low water: 1, 2, 3, 3, 2, 1 twelfths of the range per hour. A sinusoid gives about 0.067, 0.183, 0.25, 0.25, 0.183, 0.067.', topic: Rates of change of sinusoids}
- {front: 'Greatest speed in simple harmonic motion $d = a\sin(\omega t)$', back: '$|a|\omega$, at equilibrium. Velocity $a\omega\cos(\omega t)$; zero at the turning points.', topic: Oscillation speed}
- {front: 'Period of a pendulum (small swings)', back: '$T = 2\pi\sqrt{L/g}$, $g \approx 9.81$ m/s². Independent of mass; 4 times the length doubles the period.', topic: Oscillation speed}
- {front: 'Seconds pendulum', back: 'Period 2 s (one second per swing): $L = \tfrac{g}{\pi^2} \approx 0.994$ m.', topic: Oscillation speed}
- {front: 'Pendulum period for larger swings', back: 'Longer than $2\pi\sqrt{L/g}$: about 0.2% for a 10° swing, 1.7% for 30°, 18% for 90°, because $\sin\theta < \theta$.', topic: Oscillation speed}
