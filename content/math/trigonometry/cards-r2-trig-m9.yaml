# Round 2 cards for module trig-m9 (honors lessons)
- {front: 'Focus–directrix definition of a conic', back: '$\tfrac{PF}{PD} = e$: ellipse if $e < 1$, parabola if $e = 1$, hyperbola if $e > 1$.', topic: Polar conics}
- {front: 'Polar conic with focus at the pole, directrix $x = d$', back: '$r = \dfrac{ed}{1 + e\cos\theta}$', topic: Polar conics}
- {front: 'Polar conics with other directrices', back: '$x = -d$: $\dfrac{ed}{1 - e\cos\theta}$. $y = d$: $\dfrac{ed}{1 + e\sin\theta}$. $y = -d$: $\dfrac{ed}{1 - e\sin\theta}$.', topic: Polar conics}
- {front: 'First step before reading $e$ from $r = \dfrac{k}{c + m\cos\theta}$', back: 'Divide top and bottom by $c$ so the constant is 1; then $e = \tfrac mc$ and $ed = \tfrac kc$.', topic: Polar conics}
- {front: 'Identify $r = \dfrac{15}{3 - 2\cos\theta}$', back: 'Ellipse, $e = \tfrac23$, directrix $x = -7.5$, vertices $(15, 0)$ and $(-3, 0)$.', topic: Polar conics}
- {front: 'Ellipse (orbit) form with focus at the pole', back: '$r = \dfrac{a(1 - e^2)}{1 + e\cos\theta}$, since $ed = a(1 - e^2)$', topic: Polar conics}
- {front: 'Perihelion and aphelion distances', back: '$a(1 - e)$ and $a(1 + e)$; they add to $2a$.', topic: Polar conics}
- {front: 'A hyperbola vertex comes out with $r < 0$', back: 'Plot it backward (opposite the direction $\theta$); it is the far vertex, not an error.', topic: Polar conics}
- {front: 'Rotating a polar graph by $\alpha$ counterclockwise', back: 'Replace $\theta$ with $\theta - \alpha$.', topic: Polar conics}
- {front: 'Kepler''s first law', back: 'Each planet moves on an ellipse with the Sun at one focus (1609).', topic: Polar conics}
- {front: 'Halley''s comet orbit', back: '$a \approx 17.8$ AU, $e \approx 0.967$: perihelion about 0.59 AU, aphelion about 35 AU.', topic: Polar conics}
- {front: 'Cycloid (wheel of radius $a$)', back: '$x = a(t - \sin t)$, $y = a(1 - \cos t)$, $t$ in radians', topic: Rolling curves}
- {front: 'Center of a wheel of radius $a$ after turning $t$ radians', back: '$(at, a)$: it has rolled the arc length $at$.', topic: Rolling curves}
- {front: 'One arch of a cycloid', back: 'Width $2\pi a$, height $2a$, cusps on the ground; area $3\pi a^2$, length $8a$.', topic: Rolling curves}
- {front: 'Trochoid (point at distance $b$ from the center)', back: '$x = at - b\sin t$, $y = a - b\cos t$; loops when $b > a$.', topic: Rolling curves}
- {front: 'Why part of a moving train goes backward', back: 'The flange reaches below the rail ($b > a$), so its lowest part traces a looped trochoid and moves backward while below the rail top.', topic: Rolling curves}
- {front: 'Epicycloid ($b$ rolling outside $a$)', back: '$x = (a + b)\cos t - b\cos\tfrac{(a + b)t}{b}$, $y = (a + b)\sin t - b\sin\tfrac{(a + b)t}{b}$', topic: Rolling curves}
- {front: 'Hypocycloid ($b$ rolling inside $a$)', back: '$x = (a - b)\cos t + b\cos\tfrac{(a - b)t}{b}$, $y = (a - b)\sin t - b\sin\tfrac{(a - b)t}{b}$', topic: Rolling curves}
- {front: 'Cusps of an epicycloid or hypocycloid', back: '$\tfrac ab$ cusps when $\tfrac ab$ is a whole number (at least 3 for a hypocycloid; $a = 2b$ gives a straight segment).', topic: Rolling curves}
- {front: 'Cardioid as a rolling curve', back: 'Epicycloid with $a = b$: a coin rolled around an equal coin.', topic: Rolling curves}
- {front: 'Astroid', back: 'Hypocycloid with $a = 4b$: $x = a\cos^3 t$, $y = a\sin^3 t$ (from the triple-angle formulas).', topic: Rolling curves}
- {front: 'Tusi couple', back: 'A circle rolling inside one twice its size: a point on it moves along a straight diameter.', topic: Rolling curves}
- {front: 'Tautochrone and brachistochrone', back: 'Both are upside-down cycloid arches: equal descent time from any start (Huygens, 1659), and fastest descent between two points (Bernoulli''s problem, 1696).', topic: Rolling curves}
- {front: 'Multiple-angle formulas from De Moivre', back: 'Expand $(\cos\theta + i\sin\theta)^n$; real part $= \cos n\theta$, imaginary part $= \sin n\theta$.', topic: Roots of unity}
- {front: '$\cos 5\theta$ and $\sin 5\theta$', back: '$16c^5 - 20c^3 + 5c$ and $16s^5 - 20s^3 + 5s$ ($c = \cos\theta$, $s = \sin\theta$)', topic: Roots of unity}
- {front: 'The $n$th roots of unity as powers', back: '$1, \omega, \ldots, \omega^{n-1}$ with $\omega = \operatorname{cis}\tfrac{2\pi}{n}$', topic: Roots of unity}
- {front: 'Conjugate of $\omega^k$ ($n$th roots of unity)', back: '$\omega^{n-k} = \omega^{-k}$', topic: Roots of unity}
- {front: 'Sum of the $n$th roots of unity ($n \ge 2$)', back: '$0$: multiplying by $\omega$ reorders them, so $\omega S = S$.', topic: Roots of unity}
- {front: 'Real factor of $z^n - 1$ from the pair $\operatorname{cis}(\pm\alpha)$', back: '$z^2 - (2\cos\alpha)z + 1$', topic: Roots of unity}
- {front: '$z^6 - 1$ factored over the reals', back: '$(z - 1)(z + 1)(z^2 - z + 1)(z^2 + z + 1)$', topic: Roots of unity}
- {front: 'All $n$th roots of $c$ from one root $w$', back: '$w, w\omega, w\omega^2, \ldots, w\omega^{n-1}$', topic: Roots of unity}
- {front: '$\cos 72^\circ$ from fifth roots of unity', back: '$w = z + z^{-1} = 2\cos 72^\circ$ solves $w^2 + w - 1 = 0$, so $\cos 72^\circ = \tfrac{\sqrt5 - 1}{4}$.', topic: Roots of unity}
- {front: 'Equation for $2\cos\tfrac{360^\circ}{7}$', back: '$w^3 + w^2 - 2w - 1 = 0$: a cubic with no rational root, so the regular heptagon is not constructible.', topic: Roots of unity}
- {front: 'Chords from one corner of a regular $n$-gon in the unit circle', back: 'Their lengths multiply to $n$.', topic: Roots of unity}
