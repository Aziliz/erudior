# Round 2 cards: trig-m7 honors lessons
- {front: 'Extended law of sines', back: '$\dfrac{a}{\sin A} = \dfrac{b}{\sin B} = \dfrac{c}{\sin C} = 2R$ ($R$ = circumradius)', topic: Circumcircle and incircle}
- {front: 'Circumradius from the sides and area', back: '$R = \dfrac{abc}{4K}$', topic: Circumcircle and incircle}
- {front: 'Inradius from the area', back: '$r = \dfrac{K}{s}$, because $K = rs$', topic: Circumcircle and incircle}
- {front: 'Tangent lengths of the incircle', back: '$s - a$ from $A$, $s - b$ from $B$, $s - c$ from $C$', topic: Circumcircle and incircle}
- {front: 'Circumcenter: where do which lines meet?', back: 'The perpendicular bisectors of the sides', topic: Circumcircle and incircle}
- {front: 'Incenter: where do which lines meet?', back: 'The angle bisectors', topic: Circumcircle and incircle}
- {front: 'Where is the circumcenter?', back: 'Inside an acute triangle, at the midpoint of the hypotenuse of a right triangle, outside an obtuse triangle', topic: Circumcircle and incircle}
- {front: 'Right triangle: $R$ and $r$', back: '$R = \tfrac{c}{2}$ (half the hypotenuse), $r = \tfrac{a + b - c}{2}$', topic: Circumcircle and incircle}
- {front: 'Euler''s inequality', back: '$R \ge 2r$, equal only for an equilateral triangle', topic: Circumcircle and incircle}
- {front: 'Key fact in the proof that $\tfrac{a}{\sin A} = 2R$', back: 'Inscribed angles on the same arc are equal, and an angle in a semicircle is $90^\circ$', topic: Circumcircle and incircle}
- {front: '$\sin\tfrac{A}{2}$ in a triangle', back: '$\sqrt{\dfrac{(s - b)(s - c)}{bc}}$', topic: Half-angle and tangent laws}
- {front: '$\cos\tfrac{A}{2}$ in a triangle', back: '$\sqrt{\dfrac{s(s - a)}{bc}}$', topic: Half-angle and tangent laws}
- {front: '$\tan\tfrac{A}{2}$ in a triangle', back: '$\sqrt{\dfrac{(s - b)(s - c)}{s(s - a)}} = \dfrac{r}{s - a}$', topic: Half-angle and tangent laws}
- {front: 'Proof of Heron''s formula in one line', back: '$K = \tfrac12 bc\sin A = bc\sin\tfrac{A}{2}\cos\tfrac{A}{2}$, then the half-angle formulas', topic: Half-angle and tangent laws}
- {front: 'Law of tangents', back: '$\dfrac{a - b}{a + b} = \dfrac{\tan\frac{A - B}{2}}{\tan\frac{A + B}{2}}$', topic: Half-angle and tangent laws}
- {front: 'SAS with the law of tangents', back: 'Half-sum $= 90^\circ - \tfrac{C}{2}$; $\tan\tfrac{A - B}{2} = \tfrac{a - b}{a + b}\cot\tfrac{C}{2}$; add and subtract', topic: Half-angle and tangent laws}
- {front: 'Mollweide''s formulas', back: '$\dfrac{a + b}{c} = \dfrac{\cos\frac{A - B}{2}}{\sin\frac{C}{2}}$, $\dfrac{a - b}{c} = \dfrac{\sin\frac{A - B}{2}}{\cos\frac{C}{2}}$', topic: Half-angle and tangent laws}
- {front: 'Why use a half-angle formula for a very thin triangle?', back: 'Finding a tiny angle from its cosine is ill-conditioned; the half-angle formula works from $s - a$, $s - b$ directly', topic: Half-angle and tangent laws}
- {front: 'Why can''t a half-angle formula confuse an obtuse angle?', back: 'Half of any triangle angle is acute, so the positive root and $\tan^{-1}$ give it directly', topic: Half-angle and tangent laws}
