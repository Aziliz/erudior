- id: trig-d-eq-quadratic
  title: Equations quadratic in sine or cosine
  topic: Trig equations with identities
  vars:
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    r1: {choices: [0.5, -0.5]}
    r2: {choices: [1, -1, 2, -2, 3]}
  calc:
    B: -2 * (r1 + r2)
    C: 2 * r1 * r2
    n1: if(abs(r1) < 1, 2, if(abs(r1) == 1, 1, 0))
    n2: if(abs(r2) < 1, 2, if(abs(r2) == 1, 1, 0))
    cnt: n1 + n2
    a1: if(f == 0, mod(asin(r1), 2*pi), acos(r1))
    a2: if(f == 0, mod(pi - asin(r1), 2*pi), 2*pi - acos(r1))
    b1: if(abs(r2) <= 1, if(f == 0, mod(asin(r2), 2*pi), acos(r2)), 99)
    sm: min(a1, a2, b1)
    nr1: -r1
    nr2: -r2
  prompt: 'Solve $2{f}^2 x {B:signedcoef}{f}\,x {C:signed} = 0$ on $[0, 2\pi)$. How many solutions are there, and what is the smallest? (Exact answers like 7pi/6 are fine, or give 4 decimals.)'
  answers:
    - {name: cnt, label: 'Number of solutions'}
    - {name: sm, label: 'Smallest solution', tolerance: 0.001, format: num4}
  solution: |-
    Factor as a quadratic in ${f} x$: $2({f} x {nr1:signed})({f} x {nr2:signed}) = 0$. The factor ${f} x = {r1}$ has 2 solutions;
    ${f} x = {r2}$ has {n2} (none if $|{r2}| > 1$, one if it is $\pm1$). Total **{cnt}**; the smallest is **{sm:num4}**.

- id: trig-d-eq-calc
  title: Factored equation with a non-special value
  topic: Trig equations with identities
  vars:
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    m: {min: -4, max: 4}
    qq: {choices: [3, 5, 7]}
    r2: {choices: [2, -2, 3, -3]}
  where: ["m != 0", "abs(m) < qq", "gcd(abs(m), qq) == 1"]
  calc:
    r1: m / qq
    A: qq + 0
    B: -(m + qq * r2)
    C: m * r2
    al: if(f == 0, asin(r1), acos(r1))
    s1: if(f == 0, mod(al, 2*pi), al)
    s2: if(f == 0, mod(pi - al, 2*pi), 2*pi - al)
    lo: min(s1, s2)
    hi: max(s1, s2)
    nm: -m
    nr2: -r2
  prompt: 'Solve ${A}{f}^2 x {B:signedcoef}{f}\,x {C:signed} = 0$ on $[0, 2\pi)$ to 4 decimals. Smaller solution first.'
  answers:
    - {name: lo, label: 'Smaller', tolerance: 0.0002, format: num4}
    - {name: hi, label: 'Larger', tolerance: 0.0002, format: num4}
  solution: |-
    Factor: $({A}{f} x {nm:signed})({f} x {nr2:signed}) = 0$.
    ${f} x = {r2}$ is impossible, so ${f} x = {r1:texfrac}$. The inverse function gives ${al:num4}$; the unit circle gives
    the second angle: $x \approx$ **{lo:num4}** and **{hi:num4}**.
