  topic: Sum and difference formulas
  vars:
    q: {choices: [{label: '\sin 15^\circ', value: 0.25881904510252074}, {label: '\cos 15^\circ', value: 0.9659258262890683}, {label: '\tan 15^\circ', value: 0.2679491924311227}, {label: '\sin 75^\circ', value: 0.9659258262890683}, {label: '\cos 75^\circ', value: 0.25881904510252074}, {label: '\tan 75^\circ', value: 3.732050807568877}, {label: '\sin 105^\circ', value: 0.9659258262890683}, {label: '\cos 105^\circ', value: -0.25881904510252074}, {label: '\tan 105^\circ', value: -3.732050807568877}, {label: '\sin 165^\circ', value: 0.25881904510252074}, {label: '\cos 165^\circ', value: -0.9659258262890683}, {label: '\tan 165^\circ', value: -0.2679491924311227}, {label: '\sin 195^\circ', value: -0.25881904510252074}, {label: '\cos 195^\circ', value: -0.9659258262890683}, {label: '\tan 195^\circ', value: 0.2679491924311227}, {label: '\sin 255^\circ', value: -0.9659258262890683}, {label: '\cos 255^\circ', value: -0.25881904510252074}, {label: '\tan 255^\circ', value: 3.732050807568877}, {label: '\sin 285^\circ', value: -0.9659258262890683}, {label: '\cos 285^\circ', value: 0.25881904510252074}, {label: '\tan 285^\circ', value: -3.732050807568877}]}
    ans: {choices: [{label: '\tfrac{\sqrt6 + \sqrt2}{4}', value: 0.9659258262890683}, {label: '\tfrac{\sqrt6 - \sqrt2}{4}', value: 0.25881904510252074}, {label: '-\tfrac{\sqrt6 + \sqrt2}{4}', value: -0.9659258262890683}, {label: '-\tfrac{\sqrt6 - \sqrt2}{4}', value: -0.25881904510252074}, {label: '2 + \sqrt3', value: 3.732050807568877}, {label: '2 - \sqrt3', value: 0.2679491924311227}, {label: '-2 - \sqrt3', value: -3.732050807568877}, {label: '\sqrt3 - 2', value: -0.2679491924311227}]}
  where: ["abs(q - ans) < 1e-9"]
  prompt: 'Find the exact value of ${q}$. Type it like (sqrt(6)+sqrt(2))/4 or 2-sqrt(3).'
  answers:
    - {name: q, label: 'Value', tolerance: 0.0005, format: num4}
  solution: |-
    Write the angle as a sum or difference of special angles (for example $75^\circ = 45^\circ + 30^\circ$,
    $165^\circ = 135^\circ + 30^\circ$) and apply the formula; for tangent use
    $\dfrac{\tan\alpha \pm \tan\beta}{1 \mp \tan\alpha\tan\beta}$. ${q} =$ **${ans}$** $\approx {q:num4}$.

- id: trig-d-sum-given
  title: Sum and difference from given values
  topic: Sum and difference formulas
  vars:
    t1: {min: 0, max: 3}
    t2: {min: 0, max: 3}
    Qa: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}]}
    Qb: {choices: [{label: 'I', value: 1}, {label: 'IV', value: 4}]}
  where: ["t1 != t2"]
  calc:
    a1: if(t1 == 0, 3, if(t1 == 1, 5, if(t1 == 2, 8, 7)))
    b1: if(t1 == 0, 4, if(t1 == 1, 12, if(t1 == 2, 15, 24)))
    h1: sqrt(a1^2 + b1^2)
    a2: if(t2 == 0, 3, if(t2 == 1, 5, if(t2 == 2, 8, 7)))
    b2: if(t2 == 0, 4, if(t2 == 1, 12, if(t2 == 2, 15, 24)))
    h2: sqrt(a2^2 + b2^2)
    sa: a1 / h1
    ca: if(Qa == 1, 1, -1) * b1 / h1
    cb: b2 / h2
    sb: if(Qb == 1, 1, -1) * a2 / h2
    s1: sa * cb + ca * sb
    c2: ca * cb + sa * sb
  prompt: '$\sin\alpha = {sa:texfrac}$ with $\alpha$ in quadrant {Qa}, and $\cos\beta = {cb:texfrac}$ with $\beta$ in quadrant {Qb}. Find $\sin(\alpha + \beta)$ and $\cos(\alpha - \beta)$ as fractions.'
  answers:
    - {name: s1, label: '$\sin(\alpha + \beta)$', kind: fraction, lowestTerms: true}
    - {name: c2, label: '$\cos(\alpha - \beta)$', kind: fraction, lowestTerms: true}
  solution: |-
    First the missing values, with quadrant signs: $\cos\alpha = {ca:texfrac}$ and $\sin\beta = {sb:texfrac}$.
    $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta =$ **${s1:texfrac}$**.
    $\cos(\alpha - \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta =$ **${c2:texfrac}$**.

- id: trig-d-double-given
  title: Double-angle values from a given sine
  topic: Double-angle formulas
  vars:
    t: {min: 0, max: 5}
    sw: {choices: [0, 1]}
    Q: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}, {label: 'III', value: 3}, {label: 'IV', value: 4}]}
  calc:
    p0: if(t == 0, 3, if(t == 1, 5, if(t == 2, 8, if(t == 3, 7, if(t == 4, 20, 9)))))
    q0: if(t == 0, 4, if(t == 1, 12, if(t == 2, 15, if(t == 3, 24, if(t == 4, 21, 40)))))
    p: if(sw == 0, p0, q0)
    q: if(sw == 0, q0, p0)
    h: sqrt(p^2 + q^2)
    s: if(Q <= 2, 1, -1) * p / h
    c: if(Q == 1 or Q == 4, 1, -1) * q / h
    s2: 2 * s * c
    c2: c^2 - s^2
  prompt: '$\sin\theta = {s:texfrac}$ and $\theta$ is in quadrant {Q}. Find $\sin 2\theta$ and $\cos 2\theta$ as fractions.'
  answers:
    - {name: s2, label: '$\sin 2\theta$', kind: fraction, lowestTerms: true}
    - {name: c2, label: '$\cos 2\theta$', kind: fraction, lowestTerms: true}
  solution: |-
    In quadrant {Q}, $\cos\theta = {c:texfrac}$. Then $\sin 2\theta = 2\sin\theta\cos\theta =$ **${s2:texfrac}$** and
    $\cos 2\theta = \cos^2\theta - \sin^2\theta =$ **${c2:texfrac}$**.

- id: trig-d-power-reduce
  title: Power reducing from cos 2θ
  topic: Double-angle formulas
  vars:
    a: {min: -8, max: 8}
    b: {choices: [3, 5, 7, 9, 11]}
  where: ["abs(a) < b", "gcd(abs(a), b) == 1"]
  calc:
    c: a / b
    s2: (1 - c) / 2
    k2: (1 + c) / 2
  prompt: 'If $\cos 2\theta = {c:texfrac}$, find $\sin^2\theta$ and $\cos^2\theta$ as fractions.'
  answers:
    - {name: s2, label: '$\sin^2\theta$', kind: fraction, lowestTerms: true}
    - {name: k2, label: '$\cos^2\theta$', kind: fraction, lowestTerms: true}
  solution: |-
    Power-reducing: $\sin^2\theta = \dfrac{1 - \cos 2\theta}{2} =$ **${s2:texfrac}$** and
    $\cos^2\theta = \dfrac{1 + \cos 2\theta}{2} =$ **${k2:texfrac}$**. (They add to 1, as they should.)

