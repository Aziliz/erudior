# Module 6 drills: identities and equations
- id: trig-d-pyth-find
  title: Find the other values with a Pythagorean identity
  topic: Fundamental identities
  vars:
    p: {min: 1, max: 8}
    q: {min: 2, max: 9}
    Q: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}, {label: 'III', value: 3}, {label: 'IV', value: 4}]}
  where: ["p < q", "gcd(p, q) == 1"]
  calc:
    sg: if(Q <= 2, 1, -1)
    cg: if(Q == 1 or Q == 4, 1, -1)
    s: sg * p / q
    m: q^2 - p^2
    c: cg * sqrt(m) / q
    tn: s / c
    sc: 1 / c
  prompt: '$\sin\theta = {s:texfrac}$ and $\theta$ is in quadrant {Q}. Find $\cos\theta$, $\tan\theta$ and $\sec\theta$. Exact answers like -sqrt(5)/3 are fine (or 4 decimals).'
  answers:
    - {name: c, label: '$\cos\theta$', tolerance: 0.0005, format: num4}
    - {name: tn, label: '$\tan\theta$', tolerance: 0.0005, format: num4}
    - {name: sc, label: '$\sec\theta$', tolerance: 0.0005, format: num4}
  solution: |-
    $\cos^2\theta = 1 - \sin^2\theta = 1 - \dfrac{{p}^2}{{q}^2} = \dfrac{{m}}{{q}^2}$, so $\cos\theta = \pm\dfrac{\sqrt{{m}}}{{q}}$, and the sign
    for quadrant {Q} gives $\cos\theta \approx$ **{c:num4}**. Then $\tan\theta = \dfrac{\sin\theta}{\cos\theta} \approx$ **{tn:num4}** and
    $\sec\theta = \dfrac{1}{\cos\theta} \approx$ **{sc:num4}**.

- id: trig-d-simplify
  title: Simplify with the fundamental identities
  topic: Fundamental identities
  vars:
    k: {choices: [{label: '\sec x - \sec x\sin^2 x', value: 0}, {label: '\dfrac{1 + \tan^2 x}{\csc^2 x}', value: 1}, {label: '\cos x\tan x', value: 2}, {label: '\csc x - \cot x\cos x', value: 3}, {label: '\sin^2 x + \cos^2 x + \tan^2 x', value: 4}, {label: '(1 - \cos^2 x)\csc x', value: 5}, {label: '\sin x\cot x', value: 6}, {label: '(\sec^2 x - 1)\cot x', value: 7}]}
    ans: {choices: [{label: '\cos x', value: 0}, {label: '\tan^2 x', value: 1}, {label: '\sin x', value: 2}, {label: '\sin x', value: 3}, {label: '\sec^2 x', value: 4}, {label: '\sin x', value: 5}, {label: '\cos x', value: 6}, {label: '\tan x', value: 7}]}
    how: {choices: [{label: 'Factor out $\sec x$ and use $1 - \sin^2 x = \cos^2 x$.', value: 0}, {label: 'Replace $1 + \tan^2 x$ with $\sec^2 x$, then write both in sines and cosines.', value: 1}, {label: 'Write $\tan x = \tfrac{\sin x}{\cos x}$ and cancel.', value: 2}, {label: 'Write in sines and cosines and combine: $\tfrac{1 - \cos^2 x}{\sin x}$.', value: 3}, {label: 'Replace $\sin^2 x + \cos^2 x$ with 1, then $1 + \tan^2 x = \sec^2 x$.', value: 4}, {label: 'Replace $1 - \cos^2 x$ with $\sin^2 x$ and $\csc x$ with $\tfrac{1}{\sin x}$.', value: 5}, {label: 'Write $\cot x = \tfrac{\cos x}{\sin x}$ and cancel.', value: 6}, {label: 'Replace $\sec^2 x - 1$ with $\tan^2 x$, and $\cot x$ with $\tfrac{1}{\tan x}$.', value: 7}]}
  where: ["k == ans", "k == how"]
  prompt: 'Simplify ${k}$ to a single trig function (or a power of one). Type functions with parentheses, e.g. sin(x)^2.'
  answers:
    - kind: expression
      expression: 'if(k == 0 or k == 6, cos(x), if(k == 1, tan(x)^2, if(k == 2 or k == 3 or k == 5, sin(x), if(k == 4, sec(x)^2, tan(x)))))'
      variables: [x]
      show: '${ans}$'
      label: 'Simplified'
  solution: |-
    {how} Result: **${ans}$**.

- id: trig-d-simplify-2
  title: Simplify expressions with fractions
  topic: Verifying identities
  vars:
    k: {choices: [{label: '\dfrac{\sin x}{1 + \cos x} + \dfrac{1 + \cos x}{\sin x}', value: 0}, {label: '\dfrac{\tan^2 x}{\sec x + 1}', value: 1}, {label: '\dfrac{\cos x}{1 + \sin x} + \tan x', value: 2}, {label: '(\sec x + \tan x)(\sec x - \tan x)', value: 3}, {label: '\dfrac{\cos x}{1 - \sin x} - \tan x', value: 4}, {label: '\dfrac{\sin x}{1 - \cos x} - \cot x', value: 5}]}
    ans: {choices: [{label: '2\csc x', value: 0}, {label: '\sec x - 1', value: 1}, {label: '\sec x', value: 2}, {label: '1', value: 3}, {label: '\sec x', value: 4}, {label: '\csc x', value: 5}]}
    how: {choices: [{label: 'Combine over $\sin x(1 + \cos x)$; the numerator becomes $2 + 2\cos x$.', value: 0}, {label: 'Write $\tan^2 x = (\sec x - 1)(\sec x + 1)$ and cancel.', value: 1}, {label: 'Combine over $\cos x(1 + \sin x)$; the numerator becomes $1 + \sin x$.', value: 2}, {label: 'Difference of squares: $\sec^2 x - \tan^2 x = 1$.', value: 3}, {label: 'Combine over $\cos x(1 - \sin x)$; the numerator becomes $1 - \sin x$.', value: 4}, {label: 'Combine over $\sin x(1 - \cos x)$; the numerator becomes $1 - \cos x$.', value: 5}]}
  where: ["k == ans", "k == how"]
  prompt: 'Simplify ${k}$. Type functions with parentheses, e.g. 1/cos(x).'
  answers:
    - kind: expression
      expression: 'if(k == 0, 2/sin(x), if(k == 1, 1/cos(x) - 1, if(k == 2 or k == 4, 1/cos(x), if(k == 3, 1, 1/sin(x)))))'
      variables: [x]
      show: '${ans}$'
      label: 'Simplified'
  solution: |-
    {how} Result: **${ans}$**.

- id: trig-d-sum-exact
