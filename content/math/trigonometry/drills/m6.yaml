  topic: Product-to-sum formulas
  vars:
    q: {choices: [{label: '\sin 75^\circ + \sin 15^\circ', value: 1.224744871391589}, {label: '\sin 75^\circ - \sin 15^\circ', value: 0.7071067811865476}, {label: '\cos 75^\circ + \cos 15^\circ', value: 1.224744871391589}, {label: '\cos 75^\circ - \cos 15^\circ', value: -0.7071067811865476}, {label: '\cos 105^\circ + \cos 15^\circ', value: 0.7071067811865476}, {label: '\sin 105^\circ - \sin 15^\circ', value: 0.7071067811865476}, {label: '\sin 165^\circ + \sin 75^\circ', value: 1.224744871391589}, {label: '\cos 165^\circ + \cos 75^\circ', value: -0.7071067811865476}, {label: '\cos 15^\circ - \cos 105^\circ', value: 1.224744871391589}, {label: '\sin 195^\circ + \sin 105^\circ', value: 0.7071067811865476}]}
    ans: {choices: [{label: '\tfrac{\sqrt6}{2}', value: 1.224744871391589}, {label: '-\tfrac{\sqrt6}{2}', value: -1.224744871391589}, {label: '\tfrac{\sqrt2}{2}', value: 0.7071067811865476}, {label: '-\tfrac{\sqrt2}{2}', value: -0.7071067811865476}]}
  where: ["abs(q - ans) < 1e-9"]
  prompt: 'Use a sum-to-product formula to find the exact value of ${q}$. Type it like sqrt(6)/2.'
