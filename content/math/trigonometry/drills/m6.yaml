- id: trig-d-half-given
  title: Half-angle values from a given cosine
  topic: Half-angle formulas
  vars:
    t: {min: 0, max: 5}
    sw: {choices: [0, 1]}
    Q: {choices: [{label: 'I', value: 1}, {label: 'II', value: 2}, {label: 'III', value: 3}, {label: 'IV', value: 4}]}
  calc:
    p0: if(t == 0, 3, if(t == 1, 5, if(t == 2, 8, if(t == 3, 7, if(t == 4, 20, 9)))))
    q0: if(t == 0, 4, if(t == 1, 12, if(t == 2, 15, if(t == 3, 24, if(t == 4, 21, 40)))))
    p: if(sw == 0, p0, q0)
    q: if(sw == 0, q0, p0)
    h: sqrt(p^2 + q^2)
    c: if(Q == 1 or Q == 4, 1, -1) * q / h
    lo: 90 * (Q - 1)
    hi: 90 * Q
    hlo: lo / 2
    hhi: hi / 2
    sh: sqrt((1 - c) / 2)
    ch: if(Q <= 2, 1, -1) * sqrt((1 + c) / 2)
  prompt: '$\cos\theta = {c:texfrac}$ with ${lo}^\circ < \theta < {hi}^\circ$. Find $\sin\tfrac{\theta}{2}$ and $\cos\tfrac{\theta}{2}$. Exact answers like 3/sqrt(10) are fine (or 4 decimals).'
  answers:
    - {name: sh, label: '$\sin\tfrac{\theta}{2}$', tolerance: 0.0005, format: num4}
    - {name: ch, label: '$\cos\tfrac{\theta}{2}$', tolerance: 0.0005, format: num4}
  solution: |-
    Halve the inequality: ${hlo}^\circ < \tfrac{\theta}{2} < {hhi}^\circ$, which fixes the signs. Then
    $\sin\tfrac{\theta}{2} = \pm\sqrt{\tfrac{1 - \cos\theta}{2}} \approx$ **{sh:num4}** and
    $\cos\tfrac{\theta}{2} = \pm\sqrt{\tfrac{1 + \cos\theta}{2}} \approx$ **{ch:num4}**.

