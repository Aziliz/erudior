# Module 5 drills: inverse functions and basic equations
- id: trig-d-inverse-exact
  title: Exact values of inverse trig functions
  topic: Inverse trig functions
  vars:
    f: {choices: [{label: '\sin^{-1}', value: 0}, {label: '\cos^{-1}', value: 1}, {label: '\tan^{-1}', value: 2}]}
    v: {choices: [{label: '\tfrac12', value: 0.5}, {label: '-\tfrac12', value: -0.5}, {label: '\tfrac{\sqrt2}{2}', value: 0.7071067811865476}, {label: '-\tfrac{\sqrt2}{2}', value: -0.7071067811865476}, {label: '\tfrac{\sqrt3}{2}', value: 0.8660254037844386}, {label: '-\tfrac{\sqrt3}{2}', value: -0.8660254037844386}, {label: '1', value: 1}, {label: '-1', value: -1}, {label: '0', value: 0}, {label: '\sqrt3', value: 1.7320508075688772}, {label: '-\sqrt3', value: -1.7320508075688772}, {label: '\tfrac{\sqrt3}{3}', value: 0.5773502691896257}, {label: '-\tfrac{\sqrt3}{3}', value: -0.5773502691896257}]}
  where: ["f == 2 or abs(v) <= 1.0000001", "f == 2 or abs(abs(v) - 0.57735) > 0.001", "f != 2 or abs(abs(v) - 0.8660254) > 0.001", "f != 2 or abs(abs(v) - 0.7071068) > 0.001", "f != 2 or abs(abs(v) - 0.5) > 0.001", "abs(if(f == 0, asin(v), if(f == 1, acos(clamp(v, -1, 1)), atan(v)))) > 0.001"]
  calc:
    ans: if(f == 0, asin(v), if(f == 1, acos(v), atan(v)))
    q: round(ans / pi * 12) / 12
    deg: round(ans * 180 / pi)
  prompt: 'Find the exact value of ${f}\left({v}\right)$ in radians. Type it like -pi/6 or 2pi/3.'
  answers:
    - {name: ans, label: 'Value', tolerance: 0.001, format: num4}
  solution: |-
    Find the reference angle from the special values, then choose the angle in the range of ${f}$
    ($\sin^{-1}$: $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$, $\cos^{-1}$: $[0, \pi]$, $\tan^{-1}$: $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$).
    ${f}\left({v}\right) =$ **${q:texfrac}\pi$** $= {deg}^\circ$.

- id: trig-d-inverse-calc
  title: Inverse trig values with a calculator
  topic: Inverse trig functions
  vars:
    f: {choices: [{label: '\sin^{-1}', value: 0}, {label: '\cos^{-1}', value: 1}, {label: '\tan^{-1}', value: 2}]}
    v: {min: -9, max: 9, step: 0.01}
  where: ["f == 2 or abs(v) < 1", "abs(v) > 0.05", "abs(if(f == 0, asind(clamp(v,-1,1)), if(f == 1, acosd(clamp(v,-1,1)), atand(v))) + 15.54) > 0.1"]
  calc:
    deg: if(f == 0, asind(v), if(f == 1, acosd(v), atand(v)))
    rad: deg * pi / 180
  prompt: 'Find ${f}({v})$ in degrees and in radians (2 and 4 decimals).'
  answers:
    - {name: deg, label: 'Degrees', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
    - {name: rad, label: 'Radians', tolerance: 0.0002, format: num4}
  solution: |-
    In degree mode ${f}({v}) \approx$ **{deg:num2}°**; in radian mode it is **{rad:num4}**. The answer lies in the
    range of ${f}$, so a negative input gives a negative angle for $\sin^{-1}$ and $\tan^{-1}$, and an obtuse angle for $\cos^{-1}$.

- id: trig-d-inverse-comp
  title: Trig of an inverse trig value
  topic: Inverse compositions
  vars:
    t: {min: 0, max: 5}
    sw: {choices: [0, 1]}
    sg: {choices: [-1, 1]}
    inn: {choices: [{label: '\sin^{-1}', value: 0}, {label: '\cos^{-1}', value: 1}, {label: '\tan^{-1}', value: 2}]}
    out: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}, {label: '\tan', value: 2}]}
  where: ["inn != out"]
  calc:
    p0: if(t == 0, 3, if(t == 1, 5, if(t == 2, 8, if(t == 3, 7, if(t == 4, 20, 9)))))
    q0: if(t == 0, 4, if(t == 1, 12, if(t == 2, 15, if(t == 3, 24, if(t == 4, 21, 40)))))
    p: if(sw == 0, p0, q0)
    q: if(sw == 0, q0, p0)
    h: sqrt(p^2 + q^2)
    xin: sg * if(inn == 2, p / q, p / h)
    th: if(inn == 0, asin(xin), if(inn == 1, acos(xin), atan(xin)))
    val: if(out == 0, sin(th), if(out == 1, cos(th), tan(th)))
  prompt: 'Find the exact value of ${out}\left({inn}\left({xin:texfrac}\right)\right)$ as a fraction.'
  answers:
    - {name: val, label: 'Value', kind: fraction, lowestTerms: true}
  solution: |-
    Let $\theta = {inn}\left({xin:texfrac}\right)$. Its range and the sign of ${xin:texfrac}$ fix the quadrant. Draw the
    reference triangle with sides {p}, {q}, {h} and read off ${out}\theta$ with the quadrant's sign:
    **${val:texfrac}$**.

- id: trig-d-inv-comp-algebra
  title: Inverse compositions as algebraic expressions
  topic: Inverse compositions
  vars:
    k: {choices: [{label: '\sin(\tan^{-1}x)', value: 0}, {label: '\cos(\tan^{-1}x)', value: 1}, {label: '\tan(\sin^{-1}x)', value: 2}, {label: '\cos(\sin^{-1}x)', value: 3}, {label: '\sin(\cos^{-1}x)', value: 4}, {label: '\tan(\cos^{-1}x)', value: 5}, {label: '\sec(\tan^{-1}x)', value: 6}]}
    ans: {choices: [{label: '\dfrac{x}{\sqrt{1 + x^2}}', value: 0}, {label: '\dfrac{1}{\sqrt{1 + x^2}}', value: 1}, {label: '\dfrac{x}{\sqrt{1 - x^2}}', value: 2}, {label: '\sqrt{1 - x^2}', value: 3}, {label: '\sqrt{1 - x^2}', value: 4}, {label: '\dfrac{\sqrt{1 - x^2}}{x}', value: 5}, {label: '\sqrt{1 + x^2}', value: 6}]}
  where: ["k == ans"]
  prompt: 'Write ${k}$ as an algebraic expression in $x$. Type sqrt( ) for square roots.'
  answers:
    - kind: expression
      expression: 'if(k == 0, x/sqrt(1 + x^2), if(k == 1, 1/sqrt(1 + x^2), if(k == 2, x/sqrt(1 - x^2), if(k == 3 or k == 4, sqrt(1 - x^2), if(k == 5, sqrt(1 - x^2)/x, sqrt(1 + x^2))))))'
      variables: [x]
      show: '${ans}$'
      label: 'Expression'
  solution: |-
    Let $\theta$ be the inverse trig value. Its ratio is $\tfrac{x}{1}$, so draw a right triangle with the side $x$
    and the side (or hypotenuse) 1 in the matching places, find the third side with the Pythagorean theorem
    ($\sqrt{1 + x^2}$ or $\sqrt{1 - x^2}$), and read off the outer function: ${k} =$ **${ans}$**. The inverse's
    range keeps $\theta$ in a quadrant where this expression has the right sign.

- id: trig-d-basic-eq
  title: Solve a basic trig equation (degrees)
  topic: Trig equations
  vars:
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}, {label: '\tan', value: 2}]}
    c: {choices: [{label: '\tfrac12', value: 0.5}, {label: '-\tfrac12', value: -0.5}, {label: '\tfrac{\sqrt2}{2}', value: 0.7071067811865476}, {label: '-\tfrac{\sqrt2}{2}', value: -0.7071067811865476}, {label: '\tfrac{\sqrt3}{2}', value: 0.8660254037844386}, {label: '-\tfrac{\sqrt3}{2}', value: -0.8660254037844386}, {label: '1', value: 1}, {label: '-1', value: -1}, {label: '\sqrt3', value: 1.7320508075688772}, {label: '-\sqrt3', value: -1.7320508075688772}, {label: '\tfrac{\sqrt3}{3}', value: 0.5773502691896257}, {label: '-\tfrac{\sqrt3}{3}', value: -0.5773502691896257}]}
  where: ["f == 2 or abs(c) < 0.99", "f == 2 or abs(abs(c) - 0.57735) > 0.001", "f != 2 or abs(abs(c) - 0.8660254) > 0.001", "f != 2 or abs(abs(c) - 0.7071068) > 0.001"]
  calc:
    a: if(f == 0, asind(c), if(f == 1, acosd(c), atand(c)))
    s1: round(mod(a, 360), 6)
    s2: round(if(f == 0, mod(180 - a, 360), if(f == 1, mod(-a, 360), mod(a + 180, 360))), 6)
    lo: min(s1, s2)
    hi: max(s1, s2)
    ref: round(abs(if(f == 1, if(a > 90, 180 - a, a), a)), 6)
  prompt: 'Solve ${f}\,\theta = {c}$ for $0^\circ \le \theta < 360^\circ$. Give the smaller solution first (in degrees; round to 2 decimals if the angle is not exact).'
  answers:
    - {name: lo, label: 'Smaller', units: {'°': 1, 'deg': 1, 'degrees': 1}}
    - {name: hi, label: 'Larger', units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    The reference angle is ${ref}^\circ$. Place it in the two quadrants where ${f}$ has the sign of ${c}$
    (for tangent, the two solutions are $180^\circ$ apart): $\theta =$ **{lo}°** and **{hi}°**.

- id: trig-d-eq-multiple-angle
  title: Equations with a multiple angle
  topic: Trig equations
  vars:
    n: {min: 2, max: 4}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    c: {choices: [{label: '\tfrac12', value: 0.5}, {label: '-\tfrac12', value: -0.5}, {label: '\tfrac{\sqrt2}{2}', value: 0.7071067811865476}, {label: '-\tfrac{\sqrt2}{2}', value: -0.7071067811865476}, {label: '\tfrac{\sqrt3}{2}', value: 0.8660254037844386}, {label: '-\tfrac{\sqrt3}{2}', value: -0.8660254037844386}]}
  calc:
    al: if(f == 0, asin(c), acos(c))
    u1: mod(al, 2*pi)
    u2: if(f == 0, mod(pi - al, 2*pi), mod(-al, 2*pi))
    xs: min(u1, u2) / n
    cnt: 2 * n
    q: round(xs / pi * 144) / 144
  prompt: 'Consider ${f}({n}x) = {c}$ on $[0, 2\pi)$. How many solutions are there, and what is the smallest one? (Exact answers like pi/12 are fine, or give 4 decimals.)'
  answers:
    - {name: cnt, label: 'Number of solutions'}
    - {name: xs, label: 'Smallest solution', tolerance: 0.001, format: num4}
  solution: |-
    Let $u = {n}x$, so $u$ runs over $[0, {n}\cdot 2\pi)$: {n} full periods, with 2 solutions each, so **{cnt}**
    solutions. The smallest $u$ with ${f}\,u = {c}$ is $u = {u1:num4}$ or ${u2:num4}$, whichever is smaller; dividing by {n}
    gives **${q:texfrac}\pi$** $\approx {xs:num4}$.

- id: trig-d-eq-calc-basic
  title: Basic equation with a calculator (radians)
  topic: Trig equations
  vars:
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}, {label: '\tan', value: 2}]}
    c: {min: -0.95, max: 0.95, step: 0.05}
    m: {min: 1, max: 4}
  where: ["abs(c) > 0.04"]
  calc:
    cc: if(f == 2, c * m, c)
    a: if(f == 0, asin(cc), if(f == 1, acos(cc), atan(cc)))
    s1: mod(a, 2*pi)
    s2: if(f == 0, mod(pi - a, 2*pi), if(f == 1, mod(-a, 2*pi), mod(a + pi, 2*pi)))
    lo: min(s1, s2)
    hi: max(s1, s2)
  prompt: 'Solve ${f}\,x = {cc}$ on $[0, 2\pi)$, to 4 decimals. Smaller solution first.'
  answers:
    - {name: lo, label: 'Smaller', tolerance: 0.0002, format: num4}
    - {name: hi, label: 'Larger', tolerance: 0.0002, format: num4}
  solution: |-
    The calculator gives one angle, ${f}^{-1}({cc}) \approx {a:num4}$. The unit circle gives the other (for sine,
    $\pi$ minus it; for cosine, its negative; for tangent, plus $\pi$), and adding $2\pi$ where needed puts both in
    $[0, 2\pi)$: $x \approx$ **{lo:num4}** and **{hi:num4}**.
