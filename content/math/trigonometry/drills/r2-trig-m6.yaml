# Round 2, module trig-m6: drills for the honors lessons 27h1, 27h2, 27h3.
- id: trig-m6-r2-tan-half-values
  title: Sine and cosine from t = tan(x/2)
  topic: Tangent half-angle substitution
  vars:
    p: {min: 1, max: 6}
    q: {min: 2, max: 7}
    sg: {choices: [1, -1]}
  where: ["p != q", "gcd(p, q) == 1"]
  calc:
    t: sg * p / q
    den: q^2 + p^2
    sn: 2 * sg * p * q
    cn: q^2 - p^2
    s: sn / den
    c: cn / den
  prompt: '$\tan\tfrac{x}{2} = {t:texfrac}$. Find $\sin x$ and $\cos x$ as exact fractions (or decimals to 4 places).'
  answers:
    - {name: s, label: '$\sin x =$', tolerance: 0.0001, format: num4}
    - {name: c, label: '$\cos x =$', tolerance: 0.0001, format: num4}
  solution: |-
    With $t = {t:texfrac}$, multiply top and bottom of each formula by ${q}^2$: $\sin x = \dfrac{2t}{1 + t^2} = \dfrac{{sn}}{{den}}$, which is **${s:texfrac}$**, and $\cos x = \dfrac{1 - t^2}{1 + t^2} = \dfrac{{cn}}{{den}}$, which is **${c:texfrac}$**.

- id: trig-m6-r2-triple
  title: A Pythagorean triple from a slope
  topic: Tangent half-angle substitution
  vars:
    p: {min: 1, max: 6}
    q: {min: 2, max: 9}
  where: ["p < q", "gcd(p, q) == 1", "mod(q - p, 2) == 1"]
  calc:
    leg1: q^2 - p^2
    leg2: 2 * p * q
    hyp: q^2 + p^2
  prompt: 'The line through $(-1, 0)$ with slope $t = {p}/{q}$ meets the unit circle at a rational point. Use $(q^2 - p^2,\; 2pq,\; q^2 + p^2)$ to find the Pythagorean triple it gives.'
  answers:
    - {name: leg1, label: '$q^2 - p^2 =$', format: integer}
    - {name: leg2, label: '$2pq =$', format: integer}
    - {name: hyp, label: 'hypotenuse $q^2 + p^2 =$', format: integer}
  solution: |-
    With $p = {p}$ and $q = {q}$: $q^2 - p^2 = {leg1}$, $2pq = {leg2}$, $q^2 + p^2 = {hyp}$. The triple is **{leg1}, {leg2}, {hyp}**; check: ${leg1}^2 + {leg2}^2 = {hyp}^2$.

- id: trig-m6-r2-asinbcos
  title: Solve a sin x + b cos x = c
  topic: Tangent half-angle substitution
  vars:
    a: {min: 1, max: 5}
    b: {choices: [-5, -4, -3, -2, -1, 1, 2, 3, 4, 5]}
    c: {min: -4, max: 4}
  where: ["c^2 < a^2 + b^2 - 0.5", "b + c != 0", "b != c", "x1 > 0.02", "x2 < 2*pi - 0.02", "x2 - x1 > 0.02"]
  calc:
    A2: b + c
    B1: -2 * a
    C0: c - b
    disc: a^2 + b^2 - c^2
    t1: (a - sqrt(disc)) / (b + c)
    t2: (a + sqrt(disc)) / (b + c)
    y1: mod(2 * atan(t1), 2*pi)
    y2: mod(2 * atan(t2), 2*pi)
    x1: min(y1, y2)
    x2: max(y1, y2)
    mpi: -b
  prompt: 'Solve $\;{a:coef}\sin x {b:signedcoef}\cos x = {c}\;$ on $[0, 2\pi)$. Give both solutions in radians to 3 decimal places, smaller first.'
  answers:
    - {name: x1, label: '$x_1 =$', tolerance: 0.001, format: dp3}
    - {name: x2, label: '$x_2 =$', tolerance: 0.001, format: dp3}
  solution: |-
    First, $x = \pi$ gives ${mpi}$, not ${c}$, so it is not a solution. With $t = \tan\tfrac{x}{2}$, the equation becomes ${A2:coef}t^2 {B1:signed}\,t {C0:signed} = 0$, so $t = \dfrac{{a} \pm \sqrt{{disc}}}{{A2}}$: $t \approx {t1:num4}$ and $t \approx {t2:num4}$. Then $x = 2\tan^{-1}t$, adding $2\pi$ to a negative angle: $x \approx$ **{x1:dp3}** and **{x2:dp3}**.

- id: trig-m6-r2-chebyshev
  title: cos 3θ and cos 4θ from cos θ
  topic: Multiple-angle formulas
  vars:
    p: {choices: [-4, -3, -2, -1, 1, 2, 3, 4]}
    q: {min: 2, max: 6}
  where: ["abs(p) < q", "gcd(abs(p), q) == 1"]
  calc:
    c: p / q
    c3: 4*c^3 - 3*c
    c2: 2*c^2 - 1
    c4: 8*c^4 - 8*c^2 + 1
  prompt: '$\cos\theta = {c:texfrac}$. Find $\cos 3\theta$ and $\cos 4\theta$ as exact fractions (or decimals to 4 places).'
  answers:
    - {name: c3, label: '$\cos 3\theta =$', tolerance: 0.0001, format: num4}
    - {name: c4, label: '$\cos 4\theta =$', tolerance: 0.0001, format: num4}
  solution: |-
    $\cos 3\theta = 4\cos^3\theta - 3\cos\theta = 4\left({c:texfrac}\right)^3 - 3\left({c:texfrac}\right) =$ **${c3:texfrac}$**.
    For $\cos 4\theta$, use $T_4 = 8c^4 - 8c^2 + 1$, or double twice: $\cos 2\theta = 2\cos^2\theta - 1 = {c2:texfrac}$, then $\cos 4\theta = 2\cos^2 2\theta - 1 =$ **${c4:texfrac}$**.

- id: trig-m6-r2-sine-sum
  title: Add a run of sines with one formula
  topic: Multiple-angle formulas
  vars:
    d: {choices: [10, 15, 20, 30, 40, 45]}
    n: {min: 3, max: 12}
  calc:
    h1: n * d / 2
    h2: (n + 1) * d / 2
    h0: d / 2
    S: sind(h1) * sind(h2) / sind(h0)
    last: n * d
    d2: 2 * d
  prompt: 'Find $\sin {d}^\circ + \sin {d2}^\circ + \cdots + \sin {last}^\circ$ (the {n} terms $\sin(k\cdot {d}^\circ)$ for $k = 1, \ldots, {n}$) with the formula $\displaystyle\sum_{k=1}^{\,n}\sin kx = \frac{\sin\frac{nx}{2}\,\sin\frac{(n+1)x}{2}}{\sin\frac{x}{2}}$. Give the answer to 4 decimal places.'
  answer: S
  format: num4
  tolerance: 0.0001
  solution: |-
    Here $x = {d}^\circ$ and $n = {n}$: $\dfrac{nx}{2} = {h1}^\circ$, $\dfrac{(n + 1)x}{2} = {h2}^\circ$, $\dfrac{x}{2} = {h0}^\circ$. The sum is $\dfrac{\sin {h1}^\circ\,\sin {h2}^\circ}{\sin {h0}^\circ} \approx$ **{S:num4}**.

- id: trig-m6-r2-chord
  title: Chords in Ptolemy's circle
  topic: Chords and Ptolemy's theorem
  vars:
    th: {min: 2, max: 178}
  calc:
    half: th / 2
    sh: sind(half)
    cr: 120 * sh
  prompt: 'In Ptolemy''s circle of radius 60, find the chord of a ${th}^\circ$ arc to 2 decimal places.'
  answer: cr
  format: num2
  tolerance: 0.01
  solution: |-
    $\text{crd}\,\theta = 2R\sin\tfrac{\theta}{2} = 120\sin {half}^\circ \approx 120({sh:dp5}) \approx$ **{cr:num2}**.

- id: trig-m6-r2-ptolemy
  title: A diagonal from Ptolemy's theorem
  topic: Chords and Ptolemy's theorem
  vars:
    a1: {min: 3, max: 15}
    a2: {min: 3, max: 15}
    a3: {min: 3, max: 15}
    rad: {choices: [5, 6, 8, 10]}
  where: ["36 - a1 - a2 - a3 >= 3", "36 - a1 - a2 - a3 <= 15"]
  calc:
    a4: 36 - a1 - a2 - a3
    AB: round(2*rad*sind(5*a1), 2)
    BC: round(2*rad*sind(5*a2), 2)
    CD: round(2*rad*sind(5*a3), 2)
    DA: round(2*rad*sind(5*a4), 2)
    AC: round(2*rad*sind(5*(a1 + a2)), 2)
    P1: AB * CD
    P2: DA * BC
    BD: (P1 + P2) / AC
  prompt: '$ABCD$ is a quadrilateral inscribed in a circle, with vertices in that order. $AB = {AB:num2}$, $BC = {BC:num2}$, $CD = {CD:num2}$, $DA = {DA:num2}$ and the diagonal $AC = {AC:num2}$. Use Ptolemy''s theorem to find the diagonal $BD$ to 2 decimal places.'
  answer: BD
  format: num2
  tolerance: 0.02
  solution: |-
    Ptolemy: $AC \cdot BD = AB \cdot CD + AD \cdot BC = {P1:num4} + {P2:num4}$. So $BD = \dfrac{{P1:num4} + {P2:num4}}{{AC:num2}} \approx$ **{BD:num2}**.
