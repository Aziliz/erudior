# Module 9 drills: polar coordinates and complex numbers
- id: trig-d-polar-to-rect
  title: Polar to rectangular
  topic: Polar coordinates
  vars:
    r: {min: -8, max: 8}
    th: {min: 0, max: 345, step: 15}
  where: ["r != 0"]
  calc:
    x: round(r * cosd(th), 9) + 0
    y: round(r * sind(th), 9) + 0
  prompt: 'Convert the polar point $({r}, {th}^\circ)$ to rectangular coordinates (2 decimals, or exact like 2sqrt(3)).'
  answers:
    - {name: x, label: '$x$', tolerance: 0.01}
    - {name: y, label: '$y$', tolerance: 0.01}
  solution: |-
    $x = r\cos\theta = {r}\cos {th}^\circ \approx$ **{x:num2}** and $y = r\sin\theta = {r}\sin {th}^\circ \approx$ **{y:num2}**.
    (A negative $r$ points the opposite way from ${th}^\circ$.)
  figure:
    type: plot
    x: [-9, 9]
    y: [-9, 9]
    equal: true
    points:
      - {at: ['x', 'y'], label: '({r}, {th}°)'}
    segments:
      - {from: [0, 0], to: ['x', 'y'], dashed: true}

- id: trig-d-rect-to-polar
  title: Rectangular to polar
  topic: Polar coordinates
  vars:
    x: {min: -9, max: 9}
    y: {min: -9, max: 9}
  where: ["x != 0", "y != 0"]
  calc:
    r: sqrt(x^2 + y^2)
    th: mod(atan2d(y, x), 360)
  prompt: 'Convert $({x}, {y})$ to polar coordinates with $r > 0$ and $0^\circ \le \theta < 360^\circ$ (2 decimals).'
  answers:
    - {name: r, label: '$r$', tolerance: 0.01}
    - {name: th, label: '$\theta$', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    $r = \sqrt{({x})^2 + ({y})^2} \approx$ **{r:num2}**. $\tan\theta = \dfrac{{y}}{{x}}$, and the signs of $x$ and $y$ fix the quadrant:
    $\theta \approx$ **{th:num2}°**.

- id: trig-d-polar-eval
  title: Points on a limaçon
  topic: Polar graphs
  vars:
    a: {min: 1, max: 5}
    b: {min: 1, max: 5}
    th: {min: 0, max: 330, step: 30}
    f: {choices: [{label: '\cos', value: 0}, {label: '\sin', value: 1}]}
  calc:
    r: round(a + b * if(f == 0, cosd(th), sind(th)), 9) + 0
    x: round(r * cosd(th), 9) + 0
    y: round(r * sind(th), 9) + 0
  prompt: 'For $r = {a} + {b:coef}{f}\theta$, find $r$ at $\theta = {th}^\circ$ and the rectangular coordinates of that point (2 decimals).'
  answers:
    - {name: r, label: '$r$', tolerance: 0.01}
    - {name: x, label: '$x$', tolerance: 0.01}
    - {name: y, label: '$y$', tolerance: 0.01}
  solution: |-
    $r = {a} + {b:coef}{f} {th}^\circ \approx$ **{r:num2}**. Then $x = r\cos\theta \approx$ **{x:num2}** and $y = r\sin\theta \approx$ **{y:num2}**
    (if $r < 0$, the point lies in the direction opposite ${th}^\circ$).
  figure:
    type: plot
    x: ['-(a + b) - 1', 'a + b + 1']
    y: ['-(a + b) - 1', 'a + b + 1']
    equal: true
    curves:
      - {x: '(a + b*if(f == 0, cos(t), sin(t)))*cos(t)', y: '(a + b*if(f == 0, cos(t), sin(t)))*sin(t)', t: [0, 6.2832]}

- id: trig-d-rose
  title: Petals of a rose curve
  topic: Polar graphs
  vars:
    a: {min: -6, max: 6}
    n: {min: 2, max: 7}
    f: {choices: [{label: '\cos', value: 0}, {label: '\sin', value: 1}]}
  where: ["a != 0"]
  calc:
    pet: if(mod(n, 2) == 1, n, 2*n)
    len: abs(a)
    m2: 2 * n
  prompt: 'How many petals does $r = {a:coef}{f}({n}\theta)$ have, and how long is each petal?'
  answers:
    - {name: pet, label: 'Petals', format: integer}
    - {name: len, label: 'Length'}
  solution: |-
    $n = {n}$: an odd $n$ gives $n$ petals and an even $n$ gives $2n$ petals, so **{pet}** petals. Each petal reaches
    $|r| = |{a}| =$ **{len}**.
  figure:
    type: plot
    x: [-7, 7]
    y: [-7, 7]
    equal: true
    curves:
      - {x: 'a*if(f == 0, cos(n*t), sin(n*t))*cos(t)', y: 'a*if(f == 0, cos(n*t), sin(n*t))*sin(t)', t: [0, 6.2832]}

- id: trig-d-param-eliminate
  title: Eliminate the parameter (ellipse)
  topic: Parametric equations
  vars:
    h: {min: -6, max: 6}
    k: {min: -6, max: 6}
    a: {min: 2, max: 6}
    b: {min: 2, max: 6}
    fx: {choices: [{label: '\cos', value: 0}, {label: '\sin', value: 1}]}
    fy: {choices: [{label: '\cos', value: 0}, {label: '\sin', value: 1}]}
  where: ["fx != fy", "h != 0", "k != 0", "a != b"]
  calc:
    hn: -h
    kn: -k
    A2: a^2
    B2: b^2
  prompt: 'Eliminate the parameter from $x = {h} {a:signed}{fx} t$, $y = {k} {b:signed}{fy} t$. The result has the form $\dfrac{(x - h)^2}{\,A} + \dfrac{(y - k)^2}{\,B} = 1$. Find $h$, $k$, $A$ and $B$.'
  answers:
    - {name: h, label: '$h$'}
    - {name: k, label: '$k$'}
    - {name: A2, label: '$A$'}
    - {name: B2, label: '$B$'}
  solution: |-
    Isolate the trig functions: ${fx} t = \dfrac{x {hn:signed}}{{a}}$ and ${fy} t = \dfrac{y {kn:signed}}{{b}}$. Square both and add;
    since $\cos^2 t + \sin^2 t = 1$,
    $$\dfrac{(x {hn:signed})^2}{{A2}} + \dfrac{(y {kn:signed})^2}{{B2}} = 1.$$
    So $h =$ **{h}**, $k =$ **{k}**, $A =$ **{A2}** and $B =$ **{B2}**: an ellipse centered at $({h}, {k})$ reaching {a} units
    left and right and {b} units up and down from the center.
  figure:
    type: plot
    x: ['h - 7', 'h + 7']
    y: ['k - 7', 'k + 7']
    equal: true
    curves:
      - {x: 'h + a*if(fx == 0, cos(t), sin(t))', y: 'k + b*if(fy == 0, cos(t), sin(t))', t: [0, 6.2832]}
    points:
      - {at: ['h', 'k'], label: 'center'}

- id: trig-d-param-line
  title: Parametrize a line segment
  topic: Parametric equations
  vars:
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
    x2: {min: -6, max: 6}
    y2: {min: -6, max: 6}
    s: {choices: [{label: '\tfrac14', value: 0.25}, {label: '\tfrac12', value: 0.5}, {label: '\tfrac34', value: 0.75}]}
  where: ["x1 != 0", "y1 != 0", "dx != 0", "dy != 0"]
  calc:
    dx: x2 - x1
    dy: y2 - y1
    px: x1 + dx * s
    py: y1 + dy * s
  prompt: 'Parametrize the segment from $P({x1}, {y1})$ to $Q({x2}, {y2})$ so that $t = 0$ gives $P$ and $t = 1$ gives $Q$. Then find the point where $t = {s}$ (fractions or decimals).'
  answers:
    - {kind: expression, expression: 'x1 + dx*t', variables: [t], show: '${x1} {dx:signedcoef}t$', label: '$x(t) =$'}
    - {kind: expression, expression: 'y1 + dy*t', variables: [t], show: '${y1} {dy:signedcoef}t$', label: '$y(t) =$'}
    - {name: px, label: '$x$ at $t = {s}$', tolerance: 0.001}
    - {name: py, label: '$y$ at $t = {s}$', tolerance: 0.001}
  solution: |-
    The direction is $\overrightarrow{PQ} = \langle {x2} - ({x1}),\ {y2} - ({y1})\rangle = \langle {dx}, {dy}\rangle$. Start at $P$ and add $t$ copies:
    **$x = {x1} {dx:signedcoef}t$**, **$y = {y1} {dy:signedcoef}t$**, $0 \le t \le 1$.
    At $t = {s}$: $x = {x1} + ({dx})\left({s}\right) =$ **{px}** and $y = {y1} + ({dy})\left({s}\right) =$ **{py}**.
  figure:
    type: plot
    x: [-7, 7]
    y: [-7, 7]
    equal: true
    segments:
      - {from: ['x1', 'y1'], to: ['x2', 'y2'], arrow: true}
    points:
      - {at: ['x1', 'y1'], label: 'P (t = 0)'}
      - {at: ['x2', 'y2'], label: 'Q (t = 1)'}

- id: trig-d-projectile
  title: Projectile motion with parametric equations
  topic: Parametric equations
  vars:
    v: {min: 12, max: 40}
    th: {min: 20, max: 70, step: 5}
    h: {min: 1, max: 25}
  calc:
    vx: v * cosd(th)
    vy: v * sind(th)
    T: (vy + sqrt(vy^2 + 19.6 * h)) / 9.8
    R: vx * T
    tp: vy / 9.8
    H: h + vy^2 / 19.6
  prompt: 'A ball is launched from {h} m above level ground at {v} m/s, ${th}^\circ$ above the horizontal. Use $g = 9.8$ m/s² and ignore air resistance. Find the time until it lands (2 decimals), how far away it lands horizontally (1 decimal), and its maximum height (1 decimal).'
  answers:
    - {name: T, label: 'Time in the air', tolerance: 0.011, format: num2, units: {'s': 1}}
    - {name: R, label: 'Horizontal distance', tolerance: 0.3, format: num1, units: {'m': 1}}
    - {name: H, label: 'Maximum height', tolerance: 0.1, format: num1, units: {'m': 1}}
  solution: |-
    $x = ({v}\cos {th}^\circ)t \approx {vx:dp3}\,t$ and $y = {h} + ({v}\sin {th}^\circ)t - 4.9t^2 \approx {h} + {vy:dp3}\,t - 4.9t^2$.
    It lands when $y = 0$: $t = \dfrac{{vy:dp3} + \sqrt{{vy:dp3}^2 + 4(4.9)({h})}}{9.8} \approx$ **{T:num2} s** (the other root is negative).
    Then $x \approx {vx:dp3}({T:dp3}) \approx$ **{R:num1} m**. The top is where the vertical velocity ${vy:dp3} - 9.8t$ is zero, at
    $t \approx {tp:dp3}$ s, where $y = {h} + \dfrac{{vy:dp3}^2}{19.6} \approx$ **{H:num1} m**.
  figure:
    type: plot
    x: [0, 'R * 1.08']
    y: [0, 'H * 1.2']
    xLabel: 'x (m)'
    yLabel: 'y (m)'
    curves:
      - {x: 'vx*t', y: 'h + vy*t - 4.9*t^2', t: [0, 'T']}
    points:
      - {at: ['vx*tp', 'H'], label: 'top'}
      - {at: ['R', 0], label: 'lands'}

- id: trig-d-complex-trig
  title: Trigonometric form of a complex number
  topic: Trigonometric form of complex numbers
  vars:
    a: {min: -9, max: 9}
    b: {min: -9, max: 9}
  where: ["a != 0", "b != 0"]
  calc:
    r: sqrt(a^2 + b^2)
    th: mod(atan2d(b, a), 360)
  prompt: 'Write $z = {a} {b:signedcoef}i$ in trigonometric form $r(\cos\theta + i\sin\theta)$: find $r$ (2 decimals) and $\theta$ in $[0^\circ, 360^\circ)$ (2 decimals).'
  answers:
    - {name: r, label: '$r$', tolerance: 0.01}
    - {name: th, label: '$\theta$', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    $r = \sqrt{({a})^2 + ({b})^2} \approx$ **{r:num2}**. The point $({a}, {b})$ fixes the quadrant of the argument:
    $\theta \approx$ **{th:num2}°**.

- id: trig-d-complex-mult
  title: Multiply and divide in trigonometric form
  topic: Trigonometric form of complex numbers
  vars:
    r1: {min: 2, max: 12}
    r2: {min: 2, max: 6}
    t1: {min: 10, max: 350, step: 10}
    t2: {min: 10, max: 350, step: 10}
  calc:
    pm: r1 * r2
    pa: mod(t1 + t2, 360)
    qm: r1 / r2
    qa: mod(t1 - t2, 360)
  prompt: 'Let $z_1 = {r1}\operatorname{cis}{t1}^\circ$ and $z_2 = {r2}\operatorname{cis}{t2}^\circ$. Find the modulus and argument (in $[0^\circ, 360^\circ)$) of $z_1z_2$ and of $\dfrac{z_1}{z_2}$, in degrees (moduli to 2 decimals).'
  answers:
    - {name: pm, label: '$\lvert z_1z_2\rvert$'}
    - {name: pa, label: 'Argument of $z_1z_2$', units: {'°': 1, 'deg': 1, 'degrees': 1}}
    - {name: qm, label: '$\lvert z_1/z_2\rvert$', tolerance: 0.01}
    - {name: qa, label: 'Argument of $z_1/z_2$', units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Product: multiply moduli, add arguments: ${r1}\cdot{r2} =$ **{pm}**, ${t1}^\circ + {t2}^\circ \to$ **{pa}°**.
    Quotient: divide moduli, subtract arguments: $\tfrac{{r1}}{{r2}} \approx$ **{qm:num2}**, ${t1}^\circ - {t2}^\circ \to$ **{qa}°** (reduced to $[0^\circ, 360^\circ)$).

- id: trig-d-complex-to-rect
  title: Trigonometric form to a + bi
  topic: Trigonometric form of complex numbers
  vars:
    r: {min: 1, max: 12}
    th: {min: 0, max: 345, step: 15}
  calc:
    a: round(r * cosd(th), 9) + 0
    b: round(r * sind(th), 9) + 0
  prompt: 'Write $z = {r}\operatorname{cis}{th}^\circ$ in the form $a + bi$ (2 decimals, or exact).'
  answers:
    - {name: a, label: '$a$', tolerance: 0.01}
    - {name: b, label: '$b$', tolerance: 0.01}
  solution: |-
    $a = r\cos\theta = {r}\cos {th}^\circ \approx$ **{a:num2}** and $b = r\sin\theta = {r}\sin {th}^\circ \approx$ **{b:num2}**.

- id: trig-d-demoivre
  title: Powers with De Moivre's theorem
  topic: De Moivre's theorem
  vars:
    r: {choices: [1, 2, 3]}
    th: {min: 15, max: 345, step: 15}
    n: {min: 2, max: 6}
  where: ["r^n <= 250", "abs(r^n*cosd(n*th) + 15.54) > 0.1", "abs(r^n*sind(n*th) + 15.54) > 0.1"]
  calc:
    m: r^n
    ang: mod(n * th, 360)
    a: round(m * cosd(n * th), 9) + 0
    b: round(m * sind(n * th), 9) + 0
  prompt: 'Use De Moivre''s theorem to compute $\left({r}\operatorname{cis}{th}^\circ\right)^{{n}}$ in the form $a + bi$ (2 decimals, or exact).'
  answers:
    - {name: a, label: '$a$', tolerance: 0.01}
    - {name: b, label: '$b$', tolerance: 0.01}
  solution: |-
    $\left({r}\operatorname{cis}{th}^\circ\right)^{{n}} = {r}^{{n}}\operatorname{cis}({n}\cdot{th}^\circ) = {m}\operatorname{cis}{ang}^\circ$, so
    $a \approx$ **{a:num2}** and $b \approx$ **{b:num2}**.

- id: trig-d-nth-roots
  title: nth roots of a complex number
  topic: De Moivre's theorem
  vars:
    n: {choices: [{label: 'square', value: 2}, {label: 'cube', value: 3}, {label: 'fourth', value: 4}, {label: 'fifth', value: 5}, {label: 'sixth', value: 6}]}
    s: {choices: [1, 2, 3]}
    th: {min: 0, max: 330, step: 30}
    k: {min: 1, max: 5}
  where: ["k < n", "s^n <= 300"]
  calc:
    R: s^n
    a0: th / n
    ak: (th + 360 * k) / n
    sp: 360 / n
  prompt: 'Consider the {n} roots of $z = {R}\operatorname{cis}{th}^\circ$, $w_k = \sqrt[{n:int}]{{R}}\operatorname{cis}\dfrac{{th}^\circ + 360^\circ k}{{n:int}}$. Find their common modulus, the argument of $w_0$, and the argument of $w_{{k}}$ (degrees, 2 decimals).'
  answers:
    - {name: s, label: 'Modulus'}
    - {name: a0, label: 'Argument of $w_0$', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
    - {name: ak, label: 'Argument of the other root', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Modulus $\sqrt[{n:int}]{{R}} =$ **{s}**. $w_0$ has argument $\dfrac{{th}^\circ}{{n:int}} \approx$ **{a0:num2}°**, and the roots are spaced
    $\dfrac{360^\circ}{{n:int}} \approx {sp:num2}^\circ$ apart, so $w_{{k}}$ has argument $\dfrac{{th}^\circ + 360^\circ({k})}{{n:int}} \approx$ **{ak:num2}°**.

- id: trig-d-roots-unity
  title: Roots of unity
  topic: De Moivre's theorem
  vars:
    n: {choices: [{label: 'cube', value: 3}, {label: 'fourth', value: 4}, {label: 'sixth', value: 6}, {label: 'eighth', value: 8}, {label: 'twelfth', value: 12}]}
    k: {min: 1, max: 11}
  where: ["k < n"]
  calc:
    ang: 360 * k / n
    a: round(cosd(ang), 12) + 0
    b: round(sind(ang), 12) + 0
  prompt: 'The {n} roots of unity are $\operatorname{cis}\dfrac{360^\circ k}{{n:int}}$. Write the root with $k = {k}$ in the form $a + bi$ (exact like sqrt(3)/2, or 4 decimals).'
  answers:
    - {name: a, label: '$a$', tolerance: 0.0005, format: num4}
    - {name: b, label: '$b$', tolerance: 0.0005, format: num4}
  solution: |-
    The argument is $\dfrac{360^\circ({k})}{{n:int}} = {ang}^\circ$, a unit-circle angle, so the root is
    $\cos {ang}^\circ + i\sin {ang}^\circ$: $a \approx$ **{a:num4}** and $b \approx$ **{b:num4}**.
  figure:
    type: plot
    x: [-1.5, 1.5]
    y: [-1.5, 1.5]
    equal: true
    circles:
      - {center: [0, 0], r: 1}
    points:
      - {at: ['cosd(ang)', 'sind(ang)'], label: 'k = {k}'}
      - [1, 0]
