# Round 2 drills for trig-m4 honors lessons (17h1 combining graphs, 17h2 slopes and small angles)
- id: trig-m4-r2-sum-period
  title: Period of a sum of two sinusoids
  topic: Combining trig graphs
  vars:
    a: {min: 2, max: 8}
    b: {min: 2, max: 8}
  where: ["a != b"]
  calc:
    p1: 2 * a
    p2: 2 * b
    gg: gcd(2 * a, 2 * b)
    mm: p1 / gg
    nn: p2 / gg
    per: lcm(2 * a, 2 * b)
  prompt: 'Find the period of each term and the smallest period of $y = \sin\left(\dfrac{\pi x}{{a}}\right) + \cos\left(\dfrac{\pi x}{{b}}\right)$.'
  answers:
    - {name: p1, label: 'Period of the sine term'}
    - {name: p2, label: 'Period of the cosine term'}
    - {name: per, label: 'Smallest period of the sum'}
  solution: |-
    Each period is $\dfrac{2\pi}{B}$: $\dfrac{2\pi}{\pi/{a}} =$ **{p1}** and $\dfrac{2\pi}{\pi/{b}} =$ **{p2}**.
    Their ratio in lowest terms is $\dfrac{{p1}}{{p2}} = \dfrac{{mm}}{{nn}}$, so ${nn}$ periods of the first term equal ${mm}$ periods of the second:
    $L = {nn} \cdot {p1} = {mm} \cdot {p2} =$ **{per}**. The two terms have different frequencies, so no shorter shift works.

- id: trig-m4-r2-envelope
  title: Envelope of a damped vibration
  topic: Combining trig graphs
  vars:
    A0: {min: 2, max: 10}
    k: {choices: [0.1, 0.2, 0.25, 0.4, 0.5]}
    w: {choices: [2, 3, 4]}
    t1: {min: 1, max: 6}
    pct: {choices: [50, 25, 10, 5]}
  calc:
    env: A0 * exp(-k * t1)
    inv: 100 / pct
    fr: pct / 100
    tp: ln(inv) / k
  prompt: 'A damped vibration is $y = {A0}e^{-{k}t}\cos({w}\pi t)$. Find the height of its envelope at $t = {t1}$, and the time when the envelope has fallen to {pct}% of its starting height. Give both to 2 decimals.'
  answers:
    - {name: env, label: 'Envelope height at $t = {t1}$', tolerance: 0.006}
    - {name: tp, label: 'Time $t =$', tolerance: 0.006}
  solution: |-
    The envelope is $y = {A0}e^{-{k}t}$; the cosine only sets how often the graph swings between $\pm$ the envelope.
    At $t = {t1}$: ${A0}e^{-{k} \cdot {t1}} \approx$ **{env:num2}**.
    The envelope is at {pct}% of its start when $e^{-{k}t} = {fr}$. Take natural logs: $-{k}t = \ln {fr}$, so
    $t = \dfrac{\ln {inv}}{{k}} \approx$ **{tp:num2}**.

- id: trig-m4-r2-avg-rate
  title: Average rate of change of a sinusoid
  topic: Rates of change of sinusoids
  vars:
    A: {min: 2, max: 5}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    a1: {min: 0, max: 2, step: 0.1}
    wd: {min: 0.2, max: 1.5, step: 0.1}
  calc:
    b1: a1 + wd
    y1: A * if(f == 0, sin(a1), cos(a1))
    y2: A * if(f == 0, sin(b1), cos(b1))
    avg: (y2 - y1) / wd
  prompt: 'Find the average rate of change of $y = {A}{f} x$ from $x = {a1}$ to $x = {b1:num1}$ ($x$ in radians). Give 3 decimals.'
  answers:
    - {name: avg, label: 'Average rate', tolerance: 0.0011, format: dp3}
  solution: |-
    Evaluate at both ends (radian mode): $y({a1}) \approx {y1:num4}$ and $y({b1:num1}) \approx {y2:num4}$.
    Divide the change in $y$ by the change in $x$, which is {wd}:
    $\dfrac{{y2:num4} - ({y1:num4})}{{wd}} \approx$ **{avg:dp3}**.

- id: trig-m4-r2-slope-at
  title: Slope of a sinusoid at a point
  topic: Rates of change of sinusoids
  vars:
    A: {min: -5, max: 5}
    B: {choices: [0.5, 1, 2, 3, 4]}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    x0: {min: -3, max: 3, step: 0.1}
  calc:
    AB: A * B
    u: B * x0
    slope: A * B * if(f == 0, cos(u), -sin(u))
  where: ["A != 0", "abs(slope) > 0.01"]
  prompt: 'Find the slope of the graph of $y = {A:coef}{f}({B:coef}x)$ at $x = {x0}$ ($x$ in radians). Give 3 decimals.'
  answers:
    - {name: slope, label: 'Slope', tolerance: 0.0006, format: dp3}
  solution: |-
    The slope of $y = A\sin(Bx)$ is $AB\cos(Bx)$, and the slope of $y = A\cos(Bx)$ is $-AB\sin(Bx)$.
    Here $AB = {AB}$ and $Bx = {B}({x0}) = {u:num4}$ radians, so the slope is $\approx$ **{slope:dp3}**.
    (Check with a difference quotient: the average rate over $[{x0}, {x0} + 0.001]$ comes out very close to this.)

- id: trig-m4-r2-max-rate
  title: Fastest rate of change of a sinusoidal model
  topic: Rates of change of sinusoids
  vars:
    A: {min: 2, max: 12}
    P: {choices: [4, 6, 8, 10, 12, 24]}
    C: {min: 1, max: 5}
    D: {min: 15, max: 40}
  calc:
    rate: 2 * pi * A / P
    q1: C + P / 4
    q2: C + P / 2
    tf: C + 3 * P / 4
  prompt: 'A quantity follows $y = {A}\cos\!\left(\dfrac{2\pi}{{P}}(t - {C})\right) + {D}$, with $t$ in hours. Find its fastest rate of increase (units per hour, 2 decimals) and the first time $t > {C}$ at which it is increasing that fast.'
  answers:
    - {name: rate, label: 'Fastest rate', tolerance: 0.006}
    - {name: tf, label: 'Time $t =$'}
  solution: |-
    The steepest slope of a sinusoid is amplitude times $B$: ${A} \cdot \dfrac{2\pi}{{P}} \approx$ **{rate:num2}** per hour.
    It is reached at the midline crossings. The cosine is at its maximum at $t = {C}$, crosses the midline going down at
    $t = {q1}$, reaches its minimum at $t = {q2}$, and crosses the midline going up three quarters of a period after the
    maximum: $t = {C} + \tfrac34({P}) =$ **{tf}**.

- id: trig-m4-r2-pendulum
  title: Period and length of a pendulum
  topic: Oscillation speed
  vars:
    Lm: {min: 0.2, max: 3, step: 0.1}
    Ts: {min: 0.8, max: 4, step: 0.1}
  calc:
    grav: 9.81
    per: 2 * pi * sqrt(Lm / grav)
    Lneed: grav * Ts^2 / (4 * pi^2)
  prompt: 'For small swings a pendulum''s period is $T = 2\pi\sqrt{\dfrac{L}{g}}$ with $g = 9.81$ m/s². Find the period of a pendulum {Lm:num1} m long, and the length that gives a period of {Ts:num1} s. Give both to 2 decimals.'
  answers:
    - {name: per, label: 'Period (s)', tolerance: 0.006}
    - {name: Lneed, label: 'Length (m)', tolerance: 0.006}
  solution: |-
    $T = 2\pi\sqrt{\dfrac{{Lm:num1}}{9.81}} \approx$ **{per:num2} s**.
    For the length, square both sides and solve: $L = \dfrac{g\,T^2}{4\pi^2} = \dfrac{9.81 \cdot {Ts:num1}^2}{4\pi^2} \approx$ **{Lneed:num2} m**.
