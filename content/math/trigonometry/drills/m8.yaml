# Module 8 drills: vectors
- id: trig-d-vec-components
  title: Components from magnitude and direction
  topic: Vectors
  vars:
    m: {min: 2, max: 50}
    th: {min: 5, max: 355, step: 5}
  where: ["mod(th, 90) != 0", "abs(m*cosd(th) + 15.54) > 0.1", "abs(m*sind(th) + 15.54) > 0.1"]
  calc:
    vx: m * cosd(th)
    vy: m * sind(th)
  prompt: 'A vector has magnitude {m} and direction angle ${th}^\circ$. Find its components (2 decimals).'
  answers:
    - {name: vx, label: 'Horizontal', tolerance: 0.01}
    - {name: vy, label: 'Vertical', tolerance: 0.01}
  solution: |-
    $\mathbf{v} = \langle {m}\cos {th}^\circ, {m}\sin {th}^\circ\rangle \approx$ **$\langle {vx:num2}, {vy:num2}\rangle$**.
  figure:
    type: plot
    x: ['-1.2*m', '1.2*m']
    y: ['-1.2*m', '1.2*m']
    equal: true
    segments:
      - {from: [0, 0], to: ['vx', 'vy'], arrow: true, label: '{m}'}

- id: trig-d-vec-mag-dir
  title: Magnitude and direction from components
  topic: Vectors
  vars:
    a: {min: -12, max: 12}
    b: {min: -12, max: 12}
  where: ["a != 0", "b != 0"]
  calc:
    mag: sqrt(a^2 + b^2)
    th: mod(atan2d(b, a), 360)
    ref: atand(abs(b / a))
  prompt: 'Find the magnitude (2 decimals) and the direction angle in $[0^\circ, 360^\circ)$ (2 decimals) of $\langle {a}, {b}\rangle$.'
  answers:
    - {name: mag, label: 'Magnitude', tolerance: 0.01}
    - {name: th, label: 'Direction', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    $\lVert\mathbf{v}\rVert = \sqrt{({a})^2 + ({b})^2} \approx$ **{mag:num2}**. The reference angle is $\tan^{-1}\left|\tfrac{{b}}{{a}}\right| \approx {ref:num2}^\circ$;
    the signs of the components put the vector in the right quadrant, giving $\theta \approx$ **{th:num2}°**.
  figure:
    type: plot
    x: [-13, 13]
    y: [-13, 13]
    equal: true
    segments:
      - {from: [0, 0], to: ['a', 'b'], arrow: true}

- id: trig-d-vec-ops
  title: Combine vectors
  topic: Vectors
  vars:
    u1: {min: -8, max: 8}
    u2: {min: -8, max: 8}
    v1: {min: -8, max: 8}
    v2: {min: -8, max: 8}
    p: {min: -4, max: 4}
    q: {min: -4, max: 4}
  where: ["p != 0", "q != 0", "p*u1 + q*v1 != 0 or p*u2 + q*v2 != 0"]
  calc:
    w1: p*u1 + q*v1
    w2: p*u2 + q*v2
    mw: sqrt(w1^2 + w2^2)
  prompt: 'Let $\mathbf{u} = \langle {u1}, {u2}\rangle$ and $\mathbf{v} = \langle {v1}, {v2}\rangle$. Find $\mathbf{w} = {p:coef}\mathbf{u} {q:signedcoef}\mathbf{v}$ and $\lVert\mathbf{w}\rVert$ (2 decimals).'
  answers:
    - {name: w1, label: 'First component'}
    - {name: w2, label: 'Second component'}
    - {name: mw, label: '$\lVert\mathbf{w}\rVert$', tolerance: 0.01}
  solution: |-
    Componentwise: $\mathbf{w} = \langle {p}({u1}) + ({q})({v1}),\ {p}({u2}) + ({q})({v2})\rangle =$ **$\langle {w1}, {w2}\rangle$**, and
    $\lVert\mathbf{w}\rVert = \sqrt{({w1})^2 + ({w2})^2} \approx$ **{mw:num2}**.

- id: trig-d-dot
  title: Dot product
  topic: Dot product
  vars:
    u1: {min: -9, max: 9}
    u2: {min: -9, max: 9}
    v1: {min: -9, max: 9}
    v2: {min: -9, max: 9}
  where: ["u1 != 0 or u2 != 0", "v1 != 0 or v2 != 0"]
  calc:
    dp: u1*v1 + u2*v2
  prompt: 'Compute $\langle {u1}, {u2}\rangle\cdot\langle {v1}, {v2}\rangle$.'
  answers:
    - {name: dp, label: 'Dot product', format: integer}
  solution: |-
    Multiply matching components and add: $({u1})({v1}) + ({u2})({v2}) =$ **{dp}**.

- id: trig-d-vec-angle
  title: Angle between two vectors
  topic: Dot product
  vars:
    u1: {min: -9, max: 9}
    u2: {min: -9, max: 9}
    v1: {min: -9, max: 9}
    v2: {min: -9, max: 9}
  where: ["u1 != 0 or u2 != 0", "v1 != 0 or v2 != 0", "abs(u1*v2 - u2*v1) > 0"]
  calc:
    dp: u1*v1 + u2*v2
    nu: sqrt(u1^2 + u2^2)
    nv: sqrt(v1^2 + v2^2)
    th: acosd(dp / (nu * nv))
  prompt: 'Find the angle between $\mathbf{u} = \langle {u1}, {u2}\rangle$ and $\mathbf{v} = \langle {v1}, {v2}\rangle$, in degrees (2 decimals).'
  answers:
    - {name: th, label: '$\theta$', tolerance: 0.01, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    $\mathbf{u}\cdot\mathbf{v} = {dp}$, $\lVert\mathbf{u}\rVert \approx {nu:num4}$, $\lVert\mathbf{v}\rVert \approx {nv:num4}$. So
    $\cos\theta = \dfrac{{dp}}{({nu:num4})({nv:num4})}$ and $\theta \approx$ **{th:num2}°**.
  figure:
    type: plot
    x: [-10, 10]
    y: [-10, 10]
    equal: true
    segments:
      - {from: [0, 0], to: ['u1', 'u2'], arrow: true, label: 'u'}
      - {from: [0, 0], to: ['v1', 'v2'], arrow: true, label: 'v'}

- id: trig-d-projection
  title: Vector projection
  topic: Dot product
  vars:
    u1: {min: -8, max: 8}
    u2: {min: -8, max: 8}
    v1: {min: -6, max: 6}
    v2: {min: -6, max: 6}
  where: ["v1 != 0 or v2 != 0", "u1*v1 + u2*v2 != 0"]
  calc:
    dp: u1*v1 + u2*v2
    vv: v1^2 + v2^2
    k: dp / vv
    p1: k * v1
    p2: k * v2
    sc: dp / sqrt(vv)
  prompt: 'Find $\text{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u} = \langle {u1}, {u2}\rangle$ and $\mathbf{v} = \langle {v1}, {v2}\rangle$ (fractions or 2 decimals), and the scalar projection of $\mathbf{u}$ on $\mathbf{v}$.'
  answers:
    - {name: p1, label: 'First component', tolerance: 0.01}
    - {name: p2, label: 'Second component', tolerance: 0.01}
    - {name: sc, label: 'Scalar projection', tolerance: 0.01}
  solution: |-
    $\mathbf{u}\cdot\mathbf{v} = {dp}$ and $\lVert\mathbf{v}\rVert^2 = {vv}$, so $\text{proj}_{\mathbf{v}}\mathbf{u} = {k:texfrac}\langle {v1}, {v2}\rangle =$
    **$\langle {p1:texfrac}, {p2:texfrac}\rangle$**. The scalar projection is $\dfrac{{dp}}{\sqrt{{vv}}} \approx$ **{sc:num2}**.

- id: trig-d-resultant
  title: Resultant of two forces
  topic: Vector applications
  vars:
    f1: {min: 10, max: 100, step: 5}
    f2: {min: 10, max: 100, step: 5}
    a1: {min: 0, max: 90, step: 5}
    a2: {min: 30, max: 180, step: 5}
  where: ["a2 > a1 + 15", "Rm > 2"]
  calc:
    rx: f1*cosd(a1) + f2*cosd(a2)
    ry: f1*sind(a1) + f2*sind(a2)
    Rm: sqrt(rx^2 + ry^2)
    th: mod(atan2d(ry, rx), 360)
  prompt: 'Forces of {f1} N at ${a1}^\circ$ and {f2} N at ${a2}^\circ$ (direction angles) act on an object. Find the magnitude (N) and direction angle of the resultant, 2 decimals.'
  answers:
    - {name: Rm, label: 'Magnitude', tolerance: 0.02, units: {'N': 1}}
    - {name: th, label: 'Direction', tolerance: 0.02, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Components: $R_x = {f1}\cos {a1}^\circ + {f2}\cos {a2}^\circ \approx {rx:num2}$ and $R_y = {f1}\sin {a1}^\circ + {f2}\sin {a2}^\circ \approx {ry:num2}$.
    $\lVert\mathbf{R}\rVert \approx$ **{Rm:num2} N**, direction $\approx$ **{th:num2}°** (quadrant from the signs of $R_x$, $R_y$).

- id: trig-d-navigation
  title: Ground speed and course with wind
  topic: Vector applications
  vars:
    s: {min: 150, max: 500, step: 10}
    hd: {min: 5, max: 355, step: 5}
    w: {min: 10, max: 60, step: 5}
    wf: {choices: [{label: 'north', value: 0}, {label: 'east', value: 90}, {label: 'south', value: 180}, {label: 'west', value: 270}]}
  calc:
    ex: round(s*sind(hd) - w*sind(wf), 9) + 0
    nn: round(s*cosd(hd) - w*cosd(wf), 9) + 0
    gs: sqrt(ex^2 + nn^2)
    crs: mod(atan2d(ex, nn), 360)
  prompt: 'A plane flies with airspeed {s} mi/h on a heading of ${hd}^\circ$. A {w} mi/h wind blows from the {wf}. Find the ground speed and the course (as a bearing), 1 decimal.'
  answers:
    - {name: gs, label: 'Ground speed', tolerance: 0.1, units: {'mi/h': 1, 'mph': 1}}
    - {name: crs, label: 'Course (bearing)', tolerance: 0.1, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Use (east, north) components; a bearing $\beta$ gives $\langle s\sin\beta, s\cos\beta\rangle$, and a wind from the {wf} blows the
    opposite way. Ground velocity $\approx \langle {ex:num2}, {nn:num2}\rangle$, so the ground speed is $\approx$ **{gs:num1} mi/h**
    and the course is the bearing of that vector, $\approx$ **{crs:num1}°**.

- id: trig-d-work
  title: Work done by a force
  topic: Vector applications
  vars:
    F: {min: 10, max: 200, step: 5}
    d: {min: 2, max: 50}
    th: {min: 0, max: 75, step: 5}
  calc:
    W: F * d * cosd(th)
  prompt: 'A force of {F} N, applied at ${th}^\circ$ to the direction of motion, moves an object {d} m. How much work is done? (1 decimal)'
  answers:
    - {name: W, label: 'Work', tolerance: 0.06, units: {'J': 1}}
  solution: |-
    Only the component along the motion does work: $W = Fd\cos\theta = ({F})({d})\cos {th}^\circ \approx$ **{W:num1} J**.
