# Round 2 drills for module trig-m2 (honors lessons)
- id: trig-m2-r2-polygon
  title: Side, apothem and area of a regular polygon
  topic: Regular polygons
  vars:
    n: {choices: [5, 6, 8, 9, 10, 12]}
    rad: {min: 2, max: 20}
  calc:
    half: 180 / n
    side: 2 * rad * sind(half)
    apo: rad * cosd(half)
    area: n * side * apo / 2
  prompt: 'A regular polygon with {n} sides has circumradius {rad}. Find its side length, apothem and area, each to 2 decimal places (use the unrounded side and apothem for the area).'
  answers:
    - {name: side, label: 'Side', tolerance: 0.01, format: num2}
    - {name: apo, label: 'Apothem', tolerance: 0.01, format: num2}
    - {name: area, label: 'Area', tolerance: 0.01, format: num2}
  solution: |-
    The apothem splits each of the {n} central triangles into two right triangles with hypotenuse {rad} and an angle of $180^\circ \div {n} = {half:num2}^\circ$ at the center.
    Side: $2({rad})\sin {half:num2}^\circ \approx$ **{side:num2}**. Apothem: ${rad}\cos {half:num2}^\circ \approx$ **{apo:num2}**.
    Area: ${n} \cdot \tfrac12 \cdot s \cdot a \approx$ **{area:num2}** (keep full precision until the end).

- id: trig-m2-r2-exact-extended
  title: Exact values at 15°, 22.5°, 18° and 36°
  topic: Exact values from geometry
  vars:
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}, {label: '\tan', value: 2}]}
    t: {choices: [{label: '15^\circ', value: 15}, {label: '75^\circ', value: 75}, {label: '22.5^\circ', value: 22.5}, {label: '67.5^\circ', value: 67.5}, {label: '18^\circ', value: 18}, {label: '72^\circ', value: 72}, {label: '36^\circ', value: 36}, {label: '54^\circ', value: 54}]}
    ex: {choices: [{label: '\tfrac{\sqrt6 - \sqrt2}{4}', value: 0.25881904510252074}, {label: '\tfrac{\sqrt6 + \sqrt2}{4}', value: 0.9659258262890683}, {label: '2 - \sqrt3', value: 0.2679491924311228}, {label: '2 + \sqrt3', value: 3.732050807568877}, {label: '\tfrac{\sqrt{2 - \sqrt2}}{2}', value: 0.3826834323650898}, {label: '\tfrac{\sqrt{2 + \sqrt2}}{2}', value: 0.9238795325112867}, {label: '\sqrt2 - 1', value: 0.41421356237309515}, {label: '\sqrt2 + 1', value: 2.414213562373095}, {label: '\tfrac{\sqrt5 - 1}{4}', value: 0.30901699437494745}, {label: '\tfrac{\sqrt{10 + 2\sqrt5}}{4}', value: 0.9510565162951535}, {label: '\tfrac{1 + \sqrt5}{4}', value: 0.8090169943749475}, {label: '\tfrac{\sqrt{10 - 2\sqrt5}}{4}', value: 0.5877852522924731}]}
  calc:
    v: if(f == 0, sind(t), if(f == 1, cosd(t), tand(t)))
  where: ["not (f == 2 and (t == 18 or t == 72 or t == 36 or t == 54))", "abs(v - ex) < 1e-9"]
  prompt: 'Give the exact value of ${f} {t}$. Type it like (sqrt(6)-sqrt(2))/4, 2-sqrt(3) or sqrt(2-sqrt(2))/2.'
  answers:
    - {name: v, label: 'Value', tolerance: 0.0005, format: num4}
  solution: |-
    Rebuild it from the constructions: halving the 30°–60°–90° triangle gives $15^\circ$ and $75^\circ$ ($\tan 15^\circ = 2 - \sqrt3$, $\sin 15^\circ = \tfrac{\sqrt6 - \sqrt2}{4}$); halving the 45°–45°–90° triangle gives $22.5^\circ$ and $67.5^\circ$ ($\tan 22.5^\circ = \sqrt2 - 1$); the golden triangle gives $\sin 18^\circ = \tfrac{\sqrt5 - 1}{4}$ and $\cos 36^\circ = \tfrac{1 + \sqrt5}{4}$. Complementary angles swap sine and cosine (and tangent with cotangent), and the Pythagorean theorem gives the remaining value.
    So ${f} {t} =$ **${ex}$** $\approx {v:num4}$.

- id: trig-m2-r2-height-range
  title: Height range from an angle with uncertainty
  topic: Measurement error
  vars:
    dist: {min: 20, max: 120, step: 5}
    th: {min: 25, max: 70}
    err: {choices: [0.5, 1]}
  calc:
    lo: dist * tand(th - err)
    hi: dist * tand(th + err)
    mid: dist * tand(th)
  prompt: 'From {dist} m away on level ground, the angle of elevation to the top of a tower (measured at eye level) is ${th}^\circ \pm {err}^\circ$. Find the lowest and highest possible heights above eye level, each in meters to 2 decimal places.'
  answers:
    - {name: lo, label: 'Lowest (m)', tolerance: 0.01, format: num2}
    - {name: hi, label: 'Highest (m)', tolerance: 0.01, format: num2}
  solution: |-
    Compute $h = d\tan\theta$ at both ends of the angle range.
    Lowest: ${dist}\tan({th}^\circ - {err}^\circ) \approx$ **{lo:num2}** m. Highest: ${dist}\tan({th}^\circ + {err}^\circ) \approx$ **{hi:num2}** m.
    (The middle value is ${dist}\tan {th}^\circ \approx {mid:num2}$ m; the range is not exactly symmetric around it.)

- id: trig-m2-r2-horizon
  title: Distance to the horizon
  topic: Horizon and Earth's radius
  vars:
    ht: {min: 2, max: 400, step: 2}
  calc:
    dkm: sqrt(2 * 6371000 * ht + ht^2) / 1000
  prompt: 'Your eyes are {ht} m above the sea. Using $R = 6371$ km and ignoring refraction, how far away is the horizon? Answer in km to 1 decimal place.'
  answers:
    - {name: dkm, label: 'Distance (km)', tolerance: 0.051, format: num1}
  solution: |-
    The line of sight is tangent to the Earth, so it is perpendicular to the radius at the horizon point. By the Pythagorean theorem,
    $d = \sqrt{(R + h)^2 - R^2} = \sqrt{2Rh + h^2} = \sqrt{2(6\,371\,000)({ht}) + {ht}^2}$ m $\approx$ **{dkm:num1}** km.
    (The shortcut $3.57\sqrt{h}$ km gives nearly the same.)

- id: trig-m2-r2-earth-radius
  title: The Earth's radius from the dip of the horizon
  topic: Horizon and Earth's radius
  vars:
    ht: {min: 100, max: 2000, step: 50}
  calc:
    al: round(acosd(6371000 / (6371000 + ht)), 3)
    cs: cosd(al)
    onem: 1 - cs
    rkm: ht * cs / (1 - cs) / 1000
  prompt: 'From a hilltop {ht} m above sea level, the dip of the horizon is ${al:dp3}^\circ$. Estimate the Earth''s radius in km, to 3 significant figures. Keep every digit of $\cos\alpha$.'
  answers:
    - {name: rkm, label: 'Radius (km)', sigfigs: 3, format: sig3}
  solution: |-
    In the right triangle with the right angle at the horizon point, $\cos\alpha = \dfrac{R}{R + h}$, so $R = \dfrac{h\cos\alpha}{1 - \cos\alpha}$.
    Here $1 - \cos {al:dp3}^\circ \approx {onem:texsci}$ (rounding $\cos\alpha$ to 4 decimals would ruin this), so $R = {ht}\cos {al:dp3}^\circ \div (1 - \cos {al:dp3}^\circ)$ m $\approx$ **{rkm:sig3}** km.
