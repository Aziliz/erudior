# Module 1 drills: angles and their measure
- id: trig-d-coterminal
  title: Coterminal angle in [0°, 360°)
  topic: Angles
  vars:
    a: {min: -1080, max: 1440, step: 5}
  where: ["a < 0 or a >= 360", "mod(a, 90) != 0"]
  calc:
    c: mod(a, 360)
    k: (c - a) / 360
  prompt: 'Find the angle in $[0^\circ, 360^\circ)$ that is coterminal with ${a:dp0}^\circ$. Answer in degrees.'
  answers:
    - {name: c, label: 'Angle', units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Add or subtract whole turns until the angle lands in $[0^\circ, 360^\circ)$. Here that takes
    $k = {k}$ turns: ${a:dp0}^\circ + 360^\circ({k}) =$ **{c}°**.
  figure:
    type: plot
    x: [-1.5, 1.5]
    y: [-1.5, 1.5]
    equal: true
    segments:
      - {from: [0, 0], to: [1.3, 0]}
      - {from: [0, 0], to: ['cosd(c)', 'sind(c)'], arrow: true}
    caption: The terminal side of {a}°

- id: trig-d-dms
  title: Degrees–minutes–seconds to decimal degrees
  topic: Degree measure
  vars:
    D: {min: 1, max: 179}
    M: {min: 0, max: 59}
    S: {min: 1, max: 59}
  calc:
    v: D + M/60 + S/3600
  prompt: 'Convert ${D}^\circ\,{M}''\,{S}''''$ to decimal degrees. Round to 4 decimal places.'
  answers:
    - {name: v, label: 'Degrees', tolerance: 0.0001, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    A minute is $\tfrac1{60}$ degree and a second is $\tfrac1{3600}$ degree:
    ${D} + \dfrac{{M}}{60} + \dfrac{{S}}{3600} \approx$ **{v:num4}°**.

- id: trig-d-decimal-dms
  title: Decimal degrees to degrees–minutes–seconds
  topic: Degree measure
  vars:
    D: {min: 1, max: 179}
    M: {min: 0, max: 59}
    S: {min: 0, max: 59}
  where: ["mod(60*M + S, 9) == 0", "M + S > 0"]
  calc:
    v: D + M/60 + S/3600
    fr: round(v - D, 6)
    mm: round(fr * 60, 6)
    fm: abs(round(mm - M, 6))
  prompt: 'Write ${v:num4}^\circ$ in degrees, minutes and seconds.'
  answers:
    - {name: D, label: 'Degrees', format: integer}
    - {name: M, label: 'Minutes', format: integer}
    - {name: S, label: 'Seconds', format: integer}
  solution: |-
    Keep the whole degrees: **{D}°**. The leftover ${fr:num4}^\circ$ times 60 is ${mm:num4}'$:
    keep **{M}′**. The leftover ${fm:num4}'$ times 60 is **{S}″**.
    Result: ${D}^\circ\,{M}'\,{S}''$.

- id: trig-d-deg2rad
  title: Degrees to radians (exact)
  topic: Radian measure
  vars:
    deg: {min: -360, max: 720, step: 15}
  where: ["mod(deg, 180) != 0"]
  calc:
    q: deg / 180
    r: deg * pi / 180
  prompt: 'Convert ${deg}^\circ$ to radians. Give an exact answer such as 5pi/6.'
  answers:
    - {name: r, label: 'Radians', tolerance: 0.001}
  solution: |-
    Multiply by $\dfrac{\pi}{180^\circ}$: ${deg} \cdot \dfrac{\pi}{180} = {q:texfrac}\pi$, so the answer
    is **${q:texfrac}\pi$** $\approx {r:num4}$.

- id: trig-d-rad2deg
  title: Radians to degrees
  topic: Radian measure
  vars:
    n: {min: -11, max: 23}
    d: {choices: [2, 3, 4, 5, 6, 9, 10, 12, 18]}
  where: ["n != 0", "gcd(abs(n), d) == 1"]
  calc:
    deg: 180 * n / d
  prompt: 'Convert $\dfrac{{n:coef}\pi}{{d}}$ radians to degrees.'
  answers:
    - {name: deg, label: 'Degrees', units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    Multiply by $\dfrac{180^\circ}{\pi}$; the $\pi$ cancels: $\dfrac{{n} \cdot 180^\circ}{{d}} =$ **{deg:dp0}°**.

- id: trig-d-arc-length
  title: Arc length from a degree angle
  topic: Arc length
  vars:
    r: {min: 2, max: 30}
    deg: {choices: [20, 30, 36, 40, 45, 60, 72, 75, 90, 100, 120, 135, 150, 210, 240, 270, 300]}
  calc:
    q: deg / 180
    s: r * deg * pi / 180
  prompt: 'A circle has radius {r} cm. Find the length of the arc subtended by a central angle of ${deg}^\circ$. Give an exact answer (like 6pi) or 2 decimals.'
  answers:
    - {name: s, label: '$s =$', tolerance: 0.01, units: {'cm': 1}}
  solution: |-
    Convert: ${deg}^\circ = {q:texfrac}\pi$ rad. Then $s = r\theta = {r} \cdot {q:texfrac}\pi \approx$ **{s:num2} cm**.
  figure:
    type: plot
    x: [-1.4, 1.4]
    y: [-1.4, 1.4]
    equal: true
    segments:
      - {from: [0, 0], to: [1, 0], label: 'r = {r}'}
      - {from: [0, 0], to: ['cosd(deg)', 'sind(deg)']}
    curves:
      - {x: 'cos(t)', y: 'sin(t)', t: [0, 'rad(deg)'], color: '#d9480f'}
    caption: Central angle {deg}°

- id: trig-d-sector-area
  title: Sector area
  topic: Sector area
  vars:
    r: {min: 2, max: 20}
    th: {choices: [0.4, 0.5, 0.8, 1, 1.2, 1.5, 2, 2.5, 3, 4]}
  calc:
    A: 0.5 * r^2 * th
  prompt: 'Find the area of a sector with radius {r} m and central angle {th} radians.'
  answers:
    - {name: A, label: 'Area', tolerance: 0.01, units: {'m^2': 1, 'm²': 1}}
  solution: |-
    $A = \tfrac12 r^2\theta = \tfrac12 ({r})^2({th}) =$ **{A:num2} m²**.

- id: trig-d-arc-angle
  title: Central angle from arc length
  topic: Arc length
  vars:
    s: {min: 3, max: 60}
    r: {min: 2, max: 20}
  where: ["s / r > 0.3", "s / r < 6"]
  calc:
    th: s / r
    deg: th * 180 / pi
  prompt: 'An arc of length {s} ft lies on a circle of radius {r} ft. Find the central angle in radians (2 decimals) and in degrees (1 decimal).'
  answers:
    - {name: th, label: 'Radians', tolerance: 0.006}
    - {name: deg, label: 'Degrees', tolerance: 0.1, units: {'°': 1, 'deg': 1, 'degrees': 1}}
  solution: |-
    $\theta = \dfrac{\,s}{\,r} = \dfrac{{s}}{{r}} \approx$ **{th:num2} rad**, and
    ${th:num4} \cdot \dfrac{180^\circ}{\pi} \approx$ **{deg:num1}°**.

- id: trig-d-linear-speed
  title: Linear speed from rpm
  topic: Angular and linear speed
  vars:
    r: {min: 5, max: 60}
    rpm: {min: 10, max: 300, step: 10}
  calc:
    w: rpm * 2 * pi / 60
    v: r * w
  prompt: 'A wheel of radius {r} cm turns at {rpm} rpm. Find the linear speed of a point on its rim in cm/s (1 decimal).'
  answers:
    - {name: v, label: '$v =$', tolerance: 0.051, units: {'cm/s': 1}}
  solution: |-
    $\omega = {rpm} \cdot 2\pi \text{ rad/min} \div 60 \approx {w:num4}$ rad/s. Then
    $v = r\omega = {r}({w:num4}) \approx$ **{v:num1} cm/s**.

- id: trig-d-angular-speed
  title: Angular speed from linear speed
  topic: Angular and linear speed
  vars:
    v: {min: 2, max: 30}
    r: {choices: [0.25, 0.3, 0.35, 0.4, 0.5, 0.6]}
  calc:
    w: v / r
    rpm: w * 60 / (2 * pi)
  prompt: 'A wheel of radius {r} m rolls so its rim moves at {v} m/s. Find its angular speed in rad/s and in rpm (1 decimal each).'
  answers:
    - {name: w, label: '$\omega$ (rad/s)', tolerance: 0.051}
    - {name: rpm, label: 'rpm', tolerance: 0.051}
  solution: |-
    $\omega = \dfrac{\,v}{\,r} = \dfrac{{v}}{{r}} \approx$ **{w:num1} rad/s**. One revolution is
    $2\pi$ rad, so rpm $= \dfrac{60\omega}{2\pi} \approx$ **{rpm:num1}**.
