# Module 4 drills: graphs of trig functions
- id: trig-d-read-graph
  title: Read amplitude, period and midline from a graph
  topic: Graphs of sine and cosine
  vars:
    A: {min: 1, max: 5}
    P: {choices: [2, 4, 6, 8, 10, 12]}
    D: {min: -3, max: 4}
    k: {choices: [0, 1]}
  funcs:
    f(x): A*if(k == 0, sin(2*pi*x/P), cos(2*pi*x/P)) + D
  calc:
    top: D + A
    bot: D - A
  prompt: 'The graph shows one sinusoid. Find its amplitude, its period, and the $y$-value of its midline.'
  answers:
    - {name: A, label: 'Amplitude'}
    - {name: P, label: 'Period'}
    - {name: D, label: 'Midline $y =$'}
  solution: |-
    The highest value is {top} and the lowest is {bot}. Midline: $\dfrac{{top} + ({bot})}{2} =$ **{D}**.
    Amplitude: $\dfrac{{top} - ({bot})}{2} =$ **{A}**. One full cycle (peak to next peak) spans **{P}** units.
  figure:
    type: plot
    x: [0, '2*P']
    y: ['D - A - 1.5', 'D + A + 1.5']
    functions: [f]

- id: trig-d-sincos-value
  title: Evaluate a sinusoid
  topic: Graphs of sine and cosine
  vars:
    A: {min: -6, max: 6}
    B: {min: 1, max: 4}
    D: {min: -5, max: 5}
    x0: {min: -3, max: 3, step: 0.1}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
  where: ["A != 0"]
  calc:
    u: B * x0
    y: A * if(f == 0, sin(u), cos(u)) + D
  prompt: 'Evaluate $y = {A:coef}{f}({B:coef}x) {D:signed}$ at $x = {x0}$ (radians). Give 3 decimals.'
  answers:
    - {name: y, label: '$y =$', tolerance: 0.001, format: dp3}
  solution: |-
    The input is ${B}({x0}) = {u:num4}$ radians. Then $y = {A:coef}{f}({u:num4}) {D:signed} \approx$ **{y:dp3}**.
    (Make sure the calculator is in radian mode.)

- id: trig-d-amp-period
  title: Amplitude, period, phase shift, vertical shift
  topic: Sinusoidal transformations
  vars:
    A: {min: -5, max: 5}
    B: {min: 1, max: 6}
    c: {choices: [{label: '\tfrac{\pi}{2}', value: 1.5707963267948966}, {label: '\tfrac{\pi}{3}', value: 1.0471975511965976}, {label: '\tfrac{\pi}{4}', value: 0.7853981633974483}, {label: '\tfrac{\pi}{6}', value: 0.5235987755982988}, {label: '\pi', value: 3.141592653589793}, {label: '\tfrac{2\pi}{3}', value: 2.0943951023931953}]}
    sg: {choices: [{label: '-', value: -1}, {label: '+', value: 1}]}
    D: {min: -6, max: 6}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
  where: ["A != 0", "abs(A) != 1 or D != 0"]
  calc:
    amp: abs(A)
    per: 2 * pi / B
    ps: -sg * c / B
  prompt: 'For $y = {A:coef}{f}\left({B:coef}x {sg} {c}\right) {D:signed}$, find the amplitude, the period, the phase shift (positive = right, negative = left) and the vertical shift. Exact forms like pi/3 are fine.'
  answers:
    - {name: amp, label: 'Amplitude'}
    - {name: per, label: 'Period', tolerance: 0.001, format: num4}
    - {name: ps, label: 'Phase shift', tolerance: 0.001, format: num4}
    - {name: D, label: 'Vertical shift'}
  solution: |-
    Amplitude $= |{A}| =$ **{amp}**. Period $= \dfrac{2\pi}{{B}} \approx$ **{per:num4}**.
    Factor out {B}: ${B}x {sg} {c} = {B}\left(x - ({ps:num4})\right)$, so the phase shift is **{ps:num4}**
    (that is, the opposite of the constant divided by {B}). Vertical shift **{D}**.

- id: trig-d-write-sinusoid
  title: Write a sinusoid from its maximum and minimum
  topic: Sinusoidal transformations
  vars:
    M: {min: 2, max: 12}
    span: {min: 2, max: 10}
    x1: {min: -3, max: 4}
    h: {min: 1, max: 6}
  calc:
    m: M - span
    A: span / 2
    D: (M + m) / 2
    x2: x1 + h
    P: 2 * h
  funcs:
    g(x): A*cos(pi*(x - x1)/h) + D
  prompt: 'A sinusoid has a maximum at $({x1}, {M})$ and the next minimum at $({x2}, {m})$. Write an equation for it in terms of $x$ (use pi for $\pi$, e.g. 3cos(pi/4*(x-1))+2).'
  answers:
    - {kind: expression, expression: 'A*cos(pi*(x - x1)/h) + D', variables: [x], label: '$y =$'}
  solution: |-
    Midline $D = \dfrac{{M} + ({m})}{2} = {D}$; amplitude $\dfrac{{M} - ({m})}{2} = {A}$. Max to min is half a period,
    so the period is ${P}$ and $B = \dfrac{2\pi}{{P}} = \dfrac{\pi}{{h}}$. Cosine starts at a maximum, so use
    $x = {x1}$ as the shift: **$y = {A}\cos\!\left(\dfrac{\pi}{{h}}(x - ({x1}))\right) + ({D})$**. Any equivalent form is accepted.
  figure:
    type: plot
    x: ['x1 - h', 'x1 + 3*h']
    y: ['m - 1.5', 'M + 1.5']
    functions: [g]
    points:
      - {at: ['x1', 'M'], label: '({x1}, {M})'}
      - {at: ['x2', 'm'], label: '({x2}, {m})'}

- id: trig-d-sinusoid-cycle
  title: Locate the maximum of a shifted sinusoid
  topic: Sinusoidal transformations
  vars:
    A: {min: 1, max: 6}
    n: {min: 2, max: 6}
    C: {min: -4, max: 4}
    D: {min: -4, max: 4}
  where: ["C != 0"]
  calc:
    P: 2 * n
    xmax: C + n / 2
    ymax: D + A
    nC: -C
  prompt: 'For $y = {A:coef}\sin\left(\dfrac{\pi}{{n}}(x {nC:signed})\right) {D:signed}$, find the period, and the first $x \ge {C}$ where the maximum occurs and the maximum value.'
  answers:
    - {name: P, label: 'Period'}
    - {name: xmax, label: '$x$ of the maximum'}
    - {name: ymax, label: 'Maximum value'}
  solution: |-
    Period $= \dfrac{2\pi}{\pi/{n}} =$ **{P}**. The cycle starts at the phase shift $x = {C}$ on the midline going
    up, and the maximum comes a quarter period later: $x = {C} + \dfrac{{P}}{4} =$ **{xmax}**. The maximum value
    is $D + |A| = {D} + {A} =$ **{ymax}**.

- id: trig-d-tan-features
  title: Period and asymptote of a tangent graph
  topic: Graphs of tangent and cotangent
  vars:
    A: {min: 1, max: 4}
    n: {min: 2, max: 8}
    C: {min: -5, max: 5}
  calc:
    nC: -C
    asym: C + n / 2
  prompt: 'For $y = {A:coef}\tan\left(\dfrac{\pi}{{n}}(x {nC:signed})\right)$, find the period and the first vertical asymptote to the right of $x = {C}$.'
  answers:
    - {name: n, label: 'Period'}
    - {name: asym, label: 'Asymptote $x =$'}
  solution: |-
    Tangent's period is $\dfrac{\pi}{B} = \dfrac{\pi}{\pi/{n}} =$ **{n}**. The branch is centered at $x = {C}$, and its
    asymptotes are where the input equals $\pm\tfrac{\pi}{2}$: $\dfrac{\pi}{{n}}(x - ({C})) = \dfrac{\pi}{2}$ gives
    $x = {C} + \dfrac{{n}}{2} =$ **{asym}**.

- id: trig-d-sec-features
  title: Period and range of a secant or cosecant graph
  topic: Graphs of secant and cosecant
  vars:
    A: {min: -5, max: 5}
    n: {min: 2, max: 8}
    D: {min: -5, max: 5}
    f: {choices: [{label: '\sec', value: 0}, {label: '\csc', value: 1}]}
  where: ["A != 0"]
  calc:
    P: 2 * n
    lo: D - abs(A)
    hi: D + abs(A)
  prompt: 'The range of $y = {A:coef}{f}\left(\dfrac{\pi x}{{n}}\right) {D:signed}$ is $(-\infty, a] \cup [b, \infty)$. Find the period, $a$ and $b$.'
  answers:
    - {name: P, label: 'Period'}
    - {name: lo, label: '$a$'}
    - {name: hi, label: '$b$'}
  solution: |-
    Period $= \dfrac{2\pi}{\pi/{n}} =$ **{P}**. The guide sinusoid has midline $y = {D}$ and amplitude $|{A}|$; the
    branches turn at its max and min and head away from the midline. So $a = {D} - |{A}| =$ **{lo}** and
    $b = {D} + |{A}| =$ **{hi}**.

- id: trig-d-model-data
  title: Build a sinusoidal model from a high and a low
  topic: Sinusoidal models
  vars:
    M: {min: 60, max: 100}
    span: {min: 20, max: 50}
    t1: {min: 6, max: 8}
  calc:
    m: M - span
    A: span / 2
    D: (M + m) / 2
    tq: t1 - 2
    q: A * cos(pi / 6 * (tq - t1)) + D
  prompt: 'A city''s average monthly high temperature peaks at ${M}^\circ$F in month {t1} and is lowest, ${m}^\circ$F, six months away from that. Model it as $T(t) = A\cos\!\left(B(t - C)\right) + D$ with a 12-month period. Find $A$, $D$ and the predicted temperature in month {tq}.'
  answers:
    - {name: A, label: '$A$'}
    - {name: D, label: '$D$'}
    - {name: q, label: 'Predicted temperature', tolerance: 0.05}
  solution: |-
    $A = \dfrac{{M} - {m}}{2} =$ **{A}**, $D = \dfrac{{M} + {m}}{2} =$ **{D}**, $B = \dfrac{2\pi}{12} = \dfrac{\pi}{6}$,
    and the max is at $C = {t1}$. Then $T({tq}) = {A}\cos\!\left(\dfrac{\pi}{6}(-2)\right) + {D} = {A}\left(\tfrac12\right) + {D} =$ **{q:num1}°F**.

- id: trig-d-shm
  title: Simple harmonic motion
  topic: Simple harmonic motion
  vars:
    a: {min: 2, max: 12}
    k: {choices: [2, 3, 4, 5, 6, 8, 10]}
    f: {choices: [{label: '\sin', value: 0}, {label: '\cos', value: 1}]}
    t0: {min: 0.05, max: 0.95, step: 0.05}
  calc:
    w: k * pi
    per: 2 / k
    freq: k / 2
    d: a * if(f == 0, sin(w * t0), cos(w * t0))
  prompt: 'A spring''s displacement is $d = {a}{f}({k}\pi t)$ cm, with $t$ in seconds. Find the period (s), the frequency (Hz), and the displacement at $t = {t0}$ s (2 decimals).'
  answers:
    - {name: per, label: 'Period', tolerance: 0.001}
    - {name: freq, label: 'Frequency', tolerance: 0.001}
    - {name: d, label: 'Displacement', tolerance: 0.01}
  solution: |-
    $\omega = {k}\pi$, so the period is $\dfrac{2\pi}{{k}\pi} =$ **{per:num4} s** and the frequency is
    $\dfrac{{k}\pi}{2\pi} =$ **{freq} Hz**. At $t = {t0}$: $d = {a}{f}({k}\pi \cdot {t0}) \approx$ **{d:num2} cm**.

- id: trig-d-ferris
  title: Height on a Ferris wheel
  topic: Sinusoidal models
  vars:
    r: {min: 10, max: 40}
    gap: {min: 1, max: 5}
    T: {choices: [2, 3, 4, 5, 6, 8, 10]}
    t0: {min: 0.2, max: 5, step: 0.1}
  calc:
    c: r + gap
    h: c - r * cos(2 * pi * t0 / T)
    top: c + r
  prompt: 'A Ferris wheel of radius {r} m has its lowest point {gap} m above the ground and turns once every {T} minutes. A rider boards at the bottom at $t = 0$. How high is the rider at $t = {t0}$ min (2 decimals), and what is the greatest height reached?'
  answers:
    - {name: h, label: 'Height', tolerance: 0.01, units: {'m': 1}}
    - {name: top, label: 'Greatest height', units: {'m': 1}}
  solution: |-
    The center is at ${c}$ m. Starting at the bottom: $h(t) = {c} - {r}\cos\!\left(\dfrac{2\pi t}{{T}}\right)$.
    At $t = {t0}$: $h \approx$ **{h:num2} m**. The top is ${c} + {r} =$ **{top} m**.
