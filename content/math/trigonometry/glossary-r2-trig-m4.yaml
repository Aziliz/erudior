# Glossary terms introduced in the trig-m4 honors lessons (round 2)
- term: addition of ordinates
  aliases: [adding ordinates]
  definition: 'Graphing a sum $y = f(x) + g(x)$ by adding the heights (ordinates, or $y$-coordinates) of the two graphs at each $x$. Where one part is 0, the sum lies on the other graph.'
  topic: Combining trig graphs
- term: least common multiple
  aliases: [LCM, least common multiples]
  definition: 'The smallest positive number that is a whole-number multiple of each of two given numbers. A sum of terms with periods $p$ and $q$ repeats after their least common multiple: if $\tfrac{p}{q} = \tfrac{m}{n}$ in lowest terms, it is $np = mq$.'
  topic: Combining trig graphs
- term: envelope
  aliases: [envelopes, envelope curves]
  definition: 'For a product such as $y = f(x)\sin x$, the pair of curves $y = \pm|f(x)|$ that the graph stays between and touches (where $\sin x = \pm1$). It controls how big the swings are.'
  topic: Combining trig graphs
- term: average rate of change
  aliases: [average rates of change]
  definition: 'The change in a function divided by the change in its input, $\dfrac{f(b) - f(a)}{b - a}$: the slope of the straight line joining two points of its graph.'
  topic: Rates of change of sinusoids
- term: difference quotient
  aliases: [difference quotients]
  definition: 'The average rate of change over a short interval $[x, x + h]$: $\dfrac{f(x + h) - f(x)}{h}$. As $h$ shrinks it approaches the slope of the curve at $x$.'
  topic: Rates of change of sinusoids
- term: slope of the curve
  aliases: [slope of a curve, slope at a point]
  definition: 'The number that difference quotients at a point approach as the interval shrinks: the slope of the line that just touches the graph there. The slope of $y = \sin x$ at $x$ is $\cos x$ (radians).'
  topic: Rates of change of sinusoids
- term: steepest slope
  aliases: [greatest slope]
  definition: 'For $y = A\sin(B(x - C)) + D$, the largest size of the slope, $|A|B = \tfrac{2\pi|A|}{\text{period}}$. It occurs at every midline crossing; at peaks and troughs the slope is 0.'
  topic: Rates of change of sinusoids
- term: rule of twelfths
  definition: 'A sailors'' rule of thumb for a tide between high and low water (about 6 hours): the level changes by 1, 2, 3, 3, 2 and 1 twelfths of the range in successive hours. It roughly matches a sinusoid.'
  topic: Rates of change of sinusoids
- term: velocity
  aliases: [velocities]
  definition: 'The rate at which a position or displacement changes, with a sign for direction. In simple harmonic motion $d = a\sin(\omega t)$ it is $a\omega\cos(\omega t)$, largest in size ($|a|\omega$) at equilibrium.'
  topic: Oscillation speed
