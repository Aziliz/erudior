# Round 2: new question types for trig-m4 (core lessons 13-17) and its honors lessons 17h1-17h2
# ---------- trig-graph-sincos (core, lesson 13) ----------
- id: trig-m4-r2-q01
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  type: label
  stem: 'The picture shows how the unit circle unrolls into the graph of $y = \sin x$. Name the numbered parts.'
  image: {src: images/trig-m4-unroll-blank.svg, alt: 'On the left, the unit circle with a point in quadrant I, a thick arc from (1, 0) to the point, and a right triangle with a horizontal leg and a vertical leg. On the right, one cycle of the sine graph, with a dashed line carrying the height of the circle point across to a point on the graph. Five parts are numbered.'}
  labels:
    - {x: 27.7, y: 27.5, text: Point on the unit circle}
    - {x: 32.5, y: 38.5, text: Arc of length t}
    - {x: 23.9, y: 53.0, text: 'Horizontal leg: cos t'}
    - {x: 27.7, y: 40.3, text: 'Vertical leg: sin t'}
    - {x: 51.1, y: 27.5, text: 'Point (t, sin t) on the graph'}
  distractors: ['Horizontal leg: sin t', 'Point (cos t, t) on the graph']
  explanation: |-
    The point on the circle is $(\cos t, \sin t)$: its horizontal leg has length $\cos t$ and its vertical leg (its height) has length $\sin t$. It got there by traveling an arc of length $t$ from $(1, 0)$, because on the unit circle arc length equals the angle in radians. On the graph the input is that arc length, so the matching point is $(t, \sin t)$, at the same height as the circle point. Swapping sine and cosine is the usual mistake: sine is the vertical one.
- id: trig-m4-r2-q02
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  type: text
  stem: 'On $[0, 2\pi]$, the graph of $y = \cos x$ reaches its minimum value ___ at $x =$ ___. (Type pi for $\pi$.)'
  accept:
    - ['-1', '−1']
    - [pi, π]
  explanation: |-
    Cosine is the horizontal coordinate of the unit-circle point. It is smallest, $-1$, when the point is at $(-1, 0)$, a half turn: $x = \pi$. The key points of one cycle are $(0, 1), (\tfrac{\pi}{2}, 0), (\pi, -1), (\tfrac{3\pi}{2}, 0), (2\pi, 1)$. ($\tfrac{3\pi}{2}$ is where *sine* has its minimum.)
- id: trig-m4-r2-q03
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  type: order
  stem: 'Follow the graph of $y = -2\cos x$ from $x = 0$ to $x = 2\pi$. Put the points it passes through in order.'
  items:
    - 'Its minimum, $(0, -2)$'
    - 'A zero where it is rising'
    - 'Its maximum, $(\pi, 2)$'
    - 'A zero where it is falling'
    - 'Its minimum again, $(2\pi, -2)$'
  explanation: |-
    Multiply the cosine key points by $-2$: $(0, -2)$, $(\tfrac{\pi}{2}, 0)$, $(\pi, 2)$, $(\tfrac{3\pi}{2}, 0)$, $(2\pi, -2)$. The graph starts at its minimum because the negative factor flips cosine upside down, rises through the zero at $\tfrac{\pi}{2}$ to the maximum at $\pi$, falls through the zero at $\tfrac{3\pi}{2}$, and is back at the minimum at $2\pi$.
- id: trig-m4-r2-q04
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  stem: 'Which statements about the graph of $y = \sin x$ are true? Select all that apply.'
  choices: ['Its range is $[-1, 1]$', 'Its zeros are at $x = k\pi$ for every integer $k$', 'It is symmetric about the $y$-axis', 'Its maxima are at $x = \tfrac{\pi}{2} + 2k\pi$', 'It repeats every $\pi$ units']
  answer: [0, 1, 3]
  explanation: |-
    Sine's values run from $-1$ to $1$, it is zero at every multiple of $\pi$, and it peaks at $\tfrac{\pi}{2}$ and every full turn after that. It is *not* symmetric about the $y$-axis: sine is odd, so its graph is symmetric about the origin (cosine is the even one). Its period is $2\pi$, not $\pi$: after $\pi$ units the graph is upside down.
- id: trig-m4-r2-q05
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  type: match
  stem: 'Match each function to how its graph starts at $x = 0$.'
  pairs:
    - ['$y = 3\sin x$', 'At 0, heading up to 3']
    - ['$y = -3\sin x$', 'At 0, heading down to −3']
    - ['$y = 3\cos x$', 'At its maximum, 3']
    - ['$y = -3\cos x$', 'At its minimum, −3']
  distractors: ['At its maximum, −3']
  explanation: |-
    Sine starts on the axis going up; a negative factor makes it go down first. Cosine starts at its maximum; a negative factor turns that into a minimum. All four have amplitude 3 (amplitude is never negative), so "maximum −3" describes none of them.
# ---------- trig-transform (core, lesson 14) ----------
- id: trig-m4-r2-q06
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  type: label
  stem: 'The picture shows $y = A\sin\big(B(x - C)\big) + D$ with $A > 0$ and $C > 0$. Name the numbered parts.'
  image: {src: images/trig-m4-sinusoid-parts-blank.svg, alt: 'A sine-shaped wave with a dashed horizontal line through its middle. Five parts are numbered: a short double arrow from the y-axis to where a cycle starts, the dashed line, a vertical double arrow from the dashed line up to a peak, a long double arrow along the bottom covering one full cycle, and a double arrow above the curve from the start of the cycle to the first peak.'}
  labels:
    - {x: 15.0, y: 80.7, text: Phase shift}
    - {x: 68.6, y: 45.8, text: Midline}
    - {x: 38.6, y: 32.1, text: Amplitude}
    - {x: 60.9, y: 80.7, text: Period}
    - {x: 30.0, y: 10.9, text: Quarter period}
  distractors: [Frequency, Vertical asymptote]
  explanation: |-
    The phase shift $C$ is the horizontal distance from the $y$-axis to the start of a cycle, where the curve crosses the midline going up. The midline is the line $y = D$ through the middle of the wave. The amplitude $|A|$ is measured from the midline up to a peak. The period $\tfrac{2\pi}{B}$ is the length of one full cycle, and a quarter of it takes the curve from the start to the first maximum. Frequency is a number (cycles per unit), not a length on the picture, and a sinusoid has no asymptotes.
- id: trig-m4-r2-q07
  lesson: trig-transform
  topic: Sinusoidal transformations
  type: text
  stem: 'For $y = 4\cos\!\left(\tfrac{\pi}{5}x - \pi\right) - 2$: the amplitude is ___, the period is ___, the phase shift is ___ units to the right, and the midline is $y =$ ___. Give numbers only.'
  accept:
    - ['4']
    - ['10']
    - ['5']
    - ['-2', '−2']
  explanation: |-
    Factor $B = \tfrac{\pi}{5}$ out of the argument: $\tfrac{\pi}{5}x - \pi = \tfrac{\pi}{5}(x - 5)$. So the amplitude is $|4| = 4$, the period is $\dfrac{2\pi}{\pi/5} = 10$, the phase shift is 5 to the right, and the midline is $y = -2$. Reading the shift as $\pi$ from the unfactored form is the classic mistake.
- id: trig-m4-r2-q08
  lesson: trig-transform
  topic: Sinusoidal transformations
  type: order
  stem: 'Put the steps for graphing $y = 2\sin(4x + \pi) + 1$ in order.'
  items:
    - 'Factor the inside: $y = 2\sin\!\left(4\left(x + \tfrac{\pi}{4}\right)\right) + 1$'
    - 'Read amplitude 2, period $\tfrac{\pi}{2}$, phase shift $\tfrac{\pi}{4}$ left, midline $y = 1$'
    - 'Mark one cycle from $x = -\tfrac{\pi}{4}$ to $x = \tfrac{\pi}{4}$'
    - 'Split that cycle into quarters of length $\tfrac{\pi}{8}$'
    - 'Plot midline, max, midline, min, midline at the five $x$-values and join smoothly'
  explanation: |-
    Each step needs the one before it. The phase shift can only be read after factoring. The cycle runs from the phase shift $-\tfrac{\pi}{4}$ to $-\tfrac{\pi}{4} + \tfrac{\pi}{2} = \tfrac{\pi}{4}$, so you need the shift and the period first. The quarter points split that cycle, and the sine pattern (heights $1, 3, 1, -1, 1$) is placed at those five $x$-values last.
- id: trig-m4-r2-q09
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  stem: 'Which functions have period $\pi$? Select all that apply.'
  choices: ['$y = \sin 2x$', '$y = 3\cos(2x - 1)$', '$y = \sin(x + \pi)$', '$y = \cos\tfrac{x}{2}$', '$y = -\sin(2x) + 5$']
  answer: [0, 1, 4]
  explanation: |-
    The period is $\tfrac{2\pi}{B}$, so period $\pi$ means $B = 2$. That is true of $\sin 2x$, $3\cos(2x - 1)$ and $-\sin(2x) + 5$; the amplitude, the phase shift and the vertical shift don't change the period. $\sin(x + \pi)$ has $B = 1$ and period $2\pi$ (the $+\pi$ is a shift), and $\cos\tfrac{x}{2}$ has period $\tfrac{2\pi}{1/2} = 4\pi$.
- id: trig-m4-r2-q10
  lesson: trig-transform
  topic: Sinusoidal transformations
  type: match
  stem: 'Match each function to its phase shift.'
  pairs:
    - ['$y = \sin\!\left(x - \tfrac{\pi}{3}\right)$', 'π/3 to the right']
    - ['$y = \sin\!\left(2x + \tfrac{\pi}{3}\right)$', 'π/6 to the left']
    - ['$y = \cos(2x - \pi)$', 'π/2 to the right']
    - ['$y = \cos(3x + \pi)$', 'π/3 to the left']
  distractors: ['π to the left', 'π/6 to the right']
  explanation: |-
    Factor out $B$ and read $C$ from $B(x - C)$. $x - \tfrac{\pi}{3}$: $\tfrac{\pi}{3}$ right. $2x + \tfrac{\pi}{3} = 2\left(x + \tfrac{\pi}{6}\right)$: $\tfrac{\pi}{6}$ left. $2x - \pi = 2\left(x - \tfrac{\pi}{2}\right)$: $\tfrac{\pi}{2}$ right. $3x + \pi = 3\left(x + \tfrac{\pi}{3}\right)$: $\tfrac{\pi}{3}$ left. "$\pi$ to the left" is what you get for the last one if you forget to factor.
# ---------- trig-graph-tan (core, lesson 15) ----------
- id: trig-m4-r2-q11
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  type: label
  stem: 'The picture shows one branch of $y = \tan x$. Name the numbered parts.'
  image: {src: images/trig-m4-tan-branch-blank.svg, alt: 'One rising branch of the tangent graph between two dashed vertical lines, one on each side of the y-axis. Five parts are numbered: the left dashed line, the right dashed line, the point where the curve crosses the origin, a point on the curve to the right of the origin, and a point on the curve to the left of it.'}
  labels:
    - {x: 22.1, y: 19.7, text: Asymptote x = −π/2}
    - {x: 77.9, y: 80.2, text: Asymptote x = π/2}
    - {x: 50.0, y: 50.0, text: 'Zero at (0, 0)'}
    - {x: 63.9, y: 36.2, text: 'Point (π/4, 1)'}
    - {x: 36.1, y: 63.7, text: 'Point (−π/4, −1)'}
  distractors: ['Point (π/4, √2/2)', Maximum]
  explanation: |-
    Tangent is undefined where $\cos x = 0$, so the branch is fenced in by asymptotes at $x = -\tfrac{\pi}{2}$ (left) and $x = \tfrac{\pi}{2}$ (right). It crosses the origin because $\tan 0 = 0$, and halfway to each asymptote it passes through $(\tfrac{\pi}{4}, 1)$ and $(-\tfrac{\pi}{4}, -1)$. $\tfrac{\sqrt2}{2}$ is $\sin\tfrac{\pi}{4}$, not $\tan\tfrac{\pi}{4}$, and the branch has no maximum: it rises without bound.
- id: trig-m4-r2-q12
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  type: text
  stem: 'For $y = \tan\tfrac{\pi x}{4}$, the period is ___, and the first vertical asymptote to the right of the origin is $x =$ ___. Give numbers only.'
  accept:
    - ['4']
    - ['2']
  explanation: |-
    Tangent's period is $\tfrac{\pi}{B} = \dfrac{\pi}{\pi/4} = 4$. The branch through the origin has its asymptotes where the input is $\pm\tfrac{\pi}{2}$: $\tfrac{\pi x}{4} = \tfrac{\pi}{2}$ gives $x = 2$. (Using $\tfrac{2\pi}{B}$ would give the wrong period 8.)
- id: trig-m4-r2-q13
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  type: match
  stem: 'Match each feature to the function it describes.'
  pairs:
    - ['Vertical asymptotes at $x = k\pi$', y = cot x]
    - ['Vertical asymptotes at $x = \tfrac{\pi}{2} + k\pi$', y = tan x]
    - ['Zeros at $x = k\pi$', y = tan x]
    - ['Decreasing on every branch', y = cot x]
    - ['Increasing on every branch', y = tan x]
  explanation: |-
    $\tan x = \tfrac{\sin x}{\cos x}$ is zero where $\sin x = 0$ (at $k\pi$) and has asymptotes where $\cos x = 0$ (at $\tfrac{\pi}{2} + k\pi$). $\cot x = \tfrac{\cos x}{\sin x}$ swaps those roles, so its asymptotes are at $k\pi$. Tangent rises on every branch and cotangent falls on every branch.
- id: trig-m4-r2-q14
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  stem: 'Which statements about $y = 3\tan(2x)$ are true? Select all that apply.'
  choices: ['Its period is $\tfrac{\pi}{2}$', 'Its amplitude is 3', 'It has a vertical asymptote at $x = \tfrac{\pi}{4}$', 'Its range is all real numbers', 'It passes through $\left(\tfrac{\pi}{4}, 3\right)$']
  answer: [0, 2, 3]
  explanation: |-
    Period: $\tfrac{\pi}{B} = \tfrac{\pi}{2}$. Asymptotes where $2x = \tfrac{\pi}{2} + k\pi$, so $x = \tfrac{\pi}{4}$ is one. Like every tangent graph its range is all real numbers. It has no amplitude (3 only stretches it), and it cannot pass through a point at $x = \tfrac{\pi}{4}$, since it is undefined there. (It passes through $\left(\tfrac{\pi}{8}, 3\right)$.)
- id: trig-m4-r2-q15
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  type: order
  stem: 'Put these values in order from smallest to largest (angles in radians).'
  items: ['$\tan 2$', '$\tan 3$', '$\tan 0.5$', '$\tan 1.4$']
  explanation: |-
    $0.5$ and $1.4$ are in $(0, \tfrac{\pi}{2})$, where tangent is positive and increasing, so $\tan 0.5 \approx 0.546 < \tan 1.4 \approx 5.80$. $2$ and $3$ are in $(\tfrac{\pi}{2}, \pi)$, quadrant II, where tangent is negative. That piece of the next branch is also increasing, so $\tan 2 \approx -2.19 < \tan 3 \approx -0.14$. The two negative values come first.
# ---------- trig-graph-sec (core, lesson 16) ----------
- id: trig-m4-r2-q16
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  type: label
  stem: 'The picture shows $y = \sec x$ drawn from $y = \cos x$. Name the numbered parts.'
  image: {src: images/trig-m4-sec-guide-blank.svg, alt: 'A dashed wave and a set of U-shaped solid branches separated by dashed vertical lines. Five parts are numbered: a point on the dashed wave, one dashed vertical line, a branch opening upward, a branch opening downward, and a point where a branch touches the dashed wave.'}
  labels:
    - {x: 29.9, y: 54.6, text: Guide curve y = cos x}
    - {x: 61.1, y: 20.0, text: Vertical asymptote}
    - {x: 38.3, y: 26.9, text: Branch opening up}
    - {x: 82.9, y: 70.1, text: Branch opening down}
    - {x: 47.1, y: 37.5, text: Vertex where both curves touch}
  distractors: [Horizontal asymptote, Zero of y = sec x]
  explanation: |-
    The dashed wave is the guide $y = \cos x$. Where it crosses the axis, $\sec x = \tfrac{1}{\cos x}$ is undefined, giving vertical asymptotes. Above each cosine peak a branch opens up, and below each valley a branch opens down; each branch touches the guide at its vertex, such as $(0, 1)$, where $\cos x = \sec x = \pm1$. Secant has no zeros (a reciprocal is never 0) and no horizontal asymptote.
- id: trig-m4-r2-q17
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  type: text
  stem: 'The range of $y = 2\sec x - 1$ is $(-\infty,$ ___ $] \cup [$ ___ $, \infty)$. Give numbers only.'
  accept:
    - ['-3', '−3']
    - ['1']
  explanation: |-
    The guide $y = 2\cos x - 1$ has midline $y = -1$ and amplitude 2, so its maximum is 1 and its minimum is $-3$. The secant branches turn at those heights and head away from the midline: $(-\infty, -3] \cup [1, \infty)$.
- id: trig-m4-r2-q18
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  type: order
  stem: 'Move along the graph of $y = \csc x$ from $x = 0$ to $x = 2\pi$. Put the features in the order you meet them.'
  items:
    - 'Asymptote $x = 0$'
    - 'Local minimum $\left(\tfrac{\pi}{2}, 1\right)$'
    - 'Asymptote $x = \pi$'
    - 'Local maximum $\left(\tfrac{3\pi}{2}, -1\right)$'
    - 'Asymptote $x = 2\pi$'
  explanation: |-
    $\csc x = \tfrac{1}{\sin x}$ has asymptotes where $\sin x = 0$: at $0$, $\pi$ and $2\pi$. Between $0$ and $\pi$ sine is positive with peak 1 at $\tfrac{\pi}{2}$, so cosecant has an upward branch with local minimum $(\tfrac{\pi}{2}, 1)$. Between $\pi$ and $2\pi$ sine is negative with valley $-1$ at $\tfrac{3\pi}{2}$, giving a downward branch with local maximum $(\tfrac{3\pi}{2}, -1)$.
- id: trig-m4-r2-q19
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  stem: 'Which values can $\sec x$ take? Select all that apply.'
  choices: ['$-3$', '$0.5$', '$1$', '$-1$', '$0$']
  answer: [0, 2, 3]
  explanation: |-
    $\sec x = \tfrac{1}{\cos x}$ with $\cos x$ in $[-1, 1]$ and never 0, so $|\sec x| \ge 1$: the range is $(-\infty, -1] \cup [1, \infty)$. $-3$ (when $\cos x = -\tfrac13$), $1$ (at $x = 0$) and $-1$ (at $x = \pi$) all occur. $0.5$ would need $\cos x = 2$, and $0$ would need $\tfrac{1}{\cos x} = 0$, which never happens.
- id: trig-m4-r2-q20
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  type: match
  stem: 'Match each function to its range.'
  pairs:
    - ['$y = \sec x$', '(−∞, −1] ∪ [1, ∞)']
    - ['$y = 3\csc x$', '(−∞, −3] ∪ [3, ∞)']
    - ['$y = \sec x + 2$', '(−∞, 1] ∪ [3, ∞)']
    - ['$y = 2\csc x - 1$', '(−∞, −3] ∪ [1, ∞)']
  distractors: ['[−1, 1]']
  explanation: |-
    For $A\sec(\cdot) + D$ or $A\csc(\cdot) + D$ the range is $(-\infty, D - |A|] \cup [D + |A|, \infty)$. $\sec x$: $D = 0$, $|A| = 1$. $3\csc x$: $\pm3$. $\sec x + 2$: $2 \pm 1$, so 1 and 3. $2\csc x - 1$: $-1 \pm 2$, so $-3$ and 1. $[-1, 1]$ is the range of sine and cosine, the one set of values secant and cosecant mostly avoid.
# ---------- trig-modeling (core, lesson 17) ----------
- id: trig-m4-r2-q21
  lesson: trig-modeling
  module_quiz: true
  topic: Sinusoidal models
  type: label
  stem: 'A rider''s height on this Ferris wheel is modeled by $h(t) = 30 - 25\cos\!\left(\tfrac{\pi}{2}t\right)$. Name the numbered parts by the role each plays in the model.'
  image: {src: images/trig-m4-ferris-blank.svg, alt: 'A Ferris wheel beside a height scale marked 0, 5, 30 and 55 m. Five parts are numbered: the hub, the red spoke from the hub down to the rider, the rider at the bottom of the wheel, the top of the wheel, and the ground.'}
  labels:
    - {x: 40.3, y: 45.2, text: 'Center: midline height'}
    - {x: 40.3, y: 63.1, text: 'Radius: the amplitude'}
    - {x: 40.3, y: 81.0, text: 'Boarding point: minimum height'}
    - {x: 40.3, y: 9.5, text: 'Top: maximum height'}
    - {x: 17.7, y: 88.1, text: 'Ground: height 0'}
  distractors: ['Radius: the period', 'Center: maximum height']
  explanation: |-
    The hub's height, 30 m, is the midline $D$, because the rider spends equal time above and below it. The radius, 25 m, is the amplitude: the farthest the rider gets from the hub's height. The rider boards at the bottom, the minimum $30 - 25 = 5$ m, which is why the model uses $-\cos$; the top is the maximum $30 + 25 = 55$ m. Heights are measured from the ground. The period (4 minutes) is a time, not a length on the wheel.
- id: trig-m4-r2-q22
  lesson: trig-modeling
  topic: Sinusoidal models
  type: text
  stem: 'A buoy rides the waves between 1.2 m and 3.6 m above the sea floor. In a sinusoidal model of its height, the midline is $y =$ ___ and the amplitude is ___. Give numbers only.'
  accept:
    - ['2.4']
    - ['1.2']
  explanation: |-
    Midline: $\dfrac{\max + \min}{2} = \dfrac{3.6 + 1.2}{2} = 2.4$. Amplitude: $\dfrac{\max - \min}{2} = \dfrac{3.6 - 1.2}{2} = 1.2$. (2.4 is also the full max-to-min distance; the amplitude is half of it.)
- id: trig-m4-r2-q23
  lesson: trig-modeling
  module_quiz: true
  topic: Simple harmonic motion
  type: match
  stem: 'A mass on a spring moves 5 cm from equilibrium at most, with up positive and angular frequency $\omega$. Match each start at $t = 0$ to its model.'
  pairs:
    - ['Released from rest 5 cm above equilibrium', 'd = 5 cos(ωt)']
    - ['Released from rest 5 cm below equilibrium', 'd = −5 cos(ωt)']
    - ['Passing equilibrium, moving up', 'd = 5 sin(ωt)']
    - ['Passing equilibrium, moving down', 'd = −5 sin(ωt)']
  distractors: ['d = 5 cos(ωt) + 5']
  explanation: |-
    Cosine starts at its maximum, so it fits a release from the highest point; $-\cos$ starts at the minimum, a release from below. Sine starts at 0 heading up, so it fits a mass passing equilibrium on the way up; $-\sin$ starts at 0 heading down. Displacement is measured from equilibrium, so no $+5$ shift belongs in any of these models.
- id: trig-m4-r2-q24
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'A model of average monthly highs is $T(t) = 12\cos\!\left(\tfrac{\pi}{6}(t - 7)\right) + 60$, with $t = 1$ for January. Which statements are true? Select all that apply.'
  choices: ['The highest average high is 72', 'The period is 12 months', 'The lowest average high comes at $t = 1$', 'The amplitude is 24', 'The midline is $T = 12$']
  answer: [0, 1, 2]
  explanation: |-
    The midline is $T = 60$ and the amplitude is 12, so the maximum is $60 + 12 = 72$ and the minimum is 48. The period is $\dfrac{2\pi}{\pi/6} = 12$. The cosine peaks at $t = 7$ (July), and the minimum is half a period away, at $t = 7 - 6 = 1$ (January). 24 is the max-to-min distance, twice the amplitude, and 12 is the amplitude, not the midline.
- id: trig-m4-r2-q25
  lesson: trig-modeling
  topic: Sinusoidal models
  type: order
  stem: 'A rider boards a Ferris wheel at the bottom at $t = 0$, and the wheel turns once every 8 minutes. Put the rider''s positions in order of time during the first ride around.'
  items:
    - 'At the bottom, boarding'
    - 'At the height of the hub, rising'
    - 'At the top'
    - 'At the height of the hub, descending'
    - 'Back at the bottom'
  explanation: |-
    The height is $h(t) = D - r\cos\!\left(\tfrac{2\pi}{8}t\right)$: minimum at $t = 0$, the midline (hub height) going up at $t = 2$, the maximum at $t = 4$, the midline going down at $t = 6$, and the minimum again at $t = 8$. Each step is a quarter of the 8-minute period.
# ---------- trig-m4-h-combining (honors, lesson 17h1) ----------
- id: trig-m4-r2-h01
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'What is the smallest period of $y = \sin\tfrac{\pi x}{2} + \cos\tfrac{\pi x}{3}$?'
  choices: ['$24$', '$10$', '$12$', '$2$']
  answer: 2
  explanation: |-
    The periods are $\dfrac{2\pi}{\pi/2} = 4$ and $\dfrac{2\pi}{\pi/3} = 6$. Their ratio is $\tfrac46 = \tfrac23$, so the least common multiple is $3 \cdot 4 = 2 \cdot 6 = 12$. After 12 units the first term has done 3 cycles and the second 2. The two terms have different frequencies, so nothing shorter works. (24 is the product of the periods and 10 their sum; neither is how periods combine.)
- id: trig-m4-r2-h02
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'What is the smallest period of $y = \sin 3x + \cos 2x$?'
  choices: ['$\tfrac{2\pi^2}{3}$', '$2\pi$', '$\tfrac{5\pi}{3}$', '$\pi$']
  answer: 1
  explanation: |-
    The periods are $\tfrac{2\pi}{3}$ and $\pi$. Their ratio is $\dfrac{2\pi/3}{\pi} = \tfrac23$, so $L = 3 \cdot \tfrac{2\pi}{3} = 2 \cdot \pi = 2\pi$. $\tfrac{2\pi^2}{3}$ multiplies the periods and $\tfrac{5\pi}{3}$ adds them. After only $\pi$ the $\sin 3x$ term is half a cycle off, so $\pi$ is not a period.
- id: trig-m4-r2-h03
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'Which function is not periodic?'
  choices: ['$y = \sin x + \cos 2x$', '$y = |\sin x|$', '$y = \sin 2x + \cos 3x$', '$y = \sin x + \sin(\pi x)$']
  answer: 3
  explanation: |-
    $\sin x$ has period $2\pi$ and $\sin(\pi x)$ has period $\tfrac{2\pi}{\pi} = 2$. Their ratio, $\pi$, is irrational, so no length is a whole number of both periods and the sum never repeats. The others are periodic: $\sin x + \cos 2x$ and $\sin 2x + \cos 3x$ both repeat every $2\pi$, and $|\sin x|$ repeats every $\pi$.
- id: trig-m4-r2-h04
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'What is the value of $y = x + \sin x$ at $x = \tfrac{3\pi}{2}$?'
  choices: ['$\tfrac{3\pi}{2} + 1$', '$-1$', '$\tfrac{3\pi}{2}$', '$\tfrac{3\pi}{2} - 1$']
  answer: 3
  explanation: |-
    Add the ordinates: the line gives $\tfrac{3\pi}{2}$ and $\sin\tfrac{3\pi}{2} = -1$, so $y = \tfrac{3\pi}{2} - 1 \approx 3.71$. The graph is one unit below the line $y = x$ there, its farthest point below the line. ($-1$ forgets the line; $\tfrac{3\pi}{2}$ is where $\sin x = 0$ would put it.)
- id: trig-m4-r2-h05
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'On $[0, 2\pi]$, where does the graph of $y = \sin x + \sin 2x$ meet the graph of $y = \sin x$?'
  choices: ['At $x = 0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}, 2\pi$', 'Only at $x = 0, \pi, 2\pi$', 'At $x = \tfrac{\pi}{4}$ and $\tfrac{5\pi}{4}$ only', 'Nowhere, because the two graphs are different']
  answer: 0
  explanation: |-
    The two graphs meet exactly where the added term $\sin 2x$ is zero: $2x = k\pi$, so $x = \tfrac{k\pi}{2}$. On $[0, 2\pi]$ that is $0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}, 2\pi$. Only $0, \pi, 2\pi$ are the zeros of $\sin x$, which is a different question. At $\tfrac{\pi}{4}$, $\sin 2x = 1$, so the sum is a full unit above $\sin x$ there.
- id: trig-m4-r2-h06
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'Which pair of curves is the envelope of $y = e^{-0.5x}\sin(4x)$, the curves its graph stays between and touches?'
  choices: ['$y = \pm 4$', '$y = \pm e^{-0.5x}$', '$y = \pm 4e^{-0.5x}$', '$y = \pm 1$']
  answer: 1
  explanation: |-
    Since $-1 \le \sin(4x) \le 1$ and $e^{-0.5x} > 0$, the product stays between $-e^{-0.5x}$ and $e^{-0.5x}$, and it touches them wherever $\sin(4x) = \pm1$: that is its envelope. The 4 inside the sine changes how fast the graph swings, not how high, so $\pm4e^{-0.5x}$ is too wide (never touched) and $\pm4$ makes no sense. $\pm1$ does not shrink with the swings, and for $x < 0$ the graph goes beyond it.
- id: trig-m4-r2-h07
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'For $x > 0$, where does the graph of $y = x\sin x$ touch the line $y = x$? ($k = 0, 1, 2, \ldots$)'
  choices: ['$x = k\pi$', '$x = 2k\pi$', '$x = \tfrac{\pi}{2} + 2k\pi$', '$x = \tfrac{\pi}{2} + k\pi$']
  answer: 2
  explanation: |-
    $x\sin x = x$ with $x > 0$ means $\sin x = 1$, so $x = \tfrac{\pi}{2} + 2k\pi$. At $\tfrac{\pi}{2} + k\pi$ with $k$ odd, $\sin x = -1$, and the graph touches the *lower* envelope $y = -x$ instead. At $k\pi$ the graph is zero, crossing the axis.
- id: trig-m4-r2-h08
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'The graph of $y = x\sin x$ touches $y = x$ at $x = \tfrac{\pi}{2}$. Where is its first local maximum for $x > 0$?'
  choices: ['Exactly at $x = \tfrac{\pi}{2}$, since that is where $\sin x = 1$', 'A little to the left, near $x \approx 1.2$', 'A little to the right, near $x \approx 2.03$', 'At $x = \pi$, where the graph meets the axis']
  answer: 2
  explanation: |-
    After $x = \tfrac{\pi}{2}$, $\sin x$ starts to decrease, but slowly at first, while the factor $x$ keeps growing, so the product keeps rising for a while. The first peak is near $x \approx 2.029$, height about $1.820$, which is above the touching point's height $\tfrac{\pi}{2} \approx 1.571$ but still below the envelope there. At $\pi$ the graph is 0.
- id: trig-m4-r2-h09
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'A damped vibration is $y = 5e^{-0.1t}\cos(\pi t)$. When has its envelope fallen to half its starting height?'
  choices: ['$t \approx 6.93$', '$t = 5$', '$t \approx 0.69$', '$t \approx 3.47$']
  answer: 0
  explanation: |-
    The envelope is $5e^{-0.1t}$, starting at 5. Set $e^{-0.1t} = \tfrac12$: $-0.1t = \ln\tfrac12$, so $t = \dfrac{\ln 2}{0.1} \approx 6.93$. $0.69$ forgets to divide by 0.1, and $3.47$ uses 0.2. The cosine factor doesn't affect when the envelope halves.
- id: trig-m4-r2-h10
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'As $x$ gets closer and closer to 0 (in radians), what happens to $\dfrac{\sin x}{x}$?'
  choices: ['It approaches 0', 'It grows without bound', 'It approaches $\tfrac{\pi}{180}$', 'It approaches 1']
  answer: 3
  explanation: |-
    The formula is undefined at 0, but the values settle down: about 0.9983 at $x = 0.1$ and 0.99998 at $x = 0.01$. They approach 1 (the next honors lesson proves it). The value $\tfrac{\pi}{180}$ would appear if $x$ were measured in degrees.
- id: trig-m4-r2-h11
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  type: text
  stem: 'The function $y = \sin\tfrac{\pi x}{5} + \cos\tfrac{\pi x}{2}$ has smallest period ___. Give a number.'
  accept: ['20']
  explanation: |-
    The periods are $\dfrac{2\pi}{\pi/5} = 10$ and $\dfrac{2\pi}{\pi/2} = 4$. Their ratio is $\tfrac{10}{4} = \tfrac52$, so $L = 2 \cdot 10 = 5 \cdot 4 = 20$. The terms have different frequencies, so 20 is the smallest period.
- id: trig-m4-r2-h12
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  type: match
  stem: 'Match each function to its smallest period.'
  pairs:
    - ['$y = \sin(\pi x) + \cos\tfrac{\pi x}{2}$', '4']
    - ['$y = \sin(2\pi x) + \sin(3\pi x)$', '2']
    - ['$y = |\sin x| + |\cos x|$', 'π/2']
    - ['$y = \sin 2x + \cos 3x$', '2π']
    - ['$y = \sin x + \sin(\sqrt2\,x)$', 'Not periodic']
  distractors: ['π']
  explanation: |-
    Periods 2 and 4 give 4. Periods 1 and $\tfrac23$ have ratio $\tfrac32$, giving $2 \cdot 1 = 3 \cdot \tfrac23 = 2$. $|\sin x|$ and $|\cos x|$ each have period $\pi$, but shifting by $\tfrac{\pi}{2}$ swaps them, so the sum repeats every $\tfrac{\pi}{2}$ (the special case). Periods $\pi$ and $\tfrac{2\pi}{3}$ give $2\pi$. Periods $2\pi$ and $\sqrt2\,\pi$ have an irrational ratio, so that sum is not periodic.
- id: trig-m4-r2-h13
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  stem: 'Which statements about $y = e^{-0.3t}\cos(2\pi t)$, for $t \ge 0$, are true? Select all that apply.'
  choices: ['Its graph stays between $y = e^{-0.3t}$ and $y = -e^{-0.3t}$', 'Its zeros are evenly spaced, 0.5 apart', 'It is periodic with period 1', 'It touches its upper envelope at $t = 0, 1, 2, \ldots$', 'Its local maxima get higher as $t$ grows']
  answer: [0, 1, 3]
  explanation: |-
    The envelope is $\pm e^{-0.3t}$. The zeros are the zeros of $\cos(2\pi t)$, at $t = \tfrac14, \tfrac34, \tfrac54, \ldots$, which are 0.5 apart, and the graph touches the upper envelope where $\cos(2\pi t) = 1$, at whole numbers. But the function is not periodic: the swings shrink, so the values never repeat a full cycle. For the same reason its peaks get lower, not higher.
- id: trig-m4-r2-h14
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  type: label
  stem: 'The picture shows $y = x\sin x$ with its envelope. Name the numbered parts.'
  image: {src: images/trig-m4-envelope-blank.svg, alt: 'A wave that grows as it moves right, drawn between two dashed lines opening out from the origin. Five parts are numbered: a point on the upper dashed line, a point on the lower dashed line, a point where the wave touches the upper line, a point where it touches the lower line, and a point where it crosses the x-axis.'}
  labels:
    - {x: 43.3, y: 28.7, text: Upper envelope y = x}
    - {x: 63.0, y: 82.9, text: Lower envelope y = −x}
    - {x: 58.8, y: 19.6, text: Touches the upper envelope (sin x = 1)}
    - {x: 79.4, y: 92.6, text: Touches the lower envelope (sin x = −1)}
    - {x: 69.1, y: 50.0, text: Zero (sin x = 0)}
  distractors: [Vertical asymptote, Midline]
  explanation: |-
    Because $-1 \le \sin x \le 1$, the product $x\sin x$ stays between the lines $y = x$ and $y = -x$ (for $x > 0$). It touches the upper line where $\sin x = 1$ (the marked point is at $\tfrac{5\pi}{2}$), touches the lower line where $\sin x = -1$ (at $\tfrac{7\pi}{2}$), and crosses the axis where $\sin x = 0$ (at $3\pi$). The graph has no asymptotes, and it has no horizontal midline.
- id: trig-m4-r2-h15
  lesson: trig-m4-h-combining
  topic: Combining trig graphs
  type: order
  stem: 'Put the steps for finding the period of $y = \sin\tfrac{\pi x}{4} + \cos\tfrac{\pi x}{6}$ in order.'
  items:
    - 'Find each term''s period: 8 and 12'
    - 'Divide them: $\tfrac{8}{12} = \tfrac23$ in lowest terms'
    - 'Multiply across: $L = 3 \cdot 8 = 2 \cdot 12 = 24$'
    - 'Confirm that no shorter shift works: the period is 24'
  explanation: |-
    The periods are $\dfrac{2\pi}{\pi/4} = 8$ and $\dfrac{2\pi}{\pi/6} = 12$. Their ratio in lowest terms, $\tfrac23$, tells you that 3 of the first period equal 2 of the second: $L = 24$. The last step is the check; here the terms have different frequencies, so 24 is the smallest period.
# ---------- trig-m4-h-small-angles (honors, lesson 17h2) ----------
- id: trig-m4-r2-h16
  lesson: trig-m4-h-small-angles
  topic: Rates of change of sinusoids
  stem: 'What is the average rate of change of $y = \cos x$ from $x = 0$ to $x = \tfrac{\pi}{2}$?'
  choices: ['$-\tfrac{2}{\pi}$', '$-1$', '$\tfrac{2}{\pi}$', '$-\tfrac{\pi}{2}$']
  answer: 0
  explanation: |-
    $\dfrac{\cos\frac{\pi}{2} - \cos 0}{\frac{\pi}{2} - 0} = \dfrac{0 - 1}{\pi/2} = -\dfrac{2}{\pi} \approx -0.637$. It is negative because cosine falls on this interval. $-1$ forgets to divide by the width, and $-\tfrac{\pi}{2}$ divides the wrong way.
- id: trig-m4-r2-h17
  lesson: trig-m4-h-small-angles
  topic: Rates of change of sinusoids
  stem: 'Over which interval does $y = \sin x$ have the greatest average rate of change?'
  choices: ['$\left[\tfrac{\pi}{3}, \tfrac{\pi}{2}\right]$', '$\left[\tfrac{\pi}{6}, \tfrac{\pi}{3}\right]$', '$\left[\tfrac{\pi}{2}, \tfrac{2\pi}{3}\right]$', '$\left[0, \tfrac{\pi}{6}\right]$']
  answer: 3
  explanation: |-
    All four intervals have width $\tfrac{\pi}{6}$, so compare the rises: $0.5$ on $[0, \tfrac{\pi}{6}]$, $0.366$ on $[\tfrac{\pi}{6}, \tfrac{\pi}{3}]$, $0.134$ on $[\tfrac{\pi}{3}, \tfrac{\pi}{2}]$, and $-0.134$ on $[\tfrac{\pi}{2}, \tfrac{2\pi}{3}]$ (sine is falling there). The rates are about $0.955$, $0.699$, $0.256$ and $-0.256$: sine climbs fastest near its zero.
- id: trig-m4-r2-h18
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'For $0 < x < \tfrac{\pi}{2}$ (radians), which inequality is true?'
  choices: ['$x < \sin x < \tan x$', '$\sin x < x < \tan x$', '$\tan x < x < \sin x$', '$\sin x < \tan x < x$']
  answer: 1
  explanation: |-
    In the unit circle, triangle $OAP$ (area $\tfrac12\sin x$) fits inside the sector (area $\tfrac12 x$), which fits inside triangle $OAT$ (area $\tfrac12\tan x$). So $\sin x < x < \tan x$. For example at $x = 0.5$: $0.479 < 0.5 < 0.546$.
- id: trig-m4-r2-h19
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'In the area proof that $\tfrac{\sin x}{x} \to 1$, which region has area $\tfrac12 x$?'
  choices: ['The triangle $OAP$', 'The triangle $OAT$', 'The sector $OAP$', 'The whole quarter circle']
  answer: 2
  explanation: |-
    A sector of radius $r$ and angle $\theta$ (in radians) has area $\tfrac12 r^2\theta$; with $r = 1$ and $\theta = x$ that is $\tfrac12 x$. The triangles have areas $\tfrac12\sin x$ ($OAP$) and $\tfrac12\tan x$ ($OAT$), and the quarter circle has area $\tfrac{\pi}{4}$.
- id: trig-m4-r2-h20
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'Without a calculator, estimate $\sin 0.05$ ($0.05$ radians).'
  choices: ['$0.9988$', '$0.0009$', '$0.5$', '$0.05$']
  answer: 3
  explanation: |-
    For small angles in radians, $\sin x \approx x$, so $\sin 0.05 \approx 0.05$ (the true value is $0.049979$). $0.0009$ is $\sin(0.05^\circ)$, what a calculator in degree mode gives, and $0.9988$ is close to $\cos 0.05$.
- id: trig-m4-r2-h21
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'Use $\cos x \approx 1 - \tfrac{x^2}{2}$ to estimate $\cos 0.2$.'
  choices: ['$0.80$', '$0.98$', '$0.96$', '$0.99$']
  answer: 1
  explanation: |-
    $1 - \tfrac{(0.2)^2}{2} = 1 - \tfrac{0.04}{2} = 0.98$; the true value is $0.98007$. $0.96$ forgets to halve $x^2$, and $0.80$ uses $1 - x$.
- id: trig-m4-r2-h22
  lesson: trig-m4-h-small-angles
  topic: Rates of change of sinusoids
  stem: 'What is the steepest slope of the graph of $y = 3\sin(2x) + 1$?'
  choices: ['$3$', '$7$', '$\tfrac32$', '$6$']
  answer: 3
  explanation: |-
    Near a midline crossing, $3\sin(2x) \approx 3 \cdot 2x$, a line of slope $|A|B = 3 \cdot 2 = 6$. That is the steepest the curve gets. The amplitude 3 alone ignores how fast the wave repeats, and the $+1$ shift does not change any slope.
- id: trig-m4-r2-h23
  lesson: trig-m4-h-small-angles
  topic: Rates of change of sinusoids
  stem: 'A rider''s height is $h(t) = 20 - 15\cos\!\left(\tfrac{\pi}{3}t\right)$ m, $t$ in minutes. What is the fastest rate at which the rider rises?'
  choices: ['$15$ m/min', '$20$ m/min', '$5\pi \approx 15.7$ m/min', '$\tfrac{\pi}{3} \approx 1.05$ m/min']
  answer: 2
  explanation: |-
    The steepest slope of a sinusoid is $|A|B = 15 \cdot \tfrac{\pi}{3} = 5\pi \approx 15.7$ m/min, reached at the hub's height on the way up. It matches the rim's linear speed $r\omega = 15 \cdot \tfrac{\pi}{3}$, since at the side of the wheel the rider moves straight up. 15 is the amplitude alone, and 20 is the hub height.
- id: trig-m4-r2-h24
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'For small swings a pendulum''s period is $T = 2\pi\sqrt{L/g}$. If the length is made 4 times as long, what happens to the period?'
  choices: ['It doubles', 'It becomes 4 times as long', 'It halves', 'It stays the same']
  answer: 0
  explanation: |-
    $T$ is proportional to $\sqrt{L}$, and $\sqrt{4L} = 2\sqrt{L}$, so the period doubles. For example, a 0.25 m pendulum has $T \approx 1.00$ s and a 1 m pendulum has $T \approx 2.01$ s.
- id: trig-m4-r2-h25
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  stem: 'Which is the best estimate of $\sin 3^\circ$?'
  choices: ['$3$', '$0.1411$', '$0.0524$', '$0.0349$']
  answer: 2
  explanation: |-
    Convert to radians first: $3^\circ = \tfrac{3\pi}{180} \approx 0.0524$, and for a small angle $\sin x \approx x$. (The true value is $0.05234$.) $3$ applies the shortcut to degrees, $0.1411$ is $\sin 3$ in radians, and $0.0349$ is $2^\circ$ in radians.
- id: trig-m4-r2-h26
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  type: text
  stem: 'From 500 m away, the top of a cliff is $2^\circ$ above the horizontal. Using the small-angle approximation, its height above eye level is about ___ m. Give the nearest whole number.'
  accept: ['17']
  explanation: |-
    $2^\circ = \tfrac{2\pi}{180} \approx 0.03491$ rad, and $\tan x \approx x$ for small angles, so the height is about $500 \times 0.03491 \approx 17.45$, which rounds to 17 m. (The exact value, $500\tan 2^\circ \approx 17.46$ m, rounds the same way.)
- id: trig-m4-r2-h27
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  type: match
  stem: 'Match each quantity to its small-angle approximation ($x$ in radians, $d$ in degrees, both small).'
  pairs:
    - ['$\sin x$', 'x']
    - ['$\tan x$', 'x']
    - ['$\cos x$', '1 − x²/2']
    - ['$\sin(d^\circ)$', '0.01745 d']
  distractors: ['1 − x', 'd']
  explanation: |-
    $\sin x \approx x$ and $\tan x \approx x$ (both ratios to $x$ approach 1), and $\cos x \approx 1 - \tfrac{x^2}{2}$. In degrees you must convert first: $d^\circ = \tfrac{\pi}{180}d \approx 0.01745d$ radians, so $\sin(d^\circ) \approx 0.01745d$, not $d$.
- id: trig-m4-r2-h28
  lesson: trig-m4-h-small-angles
  topic: Rates of change of sinusoids
  stem: 'Which statements about $y = 4\sin\!\left(\tfrac{\pi}{2}t\right)$ are true? Select all that apply.'
  choices: ['Its steepest slope is $2\pi$', 'Its slope is 0 at its maxima', 'It is steepest at $t = 1$', 'It is steepest at $t = 0$ and at $t = 2$', 'Its steepest slope is 4']
  answer: [0, 1, 3]
  explanation: |-
    The steepest slope is $|A|B = 4 \cdot \tfrac{\pi}{2} = 2\pi \approx 6.28$, reached at the midline crossings $t = 0, 2, 4, \ldots$ (rising at 0, falling at 2). At $t = 1$ the graph is at its maximum 4, where the slope is 0. The amplitude 4 alone is not a slope.
- id: trig-m4-r2-h29
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  type: order
  stem: 'Put the steps of the proof that $\tfrac{\sin x}{x} \to 1$ (for $0 < x < \tfrac{\pi}{2}$) in order.'
  items:
    - 'Nest the regions: triangle $OAP$ inside sector $OAP$ inside triangle $OAT$'
    - 'Compare their areas: $\tfrac12\sin x < \tfrac12 x < \tfrac12\tan x$'
    - 'Divide by $\tfrac12\sin x$: $1 < \tfrac{x}{\sin x} < \tfrac{1}{\cos x}$'
    - 'Take reciprocals: $\cos x < \tfrac{\sin x}{x} < 1$'
    - 'Let $x$ shrink to 0: $\cos x \to 1$, so $\tfrac{\sin x}{x} \to 1$'
  explanation: |-
    The geometry comes first (the nesting), then the areas it implies. Dividing by $\tfrac12\sin x$ gives bounds on $\tfrac{x}{\sin x}$; taking reciprocals flips the inequalities and gives bounds on $\tfrac{\sin x}{x}$. Only then can the squeeze be applied as $x \to 0$.
- id: trig-m4-r2-h30
  lesson: trig-m4-h-small-angles
  topic: Small-angle approximations
  type: label
  stem: 'The picture is the one used to prove $\sin x < x < \tan x$. Name the numbered parts.'
  image: {src: images/trig-m4-sin-x-tan-blank.svg, alt: 'A quarter of the unit circle with center O and the point A on the x-axis. A ray at angle x meets the circle at P and the vertical line through A at T. Five parts are numbered: the vertical segment under P, the arc from A to P, the vertical segment from A up to T, the segment from O to A, and the point T.'}
  labels:
    - {x: 59.2, y: 69.7, text: 'Height of P: sin x'}
    - {x: 70.9, y: 61.5, text: Arc of length x}
    - {x: 75.0, y: 48.1, text: 'Tangent segment: tan x'}
    - {x: 38.4, y: 87.2, text: Radius of length 1}
    - {x: 75.0, y: 21.8, text: 'Point (1, tan x)'}
  distractors: ['Height of P: cos x', Arc of length sin x]
  explanation: |-
    $P = (\cos x, \sin x)$, so its height is $\sin x$. On the unit circle an arc's length equals its angle in radians, so arc $AP$ has length $x$. The ray $OP$ has slope $\tan x$, so where it meets the line $x = 1$ it is at height $\tan x$: that is $T = (1, \tan x)$, and segment $AT$ has length $\tan x$. $OA$ is a radius, length 1.
