# Module 3: Trig functions of any angle
- id: trig-q-0901
  lesson: trig-any-angle
  module_quiz: true
  topic: Trig functions of any angle
  stem: 'The point $(-5, 12)$ is on the terminal side of $\theta$. What is $\cos\theta$?'
  choices: ['$\dfrac{5}{13}$', '$-\dfrac{5}{12}$', '$\dfrac{12}{13}$', '$-\dfrac{5}{13}$']
  answer: 3
  explanation: |-
    $r = \sqrt{25 + 144} = 13$ and $\cos\theta = \tfrac{x}{r} = -\tfrac{5}{13}$. The sign comes
    from $x = -5$; $\tfrac{12}{13}$ is $\sin\theta$.
- id: trig-q-0902
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: 'The point $(4, -3)$ is on the terminal side of $\theta$. What is $\tan\theta$?'
  choices: ['$-\dfrac34$', '$-\dfrac43$', '$-\dfrac35$', '$\dfrac34$']
  answer: 0
  explanation: |-
    $\tan\theta = \tfrac{y}{x} = \tfrac{-3}{4}$. $-\tfrac43$ is $\cot\theta$ and $-\tfrac35$ is $\sin\theta$.
- id: trig-q-0903
  lesson: trig-any-angle
  module_quiz: true
  topic: Trig functions of any angle
  stem: 'If $\sin\theta > 0$ and $\tan\theta < 0$, in which quadrant is $\theta$?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant III', 'Quadrant IV']
  answer: 1
  explanation: |-
    Sine is positive in I and II; tangent is negative in II and IV. Both hold only in
    quadrant II.
- id: trig-q-0904
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: '$\cos\theta = -\dfrac{8}{17}$ and $\theta$ is in quadrant III. Find $\tan\theta$.'
  choices: ['$-\dfrac{15}{8}$', '$\dfrac{8}{15}$', '$\dfrac{15}{8}$', '$-\dfrac{15}{17}$']
  answer: 2
  explanation: |-
    Take $x = -8$, $r = 17$, so $y = -\sqrt{289 - 64} = -15$ (negative in QIII). Then
    $\tan\theta = \tfrac{-15}{-8} = \tfrac{15}{8}$, positive as ASTC predicts for quadrant III.
- id: trig-q-0905
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: 'Which of these is undefined?'
  choices: ['$\sin 90^\circ$', '$\cos 180^\circ$', '$\cot 90^\circ$', '$\tan 90^\circ$']
  answer: 3
  explanation: |-
    At $90^\circ$ the point is $(0, 1)$, and $\tan 90^\circ = \tfrac{y}{x} = \tfrac10$ is undefined.
    $\cot 90^\circ = \tfrac{0}{1} = 0$ is fine.
- id: trig-q-0906
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: 'The terminal side of $\theta$ passes through $(-1, -2)$. Find $\sin\theta$.'
  choices: ['$-\dfrac{\sqrt5}{5}$', '$-\dfrac{2\sqrt5}{5}$', '$\dfrac{2\sqrt5}{5}$', '$-2$']
  answer: 1
  explanation: |-
    $r = \sqrt{1 + 4} = \sqrt5$, so $\sin\theta = \tfrac{-2}{\sqrt5} = -\tfrac{2\sqrt5}{5}$.
    $-\tfrac{\sqrt5}{5}$ is $\cos\theta$, and $-2$ is $y$ alone, not divided by $r$.
- id: trig-q-0907
  lesson: trig-any-angle
  module_quiz: true
  topic: Trig functions of any angle
  stem: 'For the point $(-3, -4)$, a student writes $r = -5$ "because the point is in quadrant III". What is the correct statement?'
  choices: ['$r = -5$ is right', '$r = \pm 5$, either works', '$r = 7$', '$r = 5$; $r$ is a distance and is always positive']
  answer: 3
  explanation: |-
    $r = \sqrt{x^2 + y^2} = \sqrt{9 + 16} = 5$ is a distance, so it is positive. All the sign
    information comes from $x$ and $y$.
- id: trig-q-0908
  lesson: trig-any-angle
  module_quiz: true
  topic: Trig functions of any angle
  stem: 'What is $\sec 180^\circ$?'
  choices: ['$0$', '$1$', 'Undefined', '$-1$']
  answer: 3
  explanation: |-
    At $180^\circ$ the point is $(-1, 0)$, so $\cos 180^\circ = -1$ and $\sec 180^\circ = \tfrac{1}{-1} = -1$.
    It is $\csc 180^\circ$ that is undefined.
- id: trig-q-0909
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: 'In which quadrants is cosine negative?'
  choices: ['II and III', 'III and IV', 'I and IV', 'II and IV']
  answer: 0
  explanation: |-
    $\cos\theta = x/r$ has the sign of $x$, which is negative in quadrants II and III.
- id: trig-q-0910
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: '$\csc\theta = -2$ and $\cos\theta > 0$. Find $\cos\theta$.'
  choices: ['$-\dfrac{\sqrt3}{2}$', '$\dfrac12$', '$\dfrac{\sqrt3}{2}$', '$\sqrt3$']
  answer: 2
  explanation: |-
    $\sin\theta = -\tfrac12$, and with $\cos\theta > 0$ the angle is in quadrant IV. Take
    $y = -1$, $r = 2$: $x = \sqrt{4 - 1} = \sqrt3$, so $\cos\theta = \tfrac{\sqrt3}{2}$.
- id: trig-q-0911
  lesson: trig-any-angle
  topic: Trig functions of any angle
  stem: 'Evaluate $\cos 540^\circ$.'
  choices: ['$1$', '$-1$', '$0$', 'Undefined']
  answer: 1
  explanation: |-
    $540^\circ - 360^\circ = 180^\circ$, whose point is $(-1, 0)$. So $\cos 540^\circ = -1$.

- id: trig-q-1001
  lesson: trig-reference
  module_quiz: true
  topic: Reference angles
  stem: 'What is the reference angle of $150^\circ$?'
  choices: ['$60^\circ$', '$-30^\circ$', '$30^\circ$', '$150^\circ$']
  answer: 2
  explanation: |-
    $150^\circ$ is in quadrant II, so $\theta' = 180^\circ - 150^\circ = 30^\circ$. $60^\circ$ is the
    angle to the $y$-axis, which is not used.
- id: trig-q-1002
  lesson: trig-reference
  topic: Reference angles
  stem: 'What is the reference angle of $-130^\circ$?'
  choices: ['$50^\circ$', '$130^\circ$', '$40^\circ$', '$230^\circ$']
  answer: 0
  explanation: |-
    Coterminal angle: $-130^\circ + 360^\circ = 230^\circ$, in quadrant III. Reference angle:
    $230^\circ - 180^\circ = 50^\circ$.
- id: trig-q-1003
  lesson: trig-reference
  topic: Reference angles
  stem: 'What is the reference angle of $\dfrac{5\pi}{3}$?'
  choices: ['$\dfrac{2\pi}{3}$', '$\dfrac{\pi}{6}$', '$\dfrac{\pi}{3}$', '$\dfrac{5\pi}{6}$']
  answer: 2
  explanation: |-
    $\tfrac{5\pi}{3}$ is in quadrant IV, so $\theta' = 2\pi - \tfrac{5\pi}{3} = \tfrac{\pi}{3}$.
- id: trig-q-1004
  lesson: trig-reference
  topic: Reference angles
  stem: 'What is the reference angle of an angle of 4 radians, to three decimals?'
  choices: ['$0.858$', '$2.283$', '$0.712$', '$4.000$']
  answer: 0
  explanation: |-
    $\pi < 4 < \tfrac{3\pi}{2}$, so the angle is in quadrant III and $\theta' = 4 - \pi \approx 0.858$.
    ($2\pi - 4 \approx 2.283$ uses the quadrant IV rule.)
- id: trig-q-1005
  lesson: trig-reference
  module_quiz: true
  topic: Reference angles
  stem: 'Find the exact value of $\cos 210^\circ$.'
  choices: ['$\dfrac{\sqrt3}{2}$', '$-\dfrac12$', '$\dfrac12$', '$-\dfrac{\sqrt3}{2}$']
  answer: 3
  explanation: |-
    Reference angle $30^\circ$, $\cos 30^\circ = \tfrac{\sqrt3}{2}$; cosine is negative in quadrant III.
    So $\cos 210^\circ = -\tfrac{\sqrt3}{2}$. $-\tfrac12$ is $\sin 210^\circ$.
- id: trig-q-1006
  lesson: trig-reference
  topic: Reference angles
  stem: 'Find the exact value of $\tan(-300^\circ)$.'
  choices: ['$-\sqrt3$', '$-\dfrac{\sqrt3}{3}$', '$\dfrac{\sqrt3}{3}$', '$\sqrt3$']
  answer: 3
  explanation: |-
    $-300^\circ + 360^\circ = 60^\circ$, in quadrant I, so $\tan(-300^\circ) = \tan 60^\circ = \sqrt3$.
    The original angle being negative doesn't make the value negative.
- id: trig-q-1007
  lesson: trig-reference
  module_quiz: true
  topic: Reference angles
  stem: 'Find the exact value of $\sec\dfrac{5\pi}{4}$.'
  choices: ['$-\sqrt2$', '$\sqrt2$', '$-\dfrac{\sqrt2}{2}$', '$-1$']
  answer: 0
  explanation: |-
    Reference angle $\tfrac{\pi}{4}$ with $\sec\tfrac{\pi}{4} = \sqrt2$; secant is negative in quadrant III.
    $-\tfrac{\sqrt2}{2}$ is $\cos\tfrac{5\pi}{4}$, not its reciprocal.
- id: trig-q-1008
  lesson: trig-reference
  module_quiz: true
  topic: Reference angles
  stem: 'Find all $\theta$ in $[0^\circ, 360^\circ)$ with $\sin\theta = -\dfrac12$.'
  choices: ['$30^\circ$ and $150^\circ$', '$210^\circ$ and $330^\circ$', '$240^\circ$ and $300^\circ$', '$150^\circ$ and $210^\circ$']
  answer: 1
  explanation: |-
    The reference angle is $30^\circ$, and sine is negative in quadrants III and IV:
    $180^\circ + 30^\circ = 210^\circ$ and $360^\circ - 30^\circ = 330^\circ$.
- id: trig-q-1009
  lesson: trig-reference
  topic: Reference angles
  stem: 'A student says the reference angle of $120^\circ$ is $30^\circ$. What is wrong?'
  choices: ['Nothing; $120^\circ - 90^\circ = 30^\circ$', 'It should be $240^\circ$', 'Reference angles only exist for acute angles', 'The reference angle is measured to the $x$-axis, so it is $180^\circ - 120^\circ = 60^\circ$']
  answer: 3
  explanation: |-
    Reference angles are always measured to the nearest part of the $x$-axis. Measuring to the
    $y$-axis gives the wrong acute angle (and the wrong trig values).
- id: trig-q-1010
  lesson: trig-reference
  topic: Reference angles
  stem: 'Which expression equals $\sin 155^\circ$?'
  choices: ['$-\sin 25^\circ$', '$\sin 25^\circ$', '$\sin 65^\circ$', '$-\cos 25^\circ$']
  answer: 1
  explanation: |-
    Reference angle $25^\circ$; sine is positive in quadrant II, so $\sin 155^\circ = \sin 25^\circ \approx 0.4226$.
    $-\cos 25^\circ$ equals $\cos 155^\circ$.
- id: trig-q-1011
  lesson: trig-reference
  topic: Reference angles
  stem: 'What is the reference angle of $480^\circ$?'
  choices: ['$120^\circ$', '$30^\circ$', '$60^\circ$', '$40^\circ$']
  answer: 2
  explanation: |-
    $480^\circ - 360^\circ = 120^\circ$, in quadrant II, so $\theta' = 180^\circ - 120^\circ = 60^\circ$.
- id: trig-q-1012
  lesson: trig-reference
  topic: Reference angles
  stem: 'Find the exact value of $\cos\dfrac{7\pi}{4}$.'
  choices: ['$\dfrac{\sqrt2}{2}$', '$-\dfrac{\sqrt2}{2}$', '$\dfrac12$', '$-1$']
  answer: 0
  explanation: |-
    Reference angle $\tfrac{\pi}{4}$; cosine is positive in quadrant IV. So $\cos\tfrac{7\pi}{4} = \tfrac{\sqrt2}{2}$.

- id: trig-q-1101
  lesson: trig-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'What is the terminal point on the unit circle for $t = \dfrac{7\pi}{6}$?'
  choices: ['$\left(-\tfrac12, -\tfrac{\sqrt3}{2}\right)$', '$\left(-\tfrac{\sqrt3}{2}, \tfrac12\right)$', '$\left(\tfrac{\sqrt3}{2}, -\tfrac12\right)$', '$\left(-\tfrac{\sqrt3}{2}, -\tfrac12\right)$']
  answer: 3
  explanation: |-
    $\tfrac{7\pi}{6} = \pi + \tfrac{\pi}{6}$: quadrant III, near the $x$-axis, so $|x| = \tfrac{\sqrt3}{2}$,
    $|y| = \tfrac12$, both negative. $\left(-\tfrac12, -\tfrac{\sqrt3}{2}\right)$ is the point for $\tfrac{4\pi}{3}$.
- id: trig-q-1102
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Evaluate $\sin\dfrac{11\pi}{6}$.'
  choices: ['$-\dfrac12$', '$\dfrac12$', '$-\dfrac{\sqrt3}{2}$', '$\dfrac{\sqrt3}{2}$']
  answer: 0
  explanation: |-
    The point is $\left(\tfrac{\sqrt3}{2}, -\tfrac12\right)$ (quadrant IV, near the $x$-axis); sine is
    the $y$-coordinate, $-\tfrac12$.
- id: trig-q-1103
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Evaluate $\cos\left(-\dfrac{2\pi}{3}\right)$.'
  choices: ['$\dfrac12$', '$-\dfrac{\sqrt3}{2}$', '$-\dfrac12$', '$\dfrac{\sqrt3}{2}$']
  answer: 2
  explanation: |-
    $-\tfrac{2\pi}{3}$ is coterminal with $\tfrac{4\pi}{3}$, whose point is $\left(-\tfrac12, -\tfrac{\sqrt3}{2}\right)$.
    Cosine is the $x$-coordinate: $-\tfrac12$. (Cosine is even, so it also equals $\cos\tfrac{2\pi}{3}$.)
- id: trig-q-1104
  lesson: trig-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Evaluate $\tan\dfrac{5\pi}{3}$.'
  choices: ['$\sqrt3$', '$-\dfrac{\sqrt3}{3}$', '$-\sqrt3$', '$\dfrac{\sqrt3}{3}$']
  answer: 2
  explanation: |-
    The point is $\left(\tfrac12, -\tfrac{\sqrt3}{2}\right)$, so $\tan = \tfrac{y}{x} = \tfrac{-\sqrt3/2}{1/2} = -\sqrt3$.
- id: trig-q-1105
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'The point $\left(-\tfrac35, y\right)$ is on the unit circle in quadrant III and is the terminal point of $t$. Find $\tan t$.'
  choices: ['$-\dfrac43$', '$\dfrac34$', '$\dfrac43$', '$-\dfrac45$']
  answer: 2
  explanation: |-
    $y^2 = 1 - \tfrac{9}{25} = \tfrac{16}{25}$ and $y < 0$ in quadrant III, so $y = -\tfrac45$.
    $\tan t = \tfrac{-4/5}{-3/5} = \tfrac43$. ($-\tfrac45$ is $\sin t$.)
- id: trig-q-1106
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Which point is the terminal point of $t = \dfrac{\pi}{3}$?'
  choices: ['$\left(\tfrac12, \tfrac{\sqrt3}{2}\right)$', '$\left(\tfrac{\sqrt3}{2}, \tfrac12\right)$', '$\left(\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\right)$', '$\left(\tfrac{\pi}{3}, 1\right)$']
  answer: 0
  explanation: |-
    At $60^\circ$ the point is close to the $y$-axis: $x = \cos\tfrac{\pi}{3} = \tfrac12$ and
    $y = \sin\tfrac{\pi}{3} = \tfrac{\sqrt3}{2}$. $\left(\tfrac{\sqrt3}{2}, \tfrac12\right)$ is the point for $\tfrac{\pi}{6}$.
- id: trig-q-1107
  lesson: trig-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Why can sine and cosine be treated as functions of a real number $t$, not just of an angle?'
  choices: ['Because calculators accept any number', 'Because the unit circle has area $\pi$', 'Because $\sin t$ is always less than $t$', 'Because on the unit circle an angle of $t$ radians subtends an arc of length exactly $t$']
  answer: 3
  explanation: |-
    With $r = 1$, $s = r\theta$ gives $s = \theta$. So "angle $t$ radians" and "walk distance $t$ along
    the circle" pick the same point, and any real $t$ names a point.
- id: trig-q-1108
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Which point lies on the unit circle?'
  choices: ['$\left(\tfrac12, \tfrac12\right)$', '$(0.6, 0.6)$', '$\left(\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\right)$', '$(1, 1)$']
  answer: 2
  explanation: |-
    Check $x^2 + y^2 = 1$: $\tfrac24 + \tfrac24 = 1$. The others give $\tfrac12$, $0.72$ and $2$.
- id: trig-q-1109
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Evaluate $\sin\dfrac{3\pi}{2}$.'
  choices: ['$0$', '$-1$', '$1$', 'Undefined']
  answer: 1
  explanation: |-
    $\tfrac{3\pi}{2}$ lands at the bottom of the circle, $(0, -1)$. Sine is the $y$-coordinate: $-1$.
- id: trig-q-1110
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'Evaluate $\cos\dfrac{5\pi}{6} + \sin\dfrac{5\pi}{6}$.'
  choices: ['$\dfrac{\sqrt3 + 1}{2}$', '$-\dfrac{1 + \sqrt3}{2}$', '$\dfrac{\sqrt3 - 1}{2}$', '$\dfrac{1 - \sqrt3}{2}$']
  answer: 3
  explanation: |-
    The point for $\tfrac{5\pi}{6}$ is $\left(-\tfrac{\sqrt3}{2}, \tfrac12\right)$, so the sum is
    $-\tfrac{\sqrt3}{2} + \tfrac12 = \tfrac{1 - \sqrt3}{2} \approx -0.366$.
- id: trig-q-1111
  lesson: trig-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'For which values of $t$ in $[0, 2\pi)$ is $\cos t = \sin t$?'
  choices: ['$\tfrac{\pi}{4}$ and $\tfrac{3\pi}{4}$', '$\tfrac{\pi}{4}$ only', '$\tfrac{\pi}{4}$ and $\tfrac{5\pi}{4}$', '$\tfrac{\pi}{4}$ and $\tfrac{7\pi}{4}$']
  answer: 2
  explanation: |-
    The coordinates are equal on the line $y = x$, which meets the unit circle at
    $\left(\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\right)$ ($t = \tfrac{\pi}{4}$) and
    $\left(-\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\right)$ ($t = \tfrac{5\pi}{4}$).
- id: trig-q-1112
  lesson: trig-unit-circle
  topic: Unit circle
  stem: 'The terminal side of $t$ lies along the line $y = 2x$ in quadrant III. What is $\tan t$?'
  choices: ['$-2$', '$\dfrac12$', '$2$', '$-\dfrac12$']
  answer: 2
  explanation: |-
    Tangent is the slope of the terminal side, $\tfrac{y}{x}$, which is 2 at every point of the
    line. (In quadrant III both coordinates are negative, so the ratio is positive.)

- id: trig-q-1201
  lesson: trig-properties
  module_quiz: true
  topic: Properties of trig functions
  stem: 'What is the period of $y = \tan x$?'
  choices: ['$2\pi$', '$\dfrac{\pi}{2}$', '$\pi$', '$4\pi$']
  answer: 2
  explanation: |-
    Adding $\pi$ moves $(x, y)$ to $(-x, -y)$, and $\tfrac{-y}{-x} = \tfrac{y}{x}$. So tangent repeats
    every $\pi$. Sine and cosine have period $2\pi$.
- id: trig-q-1202
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'Evaluate $\sin\dfrac{25\pi}{6}$.'
  choices: ['$-\dfrac12$', '$\dfrac12$', '$\dfrac{\sqrt3}{2}$', '$-\dfrac{\sqrt3}{2}$']
  answer: 1
  explanation: |-
    $\tfrac{25\pi}{6} = 4\pi + \tfrac{\pi}{6}$; removing two periods leaves $\sin\tfrac{\pi}{6} = \tfrac12$.
- id: trig-q-1203
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'If $\cos t = 0.4$, what is $\cos(-t)$?'
  choices: ['$-0.4$', '$0.6$', '$0.4$', 'It cannot be determined']
  answer: 2
  explanation: |-
    Cosine is even: $\cos(-t) = \cos t = 0.4$. The points for $t$ and $-t$ share their
    $x$-coordinate.
- id: trig-q-1204
  lesson: trig-properties
  module_quiz: true
  topic: Properties of trig functions
  stem: 'If $\sin t = 0.7$, what is $\sin(-t)$?'
  choices: ['$-0.7$', '$0.7$', '$0.3$', '$\sqrt{0.51}$']
  answer: 0
  explanation: |-
    Sine is odd: $\sin(-t) = -\sin t = -0.7$. Reflecting across the $x$-axis flips the $y$-coordinate.
- id: trig-q-1205
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'Which trig function is even?'
  choices: ['Sine', 'Tangent', 'Cosecant', 'Secant']
  answer: 3
  explanation: |-
    Secant is $\tfrac{1}{\cos}$ and inherits cosine's evenness: $\sec(-t) = \sec t$. Sine, tangent,
    cosecant and cotangent are odd.
- id: trig-q-1206
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'What is the range of $y = \csc x$?'
  choices: ['$[-1, 1]$', '$[1, \infty)$', 'All real numbers', '$(-\infty, -1] \cup [1, \infty)$']
  answer: 3
  explanation: |-
    $\csc x = \tfrac{1}{\sin x}$ with $0 < |\sin x| \le 1$, so $|\csc x| \ge 1$. Both signs occur.
- id: trig-q-1207
  lesson: trig-properties
  module_quiz: true
  topic: Properties of trig functions
  stem: 'Which values are excluded from the domain of $y = \tan x$?'
  choices: ['$x = k\pi$', '$x = 2k\pi$', '$x = \tfrac{\pi}{2} + k\pi$', '$x = \tfrac{\pi}{4} + k\pi$']
  answer: 2
  explanation: |-
    $\tan x = \tfrac{\sin x}{\cos x}$ is undefined where $\cos x = 0$: at $\tfrac{\pi}{2} + k\pi$.
    $x = k\pi$ is excluded for cotangent and cosecant.
- id: trig-q-1208
  lesson: trig-properties
  module_quiz: true
  topic: Properties of trig functions
  stem: 'Is $f(x) = x\sin x$ even, odd, or neither?'
  choices: ['Even', 'Odd', 'Neither', 'Both']
  answer: 0
  explanation: |-
    $f(-x) = (-x)\sin(-x) = (-x)(-\sin x) = x\sin x = f(x)$, so $f$ is even. (A product of two odd
    functions is even.)
- id: trig-q-1209
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'Evaluate $\tan\dfrac{13\pi}{4}$.'
  choices: ['$-1$', '$1$', '$\sqrt3$', 'Undefined']
  answer: 1
  explanation: |-
    Tangent has period $\pi$, and $\tfrac{13\pi}{4} = 3\pi + \tfrac{\pi}{4}$, so the value is
    $\tan\tfrac{\pi}{4} = 1$. (Directly: $\tfrac{13\pi}{4}$ is coterminal with $\tfrac{5\pi}{4}$ in quadrant III,
    where tangent is positive.)
- id: trig-q-1210
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'Simplify $\sin(-t)\csc t + \cos(-t)\sec t$ (where defined).'
  choices: ['$2$', '$-2$', '$1$', '$0$']
  answer: 3
  explanation: |-
    $\sin(-t)\csc t = -\sin t\cdot\tfrac{1}{\sin t} = -1$ and $\cos(-t)\sec t = 1$. The sum is 0.
- id: trig-q-1211
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'If $\sin t = 0.6$, what is $\sin(t + \pi)$?'
  choices: ['$0.6$', '$-0.8$', '$0.8$', '$-0.6$']
  answer: 3
  explanation: |-
    Adding $\pi$ moves to the diametrically opposite point $(-x, -y)$, so $\sin(t + \pi) = -\sin t = -0.6$.
    (Sine's period is $2\pi$, not $\pi$.)
- id: trig-q-1212
  lesson: trig-properties
  topic: Properties of trig functions
  stem: 'Evaluate $\cos(-7\pi)$.'
  choices: ['$1$', '$0$', '$-1$', 'Undefined']
  answer: 2
  explanation: |-
    $-7\pi = -8\pi + \pi$, and removing four periods leaves $\cos\pi = -1$.
