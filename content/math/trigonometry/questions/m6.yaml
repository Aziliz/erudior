# Module 6: Identities and equations
- id: trig-q-2101
  lesson: trig-fundamental-ids
  module_quiz: true
  topic: Fundamental identities
  stem: 'Which equation is a Pythagorean identity?'
  choices: ['$1 + \sin^2 x = \cos^2 x$', '$1 + \tan^2 x = \sec^2 x$', '$1 + \tan^2 x = \csc^2 x$', '$\sin x + \cos x = 1$']
  answer: 1
  explanation: |-
    Dividing $\sin^2 x + \cos^2 x = 1$ by $\cos^2 x$ gives $\tan^2 x + 1 = \sec^2 x$. Tangent pairs with
    secant (both have cosine underneath); cotangent pairs with cosecant.
- id: trig-q-2102
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: '$\sin\theta = -\tfrac23$ and $\theta$ is in quadrant III. Find $\cos\theta$.'
  choices: ['$\tfrac{\sqrt5}{3}$', '$-\tfrac13$', '$-\tfrac{\sqrt5}{3}$', '$-\tfrac{\sqrt{13}}{3}$']
  answer: 2
  explanation: |-
    $\cos^2\theta = 1 - \tfrac49 = \tfrac59$, so $\cos\theta = \pm\tfrac{\sqrt5}{3}$; cosine is negative in quadrant III.
- id: trig-q-2103
  lesson: trig-fundamental-ids
  module_quiz: true
  topic: Fundamental identities
  stem: '$\tan\theta = 3$ and $\sin\theta < 0$. Find $\sec\theta$.'
  choices: ['$\sqrt{10}$', '$-\sqrt{10}$', '$-\sqrt8$', '$\tfrac{\sqrt{10}}{10}$']
  answer: 1
  explanation: |-
    $\sec^2\theta = 1 + \tan^2\theta = 10$. Tangent positive and sine negative means quadrant III, where
    secant is negative: $-\sqrt{10}$.
- id: trig-q-2104
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Simplify $\sec x - \sec x\sin^2 x$.'
  choices: ['$\cos x$', '$\sec x$', '$\sin x$', '$1$']
  answer: 0
  explanation: |-
    Factor: $\sec x(1 - \sin^2 x) = \sec x\cos^2 x = \tfrac{\cos^2 x}{\cos x} = \cos x$.
- id: trig-q-2105
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Simplify $\dfrac{1 + \tan^2 x}{\csc^2 x}$.'
  choices: ['$\cot^2 x$', '$1$', '$\sin^2 x$', '$\tan^2 x$']
  answer: 3
  explanation: |-
    $\tfrac{\sec^2 x}{\csc^2 x} = \tfrac{1/\cos^2 x}{1/\sin^2 x} = \tfrac{\sin^2 x}{\cos^2 x} = \tan^2 x$.
- id: trig-q-2106
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Which expression equals $\tan x + \cot x$?'
  choices: ['$1$', '$\sec x\csc x$', '$\sin x\cos x$', '$2$']
  answer: 1
  explanation: |-
    $\tfrac{\sin x}{\cos x} + \tfrac{\cos x}{\sin x} = \tfrac{\sin^2 x + \cos^2 x}{\sin x\cos x} = \tfrac{1}{\sin x\cos x} = \sec x\csc x$.
- id: trig-q-2107
  lesson: trig-fundamental-ids
  module_quiz: true
  topic: Fundamental identities
  stem: 'Simplify $\sin^4 x - \cos^4 x$.'
  choices: ['$1$', '$\sin^2 x - \cos^2 x$', '$(\sin x - \cos x)^4$', '$\sin^2 x + \cos^2 x$']
  answer: 1
  explanation: |-
    Difference of squares: $(\sin^2 x - \cos^2 x)(\sin^2 x + \cos^2 x) = (\sin^2 x - \cos^2 x)(1)$.
- id: trig-q-2108
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Simplify $\cos x\tan x$.'
  choices: ['$\sin x$', '$1$', '$\cot x$', '$\sec x$']
  answer: 0
  explanation: |-
    $\cos x \cdot \tfrac{\sin x}{\cos x} = \sin x$ (where $\cos x \ne 0$).
- id: trig-q-2109
  lesson: trig-fundamental-ids
  module_quiz: true
  topic: Fundamental identities
  stem: '$\cos\theta = 0.6$ and $\theta$ is in quadrant IV. Find $\tan\theta$.'
  choices: ['$\tfrac43$', '$-\tfrac34$', '$-0.8$', '$-\tfrac43$']
  answer: 3
  explanation: |-
    $\sin\theta = -\sqrt{1 - 0.36} = -0.8$ (negative in QIV), so $\tan\theta = \tfrac{-0.8}{0.6} = -\tfrac43$.
- id: trig-q-2110
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Which equation is NOT an identity?'
  choices: ['$\sec^2 x - \tan^2 x = 1$', '$\cos(-x) = \cos x$', '$\sin x + \cos x = 1$', '$\csc^2 x - \cot^2 x = 1$']
  answer: 2
  explanation: |-
    At $x = \tfrac{\pi}{4}$, $\sin x + \cos x = \sqrt2 \ne 1$. One counterexample is enough. The others are
    rearranged Pythagorean identities and the evenness of cosine.
- id: trig-q-2111
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Simplify $\csc x - \cot x\cos x$.'
  choices: ['$\cos x$', '$\sin x$', '$\csc x$', '$1$']
  answer: 1
  explanation: |-
    $\tfrac{1}{\sin x} - \tfrac{\cos^2 x}{\sin x} = \tfrac{1 - \cos^2 x}{\sin x} = \tfrac{\sin^2 x}{\sin x} = \sin x$.

- id: trig-q-2201
  lesson: trig-verifying
  module_quiz: true
  topic: Verifying identities
  stem: 'When verifying an identity, which approach is valid?'
  choices: ['Square both sides and simplify', 'Cross-multiply and show the result is true', 'Transform one side step by step until it matches the other side', 'Substitute $x = 0$ and check that both sides agree']
  answer: 2
  explanation: |-
    Operating on both sides assumes the identity is already true. Checking one value can't prove an
    identity. Transform one side (or each side separately to a common form).
- id: trig-q-2202
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'To simplify $\dfrac{\cos x}{1 - \sin x}$, you multiply the top and bottom by the conjugate $1 + \sin x$. What does the denominator become?'
  choices: ['$1 - \sin^2 x = \cos^2 x$', '$1 + \sin^2 x$', '$(1 - \sin x)^2$', '$\sin^2 x$']
  answer: 0
  explanation: |-
    $(1 - \sin x)(1 + \sin x) = 1 - \sin^2 x = \cos^2 x$, and then a $\cos x$ cancels with the numerator,
    leaving $\tfrac{1 + \sin x}{\cos x}$.
- id: trig-q-2203
  lesson: trig-verifying
  topic: Verifying identities
  stem: |-
    A verification of $\sec x - \cos x = \sin x\tan x$ reads

    $\sec x - \cos x = \dfrac{1}{\cos x} - \cos x = \dfrac{1 - \cos^2 x}{\cos x} = \dfrac{\sin^2 x}{\cos x} = \sin x\tan x.$

    Which identity justifies the third equals sign?
  choices: ['Reciprocal identity', 'Pythagorean identity $\sin^2 x + \cos^2 x = 1$', 'Quotient identity', 'Even–odd identity']
  answer: 1
  explanation: |-
    $1 - \cos^2 x = \sin^2 x$ is the Pythagorean identity rearranged. The reciprocal identity was used in
    the first step and the quotient identity in the last.
- id: trig-q-2204
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'What does $(1 + \cot^2 x)(1 - \cos^2 x)$ simplify to?'
  choices: ['$\cot^2 x$', '$\csc^2 x$', '$\sin^2 x$', '$1$']
  answer: 3
  explanation: |-
    $(1 + \cot^2 x)(1 - \cos^2 x) = \csc^2 x\sin^2 x = 1$.
- id: trig-q-2205
  lesson: trig-verifying
  module_quiz: true
  topic: Verifying identities
  stem: 'What does $\dfrac{\sin x}{1 + \cos x} + \dfrac{1 + \cos x}{\sin x}$ simplify to?'
  choices: ['$2\sec x$', '$2\csc x$', '$1$', '$2$']
  answer: 1
  explanation: |-
    Common denominator: $\tfrac{\sin^2 x + 1 + 2\cos x + \cos^2 x}{\sin x(1 + \cos x)} = \tfrac{2(1 + \cos x)}{\sin x(1 + \cos x)} = \tfrac{2}{\sin x}$.
- id: trig-q-2206
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'What does $\dfrac{\tan^2 x}{\sec x + 1}$ simplify to?'
  choices: ['$\sec x - 1$', '$\sec x + 1$', '$\tan x$', '$1 - \cos x$']
  answer: 0
  explanation: |-
    $\tan^2 x = \sec^2 x - 1 = (\sec x - 1)(\sec x + 1)$, and the factor $\sec x + 1$ cancels.
- id: trig-q-2207
  lesson: trig-verifying
  module_quiz: true
  topic: Verifying identities
  stem: 'How can you show that $\cos 2x = 2\cos x$ is NOT an identity?'
  choices: ['Graph both sides once', 'Find one value where the sides differ, e.g. $x = 0$: $\cos 0 = 1$ but $2\cos 0 = 2$', 'Check that it holds at $x = \tfrac{\pi}{2}$', 'Square both sides']
  answer: 1
  explanation: |-
    A single counterexample disproves an identity. Checking one value where the sides happen to agree
    proves nothing, and squaring both sides is not a valid way to test an identity.
- id: trig-q-2208
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'A student "verifies" $\sin x = -\sqrt{1 - \cos^2 x}$ by squaring both sides to get $\sin^2 x = 1 - \cos^2 x$, which is true. What is wrong?'
  choices: ['Nothing; it is an identity', 'Squaring both sides treats the statement as already true and hides sign errors; at $x = \tfrac{\pi}{2}$ the original fails', 'The Pythagorean identity is used incorrectly', 'The student should have taken the square root of both sides instead']
  answer: 1
  explanation: |-
    At $x = \tfrac{\pi}{2}$: left side $1$, right side $-1$. Squaring made a false statement look true, which is why
    identities must be verified by transforming one side.
- id: trig-q-2209
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'Which expression is equal to $\dfrac{\sin x}{1 - \cos x}$?'
  choices: ['$\dfrac{1 - \cos x}{\sin x}$', '$\dfrac{1 + \cos x}{\sin x}$', '$\dfrac{\sin x}{1 + \cos x}$', '$\tan x$']
  answer: 1
  explanation: |-
    Multiply by $\tfrac{1 + \cos x}{1 + \cos x}$: $\tfrac{\sin x(1 + \cos x)}{1 - \cos^2 x} = \tfrac{\sin x(1 + \cos x)}{\sin^2 x} = \tfrac{1 + \cos x}{\sin x}$.
- id: trig-q-2210
  lesson: trig-verifying
  module_quiz: true
  topic: Verifying identities
  stem: 'What does $\dfrac{\cos x}{1 + \sin x} + \tan x$ simplify to?'
  choices: ['$\csc x$', '$\cos x$', '$\sec x$', '$1$']
  answer: 2
  explanation: |-
    Common denominator $\cos x(1 + \sin x)$: $\tfrac{\cos^2 x + \sin x + \sin^2 x}{\cos x(1 + \sin x)} = \tfrac{1 + \sin x}{\cos x(1 + \sin x)} = \sec x$.
- id: trig-q-2211
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'What does $(\sec x + \tan x)(\sec x - \tan x)$ equal?'
  choices: ['$\sec^2 x + \tan^2 x$', '$0$', '$1$', '$2\sec x$']
  answer: 2
  explanation: |-
    Difference of squares: $\sec^2 x - \tan^2 x = 1$ (from $1 + \tan^2 x = \sec^2 x$).

- id: trig-q-2301
  lesson: trig-sum-difference
  module_quiz: true
  topic: Sum and difference formulas
  stem: 'Find the exact value of $\cos 15^\circ$.'
  choices: ['$\dfrac{\sqrt6 - \sqrt2}{4}$', '$\dfrac{\sqrt6 + \sqrt2}{4}$', '$\dfrac{\sqrt3 + 1}{2}$', '$\dfrac{\sqrt2}{2} - \dfrac{\sqrt3}{2}$']
  answer: 1
  explanation: |-
    $\cos(45^\circ - 30^\circ) = \cos 45^\circ\cos 30^\circ + \sin 45^\circ\sin 30^\circ = \tfrac{\sqrt6}{4} + \tfrac{\sqrt2}{4}$.
    $\tfrac{\sqrt6 - \sqrt2}{4}$ is $\cos 75^\circ$ (wrong sign in the formula).
- id: trig-q-2302
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Find the exact value of $\tan\tfrac{\pi}{12}$.'
  choices: ['$2 + \sqrt3$', '$\sqrt3 - 1$', '$2 - \sqrt3$', '$\tfrac{\sqrt3}{3}$']
  answer: 2
  explanation: |-
    $\tan\left(\tfrac{\pi}{3} - \tfrac{\pi}{4}\right) = \tfrac{\sqrt3 - 1}{1 + \sqrt3}$; rationalizing gives $\tfrac{4 - 2\sqrt3}{2} = 2 - \sqrt3 \approx 0.268$.
    $2 + \sqrt3$ is $\tan\tfrac{5\pi}{12}$.
- id: trig-q-2303
  lesson: trig-sum-difference
  module_quiz: true
  topic: Sum and difference formulas
  stem: '$\sin\alpha = \tfrac35$ ($\alpha$ in QII) and $\cos\beta = -\tfrac{5}{13}$ ($\beta$ in QIII). Find $\sin(\alpha + \beta)$.'
  choices: ['$\tfrac{33}{65}$', '$-\tfrac{63}{65}$', '$-\tfrac{33}{65}$', '$\tfrac{63}{65}$']
  answer: 0
  explanation: |-
    $\cos\alpha = -\tfrac45$, $\sin\beta = -\tfrac{12}{13}$. Then $\sin\alpha\cos\beta + \cos\alpha\sin\beta = -\tfrac{15}{65} + \tfrac{48}{65} = \tfrac{33}{65}$.
- id: trig-q-2304
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'With the same $\alpha$ and $\beta$ ($\sin\alpha = \tfrac35$ in QII, $\cos\beta = -\tfrac{5}{13}$ in QIII), find $\cos(\alpha - \beta)$.'
  choices: ['$\tfrac{56}{65}$', '$-\tfrac{16}{65}$', '$\tfrac{16}{65}$', '$-\tfrac{56}{65}$']
  answer: 1
  explanation: |-
    $\cos\alpha\cos\beta + \sin\alpha\sin\beta = \left(-\tfrac45\right)\left(-\tfrac{5}{13}\right) + \tfrac35\left(-\tfrac{12}{13}\right) = \tfrac{20}{65} - \tfrac{36}{65} = -\tfrac{16}{65}$.
- id: trig-q-2305
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Evaluate $\sin 80^\circ\cos 20^\circ - \cos 80^\circ\sin 20^\circ$.'
  choices: ['$\tfrac12$', '$\sin 100^\circ$', '$1$', '$\tfrac{\sqrt3}{2}$']
  answer: 3
  explanation: |-
    It's $\sin(80^\circ - 20^\circ) = \sin 60^\circ = \tfrac{\sqrt3}{2}$. ($\sin 100^\circ$ would be the sum, which has a plus sign.)
- id: trig-q-2306
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Use a difference formula to simplify $\cos(\pi - x)$.'
  choices: ['$\cos x$', '$-\cos x$', '$\sin x$', '$-\sin x$']
  answer: 1
  explanation: |-
    $\cos\pi\cos x + \sin\pi\sin x = (-1)\cos x + 0 = -\cos x$.
- id: trig-q-2307
  lesson: trig-sum-difference
  module_quiz: true
  topic: Sum and difference formulas
  stem: 'Which statement is true for all angles $\alpha$, $\beta$?'
  choices: ['$\sin(\alpha + \beta) = \sin\alpha + \sin\beta$', '$\cos(\alpha + \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta$', '$\cos(\alpha - \beta) = \cos\alpha\cos\beta + \sin\alpha\sin\beta$', '$\sin(\alpha - \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$']
  answer: 2
  explanation: |-
    That's the cosine difference formula. Cosine flips the sign, so $\cos(\alpha + \beta)$ has a minus; the sine
    difference formula has a minus; and sine doesn't distribute over addition.
- id: trig-q-2308
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: '$\sin x + \sqrt3\cos x$ can be written as $R\sin(x + \varphi)$. What are $R$ and $\varphi$?'
  choices: ['$R = 1 + \sqrt3$, $\varphi = \tfrac{\pi}{3}$', '$R = 2$, $\varphi = \tfrac{\pi}{6}$', '$R = 2$, $\varphi = \tfrac{\pi}{3}$', '$R = 4$, $\varphi = \tfrac{\pi}{3}$']
  answer: 2
  explanation: |-
    $R = \sqrt{1^2 + (\sqrt3)^2} = 2$, $\cos\varphi = \tfrac12$, $\sin\varphi = \tfrac{\sqrt3}{2}$, so $\varphi = \tfrac{\pi}{3}$.
- id: trig-q-2309
  lesson: trig-sum-difference
  module_quiz: true
  topic: Sum and difference formulas
  stem: 'If $\tan\alpha = 2$ and $\tan\beta = 3$, what is $\tan(\alpha + \beta)$?'
  choices: ['$5$', '$-1$', '$1$', '$-\tfrac17$']
  answer: 1
  explanation: |-
    $\tfrac{2 + 3}{1 - 2\cdot 3} = \tfrac{5}{-5} = -1$. Adding the tangents gives 5, which ignores the denominator.
- id: trig-q-2310
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Find the exact value of $\cos 75^\circ$.'
  choices: ['$\dfrac{\sqrt6 - \sqrt2}{4}$', '$\dfrac{\sqrt6 + \sqrt2}{4}$', '$\dfrac{\sqrt2 - \sqrt6}{4}$', '$\dfrac{\sqrt3 - 1}{2}$']
  answer: 0
  explanation: |-
    $\cos(45^\circ + 30^\circ) = \tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2} - \tfrac{\sqrt2}{2}\cdot\tfrac12 = \tfrac{\sqrt6 - \sqrt2}{4} \approx 0.2588$.
- id: trig-q-2311
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Simplify $\cos\left(x + \tfrac{\pi}{2}\right)$.'
  choices: ['$\sin x$', '$\cos x$', '$-\cos x$', '$-\sin x$']
  answer: 3
  explanation: |-
    $\cos x\cos\tfrac{\pi}{2} - \sin x\sin\tfrac{\pi}{2} = 0 - \sin x = -\sin x$.

- id: trig-q-2401
  lesson: trig-double-angle
  module_quiz: true
  topic: Double-angle formulas
  stem: '$\sin\theta = \tfrac{5}{13}$ with $\theta$ in quadrant II. Find $\sin 2\theta$.'
  choices: ['$\tfrac{120}{169}$', '$\tfrac{10}{13}$', '$-\tfrac{120}{169}$', '$-\tfrac{60}{169}$']
  answer: 2
  explanation: |-
    $\cos\theta = -\tfrac{12}{13}$, so $\sin 2\theta = 2\cdot\tfrac{5}{13}\cdot\left(-\tfrac{12}{13}\right) = -\tfrac{120}{169}$. $\tfrac{10}{13} = 2\sin\theta$ is the
    classic error.
- id: trig-q-2402
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'With $\sin\theta = \tfrac{5}{13}$ ($\theta$ in QII), find $\cos 2\theta$.'
  choices: ['$\tfrac{119}{169}$', '$-\tfrac{119}{169}$', '$\tfrac{144}{169}$', '$-\tfrac{24}{13}$']
  answer: 0
  explanation: |-
    $\cos 2\theta = 1 - 2\sin^2\theta = 1 - \tfrac{50}{169} = \tfrac{119}{169}$. (Any form of the formula gives the same answer.)
- id: trig-q-2403
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'Which expression is NOT equal to $\cos 2x$?'
  choices: ['$\cos^2 x - \sin^2 x$', '$2\cos^2 x - 1$', '$1 - 2\sin^2 x$', '$1 - 2\cos^2 x$']
  answer: 3
  explanation: |-
    $1 - 2\cos^2 x = -\cos 2x$. The three correct forms come from $\cos^2 x - \sin^2 x$ with one Pythagorean
    substitution.
- id: trig-q-2404
  lesson: trig-double-angle
  module_quiz: true
  topic: Double-angle formulas
  stem: 'Which is the power-reducing formula for $\sin^2 x$?'
  choices: ['$\sin^2 x = \dfrac{1 + \cos 2x}{2}$', '$\sin^2 x = \dfrac{1 - \cos 2x}{2}$', '$\sin^2 x = \dfrac{1 - \sin 2x}{2}$', '$\sin^2 x = 1 - \cos 2x$']
  answer: 1
  explanation: |-
    Solve $\cos 2x = 1 - 2\sin^2 x$ for $\sin^2 x$. Check at $x = 0$: $\sin^2 0 = 0 = \tfrac{1 - 1}{2}$. The plus
    version is the formula for $\cos^2 x$.
- id: trig-q-2405
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'What does $(\sin x + \cos x)^2$ equal?'
  choices: ['$1$', '$1 + \sin 2x$', '$1 + \cos 2x$', '$\sin 2x$']
  answer: 1
  explanation: |-
    $\sin^2 x + 2\sin x\cos x + \cos^2 x = 1 + 2\sin x\cos x = 1 + \sin 2x$.
- id: trig-q-2406
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'Which expression equals $\cos 3x$?'
  choices: ['$3\cos x$', '$4\cos^3 x - 3\cos x$', '$3\cos x - 4\cos^3 x$', '$\cos^3 x - 3\cos x$']
  answer: 1
  explanation: |-
    $\cos(2x + x) = (2\cos^2 x - 1)\cos x - 2\sin^2 x\cos x = 2\cos^3 x - \cos x - 2\cos x + 2\cos^3 x = 4\cos^3 x - 3\cos x$.
- id: trig-q-2407
  lesson: trig-double-angle
  module_quiz: true
  topic: Double-angle formulas
  stem: 'The range of a projectile on level ground is $R = \dfrac{v^2\sin 2\theta}{g}$. At what launch angle is the range greatest?'
  choices: ['$30^\circ$', '$90^\circ$', '$45^\circ$', '$60^\circ$']
  answer: 2
  explanation: |-
    $\sin 2\theta$ is maximal (1) when $2\theta = 90^\circ$, so $\theta = 45^\circ$.
- id: trig-q-2408
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: '$\tan\theta = \tfrac34$ with $\theta$ in quadrant I. Find $\tan 2\theta$.'
  choices: ['$\tfrac32$', '$\tfrac{24}{7}$', '$\tfrac{24}{25}$', '$\tfrac{7}{24}$']
  answer: 1
  explanation: |-
    $\tfrac{2(3/4)}{1 - 9/16} = \tfrac{3/2}{7/16} = \tfrac{24}{7}$. $\tfrac32$ is $2\tan\theta$; $\tfrac{24}{25}$ is $\sin 2\theta$.
- id: trig-q-2409
  lesson: trig-double-angle
  module_quiz: true
  topic: Double-angle formulas
  stem: 'Evaluate $2\sin 15^\circ\cos 15^\circ$.'
  choices: ['$\tfrac12$', '$\tfrac{\sqrt3}{2}$', '$\sin 15^\circ$', '$1$']
  answer: 0
  explanation: |-
    It's $\sin(2\cdot 15^\circ) = \sin 30^\circ = \tfrac12$.
- id: trig-q-2410
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'Evaluate $\cos^2 22.5^\circ - \sin^2 22.5^\circ$.'
  choices: ['$1$', '$\tfrac12$', '$\tfrac{\sqrt3}{2}$', '$\tfrac{\sqrt2}{2}$']
  answer: 3
  explanation: |-
    It's $\cos(2\cdot 22.5^\circ) = \cos 45^\circ = \tfrac{\sqrt2}{2}$.
- id: trig-q-2411
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: '$\cos\theta = -\tfrac13$. Find $\cos 2\theta$.'
  choices: ['$-\tfrac23$', '$-\tfrac79$', '$\tfrac79$', '$\tfrac19$']
  answer: 1
  explanation: |-
    $2\cos^2\theta - 1 = 2\cdot\tfrac19 - 1 = -\tfrac79$. No quadrant information is needed with this form.
- id: trig-q-2412
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'A student writes $\sin 2x = 2\sin x$. Which value of $x$ shows this is wrong?'
  choices: ['$x = 0$', '$x = \pi$', '$x = \tfrac{\pi}{2}$', 'No value; it is correct']
  answer: 2
  explanation: |-
    At $\tfrac{\pi}{2}$: $\sin\pi = 0$ but $2\sin\tfrac{\pi}{2} = 2$. At $0$ and $\pi$ both sides happen to be 0, so those
    values don't expose the error.

- id: trig-q-2501
  lesson: trig-half-angle
  module_quiz: true
  topic: Half-angle formulas
  stem: 'Find the exact value of $\sin 22.5^\circ$.'
  choices: ['$\dfrac{\sqrt{2 + \sqrt2}}{2}$', '$\dfrac{\sqrt{2 - \sqrt2}}{2}$', '$-\dfrac{\sqrt{2 - \sqrt2}}{2}$', '$\dfrac{\sqrt2}{4}$']
  answer: 1
  explanation: |-
    $\sqrt{\tfrac{1 - \cos 45^\circ}{2}} = \sqrt{\tfrac{2 - \sqrt2}{4}} = \tfrac{\sqrt{2 - \sqrt2}}{2} \approx 0.3827$. The $2 + \sqrt2$ version is $\cos 22.5^\circ$.
- id: trig-q-2502
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: 'Find the exact value of $\cos 105^\circ$.'
  choices: ['$\dfrac{\sqrt{2 - \sqrt3}}{2}$', '$-\dfrac{\sqrt{2 + \sqrt3}}{2}$', '$-\dfrac{\sqrt{2 - \sqrt3}}{2}$', '$\dfrac{\sqrt{2 + \sqrt3}}{2}$']
  answer: 2
  explanation: |-
    $105^\circ = \tfrac{210^\circ}{2}$ is in quadrant II (cosine negative):
    $-\sqrt{\tfrac{1 + \cos 210^\circ}{2}} = -\sqrt{\tfrac{1 - \sqrt3/2}{2}} = -\tfrac{\sqrt{2 - \sqrt3}}{2} \approx -0.2588$.
- id: trig-q-2503
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: 'Find the exact value of $\tan\tfrac{\pi}{8}$.'
  choices: ['$\sqrt2 + 1$', '$\sqrt2 - 1$', '$\tfrac{\sqrt2}{2}$', '$1 - \tfrac{\sqrt2}{2}$']
  answer: 1
  explanation: |-
    $\tfrac{1 - \cos(\pi/4)}{\sin(\pi/4)} = \tfrac{1 - \sqrt2/2}{\sqrt2/2} = \tfrac{2 - \sqrt2}{\sqrt2} = \sqrt2 - 1 \approx 0.414$.
- id: trig-q-2504
  lesson: trig-half-angle
  module_quiz: true
  topic: Half-angle formulas
  stem: 'In $\sin\tfrac{\theta}{2} = \pm\sqrt{\tfrac{1 - \cos\theta}{2}}$, what determines the sign?'
  choices: ['The quadrant of $\theta$', 'The sign of $\cos\theta$', 'The quadrant of $\tfrac{\theta}{2}$', 'Both signs are always valid']
  answer: 2
  explanation: |-
    Exactly one sign is correct: the sign of sine in the quadrant where $\tfrac{\theta}{2}$ lies.
- id: trig-q-2505
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: '$\cos\theta = -\tfrac{7}{25}$ and $180^\circ < \theta < 270^\circ$. Find $\sin\tfrac{\theta}{2}$.'
  choices: ['$\tfrac45$', '$-\tfrac45$', '$\tfrac35$', '$-\tfrac35$']
  answer: 0
  explanation: |-
    $90^\circ < \tfrac{\theta}{2} < 135^\circ$, quadrant II, so sine is positive: $\sqrt{\tfrac{1 + 7/25}{2}} = \sqrt{\tfrac{16}{25}} = \tfrac45$.
- id: trig-q-2506
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: 'With the same $\theta$ ($\cos\theta = -\tfrac{7}{25}$, $180^\circ < \theta < 270^\circ$), find $\cos\tfrac{\theta}{2}$.'
  choices: ['$\tfrac35$', '$-\tfrac45$', '$-\tfrac35$', '$\tfrac{3}{25}$']
  answer: 2
  explanation: |-
    $\tfrac{\theta}{2}$ is in quadrant II, where cosine is negative: $-\sqrt{\tfrac{1 - 7/25}{2}} = -\sqrt{\tfrac{9}{25}} = -\tfrac35$.
- id: trig-q-2507
  lesson: trig-half-angle
  module_quiz: true
  topic: Half-angle formulas
  stem: 'Which half-angle formula needs no $\pm$ sign?'
  choices: ['$\sin\tfrac{\theta}{2} = \sqrt{\tfrac{1 - \cos\theta}{2}}$', '$\tan\tfrac{\theta}{2} = \dfrac{1 - \cos\theta}{\sin\theta}$', '$\cos\tfrac{\theta}{2} = \sqrt{\tfrac{1 + \cos\theta}{2}}$', '$\tan\tfrac{\theta}{2} = \sqrt{\tfrac{1 - \cos\theta}{1 + \cos\theta}}$']
  answer: 1
  explanation: |-
    $\tfrac{1 - \cos\theta}{\sin\theta}$ always has the correct sign, since $1 - \cos\theta \ge 0$ and $\sin\theta$ has the same sign as
    $\tan\tfrac{\theta}{2}$. The square-root forms all need a sign choice.
- id: trig-q-2508
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: '$\cos\theta = \tfrac19$ and $270^\circ < \theta < 360^\circ$. Find $\cos\tfrac{\theta}{2}$.'
  choices: ['$\tfrac{\sqrt5}{3}$', '$-\tfrac{\sqrt5}{3}$', '$-\tfrac23$', '$\tfrac23$']
  answer: 1
  explanation: |-
    $135^\circ < \tfrac{\theta}{2} < 180^\circ$: quadrant II, cosine negative. $-\sqrt{\tfrac{1 + 1/9}{2}} = -\sqrt{\tfrac59} = -\tfrac{\sqrt5}{3}$.
    Using $\theta$'s quadrant (IV, cosine positive) gives the wrong sign.
- id: trig-q-2509
  lesson: trig-half-angle
  module_quiz: true
  topic: Half-angle formulas
  stem: 'Find the exact value of $\cos 67.5^\circ$.'
  choices: ['$\dfrac{\sqrt{2 + \sqrt2}}{2}$', '$\dfrac{\sqrt{2 - \sqrt3}}{2}$', '$\dfrac{\sqrt{2 - \sqrt2}}{2}$', '$-\dfrac{\sqrt{2 - \sqrt2}}{2}$']
  answer: 2
  explanation: |-
    $\sqrt{\tfrac{1 + \cos 135^\circ}{2}} = \sqrt{\tfrac{1 - \sqrt2/2}{2}} = \tfrac{\sqrt{2 - \sqrt2}}{2} \approx 0.3827$, positive in quadrant I.
    (It equals $\sin 22.5^\circ$, as the cofunction identity predicts.)
- id: trig-q-2510
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: 'For which angle is a half-angle formula needed, because it is not a sum or difference of $30^\circ$, $45^\circ$, $60^\circ$ and their multiples?'
  choices: ['$15^\circ$', '$75^\circ$', '$105^\circ$', '$22.5^\circ$']
  answer: 3
  explanation: |-
    $15^\circ = 45^\circ - 30^\circ$, $75^\circ = 45^\circ + 30^\circ$, $105^\circ = 60^\circ + 45^\circ$. But $22.5^\circ$ is only reachable as $\tfrac{45^\circ}{2}$.
- id: trig-q-2511
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: '$\theta$ is acute and $\cos\theta = 0.28$. Find $\sin\tfrac{\theta}{2}$.'
  choices: ['$0.6$', '$0.8$', '$0.36$', '$0.14$']
  answer: 0
  explanation: |-
    $\sqrt{\tfrac{1 - 0.28}{2}} = \sqrt{0.36} = 0.6$ (positive, since $\tfrac{\theta}{2}$ is in quadrant I). $0.8$ is $\cos\tfrac{\theta}{2}$.

- id: trig-q-2601
  lesson: trig-product-sum
  module_quiz: true
  topic: Product-to-sum formulas
  stem: 'Write $\sin 5x\cos 3x$ as a sum.'
  choices: ['$\tfrac12[\sin 8x + \sin 2x]$', '$\tfrac12[\cos 2x + \cos 8x]$', '$\sin 8x + \sin 2x$', '$\tfrac12[\sin 8x - \sin 2x]$']
  answer: 0
  explanation: |-
    $\sin\alpha\cos\beta = \tfrac12[\sin(\alpha + \beta) + \sin(\alpha - \beta)]$ with $\alpha = 5x$, $\beta = 3x$. Forgetting the $\tfrac12$
    gives $\sin 8x + \sin 2x$.
- id: trig-q-2602
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Find the exact value of $\cos 75^\circ\cos 15^\circ$.'
  choices: ['$\tfrac12$', '$\tfrac{\sqrt3}{4}$', '$\tfrac14$', '$0$']
  answer: 2
  explanation: |-
    $\tfrac12[\cos 60^\circ + \cos 90^\circ] = \tfrac12\left[\tfrac12 + 0\right] = \tfrac14$.
- id: trig-q-2603
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Write $\sin 2x\sin 7x$ as a sum or difference.'
  choices: ['$\tfrac12[\cos 9x - \cos 5x]$', '$\tfrac12[\cos 5x - \cos 9x]$', '$\tfrac12[\sin 9x - \sin 5x]$', '$\tfrac12[\cos 5x + \cos 9x]$']
  answer: 1
  explanation: |-
    $\sin\alpha\sin\beta = \tfrac12[\cos(\alpha - \beta) - \cos(\alpha + \beta)] = \tfrac12[\cos(-5x) - \cos 9x] = \tfrac12[\cos 5x - \cos 9x]$.
    Reversing the order flips the sign.
- id: trig-q-2604
  lesson: trig-product-sum
  module_quiz: true
  topic: Product-to-sum formulas
  stem: 'Find the exact value of $\sin 75^\circ + \sin 15^\circ$.'
  choices: ['$\tfrac{\sqrt6}{2}$', '$1$', '$\tfrac{\sqrt2}{2}$', '$\sqrt3$']
  answer: 0
  explanation: |-
    $2\sin\tfrac{75^\circ + 15^\circ}{2}\cos\tfrac{75^\circ - 15^\circ}{2} = 2\sin 45^\circ\cos 30^\circ = 2\cdot\tfrac{\sqrt2}{2}\cdot\tfrac{\sqrt3}{2} = \tfrac{\sqrt6}{2}$.
- id: trig-q-2605
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Write $\cos 5x - \cos 3x$ as a product.'
  choices: ['$2\sin 4x\sin x$', '$-2\cos 4x\cos x$', '$-2\sin 4x\sin x$', '$2\cos 4x\sin x$']
  answer: 2
  explanation: |-
    $\cos u - \cos v = -2\sin\tfrac{u + v}{2}\sin\tfrac{u - v}{2} = -2\sin 4x\sin x$. Dropping the minus sign is the usual slip.
- id: trig-q-2606
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Solve $\sin 3x + \sin x = 0$ on $[0, 2\pi)$.'
  choices: ['$0, \pi$', '$\tfrac{\pi}{2}, \tfrac{3\pi}{2}$', '$0, \tfrac{\pi}{4}, \pi, \tfrac{5\pi}{4}$', '$0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}$']
  answer: 3
  explanation: |-
    $2\sin 2x\cos x = 0$. $\sin 2x = 0$ gives $x = 0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}$; $\cos x = 0$ adds nothing new.
- id: trig-q-2607
  lesson: trig-product-sum
  module_quiz: true
  topic: Product-to-sum formulas
  stem: 'Notes of 440 Hz and 444 Hz are played together. How many beats per second are heard?'
  choices: ['2', '4', '442', '884']
  answer: 1
  explanation: |-
    The sum is a 442 Hz tone with amplitude $2\cos(4\pi t)$, whose size peaks 4 times per second: the difference
    of the frequencies.
- id: trig-q-2608
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Adding $\sin(\alpha + \beta)$ and $\sin(\alpha - \beta)$ gives which expression?'
  choices: ['$2\sin\alpha\cos\beta$', '$2\cos\alpha\sin\beta$', '$2\sin\alpha\sin\beta$', '$2\cos\alpha\cos\beta$']
  answer: 0
  explanation: |-
    The $\cos\alpha\sin\beta$ terms cancel and the $\sin\alpha\cos\beta$ terms double. That's where the first
    product-to-sum formula comes from.
- id: trig-q-2609
  lesson: trig-product-sum
  module_quiz: true
  topic: Product-to-sum formulas
  stem: 'Find the exact value of $\cos 105^\circ + \cos 15^\circ$.'
  choices: ['$\tfrac{\sqrt6}{2}$', '$\tfrac{\sqrt2}{2}$', '$\tfrac12$', '$0$']
  answer: 1
  explanation: |-
    $2\cos\tfrac{120^\circ}{2}\cos\tfrac{90^\circ}{2} = 2\cos 60^\circ\cos 45^\circ = 2\cdot\tfrac12\cdot\tfrac{\sqrt2}{2} = \tfrac{\sqrt2}{2}$.
- id: trig-q-2610
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Find the exact value of $\sin 45^\circ\sin 15^\circ$.'
  choices: ['$\dfrac{\sqrt3 + 1}{4}$', '$\dfrac{\sqrt3}{4}$', '$\dfrac{1 - \sqrt3}{4}$', '$\dfrac{\sqrt3 - 1}{4}$']
  answer: 3
  explanation: |-
    $\tfrac12[\cos 30^\circ - \cos 60^\circ] = \tfrac12\left[\tfrac{\sqrt3}{2} - \tfrac12\right] = \tfrac{\sqrt3 - 1}{4} \approx 0.183$.
- id: trig-q-2611
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Write $\sin 7x - \sin 3x$ as a product.'
  choices: ['$2\sin 5x\cos 2x$', '$2\cos 5x\sin 2x$', '$-2\sin 5x\sin 2x$', '$-2\cos 5x\sin 2x$']
  answer: 1
  explanation: |-
    $\sin u - \sin v = 2\cos\tfrac{u + v}{2}\sin\tfrac{u - v}{2} = 2\cos 5x\sin 2x$.

- id: trig-q-2701
  lesson: trig-equations-ids
  module_quiz: true
  topic: Trig equations with identities
  stem: 'Solve $2\cos^2 x + 3\sin x - 3 = 0$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{6}, \tfrac{5\pi}{6}$', '$\tfrac{\pi}{6}, \tfrac{\pi}{2}, \tfrac{5\pi}{6}$', '$\tfrac{\pi}{3}, \tfrac{\pi}{2}, \tfrac{2\pi}{3}$', '$\tfrac{7\pi}{6}, \tfrac{3\pi}{2}, \tfrac{11\pi}{6}$']
  answer: 1
  explanation: |-
    Replace $\cos^2 x$: $2\sin^2 x - 3\sin x + 1 = 0$, so $(2\sin x - 1)(\sin x - 1) = 0$. $\sin x = \tfrac12$ gives
    $\tfrac{\pi}{6}, \tfrac{5\pi}{6}$ and $\sin x = 1$ gives $\tfrac{\pi}{2}$.
- id: trig-q-2702
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'How many solutions does $\sin 2x = \cos x$ have on $[0, 2\pi)$?'
  choices: ['2', '3', '4', '6']
  answer: 2
  explanation: |-
    $\cos x(2\sin x - 1) = 0$: $\cos x = 0$ gives $\tfrac{\pi}{2}, \tfrac{3\pi}{2}$; $\sin x = \tfrac12$ gives $\tfrac{\pi}{6}, \tfrac{5\pi}{6}$.
    Dividing by $\cos x$ would lose two of them.
- id: trig-q-2703
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Solve $\cos 2x + \cos x = 0$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{3}, \pi, \tfrac{5\pi}{3}$', '$\tfrac{2\pi}{3}, \tfrac{4\pi}{3}$', '$0, \tfrac{2\pi}{3}, \tfrac{4\pi}{3}$', '$\tfrac{\pi}{3}, \tfrac{5\pi}{3}$']
  answer: 0
  explanation: |-
    Use $\cos 2x = 2\cos^2 x - 1$: $2\cos^2 x + \cos x - 1 = (2\cos x - 1)(\cos x + 1) = 0$. So $\cos x = \tfrac12$
    ($\tfrac{\pi}{3}, \tfrac{5\pi}{3}$) or $\cos x = -1$ ($\pi$).
- id: trig-q-2704
  lesson: trig-equations-ids
  module_quiz: true
  topic: Trig equations with identities
  stem: 'Squaring $\sin x + \cos x = 1$ leads to the candidates $0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}$. Which are actual solutions?'
  choices: ['All four', '$0$ and $\tfrac{\pi}{2}$', '$\pi$ and $\tfrac{3\pi}{2}$', '$0$ and $\pi$']
  answer: 1
  explanation: |-
    Check in the original: $0$ gives $0 + 1 = 1$ ✓, $\tfrac{\pi}{2}$ gives $1 + 0 = 1$ ✓, $\pi$ gives $-1$ ✗, $\tfrac{3\pi}{2}$ gives $-1$ ✗.
    The last two are extraneous.
- id: trig-q-2705
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Solve $3\sin^2 x - 5\sin x - 2 = 0$ on $[0, 2\pi)$, to four decimals.'
  choices: ['$0.3398$ and $2.8018$', '$3.4814$ and $5.9433$', '$3.4814$ only', '$-0.3398$ and $3.4814$']
  answer: 1
  explanation: |-
    $(3\sin x + 1)(\sin x - 2) = 0$, and $\sin x = 2$ is impossible. $\sin x = -\tfrac13$: reference angle $0.3398$,
    quadrants III and IV: $\pi + 0.3398 \approx 3.4814$ and $2\pi - 0.3398 \approx 5.9433$.
- id: trig-q-2706
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Solve $\sec^2 x = 2\tan x$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{4}$ only', '$\tfrac{\pi}{4}, \tfrac{3\pi}{4}$', '$\tfrac{\pi}{4}, \tfrac{5\pi}{4}$', 'No solutions']
  answer: 2
  explanation: |-
    $1 + \tan^2 x = 2\tan x$ gives $(\tan x - 1)^2 = 0$, so $\tan x = 1$: $x = \tfrac{\pi}{4}, \tfrac{5\pi}{4}$.
- id: trig-q-2707
  lesson: trig-equations-ids
  module_quiz: true
  topic: Trig equations with identities
  stem: 'Solve $\cos 2x = \sin x$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{6}, \tfrac{5\pi}{6}, \tfrac{3\pi}{2}$', '$\tfrac{\pi}{6}, \tfrac{5\pi}{6}$', '$\tfrac{\pi}{2}, \tfrac{7\pi}{6}, \tfrac{11\pi}{6}$', '$\tfrac{\pi}{4}, \tfrac{3\pi}{4}$']
  answer: 0
  explanation: |-
    Use $\cos 2x = 1 - 2\sin^2 x$: $2\sin^2 x + \sin x - 1 = (2\sin x - 1)(\sin x + 1) = 0$. So $\sin x = \tfrac12$
    ($\tfrac{\pi}{6}, \tfrac{5\pi}{6}$) or $\sin x = -1$ ($\tfrac{3\pi}{2}$).
- id: trig-q-2708
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'What is an extraneous solution?'
  choices: ['A solution outside $[0, 2\pi)$', 'A solution of a transformed equation (for example after squaring) that does not satisfy the original equation', 'A solution that is not a special angle', 'A repeated solution']
  answer: 1
  explanation: |-
    Squaring both sides makes $A = B$ and $A = -B$ look the same, so solutions of the second can sneak in.
    Checking every candidate in the original equation removes them.
- id: trig-q-2709
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Solve $2\sin^2 x = 1 - \cos x$ on $[0, 2\pi)$.'
  choices: ['$0, \tfrac{2\pi}{3}, \tfrac{4\pi}{3}$', '$\tfrac{\pi}{3}, \pi, \tfrac{5\pi}{3}$', '$\tfrac{2\pi}{3}, \tfrac{4\pi}{3}$', '$0, \pi$']
  answer: 0
  explanation: |-
    $2(1 - \cos^2 x) = 1 - \cos x$ becomes $2\cos^2 x - \cos x - 1 = 0$, so $(2\cos x + 1)(\cos x - 1) = 0$.
    $\cos x = 1$ gives $0$; $\cos x = -\tfrac12$ gives $\tfrac{2\pi}{3}, \tfrac{4\pi}{3}$.
- id: trig-q-2710
  lesson: trig-equations-ids
  module_quiz: true
  topic: Trig equations with identities
  stem: 'How many solutions does $\cos^2 x - \sin^2 x = \tfrac12$ have on $[0, 2\pi)$?'
  choices: ['2', '3', '4', '8']
  answer: 2
  explanation: |-
    The left side is $\cos 2x$, so $\cos 2x = \tfrac12$ with $2x \in [0, 4\pi)$: $2x = \tfrac{\pi}{3}, \tfrac{5\pi}{3}, \tfrac{7\pi}{3}, \tfrac{11\pi}{3}$, giving
    $x = \tfrac{\pi}{6}, \tfrac{5\pi}{6}, \tfrac{7\pi}{6}, \tfrac{11\pi}{6}$.
- id: trig-q-2711
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'What is the smallest solution of $4\sin x\cos x = 1$ in $[0, 2\pi)$?'
  choices: ['$\tfrac{\pi}{6}$', '$\tfrac{\pi}{12}$', '$\tfrac{\pi}{24}$', '$\tfrac{5\pi}{12}$']
  answer: 1
  explanation: |-
    $4\sin x\cos x = 2\sin 2x$, so $\sin 2x = \tfrac12$. The smallest $2x$ is $\tfrac{\pi}{6}$, so $x = \tfrac{\pi}{12}$. (All solutions:
    $\tfrac{\pi}{12}, \tfrac{5\pi}{12}, \tfrac{13\pi}{12}, \tfrac{17\pi}{12}$.)
