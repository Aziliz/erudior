# Module 1: Angles and their measure
- id: trig-q-0101
  lesson: trig-angles
  module_quiz: true
  topic: Angles
  stem: 'An angle in standard position is formed by rotating the terminal side clockwise. What is true about its measure?'
  choices: ['It is negative', 'It is positive', 'It is always greater than $360^\circ$', 'It is always less than $90^\circ$']
  answer: 0
  explanation: |-
    The convention is counterclockwise = positive, clockwise = negative. The size of the
    rotation is not limited: a clockwise rotation can be small or several full turns.
- id: trig-q-0102
  lesson: trig-angles
  module_quiz: true
  topic: Angles
  stem: 'Which angle in $[0^\circ, 360^\circ)$ is coterminal with $-250^\circ$?'
  choices: ['$250^\circ$', '$290^\circ$', '$70^\circ$', '$110^\circ$']
  answer: 3
  explanation: |-
    Add one full turn: $-250^\circ + 360^\circ = 110^\circ$. ($250^\circ$ just drops the sign;
    $70^\circ$ and $290^\circ$ differ from $-250^\circ$ by $320^\circ$ and $540^\circ$, which are not
    multiples of $360^\circ$.)
- id: trig-q-0103
  lesson: trig-angles
  topic: Angles
  stem: 'Which angle is coterminal with $75^\circ$?'
  choices: ['$-285^\circ$', '$285^\circ$', '$-75^\circ$', '$165^\circ$']
  answer: 0
  explanation: |-
    Coterminal angles differ by a multiple of $360^\circ$: $75^\circ - 360^\circ = -285^\circ$.
    $-75^\circ$ is the reflection across the $x$-axis, and $165^\circ$ is $75^\circ + 90^\circ$.
- id: trig-q-0104
  lesson: trig-angles
  topic: Angles
  stem: 'In which quadrant does an angle of $1000^\circ$ in standard position lie?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant III', 'Quadrant IV']
  answer: 3
  explanation: |-
    Remove two full turns: $1000^\circ - 720^\circ = 280^\circ$, which is between $270^\circ$
    and $360^\circ$, so the terminal side is in quadrant IV.
- id: trig-q-0105
  lesson: trig-angles
  module_quiz: true
  topic: Degree measure
  stem: 'Convert $47^\circ\,21''\,36''''$ to decimal degrees.'
  choices: ['$47.36^\circ$', '$47.2136^\circ$', '$47.37^\circ$', '$47.3536^\circ$']
  answer: 0
  explanation: |-
    $47 + \tfrac{21}{60} + \tfrac{36}{3600} = 47 + 0.35 + 0.01 = 47.36^\circ$. Writing the
    digits after the decimal point ($47.2136$) treats minutes and seconds as if they were
    decimals.
- id: trig-q-0106
  lesson: trig-angles
  topic: Degree measure
  stem: 'Write $63.42^\circ$ in degrees, minutes and seconds.'
  choices: ['$63^\circ\,42''$', '$63^\circ\,4''\,12''''$', '$63^\circ\,25''\,12''''$', '$63^\circ\,25''\,2''''$']
  answer: 2
  explanation: |-
    $0.42 \times 60 = 25.2'$, so $25'$ with $0.2'$ left over; $0.2 \times 60 = 12''$.
    Result: $63^\circ\,25'\,12''$. $63^\circ 42'$ reads the decimal digits as minutes.
- id: trig-q-0107
  lesson: trig-angles
  topic: Degree measure
  stem: 'An angle''s supplement is four times its complement. What is the angle?'
  choices: ['$45^\circ$', '$60^\circ$', '$36^\circ$', '$72^\circ$']
  answer: 1
  explanation: |-
    $180 - x = 4(90 - x)$ gives $180 - x = 360 - 4x$, so $3x = 180$ and $x = 60^\circ$.
    Check: supplement $120^\circ$, complement $30^\circ$, and $120 = 4 \cdot 30$.
- id: trig-q-0108
  lesson: trig-angles
  topic: Angles
  stem: 'Which of these is a quadrantal angle?'
  choices: ['$405^\circ$', '$225^\circ$', '$135^\circ$', '$-450^\circ$']
  answer: 3
  explanation: |-
    $-450^\circ + 720^\circ = 270^\circ$, which lies on the negative $y$-axis, so it is
    quadrantal. $405^\circ$ is coterminal with $45^\circ$ (quadrant I); the others are in
    quadrants III and II.
- id: trig-q-0109
  lesson: trig-angles
  module_quiz: true
  topic: Angles
  stem: 'A wheel turns clockwise through $2\tfrac34$ revolutions. Which angle in $[0^\circ, 360^\circ)$ is coterminal with this rotation?'
  choices: ['$90^\circ$', '$270^\circ$', '$180^\circ$', '$-90^\circ$']
  answer: 0
  explanation: |-
    Clockwise means negative: $-2.75 \times 360^\circ = -990^\circ$. Add $3 \times 360^\circ$:
    $-990^\circ + 1080^\circ = 90^\circ$. ($270^\circ$ is what a counterclockwise
    $2\tfrac34$ turns would give.)
- id: trig-q-0110
  lesson: trig-angles
  topic: Degree measure
  stem: 'Add $25^\circ\,48'' + 34^\circ\,27''$ and write the result in standard form (minutes under 60).'
  choices: ['$59^\circ\,75''$', '$60^\circ\,75''$', '$59^\circ\,15''$', '$60^\circ\,15''$']
  answer: 3
  explanation: |-
    Degrees: $59^\circ$; minutes: $75'$. Since $60' = 1^\circ$, $75' = 1^\circ\,15'$, giving
    $60^\circ\,15'$. $59^\circ 75'$ has the right value but is not in standard form, because
    minutes must be under 60.
- id: trig-q-0111
  lesson: trig-angles
  topic: Angles
  stem: 'Which pair of angles is coterminal?'
  choices: ['$130^\circ$ and $-230^\circ$', '$130^\circ$ and $-130^\circ$', '$130^\circ$ and $230^\circ$', '$130^\circ$ and $50^\circ$']
  answer: 0
  explanation: |-
    $130^\circ - 360^\circ = -230^\circ$, so they share a terminal side. The other pairs differ
    by $100^\circ$, $260^\circ$ and $80^\circ$, none of which is a multiple of $360^\circ$.

- id: trig-q-0201
  lesson: trig-radians
  module_quiz: true
  topic: Radian measure
  stem: 'What is one radian?'
  choices: ['The central angle that subtends an arc equal in length to the radius', 'One degree written in terms of $\pi$', 'The angle of one full revolution divided by 100', 'The central angle that subtends an arc equal in length to the diameter']
  answer: 0
  explanation: |-
    By definition, $\theta = s/r$, so $\theta = 1$ exactly when $s = r$. One radian is about
    $57.3^\circ$.
- id: trig-q-0202
  lesson: trig-radians
  module_quiz: true
  topic: Radian measure
  stem: 'Convert $225^\circ$ to radians.'
  choices: ['$\dfrac{4\pi}{5}$', '$\dfrac{5\pi}{4}$', '$\dfrac{5\pi}{6}$', '$\dfrac{5\pi}{3}$']
  answer: 1
  explanation: |-
    $225 \cdot \tfrac{\pi}{180} = \tfrac{225\pi}{180} = \tfrac{5\pi}{4}$ (divide by 45).
    $\tfrac{4\pi}{5}$ flips the fraction; $\tfrac{5\pi}{6}$ is $150^\circ$.
- id: trig-q-0203
  lesson: trig-radians
  topic: Radian measure
  stem: 'Convert $\dfrac{7\pi}{6}$ to degrees.'
  choices: ['$105^\circ$', '$240^\circ$', '$210^\circ$', '$420^\circ$']
  answer: 2
  explanation: |-
    $\tfrac{7\pi}{6} \cdot \tfrac{180^\circ}{\pi} = 7 \cdot 30^\circ = 210^\circ$.
    ($105^\circ$ uses $\pi = 90^\circ$; $420^\circ$ uses $\pi = 360^\circ$.)
- id: trig-q-0204
  lesson: trig-radians
  topic: Radian measure
  stem: 'About how many degrees is one radian?'
  choices: ['$3.14^\circ$', '$90^\circ$', '$45^\circ$', '$57.3^\circ$']
  answer: 3
  explanation: |-
    $1 \text{ rad} = \tfrac{180^\circ}{\pi} \approx 57.3^\circ$. It is a little less than
    $60^\circ$, which is a handy estimate.
- id: trig-q-0205
  lesson: trig-radians
  module_quiz: true
  topic: Radian measure
  stem: 'In which quadrant does an angle of 4 radians lie?'
  choices: ['Quadrant III', 'Quadrant II', 'Quadrant IV', 'Quadrant I']
  answer: 0
  explanation: |-
    $\pi \approx 3.14$ and $\tfrac{3\pi}{2} \approx 4.71$. Since $3.14 < 4 < 4.71$, the angle
    is in quadrant III. (Treating 4 as degrees would wrongly give quadrant I.)
- id: trig-q-0206
  lesson: trig-radians
  topic: Radian measure
  stem: 'Convert $-300^\circ$ to radians.'
  choices: ['$-\dfrac{5\pi}{3}$', '$-\dfrac{5\pi}{6}$', '$-\dfrac{3\pi}{5}$', '$\dfrac{5\pi}{3}$']
  answer: 0
  explanation: |-
    $-300 \cdot \tfrac{\pi}{180} = -\tfrac{300\pi}{180} = -\tfrac{5\pi}{3}$. The sign stays; a
    negative angle in degrees is negative in radians too.
- id: trig-q-0207
  lesson: trig-radians
  topic: Radian measure
  stem: 'Which angle in $[0, 2\pi)$ is coterminal with $\dfrac{19\pi}{6}$?'
  choices: ['$\dfrac{\pi}{6}$', '$\dfrac{5\pi}{6}$', '$\dfrac{13\pi}{6}$', '$\dfrac{7\pi}{6}$']
  answer: 3
  explanation: |-
    $2\pi = \tfrac{12\pi}{6}$, so $\tfrac{19\pi}{6} - \tfrac{12\pi}{6} = \tfrac{7\pi}{6}$.
    $\tfrac{13\pi}{6}$ is still larger than $2\pi$, and $\tfrac{\pi}{6}$ subtracts $3\pi$, which is
    not a whole number of turns.
- id: trig-q-0208
  lesson: trig-radians
  module_quiz: true
  topic: Radian measure
  stem: 'A student types $\sin 30$ into a calculator, expecting $0.5$, and gets about $-0.988$. What happened?'
  choices: ['The calculator is broken', 'The calculator is in degree mode', 'Sine is negative for every angle above $\pi$', 'The calculator is in radian mode, so it found the sine of 30 radians']
  answer: 3
  explanation: |-
    In radian mode the input means 30 radians (about $1719^\circ$), and
    $\sin 30 \approx -0.988$. Switch to degree mode, or enter $\pi/6$.
- id: trig-q-0209
  lesson: trig-radians
  topic: Radian measure
  stem: 'Which of these angles is largest?'
  choices: ['$2$ radians', '$100^\circ$', '$\dfrac{3\pi}{5}$', '$1.9$ radians']
  answer: 0
  explanation: |-
    In degrees: $2 \text{ rad} \approx 114.6^\circ$, $\tfrac{3\pi}{5} = 108^\circ$,
    $1.9 \text{ rad} \approx 108.9^\circ$, and $100^\circ$. The largest is 2 radians.
- id: trig-q-0210
  lesson: trig-radians
  topic: Radian measure
  stem: 'Convert $75^\circ$ to radians.'
  choices: ['$\dfrac{3\pi}{8}$', '$\dfrac{5\pi}{12}$', '$\dfrac{7\pi}{12}$', '$\dfrac{12\pi}{5}$']
  answer: 1
  explanation: |-
    $75 \cdot \tfrac{\pi}{180} = \tfrac{75\pi}{180} = \tfrac{5\pi}{12}$ (divide by 15).
    $\tfrac{7\pi}{12}$ is $105^\circ$.
- id: trig-q-0211
  lesson: trig-radians
  topic: Radian measure
  stem: |-
    A student converts $\tfrac{5\pi}{4}$ to degrees:

    Step 1: $\tfrac{5\pi}{4} \cdot \tfrac{\pi}{180}$
    Step 2: $= \tfrac{5\pi^2}{720}$
    Step 3: $\approx 0.0685^\circ$

    Where is the error?
  choices: ['Step 1: the conversion factor should be $\tfrac{180}{\pi}$', 'Step 2: the product should be $\tfrac{5\pi}{720}$', 'Step 3: the decimal is computed wrong', 'There is no error']
  answer: 0
  explanation: |-
    Converting radians to degrees multiplies by $\tfrac{180^\circ}{\pi}$ so that $\pi$ cancels:
    $\tfrac{5\pi}{4} \cdot \tfrac{180^\circ}{\pi} = 225^\circ$. A result smaller than a degree
    for more than a half turn should have been a red flag.

- id: trig-q-0301
  lesson: trig-arc-sector
  module_quiz: true
  topic: Arc length
  stem: 'A circle has radius 10 cm. Find the length of the arc subtended by a central angle of 2.4 radians.'
  choices: ['$4.17$ cm', '$240$ cm', '$12$ cm', '$24$ cm']
  answer: 3
  explanation: |-
    $s = r\theta = 10 \times 2.4 = 24$ cm. The angle is already in radians, so no conversion
    is needed. ($4.17 = 10/2.4$ divides instead of multiplying.)
- id: trig-q-0302
  lesson: trig-arc-sector
  topic: Arc length
  stem: 'Find the length of the arc on a circle of radius 12 in subtended by a central angle of $150^\circ$.'
  choices: ['$1800$ in', '$5\pi$ in', '$10\pi$ in', '$60\pi$ in']
  answer: 2
  explanation: |-
    $150^\circ = \tfrac{5\pi}{6}$ rad, so $s = 12 \cdot \tfrac{5\pi}{6} = 10\pi \approx 31.4$ in.
    $1800 = 12 \times 150$ uses degrees in a radian formula; $60\pi$ is the sector area.
- id: trig-q-0303
  lesson: trig-arc-sector
  module_quiz: true
  topic: Sector area
  stem: 'Find the area of a sector with radius 6 and central angle $\dfrac{\pi}{3}$.'
  choices: ['$2\pi$', '$12\pi$', '$3\pi$', '$6\pi$']
  answer: 3
  explanation: |-
    $A = \tfrac12 r^2\theta = \tfrac12 \cdot 36 \cdot \tfrac{\pi}{3} = 6\pi$. Forgetting the
    $\tfrac12$ gives $12\pi$; using $r$ instead of $r^2$ gives $\pi$.
- id: trig-q-0304
  lesson: trig-arc-sector
  topic: Arc length
  stem: 'An arc of length 20 m lies on a circle of radius 8 m. What is the central angle in radians?'
  choices: ['$2.5$', '$0.4$', '$160$', '$12$']
  answer: 0
  explanation: |-
    $\theta = s/r = 20/8 = 2.5$ radians (about $143^\circ$).
- id: trig-q-0305
  lesson: trig-arc-sector
  topic: Arc length
  stem: 'A student finds the arc length for $r = 5$ and $\theta = 60^\circ$ as $s = 5 \cdot 60 = 300$. What is the correct arc length?'
  choices: ['$\dfrac{\pi}{3}$', '$\dfrac{5\pi}{3}$', '$\dfrac{5\pi}{6}$', '$\dfrac{25\pi}{6}$']
  answer: 1
  explanation: |-
    The formula needs radians: $60^\circ = \tfrac{\pi}{3}$, so $s = 5 \cdot \tfrac{\pi}{3} = \tfrac{5\pi}{3} \approx 5.24$.
    $\tfrac{25\pi}{6}$ is the sector area.
- id: trig-q-0306
  lesson: trig-arc-sector
  topic: Sector area
  stem: 'A sector of a circle with radius 9 has arc length 12. What is its area?'
  choices: ['$108$', '$27$', '$486$', '$54$']
  answer: 3
  explanation: |-
    $A = \tfrac12 r s = \tfrac12 \cdot 9 \cdot 12 = 54$. (Equivalently $\theta = 12/9 = \tfrac43$ and
    $A = \tfrac12 \cdot 81 \cdot \tfrac43 = 54$.)
- id: trig-q-0307
  lesson: trig-arc-sector
  module_quiz: true
  topic: Arc length
  stem: 'Two cities on the same meridian differ in latitude by $6^\circ$. Using Earth''s radius as 3960 mi, about how far apart are they?'
  choices: ['About 415 mi', 'About 207 mi', 'About 23,760 mi', 'About 660 mi']
  answer: 0
  explanation: |-
    $6^\circ = \tfrac{\pi}{30}$ rad, so $s = 3960 \cdot \tfrac{\pi}{30} = 132\pi \approx 414.7$ mi.
    $23{,}760 = 3960 \times 6$ uses degrees directly.
- id: trig-q-0308
  lesson: trig-arc-sector
  module_quiz: true
  topic: Arc length
  stem: 'A pendulum 30 in long swings through an angle of $20^\circ$. How long is the arc its tip travels in one swing?'
  choices: ['$600$ in', '$1.5$ in', '$\dfrac{10\pi}{3} \approx 10.5$ in', '$\dfrac{50\pi}{3} \approx 52.4$ in']
  answer: 2
  explanation: |-
    $20^\circ = \tfrac{\pi}{9}$ rad, so $s = 30 \cdot \tfrac{\pi}{9} = \tfrac{10\pi}{3} \approx 10.47$ in.
- id: trig-q-0309
  lesson: trig-arc-sector
  topic: Sector area
  stem: 'A sector of a circle with radius 10 has area 50. What is its central angle?'
  choices: ['$1$ radian', '$5$ radians', '$0.5$ radian', '$2$ radians']
  answer: 0
  explanation: |-
    From $A = \tfrac12 r^2\theta$: $\theta = \tfrac{2A}{r^2} = \tfrac{100}{100} = 1$ radian.
    Forgetting the factor 2 gives $0.5$.
- id: trig-q-0310
  lesson: trig-arc-sector
  topic: Arc length
  stem: 'A 16-inch (diameter) pizza is cut into 8 equal slices. How long is the outer crust edge of one slice?'
  choices: ['$4\pi$ in', '$8\pi$ in', '$\pi$ in', '$2\pi$ in']
  answer: 3
  explanation: |-
    $r = 8$ in and each slice has central angle $\tfrac{2\pi}{8} = \tfrac{\pi}{4}$. Then
    $s = 8 \cdot \tfrac{\pi}{4} = 2\pi \approx 6.28$ in. Using 16 as the radius gives $4\pi$.
- id: trig-q-0311
  lesson: trig-arc-sector
  topic: Sector area
  stem: 'If the radius of a sector doubles and the central angle stays the same, what happens to the area?'
  choices: ['It is multiplied by 4', 'It doubles', 'It stays the same', 'It is multiplied by 8']
  answer: 0
  explanation: |-
    $A = \tfrac12 r^2\theta$ depends on $r^2$, so doubling $r$ multiplies $A$ by $2^2 = 4$.
    (The arc length, $r\theta$, only doubles.)

- id: trig-q-0401
  lesson: trig-speed
  module_quiz: true
  topic: Angular and linear speed
  stem: 'A record turns at 45 rpm. What is its angular speed in radians per second?'
  choices: ['$90\pi$ rad/s', '$1.5\pi$ rad/s', '$0.75$ rad/s', '$45$ rad/s']
  answer: 1
  explanation: |-
    $45 \text{ rev/min} \times 2\pi \text{ rad/rev} = 90\pi$ rad/min; divide by 60:
    $1.5\pi \approx 4.71$ rad/s. $90\pi$ is the rate per minute.
- id: trig-q-0402
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'A point is 0.3 m from the center of a disk spinning at 10 rad/s. What is its linear speed?'
  choices: ['$3$ m/s', '$33.3$ m/s', '$0.03$ m/s', '$6\pi$ m/s']
  answer: 0
  explanation: |-
    $v = r\omega = 0.3 \times 10 = 3$ m/s. Since $\omega$ is already in rad/s, no factor of
    $2\pi$ is needed.
- id: trig-q-0403
  lesson: trig-speed
  module_quiz: true
  topic: Angular and linear speed
  stem: 'Two points are on the same spinning disk: $P$ is 2 cm from the center and $Q$ is 6 cm from the center. Which statement is true?'
  choices: ['$P$ has three times the angular speed of $Q$', 'They have the same linear speed', '$Q$ has three times the angular speed of $P$', 'They have the same angular speed, and $Q$ has three times the linear speed']
  answer: 3
  explanation: |-
    A rigid disk turns as one piece, so every point sweeps the same angle per second: same
    $\omega$. Linear speed is $v = r\omega$, so tripling $r$ triples $v$.
- id: trig-q-0404
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'A bicycle''s wheels are 26 in in diameter and turn at 200 rpm. About how fast is the bicycle going?'
  choices: ['About 30.9 mi/h', 'About 2.5 mi/h', 'About 15.5 mi/h', 'About 7.7 mi/h']
  answer: 2
  explanation: |-
    $r = 13$ in, $\omega = 400\pi$ rad/min, so $v = 13 \cdot 400\pi = 5200\pi$ in/min.
    Converting: $5200\pi \cdot \tfrac{60}{63{,}360} \approx 15.5$ mi/h. Using the diameter as the
    radius doubles this to about 30.9.
- id: trig-q-0405
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'A belt connects a 4 cm pulley spinning at 30 rad/s to a 10 cm pulley. What is the angular speed of the 10 cm pulley?'
  choices: ['$12$ rad/s', '$30$ rad/s', '$75$ rad/s', '$120$ rad/s']
  answer: 0
  explanation: |-
    The belt speed is shared: $v = 4 \cdot 30 = 120$ cm/s. Then $\omega = 120/10 = 12$ rad/s.
    The larger pulley turns more slowly; $75$ inverts the ratio.
- id: trig-q-0406
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'Earth orbits the Sun in a nearly circular path of radius about $93$ million miles once every 365.25 days. About how fast does Earth move along its orbit?'
  choices: ['About 1,000 mi/h', 'About 10,600 mi/h', 'About 66,700 mi/h', 'About 255,000 mi/h']
  answer: 2
  explanation: |-
    One orbit is $2\pi(93{,}000{,}000)$ mi in $365.25 \times 24 = 8766$ h:
    $v \approx \tfrac{5.843 \times 10^8}{8766} \approx 66{,}700$ mi/h.
    (About $10{,}600$ comes from leaving out the $2\pi$.)
- id: trig-q-0407
  lesson: trig-speed
  module_quiz: true
  topic: Angular and linear speed
  stem: |-
    A fan blade tip is 0.5 m from the center and the fan turns at 600 rpm. A student writes
    $v = r\omega = 0.5 \times 600 = 300$ m/min. What went wrong?
  choices: ['Nothing; the answer is correct', 'The answer should be divided by $2\pi$', 'The radius should be squared', 'rpm must be converted to radians per minute first, so $v = 0.5 \times 1200\pi \approx 1885$ m/min']
  answer: 3
  explanation: |-
    $v = r\omega$ needs $\omega$ in radians per unit time. $600$ rpm $= 1200\pi$ rad/min, so
    $v = 600\pi \approx 1885$ m/min.
- id: trig-q-0408
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'A clock''s minute hand is 6 in long. How fast does its tip move?'
  choices: ['$\dfrac{\pi}{5}$ in/min', '$12\pi$ in/min', '$\dfrac{\pi}{30}$ in/min', '$6$ in/min']
  answer: 0
  explanation: |-
    One turn per hour: $\omega = \tfrac{2\pi}{60} = \tfrac{\pi}{30}$ rad/min, so
    $v = 6 \cdot \tfrac{\pi}{30} = \tfrac{\pi}{5} \approx 0.63$ in/min. ($12\pi$ in/h is the
    same speed per hour, not per minute.)
- id: trig-q-0409
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'A point travels 15 m along a circle of radius 3 m in 5 seconds. What is its angular speed?'
  choices: ['$3$ rad/s', '$1$ rad/s', '$9$ rad/s', '$0.2$ rad/s']
  answer: 1
  explanation: |-
    The angle swept is $\theta = s/r = 15/3 = 5$ rad, so $\omega = 5/5 = 1$ rad/s.
    ($3$ m/s is the linear speed.)
- id: trig-q-0410
  lesson: trig-speed
  module_quiz: true
  topic: Angular and linear speed
  stem: 'A Ferris wheel of radius 25 m makes one revolution every 2 minutes. What is the linear speed of a rider, in m/s?'
  choices: ['About 0.65 m/s', 'About 78.5 m/s', 'About 2.62 m/s', 'About 1.31 m/s']
  answer: 3
  explanation: |-
    One revolution is $2\pi(25) = 50\pi$ m in 120 s: $v = \tfrac{50\pi}{120} \approx 1.31$ m/s.
    Using the diameter gives about 2.62 m/s.
- id: trig-q-0411
  lesson: trig-speed
  topic: Angular and linear speed
  stem: 'What is the angular speed of a clock''s hour hand?'
  choices: ['$\dfrac{\pi}{6}$ rad/h', '$\dfrac{\pi}{12}$ rad/h', '$2\pi$ rad/h', '$\dfrac{\pi}{30}$ rad/h']
  answer: 0
  explanation: |-
    The hour hand makes one turn in 12 hours: $\omega = \tfrac{2\pi}{12} = \tfrac{\pi}{6}$ rad/h.
    $\tfrac{\pi}{12}$ would be one turn in 24 hours, like Earth.
