# Module 8: Vectors in the plane
- id: trig-q-3201
  lesson: trig-vectors
  module_quiz: true
  topic: Vectors
  stem: 'What is the component form of the vector from $P(2, -1)$ to $Q(7, 3)$?'
  choices: ['$\langle -5, -4\rangle$', '$\langle 9, 2\rangle$', '$\langle 5, 2\rangle$', '$\langle 5, 4\rangle$']
  answer: 3
  explanation: |-
    Terminal minus initial: $\langle 7 - 2, 3 - (-1)\rangle = \langle 5, 4\rangle$. Initial minus terminal gives $\langle -5, -4\rangle$.
- id: trig-q-3202
  lesson: trig-vectors
  topic: Vectors
  stem: 'What is the magnitude of $\langle 5, 4\rangle$?'
  choices: ['$9$', '$\sqrt{41}$', '$3$', '$41$']
  answer: 1
  explanation: |-
    $\sqrt{5^2 + 4^2} = \sqrt{41} \approx 6.40$.
- id: trig-q-3203
  lesson: trig-vectors
  module_quiz: true
  topic: Vectors
  stem: 'A vector has magnitude 12 and direction angle $150^\circ$. What is its component form?'
  choices: ['$\langle -6\sqrt3, 6\rangle$', '$\langle 6, -6\sqrt3\rangle$', '$\langle 6\sqrt3, 6\rangle$', '$\langle -6, 6\sqrt3\rangle$']
  answer: 0
  explanation: |-
    $\langle 12\cos 150^\circ, 12\sin 150^\circ\rangle = \left\langle -\tfrac{12\sqrt3}{2}, \tfrac{12}{2}\right\rangle = \langle -6\sqrt3, 6\rangle$. $\langle -6, 6\sqrt3\rangle$ swaps sine and cosine.
- id: trig-q-3204
  lesson: trig-vectors
  topic: Vectors
  stem: 'What is the direction angle of $\langle -3, 4\rangle$?'
  choices: ['$-53.13^\circ$', '$53.13^\circ$', '$126.87^\circ$', '$233.13^\circ$']
  answer: 2
  explanation: |-
    The vector is in quadrant II. The reference angle is $\tan^{-1}\tfrac43 \approx 53.13^\circ$, so $\theta = 180^\circ - 53.13^\circ = 126.87^\circ$.
    $-53.13^\circ$ is what the calculator returns for $\tan^{-1}(-\tfrac43)$, pointing into quadrant IV.
- id: trig-q-3205
  lesson: trig-vectors
  topic: Vectors
  stem: 'Let $\mathbf{u} = \langle 2, -5\rangle$ and $\mathbf{v} = \langle -1, 3\rangle$. Find $3\mathbf{u} - 2\mathbf{v}$.'
  choices: ['$\langle 4, -9\rangle$', '$\langle 8, -21\rangle$', '$\langle 8, -9\rangle$', '$\langle 4, -21\rangle$']
  answer: 1
  explanation: |-
    $\langle 6, -15\rangle - \langle -2, 6\rangle = \langle 8, -21\rangle$. Forgetting to distribute the minus over $-2$ gives $4$ in the first slot.
- id: trig-q-3206
  lesson: trig-vectors
  topic: Vectors
  stem: 'What is the unit vector in the direction of $\langle 3, -4\rangle$?'
  choices: ['$\left\langle \tfrac35, -\tfrac45\right\rangle$', '$\langle 1, -1\rangle$', '$\left\langle \tfrac13, -\tfrac14\right\rangle$', '$\left\langle -\tfrac35, \tfrac45\right\rangle$']
  answer: 0
  explanation: |-
    Divide by the magnitude 5: $\left\langle \tfrac35, -\tfrac45\right\rangle$. $\left\langle -\tfrac35, \tfrac45\right\rangle$ points the opposite way.
- id: trig-q-3207
  lesson: trig-vectors
  module_quiz: true
  topic: Vectors
  stem: 'For $\mathbf{u} = \langle 2, -5\rangle$ and $\mathbf{v} = \langle -1, 3\rangle$, which is true?'
  choices: ['$\lVert\mathbf{u} + \mathbf{v}\rVert = \lVert\mathbf{u}\rVert + \lVert\mathbf{v}\rVert$', '$\lVert\mathbf{u} + \mathbf{v}\rVert > \lVert\mathbf{u}\rVert + \lVert\mathbf{v}\rVert$', '$\lVert\mathbf{u} + \mathbf{v}\rVert = 0$', '$\lVert\mathbf{u} + \mathbf{v}\rVert = \sqrt5$, much less than $\lVert\mathbf{u}\rVert + \lVert\mathbf{v}\rVert$']
  answer: 3
  explanation: |-
    $\mathbf{u} + \mathbf{v} = \langle 1, -2\rangle$ with magnitude $\sqrt5 \approx 2.24$, while $\sqrt{29} + \sqrt{10} \approx 8.55$. Magnitudes add only for
    vectors pointing the same way.
- id: trig-q-3208
  lesson: trig-vectors
  topic: Vectors
  stem: 'Which quantity is a vector?'
  choices: ['A temperature of $20^\circ$C', 'A mass of 3 kg', 'A wind of 30 km/h from the northwest', 'A time of 4 seconds']
  answer: 2
  explanation: |-
    The wind has both a size and a direction. The others are scalars.
- id: trig-q-3209
  lesson: trig-vectors
  module_quiz: true
  topic: Vectors
  stem: 'What is the direction angle of $\langle -5, -5\rangle$?'
  choices: ['$45^\circ$', '$135^\circ$', '$315^\circ$', '$225^\circ$']
  answer: 3
  explanation: |-
    Both components are negative: quadrant III, on the diagonal. $\theta = 180^\circ + 45^\circ = 225^\circ$. (The calculator's
    $\tan^{-1}(1) = 45^\circ$ is in the wrong quadrant.)
- id: trig-q-3210
  lesson: trig-vectors
  topic: Vectors
  stem: 'Write $\langle 4, -7\rangle$ using the standard unit vectors.'
  choices: ['$4\mathbf{i} - 7\mathbf{j}$', '$-7\mathbf{i} + 4\mathbf{j}$', '$4\mathbf{j} - 7\mathbf{i}$', '$4\mathbf{i} + 7\mathbf{j}$']
  answer: 0
  explanation: |-
    $\langle a, b\rangle = a\mathbf{i} + b\mathbf{j}$, so $4\mathbf{i} - 7\mathbf{j}$.
- id: trig-q-3211
  lesson: trig-vectors
  topic: Vectors
  stem: 'If $\lVert\mathbf{v}\rVert = 4$, what is $\lVert -3\mathbf{v}\rVert$?'
  choices: ['$-12$', '$12$', '$7$', '$1$']
  answer: 1
  explanation: |-
    $\lVert k\mathbf{v}\rVert = |k|\,\lVert\mathbf{v}\rVert = 3 \cdot 4 = 12$. The minus sign reverses direction; magnitudes are never negative.
- id: trig-q-3212
  lesson: trig-vectors
  topic: Vectors
  stem: 'A vector has magnitude 20 and direction angle $240^\circ$. What are its components?'
  choices: ['$\langle -10\sqrt3, -10\rangle$', '$\langle 10, 10\sqrt3\rangle$', '$\langle -10, -10\sqrt3\rangle$', '$\langle -10, 10\sqrt3\rangle$']
  answer: 2
  explanation: |-
    $20\cos 240^\circ = 20\left(-\tfrac12\right) = -10$ and $20\sin 240^\circ = 20\left(-\tfrac{\sqrt3}{2}\right) = -10\sqrt3$.

- id: trig-q-3301
  lesson: trig-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'Compute $\langle 3, 4\rangle\cdot\langle 5, -2\rangle$.'
  choices: ['$\langle 15, -8\rangle$', '$23$', '$-7$', '$7$']
  answer: 3
  explanation: |-
    $3(5) + 4(-2) = 15 - 8 = 7$. The dot product is a number, not a vector.
- id: trig-q-3302
  lesson: trig-dot-product
  topic: Dot product
  stem: 'Find the angle between $\langle 3, 4\rangle$ and $\langle 5, -2\rangle$.'
  choices: ['About $74.93^\circ$', 'About $15.07^\circ$', 'About $105.07^\circ$', 'About $68.20^\circ$']
  answer: 0
  explanation: |-
    $\cos\theta = \tfrac{7}{5\sqrt{29}} \approx 0.2600$, so $\theta \approx 74.93^\circ$.
- id: trig-q-3303
  lesson: trig-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'Which pair of vectors is orthogonal?'
  choices: ['$\langle 2, 3\rangle$ and $\langle 3, 2\rangle$', '$\langle 1, 1\rangle$ and $\langle 2, 2\rangle$', '$\langle 2, -3\rangle$ and $\langle 6, 4\rangle$', '$\langle 1, 0\rangle$ and $\langle 1, 1\rangle$']
  answer: 2
  explanation: |-
    $\langle 2, -3\rangle\cdot\langle 6, 4\rangle = 12 - 12 = 0$. The other dot products are $12$, $4$ and $1$.
- id: trig-q-3304
  lesson: trig-dot-product
  topic: Dot product
  stem: 'For what value of $k$ is $\langle k, 3\rangle$ orthogonal to $\langle 2, -5\rangle$?'
  choices: ['$-7.5$', '$7.5$', '$1.2$', '$-1.2$']
  answer: 1
  explanation: |-
    $2k - 15 = 0$ gives $k = 7.5$.
- id: trig-q-3305
  lesson: trig-dot-product
  topic: Dot product
  stem: 'Find $\text{proj}_{\mathbf{v}}\mathbf{u}$ for $\mathbf{u} = \langle 6, 2\rangle$ and $\mathbf{v} = \langle 3, 4\rangle$.'
  choices: ['$\langle 15.6, 20.8\rangle$', '$\langle 3.12, 4.16\rangle$', '$\langle 4.68, 1.56\rangle$', '$\langle 2.88, -2.16\rangle$']
  answer: 1
  explanation: |-
    $\tfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{v}\rVert^2}\mathbf{v} = \tfrac{26}{25}\langle 3, 4\rangle = \langle 3.12, 4.16\rangle$. Dividing by $\lVert\mathbf{v}\rVert$ instead of $\lVert\mathbf{v}\rVert^2$
    gives $\langle 15.6, 20.8\rangle$; $\langle 2.88, -2.16\rangle$ is the orthogonal remainder.
- id: trig-q-3306
  lesson: trig-dot-product
  topic: Dot product
  stem: 'What is the scalar projection (component) of $\mathbf{u} = \langle 6, 2\rangle$ along $\mathbf{v} = \langle 3, 4\rangle$?'
  choices: ['$5.2$', '$26$', '$1.04$', '$6.32$']
  answer: 0
  explanation: |-
    $\tfrac{\mathbf{u}\cdot\mathbf{v}}{\lVert\mathbf{v}\rVert} = \tfrac{26}{5} = 5.2$. ($1.04 = \tfrac{26}{25}$ is the scaling factor in the vector projection.)
- id: trig-q-3307
  lesson: trig-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'If $\mathbf{u}\cdot\mathbf{v} < 0$ for nonzero vectors, the angle between them is'
  choices: ['acute', 'right', 'obtuse', 'zero']
  answer: 2
  explanation: |-
    $\mathbf{u}\cdot\mathbf{v} = \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert\cos\theta$ with positive magnitudes, so the sign is the sign of $\cos\theta$: negative for
    $90^\circ < \theta \le 180^\circ$.
- id: trig-q-3308
  lesson: trig-dot-product
  topic: Dot product
  stem: 'What is $\mathbf{v}\cdot\mathbf{v}$ equal to?'
  choices: ['$2\lVert\mathbf{v}\rVert$', '$\lVert\mathbf{v}\rVert$', '$1$', '$\lVert\mathbf{v}\rVert^2$']
  answer: 3
  explanation: |-
    $\mathbf{v}\cdot\mathbf{v} = v_1^2 + v_2^2 = \lVert\mathbf{v}\rVert^2$ (the angle between a vector and itself is 0).
- id: trig-q-3309
  lesson: trig-dot-product
  module_quiz: true
  topic: Dot product
  stem: 'Find the angle between $\langle 1, 0\rangle$ and $\langle -1, \sqrt3\rangle$.'
  choices: ['$60^\circ$', '$120^\circ$', '$150^\circ$', '$30^\circ$']
  answer: 1
  explanation: |-
    Dot product $-1$; magnitudes $1$ and $2$. $\cos\theta = -\tfrac12$, so $\theta = 120^\circ$.
- id: trig-q-3310
  lesson: trig-dot-product
  topic: Dot product
  stem: 'Find the angle between $\langle 2, 2\rangle$ and $\langle 3, 0\rangle$.'
  choices: ['$45^\circ$', '$30^\circ$', '$60^\circ$', '$90^\circ$']
  answer: 0
  explanation: |-
    $\cos\theta = \tfrac{6}{2\sqrt2 \cdot 3} = \tfrac{1}{\sqrt2}$, so $\theta = 45^\circ$. (The first vector lies on the line $y = x$.)
- id: trig-q-3311
  lesson: trig-dot-product
  topic: Dot product
  stem: 'Where does the formula $\mathbf{u}\cdot\mathbf{v} = \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert\cos\theta$ come from?'
  choices: ['The law of sines', 'The law of cosines applied to the triangle formed by $\mathbf{u}$, $\mathbf{v}$ and $\mathbf{u} - \mathbf{v}$', 'Heron''s formula', 'The definition of a unit vector']
  answer: 1
  explanation: |-
    Expanding $\lVert\mathbf{u} - \mathbf{v}\rVert^2 = (\mathbf{u} - \mathbf{v})\cdot(\mathbf{u} - \mathbf{v})$ and comparing with the law of cosines gives the formula.

- id: trig-q-3401
  lesson: trig-vector-apps
  module_quiz: true
  topic: Vector applications
  stem: 'Forces of 40 N at $0^\circ$ and 60 N at $50^\circ$ act on an object. What is the magnitude of the resultant?'
  choices: ['About 46.0 N', 'About 100 N', 'About 91.0 N', 'About 78.6 N']
  answer: 2
  explanation: |-
    $\mathbf{R} \approx \langle 40 + 38.57, 45.96\rangle = \langle 78.57, 45.96\rangle$, so $\lVert\mathbf{R}\rVert \approx 91.0$ N. Adding magnitudes (100 N) ignores direction;
    $46.0$ comes from the law of cosines with the wrong angle ($50^\circ$ instead of $130^\circ$).
- id: trig-q-3402
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'For the same forces (40 N at $0^\circ$, 60 N at $50^\circ$), what is the direction angle of the resultant?'
  choices: ['About $25.0^\circ$', 'About $30.3^\circ$', 'About $50.0^\circ$', 'About $59.7^\circ$']
  answer: 1
  explanation: |-
    $\tan^{-1}\!\left(\tfrac{45.96}{78.57}\right) \approx 30.3^\circ$. ($25^\circ$ is the plain average of the two directions, which ignores the different magnitudes.)
- id: trig-q-3403
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'An object is in equilibrium when'
  choices: ['all forces on it have equal magnitude', 'the vector sum of the forces on it is the zero vector', 'only one force acts on it', 'the forces are all perpendicular']
  answer: 1
  explanation: |-
    Equilibrium means no net force: the horizontal components cancel and the vertical components cancel.
- id: trig-q-3404
  lesson: trig-vector-apps
  module_quiz: true
  topic: Vector applications
  stem: 'A 500 lb cart is on a ramp inclined at $12^\circ$. Ignoring friction, what force parallel to the ramp keeps it from rolling down?'
  choices: ['About 489.1 lb', 'About 500 lb', 'About 106.3 lb', 'About 104.0 lb']
  answer: 3
  explanation: |-
    The component of the weight along the ramp is $500\sin 12^\circ \approx 104.0$ lb. $489.1 = 500\cos 12^\circ$ is the component into the ramp;
    $106.3 = 500\tan 12^\circ$ uses the wrong ratio.
- id: trig-q-3405
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'A plane has airspeed 300 mi/h on a heading of $040^\circ$, and a 40 mi/h wind blows from the west. What is the ground speed?'
  choices: ['About 340 mi/h', 'About 327 mi/h', 'About 300 mi/h', 'About 272 mi/h']
  answer: 1
  explanation: |-
    Air velocity $\approx \langle 192.84, 229.81\rangle$ (direction angle $50^\circ$); wind $\langle 40, 0\rangle$. Ground velocity $\langle 232.84, 229.81\rangle$,
    magnitude $\approx 327.1$ mi/h. 340 just adds the speeds.
- id: trig-q-3406
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'In that flight, the ground velocity is about $\langle 232.84, 229.81\rangle$ (east, north). What is the course as a bearing?'
  choices: ['About $044.6^\circ$', 'About $045.4^\circ$', 'About $040.0^\circ$', 'About $134.6^\circ$']
  answer: 1
  explanation: |-
    Direction angle $\tan^{-1}\!\left(\tfrac{229.81}{232.84}\right) \approx 44.63^\circ$; as a bearing, $90^\circ - 44.63^\circ \approx 45.4^\circ$. ($044.6^\circ$ forgets to convert.)
- id: trig-q-3407
  lesson: trig-vector-apps
  module_quiz: true
  topic: Vector applications
  stem: 'A 25 km/h wind "from the north" is written as which vector (east, north)?'
  choices: ['$\langle 0, 25\rangle$', '$\langle 25, 0\rangle$', '$\langle -25, 0\rangle$', '$\langle 0, -25\rangle$']
  answer: 3
  explanation: |-
    Winds are named for where they come from, so a north wind blows toward the south: $\langle 0, -25\rangle$.
- id: trig-q-3408
  lesson: trig-vector-apps
  module_quiz: true
  topic: Vector applications
  stem: 'A wagon is pulled 20 m with a 50 N force at $30^\circ$ above the horizontal. How much work is done?'
  choices: ['About 866 J', '1000 J', '500 J', 'About 577 J']
  answer: 0
  explanation: |-
    $W = \lVert\mathbf{F}\rVert\lVert\mathbf{D}\rVert\cos\theta = 50 \cdot 20\cos 30^\circ \approx 866$ J. Using sine gives 500 J.
- id: trig-q-3409
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'A force $\mathbf{F} = \langle 3, 4\rangle$ N moves an object from $(1, 1)$ to $(6, 2)$ (meters). How much work is done?'
  choices: ['$31$ J', '$25$ J', '$19$ J', '$35$ J']
  answer: 2
  explanation: |-
    $\mathbf{D} = \langle 5, 1\rangle$ and $W = \mathbf{F}\cdot\mathbf{D} = 15 + 4 = 19$ J.
- id: trig-q-3410
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'A heading (bearing) of $040^\circ$ corresponds to which direction angle (from the positive $x$-axis, counterclockwise)?'
  choices: ['$40^\circ$', '$130^\circ$', '$320^\circ$', '$50^\circ$']
  answer: 3
  explanation: |-
    Direction angle $= 90^\circ - \text{bearing} = 50^\circ$. Bearings start at north and go clockwise; direction angles start at east
    and go counterclockwise.
- id: trig-q-3411
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'Two perpendicular forces of 50 N each act on a point. What is the magnitude of the resultant?'
  choices: ['$100$ N', '$50\sqrt2 \approx 70.7$ N', '$50$ N', '$0$ N']
  answer: 1
  explanation: |-
    $\langle 50, 0\rangle + \langle 0, 50\rangle = \langle 50, 50\rangle$, magnitude $50\sqrt2$.
- id: trig-q-3412
  lesson: trig-vector-apps
  topic: Vector applications
  stem: 'A 100 lb sign hangs from cables at $30^\circ$ and $45^\circ$ to the horizontal. The tensions are about 73.2 lb and 89.7 lb. Which cable has the larger tension?'
  choices: ['The $45^\circ$ cable', 'The $30^\circ$ cable', 'They are equal', 'It depends on the cable lengths']
  answer: 0
  explanation: |-
    From $T_1\cos 30^\circ = T_2\cos 45^\circ$ and $T_1\sin 30^\circ + T_2\sin 45^\circ = 100$: $T_1 \approx 73.2$ lb (at $30^\circ$), $T_2 \approx 89.7$ lb (at $45^\circ$).
    The steeper cable carries more of the weight.
