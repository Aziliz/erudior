- id: trig-m8-r2-h27
  lesson: trig-m8-h-vector-geometry
  topic: Vector geometry
  stem: 'In the algebraic proof of Cauchy–Schwarz, why is the discriminant of $\lVert\mathbf{v}\rVert^2 t^2 - 2(\mathbf{u}\cdot\mathbf{v})t + \lVert\mathbf{u}\rVert^2$ at most 0?'
  choices: ['Because $\cos\theta$ is between $-1$ and $1$', 'Because $\mathbf{u}$ and $\mathbf{v}$ are perpendicular', 'Because the quadratic equals $\lVert\mathbf{u} - t\mathbf{v}\rVert^2$, which is never negative, so it has at most one real root', 'Because the coefficient of $t^2$ is positive']
  answer: 2
  explanation: |-
    The quadratic is a squared length, so it is never below zero; a parabola that opens up and never dips below the axis touches it at most once, so its discriminant $4(\mathbf{u}\cdot\mathbf{v})^2 - 4\lVert\mathbf{u}\rVert^2\lVert\mathbf{v}\rVert^2 \le 0$. A positive leading coefficient alone still allows two roots. The point of this proof is to avoid using $\cos\theta$, and nothing in it assumes perpendicular vectors.
- id: trig-m8-r2-h28
  lesson: trig-m8-h-vector-geometry
  topic: Vector geometry
  stem: 'In the proof of the triangle inequality, which step uses the Cauchy–Schwarz inequality?'
  choices: ['$\lVert\mathbf{u} + \mathbf{v}\rVert^2 = \lVert\mathbf{u}\rVert^2 + 2\,\mathbf{u}\cdot\mathbf{v} + \lVert\mathbf{v}\rVert^2$', '$\lVert\mathbf{u}\rVert^2 + 2\,\mathbf{u}\cdot\mathbf{v} + \lVert\mathbf{v}\rVert^2 \le \lVert\mathbf{u}\rVert^2 + 2\lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert + \lVert\mathbf{v}\rVert^2$', '$\lVert\mathbf{u}\rVert^2 + 2\lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert + \lVert\mathbf{v}\rVert^2 = (\lVert\mathbf{u}\rVert + \lVert\mathbf{v}\rVert)^2$', 'Taking square roots of both sides']
  answer: 1
  explanation: |-
    Replacing $\mathbf{u}\cdot\mathbf{v}$ by the larger $\lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert$ is exactly Cauchy–Schwarz ($\mathbf{u}\cdot\mathbf{v} \le |\mathbf{u}\cdot\mathbf{v}| \le \lVert\mathbf{u}\rVert\lVert\mathbf{v}\rVert$). The first step is expanding a dot product, the third is factoring a perfect square, and taking square roots is allowed because both sides are nonnegative.
