# Module 5: Inverse functions and basic equations
- id: trig-q-1801
  lesson: trig-inverse
  module_quiz: true
  topic: Inverse trig functions
  stem: 'Evaluate $\sin^{-1}\!\left(-\tfrac12\right)$.'
  choices: ['$\tfrac{11\pi}{6}$', '$-\tfrac{\pi}{6}$', '$\tfrac{7\pi}{6}$', '$-\tfrac{\pi}{3}$']
  answer: 1
  explanation: |-
    The answer must lie in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$. The reference angle is $\tfrac{\pi}{6}$ and the sine is
    negative, so $-\tfrac{\pi}{6}$. $\tfrac{11\pi}{6}$ and $\tfrac{7\pi}{6}$ have sine $-\tfrac12$ but are outside the range.
- id: trig-q-1802
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Evaluate $\cos^{-1}\!\left(-\tfrac{\sqrt2}{2}\right)$.'
  choices: ['$-\tfrac{\pi}{4}$', '$\tfrac{5\pi}{4}$', '$\tfrac{3\pi}{4}$', '$\tfrac{\pi}{4}$']
  answer: 2
  explanation: |-
    The range of $\cos^{-1}$ is $[0, \pi]$; a negative cosine means quadrant II. Reference angle $\tfrac{\pi}{4}$:
    $\pi - \tfrac{\pi}{4} = \tfrac{3\pi}{4}$. $-\tfrac{\pi}{4}$ would be the $\sin^{-1}$-style answer, outside $[0, \pi]$.
- id: trig-q-1803
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Evaluate $\tan^{-1}(-\sqrt3)$.'
  choices: ['$-\tfrac{\pi}{3}$', '$\tfrac{2\pi}{3}$', '$-\tfrac{\pi}{6}$', '$\tfrac{5\pi}{3}$']
  answer: 0
  explanation: |-
    $\tan\tfrac{\pi}{3} = \sqrt3$, and the range $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$ puts a negative answer in quadrant IV:
    $-\tfrac{\pi}{3}$.
- id: trig-q-1804
  lesson: trig-inverse
  module_quiz: true
  topic: Inverse trig functions
  stem: 'What is the range of $y = \cos^{-1}x$?'
  choices: ['$\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$', '$[-1, 1]$', '$(0, \pi)$', '$[0, \pi]$']
  answer: 3
  explanation: |-
    Cosine is restricted to $[0, \pi]$, where it decreases from 1 to $-1$, so $\cos^{-1}$ returns angles in
    $[0, \pi]$. $[-1, 1]$ is its domain.
- id: trig-q-1805
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'What is $\sin^{-1}(2)$?'
  choices: ['$\tfrac{\pi}{2}$', 'About $0.5236$', 'Undefined', '$2\pi$']
  answer: 2
  explanation: |-
    No angle has sine 2, since $-1 \le \sin\theta \le 1$. The domain of $\sin^{-1}$ is $[-1, 1]$.
- id: trig-q-1806
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Evaluate $\cos^{-1}\!\left(-\tfrac12\right)$.'
  choices: ['$\tfrac{2\pi}{3}$', '$-\tfrac{\pi}{3}$', '$\tfrac{4\pi}{3}$', '$\tfrac{5\pi}{6}$']
  answer: 0
  explanation: |-
    In $[0, \pi]$, cosine is $-\tfrac12$ at $\pi - \tfrac{\pi}{3} = \tfrac{2\pi}{3}$. ($\tfrac{4\pi}{3}$ also has cosine $-\tfrac12$,
    but it's outside the range.)
- id: trig-q-1807
  lesson: trig-inverse
  module_quiz: true
  topic: Inverse trig functions
  stem: 'Which statement about $\sin^{-1}x$ is true?'
  choices: ['$\sin^{-1}x = \dfrac{1}{\sin x}$', '$\sin^{-1}x$ is defined for every real $x$', '$\sin^{-1}x = \csc x$', '$\sin^{-1}x$ is the angle in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ whose sine is $x$']
  answer: 3
  explanation: |-
    The $-1$ means inverse function. $\tfrac{1}{\sin x}$ is $\csc x$, a different thing. The domain of
    $\sin^{-1}$ is only $[-1, 1]$.
- id: trig-q-1808
  lesson: trig-inverse
  module_quiz: true
  topic: Inverse trig functions
  stem: 'To the nearest hundredth of a degree, what is $\cos^{-1}(-0.62)$?'
  choices: ['$51.68^\circ$', '$-51.68^\circ$', '$231.68^\circ$', '$128.32^\circ$']
  answer: 3
  explanation: |-
    $\cos^{-1}(-0.62) \approx 128.32^\circ$, an obtuse angle, as expected for a negative cosine.
    $51.68^\circ = \cos^{-1}(0.62)$, and $128.32 = 180 - 51.68$.
- id: trig-q-1809
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'To the nearest hundredth of a degree, what is $\tan^{-1}(4.5)$?'
  choices: ['$77.47^\circ$', '$12.53^\circ$', '$1.35^\circ$', '$257.47^\circ$']
  answer: 0
  explanation: |-
    In degree mode, $\tan^{-1}(4.5) \approx 77.47^\circ$ (in radians, $\approx 1.3521$). $12.53^\circ$ is $\tan^{-1}(1/4.5)$.
- id: trig-q-1810
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Why must the domain of sine be restricted before defining $\sin^{-1}$?'
  choices: ['Because sine is undefined at some points', 'Because sine is not one-to-one: many angles share each sine value', 'Because the range of sine is too small', 'Because calculators cannot handle large angles']
  answer: 1
  explanation: |-
    An inverse must send each output back to a single input. Sine repeats, so we keep only
    $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$, where each value in $[-1, 1]$ occurs exactly once.
- id: trig-q-1811
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Given $\cos^{-1}(0.4) \approx 1.1593$, what is $\cos^{-1}(-0.4)$?'
  choices: ['$-1.1593$', '$1.1593$', 'About $1.9823$', 'About $5.1239$']
  answer: 2
  explanation: |-
    $\cos^{-1}(-x) = \pi - \cos^{-1}x$, so $\pi - 1.1593 \approx 1.9823$. Unlike $\sin^{-1}$ and $\tan^{-1}$,
    $\cos^{-1}$ of a negative number is not negative.
- id: trig-q-1812
  lesson: trig-inverse
  topic: Inverse trig functions
  stem: 'Evaluate $\tan^{-1}1 + \sin^{-1}1$.'
  choices: ['$\tfrac{3\pi}{4}$', '$\tfrac{\pi}{2}$', '$\pi$', '$\tfrac{5\pi}{4}$']
  answer: 0
  explanation: |-
    $\tan^{-1}1 = \tfrac{\pi}{4}$ and $\sin^{-1}1 = \tfrac{\pi}{2}$; the sum is $\tfrac{3\pi}{4}$.

- id: trig-q-1901
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'Evaluate $\sin^{-1}\!\left(\sin\tfrac{5\pi}{6}\right)$.'
  choices: ['$\tfrac{5\pi}{6}$', '$\tfrac12$', '$-\tfrac{\pi}{6}$', '$\tfrac{\pi}{6}$']
  answer: 3
  explanation: |-
    $\tfrac{5\pi}{6}$ is outside $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$, so no cancellation. $\sin\tfrac{5\pi}{6} = \tfrac12$, and
    $\sin^{-1}\tfrac12 = \tfrac{\pi}{6}$.
- id: trig-q-1902
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\cos^{-1}\!\left(\cos\left(-\tfrac{\pi}{3}\right)\right)$.'
  choices: ['$-\tfrac{\pi}{3}$', '$\tfrac12$', '$\tfrac{2\pi}{3}$', '$\tfrac{\pi}{3}$']
  answer: 3
  explanation: |-
    $\cos\left(-\tfrac{\pi}{3}\right) = \tfrac12$ and $\cos^{-1}\tfrac12 = \tfrac{\pi}{3}$. The answer must be in $[0, \pi]$, so it
    can't be $-\tfrac{\pi}{3}$.
- id: trig-q-1903
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\tan^{-1}\!\left(\tan\tfrac{3\pi}{4}\right)$.'
  choices: ['$\tfrac{3\pi}{4}$', '$-1$', '$-\tfrac{\pi}{4}$', '$\tfrac{\pi}{4}$']
  answer: 2
  explanation: |-
    $\tan\tfrac{3\pi}{4} = -1$ and $\tan^{-1}(-1) = -\tfrac{\pi}{4}$, the angle in $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$ with tangent $-1$.
- id: trig-q-1904
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'Evaluate $\cos\!\left(\sin^{-1}\tfrac35\right)$.'
  choices: ['$\tfrac45$', '$\tfrac35$', '$-\tfrac45$', '$\tfrac34$']
  answer: 0
  explanation: |-
    Let $\theta = \sin^{-1}\tfrac35$ (quadrant I). Opposite 3, hypotenuse 5, adjacent 4, so $\cos\theta = \tfrac45$.
    $\tfrac34$ is $\tan\theta$.
- id: trig-q-1905
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\tan\!\left(\cos^{-1}\!\left(-\tfrac{5}{13}\right)\right)$.'
  choices: ['$\tfrac{12}{5}$', '$-\tfrac{5}{12}$', '$-\tfrac{12}{13}$', '$-\tfrac{12}{5}$']
  answer: 3
  explanation: |-
    $\theta = \cos^{-1}\!\left(-\tfrac{5}{13}\right)$ is in quadrant II: $x = -5$, $r = 13$, $y = 12$. Then
    $\tan\theta = \tfrac{12}{-5} = -\tfrac{12}{5}$. Forgetting the quadrant gives $\tfrac{12}{5}$.
- id: trig-q-1906
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\sec\!\left(\tan^{-1}\!\left(-\tfrac{7}{24}\right)\right)$.'
  choices: ['$-\tfrac{25}{24}$', '$\tfrac{25}{24}$', '$\tfrac{25}{7}$', '$-\tfrac{25}{7}$']
  answer: 1
  explanation: |-
    $\theta$ is in quadrant IV, where $x > 0$: $x = 24$, $y = -7$, $r = 25$. $\sec\theta = \tfrac{r}{x} = \tfrac{25}{24}$,
    positive because cosine is positive in quadrant IV.
- id: trig-q-1907
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'Which algebraic expression equals $\sin(\tan^{-1}x)$?'
  choices: ['$\dfrac{1}{\sqrt{1 + x^2}}$', '$\dfrac{x}{\sqrt{1 - x^2}}$', '$\sqrt{1 - x^2}$', '$\dfrac{x}{\sqrt{1 + x^2}}$']
  answer: 3
  explanation: |-
    With $\tan\theta = \tfrac{x}{1}$: opposite $x$, adjacent 1, hypotenuse $\sqrt{1 + x^2}$. So
    $\sin\theta = \tfrac{x}{\sqrt{1 + x^2}}$. $\tfrac{1}{\sqrt{1 + x^2}}$ is $\cos(\tan^{-1}x)$.
- id: trig-q-1908
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'Which algebraic expression equals $\cos(\sin^{-1}x)$ for $-1 \le x \le 1$?'
  choices: ['$\sqrt{1 - x^2}$', '$-\sqrt{1 - x^2}$', '$\pm\sqrt{1 - x^2}$', '$\sqrt{1 + x^2}$']
  answer: 0
  explanation: |-
    The angle $\sin^{-1}x$ lies in quadrant I or IV, where cosine is non-negative, so the positive
    root is the only correct choice.
- id: trig-q-1909
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\sec^{-1}2$.'
  choices: ['$\tfrac{\pi}{6}$', '$\tfrac{1}{\cos^{-1}2}$', '$\tfrac{\pi}{3}$', 'Undefined']
  answer: 2
  explanation: |-
    $\sec^{-1}2 = \cos^{-1}\tfrac12 = \tfrac{\pi}{3}$. ($\cos^{-1}2$ is undefined, so $\tfrac{1}{\cos^{-1}2}$
    makes no sense.)
- id: trig-q-1910
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Using the range $(0, \pi)$ for $\cot^{-1}$, what is $\cot^{-1}(-2)$ to four decimals?'
  choices: ['$-0.4636$', '$2.6779$', '$2.0344$', '$-1.1071$']
  answer: 1
  explanation: |-
    $\cot^{-1}x = \tfrac{\pi}{2} - \tan^{-1}x = 1.5708 - (-1.1071) = 2.6779$. Computing $\tan^{-1}\!\left(-\tfrac12\right) \approx -0.4636$
    gives an angle outside $(0, \pi)$; $2.0344$ has cotangent $-0.5$, not $-2$.
- id: trig-q-1911
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Which expression is undefined?'
  choices: ['$\sin(\sin^{-1}0.42)$', '$\cos(\cos^{-1}(-0.9))$', '$\tan(\tan^{-1}50)$', '$\sin(\sin^{-1}3)$']
  answer: 3
  explanation: |-
    $\sin^{-1}3$ doesn't exist, so neither does the composition. The others cancel to $0.42$, $-0.9$
    and $50$.
- id: trig-q-1912
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\sin^{-1}(\sin 3)$, where 3 is in radians.'
  choices: ['$3$', '$\pi - 3 \approx 0.1416$', '$3 - \pi$', '$\sin 3 \approx 0.1411$']
  answer: 1
  explanation: |-
    3 is outside $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$. The angle in that range with the same sine is the supplement-style
    angle $\pi - 3$ (since $\sin(\pi - x) = \sin x$), about $0.1416$.
- id: trig-q-1913
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'Solve $3\cos^{-1}x = \pi$.'
  choices: ['$x = \tfrac12$', '$x = -1$', '$x = \tfrac{\pi}{3}$', '$x = \tfrac{\sqrt3}{2}$']
  answer: 0
  explanation: |-
    Isolate the inverse function: $\cos^{-1}x = \tfrac{\pi}{3}$, which is in $[0, \pi]$, so a solution exists. Apply cosine: $x = \cos\tfrac{\pi}{3} = \tfrac12$. Taking the cosine before dividing by 3 gives $\cos\pi = -1$; $\tfrac{\pi}{3}$ is the angle, not $x$; and $\tfrac{\sqrt3}{2}$ is $\sin\tfrac{\pi}{3}$, the wrong function.
- id: trig-q-1914
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Which equation has no solution?'
  choices: ['$\cos^{-1}x = \tfrac{2\pi}{3}$', '$\sin^{-1}x = \tfrac{2\pi}{3}$', '$\tan^{-1}x = -\tfrac{\pi}{3}$', '$\sin^{-1}x = -\tfrac{\pi}{4}$']
  answer: 1
  explanation: |-
    $\sin^{-1}$ only returns angles in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$, and $\tfrac{2\pi}{3}$ is outside it, so $\sin^{-1}x = \tfrac{2\pi}{3}$ has no solution. Applying sine anyway gives $x = \tfrac{\sqrt3}{2}$, but $\sin^{-1}\tfrac{\sqrt3}{2} = \tfrac{\pi}{3}$, so that check fails. The others are in range: $\cos^{-1}x = \tfrac{2\pi}{3}$ gives $x = -\tfrac12$ (the range of $\cos^{-1}$ is $[0, \pi]$), $\tan^{-1}x = -\tfrac{\pi}{3}$ gives $x = -\sqrt3$, and $\sin^{-1}x = -\tfrac{\pi}{4}$ gives $x = -\tfrac{\sqrt2}{2}$.
- id: trig-q-1915
  lesson: trig-inverse-comp
  module_quiz: true
  topic: Inverse compositions
  stem: 'If $\sin^{-1}x = 0.3$ (radians), what is $\cos^{-1}x$?'
  choices: ['$0.3$', '$\pi - 0.3 \approx 2.8416$', '$\tfrac{\pi}{2} - 0.3 \approx 1.2708$', '$\cos 0.3 \approx 0.9553$']
  answer: 2
  explanation: |-
    For every $x$ in $[-1, 1]$, $\sin^{-1}x + \cos^{-1}x = \tfrac{\pi}{2}$, so $\cos^{-1}x = \tfrac{\pi}{2} - 0.3 \approx 1.2708$. The two angles are complementary, not equal ($0.3$) and not supplementary ($\pi - 0.3$). $\cos 0.3$ is the cosine of the angle, which is a ratio, not the angle $\cos^{-1}x$.
- id: trig-q-1916
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Evaluate $\sin^{-1}0.37 + \cos^{-1}0.37$ exactly.'
  choices: ['$1$', '$\pi$', '$0.74$', '$\tfrac{\pi}{2}$']
  answer: 3
  explanation: |-
    If $\theta = \sin^{-1}0.37$, then $\tfrac{\pi}{2} - \theta$ is in $[0, \pi]$ and has cosine $\sin\theta = 0.37$, so it is $\cos^{-1}0.37$. The sum is $\tfrac{\pi}{2}$ (numerically $0.3790 + 1.1918 = 1.5708$). The value 1 confuses this with $\sin^2\theta + \cos^2\theta = 1$, $\pi$ treats the angles as supplementary, and $0.74$ just adds the inputs.
- id: trig-q-1917
  lesson: trig-inverse-comp
  topic: Inverse compositions
  stem: 'Solve $y = 2\tan^{-1}\tfrac{x}{5}$ for $x$ (for $-\pi < y < \pi$).'
  choices: ['$x = \tfrac52\tan y$', '$x = \tfrac15\tan\tfrac{y}{2}$', '$x = 5\tan\tfrac{y}{2}$', '$x = 2\tan\tfrac{y}{5}$']
  answer: 2
  explanation: |-
    Divide by 2 first: $\tfrac{y}{2} = \tan^{-1}\tfrac{x}{5}$. Apply tangent: $\tfrac{x}{5} = \tan\tfrac{y}{2}$, so $x = 5\tan\tfrac{y}{2}$. Taking the tangent before dividing by 2 leads to $\tfrac52\tan y$; dividing by 5 instead of multiplying gives $\tfrac15\tan\tfrac{y}{2}$; and $2\tan\tfrac{y}{5}$ swaps the two constants.

- id: trig-q-2001
  lesson: trig-basic-equations
  module_quiz: true
  topic: Trig equations
  stem: 'What is the general solution of $\sin x = \tfrac12$?'
  choices: ['$x = \tfrac{\pi}{6} + 2k\pi$ only', '$x = \pm\tfrac{\pi}{6} + 2k\pi$', '$x = \tfrac{\pi}{6} + k\pi$', '$x = \tfrac{\pi}{6} + 2k\pi$ or $x = \tfrac{5\pi}{6} + 2k\pi$']
  answer: 3
  explanation: |-
    The line $y = \tfrac12$ meets the unit circle at $\tfrac{\pi}{6}$ and $\pi - \tfrac{\pi}{6} = \tfrac{5\pi}{6}$; add $2k\pi$ to each.
    The $\pm$ form is for cosine equations.
- id: trig-q-2002
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $2\cos x + \sqrt3 = 0$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{6}, \tfrac{11\pi}{6}$', '$\tfrac{5\pi}{6}, \tfrac{7\pi}{6}$', '$\tfrac{2\pi}{3}, \tfrac{4\pi}{3}$', '$\tfrac{5\pi}{6}, \tfrac{11\pi}{6}$']
  answer: 1
  explanation: |-
    $\cos x = -\tfrac{\sqrt3}{2}$: reference angle $\tfrac{\pi}{6}$, cosine negative in quadrants II and III, so
    $\tfrac{5\pi}{6}$ and $\tfrac{7\pi}{6}$. ($\tfrac{2\pi}{3}, \tfrac{4\pi}{3}$ solve $\cos x = -\tfrac12$.)
- id: trig-q-2003
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $3\tan\theta - 4 = 0$ for $0^\circ \le \theta < 360^\circ$.'
  choices: ['$53.13^\circ$ only', '$53.13^\circ$ and $126.87^\circ$', '$53.13^\circ$ and $233.13^\circ$', '$36.87^\circ$ and $216.87^\circ$']
  answer: 2
  explanation: |-
    $\tan\theta = \tfrac43$ gives $\theta \approx 53.13^\circ$; tangent repeats every $180^\circ$, giving $233.13^\circ$.
    $126.87^\circ$ would be the second solution of a sine equation.
- id: trig-q-2004
  lesson: trig-basic-equations
  module_quiz: true
  topic: Trig equations
  stem: 'Solve $\cos x = 0.3$ on $[0, 2\pi)$, to four decimals.'
  choices: ['$1.2661$ and $1.8755$', '$1.2661$ only', '$1.2661$ and $4.4077$', '$1.2661$ and $5.0171$']
  answer: 3
  explanation: |-
    $\cos^{-1}0.3 \approx 1.2661$ is in quadrant I; the other solution with positive cosine is in quadrant IV:
    $2\pi - 1.2661 \approx 5.0171$. ($1.8755 = \pi - 1.2661$ is the sine-equation pattern.)
- id: trig-q-2005
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'How many solutions does $\sin 2x = \tfrac{\sqrt3}{2}$ have in $[0, 2\pi)$?'
  choices: ['2', '4', '1', '8']
  answer: 1
  explanation: |-
    $2x = \tfrac{\pi}{3} + 2k\pi$ or $\tfrac{2\pi}{3} + 2k\pi$, so $x = \tfrac{\pi}{6} + k\pi$ or $\tfrac{\pi}{3} + k\pi$. With $k = 0, 1$:
    $\tfrac{\pi}{6}, \tfrac{\pi}{3}, \tfrac{7\pi}{6}, \tfrac{4\pi}{3}$, four solutions.
- id: trig-q-2006
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $2\sin^2 x - \sin x - 1 = 0$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{2}, \tfrac{7\pi}{6}, \tfrac{11\pi}{6}$', '$\tfrac{\pi}{2}, \tfrac{\pi}{6}, \tfrac{5\pi}{6}$', '$\tfrac{3\pi}{2}, \tfrac{7\pi}{6}, \tfrac{11\pi}{6}$', '$\tfrac{\pi}{2}$ only']
  answer: 0
  explanation: |-
    $(2\sin x + 1)(\sin x - 1) = 0$. $\sin x = 1$ gives $\tfrac{\pi}{2}$; $\sin x = -\tfrac12$ gives $\tfrac{7\pi}{6}$ and $\tfrac{11\pi}{6}$.
    The answer $\tfrac{\pi}{2}, \tfrac{\pi}{6}, \tfrac{5\pi}{6}$ uses $\sin x = +\tfrac12$ (a sign error in factoring).
- id: trig-q-2007
  lesson: trig-basic-equations
  module_quiz: true
  topic: Trig equations
  stem: 'What is the general solution of $\tan x = 1$?'
  choices: ['$x = \tfrac{\pi}{4} + 2k\pi$', '$x = \tfrac{\pi}{4} + k\pi$', '$x = \pm\tfrac{\pi}{4} + 2k\pi$', '$x = \tfrac{\pi}{4} + \tfrac{k\pi}{2}$']
  answer: 1
  explanation: |-
    Tangent has period $\pi$ and one solution per period: $x = \tan^{-1}1 + k\pi = \tfrac{\pi}{4} + k\pi$
    (this covers both $\tfrac{\pi}{4}$ and $\tfrac{5\pi}{4}$).
- id: trig-q-2008
  lesson: trig-basic-equations
  module_quiz: true
  topic: Trig equations
  stem: 'A student solves $\sin x\cos x = \sin x$ on $[0, 2\pi)$ by dividing both sides by $\sin x$, getting $\cos x = 1$, so $x = 0$. Which solution(s) did the student lose?'
  choices: ['None; $x = 0$ is the only solution', '$x = \tfrac{\pi}{2}$', '$x = \pi$', '$x = \tfrac{\pi}{2}$ and $x = \tfrac{3\pi}{2}$']
  answer: 2
  explanation: |-
    Factor instead: $\sin x(\cos x - 1) = 0$. $\sin x = 0$ gives $0$ and $\pi$; $\cos x = 1$ gives $0$. The
    solutions are $0$ and $\pi$; dividing by $\sin x$ lost $\pi$.
- id: trig-q-2009
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'How many solutions does $\cos x = 2$ have?'
  choices: ['None', 'One per period', 'Two per period', 'Infinitely many, one at each multiple of $\pi$']
  answer: 0
  explanation: |-
    The range of cosine is $[-1, 1]$, so $\cos x$ never equals 2.
- id: trig-q-2010
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $2\sin\theta + 1 = 0$ for $0^\circ \le \theta < 360^\circ$.'
  choices: ['$30^\circ, 150^\circ$', '$210^\circ, 330^\circ$', '$240^\circ, 300^\circ$', '$150^\circ, 210^\circ$']
  answer: 1
  explanation: |-
    $\sin\theta = -\tfrac12$: reference angle $30^\circ$, sine negative in quadrants III and IV, so
    $180^\circ + 30^\circ = 210^\circ$ and $360^\circ - 30^\circ = 330^\circ$.
- id: trig-q-2011
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $\cos\tfrac{x}{2} = \tfrac12$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{6}$ and $\tfrac{5\pi}{6}$', '$\tfrac{2\pi}{3}$ and $\tfrac{10\pi}{3}$', '$\tfrac{\pi}{3}$ and $\tfrac{5\pi}{3}$', '$\tfrac{2\pi}{3}$ only']
  answer: 3
  explanation: |-
    $x \in [0, 2\pi)$ means $\tfrac{x}{2} \in [0, \pi)$. There, $\cos u = \tfrac12$ only at $u = \tfrac{\pi}{3}$, so $x = \tfrac{2\pi}{3}$.
    ($\tfrac{10\pi}{3}$ is outside the interval.)
- id: trig-q-2012
  lesson: trig-basic-equations
  topic: Trig equations
  stem: 'Solve $\tan^2 x = 3$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{\pi}{3}, \tfrac{4\pi}{3}$', '$\tfrac{\pi}{3}, \tfrac{2\pi}{3}, \tfrac{4\pi}{3}, \tfrac{5\pi}{3}$', '$\tfrac{\pi}{6}, \tfrac{5\pi}{6}, \tfrac{7\pi}{6}, \tfrac{11\pi}{6}$', '$\tfrac{\pi}{3}$ only']
  answer: 1
  explanation: |-
    $\tan x = \pm\sqrt3$. $\tan x = \sqrt3$ at $\tfrac{\pi}{3}, \tfrac{4\pi}{3}$; $\tan x = -\sqrt3$ at $\tfrac{2\pi}{3}, \tfrac{5\pi}{3}$.
    Forgetting the negative root loses half the solutions.
