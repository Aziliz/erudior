# Round 2, module trig-m6 (Identities and equations): new question types for the core lessons,
# and questions for the honors lessons 27h1, 27h2, 27h3.

# ---------- Lesson 21: fundamental identities ----------
- id: trig-m6-r2-q01
  lesson: trig-fundamental-ids
  type: label
  module_quiz: true
  topic: Fundamental identities
  stem: 'Each triangle has an acute angle $x$. Name the numbered sides.'
  image: {src: images/trig-m6-three-triangles-blank.svg, alt: 'Three similar right triangles with an acute angle x. The first has hypotenuse 1, the second has adjacent side 1, the third has opposite side 1. Six other sides are numbered.'}
  labels:
    - {x: 13.3, y: 71.1, text: cos x}
    - {x: 20.9, y: 55.1, text: sin x}
    - {x: 50.2, y: 51.5, text: tan x}
    - {x: 40.9, y: 51.5, text: sec x}
    - {x: 74.2, y: 71.1, text: cot x}
    - {x: 74.2, y: 43.1, text: csc x}
  explanation: |-
    In the first triangle the hypotenuse is 1, so the legs are $\cos x$ (adjacent) and $\sin x$ (opposite). Scaling it by $\tfrac{1}{\cos x}$ makes the adjacent side 1, the opposite side $\tfrac{\sin x}{\cos x} = \tan x$ and the hypotenuse $\tfrac{1}{\cos x} = \sec x$. Scaling by $\tfrac{1}{\sin x}$ instead makes the opposite side 1, the adjacent side $\cot x$ and the hypotenuse $\csc x$. The Pythagorean theorem in each triangle gives the three Pythagorean identities.
- id: trig-m6-r2-q02
  lesson: trig-fundamental-ids
  type: text
  topic: Fundamental identities
  stem: '$\sin\theta = \tfrac35$ and $\theta$ is in quadrant II. Then $\cos\theta =$ ___. (Give an exact fraction or a decimal.)'
  accept: ['-4/5', '-0.8']
  explanation: |-
    $\cos^2\theta = 1 - \tfrac{9}{25} = \tfrac{16}{25}$, so $\cos\theta = \pm\tfrac45$. Cosine is negative in quadrant II, so $\cos\theta = -\tfrac45$.
- id: trig-m6-r2-q03
  lesson: trig-fundamental-ids
  type: match
  topic: Fundamental identities
  stem: 'Match each identity to its family.'
  pairs:
    - ['$\csc x = \dfrac{1}{\sin x}$', Reciprocal]
    - ['$\tan x = \dfrac{\sin x}{\cos x}$', Quotient]
    - ['$1 + \cot^2 x = \csc^2 x$', Pythagorean]
    - ['$\cos(-x) = \cos x$', Even-odd]
    - ['$\sin\left(\tfrac{\pi}{2} - x\right) = \cos x$', Cofunction]
  distractors: [Double-angle]
  explanation: |-
    Reciprocal identities flip a function; quotient identities write tangent and cotangent as ratios of sine and cosine; Pythagorean identities come from $\sin^2 x + \cos^2 x = 1$; even-odd identities say what happens to $-x$; cofunction identities pair a function with its co-function at the complementary angle.
- id: trig-m6-r2-q04
  lesson: trig-fundamental-ids
  topic: Fundamental identities
  stem: 'Which expressions equal 1 for every $x$ where they are defined? Select all that apply.'
  choices:
    - '$\sec^2 x - \tan^2 x$'
    - '$\sin x + \cos x$'
    - '$\csc^2 x - \cot^2 x$'
    - '$\tan x\cot x$'
    - '$\cos^2 x - \sin^2 x$'
  answer: [0, 2, 3]
  explanation: |-
    $\sec^2 x - \tan^2 x = 1$ and $\csc^2 x - \cot^2 x = 1$ are rearranged Pythagorean identities, and $\tan x\cot x = \tan x\cdot\tfrac{1}{\tan x} = 1$. But $\sin x + \cos x$ is $\sqrt2$ at $\tfrac{\pi}{4}$ (the squares are missing), and $\cos^2 x - \sin^2 x$ is $0$ at $\tfrac{\pi}{4}$ (it equals $\cos 2x$, Lesson 24).
- id: trig-m6-r2-q05
  lesson: trig-fundamental-ids
  type: order
  module_quiz: true
  topic: Fundamental identities
  stem: '$\cos\theta = -\tfrac{5}{13}$ and $\theta$ is in quadrant II. Put the steps for finding $\csc\theta$ in order.'
  items:
    - 'Use $\sin^2\theta + \cos^2\theta = 1$: $\sin^2\theta = 1 - \tfrac{25}{169} = \tfrac{144}{169}$'
    - 'Take the square root: $\sin\theta = \pm\tfrac{12}{13}$'
    - 'Sine is positive in quadrant II: $\sin\theta = \tfrac{12}{13}$'
    - 'Take the reciprocal: $\csc\theta = \tfrac{13}{12}$'
  explanation: |-
    Pythagorean identity first, then the square root (which gives $\pm$), then the quadrant to fix the sign, and only then the reciprocal identity. Each step uses the result of the one before.

# ---------- Lesson 22: verifying identities ----------
- id: trig-m6-r2-q06
  lesson: trig-verifying
  type: order
  module_quiz: true
  topic: Verifying identities
  stem: 'Put the steps verifying $(1 - \sin x)(1 + \sin x)\sec^2 x = 1$ in order, starting from the left side.'
  items:
    - '$(1 - \sin x)(1 + \sin x)\sec^2 x$'
    - '$= (1 - \sin^2 x)\sec^2 x$'
    - '$= \cos^2 x\sec^2 x$'
    - '$= \cos^2 x\cdot\dfrac{1}{\cos^2 x} = 1$'
  explanation: |-
    Multiply the conjugates (difference of squares), replace $1 - \sin^2 x$ with $\cos^2 x$ (Pythagorean identity), then write $\sec^2 x$ as $\tfrac{1}{\cos^2 x}$ and cancel. Only the left side was changed.
- id: trig-m6-r2-q07
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'You are verifying an identity by working on the left side only. Which of these are valid steps? Select all that apply.'
  choices:
    - 'Multiplying the left side by $\dfrac{1 + \sin x}{1 + \sin x}$'
    - 'Replacing $1 - \cos^2 x$ with $\sin^2 x$'
    - 'Squaring both sides of the equation'
    - 'Multiplying both sides by $\cos x$'
    - 'Rewriting $\tan x$ as $\dfrac{\sin x}{\cos x}$'
  answer: [0, 1, 4]
  explanation: |-
    Multiplying by a fraction equal to 1 and replacing an expression by an identical one keep the left side's value, so they are valid. Squaring or multiplying both sides treats the equation as already true, which is what you are trying to prove; squaring can even turn a false statement such as $-1 = 1$ into a true one.
- id: trig-m6-r2-q08
  lesson: trig-verifying
  type: text
  topic: Verifying identities
  stem: 'To simplify a fraction with denominator $1 - \sin x$, you multiply top and bottom by $1 + \sin x$, which is called the ___ of $1 - \sin x$.'
  accept: [conjugate, the conjugate, its conjugate]
  explanation: |-
    $1 + \sin x$ is the conjugate of $1 - \sin x$. Their product is $1 - \sin^2 x = \cos^2 x$, a single term, which is why the trick works.
- id: trig-m6-r2-q09
  lesson: trig-verifying
  type: match
  topic: Verifying identities
  stem: 'Match each expression to the simpler expression it equals.'
  pairs:
    - ['$\dfrac{\tan^2 x}{\sec x + 1}$', sec x − 1]
    - ['$(1 + \cot^2 x)(1 - \cos^2 x)$', '1']
    - ['$\csc x - \sin x$', cos x cot x]
    - ['$\sec x - \cos x$', sin x tan x]
  distractors: [tan x]
  explanation: |-
    $\tfrac{\tan^2 x}{\sec x + 1} = \tfrac{(\sec x - 1)(\sec x + 1)}{\sec x + 1} = \sec x - 1$. $(1 + \cot^2 x)(1 - \cos^2 x) = \csc^2 x\sin^2 x = 1$. $\csc x - \sin x = \tfrac{1 - \sin^2 x}{\sin x} = \tfrac{\cos^2 x}{\sin x} = \cos x\cot x$. $\sec x - \cos x = \tfrac{1 - \cos^2 x}{\cos x} = \tfrac{\sin^2 x}{\cos x} = \sin x\tan x$.
- id: trig-m6-r2-q10
  lesson: trig-verifying
  topic: Verifying identities
  stem: 'A student tests $\cos x = \sqrt{1 - \sin^2 x}$ at $x = 0$ and $x = \tfrac{\pi}{3}$, and both sides agree each time. What should the student conclude?'
  choices:
    - 'It is an identity, because two different values agree'
    - 'It is not an identity: at $x = \pi$ the left side is $-1$ and the right side is $1$'
    - 'It is an identity, because it comes from $\sin^2 x + \cos^2 x = 1$'
    - 'It is true only at $x = 0$ and $x = \tfrac{\pi}{3}$'
  answer: 1
  explanation: |-
    Agreement at a few points proves nothing. The square root is never negative, but $\cos x$ is negative in quadrants II and III; at $x = \pi$ the sides are $-1$ and $1$. One counterexample disproves an identity. (The equation is true whenever $\cos x \ge 0$, so it holds at many more points than the two tested.)

# ---------- Lesson 23: sum and difference formulas ----------
- id: trig-m6-r2-q11
  lesson: trig-sum-difference
  type: label
  module_quiz: true
  topic: Sum and difference formulas
  stem: 'In this rectangle proof of the sum formulas, $OP = 1$, $OQ = \cos\beta$ and $QP = \sin\beta$. Name the numbered lengths.'
  image: {src: images/trig-m6-sum-rectangle-blank.svg, alt: 'A rectangle with corners O, R, S and T containing three right triangles: OQR with angle alpha at O, OQP with angle beta at O and hypotenuse 1, and QSP with angle alpha at Q. Four segments are numbered: the bottom OR, the lower right side RQ, the upper right side QS, and the top piece SP.'}
  labels:
    - {x: 45.9, y: 91.9, text: cos α cos β}
    - {x: 67.7, y: 73.8, text: sin α cos β}
    - {x: 67.7, y: 33.7, text: cos α sin β}
    - {x: 58.9, y: 11.8, text: sin α sin β}
  distractors: [cos(α − β), sin β cos β]
  explanation: |-
    Triangle $OQR$ has hypotenuse $\cos\beta$ and angle $\alpha$, so $OR = \cos\alpha\cos\beta$ and $RQ = \sin\alpha\cos\beta$. Triangle $QSP$ has hypotenuse $\sin\beta$ and angle $\alpha$ at $Q$, so $QS = \cos\alpha\sin\beta$ (adjacent) and $SP = \sin\alpha\sin\beta$ (opposite). The right side gives $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$; the top gives $\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$.
- id: trig-m6-r2-q12
  lesson: trig-sum-difference
  type: text
  topic: Sum and difference formulas
  stem: 'Find the exact value of $\sin 15^\circ\cos 75^\circ + \cos 15^\circ\sin 75^\circ$. Give only the number.'
  accept: ['1']
  explanation: |-
    The pattern is $\sin\alpha\cos\beta + \cos\alpha\sin\beta = \sin(\alpha + \beta)$ with $\alpha = 15^\circ$, $\beta = 75^\circ$, so the value is $\sin 90^\circ = 1$.
- id: trig-m6-r2-q13
  lesson: trig-sum-difference
  topic: Sum and difference formulas
  stem: 'Which expressions equal $\cos(\alpha + \beta)$ for all angles $\alpha$, $\beta$? Select all that apply.'
  choices:
    - '$\cos\alpha\cos\beta - \sin\alpha\sin\beta$'
    - '$\cos\alpha + \cos\beta$'
    - '$\cos\alpha\cos\beta + \sin\alpha\sin\beta$'
    - '$\cos(\beta + \alpha)$'
    - '$\sin\left(\tfrac{\pi}{2} - \alpha - \beta\right)$'
  answer: [0, 3, 4]
  explanation: |-
    The cosine sum formula has a minus sign: $\cos\alpha\cos\beta - \sin\alpha\sin\beta$. Order inside the parentheses does not matter, and the cofunction identity gives $\sin\left(\tfrac{\pi}{2} - (\alpha + \beta)\right) = \cos(\alpha + \beta)$. With a plus sign you get $\cos(\alpha - \beta)$, and $\cos\alpha + \cos\beta$ is the "distributing" mistake.
- id: trig-m6-r2-q14
  lesson: trig-sum-difference
  type: match
  topic: Sum and difference formulas
  stem: 'Match each value to its exact form.'
  pairs:
    - ['$\sin 75^\circ$', (√6 + √2)/4]
    - ['$\cos 75^\circ$', (√6 − √2)/4]
    - ['$\tan 75^\circ$', 2 + √3]
    - ['$\tan 15^\circ$', 2 − √3]
  distractors: [(√2 − √6)/4]
  explanation: |-
    $\sin 75^\circ = \sin(45^\circ + 30^\circ) = \tfrac{\sqrt6 + \sqrt2}{4} \approx 0.966$ and $\cos 75^\circ = \cos(45^\circ + 30^\circ) = \tfrac{\sqrt6 - \sqrt2}{4} \approx 0.259$. $\tan 15^\circ = \tan(45^\circ - 30^\circ) = 2 - \sqrt3 \approx 0.268$, and $\tan 75^\circ$ is its reciprocal, $2 + \sqrt3 \approx 3.732$. The leftover $\tfrac{\sqrt2 - \sqrt6}{4}$ is negative; it is $\cos 105^\circ$.
- id: trig-m6-r2-q15
  lesson: trig-sum-difference
  type: order
  module_quiz: true
  topic: Sum and difference formulas
  stem: 'Put the steps for finding the exact value of $\sin 105^\circ$ in order.'
  items:
    - 'Write $105^\circ = 60^\circ + 45^\circ$'
    - 'Use $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$'
    - 'Substitute: $\tfrac{\sqrt3}{2}\cdot\tfrac{\sqrt2}{2} + \tfrac12\cdot\tfrac{\sqrt2}{2}$'
    - 'Simplify: $\tfrac{\sqrt6 + \sqrt2}{4}$'
  explanation: |-
    Split the angle into special angles, choose the matching formula, substitute the exact values, and simplify. Check: $\tfrac{2.449 + 1.414}{4} \approx 0.966 = \sin 105^\circ$.

# ---------- Lesson 24: double-angle and power-reducing ----------
- id: trig-m6-r2-q16
  lesson: trig-double-angle
  type: text
  module_quiz: true
  topic: Double-angle formulas
  stem: '$\cos\theta = \tfrac45$. Then $\cos 2\theta =$ ___. (Give an exact fraction or a decimal.)'
  accept: ['7/25', '0.28']
  explanation: |-
    Only $\cos\theta$ is known, so use $\cos 2\theta = 2\cos^2\theta - 1 = 2\cdot\tfrac{16}{25} - 1 = \tfrac{7}{25}$. No square root, so the quadrant of $\theta$ does not matter.
- id: trig-m6-r2-q17
  lesson: trig-double-angle
  type: match
  topic: Double-angle formulas
  stem: 'Match each expression to the expression it equals.'
  pairs:
    - ['$2\sin x\cos x$', sin 2x]
    - ['$1 - 2\sin^2 x$', cos 2x]
    - ['$\dfrac{2\tan x}{1 - \tan^2 x}$', tan 2x]
    - ['$\dfrac{1 + \cos 2x}{2}$', cos² x]
    - ['$\dfrac{1 - \cos 2x}{2}$', sin² x]
  distractors: [2 sin x]
  explanation: |-
    The first three are the double-angle formulas. The last two are the power-reducing formulas: $\sin^2$ goes with the minus sign and $\cos^2$ with the plus sign (check at $x = 0$: $\sin^2 0 = 0 = \tfrac{1 - 1}{2}$). $2\sin x$ matches nothing; $\sin 2x \ne 2\sin x$.
- id: trig-m6-r2-q18
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: '$\sin\theta = -\tfrac35$ and $\theta$ is in quadrant IV. Which statements are true? Select all that apply.'
  choices:
    - '$\sin 2\theta = -\tfrac{24}{25}$'
    - '$\cos 2\theta = \tfrac{7}{25}$'
    - '$\tan 2\theta = \tfrac{24}{7}$'
    - '$2\theta$ is in quadrant III'
    - '$\cos 2\theta = -\tfrac{7}{25}$'
  answer: [0, 1]
  explanation: |-
    $\cos\theta = \tfrac45$ (positive in quadrant IV). Then $\sin 2\theta = 2\left(-\tfrac35\right)\left(\tfrac45\right) = -\tfrac{24}{25}$ and $\cos 2\theta = 1 - 2\cdot\tfrac{9}{25} = \tfrac{7}{25}$, so $\tan 2\theta = -\tfrac{24}{7}$. Sine negative and cosine positive put $2\theta$ in quadrant IV, not III.
- id: trig-m6-r2-q19
  lesson: trig-double-angle
  type: order
  module_quiz: true
  topic: Double-angle formulas
  stem: 'Put the steps of the derivation of $\cos 3x = 4\cos^3 x - 3\cos x$ in order.'
  items:
    - 'Write $\cos 3x = \cos(2x + x)$'
    - 'Apply the sum formula: $\cos 2x\cos x - \sin 2x\sin x$'
    - 'Substitute $\cos 2x = 2\cos^2 x - 1$ and $\sin 2x = 2\sin x\cos x$'
    - 'Replace $\sin^2 x$ with $1 - \cos^2 x$'
    - 'Collect terms: $4\cos^3 x - 3\cos x$'
  explanation: |-
    After the sum formula and the double-angle formulas, the expression is $(2\cos^2 x - 1)\cos x - 2\sin^2 x\cos x$. Replacing $\sin^2 x$ leaves only cosines: $2\cos^3 x - \cos x - 2\cos x + 2\cos^3 x = 4\cos^3 x - 3\cos x$.
- id: trig-m6-r2-q20
  lesson: trig-double-angle
  topic: Double-angle formulas
  stem: 'The triangle has two sides of length 1 and apex angle $2\theta$, so its area is $\tfrac12\sin 2\theta$. The altitude shows it also has base $2\sin\theta$ and height $\cos\theta$. Which identity follows?'
  image: {src: images/trig-m6-double-isosceles.svg, alt: 'An isosceles triangle with two sides of length 1 meeting at apex angle 2 theta, split by a dashed altitude of length cos theta into two right triangles with bases sin theta.'}
  choices:
    - '$\cos 2\theta = \cos^2\theta - \sin^2\theta$'
    - '$\sin 2\theta = 2\sin\theta$'
    - '$\sin 2\theta = 2\sin\theta\cos\theta$'
    - '$\sin^2\theta + \cos^2\theta = 1$'
  answer: 2
  explanation: |-
    The area is also $\tfrac12\cdot\text{base}\cdot\text{height} = \tfrac12(2\sin\theta)(\cos\theta) = \sin\theta\cos\theta$. Setting $\tfrac12\sin 2\theta = \sin\theta\cos\theta$ gives $\sin 2\theta = 2\sin\theta\cos\theta$.

# ---------- Lesson 25: half-angle formulas ----------
- id: trig-m6-r2-q21
  lesson: trig-half-angle
  type: label
  module_quiz: true
  topic: Half-angle formulas
  stem: 'In the unit circle, $A = (-1, 0)$ and $P = (\cos\theta, \sin\theta)$. Name the numbered angles and lengths.'
  image: {src: images/trig-m6-half-angle-circle-blank.svg, alt: 'A unit circle with center O, the point A at (−1, 0), a point P on the upper arc, and F the foot of the perpendicular from P to the x-axis. Triangle AFP is shaded and OF is labeled cos theta. Numbered: the angle at O, the angle at A, the segment FP, and the dimension line from A to F.'}
  labels:
    - {x: 55.5, y: 49.1, text: θ}
    - {x: 28.8, y: 48.9, text: θ/2}
    - {x: 64.9, y: 35.0, text: sin θ}
    - {x: 40.5, y: 63.4, text: 1 + cos θ}
  distractors: [1 − cos θ, 2θ]
  explanation: |-
    The central angle at $O$ is $\theta$, and the angle at $A$, with its vertex on the circle, is half of it. $FP$ is the $y$-coordinate of $P$, $\sin\theta$, and $AF = AO + OF = 1 + \cos\theta$. In the right triangle $AFP$, $\tan\tfrac{\theta}{2} = \tfrac{\sin\theta}{1 + \cos\theta}$.
- id: trig-m6-r2-q22
  lesson: trig-half-angle
  type: text
  topic: Half-angle formulas
  stem: '$\cos\theta = \tfrac18$ and $0^\circ < \theta < 90^\circ$. Then $\cos\tfrac{\theta}{2} =$ ___. (Give an exact fraction or a decimal.)'
  accept: ['3/4', '0.75']
  explanation: |-
    $\tfrac{\theta}{2}$ is between $0^\circ$ and $45^\circ$, so its cosine is positive: $\cos\tfrac{\theta}{2} = \sqrt{\tfrac{1 + 1/8}{2}} = \sqrt{\tfrac{9}{16}} = \tfrac34$.
- id: trig-m6-r2-q23
  lesson: trig-half-angle
  type: order
  topic: Half-angle formulas
  stem: '$\theta$ is between $270^\circ$ and $360^\circ$ and you want $\sin\tfrac{\theta}{2}$. Put the steps in order.'
  items:
    - 'Halve the inequality: $135^\circ < \tfrac{\theta}{2} < 180^\circ$'
    - 'Read the quadrant: $\tfrac{\theta}{2}$ is in quadrant II'
    - 'Choose the sign: sine is positive in quadrant II'
    - 'Compute $+\sqrt{\tfrac{1 - \cos\theta}{2}}$'
  explanation: |-
    The sign comes from the quadrant of $\tfrac{\theta}{2}$, so locate the half angle first, then pick the sign, then use the formula. Here $\theta$ is in quadrant IV, where sine is negative, but $\sin\tfrac{\theta}{2}$ is positive.
- id: trig-m6-r2-q24
  lesson: trig-half-angle
  topic: Half-angle formulas
  stem: 'Which expressions equal $\tan\tfrac{\theta}{2}$ for every $\theta$ where both sides are defined? Select all that apply.'
  choices:
    - '$\dfrac{1 - \cos\theta}{\sin\theta}$'
    - '$\dfrac{\sin\theta}{1 + \cos\theta}$'
    - '$\csc\theta - \cot\theta$'
    - '$\dfrac{\sin\theta}{1 - \cos\theta}$'
    - '$\dfrac{\tan\theta}{2}$'
  answer: [0, 1, 2]
  explanation: |-
    The first two are the half-angle formulas for tangent, and splitting the first gives $\tfrac{1}{\sin\theta} - \tfrac{\cos\theta}{\sin\theta} = \csc\theta - \cot\theta$. $\tfrac{\sin\theta}{1 - \cos\theta}$ is the reciprocal, $\cot\tfrac{\theta}{2}$. And halving the angle does not halve the tangent: at $\theta = \tfrac{\pi}{2}$, $\tan\tfrac{\pi}{4} = 1$ while $\tan\tfrac{\pi}{2}$ is undefined.
- id: trig-m6-r2-q25
  lesson: trig-half-angle
  type: match
  topic: Half-angle formulas
  stem: 'Match each value to its exact form.'
  pairs:
    - ['$\sin 22.5^\circ$', √(2 − √2)/2]
    - ['$\cos 22.5^\circ$', √(2 + √2)/2]
    - ['$\tan 22.5^\circ$', √2 − 1]
    - ['$\cos 112.5^\circ$', −√(2 − √2)/2]
  distractors: [√(2 − √3)/2]
  explanation: |-
    With $\theta = 45^\circ$: $\sin 22.5^\circ = \sqrt{\tfrac{1 - \sqrt2/2}{2}} = \tfrac{\sqrt{2 - \sqrt2}}{2}$, $\cos 22.5^\circ = \tfrac{\sqrt{2 + \sqrt2}}{2}$, and $\tan 22.5^\circ = \tfrac{1 - \cos 45^\circ}{\sin 45^\circ} = \sqrt2 - 1$. With $\theta = 225^\circ$: $112.5^\circ$ is in quadrant II, so $\cos 112.5^\circ = -\sqrt{\tfrac{1 + \cos 225^\circ}{2}} = -\tfrac{\sqrt{2 - \sqrt2}}{2}$. The distractor $\tfrac{\sqrt{2 - \sqrt3}}{2}$ is $\sin 15^\circ$.

# ---------- Lesson 26: product-to-sum and sum-to-product ----------
- id: trig-m6-r2-q26
  lesson: trig-product-sum
  type: text
  module_quiz: true
  topic: Product-to-sum formulas
  stem: 'Find the exact value of $\sin 75^\circ\sin 15^\circ$. (Give a fraction or a decimal.)'
  accept: ['1/4', '0.25']
  explanation: |-
    $\sin\alpha\sin\beta = \tfrac12[\cos(\alpha - \beta) - \cos(\alpha + \beta)] = \tfrac12[\cos 60^\circ - \cos 90^\circ] = \tfrac12\left[\tfrac12 - 0\right] = \tfrac14$.
- id: trig-m6-r2-q27
  lesson: trig-product-sum
  type: match
  topic: Product-to-sum formulas
  stem: 'Match each product to the sum it equals.'
  pairs:
    - ['$\sin 3x\cos x$', ½(sin 4x + sin 2x)]
    - ['$\cos 3x\sin x$', ½(sin 4x − sin 2x)]
    - ['$\cos 3x\cos x$', ½(cos 2x + cos 4x)]
    - ['$\sin 3x\sin x$', ½(cos 2x − cos 4x)]
  distractors: [½(cos 4x − cos 2x)]
  explanation: |-
    With $\alpha = 3x$ and $\beta = x$, the sum angle is $4x$ and the difference angle is $2x$. $\sin\alpha\cos\beta$ adds the two sines and $\cos\alpha\sin\beta$ subtracts them; $\cos\alpha\cos\beta$ adds the two cosines, and $\sin\alpha\sin\beta = \tfrac12[\cos(\alpha - \beta) - \cos(\alpha + \beta)]$ puts the difference angle first. Reversing that order gives the distractor, which has the wrong sign.
- id: trig-m6-r2-q28
  lesson: trig-product-sum
  topic: Product-to-sum formulas
  stem: 'Which expressions equal $\sin 5x + \sin x$? Select all that apply.'
  choices:
    - '$2\sin 3x\cos 2x$'
    - '$\sin 6x$'
    - '$2\cos 3x\sin 2x$'
    - '$2\sin 3x\cos(-2x)$'
  answer: [0, 3]
  explanation: |-
    $\sin u + \sin v = 2\sin\tfrac{u + v}{2}\cos\tfrac{u - v}{2} = 2\sin 3x\cos 2x$, and since cosine is even, $\cos(-2x) = \cos 2x$. $2\cos 3x\sin 2x$ is $\sin 5x - \sin x$, and $\sin 6x$ is the "add the angles" mistake.
- id: trig-m6-r2-q29
  lesson: trig-product-sum
  type: order
  topic: Product-to-sum formulas
  stem: 'Put the steps for solving $\cos 3x + \cos x = 0$ on $[0, 2\pi)$ in order.'
  items:
    - 'Sum-to-product: $2\cos 2x\cos x = 0$'
    - 'Set each factor to zero: $\cos 2x = 0$ or $\cos x = 0$'
    - 'Solve: $2x = \tfrac{\pi}{2}, \tfrac{3\pi}{2}, \tfrac{5\pi}{2}, \tfrac{7\pi}{2}$, and $x = \tfrac{\pi}{2}, \tfrac{3\pi}{2}$'
    - 'Collect: $x = \tfrac{\pi}{4}, \tfrac{\pi}{2}, \tfrac{3\pi}{4}, \tfrac{5\pi}{4}, \tfrac{3\pi}{2}, \tfrac{7\pi}{4}$'
  explanation: |-
    $\cos 3x + \cos x = 2\cos\tfrac{4x}{2}\cos\tfrac{2x}{2} = 2\cos 2x\cos x$. For $x$ in $[0, 2\pi)$, $2x$ runs over $[0, 4\pi)$, so $\cos 2x = 0$ has four solutions, giving $x = \tfrac{\pi}{4}, \tfrac{3\pi}{4}, \tfrac{5\pi}{4}, \tfrac{7\pi}{4}$; $\cos x = 0$ adds $\tfrac{\pi}{2}$ and $\tfrac{3\pi}{2}$.
- id: trig-m6-r2-q30
  lesson: trig-product-sum
  type: text
  topic: Product-to-sum formulas
  stem: 'A 440 Hz tuning fork and a guitar string that is slightly sharp (higher) are played together, and you hear 3 beats per second. The string''s frequency is ___ Hz.'
  accept: ['443']
  explanation: |-
    The number of beats per second is the difference of the two frequencies. The string is higher than 440 Hz, so it is $440 + 3 = 443$ Hz. (Had it been flat, it would be 437 Hz.)

# ---------- Lesson 27: equations with identities ----------
- id: trig-m6-r2-q31
  lesson: trig-equations-ids
  type: order
  module_quiz: true
  topic: Trig equations with identities
  stem: 'Put the steps for solving $\cos 2x = 3\sin x - 1$ on $[0, 2\pi)$ in order.'
  items:
    - 'Replace $\cos 2x$ with $1 - 2\sin^2 x$'
    - 'Move everything to one side: $2\sin^2 x + 3\sin x - 2 = 0$'
    - 'Factor: $(2\sin x - 1)(\sin x + 2) = 0$'
    - 'Discard $\sin x = -2$ and solve $\sin x = \tfrac12$'
    - 'Solutions: $x = \tfrac{\pi}{6}, \tfrac{5\pi}{6}$'
  explanation: |-
    Choosing the form $1 - 2\sin^2 x$ leaves only sine. Then $1 - 2\sin^2 x = 3\sin x - 1$ becomes $2\sin^2 x + 3\sin x - 2 = 0$, which factors. $\sin x = -2$ is impossible, and $\sin x = \tfrac12$ gives $\tfrac{\pi}{6}$ and $\tfrac{5\pi}{6}$.
- id: trig-m6-r2-q32
  lesson: trig-equations-ids
  type: text
  topic: Trig equations with identities
  stem: 'How many solutions does $\cos 2x = \cos x$ have on $[0, 2\pi)$? Give only the number.'
  accept: ['3', three]
  explanation: |-
    $2\cos^2 x - 1 = \cos x$ gives $2\cos^2 x - \cos x - 1 = 0$, so $(2\cos x + 1)(\cos x - 1) = 0$. $\cos x = 1$ gives $x = 0$; $\cos x = -\tfrac12$ gives $x = \tfrac{2\pi}{3}, \tfrac{4\pi}{3}$. Three solutions.
- id: trig-m6-r2-q33
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Which steps can lose solutions or create extraneous ones? Select all that apply.'
  choices:
    - 'Dividing both sides by $\sin x$'
    - 'Squaring both sides'
    - 'Replacing $\cos^2 x$ with $1 - \sin^2 x$'
    - 'Rewriting $\sin 2x$ as $2\sin x\cos x$'
    - 'Moving every term to one side and factoring'
  answer: [0, 1]
  explanation: |-
    Dividing by $\sin x$ throws away the solutions where $\sin x = 0$, and squaring can add solutions of the equation with the opposite sign. Replacing an expression with an identical one, and factoring, never change the solution set.
- id: trig-m6-r2-q34
  lesson: trig-equations-ids
  type: match
  topic: Trig equations with identities
  stem: 'Match each equation to its solutions on $[0, 2\pi)$.'
  pairs:
    - ['$\sin 2x = \sin x$', '0, π/3, π, 5π/3']
    - ['$2\sin^2 x = \sin x$', '0, π/6, 5π/6, π']
    - ['$\tan^2 x = 3$', 'π/3, 2π/3, 4π/3, 5π/3']
    - ['$\sec^2 x - 1 = \tan x$', '0, π/4, π, 5π/4']
  distractors: ['0, π/2, π, 3π/2']
  explanation: |-
    $\sin 2x = \sin x$: $\sin x(2\cos x - 1) = 0$, so $\sin x = 0$ or $\cos x = \tfrac12$. $2\sin^2 x = \sin x$: $\sin x(2\sin x - 1) = 0$. $\tan^2 x = 3$: $\tan x = \pm\sqrt3$. $\sec^2 x - 1 = \tan x$: $\tan^2 x = \tan x$, so $\tan x(\tan x - 1) = 0$. In every case, factor instead of dividing.
- id: trig-m6-r2-q35
  lesson: trig-equations-ids
  topic: Trig equations with identities
  stem: 'Squaring $\sin x - \cos x = 1$ gives $1 - \sin 2x = 1$, so $\sin 2x = 0$. Which values are the solutions of the original equation on $[0, 2\pi)$?'
  choices:
    - '$\tfrac{\pi}{2}$ and $\pi$'
    - '$0$ and $\tfrac{\pi}{2}$'
    - '$0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}$'
    - '$\pi$ and $\tfrac{3\pi}{2}$'
  answer: 0
  explanation: |-
    The candidates are $0, \tfrac{\pi}{2}, \pi, \tfrac{3\pi}{2}$. In the original: $x = 0$ gives $0 - 1 = -1$ (no), $\tfrac{\pi}{2}$ gives $1 - 0 = 1$ (yes), $\pi$ gives $0 - (-1) = 1$ (yes), and $\tfrac{3\pi}{2}$ gives $-1 - 0 = -1$ (no). The rejected two solve $\sin x - \cos x = -1$, which has the same square.

# ---------- Honors 27h1: the tangent half-angle substitution ----------
- id: trig-m6-r2-h01
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'With $t = \tan\tfrac{x}{2}$, which expression equals $\sin x$?'
  choices: ['$\dfrac{2t}{1 + t^2}$', '$\dfrac{1 - t^2}{1 + t^2}$', '$\dfrac{2t}{1 - t^2}$', '$\dfrac{t}{1 + t^2}$']
  answer: 0
  explanation: |-
    $\sin x = 2\sin\tfrac{x}{2}\cos\tfrac{x}{2}$; dividing by $\cos^2\tfrac{x}{2} + \sin^2\tfrac{x}{2}$ and then top and bottom by $\cos^2\tfrac{x}{2}$ gives $\tfrac{2t}{1 + t^2}$. The second choice is $\cos x$ and the third is $\tan x$.
- id: trig-m6-r2-h02
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: '$\tan\tfrac{x}{2} = \tfrac13$. Find $\cos x$.'
  choices: ['$\tfrac35$', '$\tfrac89$', '$\tfrac45$', '$\tfrac34$']
  answer: 2
  explanation: |-
    $\cos x = \tfrac{1 - t^2}{1 + t^2} = \tfrac{1 - 1/9}{1 + 1/9} = \tfrac{8/9}{10/9} = \tfrac45$. ($\tfrac34$ is $\tan x$, and $\tfrac35$ is $\sin x$.)
- id: trig-m6-r2-h03
  lesson: trig-m6-h-tan-half
  type: text
  topic: Tangent half-angle substitution
  stem: '$\tan\tfrac{x}{2} = 2$. Then $\sin x =$ ___. (Give an exact fraction or a decimal.)'
  accept: ['4/5', '0.8']
  explanation: |-
    $\sin x = \tfrac{2t}{1 + t^2} = \tfrac{4}{5}$. (And $\cos x = \tfrac{1 - 4}{5} = -\tfrac35$, so $x$ is in quadrant II.)
- id: trig-m6-r2-h04
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'For which angles $x$ is $t = \tan\tfrac{x}{2}$ undefined?'
  choices: ['$x = \pi + 2k\pi$', '$x = \tfrac{\pi}{2} + k\pi$', '$x = 2k\pi$', '$x = k\pi$']
  answer: 0
  explanation: |-
    Tangent is undefined when its angle is $\tfrac{\pi}{2} + k\pi$. Setting $\tfrac{x}{2} = \tfrac{\pi}{2} + k\pi$ gives $x = \pi + 2k\pi$: the angles pointing straight left, where the line through $(-1, 0)$ would have to be vertical.
- id: trig-m6-r2-h05
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: '$\tan\tfrac{x}{2} = -2$ and $-\pi < x < \pi$. In which quadrant is $x$?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant IV', 'Quadrant III']
  answer: 3
  explanation: |-
    $1 + t^2 = 5$, so $\sin x = \tfrac{-4}{5}$ and $\cos x = \tfrac{1 - 4}{5} = -\tfrac35$. Both negative: quadrant III. Check: $x = 2\tan^{-1}(-2) \approx -2.214$ rad $\approx -126.9^\circ$, which is in quadrant III.
- id: trig-m6-r2-h06
  lesson: trig-m6-h-tan-half
  type: label
  topic: Tangent half-angle substitution
  stem: 'A line of slope $t$ passes through a point of the unit circle and meets the circle again. Name the numbered points and angles.'
  image: {src: images/trig-m6-h-tan-half-line-blank.svg, alt: 'A unit circle centered at O with a line of slope t crossing it. Numbered: the leftmost point of the circle where the line starts, the point where the line crosses the y-axis, the second point where the line meets the circle, the angle at O between the positive x-axis and the dashed radius, and the angle the line makes with the x-axis at its starting point.'}
  labels:
    - {x: 20.0, y: 55.6, text: '(−1, 0)'}
    - {x: 50.0, y: 27.5, text: '(0, t)'}
    - {x: 60.3, y: 18.0, text: '(cos x, sin x)'}
    - {x: 54.1, y: 51.7, text: x}
    - {x: 31.1, y: 50.9, text: x/2}
  distractors: ['(1, 0)', 2x]
  explanation: |-
    The line starts at $(-1, 0)$ and, having slope $t$, rises $t$ over the run of 1 to the $y$-axis, so it crosses at $(0, t)$. It meets the circle again at the point at angle $x$ from the center, $(\cos x, \sin x)$. The inscribed angle at $(-1, 0)$ is half the central angle, $\tfrac{x}{2}$, so $t = \tan\tfrac{x}{2}$.
- id: trig-m6-r2-h07
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'Which Pythagorean triple does $t = \tfrac25$ give with the recipe $(q^2 - p^2,\; 2pq,\; q^2 + p^2)$?'
  choices: ['7, 24, 25', '21, 20, 29', '9, 40, 41', '21, 10, 29']
  answer: 1
  explanation: |-
    $p = 2$, $q = 5$: $q^2 - p^2 = 21$, $2pq = 20$, $q^2 + p^2 = 29$, and $21^2 + 20^2 = 441 + 400 = 841 = 29^2$. (7, 24, 25 comes from $t = \tfrac34$ and 9, 40, 41 from $t = \tfrac45$; 21, 10, 29 forgets the factor 2.)
- id: trig-m6-r2-h08
  lesson: trig-m6-h-tan-half
  type: text
  topic: Tangent half-angle substitution
  stem: 'The recipe $(q^2 - p^2,\; 2pq,\; q^2 + p^2)$ with $p = 1$ and $q = 4$ gives a right triangle whose hypotenuse is ___.'
  accept: ['17']
  explanation: |-
    The hypotenuse is $q^2 + p^2 = 16 + 1 = 17$; the legs are $15$ and $8$, and $225 + 64 = 289 = 17^2$.
- id: trig-m6-r2-h09
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'Substituting $t = \tan\tfrac{x}{2}$ into $2\sin x + \cos x = 1$ and multiplying by $1 + t^2$ gives which equation?'
  choices: ['$2t^2 + 4t = 0$', '$t^2 - 4t + 2 = 0$', '$4t - 2t^2 = 2$', '$2t^2 - 4t = 0$']
  answer: 3
  explanation: |-
    $2\cdot 2t + (1 - t^2) = 1 + t^2$, so $4t + 1 - t^2 - 1 - t^2 = 0$, that is, $-2t^2 + 4t = 0$, or $2t^2 - 4t = 0$. This matches $(b + c)t^2 - 2at + (c - b) = 0$ with $a = 2$, $b = 1$, $c = 1$.
- id: trig-m6-r2-h10
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'Which values are solutions of $2\sin x + \cos x = 1$ on $[0, 2\pi)$? Select all that apply.'
  choices:
    - '$0$'
    - '$2\tan^{-1}2 \approx 2.2143$'
    - '$\pi$'
    - '$\tan^{-1}2 \approx 1.1071$'
    - '$\tfrac{\pi}{2}$'
  answer: [0, 1]
  explanation: |-
    The quadratic $2t^2 - 4t = 0$ gives $t = 0$ or $t = 2$, so $x = 2\tan^{-1}0 = 0$ and $x = 2\tan^{-1}2 \approx 2.2143$. Check the second: $\sin x = \tfrac45$, $\cos x = -\tfrac35$, and $\tfrac85 - \tfrac35 = 1$. $x = \pi$ gives $0 - 1 = -1$, $\tfrac{\pi}{2}$ gives 2, and $\tan^{-1}2$ forgets to double the angle.
- id: trig-m6-r2-h11
  lesson: trig-m6-h-tan-half
  type: order
  topic: Tangent half-angle substitution
  stem: 'Put the main steps of solving $a\sin x + b\cos x = c$ with the substitution $t = \tan\tfrac{x}{2}$ in order.'
  items:
    - 'Replace $\sin x$ by $\tfrac{2t}{1 + t^2}$ and $\cos x$ by $\tfrac{1 - t^2}{1 + t^2}$'
    - 'Multiply by $1 + t^2$ and solve the quadratic in $t$'
    - 'Convert each root with $x = 2\tan^{-1}t$'
    - 'Add $2\pi$ to any negative angle to land in $[0, 2\pi)$'
  explanation: |-
    Substitute, clear the denominators, solve for $t$, convert back to $x$ (remembering the factor 2), and adjust to the interval. Separately, check $x = \pi$ in the original equation, since the substitution cannot produce it.
- id: trig-m6-r2-h12
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'Exactly when does $a\sin x + b\cos x = c$ have real solutions?'
  choices: ['When $|c| \le 1$', 'When $c \le a + b$', 'When $c^2 \le a^2 + b^2$', 'When $a^2 + b^2 \le 1$']
  answer: 2
  explanation: |-
    The quadratic $(b + c)t^2 - 2at + (c - b) = 0$ has discriminant $4(a^2 + b^2 - c^2)$, which is not negative exactly when $c^2 \le a^2 + b^2$. The amplitude method agrees: $R\sin(x + \varphi) = c$ with $R = \sqrt{a^2 + b^2}$ needs $|c| \le R$.
- id: trig-m6-r2-h13
  lesson: trig-m6-h-tan-half
  topic: Tangent half-angle substitution
  stem: 'Solve $\sin x + \cos x = -1$ on $[0, 2\pi)$.'
  choices: ['$\tfrac{3\pi}{2}$ only', '$\pi$ and $\tfrac{3\pi}{2}$', '$\tfrac{\pi}{2}$ and $\pi$', '$\pi$ only']
  answer: 1
  explanation: |-
    Check $x = \pi$ first: $0 + (-1) = -1$, so $\pi$ is a solution. With $a = 1$, $b = 1$, $c = -1$, $b + c = 0$ and the equation in $t$ is linear: $-2t - 2 = 0$, $t = -1$, $x = 2\tan^{-1}(-1) = -\tfrac{\pi}{2}$, which is $\tfrac{3\pi}{2}$ in $[0, 2\pi)$. Check: $-1 + 0 = -1$.
- id: trig-m6-r2-h14
  lesson: trig-m6-h-tan-half
  type: match
  topic: Tangent half-angle substitution
  stem: 'With $t = \tan\tfrac{x}{2}$, match each quantity to its expression in $t$.'
  pairs:
    - ['$\sin x$', 2t/(1 + t²)]
    - ['$\cos x$', (1 − t²)/(1 + t²)]
    - ['$\tan x$', 2t/(1 − t²)]
    - ['$dx$', 2 dt/(1 + t²)]
  distractors: [t/(1 + t²)]
  explanation: |-
    The first three come from the double-angle formulas divided by $\cos^2\tfrac{x}{2} + \sin^2\tfrac{x}{2}$. For $dx$: $x = 2\tan^{-1}t$, and the derivative of $\tan^{-1}t$ is $\tfrac{1}{1 + t^2}$, so $dx = \tfrac{2\,dt}{1 + t^2}$ (the calculus use of the substitution).

# ---------- Honors 27h2: multiple angles, Chebyshev polynomials and cubics ----------
- id: trig-m6-r2-h15
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Which recursion produces the Chebyshev polynomials, with $T_0 = 1$ and $T_1 = c$?'
  choices: ['$T_{n+1} = 2cT_n + T_{n-1}$', '$T_{n+1} = cT_n - T_{n-1}$', '$T_{n+1} = 2T_n - cT_{n-1}$', '$T_{n+1} = 2cT_n - T_{n-1}$']
  answer: 3
  explanation: |-
    From $\cos(n + 1)x + \cos(n - 1)x = 2\cos x\cos nx$: $\cos(n + 1)x = 2\cos x\cos nx - \cos(n - 1)x$. Check with $n = 1$: $T_2 = 2c\cdot c - 1 = 2c^2 - 1$, which is $\cos 2x$.
- id: trig-m6-r2-h16
  lesson: trig-m6-h-multiple-angles
  type: text
  topic: Multiple-angle formulas
  stem: '$\cos\theta = \tfrac14$. Then $\cos 3\theta =$ ___. (Give an exact fraction or a decimal.)'
  accept: ['-11/16', '-0.6875']
  explanation: |-
    $\cos 3\theta = 4\cos^3\theta - 3\cos\theta = 4\cdot\tfrac{1}{64} - \tfrac34 = \tfrac{1}{16} - \tfrac{12}{16} = -\tfrac{11}{16}$.
- id: trig-m6-r2-h17
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: '$\cos\theta = \tfrac23$. Find $\cos 4\theta$.'
  choices: ['$-\tfrac{79}{81}$', '$\tfrac{79}{81}$', '$-\tfrac19$', '$\tfrac83$']
  answer: 0
  explanation: |-
    $T_4(c) = 8c^4 - 8c^2 + 1 = 8\cdot\tfrac{16}{81} - 8\cdot\tfrac49 + 1 = \tfrac{128 - 288 + 81}{81} = -\tfrac{79}{81}$. Check: $\cos 2\theta = 2\cdot\tfrac49 - 1 = -\tfrac19$ (a distractor), and $2\left(-\tfrac19\right)^2 - 1 = \tfrac{2}{81} - 1 = -\tfrac{79}{81}$. $\tfrac83$ is $4\cos\theta$, the "pull out the 4" mistake.
- id: trig-m6-r2-h18
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'What is the leading term of $T_6(c)$, the polynomial with $T_6(\cos x) = \cos 6x$?'
  choices: ['$64c^6$', '$32c^6$', '$16c^6$', '$6c^6$']
  answer: 1
  explanation: |-
    Each step of $T_{n+1} = 2cT_n - T_{n-1}$ doubles the leading coefficient, starting from $T_1 = c$. So $T_n$ starts with $2^{n-1}c^n$, and $T_6$ starts with $2^5c^6 = 32c^6$. (In full, $T_6 = 32c^6 - 48c^4 + 18c^2 - 1$.)
- id: trig-m6-r2-h19
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Which statements are true for every Chebyshev polynomial $T_n$ with $n \ge 1$? Select all that apply.'
  choices:
    - '$T_n(\cos x) = \cos nx$'
    - '$T_n(1) = 1$'
    - '$|T_n(c)| \le 1$ whenever $-1 \le c \le 1$'
    - '$T_n$ contains only even powers of $c$'
    - '$T_n(0) = 0$'
  answer: [0, 1, 2]
  explanation: |-
    $T_n(\cos x) = \cos nx$ is the defining property. At $c = 1 = \cos 0$, $T_n(1) = \cos 0 = 1$. Every $c$ in $[-1, 1]$ is $\cos x$ for some $x$, so $T_n(c) = \cos nx$ lies in $[-1, 1]$. But odd $n$ give only odd powers ($T_3 = 4c^3 - 3c$), and $T_2(0) = -1$, not 0.
- id: trig-m6-r2-h20
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Which expression equals $\sin 3x$?'
  choices: ['$4\sin^3 x - 3\sin x$', '$3\sin x$', '$3\sin x - 4\sin^3 x$', '$3\sin x - \sin^3 x$']
  answer: 2
  explanation: |-
    $\sin 3x = \sin 2x\cos x + \cos 2x\sin x = 2\sin x(1 - \sin^2 x) + (1 - 2\sin^2 x)\sin x = 3\sin x - 4\sin^3 x$. The first choice has the signs of the cosine formula. Check at $x = 90^\circ$: $\sin 270^\circ = -1$ and $3 - 4 = -1$.
- id: trig-m6-r2-h21
  lesson: trig-m6-h-multiple-angles
  type: order
  topic: Multiple-angle formulas
  stem: 'Put the steps for finding $\sin 18^\circ$ exactly in order (with $\theta = 18^\circ$).'
  items:
    - 'Note that $5\theta = 90^\circ$, so $2\theta = 90^\circ - 3\theta$'
    - 'Use the cofunction identity: $\sin 2\theta = \cos 3\theta$'
    - 'Expand and divide by $\cos\theta$: $2\sin\theta = 4\cos^2\theta - 3$'
    - 'Replace $\cos^2\theta$ with $1 - \sin^2\theta$: $4\sin^2\theta + 2\sin\theta - 1 = 0$'
    - 'Take the positive root: $\sin 18^\circ = \tfrac{\sqrt5 - 1}{4}$'
  explanation: |-
    Each step uses the result before it. The quadratic formula gives $\sin\theta = \tfrac{-2 \pm \sqrt{20}}{8} = \tfrac{-1 \pm \sqrt5}{4}$, and $\sin 18^\circ > 0$ picks the plus sign.
- id: trig-m6-r2-h22
  lesson: trig-m6-h-multiple-angles
  type: text
  topic: Multiple-angle formulas
  stem: '$\sin 18^\circ = \tfrac{\sqrt5 - 1}{4}$. To 4 decimal places, $\sin 18^\circ \approx$ ___.'
  accept: ['0.3090']
  explanation: |-
    $\sqrt5 \approx 2.23607$, so $\tfrac{2.23607 - 1}{4} = \tfrac{1.23607}{4} \approx 0.30902$, which is $0.3090$ to 4 decimal places.
- id: trig-m6-r2-h23
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Setting $c = \cos\theta$ turns $4c^3 - 3c = \tfrac{\sqrt2}{2}$ into $\cos 3\theta = \tfrac{\sqrt2}{2}$. Which value is a root of the cubic?'
  choices: ['$\cos 45^\circ$', '$\cos 15^\circ$', '$\cos 5^\circ$', '$\cos 60^\circ$']
  answer: 1
  explanation: |-
    $3\theta = 45^\circ$ gives $\theta = 15^\circ$, so $c = \cos 15^\circ$ is a root (the others are $\cos 105^\circ$ and $\cos 135^\circ$, from $3\theta = 315^\circ$ and $405^\circ$). $\cos 45^\circ$ would need $\cos 135^\circ = \tfrac{\sqrt2}{2}$, which is false; $\cos 5^\circ$ gives $\cos 15^\circ$; $\cos 60^\circ$ gives $\cos 180^\circ = -1$.
- id: trig-m6-r2-h24
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Why can''t a $60^\circ$ angle be trisected with straightedge and compass?'
  choices:
    - '$20^\circ$ is not a whole number of radians'
    - 'The cubic $8c^3 - 6c - 1 = 0$ has no real roots'
    - '$\cos 20^\circ$ is irrational, and irrational lengths can never be constructed'
    - '$\cos 20^\circ$ solves a cubic with no rational roots, and such numbers cannot be constructed'
  answer: 3
  explanation: |-
    Constructions only add, subtract, multiply, divide and take square roots, and Wantzel proved (1837) that such numbers are never roots of a cubic with rational coefficients and no rational root. $\cos 20^\circ$ is one. The cubic does have three real roots, and some irrational lengths, such as $\sqrt2$, are easy to construct.
- id: trig-m6-r2-h25
  lesson: trig-m6-h-multiple-angles
  type: text
  topic: Multiple-angle formulas
  stem: 'Use $\sin x + \sin 2x + \cdots + \sin nx = \dfrac{\sin\frac{nx}{2}\sin\frac{(n + 1)x}{2}}{\sin\frac{x}{2}}$ with $x = 60^\circ$ and $n = 6$. The sum equals ___.'
  accept: ['0']
  explanation: |-
    $\tfrac{nx}{2} = 180^\circ$ and $\sin 180^\circ = 0$, so the sum is 0. Directly: $\tfrac{\sqrt3}{2} + \tfrac{\sqrt3}{2} + 0 - \tfrac{\sqrt3}{2} - \tfrac{\sqrt3}{2} + 0 = 0$, since six steps of $60^\circ$ go once around the circle.
- id: trig-m6-r2-h26
  lesson: trig-m6-h-multiple-angles
  type: match
  topic: Multiple-angle formulas
  stem: 'Match each Chebyshev polynomial to its formula.'
  pairs:
    - ['$T_2(c)$', 2c² − 1]
    - ['$T_3(c)$', 4c³ − 3c]
    - ['$T_4(c)$', 8c⁴ − 8c² + 1]
    - ['$T_5(c)$', 16c⁵ − 20c³ + 5c]
  distractors: [4c³ + 3c]
  explanation: |-
    Each comes from $T_{n+1} = 2cT_n - T_{n-1}$: for example $T_5 = 2c(8c^4 - 8c^2 + 1) - (4c^3 - 3c) = 16c^5 - 20c^3 + 5c$. A quick check: each $T_n(1)$ must be 1.
- id: trig-m6-r2-h27
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'Which identity makes the sum $\sin x + \sin 2x + \cdots + \sin nx$ telescope after each term is multiplied by $2\sin\tfrac{x}{2}$?'
  choices:
    - '$2\sin\tfrac{x}{2}\sin kx = \sin\left(k + \tfrac12\right)x - \sin\left(k - \tfrac12\right)x$'
    - '$2\sin\tfrac{x}{2}\sin kx = \cos\left(k - \tfrac12\right)x - \cos\left(k + \tfrac12\right)x$'
    - '$2\cos\tfrac{x}{2}\sin kx = \cos\left(k - \tfrac12\right)x - \cos\left(k + \tfrac12\right)x$'
    - '$2\sin\tfrac{x}{2}\sin kx = 2\sin\tfrac{(k + 1)x}{2}$'
  answer: 1
  explanation: |-
    The product-to-sum formula $2\sin A\sin B = \cos(A - B) - \cos(A + B)$ with $A = kx$, $B = \tfrac{x}{2}$ gives $\cos\left(k - \tfrac12\right)x - \cos\left(k + \tfrac12\right)x$. Each term's second cosine cancels the next term's first, leaving $\cos\tfrac{x}{2} - \cos\left(n + \tfrac12\right)x$.
- id: trig-m6-r2-h28
  lesson: trig-m6-h-multiple-angles
  topic: Multiple-angle formulas
  stem: 'If $-1 < k < 1$, how many different values of $\cos\theta$ satisfy $\cos 3\theta = k$?'
  choices: ['1', '2', '3', 'Infinitely many']
  answer: 2
  explanation: |-
    $3\theta = \pm\cos^{-1}k + 360^\circ m$, so $\theta = \pm\tfrac13\cos^{-1}k + 120^\circ m$. The minus sign gives the same cosines as the plus sign, and the cosines repeat after three steps of $120^\circ$. These are the three roots of $4c^3 - 3c = k$, all different when $|k| < 1$.

# ---------- Honors 27h3: Ptolemy's chords ----------
- id: trig-m6-r2-h29
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'In a circle of radius $R$, which formula gives the length of the chord cut off by a central angle $\theta$?'
  choices: ['$R\sin\theta$', '$2R\sin\theta$', '$R\theta$', '$2R\sin\tfrac{\theta}{2}$']
  answer: 3
  explanation: |-
    The perpendicular from the center halves the chord and the angle, making right triangles with hypotenuse $R$ and angle $\tfrac{\theta}{2}$. Each half-chord is $R\sin\tfrac{\theta}{2}$, so the chord is $2R\sin\tfrac{\theta}{2}$. $R\theta$ is the arc, which is longer.
- id: trig-m6-r2-h30
  lesson: trig-m6-h-ptolemy
  type: text
  topic: Chords and Ptolemy's theorem
  stem: 'In Ptolemy''s circle of radius 60, the chord of $60^\circ$ is ___.'
  accept: ['60']
  explanation: |-
    $\text{crd}\,60^\circ = 120\sin 30^\circ = 60$. The chord and the two radii form an equilateral triangle (the side of a regular hexagon equals the radius).
- id: trig-m6-r2-h31
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'With $R = 60$, find $\text{crd}\,36^\circ$ to two decimal places.'
  choices: ['35.27', '37.08', '70.53', '18.54']
  answer: 1
  explanation: |-
    $\text{crd}\,36^\circ = 120\sin 18^\circ \approx 120(0.30902) \approx 37.08$. $35.27$ is $60\sin 36^\circ$ (using $R\sin\theta$), $70.53$ is $120\sin 36^\circ$ (the chord of $72^\circ$), and $18.54$ forgets the factor 2.
- id: trig-m6-r2-h32
  lesson: trig-m6-h-ptolemy
  type: text
  topic: Chords and Ptolemy's theorem
  stem: 'Convert the sexagesimal value $1;2,50$ to a decimal, rounded to 4 decimal places: ___'
  accept: ['1.0472']
  explanation: |-
    $1;2,50 = 1 + \tfrac{2}{60} + \tfrac{50}{3600} = 1 + 0.03333 + 0.01389 = 1.04722$, which is $1.0472$ to 4 decimal places. That is Ptolemy's chord of $1^\circ$; the modern value is $120\sin 0.5^\circ \approx 1.04718$.
- id: trig-m6-r2-h33
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: '$A$, $B$, $C$, $D$ lie on a circle in that order. Which equation does Ptolemy''s theorem give?'
  choices:
    - '$AC\cdot BD = AB\cdot CD + AD\cdot BC$'
    - '$AC\cdot BD = AB\cdot BC + CD\cdot DA$'
    - '$AC + BD = AB + CD$'
    - '$AC^2 + BD^2 = AB^2 + BC^2 + CD^2 + DA^2$'
  answer: 0
  explanation: |-
    The product of the diagonals ($AC$ and $BD$) equals the sum of the products of the two pairs of opposite sides ($AB$ with $CD$, and $AD$ with $BC$). The second choice multiplies adjacent sides.
- id: trig-m6-r2-h34
  lesson: trig-m6-h-ptolemy
  type: text
  topic: Chords and Ptolemy's theorem
  stem: 'A cyclic quadrilateral $ABCD$ has $AB = 6$, $BC = 12$, $CD = 9$, $DA = 6$ and diagonal $AC = 12$. Then $BD =$ ___.'
  accept: ['10.5', '21/2']
  explanation: |-
    $AC\cdot BD = AB\cdot CD + AD\cdot BC$: $12\cdot BD = 6\cdot 9 + 6\cdot 12 = 54 + 72 = 126$, so $BD = 10.5$.
- id: trig-m6-r2-h35
  lesson: trig-m6-h-ptolemy
  type: label
  topic: Chords and Ptolemy's theorem
  stem: 'The circle has diameter $AC = 1$, with $\angle BAC = \alpha$ and $\angle CAD = \beta$. Name the numbered lengths.'
  image: {src: images/trig-m6-h-ptolemy-sum-blank.svg, alt: 'A circle with horizontal diameter AC of length 1, point B on the upper arc and D on the lower arc, with right angles at B and D, angle alpha at A above the diameter and angle beta below it. The sides AB, BC, CD, DA and the diagonal BD are numbered.'}
  labels:
    - {x: 36.2, y: 29.0, text: cos α}
    - {x: 69.6, y: 29.0, text: sin α}
    - {x: 77.4, y: 66.3, text: sin β}
    - {x: 44.0, y: 66.3, text: cos β}
    - {x: 60.5, y: 30.4, text: sin(α + β)}
  distractors: [cos(α + β), tan α]
  explanation: |-
    Triangle $ABC$ has a right angle at $B$ (angle in a semicircle) and hypotenuse 1, so $AB = \cos\alpha$ and $BC = \sin\alpha$; likewise $AD = \cos\beta$ and $CD = \sin\beta$. In a circle of diameter 1 each chord is the sine of an inscribed angle on it, and $BD$ is cut off by $\angle BAD = \alpha + \beta$. Ptolemy's theorem then reads $1\cdot\sin(\alpha + \beta) = \cos\alpha\sin\beta + \cos\beta\sin\alpha$.
- id: trig-m6-r2-h36
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'In the circle of diameter 1 with diameter $AC$, why is the diagonal $BD$ equal to $\sin(\alpha + \beta)$?'
  choices:
    - '$BD$ is a diameter of the circle'
    - 'Triangle $ABD$ has a right angle at $B$'
    - '$BD$ is cut off by the inscribed angle $\angle BAD = \alpha + \beta$, and every chord of this circle is the sine of such an angle'
    - '$BD$ is the sum of $BC$ and $CD$'
  answer: 2
  explanation: |-
    An inscribed angle $\varphi$ cuts off the same arc as a central angle $2\varphi$, so its chord is $2R\sin\varphi = \sin\varphi$ when $R = \tfrac12$. $BD$ is not a diameter (only $AC$ is), the right angles are at $B$ and $D$ in triangles $ABC$ and $ADC$, and $BD < BC + CD$ by the triangle inequality.
- id: trig-m6-r2-h37
  lesson: trig-m6-h-ptolemy
  type: order
  topic: Chords and Ptolemy's theorem
  stem: 'Put the stages of building Ptolemy''s table of chords in order.'
  items:
    - 'Chords of $36^\circ$, $60^\circ$, $72^\circ$, $90^\circ$ and $120^\circ$ from regular polygons'
    - 'Chord of $12^\circ$ from the difference formula ($72^\circ - 60^\circ$)'
    - 'Chords of $6^\circ$, $3^\circ$, $1\tfrac12^\circ$ and $\tfrac34^\circ$ by halving'
    - 'Bounds on the chord of $1^\circ$ from the chords of $\tfrac34^\circ$ and $1\tfrac12^\circ$'
    - 'The rest of the table, in $\tfrac12^\circ$ steps, from the sum formula'
  explanation: |-
    Each stage needs the one before: the $12^\circ$ chord needs the $72^\circ$ and $60^\circ$ chords, the halvings start from $12^\circ$, the inequality uses the $\tfrac34^\circ$ and $1\tfrac12^\circ$ chords, and the sum formula builds on the small chords.
- id: trig-m6-r2-h38
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'Which statements about the history of chord tables are accurate? Select all that apply.'
  choices:
    - 'The oldest surviving table of chords is in Ptolemy''s Almagest'
    - 'Ptolemy used a circle of radius 60'
    - 'Ptolemy''s table lists chords in steps of $1^\circ$'
    - 'Ptolemy defined the sine function and named it'
    - 'An earlier table, now lost, is usually credited to Hipparchus'
  answer: [0, 1, 4]
  explanation: |-
    Ptolemy's Almagest (second century CE) has the oldest surviving chord table, computed for a circle of radius 60 in base-60 arithmetic, in steps of $\tfrac12^\circ$. Hipparchus's earlier table is lost. Ptolemy worked with chords; the half-chord (sine) tables came later, in India, and the word "sine" came through Arabic and Latin.
- id: trig-m6-r2-h39
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'With $R = 60$, Ptolemy''s rule $120\cdot\text{crd}(\alpha - \beta) = \text{crd}\,\alpha\cdot\text{crd}(180^\circ - \beta) - \text{crd}\,\beta\cdot\text{crd}(180^\circ - \alpha)$ is which modern identity?'
  choices: ['The sine difference formula', 'The cosine difference formula', 'The half-angle formula for sine', 'The Pythagorean identity']
  answer: 0
  explanation: |-
    $\text{crd}\,\theta = 120\sin\tfrac{\theta}{2}$ and $\text{crd}(180^\circ - \theta) = 120\cos\tfrac{\theta}{2}$. Dividing the rule by $120^2$ gives $\sin\tfrac{\alpha - \beta}{2} = \sin\tfrac{\alpha}{2}\cos\tfrac{\beta}{2} - \cos\tfrac{\alpha}{2}\sin\tfrac{\beta}{2}$, the sine difference formula.
- id: trig-m6-r2-h40
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'Ptolemy used $\dfrac{\text{crd}\,\alpha}{\text{crd}\,\beta} < \dfrac{\alpha}{\beta}$ for $\beta < \alpha$. Which upper bound on $\text{crd}\,1^\circ$ does it give?'
  choices:
    - '$\text{crd}\,1^\circ < \tfrac43\,\text{crd}\,\tfrac34^\circ$'
    - '$\text{crd}\,1^\circ < \tfrac23\,\text{crd}\,1\tfrac12^\circ$'
    - '$\text{crd}\,1^\circ < \tfrac34\,\text{crd}\,\tfrac34^\circ$'
    - '$\text{crd}\,1^\circ < \tfrac32\,\text{crd}\,1\tfrac12^\circ$'
  answer: 0
  explanation: |-
    With $\alpha = 1^\circ$ and $\beta = \tfrac34^\circ$: $\tfrac{\text{crd}\,1^\circ}{\text{crd}\,\frac34^\circ} < \tfrac{1}{3/4} = \tfrac43$. The same inequality with $\alpha = 1\tfrac12^\circ$, $\beta = 1^\circ$ gives the lower bound $\text{crd}\,1^\circ > \tfrac23\,\text{crd}\,1\tfrac12^\circ$, so the second choice points the wrong way.
- id: trig-m6-r2-h41
  lesson: trig-m6-h-ptolemy
  type: match
  topic: Chords and Ptolemy's theorem
  stem: 'Match each term to its meaning.'
  pairs:
    - [Chord of θ, Segment joining the ends of an arc with central angle θ]
    - [Sexagesimal, Written in base 60]
    - [Cyclic quadrilateral, A quadrilateral whose four vertices lie on one circle]
    - [Almagest, Ptolemy's astronomy book containing the chord table]
  distractors: [Written in base 10]
  explanation: |-
    The chord is the straight segment under an arc; sexagesimal numbers count in sixtieths, like minutes and seconds; Ptolemy's theorem is about cyclic quadrilaterals; and the Almagest is the work in which Ptolemy's table survives.
- id: trig-m6-r2-h42
  lesson: trig-m6-h-ptolemy
  topic: Chords and Ptolemy's theorem
  stem: 'Apply Ptolemy''s theorem to a rectangle with sides $a$ and $b$ and diagonals $d$. What does it say?'
  choices: ['$d = a + b$', '$2d = a + b$', '$d^2 = 2ab$', '$d^2 = a^2 + b^2$']
  answer: 3
  explanation: |-
    A rectangle is cyclic. Its diagonals are both $d$ and its opposite sides are equal, so $d\cdot d = a\cdot a + b\cdot b$: the Pythagorean theorem.
