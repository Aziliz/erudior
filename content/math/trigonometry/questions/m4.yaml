# Module 4: Graphs of trig functions
- id: trig-q-1301
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  stem: 'On $[0, 2\pi]$, where does $y = \sin x$ reach its maximum?'
  choices: ['$x = 0$', '$x = \pi$', '$x = \tfrac{\pi}{2}$', '$x = \tfrac{3\pi}{2}$']
  answer: 2
  explanation: |-
    The key points of sine are $(0,0), (\tfrac{\pi}{2}, 1), (\pi, 0), (\tfrac{3\pi}{2}, -1), (2\pi, 0)$. The
    maximum, 1, is at $\tfrac{\pi}{2}$; $\tfrac{3\pi}{2}$ is the minimum.
- id: trig-q-1302
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'Where does $y = \cos x$ cross the $x$-axis on $[0, 2\pi]$?'
  choices: ['$x = 0$ and $x = \pi$', '$x = \tfrac{\pi}{2}$ and $x = \tfrac{3\pi}{2}$', '$x = \tfrac{\pi}{4}$ and $x = \tfrac{5\pi}{4}$', '$x = 0$, $\pi$ and $2\pi$']
  answer: 1
  explanation: |-
    $\cos x = 0$ where the unit-circle point is at the top or bottom: $x = \tfrac{\pi}{2}$ and $\tfrac{3\pi}{2}$.
    $0$, $\pi$ and $2\pi$ are the zeros of sine.
- id: trig-q-1303
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  stem: 'What is the amplitude of $y = -4\sin x$?'
  choices: ['$-4$', '$8$', '$4$', '$2$']
  answer: 2
  explanation: |-
    Amplitude is $|A| = |-4| = 4$. The negative sign reflects the graph across the $x$-axis but
    does not make the amplitude negative. ($8$ is the max-to-min distance.)
- id: trig-q-1304
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'What is the range of $y = 3\cos x$?'
  choices: ['$[-1, 1]$', '$[0, 3]$', '$[-3, 3]$', 'All real numbers']
  answer: 2
  explanation: |-
    Every value of $\cos x$ in $[-1, 1]$ is multiplied by 3, giving $[-3, 3]$.
- id: trig-q-1305
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'How does the graph of $y = -\sin x$ compare with the graph of $y = \sin x$?'
  choices: ['It is shifted $\pi$ units up', 'It has twice the period', 'It is reflected across the $y$-axis only, so it looks identical', 'It is reflected across the $x$-axis, so it goes down first from the origin']
  answer: 3
  explanation: |-
    Multiplying by $-1$ flips every $y$-value. Starting from $(0, 0)$, $-\sin x$ heads down to $-1$ at
    $\tfrac{\pi}{2}$. Because sine is odd, this is also what reflecting across the $y$-axis gives, so the
    claim that it "looks identical" is wrong: the result is not the graph of $y = \sin x$.
- id: trig-q-1306
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'Which identity describes how the cosine graph relates to the sine graph?'
  choices: ['$\cos x = \sin(x + \tfrac{\pi}{2})$', '$\cos x = \sin(x + \pi)$', '$\cos x = -\sin x$', '$\cos x = \sin(2x)$']
  answer: 0
  explanation: |-
    Sliding the sine curve $\tfrac{\pi}{2}$ to the left puts its peak at $x = 0$, exactly where cosine peaks:
    $\cos x = \sin(x + \tfrac{\pi}{2})$.
- id: trig-q-1307
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  stem: 'Which graph is symmetric about the $y$-axis?'
  choices: ['$y = \sin x$', '$y = \cos x$', '$y = 2\sin x$', '$y = -\sin x$']
  answer: 1
  explanation: |-
    Symmetry about the $y$-axis means $f(-x) = f(x)$, an even function. Cosine is even; sine and its
    multiples are odd (symmetric about the origin).
- id: trig-q-1308
  lesson: trig-graph-sincos
  module_quiz: true
  topic: Graphs of sine and cosine
  stem: 'What is the minimum value of $y = 2\cos x$, and where on $[0, 2\pi]$ does it occur?'
  choices: ['$-2$ at $x = \pi$', '$0$ at $x = \tfrac{\pi}{2}$', '$-2$ at $x = \tfrac{3\pi}{2}$', '$-1$ at $x = \pi$']
  answer: 0
  explanation: |-
    Cosine is smallest, $-1$, at $x = \pi$; times 2 gives $-2$. ($\tfrac{3\pi}{2}$ is where sine is smallest.)
- id: trig-q-1309
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'On which intervals within $[0, 2\pi]$ is $y = \sin x$ increasing?'
  choices: ['$[0, \pi]$', '$[\tfrac{\pi}{2}, \tfrac{3\pi}{2}]$', '$[0, \tfrac{\pi}{2}]$ and $[\tfrac{3\pi}{2}, 2\pi]$', '$[\pi, 2\pi]$']
  answer: 2
  explanation: |-
    Sine rises from 0 to 1 on $[0, \tfrac{\pi}{2}]$, falls to $-1$ on $[\tfrac{\pi}{2}, \tfrac{3\pi}{2}]$, then rises
    back to 0 on $[\tfrac{3\pi}{2}, 2\pi]$.
- id: trig-q-1310
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'The graph of $y = a\sin x$ passes through $\left(\tfrac{\pi}{2}, -5\right)$. What is $a$?'
  choices: ['$5$', '$-\tfrac{10}{\pi}$', '$-\tfrac{5}{2}$', '$-5$']
  answer: 3
  explanation: |-
    $a\sin\tfrac{\pi}{2} = a \cdot 1 = -5$, so $a = -5$: amplitude 5, reflected.
- id: trig-q-1311
  lesson: trig-graph-sincos
  topic: Graphs of sine and cosine
  stem: 'A student sketches $y = \sin x$ by joining its five key points with straight line segments. What is wrong with the sketch?'
  choices: ['Nothing; sine is piecewise linear', 'The key points are wrong', 'The period is wrong', 'The real curve is smooth: rounded at the peaks and steepest where it crosses the axis']
  answer: 3
  explanation: |-
    Between key points sine is curved. For example $\sin\tfrac{\pi}{6} = 0.5$, but a straight line from
    $(0,0)$ to $(\tfrac{\pi}{2}, 1)$ would give only $\tfrac13$ at $\tfrac{\pi}{6}$.

- id: trig-q-1401
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  stem: 'What is the period of $y = \sin(4x)$?'
  choices: ['$4$', '$8\pi$', '$\tfrac{\pi}{2}$', '$\tfrac{\pi}{4}$']
  answer: 2
  explanation: |-
    Period $= \tfrac{2\pi}{B} = \tfrac{2\pi}{4} = \tfrac{\pi}{2}$. ($\tfrac{\pi}{4}$ would be the period of $\tan 4x$.)
- id: trig-q-1402
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  stem: 'What is the phase shift of $y = \sin\!\left(2x - \tfrac{\pi}{2}\right)$?'
  choices: ['$\tfrac{\pi}{2}$ to the right', '$\tfrac{\pi}{4}$ to the right', '$\tfrac{\pi}{4}$ to the left', '$\pi$ to the right']
  answer: 1
  explanation: |-
    Factor out $B = 2$: $2\left(x - \tfrac{\pi}{4}\right)$. The shift is $\tfrac{\pi}{4}$ right. Reading $\tfrac{\pi}{2}$
    straight from the unfactored form is the classic error.
- id: trig-q-1403
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'What is the range of $y = 3\sin\!\left(2x - \tfrac{\pi}{2}\right) + 1$?'
  choices: ['$[-3, 3]$', '$[1, 4]$', '$[-4, 2]$', '$[-2, 4]$']
  answer: 3
  explanation: |-
    Midline $y = 1$ and amplitude 3: from $1 - 3 = -2$ to $1 + 3 = 4$.
- id: trig-q-1404
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'What is the period of $y = -2\cos\!\left(\tfrac{\pi}{3}x\right)$?'
  choices: ['$\tfrac{2\pi^2}{3}$', '$\tfrac{\pi}{3}$', '$3$', '$6$']
  answer: 3
  explanation: |-
    $\tfrac{2\pi}{B} = \tfrac{2\pi}{\pi/3} = 2\pi \cdot \tfrac{3}{\pi} = 6$.
- id: trig-q-1405
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'What is the midline of $y = 5\cos x - 3$?'
  choices: ['$y = -3$', '$y = 5$', '$y = 0$', '$y = 2$']
  answer: 0
  explanation: |-
    The vertical shift is $D = -3$, so the midline is $y = -3$; the graph runs from $-8$ to $2$.
- id: trig-q-1406
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  stem: 'A sinusoid has a maximum at $(1, 5)$ and the next minimum at $(4, -1)$. Which equation fits?'
  choices: ['$y = 3\cos\!\left(\tfrac{\pi}{3}(x - 1)\right) + 2$', '$y = 3\cos\!\left(\tfrac{\pi}{6}(x - 1)\right) + 2$', '$y = 6\cos\!\left(\tfrac{\pi}{3}(x - 1)\right) + 2$', '$y = 3\cos\!\left(\tfrac{\pi}{3}(x + 1)\right) + 2$']
  answer: 0
  explanation: |-
    $D = \tfrac{5 + (-1)}{2} = 2$, $A = \tfrac{5 - (-1)}{2} = 3$. Max to min is half a period, 3, so the
    period is 6 and $B = \tfrac{\pi}{3}$. Cosine peaks where its input is 0, so $C = 1$.
    (With $B = \tfrac{\pi}{6}$ the period would be 12, not 6.)
- id: trig-q-1407
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'What is the phase shift of $y = \cos(3x + \pi)$?'
  choices: ['$\pi$ to the left', '$\tfrac{\pi}{3}$ to the right', '$\tfrac{\pi}{3}$ to the left', '$3\pi$ to the left']
  answer: 2
  explanation: |-
    $3x + \pi = 3\left(x + \tfrac{\pi}{3}\right) = 3\left(x - \left(-\tfrac{\pi}{3}\right)\right)$, so the shift is $\tfrac{\pi}{3}$ to the left.
- id: trig-q-1408
  lesson: trig-transform
  module_quiz: true
  topic: Sinusoidal transformations
  stem: 'What is the amplitude of $y = -0.5\sin x + 7$?'
  choices: ['$7$', '$-0.5$', '$7.5$', '$0.5$']
  answer: 3
  explanation: |-
    Amplitude $= |A| = 0.5$. The $+7$ moves the midline; it doesn't change the amplitude.
- id: trig-q-1409
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'What is the period of $y = 4\sin\tfrac{x}{2}$?'
  choices: ['$\pi$', '$4\pi$', '$2$', '$8\pi$']
  answer: 1
  explanation: |-
    $B = \tfrac12$, so the period is $\tfrac{2\pi}{1/2} = 4\pi$. A $B$ less than 1 stretches the graph.
- id: trig-q-1410
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'For $y = 2\cos(x - \pi) + 1$, what is the maximum value and the first $x \ge 0$ where it occurs?'
  choices: ['$3$ at $x = 0$', '$2$ at $x = \pi$', '$1$ at $x = \pi$', '$3$ at $x = \pi$']
  answer: 3
  explanation: |-
    Max $= D + |A| = 1 + 2 = 3$. Cosine peaks where its input is $0$: $x - \pi = 0$, so $x = \pi$.
    (At $x = 0$ the input is $-\pi$ and $y = -1$, the minimum.)
- id: trig-q-1411
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'A sinusoid has period 10. What is $B$ in $y = A\sin(Bx)$?'
  choices: ['$\tfrac{\pi}{5}$', '$10$', '$20\pi$', '$\tfrac{\pi}{10}$']
  answer: 0
  explanation: |-
    $\text{period} = \tfrac{2\pi}{B}$, so $B = \tfrac{2\pi}{10} = \tfrac{\pi}{5}$.
- id: trig-q-1412
  lesson: trig-transform
  topic: Sinusoidal transformations
  stem: 'How many complete cycles does $y = \sin(6\pi x)$ make on the interval $[0, 1]$?'
  choices: ['$6$', '$\tfrac13$', '$6\pi$', '$3$']
  answer: 3
  explanation: |-
    The period is $\tfrac{2\pi}{6\pi} = \tfrac13$, so 3 cycles fit in an interval of length 1 (frequency 3).

- id: trig-q-1501
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  stem: 'What is the period of $y = \tan(3x)$?'
  choices: ['$\tfrac{2\pi}{3}$', '$3\pi$', '$\tfrac{\pi}{3}$', '$\pi$']
  answer: 2
  explanation: |-
    Tangent's basic period is $\pi$, so $\tan(Bx)$ has period $\tfrac{\pi}{B} = \tfrac{\pi}{3}$. Using $2\pi$ gives
    the wrong answer $\tfrac{2\pi}{3}$.
- id: trig-q-1502
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'Where are the vertical asymptotes of $y = \tan x$?'
  choices: ['$x = k\pi$', '$x = \tfrac{\pi}{2} + k\pi$', '$x = \tfrac{\pi}{4} + k\pi$', '$x = 2k\pi$']
  answer: 1
  explanation: |-
    Tangent is $\tfrac{\sin x}{\cos x}$, undefined where $\cos x = 0$: $x = \tfrac{\pi}{2} + k\pi$.
    $x = k\pi$ are the zeros of tangent (and the asymptotes of cotangent).
- id: trig-q-1503
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'Where are the asymptotes of $y = 2\tan\tfrac{x}{2}$ closest to the origin?'
  choices: ['$x = \pm\tfrac{\pi}{2}$', '$x = \pm\tfrac{\pi}{4}$', '$x = \pm\pi$', '$x = \pm2\pi$']
  answer: 2
  explanation: |-
    Set the input equal to $\pm\tfrac{\pi}{2}$: $\tfrac{x}{2} = \pm\tfrac{\pi}{2}$ gives $x = \pm\pi$. The period is $2\pi$.
- id: trig-q-1504
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'Where are the zeros of $y = \cot x$?'
  choices: ['$x = \tfrac{\pi}{2} + k\pi$', '$x = k\pi$', '$x = \tfrac{\pi}{4} + k\pi$', '$y = \cot x$ has no zeros']
  answer: 0
  explanation: |-
    $\cot x = \tfrac{\cos x}{\sin x} = 0$ where $\cos x = 0$: $x = \tfrac{\pi}{2} + k\pi$.
- id: trig-q-1505
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  stem: 'Which statement about the branches of tangent and cotangent is true?'
  choices: ['Both increase on every branch', 'Both decrease on every branch', 'Tangent decreases and cotangent increases', 'Tangent increases and cotangent decreases on every branch']
  answer: 3
  explanation: |-
    Tangent rises from $-\infty$ to $\infty$ between consecutive asymptotes; cotangent falls from $\infty$ to
    $-\infty$ between consecutive asymptotes.
- id: trig-q-1506
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'Where are the asymptotes of $y = \tan\!\left(2x - \tfrac{\pi}{2}\right)$?'
  choices: ['$x = \tfrac{\pi}{4} + k\pi$', '$x = \tfrac{\pi}{4} + \tfrac{k\pi}{2}$', '$x = \tfrac{\pi}{2} + k\pi$', '$x = \tfrac{k\pi}{2}$']
  answer: 3
  explanation: |-
    $2x - \tfrac{\pi}{2} = \tfrac{\pi}{2} + k\pi$ gives $2x = \pi + k\pi$, $x = \tfrac{\pi}{2} + \tfrac{k\pi}{2}$, which is every
    multiple of $\tfrac{\pi}{2}$. ($x = \tfrac{\pi}{4} + \tfrac{k\pi}{2}$ are the zeros.)
- id: trig-q-1507
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  stem: 'What is the period of $y = 3\cot(\pi x)$?'
  choices: ['$1$', '$2$', '$\pi$', '$\tfrac{1}{3}$']
  answer: 0
  explanation: |-
    Period $= \tfrac{\pi}{B} = \tfrac{\pi}{\pi} = 1$. The 3 stretches vertically and doesn't affect the period.
- id: trig-q-1508
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'What is the range of $y = \tan x$?'
  choices: ['$[-1, 1]$', '$(-\tfrac{\pi}{2}, \tfrac{\pi}{2})$', 'All real numbers', '$(-\infty, -1] \cup [1, \infty)$']
  answer: 2
  explanation: |-
    Each branch rises from $-\infty$ to $+\infty$, so tangent takes every real value.
    $(-\tfrac{\pi}{2}, \tfrac{\pi}{2})$ is the $x$-interval of one branch.
- id: trig-q-1509
  lesson: trig-graph-tan
  module_quiz: true
  topic: Graphs of tangent and cotangent
  stem: 'Why does $y = \tan x$ have a vertical asymptote at $x = \tfrac{\pi}{2}$?'
  choices: ['Because $\sin\tfrac{\pi}{2} = 0$', 'Because $\cos x \to 0$ there while $\sin x \to 1$, so $\tfrac{\sin x}{\cos x}$ grows without bound', 'Because tangent has period $\tfrac{\pi}{2}$', 'Because $\tan\tfrac{\pi}{2} = 1$']
  answer: 1
  explanation: |-
    Dividing a number near 1 by a number near 0 gives a number of huge size. From the left the
    quotient goes to $+\infty$, from the right to $-\infty$.
- id: trig-q-1510
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'Which point lies on the graph of $y = \tan x + 2$?'
  choices: ['$\left(\tfrac{\pi}{4}, 1\right)$', '$\left(\tfrac{\pi}{2}, 2\right)$', '$(0, 0)$', '$\left(\tfrac{\pi}{4}, 3\right)$']
  answer: 3
  explanation: |-
    $\tan\tfrac{\pi}{4} + 2 = 1 + 2 = 3$. At $\tfrac{\pi}{2}$ the function is undefined, and at 0 it equals 2.
- id: trig-q-1511
  lesson: trig-graph-tan
  topic: Graphs of tangent and cotangent
  stem: 'A student says the period of $y = \tan(4x)$ is $\tfrac{\pi}{2}$. What is the correct period, and what went wrong?'
  choices: ['$\tfrac{\pi}{4}$; the student used $\tfrac{2\pi}{B}$ instead of $\tfrac{\pi}{B}$', '$4\pi$; the student divided instead of multiplying', '$\tfrac{\pi}{2}$ is correct', '$\pi$; $B$ does not affect tangent''s period']
  answer: 0
  explanation: |-
    Tangent's basic period is $\pi$, so the period is $\tfrac{\pi}{4}$. The $\tfrac{2\pi}{B}$ formula is for sine,
    cosine, secant and cosecant.

- id: trig-q-1601
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  stem: 'Where are the vertical asymptotes of $y = \sec x$?'
  choices: ['$x = k\pi$', '$x = 2k\pi$', '$x = \tfrac{\pi}{2} + k\pi$', '$y = \sec x$ has none']
  answer: 2
  explanation: |-
    $\sec x = \tfrac{1}{\cos x}$ is undefined at the zeros of cosine, $x = \tfrac{\pi}{2} + k\pi$.
- id: trig-q-1602
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  stem: 'What is the range of $y = 2\csc x$?'
  choices: ['$[-2, 2]$', '$[2, \infty)$', '$(-\infty, -1] \cup [1, \infty)$', '$(-\infty, -2] \cup [2, \infty)$']
  answer: 3
  explanation: |-
    The guide $2\sin x$ has max 2 and min $-2$; the branches of $2\csc x$ turn at those values and
    head away from the midline. So $|y| \ge 2$.
- id: trig-q-1603
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'At which point does $y = \sec x$ have a local minimum?'
  choices: ['$(\pi, -1)$', '$\left(\tfrac{\pi}{2}, 0\right)$', '$(0, 0)$', '$(0, 1)$']
  answer: 3
  explanation: |-
    Where $\cos x$ has a maximum ($\cos 0 = 1$), $\sec x = 1$ and is larger nearby: a local minimum.
    At $(\pi, -1)$ secant has a local maximum.
- id: trig-q-1604
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'What is the range of $y = \sec(2x) + 1$?'
  choices: ['$(-\infty, 0] \cup [2, \infty)$', '$(-\infty, -1] \cup [1, \infty)$', '$[0, 2]$', '$(-\infty, 1] \cup [3, \infty)$']
  answer: 0
  explanation: |-
    $\sec(2x)$ takes values $\le -1$ or $\ge 1$; adding 1 gives $\le 0$ or $\ge 2$.
- id: trig-q-1605
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'The asymptotes of $y = \csc x$ come from which feature of $y = \sin x$?'
  choices: ['Its maximum points', 'Its zeros', 'Its minimum points', 'Its $y$-intercept']
  answer: 1
  explanation: |-
    Where $\sin x = 0$, $\tfrac{1}{\sin x}$ is undefined and blows up nearby. The maxima and minima of
    sine are where the cosecant branches turn.
- id: trig-q-1606
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'What is the period of $y = \csc(3x)$?'
  choices: ['$\tfrac{\pi}{3}$', '$3\pi$', '$6\pi$', '$\tfrac{2\pi}{3}$']
  answer: 3
  explanation: |-
    Cosecant has the same period as sine: $\tfrac{2\pi}{B} = \tfrac{2\pi}{3}$.
- id: trig-q-1607
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  stem: 'Between its asymptotes at $x = \tfrac{\pi}{4}$ and $x = \tfrac{5\pi}{4}$, the graph of $y = -3\csc\!\left(x - \tfrac{\pi}{4}\right)$ has one branch. What is its vertex?'
  choices: ['$\left(\tfrac{3\pi}{4}, 3\right)$', '$\left(\tfrac{3\pi}{4}, -1\right)$', '$\left(\tfrac{\pi}{2}, -3\right)$', '$\left(\tfrac{3\pi}{4}, -3\right)$']
  answer: 3
  explanation: |-
    Midway, $x = \tfrac{3\pi}{4}$, the guide $-3\sin\!\left(x - \tfrac{\pi}{4}\right) = -3\sin\tfrac{\pi}{2} = -3$. The
    negative $A$ flips the branch, so it opens downward from $\left(\tfrac{3\pi}{4}, -3\right)$.
- id: trig-q-1608
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'Which value can $\sec x$ never take?'
  choices: ['$-1$', '$0.5$', '$3$', '$-2.5$']
  answer: 1
  explanation: |-
    $|\sec x| = \tfrac{1}{|\cos x|} \ge 1$, so values strictly between $-1$ and $1$, like $0.5$, are impossible.
- id: trig-q-1609
  lesson: trig-graph-sec
  module_quiz: true
  topic: Graphs of secant and cosecant
  stem: 'What is the range of $y = 4\sec x + 1$?'
  choices: ['$(-\infty, -3] \cup [5, \infty)$', '$[-3, 5]$', '$(-\infty, -4] \cup [4, \infty)$', '$(-\infty, -5] \cup [3, \infty)$']
  answer: 0
  explanation: |-
    $(-\infty, D - |A|] \cup [D + |A|, \infty)$ with $D = 1$, $|A| = 4$: $(-\infty, -3] \cup [5, \infty)$.
- id: trig-q-1610
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'Which symmetry does the graph of $y = \sec x$ have?'
  choices: ['Symmetric about the origin', 'Symmetric about the $x$-axis', 'Symmetric about the $y$-axis', 'No symmetry']
  answer: 2
  explanation: |-
    Secant inherits cosine's evenness: $\sec(-x) = \sec x$, so the graph is symmetric about the $y$-axis.
- id: trig-q-1611
  lesson: trig-graph-sec
  topic: Graphs of secant and cosecant
  stem: 'Where are the asymptotes of $y = \sec\tfrac{x}{2}$?'
  choices: ['$x = \tfrac{\pi}{2} + k\pi$', '$x = \tfrac{\pi}{4} + \tfrac{k\pi}{2}$', '$x = 2k\pi$', '$x = \pi + 2k\pi$']
  answer: 3
  explanation: |-
    $\cos\tfrac{x}{2} = 0$ when $\tfrac{x}{2} = \tfrac{\pi}{2} + k\pi$, so $x = \pi + 2k\pi$. The period is $4\pi$, and
    the asymptotes are $2\pi$ apart.

- id: trig-q-1701
  lesson: trig-modeling
  module_quiz: true
  topic: Sinusoidal models
  stem: 'Average daily highs in a city range from $31^\circ$F in January to $89^\circ$F in July. In a sinusoidal model, what are the midline and amplitude?'
  choices: ['Midline 58, amplitude 31', 'Midline 29, amplitude 60', 'Midline 60, amplitude 58', 'Midline 60, amplitude 29']
  answer: 3
  explanation: |-
    $D = \tfrac{89 + 31}{2} = 60$ and $|A| = \tfrac{89 - 31}{2} = 29$. ($58$ is the full max-minus-min range.)
- id: trig-q-1702
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'A quantity repeats every 12 months. If $t$ is in months, what is $B$ in $y = A\cos(B(t - C)) + D$?'
  choices: ['$12$', '$\tfrac{\pi}{12}$', '$\tfrac{\pi}{6}$', '$24\pi$']
  answer: 2
  explanation: |-
    $B = \tfrac{2\pi}{\text{period}} = \tfrac{2\pi}{12} = \tfrac{\pi}{6}$.
- id: trig-q-1703
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'Using $T(t) = 29\cos\!\left(\tfrac{\pi}{6}(t - 7)\right) + 60$ (with $t = 1$ for January), estimate the average high in May.'
  choices: ['$45.5^\circ$F', '$60^\circ$F', '$85.1^\circ$F', '$74.5^\circ$F']
  answer: 3
  explanation: |-
    $T(5) = 29\cos\!\left(-\tfrac{\pi}{3}\right) + 60 = 29(0.5) + 60 = 74.5$. ($45.5$ uses $-\tfrac12$.)
- id: trig-q-1704
  lesson: trig-modeling
  module_quiz: true
  topic: Sinusoidal models
  stem: 'A rider''s height on a Ferris wheel is $h(t) = 30 - 25\cos\!\left(\tfrac{\pi}{2}t\right)$ meters, with $t$ in minutes. How high is the rider at $t = 2$?'
  choices: ['$5$ m', '$30$ m', '$55$ m', '$42.5$ m']
  answer: 2
  explanation: |-
    $\cos(\pi) = -1$, so $h(2) = 30 + 25 = 55$ m, the top. The period is 4 min, so $t = 2$ is half a turn
    after boarding at the bottom.
- id: trig-q-1705
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'For $h(t) = 30 - 25\cos\!\left(\tfrac{\pi}{2}t\right)$, when does the rider first reach 42.5 m?'
  choices: ['$t = \tfrac43$ min', '$t = \tfrac23$ min', '$t = 1$ min', '$t = \tfrac83$ min']
  answer: 0
  explanation: |-
    $-25\cos\!\left(\tfrac{\pi}{2}t\right) = 12.5$ gives $\cos\!\left(\tfrac{\pi}{2}t\right) = -\tfrac12$. The first solution is
    $\tfrac{\pi}{2}t = \tfrac{2\pi}{3}$, so $t = \tfrac43$. ($\tfrac83$ is the second time, on the way down.)
- id: trig-q-1706
  lesson: trig-modeling
  module_quiz: true
  topic: Simple harmonic motion
  stem: 'A spring''s displacement is $d = 6\sin(3\pi t)$ cm, $t$ in seconds. What is its frequency?'
  choices: ['$3\pi$ Hz', '$1.5$ Hz', '$\tfrac23$ Hz', '$6$ Hz']
  answer: 1
  explanation: |-
    Frequency $= \tfrac{\omega}{2\pi} = \tfrac{3\pi}{2\pi} = 1.5$ cycles per second. $\tfrac23$ s is the period.
- id: trig-q-1707
  lesson: trig-modeling
  topic: Simple harmonic motion
  stem: 'What is the displacement of $d = 6\sin(3\pi t)$ at $t = 0.25$ s?'
  choices: ['$3$ cm', '$-3\sqrt2$ cm', '$3\sqrt2 \approx 4.24$ cm', '$6$ cm']
  answer: 2
  explanation: |-
    $d = 6\sin(0.75\pi) = 6\sin\tfrac{3\pi}{4} = 6 \cdot \tfrac{\sqrt2}{2} = 3\sqrt2$.
- id: trig-q-1708
  lesson: trig-modeling
  module_quiz: true
  topic: Simple harmonic motion
  stem: 'A mass is pulled 4 cm below equilibrium and released, and makes 2 complete oscillations per second. Taking up as positive, which model fits?'
  choices: ['$d = 4\cos(4\pi t)$', '$d = -4\cos(2t)$', '$d = -4\sin(4\pi t)$', '$d = -4\cos(4\pi t)$']
  answer: 3
  explanation: |-
    It starts at its lowest point, $-4$, so use $-4\cos$. Frequency 2 Hz gives $\omega = 2\pi(2) = 4\pi$.
    A sine model would start at equilibrium.
- id: trig-q-1709
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'High tide is at 2:00 AM and the next low tide is at 8:12 AM. What is the period of the tide model?'
  choices: ['6.2 hours', '24.8 hours', '12 hours', '12.4 hours']
  answer: 3
  explanation: |-
    High to the next low is half a cycle: 6 h 12 min = 6.2 h. A full cycle is twice that, 12.4 h.
- id: trig-q-1710
  lesson: trig-modeling
  topic: Simple harmonic motion
  stem: 'In damped harmonic motion, such as $d = 4e^{-0.3t}\cos(4\pi t)$, what changes over time?'
  choices: ['The period shrinks', 'The frequency grows', 'The amplitude decreases', 'The midline rises']
  answer: 2
  explanation: |-
    The factor $4e^{-0.3t}$ acts as a shrinking amplitude, so the swings get smaller while the period
    stays $\tfrac{2\pi}{4\pi} = 0.5$ s.
- id: trig-q-1711
  lesson: trig-modeling
  topic: Sinusoidal models
  stem: 'Daylight in a city varies from 9.2 hours (shortest day) to 14.8 hours (longest day). What are the midline and amplitude of a sinusoidal model?'
  choices: ['Midline 12, amplitude 2.8', 'Midline 12, amplitude 5.6', 'Midline 14.8, amplitude 9.2', 'Midline 2.8, amplitude 12']
  answer: 0
  explanation: |-
    $D = \tfrac{14.8 + 9.2}{2} = 12$ and $|A| = \tfrac{14.8 - 9.2}{2} = 2.8$.
- id: trig-q-1712
  lesson: trig-modeling
  topic: Simple harmonic motion
  stem: 'A tuning fork vibrates at 440 Hz. In $d = a\sin(\omega t)$ with $t$ in seconds, what is $\omega$?'
  choices: ['$440$', '$\tfrac{440}{2\pi}$', '$220\pi$', '$880\pi$']
  answer: 3
  explanation: |-
    $\omega = 2\pi f = 2\pi(440) = 880\pi$ rad/s. The period is $\tfrac{1}{440}$ s.
