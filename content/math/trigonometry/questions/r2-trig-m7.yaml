# Round 2: trig-m7 (Oblique triangles). Core: q01-q20. Honors: h01-h28.

# ---------- Lesson 28: The law of sines ----------
- id: trig-m7-r2-q01
  lesson: trig-law-sines
  module_quiz: true
  topic: Law of sines
  type: text
  stem: 'In triangle $ABC$, $A = 50^\circ$, $B = 70^\circ$ and $a = 15$. Find $c$, rounded to two decimal places. Give only the number.'
  accept: ['16.96']
  explanation: |-
    The third angle is $C = 180^\circ - 50^\circ - 70^\circ = 60^\circ$. Then $c = \dfrac{a\sin C}{\sin A} = \dfrac{15\sin 60^\circ}{\sin 50^\circ} \approx 16.96$.

- id: trig-m7-r2-q02
  lesson: trig-law-sines
  topic: Law of sines
  type: order
  stem: 'Put the steps of the proof of the law of sines in order.'
  items:
    - 'Drop the altitude $h$ from $C$ to side $c$'
    - 'Write the altitude two ways: $h = b\sin A$ and $h = a\sin B$'
    - 'Set them equal: $b\sin A = a\sin B$'
    - 'Divide both sides by $\sin A\sin B$: $\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$'
  explanation: |-
    The altitude comes first; each right triangle it creates gives one expression for $h$; equating them gives $b\sin A = a\sin B$, and dividing by $\sin A\sin B$ puts each side over the sine of its opposite angle.

- id: trig-m7-r2-q03
  lesson: trig-law-sines
  topic: Law of sines
  stem: 'Which of these triangles can be started directly with the law of sines (no law of cosines first)? Select all that apply.'
  choices: ['$A = 40^\circ$, $B = 65^\circ$, $c = 10$', '$a = 8$, $b = 11$, $A = 35^\circ$', '$a = 5$, $b = 7$, $c = 9$', '$b = 6$, $c = 9$, $A = 50^\circ$', '$A = 30^\circ$, $C = 100^\circ$, $a = 7$']
  answer: [0, 1, 4]
  explanation: |-
    The law of sines needs a side together with its opposite angle. ASA ($A$, $B$, $c$): the third angle $C = 75^\circ$ pairs with $c$. SSA ($a$, $b$, $A$): $a$ and $A$ are a pair already. AAS ($A$, $C$, $a$): $a$ and $A$ are a pair. SSS (three sides) and SAS ($b$, $c$ and the angle $A$ between them) have no known pair, so they start with the law of cosines.

- id: trig-m7-r2-q04
  lesson: trig-law-sines
  module_quiz: true
  topic: Law of sines
  type: label
  stem: 'In this triangle, name each numbered part.'
  image: {src: images/trig-m7-parts-blank.svg, alt: 'Triangle ABC with vertex C at the top, A at the lower left and B at the lower right. A dashed segment drops from C straight down to the base AB, meeting it at a right angle. Markers sit on side BC, side AC, side AB and the dashed segment.'}
  labels:
