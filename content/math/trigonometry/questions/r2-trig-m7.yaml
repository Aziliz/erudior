    - {x: 25, y: 52.7, text: 'Side b'}
    - {x: 55, y: 83.8, text: 'Side c'}
    - {x: 36.7, y: 66.2, text: 'Altitude from C'}
  distractors: ['Altitude from A', 'Angle bisector from C']
  explanation: |-
    Each side is named for the angle across from it: $BC$ is opposite $A$, so it is $a$; $AC$ is opposite $B$, so it is $b$; $AB$ is opposite $C$, so it is $c$. The dashed segment from $C$ meets $AB$ at a right angle, so it is the altitude from $C$, the $h$ in the proof that $h = b\sin A = a\sin B$.

- id: trig-m7-r2-q05
  lesson: trig-law-sines
  topic: Law of sines
  type: match
  stem: 'Match each case to the parts that are known.'
  pairs:
    - ['AAS', 'Two angles and a side not between them']
    - ['ASA', 'Two angles and the side between them']
    - ['SSA', 'Two sides and an angle opposite one of them']
    - ['SAS', 'Two sides and the angle between them']
    - ['SSS', 'Three sides']
  distractors: ['Three angles']
  explanation: |-
    The letters list the known parts in order around the triangle. In ASA the side sits between the two angles; in AAS it doesn't. In SAS the angle sits between the two sides; in SSA it is opposite one of them. Three angles (AAA) fix only the shape, so it is not a case that can be solved.

# ---------- Lesson 29: The ambiguous case ----------
- id: trig-m7-r2-q06
  lesson: trig-ambiguous
  module_quiz: true
  topic: Ambiguous case
  type: text
  stem: 'SSA data have $A = 35^\circ$ and $b = 16$. There are two triangles exactly when ___ $< a <$ ___. Round the first number to two decimal places.'
  accept:
    - ['9.18']
    - ['16']
  explanation: |-
    For acute $A$, two triangles occur when $h < a < b$, with $h = b\sin A = 16\sin 35^\circ \approx 9.18$. So $9.18 < a < 16$. (If $a \ge 16$ there is one triangle; if $a < 9.18$, none.)

- id: trig-m7-r2-q07
  lesson: trig-ambiguous
  topic: Ambiguous case
  type: order
  stem: 'Put the steps for solving an SSA triangle (given $A$, $a$ and $b$) in order.'
  items:
    - 'Compute $\sin B = \dfrac{b\sin A}{a}$'
    - 'Find the acute candidate $B_1 = \sin^{-1}(\sin B)$'
    - 'Form the obtuse candidate $B_2 = 180^\circ - B_1$'
    - 'Keep each candidate with $A + B < 180^\circ$'
    - 'For each kept $B$, find $C$ and then $c$'
  explanation: |-
    $\sin B$ comes from the law of sines; $B_1$ needs $\sin B$, and $B_2$ needs $B_1$. Only then can each candidate be tested against $A + B < 180^\circ$, and only the survivors are finished with $C = 180^\circ - A - B$ and $c = \tfrac{a\sin C}{\sin A}$.

- id: trig-m7-r2-q08
  lesson: trig-ambiguous
  topic: Ambiguous case
  stem: 'In SSA with $A$ acute and $h = b\sin A$, which conditions give exactly one triangle? Select all that apply.'
  choices: ['$a = b\sin A$', '$a > b$', '$b\sin A < a < b$', '$a < b\sin A$', '$a = b$']
  answer: [0, 1, 4]
  explanation: |-
    $a = h$ gives one right triangle. Any $a \ge b$ gives one triangle, because the second crossing falls behind $A$; that covers both $a > b$ and $a = b$ (an isosceles triangle). $h < a < b$ gives two triangles, and $a < h$ gives none.

- id: trig-m7-r2-q09
  lesson: trig-ambiguous
  module_quiz: true
  topic: Ambiguous case
  type: label
  stem: 'Each panel shows angle $A$, side $b$ to $C$, the height $h$, and a dashed circle of radius $a$ around $C$. Name the outcome in each numbered panel.'
  image: {src: images/trig-m7-ssa-cases-blank.svg, alt: 'Four numbered panels with the same angle A, side b and dashed height h. Panel 1: the dashed circle around C does not reach the horizontal ray. Panel 2: the circle just touches the ray at the foot of the height, with a right-angle mark. Panel 3: the circle crosses the ray at two points to the right of A, each joined to C. Panel 4: a larger circle crosses the ray once to the right of A and once behind A, shown as an open dot.'}
  labels:
    - {x: 25, y: 4.6, text: 'No triangle'}
    - {x: 75, y: 4.6, text: 'One right triangle'}
    - {x: 25, y: 54.6, text: 'Two triangles'}
    - {x: 75, y: 54.6, text: 'One triangle'}
  distractors: ['Three triangles']
  explanation: |-
    The third vertex $B$ must be on the ray at distance $a$ from $C$, so look for crossings. Panel 1: the circle misses the ray ($a < h$), no triangle. Panel 2: it just touches ($a = h$), one right triangle. Panel 3: two crossings in front of $A$ ($h < a < b$), two triangles. Panel 4: one crossing in front of $A$ and one behind it ($a \ge b$), one triangle.

- id: trig-m7-r2-q10
  lesson: trig-ambiguous
  topic: Ambiguous case
  type: match
  stem: 'Match each set of SSA data to the number of triangles it gives.'
  pairs:
    - ['$A = 45^\circ$, $b = 10$, $a = 6$', 'No triangle']
    - ['$A = 45^\circ$, $b = 10$, $a = 7.5$', 'Two triangles']
    - ['$A = 45^\circ$, $b = 10$, $a = 12$', 'One triangle']
    - ['$A = 30^\circ$, $b = 12$, $a = 6$', 'One right triangle']
    - ['$A = 120^\circ$, $b = 8$, $a = 6$', 'No triangle']
  explanation: |-
    For $A = 45^\circ$, $b = 10$: $h = 10\sin 45^\circ \approx 7.07$. $a = 6 < h$: none. $7.07 < 7.5 < 10$: two. $a = 12 \ge b$: one. For $A = 30^\circ$, $b = 12$: $h = 6 = a$, one right triangle. For obtuse $A = 120^\circ$, $a$ must be the longest side, but $6 < 8$: none.

# ---------- Lesson 30: The law of cosines ----------
- id: trig-m7-r2-q11
  lesson: trig-law-cosines
  module_quiz: true
  topic: Law of cosines
  type: text
  stem: 'In triangle $ABC$, $b = 5$, $c = 8$ and $A = 60^\circ$. Find $a$ exactly. Give only the number.'
  accept: ['7']
  explanation: |-
    $a^2 = 5^2 + 8^2 - 2(5)(8)\cos 60^\circ = 25 + 64 - 40 = 49$, so $a = 7$.

- id: trig-m7-r2-q12
  lesson: trig-law-cosines
  topic: Law of cosines
  type: order
  stem: 'Put the steps for solving a SAS triangle (given $b$, $c$ and the angle $A$ between them) in order.'
  items:
    - 'Use $a^2 = b^2 + c^2 - 2bc\cos A$ to find $a^2$'
    - 'Take the square root to get $a$'
    - 'Use the law of sines for the angle opposite the shorter of $b$ and $c$'
    - 'Find the last angle as $180^\circ$ minus the other two'
  explanation: |-
    The law of cosines gives $a^2$, and its square root gives $a$. Now the pair $a$, $A$ is known, so the law of sines can find an angle; the one opposite the shorter remaining side can't be obtuse, so it is safe. The largest angle, which might be obtuse, comes last by subtraction.

- id: trig-m7-r2-q13
  lesson: trig-law-cosines
  topic: Law of cosines
  stem: 'Which statements about the law of cosines are true? Select all that apply.'
  choices: ['With $C = 90^\circ$ it becomes $c^2 = a^2 + b^2$.', 'If $\cos C < 0$, then $c^2 > a^2 + b^2$.', 'Finding $C$ from $\cos C = \tfrac{a^2 + b^2 - c^2}{2ab}$ can give an acute angle when $C$ is really obtuse.', 'For "sides" such as 2, 3 and 6, which can''t form a triangle, it gives a cosine outside $[-1, 1]$.', 'It is the right first step for an AAS triangle.']
  answer: [0, 1, 3]
  explanation: |-
    $\cos 90^\circ = 0$ leaves the Pythagorean theorem. A negative $\cos C$ makes $-2ab\cos C$ positive, so $c^2 > a^2 + b^2$. For 2, 3, 6 the formula gives $\cos C = \tfrac{4 + 9 - 36}{12} \approx -1.92$, impossible. False: $\cos^{-1}$ returns angles from $0^\circ$ to $180^\circ$, so an obtuse angle comes out obtuse. False: AAS has a side with its opposite angle once the third angle is found, so it uses the law of sines.

- id: trig-m7-r2-q14
  lesson: trig-law-cosines
  topic: Law of cosines
  type: label
  stem: 'The three triangles share sides $a$ and $b$ but have different angles $C$ between them. Name the relationship for each numbered triangle.'
  image: {src: images/trig-m7-cos-sign-blank.svg, alt: 'Three triangles side by side, each with sides a and b meeting at vertex C. The angle at C is 60° in the first, 90° in the second and 120° in the third, so the side c across from C gets longer from left to right. A numbered marker sits under each triangle.'}
  labels:
    - {x: 16.7, y: 88.7, text: 'c² < a² + b²'}
    - {x: 50, y: 88.7, text: 'c² = a² + b²'}
    - {x: 83.3, y: 88.7, text: 'c² > a² + b²'}
  distractors: ['c² = a² − b²']
  explanation: |-
    $c^2 = a^2 + b^2 - 2ab\cos C$. At $60^\circ$ the cosine is positive, so something is subtracted and $c^2 < a^2 + b^2$. At $90^\circ$ the cosine is 0 and the Pythagorean theorem holds. At $120^\circ$ the cosine is negative, so $-2ab\cos C$ adds to the total and $c^2 > a^2 + b^2$.

- id: trig-m7-r2-q15
  lesson: trig-law-cosines
  topic: Law of cosines
  type: match
  stem: 'Match each case to the right first step.'
  pairs:
    - ['AAS or ASA', 'Find the third angle, then use the law of sines']
    - ['SSA', 'Law of sines, then check for 0, 1 or 2 triangles']
    - ['SAS', 'Law of cosines for the third side']
    - ['SSS', 'Law of cosines for the largest angle']
  distractors: ['Law of sines for the largest angle']
  explanation: |-
    With two angles known, the third is free and every side has a known opposite angle. SSA already has a side–angle pair but may be ambiguous. SAS and SSS have no pair, so the law of cosines starts them; in SSS find the largest angle first, since it is the one that might be obtuse. The law of sines should never be trusted with the largest angle, because $\sin^{-1}$ only returns acute angles.

# ---------- Lesson 31: Area of a triangle ----------
- id: trig-m7-r2-q16
  lesson: trig-triangle-area
  module_quiz: true
  topic: Triangle area
  type: text
  stem: 'Two sides of a triangle are 6 and 8, and the angle between them is $30^\circ$. Find the exact area. Give only the number.'
  accept: ['12']
  explanation: |-
    $\text{Area} = \tfrac12(6)(8)\sin 30^\circ = 24 \cdot \tfrac12 = 12$.

- id: trig-m7-r2-q17
  lesson: trig-triangle-area
  topic: Triangle area
  type: text
  stem: 'Use Heron''s formula to find the area of a triangle with sides 10, 17 and 21. Give only the number.'
  accept: ['84']
  explanation: |-
    $s = \tfrac{10 + 17 + 21}{2} = 24$, and $s - a$, $s - b$, $s - c$ are 14, 7 and 3. Area $= \sqrt{24 \cdot 14 \cdot 7 \cdot 3} = \sqrt{7056} = 84$.

- id: trig-m7-r2-q18
  lesson: trig-triangle-area
  topic: Triangle area
  type: order
  stem: 'Put the steps of Heron''s formula for the triangle with sides 9, 10 and 17 in order.'
  items:
    - 'Semiperimeter: $s = \tfrac{9 + 10 + 17}{2} = 18$'
    - 'Differences: $s - 9 = 9$, $s - 10 = 8$, $s - 17 = 1$'
    - 'Product: $18 \cdot 9 \cdot 8 \cdot 1 = 1296$'
    - 'Square root: Area $= \sqrt{1296} = 36$'
  explanation: |-
    Each step uses the result of the one before: $s$ first, then the three differences, then the product $s(s - a)(s - b)(s - c)$, and the square root last. The area is 36.

- id: trig-m7-r2-q19
  lesson: trig-triangle-area
  module_quiz: true
  topic: Triangle area
  type: match
  stem: 'Match what you know about a triangle to the area formula to use.'
  pairs:
    - ['Two sides and the angle between them', 'Half the product of the two sides times the sine of the angle']
    - ['Three sides', 'Heron''s formula']
    - ['One side and all three angles', 'a² sin B sin C divided by 2 sin A']
    - ['A base and its height', 'Half the base times the height']
  distractors: ['The product of the two sides times the sine of the angle']
  explanation: |-
    SAS: $\tfrac12 ab\sin C$. SSS: Heron, $\sqrt{s(s - a)(s - b)(s - c)}$. One side and the angles: $\tfrac{a^2\sin B\sin C}{2\sin A}$. Base and height: $\tfrac12 bh$. The product $ab\sin C$ without the $\tfrac12$ is the area of a parallelogram, not a triangle.

- id: trig-m7-r2-q20
  lesson: trig-triangle-area
  topic: Triangle area
  stem: 'Which of these triangles have an area of exactly 12? Select all that apply.'
  choices: ['Sides 4 and 12 with a $30^\circ$ angle between them', 'Sides 3, 4 and 5', 'Sides 5, 5 and 6', 'Sides 4 and 6 with a $90^\circ$ angle between them', 'Sides 6 and 8 with a $60^\circ$ angle between them']
  answer: [0, 2, 3]
  explanation: |-
    $\tfrac12(4)(12)\sin 30^\circ = 12$. Sides 5, 5, 6: $s = 8$, $\sqrt{8 \cdot 3 \cdot 3 \cdot 2} = \sqrt{144} = 12$. $\tfrac12(4)(6)\sin 90^\circ = 12$. Not 12: the 3-4-5 triangle has area $\tfrac12(3)(4) = 6$, and $\tfrac12(6)(8)\sin 60^\circ = 12\sqrt3 \approx 20.78$.

# ---------- Honors: The circumcircle, the incircle and the extended law of sines ----------
- id: trig-m7-r2-h01
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'A triangle has $A = 45^\circ$ and $a = 12$. What is the radius $R$ of its circumcircle?'
  choices: ['$6\sqrt2$', '$12\sqrt2$', '$3\sqrt2$', '$6$']
  answer: 0
  explanation: |-
    $2R = \dfrac{a}{\sin A} = \dfrac{12}{\sqrt2/2} = 12\sqrt2$, so $R = 6\sqrt2 \approx 8.49$. $12\sqrt2$ is the diameter, the result of forgetting that $\tfrac{a}{\sin A}$ equals $2R$.

- id: trig-m7-r2-h02
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'In the proof of the extended law of sines, $BD$ is a diameter of the circumcircle and $A$ is acute. Why is $\angle BDC = A$?'
  choices: ['Because $BD$ passes through the center', 'Because both are inscribed angles standing on arc $BC$ from the same side', 'Because triangle $BCD$ is isosceles', 'Because the angles of triangle $BCD$ add to $180^\circ$']
  answer: 1
  explanation: |-
    By the inscribed angle theorem, each equals half the central angle on arc $BC$, so they are equal. The diameter is used for a different step: it makes $\angle BCD = 90^\circ$, so that $\sin D = \tfrac{a}{2R}$.

- id: trig-m7-r2-h03
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'Where is the circumcenter of a triangle with an obtuse angle?'
  choices: ['Inside the triangle', 'At the midpoint of the longest side', 'Outside the triangle', 'At the vertex of the obtuse angle']
  answer: 2
  explanation: |-
    The circumcenter is inside for an acute triangle, at the midpoint of the hypotenuse for a right triangle, and outside, beyond the longest side, for an obtuse triangle.

- id: trig-m7-r2-h04
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'A triangle has sides 5, 5 and 6, so its area is 12. What is its circumradius?'
  choices: ['$6.25$', '$2.5$', '$1.5$', '$3.125$']
  answer: 3
  explanation: |-
    $R = \dfrac{abc}{4K} = \dfrac{5 \cdot 5 \cdot 6}{4 \cdot 12} = \dfrac{150}{48} = 3.125$. $6.25$ comes from dividing by $2K$ instead of $4K$; $1.5$ is the inradius $\tfrac{K}{s} = \tfrac{12}{8}$.

- id: trig-m7-r2-h05
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  type: text
  stem: 'A triangle has sides 5, 5 and 6 and area 12. Its inradius is $r =$ ___.'
  accept: ['1.5']
  explanation: |-
    $s = \tfrac{5 + 5 + 6}{2} = 8$, and $r = \tfrac{K}{s} = \tfrac{12}{8} = 1.5$.

- id: trig-m7-r2-h06
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'The incenter of a triangle is where which lines meet?'
  choices: ['The perpendicular bisectors of the sides', 'The bisectors of the angles', 'The altitudes', 'The lines from each vertex to the midpoint of the opposite side']
  answer: 1
  explanation: |-
    Points on an angle bisector are equally far from the two sides of that angle, so the meeting point of the angle bisectors is equally far from all three sides: the incenter. The perpendicular bisectors of the sides meet at the circumcenter instead.

- id: trig-m7-r2-h07
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'A triangle has $a = 8$, $b = 10$, $c = 12$. How far from vertex $B$ does the incircle touch the two sides that meet at $B$?'
  choices: ['$7$', '$3$', '$5$', '$10$']
  answer: 2
  explanation: |-
    $s = 15$, and the tangent length from $B$ is $s - b = 15 - 10 = 5$. ($7 = s - a$ is the length from $A$, and $3 = s - c$ the length from $C$.) Check side $a = BC$: $5 + 3 = 8$. ✓

- id: trig-m7-r2-h08
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  type: label
  stem: 'Name each numbered part of this triangle and its incircle.'
  image: {src: images/trig-m7-h-incircle-blank.svg, alt: 'Triangle ABC with a circle inside touching all three sides at dotted points. A dot marks the center of the circle, and a dashed segment runs from the center straight down to the touching point on side BC. Markers sit on the piece of side AC between A and its touching point, on the piece of BC next to B, on the piece of BC next to C, on the center, and on the dashed segment.'}
  labels:
    - {x: 47.9, y: 29.1, text: 'Tangent length s − a'}
    - {x: 26, y: 88, text: 'Tangent length s − b'}
    - {x: 63.3, y: 88, text: 'Tangent length s − c'}
    - {x: 42, y: 62.4, text: 'Incenter'}
    - {x: 42, y: 75.2, text: 'Inradius'}
  distractors: ['Circumcenter', 'Circumradius']
  explanation: |-
    The piece of a side between a vertex and the nearby touching point is that vertex's tangent length: $s - a$ next to $A$, $s - b$ next to $B$, $s - c$ next to $C$. The center of the inscribed circle is the incenter, and the segment from it to a touching point, perpendicular to the side, is the inradius $r$. The circumcenter and circumradius belong to the circle through the vertices, which isn't drawn.

- id: trig-m7-r2-h09
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'Which pair of radii is impossible for a triangle?'
  choices: ['$R = 5$, $r = 2.5$', '$R = 10$, $r = 2$', '$R = 6$, $r = 1$', '$R = 5$, $r = 3$']
  answer: 3
  explanation: |-
    Euler's inequality says $R \ge 2r$ for every triangle. $R = 5$, $r = 3$ has $2r = 6 > 5$, so it can't happen. $R = 5$, $r = 2.5$ is the equality case, an equilateral triangle; the other two pairs satisfy $R > 2r$.

- id: trig-m7-r2-h10
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'A right triangle has legs $a$, $b$ and hypotenuse $c$. Which statements are always true? Select all that apply.'
  choices: ['The circumcenter is the midpoint of the hypotenuse.', '$R = \tfrac{c}{2}$', '$r = \tfrac{a + b - c}{2}$', 'The incenter lies on the hypotenuse.', '$r = \tfrac{c}{2}$']
  answer: [0, 1, 2]
  explanation: |-
    The right angle stands on the hypotenuse, so the hypotenuse is a diameter of the circumcircle: center at its midpoint and $R = \tfrac{c}{2}$. At the right angle the tangent length equals $r$, and it is also $s - c = \tfrac{a + b - c}{2}$. The incenter is inside the triangle, never on a side, and $\tfrac{c}{2}$ is $R$, not $r$ (for 3-4-5, $R = 2.5$ but $r = 1$).

- id: trig-m7-r2-h11
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  type: match
  stem: 'Match each expression to what it measures in a triangle with area $K$ and semiperimeter $s$.'
  pairs:
    - ['$\dfrac{a}{\sin A}$', 'Diameter of the circumcircle']
    - ['$\dfrac{abc}{4K}$', 'Radius of the circumcircle']
    - ['$\dfrac{K}{s}$', 'Radius of the incircle']
    - ['$s - a$', 'Tangent length from vertex A']
  distractors: ['Tangent length along side a']
  explanation: |-
    The extended law of sines gives $\tfrac{a}{\sin A} = 2R$, the diameter. Putting $\sin A = \tfrac{a}{2R}$ into $K = \tfrac12 bc\sin A$ gives $R = \tfrac{abc}{4K}$. Splitting the triangle at the incenter gives $K = rs$. The two tangent segments from $A$ each have length $s - a$; they lie on sides $b$ and $c$, not on side $a$.

- id: trig-m7-r2-h12
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  type: text
  stem: 'A triangle has sides 7, 8 and 9. Find its circumradius $R$, rounded to two decimal places.'
  accept: ['4.70']
  explanation: |-
    $s = 12$, so $K = \sqrt{12 \cdot 5 \cdot 4 \cdot 3} = \sqrt{720} \approx 26.833$. Then $R = \dfrac{7 \cdot 8 \cdot 9}{4K} = \dfrac{504}{107.33} \approx 4.70$.

- id: trig-m7-r2-h13
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'A triangle has an obtuse angle $A = 150^\circ$ opposite the side $a = 9$. What is its circumradius?'
  choices: ['$9$', '$18$', '$4.5$', '$5.20$']
  answer: 0
  explanation: |-
    $2R = \dfrac{9}{\sin 150^\circ} = \dfrac{9}{0.5} = 18$, so $R = 9$. The formula needs no change for obtuse angles, because $\sin 150^\circ = \sin 30^\circ$. $18$ is the diameter, and $5.20$ comes from using $\cos 150^\circ$ instead of the sine.

- id: trig-m7-r2-h14
  lesson: trig-m7-h-circles
  topic: Circumcircle and incircle
  stem: 'Which step gives the formula $R = \dfrac{abc}{4K}$?'
  choices: ['Adding the areas of three triangles with height $r$', 'Applying Heron''s formula to the circumcircle', 'Substituting $\sin A = \dfrac{a}{2R}$ into $K = \tfrac12 bc\sin A$', 'Using the law of cosines on the diameter $BD$']
  answer: 2
  explanation: |-
    $K = \tfrac12 bc \cdot \tfrac{a}{2R} = \tfrac{abc}{4R}$; solve for $R$. Adding three triangles with height $r$ is the proof of $K = rs$, the inradius formula.

# ---------- Honors: Half-angle formulas for triangles and the law of tangents ----------
- id: trig-m7-r2-h15
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'In a triangle with semiperimeter $s$, which expression equals $\cos\tfrac{A}{2}$?'
  choices: ['$\sqrt{\dfrac{(s - b)(s - c)}{bc}}$', '$\sqrt{\dfrac{s(s - a)}{ab}}$', '$\sqrt{\dfrac{(s - a)(s - b)}{bc}}$', '$\sqrt{\dfrac{s(s - a)}{bc}}$']
  answer: 3
  explanation: |-
    From $1 + \cos A = \tfrac{2s(s - a)}{bc}$ and $\cos^2\tfrac{A}{2} = \tfrac{1 + \cos A}{2}$: $\cos\tfrac{A}{2} = \sqrt{\tfrac{s(s - a)}{bc}}$. The first choice is $\sin\tfrac{A}{2}$. The denominator is always the product of the two sides that form angle $A$, which is $bc$.

- id: trig-m7-r2-h16
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  type: text
  stem: 'A triangle has $a = 5$, $b = 6$, $c = 7$. Use $\tan\tfrac{C}{2} = \sqrt{\tfrac{(s - a)(s - b)}{s(s - c)}}$ to find $C$ in degrees, rounded to two decimal places. Give only the number.'
  accept: ['78.46']
  explanation: |-
    $s = 9$, so $s - a = 4$, $s - b = 3$, $s - c = 2$. $\tan\tfrac{C}{2} = \sqrt{\tfrac{4 \cdot 3}{9 \cdot 2}} = \sqrt{\tfrac23} \approx 0.8165$, so $\tfrac{C}{2} \approx 39.23^\circ$ and $C \approx 78.46^\circ$. (The law of cosines agrees: $\cos C = \tfrac{25 + 36 - 49}{60} = 0.2$.)

- id: trig-m7-r2-h17
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'A triangle has $a = 13$, $b = 14$, $c = 15$. What is $\sin\tfrac{A}{2}$?'
  choices: ['$\sqrt{0.2}$', '$\sqrt{0.8}$', '$0.5$', '$0.2$']
  answer: 0
  explanation: |-
    $s = 21$, $s - b = 7$, $s - c = 6$, so $\sin^2\tfrac{A}{2} = \tfrac{7 \cdot 6}{14 \cdot 15} = \tfrac{42}{210} = 0.2$ and $\sin\tfrac{A}{2} = \sqrt{0.2} \approx 0.447$. $\sqrt{0.8}$ is $\cos\tfrac{A}{2}$ (from $\tfrac{21 \cdot 8}{210}$), and $0.2$ forgets the square root.

- id: trig-m7-r2-h18
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'Which statements about the half-angle formulas for a triangle are true? Select all that apply.'
  choices: ['Half of any angle of a triangle is between $0^\circ$ and $90^\circ$.', 'They need only the three sides.', '$\tan\tfrac{A}{2} = \tfrac{r}{s - a}$, where $r$ is the inradius.', 'For an obtuse angle they return its acute supplement, so you must check.', 'They work only for acute triangles.']
  answer: [0, 1, 2]
  explanation: |-
    Angles of a triangle are below $180^\circ$, so half angles are acute and the positive roots are always right; that is why an obtuse angle comes out obtuse with no checking. The formulas use only $s$ and the sides. The incircle picture gives $\tan\tfrac{A}{2} = \tfrac{r}{s - a}$. They work for every triangle; the 7-9-12 example found an obtuse angle of about $96.38^\circ$.

- id: trig-m7-r2-h19
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  type: order
  stem: 'Put the steps of the proof of Heron''s formula in order.'
  items:
    - '$K = \tfrac12 bc\sin A$'
    - '$K = bc\sin\tfrac{A}{2}\cos\tfrac{A}{2}$'
    - '$K = bc\sqrt{\tfrac{(s - b)(s - c)}{bc}}\sqrt{\tfrac{s(s - a)}{bc}}$'
    - '$K = \sqrt{s(s - a)(s - b)(s - c)}$'
  explanation: |-
    Start from the SAS area formula, use the double-angle identity $\sin A = 2\sin\tfrac{A}{2}\cos\tfrac{A}{2}$, substitute the half-angle formulas, and cancel the $bc$ in front against the $bc$ under the two roots.

- id: trig-m7-r2-h20
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'For the thin triangle with sides 1000, 1000 and 1, why does the law of cosines give a poor value of the small angle when the cosine is rounded to six decimals?'
  choices: ['The law of cosines only holds for acute triangles', 'Near $0^\circ$ the cosine is almost flat, so a tiny rounding error in $\cos C$ is a large error in $C$', 'Inverse cosine cannot return angles under $1^\circ$', 'The sides break the triangle inequality']
  answer: 1
  explanation: |-
    $\cos C = 0.9999995$, and rounding it to $1.000000$ or $0.999999$ gives $0^\circ$ or about $0.081^\circ$ instead of $0.0573^\circ$. The calculation is ill-conditioned. The half-angle formula works from $s - a = s - b = 0.5$, which are computed exactly from the sides.

- id: trig-m7-r2-h21
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'Which equation is the law of tangents?'
  choices: ['$\dfrac{a - b}{a + b} = \dfrac{\tan(A - B)}{\tan(A + B)}$', '$\dfrac{a - b}{a + b} = \dfrac{\sin\frac{A - B}{2}}{\sin\frac{A + B}{2}}$', '$\dfrac{a - b}{a + b} = \dfrac{\tan\frac{A - B}{2}}{\tan\frac{A + B}{2}}$', '$\dfrac{a - b}{c} = \dfrac{\tan\frac{A - B}{2}}{\tan\frac{C}{2}}$']
  answer: 2
  explanation: |-
    From the law of sines, $\tfrac{a - b}{a + b} = \tfrac{\sin A - \sin B}{\sin A + \sin B}$, and the sum-to-product formulas turn this into $\tfrac{\tan\frac{A - B}{2}}{\tan\frac{A + B}{2}}$. The half angles are essential; the version with $\tfrac{a - b}{c}$ is close to Mollweide's formula, which has $\sin\tfrac{A - B}{2}$ over $\cos\tfrac{C}{2}$.

- id: trig-m7-r2-h22
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  type: text
  stem: 'A triangle has $a = 9$, $b = 5$ and included angle $C = 60^\circ$. Use the law of tangents to find $A$ in degrees, rounded to two decimal places. Give only the number.'
  accept: ['86.33']
  explanation: |-
    Half-sum: $\tfrac{A + B}{2} = 90^\circ - 30^\circ = 60^\circ$. Then $\tan\tfrac{A - B}{2} = \tfrac{9 - 5}{9 + 5}\cot 30^\circ = \tfrac{2}{7}\sqrt3 \approx 0.4949$, so $\tfrac{A - B}{2} \approx 26.33^\circ$. $A \approx 60^\circ + 26.33^\circ = 86.33^\circ$ (and $B \approx 33.67^\circ$). The law of cosines gives the same: $c^2 = 81 + 25 - 45 = 61$, and $\cos A = \tfrac{25 + 61 - 81}{2 \cdot 5\sqrt{61}} \approx 0.064$.

- id: trig-m7-r2-h23
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'In a SAS problem the included angle is $C = 70^\circ$. What is the half-sum $\tfrac{A + B}{2}$?'
  choices: ['$35^\circ$', '$110^\circ$', '$20^\circ$', '$55^\circ$']
  answer: 3
  explanation: |-
    $A + B = 180^\circ - 70^\circ = 110^\circ$, so the half-sum is $55^\circ$, which is $90^\circ - \tfrac{C}{2}$. $110^\circ$ forgets to halve, and $35^\circ$ is $\tfrac{C}{2}$.

- id: trig-m7-r2-h24
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'A triangle has $A = 50^\circ$, $B = 60^\circ$, $C = 70^\circ$. To check a solution with Mollweide''s formula $\tfrac{a + b}{c} = \tfrac{\cos\frac{A - B}{2}}{\sin\frac{C}{2}}$, what is the right side, to three decimals?'
  choices: ['$1.737$', '$1.000$', '$1.060$', '$0.574$']
  answer: 0
  explanation: |-
    $\tfrac{\cos(-5^\circ)}{\sin 35^\circ} \approx \tfrac{0.9962}{0.5736} \approx 1.737$. A correct solution ($a = 10$, $b \approx 11.31$, $c \approx 12.27$) gives $\tfrac{21.31}{12.27} \approx 1.737$ on the left. $1.000$ uses the half-sum $\cos 55^\circ$ instead of the half-difference, $1.060$ uses $\sin 70^\circ$ instead of $\sin 35^\circ$, and $0.574$ is just $\sin 35^\circ$.

- id: trig-m7-r2-h25
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  type: match
  stem: 'Match each formula to its name.'
  pairs:
    - ['$\dfrac{a - b}{a + b} = \dfrac{\tan\frac{A - B}{2}}{\tan\frac{A + B}{2}}$', 'Law of tangents']
    - ['$\dfrac{a + b}{c} = \dfrac{\cos\frac{A - B}{2}}{\sin\frac{C}{2}}$', 'Mollweide''s formula']
    - ['$K = \sqrt{s(s - a)(s - b)(s - c)}$', 'Heron''s formula']
    - ['$\dfrac{a}{\sin A} = \dfrac{b}{\sin B}$', 'Law of sines']
  distractors: ['Law of cosines']
  explanation: |-
    The law of tangents relates a difference over a sum of sides to tangents of half-differences and half-sums. Mollweide's formulas involve all six parts. Heron's formula gives the area from the sides, and the law of sines pairs each side with the sine of its opposite angle. None of these is the law of cosines, $c^2 = a^2 + b^2 - 2ab\cos C$.

- id: trig-m7-r2-h26
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'Solving a SAS triangle with $a = 5$ and $b = 9$ by the law of tangents, you get a negative value for $\tfrac{A - B}{2}$. What does that mean?'
  choices: ['You made a sign error and should use $b - a$', '$A < B$, as expected since $a < b$', 'No triangle exists', 'The angle $C$ must be obtuse']
  answer: 1
  explanation: |-
    $\tfrac{a - b}{a + b}$ is negative when $a < b$, so the half-difference is negative and $A = \text{half-sum} + \text{half-difference}$ comes out smaller than $B$. That matches the rule that the shorter side is opposite the smaller angle. Nothing needs fixing.

- id: trig-m7-r2-h27
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'Before electronic calculators, why did surveyors often prefer the law of tangents and half-angle formulas to the law of cosines?'
  choices: ['The law of cosines had not been discovered yet', 'They are exact, while the law of cosines is an approximation', 'They avoid angles altogether', 'Logarithm tables make products, quotients and roots easy, but not sums']
  answer: 3
  explanation: |-
    Calculation was done with logarithms, which turn multiplication, division and roots into addition and subtraction. The law of cosines needs squares added together before a square root, which logarithms don't help with; the tangent and half-angle formulas are all products and quotients. The law of cosines is exact and was well known; the other formulas do use angles.

- id: trig-m7-r2-h28
  lesson: trig-m7-h-half-angles
  topic: Half-angle and tangent laws
  stem: 'In the triangle with $a = 13$, $b = 14$, $c = 15$, the inradius is $r = 4$ and $s - a = 8$. Use $\tan\tfrac{A}{2} = \tfrac{r}{s - a}$ to find $A$.'
  choices: ['$26.57^\circ$', '$63.43^\circ$', '$53.13^\circ$', '$30^\circ$']
  answer: 2
  explanation: |-
    $\tan\tfrac{A}{2} = \tfrac48 = 0.5$, so $\tfrac{A}{2} \approx 26.57^\circ$ and $A \approx 53.13^\circ$. Check with the law of cosines: $\cos A = \tfrac{196 + 225 - 169}{2 \cdot 14 \cdot 15} = 0.6$, and $\cos^{-1} 0.6 \approx 53.13^\circ$. $26.57^\circ$ forgets to double, and $63.43^\circ$ is $\tan^{-1} 2$, from inverting the ratio.
