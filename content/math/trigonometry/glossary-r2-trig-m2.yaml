# Round 2 glossary terms for module trig-m2 (honors lessons)
- term: regular polygon
  aliases: [regular polygons]
  definition: 'A polygon whose sides all have the same length and whose angles all have the same size, such as an equilateral triangle, a square or a regular pentagon.'
  topic: Regular polygons
- term: circumradius
  definition: 'The radius $R$ of the circle through all the vertices of a regular polygon: the distance from its center to any vertex.'
  topic: Regular polygons
- term: apothem
  aliases: [apothems]
  definition: 'The segment from the center of a regular polygon to the midpoint of a side, perpendicular to that side; its length is $R\cos\tfrac{180^\circ}{n}$ for an $n$-gon with circumradius $R$.'
  topic: Regular polygons
- term: golden triangle
  aliases: [golden triangles]
  definition: 'An isosceles triangle with apex angle $36^\circ$ and base angles $72^\circ$. Bisecting a base angle cuts off a smaller golden triangle, which leads to $\sin 18^\circ = \tfrac{\sqrt5 - 1}{4}$.'
  topic: Exact values from geometry
- term: golden ratio
  definition: 'The number $\varphi = \tfrac{1 + \sqrt5}{2} \approx 1.618$, the positive solution of $\varphi^2 = \varphi + 1$. A regular pentagon''s diagonal is $\varphi$ times its side, and $\cos 36^\circ = \tfrac{\varphi}{2}$.'
  topic: Exact values from geometry
- term: uncertainty
  definition: 'How far a measured value could be from the true value, written with $\pm$, as in $38^\circ \pm 0.5^\circ$.'
  topic: Measurement error
- term: absolute error
  definition: 'The size of the possible error in a result, in the result''s own units (for example $\pm 0.7$ m).'
  topic: Measurement error
- term: relative error
  definition: 'The absolute error divided by the value, often written as a percent; it lets you compare the accuracy of measurements of different sizes.'
  topic: Measurement error
- term: atmospheric refraction
  definition: 'The slight bending of light as it passes through air of changing density; near the ground it usually makes the visible horizon a little farther than the purely geometric one.'
  topic: Horizon and Earth's radius
- term: dip of the horizon
  aliases: [dip]
  definition: 'The angle from the horizontal at an observer down to the line of sight to the sea horizon. From height $h$ above a sphere of radius $R$, $\cos\alpha = \tfrac{R}{R + h}$.'
  topic: Horizon and Earth's radius
