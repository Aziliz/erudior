- {front: 'Griffith, Avery, Hershey–Chase: what did each show?', back: 'Griffith (1928): something from dead S bacteria transforms R bacteria. Avery (1944): only destroying DNA stops transformation, so the transforming principle is DNA. Hershey–Chase (1952): phage DNA (³²P), not protein (³⁵S), enters bacteria.', topic: DNA structure}
- {front: Parts of a nucleotide, back: 'A phosphate group, a five-carbon sugar (deoxyribose in DNA, ribose in RNA) and a nitrogen base.', topic: DNA structure}
- {front: Base-pairing rules, back: 'DNA: A–T (2 hydrogen bonds), G–C (3 hydrogen bonds). RNA: A–U, G–C. Each pair is one purine (A, G) with one pyrimidine (T, C, U).', topic: DNA structure}
- {front: "Chargaff's rules", back: 'In double-stranded DNA, %A = %T and %G = %C, so %A + %G = 50%. Example: 22% G gives 22% C and 28% each of A and T.', topic: DNA structure}
- {front: Antiparallel strands, back: 'The two DNA strands run in opposite directions: under 5′-ATG-3′ lies 3′-TAC-5′.', topic: DNA structure}
- {front: 'Meselson–Stahl results (15N then 14N)', back: 'Generation 0: one heavy band. Generation 1: one hybrid band (rules out conservative). Generation 2: half hybrid, half light (rules out dispersive). Replication is semiconservative.', topic: DNA replication}
- {front: Replication enzymes in order, back: 'Helicase unwinds → primase lays RNA primers → DNA polymerase builds 5′ → 3′ (leading strand continuous, lagging strand in Okazaki fragments) → primers replaced → ligase joins fragments.', topic: DNA replication}
- {front: Leading vs lagging strand, back: 'Leading: built continuously toward the replication fork. Lagging: built in Okazaki fragments away from the fork, because polymerase adds only to 3′ ends.', topic: DNA replication}
- {front: Central dogma, back: 'DNA → RNA → protein. Transcription makes RNA from DNA; translation makes protein from mRNA.', topic: Transcription}
- {front: DNA vs RNA, back: 'DNA: deoxyribose, thymine, usually double-stranded. RNA: ribose, uracil, usually single-stranded.', topic: Transcription}
- {front: 'mRNA, tRNA, rRNA', back: 'mRNA carries the codons; tRNA brings amino acids and has the anticodon; rRNA forms the ribosome core and makes peptide bonds.', topic: Translation}
- {front: Steps of transcription, back: 'Initiation (RNA polymerase binds the promoter) → elongation (RNA built 5′ → 3′, complementary to the template strand) → termination. In eukaryotes: add cap and tail, splice out introns.', topic: Transcription}
- {front: Template strand vs coding strand, back: 'The template strand is read by RNA polymerase. The coding strand has the same sequence as the mRNA, with T in place of U.', topic: Transcription}
- {front: Genetic code facts, back: '64 triplet codons; AUG = start (Met); UAA, UAG, UGA = stop; redundant (several codons per amino acid), unambiguous, nearly universal.', topic: Genetic code}
- {front: How to translate an mRNA, back: 'Find the first AUG from the 5′ end, read non-overlapping triplets, look each codon up in the table, stop at the first stop codon (which adds no amino acid).', topic: Genetic code}
- {front: Codons vs amino acids in a coding region, back: 'A coding region of $n$ codons (start through stop) makes $n - 1$ amino acids; it has $3n$ nucleotides.', topic: Genetic code}
- {front: Steps of translation, back: 'Initiation (small subunit finds AUG, Met-tRNA pairs, large subunit joins) → elongation (tRNAs match codons, peptide bonds form, ribosome moves one codon) → termination (release factor at the stop codon).', topic: Translation}
- {front: The lac operon, back: 'No lactose: repressor binds the operator, genes off. Lactose present: lactose binds the repressor, which leaves the operator, genes on.', topic: Gene regulation}
- {front: Promoter vs operator, back: 'RNA polymerase binds the promoter; the repressor binds the operator, blocking polymerase.', topic: Gene regulation}
- {front: Ways eukaryotes regulate genes, back: 'Transcription factors and enhancers, DNA packing and epigenetic tags (DNA methylation, histone changes), RNA splicing, mRNA lifespan, microRNAs, and protein activation or breakdown.', topic: Gene regulation}
- {front: 'Silent vs missense vs nonsense', back: 'Silent: codon changes, same amino acid. Missense: different amino acid (sickle cell GAG → GUG, Glu → Val). Nonsense: becomes a stop codon, protein cut short.', topic: Mutations}
- {front: Frameshift mutation, back: 'Insertion or deletion of a number of bases that is not a multiple of three; every codon after it changes and an early stop often appears. Deleting exactly 3 bases removes one amino acid and keeps the frame.', topic: Mutations}
- {front: Somatic vs germline mutation, back: 'Somatic: in body cells, not inherited (may contribute to cancer). Germline: in cells that make eggs or sperm, can be passed to offspring.', topic: Mutations}
- {front: PCR formula and steps, back: 'Denature (~95 °C) → anneal primers (~50–65 °C) → extend (~72 °C). Copies after $n$ cycles: $N = N_0 \times 2^n$.', topic: PCR}
- {front: Reading a gel, back: 'DNA is negative and moves toward the positive electrode. Small fragments move farthest. Distance is roughly linear in log(size), so estimate sizes from a ladder on a log scale.', topic: Gel electrophoresis}
- {front: Fragments from restriction cuts, back: '$n$ cuts give $n + 1$ fragments of a linear DNA molecule but $n$ fragments of a circular one (such as a plasmid).', topic: Biotechnology}
- {front: Making a recombinant plasmid, back: 'Cut plasmid and gene with the same restriction enzyme → sticky ends pair → ligase seals → put into bacteria → select with antibiotic → bacteria express the gene (for example, human insulin).', topic: Biotechnology}
- {front: How DNA profiling excludes or matches, back: 'Compare STR lengths at about 20 regions. One mismatch excludes a person; a match at every region is strong evidence (identical twins share a profile).', topic: Biotechnology}
- {front: Inducible vs repressible operon, back: 'Inducible (lac): normally off; an inducer inactivates the repressor to turn genes on. Repressible (trp): normally on; a corepressor activates the repressor to turn genes off.', topic: Operons}
- {front: 'Which pathways are inducible and which repressible?', back: 'Breakdown (catabolic) pathways are usually inducible: run only when the food is present. Building (anabolic) pathways are usually repressible: shut off by their own product.', topic: Operons}
- {front: The trp operon with high tryptophan, back: 'Tryptophan (corepressor) binds the trp repressor, which then binds the operator and blocks transcription of the five tryptophan-making genes.', topic: Operons}
- {front: 'Lac operon: glucose and lactose', back: 'High transcription only with lactose present (repressor released) and glucose absent (cAMP high, CAP–cAMP bound). Glucose + lactose: low. No lactose: essentially none.', topic: Operons}
- {front: Cis-acting vs trans-acting, back: 'Cis: a DNA site (operator, promoter, enhancer) that controls only genes on its own molecule. Trans: a diffusible product (repressor, CAP, transcription factor) that can act on any copy.', topic: Operons}
- {front: 'Lac partial diploids: $I^-$, $O^C$, $I^S$', back: '$I^-$ (no repressor): recessive, since normal repressor acts in trans. $O^C$ (operator can''t bind repressor): constitutive for genes on the same molecule only (cis). $I^S$ (repressor can''t bind inducer): dominant, uninducible.', topic: Operons}
- {front: How an enhancer works, back: 'Activators bind the enhancer, which can be far away and in either orientation; the DNA loops, and Mediator links the activators to RNA polymerase II and the general transcription factors at the promoter.', topic: Eukaryotic gene regulation}
- {front: Reporter assay, back: 'Join candidate control DNA to an easily measured reporter gene (such as luciferase), remove or move pieces, and see which pieces change output. A piece that works far away and backwards is an enhancer.', topic: Eukaryotic gene regulation}
- {front: Histone acetylation vs DNA methylation, back: 'Acetyl groups on histone tails loosen chromatin and usually activate genes. Methyl groups on CpG cytosines in promoters usually silence genes.', topic: Epigenetics}
- {front: How a methylation pattern is copied, back: 'CpG pairs with CpG, so both strands are marked. After replication each site is half-methylated; a maintenance enzyme methylates the new strand to match.', topic: Epigenetics}
- {front: Examples of epigenetic inheritance, back: 'X inactivation in female mammals (calico cats), genomic imprinting (only the father''s IGF2 copy is active), and cell types keeping their identity through divisions.', topic: Epigenetics}
- {front: Counting splice variants, back: 'Mutually exclusive clusters multiply: Dscam has $12 \times 48 \times 33 \times 2 = 38{,}016$ possible mRNAs. Each optional cassette exon doubles the count ($2^n$ for $n$ of them).', topic: Eukaryotic gene regulation}
- {front: How a microRNA works, back: 'Transcribed as a hairpin, cut by Drosha and Dicer to about 22 bases, loaded into Argonaute; its seed (bases 2–8) pairs with sites in target mRNA 3′ untranslated regions, reducing translation and speeding decay.', topic: Eukaryotic gene regulation}
- {front: How Sanger sequencing works, back: 'A little of each fluorescent ddNTP stops new strands at every position; capillary electrophoresis sorts them by length, and the color of each end, read shortest first, spells the new strand 5′ → 3′.', topic: Genomics}
- {front: Coverage formula, back: '$C = NL/G$ (reads × read length ÷ genome size). The fraction of bases missed by chance is about $e^{-C}$: 37% at 1×, essentially none at 30×.', topic: Genomics}
- {front: Short reads vs long reads, back: 'Short reads (about 150 bases): cheap, accurate, billions per run, but can''t place long repeats. Long reads (thousands of bases or more, e.g. nanopore): span repeats and structural changes.', topic: Genomics}
- {front: Human genome by the numbers, back: 'About 3.1 billion bp per set; about 20,000 protein-coding genes; about 1.5% codes for protein; about half derived from transposable elements; unrelated people differ at about 1 base in 1,000.', topic: Genomics}
- {front: Percent identity, back: 'Identical positions ÷ aligned positions (gaps included) × 100. Silent third-codon-position differences are usually the most common.', topic: Genomics}
- {front: How Cas9 finds and cuts its target, back: 'Scans for a PAM (5′-NGG-3′) → unwinds the DNA beside it → the 20-base guide pairs with the target strand → both strands are cut about 3 bases from the PAM.', topic: Gene editing}
- {front: Designing a guide RNA, back: 'Find NGG; take the 20 bases just 5′ of it; the guide spacer has that sequence with U for T. The cut falls 3 bases from the PAM.', topic: Gene editing}
- {front: End joining vs template repair after a Cas9 cut, back: 'Nonhomologous end joining: frequent, leaves small insertions or deletions, used to knock genes out. Homology-directed repair: needs a supplied template, less frequent, makes precise edits.', topic: Gene editing}
- {front: Somatic vs germline gene editing, back: 'Somatic: changes only the patient''s body cells (e.g. Casgevy, edited blood stem cells); not inherited. Germline: changes embryos, eggs or sperm, so the change passes to future generations; widely considered unacceptable for now.', topic: Gene editing}
