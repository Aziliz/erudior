- id: bio-percent-change
  title: Percent change in a measurement
  topic: Scientific method
  vars:
    a: {min: 20, max: 400, step: 4}
    b: {min: 10, max: 600, step: 2}
  where: ['b != a', 'abs(b - a) <= 1.5*a', 'mod((b - a)*1000, a) == 0']
  calc:
    diff: b - a
    pc: (b - a) / a * 100
  prompt: 'A sample of pond water held {a} water fleas (*Daphnia*) per liter before a chemical was added and {b} per liter one week later. Find the percent change. Give a percent to 1 decimal place, negative for a decrease.'
  answers:
    - {name: pc, label: 'Percent change', tolerance: 0.05, format: num1}
  solution: |-
    $$\text{percent change} = \frac{\text{new} - \text{original}}{\text{original}} \times 100\% = \frac{{b} - {a}}{{a}} \times 100\%$$

    The change is ${diff}$, and ${diff} / {a} \times 100 =$ **{pc:num1}%**. Divide by the original value ({a}), not the new one.
- id: bio-mean-data
  title: Mean and range of trial data
  topic: Scientific method
  vars:
    v1: {min: 8, max: 30}
    v2: {min: 8, max: 30}
    v3: {min: 8, max: 30}
    v4: {min: 8, max: 30}
    v5: {min: 8, max: 30}
  where: ['max(v1, v2, v3, v4, v5) - min(v1, v2, v3, v4, v5) <= 12']
  calc:
    tot: v1 + v2 + v3 + v4 + v5
    m: (v1 + v2 + v3 + v4 + v5) / 5
    rng: max(v1, v2, v3, v4, v5) - min(v1, v2, v3, v4, v5)
  prompt: 'Five bean plants given the same fertilizer grew {v1}, {v2}, {v3}, {v4} and {v5} cm in three weeks. Find the mean height (1 decimal place) and the range of the heights (in cm).'
  answers:
    - {name: m, label: 'Mean (cm)', tolerance: 0.05, format: num1}
    - {name: rng, label: 'Range (cm)', format: integer}
  solution: |-
    Mean $= \dfrac{\text{sum}}{\text{count}} = \dfrac{{v1} + {v2} + {v3} + {v4} + {v5}}{5} = \dfrac{{tot}}{5} =$ **{m:num1} cm**.

    Range $=$ largest $-$ smallest $=$ **{rng} cm**. The range shows how much the plants varied; a large range makes a difference between group means less convincing.
- id: bio-ph-scale
  title: Comparing hydrogen ion concentrations
  topic: pH
  vars:
    pA: {min: 1, max: 6}
    d: {min: 1, max: 4}
  calc:
    pB: pA + d
    fold: 10^d
    hconc: 10^(-pA)
  prompt: 'Solution A has a pH of {pA} and solution B has a pH of {pB}. (a) What is the hydrogen ion concentration of A in mol/L? (You can type a power of ten such as 10^-3 or 1e-3.) (b) How many times greater is the H⁺ concentration in A than in B?'
  answers:
    - {name: hconc, label: '(a) $[\text{H}^+]$ in A (mol/L)', relTolerance: 0.01, format: sci}
    - {name: fold, label: '(b) times greater', format: integer}
  solution: |-
    (a) $[\text{H}^+] = 10^{-\text{pH}} =$ **$10^{-{pA}}$ mol/L**.

    (b) The pH values differ by ${pB} - {pA} = {d}$, and each pH unit is a factor of 10, so A has $10^{{d}} =$ **{fold}** times the H⁺ concentration of B. (Not {d} times: the scale is logarithmic.)
- id: bio-dehydration
  title: Water released and mass of a polymer
  topic: Macromolecules
  vars:
    mono: {choices: [{label: 'glucose (180 g/mol)', value: 180}, {label: 'the amino acid glycine (75 g/mol)', value: 75}, {label: 'the amino acid alanine (89 g/mol)', value: 89}]}
    n: {min: 3, max: 40}
  calc:
    M: mono + 0
    w: n - 1
    mass: n*mono - (n - 1)*18
    raw: n*mono
    lost: (n - 1)*18
  prompt: 'A cell joins {n} molecules of {mono} into a single unbranched chain by dehydration synthesis. (a) How many water molecules are released? (b) What is the molar mass of the chain in g/mol? (Water is 18 g/mol.)'
  answers:
    - {name: w, label: '(a) water molecules', format: integer}
    - {name: mass, label: '(b) molar mass (g/mol)', format: integer}
  solution: |-
    (a) A chain of $n$ monomers has $n - 1$ bonds, and each bond releases one water: ${n} - 1 =$ **{w}**.

    (b) Start with the monomers and subtract the water: ${n} \times {M} - {w} \times 18 = {raw} - {lost} =$ **{mass} g/mol**.
- id: bio-enzyme-rate
  title: Initial rate of an enzyme reaction
  topic: Enzymes
  vars:
    t: {choices: [10, 15, 20, 30]}
    v1: {min: 4, max: 30}
    v2: {min: 5, max: 60}
  where: ['v2 > v1', 'v2 <= 3*v1', 'mod((v2 - v1)*100, v1) == 0']
  calc:
    r1: v1 / t
    r2: v2 / t
    pc: (v2 - v1) / v1 * 100
  prompt: 'Potato catalase is added to hydrogen peroxide. At 20 °C it releases {v1} mL of oxygen in the first {t} s; in an identical setup at 35 °C it releases {v2} mL in the first {t} s. Find each initial rate in mL/s (2 decimal places) and the percent increase in rate from 20 °C to 35 °C.'
  answers:
    - {name: r1, label: 'Rate at 20 °C (mL/s)', relTolerance: 0.01, format: num2}
    - {name: r2, label: 'Rate at 35 °C (mL/s)', relTolerance: 0.01, format: num2}
    - {name: pc, label: 'Percent increase', tolerance: 0.05, format: num1}
  solution: |-
    Rate $=$ change in volume $\div$ time.

    At 20 °C: ${v1} \div {t} =$ **{r1:num2} mL/s**. At 35 °C: ${v2} \div {t} =$ **{r2:num2} mL/s**.

    Percent increase in rate: the times are equal, so compare the volumes directly (this avoids rounding the rates): $\dfrac{{v2} - {v1}}{{v1}} \times 100\% =$ **{pc:num1}%**. Warming toward the optimum speeds collisions between enzyme and substrate.
- id: bio-h-helix
  title: Sizing an alpha helix and a beta strand
  topic: Protein structure
  vars:
    n: {min: 18, max: 72, step: 9}
  calc:
    turns: n / 3.6
    hlen: n * 0.15
    slen: n * 0.34
  prompt: 'A stretch of {n} amino acids folds into an α helix, which has 3.6 amino acids per turn and rises 0.15 nm per amino acid. (a) How many turns does the helix make? (b) How long is it, in nm? (c) If the same stretch formed a β strand instead, at 0.34 nm per amino acid, how long would it be, in nm? Give lengths to 2 decimal places.'
  answers:
    - {name: turns, label: '(a) turns', tolerance: 0.05, format: num1}
    - {name: hlen, label: '(b) helix length (nm)', tolerance: 0.01, format: num2}
    - {name: slen, label: '(c) strand length (nm)', tolerance: 0.01, format: num2}
  solution: |-
    (a) Turns $=$ amino acids $\div$ 3.6 $= {n} \div 3.6 =$ **{turns:num1}**.

    (b) Helix length $= {n} \times 0.15 \text{ nm} =$ **{hlen:num2} nm**.

    (c) Strand length $= {n} \times 0.34 \text{ nm} =$ **{slen:num2} nm**. The strand is more than twice as long because its backbone is stretched out instead of coiled.
- id: bio-h-disulfide
  title: Random disulfide pairings
  topic: Protein structure
  vars:
    k: {choices: [4, 6, 8, 10]}
  calc:
    pairs: k / 2
    ways: fact(k) / (2^(k/2) * fact(k/2))
    pct: 100 / ways
  prompt: 'A small protein has {k} cysteines, which form {pairs} disulfide bonds in the native shape. If the bonds formed at random in an unfolded chain, (a) how many different sets of pairings are possible, and (b) what percent of the time would the native set form? Give (b) to 2 significant figures.'
  answers:
    - {name: ways, label: '(a) possible pairings', format: integer}
    - {name: pct, label: '(b) percent native', sigfigs: 2, format: sig2}
  solution: |-
    (a) Pair the first unpaired cysteine with any of the others, then repeat: the number of choices is $({k} - 1) \times ({k} - 3) \times \dots \times 1$, which equals $\dfrac{{k}!}{2^{{pairs}} \cdot {pairs}!} =$ **{ways}**.

    (b) Only one set is native: $\dfrac{1}{{ways}} \times 100\% =$ **{pct:sig2}%**. Anfinsen found about 1% activity when ribonuclease (8 cysteines, 105 pairings) formed its bonds while unfolded, matching this random-pairing prediction.
- id: bio-h-mm-rate
  title: Rate from the Michaelis–Menten equation
  topic: Enzyme kinetics
  vars:
    vmax: {choices: [40, 60, 80, 100, 120, 150, 200]}
    km: {choices: [1, 2, 4, 5, 8, 10]}
    f: {choices: [0.25, 0.5, 1, 2, 3, 4, 9]}
  calc:
    sconc: f * km
    frac: sconc / (km + sconc)
    rate: vmax * sconc / (km + sconc)
    pct: 100 * sconc / (km + sconc)
    den: km + sconc
  prompt: 'An enzyme has $V_{\max} = {vmax}$ µmol/min and $K_m = {km}$ mM. Find the initial rate when the substrate concentration is {sconc} mM (1 decimal place), and give that rate as a percent of $V_{\max}$ (1 decimal place).'
  answers:
    - {name: rate, label: 'Rate (µmol/min)', tolerance: 0.05, format: num1}
    - {name: pct, label: 'Percent of $V_{\max}$', tolerance: 0.05, format: num1}
  solution: |-
    $$v = \frac{V_{\max}\,[\text{S}]}{K_m + [\text{S}]} = \frac{{vmax} \times {sconc}}{{km} + {sconc}} = \frac{{vmax} \times {sconc}}{{den}}$$

    So $v =$ **{rate:num1} µmol/min**. As a fraction of the maximum, $\dfrac{{sconc}}{{den}} = {frac:num4}$, which is **{pct:num1}%** of $V_{\max}$. (At $[\text{S}] = K_m$ the answer is always 50%.)
- id: bio-h-lineweaver
  title: Km and Vmax from a Lineweaver–Burk line
  topic: Enzyme kinetics
  vars:
    vmax: {choices: [10, 20, 25, 40, 50, 100]}
    km: {choices: [0.5, 1, 2, 4, 5]}
  calc:
    yint: 1 / vmax
    lbslope: km / vmax
    xint: -1 / km
  prompt: 'A Lineweaver–Burk plot of $1/v$ (min per µmol) against $1/[\text{S}]$ (per mM) for an enzyme gives a straight line with $y$-intercept {yint} and slope {lbslope}. Find $V_{\max}$ (µmol/min) and $K_m$ (mM).'
  answers:
    - {name: vmax, label: '$V_{\max}$ (µmol/min)', relTolerance: 0.01}
    - {name: km, label: '$K_m$ (mM)', relTolerance: 0.01}
  solution: |-
    The line is $\dfrac{1}{v} = \dfrac{K_m}{V_{\max}} \cdot \dfrac{1}{[\text{S}]} + \dfrac{1}{V_{\max}}$.

    The $y$-intercept is $1/V_{\max}$, so $V_{\max} = 1 / {yint} =$ **{vmax} µmol/min**.

    The slope is $K_m / V_{\max}$, so $K_m = \text{slope} \times V_{\max} = {lbslope} \times {vmax} =$ **{km} mM**. (Check: the $x$-intercept, $-1/K_m$, is {xint}.)
- id: bio-h-competitive
  title: Effect of a competitive inhibitor
  topic: Enzyme kinetics
  vars:
    vmax: {choices: [50, 80, 100, 120]}
    km: {choices: [1, 2, 4, 5]}
    ki: {choices: [1, 2, 5, 10]}
    inh: {min: 1, max: 20}
    f: {choices: [1, 2, 4]}
  where: ['mod(inh, ki) == 0', 'inh / ki <= 6']
  calc:
    sconc: f * km
    fac: 1 + inh / ki
    kmapp: km * (1 + inh / ki)
    v0: vmax * sconc / (km + sconc)
    vi: vmax * sconc / (kmapp + sconc)
    den: kmapp + sconc
  prompt: 'An enzyme has $V_{\max} = {vmax}$ µmol/min and $K_m = {km}$ mM. A competitive inhibitor with $K_i = {ki}$ µM is added at {inh} µM. (a) What is the apparent $K_m$ (mM)? (b) What is the rate at a substrate concentration of {sconc} mM, with the inhibitor present (1 decimal place)?'
  answers:
    - {name: kmapp, label: '(a) apparent $K_m$ (mM)', relTolerance: 0.01}
    - {name: vi, label: '(b) rate (µmol/min)', tolerance: 0.05, format: num1}
  solution: |-
    (a) A competitive inhibitor multiplies $K_m$ by $1 + [\text{I}]/K_i = 1 + {inh}/{ki} = {fac}$, so $K_m^{\text{app}} = {km} \times {fac} =$ **{kmapp} mM**. $V_{\max}$ is unchanged.

    (b) $v = \dfrac{{vmax} \times {sconc}}{{kmapp} + {sconc}} = \dfrac{{vmax} \times {sconc}}{{den}} =$ **{vi:num1} µmol/min**, compared with {v0:num1} µmol/min without the inhibitor. More substrate would close the gap.
