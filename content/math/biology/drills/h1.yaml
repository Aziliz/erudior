# ---- h1 Honors: Research and biostatistics
- id: bio-h-sample-size
  title: Sample size for a target standard error
  topic: Experimental design
  vars:
    sdv: {min: 6, max: 30}
    tse: {choices: [1, 1.5, 2, 2.5, 3]}
  calc:
    ratio: sdv / tse
    nmin: (sdv / tse)^2
    nn: ceil((sdv / tse)^2)
    chk: sdv / sqrt(ceil((sdv / tse)^2))
  where: ['ceil((sdv / tse)^2) >= 5', 'ceil((sdv / tse)^2) <= 250', 'abs((sdv / tse)^2 - round((sdv / tse)^2)) > 0.05']
  prompt: 'A pilot study finds that the heart rates of water fleas (*Daphnia*) at 20 °C have a standard deviation of about {sdv} beats per minute. How many animals per group do you need so that the standard error of each group''s mean is at most {tse} beats per minute? Give a whole number.'
  answers:
    - {name: nn, label: 'Animals per group', format: integer}
  solution: |-
    The standard error is $\text{SE} = \dfrac{\text{SD}}{\sqrt{n}}$, so we need $\dfrac{{sdv}}{\sqrt{n}} \le {tse}$.

    Rearranging: $\sqrt{n} \ge \dfrac{{sdv}}{{tse}} = {ratio:num4}$, so $n \ge {ratio:num4}^2 = {nmin:num2}$.

    Round up (a fraction of an animal won't do): **{nn}** per group. Check: ${sdv}/\sqrt{{nn}} = {chk:num2}$, which is at most {tse}.
- id: bio-h-incidence
  title: Disease rates per 100,000 in a trial
  topic: Experimental design
  vars:
    nv: {min: 20, max: 200, step: 5}
    np: {min: 20, max: 200, step: 5}
    cv: {min: 5, max: 60}
    cp: {min: 20, max: 200}
  calc:
    sizev: nv * 1000
    sizep: np * 1000
    rv: cv * 100 / nv
    rp: cp * 100 / np
    red: (cp * 100 / np - cv * 100 / nv) / (cp * 100 / np) * 100
  where: ['cp * 100 / np > 1.3 * cv * 100 / nv', '(cp * 100 / np - cv * 100 / nv) / (cp * 100 / np) * 100 <= 95']
  prompt: 'In a randomized, double-blind vaccine trial, {cv} of {sizev} vaccinated children and {cp} of {sizep} children given a placebo developed the disease. Find (a) the rate per 100,000 in the vaccine group, (b) the rate per 100,000 in the placebo group, and (c) the percent reduction in the rate. Give each to 1 decimal place.'
  answers:
    - {name: rv, label: '(a) Vaccine rate per 100,000', format: num1, tolerance: 0.06}
    - {name: rp, label: '(b) Placebo rate per 100,000', format: num1, tolerance: 0.06}
    - {name: red, label: '(c) Percent reduction', format: num1, tolerance: 0.15}
  solution: |-
    Rate per 100,000 $= \dfrac{\text{cases}}{\text{group size}} \times 100{,}000$.

    (a) $\dfrac{{cv}}{{sizev}} \times 100{,}000 =$ **{rv:num1}**.

    (b) $\dfrac{{cp}}{{sizep}} \times 100{,}000 =$ **{rp:num1}**.

    (c) Percent reduction $= \dfrac{\text{placebo rate} - \text{vaccine rate}}{\text{placebo rate}} \times 100\% = \dfrac{{rp:num2} - {rv:num2}}{{rp:num2}} \times 100\% =$ **{red:num1}%**. Compare rates, not raw case counts, because the groups are different sizes.
- id: bio-h-sd-se
  title: Mean, standard deviation, and standard error
  topic: Descriptive statistics
  vars:
    v1: {min: 20, max: 40}
    v2: {min: 20, max: 40}
    v3: {min: 20, max: 40}
    v4: {min: 20, max: 40}
    v5: {min: 20, max: 40}
  calc:
    tot: v1 + v2 + v3 + v4 + v5
    m: mean(v1, v2, v3, v4, v5)
    ss: (v1 - m)^2 + (v2 - m)^2 + (v3 - m)^2 + (v4 - m)^2 + (v5 - m)^2
    vr: variance(v1, v2, v3, v4, v5)
    s: stdev(v1, v2, v3, v4, v5)
    se: stdev(v1, v2, v3, v4, v5) / sqrt(5)
  where: ['max(v1, v2, v3, v4, v5) - min(v1, v2, v3, v4, v5) >= 4']
  prompt: 'Five leaves from five different bean plants are {v1}, {v2}, {v3}, {v4} and {v5} mm long. Find the mean (1 decimal place), the sample standard deviation and the standard error of the mean (each to 2 decimal places).'
  answers:
    - {name: m, label: 'Mean (mm)', format: num1, tolerance: 0.05}
    - {name: s, label: 'SD (mm)', format: num2, tolerance: 0.015}
    - {name: se, label: 'SE (mm)', format: num2, tolerance: 0.015}
  solution: |-
    Mean: $\bar{x} = \dfrac{{tot}}{5} =$ **{m:num1} mm**.

    Square each deviation from the mean and add: $\sum (x - \bar{x})^2 = {ss:num2}$.

    Divide by $n - 1 = 4$: ${ss:num2}/4 = {vr:num4}$. Square root: $s =$ **{s:num2} mm**.

    Standard error: $\text{SE} = s/\sqrt{5} = {s:num4}/2.236 =$ **{se:num2} mm**.
- id: bio-h-ci95
  title: Standard error and an approximate 95% confidence interval
  topic: Descriptive statistics
  vars:
    mval: {min: 60, max: 90}
    sdv: {min: 6, max: 16}
    nn: {choices: [16, 25, 36, 49, 64, 100]}
  calc:
    rt: sqrt(nn)
    se: sdv / sqrt(nn)
    half: 2 * sdv / sqrt(nn)
    lo: mval - 2 * sdv / sqrt(nn)
    hi: mval + 2 * sdv / sqrt(nn)
  prompt: 'A sample of {nn} adults has a mean resting heart rate of {mval} beats per minute with a standard deviation of {sdv} beats per minute. Find the standard error of the mean, then the approximate 95% confidence interval for the mean using mean ± 2 SE. Give each to 2 decimal places.'
  answers:
    - {name: se, label: 'SE', format: num2, tolerance: 0.01}
    - {name: lo, label: 'Lower limit', format: num2, tolerance: 0.02}
    - {name: hi, label: 'Upper limit', format: num2, tolerance: 0.02}
  solution: |-
    $\text{SE} = \dfrac{s}{\sqrt{n}} = \dfrac{{sdv}}{{rt}} =$ **{se:num2}** beats per minute.

    $2\,\text{SE} = {half:num2}$, so the interval is ${mval} - {half:num2} =$ **{lo:num2}** to ${mval} + {half:num2} =$ **{hi:num2}** beats per minute.

    This is a range of plausible values for the population mean, not for individual heart rates (about 95% of individuals fall within roughly ±2 SD, a much wider band).
- id: bio-h-chi-independence
  title: Chi-square test of independence (2 × 2)
  topic: Hypothesis testing
  vars:
    a: {min: 12, max: 80}
    b: {min: 12, max: 80}
    c: {min: 12, max: 80}
    d: {min: 12, max: 80}
  calc:
    r1: a + b
    r2: c + d
    c1: a + c
    c2: b + d
    tot: a + b + c + d
    e11: (a + b) * (a + c) / (a + b + c + d)
    e12: (a + b) * (b + d) / (a + b + c + d)
    e21: (c + d) * (a + c) / (a + b + c + d)
    e22: (c + d) * (b + d) / (a + b + c + d)
    dev: abs(a - (a + b) * (a + c) / (a + b + c + d))
    chi: (a - e11)^2 / e11 + (b - e12)^2 / e12 + (c - e21)^2 / e21 + (d - e22)^2 / e22
    df: '1'
    rej: if(chi >= 3.84, 1, 0)
  where: ['abs(chi - 3.84) > 0.2', 'e11 >= 5', 'e12 >= 5', 'e21 >= 5', 'e22 >= 5']
  prompt: |-
    Snails of one species are banded or unbanded. A biologist counts them in two habitats:

    | | Banded | Unbanded |
    |---|---|---|
    | Woodland | {a} | {b} |
    | Grassland | {c} | {d} |

    Test whether banding is independent of habitat. Find the expected count of banded snails in woodland (2 decimal places), $\chi^2$ (2 decimal places) and the degrees of freedom, then decide: type 1 if you reject independence at $p = 0.05$, 0 if you fail to reject. Critical values at $p = 0.05$: df 1: 3.84, df 2: 5.99, df 3: 7.81.
  answers:
    - {name: e11, label: 'Expected banded, woodland', format: num2, tolerance: 0.01}
    - {name: chi, label: '$\chi^2 =$', format: num2, tolerance: 0.03}
    - {name: df, label: 'Degrees of freedom', format: integer}
    - {name: rej, label: 'Reject? (1 = yes, 0 = no)', format: integer}
  solution: |-
    Totals: woodland {r1}, grassland {r2}, banded {c1}, unbanded {c2}, all snails {tot}.

    Expected = row total × column total ÷ grand total. Banded in woodland: ${r1} \times {c1} / {tot} =$ **{e11:num2}**. The others: {e12:num2} (unbanded, woodland), {e21:num2} (banded, grassland), {e22:num2} (unbanded, grassland).

    In a 2 × 2 table every $|O - E|$ is the same, here {dev:num2}:
    $$\chi^2 = \frac{{dev:num2}^2}{{e11:num2}} + \frac{{dev:num2}^2}{{e12:num2}} + \frac{{dev:num2}^2}{{e21:num2}} + \frac{{dev:num2}^2}{{e22:num2}} = {chi:num2}$$

    So $\chi^2 \approx$ **{chi:num2}**, with df $= (2 - 1)(2 - 1) =$ **1** and critical value 3.84.

    Answer: **{rej}** (1 = reject: banding and habitat are associated; 0 = fail to reject: the data are consistent with independence).
- id: bio-h-t-stat
  title: The t statistic for two group means
  topic: Hypothesis testing
  vars:
    m1: {min: 40, max: 80}
    dm: {min: -12, max: 12}
    s1: {min: 4, max: 15}
    s2: {min: 4, max: 15}
    nn: {choices: [9, 16, 25]}
  calc:
    m2: m1 + dm
    rt: sqrt(nn)
    se1: s1 / sqrt(nn)
    se2: s2 / sqrt(nn)
    sed: sqrt((s1 / sqrt(nn))^2 + (s2 / sqrt(nn))^2)
    tval: abs(dm) / sqrt((s1 / sqrt(nn))^2 + (s2 / sqrt(nn))^2)
    adm: abs(dm)
    df: 2 * nn - 2
    crit: if(nn == 9, 2.12, if(nn == 16, 2.04, 2.01))
    rej: if(abs(dm) / sqrt((s1 / sqrt(nn))^2 + (s2 / sqrt(nn))^2) >= if(nn == 9, 2.12, if(nn == 16, 2.04, 2.01)), 1, 0)
  where: ['dm != 0', 'abs(abs(dm) / sqrt((s1 / sqrt(nn))^2 + (s2 / sqrt(nn))^2) - if(nn == 9, 2.12, if(nn == 16, 2.04, 2.01))) > 0.15']
  prompt: 'Two groups of {nn} randomly assigned bean plants grew under red or blue light. Red: mean height {m1} cm, SD {s1} cm. Blue: mean height {m2} cm, SD {s2} cm. Find the standard error of the difference (2 decimal places), the size of $t$ (2 decimal places) and the degrees of freedom. Then decide: type 1 if you reject the null hypothesis of equal means at $\alpha = 0.05$, 0 if you fail to reject. Critical values: df 16: 2.12; df 30: 2.04; df 48: 2.01.'
  answers:
    - {name: sed, label: '$\text{SE}_{\text{diff}}$ (cm)', format: num2, tolerance: 0.01}
    - {name: tval, label: '$|t|$', format: num2, tolerance: 0.02}
    - {name: df, label: 'Degrees of freedom', format: integer}
    - {name: rej, label: 'Reject? (1 = yes, 0 = no)', format: integer}
  solution: |-
    Standard errors: red ${s1}/\sqrt{{nn}} = {se1:num4}$, blue ${s2}/\sqrt{{nn}} = {se2:num4}$.

    $\text{SE}_{\text{diff}} = \sqrt{{se1:num4}^2 + {se2:num4}^2} =$ **{sed:num2}** cm.

    $|t| = \dfrac{|{m2} - {m1}|}{{sed:num4}} = \dfrac{{adm}}{{sed:num4}} =$ **{tval:num2}**.

    df $= {nn} + {nn} - 2 =$ **{df}**, critical value {crit}. Answer: **{rej}** (1 = the difference is statistically significant; 0 = it could easily be chance).
- id: bio-h-regression
  title: Least-squares line from four points
  topic: Hypothesis testing
  vars:
    x0: {choices: [14, 15, 16, 18]}
    dx: {choices: [2, 3, 4]}
    bb: {min: 5, max: 9}
    a0: {min: -40, max: -10}
    e1: {min: -4, max: 4}
    e2: {min: -4, max: 4}
    e3: {min: -4, max: 4}
    e4: {min: -4, max: 4}
  calc:
    x1: x0
    x2: x0 + dx
    x3: x0 + 2 * dx
    x4: x0 + 3 * dx
    y1: a0 + bb * x0 + e1
    y2: a0 + bb * (x0 + dx) + e2
    y3: a0 + bb * (x0 + 2 * dx) + e3
    y4: a0 + bb * (x0 + 3 * dx) + e4
    xbar: x0 + 1.5 * dx
    ybar: (y1 + y2 + y3 + y4) / 4
    sxy: (-1.5 * dx) * (y1 - ybar) + (-0.5 * dx) * (y2 - ybar) + (0.5 * dx) * (y3 - ybar) + (1.5 * dx) * (y4 - ybar)
    sxx: 5 * dx^2
    slope: sxy / sxx
    icpt: ybar - slope * xbar
  where: ['y1 >= 30', 'y2 > y1', 'y3 > y2', 'y4 > y3']
  prompt: |-
    A student counts cricket chirps per minute at four temperatures:

    | Temperature (°C) | {x1} | {x2} | {x3} | {x4} |
    |---|---|---|---|---|
    | Chirps per minute | {y1} | {y2} | {y3} | {y4} |

    Find the least-squares slope $b$ and intercept $a$ of the line $\hat{y} = a + bx$ (chirps per minute from temperature). Give each to 2 decimal places.
  answers:
    - {name: slope, label: 'Slope $b$', format: num2, tolerance: 0.01}
    - {name: icpt, label: 'Intercept $a$', format: num2, tolerance: 0.2}
  solution: |-
    Means: $\bar{x} = {xbar:num1}$, $\bar{y} = {ybar:num2}$.

    $\sum (x - \bar{x})(y - \bar{y}) = {sxy:num2}$ and $\sum (x - \bar{x})^2 = {sxx}$ (the $x$ deviations are $\pm\tfrac12$ and $\pm\tfrac32$ times {dx}).

    Slope: $b = {sxy:num2} / {sxx} =$ **{slope:num2}** chirps per minute per °C.

    Intercept: $a = \bar{y} - b\bar{x} = {ybar:num2} - {slope:num4} \times {xbar:num1} =$ **{icpt:num2}**.

    The intercept is far outside the data (it would be the chirp rate at 0 °C), so it has no biological meaning; it just positions the line.
- id: bio-h-fold-change
  title: Percent change and fold change from a figure
  topic: Scientific communication
  vars:
    cc: {min: 40, max: 300}
    tt: {min: 20, max: 600}
  calc:
    cm: cc / 100
    tm: tt / 100
    diff: (tt - cc) / 100
    pc: (tt - cc) / cc * 100
    fold: tt / cc
  where: ['tt != cc', 'tt / cc >= 0.3', 'tt / cc <= 4', 'abs(tt - cc) >= 10']
  prompt: 'A figure shows the mean amount of a protein (relative units) in control cells as {cm:num2} and in treated cells as {tm:num2}. Find the percent change from control to treated (1 decimal place, negative for a decrease) and the fold change, treated ÷ control (2 decimal places).'
  answers:
    - {name: pc, label: 'Percent change', format: num1, tolerance: 0.06}
    - {name: fold, label: 'Fold change', format: num2, tolerance: 0.006}
  solution: |-
    Percent change $= \dfrac{\text{treated} - \text{control}}{\text{control}} \times 100\% = \dfrac{{tm:num2} - {cm:num2}}{{cm:num2}} \times 100\% =$ **{pc:num1}%**.

    Fold change $= \dfrac{{tm:num2}}{{cm:num2}} =$ **{fold:num2}**. A fold change above 1 is an increase and below 1 a decrease; fold change $= 1 +$ percent change/100.
