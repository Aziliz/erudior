- id: bio-chargaff
  title: 'Chargaff''s rules: base percentages'
  topic: DNA structure
  vars:
    giv:
      choices:
      - label: adenine (A)
        value: 1
      - label: guanine (G)
        value: 2
      - label: thymine (T)
        value: 3
      - label: cytosine (C)
        value: 4
    x:
      min: 12
      max: 38
  where:
  - x != 25
  calc:
    y: 50 - x
    y2: 100 - 2*x
    pA: if(giv == 1 or giv == 3, x, 50 - x)
    pT: pA
    pG: 50 - pA
    pC: pG
  prompt: A sample of double-stranded DNA is {x}% {giv}. Find the percentage of each base. Enter whole-number percents.
  answers:
  - name: pA
    label: A (%)
  - name: pT
    label: T (%)
  - name: pG
    label: G (%)
  - name: pC
    label: C (%)
  solution: 'Base pairing makes A = T and G = C, so the given base and its partner are each {x}%. The other two bases share the rest, $100 - 2({x}) = {y2}$ percent, equally: {y}% each.


    A = **{pA}%**, T = **{pT}%**, G = **{pG}%**, C = **{pC}%**.'
