- id: bio-strand-counts
  title: Base counts and hydrogen bonds in a double helix
  topic: DNA structure
  vars:
    a:
      min: 5
      max: 40
    t:
      min: 5
      max: 40
    gg:
      min: 5
      max: 40
    cc:
      min: 5
      max: 40
  calc:
    n: a + t + gg + cc
    ca: t
    cg: cc
    at: a + t
    gc: gg + cc
    hb: 2*(a + t) + 3*(gg + cc)
  prompt: 'One strand of a DNA segment has {n} bases: {a} A, {t} T, {gg} G and {cc} C. For the double-stranded segment, find how many A and how many G are on the complementary strand, and the total number of hydrogen bonds holding the two strands together (A–T pairs have 2, G–C pairs have 3).'
  answers:
  - name: ca
    label: A on the other strand
    format: integer
  - name: cg
    label: G on the other strand
    format: integer
  - name: hb
    label: Hydrogen bonds
    format: integer
  solution: 'Each A on the given strand pairs with a T on the other, and each T with an A, so the other strand has as many A as the given strand has T: **{ca}**. Likewise its G count equals the given C count: **{cg}**.


    There are {a} + {t} = {at} A–T pairs and {gg} + {cc} = {gc} G–C pairs. Hydrogen bonds: $2({at}) + 3({gc}) =$ **{hb}**.'
