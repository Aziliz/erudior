- id: bio-pcr-copies
  title: Copies after PCR cycles
  topic: PCR
  vars:
    n0:
      choices:
      - 1
      - 2
      - 3
      - 5
      - 10
      - 20
      - 50
      - 100
    cyc:
      min: 10
      max: 30
  calc:
    tw: 2^cyc
    N: n0 * 2^cyc
    ex: floor(log10(n0 * 2^cyc))
    man: round(n0 * 2^cyc / 10^floor(log10(n0 * 2^cyc)), 2)
  prompt: A PCR reaction starts with {n0} copies of a target DNA sequence. Assuming the number of copies doubles every cycle, how many copies are there after {cyc} cycles? Give 3 significant figures (scientific notation such as 1.05e9 is fine).
  answers:
  - name: N
    label: Copies
    relTolerance: 0.005
  solution: 'Each cycle doubles the count, so after $n$ cycles $N = N_0 \times 2^n$.


    $N = {n0} \times 2^{{cyc}}$, and $2^{{cyc}}$ = {tw:int}, so $N =$ **{N:int}** copies, about ${man:num2} \times 10^{{ex}}$.'
- id: bio-gel-size
  title: Estimate fragment size from a DNA ladder
  topic: Gel electrophoresis
  vars:
    k:
      min: 18
      max: 26
    d1:
      min: 40
      max: 52
    sz:
      choices:
      - 600
      - 700
      - 800
      - 1200
      - 1300
      - 1500
      - 1600
      - 2500
      - 3000
      - 3500
      - 4000
      - 6000
      - 7000
  calc:
    d10: round(d1 - k, 1)
    d5: round(d1 - k*log10(5), 1)
    d2: round(d1 - k*log10(2), 1)
    d05: round(d1 + k*log10(2), 1)
    du: round(d1 - k*log10(sz/1000), 1)
    lg: round(3 + (d1 - du)/k, 3)
    est: 1000 * 10^((d1 - du)/k)
  prompt: 'A DNA ladder on a gel gives these bands (size in base pairs, distance from the well in mm):


    | Size (bp) | 10,000 | 5,000 | 2,000 | 1,000 | 500 |

    |---|---|---|---|---|---|

    | Distance (mm) | {d10} | {d5} | {d2} | {d1} | {d05} |


    An unknown fragment traveled {du} mm. Distance falls on a straight line against the logarithm of size. Estimate the fragment''s size in base pairs (within 5%).'
  answers:
  - name: est
    label: Size (bp)
    relTolerance: 0.05
    format: int
  solution: 'From 10,000 bp ({d10} mm) to 1,000 bp ({d1} mm) is a factor of 10 in size over {k} mm, so each {k} mm of travel is one step in $\log_{10}$ of size.


    The unknown band is ${d1} - {du}$ mm closer to the wells than the 1,000 bp band (if that difference is negative, it is farther, so smaller than 1,000 bp). $\log_{10}(\text{size}) = 3 + \dfrac{{d1} - {du}}{{k}} \approx {lg}$, so size $\approx 10^{{lg}} \approx$ **{est:int} bp**.'
- id: bio-restriction-fragments
  title: Restriction fragment sizes
  topic: Biotechnology
  vars:
    L:
      min: 6000
      max: 20000
      step: 500
    c1:
      min: 500
      max: 9000
      step: 100
    c2:
      min: 1500
      max: 19500
      step: 100
  where:
  - c2 > c1 + 400
  - c2 < L - 400
  - c1 != c2 - c1
  - c1 != L - c2
  - c2 - c1 != L - c2
  calc:
    f1: c1
    f2: c2 - c1
    f3: L - c2
    ca: c2 - c1
    cb: L - (c2 - c1)
  prompt: 'A linear DNA molecule {L} bp long is cut with a restriction enzyme that has sites at positions {c1} and {c2} (counted from the left end). Give the three fragment sizes from left to right. Then suppose the same DNA were a circle with the same two sites: give the size of the piece between the sites that contains positions {c1} to {c2}, and of the other piece.'
  answers:
  - name: f1
    label: Left (bp)
    format: integer
  - name: f2
    label: Middle (bp)
    format: integer
  - name: f3
    label: Right (bp)
    format: integer
  - name: ca
    label: Circle, piece from {c1} to {c2} (bp)
    format: integer
  - name: cb
    label: Circle, other piece (bp)
    format: integer
  solution: 'Linear: two cuts make three pieces. Left end to first cut: **{f1}** bp. Between cuts: {c2} − {c1} = **{f2}** bp. Second cut to right end: {L} − {c2} = **{f3}** bp. (Check: they add to {L}.)


    Circle: there are no ends, so two cuts make two pieces: **{ca}** bp between the sites, and {L} − {ca} = **{cb}** bp for the rest (the left and right pieces joined).'
- id: bio-h-splice-isoforms
  title: Counting alternatively spliced mRNAs
  topic: Eukaryotic gene regulation
  vars:
    c1:
      min: 2
      max: 12
    c2:
      min: 2
      max: 12
    c3:
      min: 2
      max: 8
    ncas:
      choices:
      - label: no optional cassette exons
        value: 0
      - label: one optional cassette exon, which can be included or skipped
        value: 1
      - label: two optional cassette exons, each of which can be included or skipped independently
        value: 2
      - label: three optional cassette exons, each of which can be included or skipped independently
        value: 3
  calc:
    nc: ncas
    base: c1*c2*c3
    pw: 2^ncas
    tot: c1*c2*c3*2^ncas
  prompt: A gene has three clusters of mutually exclusive exons, with {c1}, {c2} and {c3} alternatives. Every mRNA includes exactly one exon from each cluster. The gene also has {ncas}. How many different mRNAs can the gene make?
  answers:
  - name: tot
    label: mRNAs
    format: integer
  solution: 'Independent choices multiply. The three clusters give ${c1} \times {c2} \times {c3} = {base}$ combinations. Each optional cassette exon doubles the count, so the cassette exons multiply it by $2^{{nc}} = {pw}$.


    Total: ${base} \times {pw} =$ **{tot:int}** different mRNAs.'
- id: bio-h-coverage
  title: Reads needed for sequencing coverage
  topic: Genomics
  vars:
    org:
      choices:
      - label: a bacterial genome of 5 million base pairs
        value: 5
      - label: a yeast genome of 12 million base pairs
        value: 12
      - label: a fruit fly genome of 140 million base pairs
        value: 140
      - label: a human genome of 3,100 million base pairs
        value: 3100
    rlen:
      choices:
      - 100
      - 150
      - 250
    cov:
      choices:
      - 10
      - 20
      - 30
      - 40
      - 50
      - 60
  calc:
    gm: org
    nr: cov*org/rlen
  prompt: You want an average coverage of {cov}× for {org}, using reads {rlen} bases long. How many reads do you need, in millions? Give 3 significant figures.
  answers:
  - name: nr
    label: Reads (millions)
    relTolerance: 0.005
  solution: 'Coverage is $C = \dfrac{\text{number of reads} \times \text{read length}}{\text{genome size}}$, so the number of reads is $\dfrac{C \times \text{genome size}}{\text{read length}}$.


    Reads $= \dfrac{{cov} \times {gm} \text{ million}}{{rlen}} =$ **{nr:sig3} million**.'
- id: bio-h-chance-matches
  title: Chance matches of a short sequence in a genome
  topic: Gene editing
  vars:
    k:
      min: 8
      max: 16
    gs:
      choices:
      - label: 12 million
        value: 12000000
      - label: 140 million
        value: 140000000
      - label: 3.1 billion
        value: 3100000000
  calc:
    pos: 2*gs
    seqs: 4^k
    ex: 2*gs/4^k
  prompt: A genome has {gs} base pairs. If its sequence were random, how many times would one particular {k}-base sequence be expected to appear by chance, counting both strands? Give 3 significant figures.
  answers:
  - name: ex
    label: Expected matches
    relTolerance: 0.005
  solution: 'Every position on each strand starts one {k}-base window, so there are about ${pos:texsci}$ windows. A random window matches a given sequence with probability $1/4^{{k}}$, and $4^{{k}} = {seqs:int}$.


    Expected matches $= \dfrac{{pos:texsci}}{{seqs:int}} \approx$ **{ex:sig3}**.'
- id: bio-h-percent-identity
  title: Percent identity of an alignment
  topic: Genomics
  vars:
    alen:
      min: 40
      max: 300
      step: 10
    mm:
      min: 1
      max: 30
    gp:
      min: 0
      max: 12
  where:
  - mm + gp < alen/4
  calc:
    idn: alen - mm - gp
    pid: 100*(alen - mm - gp)/alen
  prompt: Two DNA sequences are aligned over {alen} positions, counting gap positions. The alignment has {mm} mismatches and {gp} gap positions, and every other position is identical. What is the percent identity? Give one decimal place.
  answers:
  - name: pid
    label: Identity (%)
    tolerance: 0.051
  solution: 'Identical positions: ${alen} - {mm} - {gp} = {idn}$.


    Percent identity $= \dfrac{{idn}}{{alen}} \times 100 =$ **{pid:num1}%**.'
