- id: bio-mitotic-index
  title: Mitotic index from a cell count
  topic: Mitosis
  vars:
    pro: {min: 4, max: 30}
    met: {min: 2, max: 12}
    ana: {min: 1, max: 6}
    tel: {min: 1, max: 8}
    inter: {min: 100, max: 400}
  calc:
    mit: pro + met + ana + tel
    tot: mit + inter
    mi: 100*mit/tot
  where: ['round(1000*mit/tot) == 1000*mit/tot']
  prompt: 'In an onion root tip, a student counts {inter} cells in interphase, {pro} in prophase, {met} in metaphase, {ana} in anaphase and {tel} in telophase. What is the mitotic index, as a percent? Give a decimal if needed (e.g. 12.5).'
  answers:
    - {name: mi, label: 'Mitotic index (%)', tolerance: 0.05}
  solution: |-
    Cells in mitosis: ${pro} + {met} + {ana} + {tel} = {mit}$. Total cells: ${mit} + {inter} = {tot}$.

    Mitotic index $= \dfrac{{mit}}{{tot}} \times 100\% =$ **{mi}%**.
- id: bio-phase-time
  title: Length of a stage from cell counts
  topic: Cell cycle
  vars:
    tot: {choices: [100, 120, 150, 200, 240, 250, 300, 400]}
    k: {min: 2, max: 40}
    cyc: {choices: [12, 16, 18, 20, 24, 30]}
    stage: {choices: [prophase, metaphase, anaphase, telophase]}
  calc:
    mins: k*cyc*60/tot
  where: ['round(mins) == mins', 'k < tot/5']
  prompt: 'A sample of {tot} actively dividing cells, not synchronized, contains {k} cells in {stage}. The whole cell cycle takes {cyc} hours. Estimate how long {stage} lasts, in minutes.'
  answers:
    - {name: mins, label: 'Time (min)', relTolerance: 0.01, units: {min: 1, h: 60}}
  solution: |-
    In an unsynchronized population, the fraction of cells in a stage equals the fraction of the cycle spent in it.

    Fraction of cells in {stage}: $\dfrac{{k}}{{tot}}$. Time $= \dfrac{{k}}{{tot}} \times {cyc} \text{ h} \times 60 \text{ min/h} =$ **{mins} minutes**.
- id: bio-chromatid-count
  title: Chromosomes and DNA molecules during mitosis
  topic: Mitosis
  vars:
    n2: {choices: [4, 6, 8, 12, 14, 16, 20, 24, 46]}
    st: {choices: [{label: G1, value: 1}, {label: G2, value: 2}, {label: metaphase, value: 3}, {label: anaphase (whole cell), value: 4}, {label: each daughter cell after cytokinesis, value: 5}]}
  calc:
    chr: if(st == 4, 2*n2, n2)
    dna: if(st == 1 or st == 5, n2, 2*n2)
  prompt: 'A body cell of a species with 2n = {n2} goes through the cell cycle and mitosis. How many chromosomes and how many DNA molecules (chromatids) are there at this point: {st}? Count each separated chromatid as a chromosome.'
  answers:
    - {name: chr, label: 'Chromosomes', format: integer}
    - {name: dna, label: 'DNA molecules', format: integer}
  solution: |-
    Rules: DNA doubles in S phase (each chromosome gets 2 sister chromatids), so G2 and metaphase have {n2} chromosomes and $2 \times {n2}$ DNA molecules. In anaphase the sister chromatids separate, so the cell briefly holds $2 \times {n2}$ chromosomes. G1 and each daughter cell have {n2} chromosomes of one DNA molecule each.

    At {st}: **{chr} chromosomes** and **{dna} DNA molecules**.
- id: bio-doubling
  title: Cell number after repeated divisions
  topic: Cancer
  vars:
    n0: {choices: [1, 2, 5, 10, 20, 50, 100]}
    dt: {choices: [6, 8, 12, 18, 20, 24]}
    gens: {min: 2, max: 12}
  calc:
    t: dt*gens
    nf: n0*2^gens
  prompt: 'A culture starts with {n0} cell(s) that divide every {dt} hours, with no cells dying. How many doublings happen in {t} hours, and how many cells are there then?'
  answers:
    - {name: gens, label: 'Doublings', format: integer}
    - {name: nf, label: 'Cells', format: integer}
  solution: |-
    Doublings: ${t} \div {dt} =$ **{gens}**.

    Each doubling multiplies the number by 2: $N = N_0 \times 2^{n} = {n0} \times 2^{{gens}} =$ **{nf} cells**.
- id: bio-doubling-time
  title: Doubling time from a cell count
  topic: Cancer
  vars:
    n0: {choices: [100, 200, 500, 1000, 2000]}
    gens: {min: 2, max: 10}
    dt: {min: 6, max: 40}
  calc:
    t: gens*dt
    nf: n0*2^gens
    ratio: 2^gens
  prompt: 'Tumor cells grown in a dish increase from {n0} to {nf} in {t} hours. Assuming steady doubling, how many doublings occurred, and what is the doubling time in hours?'
  answers:
    - {name: gens, label: 'Doublings', format: integer}
    - {name: dt, label: 'Doubling time (h)', relTolerance: 0.01, units: {h: 1}}
  solution: |-
    Growth factor: ${nf} \div {n0} = {ratio} = 2^{{gens}}$, so there were **{gens} doublings**.

    Doubling time: ${t} \div {gens} =$ **{dt} hours**.
- id: bio-gamete-combos
  title: Chromosome combinations from independent assortment
  topic: Meiosis
  vars:
    n: {min: 2, max: 10}
  calc:
    n2: 2*n
    gam: 2^n
    zyg: 4^n
  prompt: 'A species has a diploid number of 2n = {n2}. Ignoring crossing over, how many genetically different gametes can one individual make by independent assortment, and how many different chromosome combinations are possible in a zygote from two parents?'
  answers:
    - {name: gam, label: 'Gametes', format: integer}
    - {name: zyg, label: 'Zygotes', format: integer}
  solution: |-
    2n = {n2}, so there are n = {n} homologous pairs. Each pair can line up 2 ways at metaphase I: $2^{{n}} =$ **{gam}** kinds of gamete.

    Any of {gam} eggs can meet any of {gam} sperm: ${gam} \times {gam} =$ **{zyg}** combinations.
- id: bio-meiosis-count
  title: Chromosome number through meiosis
  topic: Meiosis
  vars:
    n2: {choices: [4, 6, 8, 12, 14, 16, 20, 24, 46]}
    st: {choices: [{label: G1 before meiosis, value: 1}, {label: metaphase I, value: 2}, {label: each cell right after meiosis I, value: 3}, {label: metaphase II (one cell), value: 4}, {label: each gamete, value: 5}]}
  calc:
    hn: n2/2
    chr: if(st <= 2, n2, hn)
    dna: if(st == 1, n2, if(st == 2, 2*n2, if(st == 5, hn, n2)))
  prompt: 'A cell of a species with 2n = {n2} undergoes meiosis. How many chromosomes and how many DNA molecules (chromatids) are in the cell at this point: {st}?'
  answers:
    - {name: chr, label: 'Chromosomes', format: integer}
    - {name: dna, label: 'DNA molecules', format: integer}
  solution: |-
    Rules: DNA is copied once, before meiosis I, so from then until meiosis II each chromosome has 2 chromatids. Meiosis I separates homologs (2n → n = {hn} chromosomes, each still double). Meiosis II separates sister chromatids, giving gametes with {hn} single chromosomes.

    At {st}: **{chr} chromosomes** and **{dna} DNA molecules**.
- id: bio-h-two-hit
  title: Two-hit model with Poisson tumor counts
  topic: Cyclins and CDKs
  vars:
    cm: {choices: [1, 2, 3, 4, 5]}
    mu: {choices: [0.2, 0.5, 1, 1.5, 2]}
  calc:
    m: cm*mu
    p1: 1 - exp(-m)
    p0: exp(-m)
  where: ['m >= 0.4', 'm <= 6']
  prompt: 'A child inherits one faulty copy of a tumor suppressor gene. In a simple model, {cm} million cells are at risk, and each has a {mu}-in-a-million chance of losing its good copy, so the number of tumors is a Poisson count. What is the expected number of tumors, and what is the probability of at least one tumor? Give the probability as a decimal to 3 places.'
  answers:
    - {name: m, label: 'Expected tumors', relTolerance: 0.01}
    - {name: p1, label: 'P(at least one)', tolerance: 0.002}
  solution: |-
    Expected number: $m = N\mu = {cm} \text{ million} \times \dfrac{{mu}}{1 \text{ million}} =$ **{m}**.

    For a Poisson count, $P(0) = e^{-m} = e^{-{m}} = {p0:dp3}$, so $P(\text{at least one}) = 1 - {p0:dp3} =$ **{p1:dp3}**.
- id: bio-h-flow-phases
  title: Phase lengths from flow cytometry
  topic: Cyclins and CDKs
  vars:
    tot: {choices: [200, 400, 500, 1000]}
    g1p: {min: 35, max: 65, step: 5}
    sp: {min: 15, max: 35, step: 5}
    cyc: {choices: [16, 18, 20, 22, 24]}
  calc:
    g2p: 100 - g1p - sp
    c1: tot*g1p/100
    cs: tot*sp/100
    c2: tot*g2p/100
    t1: cyc*g1p/100
    ts: cyc*sp/100
    t2: cyc*g2p/100
  where: ['g2p >= 10', 'g2p <= 30']
  prompt: 'A flow cytometer measures the DNA content of {tot} cells from an unsynchronized culture with a {cyc}-hour cycle: {c1} cells have 2C DNA, {cs} are between 2C and 4C, and {c2} have 4C. Estimate the length of G1, S, and G2 + M in hours.'
  answers:
    - {name: t1, label: 'G1 (h)', relTolerance: 0.01}
    - {name: ts, label: 'S (h)', relTolerance: 0.01}
    - {name: t2, label: 'G2 + M (h)', relTolerance: 0.01}
  solution: |-
    2C cells are in G1, cells between 2C and 4C are replicating (S), and 4C cells are in G2 or M. Each group's share of the cells estimates its share of the cycle.

    G1: $\dfrac{{c1}}{{tot}} \times {cyc} =$ **{t1} h**. S: $\dfrac{{cs}}{{tot}} \times {cyc} =$ **{ts} h**. G2 + M: $\dfrac{{c2}}{{tot}} \times {cyc} =$ **{t2} h**.
- id: bio-h-gamete-crossover
  title: Gamete kinds with crossing over
  topic: Genetic variation
  vars:
    np: {min: 2, max: 8}
    cx: {min: 1, max: 8}
  where: ['cx <= np']
  calc:
    n2: 2*np
    noc: 2^np
    gam: 4^cx * 2^(np - cx)
    rest: np - cx
  prompt: 'A species has 2n = {n2}. An individual is heterozygous for two genes on every chromosome pair. How many kinds of gamete can it make if no crossovers occur between the genes? How many if crossovers occur between the two genes in {cx} of the pairs (and never in the others)?'
  answers:
    - {name: noc, label: 'No crossovers', format: integer}
    - {name: gam, label: 'With crossovers', format: integer}
  solution: |-
    There are {np} pairs. Without crossovers, each pair contributes 2 kinds of chromatid: $2^{{np}} =$ **{noc}**.

    A pair with a crossover between the genes can contribute 4 kinds (two parental, two recombinant). With {cx} such pairs and {rest} without: $4^{{cx}} \times 2^{{rest}} =$ **{gam}**.
- id: bio-h-grandparent-share
  title: Grandparental chromosomes in a gamete
  topic: Genetic variation
  vars:
    np: {choices: [3, 4, 5, 6, 8, 10]}
    k: {min: 0, max: 10}
  where: ['k <= np']
  calc:
    num: nCr(np, k)
    den: 2^np
    p: num/den
  prompt: 'A species has {np} pairs of chromosomes. Ignoring crossing over, each chromosome in a gamete came from the grandmother or the grandfather on that side with probability 1/2, independently. What is the probability that exactly {k} of the {np} chromosomes in a gamete came from the grandmother? Answer as a fraction.'
  answers:
    - {name: p, label: 'Probability', kind: fraction}
  solution: |-
    The count is binomial: $P(k) = \dbinom{{np}}{{k}} \left(\tfrac12\right)^{{np}} = \dfrac{{num}}{{den}}$.

    So the probability is **{num}/{den}** (any equivalent fraction is fine).
- id: bio-h-triploid-balance
  title: Balanced gametes from a triploid
  topic: Genetic variation
  vars:
    xb: {min: 3, max: 12}
  calc:
    t3: 3*xb
    one: 2^xb
    p: 2/one
  prompt: 'A triploid plant has a basic set of x = {xb} chromosomes (3x = {t3}). At meiosis I each set of three homologs sends 1 copy to one pole and 2 to the other, each way equally likely and independently for each set. What fraction of gametes is balanced (exactly one or exactly two of every chromosome)? Answer as a fraction.'
  answers:
    - {name: p, label: 'Fraction balanced', kind: fraction}
  solution: |-
    A gamete gets one copy of every chromosome with probability $\left(\tfrac12\right)^{{xb}} = \tfrac{1}{{one}}$, and two copies of every chromosome with the same probability.

    Balanced: $2 \times \dfrac{1}{{one}} =$ **{p:frac}**.
