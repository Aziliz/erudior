# Honors module h2 drills (lessons 45-48)
- id: bio-h-cleavage-cells
  title: Cell number and cell size during cleavage
  topic: Embryonic development
  vars:
    n: {choices: [3, 6, 9, 12]}
    d: {choices: [0.9, 1.2, 1.5, 1.8]}
  calc:
    cells: 2^n
    third: n/3
    shrink: 2^(n/3)
    dc: d*1000/2^(n/3)
  prompt: 'A frog egg {d} mm in diameter goes through {n} synchronous cleavage divisions. Assume no growth and no cell death, and that the cells are roughly spheres sharing the egg''s volume equally. How many cells are there, and what is the average cell diameter in micrometers (µm)?'
  answers:
    - {name: cells, label: 'Cells', format: integer}
    - {name: dc, label: 'Cell diameter (µm)', relTolerance: 0.01}
  solution: |-
    Each division doubles the cell number: $2^{{n}} =$ **{cells} cells**.

    Each cell has $\tfrac{1}{{cells}}$ of the egg's volume. Diameter scales as the cube root of volume, so it shrinks by a factor of $\left(2^{{n}}\right)^{1/3} = 2^{{third}} = {shrink}$.

    $d = {d} \text{ mm} \times 1000 \,\mu\text{m/mm} \div {shrink} =$ **{dc} µm**.
- id: bio-h-morphogen-threshold
  title: Where a morphogen threshold falls
  topic: Pattern formation
  vars:
    lam: {choices: [50, 60, 80, 100, 120]}
    thr: {choices: [0.5, 0.25, 0.2, 0.1, 0.05]}
    k: {choices: [{label: doubled, value: 2}, {label: quadrupled, value: 4}, {label: halved, value: 0.5}]}
  calc:
    kv: k*1
    x1: lam*ln(1/thr)
    x2: lam*ln(kv/thr)
    shift: x2 - x1
  where: ['kv/thr > 1.5']
  prompt: 'A morphogen forms the gradient $C(x) = C_0 e^{-x/\lambda}$ with decay length $\lambda = {lam}$ µm. A target gene is switched on wherever $C \ge {thr}\,C_0$. (a) How far from the source (in µm) is the edge of the gene''s expression? (b) The dose at the source is {k}, so the front concentration becomes ${kv}\,C_0$ while the threshold stays the same. Where is the edge now? Give each to 1 decimal place.'
  answers:
    - {name: x1, label: '(a) edge (µm)', relTolerance: 0.01}
    - {name: x2, label: '(b) new edge (µm)', relTolerance: 0.01}
  solution: |-
    Set $C_0 e^{-x/\lambda}$ equal to the threshold and take natural logs: $x = \lambda \ln\!\left(\dfrac{C_{\text{source}}}{T}\right)$.

    (a) $x = {lam} \ln\!\left(\dfrac{1}{{thr}}\right) =$ **{x1:num1} µm**.

    (b) $x = {lam} \ln\!\left(\dfrac{{kv}}{{thr}}\right) =$ **{x2:num1} µm**, a shift of {shift:num1} µm (that is, $\lambda \ln {kv}$).
- id: bio-h-colony-frequency
  title: Stem cell frequency from colony counts
  topic: Stem cells
  vars:
    N: {choices: [100, 200, 250, 400, 500]}
    k: {min: 3, max: 60}
    f: {choices: [0.05, 0.1, 0.2, 0.25, 0.5]}
  calc:
    det: 100*k/N
    tru: det/f
  where: ['round(det*10) == det*10']
  prompt: 'Irradiated mice are each injected with {N},000 bone marrow cells, and an average of {k} spleen colonies form. Separate experiments show that only a fraction {f} of injected colony-forming cells lodge in the spleen. (a) How many colonies are detected per 100,000 cells injected? (b) What is the estimated true number of colony-forming cells per 100,000 marrow cells?'
  answers:
    - {name: det, label: '(a) detected per 100,000', relTolerance: 0.01}
    - {name: tru, label: '(b) true per 100,000', relTolerance: 0.01}
  solution: |-
    (a) Scale the count to 100,000 cells: ${k} \times \dfrac{100{,}000}{{N}{,}000} =$ **{det}** colonies per 100,000 cells.

    (b) Only a fraction {f} of colony-forming cells are detected, so divide: ${det} \div {f} =$ **{tru}** per 100,000 cells.
- id: bio-h-gene-density
  title: Gene density and coding fraction of a genome
  topic: Genome evolution
  vars:
    gsize: {choices: [20, 50, 120, 250, 400, 800, 1200, 2400, 3000]}
    genes: {min: 5000, max: 30000, step: 500}
    len: {choices: [1000, 1200, 1500, 1800]}
  calc:
    dens: genes/gsize
    coding: genes*len/1000000
    pct: 100*coding/gsize
  where: ['pct < 60']
  prompt: 'A newly sequenced eukaryote has a {gsize}-million-bp genome with about {genes} protein-coding genes, whose coding sequences average {len} bp. (a) How many genes are there per million base pairs? (b) About what percent of the genome codes for protein? Round to 2 significant figures or better.'
  answers:
    - {name: dens, label: '(a) genes per Mb', relTolerance: 0.01}
    - {name: pct, label: '(b) percent coding', relTolerance: 0.01}
  solution: |-
    (a) ${genes} \div {gsize} \approx$ **{dens:sig3}** genes per million bp.

    (b) Coding DNA: ${genes} \times {len} \text{ bp} = {coding:sig3}$ million bp. As a percent of the genome: ${coding:sig3} \div {gsize} \times 100\% \approx$ **{pct:sig3}%**.
- id: bio-h-te-copies
  title: Copy number of a transposable element
  topic: Genome evolution
  vars:
    gb: {choices: [1.2, 2.5, 3.1, 4.8]}
    p: {min: 2, max: 25}
    len: {choices: [300, 500, 1000, 2000, 6000]}
  calc:
    bp: p/100*gb*1e9
    copies: bp/len
  prompt: 'A transposable element family makes up {p}% of a {gb}-billion-bp genome. The average copy is {len} bp long. (a) How many base pairs of the genome belong to this family? (b) About how many copies are there? (You may type answers like 3.1e8.)'
  answers:
    - {name: bp, label: '(a) base pairs', relTolerance: 0.02}
    - {name: copies, label: '(b) copies', relTolerance: 0.02}
  solution: |-
    (a) ${p}\% \times {gb} \times 10^9 =$ **${bp:texsci}$** bp.

    (b) Divide by the length of one copy: ${bp:texsci} \div {len} \approx$ **${copies:texsci}$** copies.
