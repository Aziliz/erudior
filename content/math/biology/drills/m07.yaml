- id: bio-half-life
  title: Carbon-14 dating
  topic: Evidence for evolution
  vars:
    h:
      min: 1
      max: 6
  calc:
    pct: 100/2^h
    den: 2^h
    age: 5730*h
  prompt: Carbon-14 has a half-life of 5,730 years. A piece of charcoal has {pct:num4}% of the carbon-14 found in living wood. How many half-lives have passed, and how old is the charcoal in years?
  answers:
  - name: h
    label: Half-lives
    format: integer
  - name: age
    label: Age (years)
    relTolerance: 0.005
  solution: '{pct:num4}% is $\tfrac{1}{{den}} = \left(\tfrac12\right)^{{h}}$, so **{h}** half-lives have passed.


    Age $= {h} \times 5{,}730 =$ **{age:int} years**.'
- id: bio-k-ar-age
  title: Potassium-40 dating of volcanic rock
  topic: Evidence for evolution
  vars:
    h:
      min: 1
      max: 3
  calc:
    pct: 100/2^h
    age: 1.25*h
  prompt: Potassium-40 has a half-life of 1.25 billion years. A volcanic ash layer contains {pct}% of its original potassium-40. How old is the ash layer, in billions of years?
  answers:
  - name: age
    label: Age (billion years)
    tolerance: 0.005
  solution: '{pct:num4}% remaining is $\left(\tfrac12\right)^{{h}}$: {h} half-lives.


    Age $= {h} \times 1.25 =$ **{age} billion years**. A fossil just below this ash would be at least that old; one just above it, younger.'
- id: bio-selection-change
  title: Phenotype frequency after selection
  topic: Natural selection
  vars:
    nL:
      min: 200
      max: 900
      step: 50
    nD:
      min: 100
      max: 800
      step: 50
    sL:
      min: 10
      max: 90
      step: 5
    sD:
      min: 10
      max: 90
      step: 5
  where:
  - abs(sL - sD) >= 15
  calc:
    before: 100*nD/(nL + nD)
    svL: nL*sL/100
    svD: nD*sD/100
    tot: svL + svD
    after: 100*svD/(svL + svD)
  prompt: A moth population has {nL} light moths and {nD} dark moths. In one season, {sL}% of light moths and {sD}% of dark moths survive to reproduce. What percent of the population was dark before selection, and what percent of the survivors are dark? Give percents to 1 decimal place.
  answers:
  - name: before
    label: Dark before (%)
    tolerance: 0.06
  - name: after
    label: Dark among survivors (%)
    tolerance: 0.06
  solution: 'Before: $\dfrac{{nD}}{{nL} + {nD}} =$ **{before:num1}%** dark.


    Survivors: light ${nL} \times {sL}\% = {svL:sig6}$, dark ${nD} \times {sD}\% = {svD:sig6}$, total {tot:sig6}.


    Dark among survivors: $\dfrac{{svD:sig6}}{{tot:sig6}} =$ **{after:num1}%**.'
- id: bio-hw-frequencies
  title: 'Hardy-Weinberg: allele and genotype frequencies'
  topic: Hardy-Weinberg
  vars:
    q:
      min: 0.1
      max: 0.9
      step: 0.1
    N:
      min: 200
      max: 2000
      step: 100
  calc:
    q2: round(100*q^2, 0)
    q2d: q^2
    p: 1 - q
    het: 2*(1 - q)*q
    nhet: round(N*2*(1 - q)*q, 0)
  prompt: In a population in Hardy-Weinberg equilibrium, {q2}% of individuals show a recessive phenotype ($aa$). Find $q$, $p$ and the frequency of heterozygotes $2pq$ (as decimals), and the expected number of heterozygotes in a population of {N}.
  answers:
  - name: q
    label: $q$
    tolerance: 0.005
  - name: p
    label: $p$
    tolerance: 0.005
  - name: het
    label: $2pq$
    tolerance: 0.005
  - name: nhet
    label: Heterozygotes
    tolerance: 1
  solution: 'The recessive phenotype is $aa$, so $q^2 = {q2}\% = {q2d:num2}$, and $q = \sqrt{{q2d:num2}} =$ **{q}**.


    $p = 1 - q =$ **{p:num1}**. $2pq = 2({p:num1})({q}) =$ **{het:num2}**.


    Expected heterozygotes: ${het:num2} \times {N} =$ **{nhet:int}**.'
- id: bio-hw-carriers
  title: Carriers of a recessive disorder
  topic: Hardy-Weinberg
  vars:
    r:
      choices:
      - 10
      - 20
      - 25
      - 30
      - 40
      - 50
      - 60
      - 70
      - 80
      - 100
  calc:
    M: r^2
    qq: 1/r
    pp: 1 - 1/r
    car: 100*2*(1/r)*(1 - 1/r)
    oneIn: 1/(2*(1/r)*(1 - 1/r))
  prompt: A recessive disorder affects 1 in {M:int} people in a population assumed to be in Hardy-Weinberg equilibrium. What is the frequency $q$ of the disease allele (as an exact fraction), and what percent of people are carriers ($Aa$)? Give the percent to 2 decimal places.
  answers:
  - name: qq
    label: $q$
    kind: fraction
    lowestTerms: true
  - name: car
    label: Carriers (%)
    relTolerance: 0.005
  solution: 'Affected people are $aa$: $q^2 = \dfrac{1}{{M:dp0}}$, so $q = \sqrt{\tfrac{1}{{M:dp0}}} =$ **1/{r}**.


    $p = 1 - q = {pp:num4}$. Carriers: $2pq = 2 \times \tfrac{1}{{r}} \times {pp:num4} = {car:num4}\%$, about **{car:num2}%**, roughly 1 person in {oneIn:int}.'
- id: bio-allele-freq
  title: Allele frequencies from genotype counts
  topic: Hardy-Weinberg
  vars:
    AA:
      min: 20
      max: 400
      step: 5
    Aa:
      min: 20
      max: 400
      step: 5
    aa:
      min: 20
      max: 400
      step: 5
  where:
  - mod(2*AA + Aa, 1) == 0
  - mod(1000*(2*AA + Aa), 2*(AA + Aa + aa)) == 0
  calc:
    N: AA + Aa + aa
    cA: 2*AA + Aa
    tot: 2*(AA + Aa + aa)
    p: (2*AA + Aa)/(2*(AA + Aa + aa))
    q: 1 - p
    eAa: 2*p*(1 - p)*(AA + Aa + aa)
  prompt: A population has {AA} $AA$, {Aa} $Aa$ and {aa} $aa$ individuals. Find the allele frequencies $p$ (of $A$) and $q$ (of $a$) as decimals, and the number of heterozygotes expected if the population were in Hardy-Weinberg equilibrium (to the nearest whole number).
  answers:
  - name: p
    label: $p$
    tolerance: 0.0005
  - name: q
    label: $q$
    tolerance: 0.0005
  - name: eAa
    label: Expected $Aa$
    tolerance: 0.6
  solution: 'There are {N} individuals, so $2 \times {N:dp0} = {tot:dp0}$ gene copies. Copies of $A$: $2({AA}) + {Aa} = {cA}$.


    $p = \dfrac{{cA:dp0}}{{tot:dp0}} =$ **{p:dp3}**, and $q = 1 - p =$ **{q:dp3}**.


    Expected heterozygotes: $2pq \times {N:dp0} = 2({p:dp3})({q:dp3})({N:dp0}) \approx$ **{eAa:int}** (observed: {Aa}).'
- id: bio-geo-time
  title: Earth's history on a 24-hour clock
  topic: Geologic time
  vars:
    ev:
      choices:
      - label: The earliest widely accepted fossils (3,500 million years ago)
        value: 3500
      - label: The Great Oxidation Event (2,400 million years ago)
        value: 2400
      - label: The first eukaryotes (about 2,000 million years ago)
        value: 2000
      - label: The start of the Cambrian explosion (539 million years ago)
        value: 539
      - label: The first land plants (about 470 million years ago)
        value: 470
      - label: The end-Permian extinction (252 million years ago)
        value: 252
      - label: The first dinosaurs (about 230 million years ago)
        value: 230
      - label: The end-Cretaceous extinction (66 million years ago)
        value: 66
  calc:
    el: 4540 - ev
    hr: 24*(4540 - ev)/4540
    left: 24*ev/4540
  prompt: 'Squeeze Earth''s 4,540 million years into a single 24-hour day, with Earth forming at midnight (0 hours) and the present at the next midnight (24 hours).


    Event: {ev}.


    How many hours after midnight does this event fall on the clock? Give hours to 1 decimal place.'
  answers:
  - name: hr
    label: Hours after midnight
    tolerance: 0.06
  solution: 'Elapsed time before the event: $4{,}540 - {ev:dp0} = {el:dp0}$ million years.


    Clock time $= 24 \times \dfrac{{el:dp0}}{4{,}540} \approx$ **{hr:num1} hours** after midnight, which is {left:num2} hours before the end of the day.'
