- id: bio-magnification
  title: Total magnification and actual size
  topic: Microscopy
  vars:
    oc: {choices: [10, 15]}
    obj: {choices: [4, 10, 40, 100]}
    img: {min: 6, max: 60}
  where: ['img*1000/(oc*obj) >= 5', 'img*1000/(oc*obj) <= 400']
  calc:
    mag: oc*obj
    imgum: img*1000
    act: img*1000/(oc*obj)
  prompt: 'A micrograph is taken with a {oc}× ocular lens and a {obj}× objective lens. In the image, a cell measures {img} mm across. (a) What is the total magnification? (b) What is the actual width of the cell in micrometers (3 significant figures)?'
  answers:
    - {name: mag, label: '(a) total magnification', format: integer}
    - {name: act, label: '(b) actual width (µm)', relTolerance: 0.01, format: sig3}
  solution: |-
    (a) Total magnification $=$ ocular $\times$ objective $= {oc} \times {obj} =$ **{mag}×**.

    (b) Convert the image size: ${img}$ mm $\times 1000 = {imgum}\ \mu$m. Then actual size $= \dfrac{\text{image size}}{\text{magnification}} = \dfrac{{imgum}}{{mag}} =$ **{act:sig3} µm**.
- id: bio-field-size
  title: Field of view and cell size
  topic: Microscopy
  vars:
    low: {choices: [4, 4.5, 5]}
    high: {choices: [100, 400]}
    n: {min: 4, max: 30}
  where: ['low*1000*40/high/n >= 10', 'low*1000*40/high/n <= 150']
  calc:
    factor: high / 40
    fmm: low*40/high
    fum: low*1000*40/high
    cell: low*1000*40/high/n
  prompt: 'At 40× total magnification, the field of view is {low} mm across. A student switches to {high}× and counts about {n} cells lined up across the field. (a) What is the field diameter at {high}×, in micrometers? (b) Estimate the length of one cell in micrometers (1 decimal place).'
  answers:
    - {name: fum, label: '(a) field diameter (µm)', relTolerance: 0.005, format: num1}
    - {name: cell, label: '(b) cell length (µm)', relTolerance: 0.01, format: num1}
  solution: |-
    (a) Magnification rose by a factor of ${high} / 40 = {factor}$, so the field shrinks by the same factor: ${low} / {factor} = {fmm}$ mm $=$ **{fum:num1} µm**.

    (b) Cell length $\approx \dfrac{\text{field diameter}}{\text{number of cells}} = \dfrac{{fum:num1}}{{n}} \approx$ **{cell:num1} µm**.
- id: bio-osmosis-direction
  title: Potato core mass change and osmosis
  topic: Transport
  vars:
    conc: {choices: [0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8]}
    m0: {min: 2, max: 5, step: 0.05}
    m1: {min: 1.5, max: 6, step: 0.05}
  where: ['abs(m1 - m0) >= 0.1', 'abs(m1 - m0) <= 0.3*m0', '(conc < 0.38 and m1 > m0) or (conc > 0.38 and m1 < m0)']
  calc:
    dm: m1 - m0
    pc: (m1 - m0)/m0*100
  prompt: 'A potato core weighing {m0:num2} g is soaked in {conc} M sucrose for 24 hours, then blotted and reweighed at {m1:num2} g. Find the percent change in mass (1 decimal place, negative for a loss). Then decide which way water moved and whether the solution was hypotonic or hypertonic to the potato cells.'
  answers:
    - {name: pc, label: 'Percent change', tolerance: 0.06, format: num1}
  solution: |-
    Percent change $= \dfrac{\text{final} - \text{initial}}{\text{initial}} \times 100\% = \dfrac{{m1:num2} - {m0:num2}}{{m0:num2}} \times 100\% =$ **{pc:num1}%**.

    A positive change means the core gained water: water moved *into* the cells, so the solution was hypotonic to them. A negative change means water moved *out*, so the solution was hypertonic. (In the lesson's data, the potato cells were isotonic to about 0.38 M sucrose; real potatoes vary, roughly 0.2 to 0.4 M.)
- id: bio-water-potential
  title: Solute potential of a solution
  topic: Transport
  vars:
    sol: {choices: [{label: 'sucrose (i = 1)', value: 1}, {label: 'sodium chloride (i = 2)', value: 2}]}
    conc: {min: 0.1, max: 1, step: 0.05}
    tc: {min: 15, max: 35}
  calc:
    ion: sol + 0
    tk: tc + 273
    psi: -(sol)*conc*0.0831*(tc + 273)
  prompt: 'Find the solute potential $\Psi_s$, in bars, of a {conc:num2} M solution of {sol} at {tc} °C. Use $\Psi_s = -iCRT$ with $R = 0.0831$ L·bar/(mol·K). Give 2 decimal places.'
  answers:
    - {name: psi, label: '$\Psi_s$ (bar)', relTolerance: 0.01, format: num2}
  solution: |-
    Convert the temperature: $T = {tc} + 273 = {tk}$ K.

    $\Psi_s = -iCRT = -({ion})({conc:num2})(0.0831)({tk}) \approx$ **{psi:num2} bar**.

    The more solute, the more negative the potential; water moves from higher (less negative) to lower water potential.
- id: bio-sa-volume
  title: Surface area to volume ratio of a cube
  topic: Surface area to volume
  vars:
    s: {min: 1, max: 12}
  calc:
    sa: 6*s^2
    vol: s^3
    ratio: 6/s
  prompt: 'Model a cell as a cube with sides of {s} µm. Find its surface area (µm²), its volume (µm³) and its surface-area-to-volume ratio (as a single number, 2 decimal places).'
  answers:
    - {name: sa, label: 'Surface area (µm²)', format: integer}
    - {name: vol, label: 'Volume (µm³)', format: integer}
    - {name: ratio, label: 'SA:V', relTolerance: 0.01, format: num2}
  solution: |-
    Surface area: six faces of ${s} \times {s}$, so $6 \times {s}^2 =$ **{sa} µm²**.

    Volume: ${s}^3 =$ **{vol} µm³**.

    SA:V $= {sa} / {vol} =$ **{ratio:num2}** (check: $6 / {s}$). The bigger the cube, the smaller this ratio.
- id: bio-agar-cube
  title: Agar cube diffusion
  topic: Surface area to volume
  vars:
    s: {choices: [2, 3, 4, 5, 6]}
    d: {choices: [0.5, 1]}
  where: ['s > 2*d']
  calc:
    inner: s - 2*d
    vtot: s^3
    vin: (s - 2*d)^3
    vcol: s^3 - (s - 2*d)^3
    pct: (s^3 - (s - 2*d)^3)/s^3*100
  prompt: 'An agar cube with sides of {s} cm is soaked in a colored solution. After 10 minutes the color has diffused {d} cm in from every face. What percent of the cube''s volume has the color reached? (1 decimal place)'
  answers:
    - {name: pct, label: 'Percent of volume reached', tolerance: 0.06, format: num1}
  solution: |-
    The uncolored center is a cube of side ${s} - 2({d}) = {inner}$ cm (color enters from both sides), with volume ${inner}^3 = {vin}$ cm³.

    Total volume ${s}^3 = {vtot}$ cm³, so the colored volume is ${vtot} - {vin} = {vcol}$ cm³.

    Percent reached $= {vcol} / {vtot} \times 100\% =$ **{pct:num1}%**.
- id: bio-h-axon-transport
  title: Motor protein transport along an axon
  topic: Cytoskeleton
  vars:
    len: {choices: [20, 40, 50, 60, 80, 100]}
    spd: {choices: [0.5, 1, 2, 2.5, 4, 5]}
  calc:
    um: len*10000
    secs: len*10000/spd
    hrs: len*10000/spd/3600
    days: len*10000/spd/86400
  prompt: 'Kinesin carries a vesicle along an axon {len} cm long at a steady {spd} µm/s. How long does the trip take (a) in hours, to 1 decimal place, and (b) in days, to 2 decimal places?'
  answers:
    - {name: hrs, label: '(a) hours', relTolerance: 0.01, format: num1}
    - {name: days, label: '(b) days', relTolerance: 0.01, format: num2}
  solution: |-
    Convert the length to micrometers: {len} cm $= {len} \times 10\,000 = {um}\ \mu$m (1 cm $= 10^4\ \mu$m).

    Time $= \dfrac{\text{distance}}{\text{speed}} = \dfrac{{um}}{{spd}} = {secs:sig3}$ s.

    (a) Divide by 3600 s per hour: **{hrs:num1} h**. (b) Divide by 24 h per day: **{days:num2} days**.
- id: bio-h-receptor-occupancy
  title: Receptor occupancy and the dissociation constant
  topic: Cell signaling
  vars:
    kd: {choices: [1, 2, 4, 5, 10]}
    mult: {choices: [0.5, 1, 2, 3, 4, 9]}
    pct: {choices: [75, 80, 90, 95]}
  calc:
    lig: kd*mult
    lsum: kd*mult + kd
    occ: 100*kd*mult/(kd*mult + kd)
    ratio: pct/(100 - pct)
    need: kd*pct/(100 - pct)
  prompt: 'A hormone binds its receptor with $K_d =$ {kd} nM. (a) What percent of the receptors are occupied when the hormone concentration is {lig} nM? Give 1 decimal place. (b) What hormone concentration, in nM, occupies {pct}% of the receptors?'
  answers:
    - {name: occ, label: '(a) percent occupied', tolerance: 0.06, format: num1}
    - {name: need, label: '(b) concentration (nM)', relTolerance: 0.005, format: num1}
  solution: |-
    Occupancy is $f = \dfrac{[L]}{[L] + K_d}$.

    (a) $f = \dfrac{{lig}}{{lig} + {kd}} = \dfrac{{lig}}{{lsum}}$, which is **{occ:num1}%**.

    (b) Set $\dfrac{L}{L + K_d} = \dfrac{{pct}}{100}$ and solve: $L = K_d \times \dfrac{f}{1 - f} = {kd} \times \dfrac{{pct}}{100 - {pct}} = {kd} \times {ratio:num2}$, so $L =$ **{need:num1} nM**.
- id: bio-h-amplification
  title: Amplification in a signaling cascade
  topic: Cell signaling
  vars:
    gpr: {choices: [5, 10, 20]}
    cpa: {choices: [50, 100, 200]}
    kin: {choices: [5, 10]}
    phos: {choices: [10, 20]}
    glu: {choices: [10, 20, 50]}
  calc:
    camp: gpr*cpa
    pka: gpr*cpa/2
    pk: gpr*cpa/2*kin
    gp: gpr*cpa/2*kin*phos
    total: gpr*cpa/2*kin*phos*glu
  prompt: 'One epinephrine molecule activates a receptor that activates {gpr} G proteins, each switching on one adenylyl cyclase. Each adenylyl cyclase makes {cpa} cAMP. Every 2 cAMP free one active protein kinase A subunit; each of these activates {kin} phosphorylase kinase molecules, each of which activates {phos} glycogen phosphorylase molecules. Each phosphorylase releases {glu} glucose units per second. (a) How many cAMP molecules are made? (b) How many glucose units are released per second?'
  answers:
    - {name: camp, label: '(a) cAMP molecules', format: integer}
    - {name: total, label: '(b) glucose units per second', relTolerance: 0.001, format: integer}
  solution: |-
    (a) cAMP $= {gpr} \times {cpa} =$ **{camp}**.

    (b) Active PKA subunits $= {camp} / 2 = {pka}$. Phosphorylase kinase $= {pka} \times {kin} = {pk}$. Glycogen phosphorylase $= {pk} \times {phos} = {gp}$. Glucose units per second $= {gp} \times {glu} =$ **{total}**.
