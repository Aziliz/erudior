# Module 5 (Inheritance) drills
- id: bio-monohybrid
  title: Monohybrid cross probabilities
  topic: Mendelian genetics
  vars:
    p1: {choices: [{label: PP, value: 2}, {label: Pp, value: 1}, {label: pp, value: 0}]}
    p2: {choices: [{label: PP, value: 2}, {label: Pp, value: 1}, {label: pp, value: 0}]}
    n: {min: 40, max: 400, step: 4}
  where: ['p1 == 1 or p2 == 1']
  calc:
    d1: p1/2
    d2: p2/2
    q1: 1 - p1/2
    q2: 1 - p2/2
    white: (1 - p1/2)*(1 - p2/2)
    het: (p1/2)*(1 - p2/2) + (p2/2)*(1 - p1/2)
    nw: n*white
  prompt: 'In pea plants, purple flowers (P) are dominant to white flowers (p). A {p1} plant is crossed with a {p2} plant. Give exact fractions (type 0 if impossible) for the probability that one offspring is (a) white and (b) heterozygous. (c) How many white plants do you expect among {n} offspring?'
  answers:
    - {name: white, kind: fraction, lowestTerms: true, label: '(a) P(white)'}
    - {name: het, kind: fraction, lowestTerms: true, label: '(b) P(Pp)'}
    - {name: nw, format: integer, label: '(c) Expected white plants'}
  solution: |-
    Gametes: the {p1} parent gives P with probability {d1:frac} and p with probability {q1:frac}; the {p2} parent gives P with probability {d2:frac} and p with probability {q2:frac}.

    (a) A white plant (pp) needs p from both parents (product rule): ${q1:texfrac} \times {q2:texfrac} =$ **{white:frac}**.

    (b) Pp can form two ways: P from the first parent and p from the second, or the reverse (sum rule): ${d1:texfrac} \times {q2:texfrac} + {q1:texfrac} \times {d2:texfrac} =$ **{het:frac}**.

    (c) Expected white plants: {white:frac} × {n} = **{nw}**.
- id: bio-testcross
  title: Interpret a test cross
  topic: Mendelian genetics
  vars:
    gt: {choices: [1, 2]}
    n: {min: 10, max: 40, step: 2}
    w: {min: -3, max: 3}
  where: ['gt == 2 or n/2 + w >= 1']
  calc:
    nw: if(gt == 1, n/2 + w, 0)
    nb: n - if(gt == 1, n/2 + w, 0)
    ew: n/2
  prompt: 'In guinea pigs, black fur (B) is dominant to white fur (b). A black guinea pig of unknown genotype is test-crossed with a white guinea pig. Their offspring: {nb} black and {nw} white. (a) If the black parent were Bb, how many of the {n} offspring would you expect to be white? (b) How many copies of the B allele does the black parent most likely carry (2 for BB, 1 for Bb)?'
  answers:
    - {name: ew, format: integer, label: '(a) Expected white if Bb'}
    - {name: gt, format: integer, label: '(b) Copies of B'}
  solution: |-
    (a) The white parent is bb and gives only b. A Bb parent gives B or b, each $\tfrac12$, so Bb × bb gives $\tfrac12$ Bb (black) and $\tfrac12$ bb (white): expect $\tfrac12 \times {n} =$ **{ew}** white.

    (b) Every white offspring is bb, so it received b from the black parent as well. Even one white offspring proves the black parent is Bb (1 copy of B). If all {n} offspring are black, the parent is almost certainly BB (2 copies): a Bb parent would give {n} black offspring in a row with probability only $\left(\tfrac12\right)^{{n}}$.

    Here {nw} of the {n} offspring are white, so the answer is **{gt}**.
- id: bio-dihybrid
  title: Two-gene cross, gene by gene
  topic: Dihybrid crosses
  vars:
    r1: {choices: [{label: RR, value: 2}, {label: Rr, value: 1}, {label: rr, value: 0}]}
    y1: {choices: [{label: YY, value: 2}, {label: Yy, value: 1}, {label: yy, value: 0}]}
    r2: {choices: [{label: RR, value: 2}, {label: Rr, value: 1}, {label: rr, value: 0}]}
    y2: {choices: [{label: YY, value: 2}, {label: Yy, value: 1}, {label: yy, value: 0}]}
  where: ['r1 == 1 or r2 == 1', 'y1 == 1 or y2 == 1']
  calc:
    qr1: 1 - r1/2
    qr2: 1 - r2/2
    qy1: 1 - y1/2
    qy2: 1 - y2/2
    wr: (1 - r1/2)*(1 - r2/2)
    gr: (1 - y1/2)*(1 - y2/2)
    pr: 1 - wr
    py: 1 - gr
    both: pr*py
    rec: wr*gr
  prompt: 'In peas, round seeds (R) are dominant to wrinkled seeds (r), and yellow seeds (Y) are dominant to green seeds (y). The two genes assort independently. For the cross {r1}{y1} × {r2}{y2}, give the probability (exact fraction, 0 if impossible) that an offspring has (a) round, yellow seeds and (b) wrinkled, green seeds.'
  answers:
    - {name: both, kind: fraction, lowestTerms: true, label: '(a) P(round, yellow)'}
    - {name: rec, kind: fraction, lowestTerms: true, label: '(b) P(wrinkled, green)'}
  solution: |-
    Treat each gene as its own one-gene cross.

    Seed shape, {r1} × {r2}: wrinkled (rr) needs r from both parents, ${qr1:texfrac} \times {qr2:texfrac} = {wr:texfrac}$, so P(round) $= 1 - {wr:texfrac} = {pr:texfrac}$.

    Seed color, {y1} × {y2}: green (yy) has probability ${qy1:texfrac} \times {qy2:texfrac} = {gr:texfrac}$, so P(yellow) $= {py:texfrac}$.

    (a) Product rule: ${pr:texfrac} \times {py:texfrac} =$ **{both:frac}**.

    (b) ${wr:texfrac} \times {gr:texfrac} =$ **{rec:frac}**.
- id: bio-dihybrid-count
  title: Expected counts from a 9:3:3:1 cross
  topic: Dihybrid crosses
  vars:
    k: {min: 5, max: 40}
    cls: {choices: [{label: 'round, yellow', value: 9}, {label: 'round, green', value: 3}, {label: 'wrinkled, yellow', value: 3}, {label: 'wrinkled, green', value: 1}]}
  calc:
    total: 16*k
    cnt: 16*k*cls/16
  prompt: 'Two pea plants heterozygous for seed shape and seed color (RrYy × RrYy, unlinked genes, round and yellow dominant) produce {total} offspring. How many are expected to have {cls} seeds?'
  answers:
    - {name: cnt, format: integer, label: 'Expected number'}
  solution: |-
    RrYy × RrYy gives 9 round-yellow : 3 round-green : 3 wrinkled-yellow : 1 wrinkled-green, out of 16. (Each class is $\tfrac34$ or $\tfrac14$ for shape times $\tfrac34$ or $\tfrac14$ for color: $\tfrac34 \times \tfrac34 = \tfrac{9}{16}$, $\tfrac34 \times \tfrac14 = \tfrac{3}{16}$, $\tfrac14 \times \tfrac14 = \tfrac{1}{16}$.)

    The fraction with {cls} seeds is $\dfrac{{cls:int}}{16}$, so expect $\dfrac{{cls:int}}{16} \times {total} =$ **{cnt}**.
- id: bio-product-rule
  title: Product rule with three genes
  topic: Probability in genetics
  vars:
    a1: {choices: [{label: AA, value: 2}, {label: Aa, value: 1}, {label: aa, value: 0}]}
    b1: {choices: [{label: BB, value: 2}, {label: Bb, value: 1}, {label: bb, value: 0}]}
    c1: {choices: [{label: CC, value: 2}, {label: Cc, value: 1}, {label: cc, value: 0}]}
    a2: {choices: [{label: AA, value: 2}, {label: Aa, value: 1}, {label: aa, value: 0}]}
    b2: {choices: [{label: BB, value: 2}, {label: Bb, value: 1}, {label: bb, value: 0}]}
    c2: {choices: [{label: CC, value: 2}, {label: Cc, value: 1}, {label: cc, value: 0}]}
    ta: {choices: [{label: AA, value: 2}, {label: Aa, value: 1}, {label: aa, value: 0}]}
    tb: {choices: [{label: BB, value: 2}, {label: Bb, value: 1}, {label: bb, value: 0}]}
    tc: {choices: [{label: CC, value: 2}, {label: Cc, value: 1}, {label: cc, value: 0}]}
  calc:
    pa: if(ta == 2, (a1/2)*(a2/2), if(ta == 1, (a1/2)*(1 - a2/2) + (a2/2)*(1 - a1/2), (1 - a1/2)*(1 - a2/2)))
    pb: if(tb == 2, (b1/2)*(b2/2), if(tb == 1, (b1/2)*(1 - b2/2) + (b2/2)*(1 - b1/2), (1 - b1/2)*(1 - b2/2)))
    pc: if(tc == 2, (c1/2)*(c2/2), if(tc == 1, (c1/2)*(1 - c2/2) + (c2/2)*(1 - c1/2), (1 - c1/2)*(1 - c2/2)))
    p: pa*pb*pc
  where: ['p > 0', 'p < 1/8', '(a1 == 1) + (a2 == 1) + (b1 == 1) + (b2 == 1) + (c1 == 1) + (c2 == 1) >= 4']
  prompt: 'Three genes assort independently. In the cross {a1}{b1}{c1} × {a2}{b2}{c2}, what is the probability that an offspring has the genotype {ta}{tb}{tc}? Give an exact fraction.'
  answers:
    - {name: p, kind: fraction, lowestTerms: true, label: 'P({ta}{tb}{tc})'}
  solution: |-
    Split the cross into three one-gene crosses and find each probability (a 2 × 2 Punnett square for each, or the gamete probabilities: AA gives A with probability 1, Aa gives A with probability $\tfrac12$, aa never gives A).

    - Gene A, {a1} × {a2}: P({ta}) = {pa:frac}
    - Gene B, {b1} × {b2}: P({tb}) = {pb:frac}
    - Gene C, {c1} × {c2}: P({tc}) = {pc:frac}

    The genes are independent, so multiply (product rule): ${pa:texfrac} \times {pb:texfrac} \times {pc:texfrac} =$ **{p:frac}**.
- id: bio-children
  title: Exactly k affected children
  topic: Probability in genetics
  vars:
    cr: {choices: [{label: 'both parents are carriers (Aa × Aa)', value: 0.25}, {label: 'one parent is a carrier and the other has the condition (Aa × aa)', value: 0.5}]}
    n: {min: 2, max: 5}
    k: {min: 0, max: 5}
  where: ['k <= n']
  calc:
    q: 1 - cr
    nk: n - k
    ways: nCr(n, k)
    pr: nCr(n, k)*cr^k*(1 - cr)^(n - k)
  prompt: 'A condition is autosomal recessive, and {cr}. They have {n} children. What is the probability that the number of their children with the condition is exactly {k}? Give an exact fraction.'
  answers:
    - {name: pr, kind: fraction, lowestTerms: true, label: 'Probability'}
  solution: |-
    Each child, independently, has the condition (aa) with probability {cr:frac} and not with probability {q:frac}.

    One particular birth order with exactly {k} affected has probability $\left({cr:texfrac}\right)^{{k}}\left({q:texfrac}\right)^{{nk}}$ (product rule). The number of different orders is $\binom{{n}}{{k}} = {ways}$, and the orders are mutually exclusive, so add them (sum rule):

    $${ways} \times \left({cr:texfrac}\right)^{{k}}\left({q:texfrac}\right)^{{nk}} = {pr:texfrac}$$

    The probability is **{pr:frac}**.
- id: bio-blood-type
  title: ABO blood type probabilities
  topic: Multiple alleles
  vars:
    g1: {choices: [{label: '$I^AI^A$', value: 1}, {label: '$I^Ai$', value: 2}, {label: '$I^BI^B$', value: 3}, {label: '$I^Bi$', value: 4}, {label: '$I^AI^B$', value: 5}, {label: '$ii$', value: 6}]}
    g2: {choices: [{label: '$I^AI^A$', value: 1}, {label: '$I^Ai$', value: 2}, {label: '$I^BI^B$', value: 3}, {label: '$I^Bi$', value: 4}, {label: '$I^AI^B$', value: 5}, {label: '$ii$', value: 6}]}
  calc:
    a1: if(g1 == 1, 1, if(g1 == 2 or g1 == 5, 0.5, 0))
    b1: if(g1 == 3, 1, if(g1 == 4 or g1 == 5, 0.5, 0))
    o1: if(g1 == 6, 1, if(g1 == 2 or g1 == 4, 0.5, 0))
    a2: if(g2 == 1, 1, if(g2 == 2 or g2 == 5, 0.5, 0))
    b2: if(g2 == 3, 1, if(g2 == 4 or g2 == 5, 0.5, 0))
    o2: if(g2 == 6, 1, if(g2 == 2 or g2 == 4, 0.5, 0))
    tA: a1*a2 + a1*o2 + o1*a2
    tB: b1*b2 + b1*o2 + o1*b2
    tAB: a1*b2 + b1*a2
    tO: o1*o2
  where: ['max(tA, tB, tAB, tO) < 1']
  prompt: 'A parent with genotype {g1} and a parent with genotype {g2} have a child. Give the probability that the child has each ABO blood type, as exact fractions (0 if impossible).'
  answers:
    - {name: tA, kind: fraction, lowestTerms: true, label: 'Type A'}
    - {name: tB, kind: fraction, lowestTerms: true, label: 'Type B'}
    - {name: tAB, kind: fraction, lowestTerms: true, label: 'Type AB'}
    - {name: tO, kind: fraction, lowestTerms: true, label: 'Type O'}
  solution: |-
    Gametes. Parent 1 ({g1}): $I^A$ {a1:frac}, $I^B$ {b1:frac}, $i$ {o1:frac}. Parent 2 ({g2}): $I^A$ {a2:frac}, $I^B$ {b2:frac}, $i$ {o2:frac}.

    $I^A$ and $I^B$ are codominant; both are dominant to $i$.

    - Type A ($I^AI^A$ or $I^Ai$): $P(I^A,I^A) + P(I^A,i) + P(i,I^A) =$ **{tA:frac}**
    - Type B ($I^BI^B$ or $I^Bi$): $P(I^B,I^B) + P(I^B,i) + P(i,I^B) =$ **{tB:frac}**
    - Type AB: $P(I^A,I^B) + P(I^B,I^A) =$ **{tAB:frac}**
    - Type O ($ii$): $P(i,i) =$ **{tO:frac}**

    Check: the four probabilities add to 1.
- id: bio-incomplete
  title: Incomplete dominance cross
  topic: Incomplete dominance
  vars:
    org: {choices: [{label: snapdragons, value: 1}, {label: 'four o''clock plants', value: 2}]}
    f1: {choices: [{label: red, value: 2}, {label: pink, value: 1}, {label: white, value: 0}]}
    f2: {choices: [{label: red, value: 2}, {label: pink, value: 1}, {label: white, value: 0}]}
    n: {min: 40, max: 400, step: 4}
  where: ['f1 == 1 or f2 == 1']
  calc:
    r1: f1/2
    r2: f2/2
    w1: 1 - f1/2
    w2: 1 - f2/2
    pink: (f1/2)*(1 - f2/2) + (f2/2)*(1 - f1/2)
    red: (f1/2)*(f2/2)
    nred: n*(f1/2)*(f2/2)
  prompt: 'In {org}, flower color shows incomplete dominance: $C^RC^R$ plants are red, $C^RC^W$ plants are pink and $C^WC^W$ plants are white. A {f1} plant is crossed with a {f2} plant. (a) What fraction of the offspring are pink (exact fraction)? (b) Among {n} offspring, how many red plants do you expect?'
  answers:
    - {name: pink, kind: fraction, lowestTerms: true, label: '(a) P(pink)'}
    - {name: nred, format: integer, label: '(b) Expected red plants'}
  solution: |-
    With incomplete dominance each color is one genotype, so the {f1} parent and the {f2} parent have known genotypes. The {f1} parent gives $C^R$ with probability {r1:frac} and $C^W$ with probability {w1:frac}; the {f2} parent gives $C^R$ with probability {r2:frac} and $C^W$ with probability {w2:frac}.

    (a) Pink is $C^RC^W$, formed two ways: ${r1:texfrac} \times {w2:texfrac} + {w1:texfrac} \times {r2:texfrac} =$ **{pink:frac}**.

    (b) Red is $C^RC^R$: ${r1:texfrac} \times {r2:texfrac} = {red:texfrac}$, and ${red:texfrac} \times {n} =$ **{nred}**.
- id: bio-x-linked
  title: X-linked recessive cross
  topic: Sex linkage
  vars:
    mo: {choices: [{label: '$X^BX^B$', value: 0}, {label: '$X^BX^b$', value: 0.5}, {label: '$X^bX^b$', value: 1}]}
    fa: {choices: [{label: '$X^BY$', value: 0}, {label: '$X^bY$', value: 1}]}
  where: ['mo > 0']
  calc:
    mB: 1 - mo
    son: mo
    dau: mo*fa
    car: mo*(1 - fa) + (1 - mo)*fa
    affson: mo/2
  prompt: 'Red-green color blindness is X-linked recessive ($X^B$ = normal vision, $X^b$ = color-blind). A woman with genotype {mo} and a man with genotype {fa} have children. Give exact fractions (0 if impossible) for: (a) the probability that a son is color-blind; (b) the probability that a daughter is color-blind; (c) the probability that a daughter is a carrier; (d) the probability that a child whose sex isn''t known is a color-blind son.'
  answers:
    - {name: son, kind: fraction, lowestTerms: true, label: '(a) P(color-blind, given a son)'}
    - {name: dau, kind: fraction, lowestTerms: true, label: '(b) P(color-blind, given a daughter)'}
    - {name: car, kind: fraction, lowestTerms: true, label: '(c) P(carrier, given a daughter)'}
    - {name: affson, kind: fraction, lowestTerms: true, label: '(d) P(color-blind son)'}
  solution: |-
    The mother ({mo}) gives $X^b$ with probability {mo:frac} and $X^B$ with probability {mB:frac}. The father ({fa}) gives his X to every daughter and his Y to every son.

    (a) A son's only X comes from his mother: P(color-blind) = **{son:frac}**.

    (b) A daughter is color-blind only if both her X chromosomes carry $b$: {mo:frac} × (father's X is $X^b$: {fa:frac}) = **{dau:frac}**.

    (c) A carrier daughter is $X^BX^b$: $b$ from the mother and $B$ from the father, or the reverse: **{car:frac}**.

    (d) P(son) × P(color-blind, given a son) $= \tfrac12 \times {son:texfrac} =$ **{affson:frac}**.
- id: bio-chi-square
  title: Chi-square test for 3:1 or 1:1
  topic: Chi-square test
  vars:
    rt: {choices: [{label: 'monohybrid F2 cross (hypothesis: 3 : 1)', value: 3}, {label: 'test cross (hypothesis: 1 : 1)', value: 1}]}
    n: {min: 80, max: 400, step: 4}
    d: {min: -25, max: 25}
  calc:
    e1: n*rt/(rt + 1)
    e2: n/(rt + 1)
    o1: n*rt/(rt + 1) + d
    o2: n/(rt + 1) - d
    c1: d^2/(n*rt/(rt + 1))
    c2: d^2/(n/(rt + 1))
    chi: d^2/(n*rt/(rt + 1)) + d^2/(n/(rt + 1))
    df: '1'
    crit: '3.84'
    rej: if(chi >= 3.84, 1, 0)
  where: ['d != 0', 'n/(rt + 1) - d >= 10', 'abs(chi - 3.84) > 0.15']
  prompt: 'In a {rt}, there are {o1} offspring with the dominant phenotype and {o2} with the recessive phenotype. Find $\chi^2$ (2 decimal places), the degrees of freedom, and the critical value at $p = 0.05$. Then decide: type 1 if you reject the hypothesis, 0 if you fail to reject it. Critical values at $p = 0.05$: df 1: 3.84, df 2: 5.99, df 3: 7.81, df 4: 9.49.'
  answers:
    - {name: chi, format: num2, tolerance: 0.02, label: '$\chi^2 =$'}
    - {name: df, format: integer, label: 'Degrees of freedom'}
    - {name: crit, tolerance: 0.005, label: 'Critical value'}
    - {name: rej, format: integer, label: 'Reject? (1 = yes, 0 = no)'}
  solution: |-
    Total {n}. Expected: dominant $= {n} \times \tfrac{{rt:int}}{{rt:int} + 1} = {e1}$, recessive $= {n} - {e1} = {e2}$.

    $$\chi^2 = \frac{({o1} - {e1})^2}{{e1}} + \frac{({o2} - {e2})^2}{{e2}} = {c1:num4} + {c2:num4} = {chi:num2}$$

    So $\chi^2 \approx$ **{chi:num2}**.

    There are 2 categories, so df $= 2 - 1 =$ **1**, and the critical value is **3.84**.

    The hypothesis is rejected only if $\chi^2 \ge 3.84$. Here $\chi^2 = {chi:num2}$, so the answer is **{rej}** (1 = reject: the deviation is too large to be chance; 0 = fail to reject: the data are consistent with the ratio).
- id: bio-chi-square-121
  title: Chi-square test for 1:2:1
  topic: Chi-square test
  vars:
    k: {min: 20, max: 100}
    d1: {min: -15, max: 15}
    d2: {min: -15, max: 15}
  calc:
    total: 4*k
    e2: 2*k
    o1: k + d1
    o2: 2*k + d2
    o3: k - d1 - d2
    d3: -d1 - d2
    c1: d1^2/k
    c2: d2^2/(2*k)
    c3: (d1 + d2)^2/k
    chi: d1^2/k + d2^2/(2*k) + (d1 + d2)^2/k
    df: '2'
    crit: '5.99'
    rej: if(chi >= 5.99, 1, 0)
  where: ['k - d1 - d2 >= 5', 'k + d1 >= 5', 'd1 != 0 or d2 != 0', 'abs(chi - 5.99) > 0.2']
  prompt: 'Snapdragon flower color shows incomplete dominance, so a pink × pink cross should give 1 red : 2 pink : 1 white. A student counts {o1} red, {o2} pink and {o3} white offspring. Find $\chi^2$ (2 decimal places), the degrees of freedom and the critical value at $p = 0.05$, then decide: type 1 if you reject the 1 : 2 : 1 hypothesis, 0 if you fail to reject it. Critical values at $p = 0.05$: df 1: 3.84, df 2: 5.99, df 3: 7.81, df 4: 9.49.'
  answers:
    - {name: chi, format: num2, tolerance: 0.02, label: '$\chi^2 =$'}
    - {name: df, format: integer, label: 'Degrees of freedom'}
    - {name: crit, tolerance: 0.005, label: 'Critical value'}
    - {name: rej, format: integer, label: 'Reject? (1 = yes, 0 = no)'}
  solution: |-
    Total {total}. Expected: red $\tfrac14 \times {total} = {k}$, pink $\tfrac12 \times {total} = {e2}$, white {k}.

    $$\chi^2 = \frac{({d1})^2}{{k}} + \frac{({d2})^2}{{e2}} + \frac{({d3})^2}{{k}} = {c1:num4} + {c2:num4} + {c3:num4} = {chi:num2}$$

    So $\chi^2 \approx$ **{chi:num2}**.

    Three categories, so df $= 3 - 1 =$ **2**; the critical value is **5.99**.

    Reject only if $\chi^2 \ge 5.99$. Here $\chi^2 = {chi:num2}$, so the answer is **{rej}** (1 = reject, 0 = fail to reject).
- id: bio-chi-square-multi
  title: Chi-square test for 9:3:3:1
  topic: Chi-square test
  vars:
    k: {min: 15, max: 40}
    d1: {min: -12, max: 12}
    d2: {min: -8, max: 8}
    d3: {min: -8, max: 8}
  calc:
    total: 16*k
    e1: 9*k
    e2: 3*k
    o1: 9*k + d1
    o2: 3*k + d2
    o3: 3*k + d3
    o4: k - d1 - d2 - d3
    d4: -d1 - d2 - d3
    c1: d1^2/(9*k)
    c2: d2^2/(3*k)
    c3: d3^2/(3*k)
    c4: (d1 + d2 + d3)^2/k
    chi: d1^2/(9*k) + d2^2/(3*k) + d3^2/(3*k) + (d1 + d2 + d3)^2/k
    df: '3'
    crit: '7.81'
    rej: if(chi >= 7.81, 1, 0)
  where: ['k - d1 - d2 - d3 >= 5', 'abs(chi - 7.81) > 0.2']
  prompt: 'A dihybrid cross (AaBb × AaBb) should give a 9 : 3 : 3 : 1 phenotype ratio if the genes assort independently. The offspring: {o1} dominant for both traits, {o2} dominant for A only, {o3} dominant for B only, and {o4} recessive for both. Find $\chi^2$ (2 decimal places), the degrees of freedom and the critical value at $p = 0.05$, then decide: type 1 if you reject the 9 : 3 : 3 : 1 hypothesis, 0 if you fail to reject it. Critical values at $p = 0.05$: df 1: 3.84, df 2: 5.99, df 3: 7.81, df 4: 9.49.'
  answers:
    - {name: chi, format: num2, tolerance: 0.03, label: '$\chi^2 =$'}
    - {name: df, format: integer, label: 'Degrees of freedom'}
    - {name: crit, tolerance: 0.005, label: 'Critical value'}
    - {name: rej, format: integer, label: 'Reject? (1 = yes, 0 = no)'}
  solution: |-
    Total {total}. Expected: $\tfrac{9}{16} \times {total} = {e1}$, $\tfrac{3}{16} \times {total} = {e2}$ (twice), $\tfrac{1}{16} \times {total} = {k}$.

    $$\chi^2 = \frac{({d1})^2}{{e1}} + \frac{({d2})^2}{{e2}} + \frac{({d3})^2}{{e2}} + \frac{({d4})^2}{{k}}$$

    $$= {c1:num4} + {c2:num4} + {c3:num4} + {c4:num4} = {chi:num2}$$

    So $\chi^2 \approx$ **{chi:num2}**.

    Four categories, so df $= 4 - 1 =$ **3**; the critical value is **7.81**.

    Reject only if $\chi^2 \ge 7.81$. Here $\chi^2 = {chi:num2}$, so the answer is **{rej}** (1 = reject: perhaps the genes are linked or some offspring survive less well; 0 = fail to reject: consistent with independent assortment).
