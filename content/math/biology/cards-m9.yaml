# ---- m9 The human body
- {front: 'Three parts of a homeostatic control loop', back: 'Sensor (receptor), control center (often the brain), effector (muscle or gland).', topic: Homeostasis}
- {front: 'Negative vs positive feedback', back: 'Negative: response opposes the change (temperature, glucose). Positive: response amplifies the change until an event ends it (childbirth, clotting).', topic: Homeostasis}
- {front: 'Responses to overheating', back: 'Sweating and vasodilation of skin vessels, triggered by the hypothalamus.', topic: Homeostasis}
- {front: 'Responses to cold', back: 'Vasoconstriction of skin vessels and shivering.', topic: Homeostasis}
- {front: 'Parts of a neuron', back: 'Dendrites (receive), cell body (nucleus), axon (carries impulse away, often myelinated), axon terminals (release neurotransmitter).', topic: Nervous system}
- {front: 'Steps of an action potential', back: 'Rest at about −70 mV; threshold reached; sodium channels open, Na⁺ in (inside becomes positive); potassium channels open, K⁺ out (restores negative).', topic: Nervous system}
- {front: 'All-or-none principle', back: 'Every action potential has the same size; stimulus strength is coded by firing frequency.', topic: Nervous system}
- {front: 'Measuring conduction speed (Helmholtz)', back: 'Stimulate at two distances; speed = difference in distance ÷ difference in time (mm/ms = m/s).', topic: Nervous system}
- {front: 'What happens at a synapse', back: 'Impulse arrives; neurotransmitter released; diffuses across gap; binds receptors on next cell; then broken down or taken back up.', topic: Nervous system}
- {front: 'Nervous vs endocrine signaling', back: 'Nervous: electrical plus neurotransmitter, milliseconds, brief, targeted. Endocrine: hormones in blood, seconds to hours, longer lasting, any cell with the receptor.', topic: Endocrine system}
- {front: 'Insulin vs glucagon', back: 'Insulin (beta cells): lowers blood glucose; cells take up glucose, liver stores glycogen. Glucagon (alpha cells): raises it; liver breaks down glycogen.', topic: Endocrine system}
- {front: 'Type 1 vs type 2 diabetes', back: 'Type 1: autoimmune destruction of beta cells, little insulin. Type 2: cells respond poorly to insulin (insulin resistance).', topic: Endocrine system}
- {front: 'Path of blood through the heart', back: 'Right atrium → right ventricle → pulmonary artery → lungs → pulmonary vein → left atrium → left ventricle → aorta → body → veins → right atrium.', topic: Circulatory system}
- {front: 'Artery vs vein vs capillary', back: 'Artery: away from heart, thick elastic wall. Vein: toward heart, thin wall, valves. Capillary: one cell thick, exchange.', topic: Circulatory system}
- {front: 'Cardiac output', back: 'Heart rate × stroke volume; about 70 × 70 mL ≈ 5 L/min at rest.', topic: Circulatory system}
- {front: 'Stroke volume from ventricle volumes', back: 'Volume at end of filling − volume left after contraction.', topic: Circulatory system}
- {front: 'Harvey''s 1628 argument', back: 'The heart pumps thousands of liters a day, far more than is eaten or contained in the body, so blood must circulate.', topic: Circulatory system}
- {front: 'Path of air into the lungs', back: 'Nose/mouth → pharynx → larynx → trachea → bronchi → bronchioles → alveoli.', topic: Respiratory system}
- {front: 'Mechanism of inhaling', back: 'Diaphragm contracts and flattens, ribs lift, chest volume up, lung pressure down, air flows in.', topic: Respiratory system}
- {front: 'Main chemical trigger for breathing', back: 'Rising carbon dioxide, which lowers blood pH, detected in the medulla.', topic: Respiratory system}
- {front: 'Minute and alveolar ventilation', back: 'Minute = tidal volume × rate. Alveolar = (tidal volume − dead space) × rate.', topic: Respiratory system}
- {front: 'Energy from oxygen use', back: 'About 20 kJ per liter of oxygen; resting use about 3.5 mL O₂ per kg per minute.', topic: Respiratory system}
- {front: 'Three steps of urine formation', back: 'Filtration (glomerulus), reabsorption (tubule back to blood), secretion (blood into tubule).', topic: Excretory system}
- {front: 'Role of ADH', back: 'Released when blood is too concentrated; makes collecting ducts reabsorb more water, giving concentrated urine (negative feedback).', topic: Excretory system}
- {front: 'Digestion products', back: 'Carbohydrates → simple sugars; proteins → amino acids; fats → fatty acids and glycerol; nucleic acids → nucleotides.', topic: Digestive system}
- {front: 'Roles of stomach, small intestine, large intestine', back: 'Stomach: acid, pepsin, churning. Small intestine: most digestion and nearly all absorption (villi). Large intestine: water absorption, gut bacteria.', topic: Digestive system}
- {front: 'Energy per gram of nutrient', back: 'Carbohydrate 4 kcal, protein 4 kcal, fat 9 kcal (1 kcal = 4.184 kJ).', topic: Digestive system}
- {front: 'Innate vs adaptive immunity', back: 'Innate: fast, general, from birth (barriers, inflammation, phagocytes). Adaptive: slower first time, specific, memory (B cells, antibodies, T cells).', topic: Immune system}
- {front: 'Primary vs secondary immune response', back: 'Primary: about 1–2 weeks to peak, smaller. Secondary: within days, much larger, because of memory cells.', topic: Immune system}
- {front: 'Herd immunity threshold', back: '$1 - \dfrac{1}{R_0}$; e.g. $R_0 = 15$ gives about 93%.', topic: Immune system}
- {front: 'Na⁺/K⁺ pump stoichiometry', back: '3 Na⁺ out and 2 K⁺ in per ATP. It maintains the gradients; the K⁺ leak makes most of the resting voltage.', topic: Action potential}
- {front: 'Nernst equation (37 °C)', back: '$E = \dfrac{61.5}{z}\log_{10}\dfrac{[\text{out}]}{[\text{in}]}$ mV. Typical $E_{\text{K}} \approx -90$ mV, $E_{\text{Na}} \approx +60$ mV.', topic: Action potential}
- {front: 'Rule for the membrane potential', back: 'It moves toward the equilibrium potential of whichever ion the membrane is most permeable to at that moment.', topic: Action potential}
- {front: 'Phases of the action potential', back: 'Rest (−70 mV); depolarization to threshold (−55); rising phase (Na⁺ in, positive feedback); falling phase (Na⁺ channels inactivate, K⁺ out); undershoot toward $E_{\text{K}}$; rest.', topic: Action potential}
- {front: 'Absolute vs relative refractory period', back: 'Absolute: no second spike possible (Na⁺ channels inactivated). Relative: a spike needs a stronger stimulus (undershoot). Makes conduction one-way and caps firing rate.', topic: Action potential}
- {front: 'Saltatory conduction', back: 'Myelin insulates the axon; the action potential is regenerated only at nodes of Ranvier, giving speeds up to about 120 m/s.', topic: Action potential}
- {front: 'Steps of chemical synaptic transmission', back: 'AP reaches terminal; Ca²⁺ channels open, Ca²⁺ in; vesicles release transmitter; it binds receptors; postsynaptic channels open; transmitter removed by enzyme or reuptake.', topic: Synapses}
- {front: 'EPSP vs IPSP', back: 'EPSP: small depolarization (e.g. Na⁺ in, glutamate). IPSP: small hyperpolarization (e.g. Cl⁻ in, GABA). A neuron fires when summed inputs reach threshold.', topic: Synapses}
- {front: 'Drug targets at synapses', back: 'TTX and lidocaine: Na⁺ channels. Botulinum: ACh release. Curare: ACh receptors. Organophosphates: acetylcholinesterase. SSRIs: serotonin reuptake. Benzodiazepines: GABA receptors.', topic: Synapses}
- {front: 'Clonal selection theory (Burnet)', back: 'Each lymphocyte has one random, pre-made specificity; antigen selects matching cells, which multiply into effector and memory clones; self-reactive cells are removed.', topic: Adaptive immunity}
- {front: 'Antibody diversity from segments', back: 'Heavy chains = V × D × J; light chains = V × J (kappa plus lambda); pairs = heavy × light; imprecise joining adds much more.', topic: Adaptive immunity}
- {front: 'Antibody structure', back: 'Two heavy and two light chains joined by disulfide bonds; variable regions at the arm tips form two identical antigen-binding sites; the heavy-chain constant region sets the class.', topic: Adaptive immunity}
- {front: 'Antibody classes', back: 'IgM: first made, pentamer. IgG: most abundant, crosses placenta. IgA: secretions and milk. IgE: mast cells, allergy, worms. IgD: on naive B cells.', topic: Adaptive immunity}
- {front: 'MHC class I vs class II', back: 'Class I: nearly all nucleated cells, inside proteins, to CD8 cytotoxic T cells. Class II: antigen-presenting cells, engulfed material, to CD4 helper T cells.', topic: Adaptive immunity}
- {front: 'IgM vs IgG in a blood test', back: 'IgM only: recent first infection. IgM and IgG: within weeks. IgG only: past infection or vaccination.', topic: Adaptive immunity}
- {front: 'Effective reproduction number and coverage', back: '$R_{\text{eff}} = R_0 \times$ susceptible fraction; outbreak grows if above 1. Coverage needed $= (1 - 1/R_0)/E$ for a vaccine of effectiveness $E$.', topic: Vaccines}
- {front: 'Active vs passive immunity', back: 'Active (infection, vaccine): own B and T cells respond, memory forms, long lasting. Passive (maternal IgG, milk IgA, antibody treatment): immediate but fades, no memory.', topic: Vaccines}
- {front: 'Peptide vs steroid hormones', back: 'Peptide: water-soluble, surface receptor, second messenger (cAMP), fast. Steroid: lipid-soluble, internal receptor, changes gene expression, slow and lasting.', topic: Hormone signaling}
- {front: 'Posterior vs anterior pituitary', back: 'Posterior: releases ADH and oxytocin made by hypothalamic neurons. Anterior: gland controlled by hypothalamic releasing hormones via portal vessels; makes tropic hormones.', topic: Hormone signaling}
- {front: 'Hypothalamus-pituitary-thyroid axis', back: 'TRH → TSH → thyroid → T4/T3; T4/T3 inhibit the pituitary and hypothalamus (negative feedback).', topic: Hormone signaling}
- {front: 'Reading TSH and T4', back: 'High TSH, low T4: thyroid underactive. Low TSH, high T4: thyroid overactive. Low TSH, low T4: pituitary or hypothalamus problem.', topic: Hormone signaling}
- {front: 'How a beta cell releases insulin', back: 'Glucose in → ATP rises → K_ATP channels close → depolarization → Ca²⁺ channels open → Ca²⁺ triggers insulin exocytosis.', topic: Glucose regulation}
- {front: 'Glucose tolerance test cutoffs (ADA)', back: 'Fasting: under 100 normal, 100–125 prediabetes, 126+ diabetes. 2 hours: under 140 normal, 140–199 prediabetes, 200+ diabetes. Confirm by repeat testing.', topic: Glucose regulation}
- {front: 'ADH mechanism', back: 'High plasma osmolality → more ADH → cAMP in collecting-duct cells → aquaporins inserted → water reabsorbed → concentrated urine (up to about 1,200 mOsm/kg).', topic: Hormone signaling}
- {front: 'Central vs nephrogenic diabetes insipidus', back: 'Central: too little ADH; urine concentrates after desmopressin. Nephrogenic: kidney unresponsive; little change after desmopressin.', topic: Hormone signaling}
- {front: 'Minimum urine volume', back: 'Solute load ÷ maximum urine concentration, e.g. 600 mOsm ÷ 1,200 mOsm/L = 0.5 L/day.', topic: Hormone signaling}
- {front: 'Estrogen and the LH surge', back: 'Estrogen normally inhibits LH (negative feedback); sustained high estrogen late in the cycle triggers an LH surge (positive feedback) and ovulation follows.', topic: Hormone signaling}
