# Notecards for honors module bio-h3 (Behavior, disease, and conservation)
- {front: 'Proximate vs ultimate causes of behavior', back: 'Proximate: how it works (stimuli, nerves, hormones, development). Ultimate: why it evolved (effect on fitness, evolutionary history). Both explain the same behavior at different levels.', topic: Animal behavior}
- {front: 'Tinbergen''s four questions', back: 'Mechanism and development (proximate); function and evolutionary history (ultimate).', topic: Animal behavior}
- {front: 'Fixed action pattern', back: 'An unlearned behavior sequence triggered by a sign stimulus that runs to completion once started, e.g. a greylag goose rolling an egg (or a doorknob) back into the nest.', topic: Animal behavior}
- {front: 'Imprinting', back: 'Learning during a sensitive period early in life that is hard to reverse; Lorenz''s goslings followed him. The capacity is built in; what is learned depends on experience.', topic: Animal behavior}
- {front: 'Types of learning', back: 'Imprinting, habituation, classical conditioning (stimulus–stimulus), operant conditioning (action–consequence), spatial learning, social learning.', topic: Animal behavior}
- {front: 'Tinbergen''s digger wasp experiment', back: 'He ringed a nest with pine cones, then moved the ring; returning wasps searched in the moved ring, showing they navigate by learned landmarks.', topic: Animal behavior}
- {front: 'Reading a waggle dance', back: 'Angle of the waggle run from straight up = angle of the food from the sun''s direction. Longer waggle run = farther food (calibration varies by colony).', topic: Animal behavior}
- {front: 'Three levels of animal navigation', back: 'Piloting (landmarks), compass orientation (sun, stars, magnetic field), true navigation (map plus compass from unfamiliar places).', topic: Animal behavior}
- {front: 'Clock-shift experiment', back: 'Shifting a pigeon''s internal clock by 6 h shifts its sun-compass heading by about 90° (15° per hour in the simple model), evidence for a time-compensated sun compass.', topic: Animal behavior}
- {front: 'Prey profitability', back: 'Energy gained ÷ handling time. Optimal foraging theory predicts animals prefer the most profitable prey, which is not always the largest.', topic: Animal behavior}
- {front: 'Hamilton''s rule', back: 'Helping is favored when $rB > C$ ($r$ = relatedness of actor to recipient, $B$ = recipient''s extra offspring, $C$ = actor''s lost offspring).', topic: Social behavior}
- {front: 'Coefficients of relatedness (diploid)', back: 'Parent–child $\tfrac12$; full siblings $\tfrac12$; half siblings, grandparent, aunt or uncle $\tfrac14$; first cousins $\tfrac18$. Add $(\tfrac12)^L$ over all paths.', topic: Social behavior}
- {front: 'Inclusive fitness', back: 'Own reproduction plus the extra reproduction of relatives one causes, weighted by relatedness. Kin selection acts on it.', topic: Social behavior}
- {front: 'Haplodiploid relatedness (queen mated once)', back: 'Worker to full sister $\tfrac34$; to brother $\tfrac14$; to her own offspring $\tfrac12$.', topic: Social behavior}
- {front: 'Caveats to the haplodiploidy hypothesis', back: 'Brothers are only $\tfrac14$ related; many queens mate multiply (average $r = \tfrac14 + \tfrac{1}{2n}$); termites and naked mole-rats are diploid yet eusocial; most haplodiploid species aren''t eusocial; ecology matters.', topic: Social behavior}
- {front: 'Conditions for reciprocal altruism', back: 'Repeated meetings between the same individuals, recognition of partners, and the ability to stop helping cheaters (e.g. vampire bats sharing blood).', topic: Social behavior}
- {front: 'Parental investment and choosiness', back: 'The sex that invests more per offspring (usually females) tends to be choosier; the other sex competes. In role-reversed species such as some pipefish and jacanas, females compete.', topic: Social behavior}
- {front: 'Intrasexual vs intersexual selection', back: 'Intrasexual: competition within a sex (elephant seal fights). Intersexual: mate choice by the other sex (widowbird females prefer long tails).', topic: Social behavior}
- {front: 'Mating systems', back: 'Monogamy (1 male, 1 female), polygyny (1 male, several females), polyandry (1 female, several males), promiscuity (no lasting bonds).', topic: Social behavior}
- {front: 'Incidence vs prevalence', back: 'Incidence: new cases per population per time. Prevalence: existing cases per population at one time. Prevalence ≈ incidence × duration (steady state).', topic: Epidemiology}
- {front: '$R_0$ vs $R_e$', back: '$R_0$: infections per case in a fully susceptible population. $R_e = R_0 \times s$: infections per case now. Cases grow if $R_e > 1$, shrink if $R_e < 1$.', topic: Epidemiology}
- {front: 'SIR model, one time step', back: 'New infections $= \beta SI/N$; recoveries $= \gamma I$; $S$ falls by new infections, $I$ rises by new infections minus recoveries, $R$ rises by recoveries. $R_0 = \beta/\gamma$.', topic: Epidemiology}
- {front: 'When does an SIR epidemic peak?', back: 'When the susceptible fraction falls to $1/R_0$ (so $R_e = 1$). The epidemic then overshoots: about 94% are eventually infected when $R_0 = 3$.', topic: Epidemiology}
- {front: 'Herd immunity threshold (population view)', back: 'Set $R_0 s = 1$: an infection can''t grow once more than $1 - 1/R_0$ of the population is immune.', topic: Epidemiology}
- {front: 'John Snow''s evidence', back: '1854: deaths clustered around the Broad Street pump, with telling exceptions; homes supplied by the downstream Southwark and Vauxhall Company had about 8 times the cholera death rate of Lambeth homes.', topic: Epidemiology}
- {front: 'Epidemic curve shapes', back: 'One sharp peak: point source. Plateau: continuing common source. Successive growing peaks one incubation period apart: person-to-person spread.', topic: Epidemiology}
- {front: 'Attack rate and relative risk', back: 'Attack rate = ill ÷ exposed in a group. Relative risk = attack rate among exposed ÷ attack rate among unexposed.', topic: Epidemiology}
- {front: 'Zoonoses', back: 'Diseases spread between animals and people (rabies, Lyme, avian flu, Ebola). More than 6 in 10 known human infectious diseases and about 3 in 4 emerging ones come from animals.', topic: Epidemiology}
- {front: 'Antibiotic stewardship', back: 'Antibiotics only when needed (not for viruses), the right narrow-spectrum drug, dose and duration; prevent infections; limit farm use. Every use selects for resistance.', topic: Epidemiology}
- {front: 'Extinction rates', back: 'Background about 0.1 extinctions per million species-years (E/MSY); current estimates near 100 E/MSY, about 1,000 times higher.', topic: Conservation biology}
- {front: 'Island biogeography', back: 'Species number is an equilibrium of immigration (falls with distance from the mainland) and extinction (higher on small islands). Large, near islands hold the most species.', topic: Conservation biology}
- {front: 'Species-area relationship', back: '$S = cA^z$, with $z \approx 0.2$–$0.35$ on islands. Ratio form: $S_2/S_1 = (A_2/A_1)^z$. With $z = 0.3$, 10 times the area holds about twice the species.', topic: Conservation biology}
- {front: 'Edge effects and core area', back: 'Edges are lighter, windier, drier and have more invaders and nest predators. A square of side $L$ with edge depth $d$ keeps core $(L - 2d)^2$; one large block keeps more core than several small ones of the same total area.', topic: Conservation biology}
- {front: 'Effective population size, unequal sexes', back: '$N_e = \dfrac{4N_mN_f}{N_m + N_f}$. 10 males and 40 females give $N_e = 32$, not 50.', topic: Conservation biology}
- {front: 'Loss of heterozygosity by drift', back: '$H_t = H_0\left(1 - \dfrac{1}{2N_e}\right)^t$: a fraction $1/(2N_e)$ is lost each generation.', topic: Conservation biology}
- {front: 'Extinction vortex', back: 'Small population → inbreeding and drift → lost diversity and inbreeding depression → lower survival and reproduction → smaller population.', topic: Conservation biology}
- {front: 'Genetic rescue example', back: 'Florida panthers (about 20–30 left, with heart defects and kinked tails) received 8 female Texas pumas in 1995; defects fell and numbers grew to an estimated 120–230.', topic: Conservation biology}
- {front: 'Variable growth and population viability', back: 'The long-run growth rate is the geometric mean of yearly $\lambda$ values: alternating 1.5 and 0.6 averages 1.05 but gives $\sqrt{0.9} \approx 0.95$, a decline.', topic: Conservation biology}
- {front: 'Mark–recapture biases', back: 'Trap-shy marked animals → too few recaptures → overestimate. Trap-happy → underestimate. Chapman: $N = \dfrac{(M+1)(C+1)}{R+1} - 1$.', topic: Conservation biology}
- {front: 'Invasive species management, cheapest first', back: 'Prevention, early detection and rapid response, eradication (works best on islands, e.g. South Georgia rats), then long-term control, including tested biological control.', topic: Conservation biology}
- {front: 'Conservation successes', back: 'California condor (27 birds in 1987, about 600 by 2025), Yellowstone wolves (reintroduced 1995–96), humpback whales after hunting bans (1966, 1986), Florida panther genetic rescue.', topic: Conservation biology}
