- term: double helix
  definition: 'The shape of DNA: two strands twisted around each other like a spiral ladder, with sugar–phosphate backbones as the rails and base pairs as the rungs.'
  topic: DNA structure
- term: complementary base pairing
  aliases: [base pairing, base pair, base pairs]
  definition: 'The rule that bases pair only in set combinations held by hydrogen bonds: A with T (or U in RNA) and G with C.'
  topic: DNA structure
- term: antiparallel
  definition: 'Running in opposite directions. The two strands of DNA are antiparallel: one runs 5′ → 3′ and its partner 3′ → 5′.'
  topic: DNA structure
- term: Chargaff's rules
  definition: 'In double-stranded DNA the amount of A equals the amount of T and the amount of G equals the amount of C; the proportion of A + T to G + C differs between species.'
  topic: DNA structure
- term: semiconservative replication
  definition: 'DNA copying in which each new double helix keeps one original strand and gets one newly made strand; shown by Meselson and Stahl in 1958.'
  topic: DNA replication
- term: DNA polymerase
  definition: 'The enzyme that builds new DNA by adding nucleotides that pair with a template strand. It adds only to the 3′ end, so new strands grow 5′ → 3′, and it proofreads its work.'
  topic: DNA replication
- term: Okazaki fragments
  aliases: [Okazaki fragment]
  definition: 'Short pieces of DNA made on the lagging strand during replication, later joined by DNA ligase.'
  topic: DNA replication
- term: central dogma
  definition: 'The main flow of genetic information in cells: DNA → RNA (transcription) → protein (translation).'
  topic: Transcription
- term: transcription
  definition: 'Making an RNA copy of a gene, using one DNA strand as the template; carried out by RNA polymerase.'
  topic: Transcription
- term: translation
  definition: 'Building a polypeptide from the codons of an mRNA, done by ribosomes with tRNAs bringing the amino acids.'
  topic: Translation
- term: mRNA
  aliases: [messenger RNA]
  definition: 'Messenger RNA: the RNA copy of a gene that carries its codons to a ribosome for translation.'
  topic: Transcription
- term: tRNA
  aliases: [transfer RNA]
  definition: 'Transfer RNA: a small RNA that carries a specific amino acid and has an anticodon that pairs with a matching mRNA codon.'
  topic: Translation
- term: rRNA
  aliases: [ribosomal RNA]
  definition: 'Ribosomal RNA: the RNA that forms the core of ribosomes and catalyzes peptide bonds.'
  topic: Translation
- term: RNA polymerase
  definition: 'The enzyme that transcribes DNA into RNA. It binds at a promoter, needs no primer, and builds RNA 5′ → 3′.'
  topic: Transcription
- term: promoter
  aliases: [promoters]
  definition: 'A DNA sequence just upstream of a gene where RNA polymerase (helped by other proteins) binds to start transcription.'
  topic: Transcription
- term: intron
  aliases: [introns]
  definition: 'A stretch of a eukaryotic gene that is transcribed but cut out of the RNA before translation.'
  topic: Transcription
- term: exon
  aliases: [exons]
  definition: 'A stretch of a gene that stays in the mature mRNA after introns are removed; exons are spliced together and expressed.'
  topic: Transcription
- term: codon
  aliases: [codons]
  definition: 'A group of three mRNA bases that specifies one amino acid or a stop signal. There are 64 codons; AUG is the start codon and UAA, UAG and UGA are stop codons.'
  topic: Genetic code
- term: anticodon
  aliases: [anticodons]
  definition: 'The three bases on a tRNA that pair with a complementary mRNA codon.'
  topic: Translation
- term: operon
  aliases: [operons, lac operon]
  definition: 'In bacteria, a cluster of genes under one promoter and operator, transcribed together as one mRNA, such as the lac operon.'
  topic: Gene regulation
- term: repressor
  aliases: [repressors]
  definition: 'A protein that blocks transcription by binding to DNA, such as the lac repressor binding the operator of the lac operon.'
  topic: Gene regulation
- term: transcription factor
  aliases: [transcription factors]
  definition: 'A protein that binds DNA near a gene (at a promoter or enhancer) and helps turn its transcription on or off.'
  topic: Gene regulation
- term: mutation
  aliases: [mutations]
  definition: 'Any change in the DNA sequence. Germline mutations can be inherited; somatic mutations are not passed to offspring.'
  topic: Mutations
- term: mutagen
  aliases: [mutagens]
  definition: 'An agent that damages DNA or raises the mutation rate, such as ultraviolet light, X-rays or certain chemicals.'
  topic: Mutations
- term: point mutation
  aliases: [point mutations]
  definition: 'A change in a single base. A substitution can be silent (same amino acid), missense (different amino acid) or nonsense (stop codon).'
  topic: Mutations
- term: frameshift mutation
  aliases: [frameshift, frameshift mutations]
  definition: 'An insertion or deletion of bases (not a multiple of three) that shifts the reading frame, changing every codon after it.'
  topic: Mutations
- term: restriction enzyme
  aliases: [restriction enzymes]
  definition: 'A bacterial enzyme that cuts DNA at a specific short sequence, often leaving sticky ends.'
  topic: Biotechnology
- term: gel electrophoresis
  definition: 'A method that separates DNA fragments by size: an electric current pulls negatively charged DNA through a gel toward the positive electrode, and smaller fragments travel farther.'
  topic: Gel electrophoresis
- term: PCR
  aliases: [polymerase chain reaction]
  definition: 'Polymerase chain reaction: repeated cycles of heating and cooling with primers and a heat-stable DNA polymerase that copy a chosen DNA sequence, ideally doubling it each cycle.'
  topic: PCR
- term: recombinant DNA
  definition: 'DNA made by joining pieces from different sources, such as a human gene inserted into a bacterial plasmid.'
  topic: Biotechnology
- term: plasmid
  aliases: [plasmids]
  definition: 'A small circle of DNA, separate from the chromosome, that bacteria copy on their own; used to carry genes into cells.'
  topic: Biotechnology
- term: transgenic organism
  aliases: [transgenic organisms, transgenic]
  definition: 'An organism carrying a gene from another species, such as Bt corn or bacteria that make human insulin.'
  topic: Biotechnology
- term: CRISPR
  aliases: [CRISPR-Cas9]
  definition: 'A gene-editing system adapted from bacterial defenses: a guide RNA leads the Cas9 enzyme to cut a chosen DNA sequence, which the cell then repairs.'
  topic: Biotechnology
- term: DNA profiling
  aliases: [DNA fingerprinting]
  definition: 'Comparing the lengths of highly variable DNA regions, such as short tandem repeats (STRs), to tell individuals apart.'
  topic: Biotechnology
- term: inducible operon
  aliases: [inducible operons, inducible]
  definition: 'An operon that is normally off and is switched on when a small molecule (the inducer) inactivates its repressor, as lactose (allolactose) does for the lac operon.'
  topic: Operons
- term: repressible operon
  aliases: [repressible operons, repressible]
  definition: 'An operon that is normally on and is switched off when a small molecule (a corepressor) activates its repressor, as tryptophan does for the trp operon.'
  topic: Operons
- term: corepressor
  aliases: [corepressors]
  definition: 'A small molecule that binds an inactive repressor and lets it bind the operator, turning genes off; tryptophan is the corepressor of the trp operon.'
  topic: Operons
- term: CAP
  aliases: [catabolite activator protein, CAP–cAMP, CAP-cAMP]
  definition: 'Catabolite activator protein: a bacterial activator that, with cAMP bound (when glucose is low), binds next to the lac promoter and boosts transcription.'
  topic: Operons
- term: trans-acting
  aliases: [acts in trans]
  definition: 'Describes a diffusible product, such as a repressor protein, that can act on any copy of its target, including copies on other DNA molecules.'
  topic: Operons
- term: cis-acting
  aliases: [acts in cis]
  definition: 'Describes a DNA site, such as an operator, promoter or enhancer, that controls only the genes on the same DNA molecule.'
  topic: Operons
- term: general transcription factors
  aliases: [general transcription factor]
  definition: 'Proteins that assemble at a eukaryotic core promoter (often at a TATA box) and position RNA polymerase II; alone they give only a low, basal rate of transcription.'
  topic: Eukaryotic gene regulation
- term: enhancer
  aliases: [enhancers]
  definition: 'A DNA control region bound by activator proteins that raises transcription of a gene; it can lie far upstream, downstream or in an intron and works in either orientation, reaching the promoter by DNA looping.'
  topic: Eukaryotic gene regulation
- term: histone
  aliases: [histones, histone proteins]
  definition: 'One of the small, positively charged proteins that DNA wraps around in eukaryotic chromosomes; eight histones form the core of a nucleosome.'
  topic: Epigenetics
- term: nucleosome
  aliases: [nucleosomes]
  definition: 'The basic unit of DNA packing: about 147 base pairs of DNA wrapped around a core of eight histone proteins.'
  topic: Epigenetics
- term: chromatin
  aliases: [heterochromatin, euchromatin]
  definition: 'The complex of DNA and proteins (mainly histones) that makes up eukaryotic chromosomes. Tightly packed chromatin (heterochromatin) is mostly silent; loosely packed chromatin (euchromatin) can be transcribed.'
  topic: Epigenetics
- term: DNA methylation
  aliases: [methylation, methylated DNA]
  definition: 'Addition of methyl groups to DNA bases, in mammals mostly to cytosines followed by guanine (CpG); methylated promoters are usually silenced, and the pattern is copied after replication.'
  topic: Epigenetics
- term: epigenetics
  aliases: [epigenetic, epigenetic inheritance]
  definition: 'The study of changes in gene activity that are passed on through cell divisions without a change in the DNA sequence, such as DNA methylation patterns and X inactivation.'
  topic: Epigenetics
- term: alternative splicing
  aliases: [alternatively spliced]
  definition: 'Joining a pre-mRNA''s exons in different combinations, so one gene can make several different mRNAs and proteins.'
  topic: Eukaryotic gene regulation
- term: microRNA
  aliases: [microRNAs, miRNA, miRNAs]
  definition: 'A small noncoding RNA, about 22 nucleotides long, that pairs with target mRNAs (usually in their 3′ untranslated region) and reduces their translation and stability.'
  topic: Eukaryotic gene regulation
- term: dideoxynucleotide
  aliases: [dideoxynucleotides, ddNTP, ddNTPs]
  definition: 'A nucleotide lacking the 3′-OH group, so no nucleotide can be added after it; labeled ones stop strands in Sanger sequencing.'
  topic: Genomics
- term: Sanger sequencing
  aliases: [chain-termination sequencing]
  definition: 'DNA sequencing in which labeled dideoxynucleotides stop new strands at every position; sorting the strands by length and reading their end labels gives the sequence (about 1,000 bases per read).'
  topic: Genomics
- term: next-generation sequencing
  aliases: [NGS, high-throughput sequencing]
  definition: 'Sequencing methods that read millions to billions of DNA fragments in parallel, giving short reads (often about 150 bases) or, in long-read methods, single molecules thousands of bases long.'
  topic: Genomics
- term: coverage
  aliases: [sequencing coverage, read depth]
  definition: 'The average number of sequencing reads covering each base: $C = NL/G$ for $N$ reads of length $L$ on a genome of size $G$.'
  topic: Genomics
- term: genome
  aliases: [genomes]
  definition: 'The complete set of DNA in an organism (or in one set of its chromosomes); the human genome has about 3.1 billion base pairs.'
  topic: Genomics
- term: SNP
  aliases: [SNPs, single-nucleotide polymorphism, single-nucleotide polymorphisms]
  definition: 'Single-nucleotide polymorphism: a position in the genome where people differ by one base; unrelated people differ at about 1 base in 1,000.'
  topic: Genomics
- term: guide RNA
  aliases: [guide RNAs, sgRNA, single guide RNA]
  definition: 'The RNA that directs Cas9: its first 20 bases match the target DNA and pair with it, and the rest binds Cas9.'
  topic: Gene editing
- term: PAM
  aliases: [protospacer adjacent motif, PAMs]
  definition: 'Protospacer adjacent motif: a short sequence (5′-NGG-3′ for the common Cas9) that must sit next to the target for Cas9 to bind and cut.'
  topic: Gene editing
- term: gene therapy
  aliases: [gene therapies]
  definition: 'Treating disease by adding, repairing or silencing genes in a patient''s cells, either outside the body (ex vivo) or inside it (in vivo).'
  topic: Gene editing
