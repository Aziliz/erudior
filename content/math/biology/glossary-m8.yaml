# ---- m8 The diversity of life
- term: taxonomy
  definition: 'The science of naming, describing and classifying organisms.'
  topic: Classification
- term: binomial nomenclature
  definition: 'The two-part scientific naming system: genus (capitalized) plus specific epithet (lowercase), both italicized, as in Homo sapiens.'
  topic: Classification
- term: three-domain system
  aliases: [three domains]
  definition: 'The classification of all cellular life into Bacteria, Archaea and Eukarya, proposed by Carl Woese from ribosomal RNA comparisons (formalized in 1990). Many current trees place eukaryotes within the archaeal branch, but the three domains remain the standard classification.'
  topic: Classification
- term: Archaea
  aliases: [archaeon, archaeans]
  definition: 'A domain of single-celled organisms without a nucleus that differ from bacteria in membrane lipids, cell walls (no peptidoglycan) and gene-expression machinery, which resembles that of eukaryotes.'
  topic: Bacteria and archaea
- term: binary fission
  definition: 'Asexual division of a prokaryotic cell: the circular chromosome is copied and the cell splits in two, without mitosis.'
  topic: Bacteria and archaea
- term: generation time
  definition: 'The time it takes a population of cells to double; about 20 minutes for E. coli in ideal conditions.'
  topic: Bacteria and archaea
- term: pathogen
  aliases: [pathogens]
  definition: 'An organism or agent, such as a bacterium, virus, fungus or protist, that causes disease.'
  topic: Bacteria and archaea
- term: lytic cycle
  definition: 'A viral replication cycle in which the virus takes over the host cell at once, makes new viruses, and bursts (lyses) the cell to release them.'
  topic: Viruses
- term: lysogenic cycle
  definition: 'A viral replication cycle in which the viral DNA is inserted into the host chromosome and copied with it, staying dormant until a trigger switches it to the lytic cycle.'
  topic: Viruses
- term: protist
  aliases: [protists]
  definition: 'Any eukaryote that is not a plant, animal or fungus; a varied catch-all group, not a single evolutionary branch.'
  topic: Protists
- term: hypha
  aliases: [hyphae]
  definition: 'A thread-like filament that makes up the body of most fungi.'
  topic: Fungi
- term: mycelium
  aliases: [mycelia]
  definition: 'The branching network of hyphae that forms the main body of a fungus.'
  topic: Fungi
- term: mycorrhiza
  aliases: [mycorrhizae, mycorrhizas]
  definition: 'A mutually beneficial partnership between fungal hyphae and plant roots: the fungus supplies water and minerals, the plant supplies sugars.'
  topic: Fungi
- term: lichen
  aliases: [lichens]
  definition: 'A partnership between a fungus and a photosynthetic alga or cyanobacterium that can live on bare rock.'
  topic: Fungi
- term: gymnosperm
  aliases: [gymnosperms]
  definition: 'A vascular seed plant whose seeds develop exposed on the scales of cones, such as a pine.'
  topic: Plants
- term: angiosperm
  aliases: [angiosperms]
  definition: 'A flowering plant: a seed plant whose seeds develop enclosed in an ovary that becomes a fruit.'
  topic: Plants
- term: alternation of generations
  definition: 'A plant life cycle with two multicellular stages: a haploid gametophyte that makes gametes and a diploid sporophyte that makes spores by meiosis.'
  topic: Plants
- term: xylem
  definition: 'Vascular tissue of dead, lignin-walled tubes that carries water and minerals up from the roots.'
  topic: Plants
- term: phloem
  definition: 'Vascular tissue of living sieve-tube cells that carries sugars from sources (such as leaves) to sinks (such as roots and fruits).'
  topic: Plants
- term: stomata
  aliases: [stoma]
  definition: 'Pores in a leaf surface, each between two guard cells, that let carbon dioxide in and water vapor out.'
  topic: Plants
- term: transpiration
  definition: 'Evaporation of water from leaves through the stomata, which pulls water up through the xylem.'
  topic: Plants
- term: pollination
  definition: 'Transfer of pollen from an anther to a stigma (or, in gymnosperms, to the ovule); it comes before fertilization.'
  topic: Plants
- term: tropism
  aliases: [tropisms]
  definition: 'A growth response toward or away from a stimulus, such as phototropism (light) or gravitropism (gravity).'
  topic: Plants
- term: invertebrate
  aliases: [invertebrates]
  definition: 'An animal without a backbone; about 95% of animal species.'
  topic: Animals
- term: bilateral symmetry
  definition: 'A body plan with one plane dividing it into mirror-image left and right halves, with a front end and a back end.'
  topic: Animals
- term: coelom
  definition: 'A fluid-filled body cavity fully lined with tissue from the mesoderm, between the gut and the body wall.'
  topic: Animals
- term: chordate
  aliases: [chordates]
  definition: 'An animal that at some stage has a notochord, a dorsal hollow nerve cord, pharyngeal slits and a post-anal tail.'
  topic: Animals
- term: amniotic egg
  definition: 'An egg with membranes that enclose the embryo in fluid and handle gas exchange and wastes, letting reptiles, birds and mammals reproduce away from water.'
  topic: Animals
- term: endotherm
  aliases: [endotherms, endothermic]
  definition: 'An animal that generates most of its body heat by metabolism and keeps a nearly constant body temperature, such as a bird or mammal.'
  topic: Animals
- term: dichotomous key
  definition: 'An identification tool made of paired, mutually exclusive choices that narrow down an organism step by step.'
  topic: Classification
# ---- m8 honors: plant physiology (bio-h-plant-physiology)
- term: auxin
  aliases: [auxins, IAA, indole-3-acetic acid]
  definition: 'A plant hormone (mainly indole-3-acetic acid, IAA) made in shoot tips that drives cell elongation, phototropism, gravitropism, apical dominance and root formation; its effects depend on tissue and concentration.'
  topic: Plant hormones
- term: polar auxin transport
  definition: 'One-way, cell-to-cell movement of auxin from the shoot tip toward the base, caused by auxin-exporting carrier proteins (PIN proteins) located at one end of each cell.'
  topic: Plant hormones
- term: acid growth hypothesis
  definition: 'The idea that auxin makes cells elongate by activating proton pumps that acidify the cell wall, which activates wall-loosening proteins (expansins) so turgor pressure can stretch the wall.'
  topic: Plant hormones
- term: gravitropism
  definition: 'Growth in response to gravity: shoots curve upward and roots curve downward, guided by auxin redistributed to the lower side.'
  topic: Plant responses
- term: apical dominance
  definition: 'Suppression of side-bud growth by an actively growing shoot tip; removing the tip releases the buds.'
  topic: Plant hormones
- term: gibberellin
  aliases: [gibberellins, GA]
  definition: 'A class of plant hormones that promote stem elongation and seed germination; in cereal grains they trigger the making of amylase to digest stored starch.'
  topic: Plant hormones
- term: cytokinin
  aliases: [cytokinins]
  definition: 'A class of plant hormones that promote cell division, favor shoot formation in tissue culture (with auxin), and delay the aging of leaves.'
  topic: Plant hormones
- term: abscisic acid
  aliases: [ABA]
  definition: 'A plant stress hormone that closes stomata during drought and keeps seeds dormant.'
  topic: Plant hormones
- term: ethylene
  definition: 'A gaseous plant hormone that triggers fruit ripening and the shedding of leaves, flowers and fruit.'
  topic: Plant hormones
- term: phytochrome
  aliases: [phytochromes]
  definition: 'A plant pigment that switches to its active form (Pfr) in red light and back to the inactive form (Pr) in far-red light; it controls germination, shade responses and photoperiodism.'
  topic: Plant responses
- term: photoperiodism
  definition: 'A response, such as flowering, to the relative lengths of day and night; plants actually measure the length of uninterrupted darkness.'
  topic: Plant responses
- term: critical night length
  definition: 'The night length that a photoperiodic plant compares against: short-day plants flower when nights are longer than it, long-day plants when nights are shorter.'
  topic: Plant responses
- term: florigen
  definition: 'The flowering signal made in leaves and carried in the phloem to the shoot tip; identified in 2007 as the FT protein.'
  topic: Plant responses
- term: cavitation
  aliases: [embolism]
  definition: 'Formation of a gas bubble in a xylem conduit under high tension, which breaks the water column and puts the conduit out of use.'
  topic: Water transport
- term: root pressure
  definition: 'Positive pressure in the xylem produced when roots pump ions into it and water follows by osmosis; it causes guttation but is too weak to lift water up tall trees.'
  topic: Water transport
- term: guard cell
  aliases: [guard cells]
  definition: 'One of the pair of cells around a stoma; they swell and bow apart to open the pore and go limp to close it.'
  topic: Water transport
# ---- m8 honors: microbes (bio-h-microbes)
- term: plaque
  aliases: [plaques, PFU, plaque-forming unit, plaque-forming units]
  definition: 'A clear spot in a lawn of bacteria where one phage and its offspring have killed the cells; plaques are counted as plaque-forming units (PFU) to measure phage numbers.'
  topic: Viral replication
- term: burst size
  definition: 'The average number of new viruses released by one infected cell when it bursts.'
  topic: Viral replication
- term: prophage
  aliases: [prophages]
  definition: 'Phage DNA integrated into a bacterial chromosome during the lysogenic cycle and copied along with it.'
  topic: Viral replication
- term: lysogenic conversion
  definition: 'A change in a bacterium''s traits caused by genes carried on a prophage, such as the ability to make cholera or diphtheria toxin.'
  topic: Viral replication
- term: reverse transcriptase
  definition: 'A viral enzyme that copies RNA into DNA; retroviruses such as HIV use it to make a DNA copy of their genome.'
  topic: Viral replication
- term: provirus
  aliases: [proviruses]
  definition: 'Retroviral DNA that has been inserted into a host cell''s chromosome.'
  topic: Viral replication
- term: antigenic drift
  definition: 'Gradual change in a virus''s surface proteins through point mutations, so that existing antibodies fit less well; the reason flu vaccines are updated each year.'
  topic: Viral replication
- term: antigenic shift
  definition: 'A sudden major change in an influenza virus when two strains infecting the same cell swap genome segments, producing new surface proteins; it can cause pandemics.'
  topic: Viral replication
- term: minimum inhibitory concentration
  aliases: [MIC]
  definition: 'The lowest concentration of an antibiotic that prevents visible growth of a bacterial strain in a lab test.'
  topic: Antibiotic resistance
- term: conjugation
  aliases: [bacterial conjugation]
  definition: 'Transfer of DNA, usually a plasmid, from one bacterium to another through a connecting pilus.'
  topic: Antibiotic resistance
- term: transformation
  aliases: [bacterial transformation]
  definition: 'Uptake by a bacterium of naked DNA from its surroundings, which can give it new genes.'
  topic: Antibiotic resistance
- term: transduction
  definition: 'Transfer of bacterial DNA from one cell to another by a phage that packaged it by mistake.'
  topic: Antibiotic resistance
- term: beta-lactamase
  aliases: [beta-lactamases, β-lactamase]
  definition: 'A bacterial enzyme that breaks the beta-lactam ring of penicillins and related antibiotics, making the bacterium resistant.'
  topic: Antibiotic resistance
- term: microbiome
  aliases: [microbiomes, gut microbiome]
  definition: 'The community of microorganisms living on and in a body, mostly bacteria in the large intestine.'
  topic: Antibiotic resistance
