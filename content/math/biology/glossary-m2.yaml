# ---- m2 Cells
- term: cell theory
  definition: 'The theory that all living things are made of one or more cells, the cell is the basic unit of structure and function, and all cells come from preexisting cells.'
  topic: Cell theory
- term: magnification
  definition: 'How many times larger an image is than the real object. For a compound microscope, total magnification = ocular × objective; actual size = image size ÷ magnification.'
  topic: Microscopy
- term: field of view
  definition: 'The circular area visible through a microscope; its diameter shrinks in proportion as magnification increases.'
  topic: Microscopy
- term: resolution
  aliases: [resolving power]
  definition: 'The smallest distance between two points at which they can still be seen as separate; about 0.2 µm for a light microscope and about 1 nm or better for an electron microscope.'
  topic: Microscopy
- term: electron microscope
  aliases: [electron microscopes, TEM, SEM]
  definition: 'A microscope that uses a beam of electrons instead of light, giving far higher resolution. A transmission EM (TEM) shows thin slices; a scanning EM (SEM) shows surfaces. Specimens must be dead and in a vacuum.'
  topic: Microscopy
- term: plasma membrane
  aliases: [cell membrane, plasma membranes, cell membranes]
  definition: 'The thin, flexible boundary of every cell, a phospholipid bilayer with proteins, that controls what enters and leaves.'
  topic: Cell types
- term: ribosome
  aliases: [ribosomes]
  definition: 'A small structure of RNA and protein, not surrounded by a membrane, that builds proteins; found in every cell.'
  topic: Cell types
- term: prokaryote
  aliases: [prokaryotes, prokaryotic, prokaryotic cell]
  definition: 'A single-celled organism (a bacterium or archaeon) whose cell has no nucleus and no membrane-bound organelles; its DNA lies in a nucleoid region.'
  topic: Cell types
- term: eukaryote
  aliases: [eukaryotes, eukaryotic, eukaryotic cell]
  definition: 'An organism whose cells have a nucleus and membrane-bound organelles: animals, plants, fungi and protists.'
  topic: Cell types
- term: virus
  aliases: [viruses]
  definition: 'A noncellular infectious particle of DNA or RNA inside a protein coat (capsid), sometimes with an envelope; it has no metabolism and reproduces only inside a host cell.'
  topic: Viruses
- term: nucleus
  aliases: [nuclei]
  definition: 'The organelle that holds a eukaryotic cell''s DNA, surrounded by a double nuclear envelope with pores; it contains the nucleolus, which makes ribosome parts.'
  topic: Organelles
- term: endoplasmic reticulum
  aliases: [ER, rough ER, smooth ER]
  definition: 'A network of membranes continuous with the nuclear envelope. Rough ER has ribosomes and makes proteins for export and membranes; smooth ER makes lipids, detoxifies and stores calcium.'
  topic: Organelles
- term: Golgi apparatus
  aliases: [Golgi, Golgi body]
  definition: 'A stack of flattened membrane sacs that modifies, sorts and packages proteins from the ER into vesicles for secretion or delivery.'
  topic: Organelles
- term: lysosome
  aliases: [lysosomes]
  definition: 'A membrane sac of digestive enzymes with an acidic interior that breaks down food particles, engulfed bacteria and worn-out organelles.'
  topic: Organelles
- term: mitochondrion
  aliases: [mitochondria]
  definition: 'The double-membrane organelle where cellular respiration releases energy from food and stores it in ATP; it has its own DNA and ribosomes.'
  topic: Organelles
- term: chloroplast
  aliases: [chloroplasts]
  definition: 'The double-membrane organelle in plants and algae where photosynthesis captures light energy to make sugar; it contains chlorophyll and its own DNA.'
  topic: Organelles
- term: cell wall
  aliases: [cell walls]
  definition: 'A rigid layer outside the plasma membrane of plants (cellulose), fungi (chitin), bacteria (peptidoglycan) and archaea that supports the cell and prevents bursting.'
  topic: Organelles
- term: endosymbiotic theory
  aliases: [endosymbiosis]
  definition: 'The theory that mitochondria and chloroplasts descend from free-living prokaryotes engulfed by an ancestral host cell, supported by their double membranes, circular DNA, bacteria-like ribosomes, division by splitting and DNA sequences.'
  topic: Organelles
- term: phospholipid
  aliases: [phospholipids, phospholipid bilayer]
  definition: 'A lipid with a polar, hydrophilic phosphate head and two nonpolar, hydrophobic fatty acid tails; in water phospholipids form the bilayer of cell membranes.'
  topic: Cell membrane
- term: fluid mosaic model
  definition: 'The model of a membrane as a fluid phospholipid bilayer in which a mosaic of proteins (and cholesterol, in animals) floats and moves sideways.'
  topic: Cell membrane
- term: selectively permeable
  aliases: [selective permeability, semipermeable]
  definition: 'Letting some substances cross easily (small nonpolar molecules) while blocking or controlling others (ions, large polar molecules).'
  topic: Cell membrane
- term: diffusion
  definition: 'The net movement of particles from higher to lower concentration (down a concentration gradient) by random motion, needing no energy from the cell.'
  topic: Transport
- term: facilitated diffusion
  definition: 'Passive diffusion of a substance down its concentration gradient through a channel or carrier protein.'
  topic: Transport
- term: osmosis
  definition: 'The diffusion of water across a selectively permeable membrane, from the side with lower solute concentration to the side with higher solute concentration.'
  topic: Transport
- term: tonicity
  aliases: [hypertonic, hypotonic, isotonic]
  definition: 'How a solution compares with a cell in solute concentration. Hypertonic: more solute than the cell, so the cell loses water. Hypotonic: less solute, so the cell gains water. Isotonic: equal, so no net change.'
  topic: Transport
- term: active transport
  definition: 'Movement of a substance against its concentration gradient (low to high) by a pump protein, using energy, usually from ATP; e.g. the sodium–potassium pump.'
  topic: Transport
- term: surface-area-to-volume ratio
  aliases: [SA:V, surface area to volume ratio]
  definition: 'Surface area divided by volume; for a cube of side $s$ it is $6/s$, so it falls as size increases, which limits how large cells can be.'
  topic: Surface area to volume
- term: differentiation
  aliases: [cell differentiation]
  definition: 'The process by which a cell becomes specialized in structure and function by switching particular genes on and others off; its DNA stays the same.'
  topic: Cell specialization
- term: tissue
  aliases: [tissues]
  definition: 'A group of similar cells that work together to perform a common function, such as muscle or epithelial tissue.'
  topic: Cell specialization
- term: organ
  aliases: [organs]
  definition: 'A structure made of two or more tissue types working together for a particular function, such as the stomach or a leaf.'
  topic: Cell specialization
- term: endomembrane system
  definition: 'The set of eukaryotic membranes linked by vesicle traffic: nuclear envelope, endoplasmic reticulum, Golgi apparatus, endosomes, lysosomes, vesicles and the plasma membrane. Mitochondria and chloroplasts are not part of it.'
  topic: Endomembrane system
- term: cytoskeleton
  definition: 'The network of protein fibers (microtubules, intermediate filaments and microfilaments) that gives a eukaryotic cell its shape, moves things within it and lets it move.'
  topic: Cytoskeleton
- term: signal sequence
  aliases: [signal sequences, signal peptide]
  definition: 'A stretch of about 15–30 amino acids with a hydrophobic core at the start of a protein that directs the ribosome making it to the ER; usually cut off inside the ER.'
  topic: Endomembrane system
- term: signal recognition particle
  aliases: [signal recognition particle (SRP), SRP]
  definition: 'An RNA–protein complex that binds a signal sequence as it leaves the ribosome, pauses translation and brings the ribosome to the ER membrane.'
  topic: Endomembrane system
- term: glycosylation
  definition: 'Adding sugar chains to a protein (or lipid); in the ER a ready-made branch of 14 sugars is attached to certain asparagines and later trimmed and rebuilt in the Golgi.'
  topic: Endomembrane system
- term: SNARE
  aliases: [SNAREs, SNARE proteins, SNARE protein]
  definition: 'Membrane proteins on a vesicle and on its target membrane that wind tightly together and pull the two membranes close enough to fuse. Botulinum and tetanus toxins cut them.'
  topic: Endomembrane system
- term: mannose-6-phosphate
  aliases: [M6P]
  definition: 'A phosphate-tagged sugar added in the Golgi to lysosomal enzymes; receptors in the trans-Golgi network bind it and send the enzymes to lysosomes.'
  topic: Endomembrane system
- term: receptor-mediated endocytosis
  definition: 'Uptake of specific molecules that bind receptors clustered in clathrin-coated pits of the plasma membrane, which pinch off as coated vesicles (for example, cholesterol-carrying LDL).'
  topic: Endomembrane system
- term: endosome
  aliases: [endosomes]
  definition: 'An acidic membrane compartment that receives material brought in by endocytosis, sends receptors back to the surface and passes cargo on to lysosomes.'
  topic: Endomembrane system
- term: autophagy
  definition: 'The process by which a cell wraps its own worn-out organelles or cytoplasm in a membrane and delivers them to lysosomes to be digested and recycled.'
  topic: Endomembrane system
- term: microtubule
  aliases: [microtubules]
  definition: 'A hollow cytoskeleton fiber about 25 nm wide built from tubulin; it serves as a track for kinesin and dynein and forms the spindle, cilia and flagella.'
  topic: Cytoskeleton
- term: intermediate filament
  aliases: [intermediate filaments]
  definition: 'A ropelike cytoskeleton fiber about 8–12 nm wide (keratins, lamins, vimentin) that resists pulling forces; not used as a motor track.'
  topic: Cytoskeleton
- term: microfilament
  aliases: [microfilaments, actin filament, actin filaments]
  definition: 'The thinnest cytoskeleton fiber, about 7 nm wide, made of actin; with myosin it drives muscle contraction, cell crawling and cytokinesis.'
  topic: Cytoskeleton
- term: dynamic instability
  definition: 'The behavior of microtubules, which switch between steady growth and rapid shrinking, letting the microtubule network rebuild itself quickly.'
  topic: Cytoskeleton
- term: motor protein
  aliases: [motor proteins]
  definition: 'A protein that uses ATP to move along a cytoskeleton fiber, carrying cargo: kinesin (mostly toward microtubule plus ends), dynein (toward minus ends) and myosin (along actin).'
  topic: Cytoskeleton
- term: ligand
  aliases: [ligands]
  definition: 'A molecule that binds specifically to another molecule, especially a signal molecule that binds a receptor.'
  topic: Cell signaling
- term: receptor
  aliases: [receptors, receptor protein, receptor proteins]
  definition: 'A protein, on the cell surface or inside the cell, whose shape fits a particular signal molecule; binding changes the receptor and starts the cell''s response.'
  topic: Cell signaling
- term: signal transduction
  definition: 'The conversion of a signal received at a receptor into a change inside the cell, usually through a chain of relay molecules; the middle stage of cell signaling.'
  topic: Cell signaling
- term: G protein-coupled receptor
  aliases: [G protein-coupled receptors, G protein-coupled receptors (GPCRs), G protein-coupled receptor (GPCR), GPCR, GPCRs]
  definition: 'A receptor that crosses the membrane seven times and, when its ligand binds, activates a G protein inside the cell; the largest family of receptors.'
  topic: Cell signaling
- term: G protein
  aliases: [G proteins]
  definition: 'A relay protein on the inner face of the membrane that is active when it holds GTP and inactive when it holds GDP; it switches itself off by breaking down its GTP.'
  topic: Cell signaling
- term: receptor tyrosine kinase
  aliases: [receptor tyrosine kinases, receptor tyrosine kinase (RTK), RTK, RTKs]
  definition: 'A membrane receptor that is also an enzyme: ligand binding makes two receptor molecules pair up and add phosphates to tyrosines on each other, which then bind relay proteins.'
  topic: Cell signaling
- term: ligand-gated ion channel
  aliases: [ligand-gated ion channels]
  definition: 'A membrane channel protein that opens and lets specific ions through when a particular ligand binds it, such as the acetylcholine receptor of muscle cells.'
  topic: Cell signaling
- term: intracellular receptor
  aliases: [intracellular receptors]
  definition: 'A receptor in the cytoplasm or nucleus for signals that reach the inside of the cell, such as steroid hormones; many act as transcription factors.'
  topic: Cell signaling
- term: dissociation constant
  aliases: [K_d, Kd]
  definition: 'For a ligand and its receptor, the ligand concentration at which half the receptors are occupied; a smaller value means tighter binding. Occupancy $f = [L]/([L] + K_d)$.'
  topic: Cell signaling
- term: protein kinase
  aliases: [protein kinases, kinase, kinases]
  definition: 'An enzyme that transfers a phosphate group from ATP to a protein, changing its shape and activity.'
  topic: Cell signaling
- term: protein phosphatase
  aliases: [protein phosphatases, phosphatase, phosphatases]
  definition: 'An enzyme that removes phosphate groups from proteins, reversing the work of protein kinases.'
  topic: Cell signaling
- term: phosphorylation cascade
  aliases: [phosphorylation cascades]
  definition: 'A chain of protein kinases in which each one phosphorylates and activates the next, relaying and amplifying a signal.'
  topic: Cell signaling
- term: second messenger
  aliases: [second messengers]
  definition: 'A small non-protein molecule or ion, such as cAMP or calcium ions, that spreads a signal through the cell after a receptor is activated.'
  topic: Cell signaling
- term: cyclic AMP
  aliases: [cyclic AMP (cAMP), cAMP]
  definition: 'A second messenger made from ATP by adenylyl cyclase; it activates protein kinase A and is broken down by phosphodiesterase.'
  topic: Cell signaling
- term: amplification
  aliases: [signal amplification]
  definition: 'The multiplication of a signal at each step of a cascade, so that a few signal molecules produce a large response.'
  topic: Cell signaling
- term: Ras
  definition: 'A small G protein that relays signals from receptor tyrosine kinases to the MAP kinase cascade; mutations that lock it in the active, GTP-bound form are common in cancer.'
  topic: Cell signaling
