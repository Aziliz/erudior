# ---- h1 Honors: Research and biostatistics
- term: operational definition
  aliases: [operational definitions]
  definition: 'A statement of exactly how a variable will be measured or manipulated in a study (for example, "growth" as dry mass after 21 days), so others can repeat it.'
  topic: Experimental design
- term: confounding variable
  aliases: [confounding variables, confounder, confounders, confounding]
  definition: 'A factor that differs between groups along with the treatment and also affects the outcome, so its effect cannot be separated from the treatment''s.'
  topic: Experimental design
- term: positive control
  aliases: [positive controls]
  definition: 'A group given a treatment already known to produce the effect, showing that the method can detect an effect when one exists.'
  topic: Experimental design
- term: negative control
  aliases: [negative controls]
  definition: 'A group treated exactly like the experimental group except for the factor being tested, expected to show no effect (for example, solvent only).'
  topic: Experimental design
- term: experimental unit
  aliases: [experimental units]
  definition: 'The smallest unit that independently receives a treatment (a pot, a cage, a culture, a person); replication must happen at this level.'
  topic: Experimental design
- term: pseudoreplication
  definition: 'Treating repeated measurements of the same experimental unit (many leaves from one plant, many cells from one dish) as if they were independent replicates, which overstates certainty.'
  topic: Experimental design
- term: sample size
  aliases: [sample sizes]
  definition: 'The number of independent experimental units in a group, written $n$. Uncertainty in a mean falls in proportion to $1/\sqrt{n}$.'
  topic: Experimental design
- term: statistical power
  definition: 'The probability that a study detects a real effect of a given size; it rises with sample size and effect size. Many studies aim for 80%.'
  topic: Experimental design
- term: random assignment
  aliases: [randomization, randomized, randomly assigned]
  definition: 'Using a chance process to decide which experimental unit gets which treatment, so groups differ only by chance, even in factors nobody measured.'
  topic: Experimental design
- term: blinding
  aliases: [blind, blinded, double-blind, single-blind]
  definition: 'Keeping people from knowing which treatment each unit received. Single-blind: the subjects don''t know. Double-blind: neither subjects nor the researchers treating and measuring them know.'
  topic: Experimental design
- term: placebo
  aliases: [placebos]
  definition: 'An inactive treatment made to look identical to the real one, given to a control group so that the effect of simply being treated is the same in both groups.'
  topic: Experimental design
- term: bias
  aliases: [biased]
  definition: 'A systematic error that pushes results in one direction; unlike chance error, it does not average out with more data.'
  topic: Experimental design
- term: sampling bias
  definition: 'Bias that arises when the individuals studied do not represent the population the conclusion is about.'
  topic: Experimental design
- term: observer bias
  definition: 'Bias that arises when an observer''s expectations influence what is measured or recorded; prevented by blinding.'
  topic: Experimental design
- term: observational study
  aliases: [observational studies]
  definition: 'A study in which researchers measure what already happens instead of assigning treatments; it can show associations but cannot by itself rule out confounding.'
  topic: Experimental design
- term: informed consent
  definition: 'A person''s voluntary agreement to take part in research after being told its purpose, procedures, risks and benefits in plain language, with the right to quit at any time.'
  topic: Experimental design
- term: institutional review board
  aliases: [IRB, IRBs, institutional review boards]
  definition: 'An independent committee that must review and approve research on people before it begins, weighing risks against benefits and checking consent procedures.'
  topic: Experimental design
- term: 3Rs
  aliases: [three Rs]
  definition: 'Principles for animal research (Russell and Burch, 1959): replace animals with other methods where possible, reduce the number used, and refine procedures to minimize pain and distress.'
  topic: Experimental design
- term: mean
  aliases: [means, sample mean, x-bar]
  definition: 'The sum of the values divided by how many there are, written $\bar{x}$; sensitive to outliers.'
  topic: Descriptive statistics
- term: median
  aliases: [medians]
  definition: 'The middle value when data are put in order (or the mean of the two middle values); resists outliers, so it suits skewed data.'
  topic: Descriptive statistics
- term: outlier
  aliases: [outliers]
  definition: 'A value far from the rest of the data. It may be an error or a real extreme; it should be checked, not deleted just because it is inconvenient.'
  topic: Descriptive statistics
- term: range
  definition: 'The largest value minus the smallest; a simple measure of spread that depends on only two values.'
  topic: Descriptive statistics
- term: standard deviation
  aliases: [standard deviations, SD, sample standard deviation]
  definition: 'Roughly the typical distance of values from the mean: $s = \sqrt{\sum (x - \bar{x})^2/(n - 1)}$. It describes how much individuals vary.'
  topic: Descriptive statistics
- term: normal distribution
  aliases: [normally distributed, bell curve]
  definition: 'A symmetric, bell-shaped distribution in which about 68% of values lie within 1 SD of the mean and about 95% within 2 SD.'
  topic: Descriptive statistics
- term: standard error
  aliases: [SE, standard error of the mean, standard errors]
  definition: 'A measure of how precisely a sample mean estimates the population mean: $\text{SE} = s/\sqrt{n}$. It shrinks as the sample grows.'
  topic: Descriptive statistics
- term: confidence interval
  aliases: [confidence intervals, CI, 95% confidence interval]
  definition: 'A range of plausible values for a population mean; a 95% confidence interval is about $\bar{x} \pm 2\,\text{SE}$ (a little wider for small samples).'
  topic: Descriptive statistics
- term: error bar
  aliases: [error bars]
  definition: 'A line drawn above and below a mean on a graph showing the SD, the SE or a confidence interval; the figure legend must say which.'
  topic: Descriptive statistics
- term: box plot
  aliases: [box plots, box-and-whisker plot]
  definition: 'A graph of a distribution: a box from the lower to the upper quartile with a line at the median, whiskers to the most extreme non-outlier values, and outliers as separate points.'
  topic: Descriptive statistics
- term: null hypothesis
  aliases: [null hypotheses, H0]
  definition: 'The specific "no effect" or "no difference" statement that a statistical test assumes in order to calculate how surprising the data are.'
  topic: Hypothesis testing
- term: alternative hypothesis
  aliases: [alternative hypotheses]
  definition: 'The statement accepted if the null hypothesis is rejected, such as "the treatment changes the mean."'
  topic: Hypothesis testing
- term: p-value
  aliases: [p-values, P value, p value]
  definition: 'The probability, assuming the null hypothesis is true, of getting a result at least as extreme as the one observed. It is not the probability that the null hypothesis is true.'
  topic: Hypothesis testing
- term: significance level
  aliases: [statistically significant, statistical significance]
  definition: 'The threshold ($\alpha$, usually 0.05) chosen in advance: if $p \le \alpha$, the null hypothesis is rejected and the result is called statistically significant.'
  topic: Hypothesis testing
- term: Type I error
  aliases: [Type I errors, false positive]
  definition: 'Rejecting a null hypothesis that is actually true (a false positive); it happens with probability $\alpha$ when the null is true.'
  topic: Hypothesis testing
- term: Type II error
  aliases: [Type II errors, false negative]
  definition: 'Failing to reject a null hypothesis that is actually false (missing a real effect); power is the probability of avoiding it.'
  topic: Hypothesis testing
- term: goodness-of-fit
  aliases: [goodness-of-fit test, goodness of fit]
  definition: 'A chi-square test comparing observed counts in categories with the counts a model predicts (such as a 3 : 1 ratio); df = categories − 1.'
  topic: Hypothesis testing
- term: test of independence
  aliases: [chi-square test of independence]
  definition: 'A chi-square test of whether two categorical variables in a contingency table are associated; expected count = row total × column total ÷ grand total, df = (rows − 1)(columns − 1).'
  topic: Hypothesis testing
- term: contingency table
  aliases: [contingency tables]
  definition: 'A table of counts that cross-classifies individuals by two categorical variables, one in the rows and one in the columns.'
  topic: Hypothesis testing
- term: degrees of freedom
  aliases: [df, degree of freedom]
  definition: 'The number of values free to vary once the totals or estimates are fixed; it selects which critical value a test uses.'
  topic: Hypothesis testing
- term: t-test
  aliases: [t-tests, t test]
  definition: 'A test comparing two means: $t$ = difference in means ÷ standard error of the difference; with two independent groups, df = $n_1 + n_2 - 2$.'
  topic: Hypothesis testing
- term: correlation
  aliases: [correlated, correlations]
  definition: 'A tendency for two measured variables to rise and fall together (positive) or in opposite directions (negative); by itself it does not show causation.'
  topic: Hypothesis testing
- term: correlation coefficient
  definition: 'A number $r$ from −1 to 1 measuring the strength and direction of a straight-line relationship between two variables.'
  topic: Hypothesis testing
- term: linear regression
  aliases: [regression, least-squares line, regression line]
  definition: 'Fitting the straight line $\hat{y} = a + bx$ that minimizes the sum of squared vertical distances from the points; used to predict $y$ from $x$ within the range of the data.'
  topic: Hypothesis testing
- term: coefficient of determination
  aliases: [r squared, r²]
  definition: 'The square of the correlation coefficient, $r^2$: the fraction of the variation in $y$ explained by the regression line.'
  topic: Hypothesis testing
- term: primary source
  aliases: [primary sources, primary literature, primary research article]
  definition: 'A report of original research by the people who did it, with their methods, data and conclusions.'
  topic: Scientific communication
- term: review article
  aliases: [review articles]
  definition: 'A secondary source that summarizes and evaluates many primary studies on a topic.'
  topic: Scientific communication
- term: IMRaD
  aliases: [IMRAD]
  definition: 'The standard structure of a research paper: Introduction, Methods, Results and Discussion (after the title and abstract).'
  topic: Scientific communication
- term: abstract
  aliases: [abstracts]
  definition: 'A one-paragraph summary at the start of a paper giving the question, methods, main results and conclusion.'
  topic: Scientific communication
- term: figure legend
  aliases: [figure legends, figure caption]
  definition: 'The text with a figure that says what is plotted, the sample size, what the error bars show and which statistical test was used.'
  topic: Scientific communication
- term: peer review
  aliases: [peer-reviewed, peer reviewed, peer reviewers]
  definition: 'Evaluation of a manuscript by independent experts before publication; it catches many problems but cannot guarantee a result is correct or detect most fraud.'
  topic: Scientific communication
- term: preprint
  aliases: [preprints]
  definition: 'A complete manuscript posted publicly (for example on bioRxiv or medRxiv) before or during peer review; a claim not yet checked by reviewers.'
  topic: Scientific communication
- term: retraction
  aliases: [retracted, retractions]
  definition: 'The formal withdrawal of a published paper by a journal because it is seriously flawed or the result of misconduct.'
  topic: Scientific communication
- term: conflict of interest
  aliases: [conflicts of interest, competing interest]
  definition: 'A financial or personal stake that an author or funder has in a study''s outcome; a reason for extra scrutiny, not automatic rejection.'
  topic: Scientific communication
