# ---- h1 Honors: Research and biostatistics
- {front: 'Operational definition', back: 'Exactly how a variable is measured or applied, e.g. "growth = dry mass after 21 days". Makes a study repeatable.', topic: Experimental design}
- {front: 'Positive control vs negative control', back: 'Positive: a treatment known to give the effect (shows the method works). Negative: everything but the tested factor, expected to show no effect (e.g. solvent only).', topic: Experimental design}
- {front: 'Confounding variable', back: 'A factor that changes along with the treatment and also affects the outcome, e.g. all treated plants on the warmer shelf.', topic: Experimental design}
- {front: 'Experimental unit and pseudoreplication', back: 'The unit is what independently gets the treatment (pot, cage, dish). Counting many measurements of one unit as replicates is pseudoreplication.', topic: Experimental design}
- {front: 'Sample size needed for a target SE', back: '$n \ge (\text{SD}/\text{SE}_{\text{target}})^2$, rounded up. Halving the SE takes 4 times the sample.', topic: Experimental design}
- {front: 'Statistical power', back: 'The chance a study detects a real effect of a given size. Small studies have low power, so "no significant difference" from them means little.', topic: Experimental design}
- {front: 'Random assignment vs blinding', back: 'Random assignment: chance decides who gets which treatment, so groups differ only by chance. Blinding: people don''t know who got what, preventing observer bias.', topic: Experimental design}
- {front: 'Single-blind vs double-blind', back: 'Single-blind: subjects don''t know their treatment. Double-blind: neither subjects nor the researchers treating and measuring them know.', topic: Experimental design}
- {front: 'Why more data don''t fix bias', back: 'Bias is systematic: a bigger biased sample just gives a more precise wrong answer. Fix the design (randomize, blind, sample fairly).', topic: Experimental design}
- {front: 'Belmont Report principles (1979)', back: 'Respect for persons (informed consent), beneficence (maximize benefits, minimize harms), justice (share burdens and benefits fairly). An IRB reviews studies on people.', topic: Experimental design}
- {front: 'The 3Rs of animal research', back: 'Replace animals where possible, reduce the number used, refine procedures to minimize pain and distress (Russell and Burch, 1959).', topic: Experimental design}
- {front: '1954 polio vaccine trial lesson', back: 'Randomized placebo trial: 28 vs 71 cases per 100,000. Comparing volunteers with non-volunteers was biased, because consenting families differed in polio risk.', topic: Experimental design}
- {front: 'Mean vs median', back: 'Mean = sum/n, pulled by outliers. Median = middle value, resists outliers. Use the median for skewed data such as parasite counts.', topic: Descriptive statistics}
- {front: 'Sample standard deviation', back: '$s = \sqrt{\dfrac{\sum (x - \bar{x})^2}{n - 1}}$: deviations from the mean, squared, summed, divided by $n - 1$, square-rooted.', topic: Descriptive statistics}
- {front: 'Normal distribution: the 68–95 rule', back: 'About 68% of values lie within 1 SD of the mean and about 95% within 2 SD (1.96 exactly).', topic: Descriptive statistics}
- {front: 'Standard error of the mean', back: '$\text{SE} = s/\sqrt{n}$. Measures how precisely the mean is known; shrinks as $n$ grows.', topic: Descriptive statistics}
- {front: 'SD vs SE', back: 'SD: spread of individuals; settles near the true spread with more data. SE: precision of the mean; keeps shrinking with more data.', topic: Descriptive statistics}
- {front: 'Approximate 95% confidence interval', back: '$\bar{x} \pm 2\,\text{SE}$. Small samples need a larger multiplier from the t distribution (2.36 for n = 8).', topic: Descriptive statistics}
- {front: 'What "95% confidence" means', back: 'About 95% of intervals made this way, in repeated studies, would contain the true mean. Not "95% of the data lie inside."', topic: Descriptive statistics}
- {front: 'Reading error bars (independent groups)', back: 'Check the legend first. Overlapping SE bars: not significant. Non-overlapping 95% CIs: significant (p < 0.05). Slightly overlapping CIs can still be significant.', topic: Descriptive statistics}
- {front: 'Choosing a graph', back: 'Groups: dot plot with mean and error bars. Change over time or dose: line graph. Two measured variables: scatter plot. One distribution: histogram or box plot.', topic: Descriptive statistics}
- {front: 'Parts of a box plot', back: 'Box from lower to upper quartile, line at the median, whiskers to the most extreme non-outliers, outliers (beyond 1.5 box-lengths) as points.', topic: Descriptive statistics}
- {front: 'p-value', back: 'The probability, if the null hypothesis is true, of a result at least as extreme as the one observed. Reject $H_0$ when $p \le \alpha$ (usually 0.05).', topic: Hypothesis testing}
- {front: 'What a p-value is NOT', back: 'Not the chance $H_0$ is true; not the size or importance of the effect; p > 0.05 is not proof of no effect.', topic: Hypothesis testing}
- {front: 'Type I vs Type II error', back: 'Type I: rejecting a true $H_0$ (false positive, rate $\alpha$). Type II: failing to reject a false $H_0$ (missing a real effect).', topic: Hypothesis testing}
- {front: 'Chi-square test of independence', back: 'Expected = row total × column total ÷ grand total; $\chi^2 = \sum (O - E)^2/E$; df = (rows − 1)(columns − 1).', topic: Hypothesis testing}
- {front: 't statistic for two means', back: '$t = \dfrac{\bar{x}_1 - \bar{x}_2}{\sqrt{\text{SE}_1^2 + \text{SE}_2^2}}$, df = $n_1 + n_2 - 2$. For moderate samples, $|t| >$ about 2 is significant.', topic: Hypothesis testing}
- {front: 'Which test?', back: 'Counts vs a predicted ratio: chi-square goodness of fit. Two categorical variables: chi-square independence. Two means: t-test. Two measured variables: correlation and regression.', topic: Hypothesis testing}
- {front: 'Correlation coefficient r', back: 'From −1 to 1: sign gives direction, size gives strength of a straight-line relationship. Correlation can come from a confounder, reverse cause or chance.', topic: Hypothesis testing}
- {front: 'Least-squares regression line', back: '$\hat{y} = a + bx$ with $b = \dfrac{\sum (x - \bar{x})(y - \bar{y})}{\sum (x - \bar{x})^2}$ and $a = \bar{y} - b\bar{x}$; $r^2$ = fraction of variation explained. Don''t extrapolate.', topic: Hypothesis testing}
- {front: 'IMRaD', back: 'Introduction (why), Methods (what was done), Results (what was found), Discussion (what it means); after the title and abstract.', topic: Scientific communication}
- {front: 'How to read a paper efficiently', back: 'Abstract, then figures and legends, then discussion, then methods to judge whether the evidence can be trusted.', topic: Scientific communication}
- {front: 'Peer review: what it can and can''t do', back: 'Experts check design, statistics and conclusions before publication. It can''t usually see raw data or detect fraud; replication is the real test.', topic: Scientific communication}
- {front: 'Preprint', back: 'A manuscript posted publicly (bioRxiv, medRxiv) before peer review. Fast and open, but not yet checked: treat as a claim.', topic: Scientific communication}
- {front: 'Evaluating a source: five questions', back: 'Where is it from? Who did it and who paid? What kind of evidence (experiment or observation; cells, mice or people; n)? Does the claim match the data? Do other studies agree?', topic: Scientific communication}
- {front: 'Percent change vs fold change', back: 'Percent change = (new − old)/old × 100%. Fold change = new/old. A fold change of 1.5 is a 50% increase; 0.25 is a 75% decrease.', topic: Scientific communication}
- {front: 'Lab report: results vs discussion', back: 'Results: numbers, units, n, variation and test results, no interpretation. Discussion: whether the hypothesis is supported, comparison with other work, limitations, next steps.', topic: Scientific communication}
- {front: 'Conflict of interest', back: 'A financial or personal stake in a study''s outcome (e.g. a company funding a test of its own product). A reason to look harder and seek independent replication, not to reject outright.', topic: Scientific communication}
- {front: 'Primary source vs review article', back: 'Primary: original research reported by those who did it. Review: a secondary source summarizing many primary studies.', topic: Scientific communication}
