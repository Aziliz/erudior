# Glossary for honors module bio-h3 (Behavior, disease, and conservation)
- term: proximate cause
  aliases: [proximate causes, proximate explanation]
  definition: 'The immediate "how" of a behavior: the stimuli, nerves, hormones and genes that produce it, and how it develops during the animal''s life.'
  topic: Animal behavior
- term: ultimate cause
  aliases: [ultimate causes, ultimate explanation]
  definition: 'The evolutionary "why" of a behavior: how it affects survival and reproduction, and how it arose in the species'' ancestors.'
  topic: Animal behavior
- term: fixed action pattern
  aliases: [fixed action patterns, FAP]
  definition: 'An unlearned sequence of actions that, once triggered by a sign stimulus, usually runs to completion, such as a goose rolling an egg back into her nest.'
  topic: Animal behavior
- term: sign stimulus
  aliases: [sign stimuli]
  definition: 'A specific feature of the environment that triggers a fixed action pattern, such as the red belly that triggers attack in male sticklebacks.'
  topic: Animal behavior
- term: imprinting
  definition: 'Learning that happens only during a limited sensitive period early in life and is hard to reverse, such as goslings bonding with the first moving object they see.'
  topic: Animal behavior
- term: sensitive period
  aliases: [critical period]
  definition: 'The limited window in an animal''s development during which a particular kind of learning, such as imprinting, can take place.'
  topic: Animal behavior
- term: habituation
  definition: 'A simple form of learning in which an animal stops responding to a repeated stimulus that brings neither reward nor harm.'
  topic: Animal behavior
- term: classical conditioning
  definition: 'Learning to link a neutral stimulus with a stimulus that already causes a response, so the neutral stimulus alone comes to cause it (Pavlov''s dogs salivating at a sound).'
  topic: Animal behavior
- term: operant conditioning
  aliases: [trial-and-error learning]
  definition: 'Learning to link one''s own behavior with a reward or punishment, so the behavior becomes more or less frequent.'
  topic: Animal behavior
- term: spatial learning
  definition: 'Learning and remembering the layout of the surroundings, such as landmarks around a nest.'
  topic: Animal behavior
- term: social learning
  aliases: [observational learning]
  definition: 'Learning by watching or interacting with other individuals, such as young chimpanzees learning to fish for termites.'
  topic: Animal behavior
- term: pheromone
  aliases: [pheromones]
  definition: 'A chemical signal released by an animal that affects the behavior or physiology of other members of the same species.'
  topic: Animal behavior
- term: waggle dance
  definition: 'The honeybee forager''s dance on the vertical comb: the angle of the waggle run from straight up gives the food''s direction relative to the sun, and its duration gives the distance.'
  topic: Animal behavior
- term: migration
  aliases: [migrate, migrations]
  definition: 'Regular, usually seasonal, long-distance movement of animals between regions, such as between breeding and wintering grounds.'
  topic: Animal behavior
- term: optimal foraging theory
  aliases: [optimal foraging]
  definition: 'The idea that natural selection favors feeding behavior that maximizes net energy gained per unit time (or another fitness currency), within the animal''s constraints such as predation risk.'
  topic: Animal behavior
- term: altruism
  aliases: [altruistic behavior]
  definition: 'In evolutionary biology, behavior that lowers the actor''s own reproductive success and raises another individual''s.'
  topic: Social behavior
- term: kin selection
  definition: 'Natural selection acting through the reproductive success of relatives, which share some of an individual''s alleles; it explains much altruism toward kin.'
  topic: Social behavior
- term: coefficient of relatedness
  aliases: [relatedness]
  definition: 'The probability $r$ that an allele in one individual is present in another because both inherited it from a common ancestor: $\tfrac12$ for parent and child or full siblings, $\tfrac14$ for half siblings, $\tfrac18$ for first cousins.'
  topic: Social behavior
- term: Hamilton's rule
  aliases: [Hamilton’s rule]
  definition: 'Helping a relative is favored by selection when $rB > C$: relatedness times the benefit to the recipient exceeds the cost to the actor, both measured in offspring.'
  topic: Social behavior
- term: inclusive fitness
  definition: 'An individual''s own reproductive success plus its effect on the reproduction of relatives, weighted by relatedness.'
  topic: Social behavior
- term: eusociality
  aliases: [eusocial]
  definition: 'The most extreme social organization: overlapping generations, cooperative care of young, and a reproductive division of labor with sterile or nonbreeding workers (ants, many bees and wasps, termites, naked mole-rats).'
  topic: Social behavior
- term: haplodiploidy
  aliases: [haplodiploid]
  definition: 'A sex-determination system in which males develop from unfertilized eggs and are haploid, while females are diploid; found in ants, bees and wasps. Full sisters (same mother and father) share $r = \tfrac34$.'
  topic: Social behavior
- term: reciprocal altruism
  definition: 'Helping a non-relative with the expectation of help in return later; it can evolve when individuals meet repeatedly, recognize each other and stop helping cheaters.'
  topic: Social behavior
- term: parental investment
  definition: 'Anything a parent spends on one offspring (eggs, pregnancy, feeding, guarding) that reduces what it can spend on others; the sex that invests more is usually the choosier one.'
  topic: Social behavior
- term: sexual selection
  aliases: [intrasexual selection, intersexual selection]
  definition: 'Selection on traits that increase mating success, through competition within one sex (intrasexual) or mate choice by the other sex (intersexual).'
  topic: Social behavior
- term: epidemiology
  aliases: [epidemiologist, epidemiologists]
  definition: 'The study of how diseases are distributed in populations and what causes them, used to control health problems.'
  topic: Epidemiology
- term: incidence
  aliases: [incidence rate]
  definition: 'The rate of new cases of a disease: new cases divided by the population at risk, per unit time (for example, per 100,000 people per year).'
  topic: Epidemiology
- term: prevalence
  definition: 'The proportion of a population that has a disease at a given time, counting both new and existing cases. In a steady state, prevalence ≈ incidence × average duration.'
  topic: Epidemiology
- term: basic reproduction number
  aliases: [R0]
  definition: 'The average number of people one infected person infects in a fully susceptible population, written $R_0$; in the SIR model $R_0 = \beta/\gamma$.'
  topic: Epidemiology
- term: effective reproduction number
  aliases: [Re, Rt]
  definition: 'The average number of new infections caused by each case at a given time, $R_e = R_0 \times s$ (fraction susceptible) in a well-mixed population. Cases grow when it is above 1 and shrink when it is below 1.'
  topic: Epidemiology
- term: SIR model
  aliases: [SIR]
  definition: 'An epidemic model with susceptible, infectious and removed (recovered or dead) compartments; new infections are $\beta SI/N$ per day and recoveries $\gamma I$ per day.'
  topic: Epidemiology
- term: case definition
  definition: 'Standard criteria (symptoms, test results, time and place) that decide who counts as a case in an outbreak investigation.'
  topic: Epidemiology
- term: epidemic curve
  aliases: [epi curve]
  definition: 'A histogram of the number of cases by date of illness onset; its shape suggests a point source, a continuing source or person-to-person spread.'
  topic: Epidemiology
- term: attack rate
  aliases: [attack rates]
  definition: 'The fraction of a group exposed to a possible cause (such as a food) who became ill during an outbreak.'
  topic: Epidemiology
- term: relative risk
  definition: 'The ratio of the risk (or attack rate) in an exposed group to the risk in an unexposed group; values well above 1 point to the exposure as a cause.'
  topic: Epidemiology
- term: zoonosis
  aliases: [zoonoses, zoonotic disease, zoonotic]
  definition: 'An infectious disease that spreads between animals and people, such as rabies, Lyme disease or avian influenza.'
  topic: Epidemiology
- term: reservoir
  aliases: [reservoir host, reservoirs]
  definition: 'The population of animals (or the environment) in which a pathogen normally lives and multiplies, from which it can spill over into people.'
  topic: Epidemiology
- term: antibiotic stewardship
  definition: 'Coordinated efforts to use antibiotics only when they help, choosing the right drug, dose and duration, to slow the spread of antibiotic resistance.'
  topic: Epidemiology
- term: background extinction rate
  aliases: [background extinction, E/MSY]
  definition: 'The normal rate at which species go extinct outside mass extinctions, roughly 0.1 extinctions per million species-years (E/MSY).'
  topic: Conservation biology
- term: island biogeography
  aliases: [theory of island biogeography, equilibrium theory of island biogeography]
  definition: 'MacArthur and Wilson''s theory that the number of species on an island is an equilibrium between immigration (lower for distant islands) and extinction (higher for small islands).'
  topic: Conservation biology
- term: species-area relationship
  aliases: [species–area relationship, species-area curve]
  definition: 'The pattern that larger areas hold more species, usually described by $S = cA^z$, with $z$ about 0.2–0.35 for islands.'
  topic: Conservation biology
- term: extinction debt
  definition: 'Future extinctions that are already "owed" because habitat has been lost, even though the species still survive for now in remnants too small to support them in the long run.'
  topic: Conservation biology
- term: habitat fragmentation
  aliases: [fragmentation]
  definition: 'The breaking of a continuous habitat into smaller, isolated patches separated by farms, roads or towns.'
  topic: Conservation biology
- term: edge effect
  aliases: [edge effects]
  definition: 'Changed conditions near a habitat boundary (more light, wind, drying, invasive species and nest predators) that make the edge zone unsuitable for interior species.'
  topic: Conservation biology
- term: minimum viable population
  aliases: [MVP, minimum viable population size]
  definition: 'The smallest population with a high chance (for example 95%) of persisting for a set time (for example 100 years) despite demographic, environmental and genetic chance events.'
  topic: Conservation biology
- term: effective population size
  aliases: [Ne]
  definition: 'The size of an ideal population that would lose genetic diversity at the same rate as the real one; usually smaller than the census count. With unequal sexes, $N_e = 4N_mN_f/(N_m + N_f)$.'
  topic: Conservation biology
- term: inbreeding depression
  definition: 'Reduced survival and fertility in the offspring of related parents, mainly because inbreeding makes harmful recessive alleles homozygous.'
  topic: Conservation biology
- term: extinction vortex
  definition: 'The feedback loop in which a small population suffers inbreeding, drift and lost diversity, which lowers survival and reproduction and makes it smaller still.'
  topic: Conservation biology
- term: genetic rescue
  definition: 'Bringing individuals from another population into a small, inbred population to restore genetic diversity and reduce inbreeding depression (for example, Texas pumas released among Florida panthers in 1995).'
  topic: Conservation biology
- term: population viability analysis
  aliases: [PVA]
  definition: 'A model that uses data on survival, reproduction and their variation to simulate a population''s future many times and estimate its risk of extinction under different management options.'
  topic: Conservation biology
- term: biological control
  aliases: [biocontrol]
  definition: 'Controlling a pest or invasive species with one of its natural enemies (a predator, parasite or pathogen); modern programs first test that the enemy will not harm other species.'
  topic: Conservation biology
