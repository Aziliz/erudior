# Module 5 (Inheritance) notecards
- {front: Gene vs allele, back: 'A gene is a unit of inheritance (a stretch of DNA affecting a trait). Alleles are the different versions of one gene, such as P (purple) and p (white).', topic: Mendelian genetics}
- {front: Genotype vs phenotype, back: 'Genotype: the alleles an individual has (PP, Pp, pp). Phenotype: the observable trait (purple or white).', topic: Mendelian genetics}
- {front: Homozygous vs heterozygous, back: 'Homozygous: two identical alleles (PP or pp). Heterozygous: two different alleles (Pp).', topic: Mendelian genetics}
- {front: Dominant vs recessive allele, back: 'A dominant allele shows its effect with one copy (in a heterozygote). A recessive allele shows only when there are two copies. Dominant does not mean common or beneficial.', topic: Mendelian genetics}
- {front: Law of segregation, back: 'The two alleles of a gene separate into different gametes, each gamete getting one, with equal probability. Physical basis: homologous chromosomes separate in anaphase I.', topic: Mendelian genetics}
- {front: 'Aa × Aa: genotype and phenotype ratios', back: 'Genotypes 1 AA : 2 Aa : 1 aa. Phenotypes 3 dominant : 1 recessive.', topic: Mendelian genetics}
- {front: Test cross, back: 'Cross a dominant-phenotype individual of unknown genotype with a homozygous recessive. All dominant offspring suggests AA; any recessive offspring proves Aa (expected 1 : 1).', topic: Mendelian genetics}
- {front: 'Of the dominant-phenotype offspring of Aa × Aa, what fraction are heterozygous?', back: '2/3 (two Aa boxes out of three non-aa boxes).', topic: Mendelian genetics}
- {front: Law of independent assortment, back: 'Alleles of different (unlinked) genes go into gametes independently. Physical basis for genes on different chromosomes: each homologous pair orients at random at metaphase I. Genes close together on one chromosome travel together unless crossing over separates them.', topic: Dihybrid crosses}
- {front: 'AaBb × AaBb phenotype ratio', back: '9 : 3 : 3 : 1 (two dominant : first dominant only : second dominant only : both recessive), out of 16.', topic: Dihybrid crosses}
- {front: Product rule, back: 'For independent events, P(A and B) = P(A) × P(B). Example: P(aabbcc) from AaBbCc × AaBbCc = (1/4)³ = 1/64.', topic: Probability in genetics}
- {front: Sum rule, back: 'For mutually exclusive events, P(A or B) = P(A) + P(B). Example: P(AA or aa) from Aa × Aa = 1/4 + 1/4 = 1/2.', topic: Probability in genetics}
- {front: 'Number of gamete types from n heterozygous unlinked genes', back: '$2^n$. AaBbCc makes 8; homozygous genes add no variety.', topic: Probability in genetics}
- {front: 'Probability that exactly k of n children are affected (probability p each)', back: '$\binom{n}{k}p^k(1-p)^{n-k}$. For two carrier parents and 2 children, exactly one affected = 2 × (1/4)(3/4) = 3/8.', topic: Probability in genetics}
- {front: Incomplete dominance vs codominance, back: 'Incomplete dominance: heterozygote is intermediate (pink from red × white). Codominance: heterozygote shows both traits fully (AB blood, roan cattle).', topic: Codominance}
- {front: 'Incomplete dominance: F1 × F1 ratio', back: '1 : 2 : 1 for both genotypes and phenotypes (red : pink : white), since each genotype has its own phenotype.', topic: Incomplete dominance}
- {front: ABO blood types and genotypes, back: 'A: $I^AI^A$ or $I^Ai$. B: $I^BI^B$ or $I^Bi$. AB: $I^AI^B$. O: $ii$. $I^A$ and $I^B$ are codominant; both dominant to $i$.', topic: Multiple alleles}
- {front: ABO antigens and antibodies, back: 'A: A antigen, anti-B antibodies. B: B antigen, anti-A. AB: both antigens, no antibodies. O: no antigens, both antibodies.', topic: Multiple alleles}
- {front: Polygenic trait, back: 'A trait controlled by many genes with small additive effects (height, skin color); gives continuous, bell-shaped variation.', topic: Polygenic traits}
- {front: Pleiotropy vs epistasis, back: 'Pleiotropy: one gene affects many traits (sickle-cell allele). Epistasis: one gene masks another (ee Labradors are yellow; 9 : 3 : 4).', topic: Polygenic traits}
- {front: Why X-linked recessive traits are more common in males, back: 'Males have one X, so one recessive allele is expressed. Females need two copies.', topic: Sex linkage}
- {front: 'Carrier mother × unaffected father (X-linked recessive)', back: 'Sons: 1/2 affected. Daughters: none affected, 1/2 carriers. Any child: 1/4 is an affected son.', topic: Sex linkage}
- {front: 'Affected father × homozygous normal mother (X-linked recessive)', back: 'All daughters are carriers; no sons are affected (sons get the father''s Y).', topic: Sex linkage}
- {front: Pedigree symbols, back: 'Square = male, circle = female, filled = affected, dot or half-filled = carrier, horizontal line = mating, Roman numerals = generations.', topic: Pedigrees}
- {front: 'Pedigree clues: autosomal recessive vs dominant vs X-linked recessive', back: 'Autosomal recessive: unaffected parents can have an affected child. Autosomal dominant: affected people have an affected parent; affected parents can have an unaffected child. X-linked recessive: mostly males, never father to son.', topic: Pedigrees}
- {front: Nondisjunction in meiosis I vs meiosis II, back: 'Meiosis I: all four gametes abnormal (two n + 1, two n − 1). Meiosis II: two normal, one n + 1, one n − 1.', topic: Chromosomal disorders}
- {front: 'Karyotypes: Down, Turner, Klinefelter', back: 'Down syndrome: 47,+21 (trisomy 21). Turner syndrome: 45,X. Klinefelter syndrome: 47,XXY.', topic: Chromosomal disorders}
- {front: Chromosome structural changes, back: 'Deletion (segment lost), duplication (repeated), inversion (flipped), translocation (moved to a non-homologous chromosome).', topic: Chromosomal disorders}
- {front: Chi-square formula and degrees of freedom, back: '$\chi^2 = \sum \dfrac{(O-E)^2}{E}$ using counts; df = number of categories − 1.', topic: Chi-square test}
- {front: 'Chi-square critical values at p = 0.05', back: 'df 1: 3.84; df 2: 5.99; df 3: 7.81; df 4: 9.49. Below the value: fail to reject. At or above: reject.', topic: Chi-square test}
# Round 2: honors lessons
- {front: Linked genes, back: 'Genes close together on one chromosome; they are inherited together more often than independent assortment predicts, unless a crossover falls between them.', topic: Linkage}
- {front: Parental vs recombinant offspring (test cross), back: 'Parental: allele combinations already on the heterozygote''s chromosomes, the two most common classes. Recombinant: new combinations from crossing over, the two least common classes.', topic: Linkage}
- {front: Recombination frequency, back: 'Recombinant offspring ÷ total offspring × 100%. Example: 450 recombinants of 2500 = 18%.', topic: Linkage}
- {front: Why use heterozygous female fruit flies for mapping, back: 'Male Drosophila have no crossing over in meiosis, so a heterozygous male gives no recombinants.', topic: Linkage}
- {front: Map unit (centimorgan), back: '1 map unit = 1 cM = 1% recombination frequency. Measures crossover frequency, not physical length.', topic: Gene mapping}
- {front: Ordering three genes from pairwise distances, back: 'The largest distance spans the two outer genes; the third gene is in the middle. Short distances roughly add up.', topic: Gene mapping}
- {front: Why recombination frequency stops near 50%, back: 'One crossover affects only 2 of the 4 chromatids, and multiple crossovers between distant genes cancel out, randomizing the alleles as independent assortment would.', topic: Gene mapping}
- {front: 'Three-point cross: finding the middle gene', back: 'Parental classes = most common; double crossovers = rarest. The gene that differs between them is in the middle.', topic: Gene mapping}
- {front: 'Three-point cross: interval distances', back: 'For each interval, (single crossovers in that interval + all double crossovers) ÷ total × 100.', topic: Gene mapping}
- {front: Coefficient of coincidence and interference, back: 'Coefficient of coincidence = observed ÷ expected double crossovers (expected = RF1 × RF2 × total). Interference = 1 − coefficient of coincidence.', topic: Gene mapping}
- {front: Coupling vs repulsion, back: 'Coupling: AB / ab (dominant alleles on one chromosome). Repulsion: Ab / aB. In a test cross the parental (common) classes differ accordingly.', topic: Gene mapping}
- {front: 'Modified dihybrid ratios', back: '9 : 3 : 4 recessive epistasis (mouse albino); 9 : 7 complementary genes (sweet pea); 12 : 3 : 1 dominant epistasis (squash); 15 : 1 duplicate genes (shepherd''s purse).', topic: Epistasis}
- {front: 'Clue that an F2 involves two genes', back: 'Classes come out in sixteenths (9 : 7, 12 : 3 : 1, 15 : 1, 9 : 3 : 4), from a doubly heterozygous F1.', topic: Epistasis}
- {front: Complementation test, back: 'Cross two true-breeding recessive mutants with the same phenotype. Normal F1: mutations in different genes. Mutant F1: same gene.', topic: Epistasis}
- {front: Recessive lethal allele ratio, back: 'Two heterozygotes give 1 : 2 : 1, but the homozygous lethal class dies, leaving 2 : 1 among survivors (yellow mice: 2 yellow : 1 agouti).', topic: Epistasis}
- {front: Number of genes from F2 extremes, back: 'With n equal additive genes, each F2 extreme is (1/4)^n and there are 2n + 1 phenotype classes. 1/64 means 3 genes; 1/256 means 4.', topic: Quantitative genetics}
- {front: Norm of reaction, back: 'The range of phenotypes one genotype produces across environments (cloned yarrow grown at different elevations).', topic: Quantitative genetics}
- {front: Broad- vs narrow-sense heritability, back: '$H^2 = V_G/V_P$ (all genetic variance). $h^2 = V_A/V_P$ (additive variance only); $h^2$ predicts response to selection.', topic: Quantitative genetics}
- {front: "Breeder's equation", back: '$R = h^2 S$. Example: mean 120 cm, selected parents 130 cm, $h^2 = 0.4$: R = 4 cm, offspring mean 124 cm.', topic: Quantitative genetics}
- {front: What heritability does not mean, back: 'Not the share of one person''s trait due to genes; not a sign the trait can''t change; not an explanation of differences between groups. It applies to one population in one environment.', topic: Quantitative genetics}
