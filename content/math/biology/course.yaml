id: science-biology
title: Biology
description: >-
  High school biology for one full credit, written for learners studying on their own: the
  chemistry of life, cells and membranes, photosynthesis and respiration, cell division,
  Mendelian and molecular genetics, biotechnology, evolution and population genetics, the
  diversity of life, human body systems and homeostasis, and ecology. Later lessons reach the
  depth of an honors course, with the math biologists use (probability, Hardy-Weinberg,
  chi-square, population growth).
