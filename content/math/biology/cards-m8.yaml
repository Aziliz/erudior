# ---- m8 The diversity of life
- {front: 'Taxonomic ranks, broadest to narrowest', back: 'Domain, kingdom, phylum, class, order, family, genus, species ("Dear King Philip Came Over For Good Soup").', topic: Classification}
- {front: 'Rules for writing a binomial name', back: 'Genus capitalized, species epithet lowercase, both italicized (or underlined): Homo sapiens. Genus may be abbreviated after first use: E. coli.', topic: Classification}
- {front: 'The three domains', back: 'Bacteria, Archaea, Eukarya (Woese, from ribosomal RNA comparisons). Current evidence suggests eukaryotes arose from within the archaea, closest to the Asgard archaea.', topic: Classification}
- {front: 'Goal of modern classification', back: 'Groups should reflect ancestry: each group contains an ancestor and all its descendants. Classifications change as DNA evidence comes in.', topic: Classification}
- {front: 'Dichotomous key', back: 'A series of paired, mutually exclusive choices about observable features that leads step by step to an identification.', topic: Classification}
- {front: 'Bacteria vs archaea', back: 'Both lack a nucleus. Bacteria: peptidoglycan walls, ester-linked lipids, many pathogens. Archaea: no peptidoglycan, ether-linked lipids, eukaryote-like gene machinery, no known human pathogens.', topic: Bacteria and archaea}
- {front: 'Gram-positive vs Gram-negative', back: 'Gram-positive: thick peptidoglycan wall, stains purple. Gram-negative: thin wall plus outer membrane, stains pink.', topic: Bacteria and archaea}
- {front: 'Exponential growth of bacteria', back: '$N = N_0 \times 2^{n}$, where $n$ = elapsed time $\div$ generation time.', topic: Bacteria and archaea}
- {front: 'Phases of a bacterial growth curve', back: 'Lag, exponential (log), stationary, death.', topic: Bacteria and archaea}
- {front: 'Concentration from a plate count', back: '$\text{CFU/mL} = \dfrac{\text{colonies}}{\text{dilution} \times \text{volume plated}}$; count plates with 30–300 colonies.', topic: Bacteria and archaea}
- {front: 'Lytic vs lysogenic cycle', back: 'Lytic: virus replicates at once and bursts the cell. Lysogenic: viral DNA joins the host chromosome and is copied silently until a trigger switches it to lytic.', topic: Viruses}
- {front: 'Why antibiotics don''t work on viruses', back: 'Viruses have no cell wall, ribosomes or metabolism of their own for antibiotics to target.', topic: Viruses}
- {front: 'Retrovirus (e.g. HIV)', back: 'An RNA virus whose reverse transcriptase copies its RNA into DNA, which integrates into the host genome.', topic: Viruses}
- {front: 'Protist', back: 'Any eukaryote that is not a plant, animal or fungus; not a natural evolutionary group.', topic: Protists}
- {front: 'Three ways protists move', back: 'Pseudopods (amoeba), cilia (Paramecium), flagella (Euglena).', topic: Protists}
- {front: 'Malaria', back: 'Caused by the protist Plasmodium, spread by Anopheles mosquitoes; multiplies in liver and red blood cells.', topic: Protists}
- {front: 'Fungi vs plants', back: 'Fungi: heterotrophs, chitin walls, store glycogen, digest externally and absorb. Plants: photosynthesize, cellulose walls, store starch.', topic: Fungi}
- {front: 'Hypha vs mycelium', back: 'A hypha is one thread-like filament; a mycelium is the whole branching network of hyphae.', topic: Fungi}
- {front: 'Mycorrhiza vs lichen', back: 'Mycorrhiza: fungus + plant roots (minerals for sugar). Lichen: fungus + alga or cyanobacterium.', topic: Fungi}
- {front: 'Four plant groups and their innovations', back: 'Mosses (no vascular tissue), ferns (vascular tissue), gymnosperms (seeds on cones, pollen), angiosperms (flowers and fruit).', topic: Plants}
- {front: 'Alternation of generations', back: 'Haploid gametophyte makes gametes by mitosis; zygote grows into diploid sporophyte, which makes spores by meiosis. Sporophyte dominant in ferns and seed plants.', topic: Plants}
- {front: 'Xylem vs phloem', back: 'Xylem: dead tubes, water and minerals up from roots. Phloem: living sieve tubes, sugars from source to sink (up or down).', topic: Plants}
- {front: 'Cohesion-tension mechanism', back: 'Transpiration pulls water out of leaves; cohesion (hydrogen bonds) transmits the pull down unbroken xylem columns; adhesion helps; roots take in water by osmosis. Powered by the sun.', topic: Plants}
- {front: 'Potometer calculation', back: 'Volume = tube cross-section area × distance bubble moves; rate = volume ÷ time.', topic: Plants}
- {front: 'Flower parts', back: 'Stamen = anther + filament (male). Carpel/pistil = stigma + style + ovary with ovules (female). Ovule → seed; ovary → fruit.', topic: Plants}
- {front: 'Darwin and Went phototropism experiments', back: 'Darwin: the seedling tip senses light. Went: the signal is a chemical that diffuses into agar (auxin), which makes the shaded side elongate.', topic: Plants}
- {front: 'Radial vs bilateral symmetry', back: 'Radial: many planes through a central axis (jellyfish). Bilateral: one plane, left and right halves, front end with cephalization.', topic: Animals}
- {front: 'Four chordate features', back: 'Notochord, dorsal hollow nerve cord, pharyngeal slits, post-anal tail (at some stage).', topic: Animals}
- {front: 'Protostome vs deuterostome', back: 'Protostome: first embryo opening becomes mouth (mollusks, annelids, arthropods). Deuterostome: it becomes the anus (echinoderms, chordates).', topic: Animals}
- {front: 'Endotherm vs ectotherm', back: 'Endotherm: heat from metabolism, constant body temperature, high food cost (birds, mammals). Ectotherm: heat from environment, body temperature tracks surroundings.', topic: Animals}
# ---- m8 honors: plant physiology
- {front: 'Boysen-Jensen''s experiments (1913)', back: 'Gelatin between tip and stump still allowed bending (the signal is a diffusible chemical); mica on the shaded side blocked it (the signal travels down the shaded side).', topic: Plant hormones}
- {front: 'Went''s agar block experiment (1926)', back: 'Agar that held coleoptile tips, set off-center on a cut seedling in the dark, made it bend away from the block; bending grew with the number of tips. The chemical was later identified as auxin (IAA).', topic: Plant hormones}
- {front: 'Cholodny-Went hypothesis', back: 'One-sided light moves auxin laterally to the shaded side (rather than destroying it), so shaded cells elongate more and the shoot bends toward light.', topic: Plant responses}
- {front: 'Polar auxin transport', back: 'Auxin moves one way, tip to base, cell by cell, because auxin-exporting PIN proteins sit at the lower end of each cell; it works even upside down.', topic: Plant hormones}
- {front: 'Acid growth hypothesis', back: 'Auxin → proton pumps → acidified wall → expansins loosen it → turgor stretches the cell.', topic: Plant hormones}
- {front: 'Gravitropism in shoots vs roots', back: 'Auxin collects on the lower side of both. Shoots: it speeds elongation, so they curve up. Roots (more sensitive): it slows elongation, so they curve down.', topic: Plant responses}
- {front: 'Five classic plant hormones and a main effect', back: 'Auxin: elongation, tropisms. Gibberellins: stem growth, germination. Cytokinins: cell division. Abscisic acid: stomatal closing, seed dormancy. Ethylene: ripening, leaf drop.', topic: Plant hormones}
- {front: 'Auxin-to-cytokinin ratio in tissue culture', back: 'High auxin:cytokinin → roots; low → shoots; intermediate → undifferentiated callus (Skoog and Miller).', topic: Plant hormones}
- {front: 'Phytochrome forms', back: 'Pr absorbs red (about 660 nm) and becomes active Pfr; Pfr absorbs far-red (about 730 nm) and returns to Pr. The last flash in a red/far-red series decides the response.', topic: Plant responses}
- {front: 'Short-day vs long-day plants', back: 'Both measure unbroken night. Short-day (long-night) plants flower when night > critical night length; long-day plants when night < theirs. A red flash mid-night breaks the night; far-red after it cancels the break.', topic: Plant responses}
- {front: 'Florigen', back: 'Flowering signal made in leaves, carried in phloem to the shoot tip; identified as the FT protein (2007).', topic: Plant responses}
- {front: 'Pressure to hold up a water column', back: '$\rho g h$: about 0.01 MPa per meter (1.08 MPa for 110 m), plus friction. Suction alone can lift water only about 10.3 m.', topic: Water transport}
- {front: 'Root pressure vs transpiration pull', back: 'Root pressure: a push from ions pumped into xylem, at most a few tenths of a MPa, causes guttation. Transpiration pull: tension from evaporation, lifts water up tall trees.', topic: Water transport}
# ---- m8 honors: microbes
- {front: 'Plaque assay', back: 'Phages spread on a bacterial lawn each make one clear plaque; PFU/mL = plaques ÷ (dilution × volume plated).', topic: Viral replication}
- {front: 'One-step growth curve', back: 'After a short infection and dilution, phage count stays flat during the latent period, then jumps as cells burst. Burst size = phages released ÷ infected cells.', topic: Viral replication}
- {front: 'When temperate phages choose lysogeny', back: 'When many phages infect each cell or hosts are starving (fresh hosts scarce). DNA damage destroys the repressor and induces the lytic cycle.', topic: Viral replication}
- {front: 'Lysogenic conversion', back: 'Prophage genes give the host new traits; cholera, diphtheria and Shiga toxin genes arrive on phages.', topic: Viral replication}
- {front: 'HIV replication cycle', back: 'Bind CD4 + coreceptor and fuse → reverse transcription → integration (provirus) → transcription and translation → budding → maturation by protease.', topic: Viral replication}
- {front: 'Why HIV is controlled but not cured', back: 'Error-prone reverse transcriptase (about 0.3 new mutations per genome copy) makes single drugs fail, so combinations are used; silent provirus in resting cells survives treatment.', topic: Viral replication}
- {front: 'Antigenic drift vs antigenic shift', back: 'Drift: gradual point mutations in surface proteins (yearly vaccine updates). Shift: two strains in one cell swap genome segments, making a new subtype (pandemics).', topic: Viral replication}
- {front: 'Antibiotic targets', back: 'Peptidoglycan wall synthesis (penicillins), 70S ribosomes (tetracyclines, macrolides), DNA gyrase (fluoroquinolones), folate synthesis (sulfonamides).', topic: Antibiotic resistance}
- {front: 'Four resistance mechanisms', back: 'Destroy the drug (beta-lactamase), alter the target (MRSA), pump the drug out (efflux), keep it out (fewer membrane pores).', topic: Antibiotic resistance}
- {front: 'Luria-Delbrück fluctuation test (1943)', back: 'Separate cultures varied wildly in resistant mutants ("jackpots"), samples of one culture did not: mutations arise at random before exposure, and the agent only selects.', topic: Antibiotic resistance}
- {front: 'Conjugation vs transformation vs transduction', back: 'Conjugation: plasmid through a pilus. Transformation: uptake of naked DNA. Transduction: a phage carries bacterial DNA.', topic: Antibiotic resistance}
- {front: 'Why combination therapy works', back: 'Probabilities multiply: with rates $10^{-8}$ and $10^{-6}$, a double mutant arises in 1 cell in $10^{14}$, far more than the $10^{9}$ cells in an infection.', topic: Antibiotic resistance}
- {front: 'Gut microbiome roles', back: 'Ferments fiber to short-chain fatty acids, makes vitamin K, trains the immune system, crowds out pathogens; antibiotics can disrupt it (C. difficile).', topic: Antibiotic resistance}
