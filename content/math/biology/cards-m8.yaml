# ---- m8 The diversity of life
- {front: 'Taxonomic ranks, broadest to narrowest', back: 'Domain, kingdom, phylum, class, order, family, genus, species ("Dear King Philip Came Over For Good Soup").', topic: Classification}
- {front: 'Rules for writing a binomial name', back: 'Genus capitalized, species epithet lowercase, both italicized (or underlined): Homo sapiens. Genus may be abbreviated after first use: E. coli.', topic: Classification}
- {front: 'The three domains', back: 'Bacteria, Archaea, Eukarya (Woese, from ribosomal RNA comparisons). Current evidence suggests eukaryotes arose from within the archaea, closest to the Asgard archaea.', topic: Classification}
- {front: 'Goal of modern classification', back: 'Groups should reflect ancestry: each group contains an ancestor and all its descendants. Classifications change as DNA evidence comes in.', topic: Classification}
- {front: 'Dichotomous key', back: 'A series of paired, mutually exclusive choices about observable features that leads step by step to an identification.', topic: Classification}
- {front: 'Bacteria vs archaea', back: 'Both lack a nucleus. Bacteria: peptidoglycan walls, ester-linked lipids, many pathogens. Archaea: no peptidoglycan, ether-linked lipids, eukaryote-like gene machinery, no known human pathogens.', topic: Bacteria and archaea}
- {front: 'Gram-positive vs Gram-negative', back: 'Gram-positive: thick peptidoglycan wall, stains purple. Gram-negative: thin wall plus outer membrane, stains pink.', topic: Bacteria and archaea}
- {front: 'Exponential growth of bacteria', back: '$N = N_0 \times 2^{n}$, where $n$ = elapsed time $\div$ generation time.', topic: Bacteria and archaea}
- {front: 'Phases of a bacterial growth curve', back: 'Lag, exponential (log), stationary, death.', topic: Bacteria and archaea}
- {front: 'Concentration from a plate count', back: '$\text{CFU/mL} = \dfrac{\text{colonies}}{\text{dilution} \times \text{volume plated}}$; count plates with 30–300 colonies.', topic: Bacteria and archaea}
- {front: 'Lytic vs lysogenic cycle', back: 'Lytic: virus replicates at once and bursts the cell. Lysogenic: viral DNA joins the host chromosome and is copied silently until a trigger switches it to lytic.', topic: Viruses}
- {front: 'Why antibiotics don''t work on viruses', back: 'Viruses have no cell wall, ribosomes or metabolism of their own for antibiotics to target.', topic: Viruses}
- {front: 'Retrovirus (e.g. HIV)', back: 'An RNA virus whose reverse transcriptase copies its RNA into DNA, which integrates into the host genome.', topic: Viruses}
- {front: 'Protist', back: 'Any eukaryote that is not a plant, animal or fungus; not a natural evolutionary group.', topic: Protists}
- {front: 'Three ways protists move', back: 'Pseudopods (amoeba), cilia (Paramecium), flagella (Euglena).', topic: Protists}
- {front: 'Malaria', back: 'Caused by the protist Plasmodium, spread by Anopheles mosquitoes; multiplies in liver and red blood cells.', topic: Protists}
- {front: 'Fungi vs plants', back: 'Fungi: heterotrophs, chitin walls, store glycogen, digest externally and absorb. Plants: photosynthesize, cellulose walls, store starch.', topic: Fungi}
- {front: 'Hypha vs mycelium', back: 'A hypha is one thread-like filament; a mycelium is the whole branching network of hyphae.', topic: Fungi}
- {front: 'Mycorrhiza vs lichen', back: 'Mycorrhiza: fungus + plant roots (minerals for sugar). Lichen: fungus + alga or cyanobacterium.', topic: Fungi}
- {front: 'Four plant groups and their innovations', back: 'Mosses (no vascular tissue), ferns (vascular tissue), gymnosperms (seeds on cones, pollen), angiosperms (flowers and fruit).', topic: Plants}
- {front: 'Alternation of generations', back: 'Haploid gametophyte makes gametes by mitosis; zygote grows into diploid sporophyte, which makes spores by meiosis. Sporophyte dominant in ferns and seed plants.', topic: Plants}
- {front: 'Xylem vs phloem', back: 'Xylem: dead tubes, water and minerals up from roots. Phloem: living sieve tubes, sugars from source to sink (up or down).', topic: Plants}
- {front: 'Cohesion-tension mechanism', back: 'Transpiration pulls water out of leaves; cohesion (hydrogen bonds) transmits the pull down unbroken xylem columns; adhesion helps; roots take in water by osmosis. Powered by the sun.', topic: Plants}
- {front: 'Potometer calculation', back: 'Volume = tube cross-section area × distance bubble moves; rate = volume ÷ time.', topic: Plants}
- {front: 'Flower parts', back: 'Stamen = anther + filament (male). Carpel/pistil = stigma + style + ovary with ovules (female). Ovule → seed; ovary → fruit.', topic: Plants}
- {front: 'Darwin and Went phototropism experiments', back: 'Darwin: the seedling tip senses light. Went: the signal is a chemical that diffuses into agar (auxin), which makes the shaded side elongate.', topic: Plants}
- {front: 'Radial vs bilateral symmetry', back: 'Radial: many planes through a central axis (jellyfish). Bilateral: one plane, left and right halves, front end with cephalization.', topic: Animals}
- {front: 'Four chordate features', back: 'Notochord, dorsal hollow nerve cord, pharyngeal slits, post-anal tail (at some stage).', topic: Animals}
- {front: 'Protostome vs deuterostome', back: 'Protostome: first embryo opening becomes mouth (mollusks, annelids, arthropods). Deuterostome: it becomes the anus (echinoderms, chordates).', topic: Animals}
- {front: 'Endotherm vs ectotherm', back: 'Endotherm: heat from metabolism, constant body temperature, high food cost (birds, mammals). Ectotherm: heat from environment, body temperature tracks surroundings.', topic: Animals}
