- {front: First law of thermodynamics, back: 'Energy is converted from one form to another, never created or destroyed.', topic: Energy}
- {front: Second law of thermodynamics, back: 'Every energy conversion loses some energy as unusable heat, so entropy increases; living things need a constant energy input.', topic: Energy}
- {front: Catabolism vs anabolism, back: 'Catabolism breaks molecules down and releases energy (respiration). Anabolism builds molecules and requires energy (protein synthesis, Calvin cycle).', topic: Energy}
- {front: Exergonic vs endergonic, back: 'Exergonic reactions release free energy and can proceed on their own; endergonic reactions absorb free energy and need an input, usually from ATP.', topic: Energy}
- {front: Structure of ATP, back: 'Adenine + ribose + three phosphate groups (adenosine triphosphate).', topic: ATP}
- {front: ATP hydrolysis, back: 'ATP + H₂O → ADP + Pᵢ + energy (about 30.5 kJ/mol under standard conditions).', topic: ATP}
- {front: Energy coupling, back: 'Using ATP hydrolysis to drive an endergonic process, usually by transferring a phosphate group to another molecule; works if the total energy change is negative.', topic: ATP}
- {front: The ATP cycle, back: 'Catabolism recharges ADP + Pᵢ into ATP; cellular work spends ATP back to ADP. A cell holds little ATP and remakes it constantly.', topic: ATP}
- {front: 'Oxidation vs reduction (OIL RIG)', back: 'Oxidation Is Loss of electrons; Reduction Is Gain. NAD⁺ is reduced to NADH.', topic: ATP}
- {front: Electron carriers, back: 'NADH and FADH₂ carry electrons in respiration; NADPH carries them in photosynthesis.', topic: ATP}
- {front: Photosynthesis equation, back: '6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂', topic: Photosynthesis}
- {front: Autotroph vs heterotroph, back: 'Autotrophs make their own food from inorganic materials (plants, algae). Heterotrophs eat other organisms (animals, fungi).', topic: Photosynthesis}
- {front: 'Source of O₂ in photosynthesis', back: 'Water, split by photosystem II (shown with ¹⁸O by Ruben and Kamen, 1941).', topic: Photosynthesis}
- {front: 'Classic photosynthesis experiments, in order', back: 'Van Helmont (mass not from soil) → Priestley (plants restore air) → Ingenhousz (only in light) → Engelmann (action spectrum) → Ruben and Kamen (O₂ from water) → Calvin (carbon path, ¹⁴C).', topic: Photosynthesis}
- {front: Why leaves are green, back: 'Chlorophyll absorbs mostly blue-violet and red light and reflects green.', topic: Photosynthesis}
- {front: Absorption spectrum vs action spectrum, back: 'Absorption: how much light a pigment absorbs at each wavelength. Action: how fast photosynthesis runs at each wavelength.', topic: Photosynthesis}
- {front: Light-dependent reactions, back: 'Thylakoid membranes. In: light, H₂O, ADP, NADP⁺. Out: O₂, ATP, NADPH.', topic: Photosynthesis}
- {front: Calvin cycle, back: 'Stroma. Rubisco fixes CO₂; ATP and NADPH reduce it to G3P. Per glucose: 6 CO₂, 18 ATP, 12 NADPH.', topic: Photosynthesis}
- {front: Limiting factors of photosynthesis, back: 'Light intensity, CO₂ concentration, temperature; the scarcest one sets the rate.', topic: Photosynthesis}
- {front: Cellular respiration equation, back: 'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy (about 30–32 ATP)', topic: Cellular respiration}
- {front: 'Stages of aerobic respiration, in order', back: 'Glycolysis (cytoplasm) → pyruvate oxidation and Krebs cycle (mitochondrial matrix) → electron transport chain and chemiosmosis (inner membrane).', topic: Cellular respiration}
- {front: Glycolysis yield, back: 'Glucose → 2 pyruvate; net 2 ATP and 2 NADH; no O₂ needed.', topic: Cellular respiration}
- {front: Krebs cycle yield (per glucose), back: 'With pyruvate oxidation: 6 CO₂, 8 NADH, 2 FADH₂, 2 ATP.', topic: Cellular respiration}
- {front: Role of oxygen in respiration, back: 'Final electron acceptor at the end of the electron transport chain; forms water.', topic: Cellular respiration}
- {front: ATP per glucose, back: 'About 30–32 (2.5 per NADH, 1.5 per FADH₂, 4 direct). Older books: 36–38, using 3 and 2.', topic: Cellular respiration}
- {front: Chemiosmosis, back: 'H⁺ pumped across a membrane by an electron transport chain flows back through ATP synthase, which makes ATP. Used in both mitochondria and chloroplasts.', topic: Cellular respiration}
- {front: Purpose of fermentation, back: 'Regenerates NAD⁺ so glycolysis can keep making 2 ATP per glucose without oxygen.', topic: Fermentation}
- {front: Lactic acid vs alcoholic fermentation, back: 'Lactic acid: pyruvate → lactate (muscle, yogurt bacteria). Alcoholic: pyruvate → ethanol + CO₂ (yeast).', topic: Fermentation}
- {front: Aerobic respiration vs fermentation, back: 'Aerobic: needs O₂, about 30 ATP per glucose, CO₂ + H₂O. Fermentation: no O₂, 2 ATP, lactate or ethanol + CO₂.', topic: Fermentation}
- {front: Gibbs free energy equation, back: '$\Delta G = \Delta H - T\Delta S$. Negative $\Delta G$: can proceed on its own; positive: needs an energy input; zero: equilibrium.', topic: Bioenergetics}
- {front: Actual vs standard free energy change, back: '$\Delta G = \Delta G^{\circ\prime} + RT\ln Q$. $RT \approx 2.58$ kJ/mol at 37 °C. Small $Q$ (products scarce) pushes a reaction forward.', topic: Bioenergetics}
- {front: Free energy and the equilibrium constant, back: '$\Delta G^{\circ\prime} = -RT\ln K^{\prime}$. At 25 °C, every 5.7 kJ/mol is a factor of 10 in $K^{\prime}$; $\Delta G^{\circ\prime} = 0$ means $K^{\prime} = 1$.', topic: Bioenergetics}
- {front: ATP hydrolysis in a cell vs standard, back: 'About −30.5 kJ/mol under standard conditions but about −50 kJ/mol in cells, because ATP is kept far above equilibrium relative to ADP and phosphate.', topic: Bioenergetics}
- {front: Coupled reactions (hexokinase), back: 'Glucose + Pᵢ → glucose-6-P: +13.8 kJ/mol. Coupled to ATP hydrolysis (−30.5): −16.7 kJ/mol. Free energies add; equilibrium constants multiply.', topic: Bioenergetics}
- {front: Phosphoryl-transfer scale, back: 'PEP (−61.9) > 1,3-bisphosphoglycerate (−49.3) > phosphocreatine (−43.0) > ATP (−30.5) > glucose-6-P (−13.8) kJ/mol. ATP in the middle can be made from those above and phosphorylate those below.', topic: Bioenergetics}
- {front: Redox free energy equation, back: '$\Delta G^{\circ\prime} = -nF\Delta E^{\circ\prime}$, with $\Delta E^{\circ\prime} = E^{\circ\prime}_{\text{acceptor}} - E^{\circ\prime}_{\text{donor}}$ and $F = 96.5$ kJ/(mol·V).', topic: Bioenergetics}
- {front: Reduction potentials along the respiratory chain, back: 'NAD⁺/NADH −0.32 V; Q/QH₂ +0.05 V; cytochrome c +0.25 V; ½O₂/H₂O +0.82 V. Electrons flow toward more positive values.', topic: Bioenergetics}
- {front: Energy from NADH to oxygen, back: '$\Delta E^{\circ\prime} = 1.14$ V, so $\Delta G^{\circ\prime} = -2 \times 96.5 \times 1.14 \approx -220$ kJ/mol, released in steps along the chain.', topic: Bioenergetics}
- {front: Mitochondrial electron transport chain (order), back: 'NADH → complex I → ubiquinone (Q) → complex III → cytochrome c → complex IV → O₂. Succinate enters at complex II → Q.', topic: Electron transport}
- {front: Protons pumped per pair of electrons, back: 'Complex I: 4, complex III: 4, complex IV: 2, complex II: 0. NADH gives 10 H⁺; succinate (FADH₂) gives 6.', topic: Electron transport}
- {front: Proton-motive force, back: '$\Delta p = \Delta\psi + 61.5 \text{ mV} \times \Delta\text{pH}$ (37 °C). About 200 mV in mitochondria, mostly membrane potential; thylakoids store more as a pH difference.', topic: Chemiosmosis}
- {front: ATP synthase as a rotary motor, back: 'Protons turn the c-ring (F₀) and central stalk; each β subunit of F₁ binds ADP + Pᵢ, makes ATP, releases it (binding-change mechanism). 3 ATP per turn; H⁺ per ATP = c subunits ÷ 3.', topic: Chemiosmosis}
- {front: P/O ratios, back: 'With about 4 H⁺ per ATP (3 through the synthase + 1 for transport): NADH 10 ÷ 4 = 2.5 ATP; FADH₂ 6 ÷ 4 = 1.5 ATP. Approximate, not whole numbers.', topic: Chemiosmosis}
- {front: Thylakoid electron transport chain (order), back: 'H₂O → photosystem II → plastoquinone → cytochrome b₆f → plastocyanin → photosystem I → ferredoxin → FNR → NADPH.', topic: Electron transport}
- {front: Why chloroplasts need cyclic electron flow, back: 'Linear flow gives about 12 H⁺ per 2 NADPH; with 14 c subunits that is about 1.29 ATP per NADPH, short of the 1.5 the Calvin cycle uses. Cyclic flow makes ATP without NADPH.', topic: Electron transport}
- {front: Jagendorf acid-bath experiment (1966), back: 'Thylakoids soaked at pH 4, then moved to pH 8 with ADP + Pᵢ in the dark, made ATP: a proton gradient alone drives ATP synthesis.', topic: Chemiosmosis}
- {front: Oligomycin vs DNP, back: 'Both stop ATP synthesis. Oligomycin blocks ATP synthase, so O₂ use slows (respiratory control). DNP is an uncoupler, so O₂ use speeds up and the energy becomes heat.', topic: Chemiosmosis}
- {front: Calvin cycle carbon bookkeeping (3 turns), back: '3 RuBP (15 C) + 3 CO₂ → 6 3-PGA (18 C) → 6 G3P (6 ATP, 6 NADPH) → 1 G3P out; 5 G3P + 3 ATP → 3 RuBP. Total 9 ATP + 6 NADPH per G3P.', topic: Calvin cycle}
- {front: Light-to-dark transient in the Calvin cycle, back: 'Light off: 3-PGA rises, RuBP falls (no ATP/NADPH for reduction or regeneration). CO₂ cut off: RuBP rises, 3-PGA falls.', topic: Calvin cycle}
- {front: Photorespiration, back: 'Rubisco adds O₂ to RuBP → 3-PGA + 2-phosphoglycolate. Salvage through chloroplast, peroxisome and mitochondrion releases 1 CO₂ per 2 oxygenations and costs ATP. Worse when hot and when stomata close.', topic: Calvin cycle}
- {front: C3 vs C4 vs CAM, back: 'C3: rubisco fixes CO₂ directly. C4: PEP carboxylase fixes CO₂ in mesophyll, rubisco in bundle sheath (separated in space). CAM: PEP carboxylase at night, Calvin cycle by day (separated in time).', topic: Photosynthetic adaptations}
- {front: Cost of C4 photosynthesis, back: 'About 5 ATP + 2 NADPH per CO₂ (2 extra ATP to regenerate PEP) vs 3 ATP + 2 NADPH for C3. Per glucose: 30 vs 18 ATP. Pays off in hot, bright, dry conditions.', topic: Photosynthetic adaptations}
- {front: PEP carboxylase vs rubisco, back: 'PEP carboxylase: fixes HCO₃⁻ onto PEP, no reaction with O₂, used to concentrate CO₂ in C4 and CAM plants. Rubisco: fixes CO₂ onto RuBP, also reacts with O₂.', topic: Photosynthetic adaptations}
- {front: Kranz anatomy, back: 'C4 leaf structure: bundle-sheath cells (rubisco, Calvin cycle) packed around each vein, surrounded by mesophyll cells (PEP carboxylase).', topic: Photosynthetic adaptations}
- {front: Examples of C3, C4 and CAM plants, back: 'C3: wheat, rice, soybeans, trees. C4: corn, sugarcane, sorghum, millets. CAM: cacti, agaves, pineapple, jade plant, many orchids.', topic: Photosynthetic adaptations}
- {front: Water lost per CO₂ fixed (rough figures), back: 'About 500 water molecules per CO₂ for C3, about 250 for C4, about 50 for CAM; varies widely with conditions.', topic: Photosynthetic adaptations}
