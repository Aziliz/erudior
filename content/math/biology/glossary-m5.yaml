# Module 5 (Inheritance) glossary
- term: gene
  aliases: [genes]
  definition: 'A unit of inheritance: a stretch of DNA, at a particular place on a chromosome, that affects one or more traits.'
  topic: Mendelian genetics
- term: allele
  aliases: [alleles]
  definition: 'One of the different versions of a gene, such as the purple and white flower-color alleles in peas. A diploid individual has two alleles of each gene, one from each parent.'
  topic: Mendelian genetics
- term: dominant
  aliases: [dominant allele]
  definition: 'Describes an allele whose effect shows even when only one copy is present (in a heterozygote). Written with a capital letter, e.g. P.'
  topic: Mendelian genetics
- term: recessive
  aliases: [recessive allele]
  definition: 'Describes an allele whose effect shows only when no dominant allele is present (in a homozygote, or in a male for an X-linked gene). Written with a lower-case letter, e.g. p.'
  topic: Mendelian genetics
- term: genotype
  aliases: [genotypes]
  definition: 'The pair of alleles an individual has for a gene (or its alleles for several genes), e.g. PP, Pp or pp.'
  topic: Mendelian genetics
- term: phenotype
  aliases: [phenotypes]
  definition: 'The observable trait an individual shows, such as purple flowers or blood type A; it results from the genotype acting with the environment.'
  topic: Mendelian genetics
- term: homozygous
  aliases: [homozygote]
  definition: 'Having two identical alleles of a gene (PP or pp).'
  topic: Mendelian genetics
- term: heterozygous
  aliases: [heterozygote]
  definition: 'Having two different alleles of a gene (Pp).'
  topic: Mendelian genetics
- term: law of segregation
  definition: 'Mendel''s first law: the two alleles of a gene separate when gametes form, so each gamete gets one allele, each with probability one half. Caused by homologous chromosomes separating in meiosis I.'
  topic: Mendelian genetics
- term: Punnett square
  aliases: [Punnett squares]
  definition: 'A grid that lists one parent''s possible gametes on one side and the other parent''s on the other; each box is an equally likely offspring genotype.'
  topic: Mendelian genetics
- term: test cross
  aliases: [testcross]
  definition: 'Crossing an individual with the dominant phenotype but unknown genotype to a homozygous recessive individual; any recessive offspring show the unknown parent is heterozygous.'
  topic: Mendelian genetics
- term: dihybrid cross
  aliases: [dihybrid crosses]
  definition: 'A cross that follows two genes, typically between parents heterozygous for both (AaBb × AaBb), which gives a 9 : 3 : 3 : 1 phenotype ratio when the genes are unlinked and fully dominant.'
  topic: Dihybrid crosses
- term: law of independent assortment
  definition: 'Mendel''s second law: alleles of different genes go into gametes independently of each other. For genes on different chromosomes the physical basis is the random orientation of each homologous pair at metaphase I; genes far apart on one chromosome also behave independently, but only because crossing over between them is so frequent.'
  topic: Dihybrid crosses
- term: product rule
  definition: 'The probability that independent events all happen is the product of their probabilities: $P(A \text{ and } B) = P(A)\,P(B)$.'
  topic: Probability in genetics
- term: sum rule
  definition: 'The probability that one or another of mutually exclusive events happens is the sum of their probabilities: $P(A \text{ or } B) = P(A) + P(B)$.'
  topic: Probability in genetics
- term: incomplete dominance
  definition: 'A relationship between alleles in which the heterozygote has an intermediate phenotype, such as pink flowers from red × white; the phenotype ratio equals the genotype ratio.'
  topic: Incomplete dominance
- term: codominance
  aliases: [codominant]
  definition: 'A relationship between alleles in which a heterozygote fully shows both alleles'' traits at once, such as AB blood type or roan cattle with both red and white hairs.'
  topic: Codominance
- term: multiple alleles
  definition: 'Three or more alleles of one gene existing in a population (each individual still has only two), such as the ABO blood-group alleles $I^A$, $I^B$ and $i$.'
  topic: Multiple alleles
- term: polygenic trait
  aliases: [polygenic traits, polygenic]
  definition: 'A trait controlled by many genes, each adding a small effect, such as human height or skin color; it varies continuously, often in a bell-shaped distribution.'
  topic: Polygenic traits
- term: pleiotropy
  aliases: [pleiotropic]
  definition: 'One gene affecting several different traits, as the sickle-cell allele affects red cell shape, anemia, pain and malaria resistance.'
  topic: Polygenic traits
- term: epistasis
  aliases: [epistatic]
  definition: 'One gene masking or changing the effect of another gene, as the E gene in Labrador retrievers makes ee dogs yellow whatever their B genotype.'
  topic: Polygenic traits
- term: sex chromosome
  aliases: [sex chromosomes]
  definition: 'A chromosome involved in determining sex: X and Y in humans. Most females are XX and most males XY.'
  topic: Sex linkage
- term: autosome
  aliases: [autosomes, autosomal]
  definition: 'Any chromosome that is not a sex chromosome; humans have 22 pairs.'
  topic: Sex linkage
- term: X-linked
  aliases: [sex-linked, X-linked trait, X-linked gene]
  definition: 'Describes a gene located on the X chromosome (or the trait it controls). Males have one copy, so a recessive X-linked allele always shows in males.'
  topic: Sex linkage
- term: carrier
  aliases: [carriers]
  definition: 'An individual who has one copy of a recessive allele for a trait or condition but does not show it, and can pass the allele to offspring.'
  topic: Sex linkage
- term: pedigree
  aliases: [pedigrees]
  definition: 'A family-tree chart showing relationships and which members have a trait; squares are males, circles females, filled symbols affected individuals.'
  topic: Pedigrees
- term: karyotype
  aliases: [karyotypes]
  definition: 'An organized picture of a cell''s chromosomes arranged in pairs by size, centromere position and banding; a typical human karyotype is 46,XX or 46,XY.'
  topic: Chromosomal disorders
- term: aneuploidy
  aliases: [aneuploid]
  definition: 'Having an abnormal number of one or more chromosomes, such as a trisomy (three copies, e.g. trisomy 21) or a monosomy (one copy, e.g. 45,X).'
  topic: Chromosomal disorders
- term: chi-square test
  aliases: [chi-square, chi-squared test]
  definition: 'A statistical test comparing observed counts with expected counts: $\chi^2 = \sum (O - E)^2/E$, with degrees of freedom = categories − 1. If $\chi^2$ is below the critical value (3.84 for df = 1 at $p = 0.05$), the deviation can be explained by chance.'
  topic: Chi-square test
# Round 2: honors lessons bio-h-linkage and bio-h-gene-interaction
- term: linked genes
  aliases: [linked gene, linkage]
  definition: 'Genes close together on the same chromosome, which tend to be inherited together because a crossover rarely falls between them; they don''t assort independently.'
  topic: Linkage
- term: parental type
  aliases: [parental types, parental class, parental classes]
  definition: 'In a linkage cross, an offspring (or gamete) carrying an allele combination already present on one of the heterozygous parent''s chromosomes. In a test cross the parental classes are the most common.'
  topic: Linkage
- term: recombinant
  aliases: [recombinants, recombinant offspring, recombinant gamete]
  definition: 'An offspring (or gamete) carrying a new combination of linked alleles, produced by crossing over between the genes. In a test cross the recombinant classes are the least common.'
  topic: Linkage
- term: recombination frequency
  aliases: [recombination frequencies, RF]
  definition: 'The fraction of offspring that are recombinant for two genes: recombinants ÷ total × 100%. It ranges from near 0% for tightly linked genes up to about 50% for unlinked or distant genes.'
  topic: Gene mapping
- term: genetic map
  aliases: [genetic maps, linkage map, linkage maps]
  definition: 'A map of the order of genes on a chromosome and the distances between them in map units, built from recombination frequencies. The first was published by Alfred Sturtevant in 1913.'
  topic: Gene mapping
- term: map unit
  aliases: [map units, centimorgan, centimorgans, cM]
  definition: 'The unit of distance on a genetic map: 1 map unit (1 centimorgan, cM) equals a 1% recombination frequency. It measures crossover frequency, not physical length.'
  topic: Gene mapping
- term: coefficient of coincidence
  definition: 'In a three-point cross, the observed number of double crossovers divided by the number expected if crossovers in the two intervals were independent.'
  topic: Gene mapping
- term: crossover interference
  aliases: [interference]
  definition: 'The tendency of one crossover to make another nearby less likely; interference = 1 − coefficient of coincidence.'
  topic: Gene mapping
- term: recessive epistasis
  definition: 'Gene interaction in which two recessive alleles at one gene hide the effect of another gene, giving a 9 : 3 : 4 F2 ratio (cc albino mice, whatever their agouti genotype).'
  topic: Epistasis
- term: dominant epistasis
  definition: 'Gene interaction in which a dominant allele at one gene hides the effect of another gene, giving a 12 : 3 : 1 F2 ratio (W_ summer squash are white).'
  topic: Epistasis
- term: complementary genes
  aliases: [complementary gene, duplicate recessive epistasis]
  definition: 'Two genes that must both have a dominant (working) allele to produce a phenotype, such as two enzymes in one pigment pathway; they give a 9 : 7 F2 ratio.'
  topic: Epistasis
- term: duplicate genes
  aliases: [duplicate gene, duplicate dominant genes]
  definition: 'Two genes with the same function, so a dominant allele at either one is enough for the phenotype; they give a 15 : 1 F2 ratio (shepherd''s purse capsule shape).'
  topic: Epistasis
- term: complementation test
  aliases: [complementation]
  definition: 'Crossing two individuals with the same recessive mutant phenotype: normal offspring mean the mutations are in different genes; mutant offspring mean they are in the same gene.'
  topic: Epistasis
- term: lethal allele
  aliases: [lethal alleles, recessive lethal]
  definition: 'An allele that causes death, often before birth, in individuals with a certain genotype; a recessive lethal gives a 2 : 1 ratio among the surviving offspring of two heterozygotes (yellow mice).'
  topic: Epistasis
- term: quantitative trait
  aliases: [quantitative traits]
  definition: 'A trait measured on a continuous scale, such as height or milk yield, usually influenced by many genes and by the environment.'
  topic: Quantitative genetics
- term: norm of reaction
  aliases: [norms of reaction, reaction norm]
  definition: 'The range of phenotypes that one genotype produces across different environments.'
  topic: Quantitative genetics
- term: heritability
  aliases: [broad-sense heritability]
  definition: 'The fraction of the phenotypic variance of a trait in a population that is due to genetic differences: $H^2 = V_G / V_P$. It describes a population in a particular environment, not individuals.'
  topic: Quantitative genetics
- term: narrow-sense heritability
  definition: 'The fraction of phenotypic variance due to additive genetic effects, $h^2 = V_A / V_P$; it predicts the response to selection.'
  topic: Quantitative genetics
- term: breeder's equation
  definition: 'The prediction of response to selection, $R = h^2 S$, where $S$ is how far the selected parents'' mean is from the population mean and $R$ is how far the offspring mean moves.'
  topic: Quantitative genetics
