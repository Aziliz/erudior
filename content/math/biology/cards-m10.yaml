- {front: 'Biotic vs abiotic factors', back: 'Biotic: living parts of an ecosystem (organisms, dead leaves, dung). Abiotic: nonliving conditions (light, temperature, water, pH, minerals).', topic: Ecosystems}
- {front: 'Producer, consumer, decomposer', back: 'Producers make their own food (photosynthesis or chemosynthesis). Consumers eat other organisms. Decomposers (bacteria, fungi) break down dead matter and return nutrients.', topic: Ecosystems}
- {front: 'Which way do food-chain arrows point?', back: 'From the food to the eater: the direction energy moves (grass → rabbit means the rabbit eats the grass).', topic: Ecosystems}
- {front: 'Food chain vs food web', back: 'A food chain is one feeding path; a food web shows all the interlinked feeding relationships in a community.', topic: Ecosystems}
- {front: 'Net primary productivity', back: 'NPP = GPP − producer respiration: the energy producers store as new biomass, available to consumers.', topic: Energy flow}
- {front: 'Ten percent rule', back: 'About 10% (roughly 1–20%) of the energy at one trophic level reaches the next. Energy at level $n$ above producers $= E_0 \times 0.1^n$.', topic: Energy flow}
- {front: 'Why is so little energy passed up a trophic level?', back: 'Not everything is eaten, not everything eaten is absorbed (feces), and most absorbed energy is used in cellular respiration and lost as heat.', topic: Energy flow}
- {front: 'Energy vs matter in ecosystems', back: 'Energy flows one way (sunlight in, heat out). Matter (carbon, nitrogen, water) cycles and is reused.', topic: Energy flow}
- {front: 'Which ecological pyramid is always upright?', back: 'The pyramid of energy. Pyramids of numbers (one tree, many insects) and biomass (open-ocean plankton) can be inverted.', topic: Energy flow}
- {front: 'Why measure biomass as dry mass?', back: 'Water content varies with weather and time of day, so drying gives a consistent measure of living material.', topic: Energy flow}
- {front: 'Carbon cycle: processes that add vs remove atmospheric CO₂', back: 'Remove: photosynthesis, dissolving in the ocean. Add: cellular respiration, decomposition, combustion of fuels, volcanoes.', topic: Biogeochemical cycles}
- {front: 'Atmospheric CO₂ then and now', back: 'About 280 ppm before 1750; about 424 ppm in 2024, mainly from burning fossil fuels.', topic: Biogeochemical cycles}
- {front: 'Nitrogen cycle in order', back: 'N₂ → (fixation by bacteria) ammonium → (nitrification) nitrite → nitrate → absorbed by plants → animals → (decomposers) ammonium; denitrification returns nitrate to N₂.', topic: Biogeochemical cycles}
- {front: 'Eutrophication', back: 'Excess nutrients (fertilizer runoff) cause algal blooms; decomposers breaking down dead algae use up dissolved oxygen, creating dead zones.', topic: Biogeochemical cycles}
- {front: 'Change in population size', back: '$\Delta N = B - D + I - E$ (births − deaths + immigration − emigration).', topic: Population ecology}
- {front: 'Exponential growth equations', back: 'Continuous: $dN/dt = rN$. Discrete (yearly): $N_t = N_0\lambda^t$. J-shaped curve.', topic: Population ecology}
- {front: 'Logistic growth equation', back: '$dN/dt = rN\dfrac{K-N}{K}$. S-shaped curve; fastest at $N = K/2$; levels off at $K$.', topic: Population ecology}
- {front: 'Density-dependent vs density-independent factors', back: 'Dependent (stronger when crowded): competition, predation, disease, parasites. Independent (same regardless of density): frost, drought, flood, fire.', topic: Population ecology}
- {front: 'Lincoln–Petersen (mark–recapture) estimate', back: '$N = \dfrac{M \times C}{R}$: $M$ marked first, $C$ caught second, $R$ marked in the second catch.', topic: Population ecology}
- {front: 'Mark–recapture assumptions', back: 'Marked animals mix evenly, marks are not lost, marking does not change catchability, and no births, deaths or migration between samples.', topic: Population ecology}
- {front: 'Symbiotic interactions and their signs', back: 'Mutualism +/+, commensalism +/0, parasitism +/−. (Predation is +/−, competition −/−.)', topic: Community ecology}
- {front: 'Competitive exclusion principle', back: 'Two species cannot share the same niche in the same place indefinitely; one wins, or they partition resources (MacArthur''s warblers).', topic: Community ecology}
- {front: 'Keystone species (example)', back: 'A species with an effect far larger than its abundance. Paine removed the sea star Pisaster and species on the shore fell from 15 to 8.', topic: Community ecology}
- {front: 'Primary vs secondary succession', back: 'Primary: starts with no soil (lava, retreating glacier), pioneers are lichens and mosses. Secondary: soil remains (after fire or farming), faster.', topic: Community ecology}
- {front: 'What mainly determines which biome develops?', back: 'Climate: temperature and precipitation.', topic: Biomes}
- {front: 'Tundra vs boreal forest vs desert', back: 'Tundra: very cold, permafrost, no trees. Boreal forest: cold winters, conifers. Desert: under about 25 cm of rain a year.', topic: Biomes}
- {front: 'Simpson''s diversity index', back: '$D = 1 - \dfrac{\sum n(n-1)}{N(N-1)}$. Near 0: one species dominates. Near 1: many evenly represented species.', topic: Biodiversity}
- {front: 'Species richness vs evenness', back: 'Richness: number of species. Evenness: how equally individuals are spread among them. Diversity indexes combine both.', topic: Biodiversity}
- {front: 'Main human threats to biodiversity', back: 'Habitat loss (largest), climate change, invasive species, pollution, overexploitation.', topic: Human impact}
- {front: 'Biomagnification', back: 'A persistent, fat-soluble toxin (such as DDT) becomes more concentrated at each higher trophic level.', topic: Human impact}
- {front: 'Life table columns', back: '$l_x = n_x/n_0$ (survivorship), $d_x = n_x - n_{x+1}$ (deaths), $q_x = d_x/n_x$ (mortality rate), $e_x = T_x/n_x$ (life expectancy).', topic: Life tables}
- {front: '$l_x$ vs $q_x$', back: '$l_x$: fraction of the cohort surviving from birth to age $x$. $q_x$: fraction of those alive at age $x$ that die before $x+1$.', topic: Life tables}
- {front: 'Why can $e_1$ be larger than $e_0$?', back: 'When first-year mortality is high, an individual that survives its first year has escaped that risk and can expect to live longer than a newborn.', topic: Life tables}
- {front: 'Survivorship curve types', back: 'Type I: most die old (humans, large mammals). Type II: constant fraction dies each age, straight line on a log scale (many lizards). Type III: most die young (oysters, most fish).', topic: Life tables}
- {front: 'Net reproductive rate', back: '$R_0 = \sum l_x m_x$, daughters per female per lifetime. $R_0 > 1$: grows; $= 1$: steady; $< 1$: shrinks.', topic: Life tables}
- {front: 'r-selected vs K-selected', back: 'r: early maturity, many small offspring, little care, short life. K: late maturity, few large offspring, much care, long life. A continuum; age-specific mortality explains life histories better.', topic: Population models}
- {front: 'Reznick and Endler guppy experiment', back: 'Guppies moved to a stream where predators eat mainly juveniles evolved later maturity and fewer, larger young in about 11 years: mortality by age shapes life histories.', topic: Population models}
- {front: 'Lotka–Volterra predator–prey equations', back: '$dH/dt = rH - aHP$; $dP/dt = baHP - mP$. Prey steady at $P = r/a$; predators steady at $H = m/(ab)$. Cycles with predator peaks lagging.', topic: Population models}
- {front: 'Kluane hare experiment results', back: 'Averaged over peak and decline: food added 3×, predators excluded 2×, both about 11× hare density. Food and predation interact.', topic: Population models}
- {front: 'When do two competitors coexist (Lotka–Volterra)?', back: 'When each limits itself more than it limits the other: $\alpha_{12} < K_1/K_2$ and $\alpha_{21} < K_2/K_1$. Otherwise one excludes the other.', topic: Population models}
- {front: 'Estimating K from density data', back: 'Plot per capita growth against $N$; fit a line $r(1 - N/K)$. The intercept is $r$, and where the line hits zero is $K$.', topic: Population models}
- {front: 'GPP, NPP, NEP', back: 'NPP = GPP − producer respiration. NEP = NPP − consumer and decomposer respiration. NEP > 0 means the ecosystem stores carbon.', topic: Primary productivity}
- {front: 'Light and dark bottle formulas', back: 'Respiration = initial − dark. Net production = light − initial. GPP = light − dark.', topic: Primary productivity}
- {front: 'Converting O₂ to carbon fixed', back: 'One O₂ released per CO₂ fixed, so mg C = mg O₂ × 12/32 = mg O₂ × 0.375 (approximate).', topic: Primary productivity}
- {front: 'Classic nutrient-limitation experiments', back: 'Lake 226 (1973): phosphorus limits lakes. Ryther and Dunstan (1971): nitrogen limits coastal seas. IronEx II (1995): iron limits parts of the open ocean.', topic: Primary productivity}
- {front: 'Redfield ratio', back: 'C : N : P ≈ 106 : 16 : 1 in ocean plankton. N:P well below 16 suggests N limitation; well above suggests P limitation.', topic: Primary productivity}
- {front: 'Ocean vs land NPP', back: 'About half of global NPP (roughly 105 GtC per year) is in the ocean, though phytoplankton are under 1% of producer biomass: they turn over in days.', topic: Primary productivity}
- {front: 'Nitrogen cycle microbes', back: 'Fixers (nitrogenase, N₂ → NH₄⁺); nitrifiers (NH₄⁺ → NO₂⁻ → NO₃⁻, need O₂); denitrifiers (NO₃⁻ → N₂O → N₂, low O₂); anammox (NH₄⁺ + NO₂⁻ → N₂).', topic: Global change}
- {front: 'Global carbon budget 2023', back: 'Emitted 11.1 GtC (fossil 10.1, land use 1.0). Atmosphere +5.9, ocean 2.9, land 2.3. Airborne fraction about 53%. 2.12 GtC ≈ 1 ppm.', topic: Global change}
- {front: 'Evidence that rising CO₂ comes from fossil fuels', back: 'Falling carbon-13 and carbon-14 fractions in air CO₂, falling atmospheric O₂, and emissions inventories that match the rise.', topic: Global change}
- {front: 'Ice-core CO₂ record', back: 'For 800,000 years CO₂ stayed between about 180 and 300 ppm; today it is about 424 ppm (2024).', topic: Global change}
