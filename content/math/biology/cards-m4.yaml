- {front: Phases of the cell cycle, back: 'Interphase: G1 (growth) → S (DNA replication) → G2 (preparation); then M phase: mitosis and cytokinesis.', topic: Cell cycle}
- {front: Typical human cell cycle (24 h), back: 'G1 about 11 h, S about 8 h, G2 about 4 h, M about 1 h.', topic: Cell cycle}
- {front: Chromosome vs sister chromatid, back: 'After S phase a chromosome has two identical sister chromatids joined at the centromere; it is still one chromosome. Count centromeres to count chromosomes.', topic: Cell cycle}
- {front: 'Stages of mitosis, in order', back: 'Prophase → metaphase → anaphase → telophase (then cytokinesis).', topic: Mitosis}
- {front: Prophase, back: 'Chromosomes condense; spindle forms; nuclear envelope breaks down.', topic: Mitosis}
- {front: Metaphase, back: 'Chromosomes line up at the middle of the cell, attached to spindle fibers from both poles.', topic: Mitosis}
- {front: Anaphase, back: 'Sister chromatids separate and move to opposite poles; chromosome count in the cell briefly doubles.', topic: Mitosis}
- {front: Telophase, back: 'Chromosomes reach the poles; nuclear envelopes re-form; chromosomes uncoil.', topic: Mitosis}
- {front: Cytokinesis in animal vs plant cells, back: 'Animal: cleavage furrow pinches the cell. Plant: a cell plate forms and becomes a new wall.', topic: Mitosis}
- {front: Mitotic index, back: '(cells in mitosis ÷ total cells) × 100%', topic: Mitosis}
- {front: Time in a stage from a snapshot, back: 'Time in stage = (cells in stage ÷ total cells) × length of the cell cycle.', topic: Cell cycle}
- {front: Cell cycle checkpoints, back: 'G1: size, nutrients, growth factors, DNA damage. G2: DNA fully and correctly copied. Spindle (metaphase): all chromosomes attached.', topic: Cell cycle regulation}
- {front: G0, back: 'A non-dividing state outside the cycle (mature nerve and heart muscle cells); cells are active but not dividing.', topic: Cell cycle regulation}
- {front: Cyclins and CDKs, back: 'Cyclin levels rise and fall each cycle; a CDK is active only when bound to its cyclin and then phosphorylates targets to drive the next phase.', topic: Cell cycle regulation}
- {front: Apoptosis, back: 'Programmed cell death that removes damaged or unneeded cells without inflammation.', topic: Cell cycle regulation}
- {front: Proto-oncogene vs tumor suppressor gene, back: 'Proto-oncogene = gas pedal (RAS); overactive mutation → oncogene, one copy enough. Tumor suppressor = brake (p53, RB); usually both copies must be lost.', topic: Cancer}
- {front: p53, back: 'Tumor suppressor that halts the cycle when DNA is damaged and triggers apoptosis if repair fails; mutated in about half of human cancers.', topic: Cancer}
- {front: Benign vs malignant tumor, back: 'Benign stays in place. Malignant invades nearby tissue and can metastasize (spread through blood or lymph).', topic: Cancer}
- {front: Cell number after n doublings, back: 'N = N₀ × 2ⁿ; 10 doublings ≈ ×1,000; 30 doublings ≈ ×1 billion.', topic: Cancer}
- {front: 'Totipotent vs pluripotent vs multipotent', back: 'Totipotent: every cell type including placenta (zygote). Pluripotent: every body cell type (embryonic stem cells, iPSCs). Multipotent: several related types (blood stem cells).', topic: Stem cells}
- {front: Induced pluripotent stem cells, back: 'Body cells reprogrammed by adding four genes to act like embryonic stem cells (Yamanaka: mouse fibroblasts 2006, human skin cells 2007).', topic: Stem cells}
- {front: Diploid vs haploid, back: 'Diploid (2n): two sets of chromosomes, as in body cells (human 46). Haploid (n): one set, as in gametes (human 23).', topic: Meiosis}
- {front: Homologous chromosomes vs sister chromatids, back: 'Homologs: one from each parent, same genes, possibly different versions. Sister chromatids: identical copies made in S phase.', topic: Meiosis}
- {front: Meiosis I vs meiosis II, back: 'Meiosis I separates homologs (2n → n, reduction). Meiosis II separates sister chromatids (like mitosis).', topic: Meiosis}
- {front: Mitosis vs meiosis, back: 'Mitosis: 1 division, 2 identical diploid cells. Meiosis: 2 divisions, 4 genetically different haploid cells; homologs pair and cross over.', topic: Meiosis}
- {front: Three sources of genetic variation in sexual reproduction, back: 'Crossing over (prophase I), independent assortment (metaphase I), random fertilization.', topic: Meiosis}
- {front: Gamete combinations from independent assortment, back: '2ⁿ, where n = number of homologous pairs; humans 2²³ = 8,388,608.', topic: Meiosis}
- {front: Nondisjunction in meiosis I vs II, back: 'Meiosis I: all four gametes abnormal (two n + 1, two n − 1). Meiosis II: two normal, one n + 1, one n − 1.', topic: Meiosis}
- {front: Egg vs sperm production, back: 'Each female meiosis gives one egg plus polar bodies; each male meiosis gives four sperm.', topic: Meiosis}
- {front: 'MPF (maturation-promoting factor)', back: 'Cyclin B bound to CDK1. Found by injecting mature frog egg cytoplasm into immature oocytes (Masui and Markert, 1971); drives cells into M phase.', topic: Cyclins and CDKs}
- {front: Three conditions for an active CDK, back: 'Cyclin bound; activating phosphate added; inhibitory phosphates (added by Wee1) removed by Cdc25.', topic: Cyclins and CDKs}
- {front: Why entry into mitosis is switch-like, back: 'Positive feedback: active cyclin B–CDK1 activates Cdc25 and inhibits Wee1, freeing more CDK1.', topic: Cyclins and CDKs}
- {front: APC/C, back: 'Tags cyclin B and securin with ubiquitin for destruction; freed separase cuts cohesin to start anaphase; held back by unattached kinetochores.', topic: Cyclins and CDKs}
- {front: Mammalian cyclin–CDK pairs, back: 'Cyclin D–CDK4/6 (G1), cyclin E–CDK2 (G1/S), cyclin A–CDK2 (S), cyclin B–CDK1 (G2/M).', topic: Cyclins and CDKs}
- {front: Rb and E2F, back: 'Unphosphorylated Rb holds E2F. Cyclin D–CDK4/6 then cyclin E–CDK2 phosphorylate Rb, freeing E2F to switch on S-phase genes: the restriction point.', topic: Cyclins and CDKs}
- {front: p53 pathway, back: 'MDM2 normally destroys p53. DNA damage (via ATM/ATR) stabilizes p53, which switches on p21 (G1 arrest), repair genes and apoptosis genes such as BAX.', topic: Cyclins and CDKs}
- {front: Intrinsic vs extrinsic apoptosis, back: 'Intrinsic: BAX pores release cytochrome c → apoptosome → caspase 9 (blocked by Bcl-2). Extrinsic: Fas ligand binds Fas death receptor → caspase 8. Both activate caspases 3 and 7.', topic: Apoptosis}
- {front: Apoptosis vs necrosis, back: 'Apoptosis: shrinks, DNA ladder, blebs, eaten by phagocytes, no inflammation. Necrosis: swells and bursts, inflammation.', topic: Apoptosis}
- {front: C. elegans cell death genes, back: '131 of 1,090 somatic cells die. ced-3 = caspase, ced-4 = Apaf-1 relative, ced-9 = Bcl-2 relative (protects).', topic: Apoptosis}
- {front: How proto-oncogenes become oncogenes, back: 'Gain of function: activating point mutation (RAS), amplification (HER2), translocation or fusion (BCR-ABL). Dominant in the cell.', topic: Cyclins and CDKs}
- {front: Two-hit model with a Poisson count, back: 'Carrier tumors ~ Poisson with mean m: P(no tumor) = e^(−m). Knudson: m ≈ 3, so about 95% of carriers get a tumor.', topic: Cyclins and CDKs}
- {front: Flow cytometry DNA content, back: '2C = G1; between 2C and 4C = S; 4C = G2 or M. Fraction of cells in each estimates fraction of cycle time.', topic: Cyclins and CDKs}
- {front: Role of chiasmata, back: 'Crossovers plus arm cohesion tie homologs together so they attach to opposite poles under tension; pairs with no crossover risk nondisjunction.', topic: Nondisjunction}
- {front: Shugoshin, back: 'Protects centromere cohesin at anaphase I so sister chromatids stay together until anaphase II.', topic: Nondisjunction}
- {front: One crossover between two genes, back: 'Involves 2 of the 4 chromatids: 2 recombinant and 2 parental products, so recombinant gametes are at most about 50%.', topic: Genetic variation}
- {front: Telling meiosis I from meiosis II errors, back: 'Markers near the centromere: two different homologs from one parent = meiosis I; two identical copies = meiosis II.', topic: Nondisjunction}
- {front: Origin of trisomy 21, back: 'About 90% maternal (roughly 70% of all cases maternal meiosis I, 20% maternal meiosis II), about 5% paternal, a few percent mitotic (mosaic).', topic: Nondisjunction}
- {front: 47 XYY origin, back: 'Always paternal meiosis II: a YY sperm from sister chromatids that failed to separate.', topic: Nondisjunction}
- {front: Gamete kinds with crossovers, back: '4^c × 2^(n−c) for n pairs each heterozygous for two genes, with c pairs having a crossover between them.', topic: Genetic variation}
- {front: Grandparental share of a gamete, back: 'Number of chromosomes from one grandparent is binomial: P(k) = C(n, k)/2^n; humans average 11.5 of 23.', topic: Genetic variation}
- {front: Autopolyploid vs allopolyploid, back: 'Auto: extra sets from its own species (unreduced gametes, colchicine). Allo: sets from two species, hybrid plus doubling (Karpechenko radish-cabbage, bread wheat 6x = 42).', topic: Genetic variation}
- {front: Why triploids are sterile, back: 'Sets of three cannot split evenly; a balanced gamete needs all sets to go the same way: probability 2 × (1/2)^x (bananas, seedless watermelons, x = 11: about 1/1024).', topic: Genetic variation}
