# Honors module h2 glossary (lessons 45-48)
- term: fertilization
  aliases: [fertilisation]
  definition: 'Fusion of a sperm and an egg into one diploid cell, the zygote; it also blocks entry by other sperm and activates the egg.'
  topic: Embryonic development
- term: zygote
  aliases: [zygotes]
  definition: 'The single diploid cell formed by fertilization; the first cell of a new organism, and totipotent.'
  topic: Embryonic development
- term: acrosome reaction
  definition: 'Release of enzymes from the vesicle at the tip of a sperm when it meets the egg''s outer coat, clearing a path and exposing species-specific binding proteins.'
  topic: Embryonic development
- term: cortical reaction
  definition: 'Calcium-triggered release of cortical granule contents just after fertilization, which forms or modifies the egg''s outer layer so no more sperm can enter (the slow block to polyspermy).'
  topic: Embryonic development
- term: cleavage
  definition: 'The rapid mitotic divisions of the early embryo, without growth, that divide the egg''s cytoplasm into many smaller cells.'
  topic: Embryonic development
- term: blastomere
  aliases: [blastomeres]
  definition: 'One of the cells produced by cleavage of the zygote.'
  topic: Embryonic development
- term: blastula
  aliases: [blastulas, blastulae]
  definition: 'The early embryo at the end of cleavage: a ball of cells surrounding a fluid-filled cavity, the blastocoel.'
  topic: Embryonic development
- term: blastocoel
  definition: 'The fluid-filled cavity inside a blastula (or blastocyst).'
  topic: Embryonic development
- term: midblastula transition
  definition: 'The point in early development (about the 12th cleavage in frogs) when divisions slow and lose synchrony and the embryo begins transcribing its own genes; triggered by the rising ratio of DNA to cytoplasm.'
  topic: Embryonic development
- term: blastocyst
  aliases: [blastocysts]
  definition: 'The mammalian version of the blastula (about day 5 in humans): an outer trophoblast around a cavity, with an inner cell mass on one side.'
  topic: Embryonic development
- term: trophoblast
  definition: 'The outer cell layer of a blastocyst; it forms the embryo''s part of the placenta, not the body.'
  topic: Embryonic development
- term: inner cell mass
  definition: 'The cluster of pluripotent cells inside a blastocyst that develops into the embryo itself; the source of embryonic stem cells.'
  topic: Embryonic development
- term: gastrulation
  definition: 'The period of coordinated cell movements that turns the blastula into an embryo with three germ layers and sets up the body axes.'
  topic: Embryonic development
- term: germ layer
  aliases: [germ layers]
  definition: 'One of the three cell layers formed at gastrulation (ectoderm, mesoderm, endoderm), each giving rise to particular tissues.'
  topic: Embryonic development
- term: ectoderm
  definition: 'The outer germ layer; forms the epidermis, the nervous system, the lens of the eye and the neural crest.'
  topic: Embryonic development
- term: mesoderm
  definition: 'The middle germ layer; forms the notochord, muscle, bone and cartilage, dermis, heart, blood and vessels, kidneys and gonads.'
  topic: Embryonic development
- term: endoderm
  definition: 'The inner germ layer; forms the lining of the gut and its glands, the liver and pancreas, and the lining of the lungs and airways.'
  topic: Embryonic development
- term: archenteron
  definition: 'The primitive gut formed when cells fold inward during gastrulation; its opening is the blastopore.'
  topic: Embryonic development
- term: blastopore
  aliases: [blastopores]
  definition: 'The opening where cells move inside during gastrulation; it becomes the anus in deuterostomes (including vertebrates) and usually the mouth in protostomes.'
  topic: Embryonic development
- term: primitive streak
  definition: 'A groove along the midline of a flat embryonic disc (as in birds and mammals) through which cells move inward to form mesoderm and endoderm; it appears around day 14–15 in humans.'
  topic: Embryonic development
- term: notochord
  definition: 'A stiff rod of mesoderm along the back of a chordate embryo; it signals the ectoderm above it to form the neural plate.'
  topic: Embryonic development
- term: neurulation
  definition: 'Formation of the neural tube: the neural plate''s edges rise into folds that meet and fuse beneath the surface ectoderm.'
  topic: Embryonic development
- term: neural tube
  definition: 'The hollow tube formed by neurulation that becomes the brain and spinal cord; in humans it closes by about day 28 after fertilization.'
  topic: Embryonic development
- term: somite
  aliases: [somites]
  definition: 'One of the paired blocks of mesoderm beside the neural tube; they form the vertebrae, back and limb muscles, and dermis.'
  topic: Embryonic development
- term: neural crest
  definition: 'Cells that break away from the edges of the closing neural tube and migrate widely, forming pigment cells, peripheral neurons and glia, and much of the facial skeleton.'
  topic: Embryonic development
- term: determination
  definition: 'Commitment of a cell to a particular fate before it looks specialized; a determined cell keeps that fate even when transplanted to a new place.'
  topic: Cell differentiation
- term: cytoplasmic determinant
  aliases: [cytoplasmic determinants]
  definition: 'A molecule (often an mRNA or protein) placed unevenly in the egg, so that the cells inheriting it after cleavage take a particular fate.'
  topic: Cell differentiation
- term: induction
  definition: 'In development, a change in the fate of one group of cells caused by signals from a neighboring group.'
  topic: Cell differentiation
- term: competence
  definition: 'The ability of a cell or tissue to respond to an inducing signal, which depends on having the right receptors and transcription factors.'
  topic: Cell differentiation
- term: Spemann–Mangold organizer
  aliases: [organizer, Spemann-Mangold organizer]
  definition: 'The dorsal lip of the amphibian blastopore; grafted to another embryo it induces a second body axis. It works partly by secreting proteins that block BMP signaling.'
  topic: Cell differentiation
- term: morphogen
  aliases: [morphogens]
  definition: 'A substance that spreads from a source to form a concentration gradient; cells adopt different fates depending on whether the local concentration is above or below thresholds.'
  topic: Pattern formation
- term: positional information
  definition: 'Information about where a cell is in the embryo, often read from the concentration of a morphogen, that helps decide its fate.'
  topic: Pattern formation
- term: Bicoid
  definition: 'A fruit fly transcription factor made from maternal mRNA anchored at the front of the egg; its front-to-back gradient specifies head and thorax.'
  topic: Pattern formation
- term: maternal effect gene
  aliases: [maternal effect genes, maternal effect]
  definition: 'A gene whose product the mother puts into the egg, so the embryo''s phenotype depends on the mother''s genotype rather than its own.'
  topic: Pattern formation
- term: Hox genes
  aliases: [Hox gene, Hox]
  definition: 'A family of homeobox-containing genes for transcription factors that give each region along the head-to-tail axis its identity; found in clusters in nearly all animals.'
  topic: Pattern formation
- term: homeotic mutation
  aliases: [homeotic, homeotic mutations, homeotic transformation]
  definition: 'A mutation that makes one body part develop as if it were another, such as legs in place of antennae in Antennapedia flies.'
  topic: Pattern formation
- term: homeobox
  aliases: [homeoboxes]
  definition: 'A 180-base-pair DNA sequence, shared by Hox and many other developmental genes, that codes for a 60-amino-acid DNA-binding region (the homeodomain).'
  topic: Pattern formation
- term: colinearity
  aliases: [collinearity]
  definition: 'The match between the order of Hox genes along the chromosome and the front-to-back order of the body regions where they act.'
  topic: Pattern formation
- term: self-renewal
  definition: 'The ability of a stem cell to divide while keeping at least one daughter as a stem cell, maintaining the stem cell supply.'
  topic: Stem cells
- term: asymmetric division
  aliases: [asymmetric cell division]
  definition: 'A division that produces two different daughters, such as one stem cell and one cell that will differentiate.'
  topic: Stem cells
- term: stem cell niche
  aliases: [stem cell niches]
  definition: 'The microenvironment around stem cells whose signals keep them in the stem state; daughters that leave it begin to differentiate.'
  topic: Stem cells
- term: totipotent
  aliases: [totipotency]
  definition: 'Able to give rise to every cell type, including the placenta and other supporting tissues; true only of the zygote and the earliest blastomeres.'
  topic: Stem cells
- term: multipotent
  aliases: [multipotency]
  definition: 'Able to give rise to several cell types of one family, such as a blood stem cell making all blood cell types.'
  topic: Stem cells
- term: unipotent
  definition: 'Able to give rise to only one cell type, as muscle satellite cells make only skeletal muscle.'
  topic: Stem cells
- term: hematopoietic stem cell
  aliases: [hematopoietic stem cells, blood stem cell, blood stem cells, HSC]
  definition: 'The multipotent stem cell of the bone marrow that produces all blood cell types; first shown to exist by Till and McCulloch''s spleen colony experiments.'
  topic: Stem cells
- term: adult stem cell
  aliases: [adult stem cells, somatic stem cell, tissue stem cell]
  definition: 'A stem cell in a mature tissue (bone marrow, gut lining, skin, muscle) that replaces worn-out cells; usually multipotent or unipotent.'
  topic: Stem cells
- term: embryonic stem cell
  aliases: [embryonic stem cells, ES cell, ES cells, ESC]
  definition: 'A pluripotent cell taken from the inner cell mass of a blastocyst and grown in culture, where it can divide indefinitely.'
  topic: Stem cells
- term: teratoma
  aliases: [teratomas]
  definition: 'A disorganized tumor containing tissues from all three germ layers; forming one in a mouse is a standard test of pluripotency.'
  topic: Stem cells
- term: somatic cell nuclear transfer
  aliases: [SCNT, nuclear transfer]
  definition: 'Putting the nucleus of a body cell into an egg whose own chromosomes were removed, so the egg develops using the donor''s genome; the method used to clone Dolly.'
  topic: Cloning
- term: reprogramming
  definition: 'Resetting a specialized cell''s pattern of gene expression and epigenetic marks to an embryonic-like state, by nuclear transfer or by transcription factors.'
  topic: Cloning
- term: reproductive cloning
  definition: 'Using nuclear transfer to produce a whole organism genetically identical (in nuclear DNA) to the donor.'
  topic: Cloning
- term: therapeutic cloning
  definition: 'Using nuclear transfer only to make an early embryo as a source of embryonic stem cells genetically matched to a patient.'
  topic: Cloning
- term: Yamanaka factors
  aliases: [OSKM]
  definition: 'The four transcription factors Oct4, Sox2, Klf4 and c-Myc, which together reprogram body cells into induced pluripotent stem cells.'
  topic: Stem cells
- term: neoblast
  aliases: [neoblasts]
  definition: 'A dividing adult stem cell of planarian flatworms; at least some are pluripotent and can rebuild a whole worm.'
  topic: Stem cells
- term: dedifferentiation
  definition: 'Loss of a cell''s specialized features so that it can divide and help rebuild tissue, as in salamander limb regeneration.'
  topic: Stem cells
- term: blastema
  aliases: [blastemas]
  definition: 'A bud of dividing, partly dedifferentiated cells that forms at a wound and regrows a lost part, such as a salamander limb.'
  topic: Stem cells
- term: C-value
  aliases: [C value, C-values]
  definition: 'The amount of DNA in one haploid genome, measured in picograms or base pairs (1 pg is about 978 million bp).'
  topic: Genome evolution
- term: C-value paradox
  aliases: [C-value enigma]
  definition: 'The observation that genome size varies enormously among eukaryotes and does not track organismal complexity or gene number, explained mostly by differences in noncoding DNA.'
  topic: Genome evolution
- term: noncoding DNA
  definition: 'DNA that does not code for protein: introns, regulatory sequences, RNA genes, repeats, pseudogenes and transposable-element-derived sequence; about 98–99% of the human genome.'
  topic: Genome evolution
- term: transposable element
  aliases: [transposable elements, transposon, transposons, jumping gene, jumping genes]
  definition: 'A DNA sequence that can move or copy itself to new positions in the genome; discovered by Barbara McClintock in maize.'
  topic: Genome evolution
- term: retrotransposon
  aliases: [retrotransposons]
  definition: 'A transposable element that copies itself through an RNA intermediate and reverse transcriptase ("copy and paste"); LINE-1 and Alu elements are examples.'
  topic: Genome evolution
- term: whole-genome duplication
  aliases: [whole genome duplication, genome duplication]
  definition: 'Doubling of an entire chromosome set at once (polyploidy); two rounds are thought to have occurred early in vertebrate evolution.'
  topic: Genome evolution
- term: gene family
  aliases: [gene families]
  definition: 'A group of genes descended by duplication from one ancestral gene, such as the globin genes.'
  topic: Genome evolution
- term: paralog
  aliases: [paralogs, paralogous]
  definition: 'One of two or more genes related by a duplication event within a lineage, such as human α-globin and β-globin.'
  topic: Genome evolution
- term: ortholog
  aliases: [orthologs, orthologous]
  definition: 'One of two or more genes in different species descended from a single gene in their common ancestor, separated by speciation.'
  topic: Genome evolution
- term: pseudogene
  aliases: [pseudogenes]
  definition: 'A copy of a gene disabled by mutations so it no longer makes a working product; often the fate of a duplicated gene.'
  topic: Genome evolution
- term: neofunctionalization
  definition: 'Evolution of a new function in one copy of a duplicated gene while the other copy keeps the original function.'
  topic: Genome evolution
- term: subfunctionalization
  definition: 'Division of an ancestral gene''s functions between its duplicate copies, for example by expression in different tissues or at different times.'
  topic: Genome evolution
- term: evo-devo
  aliases: [evolutionary developmental biology]
  definition: 'Evolutionary developmental biology: the study of how changes in developmental genes and their regulation produce evolutionary change in form.'
  topic: Evo-devo
- term: deep homology
  definition: 'Shared ancestry of the genes that control the development of structures that are not themselves homologous, such as Pax6 controlling both insect and vertebrate eyes.'
  topic: Evo-devo
- term: cis-regulatory element
  aliases: [cis-regulatory elements, cis-regulatory]
  definition: 'A regulatory DNA sequence, such as an enhancer, on the same DNA molecule as the gene it controls; changes in it can alter where or when a gene is expressed without changing the protein.'
  topic: Evo-devo
