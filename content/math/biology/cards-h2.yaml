# Honors module h2 notecards (lessons 45-48)
- {front: 'Stages of early animal development, in order', back: 'Fertilization → cleavage → blastula (blastocyst in mammals) → gastrulation (three germ layers) → neurulation (neural tube) → organ formation.', topic: Embryonic development}
- {front: Fast block vs slow block to polyspermy (sea urchin), back: 'Fast: membrane voltage jumps positive within seconds (temporary). Slow: calcium wave triggers the cortical reaction, which lifts a fertilization envelope (permanent).', topic: Embryonic development}
- {front: Cleavage, back: 'Rapid divisions without growth (G1 and G2 mostly skipped): cell number doubles each round, cells get smaller, the embryo stays the same size. After n divisions: 2ⁿ cells.', topic: Embryonic development}
- {front: How yolk shapes cleavage, back: 'Little yolk (sea urchin, mammal): complete, equal. Moderate yolk in the lower half (frog): complete but unequal. Huge yolk (chick): partial, only a disc on top divides.', topic: Embryonic development}
- {front: Cell diameter after n cleavages, back: 'Volume ÷ 2ⁿ, so diameter ÷ 2^(n/3): every 3 divisions halve the diameter.', topic: Embryonic development}
- {front: Midblastula transition, back: 'In frogs at about the 12th cleavage (about 4,000 cells): divisions slow and the embryo starts transcribing its own genes. Triggered by the DNA-to-cytoplasm ratio (adding DNA makes it come earlier).', topic: Embryonic development}
- {front: Blastula vs blastocyst, back: 'Blastula: ball of cells around a blastocoel. Blastocyst (mammals): trophoblast (→ placenta) around a cavity plus an inner cell mass (→ the embryo itself).', topic: Embryonic development}
- {front: What each germ layer forms, back: 'Ectoderm: epidermis, nervous system, lens, neural crest. Mesoderm: notochord, muscle, bone, blood, heart, kidneys, gonads. Endoderm: lining of gut and lungs, liver, pancreas.', topic: Embryonic development}
- {front: Gastrulation in sea urchin vs frog vs chick and human, back: 'Sea urchin: vegetal sheet buckles in to form the archenteron. Frog: cells roll in over the dorsal lip of the blastopore. Chick and human: cells move in through the primitive streak of a flat disc.', topic: Embryonic development}
- {front: Neurulation, back: 'Notochord induces the ectoderm above it to form the neural plate; its edges fold up and fuse into the neural tube (brain and spinal cord). Neural crest cells break away and migrate; somites form beside the tube.', topic: Embryonic development}
- {front: Neural tube closure and folic acid, back: 'The human neural tube closes by about day 28 after fertilization, often before pregnancy is known; 400 µg of folic acid daily lowers the risk of spina bifida and anencephaly.', topic: Embryonic development}
- {front: Determination vs differentiation, back: 'Determination: fate fixed (tested by transplant), no visible change yet. Differentiation: the cell actually specializes in structure and function.', topic: Cell differentiation}
- {front: Spemann's early vs late gastrula transplants, back: 'Early gastrula: transplanted tissue follows its new position (not determined). Late gastrula: presumptive neural tissue makes neural tissue anywhere (determined).', topic: Cell differentiation}
- {front: Cytoplasmic determinants vs induction, back: 'Determinants: molecules unevenly placed in the egg and inherited by some cells. Induction: signals from neighboring cells change a group''s fate (responding cells must be competent).', topic: Cell differentiation}
- {front: Spemann–Mangold organizer experiment (1924), back: 'Dorsal lip from a light newt gastrula grafted to the belly side of a dark one: a second body axis formed, its neural tube mostly from dark host cells. The graft induced its neighbors.', topic: Cell differentiation}
- {front: How the organizer makes neural tissue, back: 'It secretes BMP blockers (chordin, noggin). BMP4 tells ectoderm to become epidermis; shielded ectoderm becomes neural.', topic: Cell differentiation}
- {front: Morphogen threshold position, back: 'For C(x) = C₀e^(−x/λ), the boundary at threshold T is x = λ ln(C₀/T). Doubling the dose shifts it by λ ln 2 ≈ 0.69λ.', topic: Pattern formation}
- {front: Evidence that Bicoid is a morphogen, back: 'No maternal Bicoid: no head or thorax. Bicoid mRNA injected elsewhere: head forms there. Extra gene copies: head region enlarges and boundaries shift back.', topic: Pattern formation}
- {front: Maternal effect gene, back: 'The embryo''s phenotype follows the mother''s genotype (she loads the mRNA into the egg). A bcd/bcd female is normal, but all her embryos lack head and thorax.', topic: Pattern formation}
- {front: Fly segmentation cascade, back: 'Maternal genes (bicoid gradient) → gap genes (blocks) → pair-rule genes (7 stripes) → segment polarity genes (14 segments); Hox genes give each segment its identity.', topic: Pattern formation}
- {front: Homeotic mutants, back: 'Antennapedia: legs in place of antennae. Ultrabithorax-region mutations: third thoracic segment becomes a second one, giving four wings.', topic: Pattern formation}
- {front: Key facts about Hox genes, back: 'Homeobox (180 bp) codes for a DNA-binding homeodomain; genes are colinear (chromosome order = body order); flies have 8 in one split cluster, mammals 39 in four clusters.', topic: Pattern formation}
- {front: 'Potency, from most to least', back: 'Totipotent (zygote; also placenta) → pluripotent (inner cell mass, ES cells, iPSCs; whole body) → multipotent (blood stem cells; one family) → unipotent (one cell type).', topic: Stem cells}
- {front: Till and McCulloch (1961), back: 'Irradiated mice given marrow cells grew spleen colonies with several blood cell types; colony number was proportional to cells injected and each colony was a clone: the first proof of blood stem cells.', topic: Stem cells}
- {front: Stem cell frequency from colony counts, back: 'Detected frequency = colonies ÷ cells injected. True frequency = detected ÷ fraction of stem cells that reach the spleen.', topic: Stem cells}
- {front: Embryonic stem cells, back: 'Pluripotent cells from the inner cell mass, grown indefinitely in culture (mouse 1981, human 1998). Tested by teratoma formation. Taking them destroys the embryo.', topic: Stem cells}
- {front: Teratoma test, back: 'Cells injected into an immune-deficient mouse form a tumor with tissues of all three germ layers if they are pluripotent; also shows the tumor risk of leftover undifferentiated cells.', topic: Stem cells}
- {front: Nuclear transfer milestones, back: 'Briggs and King 1952 (frog blastula nuclei), Gurdon 1962 (tadpole intestine nuclei), Dolly 1996 (adult sheep udder cell). Success falls as donor cells become more specialized.', topic: Cloning}
- {front: Dolly by the numbers, back: '277 eggs fused with udder cells → 29 embryos transferred → 1 lamb (about 0.36% per fused egg). Low success reflects incomplete epigenetic reprogramming.', topic: Cloning}
- {front: Reproductive vs therapeutic cloning, back: 'Reproductive: nuclear transfer embryo grown into a whole organism. Therapeutic: nuclear transfer embryo used only to derive patient-matched embryonic stem cells.', topic: Cloning}
- {front: Yamanaka factors, back: 'Oct4, Sox2, Klf4, c-Myc. Found (2006) by starting with 24 candidates and removing one at a time; together they reprogram fibroblasts into iPSCs.', topic: Stem cells}
- {front: Planarian regeneration, back: 'Driven by neoblasts, dividing adult stem cells; a single transplanted neoblast can rebuild all tissues of an irradiated worm, so some neoblasts are pluripotent.', topic: Stem cells}
- {front: Salamander limb regeneration, back: 'Wound cells dedifferentiate into a blastema that regrows the limb; it needs nerves, and its cells mostly keep a memory of their origin (cartilage → cartilage).', topic: Stem cells}
- {front: Empirical vs value claims in stem cell ethics, back: 'Empirical: testable with evidence (e.g. iPSCs can form tumors). Value: about what we ought to do (e.g. embryo research should stop at day 14).', topic: Stem cells}
- {front: C-value paradox, back: 'Genome size varies over 10,000-fold among eukaryotes (onion about 5× human, a fern about 50×) while gene number varies only a few-fold; the difference is mostly noncoding DNA.', topic: Genome evolution}
- {front: Gene density, back: 'Genes ÷ genome size. E. coli about 935 per Mb (about 88% coding); human about 6.5 per Mb (about 1–1.5% coding).', topic: Genome evolution}
- {front: Human genome composition (approx.), back: 'About 1.5% protein-coding, about 45% derived from transposable elements, introns a quarter or more; about 10% appears conserved by selection.', topic: Genome evolution}
- {front: DNA transposons vs retrotransposons, back: 'DNA transposons: cut and paste with transposase. Retrotransposons: copy and paste through RNA and reverse transcriptase (LINE-1 about 17%, Alu about 10% of the human genome).', topic: Genome evolution}
- {front: How genes get duplicated, back: 'Unequal crossing over, retrotransposition of an mRNA (intron-less copy), and whole-genome duplication (two rounds early in vertebrates: 1 Hox cluster in lancelets, 4 in mammals).', topic: Genome evolution}
- {front: Paralogs vs orthologs, back: 'Paralogs: related by duplication within a lineage (human α- and β-globin). Orthologs: separated by speciation (human and mouse β-globin).', topic: Genome evolution}
- {front: Fates of a duplicated gene, back: 'Pseudogene (most common: disabled and decays), neofunctionalization (one copy gains a new job), subfunctionalization (copies split the old jobs).', topic: Genome evolution}
- {front: Pax6 and deep homology, back: 'Mouse Pax6 switched on in fly legs makes extra fly compound eyes: the same ancestral control gene directs non-homologous eyes.', topic: Evo-devo}
- {front: Stickleback pelvic loss, back: 'Lake sticklebacks lost a pelvic enhancer of Pitx1 in independent populations; the protein and its other jobs (jaw, pituitary) are intact. Restoring the enhancer restores the pelvis.', topic: Evo-devo}
- {front: Why form often evolves by cis-regulatory change, back: 'Toolkit genes have many jobs; changing the protein affects all of them, while changing one tissue-specific enhancer changes only one. In a hybrid, a cis change affects only its own allele.', topic: Evo-devo}
