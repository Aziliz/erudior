- id: bio-q-0701
  lesson: bio-evidence
  module_quiz: true
  topic: Evidence for evolution
  stem: A bone sample contains 1/16 of the carbon-14 found in living tissue. The half-life of carbon-14 is 5,730 years. About how old is the bone?
  choices:
  - 91,680 years
  - 22,920 years
  - 45,840 years
  - 11,460 years
  answer: 1
  explanation: '$\tfrac{1}{16} = \left(\tfrac12\right)^4$, so 4 half-lives have passed: $4 \times 5{,}730 = 22{,}920$ years. 91,680 multiplies by 16 instead of using 4 half-lives; 45,840 uses 8 half-lives (taking 1/16 as 16 ÷ 2); 11,460 is 2 half-lives.'
- id: bio-q-0702
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Why can't carbon-14 be used to date a 70-million-year-old dinosaur fossil?
  choices:
  - Dinosaurs did not contain carbon.
  - After so many half-lives, essentially no carbon-14 would be left to measure.
  - Carbon-14 decays faster in older rocks.
  - Carbon-14 is only found in volcanic rock.
  answer: 1
  explanation: 70 million years is over 12,000 half-lives of carbon-14, so the amount left would be immeasurably small; carbon-14 works to about 50,000 years. Dinosaur fossils are dated with long-lived isotopes in nearby volcanic layers. Decay rates don't depend on the age of the rock.
- id: bio-q-0703
  lesson: bio-evidence
  module_quiz: true
  topic: Evidence for evolution
  stem: The forelimbs of a human, a bat, a whale and a cat have the same set of bones arranged in the same pattern, though they are used for different tasks. These are
  choices:
  - analogous structures, evidence of a common ancestor
  - homologous structures, evidence of a common ancestor
  - vestigial structures with no function
  - analogous structures that evolved separately
  answer: 1
  explanation: 'Same underlying structure, different jobs: that is homology, explained by inheritance from a shared ancestor. Analogous structures do similar jobs with different structures. These limbs are fully functional, so they are not vestigial.'
- id: bio-q-0704
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: A bird's wing and a butterfly's wing both allow flight, but one is a modified forelimb with bones and the other is a thin outgrowth of the body wall. What are they an example of?
  choices:
  - Analogous structures produced by convergent evolution
  - Homologous structures inherited from a winged ancestor
  - Vestigial structures
  - Transitional fossils
  answer: 0
  explanation: Similar function but different structure and origin means analogous. The common ancestor of birds and insects had no wings; flight evolved separately in each line.
- id: bio-q-0705
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Some whales have small hip bones embedded in their bodies, not attached to any legs. What is the best description?
  choices:
  - Vestigial structures inherited from four-legged ancestors
  - Analogous structures
  - Structures that the whale grew because it needed them
  - Evidence that whales are fish
  answer: 0
  explanation: Reduced remnants of structures that were functional in ancestors are vestigial. Fossil whales show a series from four-legged land mammals to fully aquatic forms, consistent with these bones being leftovers.
- id: bio-q-0706
  lesson: bio-evidence
  module_quiz: true
  topic: Evidence for evolution
  stem: Before 2004, fish fossils were known from rocks about 385 million years old and four-legged animals from rocks about 365 million years old. Where were researchers most likely to find a fish–tetrapod transitional fossil?
  choices:
  - In deep-ocean rocks about 500 million years old
  - In any rock younger than 300 million years
  - In shallow freshwater rocks about 375 million years old
  - In rocks older than 400 million years
  answer: 2
  explanation: A transition should lie between the ages of the two groups and in the environment where early tetrapods lived. That prediction led to Tiktaalik, found in about 375-million-year-old rocks on Ellesmere Island. Rocks much older or younger would be the wrong time.
- id: bio-q-0707
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Cytochrome c differs from the human version by 0 amino acids in chimpanzees, 13 in chickens and 21 in tuna. Which conclusion do these data support?
  choices:
  - Tuna evolved from chickens.
  - Humans share a more recent common ancestor with chickens than with tuna.
  - Chimpanzees and humans are the same species.
  - Cytochrome c has not changed since the first cells.
  answer: 1
  explanation: Fewer differences mean less time since two lines split. Chickens differ by fewer amino acids than tuna, so the human–chicken split is more recent. Identical cytochrome c doesn't make two species the same (they differ in many other genes), and no living species evolved from another living species.
- id: bio-q-0708
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Species on the Galápagos Islands most closely resemble species from which place?
  choices:
  - Islands with a similar climate on the other side of the world
  - The nearby South American mainland
  - Africa
  - Europe, where Darwin lived
  answer: 1
  explanation: Biogeography shows island species resemble those on the nearest mainland, the source of their ancestors, not species in similar climates far away. That pattern makes sense if species descend from colonists.
- id: bio-q-0709
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: A volcanic ash layer contains 1/4 of its original potassium-40 (half-life 1.25 billion years). A fossil lies in the rock layer directly below the ash. What can be said about the fossil's age?
  choices:
  - It is at least 2.5 billion years old.
  - It is at most 2.5 billion years old.
  - It is exactly 1.25 billion years old.
  - It is about 5 billion years old.
  answer: 0
  explanation: '1/4 remaining means 2 half-lives: $2 \times 1.25 = 2.5$ billion years. Lower layers are older, so the fossil is at least that old. 1.25 billion is one half-life (1/2 remaining); 5 billion uses 4 half-lives.'
- id: bio-q-0710
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Which statement about humans and chimpanzees is accurate?
  choices:
  - Humans evolved from modern chimpanzees.
  - They share a common ancestor that lived roughly 6 to 8 million years ago.
  - Chimpanzees evolved from humans.
  - They have no ancestors in common.
  answer: 1
  explanation: Both are living species that descend from a shared ancestor; neither evolved from the other. Both lines have been evolving for the same length of time since the split.
- id: bio-q-0711
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Why is the near-universal genetic code considered evidence for evolution?
  choices:
  - It shows that all organisms have the same genes.
  - It proves that the code can never change.
  - It is most simply explained if all life inherited the code from a common ancestor.
  - It shows that bacteria evolved from humans.
  answer: 2
  explanation: Many different codes would work chemically, yet almost all life uses the same one, which points to a single origin. Organisms share the code, not all their genes, and minor variant codes do exist.
- id: bio-q-0712
  lesson: bio-natural-selection
  module_quiz: true
  topic: Natural selection
  stem: Which set of conditions is enough for natural selection to change a population?
  choices:
  - Variation in a trait, inheritance of that trait, and differences in reproductive success linked to it
  - A changing environment and individuals that try to adapt
  - A large population with no variation
  - Variation caused only by the environment, such as muscles built by exercise
  answer: 0
  explanation: Selection needs heritable variation that affects survival or reproduction. Effort doesn't change genes, a population with no variation has nothing to select, and traits acquired during life (like gym muscles) aren't inherited.
- id: bio-q-0713
  lesson: bio-natural-selection
  topic: Natural selection
  stem: In evolutionary terms, which individual has the highest fitness?
  choices:
  - A small, weak bird that raises 8 offspring that survive to breed
  - A large, strong bird that lives 15 years but raises 2 offspring
  - The fastest bird, which raises no offspring
  - A bird that lives longest without breeding
  answer: 0
  explanation: 'Fitness is reproductive success relative to others: the number of offspring contributed to the next generation. Size, strength, speed and lifespan matter only if they lead to more offspring.'
- id: bio-q-0714
  lesson: bio-natural-selection
  module_quiz: true
  topic: Natural selection
  stem: In the Lederbergs' replica-plating experiment, colonies that grew on antibiotic plates were traced back to the original plate, which had never been exposed to the antibiotic. Those original colonies were already resistant. What does this show?
  choices:
  - The antibiotic caused the resistance mutations.
  - Bacteria become resistant because they need to survive.
  - Resistance is not inherited.
  - Resistance mutations arose randomly before exposure; the antibiotic selected them.
  answer: 3
  explanation: The original colonies were resistant without ever meeting the antibiotic, so the mutations came first and the antibiotic only revealed and favored them. Mutation is random with respect to need.
- id: bio-q-0715
  lesson: bio-natural-selection
  module_quiz: true
  topic: Natural selection
  stem: A moth population has 500 light and 500 dark moths. On sooty bark, 30% of light moths and 60% of dark moths survive. What percent of the survivors are dark?
  choices:
  - About 66.7%
  - 50%
  - 60%
  - 90%
  answer: 0
  explanation: 'Survivors: light $500 \times 0.30 = 150$, dark $500 \times 0.60 = 300$. Dark fraction $= 300/450 \approx 66.7\%$. 50% is the starting share; 60% is the dark survival rate, not the share of survivors; 90% adds the two rates.'
- id: bio-q-0716
  lesson: bio-natural-selection
  topic: Natural selection
  stem: During the 1977 drought on Daphne Major, mostly large, hard seeds remained. Medium ground finch survivors had deeper beaks than those that died. What happened to the next generation?
  choices:
  - Its average beak depth was unchanged, because selection acts only on individuals.
  - Its average beak depth was larger, because beak depth is heritable.
  - Its beaks were smaller, because birds ate less.
  - Every bird developed a deeper beak by cracking hard seeds.
  answer: 1
  explanation: Deeper-beaked birds survived and bred, and beak depth is inherited, so the average in the offspring generation rose. Individual birds didn't change their beaks by use; the population's makeup changed.
- id: bio-q-0717
  lesson: bio-natural-selection
  topic: Adaptation
  stem: Human birth weight historically had the highest survival near the average, with lower survival for very small and very large babies. What type of selection is this?
  choices:
  - Directional selection
  - Disruptive selection
  - Stabilizing selection
  - Artificial selection
  answer: 2
  explanation: 'Favoring the middle and removing both extremes is stabilizing selection: the average stays and the spread narrows. Directional selection would shift the average; disruptive would favor both extremes.'
- id: bio-q-0718
  lesson: bio-natural-selection
  topic: Adaptation
  stem: In a finch population, birds with small bills eat soft seeds well and birds with large bills crack hard seeds well, but intermediate bills do neither well. Over time, what pattern of selection is expected?
  choices:
  - Disruptive selection, favoring both extremes
  - Stabilizing selection, favoring intermediate bills
  - Directional selection toward small bills
  - No selection, because all bills are used
  answer: 0
  explanation: When both extremes do better than the middle, selection is disruptive and can split the distribution into two peaks, as in the black-bellied seedcracker.
- id: bio-q-0719
  lesson: bio-natural-selection
  topic: Adaptation
  stem: Cabbage, broccoli, kale and Brussels sprouts were all bred from one species of wild cabbage. This is an example of
  choices:
  - natural selection
  - genetic drift
  - artificial selection
  - convergent evolution
  answer: 2
  explanation: 'People chose which plants to breed for leaves, buds, flowers or stems: artificial selection. In natural selection, the environment does the choosing through survival and reproduction.'
- id: bio-q-0720
  lesson: bio-natural-selection
  topic: Adaptation
  stem: Lamarck proposed that giraffes got long necks by stretching to reach leaves and passing the longer necks to their young. Why is this rejected?
  choices:
  - Changes acquired during an animal's life are not written into its DNA, so they are not inherited.
  - Giraffes do not eat leaves.
  - Neck length is not variable in giraffes.
  - Natural selection cannot act on body size.
  answer: 0
  explanation: Stretching doesn't change the genes in eggs or sperm. The accepted explanation is that giraffes with heritably longer necks left more offspring.
- id: bio-q-0721
  lesson: bio-natural-selection
  topic: Natural selection
  stem: Which statement about natural selection is correct?
  choices:
  - Individuals evolve during their lifetimes to fit the environment.
  - Selection produces the mutations a population needs.
  - Selection plans ahead for future environments.
  - Individuals are selected, but populations evolve.
  answer: 3
  explanation: Selection acts on individuals (who survives and reproduces), and the result is a change in the population over generations. It has no foresight and doesn't create mutations; it sorts existing variation.
- id: bio-q-0722
  lesson: bio-population-genetics
  module_quiz: true
  topic: Hardy-Weinberg
  stem: In a population in Hardy-Weinberg equilibrium, 9% of individuals show a recessive trait. What is the frequency of heterozygous carriers?
  choices:
  - '0.09'
  - '0.21'
  - '0.42'
  - '0.49'
  answer: 2
  explanation: '$q^2 = 0.09$, so $q = 0.3$ and $p = 0.7$. Carriers: $2pq = 2(0.7)(0.3) = 0.42$. 0.09 is $q^2$ itself; 0.21 forgets the 2; 0.49 is $p^2$.'
- id: bio-q-0723
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  stem: A population of 500 has 180 AA, 240 Aa and 80 aa individuals. What is the frequency of allele A?
  choices:
  - '0.36'
  - '0.48'
  - '0.4'
  - '0.6'
  answer: 3
  explanation: 'Gene copies: $2 \times 500 = 1{,}000$. Copies of A: $2(180) + 240 = 600$. $p = 600/1000 = 0.6$. 0.36 is the AA genotype frequency; 0.48 is the Aa frequency; 0.4 is $q$.'
- id: bio-q-0724
  lesson: bio-population-genetics
  module_quiz: true
  topic: Hardy-Weinberg
  stem: A recessive disorder affects 1 in 10,000 people. Assuming Hardy-Weinberg equilibrium, about what fraction of people are carriers?
  choices:
  - About 1 in 100
  - About 1 in 5,000
  - About 1 in 50
  - About 1 in 10,000
  answer: 2
  explanation: $q^2 = 1/10{,}000$, so $q = 1/100 = 0.01$ and $p = 0.99$. $2pq = 2(0.99)(0.01) \approx 0.02$, about 1 in 50. 1 in 100 is $q$, not $2pq$. Carriers are far more common than affected people.
- id: bio-q-0725
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  stem: Which is NOT one of the conditions for Hardy-Weinberg equilibrium?
  choices:
  - No natural selection
  - Random mating
  - The dominant allele must be more common than the recessive allele.
  - A very large population
  answer: 2
  explanation: The conditions are no mutation, no gene flow, a very large population (no drift), random mating and no selection. Allele frequencies can be anything; equilibrium says they stay constant, not that dominant alleles are common.
- id: bio-q-0726
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  stem: With $p = 0.6$ and $q = 0.4$, a population of 1,000 is expected to have 480 heterozygotes under Hardy-Weinberg. A survey finds only 200. Which explanation best fits this shortage?
  choices:
  - Inbreeding or self-fertilization (nonrandom mating)
  - Random mating in a very large population
  - Gene flow that adds heterozygotes
  - A counting method that only finds homozygotes for A
  answer: 0
  explanation: Too few heterozygotes and too many homozygotes is the signature of mating with relatives or self-fertilization. Random mating in a large population is the equilibrium case and would give about 480.
- id: bio-q-0727
  lesson: bio-population-genetics
  module_quiz: true
  topic: Mechanisms of evolution
  stem: Northern elephant seals were hunted to a few dozen animals in the 1890s. Today there are over 200,000, but they have very little genetic variation. What explains the low variation?
  choices:
  - Gene flow from other seal species
  - Stabilizing selection on body size
  - The bottleneck effect
  - A high mutation rate
  answer: 2
  explanation: 'The few survivors carried only a small, random sample of the original alleles, and the population regrew from them: a bottleneck, a form of genetic drift. Gene flow and mutation would add variation, not remove it.'
- id: bio-q-0728
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  stem: A rare recessive form of dwarfism is much more common among the Old Order Amish of Lancaster County than in the general population. The best explanation is
  choices:
  - the founder effect
  - natural selection favoring the allele
  - gene flow into the community
  - a high mutation rate in the community
  answer: 0
  explanation: 'The community descends from a small number of founders, at least one of whom happened to carry the allele, so it became more common by chance: the founder effect. Nothing suggests the allele is favored.'
- id: bio-q-0729
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  stem: Why does genetic drift have a much larger effect in small populations than in large ones?
  choices:
  - Chance deviations from expected numbers are proportionally larger in small samples.
  - Small populations have higher mutation rates.
  - Natural selection is stronger in small populations.
  - Large populations have no random events.
  answer: 0
  explanation: 'Like coin flips: 10 tosses can easily give 70% heads, but 10,000 tosses will be very close to 50%. Each generation is a sample of the parents'' alleles, and small samples wander more.'
- id: bio-q-0730
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  stem: Pollen carried by wind from one population of pines to another, distant population is an example of
  choices:
  - genetic drift
  - gene flow
  - mutation
  - the founder effect
  answer: 1
  explanation: Moving alleles between populations (through migrating individuals or their gametes) is gene flow. It tends to make populations more alike.
- id: bio-q-0731
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  stem: Which mechanism of evolution consistently makes a population better adapted to its environment?
  choices:
  - Genetic drift
  - Gene flow
  - Natural selection
  - Mutation
  answer: 2
  explanation: Only selection favors alleles because they improve survival and reproduction. Drift is random, gene flow depends on who migrates, and mutation is random with respect to need, though it supplies the raw variation.
- id: bio-q-0732
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  stem: Polydactyly (extra fingers) is caused by a dominant allele, yet it is rare. How can this be?
  choices:
  - Dominant alleles always become more common, so it must not really be dominant.
  - Dominance describes how an allele shows up in heterozygotes, not how common it is.
  - The allele is recessive in most people.
  - Hardy-Weinberg does not apply to humans.
  answer: 1
  explanation: An allele can be dominant and still have a low frequency $p$. Hardy and Weinberg showed that dominant alleles do not automatically spread; frequencies stay constant unless something like selection or drift changes them.
- id: bio-q-0733
  lesson: bio-speciation
  module_quiz: true
  topic: Speciation
  stem: Horses and donkeys can mate and produce mules, but mules are almost always sterile. Under the biological species concept, horses and donkeys are
  choices:
  - the same species, because they can mate
  - separate species, isolated by mechanical isolation
  - separate species, isolated by hybrid sterility
  - the same species, because mules are healthy
  answer: 2
  explanation: The test is fertile offspring. Mules are sterile, a postzygotic barrier, so horses and donkeys are separate species. Mating can happen, so it is not mechanical isolation.
- id: bio-q-0734
  lesson: bio-speciation
  topic: Speciation
  stem: Two species of frogs live in the same ponds; one breeds in early spring and the other in early summer. What kind of barrier keeps them apart?
  choices:
  - Habitat isolation (prezygotic)
  - Hybrid inviability (postzygotic)
  - Gametic isolation (prezygotic)
  - Temporal isolation (prezygotic)
  answer: 3
  explanation: Breeding at different times is temporal isolation, which acts before fertilization. They share a habitat, so it isn't habitat isolation, and no hybrids form, so postzygotic barriers don't come into play.
- id: bio-q-0735
  lesson: bio-speciation
  topic: Speciation
  stem: Sea urchins of two species release eggs and sperm into the same water, but sperm of one species can't bind to the other species' eggs. This is
  choices:
  - behavioral isolation
  - hybrid sterility
  - temporal isolation
  - gametic isolation
  answer: 3
  explanation: 'Egg-surface proteins bind only sperm of the same species, so fertilization fails: gametic isolation, a prezygotic barrier. Behavior and timing are not the issue here.'
- id: bio-q-0736
  lesson: bio-speciation
  module_quiz: true
  topic: Speciation
  stem: When the Isthmus of Panama formed about 3 million years ago, populations of snapping shrimp were split into Caribbean and Pacific groups that have since become separate species. This is an example of
  choices:
  - sympatric speciation by polyploidy
  - gene flow
  - convergent evolution
  - allopatric speciation
  answer: 3
  explanation: A geographic barrier split the populations and stopped gene flow; each side then evolved separately. That is allopatric speciation. Sympatric speciation happens without geographic separation.
- id: bio-q-0737
  lesson: bio-speciation
  topic: Speciation
  stem: An error in cell division doubles a plant's chromosome number. The new plant can't produce fertile offspring with its parent species but can reproduce with itself or other plants like it. What has happened?
  choices:
  - Allopatric speciation
  - Sympatric speciation by polyploidy
  - A bottleneck
  - Directional selection
  answer: 1
  explanation: The polyploid is reproductively isolated from its parents in a single generation, in the same place. This is a common route to new plant species, with no geographic barrier needed.
- id: bio-q-0738
  lesson: bio-speciation
  topic: Speciation
  stem: Why is the biological species concept hard to apply to bacteria?
  choices:
  - Bacteria have no DNA.
  - Bacteria never evolve.
  - Bacteria reproduce asexually, so interbreeding can't be the test.
  - Bacteria all belong to one species.
  answer: 2
  explanation: The concept is defined by interbreeding. Organisms that reproduce asexually, and fossils, are grouped instead by shared features or DNA sequences.
- id: bio-q-0739
  lesson: bio-speciation
  module_quiz: true
  topic: Phylogeny
  stem: On a phylogenetic tree, how do you tell which of two species is more closely related to a third?
  choices:
  - Choose the species printed next to it at the tips.
  - Find which pair shares the most recent common ancestor (the node closest to the tips).
  - Choose the species that looks most similar.
  - Count how many tips separate them on the page.
  answer: 1
  explanation: Relatedness is about the most recent shared ancestor. Tip order can change by rotating branches around nodes without changing the tree, and similar appearance can come from convergent evolution.
- id: bio-q-0740
  lesson: bio-speciation
  topic: Phylogeny
  stem: Using the vertebrate tree from the lesson (lamprey, shark, trout, frog, lizard, human), which group is a clade?
  choices:
  - Shark and frog
  - Frog, lizard and human
  - Trout and lizard
  - Lamprey, frog and human
  answer: 1
  explanation: A clade is an ancestor and all its descendants. Frog, lizard and human are all the descendants of the four-limbed ancestor. The other groups each leave out some descendants of their common ancestor.
- id: bio-q-0741
  lesson: bio-speciation
  topic: Phylogeny
  stem: In a character table, which trait would help show which two of these three animals (frog, lizard and human) are most closely related?
  choices:
  - An amniotic egg, present in lizards and humans but not frogs
  - A backbone, which all three have
  - Four limbs, which all three have
  - Body size, which varies within each group
  answer: 0
  explanation: A shared derived trait groups the species that inherited it from a common ancestor. The amniotic egg is shared by lizards and humans, marking them as a clade (the amniotes) that excludes frogs. A backbone and four limbs are shared by all three, so they can't separate them, and body size varies too much and can evolve repeatedly. A trait found in only one of the three, like hair in humans, marks that line but can't show which two are closest.
- id: bio-q-0742
  lesson: bio-speciation
  topic: Phylogeny
  stem: A student says the lamprey, which branches off first on a vertebrate tree, is "less evolved" than humans. What is wrong with this?
  choices:
  - Lampreys are actually the ancestors of humans.
  - Lampreys appeared after humans.
  - Nothing; early branches are less evolved.
  - The lamprey's lineage has been evolving for exactly as long as ours since the two split.
  answer: 3
  explanation: All living groups at the tips have had the same amount of time to evolve since their common ancestor. Living lampreys are not our ancestors; ancestors sit at the nodes, not the tips.
- id: bio-q-0743
  lesson: bio-speciation
  topic: Speciation
  stem: About 15 to 18 species of Galápagos finches, with beaks suited to seeds, insects or cactus, descend from one ancestral species. This pattern is called
  choices:
  - a bottleneck
  - stabilizing selection
  - an adaptive radiation
  - gene flow
  answer: 2
  explanation: One ancestor diversifying into many species, each adapted to a different way of life, is an adaptive radiation.
- id: bio-q-0755
  lesson: bio-speciation
  topic: Phylogeny
  stem: Genome studies of the Asgard archaea have changed how biologists picture the base of the tree of life. What do most recent analyses suggest?
  choices:
  - Eukaryotes descend from bacteria, and archaea branched off from eukaryotes later.
  - Archaea are eukaryotes that lost their nucleus.
  - Viruses form a fourth domain at the root of the tree.
  - Eukaryotes arose from within the archaea, from an archaeal cell that took in a bacterium.
  answer: 3
  explanation: Asgard archaea carry many genes once thought unique to eukaryotes, and most analyses place eukaryotes on a branch growing out of the archaea, with the mitochondrion coming from an engulfed bacterium. Archaea have no nucleus and never did, archaea are not descended from eukaryotes, and viruses are not cells, so they are not placed in any domain.
- id: bio-q-0744
  lesson: bio-history-life
  module_quiz: true
  topic: Geologic time
  stem: If Earth's 4.54 billion years were compressed into 24 hours, about when would the Cambrian explosion (539 million years ago) occur?
  choices:
  - About 3 a.m.
  - About noon
  - About 11:59 p.m.
  - About 9 p.m.
  answer: 3
  explanation: The time elapsed before the Cambrian is $4{,}540 - 539 = 4{,}001$ million years, and $24 \times 4001/4540 \approx 21.2$ hours, about 9 p.m. 3 a.m. comes from using 539/4540 of the day from midnight instead of time remaining.
- id: bio-q-0745
  lesson: bio-history-life
  topic: History of life
  stem: In the Miller–Urey experiment, electric sparks passed through a mixture of gases and water produced amino acids. What did this show?
  choices:
  - Life arose from sparks in a single week.
  - The first cells contained DNA.
  - Oxygen was necessary for life to begin.
  - Some building blocks of life can form from simple chemicals without living things.
  answer: 3
  explanation: The experiment made molecules, not cells, so it shows only that life's building blocks can form without life. Early Earth had almost no free oxygen; the experiment used no oxygen gas.
- id: bio-q-0746
  lesson: bio-history-life
  topic: History of life
  stem: Why is the ability of RNA to act as a catalyst important for ideas about the origin of life?
  choices:
  - It proves that proteins came before nucleic acids.
  - RNA can store information and speed up reactions, so early life may have used RNA for both before DNA and proteins.
  - It shows that DNA is unnecessary in modern cells.
  - It means RNA can make energy from sunlight.
  answer: 1
  explanation: The RNA world hypothesis rests on RNA doing both jobs (as rRNA still does when forming peptide bonds). It doesn't make DNA unnecessary today, and it suggests nucleic acids, not proteins, came first.
- id: bio-q-0747
  lesson: bio-history-life
  module_quiz: true
  topic: History of life
  stem: 'Put these events in order from oldest to most recent: (1) Great Oxidation Event, (2) first eukaryotes, (3) earliest widely accepted fossils of prokaryotes, (4) Cambrian explosion.'
  choices:
  - 1, 3, 2, 4
  - 3, 2, 1, 4
  - 2, 3, 1, 4
  - 3, 1, 2, 4
  answer: 3
  explanation: Prokaryote fossils about 3.5 billion years ago; oxygen buildup about 2.4 billion; eukaryotes about 2 billion; Cambrian explosion about 539 million years ago.
- id: bio-q-0748
  lesson: bio-history-life
  topic: History of life
  stem: Which observation supports the endosymbiotic origin of mitochondria?
  choices:
  - Mitochondria are found only in plant cells.
  - Mitochondria are made by the Golgi apparatus.
  - Mitochondria contain no ribosomes.
  - Mitochondria have their own circular DNA and divide by splitting, like bacteria.
  answer: 3
  explanation: Their own circular DNA, bacterial-type ribosomes and division by splitting all point to descent from engulfed bacteria. Mitochondria are found in nearly all eukaryotes, including animals.
- id: bio-q-0749
  lesson: bio-history-life
  topic: Geologic time
  stem: Which mass extinction was the largest, wiping out by most estimates 80 to 90 percent or more of marine species?
  choices:
  - End-Permian, about 252 million years ago
  - End-Cretaceous, about 66 million years ago
  - End-Ordovician, about 445 million years ago
  - End-Triassic, about 201 million years ago
  answer: 0
  explanation: The end-Permian extinction, linked to massive volcanic eruptions in Siberia, was the worst. The end-Cretaceous, which ended the non-bird dinosaurs, is the best known but was smaller.
- id: bio-q-0750
  lesson: bio-history-life
  module_quiz: true
  topic: Geologic time
  stem: A thin clay layer rich in iridium is found worldwide at the boundary between rocks of the Cretaceous and the following period. What does it most strongly support?
  choices:
  - A large asteroid impact about 66 million years ago
  - A slow decline in sea level over millions of years
  - The first appearance of flowering plants
  - A global ice age 252 million years ago
  answer: 0
  explanation: Iridium is rare in Earth's crust but common in asteroids. A worldwide layer at that boundary, plus the Chicxulub crater of the right age, points to an impact. The 252-million-year date belongs to the end-Permian.
- id: bio-q-0751
  lesson: bio-history-life
  topic: Geologic time
  stem: 'Layers in a cliff, bottom to top: sandstone with trilobites, volcanic ash dated at 300 million years, shale with dinosaur bones. What can be said about the trilobite fossils?'
  choices:
  - They are younger than 300 million years.
  - They are older than 300 million years.
  - They are exactly 300 million years old.
  - They are younger than the dinosaurs.
  answer: 1
  explanation: By superposition, lower layers are older, so the trilobites predate the ash, and the dinosaurs postdate it. A fossil's age is usually a range bracketed by dated layers.
- id: bio-q-0752
  lesson: bio-history-life
  topic: History of life
  stem: After the end-Cretaceous extinction, mammals diversified rapidly into many new forms, including whales, bats and grazers. This is best described as
  choices:
  - a mass extinction of mammals
  - a population bottleneck in dinosaurs
  - stabilizing selection on mammal size
  - an adaptive radiation into roles left empty
  answer: 3
  explanation: Extinctions open ecological roles; surviving groups then diversify to fill them. Mammals had been mostly small for over 100 million years before this radiation.
- id: bio-q-0753
  lesson: bio-history-life
  topic: History of life
  stem: Fossils of a snail lineage show almost no change for 3 million years, then a fairly quick shift (over tens of thousands of years) to a new form that stays stable again. Which model does this pattern match?
  choices:
  - Gradualism
  - Hardy-Weinberg equilibrium
  - Punctuated equilibrium
  - Endosymbiosis
  answer: 2
  explanation: Long stability broken by relatively rapid change is punctuated equilibrium (Eldredge and Gould, 1972). Gradualism predicts slow, steady change throughout.
- id: bio-q-0754
  lesson: bio-history-life
  topic: History of life
  stem: Why did oxygen-releasing photosynthesis by cyanobacteria matter so much for later life?
  choices:
  - It removed all carbon dioxide from the atmosphere.
  - It produced the first amino acids.
  - It caused the end-Cretaceous extinction.
  - The oxygen it built up made aerobic respiration possible, which yields much more ATP.
  answer: 3
  explanation: Oxygen accumulated from about 2.4 billion years ago. Aerobic respiration gives about 30 ATP per glucose versus 2 from fermentation, which supports larger, more active organisms.
- id: bio-q-0756
  lesson: bio-evidence
  module_quiz: true
  topic: Evidence for evolution
  type: label
  stem: The picture shows the bones of a human arm, from shoulder (top) to fingertips. Name the numbered parts. The same parts appear in a cat's foreleg, a whale's flipper and a bat's wing.
  image: {src: images/m7-arm-bones.svg, alt: 'The bones of a human arm drawn from the shoulder at the top down to the fingertips, with five numbered markers from top to bottom.'}
  labels:
  - {x: 50, y: 16.2, text: Upper arm bone (humerus)}
  - {x: 47.3, y: 39.1, text: Forearm bones (radius and ulna)}
  - {x: 50, y: 51.7, text: Wrist bones (carpals)}
  - {x: 49.7, y: 63.1, text: Palm bones (metacarpals)}
  - {x: 49.2, y: 73.8, text: Finger bones (phalanges)}
  explanation: 'From the shoulder down: one upper-arm bone, two forearm bones side by side, a cluster of small wrist bones, the palm bones, then the finger bones. A cat, whale and bat have the same parts in the same order, only resized and reshaped, which is why these forelimbs are homologous.'
- id: bio-q-0757
  lesson: bio-evidence
  topic: Evidence for evolution
  type: text
  stem: Body parts that share the same underlying structure because they were inherited from a common ancestor, even if they now do different jobs, are called ___ structures.
  accept: [homologous, homologous structure, homologous structures]
  explanation: 'Homologous structures, such as the human arm and the bat wing, share a parts list inherited from a common ancestor. Structures that do the same job but are built differently are analogous.'
- id: bio-q-0758
  lesson: bio-evidence
  topic: Evidence for evolution
  type: match
  stem: Sort each pair or structure into the kind of evidence it shows.
  pairs:
  - [A bat's wing and a whale's flipper, Homologous]
  - [A bird's wing and a butterfly's wing, Analogous]
  - [Tiny hip bones inside some whales, Vestigial]
  - [A human arm and a cat's foreleg, Homologous]
  - [The human tailbone, Vestigial]
  explanation: 'Bat wings, whale flippers, human arms and cat forelegs share the same bones from a common ancestor: homologous. Bird and butterfly wings do the same job but are built differently and evolved separately: analogous. Whale hip bones and the human tailbone are reduced remnants of structures that were larger in ancestors: vestigial.'
- id: bio-q-0759
  lesson: bio-evidence
  topic: Evidence for evolution
  stem: Which observations are evidence that the organisms involved share a common ancestor? Select all that apply.
  choices:
  - Human arms and bat wings have the same set of bones in the same order.
  - Humans and monkeys carry the same broken vitamin C gene, with some of the same disabling mutations.
  - Birds and butterflies both have wings that they use to fly.
  - Nearly all organisms use the same genetic code.
  answer: [0, 1, 3]
  explanation: 'Shared bone patterns, a shared broken gene and a shared genetic code are all most simply explained by inheritance from a common ancestor. Bird and butterfly wings are analogous: they evolved separately, so they show similar selection pressures, not shared ancestry.'
- id: bio-q-0760
  lesson: bio-evidence
  topic: Evidence for evolution
  type: text
  stem: A piece of wood has 1/32 as much carbon-14 as living wood. ___ half-lives of carbon-14 have passed since the tree died.
  accept: [5, five]
  explanation: '$\tfrac{1}{32} = \left(\tfrac12\right)^5$, so 5 half-lives have passed, about $5 \times 5{,}730 = 28{,}650$ years.'
- id: bio-q-0761
  lesson: bio-natural-selection
  module_quiz: true
  topic: Natural selection
  type: order
  stem: Put the steps of the Lederbergs' replica-plating experiment in order.
  items:
  - Grow many colonies on a master plate with no antibiotic.
  - Press a velvet pad onto the master plate to pick up cells from every colony.
  - Press the same pad onto a plate that contains the antibiotic.
  - Note the positions of the few colonies that grow on the antibiotic plate.
  - Test colonies from the same positions on the master plate for resistance.
  explanation: 'The pad copies the pattern of colonies onto the antibiotic plate, so the colonies that grow there can be matched to colonies on the master plate. Those master-plate colonies turn out to be resistant even though they never met the antibiotic: the mutations came first and the antibiotic only selected them.'
- id: bio-q-0762
  lesson: bio-natural-selection
  topic: Natural selection
  type: text
  stem: In evolutionary biology, an individual's reproductive success compared with others in its population is called its ___.
  accept: [fitness, biological fitness, evolutionary fitness, Darwinian fitness, reproductive fitness]
  explanation: 'Fitness is measured by offspring contributed to the next generation, not by strength, speed or how long the individual lives.'
- id: bio-q-0763
  lesson: bio-natural-selection
  topic: Adaptation
  type: match
  stem: Match each example to the kind of selection it shows.
  pairs:
  - ['In a drought, finches with deeper beaks survive better and the average beak deepens.', Directional selection]
  - [Babies of average birth weight historically survived best., Stabilizing selection]
  - [Seedcrackers with small or large bills do well and those with medium bills do poorly., Disruptive selection]
  - [Farmers bred kale and broccoli from wild cabbage., Artificial selection]
  distractors: [Genetic drift]
  explanation: 'Directional selection moves the average toward one extreme (deeper beaks). Stabilizing selection favors the middle (average birth weight). Disruptive selection favors both extremes over the middle (small and large bills). Artificial selection is breeding chosen by people. None of these is genetic drift, which is change by chance.'
- id: bio-q-0764
  lesson: bio-natural-selection
  topic: Natural selection
  stem: The figure shows the Lederbergs' replica-plating experiment. Which conclusions does it support? Select all that apply.
  image: {src: images/m7-replica-plating.svg, alt: 'Replica plating: a master plate without antibiotic, a velvet pad, and an antibiotic plate where only two colonies grow; the matching positions are circled on both plates.'}
  choices:
  - Some cells were resistant before they ever met the antibiotic.
  - The antibiotic selected resistant cells that were already present.
  - The antibiotic caused the mutations that made cells resistant.
  - Resistance appeared only after the cells were exposed to the antibiotic.
  answer: [0, 1]
  explanation: 'The colonies at the circled positions on the master plate were resistant although they had never touched the antibiotic, so the resistance mutations arose first, by chance. The antibiotic only revealed and favored them; it did not cause them.'
- id: bio-q-0765
  lesson: bio-natural-selection
  topic: Natural selection
  type: text
  stem: A moth population has 300 light and 200 dark moths. On sooty bark, 50% of light moths and 80% of dark moths survive. To the nearest whole percent, ___% of the survivors are dark.
  accept: [52]
  explanation: 'Light survivors: $300 \times 0.50 = 150$. Dark survivors: $200 \times 0.80 = 160$. Dark share: $\dfrac{160}{150 + 160} = \dfrac{160}{310} \approx 0.516$, about 52%, up from 40% before selection.'
- id: bio-q-0766
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  type: text
  stem: In a population in Hardy-Weinberg equilibrium, the frequency of allele a is $q = 0.3$. The expected frequency of heterozygotes ($2pq$), as a decimal, is ___.
  accept: [0.42, '.42']
  explanation: '$p = 1 - 0.3 = 0.7$, so $2pq = 2(0.7)(0.3) = 0.42$.'
- id: bio-q-0767
  lesson: bio-population-genetics
  module_quiz: true
  topic: Mechanisms of evolution
  type: match
  stem: Match each mechanism of evolution to an example of it.
  pairs:
  - [Gene flow, Wind carries pollen from one pine population to another.]
  - [Genetic drift, By chance a few individuals happen to leave most of the offspring in a small population.]
  - [Mutation, A copying error in DNA creates a new allele.]
  - [Natural selection, Insects with a resistance allele survive spraying and leave more offspring.]
  - [Nonrandom mating, Self-pollinating plants produce more homozygotes than expected.]
  explanation: 'Gene flow moves alleles between populations; drift changes frequencies by chance; mutation creates new alleles; selection changes frequencies because genotypes differ in survival and reproduction; nonrandom mating (here self-fertilization) changes genotype frequencies, raising homozygotes.'
- id: bio-q-0768
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  stem: The figure shows the bottleneck effect with colored marbles standing for alleles. Which statements about a bottleneck are correct? Select all that apply.
  image: {src: images/m7-bottleneck-founder.svg, alt: 'Colored marbles show the bottleneck effect, where a few survivors regrow a population with fewer colors, and the founder effect, where a few founders start an island population with different color proportions.'}
  choices:
  - The survivors are a random sample of the original alleles.
  - The recovered population can lack alleles that the original population had.
  - The alleles that pass through the bottleneck are always the best-adapted ones.
  - Once the population regrows to its old size, its lost alleles return.
  answer: [0, 1]
  explanation: 'A bottleneck is a form of genetic drift: which alleles survive is a matter of chance, not fitness, so some alleles are lost. Regrowing the population does not bring them back; only mutation or gene flow can, which is why northern elephant seals still have very little variation.'
- id: bio-q-0769
  lesson: bio-population-genetics
  topic: Hardy-Weinberg
  type: order
  stem: Put the steps for checking whether a population is in Hardy-Weinberg equilibrium at one gene in order.
  items:
  - Count the individuals of each genotype.
  - Calculate the allele frequencies p and q from the counts.
  - Calculate the expected genotype frequencies p², 2pq and q².
  - Multiply by the population size to get expected counts.
  - Compare the observed counts with the expected counts.
  explanation: 'Allele frequencies come from the observed counts first; the Hardy-Weinberg equations then predict genotype frequencies, which become expected counts. A large gap between observed and expected counts means something is acting on the gene.'
- id: bio-q-0770
  lesson: bio-population-genetics
  topic: Mechanisms of evolution
  type: text
  stem: When a few individuals start a new, isolated population that carries only some of the original population's alleles, the resulting genetic drift is called the ___ effect.
  accept: [founder, founders, founder's]
  explanation: 'The founder effect: the founders are a small random sample, so rare alleles they happen to carry can become common, as with Ellis–van Creveld syndrome among the Old Order Amish.'
- id: bio-q-0771
  lesson: bio-speciation
  module_quiz: true
  topic: Phylogeny
  type: label
  stem: Name the numbered parts of this phylogenetic tree.
  image: {src: images/m7-tree-blank.svg, alt: 'A phylogenetic tree of five species, A to E, with time running left to right and four numbered markers on different parts of the tree.'}
  labels:
  - {x: 11.2, y: 39.4, text: Root}
  - {x: 55.3, y: 67.5, text: Node (a common ancestor)}
  - {x: 32.9, y: 22.5, text: Branch (a lineage through time)}
  - {x: 60.8, y: 75, text: Tip (a group being compared)}
  distractors: [Character, Population]
  explanation: 'The root (1) is the base of the tree, the ancestor of everything on it. A node (2) is a branch point, standing for the common ancestor of the groups above it, here species D and E. A branch (3) is a line between nodes, a lineage evolving through time. A tip (4) is the end of a branch, one of the groups being compared.'
- id: bio-q-0772
  lesson: bio-speciation
  topic: Speciation
  type: match
  stem: Sort each barrier as prezygotic (acts before fertilization) or postzygotic (acts after fertilization).
  pairs:
  - [Mules are almost always sterile., Postzygotic]
  - [Two frog species breed in different months., Prezygotic]
  - [Females answer only their own species' flash pattern., Prezygotic]
  - [Hybrid embryos die before hatching., Postzygotic]
  - [Sperm cannot bind to another species' eggs., Prezygotic]
  explanation: 'Timing (temporal), courtship signals (behavioral) and sperm–egg binding (gametic) all stop fertilization from happening: prezygotic. Hybrid sterility and hybrid inviability act on a zygote that has already formed: postzygotic.'
- id: bio-q-0773
  lesson: bio-speciation
  topic: Speciation
  stem: Which of these can lead to sympatric speciation, without any geographic barrier? Select all that apply.
  choices:
  - A plant's chromosome number doubles, so it can't make fertile offspring with its parent species.
  - Some flies switch to laying eggs on a new host fruit that ripens at a different time.
  - A new mountain range splits a population in two.
  - A river changes course and isolates part of a population.
  answer: [0, 1]
  explanation: 'Polyploidy and a host shift (as in apple maggot flies) can isolate groups living in the same place: sympatric speciation. Mountains and rivers are geographic barriers, the start of allopatric speciation.'
- id: bio-q-0774
  lesson: bio-speciation
  topic: Phylogeny
  type: text
  stem: An ancestor and all of its descendants, one complete branch of a phylogenetic tree, is called a ___.
  accept: [clade, monophyletic group]
  explanation: 'A clade includes a common ancestor and every one of its descendants. Clades are identified by shared derived characters, such as the amniotic egg for lizards and humans.'
- id: bio-q-0775
  lesson: bio-speciation
  topic: Phylogeny
  type: order
  stem: Using the vertebrate tree from the lesson, put these animals in order from most closely related to humans to least closely related.
  items: [Lizard, Frog, Trout, Shark, Lamprey]
  explanation: 'Relatedness follows how recently each animal shares a common ancestor with humans. Lizards share the amniote ancestor, frogs the four-limbed ancestor, trout the bony-skeleton ancestor, sharks the jawed ancestor, and lampreys only the oldest node on the tree.'
- id: bio-q-0776
  lesson: bio-history-life
  topic: Geologic time
  type: label
  stem: The top bar shows Earth's whole history split into four eons; the bottom bar zooms into the most recent eon, split into three eras. Numbers are millions of years ago. Name the numbered intervals.
  image: {src: images/m7-timeline-blank.svg, alt: 'Two unlabeled timeline bars. The top bar runs from 4,540 million years ago to now, with boundaries at 4,000, 2,500 and 539. The bottom bar zooms into the last 539 million years, with boundaries at 252 and 66.'}
  labels:
  - {x: 9.9, y: 33.3, text: Hadean}
  - {x: 30.3, y: 33.3, text: Archean}
  - {x: 65.1, y: 33.3, text: Proterozoic}
  - {x: 28.7, y: 81, text: Paleozoic}
  - {x: 68.7, y: 81, text: Mesozoic}
  - {x: 90, y: 81, text: Cenozoic}
  explanation: 'Eons: Hadean (4,540–4,000), Archean (4,000–2,500), Proterozoic (2,500–539), then the Phanerozoic. The Phanerozoic splits into the Paleozoic (539–252), Mesozoic (252–66) and Cenozoic (66–now) eras. The two big extinctions mark the era boundaries: end-Permian at 252, end-Cretaceous at 66.'
- id: bio-q-0777
  lesson: bio-history-life
  module_quiz: true
  topic: History of life
  type: order
  stem: Put these events in the history of life in order, from oldest to most recent.
  items:
  - Earliest widely accepted fossils of prokaryotes
  - Oxygen builds up in the atmosphere
  - First eukaryotes
  - Cambrian explosion
  - Plants reach land
  - End-Cretaceous extinction
  explanation: 'About 3.5 billion years ago, 2.4 billion, about 2 billion, 539 million, about 470 million, and 66 million years ago.'
- id: bio-q-0778
  lesson: bio-history-life
  topic: Geologic time
  type: match
  stem: Match each mass extinction to its leading explanation.
  pairs:
  - [End-Ordovician, Glaciation and falling sea level]
  - [Late Devonian, Loss of oxygen in the oceans]
  - [End-Permian, Huge volcanic eruptions in Siberia]
  - [End-Triassic, Volcanic eruptions as Pangaea split apart]
  - [End-Cretaceous, Asteroid impact at Chicxulub]
  explanation: 'These are the leading explanations from the lesson''s table. The end-Permian (about 252 million years ago) was the largest; the end-Cretaceous (66 million years ago) ended the non-bird dinosaurs, with volcanic eruptions in India also contributing.'
- id: bio-q-0779
  lesson: bio-history-life
  topic: Geologic time
  stem: 'Use the cliff in the figure. Which conclusions are supported? Select all that apply.'
  image: {src: images/m7-rock-layers.svg, alt: 'Five rock layers in a cliff, from bottom to top: sandstone with trilobites, volcanic ash dated at 260 million years, shale with dinosaur bones, an iridium-rich clay layer, and rock with early primate fossils.'}
  choices:
  - The trilobites are older than 260 million years.
  - The dinosaur bones are younger than 260 million years.
  - The primate fossils are younger than the iridium layer.
  - The trilobites are younger than the dinosaur bones.
  answer: [0, 1, 2]
  explanation: 'By superposition, lower layers are older. The trilobites lie below the dated ash, so they are older than 260 million years; the dinosaur bones lie above it, so they are younger. The primates lie above the iridium layer, which matches the 66-million-year end-Cretaceous boundary. The trilobites are the oldest fossils in the cliff, not younger than the dinosaurs.'
- id: bio-q-0780
  lesson: bio-history-life
  topic: History of life
  type: text
  stem: The pattern in which species change little for long periods and then change relatively quickly, often around speciation, is called ___.
  accept: [punctuated equilibrium, punctuated equilibria]
  explanation: 'Punctuated equilibrium, named by Niles Eldredge and Stephen Jay Gould in 1972. "Relatively quickly" still means tens of thousands of years. The contrasting pattern of slow, steady change is gradualism.'
- id: bio-qh-0701
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: In a plant population, AA plants leave an average of 4.0 offspring, Aa plants 5.0 and aa plants 2.5. What is the relative fitness of AA?
  choices: ['0.8', '1.25', '0.2', '1.0']
  answer: 0
  explanation: 'Divide by the fittest genotype, Aa: $w_{AA} = 4.0/5.0 = 0.8$. 1.25 divides the wrong way; 0.2 is the selection coefficient $s = 1 - w$; 1.0 would be right only if AA were the fittest genotype.'
- id: bio-qh-0702
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: A population starts in Hardy-Weinberg proportions with $p = q = 0.5$. Relative fitnesses are $w_{AA} = w_{Aa} = 1$ and $w_{aa} = 0.5$. What is $q$ among the adults after one generation of selection?
  choices: ['0.375', '0.43', '0.25', '0.5']
  answer: 1
  explanation: 'Zygotes 0.25, 0.50, 0.25; times $w$: 0.25, 0.50, 0.125; mean fitness $\bar w = 0.875$. $q'' = \dfrac{0.125 + \tfrac12(0.50)}{0.875} = \dfrac{0.375}{0.875} \approx 0.43$. 0.375 forgets to divide by $\bar w$; 0.25 is $q^2$; 0.5 assumes nothing changes.'
- id: bio-qh-0703
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: Selection against a recessive phenotype ($aa$) lowers $q$ quickly when $q$ is large, but very slowly once $q$ is small. Why?
  choices:
  - Rare alleles mutate back into the dominant allele.
  - Selection stops acting once an allele falls below 10%.
  - When $q$ is small, most copies of $a$ are in heterozygotes, which have normal fitness.
  - Heterozygotes have lower fitness than $aa$ individuals.
  answer: 2
  explanation: 'Only $aa$ individuals are selected against. When $q = 0.1$, just 1% of individuals are $aa$ but 18% are carriers, so about 90% of $a$ copies are hidden in heterozygotes. Selection keeps acting at every frequency; it simply has little to act on.'
- id: bio-qh-0704
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: At a gene with heterozygote advantage, $w_{AA} = 0.9$, $w_{Aa} = 1$ and $w_{aa} = 0.6$. At what frequency $q$ of allele $a$ does selection stop changing the population?
  choices: ['0.8', '0.25', '0.1', '0.2']
  answer: 3
  explanation: '$s = 1 - w_{AA} = 0.1$ and $t = 1 - w_{aa} = 0.4$, so $\hat q = \dfrac{s}{s + t} = \dfrac{0.1}{0.5} = 0.2$. 0.8 is the equilibrium $p$, not $q$; 0.25 is $s/t$; 0.1 is $s$ alone.'
- id: bio-qh-0705
  lesson: bio-h-evolution-models
  topic: Genetic drift
  stem: A neutral allele has a frequency of 0.15 in a small population with no selection, mutation or gene flow. What is the probability that drift eventually fixes it?
  choices: ['0.15', '0.85', '0.5', '0.0225']
  answer: 0
  explanation: 'For a neutral allele, the chance of eventual fixation equals its current frequency, 0.15; it is lost the other 85% of the time. 0.5 assumes every allele has an even chance; 0.0225 is $0.15^2$.'
- id: bio-qh-0706
  lesson: bio-h-evolution-models
  topic: Genetic drift
  stem: In an idealized population of 50 breeders with no mutation, gene flow or selection, about what fraction of the starting heterozygosity remains after 100 generations?
  choices: ['0.13', '0.37', '0.99', '0.5']
  answer: 1
  explanation: '$H_t / H_0 = \left(1 - \tfrac{1}{2N}\right)^t = \left(1 - \tfrac{1}{100}\right)^{100} \approx 0.37$. 0.13 uses $1 - \tfrac1N$ instead of $1 - \tfrac{1}{2N}$ (forgetting that diploids carry $2N$ gene copies).'
- id: bio-qh-0707
  lesson: bio-h-evolution-models
  topic: Genetic drift
  stem: Over four generations a population has 500, 20, 500 and 500 breeding adults. What is its effective population size over this stretch?
  choices: ['380', '500', 'About 71', '20']
  answer: 2
  explanation: 'Use the harmonic mean: $N_e = \dfrac{4}{\tfrac{1}{500} + \tfrac{1}{20} + \tfrac{1}{500} + \tfrac{1}{500}} = \dfrac{4}{0.056} \approx 71$. 380 is the ordinary average, which hides the bottleneck; the single generation of 20 dominates, but the other generations still count.'
- id: bio-qh-0708
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: When you test genotype counts at one gene with two alleles against Hardy-Weinberg using chi-square, how many degrees of freedom do you use?
  choices:
  - 2, because there are three genotype categories
  - 3, one for each genotype
  - 0, because the expected counts come from the data
  - '1: three categories minus 1, minus 1 more because p was estimated from the same data'
  answer: 3
  explanation: 'Three genotype categories give $3 - 1 = 2$, and estimating $p$ from the same counts uses up one more, leaving df = 1 (critical value 3.84 at the 0.05 significance level). Using 2 is the usual mistake; it makes the test too lenient.'
- id: bio-qh-0709
  lesson: bio-h-evolution-models
  topic: Selection models
  stem: A sample of 100 individuals has 40 $AA$, 20 $Aa$ and 40 $aa$. Test for Hardy-Weinberg proportions (critical value 3.84). What do you find?
  choices:
  - $\chi^2 = 36$; fail to reject, since chance can explain the gap.
  - $\chi^2 = 0$; the data fit perfectly because $p = 0.5$.
  - $\chi^2 = 36$; reject, with too few heterozygotes, as inbreeding would cause.
  - $\chi^2 = 3.6$; fail to reject.
  answer: 2
  explanation: '$p = \dfrac{2(40) + 20}{200} = 0.5$, so expected counts are 25, 50, 25. $\chi^2 = \dfrac{15^2}{25} + \dfrac{30^2}{50} + \dfrac{15^2}{25} = 9 + 18 + 9 = 36 > 3.84$: reject. Getting $p = 0.5$ says nothing about genotype proportions, and 3.6 comes from a slip in the arithmetic.'
- id: bio-qh-0710
  lesson: bio-h-evolution-models
  topic: Genetic drift
  type: text
  stem: A captive population has 10 breeding males and 40 breeding females. Using $N_e = \dfrac{4N_m N_f}{N_m + N_f}$, its effective population size is ___.
  accept: [32]
  explanation: '$N_e = \dfrac{4(10)(40)}{10 + 40} = \dfrac{1600}{50} = 32$, well below the 50 adults counted. The scarcer sex limits how many lineages are passed on.'
- id: bio-qh-0711
  lesson: bio-h-evolution-models
  topic: Selection models
  type: text
  stem: The selection coefficient of a genotype is $s = 1 - w$, where $w$ is the genotype's ___ fitness.
  accept: [relative]
  explanation: 'Relative fitness: the genotype''s average offspring number divided by that of the fittest genotype. A genotype with $w = 0.75$ has $s = 0.25$.'
- id: bio-qh-0712
  lesson: bio-h-evolution-models
  topic: Selection models
  type: order
  stem: Put the steps for calculating one generation of selection in order.
  items:
  - Write the zygote genotype frequencies p², 2pq and q².
  - Multiply each genotype frequency by its relative fitness.
  - Add the three products to get the mean fitness.
  - Divide each product by the mean fitness.
  - Count alleles among the breeders to get the new p and q.
  explanation: 'Selection acts on genotypes, so start from Hardy-Weinberg zygotes, weight each genotype by its fitness, rescale by the mean fitness so the frequencies add to 1, and only then count alleles.'
- id: bio-qh-0713
  lesson: bio-h-evolution-models
  topic: Genetic drift
  type: match
  stem: Match each term to its meaning.
  pairs:
  - [Fixation, An allele reaches a frequency of 1 and is the only one left.]
  - [Effective population size, The size of an idealized population that would lose variation by drift at the same rate.]
  - [Heterozygote advantage, The heterozygote has higher fitness than either homozygote.]
  - [Selection coefficient, How much lower a genotype's fitness is than the fittest genotype's.]
  - [Mean fitness, The average relative fitness of the population.]
  distractors: [Movement of alleles between populations.]
  explanation: 'Movement of alleles between populations is gene flow, which is not one of these terms.'
- id: bio-qh-0714
  lesson: bio-h-evolution-models
  topic: Genetic drift
  stem: Which of these make a population's effective size smaller than its census size? Select all that apply.
  choices:
  - Many more breeding females than breeding males
  - A crash to a few individuals some generations ago
  - A constant size, equal numbers of each sex, and every adult equally likely to breed
  - A few adults producing most of the offspring
  answer: [0, 1, 3]
  explanation: 'Unequal sex ratios, past bottlenecks (through the harmonic mean) and unequal family sizes all mean fewer lineages are passed on, so drift acts as in a smaller population. A constant size with equal sexes and equal chances to breed is the idealized case, where $N_e$ equals the census size.'
- id: bio-qh-0715
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: In a study of vertebrates (fish, frogs, lizards, mammals), which character is a shared derived character that marks the mammals as a clade?
  choices: [A backbone, Four limbs, Lungs, Hair]
  answer: 3
  explanation: 'Hair arose in the common ancestor of mammals and is found in no other vertebrates. A backbone, four limbs and lungs are shared with other vertebrates, so for mammals they are shared ancestral characters and can''t define the group.'
- id: bio-qh-0716
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: Why do biologists include an outgroup when building a phylogenetic tree?
  choices:
  - It shows which character states are ancestral and where to root the tree.
  - It is the most advanced species in the study.
  - It is the ancestor of all the species in the ingroup.
  - It is the species with the most derived characters.
  answer: 0
  explanation: 'A state found in the outgroup, which branched off earlier, is taken as ancestral, and the root goes on the branch leading to it. An outgroup is a living relative, not the ancestor, and no living species is "more advanced".'
- id: bio-qh-0717
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: The figure shows Trees 1 and 2 from the lesson's six-character table. How many changes would Tree 3, in which species B and C are closest, require?
  image: {src: images/m7-parsimony.svg, alt: 'Two trees of species A, B and C plus an outgroup, with numbered bars for character changes: Tree 1 (A and B closest) has 7, Tree 2 (A and C closest) has 9.', caption: 'Character states, outgroup all 0. A: 1 1 1 1 1 0. B: 1 1 1 0 1 1. C: 0 0 0 1 1 0.'}
  choices: ['7', '10', '9', '6']
  answer: 1
  explanation: 'On Tree 3, characters 1, 2 and 3 (shared by A and B) each need 2 changes: 6. Character 4 (shared by A and C) needs 2. Characters 5 and 6 need 1 each. Total $6 + 2 + 1 + 1 = 10$, the worst of the three trees; Tree 1, with 7, is the most parsimonious.'
- id: bio-qh-0718
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: Which of these is an example of homoplasy?
  choices:
  - Hair in mice and in humans
  - A backbone in trout and in frogs
  - Wings in bats and in birds, considered as wings
  - An amniotic egg in lizards and in humans
  answer: 2
  explanation: 'Bats and birds evolved flight separately; their common ancestor had no wings, so wings are a similarity not inherited from a common ancestor: homoplasy by convergence. (Their forelimb bones are homologous; the wings built from them are not.) The other traits were inherited from a common ancestor.'
- id: bio-qh-0719
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: How many different rooted trees, with two branches at every node, are possible for 5 species?
  choices: ['15', '25', '120', '105']
  answer: 3
  explanation: '$1 \times 3 \times 5 \times 7 = 105$ (the product of odd numbers up to $2n - 3 = 7$). 15 is the number for 4 species; 120 is $5!$; 25 is $5^2$.'
- id: bio-qh-0720
  lesson: bio-h-phylogenetics
  topic: Molecular clocks
  stem: Fossils date the split between two lineages to 30 million years ago, and a gene differs between them at 9% of sites. Two other species in the group differ at 3%. About how long ago did they split?
  choices: [10 million years, 20 million years, 5 million years, 90 million years]
  answer: 0
  explanation: 'The two lineages diverge at $9\% / 30 = 0.30\%$ per million years ($r = 0.15\%$ per lineage), so $T = \dfrac{3}{2 \times 0.15} = 10$ million years. 20 divides by $r$ instead of $2r$; 5 divides by 2 twice; 90 multiplies instead of dividing.'
- id: bio-qh-0721
  lesson: bio-h-phylogenetics
  topic: Molecular clocks
  stem: For splits hundreds of millions of years old, a fast-changing gene tends to make the split look more recent than it is. Why?
  choices:
  - Fossils of old splits are always dated wrongly.
  - Sites that change more than once hide earlier changes, so differences stop growing in step with time.
  - Mutation rates were much higher in the distant past.
  - Older species have fewer genes to compare.
  answer: 1
  explanation: 'This is saturation: once a site has changed, a later change at the same site may hide the first or even restore the original base, so the count of differences underestimates the changes that happened. Slower genes, many genes and models of multiple changes are used for old splits.'
- id: bio-qh-0722
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: A tree built from one antibiotic-resistance gene places two distantly related bacteria side by side, but trees built from 100 other genes place them far apart. What is the most likely explanation?
  choices:
  - The trees from the 100 other genes are all wrong.
  - The two bacteria are really the same species.
  - The resistance gene moved between their lineages by horizontal gene transfer.
  - Resistance genes never change, so they cannot be used.
  answer: 2
  explanation: 'When one gene disagrees with the species tree supported by many others, transfer of that gene between lineages is the usual explanation, and resistance genes often travel on plasmids. The single gene''s tree is real; it just records the gene''s history, not the species''.'
- id: bio-qh-0723
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: The traditional group "reptiles" includes turtles, lizards, snakes and crocodiles but not birds. Why is that group not a clade?
  choices:
  - Turtles are not really reptiles.
  - It leaves out birds, which descend from the same common ancestor.
  - Lizards and snakes are not closely related.
  - The animals in it have no shared derived characters at all.
  answer: 1
  explanation: 'Crocodiles share a more recent common ancestor with birds than with lizards, so a group with crocodiles but without birds leaves out some descendants: a paraphyletic group. Adding birds makes the reptiles a clade. Snakes are in fact closely related to lizards.'
- id: bio-qh-0724
  lesson: bio-h-phylogenetics
  topic: Cladistics
  type: text
  stem: A species known to have branched off before the group being studied, used to decide which character states are ancestral, is called an ___.
  accept: [outgroup, out-group, out group]
  explanation: 'The outgroup also roots the tree. It should be close enough to the ingroup that its states still reflect the ingroup''s ancestor.'
- id: bio-qh-0725
  lesson: bio-h-phylogenetics
  topic: Molecular clocks
  type: text
  stem: A gene changes at 0.4% per million years in each lineage. Two species differ in this gene at 4.8% of sites. They split about ___ million years ago.
  accept: [6, six]
  explanation: '$T = \dfrac{d}{2r} = \dfrac{4.8}{2 \times 0.4} = 6$ million years. Dividing by $r$ alone would give 12, forgetting that both lineages changed.'
- id: bio-qh-0726
  lesson: bio-h-phylogenetics
  topic: Cladistics
  type: match
  stem: Match each term to its meaning.
  pairs:
  - [Shared derived character, A trait state that arose in a group's common ancestor and marks the group]
  - [Shared ancestral character, A trait state inherited from an older ancestor and found outside the group too]
  - [Homoplasy, A similarity not inherited from a common ancestor]
  - [Maximum parsimony, Choosing the tree that needs the fewest changes]
  - [Horizontal gene transfer, Movement of genes between organisms other than from parent to offspring]
  explanation: 'Shared derived characters define clades; shared ancestral characters don''t. Homoplasy (convergence or reversal) is what makes characters conflict, parsimony is one way to choose among the resulting trees, and horizontal transfer can give a gene a different history from its species.'
- id: bio-qh-0727
  lesson: bio-h-phylogenetics
  topic: Molecular clocks
  type: order
  stem: Put the steps for dating a split with a molecular clock in order.
  items:
  - Find a split dated independently by fossils or geology.
  - Measure the gene difference across that dated split.
  - Divide that difference by twice the known time to get the rate per lineage.
  - Divide the difference between the two species of interest by twice that rate.
  explanation: 'The clock has to be calibrated with a known date before it can be used: rate = difference ÷ (2 × known time), then time = difference ÷ (2 × rate). Each step needs the result of the one before it.'
- id: bio-qh-0728
  lesson: bio-h-phylogenetics
  topic: Cladistics
  stem: Which of these are ways bacteria transfer genes horizontally? Select all that apply.
  choices:
  - 'Transformation: taking up DNA released by other cells'
  - 'Transduction: receiving DNA carried by a virus'
  - 'Conjugation: passing a plasmid through direct contact'
  - 'Binary fission: dividing into two daughter cells'
  answer: [0, 1, 2]
  explanation: 'Transformation, transduction and conjugation move DNA between cells that are not parent and offspring. Binary fission is ordinary reproduction, passing genes vertically from a parent cell to its daughters.'
