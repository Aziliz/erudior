- id: bio-q-0801
  lesson: bio-classification
  module_quiz: true
  topic: Classification
  stem: Which way of writing the scientific name of humans follows the capitalization rules of binomial nomenclature?
  choices:
  - Homo Sapiens
  - homo sapiens
  - HOMO sapiens
  - Homo sapiens
  answer: 3
  explanation: 'The genus is capitalized and the specific epithet is always lowercase: Homo sapiens (italicized in print). Capitalizing the epithet is the most common slip; the genus is never lowercase or written in all capitals.'
- id: bio-q-0802
  lesson: bio-classification
  topic: Classification
  stem: A wolf and a coyote are in the same genus, Canis. Which statement must be true?
  choices:
  - They are also the same species.
  - They are also in the same family, order, class, phylum, kingdom and domain.
  - They share no ranks above genus.
  - They must be able to interbreed and produce fertile offspring.
  answer: 1
  explanation: Ranks are nested, so sharing a genus means sharing every rank above it (family Canidae, order Carnivora, and so on). It does not mean sharing the species rank below it, and interbreeding is not guaranteed by being in the same genus.
- id: bio-q-0803
  lesson: bio-classification
  module_quiz: true
  topic: Classification
  stem: What evidence led Carl Woese to propose that archaea form a domain separate from bacteria?
  choices:
  - Differences in cell shape seen under a light microscope
  - Results of the Gram stain
  - Comparisons of ribosomal RNA sequences
  - Whether or not the cells have a nucleus
  answer: 2
  explanation: Woese compared sequences of ribosomal RNA, a molecule all cells have. Archaea and bacteria both lack a nucleus and look alike under a microscope, which is exactly why they had been lumped together; the Gram stain separates groups of bacteria, not domains.
- id: bio-q-0804
  lesson: bio-classification
  topic: Bacteria and archaea
  stem: Which statement about archaea is supported by current evidence?
  choices:
  - They are a kind of bacteria that lives only in extreme environments.
  - They have a nucleus but no mitochondria.
  - In the machinery they use to copy DNA and make proteins, they resemble eukaryotes more than bacteria.
  - Many species cause disease in humans.
  answer: 2
  explanation: Archaea are a separate domain whose RNA polymerase and other gene-expression machinery are eukaryote-like. They also live in soil, oceans and the human gut, not only in extreme places; they have no nucleus; and no archaea are known to cause human disease.
- id: bio-q-0805
  lesson: bio-classification
  module_quiz: true
  topic: Bacteria and archaea
  stem: A culture starts with 500 bacteria that divide every 30 minutes. Assuming exponential growth, how many cells are there after 3 hours?
  choices:
  - 3,000
  - 4,000
  - 32,000
  - 6,000
  answer: 2
  explanation: 3 hours = 180 min, so $n = 180/30 = 6$ generations, and $N = 500 \times 2^{6} = 500 \times 64 = 32\,000$. Multiplying by 6 gives 3,000 (generations are doublings, not multiples); using 3 generations (the hours) gives 4,000; multiplying by 12 gives 6,000.
- id: bio-q-0806
  lesson: bio-classification
  topic: Bacteria and archaea
  stem: A bacterial population grows from 100 cells to 1,600 cells in 2 hours of exponential growth. What is its generation time?
  choices:
  - 7.5 minutes
  - 30 minutes
  - 20 minutes
  - 60 minutes
  answer: 1
  explanation: '$1600/100 = 16 = 2^{4}$, so there were 4 generations in 120 minutes: $120/4 = 30$ minutes each. Dividing 120 by 16 (the fold increase) gives 7.5 minutes, which confuses the number of doublings with the fold change.'
- id: bio-q-0807
  lesson: bio-classification
  topic: Bacteria and archaea
  stem: A water sample is diluted to $10^{-5}$, and 0.1 mL of the dilution is spread on a plate. 84 colonies grow. What was the concentration in the original sample?
  choices:
  - $8.4 \times 10^{7}$ CFU/mL
  - $8.4 \times 10^{6}$ CFU/mL
  - $8.4 \times 10^{2}$ CFU/mL
  - $8.4 \times 10^{-5}$ CFU/mL
  answer: 0
  explanation: CFU/mL $= \dfrac{84}{10^{-5} \times 0.1} = 84 \times 10^{6} = 8.4 \times 10^{7}$. Forgetting that only 0.1 mL was plated gives $8.4 \times 10^{6}$; forgetting the dilution gives 840; multiplying by the dilution instead of dividing gives a tiny, impossible number.
- id: bio-q-0808
  lesson: bio-classification
  module_quiz: true
  topic: Viruses
  stem: A bacterial culture infected with a phage keeps growing normally for several days. After a dose of UV light, the cells burst within an hour. What best explains this?
  choices:
  - The phage was in the lysogenic cycle, and UV damage switched it into the lytic cycle.
  - The phage was in the lytic cycle the whole time, and UV light sped it up.
  - UV light killed the phage, so the bacteria burst from lack of nutrients.
  - The bacteria were resistant to the phage until UV light mutated them.
  answer: 0
  explanation: Normal growth after infection means the viral DNA was integrated and copied along with the host chromosome (lysogenic). DNA damage from UV is a classic trigger that switches it to the lytic cycle, so new phages were made and the cells lysed. A lytic infection would have destroyed the culture within hours, not days.
- id: bio-q-0809
  lesson: bio-classification
  topic: Viruses
  stem: Why are antibiotics ineffective against viral infections such as the flu?
  choices:
  - Viruses are too small for antibiotic molecules to reach.
  - Viruses hide inside the nucleus, where antibiotics cannot enter.
  - Every virus is already resistant to every antibiotic.
  - Viruses lack the cell walls, ribosomes and metabolism that antibiotics target.
  answer: 3
  explanation: Antibiotics attack structures specific to bacteria, such as peptidoglycan walls and bacterial ribosomes. Viruses have none of these; they use the host cell's machinery. Resistance is not the reason, and size is not the problem.
- id: bio-q-0810
  lesson: bio-classification
  module_quiz: true
  topic: Viruses
  stem: A particular virus infects human liver cells but not skin cells. What is the most likely reason?
  choices:
  - Skin cells have cell walls that block viruses.
  - Liver cells lack DNA, so the virus can insert its own.
  - Viruses can only infect cells that are dividing rapidly.
  - Liver cells have surface receptor molecules that the virus can attach to, and skin cells do not.
  answer: 3
  explanation: A virus attaches to specific receptor molecules on its host cell, so it infects only cell types that display them. Human cells have no cell walls, all of them contain DNA, and many viruses infect cells that are not dividing.
- id: bio-q-0811
  lesson: bio-classification
  topic: Bacteria and archaea
  stem: Bacteria in a flask grow exponentially for a while, then the population stops increasing. What is the most likely cause?
  choices:
  - The bacteria have reached their maximum generation time.
  - Binary fission can only happen a fixed number of times.
  - The bacteria have switched to sexual reproduction.
  - Nutrients are running out and waste products are building up.
  answer: 3
  explanation: A closed flask has limited food, and wastes accumulate, so division slows until births balance deaths (the stationary phase). There's no built-in limit on the number of fissions, and bacteria don't reproduce sexually.
- id: bio-q-0848
  lesson: bio-classification
  topic: Classification
  stem: A textbook sorts life into three domains, but a recent research paper draws a tree with only two primary branches, Bacteria and Archaea. How can both be reasonable?
  choices:
  - The paper counts eukaryotes as bacteria because they have mitochondria.
  - Archaea have recently been shown to be a kind of bacteria.
  - The paper leaves out eukaryotes because many of them are multicellular.
  - On that tree eukaryotes sit inside the archaeal branch, but they are distinctive enough to keep as a domain.
  answer: 3
  explanation: Genome studies place eukaryotes within the archaea (closest to the Asgard archaea), so a tree of descent has two primary branches; the three-domain system remains a useful classification because eukaryotes differ so much from both. Mitochondria came from a bacterium but the host was archaeal, archaea are not bacteria, and no tree of life leaves out eukaryotes.
- id: bio-q-0812
  lesson: bio-protists-fungi
  module_quiz: true
  topic: Protists
  stem: Why do biologists say that protists are not a natural evolutionary group?
  choices:
  - Protists do not have a nucleus.
  - All protists are single-celled, unlike other eukaryotes.
  - Some protists are more closely related to plants, animals or fungi than to other protists.
  - Protists are not made of cells.
  answer: 2
  explanation: A natural group contains an ancestor and all its descendants. DNA shows protists scattered across the eukaryote tree, with some closer to plants and others closer to animals and fungi, so the group is defined only by what it isn't. Protists are eukaryotes with nuclei, and some, like kelp, are multicellular.
- id: bio-q-0813
  lesson: bio-protists-fungi
  topic: Protists
  stem: A single-celled protist is covered in thousands of short, hair-like structures that beat in waves to move it. These structures are
  choices:
  - pseudopods
  - flagella
  - hyphae
  - cilia
  answer: 3
  explanation: Many short, coordinated hair-like structures are cilia, as in Paramecium. Pseudopods are flowing extensions of cytoplasm (amoebas), flagella are few and long and whip-like, and hyphae are fungal filaments.
- id: bio-q-0814
  lesson: bio-protists-fungi
  topic: Protists
  stem: Malaria is caused by
  choices:
  - a virus carried by mosquitoes
  - a bacterium in contaminated water
  - a single-celled protist carried by mosquitoes
  - a fungus that grows in the lungs
  answer: 2
  explanation: Malaria is caused by Plasmodium, a protist parasite spread by Anopheles mosquitoes. It multiplies in the liver and then in red blood cells. It is not a virus or a bacterium, though mosquitoes do carry some viral diseases.
- id: bio-q-0815
  lesson: bio-protists-fungi
  module_quiz: true
  topic: Protists
  stem: The organism that caused the Irish potato famine grows in threads like a fungus, but it is classified as a protist. Which evidence supports that classification?
  choices:
  - Its cell walls contain cellulose rather than chitin, and its DNA groups it with diatoms and brown algae.
  - It grows in thread-like filaments.
  - It feeds by absorbing nutrients from its host.
  - It reproduces with spores.
  answer: 0
  explanation: Phytophthora's cellulose walls and its DNA place it among protists. Threads, absorptive feeding and spores are exactly the features it shares with true fungi, so they can't separate it from them.
- id: bio-q-0816
  lesson: bio-protists-fungi
  topic: Protists
  stem: 'A student covers half of each of four dishes of Euglena with foil. After 30 minutes she counts cells in samples from each half: lit halves 410, 395, 430, 402; dark halves 90, 110, 85, 98. Which conclusion is best supported?'
  choices:
  - Euglena move toward light.
  - Light makes Euglena reproduce faster.
  - Euglena die in the dark.
  - Foil attracts Euglena.
  answer: 0
  explanation: In every replicate, many more cells are in the lit half after only 30 minutes, too short for large changes from reproduction or death; the simplest explanation is movement toward light. Cells were counted in the covered half too, so foil did not attract them.
- id: bio-q-0817
  lesson: bio-protists-fungi
  topic: Protists
  stem: Roughly what share of all photosynthesis on Earth is carried out by phytoplankton in the oceans?
  choices:
  - About 1%
  - About 10%
  - Nearly all of it
  - About half
  answer: 3
  explanation: Ocean phytoplankton (photosynthetic protists such as diatoms, plus cyanobacteria) do roughly half of global photosynthesis. Land plants do most of the rest, so 'nearly all' is wrong, and 1% or 10% badly underestimates the oceans.
- id: bio-q-0818
  lesson: bio-protists-fungi
  module_quiz: true
  topic: Fungi
  stem: Which set of features shows that a mushroom is not a plant?
  choices:
  - It grows from the ground and does not move.
  - It cannot photosynthesize, its cell walls contain chitin, and it stores glycogen.
  - Its cells have cell walls.
  - It reproduces by releasing spores.
  answer: 1
  explanation: Fungi are heterotrophs with chitin walls that store glycogen, like animals. Growing in soil, staying put and having cell walls are shared with plants, and ferns and mosses also release spores, so those features can't distinguish them.
- id: bio-q-0819
  lesson: bio-protists-fungi
  topic: Fungi
  stem: How does a fungus growing on rotting fruit get its food?
  choices:
  - It engulfs pieces of fruit into a gut and digests them.
  - It photosynthesizes using light passing through the fruit.
  - It absorbs whole proteins and starch without breaking them down.
  - It releases digestive enzymes into the fruit and absorbs the small molecules produced.
  answer: 3
  explanation: 'Fungi digest outside their bodies: hyphae secrete enzymes and absorb the resulting sugars and amino acids. They have no gut and never photosynthesize, and large molecules must be broken down before they can be absorbed.'
- id: bio-q-0820
  lesson: bio-protists-fungi
  topic: Fungi
  stem: A mushroom popping up from a lawn is best described as
  choices:
  - the short-lived spore-producing structure of a much larger underground mycelium
  - the entire body of the fungus
  - a seed of the fungus
  - a single giant hypha
  answer: 0
  explanation: The mushroom is a fruiting body. Most of the fungus is the mycelium of branching hyphae spreading through the soil. Fungi have spores, not seeds.
- id: bio-q-0821
  lesson: bio-protists-fungi
  module_quiz: true
  topic: Fungi
  stem: Pine seedlings grown in sterilized soil (no fungi) are smaller and contain less phosphorus than seedlings grown in soil with mycorrhizal fungi. What best explains the difference?
  choices:
  - Fungal hyphae extend the root system's reach and deliver minerals such as phosphate in exchange for sugars.
  - The fungi photosynthesize and give the seedlings extra sugar.
  - Sterilizing soil adds phosphorus that harms seedlings.
  - The fungi are parasites that make the seedlings grow faster to escape them.
  answer: 0
  explanation: In a mycorrhizal partnership, the huge surface of the hyphae absorbs water and minerals such as phosphate for the plant, which pays in sugars. Fungi can't photosynthesize, and the result shows the fungi helping rather than harming.
- id: bio-q-0822
  lesson: bio-protists-fungi
  topic: Fungi
  stem: On Fleming's 1928 plate, bacteria grew everywhere except in a clear zone around a Penicillium mold. Which conclusion is best supported?
  choices:
  - The mold eats bacteria by engulfing them.
  - A substance spreading out from the mold kills or stops the growth of these bacteria.
  - The bacteria could not grow because the mold used up all the light.
  - The mold and bacteria are mutualists.
  answer: 1
  explanation: The clear zone extends beyond the mold itself, so something diffusing out of the mold, not contact or engulfing, inhibited the bacteria. That substance was penicillin. Bacteria on a plate don't need light, and inhibiting one's partner is not mutualism.
- id: bio-q-0823
  lesson: bio-protists-fungi
  topic: Fungi
  stem: Lichens are often the first organisms to grow on bare rock. A lichen is
  choices:
  - a partnership between a fungus and a photosynthetic alga or cyanobacterium
  - a type of moss
  - a single species of photosynthetic fungus
  - a colony of protists
  answer: 0
  explanation: A lichen combines a fungus, which provides structure and absorbs minerals, with an alga or cyanobacterium that photosynthesizes. It is not a moss (a plant), and no fungus photosynthesizes.
- id: bio-q-0824
  lesson: bio-plants
  module_quiz: true
  topic: Plants
  stem: Which group of plants has vascular tissue but does not produce seeds?
  choices:
  - Ferns
  - Mosses
  - Pine trees
  - Flowering plants
  answer: 0
  explanation: Ferns have xylem and phloem but reproduce with spores. Mosses lack vascular tissue; pines (gymnosperms) and flowering plants (angiosperms) make seeds.
- id: bio-q-0825
  lesson: bio-plants
  topic: Plants
  stem: Why do mosses stay only a few centimeters tall?
  choices:
  - Their leaves cannot photosynthesize.
  - They cannot make seeds.
  - They lack vascular tissue, so water moves through them only by slow diffusion and capillary action.
  - Their cells have no cell walls.
  answer: 2
  explanation: Without xylem, water can't be moved far, so mosses stay short and live in damp places. Mosses do photosynthesize and have cellulose walls; lacking seeds affects reproduction, not height (ferns lack seeds and grow tall).
- id: bio-q-0826
  lesson: bio-plants
  module_quiz: true
  topic: Plants
  stem: In a fern, the large leafy plant you see in the forest is the
  choices:
  - haploid gametophyte
  - diploid sporophyte
  - haploid sporophyte
  - diploid gametophyte
  answer: 1
  explanation: In ferns and seed plants the sporophyte, which is diploid and makes spores by meiosis, is the dominant stage. The gametophyte is haploid; in mosses it's the familiar green plant, but in ferns it's a tiny separate structure.
- id: bio-q-0827
  lesson: bio-plants
  topic: Plants
  stem: A strip of bark, including the phloem, is cut away in a ring around a tree trunk, leaving the xylem intact. What is the most likely long-term result?
  choices:
  - Water can no longer reach the leaves, so they wilt within hours.
  - Sugars build up above the cut and the roots eventually starve.
  - The roots fill with excess sugar.
  - Nothing, because sugars travel in the xylem.
  answer: 1
  explanation: Phloem carries sugars from leaves (sources) down to roots (sinks). With the phloem ring gone, sugar collects above the cut and the roots slowly starve. The xylem is intact, so water still reaches the leaves.
- id: bio-q-0828
  lesson: bio-plants
  module_quiz: true
  topic: Plants
  stem: In a potometer, the air bubble moves 36 mm in 4 minutes along a capillary with a cross-section of 0.50 mm². What is the rate of water uptake?
  choices:
  - 9.0 mm³/min
  - 72 mm³/min
  - 18 mm³/min
  - 4.5 mm³/min
  answer: 3
  explanation: Volume $= 0.50 \times 36 = 18$ mm³, so the rate is $18/4 = 4.5$ mm³/min. Using the distance alone gives 9.0 (forgot the area); 18 is the total volume, not a rate; 72 multiplies by the time instead of dividing.
- id: bio-q-0829
  lesson: bio-plants
  topic: Plants
  stem: Under which conditions would a well-watered plant transpire fastest?
  choices:
  - Cool, humid, still and bright
  - Warm, dry, windy and bright
  - Warm, humid, still and dark
  - Cool, dry, still and dark
  answer: 1
  explanation: 'Transpiration is evaporation: heat, dry air and wind all speed it, and light opens the stomata. Humid, still air slows evaporation, and darkness closes stomata.'
- id: bio-q-0830
  lesson: bio-plants
  topic: Plants
  stem: What supplies the energy that lifts water from the roots to the top of a tall tree?
  choices:
  - ATP spent by root cells pumping water upward
  - Contractions of the xylem walls
  - Evaporation of water from the leaves, driven by the sun
  - Sugar flowing down through the phloem
  answer: 2
  explanation: In the cohesion-tension mechanism, evaporation (transpiration) pulls on continuous water columns held together by hydrogen bonds. The plant spends no ATP lifting water; xylem cells are dead and can't contract; phloem moves sugar, not the water column.
- id: bio-q-0831
  lesson: bio-plants
  topic: Plants
  stem: A leaf imprint is viewed at a magnification where the field of view is 0.50 mm in diameter. There are 39 stomata in the field. What is the stomatal density?
  choices:
  - About 199 per mm²
  - About 50 per mm²
  - About 78 per mm²
  - About 156 per mm²
  answer: 0
  explanation: Area $= \pi r^2 = \pi(0.25)^2 \approx 0.196$ mm², so density $= 39/0.196 \approx 199$ per mm². Using 0.50 mm as the radius gives about 50; dividing by the diameter gives 78; dividing by the radius gives 156.
- id: bio-q-0832
  lesson: bio-plants
  module_quiz: true
  topic: Plants
  stem: Darwin found that grass seedlings lit from one side bent toward the light, but not when their tips were covered with an opaque cap. They still bent when the cap was transparent. What does this show?
  choices:
  - Light acts directly on the cells that bend.
  - The tip detects the light, even though the bending happens lower down.
  - The cap blocked the hormone from entering the seedling.
  - Seedlings bend toward heat rather than light.
  answer: 1
  explanation: 'The transparent cap is the control: covering the tip by itself doesn''t stop bending; blocking light to the tip does. So the tip senses light and signals the region below, where bending happens. Shading only the lower part did not stop bending, which rules out light acting directly on the bending cells.'
- id: bio-q-0833
  lesson: bio-plants
  topic: Plants
  stem: Frits Went placed agar blocks that had held seedling tips off-center on cut seedlings kept in the dark. The seedlings bent away from the side with the block. What did this show?
  choices:
  - Light is needed for seedlings to bend.
  - The signal from the tip is a chemical that can diffuse into agar and makes cells on that side grow more.
  - Agar itself is a plant hormone.
  - Cells under the block stopped growing.
  answer: 1
  explanation: The tips' signal moved into the agar, so it must be a chemical (later named auxin). More auxin on one side made that side elongate more, bending the seedling away from it, even in darkness. A control block that never touched tips would rule out agar itself.
- id: bio-q-0834
  lesson: bio-plants
  topic: Plants
  stem: A tomato is botanically a fruit because it
  choices:
  - develops from the ovary of a flower and contains seeds
  - tastes sweet
  - develops from the anther
  - grows on a vine
  answer: 0
  explanation: A fruit is a ripened ovary holding seeds; the ovules inside become the seeds. The anther makes pollen. Sweetness and growth habit have nothing to do with the botanical definition.
- id: bio-q-0835
  lesson: bio-plants
  topic: Plants
  stem: During a drought, a plant closes its stomata. What is the main cost of this response?
  choices:
  - The plant loses more water.
  - Less carbon dioxide enters the leaf, so photosynthesis slows.
  - The roots can no longer absorb minerals by diffusion.
  - Oxygen builds up and poisons the cells.
  answer: 1
  explanation: Stomata let carbon dioxide in and water vapor out at the same time, so closing them saves water at the expense of carbon uptake and photosynthesis. Closing them reduces water loss rather than increasing it.
- id: bio-q-0836
  lesson: bio-animals
  module_quiz: true
  topic: Animals
  stem: Which characteristic separates animals from fungi?
  choices:
  - Animals digest food inside their bodies and their cells lack walls.
  - Animals are heterotrophs.
  - Animals are eukaryotes.
  - Animals store energy as glycogen.
  answer: 0
  explanation: Both animals and fungi are eukaryotic heterotrophs that store glycogen. Fungi digest food outside the body and have chitin cell walls; animals digest internally and have no cell walls.
- id: bio-q-0837
  lesson: bio-animals
  topic: Animals
  stem: Roughly what fraction of described animal species are invertebrates?
  choices:
  - About 5%
  - About 25%
  - About 50%
  - About 95%
  answer: 3
  explanation: Invertebrates, dominated by insects and other arthropods, make up about 95% of described animal species. Vertebrates, though familiar, are a small minority.
- id: bio-q-0838
  lesson: bio-animals
  module_quiz: true
  topic: Animals
  stem: Bilateral symmetry is closely linked to cephalization. Why?
  choices:
  - Bilateral animals cannot move, so they need a brain to catch food.
  - Radial animals have more sense organs than bilateral ones.
  - An animal that moves head-first benefits from sense organs and nerve cells concentrated at the front end.
  - Cephalization requires a shell to protect it.
  answer: 2
  explanation: A bilateral body has a front end that meets new surroundings first, so concentrating senses and nerve cells there (cephalization) pays off. Radial animals such as jellyfish meet the world from all sides and lack a head.
- id: bio-q-0839
  lesson: bio-animals
  topic: Animals
  stem: Which animal has bilateral symmetry but no body cavity of any kind?
  choices:
  - An earthworm
  - A jellyfish
  - A flatworm
  - A crab
  answer: 2
  explanation: Flatworms are bilateral with no body cavity between gut and body wall. Earthworms and crabs have a true coelom, and jellyfish are radially symmetric.
- id: bio-q-0840
  lesson: bio-animals
  module_quiz: true
  topic: Animals
  stem: Which feature do all chordates have at some stage of their lives?
  choices:
  - A backbone
  - Four limbs
  - A notochord
  - Lungs
  answer: 2
  explanation: All chordates have a notochord, dorsal hollow nerve cord, pharyngeal slits and post-anal tail at some stage. Lancelets and sea squirts are chordates with no backbone, and fish have neither four limbs nor (in most) lungs.
- id: bio-q-0841
  lesson: bio-animals
  topic: Animals
  stem: Why was the evolution of the amniotic egg important?
  choices:
  - It allowed fish to breathe air.
  - It made animals endothermic.
  - It let vertebrates reproduce on land without needing water for their eggs.
  - It allowed fertilization to occur outside the body.
  answer: 2
  explanation: The amnion and other membranes surround the embryo with its own fluid and handle gas exchange and wastes, so reptiles (including birds) and mammals could reproduce away from water. It is unrelated to air breathing and endothermy, and amniotic eggs are fertilized internally.
- id: bio-q-0842
  lesson: bio-animals
  topic: Animals
  stem: As a room is cooled from 25 °C to 5 °C, an animal's oxygen consumption at rest rises steadily. The animal is most likely
  choices:
  - an ectotherm whose metabolism speeds up in the cold
  - an ectotherm becoming more active to find warmth
  - an endotherm whose body temperature is falling with the air
  - an endotherm burning more fuel to hold its body temperature
  answer: 3
  explanation: An endotherm keeps its body near a constant temperature, so in colder air it loses heat faster and must raise its metabolism, using more oxygen. An ectotherm's metabolism slows in the cold, and an endotherm's body temperature stays nearly constant.
- id: bio-q-0843
  lesson: bio-animals
  topic: Animals
  stem: 'Key: 1a. Jointed legs: go to 2. 1b. No jointed legs: go to 3. 2a. Eight legs: spider. 2b. Six legs: insect. 3a. Segmented body: earthworm. 3b. Unsegmented soft body with a shell: snail. An animal has no jointed legs and a soft, unsegmented body with a coiled shell. What is it?'
  choices:
  - Earthworm
  - Snail
  - Insect
  - Spider
  answer: 1
  explanation: Step 1b (no jointed legs) leads to 3, and 3b (unsegmented, shell) gives snail. Each step of a dichotomous key offers two mutually exclusive choices based on observable features.
- id: bio-q-0844
  lesson: bio-animals
  module_quiz: true
  topic: Animals
  stem: A marine animal has tube feet and is radially symmetric as an adult, but its larvae are bilateral. In its embryo, the first opening becomes the anus. To which phylum does it belong?
  choices:
  - Cnidaria
  - Echinodermata
  - Mollusca
  - Arthropoda
  answer: 1
  explanation: Tube feet, adult radial symmetry with bilateral larvae, and deuterostome development identify an echinoderm (like a sea star). Cnidarians are radial throughout and have no tube feet; mollusks and arthropods are protostomes.
- id: bio-q-0845
  lesson: bio-animals
  topic: Animals
  stem: Why are sea stars considered closer relatives of humans than insects are?
  choices:
  - Sea stars have a backbone.
  - Sea stars and humans both have radial symmetry as adults.
  - Sea stars and chordates are both deuterostomes, sharing a pattern of embryo development and DNA evidence of common ancestry.
  - Insects have no body cavity.
  answer: 2
  explanation: Echinoderms and chordates are deuterostomes, a lineage confirmed by DNA. Sea stars have no backbone, humans are bilateral, and insects do have a coelom.
- id: bio-q-0846
  lesson: bio-animals
  topic: Animals
  stem: Where do birds fit on the vertebrate evolutionary tree?
  choices:
  - Within the reptiles, as descendants of feathered dinosaurs
  - On a separate branch closer to mammals than to reptiles
  - Within the amphibians
  - As the ancestors of all reptiles
  answer: 0
  explanation: Birds descend from feathered theropod dinosaurs, so they sit inside the reptile branch; crocodiles are their closest living relatives. Birds and mammals are both endothermic, but they evolved it separately.
- id: bio-q-0847
  lesson: bio-animals
  topic: Animals
  stem: Why must a growing grasshopper molt?
  choices:
  - Its skin dries out every few days.
  - Molting removes parasites from its coelom.
  - Molting is how it reproduces asexually.
  - Its exoskeleton cannot grow, so it must be shed and replaced with a larger one.
  answer: 3
  explanation: An arthropod's chitin exoskeleton is rigid and non-living, so it must be shed periodically for the animal to grow. Molting is not a form of reproduction.
- id: bio-q-0849
  lesson: bio-classification
  type: text
  topic: Classification
  stem: 'Bacteria, Archaea and Eukarya are the three ___ of life, a system proposed by Carl ___ after comparing ribosomal RNA sequences.'
  accept:
    - [domains, domain]
    - [Woese, Carl Woese]
  explanation: 'The three domains are the broadest rank of classification. Carl Woese (with George Fox) found in 1977 that ribosomal RNA splits prokaryotes into two groups as different from each other as either is from eukaryotes, and the three-domain system was formalized in 1990.'
- id: bio-q-0850
  lesson: bio-classification
  module_quiz: true
  type: order
  topic: Classification
  stem: 'Put these taxonomic ranks in order from the broadest (most inclusive) to the narrowest.'
  items: [Domain, Kingdom, Phylum, Class, Order, Family, Genus]
  explanation: 'Domain, kingdom, phylum, class, order, family, genus (and then species): "Dear King Philip Came Over For Good Soup." Each rank sits inside the one before it, so organisms that share a genus also share every rank above it.'
- id: bio-q-0851
  lesson: bio-classification
  module_quiz: true
  type: label
  topic: Bacteria and archaea
  stem: 'Name the numbered parts of this bacterium.'
  image: {src: images/m8-bacterium-blank.svg, alt: 'A rod-shaped bacterium with an outer layer, a wall, a membrane, a tangled loop of DNA in the middle, small dots and a small ring in the cytoplasm, short hair-like projections, and a long whip-like tail.'}
  labels:
    - {x: 47, y: 22, text: Capsule}
    - {x: 20.5, y: 50, text: Cell wall}
    - {x: 43.9, y: 49.4, text: Nucleoid (DNA)}
    - {x: 90.5, y: 50, text: Flagellum}
    - {x: 45.5, y: 90, text: Pilus}
  distractors: [Nucleus, Mitochondrion]
  explanation: '1 is the sticky outer capsule; 2 is the cell wall just inside it (peptidoglycan in most bacteria); 3 is the nucleoid, where the circular chromosome lies with no membrane around it; 4 is the flagellum, which spins to move the cell; 5 is a pilus, used for attachment. Bacteria have no nucleus and no mitochondria.'
- id: bio-q-0852
  lesson: bio-classification
  topic: Viruses
  stem: 'Which statements are true of all viruses? Select all that apply.'
  choices:
    - They contain genetic material, either DNA or RNA.
    - Their genetic material is enclosed in a protein coat.
    - They have their own ribosomes.
    - They can reproduce only inside a host cell.
    - They are wrapped in a membrane envelope.
  answer: [0, 1, 3]
  explanation: 'Every virus has DNA or RNA inside a protein capsid and can multiply only by using a host cell''s machinery. No virus has ribosomes. Only some viruses, such as influenza and HIV, have an envelope; bacteriophages and many others do not.'
- id: bio-q-0853
  lesson: bio-classification
  type: match
  topic: Viruses
  stem: 'Match each term to its description.'
  pairs:
    - [Lytic cycle, Viral genes take over at once and the cell bursts]
    - [Lysogenic cycle, Viral DNA is copied along with the host chromosome]
    - [Binary fission, A prokaryote copies its chromosome and splits in two]
    - [Plasmid, A small extra circle of DNA in a bacterium]
  distractors: [A membrane that surrounds the bacterial chromosome]
  explanation: 'Lytic infections kill the host quickly; lysogenic ones hide in its chromosome until triggered. Binary fission is how prokaryotes divide, without mitosis. Plasmids are small DNA circles that often carry genes such as antibiotic resistance. Bacteria have no membrane around their chromosome.'
- id: bio-q-0854
  lesson: bio-protists-fungi
  type: text
  topic: Fungi
  stem: 'A fungus is built from thread-like filaments called ___; the branching mass they form is called a ___.'
  accept:
    - [hyphae, hypha]
    - [mycelium, mycelia]
  explanation: 'Hyphae are the threads (one is a hypha); together they form the mycelium, the main body of the fungus. A mushroom is only the fruiting body the mycelium sends up.'
- id: bio-q-0855
  lesson: bio-protists-fungi
  module_quiz: true
  type: match
  topic: Protists
  stem: 'Match each protist to the way it moves.'
  pairs:
    - [Amoeba, Pseudopods]
    - [Paramecium, Cilia]
    - [Euglena, Flagellum]
  distractors: [Hyphae]
  explanation: 'An amoeba flows into extensions of its cytoplasm (pseudopods); a Paramecium is covered with short beating cilia; Euglena swims with a long whip-like flagellum. Hyphae are fungal filaments, not a way of moving.'
- id: bio-q-0856
  lesson: bio-protists-fungi
  type: label
  topic: Fungi
  stem: 'Name the numbered parts of this fungus.'
  image: {src: images/m8-mushroom-blank.svg, alt: 'A mushroom growing from soil, with tiny particles falling from the underside of its top, and a network of threads spreading through the soil below.'}
  labels:
    - {x: 50, y: 19.7, text: Cap}
    - {x: 57.8, y: 34.2, text: Gills}
    - {x: 37.5, y: 47.9, text: Spores}
    - {x: 50, y: 48.7, text: Stalk}
    - {x: 75, y: 84.2, text: Mycelium}
  distractors: [Root, Seed]
  explanation: 'The cap and stalk hold up the gills, where spores form and fall. The cap, gills and stalk together are the fruiting body; most of the fungus is the mycelium of hyphae in the soil. Fungi have no roots and make spores, not seeds.'
- id: bio-q-0857
  lesson: bio-protists-fungi
  topic: Fungi
  stem: 'Which features do fungi share with animals but not with plants? Select all that apply.'
  choices:
    - They are heterotrophs.
    - They store food as glycogen.
    - Their cells have cell walls.
    - They make food by photosynthesis.
  answer: [0, 1]
  explanation: 'Fungi and animals both get food from other organisms and store it as glycogen, clues to their close relationship. Plants also have cell walls (cellulose rather than chitin), and fungi never photosynthesize.'
- id: bio-q-0858
  lesson: bio-protists-fungi
  module_quiz: true
  type: order
  topic: Protists
  stem: 'Put these stages of the malaria parasite''s life cycle in order, starting with the mosquito bite.'
  items:
    - A mosquito injects parasites into a person
    - Parasites multiply in the liver
    - Parasites invade and burst red blood cells
    - Some parasites become sexual forms
    - A feeding mosquito takes up the sexual forms
  explanation: 'Plasmodium multiplies first in the liver, then in repeated rounds inside red blood cells (the bursting causes the fevers). Sexual forms in the blood are swallowed by a biting mosquito, where they fuse and develop, ready for the next bite.'
- id: bio-q-0859
  lesson: bio-plants
  module_quiz: true
  type: label
  topic: Plants
  stem: 'Name the numbered parts of this flower, shown cut in half lengthwise.'
  image: {src: images/m8-flower-blank.svg, alt: 'A flower cut lengthwise: petals on each side, two stalks ending in oval heads, a central column rising from a swollen base that holds small oval bodies, and green structures under the flower on top of a stem.'}
  labels:
    - {x: 36.9, y: 29.6, text: Anther}
    - {x: 40.9, y: 47.8, text: Filament}
    - {x: 50, y: 21.3, text: Stigma}
    - {x: 50, y: 36, text: Style}
    - {x: 53.6, y: 57.8, text: Ovary}
    - {x: 27.3, y: 37, text: Petal}
  distractors: [Sepal, Receptacle]
  explanation: 'The stamen is an anther (1, makes pollen) on a filament (2). The carpel is a sticky stigma (3) that catches pollen, a style (4), and an ovary (5) that holds the ovules and later becomes the fruit. Petals (6) often attract animals. Sepals are the green leaf-like parts below the petals.'
- id: bio-q-0860
  lesson: bio-plants
  type: label
  topic: Plants
  stem: 'Name the numbered tissues and cells in this leaf cross-section.'
  image: {src: images/m8-leaf-blank.svg, alt: 'A leaf cross-section: a thin waxy layer and a row of clear cells on top, a row of tall green cells, loosely packed round green cells with air spaces, a vein in the middle with large and small cells, and a bottom row of cells with a pore between two small cells.'}
  labels:
    - {x: 50, y: 15.8, text: Upper epidermis}
    - {x: 30, y: 36, text: Palisade mesophyll}
    - {x: 20, y: 68, text: Spongy mesophyll}
    - {x: 46.9, y: 54.7, text: Xylem}
    - {x: 46.9, y: 68.5, text: Phloem}
    - {x: 76.9, y: 83.6, text: Guard cell}
  distractors: [Root hair, Cuticle]
  explanation: 'The clear upper epidermis (1) lies under the waxy cuticle. Tall palisade cells (2) hold most chloroplasts; loose spongy cells (3) leave air spaces for gas exchange. In the vein, xylem (4, larger cells, upper side) brings water and phloem (5, smaller cells, lower side) carries sugar away. Guard cells (6) open and close each stoma. The cuticle is the thin top layer, not a numbered part, and root hairs are on roots.'
- id: bio-q-0861
  lesson: bio-plants
  type: order
  topic: Plants
  stem: 'Put the stages of alternation of generations in order, starting with the sporophyte.'
  items:
    - The diploid sporophyte makes spores by meiosis
    - A haploid spore grows into a gametophyte
    - The gametophyte makes eggs and sperm by mitosis
    - An egg and sperm fuse at fertilization
    - The diploid zygote grows into a new sporophyte
  explanation: 'Meiosis in the sporophyte makes haploid spores; a spore grows by mitosis into a haploid gametophyte, which makes gametes by mitosis; fertilization restores the diploid number in the zygote, which grows into the next sporophyte.'
- id: bio-q-0862
  lesson: bio-plants
  type: text
  topic: Plants
  stem: 'Water and minerals travel up from the roots in the ___, while sugars travel from sources to sinks in the ___.'
  accept:
    - [xylem]
    - [phloem]
  explanation: 'Xylem (dead, lignin-walled tubes) carries water up, pulled by transpiration. Phloem (living sieve tubes) carries sugar from where it is made or stored to where it is used, up or down.'
- id: bio-q-0863
  lesson: bio-plants
  topic: Plants
  stem: 'Which changes would increase the transpiration rate of a well-watered plant? Select all that apply.'
  choices:
    - A fan blowing across the leaves
    - Higher humidity around the leaves
    - A rise in air temperature
    - Moving the plant into darkness
    - Brighter light on the leaves
  answer: [0, 2, 4]
  explanation: 'Wind sweeps away humid air, warmth speeds evaporation, and bright light opens stomata, so all three raise transpiration. Humid air slows evaporation, and darkness closes stomata.'
- id: bio-q-0864
  lesson: bio-animals
  module_quiz: true
  type: label
  topic: Animals
  stem: 'This simplified lancelet shows the features that define chordates. Name the numbered structures.'
  image: {src: images/m8-chordate-blank.svg, alt: 'A simplified fish-shaped animal with two long rods running along its back, a block of vertical slits behind the mouth, a tube running from there to an opening on the underside, and a tapering rear end.'}
  labels:
    - {x: 42.9, y: 43, text: Dorsal hollow nerve cord}
    - {x: 57.1, y: 50.3, text: Notochord}
    - {x: 22.9, y: 63.3, text: Pharyngeal slits}
    - {x: 84.3, y: 56.7, text: Post-anal tail}
    - {x: 50, y: 62.3, text: Gut}
  distractors: [Vertebral column, Heart]
  explanation: 'The hollow nerve cord (1) runs along the back above the notochord (2), the flexible supporting rod. Pharyngeal slits (3) open from the throat. The gut (5) leads to the anus, and the tail (4) continues past it. A lancelet has no vertebral column; that is why it counts as an invertebrate chordate.'
- id: bio-q-0865
  lesson: bio-animals
  type: match
  topic: Animals
  stem: 'Match each phylum to an example animal.'
  pairs:
    - [Cnidaria, Jellyfish]
    - [Mollusca, Octopus]
    - [Annelida, Earthworm]
    - [Arthropoda, Crab]
    - [Echinodermata, Sea urchin]
  distractors: [Sponge]
  explanation: 'Jellyfish are cnidarians (stinging cells, radial symmetry); octopuses are mollusks (as are snails and clams); earthworms are segmented annelids; crabs are arthropods with jointed legs; sea urchins are echinoderms. Sponges belong to a different phylum, Porifera.'
- id: bio-q-0866
  lesson: bio-animals
  type: text
  topic: Animals
  stem: 'An animal that keeps a nearly constant body temperature using heat from its own metabolism, such as a bird or a mammal, is called an ___.'
  accept: [endotherm, endotherms, endothermic animal]
  explanation: 'Endotherms generate most of their body heat internally. Ectotherms, such as lizards, get most of their heat from their surroundings, though behavior like basking can make them warm.'
- id: bio-q-0867
  lesson: bio-animals
  module_quiz: true
  topic: Animals
  stem: 'Which of these animals are deuterostomes? Select all that apply.'
  choices: [Sea star, Human, Earthworm, Shark, Snail]
  answer: [0, 1, 3]
  explanation: 'Deuterostomes are the echinoderms (sea star) and the chordates (human, shark). Earthworms (annelids) and snails (mollusks) are protostomes, whose first embryonic opening becomes the mouth.'
- id: bio-q-0868
  lesson: bio-animals
  type: order
  topic: Animals
  stem: 'Put these features in the order they first appeared in the evolution of the lineage leading to reptiles and mammals.'
  items: [Notochord, Jaws, Four limbs, Amniotic egg]
  explanation: 'The notochord is a chordate feature, older than vertebrates. Jaws evolved in fish, four limbs in the first tetrapods (with amphibians as living descendants), and the amniotic egg in the ancestors of reptiles, birds and mammals, freeing reproduction from water.'
- id: bio-qh-0801
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: Boysen-Jensen cut off coleoptile tips, placed a thin layer of gelatin between each tip and its stump, and lit the seedlings from one side. They still bent toward the light. What does this show?
  choices:
    - The signal from the tip can cross a nonliving gap, so it is probably a chemical.
    - The signal travels as an electrical impulse along living cells.
    - The gelatin itself causes bending.
    - The stump, not the tip, senses the light.
  answer: 0
  explanation: An electrical or cell-to-cell signal could not pass through gelatin, but a dissolved chemical can diffuse across it. Gelatin alone without a tip causes no bending, and earlier work had already shown that the tip senses light.
- id: bio-qh-0802
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: 'Coleoptile tips are placed on agar blocks and the auxin collected is measured. A tip in darkness yields 30 units. A tip lit from one side yields 30 units. A tip lit from one side, with a barrier in only its lower part separating two blocks, yields 10 units on the lit side and 20 on the shaded side. Which conclusion is best supported?'
  choices:
    - Light destroys auxin on the lit side.
    - Light makes the tip produce extra auxin on the shaded side.
    - Light causes auxin to move toward the shaded side, with no change in the total.
    - Light causes auxin to move toward the lit side.
  answer: 2
  explanation: 'The total is 30 in every case ($10 + 20 = 30$), so auxin is neither destroyed nor newly made; it is redistributed toward the shade, as the Cholodny-Went hypothesis predicts. More ends up on the shaded side, not the lit side.'
- id: bio-qh-0803
  lesson: bio-h-plant-physiology
  topic: Plant responses
  stem: A seedling root is laid horizontally, and auxin collects on its lower side. Why does the root curve downward?
  choices:
    - Auxin makes the lower cells elongate faster, pushing the tip down.
    - Root cells are very sensitive to auxin, so the extra auxin slows elongation on the lower side and the upper side outgrows it.
    - Gravity pulls the root tip down because it is heavier than the rest of the root.
    - Auxin dissolves the cell walls on the lower side.
  answer: 1
  explanation: In roots, the auxin increase that would speed shoot cells inhibits elongation. The upper side grows faster, so the root bends down. In a shoot the same redistribution speeds the lower side, so the shoot bends up. Gravity is sensed by settling starch grains; it doesn't pull the root into shape.
- id: bio-qh-0804
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: Auxin applied to the end of a stem segment that was nearer the shoot tip moves through to the other end, even when the segment is turned upside down. Auxin applied to the other end barely moves. What explains this?
  choices:
    - Auxin is heavier than water and sinks.
    - Auxin diffuses equally in both directions.
    - Transpiration carries auxin upward in the xylem.
    - Carrier proteins that export auxin sit at the lower (basal) end of each cell, so transport runs one way.
  answer: 3
  explanation: This is polar auxin transport. PIN carrier proteins concentrated at the basal end of cells pass auxin from cell to cell toward the base, regardless of orientation, so gravity and simple diffusion can't explain it. The xylem carries water upward, the opposite direction.
- id: bio-qh-0805
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: According to the acid growth hypothesis, what would a drug that blocks the plasma membrane proton pumps do to stem segments treated with auxin?
  choices:
    - Prevent the rapid auxin-induced elongation, because the cell walls would not be acidified and loosened
    - Make the segments elongate faster, because more protons stay inside the cells
    - Have no effect, because auxin acts only by changing gene expression
    - Make the segments bend toward light
  answer: 0
  explanation: Auxin activates proton pumps; the acidified wall activates expansins that loosen it, and turgor stretches the cell. Blocking the pumps blocks the fast response. Auxin also changes gene expression, but over hours, not minutes.
- id: bio-qh-0806
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: Pieces of tobacco tissue are grown on a medium with a high ratio of cytokinin to auxin. What will they most likely form?
  choices:
    - Roots
    - An undifferentiated mass of dividing cells
    - Shoots
    - Flowers
  answer: 2
  explanation: Skoog and Miller found that a high cytokinin-to-auxin ratio gives shoots, a high auxin-to-cytokinin ratio gives roots, and an intermediate ratio gives a mass of dividing cells. Flowering depends on other signals.
- id: bio-qh-0807
  lesson: bio-h-plant-physiology
  topic: Plant hormones
  stem: A corn mutant cannot make abscisic acid. What would you expect to see?
  choices:
    - Fruits that never ripen
    - Kernels that sprout while still on the cob
    - Stems that grow extremely tall
    - Leaves that never fall off
  answer: 1
  explanation: Abscisic acid keeps seeds dormant, so mutants lacking it germinate on the cob. Ripening and leaf drop are mainly ethylene's job, and tall stems point to gibberellin.
- id: bio-qh-0808
  lesson: bio-h-plant-physiology
  topic: Plant responses
  stem: A short-day plant with a critical night length of 10 hours is grown with 9 hours of light and 15 hours of darkness, but a brief flash of red light is given 7 hours into each night. Predict the result.
  choices:
    - It does not flower, because the longest unbroken dark period is only 8 hours.
    - It flowers, because the total darkness is 15 hours.
    - It flowers, because the day is shorter than 12 hours.
    - It does not flower, because red light destroys florigen.
  answer: 0
  explanation: The flash splits the night into 7 and 8 hours, both shorter than the 10-hour critical night, so the plant behaves as if nights were short. What counts is unbroken darkness, not total darkness or day length. The flash acts through phytochrome, not by destroying florigen.
- id: bio-qh-0809
  lesson: bio-h-plant-physiology
  topic: Water transport
  stem: 'Ignoring friction, what pressure difference is needed just to hold up a column of water in the xylem of an 80 m tree? (Use $\rho = 1000$ kg/m³, $g = 9.81$ m/s².)'
  choices:
    - 7.8 MPa
    - 0.078 MPa
    - 78 MPa
    - 0.78 MPa
  answer: 3
  explanation: '$\rho g h = 1000 \times 9.81 \times 80 = 784\,800$ Pa $\approx 0.78$ MPa, about 0.01 MPa per meter. The other choices are off by powers of ten, the usual slip when converting pascals to megapascals ($1 \text{ MPa} = 10^{6}$ Pa).'
- id: bio-qh-0810
  lesson: bio-h-plant-physiology
  topic: Water transport
  stem: A suction pump at the top of a pipe cannot raise water more than about 10 m, yet trees move water over 100 m up. What does this imply about the water in their xylem?
  choices:
    - It is pushed up by root pressure of more than 10 MPa.
    - It is under tension (negative pressure), held together by cohesion between water molecules.
    - It moves up as water vapor rather than liquid.
    - It is pumped by living xylem cells that contract.
  answer: 1
  explanation: Suction can only lower pressure toward zero, which atmospheric pressure turns into about 10 m of lift. Higher columns must be pulled from above, putting the water under negative pressure that cohesion withstands. Root pressure is at most a few tenths of a megapascal, water moves as liquid in the xylem, and xylem conduits are dead.
- id: bio-qh-0811
  lesson: bio-h-plant-physiology
  type: text
  topic: Plant responses
  stem: 'The plant pigment that is converted to its active form by red light and back to its inactive form by far-red light is called ___.'
  accept: [phytochrome, phytochromes]
  explanation: 'Phytochrome switches between Pr (absorbs red, about 660 nm) and the active Pfr (absorbs far-red, about 730 nm). The blue-light receptors behind phototropism are different proteins, the phototropins.'
- id: bio-qh-0812
  lesson: bio-h-plant-physiology
  type: match
  topic: Plant hormones
  stem: 'Match each plant hormone to one of its main effects.'
  pairs:
    - [Auxin, Elongation of shoot cells on the shaded side]
    - [Gibberellin, Stem lengthening and cereal seed germination]
    - [Cytokinin, Cell division and delaying leaf aging]
    - [Abscisic acid, Closing stomata during drought]
    - [Ethylene, Fruit ripening and leaf drop]
  explanation: 'Auxin drives phototropism by elongating shaded-side cells; gibberellins lengthen stems and trigger amylase in germinating grain; cytokinins promote division and delay leaf aging; abscisic acid closes stomata and keeps seeds dormant; ethylene, a gas, ripens fruit and causes leaves to drop.'
- id: bio-qh-0813
  lesson: bio-h-plant-physiology
  type: order
  topic: Water transport
  stem: 'Put the steps of stomatal opening in order, starting with the light signal.'
  items:
    - Blue light switches on proton pumps in the guard cells
    - Potassium and chloride ions enter the guard cells
    - Water enters the guard cells by osmosis
    - The swollen guard cells bow apart and the pore opens
  explanation: 'Proton pumping drives ion uptake; the extra solute lowers the guard cells'' water potential so water flows in; the hoop-reinforced walls make the swelling cells bow apart. Abscisic acid reverses the sequence by letting ions out.'
- id: bio-qh-0814
  lesson: bio-h-plant-physiology
  topic: Water transport
  stem: 'Which observations support the cohesion-tension mechanism? Select all that apply.'
  choices:
    - When a transpiring twig is cut, the sap snaps back from the cut surface.
    - In a pressure chamber, pressure must be applied to push sap back to the cut end of a shoot.
    - Droplets appear at leaf edges on humid mornings.
    - Xylem conduits are living cells that squeeze water upward.
    - Water in narrow tubes can hold together under tensions of tens of megapascals.
  answer: [0, 1, 4]
  explanation: 'Sap snapping back and the pressure chamber both show the xylem water was under tension, and the measured strength of water shows a stretched column can survive. Guttation droplets come from root pressure, a push from below, and xylem conduits are dead at maturity.'
- id: bio-qh-0815
  lesson: bio-h-plant-physiology
  topic: Plant responses
  stem: 'A long-day plant has a critical night length of 11 hours. Under which 24-hour schedules will it flower? Select all that apply.'
  choices:
    - 16 hours light, 8 hours dark
    - 8 hours light, 16 hours dark
    - 8 hours light, 16 hours dark, with a red flash in the middle of the night
    - 8 hours light, 16 hours dark, with a red flash followed at once by a far-red flash in the middle of the night
    - 12 hours light, 12 hours dark
  answer: [0, 2]
  explanation: 'A long-day plant needs nights shorter than 11 hours. The 8-hour night qualifies, and a red flash splits a 16-hour night into two 8-hour pieces. Far-red right after red cancels the flash, so that night counts as 16 hours, and a 12-hour night is still too long.'
- id: bio-qh-0816
  lesson: bio-h-microbes
  topic: Viral replication
  stem: Why can the number of plaques on a plate be used to count the phages that were spread on it?
  choices:
    - Each plaque is a colony of phages growing on the agar.
    - Plaques form only where two phages land together.
    - Each plaque starts from one phage infecting one cell, whose offspring then kill the cells around it.
    - Each plaque is one bacterium that resisted infection.
  answer: 2
  explanation: One phage infects a cell, bursts it, and the released phages infect the neighbors, clearing a spot in the bacterial lawn. One plaque, one starting phage. Phages can't grow on agar by themselves, and a plaque is where bacteria died, not where they survived.
- id: bio-qh-0817
  lesson: bio-h-microbes
  topic: Viral replication
  stem: 'A culture has $4.0 \times 10^{5}$ infected cells per mL. After every cell has burst, a sample is diluted to $10^{-4}$, and 0.1 mL is plated with bacteria, giving 96 plaques. What is the burst size?'
  choices:
    - 2.4 phages per cell
    - 96 phages per cell
    - 240 phages per cell
    - 24 phages per cell
  answer: 3
  explanation: 'Phages per mL $= \dfrac{96}{10^{-4} \times 0.1} = 9.6 \times 10^{6}$ PFU/mL. Burst size $= \dfrac{9.6 \times 10^{6}}{4.0 \times 10^{5}} = 24$. Forgetting the 0.1 mL gives 2.4; using one extra factor of ten in the dilution gives 240; 96 is just the plaque count.'
- id: bio-qh-0818
  lesson: bio-h-microbes
  topic: Viral replication
  stem: When many lambda phages infect each cell in a culture, more of the infections become lysogenic. Why is this a sensible strategy for the phage?
  choices:
    - Many phages per cell signals that uninfected hosts are scarce, so staying inside the current host pays better than bursting it.
    - Many phages per cell provide enough DNA to fill the bacterial chromosome.
    - The bacteria kill phages faster when many attack at once.
    - Lysogeny produces more new phages per cell than lysis does.
  answer: 0
  explanation: Lysogeny is a bet on the host's future. If few fresh hosts remain, offspring released by lysis would find nothing to infect, so riding along as a prophage is better. Lysogeny releases no phages until induction, and it isn't about filling the chromosome.
- id: bio-qh-0819
  lesson: bio-h-microbes
  topic: Viral replication
  stem: A harmless strain of a bacterium becomes toxin-producing after it is infected by a particular temperate phage. What best explains this?
  choices:
    - The phage mutated the bacterium's own genes into toxin genes.
    - The phage carries the toxin gene, which is expressed from the prophage in the host chromosome.
    - The infection weakened the bacterium, releasing toxins it had stored.
    - Toxins are made only by phages, never by bacteria.
  answer: 1
  explanation: This is lysogenic conversion. The toxin genes for cholera, diphtheria and Shiga toxin all travel on phages and are made by the bacterium once the prophage is in place. The phage doesn't invent new genes from the host's, and the toxin is made by the bacterial cell.
- id: bio-qh-0820
  lesson: bio-h-microbes
  topic: Viral replication
  stem: 'HIV reverse transcriptase makes about $3 \times 10^{-5}$ errors per base copied, and the genome is about 9,700 bases long. About how many new mutations does each new copy of the genome carry on average?'
  choices:
    - About 3
    - About 30
    - About 0.3, roughly one new mutation per three genomes copied
    - About 0.003
  answer: 2
  explanation: '$9700 \times 3 \times 10^{-5} \approx 0.29$. With billions of copies made each day, every possible single mutation appears many times, which is why one drug alone soon fails. The other choices misplace the decimal point.'
- id: bio-qh-0821
  lesson: bio-h-microbes
  topic: Viral replication
  stem: Antiretroviral drugs can suppress HIV to undetectable levels for decades, yet stopping treatment lets the virus return. Why?
  choices:
    - The drugs stop working after a few years.
    - Integrated provirus in resting cells is not touched by drugs that block replication, and it can restart production later.
    - HIV hides inside red blood cells.
    - The drugs only slow the virus and never stop it multiplying.
  answer: 1
  explanation: Drugs block steps such as reverse transcription, integration and maturation, but a provirus already integrated into a quiet cell's chromosome isn't replicating. When treatment stops, such cells can produce virus again. Red blood cells have no nucleus and aren't HIV targets.
- id: bio-qh-0822
  lesson: bio-h-microbes
  topic: Viral replication
  stem: What two conditions make antigenic shift possible in influenza?
  choices:
    - A proofreading polymerase and a DNA genome
    - Infection of red blood cells and a lysogenic cycle
    - A single long RNA genome and a very slow mutation rate
    - A genome in separate segments, and two different strains infecting the same cell
  answer: 3
  explanation: When two strains infect one cell, their eight RNA segments can be packaged in new combinations, producing a virus with surface proteins few people have immunity to. Gradual point mutations cause antigenic drift instead. Influenza has an RNA genome without proofreading.
- id: bio-qh-0823
  lesson: bio-h-microbes
  topic: Antibiotic resistance
  stem: 'An infection contains $10^{10}$ bacteria. Resistance to drug A arises in 1 cell in $10^{7}$ and resistance to drug B in 1 cell in $10^{6}$, independently. About how many cells are expected to resist both drugs before treatment starts?'
  choices:
    - $10^{-3}$, so almost certainly none
    - $10^{3}$
    - $10^{4}$
    - $10^{-13}$
  answer: 0
  explanation: 'Double resistance needs both mutations in one cell: $10^{-7} \times 10^{-6} = 10^{-13}$ per cell, so $10^{10} \times 10^{-13} = 10^{-3}$ cells. That is why combination therapy works. $10^{3}$ and $10^{4}$ are the counts resistant to drug A or drug B alone; $10^{-13}$ is the per-cell probability, not the expected number.'
- id: bio-qh-0824
  lesson: bio-h-microbes
  topic: Antibiotic resistance
  stem: In a fluctuation test, separate cultures had resistant-colony counts of 0, 0, 2, 0, 85, 1, 0, 4, 0, 0, while samples from a single culture gave counts close to their mean. What does the huge spread among separate cultures show?
  choices:
    - The phage induced resistance in a random fraction of cells.
    - The plates were contaminated unevenly.
    - Resistance mutations arose at random times during growth, before the cells met the phage.
    - Resistance is inherited only by some daughter cells.
  answer: 2
  explanation: If resistance were induced on contact, every culture would give similar counts, like the samples from one culture. A culture where a mutation happened early grows a "jackpot" of resistant descendants, while most cultures have none, exactly as seen. The phage selects resistance; it doesn't create it.
- id: bio-qh-0825
  lesson: bio-h-microbes
  topic: Antibiotic resistance
  stem: A study finds that people with a certain illness have less diverse gut bacteria than healthy people. Which conclusion is justified by this finding alone?
  choices:
    - Low diversity causes the illness.
    - The illness causes low diversity.
    - Probiotics would cure the illness.
    - The two are associated, but the study can't show which causes which, or whether something else causes both.
  answer: 3
  explanation: An observational comparison shows a correlation. The illness, its treatment, diet or another factor could change the microbiome, or the microbiome could contribute to illness. Experiments, such as transferring microbes into germ-free mice, are needed to test causation.
- id: bio-qh-0826
  lesson: bio-h-microbes
  type: text
  topic: Viral replication
  stem: 'The HIV enzyme that copies the viral RNA genome into DNA is called ___.'
  accept: [reverse transcriptase, RT]
  explanation: 'Reverse transcriptase makes DNA from an RNA template, the reverse of transcription. Integrase then inserts the DNA into a host chromosome. Reverse transcriptase inhibitors such as AZT were the first HIV drugs.'
- id: bio-qh-0827
  lesson: bio-h-microbes
  type: match
  topic: Antibiotic resistance
  stem: 'Match each kind of horizontal gene transfer to what happens.'
  pairs:
    - [Conjugation, A plasmid passes from one cell to another through a pilus]
    - [Transformation, A cell takes up naked DNA from its surroundings]
    - [Transduction, A phage carries bacterial DNA to a new host cell]
  distractors: [A cell splits into two identical daughter cells]
  explanation: 'All three move genes between existing cells, often between species, which is how resistance genes spread quickly. Splitting into two identical cells is binary fission, which passes genes only from parent to offspring.'
- id: bio-qh-0828
  lesson: bio-h-microbes
  type: order
  topic: Viral replication
  stem: 'Put the steps of the HIV replication cycle in order.'
  items:
    - The virus binds CD4 and a coreceptor, and its envelope fuses with the cell membrane
    - Reverse transcriptase copies the RNA genome into DNA
    - Integrase inserts the DNA into a host chromosome
    - Host enzymes transcribe viral genes and viral proteins are made
    - New particles bud from the cell
    - Protease cuts the viral polyproteins and the particle matures
  explanation: 'Entry, reverse transcription, integration (the provirus), expression of viral genes, budding, then maturation by protease. Drug classes block entry, reverse transcription, integration or maturation.'
- id: bio-qh-0829
  lesson: bio-h-microbes
  topic: Antibiotic resistance
  stem: 'Which of these are ways bacteria resist antibiotics? Select all that apply.'
  choices:
    - Making an enzyme that destroys the drug
    - Pumping the drug out of the cell
    - Altering the drug's target so it binds poorly
    - Waiting for the antibiotic to cause the needed mutation
    - Moving the target into the nucleus, where the drug cannot reach
  answer: [0, 1, 2]
  explanation: 'Beta-lactamases destroy penicillins, efflux pumps push drugs out, and altered targets (such as MRSA''s wall-building enzyme) resist binding. Antibiotics select existing mutations rather than causing the needed ones, and bacteria have no nucleus.'
- id: bio-qh-0830
  lesson: bio-h-microbes
  topic: Antibiotic resistance
  stem: 'Which of these are well-established roles of human gut bacteria? Select all that apply.'
  choices:
    - Fermenting dietary fiber into short-chain fatty acids
    - Making vitamin K
    - Producing the body's insulin
    - Helping the immune system develop
    - Crowding out disease-causing microbes
  answer: [0, 1, 3, 4]
  explanation: 'Gut bacteria ferment fiber we can''t digest, make vitamin K, shape immune development (germ-free mice have underdeveloped immune tissues) and resist invaders such as C. difficile. Insulin is made by the pancreas, not by gut bacteria.'
