- id: bio-q-1001
  lesson: bio-ecosystems
  module_quiz: true
  topic: Ecosystems
  stem: 'In the food chain grass → rabbit → fox, what do the arrows show?'
  choices: ['The direction energy moves, from the food to the organism that eats it', 'Which organism hunts which, pointing from predator to prey', 'The order in which the organisms evolved', 'The direction in which matter is lost from the ecosystem']
  answer: 0
  explanation: |-
    Food-chain arrows point from the food to the eater, because they show energy (and matter) moving into the consumer. Reading them as "hunts" reverses them, the most common error. They say nothing about evolutionary order, and matter is recycled rather than lost.
- id: bio-q-1002
  lesson: bio-ecosystems
  module_quiz: true
  topic: Energy flow
  stem: 'The producers in a prairie store 80,000 kJ of energy per square meter per year. Using the ten percent rule, about how much energy reaches the secondary consumers?'
  choices: ['8,000 kJ', '800 kJ', '80 kJ', '8 kJ']
  answer: 1
  explanation: |-
    Secondary consumers are two transfers above producers: $80{,}000 \times 0.1 \times 0.1 = 800$ kJ. 8,000 kJ stops after one transfer (that is the primary consumers). 80 kJ takes three transfers, which counts levels instead of steps, and 8 kJ takes four.
- id: bio-q-1003
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'A forest''s plants capture 30,000 kJ per m² per year (gross primary productivity) and use 18,000 kJ per m² per year in their own cellular respiration. What is the net primary productivity?'
  choices: ['48,000 kJ per m² per year', '18,000 kJ per m² per year', '12,000 kJ per m² per year', '3,000 kJ per m² per year']
  answer: 2
  explanation: |-
    NPP = GPP − producer respiration = 30,000 − 18,000 = 12,000 kJ per m² per year. Adding gives 48,000, but respiration is a loss. 18,000 is the respiration itself. 3,000 is 10% of GPP, which confuses NPP with the ten percent rule between trophic levels.
- id: bio-q-1004
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'Which ecological pyramid can never be inverted (wider at the top than at the bottom)?'
  choices: ['Pyramid of numbers', 'Pyramid of biomass', 'All three can be inverted in some ecosystems', 'Pyramid of energy']
  answer: 3
  explanation: |-
    Each trophic level gets its energy from the level below and loses some as heat, so a higher level can never carry more energy flow than the one feeding it. Numbers pyramids invert easily (one tree, thousands of caterpillars), and biomass pyramids can invert in the open ocean.
- id: bio-q-1005
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'In some parts of the open ocean, the zooplankton present at a given moment weigh more than the phytoplankton they eat. How is this possible?'
  choices: ['Phytoplankton reproduce so quickly that they are eaten and replaced many times a year', 'Zooplankton are producers that make their own food', 'Energy flows from zooplankton back to phytoplankton', 'Zooplankton get most of their energy directly from sunlight']
  answer: 0
  explanation: |-
    A biomass pyramid is a snapshot of what is present at one moment. Fast-reproducing phytoplankton have a small standing biomass but a large total production over the year, enough to feed a larger standing mass of zooplankton. Zooplankton are consumers, and energy never flows back down the food chain.
- id: bio-q-1006
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'A rabbit eats 1,000 kJ of grass, but only about 100 kJ ends up as new rabbit tissue. Where does most of the rest go?'
  choices: ['It is destroyed during digestion', 'It is released as heat from the rabbit''s cellular respiration, with some leaving in feces', 'It is stored as fat for the fox', 'It is returned to the grass as sunlight']
  answer: 1
  explanation: |-
    Most absorbed energy powers the rabbit's activity and body heat through cellular respiration and leaves as heat; undigested material leaves in feces and feeds decomposers. Energy is conserved, never destroyed. Fat is part of the 100 kJ of tissue, and energy does not return to plants as sunlight.
- id: bio-q-1007
  lesson: bio-ecosystems
  module_quiz: true
  topic: Ecosystems
  stem: 'Which of these is an abiotic factor in a forest ecosystem?'
  choices: ['A fungus decomposing a log', 'The deer that browse on shrubs', 'The pH of the soil', 'Fallen leaves on the forest floor']
  answer: 2
  explanation: |-
    Soil pH is a nonliving physical and chemical condition. The fungus and deer are living. Fallen leaves are dead but came from living things, so they count as biotic material.
- id: bio-q-1008
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'In Odum''s Silver Springs study, the producers'' gross production was about 20,810 kcal per m² per year and the herbivores'' was about 3,368. About what percent of the producers'' energy reached the herbivores?'
  choices: ['84%', '6.2%', '11%', '16%']
  answer: 3
  explanation: |-
    $3368 \div 20{,}810 \approx 0.16$, or about 16%, a bit above the typical 10%. 84% is the share that was not transferred. 6.2% comes from dividing the wrong way ($20{,}810 \div 3368 \approx 6.2$). 11% is the herbivore-to-carnivore transfer in the same study.
- id: bio-q-1009
  lesson: bio-ecosystems
  module_quiz: true
  topic: Ecosystems
  stem: 'A grizzly bear eats berries in late summer and salmon (which eat smaller fish) in the fall. Which statement about the bear is correct?'
  choices: ['It feeds at more than one trophic level', 'It is a producer because it eats plants', 'It is only a primary consumer', 'It is a decomposer because it eats dead fish']
  answer: 0
  explanation: |-
    Eating berries makes the bear a primary consumer (level 2); eating salmon that eat other fish puts it at level 4 or higher. Omnivores often occupy several levels. Eating plants makes it a consumer, not a producer, and catching live fish is predation, not decomposition.
- id: bio-q-1010
  lesson: bio-ecosystems
  topic: Ecosystems
  stem: 'If all decomposers were removed from an ecosystem, what would happen over time?'
  choices: ['Producers would get more energy, because decomposers no longer take any', 'Nutrients would stay locked in dead material, and producers would run short of them', 'Nothing important, because decomposers are at the top of the food chain', 'Energy would begin to cycle instead of flowing through']
  answer: 1
  explanation: |-
    Decomposers break down dead organisms and wastes and release nutrients such as nitrogen and phosphorus for plants to reuse. Without them, nutrients pile up in dead material and plant growth would eventually stall. Producers get their energy from sunlight, not from decomposers, and energy never cycles.
- id: bio-q-1011
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'A student clips, dries and weighs all plants in four 0.50 m² quadrats and gets a mean dry mass of 120 g per quadrat. What is the estimated biomass density?'
  choices: ['60 g per m²', '120 g per m²', '240 g per m²', '480 g per m²']
  answer: 2
  explanation: |-
    Divide the mean mass by the quadrat area: $120 \text{ g} \div 0.50 \text{ m}^2 = 240$ g per m². 60 multiplies by 0.50 instead of dividing. 120 ignores the quadrat size. 480 adds up all four quadrats without dividing by the area they cover (2.0 m²).
- id: bio-q-1012
  lesson: bio-cycles-populations
  module_quiz: true
  topic: Biogeochemical cycles
  stem: 'Which process removes carbon dioxide from the atmosphere and moves its carbon into food webs?'
  choices: ['Cellular respiration', 'Combustion of fossil fuels', 'Decomposition', 'Photosynthesis']
  answer: 3
  explanation: |-
    Photosynthesis builds CO₂ into sugars, the entry point of carbon into living things. Respiration, decomposition (which is respiration by decomposers) and combustion all release CO₂ to the air.
- id: bio-q-1013
  lesson: bio-cycles-populations
  topic: Biogeochemical cycles
  stem: 'The Mauna Loa CO₂ record rises every year but also dips each Northern Hemisphere spring and summer. What best explains the summer dips?'
  choices: ['Photosynthesis by the large area of northern land plants increases during their growing season', 'People burn less fossil fuel in summer', 'Warm oceans absorb more CO₂ in summer', 'Volcanoes are less active in summer']
  answer: 0
  explanation: |-
    The Northern Hemisphere has most of the world's land plants. In its growing season, photosynthesis outpaces respiration and draws CO₂ down; in fall and winter, decay and respiration dominate. Fuel use does not fall enough to explain it, warm water actually holds less dissolved gas, and volcanoes have no seasons.
- id: bio-q-1014
  lesson: bio-cycles-populations
  module_quiz: true
  topic: Biogeochemical cycles
  stem: 'What happens in nitrogen fixation?'
  choices: ['Plants absorb nitrate from the soil through their roots', 'Bacteria convert nitrogen gas (N₂) into ammonia or ammonium', 'Bacteria convert nitrate back into nitrogen gas', 'Animals excrete nitrogen in urea']
  answer: 1
  explanation: |-
    Fixation turns unusable N₂ into ammonia/ammonium, mostly by bacteria (some in legume root nodules), plus lightning and the industrial Haber–Bosch process. Absorbing nitrate is assimilation, converting nitrate to N₂ is denitrification, and urea excretion is part of returning nitrogen through wastes.
- id: bio-q-1015
  lesson: bio-cycles-populations
  topic: Biogeochemical cycles
  stem: 'Where is denitrification most likely to happen?'
  choices: ['In legume root nodules', 'In lightning strikes', 'In waterlogged, low-oxygen soil', 'In the leaves of plants during photosynthesis']
  answer: 2
  explanation: |-
    Denitrifying bacteria use nitrate in place of oxygen, so they are most active where oxygen is scarce, such as soggy soils and wetland sediments, releasing N₂ back to the air. Root nodules and lightning are sites of nitrogen fixation, the opposite process.
- id: bio-q-1016
  lesson: bio-cycles-populations
  topic: Biogeochemical cycles
  stem: 'Fertilizer runoff reaches a bay, and fish later die in a large low-oxygen dead zone. What is the most direct cause of the low oxygen?'
  choices: ['Nitrate is poisonous to fish', 'Fertilizer reacts with oxygen in the water', 'Algae use up oxygen by photosynthesis', 'Decomposers breaking down the dead algae from blooms use up the oxygen']
  answer: 3
  explanation: |-
    Extra nitrogen fuels algal blooms. When the algae die, decomposers respire as they break them down and consume the dissolved oxygen. This is eutrophication. Photosynthesis releases oxygen rather than using it, and the fertilizer does not react with oxygen directly.
- id: bio-q-1017
  lesson: bio-cycles-populations
  module_quiz: true
  topic: Population ecology
  stem: 'A population of 50 frogs grows by a factor of $\lambda = 1.2$ each year. Using $N_t = N_0\lambda^t$, about how many frogs are there after 3 years?'
  choices: ['86', '80', '180', '104']
  answer: 0
  explanation: |-
    $N_3 = 50 \times 1.2^3 = 50 \times 1.728 = 86.4 \approx 86$. 80 adds 20% of the original 50 each year (linear growth, $50 + 3 \times 10$). 180 multiplies by $1.2 \times 3$. 104 uses 4 years ($50 \times 1.2^4$).
- id: bio-q-1018
  lesson: bio-cycles-populations
  topic: Population ecology
  stem: 'A population follows logistic growth with $r = 0.5$ per year and $K = 1000$. How fast is it growing when $N = 250$?'
  choices: ['125 individuals per year', 'About 94 individuals per year', 'About 31 individuals per year', '375 individuals per year']
  answer: 1
  explanation: |-
    $\frac{dN}{dt} = rN\frac{K-N}{K} = 0.5 \times 250 \times \frac{750}{1000} = 93.75 \approx 94$. 125 is $rN$, the exponential rate that ignores $K$. 31 uses $N/K$ instead of $(K-N)/K$. 375 divides by $N$ instead of $K$, which leaves just $r(K-N)$.
- id: bio-q-1019
  lesson: bio-cycles-populations
  module_quiz: true
  topic: Population ecology
  stem: 'For a population growing logistically toward carrying capacity $K$, at what population size is the number of individuals added per year greatest?'
  choices: ['Very small $N$, near 0', 'Just below $K$', '$N = K/2$', 'Above $K$']
  answer: 2
  explanation: |-
    $dN/dt = rN(K-N)/K$ is a product of $N$ (small when the population is small) and $(K-N)$ (small near $K$); it peaks halfway, at $N = K/2$, the steepest part of the S-curve. Above $K$ the growth rate is negative.
- id: bio-q-1020
  lesson: bio-cycles-populations
  topic: Population ecology
  stem: 'Which of these is a density-independent factor?'
  choices: ['A disease that spreads faster when animals are crowded', 'Competition for nesting sites', 'Predators that focus on the most common prey', 'An early frost that kills 40% of the insects in an area whatever their number']
  answer: 3
  explanation: |-
    A frost kills the same fraction whether the population is large or small, so its effect does not depend on density. Disease, competition and predation all hit harder as density rises, so they are density-dependent.
- id: bio-q-1021
  lesson: bio-cycles-populations
  module_quiz: true
  topic: Population ecology
  stem: 'Biologists catch and band 60 birds, then release them. A week later they catch 45 birds, and 9 have bands. What is the Lincoln–Petersen estimate of the population?'
  choices: ['300', '2,700', '405', '7']
  answer: 0
  explanation: |-
    $N = \frac{MC}{R} = \frac{60 \times 45}{9} = 300$. Check: 9 of 45 (20%) are banded, and 60 is 20% of 300. 2,700 forgets to divide by $R$. 405 is $45 \times 9$, and 7 inverts the formula; a population smaller than the 60 birds already banded is impossible.
- id: bio-q-1022
  lesson: bio-cycles-populations
  topic: Population ecology
  stem: 'Reindeer introduced to St. Matthew Island grew from 29 (1944) to about 6,000 (1963), overgrazed the slow-growing lichen, and crashed to 42 (1966) after a severe winter. Which conclusion do these data best support?'
  choices: ['Reindeer populations are limited only by predators', 'The population overshot the island''s carrying capacity and damaged its own food supply', 'The population was growing logistically and stayed near $K$', 'Density-independent factors had no role in the crash']
  answer: 1
  explanation: |-
    The herd grew almost exponentially past what the lichen could sustain, then crashed, a classic overshoot. There were no predators, so predation cannot be the limit. A population that stays near $K$ does not crash by 99%. The severe winter (density-independent) triggered the crash after food shortage (density-dependent) set it up.
- id: bio-q-1023
  lesson: bio-communities-humans
  module_quiz: true
  topic: Community ecology
  stem: 'Barnacles attach to a whale''s skin and filter food as the whale swims; the whale is neither helped nor harmed. What kind of interaction is this?'
  choices: ['Mutualism', 'Parasitism', 'Commensalism', 'Competition']
  answer: 2
  explanation: |-
    One species benefits and the other is unaffected (+/0): commensalism. Mutualism needs both to benefit, parasitism needs the host to be harmed, and competition harms both.
- id: bio-q-1024
  lesson: bio-communities-humans
  module_quiz: true
  topic: Biodiversity
  stem: 'A sample contains 20 beetles: 5 each of four species. What is Simpson''s diversity index, $D = 1 - \frac{\sum n(n-1)}{N(N-1)}$?'
  choices: ['0.21', '0.25', '0.75', '0.79']
  answer: 3
  explanation: |-
    $\sum n(n-1) = 4 \times (5 \times 4) = 80$ and $N(N-1) = 20 \times 19 = 380$, so $D = 1 - \frac{80}{380} = 0.79$. 0.21 forgets to subtract from 1. 0.75 uses $n^2/N^2$ (sampling with replacement) instead of the formula given, and 0.25 is just $1/4$.
- id: bio-q-1025
  lesson: bio-communities-humans
  topic: Biodiversity
  stem: 'Forest X has 100 trees: 25 each of four species. Forest Y has 100 trees: 85 of one species and 5 each of three others. Which statement is correct?'
  choices: ['Both have the same species richness, but X is more diverse because it is more even', 'Y is more diverse because it has more trees of its main species', 'They are equally diverse because both have four species', 'X is less diverse because no species dominates']
  answer: 0
  explanation: |-
    Both forests have four species (equal richness), but X spreads its trees evenly while Y is dominated by one species. Diversity indexes such as Simpson's count evenness as well as richness, so X scores higher. Treating richness as the whole of diversity is the mistake behind the third choice.
- id: bio-q-1026
  lesson: bio-communities-humans
  topic: Community ecology
  stem: 'When Robert Paine removed the sea star Pisaster from a rocky shore, mussels took over and the number of species fell from 15 to 8. What does this show?'
  choices: ['Sea stars compete with mussels for sunlight', 'Pisaster is a keystone species that maintains diversity by keeping a dominant competitor in check', 'Mussels are parasites of other shore organisms', 'Removing a predator always increases diversity']
  answer: 1
  explanation: |-
    The predator kept mussels from monopolizing space, so its removal caused a large drop in species: the definition of a keystone species. Sea stars are predators of mussels, not competitors for light. The mussels outcompeted the others rather than parasitizing them, and the result shows the opposite of "removing a predator increases diversity."
- id: bio-q-1027
  lesson: bio-communities-humans
  topic: Community ecology
  stem: 'A farm field is abandoned. Weeds appear the first year, then grasses and shrubs, then young pine trees after about 15 years. What is this?'
  choices: ['Primary succession, because the community is starting over', 'Competitive exclusion', 'Secondary succession, because soil was already present', 'Biomagnification']
  answer: 2
  explanation: |-
    Succession that begins where soil remains (after farming, fire or storms) is secondary succession, and it is fast because seeds and soil organisms are already there. Primary succession starts on bare rock or new ground with no soil.
- id: bio-q-1028
  lesson: bio-communities-humans
  topic: Biomes
  stem: 'A biome has very cold temperatures most of the year, permanently frozen ground below the surface, and low-growing mosses, lichens and shrubs but no trees. Which biome is it?'
  choices: ['Boreal forest', 'Desert', 'Temperate grassland', 'Tundra']
  answer: 3
  explanation: |-
    Permafrost and a treeless landscape of mosses, lichens and low shrubs define the tundra. The boreal forest is also cold but has dense conifers. Deserts are defined by low precipitation, and temperate grasslands have deep soils and warm summers.
- id: bio-q-1029
  lesson: bio-communities-humans
  topic: Community ecology
  stem: 'Gause grew two Paramecium species separately and each thrived. Grown together on the same limited food, one species always died out. Which idea does this support?'
  choices: ['The competitive exclusion principle', 'Mutualism between the two species', 'The ten percent rule', 'Primary succession']
  answer: 0
  explanation: |-
    Two species using the same limited resource in the same place cannot coexist indefinitely; one outcompetes the other. That is competitive exclusion. Mutualism would help both species, and the ten percent rule and succession concern energy flow and community change over time.
- id: bio-q-1030
  lesson: bio-communities-humans
  module_quiz: true
  topic: Human impact
  stem: 'According to the 2019 IPBES global assessment, what is the largest single driver of biodiversity loss on land?'
  choices: ['Invasive species', 'Habitat loss from changes in land use', 'Light pollution', 'Natural volcanic eruptions']
  answer: 1
  explanation: |-
    Converting forests, grasslands and wetlands to farms, cities and roads is the leading driver. Invasive species, climate change, pollution and overexploitation matter too, but rank behind land-use change on land. Volcanoes are natural and not a major cause of current losses.
- id: bio-q-1031
  lesson: bio-communities-humans
  topic: Human impact
  stem: 'In a lake, DDT measures 0.04 ppm in zooplankton and 10 ppm in fish-eating birds. By what factor is DDT more concentrated in the birds?'
  choices: ['25', '0.004', '250', '2,500']
  answer: 2
  explanation: |-
    $10 \div 0.04 = 250$. This is biomagnification: each predator eats many prey and stores the fat-soluble toxin. 0.004 divides the wrong way, and 25 and 2,500 are decimal-place slips.
- id: bio-q-1032
  lesson: bio-communities-humans
  topic: Human impact
  stem: 'Why do invasive species often spread so rapidly after being introduced to a new region?'
  choices: ['They have higher mutation rates than native species', 'They are always larger than native species', 'They are producers, which grow faster than consumers', 'They often lack the predators, parasites and competitors that limited them in their native range']
  answer: 3
  explanation: |-
    Freed from the enemies that kept them in check at home, introduced species can grow nearly exponentially, as the brown tree snake did on Guam. Invasives include animals and plants of every size, and nothing makes their mutation rates special.
- id: bio-q-1033
  lesson: bio-communities-humans
  module_quiz: true
  topic: Community ecology
  stem: 'Long-term fur records show snowshoe hare and lynx numbers both cycling about every 10 years. How do the peaks typically line up?'
  choices: ['Lynx peaks come shortly after hare peaks', 'Lynx peaks come shortly before hare peaks', 'The peaks happen in exactly the same year', 'The two cycles are unrelated']
  answer: 0
  explanation: |-
    Abundant hares feed more lynx, so lynx numbers rise after hares do; when hares crash, lynx follow. Predators cannot peak before their food supply has grown. Field experiments show food supply and predation together drive the hare cycle.
- id: bio-q-1034
  lesson: bio-ecosystems
  module_quiz: true
  type: label
  topic: Ecosystems
  stem: 'In this meadow food web, name the role of each numbered organism.'
  image: {src: images/m10-food-web.svg, alt: 'A meadow food web with grass and an oak tree at the bottom, a grasshopper, rabbit and mouse above them, a shrew, snake and fox above those, an owl at the top, and fungi and bacteria at the side receiving dead remains. Arrows point from food to eater. Four organisms are numbered.'}
  labels:
    - {x: 17.1, y: 89.4, text: Producer}
    - {x: 28.3, y: 66.3, text: Primary consumer}
    - {x: 32.9, y: 42.3, text: Secondary consumer}
    - {x: 75.0, y: 76.9, text: Decomposer}
  distractors: [Abiotic factor, Tertiary consumer]
  explanation: |-
    1 Grass makes its own food by photosynthesis: a producer. 2 The rabbit eats only grass: a primary consumer (level 2). 3 The snake eats the mouse, a primary consumer, so it is a secondary consumer (level 3). 4 Fungi and bacteria break down dead remains and wastes: decomposers. Nothing here is abiotic, and none of the numbered organisms eats a secondary consumer, so none is a tertiary consumer (the owl can be, when it eats a snake).
- id: bio-q-1035
  lesson: bio-ecosystems
  type: text
  topic: Ecosystems
  stem: 'In the food chain grass → mouse → snake → owl, the owl is at trophic level ___. (Type a number.)'
  image: {src: images/m10-food-web.svg, alt: 'A meadow food web in which grass is eaten by a mouse, the mouse by a snake, and the snake by an owl, among other feeding links.'}
  accept: ['4', four]
  explanation: |-
    Count the levels from the producer: grass is level 1, the mouse (primary consumer) level 2, the snake (secondary consumer) level 3, and the owl level 4, a tertiary consumer. When the owl eats a mouse directly it is at level 3, so in the whole web the owl feeds at more than one level.
- id: bio-q-1036
  lesson: bio-ecosystems
  type: order
  topic: Energy flow
  stem: 'In the chain grass → grasshopper → shrew → owl, put the organisms in order from the trophic level with the MOST energy available per year to the level with the LEAST.'
  items: [Grass, Grasshopper, Shrew, Owl]
  explanation: |-
    Energy is lost at every transfer, mostly as heat from respiration, so each level up has roughly a tenth of the energy of the one below it. Grass (producers) has the most, then grasshoppers, then shrews, and the owl at the top has the least. This is why the energy pyramid is always upright.
- id: bio-q-1037
  lesson: bio-ecosystems
  topic: Energy flow
  stem: 'Which statements about energy in ecosystems are true? Select all that apply.'
  choices: ['Most energy an animal absorbs is used in cellular respiration and leaves as heat', 'Decomposers recycle energy back to the producers', 'Uneaten plant parts and feces pass energy to decomposers', 'A pyramid of energy can be inverted in the open ocean', 'Food chains rarely have more than four or five levels because so little energy reaches the top']
  answer: [0, 2, 4]
  explanation: |-
    True: respiration uses most absorbed energy and releases it as heat; uneaten parts and feces feed decomposers; and with about 10% passed on per step, little energy is left after four or five levels. False: decomposers recycle nutrients, not energy (energy flows one way and leaves as heat). It is the biomass pyramid, not the energy pyramid, that can be inverted in the open ocean.
- id: bio-q-1038
  lesson: bio-ecosystems
  type: match
  topic: Energy flow
  stem: 'Match each term to its meaning.'
  pairs:
    - [Net primary productivity, Energy producers store as new tissue after their own respiration]
    - [Biomass, Total dry mass of living organisms in an area]
    - [Trophic level, One feeding step in a food chain]
    - [Ten percent rule, About a tenth of the energy at one level reaches the next]
  distractors: [Energy recycled by decomposers each year]
  explanation: |-
    NPP is GPP minus producer respiration, the energy available to consumers. Biomass is measured as dry mass because water content varies. A trophic level is a feeding step (producers are level 1). The ten percent rule describes the average transfer between levels. The distractor describes something that does not happen: energy is not recycled.
- id: bio-q-1039
  lesson: bio-cycles-populations
  module_quiz: true
  type: label
  topic: Biogeochemical cycles
  stem: 'Name the process shown at each numbered point of the water cycle.'
  image: {src: images/m10-water-cycle-blank.svg, alt: 'A water cycle diagram without process labels: the sun over an ocean, arrows rising from the ocean and from a tree toward a cloud, a second cloud with rain over a mountain, an arrow running down the land into the ocean, and groundwater flowing underground. Five points are numbered.'}
  labels:
    - {x: 20.6, y: 53.2, text: Evaporation}
    - {x: 41.2, y: 19.6, text: Condensation}
    - {x: 75.0, y: 33.6, text: Precipitation}
    - {x: 58.5, y: 37.2, text: Transpiration}
    - {x: 50.6, y: 70.9, text: Runoff}
  distractors: [Nitrogen fixation, Combustion]
  explanation: |-
    1 Water evaporates from the ocean surface, powered by the sun. 2 Water vapor cools and condenses into the droplets that make a cloud. 3 Water falls from clouds as precipitation. 4 Plants release water vapor from their leaves: transpiration. 5 Water flowing over the land surface back to the ocean is runoff. Nitrogen fixation belongs to the nitrogen cycle and combustion to the carbon cycle.
- id: bio-q-1040
  lesson: bio-cycles-populations
  type: order
  topic: Biogeochemical cycles
  stem: 'Put these steps in the order a nitrogen atom could follow, starting from the air.'
  items: ['Soil bacteria convert N₂ gas to ammonium', 'Nitrifying bacteria convert the ammonium to nitrate', 'A bean plant absorbs the nitrate and builds it into protein', 'A rabbit eats the bean plant', 'Decomposers release ammonium from the rabbit''s wastes']
  explanation: |-
    Nitrogen enters living things only after fixation (N₂ to ammonium). Nitrification then turns ammonium into nitrate, which plants absorb and build into amino acids and proteins. Animals get nitrogen by eating plants, and decomposers return it to the soil as ammonium (ammonification), ready to be nitrified, absorbed or denitrified again.
- id: bio-q-1041
  lesson: bio-cycles-populations
  type: text
  topic: Population ecology
  stem: 'The largest population an environment can support over the long term is its ___, written $K$.'
  accept: [carrying capacity, the carrying capacity]
  explanation: |-
    Carrying capacity ($K$) is set by limiting resources such as food, water and space. In logistic growth, the population's growth slows as $N$ approaches $K$ and stops when $N = K$.
- id: bio-q-1042
  lesson: bio-cycles-populations
  topic: Biogeochemical cycles
  stem: 'Which processes add carbon dioxide to the atmosphere? Select all that apply.'
  image: {src: images/m10-carbon-cycle.svg, alt: 'The carbon cycle, showing atmospheric CO₂ exchanged with land plants, animals, soil and decomposers, fossil fuels, the ocean, marine life and limestone.'}
  choices: [Cellular respiration, Photosynthesis, Burning fossil fuels, Decomposition, Formation of limestone from shells, Volcanic eruptions]
  answer: [0, 2, 3, 5]
  explanation: |-
    Respiration, decomposition (respiration by decomposers), combustion of fossil fuels and volcanoes all release CO₂ to the air. Photosynthesis removes CO₂, and the formation of limestone from settled shells locks carbon away in rock for millions of years.
- id: bio-q-1043
  lesson: bio-cycles-populations
  module_quiz: true
  type: match
  topic: Population ecology
  stem: 'Classify each factor limiting a deer population.'
  pairs:
    - [A disease that spreads faster in crowded herds, Density-dependent]
    - [A sudden hard freeze, Density-independent]
    - [Competition for winter food, Density-dependent]
    - [A wildfire, Density-independent]
    - [More wolves hunting where deer are plentiful, Density-dependent]
  explanation: |-
    Density-dependent factors hit harder when the population is denser: disease spreads faster in crowds, competition for food intensifies, and predators concentrate where prey are plentiful. Density-independent factors such as a freeze or a wildfire kill about the same fraction whatever the density.
- id: bio-q-1044
  lesson: bio-communities-humans
  module_quiz: true
  type: label
  topic: Biomes
  stem: 'The chart plots biomes by average yearly temperature and yearly precipitation. Name the biome at each numbered region.'
  image: {src: images/m10-biomes-blank.svg, alt: 'A chart with average yearly temperature from minus 15 to 30 degrees Celsius across the bottom and yearly precipitation from 0 to 450 centimeters up the side, divided into seven unlabeled biome regions. Five regions are numbered.'}
  labels:
    - {x: 21.9, y: 81.7, text: Tundra}
    - {x: 40.2, y: 70.2, text: Boreal forest}
    - {x: 72.1, y: 84.9, text: Desert}
    - {x: 85.8, y: 69.3, text: Savanna}
    - {x: 85.8, y: 34.0, text: Tropical rainforest}
  distractors: [Temperate grassland, Temperate deciduous forest]
  explanation: |-
    1 The coldest, dry corner (below about −5 °C) is tundra. 2 Cold but wetter (about −5 to 5 °C) is boreal forest. 3 Under about 25 cm of rain a year, whatever the temperature range, is desert. 4 Hot with moderate rain and a long dry season is savanna. 5 Hot and very wet (over about 200 cm) is tropical rainforest. Temperate grassland and temperate deciduous forest are the two unnumbered regions in the middle temperatures.
- id: bio-q-1045
  lesson: bio-communities-humans
  type: order
  topic: Community ecology
  stem: 'Put the stages of primary succession on a new lava flow in order.'
  items: [Bare rock with no soil, Lichens and mosses colonize, Grasses and small plants grow in thin soil, Shrubs move in, Trees form a forest]
  explanation: |-
    Primary succession starts without soil. Pioneer lichens and mosses break down rock and add organic matter, slowly building soil. Grasses and small plants follow, then shrubs, then trees. Secondary succession (after a fire or on an abandoned field) skips the pioneer stage because soil is already there.
- id: bio-q-1046
  lesson: bio-communities-humans
  type: match
  topic: Community ecology
  stem: 'Match each interaction to its effect on the two species (+ helped, − harmed, 0 unaffected).'
  pairs:
    - [Mutualism, '+/+']
    - [Commensalism, '+/0']
    - [Parasitism, '+/−']
    - [Competition, '−/−']
  distractors: ['0/0']
  explanation: |-
    In mutualism both partners gain (legumes and Rhizobium). In commensalism one gains and the other is unaffected (barnacles on a whale). In parasitism one gains at the other's expense, usually over a long time (a tick on a deer). In competition both are harmed because they use the same limited resource.
- id: bio-q-1047
  lesson: bio-communities-humans
  topic: Biodiversity
  stem: 'Which changes to a community would increase its Simpson''s diversity index $D = 1 - \frac{\sum n(n-1)}{N(N-1)}$? Select all that apply.'
  choices: ['A new species arrives and becomes moderately common', 'The species'' numbers become more even', 'One species grows until it makes up most of the individuals', 'The rarest species, represented by a single individual, disappears']
  answer: [0, 1]
  explanation: |-
    Simpson's index rises with richness (more species) and with evenness (individuals spread more equally). A new, moderately common species adds richness; more even numbers add evenness. One species taking over lowers evenness, so $D$ falls. Losing a species with a single individual leaves $\sum n(n-1)$ unchanged but shrinks $N(N-1)$, so the fraction grows and $D$ falls.
- id: bio-q-1048
  lesson: bio-communities-humans
  type: text
  topic: Community ecology
  stem: 'A species whose removal causes a large change in its community, like the sea star Pisaster on rocky shores, is called a ___ species.'
  accept: [keystone]
  explanation: |-
    Keystone species have effects far out of proportion to their abundance. When Robert Paine removed Pisaster, mussels took over and the number of species fell from 15 to 8. Sea otters, which keep sea urchins from destroying kelp forests, are another example.
- id: bio-qh-1001
  lesson: bio-h-population-models
  topic: Life tables
  stem: 'In a cohort of beetles, 300 are alive at the start of age 2 and 180 at the start of age 3. What is the age-specific mortality rate $q_2$?'
  choices: ['0.40', '0.12', '0.60', '120']
  answer: 0
  explanation: |-
    $d_2 = 300 - 180 = 120$ beetles die during age 2, and $q_2 = d_2/n_2 = 120/300 = 0.40$. 0.60 is the fraction that survive ($180/300$). 0.12 divides the deaths by an original cohort of 1,000, which is $d_x/n_0$, not a rate for those alive at age 2. 120 is the number of deaths, $d_2$, not a rate.
- id: bio-qh-1002
  lesson: bio-h-population-models
  topic: Life tables
  stem: 'In a lizard life table, life expectancy at birth is $e_0 = 1.4$ years but at age 1 it is $e_1 = 1.8$ years. What best explains this?'
  choices: ['The table must contain an arithmetic error, because life expectancy always falls with age', 'Many lizards die in their first year; a one-year-old has already survived that risky period', 'Older lizards have lower mortality at every age than younger ones', 'Life expectancy counts only the years an animal spends reproducing']
  answer: 1
  explanation: |-
    $e_0$ averages over all newborns, including the 60% that die in their first year. A lizard that reaches age 1 has escaped that high early mortality, so its expected remaining life can be longer. This happens whenever first-year mortality is very high. Life expectancy does not always fall with age, mortality in this table later rises again with age, and $e_x$ counts all remaining years, not just breeding years.
- id: bio-qh-1003
  lesson: bio-h-population-models
  type: label
  topic: Life tables
  stem: 'Survivors per 1,000 are plotted on a log scale against age. Identify each numbered survivorship curve.'
  image: {src: images/m10-survivorship-blank.svg, alt: 'Graph of survivors per 1,000 on a log scale against age as a percent of maximum life span, with three unlabeled curves that all start at 1,000. One stays high until late life and then plunges, one is a straight diagonal line, and one plunges at very young ages and then levels off. Each curve is numbered.'}
  labels:
    - {x: 76.3, y: 24.2, text: Type I}
    - {x: 53.8, y: 45.6, text: Type II}
    - {x: 33.7, y: 68.0, text: Type III}
  distractors: [Logistic curve]
  explanation: |-
    1 High survival until old age, then a steep drop: Type I (humans, large mammals). 2 A straight line on a log scale means the same fraction dies every year: Type II (many lizards, some adult birds). 3 Very high mortality among the young and then low mortality for survivors: Type III (oysters, most marine fish). A logistic curve shows population size over time, not survival with age.
- id: bio-qh-1004
  lesson: bio-h-population-models
  topic: Life tables
  stem: 'On a survivorship graph with a log-scale vertical axis, a population''s curve is a straight line sloping down. What does this tell you?'
  choices: ['The same number of individuals dies each year', 'Most individuals die in old age', 'The same fraction of the survivors dies each year', 'Most individuals die soon after birth']
  answer: 2
  explanation: |-
    On a log scale, equal vertical steps are equal ratios, so a straight line means a constant proportion of survivors dies each age interval: a Type II curve. A constant number of deaths per year would be a straight line on a linear axis instead. Death mostly in old age is Type I, and death mostly soon after birth is Type III.
- id: bio-qh-1005
  lesson: bio-h-population-models
  topic: Life tables
  stem: 'A fish population has survivorship $l_x$ = 1, 0.5, 0.2, 0.05 at ages 0 to 3 and fecundity $m_x$ = 0, 2, 4, 2 daughters per female. What is the net reproductive rate $R_0$, and what will the population do?'
  choices: ['$R_0 = 8$; it grows', '$R_0 = 0.475$; it shrinks', '$R_0 = 1.8$; it grows', '$R_0 = 1.9$; it grows']
  answer: 3
  explanation: |-
    $R_0 = \sum l_x m_x = 1(0) + 0.5(2) + 0.2(4) + 0.05(2) = 0 + 1.0 + 0.8 + 0.1 = 1.9$. Each female leaves 1.9 daughters, so the population grows. 8 adds the $m_x$ values without weighting by survival. 1.8 leaves out the age-3 term. 0.475 averages the four products instead of adding them; $R_0$ is a lifetime total.
- id: bio-qh-1006
  lesson: bio-h-population-models
  topic: Population models
  stem: 'Which traits are traditionally associated with r-selected species? Select all that apply.'
  choices: [Many small offspring, Early maturity, Extensive parental care, Long life span, Populations that boom and crash far below carrying capacity]
  answer: [0, 1, 4]
  explanation: |-
    r-selected species are favored where populations are usually below $K$ and fast multiplication pays: early maturity, many small offspring, and boom-and-bust numbers. Extensive parental care and long lives are K-selected traits. Remember the caveat: real species are mixtures, and age-specific mortality explains life histories better than the r/K labels.
- id: bio-qh-1007
  lesson: bio-h-population-models
  topic: Population models
  stem: 'Guppies moved from a stream where predators eat mainly adults to one where the only predator eats mainly juveniles evolved, within about 11 years, later maturity and fewer, larger offspring. Which conclusion do these results best support?'
  choices: ['Which ages suffer the most mortality can drive the evolution of life-history traits', 'Guppies changed their traits by choice to avoid the new predator', 'Population density alone determines life-history traits', 'Life-history traits cannot evolve in fewer than a thousand generations']
  answer: 0
  explanation: |-
    When adults face high mortality, breeding early and often is favored; when juveniles are the ones eaten, it pays to mature later and invest in fewer, larger young that grow past the danger. The change was evolution by natural selection, not choice, and it happened in about 30–60 generations. The experiment changed the pattern of mortality by age, which is why it challenges the density-based r/K explanation.
- id: bio-qh-1008
  lesson: bio-h-population-models
  topic: Population models
  stem: 'A population''s per capita growth rate was 0.30 per year when it numbered 100 and 0.10 per year when it numbered 300. Assuming per capita growth falls in a straight line with density, estimate the carrying capacity $K$.'
  choices: ['300', '400', '500', '200']
  answer: 1
  explanation: |-
    Slope: $(0.10 - 0.30)/(300 - 100) = -0.001$ per individual. At $N = 0$ the rate is $0.30 + 0.001 \times 100 = 0.40$, so $r = 0.40$. The rate reaches zero when $0.40 - 0.001N = 0$, at $N = 400$. 300 is the last data point, not where growth stops; 500 and 200 come from slips in the slope or intercept.
- id: bio-qh-1009
  lesson: bio-h-population-models
  type: text
  topic: Population models
  stem: 'In the Lotka–Volterra predator–prey model, predators hold steady when the prey number is $H = m/(ab)$. If the predator death rate is $m = 0.5$, the attack rate is $a = 0.01$ and the conversion efficiency is $b = 0.2$, the prey number at which predators hold steady is ___.'
  accept: ['250']
  explanation: |-
    $H = \dfrac{m}{ab} = \dfrac{0.5}{0.01 \times 0.2} = \dfrac{0.5}{0.002} = 250$ prey. Below 250 prey, predators decline; above it, they increase.
- id: bio-qh-1010
  lesson: bio-h-population-models
  topic: Population models
  stem: 'In both the Lotka–Volterra model and the hare–lynx records, why do predator peaks come after prey peaks?'
  choices: ['Predators reproduce faster than prey', 'Predators switch to other prey when hares are common', 'Predator numbers grow only after abundant prey has let them raise more young, and keep rising until prey become scarce', 'Prey numbers are set by weather, which changes after predator numbers']
  answer: 2
  explanation: |-
    Predators respond to food with a delay: abundant prey must first be eaten and turned into new predators. Predators keep increasing while prey are plentiful, and their numbers peak just as heavy predation drives prey down. Predators such as lynx actually reproduce more slowly than hares, switching prey would weaken the cycle, and weather does not explain the regular lag.
- id: bio-qh-1011
  lesson: bio-h-population-models
  topic: Population models
  stem: 'At Kluane Lake, averaged over the peak and decline years, adding food tripled hare density, excluding mammal predators roughly doubled it, and doing both increased it about elevenfold. What do these results show?'
  choices: ['Food alone drives the hare cycle', 'Predators alone drive the hare cycle', 'Neither food nor predators matter to hares', 'Food and predation act together, and their combined effect is larger than either alone']
  answer: 3
  explanation: |-
    Each treatment alone had an effect, so neither factor can be ignored, and the combined effect (11×) was much more than either (3× or 2×) and more than the 6× expected if the effects simply multiplied. The cycle is driven by food and predation interacting, along with predator-caused stress on breeding.
- id: bio-qh-1012
  lesson: bio-h-population-models
  type: match
  topic: Population models
  stem: 'In the predator–prey model $\frac{dH}{dt} = rH - aHP$ and $\frac{dP}{dt} = baHP - mP$, match each term to what it represents.'
  pairs:
    - [$rH$, Prey births minus deaths with no predators]
    - [$aHP$, Prey killed by predators]
    - [$baHP$, New predators produced from prey eaten]
    - [$mP$, Predator deaths]
  distractors: [Prey carrying capacity]
  explanation: |-
    $rH$ is exponential prey growth. $aHP$ removes prey in proportion to how often predators meet prey. $baHP$ converts a fraction $b$ of prey eaten into new predators. $mP$ is predator mortality. The basic model has no carrying capacity for prey, one of the reasons it is unrealistic.
- id: bio-qh-1013
  lesson: bio-h-population-models
  type: order
  topic: Population models
  stem: 'Starting from a hare peak, put these events in a predator–prey cycle in order.'
  items: [Hare numbers peak, Lynx numbers peak, Hare numbers reach their low, Lynx numbers reach their low]
  explanation: |-
    Abundant hares feed lynx, so lynx peak a little after hares. Heavy predation then drives hares to their low, and with little food the lynx decline to their own low afterward. With predation eased, hares recover and the cycle repeats.
- id: bio-qh-1014
  lesson: bio-h-population-models
  topic: Population models
  stem: 'In the Lotka–Volterra competition model, species 1 has $K_1 = 600$ and species 2 has $K_2 = 500$. Each species-2 individual affects species 1 like 0.4 of its own ($\alpha_{12} = 0.4$), but each species-1 individual affects species 2 like 1.5 of its own ($\alpha_{21} = 1.5$). Coexistence requires $\alpha_{12} < K_1/K_2$ and $\alpha_{21} < K_2/K_1$. What does the model predict?'
  choices: ['Species 1 excludes species 2', 'Species 2 excludes species 1', 'The two species coexist', 'Both species go extinct']
  answer: 0
  explanation: |-
    $K_1/K_2 = 1.2$ and $\alpha_{12} = 0.4 < 1.2$, so species 2 cannot exclude species 1. But $K_2/K_1 \approx 0.83$ and $\alpha_{21} = 1.5 > 0.83$: species 1 suppresses species 2 more than species 2 limits itself. Species 1 wins. Coexistence would need both conditions to hold, and the model never drives both species extinct.
- id: bio-qh-1015
  lesson: bio-h-population-models
  topic: Population models
  stem: 'Which is the most important caution when treating Hudson''s Bay Company pelt records as counts of lynx populations?'
  choices: ['Lynx pelts cannot be told apart from hare pelts', 'The number of pelts also depended on trapping effort and fur prices, not only on how many lynx were alive', 'Lynx do not eat hares', 'The records cover too few years to show any cycle']
  answer: 1
  explanation: |-
    Pelt counts measure the catch, which rises and falls with how hard trappers worked and how much fur paid, as well as with lynx numbers. That is why ecologists confirmed the cycle with field studies and experiments. The records span about a century and show many cycles, lynx do eat mostly hares, and the pelts are easy to distinguish.
- id: bio-qh-1016
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Lake water starts with 7.0 mg O₂/L. After 4 hours the light bottle reads 8.1 mg/L and the dark bottle 6.4 mg/L. What is the gross primary productivity over the 4 hours?'
  image: {src: images/m10-light-dark-bottles.svg, alt: 'An initial bottle of lake water with algae, a clear light bottle and a dark bottle wrapped to block light, suspended in the lake.'}
  choices: ['1.1 mg O₂/L', '0.6 mg O₂/L', '1.7 mg O₂/L', '0.5 mg O₂/L']
  answer: 2
  explanation: |-
    GPP = light − dark = $8.1 - 6.4 = 1.7$ mg O₂/L. Equivalently, net production ($8.1 - 7.0 = 1.1$) plus respiration ($7.0 - 6.4 = 0.6$) = 1.7. 1.1 is net production only, 0.6 is respiration only, and 0.5 subtracts respiration from net production instead of adding it.
- id: bio-qh-1017
  lesson: bio-h-ecosystem-ecology
  type: text
  topic: Primary productivity
  stem: 'In a light and dark bottle experiment, the initial oxygen is 7.6 mg/L, the light bottle ends at 8.5 mg/L and the dark bottle at 7.0 mg/L. Gross primary productivity is ___ mg O₂ per liter for the run.'
  accept: ['1.5']
  explanation: |-
    GPP = light − dark = $8.5 - 7.0 = 1.5$ mg O₂/L. Check: net production $8.5 - 7.6 = 0.9$ plus respiration $7.6 - 7.0 = 0.6$ gives 1.5.
- id: bio-qh-1018
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Why does the light and dark bottle method need the dark bottle?'
  choices: ['To measure how much light reaches the depth where the bottles hang', 'To prevent the algae from photosynthesizing too fast', 'To provide a bottle in which algae cannot grow at all', 'To measure respiration, which goes on in the light bottle too and hides part of the oxygen produced']
  answer: 3
  explanation: |-
    In the light bottle, respiration uses up some of the oxygen photosynthesis makes, so its oxygen gain shows only net production. The dark bottle, where only respiration occurs, measures that loss so it can be added back: GPP = light − dark. The dark bottle does not measure light, and it does not merely stop growth: it is a measurement of respiration.
- id: bio-qh-1019
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Tower measurements show that a forest''s net ecosystem production (NEP) averaged +2 tonnes of carbon per hectare per year over a decade. What does this mean?'
  choices: ['The forest took in more carbon by photosynthesis than plants, animals and decomposers released by respiration, so it stored carbon', 'The forest''s plants did no respiration', 'The forest released 2 tonnes more carbon than it absorbed', 'The forest''s net primary productivity was zero']
  answer: 0
  explanation: |-
    NEP = GPP − plant respiration − heterotrophic respiration. A positive value means more carbon was fixed than respired, so the forest acted as a carbon sink, storing carbon in wood and soil. A net release would make NEP negative. Plants still respire, and NPP must be greater than NEP whenever consumers and decomposers respire.
- id: bio-qh-1020
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'In the Lake 226 experiment, one basin received carbon, nitrogen and phosphorus and developed a dense algal bloom; the other received the same carbon and nitrogen but no phosphorus and stayed clear. What does this show?'
  choices: ['Nitrogen was the limiting nutrient', 'Phosphorus was the limiting nutrient', 'Carbon was the limiting nutrient', 'Algae need no nutrients besides light']
  answer: 1
  explanation: |-
    The only difference between the basins was phosphorus, and only the phosphorus basin bloomed, so phosphorus limited algal growth. Both basins got nitrogen and carbon, so neither of those can explain the difference. The result helped lead to limits on phosphate detergents.
- id: bio-qh-1021
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Some regions of the open ocean have plenty of nitrate and phosphate but few phytoplankton. When iron was added to a patch of the equatorial Pacific in 1995, a large bloom followed. Which conclusion is best supported?'
  choices: ['Nitrate was limiting there', 'Light was limiting there', 'Iron was limiting there', 'Adding iron is a proven way to stop climate change']
  answer: 2
  explanation: |-
    Adding iron, and nothing else, produced the bloom, so iron was the limiting nutrient in that patch; nitrate and phosphate were already plentiful, and light was unchanged. Whether iron fertilization would store carbon for long is a separate, unresolved question, so the experiment does not show it can stop climate change.
- id: bio-qh-1022
  lesson: bio-h-ecosystem-ecology
  topic: Global change
  stem: 'Which processes return nitrogen to the atmosphere as N₂ gas? Select all that apply.'
  choices: [Denitrification, Nitrification, Anammox, Nitrogen fixation, Ammonification]
  answer: [0, 2]
  explanation: |-
    Denitrifying bacteria reduce nitrate step by step to N₂, and anammox bacteria combine ammonium with nitrite to make N₂; both happen where oxygen is low. Nitrification turns ammonium into nitrite and nitrate, fixation does the opposite of returning N₂ (it removes N₂ from the air), and ammonification releases ammonium from dead matter.
- id: bio-qh-1023
  lesson: bio-h-ecosystem-ecology
  type: order
  topic: Global change
  stem: 'Ammonium in a farm field is nitrified, and the nitrate later washes into a waterlogged wetland and is denitrified. Put the forms of nitrogen in the order they appear.'
  items: ['Ammonium (NH₄⁺)', 'Nitrite (NO₂⁻)', 'Nitrate (NO₃⁻)', 'Nitrous oxide (N₂O)', 'Nitrogen gas (N₂)']
  explanation: |-
    Nitrification needs oxygen: ammonia oxidizers make nitrite, then nitrite oxidizers make nitrate. In the low-oxygen wetland, denitrifiers reduce nitrate (through nitrite and nitric oxide) to nitrous oxide and finally N₂. If denitrification stops partway, N₂O, a strong greenhouse gas, escapes.
- id: bio-qh-1024
  lesson: bio-h-ecosystem-ecology
  topic: Global change
  stem: 'In 2023, human activities emitted about 11.1 billion tonnes of carbon (GtC) as CO₂, and the atmosphere gained about 5.9 GtC. What was the airborne fraction?'
  choices: ['About 47%', 'About 1.9%', 'About 188%', 'About 53%']
  answer: 3
  explanation: |-
    Airborne fraction = $5.9/11.1 \approx 0.53$, about 53%. The other 47% (5.2 GtC) went into the ocean and land sinks, so 47% is the sink share, not the airborne fraction. 188% divides the wrong way, and 1.9% is not a ratio of these two numbers at all.
- id: bio-qh-1025
  lesson: bio-h-ecosystem-ecology
  type: text
  topic: Global change
  stem: 'One part per million (ppm) of atmospheric CO₂ contains about 2.12 GtC. If the atmosphere gains 5.3 GtC in a year, CO₂ rises by about ___ ppm. (Give one decimal place.)'
  accept: ['2.5']
  explanation: |-
    $5.3 \div 2.12 = 2.5$ ppm. Multiplying instead of dividing would give about 11, far more than any year on record.
- id: bio-qh-1026
  lesson: bio-h-ecosystem-ecology
  topic: Global change
  stem: 'As CO₂ has risen, the fraction of carbon-13 and carbon-14 in atmospheric CO₂ has fallen. Why does this point to fossil fuels as the source?'
  choices: ['Fossil fuels formed from ancient plants, which are low in carbon-13, and are so old that their carbon-14 has decayed away', 'Volcanoes release CO₂ that is rich in carbon-14', 'The ocean releases CO₂ with no carbon-13', 'Carbon-14 is destroyed by rising temperature']
  answer: 0
  explanation: |-
    Photosynthesis favors carbon-12, so plant-derived carbon is low in carbon-13; fossil fuels are millions of years old, far longer than carbon-14's half-life of about 5,700 years, so they contain none. Adding such carbon dilutes both isotopes in the air, exactly as observed. Volcanic carbon has no carbon-14 either but is not depleted in carbon-13 the same way, ocean carbon is not carbon-13-free, and temperature does not destroy carbon-14.
- id: bio-qh-1027
  lesson: bio-h-ecosystem-ecology
  type: match
  topic: Global change
  stem: 'Match each line of evidence to what it shows.'
  pairs:
    - [Antarctic ice-core air bubbles, 'CO₂ today is higher than at any time in 800,000 years']
    - [Yearly wiggle in the Keeling curve, Northern Hemisphere land plants take up CO₂ in summer]
    - [Slowly falling atmospheric oxygen, The added CO₂ comes from burning fuel]
    - [Falling surface ocean pH, Seawater is absorbing CO₂]
  distractors: [The Sun has grown much brighter since 1950]
  explanation: |-
    Ice cores preserve ancient air, showing CO₂ between about 180 and 300 ppm for 800,000 years. The seasonal Keeling wiggle tracks northern photosynthesis and decay. Combustion uses oxygen as it makes CO₂, so falling O₂ fingerprints burning. Dissolved CO₂ forms carbonic acid, lowering pH. The distractor is false: solar output has not risen enough to explain recent warming.
- id: bio-qh-1028
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Ocean producers are well under 1% of Earth''s producer biomass, yet they account for about half of global net primary productivity. How is that possible?'
  choices: ['Ocean producers are larger than land plants', 'Phytoplankton grow and are eaten so quickly that a small standing biomass is replaced many times a year', 'Ocean producers do not respire', 'Ocean producers photosynthesize at night as well as during the day']
  answer: 1
  explanation: |-
    Productivity is a rate, and biomass is a stock. Phytoplankton divide every few days and are grazed almost as fast, so a tiny standing stock produces a huge flow, the same reason open-ocean biomass pyramids can be inverted. Phytoplankton are microscopic, they do respire, and photosynthesis needs light.
- id: bio-qh-1029
  lesson: bio-h-ecosystem-ecology
  topic: Primary productivity
  stem: 'Pond-water flasks are given nutrients for a week. Final chlorophyll (µg/L): control 6, nitrogen added 22, phosphorus added 7, both added 45. What do the results show?'
  choices: ['Phosphorus is the primary limiting nutrient', 'Neither nutrient limits the algae', 'Nitrogen is the primary limiting nutrient, and phosphorus becomes limiting once nitrogen is added', 'Both nutrients are toxic to the algae']
  answer: 2
  explanation: |-
    Adding nitrogen alone nearly quadruples growth (6 to 22), while phosphorus alone does almost nothing (6 to 7), so nitrogen is the first limit. With nitrogen supplied, adding phosphorus too doubles growth again (22 to 45): the algae are co-limited, with nitrogen first. Both additions raised growth, so neither is toxic.
