# Module 5 (Inheritance) questions
- id: bio-q-0501
  lesson: bio-mendel
  module_quiz: true
  topic: Mendelian genetics
  stem: 'Mendel crossed true-breeding purple-flowered peas with true-breeding white-flowered peas. Every F1 plant was purple, yet about one quarter of the F2 plants were white. What best explains this?'
  choices: ['The F1 plants carried the white allele, but it was masked by the dominant purple allele', 'The white allele was destroyed in the F1 and re-created by mutation in the F2', 'The purple and white factors blended in the F1 and separated again in the F2', 'Environmental conditions in the F2 year turned some purple plants white']
  answer: 0
  explanation: |-
    The F1 plants were Pp: the p allele was present but hidden because P is dominant. When two Pp plants were crossed, pp offspring appeared in about 1/4 of the F2. Mutation is far too rare to give a steady 1/4. Blending would make the F1 an intermediate color and could not bring back pure white.
- id: bio-q-0502
  lesson: bio-mendel
  module_quiz: true
  topic: Mendelian genetics
  stem: 'In pea plants, purple flowers (P) are dominant to white (p). Two Pp plants are crossed. What fraction of the offspring are expected to have white flowers?'
  choices: ['1/2', '1/4', '3/4', '1/16']
  answer: 1
  explanation: |-
    Each parent gives p with probability 1/2, and a white plant (pp) needs p from both: $\tfrac12 \times \tfrac12 = \tfrac14$. 3/4 is the purple fraction; 1/2 is the heterozygous fraction; 1/16 belongs to a two-gene cross.
- id: bio-q-0503
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'What is the expected genotype ratio among the offspring of Aa × Aa?'
  choices: ['3 AA : 1 aa', '1 AA : 1 aa', '1 AA : 1 Aa : 2 aa', '1 AA : 2 Aa : 1 aa']
  answer: 3
  explanation: |-
    The Punnett square has four equal boxes: AA, Aa, aA and aa, so 1 AA : 2 Aa : 1 aa. The 3 : 1 ratio is the phenotype ratio (AA and Aa look the same), not the genotype ratio.
- id: bio-q-0504
  lesson: bio-mendel
  module_quiz: true
  topic: Mendelian genetics
  stem: 'A tall pea plant (T is dominant to t for dwarf) is crossed with a dwarf plant. Of 60 offspring, 31 are tall and 29 are dwarf. What is the genotype of the tall parent?'
  choices: ['TT', 'tt', 'Tt', 'It cannot be determined from a test cross']
  answer: 2
  explanation: |-
    This is a test cross: the dwarf parent (tt) gives only t. Dwarf offspring (tt) must have received t from the tall parent as well, so it is Tt, and Tt × tt predicts 1 tall : 1 dwarf, matching 31 : 29. A TT parent would give only tall offspring; a tt parent would not be tall.
- id: bio-q-0505
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'What kinds of gametes does an Aa individual produce?'
  choices: ['Every gamete carries both A and a', 'Half carry AA and half carry aa', 'Half carry A and half carry a', 'All carry A, because A is dominant']
  answer: 2
  explanation: |-
    By the law of segregation, the two alleles separate into different gametes, each gamete gets one allele, and the two types are equally common. A gamete never carries two alleles of the same gene. Dominance affects the phenotype, not which allele gets into a gamete.
- id: bio-q-0506
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'Which pair of pea plants have the same phenotype but different genotypes? (Purple, P, is dominant to white, p.)'
  choices: ['PP and pp', 'Pp and pp', 'pp and pp', 'PP and Pp']
  answer: 3
  explanation: |-
    PP and Pp both have purple flowers because one P allele is enough. PP and pp, and Pp and pp, differ in phenotype (purple vs white). Two pp plants have the same genotype.
- id: bio-q-0507
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'Which statement about dominant alleles is correct?'
  choices: ['A dominant allele is always the most common allele in a population', 'A dominant allele shows its effect even in a heterozygote', 'A dominant allele is always better for survival', 'A dominant allele is passed to offspring more often than a recessive one']
  answer: 1
  explanation: |-
    Dominant only describes how alleles interact in a heterozygote. It says nothing about frequency (the dominant allele for Huntington's disease is rare), benefit, or how often it is inherited: a heterozygote passes each allele with probability 1/2.
- id: bio-q-0508
  lesson: bio-mendel
  module_quiz: true
  topic: Mendelian genetics
  stem: 'What event in meiosis is the physical basis of Mendel''s law of segregation?'
  choices: ['Homologous chromosomes separating in anaphase I', 'DNA replicating during the S phase', 'Sister chromatids separating in mitosis', 'Crossing over between homologous chromosomes in prophase I']
  answer: 0
  explanation: |-
    The two alleles of a gene sit on the two homologous chromosomes, and homologs go to opposite poles in anaphase I, so each gamete gets one allele. Replication copies alleles rather than separating them, mitosis doesn't make gametes, and crossing over swaps segments between homologs but doesn't separate the allele pair.
- id: bio-q-0509
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'Mendel''s F2 plants for stem length were 787 tall and 277 dwarf. What does this result suggest about the F1 plants that were crossed to produce them?'
  choices: ['They were TT × tt', 'Both were heterozygous, Tt × Tt', 'They were Tt × tt', 'They were TT × Tt']
  answer: 1
  explanation: |-
    787/277 is about 2.84 : 1, close to the 3 : 1 expected from Tt × Tt. Tt × tt gives 1 : 1, TT × tt and TT × Tt give only tall offspring.
- id: bio-q-0510
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'In the offspring of Pp × Pp, what fraction of the purple-flowered plants are heterozygous?'
  choices: ['1/2', '1/4', '2/3', '3/4']
  answer: 2
  explanation: |-
    Purple plants fill 3 of the 4 Punnett boxes (PP, Pp, Pp), and 2 of those 3 are Pp, so 2/3. The answer 1/2 is the fraction of all offspring that are Pp; here the white plants are excluded.
- id: bio-q-0511
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'Two Aa parents have three children, all with the dominant phenotype. What is the probability that their fourth child has the recessive phenotype?'
  choices: ['1', '1/256', '3/4', '1/4']
  answer: 3
  explanation: |-
    Each fertilization is independent, so the earlier children don't change the odds: P(aa) = 1/4 for every child. Expecting the recessive child to be "due" is the gambler's fallacy; 1/256 is the chance that all four children are aa.
- id: bio-q-0512
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'In guinea pigs, black fur (B) is dominant to white (b). A Bb guinea pig is crossed with a bb guinea pig, and 120 offspring are produced over several litters. About how many are expected to be white?'
  choices: ['60', '30', '90', '0']
  answer: 0
  explanation: |-
    Bb × bb gives 1/2 Bb (black) and 1/2 bb (white), so expect $\tfrac12 \times 120 = 60$ white. 30 uses 1/4 (as if it were Bb × Bb); 90 is the 3/4 dominant fraction of that cross.
- id: bio-q-0513
  lesson: bio-dihybrid
  module_quiz: true
  topic: Dihybrid crosses
  stem: 'Which gametes can an AaBb individual produce, assuming the two genes assort independently?'
  choices: ['Aa and Bb, each 1/2 of the gametes', 'Only AB and ab, each 1/2 of the gametes', 'AA, BB, aa and bb, each 1/4 of the gametes', 'AB, Ab, aB and ab, each 1/4 of the gametes']
  answer: 3
  explanation: |-
    Each gamete gets one allele of each gene. A or a (1/2 each) combines independently with B or b (1/2 each), giving four types at $\tfrac12 \times \tfrac12 = \tfrac14$. Aa or AA would put two alleles of one gene in a gamete; only AB and ab would mean the genes are completely linked.
- id: bio-q-0514
  lesson: bio-dihybrid
  module_quiz: true
  topic: Dihybrid crosses
  stem: 'Round (R) is dominant to wrinkled (r) and yellow (Y) is dominant to green (y). In the cross RrYy × RrYy, what fraction of offspring have round, green seeds?'
  choices: ['3/16', '9/16', '1/16', '1/4']
  answer: 0
  explanation: |-
    Gene by gene: P(round) = 3/4 from Rr × Rr, P(green) = 1/4 from Yy × Yy. Product rule: $\tfrac34 \times \tfrac14 = \tfrac{3}{16}$. 9/16 is round and yellow; 1/16 is wrinkled and green.
- id: bio-q-0515
  lesson: bio-dihybrid
  topic: Dihybrid crosses
  stem: 'Mendel''s RrYy × RrYy cross gave 315 round-yellow, 108 round-green, 101 wrinkled-yellow and 32 wrinkled-green seeds. Which conclusion do these data support?'
  choices: ['The two genes are always inherited together as a unit', 'The seed-shape and seed-color genes assort independently', 'The traits blend together in the offspring', 'Alleles of the seed-color gene do not segregate']
  answer: 1
  explanation: |-
    All four combinations appear, close to 9 : 3 : 3 : 1, including the new combinations round-green and wrinkled-yellow. If the genes traveled together, only the parental types would appear (3 : 1). The traits come back in pure form, so there is no blending, and each gene alone still shows 3 : 1, so segregation holds.
- id: bio-q-0516
  lesson: bio-dihybrid
  module_quiz: true
  topic: Probability in genetics
  stem: 'In the cross AaBbCc × AaBbCc (three unlinked genes), what is the probability of an aabbcc offspring?'
  choices: ['1/8', '1/16', '1/64', '3/64']
  answer: 2
  explanation: |-
    Each gene gives the homozygous recessive genotype with probability 1/4, and the genes are independent, so $\left(\tfrac14\right)^3 = \tfrac{1}{64}$. 1/8 uses 1/2 per gene (the chance of one recessive allele from one parent).
- id: bio-q-0517
  lesson: bio-dihybrid
  topic: Dihybrid crosses
  stem: 'An RrYy plant is test-crossed with an rryy plant. What phenotype ratio is expected in the offspring?'
  choices: ['9 : 3 : 3 : 1', '1 : 1 : 1 : 1', '3 : 1', '1 : 2 : 1']
  answer: 1
  explanation: |-
    RrYy makes RY, Ry, rY and ry gametes equally; rryy adds only ry. Each gamete type from the heterozygote therefore produces its own phenotype, in equal numbers: 1 : 1 : 1 : 1. 9 : 3 : 3 : 1 is for two double heterozygotes.
- id: bio-q-0518
  lesson: bio-dihybrid
  topic: Probability in genetics
  stem: 'What is the probability that an offspring of Aa × Aa is homozygous (either AA or aa)?'
  choices: ['1/2', '1/16', '1/4', '3/4']
  answer: 0
  explanation: |-
    AA and aa are mutually exclusive outcomes, so use the sum rule: $\tfrac14 + \tfrac14 = \tfrac12$. Multiplying them (1/16) is the product-rule mistake; "either … or" adds.
- id: bio-q-0519
  lesson: bio-dihybrid
  topic: Probability in genetics
  stem: 'How many genetically different kinds of gametes can an individual with genotype AaBBCcDd produce, if all four genes are unlinked?'
  choices: ['16', '4', '8', '6']
  answer: 2
  explanation: |-
    Only heterozygous genes double the number of gamete types: A/a, C/c and D/d are heterozygous and BB always gives B, so $2^3 = 8$. 16 would treat BB as heterozygous.
- id: bio-q-0520
  lesson: bio-dihybrid
  module_quiz: true
  topic: Probability in genetics
  stem: 'Two parents are carriers (Aa) of a recessive condition. If they have two children, what is the probability that exactly one child has the condition?'
  choices: ['3/16', '1/4', '1/2', '3/8']
  answer: 3
  explanation: |-
    Affected then unaffected: $\tfrac14 \times \tfrac34 = \tfrac{3}{16}$. Unaffected then affected: also 3/16. These orders are mutually exclusive, so add: $\tfrac{6}{16} = \tfrac38$. Stopping at 3/16 counts only one order.
- id: bio-q-0521
  lesson: bio-dihybrid
  topic: Probability in genetics
  stem: 'In the cross AaBbCc × aabbCc (unlinked genes, complete dominance), what fraction of offspring show the dominant phenotype for all three genes?'
  choices: ['27/64', '9/16', '1/8', '3/16']
  answer: 3
  explanation: |-
    Aa × aa: dominant phenotype 1/2. Bb × bb: 1/2. Cc × Cc: 3/4. Product: $\tfrac12 \times \tfrac12 \times \tfrac34 = \tfrac{3}{16}$. 27/64 would be correct for AaBbCc × AaBbCc, not for this cross.
- id: bio-q-0522
  lesson: bio-dihybrid
  topic: Dihybrid crosses
  stem: 'Which event in meiosis explains Mendel''s law of independent assortment?'
  choices: ['Sister chromatids separate at anaphase II', 'DNA is copied before meiosis begins', 'Each pair of homologous chromosomes lines up at metaphase I independently of the other pairs', 'The cytoplasm divides at the end of telophase II']
  answer: 2
  explanation: |-
    Whether the chromosome with R goes to the same pole as the chromosome with Y or the one with y depends on how the two pairs happen to orient at metaphase I, and each pair orients at random. The other events occur in meiosis but don't determine which alleles of different genes end up together.
- id: bio-q-0523
  lesson: bio-dihybrid
  topic: Dihybrid crosses
  stem: 'A test cross AaBb × aabb gives mostly AaBb and aabb offspring and only a few Aabb and aaBb offspring. What is the best explanation?'
  choices: ['Genes A and B are close together on the same chromosome', 'A and B show incomplete dominance', 'The genes assort independently', 'Nondisjunction occurred in every meiosis']
  answer: 0
  explanation: |-
    Independent assortment predicts 1 : 1 : 1 : 1. An excess of the parental combinations means the alleles A and B (and a and b) tend to stay together: the genes are linked. The rare recombinant offspring come from crossing over between them. Incomplete dominance changes phenotypes, not how alleles are packaged.
- id: bio-q-0524
  lesson: bio-dihybrid
  topic: Dihybrid crosses
  stem: 'Round (R) is dominant to wrinkled and yellow (Y) is dominant to green. In the cross RrYy × Rryy, what fraction of offspring have round, yellow seeds?'
  choices: ['9/16', '3/8', '3/16', '1/2']
  answer: 1
  explanation: |-
    Rr × Rr gives round 3/4; Yy × yy gives yellow 1/2. Product: $\tfrac34 \times \tfrac12 = \tfrac38$. 9/16 assumes a 9 : 3 : 3 : 1 cross, but one parent is yy.
- id: bio-q-0525
  lesson: bio-beyond-mendel
  module_quiz: true
  topic: Incomplete dominance
  stem: 'Red snapdragons crossed with white snapdragons give all pink offspring. If two of the pink plants are crossed, what phenotype ratio is expected?'
  choices: ['3 pink : 1 white', 'All pink', '1 red : 2 pink : 1 white', '3 red : 1 white']
  answer: 2
  explanation: |-
    Pink is the heterozygote $C^RC^W$. Crossing two heterozygotes gives 1 $C^RC^R$ : 2 $C^RC^W$ : 1 $C^WC^W$, and with incomplete dominance each genotype has its own color. 3 : 1 would apply only if one allele were fully dominant; all pink is what blending would predict.
- id: bio-q-0526
  lesson: bio-beyond-mendel
  module_quiz: true
  topic: Codominance
  stem: 'A red bull and a white cow produce a roan calf whose coat is a mixture of individual red hairs and individual white hairs. This is an example of'
  choices: ['codominance', 'incomplete dominance', 'epistasis', 'polygenic inheritance']
  answer: 0
  explanation: |-
    Both alleles are fully expressed side by side: each hair is pure red or pure white. Incomplete dominance would give hairs of an intermediate color. Epistasis involves two genes, and polygenic traits vary continuously.
- id: bio-q-0527
  lesson: bio-beyond-mendel
  topic: Multiple alleles
  stem: 'A woman with type A blood and a man with type B blood have a child with type O blood. What are the parents'' genotypes?'
  choices: ['Mother $I^AI^A$, father $I^BI^B$', 'Mother $I^Ai$, father $I^Bi$', 'Mother $I^Ai$, father $I^BI^B$', 'Mother $ii$, father $ii$']
  answer: 1
  explanation: |-
    A type O child is $ii$ and must have received $i$ from each parent, so both parents carry $i$: $I^Ai$ and $I^Bi$. Parents who are $ii$ would themselves be type O.
- id: bio-q-0528
  lesson: bio-beyond-mendel
  module_quiz: true
  topic: Multiple alleles
  stem: 'A parent with type AB blood ($I^AI^B$) and a parent with type O blood ($ii$) have children. Which blood types are possible among their children?'
  choices: ['AB and O only', 'A, B, AB and O', 'A, B and O', 'A and B only']
  answer: 3
  explanation: |-
    The AB parent gives $I^A$ or $I^B$; the O parent gives only $i$. Children are $I^Ai$ (type A) or $I^Bi$ (type B), each with probability 1/2. Neither AB (needs both $I^A$ and $I^B$) nor O (needs two $i$ alleles) is possible.
- id: bio-q-0529
  lesson: bio-beyond-mendel
  topic: Multiple alleles
  stem: 'With the three ABO alleles $I^A$, $I^B$ and $i$, how many different genotypes are possible?'
  choices: ['4', '6', '3', '9']
  answer: 1
  explanation: |-
    Three homozygotes ($I^AI^A$, $I^BI^B$, $ii$) plus three heterozygotes ($I^AI^B$, $I^Ai$, $I^Bi$) make 6. Four is the number of blood types (phenotypes), because $I^AI^A$ and $I^Ai$ both give type A and $I^BI^B$ and $I^Bi$ both give type B.
- id: bio-q-0530
  lesson: bio-beyond-mendel
  topic: Multiple alleles
  stem: 'Why can type O red blood cells be transfused into a patient with type A blood?'
  choices: ['Type O blood contains no antibodies at all', 'Type O red cells carry the A antigen, which matches the patient', 'Type O red cells carry neither the A nor the B antigen, so the patient''s anti-B antibodies have nothing to attack', 'The $i$ allele is dominant to $I^A$']
  answer: 2
  explanation: |-
    The danger in a transfusion is the patient's antibodies attacking antigens on donor red cells. A type A patient has anti-B antibodies, and type O cells have no A or B antigen. Type O plasma actually contains both anti-A and anti-B antibodies, and $i$ is recessive.
- id: bio-q-0531
  lesson: bio-beyond-mendel
  topic: Multiple alleles
  stem: 'A child has type O blood and the mother has type A. Which man could NOT be the child''s biological father, judging by ABO type alone?'
  choices: ['A man with type AB', 'A man with type A', 'A man with type B', 'A man with type O']
  answer: 0
  explanation: |-
    The child is $ii$ and needs an $i$ allele from the father. A type AB man is $I^AI^B$ and has no $i$ to give. Men with type A or B may be $I^Ai$ or $I^Bi$, and a type O man is $ii$. Blood type can exclude a man but never prove he is the father.
- id: bio-q-0532
  lesson: bio-beyond-mendel
  topic: Polygenic traits
  stem: 'Human adult height varies continuously and forms a bell-shaped distribution. What is the best explanation?'
  choices: ['One gene with two alleles shows complete dominance', 'One gene with many alleles is codominant', 'Height is determined by the environment alone', 'Many genes each add a small effect, and the environment adds further variation']
  answer: 3
  explanation: |-
    Height is polygenic: many genes with small additive effects produce many genotype classes, and nutrition and health blur them into a smooth curve. A single gene with complete dominance would give two distinct classes.
- id: bio-q-0533
  lesson: bio-beyond-mendel
  topic: Polygenic traits
  stem: 'In a model where three unlinked genes each have an additive allele (A, B, C), what fraction of the offspring of AaBbCc × AaBbCc carry exactly three additive alleles?'
  choices: ['5/16', '1/64', '3/8', '1/2']
  answer: 0
  explanation: |-
    The six allele positions each get an additive allele with probability 1/2, so the count follows the 1 : 6 : 15 : 20 : 15 : 6 : 1 pattern out of 64. Exactly three: $\tfrac{20}{64} = \tfrac{5}{16}$. 1/64 is the fraction with all six (or none).
- id: bio-q-0534
  lesson: bio-beyond-mendel
  topic: Polygenic traits
  stem: 'A single allele causes sickle-shaped red blood cells, anemia, episodes of pain and organ damage, and in carriers some resistance to malaria. One gene affecting many traits is called'
  choices: ['epistasis', 'codominance', 'polygenic inheritance', 'pleiotropy']
  answer: 3
  explanation: |-
    Pleiotropy means one gene influences several traits. Epistasis is one gene masking another gene; polygenic inheritance is the opposite situation, many genes affecting one trait.
- id: bio-q-0535
  lesson: bio-beyond-mendel
  module_quiz: true
  topic: Polygenic traits
  stem: 'In Labrador retrievers, B (black) is dominant to b (chocolate), but any dog that is ee is yellow regardless of its B gene. Two BbEe dogs are mated. What fraction of their puppies are expected to be yellow?'
  choices: ['3/16', '1/16', '1/4', '9/16']
  answer: 2
  explanation: |-
    A puppy is yellow whenever it is ee, which has probability 1/4 from Ee × Ee, whatever the B genotype. The full ratio is 9 black : 3 chocolate : 4 yellow. 3/16 is the chocolate fraction ($\tfrac14$ bb × $\tfrac34$ not ee).
- id: bio-q-0536
  lesson: bio-beyond-mendel
  topic: Polygenic traits
  stem: 'Himalayan rabbits are white with dark ears, nose and paws. If a patch of white back fur is shaved and the skin kept cold with an ice pack, the fur grows back dark. What is the best conclusion?'
  choices: ['Cold temperatures cause a mutation in the fur-color gene', 'The pigment enzyme works only at low temperature, so the environment affects the phenotype', 'Dark fur is a polygenic trait', 'The dark allele is dominant only on the ears and paws']
  answer: 1
  explanation: |-
    The rabbit's genotype didn't change; the same genes produced dark fur where the skin was cooler. This shows an environmental effect on gene expression. A mutation would not appear reliably wherever cold is applied.
- id: bio-q-0537
  lesson: bio-sex-linked
  module_quiz: true
  topic: Sex linkage
  stem: 'Why are X-linked recessive conditions such as hemophilia A much more common in males than in females?'
  choices: ['The Y chromosome carries a dominant allele that causes the condition', 'Males inherit their X chromosome from their father', 'Recessive alleles are dominant in males', 'Males have one X chromosome, so a single recessive allele is expressed']
  answer: 3
  explanation: |-
    A male has only one copy of each X-linked gene, so whatever allele it carries shows. A female needs a recessive allele on both X chromosomes. Males inherit their X from their mother, and the Y carries no allele for these genes.
- id: bio-q-0538
  lesson: bio-sex-linked
  module_quiz: true
  topic: Sex linkage
  stem: 'A woman who is a carrier for hemophilia A ($X^HX^h$) and a man without hemophilia ($X^HY$) have a son. What is the probability that the son has hemophilia?'
  choices: ['1/4', '0', '1/2', '1']
  answer: 2
  explanation: |-
    A son gets Y from his father and one of his mother's X chromosomes, $X^H$ or $X^h$, with equal probability, so 1/2. The answer 1/4 is the probability that a child of unknown sex is an affected son.
- id: bio-q-0539
  lesson: bio-sex-linked
  topic: Sex linkage
  stem: 'A color-blind man ($X^bY$) and a woman who is homozygous for normal vision ($X^BX^B$) have children. Which describes their daughters?'
  choices: ['All are carriers with normal vision', 'All are color-blind', 'Half are color-blind and half are carriers', 'Half are carriers and half are $X^BX^B$']
  answer: 0
  explanation: |-
    Every daughter receives her father's only X, $X^b$, and an $X^B$ from her mother, so all are $X^BX^b$: normal vision, carriers. None can be color-blind, because the mother has no $X^b$ to give.
- id: bio-q-0540
  lesson: bio-sex-linked
  topic: Sex linkage
  stem: 'A man with an X-linked recessive condition has a son. Why can''t the son inherit the condition from his father?'
  choices: ['The allele is recessive, so it is masked in all sons', 'A father passes his Y chromosome, not his X, to every son', 'X-linked alleles are passed only to daughters by mothers', 'Sons inherit both sex chromosomes from their mother']
  answer: 1
  explanation: |-
    A child is male because he got his father's Y, so his single X came from his mother. The father's X goes to every daughter instead. Sons get only one sex chromosome from their mother, not both.
- id: bio-q-0541
  lesson: bio-sex-linked
  module_quiz: true
  topic: Pedigrees
  stem: 'In a pedigree, two parents who do not have a condition have a daughter who does. Which inheritance pattern fits?'
  choices: ['Autosomal dominant', 'Autosomal recessive', 'X-linked recessive', 'Y-linked']
  answer: 1
  explanation: |-
    A dominant condition would require an affected parent. An X-linked recessive daughter needs an $X^a$ from her father, who would then be affected. Y-linked traits never appear in daughters. So both parents are carriers of an autosomal recessive allele.
- id: bio-q-0542
  lesson: bio-sex-linked
  topic: Pedigrees
  stem: 'Two unaffected carrier parents (Aa × Aa) have a child with an autosomal recessive condition and also an unaffected son. What is the probability that this unaffected son is a carrier?'
  choices: ['1/2', '1/4', '2/3', '3/4']
  answer: 2
  explanation: |-
    The son is not aa, so only three Punnett boxes remain possible: AA, Aa, aA. Two of the three are carriers: 2/3. The value 1/2 is the carrier probability for a child whose phenotype is not yet known.
- id: bio-q-0543
  lesson: bio-sex-linked
  topic: Pedigrees
  stem: 'In a standard pedigree, what does a filled-in square represent?'
  choices: ['A female who has the trait', 'A male who is a carrier', 'A male who does not have the trait', 'A male who has the trait']
  answer: 3
  explanation: |-
    Squares are males and circles females; a filled symbol means the person has the trait. Carriers, when shown, are marked with a dot or a half-filled symbol, and an open square is an unaffected male.
- id: bio-q-0544
  lesson: bio-sex-linked
  topic: Sex linkage
  stem: 'Morgan crossed a white-eyed male fruit fly with a red-eyed female. The F1 were all red-eyed, and in the F2 every white-eyed fly was male. What did he conclude?'
  choices: ['The eye-color gene is on the X chromosome', 'White eyes are dominant in males', 'The eye-color gene is on the Y chromosome', 'Eye color is a polygenic trait']
  answer: 0
  explanation: |-
    F2 sons get their only X from their carrier mother, so half are white-eyed, while daughters all get the father's red-eye X. A Y-linked gene would pass from father to all sons and appear in the F1 males. The all-red F1 shows white is recessive.
- id: bio-q-0545
  lesson: bio-sex-linked
  module_quiz: true
  topic: Sex linkage
  stem: 'A color-blind woman ($X^bX^b$) and a man with normal vision ($X^BY$) have a son. What is the probability that he is color-blind?'
  choices: ['1/2', '1/4', '1', '0']
  answer: 2
  explanation: |-
    A son's X comes from his mother, and every X she has carries $b$. So every son is $X^bY$ and color-blind. (Every daughter is an $X^BX^b$ carrier.)
- id: bio-q-0546
  lesson: bio-sex-linked
  topic: Pedigrees
  stem: 'In a family, two parents who both have a condition have a child who does not. Which inheritance pattern is consistent with this?'
  choices: ['Autosomal recessive', 'X-linked recessive', 'Y-linked', 'Autosomal dominant']
  answer: 3
  explanation: |-
    Two affected parents can each be Aa for a dominant condition and have an aa child. For an autosomal recessive condition, two aa parents can only have aa children; for X-linked recessive, an affected mother and father give only affected children. A Y-linked trait can't affect the mother.
- id: bio-q-0547
  lesson: bio-sex-linked
  topic: Sex linkage
  stem: 'About 8% of men in a population are red-green color-blind. If the same fraction of X chromosomes carry the allele, about what percentage of women would you expect to be color-blind?'
  choices: ['0.64%', '8%', '4%', '16%']
  answer: 0
  explanation: |-
    A man is affected if his one X carries the allele (probability 0.08). A woman needs it on both X chromosomes: $0.08 \times 0.08 = 0.0064 = 0.64\%$. That is why the condition is much rarer in women.
- id: bio-q-0548
  lesson: bio-chromosomes
  module_quiz: true
  topic: Chromosomal disorders
  stem: 'How many autosomes are in a typical human body cell?'
  choices: ['46', '44', '22', '23']
  answer: 1
  explanation: |-
    A typical body cell has 46 chromosomes: 22 pairs of autosomes (44) and one pair of sex chromosomes. 46 counts the sex chromosomes too; 22 is the number of autosomal pairs; 23 is the number in a gamete.
- id: bio-q-0549
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'If nondisjunction of one chromosome pair occurs in meiosis I, what are the four gametes like?'
  choices: ['All four are normal', 'Two have an extra chromosome and two are missing one', 'Two are normal, one has an extra chromosome and one is missing one', 'All four have an extra chromosome']
  answer: 1
  explanation: |-
    In meiosis I both homologs go to one cell, so that cell's two products are n + 1 and the other cell's two products are n − 1. Two normal gametes plus one n + 1 and one n − 1 is the result of nondisjunction in meiosis II.
- id: bio-q-0550
  lesson: bio-chromosomes
  module_quiz: true
  topic: Chromosomal disorders
  stem: 'How many chromosomes are in the body cells of a person with Down syndrome caused by trisomy 21?'
  choices: ['46', '45', '69', '47']
  answer: 3
  explanation: |-
    Trisomy means three copies of one chromosome instead of two, so 46 + 1 = 47. 45 would be a monosomy (as in 45,X); 69 would be a whole extra set of chromosomes (triploidy).
- id: bio-q-0551
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'A sperm that carries both an X and a Y chromosome, after nondisjunction in meiosis I, fertilizes a normal egg. What is the karyotype of the zygote?'
  choices: ['47,XXY', '45,X', '47,XYY', '46,XY']
  answer: 0
  explanation: |-
    The egg adds 23 chromosomes including an X; the sperm has 24 including X and Y. Total: 47,XXY (Klinefelter syndrome). 45,X comes from a gamete with no sex chromosome; 47,XYY would need two Y chromosomes from the father (nondisjunction in meiosis II).
- id: bio-q-0552
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'Which condition could NOT be detected from a standard karyotype?'
  choices: ['Down syndrome (trisomy 21)', 'Turner syndrome (45,X)', 'Cystic fibrosis, caused by a recessive allele of a single gene', 'A large deletion on chromosome 5']
  answer: 2
  explanation: |-
    A karyotype shows chromosome number and large structural changes. A cystic fibrosis allele is a small change within one gene that leaves the chromosome looking normal; it needs DNA testing.
- id: bio-q-0553
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'A segment of chromosome 9 breaks off and becomes attached to chromosome 22. This structural change is'
  choices: ['a deletion', 'an inversion', 'a duplication', 'a translocation']
  answer: 3
  explanation: |-
    A translocation moves a segment to a non-homologous chromosome. A deletion loses a segment, an inversion flips one in place, and a duplication repeats one.
- id: bio-q-0554
  lesson: bio-chromosomes
  module_quiz: true
  topic: Chi-square test
  stem: 'A chi-square test compares observed counts in four phenotype classes with a 9 : 3 : 3 : 1 prediction. How many degrees of freedom are there?'
  choices: ['3', '4', '1', '15']
  answer: 0
  explanation: |-
    Degrees of freedom = number of categories − 1 = 4 − 1 = 3. Using the number of categories (4) is the common mistake; 15 is 16 − 1, the ratio total minus one.
- id: bio-q-0555
  lesson: bio-chromosomes
  module_quiz: true
  topic: Chi-square test
  stem: 'A cross is expected to give 3 : 1. Of 120 offspring, 84 show the dominant trait and 36 the recessive trait. What is $\chi^2$?'
  choices: ['1.43', '0.40', '1.60', '3.84']
  answer: 2
  explanation: |-
    Expected: 90 and 30. $\chi^2 = \dfrac{(84-90)^2}{90} + \dfrac{(36-30)^2}{30} = 0.40 + 1.20 = 1.60$. Dividing by the observed counts instead gives 1.43; 0.40 is only the first term; 3.84 is the critical value, not the statistic.
- id: bio-q-0556
  lesson: bio-chromosomes
  topic: Chi-square test
  stem: 'A test cross expected to give 1 : 1 yields $\chi^2 = 5.2$. Using $p = 0.05$, what should you conclude?'
  choices: ['Fail to reject, because 5.2 is less than the critical value 5.99', 'Reject the 1 : 1 hypothesis, because 5.2 is greater than the critical value 3.84 for df = 1', 'The data prove the 1 : 1 hypothesis is true', 'Fail to reject, because $\chi^2$ is positive']
  answer: 1
  explanation: |-
    Two categories give df = 1, critical value 3.84. Since $5.2 \ge 3.84$, a deviation this large would happen by chance less than 5% of the time, so reject. 5.99 is the critical value for df = 2. A chi-square test never proves a hypothesis.
- id: bio-q-0557
  lesson: bio-chromosomes
  topic: Chi-square test
  stem: 'Why must a chi-square test use raw counts rather than percentages?'
  choices: ['Percentages can''t be squared', 'Percentages always add to 100, which makes $\chi^2$ zero', 'The test depends on sample size, and percentages hide how many individuals were counted', 'Expected values can only be whole numbers']
  answer: 2
  explanation: |-
    A 55% : 45% split is unremarkable among 20 offspring but very unlikely by chance among 2000. Counts carry that sample-size information; percentages discard it. Expected counts can be non-integers (e.g. 312.75).
- id: bio-q-0558
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'The risk of trisomy 21 rises with the age of the egg-producing parent. What is the main reason?'
  choices: ['Egg cells stay paused partway through meiosis I for years or decades, which raises the chance of nondisjunction', 'Older parents produce more eggs per cycle', 'Chromosome 21 is copied more often in older people', 'Sperm cells cannot undergo nondisjunction']
  answer: 0
  explanation: |-
    Human oocytes begin meiosis I before birth and pause until ovulation, so an egg released at 40 has been paused for about 40 years; errors in separating chromosomes become more likely. Nondisjunction also occurs in sperm formation, but it accounts for a smaller share of trisomy 21.
# Round 2: new question types for the core lessons
- id: bio-q-0559
  lesson: bio-mendel
  module_quiz: true
  type: label
  topic: Mendelian genetics
  stem: 'This picture follows Mendel''s flower-color experiment. Name each numbered generation.'
  image: {src: images/m5-mendel-cross-blank.svg, alt: 'Three rows of pea flowers joined by arrows. Row 1: a purple PP flower crossed with a white pp flower. Row 2, reached by crossing: four purple Pp flowers. Row 3, reached by self-pollination: three purple flowers (PP, Pp, Pp) and one white flower (pp).'}
  labels:
    - {x: 8, y: 16.3, text: P generation}
    - {x: 8, y: 48.8, text: F1 generation}
    - {x: 8, y: 82.6, text: F2 generation}
  distractors: [F3 generation, Test-cross offspring]
  explanation: |-
    Row 1 is the parental (P) generation: two true-breeding plants, PP and pp. Their offspring are the first filial generation, F1, all Pp and purple. Letting the F1 self-pollinate gives the F2, with 3 purple : 1 white. No row is a test cross, which would need a cross with a homozygous recessive (pp) plant.
- id: bio-q-0560
  lesson: bio-mendel
  type: text
  topic: Mendelian genetics
  stem: 'A pea plant with two identical alleles for a gene, such as PP, is ___ for that gene; a plant with two different alleles, Pp, is ___.'
  accept:
    - [homozygous, homozygote, homozygotic]
    - [heterozygous, heterozygote, heterozygotic]
  explanation: |-
    "Homo-" means same and "hetero-" means different. PP and pp are homozygous; Pp is heterozygous. PP and Pp plants look alike (purple), which is why a genotype can't be read from the phenotype alone.
- id: bio-q-0561
  lesson: bio-mendel
  type: match
  topic: Mendelian genetics
  stem: 'Match each term to its meaning.'
  pairs:
    - [Gene, A stretch of DNA that affects a trait]
    - [Allele, One version of a gene]
    - [Genotype, The pair of alleles an individual carries]
    - [Phenotype, The trait you can observe]
  distractors: [The cell formed when two gametes fuse]
  explanation: |-
    A gene (such as the flower-color gene) comes in alleles (P and p). The genotype is the allele pair (PP, Pp or pp); the phenotype is what shows (purple or white). The cell formed by fertilization is a zygote, which isn't one of these terms.
- id: bio-q-0562
  lesson: bio-mendel
  topic: Mendelian genetics
  stem: 'Purple (P) is dominant to white (p). Which statements about the cross Pp × Pp are true? Select all that apply.'
  choices: ['About 3/4 of the offspring are expected to be purple', 'The expected genotype ratio is 1 PP : 2 Pp : 1 pp', 'About half of the offspring are expected to be PP', 'Each gamete carries exactly one allele of the flower-color gene']
  answer: [0, 1, 3]
  explanation: |-
    The Punnett square has four equally likely boxes, PP, Pp, Pp and pp: genotypes 1 : 2 : 1 and phenotypes 3 purple : 1 white. Every gamete carries one allele (the law of segregation). PP is only 1/4 of the offspring; half are Pp, not PP.
- id: bio-q-0563
  lesson: bio-mendel
  module_quiz: true
  type: text
  caseSensitive: true
  topic: Mendelian genetics
  stem: 'The offspring of a cross come out 1 PP : 2 Pp : 1 pp. Type each parent''s genotype, using P and p: ___ and ___.'
  accept:
    - [Pp, pP]
    - [Pp, pP]
  explanation: |-
    PP offspring need a P from each parent, and pp offspring need a p from each parent, so both parents carry both alleles: Pp × Pp. That cross gives exactly 1 PP : 2 Pp : 1 pp. (Capital letters matter: P is the dominant allele and p the recessive one.)
- id: bio-q-0564
  lesson: bio-dihybrid
  type: text
  topic: Probability in genetics
  stem: 'The probability that two independent events both happen is found by multiplying their probabilities. This is called the ___ rule.'
  accept: [product, multiplication, multiplicative]
  explanation: |-
    The product rule: $P(A \text{ and } B) = P(A) \times P(B)$ for independent events. The sum rule is for "or" with mutually exclusive outcomes.
- id: bio-q-0565
  lesson: bio-dihybrid
  module_quiz: true
  type: order
  topic: Dihybrid crosses
  stem: 'Put these events in order, from just before meiosis in an RrYy plant to its gametes.'
  items:
    - 'DNA replicates, so each chromosome has two sister chromatids'
    - 'Homologous pairs line up at the metaphase plate, each pair oriented at random'
    - 'Homologs separate in anaphase I'
    - 'Sister chromatids separate in meiosis II'
    - 'Four haploid cells form, each carrying one allele of each gene (RY, Ry, rY or ry)'
  explanation: |-
    DNA is copied before meiosis begins (interphase). In metaphase I the R/r pair and the Y/y pair line up independently, which is the source of independent assortment. Anaphase I separates homologs, meiosis II separates sister chromatids, and the result is four haploid cells. Across many meioses, RY, Ry, rY and ry each make up 1/4.
- id: bio-q-0566
  lesson: bio-dihybrid
  type: match
  topic: Probability in genetics
  stem: 'In the cross RrYy × RrYy (round and yellow dominant, genes unlinked), match each phenotype to its probability.'
  pairs:
    - ['Round and yellow', '9/16']
    - ['Round and green', '3/16']
    - ['Wrinkled and green', '1/16']
    - ['Wrinkled, any color', '1/4']
  distractors: ['3/8', '1/2']
  explanation: |-
    Gene by gene: round 3/4, wrinkled 1/4; yellow 3/4, green 1/4. Round and yellow $= \tfrac34 \times \tfrac34 = \tfrac{9}{16}$; round and green $= \tfrac34 \times \tfrac14 = \tfrac{3}{16}$; wrinkled and green $= \tfrac14 \times \tfrac14 = \tfrac{1}{16}$. "Wrinkled, any color" ignores the color gene, so it is just $\tfrac14$ (equal to $\tfrac{3}{16} + \tfrac{1}{16}$).
- id: bio-q-0567
  lesson: bio-dihybrid
  topic: Probability in genetics
  stem: 'Which of these calculations for the offspring of Aa × Aa are correct? Select all that apply.'
  choices: ['P(AA or aa) = 1/4 + 1/4 = 1/2', 'P(two children, both aa) = 1/4 × 1/4 = 1/16', 'P(Aa) = 1/2 × 1/2 = 1/4', 'P(not aa) = 1 − 1/4 = 3/4']
  answer: [0, 1, 3]
  explanation: |-
    AA and aa are mutually exclusive, so add: 1/2. Two children are independent, so multiply: 1/16. "Not aa" is the complement of aa: 3/4. The Aa calculation is wrong: Aa can form two ways (A from the mother and a from the father, or the reverse), so $P(\text{Aa}) = \tfrac14 + \tfrac14 = \tfrac12$, not $\tfrac14$.
- id: bio-q-0568
  lesson: bio-dihybrid
  topic: Probability in genetics
  stem: 'A branch diagram is drawn for AaBbCc × AaBbCc (three unlinked genes, complete dominance), splitting each branch into "dominant" and "recessive" for each gene in turn. How many end branches (phenotype classes) does it have?'
  choices: ['3', '6', '8', '27']
  answer: 2
  explanation: |-
    Each gene doubles the number of branches (dominant or recessive phenotype): $2 \times 2 \times 2 = 8$ phenotype classes, in a 27 : 9 : 9 : 9 : 3 : 3 : 3 : 1 ratio. 27 is the number of genotypes (3 per gene, $3^3$) and also the size of the largest class out of 64; 6 adds instead of multiplying.
- id: bio-q-0569
  lesson: bio-beyond-mendel
  module_quiz: true
  type: label
  topic: Multiple alleles
  stem: 'Each red blood cell carries the antigens shown by the key. Name the ABO blood type of each numbered cell.'
  image: {src: images/m5-abo-cells-blank.svg, alt: 'Four red blood cells. Cell 1 has both triangle and circle antigens on its surface, cell 2 has none, cell 3 has only triangles, and cell 4 has only circles. A key shows that triangles are A antigens and circles are B antigens.'}
  labels:
    - {x: 13.9, y: 41.7, text: Type AB}
    - {x: 37.9, y: 41.7, text: Type O}
    - {x: 61.9, y: 41.7, text: Type A}
    - {x: 86, y: 41.7, text: Type B}
  explanation: |-
    Blood type is named for the antigens on the red cells: A antigens only, type A (cell 3); B only, type B (cell 4); both, type AB (cell 1, from codominant $I^A$ and $I^B$); neither, type O (cell 2, genotype $ii$).
- id: bio-q-0570
  lesson: bio-beyond-mendel
  type: match
  topic: Codominance
  stem: 'Match each example to the kind of inheritance it shows.'
  pairs:
    - ['Red × white snapdragons give pink offspring', Incomplete dominance]
    - ['Roan cattle have separate red hairs and white hairs', Codominance]
    - ['A person with $I^AI^B$ has both A and B antigens', Codominance]
    - ['Adult height varies continuously in a bell curve', Polygenic inheritance]
    - ['Any ee Labrador is yellow, whatever its B gene', Epistasis]
  distractors: [Sex linkage]
  explanation: |-
    Pink is an intermediate heterozygote (incomplete dominance). Roan coats and AB blood show both alleles fully (codominance). Continuous variation comes from many genes with small effects (polygenic). The E gene masking the B gene is epistasis. None of these genes is on the X chromosome.
- id: bio-q-0571
  lesson: bio-beyond-mendel
  type: text
  caseSensitive: true
  topic: Multiple alleles
  stem: 'Using the ABO allele symbols, a person with type O blood has the genotype ___ (type the two lower-case letters).'
  accept: [ii]
  explanation: |-
    Type O needs two copies of the recessive $i$ allele, so the genotype is $ii$. Any $I^A$ or $I^B$ allele would add an A or B antigen.
- id: bio-q-0572
  lesson: bio-beyond-mendel
  topic: Multiple alleles
  stem: 'Considering ABO type only, which donors could give red blood cells to a patient with type B blood? Select all that apply.'
  choices: [A type O donor, A type B donor, A type A donor, A type AB donor]
  answer: [0, 1]
  explanation: |-
    A type B patient has anti-A antibodies in their plasma, which attack red cells carrying the A antigen. Type O cells (no A or B antigen) and type B cells (B antigen only) are safe. Type A and type AB cells carry the A antigen and would be attacked.
- id: bio-q-0573
  lesson: bio-beyond-mendel
  topic: Polygenic traits
  stem: 'Cuttings from one hydrangea plant are planted in two gardens. In acidic soil they bloom blue; in more alkaline soil they bloom pink. What does this show?'
  choices: ['The two gardens selected plants with different flower-color alleles', 'Flower color in hydrangeas shows incomplete dominance', 'Soil pH causes mutations in the flower-color genes', 'Phenotype depends on the environment as well as the genotype']
  answer: 3
  explanation: |-
    Cuttings of one plant are genetically identical, so the different colors come from the environment acting on the same genotype. No selection or mutation happened between cuttings, and incomplete dominance is about heterozygotes, not about the same genotype in different conditions.
- id: bio-q-0574
  lesson: bio-sex-linked
  module_quiz: true
  type: label
  topic: Pedigrees
  stem: 'Name each numbered pedigree symbol or line.'
  image: {src: images/m5-pedigree-symbols-blank.svg, alt: 'A row of five pedigree symbols: a circle with a dot in it, an open square, a filled circle, an open circle and a filled square. Below, a small family: a square and a circle joined by a horizontal line, with a line leading down to a son (filled square) and a daughter (open circle).'}
  labels:
    - {x: 11.8, y: 30.4, text: Carrier female}
    - {x: 30.9, y: 30.4, text: Unaffected male}
    - {x: 50, y: 30.4, text: Affected female}
    - {x: 69.1, y: 30.4, text: Unaffected female}
    - {x: 88.2, y: 30.4, text: Affected male}
    - {x: 38.2, y: 56.3, text: Mating line joining two parents}
  distractors: [Line to their children]
  explanation: |-
    Squares are males and circles females; filled means affected, open means unaffected, and a dot marks a known carrier. Marker 6 sits on the horizontal line joining a man and a woman, which shows a mating; the line that drops from it leads to their children.
- id: bio-q-0575
  lesson: bio-sex-linked
  module_quiz: true
  topic: Pedigrees
  stem: 'This pedigree shows a rare condition, so assume people who marry into the family don''t carry the allele. Which inheritance pattern fits best?'
  image: {src: images/m5-pedigree-dominant.svg, alt: 'Three generations. Generation I: an affected man (I-1) and an unaffected woman (I-2). Generation II: their affected son II-2, who has children with unaffected II-1; an unaffected daughter II-3; and an affected daughter II-4, who has children with unaffected II-5. Generation III: II-1 and II-2 have an affected daughter and an unaffected son; II-4 and II-5 have an affected son and an unaffected daughter.'}
  choices: ['Autosomal recessive', 'Autosomal dominant', 'X-linked recessive', 'Y-linked']
  answer: 1
  explanation: |-
    Every affected person has an affected parent, and the trait appears in every generation, in both sexes. Autosomal recessive would need each unaffected spouse to be a carrier, which is unlikely for a rare allele. X-linked recessive is ruled out because I-1 passes the condition to his son II-2 (fathers give sons a Y, not an X) and because an affected father with a non-carrier wife would have no affected children. Y-linked is ruled out by the affected daughters.
- id: bio-q-0576
  lesson: bio-sex-linked
  type: text
  topic: Sex linkage
  stem: 'A son always receives his X chromosome from his ___.'
  accept: [mother, mom, mum, mother's]
  explanation: |-
    A son is XY: his Y must come from his father, so his only X comes from his mother. That is why an X-linked trait in a son traces back through his mother, and why fathers never pass X-linked alleles to sons.
- id: bio-q-0577
  lesson: bio-sex-linked
  topic: Sex linkage
  stem: 'This pedigree shows an X-linked recessive trait. Which people must carry at least one copy of the recessive allele? Select all that apply.'
  image: {src: images/m5-pedigree-xlinked.svg, alt: 'Generation I: an affected man (I-1) and an unaffected woman (I-2). Generation II: their unaffected son II-1 and two carrier daughters, II-2 and II-3; II-3 has children with an unaffected man, II-4. Generation III: an affected son III-1, an unaffected daughter III-2 and an unaffected son III-3.'}
  choices: ['I-1', 'II-1', 'II-2', 'III-2']
  answer: [0, 2]
  explanation: |-
    I-1 is affected, so he carries the allele on his X. Every daughter gets her father's only X, so II-2 must be a carrier. II-1 is an unaffected male: with only one X, any recessive allele would show, so he has none. III-2's mother is a carrier and her father is unaffected, so she has a 1/2 chance of being a carrier; she doesn't have to be one.
- id: bio-q-0578
  lesson: bio-sex-linked
  type: match
  topic: Pedigrees
  stem: 'Match each inheritance pattern to a pedigree clue that points to it.'
  pairs:
    - ['Autosomal recessive', 'Two unaffected parents have an affected daughter']
    - ['Autosomal dominant', 'Every affected person has an affected parent, and two affected parents have an unaffected child']
    - ['X-linked recessive', 'Mostly affected males, with unaffected mothers, and never passed from father to son']
  distractors: ['Only females are ever affected']
  explanation: |-
    An affected daughter of unaffected parents rules out dominance and X-linked recessive, leaving autosomal recessive. Two affected parents with an unaffected child means both are heterozygous for a dominant allele. Mostly affected males with carrier mothers and no father-to-son transmission is the X-linked recessive signature. No pattern in this lesson affects only females.
- id: bio-q-0579
  lesson: bio-chromosomes
  module_quiz: true
  type: label
  topic: Chromosomal disorders
  stem: 'Name the numbered parts of this replicated chromosome, as it appears in a karyotype.'
  image: {src: images/m5-chromosome-parts-blank.svg, alt: 'A replicated chromosome: two identical side-by-side strands joined at a narrow point, with a short section above the narrow point and a long section below. Dark stripes cross both strands. Brackets mark the upper section, the lower section and the pair of strands.'}
  labels:
    - {x: 60.6, y: 33.3, text: Centromere}
    - {x: 66.7, y: 44.4, text: Band}
    - {x: 43, y: 22.2, text: Short arm (p)}
    - {x: 43, y: 59.6, text: Long arm (q)}
    - {x: 60.6, y: 89.3, text: Sister chromatids}
  distractors: [Homologous chromosome]
  explanation: |-
    The narrow point is the centromere, which joins the two sister chromatids (identical copies made in S phase). It divides the chromosome into a short arm, p, and a long arm, q. Dark stripes are stained bands, used to identify each chromosome. A homologous chromosome would be a second, separate chromosome, the matching one from the other parent.
- id: bio-q-0580
  lesson: bio-chromosomes
  module_quiz: true
  type: order
  topic: Chi-square test
  stem: 'Put the steps of a chi-square test in order.'
  items:
    - 'State the hypothesis and the ratio it predicts'
    - 'Calculate the expected count in each category'
    - 'Compute (O − E)²/E for each category and add them up'
    - 'Compare chi-square with the critical value for df = categories − 1 and decide whether to reject'
  explanation: |-
    The hypothesis comes first, because it fixes the expected counts. The expected counts are needed to compute $\chi^2 = \sum (O - E)^2/E$, and the finished $\chi^2$ is then compared with the critical value at $p = 0.05$ for df = categories − 1.
- id: bio-q-0581
  lesson: bio-chromosomes
  type: text
  topic: Chromosomal disorders
  stem: 'Having an abnormal number of one or more chromosomes, as in trisomy 21 or 45,X, is called ___.'
  accept: [aneuploidy, aneuploid, aneuploidies]
  explanation: |-
    Aneuploidy means a number of chromosomes that isn't an exact multiple of the haploid set: one extra (trisomy) or one missing (monosomy). Whole extra sets are polyploidy instead.
- id: bio-q-0582
  lesson: bio-chromosomes
  topic: Chromosomal disorders
  stem: 'Using the figure, which statements about nondisjunction are correct? Select all that apply.'
  image: {src: images/m5-nondisjunction.svg, alt: 'Two diagrams following one chromosome pair through meiosis. Left, nondisjunction in meiosis I: the four gametes are n + 1, n + 1, n − 1 and n − 1. Right, nondisjunction in meiosis II in one of the two cells: the gametes are n + 1, n − 1, n and n.'}
  choices: ['When nondisjunction happens in meiosis I, all four gametes are abnormal', 'When nondisjunction happens in meiosis II, half of the gametes can be normal', 'An n + 1 gamete fertilized by a normal gamete gives a trisomic zygote', 'Nondisjunction in meiosis II produces two n + 1 gametes']
  answer: [0, 1, 2]
  explanation: |-
    In meiosis I both homologs go to one cell, so its two gametes are n + 1 and the other cell's two are n − 1. In meiosis II only one cell's chromatids fail to separate: one n + 1, one n − 1, and two normal gametes, so there is only one n + 1 gamete, not two. An n + 1 gamete plus a normal n gamete gives three copies of that chromosome, a trisomy.
- id: bio-q-0583
  lesson: bio-chromosomes
  type: match
  topic: Chromosomal disorders
  stem: 'Match each karyotype to the condition it describes.'
  pairs:
    - ['47,XX,+21', Down syndrome]
    - ['45,X', Turner syndrome]
    - ['47,XXY', Klinefelter syndrome]
    - ['47,XY,+18', Trisomy 18 (Edwards syndrome)]
  distractors: [Cri-du-chat syndrome]
  explanation: |-
    +21 means an extra chromosome 21 (Down syndrome); 45,X is one X and no second sex chromosome (Turner); 47,XXY is an extra X in a male (Klinefelter); +18 is trisomy 18 (Edwards). Cri-du-chat is a deletion on chromosome 5, which changes structure rather than the number of chromosomes.
# Round 2: honors lesson bio-h-linkage
- id: bio-qh-0501
  lesson: bio-h-linkage
  topic: Linkage
  stem: 'Fruit fly geneticists measuring linkage test-cross a heterozygous female, not a heterozygous male. Why?'
  choices: ['Male fruit flies have no crossing over in meiosis, so a heterozygous male would give no recombinant offspring', 'Males carry only one copy of every gene, so they cannot be heterozygous', 'Females produce more offspring, which is the only reason', 'Recombinant offspring of males do not survive']
  answer: 0
  explanation: |-
    In Drosophila, meiosis in males lacks crossing over, so a doubly heterozygous male passes on only his two parental chromosomes. Males do have two copies of autosomal genes (only X-linked genes are single-copy). Offspring numbers and survival are not the reason.
- id: bio-qh-0502
  lesson: bio-h-linkage
  topic: Linkage
  stem: 'A dihybrid test cross gives 412 AaBb, 398 aabb, 96 Aabb and 94 aaBb offspring. What is the recombination frequency between A and B?'
  choices: ['9.5%', '19%', '23.5%', '38%']
  answer: 1
  explanation: |-
    The two large classes (AaBb, aabb) are parental; the two small ones are recombinant. $\dfrac{96 + 94}{1000} = 0.19$, or 19% (19 map units). 9.5% counts only one recombinant class; 23.5% divides by the parental total (810) instead of all offspring; 38% doubles the right answer.
- id: bio-qh-0503
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'Recombination frequencies among three linked genes are: A–B 12%, B–C 7%, A–C 19%. What is the gene order?'
  choices: ['The order can''t be found without a three-point cross', 'C is in the middle: A–C–B', 'A is in the middle: B–A–C', 'B is in the middle: A–B–C']
  answer: 3
  explanation: |-
    The largest distance (A–C, 19) spans the two outer genes, so B is between them; check $12 + 7 = 19$. The order is A–B–C (equivalently C–B–A). The other orders would need A–C to be one of the smaller distances, and pairwise distances are enough to order three genes; a three-point cross only refines the distances.
- id: bio-qh-0504
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'Why does the recombination frequency between two genes on the same chromosome never meaningfully exceed 50%, however far apart they are?'
  choices: ['Genes more than 50 map units apart move to different chromosomes', 'Each crossover involves only two of the four chromatids, and multiple crossovers between distant genes randomize the alleles', 'Crossing over happens in only half of all meioses', 'Recombinant gametes are less likely than parental gametes to be used in fertilization']
  answer: 1
  explanation: |-
    Crossing over happens at the four-chromatid stage. Even if every meiosis has a crossover between the genes, only two of four chromatids are recombinant, and with several crossovers some swap the alleles back. The result approaches the 50% of independent assortment. Genes don't move between chromosomes; crossovers aren't limited to half of meioses; gametes aren't chosen by type.
- id: bio-qh-0505
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'In a three-point test cross, the parental classes are D E F and d e f, and the two rarest classes are D e F and d E f. Which gene is in the middle?'
  choices: ['D', 'F', 'It cannot be told without the map distances', 'E']
  answer: 3
  explanation: |-
    A double crossover swaps only the middle gene relative to the two outer genes. Comparing D E F with D e F, only E has changed, so E is in the middle (order D–E–F). The map distances aren't needed to find the order.
- id: bio-qh-0506
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'Genes A and B are 10 map units apart. A plant that is Ab / aB is test-crossed with ab / ab and produces 1000 offspring. About how many offspring are expected to be AaBb (from AB gametes)?'
  choices: ['50', '100', '450', '250']
  answer: 0
  explanation: |-
    In this plant the parental gametes are Ab and aB (repulsion). AB is a recombinant gamete: recombinants make up 10%, split equally between AB and ab, so AB is 5%, and $0.05 \times 1000 = 50$. 100 is all recombinants together; 450 is one parental class; 250 assumes no linkage.
- id: bio-qh-0507
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'What does it mean to say two genes are 25 map units apart?'
  choices: ['They are 25,000 base pairs apart', 'They are on chromosomes 25 positions apart in the karyotype', 'About 25% of gametes are recombinant for the two genes', 'They have a 25% chance of being on different chromosomes']
  answer: 2
  explanation: |-
    One map unit (centimorgan) is defined as 1% recombination, so 25 map units means about 25% recombinant gametes. Map units measure crossover frequency, not physical length, and have nothing to do with karyotype position.
- id: bio-qh-0508
  lesson: bio-h-linkage
  topic: Gene mapping
  stem: 'In a three-point cross, 20 double-crossover offspring are expected if crossovers in the two intervals are independent, but only 12 are observed. What is the interference?'
  choices: ['0.6', '0.4', '1.67', '0.12']
  answer: 1
  explanation: |-
    Coefficient of coincidence = observed ÷ expected $= 12/20 = 0.6$. Interference $= 1 - 0.6 = 0.4$. 0.6 is the coefficient of coincidence itself; 1.67 divides the wrong way; 0.12 has no meaning here.
- id: bio-qh-0509
  lesson: bio-h-linkage
  topic: Linkage
  stem: 'Two genes show a recombination frequency of 50% in a test cross. What can you conclude?'
  choices: ['They are certainly on different chromosomes', 'They are certainly on the same chromosome, very close together', 'The test cross must have been done wrong', 'They are either on different chromosomes or far apart on the same chromosome']
  answer: 3
  explanation: |-
    50% recombination is what independent assortment gives, and genes far apart on one chromosome also approach 50% because of multiple crossovers. The test can't tell the two cases apart; mapping intermediate genes can. Close genes would show low recombination.
- id: bio-qh-0510
  lesson: bio-h-linkage
  type: label
  topic: Gene mapping
  stem: 'Three linked genes have these recombination frequencies: R–S 22%, S–T 9%, R–T 13%. On the map, which gene is at each numbered position?'
  image: {src: images/m5-linkage-map-blank.svg, alt: 'A horizontal chromosome with three numbered gene positions: position 1 at the left end, position 2 thirteen map units to its right, and position 3 nine map units beyond position 2.'}
  labels:
    - {x: 9.7, y: 51, text: Gene R}
    - {x: 57.3, y: 51, text: Gene T}
    - {x: 90.3, y: 51, text: Gene S}
  explanation: |-
    The largest frequency, R–S (22), spans the outer genes, so T is in the middle ($13 + 9 = 22$). The left interval is 13 units, which matches R–T, and the right interval is 9, matching T–S. So position 1 is R, position 2 is T and position 3 is S.
- id: bio-qh-0511
  lesson: bio-h-linkage
  type: text
  topic: Gene mapping
  stem: 'One map unit, a recombination frequency of 1%, is also called a ___.'
  accept: [centimorgan, centimorgans, cM, centi-morgan]
  explanation: |-
    The centimorgan (cM) is named after Thomas Hunt Morgan, whose fly lab discovered linkage; his student Alfred Sturtevant built the first map.
- id: bio-qh-0512
  lesson: bio-h-linkage
  type: order
  topic: Gene mapping
  stem: 'Put the steps of analyzing a three-point test cross in order.'
  items:
    - 'Identify the parental classes (the two most common) and the double-crossover classes (the two rarest)'
    - 'Find the middle gene by comparing the parental and double-crossover classes'
    - 'Calculate each interval''s distance, counting the double crossovers in both intervals'
    - 'Compare observed and expected double crossovers to find the interference'
  explanation: |-
    You need the parental and double-crossover classes to find the gene order; you need the order to know which single-crossover classes belong to which interval; and you need both interval distances to compute the expected number of double crossovers for the interference.
- id: bio-qh-0513
  lesson: bio-h-linkage
  topic: Linkage
  stem: 'Which results show that genes A and B are linked? Select all that apply.'
  choices: ['In an AaBb × aabb test cross, two classes far outnumber the other two', 'The recombination frequency between A and B is 8%', 'An AaBb × aabb test cross gives about 1 : 1 : 1 : 1', 'An AaBb × AaBb cross gives about 9 : 3 : 3 : 1']
  answer: [0, 1]
  explanation: |-
    Linkage shows up as an excess of parental classes, which means a recombination frequency well below 50% (8% here). A 1 : 1 : 1 : 1 test cross and a 9 : 3 : 3 : 1 F2 are what independent assortment predicts, so they give no evidence of linkage.
- id: bio-qh-0514
  lesson: bio-h-linkage
  type: match
  topic: Linkage
  stem: 'Match each term to its meaning.'
  pairs:
    - ['Parental type', 'Offspring with an allele combination found on one of the heterozygous parent''s chromosomes']
    - ['Recombinant', 'Offspring with a new allele combination made by crossing over']
    - ['Map unit', 'A recombination frequency of 1%']
    - ['Interference', 'One crossover making another nearby less likely']
  distractors: ['A physical length of 1,000 base pairs']
  explanation: |-
    Parental and recombinant types are defined by allele combinations relative to the heterozygote's chromosomes. A map unit is 1% recombination, a measure of crossover frequency rather than a physical length. Interference is the shortfall of double crossovers below the product-rule expectation.
# Round 2: honors lesson bio-h-gene-interaction
- id: bio-qh-0515
  lesson: bio-h-gene-interaction
  topic: Epistasis
  stem: 'Two true-breeding white-flowered lines are crossed. The F1 are all purple, and the F2 has about 9 purple : 7 white. What is the best explanation?'
  choices: ['Two genes are involved, and a plant needs a dominant allele at both to make purple pigment', 'One gene with incomplete dominance controls flower color', 'Purple is a new mutation that arose in the F1', 'One gene is involved, and white is dominant to purple']
  answer: 0
  explanation: |-
    A ratio in sixteenths points to two genes and a doubly heterozygous F1. Only C_P_ (9/16) is purple; the other 7/16 lack one of the two enzymes. Each white parent supplied the working allele the other lacked, which is why the F1 is purple (complementation). One gene can't give 9 : 7, and a mutation wouldn't appear in every F1 plant.
- id: bio-qh-0516
  lesson: bio-h-gene-interaction
  topic: Epistasis
  stem: 'In summer squash, W_ fruit are white; ww fruit are yellow if Y_ and green if yy. A WwYy plant is test-crossed with a wwyy plant. What phenotype ratio is expected?'
  choices: ['12 white : 3 yellow : 1 green', '2 white : 1 yellow : 1 green', '1 white : 1 yellow : 1 green', '1 white : 2 yellow : 1 green']
  answer: 1
  explanation: |-
    Ww × ww gives W_ (white) 1/2 and ww 1/2. Among the ww half, Yy × yy gives yellow 1/2 and green 1/2, so yellow 1/4 and green 1/4. Result: 1/2 white : 1/4 yellow : 1/4 green = 2 : 1 : 1. The 12 : 3 : 1 ratio belongs to WwYy × WwYy, not a test cross.
- id: bio-qh-0517
  lesson: bio-h-gene-interaction
  topic: Epistasis
  stem: 'An F2 of shepherd''s purse has 151 plants with triangular seed capsules and 9 with oval capsules. Which explanation fits these data?'
  choices: ['One gene, with triangular dominant (3 : 1)', 'Two complementary genes (9 : 7)', 'Two duplicate genes, where a dominant allele at either gene gives a triangular capsule (15 : 1)', 'Two genes with recessive epistasis (9 : 3 : 4)']
  answer: 2
  explanation: |-
    For 15 : 1 the expected counts out of 160 are 150 and 10, very close to 151 and 9 ($\chi^2 \approx 0.11$). A 3 : 1 ratio predicts 120 : 40, far off; 9 : 7 predicts 90 : 70; 9 : 3 : 4 would need three classes.
- id: bio-qh-0518
  lesson: bio-h-gene-interaction
  topic: Epistasis
  stem: 'Two yellow mice ($A^YA$) are mated repeatedly and have 90 surviving pups. $A^YA^Y$ embryos die before birth. About how many of the 90 pups are expected to be yellow?'
  choices: ['45', '67.5', '30', '60']
  answer: 3
  explanation: |-
    The cross gives 1/4 $A^YA^Y$ (dies) : 1/2 $A^YA$ (yellow) : 1/4 $AA$ (agouti). Among survivors, yellow is $\dfrac{1/2}{3/4} = \dfrac23$, and $\tfrac23 \times 90 = 60$. 67.5 uses the 3 : 1 ratio, forgetting the lethal class; 30 is the agouti count.
- id: bio-qh-0519
  lesson: bio-h-gene-interaction
  topic: Epistasis
  stem: 'Two true-breeding fruit fly lines both have the same recessive eye-color mutation phenotype. When they are crossed, all the F1 have that mutant eye color. What does this complementation test show?'
  choices: ['The two mutations are in the same gene', 'The two mutations are in different genes', 'The mutations are dominant', 'The mutations are linked but in different genes']
  answer: 0
  explanation: |-
    If the mutations were in different genes, each parent would supply a working copy of the gene the other lacks, and the F1 would be normal. A mutant F1 means neither parent has a working copy of that gene, so both mutations are in the same gene. The parents are true-breeding for a recessive phenotype, so the mutations aren't dominant.
- id: bio-qh-0520
  lesson: bio-h-gene-interaction
  topic: Quantitative genetics
  stem: 'Two true-breeding wheat lines differ in kernel color. In the F2, about 1 in 64 kernels is as pale as the pale parent. Assuming equal, additive genes, how many genes differ between the lines?'
  choices: ['6', '3', '4', '64']
  answer: 1
  explanation: |-
    Each F2 extreme needs homozygous recessive at every gene: $\left(\tfrac14\right)^n = \tfrac{1}{64}$, so $n = 3$. (6 is the number of alleles involved, $2n$; 64 is the denominator, not the number of genes.)
- id: bio-qh-0521
  lesson: bio-h-gene-interaction
  topic: Quantitative genetics
  stem: 'In one population, the heritability of adult height is estimated at 0.8. Which statement is correct?'
  choices: ['80% of each person''s height is caused by genes', 'Height in this population cannot be changed by diet', 'About 80% of the variation in height among people in this population is associated with genetic differences', 'Any height difference between this population and another must be genetic']
  answer: 2
  explanation: |-
    Heritability is a ratio of variances in a particular population: $V_G/V_P$. It says nothing about the share of one person's height due to genes, doesn't mean a trait is fixed (average heights rose with better nutrition), and can't explain differences between populations, which may be environmental.
- id: bio-qh-0522
  lesson: bio-h-gene-interaction
  topic: Quantitative genetics
  stem: 'A flock has a mean egg mass of 50 g. Hens averaging 58 g are chosen as parents. If the narrow-sense heritability is 0.25, what mean egg mass is predicted for their daughters?'
  choices: ['58 g', '54 g', '56 g', '52 g']
  answer: 3
  explanation: |-
    Selection differential $S = 58 - 50 = 8$ g. Response $R = h^2 S = 0.25 \times 8 = 2$ g, so the daughters' mean is about $50 + 2 = 52$ g. 58 g would require $h^2 = 1$; 54 g uses $h^2 = 0.5$.
- id: bio-qh-0523
  lesson: bio-h-gene-interaction
  topic: Quantitative genetics
  stem: 'Genetically uniform inbred lines of a plant have a variance in height of 3 cm². A genetically varied population grown in the same conditions has a variance of 12 cm². What is the broad-sense heritability of height in that population?'
  choices: ['0.75', '0.25', '0.33', '4']
  answer: 0
  explanation: |-
    In the uniform lines all variance is environmental, so $V_E = 3$. Then $V_G = 12 - 3 = 9$ and $H^2 = 9/12 = 0.75$. 0.25 is $V_E/V_P$; 0.33 is $V_E/V_G$; 4 is $V_P/V_E$, and heritability can't exceed 1.
- id: bio-qh-0524
  lesson: bio-h-gene-interaction
  type: label
  topic: Epistasis
  stem: 'Each numbered row shows the 16 F2 outcomes of AaBb × AaBb, with same-colored boxes having the same phenotype. The top row (9 : 3 : 3 : 1) is for comparison. Name the kind of gene interaction in each numbered row.'
  image: {src: images/m5-epistasis-ratios-blank.svg, alt: 'A reference row of 16 boxes in four colors grouped 9 A_B_, 3 A_bb, 3 aaB_ and 1 aabb, labeled 9:3:3:1 no interaction. Below are four numbered rows. Row 1: A_B_ and A_bb share one color, aaB_ a second and aabb a third. Row 2: A_B_ one color, A_bb a second, and aaB_ and aabb share a third. Row 3: all boxes share one color except aabb. Row 4: all A_B_ boxes share one color, and all the other boxes share a second.'}
  labels:
    - {x: 12, y: 36.6, text: 'Dominant epistasis (12 : 3 : 1)'}
    - {x: 12, y: 50.8, text: 'Recessive epistasis (9 : 3 : 4)'}
    - {x: 12, y: 65.1, text: 'Duplicate dominant genes (15 : 1)'}
    - {x: 12, y: 79.3, text: 'Complementary genes (9 : 7)'}
  explanation: |-
    Row 1 merges A_B_ with A_bb (12), so one dominant allele, A, hides the B gene: dominant epistasis. Row 2 merges aaB_ with aabb (4), so aa hides the B gene: recessive epistasis. Row 3 has 15 alike and only aabb different: one dominant allele at either gene is enough. Row 4 has only A_B_ (9) different from the other 7: both dominant alleles are needed, as with complementary genes.
- id: bio-qh-0525
  lesson: bio-h-gene-interaction
  type: match
  topic: Epistasis
  stem: 'Match each F2 ratio to the example that produces it.'
  pairs:
    - ['9 : 3 : 4', 'Mouse coat color: agouti, black and albino']
    - ['9 : 7', 'Sweet pea flowers from two different white lines']
    - ['12 : 3 : 1', 'Summer squash fruit: white, yellow and green']
    - ['15 : 1', 'Shepherd''s purse seed capsules: triangular and oval']
  distractors: ['Snapdragon flowers: red, pink and white']
  explanation: |-
    cc albino mice hide the agouti gene (9 : 3 : 4). Sweet pea purple needs C_P_ (9 : 7). Dominant W makes squash white (12 : 3 : 1). Either dominant allele makes a triangular capsule (15 : 1). Snapdragon color is one gene with incomplete dominance, 1 : 2 : 1.
- id: bio-qh-0526
  lesson: bio-h-gene-interaction
  type: text
  topic: Quantitative genetics
  stem: 'The range of phenotypes that a single genotype produces across different environments is called its ___.'
  accept: [norm of reaction, reaction norm, norms of reaction, reaction norms]
  explanation: |-
    A norm of reaction can be drawn as a line of phenotype against environment for each genotype, as for the cloned yarrow plants grown at different elevations. Lines that cross show a genotype-by-environment interaction.
- id: bio-qh-0527
  lesson: bio-h-gene-interaction
  topic: Quantitative genetics
  stem: 'Which statements about heritability are correct? Select all that apply.'
  choices: ['It describes a particular population in a particular environment', 'A trait with high heritability can still change when the environment changes', 'A heritability of 0.8 for height means 80% of each person''s height comes from genes', 'Making the environment more uniform tends to raise heritability']
  answer: [0, 1, 3]
  explanation: |-
    $H^2 = V_G/V_P$ is measured in one population and environment. A more uniform environment shrinks $V_E$, so the ratio rises. High heritability doesn't stop environmental change from shifting the trait (heights rose with nutrition). Heritability is about variation among people, not the makeup of one person's trait.
- id: bio-qh-0528
  lesson: bio-h-gene-interaction
  type: order
  topic: Epistasis
  stem: 'In the sweet pea pigment pathway, put the substances in the order they are made.'
  items:
    - 'Colorless precursor'
    - 'Colorless intermediate, made by the enzyme from gene C'
    - 'Purple pigment, made by the enzyme from gene P'
  explanation: |-
    The enzyme encoded by C converts the precursor to the intermediate, and the enzyme encoded by P converts the intermediate to purple pigment. A cc plant stops at the precursor and a pp plant at the intermediate; both are white, which is why only C_P_ plants are purple.
