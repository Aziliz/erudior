- id: bio-q-0601
  lesson: bio-dna
  module_quiz: true
  topic: DNA structure
  stem: In the Avery, MacLeod and McCarty experiment, extract from heat-killed S bacteria was treated with different enzymes before being mixed with live R bacteria. Which result identified DNA as the transforming principle?
  choices:
  - Transformation stopped after protease treatment but still happened after DNase treatment.
  - Transformation happened with every enzyme treatment.
  - Transformation still happened after protease or RNase treatment, but not after DNase treatment.
  - Transformation stopped after every enzyme treatment.
  answer: 2
  explanation: Destroying a molecule that is needed should stop transformation. Only DNase (which destroys DNA) stopped it, so DNA is required; protein and RNA are not. If transformation stopped with every enzyme, or with none, no single molecule could be singled out.
- id: bio-q-0602
  lesson: bio-dna
  topic: DNA structure
  stem: Hershey and Chase labeled one batch of bacteriophages with radioactive sulfur and another with radioactive phosphorus. Why these two elements?
  choices:
  - Sulfur is found in DNA but not protein, and phosphorus is found in protein but not DNA.
  - Sulfur is found in protein but not DNA, and phosphorus is found in DNA but hardly at all in protein.
  - Both elements are found only in DNA, so they label it twice.
  - Both elements are found only in the bacterial cell, not in the virus.
  answer: 1
  explanation: The point was to label the two candidate molecules separately. Proteins contain sulfur (in some amino acids) and almost no phosphorus; DNA has phosphorus in every nucleotide's phosphate group and no sulfur. Swapping them reverses the chemistry.
- id: bio-q-0603
  lesson: bio-dna
  topic: DNA structure
  stem: In the Hershey–Chase experiment, after infection and blending, where was most of the radioactive phosphorus found, and what did that show?
  choices:
  - In the empty phage coats, showing that protein carries the genetic instructions
  - Inside the bacteria, showing that phage protein enters the cell
  - Inside the bacteria, showing that phage DNA enters the cell and carries the genetic instructions
  - Spread evenly between the coats and the bacteria, showing that both molecules are genetic material
  answer: 2
  explanation: Phosphorus labels DNA. It went into the bacteria, while the sulfur-labeled protein stayed outside with the coats. The material that enters and directs new phages is DNA.
- id: bio-q-0604
  lesson: bio-dna
  module_quiz: true
  topic: DNA structure
  stem: A sample of double-stranded DNA is 18% cytosine. What percentage is adenine?
  choices:
  - 18%
  - 32%
  - 64%
  - 82%
  answer: 1
  explanation: C pairs with G, so G = 18% and G + C = 36%. That leaves 100 − 36 = 64% for A + T, and A = T, so A = 32%. 18% wrongly assumes A equals C; 64% forgets to split A + T in half; 82% is just 100 − 18.
- id: bio-q-0605
  lesson: bio-dna
  topic: DNA structure
  stem: One strand of a DNA molecule is 5′-GGATCA-3′. What is the complementary strand, written with its ends labeled?
  choices:
  - 3′-CCTAGT-5′
  - 5′-CCTAGT-3′
  - 3′-GGATCA-5′
  - 3′-CCUAGU-5′
  answer: 0
  explanation: 'Pair each base (G–C, A–T): C C T A G T. The strands are antiparallel, so the partner written under the original runs 3′ to 5′. Labeling it 5′ to 3′ ignores antiparallel orientation; repeating the original bases is not complementary; U appears only in RNA.'
- id: bio-q-0606
  lesson: bio-dna
  topic: DNA structure
  stem: Why is the DNA double helix the same width (about 2 nm) along its whole length?
  choices:
  - Every base pair joins a two-ring purine with a one-ring pyrimidine.
  - Every base pair joins two purines.
  - Hydrogen bonds pull the backbones to a fixed distance regardless of the bases.
  - The sugar–phosphate backbone is on the inside of the helix.
  answer: 0
  explanation: A–T and G–C each pair a double-ring base (A or G) with a single-ring base (T or C), so every rung is the same length. Two purines would make a wider rung. The backbones are on the outside, and hydrogen bonds alone don't fix the width.
- id: bio-q-0607
  lesson: bio-dna
  module_quiz: true
  topic: DNA replication
  stem: Meselson and Stahl grew bacteria on heavy nitrogen (15N), then moved them to light nitrogen (14N). After one generation all the DNA formed a single band of intermediate density. Which model did this result rule out?
  choices:
  - Semiconservative replication
  - Dispersive replication
  - Conservative replication
  - No model; the result fits all three
  answer: 2
  explanation: 'Conservative replication would keep the original heavy helix intact and make a separate all-light helix: two bands, heavy and light. A single hybrid band rules it out. Both semiconservative and dispersive replication predict one intermediate band after one generation; the second generation (half hybrid, half light) ruled out dispersive.'
- id: bio-q-0608
  lesson: bio-dna
  topic: DNA replication
  stem: In the Meselson–Stahl experiment, what fraction of the DNA is hybrid (one heavy, one light strand) after 3 generations in light nitrogen?
  choices:
  - 1/2
  - 1/8
  - 3/4
  - 1/4
  answer: 3
  explanation: 'After $n$ generations there are $2^n$ helices from each original one, and the two original heavy strands sit in exactly two of them. With $n = 3$: $2/8 = 1/4$ hybrid, $3/4$ light. 1/2 is the answer after 2 generations; 3/4 is the light fraction.'
- id: bio-q-0609
  lesson: bio-dna
  topic: DNA replication
  stem: Why is the lagging strand made in short Okazaki fragments?
  choices:
  - The lagging strand is copied by RNA polymerase, which makes only short pieces.
  - Helicase can unwind only short stretches of the lagging strand.
  - The lagging strand is built 3′ to 5′, which is slower.
  - DNA polymerase can add nucleotides only to a 3′ end, so the strand that runs the other way must be built in pieces away from the fork.
  answer: 3
  explanation: All new DNA grows 5′ to 3′. The two template strands are antiparallel, so on one of them the new strand must grow away from the fork; it is made in fragments as the fork opens and later joined by ligase. No strand is built 3′ to 5′, and DNA polymerase, not RNA polymerase, does the copying.
- id: bio-q-0610
  lesson: bio-dna
  module_quiz: true
  topic: DNA replication
  stem: 'Match the enzyme to its job in replication: which enzyme joins Okazaki fragments into one continuous strand?'
  choices:
  - Helicase
  - Primase
  - DNA polymerase
  - DNA ligase
  answer: 3
  explanation: Ligase seals the gaps in the backbone between fragments. Helicase unwinds the helix, primase makes the RNA primers, and DNA polymerase adds the nucleotides.
- id: bio-q-0611
  lesson: bio-dna
  topic: DNA structure
  stem: A student says Chargaff's rules mean that a single DNA strand must have equal amounts of A and T. Why is this wrong?
  choices:
  - The rules apply only to RNA.
  - 'The rules describe double-stranded DNA: each A on one strand is matched by a T on the other strand, not on the same strand.'
  - The rules say A equals G, not A equals T.
  - The rules apply only to human DNA.
  answer: 1
  explanation: A = T holds for the double helix because of base pairing between strands. One strand can be rich in A as long as its partner is equally rich in T. Chargaff found the rules in many species; they don't apply to RNA, which is usually single-stranded.
- id: bio-q-0612
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Transcription
  stem: A DNA template strand reads 3′-TACGGT-5′. What mRNA is transcribed from it?
  choices:
  - 5′-AUGCCA-3′
  - 5′-ATGCCA-3′
  - 5′-UACGGU-3′
  - 5′-ACCGUA-3′
  answer: 0
  explanation: 'Pair each template base with an RNA base: T→A, A→U, C→G, G→C, G→C, T→A, giving AUGCCA. ATGCCA is the DNA complement (RNA uses U, not T). UACGGU copies the template with U for T. ACCGUA reverses the correct sequence.'
- id: bio-q-0613
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: Where does RNA polymerase first bind to begin transcribing a gene?
  choices:
  - The promoter
  - The start codon
  - The operator
  - The ribosome
  answer: 0
  explanation: RNA polymerase binds the promoter, a DNA sequence just upstream of the gene. The start codon (AUG) is where translation starts, on the mRNA. The operator is a repressor-binding site in bacterial operons.
- id: bio-q-0614
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: A eukaryotic pre-mRNA has four exons and three introns. What happens to it before it leaves the nucleus?
  choices:
  - The introns are removed, the exons are joined, and a cap and a tail are added.
  - The exons are removed and the introns are joined.
  - Nothing; mRNA is translated inside the nucleus.
  - The introns are translated into a separate protein.
  answer: 0
  explanation: Introns are cut out and exons are spliced together (exons are the parts that are expressed). The 5′ cap and 3′ tail protect the mRNA. Translation happens in the cytoplasm.
- id: bio-q-0615
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Genetic code
  stem: Translate the mRNA 5′-CCAUGGCUUGGUAGCA-3′ using the codon table, starting at the first AUG.
  choices:
  - Pro–Trp–Leu–Gly–Ser
  - Met–Ala–Trp–Stop–Gln
  - Tyr–Arg–Thr
  - Met–Ala–Trp
  answer: 3
  explanation: 'The first AUG follows CC. Read from there: AUG (Met), GCU (Ala), UGG (Trp), UAG (Stop). The stop codon ends translation and adds nothing, so the chain is Met–Ala–Trp. Reading from the first base gives a different frame; Tyr–Arg–Thr comes from looking up the complementary triplets instead of the codons.'
- id: bio-q-0616
  lesson: bio-protein-synthesis
  topic: Genetic code
  stem: Why must codons be at least three bases long?
  choices:
  - Two-base codons give only 16 combinations, too few for 20 amino acids; three bases give 64.
  - Ribosomes are exactly three bases wide.
  - There are three kinds of RNA.
  - Each amino acid contains three nitrogen atoms.
  answer: 0
  explanation: With four bases, $4^2 = 16$ two-letter words can't name 20 amino acids, but $4^3 = 64$ three-letter words can, with extras (which is why the code is redundant).
- id: bio-q-0617
  lesson: bio-protein-synthesis
  topic: Translation
  stem: A tRNA has the anticodon 3′-UAC-5′. Which codon does it pair with, and which amino acid does it carry?
  choices:
  - AUG, methionine
  - UAC, tyrosine
  - AUG, tyrosine
  - CAU, histidine
  answer: 0
  explanation: 'The anticodon pairs with the codon: U–A, A–U, C–G gives 5′-AUG-3′, which codes for Met. Looking up UAC in the table is the classic error (the table lists codons, not anticodons). CAU is the anticodon read 5′ to 3′ and then looked up as if it were a codon.'
- id: bio-q-0618
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Genetic code
  stem: The mRNA coding region of a gene, from the start codon through the stop codon, is 900 nucleotides long. How many amino acids are in the polypeptide?
  choices:
  - '300'
  - '299'
  - '900'
  - '301'
  answer: 1
  explanation: 900 ÷ 3 = 300 codons, one of which is the stop codon, which codes for no amino acid. So 299 amino acids. 300 counts the stop codon; 900 treats each nucleotide as an amino acid.
- id: bio-q-0619
  lesson: bio-protein-synthesis
  topic: Translation
  stem: What ends translation when a ribosome reaches a stop codon?
  choices:
  - A tRNA carrying a stop amino acid pairs with the codon.
  - RNA polymerase falls off the mRNA.
  - The ribosome runs out of ATP.
  - A release factor protein binds the stop codon and frees the polypeptide.
  answer: 3
  explanation: No tRNA matches UAA, UAG or UGA. A release factor binds instead, the chain is released, and the ribosome comes apart. RNA polymerase works in transcription, not translation.
- id: bio-q-0620
  lesson: bio-protein-synthesis
  topic: Genetic code
  stem: A human insulin gene placed in bacteria makes working human insulin. Which feature of the genetic code makes this possible?
  choices:
  - It is redundant.
  - It is nearly universal.
  - It has three stop codons.
  - It is read in overlapping triplets.
  answer: 1
  explanation: Bacteria read codons the same way human cells do, so a human gene's codons specify the same amino acids. Redundancy (several codons per amino acid) is true but doesn't explain it. The code is not read in overlapping triplets.
- id: bio-q-0621
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: Which statement correctly compares RNA with DNA?
  choices:
  - RNA contains deoxyribose and thymine and is usually double-stranded.
  - RNA contains ribose and thymine and is usually double-stranded.
  - RNA contains ribose and uracil and is usually single-stranded.
  - RNA contains deoxyribose and uracil and is usually single-stranded.
  answer: 2
  explanation: RNA's sugar is ribose (DNA's is deoxyribose), uracil replaces thymine, and most RNA molecules are a single strand.
- id: bio-q-0622
  lesson: bio-protein-synthesis
  topic: Translation
  stem: Which molecule actually catalyzes the peptide bonds between amino acids in a ribosome?
  choices:
  - mRNA
  - tRNA
  - rRNA
  - DNA polymerase
  answer: 2
  explanation: The core of the ribosome is ribosomal RNA, and the rRNA itself forms peptide bonds. mRNA carries the code and tRNA delivers amino acids; DNA polymerase copies DNA.
- id: bio-q-0623
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Gene regulation
  stem: In the lac operon of E. coli, what happens when lactose is present?
  choices:
  - Lactose binds the operator and blocks RNA polymerase.
  - Lactose binds the promoter and attracts the repressor.
  - The repressor binds lactose and stays on the operator more tightly.
  - Lactose binds the repressor, which changes shape and releases the operator, so the genes are transcribed.
  answer: 3
  explanation: The repressor normally sits on the operator and blocks transcription. A form of lactose binds the repressor, changing its shape so it lets go of the DNA. Lactose never binds the DNA itself.
- id: bio-q-0624
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: A mutant E. coli strain makes a repressor that cannot bind to the operator. How are its lac genes expressed?
  choices:
  - Off, whether or not lactose is present
  - On, whether or not lactose is present
  - On only when lactose is present, as normal
  - On only when lactose is absent
  answer: 1
  explanation: With no working repressor on the operator, nothing blocks RNA polymerase, so transcription runs all the time. A repressor that cannot release (for example, one that can't bind lactose) would instead keep the genes off.
- id: bio-q-0625
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: A nerve cell and a skin cell from the same person make very different proteins. What is the best explanation?
  choices:
  - They contain different genes.
  - Nerve cells have lost the genes for skin proteins.
  - They express different genes from the same DNA, controlled by different transcription factors.
  - Skin cells have extra chromosomes.
  answer: 2
  explanation: Nearly all body cells carry the same genome. Cell types differ in which genes are switched on, set largely by combinations of transcription factors and by how tightly DNA is packed.
- id: bio-q-0626
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: Which describes an epigenetic change?
  choices:
  - A base substitution changes a codon.
  - A chromosome segment is deleted.
  - A plasmid carrying a new gene enters a bacterium.
  - Methyl groups added to DNA silence a gene, and the pattern is copied when the cell divides.
  answer: 3
  explanation: Epigenetic changes alter gene activity without changing the DNA sequence, through tags such as DNA methylation or histone modification that can be passed to daughter cells. The other choices all change the DNA sequence or add new DNA.
- id: bio-q-0627
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Mutations
  stem: A codon in an mRNA changes from GAA to GAG. What type of mutation is this?
  choices:
  - Missense
  - Silent
  - Nonsense
  - Frameshift
  answer: 1
  explanation: 'GAA and GAG both code for glutamic acid (Glu), so the protein is unchanged: silent. A missense mutation would change the amino acid, a nonsense mutation would create a stop codon, and a frameshift needs an insertion or deletion.'
- id: bio-q-0628
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Mutations
  stem: The mRNA 5′-AUG GCA UGG AAA UAA-3′ codes for Met–Ala–Trp–Lys. A mutation changes UGG to UGA. What is the result?
  choices:
  - 'A nonsense mutation: the protein is Met–Ala only.'
  - 'A missense mutation: Trp is replaced by Arg.'
  - 'A silent mutation: the protein is unchanged.'
  - 'A frameshift: every amino acid after Ala changes.'
  answer: 0
  explanation: 'UGA is a stop codon, so translation ends after Ala and the protein is cut short: a nonsense mutation. One base was substituted, not inserted or deleted, so the frame is unchanged.'
- id: bio-q-0629
  lesson: bio-gene-regulation
  topic: Mutations
  stem: One base is deleted near the start of a gene's coding region. Why is this usually more harmful than a single-base substitution?
  choices:
  - It always creates a stop codon at the site of the deletion.
  - It removes exactly one amino acid.
  - It changes the DNA in every cell of the body.
  - It shifts the reading frame, changing every codon after it and often creating an early stop codon.
  answer: 3
  explanation: Codons are read in fixed groups of three from AUG, so losing one base regroups every later base. A substitution affects at most one codon. Removing exactly one amino acid requires deleting three bases.
- id: bio-q-0630
  lesson: bio-gene-regulation
  topic: Mutations
  stem: The most common cystic fibrosis mutation deletes three bases from the gene. What effect does this have on the reading frame?
  choices:
  - It shifts the frame, changing every amino acid after the deletion.
  - It changes one amino acid to a stop codon.
  - None; one amino acid is missing but the rest of the sequence is read in the normal frame.
  - It doubles the length of the protein.
  answer: 2
  explanation: Three bases are one codon, so the frame is kept. The protein lacks one phenylalanine but is otherwise normal in sequence (though it misfolds). Only insertions or deletions that are not multiples of three cause frameshifts.
- id: bio-q-0631
  lesson: bio-gene-regulation
  topic: Mutations
  stem: A mutation occurs in a skin cell on a man's arm after years of sun exposure. Can it be passed to his children?
  choices:
  - Yes, because all mutations are inherited.
  - No, because it is a somatic mutation, not in a cell that makes sperm.
  - Yes, but only to his sons.
  - No, because ultraviolet light cannot cause mutations.
  answer: 1
  explanation: Only germline mutations (in cells that make eggs or sperm) reach the next generation. A somatic mutation is passed only to that cell's descendants in the body, though it may contribute to skin cancer. UV light is a well-known mutagen.
- id: bio-q-0632
  lesson: bio-gene-regulation
  topic: Mutations
  stem: Sickle cell disease results from codon 6 of a hemoglobin gene changing from GAG to GUG. Using the codon table, what kind of mutation is this?
  choices:
  - 'Silent: both codons code for Glu'
  - 'Missense: Glu is replaced by Val'
  - 'Nonsense: GUG is a stop codon'
  - 'Frameshift: a base was inserted'
  answer: 1
  explanation: 'GAG codes for Glu and GUG for Val, so one amino acid changes: missense. GUG is not a stop codon, and the change is a substitution (one base swapped), not an insertion.'
- id: bio-q-0633
  lesson: bio-biotech
  module_quiz: true
  topic: PCR
  stem: A PCR reaction starts with 10 copies of a target sequence. Assuming perfect doubling, how many copies are present after 10 cycles?
  choices:
  - 10,240
  - '200'
  - 1,024
  - '100'
  answer: 0
  explanation: $N = N_0 \times 2^n = 10 \times 2^{10} = 10 \times 1024 = 10{,}240$. 200 uses $N_0 \times 2n$ (adding instead of doubling); 1,024 forgets the starting 10 copies; 100 is $10 \times 10$.
- id: bio-q-0634
  lesson: bio-biotech
  topic: PCR
  stem: Why does PCR use a DNA polymerase from bacteria that live in hot springs?
  choices:
  - Hot-spring polymerase copies RNA instead of DNA.
  - It works only at room temperature, which keeps the primers attached.
  - Each cycle heats the mixture to about 95 °C to separate the strands, which would destroy most enzymes.
  - It needs no primers.
  answer: 2
  explanation: The denaturing step near 95 °C would ruin an ordinary enzyme every cycle. Taq polymerase survives it, so it can be added once. It still needs primers and copies DNA.
- id: bio-q-0635
  lesson: bio-biotech
  topic: PCR
  stem: Put the three temperature steps of one PCR cycle in order.
  choices:
  - Anneal primers, denature, extend
  - Extend, denature, anneal primers
  - Denature, extend, anneal primers
  - Denature (about 95 °C), anneal primers (about 50–65 °C), extend (about 72 °C)
  answer: 3
  explanation: The strands must first separate (denature) so the primers can bind (anneal) to single strands; only then can the polymerase extend from the primers.
- id: bio-q-0636
  lesson: bio-biotech
  module_quiz: true
  topic: Gel electrophoresis
  stem: DNA fragments of 300, 1,200 and 5,000 base pairs are run on the same gel. Which travels farthest from the well, and toward which electrode?
  choices:
  - The 5,000 bp fragment, toward the positive electrode
  - The 300 bp fragment, toward the negative electrode
  - The 300 bp fragment, toward the positive electrode
  - The 5,000 bp fragment, toward the negative electrode
  answer: 2
  explanation: DNA's phosphate backbone is negatively charged, so it moves toward the positive electrode. Smaller fragments slip through the gel more easily and travel farthest.
- id: bio-q-0637
  lesson: bio-biotech
  topic: Gel electrophoresis
  stem: On a gel, ladder bands of 2,000 bp and 1,000 bp are 44 mm and 50 mm from the wells. An unknown band is at 47 mm. Which estimate is best?
  choices:
  - Exactly 1,500 bp
  - About 2,500 bp
  - About 1,400 bp
  - About 700 bp
  answer: 2
  explanation: The band lies between the 1,000 and 2,000 bp bands, so its size is between them. Distance is linear in the logarithm of size, so halfway in distance is the geometric middle, $\sqrt{1000 \times 2000} \approx 1{,}414$ bp, not the arithmetic middle of 1,500. 2,500 and 700 lie outside the bracketing bands.
- id: bio-q-0638
  lesson: bio-biotech
  topic: Biotechnology
  stem: A linear DNA molecule 8,000 bp long has restriction sites at positions 2,000 and 5,000. What fragment sizes are produced?
  choices:
  - 2,000, 3,000 and 3,000 bp
  - 2,000 and 5,000 bp
  - 2,000, 5,000 and 8,000 bp
  - 3,000 and 5,000 bp
  answer: 0
  explanation: 'Two cuts in a linear molecule make three pieces: 0 to 2,000 (2,000 bp), 2,000 to 5,000 (3,000 bp), and 5,000 to 8,000 (3,000 bp). They add up to 8,000. Listing the cut positions as sizes is the usual error; two pieces would come from a circle.'
- id: bio-q-0639
  lesson: bio-biotech
  module_quiz: true
  topic: Biotechnology
  stem: To make human insulin in bacteria, why are the plasmid and the insulin gene cut with the same restriction enzyme?
  choices:
  - So the bacteria will be killed by the antibiotic
  - So the insulin gene is copied by PCR
  - So the plasmid becomes linear and stays that way
  - So their sticky ends are complementary and can pair before ligase seals them
  answer: 3
  explanation: The same enzyme leaves matching single-stranded tails on both pieces. They base-pair, and DNA ligase joins the backbones to make recombinant DNA. The antibiotic step selects bacteria that took up a plasmid; it is meant to kill those that didn't.
- id: bio-q-0640
  lesson: bio-biotech
  topic: Biotechnology
  stem: Bacteria are mixed with recombinant plasmids carrying an antibiotic-resistance gene and then grown on a plate containing that antibiotic. What grows?
  choices:
  - Only bacteria that did not take up a plasmid
  - Only bacteria that took up a plasmid
  - All the bacteria
  - No bacteria
  answer: 1
  explanation: The resistance gene travels on the plasmid, so only bacteria carrying a plasmid survive the antibiotic. This step selects the transformed cells from the many that took up nothing.
- id: bio-q-0641
  lesson: bio-biotech
  topic: Biotechnology
  stem: At one STR region, crime-scene DNA has alleles with 8 and 11 repeats. Suspect 1 has 8 and 11; suspect 2 has 8 and 10. What can be concluded from this region alone?
  choices:
  - Suspect 1 is definitely the source.
  - Suspect 2 is excluded; suspect 1 is not excluded but is not identified by one region.
  - Both suspects are excluded.
  - Neither suspect can be excluded.
  answer: 1
  explanation: Suspect 2 has a 10-repeat allele that is not in the evidence, so suspect 2 cannot be the source. Suspect 1 matches, but many people share any one pair of alleles; labs compare about 20 regions before calling a match.
- id: bio-q-0642
  lesson: bio-biotech
  topic: Biotechnology
  stem: How does CRISPR-Cas9 find the gene it cuts?
  choices:
  - A guide RNA designed to match the target sequence base-pairs with it.
  - Cas9 recognizes a fixed six-base palindrome, like a restriction enzyme.
  - It cuts at random and the right cuts are selected later.
  - It binds the gene's promoter by recognizing RNA polymerase.
  answer: 0
  explanation: 'The guide RNA is the targeting part: change its sequence and Cas9 cuts a different gene. A restriction enzyme, by contrast, always cuts the same fixed site.'
