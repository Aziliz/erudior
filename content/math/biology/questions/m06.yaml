- id: bio-q-0601
  lesson: bio-dna
  module_quiz: true
  topic: DNA structure
  stem: In the Avery, MacLeod and McCarty experiment, extract from heat-killed S bacteria was treated with different enzymes before being mixed with live R bacteria. Which result identified DNA as the transforming principle?
  choices:
  - Transformation stopped after protease treatment but still happened after DNase treatment.
  - Transformation happened with every enzyme treatment.
  - Transformation still happened after protease or RNase treatment, but not after DNase treatment.
  - Transformation stopped after every enzyme treatment.
  answer: 2
  explanation: Destroying a molecule that is needed should stop transformation. Only DNase (which destroys DNA) stopped it, so DNA is required; protein and RNA are not. If transformation stopped with every enzyme, or with none, no single molecule could be singled out.
- id: bio-q-0602
  lesson: bio-dna
  topic: DNA structure
  stem: Hershey and Chase labeled one batch of bacteriophages with radioactive sulfur and another with radioactive phosphorus. Why these two elements?
  choices:
  - Sulfur is found in DNA but not protein, and phosphorus is found in protein but not DNA.
  - Sulfur is found in protein but not DNA, and phosphorus is found in DNA but hardly at all in protein.
  - Both elements are found only in DNA, so they label it twice.
  - Both elements are found only in the bacterial cell, not in the virus.
  answer: 1
  explanation: The point was to label the two candidate molecules separately. Proteins contain sulfur (in some amino acids) and almost no phosphorus; DNA has phosphorus in every nucleotide's phosphate group and no sulfur. Swapping them reverses the chemistry.
- id: bio-q-0603
  lesson: bio-dna
  topic: DNA structure
  stem: In the Hershey–Chase experiment, after infection and blending, where was most of the radioactive phosphorus found, and what did that show?
  choices:
  - In the empty phage coats, showing that protein carries the genetic instructions
  - Inside the bacteria, showing that phage protein enters the cell
  - Inside the bacteria, showing that phage DNA enters the cell and carries the genetic instructions
  - Spread evenly between the coats and the bacteria, showing that both molecules are genetic material
  answer: 2
  explanation: Phosphorus labels DNA. It went into the bacteria, while the sulfur-labeled protein stayed outside with the coats. The material that enters and directs new phages is DNA.
- id: bio-q-0604
  lesson: bio-dna
  module_quiz: true
  topic: DNA structure
  stem: A sample of double-stranded DNA is 18% cytosine. What percentage is adenine?
  choices:
  - 18%
  - 32%
  - 64%
  - 82%
  answer: 1
  explanation: C pairs with G, so G = 18% and G + C = 36%. That leaves 100 − 36 = 64% for A + T, and A = T, so A = 32%. 18% wrongly assumes A equals C; 64% forgets to split A + T in half; 82% is just 100 − 18.
- id: bio-q-0605
  lesson: bio-dna
  topic: DNA structure
  stem: One strand of a DNA molecule is 5′-GGATCA-3′. What is the complementary strand, written with its ends labeled?
  choices:
  - 3′-CCTAGT-5′
  - 5′-CCTAGT-3′
  - 3′-GGATCA-5′
  - 3′-CCUAGU-5′
  answer: 0
  explanation: 'Pair each base (G–C, A–T): C C T A G T. The strands are antiparallel, so the partner written under the original runs 3′ to 5′. Labeling it 5′ to 3′ ignores antiparallel orientation; repeating the original bases is not complementary; U appears only in RNA.'
- id: bio-q-0606
  lesson: bio-dna
  topic: DNA structure
  stem: Why is the DNA double helix the same width (about 2 nm) along its whole length?
  choices:
  - Every base pair joins a two-ring purine with a one-ring pyrimidine.
  - Every base pair joins two purines.
  - Hydrogen bonds pull the backbones to a fixed distance regardless of the bases.
  - The sugar–phosphate backbone is on the inside of the helix.
  answer: 0
  explanation: A–T and G–C each pair a double-ring base (A or G) with a single-ring base (T or C), so every rung is the same length. Two purines would make a wider rung. The backbones are on the outside, and hydrogen bonds alone don't fix the width.
- id: bio-q-0607
  lesson: bio-dna
  module_quiz: true
  topic: DNA replication
  stem: Meselson and Stahl grew bacteria on heavy nitrogen (15N), then moved them to light nitrogen (14N). After one generation all the DNA formed a single band of intermediate density. Which model did this result rule out?
  choices:
  - Semiconservative replication
  - Dispersive replication
  - Conservative replication
  - No model; the result fits all three
  answer: 2
  explanation: 'Conservative replication would keep the original heavy helix intact and make a separate all-light helix: two bands, heavy and light. A single hybrid band rules it out. Both semiconservative and dispersive replication predict one intermediate band after one generation; the second generation (half hybrid, half light) ruled out dispersive.'
- id: bio-q-0608
  lesson: bio-dna
  topic: DNA replication
  stem: In the Meselson–Stahl experiment, what fraction of the DNA is hybrid (one heavy, one light strand) after 3 generations in light nitrogen?
  choices:
  - 1/2
  - 1/8
  - 3/4
  - 1/4
  answer: 3
  explanation: 'After $n$ generations there are $2^n$ helices from each original one, and the two original heavy strands sit in exactly two of them. With $n = 3$: $2/8 = 1/4$ hybrid, $3/4$ light. 1/2 is the answer after 2 generations; 3/4 is the light fraction.'
- id: bio-q-0609
  lesson: bio-dna
  topic: DNA replication
  stem: Why is the lagging strand made in short Okazaki fragments?
  choices:
  - The lagging strand is copied by RNA polymerase, which makes only short pieces.
  - Helicase can unwind only short stretches of the lagging strand.
  - The lagging strand is built 3′ to 5′, which is slower.
  - DNA polymerase can add nucleotides only to a 3′ end, so the strand that runs the other way must be built in pieces away from the fork.
  answer: 3
  explanation: All new DNA grows 5′ to 3′. The two template strands are antiparallel, so on one of them the new strand must grow away from the fork; it is made in fragments as the fork opens and later joined by ligase. No strand is built 3′ to 5′, and DNA polymerase, not RNA polymerase, does the copying.
- id: bio-q-0610
  lesson: bio-dna
  module_quiz: true
  topic: DNA replication
  stem: 'Match the enzyme to its job in replication: which enzyme joins Okazaki fragments into one continuous strand?'
  choices:
  - Helicase
  - Primase
  - DNA polymerase
  - DNA ligase
  answer: 3
  explanation: Ligase seals the gaps in the backbone between fragments. Helicase unwinds the helix, primase makes the RNA primers, and DNA polymerase adds the nucleotides.
- id: bio-q-0611
  lesson: bio-dna
  topic: DNA structure
  stem: A student says Chargaff's rules mean that a single DNA strand must have equal amounts of A and T. Why is this wrong?
  choices:
  - The rules apply only to RNA.
  - 'The rules describe double-stranded DNA: each A on one strand is matched by a T on the other strand, not on the same strand.'
  - The rules say A equals G, not A equals T.
  - The rules apply only to human DNA.
  answer: 1
  explanation: A = T holds for the double helix because of base pairing between strands. One strand can be rich in A as long as its partner is equally rich in T. Chargaff found the rules in many species; they don't apply to RNA, which is usually single-stranded.
- id: bio-q-0612
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Transcription
  stem: A DNA template strand reads 3′-TACGGT-5′. What mRNA is transcribed from it?
  choices:
  - 5′-AUGCCA-3′
  - 5′-ATGCCA-3′
  - 5′-UACGGU-3′
  - 5′-ACCGUA-3′
  answer: 0
  explanation: 'Pair each template base with an RNA base: T→A, A→U, C→G, G→C, G→C, T→A, giving AUGCCA. ATGCCA is the DNA complement (RNA uses U, not T). UACGGU copies the template with U for T. ACCGUA reverses the correct sequence.'
- id: bio-q-0613
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: Where does RNA polymerase first bind to begin transcribing a gene?
  choices:
  - The promoter
  - The start codon
  - The operator
  - The ribosome
  answer: 0
  explanation: RNA polymerase binds the promoter, a DNA sequence just upstream of the gene. The start codon (AUG) is where translation starts, on the mRNA. The operator is a repressor-binding site in bacterial operons.
- id: bio-q-0614
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: A eukaryotic pre-mRNA has four exons and three introns. What happens to it before it leaves the nucleus?
  choices:
  - The introns are removed, the exons are joined, and a cap and a tail are added.
  - The exons are removed and the introns are joined.
  - Nothing; mRNA is translated inside the nucleus.
  - The introns are translated into a separate protein.
  answer: 0
  explanation: Introns are cut out and exons are spliced together (exons are the parts that are expressed). The 5′ cap and 3′ tail protect the mRNA. Translation happens in the cytoplasm.
- id: bio-q-0615
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Genetic code
  stem: Translate the mRNA 5′-CCAUGGCUUGGUAGCA-3′ using the codon table, starting at the first AUG.
  choices:
  - Pro–Trp–Leu–Gly–Ser
  - Met–Ala–Trp–Stop–Gln
  - Tyr–Arg–Thr
  - Met–Ala–Trp
  answer: 3
  explanation: 'The first AUG follows CC. Read from there: AUG (Met), GCU (Ala), UGG (Trp), UAG (Stop). The stop codon ends translation and adds nothing, so the chain is Met–Ala–Trp. Reading from the first base gives a different frame; Tyr–Arg–Thr comes from looking up the complementary triplets instead of the codons.'
- id: bio-q-0616
  lesson: bio-protein-synthesis
  topic: Genetic code
  stem: Why must codons be at least three bases long?
  choices:
  - Two-base codons give only 16 combinations, too few for 20 amino acids; three bases give 64.
  - Ribosomes are exactly three bases wide.
  - There are three kinds of RNA.
  - Each amino acid contains three nitrogen atoms.
  answer: 0
  explanation: With four bases, $4^2 = 16$ two-letter words can't name 20 amino acids, but $4^3 = 64$ three-letter words can, with extras (which is why the code is redundant).
- id: bio-q-0617
  lesson: bio-protein-synthesis
  topic: Translation
  stem: A tRNA has the anticodon 3′-UAC-5′. Which codon does it pair with, and which amino acid does it carry?
  choices:
  - AUG, methionine
  - UAC, tyrosine
  - AUG, tyrosine
  - CAU, histidine
  answer: 0
  explanation: 'The anticodon pairs with the codon: U–A, A–U, C–G gives 5′-AUG-3′, which codes for Met. Looking up UAC in the table is the classic error (the table lists codons, not anticodons). CAU is the anticodon read 5′ to 3′ and then looked up as if it were a codon.'
- id: bio-q-0618
  lesson: bio-protein-synthesis
  module_quiz: true
  topic: Genetic code
  stem: The mRNA coding region of a gene, from the start codon through the stop codon, is 900 nucleotides long. How many amino acids are in the polypeptide?
  choices:
  - '300'
  - '299'
  - '900'
  - '301'
  answer: 1
  explanation: 900 ÷ 3 = 300 codons, one of which is the stop codon, which codes for no amino acid. So 299 amino acids. 300 counts the stop codon; 900 treats each nucleotide as an amino acid.
- id: bio-q-0619
  lesson: bio-protein-synthesis
  topic: Translation
  stem: What ends translation when a ribosome reaches a stop codon?
  choices:
  - A tRNA carrying a stop amino acid pairs with the codon.
  - RNA polymerase falls off the mRNA.
  - The ribosome runs out of ATP.
  - A release factor protein binds the stop codon and frees the polypeptide.
  answer: 3
  explanation: No tRNA matches UAA, UAG or UGA. A release factor binds instead, the chain is released, and the ribosome comes apart. RNA polymerase works in transcription, not translation.
- id: bio-q-0620
  lesson: bio-protein-synthesis
  topic: Genetic code
  stem: A human insulin gene placed in bacteria makes working human insulin. Which feature of the genetic code makes this possible?
  choices:
  - It is redundant.
  - It is nearly universal.
  - It has three stop codons.
  - It is read in overlapping triplets.
  answer: 1
  explanation: Bacteria read codons the same way human cells do, so a human gene's codons specify the same amino acids. Redundancy (several codons per amino acid) is true but doesn't explain it. The code is not read in overlapping triplets.
- id: bio-q-0621
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: Which statement correctly compares RNA with DNA?
  choices:
  - RNA contains deoxyribose and thymine and is usually double-stranded.
  - RNA contains ribose and thymine and is usually double-stranded.
  - RNA contains ribose and uracil and is usually single-stranded.
  - RNA contains deoxyribose and uracil and is usually single-stranded.
  answer: 2
  explanation: RNA's sugar is ribose (DNA's is deoxyribose), uracil replaces thymine, and most RNA molecules are a single strand.
- id: bio-q-0622
  lesson: bio-protein-synthesis
  topic: Translation
  stem: Which molecule actually catalyzes the peptide bonds between amino acids in a ribosome?
  choices:
  - mRNA
  - tRNA
  - rRNA
  - DNA polymerase
  answer: 2
  explanation: The core of the ribosome is ribosomal RNA, and the rRNA itself forms peptide bonds. mRNA carries the code and tRNA delivers amino acids; DNA polymerase copies DNA.
- id: bio-q-0623
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Gene regulation
  stem: In the lac operon of E. coli, what happens when lactose is present?
  choices:
  - Lactose binds the operator and blocks RNA polymerase.
  - Lactose binds the promoter and attracts the repressor.
  - The repressor binds lactose and stays on the operator more tightly.
  - Lactose binds the repressor, which changes shape and releases the operator, so the genes are transcribed.
  answer: 3
  explanation: The repressor normally sits on the operator and blocks transcription. A form of lactose binds the repressor, changing its shape so it lets go of the DNA. Lactose never binds the DNA itself.
- id: bio-q-0624
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: A mutant E. coli strain makes a repressor that cannot bind to the operator. How are its lac genes expressed?
  choices:
  - Off, whether or not lactose is present
  - On, whether or not lactose is present
  - On only when lactose is present, as normal
  - On only when lactose is absent
  answer: 1
  explanation: With no working repressor on the operator, nothing blocks RNA polymerase, so transcription runs all the time. A repressor that cannot release (for example, one that can't bind lactose) would instead keep the genes off.
- id: bio-q-0625
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: A nerve cell and a skin cell from the same person make very different proteins. What is the best explanation?
  choices:
  - They contain different genes.
  - Nerve cells have lost the genes for skin proteins.
  - They express different genes from the same DNA, controlled by different transcription factors.
  - Skin cells have extra chromosomes.
  answer: 2
  explanation: Nearly all body cells carry the same genome. Cell types differ in which genes are switched on, set largely by combinations of transcription factors and by how tightly DNA is packed.
- id: bio-q-0626
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: Which describes an epigenetic change?
  choices:
  - A base substitution changes a codon.
  - A chromosome segment is deleted.
  - A plasmid carrying a new gene enters a bacterium.
  - Methyl groups added to DNA silence a gene, and the pattern is copied when the cell divides.
  answer: 3
  explanation: Epigenetic changes alter gene activity without changing the DNA sequence, through tags such as DNA methylation or histone modification that can be passed to daughter cells. The other choices all change the DNA sequence or add new DNA.
- id: bio-q-0627
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Mutations
  stem: A codon in an mRNA changes from GAA to GAG. What type of mutation is this?
  choices:
  - Missense
  - Silent
  - Nonsense
  - Frameshift
  answer: 1
  explanation: 'GAA and GAG both code for glutamic acid (Glu), so the protein is unchanged: silent. A missense mutation would change the amino acid, a nonsense mutation would create a stop codon, and a frameshift needs an insertion or deletion.'
- id: bio-q-0628
  lesson: bio-gene-regulation
  module_quiz: true
  topic: Mutations
  stem: The mRNA 5′-AUG GCA UGG AAA UAA-3′ codes for Met–Ala–Trp–Lys. A mutation changes UGG to UGA. What is the result?
  choices:
  - 'A nonsense mutation: the protein is Met–Ala only.'
  - 'A missense mutation: Trp is replaced by Arg.'
  - 'A silent mutation: the protein is unchanged.'
  - 'A frameshift: every amino acid after Ala changes.'
  answer: 0
  explanation: 'UGA is a stop codon, so translation ends after Ala and the protein is cut short: a nonsense mutation. One base was substituted, not inserted or deleted, so the frame is unchanged.'
- id: bio-q-0629
  lesson: bio-gene-regulation
  topic: Mutations
  stem: One base is deleted near the start of a gene's coding region. Why is this usually more harmful than a single-base substitution?
  choices:
  - It always creates a stop codon at the site of the deletion.
  - It removes exactly one amino acid.
  - It changes the DNA in every cell of the body.
  - It shifts the reading frame, changing every codon after it and often creating an early stop codon.
  answer: 3
  explanation: Codons are read in fixed groups of three from AUG, so losing one base regroups every later base. A substitution affects at most one codon. Removing exactly one amino acid requires deleting three bases.
- id: bio-q-0630
  lesson: bio-gene-regulation
  topic: Mutations
  stem: The most common cystic fibrosis mutation deletes three bases from the gene. What effect does this have on the reading frame?
  choices:
  - It shifts the frame, changing every amino acid after the deletion.
  - It changes one amino acid to a stop codon.
  - None; one amino acid is missing but the rest of the sequence is read in the normal frame.
  - It doubles the length of the protein.
  answer: 2
  explanation: Three bases are one codon, so the frame is kept. The protein lacks one phenylalanine but is otherwise normal in sequence (though it misfolds). Only insertions or deletions that are not multiples of three cause frameshifts.
- id: bio-q-0631
  lesson: bio-gene-regulation
  topic: Mutations
  stem: A mutation occurs in a skin cell on a man's arm after years of sun exposure. Can it be passed to his children?
  choices:
  - Yes, because all mutations are inherited.
  - No, because it is a somatic mutation, not in a cell that makes sperm.
  - Yes, but only to his sons.
  - No, because ultraviolet light cannot cause mutations.
  answer: 1
  explanation: Only germline mutations (in cells that make eggs or sperm) reach the next generation. A somatic mutation is passed only to that cell's descendants in the body, though it may contribute to skin cancer. UV light is a well-known mutagen.
- id: bio-q-0632
  lesson: bio-gene-regulation
  topic: Mutations
  stem: Sickle cell disease results from codon 6 of a hemoglobin gene changing from GAG to GUG. Using the codon table, what kind of mutation is this?
  choices:
  - 'Silent: both codons code for Glu'
  - 'Missense: Glu is replaced by Val'
  - 'Nonsense: GUG is a stop codon'
  - 'Frameshift: a base was inserted'
  answer: 1
  explanation: 'GAG codes for Glu and GUG for Val, so one amino acid changes: missense. GUG is not a stop codon, and the change is a substitution (one base swapped), not an insertion.'
- id: bio-q-0633
  lesson: bio-biotech
  module_quiz: true
  topic: PCR
  stem: A PCR reaction starts with 10 copies of a target sequence. Assuming perfect doubling, how many copies are present after 10 cycles?
  choices:
  - 10,240
  - '200'
  - 1,024
  - '100'
  answer: 0
  explanation: $N = N_0 \times 2^n = 10 \times 2^{10} = 10 \times 1024 = 10{,}240$. 200 uses $N_0 \times 2n$ (adding instead of doubling); 1,024 forgets the starting 10 copies; 100 is $10 \times 10$.
- id: bio-q-0634
  lesson: bio-biotech
  topic: PCR
  stem: Why does PCR use a DNA polymerase from bacteria that live in hot springs?
  choices:
  - Hot-spring polymerase copies RNA instead of DNA.
  - It works only at room temperature, which keeps the primers attached.
  - Each cycle heats the mixture to about 95 °C to separate the strands, which would destroy most enzymes.
  - It needs no primers.
  answer: 2
  explanation: The denaturing step near 95 °C would ruin an ordinary enzyme every cycle. Taq polymerase survives it, so it can be added once. It still needs primers and copies DNA.
- id: bio-q-0635
  lesson: bio-biotech
  topic: PCR
  stem: Put the three temperature steps of one PCR cycle in order.
  choices:
  - Anneal primers, denature, extend
  - Extend, denature, anneal primers
  - Denature, extend, anneal primers
  - Denature (about 95 °C), anneal primers (about 50–65 °C), extend (about 72 °C)
  answer: 3
  explanation: The strands must first separate (denature) so the primers can bind (anneal) to single strands; only then can the polymerase extend from the primers.
- id: bio-q-0636
  lesson: bio-biotech
  module_quiz: true
  topic: Gel electrophoresis
  stem: DNA fragments of 300, 1,200 and 5,000 base pairs are run on the same gel. Which travels farthest from the well, and toward which electrode?
  choices:
  - The 5,000 bp fragment, toward the positive electrode
  - The 300 bp fragment, toward the negative electrode
  - The 300 bp fragment, toward the positive electrode
  - The 5,000 bp fragment, toward the negative electrode
  answer: 2
  explanation: DNA's phosphate backbone is negatively charged, so it moves toward the positive electrode. Smaller fragments slip through the gel more easily and travel farthest.
- id: bio-q-0637
  lesson: bio-biotech
  topic: Gel electrophoresis
  stem: On a gel, ladder bands of 2,000 bp and 1,000 bp are 44 mm and 50 mm from the wells. An unknown band is at 47 mm. Which estimate is best?
  choices:
  - Exactly 1,500 bp
  - About 2,500 bp
  - About 1,400 bp
  - About 700 bp
  answer: 2
  explanation: The band lies between the 1,000 and 2,000 bp bands, so its size is between them. Distance is linear in the logarithm of size, so halfway in distance is the geometric middle, $\sqrt{1000 \times 2000} \approx 1{,}414$ bp, not the arithmetic middle of 1,500. 2,500 and 700 lie outside the bracketing bands.
- id: bio-q-0638
  lesson: bio-biotech
  topic: Biotechnology
  stem: A linear DNA molecule 8,000 bp long has restriction sites at positions 2,000 and 5,000. What fragment sizes are produced?
  choices:
  - 2,000, 3,000 and 3,000 bp
  - 2,000 and 5,000 bp
  - 2,000, 5,000 and 8,000 bp
  - 3,000 and 5,000 bp
  answer: 0
  explanation: 'Two cuts in a linear molecule make three pieces: 0 to 2,000 (2,000 bp), 2,000 to 5,000 (3,000 bp), and 5,000 to 8,000 (3,000 bp). They add up to 8,000. Listing the cut positions as sizes is the usual error; two pieces would come from a circle.'
- id: bio-q-0639
  lesson: bio-biotech
  module_quiz: true
  topic: Biotechnology
  stem: To make human insulin in bacteria, why are the plasmid and the insulin gene cut with the same restriction enzyme?
  choices:
  - So the bacteria will be killed by the antibiotic
  - So the insulin gene is copied by PCR
  - So the plasmid becomes linear and stays that way
  - So their sticky ends are complementary and can pair before ligase seals them
  answer: 3
  explanation: The same enzyme leaves matching single-stranded tails on both pieces. They base-pair, and DNA ligase joins the backbones to make recombinant DNA. The antibiotic step selects bacteria that took up a plasmid; it is meant to kill those that didn't.
- id: bio-q-0640
  lesson: bio-biotech
  topic: Biotechnology
  stem: Bacteria are mixed with recombinant plasmids carrying an antibiotic-resistance gene and then grown on a plate containing that antibiotic. What grows?
  choices:
  - Only bacteria that did not take up a plasmid
  - Only bacteria that took up a plasmid
  - All the bacteria
  - No bacteria
  answer: 1
  explanation: The resistance gene travels on the plasmid, so only bacteria carrying a plasmid survive the antibiotic. This step selects the transformed cells from the many that took up nothing.
- id: bio-q-0641
  lesson: bio-biotech
  topic: Biotechnology
  stem: At one STR region, crime-scene DNA has alleles with 8 and 11 repeats. Suspect 1 has 8 and 11; suspect 2 has 8 and 10. What can be concluded from this region alone?
  choices:
  - Suspect 1 is definitely the source.
  - Suspect 2 is excluded; suspect 1 is not excluded but is not identified by one region.
  - Both suspects are excluded.
  - Neither suspect can be excluded.
  answer: 1
  explanation: Suspect 2 has a 10-repeat allele that is not in the evidence, so suspect 2 cannot be the source. Suspect 1 matches, but many people share any one pair of alleles; labs compare about 20 regions before calling a match.
- id: bio-q-0642
  lesson: bio-biotech
  topic: Biotechnology
  stem: How does CRISPR-Cas9 find the gene it cuts?
  choices:
  - A guide RNA designed to match the target sequence base-pairs with it.
  - Cas9 recognizes a fixed six-base palindrome, like a restriction enzyme.
  - It cuts at random and the right cuts are selected later.
  - It binds the gene's promoter by recognizing RNA polymerase.
  answer: 0
  explanation: 'The guide RNA is the targeting part: change its sequence and Cas9 cuts a different gene. A restriction enzyme, by contrast, always cuts the same fixed site.'
- id: bio-q-0643
  lesson: bio-dna
  type: label
  module_quiz: true
  topic: DNA structure
  stem: This is the untwisted section of DNA from the lesson, with its labels removed. Name the numbered parts.
  image:
    src: images/m6-dna-structure-blank.svg
    alt: A double helix beside an untwisted ladder of four base pairs (A–T, G–C, T–A, C–G). Each side of the ladder alternates circles and pentagons, rectangles for the bases reach toward the middle, and the bases meet across dashed lines. 5′ and 3′ ends are marked.
  labels:
  - x: 71.0
    y: 27.4
    text: Phosphate group
  - x: 65.7
    y: 38.9
    text: Deoxyribose sugar
  - x: 59.1
    y: 57.7
    text: Nitrogen base
  - x: 51.5
    y: 76.4
    text: Hydrogen bonds
  distractors:
  - Ribose sugar
  - Peptide bond
  explanation: '1: the circles in the backbone are phosphate groups. 2: the pentagons are the five-carbon sugar deoxyribose (ribose is the sugar in RNA). 3: the rectangles are the nitrogen bases, here adenine. 4: the dashed lines between paired bases are hydrogen bonds, three for this G–C pair. Peptide bonds join amino acids in proteins, not nucleotides.'
- id: bio-q-0644
  lesson: bio-dna
  type: text
  topic: DNA structure
  stem: In double-stranded DNA, adenine always pairs with ___ and guanine always pairs with ___.
  accept:
  - - thymine
    - T
  - - cytosine
    - C
  explanation: 'Each base pair is one purine with one pyrimidine: A–T (two hydrogen bonds) and G–C (three hydrogen bonds). Uracil replaces thymine only in RNA.'
- id: bio-q-0645
  lesson: bio-dna
  type: order
  topic: DNA replication
  stem: Put these events at a replication fork in the order they happen for one Okazaki fragment.
  items:
  - Helicase unwinds the double helix
  - Primase lays down a short RNA primer
  - DNA polymerase adds nucleotides to the primer's 3′ end
  - The RNA primer is replaced with DNA
  - DNA ligase seals the gap between fragments
  explanation: The strands must be separated first. Polymerase can't start a strand from nothing, so a primer comes next; polymerase extends it 5′ → 3′. Later the RNA primer is swapped for DNA, and ligase joins the finished fragment to its neighbor.
- id: bio-q-0646
  lesson: bio-dna
  module_quiz: true
  topic: DNA replication
  stem: Which statements describe the lagging strand? Select all that apply.
  choices:
  - It is made as a series of Okazaki fragments.
  - It needs many RNA primers, one for each fragment.
  - It is built in the 3′ → 5′ direction.
  - It is built continuously toward the replication fork.
  answer:
  - 0
  - 1
  explanation: The lagging strand is built in pieces (Okazaki fragments), each started from its own primer. Like every new strand it grows 5′ → 3′; that rule is exactly why it must be made in fragments working away from the fork. The strand built continuously toward the fork is the leading strand.
- id: bio-q-0647
  lesson: bio-dna
  type: match
  topic: DNA structure
  stem: Match each experiment to what it showed.
  pairs:
  - - Griffith (1928)
    - Something from dead S bacteria permanently changed live R bacteria
  - - Avery, MacLeod and McCarty (1944)
    - Only destroying DNA stopped transformation
  - - Hershey and Chase (1952)
    - Phage DNA, not protein, enters the bacterium
  - - Meselson and Stahl (1958)
    - Each new DNA helix keeps one old strand
  distractors:
  - In DNA, A equals T and G equals C
  explanation: Griffith discovered transformation without knowing its cause; Avery's enzyme tests pinned it on DNA; Hershey and Chase's ³²P and ³⁵S labels showed DNA enters the cell; Meselson and Stahl's density bands showed semiconservative replication. The leftover statement is Chargaff's rule.
- id: bio-q-0648
  lesson: bio-protein-synthesis
  type: label
  module_quiz: true
  topic: Translation
  stem: The picture shows translation in progress. Name the numbered parts.
  image:
    src: images/m6-translation-blank.svg
    alt: A large oval above and a smaller oval below clamp around a strand with boxed triplets reading AUG, UUU, GGC, AAA, UGA. Two adapter molecules stand on the strand, one carrying a chain of Met and Phe and one carrying Gly, each with three letters at its base. A third, empty adapter drifts away on the left.
  labels:
  - x: 60.5
    y: 31.9
    text: Ribosome
  - x: 88.4
    y: 72.8
    text: mRNA
  - x: 44.8
    y: 51.1
    text: tRNA
  - x: 34.1
    y: 65.7
    text: Anticodon
  distractors:
  - RNA polymerase
  - Promoter
  explanation: '1: the two-part structure clamped around the message is the ribosome (this marker is on its large subunit). 2: the strand of codons is the mRNA. 3: the adapters that carry amino acids are tRNAs. 4: the three bases at the bottom of a tRNA, pairing with a codon, are its anticodon. RNA polymerase and promoters belong to transcription.'
- id: bio-q-0649
  lesson: bio-protein-synthesis
  type: text
  topic: Genetic code
  stem: A tRNA has the anticodon 3′-GGU-5′. The mRNA codon it pairs with is 5′-___-3′.
  accept:
  - CCA
  explanation: 'Pair each anticodon base with its RNA partner, keeping the strands antiparallel: G–C, G–C, U–A gives the codon 5′-CCA-3′ (which codes for Pro). Writing CCT would use DNA''s T, and ACC reads the codon backwards.'
- id: bio-q-0650
  lesson: bio-protein-synthesis
  type: order
  topic: Transcription
  stem: Put the steps in making a protein from a eukaryotic gene in order.
  items:
  - RNA polymerase binds the promoter
  - The gene is transcribed into pre-mRNA
  - The RNA is capped, tailed and spliced
  - The mRNA leaves the nucleus
  - A ribosome finds the AUG start codon
  - tRNAs deliver amino acids and peptide bonds form
  - A release factor binds the stop codon and the chain is released
  explanation: Transcription (binding, then elongation) and processing happen in the nucleus. The finished mRNA moves to the cytoplasm, where translation starts at AUG, elongates codon by codon, and ends when a release factor recognizes the stop codon.
- id: bio-q-0651
  lesson: bio-protein-synthesis
  topic: Transcription
  stem: Which features are found in RNA but not in DNA? Select all that apply.
  choices:
  - The base uracil
  - The sugar ribose
  - Usually a single strand
  - A sugar–phosphate backbone
  answer:
  - 0
  - 1
  - 2
  explanation: RNA uses uracil in place of thymine, has ribose instead of deoxyribose, and is usually single-stranded. Both nucleic acids have a sugar–phosphate backbone, so that one is not a difference.
- id: bio-q-0652
  lesson: bio-protein-synthesis
  type: match
  module_quiz: true
  topic: Translation
  stem: Match each kind of RNA to its job in protein synthesis.
  pairs:
  - - mRNA
    - Carries the gene's codons from DNA to the ribosome
  - - tRNA
    - Brings a specific amino acid and pairs with a codon
  - - rRNA
    - Forms the ribosome's core and joins amino acids
  distractors:
  - Unwinds DNA at the replication fork
  - Seals gaps between Okazaki fragments
  explanation: mRNA is the message, tRNA is the adapter with an anticodon, and rRNA is the ribosome's structural and catalytic core. Unwinding DNA is helicase's job and sealing fragments is ligase's; both are proteins.
- id: bio-q-0653
  lesson: bio-gene-regulation
  type: label
  module_quiz: true
  topic: Gene regulation
  stem: The picture shows the lac operon when no lactose is present, with labels removed. Name the numbered parts.
  image:
    src: images/m6-lac-operon-blank.svg
    alt: A strand of DNA with a separate gene box on the far left, then a short box, a second short box, and three long gene boxes. An oval protein sits above the first short box, and a second, arch-shaped protein sits on the second short box.
  labels:
  - x: 30.2
    y: 64
    text: Promoter
  - x: 36.3
    y: 66
    text: Operator
  - x: 36.3
    y: 35
    text: Repressor
  - x: 23.8
    y: 40
    text: RNA polymerase
  - x: 50
    y: 60
    text: Gene for a lactose-using enzyme
  distractors:
  - Enhancer
  - Ribosome
  explanation: RNA polymerase (4) binds the promoter (1). The repressor (3) sits on the operator (2), which overlaps the start of transcription, so the polymerase can't move into the genes (5). Enhancers are eukaryotic control regions, and ribosomes translate mRNA rather than binding DNA.
- id: bio-q-0654
  lesson: bio-gene-regulation
  type: text
  topic: Gene regulation
  stem: In the lac operon, lactose turns the genes on by binding the ___, which then lets go of the ___.
  accept:
  - - repressor
    - lac repressor
    - repressor protein
  - - operator
    - operator sequence
    - lac operator
  explanation: Lactose (as allolactose) binds the repressor and changes its shape, so it releases the operator and RNA polymerase can transcribe the genes. Lactose does not bind the DNA itself.
- id: bio-q-0655
  lesson: bio-gene-regulation
  type: match
  topic: Mutations
  stem: Match each change in an mRNA's coding region to its type of mutation. Use the codon table.
  pairs:
  - - UAU → UAC
    - Silent
  - - UGG → UGA
    - Nonsense
  - - AAA → AGA
    - Missense
  - - One base deleted from codon 2
    - Frameshift
  distractors:
  - In-frame deletion
  explanation: UAU and UAC both code for Tyr (silent). UGG (Trp) becoming UGA (stop) cuts the protein short (nonsense). AAA (Lys) becoming AGA (Arg) changes one amino acid (missense). Losing one base shifts every later codon (frameshift). An in-frame deletion would remove a multiple of three bases.
- id: bio-q-0656
  lesson: bio-gene-regulation
  topic: Gene regulation
  stem: Which are ways that eukaryotic cells control which genes are expressed? Select all that apply.
  choices:
  - Transcription factors binding enhancers
  - Packing DNA tightly around histones, helped by methyl tags
  - MicroRNAs that block translation of an mRNA
  - Rewriting the gene's DNA sequence differently in each cell type
  answer:
  - 0
  - 1
  - 2
  explanation: Transcription factors, chromatin packing with epigenetic tags, and microRNAs are all real control points. Cell types differ in which genes they express, not in their DNA sequence, so rewriting genes is not how cells specialize.
- id: bio-q-0657
  lesson: bio-gene-regulation
  type: order
  module_quiz: true
  topic: Gene regulation
  stem: Lactose becomes available to E. coli that has no glucose. Put the events in order.
  items:
  - Lactose enters the cell
  - Lactose binds the repressor
  - The repressor changes shape and leaves the operator
  - RNA polymerase transcribes the lac genes
  - The enzymes break down the lactose
  - With lactose gone, the repressor binds the operator again
  explanation: 'Lactose must reach the repressor before the repressor can release the operator; only then is transcription possible. The enzymes made use up the lactose, and the free repressor rebinds, switching the genes off: negative feedback.'
- id: bio-q-0658
  lesson: bio-biotech
  type: label
  module_quiz: true
  topic: Gel electrophoresis
  stem: The picture shows a gel with its labels removed. The first lane is a ladder. Name the numbered parts.
  image:
    src: images/m6-gel-blank.svg
    alt: A rectangular gel between a dark bar at the top and a red bar at the bottom. Four lanes each begin at a small rectangular slot near the top. The first lane has eight evenly spaced bands; the other lanes have two bands each.
  labels:
  - x: 42.1
    y: 17.7
    text: Well
  - x: 48.8
    y: 8.9
    text: Negative electrode
  - x: 48.8
    y: 91.1
    text: Positive electrode
  - x: 28.7
    y: 27.3
    text: Longest fragment in the ladder
  - x: 28.7
    y: 75.0
    text: Shortest fragment in the ladder
  distractors:
  - Primer
  - Promoter
  explanation: Samples are loaded into wells (1) at the end nearest the negative electrode (2). DNA is negatively charged, so it moves away from there toward the positive electrode (3). Long fragments move slowest and stay nearest the wells (4); the shortest travel farthest (5).
- id: bio-q-0659
  lesson: bio-biotech
  type: text
  topic: PCR
  stem: A PCR tube starts with 3 copies of a target sequence. Assuming perfect doubling, after 5 cycles there are ___ copies.
  accept:
  - '96'
  explanation: $N = N_0 \times 2^n = 3 \times 2^5 = 3 \times 32 = 96$. Using $2n$ instead of $2^n$ would give 30, the usual mistake.
- id: bio-q-0660
  lesson: bio-biotech
  type: order
  topic: Biotechnology
  stem: Put the steps for making a protein such as human insulin in bacteria in order.
  items:
  - Cut the plasmid and the gene with the same restriction enzyme
  - Mix them so their sticky ends pair
  - Seal the joints with DNA ligase
  - Put the recombinant plasmids into bacteria
  - Grow the bacteria on the antibiotic to keep only those with a plasmid
  - Grow the selected bacteria in large tanks and collect the protein
  explanation: Matching sticky ends come from cutting both with the same enzyme; they pair and ligase seals them. The plasmids are then put into bacteria, the antibiotic selects cells that took one up, and those cells are grown to make the protein.
- id: bio-q-0661
  lesson: bio-biotech
  topic: PCR
  stem: Which must be in a PCR tube to copy a target sequence? Select all that apply.
  choices:
  - Template DNA containing the target
  - Two primers matching the ends of the target
  - A heat-resistant DNA polymerase
  - Free DNA nucleotides
  - A restriction enzyme
  - Ribosomes
  answer:
  - 0
  - 1
  - 2
  - 3
  explanation: PCR needs the template, primers to start each new strand, a polymerase that survives 95 °C (such as Taq), and nucleotides to build with. Restriction enzymes cut DNA and ribosomes make proteins; neither is part of PCR.
- id: bio-q-0662
  lesson: bio-biotech
  type: match
  module_quiz: true
  topic: Biotechnology
  stem: Match each tool to its job.
  pairs:
  - - Restriction enzyme
    - Cuts DNA at one specific short sequence
  - - DNA ligase
    - Joins DNA fragments together
  - - Gel electrophoresis
    - Sorts DNA fragments by size
  - - PCR
    - Makes many copies of a chosen stretch of DNA
  - - CRISPR-Cas9
    - Cuts a sequence chosen by a guide RNA
  distractors:
  - Reads mRNA codons to build a protein
  explanation: Restriction enzymes cut fixed sites, ligase seals, gels separate by size, PCR copies, and Cas9 cuts wherever its guide RNA matches. Reading codons to build a protein is the ribosome's job.
- id: bio-qh-0601
  lesson: bio-h-regulation-depth
  topic: Operons
  stem: Tryptophan is plentiful in an E. coli cell. What happens at the trp operon?
  choices:
  - Tryptophan binds the operator directly and blocks RNA polymerase.
  - Tryptophan pulls the repressor off the operator, so the genes are transcribed.
  - Tryptophan binds the repressor, which can then bind the operator and block transcription.
  - Tryptophan binds CAP, which activates the trp genes.
  answer: 2
  explanation: 'Tryptophan is a corepressor: the trp repressor is inactive alone and binds the operator only with tryptophan attached. That shuts off the genes for making more tryptophan. Pulling a repressor off the operator is how an inducer works (lac), and CAP is part of lac control, not trp.'
- id: bio-qh-0602
  lesson: bio-h-regulation-depth
  topic: Operons
  stem: Which match of pathway and operon type is expected, and why?
  choices:
  - A pathway that breaks down a sugar is repressible, because the sugar shuts it off.
  - A pathway that breaks down a sugar is inducible, because its enzymes are needed only when the sugar is present.
  - A pathway that builds an amino acid is inducible, because the amino acid turns it on.
  - A pathway that builds an amino acid is always on, because amino acids are always needed.
  answer: 1
  explanation: Breakdown (catabolic) pathways should run when their food is around, so the food acts as inducer (lac). Building (anabolic) pathways should stop when their product is plentiful, so the product acts as corepressor (trp). Running a pathway nonstop wastes energy.
- id: bio-qh-0603
  lesson: bio-h-regulation-depth
  topic: Operons
  stem: E. coli is grown with both glucose and lactose available. Which describes the lac operon?
  choices:
  - 'Repressor off the operator, CAP–cAMP bound: high transcription'
  - 'Repressor on the operator, CAP–cAMP not bound: no transcription'
  - 'Repressor on the operator, CAP–cAMP bound: low transcription'
  - 'Repressor off the operator, CAP–cAMP not bound: low transcription'
  answer: 3
  explanation: Lactose releases the repressor, but glucose keeps cAMP low, so CAP can't bind and boost the promoter. The operon is only weakly transcribed. High transcription needs lactose present and glucose absent.
- id: bio-qh-0604
  lesson: bio-h-regulation-depth
  topic: Operons
  stem: A partial diploid has the genotype $I^S O^+ Z^+$ / $I^+ O^C Z^+$. With no glucose, when is β-galactosidase made?
  choices:
  - Both with and without lactose
  - Only when lactose is present
  - Never
  - Only when lactose is absent
  answer: 0
  explanation: 'The $I^S$ repressor can''t bind inducer, so it stays on any normal operator: the first copy is off for good. But no repressor can bind $O^C$, so the second copy, which has a working $Z$, is transcribed all the time. Enzyme is made with and without lactose. Answering never forgets that $O^C$ is immune to every repressor.'
- id: bio-qh-0605
  lesson: bio-h-regulation-depth
  topic: Eukaryotic gene regulation
  stem: 'A reporter assay tests DNA upstream of a muscle gene in muscle cells (relative light output): −4,000 to 0: 80; −2,500 to 0: 82; −1,500 to 0: 79; −500 to 0: 6; core promoter only (−100 to 0): 5. Where is the element needed for high expression in muscle?'
  choices:
  - Between −4,000 and −2,500
  - Between −1,500 and −500
  - Between −2,500 and −1,500
  - In the core promoter, −100 to 0
  answer: 1
  explanation: Activity stays high until the −1,500 to −500 piece is removed, then drops to about the core promoter's basal level (79 → 6). Removing the farther pieces changed nothing. The core promoter gives only basal activity (5), so it isn't the source of the high expression.
- id: bio-qh-0606
  lesson: bio-h-regulation-depth
  topic: Eukaryotic gene regulation
  stem: A 300-base-pair DNA piece raises transcription of a reporter about 30-fold whether it is placed 5,000 bases upstream, flipped in reverse orientation, or placed downstream of the gene. What is it most likely to be?
  choices:
  - A promoter
  - An operator
  - An enhancer
  - An intron splice site
  answer: 2
  explanation: Working at a distance, in either orientation and on either side of the gene is the signature of an enhancer. A promoter must sit at the start of the gene in the right orientation; operators are bacterial repressor sites next to the promoter; splice sites act on RNA, not on how much is transcribed.
- id: bio-qh-0607
  lesson: bio-h-regulation-depth
  topic: Eukaryotic gene regulation
  stem: Gene X is transcribed only when activators P and Q are both bound at its enhancer. Cell type 1 makes P and R, type 2 makes P and Q, and type 3 makes Q and R. Where is gene X on?
  choices:
  - In type 2 only
  - In types 1 and 2
  - In types 2 and 3
  - In all three types
  answer: 0
  explanation: 'Only type 2 has both required activators. Types 1 and 3 each lack one of them. This is combinatorial control: the same few factors in different combinations switch different gene sets on in different cell types.'
- id: bio-qh-0608
  lesson: bio-h-regulation-depth
  topic: Epigenetics
  stem: How is a cell's DNA methylation pattern passed on when it divides?
  choices:
  - DNA polymerase builds the new strand with methylated cytosines wherever the template has them.
  - The methyl groups are copied into the mRNA and then back into the DNA.
  - All methylation is erased at each division and added back at random.
  - After replication, each CpG site is methylated only on the old strand, and a maintenance enzyme methylates the new strand to match.
  answer: 3
  explanation: Because CpG pairs with CpG on the other strand, both strands carry the mark. Replication leaves half-methylated sites, which the maintenance enzyme recognizes and completes. Polymerase uses ordinary nucleotides, information doesn't flow from RNA back to DNA this way, and random re-marking couldn't keep cell types stable.
- id: bio-qh-0609
  lesson: bio-h-regulation-depth
  topic: Epigenetics
  stem: Cells are treated with a drug that blocks histone deacetylases, the enzymes that remove acetyl groups from histones. What is the most likely effect on a gene silenced by tightly packed chromatin?
  choices:
  - Its histones lose more acetyl groups and the chromatin packs tighter.
  - The gene's DNA sequence changes.
  - The gene's promoter becomes more heavily methylated.
  - Its histones stay acetylated, the chromatin loosens, and the gene may become active.
  answer: 3
  explanation: Blocking removal leaves acetyl groups on, which weakens the histones' grip on DNA and attracts activators, so silenced genes can turn on. Packing tighter is the opposite effect. The drug changes chromatin, not the base sequence, and it doesn't add DNA methyl groups.
- id: bio-qh-0610
  lesson: bio-h-regulation-depth
  topic: Eukaryotic gene regulation
  stem: A mutation destroys the site in an mRNA's 3′ untranslated region that pairs with a microRNA's seed. What happens to the protein the mRNA encodes?
  choices:
  - Its amino acid sequence changes.
  - Its level rises, because the microRNA no longer reduces translation and stability of the mRNA.
  - Its level falls, because the microRNA can no longer help ribosomes bind.
  - Nothing changes, because microRNAs act on DNA rather than mRNA.
  answer: 1
  explanation: The microRNA was turning this mRNA down; without the pairing site the mRNA escapes, so more protein is made. The 3′ untranslated region isn't translated, so the amino acid sequence is unchanged. MicroRNAs pair with mRNAs, not DNA, and they reduce translation rather than help it.
- id: bio-qh-0611
  lesson: bio-h-regulation-depth
  topic: Epigenetics
  stem: Which are examples of epigenetic regulation? Select all that apply.
  choices:
  - One X chromosome being silenced in each cell of a female mammal, with the same X silent in the cell's descendants
  - Only the father's copy of the IGF2 gene being expressed
  - A nonsense mutation that shortens a protein
  - A promoter methylated in liver cells and kept silent in their daughter cells
  answer:
  - 0
  - 1
  - 3
  explanation: X inactivation, imprinting and inherited promoter methylation all change gene activity through cell divisions without changing the DNA sequence. A nonsense mutation is a change in the sequence itself, so it is genetic, not epigenetic.
- id: bio-qh-0612
  lesson: bio-h-regulation-depth
  topic: Operons
  stem: In lac operon partial diploids, which of these act in trans, so that they can affect the operon on the other DNA molecule? Select all that apply.
  choices:
  - The lac repressor protein
  - The operator
  - The promoter
  - The CAP protein
  answer:
  - 0
  - 3
  explanation: Proteins diffuse, so the repressor and CAP can bind either copy of the operon. The operator and promoter are DNA sites that control only the genes beside them on the same molecule (cis-acting).
- id: bio-qh-0613
  lesson: bio-h-regulation-depth
  type: match
  topic: Operons
  stem: Match each molecule to its role in gene regulation.
  pairs:
  - - Allolactose
    - Inducer that inactivates the lac repressor
  - - Tryptophan
    - Corepressor that activates its own repressor
  - - cAMP
    - Signal of low glucose that lets CAP bind DNA
  - - Mediator
    - Protein complex linking activators to RNA polymerase II
  distractors:
  - Cuts microRNA hairpins in the cytoplasm
  explanation: Allolactose turns lac on by releasing the repressor; tryptophan turns trp off by activating its repressor; cAMP rises when glucose is low and switches on CAP; Mediator bridges enhancer-bound activators and the polymerase. Cutting microRNA hairpins in the cytoplasm is Dicer's job.
- id: bio-qh-0614
  lesson: bio-h-regulation-depth
  type: text
  topic: Eukaryotic gene regulation
  stem: A gene has three clusters of mutually exclusive exons, with 4, 6 and 5 alternatives. Every mRNA uses exactly one exon from each cluster. The number of different mRNAs possible is ___.
  accept:
  - '120'
  explanation: 'Independent choices multiply: $4 \times 6 \times 5 = 120$. Adding them (15) would count each exon, not each combination.'
- id: bio-qh-0615
  lesson: bio-h-regulation-depth
  type: label
  topic: Eukaryotic gene regulation
  stem: The picture shows how a distant control region turns on a eukaryotic gene. Name the numbered parts.
  image:
    src: images/m6-enhancer-loop-blank.svg
    alt: A DNA molecule bent into a loop. A box on the upper arm has a protein hanging from it; below that protein is a large rounded complex, which rests on an oval protein sitting on a box on the lower arm, next to a long gene box. A smaller protein sits beside the oval. An arrow under the gene points right.
  labels:
  - x: 51.2
    y: 23.8
    text: Enhancer
  - x: 51.2
    y: 33.3
    text: Activator
  - x: 51.2
    y: 52.4
    text: Mediator
  - x: 56
    y: 73
    text: RNA polymerase II
  - x: 42.4
    y: 78.6
    text: Promoter
  distractors:
  - Operator
  - Repressor
  explanation: The activator (2) binds the enhancer (1), far along the DNA. The DNA loops so the activator touches Mediator (3), which contacts RNA polymerase II (4) sitting with the general transcription factors at the promoter (5). Operators and the lac-style repressor belong to bacterial operons.
- id: bio-qh-0616
  lesson: bio-h-regulation-depth
  type: order
  topic: Eukaryotic gene regulation
  stem: Put the steps by which a microRNA silences a target gene in order.
  items:
  - The microRNA gene is transcribed into a long RNA that folds into a hairpin
  - Drosha cuts out a short hairpin, which is exported from the nucleus
  - Dicer cuts the hairpin into a double-stranded RNA about 22 bases long
  - One strand is loaded into an Argonaute protein
  - The seed region pairs with a site in the target mRNA's 3′ untranslated region
  - Translation of the target falls and the mRNA is broken down faster
  explanation: The microRNA is made like other RNA, trimmed twice (Drosha in the nucleus, Dicer in the cytoplasm), loaded as a single strand into Argonaute, and then guided by its seed to target mRNAs, which are translated less and decay faster.
- id: bio-qh-0617
  lesson: bio-h-genomics
  topic: Genomics
  stem: Why does adding a dideoxynucleotide (ddNTP) stop DNA synthesis in Sanger sequencing?
  choices:
  - It lacks the 3′-OH group needed to attach the next nucleotide.
  - It lacks a nitrogen base, so it can't pair with the template.
  - It is too large to fit in DNA polymerase.
  - It always pairs with the wrong base, so polymerase removes it.
  answer: 0
  explanation: Polymerase joins each new nucleotide to the 3′-OH of the last one. A ddNTP has its base, so it is added normally, but it has no 3′-OH, so nothing can follow it.
- id: bio-qh-0618
  lesson: bio-h-genomics
  topic: Genomics
  stem: 'A Sanger run uses a 20-base primer. The fragments and their colored terminal bases are: 23 T, 21 G, 24 A, 22 C, 25 C. What is the template strand, written 5′ to 3′?'
  choices:
  - 5′-GCTAC-3′
  - 5′-GTAGC-3′
  - 5′-CGATG-3′
  - 5′-CATCG-3′
  answer: 1
  explanation: Sorted by length (21 to 25) the terminal bases spell the new strand 5′-GCTAC-3′. The template is its antiparallel complement, 3′-CGATG-5′, which reads 5′-GTAGC-3′. GCTAC is the new strand itself, CGATG is the complement written with the wrong ends, and CATCG is the new strand reversed.
- id: bio-qh-0619
  lesson: bio-h-genomics
  topic: Genomics
  stem: A 4.6-million-base bacterial genome is sequenced with 2 million reads, each 150 bases long. What is the average coverage?
  choices:
  - About 6.5×
  - About 650×
  - About 65×
  - About 0.65×
  answer: 2
  explanation: $C = \dfrac{N \times L}{G} = \dfrac{2 \times 10^6 \times 150}{4.6 \times 10^6} \approx 65$. The other choices are off by powers of ten, usually from dropping the millions in only one place.
- id: bio-qh-0620
  lesson: bio-h-genomics
  topic: Genomics
  stem: Why are genomes sequenced to about 30× coverage instead of 1×?
  choices:
  - At 1× every base is read exactly once, which takes too long.
  - Higher coverage makes each read longer.
  - The genome is copied 30 times in each cell, so 30 reads are needed per base.
  - At 1× random reads leave about 37% of bases unread, and each base is read only once, so errors and heterozygous sites can't be checked.
  answer: 3
  explanation: Reads land at random, so at an average of 1× about $e^{-1} \approx 37\%$ of bases get no read at all, and the rest are read once with no check. At 30× almost nothing is missed and each base is seen many times. Coverage doesn't change read length, and cells hold two copies of each chromosome, not 30.
- id: bio-qh-0621
  lesson: bio-h-genomics
  topic: Genomics
  stem: A chromosome region contains a 12,000-base sequence repeated four times in a row. Why are long reads better than 150-base reads for sequencing it?
  choices:
  - Long reads are more accurate per base than short reads.
  - Short reads can't read DNA rich in A and T.
  - A long read can span a whole repeat copy plus unique DNA on either side, so the copies can be placed and counted.
  - Long reads need no DNA polymerase or other enzymes.
  answer: 2
  explanation: Short reads from inside a repeat look identical wherever they came from, so the assembly can't tell how many copies there are or where each read belongs. Long reads anchor in unique sequence. Long reads are not more accurate per base; their advantage is length.
- id: bio-qh-0622
  lesson: bio-h-genomics
  topic: Genomics
  stem: Two sequences are aligned over 50 positions. There are 3 mismatches and 2 gap positions; every other position is identical. What is the percent identity?
  choices:
  - 90%
  - 94%
  - 96%
  - 10%
  answer: 0
  explanation: 'Identical positions: $50 - 3 - 2 = 45$, and $45 / 50 = 90\%$. 94% subtracts only the mismatches (47 of 50), 96% subtracts only the gaps (48 of 50), and 10% is the fraction that differs.'
- id: bio-qh-0623
  lesson: bio-h-genomics
  topic: Gene editing
  stem: A guide RNA perfectly matches a 20-base site in a gene, but the site is not followed by an NGG sequence. What does the common Cas9 do there?
  choices:
  - It cuts both strands as usual.
  - It cuts only the strand that pairs with the guide.
  - It cuts the guide RNA instead of the DNA.
  - It doesn't cut, because it must first find a PAM next to the target.
  answer: 3
  explanation: Cas9 opens DNA only next to a PAM (5′-NGG-3′ for the common Cas9), and only then tests the guide match. Without a PAM it moves on, which is also how bacteria avoid cutting the matching sequences stored in their own CRISPR arrays.
- id: bio-qh-0624
  lesson: bio-h-genomics
  topic: Gene editing
  stem: A researcher wants Cas9 to change one specific base in a gene to a chosen new base. What else must be supplied?
  choices:
  - Nothing; end joining will insert the chosen base
  - A repair template carrying the new base, for homology-directed repair
  - A second PAM on the other strand
  - A restriction enzyme to trim the cut ends
  answer: 1
  explanation: Cas9 only cuts. End joining glues the ends back, often with random small insertions or deletions, which is useful for knocking a gene out, not for a chosen change. A precise change needs a template the cell can copy.
- id: bio-qh-0625
  lesson: bio-h-genomics
  topic: Gene editing
  stem: Casgevy, approved in 2023, treats sickle cell disease by editing a patient's blood stem cells outside the body. What does the edit do?
  choices:
  - It breaks an enhancer of BCL11A, so the cells' red-cell descendants make fetal hemoglobin again.
  - It replaces the sickle allele with the normal allele in every cell of the body.
  - It inserts a new hemoglobin gene into the patient's eggs or sperm.
  - It deletes the beta-globin gene entirely.
  answer: 0
  explanation: BCL11A switches off fetal hemoglobin after birth. Disrupting its red-cell enhancer leaves fetal hemoglobin on, which makes up for the faulty adult form. Only the treated blood stem cells are changed, not every cell and not eggs or sperm, so the change isn't inherited.
- id: bio-qh-0626
  lesson: bio-h-genomics
  topic: Gene editing
  stem: Which of these genetic changes could be passed on to a patient's children?
  choices:
  - Editing blood stem cells outside the body and returning them
  - Delivering a working gene to cells of the retina with a virus
  - Editing an early embryo before it is implanted
  - Silencing a liver gene with a small-RNA drug
  answer: 2
  explanation: Edits in an early embryo reach every cell, including future eggs or sperm, so they are germline changes. The other three change only somatic cells of the patient, and a small-RNA drug changes no DNA at all.
- id: bio-qh-0627
  lesson: bio-h-genomics
  topic: Genomics
  stem: Which statements about the human genome are supported by genome sequencing? Select all that apply.
  choices:
  - About 1.5% of it codes for protein.
  - It has roughly 20,000 protein-coding genes.
  - Two unrelated people differ at about half of their bases.
  - It has far more genes than any other animal.
  answer:
  - 0
  - 1
  explanation: Only about 1.5% codes for protein, in about 20,000 genes, about as many as a roundworm. Unrelated people differ at about 1 base in 1,000 (0.1%), not half.
- id: bio-qh-0628
  lesson: bio-h-genomics
  type: match
  topic: Genomics
  stem: Match each method to its description.
  pairs:
  - - Sanger sequencing
    - Fragments stopped by colored terminators; reads about 1,000 bases
  - - Short-read sequencing
    - Billions of reads about 150 bases long, read in parallel
  - - Nanopore sequencing
    - Single long molecules read by changes in an electric current
  - - Sequence alignment
    - Lines up two sequences to count matches, mismatches and gaps
  distractors:
  - Copies one stretch of DNA by repeated heating and cooling
  explanation: Sanger uses chain-terminating ddNTPs; short-read machines read clusters in parallel; nanopores read single molecules by current; alignment is a computer comparison. Copying a stretch by temperature cycles is PCR.
- id: bio-qh-0629
  lesson: bio-h-genomics
  type: text
  topic: Genomics
  stem: A 5,000,000-base genome is sequenced with 2,000,000 reads, each 150 bases long. The average coverage is ___×.
  accept:
  - '60'
  - 60x
  - 60×
  explanation: $C = \dfrac{N \times L}{G} = \dfrac{2{,}000{,}000 \times 150}{5{,}000{,}000} = 60$.
- id: bio-qh-0630
  lesson: bio-h-genomics
  type: text
  topic: Gene editing
  stem: The commonly used Cas9 cuts only next to the PAM sequence 5′-___-3′, where N stands for any base.
  accept:
  - NGG
  explanation: Streptococcus pyogenes Cas9, the usual editing enzyme, needs 5′-NGG-3′ just past the 20-base target on the non-target strand. Other Cas proteins recognize different PAMs.
- id: bio-qh-0631
  lesson: bio-h-genomics
  type: label
  topic: Gene editing
  stem: The picture shows Cas9 bound to its target. Name the numbered parts.
  image:
    src: images/m6-crispr-cas9-blank.svg
    alt: A large oval protein holds a stretch of DNA whose two strands are pulled apart. A red RNA strand pairs with the lower DNA strand and then loops inside the protein. A small box sits on the upper strand just past the paired region, and a dashed line with arrowheads crosses both strands a short distance from that box.
  labels:
  - x: 50
    y: 46.5
    text: Cas9
  - x: 69.0
    y: 27.9
    text: PAM
  - x: 62.8
    y: 67.4
    text: Cut site
  - x: 51.2
    y: 62.3
    text: Guide RNA
  - x: 30.8
    y: 58.1
    text: Target DNA strand
  distractors:
  - Primer
  - Promoter
  explanation: Cas9 (1) holds everything. It first recognizes the PAM (2), then the guide RNA (4) pairs with the target DNA strand (5). Both strands are cut (3) a few bases from the PAM. Primers belong to PCR and sequencing, and promoters to transcription.
- id: bio-qh-0632
  lesson: bio-h-genomics
  type: order
  topic: Gene editing
  stem: Put the steps of a Cas9 edit in order.
  items:
  - Cas9 binds a guide RNA
  - The complex scans the DNA for a PAM
  - At a PAM, Cas9 unwinds the neighboring DNA
  - The guide RNA pairs with the target strand
  - Cas9 cuts both DNA strands near the PAM
  - The cell repairs the break, creating the edit
  explanation: Cas9 needs its guide first; it then checks for a PAM, opens the DNA beside it and tests the guide match. A full match triggers both cuts, and the cell's repair (end joining or template repair) makes the actual change.
