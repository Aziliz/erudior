# Honors module h2: Development, stem cells, and the genome (lessons 45-48)

# ---------- Lesson 45: From zygote to embryo ----------
- id: bio-qh-h2-01
  lesson: bio-h-early-development
  module_quiz: true
  topic: Embryonic development
  stem: 'Within seconds of the first sperm fusing with a sea urchin egg, other sperm can no longer fuse with it. What causes this fast block to polyspermy?'
  choices:
    - 'The egg''s membrane voltage jumps from negative to positive.'
    - 'The fertilization envelope lifts away from the egg surface.'
    - 'The sperm nucleus fuses with the egg nucleus.'
    - 'The egg begins its first cleavage division.'
  answer: 0
  explanation: |-
    Sperm entry opens ion channels, and the membrane potential rises from about −70 mV to positive values within seconds; sperm cannot fuse with a positively charged sea urchin egg membrane. The fertilization envelope is the slow block, which takes about a minute. Fusion of the nuclei and cleavage come much later and do not block other sperm.
- id: bio-qh-h2-02
  lesson: bio-h-early-development
  topic: Embryonic development
  stem: 'A researcher injects a sea urchin egg with a chemical that traps calcium ions so their concentration cannot rise. A sperm then fertilizes the egg. What is the most likely result?'
  choices:
    - 'A normal fertilization envelope forms, but cleavage is faster than usual.'
    - 'The acrosome reaction fails, so the sperm cannot reach the egg membrane.'
    - 'No cortical reaction occurs, so no fertilization envelope forms and the egg stays poorly activated.'
    - 'The egg depolarizes permanently and never needs a slow block.'
  answer: 2
  explanation: |-
    The calcium wave set off by sperm entry triggers the cortical granules to release their contents, building the fertilization envelope, and also switches on the egg's metabolism. Without a calcium rise, neither happens. The acrosome reaction occurs in the sperm, before contact with the egg membrane, so trapping calcium inside the egg does not stop it. The fast electrical block is temporary, which is why the slow block is needed.
- id: bio-qh-h2-03
  lesson: bio-h-early-development
  module_quiz: true
  topic: Embryonic development
  stem: 'Which statement best describes what happens during cleavage?'
  choices:
    - 'Cells divide and grow, so the embryo doubles in size with each division.'
    - 'The embryo grows but the number of cells stays the same.'
    - 'Cells move inward to form three germ layers.'
    - 'Cells divide rapidly without growing, so they get smaller while the embryo stays about the same size.'
  answer: 3
  explanation: |-
    Cleavage divisions skip most of the growth phases (G1 and G2), so the egg's cytoplasm is divided into more and smaller cells while the whole embryo stays about the same size. Assuming growth between divisions is the usual mistake. Forming germ layers is gastrulation, which comes later.
- id: bio-qh-h2-04
  lesson: bio-h-early-development
  topic: Embryonic development
  stem: 'Why does only a small disc of cytoplasm on top of a chick egg divide during cleavage?'
  choices:
    - 'Chick eggs are fertilized by several sperm, and only one region receives a sperm nucleus.'
    - 'The huge mass of yolk cannot be cut by cleavage furrows, so only the yolk-free cap divides.'
    - 'Birds have no maternal mRNA, so most of the egg is inactive.'
    - 'The shell prevents the rest of the egg from dividing.'
  answer: 1
  explanation: |-
    Yolk gets in the way of the cleavage furrow. The chick egg cell is mostly yolk, so cleavage is partial (meroblastic): only the thin disc of cytoplasm on top divides. Sea urchin and human eggs, with little yolk, cleave completely; frogs, with moderate yolk, cleave completely but unequally. The shell has nothing to do with it.
- id: bio-qh-h2-05
  lesson: bio-h-early-development
  module_quiz: true
  topic: Embryonic development
  stem: 'Frog embryos begin transcribing their own genes after about 12 cleavages. When extra DNA was injected into fertilized eggs, this midblastula transition came earlier. What does this result support?'
  choices:
    - 'The transition is triggered when the ratio of DNA to cytoplasm reaches a threshold.'
    - 'The transition is timed by a clock that counts hours since fertilization.'
    - 'The transition begins when the embryo has used up its yolk.'
    - 'Injected DNA codes for a protein that starts transcription.'
  answer: 0
  explanation: |-
    Each cleavage doubles the amount of DNA without adding cytoplasm, so the DNA-to-cytoplasm ratio climbs. Adding DNA reached the threshold sooner, and so did the transition, which fits the ratio hypothesis (Newport and Kirschner, 1982). A clock counting hours would not be affected by extra DNA, and the result held for DNA that did not code for anything special.
- id: bio-qh-h2-06
  lesson: bio-h-early-development
  topic: Embryonic development
  stem: 'The cells lining the air sacs and airways of the lungs come from which germ layer?'
  choices: ['Endoderm', 'Mesoderm', 'Ectoderm', 'Neural crest']
  answer: 0
  explanation: |-
    The lungs begin as an outgrowth of the embryonic gut, so their lining comes from endoderm, like the lining of the gut, liver and pancreas. Their surrounding muscle, cartilage and blood vessels come from mesoderm. Thinking "deep inside the body" means mesoderm is a common slip.
- id: bio-qh-h2-07
  lesson: bio-h-early-development
  topic: Embryonic development
  stem: 'A human blastocyst has an outer layer of cells and a small cluster of cells inside. Which part develops into the body of the fetus?'
  choices:
    - 'The trophoblast'
    - 'The zona pellucida'
    - 'The blastocoel'
    - 'The inner cell mass'
  answer: 3
  explanation: |-
    Only the inner cell mass becomes the embryo itself (and is the source of embryonic stem cells). The trophoblast forms the embryo's part of the placenta, the blastocoel is the fluid-filled cavity, and the zona pellucida is the protein coat around the egg, which the blastocyst hatches out of.
- id: bio-qh-h2-08
  lesson: bio-h-early-development
  module_quiz: true
  topic: Embryonic development
  stem: 'Which of these structures develop from ectoderm? Select all that apply.'
  choices: [Epidermis of the skin, Brain and spinal cord, Kidneys, Lens of the eye, Lining of the liver and gut]
  answer: [0, 1, 3]
  explanation: |-
    Ectoderm forms the epidermis, the whole nervous system (via the neural tube and neural crest) and the lens of the eye. Kidneys come from mesoderm, and the lining of the gut and liver comes from endoderm.
- id: bio-qh-h2-09
  lesson: bio-h-early-development
  type: text
  topic: Embryonic development
  stem: 'In vertebrates, a stiff rod of mesoderm along the back, the ___, signals the ectoderm above it to form the neural plate.'
  accept: [notochord, the notochord]
  explanation: |-
    The notochord, the rod that gives chordates their name, induces the overlying ectoderm to thicken into the neural plate, which folds into the neural tube.
- id: bio-qh-h2-10
  lesson: bio-h-early-development
  type: text
  topic: Embryonic development
  stem: 'A zygote undergoes 9 synchronous cleavage divisions with no cell death. How many cells does the embryo have? ___'
  accept: ['512']
  explanation: |-
    Each division doubles the number of cells, so after $n$ divisions there are $2^n$ cells: $2^9 = 512$.
- id: bio-qh-h2-11
  lesson: bio-h-early-development
  module_quiz: true
  type: order
  topic: Embryonic development
  stem: 'Put these stages of vertebrate development in order, earliest first.'
  items: [Fertilization, Cleavage, Blastula, Gastrulation, Neurulation]
  explanation: |-
    Fertilization forms the zygote; cleavage divides it into many cells; the cells form a hollow blastula; gastrulation moves cells into three germ layers; then the notochord induces neurulation, the folding of the neural tube.
- id: bio-qh-h2-12
  lesson: bio-h-early-development
  type: label
  topic: Embryonic development
  stem: 'This is a cut-open sea urchin gastrula. Name each numbered part.'
  image: {src: images/h2-gastrula-blank.svg, alt: 'A cut-open sea urchin embryo during gastrulation: an outer ring of cells, a tube folding inward from an opening at the bottom, a few loose cells with projections floating in the fluid-filled space, and the space itself. Six points are numbered.'}
  labels:
    - {x: 68, y: 30, text: Ectoderm}
    - {x: 44, y: 50, text: Endoderm}
    - {x: 50, y: 66, text: Archenteron}
    - {x: 50, y: 79, text: Blastopore}
    - {x: 64, y: 55, text: Mesenchyme (mesoderm)}
    - {x: 44, y: 31, text: Blastocoel}
  distractors: [Notochord, Neural tube]
  explanation: |-
    1 The outer layer is ectoderm. 2 The wall of the infolding tube is endoderm. 3 The tube's inside is the archenteron, the primitive gut. 4 Its opening is the blastopore, which becomes the anus in sea urchins and other deuterostomes. 5 The loose cells in the cavity are mesenchyme, mesoderm cells that will build the skeleton. 6 The remaining fluid-filled space is the blastocoel. A notochord and neural tube are vertebrate (chordate) structures that form later.
- id: bio-qh-h2-13
  lesson: bio-h-early-development
  type: match
  topic: Embryonic development
  stem: 'Match each animal to its pattern of cleavage.'
  pairs:
    - [Sea urchin, 'Complete and equal: a hollow ball of equal cells']
    - [Frog, 'Complete but unequal: small cells on top, large yolky cells below']
    - [Chick, 'Partial: only a disc of cells on top of the yolk divides']
    - [Human, 'Complete and slow, forming a morula and then a blastocyst']
  explanation: |-
    The amount and position of yolk set the pattern. Sea urchin eggs have little, evenly spread yolk; frog yolk is concentrated in the lower half; the chick egg is almost all yolk; mammal eggs have very little yolk and cleave slowly while traveling down the oviduct.
- id: bio-qh-h2-14
  lesson: bio-h-early-development
  topic: Embryonic development
  stem: 'A frog egg is 1.2 mm across. After 6 synchronous cleavage divisions with no growth, about what is the average diameter of a cell?'
  choices: ['0.2 mm', '0.6 mm', '0.3 mm', '0.019 mm']
  answer: 2
  explanation: |-
    Six divisions give $2^6 = 64$ cells, each with $\tfrac{1}{64}$ of the volume. Diameter scales as the cube root of volume: $64^{1/3} = 4$, so $d = 1.2 \div 4 = 0.3$ mm. Dividing the diameter by 64 (0.019 mm) forgets the cube root; dividing by 2 or by 6 treats the cell count or the number of divisions as if it scaled the diameter directly.

# ---------- Lesson 46: How cells become different ----------
- id: bio-qh-h2-15
  lesson: bio-h-differentiation
  module_quiz: true
  topic: Cell differentiation
  stem: 'Spemann swapped presumptive neural tissue and presumptive epidermis between newt embryos. At the early gastrula stage each piece developed according to its new location; at the late gastrula stage the presumptive neural tissue formed neural tissue in the belly. What is the best conclusion?'
  choices:
    - 'Presumptive neural tissue becomes determined between the early and late gastrula stages.'
    - 'Presumptive neural tissue is already differentiated at the early gastrula stage.'
    - 'Cells lose the genes for other fates during gastrulation.'
    - 'The belly region induces neural tissue at the late gastrula stage.'
  answer: 0
  explanation: |-
    A transplant tests determination: an undetermined tissue follows its new position, a determined one keeps its old fate. The fate of the future neural tissue was fixed by the late gastrula, though it did not yet look different (so it was not differentiated). Gurdon-type experiments show genes are not lost, and the belly did not make neural tissue in the early transplants, so it is not an inducer of neural fate.
- id: bio-qh-h2-16
  lesson: bio-h-differentiation
  module_quiz: true
  topic: Cell differentiation
  stem: 'In the Spemann–Mangold experiment, dorsal lip tissue from a light-colored newt embryo was grafted onto the belly side of a dark-colored embryo, and a second body axis formed. Most of the second neural tube was dark. What does this show?'
  choices:
    - 'The graft divided rapidly and built the whole second embryo itself.'
    - 'The host''s cells were already determined to form a second nervous system.'
    - 'The graft induced host cells that would have formed belly tissue to form a neural tube.'
    - 'Pigment cells migrated from the graft into the host.'
  answer: 2
  explanation: |-
    Dark cells came from the host. The graft itself formed mostly notochord, and it changed the fate of host belly cells, organizing them into a neural tube and other axial tissues. That is induction, and the dorsal lip was named the organizer. If the graft had built everything, the second neural tube would be light.
- id: bio-qh-h2-17
  lesson: bio-h-differentiation
  topic: Cell differentiation
  stem: 'The organizer secretes proteins such as chordin and noggin. How do they cause nearby ectoderm to become neural tissue?'
  choices:
    - 'They enter the nucleus and act as transcription factors for neural genes.'
    - 'They bind BMP4 and prevent it from signaling, so the ectoderm is not told to become epidermis.'
    - 'They kill the epidermal cells by triggering apoptosis.'
    - 'They are morphogens whose high concentration directly switches on epidermal genes.'
  answer: 1
  explanation: |-
    BMP4 signals ectoderm to become epidermis. Chordin and noggin bind BMP4 outside the cells and block it, so ectoderm near the organizer takes a neural fate. They are secreted proteins acting outside the cell, not transcription factors, and they block an epidermal signal rather than activating epidermal genes.
- id: bio-qh-h2-18
  lesson: bio-h-differentiation
  module_quiz: true
  topic: Pattern formation
  stem: 'A morphogen forms the gradient $C(x) = C_0 e^{-x/\lambda}$ with $\lambda = 100$ µm. A target gene turns on wherever $C \ge 0.2\,C_0$. About how far from the source is the boundary of its expression?'
  choices: ['20 µm', '69 µm', '230 µm', '161 µm']
  answer: 3
  explanation: |-
    Solve $C_0 e^{-x/\lambda} = 0.2\,C_0$: $x = \lambda \ln(1/0.2) = 100 \ln 5 \approx 161$ µm. 20 µm comes from multiplying $\lambda$ by 0.2; 230 µm is the boundary for a threshold of $0.1\,C_0$; 69 µm is $\lambda \ln 2$, the shift from doubling the dose.
- id: bio-qh-h2-19
  lesson: bio-h-differentiation
  topic: Pattern formation
  stem: 'A female fruit fly has no working copies of the bicoid gene. What do the embryos she produces look like, whatever the father''s genotype?'
  choices:
    - 'They lack head and thorax structures and have rear-end structures at both ends.'
    - 'They have two heads and no abdomen.'
    - 'They develop normally, because each embryo makes its own Bicoid after fertilization.'
    - 'They develop legs in place of antennae.'
  answer: 0
  explanation: |-
    bicoid is a maternal effect gene: the mother places its mRNA at the front of every egg. With none, the embryos have no Bicoid gradient, so no head or thorax forms and posterior structures develop at both ends. The father's alleles arrive too late to help. Legs in place of antennae is the Antennapedia homeotic mutation.
- id: bio-qh-h2-20
  lesson: bio-h-differentiation
  topic: Cell differentiation
  stem: 'When the single gene MyoD was expressed in cultured fibroblasts, the cells began making muscle proteins and fused into muscle fibers. What does this show?'
  choices:
    - 'Fibroblasts had lost their muscle genes and MyoD replaced them.'
    - 'MyoD is a structural protein that forms muscle fibers.'
    - 'Muscle cells are made by fusing fibroblasts with existing muscle cells.'
    - 'A single master transcription factor can switch on the gene program of a cell type.'
  answer: 3
  explanation: |-
    MyoD codes for a transcription factor that turns on muscle genes (and its own gene), so it can switch a cell into the muscle program. The fibroblasts already had the muscle genes; they were simply not expressed. MyoD is not a structural protein, and no existing muscle cells were involved.
- id: bio-qh-h2-21
  lesson: bio-h-differentiation
  topic: Pattern formation
  stem: 'Which observations support the idea that Bicoid acts as a morphogen whose concentration specifies position? Select all that apply.'
  choices:
    - 'Injecting bicoid mRNA into the rear of an egg makes head structures form there.'
    - 'Extra copies of bicoid in the mother shift body boundaries toward the rear.'
    - 'Bicoid protein is present at equal levels in every nucleus.'
    - 'Embryos from mothers lacking bicoid lack head and thorax.'
  answer: [0, 1, 3]
  explanation: |-
    A morphogen should be necessary (loss removes anterior structures), sufficient where added (ectopic mRNA makes a head), and dose-dependent (more Bicoid moves boundaries back). Equal levels everywhere would give no positional information; in fact Bicoid forms a front-to-back gradient.
- id: bio-qh-h2-22
  lesson: bio-h-differentiation
  type: text
  topic: Pattern formation
  stem: 'Hox genes share a 180-base-pair DNA sequence that codes for a DNA-binding region of the protein. This sequence is called the ___.'
  accept: [homeobox, homeo box, homeo-box, homeoboxes]
  explanation: |-
    The homeobox codes for the 60-amino-acid homeodomain, which lets Hox proteins bind DNA and act as transcription factors. Finding it in fly genes led quickly to the Hox genes of vertebrates.
- id: bio-qh-h2-23
  lesson: bio-h-differentiation
  type: match
  topic: Pattern formation
  stem: 'Match each mutation or experiment to its result.'
  pairs:
    - [Antennapedia mutation, Legs grow in place of antennae]
    - [Ultrabithorax-region mutations, A fly with four wings instead of two wings and two halteres]
    - [No bicoid in the mother, Embryos lack head and thorax]
    - [Dorsal lip grafted to the belly side, A second body axis forms]
  distractors: [Every segment of the embryo is missing]
  explanation: |-
    Antennapedia and Ultrabithorax mutations are homeotic: one body part develops as another (antenna as leg; third thoracic segment as a copy of the second). Losing maternal Bicoid removes anterior structures. The dorsal lip graft is the Spemann–Mangold organizer experiment. No single listed mutation removes every segment.
- id: bio-qh-h2-24
  lesson: bio-h-differentiation
  module_quiz: true
  type: order
  topic: Pattern formation
  stem: 'Put the levels of the fruit fly segmentation cascade in order, from the first to act to the last.'
  items: [Maternal genes such as bicoid, Gap genes, Pair-rule genes, Segment polarity genes]
  explanation: |-
    The mother's bicoid mRNA sets up a gradient; gap genes respond with broad blocks of expression; pair-rule genes make seven stripes; segment polarity genes mark the front and back of all 14 segments. Each level reads the one above it, and the pattern gets finer at every step. Hox genes then give each segment its identity.
- id: bio-qh-h2-25
  lesson: bio-h-differentiation
  topic: Pattern formation
  stem: 'A female fly homozygous for a loss-of-function bicoid allele ($bcd/bcd$) was herself born from a $bcd/+$ mother. She mates with a $+/+$ male. What happens to her embryos?'
  choices:
    - 'All develop normally, because they are all $bcd/+$.'
    - 'Half develop normally.'
    - 'All lack head and thorax.'
    - 'She is abnormal herself and cannot lay eggs.'
  answer: 2
  explanation: |-
    For a maternal effect gene, the mother's genotype decides. She makes no Bicoid mRNA, so every egg lacks it, even though every embryo is $bcd/+$. She herself developed normally because her own mother ($bcd/+$) supplied Bicoid. Reasoning from the embryos' own genotypes gives the wrong answer here.
- id: bio-qh-h2-26
  lesson: bio-h-differentiation
  topic: Pattern formation
  stem: 'What does "colinearity" mean for Hox genes?'
  choices:
    - 'All Hox genes are expressed in every segment at the same level.'
    - 'The order of the genes on the chromosome matches the front-to-back order of the body regions where they act.'
    - 'Each Hox gene is located on a different chromosome.'
    - 'Hox genes are transcribed together as one long mRNA.'
  answer: 1
  explanation: |-
    In flies and vertebrates, genes at one end of a Hox cluster act in the head and front of the body and genes at the other end act toward the rear, in the same order. Hox genes in a cluster sit next to each other on one chromosome and are expressed in different regions, each from its own promoter.
- id: bio-qh-h2-27
  lesson: bio-h-differentiation
  type: text
  topic: Cell differentiation
  stem: 'Only cells that have the right receptors and transcription factors can respond to an inducing signal. This ability to respond is called ___.'
  accept: [competence, competency]
  explanation: |-
    Induction needs both a signal and competent responding cells. The same signal can therefore have different effects, or none, in different tissues.

# ---------- Lesson 47: Stem cells, cloning, and regeneration ----------
- id: bio-qh-h2-28
  lesson: bio-h-stem-cells
  module_quiz: true
  topic: Stem cells
  stem: 'A blood stem cell in bone marrow can produce red blood cells, all kinds of white blood cells and platelets, but not neurons or liver cells. Which term describes its potency?'
  choices: ['Totipotent', 'Pluripotent', 'Unipotent', 'Multipotent']
  answer: 3
  explanation: |-
    Making several cell types of one family (the blood cells) is multipotency. Pluripotent cells can make every cell type of the body, totipotent cells also the placenta, and unipotent cells only one type.
- id: bio-qh-h2-29
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'What can a totipotent cell do that a pluripotent cell cannot?'
  choices:
    - 'Divide indefinitely in culture'
    - 'Form tissues of all three germ layers'
    - 'Produce the placenta and other supporting tissues as well as the body'
    - 'Self-renew'
  answer: 2
  explanation: |-
    Pluripotent cells (inner cell mass, embryonic stem cells, iPSCs) can make all three germ layers and can self-renew, and embryonic stem cells divide indefinitely in culture. Only totipotent cells, the zygote and the earliest blastomeres, can also make the trophoblast that forms the placenta.
- id: bio-qh-h2-30
  lesson: bio-h-stem-cells
  module_quiz: true
  topic: Stem cells
  stem: 'Till and McCulloch found that the number of spleen colonies in irradiated mice rose in direct proportion to the number of bone marrow cells injected. Why was this proportionality important?'
  choices:
    - 'It showed that each colony grows from a single cell.'
    - 'It showed that radiation had no effect on the spleen.'
    - 'It showed that every marrow cell is a stem cell.'
    - 'It showed that colonies form only when many cells cooperate.'
  answer: 0
  explanation: |-
    If one cell can start a colony, colonies should scale linearly with cells injected. If several cells had to cooperate, the count would rise faster than linearly at higher doses. Marker studies later confirmed each colony is a clone. Only about 1 in 10,000 injected cells made a colony, so most marrow cells are not stem cells.
- id: bio-qh-h2-31
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Irradiated mice injected with 300,000 marrow cells develop an average of 24 spleen colonies. If only 20% of injected colony-forming cells lodge in the spleen, what is the estimated true number of colony-forming cells per 100,000 marrow cells?'
  choices: ['8', '40', '1.6', '160']
  answer: 1
  explanation: |-
    Detected frequency: $24 \div 3 = 8$ colonies per 100,000 cells. Each detected colony represents $1 \div 0.2 = 5$ injected colony-forming cells, so the true frequency is $8 \times 5 = 40$ per 100,000. 8 forgets the correction; 1.6 multiplies by 0.2 instead of dividing; 160 divides by 0.05.
- id: bio-qh-h2-32
  lesson: bio-h-stem-cells
  module_quiz: true
  topic: Cloning
  stem: 'In the experiment that produced Dolly, 277 eggs were fused with udder cells, 29 embryos were transferred to surrogates, and 1 lamb was born. What is the best explanation for the low success rate?'
  choices:
    - 'Udder cells lack many of the genes needed to build a sheep.'
    - 'The egg cytoplasm only partly erases the donor nucleus''s epigenetic marks, so development often goes wrong.'
    - 'Surrogate ewes reject cloned embryos as foreign.'
    - 'Udder cells contain only half the chromosomes of a zygote.'
  answer: 1
  explanation: |-
    Dolly herself shows the udder-cell nucleus had a complete genome. Failures happen at every stage, before and after transfer, because reprogramming of the donor nucleus's epigenetic marks is incomplete. Udder cells are diploid body cells, and rejection by surrogates does not explain the many failures before transfer.
- id: bio-qh-h2-33
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Takahashi and Yamanaka started with 24 candidate genes that together reprogrammed fibroblasts. How did they find which genes were needed?'
  choices:
    - 'They tested each of the 24 genes alone and kept the one that worked best.'
    - 'They sequenced the fibroblasts'' genomes to find missing genes.'
    - 'They used CRISPR to delete genes from embryonic stem cells.'
    - 'They removed one gene at a time from the mixture and saw which removals stopped colonies from forming.'
  answer: 3
  explanation: |-
    Leaving out one factor at a time revealed which were essential: if colonies disappeared without a gene, that gene was needed. This narrowed the list to four (Oct4, Sox2, Klf4, c-Myc). Single genes alone did not reprogram cells, and the fibroblasts were not missing any genes.
- id: bio-qh-h2-34
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Cells injected under the skin of an immune-deficient mouse form a tumor containing gut-like tissue, cartilage, muscle and nerve tissue. What does this teratoma show about the injected cells?'
  choices:
    - 'They are pluripotent, able to form tissues of all three germ layers.'
    - 'They are unipotent.'
    - 'They are totipotent, because the tumor contains placenta.'
    - 'They came from adult bone marrow.'
  answer: 0
  explanation: |-
    Gut lining is endoderm, cartilage and muscle are mesoderm, and nerve tissue is ectoderm. Forming all three is the teratoma test for pluripotency. Nothing in the tumor is placenta, and bone marrow stem cells are multipotent and do not form teratomas.
- id: bio-qh-h2-35
  lesson: bio-h-stem-cells
  module_quiz: true
  topic: Stem cells
  stem: 'Which statements about induced pluripotent stem cells (iPSCs) are true? Select all that apply.'
  choices:
    - 'They can be made from a patient''s own skin or blood cells.'
    - 'Making them does not require destroying an embryo.'
    - 'They are totipotent and can form a placenta.'
    - 'Leftover undifferentiated iPSCs in a transplant could form tumors.'
    - 'They raise no ethical questions at all.'
  answer: [0, 1, 3]
  explanation: |-
    iPSCs are reprogrammed body cells, so no embryo is used and they can be matched to a patient. Like embryonic stem cells they are pluripotent, not totipotent, and can form teratomas, a safety concern for therapies. They still raise questions about donor consent, genetic privacy and the possibility of making gametes or embryo-like structures.
- id: bio-qh-h2-36
  lesson: bio-h-stem-cells
  type: text
  topic: Stem cells
  stem: 'After a salamander loses a limb, cells near the wound gather into a growing bud that rebuilds the missing part. This bud is called a ___.'
  accept: [blastema, blastemas, blastemata]
  explanation: |-
    The blastema forms from cells that dedifferentiate near the wound. Tracking labeled cells shows they mostly keep a memory of their tissue of origin, so the blastema is a mix of restricted progenitors rather than pluripotent cells.
- id: bio-qh-h2-37
  lesson: bio-h-stem-cells
  type: match
  topic: Cloning
  stem: 'Match each researcher or team to their discovery.'
  pairs:
    - [Till and McCulloch, Spleen colonies proving blood stem cells exist]
    - [Briggs and King, First nuclear transfers producing frog tadpoles]
    - [Wilmut and Campbell, Dolly the sheep cloned from an adult cell]
    - [Yamanaka, Reprogramming body cells with four transcription factors]
  distractors: [Discovery of the organizer in newt embryos]
  explanation: |-
    Till and McCulloch's spleen colonies (1961), Briggs and King's frog nuclear transfers (1952), Wilmut and Campbell's Dolly (born 1996) and Yamanaka's iPSCs (2006) are the milestones of this lesson. The organizer was discovered by Spemann and Mangold (lesson 46).
- id: bio-qh-h2-38
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Planarians were irradiated to kill all their dividing cells, and a single neoblast from another strain was transplanted into each. In some worms, the descendants of that one cell replaced every tissue. What does this show?'
  choices:
    - 'Planarian neurons can divide after irradiation.'
    - 'Every planarian cell is a stem cell.'
    - 'At least some adult planarian neoblasts are pluripotent.'
    - 'Regeneration in planarians does not require cell division.'
  answer: 2
  explanation: |-
    One cell that rebuilds all tissue types must be able to make every cell type: pluripotency, here in an adult animal. The host's own dividing cells were dead, so the new tissue came from the transplant and did require division. Only some neoblasts behave this way, so not every cell is a stem cell.
- id: bio-qh-h2-39
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Researchers label the cartilage cells in an axolotl''s arm with a fluorescent marker, then amputate the arm. In the regrown arm, where would you expect to find most of the labeled cells?'
  choices:
    - 'Spread evenly through muscle, skin, nerve and cartilage'
    - 'Mostly in the new skin'
    - 'Nowhere, because the labeled cells die at the wound'
    - 'Mostly in the new cartilage'
  answer: 3
  explanation: |-
    Lineage tracing in axolotls (2009) showed blastema cells mostly keep a memory of their origin: cartilage-derived cells make cartilage, muscle-derived cells make muscle. An even spread would be expected only if the blastema were pluripotent, which it is not. Cartilage-derived cells do contribute strongly to the regrown limb.
- id: bio-qh-h2-40
  lesson: bio-h-stem-cells
  type: order
  topic: Cloning
  stem: 'Put the steps of reproductive cloning by somatic cell nuclear transfer in order.'
  items:
    - Remove the chromosomes from an unfertilized egg
    - Fuse the egg with a body cell from the animal to be cloned
    - Stimulate the reconstructed egg to start dividing
    - Grow it to an early embryo in culture
    - Transfer the embryo into a surrogate mother
  explanation: |-
    The egg's own chromosomes are removed first, so the body cell's nucleus supplies all the nuclear DNA. After fusion an electric pulse or chemicals start development, the embryo is cultured for a few days, and then it is transferred to a surrogate. Stopping at the cultured embryo to harvest stem cells would be therapeutic cloning.
- id: bio-qh-h2-41
  lesson: bio-h-stem-cells
  topic: Stem cells
  stem: 'Which of these statements is a value claim rather than an empirical claim?'
  choices:
    - 'Human embryos should not be used in research after day 14.'
    - 'Most cloned embryos fail to develop to birth.'
    - 'iPSCs made with c-Myc can form tumors in mice.'
    - 'Human embryonic stem cells were first grown in 1998.'
  answer: 0
  explanation: |-
    "Should not" states what ought to be done, so it is a value claim; evidence about development informs it but cannot settle it alone. The other three can be checked with data or records.

# ---------- Lesson 48: Genomes and evo-devo ----------
- id: bio-qh-h2-42
  lesson: bio-h-genome-evolution
  module_quiz: true
  topic: Genome evolution
  stem: 'What is the C-value paradox?'
  choices:
    - 'Genome size varies enormously among eukaryotes and does not track how complex organisms are.'
    - 'Organisms with more genes always have smaller genomes.'
    - 'Haploid cells have twice as much DNA as diploid cells.'
    - 'Bacteria have larger genomes than most animals.'
  answer: 0
  explanation: |-
    An onion has about five times as much DNA as a human, and a fern about 50 times, with no corresponding difference in complexity or gene number. The explanation is mostly noncoding DNA, especially transposable elements. Bacteria have small genomes, and diploid cells have twice the haploid amount, not half.
- id: bio-qh-h2-43
  lesson: bio-h-genome-evolution
  topic: Genome evolution
  stem: 'Baker''s yeast has about 6,000 protein-coding genes in a 12-million-bp genome. About how many genes per million base pairs is that?'
  choices: ['50', '5,000', '2,000', '500']
  answer: 3
  explanation: |-
    $6{,}000 \div 12 = 500$ genes per million bp, about one gene every 2,000 bp. That is about half the density of E. coli (about 935 per Mb) and nearly 80 times that of humans (about 6.5 per Mb). 50 and 5,000 are decimal-place slips; 2,000 is the number of base pairs per gene, not genes per million base pairs.
- id: bio-qh-h2-44
  lesson: bio-h-genome-evolution
  module_quiz: true
  topic: Genome evolution
  stem: 'How do retrotransposons such as LINE-1 and Alu spread through a genome?'
  choices:
    - 'They cut themselves out of one site and paste themselves into another using transposase.'
    - 'They are transcribed into RNA, and reverse transcriptase makes a DNA copy that inserts at a new site.'
    - 'They are copied only when the whole genome duplicates.'
    - 'They enter cells from outside as viruses in every generation.'
  answer: 1
  explanation: |-
    Retrotransposons "copy and paste" through an RNA intermediate, so each round adds a copy; this is how Alu reached about a million copies. Cut-and-paste with transposase describes DNA transposons, which move without multiplying as fast. Retrotransposons are inherited within the genome, not reinfecting from outside.
- id: bio-qh-h2-45
  lesson: bio-h-genome-evolution
  topic: Genome evolution
  stem: 'A transposable element about 300 bp long makes up 12% of a 3.0-billion-bp genome. About how many copies are there?'
  choices: ['12,000', '120,000', '1.2 million', '360 million']
  answer: 2
  explanation: |-
    Total element DNA: $0.12 \times 3.0 \times 10^9 = 3.6 \times 10^8$ bp. Copies: $3.6 \times 10^8 \div 300 = 1.2 \times 10^6$. The smaller answers drop powers of ten, and 360 million is the number of base pairs of element DNA, not the number of copies.
- id: bio-qh-h2-46
  lesson: bio-h-genome-evolution
  type: text
  topic: Genome evolution
  stem: 'A copy of a gene that has been disabled by mutations, so it no longer makes a working product, is called a ___.'
  accept: [pseudogene, pseudogenes, pseudo-gene]
  explanation: |-
    After duplication, the most common fate of an extra copy is to collect disabling mutations and become a pseudogene. Humans have over 10,000 of them, including many in the smell-receptor and globin families.
- id: bio-qh-h2-47
  lesson: bio-h-genome-evolution
  type: match
  topic: Genome evolution
  stem: 'Match each term to its description.'
  pairs:
    - [Paralogs, Genes related by duplication within a lineage]
    - [Orthologs, Genes in different species descended from one ancestral gene by speciation]
    - [Neofunctionalization, One duplicate gains a new function]
    - [Subfunctionalization, Duplicates divide the original gene's jobs between them]
  distractors: [A gene moved by a virus between species]
  explanation: |-
    Human α- and β-globin are paralogs; human and mouse β-globin are orthologs. Red and green opsins in primates are an example of neofunctionalization; duplicates expressed at different stages or in different tissues often show subfunctionalization. Gene transfer between species by a virus is horizontal transfer, not one of these terms.
- id: bio-qh-h2-48
  lesson: bio-h-genome-evolution
  module_quiz: true
  topic: Genome evolution
  stem: 'Which pair of genes are paralogs?'
  choices:
    - 'Human β-globin and chimpanzee β-globin'
    - 'Human α-globin and human β-globin'
    - 'Mouse Pax6 and fly eyeless'
    - 'Human β-globin and mouse β-globin'
  answer: 1
  explanation: |-
    α- and β-globin arose by a duplication within the vertebrate lineage and now sit side by side in the same genome: paralogs. The other pairs are genes in different species descended from one ancestral gene through speciation: orthologs.
- id: bio-qh-h2-49
  lesson: bio-h-genome-evolution
  topic: Genome evolution
  stem: 'Duplications in the β-globin gene cluster produced chains used at different stages of life. What is the advantage of fetal hemoglobin?'
  choices:
    - 'It carries carbon dioxide instead of oxygen.'
    - 'It binds oxygen more tightly than adult hemoglobin, so the fetus can take oxygen from the mother''s blood.'
    - 'It binds oxygen less tightly, so it releases oxygen to the mother.'
    - 'It does not need iron.'
  answer: 1
  explanation: |-
    Higher oxygen affinity lets fetal blood pull oxygen across the placenta from maternal blood. Lower affinity would send oxygen the wrong way. Fetal hemoglobin carries oxygen with iron-containing heme like adult hemoglobin. Expressing different duplicates at different stages is an example of how gene copies divide up roles.
- id: bio-qh-h2-50
  lesson: bio-h-genome-evolution
  module_quiz: true
  topic: Evo-devo
  stem: 'When the mouse Pax6 gene was switched on in the leg tissue of a fruit fly, extra eyes grew on the leg. What kind of eyes were they, and what does this show?'
  choices:
    - 'Mouse camera eyes, showing the mouse gene carries instructions for building a vertebrate eye.'
    - 'Fly compound eyes, showing the mouse gene switched on the fly''s own eye-building program (deep homology).'
    - 'Fly compound eyes, showing that fly and mouse eyes are homologous structures.'
    - 'No real eyes, only pigment, showing the genes are unrelated.'
  answer: 1
  explanation: |-
    The mouse protein acted as a master switch for the fly's own eye genes, so the eyes were fly compound eyes. Different eye structures built under the control of genes inherited from a common ancestor is deep homology. The eyes themselves are not considered homologous structures; their shared control gene is.
- id: bio-qh-h2-51
  lesson: bio-h-genome-evolution
  topic: Evo-devo
  stem: 'Many lake populations of three-spined sticklebacks have lost their pelvic spines. What did researchers find about the Pitx1 gene in these fish?'
  choices:
    - 'The Pitx1 gene has been deleted from the genome.'
    - 'The Pitx1 protein has a nonsense mutation.'
    - 'The Pitx1 protein is unchanged, but the gene is no longer expressed in the developing pelvis.'
    - 'Pitx1 is expressed at higher levels in every tissue.'
  answer: 2
  explanation: |-
    Lake fish make normal Pitx1 protein in the jaw, pituitary and other tissues; only pelvic expression is missing, because a pelvic enhancer was deleted. Losing the whole gene or protein would also disrupt its other jobs, which in mice is lethal.
- id: bio-qh-h2-52
  lesson: bio-h-genome-evolution
  module_quiz: true
  topic: Evo-devo
  stem: 'Which findings support the conclusion that pelvic loss in lake sticklebacks was caused by a cis-regulatory change? Select all that apply.'
  choices:
    - 'Independent lake populations carry deletions of a Pitx1 enhancer.'
    - 'Adding back a working pelvic enhancer restored pelvic structures in lake fish.'
    - 'Lake fish have no Pitx1 gene at all.'
    - 'Pitx1 expression in the jaw and pituitary is normal in lake fish.'
  answer: [0, 1, 3]
  explanation: |-
    The gene and protein are intact and still used elsewhere; what is missing is one tissue-specific switch on the same DNA. Deletions of that switch, and rescue by restoring it, point directly to a cis-regulatory change. The statement that lake fish lack the gene is false.
- id: bio-qh-h2-53
  lesson: bio-h-genome-evolution
  topic: Evo-devo
  stem: 'In a hybrid between an ocean and a lake stickleback, only the ocean allele of Pitx1 is expressed in the pelvic region. What does this suggest?'
  choices:
    - 'The difference lies in a regulatory protein encoded by another gene.'
    - 'The lake allele''s protein-coding sequence is broken.'
    - 'The hybrid lost the lake allele during development.'
    - 'The difference lies in DNA linked to the lake allele itself, such as its enhancer.'
  answer: 3
  explanation: |-
    In a hybrid both alleles share the same cell and the same regulatory proteins. If the difference were in a separate (trans) regulator, the ocean version would switch on both alleles. Expression from only one allele means the difference travels with that allele: a cis change. Whether a protein works does not determine whether its mRNA is made.
- id: bio-qh-h2-54
  lesson: bio-h-genome-evolution
  type: order
  topic: Genome evolution
  stem: 'Put these genomes in order of size, smallest first.'
  items: [E. coli, Baker's yeast, Human, Onion, Fork fern Tmesipteris]
  explanation: |-
    About 4.6 million bp for E. coli, 12 million for yeast, 3.1 billion for humans, 16 billion for onion and about 160 billion for the fern. The onion and fern placements are the C-value paradox in action.
- id: bio-qh-h2-55
  lesson: bio-h-genome-evolution
  topic: Genome evolution
  stem: 'Which statement best reflects current evidence about the noncoding DNA in the human genome?'
  choices:
    - 'All of it is functional, because about 80% shows some biochemical activity.'
    - 'None of it has a function; only protein-coding genes matter.'
    - 'More is functional than the 1.5% that codes for protein, but evolutionary conservation suggests much of it is not under selection.'
    - 'It is made entirely of active transposons.'
  answer: 2
  explanation: |-
    Regulatory elements, RNA genes and other noncoding sequences clearly have functions, but only about 10% of the genome appears to be conserved by selection. Biochemical activity (as reported by ENCODE) is not the same as function. Transposable-element-derived DNA is about 45% of the genome, and almost all copies are inactive.
