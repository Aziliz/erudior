- id: bio-q-0401
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Cell cycle
  stem: 'During which phase of the cell cycle is the DNA replicated?'
  choices: ['Prophase', 'G1 phase', 'Anaphase', 'S phase']
  answer: 3
  explanation: |-
    DNA is copied in the S (synthesis) phase of interphase, before mitosis begins. By prophase the chromosomes already consist of two sister chromatids. G1 is growth before copying; anaphase is when the copies separate.
- id: bio-q-0402
  lesson: bio-cell-cycle
  topic: Cell cycle
  stem: 'Which statement best describes interphase?'
  choices:
    - 'The cell rests and carries out almost no activity until it divides.'
    - 'The nucleus divides and the chromosomes separate.'
    - 'The cell grows, carries out its normal functions, and replicates its DNA.'
    - 'The cytoplasm divides to form two daughter cells.'
  answer: 2
  explanation: |-
    Interphase (G1, S, G2) is the busiest part of the cycle: growth, normal work, and DNA replication. Calling it a resting phase is a common misconception. Dividing the nucleus is mitosis, and dividing the cytoplasm is cytokinesis.
- id: bio-q-0403
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Mitosis
  stem: 'A cell has 12 chromosomes in G1. How many chromosomes and chromatids does it have in G2?'
  choices:
    - '24 chromosomes and 24 chromatids'
    - '12 chromosomes and 24 chromatids'
    - '12 chromosomes and 12 chromatids'
    - '6 chromosomes and 12 chromatids'
  answer: 1
  explanation: |-
    After S phase each chromosome has two sister chromatids joined at one centromere. It is still one chromosome, so the count stays 12, with 24 chromatids. Counting chromatids as chromosomes gives 24; halving is what meiosis does, not interphase.
- id: bio-q-0404
  lesson: bio-cell-cycle
  topic: Mitosis
  stem: 'A human body cell (46 chromosomes) is in anaphase of mitosis. How many chromosomes are in the whole cell at this moment?'
  choices: ['92', '46', '23', '184']
  answer: 0
  explanation: |-
    In anaphase the 46 pairs of sister chromatids separate, and each chromatid now counts as a chromosome: 92 in the cell, 46 moving to each pole. After cytokinesis each daughter cell has 46.
- id: bio-q-0405
  lesson: bio-cell-cycle
  topic: Mitosis
  stem: 'Chromosomes are lined up along the middle of the cell, each attached to spindle fibers from both poles. Which stage is this?'
  choices: ['Prophase', 'Anaphase', 'Telophase', 'Metaphase']
  answer: 3
  explanation: |-
    Lining up at the middle (the metaphase plate) defines metaphase. In prophase the chromosomes are still condensing, in anaphase the chromatids are moving apart, and in telophase they have reached the poles.
- id: bio-q-0406
  lesson: bio-cell-cycle
  topic: Mitosis
  stem: 'Which sequence lists the stages of mitosis in order?'
  choices:
    - 'Metaphase, prophase, anaphase, telophase'
    - 'Prophase, metaphase, anaphase, telophase'
    - 'Prophase, anaphase, metaphase, telophase'
    - 'Interphase, prophase, telophase, anaphase'
  answer: 1
  explanation: |-
    Chromosomes condense (prophase), line up (metaphase), separate (anaphase), and arrive at the poles as new nuclei form (telophase). Interphase is not part of mitosis.
- id: bio-q-0407
  lesson: bio-cell-cycle
  topic: Mitosis
  stem: 'Why do plant cells form a cell plate during cytokinesis instead of a cleavage furrow?'
  choices:
    - 'Plant cells do not have a cell membrane to pinch.'
    - 'Plant cells divide only by binary fission.'
    - 'Their rigid cell wall prevents the cell from pinching in two.'
    - 'The cell plate is needed to separate the sister chromatids.'
  answer: 2
  explanation: |-
    A plant cell is enclosed by a stiff wall, so it builds a new wall from the middle outward instead of pinching. Plant cells do have membranes, binary fission is the prokaryote process, and the chromatids are already separated in anaphase.
- id: bio-q-0408
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Mitosis
  stem: 'In a root tip sample of 300 cells, 24 are in some stage of mitosis. What is the mitotic index?'
  choices: ['8%', '24%', '8.7%', '92%']
  answer: 0
  explanation: |-
    Mitotic index = 24 ÷ 300 × 100% = 8%. Dividing by the 276 non-dividing cells gives 8.7%; 92% is the share in interphase; 24% treats the count as a percent.
- id: bio-q-0409
  lesson: bio-cell-cycle
  topic: Cell cycle
  stem: 'In an unsynchronized sample of 400 cells, 20 are in metaphase. The full cell cycle takes 20 hours. About how long does metaphase last?'
  choices: ['20 minutes', '5 minutes', '60 minutes', '6 hours']
  answer: 2
  explanation: |-
    The fraction of cells in a stage equals the fraction of time spent in it: 20 ÷ 400 = 0.05, and 0.05 × 20 h = 1 h = 60 minutes.
- id: bio-q-0410
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Mitosis
  stem: 'Compared with the parent cell, the two daughter cells produced by mitosis are'
  choices:
    - 'genetically identical, with the same number of chromosomes'
    - 'genetically identical, with half the number of chromosomes'
    - 'genetically different, with the same number of chromosomes'
    - 'genetically different, with half the number of chromosomes'
  answer: 0
  explanation: |-
    Mitosis gives each daughter cell one copy of every chromosome, so they match the parent in number and genes (apart from rare copying errors). Halving the number and creating genetic differences are features of meiosis.
- id: bio-q-0411
  lesson: bio-cell-cycle
  topic: Cell cycle
  stem: 'A graph of DNA content per cell shows the amount rising steadily from 1 unit to 2 units over several hours, then staying at 2 until it suddenly drops back to 1. The rising section corresponds to'
  choices: ['G1 phase', 'S phase', 'Anaphase', 'Cytokinesis']
  answer: 1
  explanation: |-
    DNA content doubles gradually as it is replicated in S phase. G1 holds steady at 1 unit, and the sudden drop back to 1 is cell division (cytokinesis), when the DNA is split between two cells.
- id: bio-q-0412
  lesson: bio-cell-cycle
  topic: Mitosis
  stem: 'In onion roots, the mitotic index is 15% in the region just behind the tip and 2% in a region farther back. Which conclusion is best supported?'
  choices:
    - 'Cells near the tip spend more time in interphase.'
    - 'Cells farther back have more chromosomes.'
    - 'Mitosis takes longer in cells farther back.'
    - 'Cells near the tip are dividing much more actively.'
  answer: 3
  explanation: |-
    A higher mitotic index means a larger share of cells are dividing, as expected in the growth zone near a root tip. More time in interphase would lower the index. The index says nothing about chromosome number, and a slower mitosis would raise the index, not lower it.
- id: bio-q-0413
  lesson: bio-cancer
  module_quiz: true
  topic: Cell cycle regulation
  stem: 'What does the spindle (metaphase) checkpoint check before allowing anaphase to begin?'
  choices:
    - 'That the cell has grown large enough to divide'
    - 'That the DNA has been replicated'
    - 'That every chromosome is attached to spindle fibers from both poles'
    - 'That growth factors are present outside the cell'
  answer: 2
  explanation: |-
    The spindle checkpoint delays anaphase until all chromosomes are correctly attached, so each daughter gets one copy of each. Cell size and growth factors are checked at G1, and completion of DNA replication at G2.
- id: bio-q-0414
  lesson: bio-cancer
  topic: Cell cycle regulation
  stem: 'When a cell in S phase was fused with a cell in G1, the G1 nucleus began replicating its DNA early. Which conclusion is best supported?'
  choices:
    - 'DNA can be copied only when two nuclei share one cell.'
    - 'The cytoplasm of the S-phase cell contains signals that trigger DNA replication.'
    - 'The G1 nucleus had already finished G1 before the fusion.'
    - 'Cell fusion damages DNA, which triggers replication.'
  answer: 1
  explanation: |-
    The G1 nucleus was pushed into S phase ahead of schedule by something in the S-phase cell, pointing to chemical signals in the cytoplasm (later identified as cyclin–CDK complexes). Single-nucleus cells copy DNA normally, and damage halts the cycle rather than speeding it up.
- id: bio-q-0415
  lesson: bio-cancer
  topic: Cell cycle regulation
  stem: 'How do cyclins and cyclin-dependent kinases (CDKs) behave during the cell cycle?'
  choices:
    - 'CDK levels rise and fall; cyclins stay constant and are always active.'
    - 'Both are made only during mitosis and destroyed during interphase.'
    - 'Cyclins are made once in the life of a cell and never broken down.'
    - 'Cyclin levels rise and fall; CDKs stay fairly constant but are active only when bound to cyclin.'
  answer: 3
  explanation: |-
    Cyclins are made and destroyed each cycle (hence the name). CDKs are present all the time but act only when a cyclin binds; destroying the cyclin switches the CDK off. This rise and fall times the transitions of the cycle.
- id: bio-q-0416
  lesson: bio-cancer
  module_quiz: true
  topic: Cancer
  stem: 'A mutation leaves the RAS protein, which relays "divide" signals from growth factors, permanently switched on. This mutation has changed'
  choices:
    - 'a proto-oncogene into an oncogene'
    - 'a tumor suppressor gene into an oncogene'
    - 'an oncogene into a proto-oncogene'
    - 'a proto-oncogene into a tumor suppressor gene'
  answer: 0
  explanation: |-
    RAS is a normal gas-pedal gene (a proto-oncogene). An overactive, stuck-on version is an oncogene, and one mutated copy is enough. Tumor suppressor genes are brakes, and cancer involves their loss, not their creation.
- id: bio-q-0417
  lesson: bio-cancer
  topic: Cancer
  stem: 'Cells that have lost both working copies of the p53 gene are exposed to DNA-damaging radiation. What is the most likely result, compared with normal cells?'
  choices:
    - 'The cells repair their DNA faster than normal cells.'
    - 'The cells stop dividing permanently and enter G0.'
    - 'Damaged cells keep dividing and pass on mutations instead of stopping or undergoing apoptosis.'
    - 'The cells are unaffected because p53 only works during mitosis.'
  answer: 2
  explanation: |-
    p53 halts the cycle at G1 when DNA is damaged and triggers apoptosis if repair fails. Without it, damaged cells keep dividing and mutations accumulate, which is why p53 is mutated in about half of human cancers.
- id: bio-q-0418
  lesson: bio-cancer
  topic: Cancer
  stem: 'Children with inherited retinoblastoma often develop tumors in both eyes at a young age. Knudson''s two-hit explanation is that these children'
  choices:
    - 'inherit one damaged copy of a tumor suppressor gene, so a single new mutation in a cell is enough'
    - 'inherit two damaged copies of an oncogene, so no new mutations are needed'
    - 'inherit an oncogene that only becomes active in the eyes'
    - 'are exposed to more ultraviolet light than other children'
  answer: 0
  explanation: |-
    Both copies of the RB tumor suppressor gene must be lost. Inherited cases start with one bad copy in every cell, so one more hit in any retinal cell is enough, making tumors earlier and more numerous. Non-inherited cases need two hits in the same cell.
- id: bio-q-0419
  lesson: bio-cancer
  module_quiz: true
  topic: Cancer
  stem: 'Which feature distinguishes a malignant tumor from a benign tumor?'
  choices:
    - 'Its cells divide more than normal cells.'
    - 'It forms a mass of abnormal cells.'
    - 'It begins from a single abnormal cell.'
    - 'Its cells can invade nearby tissue and spread to other parts of the body.'
  answer: 3
  explanation: |-
    Both kinds of tumor are masses of abnormally dividing cells that started from one cell. Only malignant tumors invade and metastasize, and metastasis causes most cancer deaths.
- id: bio-q-0420
  lesson: bio-cancer
  topic: Cancer
  stem: 'Starting from one cell, about how many cells are there after 20 doublings?'
  choices: ['40', 'About 1 million', '400', 'About 1 billion']
  answer: 1
  explanation: |-
    2²⁰ = 1,048,576, about a million. Since 2¹⁰ ≈ 1000, 20 doublings give about 1000 × 1000. 40 is 2 × 20 (adding instead of multiplying), and about a billion takes 30 doublings.
- id: bio-q-0421
  lesson: bio-cancer
  topic: Cancer
  stem: 'Tumor cells in a dish increase from 500 to 8,000 in 48 hours. What is their doubling time?'
  choices: ['12 hours', '16 hours', '3 hours', '6 hours']
  answer: 0
  explanation: |-
    8000 ÷ 500 = 16 = 2⁴, so there were 4 doublings, and 48 ÷ 4 = 12 hours. Using 16 as the number of doublings gives 3 hours; 16 hours assumes 3 doublings.
- id: bio-q-0422
  lesson: bio-cancer
  topic: Cancer
  stem: 'Why does the risk of most cancers increase with age?'
  choices:
    - 'Older cells stop having checkpoints entirely.'
    - 'Cancer is caused by a single mutation that appears at a set age.'
    - 'Several mutations must build up in the same cell line, and that takes time.'
    - 'Older people have more cells, so each cell divides faster.'
  answer: 2
  explanation: |-
    Most cancers need multiple mutations in proto-oncogenes and tumor suppressor genes, so the chance that one cell has collected enough rises the longer we live. A single mutation is almost never enough, and checkpoints do not simply switch off with age.
- id: bio-q-0423
  lesson: bio-cancer
  module_quiz: true
  topic: Stem cells
  stem: 'Which statement about stem cells is correct?'
  choices:
    - 'Adult stem cells are pluripotent, while embryonic stem cells are multipotent.'
    - 'Embryonic stem cells are pluripotent, while most adult stem cells are multipotent.'
    - 'Stem cells cannot divide; they only differentiate.'
    - 'Induced pluripotent stem cells are taken directly from early embryos.'
  answer: 1
  explanation: |-
    Embryonic stem cells can become any body cell type (pluripotent); adult stem cells, such as blood stem cells, make a limited range (multipotent). Stem cells self-renew by dividing. iPSCs are reprogrammed body cells, such as skin cells, which is why they avoid using embryos.
- id: bio-q-0424
  lesson: bio-cancer
  topic: Cancer
  stem: 'Chemotherapy often causes hair loss and damage to the lining of the gut. Why?'
  choices:
    - 'Cancer cells move into the hair follicles and gut during treatment.'
    - 'The drugs act only on cells in G0.'
    - 'Hair and gut cells are the source of most cancers.'
    - 'Many chemotherapy drugs target rapidly dividing cells, including normal ones.'
  answer: 3
  explanation: |-
    Hair follicles and the gut lining divide rapidly, like cancer cells, so drugs that attack dividing cells harm them too. Cells in G0 are not dividing, so they are largely spared.
- id: bio-q-0425
  lesson: bio-cancer
  topic: Cell cycle regulation
  stem: 'Mature nerve cells in the brain almost never divide. In which part of the cell cycle do they remain?'
  choices: ['S phase', 'G2', 'G0', 'Metaphase']
  answer: 2
  explanation: |-
    Cells that leave the cycle after G1 and stop dividing are in G0. They are fully active, just not dividing. S, G2 and metaphase are all stages on the way to division.
- id: bio-q-0426
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  stem: 'Human body cells have 46 chromosomes. How many chromosomes does a normal human egg cell have?'
  choices: ['23', '46', '92', '22']
  answer: 0
  explanation: |-
    Gametes are haploid: n = 23, one from each homologous pair. Fertilization restores 2n = 46. 22 is the number of autosomes in a gamete, leaving out the sex chromosome.
- id: bio-q-0427
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'How do homologous chromosomes differ from sister chromatids?'
  choices:
    - 'Homologs are identical copies; sister chromatids come from different parents.'
    - 'Homologs carry different genes; sister chromatids carry the same genes.'
    - 'There is no difference; the terms mean the same thing.'
    - 'Homologs come from different parents and may carry different versions of genes; sister chromatids are identical copies.'
  answer: 3
  explanation: |-
    One homolog came from each parent; they carry the same genes in the same order but possibly different versions. Sister chromatids are made by copying one chromosome in S phase, so they are identical (before crossing over).
- id: bio-q-0428
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  stem: 'What separates during anaphase I of meiosis?'
  choices:
    - 'Sister chromatids, while homologous chromosomes stay together'
    - 'Homologous chromosomes, while sister chromatids stay together'
    - 'Both homologous chromosomes and sister chromatids'
    - 'Nothing; the cell divides without separating chromosomes'
  answer: 1
  explanation: |-
    Anaphase I pulls homologs to opposite poles; sister chromatids stay joined until anaphase II. This is what halves the chromosome number, and it is the key difference from mitosis, where sister chromatids separate.
- id: bio-q-0429
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'During which stage does crossing over occur?'
  choices: ['Prophase I', 'Metaphase II', 'Anaphase I', 'Telophase II']
  answer: 0
  explanation: |-
    Crossing over happens when homologs are paired closely along their length, which is in prophase I. By anaphase I they are already separating, and in meiosis II homologs are no longer together.
- id: bio-q-0430
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'A species has 2n = 10. Ignoring crossing over, how many genetically different gametes can independent assortment produce?'
  choices: ['10', '25', '32', '1024']
  answer: 2
  explanation: |-
    There are n = 5 pairs, each able to line up 2 ways: 2⁵ = 32. 10 is 2 × 5 (multiplying instead of raising 2 to the 5th power); 25 is 5²; 1024 is 2¹⁰, using 2n instead of n.
- id: bio-q-0431
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  stem: 'A fruit fly has 2n = 8. Ignoring crossing over, how many different chromosome combinations are possible in a zygote produced by two flies?'
  choices: ['16', '64', '32', '256']
  answer: 3
  explanation: |-
    Each parent can make 2⁴ = 16 kinds of gametes, and any egg can meet any sperm: 16 × 16 = 256. 16 counts gametes from one parent only; 64 is 8 × 8 (using 2n = 8 as the number of gamete types), and 32 adds 16 + 16 instead of multiplying.
- id: bio-q-0432
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'A cell with 2n = 20 completes meiosis I. What does each resulting cell contain?'
  choices:
    - '10 chromosomes, each made of 1 chromatid'
    - '10 chromosomes, each made of 2 chromatids'
    - '20 chromosomes, each made of 2 chromatids'
    - '20 chromosomes, each made of 1 chromatid'
  answer: 1
  explanation: |-
    Meiosis I separates homologs, halving the number to 10, but the sister chromatids stay together until meiosis II. There is no DNA replication between the two divisions, so the gametes end up with 10 single-chromatid chromosomes.
- id: bio-q-0433
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'One homologous pair fails to separate in meiosis I, but meiosis II is normal. What are the four gametes?'
  choices:
    - 'Two with an extra chromosome (n + 1) and two missing one (n − 1)'
    - 'Two normal, one n + 1, and one n − 1'
    - 'All four normal'
    - 'Four with an extra chromosome (n + 1)'
  answer: 0
  explanation: |-
    Both homologs go to one cell in meiosis I, so that cell's two products each get an extra copy and the other cell's two products each lack it. Nondisjunction in meiosis II instead gives two normal gametes, one n + 1 and one n − 1.
- id: bio-q-0434
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'Which is true of meiosis but not of mitosis?'
  choices:
    - 'Sister chromatids separate at an anaphase.'
    - 'The DNA is replicated beforehand, during S phase.'
    - 'A spindle moves the chromosomes.'
    - 'Homologous chromosomes pair up and exchange segments.'
  answer: 3
  explanation: |-
    Pairing of homologs (synapsis) and crossing over happen only in prophase I of meiosis. Sister chromatids separate in mitosis and in meiosis II, DNA replicates before both, and both use a spindle.
- id: bio-q-0435
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'Van Beneden found that in a roundworm, the egg nucleus and sperm nucleus each contributed 2 chromosomes and the fertilized egg had 4. What did this support?'
  choices:
    - 'Sperm contribute more chromosomes than eggs.'
    - 'Chromosome number doubles in every generation.'
    - 'Gametes carry half the chromosome number of body cells.'
    - 'Only the egg passes chromosomes to the offspring.'
  answer: 2
  explanation: |-
    Each gamete brought half of the zygote's number, and the two halves added up to the body-cell number. This pointed to a reduction division (meiosis) that keeps the chromosome number constant across generations.
- id: bio-q-0436
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  stem: 'Trisomy 21 (Down syndrome) usually results from'
  choices:
    - 'crossing over between chromosome 21 and its homolog'
    - 'nondisjunction, producing a gamete with an extra chromosome 21'
    - 'a mutation in a single gene on chromosome 21'
    - 'a gamete that is missing chromosome 21'
  answer: 1
  explanation: |-
    If chromosome 21 fails to separate in meiosis, a gamete gets two copies; after fertilization the zygote has three (47 chromosomes). Crossing over is normal and does not change chromosome number, and a missing chromosome would give 45, not 47.
- id: bio-q-0437
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'How does meiosis in females differ from meiosis in males?'
  choices:
    - 'Females make four eggs per meiosis; males make one sperm.'
    - 'Females skip meiosis II, so eggs are diploid.'
    - 'Only males use crossing over during meiosis.'
    - 'Females make one egg and small polar bodies per meiosis; males make four sperm.'
  answer: 3
  explanation: |-
    Unequal division of the cytoplasm gives one large egg (keeping stored nutrients) plus polar bodies that break down, while each male meiosis gives four sperm. Both sexes complete both divisions, and crossing over happens in both.
- id: bio-q-0438
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Mitosis
  type: label
  stem: 'Each numbered animal cell is at a different stage of mitosis. Name the stage of each cell.'
  image: {src: images/m4-mitosis-q.svg, alt: 'Four animal cells, each with four chromosomes, at different stages of division, shown in mixed order. Cell 1 is long with single chromatids near both ends; cell 2 has condensed chromosomes inside a dashed nuclear outline; cell 3 is pinching in two with a nucleus in each half; cell 4 has chromosomes in a column at its middle with spindle fibers from both ends.'}
  labels:
    - {x: 6, y: 8, text: Anaphase}
    - {x: 56, y: 8, text: Prophase}
    - {x: 6, y: 58, text: Telophase}
    - {x: 56, y: 58, text: Metaphase}
  distractors: [Interphase]
  explanation: |-
    Cell 1: single chromatids are being pulled toward opposite poles, so the sisters have separated: anaphase. Cell 2: the chromosomes are condensed and doubled, the nuclear envelope (dashed) is breaking down, and the spindle poles are just moving apart: prophase. Cell 3: two new nuclei with uncoiling chromosomes in a cell that is pinching in two: telophase with cytokinesis. Cell 4: duplicated chromosomes lined up at the middle, attached to fibers from both poles: metaphase. Interphase cells show no condensed chromosomes at all.
- id: bio-q-0439
  lesson: bio-cell-cycle
  topic: Cell cycle
  type: order
  stem: 'Starting just after a cell forms, put these parts of the cell cycle in order.'
  items: [G1, S phase, G2, Prophase, Metaphase, Anaphase, Telophase]
  explanation: |-
    Interphase comes first: G1 (growth), S (DNA copied), G2 (preparation). Then mitosis: prophase (condense, spindle forms), metaphase (line up), anaphase (chromatids separate), telophase (nuclei re-form), with cytokinesis overlapping telophase.
- id: bio-q-0440
  lesson: bio-cell-cycle
  topic: Cell cycle
  type: text
  stem: 'After S phase, each chromosome consists of two identical ___ joined at a constricted region called the ___.'
  accept:
    - [sister chromatids, chromatids, sister chromatid, chromatid]
    - [centromere, centromeres]
  explanation: |-
    Copying the DNA in S phase turns each chromosome into two identical sister chromatids, held together most tightly at the centromere. It still counts as one chromosome until the chromatids separate in anaphase.
- id: bio-q-0441
  lesson: bio-cell-cycle
  module_quiz: true
  topic: Cell cycle
  stem: 'Which of these happen during interphase? Select all that apply.'
  choices:
    - 'The DNA is replicated.'
    - 'The cell grows and makes proteins and organelles.'
    - 'Sister chromatids separate.'
    - 'The cell makes proteins it will need for the spindle.'
    - 'The nuclear envelope breaks down.'
  answer: [0, 1, 3]
  explanation: |-
    Interphase includes G1 (growth), S (DNA replication) and G2 (making proteins for division, such as spindle components). Sister chromatids separate in anaphase and the nuclear envelope breaks down in prophase, both during mitosis.
- id: bio-q-0442
  lesson: bio-cell-cycle
  topic: Mitosis
  type: match
  stem: 'Match each stage to what happens in it.'
  pairs:
    - [Prophase, Chromosomes condense and the spindle forms]
    - [Metaphase, Chromosomes line up at the middle of the cell]
    - [Anaphase, Sister chromatids move to opposite poles]
    - [Telophase, Nuclear envelopes re-form around two sets of chromosomes]
    - [Cytokinesis, The cytoplasm divides into two cells]
  distractors: [The DNA is copied]
  explanation: |-
    The four stages of mitosis divide the nucleus: condense (prophase), line up (metaphase), separate (anaphase), re-form nuclei (telophase). Cytokinesis then divides the cytoplasm. DNA copying belongs to S phase of interphase, not to any stage of mitosis.
- id: bio-q-0443
  lesson: bio-cancer
  module_quiz: true
  topic: Cancer
  type: label
  stem: 'The drawing shows a layer of tissue, a blood vessel and a distant organ. Name each numbered part.'
  image: {src: images/m4-tumor-spread-q.svg, alt: 'A cross-section of tissue: a single layer of cells on a thin membrane, a dome of extra cells in the middle of the layer, a cluster of irregular cells on the right breaking through the membrane into the tissue below, a blood vessel with one irregular cell inside it, and a separate organ containing a small cluster of irregular cells.'}
  labels:
    - {x: 17, y: 21, text: Normal tissue}
    - {x: 46, y: 7, text: Benign tumor}
    - {x: 75, y: 46, text: Cancer cells invading nearby tissue}
    - {x: 84, y: 58, text: Cancer cell traveling in the blood}
    - {x: 71, y: 88, text: Secondary tumor (metastasis)}
  distractors: [Stem cells repairing the tissue]
  explanation: |-
    1 is the orderly normal layer. 2 is a mass of extra cells that stays above the basement membrane: a benign tumor. 3 shows malignant cells that have broken through the membrane and are invading the tissue below. 4 is a cancer cell carried in the blood, and 5 is a new tumor it seeded in a distant organ, which is metastasis.
- id: bio-q-0444
  lesson: bio-cancer
  topic: Cell cycle regulation
  type: match
  stem: 'Match each checkpoint to what it checks.'
  pairs:
    - [G1 checkpoint, 'Cell size, growth signals and DNA damage']
    - [G2 checkpoint, DNA copied completely and correctly]
    - [Spindle checkpoint, Every chromosome attached to fibers from both poles]
  distractors: [Nuclear envelopes re-formed around both sets]
  explanation: |-
    The G1 checkpoint decides whether to divide at all (size, nutrients, growth factors, DNA damage). The G2 checkpoint makes sure replication is complete and correct before mitosis. The spindle checkpoint holds anaphase until every chromosome is attached to both poles. No checkpoint waits on nuclear envelopes re-forming.
- id: bio-q-0445
  lesson: bio-cancer
  module_quiz: true
  topic: Cancer
  stem: 'Which statements describe tumor suppressor genes? Select all that apply.'
  choices:
    - 'Their normal proteins slow division, repair DNA or trigger apoptosis.'
    - 'p53 and RB are examples.'
    - 'One overactive mutant copy is enough to push a cell toward cancer.'
    - 'Inheriting one faulty copy can raise a person''s cancer risk.'
    - 'They are genes that viruses insert into cells.'
  answer: [0, 1, 3]
  explanation: |-
    Tumor suppressors are the brakes (p53, RB). Usually both copies must be lost in a cell, but inheriting one faulty copy means only one more hit is needed, as in inherited retinoblastoma. A single overactive copy describes an oncogene, and tumor suppressors are normal cell genes, not viral ones.
- id: bio-q-0446
  lesson: bio-cancer
  topic: Cell cycle regulation
  type: text
  stem: 'Orderly, programmed cell death that removes damaged or unneeded cells without causing inflammation is called ___.'
  accept: [apoptosis]
  explanation: |-
    Apoptosis is a tidy self-destruction: the cell dismantles itself and is eaten by neighbors. It removes cells with unrepairable DNA damage and sculpts the body during development, such as removing the webbing between fingers.
- id: bio-q-0447
  lesson: bio-cancer
  topic: Stem cells
  type: match
  stem: 'Match each cell to its potency. (Answers can be used more than once.)'
  pairs:
    - [Zygote, Totipotent]
    - [Embryonic stem cell, Pluripotent]
    - [Induced pluripotent stem cell, Pluripotent]
    - [Blood stem cell in bone marrow, Multipotent]
  distractors: [Unable to divide]
  explanation: |-
    The zygote can make every cell type including the placenta (totipotent). Embryonic stem cells and iPSCs can make every body cell type (pluripotent). Blood stem cells make only the related blood cell types (multipotent). All of these can divide.
- id: bio-q-0448
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  type: label
  stem: 'All four cells come from an organism with 2n = 4. Red marks chromosomes from the mother and blue from the father. Name the stage of each numbered cell.'
  image: {src: images/m4-which-division.svg, alt: 'Four dividing cells. Cell 1 is small with two duplicated chromosomes, one long and one short, lined up singly at its middle. Cell 2 has four duplicated chromosomes lined up singly in a column at its middle. Cell 3 has duplicated chromosomes, still with both chromatids, being pulled toward the two poles, two to each side. Cell 4 has duplicated chromosomes lined up at the middle in side-by-side pairs, a red and a blue chromosome of the same size in each pair.'}
  labels:
    - {x: 6, y: 8, text: Metaphase II}
    - {x: 56, y: 8, text: Metaphase of mitosis}
    - {x: 6, y: 58, text: Anaphase I}
    - {x: 56, y: 58, text: Metaphase I}
  distractors: [Anaphase II]
  explanation: |-
    Cell 4 has homologs lined up as pairs, which happens only in metaphase I. Cell 3 shows whole duplicated chromosomes (two chromatids still joined) moving apart: homologs separating in anaphase I. Cell 2 has all four chromosomes in a single column with homologs not paired: metaphase of mitosis. Cell 1 has only two chromosomes, one of each size, so it is haploid, and they line up singly: metaphase II. In anaphase II, single chromatids would be moving apart.
- id: bio-q-0449
  lesson: bio-meiosis
  topic: Meiosis
  type: order
  stem: 'Put these events in the order they happen, from before meiosis to the end.'
  items:
    - DNA is replicated in S phase
    - Homologous chromosomes pair and cross over
    - Homologous pairs line up at the middle of the cell
    - Homologous chromosomes move to opposite poles
    - Chromosomes line up singly in two haploid cells
    - Sister chromatids move to opposite poles
    - Four haploid cells form
  explanation: |-
    DNA is copied once, before meiosis. Meiosis I: prophase I (pairing and crossing over), metaphase I (pairs line up), anaphase I (homologs separate). Meiosis II, with no new replication: metaphase II (chromosomes line up singly), anaphase II (sister chromatids separate), then telophase II and cytokinesis give four haploid cells.
- id: bio-q-0450
  lesson: bio-meiosis
  topic: Meiosis
  type: text
  stem: 'In humans, body cells are diploid with 2n = ___, and gametes are haploid with n = ___.'
  accept:
    - ['46']
    - ['23']
  explanation: |-
    Human body cells have 23 pairs, 46 chromosomes. Meiosis puts one chromosome of each pair into a gamete, 23 in all, and fertilization restores 46.
- id: bio-q-0451
  lesson: bio-meiosis
  topic: Meiosis
  stem: 'A cell from a species with 2n = 4 completes meiosis normally. Which statements about the four cells it produces are true? Select all that apply.'
  choices:
    - 'Each is haploid.'
    - 'Each has 2 chromosomes.'
    - 'They are genetically identical to one another.'
    - 'Each chromosome consists of a single chromatid.'
    - 'Each has the same chromosome number as the parent cell.'
  answer: [0, 1, 3]
  explanation: |-
    Meiosis halves the number (n = 2) and ends with sister chromatids separated, so each cell has 2 single-chromatid chromosomes. Crossing over and independent assortment make the four cells genetically different, and their chromosome number is half the parent's, not equal to it.
- id: bio-q-0452
  lesson: bio-meiosis
  module_quiz: true
  topic: Meiosis
  type: match
  stem: 'Match each term to its description.'
  pairs:
    - [Homologous chromosomes, 'One from each parent; same genes, possibly different versions']
    - [Sister chromatids, Identical copies made in S phase and joined at a centromere]
    - [Gamete, A haploid egg or sperm]
    - [Zygote, The diploid cell formed when an egg and sperm join]
  distractors: [A cell with three complete sets of chromosomes]
  explanation: |-
    Homologs pair up in meiosis I and carry the same genes but can differ in versions; sister chromatids are exact copies. Gametes are haploid, and fertilization joins two of them into a diploid zygote. A cell with three sets is a triploid, which is not one of these terms.
- id: bio-qh-0401
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'Cytoplasm from a mature frog egg, injected into an immature oocyte that received no hormone, made the oocyte''s nucleus break down and its chromosomes condense. Cytoplasm from an immature oocyte had no effect. What does this show?'
  choices:
    - 'The hormone that triggers maturation is stored in the nucleus.'
    - 'The cytoplasm of a cell in M phase contains a factor that can drive another cell into M phase.'
    - 'Injecting any cytoplasm damages the oocyte and breaks down its nucleus.'
    - 'Immature oocytes lack chromosomes until they are injected.'
  answer: 1
  explanation: |-
    Only cytoplasm from an M-phase cell had the effect, so the injection itself is not the cause (the control rules that out). Something in that cytoplasm, named maturation-promoting factor (MPF), triggers M phase. The oocyte already has chromosomes; they were simply not condensed.
- id: bio-qh-0402
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'MPF activity could be passed from oocyte to oocyte through many serial injections without diluting away, even when protein synthesis was blocked. Which explanation fits best?'
  choices:
    - 'Each oocyte makes new MPF protein from mRNA after injection.'
    - 'MPF is a mutation that copies itself into each oocyte''s DNA.'
    - 'The injected MPF is too stable to be diluted.'
    - 'Oocytes store inactive MPF, and a little active MPF switches the stored MPF on.'
  answer: 3
  explanation: |-
    With protein synthesis blocked, no new MPF can be made, yet activity rises in each recipient. The oocyte must hold MPF in an inactive form that injected active MPF converts, through positive feedback (active CDK1 activates Cdc25 and inhibits Wee1). Simple stability could not prevent dilution over many transfers, and MPF is a protein complex, not a mutation.
- id: bio-qh-0403
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'When MPF was purified and identified, it turned out to be'
  choices:
    - 'cyclin B bound to the kinase CDK1'
    - 'the tumor suppressor p53 bound to MDM2'
    - 'cyclin D bound to the kinase CDK4'
    - 'a caspase bound to cytochrome c'
  answer: 0
  explanation: |-
    MPF is cyclin B with CDK1 (the product of the yeast gene cdc2). Cyclin D–CDK4 acts in G1 on Rb, p53–MDM2 is the damage-response pair, and caspases with cytochrome c belong to apoptosis.
- id: bio-qh-0404
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'Yeast cells lacking the kinase Wee1 enter mitosis early and divide at about half the normal size. Why?'
  choices:
    - 'Without Wee1, cyclin B cannot be destroyed, so cells stay in mitosis.'
    - 'Wee1 is the cyclin that activates CDK1.'
    - 'Without Wee1 adding inhibitory phosphates, cyclin B–CDK1 becomes active before the cell has grown to its usual size.'
    - 'Wee1 removes the activating phosphate from CDK1, so its loss blocks mitosis.'
  answer: 2
  explanation: |-
    Wee1 adds inhibitory phosphates that hold cyclin B–CDK1 off during G2 while the cell grows. Without it, the complex switches on early, so the cell divides when smaller. Cyclin destruction is the APC/C's job, Wee1 is a kinase not a cyclin, and its loss speeds mitosis rather than blocking it.
- id: bio-qh-0405
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'A modified cyclin B that the APC/C cannot tag with ubiquitin is added to a cycling frog egg extract. What happens?'
  choices:
    - 'The extract cycles faster than normal.'
    - 'MPF stays active and the extract is stuck in M phase.'
    - 'MPF never becomes active, so the extract stays in interphase.'
    - 'DNA replication repeats many times without mitosis.'
  answer: 1
  explanation: |-
    MPF switches on as usual, but leaving mitosis requires destroying cyclin B. A cyclin that cannot be tagged is never sent to the proteasome, so CDK1 stays active and the extract stays in M phase. This experiment showed cyclin destruction is needed to exit mitosis.
- id: bio-qh-0406
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'A mutant Rb protein cannot bind E2F at all. How would cells carrying only this mutant Rb most likely behave?'
  choices:
    - 'They enter S phase without needing growth factors, because E2F is always free.'
    - 'They can never enter S phase, because E2F is permanently blocked.'
    - 'They stop at the spindle checkpoint.'
    - 'They undergo apoptosis as soon as they reach G1.'
  answer: 0
  explanation: |-
    Rb's job is to hold E2F until cyclin–CDKs phosphorylate it. If Rb cannot bind E2F, E2F is free all the time and switches on S-phase genes without any growth-factor signal, the same effect as losing Rb. That is why RB is a tumor suppressor.
- id: bio-qh-0407
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'Some tumors keep normal p53 genes but make far too much MDM2. What is the likely effect?'
  choices:
    - 'p53 levels rise, so the cells arrest permanently.'
    - 'MDM2 repairs DNA damage in place of p53.'
    - 'The cells become more sensitive to DNA damage and die by apoptosis.'
    - 'p53 is destroyed even after DNA damage, so the cells behave as if p53 were missing.'
  answer: 3
  explanation: |-
    MDM2 tags p53 for destruction. With excess MDM2, p53 cannot build up after damage, so p21 is not made, damaged cells keep dividing, and apoptosis is not triggered. Overactive MDM2 therefore acts much like losing p53. MDM2 is not a repair enzyme.
- id: bio-qh-0408
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'In a model of an inherited tumor-suppressor mutation, the number of tumors per carrier is a Poisson count with a mean of 2. What fraction of carriers develop no tumor?'
  choices: ['86.5%', '27.1%', '13.5%', '50%']
  answer: 2
  explanation: |-
    For a Poisson count, $P(0) = e^{-m} = e^{-2} = 0.135$, so 13.5% get no tumor. 86.5% is the fraction with at least one tumor ($1 - e^{-2}$); 27.1% is the chance of exactly one ($2e^{-2}$).
- id: bio-qh-0409
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'In a flow cytometer, an unsynchronized culture with a 24-hour cycle shows 60% of cells with 2C DNA, 25% between 2C and 4C, and 15% with 4C. About how long is S phase?'
  choices: ['14.4 hours', '6 hours', '3.6 hours', '25 hours']
  answer: 1
  explanation: |-
    Cells between 2C and 4C are replicating, so they are in S. Time in S is about $0.25 \times 24 = 6$ hours. 14.4 h is G1 (the 2C cells) and 3.6 h is G2 + M (the 4C cells); 25 treats the percent as hours.
- id: bio-qh-0410
  lesson: bio-h-cycle-control
  topic: Apoptosis
  stem: 'A pathologist sees cells that have shrunk, with condensed chromatin, membrane blebs, and DNA cut into fragments in multiples of about 180 base pairs, and no inflammation nearby. What is happening?'
  choices:
    - 'Apoptosis'
    - 'Necrosis'
    - 'Mitosis'
    - 'Metastasis'
  answer: 0
  explanation: |-
    Shrinkage, chromatin condensation, blebbing and a DNA ladder (cuts between nucleosomes) with no inflammation are the signs of apoptosis. Necrosis makes cells swell and burst and triggers inflammation. Mitosis does not fragment DNA, and metastasis is the spread of cancer.
- id: bio-qh-0411
  lesson: bio-h-cycle-control
  topic: Apoptosis
  stem: 'In most follicular lymphomas, a translocation makes B cells produce far too much Bcl-2. Why does this contribute to cancer?'
  choices:
    - 'Bcl-2 is a cyclin that drives cells through G1.'
    - 'Bcl-2 cuts cohesin and causes nondisjunction.'
    - 'Bcl-2 activates executioner caspases.'
    - 'Bcl-2 blocks the release of cytochrome c, so cells that should die by apoptosis survive.'
  answer: 3
  explanation: |-
    Bcl-2 keeps the mitochondrial pores closed, preventing cytochrome c release and the caspase cascade of the intrinsic pathway. Too much Bcl-2 lets damaged or unneeded B cells survive and accumulate. It is not a cyclin, does not cut cohesin, and blocks rather than activates caspases.
- id: bio-qh-0412
  lesson: bio-h-cycle-control
  topic: Apoptosis
  type: order
  stem: 'Put the steps of the intrinsic (mitochondrial) pathway of apoptosis in order.'
  items:
    - DNA damage stabilizes p53
    - BAX opens pores in the outer membrane of mitochondria
    - Cytochrome c leaks into the cytoplasm
    - The apoptosome activates caspase 9
    - Executioner caspases cut hundreds of cell proteins
    - Phagocytes engulf the cell's fragments
  explanation: |-
    Damage stabilizes p53, which switches on pro-apoptotic genes such as BAX. BAX pores release cytochrome c, which joins Apaf-1 in the apoptosome to activate the initiator caspase 9. Caspase 9 activates executioner caspases (3 and 7), which dismantle the cell, and phagocytes clear the fragments without inflammation.
- id: bio-qh-0413
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  type: match
  stem: 'Match each protein to its role.'
  pairs:
    - [Wee1, Adds inhibitory phosphates to CDK1]
    - [Cdc25, Removes inhibitory phosphates from CDK1]
    - [APC/C, Tags cyclin B and securin for destruction]
    - [Separase, Cuts cohesin so sister chromatids separate]
    - [p21, Blocks cyclin–CDK complexes after DNA damage]
  distractors: [Releases cytochrome c from mitochondria]
  explanation: |-
    Wee1 and Cdc25 set the timing of CDK1 activation from opposite sides. The APC/C ends mitosis and starts anaphase by tagging cyclin B and securin, which frees separase to cut cohesin. p21 is the CDK inhibitor that p53 switches on. Cytochrome c release is done by BAX pores in apoptosis.
- id: bio-qh-0414
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  stem: 'Which changes can turn a proto-oncogene into an oncogene? Select all that apply.'
  choices:
    - 'A point mutation that locks its protein in the active state'
    - 'Amplification of the gene into many copies'
    - 'A translocation that fuses it to another gene'
    - 'Loss of both copies of the gene'
    - 'A mutation that destroys the protein''s function'
  answer: [0, 1, 2]
  explanation: |-
    Oncogenes arise by gain of function: a stuck-on protein (RAS), too much protein (HER2 amplification), or a new fusion protein (BCR-ABL). Losing both copies or destroying function is the loss-of-function route that inactivates tumor suppressor genes.
- id: bio-qh-0415
  lesson: bio-h-cycle-control
  topic: Apoptosis
  type: text
  stem: 'The protein-cutting enzymes that carry out apoptosis, made as inactive precursors and activated in a cascade, are called ___.'
  accept: [caspases, caspase]
  explanation: |-
    Caspases are cysteine proteases that cut just after aspartate. Initiator caspases (8 and 9) activate executioner caspases (3 and 7), which dismantle the cell.
- id: bio-qh-0416
  lesson: bio-h-cycle-control
  topic: Cyclins and CDKs
  type: text
  stem: 'A tumor from a person who inherited one faulty copy of a tumor suppressor gene has lost the good copy by deletion. This kind of second hit is called loss of ___.'
  accept: [heterozygosity]
  explanation: |-
    The person was heterozygous (one good, one faulty copy). Losing the good copy by deletion, chromosome loss or mitotic recombination leaves only faulty copies: loss of heterozygosity, a common second hit.
- id: bio-qh-0417
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'What is the main job of chiasmata during meiosis I?'
  choices:
    - 'They attach chromosomes to the nuclear envelope.'
    - 'They copy the DNA a second time before meiosis II.'
    - 'They hold each homologous pair together so the spindle can pull the two homologs to opposite poles.'
    - 'They keep sister chromatids together until anaphase II.'
  answer: 2
  explanation: |-
    Because chromatid arms have been swapped at a chiasma, cohesion along the arms ties the homologs together until anaphase I, letting them attach to opposite poles under tension. Pairs with no crossover are prone to nondisjunction. Keeping sisters together until anaphase II is the job of centromere cohesin protected by shugoshin.
- id: bio-qh-0418
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'In a mutant lacking shugoshin, all cohesin is cut at anaphase I. What is the most likely result?'
  choices:
    - 'Sister chromatids separate too early, so they segregate randomly in meiosis II and many gametes are aneuploid.'
    - 'Homologs never separate, so all gametes are diploid.'
    - 'Crossing over cannot occur.'
    - 'Meiosis proceeds normally because shugoshin acts only in mitosis.'
  answer: 0
  explanation: |-
    Shugoshin protects centromere cohesin during anaphase I so sisters stay joined until anaphase II. Without it, sisters come apart early and can no longer be pulled evenly to opposite poles in meiosis II, giving gametes with extra or missing chromosomes. Crossing over happens earlier, in prophase I, and homologs still separate.
- id: bio-qh-0419
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  type: label
  stem: 'A cell heterozygous AB/ab undergoes meiosis with one crossover between the two genes. Classify each numbered product chromatid as parental or recombinant.'
  image: {src: images/m4-crossover-q.svg, alt: 'On the left, a homologous pair in prophase I: two red chromatids carrying A and B and two blue chromatids carrying a and b, with the two inner chromatids crossing between the genes. On the right, four separate chromatids, numbered 1 to 4, carrying A and B, A and b, a and B, and a and b.'}
  labels:
    - {x: 53, y: 95, text: Parental}
    - {x: 66, y: 95, text: Recombinant}
    - {x: 78.5, y: 95, text: Recombinant}
    - {x: 91, y: 95, text: Parental}
  explanation: |-
    The crossover involved only the two inner chromatids, swapping the parts beyond the crossover point. Chromatids 2 (A b) and 3 (a B) carry new combinations, so they are recombinant. Chromatids 1 (A B) and 4 (a b) were not involved and keep the parental combinations. One crossover between two genes therefore gives 2 recombinant and 2 parental chromatids.
- id: bio-qh-0420
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'At a marker near the centromere of chromosome 21, a mother has M1 and M2 and the father has P1 and P2. A child with trisomy 21 has M2, M2 and P1. Where did the error most likely happen?'
  choices:
    - 'Maternal meiosis I'
    - 'Maternal meiosis II'
    - 'Paternal meiosis I'
    - 'Paternal meiosis II'
  answer: 1
  explanation: |-
    The extra copy came from the mother (two maternal markers). They are identical (M2 and M2), so they are sister chromatids that failed to separate: maternal meiosis II. A maternal meiosis I error would give two different homologs, M1 and M2.
- id: bio-qh-0421
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'Using the same family (mother M1/M2, father P1/P2), a child with trisomy 21 has M1, P1 and P2. Where did the error most likely happen?'
  choices:
    - 'Maternal meiosis I'
    - 'Maternal meiosis II'
    - 'Paternal meiosis I'
    - 'Paternal meiosis II'
  answer: 2
  explanation: |-
    Two markers come from the father, and they are different (P1 and P2), so both of his homologs went into one sperm: paternal meiosis I. Paternal meiosis II would give two identical markers, such as P1 and P1.
- id: bio-qh-0422
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'A person has the karyotype 47,XYY. In which parent and division did nondisjunction most likely occur?'
  choices:
    - 'Father, meiosis II'
    - 'Mother, meiosis I'
    - 'Father, meiosis I'
    - 'Mother, meiosis II'
  answer: 0
  explanation: |-
    Only the father can supply a Y, so the sperm was YY. Two Y chromosomes in one sperm must be sister chromatids that failed to separate, which happens in meiosis II. A father's meiosis I error would give an XY sperm instead.
- id: bio-qh-0423
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  stem: 'A child has three copies of chromosome 21 in about 30% of blood cells and two copies in the rest. What is the most likely explanation?'
  choices:
    - 'Nondisjunction in maternal meiosis I'
    - 'Crossing over between chromosome 21 and its homolog'
    - 'Polyploidy in all of the child''s cells'
    - 'Nondisjunction in a mitotic division of the early embryo, producing mosaicism'
  answer: 3
  explanation: |-
    A meiotic error alone would put the extra chromosome in the zygote and so in every cell. A mix of normal and trisomic cells means a mitotic error after fertilization created two cell lines: mosaicism. (Sometimes a trisomic zygote loses the extra copy in one early mitosis, which also gives a mosaic; either way the mix comes from a mitotic error.) Crossing over does not change chromosome number, and polyploidy would add whole sets.
- id: bio-qh-0424
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  stem: 'An organism with 2n = 8 is heterozygous for two genes on every chromosome pair. Suppose crossovers occur between the two genes in 2 of the 4 pairs and never in the other 2. How many kinds of gamete are possible?'
  choices: ['16', '64', '256', '32']
  answer: 1
  explanation: |-
    Each pair with a crossover between the genes can contribute 4 kinds of chromatid; each pair without one, 2. So $4^2 \times 2^2 = 16 \times 4 = 64$. 16 ignores crossing over ($2^4$), 256 assumes crossovers in all four pairs ($4^4$), and 32 counts only one crossover pair.
- id: bio-qh-0425
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  stem: 'A triploid plant has a basic set of x = 7 chromosomes. If each set of three homologs splits 1 and 2 at random, independently, what fraction of its gametes is balanced (exactly one or exactly two of every chromosome)?'
  choices: ['1/128', '1/7', '1/64', '1/2']
  answer: 2
  explanation: |-
    All-one-copy has probability $\left(\tfrac12\right)^7 = \tfrac1{128}$, and all-two-copies the same, so the total is $2 \times \tfrac1{128} = \tfrac1{64}$. 1/128 counts only one of the two balanced outcomes.
- id: bio-qh-0426
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  stem: 'Species A (2n = 14) and species B (2n = 20) form a sterile hybrid. Later, the hybrid''s chromosome number doubles, giving a fertile allopolyploid. How many chromosomes does the fertile plant have?'
  choices: ['17', '34', '68', '24']
  answer: 1
  explanation: |-
    The hybrid gets a gamete from each parent: $7 + 10 = 17$ chromosomes, with no partners to pair with, so it is sterile. Doubling gives $2 \times 17 = 34$, in which every chromosome has an identical partner. 68 doubles twice; 24 adds the wrong numbers.
- id: bio-qh-0427
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  stem: 'Bread wheat is hexaploid, 2n = 6x = 42. How many chromosomes are in a normal wheat gamete, and how many in one basic set (x)?'
  choices:
    - '42 in a gamete, 7 in a set'
    - '21 in a gamete, 14 in a set'
    - '7 in a gamete, 21 in a set'
    - '21 in a gamete, 7 in a set'
  answer: 3
  explanation: |-
    A gamete has half the body-cell number: $n = 42 \div 2 = 21$, which is three basic sets. One basic set is $x = 42 \div 6 = 7$. Wheat is an allopolyploid of three ancestral grass genomes, each with 7 chromosomes.
- id: bio-qh-0428
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  type: order
  stem: 'Put these events in the order they happen in normal meiosis.'
  items:
    - Homologs pair and the synaptonemal complex forms
    - Crossovers form between non-sister chromatids
    - The synaptonemal complex comes apart; homologs stay joined at chiasmata
    - Homologs attach to opposite poles under tension
    - Arm cohesin is cut and homologs separate
    - Centromere cohesin is cut and sister chromatids separate
  explanation: |-
    Prophase I: synapsis, crossing over, then disassembly of the synaptonemal complex leaving chiasmata. Metaphase I: homologs attach to opposite poles, held under tension by the chiasmata. Anaphase I: arm cohesin is cut, releasing homologs, while shugoshin protects centromere cohesin. Anaphase II: centromere cohesin is cut and sisters separate.
- id: bio-qh-0429
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  type: match
  stem: 'Match each finding to where the chromosome error most likely happened.'
  pairs:
    - [A 47 XYY karyotype, Paternal meiosis II]
    - [Trisomy with two different maternal markers near the centromere, Maternal meiosis I]
    - [Trisomy with two identical maternal markers near the centromere, Maternal meiosis II]
    - [A mix of cells with 46 and 47 chromosomes, A mitotic division after fertilization]
  distractors: [Paternal meiosis I]
  explanation: |-
    YY sperm come only from sister chromatids failing to separate in the father's meiosis II. Two different homologs from one parent mean meiosis I; two identical copies mean sister chromatids, meiosis II. A mixture of cell lines (mosaicism) means the error happened in a mitosis after the zygote formed.
- id: bio-qh-0430
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  stem: 'Which statements about polyploidy are true? Select all that apply.'
  choices:
    - 'Colchicine can double the chromosome number by blocking spindle formation.'
    - 'An allopolyploid combines chromosome sets from two different species.'
    - 'Triploid plants usually make mostly balanced gametes.'
    - 'Polyploidy can produce a new plant species in a single step.'
    - 'Polyploidy means having one extra chromosome.'
  answer: [0, 1, 3]
  explanation: |-
    Colchicine stops the spindle so chromosomes double without division. Allopolyploids join genomes from two species, and because they cannot breed successfully with either parent they can be new species at once (Karpechenko's radish-cabbage). Triploids make very few balanced gametes, and one extra chromosome is aneuploidy, not polyploidy.
- id: bio-qh-0431
  lesson: bio-h-meiosis-variation
  topic: Nondisjunction
  type: text
  stem: 'After crossing over, homologs stay joined at X-shaped points, each called a ___.'
  accept: [chiasma, chiasmata, chiasm]
  explanation: |-
    A chiasma (plural chiasmata) is the visible sign of a crossover. Together with cohesion along the chromatid arms, it holds the homologs together until anaphase I.
- id: bio-qh-0432
  lesson: bio-h-meiosis-variation
  topic: Genetic variation
  type: text
  stem: 'A fertile plant whose chromosomes come from two different species, formed by hybridization followed by chromosome doubling, is called an ___.'
  accept: [allopolyploid, allopolyploids, allotetraploid, amphidiploid]
  explanation: |-
    An allopolyploid carries full chromosome sets from two (or more) species. Doubling gives every chromosome a partner, which restores fertility, as in Karpechenko's radish-cabbage and in bread wheat.
