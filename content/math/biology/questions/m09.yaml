- id: bio-q-0901
  lesson: bio-homeostasis
  module_quiz: true
  topic: Homeostasis
  stem: Which of these is an example of negative feedback?
  choices:
  - Oxytocin strengthening contractions that release more oxytocin during childbirth
  - Activated platelets releasing chemicals that activate more platelets
  - Sweating when body temperature rises, which cools the body back toward 37 °C
  - Ripening fruit releasing ethylene that makes nearby fruit ripen and release more ethylene
  answer: 2
  explanation: 'In negative feedback, the response reverses the change: sweating lowers a temperature that rose. The other three are positive feedback, where the response amplifies the change until an event (birth, a sealed wound, ripe fruit) ends it.'
- id: bio-q-0902
  lesson: bio-homeostasis
  module_quiz: true
  topic: Homeostasis
  stem: Why does the body rely on negative feedback, rather than positive feedback, to hold variables such as temperature steady?
  choices:
  - Negative feedback opposes any change, so it is self-correcting; positive feedback would push the variable further from its set point.
  - Positive feedback is too slow to respond to changes.
  - Negative feedback needs no sensors or effectors.
  - Positive feedback only works through hormones.
  answer: 0
  explanation: Holding a set point requires a response that reverses deviations. Positive feedback amplifies them, which suits events that must be completed (childbirth, clotting) but would make a variable run away. Both kinds use sensors and effectors, and positive feedback can involve nerves as well as hormones.
- id: bio-q-0903
  lesson: bio-homeostasis
  topic: Homeostasis
  stem: A person steps out into freezing wind. Which pair of responses does the hypothalamus trigger to keep the core warm?
  choices:
  - Widening of skin blood vessels and sweating
  - Narrowing of skin blood vessels and shivering
  - Widening of skin blood vessels and shivering
  - Narrowing of skin blood vessels and sweating
  answer: 1
  explanation: Vasoconstriction keeps warm blood away from the cold skin, reducing heat loss, and shivering muscles release heat. Vasodilation and sweating are the responses to overheating; mixing them with cold responses would work against each other.
- id: bio-q-0904
  lesson: bio-homeostasis
  topic: Homeostasis
  stem: After a meal, blood glucose is 150 mg/dL; the set point is 90 mg/dL. Suppose insulin action removes half of the excess above the set point every 30 minutes. What is the glucose level 1 hour later?
  choices:
  - 120 mg/dL
  - 105 mg/dL
  - 90 mg/dL
  - 75 mg/dL
  answer: 1
  explanation: The excess is $150 - 90 = 60$. After 30 min it is 30, after 60 min it is 15, so glucose is $90 + 15 = 105$ mg/dL. 120 is the value after only one interval; 90 assumes the excess disappears completely; 75 halves the whole glucose level instead of the excess.
- id: bio-q-0905
  lesson: bio-homeostasis
  module_quiz: true
  topic: Nervous system
  stem: A sensory neuron is stimulated first weakly (but above threshold) and then much more strongly. How do its action potentials differ?
  choices:
  - They are larger with the stronger stimulus.
  - They are the same size, but they fire more often with the stronger stimulus.
  - They travel faster with the stronger stimulus.
  - Only the weak stimulus produces action potentials.
  answer: 1
  explanation: 'Action potentials are all-or-none: once threshold is reached, each impulse has the same size and speed. Stimulus strength is coded by how frequently they fire.'
- id: bio-q-0906
  lesson: bio-homeostasis
  topic: Nervous system
  stem: Repeating Helmholtz's experiment, a nerve is stimulated 60 mm from a muscle (twitch after 3.0 ms) and 15 mm from it (twitch after 1.5 ms). What is the conduction speed?
  choices:
  - 20 m/s
  - 30 m/s
  - 10 m/s
  - 40 m/s
  answer: 1
  explanation: 'Subtracting cancels the muscle''s own delay: $\dfrac{60 - 15}{3.0 - 1.5} = \dfrac{45 \text{ mm}}{1.5 \text{ ms}} = 30$ mm/ms $= 30$ m/s. Using one trial alone (60/3.0 or 15/1.5) includes the muscle delay and gives 20 or 10; 60/1.5 mixes the trials.'
- id: bio-q-0907
  lesson: bio-homeostasis
  topic: Nervous system
  stem: Diseases that damage myelin slow nerve signals. Why does myelin normally speed conduction?
  choices:
  - It produces extra neurotransmitter.
  - It makes action potentials larger.
  - It pumps sodium ions into the axon.
  - It insulates the axon so the impulse jumps from gap to gap instead of traveling continuously.
  answer: 3
  explanation: Myelin is a fatty insulating sheath with gaps; the action potential is regenerated only at the gaps, so it effectively jumps along the axon. It doesn't change the size of the impulse or release transmitters, and the ion pumps are in the neuron's own membrane.
- id: bio-q-0908
  lesson: bio-homeostasis
  topic: Nervous system
  stem: What makes the inside of a neuron become positive during the rising phase of an action potential?
  choices:
  - Potassium ions rushing in through opened channels
  - Sodium ions being pumped out by the sodium-potassium pump
  - Sodium ions rushing in through opened channels
  - Neurotransmitter molecules entering the axon
  answer: 2
  explanation: At threshold, sodium channels open and positive sodium ions flood in. Potassium then flows out (not in) to restore the negative inside. The pump maintains the resting gradients but is too slow to produce the spike.
- id: bio-q-0909
  lesson: bio-homeostasis
  topic: Nervous system
  stem: A drug blocks the enzyme that breaks down acetylcholine at the synapses between nerves and muscles. What would you predict?
  choices:
  - Acetylcholine stays in the synapse and keeps stimulating the muscle, causing prolonged contraction.
  - The muscle can no longer receive any signal.
  - Nerve impulses stop traveling along the axon.
  - The muscle relaxes permanently because acetylcholine is used up.
  answer: 0
  explanation: Normally the transmitter is broken down so each signal is brief. If it isn't removed, it keeps binding receptors and the muscle keeps being stimulated. Conduction along the axon itself is unaffected.
- id: bio-q-0910
  lesson: bio-homeostasis
  module_quiz: true
  topic: Endocrine system
  stem: Bayliss and Starling cut all the nerves between the intestine and the pancreas, yet acid entering the intestine still made the pancreas release digestive juice. What did they conclude?
  choices:
  - The pancreas works without any signal at all.
  - The nerves had grown back during the experiment.
  - Acid travels from the intestine directly into the pancreas.
  - A chemical messenger carried in the blood links the two organs.
  answer: 3
  explanation: 'With the nerves cut, the signal had to travel another way: through the blood. They extracted the messenger (secretin), the first hormone discovered. The response was triggered by acid in the intestine, so it wasn''t spontaneous.'
- id: bio-q-0911
  lesson: bio-homeostasis
  module_quiz: true
  topic: Endocrine system
  stem: Several hours after a meal, blood glucose drops below the set point. Which response restores it?
  choices:
  - The pancreas releases glucagon, and the liver breaks down glycogen and releases glucose.
  - The pancreas releases insulin, and cells take up more glucose.
  - The pancreas releases glucagon, and muscle cells take up glucose from the blood.
  - The liver stores more glucose as glycogen.
  answer: 0
  explanation: Low glucose triggers glucagon from the alpha cells, which makes the liver release glucose from its glycogen stores. Insulin and glycogen storage lower blood glucose, which would make the problem worse.
- id: bio-q-0912
  lesson: bio-homeostasis
  topic: Endocrine system
  stem: What is the underlying problem in type 1 diabetes?
  choices:
  - Cells stop responding to insulin even though plenty is made.
  - The pancreas makes too much glucagon.
  - The kidneys fail to remove glucose from the blood.
  - The immune system destroys the insulin-making beta cells, so little insulin is produced.
  answer: 3
  explanation: 'Type 1 diabetes is autoimmune: beta cells are destroyed, so the body makes little or no insulin. Insulin resistance describes type 2 diabetes. Kidneys normally reabsorb glucose rather than remove it.'
- id: bio-q-0913
  lesson: bio-transport-systems
  module_quiz: true
  topic: Circulatory system
  stem: Blood leaving the right ventricle goes next to the
  choices:
  - body, through the aorta
  - left atrium, through a valve
  - lungs, through the pulmonary vein
  - lungs, through the pulmonary artery
  answer: 3
  explanation: The right side of the heart pumps oxygen-poor blood to the lungs through the pulmonary artery. The aorta leaves the left ventricle; the pulmonary veins bring blood back from the lungs to the left atrium.
- id: bio-q-0914
  lesson: bio-transport-systems
  topic: Circulatory system
  stem: Which blood vessel carries oxygen-rich blood?
  choices:
  - The pulmonary vein
  - The pulmonary artery
  - The vena cava
  - A vein returning blood from the leg
  answer: 0
  explanation: The pulmonary veins carry freshly oxygenated blood from the lungs to the left atrium. Vessels are named for direction (arteries away from the heart, veins toward it), not oxygen content, so the pulmonary artery carries oxygen-poor blood.
- id: bio-q-0915
  lesson: bio-transport-systems
  module_quiz: true
  topic: Circulatory system
  stem: During exercise, a student's heart rate is 80 beats per minute and the stroke volume is 75 mL. What is the cardiac output?
  choices:
  - 0.6 L/min
  - 60 L/min
  - 155 mL/min
  - 6.0 L/min
  answer: 3
  explanation: Cardiac output = heart rate × stroke volume $= 80 \times 75 = 6000$ mL/min $= 6.0$ L/min. 0.6 and 60 are unit-conversion slips (1000 mL = 1 L); 155 adds the two numbers instead of multiplying.
- id: bio-q-0916
  lesson: bio-transport-systems
  topic: Circulatory system
  stem: William Harvey calculated that the heart pumps far more blood in a day than a person eats and drinks, or than the whole body contains. What did this show?
  choices:
  - The liver makes new blood very quickly.
  - Blood is mostly water absorbed from the air.
  - The same blood must circulate repeatedly instead of being made from food and used up.
  - Arteries and veins are not connected.
  answer: 2
  explanation: Thousands of liters a day can't be made from food or held in the body, so the same blood must loop round. That contradicted Galen's idea of constant production and consumption, and it predicted connections between arteries and veins (capillaries), found later.
- id: bio-q-0917
  lesson: bio-transport-systems
  topic: Circulatory system
  stem: Why does exchange of oxygen and nutrients with tissues happen in capillaries rather than in arteries?
  choices:
  - Capillary walls are one cell thick, so substances diffuse across them quickly.
  - Capillaries have valves that push substances out.
  - Blood in capillaries is under the highest pressure.
  - Capillaries carry blood directly from the heart.
  answer: 0
  explanation: Diffusion is fast only across short distances, and capillary walls are a single thin cell layer. Arteries have thick, muscular walls; valves are found in veins; pressure is highest in the large arteries.
- id: bio-q-0918
  lesson: bio-transport-systems
  module_quiz: true
  topic: Respiratory system
  stem: What is the main signal that makes you breathe faster during exercise?
  choices:
  - Falling oxygen in the blood
  - Rising blood glucose
  - Falling body temperature
  - Rising carbon dioxide, which lowers blood pH
  answer: 3
  explanation: 'Brainstem sensors respond mainly to carbon dioxide, which forms carbonic acid and lowers pH. Faster breathing removes it: negative feedback. Low oxygen matters only when it gets quite low.'
- id: bio-q-0919
  lesson: bio-transport-systems
  topic: Respiratory system
  stem: What happens as you inhale?
  choices:
  - The lungs expand on their own, pulling the diaphragm upward.
  - The diaphragm contracts and flattens, chest volume increases, pressure in the lungs falls, and air flows in.
  - The diaphragm relaxes, increasing pressure in the lungs and drawing air in.
  - Air pressure in the lungs rises above outside air pressure.
  answer: 1
  explanation: Contracting the diaphragm and rib muscles enlarges the chest; lower pressure inside means outside air pushes in. Lungs have no muscle of their own; a relaxing diaphragm and higher lung pressure push air out.
- id: bio-q-0920
  lesson: bio-transport-systems
  topic: Respiratory system
  stem: A person breathes 15 times per minute with a tidal volume of 600 mL. Dead space is 150 mL per breath. What is the alveolar ventilation?
  choices:
  - 9.0 L/min
  - 2.25 L/min
  - 6.75 L/min
  - 0.45 L/min
  answer: 2
  explanation: Alveolar ventilation $= (600 - 150) \times 15 = 6750$ mL/min $= 6.75$ L/min. 9.0 L/min is total minute ventilation (ignores dead space), 2.25 L/min is the dead-space ventilation, and 0.45 L is the useful air in a single breath, not per minute.
- id: bio-q-0921
  lesson: bio-transport-systems
  topic: Respiratory system
  stem: A resting person uses 0.30 L of oxygen per minute. About 20 kJ of energy is released per liter of oxygen. How much energy does the person use per hour?
  choices:
  - 360 kJ
  - 6 kJ
  - 18 kJ
  - 8,640 kJ
  answer: 0
  explanation: 'Per minute: $0.30 \times 20 = 6$ kJ. Per hour: $6 \times 60 = 360$ kJ. 6 kJ is per minute, 18 kJ multiplies 0.30 by 60 without the energy factor, and 8,640 kJ is the total for a whole day.'
- id: bio-q-0922
  lesson: bio-transport-systems
  topic: Excretory system
  stem: The kidneys of a person filter 170 L of fluid in a day and produce 1.7 L of urine. What percentage of the filtered water is reabsorbed?
  choices:
  - 1%
  - 99%
  - 90%
  - 10%
  answer: 1
  explanation: Reabsorbed $= 170 - 1.7 = 168.3$ L, and $168.3/170 = 0.99$, so 99%. 1% is the fraction that becomes urine; 90% and 10% are off by a factor of ten in the urine fraction.
- id: bio-q-0923
  lesson: bio-transport-systems
  module_quiz: true
  topic: Excretory system
  stem: Glucose is found in the fluid entering a nephron's tubule, but healthy urine contains almost no glucose. Why?
  choices:
  - Glucose is too large to be filtered.
  - Glucose is filtered at the glomerulus and then almost entirely reabsorbed into the blood along the tubule.
  - The bladder absorbs glucose from urine.
  - Glucose is converted to urea in the kidney.
  answer: 1
  explanation: Filtration is nonselective for small molecules, so glucose enters the filtrate; carriers in the tubule then reclaim nearly all of it. Glucose is small enough to pass the filter, which is why it's in the filtrate. Urea comes from amino acids, not glucose.
- id: bio-q-0924
  lesson: bio-transport-systems
  module_quiz: true
  topic: Excretory system
  stem: After hours of hiking without water, a person's blood becomes more concentrated. What happens next?
  choices:
  - ADH release falls, and a large volume of dilute urine is made.
  - The kidneys stop filtering blood until the person drinks.
  - The pituitary releases more ADH, more water is reabsorbed, and a small volume of concentrated urine is made.
  - More water is secreted into the tubules to flush out salt.
  answer: 2
  explanation: 'Concentrated blood is sensed by the hypothalamus; ADH makes the collecting ducts more permeable to water, so water returns to the blood: negative feedback. Less ADH is the response to drinking a lot. Filtration continues all the time.'
- id: bio-q-0925
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Digestive system
  stem: Where does most chemical digestion and nearly all absorption of nutrients take place?
  choices:
  - The stomach
  - The large intestine
  - The esophagus
  - The small intestine
  answer: 3
  explanation: Pancreatic enzymes and bile act in the small intestine, and its villi absorb the products. The stomach starts protein digestion but absorbs little; the large intestine mainly absorbs water; the esophagus only moves food.
- id: bio-q-0926
  lesson: bio-digestion-immunity
  topic: Digestive system
  stem: What does bile do?
  choices:
  - It is an enzyme that digests fats into fatty acids.
  - It digests proteins in the stomach.
  - It breaks large fat droplets into tiny ones, giving lipase more surface to work on.
  - It neutralizes all the acid in the large intestine.
  answer: 2
  explanation: Bile, made by the liver and stored in the gallbladder, emulsifies fat; it contains no enzymes. Lipase does the chemical digestion. Pepsin digests proteins in the stomach, and bicarbonate from the pancreas neutralizes acid in the small intestine.
- id: bio-q-0927
  lesson: bio-digestion-immunity
  topic: Digestive system
  stem: Proteins in food are absorbed mainly in the form of
  choices:
  - fatty acids
  - amino acids
  - simple sugars
  - nucleotides
  answer: 1
  explanation: Digestion hydrolyzes proteins (starting with pepsin in the stomach) into amino acids, which are absorbed in the small intestine. Fatty acids come from fats, sugars from carbohydrates, nucleotides from nucleic acids.
- id: bio-q-0928
  lesson: bio-digestion-immunity
  topic: Digestive system
  stem: In celiac disease, an immune reaction to gluten flattens the villi of the small intestine. What would you predict?
  choices:
  - Faster absorption, because food passes more easily
  - No change in absorption, because villi only produce mucus
  - Less acid production in the stomach
  - Reduced absorption of nutrients, because the absorbing surface area is much smaller
  answer: 3
  explanation: Villi multiply the surface area for absorption, so flattening them reduces nutrient uptake. They are absorbing structures, not mucus producers, and the stomach is unaffected.
- id: bio-q-0929
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Digestive system
  stem: A snack contains 30 g of carbohydrate, 10 g of protein and 12 g of fat. Using 4, 4 and 9 kcal per gram, what is its energy content?
  choices:
  - 268 kcal
  - 208 kcal
  - 468 kcal
  - 52 kcal
  answer: 0
  explanation: $30 \times 4 + 10 \times 4 + 12 \times 9 = 120 + 40 + 108 = 268$ kcal. Using 4 kcal/g for fat gives 208; using 9 kcal/g for everything gives 468; 52 is just the total mass in grams.
- id: bio-q-0930
  lesson: bio-digestion-immunity
  topic: Digestive system
  stem: Spallanzani put meat in gastric juice at body temperature and saw it dissolve. Which control was needed to conclude that the juice itself digested the meat?
  choices:
  - Meat in gastric juice at a colder temperature
  - Gastric juice with no meat added
  - Meat in plain water at the same temperature for the same time
  - A larger piece of meat in gastric juice
  answer: 2
  explanation: Only the juice should differ between the groups. Meat in water under identical conditions shows whether warmth and time alone break meat down. The other setups change different variables or have no meat to observe.
- id: bio-q-0931
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Immune system
  stem: Which of these is part of adaptive immunity?
  choices:
  - Stomach acid killing swallowed bacteria
  - Antibodies made against one particular strain of virus
  - Inflammation around a splinter
  - Neutrophils engulfing any bacteria they meet
  answer: 1
  explanation: Adaptive immunity is specific to one antigen and builds memory; antibodies are its hallmark. Stomach acid, inflammation and general phagocytes act against any invader and belong to innate immunity.
- id: bio-q-0932
  lesson: bio-digestion-immunity
  topic: Immune system
  stem: Which statement correctly distinguishes an antigen from an antibody?
  choices:
  - An antigen is made by B cells; an antibody is found on the surface of bacteria.
  - Antigens and antibodies are two names for the same molecule.
  - An antigen is a foreign molecule the immune system recognizes; an antibody is a protein made by B cells that binds it.
  - An antigen is a type of white blood cell; an antibody is a type of virus.
  answer: 2
  explanation: The antigen is the marker (often a surface protein of a pathogen); the antibody is the Y-shaped protein the body makes to bind that marker. Swapping the two (saying B cells make antigens) is a common mix-up.
- id: bio-q-0933
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Immune system
  stem: A person's second exposure to an antigen produces antibodies within a few days at about ten times the level of the first exposure, which took about two weeks to peak. What explains this?
  choices:
  - Memory cells formed during the first response multiply quickly when the antigen returns.
  - Antibodies from the first exposure have been circulating at a high level ever since.
  - The antigen is weaker the second time.
  - Innate immunity learns to recognize the antigen.
  answer: 0
  explanation: The first exposure leaves long-lived memory B and T cells, so the secondary response is faster and larger. Antibody levels fall after the primary response, the antigen hasn't changed, and memory is a feature of adaptive, not innate, immunity.
- id: bio-q-0934
  lesson: bio-digestion-immunity
  topic: Immune system
  stem: What does an mRNA vaccine deliver?
  choices:
  - A weakened form of the whole virus that multiplies slowly
  - Ready-made antibodies against the virus
  - Instructions that cells use for a short time to make one protein of the pathogen, which the immune system learns to recognize
  - Genes that become permanently part of the person's DNA
  answer: 2
  explanation: The mRNA is translated in the cytoplasm into one viral protein (the antigen), then broken down within days; it never enters the nucleus and can't change DNA. Ready-made antibodies give short-term passive protection, not vaccination; live attenuated vaccines are a different type.
- id: bio-q-0935
  lesson: bio-digestion-immunity
  topic: Immune system
  stem: A disease has $R_0 = 5$. What fraction of the population must be immune to reach the herd immunity threshold?
  choices:
  - 20%
  - 50%
  - 95%
  - 80%
  answer: 3
  explanation: Threshold $= 1 - \tfrac{1}{R_0} = 1 - \tfrac15 = 0.80$, or 80%. 20% is $1/R_0$ itself; 95% is the kind of value needed for measles, whose $R_0$ is much higher.
- id: bio-q-0936
  lesson: bio-digestion-immunity
  topic: Immune system
  stem: HIV infects and destroys helper T cells. Why does this weaken the immune system so broadly?
  choices:
  - Helper T cells activate B cells and cytotoxic T cells, so both antibody and cell-killing responses fail.
  - Helper T cells are the only cells that make antibodies.
  - Helper T cells form the skin barrier.
  - Helper T cells are the main phagocytes.
  answer: 0
  explanation: Helper T cells coordinate the adaptive response. Without them, B cells (which make antibodies) and cytotoxic T cells are poorly activated, leaving the body open to infections. Antibodies come from B cells, and phagocytes are innate cells.
- id: bio-q-0937
  lesson: bio-homeostasis
  module_quiz: true
  topic: Nervous system
  type: label
  stem: 'Name the numbered parts of this neuron.'
  image: {src: images/m9-neuron-blank.svg, alt: 'A neuron with six numbered parts: branches on the left, a rounded body with a smaller circle inside it, segments wrapped around a long fiber, the fiber itself, and branched endings on the right.'}
  labels:
    - {x: 9.2, y: 23.3, text: Dendrites}
    - {x: 22.2, y: 46.7, text: Nucleus}
    - {x: 25.0, y: 63.3, text: Cell body}
    - {x: 46.5, y: 46.3, text: Myelin sheath}
    - {x: 77.8, y: 50.0, text: Axon}
    - {x: 91.9, y: 30.0, text: Axon terminals}
  distractors: [Synapse, Villus]
  explanation: 'Dendrites (1) are the short branches that receive signals; the cell body (3) holds the nucleus (2). The axon (5) carries the impulse away, wrapped in segments of myelin sheath (4) with small gaps between them, and ends in axon terminals (6), which release neurotransmitter. A synapse is the gap between a terminal and the next cell, not part of the neuron itself.'
- id: bio-q-0938
  lesson: bio-homeostasis
  topic: Homeostasis
  type: order
  stem: 'A runner overheats. Put the steps of the negative feedback loop in order.'
  items:
    - Core temperature rises above the set point
    - Temperature sensors in the skin and hypothalamus detect the rise
    - The hypothalamus compares the reading with the set point
    - Sweat glands and skin blood vessels respond
    - Temperature falls back toward 37 °C and the signals weaken
  explanation: 'Every control loop runs stimulus, sensor, control center, effector, response. The last step is what makes it negative feedback: the response removes the stimulus, so the loop switches itself off.'
- id: bio-q-0939
  lesson: bio-homeostasis
  topic: Endocrine system
  type: text
  stem: 'In type 1 diabetes, the immune system destroys the ___ cells of the pancreas, so the body makes little ___.'
  accept:
    - [beta, β, beta cell, beta cells, β cell, β cells, beta-cell, beta-cells, islet beta]
    - [insulin]
  explanation: 'Type 1 diabetes is autoimmune: the insulin-making beta cells in the pancreatic islets are destroyed, so little or no insulin is produced. (Alpha cells, which make glucagon, are not the target.)'
- id: bio-q-0940
  lesson: bio-homeostasis
  module_quiz: true
  topic: Homeostasis
  stem: 'Which of these are examples of positive feedback? Select all that apply.'
  choices:
    - Oxytocin release that strengthens contractions during childbirth
    - Activated platelets releasing chemicals that activate more platelets
    - Shivering when body temperature falls
    - Insulin release after a meal raises blood glucose
  answer: [0, 1]
  explanation: 'In childbirth and clotting, the response amplifies the change until an event (birth, a sealed wound) ends the loop. Shivering reverses a fall in temperature, which is negative feedback. Insulin lowers glucose, it doesn''t raise it, and its release is also negative feedback.'
- id: bio-q-0941
  lesson: bio-homeostasis
  topic: Endocrine system
  type: match
  stem: 'Match each feature to the control system it describes.'
  pairs:
    - [Signal carried in the blood to any cell with the receptor, Endocrine system]
    - [Response within milliseconds, Nervous system]
    - [Chemical messenger crosses a synapse, Nervous system]
    - [Effects can last for hours, Endocrine system]
  explanation: 'Nerve signals are electrical along the axon and chemical across a synapse, fast and brief, and reach only the cells the neuron connects to. Hormones travel in the blood, act on any cell with a matching receptor, and are slower but longer lasting.'
- id: bio-q-0942
  lesson: bio-transport-systems
  module_quiz: true
  topic: Circulatory system
  type: label
  stem: 'Name the numbered parts of this heart, drawn as seen from the front (the heart''s right side is on your left).'
  image: {src: images/m9-heart-blank.svg, alt: 'A schematic heart seen from the front with four chambers and the large vessels attached. Numbered markers sit in each of the four chambers, on the arched vessel leaving the thick-walled lower chamber, and on the vessel leading to the lungs.'}
  labels:
    - {x: 29.8, y: 39.0, text: Right atrium}
    - {x: 29.8, y: 66.0, text: Right ventricle}
    - {x: 67.7, y: 39.0, text: Left atrium}
    - {x: 64.5, y: 70.0, text: Left ventricle}
    - {x: 72.6, y: 6.0, text: Aorta}
    - {x: 16.1, y: 19.0, text: Pulmonary artery}
  distractors: [Vena cava, Pulmonary vein]
  explanation: 'Seen from the front, the right atrium (1) and right ventricle (2) are on your left; they handle oxygen-poor blood and send it up the pulmonary artery (6) to the lungs. Blood returns to the left atrium (3), and the thick-walled left ventricle (4) pumps it into the aorta (5), which arches over to the body. The vena cava brings blood into the right atrium and the pulmonary veins enter the left atrium; neither is marked.'
- id: bio-q-0943
  lesson: bio-transport-systems
  topic: Circulatory system
  type: order
  stem: 'Put the stops of a red blood cell in order, starting in the right atrium.'
  items:
    - Right atrium
    - Right ventricle
    - Pulmonary artery
    - Lung capillaries
    - Pulmonary vein
    - Left atrium
    - Left ventricle
  explanation: 'The right side pumps blood to the lungs (pulmonary circuit) and it comes back to the left side, which pumps it to the body through the aorta. Atrium always comes before ventricle on each side.'
- id: bio-q-0944
  lesson: bio-transport-systems
  topic: Excretory system
  type: text
  stem: 'The kidney''s filtering units are called ___. In each one, blood pressure pushes fluid out of a ball of capillaries called the ___.'
  accept:
    - [nephrons, nephron]
    - [glomerulus, glomeruli]
  explanation: 'About a million nephrons in each kidney filter blood at the glomerulus, then reabsorb what the body needs and secrete some wastes along the tubule.'
- id: bio-q-0945
  lesson: bio-transport-systems
  module_quiz: true
  topic: Respiratory system
  stem: 'Which features make the alveoli efficient at gas exchange? Select all that apply.'
  choices:
    - Walls only one thin cell thick
    - A huge total surface area
    - A dense network of surrounding capillaries
    - Muscular walls that pump air in and out
  answer: [0, 1, 2]
  explanation: 'Diffusion is fast over short distances and large areas, and capillaries keep carrying oxygen away and bringing carbon dioxide, so the gradients stay steep. Alveoli have no muscle of their own; the diaphragm and rib muscles move air.'
- id: bio-q-0946
  lesson: bio-transport-systems
  topic: Excretory system
  type: match
  stem: 'Match each event in urine formation to where it happens.'
  pairs:
    - [Blood pressure pushes water and small molecules out of the blood, Glomerulus and capsule]
    - [Nearly all glucose and amino acids are reclaimed, Proximal tubule]
    - [Water reabsorption is adjusted by ADH, Collecting duct]
  distractors: [Bladder]
  explanation: 'Filtration happens at the glomerulus; the proximal tubule reabsorbs most of what the body needs, including nearly all glucose; ADH makes the collecting ducts more permeable to water. The bladder only stores urine.'
- id: bio-q-0947
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Digestive system
  type: label
  stem: 'Name the numbered organs of the digestive system.'
  image: {src: images/m9-digestive-blank.svg, alt: 'A schematic digestive system with six numbered organs: a tube running down from the mouth, a large organ on the body''s right, a J-shaped sac, a narrow organ beneath it, a long coiled tube in the center, and a wider tube framing it.'}
  labels:
    - {x: 48.7, y: 18.3, text: Esophagus}
    - {x: 25.0, y: 33.3, text: Liver}
    - {x: 71.7, y: 35.8, text: Stomach}
    - {x: 75.0, y: 52.0, text: Pancreas}
    - {x: 61.3, y: 72.8, text: Small intestine}
    - {x: 31.0, y: 75.0, text: Large intestine}
  distractors: [Gallbladder, Kidney]
  explanation: 'Food goes down the esophagus (1) to the stomach (3), then through the long, coiled small intestine (5), framed by the wider large intestine (6). The liver (2) makes bile and the pancreas (4) makes digestive enzymes; both send them into the small intestine. The gallbladder, the small sac under the liver, isn''t marked.'
- id: bio-q-0948
  lesson: bio-digestion-immunity
  topic: Digestive system
  type: order
  stem: 'Put the parts of the digestive tract in the order food passes through them.'
  items: [Mouth, Esophagus, Stomach, Small intestine, Large intestine]
  explanation: 'Mouth (chewing, amylase), esophagus (peristalsis), stomach (acid and pepsin), small intestine (most digestion and absorption), large intestine (water and salts). The liver and pancreas aren''t on the path; their secretions enter through ducts.'
- id: bio-q-0949
  lesson: bio-digestion-immunity
  topic: Digestive system
  type: match
  stem: 'Match each digestive secretion to what it does.'
  pairs:
    - [Amylase, Breaks starch into sugars]
    - [Pepsin, Begins protein digestion in the stomach]
    - [Lipase, Breaks fats into fatty acids and glycerol]
    - [Bile, Breaks fat into tiny droplets without digesting it]
  distractors: [Absorbs water in the colon]
  explanation: 'Each enzyme acts on one class of macromolecule: amylase on starch, pepsin (and later trypsin) on proteins, lipase on fats. Bile has no enzymes; it emulsifies fat so lipase has more surface. Water absorption in the colon isn''t done by a secretion.'
- id: bio-q-0950
  lesson: bio-digestion-immunity
  topic: Immune system
  type: text
  stem: 'Antibodies are made by ___ cells. After an infection, long-lived ___ cells allow a faster, stronger response to the same antigen.'
  accept:
    - [B, B lymphocyte, B lymphocytes, plasma, plasma B, B cell, B cells, plasma cell, plasma cells]
    - [memory, memory B, memory B and T]
  explanation: 'B cells (as antibody-secreting plasma cells) make antibodies. Memory B and T cells remain after the first response, which is why a second exposure, or a vaccine booster, produces a faster and larger response.'
- id: bio-q-0951
  lesson: bio-digestion-immunity
  module_quiz: true
  topic: Immune system
  stem: 'Which of these belong to innate immunity? Select all that apply.'
  choices:
    - Stomach acid killing swallowed microbes
    - Inflammation around a cut
    - Antibodies against one strain of flu
    - Phagocytes engulfing any bacteria they meet
    - Memory cells from a past infection
  answer: [0, 1, 3]
  explanation: 'Innate defenses are present from birth and act the same way against any invader: barriers such as stomach acid, inflammation and general phagocytes. Antibodies and memory cells are specific to one antigen, so they belong to adaptive immunity.'
- id: bio-qh-0901
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'A cell has K⁺ at 4 mM outside and 160 mM inside. Using $E = 61.5 \log_{10}\dfrac{[\text{out}]}{[\text{in}]}$ mV, what is the K⁺ equilibrium potential?'
  choices: ['$+98.5$ mV', '$-61.5$ mV', '$-98.5$ mV', '$-226.9$ mV']
  answer: 2
  explanation: '$\log_{10}(4/160) = \log_{10}(0.025) = -1.602$, and $61.5 \times (-1.602) \approx -98.5$ mV. $+98.5$ comes from flipping the ratio (in/out); $-226.9$ uses the natural log instead of $\log_{10}$; $-61.5$ is just the constant. K⁺ tends to leak out, so the inside must be negative to hold it in.'
- id: bio-qh-0902
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'The resting potential (about −70 mV) lies between $E_{\text{K}}$ (about −90 mV) and $E_{\text{Na}}$ (about +60 mV), but much closer to $E_{\text{K}}$. Why?'
  choices:
    - At rest the membrane is far more permeable to K⁺ than to Na⁺.
    - There is more K⁺ than Na⁺ outside the cell.
    - The Na⁺/K⁺ pump moves K⁺ out of the cell.
    - Voltage-gated Na⁺ channels are open at rest.
  answer: 0
  explanation: 'The membrane potential moves toward the equilibrium potential of whichever ion the membrane is most permeable to. At rest, leak channels make it mostly permeable to K⁺, with a small Na⁺ leak pulling it a little positive of $E_{\text{K}}$. Outside, Na⁺ is far more concentrated than K⁺; the pump moves K⁺ in, not out; voltage-gated Na⁺ channels are closed at rest.'
- id: bio-qh-0903
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'If the K⁺ concentration in the fluid around neurons rises well above normal, what happens to their resting potential?'
  choices:
    - It becomes more negative, because more K⁺ leaks out.
    - It doesn't change, because the pump keeps the gradient constant.
    - It reverses to about +60 mV.
    - It becomes less negative (depolarized), because $E_{\text{K}}$ becomes less negative.
  answer: 3
  explanation: 'More K⁺ outside brings the ratio out/in closer to 1, so its logarithm, and $E_{\text{K}} = 61.5\log_{10}([\text{K}]_{\text{out}}/[\text{K}]_{\text{in}})$, is less negative, and the K⁺-dominated resting potential follows it toward threshold. (Doubling outside K⁺ from 5 to 10 mM moves $E_{\text{K}}$ from about −89 to about −70 mV.) This is why blood K⁺ is tightly regulated, especially for heart cells.'
- id: bio-qh-0904
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'Why does the action potential peak near +35 mV and then fall, instead of staying positive?'
  choices:
    - The cell runs out of Na⁺ ions.
    - Na⁺ channels inactivate and voltage-gated K⁺ channels open, so K⁺ flows out.
    - The Na⁺/K⁺ pump suddenly speeds up and pumps the Na⁺ back out.
    - Neurotransmitter is released and pulls the voltage down.
  answer: 1
  explanation: 'Within about a millisecond, an inactivation gate plugs the Na⁺ channels while the slower K⁺ channels open; the membrane becomes mostly permeable to K⁺ and the voltage heads back toward $E_{\text{K}}$. Very few ions move in one spike, so Na⁺ doesn''t run out, and the pump is far too slow to shape a single spike.'
- id: bio-qh-0905
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'Tetrodotoxin (TTX) blocks voltage-gated Na⁺ channels. What would you expect in an axon treated with TTX?'
  choices:
    - Action potentials fire more often.
    - The resting potential becomes strongly positive.
    - No action potentials can fire, but the resting potential barely changes.
    - Action potentials fire but travel backward.
  answer: 2
  explanation: 'The rising phase depends on voltage-gated Na⁺ channels, so no spike can start. The resting potential is set mainly by K⁺ leak channels and the gradients, which TTX doesn''t touch, so it stays close to normal. That''s why TTX was so useful for separating the Na⁺ current from the others.'
- id: bio-qh-0906
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'An axon is stimulated twice. With 0.8 ms between stimuli, even a very strong second stimulus fails to fire. With 1.5 ms, a second spike fires only if the stimulus is 3 times the normal threshold strength. With 6 ms, a normal stimulus works. Which conclusion is supported?'
  choices:
    - The absolute refractory period lasts at least 0.8 ms, and the relative refractory period covers at least part of the time from 1.5 ms to 6 ms.
    - The absolute refractory period lasts at least 6 ms.
    - The axon has no refractory period; the stimulator was faulty at 0.8 ms.
    - The relative refractory period comes before the absolute refractory period.
  answer: 0
  explanation: 'No stimulus at all works during the absolute refractory period (Na⁺ channels inactivated), so it lasts at least 0.8 ms. A spike that needs a stronger stimulus marks the relative refractory period, which follows the absolute one. By 6 ms the axon has recovered, so the absolute period can''t be that long.'
- id: bio-qh-0907
  lesson: bio-h-neurons
  topic: Action potential
  stem: 'In a myelinated axon, why are voltage-gated Na⁺ channels concentrated at the nodes of Ranvier?'
  choices:
    - Myelin itself conducts the action potential, so channels are only needed at the ends.
    - The nodes are where neurotransmitter is released.
    - Na⁺ channels at the nodes pump Na⁺ out to keep the axon at rest.
    - The action potential is regenerated only at the nodes; under the myelin, current spreads passively and quickly to the next node.
  answer: 3
  explanation: 'Myelin insulates the axon so current from one node spreads quickly to the next with little loss; the slow step, opening channels, happens only at the nodes. That''s saltatory conduction. Myelin doesn''t carry the impulse, transmitter release happens at the axon terminals, and pumps are not channels.'
- id: bio-qh-0908
  lesson: bio-h-neurons
  topic: Synapses
  stem: 'An SSRI blocks the serotonin reuptake transporter. What is its direct effect at the synapse?'
  choices:
    - Less serotonin is released from the vesicles.
    - Serotonin stays in the synaptic cleft longer, prolonging its action on the receptors.
    - The serotonin receptors on the next cell are blocked.
    - Serotonin is broken down faster by enzymes.
  answer: 1
  explanation: 'Reuptake is one way a transmitter''s signal is ended. Blocking the transporter leaves serotonin in the cleft longer. A receptor blocker would stop the transmitter acting at all, and release isn''t directly changed. This describes the mechanism only; the drug''s effects on a person are far more complex.'
- id: bio-qh-0909
  lesson: bio-h-neurons
  topic: Synapses
  stem: 'A reflex uses a sensory axon and a motor axon, each 0.75 m long and conducting at 50 m/s, with two synapses of 0.5 ms each. Ignoring muscle contraction, what is the reflex time?'
  choices: ['16 ms', '30 ms', '31 ms', '3.1 ms']
  answer: 2
  explanation: 'Path $= 2 \times 0.75 = 1.5$ m, so conduction takes $1.5/50 = 0.030$ s $= 30$ ms. Two synapses add $2 \times 0.5 = 1$ ms: total 31 ms. 30 ms leaves out the synapses; 16 ms counts only one axon; 3.1 ms is a unit slip.'
- id: bio-qh-0910
  lesson: bio-h-neurons
  topic: Action potential
  type: label
  stem: 'Name the numbered parts of this action potential recording.'
  image: {src: images/m9-action-potential-blank.svg, alt: 'A graph of membrane potential in millivolts against time in milliseconds for one action potential, with a dashed horizontal line at about −55 mV. Five numbered markers sit at different points on the curve, from the flat start through the spike to the dip afterward.'}
  labels:
    - {x: 19.4, y: 68.2, text: Resting potential}
    - {x: 32.6, y: 61.4, text: Threshold}
    - {x: 36.4, y: 36.4, text: Depolarization (rising phase)}
    - {x: 46.5, y: 45.5, text: Repolarization (falling phase)}
    - {x: 59.7, y: 72.7, text: Hyperpolarization (undershoot)}
  distractors: [Synaptic delay, Equilibrium potential of Na⁺]
  explanation: 'The flat line at about −70 mV is the resting potential (1). At about −55 mV, threshold (2), voltage-gated Na⁺ channels open in a rush, and Na⁺ entry drives the rising phase (3). Na⁺ channels then inactivate and K⁺ channels open: the falling phase (4). Slow-closing K⁺ channels carry the potential below rest, toward $E_{\text{K}}$: the undershoot (5). $E_{\text{Na}}$ (about +60 mV) is above the peak and isn''t marked.'
- id: bio-qh-0911
  lesson: bio-h-neurons
  topic: Synapses
  type: order
  stem: 'Put the events of chemical synaptic transmission in order.'
  items:
    - An action potential reaches the axon terminal
    - Voltage-gated Ca²⁺ channels open and Ca²⁺ flows in
    - Vesicles fuse with the membrane and release neurotransmitter
    - Neurotransmitter diffuses across the cleft and binds receptors
    - Ligand-gated channels open in the postsynaptic membrane
    - Neurotransmitter is removed by an enzyme or by reuptake
  explanation: 'Electrical signal, then Ca²⁺ entry (the trigger for release), exocytosis, diffusion and binding, the postsynaptic response, and finally removal so that each signal is brief. The whole sequence takes about half a millisecond.'
- id: bio-qh-0912
  lesson: bio-h-neurons
  topic: Action potential
  type: text
  stem: 'The gaps in the myelin sheath, where action potentials are regenerated, are called nodes of ___. Conduction that skips from gap to gap is called ___ conduction.'
  accept:
    - [Ranvier]
    - [saltatory]
  explanation: 'Nodes of Ranvier are packed with voltage-gated Na⁺ channels; between them, myelin insulates the axon. Saltatory (from the Latin for "to leap") conduction is much faster than continuous conduction along an unmyelinated axon of the same width.'
- id: bio-qh-0913
  lesson: bio-h-neurons
  topic: Synapses
  type: match
  stem: 'Match each toxin or drug to its target.'
  pairs:
    - [Tetrodotoxin, Voltage-gated Na⁺ channels]
    - [Botulinum toxin, Release of acetylcholine from vesicles]
    - [Curare, Acetylcholine receptors on muscle]
    - [Organophosphate nerve agents, Acetylcholinesterase]
  distractors: [Serotonin reuptake transporter]
  explanation: 'TTX blocks the channels that make the rising phase. Botulinum toxin prevents vesicles fusing, so no acetylcholine is released. Curare sits on the muscle''s receptors so acetylcholine can''t bind. Organophosphates inhibit the enzyme that breaks acetylcholine down, so it builds up. The serotonin transporter is the target of SSRIs.'
- id: bio-qh-0914
  lesson: bio-h-neurons
  topic: Synapses
  stem: 'Which of these make a postsynaptic neuron more likely to fire an action potential? Select all that apply.'
  choices:
    - A transmitter opening Na⁺ channels in its membrane
    - Many EPSPs arriving close together in time
    - A transmitter opening Cl⁻ channels that let Cl⁻ in
    - Extra GABA binding its receptors
  answer: [0, 1]
  explanation: 'Na⁺ entry depolarizes the membrane (an EPSP), and EPSPs arriving close together add up (temporal summation) toward threshold. Cl⁻ entry pushes the inside more negative, an IPSP; GABA, the main inhibitory transmitter, typically works this way.'
- id: bio-qh-0915
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'According to the clonal selection theory, when does a B cell acquire its ability to bind one particular antigen?'
  choices:
    - Before it ever meets that antigen, through random rearrangement of its antibody genes
    - When the antigen binds and reshapes its receptor to fit
    - When a helper T cell tells it which antibody to make
    - After it has divided into plasma cells
  answer: 0
  explanation: 'Specificity is generated randomly while the B cell develops (V(D)J recombination), before any antigen arrives. Antigen only selects the cells that already fit and makes them multiply. The idea that antigen instructs or molds the receptor was the older, disproved "instructive" theory; helper T cells activate B cells but don''t choose their specificity.'
- id: bio-qh-0916
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'A species has 50 V, 20 D and 5 J heavy-chain segments, 35 V and 5 J kappa segments, and 25 V and 4 J lambda segments. Counting segment choices only, how many heavy-light chain pairs are possible?'
  choices: ['75', '5,275', '875,000', '1,375,000']
  answer: 3
  explanation: 'Heavy chains: $50 \times 20 \times 5 = 5{,}000$. Light chains: $35 \times 5 + 25 \times 4 = 175 + 100 = 275$ (a cell uses kappa or lambda, so add). Pairs: $5{,}000 \times 275 = 1{,}375{,}000$. 875,000 forgets the lambda chains; 5,275 adds heavy and light instead of multiplying; 75 adds the heavy segments.'
- id: bio-qh-0917
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'What determines whether an antibody is IgG, IgM, IgA or IgE?'
  choices:
    - The variable regions of the light chains
    - The constant region of the heavy chains
    - Which antigen the antibody binds
    - Whether the antibody was made by a T cell or a B cell
  answer: 1
  explanation: 'The heavy-chain constant region defines the class and decides what the antibody does (cross the placenta, enter secretions, bind mast cells). In class switching, the constant region changes while the variable regions, and so the antigen bound, stay the same. Antibodies are made only by B cells.'
- id: bio-qh-0918
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'A patient''s blood has IgM antibodies against a virus but no IgG against it. What is the most likely interpretation?'
  choices:
    - The patient was vaccinated against the virus years ago.
    - The patient is immune and has memory cells from a past infection.
    - The patient has a recent, first infection with the virus.
    - The patient cannot make antibodies.
  answer: 2
  explanation: 'IgM is the first class made in a primary response; switching to IgG takes longer. IgM without IgG points to a recent first exposure. A past infection or vaccination would show IgG (with IgM gone), and the patient is clearly making antibodies.'
- id: bio-qh-0919
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'Which statement about MHC class I is correct?'
  choices:
    - It is on nearly all nucleated cells and displays peptides from proteins made inside the cell to cytotoxic (CD8) T cells.
    - It is found only on antigen-presenting cells and displays engulfed material to helper T cells.
    - It is an antibody that circulates in the blood.
    - It displays whole, unbroken viruses on the cell surface.
  answer: 0
  explanation: 'Class I lets any infected or cancerous cell show what it is making, so cytotoxic T cells can find and kill it. The description of antigen-presenting cells and helper T cells is MHC class II. MHC proteins are membrane proteins, not antibodies, and they hold short peptides, not whole viruses.'
- id: bio-qh-0920
  lesson: bio-h-immunology
  topic: Adaptive immunity
  stem: 'Cytotoxic T cells from virus-infected mice of strain A killed infected strain A cells but not strain B cells infected with the same virus. What does this show?'
  choices:
    - Strain B cells can't be infected by the virus.
    - The T cells recognize uninfected strain A cells as foreign.
    - Cytotoxic T cells kill any cell carrying the virus, regardless of strain.
    - The T cells recognize the viral antigen only when it is presented on their own strain's MHC.
  answer: 3
  explanation: 'This is MHC restriction (Zinkernagel and Doherty, 1974): the T-cell receptor sees viral peptide and self-MHC together. Strain B cells carried the virus, so infection wasn''t the issue, and uninfected strain A cells weren''t killed, so the T cells weren''t attacking self.'
- id: bio-qh-0921
  lesson: bio-h-immunology
  topic: Vaccines
  stem: 'A disease has $R_0 = 5$. In a community, 80% of people are vaccinated with a vaccine that protects 90% of recipients, and no one else is immune. What is $R_{\text{eff}}$?'
  choices: ['1.00', '1.40', '3.60', '0.28']
  answer: 1
  explanation: 'Immune fraction $= 0.80 \times 0.90 = 0.72$, so susceptible $= 0.28$ and $R_{\text{eff}} = 5 \times 0.28 = 1.40$, above 1, so an outbreak could grow. 1.00 ignores vaccine effectiveness ($5 \times 0.20$); 3.60 multiplies by the immune fraction instead of the susceptible one; 0.28 is the susceptible fraction itself.'
- id: bio-qh-0922
  lesson: bio-h-immunology
  topic: Vaccines
  stem: 'A disease has $R_0 = 6$ and a vaccine is 95% effective. What vaccination coverage is needed to reach the herd immunity threshold?'
  choices: ['83.3%', '79.2%', '87.7%', '17.5%']
  answer: 2
  explanation: 'Threshold $= 1 - \tfrac16 = 0.833$ immune. Since only 95% of the vaccinated become immune, coverage $= 0.833 / 0.95 \approx 0.877$, or 87.7%. 83.3% forgets effectiveness; 79.2% multiplies by 0.95 instead of dividing; 17.5% starts from $1/R_0$.'
- id: bio-qh-0923
  lesson: bio-h-immunology
  topic: Vaccines
  stem: 'A newborn is protected by IgG antibodies that crossed the placenta, but the protection fades over a few months. Why?'
  choices:
    - The baby's immune system destroys the mother's antibodies as foreign.
    - IgG can only work inside the mother's body.
    - The antibodies switch class to IgM after birth.
    - This is passive immunity, so no memory cells were made and the borrowed antibodies are gradually broken down.
  answer: 3
  explanation: 'Antibodies received from someone else protect at once, but nothing replaces them as they''re cleared, because the baby''s own B cells never responded. Only active immunity (infection or vaccination) makes memory cells. Maternal IgG works in the baby; it isn''t treated as foreign, and class switching happens in B cells, not in circulating antibodies.'
- id: bio-qh-0924
  lesson: bio-h-immunology
  topic: Adaptive immunity
  type: label
  stem: 'Name the numbered parts of this antibody and what it is binding.'
  image: {src: images/m9-antibody-blank.svg, alt: 'A Y-shaped antibody made of four chains, with a small irregular shape bound at the tip of the left arm. Numbered markers sit on the bound shape, the stem, the outer chain of the right arm, and the very tip of the right arm.'}
  labels:
    - {x: 25.0, y: 22.5, text: Antigen}
    - {x: 51.9, y: 85.4, text: Heavy chain}
    - {x: 62.8, y: 43.7, text: Light chain}
    - {x: 71.9, y: 26.3, text: Antigen-binding site}
  distractors: [MHC protein, T-cell receptor]
  explanation: 'The antigen (1) binds at the tip of an arm. The two long heavy chains (2) form the stem and the inner part of each arm; the shorter light chains (3) lie along the outside of the arms. At the tip of each arm, the variable regions of one heavy and one light chain fold together into an antigen-binding site (4), here empty on the right arm. MHC proteins and T-cell receptors are different molecules on cell surfaces.'
- id: bio-qh-0925
  lesson: bio-h-immunology
  topic: Adaptive immunity
  type: order
  stem: 'Put the events of a B-cell response in order.'
  items:
    - Gene rearrangement gives a developing B cell one receptor specificity
    - Antigen binds the receptors of the matching B cell
    - A helper T cell recognizing the same antigen activates the B cell
    - The B cell divides repeatedly into a clone
    - Clone members become antibody-secreting plasma cells and memory cells
  explanation: 'Specificity comes first, before any antigen; antigen then selects the matching cell, a helper T cell gives the second signal, the cell multiplies, and the clone produces both effectors (plasma cells) and memory cells. That''s clonal selection.'
- id: bio-qh-0926
  lesson: bio-h-immunology
  topic: Adaptive immunity
  type: match
  stem: 'Match each antibody class to its key feature.'
  pairs:
    - [IgM, First class made in a primary response]
    - [IgG, Crosses the placenta to protect a fetus]
    - [IgA, Guards mucous membranes and is in breast milk]
    - [IgE, Binds mast cells and triggers allergic reactions]
  distractors: [Presents peptides to T cells]
  explanation: 'IgM (five Y units) comes first; IgG is the most abundant in blood, dominates secondary responses and crosses the placenta; IgA is secreted in mucus, saliva, tears and milk; IgE binds mast cells. Presenting peptides to T cells is the job of MHC proteins, not antibodies.'
- id: bio-qh-0927
  lesson: bio-h-immunology
  topic: Adaptive immunity
  type: text
  stem: 'Helper T cells recognize peptides displayed on MHC class ___, and they carry the marker protein CD___.'
  accept:
    - [II, 2, two]
    - [4, four]
  explanation: 'Helper T cells are CD4 cells that recognize peptides on MHC class II, found on antigen-presenting cells. Cytotoxic T cells are CD8 cells that recognize MHC class I.'
- id: bio-qh-0928
  lesson: bio-h-immunology
  topic: Vaccines
  stem: 'Which changes would raise the vaccination coverage needed to reach herd immunity? Select all that apply.'
  choices:
    - A pathogen with a higher $R_0$
    - A vaccine that protects a smaller share of recipients
    - A pathogen with a lower $R_0$
    - A vaccine that protects a larger share of recipients
  answer: [0, 1]
  explanation: 'Coverage needed $= (1 - 1/R_0)/E$. A higher $R_0$ raises the numerator, and a lower effectiveness $E$ shrinks the denominator; both push the needed coverage up. A lower $R_0$ or a more effective vaccine lowers it.'
- id: bio-qh-0929
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'Why do the effects of a steroid hormone such as cortisol usually take hours to appear?'
  choices:
    - Steroids travel very slowly in the blood.
    - The hormone-receptor complex changes gene expression, so new mRNA and proteins must be made.
    - Steroid hormones must first be converted into peptide hormones.
    - Steroid receptors are on the cell surface and must be carried inside.
  answer: 1
  explanation: 'Steroids cross the membrane and bind receptors inside the cell; the complex acts as a transcription factor, so the response waits on transcription and translation. Blood carries hormones around the body in about a minute, steroids aren''t converted into peptides, and their receptors are inside the cell.'
- id: bio-qh-0930
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'Glucagon is a peptide hormone. Where are its receptors, and why?'
  choices:
    - On the target cell's surface, because a water-soluble peptide can't cross the lipid bilayer
    - In the nucleus, because glucagon acts directly on DNA
    - In the cytoplasm, because glucagon dissolves in the membrane
    - In the blood, bound to carrier proteins
  answer: 0
  explanation: 'Peptide hormones are water-soluble and can''t diffuse through the hydrophobic core of the membrane, so they bind surface receptors and act through second messengers such as cAMP. Internal receptors are for lipid-soluble hormones (steroids, thyroid hormone); carrier proteins in blood transport steroids but are not receptors.'
- id: bio-qh-0931
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'A hormone is at 120 units when its secretion stops. Its half-life in the blood is 10 minutes. What is its level 30 minutes later?'
  choices: ['60 units', '40 units', '30 units', '15 units']
  answer: 3
  explanation: '30 minutes is 3 half-lives: $120 \to 60 \to 30 \to 15$. 60 is one half-life; 30 is two; 40 divides by 3 instead of halving three times.'
- id: bio-qh-0932
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'A patient has high TSH and low T4. Where is the problem most likely to be?'
  choices:
    - The pituitary is making too little TSH.
    - The thyroid is overactive.
    - The thyroid is underactive, and the pituitary is responding to the lack of feedback.
    - The hypothalamus is making too little TRH.
  answer: 2
  explanation: 'Low T4 removes negative feedback, so a healthy pituitary releases more TSH. High TSH with low T4 means the thyroid isn''t responding: primary hypothyroidism. A failing pituitary or hypothalamus would give low TSH with low T4; an overactive thyroid gives high T4 and low TSH.'
- id: bio-qh-0933
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'Why does long-term iodine deficiency cause the thyroid to enlarge into a goiter?'
  choices:
    - Iodine normally shrinks the thyroid directly.
    - Without iodine, little T4 is made, feedback weakens, and constant high TSH stimulates the gland to grow.
    - The body stores unused iodine in the thyroid, which swells.
    - High T4 levels overstimulate the thyroid.
  answer: 1
  explanation: 'T4 contains iodine, so without it T4 falls. Less T4 means less negative feedback on the hypothalamus and pituitary, TSH stays high, and the continuous stimulation enlarges the gland. T4 is low, not high, and there''s no excess iodine to store.'
- id: bio-qh-0934
  lesson: bio-h-endocrine
  topic: Glucose regulation
  stem: 'Using the criteria in the lesson (fasting: under 100 normal, 100–125 prediabetes, 126 or more diabetes; 2 hours: under 140 normal, 140–199 prediabetes, 200 or more diabetes), how would you classify a fasting glucose of 108 mg/dL and a 2-hour value of 185 mg/dL?'
  choices:
    - Prediabetes range on both measures
    - Normal
    - Diabetes range on both measures
    - Diabetes range on the 2-hour value only
  answer: 0
  explanation: '108 is in the 100–125 band and 185 is in the 140–199 band, so both are in the prediabetes range. Neither reaches the diabetes cutoffs (126 fasting, 200 at 2 hours), and both are above normal. A real diagnosis is confirmed by repeat testing.'
- id: bio-qh-0935
  lesson: bio-h-endocrine
  topic: Glucose regulation
  stem: 'A person has high fasting blood glucose and also high fasting insulin. Which explanation fits best?'
  choices:
    - Type 1 diabetes, because the beta cells have been destroyed
    - Too much glucagon and no insulin
    - Normal glucose regulation
    - Insulin resistance, as in type 2 diabetes: insulin is present but cells respond poorly
  answer: 3
  explanation: 'Plenty of insulin that fails to lower glucose means the target cells aren''t responding: insulin resistance, the hallmark of type 2 diabetes. Type 1 would show low insulin; "no insulin" contradicts the data; high fasting glucose isn''t normal.'
- id: bio-qh-0936
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'A patient makes large volumes of dilute urine. After an injection of desmopressin (synthetic ADH), the urine stays dilute. What is the most likely cause?'
  choices:
    - Central diabetes insipidus: the pituitary releases too little ADH.
    - Type 1 diabetes mellitus
    - Nephrogenic diabetes insipidus: the kidney doesn't respond to ADH.
    - Drinking too little water
  answer: 2
  explanation: 'If the problem were missing ADH (central), supplying it would concentrate the urine. No response means the collecting ducts can''t respond to ADH: nephrogenic diabetes insipidus. Diabetes mellitus involves glucose and insulin, and drinking too little would give concentrated urine.'
- id: bio-qh-0937
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'A person must excrete 720 mOsm of solutes a day, and their kidneys can concentrate urine to at most 1,200 mOsm per liter. What is the smallest daily urine volume possible?'
  choices: ['0.6 L', '1.67 L', '6.0 L', '0.06 L']
  answer: 0
  explanation: 'Volume $=$ solutes $\div$ concentration $= 720 / 1200 = 0.6$ L. 1.67 L divides the wrong way round ($1200/720$); 6.0 L and 0.06 L are decimal slips.'
- id: bio-qh-0938
  lesson: bio-h-endocrine
  topic: Glucose regulation
  type: order
  stem: 'Put the steps of insulin release from a beta cell in order.'
  items:
    - Glucose enters the beta cell
    - Respiration of glucose raises the cell's ATP
    - ATP-sensitive K⁺ channels close
    - The membrane depolarizes and voltage-gated Ca²⁺ channels open
    - Ca²⁺ enters and triggers exocytosis of insulin
  explanation: 'The beta cell measures glucose by burning it: more ATP closes K⁺ channels, the reduced K⁺ leak depolarizes the membrane, Ca²⁺ channels open, and Ca²⁺ triggers release, the same logic as transmitter release at a synapse.'
- id: bio-qh-0939
  lesson: bio-h-endocrine
  topic: Hormone signaling
  type: match
  stem: 'Match each hormone to where it comes from.'
  pairs:
    - [ADH, Made by hypothalamic neurons and released from the posterior pituitary]
    - [TSH, Anterior pituitary]
    - [Insulin, Beta cells of the pancreas]
    - [Cortisol, Adrenal cortex]
  distractors: [Thyroid gland]
  explanation: 'ADH and oxytocin are made in the hypothalamus and released from the posterior pituitary. TSH is a tropic hormone from the anterior pituitary. Insulin comes from pancreatic beta cells, cortisol from the adrenal cortex (at the end of the CRH, ACTH axis). The thyroid makes T4 and T3, not any of these.'
- id: bio-qh-0940
  lesson: bio-h-endocrine
  topic: Hormone signaling
  type: text
  stem: 'ADH makes collecting-duct cells insert water channel proteins called ___ into their membranes.'
  accept: [aquaporins, aquaporin, aquaporin-2, aquaporin 2, AQP2]
  explanation: 'Through cAMP, ADH moves aquaporins into the collecting-duct membrane, so water can flow out into the salty tissue around the duct and return to the blood.'
- id: bio-qh-0941
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'Which hormones act mainly by binding receptors inside their target cells? Select all that apply.'
  choices: [Cortisol, Estrogen, Insulin, Glucagon, Thyroid hormone (T3)]
  answer: [0, 1, 4]
  explanation: 'Cortisol and estrogen are lipid-soluble steroids, and thyroid hormone, though not a steroid, also crosses the membrane; all three bind receptors inside the cell and change gene expression. Insulin and glucagon are peptides that bind surface receptors.'
- id: bio-qh-0942
  lesson: bio-h-endocrine
  topic: Hormone signaling
  stem: 'In the cycle data from the lesson, estradiol rose from 50 to 180 pg/mL between days 6 and 11 while LH stayed near 6–7 IU/L; on day 13, after estradiol had been above 200 for about a day, LH jumped to 45 IU/L. Which conclusion is best supported?'
  choices:
    - Estradiol has no effect on LH.
    - Estradiol first restrains LH (negative feedback), then, once high for long enough, triggers an LH surge (positive feedback).
    - LH controls estradiol only by negative feedback.
    - The LH surge causes estradiol to rise from day 6 to day 11.
  answer: 1
  explanation: 'A large rise in estradiol with flat LH shows LH being held down; the sudden LH surge after sustained high estradiol shows the switch to positive feedback. The surge came after the estradiol rise, so it can''t have caused it, and the jump rules out "no effect".'
