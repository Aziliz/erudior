- id: bio-q-0301
  lesson: bio-energy-atp
  module_quiz: true
  topic: Energy
  stem: 'A student writes, "Plants create energy from sunlight." Which statement best corrects the student?'
  choices:
    - 'Plants create energy only during the day, not at night.'
    - 'Plants get their energy from minerals in the soil, not sunlight.'
    - 'Plants destroy light energy and replace it with chemical energy.'
    - 'Plants convert light energy into chemical energy; energy is never created.'
  answer: 3
  explanation: |-
    The first law of thermodynamics says energy is converted, never created or destroyed. Photosynthesis converts light energy into chemical energy stored in sugar. Saying light is "destroyed" breaks the same law, and soil supplies minerals, not energy.
- id: bio-q-0302
  lesson: bio-energy-atp
  topic: Energy
  stem: 'Your cells capture roughly a third of the energy in glucose as ATP. What happens to most of the rest?'
  choices:
    - 'It is destroyed by the chemical reactions.'
    - 'It is stored in the carbon dioxide you exhale.'
    - 'It is released as heat.'
    - 'It is turned back into new glucose.'
  answer: 2
  explanation: |-
    The second law of thermodynamics: every energy conversion loses some energy as heat that can no longer do work. That heat keeps birds and mammals warm. Energy cannot be destroyed (first law), CO₂ is a low-energy waste product, and remaking glucose would cost energy, not save it.
- id: bio-q-0303
  lesson: bio-energy-atp
  module_quiz: true
  topic: Energy
  stem: 'Which of these is an anabolic process?'
  choices:
    - 'Joining amino acids into a protein'
    - 'Breaking glucose down to carbon dioxide and water'
    - 'Digesting starch into glucose'
    - 'Breaking down stored fat to release energy'
  answer: 0
  explanation: |-
    Anabolism builds large molecules from small ones and requires energy, as in protein synthesis. The other three break molecules down and release (or at least do not require) energy, so they are catabolic.
- id: bio-q-0304
  lesson: bio-energy-atp
  topic: Energy
  stem: 'The products of a reaction hold less free energy than its reactants. This reaction is'
  choices:
    - 'endergonic, so it needs energy from ATP to proceed'
    - 'exergonic, so it can proceed without an energy input'
    - 'anabolic, because it builds a larger molecule'
    - 'impossible, because energy cannot be lost'
  answer: 1
  explanation: |-
    Releasing free energy (products lower than reactants) is the definition of exergonic, and such reactions can proceed on their own (an enzyme may still be needed to make them fast). Endergonic is the opposite. The energy is not lost; it is released, often as heat.
- id: bio-q-0305
  lesson: bio-energy-atp
  module_quiz: true
  topic: ATP
  stem: 'Which parts make up a molecule of ATP?'
  choices:
    - 'Adenine, deoxyribose, and three phosphate groups'
    - 'Adenine, ribose, and three phosphate groups'
    - 'Adenine, ribose, and two phosphate groups'
    - 'Adenine, glucose, and three phosphate groups'
  answer: 1
  explanation: |-
    ATP is adenosine (adenine + the sugar ribose) triphosphate (three phosphates). Deoxyribose is the sugar in DNA, and two phosphates describes ADP.
- id: bio-q-0306
  lesson: bio-energy-atp
  topic: ATP
  stem: 'When a cell hydrolyzes ATP to power a process, what are the products?'
  choices:
    - 'AMP and a second molecule of ATP'
    - 'ADP and a molecule of glucose'
    - 'ADP and an inorganic phosphate group'
    - 'Adenine and three free phosphate groups'
  answer: 2
  explanation: |-
    Hydrolysis removes the last phosphate: ATP + H₂O → ADP + Pᵢ + energy. The cell later recharges ADP back to ATP. Glucose is not made from ATP, and only one phosphate is removed in the usual reaction.
- id: bio-q-0307
  lesson: bio-energy-atp
  module_quiz: true
  topic: ATP
  stem: 'A reaction needs 18 kJ/mol to proceed. It is coupled to the hydrolysis of one ATP, which releases 30.5 kJ/mol. What is the overall energy change, and can the coupled process proceed?'
  choices:
    - '−12.5 kJ/mol; yes, it can proceed'
    - '+12.5 kJ/mol; no, it cannot proceed'
    - '+48.5 kJ/mol; no, it cannot proceed'
    - '−48.5 kJ/mol; yes, it can proceed'
  answer: 0
  explanation: |-
    Add the two steps: −30.5 + 18 = −12.5 kJ/mol. A negative total means energy is released overall, so the coupled process can go. +12.5 reverses the signs; ±48.5 adds the sizes instead of combining a release with a requirement.
- id: bio-q-0308
  lesson: bio-energy-atp
  topic: ATP
  stem: 'An endergonic step requires 70 kJ/mol. If each ATP hydrolysis releases 30.5 kJ/mol, what is the smallest number of ATP that must be coupled to it?'
  choices: ['2', '1', '4', '3']
  answer: 3
  explanation: |-
    Two ATP release 61 kJ/mol, which is less than 70, so the total would still be uphill (+9 kJ/mol). Three ATP release 91.5 kJ/mol, giving −21.5 kJ/mol overall. Four would work but is not the smallest number.
- id: bio-q-0309
  lesson: bio-energy-atp
  topic: ATP
  stem: 'Your body holds only about 50 g of ATP at any moment, yet it uses roughly its own body mass of ATP every day. Which explains this?'
  choices:
    - 'Most ATP is stored in fat cells and released when needed.'
    - 'ATP is constantly regenerated from ADP and phosphate.'
    - 'ATP is absorbed directly from food in large amounts.'
    - 'Each ATP molecule can be hydrolyzed many times without changing.'
  answer: 1
  explanation: |-
    ATP is a currency, not a store. Each molecule is hydrolyzed to ADP and recharged over and over, many times a day. Long-term energy is stored as fat and glycogen, not ATP. Once hydrolyzed, ATP is ADP until it is recharged.
- id: bio-q-0310
  lesson: bio-energy-atp
  module_quiz: true
  topic: ATP
  stem: 'In the reaction NAD⁺ + 2 electrons + H⁺ → NADH, the NAD⁺ is'
  choices:
    - 'oxidized, because it gains electrons'
    - 'reduced, because it loses electrons'
    - 'oxidized, because it loses electrons'
    - 'reduced, because it gains electrons'
  answer: 3
  explanation: |-
    Reduction is gain of electrons (OIL RIG: oxidation is loss, reduction is gain). NAD⁺ picks up two electrons and becomes NADH, the reduced, electron-carrying form. The molecule that gave up the electrons was oxidized.
- id: bio-q-0311
  lesson: bio-energy-atp
  topic: Energy
  stem: 'Why do cells break glucose down in many small steps instead of one big reaction?'
  choices:
    - 'So energy is released in small amounts that can be captured as ATP instead of lost as heat'
    - 'Because a one-step reaction would release less total energy'
    - 'Because a one-step reaction would create energy and break the first law'
    - 'So that glucose can be broken down without any enzymes'
  answer: 0
  explanation: |-
    The total energy released is the same either way (a flame releases the same amount). Small steps let the cell trap the energy in usable packets (ATP, NADH) rather than releasing it all at once as heat. Each step needs its own enzyme, and no reaction creates energy.
- id: bio-q-0312
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  stem: 'Which are the raw materials (reactants) of photosynthesis?'
  choices:
    - 'Glucose and oxygen'
    - 'Oxygen and water'
    - 'Carbon dioxide and water'
    - 'Carbon dioxide and glucose'
  answer: 2
  explanation: |-
    6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂. Glucose and oxygen are the products; they are the reactants of cellular respiration, which is why the two processes are often called reverses of each other.
- id: bio-q-0313
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  stem: 'Algae are given water whose oxygen atoms are the heavy isotope ¹⁸O, with ordinary CO₂. The O₂ gas they release contains ¹⁸O. Which conclusion is best supported?'
  choices:
    - 'The oxygen gas released in photosynthesis comes from carbon dioxide.'
    - 'The oxygen gas comes equally from water and carbon dioxide.'
    - 'The oxygen in glucose comes from water.'
    - 'The oxygen gas released in photosynthesis comes from water.'
  answer: 3
  explanation: |-
    Only the water was labeled, and the label showed up in the O₂, so the O₂ comes from splitting water (Ruben and Kamen, 1941). The reverse experiment, labeling CO₂, gave unlabeled O₂. This experiment says nothing about glucose, whose oxygen actually comes from CO₂.
- id: bio-q-0314
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'Van Helmont''s willow gained about 164 pounds in five years while the soil lost only about 2 ounces. Where did most of the tree''s added dry mass actually come from?'
  choices:
    - 'Water absorbed by the roots'
    - 'Carbon dioxide taken from the air'
    - 'Minerals absorbed from the soil'
    - 'Sunlight converted into matter'
  answer: 1
  explanation: |-
    Most of a plant's dry mass is carbon compounds built from CO₂ fixed in the Calvin cycle. Van Helmont credited the water, because he never measured the air. The soil loss shows minerals contribute very little, and light supplies energy, not matter.
- id: bio-q-0315
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'In Priestley''s experiments, a mouse in a sealed jar with a sprig of mint in the light survived much longer than a mouse in a sealed jar alone. The best explanation is that the mint'
  choices:
    - 'released oxygen that the mouse used'
    - 'absorbed oxygen that would have harmed the mouse'
    - 'released carbon dioxide that the mouse needed'
    - 'absorbed heat from the mouse''s body'
  answer: 0
  explanation: |-
    Photosynthesis releases O₂, which the mouse uses in cellular respiration, and also takes up the CO₂ the mouse exhales. The mouse needs oxygen, not carbon dioxide.
- id: bio-q-0316
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  stem: 'Most leaves look green because chlorophyll'
  choices:
    - 'absorbs green light more strongly than any other color'
    - 'gives off green light when it is struck by sunlight'
    - 'absorbs little green light and reflects it'
    - 'absorbs green light and uses it most efficiently'
  answer: 2
  explanation: |-
    The color you see is the light that is not absorbed. Chlorophyll absorbs mostly blue-violet and red light, so green is reflected and transmitted to your eye.
- id: bio-q-0317
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'Engelmann lit a strand of alga with a spectrum of colors. Oxygen-seeking bacteria gathered mostly along the parts lit by blue and red light. What did this show?'
  choices:
    - 'Photosynthesis releases oxygen fastest in blue and red light.'
    - 'The bacteria are attracted to blue and red light.'
    - 'Green light drives photosynthesis fastest.'
    - 'The alga has chlorophyll only in the blue- and red-lit sections.'
  answer: 0
  explanation: |-
    The bacteria were an oxygen detector: they crowded where O₂ was being released, so the rate of photosynthesis (the action spectrum) peaks in blue and red, matching chlorophyll's absorption. The bacteria respond to oxygen, not light, and chlorophyll runs along the whole strand.
- id: bio-q-0318
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'Where in a chloroplast do the light-dependent reactions take place?'
  choices:
    - 'In the stroma'
    - 'In the outer chloroplast membrane'
    - 'In the cytoplasm outside the chloroplast'
    - 'In the thylakoid membranes'
  answer: 3
  explanation: |-
    Chlorophyll, the photosystems, the electron transport chain and ATP synthase are all in the thylakoid membranes. The stroma is where the Calvin cycle runs.
- id: bio-q-0319
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  stem: 'Which products of the light-dependent reactions are used to power the Calvin cycle?'
  choices: ['Oxygen and glucose', 'Carbon dioxide and water', 'ATP and NADPH', 'ADP and NADP⁺']
  answer: 2
  explanation: |-
    The light reactions charge up ATP and NADPH; the Calvin cycle spends them to reduce CO₂ to sugar and returns ADP and NADP⁺ to be recharged. O₂ is a by-product that leaves the leaf.
- id: bio-q-0320
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'To make 2 molecules of glucose, how many CO₂, ATP, and NADPH does the Calvin cycle use?'
  choices:
    - '6 CO₂, 18 ATP, 12 NADPH'
    - '12 CO₂, 36 ATP, 24 NADPH'
    - '12 CO₂, 24 ATP, 36 NADPH'
    - '2 CO₂, 6 ATP, 4 NADPH'
  answer: 1
  explanation: |-
    One glucose (6 carbons) needs 6 CO₂, 18 ATP and 12 NADPH, so two glucose need 12 CO₂, 36 ATP and 24 NADPH. The first choice is the amount for one glucose; the third swaps ATP and NADPH.
- id: bio-q-0321
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'An Elodea sprig releases 36 bubbles of oxygen in 3 minutes. What is the rate of photosynthesis?'
  choices:
    - '108 bubbles per minute'
    - '12 bubbles per minute'
    - '33 bubbles per minute'
    - '3 bubbles per minute'
  answer: 1
  explanation: |-
    Rate = bubbles ÷ time = 36 ÷ 3 = 12 bubbles per minute. Multiplying gives 108, subtracting gives 33.
- id: bio-q-0322
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'A plant''s rate of photosynthesis rises with light intensity and then levels off at a plateau. On the plateau, which change is most likely to increase the rate?'
  choices:
    - 'Raising the light intensity further'
    - 'Lowering the temperature to 5 °C'
    - 'Removing some of the plant''s leaves'
    - 'Raising the carbon dioxide concentration'
  answer: 3
  explanation: |-
    On the plateau, light is no longer the limiting factor, so more light does nothing. Some other factor, often CO₂, is now limiting; raising it raises the plateau. Cold slows the Calvin cycle enzymes, and fewer leaves means less photosynthesis.
- id: bio-q-0323
  lesson: bio-photosynthesis
  topic: Photosynthesis
  stem: 'A plant is moved from bright light into darkness. Within seconds, the Calvin cycle slows to a stop. Why?'
  choices:
    - 'Calvin cycle enzymes need to absorb light directly.'
    - 'Carbon dioxide cannot enter leaves in the dark.'
    - 'It runs out of the ATP and NADPH made by the light reactions.'
    - 'Rubisco is destroyed as soon as light is removed.'
  answer: 2
  explanation: |-
    The Calvin cycle does not use light itself, but it depends on the ATP and NADPH that only the light reactions make. Once those run out, it stops. This is why "light-independent" is more accurate than "dark reactions."
- id: bio-q-0324
  lesson: bio-respiration
  module_quiz: true
  topic: Cellular respiration
  stem: 'In a eukaryotic cell, where do glycolysis, the Krebs cycle, and the electron transport chain take place, in that order?'
  choices:
    - 'Cytoplasm; mitochondrial matrix; inner mitochondrial membrane'
    - 'Mitochondrial matrix; cytoplasm; outer mitochondrial membrane'
    - 'Cytoplasm; inner mitochondrial membrane; mitochondrial matrix'
    - 'Inner mitochondrial membrane; mitochondrial matrix; cytoplasm'
  answer: 0
  explanation: |-
    Glycolysis happens in the cytoplasm, before pyruvate enters the mitochondrion. The Krebs cycle runs in the matrix, and the electron transport chain is built into the folded inner membrane (cristae), where the H⁺ gradient forms.
- id: bio-q-0325
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'What is the net yield of glycolysis from one molecule of glucose?'
  choices:
    - '2 ATP, 2 NADH, and 2 pyruvate'
    - '4 ATP, 2 NADH, and 2 pyruvate'
    - '2 ATP, 6 CO₂, and 2 pyruvate'
    - '30 ATP, 10 NADH, and 2 pyruvate'
  answer: 0
  explanation: |-
    Glycolysis makes 4 ATP but spends 2 in its investment phase, so the net is 2 ATP, plus 2 NADH and 2 pyruvate. No CO₂ is released in glycolysis; that happens in the mitochondrion. About 30 ATP is the total for all of respiration.
- id: bio-q-0326
  lesson: bio-respiration
  module_quiz: true
  topic: Cellular respiration
  stem: 'What is the role of oxygen in aerobic respiration?'
  choices:
    - 'It combines with carbon from glucose to form carbon dioxide.'
    - 'It splits glucose into two pyruvate molecules in glycolysis.'
    - 'It becomes part of the ATP molecules made by ATP synthase.'
    - 'It accepts electrons at the end of the electron transport chain, forming water.'
  answer: 3
  explanation: |-
    Oxygen is the final electron acceptor; it combines with electrons and H⁺ to make water, keeping the chain flowing. The CO₂ comes from the carbon in glucose during pyruvate oxidation and the Krebs cycle, and glycolysis needs no oxygen at all.
- id: bio-q-0327
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'A person breathes oxygen gas labeled with the isotope ¹⁸O. In which product of respiration does the label appear?'
  choices: ['Carbon dioxide', 'Water', 'Glucose', 'ATP']
  answer: 1
  explanation: |-
    Inhaled O₂ accepts electrons at the end of the electron transport chain and becomes water. The oxygen atoms in exhaled CO₂ come from glucose and water, not from the O₂ you breathe, a common misconception.
- id: bio-q-0328
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'Cyanide blocks the last protein of the electron transport chain, so electrons cannot be passed to oxygen. What is the most direct effect?'
  choices:
    - 'Glycolysis stops immediately because it requires oxygen.'
    - 'The Krebs cycle speeds up and makes extra ATP to compensate.'
    - 'Oxygen use and ATP production by chemiosmosis both stop.'
    - 'The cell starts producing more carbon dioxide.'
  answer: 2
  explanation: |-
    With the chain blocked, no H⁺ is pumped and no O₂ is used, so oxidative phosphorylation stops, and the cell loses most of its ATP supply. Glycolysis does not need oxygen, and the Krebs cycle soon stops too, because NADH cannot unload and NAD⁺ runs out.
- id: bio-q-0329
  lesson: bio-respiration
  module_quiz: true
  topic: Cellular respiration
  stem: 'Using about 2.5 ATP per NADH and 1.5 ATP per FADH₂, how many ATP are made from 10 NADH, 2 FADH₂, and 4 ATP made directly?'
  choices: ['38', '29', '25', '32']
  answer: 3
  explanation: |-
    10 × 2.5 = 25, 2 × 1.5 = 3, and 25 + 3 + 4 = 32. Using the older values of 3 and 2 gives 30 + 4 + 4 = 38; 25 counts only the NADH; 29 forgets the 3 ATP from FADH₂.
- id: bio-q-0330
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'Older textbooks say one glucose yields 36 to 38 ATP; current estimates are about 30 to 32. Why the difference?'
  choices:
    - 'Cells today make less ATP than cells did when the books were written.'
    - 'Older figures forgot to count the ATP made in glycolysis.'
    - 'Older figures assumed 3 ATP per NADH and 2 per FADH₂; measurements show fewer.'
    - 'Older figures included ATP made by photosynthesis.'
  answer: 2
  explanation: |-
    The difference comes from the conversion factors. The link between electron transport and ATP synthase is an H⁺ gradient, and measurements give about 2.5 and 1.5 ATP per NADH and FADH₂, not 3 and 2. Including glycolysis was never the issue, and cells have not changed.
- id: bio-q-0331
  lesson: bio-respiration
  module_quiz: true
  topic: Fermentation
  stem: 'What is the main function of fermentation?'
  choices:
    - 'To regenerate NAD⁺ so that glycolysis can continue making ATP'
    - 'To make about 30 extra ATP when oxygen is absent'
    - 'To produce oxygen for the electron transport chain'
    - 'To turn lactate into glucose for the Krebs cycle'
  answer: 0
  explanation: |-
    Without oxygen, NADH cannot unload in the electron transport chain and NAD⁺ runs out, which would stop glycolysis. Fermentation passes NADH's electrons to pyruvate, regenerating NAD⁺. It makes no ATP itself; all 2 ATP per glucose come from glycolysis.
- id: bio-q-0332
  lesson: bio-respiration
  topic: Fermentation
  stem: 'Bread dough rises because the yeast in it'
  choices:
    - 'release oxygen during photosynthesis'
    - 'release carbon dioxide during alcoholic fermentation'
    - 'release lactic acid gas during lactic acid fermentation'
    - 'release water vapor during the Krebs cycle'
  answer: 1
  explanation: |-
    Alcoholic fermentation converts pyruvate to ethanol and CO₂; the CO₂ bubbles make the dough rise (the ethanol evaporates during baking). Yeast are fungi and cannot photosynthesize, and lactate is not a gas.
- id: bio-q-0333
  lesson: bio-respiration
  topic: Fermentation
  stem: 'A culture of cells needs 300 ATP. Without oxygen (2 ATP per glucose), how many glucose molecules must it use?'
  choices: ['10', '600', '15', '150']
  answer: 3
  explanation: |-
    300 ÷ 2 = 150 glucose. With oxygen, about 300 ÷ 30 = 10 would be enough. 600 multiplies instead of dividing; 15 is the ratio between the two methods.
- id: bio-q-0334
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'How many grams of CO₂ are produced when 90 g of glucose is completely oxidized? (Glucose = 180 g/mol; CO₂ = 44 g/mol.)'
  choices: ['44 g', '132 g', '90 g', '264 g']
  answer: 1
  explanation: |-
    90 g is 0.5 mol of glucose. Each mole makes 6 mol CO₂, so 3 mol × 44 g/mol = 132 g. 264 g is the amount from a full mole (180 g); 44 g is the mass of just one mole of CO₂; 90 g assumes the CO₂ weighs the same as the glucose.
- id: bio-q-0335
  lesson: bio-respiration
  topic: Cellular respiration
  stem: 'A potted plant is kept in a sealed, dark container. The CO₂ level inside steadily rises. Which conclusion is best supported?'
  choices:
    - 'Plants photosynthesize faster in the dark.'
    - 'Plants respire only when they cannot photosynthesize.'
    - 'Plant cells carry out cellular respiration.'
    - 'The plant is fixing CO₂ through the Calvin cycle.'
  answer: 2
  explanation: |-
    Rising CO₂ in the dark means the plant is releasing it by respiration. Plant cells respire all the time, day and night; in light, photosynthesis usually outpaces respiration so the plant takes up CO₂ overall. The data cannot show respiration stops in light, and fixing CO₂ would lower the level.
- id: bio-q-0336
  lesson: bio-respiration
  topic: Fermentation
  stem: 'A day or two after a hard workout, your muscles ache. What is the best current explanation?'
  choices:
    - 'Tiny injuries to muscle fibers and the repair process that follows'
    - 'Lactic acid that stays in the muscles for several days'
    - 'Muscles running out of ATP until the next meal'
    - 'Muscle cells switching to alcoholic fermentation'
  answer: 0
  explanation: |-
    Lactate made during hard exercise is cleared from muscle within about an hour, so it cannot explain soreness days later. Delayed soreness comes from small injuries to muscle fibers and inflammation during repair. Human muscle cells use lactic acid fermentation, never alcoholic fermentation.
- id: bio-q-0337
  lesson: bio-energy-atp
  module_quiz: true
  topic: ATP
  type: label
  stem: 'Name the numbered parts of this molecule of ATP.'
  image: {src: images/m3-atp-blank.svg, alt: 'A chain of three circles marked P, joined to a five-sided ring containing an O, which is joined to a fused pair of rings made of a six-sided and a five-sided ring. Three parts are numbered.'}
  labels:
    - {x: 84.7, y: 45.6, text: 'Adenine'}
    - {x: 57.8, y: 71.9, text: 'Ribose'}
    - {x: 10.9, y: 66.7, text: 'Phosphate group removed when ATP becomes ADP'}
  distractors: ['Deoxyribose', 'Glucose', 'Thymine']
  explanation: |-
    ATP is adenosine (the base adenine, 1, joined to the sugar ribose, 2) plus a chain of three phosphate groups. Hydrolysis removes the phosphate at the far end of the chain, 3, leaving ADP. Deoxyribose is the sugar of DNA, and thymine is a DNA base, not part of ATP.
- id: bio-q-0338
  lesson: bio-energy-atp
  topic: Energy
  type: match
  stem: 'Match each term to its description.'
  pairs:
    - ['Catabolism', 'Breaks large molecules down and releases energy']
    - ['Anabolism', 'Builds large molecules and requires energy']
    - ['Exergonic reaction', 'Its products hold less free energy than its reactants']
    - ['Endergonic reaction', 'Its products hold more free energy than its reactants']
  distractors: ['Speeds up a reaction without being used up']
  explanation: |-
    Catabolism (such as respiration) breaks down and releases energy; anabolism (such as protein synthesis) builds up and costs energy. Exergonic reactions go downhill in free energy and endergonic ones go uphill. "Speeds up a reaction without being used up" describes an enzyme (a catalyst).
- id: bio-q-0339
  lesson: bio-energy-atp
  topic: Energy
  type: text
  stem: 'When a molecule loses electrons, the process is called ___; when a molecule gains electrons, it is called ___.'
  accept:
    - ['oxidation', 'oxidization', 'being oxidized', 'oxidized']
    - ['reduction', 'being reduced', 'reduced']
  explanation: |-
    OIL RIG: oxidation is loss, reduction is gain (of electrons). When NAD⁺ picks up electrons to become NADH, it is reduced, and the molecule that gave up the electrons is oxidized.
- id: bio-q-0340
  lesson: bio-energy-atp
  module_quiz: true
  topic: ATP
  stem: 'Which of these processes are endergonic, so that a cell must couple them to an energy source such as ATP hydrolysis? Select all that apply.'
  choices:
    - 'Joining amino acids into a protein'
    - 'Pumping Na⁺ out of a cell against its concentration gradient'
    - 'Hydrolyzing ATP to ADP and phosphate'
    - 'Breaking glucose down to CO₂ and water'
  answer: [0, 1]
  explanation: |-
    Building a protein (anabolism) and moving ions against their gradient (active transport) both need an energy input, and ATP supplies it. ATP hydrolysis and the breakdown of glucose are exergonic: they release energy rather than needing it.
- id: bio-q-0341
  lesson: bio-energy-atp
  topic: ATP
  type: order
  stem: 'Put the steps of the ATP cycle in order, starting with the breakdown of food.'
  items:
    - 'Glucose is broken down by cellular respiration'
    - 'The energy released joins ADP and phosphate into ATP'
    - 'ATP is hydrolyzed to ADP and phosphate to power cellular work'
    - 'ADP returns to be recharged into ATP again'
  explanation: |-
    Catabolism (breaking down glucose) releases energy that recharges ADP into ATP. ATP is then spent on work, such as pumping ions or building molecules, becoming ADP and phosphate again, which are recycled. A cell repeats this cycle constantly because it holds only a small amount of ATP at any moment.
- id: bio-q-0342
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  type: label
  stem: 'Name the numbered parts of this chloroplast.'
  image: {src: images/m3-chloroplast-blank.svg, alt: 'An oval organelle with two membranes around it. Inside, four stacks of flat discs sit in a fluid, joined by thin links. Four places are numbered.'}
  labels:
    - {x: 21.4, y: 38.9, text: 'Outer membrane'}
    - {x: 24.4, y: 64.1, text: 'Inner membrane'}
    - {x: 44.2, y: 58.1, text: 'Granum (stack of thylakoids)'}
    - {x: 63.4, y: 72.4, text: 'Stroma'}
  distractors: ['Crista', 'Matrix']
  explanation: |-
    A chloroplast has two surrounding membranes, an outer one (1) and an inner one (2). Inside, thylakoids are stacked into grana (3); the light-dependent reactions happen in the thylakoid membranes. The fluid around them is the stroma (4), where the Calvin cycle runs. Cristae and the matrix are parts of a mitochondrion.
- id: bio-q-0343
  lesson: bio-photosynthesis
  topic: Photosynthesis
  type: order
  stem: 'Put these steps of the Calvin cycle in order, starting with carbon fixation.'
  items:
    - 'Rubisco attaches CO₂ to RuBP'
    - 'ATP and NADPH convert the products into G3P'
    - 'One G3P leaves the cycle to be made into sugar'
    - 'The remaining G3P are rearranged, using ATP, to rebuild RuBP'
  explanation: |-
    Fixation comes first: rubisco joins CO₂ to the five-carbon RuBP. Reduction follows: ATP and NADPH from the light reactions turn the products into G3P. For every three CO₂ fixed, one G3P leaves as product, and the other five are used, with more ATP, to regenerate RuBP so the cycle can start again.
- id: bio-q-0344
  lesson: bio-photosynthesis
  topic: Photosynthesis
  type: text
  stem: 'In photosynthesis, the O₂ released comes from splitting ___, and the carbon atoms in sugar come from ___.'
  accept:
    - ['water', 'H2O', 'H₂O', 'water molecules']
    - ['carbon dioxide', 'CO2', 'CO₂', 'carbon dioxide gas']
  explanation: |-
    Ruben and Kamen's ¹⁸O experiment showed the oxygen gas comes from water, split at photosystem II. The carbon comes from CO₂, fixed by rubisco in the Calvin cycle.
- id: bio-q-0345
  lesson: bio-photosynthesis
  module_quiz: true
  topic: Photosynthesis
  stem: 'Which of these happen in the stroma of a chloroplast? Select all that apply.'
  choices:
    - 'Rubisco attaches CO₂ to RuBP'
    - 'G3P is made'
    - 'Water is split and O₂ is released'
    - 'Light is absorbed by chlorophyll'
    - 'ATP is spent to power reactions'
  answer: [0, 1, 4]
  explanation: |-
    The stroma is the site of the Calvin cycle: carbon fixation by rubisco, reduction to G3P, and regeneration of RuBP, all of which spend ATP (and NADPH). Water splitting and light absorption by chlorophyll happen in the thylakoid membranes.
- id: bio-q-0346
  lesson: bio-photosynthesis
  topic: Photosynthesis
  type: match
  stem: 'Match each scientist to the finding about photosynthesis.'
  pairs:
    - ['Jan van Helmont', 'Most of a growing tree''s mass does not come from the soil']
    - ['Joseph Priestley', 'A plant restores air that a candle or a mouse has used up']
    - ['Jan Ingenhousz', 'Plants restore air only in light, through their green parts']
    - ['Ruben and Kamen', 'The O₂ released comes from water, not CO₂']
  distractors: ['Sugar is made inside the thylakoid space']
  explanation: |-
    Van Helmont's willow gained about 164 pounds while the soil lost about 2 ounces. Priestley's mint sprig revived the air in a sealed jar; Ingenhousz showed this needs light and green tissue. Ruben and Kamen used ¹⁸O to trace O₂ to water. Sugar is made in the stroma, not the thylakoid space.
- id: bio-q-0347
  lesson: bio-respiration
  module_quiz: true
  topic: Cellular respiration
  type: label
  stem: 'Name the numbered parts of this mitochondrion.'
  image: {src: images/m3-mitochondrion-blank.svg, alt: 'An oval organelle with a smooth outer membrane and an inner membrane folded into many finger-like folds. Four places are numbered.'}
  labels:
    - {x: 48.9, y: 11.4, text: 'Outer membrane'}
    - {x: 79.1, y: 54.3, text: 'Intermembrane space'}
    - {x: 55.7, y: 57.1, text: 'Crista (fold of the inner membrane)'}
    - {x: 48.9, y: 33.1, text: 'Matrix'}
  distractors: ['Thylakoid', 'Stroma']
  explanation: |-
    The smooth outer membrane (1) surrounds the narrow intermembrane space (2), where H⁺ ions pile up during electron transport. The inner membrane folds into cristae (3), which carry the electron transport chain and ATP synthase. The matrix (4) inside holds the enzymes of pyruvate oxidation and the Krebs cycle. Thylakoids and stroma belong to chloroplasts.
- id: bio-q-0348
  lesson: bio-respiration
  topic: Cellular respiration
  type: order
  stem: 'Put the stages of aerobic respiration in the order a glucose molecule goes through them.'
  items:
    - 'Glycolysis'
    - 'Pyruvate oxidation'
    - 'Krebs cycle'
    - 'Electron transport chain and chemiosmosis'
  explanation: |-
    Glycolysis in the cytoplasm splits glucose into 2 pyruvate. In the mitochondrial matrix, pyruvate oxidation turns each pyruvate into acetyl-CoA, which enters the Krebs cycle. The NADH and FADH₂ from these stages feed the electron transport chain on the inner membrane, where chemiosmosis makes most of the ATP.
- id: bio-q-0349
  lesson: bio-respiration
  topic: Cellular respiration
  type: text
  stem: 'In aerobic respiration, the final electron acceptor at the end of the electron transport chain is ___.'
  accept: ['oxygen', 'O2', 'O₂', 'molecular oxygen', 'oxygen gas']
  explanation: |-
    Oxygen takes the electrons from the last protein of the chain and combines with H⁺ to form water. Without it, the chain backs up and stops, which is why you need to breathe.
- id: bio-q-0350
  lesson: bio-respiration
  module_quiz: true
  topic: Cellular respiration
  stem: 'Which of these steps release CO₂? Select all that apply.'
  choices:
    - 'Glycolysis'
    - 'Pyruvate oxidation'
    - 'Krebs cycle'
    - 'Lactic acid fermentation'
    - 'Alcoholic fermentation'
  answer: [1, 2, 4]
  explanation: |-
    Pyruvate oxidation releases 2 CO₂ and the Krebs cycle 4 CO₂ per glucose; together they release all six carbons of glucose. In alcoholic fermentation, yeast remove CO₂ from pyruvate before making ethanol. Glycolysis splits glucose without losing any carbon, and lactic acid fermentation turns pyruvate straight into lactate with no CO₂.
- id: bio-q-0351
  lesson: bio-respiration
  topic: Fermentation
  type: match
  stem: 'Match each molecule or protein to its role in breaking down glucose.'
  pairs:
    - ['NAD⁺', 'Picks up electrons in glycolysis and the Krebs cycle']
    - ['O₂', 'Accepts electrons at the end of the electron transport chain']
    - ['ATP synthase', 'Uses the flow of H⁺ to make ATP']
    - ['Pyruvate', 'Three-carbon product of glycolysis, reduced in fermentation']
  distractors: ['Fixes CO₂ into a five-carbon sugar']
  explanation: |-
    NAD⁺ is the electron carrier that becomes NADH; fermentation exists to regenerate it. O₂ is the final electron acceptor. ATP synthase makes ATP by chemiosmosis. Pyruvate is glycolysis's product; fermentation reduces it to lactate (or, after removing CO₂, to ethanol). Fixing CO₂ into sugar is rubisco's job in photosynthesis.
- id: bio-qh-0301
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'A reaction releases heat ($\Delta H < 0$) and increases entropy ($\Delta S > 0$). Using $\Delta G = \Delta H - T\Delta S$, what can you conclude?'
  choices:
    - '$\Delta G$ is negative at every temperature, so the reaction can always proceed'
    - '$\Delta G$ is positive at every temperature, so the reaction never proceeds'
    - 'The reaction can proceed only at high temperatures'
    - 'The reaction can proceed only at low temperatures'
  answer: 0
  explanation: |-
    With $\Delta H$ negative and $\Delta S$ positive, $-T\Delta S$ is also negative (T is always positive in kelvins), so $\Delta G$ is negative at any temperature. Temperature matters only when the two terms have opposite signs.
- id: bio-qh-0302
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'A mixture of reactants has $\Delta G = -40$ kJ/mol for its reaction, yet no measurable product forms in a day. What is the best explanation?'
  choices:
    - 'The reaction is actually endergonic under these conditions'
    - 'The mixture must already be at equilibrium'
    - 'The activation energy is high, so the reaction is very slow without a catalyst'
    - 'A negative $\Delta G$ means the reverse reaction is favored'
  answer: 2
  explanation: |-
    $\Delta G$ tells whether a reaction can proceed, not how fast. A large activation energy can make a favorable reaction extremely slow, which is why cells need enzymes. A negative $\Delta G$ means the forward reaction is favored and the mixture is not at equilibrium ($\Delta G = 0$ there).
- id: bio-qh-0303
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'A reaction has $\Delta G^{\circ\prime} = -11.4$ kJ/mol at 25 °C, where each 5.7 kJ/mol corresponds to a factor of 10 in $K''$. What is its equilibrium constant $K''$, approximately?'
  choices:
    - '0.01'
    - '100'
    - '11.4'
    - '2'
  answer: 1
  explanation: |-
    $-11.4$ kJ/mol is two steps of 5.7 kJ/mol, so $K' = 10^2 = 100$. Check: $K' = e^{11.4/2.48} = e^{4.6} \approx 100$. A negative $\Delta G^{\circ\prime}$ means $K' > 1$, which rules out 0.01 (that would be for $+11.4$).
- id: bio-qh-0304
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'A pathway step has $\Delta G^{\circ\prime} = +5.0$ kJ/mol. In a cell at 37 °C ($RT = 2.58$ kJ/mol), the ratio of product to reactant is kept at $Q = 0.010$. What is the actual $\Delta G$?'
  choices:
    - '$+16.9$ kJ/mol'
    - '$-11.9$ kJ/mol'
    - '$+5.0$ kJ/mol'
    - '$-6.9$ kJ/mol'
  answer: 3
  explanation: |-
    $\Delta G = \Delta G^{\circ\prime} + RT\ln Q = 5.0 + 2.58 \times \ln 0.010 = 5.0 + 2.58 \times (-4.61) = 5.0 - 11.9 = -6.9$ kJ/mol, so the step runs forward. $+16.9$ adds the terms with the wrong sign, $-11.9$ forgets $\Delta G^{\circ\prime}$, and $+5.0$ ignores the concentrations.
- id: bio-qh-0305
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'Hexokinase couples glucose phosphorylation ($\Delta G^{\circ\prime} = +13.8$ kJ/mol) to ATP hydrolysis ($-30.5$ kJ/mol). Coupling changes the equilibrium constant of the glucose reaction by a factor of about'
  choices:
    - '30.5 (the kJ/mol released by ATP)'
    - '2 (one reaction added to another)'
    - '16.7 (the new free energy change)'
    - '$2 \times 10^{5}$ (the equilibrium constant of ATP hydrolysis)'
  answer: 3
  explanation: |-
    Free energies of coupled reactions add, so equilibrium constants multiply: $K'_{\text{coupled}} = K'_{\text{glucose}} \times K'_{\text{ATP}}$. $K'$ for ATP hydrolysis is $e^{30.5/2.48} \approx 2 \times 10^{5}$, taking $K'$ from about 0.0038 to about 840.
- id: bio-qh-0306
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'Standard free energies of hydrolysis (kJ/mol): PEP −61.9, phosphocreatine −43.0, ATP −30.5, glucose-6-phosphate −13.8, glycerol-3-phosphate −9.2. Which phosphate transfer can proceed under standard conditions?'
  choices:
    - 'PEP + ADP → pyruvate + ATP'
    - 'Glucose-6-phosphate + ADP → glucose + ATP'
    - 'Glycerol-3-phosphate + ADP → glycerol + ATP'
    - 'ATP + creatine → ADP + phosphocreatine'
  answer: 0
  explanation: |-
    A phosphate moves spontaneously from a donor higher in the table to an acceptor lower down. PEP to ADP: $-61.9 + 30.5 = -31.4$ kJ/mol, favorable; this is substrate-level phosphorylation at the end of glycolysis. Glucose-6-phosphate ($-13.8 + 30.5 = +16.7$) and glycerol-3-phosphate ($+21.3$) cannot make ATP, and ATP cannot make phosphocreatine under standard conditions ($-30.5 + 43.0 = +12.5$).
- id: bio-qh-0307
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'Electrons flow spontaneously between redox pairs'
  choices:
    - 'from a pair with a more positive $E^{\circ\prime}$ to one with a more negative $E^{\circ\prime}$'
    - 'only between pairs with the same $E^{\circ\prime}$'
    - 'from a pair with a more negative $E^{\circ\prime}$ to one with a more positive $E^{\circ\prime}$'
    - 'in whichever direction makes $\Delta E^{\circ\prime}$ negative'
  answer: 2
  explanation: |-
    The more positive the reduction potential, the more strongly the oxidized form attracts electrons. Electrons therefore fall from negative to positive (NADH at −0.32 V toward O₂ at +0.82 V), making $\Delta E^{\circ\prime}$ positive and $\Delta G^{\circ\prime} = -nF\Delta E^{\circ\prime}$ negative.
- id: bio-qh-0308
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'NADH ($E^{\circ\prime} = -0.32$ V) passes two electrons to ubiquinone ($E^{\circ\prime} = +0.05$ V). With $F = 96.5$ kJ/(mol·V), what is $\Delta G^{\circ\prime}$?'
  choices:
    - '$-36$ kJ/mol'
    - '$-71$ kJ/mol'
    - '$+71$ kJ/mol'
    - '$-52$ kJ/mol'
  answer: 1
  explanation: |-
    $\Delta E^{\circ\prime} = 0.05 - (-0.32) = 0.37$ V, so $\Delta G^{\circ\prime} = -2 \times 96.5 \times 0.37 = -71$ kJ/mol. $-36$ forgets that two electrons move ($n = 2$), $+71$ has the sign backward, and $-52$ comes from subtracting 0.05 from 0.32 instead of adding.
- id: bio-qh-0309
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'ATP hydrolysis releases 30.5 kJ/mol under standard conditions but about 50 kJ/mol inside a typical cell. Why?'
  choices:
    - 'Body temperature is much higher than 25 °C'
    - 'Cells keep ATP far above its equilibrium level, with ADP and phosphate low'
    - 'Enzymes add extra energy to each ATP molecule'
    - 'The phosphate bonds in ATP are stronger inside cells'
  answer: 1
  explanation: |-
    $\Delta G = \Delta G^{\circ\prime} + RT\ln Q$, and in cells $Q = [\text{ADP}][\text{P}_i]/[\text{ATP}]$ is tiny (around $10^{-4}$), making $RT\ln Q$ about $-20$ kJ/mol. The temperature difference changes $RT$ by only about 4%. Enzymes never change $\Delta G$.
- id: bio-qh-0310
  lesson: bio-h-free-energy
  topic: Bioenergetics
  type: text
  stem: 'Using $\Delta G^{\circ\prime} = -RT\ln K''$: a reaction with $\Delta G^{\circ\prime} = 0$ has an equilibrium constant $K''$ equal to ___.'
  accept: ['1', 'one']
  explanation: |-
    If $\Delta G^{\circ\prime} = 0$ then $\ln K' = 0$, so $K' = 1$: at equilibrium, products and reactants are balanced (at standard concentrations). Negative $\Delta G^{\circ\prime}$ gives $K' > 1$, positive gives $K' < 1$.
- id: bio-qh-0311
  lesson: bio-h-free-energy
  topic: Bioenergetics
  type: match
  stem: 'Match each symbol to what it measures.'
  pairs:
    - ['$\Delta H$', 'Change in heat content (enthalpy)']
    - ['$\Delta S$', 'Change in entropy (disorder)']
    - ['$\Delta G^{\circ\prime}$', 'Free energy change with everything at 1 M and pH 7']
    - ['$K''$', 'Ratio of products to reactants at equilibrium']
  distractors: ['Voltage difference between two redox pairs']
  explanation: |-
    $\Delta H$ and $\Delta S$ combine in $\Delta G = \Delta H - T\Delta S$. $\Delta G^{\circ\prime}$ is the standard reference value, related to the equilibrium constant $K'$ by $\Delta G^{\circ\prime} = -RT\ln K'$. The voltage difference between redox pairs is $\Delta E^{\circ\prime}$.
- id: bio-qh-0312
  lesson: bio-h-free-energy
  topic: Bioenergetics
  stem: 'Which changes would make $\Delta G$ for ATP hydrolysis inside a cell more negative (so each ATP releases more energy)? Select all that apply.'
  choices:
    - 'Raising the concentration of ATP'
    - 'Lowering the concentration of ADP'
    - 'Lowering the concentration of phosphate'
    - 'Adding more of an ATP-hydrolyzing enzyme'
    - 'Raising the concentration of ADP'
  answer: [0, 1, 2]
  explanation: |-
    $Q = [\text{ADP}][\text{P}_i]/[\text{ATP}]$. More ATP or less ADP or phosphate makes $Q$ smaller, so $RT\ln Q$ is more negative and so is $\Delta G$. More ADP does the opposite. An enzyme changes the rate, never $\Delta G$.
- id: bio-qh-0313
  lesson: bio-h-free-energy
  topic: Bioenergetics
  type: order
  stem: 'Put these redox pairs in the order electrons pass through them in the mitochondrial respiratory chain, from the strongest electron donor to the strongest acceptor.'
  items:
    - 'NAD⁺ / NADH'
    - 'Ubiquinone / ubiquinol (Q / QH₂)'
    - 'Cytochrome c (Fe³⁺ / Fe²⁺)'
    - '½O₂ / H₂O'
  explanation: |-
    Electrons flow toward more positive reduction potentials: NADH (−0.32 V), ubiquinone (+0.05 V), cytochrome c (+0.25 V), oxygen (+0.82 V). Each step releases part of the roughly 220 kJ/mol available from NADH to oxygen.
- id: bio-qh-0314
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  type: label
  stem: 'Name the numbered parts of the mitochondrial electron transport chain.'
  image: {src: images/m3-mito-etc-blank.svg, alt: 'A membrane drawn across the middle, with the intermembrane space above and the matrix below. Several protein complexes and two small carriers sit in or on the membrane; electrons from NADH and FADH2 pass along them to oxygen, and hydrogen ions are pumped upward and flow back down through a protein with a knob in the matrix. Five parts are numbered.'}
  labels:
    - {x: 12.2, y: 38.9, text: 'Complex I (NADH dehydrogenase)'}
    - {x: 32.2, y: 43.3, text: 'Ubiquinone (Q)'}
    - {x: 50.0, y: 26.2, text: 'Cytochrome c'}
    - {x: 58.9, y: 38.9, text: 'Complex IV (cytochrome c oxidase)'}
    - {x: 78.3, y: 70.0, text: 'ATP synthase'}
  distractors: ['Photosystem II', 'Plastocyanin']
  explanation: |-
    NADH gives its electrons to complex I (1), which passes them to ubiquinone (2), the mobile carrier inside the membrane. Complex III passes them to cytochrome c (3) on the outer face, which carries them to complex IV (4), where oxygen is reduced to water. Protons flow back through ATP synthase (5), whose knob in the matrix makes ATP. Photosystem II and plastocyanin are parts of the thylakoid chain.
- id: bio-qh-0315
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  stem: 'How many H⁺ ions are moved across the inner mitochondrial membrane for each pair of electrons that NADH sends to oxygen?'
  choices:
    - '6'
    - '4'
    - '12'
    - '10'
  answer: 3
  explanation: |-
    Complex I moves 4, complex III 4 and complex IV 2: $4 + 4 + 2 = 10$. Six is the count for electrons from succinate (FADH₂), which skip complex I; 4 is complex I or III alone.
- id: bio-qh-0316
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  stem: 'Why does FADH₂ (from succinate) yield fewer ATP than NADH?'
  choices:
    - 'Its electrons enter at ubiquinone, bypassing the proton pumping of complex I'
    - 'It carries only one electron instead of two'
    - 'It is made in the cytoplasm and must be shuttled into the mitochondrion'
    - 'It passes its electrons straight to oxygen'
  answer: 0
  explanation: |-
    Complex II hands succinate's electrons, through bound FAD, to ubiquinone, so they pass only complexes III and IV (6 H⁺ instead of 10). FADH₂ carries two electrons like NADH, is made in the matrix by the Krebs cycle, and its electrons still go through complexes III and IV before reaching oxygen.
- id: bio-qh-0317
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'A mitochondrion has a membrane potential of 150 mV and a pH difference of 0.8 units across its inner membrane, both pushing protons inward. Using $\Delta p = \Delta\psi + 61.5 \text{ mV} \times \Delta\text{pH}$, what is the proton-motive force?'
  choices:
    - 'About 151 mV'
    - 'About 101 mV'
    - 'About 199 mV'
    - 'About 49 mV'
  answer: 2
  explanation: |-
    $\Delta p = 150 + 61.5 \times 0.8 = 150 + 49.2 = 199$ mV. 151 mV adds the pH difference without converting it to millivolts, 101 mV subtracts the two parts although both push the same way, and 49 mV is the pH part alone.
- id: bio-qh-0318
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'An ATP synthase has a ring of 12 c subunits and makes 3 ATP per full turn. How many H⁺ pass through it per ATP made?'
  choices:
    - '3'
    - '12'
    - '4'
    - '36'
  answer: 2
  explanation: |-
    One full turn of the ring carries 12 H⁺ (one per c subunit) and makes 3 ATP (one per β subunit), so $12 \div 3 = 4$ H⁺ per ATP. 12 is the number per turn, not per ATP.
- id: bio-qh-0319
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'In the Jagendorf–Uribe experiment, thylakoids soaked at pH 4 and then moved to pH 8 with ADP and phosphate made ATP in complete darkness. What did this show?'
  choices:
    - 'ATP synthase needs light to change shape'
    - 'A proton gradient alone, without light or electron transport, can drive ATP synthesis'
    - 'ATP is made from a high-energy chemical intermediate stored in the dark'
    - 'Chloroplasts make ATP only when the stroma is acidic'
  answer: 1
  explanation: |-
    No light meant no electron transport, so the only energy source was the imposed pH difference, with the inside of the thylakoids acidic and the outside basic. The ATP made far exceeded what any stored intermediate could explain, and uncouplers abolished it, supporting Mitchell's chemiosmotic hypothesis.
- id: bio-qh-0320
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'Isolated mitochondria with plenty of ADP and substrate are given the uncoupler DNP. What happens?'
  choices:
    - 'Oxygen use and ATP synthesis both fall'
    - 'Oxygen use and ATP synthesis both rise'
    - 'Oxygen use falls while ATP synthesis rises'
    - 'Oxygen use rises while ATP synthesis falls'
  answer: 3
  explanation: |-
    DNP carries protons back into the matrix, collapsing the gradient. With no gradient holding it back, electron transport (and so oxygen use) speeds up, but protons no longer pass through ATP synthase, so ATP synthesis falls and the energy becomes heat.
- id: bio-qh-0321
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'Why was the Racker–Stoeckenius vesicle experiment (1974) strong evidence for chemiosmosis?'
  choices:
    - 'The vesicles had no electron transport chain, yet a light-driven proton pump plus ATP synthase made ATP'
    - 'It showed that ATP synthase can make ATP without any membrane'
    - 'It isolated the high-energy chemical intermediate of oxidative phosphorylation'
    - 'It showed that bacteriorhodopsin carries electrons to ATP synthase'
  answer: 0
  explanation: |-
    The only link between the light-driven pump (bacteriorhodopsin, which moves protons, not electrons) and ATP synthase was the proton gradient across the sealed vesicle membrane. ATP was made anyway, so a gradient is enough. A sealed membrane was essential, and no chemical intermediate was ever found.
- id: bio-qh-0322
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  stem: 'Chloroplasts run cyclic electron flow, which makes ATP but no NADPH, in addition to linear electron flow. Why?'
  choices:
    - 'Linear flow alone makes too little ATP for each NADPH compared with what the Calvin cycle uses'
    - 'Linear flow alone makes too much ATP, which must be balanced'
    - 'Cyclic flow splits extra water to release more O₂'
    - 'Cyclic flow is the only way to reduce NADP⁺'
  answer: 0
  explanation: |-
    Linear flow moves about 12 H⁺ per 2 NADPH; with 14 c subunits (4.67 H⁺ per ATP) that is about 2.6 ATP, or 1.29 ATP per NADPH. The Calvin cycle uses 3 ATP per 2 NADPH (1.5). Cyclic flow pumps extra protons without making NADPH or splitting water, closing the gap.
- id: bio-qh-0323
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'Brown fat helps newborns and hibernating mammals stay warm. Its mitochondria contain uncoupling protein 1 (thermogenin), which'
  choices:
    - 'blocks complex IV so that electrons cannot reach oxygen'
    - 'speeds up ATP synthase so more ATP is made'
    - 'pumps extra protons out of the matrix'
    - 'lets protons leak back into the matrix, so the energy is released as heat'
  answer: 3
  explanation: |-
    Thermogenin is a natural uncoupler: protons flow back through it instead of through ATP synthase. Electron transport runs fast, little ATP is made, and the energy of the gradient becomes heat. Blocking complex IV would stop respiration altogether, as cyanide does.
- id: bio-qh-0324
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  type: text
  stem: 'The combined electrical and pH gradient of protons across a membrane, which drives ATP synthase, is called the ___.'
  accept: ['proton-motive force', 'proton motive force', 'protonmotive force', 'PMF']
  explanation: |-
    The proton-motive force, $\Delta p$, has an electrical part (membrane potential) and a chemical part (pH difference). In mitochondria it is about 200 mV, mostly electrical.
- id: bio-qh-0325
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  type: match
  stem: 'Match each substance to how it affects mitochondria.'
  pairs:
    - ['Rotenone', 'Blocks complex I']
    - ['Cyanide', 'Blocks complex IV']
    - ['Oligomycin', 'Blocks the proton channel of ATP synthase']
    - ['DNP', 'Carries protons across the membrane (an uncoupler)']
  distractors: ['Blocks photosystem II']
  explanation: |-
    Rotenone stops electrons entering from NADH at complex I. Cyanide (and carbon monoxide) stop electrons reaching oxygen at complex IV. Oligomycin plugs ATP synthase, which also slows electron transport through respiratory control. DNP shuttles protons across the membrane, uncoupling electron transport from ATP synthesis.
- id: bio-qh-0326
  lesson: bio-h-chemiosmosis
  topic: Electron transport
  type: order
  stem: 'Put the carriers in the order electrons pass through them in linear electron flow in the thylakoid membrane.'
  items:
    - 'Water'
    - 'Photosystem II'
    - 'Plastoquinone'
    - 'Cytochrome b₆f complex'
    - 'Plastocyanin'
    - 'Photosystem I'
    - 'NADP⁺'
  explanation: |-
    Photosystem II takes electrons from water (releasing O₂), and plastoquinone carries them to the cytochrome b₆f complex, which pumps H⁺ into the thylakoid space. Plastocyanin carries them to photosystem I, where light boosts them again, and ferredoxin and FNR pass them to NADP⁺, making NADPH.
- id: bio-qh-0327
  lesson: bio-h-chemiosmosis
  topic: Chemiosmosis
  stem: 'Which statements about ATP synthase are correct? Select all that apply.'
  choices:
    - 'It is driven by H⁺ flowing down its concentration and electrical gradient'
    - 'Its central stalk rotates as protons pass through'
    - 'Each full turn makes 3 ATP'
    - 'It pumps electrons across the membrane'
    - 'It is found only in mitochondria'
  answer: [0, 1, 2]
  explanation: |-
    Protons flowing through the c-ring turn it and the attached central stalk, which drives each of the three β subunits through the binding-change cycle, making 3 ATP per turn. ATP synthase moves protons, not electrons, and it is also found in chloroplasts and bacterial plasma membranes.
- id: bio-qh-0328
  lesson: bio-h-c4-cam
  topic: Calvin cycle
  stem: 'In three turns of the Calvin cycle, rubisco combines 3 RuBP (five carbons each) with 3 CO₂. How many molecules of 3-PGA (three carbons each) are formed?'
  choices:
    - '3'
    - '6'
    - '9'
    - '18'
  answer: 1
  explanation: |-
    Carbon count: $3 \times 5 + 3 = 18$ carbons, and $18 \div 3 = 6$ molecules of 3-PGA. Each six-carbon intermediate splits into two 3-PGA. 18 is the number of carbons, not molecules.
- id: bio-qh-0329
  lesson: bio-h-c4-cam
  topic: Calvin cycle
  stem: 'Algae photosynthesizing in bright light with plenty of CO₂ are suddenly put in the dark. What happens to the amounts of 3-PGA and RuBP over the next minute?'
  choices:
    - 'RuBP rises and 3-PGA falls'
    - 'Both rise'
    - '3-PGA rises and RuBP falls'
    - 'Both stay the same'
  answer: 2
  explanation: |-
    In the dark, ATP and NADPH run out, so 3-PGA can no longer be reduced and piles up. Rubisco briefly keeps using RuBP to fix CO₂, but RuBP cannot be regenerated without ATP, so it falls. Cutting off CO₂ instead gives the opposite pattern.
- id: bio-qh-0330
  lesson: bio-h-c4-cam
  topic: Calvin cycle
  stem: 'Which step of the Calvin cycle uses NADPH?'
  choices:
    - 'Fixation of CO₂ onto RuBP'
    - 'Regeneration of RuBP from G3P'
    - 'Export of G3P to make sucrose'
    - 'Reduction of 3-PGA to G3P'
  answer: 3
  explanation: |-
    NADPH supplies the electrons that reduce phosphorylated 3-PGA to the sugar G3P, using 6 NADPH (and 6 ATP) per three turns. Fixation needs no ATP or NADPH, and regeneration uses only ATP (3 per three turns).
- id: bio-qh-0331
  lesson: bio-h-c4-cam
  topic: Calvin cycle
  stem: 'Rubisco in a leaf carries out 500 carboxylations per second and 100 oxygenations per second. Photorespiration releases 1 CO₂ per 2 oxygenations. What is the net CO₂ fixed per second?'
  choices:
    - '400'
    - '475'
    - '450'
    - '500'
  answer: 2
  explanation: |-
    The 100 oxygenations release $100 \div 2 = 50$ CO₂ in the salvage pathway, so net fixation is $500 - 50 = 450$ per second. 400 subtracts every oxygenation as if each lost a CO₂, and 500 ignores photorespiration.
- id: bio-qh-0332
  lesson: bio-h-c4-cam
  topic: Calvin cycle
  stem: 'Why does photorespiration in C3 plants increase on hot, dry days?'
  choices:
    - 'Stomata close, so CO₂ in the leaf falls and O₂ builds up, and rubisco favors CO₂ less as temperature rises'
    - 'The light reactions stop, so rubisco has no ATP'
    - 'PEP carboxylase begins to react with O₂ instead of CO₂'
    - 'Heat makes the leaf''s mitochondria fix CO₂'
  answer: 0
  explanation: |-
    Closing stomata to save water cuts off fresh CO₂ while the light reactions keep releasing O₂, raising the O₂ : CO₂ ratio at rubisco. Warmth also lowers CO₂'s solubility relative to O₂ and weakens rubisco's preference for CO₂. PEP carboxylase does not react with O₂ at all.
- id: bio-qh-0333
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  stem: 'Sugarcane leaves given ¹⁴CO₂ for a few seconds have most of the label in malate and aspartate, not 3-PGA. This shows that sugarcane'
  choices:
    - 'lacks rubisco and the Calvin cycle'
    - 'first fixes CO₂ into four-carbon acids before the Calvin cycle'
    - 'makes sugar directly from malate without rubisco'
    - 'carries out photorespiration instead of photosynthesis'
  answer: 1
  explanation: |-
    This was the key observation of Kortschak and of Hatch and Slack in the 1960s. The first stable products are four-carbon acids made by PEP carboxylase; the CO₂ is released again in bundle-sheath cells and fixed by rubisco in the Calvin cycle, which C4 plants still use.
- id: bio-qh-0334
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  stem: 'Ignoring photorespiration, how many ATP and NADPH does a C4 plant (5 ATP and 2 NADPH per CO₂) use to make one glucose?'
  choices:
    - '18 ATP and 12 NADPH'
    - '30 ATP and 12 NADPH'
    - '30 ATP and 18 NADPH'
    - '24 ATP and 12 NADPH'
  answer: 1
  explanation: |-
    One glucose needs 6 CO₂: $6 \times 5 = 30$ ATP and $6 \times 2 = 12$ NADPH. 18 ATP is the C3 cost. The C4 pump adds ATP (to regenerate PEP) but no NADPH.
- id: bio-qh-0335
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  stem: 'In a C4 leaf, where are rubisco and the Calvin cycle found?'
  choices:
    - 'In bundle-sheath cells around the veins'
    - 'In the outer mesophyll cells'
    - 'In the guard cells of the stomata'
    - 'In the epidermis'
  answer: 0
  explanation: |-
    Kranz anatomy puts PEP carboxylase in mesophyll cells and rubisco in bundle-sheath cells, where CO₂ released from malate is concentrated. Keeping rubisco away from the leaf surfaces and in high CO₂ is what suppresses photorespiration.
- id: bio-qh-0336
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  stem: 'The acidity of a CAM plant''s leaf sap is measured at dawn and at dusk. What would you expect?'
  choices:
    - 'Most acidic at dusk, least acidic at dawn'
    - 'The same at dawn and dusk'
    - 'Most acidic at dawn, least acidic at dusk'
    - 'Acidic only on cloudy days'
  answer: 2
  explanation: |-
    CAM plants fix CO₂ at night into malic acid stored in the vacuole, so acid builds up overnight and peaks at dawn. During the day the malic acid is broken down to supply CO₂ to the Calvin cycle, so the sap is least acidic by dusk.
- id: bio-qh-0337
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  type: match
  stem: 'Match each plant to the type of photosynthesis it uses.'
  pairs:
    - ['Corn (maize)', 'C4']
    - ['Pineapple', 'CAM']
    - ['Wheat', 'C3']
    - ['Sugarcane', 'C4']
  explanation: |-
    Corn and sugarcane are C4 grasses. Pineapple, like cacti and agaves, uses CAM. Wheat, rice, soybeans and most trees are C3 plants, fixing CO₂ directly with rubisco.
- id: bio-qh-0338
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  type: order
  stem: 'Put the steps of the C4 pathway in order.'
  items:
    - 'CO₂ (as bicarbonate) is attached to PEP in a mesophyll cell'
    - 'The oxaloacetate formed is converted to malate'
    - 'Malate moves into a bundle-sheath cell'
    - 'Malate releases CO₂ near rubisco'
    - 'Rubisco fixes the CO₂ in the Calvin cycle'
  explanation: |-
    PEP carboxylase fixes CO₂ into four-carbon oxaloacetate in the mesophyll; it becomes malate, which moves to a bundle-sheath cell and releases CO₂ there. The concentrated CO₂ is fixed by rubisco into the Calvin cycle, and the leftover pyruvate returns to the mesophyll to be turned back into PEP using ATP.
- id: bio-qh-0339
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  type: text
  stem: 'In C4 and CAM plants, the enzyme ___ carries out the first fixation of CO₂, producing a four-carbon acid.'
  accept: ['PEP carboxylase', 'PEPC', 'phosphoenolpyruvate carboxylase', 'PEP-carboxylase', 'PEPCase']
  explanation: |-
    PEP carboxylase attaches CO₂ (as bicarbonate) to PEP, making oxaloacetate. Unlike rubisco it does not react with O₂, which is why it can be used to gather and concentrate CO₂.
- id: bio-qh-0340
  lesson: bio-h-c4-cam
  topic: Photosynthetic adaptations
  stem: 'Which are advantages of C4 photosynthesis over C3 photosynthesis in hot, sunny, dry conditions? Select all that apply.'
  choices:
    - 'Much less photorespiration'
    - 'Less water lost per CO₂ fixed'
    - 'Less rubisco needed, saving nitrogen'
    - 'Fewer ATP used per CO₂ fixed'
    - 'CO₂ is taken in only at night'
  answer: [0, 1, 2]
  explanation: |-
    Concentrating CO₂ around rubisco suppresses photorespiration, lets the plant keep its stomata less open (saving water), and means less rubisco is needed. C4 costs more ATP per CO₂ (about 5 versus 3), and taking in CO₂ only at night is CAM, not C4.
