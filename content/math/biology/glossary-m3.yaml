- term: metabolism
  definition: 'All the chemical reactions in an organism, organized into enzyme-catalyzed pathways that break molecules down (catabolism) or build them up (anabolism).'
  topic: Energy
- term: catabolism
  aliases: [catabolic]
  definition: 'Metabolic pathways that break large molecules into smaller ones and release energy, such as cellular respiration.'
  topic: Energy
- term: anabolism
  aliases: [anabolic]
  definition: 'Metabolic pathways that build large molecules from smaller ones and require energy, such as protein synthesis or the Calvin cycle.'
  topic: Energy
- term: first law of thermodynamics
  definition: 'Energy cannot be created or destroyed, only converted from one form to another.'
  topic: Energy
- term: second law of thermodynamics
  definition: 'Every energy conversion turns some energy into heat that can no longer do work, so the disorder (entropy) of the universe increases; no conversion is 100% efficient.'
  topic: Energy
- term: exergonic reaction
  aliases: [exergonic]
  definition: 'A reaction that releases free energy; its products hold less usable energy than its reactants, so it can proceed on its own.'
  topic: Energy
- term: endergonic reaction
  aliases: [endergonic]
  definition: 'A reaction that absorbs free energy; its products hold more usable energy than its reactants, so it needs an energy input, usually from ATP.'
  topic: Energy
- term: energy coupling
  definition: 'Using the energy released by an exergonic reaction (usually ATP hydrolysis) to drive an endergonic one, often by transferring a phosphate group.'
  topic: ATP
- term: oxidation
  aliases: [oxidized]
  definition: 'Loss of electrons by a molecule (often along with hydrogen). The molecule that loses electrons is oxidized.'
  topic: ATP
- term: reduction
  aliases: [reduced]
  definition: 'Gain of electrons by a molecule (often along with hydrogen). The molecule that gains electrons is reduced.'
  topic: ATP
- term: ATP
  aliases: [adenosine triphosphate]
  definition: 'Adenosine triphosphate: a nucleotide with three phosphate groups that is the cell''s energy currency. Hydrolysis to ADP + Pi releases about 30.5 kJ/mol under standard conditions.'
  topic: ATP
- term: ADP
  aliases: [adenosine diphosphate]
  definition: 'Adenosine diphosphate: ATP with one fewer phosphate group; recharged to ATP by adding a phosphate (phosphorylation).'
  topic: ATP
- term: NADH
  aliases: [NAD+, NAD⁺]
  definition: 'The reduced form of the electron carrier NAD⁺. It carries high-energy electrons from glycolysis and the Krebs cycle to the electron transport chain.'
  topic: ATP
- term: NADPH
  aliases: [NADP+, NADP⁺]
  definition: 'The reduced form of the electron carrier NADP⁺. Made in the light-dependent reactions of photosynthesis, it supplies electrons to the Calvin cycle.'
  topic: Photosynthesis
- term: photosynthesis
  definition: 'The process by which plants, algae and some bacteria convert light energy into chemical energy in sugar: 6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂.'
  topic: Photosynthesis
- term: autotroph
  aliases: [autotrophs, autotrophic]
  definition: 'An organism that makes its own organic food from inorganic materials, such as a plant using light energy.'
  topic: Photosynthesis
- term: heterotroph
  aliases: [heterotrophs, heterotrophic]
  definition: 'An organism that gets its food by eating other organisms or their products, such as animals and fungi.'
  topic: Photosynthesis
- term: chlorophyll
  definition: 'The main photosynthetic pigment, found in thylakoid membranes. It absorbs mostly blue-violet and red light and reflects green.'
  topic: Photosynthesis
- term: absorption spectrum
  definition: 'A graph of how much light a pigment absorbs at each wavelength.'
  topic: Photosynthesis
- term: thylakoid
  aliases: [thylakoids]
  definition: 'A flattened membrane sac inside the chloroplast, stacked into grana; its membrane holds chlorophyll and runs the light-dependent reactions.'
  topic: Photosynthesis
- term: stroma
  definition: 'The fluid inside the chloroplast that surrounds the thylakoids; the Calvin cycle takes place there.'
  topic: Photosynthesis
- term: light-dependent reactions
  aliases: [light reactions]
  definition: 'The first stage of photosynthesis, in the thylakoid membranes: light energy splits water, releases O₂, and makes ATP and NADPH.'
  topic: Photosynthesis
- term: electron transport chain
  aliases: [ETC]
  definition: 'A series of membrane proteins that pass electrons along, using the released energy to pump H⁺ ions across the membrane. Found in thylakoids and in the inner mitochondrial membrane.'
  topic: Cellular respiration
- term: ATP synthase
  definition: 'A membrane enzyme that makes ATP from ADP and phosphate, powered by H⁺ ions flowing through it down their gradient.'
  topic: Cellular respiration
- term: chemiosmosis
  definition: 'Making ATP using the energy of an H⁺ gradient across a membrane, as H⁺ flows back through ATP synthase.'
  topic: Cellular respiration
- term: Calvin cycle
  aliases: [light-independent reactions]
  definition: 'The second stage of photosynthesis, in the stroma: the enzyme rubisco fixes CO₂, and ATP and NADPH reduce it to the sugar G3P.'
  topic: Photosynthesis
- term: G3P
  aliases: [glyceraldehyde-3-phosphate]
  definition: 'Glyceraldehyde-3-phosphate: the three-carbon sugar produced by the Calvin cycle; two G3P make one glucose.'
  topic: Photosynthesis
- term: limiting factor
  definition: 'The factor in shortest supply (such as light, CO₂ or temperature) that sets the rate of a process; raising other factors does not help until it is raised.'
  topic: Photosynthesis
- term: cellular respiration
  definition: 'The pathway that breaks down glucose and other food molecules to make ATP: C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + energy.'
  topic: Cellular respiration
- term: aerobic
  definition: 'Requiring oxygen. Aerobic respiration uses O₂ as the final electron acceptor.'
  topic: Cellular respiration
- term: anaerobic
  definition: 'Not requiring oxygen. Glycolysis and fermentation are anaerobic.'
  topic: Fermentation
- term: glycolysis
  definition: 'The first stage of respiration, in the cytoplasm: glucose is split into 2 pyruvate, with a net gain of 2 ATP and 2 NADH. It needs no oxygen.'
  topic: Cellular respiration
- term: acetyl-CoA
  aliases: [acetyl coenzyme A]
  definition: 'Acetyl coenzyme A: a two-carbon acetyl group attached to a carrier, made from pyruvate in the mitochondrion; it feeds carbon into the Krebs cycle.'
  topic: Cellular respiration
- term: Krebs cycle
  aliases: [citric acid cycle]
  definition: 'The cycle of reactions in the mitochondrial matrix that breaks acetyl groups down to CO₂ and loads electrons onto NADH and FADH₂; also called the citric acid cycle.'
  topic: Cellular respiration
- term: FADH₂
  aliases: [FADH2, FAD]
  definition: 'The reduced form of the electron carrier FAD, made in the Krebs cycle; each yields about 1.5 ATP in the electron transport chain.'
  topic: Cellular respiration
- term: oxidative phosphorylation
  definition: 'ATP production powered by the electron transport chain and chemiosmosis; it makes most of the ATP in aerobic respiration.'
  topic: Cellular respiration
- term: fermentation
  definition: 'Anaerobic pathways that regenerate NAD⁺ by passing NADH''s electrons to pyruvate or a product of it, so glycolysis can continue making 2 ATP per glucose. Lactic acid fermentation makes lactate; alcoholic fermentation makes ethanol and CO₂.'
  topic: Fermentation
- term: photosystem
  aliases: [photosystems, photosystem I, photosystem II, PSI, PSII]
  definition: 'A cluster of chlorophyll and other pigments with proteins in the thylakoid membrane that captures light and passes energized electrons on from its reaction center. Photosystem II acts first and splits water; photosystem I passes electrons toward NADP⁺.'
  topic: Photosynthesis
- term: rubisco
  aliases: [RuBisCO, Rubisco]
  definition: 'The enzyme that fixes CO₂ by attaching it to RuBP in the first step of the Calvin cycle; slow, extremely abundant, and also able to react with O₂ (which causes photorespiration).'
  topic: Photosynthesis
- term: RuBP
  aliases: [ribulose bisphosphate, ribulose 1,5-bisphosphate]
  definition: 'Ribulose 1,5-bisphosphate, the five-carbon sugar that accepts CO₂ in the Calvin cycle and is regenerated at the end of each turn.'
  topic: Photosynthesis
- term: carbon fixation
  aliases: [fixing carbon, fixes CO₂]
  definition: 'Incorporating carbon from CO₂ gas into an organic molecule, as rubisco does in the Calvin cycle.'
  topic: Photosynthesis
- term: substrate-level phosphorylation
  definition: 'Making ATP by transferring a phosphate group directly from a substrate molecule to ADP, as in glycolysis and the Krebs cycle, without an electron transport chain.'
  topic: Cellular respiration
- term: enthalpy
  aliases: [enthalpy change, ΔH]
  definition: 'The heat content of a system; its change, ΔH, is negative when a reaction releases heat and positive when it absorbs heat.'
  topic: Bioenergetics
- term: entropy
  aliases: [ΔS]
  definition: 'A measure of disorder: of how many ways the energy and matter in a system can be arranged. Its change is ΔS; the entropy of the universe increases in every real process.'
  topic: Bioenergetics
- term: Gibbs free energy
  aliases: [free energy, free energy change, ΔG]
  definition: 'The energy available to do work at constant temperature and pressure. ΔG = ΔH − TΔS; a reaction with negative ΔG can proceed on its own, and ΔG = 0 at equilibrium.'
  topic: Bioenergetics
- term: standard free energy change
  aliases: ['ΔG°′', "ΔG°'"]
  definition: 'ΔG°′, the free energy change of a reaction with every reactant and product at 1 M, at pH 7 (and usually 25 °C); a reference value listed in tables.'
  topic: Bioenergetics
- term: reaction quotient
  definition: 'Q, the product concentrations multiplied together divided by the reactant concentrations multiplied together, at any moment. ΔG = ΔG°′ + RT ln Q.'
  topic: Bioenergetics
- term: equilibrium constant
  aliases: ["K′", "K'"]
  definition: 'K′, the value of the reaction quotient when a reaction is at equilibrium; related to the standard free energy change by ΔG°′ = −RT ln K′.'
  topic: Bioenergetics
- term: reduction potential
  aliases: [standard reduction potential, redox potential, 'E°′']
  definition: 'A measure in volts of how strongly the oxidized form of a redox pair attracts electrons. Electrons flow from pairs with more negative to pairs with more positive potentials; ΔG°′ = −nFΔE°′.'
  topic: Bioenergetics
- term: ubiquinone
  aliases: [coenzyme Q, ubiquinol, QH₂]
  definition: 'A small, fat-soluble electron carrier that moves within the inner mitochondrial membrane, carrying electrons (as ubiquinol, QH₂) from complexes I and II to complex III.'
  topic: Electron transport
- term: cytochrome c
  definition: 'A small heme protein on the outer face of the inner mitochondrial membrane that carries one electron at a time from complex III to complex IV.'
  topic: Electron transport
- term: proton-motive force
  aliases: [proton motive force, protonmotive force, PMF, Δp]
  definition: 'The energy stored in a proton gradient across a membrane, made of an electrical part (membrane potential) and a chemical part (pH difference); about 200 mV across the inner mitochondrial membrane.'
  topic: Chemiosmosis
- term: binding-change mechanism
  definition: 'Paul Boyer''s model of ATP synthase: the rotating central stalk drives each β subunit in turn through three shapes, one that binds ADP and phosphate, one that forms ATP, and one that releases ATP.'
  topic: Chemiosmosis
- term: P/O ratio
  aliases: [P/O ratios]
  definition: 'The number of ATP made per oxygen atom reduced (per pair of electrons sent down the chain): about 2.5 for NADH and 1.5 for FADH₂ (succinate).'
  topic: Chemiosmosis
- term: cyclic electron flow
  aliases: [cyclic photophosphorylation]
  definition: 'In chloroplasts, a path in which electrons from photosystem I return through ferredoxin to the plastoquinone pool and cytochrome b₆f complex, pumping protons to make ATP without making NADPH or splitting water.'
  topic: Electron transport
- term: respiratory control
  definition: 'The coupling of electron transport to ATP synthesis through the proton gradient: electrons flow fast only when ADP is available and protons can flow back through ATP synthase.'
  topic: Chemiosmosis
- term: uncoupler
  aliases: [uncouplers, uncoupling agent]
  definition: 'A substance or protein that lets protons cross the inner mitochondrial membrane without passing through ATP synthase, so electron transport speeds up but little ATP is made and the energy becomes heat (for example DNP, or thermogenin).'
  topic: Chemiosmosis
- term: brown adipose tissue
  aliases: [brown fat]
  definition: 'Fat tissue whose mitochondria contain uncoupling protein 1 (thermogenin), which lets protons leak back across the inner membrane to produce heat; found in newborns, hibernators and some adults.'
  topic: Chemiosmosis
- term: 3-phosphoglycerate
  aliases: [3-PGA, 3-phosphoglyceric acid, PGA]
  definition: 'The three-carbon product of carbon fixation by rubisco; two form from each CO₂ added to RuBP, and they are then reduced to G3P.'
  topic: Calvin cycle
- term: photorespiration
  definition: 'The salvage pathway that follows when rubisco adds O₂ instead of CO₂ to RuBP; it uses O₂, releases previously fixed CO₂ (1 per 2 oxygenations) and costs ATP, lowering a plant''s net carbon gain.'
  topic: Calvin cycle
- term: C3 plant
  aliases: [C3 plants, C3]
  definition: 'A plant that fixes CO₂ directly with rubisco, so the first stable product is the three-carbon 3-PGA; most plants, including wheat, rice and trees.'
  topic: Photosynthetic adaptations
- term: C4 plant
  aliases: [C4 plants, C4, C4 photosynthesis]
  definition: 'A plant that first fixes CO₂ with PEP carboxylase into a four-carbon acid in mesophyll cells, then releases it to rubisco in bundle-sheath cells, suppressing photorespiration; for example corn and sugarcane.'
  topic: Photosynthetic adaptations
- term: Kranz anatomy
  definition: 'The leaf arrangement of C4 plants: a ring of bundle-sheath cells tightly around each vein, surrounded by mesophyll cells ("Kranz" is German for wreath).'
  topic: Photosynthetic adaptations
- term: PEP carboxylase
  aliases: [PEPC, phosphoenolpyruvate carboxylase]
  definition: 'The enzyme that attaches CO₂ (as bicarbonate) to the three-carbon PEP, making four-carbon oxaloacetate; it does not react with O₂ and does the first fixation in C4 and CAM plants.'
  topic: Photosynthetic adaptations
- term: bundle-sheath cell
  aliases: [bundle-sheath cells, bundle sheath cells, bundle sheath]
  definition: 'A cell of the tightly packed layer around a leaf vein; in C4 plants, the site of rubisco and the Calvin cycle, where CO₂ released from malate is concentrated.'
  topic: Photosynthetic adaptations
- term: CAM
  aliases: [crassulacean acid metabolism, CAM plants, CAM plant]
  definition: 'Crassulacean acid metabolism: photosynthesis in which stomata open at night and CO₂ is stored as malic acid, then released to the Calvin cycle during the day with stomata closed; for example cacti and pineapple.'
  topic: Photosynthetic adaptations
