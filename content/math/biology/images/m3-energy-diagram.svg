<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="sans-serif" fill="none" stroke-linejoin="round">
<title>Energy diagrams for exergonic and endergonic reactions</title>
<rect x="0" y="0" width="800" height="320" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a33b2a"/></marker></defs>
<line x1="50" y1="280" x2="50" y2="60" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="50" y1="280" x2="340" y2="280" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="195" y="40" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833">Exergonic reaction</text>
<path d="M65,140 L110,140 C155,140 155,80 190,80 C225,80 225,230 270,230 L325,230" stroke="#2f5d8a" stroke-width="3"/>
<text x="88" y="130" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">reactants</text>
<text x="300" y="220" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">products</text>
<line x1="110" y1="140" x2="300" y2="140" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="312" y1="140" x2="312" y2="236" stroke="#a33b2a" stroke-width="2" marker-end="url(#ahr)"/>
<text x="320" y="183.0" font-size="14" text-anchor="start" font-weight="normal" fill="#a33b2a">energy</text>
<text x="320" y="201.0" font-size="14" text-anchor="start" font-weight="normal" fill="#a33b2a">released</text>
<line x1="190" y1="140" x2="190" y2="86" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="110" y1="140" x2="200" y2="140" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="450" y1="280" x2="450" y2="60" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="450" y1="280" x2="740" y2="280" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="595" y="40" font-size="17" text-anchor="middle" font-weight="bold" fill="#1c2833">Endergonic reaction</text>
<path d="M465,230 L510,230 C555,230 555,80 590,80 C625,80 625,140 670,140 L725,140" stroke="#2f5d8a" stroke-width="3"/>
<text x="488" y="220" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">reactants</text>
<text x="700" y="130" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">products</text>
<line x1="510" y1="230" x2="700" y2="230" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="712" y1="230" x2="712" y2="134" stroke="#a33b2a" stroke-width="2" marker-end="url(#ahr)"/>
<text x="720" y="183.0" font-size="14" text-anchor="start" font-weight="normal" fill="#a33b2a">energy</text>
<text x="720" y="201.0" font-size="14" text-anchor="start" font-weight="normal" fill="#a33b2a">absorbed</text>
<line x1="590" y1="230" x2="590" y2="86" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="510" y1="230" x2="600" y2="230" stroke="#1c2833" stroke-width="1" stroke-dasharray="4 4"/>
<text x="120" y="92" font-size="13" text-anchor="end" font-weight="normal" fill="#1c2833">activation</text>
<text x="120" y="108" font-size="13" text-anchor="end" font-weight="normal" fill="#1c2833">energy</text>
<line x1="124" y1="100" x2="186" y2="112" stroke="#1c2833" stroke-width="1"/>
<text x="195" y="305" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">progress of reaction</text>
<text x="36" y="170" font-size="14" text-anchor="middle" fill="#1c2833" transform="rotate(-90 36 170)">free energy</text>
<text x="584" y="190" font-size="13" text-anchor="end" font-weight="normal" fill="#1c2833">activation</text>
<text x="584" y="206" font-size="13" text-anchor="end" font-weight="normal" fill="#1c2833">energy</text>
<text x="595" y="305" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">progress of reaction</text>
<text x="436" y="170" font-size="14" text-anchor="middle" fill="#1c2833" transform="rotate(-90 436 170)">free energy</text>
</svg>
