<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img"><title>Masui and Markert's frog oocyte injection experiment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="900" height="480" fill="#ffffff"/><text x="20.0" y="43.0" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#1c2833">Experiment</text><ellipse cx="110.0" cy="125.0" rx="48.0" ry="48.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><path d="M 88 98.6 Q 110 84.6 132 98.6 Q 110 112.6 88 98.6 Z" fill="none" stroke="#7d8790" stroke-width="1.4" /><rect x="98.0" y="90.6" width="6.0" height="16.0" rx="3" fill="#e98f80" stroke="#1c2833" stroke-width="1"/><rect x="107.0" y="90.6" width="6.0" height="16.0" rx="3" fill="#6f9fd4" stroke="#1c2833" stroke-width="1"/><rect x="116.0" y="90.6" width="6.0" height="16.0" rx="3" fill="#e98f80" stroke="#1c2833" stroke-width="1"/><text x="110.0" y="197.0" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2833">Mature egg</text><text x="110.0" y="215.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">(paused in metaphase II)</text><line x1="170.0" y1="125.0" x2="300.0" y2="125.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="235.0" y="101.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">inject a little</text><text x="235.0" y="117.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">cytoplasm</text><ellipse cx="400.0" cy="125.0" rx="62.0" ry="62.0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/><ellipse cx="394.0" cy="117.0" rx="23.6" ry="23.6" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><ellipse cx="398.0" cy="113.0"