<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" role="img"><title>One chromosome before and after it is copied in S phase</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs><rect x="0" y="0" width="700" height="330" fill="#ffffff"/><rect x="145.5" y="75.0" width="9.0" height="150.0" rx="4.5" fill="#e98f80" stroke="none"/><rect x="145.5" y="75.0" width="9.0" height="150.0" rx="4.5" fill="none" stroke="#1c2833" stroke-width="1.4"/><text x="150.0" y="260.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2833">Before S phase</text><text x="150.0" y="282.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">1 chromosome = 1 DNA molecule</text><line x1="230.0" y1="150.0" x2="340.0" y2="150.0" stroke="#1c2833" stroke-width="2.5" marker-end="url(#ah)"/><text x="285.0" y="138.0" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#1c2833">S phase</text><text x="285.0" y="175.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">(DNA copied)</text><rect x="420.0" y="75.0" width="9.0" height="150.0" rx="4.5" fill="#e98f80" stroke="none"/><rect x="420.0" y="75.0" width="9.0" height="150.0" rx="4.5" fill="none" stroke="#1c2833" stroke-width="1.4"/><rect x="431.0" y="75.0" width="9.0" height="150.0" rx="4.5" fill="#e98f80" stroke="none"/><rect x="431.0" y="75.0" width="9.0" height="150.0" rx="4.5" fill="none" stroke="#1c2833" stroke-width="1.4"/><ellipse cx="430.0" cy="150.0" rx="5.0" ry="6.0" fill="#1c2833" stroke="none"/><line x1="442.0" y1="110.0" x2="545.0" y2="80.0" stroke="#1c2833" stroke-width="1.5"/><text x="552.0" y="85.0" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2833">sister chromatid</text><line x1="418.0" y1="200.0" x2="330.0" y2="228.0" stroke="#1c2833" stroke-width="1.5"/><text x="322.0" y="233.0" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="end" fill="#1c2833">sister chromatid</text><line x1="438.0" y1="150.0" x2="545.0" y2="150.0" stroke="#1c2833" stroke-width="1.5"/><text x="552.0" y="155.0" font-family="sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#1c2833">centromere</text><text x="430.0" y="260.0" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#1c2833">After S phase</text><text x="430.0" y="282.0" font-family="sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#1c2833">still 1 chromosome, now 2 chromatids</text></svg>