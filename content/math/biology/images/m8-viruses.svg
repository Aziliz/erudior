<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="sans-serif">
<rect width="780" height="430" fill="#ffffff"/>
<!-- ===== Bacteriophage (left) ===== -->
<text x="175" y="30" font-size="18" font-weight="bold" fill="#1c2833" text-anchor="middle">Bacteriophage</text>
<!-- head: elongated hexagon -->
<polygon points="175,50 225,78 225,142 175,170 125,142 125,78" fill="#dde8f3" stroke="#1c2833" stroke-width="3"/>
<!-- DNA coil inside head -->
<path d="M 150 90 C 190 80, 205 100, 170 110 S 140 128, 180 132 S 205 150, 160 150 S 140 100, 175 96" fill="none" stroke="#1c2833" stroke-width="2"/>
<!-- collar -->
<rect x="160" y="170" width="30" height="8" fill="#1c2833"/>
<!-- tail sheath -->
<rect x="163" y="178" width="24" height="100" fill="#f7ebcf" stroke="#1c2833" stroke-width="2.5"/>
<g stroke="#1c2833" stroke-width="1.5"><line x1="163" y1="198" x2="187" y2="198"/><line x1="163" y1="218" x2="187" y2="218"/><line x1="163" y1="238" x2="187" y2="238"/><line x1="163" y1="258" x2="187" y2="258"/></g>
<!-- base plate -->
<rect x="148" y="278" width="54" height="10" fill="#1c2833"/>
<!-- tail fibers -->
<g fill="none" stroke="#1c2833" stroke-width="2.5" stroke-linejoin="round">
<polyline points="152,286 112,300 128,348"/>
<polyline points="162,288 140,310 150,352"/>
<polyline points="188,288 210,310 200,352"/>
<polyline points="198,286 238,300 222,348"/>
</g>
<!-- labels left panel -->
<g font-size="15" fill="#1c2833">
<line x1="232" y1="70" x2="268" y2="70" stroke="#1c2833" stroke-width="1.2"/><text x="272" y="66">Head: protein</text><text x="272" y="84">coat (capsid)</text>
<line x1="186" y1="120" x2="268" y2="120" stroke="#1c2833" stroke-width="1.2"/><text x="272" y="125">DNA</text>
<line x1="190" y1="228" x2="268" y2="228" stroke="#1c2833" stroke-width="1.2"/><text x="272" y="233">Tail sheath</text>
<line x1="148" y1="283" x2="60" y2="283" stroke="#1c2833" stroke-width="1.2"/><text x="56" y="288" text-anchor="end">Base</text><text x="56" y="306" text-anchor="end">plate</text>
<line x1="225" y1="330" x2="268" y2="330" stroke="#1c2833" stroke-width="1.2"/><text x="272" y="335">Tail fibers</text>
</g>
<!-- ===== Enveloped virus (right) ===== -->
<text x="560" y="30" font-size="18" font-weight="bold" fill="#1c2833" text-anchor="middle">Enveloped virus</text>
<g stroke="#1c2833" stroke-width="2.5">
<line x1="560" y1="98" x2="560" y2="74"/><line x1="607" y1="111" x2="621" y2="91"/><line x1="641" y1="145" x2="663" y2="135"/><line x1="654" y1="192" x2="678" y2="192"/><line x1="641" y1="239" x2="663" y2="249"/><line x1="607" y1="273" x2="621" y2="293"/><line x1="560" y1="286" x2="560" y2="310"/><line x1="513" y1="273" x2="499" y2="293"/><line x1="479" y1="239" x2="457" y2="249"/><line x1="466" y1="192" x2="442" y2="192"/><line x1="479" y1="145" x2="457" y2="135"/><line x1="513" y1="111" x2="499" y2="91"/>
</g>
<g fill="#f8e1dc" stroke="#1c2833" stroke-width="2">
<circle cx="560" cy="70" r="7"/><circle cx="623" cy="88" r="7"/><circle cx="667" cy="133" r="7"/><circle cx="682" cy="192" r="7"/><circle cx="667" cy="251" r="7"/><circle cx="623" cy="296" r="7"/><circle cx="560" cy="314" r="7"/><circle cx="497" cy="296" r="7"/><circle cx="453" cy="251" r="7"/><circle cx="438" cy="192" r="7"/><circle cx="453" cy="133" r="7"/><circle cx="497" cy="88" r="7"/>
</g>
<!-- envelope -->
<circle cx="560" cy="192" r="94" fill="#dcf0e3" stroke="#1c2833" stroke-width="3"/>
<circle cx="560" cy="192" r="86" fill="#ffffff" stroke="#1c2833" stroke-width="1.5"/>
<!-- capsid -->
<polygon points="560,132 612,162 612,222 560,252 508,222 508,162" fill="#dde8f3" stroke="#1c2833" stroke-width="2.5"/>
<!-- RNA genome -->
<path d="M 530 175 C 550 160, 575 200, 590 180 S 560 230, 540 212 S 580 205, 585 220" fill="none" stroke="#1c2833" stroke-width="2"/>
<g font-size="15" fill="#1c2833">
<line x1="626" y1="96" x2="680" y2="70" stroke="#1c2833" stroke-width="1.2"/><text x="684" y="58">Spike</text><text x="684" y="76">proteins</text>
<line x1="494" y1="259" x2="450" y2="352" stroke="#1c2833" stroke-width="1.2"/><text x="400" y="372">Envelope (membrane</text><text x="400" y="390">from the host cell)</text>
<line x1="586" y1="237" x2="636" y2="356" stroke="#1c2833" stroke-width="1.2"/><text x="620" y="374">Capsid</text>
<line x1="590" y1="182" x2="698" y2="318" stroke="#1c2833" stroke-width="1.2"/>
</g>
<text x="700" y="332" font-size="15" fill="#1c2833">RNA</text>
<text x="390" y="418" font-size="14" fill="#1c2833" text-anchor="middle">Not to scale. Spikes attach to receptor molecules on host cells.</text>
</svg>
