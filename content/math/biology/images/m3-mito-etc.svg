<text x="115" y="214" font-size="18" text-anchor="middle" font-weight="bold" fill="#1c2833">I</text>
<text x="225" y="255" font-size="18" text-anchor="middle" font-weight="bold" fill="#1c2833">II</text>
<text x="290" y="201" font-size="18" text-anchor="middle" font-weight="bold" fill="#1c2833">Q</text>
<text x="365" y="204" font-size="18" text-anchor="middle" font-weight="bold" fill="#1c2833">III</text>
