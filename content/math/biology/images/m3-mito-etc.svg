<line x1="467" y1="118" x2="498" y2="128" stroke="#2f5d8a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
<line x1="530" y1="265" x2="530" y2="318" stroke="#2f5d8a" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#ahb)"/>
<text x="530" y="338" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">½O₂ + 2H⁺</text>
<text x="530" y="358" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">→ H₂O</text>
