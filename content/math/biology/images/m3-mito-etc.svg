<line x1="390" y1="300" x2="390" y2="95" stroke="#a33b2a" stroke-width="2.5" marker-end="url(#ahr)"/><text x="390" y="85" font-size="15" text-anchor="middle" font-weight="bold" fill="#a33b2a">4 H⁺</text>
<line x1="555" y1="300" x2="555" y2="95" stroke="#a33b2a" stroke-width="2.5" marker-end="url(#ahr)"/><text x="555" y="85" font-size="15" text-anchor="middle" font-weight="bold" fill="#a33b2a">2 H⁺</text>
<line x1="727" y1="70" x2="727" y2="266" stroke="#a33b2a" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="727" y="62" font-size="15" text-anchor="middle" font-weight="bold" fill="#a33b2a">H⁺</text>
<text x="705" y="385" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">ADP + Pᵢ → ATP</text>
<line x1="600" y1="30" x2="640" y2="30" stroke="#2f5d8a" stroke-width="2.2" stroke-dasharray="6 4"/>
<text x="648" y="35" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">electrons</text>
<line x1="740" y1="30" x2="780" y2="30" stroke="#a33b2a" stroke-width="2.5"/>
<text x="788" y="35" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">protons</text>
</svg>
