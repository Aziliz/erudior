<text x="30" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-style="italic">target cell</text>
<text x="575" y="26" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Steroid hormone</text>
<text x="575" y="46" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">lipid-soluble, e.g. cortisol, estrogen</text>
<rect x="410" y="110" width="330" height="300" rx="30" fill="#dde8f3" stroke="#1c2833" stroke-width="3"/>
<text x="430" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833" font-style="italic">target cell</text>
