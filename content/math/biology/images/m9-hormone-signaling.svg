<text x="175" y="26" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">Peptide hormone</text>
<text x="175" y="46" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">water-soluble, e.g. insulin, glucagon, ADH</text>
