<text x="175" y="328" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833">existing proteins changed:</text>
<text x="175" y="346" font-size="14" text-anchor="middle" font-weight="bold" fill="#1c2833">response in seconds to minutes</text>
