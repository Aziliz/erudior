<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" font-family="sans-serif" fill="none" stroke-linejoin="round">
<title>Coupling an uphill reaction to ATP hydrolysis</title>
<rect x="0" y="0" width="860" height="400" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f5d8a"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a33b2a"/></marker></defs>
<line x1="50" y1="360" x2="50" y2="40" stroke="#1c2833" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="30" y="200" font-size="15" text-anchor="middle" fill="#1c2833" transform="rotate(-90 30 200)">free energy (G)</text>
<line x1="120" y1="250" x2="200" y2="250" stroke="#1c2833" stroke-width="3"/>
<line x1="220" y1="194.8" x2="300" y2="194.8" stroke="#1c2833" stroke-width="3"/>
<line x1="210" y1="250" x2="210" y2="188.8" stroke="#a33b2a" stroke-width="2.5" marker-end="url(#ahr)"/>
<text x="210" y="148.8" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">glucose + Pᵢ</text>
<text x="210" y="166.8" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">→ glucose-6-phosphate</text>
<text x="220" y="218.4" font-size="15" text-anchor="start" font-weight="bold" fill="#a33b2a">+13.8 kJ/mol</text>
<text x="220" y="236.4" font-size="14" text-anchor="start" font-weight="normal" fill="#a33b2a">uphill: will not go</text>
<line x1="370" y1="140" x2="450" y2="140" stroke="#1c2833" stroke-width="3"/>
<line x1="470" y1="262.0" x2="550" y2="262.0" stroke="#1c2833" stroke-width="3"/>
<line x1="460" y1="140" x2="460" y2="268.0" stroke="#2f5d8a" stroke-width="2.5" marker-end="url(#ahb)"/>
<text x="460" y="94" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">ATP + H₂O</text>
<text x="460" y="112" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">→ ADP + Pᵢ</text>
<text x="470" y="197.0" font-size="15" text-anchor="start" font-weight="bold" fill="#2f5d8a">−30.5 kJ/mol</text>
<text x="470" y="215.0" font-size="14" text-anchor="start" font-weight="normal" fill="#2f5d8a">downhill</text>
<line x1="620" y1="140" x2="700" y2="140" stroke="#1c2833" stroke-width="3"/>
<line x1="720" y1="206.8" x2="800" y2="206.8" stroke="#1c2833" stroke-width="3"/>
<line x1="710" y1="140" x2="710" y2="212.8" stroke="#2f5d8a" stroke-width="2.5" marker-end="url(#ahb)"/>
<text x="710" y="94" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">glucose + ATP</text>
<text x="710" y="112" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2833">→ glucose-6-P + ADP</text>
<text x="720" y="169.4" font-size="15" text-anchor="start" font-weight="bold" fill="#2f5d8a">−16.7 kJ/mol</text>
<text x="720" y="187.4" font-size="14" text-anchor="start" font-weight="normal" fill="#2f5d8a">coupled: goes</text>
<text x="460" y="390" font-size="14" text-anchor="middle" font-weight="normal" fill="#1c2833" font-style="italic">Arrow lengths are drawn to scale (standard free energy changes, ΔG°′).</text>
</svg>
