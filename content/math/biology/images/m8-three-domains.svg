<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" font-family="sans-serif">
<rect width="660" height="380" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1c2833"/></marker></defs>
<!-- tree -->
<g stroke="#1c2833" stroke-width="4" fill="none" stroke-linecap="round">
  <line x1="40" y1="170" x2="80" y2="170"/>
  <line x1="80" y1="70" x2="80" y2="255"/>
  <line x1="80" y1="70" x2="420" y2="70"/>
  <line x1="80" y1="255" x2="240" y2="255"/>
  <line x1="240" y1="195" x2="240" y2="315"/>
  <line x1="240" y1="195" x2="420" y2="195"/>
  <line x1="240" y1="315" x2="420" y2="315"/>
</g>
<circle cx="40" cy="170" r="7" fill="#1c2833"/>
<line x1="40" y1="178" x2="40" y2="282" stroke="#1c2833" stroke-width="1.2"/>
<text x="22" y="300" font-size="14" fill="#1c2833">common ancestor</text>
<text x="22" y="318" font-size="14" fill="#1c2833">of all cells</text>
<!-- endosymbiosis arrow -->
<path d="M 360 78 L 360 300" stroke="#1c2833" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#ah)"/>
<text x="350" y="118" font-size="14" fill="#1c2833" text-anchor="end">a bacterium taken in</text>
<text x="350" y="136" font-size="14" fill="#1c2833" text-anchor="end">became the mitochondrion</text>
<!-- tip boxes -->
<rect x="425" y="42" width="215" height="58" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="437" y="66" font-size="18" font-weight="bold" fill="#1c2833">Bacteria</text>
<text x="437" y="88" font-size="14" fill="#1c2833">E. coli, cyanobacteria</text>
<rect x="425" y="167" width="215" height="58" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<text x="437" y="191" font-size="18" font-weight="bold" fill="#1c2833">Archaea</text>
<text x="437" y="213" font-size="14" fill="#1c2833">methanogens, salt lovers</text>
<rect x="425" y="287" width="215" height="58" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="437" y="311" font-size="18" font-weight="bold" fill="#1c2833">Eukarya</text>
<text x="437" y="333" font-size="14" fill="#1c2833">protists, fungi, plants, animals</text>
<text x="250" y="60" font-size="14" fill="#1c2833" text-anchor="middle">peptidoglycan walls</text>
</svg>
