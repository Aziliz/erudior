<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" font-family="sans-serif"><title>The lac operon with no lactose and with lactose present</title><rect x="0" y="0" width="860" height="470" fill="#ffffff"/><text x="20.0" y="36.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1c2833">No lactose: genes OFF</text><line x1="20.0" y1="120.0" x2="840.0" y2="120.0" stroke="#1c2833" stroke-width="4"/><rect x="40.0" y="104.0" width="80.0" height="32.0" rx="0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="80.0" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacI</text><rect x="230.0" y="104.0" width="60.0" height="32.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="260.0" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">P</text><rect x="290.0" y="104.0" width="45.0" height="32.0" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="312.5" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">O</text><rect x="335.0" y="104.0" width="185.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="427.5" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacZ</text><rect x="520.0" y="104.0" width="130.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="585.0" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacY</text><rect x="650.0" y="104.0" width="110.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="705.0" y="126.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacA</text><path d="M 282 104 L 282 76 Q 282 58 300 58 L 324 58 Q 342 58 342 76 L 342 104 L 324 104 L 324 90 L 300 90 L 300 104 Z" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><ellipse cx="225.0" cy="80.0" rx="42.0" ry="26.0" fill="#c9e3d2" stroke="#1c2833" stroke-width="2"/><text x="570.0" y="80.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">repressor blocks the operator,</text><text x="570.0" y="98.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">so RNA polymerase cannot pass</text><line x1="80.0" y1="138.0" x2="80.0" y2="170.0" stroke="#1c2833" stroke-width="1.5"/><polygon points="80.0,170.0 76.1,160.8 83.9,160.8" fill="#1c2833" stroke="#1c2833" stroke-width="1"/><text x="90.0" y="170.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">makes the repressor (always on)</text><text x="20.0" y="222.0" font-size="17" text-anchor="start" font-weight="bold" fill="#1c2833">Lactose present: genes ON</text><line x1="20.0" y1="360.0" x2="840.0" y2="360.0" stroke="#1c2833" stroke-width="4"/><rect x="40.0" y="344.0" width="80.0" height="32.0" rx="0" fill="#e8e2f3" stroke="#1c2833" stroke-width="2"/><text x="80.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacI</text><rect x="230.0" y="344.0" width="60.0" height="32.0" rx="0" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/><text x="260.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">P</text><rect x="290.0" y="344.0" width="45.0" height="32.0" rx="0" fill="#f8e1dc" stroke="#1c2833" stroke-width="2"/><text x="312.5" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#1c2833">O</text><rect x="335.0" y="344.0" width="185.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="427.5" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacZ</text><rect x="520.0" y="344.0" width="130.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="585.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacY</text><rect x="650.0" y="344.0" width="110.0" height="32.0" rx="0" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/><text x="705.0" y="366.0" font-size="16" text-anchor="middle" font-weight="bold" font-style="italic" fill="#1c2833">lacA</text><path d="M 80 308 L 80 280 Q 80 262 98 262 L 122 262 Q 140 262 140 280 L 140 308 L 122 308 L 122 294 L 98 294 L 98 308 Z" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/><polygon points="122.0,278.0 115.0,290.1 101.0,290.1 94.0,278.0 101.0,265.9 115.0,265.9" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/><ellipse cx="470.0" cy="320.0" rx="42.0" ry="26.0" fill="#c9e3d2" stroke="#1c2833" stroke-width="2"/><line x1="515.0" y1="320.0" x2="560.0" y2="320.0" stroke="#1c2833" stroke-width="2"/><polygon points="560.0,320.0 550.8,323.9 550.8,316.1" fill="#1c2833" stroke="#1c2833" stroke-width="1"/><path d="M 445 300 C 420 265 380 260 340 250" fill="none" stroke="#b03a2e" stroke-width="4"/><text x="300.0" y="242.0" font-size="15" text-anchor="start" font-weight="bold" fill="#b03a2e">mRNA</text><text x="155.0" y="280.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">lactose binds the repressor,</text><text x="155.0" y="298.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">which lets go of the operator</text><text x="590.0" y="314.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">polymerase transcribes</text><text x="590.0" y="332.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">lacZ, lacY, lacA</text><text x="40.0" y="410.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">P = promoter; O = operator; lacZ, lacY, lacA = genes for lactose-using proteins</text><text x="40.0" y="432.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1c2833">Blue shape = repressor; green oval = RNA polymerase; yellow hexagon = lactose (inducer)</text></svg>