- {front: Lines of evidence for evolution, back: 'Fossil record (order, transitional fossils), radiometric dating, homologous and vestigial structures, embryos, molecular similarities, biogeography, and evolution observed directly (antibiotic resistance).', topic: Evidence for evolution}
- {front: Radioactive dating formula, back: 'Fraction left after $h$ half-lives $= \left(\tfrac12\right)^h$; age $= h \times$ half-life. Carbon-14: 5,730 years (up to ~50,000 years). Potassium-40: 1.25 billion years.', topic: Evidence for evolution}
- {front: Homologous vs analogous structures, back: 'Homologous: same structure from a common ancestor, possibly different jobs (human arm, bat wing). Analogous: same job, different structure and origin (bird wing, insect wing).', topic: Evidence for evolution}
- {front: Vestigial structure examples, back: 'Hip bones in whales and some snakes, the human tailbone, small human ear muscles: reduced remnants of ancestral structures.', topic: Evidence for evolution}
- {front: Why Tiktaalik matters, back: 'A fish with neck, lungs and limb-like fin bones (~375 million years old), found by predicting the age and type of rock where a fish–tetrapod transition should be.', topic: Evidence for evolution}
- {front: Molecular differences and relatedness, back: 'More differences in a gene or protein (like cytochrome c) between two species means a longer time since their common ancestor.', topic: Evidence for evolution}
- {front: Darwin–Wallace argument for natural selection, back: 'Variation + inheritance + overproduction + differential reproductive success → heritable traits that help become more common over generations.', topic: Natural selection}
- {front: Fitness (biology), back: 'Reproductive success relative to others in the population, not strength or speed.', topic: Natural selection}
- {front: Lederberg replica plating, back: 'Resistant colonies existed on a plate never exposed to the antibiotic: mutations arise randomly before selection; the environment selects, it does not create them.', topic: Natural selection}
- {front: Grant finches (Daphne Major 1977), back: 'Drought left large, hard seeds; deeper-beaked medium ground finches survived; the next generation had deeper beaks on average. Wet years later reversed the direction.', topic: Natural selection}
- {front: Phenotype share after selection, back: 'Multiply each group by its survival rate, then divide: dark share $= \dfrac{n_D s_D}{n_L s_L + n_D s_D}$.', topic: Natural selection}
- {front: 'Directional vs stabilizing vs disruptive selection', back: 'Directional: one extreme favored, average shifts. Stabilizing: average favored, spread narrows. Disruptive: both extremes favored, middle declines.', topic: Adaptation}
- {front: Artificial vs natural selection, back: 'Artificial: people choose which individuals breed (dogs, cabbage and broccoli). Natural: the environment determines who survives and reproduces.', topic: Adaptation}
- {front: What natural selection cannot do, back: 'Change individuals (populations evolve), plan ahead, create needed mutations, or pass on traits acquired during life.', topic: Adaptation}
- {front: Hardy-Weinberg equations, back: '$p + q = 1$ (alleles); $p^2 + 2pq + q^2 = 1$ (genotypes $AA$, $Aa$, $aa$).', topic: Hardy-Weinberg}
- {front: Five Hardy-Weinberg conditions, back: 'No mutation, no gene flow, very large population (no drift), random mating, no natural selection.', topic: Hardy-Weinberg}
- {front: Finding carriers from disease frequency, back: '$q = \sqrt{\text{frequency of } aa}$, $p = 1 - q$, carriers $= 2pq$. Example: 1 in 2,500 affected → $q = 0.02$, carriers ≈ 0.039 (about 1 in 25).', topic: Hardy-Weinberg}
- {front: Allele frequency from genotype counts, back: '$p = \dfrac{2(\text{number } AA) + (\text{number } Aa)}{2N}$, because each individual carries two copies.', topic: Hardy-Weinberg}
- {front: Mechanisms of evolution, back: 'Mutation, gene flow, genetic drift (bottleneck and founder effects), nonrandom mating, natural selection. Only selection consistently produces adaptation.', topic: Mechanisms of evolution}
- {front: Bottleneck vs founder effect, back: 'Bottleneck: a population crashes and regrows from few survivors (northern elephant seals). Founder: a few individuals start a new population (Ellis–van Creveld syndrome among the Old Order Amish).', topic: Mechanisms of evolution}
- {front: Biological species concept, back: 'Populations that can interbreed in nature and produce fertile offspring, isolated from other such groups. Does not work for asexual organisms or fossils.', topic: Speciation}
- {front: Prezygotic vs postzygotic barriers, back: 'Prezygotic (before fertilization): habitat, temporal, behavioral, mechanical, gametic. Postzygotic: hybrid inviability, hybrid sterility (mules), hybrid breakdown.', topic: Speciation}
- {front: Allopatric vs sympatric speciation, back: 'Allopatric: a geographic barrier splits the population (snapping shrimp across the Isthmus of Panama). Sympatric: no barrier, for example polyploidy in plants or a host shift in apple maggot flies.', topic: Speciation}
- {front: Reading a phylogenetic tree, back: 'Nodes are common ancestors; tips are the groups compared (usually living ones). Two groups are most closely related if they share the most recent node. Rotating branches changes nothing.', topic: Phylogeny}
- {front: Clade and shared derived characters, back: 'A clade is an ancestor and all its descendants. Clades are identified by shared derived traits that arose in their common ancestor (hair for mammals).', topic: Phylogeny}
- {front: Major eras of the Phanerozoic, back: 'Paleozoic 539–252 million years ago, Mesozoic 252–66, Cenozoic 66–present. Everything before 539 is the Precambrian, nearly 90% of Earth''s history.', topic: Geologic time}
- {front: Key dates in the history of life, back: 'Earth 4.54 billion years ago; first fossils ~3.5 billion; oxygen builds up ~2.4 billion; eukaryotes ~2 billion; Cambrian explosion ~539 million; Homo sapiens ~300,000 years.', topic: History of life}
- {front: The five mass extinctions, back: 'End-Ordovician (~445), Late Devonian (~372), End-Permian (~252, the largest), End-Triassic (~201), End-Cretaceous (66, asteroid impact). Dates in millions of years ago.', topic: Geologic time}
- {front: Gradualism vs punctuated equilibrium, back: 'Gradualism: slow, steady change. Punctuated equilibrium: long stability broken by relatively rapid change (Eldredge and Gould, 1972). Both occur.', topic: History of life}
- {front: Origin of eukaryotes (current view), back: 'An archaeal host cell, related to today''s Asgard archaea, took in an oxygen-using bacterium that became the mitochondrion; later one eukaryote lineage took in a cyanobacterium that became the chloroplast. So many trees show eukaryotes branching from within the archaea.', topic: History of life}
- {front: Relative fitness and selection coefficient, back: '$w$ = genotype''s offspring number ÷ fittest genotype''s, so the fittest has $w = 1$. Selection coefficient $s = 1 - w$.', topic: Selection models}
- {front: One generation of selection (steps), back: 'Zygotes $p^2, 2pq, q^2$ → multiply each by its $w$ → add to get $\bar w$ → divide each by $\bar w$ → count alleles: $q'' = (q^2 w_{aa} + pq\,w_{Aa})/\bar w$.', topic: Selection models}
- {front: Why rare recessive alleles persist, back: 'When $q$ is small, almost every copy is in a heterozygote with normal fitness, so selection against $aa$ lowers $q$ very slowly.', topic: Selection models}
- {front: Heterozygote advantage equilibrium, back: 'With $w_{AA} = 1 - s$, $w_{Aa} = 1$, $w_{aa} = 1 - t$: both alleles stay, at $\hat q = s/(s + t)$. Example: sickle-cell hemoglobin where malaria is common.', topic: Selection models}
- {front: Chi-square test of Hardy-Weinberg, back: 'Estimate $p$ from the counts; expected $p^2N$, $2pqN$, $q^2N$; $\chi^2 = \sum (O - E)^2/E$; df = 3 − 1 − 1 = 1, critical value 3.84.', topic: Selection models}
- {front: Fixation by drift, back: 'A neutral allele is eventually fixed with probability equal to its current frequency; a new mutation (one copy of $2N$) with probability $1/(2N)$.', topic: Genetic drift}
- {front: Heterozygosity lost to drift, back: '$H_t = H_0\left(1 - \tfrac{1}{2N}\right)^t$. With $N = 25$, about 64% is lost in 50 generations; with $N = 500$, about 5%.', topic: Genetic drift}
- {front: Effective population size formulas, back: 'Unequal sexes: $N_e = 4N_mN_f/(N_m + N_f)$. Changing size over $t$ generations: harmonic mean, $N_e = t / \sum (1/N_i)$, dominated by the smallest generation.', topic: Genetic drift}
- {front: 'When does drift beat selection?', back: 'Roughly, when $s$ is smaller than about $1/(2N_e)$, an allele behaves as if neutral; in small populations even harmful alleles can be fixed.', topic: Genetic drift}
- {front: Testing Hardy-Weinberg needs every genotype, back: 'You must count $AA$, $Aa$ and $aa$ separately, so use codominant traits (MN blood group) or DNA typing. Failing to reject doesn''t prove no evolution.', topic: Selection models}
- {front: Shared derived vs shared ancestral character, back: 'Derived: arose in the group''s common ancestor (hair for mammals), defines a clade. Ancestral: inherited from an older ancestor and found outside the group too (backbone for mammals).', topic: Cladistics}
- {front: Clade vs paraphyletic group, back: 'Clade: an ancestor and all its descendants. Paraphyletic: an ancestor and only some descendants, like reptiles without birds.', topic: Cladistics}
- {front: Role of the outgroup, back: 'A relative that branched off earlier: its states are taken as ancestral, and the root goes on its branch.', topic: Cladistics}
- {front: Homoplasy, back: 'Similarity not from common ancestry: convergence (bat and bird wings, as wings) or reversal (snakes losing legs). On a tree it appears as the same change happening more than once.', topic: Cladistics}
- {front: Maximum parsimony, back: 'Count the changes each tree needs and choose the fewest. Only states shared by some but not all ingroup species are informative.', topic: Cladistics}
- {front: Number of possible rooted trees, back: '$1 \times 3 \times 5 \times \cdots \times (2n - 3)$: 3 for 3 species, 15 for 4, 105 for 5, about 34 million for 10.', topic: Cladistics}
- {front: Molecular clock equation, back: 'Difference between two species $d = 2rT$ ($r$ per lineage), so $T = d/(2r)$. Calibrate $r$ from a split dated by fossils or geology.', topic: Molecular clocks}
- {front: Limits of molecular clocks, back: 'Rates differ among genes and lineages; old splits saturate (repeated changes at a site hide earlier ones), making them look too young. Use many genes, several calibrations and relaxed clocks.', topic: Molecular clocks}
- {front: Horizontal gene transfer in bacteria, back: 'Transformation (taking up DNA), transduction (DNA carried by a virus), conjugation (plasmids passed by contact). Spreads antibiotic resistance between species.', topic: Cladistics}
- {front: Gene tree vs species tree, back: 'One gene''s history can differ from the species'' history, for example after horizontal transfer, so species trees are built from many genes.', topic: Cladistics}
