- term: cell cycle
  definition: 'The life of a cell from its formation by division to its own division: interphase (G1, S, G2) followed by the M phase (mitosis and cytokinesis).'
  topic: Cell cycle
- term: interphase
  definition: 'The long part of the cell cycle between divisions: G1 (growth), S (DNA replication) and G2 (preparation for division).'
  topic: Cell cycle
- term: sister chromatid
  aliases: [sister chromatids, chromatid, chromatids]
  definition: 'One of the two identical copies of a chromosome made during S phase, joined to its sister at the centromere until anaphase.'
  topic: Cell cycle
- term: centromere
  definition: 'The constricted region where sister chromatids are held together and where spindle fibers attach.'
  topic: Mitosis
- term: mitosis
  definition: 'Division of the nucleus that gives two nuclei with the same chromosome number as the parent; stages are prophase, metaphase, anaphase, telophase.'
  topic: Mitosis
- term: cytokinesis
  definition: 'Division of the cytoplasm into two cells, by a cleavage furrow in animal cells or a cell plate in plant cells.'
  topic: Mitosis
- term: spindle
  aliases: [spindle fibers, mitotic spindle]
  definition: 'A framework of microtubules that attaches to chromosomes at their centromeres and moves them during mitosis and meiosis.'
  topic: Mitosis
- term: prophase
  definition: 'First stage of mitosis: chromosomes condense, the spindle forms, and the nuclear envelope breaks down.'
  topic: Mitosis
- term: metaphase
  definition: 'Stage of mitosis in which chromosomes line up along the middle of the cell, attached to spindle fibers from both poles.'
  topic: Mitosis
- term: anaphase
  definition: 'Stage of mitosis in which sister chromatids separate and move to opposite poles.'
  topic: Mitosis
- term: telophase
  definition: 'Last stage of mitosis: chromosomes reach the poles, nuclear envelopes re-form, and chromosomes uncoil.'
  topic: Mitosis
- term: mitotic index
  definition: 'The percentage of cells in a sample that are in mitosis: (cells in mitosis ÷ total cells) × 100%.'
  topic: Mitosis
- term: checkpoint
  aliases: [checkpoints]
  definition: 'A control point in the cell cycle (G1, G2, spindle) where the cell checks conditions such as size, signals, DNA damage or chromosome attachment before going on.'
  topic: Cell cycle regulation
- term: apoptosis
  definition: 'Programmed cell death: an orderly self-destruction that removes damaged or unneeded cells without inflammation.'
  topic: Cell cycle regulation
- term: cyclin
  aliases: [cyclins]
  definition: 'A regulatory protein whose level rises and falls during the cell cycle; it activates cyclin-dependent kinases.'
  topic: Cell cycle regulation
- term: CDK
  aliases: [CDKs, cyclin-dependent kinase, cyclin-dependent kinases]
  definition: 'Cyclin-dependent kinase: an enzyme that, when bound to a cyclin, phosphorylates target proteins to move the cell into the next phase of the cycle.'
  topic: Cell cycle regulation
- term: cancer
  definition: 'A group of diseases in which cells divide uncontrollably and can invade other tissues, caused by accumulated mutations in genes that regulate the cell cycle.'
  topic: Cancer
- term: proto-oncogene
  aliases: [proto-oncogenes]
  definition: 'A normal gene whose protein stimulates cell division (a "gas pedal"), such as RAS; when mutated to be overactive it becomes an oncogene.'
  topic: Cancer
- term: oncogene
  aliases: [oncogenes]
  definition: 'A mutated, overactive form of a proto-oncogene that pushes a cell to divide; one mutated copy is enough to have an effect.'
  topic: Cancer
- term: tumor suppressor gene
  aliases: [tumor suppressor genes, tumor suppressor]
  definition: 'A gene whose protein slows division, repairs DNA or triggers apoptosis (a "brake"), such as p53 or RB; usually both copies must be lost to contribute to cancer.'
  topic: Cancer
- term: metastasis
  definition: 'The spread of cancer cells from a malignant tumor through blood or lymph to form new tumors elsewhere in the body.'
  topic: Cancer
- term: stem cell
  aliases: [stem cells]
  definition: 'An unspecialized cell that can divide to renew itself and can also give rise to specialized cells.'
  topic: Stem cells
- term: pluripotent
  definition: 'Able to become every cell type of the body (but not the placenta), as embryonic stem cells and iPSCs are. Compare totipotent (every type) and multipotent (several related types).'
  topic: Stem cells
- term: iPSC
  aliases: [iPSCs, induced pluripotent stem cell, induced pluripotent stem cells]
  definition: 'Induced pluripotent stem cell: a body cell reprogrammed (first done by adding four genes, in 2006) to behave like an embryonic stem cell.'
  topic: Stem cells
- term: meiosis
  definition: 'A two-stage division that turns one diploid cell into four genetically different haploid cells, used to make gametes.'
  topic: Meiosis
- term: homologous chromosomes
  aliases: [homologs, homologous chromosome, homolog]
  definition: 'A pair of chromosomes, one from each parent, with the same size, centromere position and genes in the same order, though possibly different versions of those genes.'
  topic: Meiosis
- term: diploid
  aliases: [2n]
  definition: 'Having two complete sets of chromosomes, one from each parent (2n); human body cells are diploid with 46 chromosomes.'
  topic: Meiosis
- term: haploid
  definition: 'Having one set of chromosomes (n); human gametes are haploid with 23 chromosomes.'
  topic: Meiosis
- term: gamete
  aliases: [gametes]
  definition: 'A haploid sex cell (egg or sperm) that joins another gamete at fertilization to form a diploid zygote.'
  topic: Meiosis
- term: crossing over
  definition: 'Exchange of matching segments between chromatids of homologous chromosomes during prophase I of meiosis, producing new combinations of genes.'
  topic: Meiosis
- term: independent assortment
  definition: 'The random, independent orientation of each homologous pair at metaphase I, giving 2ⁿ possible chromosome combinations in gametes (n = number of pairs).'
  topic: Meiosis
- term: nondisjunction
  definition: 'Failure of homologous chromosomes (meiosis I) or sister chromatids (meiosis II) to separate, producing gametes with an extra or missing chromosome.'
  topic: Meiosis
