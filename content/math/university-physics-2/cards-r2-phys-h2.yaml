# Round 2 cards for honors module phys-h2 (lessons 90-93)
- {front: 'Divergence', back: '$\nabla\cdot\vec E = \partial_xE_x + \partial_yE_y + \partial_zE_z$: outward flux per unit volume (a scalar). Positive at sources, zero where field lines pass through.', topic: Maxwell's equations}
- {front: 'Curl', back: 'Circulation per unit area around small loops (a vector). Stokes: $\oint\vec E\cdot d\vec\ell = \int(\nabla\times\vec E)\cdot d\vec A$.', topic: Maxwell's equations}
- {front: 'Maxwell''s equations at a point', back: '$\nabla\cdot\vec E = \rho/\varepsilon_0$; $\nabla\cdot\vec B = 0$; $\nabla\times\vec E = -\partial\vec B/\partial t$; $\nabla\times\vec B = \mu_0\vec J + \mu_0\varepsilon_0\,\partial\vec E/\partial t$.', topic: Maxwell's equations}
- {front: 'Continuity equation', back: '$\nabla\cdot\vec J + \partial\rho/\partial t = 0$ (local charge conservation).', topic: Maxwell's equations}
- {front: 'Why Ampère''s law needed the displacement current', back: '$\nabla\cdot(\nabla\times\vec B) = 0$, so $\nabla\times\vec B = \mu_0\vec J$ would force $\nabla\cdot\vec J = 0$: charge could never build up. The extra term makes the equations imply the continuity equation.', topic: Maxwell's equations}
- {front: 'Magnetic field between charging circular plates', back: '$B = \dfrac{\mu_0Ir}{2\pi R^2}$ for $r < R$ (from $dE/dt = I/(\varepsilon_0\pi R^2)$).', topic: Maxwell's equations}
- {front: 'Wave equation from Maxwell''s equations', back: 'In vacuum, $\nabla^2\vec E = \mu_0\varepsilon_0\,\partial^2\vec E/\partial t^2$ (same for $\vec B$): waves at $c = 1/\sqrt{\mu_0\varepsilon_0}$.', topic: Maxwell's equations}
- {front: 'Plane electromagnetic wave in vacuum', back: 'Transverse; $\vec E\perp\vec B$; $E = cB$, in phase; $\vec E\times\vec B$ points along the direction of travel.', topic: Maxwell's equations}
- {front: 'Identity used to get the wave equation', back: '$\nabla\times(\nabla\times\vec E) = \nabla(\nabla\cdot\vec E) - \nabla^2\vec E$.', topic: Maxwell's equations}
- {front: 'Line charge density of a moving row of charges', back: '$\lambda = \gamma\lambda_0$: charge is invariant, spacing contracts.', topic: Fields and relativity}
- {front: 'Neutral wire seen by a charge moving along it at $v$', back: 'It has net density of size $\gamma vI/c^2$: negative if the charge moves along the current. The lab''s magnetic force is that frame''s electric force.', topic: Fields and relativity}
- {front: 'Field transformations (boost $\vec v$)', back: '$E''_\parallel = E_\parallel$, $B''_\parallel = B_\parallel$; $\vec E''_\perp = \gamma(\vec E + \vec v\times\vec B)_\perp$; $\vec B''_\perp = \gamma(\vec B - \vec v\times\vec E/c^2)_\perp$.', topic: Fields and relativity}
- {front: 'Field invariants', back: '$\vec E\cdot\vec B$ and $E^2 - c^2B^2$: the same in every inertial frame.', topic: Fields and relativity}
- {front: 'Crossed fields with $E < cB$', back: 'In the frame moving at $v = E/B$ along $\vec E\times\vec B$, only $B'' = B/\gamma$ remains (why a velocity selector passes speed $E/B$).', topic: Fields and relativity}
- {front: 'Transverse force in two frames', back: 'In a frame where the particle moves, the transverse force is smaller by $\gamma$ than in its rest frame: same momentum change, dilated time.', topic: Fields and relativity}
- {front: 'Field of a uniformly moving charge', back: 'Radial from the present position; weaker by $1/\gamma^2$ along the motion, stronger by $\gamma$ at the sides; $\vec B = \vec v\times\vec E/c^2$.', topic: Fields and relativity}
- {front: 'Which charges radiate?', back: 'Only accelerated ones (speeding up, slowing down or turning). Uniform motion does not radiate.', topic: Radiation from accelerating charges}
- {front: 'Radiation field of an accelerated charge', back: '$E_{\text{rad}} = \dfrac{qa\sin\theta}{4\pi\varepsilon_0c^2r}$: transverse, falls as $1/r$, zero along the acceleration.', topic: Radiation from accelerating charges}
- {front: 'Larmor formula', back: '$P = \dfrac{q^2a^2}{6\pi\varepsilon_0c^3}$ (slow charges); pattern $\propto\sin^2\theta$.', topic: Radiation from accelerating charges}
- {front: 'Rayleigh scattering', back: 'Scattered power $\propto 1/\lambda^4$ for scatterers much smaller than $\lambda$: blue (450 nm) scatters about 6 times more than red (700 nm).', topic: Radiation from accelerating charges}
- {front: 'Classical collapse time of hydrogen', back: '$t = r_0^3/(4r_e^2c) \approx 1.6\times10^{-11}$ s, with $r_e = ke^2/(m_ec^2) = 2.81\times10^{-15}$ m.', topic: Radiation from accelerating charges}
- {front: 'Power radiated by a classical electron at the Bohr radius', back: 'About $4.7\times10^{-8}$ W ($a \approx 9\times10^{22}$ m/s²).', topic: Radiation from accelerating charges}
- {front: 'Correspondence principle (hydrogen)', back: '$f_{\text{orbit}} = 6.57\times10^{15}\text{ Hz}/n^3$; the $n \to n - 1$ photon has $f/f_{\text{orbit}} = \dfrac{n(2n - 1)}{2(n - 1)^2} \to 1$ for large $n$.', topic: Radiation from accelerating charges}
- {front: 'Electron circling in a magnetic field: radiation time scale', back: '$K/P$ does not depend on speed (both $\propto v^2$), so the energy decays exponentially; about 2.6 s at 1.0 T.', topic: Radiation from accelerating charges}
- {front: 'Four-momentum', back: '$P = (E/c, \vec p)$; transforms like $(ct, \vec x)$; $P_1\cdot P_2 = E_1E_2/c^2 - \vec p_1\cdot\vec p_2$; $P\cdot P = m^2c^2$ (0 for a photon).', topic: Four-momentum}
- {front: 'Invariant mass of a system', back: '$M^2c^4 = (\sum E)^2 - |\sum\vec pc|^2$; equals the total energy in the center-of-momentum frame.', topic: Four-momentum}
- {front: 'Invariant mass of two photons', back: '$M^2c^4 = 2E_1E_2(1 - \cos\theta)$; zero only if they travel the same way.', topic: Four-momentum}
- {front: 'Fixed-target threshold', back: '$K_{\text{th}} = \dfrac{M^2 - (m_b + m_t)^2}{2m_t}c^2$ for beam $m_b$ on target $m_t$ at rest making total mass $M$.', topic: Four-momentum}
- {front: 'Pair-production thresholds', back: 'Near a heavy nucleus about $2m_ec^2 = 1.022$ MeV; on a free electron $4m_ec^2 = 2.044$ MeV; never for a lone photon in empty space.', topic: Four-momentum}
- {front: 'Why a free electron cannot absorb a photon', back: 'Electron plus photon has $M^2c^4 = (m_ec^2)^2 + 2Em_ec^2 > (m_ec^2)^2$; a lone electron after would have invariant mass $m_e$.', topic: Four-momentum}
- {front: 'Antiproton threshold ($p + p \to p + p + p + \bar p$)', back: '$K_{\text{th}} = 6m_pc^2 = 5.63$ GeV on a fixed target (discovered at the Bevatron, 1955).', topic: Four-momentum}
- {front: 'Compton formula from four-momentum', back: 'Square $Q'' = P + Q - P''$: $m_e(E - E'') = (EE''/c^2)(1 - \cos\theta)$, so $\lambda'' - \lambda = \dfrac{h}{m_ec}(1 - \cos\theta)$.', topic: Four-momentum}
- {front: 'Why colliders collide beams head-on', back: 'Equal and opposite momenta give zero total momentum, so the whole energy is available as $Mc^2$; a fixed target wastes most of it on motion.', topic: Four-momentum}
- {front: 'How big a charge imbalance makes a wire''s magnetic force?', back: 'Tiny: for a proton at $2\times10^6$ m/s beside a 15 A copper wire, about 2 parts in $10^{14}$ of the conduction charge. Magnetism is a small relativistic effect of huge cancelling charges.', topic: Fields and relativity}
