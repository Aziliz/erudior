# Round 2 notecards for phys-m10 (honors lessons).
- {front: 'Field on the axis of a current loop', back: '$B = \dfrac{\mu_0IR^2}{2(R^2 + z^2)^{3/2}}$ (times $N$ for a coil); $\mu_0I/(2R)$ at the center', topic: Magnetic field calculations}
- {front: 'Why only the axial part survives on a loop''s axis', back: 'Each element''s sideways $dB$ is cancelled by the element opposite; the axial part is $dB\cdot R/r$.', topic: Magnetic field calculations}
- {front: 'Far field of a small current loop on its axis', back: '$B = \dfrac{\mu_0}{2\pi}\dfrac{\mu}{z^3}$ with $\mu = IA$; falls as $1/z^3$', topic: Magnetic field calculations}
- {front: 'Dipole field in the equatorial plane', back: '$B = \dfrac{\mu_0}{4\pi}\dfrac{\mu}{r^3}$: half the axial value, pointing opposite to $\vec\mu$', topic: Magnetic field calculations}
- {front: 'Earth''s magnetic dipole moment', back: 'A little under $8\times10^{22}$ A·m²; dipole model: pole field about twice the equator field', topic: Magnetic field calculations}
- {front: 'Field of a finite straight wire', back: '$B = \dfrac{\mu_0I}{4\pi a}(\sin\theta_2 - \sin\theta_1)$, angles measured from the perpendicular', topic: Magnetic field calculations}
- {front: 'Field at the center of a square loop of side $s$', back: '$B = \dfrac{2\sqrt2\,\mu_0I}{\pi s}$, about 90% of the inscribed circle''s field', topic: Magnetic field calculations}
- {front: 'Helmholtz coils', back: 'Separation = radius $R$; $B = (4/5)^{3/2}\mu_0NI/R \approx 0.716\,\mu_0NI/R$, very uniform near the midpoint', topic: Magnetic field calculations}
- {front: 'Why the Helmholtz spacing is $R$', back: 'Each coil''s axial field has an inflection point at $R/2$; at the midpoint slopes cancel and curvature is zero.', topic: Magnetic field calculations}
- {front: 'Toroid field', back: '$B = \mu_0NI/(2\pi r)$ inside the windings; zero in the hole and outside', topic: Magnetic field calculations}
- {front: 'Conservative vs induced electric fields', back: 'Charge-made fields: $\oint\vec E\cdot d\vec\ell = 0$, potential exists. Induced: $\oint\vec E\cdot d\vec\ell = -d\Phi_B/dt$, no potential.', topic: Induced electric fields}
- {front: 'Induced field inside a long changing solenoid', back: '$E = \dfrac r2\left|\dfrac{dB}{dt}\right|$ (circles the axis)', topic: Induced electric fields}
- {front: 'Induced field outside a long changing solenoid', back: '$E = \dfrac{R^2}{2r}\left|\dfrac{dB}{dt}\right|$, even though $B \approx 0$ there', topic: Induced electric fields}
- {front: 'Direction of an induced electric field', back: 'The way an induced current would flow in a ring along the path (Lenz''s law).', topic: Induced electric fields}
- {front: 'Betatron condition', back: '$B_{\text{orbit}} = \tfrac12\bar B$ (field at the orbit is half the average field inside it)', topic: Induced electric fields}
- {front: 'Energy gained per turn in a betatron', back: '$e\,d\Phi_B/dt$ with $\Phi_B = \pi r^2\bar B$', topic: Induced electric fields}
- {front: 'Magnetic braking of a coasting rod', back: '$v = v_0e^{-t/\tau}$, $\tau = mR/(B^2L^2)$; stopping distance $v_0\tau$', topic: Induced electric fields}
- {front: 'Motor current with back emf', back: '$I = (V - \mathcal{E}_b)/R$; start-up (stalled) current $V/R$', topic: Induced electric fields}
- {front: 'Motor power and efficiency', back: 'Mechanical $\mathcal{E}_bI$, heat $I^2R$, efficiency $\mathcal{E}_b/V$ (ignoring friction); maximum power at $\mathcal{E}_b = V/2$', topic: Induced electric fields}
- {front: 'Phases in a series AC circuit', back: '$V_R$ in phase with $I$; $V_L$ leads by $90^\circ$; $V_C$ lags by $90^\circ$', topic: Driven RLC circuits}
- {front: 'Adding element voltages in AC', back: 'As phasors: $V = \sqrt{V_R^2 + (V_L - V_C)^2}$; the rms readings can sum to more than the source.', topic: Driven RLC circuits}
- {front: 'Complex impedances', back: '$Z_R = R$, $Z_L = j\omega L$, $Z_C = 1/(j\omega C)$; combine like resistances', topic: Driven RLC circuits}
- {front: 'Power vs frequency in a series RLC circuit', back: '$P = \dfrac{V_{\text{rms}}^2R}{R^2 + (\omega L - 1/\omega C)^2}$, maximum $V_{\text{rms}}^2/R$ at $\omega_0$', topic: Driven RLC circuits}
- {front: 'Quality factor of a series RLC circuit', back: '$Q = \dfrac{\omega_0L}{R} = \dfrac1R\sqrt{\dfrac LC}$', topic: Driven RLC circuits}
- {front: 'Bandwidth of a series RLC resonance', back: '$\Delta\omega = R/L = \omega_0/Q$ (half-power points); $\Delta f = f_0/Q$', topic: Driven RLC circuits}
- {front: 'Energy definition of Q', back: '$Q = 2\pi\times$ (energy stored)/(energy lost per cycle)', topic: Driven RLC circuits}
- {front: 'Voltage magnification at resonance', back: '$V_L = V_C = QV$ (each can far exceed the source voltage)', topic: Driven RLC circuits}
- {front: 'Free ringing of a resonant circuit', back: 'About $Q/\pi$ cycles for the amplitude to fall to $1/e$; no oscillation if $Q < \tfrac12$ ($R > 2\sqrt{L/C}$)', topic: Driven RLC circuits}
