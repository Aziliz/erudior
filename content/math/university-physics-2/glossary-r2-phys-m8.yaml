# Round 2 glossary for phys-m8 (honors lessons 06h1-06h3).
- term: Poisson's equation
  definition: '$\nabla^2V = -\rho/\varepsilon_0$: Gauss''s law written for the potential, linking how $V$ curves to the charge density.'
  topic: Method of images
- term: Laplace's equation
  definition: '$\nabla^2V = 0$, Poisson''s equation in a region with no charge. Its solutions have no local maximum or minimum.'
  topic: Method of images
- term: Earnshaw's theorem
  definition: 'No charged particle can be held in stable equilibrium by electrostatic forces from fixed charges alone, because the potential has no local minimum or maximum in empty space.'
  topic: Method of images
- term: uniqueness theorem
  definition: 'With the charge in a region and the potential on all its boundaries given, Laplace''s or Poisson''s equation has exactly one solution, so any solution that fits is the solution.'
  topic: Method of images
- term: image charge
  aliases: [image charges]
  definition: 'A fictitious charge placed outside the region of interest so that, together with the real charges, it gives a conductor''s surface the right potential.'
  topic: Method of images
- term: method of images
  definition: 'Solving a conductor problem by replacing the conductor with image charges that satisfy the same boundary conditions; the uniqueness theorem guarantees the result.'
  topic: Method of images
- term: polarization vector
  aliases: [polarization density]
  definition: 'The electric dipole moment per unit volume of a material, $\vec P$, in C/m².'
  topic: Dielectrics
- term: bound charge
  aliases: [bound charges, bound surface charge]
  definition: 'Charge left uncanceled at the surfaces (or inside) of a polarized dielectric; it belongs to the molecules and cannot flow. On a surface, $\sigma_b = \vec P\cdot\hat n$.'
  topic: Dielectrics
- term: free charge
  definition: 'Charge that can move through conductors and wires, such as the charge placed on capacitor plates, as opposed to bound charge.'
  topic: Dielectrics
- term: electric susceptibility
  aliases: [χe]
  definition: 'The constant $\chi_e$ in $\vec P = \varepsilon_0\chi_e\vec E$ for a linear dielectric; the dielectric constant is $\kappa = 1 + \chi_e$.'
  topic: Dielectrics
- term: electric displacement
  aliases: [D field, displacement field]
  definition: '$\vec D = \varepsilon_0\vec E + \vec P$; its flux through a closed surface equals the free charge enclosed. In a linear dielectric $\vec D = \kappa\varepsilon_0\vec E$.'
  topic: Dielectrics
- term: permittivity
  aliases: [ε]
  definition: 'The product $\varepsilon = \kappa\varepsilon_0$ for a material; in a uniform linear dielectric it replaces $\varepsilon_0$ in the vacuum formulas.'
  topic: Dielectrics
- term: fringing field
  aliases: [fringe field, fringing]
  definition: 'The part of a capacitor''s field that bulges out beyond the edges of the plates; it is what pulls a dielectric slab into the gap.'
  topic: Dielectrics
- term: dielectric strength
  definition: 'The largest electric field an insulator can withstand before it breaks down and conducts; about $3\times10^6$ V/m for dry air.'
  topic: Dielectrics
- term: self-energy
  definition: 'The energy needed to assemble one object''s own charge from far away: $kQ^2/(2R)$ for a thin shell, $\tfrac35kQ^2/R$ for a uniform ball.'
  topic: Electrostatic energy
- term: classical electron radius
  definition: '$r_e = ke^2/(m_ec^2) \approx 2.8\times10^{-15}$ m, the size at which a classical charge''s electric energy would match the electron''s rest energy. Not the electron''s actual size.'
  topic: Electrostatic energy
- term: electrostatic pressure
  definition: 'The outward force per area on a charged conductor''s surface, $\sigma^2/(2\varepsilon_0) = \tfrac12\varepsilon_0E^2$.'
  topic: Electrostatic energy
- term: virtual work
  definition: 'Finding a force from how the stored energy changes in a small displacement: $F = -(dU/dx)$ at fixed charge, $F = +(dU/dx)$ at fixed voltage.'
  topic: Electrostatic energy
