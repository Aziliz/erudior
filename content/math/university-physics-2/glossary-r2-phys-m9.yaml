# Round 2 glossary for phys-m9 (honors lessons 09h1 and 09h2)
- term: linear circuit
  aliases: [linear circuits]
  definition: 'A circuit of ideal sources and ohmic resistors, so every current and voltage is a linear combination of the source values. Thévenin''s, Norton''s and the superposition theorems apply to linear circuits.'
  topic: Network analysis
- term: node-voltage method
  aliases: [node analysis, nodal analysis, node method]
  definition: 'Circuit analysis that uses the potentials of the nodes (junctions) as unknowns, one node being the zero reference, and writes only junction-rule equations; $n$ nodes need $n - 1$ unknowns.'
  topic: Network analysis
- term: reference node
  definition: 'The node chosen to have zero potential in the node-voltage method (often marked "ground").'
  topic: Network analysis
- term: conductance
  aliases: [conductances, siemens]
  definition: 'The reciprocal of resistance, $G = 1/R$, measured in siemens (1 S = 1 A/V). Conductances in parallel add.'
  topic: Network analysis
- term: current source
  aliases: [current sources]
  definition: 'An ideal source that drives a fixed current whatever the voltage across it; the counterpart of an ideal battery, which holds a fixed voltage whatever the current.'
  topic: Network analysis
- term: Thévenin's theorem
  aliases: [Thevenin's theorem, Thévenin equivalent, Thevenin equivalent]
  definition: 'Any linear two-terminal network acts at its terminals like one emf $V_{\text{th}}$ (the open-circuit voltage) in series with one resistance $R_{\text{th}}$ (the resistance between the terminals with ideal batteries replaced by wires).'
  topic: Network analysis
- term: Norton's theorem
  aliases: [Norton equivalent]
  definition: 'Any linear two-terminal network acts like a current source $I_N$ (the short-circuit current) in parallel with $R_{\text{th}}$; $I_N = V_{\text{th}}/R_{\text{th}}$.'
  topic: Network analysis
- term: open-circuit voltage
  definition: 'The voltage between two terminals of a network with nothing connected to them; it equals the Thévenin voltage.'
  topic: Network analysis
- term: short-circuit current
  definition: 'The current through a wire connected directly across two terminals of a network; it equals the Norton current $V_{\text{th}}/R_{\text{th}}$.'
  topic: Network analysis
- term: superposition theorem
  definition: 'In a linear circuit, each current or voltage is the sum of those caused by each source acting alone, with the other ideal batteries replaced by wires. It does not apply to power.'
  topic: Network analysis
- term: Wheatstone bridge
  aliases: [bridge circuit]
  definition: 'Two voltage dividers across one battery with a galvanometer between their midpoints. It balances (no galvanometer current) when $R_1/R_2 = R_3/R_x$, giving an unknown resistance from three known ones.'
  topic: Network analysis
- term: galvanometer
  aliases: [galvanometers]
  definition: 'A sensitive meter for detecting small currents, used in a bridge to show when the current is zero.'
  topic: Network analysis
- term: null measurement
  definition: 'A measurement made by adjusting a circuit until a detector reads zero, so the result does not depend on the detector''s calibration or the source''s emf.'
  topic: Network analysis
- term: first-order circuit
  aliases: [first-order circuits]
  definition: 'A circuit described by a first-order differential equation, such as one with resistors, steady sources and a single capacitor; after a switch every quantity changes as $x_\infty + (x(0^+) - x_\infty)e^{-t/\tau}$.'
  topic: Circuit transients
- term: transient
  aliases: [transients]
  definition: 'The part of a circuit''s response that dies away after a change, such as the $e^{-t/\tau}$ term in an RC circuit.'
  topic: Circuit transients
- term: steady state
  definition: 'The behavior a circuit settles into once transients have died away: constant values for DC sources, a steady oscillation at the driving frequency for AC ones.'
  topic: Circuit transients
- term: threshold switch
  definition: 'A switch that closes when the voltage across it reaches an upper value $V_{\text{on}}$ and opens when it falls to a lower value $V_{\text{off}}$, such as a neon lamp or a comparator circuit.'
  topic: Circuit transients
- term: relaxation oscillator
  aliases: [relaxation oscillators]
  definition: 'A circuit that produces a repeating signal by charging a capacitor slowly and discharging it suddenly at a threshold; period $T = RC\ln\dfrac{\mathcal{E} - V_{\text{off}}}{\mathcal{E} - V_{\text{on}}}$ for a fast discharge.'
  topic: Circuit transients
- term: gain
  definition: 'The ratio of a circuit''s output amplitude to its input amplitude; for an RC low-pass filter, $1/\sqrt{1 + (\omega RC)^2}$.'
  topic: RC filters
- term: cutoff frequency
  aliases: [cutoff frequencies, corner frequency]
  definition: 'The frequency $f_c = 1/(2\pi RC)$ at which an RC filter''s gain is $1/\sqrt2$ (half power, about −3 dB) and the phase shift is 45°.'
  topic: RC filters
- term: high-pass filter
  aliases: [high-pass filters]
  definition: 'A circuit that passes rapid signal changes and blocks slow ones; an RC high-pass filter takes its output across the resistor and has gain $\omega RC/\sqrt{1 + (\omega RC)^2}$.'
  topic: RC filters
