- {front: 'Spacetime interval', back: '$(\Delta s)^2 = (c\Delta t)^2 - (\Delta x)^2$, the same in every inertial frame', topic: Spacetime and the Doppler effect}
- {front: 'Timelike, lightlike, spacelike', back: '$(\Delta s)^2 > 0$: a clock can attend both events; $= 0$: joined only by light; $< 0$: no signal can join them, order can differ between frames', topic: Spacetime and the Doppler effect}
- {front: 'Proper time from the interval', back: '$\Delta t_0 = \Delta s/c = \sqrt{(\Delta t)^2 - (\Delta x/c)^2}$ for a clock moving at constant velocity between the events', topic: Spacetime and the Doppler effect}
- {front: 'Spacetime diagram: slopes', back: 'Vertical worldline: at rest. $45^\circ$: light. Massive objects: always steeper than $45^\circ$.', topic: Spacetime and the Doppler effect}
- {front: 'Frame in which spacelike events are simultaneous', back: '$v = c^2\Delta t/\Delta x$ (always less than $c$ for a spacelike pair)', topic: Spacetime and the Doppler effect}
- {front: 'Twin paradox resolution', back: 'The traveler changes inertial frames; the straight (inertial) worldline between two events has the longest proper time', topic: Spacetime and the Doppler effect}
- {front: 'Twin example: 6.0 ly at $0.60c$ and back', back: 'Earth: 20 years. Traveler: $2\sqrt{10^2 - 6^2} = 16$ years', topic: Spacetime and the Doppler effect}
- {front: 'Relativistic Doppler (receding)', back: '$\lambda_{\text{obs}} = \lambda_{\text{src}}\sqrt{\dfrac{1 + \beta}{1 - \beta}}$; for approach replace $\beta$ by $-\beta$', topic: Spacetime and the Doppler effect}
- {front: 'Redshift $z$', back: '$z = \lambda_{\text{obs}}/\lambda_{\text{src}} - 1$; $z \approx \beta$ only when $\beta \ll 1$', topic: Spacetime and the Doppler effect}
- {front: 'Transverse Doppler effect', back: 'A source moving across the line of sight is redshifted by $\gamma$ (time dilation alone); sound has no such effect', topic: Spacetime and the Doppler effect}
- {front: 'Decay constant inside a barrier', back: '$\kappa = \dfrac{\sqrt{2m(U - E)}}{\hbar} = \dfrac{\sqrt{2(mc^2)(U - E)}}{\hbar c}$, with $\hbar c = 197.3$ eV·nm', topic: Quantum tunneling}
- {front: 'Wave function in a forbidden region', back: '$\psi \propto e^{-\kappa x}$; probability density $\propto e^{-2\kappa x}$', topic: Quantum tunneling}
- {front: 'Rectangular barrier, exact transmission ($E < U$)', back: '$T = \left[1 + \dfrac{U^2\sinh^2\kappa L}{4E(U - E)}\right]^{-1}$', topic: Quantum tunneling}
- {front: 'Thick-barrier transmission', back: '$T \approx 16\dfrac EU\left(1 - \dfrac EU\right)e^{-2\kappa L} \approx e^{-2\kappa L}$ (order of magnitude)', topic: Quantum tunneling}
- {front: 'Doubling a barrier''s width', back: 'Squares the factor $e^{-2\kappa L}$ (e.g. $10^{-3} \to 10^{-6}$), not halves it', topic: Quantum tunneling}
- {front: 'Mass dependence of tunneling', back: '$\kappa \propto \sqrt m$ in the exponent: a proton''s $\kappa$ is $\sqrt{1836} \approx 43$ times an electron''s', topic: Quantum tunneling}
- {front: 'STM sensitivity', back: 'Current $\propto e^{-2\kappa d}$; for a 4.5 eV work function, about a factor of 9 per 0.1 nm of gap', topic: Quantum tunneling}
- {front: 'Alpha decay as tunneling', back: 'Gamow; Gurney and Condon (1928): alphas tunnel through the Coulomb barrier (about 28 MeV for uranium-238, alphas 4.2 MeV)', topic: Quantum tunneling}
- {front: 'Where tunneling matters', back: 'Alpha decay, fusion in stars, the scanning tunneling microscope, flash memory, tunnel diodes', topic: Quantum tunneling}
- {front: 'Q-value', back: '$Q = (\sum m_i - \sum m_f)c^2$ (931.5 MeV per u); $Q > 0$ releases energy, $Q < 0$ needs energy supplied', topic: Nuclear energetics}
- {front: 'Beta-plus Q with atomic masses', back: '$Q = (M_{\text{parent}} - M_{\text{daughter}})c^2 - 2m_ec^2$, i.e. subtract 1.022 MeV', topic: Nuclear energetics}
- {front: 'Alpha energy from Q', back: '$K_\alpha \approx Q\dfrac{A - 4}{A}$; the daughter recoils with $Q\dfrac{4}{A}$', topic: Nuclear energetics}
- {front: 'D–T fusion', back: '$^2\text{H} + {}^3\text{H} \to {}^4\text{He} + n$, $Q = 17.6$ MeV; neutron 14.1 MeV, alpha 3.5 MeV', topic: Nuclear energetics}
- {front: 'Semi-empirical mass formula', back: '$E_B = a_VA - a_SA^{2/3} - a_C\dfrac{Z(Z - 1)}{A^{1/3}} - a_A\dfrac{(A - 2Z)^2}{A} \pm \delta$', topic: Nuclear energetics}
- {front: 'SEMF coefficients (one common fit)', back: '$a_V = 15.75$, $a_S = 17.8$, $a_C = 0.711$, $a_A = 23.7$ MeV, $\delta = 11.18/\sqrt A$ MeV', topic: Nuclear energetics}
- {front: 'Pairing term sign', back: 'Even $Z$, even $N$: $+\delta$. Odd $Z$, odd $N$: $-\delta$. Odd $A$: 0.', topic: Nuclear energetics}
- {front: 'Line of stability (liquid drop)', back: '$Z \approx \dfrac{A}{2 + 0.0150A^{2/3}}$: $Z \approx A/2$ for light nuclei, extra neutrons for heavy ones', topic: Nuclear energetics}
- {front: 'Highest binding energy per nucleon', back: 'Nickel-62 (8.795 MeV), just above iron-58 (8.792 MeV) and iron-56 (8.790 MeV)', topic: Nuclear energetics}
- {front: 'Energy per uranium-235 fission', back: 'About 200 MeV: $(8.5 - 7.6)$ MeV per nucleon $\times$ 236 nucleons', topic: Nuclear energetics}
