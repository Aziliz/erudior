# Round 2 cards for phys-m8 (honors lessons 06h1-06h3).
- {front: 'Poisson''s and Laplace''s equations', back: '$\nabla^2V = -\rho/\varepsilon_0$; where there is no charge, $\nabla^2V = 0$', topic: Method of images}
- {front: 'Laplace''s equation in one dimension (between plates)', back: '$d^2V/dx^2 = 0$, so $V = A + Bx$: linear potential, uniform field', topic: Method of images}
- {front: 'Averaging property of Laplace''s equation', back: 'In a charge-free region, $V$ at a point is the average of $V$ over any sphere around it, so $V$ has no local max or min there', topic: Method of images}
- {front: 'Earnshaw''s theorem', back: 'No stable equilibrium for a charge in a static electric field from fixed charges; ion traps add a magnetic field (Penning) or an oscillating field (Paul)', topic: Method of images}
- {front: 'Uniqueness theorem', back: 'Given the charge inside and $V$ on every boundary, there is only one solution, so any solution that fits is the solution', topic: Method of images}
- {front: 'Image for a grounded plane', back: 'Charge $q$ at height $d$: image $-q$ at depth $d$; force $kq^2/(2d)^2$ toward the plane', topic: Method of images}
- {front: 'Induced charge on a grounded plane', back: '$\sigma(r) = -\dfrac{qd}{2\pi(r^2 + d^2)^{3/2}}$; it totals $-q$', topic: Method of images}
- {front: 'Work to pull a charge away from a grounded plane', back: '$kq^2/(4d)$, half the energy of a real pair $2d$ apart', topic: Method of images}
- {front: 'Image for a grounded sphere', back: 'Charge $q$ at distance $a$ from the center of a sphere of radius $R$: image $-qR/a$ at $R^2/a$ from the center', topic: Method of images}
- {front: 'Neutral isolated sphere near a charge', back: 'Grounded-sphere image $-qR/a$ plus $+qR/a$ at the center; still attracts the charge', topic: Method of images}
- {front: 'Polarization vector', back: '$\vec P$ = dipole moment per volume (C/m²); bound surface charge $\sigma_b = \vec P\cdot\hat n$', topic: Dielectrics}
- {front: 'Linear dielectric', back: '$\vec P = \varepsilon_0\chi_e\vec E$, $\kappa = 1 + \chi_e$', topic: Dielectrics}
- {front: 'Bound charge in a filled capacitor', back: '$\sigma_b = \sigma_f(1 - 1/\kappa)$, opposite in sign to the plate it faces; field reduced to $\sigma_f/(\kappa\varepsilon_0)$', topic: Dielectrics}
- {front: 'Electric displacement', back: '$\vec D = \varepsilon_0\vec E + \vec P$; $\oint\vec D\cdot d\vec A = Q_{\text{free, enc}}$; linear: $\vec D = \kappa\varepsilon_0\vec E$', topic: Dielectrics}
- {front: 'Point charge inside a dielectric', back: '$E = q/(4\pi\kappa\varepsilon_0r^2)$: forces between charges are $\kappa$ times weaker', topic: Dielectrics}
- {front: 'Slab of thickness t in gap d', back: '$C = \dfrac{\varepsilon_0A}{d - t + t/\kappa}$ (layers in series); $D$ same in both layers', topic: Dielectrics}
- {front: 'Dielectric covering part of the plate area', back: 'Regions side by side are in parallel: $C = \varepsilon_0(A_1 + \kappa A_2)/d$', topic: Dielectrics}
- {front: 'Inserting a dielectric, battery disconnected', back: '$Q$ fixed: $V \to V/\kappa$, $U \to U/\kappa$; the field does work pulling the slab in', topic: Dielectrics}
- {front: 'Inserting a dielectric, battery connected', back: '$V$ fixed: $Q \to \kappa Q$, $U \to \kappa U$; battery supplies twice the gain, half goes into work on the slab', topic: Dielectrics}
- {front: 'Force pulling a slab into a capacitor (fixed V)', back: '$F = \tfrac12V^2\,dC/dx = (\kappa - 1)\varepsilon_0wV^2/(2d)$', topic: Dielectrics}
- {front: 'Dielectric strength limits', back: '$V_{\max} = E_{\max}d$; $u_{\max} = \tfrac12\kappa\varepsilon_0E_{\max}^2$; air $E_{\max} \approx 3\times10^6$ V/m', topic: Dielectrics}
- {front: 'Energy of a set of point charges', back: '$U = \sum_{\text{pairs}}kq_iq_j/r_{ij} = \tfrac12\sum q_iV_i$', topic: Electrostatic energy}
- {front: 'Energy stored in the field', back: '$U = \tfrac{\varepsilon_0}{2}\int E^2\,d\tau$ over all space', topic: Electrostatic energy}
- {front: 'Self-energy of a thin shell', back: '$kQ^2/(2R)$', topic: Electrostatic energy}
- {front: 'Self-energy of a uniformly charged ball', back: '$\tfrac35kQ^2/R$ (1.2 times the shell)', topic: Electrostatic energy}
- {front: 'Classical electron radius', back: '$r_e = ke^2/(m_ec^2) \approx 2.8$ fm; a length scale, not the electron''s size', topic: Electrostatic energy}
- {front: 'Useful combination for atoms and nuclei', back: '$ke^2 = 1.44$ eV·nm $= 1.44$ MeV·fm', topic: Electrostatic energy}
- {front: 'Electrostatic pressure on a conductor', back: '$\sigma^2/(2\varepsilon_0) = \tfrac12\varepsilon_0E^2$, outward for either sign', topic: Electrostatic energy}
- {front: 'Force between capacitor plates', back: '$F = Q^2/(2\varepsilon_0A) = \tfrac12QE$, attractive', topic: Electrostatic energy}
- {front: 'Virtual work', back: 'Fixed charge: $F = -dU/dx$. Fixed voltage: $F = +dU/dx$ (the battery supplies $2\,dU$)', topic: Electrostatic energy}
