# Round 2 glossary terms for phys-m10 (honors lessons).
- term: Helmholtz coils
  aliases: [Helmholtz coil, Helmholtz pair]
  definition: 'Two identical coaxial coils of radius $R$, carrying the same current in the same direction and separated by $R$; near the midpoint the field is very uniform, $B = (4/5)^{3/2}\mu_0NI/R$.'
  topic: Magnetic field calculations
- term: toroid
  aliases: [toroids, toroidal coil]
  definition: 'A coil wound on a ring-shaped (doughnut) core. Inside the windings $B = \mu_0NI/(2\pi r)$; outside, the field is zero.'
  topic: Magnetic field calculations
- term: conservative
  aliases: [conservative field, conservative fields]
  definition: 'Describes a field whose work on a charge around any closed path is zero ($\oint\vec E\cdot d\vec\ell = 0$), so that a potential can be defined. Fields made by static charges are conservative; induced electric fields are not.'
  topic: Induced electric fields
- term: induced electric field
  aliases: [induced electric fields, nonconservative electric field]
  definition: 'An electric field produced by a changing magnetic flux, with closed field lines and $\oint\vec E\cdot d\vec\ell = -d\Phi_B/dt$. It is not conservative, so it has no potential.'
  topic: Induced electric fields
- term: betatron
  aliases: [betatrons]
  definition: 'A circular accelerator in which an increasing magnetic field''s induced electric field speeds electrons up while the field at the orbit steers them; it requires $B_{\text{orbit}} = \tfrac12\bar B$.'
  topic: Induced electric fields
- term: back emf
  aliases: [back-emf, counter emf, counter-emf]
  definition: 'The emf induced in a motor''s spinning coil, which opposes the supply voltage and grows with speed: $I = (V - \mathcal{E}_b)/R$.'
  topic: Induced electric fields
- term: phasor
  aliases: [phasors, phasor diagram]
  definition: 'A rotating arrow representing a sinusoidal quantity: its length is the amplitude, its angle the phase. Sinusoids of the same frequency add as their phasors add, like vectors.'
  topic: Driven RLC circuits
- term: quality factor
  aliases: [Q factor, Q]
  definition: 'For a series RLC circuit, $Q = \omega_0L/R = \dfrac1R\sqrt{L/C}$; in general $2\pi$ times the energy stored divided by the energy lost per cycle. A high $Q$ means a sharp resonance.'
  topic: Driven RLC circuits
- term: half-power points
  aliases: [half-power point, half-power frequencies]
  definition: 'The two frequencies at which a driven resonant circuit absorbs half its maximum average power; for a series RLC circuit, where $|X_L - X_C| = R$.'
  topic: Driven RLC circuits
- term: bandwidth
  aliases: [resonance width]
  definition: 'The width of a resonance between its half-power points: $\Delta\omega = R/L = \omega_0/Q$ for a series RLC circuit (and $\Delta f = f_0/Q$).'
  topic: Driven RLC circuits
