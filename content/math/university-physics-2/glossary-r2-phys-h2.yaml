# Round 2 glossary for honors module phys-h2 (lessons 90-93)
- term: divergence
  aliases: [div]
  definition: 'Of a vector field: the outward flux per unit volume around a point, $\nabla\cdot\vec E = \partial E_x/\partial x + \partial E_y/\partial y + \partial E_z/\partial z$. Positive at a source, negative at a sink.'
  topic: Maxwell's equations
- term: divergence theorem
  aliases: [Gauss's theorem]
  definition: 'For any closed surface, the outward flux of a field equals the integral of its divergence over the enclosed volume: $\oint\vec E\cdot d\vec A = \int(\nabla\cdot\vec E)\,dV$.'
  topic: Maxwell's equations
- term: curl
  definition: 'Of a vector field: a vector whose components give the circulation per unit area around small loops perpendicular to each axis; it measures how much the field swirls around a point.'
  topic: Maxwell's equations
- term: Stokes's theorem
  aliases: [Stokes' theorem, Stokes theorem]
  definition: 'The circulation of a field around a closed loop equals the flux of its curl through any surface bounded by the loop: $\oint\vec E\cdot d\vec\ell = \int(\nabla\times\vec E)\cdot d\vec A$.'
  topic: Maxwell's equations
- term: continuity equation
  definition: 'Local charge conservation: $\nabla\cdot\vec J + \partial\rho/\partial t = 0$. Charge in a small volume decreases only by flowing out through its surface.'
  topic: Maxwell's equations
- term: wave equation
  definition: 'The equation $\nabla^2f = \dfrac{1}{v^2}\dfrac{\partial^2f}{\partial t^2}$, whose solutions are waves traveling at speed $v$. Maxwell''s equations in vacuum give it for $\vec E$ and $\vec B$ with $v = 1/\sqrt{\mu_0\varepsilon_0} = c$.'
  topic: Maxwell's equations
- term: plane wave
  aliases: [plane waves]
  definition: 'A wave whose fields depend only on time and on distance along one direction, so the wavefronts are flat planes. An electromagnetic plane wave in vacuum is transverse, with $E = cB$.'
  topic: Maxwell's equations
- term: invariance of charge
  aliases: [charge invariance]
  definition: 'The fact that every inertial observer measures the same electric charge on a particle or object, whatever its speed.'
  topic: Fields and relativity
- term: field transformations
  aliases: [field transformation, Lorentz transformation of fields]
  definition: 'The rules for how $\vec E$ and $\vec B$ change between frames moving at relative velocity $\vec v$: components along $\vec v$ are unchanged; $\vec E''_\perp = \gamma(\vec E + \vec v\times\vec B)_\perp$ and $\vec B''_\perp = \gamma(\vec B - \vec v\times\vec E/c^2)_\perp$.'
  topic: Fields and relativity
- term: field invariants
  aliases: [field invariant]
  definition: 'The combinations $\vec E\cdot\vec B$ and $E^2 - c^2B^2$, which have the same value in every inertial frame.'
  topic: Fields and relativity
- term: radiation field
  aliases: [radiation fields]
  definition: 'The part of an accelerated charge''s field that breaks free and travels outward at $c$: transverse, of size $qa\sin\theta/(4\pi\varepsilon_0c^2r)$, falling off as $1/r$.'
  topic: Radiation from accelerating charges
- term: Larmor formula
  definition: 'The total power radiated by a charge $q$ with acceleration $a$, moving slowly compared with $c$: $P = q^2a^2/(6\pi\varepsilon_0c^3)$.'
  topic: Radiation from accelerating charges
- term: synchrotron radiation
  aliases: [synchrotron light]
  definition: 'Radiation from charges moving in curved paths in magnetic fields, especially fast electrons in storage rings; used as an intense X-ray source.'
  topic: Radiation from accelerating charges
- term: bremsstrahlung
  aliases: [braking radiation]
  definition: 'German for "braking radiation": radiation, usually X-rays with a continuous spread of energies, from charges decelerated as they pass atoms, as in an X-ray tube.'
  topic: Radiation from accelerating charges
- term: Rayleigh scattering
  definition: 'Scattering of light by particles much smaller than the wavelength, such as air molecules; in the simple model its strength goes as $1/\lambda^4$, which is why the sky is blue.'
  topic: Radiation from accelerating charges
- term: stationary states
  aliases: [stationary state]
  definition: 'In Bohr''s model, the allowed orbits in which an electron does not radiate, contrary to classical electromagnetism; light is emitted only in jumps between them.'
  topic: Radiation from accelerating charges
- term: correspondence principle
  definition: 'Bohr''s requirement that quantum predictions agree with classical physics in the limit of large quantum numbers; for hydrogen, the $n \to n - 1$ photon frequency approaches the classical orbital frequency.'
  topic: Radiation from accelerating charges
- term: four-momentum
  aliases: [four-momenta]
  definition: 'The four numbers $P = (E/c, p_x, p_y, p_z)$, which transform between frames like $(ct, x, y, z)$. Its square $P\cdot P = E^2/c^2 - p^2 = m^2c^2$ is the same in every frame.'
  topic: Four-momentum
- term: invariant mass
  definition: 'Of a system of particles: $M$ with $M^2c^4 = (\sum E)^2 - |\sum\vec pc|^2$, the same in every frame. $Mc^2$ is the total energy in the center-of-momentum frame; it is generally not the sum of the particles'' masses.'
  topic: Four-momentum
- term: center-of-momentum frame
  aliases: [center of momentum frame, CM frame]
  definition: 'The frame in which the total momentum of a system is zero; there its total energy equals $Mc^2$, the energy available to make new particles.'
  topic: Four-momentum
- term: positron
  aliases: [positrons, antielectron]
  definition: 'The antiparticle of the electron: the same mass, charge $+e$.'
  topic: Four-momentum
- term: pair production
  definition: 'The creation of a particle and its antiparticle, such as an electron and a positron from a gamma ray near a nucleus (threshold about 1.022 MeV).'
  topic: Four-momentum
- term: threshold energy
  aliases: [threshold kinetic energy, threshold]
  definition: 'The minimum beam energy that can produce a given reaction; for a beam of mass $m_b$ on a target $m_t$ at rest making products of total mass $M$, $K_{\text{th}} = [M^2 - (m_b + m_t)^2]c^2/(2m_t)$.'
  topic: Four-momentum
