# Round 2 glossary entries for phys-m11 (Light and optics) and its honors lessons.
- term: center of curvature
  aliases: [centre of curvature]
  definition: 'The center of the sphere of which a curved mirror or lens surface is part, a distance $R$ (the radius of curvature) from the surface; for a spherical mirror the focal point lies halfway to it, $f = R/2$.'
  topic: Mirrors
- term: interferometer
  aliases: [interferometers, Michelson interferometer]
  definition: 'An instrument that splits light into two beams, sends them along different paths and recombines them, reading tiny path differences (fractions of a wavelength) from the interference fringes.'
  topic: Interferometry
- term: beam splitter
  aliases: [beam splitters]
  definition: 'A partly reflecting plate that reflects about half of a light beam and transmits the rest, dividing it into two beams (and later recombining them in an interferometer).'
  topic: Interferometry
- term: fringe
  aliases: [fringes]
  definition: 'One bright or dark band of an interference pattern. In a Michelson interferometer one fringe passes for each wavelength of change in the path difference.'
  topic: Interferometry
- term: optical path length
  aliases: [optical path]
  definition: 'The geometric length a ray travels times the index of refraction, $nL$; it counts how many wavelengths fit along the path and is what decides interference.'
  topic: Interferometry
- term: coherence length
  definition: 'The largest path difference over which light from a source still forms visible fringes, roughly $\lambda^2/\Delta\lambda$: about 1 μm for white light, meters for a good laser.'
  topic: Interferometry
- term: angular dispersion
  definition: 'How fast the angle of a grating maximum changes with wavelength, $d\theta/d\lambda = m/(d\cos\theta)$; it says how far apart two colors land.'
  topic: Grating spectroscopy
- term: resolving power
  aliases: [chromatic resolving power]
  definition: 'For a grating, $R = \lambda/\Delta\lambda = Nm$: the ratio of a wavelength to the smallest wavelength difference that can be separated, set by the number of lines illuminated times the order.'
  topic: Grating spectroscopy
- term: glancing angle
  aliases: [Bragg angle]
  definition: 'In X-ray diffraction, the angle $\theta$ between the incoming beam and the crystal planes (not the normal); the beam is deflected by $2\theta$.'
  topic: X-ray diffraction
- term: Bragg's law
  aliases: [Bragg law, Bragg condition]
  definition: 'The condition $2d\sin\theta = m\lambda$ for strong X-ray reflection from crystal planes a distance $d$ apart, with $\theta$ the glancing angle.'
  topic: X-ray diffraction
- term: X-ray crystallography
  aliases: [X-ray diffraction]
  definition: 'Finding how the atoms in a crystal are arranged from the angles and strengths of its X-ray diffraction peaks, using Bragg''s law.'
  topic: X-ray diffraction
- term: aberration
  aliases: [aberrations]
  definition: 'Any way a real lens or mirror fails to bring all rays from one object point to a single image point, mainly because the small-angle approximation breaks down (spherical aberration) or the index depends on wavelength (chromatic aberration).'
  topic: Aberrations
- term: system matrix
  aliases: [ray matrix, ray-transfer matrix, ray transfer matrix, ABCD matrix]
  definition: 'The 2 × 2 matrix $\begin{pmatrix} A & B \\ C & D \end{pmatrix}$ that takes a paraxial ray''s height and angle at the input of an optical system to their values at the output; it is the product of the matrices of the elements, the first one on the right.'
  topic: Ray-transfer matrices
- term: back focal distance
  aliases: [BFD, back focal length]
  definition: 'The distance from the last surface of an optical system to the point where incoming parallel rays focus, $-A/C$ from the system matrix.'
  topic: Ray-transfer matrices
- term: effective focal length
  aliases: [equivalent focal length]
  definition: 'The focal length of the single thin lens that would make images of distant objects the same size as an optical system does; $f = -1/C$ for a system in air.'
  topic: Ray-transfer matrices
- term: telephoto lens
  aliases: [telephoto]
  definition: 'A lens system, typically a converging group followed by a diverging one, whose effective focal length is longer than the distance from its front to its focus: a long focal length in a short barrel.'
  topic: Ray-transfer matrices
- term: spherical aberration
  definition: 'The blur caused by spherical surfaces focusing rays far from the axis closer than rays near it; reduced by smaller apertures, aspheric surfaces or, for mirrors, a paraboloidal shape.'
  topic: Aberrations
- term: chromatic aberration
  definition: 'The color blur caused by dispersion: a lens has a shorter focal length for violet light than for red. Mirrors don''t have it.'
  topic: Aberrations
- term: Abbe number
  aliases: [V-number, Abbe value]
  definition: 'A glass''s measure of dispersion, $V = (n_d - 1)/(n_F - n_C)$ using indices at 587.6 nm, 486.1 nm and 656.3 nm; a large $V$ means low dispersion.'
  topic: Aberrations
- term: achromatic doublet
  aliases: [achromat, achromats, achromatic lens]
  definition: 'A converging crown-glass lens cemented to a weaker diverging flint-glass lens so that their color errors cancel, $P_1/V_1 + P_2/V_2 = 0$, while their powers add.'
  topic: Aberrations
