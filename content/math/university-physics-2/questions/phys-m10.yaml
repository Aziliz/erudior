- id: phys-q-3701
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'A proton moves at $2.0\times10^6$ m/s perpendicular to a 0.50 T magnetic field. What force acts on it? ($e = 1.6\times10^{-19}$ C)'
  choices: ['$1.7\times10^{-21}$ N', '0 N', '$6.4\times10^{-13}$ N', '$1.6\times10^{-13}$ N']
  answer: 3
  explanation: |-
    $F = qvB\sin 90^\circ = (1.6\times10^{-19})(2.0\times10^6)(0.50) = 1.6\times10^{-13}$ N. Dividing by $B$ instead of multiplying gives $6.4\times10^{-13}$ N; using the proton's mass in place of its charge gives $1.7\times10^{-21}$ N; 0 N would be right only for motion along the field.
- id: phys-q-3702
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A charged particle moves parallel to a uniform magnetic field. The magnetic force on it is'
  choices: ['maximum', 'directed along the field', 'zero', 'directed opposite to its velocity']
  answer: 2
  explanation: |-
    $F = qvB\sin\theta$ with $\theta = 0$ gives zero. Only the velocity component perpendicular to $\vec B$ feels a force.
- id: phys-q-3703
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'Why does a magnetic field never change the speed of a charged particle?'
  choices: ['The force is too weak', 'The force is always perpendicular to the velocity, so it does no work', 'Magnetic fields only act on stationary charges', 'The force is parallel to the velocity']
  answer: 1
  explanation: |-
    $\vec F = q\vec v\times\vec B$ is perpendicular to $\vec v$, so $W = \int\vec F\cdot d\vec r = 0$. Kinetic energy and speed are constant; only the direction changes.
- id: phys-q-3704
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'An electron moves at $1.0\times10^7$ m/s perpendicular to a 0.010 T field. What is the radius of its circular path? ($m_e = 9.11\times10^{-31}$ kg, $e = 1.6\times10^{-19}$ C)'
  choices: ['5.7 mm', '5.7 m', '0.57 mm', '57 cm']
  answer: 0
  explanation: |-
    $r = \dfrac{mv}{eB} = \dfrac{(9.11\times10^{-31})(1.0\times10^7)}{(1.6\times10^{-19})(0.010)} = 5.7\times10^{-3}$ m $= 5.7$ mm. The other choices have the right digits but a slipped power of ten.
- id: phys-q-3705
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A wire carries current east in a magnetic field pointing up. With $x$ east, $y$ north and $z$ up, the force on the wire points'
  choices: ['north', 'down', 'up', 'south']
  answer: 3
  explanation: |-
    $\vec F = I\vec L\times\vec B \propto \hat\imath\times\hat k = -\hat\jmath$: south. Check with the right hand: fingers east, curl toward up, thumb points south.
- id: phys-q-3706
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A 0.40 m wire carrying 5.0 A lies perpendicular to a 0.20 T field. What force acts on it?'
  choices: ['10 N', '0.40 N', '0.10 N', '0.016 N']
  answer: 1
  explanation: |-
    $F = ILB = 5.0(0.40)(0.20) = 0.40$ N. Dividing by $B$ instead of multiplying gives 10 N.
- id: phys-q-3707
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'The period of a charged particle circling in a uniform magnetic field'
  choices: ['increases with its speed', 'decreases with its speed', 'is independent of its speed', 'is proportional to its charge']
  answer: 2
  explanation: |-
    $r = mv/(qB)$ grows with $v$, so the circumference grows as fast as the speed: $T = 2\pi m/(qB)$ has no $v$. This makes the cyclotron possible.
- id: phys-q-3708
  lesson: phys-mag-force
  module_quiz: true
  topic: Magnetic force
  stem: 'In a velocity selector with crossed fields $E = 2.0\times10^4$ V/m and $B = 0.10$ T, which particles pass straight through?'
  choices: ['Only positive ones', 'Only those with $v = 2.0\times10^3$ m/s', 'All particles regardless of speed', 'Those with $v = 2.0\times10^5$ m/s, of either sign']
  answer: 3
  explanation: |-
    Undeflected when $qE = qvB$: $v = E/B = 2.0\times10^5$ m/s. The charge cancels, so the sign and size of $q$ don't matter.
- id: phys-q-3709
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'A current loop in a uniform magnetic field experiences'
  choices: ['a net force but no torque', 'a torque that tends to align its normal with the field, and zero net force', 'neither force nor torque', 'a force along the field']
  answer: 1
  explanation: |-
    Forces on opposite sides cancel in a uniform field, but they form a couple: $\tau = NIAB\sin\phi$. That torque drives electric motors.
- id: phys-q-3710
  lesson: phys-mag-force
  topic: Magnetic force
  stem: 'In a mass spectrometer, singly charged ions with the same speed enter a magnetic field. A heavier isotope'
  choices: ['travels in a larger circle', 'travels in a smaller circle', 'travels in a straight line', 'travels in the same circle']
  answer: 0
  explanation: |-
    $r = mv/(qB)$: at the same speed and charge, radius is proportional to mass, so heavier ions curve less and land farther away.
- id: phys-q-3801
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'A long straight wire carries 10 A. What is the magnetic field 2.0 cm away? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$1.0\times10^{-4}$ T', '$3.1\times10^{-4}$ T', '$1.0\times10^{-6}$ T', '$5.0\times10^{-3}$ T']
  answer: 0
  explanation: |-
    $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{(4\pi\times10^{-7})(10)}{2\pi(0.020)} = 1.0\times10^{-4}$ T. Using the loop-center formula $\mu_0I/(2r)$ by mistake gives $3.1\times10^{-4}$ T.
- id: phys-q-3802
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Doubling the distance from a long straight current-carrying wire changes its field by a factor of'
  choices: ['1/4', '2', '1/2', '1']
  answer: 2
  explanation: |-
    $B \propto 1/r$ for a straight wire, so doubling $r$ halves $B$. (The $1/r^2$ law is for point sources.)
- id: phys-q-3803
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'A solenoid has 1000 turns per meter and carries 2.0 A. What is the field inside? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$2.5\times10^{-6}$ T', '$4.0\times10^{-4}$ T', '$1.3\times10^{-3}$ T', '$2.5\times10^{-3}$ T']
  answer: 3
  explanation: |-
    $B = \mu_0nI = (4\pi\times10^{-7})(1000)(2.0) = 2.5\times10^{-3}$ T, uniform across the interior. Using the straight-wire constant $\mu_0/(2\pi) = 2\times10^{-7}$ in place of $\mu_0$ gives $4.0\times10^{-4}$ T.
- id: phys-q-3804
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'Two long parallel wires carry currents in the same direction. They'
  choices: ['repel', 'twist toward perpendicular', 'exert no force on each other', 'attract']
  answer: 3
  explanation: |-
    Each wire sits in the other's circular field; the right-hand rules give a force toward the other wire. Like currents attract and opposite currents repel, the reverse of electric charges.
- id: phys-q-3805
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Two parallel wires 10 cm apart each carry 5.0 A. What is the force per meter between them?'
  choices: ['$5.0\times10^{-5}$ N/m', '$2.5\times10^{-4}$ N/m', '$5.0\times10^{-6}$ N/m', '$1.6\times10^{-4}$ N/m']
  answer: 0
  explanation: |-
    $\dfrac FL = \dfrac{\mu_0I_1I_2}{2\pi d} = \dfrac{(2\times10^{-7})(5.0)(5.0)}{0.10} = 5.0\times10^{-5}$ N/m.
- id: phys-q-3806
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Current flows counterclockwise in a horizontal loop as seen from above. At the loop''s center the field points'
  choices: ['up', 'down', 'counterclockwise', 'toward the loop wire']
  answer: 0
  explanation: |-
    Curl right-hand fingers counterclockwise (seen from above): the thumb points up. The loop's upper face acts as a north pole.
- id: phys-q-3807
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'What is the field at the center of a single circular loop of radius 10 cm carrying 5.0 A? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$1.0\times10^{-5}$ T', '$6.3\times10^{-5}$ T', '$3.1\times10^{-6}$ T', '$3.1\times10^{-5}$ T']
  answer: 3
  explanation: |-
    $B = \dfrac{\mu_0I}{2R} = \dfrac{(4\pi\times10^{-7})(5.0)}{0.20} = 3.1\times10^{-5}$ T. $1.0\times10^{-5}$ is the straight-wire formula at 10 cm.
- id: phys-q-3808
  lesson: phys-mag-sources
  module_quiz: true
  topic: Sources of magnetic field
  stem: 'Ampère''s law, $\oint\vec B\cdot d\vec\ell = \mu_0I_{\text{enc}}$, applied to a circle of radius $r$ around a long straight wire gives'
  choices: ['$B = \mu_0I/(4\pi r^2)$', '$B = \mu_0nI$', '$B = \mu_0I/(2\pi r)$', '$B = \mu_0I/(2r)$']
  answer: 2
  explanation: |-
    By symmetry $B$ is constant around the circle and tangent to it: $B(2\pi r) = \mu_0I$.
- id: phys-q-3809
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Inserting an iron core into a current-carrying solenoid greatly increases the field because'
  choices: ['iron conducts current better', 'the magnetic domains in the iron align with the field and add their own', 'iron increases the number of turns', 'iron stores charge']
  answer: 1
  explanation: |-
    Iron is ferromagnetic: its domains line up with the applied field, contributing a much larger field of their own. That's the principle of the electromagnet.
- id: phys-q-3810
  lesson: phys-mag-sources
  topic: Sources of magnetic field
  stem: 'Inside a long straight wire of radius $R$ carrying a uniform current $I$, the field at distance $r < R$ from the axis is'
  choices: ['zero', '$\mu_0I/(2\pi r)$', '$\mu_0I/(2\pi R)$', '$\dfrac{\mu_0Ir}{2\pi R^2}$']
  answer: 3
  explanation: |-
    An Ampère loop of radius $r$ encloses $I(r/R)^2$, so $B(2\pi r) = \mu_0Ir^2/R^2$ and $B = \mu_0Ir/(2\pi R^2)$, rising linearly from zero at the center.
- id: phys-q-4801
  lesson: phys-hall-matter
  module_quiz: true
  topic: Hall effect
  stem: 'A copper strip 1.5 cm wide and 0.50 mm thick carries 10 A in a 2.0 T field perpendicular to its face. Copper has $8.5\times10^{28}$ free electrons per m³. What is the Hall voltage? ($e = 1.602\times10^{-19}$ C)'
  choices: ['$9.8\times10^{-8}$ V', '$7.3\times10^{-7}$ V', '$2.9\times10^{-6}$ V', '$2.9\times10^{-9}$ V']
  answer: 2
  explanation: |-
    $V_H = \dfrac{IB}{nqt} = \dfrac{(10)(2.0)}{(8.5\times10^{28})(1.602\times10^{-19})(5.0\times10^{-4})} = 2.9\times10^{-6}$ V. Using the width (1.5 cm) where the thickness along $\vec B$ belongs gives $9.8\times10^{-8}$ V; dividing by $B$ instead of multiplying gives $7.3\times10^{-7}$ V; leaving the thickness in millimeters gives $2.9\times10^{-9}$ V.
- id: phys-q-4802
  lesson: phys-hall-matter
  topic: Hall effect
  stem: 'Which property of a conductor can the sign of its Hall voltage reveal?'
  choices: ['The sign of its charge carriers', 'Its resistivity', 'Its total charge', 'Whether it is ferromagnetic']
  answer: 0
  explanation: |-
    For a given current direction, positive and negative carriers are pushed to the same edge, so that edge charges with the carriers' sign. The Hall voltage depends on $n$ and $q$, not on resistivity or magnetic ordering, and a current-carrying wire is neutral overall.
- id: phys-q-4803
  lesson: phys-hall-matter
  topic: Hall effect
  stem: 'A strip carries a current to the right in a magnetic field. If its carriers were positive instead of negative, with the same current, density and field, the Hall voltage would'
  choices: ['vanish, because the forces would cancel', 'double', 'keep its sign, because both kinds of carrier go to the same edge', 'have the same size but the opposite sign']
  answer: 3
  explanation: |-
    Both kinds of carrier are pushed to the same edge (opposite charge times opposite velocity gives the same force direction), but that edge then holds positive rather than negative charge, so $V_H$ flips sign. Its size $IB/(n|q|t)$ is unchanged. Concluding the sign stays the same forgets that the edge charge itself changes sign.
- id: phys-q-4804
  lesson: phys-hall-matter
  module_quiz: true
  topic: Hall effect
  stem: 'Why are Hall probes for measuring magnetic fields made from semiconductors rather than metals?'
  choices: ['Semiconductors have larger drift speeds because they have more carriers', 'Semiconductors have far fewer carriers, so $V_H = IB/(nqt)$ is much larger', 'Metals have no Hall effect', 'Semiconductors are ferromagnetic and concentrate the field']
  answer: 1
  explanation: |-
    $V_H$ is inversely proportional to the carrier density $n$. A semiconductor has millions of times fewer carriers than a metal, so for the same current the carriers drift faster and the Hall voltage is far easier to measure. Metals do show a Hall effect, just a tiny one, and semiconductor probes are not ferromagnetic.
- id: phys-q-4805
  lesson: phys-hall-matter
  topic: Hall effect
  stem: 'Carriers drift at $2.0\times10^{-4}$ m/s along a strip 2.0 cm wide in a 0.80 T field perpendicular to it. What is the Hall voltage across the strip?'
  choices: ['$3.2\times10^{-6}$ V', '$3.2\times10^{-4}$ V', '$5.0\times10^{-6}$ V', '$1.6\times10^{-4}$ V']
  answer: 0
  explanation: |-
    In equilibrium $E_H = v_dB = 1.6\times10^{-4}$ V/m, and $V_H = E_Hw = (1.6\times10^{-4})(0.020) = 3.2\times10^{-6}$ V. Stopping at the Hall field gives $1.6\times10^{-4}$; leaving the width in centimeters gives $3.2\times10^{-4}$ V; dividing by $B$ instead of multiplying gives $5.0\times10^{-6}$ V.
- id: phys-q-4806
  lesson: phys-hall-matter
  module_quiz: true
  topic: Magnetic materials
  stem: 'A solenoid with 1000 turns per meter carries 0.20 A and is filled with iron of relative permeability $K_m = 2000$. What is the field inside? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  choices: ['$2.5\times10^{-4}$ T', '0.080 T', '$1.3\times10^{-7}$ T', '0.50 T']
  answer: 3
  explanation: |-
    $B = K_m\mu_0nI = 2000(4\pi\times10^{-7})(1000)(0.20) = 0.50$ T. $2.5\times10^{-4}$ T ignores the iron; 0.080 T uses the straight-wire constant $\mu_0/(2\pi)$ in place of $\mu_0$; $1.3\times10^{-7}$ T divides by $K_m$ instead of multiplying.
- id: phys-q-4807
  lesson: phys-hall-matter
  topic: Magnetic materials
  stem: 'Which statement about diamagnetism is correct?'
  choices: ['It occurs only in materials with no electrons', 'It is the strong attraction of iron to a magnet', 'It is present in all materials and gives a small negative susceptibility', 'It makes a material keep its magnetization after the field is removed']
  answer: 2
  explanation: |-
    An applied field alters every atom's electron motion so the induced moments oppose it (Lenz's law at the atomic scale), giving $\chi_m \approx -10^{-5}$. Strong attraction and retained magnetization are ferromagnetic behavior, and every material has electrons.
- id: phys-q-4808
  lesson: phys-hall-matter
  module_quiz: true
  topic: Magnetic materials
  stem: 'A paramagnetic salt obeys Curie''s law. Its absolute temperature is doubled. Its susceptibility'
  choices: ['doubles', 'is halved', 'is unchanged', 'changes sign']
  answer: 1
  explanation: |-
    Curie's law says $\chi_m \propto 1/T$: more thermal agitation means less alignment, so doubling $T$ halves $\chi_m$. Doubling would mean heat helps alignment. A paramagnet's susceptibility stays positive; a negative value would make it diamagnetic.
- id: phys-q-4809
  lesson: phys-hall-matter
  topic: Magnetic materials
  stem: 'What happens to a piece of iron heated above its Curie temperature (770°C)?'
  choices: ['It loses its domains and becomes paramagnetic', 'It becomes diamagnetic', 'It becomes a superconductor', 'Its relative permeability rises sharply']
  answer: 0
  explanation: |-
    Above the Curie temperature thermal motion overwhelms the interaction that aligns neighboring moments, so the domains disappear. The atoms still have moments, so the iron is weakly paramagnetic, not diamagnetic. Its permeability falls, not rises, and superconductivity needs very low temperatures.
- id: phys-q-4810
  lesson: phys-hall-matter
  topic: Magnetic materials
  stem: 'Transformer cores are made of "soft" ferromagnetic material with a narrow hysteresis loop because'
  choices: ['a narrow loop gives the strongest permanent magnet', 'soft materials are diamagnetic', 'soft materials do not saturate', 'the loop area is energy lost as heat every cycle, so a narrow loop wastes little']
  answer: 3
  explanation: |-
    The core is cycled around its loop 60 times a second, and the area enclosed measures the energy turned into heat each cycle. A wide loop makes a good permanent magnet, the opposite of what a transformer needs. Soft iron is ferromagnetic, and it does saturate.
- id: phys-q-4811
  lesson: phys-hall-matter
  topic: Magnetic materials
  stem: 'A material has relative permeability $K_m = 0.99983$. It is'
  choices: ['ferromagnetic', 'diamagnetic', 'paramagnetic', 'a superconductor']
  answer: 1
  explanation: |-
    $\chi_m = K_m - 1 = -1.7\times10^{-4}$: small and negative, so diamagnetic (this is bismuth). A paramagnet would have $K_m$ slightly above 1, a ferromagnet hundreds or more, and a superconductor $K_m = 0$.
- id: phys-q-4812
  lesson: phys-hall-matter
  topic: Hall effect
  stem: 'A semiconductor strip 0.10 mm thick carries 4.0 mA in a 0.50 T field and shows a Hall voltage of 5.0 mV. How many carriers per cubic meter does it have (charge $e$ each)?'
  choices: ['$2.5\times10^{19}$', '$1.0\times10^{23}$', '$2.5\times10^{22}$', '$2.5\times10^{25}$']
  answer: 2
  explanation: |-
    $n = \dfrac{IB}{eV_Ht} = \dfrac{(4.0\times10^{-3})(0.50)}{(1.602\times10^{-19})(5.0\times10^{-3})(1.0\times10^{-4})} = 2.5\times10^{22}$ m⁻³. Forgetting to convert either millivolts or millimeters gives $2.5\times10^{19}$; forgetting the milliamperes gives $2.5\times10^{25}$; dividing by $B$ instead of multiplying gives $1.0\times10^{23}$.
- id: phys-q-3901
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A 100-turn coil of area 0.020 m² is perpendicular to a field that rises from 0.20 T to 0.60 T in 0.10 s. What emf is induced?'
  choices: ['0.80 V', '8.0 V', '0.080 V', '12 V']
  answer: 1
  explanation: |-
    $|\mathcal{E}| = N\dfrac{\Delta\Phi}{\Delta t} = 100\dfrac{(0.40)(0.020)}{0.10} = 8.0$ V. Leaving out $N$ gives 0.080 V; using the final field 0.60 T instead of the change gives 12 V.
- id: phys-q-3902
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A strong magnet rests motionless inside a coil connected to a meter. The meter reads'
  choices: ['a large current', 'a small steady current', 'zero', 'an alternating current']
  answer: 2
  explanation: |-
    Only a changing flux induces an emf. A stationary magnet gives constant flux, so there's no induced current.
- id: phys-q-3903
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'The north pole of a magnet is pushed toward a loop. By Lenz''s law, the induced current makes the loop''s near face act like'
  choices: ['a south pole, attracting the magnet', 'nothing; there is no current', 'a north pole only if the loop is copper', 'a north pole, repelling the magnet']
  answer: 3
  explanation: |-
    The flux from the approaching north pole is increasing, so the induced current opposes it, making a north face that repels the magnet. You must do work to push it in, which becomes electrical energy.
- id: phys-q-3904
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A 0.50 m rod slides at 10 m/s along rails in a 2.0 T field perpendicular to the rails. What emf is induced?'
  choices: ['10 V', '1.0 V', '2.5 V', '40 V']
  answer: 0
  explanation: |-
    Motional emf $\mathcal{E} = BLv = 2.0(0.50)(10) = 10$ V. Dividing by $B$ instead of multiplying gives 2.5 V.
- id: phys-q-3905
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Lenz''s law is ultimately a consequence of conservation of'
  choices: ['charge', 'energy', 'momentum', 'magnetic poles']
  answer: 1
  explanation: |-
    If induced currents aided the change, a small push would produce runaway motion and energy from nothing. Opposing the change means work must be done to generate electrical energy.
- id: phys-q-3906
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A transformer has 50 primary turns and 500 secondary turns. With 120 V AC on the primary, the secondary voltage is'
  choices: ['12 V', '120 V', '1200 V', '0 V']
  answer: 2
  explanation: |-
    $V_s = V_p(N_s/N_p) = 120(10) = 1200$ V (12 V uses the turns ratio upside down). The current is stepped down by the same factor (ideal transformer).
- id: phys-q-3907
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Why won''t a transformer work with a steady DC current in the primary?'
  choices: ['DC is too weak', 'Iron cores block DC', 'DC produces no magnetic field', 'A steady current makes a constant flux, so no emf is induced in the secondary']
  answer: 3
  explanation: |-
    Faraday's law needs a changing flux. Steady DC produces a steady field, so the secondary sees no $d\Phi/dt$.
- id: phys-q-3908
  lesson: phys-induction
  module_quiz: true
  topic: Electromagnetic induction
  stem: 'A generator coil rotates at angular speed $\omega$ in a uniform field. If $\omega$ is doubled, the peak emf'
  choices: ['doubles', 'halves', 'quadruples', 'is unchanged']
  answer: 0
  explanation: |-
    $\mathcal{E}_{\max} = NBA\omega$: proportional to $\omega$ (and the frequency of the AC doubles too).
- id: phys-q-3909
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'A loop of area 0.050 m² lies perpendicular to a field $B(t) = 2t^2$ T. What is the magnitude of the induced emf at $t = 3$ s?'
  choices: ['1.8 V', '0.90 V', '0.60 V', '0.30 V']
  answer: 2
  explanation: |-
    $\Phi = 0.050(2t^2) = 0.10t^2$; $|\mathcal{E}| = d\Phi/dt = 0.20t = 0.60$ V at $t = 3$ s. 0.90 V is the flux itself.
- id: phys-q-3910
  lesson: phys-induction
  topic: Electromagnetic induction
  stem: 'Magnetic brakes on a roller coaster use fins passing between strong magnets. The braking force comes from'
  choices: ['friction between fin and magnet', 'eddy currents in the fins, whose fields oppose the motion', 'static electricity', 'air resistance around the magnets']
  answer: 1
  explanation: |-
    The changing flux through the moving metal induces eddy currents; by Lenz's law their magnetic forces oppose the motion, converting kinetic energy to heat without contact.
- id: phys-q-4001
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'What is the time constant of a circuit with a 0.50 H inductor in series with a 10 Ω resistor?'
  choices: ['5.0 s', '20 s', '0.50 s', '0.050 s']
  answer: 3
  explanation: |-
    $\tau = L/R = 0.50/10 = 0.050$ s. $LR = 5.0$ is not a time constant; that would be confusing it with $RC$-style multiplication.
- id: phys-q-4002
  lesson: phys-inductance
  topic: Inductance
  stem: 'How much energy is stored in a 2.0 H inductor carrying 0.30 A?'
  choices: ['0.18 J', '0.090 J', '0.60 J', '0.30 J']
  answer: 1
  explanation: |-
    $U = \tfrac12LI^2 = \tfrac12(2.0)(0.090) = 0.090$ J. Leaving out the $\tfrac12$ gives 0.18 J; forgetting to square the current gives 0.30 J (or 0.60 J without the $\tfrac12$ as well).
- id: phys-q-4003
  lesson: phys-inductance
  topic: Inductance
  stem: 'Immediately after the switch is closed in a series circuit of a battery, a resistor and an inductor, the current is'
  choices: ['$\mathcal{E}/R$', 'zero', 'infinite', '$\mathcal{E}/(2R)$']
  answer: 1
  explanation: |-
    An inductor prevents sudden changes in current, so the current starts at zero and rises toward $\mathcal{E}/R$ with time constant $L/R$.
- id: phys-q-4004
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'An LC circuit has $L = 10$ mH and $C = 1.0$ μF. What is its oscillation frequency?'
  choices: ['10 kHz', '159 Hz', '1.6 kHz', '1.0 kHz']
  answer: 2
  explanation: |-
    $f = \dfrac{1}{2\pi\sqrt{LC}} = \dfrac{1}{2\pi\sqrt{(0.010)(1.0\times10^{-6})}} = \dfrac{1}{2\pi(10^{-4})} = 1.59$ kHz. $1/\sqrt{LC} = 10^4$ is $\omega$ in rad/s.
- id: phys-q-4005
  lesson: phys-inductance
  module_quiz: true
  topic: AC circuits
  stem: 'Household AC is rated 120 V (rms). What is the peak voltage?'
  choices: ['85 V', '120 V', '240 V', '170 V']
  answer: 3
  explanation: |-
    $V_0 = \sqrt2V_{\text{rms}} = 1.414(120) = 170$ V. Dividing instead of multiplying gives 85 V.
- id: phys-q-4006
  lesson: phys-inductance
  topic: AC circuits
  stem: 'As the frequency of an AC source increases, the reactance of a capacitor'
  choices: ['decreases', 'increases', 'stays the same', 'becomes negative']
  answer: 0
  explanation: |-
    $X_C = 1/(\omega C)$ falls as $\omega$ rises: capacitors pass high frequencies and block low ones (and block DC entirely). Inductors do the reverse, $X_L = \omega L$.
- id: phys-q-4007
  lesson: phys-inductance
  topic: AC circuits
  stem: 'In a series RLC circuit driven at its resonant frequency,'
  choices: ['$X_L = X_C$ and the impedance equals $R$', 'the current is zero', '$X_L = 0$', 'the impedance is maximum']
  answer: 0
  explanation: |-
    At $\omega_0 = 1/\sqrt{LC}$, $X_L = X_C$, so $Z = \sqrt{R^2 + 0} = R$, its minimum, and the current is largest.
- id: phys-q-4008
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'An inductor in a circuit opposes'
  choices: ['any current through it', 'changes in the current through it', 'only alternating voltages', 'the battery''s emf at all times']
  answer: 1
  explanation: |-
    $\mathcal{E}_L = -L\,dI/dt$: with steady current there's no induced emf. It's a kind of electrical inertia.
- id: phys-q-4009
  lesson: phys-inductance
  topic: Inductance
  stem: 'In the mechanical analogy for an LC circuit (mass on a spring), the inductance $L$ corresponds to'
  choices: ['the spring constant', 'the position', 'the mass', 'the friction']
  answer: 2
  explanation: |-
    $L\ddot q + q/C = 0$ matches $m\ddot x + kx = 0$: $L \leftrightarrow m$, $1/C \leftrightarrow k$, charge $\leftrightarrow$ position, current $\leftrightarrow$ velocity.
- id: phys-q-4010
  lesson: phys-inductance
  topic: AC circuits
  stem: 'What is the reactance of a 10 μF capacitor at 60 Hz?'
  choices: ['$3.8\times10^{-3}$ Ω', '1670 Ω', '0.0060 Ω', '265 Ω']
  answer: 3
  explanation: |-
    $X_C = \dfrac{1}{2\pi fC} = \dfrac{1}{2\pi(60)(10\times10^{-6})} = 265$ Ω. Forgetting the $2\pi$ gives 1670 Ω; $3.8\times10^{-3}$ Ω is $2\pi fC$ without taking the reciprocal.
- id: phys-q-4011
  lesson: phys-inductance
  module_quiz: true
  topic: Inductance
  stem: 'Two coils have a mutual inductance of 4.0 mH. The current in the first coil changes at 250 A/s. What emf is induced in the second coil?'
  choices: ['1.0 V', '1000 V', '$1.6\times10^{-5}$ V', '62.5 V']
  answer: 0
  explanation: |-
    $|\mathcal{E}_2| = M\dfrac{dI_1}{dt} = (4.0\times10^{-3})(250) = 1.0$ V. Leaving $M$ in millihenries gives 1000 V; dividing $M$ by the rate gives $1.6\times10^{-5}$ V; dividing the rate by 4.0 gives 62.5 V.
- id: phys-q-4012
  lesson: phys-inductance
  topic: Inductance
  stem: 'A changing current of 10 A/s in coil 1 induces 0.30 V in coil 2. If instead the current in coil 2 changes at 10 A/s, what emf is induced in coil 1?'
  choices: ['It depends on which coil has more turns', 'Zero, since mutual induction works in one direction only', '0.30 V', '0.030 V']
  answer: 2
  explanation: |-
    The mutual inductance is the same in both directions, $M_{12} = M_{21} = M = 0.030$ H, so the same rate of change induces the same 0.30 V. The turns of both coils are already built into $M$, so they don't make the two directions differ, and induction works both ways. 0.030 V is just the value of $M$ in henries, not an emf.
- id: phys-q-4013
  lesson: phys-inductance
  topic: Inductance
  stem: 'The mutual inductance of two coils depends on'
  choices: ['the current in the first coil', 'the coils'' shapes, numbers of turns, separation, orientation and any core between them', 'how fast the current is changing', 'the resistance of the second coil']
  answer: 1
  explanation: |-
    $M$ measures how much of one coil's flux links the other per ampere, which is fixed by geometry and materials. The current and its rate of change determine the induced emf through $\mathcal{E}_2 = -M\,dI_1/dt$, but not $M$ itself, and resistance affects the induced current, not the emf or $M$.
- id: phys-q-4014
  lesson: phys-inductance
  module_quiz: true
  topic: AC circuits
  stem: 'A series RLC circuit has $R = 40$ Ω, $X_L = 50$ Ω and $X_C = 20$ Ω. What are the phase angle and the power factor?'
  choices: ['$53.1^\circ$ and 0.60', '$36.9^\circ$ and 0.60', '$51.3^\circ$ and 0.62', '$36.9^\circ$ and 0.80']
  answer: 3
  explanation: |-
    $\tan\phi = \dfrac{X_L - X_C}{R} = \dfrac{30}{40}$, so $\phi = 36.9^\circ$; $Z = \sqrt{40^2 + 30^2} = 50$ Ω and the power factor is $\cos\phi = R/Z = 0.80$. Inverting the tangent ratio gives $53.1^\circ$ and 0.60; taking $\sin\phi$ as the power factor gives 0.60; ignoring the capacitor ($\tan\phi = 50/40$) gives $51.3^\circ$ and 0.62.
- id: phys-q-4015
  lesson: phys-inductance
  topic: AC circuits
  stem: 'A 120 V (rms) source drives a series RLC circuit with $R = 40$ Ω and impedance $Z = 50$ Ω. What average power does the circuit draw?'
  choices: ['230 W', '288 W', '360 W', '184 W']
  answer: 0
  explanation: |-
    $I_{\text{rms}} = 120/50 = 2.4$ A, and $P = I_{\text{rms}}V_{\text{rms}}\cos\phi = (2.4)(120)(40/50) = 230$ W, the same as $I_{\text{rms}}^2R$. Leaving out the power factor gives 288 W; using $V^2/R$ as if the reactances were absent gives 360 W; applying the power factor twice gives 184 W.
- id: phys-q-4016
  lesson: phys-inductance
  topic: AC circuits
  stem: 'A series RLC circuit is driven at its resonant frequency. Its power factor is'
  choices: ['0', '0.707', '1', 'equal to $X_L/R$']
  answer: 2
  explanation: |-
    At resonance $X_L = X_C$, so $\tan\phi = 0$, $\phi = 0$ and $\cos\phi = 1$: the source sees a pure resistance and delivers the most power. A power factor of 0 describes a circuit with only an inductor or capacitor; 0.707 corresponds to $\phi = 45^\circ$; $X_L/R$ is not a power factor at all and can exceed 1.
- id: phys-q-4017
  lesson: phys-inductance
  topic: AC circuits
  stem: 'In a series RLC circuit with $X_L > X_C$, how is the current related to the source voltage?'
  choices: ['It leads the voltage by $90^\circ$', 'It lags the voltage by an angle between $0^\circ$ and $90^\circ$', 'It is exactly in phase with the voltage', 'It leads the voltage by an angle between $0^\circ$ and $90^\circ$']
  answer: 1
  explanation: |-
    $\tan\phi = (X_L - X_C)/R > 0$, so the circuit acts inductively and the current lags the voltage by $\phi$, which is less than $90^\circ$ because the resistor keeps the circuit from being purely reactive. Leading belongs to circuits with $X_C > X_L$; a full $90^\circ$ would need $R = 0$; being in phase happens only at resonance.
