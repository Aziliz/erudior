# Round 2, module phys-m8 (Electrostatics): new question types for the core lessons
# (phys-m8-r2-q..) and questions for the three honors lessons (phys-m8-r2-h..).

# ---------- Lesson 01: Coulomb's law ----------
- id: phys-m8-r2-q01
  lesson: phys-coulomb
  module_quiz: true
  type: order
  topic: Electric charge
  stem: 'Put the steps for charging a neutral metal sphere positively by induction, using a negatively charged rod, in order.'
  items:
    - Hold the negative rod near the sphere without touching it
    - Connect the sphere to ground with a wire
    - Disconnect the ground wire
    - Take the rod away
  explanation: |-
    The rod polarizes the sphere, and grounding lets electrons pushed away by the rod escape to Earth. The ground must be removed while the rod is still there: if the rod went first, electrons would flow back up the wire and the sphere would end up neutral. Once the ground is gone, removing the rod leaves the sphere with a net positive charge, which spreads over its surface.
- id: phys-m8-r2-q02
  lesson: phys-coulomb
  type: text
  topic: Coulomb's law
  stem: 'Two point charges exert a force of 0.80 N on each other. If the distance between them is halved, the force becomes ___ N. Give only the number.'
  accept: ['3.2']
  explanation: |-
    $F \propto 1/r^2$, so halving $r$ multiplies the force by $2^2 = 4$: $4(0.80) = 3.2$ N. (Doubling to 1.6 N forgets to square.)
- id: phys-m8-r2-q03
  lesson: phys-coulomb
  topic: Electric charge
  stem: 'Which statements about electric charge are true? Select all that apply.'
  choices: ['The total charge of an isolated system never changes', 'Rubbing two objects together creates new charge', 'A charged object can attract a neutral one', 'Every free charge is a whole-number multiple of $e$', 'Two negative charges attract each other']
  answer: [0, 2, 3]
  explanation: |-
    Charge is conserved and quantized ($q = ne$), and a charged object attracts a neutral one by polarizing it. Rubbing only moves electrons from one object to the other; it creates no net charge. Like charges, including two negatives, repel.
- id: phys-m8-r2-q04
  lesson: phys-coulomb
  type: match
  topic: Electric charge
  stem: 'Classify each material as it behaves at room temperature.'
  pairs:
    - [Copper wire, Conductor]
    - [Rubber, Insulator]
    - [Salt water, Conductor]
    - [Dry air, Insulator]
    - [Silicon, Semiconductor]
  explanation: |-
    Metals such as copper, and salt water (with its free ions), let charge move: conductors. Rubber and dry air hold charges in place: insulators. Silicon is the standard semiconductor, in between.
- id: phys-m8-r2-q05
  lesson: phys-coulomb
  type: text
  topic: Coulomb's law
  stem: 'Charges of $+2.0$ μC sit at $x = 0$ and at $x = 0.40$ m. Find the net force on a $+1.0$ μC charge at $x = 0.10$ m, as a signed $x$ component in newtons to 2 significant figures ($k = 8.99\times10^9$ N·m²/C²). $F_x =$ ___ N. Give only the number.'
  accept: ['1.6']
  explanation: |-
    The charge at 0 is 0.10 m away and repels toward $+x$: $(8.99\times10^9)(2.0\times10^{-6})(1.0\times10^{-6})/(0.10)^2 = 1.80$ N. The charge at 0.40 m is 0.30 m away and repels toward $-x$: $1.80/9 = 0.20$ N. Net $F_x = 1.80 - 0.20 = 1.6$ N. Adding the magnitudes gives 2.0 N, the mistake of ignoring directions.

# ---------- Lesson 02: The electric field ----------
- id: phys-m8-r2-q06
  lesson: phys-efield
  type: label
  topic: Electric field
  stem: 'This is the setup for steering an electron beam, as in an old cathode-ray tube. Name the numbered parts.'
  image: {src: images/phys-m8-deflection-blank.svg, alt: 'A box at the left fires a dashed path to the right between two horizontal plates, the top plate marked with plus signs and the bottom one with minus signs. Arrows between the plates point down. The path curves upward between the plates, then runs straight to a tall vertical bar at the right.'}
  labels:
    - {x: 9.3, y: 48.6, text: Electron gun}
    - {x: 31.4, y: 24.4, text: Positive deflection plate}
    - {x: 41.4, y: 33.6, text: Uniform electric field}
    - {x: 75.7, y: 29.2, text: Electron path after the plates}
    - {x: 92.7, y: 69.4, text: Screen}
  distractors: [Negative deflection plate, Equipotential surface]
  explanation: |-
    1 is the electron gun that produces the beam. 2 is the top plate, marked +, the positive deflection plate. 3 is the uniform field between the plates, pointing from the positive plate to the negative one. 4 is the straight path after the electron leaves the plates (no field acts there), and 5 is the screen where the beam lands. The negative plate is the bottom one, which has no marker.
- id: phys-m8-r2-q07
  lesson: phys-efield
  type: text
  topic: Electric field
  stem: 'The electric field 0.30 m from a $+6.0$ nC point charge is about ___ N/C (2 significant figures, $k = 8.99\times10^9$ N·m²/C²). Give only the number.'
  accept: ['600', '6.0e2', '6e2']
  explanation: |-
    $E = kq/r^2 = (8.99\times10^9)(6.0\times10^{-9})/(0.30)^2 = 599$ N/C, or 600 N/C to 2 significant figures, pointing away from the charge. Forgetting to square $r$ gives 180 N/C.
- id: phys-m8-r2-q08
  lesson: phys-efield
  module_quiz: true
  topic: Electric field
  stem: 'A metal object is in electrostatic equilibrium. Which statements are true? Select all that apply.'
  choices: ['The electric field inside the metal is zero', 'Any excess charge sits on the outer surface', 'Just outside, the field is parallel to the surface', 'Charge concentrates where the surface curves most sharply', 'Excess charge spreads evenly through the volume of the metal']
  answer: [0, 1, 3]
  explanation: |-
    If there were a field inside the metal, free charges would still be moving, so $E = 0$ inside, and excess charge ends up on the outer surface, crowding at sharp points. Just outside, the field is perpendicular to the surface; a parallel component would push charge along the surface.
- id: phys-m8-r2-q09
  lesson: phys-efield
  type: match
  topic: Electric field
  stem: 'Match each charge distribution to how its electric field behaves.'
  pairs:
    - [Point charge, Falls as 1 over r squared]
    - [Infinitely long line charge, Falls as 1 over r]
    - [Infinite flat sheet of charge, The same at every distance]
    - [Center of a uniformly charged ring, Zero]
  distractors: [Falls as 1 over r cubed]
  explanation: |-
    Point charge $kq/r^2$; line $2k\lambda/r$; sheet $\sigma/(2\varepsilon_0)$, independent of distance. At a ring's center every element's field is canceled by the element opposite it. The $1/r^3$ falloff belongs to a dipole, which isn't listed.
- id: phys-m8-r2-q10
  lesson: phys-efield
  topic: Electric field
  stem: 'An electron moves horizontally into the space between two horizontal plates; the top plate is positive and the bottom plate negative. While it is between the plates, its path'
  choices: ['bends down, along the field', 'is a straight line, since the field is uniform', 'bends up in a circular arc', 'bends up in a parabola, toward the positive plate']
  answer: 3
  explanation: |-
    The field points down (from $+$ to $-$), and an electron is pushed opposite to the field, so it feels a constant upward force. Constant force across a sideways velocity gives a parabola, as for a thrown ball. Bending down would be correct for a positive charge; a circular arc needs a force that keeps turning, as in a magnetic field.

# ---------- Lesson 03: Gauss's law ----------
- id: phys-m8-r2-q11
  lesson: phys-gauss
  type: label
  topic: Gauss's law
  stem: 'Each dashed surface is the Gaussian surface used for the charge it surrounds. Name each one.'
  image: {src: images/phys-m8-gauss-surfaces-blank.svg, alt: 'Three panels. Left: a solid ball inside a dashed circle with arrows pointing outward all around. Middle: a vertical line of plus charges inside a dashed cylinder, with arrows pointing sideways out of its curved side. Right: a slanted flat sheet of plus charges pierced by a short dashed cylinder, with arrows pointing out of its two ends.'}
  labels:
    - {x: 24.6, y: 25.5, text: Concentric sphere}
    - {x: 42.5, y: 47.7, text: Coaxial cylinder}
    - {x: 77.5, y: 43.1, text: Pillbox}
  distractors: [Cube, Equipotential surface]
  explanation: |-
    A spherical charge uses a concentric sphere ($E\cdot4\pi r^2$), a long line uses a coaxial cylinder (flux only through the curved side, $E\cdot2\pi rL$), and a flat sheet uses a pillbox through the sheet (flux only through the two end caps, $E\cdot2A$). In each case $E$ is constant on the parts of the surface the field crosses.
- id: phys-m8-r2-q12
  lesson: phys-gauss
  type: text
  topic: Gauss's law
  stem: 'A closed surface surrounds a $+5.0$ nC charge and a $-2.0$ nC charge; a $+4.0$ nC charge sits outside it. The net electric flux through the surface is ___ N·m²/C, to 3 significant figures ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²)). Give only the number.'
  accept: ['339']
  explanation: |-
    Only enclosed charge counts: $Q_{\text{enc}} = 5.0 - 2.0 = 3.0$ nC, so $\Phi_E = (3.0\times10^{-9})/(8.85\times10^{-12}) = 339$ N·m²/C. Including the outside charge would give 791.
- id: phys-m8-r2-q13
  lesson: phys-gauss
  type: order
  topic: Gauss's law
  stem: 'Put the steps for finding a field with Gauss''s law in order.'
  items:
    - Identify the symmetry of the charge distribution
    - Choose a Gaussian surface through the point, on which E is constant
    - Set E times the area it crosses equal to the enclosed charge over ε0
    - Solve for E
  explanation: |-
    The symmetry decides the surface (sphere, cylinder or pillbox); the surface must pass through the point where you want $E$ and have $E$ constant and perpendicular wherever field crosses it. Then the flux is $E$ times that area, Gauss's law sets it equal to $Q_{\text{enc}}/\varepsilon_0$, and you solve for $E$.
- id: phys-m8-r2-q14
  lesson: phys-gauss
  module_quiz: true
  topic: Gauss's law
  stem: 'For which charge distributions does Gauss''s law, with a well-chosen surface, give the field directly? Select all that apply.'
  choices: ['A uniformly charged solid sphere', 'A very long, uniformly charged straight wire', 'A uniformly charged cube', 'An electric dipole', 'A very large, flat, uniformly charged sheet']
  answer: [0, 1, 4]
  explanation: |-
    Spherical, cylindrical and planar symmetry let you pick a surface with $E$ constant on it. A cube's field and a dipole's field vary in magnitude and direction over any simple closed surface. Gauss's law is still true for them, but it doesn't hand you $E$.
- id: phys-m8-r2-q15
  lesson: phys-gauss
  type: text
  topic: Gauss's law
  stem: 'Inside a uniformly charged solid ball, the field at half the radius is ___ times the field at the surface. Give the number as a fraction or decimal.'
  accept: ['1/2']
  explanation: |-
    Inside, $E = kQr/R^3$ grows in proportion to $r$, so at $r = R/2$ the field is half the surface value $kQ/R^2$. (Using $kQ/r^2$ inside would wrongly give 4 times.)

# ---------- Lesson 04: Electric potential ----------
- id: phys-m8-r2-q16
  lesson: phys-potential
  type: label
  topic: Electric potential
  stem: 'The picture shows two charged parallel plates. Name the numbered features.'
  image: {src: images/phys-m8-plates-blank.svg, alt: 'Two vertical plates, the left one marked with plus signs and the right one with minus signs. Horizontal arrows run from the left plate to the right plate, and three evenly spaced dashed vertical lines lie between the plates.'}
  labels:
    - {x: 15, y: 49.3, text: Plate at higher potential}
    - {x: 41.7, y: 40.6, text: Field line}
    - {x: 50, y: 66.7, text: Equipotential}
    - {x: 85, y: 49.3, text: Plate at lower potential}
  distractors: [Gaussian surface]
  explanation: |-
    The field points from high potential to low, so the positive left plate is at the higher potential and the right plate at the lower one. The arrows are field lines; the dashed lines, perpendicular to them, are equipotentials. Moving along an equipotential takes no work.
- id: phys-m8-r2-q17
  lesson: phys-potential
  type: text
  topic: Electric potential
  stem: 'A proton starts from rest and is accelerated through a potential difference of 2000 V. It gains ___ eV of kinetic energy. Give only the number.'
  accept: ['2000']
  explanation: |-
    A charge $e$ moving through $\Delta V$ gains $e|\Delta V|$ of kinetic energy: 2000 eV $= 3.2\times10^{-16}$ J. That is the point of the electron volt; the proton's mass doesn't enter (it affects the speed, not the energy).
- id: phys-m8-r2-q18
  lesson: phys-potential
  type: match
  topic: Electric potential
  stem: 'Match each quantity to its SI unit.'
  pairs:
    - [Electric potential, Volt (joule per coulomb)]
    - [Electric potential energy, Joule]
    - [Electric field, Volt per meter (newton per coulomb)]
    - [Electric charge, Coulomb]
  distractors: [Farad]
  explanation: |-
    Potential is energy per charge, J/C = V. Potential energy is an energy, in joules. The field is force per charge, N/C, which equals V/m. The farad (C/V) is the unit of capacitance.
- id: phys-m8-r2-q19
  lesson: phys-potential
  module_quiz: true
  topic: Electric potential
  stem: 'Which statements about equipotential surfaces are true? Select all that apply.'
  choices: ['They are perpendicular to the field lines', 'The field points from low potential toward high potential', 'Moving a charge along one takes no work', 'Around a point charge they are parallel planes', 'The field is strongest where they are closest together']
  answer: [0, 2, 4]
  explanation: |-
    No work is done along an equipotential, so the field has no component along it: field lines cross equipotentials at right angles, and closely spaced equipotentials mean a steep potential, a strong field. The field points from high to low potential, and a point charge's equipotentials are concentric spheres.
- id: phys-m8-r2-q20
  lesson: phys-potential
  topic: Electric potential
  stem: 'In a region the potential is $V(x) = 5x^2$ volts, with $x$ in meters. What is the field at $x = 2$ m?'
  choices: ['$E_x = +20$ V/m', '$E_x = -10$ V/m', '$E_x = -20$ V/m', '$E_x = +5$ V/m']
  answer: 2
  explanation: |-
    $E_x = -dV/dx = -10x = -20$ V/m at $x = 2$: the field points toward $-x$, down the potential slope. $+20$ V/m forgets the minus sign; $-10$ V/m is $-dV/dx$ evaluated at $x = 1$ instead of 2.

# ---------- Lesson 05: Electric dipoles ----------
- id: phys-m8-r2-q21
  lesson: phys-dipoles
  type: label
  topic: Electric dipoles
  stem: 'A water molecule is a permanent dipole. Name the numbered parts.'
  image: {src: images/phys-m8-water-blank.svg, alt: 'A large circle bonded to two smaller circles that hang below it on either side, forming a bent shape. To the right, a vertical arrow points downward.'}
  labels:
    - {x: 45.5, y: 34.4, text: Oxygen (partial negative end)}
    - {x: 31.1, y: 57.3, text: Hydrogen (partial positive end)}
    - {x: 84.8, y: 50, text: Dipole moment}
  distractors: [Induced dipole, Free electron]
  explanation: |-
    The large atom is oxygen, which pulls the shared electrons toward itself and becomes slightly negative; the two hydrogens are slightly positive. The dipole moment points from the negative end to the positive end, from the oxygen toward the hydrogens. Water's dipole is permanent, not induced.
- id: phys-m8-r2-q22
  lesson: phys-dipoles
  type: text
  topic: Electric dipoles
  stem: 'A dipole consists of charges $\pm3.0$ nC held 4.0 mm apart. Its dipole moment is ___ $\times10^{-12}$ C·m. Give only the number.'
  accept: ['12']
  explanation: |-
    $p = qd = (3.0\times10^{-9})(4.0\times10^{-3}) = 1.2\times10^{-11} = 12\times10^{-12}$ C·m. Using the total charge, 6.0 nC, would double it.
- id: phys-m8-r2-q23
  lesson: phys-dipoles
  module_quiz: true
  type: match
  topic: Electric dipoles
  stem: 'A dipole sits in a uniform field at angle θ between $\vec p$ and $\vec E$. Match each angle to what is true there.'
  pairs:
    - ['$\theta = 0^\circ$', Minimum energy (stable equilibrium)]
    - ['$\theta = 90^\circ$', Largest torque]
    - ['$\theta = 180^\circ$', Maximum energy (unstable equilibrium)]
  distractors: [Largest net force]
  explanation: |-
    $U = -pE\cos\theta$ is lowest ($-pE$) when aligned and highest ($+pE$) when antiparallel; both have zero torque, but only the aligned one is stable. The torque $pE\sin\theta$ peaks at $90^\circ$. In a uniform field the net force is zero at every angle.
- id: phys-m8-r2-q24
  lesson: phys-dipoles
  topic: Electric dipoles
  stem: 'A small dipole is placed in a uniform electric field at an angle to it. Which statements are true? Select all that apply.'
  choices: ['The net force on it is zero', 'It accelerates toward the stronger field', 'The torque turns $\vec p$ toward $\vec E$', 'Its potential energy is $-pE\cos\theta$', 'Its own field far away falls off as $1/r^2$']
  answer: [0, 2, 3]
  explanation: |-
    The forces on $+q$ and $-q$ are equal and opposite (zero net force) but form a couple, $\vec\tau = \vec p\times\vec E$, which swings $\vec p$ toward $\vec E$; $U = -\vec p\cdot\vec E$. A uniform field has no stronger region to move toward, and a dipole's own far field falls off as $1/r^3$.
- id: phys-m8-r2-q25
  lesson: phys-dipoles
  type: order
  topic: Electric dipoles
  stem: 'Rank the strength of a small dipole''s field at these points, strongest first. All distances are measured from the dipole''s center and are much larger than its length.'
  items:
    - 2 cm away on the axis
    - 2 cm away on the perpendicular bisector
    - 4 cm away on the axis
    - 4 cm away on the perpendicular bisector
  explanation: |-
    On the axis $E \approx 2kp/r^3$, on the bisector $kp/r^3$. In units of $kp/(1\text{ cm})^3$: axis at 2 cm $2/8 = 0.25$; bisector at 2 cm $1/8 = 0.125$; axis at 4 cm $2/64 \approx 0.031$; bisector at 4 cm $1/64 \approx 0.016$. Doubling the distance cuts the field by 8, more than the factor of 2 between axis and bisector.

# ---------- Lesson 06: Capacitance ----------
- id: phys-m8-r2-q26
  lesson: phys-capacitance
  type: label
  topic: Capacitance
  stem: 'A dielectric fills the gap of a charged capacitor (top plate positive). Name the numbered features.'
  image: {src: images/phys-m8-dielectric-blank.svg, alt: 'Two horizontal plates with a shaded slab between them. Plus signs sit above the top plate and minus signs below the bottom plate. Inside the slab, a row of minus signs lines the top surface and a row of plus signs lines the bottom surface; between them are oval molecules, each with a minus sign at its top and a plus sign at its bottom. A large arrow at the left points down.'}
  labels:
    - {x: 57.3, y: 10.3, text: Free charge on the plate}
    - {x: 49.5, y: 25.5, text: Bound surface charge}
    - {x: 63.4, y: 51.7, text: Polarized molecule}
    - {x: 13.4, y: 51.7, text: Electric field}
  distractors: [Electrons flowing through the slab]
  explanation: |-
    1 is the free charge delivered to the plate by the battery. 4 is the field, pointing from the positive plate to the negative one. The molecules (3) are polarized along it, negative ends up. Their charges cancel inside the slab but not at its surfaces, leaving bound charge (2) that faces the plate of opposite sign and partly cancels its field. No charge flows through an insulator.
- id: phys-m8-r2-q27
  lesson: phys-capacitance
  type: text
  topic: Capacitance
  stem: 'A 4.0 μF capacitor and a 12 μF capacitor are connected in series. Their equivalent capacitance is ___ μF. Give only the number.'
  accept: ['3']
  explanation: |-
    $1/C_{\text{eq}} = 1/4.0 + 1/12 = 4/12$, so $C_{\text{eq}} = 3.0$ μF, smaller than either. Adding them (16 μF) is the parallel rule.
- id: phys-m8-r2-q28
  lesson: phys-capacitance
  type: order
  topic: Capacitance
  stem: 'Rank these from smallest to largest capacitance.'
  items:
    - A 2.0 μF and a 4.0 μF capacitor in series
    - A 2.0 μF capacitor alone
    - A 4.0 μF capacitor alone
    - A 2.0 μF and a 4.0 μF capacitor in parallel
  explanation: |-
    Series: $1/(1/2 + 1/4) = 1.33$ μF, below the smaller one. Parallel: $2 + 4 = 6$ μF, above the larger one. So 1.33 < 2.0 < 4.0 < 6.0 μF.
- id: phys-m8-r2-q29
  lesson: phys-capacitance
  module_quiz: true
  topic: Capacitance
  stem: 'Which changes increase the capacitance of a parallel-plate capacitor? Select all that apply.'
  choices: ['Raising the voltage across it', 'Using larger plates', 'Moving the plates closer together', 'Putting more charge on the plates', 'Filling the gap with a dielectric']
  answer: [1, 2, 4]
  explanation: |-
    $C = \kappa\varepsilon_0A/d$ depends only on the geometry and the material between the plates: larger $A$, smaller $d$ and larger $\kappa$ all raise it. Raising $V$ raises $Q$ in proportion, so $C = Q/V$ is unchanged.
- id: phys-m8-r2-q30
  lesson: phys-capacitance
  type: match
  topic: Capacitance
  stem: 'Match each formula to what it gives.'
  pairs:
    - ['$C = \varepsilon_0A/d$', Capacitance of parallel plates]
    - ['$U = \tfrac12CV^2$', Energy stored in a capacitor]
    - ['$u = \tfrac12\varepsilon_0E^2$', Energy per volume of an electric field]
    - ['$1/C_{\text{eq}} = 1/C_1 + 1/C_2$', Capacitors in series]
  distractors: [Capacitors in parallel]
  explanation: |-
    Parallel plates: $\varepsilon_0A/d$. Stored energy: $\tfrac12CV^2$ ($= \tfrac12QV = Q^2/2C$). The field's energy density is $\tfrac12\varepsilon_0E^2$. Reciprocals add for series; for parallel the capacitances themselves add, $C_1 + C_2$.

# ---------- Honors 06h1: Laplace's equation and the method of images ----------
- id: phys-m8-r2-h01
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'Where does the electric potential satisfy Laplace''s equation, $\nabla^2V = 0$?'
  choices: ['At every point in any region, charged or not', 'Only inside conductors', 'At every point where there is no charge', 'Only where the field is uniform']
  answer: 2
  explanation: |-
    Poisson's equation $\nabla^2V = -\rho/\varepsilon_0$ holds everywhere; it reduces to Laplace's equation wherever $\rho = 0$. That includes the empty space around charges and the inside of conductors (where $V$ is constant), so "only inside conductors" is too narrow, and a nonuniform field in empty space still satisfies it.
- id: phys-m8-r2-h02
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'According to Earnshaw''s theorem, which of these can hold a charged particle in stable equilibrium?'
  choices: ['A static electric field combined with a magnetic field', 'A cleverly arranged set of fixed point charges', 'A charged ring, with the particle at its center', 'The field inside a charged hollow metal sphere']
  answer: 0
  explanation: |-
    A static electric field alone has no potential minimum in empty space (Laplace's equation forbids one), so fixed charges can give at best a saddle point. The ring's center is stable along the axis or across it, never both. Inside a charged hollow sphere the field is zero, so the particle is in neutral, not stable, equilibrium. Adding a magnetic field, as in a Penning trap, gets around the theorem.
- id: phys-m8-r2-h03
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'A closed, empty metal box sits in a strong external field. Which argument shows that the field inside is exactly zero?'
  choices: ['The outside charges are too far away to matter', 'The box''s walls absorb the field lines', 'The induced charges inside the cavity cancel the field only approximately', 'A constant potential fits Laplace''s equation and the walls, so by uniqueness it is the solution']
  answer: 3
  explanation: |-
    The walls are one conductor, so they are at one potential $V_0$. $V = V_0$ throughout the cavity satisfies $\nabla^2V = 0$ and matches the boundary, and the uniqueness theorem says it is the only solution, so $E = -\nabla V = 0$ exactly. The external field can be as close or as strong as you like.
- id: phys-m8-r2-h04
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'A $+3.0$ nC charge is 2.0 cm above a large grounded metal plate. What force does the plate exert on it? ($k = 8.99\times10^9$ N·m²/C²)'
  choices: ['$2.0\times10^{-4}$ N toward the plate', '$5.1\times10^{-5}$ N toward the plate', '$5.1\times10^{-5}$ N away from the plate', '$2.0\times10^{-6}$ N toward the plate']
  answer: 1
  explanation: |-
    The image is $-3.0$ nC at 2.0 cm below the surface, 4.0 cm from the charge: $F = kq^2/(2d)^2 = (8.99\times10^9)(3.0\times10^{-9})^2/(0.040)^2 = 5.1\times10^{-5}$ N, an attraction. Using $d$ instead of $2d$ gives $2.0\times10^{-4}$ N; forgetting to square $2d$ gives $2.0\times10^{-6}$ N.
- id: phys-m8-r2-h05
  lesson: phys-m8-h-images
  type: text
  topic: Method of images
  stem: 'A $+5.0$ nC charge is 4.0 cm above a large grounded conducting plane. Its image is a ___ nC charge located ___ cm below the plane. Give only the numbers, with a sign on the charge.'
  accept:
    - ['-5', '−5']
    - ['4']
  explanation: |-
    The image of $+q$ at height $d$ is $-q$ at the mirror point, depth $d$: $-5.0$ nC, 4.0 cm below the surface. Then every point of the plane is equally far from the two charges and $V = 0$ there.
- id: phys-m8-r2-h06
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'A $+2.0$ nC charge is 1.0 cm above a grounded plane. What is the induced surface charge density on the plane directly beneath it?'
  choices: ['$-1.6\times10^{-6}$ C/m²', '$-6.4\times10^{-6}$ C/m²', '$+3.2\times10^{-6}$ C/m²', '$-3.2\times10^{-6}$ C/m²']
  answer: 3
  explanation: |-
    At $r = 0$, $\sigma = -\dfrac{qd}{2\pi(d^2)^{3/2}} = -\dfrac{q}{2\pi d^2} = -\dfrac{2.0\times10^{-9}}{2\pi(0.010)^2} = -3.2\times10^{-6}$ C/m². The induced charge is opposite in sign to $q$. Using $4\pi$ or $\pi$ in place of $2\pi$ gives the other magnitudes.
- id: phys-m8-r2-h07
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'How much work does it take to pull a $+4.0$ nC charge from 2.0 cm above a large grounded plate to very far away? ($k = 8.99\times10^9$ N·m²/C²)'
  choices: ['$1.8\times10^{-6}$ J', '$3.6\times10^{-6}$ J', '$7.2\times10^{-6}$ J', '$9.0\times10^{-7}$ J']
  answer: 0
  explanation: |-
    The force at height $x$ is $kq^2/(4x^2)$, and $\int_d^\infty kq^2/(4x^2)\,dx = kq^2/(4d) = (8.99\times10^9)(4.0\times10^{-9})^2/(0.080) = 1.8\times10^{-6}$ J. $3.6\times10^{-6}$ J is $kq^2/(2d)$, the energy of a real pair $2d$ apart, which overcounts because the image moves along with the charge and the field fills only half of space. $7.2\times10^{-6}$ J is $kq^2/d$, and $9.0\times10^{-7}$ J is $kq^2/(8d)$, half the right value.
- id: phys-m8-r2-h08
  lesson: phys-m8-h-images
  type: text
  topic: Method of images
  stem: 'A $+8.0$ nC charge is 40 cm from the center of a grounded metal sphere of radius 10 cm. The image charge is ___ nC, located ___ cm from the sphere''s center. Give only the numbers, with a sign on the charge.'
  accept:
    - ['-2', '−2']
    - ['2.5']
  explanation: |-
    $q' = -qR/a = -(8.0)(10/40) = -2.0$ nC, at $b = R^2/a = 100/40 = 2.5$ cm from the center, on the line toward the charge.
- id: phys-m8-r2-h09
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'A $+8.0$ nC charge is 40 cm from the center of a grounded metal sphere of radius 10 cm, so its image is $-2.0$ nC at 2.5 cm from the center. What is the magnitude of the force on the charge? ($k = 8.99\times10^9$ N·m²/C²)'
  choices: ['$8.99\times10^{-7}$ N', '$1.6\times10^{-6}$ N', '$1.0\times10^{-6}$ N', '$4.1\times10^{-6}$ N']
  answer: 2
  explanation: |-
    The charges are $40 - 2.5 = 37.5$ cm apart: $F = (8.99\times10^9)(8.0\times10^{-9})(2.0\times10^{-9})/(0.375)^2 = 1.0\times10^{-6}$ N, attractive. Using the distance to the center (40 cm) gives $8.99\times10^{-7}$ N, the distance to the surface (30 cm) $1.6\times10^{-6}$ N, and an image of $-8.0$ nC $4.1\times10^{-6}$ N.
- id: phys-m8-r2-h10
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'Which statements about the method of images are true? Select all that apply.'
  choices: ['Image charges are placed outside the region where the field is wanted', 'The total induced charge on a grounded plane equals $-q$', 'Inside the metal, the true field equals the image charge''s field', 'A grounded sphere''s image charge is smaller in magnitude than the real charge', 'The image charge is a real charge that collects at one point in the metal']
  answer: [0, 1, 3]
  explanation: |-
    The images sit outside the region, so the region's charges are just the real ones and uniqueness applies. Integrating $\sigma$ over the plane gives exactly $-q$; a sphere's image $-qR/a$ is smaller because $R < a$. Inside the metal the true field is zero, and the real induced charge is spread over the surface; the image is only a calculating device.
- id: phys-m8-r2-h11
  lesson: phys-m8-h-images
  type: order
  topic: Method of images
  stem: 'Put the steps of the method of images in order.'
  items:
    - Choose the region where you want the field
    - Place image charges outside that region
    - Check that the conductor's surface has the required potential
    - Invoke the uniqueness theorem
    - Compute the force and the induced surface charge
  explanation: |-
    The region must be fixed before you know where images may go (outside it). Only after checking the boundary condition can you appeal to uniqueness, and only then are the field, forces and $\sigma = \varepsilon_0E_\perp$ trustworthy.
- id: phys-m8-r2-h12
  lesson: phys-m8-h-images
  type: match
  topic: Method of images
  stem: 'Match each conductor problem to the image charges that solve it (q is the real charge).'
  pairs:
    - [Charge at height d above a grounded plane, −q at depth d below the plane]
    - [Charge at distance a from the center of a grounded sphere of radius R, −qR/a at distance R²/a from the center]
    - [The same sphere but isolated and neutral, The grounded-sphere image plus +qR/a at the center]
  distractors: [−q at the center of the sphere]
  explanation: |-
    A mirror image for the plane; for a grounded sphere, $-qR/a$ at $R^2/a$ makes every point of the sphere's surface have $V = 0$. A neutral isolated sphere must carry zero net charge, so $+qR/a$ is added at the center, which keeps the surface an equipotential. A charge $-q$ at the center does not make the surface an equipotential.
- id: phys-m8-r2-h13
  lesson: phys-m8-h-images
  type: label
  topic: Method of images
  stem: 'The picture shows a charge above a flat metal surface, with the image used to find its field. Name the numbered features.'
  image: {src: images/phys-m8-image-plane-blank.svg, alt: 'A small circle with a plus sign sits above a horizontal hatched surface. Curved lines with arrows leave it; some go up and out, and the rest curve down to meet the surface at right angles. A dashed circle with a minus sign is drawn the same distance below the surface, joined to the upper circle by a dashed vertical line.'}
  labels:
    - {x: 50, y: 28.9, text: Real charge}
    - {x: 50, y: 92.1, text: Image charge}
    - {x: 16.7, y: 63.2, text: Grounded conductor}
    - {x: 32.8, y: 39.6, text: Field line}
  distractors: [Equipotential, Induced dipole]
  explanation: |-
    1 is the real charge $+q$ and 2 the image $-q$, drawn dashed because nothing is really there. 3 is the grounded metal surface, which the field lines (4) meet at right angles, as they must at a conductor's surface, an equipotential.
- id: phys-m8-r2-h14
  lesson: phys-m8-h-images
  topic: Method of images
  stem: 'Using the image model, what is the potential energy of an electron 1.0 nm from a flat metal surface? ($ke^2 = 1.44$ eV·nm)'
  choices: ['$-0.72$ eV', '$-1.44$ eV', '$-0.18$ eV', '$-0.36$ eV']
  answer: 3
  explanation: |-
    $U = -ke^2/(4x) = -1.44/(4 \times 1.0) = -0.36$ eV. $-0.72$ eV is $-ke^2/(2x)$, the pair-energy mistake; $-1.44$ eV forgets the factor of 4 entirely; $-0.18$ eV uses $8x$.

# ---------- Honors 06h2: Dielectrics in depth ----------
- id: phys-m8-r2-h15
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'The polarization $\vec P$ of a dielectric is measured in'
  choices: ['C/m²', 'C·m', 'V/m', 'C/m³']
  answer: 0
  explanation: |-
    $\vec P$ is dipole moment per volume: (C·m)/m³ = C/m², the unit of surface charge density, which fits $\sigma_b = \vec P\cdot\hat n$. C·m is a single dipole moment; C/m³ is a volume charge density.
- id: phys-m8-r2-h16
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A dielectric slab fills a capacitor. The bound charge on the face of the slab touching the positive plate is'
  choices: ['positive, equal to the free charge', 'negative, smaller in magnitude than the free charge', 'zero, because the slab is neutral', 'negative, larger in magnitude than the free charge']
  answer: 1
  explanation: |-
    The dipoles point along $\vec E$, away from the positive plate, so their negative ends face it: $\sigma_b = -\sigma_f(1 - 1/\kappa)$, opposite in sign and smaller in size. The slab is neutral overall because the far face carries the opposite bound charge. If it exceeded the free charge, the field would reverse inside.
- id: phys-m8-r2-h17
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A dielectric with $\kappa = 4.0$ fills a capacitor whose plates carry free charge density $2.0$ μC/m². What is the magnitude of the bound surface charge density on the dielectric?'
  choices: ['0.50 μC/m²', '2.0 μC/m²', '1.5 μC/m²', '8.0 μC/m²']
  answer: 2
  explanation: |-
    $\sigma_b = \sigma_f(1 - 1/\kappa) = 2.0(1 - 0.25) = 1.5$ μC/m². The net charge $\sigma_f - \sigma_b = 0.50$ μC/m² $= \sigma_f/\kappa$ is what sets the reduced field, a common mix-up.
- id: phys-m8-r2-h18
  lesson: phys-m8-h-dielectrics
  type: text
  topic: Dielectrics
  stem: 'A material has dielectric constant $\kappa = 2.5$. Its electric susceptibility $\chi_e$ is ___. Give only the number.'
  accept: ['1.5']
  explanation: |-
    $\kappa = 1 + \chi_e$, so $\chi_e = 1.5$. (Vacuum has $\chi_e = 0$, $\kappa = 1$.)
- id: phys-m8-r2-h19
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A dielectric slab lies flat against one plate of a charged capacitor, with air in the rest of the gap. Which quantity has the same value in the air and in the slab?'
  choices: ['The electric field $E$', 'The polarization $P$', 'The energy density', 'The electric displacement $D$']
  answer: 3
  explanation: |-
    A pillbox around the plate encloses only the plate's free charge, so $D = \sigma_f$ in both layers. $E = D/(\kappa\varepsilon_0)$ is $\kappa$ times smaller in the slab, $P$ is zero in the air, and the energy density $\tfrac12ED$ differs too.
- id: phys-m8-r2-h20
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'Plates of area 0.010 m² are 3.0 mm apart. A slab with $\kappa = 2.0$ and thickness 1.0 mm lies against one plate. What is the capacitance? ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['35 pF', '59 pF', '30 pF', '22 pF']
  answer: 0
  explanation: |-
    $C = \varepsilon_0A/(d - t + t/\kappa) = (8.85\times10^{-14})/(0.0020 + 0.00050) = 35$ pF. Without the slab it is 30 pF; treating the gap as fully filled gives 59 pF; multiplying by $\kappa$ instead of dividing ($d - t + \kappa t$) gives 22 pF.
- id: phys-m8-r2-h21
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A charged capacitor is disconnected from its battery, and then a dielectric slab is slid in to fill it. Which statements are true? Select all that apply.'
  choices: ['The charge on the plates increases', 'The capacitance increases', 'The voltage between the plates decreases', 'The slab is pushed out of the gap', 'The stored energy decreases']
  answer: [1, 2, 4]
  explanation: |-
    With $Q$ fixed, $C \to \kappa C$, $V = Q/C$ falls by $\kappa$, and $U = Q^2/(2C)$ falls by $\kappa$. The energy lost is the work the field does pulling the slab in, not pushing it out. With no battery, the charge cannot change.
- id: phys-m8-r2-h22
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A 10 pF capacitor stays connected to a 100 V battery while a slab with $\kappa = 4.0$ is slid in to fill it. How much energy does the battery supply?'
  choices: ['150 nJ', '200 nJ', '50 nJ', '300 nJ']
  answer: 3
  explanation: |-
    $Q$ rises from 1.0 nC to 4.0 nC, so the battery moves 3.0 nC through 100 V: 300 nJ. The stored energy rises from 50 nJ to 200 nJ, an increase of 150 nJ, half of what the battery supplied; the other 150 nJ is work done on the slab as it is pulled in.
- id: phys-m8-r2-h23
  lesson: phys-m8-h-dielectrics
  type: match
  topic: Dielectrics
  stem: 'Match each situation to the right description.'
  pairs:
    - [Slab slid into a capacitor disconnected from its battery, Stored energy falls]
    - [Slab slid into a capacitor kept on its battery, Stored energy rises]
    - [Slab against one plate with air in the rest of the gap, Acts like two capacitors in series]
    - [Slab of full thickness covering half the plate area, Acts like two capacitors in parallel]
  distractors: [Slab is pushed out of the gap]
  explanation: |-
    Fixed $Q$: $U = Q^2/(2C)$ falls as $C$ grows. Fixed $V$: $U = \tfrac12CV^2$ rises. Stacked layers carry the same $D$ (same charge) and their voltages add, which is series; side-by-side regions share the voltage, which is parallel. In both insertion cases the slab is pulled in.
- id: phys-m8-r2-h24
  lesson: phys-m8-h-dielectrics
  type: text
  topic: Dielectrics
  stem: 'Dry air breaks down at about $3.0\times10^6$ V/m. The largest voltage that can be put across an air gap of 2.0 mm is about ___ V. Give only the number.'
  accept: ['6000', '6.0e3', '6e3']
  explanation: |-
    $V_{\max} = E_{\max}d = (3.0\times10^6)(2.0\times10^{-3}) = 6000$ V.
- id: phys-m8-r2-h25
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'Two ions in a liquid with dielectric constant 25 are a fixed distance apart. Treating the liquid as a uniform dielectric, the force between them compared with the same ions in vacuum is'
  choices: ['1/25 as large', '25 times larger', '1/5 as large', 'unchanged, since force depends only on the charges and distance']
  answer: 0
  explanation: |-
    In a uniform linear dielectric $\varepsilon_0$ becomes $\kappa\varepsilon_0$, so $F = q_1q_2/(4\pi\kappa\varepsilon_0r^2)$, $\kappa$ times weaker. The bound charges around each ion partly screen it. (At molecular distances this smooth-dielectric model is only a rough guide.)
- id: phys-m8-r2-h26
  lesson: phys-m8-h-dielectrics
  type: order
  topic: Dielectrics
  stem: 'The same pair of plates, 4.0 mm apart, is used four ways. Rank the capacitances from smallest to largest.'
  items:
    - Air only
    - A slab 2.0 mm thick with κ = 3.0, air in the rest
    - A slab 2.0 mm thick with κ = 6.0, air in the rest
    - The whole gap filled with κ = 3.0
  explanation: |-
    $C \propto 1/(d - t + t/\kappa)$ in mm: air $1/4 = 0.25$; $1/(2 + 0.67) = 0.375$; $1/(2 + 0.33) = 0.43$; full gap $3/4 = 0.75$. A partial slab helps less than you might expect because the air layer still carries most of the voltage.
- id: phys-m8-r2-h27
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'A dielectric has $\kappa = 2.0$ and dielectric strength $1.5\times10^7$ V/m. What is the most energy per cubic meter a capacitor using it can store?'
  choices: ['$1.0\times10^3$ J/m³', '$4.0\times10^3$ J/m³', '$2.0\times10^3$ J/m³', '$1.3\times10^{-4}$ J/m³']
  answer: 2
  explanation: |-
    $u_{\max} = \tfrac12\kappa\varepsilon_0E_{\max}^2 = \tfrac12(2.0)(8.85\times10^{-12})(1.5\times10^7)^2 = 2.0\times10^3$ J/m³. Leaving out $\kappa$ gives $1.0\times10^3$; leaving out the $\tfrac12$ gives $4.0\times10^3$; forgetting to square $E$ gives $1.3\times10^{-4}$.
- id: phys-m8-r2-h28
  lesson: phys-m8-h-dielectrics
  topic: Dielectrics
  stem: 'Plates 5.0 cm wide and 0.50 mm apart are held at 500 V. A slab with $\kappa = 3.0$ is partly inserted. With what force is it pulled in?'
  choices: ['$3.3\times10^{-4}$ N', '$2.2\times10^{-4}$ N', '$4.4\times10^{-4}$ N', '$1.1\times10^{-4}$ N']
  answer: 1
  explanation: |-
    $F = (\kappa - 1)\varepsilon_0wV^2/(2d) = (2.0)(8.85\times10^{-12})(0.050)(500)^2/(2 \times 0.00050) = 2.2\times10^{-4}$ N. Using $\kappa$ instead of $\kappa - 1$ gives $3.3\times10^{-4}$ N; dropping the 2 in the denominator gives $4.4\times10^{-4}$ N, and dividing by 2 twice gives $1.1\times10^{-4}$ N.

# ---------- Honors 06h3: Electrostatic energy and forces on conductors ----------
- id: phys-m8-r2-h29
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'Three $+2.0$ μC charges sit at the corners of an equilateral triangle with 0.30 m sides. How much work did it take to assemble them? ($k = 8.99\times10^9$ N·m²/C²)'
  choices: ['0.12 J', '0.36 J', '0.72 J', '1.2 J']
  answer: 1
  explanation: |-
    Three pairs, each $kq^2/r = (8.99\times10^9)(2.0\times10^{-6})^2/0.30 = 0.120$ J: total 0.36 J. One pair alone is 0.12 J; counting each pair twice gives 0.72 J; using $r^2$ gives 1.2 J.
- id: phys-m8-r2-h30
  lesson: phys-m8-h-energy
  type: text
  topic: Electrostatic energy
  stem: 'To find the energy of five point charges with $U = \sum kq_iq_j/r_{ij}$, you add ___ pair terms. Give only the number.'
  accept: ['10']
  explanation: |-
    Each pair is counted once: $\binom52 = 5 \times 4/2 = 10$. Counting 20 counts every pair twice, which is why the other form, $\tfrac12\sum q_iV_i$, has a $\tfrac12$.
- id: phys-m8-r2-h31
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'A thin shell and a uniformly charged solid ball have the same charge $Q$ and radius $R$. The ball''s self-energy divided by the shell''s is'
  choices: ['1.2', '1.0', '0.83', '0.60']
  answer: 0
  explanation: |-
    Ball $\tfrac35kQ^2/R$, shell $\tfrac12kQ^2/R$: ratio $0.6/0.5 = 1.2$. The ball also has field energy inside it, which the shell (with $E = 0$ inside) lacks.
- id: phys-m8-r2-h32
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'What is the self-energy of a thin conducting spherical shell of radius 10 cm carrying 5.0 nC? ($k = 8.99\times10^9$ N·m²/C²)'
  choices: ['$2.2\times10^{-6}$ J', '$1.3\times10^{-6}$ J', '$1.1\times10^{-6}$ J', '$5.6\times10^{-7}$ J']
  answer: 2
  explanation: |-
    $U = kQ^2/(2R) = (8.99\times10^9)(5.0\times10^{-9})^2/(0.20) = 1.1\times10^{-6}$ J. Dropping the $\tfrac12$ gives $2.2\times10^{-6}$ J, the solid-ball formula $\tfrac35kQ^2/R$ gives $1.3\times10^{-6}$ J, and using the diameter (0.20 m) as $R$ gives $5.6\times10^{-7}$ J.
- id: phys-m8-r2-h33
  lesson: phys-m8-h-energy
  type: text
  topic: Electrostatic energy
  stem: 'The classical electron radius $r_e = ke^2/(m_ec^2)$ is about ___ fm (2 significant figures). Give only the number.'
  accept: ['2.8']
  explanation: |-
    $ke^2 = 1.44$ MeV·fm and $m_ec^2 = 0.511$ MeV, so $r_e = 1.44/0.511 = 2.8$ fm $= 2.8\times10^{-15}$ m.
- id: phys-m8-r2-h34
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'Why is the classical electron radius not the actual size of the electron?'
  choices: ['It was calculated with an old, inaccurate value of $e$', 'Experiments find no structure in the electron down to scales far below it', 'The electron is larger, because its charge spreads through the atom', 'It ignores the electron''s magnetic field, which doubles its size']
  answer: 1
  explanation: |-
    $r_e$ is only the radius at which a classical charge's electric energy would equal $m_ec^2$ (with a factor of order 1 dropped). Scattering experiments find the electron pointlike to far smaller distances. The value of $e$ is known very precisely, and the electron's spread in an atom is a quantum probability cloud, not its size.
- id: phys-m8-r2-h35
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'Model an iron-56 nucleus ($Z = 26$) as a uniformly charged ball of radius $(1.2\text{ fm})A^{1/3} = 4.6$ fm. Using $ke^2 = 1.44$ MeV·fm, its electric self-energy is about'
  choices: ['210 MeV', '106 MeV', '4.9 MeV', '127 MeV']
  answer: 3
  explanation: |-
    $U = \tfrac35k(Ze)^2/R = 0.6(1.44)(26)^2/4.59 = 127$ MeV. Without the $\tfrac35$ it is 212 MeV; the shell formula ($\tfrac12$) gives 106 MeV; using $Z$ instead of $Z^2$ gives 4.9 MeV.
- id: phys-m8-r2-h36
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'A conductor''s surface carries $\sigma = 4.0$ μC/m². What is the electrostatic pressure on the surface? ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['1.8 Pa, outward', '0.90 Pa, inward', '0.90 Pa, outward', '$2.3\times10^5$ Pa, outward']
  answer: 2
  explanation: |-
    $P = \sigma^2/(2\varepsilon_0) = (4.0\times10^{-6})^2/(1.77\times10^{-11}) = 0.90$ Pa, always outward (for either sign of charge). $\sigma^2/\varepsilon_0 = 1.8$ Pa uses the full outside field instead of the average; $2.3\times10^5$ Pa forgets to square $\sigma$.
- id: phys-m8-r2-h37
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'A parallel-plate capacitor holds charge $Q$, and the field between its plates is $E$. Which statements about the force between the plates are true? Select all that apply.'
  choices: ['The force is $QE$', 'The force is $Q^2/(2\varepsilon_0A)$', 'The plates repel each other', 'The force is $\tfrac12QE$', 'Each plate feels only the field of the other plate']
  answer: [1, 3, 4]
  explanation: |-
    A plate doesn't push on itself, so it feels only the other plate's field, $\sigma/(2\varepsilon_0) = E/2$. The force is $Q\cdot E/2 = Q^2/(2\varepsilon_0A)$, an attraction between opposite charges. $QE$ is double the right value.
- id: phys-m8-r2-h38
  lesson: phys-m8-h-energy
  type: match
  topic: Electrostatic energy
  stem: 'Match each expression to what it gives.'
  pairs:
    - ['$kQ^2/(2R)$', Self-energy of a thin charged shell]
    - ['$\tfrac35kQ^2/R$', Self-energy of a uniformly charged ball]
    - ['$\sigma^2/(2\varepsilon_0)$', Outward pressure on a charged conductor]
    - ['$Q^2/(2\varepsilon_0A)$', Attraction between capacitor plates]
  distractors: [Field just outside a charged conductor]
  explanation: |-
    The shell has field only outside; the ball has field inside too, so $\tfrac35 > \tfrac12$. The surface pressure is $\sigma^2/(2\varepsilon_0)$ (force per area), and multiplying it by the plate area gives $Q^2/(2\varepsilon_0A)$. The field just outside a conductor is $\sigma/\varepsilon_0$, without the square and the $\tfrac12$.
- id: phys-m8-r2-h39
  lesson: phys-m8-h-energy
  type: order
  topic: Electrostatic energy
  stem: 'All four objects carry the same charge $Q$. Rank their self-energies from smallest to largest.'
  items:
    - A thin shell of radius 2R
    - A uniform ball of radius 2R
    - A thin shell of radius R
    - A uniform ball of radius R
  explanation: |-
    In units of $kQ^2/R$: shell $2R$, $1/4 = 0.25$; ball $2R$, $3/10 = 0.30$; shell $R$, $0.50$; ball $R$, $0.60$. Squeezing the same charge into a smaller space costs more energy, and a ball costs 1.2 times a shell of the same size.
- id: phys-m8-r2-h40
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'A capacitor stays connected to a battery while its plates are pulled apart. A student uses $F = -dU/dx$ with $U = \varepsilon_0AV^2/(2x)$. What does the student wrongly conclude?'
  choices: ['That the plates repel', 'That the force is zero', 'That the force is twice too large but attractive', 'That the force grows with the gap']
  answer: 0
  explanation: |-
    $-dU/dx = +\varepsilon_0AV^2/(2x^2)$, positive: a push toward larger $x$, a repulsion. At fixed $V$ the battery also does work ($2\,dU$), and the correct rule is $F = +dU/dx = -\varepsilon_0AV^2/(2x^2)$, an attraction of the right size.
- id: phys-m8-r2-h41
  lesson: phys-m8-h-energy
  type: text
  topic: Electrostatic energy
  stem: 'Plates of area 0.010 m² are 2.0 mm apart and held at 400 V. The force between them is ___ mN (2 significant figures). Give only the number.'
  accept: ['1.8']
  explanation: |-
    $E = 400/0.0020 = 2.0\times10^5$ V/m; $F = \tfrac12\varepsilon_0E^2A = \tfrac12(8.85\times10^{-12})(4.0\times10^{10})(0.010) = 1.77\times10^{-3}$ N $= 1.8$ mN.
- id: phys-m8-r2-h42
  lesson: phys-m8-h-energy
  topic: Electrostatic energy
  stem: 'Just outside a charged conductor the field is $\sigma/\varepsilon_0$. Why is the force per area on the surface charge only $\sigma^2/(2\varepsilon_0)$?'
  choices: ['Half the charge is inside the conductor, where the field is zero', 'The surface charge feels the average of the field inside (zero) and just outside', 'The field is $\sigma/(2\varepsilon_0)$ everywhere outside a conductor', 'The conductor''s atoms hold back half of the force']
  answer: 1
  explanation: |-
    Across the thin layer of charge the field climbs from 0 to $\sigma/\varepsilon_0$, and integrating $\rho E$ through the layer gives $\sigma\cdot\sigma/(2\varepsilon_0)$ whatever the layer's profile. All the excess charge is on the surface, and the outside field is the full $\sigma/\varepsilon_0$.
