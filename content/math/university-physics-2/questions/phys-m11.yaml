- id: phys-q-4101
  lesson: phys-light
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'What is the wavelength of light with frequency $5.0\times10^{14}$ Hz in vacuum?'
  choices: ['$1.7\times10^{-6}$ m', '$1.5\times10^{23}$ m', '600 m', '600 nm']
  answer: 3
  explanation: |-
    $\lambda = c/f = (3.00\times10^8)/(5.0\times10^{14}) = 6.0\times10^{-7}$ m $= 600$ nm (orange light). Multiplying $c$ by $f$ instead of dividing gives $1.5\times10^{23}$ m.
- id: phys-q-4102
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Which statement about electromagnetic waves is correct?'
  choices: ['They need a medium to travel', 'They are longitudinal', 'Their electric and magnetic fields are perpendicular to each other and to the direction of travel', 'Radio waves travel faster than visible light in vacuum']
  answer: 2
  explanation: |-
    EM waves are transverse, with $\vec E \perp \vec B \perp$ direction of travel, and all travel at $c$ in vacuum, needing no medium.
- id: phys-q-4103
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Order these from longest to shortest wavelength: X-rays, microwaves, visible light, ultraviolet.'
  choices: ['X-rays, ultraviolet, visible, microwaves', 'Microwaves, visible, ultraviolet, X-rays', 'Visible, microwaves, ultraviolet, X-rays', 'Microwaves, ultraviolet, visible, X-rays']
  answer: 1
  explanation: |-
    The spectrum runs radio, microwave, infrared, visible, ultraviolet, X-ray, gamma in order of decreasing wavelength (increasing frequency).
- id: phys-q-4104
  lesson: phys-light
  module_quiz: true
  topic: Reflection and refraction
  stem: 'Light passes from air into glass ($n = 1.50$) at $40^\circ$ to the normal. What is the angle of refraction?'
  choices: ['$25.4^\circ$', '$60.0^\circ$', '$74.6^\circ$', '$40^\circ$']
  answer: 0
  explanation: |-
    $\sin\theta_2 = \sin 40^\circ/1.50 = 0.429$, so $\theta_2 = 25.4^\circ$, bent toward the normal. 60° multiplies the angle by 1.5 instead of using sines.
- id: phys-q-4105
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'When light passes from air into water, which quantity does not change?'
  choices: ['Speed', 'Wavelength', 'Direction (at an angle)', 'Frequency']
  answer: 3
  explanation: |-
    The frequency is set by the source. Speed drops to $c/n$ and wavelength to $\lambda/n$, and the direction bends unless the light hits head-on.
- id: phys-q-4106
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'What is the critical angle for light going from water ($n = 1.33$) into air?'
  choices: ['$41.8^\circ$', '$53.1^\circ$', '$48.8^\circ$', 'There is none']
  answer: 2
  explanation: |-
    $\sin\theta_c = n_2/n_1 = 1.00/1.33 = 0.752$, so $\theta_c = 48.8^\circ$. Beyond this, light is totally internally reflected. (41.8° is the value for glass with $n = 1.5$.)
- id: phys-q-4107
  lesson: phys-light
  module_quiz: true
  topic: Reflection and refraction
  stem: 'Total internal reflection can occur when light travels'
  choices: ['from air into glass', 'only through optical fibers', 'from any medium into a mirror', 'from glass into air']
  answer: 3
  explanation: |-
    It requires going from higher to lower index, so the refracted ray bends away from the normal and can reach 90°. Going into a denser medium the light always refracts.
- id: phys-q-4108
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Unpolarized light of intensity $I_0$ passes through two polarizers whose axes are $60^\circ$ apart. The transmitted intensity is'
  choices: ['$0.125I_0$', '$0.25I_0$', '$0.50I_0$', '$0.75I_0$']
  answer: 0
  explanation: |-
    The first polarizer halves it: $0.5I_0$. Malus's law at the second: $0.5I_0\cos^2 60^\circ = 0.5I_0(0.25) = 0.125I_0$. Forgetting the first halving gives $0.25I_0$.
- id: phys-q-4109
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'A prism spreads white light into a spectrum because'
  choices: ['different colors travel at different speeds in glass (dispersion)', 'glass absorbs some colors', 'different colors reflect at different angles', 'white light is polarized by the prism']
  answer: 0
  explanation: |-
    The index of refraction depends on wavelength (violet is slowed and bent more than red), so each color refracts by a different angle.
- id: phys-q-4110
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'Snell''s law can be derived by requiring that light take the path that'
  choices: ['is shortest in distance', 'takes the least time', 'has the most reflections', 'stays in one medium']
  answer: 1
  explanation: |-
    Fermat's principle: minimizing travel time $t(x)$ over the crossing point and setting $dt/dx = 0$ gives $\sin\theta_1/v_1 = \sin\theta_2/v_2$, which is Snell's law.
- id: phys-q-4111
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Maxwell found the speed of electromagnetic waves to be $1/\sqrt{\mu_0\varepsilon_0}$. Why was this result so important?'
  choices: ['It showed light has mass', 'It matched the measured speed of light, revealing light as an EM wave', 'It proved the existence of an ether', 'It showed EM waves are longitudinal']
  answer: 1
  explanation: |-
    The constants from electricity and magnetism gave $3.00\times10^8$ m/s, the speed of light, uniting optics with electromagnetism.
- id: phys-q-4112
  lesson: phys-light
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'A parallel-plate capacitor with plates of area 0.020 m² is charging, and the field between its plates is increasing at $5.0\times10^{12}$ V/(m·s). What is the displacement current between the plates? ($\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['44 A', '$2.2\times10^{3}$ A', '0.89 A', '$1.3\times10^{5}$ A']
  answer: 2
  explanation: |-
    $I_d = \varepsilon_0\dfrac{d\Phi_E}{dt} = \varepsilon_0A\dfrac{dE}{dt} = (8.85\times10^{-12})(0.020)(5.0\times10^{12}) = 0.89$ A. Leaving out the area gives 44 A; dividing by the area gives $2.2\times10^3$ A; using $\mu_0$ in place of $\varepsilon_0$ gives $1.3\times10^5$ A.
- id: phys-q-4113
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'A capacitor is charging with current $I$ in its wires. How large is the displacement current in the gap between its plates?'
  choices: ['Equal to $I$', 'Zero, since no charge crosses the gap', 'Twice $I$', 'Equal to $I$ only after the capacitor is fully charged']
  answer: 0
  explanation: |-
    The plate charge grows at rate $I$, so the flux $\Phi_E = Q/\varepsilon_0$ grows at $I/\varepsilon_0$ and $I_d = \varepsilon_0\,d\Phi_E/dt = I$. That keeps Ampère's law consistent whether the surface cuts the wire or passes through the gap. Saying zero forgets Maxwell's term; once the capacitor is fully charged, both the current and the displacement current are zero.
- id: phys-q-4114
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Which of Maxwell''s equations expresses the fact that there are no isolated magnetic poles (monopoles)?'
  choices: ['$\oint\vec E\cdot d\vec A = Q_{\text{enc}}/\varepsilon_0$', '$\oint\vec E\cdot d\vec\ell = -d\Phi_B/dt$', '$\oint\vec B\cdot d\vec\ell = \mu_0I_{\text{enc}} + \mu_0\varepsilon_0\,d\Phi_E/dt$', '$\oint\vec B\cdot d\vec A = 0$']
  answer: 3
  explanation: |-
    Gauss's law for magnetism says the net magnetic flux out of any closed surface is zero: every field line that leaves comes back, so there is no magnetic "charge" for lines to start or end on. The others are Gauss's law for $\vec E$ (charges are sources of $\vec E$), Faraday's law and the Ampère–Maxwell law.
- id: phys-q-4115
  lesson: phys-light
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'At what angle of incidence is light reflected from glass ($n = 1.52$) in air completely polarized?'
  choices: ['$33.3^\circ$', '$56.7^\circ$', '$41.1^\circ$', '$48.9^\circ$']
  answer: 1
  explanation: |-
    Brewster's angle: $\tan\theta_B = n_2/n_1 = 1.52$, so $\theta_B = 56.7^\circ$. Inverting the ratio gives $33.3^\circ$; $41.1^\circ$ is the critical angle for glass to air, $\sin\theta_c = 1/1.52$, a different phenomenon; $48.9^\circ$ uses $\cos\theta = 1/1.52$.
- id: phys-q-4116
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Light in air strikes water ($n = 1.33$) at Brewster''s angle, $53.1^\circ$. What is the angle of refraction?'
  choices: ['$53.1^\circ$', '$48.8^\circ$', '$36.9^\circ$', '$26.6^\circ$']
  answer: 2
  explanation: |-
    At Brewster's angle the reflected and refracted rays are perpendicular, so $\theta_2 = 90^\circ - 53.1^\circ = 36.9^\circ$. Snell's law agrees: $\sin\theta_2 = \sin 53.1^\circ/1.33 = 0.600$. Keeping $53.1^\circ$ ignores refraction; $48.8^\circ$ is the critical angle for water; $26.6^\circ$ halves the angle.
- id: phys-q-4117
  lesson: phys-light
  topic: Electromagnetic waves
  stem: 'Unpolarized sunlight reflects from a calm lake at Brewster''s angle. The reflected light is'
  choices: ['completely polarized, with its electric field parallel to the water surface', 'completely polarized, with its electric field vertical', 'unpolarized, like the incoming light', 'absent: nothing reflects at that angle']
  answer: 0
  explanation: |-
    At Brewster's angle the reflected light is completely polarized parallel to the surface (horizontal for a lake), which is why polarized sunglasses with vertical axes block it. The vertically polarized component is the part that is not reflected at all; the horizontal part still reflects, so the reflection does not vanish.
- id: phys-q-4901
  lesson: phys-em-energy
  module_quiz: true
  topic: Energy in electromagnetic waves
  stem: 'An electromagnetic wave has a peak electric field of 600 V/m. What is its intensity? ($c = 3.00\times10^8$ m/s, $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['478 W/m²', '956 W/m²', '0.80 W/m²', '$1.6\times10^{-6}$ W/m²']
  answer: 0
  explanation: |-
    $I = \tfrac12c\varepsilon_0E_0^2 = \tfrac12(3.00\times10^8)(8.85\times10^{-12})(600)^2 = 478$ W/m². Leaving out the $\tfrac12$ (using the peak field as if it were rms) gives 956; forgetting to square $E_0$ gives 0.80; leaving out $c$ gives $1.6\times10^{-6}$, which is the average energy density in J/m³, not an intensity.
- id: phys-q-4902
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'In an electromagnetic wave traveling through vacuum, what fraction of the energy is carried by the magnetic field?'
  choices: ['Almost none, since $B = E/c$ is tiny', 'All of it', 'Exactly half', 'A fraction that depends on the frequency']
  answer: 2
  explanation: |-
    With $B = E/c$ and $c^2 = 1/(\mu_0\varepsilon_0)$, $\dfrac{B^2}{2\mu_0} = \dfrac{E^2}{2\mu_0c^2} = \tfrac12\varepsilon_0E^2$, so $u_B = u_E$ at every instant and every frequency. Judging by the size of $B$ in teslas ignores the $1/\mu_0$ in the magnetic energy density, which is huge.
- id: phys-q-4903
  lesson: phys-em-energy
  module_quiz: true
  topic: Energy in electromagnetic waves
  stem: 'At some instant a wave''s electric field points in the $+z$ direction and its magnetic field points in the $+x$ direction. Which way is the wave traveling?'
  choices: ['$+x$', '$+y$', '$-y$', '$+z$']
  answer: 1
  explanation: |-
    Energy flows along $\vec S = \vec E\times\vec B/\mu_0 \propto \hat k\times\hat\imath = \hat\jmath$, so the wave moves in $+y$. Computing $\vec B\times\vec E$ instead reverses it to $-y$. The wave cannot travel along either field, because both fields are perpendicular to the direction of travel.
- id: phys-q-4904
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'Light of intensity 1000 W/m² falls on a surface. What is the peak magnetic field of the wave? ($\mu_0 = 4\pi\times10^{-7}$ T·m/A, $c = 3.00\times10^8$ m/s)'
  choices: ['$2.0\times10^{-6}$ T', '$8.4\times10^{-12}$ T', '$5.0\times10^{-2}$ T', '$2.9\times10^{-6}$ T']
  answer: 3
  explanation: |-
    $I = \dfrac{cB_0^2}{2\mu_0}$, so $B_0 = \sqrt{\dfrac{2\mu_0I}{c}} = \sqrt{\dfrac{2(4\pi\times10^{-7})(1000)}{3.00\times10^8}} = 2.9\times10^{-6}$ T. Leaving out the 2 gives the rms field, $2.0\times10^{-6}$ T; forgetting the square root gives $8.4\times10^{-12}$; leaving out $c$ gives $5.0\times10^{-2}$ T.
- id: phys-q-4905
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'You move three times farther from a small lamp that radiates equally in all directions. The peak electric field of its light at your position changes by a factor of'
  choices: ['1/9', '1/3', '$1/\sqrt3$', '1/27']
  answer: 1
  explanation: |-
    The intensity falls as $1/r^2$, to 1/9. Since $I \propto E_0^2$, the field amplitude falls as $1/r$, to 1/3. The factor 1/9 is the intensity, not the field; $1/\sqrt3$ takes a square root of the distance factor instead of the intensity factor; 1/27 uses an inverse cube.
- id: phys-q-4906
  lesson: phys-em-energy
  module_quiz: true
  topic: Energy in electromagnetic waves
  stem: 'Light of intensity 900 W/m² strikes a perfect mirror head-on. What radiation pressure does it exert? ($c = 3.00\times10^8$ m/s)'
  choices: ['$3.0\times10^{-6}$ Pa', '$1.5\times10^{-6}$ Pa', '$6.0\times10^{-6}$ Pa', '$2.7\times10^{11}$ Pa']
  answer: 2
  explanation: |-
    A reflected wave has its momentum reversed, so $P_{\text{rad}} = 2I/c = 2(900)/(3.00\times10^8) = 6.0\times10^{-6}$ Pa. $3.0\times10^{-6}$ Pa is the value for an absorbing surface; $1.5\times10^{-6}$ Pa halves it again; multiplying by $c$ instead of dividing gives the absurd $2.7\times10^{11}$ Pa.
- id: phys-q-4907
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'A 5.0 mW laser beam is completely absorbed by a small black target. What force does the light exert on it? ($c = 3.00\times10^8$ m/s)'
  choices: ['$1.7\times10^{-11}$ N', '$3.3\times10^{-11}$ N', '$1.7\times10^{-8}$ N', '$1.5\times10^{6}$ N']
  answer: 0
  explanation: |-
    For absorption, $F = \dfrac{IA}{c} = \dfrac Pc = \dfrac{5.0\times10^{-3}}{3.00\times10^8} = 1.7\times10^{-11}$ N. $3.3\times10^{-11}$ N would apply to a mirror; $1.7\times10^{-8}$ N forgets to convert milliwatts; $1.5\times10^6$ N multiplies by $c$.
- id: phys-q-4908
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'A beam has intensity 1500 W/m². What is the average electromagnetic energy density in the beam? ($c = 3.00\times10^8$ m/s)'
  choices: ['$4.5\times10^{11}$ J/m³', '$1.0\times10^{-5}$ J/m³', '$2.5\times10^{-6}$ J/m³', '$5.0\times10^{-6}$ J/m³']
  answer: 3
  explanation: |-
    Intensity is energy density times speed, $I = cu_{\text{avg}}$, so $u_{\text{avg}} = I/c = 1500/(3.00\times10^8) = 5.0\times10^{-6}$ J/m³. Multiplying by $c$ gives $4.5\times10^{11}$; $1.0\times10^{-5}$ and $2.5\times10^{-6}$ come from inserting a stray factor of 2 or $\tfrac12$ (the $\tfrac12$ is already inside $u_{\text{avg}} = \tfrac12\varepsilon_0E_0^2$).
- id: phys-q-4909
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'A wave has an rms electric field of 50 V/m. What is its intensity? ($c = 3.00\times10^8$ m/s, $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  choices: ['3.3 W/m²', '13 W/m²', '6.6 W/m²', '0.13 W/m²']
  answer: 2
  explanation: |-
    With rms fields there is no extra $\tfrac12$: $I = c\varepsilon_0E_{\text{rms}}^2 = (3.00\times10^8)(8.85\times10^{-12})(50)^2 = 6.6$ W/m². Applying the $\tfrac12$ meant for peak fields gives 3.3; taking the peak as $\sqrt2E_{\text{rms}}$ but then dropping the $\tfrac12$ gives 13; forgetting to square gives 0.13.
- id: phys-q-4910
  lesson: phys-em-energy
  module_quiz: true
  topic: Energy in electromagnetic waves
  stem: 'For a straight resistor wire carrying a steady current, which way does the Poynting vector point at the wire''s surface?'
  choices: ['Radially inward, into the wire', 'Along the wire, in the direction of the current', 'Radially outward, away from the wire', 'Around the wire, along the magnetic field']
  answer: 0
  explanation: |-
    $\vec E$ points along the wire (with the current) and $\vec B$ circles it, so $\vec E\times\vec B$ points radially inward. The inflow through the surface totals $VI$, exactly the power dissipated. Energy does not flow along the wire with the current, and $\vec S$ is always perpendicular to $\vec B$, so it cannot point along the field lines.
- id: phys-q-4911
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'A plane wave has intensity $I$. At the instant and place where its electric field is at its peak, the magnitude of the Poynting vector is'
  choices: ['$I$', '$I/2$', 'zero', '$2I$']
  answer: 3
  explanation: |-
    $S = c\varepsilon_0E^2$ swings between 0 and $c\varepsilon_0E_0^2$, and its average is half the peak: $I = \tfrac12c\varepsilon_0E_0^2$. So the peak value is $2I$. Equating the instantaneous peak with the average forgets that $\sin^2$ averages to $\tfrac12$; $S$ is zero where the fields pass through zero, not where they peak.
- id: phys-q-4912
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'Why are solar sails made as mirrors rather than black absorbers?'
  choices: ['A mirror absorbs more energy', 'Reflection reverses the light''s momentum, giving twice the push of absorption', 'Black surfaces get no push from light at all', 'Mirrors make the light travel faster']
  answer: 1
  explanation: |-
    Absorbed light gives up its momentum, a pressure of $I/c$; reflected light has its momentum reversed, a change twice as large, so the pressure is $2I/c$. A black surface still gets pushed, just half as hard, and a mirror absorbs less energy, not more. Reflection does not change the speed of light.
- id: phys-q-4201
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Thin lenses
  stem: 'An object is 60 cm from a converging lens of focal length 20 cm. Where is the image?'
  choices: ['15 cm, virtual', '40 cm, real', '80 cm, real', '30 cm on the far side, real']
  answer: 3
  explanation: |-
    $\dfrac1{d_i} = \dfrac1{20} - \dfrac1{60} = \dfrac{2}{60}$, so $d_i = +30$ cm: real, on the far side, inverted, half size ($m = -0.5$). Adding $1/60$ instead of subtracting it gives 15 cm.
- id: phys-q-4202
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'An object is 10 cm from a converging lens of focal length 15 cm. The image is'
  choices: ['real, inverted, 30 cm from the lens', 'virtual, upright, magnified 3 times', 'virtual, upright, reduced', 'real, upright, 6 cm away']
  answer: 1
  explanation: |-
    $\dfrac1{d_i} = \dfrac1{15} - \dfrac1{10} = -\dfrac1{30}$: $d_i = -30$ cm (virtual). $m = -(-30)/10 = +3$: upright and 3 times larger. Inside $f$, a converging lens is a magnifier.
- id: phys-q-4203
  lesson: phys-mirrors-lenses
  topic: Mirrors
  stem: 'A concave mirror has a radius of curvature of 20 cm. An object is 30 cm away. Where is the image?'
  choices: ['15 cm in front of the mirror, real', '12 cm behind the mirror', '60 cm in front of the mirror', '20 cm behind the mirror']
  answer: 0
  explanation: |-
    $f = R/2 = 10$ cm. $\dfrac1{d_i} = \dfrac1{10} - \dfrac1{30}$, so $d_i = 15$ cm, positive: real, in front of the mirror. Using $f = R = 20$ cm gives 60 cm.
- id: phys-q-4204
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Mirrors
  stem: 'A convex mirror always produces an image that is'
  choices: ['real and inverted', 'real and enlarged', 'virtual, upright and smaller', 'virtual and inverted']
  answer: 2
  explanation: |-
    With $f < 0$, the equation always gives $d_i < 0$ (virtual) and $0 < m < 1$ (upright, reduced). That's why convex mirrors give a wide field of view.
- id: phys-q-4205
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'An image has magnification $m = -2.0$. It is'
  choices: ['inverted and twice as large', 'upright and twice as large', 'inverted and half as large', 'upright and half as large']
  answer: 0
  explanation: |-
    A negative $m$ means inverted; $|m| = 2$ means twice the object's size.
- id: phys-q-4206
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'A diverging lens has focal length $-10$ cm. An object is 10 cm away. Where is the image?'
  choices: ['$d_i = -5.0$ cm, virtual', 'At infinity', '$d_i = +5.0$ cm, real', '$d_i = -20$ cm, virtual']
  answer: 0
  explanation: |-
    $\dfrac1{d_i} = -\dfrac1{10} - \dfrac1{10} = -\dfrac{2}{10}$, so $d_i = -5.0$ cm: virtual, upright, half size. Using $f = +10$ cm gives "at infinity".
- id: phys-q-4207
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'Where must an object be placed relative to a converging lens to form a real, enlarged image (as in a projector)?'
  choices: ['Inside $f$', 'Exactly at $f$', 'Beyond $2f$', 'Between $f$ and $2f$']
  answer: 3
  explanation: |-
    Between $f$ and $2f$ the image forms beyond $2f$ on the far side: real, inverted and enlarged. Beyond $2f$ it's reduced; inside $f$ it's virtual.
- id: phys-q-4208
  lesson: phys-mirrors-lenses
  module_quiz: true
  topic: Thin lenses
  stem: 'A nearsighted person''s eyeglass prescription is $-2.5$ diopters. What kind of lens and focal length is that?'
  choices: ['Converging, 2.5 m', 'Diverging, 0.40 m', 'Diverging, 2.5 m', 'Converging, 0.40 m']
  answer: 1
  explanation: |-
    $P = 1/f$: $f = 1/(-2.5) = -0.40$ m. Negative power means a diverging lens, which corrects nearsightedness. 2.5 m treats the power as if it were the focal length.
- id: phys-q-4209
  lesson: phys-mirrors-lenses
  topic: Mirrors
  stem: 'Your image in a flat bathroom mirror is'
  choices: ['real and the same size', 'virtual, upright, the same size, and as far behind the mirror as you are in front', 'virtual and half your size', 'real and inverted']
  answer: 1
  explanation: |-
    Rays only appear to come from behind a plane mirror (virtual); the image is upright, unmagnified, and $d_i = -d_o$.
- id: phys-q-4210
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'Two lenses are used in sequence; the first gives $m_1 = -4$ and the second $m_2 = -10$. The overall magnification is'
  choices: ['$-14$', '$+40$', '$-40$', '$+14$']
  answer: 1
  explanation: |-
    Magnifications multiply: $(-4)(-10) = +40$. The final image is upright relative to the object (inverted twice), as in some microscope arrangements.
- id: phys-q-4211
  lesson: phys-mirrors-lenses
  topic: Thin lenses
  stem: 'By the lensmaker''s equation, $1/f = (n - 1)(1/R_1 - 1/R_2)$, a lens immersed in water instead of air will have'
  choices: ['the same focal length', 'a shorter focal length', 'a longer focal length', 'no focal point']
  answer: 2
  explanation: |-
    In water, the relevant index is $n_{\text{lens}}/n_{\text{water}}$, closer to 1, so $(n - 1)$ shrinks and $f$ grows: the lens bends light less. That's why your vision is blurry underwater.
- id: phys-q-5001
  lesson: phys-optical-instruments
  module_quiz: true
  topic: Refraction at a curved surface
  stem: 'A glass rod ($n = 1.50$) in air has a convex end of radius 3.0 cm. An object is 12 cm in front of the end, on the axis. Where is the image?'
  choices: ['4.0 cm inside the rod', '18 cm inside the rod', '12 cm inside the rod', '6.0 cm in front of the rod']
  answer: 1
  explanation: |-
    $\dfrac{1.00}{12} + \dfrac{1.50}{d_i} = \dfrac{1.50 - 1.00}{3.0}$ gives $\dfrac{1.50}{d_i} = 0.0833$, so $d_i = 18$ cm (real, inside the glass). Using the lens equation with $f = R$ gives 4.0 cm; dropping the $n_2$ in front of $1/d_i$ gives 12 cm; taking $R$ negative even though the center of curvature is inside the glass gives a virtual image 6.0 cm in front.
- id: phys-q-5002
  lesson: phys-optical-instruments
  topic: Refraction at a curved surface
  stem: 'A fish swims 1.2 m below the flat surface of a lake ($n = 1.33$). Looking straight down from the air, how deep does it appear?'
  choices: ['0.90 m', '1.6 m', '1.2 m', '0.68 m']
  answer: 0
  explanation: |-
    For a flat surface $d_i = -\dfrac{n_2}{n_1}d_o = -\dfrac{1.00}{1.33}(1.2) = -0.90$ m: a virtual image 0.90 m deep. Multiplying by 1.33 instead of dividing gives 1.6 m (the fish would look deeper, but water makes things look shallower); 1.2 m ignores refraction; dividing by 1.33 twice gives 0.68 m.
- id: phys-q-5003
  lesson: phys-optical-instruments
  topic: Refraction at a curved surface
  stem: 'Light traveling inside a glass ball reaches the far side of the ball and leaves into the air. For this exit surface, what is the sign of $R$ in $\dfrac{n_1}{d_o} + \dfrac{n_2}{d_i} = \dfrac{n_2 - n_1}{R}$?'
  choices: ['Positive, because the surface is convex as seen from outside', 'Positive, because the light is leaving the glass', 'It depends on where the object is', 'Negative, because the center of curvature is on the incoming side']
  answer: 3
  explanation: |-
    The rule is about the center of curvature: $R > 0$ when it lies on the outgoing side. The ball's center is inside the glass, the side the light comes from, so $R < 0$ here. How the surface looks from outside, or whether the light is entering or leaving, is not the test, and $R$ is a property of the surface, not of the object position.
- id: phys-q-5004
  lesson: phys-optical-instruments
  topic: Refraction at a curved surface
  stem: 'A small fish is at the center of a spherical fishbowl of radius 15 cm filled with water ($n = 1.33$; ignore the thin glass). Seen from outside, where does it appear?'
  choices: ['At the center, at its true size', '11 cm behind the near wall, at its true size', 'At the center, enlarged about 1.33 times', 'Outside the bowl, inverted']
  answer: 2
  explanation: |-
    With $n_1 = 1.33$, $n_2 = 1.00$, $d_o = 15$ cm and $R = -15$ cm (center on the incoming side): $\dfrac{1.33}{15} + \dfrac{1.00}{d_i} = \dfrac{-0.33}{-15}$, so $d_i = -15$ cm, an image at the center. $m = -\dfrac{n_1d_i}{n_2d_o} = -\dfrac{1.33(-15)}{1.00(15)} = 1.33$. Rays from the center hit the surface along the normal and don't bend, so the position is unchanged, but the indices still enter the magnification. 11 cm is the flat-surface apparent depth, which doesn't apply to a curved wall.
- id: phys-q-5005
  lesson: phys-optical-instruments
  module_quiz: true
  topic: Optical instruments
  stem: 'A nearsighted person''s far point is 40 cm. What lens power (worn at the eye) lets them see distant objects clearly?'
  choices: ['$-2.5$ D', '$+2.5$ D', '$-0.025$ D', '$-1.5$ D']
  answer: 0
  explanation: |-
    The lens must make distant objects appear at the far point: $d_i = -0.40$ m, so $P = \dfrac1f = \dfrac{1}{-0.40} = -2.5$ D, a diverging lens. A positive power is the farsighted correction; $-0.025$ uses centimeters instead of meters; $-1.5$ D comes from $1/0.40 - 1/0.25$, wrongly bringing in the 25 cm normal near point, which plays no part in a far-point correction.
- id: phys-q-5006
  lesson: phys-optical-instruments
  topic: Optical instruments
  stem: 'A farsighted person''s near point is 75 cm. What lens power lets them read a book held 25 cm away?'
  choices: ['$-2.7$ D', '$+2.7$ D', '$+5.3$ D', '$+1.3$ D']
  answer: 1
  explanation: |-
    The book at $d_o = 0.25$ m must image at $d_i = -0.75$ m: $P = \dfrac{1}{0.25} + \dfrac{1}{-0.75} = 4.0 - 1.33 = +2.7$ D. A negative power would be a diverging lens; $+5.3$ D forgets that the virtual image distance is negative; $+1.3$ D uses only the near point.
- id: phys-q-5007
  lesson: phys-optical-instruments
  topic: Optical instruments
  stem: 'What is the angular magnification of a magnifying glass of focal length 4.0 cm when the image is at infinity (relaxed eye)?'
  choices: ['7.3', '0.16', '100', '6.3']
  answer: 3
  explanation: |-
    $M = \dfrac{25\text{ cm}}{f} = \dfrac{25}{4.0} = 6.3$. The value 7.3 is $1 + 25/f$, which applies when the image is placed at the near point instead. 0.16 inverts the ratio, and 100 multiplies instead of dividing.
- id: phys-q-5008
  lesson: phys-optical-instruments
  module_quiz: true
  topic: Optical instruments
  stem: 'A microscope''s objective forms an image with lateral magnification $-40$, and its eyepiece has focal length 2.0 cm. What is the overall magnification (final image at infinity)?'
  choices: ['$-52.5$', '$-20$', '$-500$', '$-3.2$']
  answer: 2
  explanation: |-
    The eyepiece gives $M_e = 25/2.0 = 12.5$, and the magnifications multiply: $M = (-40)(12.5) = -500$. Adding them gives $-52.5$; dividing $-40$ by the focal length gives $-20$; using $f_e/25$ for the eyepiece gives $-3.2$.
- id: phys-q-5009
  lesson: phys-optical-instruments
  module_quiz: true
  topic: Optical instruments
  stem: 'A refracting telescope has an objective of focal length 90 cm and an eyepiece of focal length 2.5 cm. What are its angular magnification and its length (lens separation)?'
  choices: ['$-36$ and 92.5 cm', '$-0.028$ and 92.5 cm', '$-36$ and 87.5 cm', '$-225$ and 92.5 cm']
  answer: 0
  explanation: |-
    $M = -f_o/f_e = -90/2.5 = -36$, and the lenses are $f_o + f_e = 92.5$ cm apart so that the objective's image falls at the eyepiece's focal point. $-0.028$ puts the short focal length on top; 87.5 cm subtracts the focal lengths; $-225$ multiplies them.
- id: phys-q-5010
  lesson: phys-optical-instruments
  topic: Optical instruments
  stem: 'Why do the largest research telescopes use mirrors rather than lenses as objectives?'
  choices: ['Mirrors magnify more for the same focal length', 'Mirrors make the image upright', 'Mirrors have shorter focal lengths', 'Mirrors have no dispersion and can be supported from behind, so they can be made very large']
  answer: 3
  explanation: |-
    A lens bends different colors by different amounts (dispersion) and can only be held at its edge, which limits its size. A mirror reflects all colors alike and can be supported across its whole back. Magnification depends on focal lengths, not on reflecting versus refracting, and mirror telescopes still give inverted images.
- id: phys-q-5011
  lesson: phys-optical-instruments
  topic: Optical instruments
  stem: 'What is the near point of an eye?'
  choices: ['The point on the retina where the image forms', 'The closest distance at which the eye can focus, about 25 cm for a young adult', 'The focal point of the cornea alone', 'The farthest distance at which the eye can focus']
  answer: 1
  explanation: |-
    The near point is the closest object distance the eye can bring into focus by accommodation; it moves farther away with age. The farthest such distance is the far point, infinite for a normal eye. The retina is where images form, not a point in front of the eye.
- id: phys-q-5012
  lesson: phys-optical-instruments
  topic: Refraction at a curved surface
  stem: 'An object is 10 cm in front of the convex end ($R = 2.0$ cm) of a glass rod with $n = 1.60$, in air. The image forms 8.0 cm inside the rod. What is the lateral magnification?'
  choices: ['$-0.80$', '$+0.50$', '$-0.50$', '$-1.28$']
  answer: 2
  explanation: |-
    For a single surface $m = -\dfrac{n_1d_i}{n_2d_o} = -\dfrac{(1.00)(8.0)}{(1.60)(10)} = -0.50$ (inverted, half size). Using the thin-lens form $-d_i/d_o$ gives $-0.80$; dropping the minus sign gives $+0.50$, though a real image here is inverted; swapping the two indices gives $-1.28$.
- id: phys-q-4301
  lesson: phys-wave-optics
  module_quiz: true
  topic: Interference
  stem: 'In a double-slit experiment, $\lambda = 500$ nm, $d = 0.50$ mm and the screen is 1.5 m away. What is the spacing between bright fringes?'
  choices: ['1.5 mm', '0.15 mm', '15 mm', '0.75 mm']
  answer: 0
  explanation: |-
    $\Delta y = \lambda L/d = (500\times10^{-9})(1.5)/(0.50\times10^{-3}) = 1.5\times10^{-3}$ m.
- id: phys-q-4302
  lesson: phys-wave-optics
  topic: Interference
  stem: 'If the slit spacing in a double-slit experiment is halved, the fringe spacing'
  choices: ['halves', 'doubles', 'quadruples', 'stays the same']
  answer: 1
  explanation: |-
    $\Delta y = \lambda L/d$, inversely proportional to $d$: closer slits spread the pattern out.
- id: phys-q-4303
  lesson: phys-wave-optics
  topic: Interference
  stem: 'Why don''t two ordinary light bulbs produce a visible interference pattern?'
  choices: ['Their light is too bright', 'Their light travels too fast', 'They are not coherent; their phase relationship changes randomly', 'Light from bulbs is longitudinal']
  answer: 2
  explanation: |-
    A stable pattern requires a constant phase difference. Independent sources emit with randomly varying phases, so any fringes wash out instantly.
- id: phys-q-4304
  lesson: phys-wave-optics
  module_quiz: true
  topic: Diffraction
  stem: 'A grating with 600 lines/mm is lit with 500 nm light. At what angle is the first-order maximum?'
  choices: ['$0.017^\circ$', '$30^\circ$', '$1.7^\circ$', '$17.5^\circ$']
  answer: 3
  explanation: |-
    $d = 1/600$ mm $= 1.67\times10^{-6}$ m; $\sin\theta = \lambda/d = 0.30$, so $\theta = 17.5^\circ$.
- id: phys-q-4305
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'In single-slit diffraction, the condition $a\sin\theta = m\lambda$ ($m = \pm1, \pm2, \ldots$) locates'
  choices: ['the dark fringes', 'the bright fringes', 'the central maximum', 'the edges of the slit''s shadow']
  answer: 0
  explanation: |-
    For a single slit this is the condition for minima. (For double slits and gratings, $d\sin\theta = m\lambda$ gives maxima: a common mix-up.)
- id: phys-q-4306
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'Light of wavelength 600 nm passes through a slit 0.10 mm wide. What is the angle of the first dark fringe?'
  choices: ['$0.17^\circ$', '$34^\circ$', '$0.34^\circ$', '$3.4^\circ$']
  answer: 2
  explanation: |-
    $\sin\theta = \lambda/a = 600\times10^{-9}/1.0\times10^{-4} = 0.0060$, so $\theta = 0.34^\circ$. The central bright band spans twice this.
- id: phys-q-4307
  lesson: phys-wave-optics
  module_quiz: true
  topic: Diffraction
  stem: 'Why can a larger telescope mirror resolve finer detail?'
  choices: ['It collects light faster', 'It magnifies more', 'Its diffraction limit $1.22\lambda/D$ is smaller', 'It has a shorter focal length']
  answer: 2
  explanation: |-
    Diffraction blurs point sources into disks of angular size about $1.22\lambda/D$. A larger aperture $D$ shrinks the blur, separating closer objects.
- id: phys-q-4308
  lesson: phys-wave-optics
  topic: Interference
  stem: 'A soap film ($n = 1.33$) in air strongly reflects 532 nm light. What is its minimum thickness?'
  choices: ['200 nm', '100 nm', '400 nm', '266 nm']
  answer: 1
  explanation: |-
    One reflection (top surface) flips phase, so constructive reflection needs $2nt = \tfrac12\lambda$: $t = 532/(4 \times 1.33) = 100$ nm. Ignoring the phase flip gives 200 nm.
- id: phys-q-4309
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'Compared with a double slit of the same spacing, a diffraction grating produces maxima that are'
  choices: ['at different angles and broader', 'evenly spread across the screen', 'at the same angles and equally broad', 'at the same angles but much sharper and brighter']
  answer: 3
  explanation: |-
    The maxima still satisfy $d\sin\theta = m\lambda$, but with $N$ slits their width shrinks as $1/N$ and peak intensity grows as $N^2$.
- id: phys-q-4310
  lesson: phys-wave-optics
  topic: Diffraction
  stem: 'A grating has $d = 2.0$ μm. For 700 nm light, what is the highest order maximum that can appear?'
  choices: ['1', '3', '2', '4']
  answer: 2
  explanation: |-
    $\sin\theta = m\lambda/d \le 1$ requires $m \le 2.0/0.70 = 2.86$, so $m = 2$. Rounding 2.86 up to 3 would need $\sin\theta = 1.05$, which is impossible.
- id: phys-q-4311
  lesson: phys-wave-optics
  topic: Interference
  stem: 'In the double-slit intensity formula $I = I_{\max}\cos^2(\pi d\sin\theta/\lambda)$, the first minimum occurs where'
  choices: ['$d\sin\theta = \lambda$', '$d\sin\theta = 0$', '$d\sin\theta = 2\lambda$', '$d\sin\theta = \lambda/2$']
  answer: 3
  explanation: |-
    $\cos^2$ first vanishes when its argument is $\pi/2$: $\pi d\sin\theta/\lambda = \pi/2$, so the path difference is half a wavelength.
