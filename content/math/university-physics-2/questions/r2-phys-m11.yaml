# Round 2 questions for phys-m11 (Light and optics): new question types for the core lessons
# (phys-m11-r2-q..) and the three honors lessons (phys-m11-r2-h..).

# ---------- phys-light ----------
- id: phys-m11-r2-q01
  lesson: phys-light
  type: label
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'Name the numbered parts of this snapshot of an electromagnetic wave.'
  image: {src: images/phys-m11-em-wave-blank.svg, alt: 'An electromagnetic wave with two perpendicular oscillating fields drawn along a horizontal axis, with four numbered markers'}
  labels:
    - {x: 18.6, y: 33.3, text: Electric field}
    - {x: 12.6, y: 61.0, text: Magnetic field}
    - {x: 91.7, y: 56.4, text: Direction of travel}
    - {x: 34.7, y: 17.1, text: Wavelength}
  distractors: [Polarizer axis, Normal]
  explanation: |-
    The electric field oscillates in one plane (here vertical) and the magnetic field in the perpendicular plane (drawn in perspective), in phase, with $E = cB$. Both are perpendicular to the direction of travel, which is the direction of $\vec E\times\vec B$. One wavelength is the distance between neighboring crests.
- id: phys-m11-r2-q02
  lesson: phys-light
  type: order
  topic: Reflection and refraction
  stem: 'Put these materials in order from the slowest speed of light to the fastest.'
  items: ['Diamond ($n = 2.42$)', 'Crown glass ($n = 1.52$)', 'Water ($n = 1.33$)', 'Air ($n = 1.0003$)']
  explanation: |-
    The speed in a material is $v = c/n$, so the largest index means the slowest light: diamond ($1.24\times10^8$ m/s), glass ($1.97\times10^8$ m/s), water ($2.26\times10^8$ m/s), then air (almost exactly $c$).
- id: phys-m11-r2-q03
  lesson: phys-light
  topic: Reflection and refraction
  stem: 'In which of these situations is the light totally internally reflected? Select all that apply.'
  choices: ['Light in glass ($n = 1.52$) hits a glass–air surface at $50^\circ$ from the normal', 'Light in water hits the water–air surface at $60^\circ$ from the normal', 'Light in air hits a glass surface at $80^\circ$ from the normal', 'Light in glass ($n = 1.52$) hits a glass–water surface at $70^\circ$ from the normal']
  answer: [0, 1, 3]
  explanation: |-
    Total internal reflection needs light heading into a lower index at more than the critical angle. Glass to air: $\theta_c = 41.1^\circ$, and $50^\circ$ is larger. Water to air: $\theta_c = 48.8^\circ$, and $60^\circ$ is larger. Glass to water: $\theta_c = \sin^{-1}(1.33/1.52) = 61.0^\circ$, and $70^\circ$ is larger. Light going from air into glass is entering a higher index, so some of it always refracts in, however steep the angle.
- id: phys-m11-r2-q04
  lesson: phys-light
  type: text
  topic: Reflection and refraction
  stem: 'Light travels at $2.00\times10^8$ m/s in a certain plastic. The plastic''s index of refraction is ___. (Use $c = 3.00\times10^8$ m/s and give only the number.)'
  accept: ['1.5', '1.50']
  explanation: |-
    $n = c/v = (3.00\times10^8)/(2.00\times10^8) = 1.50$. Dividing the other way gives 0.667, which can't be right: light is slower in the plastic than in vacuum, so $n$ must be more than 1.
- id: phys-m11-r2-q05
  lesson: phys-light
  type: match
  module_quiz: true
  topic: Electromagnetic waves
  stem: 'Match each of Maxwell''s equations to what it says.'
  pairs:
    - ['$\oint\vec E\cdot d\vec A = Q_{\text{enc}}/\varepsilon_0$', Electric charges are sources of electric field]
    - ['$\oint\vec B\cdot d\vec A = 0$', There are no magnetic monopoles]
    - ['$\oint\vec E\cdot d\vec\ell = -d\Phi_B/dt$', A changing magnetic field makes an electric field]
    - ['$\oint\vec B\cdot d\vec\ell = \mu_0I_{\text{enc}} + \mu_0\varepsilon_0\,d\Phi_E/dt$', Currents and changing electric fields make magnetic fields]
  distractors: [Light always takes the shortest path]
  explanation: |-
    These are Gauss's law, Gauss's law for magnetism, Faraday's law and the Ampère–Maxwell law. The last two together let changing fields sustain each other as a wave. Fermat's principle is about light's travel time (strictly, a stationary time), and it is not one of Maxwell's equations.

# ---------- phys-em-energy ----------
- id: phys-m11-r2-q06
  lesson: phys-em-energy
  type: text
  topic: Energy in electromagnetic waves
  stem: 'Sunlight with intensity 1360 W/m² falls on a surface that absorbs it completely. The radiation pressure is ___ μPa. (Use $c = 3.00\times10^8$ m/s; give only the number, to 2 significant figures.)'
  accept: ['4.5', '4.53', '4.533']
  explanation: |-
    For an absorbing surface $P_{\text{rad}} = I/c = 1360/(3.00\times10^8) = 4.5\times10^{-6}$ Pa $= 4.5$ μPa. A mirror would feel twice as much, 9.1 μPa.
- id: phys-m11-r2-q07
  lesson: phys-em-energy
  type: match
  module_quiz: true
  topic: Energy in electromagnetic waves
  stem: 'Match each expression to the quantity it gives.'
  pairs:
    - ['$\tfrac12\varepsilon_0E^2$', Energy density in the electric field]
    - ['$B^2/(2\mu_0)$', Energy density in the magnetic field]
    - ['$\vec E\times\vec B/\mu_0$', Energy flow per area per time]
    - ['$P/(4\pi r^2)$', Intensity at distance r from a point source]
    - ['$2I/c$', Pressure on a reflecting surface]
  distractors: [Pressure on an absorbing surface]
  explanation: |-
    The two energy densities are equal in a wave. $\vec S = \vec E\times\vec B/\mu_0$ is the Poynting vector. $P/(4\pi r^2)$ spreads a source's power over a sphere. Reflection reverses the light's momentum, giving $2I/c$; an absorbing surface feels only $I/c$, which isn't in the list.
- id: phys-m11-r2-q08
  lesson: phys-em-energy
  topic: Energy in electromagnetic waves
  stem: 'You move twice as far from a small lamp that radiates equally in all directions. Which statements are true? Select all that apply.'
  choices: ['The intensity falls to one quarter', 'The peak electric field falls to one half', 'The peak magnetic field falls to one quarter', 'The radiation pressure on a black card falls to one quarter']
  answer: [0, 1, 3]
  explanation: |-
    $I = P/(4\pi r^2)$, so doubling $r$ quarters $I$, and with it the pressure $I/c$. The fields go as $\sqrt I$, so both $E_0$ and $B_0 = E_0/c$ fall to one half, not one quarter.
- id: phys-m11-r2-q09
  lesson: phys-em-energy
  type: order
  topic: Energy in electromagnetic waves
  stem: 'A radio tower radiates power $P$ equally in all directions. Put the steps for finding the peak magnetic field at distance $r$ in order.'
  items: ['Find the intensity $I = P/(4\pi r^2)$', 'Find the peak electric field $E_0 = \sqrt{2I/(c\varepsilon_0)}$', 'Find the peak magnetic field $B_0 = E_0/c$']
  explanation: |-
    Each step needs the result of the one before: the intensity comes from spreading the power over a sphere, $E_0$ from $I = \tfrac12c\varepsilon_0E_0^2$, and $B_0$ from $E_0 = cB_0$.
- id: phys-m11-r2-q10
  lesson: phys-em-energy
  type: text
  topic: Energy in electromagnetic waves
  stem: 'In an electromagnetic wave in vacuum, the fraction of the energy carried by the magnetic field is ___. (Give a fraction or a decimal.)'
  accept: ['1/2', half, one half, one-half, a half]
  explanation: |-
    With $B = E/c$ and $c^2 = 1/(\mu_0\varepsilon_0)$, $B^2/(2\mu_0) = \tfrac12\varepsilon_0E^2$: the magnetic energy density equals the electric one, so each field carries half, even though $B$ looks tiny in teslas.

# ---------- phys-mirrors-lenses ----------
- id: phys-m11-r2-q11
  lesson: phys-mirrors-lenses
  type: label
  module_quiz: true
  topic: Mirrors
  stem: 'This ray diagram shows a concave mirror forming an image. Name the numbered parts.'
  image: {src: images/phys-m11-concave-mirror-blank.svg, alt: 'A concave mirror on the right with a dashed axis, an upright arrow, an inverted arrow, two points on the axis and two rays, with five numbered markers'}
  labels:
    - {x: 20.0, y: 41.7, text: Object}
    - {x: 56.8, y: 57.2, text: Real image}
    - {x: 63.9, y: 48.1, text: Focal point}
    - {x: 43.1, y: 48.1, text: Center of curvature}
    - {x: 34.7, y: 52.4, text: Principal axis}
  distractors: [Virtual image, Near point]
  explanation: |-
    The ray parallel to the axis reflects through the focal point F, halfway between the mirror and the center of curvature C ($f = R/2$). The ray through F reflects parallel. The reflected rays really cross, so the image is real; with the object beyond C it is inverted, smaller and between C and F.
- id: phys-m11-r2-q12
  lesson: phys-mirrors-lenses
  type: order
  topic: Thin lenses
  stem: 'A converging lens has $f = 10$ cm. Order these object distances from the one that gives the largest image (in size) to the one that gives the smallest.'
  items: ['$d_o = 9$ cm', '$d_o = 12$ cm', '$d_o = 5$ cm', '$d_o = 25$ cm']
  explanation: |-
    Use $d_i = (1/f - 1/d_o)^{-1}$ and $|m| = |d_i/d_o|$. At 9 cm: $d_i = -90$ cm, $|m| = 10$. At 12 cm: $d_i = 60$ cm, $|m| = 5$. At 5 cm: $d_i = -10$ cm, $|m| = 2$. At 25 cm: $d_i = 16.7$ cm, $|m| = 0.67$. Objects just inside or just outside $f$ give the biggest images.
- id: phys-m11-r2-q13
  lesson: phys-mirrors-lenses
  type: match
  module_quiz: true
  topic: Thin lenses
  stem: 'Match each situation to the image it produces.'
  pairs:
    - [Converging lens with the object beyond 2f, 'Real, inverted, smaller']
    - [Converging lens with the object between f and 2f, 'Real, inverted, larger']
    - [Converging lens with the object inside f, 'Virtual, upright, larger']
    - [Convex mirror at any object distance, 'Virtual, upright, smaller']
  distractors: ['Virtual, inverted, larger']
  explanation: |-
    For converging optics the image is real and inverted whenever the object is beyond $f$, smaller beyond $2f$ and larger between $f$ and $2f$; inside $f$ it is virtual, upright and enlarged (a magnifier). Diverging optics always give virtual, upright, reduced images. A single lens or mirror never makes a virtual inverted image of a real object.
- id: phys-m11-r2-q14
  lesson: phys-mirrors-lenses
  topic: Mirrors
  stem: 'Which of these can form a real image of a real object? Select all that apply.'
  choices: ['A concave mirror', 'A converging lens', 'A convex mirror', 'A plane mirror', 'A diverging lens']
  answer: [0, 1]
  explanation: |-
    Only converging optics ($f > 0$) can make rays from a real object actually meet, and only when the object is beyond $f$. Convex mirrors, plane mirrors and diverging lenses always make virtual images that light only appears to come from.
- id: phys-m11-r2-q15
  lesson: phys-mirrors-lenses
  type: text
  topic: Mirrors
  stem: 'A concave mirror has a radius of curvature of 40 cm. An object stands 30 cm in front of it. The image is ___ cm in front of the mirror. (Give only the number.)'
  accept: ['60']
  explanation: |-
    $f = R/2 = 20$ cm. $\dfrac{1}{d_i} = \dfrac{1}{20} - \dfrac{1}{30} = \dfrac{1}{60}$, so $d_i = 60$ cm: a real image (the object is between $f$ and $2f$), inverted and twice as tall. Using $f = R = 40$ cm would give 120 cm.

# ---------- phys-optical-instruments ----------
- id: phys-m11-r2-q16
  lesson: phys-optical-instruments
  type: label
  module_quiz: true
  topic: Optical instruments
  stem: 'Name the numbered parts of the eye.'
  image: {src: images/phys-m11-eye-blank.svg, alt: 'Cross-section of an eye with light entering from the left and focusing at the back, with four numbered markers'}
  labels:
    - {x: 34.2, y: 43.2, text: Cornea}
    - {x: 42.4, y: 35.8, text: Iris}
    - {x: 46.5, y: 56.2, text: Lens}
    - {x: 70.0, y: 27.2, text: Retina}
  distractors: [Optic nerve, Eyepiece]
  explanation: |-
    Light enters through the curved cornea, which does most of the focusing, passes through the pupil in the iris, is fine-tuned by the lens (which changes shape to accommodate) and forms an image on the retina at the back. The optic nerve leaves the back of the eye and has no marker here; an eyepiece is part of a microscope or telescope.
- id: phys-m11-r2-q17
  lesson: phys-optical-instruments
  type: order
  module_quiz: true
  topic: Optical instruments
  stem: 'Put these in the order light meets them in a compound microscope.'
  items: [Specimen, Objective lens, Enlarged real image, Eyepiece, Observer's eye]
  explanation: |-
    Light from the specimen passes through the short-focal-length objective, which forms an enlarged real image inside the tube. The eyepiece acts as a magnifying glass on that image, and the eye views the result. The total magnification is the product $m_oM_e$.
- id: phys-m11-r2-q18
  lesson: phys-optical-instruments
  type: match
  topic: Optical instruments
  stem: 'Match each formula to the device it describes.'
  pairs:
    - ['$M = (25\text{ cm})/f$', Magnifying glass]
    - ['$M = -f_o/f_e$', Refracting telescope]
    - ['$M = m_oM_e$', Compound microscope]
    - ['$P = -1/(\text{far-point distance})$', Lens for a nearsighted eye]
  distractors: [Lens for a farsighted eye]
  explanation: |-
    A magnifier compares the angle $h/f$ with $h/(25\text{ cm})$. A telescope's magnification is the ratio of focal lengths, long over short. A microscope multiplies the objective's lateral magnification by the eyepiece's angular magnification. A nearsighted eye's lens images distant objects at the far point, so $f = -$(far-point distance). A farsighted eye needs a converging lens with positive power.
- id: phys-m11-r2-q19
  lesson: phys-optical-instruments
  topic: Optical instruments
  stem: 'Which statements about a simple refracting telescope (two converging lenses) are true? Select all that apply.'
  choices: ['Its angular magnification is $f_o/f_e$ in size', 'Its lenses are about $f_o + f_e$ apart', 'Its objective has the shorter focal length', 'It produces an inverted image']
  answer: [0, 1, 3]
  explanation: |-
    The objective forms a real image at its focal point, and the eyepiece is placed one eyepiece focal length beyond it, so the lenses are $f_o + f_e$ apart and $M = -f_o/f_e$. The minus sign means the view is inverted. The objective has the long focal length; a short one would give magnification less than 1.
- id: phys-m11-r2-q20
  lesson: phys-optical-instruments
  type: text
  topic: Optical instruments
  stem: 'A magnifying glass has a focal length of 4.0 cm. With the image at infinity and a 25 cm near point, its angular magnification is ___. (Give only the number.)'
  accept: ['6.25', '6.3']
  explanation: |-
    $M = N/f = 25/4.0 = 6.25$. (With the image at the near point instead, $1 + N/f = 7.25$.)

# ---------- phys-wave-optics ----------
- id: phys-m11-r2-q21
  lesson: phys-wave-optics
  type: label
  module_quiz: true
  topic: Interference
  stem: 'Name the numbered parts of this double-slit setup.'
  image: {src: images/phys-m11-double-slit-blank.svg, alt: 'A double-slit experiment seen from above, with a source on the left, a barrier, two rays to a screen on the right and a highlighted short segment near the barrier, with five numbered markers'}
  labels:
    - {x: 34.7, y: 76.2, text: Double slit}
    - {x: 89.9, y: 78.6, text: Screen}
    - {x: 37.4, y: 58.3, text: Path difference}
    - {x: 86.7, y: 47.6, text: Central bright fringe}
    - {x: 10.4, y: 47.6, text: Light source}
  distractors: [First dark fringe, Diffraction grating]
  explanation: |-
    A coherent source (here a laser) lights two slits. The extra distance the lower ray travels to point P is the path difference $d\sin\theta$, marked near the slits. On the center line both paths are equal, so the central fringe is bright.
- id: phys-m11-r2-q22
  lesson: phys-wave-optics
  type: match
  module_quiz: true
  topic: Diffraction
  stem: 'Match each condition to what it locates.'
  pairs:
    - ['$d\sin\theta = m\lambda$', Bright fringes from two slits or a grating]
    - ['$a\sin\theta = m\lambda$', Dark fringes from a single slit]
    - ['$\theta_{\min} = 1.22\lambda/D$', Resolution limit of a circular aperture]
    - ['$2nt = (m + \tfrac12)\lambda$', Bright reflection from a soap film in air]
  distractors: [Dark fringes from two slits]
  explanation: |-
    The same form $x\sin\theta = m\lambda$ means bright fringes for slits a distance $d$ apart but dark fringes across a single slit of width $a$. Two-slit dark fringes are at $d\sin\theta = (m + \tfrac12)\lambda$, which isn't listed. A soap film in air has one phase flip, so its bright reflection needs the extra half wavelength.
- id: phys-m11-r2-q23
  lesson: phys-wave-optics
  topic: Interference
  stem: 'Which changes spread double-slit fringes farther apart on the screen? Select all that apply.'
  choices: ['Using a longer wavelength', 'Moving the screen farther from the slits', 'Moving the slits farther apart', 'Switching from red light to blue light']
  answer: [0, 1]
  explanation: |-
    The spacing is $\Delta y = \lambda L/d$. Longer $\lambda$ or larger $L$ spreads the fringes; larger $d$ squeezes them together, and blue light has a shorter wavelength than red.
- id: phys-m11-r2-q24
  lesson: phys-wave-optics
  type: text
  topic: Interference
  stem: 'Light of wavelength 600 nm passes through two slits 0.30 mm apart onto a screen 1.5 m away. The bright fringes are ___ mm apart. (Give only the number.)'
  accept: ['3', '3.0']
  explanation: |-
    $\Delta y = \dfrac{\lambda L}{d} = \dfrac{(600\times10^{-9})(1.5)}{0.30\times10^{-3}} = 3.0\times10^{-3}$ m $= 3.0$ mm.
- id: phys-m11-r2-q25
  lesson: phys-wave-optics
  type: order
  topic: Diffraction
  stem: 'Light falls on one grating. Order these maxima by angle from the grating normal, smallest first.'
  items: ['First order, 700 nm', 'Second order, 400 nm', 'Second order, 500 nm', 'Third order, 400 nm']
  explanation: |-
    $\sin\theta = m\lambda/d$, so the angle grows with the product $m\lambda$: 700 nm, 800 nm, 1000 nm and 1200 nm. A short wavelength in a high order can land farther out than a long wavelength in first order.

# ---------- phys-h-interferometers ----------
- id: phys-m11-r2-h01
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'One mirror of a Michelson interferometer lit with 500 nm light moves 0.10 mm. How many fringes pass the center of the pattern?'
  choices: ['400', '200', '800', '0.40']
  answer: 0
  explanation: |-
    The path changes by $2\Delta d = 0.20$ mm, so $N = 2\Delta d/\lambda = (2.0\times10^{-4})/(5.00\times10^{-7}) = 400$. Forgetting the round trip gives 200; counting a fringe per quarter wavelength gives 800; reading 0.10 mm as 0.10 μm gives 0.40.
- id: phys-m11-r2-h02
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'Moving a Michelson mirror 0.150 mm makes 500 fringes pass. What is the wavelength?'
  choices: ['300 nm', '600 nm', '1200 nm', '0.60 nm']
  answer: 1
  explanation: |-
    $\lambda = 2\Delta d/N = 2(1.50\times10^{-4}\text{ m})/500 = 6.00\times10^{-7}$ m $= 600$ nm. Leaving out the 2 gives 300 nm; using $4\Delta d$ gives 1200 nm; 0.60 nm comes from treating 0.150 mm as 0.150 μm.
- id: phys-m11-r2-h03
  lesson: phys-h-interferometers
  type: text
  topic: Interferometry
  stem: 'In a Michelson interferometer, each fringe that passes corresponds to moving the mirror by ___ of a wavelength. (Give a fraction or a decimal.)'
  accept: ['1/2', half, one half, one-half, a half]
  explanation: |-
    The light crosses the arm twice, so moving the mirror $\lambda/2$ changes the path by a full $\lambda$: one dark-bright cycle.
- id: phys-m11-r2-h04
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'A 3.00 cm cell in one arm of a Michelson interferometer is evacuated and then filled with a gas of index $n = 1.00030$. With 600 nm light, how many fringes pass?'
  choices: ['15', '60', '30', 'About 100 000']
  answer: 2
  explanation: |-
    $N = \dfrac{2L(n - 1)}{\lambda} = \dfrac{2(0.0300)(3.0\times10^{-4})}{6.00\times10^{-7}} = 30$. Leaving out the round trip gives 15. Using $n$ instead of $n - 1$ gives about 100 000, the number of wavelengths in the whole round trip, not the change.
- id: phys-m11-r2-h05
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'A glass plate 10.0 μm thick with $n = 1.50$ is slipped into one arm of a Michelson interferometer lit with 500 nm light. How many fringes does the pattern shift?'
  choices: ['10', '40', '60', '20']
  answer: 3
  explanation: |-
    The plate replaces 10.0 μm of air with glass, crossed twice: the optical path grows by $2t(n - 1) = 2(10.0\,\mu\text{m})(0.50) = 10.0$ μm, which is $10.0/0.500 = 20$ wavelengths. One pass gives 10; ignoring the index ($2t/\lambda$) gives 40; using $n$ instead of $n - 1$ gives 60.
- id: phys-m11-r2-h06
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'Two flat glass plates touch along one edge, with a thin wedge of air between them. Viewed in reflected light, the line where they touch is'
  choices: ['dark, because only one of the two reflections is phase-flipped', 'bright, because the air gap is zero there', 'dark, because no light reaches the contact line', 'bright, because both reflections are phase-flipped']
  answer: 0
  explanation: |-
    At the contact line the path difference is zero, but the reflection from the air–glass surface below the gap is flipped by half a wavelength and the one from the glass–air surface above it is not. The two reflections cancel, so the contact line is dark.
- id: phys-m11-r2-h07
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'Two glass plates 10.0 cm long touch at one end and are held apart by a 30.0 μm fiber at the other. In 600 nm light, how far apart are the dark fringes?'
  choices: ['0.50 mm', '1.0 mm', '2.0 mm', '0.10 mm']
  answer: 1
  explanation: |-
    $\Delta x = \dfrac{\lambda L}{2D} = \dfrac{(600\times10^{-9})(0.100)}{2(30.0\times10^{-6})} = 1.0\times10^{-3}$ m. Leaving out the 2 (forgetting that light crosses the gap twice) gives 2.0 mm.
- id: phys-m11-r2-h08
  lesson: phys-h-interferometers
  type: text
  topic: Interferometry
  stem: 'A lens surface with radius of curvature 1.50 m rests on flat glass and is lit with 600 nm light. The dark Newton''s ring with $m = 4$ (the center is $m = 0$) has radius ___ mm. (Give only the number, to 2 significant figures.)'
  accept: ['1.9']
  explanation: |-
    $r_m = \sqrt{m\lambda R} = \sqrt{4(600\times10^{-9})(1.50)} = 1.9\times10^{-3}$ m $= 1.9$ mm.
- id: phys-m11-r2-h09
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'Which of these change the optical path length in one arm of a Michelson interferometer, and so shift the fringes? Select all that apply.'
  choices: ['Moving that arm''s mirror', 'Letting gas into an evacuated cell in that arm', 'Putting a thin glass plate into that arm', 'Making the light source brighter']
  answer: [0, 1, 2]
  explanation: |-
    Optical path length is geometric length times index, $nL$. Moving the mirror changes $L$; gas and glass change $n$ along part of the path. Brightness changes how vivid the fringes are, not where they are.
- id: phys-m11-r2-h10
  lesson: phys-h-interferometers
  type: order
  topic: Interferometry
  stem: 'Follow the beam that goes down the movable arm of a Michelson interferometer. Put what it meets in order.'
  items: [Light source, Beam splitter (first pass), Movable mirror, Beam splitter (second pass), Detector]
  explanation: |-
    The splitter divides the source's light; this half travels to the movable mirror and back, meets the splitter again, and goes on to the detector together with the beam from the fixed arm, where the two interfere.
- id: phys-m11-r2-h11
  lesson: phys-h-interferometers
  type: label
  topic: Interferometry
  stem: 'Name the numbered parts of this Michelson interferometer.'
  image: {src: images/phys-m11-michelson-blank.svg, alt: 'A Michelson interferometer seen from above, with a tilted plate at the center, two mirrors, a source and a detector, with five numbered markers'}
  labels:
    - {x: 9.7, y: 56.8, text: Light source}
    - {x: 43.3, y: 60.5, text: Beam splitter}
    - {x: 45.8, y: 13.9, text: Fixed mirror}
    - {x: 84.9, y: 65.9, text: Movable mirror}
    - {x: 45.8, y: 88.2, text: Detector}
  distractors: [Compensator plate, Diffraction grating]
  explanation: |-
    The tilted, partly silvered plate splits and later recombines the beams. The mirror with the double arrow slides along its arm; the other is fixed. The recombined beams travel to the detector. This drawing has no compensator plate, and an interferometer uses no grating.
- id: phys-m11-r2-h12
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'In a Michelson interferometer lit with white light, fringes appear only when the two arms are equal to within about a micrometer. Why?'
  choices: ['White light is unpolarized, and polarized light is needed for fringes', 'White light''s wide spread of wavelengths gives a coherence length of only about 1 μm', 'White light is too dim to show fringes at larger path differences', 'The beam splitter reflects only one color']
  answer: 1
  explanation: |-
    Each wavelength makes its own fringes. With $\Delta\lambda \approx 300$ nm around 550 nm, the patterns drift out of step after a path difference of about $\lambda^2/\Delta\lambda \approx 1$ μm and wash out. Polarization and brightness don't set this limit.
- id: phys-m11-r2-h13
  lesson: phys-h-interferometers
  topic: Interferometry
  stem: 'A gravitational wave produces a strain of $1.0\times10^{-21}$ in one of LIGO''s 4.0 km arms. By about how much does the arm''s length change?'
  choices: ['$4.0\times10^{-21}$ m', '$2.5\times10^{-25}$ m', '$4.0\times10^{-18}$ m', '$4.0\times10^{-24}$ m']
  answer: 2
  explanation: |-
    $\Delta L = hL = (1.0\times10^{-21})(4000\text{ m}) = 4.0\times10^{-18}$ m, a few thousandths of a proton's diameter. $4.0\times10^{-21}$ m uses 4.0 instead of 4000 m; $4.0\times10^{-24}$ m treats the arm as 4.0 mm; $2.5\times10^{-25}$ m divides by the length.
- id: phys-m11-r2-h14
  lesson: phys-h-interferometers
  type: match
  topic: Interferometry
  stem: 'Match each item to what it showed or was used for.'
  pairs:
    - [Michelson–Morley experiment (1887), No sign of Earth's motion through an ether]
    - [LIGO (2015), First direct detection of gravitational waves]
    - [Krypton-86 standard (1960–1983), The meter defined as a count of wavelengths]
    - [Newton's rings, Testing the shape of a lens surface]
  distractors: [Measuring the speed of sound in air]
  explanation: |-
    Michelson and Morley expected a fringe shift from Earth's motion and saw none. LIGO recorded merging black holes on 14 September 2015. From 1960 to 1983 the meter was a fixed number of wavelengths of a krypton-86 line. Distorted Newton's rings reveal a distorted lens surface.

# ---------- phys-h-gratings-xray ----------
- id: phys-m11-r2-h15
  lesson: phys-h-gratings-xray
  topic: Grating spectroscopy
  stem: 'To separate lines at 600.0 nm and 600.3 nm in second order, at least how many grating lines must be illuminated?'
  choices: ['500', '2000', '4000', '1000']
  answer: 3
  explanation: |-
    $R = \lambda/\Delta\lambda = 600.15/0.3 \approx 2000$, and $R = Nm$, so in second order $N = 2000/2 = 1000$. 2000 is the first-order requirement; 4000 multiplies by the order instead of dividing.
- id: phys-m11-r2-h16
  lesson: phys-h-gratings-xray
  topic: Grating spectroscopy
  stem: 'A beam 5.0 cm wide lights a grating with 400 lines/mm. What is the resolving power in third order?'
  choices: ['60 000', '20 000', '1200', '6700']
  answer: 0
  explanation: |-
    $N = (400\text{ mm}^{-1})(50\text{ mm}) = 20\,000$ lines, so $R = Nm = 60\,000$. Forgetting the order gives 20 000; 1200 multiplies lines per millimeter by the order; 6700 divides by the order.
- id: phys-m11-r2-h17
  lesson: phys-h-gratings-xray
  type: text
  topic: Grating spectroscopy
  stem: 'A grating''s resolving power depends only on the number of lines illuminated and the ___ being used.'
  accept: [order, orders, diffraction order, order m, m]
  explanation: |-
    $R = \lambda/\Delta\lambda = Nm$: the number of lines lit times the order. The line spacing affects how far the spectrum spreads (dispersion), not how sharp the lines are relative to that spread.
- id: phys-m11-r2-h18
  lesson: phys-h-gratings-xray
  topic: Grating spectroscopy
  stem: 'A grating with 500 lines/mm is used in first order at 500 nm. What is its angular dispersion?'
  choices: ['$5.0\times10^{-4}$ rad/nm', '$5.2\times10^{-4}$ rad/nm', '$1.2\times10^{-3}$ rad/nm', '$2.6\times10^{-4}$ rad/nm']
  answer: 1
  explanation: |-
    $d = 2.00$ μm and $\sin\theta = 0.500/2.00 = 0.250$, so $\cos\theta = 0.968$. $d\theta/d\lambda = m/(d\cos\theta) = 1/(2000\text{ nm} \times 0.968) = 5.2\times10^{-4}$ rad/nm. Leaving out $\cos\theta$ gives $5.0\times10^{-4}$; using $2d$ in place of $d$ gives $2.6\times10^{-4}$; $1.2\times10^{-3}$ is the second-order value at this wavelength.
- id: phys-m11-r2-h19
  lesson: phys-h-gratings-xray
  topic: Grating spectroscopy
  stem: 'In a grating spectrum, which wavelength in third order lands at the same angle as 600 nm in second order?'
  choices: ['900 nm', '300 nm', '400 nm', '450 nm']
  answer: 2
  explanation: |-
    Same angle means the same $m\lambda$: $3\lambda' = 2(600)$, so $\lambda' = 400$ nm. 900 nm inverts the ratio.
- id: phys-m11-r2-h20
  lesson: phys-h-gratings-xray
  topic: Grating spectroscopy
  stem: 'Which changes would let a grating spectrometer resolve two wavelengths that are closer together? Select all that apply.'
  choices: ['Lighting more of the grating''s lines', 'Working in a higher order', 'Using a brighter lamp', 'Moving the detector closer to the grating']
  answer: [0, 1]
  explanation: |-
    The smallest resolvable $\Delta\lambda$ is $\lambda/(Nm)$, so more lines or a higher order helps. Brightness and detector distance don't change the angular width of the lines relative to their separation.
- id: phys-m11-r2-h21
  lesson: phys-h-gratings-xray
  topic: X-ray diffraction
  stem: 'X-rays of wavelength 0.100 nm reflect from crystal planes 0.250 nm apart. What is the first-order Bragg angle?'
  choices: ['$23.6^\circ$', '$78.5^\circ$', '$23.1^\circ$', '$11.5^\circ$']
  answer: 3
  explanation: |-
    $\sin\theta = \lambda/(2d) = 0.100/0.500 = 0.200$, so $\theta = 11.5^\circ$ from the planes. Dropping the 2 gives $23.6^\circ$; $78.5^\circ$ is the angle from the normal; $23.1^\circ$ is the total deflection $2\theta$.
- id: phys-m11-r2-h22
  lesson: phys-h-gratings-xray
  topic: X-ray diffraction
  stem: 'A sodium chloride crystal (plane spacing 0.282 nm) gives a first-order Bragg peak at $\theta = 12.0^\circ$. What is the X-ray wavelength?'
  choices: ['0.117 nm', '0.0586 nm', '0.552 nm', '0.234 nm']
  answer: 0
  explanation: |-
    $\lambda = 2d\sin\theta = 2(0.282)\sin 12.0^\circ = 0.117$ nm. Dropping the 2 gives 0.0586 nm; using cosine gives 0.552 nm; doubling the answer gives 0.234 nm.
- id: phys-m11-r2-h23
  lesson: phys-h-gratings-xray
  type: text
  topic: X-ray diffraction
  stem: 'In Bragg''s law, the angle $\theta$ is measured between the X-ray beam and the ___ of atoms, not from the normal.'
  accept: [planes, plane, layers, layer, rows, row, lattice planes, crystal planes, atomic planes]
  explanation: |-
    $\theta$ is the glancing angle between the beam and the reflecting planes. The beam is deflected by $2\theta$ in all.
- id: phys-m11-r2-h24
  lesson: phys-h-gratings-xray
  type: text
  topic: X-ray diffraction
  stem: 'X-rays of wavelength 0.154 nm reflect from planes 0.200 nm apart. The highest Bragg order that occurs is $m =$ ___. (Give only the number.)'
  accept: ['2']
  explanation: |-
    $\sin\theta = m\lambda/(2d)$ must be at most 1, so $m \le 2d/\lambda = 0.400/0.154 = 2.6$. The highest whole order is 2.
- id: phys-m11-r2-h25
  lesson: phys-h-gratings-xray
  type: label
  topic: X-ray diffraction
  stem: 'Name the numbered parts of this Bragg reflection diagram.'
  image: {src: images/phys-m11-bragg-blank.svg, alt: 'Three rows of atoms with two X-ray beams reflecting from the top two rows, with four numbered markers'}
  labels:
    - {x: 33.3, y: 31.0, text: Glancing angle}
    - {x: 83.3, y: 46.4, text: Spacing between planes}
    - {x: 43.1, y: 54.5, text: Extra path of the lower beam}
    - {x: 73.6, y: 78.6, text: A plane of atoms}
  distractors: [Angle from the normal, Wavelength]
  explanation: |-
    The marked angle is between the beam and the plane: the glancing angle $\theta$. The bracket spans the plane spacing $d$. The highlighted segments are the extra distance $2d\sin\theta$ the lower beam travels. Each row of atoms is a reflecting plane.
- id: phys-m11-r2-h26
  lesson: phys-h-gratings-xray
  type: match
  topic: X-ray diffraction
  stem: 'Match each name to the contribution.'
  pairs:
    - [Max von Laue, Proposed in 1912 that crystals would diffract X-rays]
    - [Friedrich and Knipping, First observed X-ray diffraction by a crystal]
    - [William Henry and William Lawrence Bragg, Explained the peaks as reflections from planes of atoms]
    - [Rosalind Franklin's laboratory, X-ray images of DNA fibers in 1952]
  distractors: [First direct detection of gravitational waves]
  explanation: |-
    Laue's idea was confirmed by Friedrich and Knipping in 1912; the Braggs' plane picture and Bragg's law followed within a year, and they shared the 1915 Nobel Prize. Franklin's group made the DNA images that supported the double helix. Gravitational waves were detected by LIGO in 2015.
- id: phys-m11-r2-h27
  lesson: phys-h-gratings-xray
  type: order
  topic: X-ray diffraction
  stem: 'X-rays of wavelength 0.154 nm reflect from four crystals. Order the plane spacings by first-order Bragg angle, smallest angle first.'
  items: ['0.400 nm', '0.282 nm', '0.200 nm', '0.150 nm']
  explanation: |-
    $\sin\theta = \lambda/(2d)$, so the angle grows as $d$ shrinks: $11.1^\circ$, $15.8^\circ$, $22.6^\circ$ and $30.9^\circ$.
- id: phys-m11-r2-h28
  lesson: phys-h-gratings-xray
  topic: X-ray diffraction
  stem: 'Why is an ordinary ruled grating with about 1000 lines/mm of little use for X-rays?'
  choices: ['X-rays pass through it without slowing down', 'X-rays are not waves', 'Its spacing is thousands of times the X-ray wavelength, so all maxima crowd near the straight-through beam', 'Its lines are too far apart to be illuminated together']
  answer: 2
  explanation: |-
    With $d = 1$ μm and $\lambda \approx 0.1$ nm, $\sin\theta = m\lambda/d \approx 10^{-4}m$: the orders sit within hundredths of a degree of the beam. Crystals, with spacings of a few tenths of a nanometer, match X-ray wavelengths. Laue's experiment showed X-rays are waves.

# ---------- phys-h-ray-matrices ----------
- id: phys-m11-r2-h29
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'What is the lower-left entry $C$ of the ray matrix for a thin converging lens with $f = 25$ cm?'
  choices: ['$+0.04$ cm⁻¹', '$-0.04$ cm⁻¹', '$-25$ cm', '$+25$ cm']
  answer: 1
  explanation: |-
    A thin lens has matrix $\begin{pmatrix} 1 & 0 \\ -1/f & 1 \end{pmatrix}$, so $C = -1/25 = -0.04$ cm⁻¹. The minus sign turns a ray at positive height downward, toward the axis.
- id: phys-m11-r2-h30
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'Light meets lens 1 (matrix $L_1$), then a gap (matrix $T$), then lens 2 (matrix $L_2$). The system matrix is'
  choices: ['$L_1TL_2$', '$TL_1L_2$', '$L_2TL_1$', '$L_2L_1T$']
  answer: 2
  explanation: |-
    The ray vector is multiplied first by $L_1$, then by $T$, then by $L_2$: $L_2(T(L_1\vec r))$. The first element the light meets goes on the right.
- id: phys-m11-r2-h31
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'A lens system in air has system matrix entries $A = 0.60$ and $C = -0.040$ cm⁻¹. How far past the last surface do parallel rays come to a focus?'
  choices: ['25 cm', '42 cm', '0.024 cm', '15 cm']
  answer: 3
  explanation: |-
    The back focal distance is $-A/C = -0.60/(-0.040) = 15$ cm. 25 cm is the effective focal length $-1/C$, which sets image size, not where the focus is. 42 cm is $1/(AC)$ in size.
- id: phys-m11-r2-h32
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'Two thin converging lenses with $f_1 = 20$ cm and $f_2 = 30$ cm are 10 cm apart. What is the effective focal length of the pair?'
  choices: ['15 cm', '12 cm', '50 cm', '10 cm']
  answer: 0
  explanation: |-
    $\dfrac1f = \dfrac{1}{20} + \dfrac{1}{30} - \dfrac{10}{(20)(30)} = 0.0667$ cm⁻¹, so $f = 15$ cm. 12 cm is the value for lenses in contact; 50 cm adds the focal lengths instead of the powers.
- id: phys-m11-r2-h33
  lesson: phys-h-ray-matrices
  type: text
  topic: Ray-transfer matrices
  stem: 'For any lens system that starts and ends in air, the determinant $AD - BC$ of the system matrix equals ___.'
  accept: ['1', one]
  explanation: |-
    Translations and thin lenses have determinant 1, and a surface has determinant $n_1/n_2$. For a system from air back to air the index ratios multiply to $1$.
- id: phys-m11-r2-h34
  lesson: phys-h-ray-matrices
  type: text
  topic: Ray-transfer matrices
  stem: 'A converging lens with $f = +20$ cm is placed in contact with a diverging lens with $f = -50$ cm. The power of the pair is ___ diopters. (Give only the number, with its sign if negative.)'
  accept: ['3', '+3', '3.0']
  explanation: |-
    In contact ($d = 0$) powers add: $P = 1/0.20 + 1/(-0.50) = 5.0 - 2.0 = 3.0$ D, a focal length of 33 cm.
- id: phys-m11-r2-h35
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'The ray matrix from an object plane to a later plane has $B = 0$. What does that tell you?'
  choices: ['The later plane is a focal plane for parallel light', 'The system has no focusing power', 'All rays reach the later plane parallel to the axis', 'The later plane holds the image, and $A$ is the magnification']
  answer: 3
  explanation: |-
    The output height is $y' = Ay + B\theta$. With $B = 0$, every ray leaving an object point at height $y$ arrives at height $Ay$, whatever its angle: that is an image, magnified by $A$. Focusing power is set by $C$.
- id: phys-m11-r2-h36
  lesson: phys-h-ray-matrices
  topic: Ray-transfer matrices
  stem: 'A thick lens has effective focal length 10.3 cm and back focal distance 9.7 cm. What does the difference mean?'
  choices: ['The focus is 9.7 cm behind the back surface, while 10.3 cm sets the image size', 'The lens has two different focal points for red and blue light', 'The lens is badly made', 'One of the numbers must be a calculation error']
  answer: 0
  explanation: |-
    For a thick lens the distance to the focus from the back surface ($-A/C$) differs from the effective focal length ($-1/C$), which acts as if measured from a plane inside the lens. Both are right; only for a thin lens do they coincide. Different foci for different colors is chromatic aberration, a separate effect.
- id: phys-m11-r2-h37
  lesson: phys-h-ray-matrices
  topic: Aberrations
  stem: 'Which of these reduce spherical aberration? Select all that apply.'
  choices: ['Using a smaller aperture to block the outer rays', 'Using a paraboloidal mirror for distant objects on its axis', 'Using lens surfaces with an aspheric shape', 'Using a glass with higher dispersion']
  answer: [0, 1, 2]
  explanation: |-
    Spherical aberration comes from the shape of spherical surfaces: outer rays focus short. Blocking them, or changing the shape (aspheres, paraboloids), reduces it. Dispersion causes chromatic aberration, and more of it would only make colors worse.
- id: phys-m11-r2-h38
  lesson: phys-h-ray-matrices
  type: match
  topic: Aberrations
  stem: 'Match each term to its description.'
  pairs:
    - [Spherical aberration, Edge rays focus closer than rays near the axis]
    - [Chromatic aberration, Different colors focus at different distances]
    - [Achromatic doublet, Crown and flint lenses whose color errors cancel]
    - [Paraboloidal mirror, Brings all parallel on-axis rays to one focus]
  distractors: [Splits a beam into two arms]
  explanation: |-
    Spherical aberration is a shape problem; chromatic aberration is a dispersion problem. A doublet of crown and flint glass cancels the color error for two wavelengths, and a paraboloid removes spherical aberration for distant on-axis objects. Splitting a beam is a beam splitter's job.
- id: phys-m11-r2-h39
  lesson: phys-h-ray-matrices
  topic: Aberrations
  stem: 'An achromatic doublet of power 5.0 D is made from crown glass ($V_1 = 60.0$) and flint glass ($V_2 = 40.0$). What powers do the two elements need?'
  choices: ['$+3.0$ D and $+2.0$ D', '$+7.5$ D and $-2.5$ D', '$+15$ D and $-10$ D', '$+10$ D and $-5.0$ D']
  answer: 2
  explanation: |-
    $P_1 = \dfrac{PV_1}{V_1 - V_2} = \dfrac{(5.0)(60.0)}{20.0} = +15$ D and $P_2 = -\dfrac{PV_2}{V_1 - V_2} = -10$ D. Check: they add to 5.0 D, and $15/60 - 10/40 = 0$. Splitting the power in proportion to $V$ gives $+3.0$ and $+2.0$ D, which add up but double the color error instead of cancelling it.
- id: phys-m11-r2-h40
  lesson: phys-h-ray-matrices
  type: text
  topic: Aberrations
  stem: 'A glass has $n_d = 1.5168$, $n_F = 1.5224$ and $n_C = 1.5143$. Its Abbe number is ___. (Give only the number, to 3 significant figures.)'
  accept: ['63.8']
  explanation: |-
    $V = \dfrac{n_d - 1}{n_F - n_C} = \dfrac{0.5168}{0.0081} = 63.8$: a low-dispersion crown glass.
- id: phys-m11-r2-h41
  lesson: phys-h-ray-matrices
  type: order
  topic: Ray-transfer matrices
  stem: 'Light meets a converging lens, then a 5 cm gap, then a diverging lens. Put the three matrices in the order they are written in the system matrix product, from left to right.'
  items: [Diverging lens matrix, Gap matrix, Converging lens matrix]
  explanation: |-
    The first element the light meets acts on the ray first, so it sits on the right: $M = L_2T(5\text{ cm})L_1$, with the diverging lens on the left.
- id: phys-m11-r2-h42
  lesson: phys-h-ray-matrices
  topic: Aberrations
  stem: 'What was wrong with the Hubble Space Telescope''s images after its 1990 launch?'
  choices: ['Its glass mirror had chromatic aberration', 'Its mirror was too small to resolve stars', 'Its mirror coating had been scratched', 'Its primary mirror had the wrong shape, causing spherical aberration']
  answer: 3
  explanation: |-
    The mirror had been polished too flat near the edge, by about 2.2 μm, so edge rays and central rays focused at different points. Corrective optics installed in 1993 fixed it. A mirror reflects all colors the same way, so it has no chromatic aberration.
