# Round 2 questions for phys-m12 (Modern physics): core lessons q01-q20, honors lessons h01-h40.

# ---------- Special relativity (core) ----------
- id: phys-m12-r2-q01
  lesson: phys-relativity
  type: text
  topic: Special relativity
  stem: 'A particle moves at $0.60c$. Its Lorentz factor is $\gamma =$ ___. Give the exact decimal.'
  accept: ['1.25']
  explanation: |-
    $\gamma = 1/\sqrt{1 - 0.60^2} = 1/\sqrt{0.64} = 1/0.80 = 1.25$. ($5/4$ is the same number and is accepted.)
- id: phys-m12-r2-q02
  lesson: phys-relativity
  type: match
  module_quiz: true
  topic: Special relativity
  stem: 'A spaceship passes Earth at high speed. Match each measurement made by Earth observers to how it compares with the value measured on the ship.'
  pairs:
    - [Time between ticks of the ship's clock, Longer by the factor γ]
    - [Length of the ship along its motion, Shorter by the factor γ]
    - [Height of the ship across its motion, Unchanged]
    - [Speed of a light pulse sent from the ship, The same value c]
  distractors: [Shorter by the factor γ squared]
  explanation: |-
    The ship's clock measures proper time, so Earth measures $\Delta t = \gamma\Delta t_0$ (moving clocks run slow). The ship's proper length contracts to $L_0/\gamma$, but only along the motion; perpendicular sizes do not change. By the second postulate, everyone measures light at $c$.
- id: phys-m12-r2-q03
  lesson: phys-relativity
  topic: Special relativity
  stem: 'An electron moves at $0.90c$. Which statements are true? Select all that apply.'
  choices:
    - 'Its kinetic energy is greater than $\tfrac12mv^2$'
    - 'Its momentum is $mv$'
    - 'Its total energy is greater than its rest energy'
    - 'Its energy and momentum satisfy $E^2 = (pc)^2 + (mc^2)^2$'
  answer: [0, 2, 3]
  explanation: |-
    With $\gamma = 2.294$, $K = (\gamma - 1)mc^2 = 0.661$ MeV, far more than $\tfrac12mv^2 = 0.207$ MeV. $E = \gamma mc^2$ exceeds the rest energy whenever the particle moves, and $E^2 = (pc)^2 + (mc^2)^2$ holds for any particle. The momentum is $\gamma mv$, not $mv$.
- id: phys-m12-r2-q04
  lesson: phys-relativity
  type: label
  module_quiz: true
  topic: Special relativity
  stem: 'The picture shows a light clock at rest (left) and the same clock moving to the right as seen from the ground (right). Name the numbered parts.'
  image: {src: images/phys-m12-light-clock-blank.svg, alt: 'Left: a light pulse bouncing straight up and down between two mirrors. Right: the same clock shown at three positions as it moves right, with the pulse following a slanted path up and back down, and a double arrow along the bottom.'}
  labels:
    - {x: 16.4, y: 23.7, text: Mirror}
    - {x: 16.4, y: 60, text: Light path in the clock's own frame}
    - {x: 53.1, y: 51.3, text: Light path seen from the ground}
    - {x: 53.1, y: 87.9, text: Distance the clock moves in half a tick}
  distractors: [Proper length of the clock, Path of a second light pulse]
  explanation: |-
    In the clock's frame (1, 2) the pulse goes straight up and down between the mirrors, so one tick is $2D/c$. From the ground the pulse follows the longer slanted path (3), of length $c\Delta t/2$ each half tick, while the clock moves $v\Delta t/2$ (4). Light has the same speed in both frames, so the longer path takes longer: $\Delta t = \gamma\Delta t_0$.
- id: phys-m12-r2-q05
  lesson: phys-relativity
  type: order
  topic: Special relativity
  stem: 'Put these particles in order from smallest to largest kinetic energy. (Rest energies: electron 0.511 MeV, proton 938.3 MeV.)'
  items:
    - 'An electron at $0.90c$'
    - 'A proton at $0.050c$'
    - 'An electron at $0.99c$'
    - 'A proton at $0.10c$'
  explanation: |-
    $K = (\gamma - 1)mc^2$. Electron at $0.90c$: $1.294(0.511) = 0.661$ MeV. Proton at $0.050c$: $\gamma - 1 = 0.00125$, so $1.18$ MeV. Electron at $0.99c$: $6.09(0.511) = 3.11$ MeV. Proton at $0.10c$: $\gamma - 1 = 0.00504$, so $4.73$ MeV. A slow proton can carry more kinetic energy than a very fast electron because its rest energy is 1836 times larger.

# ---------- Photons, atoms, matter waves (core) ----------
- id: phys-m12-r2-q06
  lesson: phys-quantum
  type: text
  topic: Atomic structure
  stem: 'Hydrogen''s electron drops from $n = 4$ to $n = 2$. Using $E_n = -13.6\text{ eV}/n^2$ and $hc = 1240$ eV·nm, the emitted photon''s wavelength is ___ nm. Give only the number, to 3 significant figures.'
  accept: ['486']
  explanation: |-
    $E = 13.6\left(\tfrac14 - \tfrac1{16}\right) = 13.6(0.1875) = 2.55$ eV, so $\lambda = 1240/2.55 = 486$ nm: the blue-green Balmer line.
- id: phys-m12-r2-q07
  lesson: phys-quantum
  type: order
  topic: Atomic structure
  stem: 'Put these hydrogen transitions in order from the lowest-energy photon to the highest-energy photon.'
  items:
    - '$n = 3 \to n = 2$'
    - '$n = 4 \to n = 2$'
    - '$n = 2 \to n = 1$'
    - '$n = 3 \to n = 1$'
  explanation: |-
    Photon energies are level differences: $3 \to 2$: 1.89 eV; $4 \to 2$: 2.55 eV; $2 \to 1$: 10.2 eV; $3 \to 1$: 12.1 eV. Every jump to $n = 1$ is bigger than every jump to $n = 2$, because the gap between $n = 1$ and $n = 2$ alone (10.2 eV) exceeds the whole range above $n = 2$ (3.4 eV).
- id: phys-m12-r2-q08
  lesson: phys-quantum
  type: match
  topic: Wave–particle duality
  stem: 'Match each experiment to what it showed.'
  pairs:
    - [Photoelectric effect, Light's energy arrives in packets of hf]
    - [Davisson–Germer experiment, Electrons diffract like waves]
    - [Hydrogen's line spectrum, Atoms have discrete energy levels]
    - [Millikan's stopping-potential measurements, The slope of maximum kinetic energy against frequency is h for every metal]
  distractors: [Electrons can orbit the nucleus at any radius]
  explanation: |-
    Einstein explained the photoelectric effect with photons of energy $hf$; Millikan's careful measurements (1916) confirmed the straight line of slope $h$. Electron diffraction from a nickel crystal (1927) confirmed de Broglie's matter waves. Sharp spectral lines mean only certain energy jumps are possible, which is what Bohr's levels explain. Orbits at any radius are exactly what the line spectra rule out.
- id: phys-m12-r2-q09
  lesson: phys-quantum
  module_quiz: true
  topic: Photons
  stem: 'Which statements about the photoelectric effect are true? Select all that apply.'
  choices:
    - 'The threshold frequency depends on the metal'
    - 'Below the threshold frequency, very bright light eventually ejects electrons'
    - 'Raising the frequency above threshold raises the maximum kinetic energy'
    - 'Raising the intensity at a fixed frequency above threshold ejects more electrons per second'
  answer: [0, 2, 3]
  explanation: |-
    $f_0 = \phi/h$ depends on the work function, a property of the metal. $K_{\max} = hf - \phi$ grows with frequency, while intensity sets how many photons, and so how many electrons, arrive each second. Below threshold each photon has too little energy, and an electron absorbs one photon at a time, so brightness does not help.
- id: phys-m12-r2-q10
  lesson: phys-quantum
  type: label
  module_quiz: true
  topic: Atomic structure
  stem: 'The picture is hydrogen''s energy-level diagram, drawn to scale. Name the numbered parts.'
  image: {src: images/phys-m12-hydrogen-levels-blank.svg, alt: 'Horizontal energy levels, widely spaced at the bottom and crowding together near a dashed line at the top. Two short downward arrows end on the second level from the bottom; two long downward arrows end on the bottom level; a dashed arrow runs from the bottom level to the top line.'}
  labels:
    - {x: 51.6, y: 94, text: Ground state}
    - {x: 43.8, y: 10, text: Ionization limit (E = 0)}
    - {x: 51.6, y: 25.2, text: Balmer transition (visible)}
    - {x: 26.6, y: 62.5, text: Lyman transition (ultraviolet)}
  distractors: [Absorption of a photon, Paschen transition (infrared)]
  explanation: |-
    The lowest level, $-13.6$ eV, is the ground state (1); the levels crowd toward 0 eV (2), above which the electron is free. Downward arrows are emissions: those ending at $n = 2$ are Balmer lines (3), in the visible, and those ending at $n = 1$ are Lyman lines (4), long arrows and so ultraviolet photons. Paschen lines end at $n = 3$, and none is drawn.

# ---------- Blackbody radiation and Compton effect (core) ----------
- id: phys-m12-r2-q11
  lesson: phys-blackbody-compton
  type: text
  topic: Blackbody radiation
  stem: 'A blackbody at 5000 K has its emission peak at ___ nm. (Wien''s constant $2.898\times10^{-3}$ m·K.) Give only the number, to 3 significant figures.'
  accept: ['580', '579.6']
  explanation: |-
    $\lambda_{\max} = \dfrac{2.898\times10^{-3}}{5000} = 5.796\times10^{-7}$ m $= 580$ nm, yellow-green. A star like this looks yellowish-white because it emits across the whole visible range.
- id: phys-m12-r2-q12
  lesson: phys-blackbody-compton
  type: order
  module_quiz: true
  topic: Compton effect
  stem: 'Put these milestones of early quantum physics in chronological order.'
  items:
    - 'Planck explains the blackbody spectrum with energy quanta'
    - 'Einstein proposes photons to explain the photoelectric effect'
    - 'Bohr''s model gives hydrogen quantized energy levels'
    - 'Compton''s X-ray scattering shows photons carry momentum'
    - 'Davisson and Germer observe electron diffraction'
  explanation: |-
    Planck 1900, Einstein 1905, Bohr 1913, Compton 1923, Davisson and Germer 1927. Each step built on the last: quanta of energy, then particles of light, then quantized atoms, then photon momentum, and finally the confirmation that matter, too, behaves as waves.
- id: phys-m12-r2-q13
  lesson: phys-blackbody-compton
  type: match
  topic: Blackbody radiation
  stem: 'Match each law to what it tells you.'
  pairs:
    - [Wien's displacement law, The wavelength at which emission peaks]
    - [Stefan–Boltzmann law, The total power radiated]
    - [Planck's radiation law, The intensity at every wavelength]
    - [Compton's formula, The wavelength shift of scattered X-rays]
  distractors: [The maximum kinetic energy of photoelectrons]
  explanation: |-
    Wien gives $\lambda_{\max} = b/T$; Stefan–Boltzmann gives $P = e\sigma AT^4$; Planck's law gives the whole spectrum, and both of the others follow from it. Compton's formula is $\lambda' - \lambda = \frac{h}{m_ec}(1 - \cos\theta)$. Photoelectron energy is $K_{\max} = hf - \phi$, from the previous lesson.
- id: phys-m12-r2-q14
  lesson: phys-blackbody-compton
  topic: Compton effect
  stem: 'X-rays scatter from free electrons. Which statements are true? Select all that apply.'
  choices:
    - 'The wavelength shift depends on the incoming wavelength'
    - 'The wavelength shift is largest for photons scattered straight back'
    - 'At any nonzero scattering angle, the scattered photon has less energy than the incoming one'
    - 'The recoiling electron''s kinetic energy equals the energy the photon lost'
  answer: [1, 2, 3]
  explanation: |-
    $\Delta\lambda = \frac{h}{m_ec}(1 - \cos\theta)$ depends only on the angle and is largest, 4.86 pm, at $180^\circ$. A longer wavelength means less energy, and by energy conservation the electron gets exactly what the photon lost. The *fractional* change depends on the incoming wavelength, but the shift itself does not.

# ---------- Nuclear physics (core) ----------
- id: phys-m12-r2-q15
  lesson: phys-nuclear
  type: text
  topic: Radioactive decay
  stem: 'Uranium-238 ($Z = 92$) decays through a chain of 8 alpha decays and 6 beta-minus decays. The stable end product has atomic number $Z =$ ___. Give only the number.'
  accept: ['82']
  explanation: |-
    Each alpha decay lowers $Z$ by 2 and each beta-minus decay raises it by 1: $92 - 8(2) + 6 = 82$, lead. The mass number drops by $8 \times 4 = 32$, to 206: the chain ends at lead-206.
- id: phys-m12-r2-q16
  lesson: phys-nuclear
  type: order
  topic: Radioactive decay
  stem: 'Put these nuclei in the order they occur in the uranium-238 decay chain.'
  items: [Uranium-238, Thorium-234, Protactinium-234, Uranium-234, Thorium-230, Radium-226]
  explanation: |-
    U-238 alpha decays to Th-234 ($Z$ 92 to 90); two beta-minus decays take it through Pa-234 (in an excited state, Pa-234m) to U-234 ($Z$ back to 92, $A$ unchanged); two alpha decays then give Th-230 and Ra-226. Check each step: alpha changes $A$ by 4, beta changes only $Z$.
- id: phys-m12-r2-q17
  lesson: phys-nuclear
  type: match
  topic: Radioactive decay
  stem: 'Match each type of decay to how it changes the nucleus.'
  pairs:
    - [Alpha, Z decreases by 2 and A decreases by 4]
    - [Beta minus, Z increases by 1 and A is unchanged]
    - [Beta plus, Z decreases by 1 and A is unchanged]
    - [Gamma, Neither Z nor A changes]
  distractors: [Z increases by 2 and A increases by 4]
  explanation: |-
    An alpha particle is a helium-4 nucleus (2 protons, 2 neutrons). Beta minus turns a neutron into a proton; beta plus turns a proton into a neutron. A gamma ray is a photon from a nucleus dropping to a lower energy state.
- id: phys-m12-r2-q18
  lesson: phys-nuclear
  module_quiz: true
  topic: Nuclear structure
  stem: 'Which quantities are conserved in every nuclear reaction or decay? Select all that apply.'
  choices:
    - 'Total electric charge'
    - 'Total rest mass'
    - 'Total number of nucleons'
    - 'Total energy, including rest energy'
  answer: [0, 2, 3]
  explanation: |-
    Charge and nucleon number balance on both sides of every reaction, and total energy (rest energy plus kinetic energy plus photons) is conserved. Rest mass is not: the mass defect is exactly the rest mass converted to other forms of energy, as in $E_B = \Delta m\,c^2$.
- id: phys-m12-r2-q19
  lesson: phys-nuclear
  type: label
  module_quiz: true
  topic: Radioactive decay
  stem: 'A source emits three kinds of radiation toward three barriers. Name the numbered parts.'
  image: {src: images/phys-m12-penetration-blank.svg, alt: 'A source on the left emits three beams. The top beam stops at a thin sheet, the middle beam passes the thin sheet and stops at a thicker sheet, and the bottom beam passes both and continues, weakened, through a thick block.'}
  labels:
    - {x: 33.3, y: 78.8, text: Sheet of paper}
    - {x: 54.4, y: 78.8, text: Aluminum a few millimeters thick}
    - {x: 78.1, y: 78.8, text: Thick lead}
    - {x: 23.4, y: 36.4, text: Alpha particles}
    - {x: 43.75, y: 63.6, text: Gamma rays}
  distractors: [Neutrinos, Plastic film]
  explanation: |-
    Alpha particles (4), heavy and doubly charged, are stopped by a sheet of paper (1). Beta particles pass the paper but stop in a few millimeters of aluminum (2). Gamma rays (5), uncharged photons, pass both and are only gradually weakened by thick lead (3) or concrete.
- id: phys-m12-r2-q20
  lesson: phys-nuclear
  topic: Nuclear structure
  stem: 'On the graph of binding energy per nucleon against mass number, which nucleus is far above its neighbors, making it unusually tightly bound for its size?'
  choices: ['Helium-4', 'Hydrogen-2', 'Iron-56', 'Uranium-238']
  answer: 0
  explanation: |-
    Helium-4 has 7.07 MeV per nucleon, compared with 1.11 MeV for hydrogen-2 and 5.33 MeV for lithium-6: a sharp spike. That is why alpha particles are emitted as a unit. Iron-56 is near the overall peak (8.79 MeV), but it is not far above its neighbors; uranium-238 (7.57 MeV) is on the slowly falling heavy side.

# ---------- Honors: spacetime, twins, Doppler ----------
- id: phys-m12-r2-h01
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'Two events are 1800 m apart and 10.0 μs apart in Earth''s frame. What is the proper time between them, for a clock moving at constant velocity from one to the other? ($c = 3.00\times10^8$ m/s)'
  choices: ['6.0 μs', '8.0 μs', '10.0 μs', '11.7 μs']
  answer: 1
  explanation: |-
    $c\Delta t = 3000$ m, so $(\Delta s)^2 = 3000^2 - 1800^2 = 5.76\times10^6$ m² and $\Delta s = 2400$ m. Proper time $= 2400/(3.00\times10^8) = 8.0$ μs. Adding the squares instead of subtracting gives $\sqrt{3000^2 + 1800^2} = 3499$ m, or 11.7 μs; 10.0 μs is the Earth-frame time, always the longer one.
- id: phys-m12-r2-h02
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'Two events are 4000 m apart and 10.0 μs apart in Earth''s frame. Which is true?'
  choices: ['The separation is timelike, so every observer agrees on their order', 'The separation is lightlike, so only a light pulse can connect them', 'The separation is spacelike, so neither event can cause the other', 'The separation depends on the observer, so it cannot be classified']
  answer: 2
  explanation: |-
    $c\Delta t = 3000$ m is less than $\Delta x = 4000$ m, so $(\Delta s)^2 < 0$: spacelike. A signal would have to go faster than light to connect them, so neither can cause the other, and different observers can disagree about their order. The interval is the same for every observer, so the classification is too.
- id: phys-m12-r2-h03
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'In Earth''s frame, event A is at $x = 0$, $t = 0$ and event B is at $x = 1200$ m, $t = 2.00$ μs. At what speed must an observer move along $+x$ to see them as simultaneous?'
  choices: ['$0.25c$', '$0.50c$', '$0.60c$', '$2.0c$']
  answer: 1
  explanation: |-
    $\Delta t' = \gamma(\Delta t - v\Delta x/c^2) = 0$ gives $v = c^2\Delta t/\Delta x = c(c\Delta t)/\Delta x = c(600/1200) = 0.50c$. Inverting the ratio gives $2.0c$, which is impossible; a spacelike separation always gives a speed below $c$.
- id: phys-m12-r2-h04
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'A traveler flies at $0.80c$ to a star 4.0 light-years away (Earth frame) and immediately returns at the same speed. How much does the traveler age during the trip?'
  choices: ['10 years', '16.7 years', '8.0 years', '6.0 years']
  answer: 3
  explanation: |-
    Earth time: $2(4.0/0.80) = 10$ years. With $\gamma = 1/\sqrt{1 - 0.64} = 5/3$, the traveler ages $10/(5/3) = 6.0$ years. Using the interval for each leg: $\sqrt{5^2 - 4^2} = 3$ years, twice. Multiplying by $\gamma$ instead of dividing gives 16.7 years; 8.0 years is the round-trip distance in light-years.
- id: phys-m12-r2-h05
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'Why does the traveling twin, and not the Earth twin, end up younger?'
  choices: ['The traveler changes inertial frames at the turnaround, so the situation is not symmetric', 'Moving clocks are damaged by acceleration', 'The Earth twin is in a gravitational field', 'Each twin sees the other younger, and both are right at the reunion']
  answer: 0
  explanation: |-
    The Earth twin's worldline is straight (one inertial frame); the traveler's is bent, because she switches from the outbound frame to the inbound one. Between two events the straight worldline has the longest proper time. At the reunion both twins are in the same place and must agree: the traveler is younger.
- id: phys-m12-r2-h06
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'A source emits 600 nm light and approaches the observer at $0.60c$. What wavelength is observed?'
  choices: ['1200 nm', '480 nm', '300 nm', '240 nm']
  answer: 2
  explanation: |-
    For approach, $\lambda_{\text{obs}} = \lambda\sqrt{(1 - \beta)/(1 + \beta)} = 600\sqrt{0.40/1.60} = 600(0.5) = 300$ nm, in the ultraviolet. 1200 nm would be recession. 240 nm is $600(1 - 0.60)$, a low-speed shift formula used far outside its range; 480 nm uses time dilation alone.
- id: phys-m12-r2-h07
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'Which effect has no counterpart for sound?'
  choices: ['A receding source is shifted to lower frequency', 'An approaching source is shifted to higher frequency', 'The size of the shift depends on the source speed', 'A source moving at right angles to the line of sight is shifted to lower frequency']
  answer: 3
  explanation: |-
    The transverse Doppler effect comes purely from time dilation: a source moving across the line of sight has its clock slowed by $\gamma$, so its light is redshifted by that factor. Sound waves show the ordinary longitudinal shifts but no transverse shift.
- id: phys-m12-r2-h08
  lesson: phys-m12-h-spacetime
  type: text
  topic: Spacetime and the Doppler effect
  stem: 'A galaxy recedes at $0.50c$ (treat it as motion through space). Its redshift $z = \lambda_{\text{obs}}/\lambda_{\text{src}} - 1$ is ___. Give only the number, to 3 significant figures.'
  accept: ['0.732', '.732']
  explanation: |-
    $\lambda_{\text{obs}}/\lambda_{\text{src}} = \sqrt{1.5/0.5} = \sqrt3 = 1.732$, so $z = 0.732$. The low-speed estimate $z \approx \beta$ would give 0.50, far off at this speed.
- id: phys-m12-r2-h09
  lesson: phys-m12-h-spacetime
  type: text
  topic: Spacetime and the Doppler effect
  stem: 'The history of an object drawn on a spacetime diagram, a line through all the events of its existence, is called its ___.'
  accept: [worldline, world line, world-line]
  explanation: |-
    An object at rest has a vertical worldline; one moving at constant speed has a straight, tilted one; light's worldline is at $45^\circ$.
- id: phys-m12-r2-h10
  lesson: phys-m12-h-spacetime
  type: order
  topic: Spacetime and the Doppler effect
  stem: 'Two events are 3.0 μs apart in Earth''s frame. Put these spatial separations in order from the most timelike (largest positive interval squared) to the most spacelike.'
  items: ['0 m', '600 m', '900 m', '1200 m', '1500 m']
  explanation: |-
    $c\Delta t = 900$ m, so $(\Delta s)^2 = 900^2 - (\Delta x)^2$ falls as $\Delta x$ grows: $8.1\times10^5$, $4.5\times10^5$, 0 (lightlike at 900 m), then $-6.3\times10^5$ and $-1.44\times10^6$ m² (spacelike).
- id: phys-m12-r2-h11
  lesson: phys-m12-h-spacetime
  type: match
  topic: Spacetime and the Doppler effect
  stem: 'Match each worldline on a spacetime diagram (time up, $x$ across) to what it describes.'
  pairs:
    - [A vertical line, An object at rest]
    - [A line at 45 degrees, A light pulse]
    - [A straight line steeper than 45 degrees, An object moving at constant speed below c]
    - [A line that bends partway, An object that changes velocity]
  distractors: [An object moving faster than light]
  explanation: |-
    On a diagram with $ct$ up, slope from the vertical measures speed: vertical is at rest, $45^\circ$ is $c$. A massive object's worldline is always steeper than $45^\circ$; a bend means a change of velocity (like the twin's turnaround). A line flatter than $45^\circ$ would mean faster than light, which no object does.
- id: phys-m12-r2-h12
  lesson: phys-m12-h-spacetime
  topic: Spacetime and the Doppler effect
  stem: 'Which quantities are the same for all inertial observers? Select all that apply.'
  choices:
    - 'The spacetime interval between two events'
    - 'The time between two events'
    - 'The speed of light in vacuum'
    - 'The proper time along a given worldline'
  answer: [0, 2, 3]
  explanation: |-
    The interval is invariant (the Lorentz transformation preserves it), $c$ is invariant by the second postulate, and proper time is the interval along the worldline divided by $c$, read on one clock, so everyone agrees on it. The coordinate time between two events depends on the observer: that is time dilation.
- id: phys-m12-r2-h13
  lesson: phys-m12-h-spacetime
  type: label
  topic: Spacetime and the Doppler effect
  stem: 'The spacetime diagram shows the twin paradox, with $x$ in light-years across and $ct$ in years up. Name the numbered parts.'
  image: {src: images/phys-m12-twins-blank.svg, alt: 'A spacetime diagram. A vertical line runs from the origin to the top at 20. A bent line goes up and to the right to a point at x = 6, ct = 10, then back to the top of the vertical line. Dashed diagonal lines run from the bent line to the vertical line.'}
  labels:
    - {x: 23.4, y: 58.2, text: Earth twin's worldline}
    - {x: 34.2, y: 70.5, text: Traveler's outbound worldline}
    - {x: 45, y: 50, text: Turnaround}
    - {x: 28.8, y: 64.4, text: Light signal}
    - {x: 23.4, y: 8.9, text: Reunion}
  distractors: [Departure, Traveler's return worldline]
  explanation: |-
    The Earth twin stays at $x = 0$: a vertical worldline (1). The traveler's worldline goes out at $0.60c$ (2), turns around at 6 light-years (3), and returns to meet Earth at $ct = 20$ years (5). Signals sent to Earth travel at $45^\circ$ (4). Proper times: 20 years along the straight line, $2\sqrt{10^2 - 6^2} = 16$ years along the bent one.

# ---------- Honors: quantum tunneling ----------
- id: phys-m12-r2-h14
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'Inside a barrier where $U > E$, what form does the wave function take?'
  choices: ['A sine wave with a shorter wavelength', 'A real exponential that decays with distance', 'Exactly zero', 'A sine wave with a longer wavelength']
  answer: 1
  explanation: |-
    Where $U > E$, the Schrödinger equation reads $\psi'' = \kappa^2\psi$ with $\kappa = \sqrt{2m(U - E)}/\hbar$, whose solutions are $e^{\pm\kappa x}$, not oscillations. It is zero only for an infinitely high wall.
- id: phys-m12-r2-h15
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'An electron is 1.0 eV below the top of a barrier. What is $\kappa$? ($m_ec^2 = 511{,}000$ eV, $\hbar c = 197.3$ eV·nm)'
  choices: ['3.62 nm⁻¹', '0.815 nm⁻¹', '26.3 nm⁻¹', '5.12 nm⁻¹']
  answer: 3
  explanation: |-
    $\kappa = \sqrt{2(511{,}000)(1.0)}/197.3 = 1011/197.3 = 5.12$ nm⁻¹. Dropping the 2 gives 3.62; using $hc = 1240$ instead of $\hbar c$ gives 0.815; forgetting the square root (and the units) gives 26.3.
- id: phys-m12-r2-h16
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'Through a certain barrier, $e^{-2\kappa L} = 1\times10^{-3}$. If the barrier is made twice as wide (same height and particle energy), $e^{-2\kappa L}$ becomes'
  choices: ['$1\times10^{-6}$', '$5\times10^{-4}$', '$2\times10^{-3}$', '$3\times10^{-5}$']
  answer: 0
  explanation: |-
    Doubling $L$ doubles the exponent: $e^{-2\kappa(2L)} = (e^{-2\kappa L})^2 = 10^{-6}$. Halving ($5\times10^{-4}$) treats the dependence as $1/L$; $3\times10^{-5}$ is $(10^{-3})^{1.5}$.
- id: phys-m12-r2-h17
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'An STM works with a 4.5 eV work function ($\kappa = 10.9$ nm⁻¹). The gap widens by 0.050 nm. The tunneling current becomes about'
  choices: ['95% of its value', 'one third of its value', 'one ninth of its value', 'half of its value']
  answer: 1
  explanation: |-
    The current goes as $e^{-2\kappa d}$, so it is multiplied by $e^{-2(10.9)(0.050)} = e^{-1.09} = 0.34$, about one third. One ninth is the factor for a 0.10 nm change; using $e^{-\kappa\Delta d}$ gives 0.58, roughly a half.
- id: phys-m12-r2-h18
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'An electron with $E = 2.0$ eV hits a barrier $U = 5.0$ eV high and 0.25 nm wide ($\kappa = 8.87$ nm⁻¹). Using the exact formula $T = \left[1 + \dfrac{U^2\sinh^2\kappa L}{4E(U - E)}\right]^{-1}$, what is $T$?'
  choices: ['0.012', '0.27', '0.044', '0.0044']
  answer: 2
  explanation: |-
    $\kappa L = 2.22$, $\sinh 2.22 = 4.54$, so $\sinh^2 = 20.6$. Then $\dfrac{25(20.6)}{4(2.0)(3.0)} = 21.4$ and $T = 1/22.4 = 0.044$. The bare $e^{-2\kappa L} = 0.012$ leaves out the prefactor, 3.84 here; the thick-barrier formula $3.84(0.012) = 0.045$ is already close even though $\kappa L$ is only about 2.
- id: phys-m12-r2-h19
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'An electron tunnels through a barrier. Compared with its energy before the barrier, its energy after is'
  choices: ['lower, by the barrier height $U$', 'lower, by $U - E$', 'the same', 'higher, because it gains energy in the barrier']
  answer: 2
  explanation: |-
    The transmitted wave has the same wavelength as the incident one, so the same kinetic energy (with $U = 0$ on both sides). Tunneling reduces the probability of getting through, not the energy of the particles that do.
- id: phys-m12-r2-h20
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'Polonium-212 emits 8.8 MeV alpha particles with a half-life of 0.3 μs; uranium-238 emits 4.2 MeV alphas with a half-life of 4.5 billion years. Why does a factor of 2 in energy change the half-life so enormously?'
  choices: ['The strong force is weaker in polonium', 'Higher-energy alphas are faster, so they hit the barrier twice as often', 'Uranium nuclei are larger, so the alpha must travel farther inside', 'A higher energy makes the barrier both lower and thinner, and both appear in the exponent']
  answer: 3
  explanation: |-
    Tunneling probability is roughly $e^{-2\kappa L}$. More energy reduces $U - E$ (so $\kappa$) and moves the outer turning point inward (so $L$). Because both sit in an exponent, the half-lives differ by a factor of more than $10^{23}$. The collision rate does change, but only by a modest factor.
- id: phys-m12-r2-h21
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'Why do protons essentially never tunnel through a 0.5 nm barrier that electrons cross readily?'
  choices: ['The mass is inside the square root in the exponent, so $\kappa$ is about 43 times larger', 'Protons are positively charged', 'Protons are larger than the barrier', 'Protons move too slowly to reach the barrier']
  answer: 0
  explanation: |-
    $\kappa \propto \sqrt m$, and $\sqrt{1836} = 42.9$. For the lesson's 3 eV deficit, $2\kappa L$ goes from 8.9 for an electron to 380 for a proton: $T \approx 10^{-165}$.
- id: phys-m12-r2-h22
  lesson: phys-m12-h-tunneling
  type: text
  topic: Quantum tunneling
  stem: 'A classical particle moving toward a hill it cannot climb stops and reverses at the place where $U = E$, called the ___ point.'
  accept: [turning]
  explanation: |-
    Beyond the turning point is the classically forbidden region, where kinetic energy would be negative. Quantum mechanically the wave function leaks into it.
- id: phys-m12-r2-h23
  lesson: phys-m12-h-tunneling
  type: text
  topic: Quantum tunneling
  stem: 'With $T \approx e^{-2\kappa L}$, tripling the barrier width replaces $T$ by $T$ raised to the power ___. Give only the number.'
  accept: ['3']
  explanation: |-
    $e^{-2\kappa(3L)} = \left(e^{-2\kappa L}\right)^3$. A barrier passing 1 in 100 particles passes about 1 in a million when three times as wide.
- id: phys-m12-r2-h24
  lesson: phys-m12-h-tunneling
  type: order
  topic: Quantum tunneling
  stem: 'Each particle meets the same barrier with the same energy deficit $U - E$. Put them in order from the highest to the lowest tunneling probability.'
  items: [Electron, Muon, Proton, Alpha particle]
  explanation: |-
    $\kappa \propto \sqrt{m}$, and $T$ falls exponentially with $\kappa$, so lighter is better. Masses: electron 0.511 MeV/$c^2$, muon 105.7, proton 938.3, alpha particle 3727.
- id: phys-m12-r2-h25
  lesson: phys-m12-h-tunneling
  type: match
  topic: Quantum tunneling
  stem: 'Match each phenomenon to what tunnels.'
  pairs:
    - [Scanning tunneling microscope, Electrons crossing a vacuum gap]
    - [Alpha decay, An alpha particle leaving a nucleus]
    - [Fusion in the Sun, Protons getting close enough to fuse]
    - [Flash memory, Electrons crossing a thin oxide layer]
  distractors: [Photons crossing a mirror]
  explanation: |-
    In each case a particle crosses a region where its energy is below the potential: the vacuum gap's work-function barrier, the Coulomb barrier around a nucleus (escaping in alpha decay, entering in fusion), or an insulating oxide in a memory cell.
- id: phys-m12-r2-h26
  lesson: phys-m12-h-tunneling
  topic: Quantum tunneling
  stem: 'An electron tunnels through a rectangular barrier. Which changes, made one at a time, increase the tunneling probability? Select all that apply.'
  choices:
    - 'Using a heavier particle with the same energy'
    - 'Making the barrier thinner'
    - 'Lowering the barrier height'
    - 'Raising the electron''s energy, still below the top'
  answer: [1, 2, 3]
  explanation: |-
    $T \approx e^{-2\kappa L}$ with $\kappa = \sqrt{2m(U - E)}/\hbar$. A thinner barrier reduces $L$; a lower barrier or a higher energy reduces $U - E$. A heavier particle increases $\kappa$ and lowers $T$.
- id: phys-m12-r2-h27
  lesson: phys-m12-h-tunneling
  type: label
  topic: Quantum tunneling
  stem: 'The picture shows a wave function meeting a rectangular barrier (schematic). Name the numbered parts.'
  image: {src: images/phys-m12-barrier-blank.svg, alt: 'A rectangular barrier stands on a horizontal axis, with a dashed horizontal line below its top. A large wave on the left reaches the barrier, a smoothly falling curve crosses the barrier, and a small wave continues on the right. A double arrow spans the barrier''s width.'}
  labels:
    - {x: 18, y: 40, text: Incident and reflected wave}
    - {x: 50.8, y: 30, text: Barrier of height U}
    - {x: 50.8, y: 48.4, text: Exponentially decaying wave function}
    - {x: 86, y: 54, text: Transmitted wave}
    - {x: 50.8, y: 92.4, text: Barrier width L}
  distractors: [Turning point of the transmitted wave, Region where the particle loses energy]
  explanation: |-
    On the left (1) the incoming and reflected waves combine. Inside the barrier (2), where $U > E$, the wave function decays exponentially (3) over the width $L$ (5). On the right (4) it continues as a smaller wave with the same wavelength: same energy, lower probability. Nowhere does the particle lose energy.

# ---------- Honors: Q-values and the liquid-drop model ----------
- id: phys-m12-r2-h28
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'Uranium-238 (238.050788 u) alpha decays to thorium-234 (234.043601 u). Helium-4 is 4.002603 u. What is the Q-value? (1 u = 931.5 MeV/$c^2$)'
  choices: ['4.20 MeV', '4.27 MeV', '3730 MeV', '0.00458 MeV']
  answer: 1
  explanation: |-
    $\Delta m = 238.050788 - 234.043601 - 4.002603 = 0.004584$ u, and $Q = 0.004584(931.5) = 4.27$ MeV. 4.20 MeV is the alpha particle's share, $4.27(234/238)$; 0.00458 is the mass difference in u, not MeV.
- id: phys-m12-r2-h29
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'Polonium-210 alpha decays at rest with $Q = 5.41$ MeV. What is the alpha particle''s kinetic energy?'
  choices: ['5.41 MeV', '0.10 MeV', '5.31 MeV', '5.20 MeV']
  answer: 2
  explanation: |-
    Equal and opposite momenta give $K_\alpha = Q(A - 4)/A = 5.41(206/210) = 5.31$ MeV. The lead-206 nucleus recoils with the remaining 0.10 MeV. Giving all of $Q$ to the alpha particle ignores the recoil.
- id: phys-m12-r2-h30
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'Using atomic masses, when is beta-plus decay energetically possible?'
  choices: ['Whenever the parent atom is heavier than the daughter atom', 'Only when the daughter atom is heavier', 'Whenever the parent nucleus has more protons than neutrons', 'When the parent atom outweighs the daughter atom by more than $2m_e = 1.022$ MeV/$c^2$']
  answer: 3
  explanation: |-
    With atomic masses, $Q_{\beta^+} = (M_{\text{parent}} - M_{\text{daughter}})c^2 - 2m_ec^2$: one electron mass because the daughter atom has one fewer electron, and one for the positron created. Electron capture needs only $M_{\text{parent}} > M_{\text{daughter}}$, so it can occur where β⁺ cannot.
- id: phys-m12-r2-h31
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'Deuterium–tritium fusion releases 17.6 MeV, shared between a helium-4 nucleus and a neutron (initial kinetic energy negligible). How much does the neutron carry?'
  choices: ['14.1 MeV', '3.5 MeV', '8.8 MeV', '17.6 MeV']
  answer: 0
  explanation: |-
    Equal momenta mean energies in inverse ratio to mass: the neutron (mass number 1) gets $\tfrac45$ of 17.6 MeV $= 14.1$ MeV, and the helium nucleus gets 3.5 MeV. Splitting evenly gives 8.8 MeV.
- id: phys-m12-r2-h32
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'In the liquid-drop model, which term is mainly responsible for the fall in binding energy per nucleon among heavy nuclei?'
  choices: ['Volume term', 'Surface term', 'Coulomb term', 'Pairing term']
  answer: 2
  explanation: |-
    The Coulomb term grows as $Z^2/A^{1/3}$, roughly as $A^{5/3}$, faster than the volume term's $A$, so per nucleon it keeps growing. The surface term matters most for light nuclei; the pairing term is only about 1 MeV.
- id: phys-m12-r2-h33
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'The line of stability is $Z \approx A/(2 + 0.0150A^{2/3})$. What does it predict for $A = 120$?'
  choices: ['$Z \approx 60$', '$Z \approx 45$', '$Z \approx 40$', '$Z \approx 51$']
  answer: 3
  explanation: |-
    $120^{2/3} = 24.3$, so $Z \approx 120/(2 + 0.364) = 50.7$, about 51. Tin ($Z = 50$) has several stable isotopes near $A = 120$. $Z = 60$ is the naive $A/2$, which ignores the Coulomb term.
- id: phys-m12-r2-h34
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'In the semi-empirical mass formula, which nucleus gets the pairing bonus $+\delta$?'
  choices: ['$^{40}_{20}\text{Ca}$', '$^{39}_{19}\text{K}$', '$^{40}_{19}\text{K}$', '$^{27}_{13}\text{Al}$']
  answer: 0
  explanation: |-
    Calcium-40 has $Z = 20$ and $N = 20$, both even: $+\delta$. Potassium-40 has $Z = 19$, $N = 21$, both odd: $-\delta$. Potassium-39 and aluminum-27 have odd $A$: pairing term 0.
- id: phys-m12-r2-h35
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'A nuclear reaction has $Q = -2.0$ MeV. What does this mean?'
  choices: ['The reaction is impossible', 'It releases 2.0 MeV of kinetic energy', 'It can occur only if the colliding particles bring in at least 2.0 MeV of kinetic energy, and in fact somewhat more', 'The products have 2.0 MeV less rest energy than the reactants']
  answer: 2
  explanation: |-
    Negative $Q$ means the products have *more* rest energy than the reactants, so kinetic energy must be supplied. Because momentum is also conserved, some kinetic energy stays in the motion of the products, so the beam needs more than $|Q|$.
- id: phys-m12-r2-h36
  lesson: phys-m12-h-liquid-drop
  type: text
  topic: Nuclear energetics
  stem: 'In the semi-empirical mass formula the surface term is proportional to $A$ raised to the power ___.'
  accept: ['2/3', '0.667', '0.67']
  explanation: |-
    The radius goes as $A^{1/3}$, so the surface area goes as $R^2 \propto A^{2/3}$.
- id: phys-m12-r2-h37
  lesson: phys-m12-h-liquid-drop
  type: text
  topic: Nuclear energetics
  stem: 'Fission of one uranium-235 nucleus releases about ___ MeV. Give only the number, to 1 significant figure.'
  accept: ['200']
  explanation: |-
    Binding energy per nucleon rises from about 7.6 MeV to about 8.5 MeV when uranium splits into medium-mass fragments: roughly $(0.9)(236) \approx 200$ MeV, in agreement with measurement.
- id: phys-m12-r2-h38
  lesson: phys-m12-h-liquid-drop
  type: order
  topic: Nuclear energetics
  stem: 'For iron-56, put the terms of the semi-empirical mass formula in order from largest to smallest magnitude.'
  items: [Volume, Surface, Coulomb, Asymmetry, Pairing]
  explanation: |-
    With the lesson's coefficients: volume $+882.0$ MeV, surface $-260.5$, Coulomb $-120.8$, asymmetry $-6.8$ (iron-56 has only 4 more neutrons than protons), pairing $+1.5$.
- id: phys-m12-r2-h39
  lesson: phys-m12-h-liquid-drop
  type: match
  topic: Nuclear energetics
  stem: 'Match each term of the semi-empirical mass formula to its physical origin.'
  pairs:
    - [Volume term, Each nucleon is bound to its nearest neighbors]
    - [Surface term, Nucleons at the edge have fewer neighbors]
    - [Coulomb term, Every pair of protons repels]
    - [Asymmetry term, The exclusion principle penalizes unequal numbers of protons and neutrons]
    - [Pairing term, Paired nucleons are more tightly bound]
  distractors: [Gravity pulls the nucleons together]
  explanation: |-
    These are the five ingredients of the liquid-drop picture. Gravity between nucleons is negligibly weak compared with the nuclear and electric forces and plays no part.
- id: phys-m12-r2-h40
  lesson: phys-m12-h-liquid-drop
  topic: Nuclear energetics
  stem: 'For which processes can the Q-value be found from atomic masses directly, with no extra electron-mass correction? Select all that apply.'
  choices:
    - 'Beta-plus decay'
    - 'Alpha decay'
    - 'Beta-minus decay'
    - 'Electron capture'
  answer: [1, 2, 3]
  explanation: |-
    In alpha decay, beta-minus decay and electron capture the electron counts work out when atomic masses are used on both sides. In beta-plus decay the daughter atom has one fewer electron and a positron is created, so subtract $2m_ec^2 = 1.022$ MeV.
