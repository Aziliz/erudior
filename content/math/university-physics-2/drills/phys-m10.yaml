- id: phys-charge-in-b
  title: Charged particle circling in a magnetic field
  topic: Magnetic force
  vars:
    part: {choices: [{label: 'an electron', value: 9.11e-31}, {label: 'a proton', value: 1.673e-27}]}
    vm: {min: 1.0, max: 9.9, step: 0.1}
    ve: {min: 5, max: 7}
    B: {min: 0.01, max: 2, step: 0.01}
  calc:
    v: vm*10^ve
    F: 1.602e-19*v*B
    r: part*v/(1.602e-19*B)
    mexp: floor(log10(part))
    mcoef: part/10^mexp
  where: ['r > 1e-5', 'r < 100']
  prompt: 'Consider {part} moving at ${vm}\times10^{{ve}}$ m/s perpendicular to a {B} T magnetic field. Find the magnetic force on it and the radius of its circular path, each to 3 significant figures. ($e = 1.602\times10^{-19}$ C, $m_e = 9.11\times10^{-31}$ kg, $m_p = 1.673\times10^{-27}$ kg)'
  answers:
    - {name: F, label: 'Force', format: sci, relTolerance: 0.01, units: {N: 1}}
    - {name: r, label: 'Radius', format: sci, relTolerance: 0.01, units: {m: 1, cm: 0.01, mm: 0.001}}
  solution: |-
    $F = |q|vB = (1.602\times10^{-19})({vm}\times10^{{ve}})({B}) = \mathbf{{F:texsci}}$ N.

    $r = \dfrac{mv}{|q|B} = \dfrac{({mcoef:sig4}\times10^{{mexp}})({vm}\times10^{{ve}})}{(1.602\times10^{-19})({B})} = \mathbf{{r:texsci}}$ m.
- id: phys-wire-force
  title: Force on a current-carrying wire
  topic: Magnetic force
  vars:
    I: {min: 0.5, max: 30, step: 0.5}
    L: {min: 0.05, max: 2, step: 0.05}
    B: {min: 0.01, max: 1.5, step: 0.01}
    th: {min: 15, max: 90, step: 5}
  calc:
    F: I*L*B*sind(th)
  prompt: 'A straight wire {L} m long carries {I} A in a uniform {B} T magnetic field. The wire makes an angle of {th}° with the field. What is the magnitude of the magnetic force on it, in newtons to 3 significant figures?'
  answers:
    - {format: sig4, name: F, label: 'Force', relTolerance: 0.01, units: {N: 1, mN: 0.001}}
  solution: |-
    $F = ILB\sin\theta = ({I})({L})({B})\sin {th}^\circ =$ **{F:sig3} N**, perpendicular to both the wire and the field.
- id: phys-mass-spec
  title: Mass spectrometer radius
  topic: Magnetic force
  vars:
    A: {min: 1, max: 240}
    V: {min: 100, max: 5000, step: 100}
    B: {min: 0.05, max: 1.0, step: 0.05}
  calc:
    m: A*1.661e-27
    v: sqrt(2*1.602e-19*V/m)
    r: m*v/(1.602e-19*B)
    rcm: r*100
  where: ['rcm > 0.5', 'rcm < 300']
  prompt: 'A singly charged ion of mass {A} u ($1\text{ u} = 1.661\times10^{-27}$ kg) is accelerated from rest through {V:dp0} V and enters a {B} T magnetic field perpendicular to its velocity. Find its speed (m/s) and the radius of its path (cm), each to 3 significant figures. ($e = 1.602\times10^{-19}$ C)'
  answers:
    - {name: v, label: 'Speed', format: sci, relTolerance: 0.01, units: {'m/s': 1}}
    - {format: sig4, name: rcm, label: 'Radius', relTolerance: 0.01, units: {cm: 1, m: 100, mm: 0.1}}
  solution: |-
    $m = {A}(1.661\times10^{-27}) = {m:texsci}$ kg. From $\tfrac12mv^2 = eV$: $v = \sqrt{2eV/m} = \mathbf{{v:texsci}}$ m/s.

    $r = \dfrac{mv}{eB} = {r:texsci}$ m $=$ **{rcm:sig3} cm**.
- id: phys-wire-field
  title: Magnetic field of a long straight wire
  topic: Sources of magnetic field
  vars:
    I: {min: 1, max: 500}
    rcm: {min: 0.5, max: 200, step: 0.5}
  calc:
    B: 2e-7*I/(rcm/100)
    BuT: B*1e6
  prompt: 'A long straight wire carries {I:dp0} A. Find the magnetic field {rcm} cm from it, in microtesla to 3 significant figures. ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  answers:
    - {format: sig4, name: BuT, label: 'Field', relTolerance: 0.01, units: {'μT': 1, uT: 1, T: 1000000, mT: 1000}}
  solution: |-
    $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{(4\pi\times10^{-7})({I:dp0})}{2\pi({rcm}/100)} = {B:texsci}$ T $=$ **{BuT:sig3} μT**.
- id: phys-solenoid
  title: Field inside a solenoid
  topic: Sources of magnetic field
  vars:
    N: {min: 100, max: 5000, step: 100}
    lcm: {min: 5, max: 100, step: 5}
    I: {min: 0.1, max: 10, step: 0.1}
  calc:
    n: N/(lcm/100)
    BmT: 4*pi*1e-7*n*I*1000
  prompt: 'A long solenoid {lcm} cm long has {N:dp0} turns and carries {I} A. Find the number of turns per meter and the magnetic field inside (in mT), each to 3 significant figures. ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  answers:
    - {format: sig4, name: n, label: 'Turns per meter', relTolerance: 0.01, units: {'turns/m': 1, '/m': 1}}
    - {format: sig4, name: BmT, label: 'Field', relTolerance: 0.01, units: {mT: 1, T: 1000}}
  solution: |-
    Turns per meter: $n = \dfrac{\,N}{\ell} = \dfrac{{N:dp0}}{{lcm}/100\text{ m}} =$ **{n:sig3} turns/m**.

    $B = \mu_0nI = (4\pi\times10^{-7})({n:sig4})({I}) =$ **{BmT:sig3} mT**. Use turns per meter, not the total number of turns.
- id: phys-parallel-wires
  title: Force between parallel wires
  topic: Sources of magnetic field
  vars:
    I1: {min: 1, max: 100}
    I2: {min: 1, max: 100}
    dcm: {min: 0.5, max: 50, step: 0.5}
  calc:
    F: 2e-7*I1*I2/(dcm/100)
    FmN: F*1000
  prompt: 'Two long parallel wires {dcm} cm apart carry {I1} A and {I2} A in the same direction. Find the force per meter between them in mN/m, to 3 significant figures. (Then decide: is it attractive or repulsive?)'
  answers:
    - {format: sig4, name: FmN, label: 'Force per meter', relTolerance: 0.01, units: {'mN/m': 1, 'N/m': 1000}}
  solution: |-
    $\dfrac FL = \dfrac{\mu_0I_1I_2}{2\pi d} = \dfrac{(2\times10^{-7})({I1})({I2})}{{dcm}/100} =$ **{FmN:sig3} mN/m**, attractive (currents in the same direction attract).
- id: phys-hall-voltage
  title: Hall voltage and drift speed
  topic: Hall effect
  vars:
    mat: {choices: [{label: 'copper ($8.5\times10^{28}$ free electrons per m³)', value: 8.5e+28}, {label: 'silver ($5.9\times10^{28}$ free electrons per m³)', value: 5.9e+28}, {label: 'aluminum ($1.8\times10^{29}$ free electrons per m³)', value: 1.8e+29}]}
    I: {min: 1, max: 40}
    B: {min: 0.2, max: 2.5, step: 0.1}
    tmm: {min: 0.1, max: 2, step: 0.1}
    wcm: {min: 0.5, max: 4, step: 0.5}
  calc:
    nn: mat*1
    VH: I*B/(mat*1.602e-19*tmm*1e-3)
    vd: I/(mat*1.602e-19*(wcm/100)*(tmm/1000))
  prompt: 'A strip of {mat} is {wcm} cm wide and {tmm} mm thick. It carries {I} A along its length, in a {B} T field perpendicular to its face. Find the Hall voltage (V) and the electrons'' drift speed (m/s), each to 3 significant figures. ($e = 1.602\times10^{-19}$ C)'
  answers:
    - {name: VH, label: '$V_H =$', format: sci, relTolerance: 0.01, units: {V: 1, mV: 0.001, 'μV': 1.0e-6, uV: 1.0e-6}}
    - {name: vd, label: '$v_d =$', format: sci, relTolerance: 0.01, units: {'m/s': 1}}
  solution: |-
    The thickness along $\vec B$ is what matters: $V_H = \dfrac{IB}{nqt} = \dfrac{({I})({B})}{({nn:texsci})(1.602\times10^{-19})({tmm}\times10^{-3})} = \mathbf{{VH:texsci}}$ V.

    $v_d = \dfrac{\,I}{nqA} = \dfrac{{I}}{({nn:texsci})(1.602\times10^{-19})({wcm}\times10^{-2})({tmm}\times10^{-3})} = \mathbf{{vd:texsci}}$ m/s. Check: $v_dBw$ gives the same Hall voltage.
- id: phys-magnetic-core
  title: Solenoid with a ferromagnetic core
  topic: Magnetic materials
  vars:
    N: {min: 100, max: 2000, step: 100}
    lcm: {min: 10, max: 50, step: 5}
    I: {min: 0.01, max: 0.5, step: 0.01}
    Km: {choices: [200, 500, 1000, 2000, 5000]}
  calc:
    n: N/(lcm/100)
    B0mT: 4*pi*1e-7*n*I*1000
    B: Km*B0mT/1000
    M: (Km - 1)*n*I
  where: ['B > 0.05', 'B < 1.8']
  prompt: 'A solenoid {lcm} cm long has {N:dp0} turns and carries {I} A. Find the field inside (a) when it is empty, in mT, and (b) when it is filled with iron of relative permeability {Km:dp0}, in T. (c) Find the iron''s magnetization in A/m. Give each to 3 significant figures. ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  answers:
    - {format: sig4, name: B0mT, label: '(a) $B_0 =$', relTolerance: 0.01, units: {mT: 1, T: 1000}}
    - {format: sig4, name: B, label: '(b) $B =$', relTolerance: 0.01, units: {T: 1, mT: 0.001}}
    - {name: M, label: '(c) $M =$', format: sci, relTolerance: 0.01, units: {'A/m': 1}}
  solution: |-
    $n = \dfrac{{N:dp0}}{{lcm}/100\text{ m}} = {n:sig4}$ turns/m.

    (a) $B_0 = \mu_0nI = (4\pi\times10^{-7})({n:sig4})({I}) =$ **{B0mT:sig3} mT**.

    (b) $B = K_mB_0 = {Km:dp0}({B0mT:sig4}\text{ mT}) =$ **{B:sig3} T**.

    (c) $M = \dfrac{B - B_0}{\mu_0} = (K_m - 1)nI = ({Km:dp0} - 1)({n:sig4})({I}) = \mathbf{{M:texsci}}$ A/m.
- id: phys-faraday-emf
  title: Induced emf in a coil
  topic: Electromagnetic induction
  vars:
    N: {min: 10, max: 1000, step: 10}
    A: {min: 0.001, max: 0.05, step: 0.001}
    B1: {min: 0, max: 1, step: 0.05}
    B2: {min: 0, max: 1.5, step: 0.05}
    t: {min: 0.01, max: 2, step: 0.01}
    R: {min: 1, max: 100}
  where: ['abs(B2 - B1) > 0.04']
  calc:
    emf: N*abs(B2 - B1)*A/t
    I: emf/R
  prompt: 'A {N:dp0}-turn coil of area {A:dp3} m² lies perpendicular to a magnetic field that changes steadily from {B1} T to {B2} T in {t} s. Find the magnitude of the induced emf (V) and, if the coil''s resistance is {R} Ω, the induced current (A), each to 3 significant figures.'
  answers:
    - {format: sig4, name: emf, label: 'emf', relTolerance: 0.01, units: {V: 1, mV: 0.001}}
    - {format: sig4, name: I, label: 'Current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    $|\Delta\Phi_B| = |{B2} - {B1}|({A:dp3})$ Wb per turn.

    $|\mathcal{E}| = N\dfrac{|\Delta\Phi_B|}{\Delta t} =$ **{emf:sig3} V**; $I = \mathcal{E}/R =$ **{I:sig3} A**, directed to oppose the change in flux.
- id: phys-motional-emf
  title: Sliding rod on rails
  topic: Electromagnetic induction
  vars:
    B: {min: 0.1, max: 2, step: 0.1}
    L: {min: 0.1, max: 2, step: 0.1}
    v: {min: 0.5, max: 20, step: 0.5}
    R: {min: 0.5, max: 20, step: 0.5}
  calc:
    emf: B*L*v
    I: emf/R
    F: I*L*B
  prompt: 'A rod {L} m long slides at {v} m/s along conducting rails in a {B} T field perpendicular to the rails. The rails are joined by a {R} Ω resistor. Find the emf (V), the current (A), and the force (N) needed to keep the rod moving at constant speed, each to 3 significant figures.'
  answers:
    - {format: sig4, name: emf, label: 'emf', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: I, label: 'Current', relTolerance: 0.01, units: {A: 1}}
    - {format: sig4, name: F, label: 'Force', relTolerance: 0.01, units: {N: 1}}
  solution: |-
    $\mathcal{E} = BLv = ({B})({L})({v}) =$ **{emf:sig3} V**; $I = \mathcal{E}/R =$ **{I:sig3} A**.

    The field pushes back on the current with $F = ILB$, so you must push with **{F:sig3} N** (power $Fv = I^2R$).
- id: phys-transformer
  title: Ideal transformer
  topic: Electromagnetic induction
  vars:
    Vp: {choices: [120, 240, 480, 7200]}
    Np: {min: 50, max: 2000, step: 50}
    Ns: {min: 10, max: 2000, step: 10}
    Is: {min: 0.1, max: 20, step: 0.1}
  where: ['Ns != Np']
  calc:
    Vs: Vp*Ns/Np
    Ip: Vs*Is/Vp
  prompt: 'An ideal transformer has {Np:dp0} primary turns and {Ns:dp0} secondary turns, with {Vp:dp0} V (rms) on the primary. Find the secondary voltage (V) and, if the secondary delivers {Is} A, the primary current (A), each to 3 significant figures.'
  answers:
    - {format: sig4, name: Vs, label: 'Secondary voltage', relTolerance: 0.01, units: {V: 1, kV: 1000}}
    - {format: sig4, name: Ip, label: 'Primary current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    $V_s = V_p\dfrac{N_s}{N_p} = {Vp:dp0}\cdot\dfrac{{Ns:dp0}}{{Np:dp0}} =$ **{Vs:sig3} V**.

    Power is conserved: $I_p = \dfrac{V_sI_s}{V_p} =$ **{Ip:sig3} A**.
- id: phys-rl-time
  title: RL circuit current growth
  topic: Inductance
  vars:
    L: {min: 0.01, max: 2, step: 0.01}
    R: {min: 1, max: 200}
    Ev: {min: 3, max: 48}
    n: {min: 0.2, max: 4, step: 0.1}
  calc:
    taums: L/R*1000
    Imax: Ev/R
    tms0: n*taums
    tms: round(tms0, 2 - floor(log10(tms0)))
    ratio: tms/taums
    I: Imax*(1 - exp(-ratio))
  prompt: 'A {L} H inductor and a {R} Ω resistor are connected in series to a {Ev} V battery at $t = 0$. Find the time constant (ms), the final current (A), and the current (A) at $t = {tms:sig3}$ ms, each to 3 significant figures.'
  answers:
    - {format: sig4, name: taums, label: 'Time constant', relTolerance: 0.01, units: {ms: 1, s: 1000}}
    - {format: sig4, name: Imax, label: 'Final current', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {format: sig4, name: I, label: 'Current at t', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    $\tau = L/R = {L}/{R}$ s $=$ **{taums:sig3} ms**. Final current $\mathcal{E}/R = {Ev}/{R} =$ **{Imax:sig3} A**.

    $t/\tau = {tms:sig3}/{taums:sig4} = {ratio:num4}$, so $I = \dfrac{\mathcal{E}}{\,R}(1 - e^{-t/\tau}) = {Imax:sig4}(1 - e^{-{ratio:num4}}) =$ **{I:sig3} A**.
- id: phys-lc-frequency
  title: LC resonant frequency
  topic: Inductance
  vars:
    L: {min: 0.1, max: 100, step: 0.1}
    C: {min: 1, max: 1000}
  calc:
    f: 1/(2*pi*sqrt(L*1e-3*C*1e-9))
    fk: f/1000
  prompt: 'An LC circuit has a {L} mH inductor and a {C:dp0} nF capacitor. Find its resonant frequency in kHz, to 3 significant figures.'
  answers:
    - {format: sig4, name: fk, label: 'Frequency', relTolerance: 0.01, units: {kHz: 1, Hz: 0.001, MHz: 1000}}
  solution: |-
    $f = \dfrac{1}{2\pi\sqrt{LC}} = \dfrac{1}{2\pi\sqrt{({L}\times10^{-3})({C:dp0}\times10^{-9})}} =$ **{fk:sig3} kHz**.
- id: phys-ac-rms
  title: RMS values and reactance
  topic: AC circuits
  vars:
    V0: {min: 10, max: 400, step: 5}
    R: {min: 5, max: 500, step: 5}
    f: {choices: [50, 60, 400, 1000]}
    C: {min: 1, max: 100}
  calc:
    Vr: V0/sqrt(2)
    P: Vr^2/R
    XC: 1/(2*pi*f*C*1e-6)
  prompt: 'An AC source has peak voltage {V0} V and frequency {f} Hz. Find (a) its rms voltage, (b) the average power it delivers to a {R} Ω resistor, and (c) the reactance of a {C} μF capacitor at this frequency. Give each to 3 significant figures.'
  answers:
    - {format: sig4, name: Vr, label: '(a) rms voltage', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: P, label: '(b) Power', relTolerance: 0.01, units: {W: 1}}
    - {format: sig4, name: XC, label: '(c) Reactance', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
  solution: |-
    (a) $V_{\text{rms}} = V_0/\sqrt2 =$ **{Vr:sig3} V**.

    (b) $P = V_{\text{rms}}^2/R =$ **{P:sig3} W** (not $V_0^2/R$, which is the peak power).

    (c) $X_C = \dfrac{1}{2\pi fC} = \dfrac{1}{2\pi({f:dp0})({C}\times10^{-6})} =$ **{XC:sig3} Ω**.
- id: phys-power-factor
  title: Phase angle and power in a series RLC circuit
  topic: AC circuits
  vars:
    Vr: {min: 12, max: 240, step: 6}
    R: {min: 20, max: 200, step: 5}
    LmH: {min: 5, max: 300, step: 5}
    CuF: {min: 1, max: 50}
    f: {choices: [60, 400, 1000]}
  calc:
    XL: 2*pi*f*LmH*1e-3
    XC: 1/(2*pi*f*CuF*1e-6)
    Z: sqrt(R^2 + (XL - XC)^2)
    phi: atand((XL - XC)/R)
    pf: R/Z
    I: Vr/Z
    P: I^2*R
  where: ['XL < 4*R', 'XC < 4*R', 'abs(XL - XC) > 0.05*R']
  prompt: 'A {Vr:dp0} V (rms), {f:dp0} Hz source drives a series circuit of a {R:dp0} Ω resistor, a {LmH:dp0} mH inductor and a {CuF:dp0} μF capacitor. Find the impedance (Ω, 3 significant figures), the phase angle $\phi$ (degrees to the nearest 0.1°, positive if the current lags), and the average power delivered (W, 3 significant figures).'
  answers:
    - {format: sig4, name: Z, label: '$Z =$', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
    - {format: sig4, name: phi, label: '$\phi =$', tolerance: 0.3, units: {'°': 1, deg: 1}}
    - {format: sig4, name: P, label: '$P =$', relTolerance: 0.015, units: {W: 1}}
  solution: |-
    $X_L = 2\pi fL = 2\pi({f:dp0})({LmH:dp0}\times10^{-3}) = {XL:sig4}$ Ω and $X_C = \dfrac{1}{2\pi fC} = \dfrac{1}{2\pi({f:dp0})({CuF:dp0}\times10^{-6})} = {XC:sig4}$ Ω.

    $Z = \sqrt{R^2 + (X_L - X_C)^2} = \sqrt{{R:dp0}^2 + ({XL:sig4} - {XC:sig4})^2} =$ **{Z:sig3} Ω**.

    $\tan\phi = \dfrac{X_L - X_C}{\,R}$, so $\phi =$ **{phi:num1}°** and the power factor is $\cos\phi = R/Z = {pf:dp3}$.

    $I_{\text{rms}} = V_{\text{rms}}/Z = {I:sig4}$ A, and $P = I_{\text{rms}}V_{\text{rms}}\cos\phi = I_{\text{rms}}^2R =$ **{P:sig3} W**.
