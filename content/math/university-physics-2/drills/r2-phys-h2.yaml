# Round 2 drills for honors module phys-h2 (lessons 90-93)
# Lesson 90: Maxwell's equations in differential form
- id: phys-h2-r2-divergence-charge
  title: Charge density from the divergence
  topic: Maxwell's equations
  vars:
    p1: {min: -9, max: 9}
    p2: {min: -9, max: 9}
    p3: {min: -9, max: 9}
  where: ['p1 != 0', 'p2 != 0', 'p3 != 0', 'p1 + p2 + p3 != 0']
  calc:
    dv: p1 + p2 + p3
    rho: 8.85*(p1 + p2 + p3)
  prompt: 'In a region the electric field is $\vec E = ({p1:coef}x\,\hat\imath {p2:signedcoef}y\,\hat\jmath {p3:signedcoef}z\,\hat k)\times10^3$ V/m² (with $x, y, z$ in meters). Find $\nabla\cdot\vec E$ in units of $10^3$ V/m², and the charge density $\rho$ in nC/m³ to 3 significant figures. Use $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²).'
  answers:
    - {name: dv, label: '$\nabla\cdot\vec E$ ($10^3$ V/m²)', tolerance: 0.001}
    - {name: rho, label: '$\rho$ (nC/m³)', sigfigs: 3, format: sig3}
  solution: |-
    Each component contributes its own partial derivative: $\nabla\cdot\vec E = ({p1} {p2:signed} {p3:signed})\times10^3 =$ **{dv}** $\times10^3$ V/m².

    Gauss's law at a point: $\rho = \varepsilon_0\nabla\cdot\vec E = (8.85\times10^{-12})({dv}\times10^3) =$ **{rho:sig3}** nC/m³ (a negative value means negative charge).
- id: phys-h2-r2-capacitor-b
  title: Magnetic field between charging capacitor plates
  topic: Maxwell's equations
  vars:
    Rcm: {min: 2, max: 10}
    cur: {min: 0.5, max: 5, step: 0.5}
    rcm: {min: 0.5, max: 9.5, step: 0.5}
  where: ['rcm < Rcm']
  calc:
    dEdt: cur/(8.85e-12*pi*(Rcm/100)^2)
    Bu: 1e6*4*pi*1e-7*cur*(rcm/100)/(2*pi*(Rcm/100)^2)
  prompt: 'A capacitor with circular plates of radius {Rcm} cm is charged by a steady current of {cur} A. Ignoring edge effects, find (a) $dE/dt$ between the plates in V/(m·s) and (b) the magnetic field in the gap {rcm} cm from the axis, in μT. Give 3 significant figures; use $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²) and $\mu_0 = 4\pi\times10^{-7}$ T·m/A.'
  answers:
    - {name: dEdt, label: '(a) V/(m·s)', sigfigs: 3, format: sci}
    - {name: Bu, label: '(b) μT', sigfigs: 3, format: sig3}
  solution: |-
    (a) $E = Q/(\varepsilon_0\pi R^2)$, so $\dfrac{dE}{dt} = \dfrac{I}{\varepsilon_0\pi R^2} = \dfrac{{cur}}{(8.85\times10^{-12})\pi({Rcm}\times10^{-2})^2} =$ **${dEdt:texsci}$** V/(m·s).

    (b) No conduction current crosses the gap, so the Ampère–Maxwell law on a circle of radius $r$ gives $B(2\pi r) = \mu_0\varepsilon_0\pi r^2\,dE/dt$, i.e. $B = \dfrac{\mu_0Ir}{2\pi R^2}$. With $r = {rcm}$ cm and $R = {Rcm}$ cm: $B =$ **{Bu:sig3}** μT.
# Lesson 91: electric and magnetic fields in relativity
- id: phys-h2-r2-field-transform
  title: Transforming E and B to a moving frame
  topic: Fields and relativity
  vars:
    Ey: {min: -50, max: 50, step: 5}
    Bz: {min: 0.1, max: 0.9, step: 0.1}
    b: {min: 0.1, max: 0.9, step: 0.1}
  where: ['abs(Ey - b*300*Bz) > 2', 'abs(Bz - b*Ey/300) > 0.02']
  calc:
    gam: 1/sqrt(1 - b^2)
    vB: b*300*Bz
    vE: b*Ey/300
    Ep: gam*(Ey - b*300*Bz)
    Bp: gam*(Bz - b*Ey/300)
  prompt: 'In the lab, $E_y = {Ey}$ MV/m and $B_z = {Bz}$ T; all other components are zero. An observer moves at ${b}c$ along $+x$. Find $E''_y$ (in MV/m) and $B''_z$ (in T) that the observer measures, to 3 significant figures, with signs. Use $c = 3.00\times10^8$ m/s.'
  answers:
    - {name: Ep, label: '$E''_y$ (MV/m)', sigfigs: 3, format: sig3}
    - {name: Bp, label: '$B''_z$ (T)', sigfigs: 3, format: sig3}
  solution: |-
    $\gamma = 1/\sqrt{1 - ({b})^2} = {gam:sig4}$. With $v = {b}c$: $vB_z = ({b})(3.00\times10^8)({Bz})$ V/m $= {vB:sig4}$ MV/m, and $vE_y/c^2 = {b}({Ey}\times10^6)/(3.00\times10^8) = {vE:sig4}$ T.

    $E'_y = \gamma(E_y - vB_z) = {gam:sig4}({Ey} - {vB:sig4}) =$ **{Ep:sig3}** MV/m.

    $B'_z = \gamma(B_z - vE_y/c^2) = {gam:sig4}({Bz} - {vE:sig4}) =$ **{Bp:sig3}** T.
- id: phys-h2-r2-wire-frames
  title: A wire's force in two frames
  topic: Fields and relativity
  vars:
    vm: {min: 1, max: 9}
    cur: {min: 2, max: 30}
    rcm: {min: 1, max: 10}
  calc:
    Bt: 4*pi*1e-7*cur/(2*pi*rcm/100)
    F17: 1.602e-19*vm*1e6*Bt*1e17
    lam10: vm*1e6*cur/9e16*1e10
    Ep: vm*1e6*cur/9e16/(2*pi*8.85e-12*rcm/100)
  prompt: 'A proton moves at ${vm}.0\times10^6$ m/s parallel to a long straight wire carrying {cur} A, in the direction of the current, {rcm} cm from the wire. Take $\gamma = 1$. Find (a) the magnetic force in the lab, in units of $10^{-17}$ N; (b) the size of the wire''s net line charge density in the proton''s frame, in units of $10^{-10}$ C/m; (c) the electric field that charge makes at the proton, in V/m. Give 3 significant figures; use $\mu_0 = 4\pi\times10^{-7}$ T·m/A, $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²), $c = 3.00\times10^8$ m/s, $e = 1.602\times10^{-19}$ C.'
  answers:
    - {name: F17, label: '(a) $10^{-17}$ N', sigfigs: 3, format: sig3}
    - {name: lam10, label: '(b) $10^{-10}$ C/m', sigfigs: 3, format: sig3}
    - {name: Ep, label: '(c) V/m', sigfigs: 3, format: sig3}
  solution: |-
    (a) $B = \dfrac{\mu_0I}{2\pi r} = \dfrac{(4\pi\times10^{-7})({cur})}{2\pi({rcm}\times10^{-2})} = {Bt:texsci}$ T, so $F = evB =$ **{F17:sig3}** $\times10^{-17}$ N, toward the wire.

    (b) In the proton's frame the wire's net density has size $\lambda' = \dfrac{vI}{c^2} = \dfrac{({vm}.0\times10^6)({cur})}{(3.00\times10^8)^2} =$ **{lam10:sig3}** $\times10^{-10}$ C/m (negative, since the proton moves along the current).

    (c) $E' = \dfrac{\lambda'}{2\pi\varepsilon_0r} =$ **{Ep:sig3}** V/m, toward the wire. Check: $eE'$ matches the lab force from (a), as it must when $\gamma \approx 1$.
# Lesson 92: radiation from accelerating charges
- id: phys-h2-r2-larmor-cyclotron
  title: Radiation from a circling electron
  topic: Radiation from accelerating charges
  vars:
    vm: {min: 1, max: 20}
    Bf: {min: 0.1, max: 2.0, step: 0.1}
  calc:
    acc: 1.602e-19*vm*1e6*Bf/9.11e-31
    P: (1.602e-19)^2*acc^2/(6*pi*8.85e-12*(3e8)^3)
    K: 0.5*9.11e-31*(vm*1e6)^2
    tau: 0.5*9.11e-31*(vm*1e6)^2/((1.602e-19)^2*acc^2/(6*pi*8.85e-12*(3e8)^3))
  prompt: 'An electron moves at ${vm}\times10^6$ m/s perpendicular to a uniform {Bf} T magnetic field. Find (a) its acceleration in m/s², (b) the power it radiates in W, and (c) the time $K/P$ in seconds. Give 3 significant figures; use $e = 1.602\times10^{-19}$ C, $m_e = 9.11\times10^{-31}$ kg, $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²), $c = 3.00\times10^8$ m/s.'
  answers:
    - {name: acc, label: '(a) m/s²', sigfigs: 3, format: sci}
    - {name: P, label: '(b) W', sigfigs: 3, format: sci}
    - {name: tau, label: '(c) s', sigfigs: 3, format: sig3}
  solution: |-
    (a) The magnetic force $evB$ is the centripetal force: $a = \dfrac{evB}{m_e} =$ **${acc:texsci}$** m/s².

    (b) Larmor: $P = \dfrac{e^2a^2}{6\pi\varepsilon_0c^3} =$ **${P:texsci}$** W.

    (c) $K = \tfrac12m_ev^2 = {K:texsci}$ J, so $K/P =$ **{tau:sig3}** s. Since $P \propto v^2 \propto K$, this time does not depend on the speed, only on $B$.
- id: phys-h2-r2-correspondence
  title: Correspondence in hydrogen
  topic: Radiation from accelerating charges
  vars:
    n: {min: 3, max: 60}
  calc:
    forb: 6.572e15/n^3
    fph: 3.286e15*(2*n - 1)/(n^2*(n - 1)^2)
    ratio: n*(2*n - 1)/(2*(n - 1)^2)
  prompt: 'For hydrogen in the Bohr model, find (a) the classical orbital frequency in orbit $n = {n}$, $f_{\text{orbit}} = 6.572\times10^{15}\text{ Hz}/n^3$; (b) the frequency of the photon emitted in the jump from $n = {n}$ to $n - 1$, using $13.6\text{ eV}/h = 3.286\times10^{15}$ Hz; (c) the ratio $f_{\text{photon}}/f_{\text{orbit}}$. Give (a) and (b) to 3 significant figures and (c) to 3 decimal places.'
  answers:
    - {name: forb, label: '(a) Hz', sigfigs: 3, format: sci}
    - {name: fph, label: '(b) Hz', sigfigs: 3, format: sci}
    - {name: ratio, label: '(c)', tolerance: 0.0006, format: dp3}
  solution: |-
    (a) $f_{\text{orbit}} = 6.572\times10^{15}/{n}^3 =$ **${forb:texsci}$** Hz.

    (b) $f_{\text{photon}} = (3.286\times10^{15})\left(\dfrac{1}{({n} - 1)^2} - \dfrac{1}{{n}^2}\right) = (3.286\times10^{15})\dfrac{2({n}) - 1}{{n}^2({n} - 1)^2} =$ **${fph:texsci}$** Hz.

    (c) The ratio is $\dfrac{n(2n - 1)}{2(n - 1)^2} =$ **{ratio:dp3}**, approaching 1 for large $n$ (the correspondence principle).
# Lesson 93: photons as relativistic particles
- id: phys-h2-r2-two-photon-mass
  title: Invariant mass of two photons
  topic: Four-momentum
  vars:
    E1: {min: 50, max: 500, step: 10}
    E2: {min: 50, max: 500, step: 10}
    th: {min: 10, max: 180}
  calc:
    M: sqrt(2*E1*E2*(1 - cosd(th)))
  prompt: 'Two photons leave the same point with energies {E1} MeV and {E2} MeV at an angle of {th}° to each other. Find their invariant mass $Mc^2$ in MeV, to 3 significant figures.'
  answers:
    - {name: M, label: '$Mc^2$ (MeV)', sigfigs: 3, format: sig3}
  solution: |-
    For two massless particles $M^2c^4 = (E_1 + E_2)^2 - |\vec p_1c + \vec p_2c|^2 = 2E_1E_2(1 - \cos\theta)$, so $Mc^2 = \sqrt{2({E1})({E2})(1 - \cos{th}^\circ)} =$ **{M:sig3}** MeV.
- id: phys-h2-r2-threshold
  title: Threshold energy for a fixed target
  topic: Four-momentum
  vars:
    rx:
      choices:
        - {label: '$p + p \to p + p + \pi^0$', value: 1}
        - {label: '$p + p \to p + n + \pi^+$', value: 2}
        - {label: '$p + p \to p + p + \eta$', value: 3}
        - {label: '$p + p \to p + p + p + \bar p$', value: 4}
        - {label: '$\gamma + p \to p + \pi^0$', value: 5}
        - {label: '$\gamma + p \to n + \pi^+$', value: 6}
        - {label: '$\pi^- + p \to K^0 + \Lambda$', value: 7}
  calc:
    mb: if(rx == 5 or rx == 6, 0, if(rx == 7, 139.6, 938.3))
    mt: 2*469.15
    MM: if(rx == 1, 2011.6, if(rx == 2, 2017.5, if(rx == 3, 2424.5, if(rx == 4, 3753.2, if(rx == 5, 1073.3, if(rx == 6, 1079.2, 1613.3))))))
    K: (MM^2 - (mb + mt)^2)/(2*mt)
  prompt: 'A beam hits protons at rest in the reaction {rx}. Find the threshold kinetic energy of the beam particle in MeV, to 3 significant figures. Rest energies (MeV): $p$ 938.3, $n$ 939.6, $\pi^0$ 135.0, $\pi^\pm$ 139.6, $\eta$ 547.9, $K^0$ 497.6, $\Lambda$ 1115.7; the photon is massless.'
  answers:
    - {name: K, label: '$K_{\text{th}}$ (MeV)', sigfigs: 3, format: sig3}
  solution: |-
    Beam rest energy $m_bc^2 = {mb:dp1}$ MeV, target $m_tc^2 = {mt:dp1}$ MeV, total rest energy of the products $Mc^2 = {MM:dp1}$ MeV. At threshold the invariant mass of beam plus target just equals $M$:

    $K_{\text{th}} = \dfrac{M^2 - (m_b + m_t)^2}{2m_t}c^2 = \dfrac{({MM:dp1})^2 - ({mb:dp1} + {mt:dp1})^2}{2({mt:dp1})} =$ **{K:sig3}** MeV.
