# Round 2 drills for phys-m10 (Magnetism and induction), used by the honors lessons.

- id: phys-m10-r2-loop-axis
  title: Field on the axis of a coil
  topic: Magnetic field calculations
  vars:
    N: {min: 1, max: 200}
    Rcm: {min: 2, max: 20}
    I: {min: 0.5, max: 10, step: 0.5}
    zcm: {min: 1, max: 40}
  calc:
    R: Rcm/100
    z: zcm/100
    Bc: N*4*pi*1e-7*I/(2*R)*1e6
    Bz: N*4*pi*1e-7*I*R^2/(2*(R^2 + z^2)^1.5)*1e6
    s3: (R^2 + z^2)^1.5
  where: ['Bz > 0.1']
  prompt: 'A flat coil of {N:dp0} turns and radius {Rcm:dp0} cm carries {I} A. Find the magnetic field at its center and on its axis {zcm:dp0} cm from the center, each in μT to 3 significant figures. ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  answers:
    - {name: Bc, label: 'At the center', format: sig4, relTolerance: 0.01, units: {'μT': 1, uT: 1, mT: 1000, T: 1000000}}
    - {name: Bz, label: 'On the axis', format: sig4, relTolerance: 0.01, units: {'μT': 1, uT: 1, mT: 1000, T: 1000000}}
  solution: |-
    Center: $B = \dfrac{N\mu_0I}{2R} = \dfrac{({N:dp0})(4\pi\times10^{-7})({I})}{2({R:sig3})}$ T $=$ **{Bc:sig3} μT**.

    Axis: $(R^2 + z^2)^{3/2} = {s3:texsci}$ m³, so $B = \dfrac{N\mu_0IR^2}{2(R^2 + z^2)^{3/2}} =$ **{Bz:sig3} μT**.
- id: phys-m10-r2-helmholtz
  title: Helmholtz coils
  topic: Magnetic field calculations
  vars:
    Rcm: {min: 10, max: 50, step: 5}
    N: {min: 10, max: 200, step: 10}
    I: {min: 0.5, max: 5, step: 0.5}
    Bt: {min: 20, max: 200, step: 10}
  calc:
    k: (4/5)^1.5
    B: k*4*pi*1e-7*N*I/(Rcm/100)*1e6
    I2: Bt*1e-6*(Rcm/100)/(k*4*pi*1e-7*N)
  prompt: 'A Helmholtz pair has coils of radius {Rcm:dp0} cm, {N:dp0} turns each, separated by one radius. (a) With {I} A in both coils, find the field at the midpoint in μT. (b) What current gives a midpoint field of {Bt:dp0} μT? Give each to 3 significant figures. ($\mu_0 = 4\pi\times10^{-7}$ T·m/A)'
  answers:
    - {name: B, label: '(a) Field', format: sig4, relTolerance: 0.01, units: {'μT': 1, uT: 1, mT: 1000, T: 1000000}}
    - {name: I2, label: '(b) Current', format: sig4, relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    (a) $B = \left(\tfrac45\right)^{3/2}\dfrac{\mu_0NI}{R} = 0.7155\cdot\dfrac{(4\pi\times10^{-7})({N:dp0})({I})}{{Rcm:dp0}/100} =$ **{B:sig3} μT**.

    (b) $I = \dfrac{BR}{0.7155\,\mu_0N} = \dfrac{({Bt:dp0}\times10^{-6})({Rcm:dp0}/100)}{0.7155(4\pi\times10^{-7})({N:dp0})} =$ **{I2:sig3} A**.
- id: phys-m10-r2-wire-segment
  title: Field of a finite straight wire
  topic: Magnetic field calculations
  vars:
    Lcm: {min: 2, max: 100, step: 2}
    acm: {min: 1, max: 50}
    I: {min: 1, max: 50}
  calc:
    h: Lcm/2
    s: h/sqrt(h^2 + acm^2)
    B: 1e-7*I/(acm/100)*2*s*1e6
    Binf: 2e-7*I/(acm/100)*1e6
    pct: 100*s
  prompt: 'A straight wire {Lcm:dp0} cm long carries {I:dp0} A. A point is {acm:dp0} cm from the wire, on its perpendicular bisector. Find (a) the field at the point in μT and (b) that field as a percentage of what an infinitely long wire would give, each to 3 significant figures. ($\mu_0/4\pi = 10^{-7}$ T·m/A)'
  answers:
    - {name: B, label: '(a) Field', format: sig4, relTolerance: 0.01, units: {'μT': 1, uT: 1, mT: 1000, T: 1000000}}
    - {name: pct, label: '(b) Percentage', format: sig4, relTolerance: 0.01, units: {'%': 1}}
  solution: |-
    The ends are at angles $\pm\theta$ from the perpendicular, with $\sin\theta = \dfrac{{h:sig3}}{\sqrt{{h:sig3}^2 + {acm:dp0}^2}} = {s:sig4}$.

    (a) $B = \dfrac{\mu_0I}{4\pi a}(2\sin\theta) = \dfrac{(10^{-7})({I:dp0})}{{acm:dp0}/100}(2)({s:sig4}) =$ **{B:sig3} μT**.

    (b) The infinite wire gives $\dfrac{\mu_0I}{2\pi a} = {Binf:sig3}$ μT, so the ratio is $\sin\theta$: **{pct:sig3}%**.
- id: phys-m10-r2-induced-field
  title: Induced electric field of a solenoid
  topic: Induced electric fields
  vars:
    Rcm: {min: 2, max: 10}
    rate: {min: 1, max: 100}
    rcm: {min: 0.5, max: 30, step: 0.5}
  calc:
    E: if(rcm < Rcm, (rcm/100)/2*rate, (Rcm/100)^2/(2*rcm/100)*rate)
  where: ['rcm != Rcm', 'E > 0.01']
  prompt: 'A long solenoid of radius {Rcm:dp0} cm has a uniform interior field changing at {rate:dp0} T/s. Find the magnitude of the induced electric field {rcm} cm from its axis, in V/m to 3 significant figures.'
  answers:
    - {name: E, label: 'Field', format: sig4, relTolerance: 0.01, units: {'V/m': 1, 'mV/m': 0.001, 'N/C': 1}}
  solution: |-
    Faraday's law around a circle of radius $r$: $E(2\pi r) = \left|\dfrac{d\Phi_B}{dt}\right|$. If $r < R$ the circle encloses $\pi r^2B$, so $E = \dfrac r2\left|\dfrac{dB}{dt}\right|$; if $r > R$ it encloses all the flux $\pi R^2B$, so $E = \dfrac{R^2}{2r}\left|\dfrac{dB}{dt}\right|$.

    Here $r = {rcm}$ cm and $R = {Rcm:dp0}$ cm: $E =$ **{E:sig3} V/m**.
- id: phys-m10-r2-magnetic-braking
  title: Magnetic braking of a sliding rod
  topic: Induced electric fields
  vars:
    m: {min: 0.05, max: 1, step: 0.05}
    B: {min: 0.2, max: 1.5, step: 0.1}
    L: {min: 0.1, max: 1, step: 0.05}
    R: {min: 0.05, max: 2, step: 0.05}
    v0: {min: 1, max: 10, step: 0.5}
  calc:
    tau: m*R/(B^2*L^2)
    x: v0*tau
    v1: v0*exp(-1)
  where: ['tau > 0.01', 'tau < 50']
  prompt: 'A rod of mass {m} kg and length {L} m slides on frictionless rails in a {B} T field, in a circuit of total resistance {R} Ω. It is launched at {v0} m/s and left to coast. Find (a) the time constant of its slowdown in seconds and (b) the total distance it travels in meters, each to 3 significant figures.'
  answers:
    - {name: tau, label: '(a) Time constant', format: sig4, relTolerance: 0.01, units: {s: 1, ms: 0.001}}
    - {name: x, label: '(b) Distance', format: sig4, relTolerance: 0.01, units: {m: 1, cm: 0.01}}
  solution: |-
    The braking force is $B^2L^2v/R$, so $v = v_0e^{-t/\tau}$ with

    (a) $\tau = \dfrac{mR}{B^2L^2} = \dfrac{({m})({R})}{({B})^2({L})^2} =$ **{tau:sig3} s**.

    (b) Distance $= \int_0^\infty v\,dt = v_0\tau = ({v0})({tau:sig4}) =$ **{x:sig3} m**. (After one time constant the speed is down to {v1:sig3} m/s.)
- id: phys-m10-r2-back-emf
  title: Motor current and back emf
  topic: Induced electric fields
  vars:
    V: {choices: [6, 12, 24, 48, 120]}
    R: {min: 0.2, max: 5, step: 0.1}
    f: {min: 0.5, max: 0.97, step: 0.01}
  calc:
    eb: round(V*f, 1)
    I: (V - eb)/R
    P: eb*I
    eff: 100*eb/V
  where: ['V - eb > 0.05']
  prompt: 'A DC motor on a {V:dp0} V supply has a winding resistance of {R} Ω. At its running speed its back emf is {eb:num1} V. Find (a) the current in A, (b) the mechanical power delivered in W, and (c) the efficiency in percent, ignoring friction. Give each to 3 significant figures.'
  answers:
    - {name: I, label: '(a) Current', format: sig4, relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {name: P, label: '(b) Power', format: sig4, relTolerance: 0.01, units: {W: 1, kW: 1000}}
    - {name: eff, label: '(c) Efficiency', format: sig4, relTolerance: 0.01, units: {'%': 1}}
  solution: |-
    (a) $I = \dfrac{V - \mathcal{E}_b}{\,R} = \dfrac{{V:dp0} - {eb:num1}}{{R}} =$ **{I:sig3} A**.

    (b) $P = \mathcal{E}_bI = ({eb:num1})({I:sig4}) =$ **{P:sig3} W**.

    (c) Efficiency $= \mathcal{E}_b/V = {eb:num1}/{V:dp0} =$ **{eff:sig3}%**.
- id: phys-m10-r2-rlc-phasor
  title: Series RLC circuit with phasors
  topic: Driven RLC circuits
  vars:
    R: {min: 10, max: 100, step: 5}
    XL: {min: 10, max: 200, step: 5}
    XC: {min: 10, max: 200, step: 5}
    V: {min: 10, max: 240, step: 10}
  calc:
    Z: sqrt(R^2 + (XL - XC)^2)
    I: V/Z
    VL: I*XL
    phi: atand((XL - XC)/R)
  where: ['XL != XC']
  prompt: 'A series circuit with $R = {R:dp0}$ Ω, $X_L = {XL:dp0}$ Ω and $X_C = {XC:dp0}$ Ω is driven by a {V:dp0} V (rms) source. Find (a) the rms current in A and (b) the rms voltage across the inductor in V, each to 3 significant figures, and (c) the phase angle $\phi$ in degrees to 1 decimal place (positive when the current lags the voltage, negative when it leads).'
  answers:
    - {name: I, label: '(a) Current', format: sig4, relTolerance: 0.01, units: {A: 1, mA: 0.001}}
    - {name: VL, label: '(b) Inductor voltage', format: sig4, relTolerance: 0.01, units: {V: 1}}
    - {name: phi, label: '(c) Phase angle', format: num1, tolerance: 0.06, units: {'°': 1, deg: 1}}
  solution: |-
    $Z = \sqrt{R^2 + (X_L - X_C)^2} = \sqrt{{R:dp0}^2 + ({XL:dp0} - {XC:dp0})^2} = {Z:sig4}$ Ω.

    (a) $I = V/Z =$ **{I:sig3} A**. (b) $V_L = IX_L =$ **{VL:sig3} V** (it can exceed the source voltage; the element voltages add as phasors).

    (c) $\tan\phi = \dfrac{X_L - X_C}{\,R}$, so $\phi =$ **{phi:num1}°**.
- id: phys-m10-r2-rlc-resonance
  title: Resonance, Q and bandwidth
  topic: Driven RLC circuits
  vars:
    LmH: {min: 1, max: 500}
    CnF: {min: 1, max: 1000}
    R: {min: 1, max: 100}
  calc:
    w0: 1/sqrt(LmH*1e-3*CnF*1e-9)
    f0: w0/(2*pi)
    Q: w0*LmH*1e-3/R
    df: f0/Q
  where: ['Q > 2', 'Q < 500']
  prompt: 'A series RLC circuit has $L = {LmH:dp0}$ mH, $C = {CnF:dp0}$ nF and $R = {R:dp0}$ Ω. Find (a) its resonant frequency $f_0$ in Hz, (b) its quality factor $Q$, and (c) its bandwidth $\Delta f$ between the half-power points in Hz, each to 3 significant figures.'
  answers:
    - {name: f0, label: '(a) $f_0$', format: sig4, relTolerance: 0.01, units: {Hz: 1, kHz: 1000}}
    - {name: Q, label: '(b) $Q$', format: sig4, relTolerance: 0.01}
    - {name: df, label: '(c) $\Delta f$', format: sig4, relTolerance: 0.01, units: {Hz: 1, kHz: 1000}}
  solution: |-
    (a) $\omega_0 = \dfrac{1}{\sqrt{LC}} = {w0:sig4}$ rad/s, so $f_0 = \omega_0/2\pi =$ **{f0:sig3} Hz**.

    (b) $Q = \dfrac{\omega_0L}{\,R} =$ **{Q:sig3}**.

    (c) $\Delta f = \dfrac{f_0}{\,Q} = \dfrac{\,R}{2\pi L} =$ **{df:sig3} Hz**.
