# Round 2 drills for phys-m9 (Electric circuits): honors lessons 09h1 and 09h2.
- id: phys-m9-r2-thevenin
  title: Thévenin equivalent of two battery branches
  topic: Network analysis
  vars:
    E1: {min: 3, max: 24}
    R1: {min: 1, max: 10}
    E2: {min: 1, max: 18}
    R2: {min: 1, max: 10}
    RL: {min: 1, max: 20}
  calc:
    Vth: (E1*R2 + E2*R1)/(R1 + R2)
    Rth: R1*R2/(R1 + R2)
    IL: Vth/(Rth + RL)
  prompt: 'Two branches join junctions A and B: a {E1} V battery in series with {R1} Ω, and a {E2} V battery in series with {R2} Ω, both batteries with their $+$ terminal toward A. A load resistor $R_L = {RL}$ Ω is to be connected from A to B. Find the Thévenin voltage $V_A - V_B$ with the load removed (V), the Thévenin resistance (Ω), and the load current (A), to 3 significant figures.'
  answers:
    - {format: sig4, name: Vth, label: '$V_{\text{th}} =$', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: Rth, label: '$R_{\text{th}} =$', relTolerance: 0.01, units: {'Ω': 1, ohm: 1, ohms: 1}}
    - {format: sig4, name: IL, label: '$I_L =$', relTolerance: 0.01, units: {A: 1, mA: 0.001}}
  solution: |-
    With the load removed, node A has no net current in or out: $\dfrac{{E1} - V}{{R1}} + \dfrac{{E2} - V}{{R2}} = 0$, so $V_{\text{th}} = \dfrac{{E1}({R2}) + {E2}({R1})}{{R1} + {R2}} =$ **{Vth:sig3} V**.

    Replace both batteries with wires: {R1} Ω and {R2} Ω are in parallel, $R_{\text{th}} = \dfrac{({R1})({R2})}{{R1} + {R2}} =$ **{Rth:sig3} Ω**.

    $I_L = \dfrac{V_{\text{th}}}{R_{\text{th}} + R_L} = \dfrac{{Vth:sig4}}{{Rth:sig4} + {RL}} =$ **{IL:sig3} A**.
- id: phys-m9-r2-bridge
  title: Unbalanced Wheatstone bridge
  topic: Network analysis
  vars:
    Ev: {min: 5, max: 20}
    R1: {choices: [100, 150, 200, 220, 330, 470]}
    R2: {choices: [100, 150, 200, 220, 330, 470]}
    R3: {choices: [100, 150, 200, 220, 330, 470]}
    Rx: {min: 50, max: 500, step: 10}
    Rg: {min: 20, max: 200, step: 10}
  calc:
    Vc: Ev*R2/(R1 + R2)
    Vd: Ev*Rx/(R3 + Rx)
    Vth: Vd - Vc
    Rth: R1*R2/(R1 + R2) + R3*Rx/(R3 + Rx)
    aV: abs(Vth)
    Ig: aV/(Rth + Rg)*1000
  where: ['abs(Vth) > 0.05']
  prompt: 'A Wheatstone bridge has an ideal {Ev} V battery across its top and bottom corners. The left side has $R_1 = {R1}$ Ω (top) and $R_2 = {R2}$ Ω (bottom) meeting at point c; the right side has $R_3 = {R3}$ Ω (top) and $R_x = {Rx}$ Ω (bottom) meeting at point d. A galvanometer of resistance {Rg} Ω joins c and d. Find $V_d - V_c$ with the galvanometer removed (V, negative if c is higher), and the size of the galvanometer current (mA), to 3 significant figures.'
  answers:
    - {format: sig4, name: Vth, label: '$V_d - V_c =$', relTolerance: 0.01, units: {V: 1, mV: 0.001}}
    - {format: sig4, name: Ig, label: '$I_g =$', relTolerance: 0.01, units: {mA: 1, A: 1000}}
  solution: |-
    Potentials above the bottom corner: $V_c = {Ev}\cdot\dfrac{{R2}}{{R1} + {R2}} = {Vc:sig4}$ V and $V_d = {Ev}\cdot\dfrac{{Rx}}{{R3} + {Rx}} = {Vd:sig4}$ V, so $V_d - V_c =$ **{Vth:sig3} V**.

    With the battery replaced by a wire, $R_{\text{th}} = ({R1} \parallel {R2}) + ({R3} \parallel {Rx}) = {Rth:sig4}$ Ω.

    $I_g = \dfrac{|V_{\text{th}}|}{R_{\text{th}} + R_g} = \dfrac{{aV:sig4}}{{Rth:sig4} + {Rg}}$ A $=$ **{Ig:sig3} mA**.
- id: phys-m9-r2-delay
  title: Capacitor behind a voltage divider
  topic: Circuit transients
  vars:
    Ev: {min: 3, max: 24}
    R1: {min: 1, max: 10}
    R2: {min: 1, max: 20}
    C: {min: 1, max: 100}
    t: {min: 1, max: 400}
  calc:
    Vinf: Ev*R2/(R1 + R2)
    Rth: R1*R2/(R1 + R2)
    tau: Rth*C
    VC: Vinf*(1 - exp(-t/tau))
  where: ['t/tau >= 0.2', 't/tau <= 4']
  prompt: 'An ideal {Ev} V battery, a switch and $R_1 = {R1}$ kΩ are in series with a parallel pair: $R_2 = {R2}$ kΩ and an uncharged {C} μF capacitor. The switch closes at $t = 0$. Find the capacitor''s final voltage (V), the time constant (ms), and the capacitor voltage at $t = {t}$ ms (V), to 3 significant figures.'
  answers:
    - {format: sig4, name: Vinf, label: 'Final voltage', relTolerance: 0.01, units: {V: 1}}
    - {format: sig4, name: tau, label: 'Time constant', relTolerance: 0.01, units: {ms: 1, s: 1000}}
    - {format: sig4, name: VC, label: '$V_C$', relTolerance: 0.01, units: {V: 1}}
  solution: |-
    Final: the capacitor carries no current, so $R_1$ and $R_2$ form a divider: $V_\infty = {Ev}\cdot\dfrac{{R2}}{{R1} + {R2}} =$ **{Vinf:sig3} V**.

    Seen from the capacitor (battery replaced by a wire), $R_1 \parallel R_2 = {Rth:sig4}$ kΩ, so $\tau = R_{\text{th}}C = ({Rth:sig4}\text{ k}\Omega)({C}\ \mu\text{F}) =$ **{tau:sig3} ms** (kΩ × μF = ms).

    $V_C = V_\infty\left(1 - e^{-t/\tau}\right) = {Vinf:sig4}\left(1 - e^{-{t}/{tau:sig4}}\right) =$ **{VC:sig3} V**.
- id: phys-m9-r2-relaxation
  title: Relaxation oscillator period
  topic: Circuit transients
  vars:
    Ev: {min: 6, max: 24, step: 0.5}
    Von: {min: 2, max: 20, step: 0.5}
    Voff: {min: 0.5, max: 10, step: 0.5}
    R: {min: 1, max: 100}
    C: {min: 0.1, max: 10, step: 0.1}
  calc:
    tau: R*C
    T: R*C*ln((Ev - Voff)/(Ev - Von))
    f: 1000/T
  where: ['Voff <= Von - 1', 'Von <= Ev - 0.5']
  prompt: 'A relaxation oscillator charges a {C} μF capacitor through {R} kΩ from an ideal {Ev} V battery. A switch across the capacitor closes when its voltage reaches {Von} V and opens when it has fallen to {Voff} V; treat the discharge as instant. Find the period (ms) and the frequency (Hz), to 3 significant figures.'
  answers:
    - {format: sig4, name: T, label: 'Period', relTolerance: 0.01, units: {ms: 1, s: 1000}}
    - {format: sig4, name: f, label: 'Frequency', relTolerance: 0.01, units: {Hz: 1, kHz: 1000}}
  solution: |-
    $RC = ({R}\text{ k}\Omega)({C}\ \mu\text{F}) = {tau:sig4}$ ms. Each charge starts at $V_{\text{off}}$ and heads for $\mathcal{E}$, reaching $V_{\text{on}}$ after

    $T = RC\ln\dfrac{\mathcal{E} - V_{\text{off}}}{\mathcal{E} - V_{\text{on}}} = {tau:sig4}\ln\dfrac{{Ev} - {Voff}}{{Ev} - {Von}} =$ **{T:sig3} ms**.

    $f = 1/T =$ **{f:sig3} Hz**.
- id: phys-m9-r2-lowpass
  title: RC low-pass filter response
  topic: RC filters
  vars:
    R: {choices: [1, 2.2, 4.7, 10, 22, 47, 100]}
    C: {choices: [1, 2.2, 4.7, 10, 22, 47, 100, 220]}
    f: {choices: [50, 60, 100, 200, 500, 1000, 2000, 5000, 10000, 20000]}
  calc:
    RC: R*1e3*C*1e-9
    fc: 1/(2*pi*RC)
    x: 2*pi*f*RC
    gain: 1/sqrt(1 + x^2)
    lag: atand(x)
  where: ['f/fc >= 0.1', 'f/fc <= 10']
  prompt: 'An RC low-pass filter has $R = {R}$ kΩ and $C = {C}$ nF, with the output taken across the capacitor. Find its cutoff frequency (Hz), and for a {f} Hz sinusoidal input the gain $V_{\text{out}}/V_{\text{in}}$ and the phase lag (degrees), all to 3 significant figures.'
  answers:
    - {format: sig4, name: fc, label: '$f_c$', relTolerance: 0.01, units: {Hz: 1, kHz: 1000}}
    - {format: sig4, name: gain, label: 'Gain', relTolerance: 0.01}
    - {format: sig4, name: lag, label: 'Phase lag', relTolerance: 0.01, units: {'°': 1, deg: 1, degrees: 1}}
  solution: |-
    $RC = ({R}\times10^3)({C}\times10^{-9}) = {RC:texsci}$ s, so $f_c = \dfrac{1}{2\pi RC} =$ **{fc:sig3} Hz**.

    At {f} Hz: $\omega RC = 2\pi({f})({RC:texsci}) = {x:sig4}$.

    Gain $= \dfrac{1}{\sqrt{1 + ({x:sig4})^2}} =$ **{gain:sig3}**; lag $= \arctan({x:sig4}) =$ **{lag:sig3}°**.
