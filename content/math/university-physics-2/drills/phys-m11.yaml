- id: phys-em-wavelength
  title: Wavelength and frequency of EM waves
  topic: Electromagnetic waves
  vars:
    fm: {min: 1.0, max: 9.9, step: 0.1}
    fe: {choices: [6, 8, 9, 14, 17]}
  calc:
    f: fm*10^fe
    lam: 3e8/f
  prompt: 'An electromagnetic wave in vacuum has frequency ${fm}\times10^{{fe}}$ Hz. What is its wavelength in meters, to 3 significant figures? ($c = 3.00\times10^8$ m/s)'
  answers:
    - {name: lam, label: 'Wavelength', format: sci, relTolerance: 0.01, units: {m: 1, cm: 0.01, mm: 0.001, nm: 1e-9}}
  solution: |-
    $\lambda = \dfrac{c}{\,f} = \dfrac{3.00\times10^8}{{fm}\times10^{{fe}}} = \mathbf{{lam:texsci}}$ m. (Radio and microwaves have long wavelengths; visible light is a few hundred nanometers; X-rays are far shorter.)
- id: phys-snell
  title: Snell's law
  topic: Reflection and refraction
  vars:
    m1: {choices: [{label: air, value: 1.00}, {label: water, value: 1.33}]}
    m2: {choices: [{label: 'glass (n = 1.50)', value: 1.50}, {label: 'diamond (n = 2.42)', value: 2.42}, {label: 'crown glass (n = 1.52)', value: 1.52}, {label: 'acrylic (n = 1.49)', value: 1.49}]}
    t1: {min: 10, max: 80, step: 1}
  calc:
    t2: asind(m1*sind(t1)/m2)
    v: 3e8/m2
  prompt: 'Light in {m1} (n = {m1:num2}) strikes {m2} at {t1}° from the normal. Find the angle of refraction (to the nearest 0.1°) and the speed of light in the second material (m/s, 3 significant figures). ($c = 3.00\times10^8$ m/s)'
  answers:
    - {format: sig4, name: t2, label: 'Refraction angle', tolerance: 0.2, units: {'°': 1, deg: 1}}
    - {name: v, label: 'Speed', format: sci, relTolerance: 0.01, units: {'m/s': 1}}
  solution: |-
    $n_1\sin\theta_1 = n_2\sin\theta_2$: $\sin\theta_2 = \dfrac{{m1:num2}\sin {t1}^\circ}{{m2:num2}}$, so $\theta_2 =$ **{t2:num1}°** (bent toward the normal).

    $v = c/n = \mathbf{{v:texsci}}$ m/s.
- id: phys-critical-angle
  title: Critical angle for total internal reflection
  topic: Reflection and refraction
  vars:
    n1: {min: 1.35, max: 2.5, step: 0.01}
    out: {choices: [{label: air, value: 1.00}, {label: 'water (n = 1.33)', value: 1.33}]}
  where: ['n1 > out + 0.05']
  calc:
    tc: asind(out/n1)
  prompt: 'Light travels inside a material with $n = {n1}$ toward a boundary with {out}. What is the critical angle for total internal reflection, to the nearest 0.1°?'
  answers:
    - {format: sig4, name: tc, label: 'Critical angle', tolerance: 0.2, units: {'°': 1, deg: 1}}
  solution: |-
    $\sin\theta_c = \dfrac{n_2}{n_1} = \dfrac{{out:num2}}{{n1}}$, so $\theta_c =$ **{tc:num1}°**. Rays hitting the boundary at more than this angle (from the normal) are totally reflected.
- id: phys-malus
  title: Light through polarizers
  topic: Electromagnetic waves
  vars:
    I0: {min: 50, max: 1000, step: 10}
    th: {min: 5, max: 85, step: 5}
  calc:
    I1: I0/2
    I2: I1*cosd(th)^2
  prompt: 'Unpolarized light of intensity {I0:dp0} W/m² passes through a polarizer, then a second polarizer whose axis is at {th}° to the first. Find the intensity after each polarizer, in W/m² to 3 significant figures.'
  answers:
    - {format: sig4, name: I1, label: 'After first', relTolerance: 0.01, units: {'W/m²': 1, 'W/m^2': 1}}
    - {format: sig4, name: I2, label: 'After second', relTolerance: 0.01, units: {'W/m²': 1, 'W/m^2': 1}}
  solution: |-
    The first polarizer passes half of unpolarized light: $I_1 = {I0:dp0}/2 =$ **{I1:num1} W/m²**.

    Malus's law: $I_2 = I_1\cos^2\theta = {I1:num1}\cos^2 {th}^\circ =$ **{I2:sig3} W/m²**.
- id: phys-brewster
  title: Brewster's angle
  topic: Electromagnetic waves
  vars:
    n1: {choices: [{label: air, value: 1.00}, {label: water, value: 1.33}]}
    n2: {choices: [{label: 'crown glass ($n = 1.52$)', value: 1.52}, {label: 'flint glass ($n = 1.65$)', value: 1.65}, {label: 'acrylic ($n = 1.49$)', value: 1.49}, {label: 'diamond ($n = 2.42$)', value: 2.42}, {label: 'sapphire ($n = 1.77$)', value: 1.77}]}
  calc:
    tB: atand(n2/n1)
    t2: 90 - tB
  prompt: 'Unpolarized light in {n1} ($n = {n1:num2}$) reflects from a flat surface of {n2}. At what angle of incidence is the reflected light completely polarized, and what is the angle of refraction at that incidence? Give both in degrees to the nearest 0.1°.'
  answers:
    - {format: sig4, name: tB, label: '$\theta_B =$', tolerance: 0.2, units: {'°': 1, deg: 1}}
    - {format: sig4, name: t2, label: '$\theta_2 =$', tolerance: 0.2, units: {'°': 1, deg: 1}}
  solution: |-
    Brewster's angle: $\tan\theta_B = \dfrac{n_2}{n_1} = \dfrac{{n2:num2}}{{n1:num2}}$, so $\theta_B =$ **{tB:num1}°**.

    At Brewster's angle the reflected and refracted rays are perpendicular, so $\theta_2 = 90^\circ - \theta_B =$ **{t2:num1}°**. (Check with Snell's law: ${n1:num2}\sin {tB:num1}^\circ = {n2:num2}\sin {t2:num1}^\circ$.)
- id: phys-em-intensity
  title: Intensity and fields from a point source
  topic: Energy in electromagnetic waves
  vars:
    Pw: {min: 5, max: 500, step: 5}
    r: {min: 0.5, max: 20, step: 0.5}
  calc:
    I: Pw/(4*pi*r^2)
    E0: sqrt(2*I/(3.00e8*8.85e-12))
    B0: E0/3.00e8
  prompt: 'A small source radiates {Pw:dp0} W of electromagnetic power equally in all directions. At {r} m from it, find the intensity (W/m²), the peak electric field (V/m) and the peak magnetic field (T), each to 3 significant figures. ($c = 3.00\times10^8$ m/s, $\varepsilon_0 = 8.85\times10^{-12}$ C²/(N·m²))'
  answers:
    - {format: sig4, name: I, label: '$I =$', relTolerance: 0.01, units: {'W/m²': 1, 'W/m^2': 1}}
    - {format: sig4, name: E0, label: '$E_0 =$', relTolerance: 0.01, units: {'V/m': 1, 'N/C': 1}}
    - {name: B0, label: '$B_0 =$', format: sci, relTolerance: 0.01, units: {T: 1}}
  solution: |-
    The power spreads over a sphere: $I = \dfrac{P}{4\pi r^2} = \dfrac{{Pw:dp0}}{4\pi({r})^2} =$ **{I:sig3} W/m²**.

    From $I = \tfrac12c\varepsilon_0E_0^2$: $E_0 = \sqrt{\dfrac{2I}{c\varepsilon_0}} = \sqrt{\dfrac{2({I:sig4})}{(3.00\times10^8)(8.85\times10^{-12})}} =$ **{E0:sig3} V/m**.

    $B_0 = \dfrac{E_0}{c} = \dfrac{{E0:sig4}}{3.00\times10^8} = \mathbf{{B0:texsci}}$ T.
- id: phys-radiation-pressure
  title: Radiation pressure and force
  topic: Energy in electromagnetic waves
  vars:
    I: {min: 100, max: 5000, step: 50}
    surf: {choices: [{label: 'absorbs it completely', value: 1}, {label: 'reflects it straight back', value: 2}]}
    A: {min: 0.5, max: 50, step: 0.5}
  calc:
    Prad: surf*I/3.00e8
    F: Prad*A
  prompt: 'Light of intensity {I:dp0} W/m² falls head-on on a flat surface of area {A} m² that {surf}. Find the radiation pressure (Pa) and the force on the surface (N), each to 3 significant figures. ($c = 3.00\times10^8$ m/s)'
  answers:
    - {name: Prad, label: 'Pressure', format: sci, relTolerance: 0.01, units: {Pa: 1}}
    - {name: F, label: 'Force', format: sci, relTolerance: 0.01, units: {N: 1}}
  solution: |-
    The pressure is $I/c$ on a surface that absorbs and $2I/c$ on one that reflects. This surface {surf}, so $P_{\text{rad}} = \dfrac{{surf:dp0}\times{I:dp0}}{3.00\times10^8} = \mathbf{{Prad:texsci}}$ Pa.

    $F = P_{\text{rad}}A = ({Prad:texsci})({A}) = \mathbf{{F:texsci}}$ N.
- id: phys-thin-lens
  title: Thin lens image
  topic: Thin lenses
  vars:
    f: {choices: [-30, -20, -15, -10, 10, 15, 20, 25, 30, 40]}
    dob: {min: 5, max: 100, step: 5}
    ho: {min: 1, max: 10}
  where: ['dob != f', 'abs(dob - f) > 2', 'abs(1/(1/f - 1/dob) + 15.54) > 0.5']
  calc:
    di: 1/(1/f - 1/dob)
    m: -di/dob
    hi: m*ho
  prompt: 'A {ho} cm tall object stands {dob} cm from a thin lens of focal length {f} cm (negative = diverging). Find the image distance in cm (negative = virtual, same side as the object) and the magnification, each to 3 significant figures.'
  answers:
    - {format: sig4, name: di, label: '$d_i =$', relTolerance: 0.01, units: {cm: 1, m: 100}}
    - {format: sig4, name: m, label: '$m =$', relTolerance: 0.01}
  solution: |-
    $\dfrac1{d_i} = \dfrac1f - \dfrac1{d_o} = \dfrac{1}{{f}} - \dfrac{1}{{dob}}$, so $d_i =$ **{di:sig3} cm**.

    $m = -\dfrac{d_i}{d_o} =$ **{m:sig3}**, so the image is {hi:num2} cm tall (negative means inverted). A positive $d_i$ is a real image on the far side.
- id: phys-mirror
  title: Spherical mirror image
  topic: Mirrors
  vars:
    kind: {choices: [{label: concave, value: 1}, {label: convex, value: -1}]}
    R: {min: 10, max: 100, step: 10}
    dob: {min: 4, max: 120, step: 2}
  calc:
    f: kind*R/2
    di: 1/(1/f - 1/dob)
    m: -di/dob
  where: ['abs(dob - kind*R/2) > 1.5', 'abs(1/(1/(kind*R/2) - 1/dob) + 15.54) > 0.5']
  prompt: 'An object is {dob} cm in front of a {kind} mirror with radius of curvature {R} cm. Find the image distance in cm (negative = behind the mirror, virtual) and the magnification, each to 3 significant figures.'
  answers:
    - {format: sig4, name: di, label: '$d_i =$', relTolerance: 0.01, units: {cm: 1}}
    - {format: sig4, name: m, label: '$m =$', relTolerance: 0.01}
  solution: |-
    $f = \pm R/2$, positive for concave and negative for convex: $f = {f}$ cm.

    $\dfrac1{d_i} = \dfrac1f - \dfrac1{d_o}$, so $d_i =$ **{di:sig3} cm**; $m = -d_i/d_o =$ **{m:sig3}**.
- id: phys-two-lens
  title: Two-lens system
  topic: Thin lenses
  vars:
    f1: {min: 5, max: 20}
    f2: {min: 5, max: 30}
    d1: {min: 25, max: 60}
    sep: {min: 40, max: 120, step: 5}
  calc:
    img1: 1/(1/f1 - 1/d1)
    mag1: -img1/d1
    obj2: sep - img1
    img2: 1/(1/f2 - 1/obj2)
    m: (-img1/d1)*(-img2/obj2)
  where: ['d1 > f1 + 2', 'obj2 > f2 + 2', 'abs(m) > 0.05', 'abs(m + 15.54) > 0.5']
  prompt: 'An object is {d1} cm in front of a converging lens ($f_1 = {f1}$ cm). A second converging lens ($f_2 = {f2}$ cm) is {sep} cm beyond the first. Find the final image distance from the second lens (cm) and the overall magnification, each to 3 significant figures.'
  answers:
    - {format: sig4, name: img2, label: 'Final $d_i$', relTolerance: 0.01, units: {cm: 1}}
    - {format: sig4, name: m, label: 'Total $m$', relTolerance: 0.01}
  solution: |-
    Lens 1: $d_{i1} = \left(\dfrac{1}{{f1}} - \dfrac{1}{{d1}}\right)^{-1} = {img1:num2}$ cm, with $m_1 = -d_{i1}/d_{o1} = {mag1:num4}$.

    That image is the object for lens 2, at $d_{o2} = {sep} - {img1:num2} = {obj2:num2}$ cm.

    Lens 2: $d_{i2} = \left(\dfrac{1}{{f2}} - \dfrac{1}{{obj2:num2}}\right)^{-1} =$ **{img2:sig3} cm**.

    Total $m = m_1m_2 = \left(-\dfrac{d_{i1}}{d_{o1}}\right)\left(-\dfrac{d_{i2}}{d_{o2}}\right) =$ **{m:sig3}**.
- id: phys-spherical-surface
  title: Image formed by one refracting surface
  topic: Refraction at a curved surface
  vars:
    n1: {choices: [{label: air, value: 1.00}, {label: water, value: 1.33}]}
    n2: {choices: [{label: 'glass with $n = 1.50$', value: 1.50}, {label: 'glass with $n = 1.60$', value: 1.60}, {label: 'plastic with $n = 1.40$', value: 1.40}, {label: 'diamond, $n = 2.42$', value: 2.42}]}
    Rc: {min: -20, max: 20}
    dob: {min: 5, max: 60}
  calc:
    di: n2/((n2 - n1)/Rc - n1/dob)
    m: -(n1*di)/(n2*dob)
  where: ['abs(Rc) >= 2', 'abs(di) >= 2', 'abs(di) <= 150']
  prompt: 'An object in {n1} ($n_1 = {n1:num2}$) is {dob} cm in front of a spherical surface of {n2}, with $R = {Rc}$ cm (positive means the center of curvature is inside the second material). Find the image distance (cm; negative means a virtual image on the object''s side) and the lateral magnification, each to 3 significant figures.'
  answers:
    - {format: sig4, name: di, label: '$d_i =$', relTolerance: 0.01, units: {cm: 1, m: 100}}
    - {format: sig4, name: m, label: '$m =$', relTolerance: 0.01}
  solution: |-
    $\dfrac{n_1}{d_o} + \dfrac{n_2}{d_i} = \dfrac{n_2 - n_1}{R}$: $\dfrac{{n1:num2}}{{dob}} + \dfrac{{n2:num2}}{d_i} = \dfrac{{n2:num2} - {n1:num2}}{{Rc}}$, so $d_i =$ **{di:sig3} cm**.

    $m = -\dfrac{n_1d_i}{n_2d_o} = -\dfrac{({n1:num2})({di:sig4})}{({n2:num2})({dob})} =$ **{m:sig3}** (negative: inverted; positive: upright).
- id: phys-corrective-lens
  title: Corrective lenses
  topic: Optical instruments
  vars:
    far: {min: 20, max: 300, step: 10}
    near: {min: 40, max: 300, step: 5}
  calc:
    P1: -100/far
    P2: 100/25 - 100/near
  prompt: '(a) A nearsighted person has a far point of {far} cm. (b) A farsighted person has a near point of {near} cm and wants to read at 25 cm. Treating each lens as being at the eye, find the lens power each person needs, in diopters to 3 significant figures (include the sign).'
  answers:
    - {format: sig4, name: P1, label: '(a) $P =$', relTolerance: 0.01, units: {D: 1}}
    - {format: sig4, name: P2, label: '(b) $P =$', relTolerance: 0.01, units: {D: 1}}
  solution: |-
    (a) Distant objects ($d_o = \infty$) must appear at the far point, $d_i = -{far}$ cm: $P = \dfrac{1}{\,f} = \dfrac{1}{-{far}/100\text{ m}} =$ **{P1:sig3} D** (diverging).

    (b) An object at $d_o = 0.25$ m must appear at the near point, $d_i = -{near}/100$ m: $P = \dfrac{1}{0.25} + \dfrac{1}{-{near}/100} =$ **{P2:sig3} D** (converging).
- id: phys-microscope
  title: Compound microscope
  topic: Optical instruments
  vars:
    fo: {min: 0.2, max: 1.0, step: 0.05}
    dl: {min: 0.01, max: 0.06, step: 0.01}
    fe: {min: 1.0, max: 5.0, step: 0.5}
  calc:
    dob: round(fo + dl, 2)
    di: 1/(1/fo - 1/dob)
    mo: -di/dob
    Me: 25/fe
    M: mo*Me
  prompt: 'A compound microscope has an objective of focal length {fo:num2} cm and an eyepiece of focal length {fe:num1} cm. A specimen is {dob:num2} cm from the objective, and the final image is at infinity. Find the objective''s image distance (cm), the objective''s lateral magnification, and the overall magnification (use a 25 cm near point), each to 3 significant figures.'
  answers:
    - {format: sig4, name: di, label: '$d_i =$', relTolerance: 0.01, units: {cm: 1}}
    - {format: sig4, name: mo, label: '$m_o =$', relTolerance: 0.01}
    - {format: sig4, name: M, label: '$M =$', relTolerance: 0.01}
  solution: |-
    Objective: $\dfrac{1}{d_i} = \dfrac{1}{{fo:num2}} - \dfrac{1}{{dob:num2}}$, so $d_i =$ **{di:sig3} cm**, and $m_o = -\dfrac{d_i}{d_o} = -\dfrac{{di:sig4}}{{dob:num2}} =$ **{mo:sig3}**.

    Eyepiece: $M_e = \dfrac{25\text{ cm}}{f_e} = \dfrac{25}{{fe:num1}} = {Me:sig4}$.

    Overall: $M = m_oM_e =$ **{M:sig3}** (the minus sign means the image is inverted).
- id: phys-double-slit
  title: Double-slit fringes
  topic: Interference
  vars:
    lam: {min: 400, max: 700, step: 10}
    dmm: {min: 0.05, max: 1, step: 0.05}
    L: {min: 0.5, max: 5, step: 0.1}
    mo: {min: 1, max: 5}
  calc:
    dy: lam*1e-9*L/(dmm/1000)*1000
    ang: asind(mo*lam*1e-9/(dmm/1000))
  prompt: 'Light of wavelength {lam:dp0} nm falls on two slits {dmm} mm apart; the screen is {L} m away. Find the fringe spacing in mm and the angle of the order-{mo} bright fringe in degrees, each to 3 significant figures.'
  answers:
    - {format: sig4, name: dy, label: 'Fringe spacing', relTolerance: 0.01, units: {mm: 1, cm: 10, m: 1000}}
    - {format: sig4, name: ang, label: 'Angle', relTolerance: 0.01, units: {'°': 1, deg: 1}}
  solution: |-
    $\Delta y = \dfrac{\lambda L}{d} = \dfrac{({lam:dp0}\times10^{-9})({L})}{{dmm}\times10^{-3}} =$ **{dy:sig3} mm**.

    $\sin\theta = \dfrac{m\lambda}{d} = \dfrac{{mo}({lam:dp0}\times10^{-9})}{{dmm}\times10^{-3}}$, so $\theta =$ **{ang:sig3}°**.
- id: phys-grating
  title: Diffraction grating
  topic: Diffraction
  vars:
    N: {min: 100, max: 1200, step: 50}
    lam: {min: 400, max: 700, step: 5}
  calc:
    d: 1/(N*1000)
    t1: asind(lam*1e-9/d)
    ratio: 1000000/(N*lam)
    mmax: ceil(ratio - 1e-9) - 1
  where: ['lam*1e-9/d < 0.97']
  prompt: 'A grating has {N:dp0} lines per mm and is lit with {lam:dp0} nm light. Find the angle of the first-order maximum (to the nearest 0.1°) and the highest order that appears on a screen in front of the grating.'
  answers:
    - {format: sig4, name: t1, label: 'First-order angle', tolerance: 0.2, units: {'°': 1, deg: 1}}
    - {name: mmax, label: 'Highest order', format: integer}
  solution: |-
    $d = \dfrac{1}{{N:dp0}\text{ mm}^{-1}} = {d:texsci}$ m. $\sin\theta_1 = \lambda/d$, so $\theta_1 =$ **{t1:num1}°**.

    A maximum needs $\sin\theta = m\lambda/d < 1$ (an order with $\sin\theta = 1$ would travel along the grating's surface, never reaching the screen), so $m < d/\lambda = {ratio:num4}$. The highest order is **{mmax}**.
- id: phys-thin-film
  title: Thin film color
  topic: Interference
  vars:
    n: {min: 1.30, max: 1.60, step: 0.01}
    lam: {min: 400, max: 700, step: 5}
    mm: {min: 0, max: 2}
  calc:
    t: (mm + 0.5)*lam/(2*n)
  prompt: 'A thin film with $n = {n}$ surrounded by air strongly reflects {lam:dp0} nm light. Find the film thickness in nm, to 3 significant figures, for constructive order $m = {mm}$ (where $m = 0$ is the thinnest such film).'
  answers:
    - {format: sig4, name: t, label: 'Thickness', relTolerance: 0.01, units: {nm: 1}}
  solution: |-
    Only the top reflection flips phase, so bright reflection needs $2nt = (m + \tfrac12)\lambda$.

    $t = \dfrac{({mm} + 0.5)({lam:dp0})}{2({n})} =$ **{t:sig3} nm**.
