# Round 2 notecards for phys-m9 (honors 09h1, 09h2)
- {front: Node-voltage method, back: 'Pick a reference node (0 V), use the other node potentials as unknowns, write the junction rule at each with $I = \Delta V/R$; $n$ nodes give $n - 1$ unknowns', topic: Network analysis}
- {front: Current in a branch from node potentials, back: 'Resistor from a to b: $(V_a - V_b)/R$. Branch from b through a battery ($+$ toward a) and $R$ to a: $(V_b + \mathcal{E} - V_a)/R$ toward a', topic: Network analysis}
- {front: Thévenin's theorem, back: 'A linear two-terminal network = emf $V_{\text{th}}$ in series with $R_{\text{th}}$', topic: Network analysis}
- {front: 'Finding $V_{\text{th}}$ and $R_{\text{th}}$', back: '$V_{\text{th}}$: open-circuit voltage. $R_{\text{th}}$: resistance between the terminals with ideal batteries replaced by wires, or $V_{\text{oc}}/I_{\text{sc}}$', topic: Network analysis}
- {front: Norton's theorem, back: 'Current source $I_N = V_{\text{th}}/R_{\text{th}}$ (the short-circuit current) in parallel with $R_{\text{th}}$', topic: Network analysis}
- {front: Load current and best load from a Thévenin equivalent, back: '$I_L = V_{\text{th}}/(R_{\text{th}} + R_L)$; maximum power $V_{\text{th}}^2/(4R_{\text{th}})$ when $R_L = R_{\text{th}}$', topic: Network analysis}
- {front: Superposition theorem, back: 'Add currents or voltages from each source acting alone (others replaced by wires). Never add powers.', topic: Network analysis}
- {front: Wheatstone bridge balance, back: '$R_1/R_2 = R_3/R_x$, so $R_x = R_2R_3/R_1$; independent of the emf (a null measurement)', topic: Network analysis}
- {front: Unbalanced bridge current, back: '$I_g = \dfrac{|V_d - V_c|}{(R_1 \parallel R_2) + (R_3 \parallel R_x) + R_g}$ (Thévenin between the midpoints)', topic: Network analysis}
- {front: Infinite ladder of equal resistors, back: '$R_\infty = R + \dfrac{RR_\infty}{R + R_\infty}$, so $R_\infty = \dfrac{1 + \sqrt5}{2}R \approx 1.618R$', topic: Network analysis}
- {front: One-capacitor transient recipe, back: '$x(t) = x_\infty + (x(0^+) - x_\infty)e^{-t/\tau}$ with $\tau = R_{\text{th}}C$ for every current and voltage', topic: Circuit transients}
- {front: 'What can''t jump at a switch?', back: 'The capacitor voltage (and charge): a jump would need infinite current. Resistor currents and voltages can jump.', topic: Circuit transients}
- {front: 'Time constant with several resistors', back: '$\tau = R_{\text{th}}C$, with $R_{\text{th}}$ seen from the capacitor (batteries as wires); it can differ for charging and discharging', topic: Circuit transients}
- {front: Relaxation oscillator period, back: '$T = RC\ln\dfrac{\mathcal{E} - V_{\text{off}}}{\mathcal{E} - V_{\text{on}}}$ (fast discharge); the first cycle starts from 0 V and is longer', topic: Circuit transients}
- {front: RC low-pass filter response, back: 'Gain $1/\sqrt{1 + (\omega RC)^2}$, output lags by $\arctan(\omega RC)$', topic: RC filters}
- {front: Cutoff frequency, back: '$f_c = 1/(2\pi RC)$: gain $1/\sqrt2 = 0.707$ (half power, −3 dB), phase 45°', topic: RC filters}
- {front: RC high-pass filter gain, back: '$\omega RC/\sqrt{1 + (\omega RC)^2}$ (output across R); same cutoff as the low-pass', topic: RC filters}
- {front: Two capacitors sharing charge, back: '$V_f = C_1V_0/(C_1 + C_2)$; heat $\tfrac12\dfrac{C_1C_2}{C_1 + C_2}V_0^2$ whatever the resistance', topic: Circuit transients}
