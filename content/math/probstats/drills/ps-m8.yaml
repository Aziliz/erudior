- id: ps-d-ls-fit
  title: Fit a least squares line
  topic: Simple linear regression
  vars:
    x1: {choices: [0, 1, 2, 5, 10]}
    hh: {choices: [1, 2, 3, 5]}
    a0: {min: 1, max: 10, step: 0.5}
    bt: {min: -2, max: 3, step: 0.1}
    e1: {min: -1.5, max: 1.5, step: 0.1}
    e2: {min: -1.5, max: 1.5, step: 0.1}
    e3: {min: -1.5, max: 1.5, step: 0.1}
    e4: {min: -1.5, max: 1.5, step: 0.1}
    e5: {min: -1.5, max: 1.5, step: 0.1}
  calc:
    x2: x1 + hh
    x3: x1 + 2*hh
    x4: x1 + 3*hh
    x5: x1 + 4*hh
    y1: round(a0 + bt*x1 + e1, 1)
    y2: round(a0 + bt*x2 + e2, 1)
    y3: round(a0 + bt*x3 + e3, 1)
    y4: round(a0 + bt*x4 + e4, 1)
    y5: round(a0 + bt*x5 + e5, 1)
    xb: mean(x1, x2, x3, x4, x5)
    yb: mean(y1, y2, y3, y4, y5)
    sxx: (x1 - xb)^2 + (x2 - xb)^2 + (x3 - xb)^2 + (x4 - xb)^2 + (x5 - xb)^2
    sxy: (x1 - xb)*(y1 - yb) + (x2 - xb)*(y2 - yb) + (x3 - xb)*(y3 - yb) + (x4 - xb)*(y4 - yb) + (x5 - xb)*(y5 - yb)
    syy: (y1 - yb)^2 + (y2 - yb)^2 + (y3 - yb)^2 + (y4 - yb)^2 + (y5 - yb)^2
    b1: sxy/sxx
    b0: yb - b1*xb
    rsq: sxy^2/(sxx*syy)
    ylo: min(y1, y2, y3, y4, y5) - 2
    yhi: max(y1, y2, y3, y4, y5) + 2
    xlo: x1 - hh
    xhi: x5 + hh
  where: ['abs(bt) >= 0.3', 'syy > 0']
  prompt: |-
    Fit the least squares line $\hat y = b_0 + b_1x$ to these five points, and find $r^2$
    (4 decimals each).

    $$\begin{array}{c|ccccc} x & {x1} & {x2} & {x3} & {x4} & {x5} \\ \hline y & {y1:num1} & {y2:num1} & {y3:num1} & {y4:num1} & {y5:num1} \end{array}$$
  figure:
    type: plot
    x: [xlo, xhi]
    y: [ylo, yhi]
    points: [[x1, y1], [x2, y2], [x3, y3], [x4, y4], [x5, y5]]
  answers:
    - {name: b1, label: '$b_1 =$', tolerance: 0.0006, format: num4}
    - {name: b0, label: '$b_0 =$', tolerance: 0.001, format: num4}
    - {name: rsq, label: '$r^2 =$', tolerance: 0.0006, format: num4}
  solution: |-
    $\bar x = {xb:num4}$, $\bar y = {yb:num4}$, $S_{xx} = {sxx:num4}$, $S_{xy} = {sxy:num4}$, $S_{yy} = {syy:num4}$.

    $b_1 = S_{xy}/S_{xx} =$ **{b1:num4}**, $b_0 = \bar y - b_1\bar x =$ **{b0:num4}**, and
    $r^2 = S_{xy}^2/(S_{xx}S_{yy}) =$ **{rsq:num4}**.

- id: ps-d-slope-test
  title: t test for the slope from summary statistics
  topic: Simple linear regression
  vars:
    nn: {min: 8, max: 30}
    sxx: {min: 20, max: 300}
    bb: {min: -3, max: 3, step: 0.01}
    sse0: {min: 2, max: 60, step: 0.5}
  calc:
    sxy: round(bb*sxx, 1)
    syy: round(sxy^2/sxx + sse0, 1)
    b1: sxy/sxx
    sse: syy - sxy^2/sxx
    dfree: nn - 2
    s: sqrt(sse/dfree)
    se: s/sqrt(sxx)
    tt: b1/se
    pv: 2*(1 - tcdf(abs(tt), dfree))
  where: ['abs(bb) >= 0.1', 'abs(tt) >= 0.5', 'abs(tt) <= 6']
  prompt: |-
    A regression on $n = {nn}$ points has $S_{xx} = {sxx}$, $S_{xy} = {sxy:num1}$ and $S_{yy} = {syy:num1}$.
    Test $H_0: \beta_1 = 0$ against $H_1: \beta_1 \ne 0$. Find $b_1$ (4 decimals), the $t$ statistic
    (3 decimals) and the p-value (4 decimals).
  answers:
    - {name: b1, label: '$b_1 =$', tolerance: 0.0006, format: num4}
    - {name: tt, label: '$t =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    $b_1 = S_{xy}/S_{xx} =$ **{b1:num4}**. $\text{SSE} = S_{yy} - b_1S_{xy} = {sse:num4}$, so
    $s = \sqrt{\text{SSE}/(n-2)} = \sqrt{{sse:num4}/{dfree}} = {s:num4}$ and $\text{SE}(b_1) = s/\sqrt{S_{xx}} = {se:num4}$.

    $t = b_1/\text{SE}(b_1) =$ **{tt:dp3}** on {dfree} df; two-sided p-value $\approx$ **{pv:num4}**.

- id: ps-d-pred-interval
  title: Confidence and prediction intervals at x0
  topic: Simple linear regression
  vars:
    nn: {min: 8, max: 30}
    xbar: {min: 2, max: 20, step: 0.1}
    sxx: {min: 20, max: 400}
    b0v: {min: -10, max: 30, step: 0.01}
    b1v: {min: -3, max: 3, step: 0.01}
    sres: {min: 0.5, max: 6, step: 0.01}
    zoff: {min: -2, max: 2, step: 0.25}
  calc:
    x0: round(xbar + zoff*sqrt(sxx/(nn - 1)), 1)
    yh: b0v + b1v*x0
    dfree: nn - 2
    ts: invt(0.975, dfree)
    kk: 1/nn + (x0 - xbar)^2/sxx
    hci: ts*sres*sqrt(kk)
    hpi: ts*sres*sqrt(1 + kk)
  where: ['abs(b1v) >= 0.1']
  prompt: |-
    A regression on $n = {nn}$ points gives $\hat y = {b0v:num2} {b1v:signed}x$, with $s = {sres:num2}$,
    $\bar x = {xbar:num1}$ and $S_{xx} = {sxx}$. At $x_0 = {x0:num1}$, find $\hat y_0$, the half-width of the
    95% confidence interval for the mean response, and the half-width of the 95% prediction interval
    for a new observation (3 decimals each).
  answers:
    - {name: yh, label: '$\hat y_0 =$', tolerance: 0.002, format: dp3}
    - {name: hci, label: 'CI half-width', tolerance: 0.005, format: dp3}
    - {name: hpi, label: 'PI half-width', tolerance: 0.005, format: dp3}
  solution: |-
    $\hat y_0 = {b0v:num2} {b1v:signed}({x0:num1}) =$ **{yh:dp3}**. With {dfree} df, $t_{0.025} = {ts:dp3}$, and
    $\dfrac1n + \dfrac{(x_0 - \bar x)^2}{S_{xx}} = {kk:num4}$.

    Mean response: ${ts:dp3}({sres:num2})\sqrt{{kk:num4}} =$ **{hci:dp3}**.
    New observation: ${ts:dp3}({sres:num2})\sqrt{1 + {kk:num4}} =$ **{hpi:dp3}**.

- id: ps-d-anova-raw
  title: One-way ANOVA from raw data
  topic: One-way ANOVA
  vars:
    g11: {min: 8, max: 20}
    g12: {min: 8, max: 20}
    g13: {min: 8, max: 20}
    g14: {min: 8, max: 20}
    g21: {min: 8, max: 20}
    g22: {min: 8, max: 20}
    g23: {min: 8, max: 20}
    g24: {min: 8, max: 20}
    g31: {min: 8, max: 20}
    g32: {min: 8, max: 20}
    g33: {min: 8, max: 20}
    g34: {min: 8, max: 20}
    sh: {choices: [0, 1, 2, 3]}
  calc:
    m1: mean(g11, g12, g13, g14)
    m2: mean(g21, g22, g23, g24) + sh
    m3: mean(g31, g32, g33, g34)
    gm: (m1 + m2 + m3)/3
    sstr: 4*((m1 - gm)^2 + (m2 - gm)^2 + (m3 - gm)^2)
    sse: 3*(variance(g11, g12, g13, g14) + variance(g21, g22, g23, g24) + variance(g31, g32, g33, g34))
    mstr: sstr/2
    mse: sse/9
    ff: mstr/mse
    pv: 1 - fcdf(ff, 2, 9)
    h1: g21 + sh
    h2: g22 + sh
    h3: g23 + sh
    h4: g24 + sh
  where: ['ff >= 0.3', 'ff <= 15']
  prompt: |-
    Three treatments are each applied to four units:

    $$\begin{array}{c|cccc} \text{A} & {g11} & {g12} & {g13} & {g14} \\ \text{B} & {h1} & {h2} & {h3} & {h4} \\ \text{C} & {g31} & {g32} & {g33} & {g34} \end{array}$$

    Find SSTr, SSE and the $F$ statistic (3 decimals each) and the p-value (4 decimals).
  answers:
    - {name: sstr, label: 'SSTr', tolerance: 0.01, format: dp3}
    - {name: sse, label: 'SSE', tolerance: 0.01, format: dp3}
    - {name: ff, label: '$F =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    Group means {m1:num4}, {m2:num4}, {m3:num4}; grand mean {gm:num4}.
    $\text{SSTr} = 4\sum(\bar y_i - \bar y)^2 =$ **{sstr:dp3}**; $\text{SSE} = \sum\sum(y_{ij} - \bar y_i)^2 =$ **{sse:dp3}**.

    $\text{MSTr} = {sstr:dp3}/2 = {mstr:dp3}$, $\text{MSE} = {sse:dp3}/9 = {mse:dp3}$, so $F =$ **{ff:dp3}** on (2, 9) df,
    and the p-value is $P(F_{2,9} \ge {ff:dp3}) \approx$ **{pv:num4}**.

- id: ps-d-anova-summary
  title: One-way ANOVA from summary statistics
  topic: One-way ANOVA
  vars:
    n1: {min: 4, max: 12}
    n2: {min: 4, max: 12}
    n3: {min: 4, max: 12}
    m1: {min: 15, max: 25, step: 0.1}
    m2: {min: 15, max: 25, step: 0.1}
    m3: {min: 15, max: 25, step: 0.1}
    s1: {min: 1, max: 6, step: 0.1}
    s2: {min: 1, max: 6, step: 0.1}
    s3: {min: 1, max: 6, step: 0.1}
  calc:
    bign: n1 + n2 + n3
    gm: (n1*m1 + n2*m2 + n3*m3)/bign
    sstr: n1*(m1 - gm)^2 + n2*(m2 - gm)^2 + n3*(m3 - gm)^2
    sse: (n1 - 1)*s1^2 + (n2 - 1)*s2^2 + (n3 - 1)*s3^2
    dfe: bign - 3
    mstr: sstr/2
    mse: sse/dfe
    ff: mstr/mse
    pv: 1 - fcdf(ff, 2, dfe)
  where: ['ff >= 0.3', 'ff <= 12', 'max(s1, s2, s3) <= 2*min(s1, s2, s3)']
  prompt: |-
    Three independent groups give:

    $$\begin{array}{c|ccc} & \text{group 1} & \text{group 2} & \text{group 3} \\ \hline n_i & {n1} & {n2} & {n3} \\ \bar y_i & {m1:num1} & {m2:num1} & {m3:num1} \\ s_i & {s1:num1} & {s2:num1} & {s3:num1} \end{array}$$

    Find the ANOVA $F$ statistic (3 decimals) and its p-value (4 decimals).
  answers:
    - {name: ff, label: '$F =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    $N = {bign}$; weighted grand mean $= \sum n_i\bar y_i/N = {gm:num4}$.
    $\text{SSTr} = \sum n_i(\bar y_i - \bar y)^2 = {sstr:dp3}$ and $\text{SSE} = \sum(n_i - 1)s_i^2 = {sse:dp3}$.

    $\text{MSTr} = {sstr:dp3}/2 = {mstr:dp3}$, $\text{MSE} = {sse:dp3}/{dfe} = {mse:dp3}$, so $F =$ **{ff:dp3}** on (2, {dfe}) df,
    with p-value $\approx$ **{pv:num4}**.

- id: ps-d-anova-table
  title: Complete an ANOVA table
  topic: One-way ANOVA
  vars:
    kk: {min: 3, max: 6}
    ng: {min: 4, max: 12}
    sstr: {min: 10, max: 200, step: 0.1}
    sse: {min: 50, max: 600, step: 0.1}
  calc:
    bign: kk*ng
    sst: round(sstr + sse, 1)
    sse2: sst - sstr
    df1: kk - 1
    df2: bign - kk
    dft: bign - 1
    mstr: sstr/df1
    mse: sse2/df2
    ff: mstr/mse
    pv: 1 - fcdf(ff, df1, df2)
  where: ['ff >= 0.4', 'ff <= 12']
  prompt: |-
    A one-way ANOVA compares {kk} groups of {ng} observations each. The treatment sum of squares is
    $\text{SSTr} = {sstr:num1}$ and the total sum of squares is $\text{SST} = {sst:num1}$. Find MSE and $F$
    (3 decimals each) and the p-value (4 decimals).
  answers:
    - {name: mse, label: 'MSE', tolerance: 0.005, format: dp3}
    - {name: ff, label: '$F =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    $N = {bign}$. Degrees of freedom: treatments $k - 1 = {df1}$, error $N - k = {df2}$, total {dft}.
    $\text{SSE} = \text{SST} - \text{SSTr} = {sse2:num1}$, so $\text{MSE} = {sse2:num1}/{df2} =$ **{mse:dp3}**.

    $\text{MSTr} = {sstr:num1}/{df1} = {mstr:dp3}$, $F = {mstr:dp3}/{mse:dp3} =$ **{ff:dp3}**, and
    the p-value is $P(F_{{df1},{df2}} \ge {ff:dp3}) \approx$ **{pv:num4}**.

- id: ps-d-sign-test
  title: Sign test p-value
  topic: Nonparametric tests
  vars:
    nn: {min: 10, max: 25}
    zz: {min: 0, max: 3}
    kk: {min: 5, max: 22}
  calc:
    nz: nn - zz
    neg: nn - zz - kk
    km1: kk - 1
    pv: 1 - binomcdf(nz, 0.5, kk - 1)
  where: ['kk <= nz', 'kk > nz/2', 'pv >= 0.0005']
  prompt: |-
    In a paired study of {nn} units, {kk} differences are positive, {neg} are negative and {zz} are exactly
    zero. Use the sign test of $H_0$: median difference $= 0$ against $H_1$: median difference $> 0$.
    Find the p-value (4 decimals).
  answers:
    - {name: pv, label: 'p-value', tolerance: 0.0006, format: num4}
  solution: |-
    Drop the {zz} zero differences, leaving $n = {nz}$. Under $H_0$ the number of positive signs is
    $B \sim \text{Bin}({nz}, 1/2)$, so the p-value is $P(B \ge {kk}) = 1 - P(B \le {km1}) \approx$ **{pv:num4}**.

- id: ps-d-signed-rank
  title: Wilcoxon signed-rank test
  topic: Nonparametric tests
  vars:
    a1: {min: 1, max: 40}
    s1: {choices: [-1, 1]}
    a2: {min: 1, max: 40}
    s2: {choices: [-1, 1]}
    a3: {min: 1, max: 40}
    s3: {choices: [-1, 1]}
    a4: {min: 1, max: 40}
    s4: {choices: [-1, 1]}
    a5: {min: 1, max: 40}
    s5: {choices: [-1, 1]}
    a6: {min: 1, max: 40}
    s6: {choices: [-1, 1]}
    a7: {min: 1, max: 40}
    s7: {choices: [-1, 1]}
    a8: {min: 1, max: 40}
    s8: {choices: [-1, 1]}
  calc:
    nd: (a1 != a2) + (a1 != a3) + (a1 != a4) + (a1 != a5) + (a1 != a6) + (a1 != a7) + (a1 != a8) + (a2 != a3) + (a2 != a4) + (a2 != a5) + (a2 != a6) + (a2 != a7) + (a2 != a8) + (a3 != a4) + (a3 != a5) + (a3 != a6) + (a3 != a7) + (a3 != a8) + (a4 != a5) + (a4 != a6) + (a4 != a7) + (a4 != a8) + (a5 != a6) + (a5 != a7) + (a5 != a8) + (a6 != a7) + (a6 != a8) + (a7 != a8)
    r1: 1 + (a2 < a1) + (a3 < a1) + (a4 < a1) + (a5 < a1) + (a6 < a1) + (a7 < a1) + (a8 < a1)
    r2: 1 + (a1 < a2) + (a3 < a2) + (a4 < a2) + (a5 < a2) + (a6 < a2) + (a7 < a2) + (a8 < a2)
    r3: 1 + (a1 < a3) + (a2 < a3) + (a4 < a3) + (a5 < a3) + (a6 < a3) + (a7 < a3) + (a8 < a3)
    r4: 1 + (a1 < a4) + (a2 < a4) + (a3 < a4) + (a5 < a4) + (a6 < a4) + (a7 < a4) + (a8 < a4)
    r5: 1 + (a1 < a5) + (a2 < a5) + (a3 < a5) + (a4 < a5) + (a6 < a5) + (a7 < a5) + (a8 < a5)
    r6: 1 + (a1 < a6) + (a2 < a6) + (a3 < a6) + (a4 < a6) + (a5 < a6) + (a7 < a6) + (a8 < a6)
    r7: 1 + (a1 < a7) + (a2 < a7) + (a3 < a7) + (a4 < a7) + (a5 < a7) + (a6 < a7) + (a8 < a7)
    r8: 1 + (a1 < a8) + (a2 < a8) + (a3 < a8) + (a4 < a8) + (a5 < a8) + (a6 < a8) + (a7 < a8)
    d1: s1*a1/10
    d2: s2*a2/10
    d3: s3*a3/10
    d4: s4*a4/10
    d5: s5*a5/10
    d6: s6*a6/10
    d7: s7*a7/10
    d8: s8*a8/10
    wp: r1*(s1 > 0) + r2*(s2 > 0) + r3*(s3 > 0) + r4*(s4 > 0) + r5*(s5 > 0) + r6*(s6 > 0) + r7*(s7 > 0) + r8*(s8 > 0)
    npos: (s1 > 0) + (s2 > 0) + (s3 > 0) + (s4 > 0) + (s5 > 0) + (s6 > 0) + (s7 > 0) + (s8 > 0)
    wm: 36 - wp
    zz: (wp - 18)/sqrt(51)
    pv: 1 - normcdf(zz)
  where: ['nd == 28', 'npos >= 4', 'npos <= 7', 'wp >= 20']
  prompt: |-
    Eight paired differences are
    $${d1:num1},\ {d2:num1},\ {d3:num1},\ {d4:num1},\ {d5:num1},\ {d6:num1},\ {d7:num1},\ {d8:num1}$$
    Find the Wilcoxon signed-rank statistic $W^+$, its normal-approximation $z$ (no continuity correction,
    3 decimals) and the one-sided p-value for $H_1$: median $> 0$ (4 decimals).
  answers:
    - {name: wp, label: '$W^+ =$', format: integer}
    - {name: zz, label: '$z =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    Rank the absolute values from 1 to 8. The ranks of the differences, in the order given, are
    {r1}, {r2}, {r3}, {r4}, {r5}, {r6}, {r7}, {r8}. Adding the ranks of the positive differences gives
    $W^+ =$ **{wp}** (and $W^- = {wm}$; the two add to 36).

    Under $H_0$, $E(W^+) = 8 \cdot 9/4 = 18$ and $\operatorname{Var}(W^+) = 8 \cdot 9 \cdot 17/24 = 51$, so
    $z = ({wp} - 18)/\sqrt{51} =$ **{zz:dp3}** and the p-value is $P(Z \ge {zz:dp3}) \approx$ **{pv:num4}**.

- id: ps-d-rank-sum
  title: Wilcoxon rank-sum test
  topic: Nonparametric tests
  vars:
    a1: {min: 10, max: 80}
    a2: {min: 10, max: 80}
    a3: {min: 10, max: 80}
    a4: {min: 10, max: 80}
    a5: {min: 10, max: 80}
    b1: {min: 10, max: 80}
    b2: {min: 10, max: 80}
    b3: {min: 10, max: 80}
    b4: {min: 10, max: 80}
    b5: {min: 10, max: 80}
  calc:
    nd: (a1 != a2) + (a1 != a3) + (a1 != a4) + (a1 != a5) + (a1 != b1) + (a1 != b2) + (a1 != b3) + (a1 != b4) + (a1 != b5) + (a2 != a3) + (a2 != a4) + (a2 != a5) + (a2 != b1) + (a2 != b2) + (a2 != b3) + (a2 != b4) + (a2 != b5) + (a3 != a4) + (a3 != a5) + (a3 != b1) + (a3 != b2) + (a3 != b3) + (a3 != b4) + (a3 != b5) + (a4 != a5) + (a4 != b1) + (a4 != b2) + (a4 != b3) + (a4 != b4) + (a4 != b5) + (a5 != b1) + (a5 != b2) + (a5 != b3) + (a5 != b4) + (a5 != b5) + (b1 != b2) + (b1 != b3) + (b1 != b4) + (b1 != b5) + (b2 != b3) + (b2 != b4) + (b2 != b5) + (b3 != b4) + (b3 != b5) + (b4 != b5)
    ra1: 1 + (a2 < a1) + (a3 < a1) + (a4 < a1) + (a5 < a1) + (b1 < a1) + (b2 < a1) + (b3 < a1) + (b4 < a1) + (b5 < a1)
    ra2: 1 + (a1 < a2) + (a3 < a2) + (a4 < a2) + (a5 < a2) + (b1 < a2) + (b2 < a2) + (b3 < a2) + (b4 < a2) + (b5 < a2)
    ra3: 1 + (a1 < a3) + (a2 < a3) + (a4 < a3) + (a5 < a3) + (b1 < a3) + (b2 < a3) + (b3 < a3) + (b4 < a3) + (b5 < a3)
    ra4: 1 + (a1 < a4) + (a2 < a4) + (a3 < a4) + (a5 < a4) + (b1 < a4) + (b2 < a4) + (b3 < a4) + (b4 < a4) + (b5 < a4)
    ra5: 1 + (a1 < a5) + (a2 < a5) + (a3 < a5) + (a4 < a5) + (b1 < a5) + (b2 < a5) + (b3 < a5) + (b4 < a5) + (b5 < a5)
    ww: ra1 + ra2 + ra3 + ra4 + ra5
    uu: ww - 15
    zz: (ww - 27.5)/sqrt(275/12)
    pv: 1 - normcdf(zz)
  where: ['nd == 45', 'ww >= 29']
  prompt: |-
    Sample A: {a1}, {a2}, {a3}, {a4}, {a5}. Sample B: {b1}, {b2}, {b3}, {b4}, {b5}.
    Rank all ten values together (1 = smallest). Find the rank sum $W$ of sample A, the Mann–Whitney
    $U = W - 15$, and the one-sided normal-approximation p-value for $H_1$: A is shifted upward (no continuity
    correction, 4 decimals).
  answers:
    - {name: ww, label: '$W =$', format: integer}
    - {name: uu, label: '$U =$', format: integer}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    The ranks of A's values are {ra1}, {ra2}, {ra3}, {ra4}, {ra5}, so $W =$ **{ww}** and $U = {ww} - 15 =$ **{uu}**.

    Under $H_0$, $E(W) = 5 \cdot 11/2 = 27.5$ and $\operatorname{Var}(W) = 5 \cdot 5 \cdot 11/12 = 22.917$, so
    $z = ({ww} - 27.5)/\sqrt{22.917} = {zz:dp3}$ and the p-value is $P(Z \ge {zz:dp3}) \approx$ **{pv:num4}**.
