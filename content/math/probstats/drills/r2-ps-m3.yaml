# Round 2 drills for ps-m3 honors lessons (14h1 hazard functions, 14h2 mixed distributions)
- id: ps-m3-r2-weibull-survival
  title: Weibull survival, hazard and B10 life
  topic: Lifetime distributions
  vars:
    kk: {choices: [0.5, 1.5, 2, 2.5, 3]}
    sc: {choices: [200, 500, 1000, 2000, 5000]}
    fr: {choices: [0.2, 0.25, 0.4, 0.5, 0.75, 1.5]}
  calc:
    t0: sc*fr
    surv: exp(-(fr^kk))
    haz: (kk/sc)*fr^(kk - 1)
    lq: -ln(0.9)
    b10: sc*lq^(1/kk)
    hh: fr^kk
  prompt: |-
    A component's life in hours is Weibull with shape $k = {kk}$ and scale $s = {sc:dp0}$, so
    $S(x) = e^{-(x/{sc:dp0})^{{kk}}}$. Find $P(X > {t0:dp0})$ (4 decimals), the hazard rate $h({t0:dp0})$ per hour
    (3 significant figures) and the B10 life in hours (3 significant figures).
  answers:
    - {name: surv, label: '$P(X > {t0:dp0}) =$', tolerance: 0.0001, format: num4}
    - {name: haz, label: '$h({t0:dp0}) =$', sigfigs: 3, format: sig3}
    - {name: b10, label: 'B10 life $=$', sigfigs: 3, format: sig3}
  solution: |-
    $\dfrac{x}{s} = \dfrac{{t0:dp0}}{{sc:dp0}} = {fr}$, so $H({t0:dp0}) = ({fr})^{{kk}} \approx {hh:num4}$ and
    $P(X > {t0:dp0}) = e^{-{hh:num4}} \approx$ **{surv:num4}**.

    $h(x) = \dfrac{k}{s}\left(\dfrac{x}{s}\right)^{k - 1}$, so $h({t0:dp0}) = \dfrac{{kk}}{{sc:dp0}}({fr})^{{kk} - 1} \approx$ **{haz:sig3}** per hour.

    B10: solve $1 - e^{-(x/{sc:dp0})^{{kk}}} = 0.10$, so $(x/{sc:dp0})^{{kk}} = -\ln 0.9 \approx 0.10536$ and
    $x = {sc:dp0}\,(0.10536)^{1/{kk}} \approx$ **{b10:sig3}** hours.

- id: ps-m3-r2-weibull-mean
  title: Weibull mean and median
  topic: Lifetime distributions
  vars:
    kk: {choices: [0.5, 1.5, 2, 2.5, 3, 4]}
    sc: {choices: [10, 20, 50, 100, 400, 1000]}
  calc:
    g1: gamma(1 + 1/kk)
    mu: sc*gamma(1 + 1/kk)
    med: sc*ln(2)^(1/kk)
    ik: 1/kk
  prompt: |-
    A lifetime is Weibull with shape $k = {kk}$ and scale $s = {sc:dp0}$. Find its mean and its median
    (3 significant figures each).
  answers:
    - {name: mu, label: '$E(X) =$', sigfigs: 3, format: sig3}
    - {name: med, label: 'median $=$', sigfigs: 3, format: sig3}
  solution: |-
    Mean: $E(X) = s\,\Gamma\!\left(1 + \tfrac1k\right) = {sc:dp0}\,\Gamma(1 + {ik:num4}) \approx {sc:dp0} \times {g1:num4} \approx$ **{mu:sig3}**.

    Median: $e^{-(m/{sc:dp0})^{{kk}}} = \tfrac12$ gives $(m/{sc:dp0})^{{kk}} = \ln 2$, so $m = {sc:dp0}\,(\ln 2)^{1/{kk}} \approx$ **{med:sig3}**.

- id: ps-m3-r2-series-weibull
  title: Weibull components in series
  topic: Lifetime distributions
  vars:
    nn: {min: 2, max: 6}
    kk: {choices: [1, 1.5, 2, 3]}
    sc: {choices: [500, 1000, 2000, 4000]}
    fr: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5]}
  calc:
    t0: sc*fr
    sys: sc*nn^(-1/kk)
    one: exp(-(fr^kk))
    psys: exp(-nn*fr^kk)
  prompt: |-
    A unit works only while all {nn} of its parts work. The parts fail independently, and each part's
    life in hours is Weibull with shape {kk} and scale {sc:dp0}. Find the scale of the unit's (Weibull)
    lifetime (3 significant figures) and the probability that the unit lasts more than {t0:dp0} hours
    (4 decimals).
  answers:
    - {name: sys, label: 'system scale $=$', sigfigs: 3, format: sig3}
    - {name: psys, label: '$P(T > {t0:dp0}) =$', tolerance: 0.0001, format: num4}
  solution: |-
    In series the cumulative hazards add: $H_T(x) = {nn}\,(x/{sc:dp0})^{{kk}} = (x/s')^{{kk}}$ with
    $s' = {sc:dp0} \cdot {nn}^{-1/{kk}} \approx$ **{sys:sig3}** hours (same shape {kk}).

    $P(T > {t0:dp0}) = e^{-{nn}({fr})^{{kk}}} \approx$ **{psys:num4}**, compared with {one:num4} for a single part.

- id: ps-m3-r2-mixed-wait
  title: Waiting at a traffic light
  topic: Mixed random variables
  vars:
    red: {choices: [20, 30, 40, 45, 60]}
    grn: {choices: [30, 40, 50, 60, 90]}
    fr: {choices: [0.25, 0.5, 0.75]}
  calc:
    cyc: red + grn
    w0: red*fr
    p0: grn/(red + grn)
    ew: red^2/(2*(red + grn))
    pw: (red - red*fr)/(red + grn)
    halfr: red/2
  prompt: |-
    A light is red for {red} seconds and green for {grn} seconds (ignore amber), and you arrive at a time
    uniform over the {cyc}-second cycle. If it is red, you wait for the rest of the red phase. Find
    $P(W = 0)$ and $P(W > {w0})$ (4 decimals) and the expected wait $E(W)$ in seconds (2 decimals).
  answers:
    - {name: p0, label: '$P(W = 0) =$', tolerance: 0.0001, format: num4}
    - {name: pw, label: '$P(W > {w0}) =$', tolerance: 0.0001, format: num4}
    - {name: ew, label: '$E(W) =$', tolerance: 0.01, format: num2}
  solution: |-
    The wait is 0 when you arrive on green: $P(W = 0) = \dfrac{{grn}}{{cyc}} \approx$ **{p0:num4}** (a point mass).
    On red (probability $\tfrac{{red}}{{cyc}}$) the remaining red time is uniform on $(0, {red})$.

    $P(W > {w0}) = \dfrac{{red}}{{cyc}} \cdot \dfrac{{red} - {w0}}{{red}} \approx$ **{pw:num4}**.

    $E(W) = \dfrac{{grn}}{{cyc}} \cdot 0 + \dfrac{{red}}{{cyc}} \cdot {halfr} \approx$ **{ew:num2}** seconds.

- id: ps-m3-r2-deductible
  title: Expected payment with a deductible
  topic: Censoring and deductibles
  vars:
    th: {choices: [500, 1000, 2000, 2500, 5000]}
    fr: {choices: [0.1, 0.2, 0.25, 0.5, 1]}
  calc:
    ded: th*fr
    p0: 1 - exp(-fr)
    epay: th*exp(-fr)
    elim: th*(1 - exp(-fr))
  prompt: |-
    Losses are exponential with mean {th:dp0} dollars, and a policy pays the loss minus a deductible of
    {ded:dp0} dollars (nothing if the loss is below the deductible). Find the probability that a loss pays
    nothing (4 decimals) and the expected payment per loss in dollars (2 decimals).
  answers:
    - {name: p0, label: '$P(\text{no payment}) =$', tolerance: 0.0001, format: num4}
    - {name: epay, label: 'expected payment $=$', tolerance: 0.01, format: num2}
  solution: |-
    No payment when $X \le {ded:dp0}$: $1 - e^{-{ded:dp0}/{th:dp0}} = 1 - e^{-{fr}} \approx$ **{p0:num4}**.

    $E[(X - {ded:dp0})^+] = \displaystyle\int_{{ded:dp0}}^\infty e^{-x/{th:dp0}}\,dx = {th:dp0}\,e^{-{fr}} \approx$ **{epay:num2}** dollars.
    (The policyholder's share is $E[\min(X, {ded:dp0})] = {th:dp0}(1 - e^{-{fr}}) \approx {elim:num2}$, and the two add to {th:dp0}.)

- id: ps-m3-r2-censored-mean
  title: A censored exponential life test
  topic: Censoring and deductibles
  vars:
    mm: {choices: [200, 400, 500, 800, 1000, 2000]}
    fr: {choices: [0.25, 0.5, 0.75, 1, 1.5]}
  calc:
    cc: mm*fr
    pc: exp(-fr)
    et: mm*(1 - exp(-fr))
  prompt: |-
    Lifetimes are exponential with mean {mm:dp0} hours, and a life test stops at {cc:dp0} hours, so the recorded
    time is $T = \min(X, {cc:dp0})$. Find the probability that an item is censored (still running at the end;
    4 decimals) and $E(T)$ in hours (1 decimal).
  answers:
    - {name: pc, label: '$P(\text{censored}) =$', tolerance: 0.0001, format: num4}
    - {name: et, label: '$E(T) =$', tolerance: 0.1, format: num1}
  solution: |-
    Censored means $X > {cc:dp0}$: $e^{-{cc:dp0}/{mm:dp0}} = e^{-{fr}} \approx$ **{pc:num4}**.

    $E(T) = \displaystyle\int_0^{{cc:dp0}} P(X > x)\,dx = \int_0^{{cc:dp0}} e^{-x/{mm:dp0}}\,dx = {mm:dp0}(1 - e^{-{fr}}) \approx$ **{et:num1}** hours,
    well below the true mean {mm:dp0}.
