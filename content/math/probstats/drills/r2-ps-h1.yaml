# Round 2, honors module ps-h1 (Modern statistical methods): drills for lessons 90–93.
- id: ps-h1-r2-js-factor
  title: James–Stein estimate toward zero
  topic: Shrinkage estimation
  vars:
    sg: {choices: [1, 2]}
    u1: {min: -4, max: 4, step: 0.1}
    u2: {min: -4, max: 4, step: 0.1}
    u3: {min: -4, max: 4, step: 0.1}
    u4: {min: -4, max: 4, step: 0.1}
    u5: {min: -4, max: 4, step: 0.1}
  calc:
    x1: round(sg*u1, 1)
    x2: round(sg*u2, 1)
    x3: round(sg*u3, 1)
    x4: round(sg*u4, 1)
    x5: round(sg*u5, 1)
    ss: x1^2 + x2^2 + x3^2 + x4^2 + x5^2
    sg2: sg^2
    k3: 3*sg2
    fac: 1 - k3/ss
    est: fac*x1
  where: ['fac >= 0.2', 'abs(x1) >= 0.5']
  prompt: |-
    Five independent observations $X_i \sim N(\theta_i, \sigma^2)$ with $\sigma = {sg}$ are
    $$({x1:num1},\; {x2:num1},\; {x3:num1},\; {x4:num1},\; {x5:num1}).$$
    Find the James–Stein shrinkage factor toward 0 (4 decimals) and the James–Stein estimate of $\theta_1$ (3 decimals).
  answers:
    - {name: fac, label: 'factor', tolerance: 0.0006, format: num4}
    - {name: est, label: '$\hat\theta_1 =$', tolerance: 0.002, format: dp3}
  solution: |-
    $\|\mathbf X\|^2 = {ss:num4}$ and $(p - 2)\sigma^2 = 3({sg2}) = {k3}$.

    Factor: $1 - {k3}/{ss:num4} =$ **{fac:num4}**.

    $\hat\theta_1 = {fac:num4} \times ({x1:num1}) =$ **{est:dp3}**.

- id: ps-h1-r2-js-grand
  title: Shrink toward the grand mean
  topic: Shrinkage estimation
  vars:
    s2: {choices: [0.25, 0.5, 1]}
    cc: {min: 8, max: 30}
    d1: {min: -2.5, max: 2.5, step: 0.1}
    d2: {min: -2.5, max: 2.5, step: 0.1}
    d3: {min: -2.5, max: 2.5, step: 0.1}
    d4: {min: -2.5, max: 2.5, step: 0.1}
    d5: {min: -2.5, max: 2.5, step: 0.1}
    d6: {min: -2.5, max: 2.5, step: 0.1}
  calc:
    x1: round(cc + d1, 1)
    x2: round(cc + d2, 1)
    x3: round(cc + d3, 1)
    x4: round(cc + d4, 1)
    x5: round(cc + d5, 1)
    x6: round(cc + d6, 1)
    xb: mean(x1, x2, x3, x4, x5, x6)
    ss: (x1 - xb)^2 + (x2 - xb)^2 + (x3 - xb)^2 + (x4 - xb)^2 + (x5 - xb)^2 + (x6 - xb)^2
    k3: 3*s2
    fac: 1 - k3/ss
    est: xb + fac*(x1 - xb)
  where: ['fac >= 0.2', 'abs(x1 - xb) >= 0.5']
  prompt: |-
    Six track sections have mean scores $X_i \sim N(\theta_i, \sigma^2)$, independent, with $\sigma^2 = {s2}$:
    $$({x1:num1},\; {x2:num1},\; {x3:num1},\; {x4:num1},\; {x5:num1},\; {x6:num1}).$$
    Shrinking toward the grand mean, find the shrinkage factor (4 decimals) and the estimate of $\theta_1$ (3 decimals).
  answers:
    - {name: fac, label: 'factor', tolerance: 0.0006, format: num4}
    - {name: est, label: '$\hat\theta_1 =$', tolerance: 0.002, format: dp3}
  solution: |-
    $\bar X = {xb:num4}$ and $S = \sum(X_i - \bar X)^2 = {ss:num4}$. With $p = 6$, $(p - 3)\sigma^2 = 3({s2}) = {k3}$.

    Factor: $1 - {k3}/{ss:num4} =$ **{fac:num4}**.

    $\hat\theta_1 = {xb:num4} + {fac:num4}({x1:num1} - {xb:num4}) =$ **{est:dp3}**.

- id: ps-h1-r2-ridge-1d
  title: Ridge slope for one predictor
  topic: Regularized regression
  vars:
    sxx: {min: 10, max: 120, step: 2}
    sxy: {min: -80, max: 80, step: 0.5}
    lam: {choices: [1, 2, 5, 10, 20, 50]}
  calc:
    bls: sxy/sxx
    den: sxx + lam
    b: sxy/den
  where: ['abs(sxy) >= 3']
  prompt: |-
    A centered predictor has $S_{xx} = {sxx}$ and $S_{xy} = {sxy:num1}$. Find the ridge estimate of the slope,
    minimizing $\sum(y_i - \bar y - b x_i)^2 + \lambda b^2$ with $\lambda = {lam}$ (4 decimals).
  answers:
    - {name: b, label: '$b^{\text{ridge}} =$', tolerance: 0.0006, format: num4}
  solution: |-
    Setting the derivative $-2S_{xy} + 2bS_{xx} + 2\lambda b$ to zero gives $b = S_{xy}/(S_{xx} + \lambda)$:

    $b = {sxy:num1}/({sxx} + {lam}) = {sxy:num1}/{den} =$ **{b:num4}**.

    (Least squares would give ${bls:num4}$; the penalty shrinks it toward 0.)

- id: ps-h1-r2-lasso-1d
  title: Lasso slope by soft thresholding
  topic: Regularized regression
  vars:
    sxx: {min: 10, max: 100, step: 2}
    sxy: {min: -60, max: 60, step: 0.5}
    lam: {choices: [4, 10, 20, 40, 60, 100]}
  calc:
    half: lam/2
    ab: abs(sxy)
    cut: ab - half
    b: if(cut <= 0, 0, sign(sxy)*cut/sxx)
    bls: sxy/sxx
  where: ['ab >= 2']
  prompt: |-
    A centered predictor has $S_{xx} = {sxx}$ and $S_{xy} = {sxy:num1}$. Find the lasso estimate of the slope,
    minimizing $\sum(y_i - \bar y - b x_i)^2 + \lambda|b|$ with $\lambda = {lam}$ (4 decimals; enter 0 if the slope is zero).
  answers:
    - {name: b, label: '$b^{\text{lasso}} =$', tolerance: 0.0006, format: num4}
  solution: |-
    Soft thresholding: $b = \operatorname{sign}(S_{xy})\max(|S_{xy}| - \lambda/2,\, 0)/S_{xx}$.

    $|S_{xy}| - \lambda/2 = {ab:num1} - {half:num1} = {cut:num1}$. If this is not positive the slope is 0; otherwise divide by $S_{xx} = {sxx}$ and keep the sign of $S_{xy}$.

    $b =$ **{b:num4}** (least squares: ${bls:num4}$).

- id: ps-h1-r2-ridge-mse
  title: Bias, variance and MSE of a ridge slope
  topic: Regularized regression
  vars:
    beta: {choices: [0.5, 1, 1.5, 2, -1, -0.5]}
    s2: {choices: [1, 4, 9]}
    sxx: {min: 2, max: 40}
    lam: {min: 1, max: 20}
  calc:
    den: sxx + lam
    bias: -lam*beta/den
    vr: s2*sxx/den^2
    mse: vr + bias^2
    mls: s2/sxx
    lstar: s2/beta^2
  prompt: |-
    One centered predictor has $S_{xx} = {sxx}$; the true slope is $\beta = {beta}$ and the error variance is $\sigma^2 = {s2}$.
    For the ridge slope $b = S_{xy}/(S_{xx} + \lambda)$ with $\lambda = {lam}$, find its variance and its MSE (3 significant figures each).
  answers:
    - {name: vr, label: 'Variance', sigfigs: 3, format: sig3}
    - {name: mse, label: 'MSE', sigfigs: 3, format: sig3}
  solution: |-
    $\operatorname{Var}(b) = \sigma^2S_{xx}/(S_{xx} + \lambda)^2 = {s2}({sxx})/{den}^2 =$ **{vr:sig3}**.

    Bias $= -\lambda\beta/(S_{xx} + \lambda) = {bias:sig3}$, so $\operatorname{MSE} = \operatorname{Var} + \text{Bias}^2 =$ **{mse:sig3}**.

    For comparison, least squares has MSE $\sigma^2/S_{xx} = {mls:sig3}$, and the best penalty is $\lambda^* = \sigma^2/\beta^2 = {lstar:sig3}$.

- id: ps-h1-r2-fwer
  title: Chance of a false rejection among many tests
  topic: Multiple testing
  vars:
    m: {choices: [3, 5, 8, 10, 15, 20, 30, 50]}
    al: {choices: [0.01, 0.05, 0.1]}
  calc:
    none: (1 - al)^m
    fw: 1 - none
    ev: m*al
  prompt: |-
    $m = {m}$ independent tests are each run at level $\alpha = {al}$, and every null hypothesis is true.
    Find the probability of at least one false rejection (4 decimals) and the expected number of false rejections.
  answers:
    - {name: fw, label: '$P(V \ge 1) =$', tolerance: 0.0006, format: num4}
    - {name: ev, label: '$E(V) =$', tolerance: 0.001}
  solution: |-
    $P(\text{no false rejection}) = (1 - {al})^{{m}} = {none:num4}$, so $P(V \ge 1) = 1 - {none:num4} =$ **{fw:num4}**.

    Each test rejects with probability ${al}$, so $E(V) = m\alpha = {m}({al}) =$ **{ev}**.

- id: ps-h1-r2-bh-count
  title: Count Benjamini–Hochberg rejections
  topic: Multiple testing
  vars:
    q: {choices: [0.05, 0.1]}
    u1: {min: 0.001, max: 0.012, step: 0.001}
    d2: {min: 0.001, max: 0.02, step: 0.001}
    d3: {min: 0.001, max: 0.02, step: 0.001}
    d4: {min: 0.001, max: 0.03, step: 0.001}
    d5: {min: 0.001, max: 0.03, step: 0.001}
    d6: {min: 0.001, max: 0.3, step: 0.001}
  calc:
    p1: round(u1, 3)
    p2: round(p1 + d2, 3)
    p3: round(p2 + d3, 3)
    p4: round(p3 + d4, 3)
    p5: round(p4 + d5, 3)
    p6: round(p5 + d6, 3)
    t1: q/6
    t2: 2*q/6
    t3: 3*q/6
    t4: 4*q/6
    t5: 5*q/6
    t6: q
    k: max(1*(p1 <= t1), 2*(p2 <= t2), 3*(p3 <= t3), 4*(p4 <= t4), 5*(p5 <= t5), 6*(p6 <= t6))
  where: ['abs(p1 - t1) > 0.0004', 'abs(p2 - t2) > 0.0004', 'abs(p3 - t3) > 0.0004', 'abs(p4 - t4) > 0.0004', 'abs(p5 - t5) > 0.0004', 'abs(p6 - t6) > 0.0004', 'p6 < 1']
  prompt: |-
    Six sorted p-values are
    $${p1:dp3},\; {p2:dp3},\; {p3:dp3},\; {p4:dp3},\; {p5:dp3},\; {p6:dp3}.$$
    How many hypotheses does the Benjamini–Hochberg procedure reject at $q = {q}$?
  answers:
    - {name: k, label: 'Rejections', format: integer}
  solution: |-
    Compare each $p_{(k)}$ with its line $kq/m$:
    $${t1:dp4},\; {t2:dp4},\; {t3:dp4},\; {t4:dp4},\; {t5:dp4},\; {t6:dp4}.$$
    Find the *largest* $k$ with $p_{(k)}$ on or below its line (BH is step-up: earlier p-values above their lines don't matter)
    and reject the $k$ smallest. Answer: **{k}**.

- id: ps-h1-r2-holm-count
  title: Count Holm rejections
  topic: Multiple testing
  vars:
    al: {choices: [0.05, 0.1]}
    u1: {min: 0.001, max: 0.012, step: 0.001}
    d2: {min: 0.001, max: 0.015, step: 0.001}
    d3: {min: 0.001, max: 0.015, step: 0.001}
    d4: {min: 0.001, max: 0.02, step: 0.001}
    d5: {min: 0.001, max: 0.03, step: 0.001}
    d6: {min: 0.001, max: 0.3, step: 0.001}
  calc:
    p1: round(u1, 3)
    p2: round(p1 + d2, 3)
    p3: round(p2 + d3, 3)
    p4: round(p3 + d4, 3)
    p5: round(p4 + d5, 3)
    p6: round(p5 + d6, 3)
    t1: al/6
    t2: al/5
    t3: al/4
    t4: al/3
    t5: al/2
    t6: al
    r1: p1 <= t1
    r2: r1*(p2 <= t2)
    r3: r2*(p3 <= t3)
    r4: r3*(p4 <= t4)
    r5: r4*(p5 <= t5)
    r6: r5*(p6 <= t6)
    k: r1 + r2 + r3 + r4 + r5 + r6
  where: ['abs(p1 - t1) > 0.0004', 'abs(p2 - t2) > 0.0004', 'abs(p3 - t3) > 0.0004', 'abs(p4 - t4) > 0.0004', 'abs(p5 - t5) > 0.0004', 'abs(p6 - t6) > 0.0004', 'p6 < 1']
  prompt: |-
    Six sorted p-values are
    $${p1:dp3},\; {p2:dp3},\; {p3:dp3},\; {p4:dp3},\; {p5:dp3},\; {p6:dp3}.$$
    How many hypotheses does Holm's procedure reject at $\alpha = {al}$?
  answers:
    - {name: k, label: 'Rejections', format: integer}
  solution: |-
    Holm compares $p_{(k)}$ with $\alpha/(m - k + 1)$:
    $${t1:dp4},\; {t2:dp4},\; {t3:dp4},\; {t4:dp4},\; {t5:dp4},\; {t6:dp4}.$$
    Start at the smallest p-value and reject while each is on or below its threshold; stop at the first one above.
    Answer: **{k}**.

- id: ps-h1-r2-expected-fdp
  title: Expected share of false discoveries in a screen
  topic: Multiple testing
  vars:
    m: {choices: [500, 1000, 2000, 5000]}
    pct: {choices: [80, 90, 95, 98]}
    al: {choices: [{label: '0.001', value: 0.001}, {label: '0.01', value: 0.01}, {label: '0.05', value: 0.05}]}
    pw: {choices: [0.5, 0.6, 0.7, 0.8, 0.9]}
  calc:
    m0: m*pct/100
    m1: m - m0
    ev: m0*al
    es: m1*pw
    fr: ev/(ev + es)
  prompt: |-
    A screen runs {m:dp0} tests, each at level $\alpha = {al}$. Suppose {pct}% of the null hypotheses are true and each real effect is
    detected with power {pw}. Find the expected number of false discoveries and, using expected counts, the fraction of discoveries that are false (3 decimals).
  answers:
    - {name: ev, label: 'False discoveries', tolerance: 0.01, format: num4}
    - {name: fr, label: 'Fraction false', tolerance: 0.0015, format: dp3}
  solution: |-
    True nulls: $m_0 = {m0:dp0}$; real effects: ${m1:dp0}$.

    Expected false discoveries $= m_0\alpha = {m0:dp0}({al}) =$ **{ev:num4}**; expected true discoveries $= {m1:dp0}({pw}) = {es:num4}$.

    Fraction false $\approx {ev:num4}/({ev:num4} + {es:num4}) =$ **{fr:dp3}**.

- id: ps-h1-r2-mh-accept
  title: Metropolis acceptance probability
  topic: Markov chain Monte Carlo
  vars:
    mu: {choices: [0, 1, 2, 5, 10]}
    sd: {choices: [1, 2, 3]}
    dx: {min: -2, max: 2, step: 0.1}
    st: {min: -2, max: 2, step: 0.1}
  calc:
    x: round(mu + sd*dx, 1)
    y: round(x + st, 1)
    lr: -((y - mu)^2 - (x - mu)^2)/(2*sd^2)
    rt: exp(lr)
    al: min(1, rt)
  where: ['abs(st) >= 0.3', 'rt < 0.98 or rt > 1.02']
  prompt: |-
    A random-walk Metropolis sampler (symmetric normal proposal) targets $N({mu}, {sd}^2)$, so $f(x) = e^{-(x - {mu})^2/(2 \cdot {sd}^2)}$
    up to a constant. The current state is $x = {x:num1}$ and the proposal is $y = {y:num1}$. Find the acceptance probability (4 decimals).
  answers:
    - {name: al, label: '$\alpha =$', tolerance: 0.0006, format: num4}
  solution: |-
    With a symmetric proposal, $\alpha = \min\big(1, f(y)/f(x)\big)$ and
    $$\ln\frac{f(y)}{f(x)} = -\frac{({y:num1} - {mu})^2 - ({x:num1} - {mu})^2}{2({sd})^2} = {lr:num4}.$$
    So $f(y)/f(x) = {rt:num4}$ and $\alpha = \min(1, {rt:num4}) =$ **{al:num4}**.

- id: ps-h1-r2-ess
  title: Effective sample size and Monte Carlo error
  topic: Markov chain Monte Carlo
  vars:
    n: {choices: [2000, 5000, 10000, 20000, 50000]}
    rho: {choices: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]}
    s: {min: 0.2, max: 5, step: 0.1}
  calc:
    ess: n*(1 - rho)/(1 + rho)
    mcse: s/sqrt(ess)
    iid: s/sqrt(n)
  prompt: |-
    An MCMC run of $N = {n:dp0}$ draws has autocorrelations close to $\rho^k$ with $\rho = {rho}$, and the draws have
    standard deviation $s = {s:num1}$. Estimate the effective sample size (nearest whole number) and the Monte Carlo
    standard error of the posterior mean estimate (3 significant figures, using the unrounded ESS).
  answers:
    - {name: ess, label: 'ESS', tolerance: 1, format: num1}
    - {name: mcse, label: 'MC standard error', relTolerance: 0.006, format: sig3}
  solution: |-
    $\text{ESS} \approx N\dfrac{1 - \rho}{1 + \rho} = {n:dp0} \cdot \dfrac{1 - {rho}}{1 + {rho}} =$ **{ess:num1}**.

    Monte Carlo standard error $\approx s/\sqrt{\text{ESS}} = {s:num1}/\sqrt{{ess:num1}} =$ **{mcse:sig3}**
    (independent draws would give $s/\sqrt N = {iid:sig3}$).
