# Round 2 drills for module ps-m5 (honors lessons 22h1 and 22h2)
- id: ps-m5-r2-hoeffding-n
  title: Sample size from Hoeffding's inequality
  topic: Concentration inequalities
  vars:
    eps: {choices: [0.01, 0.02, 0.025, 0.03, 0.04, 0.05, 0.1]}
    dl: {choices: [{label: '0.10', value: 0.1}, {label: '0.05', value: 0.05}, {label: '0.01', value: 0.01}, {label: '0.001', value: 0.001}]}
    rg: {choices: [1, 2, 5, 10]}
  calc:
    raw: rg^2*ln(2/dl)/(2*eps^2)
    nh: ceil(raw - 1e-9)
  where: ['nh <= 500000']
  prompt: |-
    Each observation is known to lie between 0 and {rg}; nothing else is known about its distribution.
    Using Hoeffding's inequality, find the smallest $n$ that guarantees
    $P(|\bar X_n - \mu| \ge {eps}) \le {dl}$.
  answers:
    - {name: nh, label: '$n =$', format: integer}
  solution: |-
    Two-sided Hoeffding for values in an interval of length {rg}:
    $P(|\bar X_n - \mu| \ge {eps}) \le 2\exp\!\Big(-\dfrac{2n({eps})^2}{{rg}^2}\Big)$.
    Setting this $\le {dl}$ and taking logs: $n \ge \dfrac{{rg}^2\ln(2/{dl})}{2({eps})^2} = {raw:num2}$.
    Round up: $n =$ **{nh:int}**.

- id: ps-m5-r2-chernoff-binom
  title: Chernoff and Hoeffding bounds for a binomial tail
  topic: Concentration inequalities
  vars:
    nn: {min: 40, max: 400, step: 20}
    pp: {choices: [0.1, 0.2, 0.25, 0.3, 0.4, 0.5]}
    dd: {choices: [0.05, 0.1, 0.15, 0.2]}
  calc:
    kk: round(nn*(pp + dd))
    aa: kk/nn
    kl: aa*ln(aa/pp) + (1 - aa)*ln((1 - aa)/(1 - pp))
    ch: exp(-nn*kl)
    hf: exp(-2*nn*(aa - pp)^2)
    mu: nn*pp
    qa: 1 - aa
    qp: 1 - pp
  where: ['pp + dd <= 0.9', 'nn*kl >= 1', 'nn*kl <= 12']
  prompt: |-
    $S \sim \text{Bin}({nn}, {pp})$. Find (a) the Chernoff bound $e^{-nD(a\,\|\,p)}$ and (b) the Hoeffding bound
    $e^{-2n(a - p)^2}$ for $P(S \ge {kk:int})$. Give each to 3 significant figures.
  answers:
    - {name: ch, label: '(a) Chernoff', sigfigs: 3}
    - {name: hf, label: '(b) Hoeffding', sigfigs: 3}
  solution: |-
    The cutoff as a proportion is $a = {kk:int}/{nn} = {aa:num2}$, above $p = {pp}$ (the mean is {mu:num1}).

    (a) $D(a\,\|\,p) = {aa:num2}\ln\dfrac{{aa:num2}}{{pp}} + {qa:num2}\ln\dfrac{{qa:num2}}{{qp:num2}}$. Computing,
    $D = {kl:dp3}$ (to 3 places; keep full precision), so the bound is $e^{-{nn}D} =$ **{ch:sig3}**.

    (b) $e^{-2({nn})({aa:num2} - {pp})^2} =$ **{hf:sig3}**. It is never smaller than the Chernoff bound, because $D(a\,\|\,p) \ge 2(a - p)^2$.

- id: ps-m5-r2-slutsky-ci
  title: Large-sample interval for a mean using S
  topic: Modes of convergence
  vars:
    nn: {choices: [40, 50, 64, 80, 100, 144, 200]}
    xb: {min: 20, max: 90, step: 0.1}
    sd: {min: 4, max: 30, step: 0.1}
    cf: {choices: [{label: '90%', value: 0.90}, {label: '95%', value: 0.95}, {label: '99%', value: 0.99}]}
  calc:
    zz: invnorm(1 - (1 - cf)/2)
    se: sd/sqrt(nn)
    me: zz*se
    lo: xb - me
    hi: xb + me
  prompt: |-
    A random sample of {nn} observations from a population of unknown shape has $\bar x = {xb:num1}$ and $s = {sd:num1}$.
    Using the CLT with Slutsky's theorem, give an approximate {cf} confidence interval for $\mu$. Give 2 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.01, format: num2}
    - {name: hi, label: 'Upper', tolerance: 0.01, format: num2}
  solution: |-
    By the CLT and Slutsky, $(\bar X - \mu)/(S/\sqrt n)$ is approximately $N(0, 1)$ for large $n$, so we use $z = {zz:num4}$.
    Standard error: ${sd:num1}/\sqrt{{nn}} = {se:num4}$. Margin: ${zz:num4} \times {se:num4} = {me:num4}$.
    Interval: ${xb:num1} \pm {me:num4}$, from **{lo:num2}** to **{hi:num2}**.

- id: ps-m5-r2-wald-prop
  title: Wald interval for a proportion
  topic: Modes of convergence
  vars:
    nn: {min: 100, max: 1500, step: 50}
    fr: {min: 0.08, max: 0.92, step: 0.01}
    cf: {choices: [{label: '90%', value: 0.90}, {label: '95%', value: 0.95}, {label: '99%', value: 0.99}]}
  calc:
    xx: round(nn*fr)
    ph: xx/nn
    zz: invnorm(1 - (1 - cf)/2)
    se: sqrt(ph*(1 - ph)/nn)
    me: zz*se
    lo: ph - me
    hi: ph + me
  where: ['xx >= 10', 'nn - xx >= 10']
  prompt: |-
    In a random sample of {nn} people, {xx:int} have a certain trait. Give the approximate {cf} Wald interval
    $\hat p \pm z\sqrt{\hat p(1 - \hat p)/n}$ for the population proportion. Give 3 decimals.
  answers:
    - {name: lo, label: 'Lower', tolerance: 0.001, format: dp3}
    - {name: hi, label: 'Upper', tolerance: 0.001, format: dp3}
  solution: |-
    $\hat p = {xx:int}/{nn} = {ph:num4}$. Slutsky lets us use $\hat p$ inside the standard error:
    $\sqrt{{ph:num4}(1 - {ph:num4})/{nn}} = {se:num4}$. With $z = {zz:num4}$ the margin is {me:num4},
    so the interval runs from **{lo:dp3}** to **{hi:dp3}**.
