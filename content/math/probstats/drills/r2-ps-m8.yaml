# Round 2 drills for ps-m8 (honors lessons 36h1 multiple regression, 36h2 blocking and two-way ANOVA).

- id: ps-m8-r2-two-predictor-fit
  title: Fit a regression with two predictors
  topic: Multiple regression
  vars:
    s11v: {min: 20, max: 200}
    s22v: {min: 5, max: 60}
    s12v: {min: -40, max: 40}
    b1t: {min: -2, max: 3, step: 0.05}
    b2t: {min: -3, max: 3, step: 0.05}
    n1: {min: -30, max: 30}
    n2: {min: -10, max: 10}
    x1b: {min: 2, max: 20, step: 0.5}
    x2b: {min: 1, max: 10, step: 0.5}
    ybv: {min: 10, max: 60, step: 0.1}
  calc:
    s1y: round(b1t*s11v + b2t*s12v + n1/10, 1)
    s2y: round(b1t*s12v + b2t*s22v + n2/10, 1)
    det: s11v*s22v - s12v^2
    b1: (s22v*s1y - s12v*s2y)/det
    b2: (s11v*s2y - s12v*s1y)/det
    b0: ybv - b1*x1b - b2*x2b
    rr: s12v/sqrt(s11v*s22v)
  where: ['abs(rr) <= 0.8', 'abs(b1t) >= 0.2', 'abs(b2t) >= 0.2', 's12v != 0']
  prompt: |-
    A regression of $y$ on two predictors has means $\bar x_1 = {x1b:num1}$, $\bar x_2 = {x2b:num1}$,
    $\bar y = {ybv:num1}$ and centered sums of squares and products

    $$S_{11} = {s11v}, \quad S_{22} = {s22v}, \quad S_{12} = {s12v}, \quad S_{1y} = {s1y:num1}, \quad S_{2y} = {s2y:num1}.$$

    Find the least squares coefficients $b_1$, $b_2$ and $b_0$ (4 decimals each).
  answers:
    - {name: b1, label: '$b_1 =$', tolerance: 0.0006, format: num4}
    - {name: b2, label: '$b_2 =$', tolerance: 0.0006, format: num4}
    - {name: b0, label: '$b_0 =$', tolerance: 0.002, format: num4}
  solution: |-
    Solve $\begin{bmatrix} {s11v} & {s12v} \\ {s12v} & {s22v} \end{bmatrix}\begin{bmatrix} b_1 \\ b_2 \end{bmatrix} = \begin{bmatrix} {s1y:num1} \\ {s2y:num1} \end{bmatrix}$.
    The determinant is $S_{11}S_{22} - S_{12}^2 = {det:dp0}$.

    $b_1 = \dfrac{S_{22}S_{1y} - S_{12}S_{2y}}{{det:dp0}} =$ **{b1:num4}**, $\quad b_2 = \dfrac{S_{11}S_{2y} - S_{12}S_{1y}}{{det:dp0}} =$ **{b2:num4}**.

    $b_0 = \bar y - b_1\bar x_1 - b_2\bar x_2 =$ **{b0:num4}**.

- id: ps-m8-r2-coef-test
  title: t test for one coefficient in a multiple regression
  topic: Multiple regression
  vars:
    nn: {min: 15, max: 60}
    kk: {min: 2, max: 5}
    sres: {min: 0.5, max: 8, step: 0.01}
    cjj: {min: 0.002, max: 0.2, step: 0.001}
    bj: {min: -5, max: 5, step: 0.01}
  calc:
    pp: kk + 1
    dfree: nn - pp
    se: sres*sqrt(cjj)
    tt: bj/se
    pv: 2*(1 - tcdf(abs(tt), dfree))
  where: ['abs(tt) >= 0.5', 'abs(tt) <= 6', 'pv >= 0.0005']
  prompt: |-
    A regression on $n = {nn}$ observations has {kk} predictors plus an intercept and residual
    standard deviation $s = {sres:num2}$. For one coefficient, $b_j = {bj:num2}$ and the matching
    diagonal entry of $(\mathbf{X}^\top\mathbf{X})^{-1}$ is $c_{jj} = {cjj:num4}$. Find $\text{SE}(b_j)$
    (4 decimals), the $t$ statistic for $H_0: \beta_j = 0$ (3 decimals) and the two-sided p-value
    (4 decimals).
  answers:
    - {name: se, label: '$\text{SE}(b_j) =$', tolerance: 0.0006, format: num4}
    - {name: tt, label: '$t =$', tolerance: 0.005, format: dp3}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    $\text{SE}(b_j) = s\sqrt{c_{jj}} = {sres:num2}\sqrt{{cjj:num4}} =$ **{se:num4}**.

    $t = b_j/\text{SE}(b_j) =$ **{tt:dp3}** on $n - p = {nn} - {pp} = {dfree}$ df; two-sided p-value $\approx$ **{pv:num4}**.

- id: ps-m8-r2-adj-r2-f
  title: R-squared, adjusted R-squared and the overall F test
  topic: Multiple regression
  vars:
    nn: {min: 12, max: 80}
    kk: {min: 2, max: 6}
    sst: {min: 100, max: 2000, step: 10}
    fr: {min: 0.1, max: 0.85, step: 0.01}
  calc:
    pp: kk + 1
    sse: round(fr*sst, 1)
    ssr: sst - sse
    rsq: 1 - sse/sst
    radj: 1 - (sse/(nn - pp))/(sst/(nn - 1))
    ff: (ssr/kk)/(sse/(nn - pp))
    pv: 1 - fcdf(ff, kk, nn - pp)
    dfe: nn - pp
  where: ['nn - pp >= 6', 'radj > 0', 'pv >= 0.0005']
  prompt: |-
    A regression on $n = {nn}$ observations with {kk} predictors plus an intercept has
    $\text{SST} = {sst:dp0}$ and $\text{SSE} = {sse:dp1}$. Find $R^2$ and adjusted $R^2$ (4 decimals each), the
    overall $F$ statistic (2 decimals) and its p-value (4 decimals).
  answers:
    - {name: rsq, label: '$R^2 =$', tolerance: 0.0006, format: num4}
    - {name: radj, label: '$R^2_{\text{adj}} =$', tolerance: 0.0006, format: num4}
    - {name: ff, label: '$F =$', tolerance: 0.01, format: num2}
    - {name: pv, label: 'p-value', tolerance: 0.001, format: num4}
  solution: |-
    $p = {pp}$ coefficients. $R^2 = 1 - \text{SSE}/\text{SST} = 1 - {sse:dp1}/{sst:dp0} =$ **{rsq:num4}**.

    $R^2_{\text{adj}} = 1 - \dfrac{\text{SSE}/(n - p)}{\text{SST}/(n - 1)} = 1 - \dfrac{{sse:dp1}/{dfe}}{{sst:dp0}/({nn} - 1)} =$ **{radj:num4}**.

    $\text{SSR} = {ssr:dp1}$, so $F = \dfrac{\text{SSR}/{kk}}{\text{SSE}/{dfe}} =$ **{ff:num2}** on ({kk}, {dfe}) df; p-value $\approx$ **{pv:num4}**.

- id: ps-m8-r2-block-anova
  title: Randomized block ANOVA from raw data
  topic: Two-way ANOVA
  vars:
    mu: {min: 30, max: 70}
    t1: {min: -4, max: 4}
    t2: {min: -4, max: 4}
    bl1: {min: -12, max: 12}
    bl2: {min: -12, max: 12}
    bl3: {min: -12, max: 12}
    e11: {min: -2, max: 2}
    e12: {min: -2, max: 2}
    e13: {min: -2, max: 2}
    e14: {min: -2, max: 2}
    e21: {min: -2, max: 2}
    e22: {min: -2, max: 2}
    e23: {min: -2, max: 2}
    e24: {min: -2, max: 2}
    e31: {min: -2, max: 2}
    e32: {min: -2, max: 2}
    e33: {min: -2, max: 2}
    e34: {min: -2, max: 2}
  calc:
    t3: -t1 - t2
    bl4: -bl1 - bl2 - bl3
    y11: mu + t1 + bl1 + e11
    y12: mu + t1 + bl2 + e12
    y13: mu + t1 + bl3 + e13
    y14: mu + t1 + bl4 + e14
    y21: mu + t2 + bl1 + e21
    y22: mu + t2 + bl2 + e22
    y23: mu + t2 + bl3 + e23
    y24: mu + t2 + bl4 + e24
    y31: mu + t3 + bl1 + e31
    y32: mu + t3 + bl2 + e32
    y33: mu + t3 + bl3 + e33
    y34: mu + t3 + bl4 + e34
    tm1: mean(y11, y12, y13, y14)
    tm2: mean(y21, y22, y23, y24)
    tm3: mean(y31, y32, y33, y34)
    bm1: mean(y11, y21, y31)
    bm2: mean(y12, y22, y32)
    bm3: mean(y13, y23, y33)
    bm4: mean(y14, y24, y34)
    gm: mean(tm1, tm2, tm3)
    sst: 12*pvariance(y11, y12, y13, y14, y21, y22, y23, y24, y31, y32, y33, y34)
    sstr: 12*pvariance(tm1, tm2, tm3)
    ssb: 12*pvariance(bm1, bm2, bm3, bm4)
    sse: sst - sstr - ssb
    mstr: sstr/2
    mse: sse/6
    ff: mstr/mse
    pv: 1 - fcdf(ff, 2, 6)
  where: ['abs(bl4) <= 15', 'sse >= 2', 'ff <= 60', 'pv >= 0.0005', 'abs(t1) + abs(t2) >= 2']
  prompt: |-
    Three treatments are compared in four blocks (one observation per treatment in each block):

    $$\begin{array}{c|cccc} & \text{Block 1} & \text{Block 2} & \text{Block 3} & \text{Block 4} \\ \hline \text{T1} & {y11} & {y12} & {y13} & {y14} \\ \text{T2} & {y21} & {y22} & {y23} & {y24} \\ \text{T3} & {y31} & {y32} & {y33} & {y34} \end{array}$$

    Find SSTr, SSB and SSE (2 decimals each) and the treatment $F$ statistic (2 decimals).
  answers:
    - {name: sstr, label: 'SSTr', tolerance: 0.01, format: num2}
    - {name: ssb, label: 'SSB', tolerance: 0.01, format: num2}
    - {name: sse, label: 'SSE', tolerance: 0.01, format: num2}
    - {name: ff, label: '$F =$', tolerance: 0.02, format: num2}
  solution: |-
    Treatment means ${tm1:num2}, {tm2:num2}, {tm3:num2}$; block means ${bm1:num2}, {bm2:num2}, {bm3:num2}, {bm4:num2}$; grand mean ${gm:num4}$.

    $\text{SSTr} = 4\sum(\bar y_{i\cdot} - \bar y_{\cdot\cdot})^2 =$ **{sstr:num2}**, $\quad \text{SSB} = 3\sum(\bar y_{\cdot j} - \bar y_{\cdot\cdot})^2 =$ **{ssb:num2}**.

    $\text{SST} = {sst:dp2}$, so $\text{SSE} = \text{SST} - \text{SSTr} - \text{SSB} =$ **{sse:num2}** on $(2)(3) = 6$ df.

    $F = \dfrac{\text{SSTr}/2}{\text{SSE}/6} = \dfrac{{mstr:num4}}{{mse:num4}} =$ **{ff:num2}** on (2, 6) df (p-value {pv:num4}).

- id: ps-m8-r2-two-way-ss
  title: Sums of squares in a 2 by 2 factorial
  topic: Two-way ANOVA
  vars:
    m11: {min: 5, max: 30}
    m12: {min: 5, max: 30}
    m21: {min: 5, max: 30}
    m22: {min: 5, max: 30}
    rr: {min: 2, max: 6}
    mse: {min: 1, max: 12, step: 0.5}
  calc:
    ga: (m11 + m12)/2
    gb2: (m21 + m22)/2
    ca: (m11 + m21)/2
    cb: (m12 + m22)/2
    gm: (m11 + m12 + m21 + m22)/4
    ssa: 2*rr*((ga - gm)^2 + (gb2 - gm)^2)
    ssb: 2*rr*((ca - gm)^2 + (cb - gm)^2)
    con: m11 - m12 - m21 + m22
    ssab: rr*con^2/4
    fab: ssab/mse
    dfe: 4*(rr - 1)
    pv: 1 - fcdf(fab, 1, dfe)
  where: ['con != 0', 'fab <= 80', 'pv >= 0.0005']
  prompt: |-
    A balanced $2 \times 2$ factorial has $r = {rr}$ observations per cell, cell means

    $$\begin{array}{c|cc} & B_1 & B_2 \\ \hline A_1 & {m11} & {m12} \\ A_2 & {m21} & {m22} \end{array}$$

    and $\text{MSE} = {mse:num1}$. Find $\text{SS}_A$, $\text{SS}_B$, $\text{SS}_{AB}$ (2 decimals each) and the $F$ statistic for
    interaction (2 decimals).
  answers:
    - {name: ssa, label: '$\text{SS}_A =$', tolerance: 0.01, format: num2}
    - {name: ssb, label: '$\text{SS}_B =$', tolerance: 0.01, format: num2}
    - {name: ssab, label: '$\text{SS}_{AB} =$', tolerance: 0.01, format: num2}
    - {name: fab, label: '$F_{AB} =$', tolerance: 0.01, format: num2}
  solution: |-
    Row means ${ga:num2}$ and ${gb2:num2}$, column means ${ca:num2}$ and ${cb:num2}$, grand mean ${gm:num2}$.

    $\text{SS}_A = br\sum(\bar y_{i\cdot\cdot} - \bar y)^2 = 2({rr})\big[({ga:num2} - {gm:num2})^2 + ({gb2:num2} - {gm:num2})^2\big] =$ **{ssa:num2}**, and likewise $\text{SS}_B =$ **{ssb:num2}**.

    Here $\bar y_{11} - \bar y_{12} - \bar y_{21} + \bar y_{22} = {con}$, and in a $2 \times 2$ design each of the four interaction
    estimates is plus or minus a quarter of it, so $\text{SS}_{AB} = 4r({con}/4)^2 =$ **{ssab:num2}**.

    $F_{AB} = \text{SS}_{AB}/\text{MSE} =$ **{fab:num2}** on (1, {dfe}) df (p-value {pv:num4}).
