# Round 2 glossary for ps-m3 honors lessons (14h1 hazard functions, 14h2 mixed distributions)
- term: cumulative hazard function
  aliases: [cumulative hazard]
  definition: '$H(x) = \int_0^x h(t)\,dt$, the hazard rate accumulated up to age $x$; the survival function is $S(x) = e^{-H(x)}$.'
  topic: Hazard functions
- term: Rayleigh distribution
  definition: 'The Weibull distribution with shape $k = 2$: $S(x) = e^{-(x/s)^2}$, with a hazard that rises in a straight line, $h(x) = 2x/s^2$.'
  topic: Lifetime distributions
- term: characteristic life
  definition: 'The scale $s$ of a Weibull distribution, the age by which $1 - e^{-1} \approx 63.2\%$ of units have failed, whatever the shape.'
  topic: Lifetime distributions
- term: B10 life
  aliases: [B10]
  definition: 'The age by which 10% of units have failed, the 10th percentile of the lifetime; for a Weibull, $s\,(-\ln 0.9)^{1/k}$.'
  topic: Lifetime distributions
- term: bathtub curve
  definition: 'An idealized hazard shape with three phases: a falling hazard from early failures, a roughly constant hazard from random failures, and a rising hazard from wear-out.'
  topic: Hazard functions
- term: burn-in
  definition: 'Running new units for a while before they are shipped so that weak ones fail in the factory; useful when the early hazard is decreasing.'
  topic: Hazard functions
- term: Gompertz distribution
  aliases: [Gompertz law]
  definition: 'A lifetime model with exponentially rising hazard $h(x) = a\,e^{bx}$, proposed by Benjamin Gompertz in 1825 for adult human mortality.'
  topic: Lifetime distributions
- term: mean residual life
  aliases: [MRL]
  definition: 'The expected remaining life at age $t$, $m(t) = E(X - t \mid X > t) = \int_t^\infty S(x)\,dx \,/\, S(t)$; constant for the exponential, falling when the hazard rises.'
  topic: Hazard functions
- term: right-continuous
  aliases: [right-continuity]
  definition: 'Equal at each point to the limit from the right, $F(x) = \lim_{t \downarrow x} F(t)$; every cdf has this property, even where it jumps.'
  topic: Mixed random variables
- term: point mass
  aliases: [point masses, atom, atoms]
  definition: 'A single value $a$ with $P(X = a) > 0$; it shows up as a jump of that size in the cdf, $P(X = a) = F(a) - F(a^-)$.'
  topic: Mixed random variables
- term: mixed random variable
  aliases: [mixed random variables, mixed distribution, mixed distributions]
  definition: 'A random variable with both point masses and probability spread continuously with a density between them, such as a wait that is 0 with positive probability.'
  topic: Mixed random variables
- term: limited expected value
  definition: 'The mean of a capped variable, $E[\min(X, c)] = \int_0^c S(x)\,dx$ for $X \ge 0$.'
  topic: Censoring and deductibles
- term: censoring
  aliases: [censored, censored observation, censored observations]
  definition: 'Incomplete observation of a lifetime, for example an item still working when a test stops at time $c$, so all that is known is that its life exceeds $c$.'
  topic: Censoring and deductibles
- term: quantile function
  aliases: [generalized inverse]
  definition: '$F^{-1}(u) = \min\{x : F(x) \ge u\}$ for $0 < u < 1$; it defines quantiles for every distribution, and $F^{-1}(U)$ with $U \sim \text{U}(0, 1)$ has cdf $F$.'
  topic: Mixed random variables
