# Round 2 notecards for module ps-m5
- {front: 'Which tool for a tail probability?', back: 'Full distribution: compute exactly. Average of many iid values: CLT (approximate) or, with $\sigma^2$ or a bound on it, Chebyshev (guaranteed). Variance known: Chebyshev. Only the mean of $X \ge 0$: Markov.', topic: 'Probability inequalities'}
- {front: 'Why the continuity correction uses $k + 0.5$ for $P(X \le k)$', back: 'The bar for $X = k$ runs from $k - 0.5$ to $k + 0.5$; the normal area must reach $k + 0.5$ to include it.', topic: 'Central Limit Theorem'}
# Concentration inequalities (honors)
- {front: 'Chernoff bound', back: '$P(X \ge a) \le \min_{t > 0} e^{-ta}M_X(t)$ (Markov applied to $e^{tX}$).', topic: 'Concentration inequalities'}
- {front: 'Chernoff bound for a normal', back: '$P(X \ge \mu + z\sigma) \le e^{-z^2/2}$ (optimal $t = z/\sigma$).', topic: 'Concentration inequalities'}
- {front: 'Chernoff bound for $S \sim \text{Bin}(n, p)$, $a > p$', back: '$P(S \ge na) \le e^{-nD(a\|p)}$, $D(a\|p) = a\ln\frac{a}{p} + (1-a)\ln\frac{1-a}{1-p}$.', topic: 'Concentration inequalities'}
- {front: 'Why Chernoff bounds decay exponentially in $n$', back: 'For an independent sum the MGF is a product, so the bound is a single-term quantity raised to the power $n$.', topic: 'Concentration inequalities'}
- {front: 'Hoeffding''s lemma', back: '$a \le X \le b \Rightarrow E[e^{s(X - E[X])}] \le e^{s^2(b-a)^2/8}$.', topic: 'Concentration inequalities'}
- {front: 'Hoeffding''s inequality', back: 'Independent $X_i \in [a_i, b_i]$: $P(S_n - E[S_n] \ge u) \le \exp\big(-2u^2/\sum(b_i - a_i)^2\big)$.', topic: 'Concentration inequalities'}
- {front: 'Hoeffding for a mean of values in $[0, 1]$', back: 'One side: $e^{-2n\varepsilon^2}$. Two sides: $P(|\bar X - \mu| \ge \varepsilon) \le 2e^{-2n\varepsilon^2}$.', topic: 'Concentration inequalities'}
- {front: 'Hoeffding sample size', back: '$n \ge \dfrac{(b-a)^2\ln(2/\delta)}{2\varepsilon^2}$ guarantees $P(|\bar X - \mu| \ge \varepsilon) \le \delta$; grows like $\ln(1/\delta)$, not $1/\delta$.', topic: 'Concentration inequalities'}
- {front: 'Poll sample sizes for $\varepsilon = 0.05$, $\delta = 0.10$', back: 'Chebyshev 1,000; Hoeffding 600; CLT approximation 271.', topic: 'Concentration inequalities'}
- {front: 'Chernoff vs Hoeffding for Bernoulli terms', back: 'Chernoff (exact MGF) is never weaker, since $D(a\|p) \ge 2(a - p)^2$.', topic: 'Concentration inequalities'}
- {front: 'Cramér''s theorem', back: '$\frac1n\ln P(\bar X_n \ge a) \to -I(a)$, $I(a) = \sup_t[ta - \ln M(t)]$: the Chernoff exponent is the true rate.', topic: 'Concentration inequalities'}
# Modes of convergence (honors)
- {front: 'Almost sure convergence', back: '$P(\lim Y_n = Y) = 1$: almost every whole sequence converges.', topic: 'Modes of convergence'}
- {front: 'Convergence in mean square', back: '$E[(Y_n - c)^2] \to 0$; implies convergence in probability by Markov.', topic: 'Modes of convergence'}
- {front: 'Implications between modes of convergence', back: 'a.s. ⇒ in probability ⇒ in distribution; mean square ⇒ in probability; in distribution to a constant ⇒ in probability.', topic: 'Modes of convergence'}
- {front: 'Borel–Cantelli lemma', back: '$\sum P(A_n) < \infty$ ⇒ finitely many occur (a.s.). Independent with $\sum P(A_n) = \infty$ ⇒ infinitely many occur (a.s.).', topic: 'Modes of convergence'}
- {front: 'In probability but not almost surely', back: 'Independent $Y_n \sim$ Bernoulli$(1/n)$: $P(Y_n = 1) \to 0$, but $\sum 1/n = \infty$, so $Y_n = 1$ infinitely often.', topic: 'Modes of convergence'}
- {front: 'In probability but not in mean', back: '$Y_n = n$ with probability $1/n$, else 0: $Y_n \xrightarrow{P} 0$ but $E[Y_n] = 1$, $E[Y_n^2] = n$.', topic: 'Modes of convergence'}
- {front: 'In distribution but not in probability', back: '$Y_n = -Z$ with $Z \sim N(0,1)$: same distribution as $Z$, but $|Y_n - Z| = 2|Z|$.', topic: 'Modes of convergence'}
- {front: 'Continuous mapping theorem', back: '$Y_n \xrightarrow{P} c$, $g$ continuous at $c$ ⇒ $g(Y_n) \xrightarrow{P} g(c)$; same for convergence in distribution.', topic: 'Modes of convergence'}
- {front: 'Slutsky''s theorem', back: '$X_n \xrightarrow{d} X$, $Y_n \xrightarrow{P} c$ ⇒ $X_n + Y_n \to X + c$, $X_nY_n \to cX$, $X_n/Y_n \to X/c$ ($c \ne 0$), in distribution.', topic: 'Modes of convergence'}
- {front: 'Large-sample $t$ statistic', back: '$(\bar X - \mu)/(S/\sqrt n) \xrightarrow{d} N(0,1)$ for any finite-variance population: CLT, $S \xrightarrow{P} \sigma$, Slutsky.', topic: 'Modes of convergence'}
- {front: 'Delta method via Slutsky', back: '$\sqrt n(g(\bar X) - g(\mu)) = g''(\xi_n)\sqrt n(\bar X - \mu) \xrightarrow{d} N(0, g''(\mu)^2\sigma^2)$.', topic: 'Modes of convergence'}
