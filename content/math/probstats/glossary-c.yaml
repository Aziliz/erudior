# Glossary for modules ps-m7 (hypothesis testing) and ps-m8 (regression, ANOVA, nonparametric methods).
- term: hypothesis test
  aliases: [hypothesis tests, significance test, test of hypotheses]
  definition: 'A rule that uses the data to decide whether to reject a stated null hypothesis about a parameter in favor of an alternative.'
  topic: Hypothesis testing framework
- term: null hypothesis
  aliases: [H0, null hypotheses]
  definition: 'The hypothesis $H_0: \theta \in \Omega_0$ that a test controls errors against, usually the "no effect" or status-quo claim.'
  topic: Hypothesis testing framework
- term: alternative hypothesis
  aliases: [H1, Ha]
  definition: 'The hypothesis $H_1: \theta \in \Omega_1$ (also written $H_a$) that the investigator seeks evidence for; it may be one-sided ($\mu > \mu_0$) or two-sided ($\mu \ne \mu_0$).'
  topic: Hypothesis testing framework
- term: simple hypothesis
  aliases: [simple hypotheses]
  definition: 'A hypothesis that specifies the distribution of the data completely, such as $\mu = 50$ for a normal sample with known $\sigma$.'
  topic: Hypothesis testing framework
- term: composite hypothesis
  aliases: [composite hypotheses]
  definition: 'A hypothesis that allows more than one distribution, such as $\mu > 50$, or $\mu = 50$ with $\sigma$ unknown.'
  topic: Hypothesis testing framework
- term: test statistic
  aliases: [test statistics]
  definition: 'A function $T$ of the data whose value decides the test; its distribution under $H_0$ (the null distribution) sets the rejection region and p-values.'
  topic: Hypothesis testing framework
- term: rejection region
  aliases: [critical region, rejection regions]
  definition: 'The set $C$ of values of the test statistic (or of the data) for which $H_0$ is rejected.'
  topic: Hypothesis testing framework
- term: critical value
  aliases: [critical values]
  definition: 'A boundary point of the rejection region, such as $c$ in "reject when $T \ge c$".'
  topic: Hypothesis testing framework
- term: Type I error
  aliases: [Type I errors, false alarm]
  definition: 'Rejecting $H_0$ when it is true. Its probability is at most the significance level $\alpha$.'
  topic: Hypothesis testing framework
- term: Type II error
  aliases: [Type II errors, missed detection]
  definition: 'Failing to reject $H_0$ when $H_1$ is true. Its probability at a parameter value $\theta \in \Omega_1$ is $\beta(\theta) = 1 - \pi(\theta)$.'
  topic: Hypothesis testing framework
- term: power function
  aliases: [power functions, power curve]
  definition: 'The function $\pi(\theta) = P_\theta(\text{reject } H_0)$ over the whole parameter space; it gives Type I error probabilities on $\Omega_0$ and powers on $\Omega_1$.'
  topic: Power
- term: size of a test
  aliases: [size]
  definition: 'The largest Type I error probability of a test, $\alpha = \sup_{\theta \in \Omega_0}\pi(\theta)$.'
  topic: Hypothesis testing framework
- term: significance level
  aliases: [level of significance]
  definition: 'The bound $\alpha$ chosen in advance for the Type I error probability; a level-$\alpha$ test has size at most $\alpha$.'
  topic: Hypothesis testing framework
- term: power
  aliases: [power of a test]
  definition: 'The probability $\pi(\theta)$ that a test rejects $H_0$ when the parameter is a particular alternative value $\theta$; equal to $1 - \beta(\theta)$.'
  topic: Power
- term: p-value
  aliases: [p-values, P-value, observed significance level]
  definition: 'The probability, computed under $H_0$, of a test statistic at least as extreme as the one observed; equivalently the smallest $\alpha$ at which the data would reject. Under a simple $H_0$ with a continuous statistic it is Uniform(0, 1).'
  topic: Hypothesis testing framework
- term: one-sample t test
  aliases: [one-sample t-test, t test, t-test]
  definition: 'The test of $H_0: \mu = \mu_0$ for a normal sample with unknown $\sigma$, based on $T = (\bar X - \mu_0)/(S/\sqrt n) \sim t_{n-1}$ under $H_0$.'
  topic: Tests for normal means
- term: z test
  aliases: [z-test, one-sample z test]
  definition: 'A test whose statistic is approximately or exactly standard normal under $H_0$, such as $(\bar X - \mu_0)/(\sigma/\sqrt n)$ with $\sigma$ known.'
  topic: Tests for normal means
- term: pooled variance
  aliases: [pooled sample variance]
  definition: 'The combined estimate $S_p^2 = [(m-1)S_1^2 + (n-1)S_2^2]/(m + n - 2)$ of a variance shared by two populations; used in the pooled two-sample $t$ test with $m + n - 2$ df.'
  topic: Tests for normal means
- term: Welch's t test
  aliases: [Welch t test, Welch's test, Welch–Satterthwaite]
  definition: 'The two-sample test of $\mu_1 = \mu_2$ that does not assume equal variances: $T = (\bar X - \bar Y)/\sqrt{S_1^2/m + S_2^2/n}$, referred to a $t$ distribution with the Satterthwaite approximate degrees of freedom.'
  topic: Tests for normal means
- term: paired t test
  aliases: [paired t-test, matched-pairs t test]
  definition: 'For matched pairs, the one-sample $t$ test applied to the differences $D_i = X_i - Y_i$, with $n - 1$ df.'
  topic: Tests for normal means
- term: F test for variances
  aliases: [F test for two variances, variance ratio test]
  definition: 'The test of $\sigma_1^2 = \sigma_2^2$ for independent normal samples using $F = S_1^2/S_2^2 \sim F_{m-1,\,n-1}$ under $H_0$; sensitive to non-normality.'
  topic: Tests for variances
- term: chi-square test for a variance
  aliases: [chi-square test for variance]
  definition: 'The test of $\sigma^2 = \sigma_0^2$ for a normal sample using $(n-1)S^2/\sigma_0^2 \sim \chi^2_{n-1}$ under $H_0$; not robust to non-normality.'
  topic: Tests for variances
- term: most powerful test
  aliases: [most powerful tests, most powerful region, best test]
  definition: 'For a simple null versus a simple alternative, a level-$\alpha$ test whose power is at least that of every other test of size at most $\alpha$.'
  topic: Neyman–Pearson lemma
- term: Neyman–Pearson lemma
  aliases: [Neyman-Pearson lemma, NP lemma]
  definition: 'For simple $H_0: \theta_0$ versus simple $H_1: \theta_1$, the test that rejects when $L(\theta_0)/L(\theta_1) \le k$, with $k$ set to give size $\alpha$, is most powerful among tests of size at most $\alpha$.'
  topic: Neyman–Pearson lemma
- term: uniformly most powerful test
  aliases: [UMP, UMP test, uniformly most powerful]
  definition: 'A level-$\alpha$ test that is most powerful against every alternative in a composite $H_1$ at once; it exists for one-sided alternatives in families with a monotone likelihood ratio, but generally not for two-sided ones.'
  topic: Neyman–Pearson lemma
- term: monotone likelihood ratio
  aliases: [MLR, monotone likelihood ratio property]
  definition: 'A family has a monotone likelihood ratio in a statistic $T$ if $L(\theta_1)/L(\theta_0)$ is an increasing function of $T$ whenever $\theta_1 > \theta_0$; a one-parameter exponential family has it in its natural statistic $T$ when the natural parameter is increasing in $\theta$ (in $-T$ when it is decreasing).'
  topic: Neyman–Pearson lemma
- term: likelihood ratio test
  aliases: [LRT, likelihood ratio tests, generalized likelihood ratio test, GLRT]
  definition: 'The test that rejects $H_0$ when $\Lambda = \sup_{\Omega_0}L(\theta)/\sup_{\Omega}L(\theta) = L(\hat\theta_0)/L(\hat\theta)$ is small.'
  topic: Likelihood ratio tests
- term: Wilks' theorem
  aliases: [Wilks theorem]
  definition: 'Under regularity conditions and $H_0$, $-2\ln\Lambda$ is approximately $\chi^2_r$ for large samples, where $r = \dim\Omega - \dim\Omega_0$ is the number of parameters fixed by $H_0$.'
  topic: Likelihood ratio tests
- term: one-proportion z test
  aliases: [one-proportion z-test]
  definition: 'The large-sample test of $p = p_0$ using $Z = (\hat p - p_0)/\sqrt{p_0(1 - p_0)/n}$, approximately $N(0,1)$ under $H_0$.'
  topic: Tests for proportions
- term: two-proportion z test
  aliases: [two-proportion z-test]
  definition: 'The large-sample test of $p_1 = p_2$ using $(\hat p_1 - \hat p_2)/\sqrt{\hat p(1 - \hat p)(1/n_1 + 1/n_2)}$ with the pooled proportion $\hat p$.'
  topic: Tests for proportions
- term: pooled proportion
  aliases: [pooled sample proportion]
  definition: 'The estimate $\hat p = (X_1 + X_2)/(n_1 + n_2)$ of the common success probability under $H_0: p_1 = p_2$.'
  topic: Tests for proportions
- term: expected count
  aliases: [expected counts, expected frequency, expected frequencies]
  definition: 'The count a cell would have on average if $H_0$ were true: $np_{i0}$ in a goodness-of-fit test, $R_iC_j/n$ in a two-way table.'
  topic: Chi-square tests
- term: Pearson's chi-square statistic
  aliases: [Pearson chi-square statistic, chi-square statistic, X²]
  definition: 'The statistic $X^2 = \sum (O - E)^2/E$ over all cells, approximately chi-square under $H_0$ when expected counts are not too small.'
  topic: Chi-square tests
- term: multinomial distribution
  definition: 'The joint distribution of the counts in $k$ categories from $n$ independent trials with category probabilities $p_1, \dots, p_k$: $P(o_1, \dots, o_k) = \frac{n!}{o_1!\cdots o_k!}p_1^{o_1}\cdots p_k^{o_k}$; each count is $\text{Bin}(n, p_i)$ and $\operatorname{Cov}(O_i, O_j) = -np_ip_j$.'
  topic: Chi-square tests
- term: goodness-of-fit test
  aliases: [goodness of fit test, chi-square goodness-of-fit test]
  definition: 'A test of whether multinomial counts in $k$ categories follow specified probabilities; $X^2$ has approximately $k - 1 - m$ df, where $m$ parameters are estimated from the data.'
  topic: Chi-square tests
- term: contingency table
  aliases: [two-way table, contingency tables]
  definition: 'A table of counts classifying each item by two categorical variables, with $r$ rows and $c$ columns.'
  topic: Chi-square tests
- term: chi-square test of independence
  aliases: [test of independence]
  definition: 'A test of whether two categorical variables are independent, using $X^2$ with $E_{ij} = R_iC_j/n$ and $(r-1)(c-1)$ df.'
  topic: Chi-square tests
- term: test of homogeneity
  aliases: [homogeneity, chi-square test of homogeneity]
  definition: 'A chi-square test of whether several separately sampled populations share the same distribution over categories; computed exactly like the test of independence.'
  topic: Chi-square tests
- term: G-statistic
  aliases: [G², likelihood ratio chi-square]
  definition: 'The likelihood ratio statistic $G^2 = 2\sum O\ln(O/E)$ for counts; it equals $-2\ln\Lambda$ and is close to Pearson''s $X^2$.'
  topic: Chi-square tests
- term: simple linear regression model
  aliases: [simple linear regression, linear regression model]
  definition: 'The model $Y_i = \beta_0 + \beta_1x_i + \varepsilon_i$ with fixed $x_i$ and independent errors $\varepsilon_i \sim N(0, \sigma^2)$.'
  topic: Simple linear regression
- term: least squares
  aliases: [method of least squares, least squares estimates, least squares line]
  definition: 'Choosing $b_0, b_1$ to minimize $\sum(y_i - b_0 - b_1x_i)^2$; gives $b_1 = S_{xy}/S_{xx}$ and $b_0 = \bar y - b_1\bar x$.'
  topic: Simple linear regression
- term: normal equations
  aliases: [normal equation]
  definition: 'The equations obtained by setting the partial derivatives of the sum of squared errors to zero; for a line they say $\sum e_i = 0$ and $\sum x_ie_i = 0$.'
  topic: Simple linear regression
- term: residual
  aliases: [residuals]
  definition: 'The difference $e_i = y_i - \hat y_i$ between an observed response and its fitted value.'
  topic: Simple linear regression
- term: Sxx
  aliases: [S_xx, Sxy, Syy]
  definition: 'Shorthand sums in regression: $S_{xx} = \sum(x_i - \bar x)^2$, $S_{xy} = \sum(x_i - \bar x)(y_i - \bar y)$, $S_{yy} = \sum(y_i - \bar y)^2$.'
  topic: Simple linear regression
- term: error sum of squares
  aliases: [SSE, residual sum of squares, within-groups sum of squares]
  definition: 'The unexplained variation: $\sum e_i^2$ in regression (on $n - 2$ df) or $\sum\sum(Y_{ij} - \bar Y_{i\cdot})^2$ in ANOVA (on $N - k$ df).'
  topic: Simple linear regression
- term: total sum of squares
  aliases: [SST]
  definition: 'The total variation of the responses about their overall mean, $\sum(y - \bar y)^2$; it splits into an explained part and SSE.'
  topic: One-way ANOVA
- term: regression sum of squares
  aliases: [SSR, explained sum of squares]
  definition: 'The variation explained by the fitted line, $\text{SSR} = \sum(\hat y_i - \bar y)^2 = b_1^2S_{xx}$; $\text{SST} = \text{SSR} + \text{SSE}$.'
  topic: Simple linear regression
- term: coefficient of determination
  aliases: [r², r-squared, R-squared]
  definition: 'The fraction of variation in $y$ explained by the regression, $r^2 = \text{SSR}/\text{SST} = 1 - \text{SSE}/\text{SST}$; for a line it is the squared correlation.'
  topic: Simple linear regression
- term: confidence interval for the mean response
  aliases: [mean response interval, confidence interval for a mean response]
  definition: 'An interval for $\beta_0 + \beta_1x_0$: $\hat y_0 \pm t_{\alpha/2,n-2}\,s\sqrt{1/n + (x_0 - \bar x)^2/S_{xx}}$.'
  topic: Simple linear regression
- term: prediction interval
  aliases: [prediction intervals, PI]
  definition: 'An interval for a single new response at $x_0$: $\hat y_0 \pm t_{\alpha/2,n-2}\,s\sqrt{1 + 1/n + (x_0 - \bar x)^2/S_{xx}}$; wider than the mean-response interval because it includes the new error.'
  topic: Simple linear regression
- term: Gauss–Markov theorem
  aliases: [Gauss-Markov theorem, BLUE]
  definition: 'In a linear model with uncorrelated, equal-variance errors, the least squares estimators have the smallest variance among all linear unbiased estimators (they are BLUE: best linear unbiased estimators).'
  topic: Simple linear regression
- term: analysis of variance
  aliases: [ANOVA, one-way ANOVA, one-way analysis of variance]
  definition: 'A method that tests equality of several means by comparing variation between group means with variation within groups, using $F = \text{MSTr}/\text{MSE}$.'
  topic: One-way ANOVA
- term: treatment sum of squares
  aliases: [SSTr, between-groups sum of squares, SSG]
  definition: 'The between-group variation $\text{SSTr} = \sum n_i(\bar Y_{i\cdot} - \bar Y_{\cdot\cdot})^2$, on $k - 1$ df.'
  topic: One-way ANOVA
- term: mean square
  aliases: [mean squares, MSTr]
  definition: 'A sum of squares divided by its degrees of freedom, such as $\text{MSTr} = \text{SSTr}/(k-1)$ and the error mean square $\text{SSE}/(N-k)$, which estimates $\sigma^2$.'
  topic: One-way ANOVA
- term: ANOVA table
  aliases: [analysis of variance table]
  definition: 'A table listing, for each source of variation (treatments, error, total), its df, sum of squares, mean square, and the $F$ statistic with its p-value.'
  topic: One-way ANOVA
- term: familywise error rate
  aliases: [FWER, family-wise error rate, experimentwise error rate]
  definition: 'The probability of making at least one Type I error among a whole family of tests or comparisons.'
  topic: One-way ANOVA
- term: Bonferroni correction
  aliases: [Bonferroni method, Bonferroni adjustment]
  definition: 'Running each of $m$ comparisons at level $\alpha/m$; by the union bound the familywise error rate is at most $\alpha$.'
  topic: One-way ANOVA
- term: Tukey's method
  aliases: [Tukey's HSD, Tukey HSD, honestly significant difference]
  definition: 'A multiple comparison procedure for all pairwise differences of means, based on the distribution of the largest standardized difference; it controls the familywise error rate exactly for equal group sizes.'
  topic: One-way ANOVA
- term: multiple comparisons
  aliases: [multiple comparison procedure, post hoc comparisons]
  definition: 'Follow-up comparisons among group means after ANOVA, done with a method (Bonferroni, Tukey) that controls the familywise error rate.'
  topic: One-way ANOVA
- term: nonparametric test
  aliases: [nonparametric tests, distribution-free test, nonparametric methods]
  definition: 'A test whose null distribution does not depend on the population''s distribution (beyond continuity or symmetry), typically because it uses only signs or ranks.'
  topic: Nonparametric tests
- term: sign test
  aliases: [sign tests]
  definition: 'A test of a median (or median difference) using the number of positive observations, which is $\text{Bin}(n, 1/2)$ under $H_0$; zeros are dropped.'
  topic: Nonparametric tests
- term: Wilcoxon signed-rank test
  aliases: [signed-rank test, Wilcoxon signed rank test]
  definition: 'A one-sample or paired test that ranks $\lvert D_i\rvert$ and sums the ranks of positive differences, $W^+$; under $H_0$ (symmetry about 0) $E(W^+) = n(n+1)/4$ and $\operatorname{Var}(W^+) = n(n+1)(2n+1)/24$.'
  topic: Nonparametric tests
- term: Wilcoxon rank-sum test
  aliases: [rank-sum test, Wilcoxon rank sum test]
  definition: 'A two-sample test using $W$, the sum of the first sample''s ranks in the combined sample; under $H_0$ $E(W) = m(N+1)/2$ and $\operatorname{Var}(W) = mn(N+1)/12$.'
  topic: Nonparametric tests
- term: Mann–Whitney U
  aliases: [Mann-Whitney U, Mann–Whitney test, Mann-Whitney test, U statistic]
  definition: 'The statistic $U = W - m(m+1)/2$, the number of pairs with $X_i > Y_j$; equivalent to the Wilcoxon rank-sum test, and $U/(mn)$ estimates $P(X > Y)$.'
  topic: Nonparametric tests
- term: Kruskal–Wallis test
  aliases: [Kruskal-Wallis test]
  definition: 'The rank-based alternative to one-way ANOVA: rank all observations together and compare group average ranks; approximately $\chi^2_{k-1}$ under $H_0$.'
  topic: Nonparametric tests
- term: permutation test
  aliases: [permutation tests, randomization test]
  definition: 'A test that computes a statistic for every relabeling of the data (or a random sample of relabelings) that is equally likely under $H_0$, and reports the fraction at least as extreme as the observed value.'
  topic: Nonparametric tests
- term: asymptotic relative efficiency
  aliases: [ARE, Pitman efficiency]
  definition: 'The limiting ratio of sample sizes two tests need for equal power; Wilcoxon versus $t$ is $3/\pi \approx 0.955$ for normal data, and the sign test versus $t$ is $2/\pi \approx 0.64$.'
  topic: Nonparametric tests
