# Glossary, part B — joint distributions, limit theorems, estimation (lessons 15–27)
# (chi-square distribution, degrees of freedom, continuity correction and beta distribution are in glossary-a.yaml)
# ---- Joint distributions
- term: joint distribution
  aliases: [joint distributions]
  definition: 'The probability distribution of two or more random variables considered together, describing the probabilities of events that involve all of them at once.'
  topic: Joint distributions
- term: joint probability mass function
  aliases: [joint pmf, joint pmfs]
  definition: 'For discrete $X$ and $Y$, the function $p(x, y) = P(X = x,\ Y = y)$; it is nonnegative and sums to 1 over all pairs.'
  topic: Joint distributions
- term: joint probability density function
  aliases: [joint pdf, joint density, joint densities]
  definition: 'A function $f(x, y) \ge 0$ with total integral 1 such that $P((X, Y) \in A) = \iint_A f\,dA$ for regions $A$ of the plane.'
  topic: Joint distributions
- term: joint cumulative distribution function
  aliases: [joint cdf]
  definition: 'The function $F(x, y) = P(X \le x,\ Y \le y)$; for continuous pairs $f = \partial^2F/\partial x\,\partial y$.'
  topic: Joint distributions
- term: marginal distribution
  aliases: [marginal distributions, marginal pmf, marginal density, marginal pdf, marginal]
  definition: 'The distribution of one variable taken from a joint distribution by summing or integrating out the others, e.g. $f_X(x) = \int f(x, y)\,dy$.'
  topic: Joint distributions
- term: support
  aliases: [support of a distribution]
  definition: 'The set of values (or points of the plane) where a pmf or density is positive. Limits of integration come from intersecting the support with the event.'
  topic: Joint distributions
- term: uniformly distributed on a region
  aliases: [uniform on a region, uniform distribution on a region]
  definition: 'A pair $(X, Y)$ whose joint density is the constant $1/\text{area}(R)$ on a region $R$; probabilities are then ratios of areas.'
  topic: Joint distributions
# ---- Conditional distributions and independence
- term: conditional probability mass function
  aliases: [conditional pmf]
  definition: 'For discrete variables, $p_{Y \mid X}(y \mid x) = p(x, y)/p_X(x)$: the distribution of $Y$ once $X = x$ is known.'
  topic: Conditional distributions
- term: conditional probability density function
  aliases: [conditional pdf, conditional density, conditional densities]
  definition: 'For continuous variables, $f_{Y \mid X}(y \mid x) = f(x, y)/f_X(x)$ where $f_X(x) > 0$; a density in $y$ for each fixed $x$.'
  topic: Conditional distributions
- term: hierarchical model
  aliases: [hierarchical models]
  definition: 'A joint model built in stages: a distribution for $X$, then a conditional distribution for $Y$ given $X$, combined by $f(x, y) = f_X(x)f_{Y \mid X}(y \mid x)$.'
  topic: Conditional distributions
- term: independent random variables
  aliases: [independent variables, independence of random variables]
  definition: 'Random variables whose joint pmf or density equals the product of their marginals for all values; then conditional distributions equal marginal ones.'
  topic: Independence of random variables
- term: factorization criterion
  definition: 'If a joint density can be written $g(x)h(y)$ for all $(x, y)$, with the support a rectangle (product set), then $X$ and $Y$ are independent.'
  topic: Independence of random variables
- term: independent and identically distributed
  aliases: [iid, i.i.d.]
  definition: 'Describes random variables that are mutually independent and all have the same distribution; the standard model for a random sample.'
  topic: Independence of random variables
- term: random sample
  aliases: [random samples]
  definition: 'Observations $X_1, \dots, X_n$ modeled as iid from a population distribution, so their joint density is $\prod f(x_i)$.'
  topic: Independence of random variables
# ---- Covariance and correlation
- term: covariance
  aliases: [Cov]
  definition: '$\operatorname{Cov}(X, Y) = E[(X - \mu_X)(Y - \mu_Y)] = E[XY] - E[X]E[Y]$; positive when large values of one tend to go with large values of the other.'
  topic: Covariance and correlation
- term: correlation coefficient
  aliases: [correlation, Corr, rho]
  definition: '$\rho = \operatorname{Cov}(X, Y)/(\sigma_X\sigma_Y)$, a unit-free measure of linear association with $-1 \le \rho \le 1$; $|\rho| = 1$ exactly when $Y$ is a linear function of $X$.'
  topic: Covariance and correlation
- term: uncorrelated
  definition: 'Having covariance 0. Independent variables are uncorrelated, but uncorrelated variables can be dependent (e.g. $Y = X^2$ with $X$ symmetric about 0).'
  topic: Covariance and correlation
# ---- Sums
- term: convolution
  aliases: [convolutions]
  definition: 'The distribution of a sum of independent variables: $P(Z = z) = \sum_k p_X(k)p_Y(z - k)$ or $f_Z(z) = \int f_X(x)f_Y(z - x)\,dx$.'
  topic: Sums of random variables
- term: MGF method
  definition: 'Finding the distribution of a sum of independent variables by multiplying their moment generating functions and recognizing the product.'
  topic: Sums of random variables
# ---- Conditional expectation
- term: conditional expectation
  aliases: [conditional mean, conditional expectations]
  definition: '$E[Y \mid X = x]$, the mean of the conditional distribution of $Y$ given $X = x$; $E[Y \mid X]$ is the random variable obtained by plugging in $X$.'
  topic: Conditional expectation
- term: regression function
  definition: 'The function $x \mapsto E[Y \mid X = x]$; it is the best predictor of $Y$ from $X$ in mean squared error.'
  topic: Conditional expectation
- term: conditional variance
  definition: '$\operatorname{Var}(Y \mid X = x) = E[Y^2 \mid X = x] - (E[Y \mid X = x])^2$, the variance of the conditional distribution.'
  topic: Conditional expectation
- term: law of total expectation
  aliases: [tower property, law of iterated expectations]
  definition: '$E[Y] = E\big[E[Y \mid X]\big]$: average the conditional means, weighted by how likely each condition is.'
  topic: Conditional expectation
- term: law of total variance
  aliases: [variance decomposition]
  definition: '$\operatorname{Var}(Y) = E[\operatorname{Var}(Y \mid X)] + \operatorname{Var}(E[Y \mid X])$: average within-group variance plus variance between group means.'
  topic: Conditional expectation
- term: random sum
  aliases: [compound sum]
  definition: 'A total $T = X_1 + \cdots + X_N$ with a random number of terms $N$; if $N$ is independent of the iid $X_i$, $E[T] = \mu E[N]$ and $\operatorname{Var}(T) = \sigma^2E[N] + \mu^2\operatorname{Var}(N)$.'
  topic: Conditional expectation
- term: mixture distribution
  aliases: [mixture]
  definition: 'The distribution of a value drawn by first choosing a group at random and then drawing from that group''s distribution; its variance comes from the law of total variance.'
  topic: Conditional expectation
# ---- Bivariate normal and order statistics
- term: bivariate normal distribution
  aliases: [bivariate normal, jointly normal]
  definition: 'A joint distribution of $(X, Y)$ with normal marginals, normal conditionals and a linear regression function, determined by $\mu_X, \mu_Y, \sigma_X, \sigma_Y$ and $\rho$.'
  topic: Bivariate normal
- term: regression line
  aliases: [population regression line]
  definition: 'For a bivariate normal pair, the line $E[Y \mid X = x] = \mu_Y + \rho\frac{\sigma_Y}{\sigma_X}(x - \mu_X)$.'
  topic: Bivariate normal
- term: regression to the mean
  definition: 'When $|\rho| < 1$, a value $k$ SDs from average in $X$ predicts a value only $\rho k$ SDs from average in $Y$, closer to the mean.'
  topic: Bivariate normal
- term: order statistics
  aliases: [order statistic]
  definition: 'The sample values sorted into increasing order, $X_{(1)} \le \cdots \le X_{(n)}$; $X_{(1)}$ is the minimum and $X_{(n)}$ the maximum.'
  topic: Order statistics
# ---- Limit theorems
- term: Markov's inequality
  aliases: [Markov inequality]
  definition: 'For $X \ge 0$ and $a > 0$, $P(X \ge a) \le E[X]/a$.'
  topic: Probability inequalities
- term: Chebyshev's inequality
  aliases: [Chebyshev inequality]
  definition: 'For $X$ with mean $\mu$ and finite variance $\sigma^2$, $P(|X - \mu| \ge k\sigma) \le 1/k^2$ for every $k > 0$.'
  topic: Probability inequalities
- term: convergence in probability
  aliases: [converges in probability, converge in probability]
  definition: '$Y_n$ converges in probability to $c$ if $P(|Y_n - c| \ge \varepsilon) \to 0$ for every $\varepsilon > 0$; written $Y_n \xrightarrow{P} c$.'
  topic: Law of large numbers
- term: weak law of large numbers
  aliases: [WLLN, law of large numbers, LLN]
  definition: 'For iid variables with mean $\mu$ (and finite variance in the simple proof), $\bar X_n$ converges in probability to $\mu$.'
  topic: Law of large numbers
- term: strong law of large numbers
  aliases: [SLLN]
  definition: 'For iid variables with finite mean $\mu$, $\bar X_n \to \mu$ with probability 1, a stronger statement than the weak law.'
  topic: Law of large numbers
- term: Monte Carlo integration
  aliases: [Monte Carlo]
  definition: 'Estimating $\int_0^1 g(u)\,du = E[g(U)]$ by averaging $g$ at many random uniform points; it works by the law of large numbers.'
  topic: Law of large numbers
- term: Central Limit Theorem
  aliases: [CLT, central limit theorem]
  definition: 'For iid variables with mean $\mu$ and finite variance $\sigma^2$, $(\bar X_n - \mu)/(\sigma/\sqrt n)$ converges in distribution to $N(0, 1)$.'
  topic: Central Limit Theorem
- term: convergence in distribution
  aliases: [converges in distribution, converge in distribution]
  definition: '$Y_n$ converges in distribution to $Y$ if the cdfs satisfy $F_n(y) \to F(y)$ at every continuity point of $F$.'
  topic: Central Limit Theorem
# ---- Sampling distributions
- term: statistic
  aliases: [statistics]
  definition: 'A quantity computed from the sample alone (no unknown parameters), such as $\bar X$ or $S^2$; it is a random variable.'
  topic: Sampling distributions
- term: sampling distribution
  aliases: [sampling distributions]
  definition: 'The probability distribution of a statistic over repeated random samples of the same size.'
  topic: Sampling distributions
- term: sample variance
  definition: '$S^2 = \frac{1}{n-1}\sum(X_i - \bar X)^2$, an unbiased estimator of $\sigma^2$.'
  topic: Sampling distributions
- term: t distribution
  aliases: [Student's t distribution, Student t distribution, t-distribution]
  definition: 'The distribution of $Z/\sqrt{V/\nu}$ with $Z \sim N(0, 1)$ and independent $V \sim \chi^2_\nu$; symmetric with heavier tails than the normal. For a normal sample, $(\bar X - \mu)/(S/\sqrt n) \sim t_{n-1}$.'
  topic: Sampling distributions
- term: F distribution
  aliases: [F-distribution]
  definition: 'The distribution of $(U/\nu_1)/(V/\nu_2)$ for independent chi-squares $U, V$; used for ratios of sample variances.'
  topic: Sampling distributions
- term: parameter
  aliases: [parameters]
  definition: 'A fixed numerical characteristic of a population or model, such as $\mu$, $\sigma^2$, $p$ or $\lambda$, usually unknown and estimated from data.'
  topic: Sampling distributions
# ---- Estimators
- term: point estimator
  aliases: [estimator, estimators, point estimators]
  definition: 'A statistic $\hat\theta = h(X_1, \dots, X_n)$ used to guess a parameter $\theta$; as a function of random data it has a sampling distribution.'
  topic: Properties of estimators
- term: estimate
  aliases: [point estimate]
  definition: 'The number an estimator produces from one particular observed sample.'
  topic: Properties of estimators
- term: bias
  definition: '$\operatorname{Bias}(\hat\theta) = E[\hat\theta] - \theta$, the systematic error of an estimator.'
  topic: Properties of estimators
- term: unbiased
  aliases: [unbiased estimator, unbiasedness]
  definition: 'An estimator is unbiased if $E[\hat\theta] = \theta$ for every value of $\theta$.'
  topic: Properties of estimators
- term: standard error
  aliases: [SE, standard errors]
  definition: 'The standard deviation of an estimator''s sampling distribution (or an estimate of it), e.g. $\sigma/\sqrt n$ for $\bar X$.'
  topic: Properties of estimators
- term: mean squared error
  aliases: [MSE]
  definition: '$\operatorname{MSE}(\hat\theta) = E[(\hat\theta - \theta)^2] = \operatorname{Var}(\hat\theta) + \operatorname{Bias}(\hat\theta)^2$.'
  topic: Properties of estimators
- term: consistent
  aliases: [consistent estimator, consistency]
  definition: 'An estimator $\hat\theta_n$ is consistent if it converges in probability to $\theta$; MSE tending to 0 is sufficient.'
  topic: Properties of estimators
- term: relative efficiency
  definition: 'For unbiased estimators, $\operatorname{Var}(\hat\theta_2)/\operatorname{Var}(\hat\theta_1)$: how many times more data $\hat\theta_2$ needs to match $\hat\theta_1$.'
  topic: Properties of estimators
- term: Fisher information
  aliases: [information]
  definition: '$I(\theta) = E[(\partial_\theta \ln f(X; \theta))^2] = -E[\partial_\theta^2 \ln f(X; \theta)]$, the information about $\theta$ in one observation.'
  topic: Properties of estimators
- term: Cramér–Rao lower bound
  aliases: [CRLB, Cramér-Rao lower bound, Cramer-Rao lower bound, Cramér–Rao bound, Cramér-Rao bound]
  definition: 'Under regularity conditions, every unbiased estimator from an iid sample of size $n$ has $\operatorname{Var}(\hat\theta) \ge 1/(nI(\theta))$.'
  topic: Properties of estimators
- term: efficient
  aliases: [efficient estimator]
  definition: 'An unbiased estimator whose variance attains the Cramér–Rao lower bound.'
  topic: Properties of estimators
- term: regularity conditions
  definition: 'Smoothness assumptions needed for the Cramér–Rao bound and MLE asymptotics; chiefly, the support of $f(x; \theta)$ must not depend on $\theta$.'
  topic: Properties of estimators
# ---- Method of moments and maximum likelihood
- term: sample moment
  aliases: [sample moments]
  definition: 'The $k$th sample moment $m_k = \frac1n\sum x_i^k$, the data analogue of $E[X^k]$.'
  topic: Method of moments
- term: method of moments
  aliases: [MoM, method-of-moments]
  definition: 'Estimation by setting population moments $E[X^k]$ equal to sample moments $m_k$, $k = 1, \dots, p$, and solving for the $p$ parameters.'
  topic: Method of moments
- term: likelihood function
  aliases: [likelihood functions]
  definition: '$L(\theta) = \prod_{i=1}^n f(x_i; \theta)$: the joint density or pmf of the observed data, viewed as a function of the parameter.'
  topic: Maximum likelihood
- term: maximum likelihood estimate
  aliases: [MLE, MLEs, maximum likelihood estimator, maximum likelihood]
  definition: 'The parameter value $\hat\theta$ that maximizes the likelihood $L(\theta)$, i.e. makes the observed data most probable.'
  topic: Maximum likelihood
- term: log-likelihood
  aliases: [log likelihood]
  definition: '$\ell(\theta) = \ln L(\theta) = \sum \ln f(x_i; \theta)$; it has the same maximizer as $L$ and is easier to differentiate.'
  topic: Maximum likelihood
- term: invariance property
  aliases: [invariance, invariance of the MLE]
  definition: 'If $\hat\theta$ is the MLE of $\theta$, then $g(\hat\theta)$ is the MLE of $g(\theta)$.'
  topic: Maximum likelihood
- term: delta method
  definition: 'If $\hat\theta \approx N(\theta, v)$ and $g$ is differentiable with $g''(\theta) \ne 0$, then $g(\hat\theta) \approx N(g(\theta), [g''(\theta)]^2 v)$, from a first-order Taylor expansion.'
  topic: Maximum likelihood
- term: sufficient statistic
  aliases: [sufficient statistics, sufficiency]
  definition: 'A statistic $T$ such that the conditional distribution of the sample given $T$ does not depend on $\theta$; once $T$ is known, the rest of the data carries no more information about $\theta$.'
  topic: Maximum likelihood
- term: factorization theorem
  aliases: [Fisher–Neyman factorization theorem, Neyman factorization theorem]
  definition: '$T = u(X_1, \dots, X_n)$ is sufficient for $\theta$ if and only if the joint pmf or pdf factors as $\phi(u(x_1, \dots, x_n); \theta)\,h(x_1, \dots, x_n)$ with $h$ free of $\theta$.'
  topic: Maximum likelihood
# ---- Confidence intervals
- term: pivotal quantity
  aliases: [pivot, pivots, pivotal quantities]
  definition: 'A function of the data and the parameter whose distribution is completely known (free of unknown parameters), used to build confidence intervals.'
  topic: Confidence intervals
- term: confidence interval
  aliases: [confidence intervals, CI]
  definition: 'A random interval $[L, U]$ computed from the data with $P(L \le \theta \le U) = 1 - \alpha$ before sampling; it covers $\theta$ in that fraction of repeated samples.'
  topic: Confidence intervals
- term: confidence level
  definition: 'The long-run proportion $1 - \alpha$ of intervals from a procedure that contain the true parameter.'
  topic: Confidence intervals
- term: margin of error
  aliases: [ME]
  definition: 'The half-width of a symmetric confidence interval, such as $z_{\alpha/2}\sigma/\sqrt n$.'
  topic: Confidence intervals
- term: Wilson interval
  aliases: [Wilson score interval]
  definition: 'A confidence interval for a proportion found by solving $|\hat p - p| \le z\sqrt{p(1-p)/n}$ for $p$; it has better coverage than $\hat p \pm z\sqrt{\hat p(1-\hat p)/n}$ in small samples.'
  topic: Confidence intervals
# ---- Bayesian inference
- term: Bayesian inference
  aliases: [Bayesian statistics, Bayesian]
  definition: 'Inference that describes uncertainty about parameters with probability distributions, updating a prior to a posterior with Bayes'' theorem.'
  topic: Bayesian inference
- term: prior distribution
  aliases: [prior distributions, prior density]
  definition: 'The distribution $\pi(\theta)$ expressing beliefs about a parameter before the data are seen.'
  topic: Bayesian inference
- term: posterior distribution
  aliases: [posterior distributions, posterior density]
  definition: 'The distribution $\pi(\theta \mid x) \propto f(x \mid \theta)\pi(\theta)$ of the parameter after updating the prior with the data.'
  topic: Bayesian inference
- term: conjugate
  aliases: [conjugate prior, conjugate priors, conjugacy]
  definition: 'A prior family is conjugate to a model when the posterior is in the same family, e.g. beta priors for binomial data.'
  topic: Bayesian inference
- term: posterior mean
  definition: 'The mean of the posterior distribution; it minimizes posterior expected squared error and is a weighted average of prior information and data.'
  topic: Bayesian inference
- term: credible interval
  aliases: [credible intervals, Bayesian interval]
  definition: 'An interval with a stated posterior probability, e.g. $P(\theta \in [a, b] \mid \text{data}) = 0.95$.'
  topic: Bayesian inference
- term: precision
  definition: 'The reciprocal of a variance. In the normal–normal model, posterior precision = prior precision + $n/\sigma^2$.'
  topic: Bayesian inference
- term: MAP estimate
  aliases: [MAP, maximum a posteriori, posterior mode]
  definition: 'The maximum a posteriori estimate: the value of $\theta$ that maximizes the posterior density (likelihood × prior).'
  topic: Bayesian inference
