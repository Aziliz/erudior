# Round 2 glossary for module ps-m5 (honors lessons 22h1, 22h2)
- term: concentration inequality
  aliases: [concentration inequalities]
  definition: 'A bound showing that a sum or average of many independent random variables is unlikely to be far from its mean, usually with a probability that decays exponentially in $n$ (for example the Chernoff and Hoeffding bounds).'
  topic: Concentration inequalities
- term: Chernoff bound
  aliases: [Chernoff bounds, Chernoff method]
  definition: '$P(X \ge a) \le \min_{t > 0} e^{-ta}M_X(t)$: Markov''s inequality applied to $e^{tX}$, optimized over $t$. For a normal, $P(X \ge \mu + z\sigma) \le e^{-z^2/2}$.'
  topic: Concentration inequalities
- term: Kullback–Leibler divergence
  aliases: [Kullback-Leibler divergence, KL divergence, relative entropy]
  definition: 'A measure of how distinguishable two distributions are. For coins with success probabilities $a$ and $p$: $D(a\,\|\,p) = a\ln\frac{a}{p} + (1 - a)\ln\frac{1 - a}{1 - p} \ge 0$, the exponent in the Chernoff bound for a binomial.'
  topic: Concentration inequalities
- term: Hoeffding's lemma
  aliases: [Hoeffding lemma]
  definition: 'If $a \le X \le b$, then $E[e^{s(X - E[X])}] \le e^{s^2(b - a)^2/8}$ for every real $s$: a bounded variable''s centered MGF is at most that of a normal with variance $(b - a)^2/4$.'
  topic: Concentration inequalities
- term: Hoeffding's inequality
  aliases: [Hoeffding inequality, Hoeffding bound]
  definition: 'For independent $X_i$ with $a_i \le X_i \le b_i$: $P(S_n - E[S_n] \ge u) \le \exp\big(-2u^2/\sum(b_i - a_i)^2\big)$. For a mean of values in $[0, 1]$: $P(|\bar X - \mu| \ge \varepsilon) \le 2e^{-2n\varepsilon^2}$.'
  topic: Concentration inequalities
- term: Cramér's theorem
  aliases: [Cramer's theorem]
  definition: 'For iid $X_i$ with an MGF finite near 0 and $a > \mu$: $\frac1n\ln P(\bar X_n \ge a) \to -I(a)$, where $I$ is the rate function. It shows the Chernoff exponent is the true exponential rate.'
  topic: Concentration inequalities
- term: rate function
  aliases: [large deviations rate function]
  definition: '$I(a) = \sup_t\,[ta - \ln M_X(t)]$, the exponential rate at which $P(\bar X_n \ge a)$ decays for $a > \mu$ (large deviations).'
  topic: Concentration inequalities
- term: almost sure convergence
  aliases: [almost surely, converges almost surely, convergence almost surely, a.s. convergence]
  definition: '$Y_n \xrightarrow{a.s.} Y$ if $P(\lim_{n\to\infty} Y_n = Y) = 1$: with probability 1 the whole realized sequence converges. It implies convergence in probability.'
  topic: Modes of convergence
- term: convergence in mean square
  aliases: [in mean square, mean-square convergence, converges in mean square]
  definition: '$Y_n \to c$ in mean square if $E[(Y_n - c)^2] \to 0$ (for an estimator: MSE $\to 0$). It implies convergence in probability, by Markov''s inequality.'
  topic: Modes of convergence
- term: Borel–Cantelli lemma
  aliases: [Borel-Cantelli lemma, Borel–Cantelli lemmas, Borel-Cantelli lemmas]
  definition: 'If $\sum P(A_n) < \infty$, then with probability 1 only finitely many $A_n$ occur. Conversely, if the $A_n$ are independent and $\sum P(A_n) = \infty$, then with probability 1 infinitely many occur.'
  topic: Modes of convergence
- term: continuous mapping theorem
  aliases: [continuous mapping]
  definition: 'Continuous functions preserve limits: if $Y_n \xrightarrow{P} c$ and $g$ is continuous at $c$, then $g(Y_n) \xrightarrow{P} g(c)$; if $Y_n \xrightarrow{d} Y$ and $g$ is continuous, then $g(Y_n) \xrightarrow{d} g(Y)$.'
  topic: Modes of convergence
- term: Slutsky's theorem
  aliases: [Slutsky theorem, Slutsky's lemma]
  definition: 'If $X_n \xrightarrow{d} X$ and $Y_n \xrightarrow{P} c$ (a constant), then $X_n + Y_n \xrightarrow{d} X + c$, $X_nY_n \xrightarrow{d} cX$, and $X_n/Y_n \xrightarrow{d} X/c$ when $c \ne 0$.'
  topic: Modes of convergence
