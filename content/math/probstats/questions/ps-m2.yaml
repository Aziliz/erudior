# Module 2 — Discrete random variables
# ---- Lesson 05: random variables, pmf, cdf, expectation, variance
- id: ps-q-0501
  lesson: ps-discrete-rv
  module_quiz: true
  topic: Expectation and variance
  stem: '$X$ takes the values 0, 1, 2, 3 with probabilities 0.1, 0.3, 0.4, 0.2. Find $E(X)$.'
  choices: ['1.5', '1.7', '2.0', '3.7']
  answer: 1
  explanation: |-
    $E(X) = 0(0.1) + 1(0.3) + 2(0.4) + 3(0.2) = 0.3 + 0.8 + 0.6 = 1.7$. The value 1.5 is the
    unweighted average of the possible values, and 3.7 is $E(X^2)$.

- id: ps-q-0502
  lesson: ps-discrete-rv
  topic: Expectation and variance
  stem: 'For $X$ with values 0, 1, 2, 3 and probabilities 0.1, 0.3, 0.4, 0.2 (so $E(X) = 1.7$), find $\operatorname{Var}(X)$.'
  choices: ['3.70', '0.81', '0.90', '2.89']
  answer: 1
  explanation: |-
    $E(X^2) = 0 + 1(0.3) + 4(0.4) + 9(0.2) = 3.7$, so
    $\operatorname{Var}(X) = 3.7 - 1.7^2 = 3.7 - 2.89 = 0.81$. The standard deviation is 0.9;
    3.7 forgets to subtract $\mu^2$.

- id: ps-q-0503
  lesson: ps-discrete-rv
  topic: Random variables and pmfs
  stem: 'For $X$ with values 0, 1, 2, 3 and probabilities 0.1, 0.3, 0.4, 0.2, what is the cdf value $F(2.5)$?'
  choices: ['0.4', '0.6', '1.0', '0.8']
  answer: 3
  explanation: |-
    $F(2.5) = P(X \le 2.5) = P(X \le 2) = 0.1 + 0.3 + 0.4 = 0.8$. A discrete cdf is flat between
    the possible values, so $F(2.5) = F(2)$.

- id: ps-q-0504
  lesson: ps-discrete-rv
  topic: Random variables and pmfs
  stem: '$p(x) = cx^2$ for $x = 1, 2, 3$ (and 0 otherwise) is a pmf. What is $c$?'
  choices: ['$\tfrac{1}{14}$', '$\tfrac{1}{6}$', '$\tfrac{1}{36}$', '$\tfrac{1}{9}$']
  answer: 0
  explanation: |-
    The probabilities must sum to 1: $c(1 + 4 + 9) = 14c = 1$, so $c = \tfrac{1}{14}$. Using
    $1 + 2 + 3 = 6$ forgets to square.

- id: ps-q-0505
  lesson: ps-discrete-rv
  module_quiz: true
  topic: Expectation and variance
  stem: '$X$ is equally likely to be 1, 2, 3 or 4. Find $E(1/X)$.'
  choices: ['$\tfrac{2}{5}$', '$\tfrac{25}{48}$', '$\tfrac{1}{4}$', '$\tfrac{5}{12}$']
  answer: 1
  explanation: |-
    LOTUS: $E(1/X) = \tfrac14\left(1 + \tfrac12 + \tfrac13 + \tfrac14\right) = \tfrac14 \cdot \tfrac{25}{12} = \tfrac{25}{48}$.
    The value $\tfrac25 = 1/E(X)$ assumes $E[g(X)] = g(E(X))$, which fails for nonlinear $g$.

- id: ps-q-0506
  lesson: ps-discrete-rv
  topic: Expectation and variance
  stem: '$E(X) = 4$ and $\operatorname{Var}(X) = 9$. For $Y = 5 - 2X$, find $E(Y)$ and the standard deviation of $Y$.'
  choices: ['$-3$ and 18', '13 and 6', '$-3$ and 6', '$-3$ and 36']
  answer: 2
  explanation: |-
    $E(Y) = 5 - 2(4) = -3$. $\operatorname{Var}(Y) = (-2)^2(9) = 36$, so $\operatorname{SD}(Y) = 6$.
    A standard deviation scales by $|a|$, never negative; 18 doubles the variance instead of the SD.

- id: ps-q-0507
  lesson: ps-discrete-rv
  topic: Expectation and variance
  stem: '$E(X) = 3$ and $E(X^2) = 13$. What is the standard deviation of $X$?'
  choices: ['4', '$\sqrt{13}$', '10', '2']
  answer: 3
  explanation: |-
    $\operatorname{Var}(X) = E(X^2) - [E(X)]^2 = 13 - 9 = 4$, so $\sigma = 2$. The value 4 is the
    variance.

- id: ps-q-0508
  lesson: ps-discrete-rv
  topic: Random variables and pmfs
  stem: 'A cdf is $F(x) = 0$ for $x < 1$, $0.25$ for $1 \le x < 3$, $0.7$ for $3 \le x < 5$, and 1 for $x \ge 5$. Find $P(X = 3)$.'
  choices: ['0.45', '0.70', '0.25', '0.30']
  answer: 0
  explanation: |-
    The probability at a point is the size of the cdf's jump there: $0.7 - 0.25 = 0.45$. The
    value 0.70 is $P(X \le 3)$.

- id: ps-q-0509
  lesson: ps-discrete-rv
  module_quiz: true
  topic: Random variables and pmfs
  stem: 'Each of 8 components fails with probability 0.1, but failures may be related (shared power supply). What is the expected number of failures?'
  choices: ['$1 - 0.9^8$', '0.8, but only if failures are independent', 'It cannot be found without the joint distribution', '0.8, whether or not failures are independent']
  answer: 3
  explanation: |-
    Write the count as a sum of 8 indicators, each with mean $P(\text{fail}) = 0.1$. Expected values
    add whether or not the variables are dependent, so the mean is 0.8. Dependence affects the
    variance and the pmf, not the mean.

- id: ps-q-0510
  lesson: ps-discrete-rv
  topic: Expectation and variance
  stem: 'Which statement holds for every random variable $X$ with a finite variance?'
  choices: ['$E(X^2) = [E(X)]^2$', '$E(X^2) \ge [E(X)]^2$', '$E(X^2) \le [E(X)]^2$', '$E(X^2) = 2E(X)$']
  answer: 1
  explanation: |-
    $E(X^2) - [E(X)]^2 = \operatorname{Var}(X) = E[(X - \mu)^2] \ge 0$, with equality only when $X$
    is constant (with probability 1).

- id: ps-q-0511
  lesson: ps-discrete-rv
  topic: Random variables and pmfs
  stem: '$X$ takes integer values and has cdf $F$. Which expression equals $P(X < 4)$?'
  choices: ['$F(4)$', '$1 - F(4)$', '$F(3)$', '$F(4) - F(3)$']
  answer: 2
  explanation: |-
    For integer values, $X < 4$ means $X \le 3$, so the probability is $F(3)$. $F(4)$ includes the
    value 4, and $F(4) - F(3) = P(X = 4)$.

- id: ps-q-0512
  lesson: ps-discrete-rv
  module_quiz: true
  topic: Expectation and variance
  stem: '$P(X = -1) = 0.3$, $P(X = 0) = 0.2$ and $P(X = 2) = 0.5$. Find $E(X^2)$.'
  choices: ['2.3', '0.49', '0.7', '1.81']
  answer: 0
  explanation: |-
    LOTUS: $E(X^2) = (-1)^2(0.3) + 0^2(0.2) + 2^2(0.5) = 0.3 + 2 = 2.3$. Squaring the mean
    $E(X) = 0.7$ gives 0.49, and 1.81 is the variance $2.3 - 0.49$.

# ---- Lesson 06: Bernoulli, binomial, hypergeometric
- id: ps-q-0601
  lesson: ps-binomial
  module_quiz: true
  topic: Binomial distribution
  stem: '$X \sim \text{Bin}(10, 0.3)$. Find $P(X = 2)$.'
  choices: ['0.0052', '0.2335', '0.3828', '0.1211']
  answer: 1
  explanation: |-
    $\binom{10}{2}(0.3)^2(0.7)^8 = 45 \times 0.09 \times 0.05765 \approx 0.2335$. Leaving out
    $\binom{10}{2}$ gives 0.0052 (one particular sequence); 0.3828 is $P(X \le 2)$.

- id: ps-q-0602
  lesson: ps-binomial
  topic: Binomial distribution
  stem: '$X \sim \text{Bin}(8, 0.1)$. Find $P(X \ge 2)$.'
  choices: ['0.0381', '0.1488', '0.5695', '0.1869']
  answer: 3
  explanation: |-
    $P(X \ge 2) = 1 - P(0) - P(1) = 1 - 0.9^8 - 8(0.1)(0.9)^7 = 1 - 0.4305 - 0.3826 \approx 0.1869$.
    The value 0.0381 is $1 - P(X \le 2)$, which is $P(X \ge 3)$.

- id: ps-q-0603
  lesson: ps-binomial
  topic: Binomial distribution
  stem: 'Find the mean and standard deviation of $X \sim \text{Bin}(50, 0.2)$.'
  choices: ['10 and 8', '10 and 2.83', '10 and 3.16', '2.83 and 10']
  answer: 1
  explanation: |-
    $\mu = np = 10$ and $\sigma = \sqrt{np(1-p)} = \sqrt{8} \approx 2.83$. The value 8 is the
    variance, and $\sqrt{10} \approx 3.16$ omits the factor $1 - p$.

- id: ps-q-0604
  lesson: ps-binomial
  topic: Binomial distribution
  stem: 'For which success probability is the variance of a Bernoulli variable largest, and what is that variance?'
  choices: ['$p = 0.5$, variance 0.25', '$p = 1$, variance 1', '$p = 0.5$, variance 0.5', '$p = 0$, variance 0']
  answer: 0
  explanation: |-
    $p(1 - p)$ is a downward parabola with its vertex at $p = 0.5$, where it equals 0.25. At $p = 0$ or
    1 the outcome is certain and the variance is 0, the smallest possible.

- id: ps-q-0605
  lesson: ps-binomial
  module_quiz: true
  topic: Hypergeometric distribution
  stem: 'A box of 20 relays contains 5 faulty ones. Four are chosen at random without replacement. What is the probability that exactly one is faulty?'
  choices: ['0.4219', '0.2817', '0.4696', '0.7183']
  answer: 2
  explanation: |-
    Hypergeometric: $\dfrac{\binom{5}{1}\binom{15}{3}}{\binom{20}{4}} = \dfrac{5 \times 455}{4845} \approx 0.4696$.
    The binomial value $4(0.25)(0.75)^3 \approx 0.4219$ wrongly treats the draws as independent;
    0.2817 is the probability of none faulty.

- id: ps-q-0606
  lesson: ps-binomial
  topic: Hypergeometric distribution
  stem: 'A sample of 8 is drawn without replacement from 40 items, 10 of which are defective. What is the variance of the number of defectives in the sample?'
  choices: ['1.500', '1.231', '1.200', '2.000']
  answer: 1
  explanation: |-
    $\operatorname{Var} = n\frac{K}{N}\left(1 - \frac{K}{N}\right)\frac{N - n}{N - 1} = 8(0.25)(0.75)\frac{32}{39} \approx 1.231$.
    Without the finite population correction you get the binomial value 1.5; 2.0 is the mean.

- id: ps-q-0607
  lesson: ps-binomial
  topic: Hypergeometric distribution
  stem: 'When does $\text{Bin}(n, K/N)$ approximate the hypergeometric distribution well?'
  choices: ['When the sample size $n$ is small compared with the population size $N$', 'When $K$ is close to $N/2$', 'When $n$ is close to $N$', 'Only when $K/N$ is small']
  answer: 0
  explanation: |-
    If $n \ll N$, removing a few items barely changes the proportion of successes, so the draws are
    nearly independent and the correction factor $(N - n)/(N - 1)$ is close to 1. When $n$ is close to
    $N$, the two distributions differ the most.

- id: ps-q-0608
  lesson: ps-binomial
  topic: Binomial distribution
  stem: 'Which random variable has a binomial distribution?'
  choices: ['The number of hearts in 5 cards dealt from one deck', 'The number of rolls of a die until the first six', 'The number of defective items among 10 taken from a line where each item is independently defective with probability 0.02', 'The number of aces among 13 cards dealt from one deck']
  answer: 2
  explanation: |-
    The line items give a fixed number of independent trials with the same success probability.
    Cards dealt from one deck are drawn without replacement (hypergeometric), and rolling until a
    six has no fixed number of trials (geometric).

- id: ps-q-0609
  lesson: ps-binomial
  topic: Binomial distribution
  stem: 'What is the most likely value (the mode) of $X \sim \text{Bin}(15, 0.4)$?'
  choices: ['7', '5', '6.4', '6']
  answer: 3
  explanation: |-
    The mode is $\lfloor (n + 1)p \rfloor = \lfloor 6.4 \rfloor = 6$. The mean is $np = 6$ here as well,
    and 6.4 is not a possible value of a count.

- id: ps-q-0610
  lesson: ps-binomial
  module_quiz: true
  topic: Binomial distribution
  stem: '$X \sim \text{Bin}(20, 0.5)$. Find $E(X^2)$.'
  choices: ['100', '105', '5', '110']
  answer: 1
  explanation: |-
    $E(X^2) = \operatorname{Var}(X) + [E(X)]^2 = 20(0.5)(0.5) + 10^2 = 5 + 100 = 105$. The square of the
    mean, 100, leaves out the variance.

- id: ps-q-0611
  lesson: ps-binomial
  topic: Hypergeometric distribution
  stem: 'Six cables are chosen without replacement from 30, of which 12 are red. What is the expected number of red cables chosen?'
  choices: ['2.4', '2.0', '0.4', '2.48']
  answer: 0
  explanation: |-
    Each draw on its own is red with probability $12/30 = 0.4$, so by adding indicators the mean is
    $6 \times 0.4 = 2.4$, the same as for sampling with replacement. Dependence changes the
    variance but not the mean.

- id: ps-q-0612
  lesson: ps-binomial
  topic: Hypergeometric distribution
  stem: 'A batch of 10 has 2 defective items. Three are chosen at random without replacement. What is the probability that at least one is defective?'
  choices: ['$\tfrac{7}{15}$', '0.488', '$\tfrac{3}{5}$', '$\tfrac{8}{15}$']
  answer: 3
  explanation: |-
    $P(\text{none}) = \binom{8}{3}/\binom{10}{3} = 56/120 = \tfrac{7}{15}$, so
    $P(\text{at least one}) = \tfrac{8}{15}$. The value $1 - 0.8^3 = 0.488$ treats the draws as
    independent.

# ---- Lesson 07: geometric and negative binomial
- id: ps-q-0701
  lesson: ps-geometric
  module_quiz: true
  topic: Geometric distribution
  stem: 'Independent trials each succeed with probability 0.2. What is the probability that the first success occurs on trial 3?'
  choices: ['0.1024', '0.488', '0.128', '0.008']
  answer: 2
  explanation: |-
    Two failures then a success: $0.8^2 \times 0.2 = 0.128$. The value 0.1024 is
    $0.8^3 \times 0.2$, first success on trial 4, and 0.488 is $P(X \le 3) = 1 - 0.8^3$.

- id: ps-q-0702
  lesson: ps-geometric
  topic: Geometric distribution
  stem: '$X$ is geometric (trials until first success) with $p = 0.1$. Find $P(X > 5)$.'
  choices: ['0.6561', '0.5905', '0.4095', '0.5000']
  answer: 1
  explanation: |-
    More than 5 trials are needed exactly when the first 5 fail: $0.9^5 \approx 0.5905$. The value
    $0.9^4$ is $P(X > 4)$.

- id: ps-q-0703
  lesson: ps-geometric
  topic: Geometric distribution
  stem: 'Find the mean and variance of the number of trials until the first success when $p = 0.25$.'
  choices: ['4 and 3', '3 and 12', '4 and 16', '4 and 12']
  answer: 3
  explanation: |-
    $E(X) = 1/p = 4$ and $\operatorname{Var}(X) = q/p^2 = 0.75/0.0625 = 12$. Counting failures
    instead of trials gives mean 3 (with the same variance).

- id: ps-q-0704
  lesson: ps-geometric
  module_quiz: true
  topic: Geometric distribution
  stem: 'Independent attempts each succeed with probability 0.3. The first 6 attempts have failed. What is the probability of a success within the next 2 attempts?'
  choices: ['0.51', '0.30', '0.94', '0.21']
  answer: 0
  explanation: |-
    By memorylessness the past failures do not matter: $P(\text{success within 2}) = 1 - 0.7^2 = 0.51$.
    The value 0.94 is $1 - 0.7^8$, which wrongly counts the 6 failed attempts as still to come.

- id: ps-q-0705
  lesson: ps-geometric
  topic: Negative binomial distribution
  stem: 'Trials succeed independently with probability 0.4. What is the probability that the third success occurs on trial 6?'
  choices: ['0.2765', '0.0138', '0.1382', '0.2074']
  answer: 2
  explanation: |-
    Exactly 2 successes in the first 5 trials, then a success: $\binom{5}{2}(0.4)^3(0.6)^3 = 10 \times 0.064 \times 0.216 \approx 0.1382$.
    The value 0.2765 uses $\binom{6}{3}$, which is the binomial chance of 3 successes in 6 trials in any positions.

- id: ps-q-0706
  lesson: ps-geometric
  topic: Negative binomial distribution
  stem: 'Find the mean and variance of the number of trials needed to get 5 successes when $p = 0.25$.'
  choices: ['20 and 80', '15 and 60', '20 and 60', '20 and 3.75']
  answer: 2
  explanation: |-
    Negative binomial: $E(X) = r/p = 20$ and $\operatorname{Var}(X) = rq/p^2 = 5(0.75)/0.0625 = 60$. It is a
    sum of 5 independent geometrics, each with mean 4 and variance 12.

- id: ps-q-0707
  lesson: ps-geometric
  module_quiz: true
  topic: Negative binomial distribution
  stem: 'With success probability 0.2 per trial, what is the probability that more than 10 trials are needed to get 2 successes?'
  choices: ['0.3758', '0.6778', '0.2684', '0.1074']
  answer: 0
  explanation: |-
    More than 10 trials are needed exactly when the first 10 trials have at most 1 success:
    $P(\text{Bin}(10, 0.2) \le 1) = 0.8^{10} + 10(0.2)(0.8)^9 \approx 0.1074 + 0.2684 = 0.3758$.
    The value 0.6778 includes 2 successes, which would already be enough.

- id: ps-q-0708
  lesson: ps-geometric
  topic: Geometric distribution
  stem: 'A player has lost 10 independent plays in a row at a game with win probability 0.1 per play. Which statement is correct?'
  choices: ['A win is now overdue, so its probability is above 0.1', 'The probability of winning the next play is still 0.1', 'The probability of winning the next play is $1 - 0.9^{11}$', 'The player is now less likely to win, since the game seems to be against them']
  answer: 1
  explanation: |-
    Plays are independent, so the geometric waiting time is memoryless: the chance of a win on the
    next play is 0.1 no matter how many losses came before. Believing a win is due is the
    gambler's fallacy.

- id: ps-q-0709
  lesson: ps-geometric
  topic: Geometric distribution
  stem: '$X$ takes values in $\{1, 2, 3\}$, with $P(X > 1) = 0.6$ and $P(X > 2) = 0.2$. Use the tail-sum formula to find $E(X)$.'
  choices: ['0.8', '2.0', '1.6', '1.8']
  answer: 3
  explanation: |-
    $E(X) = \sum_{k \ge 0} P(X > k) = 1 + 0.6 + 0.2 = 1.8$. Check: $p(1) = 0.4$, $p(2) = 0.4$, $p(3) = 0.2$
    give $0.4 + 0.8 + 0.6 = 1.8$. Omitting the $k = 0$ term, $P(X > 0) = 1$, gives 0.8.

- id: ps-q-0710
  lesson: ps-geometric
  topic: Geometric distribution
  stem: 'Each box contains one of 4 equally likely toy types, independently. What is the expected number of boxes needed to collect all 4 types?'
  choices: ['8.33', '4', '16', '6.25']
  answer: 0
  explanation: |-
    After $j$ types are collected, the wait for a new one is geometric with mean $4/(4 - j)$:
    $1 + \tfrac43 + 2 + 4 = \tfrac{25}{3} \approx 8.33$.

- id: ps-q-0711
  lesson: ps-geometric
  topic: Geometric distribution
  stem: '$Y$ counts the failures before the first success in independent trials with $p = 0.2$. Find $E(Y)$.'
  choices: ['5', '4', '20', '0.8']
  answer: 1
  explanation: |-
    $Y = X - 1$, where $X$ counts trials with mean $1/p = 5$. So $E(Y) = 4$, which is also $q/p = 0.8/0.2$.

- id: ps-q-0712
  lesson: ps-geometric
  module_quiz: true
  topic: Negative binomial distribution
  stem: 'Which random variable has a negative binomial distribution?'
  choices: ['The number of defectives among 20 independently produced items', 'The number of calls to a help desk in an hour', 'The number of items inspected until the third defective is found, when items are independently defective with the same probability', 'The number of defectives in a sample drawn without replacement']
  answer: 2
  explanation: |-
    Counting trials until a fixed number of successes ($r = 3$) with independent, identical trials
    is the negative binomial setting. A fixed number of trials gives a binomial count; calls per hour
    are Poisson; sampling without replacement is hypergeometric.

# ---- Lesson 08: Poisson
- id: ps-q-0801
  lesson: ps-poisson
  module_quiz: true
  topic: Poisson distribution
  stem: '$X \sim \text{Poisson}(2.5)$. Find $P(X = 3)$.'
  choices: ['0.2565', '0.7576', '0.2138', '0.2424']
  answer: 2
  explanation: |-
    $P(X = 3) = e^{-2.5}\dfrac{2.5^3}{3!} = 0.08208 \times 2.604 \approx 0.2138$. The value 0.7576 is
    $P(X \le 3)$ and 0.2565 is $P(X = 2)$.

- id: ps-q-0802
  lesson: ps-poisson
  topic: Poisson distribution
  stem: '$X \sim \text{Poisson}(4)$. Find $P(X \ge 2)$.'
  choices: ['0.9084', '0.7619', '0.0916', '0.9817']
  answer: 0
  explanation: |-
    $P(X \ge 2) = 1 - P(0) - P(1) = 1 - e^{-4}(1 + 4) \approx 1 - 0.0916 = 0.9084$. The value 0.7619
    is $1 - P(X \le 2)$, and 0.9817 is $1 - P(X = 0)$.

- id: ps-q-0803
  lesson: ps-poisson
  topic: Poisson process
  stem: 'Messages arrive as a Poisson process at 6 per hour. What is the probability that no message arrives in a 20-minute period?'
  choices: ['0.0025', '0.7165', '0.8647', '0.1353']
  answer: 3
  explanation: |-
    Rescale the rate: 20 minutes is $\tfrac13$ hour, so the count is Poisson with mean $6 \times \tfrac13 = 2$, and
    $P(0) = e^{-2} \approx 0.1353$. Using the hourly mean gives $e^{-6} \approx 0.0025$.

- id: ps-q-0804
  lesson: ps-poisson
  module_quiz: true
  topic: Poisson distribution
  stem: 'What are the mean and standard deviation of a Poisson(9) random variable?'
  choices: ['Mean 9, SD 9', 'Mean 9, SD 3', 'Mean 9, SD 81', 'Mean 3, SD 3']
  answer: 1
  explanation: |-
    For a Poisson distribution the mean and the variance both equal $\lambda = 9$, so the standard
    deviation is $\sqrt{9} = 3$.

- id: ps-q-0805
  lesson: ps-poisson
  topic: Poisson distribution
  stem: '$X \sim \text{Bin}(400, 0.005)$. Use the Poisson approximation to estimate $P(X \le 1)$.'
  choices: ['0.135', '0.271', '0.406', '0.594']
  answer: 2
  explanation: |-
    $\lambda = np = 2$, so $P(X \le 1) \approx e^{-2}(1 + 2) = 3e^{-2} \approx 0.406$ (the exact binomial
    value is 0.405). The value 0.135 is $P(X = 0)$ alone and 0.271 is $P(X = 1)$ alone.

- id: ps-q-0806
  lesson: ps-poisson
  topic: Poisson distribution
  stem: 'For which binomial distribution is the Poisson approximation most appropriate?'
  choices: ['$n = 10$, $p = 0.3$', '$n = 50$, $p = 0.5$', '$n = 15$, $p = 0.2$', '$n = 200$, $p = 0.01$']
  answer: 3
  explanation: |-
    The approximation comes from the limit $n \to \infty$ with $np$ fixed, so it needs large $n$ and
    small $p$. Only $n = 200$, $p = 0.01$ (mean 2) fits; the others have $p$ too large.

- id: ps-q-0807
  lesson: ps-poisson
  topic: Poisson distribution
  stem: 'For $X \sim \text{Poisson}(5)$, which values of $X$ are the most likely?'
  choices: ['4 and 5, equally', 'Only 5', '5 and 6, equally', 'Only 4']
  answer: 0
  explanation: |-
    $p(k)/p(k-1) = \lambda/k$, so $p(5)/p(4) = 5/5 = 1$: the pmf is level from 4 to 5, increasing before
    and decreasing after. Both have probability about 0.1755.

- id: ps-q-0808
  lesson: ps-poisson
  topic: Poisson distribution
  stem: 'Daily counts of signal failures over a year have mean 3.1 and variance 9.8. What does this suggest about a Poisson model?'
  choices: ['It fits well, since the mean is small', 'It fits well, since counts are whole numbers', 'It fits poorly; failures seem to cluster, giving more variability than a Poisson allows', 'It fits poorly, because a Poisson variance must be less than its mean']
  answer: 2
  explanation: |-
    A Poisson distribution has variance equal to its mean. A variance three times the mean
    (overdispersion) indicates clustering or a varying rate, so a Poisson model would understate
    the day-to-day variability.

- id: ps-q-0809
  lesson: ps-poisson
  module_quiz: true
  topic: Poisson process
  stem: 'Flaws occur along a cable as a Poisson process at 0.4 per 100 m. What is the probability of at least one flaw in 300 m?'
  choices: ['0.3012', '0.6988', '0.3297', '0.8800']
  answer: 1
  explanation: |-
    The mean count in 300 m is $0.4 \times 3 = 1.2$, so $P(\text{at least one}) = 1 - e^{-1.2} \approx 0.6988$.
    The value 0.3297 uses the mean for 100 m only.

- id: ps-q-0810
  lesson: ps-poisson
  topic: Poisson process
  stem: '$X \sim \text{Poisson}(2)$ and $Y \sim \text{Poisson}(3)$ are independent. Find $P(X + Y = 2)$.'
  choices: ['0.0606', '0.0446', '0.2565', '0.0842']
  answer: 3
  explanation: |-
    The sum of independent Poissons is Poisson with the summed mean, here 5:
    $P = e^{-5}\dfrac{5^2}{2!} \approx 0.0842$. Adding the cases $(0,2), (1,1), (2,0)$ directly gives the same
    value. The value 0.0606 is $P(X = 2)P(Y = 2)$, one of the ways to get a sum of 4.

- id: ps-q-0811
  lesson: ps-poisson
  topic: Poisson process
  stem: 'Which is not one of the assumptions of a Poisson process?'
  choices: ['Counts in non-overlapping intervals are independent', 'The rate of events increases after each event occurs', 'The count distribution depends only on the length of the interval', 'Two or more events in a very short interval are negligibly likely']
  answer: 1
  explanation: |-
    A Poisson process has a constant rate; events neither encourage nor discourage later ones.
    The other three statements are the defining assumptions: independent increments, stationary
    increments, and no simultaneous events.

- id: ps-q-0812
  lesson: ps-poisson
  topic: Poisson distribution
  stem: 'In deriving the Poisson pmf as the limit of $\binom{n}{k}(\lambda/n)^k(1 - \lambda/n)^{n-k}$ with $k$ fixed and $n \to \infty$, which factor tends to $e^{-\lambda}$?'
  choices: ['$\left(1 - \dfrac{\lambda}{n}\right)^{n}$', '$\dfrac{n(n-1)\cdots(n-k+1)}{n^k}$', '$\left(1 - \dfrac{\lambda}{n}\right)^{-k}$', '$\dfrac{\lambda^k}{k!}$']
  answer: 0
  explanation: |-
    $(1 - \lambda/n)^n \to e^{-\lambda}$ is the standard limit. The falling-factorial ratio and
    $(1 - \lambda/n)^{-k}$ both tend to 1, and $\lambda^k/k!$ does not depend on $n$.

# ---- Lesson 09: moment generating functions
- id: ps-q-0901
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$P(X = 0) = 0.4$, $P(X = 1) = 0.4$ and $P(X = 3) = 0.2$. What is the MGF of $X$?'
  choices: ['$0.4 + 0.4t + 0.2t^3$', '$0.4e^{t} + 0.2e^{3t}$', '$0.4 + 0.4e^{t} + 0.2e^{3t}$', '$e^{0.4t + 0.6t}$']
  answer: 2
  explanation: |-
    $M(t) = \sum e^{tx}p(x) = 0.4e^{0} + 0.4e^{t} + 0.2e^{3t}$. The value $x = 0$ contributes the
    constant 0.4 (so that $M(0) = 1$), which the second expression drops.

- id: ps-q-0902
  lesson: ps-mgf
  module_quiz: true
  topic: Moment generating functions
  stem: '$X$ has MGF $M(t) = (0.6 + 0.4e^t)^5$. Find $E(X)$ and $\operatorname{Var}(X)$.'
  choices: ['2 and 0.24', '3 and 1.2', '0.4 and 0.24', '2 and 1.2']
  answer: 3
  explanation: |-
    This is the binomial MGF $(q + pe^t)^n$ with $n = 5$, $p = 0.4$, so $E(X) = 2$ and
    $\operatorname{Var}(X) = 5(0.4)(0.6) = 1.2$. (Directly: $M'(0) = 5(0.4) = 2$.)

- id: ps-q-0903
  lesson: ps-mgf
  module_quiz: true
  topic: Moment generating functions
  stem: '$X$ has MGF $M(t) = e^{3(e^t - 1)}$. Find $P(X = 0)$.'
  choices: ['0.0498', '0.0000', '0.2240', '0.9502']
  answer: 0
  explanation: |-
    The MGF is that of Poisson(3), so by uniqueness $X \sim \text{Poisson}(3)$ and
    $P(X = 0) = e^{-3} \approx 0.0498$.

- id: ps-q-0904
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$X$ has MGF $M(t) = \dfrac{0.25e^t}{1 - 0.75e^t}$ for $t < -\ln 0.75$. Find $E(X)$.'
  choices: ['0.25', '4', '3', '12']
  answer: 1
  explanation: |-
    This is the geometric MGF $pe^t/(1 - qe^t)$ with $p = 0.25$ (trials until the first success), so
    $E(X) = 1/p = 4$. The value 12 is the variance $q/p^2$.

- id: ps-q-0905
  lesson: ps-mgf
  topic: Moment generating functions
  stem: 'An MGF satisfies $M''(0) = 3$ and $M''''(0) = 13$. Find $\operatorname{Var}(X)$.'
  choices: ['13', '10', '4', '2']
  answer: 2
  explanation: |-
    $E(X) = M'(0) = 3$ and $E(X^2) = M''(0) = 13$, so $\operatorname{Var}(X) = 13 - 9 = 4$. Using
    $M''(0)$ alone gives $E(X^2)$, not the variance.

- id: ps-q-0906
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$X$ has MGF $M_X(t)$. Which is the MGF of $Y = 2X + 1$?'
  choices: ['$2M_X(t) + 1$', '$e^{t}M_X(2t)$', '$e^{2t}M_X(t)$', '$M_X(2t) + e^{t}$']
  answer: 1
  explanation: |-
    $M_Y(t) = E(e^{t(2X+1)}) = e^{t}E(e^{(2t)X}) = e^{t}M_X(2t)$. The shift becomes a factor $e^{bt}$ and
    the scale goes inside the argument.

- id: ps-q-0907
  lesson: ps-mgf
  module_quiz: true
  topic: Moment generating functions
  stem: '$X \sim \text{Bin}(5, 0.3)$ and $Y \sim \text{Bin}(7, 0.3)$ are independent. What is the distribution of $X + Y$?'
  choices: ['$\text{Bin}(12, 0.6)$', '$\text{Bin}(35, 0.3)$', 'Not binomial', '$\text{Bin}(12, 0.3)$']
  answer: 3
  explanation: |-
    $M_{X+Y}(t) = (0.7 + 0.3e^t)^5(0.7 + 0.3e^t)^7 = (0.7 + 0.3e^t)^{12}$, the MGF of $\text{Bin}(12, 0.3)$; by
    uniqueness that is the distribution. It also makes sense: 12 independent trials with the same $p$.

- id: ps-q-0908
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$X \sim \text{Bin}(5, 0.3)$ and $Y \sim \text{Bin}(5, 0.6)$ are independent. Which statement about $X + Y$ is correct?'
  choices: ['It is $\text{Bin}(10, 0.45)$', 'It is $\text{Bin}(10, 0.9)$', 'Its MGF is $(0.7 + 0.3e^t)^5(0.4 + 0.6e^t)^5$, which is not a binomial MGF', 'It is $\text{Bin}(5, 0.9)$']
  answer: 2
  explanation: |-
    The MGF of a sum of independent variables is the product of their MGFs. With different success
    probabilities the product cannot be written as $(q + pe^t)^{10}$, so by uniqueness the sum is not
    binomial, even though its mean is $1.5 + 3 = 4.5 = 10(0.45)$.

- id: ps-q-0909
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$\ln M_X(t) = 4(e^t - 1) + 2t$. Find the mean and variance of $X$.'
  choices: ['6 and 4', '4 and 4', '6 and 6', '6 and 8']
  answer: 0
  explanation: |-
    With $R(t) = \ln M_X(t)$: $R'(t) = 4e^t + 2$, so $\mu = R'(0) = 6$; $R''(t) = 4e^t$, so
    $\sigma^2 = R''(0) = 4$. Indeed $X = Y + 2$ with $Y \sim \text{Poisson}(4)$: the shift moves the mean
    but not the variance.

- id: ps-q-0910
  lesson: ps-mgf
  topic: Moment generating functions
  stem: 'Which function cannot be the MGF of any random variable?'
  choices: ['$(0.5 + 0.5e^t)^3$', '$e^{2(e^t - 1)}$', '$e^{t} + 1$', '$0.3 + 0.7e^{2t}$']
  answer: 2
  explanation: |-
    Every MGF satisfies $M(0) = E(e^0) = 1$, but $e^0 + 1 = 2$. The others are the MGFs of
    $\text{Bin}(3, 0.5)$, Poisson(2), and a variable equal to 0 or 2.

- id: ps-q-0911
  lesson: ps-mgf
  topic: Moment generating functions
  stem: '$X$ has MGF $M(t) = 0.5 + 0.5e^{2t}$. Find $E(X^3)$.'
  choices: ['8', '2', '1', '4']
  answer: 3
  explanation: |-
    $M'''(t) = 0.5 \cdot 8e^{2t}$, so $E(X^3) = M'''(0) = 4$. Directly: $X$ is 0 or 2 with probability
    $\tfrac12$ each, so $E(X^3) = \tfrac12 \cdot 8 = 4$.

- id: ps-q-0912
  lesson: ps-mgf
  module_quiz: true
  topic: Moment generating functions
  stem: 'Two random variables have the same mean and the same variance. What can you conclude?'
  choices: ['Nothing more; distributions can differ even when several moments agree', 'They have the same distribution, by the uniqueness theorem', 'They have the same MGF', 'They are independent']
  answer: 0
  explanation: |-
    The uniqueness theorem needs the MGFs to agree on a whole interval around 0, which involves every
    moment. Bin(4, 0.5) and a variable equal to 1 or 3 with probability $\tfrac12$ each both have mean 2
    and variance 1, yet differ.
