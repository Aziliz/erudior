# Round 2: Regression, ANOVA and nonparametric methods (ps-m8).
# Core lessons 34-36 (ps-m8-r2-q01..q15) and honors lessons 36h1, 36h2 (ps-m8-r2-h01..h30).

# ---------------------------------------------------------------- Lesson 34: simple linear regression
- id: ps-m8-r2-q01
  lesson: ps-linear-regression
  type: label
  module_quiz: true
  topic: Simple linear regression
  stem: 'This scatterplot shows six points and their least squares line. Name the numbered parts.'
  image: {src: images/ps-m8-ls-anatomy-blank.svg, alt: 'A scatterplot of six points with a rising least squares line. Marker 1 is on a point above the line, marker 2 on an open circle on the line directly below that point, marker 3 on the dashed vertical segment joining them, marker 4 on a square on the line near the middle of the data, and marker 5 where the line meets the y-axis.'}
  labels:
    - {x: 61.1, y: 20.4, text: 'Observed point (xᵢ, yᵢ)'}
    - {x: 61.1, y: 39.5, text: Fitted value ŷᵢ}
    - {x: 61.1, y: 29.9, text: Residual eᵢ}
    - {x: 51.4, y: 46.2, text: 'Point of means (x̄, ȳ)'}
    - {x: 12.5, y: 72.9, text: Intercept b₀}
  distractors: [Slope b₁, Prediction interval]
  explanation: |-
    The observed point sits off the line; the fitted value is the point on the line at the same $x$, $\hat y_i = b_0 + b_1x_i$; the residual is the vertical gap $e_i = y_i - \hat y_i$ between them. The first normal equation, $\bar y = b_0 + b_1\bar x$, puts $(\bar x, \bar y)$ on the line, and the intercept is the height of the line at $x = 0$. The slope is a rate (rise per unit run), not a point.

- id: ps-m8-r2-q02
  lesson: ps-linear-regression
  type: text
  topic: Simple linear regression
  stem: 'Data on $n = 10$ points give $\bar x = 3$, $\bar y = 12$, $S_{xx} = 40$ and $S_{xy} = 100$. The least squares slope is $b_1 =$ ___ and the intercept is $b_0 =$ ___. Give only the numbers.'
  accept:
    - ['2.5']
    - ['4.5']
  explanation: |-
    $b_1 = S_{xy}/S_{xx} = 100/40 = 2.5$, and the line passes through $(\bar x, \bar y)$, so $b_0 = \bar y - b_1\bar x = 12 - 2.5(3) = 4.5$.

- id: ps-m8-r2-q03
  lesson: ps-linear-regression
  type: order
  topic: Simple linear regression
  stem: 'Put the steps of the least squares derivation in order.'
  items:
    - 'Write $Q(b_0, b_1) = \sum(y_i - b_0 - b_1x_i)^2$'
    - 'Set $\partial Q/\partial b_0 = 0$ and $\partial Q/\partial b_1 = 0$ (the normal equations)'
    - 'Solve the first equation for the intercept: $b_0 = \bar y - b_1\bar x$'
    - 'Substitute into the second equation and solve: $b_1 = S_{xy}/S_{xx}$'
  explanation: |-
    You need the function before you can differentiate it, the normal equations before you can solve them, and $b_0$ in terms of $b_1$ before substituting it into the second equation. Since $Q$ is a convex quadratic, the solution is the minimum.

- id: ps-m8-r2-q04
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'Which statements are true of the residuals $e_i = y_i - \hat y_i$ from a least squares line with an intercept? Select all that apply.'
  choices:
    - '$\sum e_i = 0$'
    - '$\sum x_ie_i = 0$'
    - '$\sum e_i^2$ is smaller than for any other straight line'
    - '$\sum \lvert e_i\rvert$ is smaller than for any other straight line'
    - 'More than half of the residuals are positive'
  answer: [0, 1, 2]
  explanation: |-
    The two normal equations say exactly $\sum e_i = 0$ and $\sum x_ie_i = 0$, and least squares by definition minimizes the sum of squared vertical deviations. Minimizing $\sum\lvert e_i\rvert$ is a different method (least absolute deviations) and usually gives a different line. Nothing forces more positive than negative residuals; they only have to sum to zero.

- id: ps-m8-r2-q05
  lesson: ps-linear-regression
  type: match
  module_quiz: true
  topic: Simple linear regression
  stem: 'Match each quantity from simple linear regression to what it is.'
  pairs:
    - ['$s/\sqrt{S_{xx}}$', Standard error of the slope]
    - ['$s\sqrt{1/n + (x_0 - \bar x)^2/S_{xx}}$', Standard error for the mean response at x0]
    - ['$s\sqrt{1 + 1/n + (x_0 - \bar x)^2/S_{xx}}$', Standard error for predicting one new observation at x0]
    - ['$\sqrt{\text{SSE}/(n - 2)}$', Estimate of the error standard deviation]
  distractors: [Standard error of the intercept]
  explanation: |-
    $\operatorname{Var}(b_1) = \sigma^2/S_{xx}$, so its standard error is $s/\sqrt{S_{xx}}$. The mean response $\hat y_0$ has variance $\sigma^2[1/n + (x_0 - \bar x)^2/S_{xx}]$; a new observation adds its own error variance $\sigma^2$, which is the extra 1. $s = \sqrt{\text{SSE}/(n-2)}$ estimates $\sigma$. The intercept's standard error is $s\sqrt{1/n + \bar x^2/S_{xx}}$, which is not listed.

# ---------------------------------------------------------------- Lesson 35: one-way ANOVA
- id: ps-m8-r2-q06
  lesson: ps-anova
  type: label
  module_quiz: true
  topic: One-way ANOVA
  stem: 'The plot shows settlement for three ballast types. One observation in group B (circled) has its deviation from the grand mean split into pieces. Name the numbered parts.'
  image: {src: images/ps-m8-anova-split-blank.svg, alt: 'Dot plots of three groups, each with a short bar at its group mean, and a dashed horizontal line across the whole plot. For a circled point in the middle group, a long arrow rises from the dashed line to the point (marker 1). Beside it, a lower arrow rises from the dashed line to the group''s mean bar (marker 2) and a second arrow continues from the mean bar up to the point (marker 3). Marker 4 is on the dashed line and marker 5 on the middle group''s mean bar.'}
  labels:
    - {x: 52.8, y: 37.5, text: Total deviation}
    - {x: 58.3, y: 44.3, text: Between-group part}
    - {x: 58.3, y: 29.5, text: Within-group part}
    - {x: 72.2, y: 52.3, text: Grand mean}
    - {x: 45.3, y: 36.4, text: Group mean}
  distractors: [Mean square, Group median]
  explanation: |-
    Each deviation splits as $y_{ij} - \bar y_{\cdot\cdot} = (\bar y_{i\cdot} - \bar y_{\cdot\cdot}) + (y_{ij} - \bar y_{i\cdot})$: total = between + within. Here $19 - 14.67 = 2.33 + 2$. The dashed line is the grand mean of all 15 observations and the bar is the group's own mean. Squaring and adding the between parts over all observations gives SSTr; the within parts give SSE.

- id: ps-m8-r2-q07
  lesson: ps-anova
  type: text
  topic: One-way ANOVA
  stem: 'A one-way ANOVA compares $k = 4$ groups with 7 observations in each. The degrees of freedom are ___ for treatments, ___ for error and ___ in total. Give only the numbers.'
  accept:
    - ['3']
    - ['24']
    - ['27']
  explanation: |-
    $N = 28$. Treatments: $k - 1 = 3$. Error: $N - k = 24$. Total: $N - 1 = 27 = 3 + 24$.

- id: ps-m8-r2-q08
  lesson: ps-anova
  type: order
  module_quiz: true
  topic: One-way ANOVA
  stem: 'Put the steps of a one-way ANOVA calculation in order.'
  items:
    - 'Compute each group mean and the grand mean'
    - 'Compute SSTr and SSE'
    - 'Divide by the degrees of freedom to get MSTr and MSE'
    - 'Form $F = \text{MSTr}/\text{MSE}$'
    - 'Find the p-value from the $F_{k-1,\,N-k}$ distribution'
  explanation: |-
    The sums of squares are built from the means, the mean squares from the sums of squares, $F$ from the mean squares, and the p-value from $F$. Each step needs the one before it.

- id: ps-m8-r2-q09
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'A one-way ANOVA comparing four groups gives $p = 0.003$. Which conclusions are justified? Select all that apply.'
  choices:
    - 'At least two of the population means differ'
    - 'If all four population means were equal, an $F$ this large or larger would occur about 0.3% of the time'
    - 'To say which means differ, follow up with pairwise comparisons that control the familywise error rate'
    - 'All four population means differ from one another'
    - 'The group with the largest sample mean is significantly above every other group'
  answer: [0, 1, 2]
  explanation: |-
    Rejecting $H_0: \mu_1 = \cdots = \mu_4$ says only that not all means are equal, and the p-value is the null probability of an $F$ at least as large as observed. Which means differ is a separate question for Bonferroni or Tukey comparisons; it could be that only one group stands apart, so neither "all differ" nor "the top group beats every other" follows.

- id: ps-m8-r2-q10
  lesson: ps-anova
  type: match
  topic: One-way ANOVA
  stem: 'Match each ANOVA quantity to what it measures.'
  pairs:
    - [SST, Total variation of all observations about the grand mean]
    - [SSTr, Weighted variation of the group means about the grand mean]
    - [SSE, Variation of observations about their own group means]
    - [MSE, Pooled estimate of the common variance whether or not H0 holds]
  distractors: [Variation of the group medians about the grand median]
  explanation: |-
    $\text{SST} = \sum\sum(y_{ij} - \bar y_{\cdot\cdot})^2$, $\text{SSTr} = \sum n_i(\bar y_{i\cdot} - \bar y_{\cdot\cdot})^2$ (weighted by group size) and $\text{SSE} = \sum\sum(y_{ij} - \bar y_{i\cdot})^2$. $E(\text{MSE}) = \sigma^2$ always, while MSTr estimates $\sigma^2$ only under $H_0$. ANOVA uses means, not medians.

# ---------------------------------------------------------------- Lesson 36: nonparametric methods
- id: ps-m8-r2-q11
  lesson: ps-nonparametric
  type: match
  module_quiz: true
  topic: Nonparametric tests
  stem: 'The data are clearly non-normal, so you want a rank-based or sign-based test. Match each design to the usual choice.'
  pairs:
    - [Paired differences from a symmetric distribution, Wilcoxon signed-rank test]
    - [Paired differences that may be skewed, Sign test]
    - [Two independent samples, Wilcoxon rank-sum (Mann–Whitney) test]
    - [Four independent groups, Kruskal–Wallis test]
  distractors: [Chi-square test of independence]
  explanation: |-
    The signed-rank test uses the sizes of the differences but needs symmetry; the sign test needs only continuity. Two independent samples call for the rank-sum test, and $k \ge 3$ independent groups for Kruskal–Wallis, the rank analogue of one-way ANOVA. The chi-square test of independence is for counts in a contingency table.

- id: ps-m8-r2-q12
  lesson: ps-nonparametric
  type: text
  module_quiz: true
  topic: Nonparametric tests
  stem: 'Paired differences are $1.5,\ -0.3,\ 2.8,\ -1.1,\ 0.7$. The Wilcoxon signed-rank statistic is $W^+ =$ ___. Give only the number.'
  accept: ['11']
  explanation: |-
    Rank the absolute values: 0.3 (1), 0.7 (2), 1.1 (3), 1.5 (4), 2.8 (5). The positive differences are 1.5, 2.8 and 0.7, with ranks 4, 5 and 2, so $W^+ = 11$. (Check: $W^- = 1 + 3 = 4$ and $11 + 4 = 15 = 5 \cdot 6/2$.)

- id: ps-m8-r2-q13
  lesson: ps-nonparametric
  type: order
  topic: Nonparametric tests
  stem: 'Put the steps of a Wilcoxon rank-sum test in order.'
  items:
    - 'Pool the two samples into one list'
    - 'Sort the pooled list and assign ranks 1 to $N$ (averaging tied ranks)'
    - 'Add up the ranks that belong to the first sample to get $W$'
    - 'Compare $W$ with its null distribution, which has mean $m(N+1)/2$'
  explanation: |-
    Ranks are assigned in the combined ordering, so the samples must be pooled first; $W$ is a sum of those ranks, and only then can it be compared with its exact or approximate null distribution.

- id: ps-m8-r2-q14
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Which assumptions does the Wilcoxon signed-rank test make about the paired differences? Select all that apply.'
  choices:
    - 'They are independent'
    - 'They come from a continuous distribution'
    - 'Their distribution is symmetric about its median'
    - 'Their distribution is normal'
    - 'Their variance is known'
  answer: [0, 1, 2]
  explanation: |-
    Under $H_0$ the null distribution of $W^+$ comes from each sign being $+$ or $-$ with probability $1/2$ independently of $\lvert D_i\rvert$, which needs independence, continuity (no ties or zeros, almost surely) and symmetry. Normality and a known variance are what the rank test avoids.

- id: ps-m8-r2-q15
  lesson: ps-nonparametric
  type: text
  topic: Nonparametric tests
  stem: 'A permutation test compares a group of 3 observations with a group of 5 (8 distinct values). Listing every relabeling, how many ways are there to choose which values form the group of 3? ___'
  accept: ['56']
  explanation: |-
    A relabeling is a choice of which 3 of the 8 values get the first label: $\binom{8}{3} = 56$. Under $H_0$ all 56 are equally likely, so the smallest possible one-sided p-value is $1/56 \approx 0.018$.

# ---------------------------------------------------------------- Honors 36h1: multiple regression
- id: ps-m8-r2-h01
  lesson: ps-m8-h-multiple-regression
  type: label
  topic: Multiple regression
  stem: 'The picture shows least squares as a projection. Name the numbered parts.'
  image: {src: images/ps-m8-projection-blank.svg, alt: 'A shaded plane seen at an angle, with an origin point O on it. An arrow from O rises above the plane to a point (marker 1). A dashed red arrow drops straight down from that point to a point in the plane (marker 2 at its foot, marker 3 halfway along it), meeting the plane at a right angle. Marker 4 is on the shaded plane.'}
  labels:
    - {x: 62.5, y: 21, text: Data vector y}
    - {x: 62.5, y: 65.1, text: Fitted vector ŷ = Hy}
    - {x: 62.5, y: 43, text: Residual vector e}
    - {x: 75, y: 74.4, text: Column space of X}
  distractors: [Coefficient vector b, Mean vector]
  explanation: |-
    The plane is the set of all vectors $\mathbf{X}\mathbf{b}$, the column space of $\mathbf{X}$. The data vector $\mathbf{y}$ usually lies off it. Least squares picks the closest point $\hat{\mathbf{y}} = \mathbf{H}\mathbf{y}$, the foot of the perpendicular, and the residual $\mathbf{e} = \mathbf{y} - \hat{\mathbf{y}}$ is that perpendicular. The coefficient vector $\mathbf{b}$ has only $p$ entries and isn't a vector in this $n$-dimensional picture.

- id: ps-m8-r2-h02
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'A regression has $n = 20$ observations and $k = 3$ predictors plus an intercept. What size is $\mathbf{X}^\top\mathbf{X}$?'
  choices: ['$3 \times 3$', '$4 \times 4$', '$20 \times 20$', '$20 \times 4$']
  answer: 1
  explanation: |-
    $\mathbf{X}$ is $n \times p = 20 \times 4$ (a column of ones plus three predictor columns), so $\mathbf{X}^\top\mathbf{X}$ is $4 \times 4$. $20 \times 4$ is $\mathbf{X}$ itself, $20 \times 20$ is the size of the hat matrix, and $3 \times 3$ forgets the intercept column.

- id: ps-m8-r2-h03
  lesson: ps-m8-h-multiple-regression
  type: text
  topic: Multiple regression
  stem: 'A regression on $n = 25$ observations uses 4 predictors plus an intercept. The unbiased estimate of $\sigma^2$ is $s^2 = \text{SSE}/$___. Give only the number.'
  accept: ['20']
  explanation: |-
    There are $p = 5$ coefficients, so $s^2 = \text{SSE}/(n - p) = \text{SSE}/20$. Dividing by 21 ($n - k$) forgets the intercept; dividing by 23 uses the simple-regression $n - 2$ out of habit.

- id: ps-m8-r2-h04
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'Why is the least squares residual vector $\mathbf{e}$ orthogonal to every column of $\mathbf{X}$?'
  choices:
    - 'Because the errors $\varepsilon_i$ are assumed independent'
    - 'Because the predictors are assumed uncorrelated with each other'
    - 'Because the normal equations say $\mathbf{X}^\top(\mathbf{y} - \mathbf{X}\mathbf{b}) = \mathbf{0}$'
    - 'Because $\mathbf{H}$ is invertible'
  answer: 2
  explanation: |-
    Setting the gradient of $Q(\mathbf{b})$ to zero gives $\mathbf{X}^\top\mathbf{X}\mathbf{b} = \mathbf{X}^\top\mathbf{y}$, i.e. $\mathbf{X}^\top\mathbf{e} = \mathbf{0}$: each column has zero dot product with $\mathbf{e}$. This is algebra, true for any data; it doesn't depend on model assumptions or on the predictors being uncorrelated. $\mathbf{H}$ is not invertible (its rank is $p < n$).

- id: ps-m8-r2-h05
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'A fit with $n = 15$ and $p = 3$ has $s = 3$. The entry of $(\mathbf{X}^\top\mathbf{X})^{-1}$ for $b_2$ is $c_{22} = 0.04$, and $b_2 = 1.5$. What is the $t$ statistic for $H_0: \beta_2 = 0$?'
  choices: ['$12.5$', '$0.83$', '$0.5$', '$2.5$']
  answer: 3
  explanation: |-
    $\text{SE}(b_2) = s\sqrt{c_{22}} = 3(0.2) = 0.6$, so $t = 1.5/0.6 = 2.5$ on $n - p = 12$ df. 12.5 forgets the square root of $c_{22}$, 0.83 uses $s^2$ in place of $s$, and 0.5 leaves out $c_{22}$ altogether.

- id: ps-m8-r2-h06
  lesson: ps-m8-h-multiple-regression
  type: order
  topic: Multiple regression
  stem: 'Put the steps of the matrix least squares derivation in order.'
  items:
    - 'Write $Q(\mathbf{b}) = (\mathbf{y} - \mathbf{X}\mathbf{b})^\top(\mathbf{y} - \mathbf{X}\mathbf{b})$'
    - 'Set the gradient $-2\mathbf{X}^\top\mathbf{y} + 2\mathbf{X}^\top\mathbf{X}\mathbf{b}$ equal to $\mathbf{0}$'
    - 'Obtain the normal equations $\mathbf{X}^\top\mathbf{X}\mathbf{b} = \mathbf{X}^\top\mathbf{y}$'
    - 'Multiply by $(\mathbf{X}^\top\mathbf{X})^{-1}$ to get $\mathbf{b} = (\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$'
  explanation: |-
    The criterion comes first, its gradient next, the gradient set to zero is the normal equations, and solving them needs $\mathbf{X}^\top\mathbf{X}$ to be invertible (linearly independent columns).

- id: ps-m8-r2-h07
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'Which are properties of the hat matrix $\mathbf{H} = \mathbf{X}(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top$ for an $n \times p$ design matrix with $p < n$? Select all that apply.'
  choices:
    - '$\mathbf{H}$ is symmetric'
    - '$\mathbf{H}\mathbf{H} = \mathbf{H}$'
    - 'Its diagonal entries (the leverages) add up to $p$'
    - '$\mathbf{H}$ is invertible'
    - 'Its diagonal entries add up to $n$'
  answer: [0, 1, 2]
  explanation: |-
    $\mathbf{H}^\top = \mathbf{H}$ because $(\mathbf{X}^\top\mathbf{X})^{-1}$ is symmetric, and $\mathbf{H}\mathbf{H} = \mathbf{H}$ because projecting twice changes nothing. $\operatorname{tr}\mathbf{H} = \operatorname{tr}\big((\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{X}\big) = p$, not $n$. A projection onto a $p$-dimensional subspace sends the residual directions to $\mathbf{0}$, so it is not invertible.

- id: ps-m8-r2-h08
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'In the lesson''s wear data, the slope on traffic is 0.697 in a simple regression but $b_1 = 0.581$ when curvature is also in the model. What explains the difference?'
  choices:
    - 'Traffic and curvature are correlated, so the simple slope also picks up part of the curvature effect'
    - 'The multiple regression has fewer error degrees of freedom, which shrinks every coefficient'
    - 'One of the two fits must contain an arithmetic error, since least squares is unique'
    - 'Adding a predictor always makes the other coefficients smaller'
  answer: 0
  explanation: |-
    $b_1$ in the multiple regression is the change in mean wear per unit of traffic with curvature held fixed. The busier sites in these data are also more curved ($r_{12} = 0.51$), so a regression on traffic alone credits traffic with some of curvature's effect. Each fit is the unique least squares solution for its own model, and adding a predictor can move other coefficients in either direction.

- id: ps-m8-r2-h09
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'A regression with $n = 30$ and 3 predictors plus an intercept has $\text{SSE} = 52$ and $\text{SST} = 200$. What is the adjusted $R^2$?'
  choices: ['$0.74$', '$0.71$', '$0.70$', '$0.26$']
  answer: 1
  explanation: |-
    $R^2_{\text{adj}} = 1 - \dfrac{\text{SSE}/(n - p)}{\text{SST}/(n - 1)} = 1 - \dfrac{52/26}{200/29} = 1 - 0.29 = 0.71$. 0.74 is the ordinary $R^2 = 1 - 52/200$, 0.70 divides SSE by 25 (subtracting the intercept twice), and 0.26 is $1 - R^2$.

- id: ps-m8-r2-h10
  lesson: ps-m8-h-multiple-regression
  type: text
  topic: Multiple regression
  stem: 'For the regression in the previous setting ($n = 30$, 3 predictors plus an intercept), the overall $F$ statistic has ___ numerator and ___ denominator degrees of freedom. Give only the numbers.'
  accept:
    - ['3']
    - ['26']
  explanation: |-
    $F = \dfrac{\text{SSR}/(p - 1)}{\text{SSE}/(n - p)}$ with $p = 4$: numerator $p - 1 = 3$ (one per predictor), denominator $n - p = 26$. Here $F = (148/3)/(52/26) = 24.7$.

- id: ps-m8-r2-h11
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'Two predictors have correlation $r_{12} = 0.9$. Compared with uncorrelated predictors (same $S_{11}$ and $\sigma$), by what factor is $\operatorname{Var}(b_1)$ multiplied?'
  choices: ['$10$', '$1.23$', '$5.26$', '$2.29$']
  answer: 2
  explanation: |-
    $\operatorname{Var}(b_1) = \sigma^2/[S_{11}(1 - r_{12}^2)]$, so the variance inflation factor is $1/(1 - 0.81) = 5.26$. 10 uses $1 - r$ instead of $1 - r^2$, 1.23 is $1/r^2$, and 2.29 is the factor for the standard error, $\sqrt{5.26}$.

- id: ps-m8-r2-h12
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'A simple regression on $n = 10$ points has $\bar x = 5$ and $S_{xx} = 90$. What is the leverage of the point at $x = 11$, and does the $2p/n$ rule flag it?'
  choices:
    - '$h = 0.50$; not flagged, since leverages are at most 1'
    - '$h = 0.40$; flagged, since it equals $2p/n$'
    - '$h = 0.50$; flagged, since $2p/n = 0.4$'
    - '$h = 0.17$; not flagged'
  answer: 2
  explanation: |-
    $h = \dfrac1n + \dfrac{(x - \bar x)^2}{S_{xx}} = 0.1 + 36/90 = 0.5$. With $p = 2$, $2p/n = 0.4$, and $0.5 > 0.4$, so the point is flagged. 0.17 forgets to square the distance ($0.1 + 6/90$), 0.40 is the cutoff rather than the leverage, and leverages can be as large as 1, so being below 1 is no reassurance.

- id: ps-m8-r2-h13
  lesson: ps-m8-h-multiple-regression
  type: match
  topic: Multiple regression
  stem: 'Match each matrix expression to what it is.'
  pairs:
    - ['$(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$', Least squares coefficients]
    - ['$\sigma^2(\mathbf{X}^\top\mathbf{X})^{-1}$', Covariance matrix of the coefficients]
    - ['$\mathbf{X}(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top$', Hat matrix]
    - ['$(\mathbf{I} - \mathbf{H})\mathbf{y}$', Residual vector]
  distractors: [Fitted values]
  explanation: |-
    $\mathbf{b} = (\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$ and $\operatorname{Cov}(\mathbf{b}) = \sigma^2(\mathbf{X}^\top\mathbf{X})^{-1}$. $\mathbf{H}$ maps $\mathbf{y}$ to the fitted values $\hat{\mathbf{y}} = \mathbf{H}\mathbf{y}$ (not listed), and $\mathbf{y} - \mathbf{H}\mathbf{y} = (\mathbf{I} - \mathbf{H})\mathbf{y}$ is the residual vector.

- id: ps-m8-r2-h14
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'Which assumption is NOT needed for the Gauss–Markov theorem (least squares is the best linear unbiased estimator)?'
  choices:
    - 'The errors have mean zero'
    - 'The errors are normally distributed'
    - 'The errors are uncorrelated'
    - 'The errors have a common variance'
  answer: 1
  explanation: |-
    The proof uses only $E(\boldsymbol\varepsilon) = \mathbf{0}$ (for unbiasedness) and $\operatorname{Cov}(\boldsymbol\varepsilon) = \sigma^2\mathbf{I}$ (uncorrelated, equal variances) to compare covariance matrices. Normality is needed for the exact $t$ and $F$ distributions, not for Gauss–Markov.

- id: ps-m8-r2-h15
  lesson: ps-m8-h-multiple-regression
  topic: Multiple regression
  stem: 'Why can $R^2$ never decrease when a predictor is added to a regression?'
  choices:
    - 'Because SST decreases when there are more predictors'
    - 'Because a new predictor is always correlated with $y$'
    - 'Because the error degrees of freedom go down'
    - 'Because least squares could set the new coefficient to zero, so the minimum SSE cannot go up'
  answer: 3
  explanation: |-
    The bigger model contains the smaller one as the special case where the new coefficient is 0, so its minimized SSE is at most the old SSE, while SST does not depend on the model. That is why adjusted $R^2$, which divides by degrees of freedom, is used to compare models of different sizes.

# ---------------------------------------------------------------- Honors 36h2: blocking and two-way ANOVA
- id: ps-m8-r2-h16
  lesson: ps-m8-h-two-way-anova
  type: text
  topic: Two-way ANOVA
  stem: 'A randomized block design compares $k = 4$ treatments in $b = 6$ blocks, one observation per treatment in each block. The treatment sum of squares has ___ df and the error sum of squares has ___ df. Give only the numbers.'
  accept:
    - ['3']
    - ['15']
  explanation: |-
    Treatments: $k - 1 = 3$. Error: $(k - 1)(b - 1) = 3 \cdot 5 = 15$. With blocks $b - 1 = 5$ the total is $3 + 5 + 15 = 23 = kb - 1$. Using $kb - k = 20$ would be the one-way error df, which ignores the blocks.

- id: ps-m8-r2-h17
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'A randomized block design with $k = 3$ treatments and $b = 5$ blocks has $\text{SST} = 200$, $\text{SSTr} = 30$ and $\text{SSB} = 140$. What is the treatment $F$ statistic, and is it significant at the 5% level? ($F_{0.05,2,8} = 4.46$)'
  choices:
    - '$F = 1.06$; not significant'
    - '$F = 4.0$; significant'
    - '$F = 4.0$; not significant'
    - '$F = 8.0$; significant'
  answer: 2
  explanation: |-
    $\text{SSE} = 200 - 30 - 140 = 30$ on $(2)(4) = 8$ df, so $\text{MSE} = 3.75$; $\text{MSTr} = 30/2 = 15$ and $F = 4.0$ on (2, 8) df, below 4.46 ($p \approx 0.063$). 1.06 is the one-way analysis that leaves the blocks in the error ($\text{MSE} = 170/12$), and 8.0 forgets to divide SSTr by its df.

- id: ps-m8-r2-h18
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'Why can blocking make a treatment effect detectable that a one-way ANOVA on the same data misses?'
  choices:
    - 'It removes block-to-block variation from the error sum of squares'
    - 'It makes the treatment sum of squares larger'
    - 'It increases the error degrees of freedom'
    - 'It removes the need for randomization'
  answer: 0
  explanation: |-
    The treatment means, and so SSTr, are the same in both analyses. Blocking moves the variation between blocks out of the error into SSB, so MSE shrinks and $F$ grows. It actually lowers the error df, from $kb - k$ to $(k - 1)(b - 1)$, and randomization within blocks is still what justifies the analysis.

- id: ps-m8-r2-h19
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'A randomized block analysis of two treatments in 12 blocks gives treatment $F = 9$. What is the absolute value of the paired $t$ statistic on the same data?'
  choices: ['$81$', '$4.5$', '$9$', '$3$']
  answer: 3
  explanation: |-
    With $k = 2$ each block is a pair, and the block-design $F$ (on 1 and 11 df) equals $t^2$ for the paired $t$ test (11 df). So $\lvert t\rvert = \sqrt9 = 3$.

- id: ps-m8-r2-h20
  lesson: ps-m8-h-two-way-anova
  type: order
  topic: Two-way ANOVA
  stem: 'Put the steps of a randomized block experiment and its analysis in order.'
  items:
    - 'Group the experimental units into blocks of similar units'
    - 'Randomly assign the treatments to the units within each block'
    - 'Run the experiment and record the responses'
    - 'Compute SST, SSTr and SSB, and get SSE by subtraction'
    - 'Compare $F = \text{MSTr}/\text{MSE}$ with the $F_{k-1,\,(k-1)(b-1)}$ distribution'
  explanation: |-
    Blocks must exist before treatments can be randomized within them; the data come next; then the sums of squares, and finally the $F$ test, which needs MSE from SSE.

- id: ps-m8-r2-h21
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'Which are assumptions of the randomized block model $Y_{ij} = \mu + \tau_i + \beta_j + \varepsilon_{ij}$ with one observation per treatment in each block? Select all that apply.'
  choices:
    - 'The errors are independent and normal'
    - 'The errors have a common variance'
    - 'Treatment and block effects add, with no interaction'
    - 'All blocks have the same mean'
    - 'There are at least two observations per treatment in each block'
  answer: [0, 1, 2]
  explanation: |-
    The errors are i.i.d. $N(0, \sigma^2)$, and with one observation per cell the model must be additive, since interaction could not be separated from error. Blocks are expected to differ (that is the point of blocking), and the design has exactly one observation per cell.

- id: ps-m8-r2-h22
  lesson: ps-m8-h-two-way-anova
  type: text
  topic: Two-way ANOVA
  stem: 'A balanced $2 \times 2$ factorial with $r = 3$ observations per cell has cell means $\bar y_{11} = 10$, $\bar y_{12} = 14$, $\bar y_{21} = 12$, $\bar y_{22} = 12$. The interaction sum of squares is $\text{SS}_{AB} =$ ___. Give only the number.'
  accept: ['12']
  explanation: |-
    Row means 12 and 12, column means 11 and 13, grand mean 12. The interaction estimates $\bar y_{ij} - \bar y_{i\cdot} - \bar y_{\cdot j} + \bar y$ are $-1, 1, 1, -1$, so $\text{SS}_{AB} = r\sum(\cdot)^2 = 3(1 + 1 + 1 + 1) = 12$. (Here factor A has no main effect at all, yet B's effect is $+4$ at one level of A and 0 at the other.)

- id: ps-m8-r2-h23
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'A balanced factorial design has factor A at 3 levels, factor B at 4 levels and $r = 2$ observations per cell. What are the interaction and error degrees of freedom?'
  choices:
    - 'Interaction 6, error 12'
    - 'Interaction 12, error 12'
    - 'Interaction 6, error 18'
    - 'Interaction 5, error 6'
  answer: 0
  explanation: |-
    Interaction: $(a - 1)(b - 1) = 2 \cdot 3 = 6$. Error: $ab(r - 1) = 12 \cdot 1 = 12$. Total $abr - 1 = 23 = 2 + 3 + 6 + 12$. 18 would leave out the interaction, and 5 adds $(a - 1) + (b - 1)$ instead of multiplying.

- id: ps-m8-r2-h24
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'In the lesson''s rail-grade example, cell mean wear was 21, 16, 11 for standard rail and 14, 13, 12 for premium rail under no, low and high lubrication, and the interaction was significant. Which summary is best?'
  choices:
    - 'Premium rail wears 3 less than standard, whatever the lubrication'
    - 'Lubrication reduces wear by about 6 on both grades'
    - 'Lubrication helps standard rail much more than premium rail; at high lubrication the grades are about equal'
    - 'Neither factor matters, because the interaction is significant'
  answer: 2
  explanation: |-
    The effect of lubrication (none to high) is $21 - 11 = 10$ for standard rail but $14 - 12 = 2$ for premium, and at high lubrication the means are 11 and 12. The main-effect statements (3 less, about 6) are averages over situations where the factors behave differently. A significant interaction doesn't erase the factors' effects; it means they must be described together.

- id: ps-m8-r2-h25
  lesson: ps-m8-h-two-way-anova
  type: match
  topic: Two-way ANOVA
  stem: 'Match each pattern in an interaction plot (cell means of A drawn as one line per level of B) to what it suggests.'
  pairs:
    - [Parallel lines, No interaction]
    - [Lines that cross, Interaction in which one factor's effect reverses direction]
    - [Lines that spread apart but do not cross, Interaction in which one factor's effect changes size]
    - [Two flat lines at the same height, No interaction and no effect of either factor]
  distractors: [The errors are not normal]
  explanation: |-
    No interaction means the gap between the lines is the same at every level, so they are parallel. Non-parallel lines suggest interaction, whether they cross (the effect changes sign) or just spread (it changes size). Flat, overlapping lines are parallel too (no interaction), and in addition neither factor moves the mean, so the more complete answer fits them. An interaction plot of means says nothing about the error distribution, and with noisy data the $F$ test, not the eye, decides.

- id: ps-m8-r2-h26
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'Why can''t the interaction be tested in a two-factor design with only one observation per cell?'
  choices:
    - 'The interaction sum of squares is always zero then'
    - 'With no within-cell replication there is no separate error estimate: the leftover variation is the interaction'
    - 'The $F$ distribution needs at least two observations per cell to be defined'
    - 'Interactions only exist when the design is unbalanced'
  answer: 1
  explanation: |-
    The error sum of squares in a factorial measures scatter among replicates within a cell. With $r = 1$ there are no replicates, so the residual $y_{ij} - \bar y_{i\cdot} - \bar y_{\cdot j} + \bar y_{\cdot\cdot}$ is the interaction estimate and serves as the error only if additivity is assumed, as in the randomized block design.

- id: ps-m8-r2-h27
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'In the randomized block model with $b$ blocks, what is $E(\text{MSTr})$?'
  choices:
    - '$\sigma^2 + b\sum_i\tau_i^2/(k - 1)$'
    - '$\sigma^2$'
    - '$b\sum_i\tau_i^2/(k - 1)$'
    - '$\sigma^2 + k\sum_j\beta_j^2/(b - 1)$'
  answer: 0
  explanation: |-
    Each treatment mean averages $b$ observations, so as in one-way ANOVA $E(\text{MSTr}) = \sigma^2 + b\sum\tau_i^2/(k - 1)$, which equals $\sigma^2 = E(\text{MSE})$ only when all $\tau_i = 0$. The expression with $\beta_j$ is $E(\text{MSB})$, and block effects cancel out of treatment means because every treatment appears once in every block.

- id: ps-m8-r2-h28
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'Data from a randomized block design are mistakenly analyzed with a one-way ANOVA. Compared with the correct block analysis, which quantities change? Select all that apply.'
  choices:
    - 'The error sum of squares'
    - 'The error degrees of freedom'
    - 'The treatment $F$ statistic'
    - 'The treatment sum of squares'
    - 'The treatment means'
  answer: [0, 1, 2]
  explanation: |-
    The one-way analysis has $\text{SSE} = \text{SSE}_{\text{block}} + \text{SSB}$ on $kb - k$ df instead of $(k - 1)(b - 1)$, so MSE and therefore $F$ change (in the lesson's example, from 19.0 to 0.20). The treatment means, and SSTr built from them, are the same in both analyses.

- id: ps-m8-r2-h29
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'Randomized blocks and factorial experiments were developed in the 1920s for agricultural field trials at Rothamsted, England, by'
  choices: ['Karl Pearson', 'R. A. Fisher', 'W. S. Gosset ("Student")', 'Jerzy Neyman']
  answer: 1
  explanation: |-
    R. A. Fisher worked at Rothamsted from 1919. He presented the analysis of variance in "Statistical Methods for Research Workers" (1925), argued for randomized blocks in the 1926 paper "The arrangement of field experiments", and set out these designs at length in "The Design of Experiments" (1935). Gosset developed the $t$ distribution at the Guinness brewery, Pearson the chi-square test, and Neyman (with E. S. Pearson) the theory of hypothesis tests.

- id: ps-m8-r2-h30
  lesson: ps-m8-h-two-way-anova
  topic: Two-way ANOVA
  stem: 'In the lesson''s fastener example ($k = 3$, $b = 4$), $\text{SSTr} = 50.67$ and $\text{SSE} = 8$. What is the treatment $F$ statistic?'
  choices: ['$6.33$', '$0.20$', '$28.5$', '$19.0$']
  answer: 3
  explanation: |-
    $\text{MSTr} = 50.67/2 = 25.33$ and $\text{MSE} = 8/[(2)(3)] = 1.333$, so $F = 19.0$ on (2, 6) df. 6.33 divides SSTr by SSE without using degrees of freedom, 28.5 divides SSE by the one-way error df $kb - k = 9$ instead of 6, and 0.20 is the one-way analysis that also leaves the site variation in the error.
