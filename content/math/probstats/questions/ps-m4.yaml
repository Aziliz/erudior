# Module 4 — Joint distributions (lessons 15–20)
# ---- Lesson 15: joint distributions and marginals
- id: ps-q-1501
  lesson: ps-joint-dist
  module_quiz: true
  topic: Joint distributions
  stem: 'Which conditions must every joint probability mass function $p(x, y)$ satisfy?'
  choices: ['$\sum_y p(x, y) = 1$ for each fixed $x$', '$p(x, y) = p_X(x)\,p_Y(y)$ for all $x, y$', '$p(x, y) \ge 0$ for all $x, y$ and $\sum_x\sum_y p(x, y) = 1$', '$p(x, y) \le p_X(x) + p_Y(y) - 1$ for all $x, y$']
  answer: 2
  explanation: |-
    A joint pmf is a probability distribution on pairs: nonnegative, with total probability 1 over all
    pairs. Summing over $y$ for fixed $x$ gives the marginal $p_X(x)$, not 1, and the product rule holds
    only for independent variables.

- id: ps-q-1502
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: |-
    The joint pmf of $X$ and $Y$ is

    $$\begin{array}{c|cc} & y = 0 & y = 1 \\ \hline x = 1 & 0.10 & 0.20 \\ x = 2 & 0.25 & 0.15 \\ x = 3 & 0.05 & 0.25 \end{array}$$

    Find $P(X = 2)$.
  choices: ['$0.40$', '$0.25$', '$0.15$', '$0.65$']
  answer: 0
  explanation: |-
    The marginal pmf of $X$ adds across the row: $P(X = 2) = 0.25 + 0.15 = 0.40$. 0.25 and 0.15 are single
    cells, and 0.65 adds the cell 0.25 to the $y = 0$ column total 0.40, mixing a row with a column.

- id: ps-q-1503
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: |-
    Using the joint pmf

    $$\begin{array}{c|cc} & y = 0 & y = 1 \\ \hline x = 1 & 0.10 & 0.20 \\ x = 2 & 0.25 & 0.15 \\ x = 3 & 0.05 & 0.25 \end{array}$$

    find $P(X + Y \ge 3)$.
  choices: ['$0.25$', '$0.70$', '$0.30$', '$0.45$']
  answer: 3
  explanation: |-
    The cells with $x + y \ge 3$ are $(2, 1)$, $(3, 0)$ and $(3, 1)$: $0.15 + 0.05 + 0.25 = 0.45$.
    0.25 counts only $x + y > 3$, and 0.30 is the marginal $P(X = 3)$.

- id: ps-q-1504
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: 'For what constant $c$ is $f(x, y) = c\,x y^2$ a joint density on the rectangle $0 < x < 1$, $0 < y < 2$?'
  choices: ['$c = \tfrac43$', '$c = \tfrac34$', '$c = 6$', '$c = \tfrac32$']
  answer: 1
  explanation: |-
    The integral factors over the rectangle: $\int_0^1 x\,dx \int_0^2 y^2\,dy = \tfrac12 \cdot \tfrac83 = \tfrac43$. Setting
    $c \cdot \tfrac43 = 1$ gives $c = \tfrac34$. ($\tfrac43$ is the integral itself, not its reciprocal; 6 comes from
    integrating $y$ over $(0, 1)$ instead of $(0, 2)$.)

- id: ps-q-1505
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: '$(X, Y)$ has joint density $f(x, y) = 2$ on the triangle $0 < y < x < 1$. What is the marginal density of $X$?'
  choices: ['$f_X(x) = 2$ for $0 < x < 1$', '$f_X(x) = 2(1 - x)$ for $0 < x < 1$', '$f_X(x) = x^2$ for $0 < x < 1$', '$f_X(x) = 2x$ for $0 < x < 1$']
  answer: 3
  explanation: |-
    Fix $x$ and integrate out $y$ over the part of the support above it, $0 < y < x$:
    $f_X(x) = \int_0^x 2\,dy = 2x$. Using constant limits $0$ to $1$ gives 2, which ignores the triangular
    support; $2(1 - x)$ is the marginal of $Y$.

- id: ps-q-1506
  lesson: ps-joint-dist
  module_quiz: true
  topic: Joint distributions
  stem: '$(X, Y)$ is uniformly distributed on the unit square $[0, 1]^2$. Find $P(Y < X^2)$.'
  choices: ['$\tfrac12$', '$\tfrac13$', '$\tfrac23$', '$\tfrac14$']
  answer: 1
  explanation: |-
    With density 1 on the square, the probability is the area under $y = x^2$:
    $\int_0^1 \int_0^{x^2} dy\,dx = \int_0^1 x^2\,dx = \tfrac13$. $\tfrac23$ is the area above the curve.

- id: ps-q-1507
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: 'The joint density is $f(x, y) = 8xy$ on $0 < y < x < 1$. Which integral equals $P(Y > \tfrac12)$?'
  choices: ['$\displaystyle\int_{1/2}^{1}\int_{1/2}^{x} 8xy\,dy\,dx$', '$\displaystyle\int_{1/2}^{1}\int_{1/2}^{1} 8xy\,dy\,dx$', '$\displaystyle\int_{1/2}^{1}\int_{0}^{x} 8xy\,dy\,dx$', '$\displaystyle\int_{0}^{1/2}\int_{y}^{1} 8xy\,dx\,dy$']
  answer: 0
  explanation: |-
    The event $Y > \tfrac12$ inside the support needs $\tfrac12 < y < x$, which forces $x > \tfrac12$. So $x$ runs from
    $\tfrac12$ to 1 and, for each $x$, $y$ from $\tfrac12$ to $x$. The square limits include points with $y > x$ outside
    the support; the inner limits $0$ to $x$ compute $P(X > \tfrac12)$; integrating $y$ from 0 to $\tfrac12$ (outer) and $x$ from $y$ to 1 computes $P(Y < \tfrac12)$.

- id: ps-q-1508
  lesson: ps-joint-dist
  module_quiz: true
  topic: Joint distributions
  stem: 'For $f(x, y) = 8xy$ on $0 < y < x < 1$ (so $f_Y(y) = 4y(1 - y^2)$ on $(0, 1)$), find $P(Y > \tfrac12)$.'
  choices: ['$\tfrac7{16}$', '$\tfrac12$', '$\tfrac9{16}$', '$\tfrac{15}{16}$']
  answer: 2
  explanation: |-
    $P(Y > \tfrac12) = \int_{1/2}^1 (4y - 4y^3)\,dy = \big[2y^2 - y^4\big]_{1/2}^1 = 1 - \big(\tfrac12 - \tfrac1{16}\big) = \tfrac{9}{16}$.
    $\tfrac7{16}$ is $P(Y < \tfrac12)$, and $\tfrac{15}{16}$ is $P(X > \tfrac12) = 1 - (\tfrac12)^4$.

- id: ps-q-1509
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: 'A student claims $f(x, y) = 8xy$ on $0 < y < x < 1$ cannot be a joint density because $f(0.9, 0.8) = 5.76 > 1$. What is the right response?'
  choices: ['The claim is right: a density can never exceed 1', 'The claim is wrong: a density value is not a probability; only integrals of $f$ over regions must lie in $[0, 1]$', 'The claim is right unless the support is a rectangle', 'The claim is wrong because $f(0.9, 0.8)$ is actually below 1']
  answer: 1
  explanation: |-
    Probabilities come from integrating $f$; the value $f(x, y)$ is probability per unit area. A small
    region can carry a high density while the total volume under the surface is still 1 (here it is).

- id: ps-q-1510
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: 'You know the marginal distributions of $X$ and of $Y$ exactly. Which statement is true?'
  choices: ['The joint distribution is the product of the marginals', 'The joint distribution can be recovered by dividing each marginal by the other', 'The joint distribution is determined only if both variables are continuous', 'Different joint distributions can share these marginals, so the joint is not determined']
  answer: 3
  explanation: |-
    Marginals record each variable alone and lose how the two move together. For example, a table
    with positive association and the product table can have identical row and column totals. The
    product form holds only under independence.

- id: ps-q-1511
  lesson: ps-joint-dist
  module_quiz: true
  topic: Joint distributions
  stem: '$(X, Y)$ has joint density $f(x, y) = x + y$ on the unit square. Find the joint cdf value $F(\tfrac12, \tfrac12) = P(X \le \tfrac12, Y \le \tfrac12)$.'
  choices: ['$\tfrac18$', '$\tfrac14$', '$\tfrac1{16}$', '$\tfrac12$']
  answer: 0
  explanation: |-
    $\int_0^{1/2}\int_0^{1/2}(x + y)\,dy\,dx$. By symmetry the $x$ and $y$ parts are equal, each
    $\int_0^{1/2} x\,dx \cdot \tfrac12 = \tfrac18 \cdot \tfrac12 = \tfrac1{16}$, so the total is $\tfrac18$. ($\tfrac1{16}$ keeps only one of the two
    terms; $\tfrac14$ is the area of the square, which would be the answer for a uniform density.)

- id: ps-q-1512
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: '$(X, Y)$ is uniform on the triangle with vertices $(0, 0)$, $(2, 0)$ and $(0, 2)$. Find $P(X > 1)$.'
  choices: ['$\tfrac12$', '$\tfrac18$', '$\tfrac14$', '$\tfrac34$']
  answer: 2
  explanation: |-
    Uniform means probability = area ratio. The triangle has area 2. The part with $x > 1$ is the small
    triangle with vertices $(1, 0)$, $(2, 0)$, $(1, 1)$, area $\tfrac12$. So $P(X > 1) = \tfrac{1/2}{2} = \tfrac14$. $\tfrac12$ is the small
    area itself, forgetting to divide by the total area.

# ---- Lesson 16: conditional distributions and independence
- id: ps-q-1601
  lesson: ps-conditional-indep
  module_quiz: true
  topic: Conditional distributions
  stem: |-
    The joint pmf of $X$ and $Y$ is

    $$\begin{array}{c|cc} & y = 0 & y = 1 \\ \hline x = 1 & 0.10 & 0.20 \\ x = 2 & 0.25 & 0.15 \\ x = 3 & 0.05 & 0.25 \end{array}$$

    Find $P(Y = 1 \mid X = 1)$.
  choices: ['$\tfrac23$', '$\tfrac13$', '$0.20$', '$0.60$']
  answer: 0
  explanation: |-
    Condition on the row $x = 1$, whose total is $0.30$: $P(Y = 1 \mid X = 1) = 0.20/0.30 = \tfrac23$. 0.20 is the joint
    probability, $\tfrac13$ divides by $P(Y = 1) = 0.60$ instead of $P(X = 1)$, and 0.60 is the unconditional $P(Y = 1)$.

- id: ps-q-1602
  lesson: ps-conditional-indep
  topic: Conditional distributions
  stem: |-
    Using the same joint pmf

    $$\begin{array}{c|cc} & y = 0 & y = 1 \\ \hline x = 1 & 0.10 & 0.20 \\ x = 2 & 0.25 & 0.15 \\ x = 3 & 0.05 & 0.25 \end{array}$$

    find $P(X = 3 \mid Y = 1)$.
  choices: ['$\tfrac5{12}$', '$\tfrac56$', '$0.25$', '$\tfrac35$']
  answer: 0
  explanation: |-
    Condition on the column $y = 1$, total $0.20 + 0.15 + 0.25 = 0.60$: $P(X = 3 \mid Y = 1) = 0.25/0.60 = \tfrac5{12}$.
    $\tfrac56 = 0.25/0.30$ divides by $P(X = 3)$, which gives $P(Y = 1 \mid X = 3)$ instead.

- id: ps-q-1603
  lesson: ps-conditional-indep
  module_quiz: true
  topic: Independence of random variables
  stem: 'For the joint pmf with rows $x = 1{:}\ (0.10, 0.20)$, $x = 2{:}\ (0.25, 0.15)$, $x = 3{:}\ (0.05, 0.25)$ (columns $y = 0, 1$), are $X$ and $Y$ independent?'
  choices: ['Yes, because every cell is positive', 'Yes, because the table sums to 1', 'No, because the columns have different totals', 'No, because $p(1, 0) = 0.10$ while $p_X(1)\,p_Y(0) = 0.30 \times 0.40 = 0.12$']
  answer: 3
  explanation: |-
    Independence requires $p(x, y) = p_X(x)p_Y(y)$ in every cell; one failure proves dependence. Here
    $0.10 \ne 0.12$. Positive cells, a total of 1, and unequal column totals are all compatible with
    independence.

- id: ps-q-1604
  lesson: ps-conditional-indep
  topic: Conditional distributions
  stem: '$(X, Y)$ has joint density $f(x, y) = x + y$ on the unit square. What is the conditional density $f_{Y \mid X}(y \mid x)$ for $0 < y < 1$?'
  choices: ['$x + y$', '$\dfrac{x + y}{x + \tfrac12}$', '$\dfrac{x + y}{y + \tfrac12}$', '$\dfrac{x + y}{2}$']
  answer: 1
  explanation: |-
    $f_X(x) = \int_0^1 (x + y)\,dy = x + \tfrac12$, and $f_{Y \mid X} = f(x, y)/f_X(x)$. Dividing by $y + \tfrac12 = f_Y(y)$ gives
    $f_{X \mid Y}$ instead. The joint density itself does not integrate to 1 in $y$ for most $x$.

- id: ps-q-1605
  lesson: ps-conditional-indep
  topic: Conditional distributions
  stem: 'For $f(x, y) = x + y$ on the unit square, find $P(Y < \tfrac12 \mid X = \tfrac12)$.'
  choices: ['$\tfrac12$', '$\tfrac14$', '$\tfrac58$', '$\tfrac38$']
  answer: 3
  explanation: |-
    $f_X(\tfrac12) = \tfrac12 + \tfrac12 = 1$, so $f_{Y \mid X}(y \mid \tfrac12) = \tfrac12 + y$ on $(0, 1)$.
    Then $\int_0^{1/2}(\tfrac12 + y)\,dy = \tfrac14 + \tfrac18 = \tfrac38$. Larger $y$ values are favored, so the answer is below $\tfrac12$;
    $\tfrac58$ is $P(Y > \tfrac12 \mid X = \tfrac12)$.

- id: ps-q-1606
  lesson: ps-conditional-indep
  module_quiz: true
  topic: Independence of random variables
  stem: 'Which joint density makes $X$ and $Y$ independent?'
  choices: ['$f(x, y) = 2e^{-x-y}$ for $0 < x < y$', '$f(x, y) = 6e^{-2x - 3y}$ for $x > 0,\ y > 0$', '$f(x, y) = 8xy$ for $0 < y < x < 1$', '$f(x, y) = x + y$ for $0 < x, y < 1$']
  answer: 1
  explanation: |-
    $6e^{-2x-3y} = (2e^{-2x})(3e^{-3y})$ on the product set $(0, \infty)^2$, so it factors: independent exponentials. The
    densities $2e^{-x-y}$ on $0 < x < y$ and $8xy$ on $0 < y < x < 1$ look like products but live on non-rectangular supports, which ties $x$
    and $y$ together; $x + y$ cannot be written as $g(x)h(y)$.

- id: ps-q-1607
  lesson: ps-conditional-indep
  topic: Independence of random variables
  stem: 'A bus arrives after an exponential time with mean 20 minutes, and an independent taxi after an exponential time with mean 60 minutes. What is the probability the bus comes first?'
  choices: ['$\tfrac14$', '$\tfrac13$', '$\tfrac34$', '$\tfrac23$']
  answer: 2
  explanation: |-
    Rates are $a = \tfrac1{20}$ and $b = \tfrac1{60}$ per minute, and $P(X < Y) = \dfrac{a}{a + b} = \dfrac{3/60}{4/60} = \tfrac34$.
    Using the means in place of the rates gives $\tfrac14$, which reverses the answer.

- id: ps-q-1608
  lesson: ps-conditional-indep
  topic: Conditional distributions
  stem: '$X \sim \text{Uniform}(0, 2)$ and, given $X = x$, $Y$ is exponential with rate $x$. What is the joint density of $(X, Y)$ for $0 < x < 2$, $y > 0$?'
  choices: ['$x e^{-xy}$', '$\tfrac12 e^{-xy}$', '$\tfrac12 x e^{-xy}$', '$2x e^{-xy}$']
  answer: 2
  explanation: |-
    Multiplication rule: $f(x, y) = f_X(x)\,f_{Y \mid X}(y \mid x) = \tfrac12 \cdot x e^{-xy}$. Omitting the factor $\tfrac12$ gives a
    surface with total volume 2; omitting the rate in front of the exponential does not give an
    exponential conditional density.

- id: ps-q-1609
  lesson: ps-conditional-indep
  topic: Conditional distributions
  stem: 'For a fixed value $x$ with $p_X(x) > 0$, which of these is always true of the conditional pmf $p_{Y \mid X}(y \mid x)$?'
  choices: ['It sums to $p_X(x)$ over all $y$', 'It sums to 1 over all $y$', 'It equals $p_Y(y)$ for all $y$', 'It sums to 1 over all $x$ for each fixed $y$']
  answer: 1
  explanation: |-
    $\sum_y p(x, y)/p_X(x) = p_X(x)/p_X(x) = 1$: for each fixed $x$ it is a pmf in $y$. It equals $p_Y$ only under
    independence, and summing over $x$ for fixed $y$ has no reason to give 1.

- id: ps-q-1610
  lesson: ps-conditional-indep
  topic: Independence of random variables
  stem: '$X_1, X_2, X_3$ are iid exponential with rate $\lambda$. What is their joint density for $x_1, x_2, x_3 > 0$?'
  choices: ['$\lambda^3 e^{-\lambda(x_1 + x_2 + x_3)}$', '$3\lambda e^{-\lambda(x_1 + x_2 + x_3)}$', '$\lambda e^{-\lambda x_1 x_2 x_3}$', '$\lambda^3 e^{-3\lambda(x_1 + x_2 + x_3)}$']
  answer: 0
  explanation: |-
    Independent means the joint density is the product of the marginals:
    $\prod_{i=1}^3 \lambda e^{-\lambda x_i} = \lambda^3 e^{-\lambda(x_1 + x_2 + x_3)}$. Adding the densities, or multiplying the exponents, does
    not give the product.

- id: ps-q-1611
  lesson: ps-conditional-indep
  module_quiz: true
  topic: Conditional distributions
  stem: '$X$ and $Y$ are independent, and $Y$ has density $f_Y(y) = 2y$ on $(0, 1)$. What is $f_{Y \mid X}(y \mid 0.3)$?'
  choices: ['$2y/0.3$ on $(0, 0.3)$', '$0.6\,y$ on $(0, 1)$', '$2y$ on $(0, 0.3)$', '$2y$ on $(0, 1)$']
  answer: 3
  explanation: |-
    Under independence $f(x, y) = f_X(x)f_Y(y)$, so $f_{Y \mid X}(y \mid x) = f_Y(y)$: learning $X = 0.3$ changes nothing
    about $Y$. The other choices invent a dependence on the observed value.

- id: ps-q-1612
  lesson: ps-conditional-indep
  topic: Independence of random variables
  stem: '$(X, Y)$ is uniformly distributed on the unit disk $x^2 + y^2 < 1$. Are $X$ and $Y$ independent?'
  choices: ['Yes, because the density is constant', 'Yes, because the disk is symmetric in $x$ and $y$', 'No: given $X = 0.9$, $Y$ must satisfy $|Y| < \sqrt{0.19} \approx 0.44$, but $Y$ alone can be near 1', 'No, because $X$ and $Y$ are negatively correlated']
  answer: 2
  explanation: |-
    A constant density on a non-rectangular region still ties the variables together: the conditional
    range of $Y$ depends on $X$, so the conditional distribution differs from the marginal. (In fact
    $\operatorname{Cov}(X, Y) = 0$ by symmetry, so they are uncorrelated yet dependent.)

# ---- Lesson 17: expectation, covariance, correlation
- id: ps-q-1701
  lesson: ps-covariance
  module_quiz: true
  topic: Covariance and correlation
  stem: '$E[X] = 2$, $E[Y] = -1$ and $E[XY] = 1$. Find $\operatorname{Cov}(X, Y)$.'
  choices: ['$3$', '$-1$', '$1$', '$-3$']
  answer: 0
  explanation: |-
    $\operatorname{Cov}(X, Y) = E[XY] - E[X]E[Y] = 1 - (2)(-1) = 3$. Getting $-1$ comes from adding instead of subtracting
    the product of means, and $-3$ from subtracting in the wrong order, $E[X]E[Y] - E[XY]$.

- id: ps-q-1702
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 9$ and $\operatorname{Cov}(X, Y) = -2$. Find $\operatorname{Var}(X + Y)$.'
  choices: ['$13$', '$17$', '$9$', '$11$']
  answer: 2
  explanation: |-
    $\operatorname{Var}(X + Y) = 4 + 9 + 2(-2) = 9$. 13 ignores the covariance, 17 adds it with the wrong sign, and 11 forgets
    the factor 2 on the covariance.

- id: ps-q-1703
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$\operatorname{Var}(X) = 1$, $\operatorname{Var}(Y) = 2$ and $\operatorname{Cov}(X, Y) = 0.5$. Find $\operatorname{Var}(2X - 3Y)$.'
  choices: ['$28$', '$22$', '$10$', '$16$']
  answer: 3
  explanation: |-
    $a^2\operatorname{Var}X + b^2\operatorname{Var}Y + 2ab\operatorname{Cov} = 4(1) + 9(2) + 2(2)(-3)(0.5) = 4 + 18 - 6 = 16$. 22 drops the covariance,
    28 adds it with the wrong sign, and 10 doubles the cross term.

- id: ps-q-1704
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$\operatorname{Cov}(X, Y) = -6$, $\operatorname{SD}(X) = 3$ and $\operatorname{SD}(Y) = 4$. Find the correlation $\rho$.'
  choices: ['$-0.5$', '$-0.125$', '$0.5$', '$-2$']
  answer: 0
  explanation: |-
    $\rho = \operatorname{Cov}/(\sigma_X\sigma_Y) = -6/12 = -0.5$. The sign carries over from the covariance; $-2$ divides by only
    one SD, which can't be right since $|\rho| \le 1$.

- id: ps-q-1705
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$X$ takes the values $-1, 0, 1$ with probability $\tfrac13$ each, and $Y = X^2$. Which statement is true?'
  choices: ['$X$ and $Y$ are independent because $\operatorname{Cov}(X, Y) = 0$', '$\operatorname{Cov}(X, Y) > 0$ because $Y$ increases with $|X|$', '$\operatorname{Cov}(X, Y) = 0$, yet $X$ and $Y$ are dependent', '$\operatorname{Cov}(X, Y) < 0$ because $Y$ falls then rises']
  answer: 2
  explanation: |-
    $E[X] = 0$ and $E[XY] = E[X^3] = 0$, so the covariance is 0. But $Y$ is a function of $X$: $P(Y = 0 \mid X = 0) = 1$
    while $P(Y = 0) = \tfrac13$. Zero covariance rules out only a linear relationship.

- id: ps-q-1706
  lesson: ps-covariance
  module_quiz: true
  topic: Covariance and correlation
  stem: '$\operatorname{Cov}(X, Y) = 4$. Find $\operatorname{Cov}(3X + 5,\; -2Y + 1)$.'
  choices: ['$24$', '$-24$', '$12$', '$-8$']
  answer: 1
  explanation: |-
    Constants added do nothing; multipliers come out: $\operatorname{Cov}(3X + 5, -2Y + 1) = (3)(-2)\operatorname{Cov}(X, Y) = -24$. 24 loses
    the sign, and 12 and $-8$ use only one of the two multipliers.

- id: ps-q-1707
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: 'An iid sample of size 36 comes from a population with standard deviation 12. What is $\operatorname{Var}(\bar X)$?'
  choices: ['$4$', '$2$', '$\tfrac13$', '$144$']
  answer: 0
  explanation: |-
    $\operatorname{Var}(\bar X) = \sigma^2/n = 144/36 = 4$. 2 is the standard deviation of $\bar X$, $\tfrac13 = 12/36$ divides the SD by
    $n$, and 144 is the population variance.

- id: ps-q-1708
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$X$ and $Y$ are independent with $E[X] = 3$, $\operatorname{Var}(X) = 2$ and $E[Y] = 4$. Find $E[X^2Y]$.'
  choices: ['$36$', '$12$', '$8$', '$44$']
  answer: 3
  explanation: |-
    Independence gives $E[X^2Y] = E[X^2]E[Y]$, and $E[X^2] = \operatorname{Var}(X) + (E X)^2 = 2 + 9 = 11$. So $E[X^2Y] = 44$.
    36 uses $(E X)^2$ in place of $E[X^2]$.

- id: ps-q-1709
  lesson: ps-covariance
  module_quiz: true
  topic: Covariance and correlation
  stem: 'Which set of values is impossible for a pair of random variables?'
  choices: ['$\operatorname{Var}X = 4$, $\operatorname{Var}Y = 9$, $\operatorname{Cov}(X, Y) = -6$', '$\operatorname{Var}X = 1$, $\operatorname{Var}Y = 1$, $\operatorname{Cov}(X, Y) = 0.9$', '$\operatorname{Var}X = 25$, $\operatorname{Var}Y = 1$, $\operatorname{Cov}(X, Y) = -4.5$', '$\operatorname{Var}X = 4$, $\operatorname{Var}Y = 9$, $\operatorname{Cov}(X, Y) = 7$']
  answer: 3
  explanation: |-
    Correlation must lie in $[-1, 1]$. With SDs 2 and 3, $\rho = 7/6 > 1$, impossible. The others give
    $\rho = -1$, $0.9$ and $-0.9$, all allowed.

- id: ps-q-1710
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: '$X$ and $Y$ are each 0 or 1 with $P(0, 0) = 0.4$, $P(0, 1) = 0.1$, $P(1, 0) = 0.1$, $P(1, 1) = 0.4$. Find $\rho = \operatorname{Corr}(X, Y)$.'
  choices: ['$0.15$', '$0.6$', '$0.4$', '$0.3$']
  answer: 1
  explanation: |-
    $E[X] = E[Y] = 0.5$ and $E[XY] = P(1, 1) = 0.4$, so $\operatorname{Cov} = 0.4 - 0.25 = 0.15$. Each variance is $0.5 \times 0.5 = 0.25$,
    so $\rho = 0.15/\sqrt{0.25 \times 0.25} = 0.6$. 0.15 is the covariance, and 0.4 is $E[XY]$.

- id: ps-q-1711
  lesson: ps-covariance
  module_quiz: true
  topic: Covariance and correlation
  stem: '$X$ and $Y$ are independent with standard deviations 5 and 12. What is the standard deviation of $X - Y$?'
  choices: ['$7$', '$17$', '$13$', '$\sqrt{119}$']
  answer: 2
  explanation: |-
    Variances add for independent terms even in a difference: $\operatorname{Var}(X - Y) = 25 + 144 = 169$, SD 13. 7 subtracts SDs,
    17 adds SDs, and $\sqrt{119}$ subtracts variances.

- id: ps-q-1712
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: 'Which identity can fail when $X$ and $Y$ are dependent?'
  choices: ['$E[X + Y] = E[X] + E[Y]$', '$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$', '$E[3X - 2] = 3E[X] - 2$', '$\operatorname{Cov}(X, Y) = E[XY] - E[X]E[Y]$']
  answer: 1
  explanation: |-
    The variance of a sum has the extra term $2\operatorname{Cov}(X, Y)$, which vanishes only for uncorrelated variables.
    Linearity of expectation and the covariance shortcut hold for any joint distribution.

# ---- Lesson 18: sums of independent random variables
- id: ps-q-1801
  lesson: ps-sums
  module_quiz: true
  topic: Sums of random variables
  stem: '$X \sim \text{Poisson}(2)$ and $Y \sim \text{Poisson}(3)$ are independent. Find $P(X + Y = 0)$.'
  choices: ['$e^{-6}$', '$e^{-2} + e^{-3}$', '$5e^{-5}$', '$e^{-5}$']
  answer: 3
  explanation: |-
    $X + Y \sim \text{Poisson}(5)$, so $P(X + Y = 0) = e^{-5} \approx 0.0067$. (Directly: both must be 0, probability
    $e^{-2}e^{-3}$.) $e^{-6}$ multiplies the means, and $5e^{-5}$ is $P(X + Y = 1)$.

- id: ps-q-1802
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X \sim N(10, 9)$ and $Y \sim N(20, 16)$ are independent (second parameter = variance). What is the distribution of $X + Y$?'
  choices: ['$N(30, 25)$', '$N(30, 49)$', '$N(30, 7)$', '$N(30, 5)$']
  answer: 0
  explanation: |-
    Independent normals sum to a normal with the means added and the variances added: $N(30, 9 + 16) = N(30, 25)$,
    SD 5. $N(30, 49)$ adds the SDs $3 + 4$ and squares, which is right only for perfectly correlated terms.

- id: ps-q-1803
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X \sim N(50, 9)$ and $Y \sim N(48, 16)$ are independent (variances 9 and 16). Find $P(X > Y)$.'
  choices: ['$0.3446$', '$0.6554$', '$0.5000$', '$0.7475$']
  answer: 1
  explanation: |-
    $D = X - Y \sim N(2, 25)$, SD 5. $P(D > 0) = P(Z > -0.4) = 0.6554$. 0.3446 is the left tail, and 0.7475 uses only
    the SD of $X$ (3) instead of 5.

- id: ps-q-1804
  lesson: ps-sums
  topic: Sums of random variables
  stem: 'Independent $X$ and $Y$ have MGFs $(1 - 2t)^{-3}$ and $(1 - 2t)^{-2}$. What is the distribution of $X + Y$?'
  choices: ['Gamma with shape 6 and scale 2', 'Gamma with shape 5 and scale $\tfrac12$', 'Gamma with shape 5 and scale 2 (chi-square with 10 df)', 'Normal with mean 10 and variance 20']
  answer: 2
  explanation: |-
    The MGF of the sum is the product $(1 - 2t)^{-5}$. A gamma with shape $\alpha$ and scale $\theta$ has MGF $(1 - \theta t)^{-\alpha}$,
    so $\alpha = 5$ and $\theta = 2$, which is chi-square with 10 df. Shape 6 multiplies the exponents;
    scale $\tfrac12$ confuses the scale with the rate.

- id: ps-q-1805
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X$ and $Y$ are independent Uniform(0, 1). What is the density of $Z = X + Y$ at $z = 1.5$?'
  choices: ['$1.5$', '$0.5$', '$1$', '$0.75$']
  answer: 1
  explanation: |-
    The convolution gives a triangle: $f_Z(z) = z$ on $(0, 1]$ and $2 - z$ on $(1, 2)$. At 1.5 that is 0.5.
    1.5 uses the left branch outside its range.

- id: ps-q-1806
  lesson: ps-sums
  module_quiz: true
  topic: Sums of random variables
  stem: '$X$ and $Y$ are independent Uniform(0, 1). Find $P(X + Y \le 0.5)$.'
  choices: ['$0.25$', '$0.5$', '$0.0625$', '$0.125$']
  answer: 3
  explanation: |-
    The region $x + y \le 0.5$ in the unit square is a triangle with legs 0.5, area $\tfrac12(0.5)^2 = 0.125$
    (equivalently $\int_0^{0.5} z\,dz$). 0.25 forgets the $\tfrac12$ in the triangle area.

- id: ps-q-1807
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X_1$ and $X_2$ are iid exponential with rate 2. What is the density of $X_1 + X_2$ for $z > 0$?'
  choices: ['$4z e^{-2z}$', '$2e^{-2z}$', '$4e^{-4z}$', '$2z e^{-2z}$']
  answer: 0
  explanation: |-
    $\int_0^z 2e^{-2x}\,2e^{-2(z - x)}\,dx = 4e^{-2z}\int_0^z dx = 4ze^{-2z}$, a gamma density with shape 2 and scale $\tfrac12$.
    $4e^{-4z}$ is the density of the minimum, and $2ze^{-2z}$ integrates to $\tfrac12$, not 1.

- id: ps-q-1808
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X_1$ and $X_2$ are iid with variance 9. Find $\operatorname{Var}(X_1 + X_2)$.'
  choices: ['$36$', '$9$', '$6$', '$18$']
  answer: 3
  explanation: |-
    Independent variances add: $9 + 9 = 18$. 36 is $\operatorname{Var}(2X_1) = 4 \times 9$, which treats the sum of two independent
    copies as one value doubled; 6 adds the SDs.

- id: ps-q-1809
  lesson: ps-sums
  topic: Sums of random variables
  stem: 'Which of these is guaranteed to have a binomial distribution?'
  choices: ['$X + Y$ with $X \sim \text{Bin}(10, 0.3)$ and $Y \sim \text{Bin}(10, 0.5)$ independent', '$X + Y$ with $X \sim \text{Bin}(10, 0.3)$ and $Y \sim \text{Bin}(15, 0.3)$ independent', '$X + X$ with $X \sim \text{Bin}(10, 0.3)$', '$X + Y$ with $X \sim \text{Poisson}(2)$ and $Y \sim \text{Bin}(5, 0.4)$ independent']
  answer: 1
  explanation: |-
    Independent binomials with the same $p$ add: $\text{Bin}(25, 0.3)$ (MGFs $(1 - p + pe^t)^{n_i}$ multiply). Different $p$
    breaks this, and $X + X = 2X$ takes only even values, so it is not binomial.

- id: ps-q-1810
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X$ and $Y$ are iid with $P(0) = 0.5$, $P(1) = 0.3$, $P(2) = 0.2$. Find $P(X + Y = 2)$.'
  choices: ['$0.20$', '$0.19$', '$0.29$', '$0.09$']
  answer: 2
  explanation: |-
    Convolution: $p(0)p(2) + p(1)p(1) + p(2)p(0) = 0.10 + 0.09 + 0.10 = 0.29$. 0.19 counts the pair $(0, 2)$ only once,
    ignoring that $(2, 0)$ is a different outcome.

- id: ps-q-1811
  lesson: ps-sums
  module_quiz: true
  topic: Sums of random variables
  stem: 'An iid sample of 25 is drawn from $N(100, 225)$ (variance 225). Find $P(\bar X > 106)$.'
  choices: ['$0.3446$', '$0.2525$', '$0.0228$', '$0.4772$']
  answer: 2
  explanation: |-
    $\bar X \sim N(100, 225/25) = N(100, 9)$, SD 3. $P(\bar X > 106) = P(Z > 2) = 0.0228$. 0.3446 uses the population SD 15,
    and 0.2525 treats the variance 9 as if it were the SD.

- id: ps-q-1812
  lesson: ps-sums
  topic: Sums of random variables
  stem: 'Four independent repair stages each take an exponential time with mean 3 hours. What are the mean and variance of the total time?'
  choices: ['Mean 12, variance 36', 'Mean 12, variance 144', 'Mean 12, variance 12', 'Mean $\tfrac43$, variance $\tfrac49$']
  answer: 0
  explanation: |-
    Each stage has mean 3 and variance $3^2 = 9$. The total (gamma, shape 4, scale 3) has mean $4 \times 3 = 12$ and
    variance $4 \times 9 = 36$. Variance 144 is $(4 \times 3)^2$, the variance of 4 times one stage.

- id: ps-q-1813
  lesson: ps-sums
  module_quiz: true
  topic: Sums of random variables
  stem: 'For a continuous pair $(X, Y)$, let $U = X + Y$ and $V = X - Y$. What is $\lvert J\rvert$, the absolute Jacobian of the inverse transformation, in $f_{U,V}(u, v) = f_{X,Y}(x, y)\lvert J\rvert$?'
  choices: ['$2$', '$\tfrac12$', '$-\tfrac12$', '$1$']
  answer: 1
  explanation: |-
    Invert: $x = (u + v)/2$, $y = (u - v)/2$. Then $J = \det\begin{pmatrix} 1/2 & 1/2 \\ 1/2 & -1/2 \end{pmatrix} = -\tfrac14 - \tfrac14 = -\tfrac12$, and $\lvert J\rvert = \tfrac12$.
    2 is the absolute determinant of the forward map $(x, y) \mapsto (u, v)$, the reciprocal of what is needed; $-\tfrac12$ forgets the absolute value;
    1 assumes a sum-and-difference map keeps area.

- id: ps-q-1814
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X$ and $Y$ are iid exponential with rate 1. With $U = X + Y$ and $V = X/(X + Y)$, what is the joint density of $(U, V)$ for $u > 0$, $0 < v < 1$?'
  choices: ['$e^{-u}$', '$e^{-u}/u$', '$u^2e^{-u}$', '$ue^{-u}$']
  answer: 3
  explanation: |-
    The inverse is $x = uv$, $y = u(1 - v)$, with $J = \det\begin{pmatrix} v & u \\ 1 - v & -u \end{pmatrix} = -u$. So $f_{U,V} = e^{-(x + y)}\lvert J\rvert = ue^{-u}$: $U$ is gamma (shape 2) and
    $V$ is Uniform(0, 1), independent of $U$. $e^{-u}$ omits the Jacobian (it would make the total $X + Y$ exponential, but a sum of two exponentials is gamma),
    $e^{-u}/u$ uses the forward Jacobian $1/(x + y)$ and does not integrate to 1, and $u^2e^{-u}$ has an extra factor of $u$ and integrates to 2.

- id: ps-q-1815
  lesson: ps-sums
  topic: Sums of random variables
  stem: '$X$ and $Y$ are iid Uniform(0, 1). Let $U = 2X + Y$ and $V = Y$. What is $f_{U,V}(u, v)$ on its support $\{0 < v < 1,\ v < u < v + 2\}$?'
  choices: ['$\tfrac12$', '$2$', '$1$', '$\tfrac14$']
  answer: 0
  explanation: |-
    The inverse is $x = (u - v)/2$, $y = v$, so $J = \det\begin{pmatrix} 1/2 & -1/2 \\ 0 & 1 \end{pmatrix} = \tfrac12$ and $f_{U,V} = 1 \cdot \tfrac12$. Check: the support is a parallelogram of
    area 2, and $\tfrac12 \times 2 = 1$. 2 uses the forward determinant, 1 forgets the Jacobian, and $\tfrac14$ squares it.

- id: ps-q-1816
  lesson: ps-sums
  topic: Sums of random variables
  stem: 'In the two-variable change-of-variables formula $f_{U,V}(u, v) = f_{X,Y}\big(x(u, v), y(u, v)\big)\lvert J\rvert$, how is $J$ computed?'
  choices: ['As the determinant of the partial derivatives of $u(x, y)$ and $v(x, y)$', 'As the product $\dfrac{\partial x}{\partial u}\dfrac{\partial y}{\partial v}$ alone', 'As the determinant of the partial derivatives of the inverse functions $x(u, v)$ and $y(u, v)$ with respect to $u$ and $v$', 'As the sum of the four partial derivatives of $x(u, v)$ and $y(u, v)$']
  answer: 2
  explanation: |-
    $J = \det\begin{pmatrix} \partial x/\partial u & \partial x/\partial v \\ \partial y/\partial u & \partial y/\partial v \end{pmatrix}$, built from the inverse map, just as the one-variable formula uses $\lvert dx/dy\rvert$.
    The forward determinant gives the reciprocal $1/\lvert J\rvert$. The product of the diagonal terms alone is the determinant only when an off-diagonal term is zero,
    and summing the partials has no geometric meaning.

# ---- Lesson 19: conditional expectation
- id: ps-q-1901
  lesson: ps-cond-expectation
  module_quiz: true
  topic: Conditional expectation
  stem: '40% of parts come from line A, with mean weight 10 g, and the rest from line B, with mean weight 20 g. What is the mean weight of a randomly chosen part?'
  choices: ['$15$ g', '$16$ g', '$14$ g', '$30$ g']
  answer: 1
  explanation: |-
    Law of total expectation: $E[Y] = 0.4(10) + 0.6(20) = 16$ g. 15 averages the two means with equal weights,
    and 14 swaps the weights.

- id: ps-q-1902
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: 'In the previous setting (40% from A with mean 10, 60% from B with mean 20), the within-line variances are 4 for A and 9 for B. Find $\operatorname{Var}(Y)$ for a random part.'
  choices: ['$7$', '$24$', '$31$', '$6.5$']
  answer: 2
  explanation: |-
    Within: $E[\operatorname{Var}(Y \mid X)] = 0.4(4) + 0.6(9) = 7$. Between: $\operatorname{Var}(E[Y \mid X]) = 0.4(10 - 16)^2 + 0.6(20 - 16)^2 = 14.4 + 9.6 = 24$.
    Total $7 + 24 = 31$. 7 and 24 are each only one part of the law of total variance.

- id: ps-q-1903
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: 'Given $X = x$, $Y$ has density $f_{Y \mid X}(y \mid x) = 3y^2/x^3$ on $0 < y < x$. Find $E[Y \mid X = x]$.'
  choices: ['$\tfrac{x}{2}$', '$\tfrac{2x}{3}$', '$\tfrac34$', '$\tfrac{3x}{4}$']
  answer: 3
  explanation: |-
    $\int_0^x y \cdot \dfrac{3y^2}{x^3}\,dy = \dfrac{3}{x^3}\cdot\dfrac{x^4}{4} = \dfrac{3x}{4}$. The answer must depend on $x$; $\tfrac34$ drops it.

- id: ps-q-1904
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: 'Which statement about $E[Y \mid X]$ is correct?'
  choices: ['It is a random variable, a function of $X$', 'It is a number that equals $E[Y]$', 'It is a number that depends on $Y$ only', 'It is defined only when $X$ and $Y$ are independent']
  answer: 0
  explanation: |-
    $E[Y \mid X = x] = g(x)$ is a number for each $x$; plugging in the random $X$ gives the random variable $g(X)$.
    Its mean is $E[Y]$, by the law of total expectation. It is defined for dependent variables, which is
    when it is most useful.

- id: ps-q-1905
  lesson: ps-cond-expectation
  module_quiz: true
  topic: Conditional expectation
  stem: 'The number of claims $N$ is Poisson with mean 5; claim sizes are iid with mean 20 and SD 4, independent of $N$. Find the variance of the total $T$.'
  choices: ['$2080$', '$2000$', '$400$', '$80$']
  answer: 0
  explanation: |-
    $\operatorname{Var}(T) = \sigma^2E[N] + \mu^2\operatorname{Var}(N) = 16(5) + 400(5) = 2080$ (for a Poisson, $\operatorname{Var}N = E N = 5$). 80 ignores the
    randomness of $N$, and 2000 ignores the variability of claim sizes.

- id: ps-q-1906
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: '$X \sim \text{Uniform}(0, 4)$ and, given $X$, $Y \sim \text{Poisson}(X)$. Find $\operatorname{Var}(Y)$.'
  choices: ['$2$', '$\tfrac43$', '$\tfrac{10}{3}$', '$4$']
  answer: 2
  explanation: |-
    $E[Y \mid X] = X$ and $\operatorname{Var}(Y \mid X) = X$. So $\operatorname{Var}(Y) = E[X] + \operatorname{Var}(X) = 2 + \tfrac{16}{12} = \tfrac{10}{3}$. 2 is the
    within part alone (what a Poisson with mean 2 would give), and $\tfrac43$ the between part alone.

- id: ps-q-1907
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: '$E[Y \mid X] = 3X + 1$ and $E[X] = 2$. Find $E[Y]$.'
  choices: ['$6$', '$7$', '$9$', '$3$']
  answer: 1
  explanation: |-
    $E[Y] = E\big[E[Y \mid X]\big] = E[3X + 1] = 3(2) + 1 = 7$. 6 drops the constant, and 9 multiplies 3 by $(2 + 1)$.

- id: ps-q-1908
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: '$E[Y \mid X] = 3X + 1$ and $\operatorname{Var}(X) = 2$. Find the between-group part $\operatorname{Var}(E[Y \mid X])$.'
  choices: ['$6$', '$19$', '$18$', '$9$']
  answer: 2
  explanation: |-
    $\operatorname{Var}(3X + 1) = 9\operatorname{Var}(X) = 18$. The constant shifts but doesn't spread; 6 forgets to square the 3.

- id: ps-q-1909
  lesson: ps-cond-expectation
  module_quiz: true
  topic: Conditional expectation
  stem: 'Among all functions $h$, which one minimizes the mean squared prediction error $E[(Y - h(X))^2]$?'
  choices: ['$h(X) = E[Y]$', '$h(X) = E[X \mid Y]$', '$h(X) = X$', '$h(X) = E[Y \mid X]$']
  answer: 3
  explanation: |-
    Within each slice $X = x$, the constant minimizing squared error is the conditional mean, so $E[Y \mid X]$ is
    the best predictor. The overall mean $E[Y]$ ignores the information in $X$.

- id: ps-q-1910
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: '$X \sim \text{Uniform}(0, 1)$ and, given $X$, $Y \sim \text{Uniform}(0, X)$. Find $E[\operatorname{Var}(Y \mid X)]$.'
  choices: ['$\tfrac1{36}$', '$\tfrac1{12}$', '$\tfrac1{48}$', '$\tfrac{7}{144}$']
  answer: 0
  explanation: |-
    A uniform on an interval of length $X$ has variance $X^2/12$, and $E[X^2] = \tfrac13$, so the within part is
    $\tfrac{1}{36}$. $\tfrac{1}{48} = \operatorname{Var}(X/2)$ is the between part, and $\tfrac{7}{144}$ is their sum, $\operatorname{Var}(Y)$.

- id: ps-q-1911
  lesson: ps-cond-expectation
  topic: Conditional expectation
  stem: 'In $\operatorname{Var}(Y) = E[\operatorname{Var}(Y \mid X)] + \operatorname{Var}(E[Y \mid X])$, what does the second term measure?'
  choices: ['The average spread of $Y$ within each value of $X$', 'How much the conditional means of $Y$ vary from one value of $X$ to another', 'The variance of $X$ itself', 'The covariance between $X$ and $Y$']
  answer: 1
  explanation: |-
    $\operatorname{Var}(E[Y \mid X])$ is the spread of the group means: the between part. The first term is the average
    within-group spread. Neither is $\operatorname{Var}(X)$ or a covariance in general.

- id: ps-q-1912
  lesson: ps-cond-expectation
  module_quiz: true
  topic: Conditional expectation
  stem: 'The number of shoppers $N$ is Poisson with mean 10, and each independently buys with probability 0.3. Find the variance of the number of buyers $B$.'
  choices: ['$2.1$', '$0.9$', '$30$', '$3$']
  answer: 3
  explanation: |-
    Given $N$, $B \sim \text{Bin}(N, 0.3)$: $E[B \mid N] = 0.3N$ and $\operatorname{Var}(B \mid N) = 0.21N$. So
    $\operatorname{Var}(B) = 0.21(10) + 0.09(10) = 3$ (indeed $B$ is Poisson with mean 3). 2.1 and 0.9 are the two parts
    separately.

# ---- Lesson 20: bivariate normal and order statistics
- id: ps-q-2001
  lesson: ps-bivariate-normal
  module_quiz: true
  topic: Bivariate normal
  stem: '$(X, Y)$ is bivariate normal with $\mu_X = 50$, $\sigma_X = 10$, $\mu_Y = 100$, $\sigma_Y = 20$ and $\rho = 0.75$. Find $E[Y \mid X = 60]$.'
  choices: ['$120$', '$115$', '$103.75$', '$111.25$']
  answer: 1
  explanation: |-
    $E[Y \mid X = x] = \mu_Y + \rho\dfrac{\sigma_Y}{\sigma_X}(x - \mu_X) = 100 + 0.75(2)(10) = 115$. 120 omits $\rho$, 103.75 inverts the
    ratio of SDs, and 111.25 uses $\rho^2$.

- id: ps-q-2002
  lesson: ps-bivariate-normal
  topic: Bivariate normal
  stem: 'For the same bivariate normal ($\sigma_Y = 20$, $\rho = 0.75$), what is the SD of $Y$ given $X = 60$?'
  choices: ['$20$', '$8.75$', '$5$', '$13.23$']
  answer: 3
  explanation: |-
    The conditional SD is $\sigma_Y\sqrt{1 - \rho^2} = 20\sqrt{0.4375} \approx 13.23$, the same for every $x$. 8.75 forgets the
    square root, and 5 is $20(1 - \rho)$, which uses $1 - \rho$ in place of $\sqrt{1 - \rho^2}$.

- id: ps-q-2003
  lesson: ps-bivariate-normal
  topic: Bivariate normal
  stem: '$(X, Y)$ is bivariate normal with $\rho = 0$. What can you conclude?'
  choices: ['$X$ and $Y$ are independent', 'Only that $E[XY] = E[X]E[Y]$; they may still be dependent', 'That $X = Y$', 'That one of them is constant']
  answer: 0
  explanation: |-
    With $\rho = 0$ the bivariate normal density factors into the two normal marginals, so the variables are
    independent. For general distributions zero correlation is weaker than independence; joint
    normality is what makes the difference.

- id: ps-q-2004
  lesson: ps-bivariate-normal
  topic: Bivariate normal
  stem: '$X \sim N(0, 1)$ and $Y = SX$, where $S = \pm 1$ with probability $\tfrac12$ each, independent of $X$. Which statement is true?'
  choices: ['$(X, Y)$ is bivariate normal because both marginals are normal', '$X + Y$ is normal with variance 2', '$Y$ is not normal', '$Y$ is $N(0, 1)$, but $(X, Y)$ is not bivariate normal, since $X + Y = 0$ with probability $\tfrac12$']
  answer: 3
  explanation: |-
    Flipping the sign of a standard normal leaves it standard normal, so both marginals are normal. But
    $X + Y$ is 0 whenever $S = -1$, so this linear combination is not normal, which rules out joint
    normality.

- id: ps-q-2005
  lesson: ps-bivariate-normal
  module_quiz: true
  topic: Bivariate normal
  stem: '$(X, Y)$ is bivariate normal with $\sigma_X = 3$, $\sigma_Y = 4$ and $\rho = -0.5$. Find $\operatorname{Var}(X + Y)$.'
  choices: ['$13$', '$25$', '$37$', '$7$']
  answer: 0
  explanation: |-
    $\operatorname{Var}(X + Y) = 9 + 16 + 2(-0.5)(3)(4) = 13$, and $X + Y$ is normal. 25 ignores the correlation, 37 uses
    $+0.5$, and 7 adds the SDs.

- id: ps-q-2006
  lesson: ps-bivariate-normal
  topic: Bivariate normal
  stem: 'Heights of parents and adult children are bivariate normal with $\rho = 0.5$ and equal means and SDs. A parent is 2 SDs above average. How many SDs above average is the child predicted to be?'
  choices: ['1', '2', '0.5', '4']
  answer: 0
  explanation: |-
    In standard units the conditional mean is $\rho z_x = 0.5 \times 2 = 1$. The prediction moves toward the mean:
    regression to the mean. 2 ignores $\rho$, and 0.5 is $\rho$ itself.

- id: ps-q-2007
  lesson: ps-bivariate-normal
  topic: Order statistics
  stem: 'Four iid Uniform(0, 1) values are drawn. Find $P(\max \le 0.8)$.'
  choices: ['$0.5904$', '$0.0016$', '$0.4096$', '$0.8$']
  answer: 2
  explanation: |-
    The max is at most 0.8 exactly when all four are: $0.8^4 = 0.4096$. 0.5904 is $1 - 0.8^4$, the chance the max
    exceeds 0.8, and 0.0016 is $0.2^4$, the chance all four exceed 0.8.

- id: ps-q-2008
  lesson: ps-bivariate-normal
  module_quiz: true
  topic: Order statistics
  stem: 'Three components have iid exponential lifetimes with mean 6 years. What is the mean time until the first failure?'
  choices: ['$6$ years', '$2$ years', '$18$ years', '$\tfrac12$ year']
  answer: 1
  explanation: |-
    Each rate is $\tfrac16$; the minimum is exponential with rate $3 \times \tfrac16 = \tfrac12$, so its mean is 2 years. 18 adds the
    means, and $\tfrac12$ is the rate, not the mean.

- id: ps-q-2009
  lesson: ps-bivariate-normal
  topic: Order statistics
  stem: '$X_1, \dots, X_n$ are iid with cdf $F$. Which is the cdf of the minimum $X_{(1)}$?'
  choices: ['$F(x)^n$', '$1 - F(x)^n$', '$1 - \big(1 - F(x)\big)^n$', '$\big(1 - F(x)\big)^n$']
  answer: 2
  explanation: |-
    The minimum exceeds $x$ only if every value does: $P(X_{(1)} > x) = (1 - F(x))^n$. Its cdf is the complement,
    $1 - (1 - F(x))^n$. $F(x)^n$ is the cdf of the maximum.

- id: ps-q-2010
  lesson: ps-bivariate-normal
  topic: Order statistics
  stem: 'Four iid observations come from Uniform(0, 10). What is the expected value of the largest one?'
  choices: ['$7.5$', '$10$', '$8$', '$2$']
  answer: 2
  explanation: |-
    $E[X_{(n)}] = \dfrac{n}{n+1}\theta = \tfrac45(10) = 8$. The maximum never reaches 10, and $\tfrac{n-1}{n}\theta = 7.5$ is the wrong
    fraction; 2 is the expected minimum, $\theta/(n+1)$.

- id: ps-q-2011
  lesson: ps-bivariate-normal
  topic: Order statistics
  stem: 'A parallel system has three independent components with exponential lifetimes of mean 100 hours. It works while at least one component works. Find the probability it is still working at 100 hours.'
  choices: ['$0.0498$', '$0.3679$', '$0.2526$', '$0.7474$']
  answer: 3
  explanation: |-
    It fails by 100 hours only if all three do: $(1 - e^{-1})^3 \approx 0.2526$. So it survives with probability
    $1 - 0.2526 = 0.7474$. $e^{-3} \approx 0.0498$ is the series-system survival, and $e^{-1}$ is one component's.

- id: ps-q-2012
  lesson: ps-bivariate-normal
  module_quiz: true
  topic: Order statistics
  stem: 'Five iid Uniform(0, 1) values are sorted. What is the expected value of the second smallest, $X_{(2)}$?'
  choices: ['$\tfrac25$', '$\tfrac13$', '$\tfrac15$', '$\tfrac12$']
  answer: 1
  explanation: |-
    For Uniform(0, 1), $X_{(k)}$ has a beta distribution with mean $\dfrac{k}{n+1} = \dfrac{2}{6} = \dfrac13$: the five points cut the interval
    into six gaps of equal average length. $\tfrac25$ uses $k/n$.
