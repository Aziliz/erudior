- id: ps-q-3201
  lesson: ps-linear-regression
  module_quiz: true
  topic: Simple linear regression
  stem: 'Data give $\bar x = 5$, $\bar y = 20$, $S_{xx} = 40$ and $S_{xy} = 84$. What is the least squares line?'
  choices:
    - '$\hat y = 2.1 + 9.5x$'
    - '$\hat y = 9.5 + 2.1x$'
    - '$\hat y = 10.5 + 1.9x$'
    - '$\hat y = 20 + 2.1x$'
  answer: 1
  explanation: |-
    $b_1 = S_{xy}/S_{xx} = 84/40 = 2.1$ and $b_0 = \bar y - b_1\bar x = 20 - 2.1(5) = 9.5$. Using $\bar y$ as the intercept ignores that the line passes through $(\bar x, \bar y)$, not $(0, \bar y)$.

- id: ps-q-3202
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'You can choose the 10 $x$ values at which to measure $y$ (any values in $[0, 10]$). To estimate the slope most precisely, assuming the line is correct, you should'
  choices:
    - 'space the points evenly from 4 to 6'
    - 'put half the points at $x = 0$ and half at $x = 10$'
    - 'put the points at random $x$ values in $[0, 10]$'
    - 'put all the points at $x = 5$'
  answer: 1
  explanation: |-
    $\operatorname{Var}(b_1) = \sigma^2/S_{xx}$, so maximize $S_{xx} = \sum(x_i - \bar x)^2$ by spreading the $x$ values as far as possible. All points at one $x$ gives $S_{xx} = 0$ and no slope estimate. (In practice you would keep some middle points to check linearity.)

- id: ps-q-3203
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'In simple linear regression with $n$ points, why is the residual variance estimated by $\text{SSE}/(n-2)$?'
  choices:
    - 'Because one degree of freedom is lost for $\bar x$ and one for $\bar y$'
    - 'Because $n - 2$ is the number of residuals that are nonzero'
    - 'Two parameters, $\beta_0$ and $\beta_1$, are estimated before the residuals are formed, and this makes $s^2$ unbiased'
    - 'To make $s^2$ the maximum likelihood estimator of $\sigma^2$'
  answer: 2
  explanation: |-
    The residuals satisfy two linear constraints ($\sum e_i = 0$ and $\sum x_ie_i = 0$), and $\text{SSE}/\sigma^2 \sim \chi^2_{n-2}$, so $E(\text{SSE}) = (n-2)\sigma^2$. The MLE divides by $n$ and is biased. The $x_i$ are fixed, so nothing is estimated for $\bar x$.

- id: ps-q-3204
  lesson: ps-linear-regression
  module_quiz: true
  topic: Simple linear regression
  stem: 'A regression on $n = 11$ points has $b_1 = 0.9$, $\text{SSE} = 18$ and $S_{xx} = 50$. What is the $t$ statistic for $H_0: \beta_1 = 0$?'
  choices:
    - '$3.18$'
    - '$4.74$'
    - '$0.64$'
    - '$4.50$'
  answer: 3
  explanation: |-
    $s^2 = 18/9 = 2$, $s = 1.414$, $\text{SE}(b_1) = 1.414/\sqrt{50} = 0.2$, so $t = 0.9/0.2 = 4.50$ on 9 df. 4.74 divides SSE by $n - 1$, 3.18 uses $s^2$ in place of $s$, and 0.64 forgets $\sqrt{S_{xx}}$.

- id: ps-q-3205
  lesson: ps-linear-regression
  module_quiz: true
  topic: Simple linear regression
  stem: 'At the same $x_0$, why is a 95% prediction interval for a new $Y$ wider than the 95% confidence interval for the mean response?'
  choices:
    - 'It is computed at $\bar x$ rather than at $x_0$'
    - 'It uses a larger $t$ critical value with fewer degrees of freedom'
    - 'It accounts for uncertainty in $\bar x$'
    - 'It must also cover the new observation''s own error $\varepsilon_0$, adding $\sigma^2$ to the variance'
  answer: 3
  explanation: |-
    $\operatorname{Var}(Y_0 - \hat y_0) = \sigma^2 + \sigma^2[1/n + (x_0 - \bar x)^2/S_{xx}]$, because $\varepsilon_0$ is independent of the data. Both intervals use the same $t_{n-2}$ value; the extra 1 under the root makes the difference.

- id: ps-q-3206
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'A regression has $\text{SSE} = 12$ and $\text{SST} = 48$. What is $r^2$?'
  choices:
    - '$0.75$'
    - '$0.87$'
    - '$0.25$'
    - '$4.00$'
  answer: 0
  explanation: |-
    $r^2 = 1 - \text{SSE}/\text{SST} = 1 - 0.25 = 0.75$: the line explains 75% of the variation in $y$. 0.25 is the unexplained fraction, and 0.87 is $\lvert r\rvert$.

- id: ps-q-3207
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'A regression with $n = 16$ has $s = 2$. At $x_0 = \bar x$, what are the standard errors for estimating the mean response and for predicting a new observation?'
  choices:
    - '$0.13$ and $2.00$'
    - '$0.50$ and $2.06$'
    - '$0.50$ and $2.00$'
    - '$2.00$ and $2.06$'
  answer: 1
  explanation: |-
    At $x_0 = \bar x$: mean response $s\sqrt{1/n} = 2/4 = 0.50$; new observation $s\sqrt{1 + 1/n} = 2\sqrt{1.0625} = 2.06$. 0.13 divides $s$ by $n$ instead of $\sqrt n$. The prediction standard error can never be smaller than $s$, however large $n$ is.

- id: ps-q-3208
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'A residual plot shows residuals spreading out in a funnel as $x$ increases. Which assumption is in doubt?'
  choices:
    - 'Normality of the $x$ values'
    - 'Constant error variance'
    - 'Linearity of the mean'
    - 'Independence of $x$ and $y$'
  answer: 1
  explanation: |-
    A funnel means the scatter about the line grows with $x$, so $\operatorname{Var}(\varepsilon_i)$ is not constant and the standard errors are wrong. A curved pattern would signal nonlinearity. The $x_i$ are treated as fixed, so they need no distribution.

- id: ps-q-3209
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'Which of the following is guaranteed by the least squares normal equations?'
  choices:
    - 'Each residual has the same sign as $x_i - \bar x$'
    - 'The residuals sum to zero'
    - 'The residuals sum to zero in absolute value'
    - '$\sum y_ie_i = 0$'
  answer: 1
  explanation: |-
    The equations are $\sum e_i = 0$ and $\sum x_ie_i = 0$ (hence also $\sum\hat y_ie_i = 0$). $\sum\lvert e_i\rvert = 0$ would mean a perfect fit, and $\sum y_ie_i = \sum e_i^2 = \text{SSE}$, which is not zero in general.

- id: ps-q-3210
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'A regression on $n = 14$ points gives $b_1 = 1.25$ with standard error $0.31$. Find a 95% confidence interval for $\beta_1$.'
  choices:
    - '$(0.585,\ 1.915)$'
    - '$(0.580,\ 1.920)$'
    - '$(0.642,\ 1.858)$'
    - '$(0.575,\ 1.925)$'
  answer: 3
  explanation: |-
    df $= n - 2 = 12$, $t_{0.025,12} = 2.179$: $1.25 \pm 2.179(0.31) = 1.25 \pm 0.675$. The others use $z = 1.96$, 13 df and 14 df.

- id: ps-q-3211
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'Writing $b_1 = \sum c_iY_i$ with $c_i = (x_i - \bar x)/S_{xx}$, which facts give $E(b_1) = \beta_1$?'
  choices:
    - '$\sum c_i = 0$ and $\sum c_ix_i = 1$'
    - '$\sum c_i = 1$ and $\sum c_ix_i = 0$'
    - '$\sum c_i^2 = 1/S_{xx}$'
    - 'The $Y_i$ are normally distributed'
  answer: 0
  explanation: |-
    $E(b_1) = \sum c_i(\beta_0 + \beta_1x_i) = \beta_0\sum c_i + \beta_1\sum c_ix_i = 0 + \beta_1$. $\sum c_i^2 = 1/S_{xx}$ gives the variance; normality is not needed for unbiasedness.

- id: ps-q-3212
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'The $t$ statistic for $H_0: \beta_1 = 0$ is $3$ in a regression on $n = 20$ points. What is the regression $F$ statistic $\text{SSR}/s^2$?'
  choices:
    - '$F = 9$ on $(1, 18)$ df'
    - '$F = 3$ on $(1, 18)$ df'
    - '$F = 1.73$ on $(1, 19)$ df'
    - '$F = 9$ on $(2, 18)$ df'
  answer: 0
  explanation: |-
    $\text{SSR} = b_1^2S_{xx}$, so $F = b_1^2S_{xx}/s^2 = t^2 = 9$, with 1 and $n - 2 = 18$ df. The two tests are equivalent.

- id: ps-q-3213
  lesson: ps-linear-regression
  topic: Simple linear regression
  stem: 'A fit with $n = 20$ has $\hat y_0 = 50$ at $x_0 = 15$, $s = 4$, $\bar x = 10$ and $S_{xx} = 200$. Find a 95% prediction interval for a new $Y$ at $x_0$.'
  choices:
    - '$(40.89,\ 59.11)$'
    - '$(41.50,\ 58.50)$'
    - '$(46.48,\ 53.52)$'
    - '$(41.39,\ 58.61)$'
  answer: 0
  explanation: |-
    $\sqrt{1 + 1/20 + 25/200} = \sqrt{1.175} = 1.084$ and $t_{0.025,18} = 2.101$: margin $= 2.101(4)(1.084) = 9.11$. $(46.48, 53.52)$ is the interval for the mean response; $(41.39, 58.61)$ drops the $(x_0 - \bar x)^2$ term; $(41.50, 58.50)$ uses $z = 1.96$.

- id: ps-q-3301
  lesson: ps-anova
  module_quiz: true
  topic: One-way ANOVA
  stem: 'Four group means are compared by running all 6 pairwise tests at $\alpha = 0.05$. If the tests were independent and all means equal, what is the chance of at least one false rejection?'
  choices:
    - '$0.300$'
    - '$0.185$'
    - '$0.050$'
    - '$0.265$'
  answer: 3
  explanation: |-
    $1 - 0.95^6 = 1 - 0.735 = 0.265$. 0.300 is the Bonferroni upper bound $6(0.05)$; 0.185 is $1 - 0.95^4$, counting groups instead of pairs.

- id: ps-q-3302
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'A one-way ANOVA compares $k = 5$ groups with $N = 30$ observations in total. What are the degrees of freedom of $F$?'
  choices:
    - '$(5,\ 30)$'
    - '$(4,\ 29)$'
    - '$(4,\ 25)$'
    - '$(25,\ 4)$'
  answer: 2
  explanation: |-
    Numerator (treatments) $k - 1 = 4$; denominator (error) $N - k = 25$. They add to the total df $N - 1 = 29$.

- id: ps-q-3303
  lesson: ps-anova
  module_quiz: true
  topic: One-way ANOVA
  stem: 'In one-way ANOVA, which statement about the mean squares is correct?'
  choices:
    - 'MSTr estimates $\sigma^2$ whether or not $H_0$ holds; MSE only under $H_0$'
    - 'MSE estimates $\sigma^2$ whether or not $H_0$ holds; MSTr estimates $\sigma^2$ only under $H_0$'
    - 'Both estimate $\sigma^2$ only under $H_0$'
    - 'Neither depends on whether $H_0$ holds'
  answer: 1
  explanation: |-
    $E(\text{MSE}) = \sigma^2$ always, since it pools within-group variances. $E(\text{MSTr}) = \sigma^2 + \sum n_i(\mu_i - \bar\mu)^2/(k-1)$, which exceeds $\sigma^2$ when the means differ. That is why large $F$ is evidence against $H_0$.

- id: ps-q-3304
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'An ANOVA with $k = 4$ groups and $N = 40$ has $\text{SSTr} = 60$ and $\text{SSE} = 180$. Find $F$ and its p-value.'
  choices:
    - '$F = 0.33$; $p \approx 0.80$'
    - '$F = 4.00$; $p \approx 0.015$'
    - '$F = 4.00$; $p \approx 0.030$'
    - '$F = 12.0$; $p < 0.001$'
  answer: 1
  explanation: |-
    $\text{MSTr} = 60/3 = 20$, $\text{MSE} = 180/36 = 5$, $F = 4.00$ on (3, 36) df; $P(F_{3,36} \ge 4) \approx 0.015$. 0.33 is $\text{SSTr}/\text{SSE}$ without df; 0.030 doubles the upper tail, but the $F$ test is one-sided; 12 divides SSTr itself by MSE instead of MSTr.

- id: ps-q-3305
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'Why does the cross term vanish in $\text{SST} = \text{SSTr} + \text{SSE}$?'
  choices:
    - 'The errors $\varepsilon_{ij}$ have mean zero'
    - 'The group means are independent of the group variances'
    - 'The grand mean equals the average of the group means'
    - 'Within each group, the deviations $Y_{ij} - \bar Y_{i\cdot}$ sum to zero'
  answer: 3
  explanation: |-
    The cross term is $2\sum_i(\bar Y_{i\cdot} - \bar Y_{\cdot\cdot})\sum_j(Y_{ij} - \bar Y_{i\cdot})$, and each inner sum is zero. It is an algebraic identity that holds for any data, not a probabilistic fact.

- id: ps-q-3306
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'Groups of sizes 4, 6 and 5 have means 10, 13 and 16. What is SSTr?'
  choices:
    - '$40.2$'
    - '$81.0$'
    - '$80.4$'
    - '$18.1$'
  answer: 2
  explanation: |-
    Grand mean $= (40 + 78 + 80)/15 = 13.2$. $\text{SSTr} = 4(3.2)^2 + 6(0.2)^2 + 5(2.8)^2 = 40.96 + 0.24 + 39.2 = 80.4$. 81.0 uses the unweighted grand mean 13; 18.1 drops the $n_i$; 40.2 is MSTr.

- id: ps-q-3307
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'A one-way ANOVA rejects $H_0$ at the 1% level. What may you conclude?'
  choices:
    - 'All the population means are different'
    - 'The population variances are not all equal'
    - 'At least one population mean differs from the others'
    - 'The group with the largest sample mean has a significantly larger mean than every other group'
  answer: 2
  explanation: |-
    $H_1$ is "not all means are equal." Which means differ needs a follow-up multiple comparison procedure such as Tukey or Bonferroni.

- id: ps-q-3308
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'With $k = 2$ groups, how does the ANOVA $F$ statistic relate to the pooled two-sample $t$ statistic?'
  choices:
    - '$F = 2t$'
    - '$F = t$'
    - '$F = t^2$, and the two tests give the same p-value'
    - '$F = \sqrt{\lvert t\rvert}$'
  answer: 2
  explanation: |-
    With two groups, $\text{SSTr} = \frac{n_1n_2}{N}(\bar y_1 - \bar y_2)^2$ and $\text{MSE} = s_p^2$, so $F = t^2$ on (1, $N - 2$) df, and $P(F_{1,\nu} \ge t^2) = P(\lvert t_\nu\rvert \ge \lvert t\rvert)$.

- id: ps-q-3309
  lesson: ps-anova
  module_quiz: true
  topic: One-way ANOVA
  stem: 'Five groups are compared pairwise with Bonferroni''s method to keep the familywise error rate at 0.05. What level does each comparison use?'
  choices:
    - '$0.05$'
    - '$0.005$'
    - '$0.01$'
    - '$0.0125$'
  answer: 1
  explanation: |-
    There are $\binom 52 = 10$ pairs, so each test uses $0.05/10 = 0.005$. 0.01 divides by the number of groups, and 0.0125 by 4.

- id: ps-q-3310
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'Three groups have sample standard deviations 2.1, 3.0 and 4.6, with unequal group sizes. Is the ANOVA equal-variance assumption comfortable?'
  choices:
    - 'No: the s.d.''s must be exactly equal'
    - 'Yes: the s.d.''s are all positive'
    - 'Yes: the rule only applies to the means'
    - 'No: the largest s.d. is more than twice the smallest'
  answer: 3
  explanation: |-
    $4.6/2.1 = 2.19 > 2$, failing the usual rule of thumb, and unequal group sizes make the $F$ test more sensitive to unequal variances. Exact equality is never required.

- id: ps-q-3311
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'Three groups of 6 have $\text{MSE} = 8$. Using Bonferroni for all 3 pairs (familywise 0.05; $t_{0.05/6,\,15} = 2.694$), how far apart must two group means be to differ significantly?'
  choices:
    - 'More than $7.62$'
    - 'More than $2.69$'
    - 'More than $4.40$'
    - 'More than $3.48$'
  answer: 2
  explanation: |-
    Margin $= t\sqrt{\text{MSE}(1/6 + 1/6)} = 2.694\sqrt{8/3} = 2.694(1.633) = 4.40$. 3.48 uses the unadjusted $t_{0.025,15} = 2.131$, 2.69 forgets the standard error, and 7.62 uses $\sqrt{\text{MSE}}$ without the $1/n_i$ terms.

- id: ps-q-3312
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'Three groups of 5 observations have sample standard deviations 2, 3 and 4. What are SSE and MSE?'
  choices:
    - '$\text{SSE} = 116$, $\text{MSE} = 9.67$'
    - '$\text{SSE} = 116$, $\text{MSE} = 38.67$'
    - '$\text{SSE} = 29$, $\text{MSE} = 2.42$'
    - '$\text{SSE} = 145$, $\text{MSE} = 12.08$'
  answer: 0
  explanation: |-
    $\text{SSE} = \sum(n_i - 1)s_i^2 = 4(4 + 9 + 16) = 116$ on $N - k = 12$ df, so $\text{MSE} = 9.67$. 29 forgets the factor $n_i - 1$; 145 uses $n_i$; 38.67 divides by $k$.

- id: ps-q-3313
  lesson: ps-anova
  topic: One-way ANOVA
  stem: 'For all pairwise comparisons among $k$ equal-sized groups, how does Tukey''s method compare with Bonferroni''s?'
  choices:
    - 'Both control the familywise error rate; Tukey''s intervals are shorter because it uses the distribution of the largest difference'
    - 'Tukey needs no equal-variance assumption, while Bonferroni does'
    - 'Tukey controls each comparison at $\alpha$, so it gives more false alarms than Bonferroni'
    - 'Bonferroni''s intervals are always shorter because it divides $\alpha$ by the number of comparisons'
  answer: 0
  explanation: |-
    Bonferroni uses the union bound, which is conservative when there are many comparisons. Tukey's method is built on the exact distribution of the largest standardized difference among the means, so it achieves familywise level $\alpha$ with narrower intervals. Both use the pooled MSE and so both assume equal variances.

- id: ps-q-3401
  lesson: ps-nonparametric
  module_quiz: true
  topic: Nonparametric tests
  stem: 'Of 12 nonzero paired differences, 10 are positive. What is the one-sided sign test p-value for $H_1$: median difference $> 0$?'
  choices:
    - '$0.0161$'
    - '$0.0032$'
    - '$0.0193$'
    - '$0.0386$'
  answer: 2
  explanation: |-
    $B \sim \text{Bin}(12, 1/2)$ under $H_0$: $P(B \ge 10) = (66 + 12 + 1)/4096 = 79/4096 = 0.0193$. 0.0161 is only $P(B = 10)$, 0.0386 is two-sided, and 0.0032 is $P(B \ge 11)$.

- id: ps-q-3402
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Fifteen paired differences include 2 zeros, 10 positives and 3 negatives. What is the one-sided sign test p-value?'
  choices:
    - '$0.1509$'
    - '$0.0923$'
    - '$0.0461$'
    - '$0.0349$'
  answer: 2
  explanation: |-
    Drop the zeros: $n = 13$, $B = 10$. $P(B \ge 10) = (286 + 78 + 13 + 1)/8192 = 0.0461$. 0.1509 keeps $n = 15$ (counting zeros as negatives), 0.0349 is only $P(B = 10)$, and 0.0923 is two-sided.

- id: ps-q-3403
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Paired differences are $2.1, -0.8, 3.5, 1.4, -2.7, 4.2$. What is the Wilcoxon signed-rank statistic $W^+$?'
  choices:
    - '$16$'
    - '$5$'
    - '$21$'
    - '$13$'
  answer: 0
  explanation: |-
    Ranks of $\lvert d\rvert$: 0.8 (1), 1.4 (2), 2.1 (3), 2.7 (4), 3.5 (5), 4.2 (6). Positive differences have ranks 3, 5, 2, 6, so $W^+ = 16$, and $W^- = 1 + 4 = 5$. Check: $16 + 5 = 21 = 6 \cdot 7/2$.

- id: ps-q-3404
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Under $H_0$, what are the mean and variance of the signed-rank statistic $W^+$ for $n = 20$?'
  choices:
    - 'Mean 105, variance 26.8'
    - 'Mean 105, variance 717.5'
    - 'Mean 105, variance 2870'
    - 'Mean 210, variance 717.5'
  answer: 1
  explanation: |-
    $E = n(n+1)/4 = 420/4 = 105$; $\operatorname{Var} = n(n+1)(2n+1)/24 = 20(21)(41)/24 = 717.5$. 210 is the total of all ranks, $n(n+1)/2$; 2870 is $\sum k^2$ without the factor $1/4$; 26.8 is the standard deviation.

- id: ps-q-3405
  lesson: ps-nonparametric
  module_quiz: true
  topic: Nonparametric tests
  stem: 'Sample A: 12, 19, 25. Sample B: 8, 15, 21, 30. What are the rank sum $W$ of sample A and the Mann–Whitney $U = W - m(m+1)/2$?'
  choices:
    - '$W = 12$, $U = 9$'
    - '$W = 15$, $U = 9$'
    - '$W = 16$, $U = 10$'
    - '$W = 12$, $U = 6$'
  answer: 3
  explanation: |-
    Combined order 8, 12, 15, 19, 21, 25, 30 has ranks 1–7; A has ranks 2, 4, 6, so $W = 12$ (exactly its null mean $3 \cdot 8/2 = 12$), and $U = 12 - 6 = 6$: six of the 12 (A, B) pairs have A larger. $W = 16$ is B's rank sum.

- id: ps-q-3406
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'For the rank-sum test with $m = 8$ and $n = 10$, what are $E(W)$ and $\operatorname{Var}(W)$ under $H_0$ ($W$ = rank sum of the first sample)?'
  choices:
    - '$95$ and $126.7$'
    - '$76$ and $215.3$'
    - '$72$ and $126.7$'
    - '$76$ and $126.7$'
  answer: 3
  explanation: |-
    $N = 18$: $E(W) = m(N+1)/2 = 8(19)/2 = 76$; $\operatorname{Var}(W) = mn(N+1)/12 = 80(19)/12 = 126.7$. 215.3 is $m(N^2 - 1)/12$, which treats the ranks as drawn with replacement; 72 uses $N$ in place of $N + 1$; 95 is the second sample's mean $n(N+1)/2$.

- id: ps-q-3407
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'The Mann–Whitney statistic $U$ (for samples $X$ and $Y$) equals'
  choices:
    - 'the largest rank among the $X$''s'
    - 'the number of pairs $(X_i, Y_j)$ with $X_i > Y_j$'
    - 'the difference between the two rank sums'
    - 'the number of $X_i$ above the combined median'
  answer: 1
  explanation: |-
    $U = W - m(m+1)/2$ counts the pairs in which the $X$ value exceeds the $Y$ value, so $U/(mn)$ estimates $P(X > Y)$, which is $1/2$ under $H_0$.

- id: ps-q-3408
  lesson: ps-nonparametric
  module_quiz: true
  topic: Nonparametric tests
  stem: 'The asymptotic relative efficiency of the Wilcoxon tests relative to the $t$ tests is about 0.955 for normal data. What does this mean?'
  choices:
    - 'Wilcoxon is 4.5% more powerful than $t$ for normal data'
    - 'Wilcoxon has 95.5% of the Type I error rate of $t$'
    - 'For equal power, Wilcoxon needs about 100 observations where $t$ needs about 95.5'
    - 'Wilcoxon rejects in 95.5% of the samples where $t$ rejects'
  answer: 2
  explanation: |-
    ARE is a ratio of sample sizes giving equal power in large samples: $n_t/n_W \approx 0.955$. So little is lost under normality, and for heavy-tailed data the ratio can exceed 1.

- id: ps-q-3409
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Which assumption does the Wilcoxon signed-rank test need that the sign test does not?'
  choices:
    - 'The differences come from a distribution symmetric about its median'
    - 'The sample size is at least 30'
    - 'The differences are independent'
    - 'The differences are normally distributed'
  answer: 0
  explanation: |-
    Symmetry makes each sign independent of $\lvert D_i\rvert$ and equally likely $\pm$, which gives the null distribution of $W^+$. Both tests need independence and continuity; neither needs normality or large $n$.

- id: ps-q-3410
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Two groups of 4 are compared by a permutation test of the difference in means. The observed split gives the largest difference of all possible relabelings (no ties). What is the one-sided p-value?'
  choices:
    - '$1/70$'
    - '$1/256$'
    - '$1/16$'
    - '$1/8$'
  answer: 0
  explanation: |-
    Under $H_0$ every choice of which 4 of the 8 values are labeled group 1 is equally likely: $\binom 84 = 70$ relabelings. Only the observed one is as extreme, so $p = 1/70 = 0.014$.

- id: ps-q-3411
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Which rank-based test is the alternative to one-way ANOVA for $k$ independent groups?'
  choices:
    - 'The Kruskal–Wallis test'
    - 'The Wilcoxon signed-rank test'
    - 'The sign test'
    - 'The chi-square goodness-of-fit test'
  answer: 0
  explanation: |-
    Kruskal–Wallis ranks all $N$ observations together and compares the groups' average ranks; its statistic is approximately $\chi^2_{k-1}$. The sign and signed-rank tests are for one sample or paired data.

- id: ps-q-3412
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'Rank-sum test with $m = 10$, $n = 12$ and $W = 140$ (rank sum of the first sample). Using the normal approximation without continuity correction, what is the one-sided p-value for an upward shift?'
  choices:
    - '$0.025$'
    - '$0.006$'
    - '$0.099$'
    - '$0.050$'
  answer: 3
  explanation: |-
    $E(W) = 10(23)/2 = 115$, $\operatorname{Var}(W) = 10(12)(23)/12 = 230$, $z = 25/15.17 = 1.65$, $p = P(Z \ge 1.65) = 0.050$. 0.099 is two-sided.

- id: ps-q-3413
  lesson: ps-nonparametric
  topic: Nonparametric tests
  stem: 'In which situation is a rank-based test most clearly preferable to a $t$ test?'
  choices:
    - 'A sample of 200 from a roughly symmetric population'
    - 'Any sample in which the $t$ test gave a large p-value'
    - 'A sample of 9 with one extreme outlier and strong skew'
    - 'A sample of 25 from a normal population with known $\sigma$'
  answer: 2
  explanation: |-
    Small, skewed samples with outliers are where $t$ procedures are unreliable and ranks are robust. With large or normal samples the $t$ test is valid and slightly more efficient. Switching tests after seeing a p-value is data dredging.
