# Round 2 questions for module ps-m1 (probability foundations): new question types for the
# core lessons (q01–q20) and the two honors lessons (h01–h31).

# ---------- Lesson 01: sample spaces, events, axioms ----------
- id: ps-m1-r2-q01
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  type: text
  stem: 'Events $A$, $B$, $C$ each have probability 0.4, each pair has intersection probability 0.15, and $P(A \cap B \cap C) = 0.05$. Then $P(A \cup B \cup C) =$ ___. Give a decimal or fraction.'
  accept: ['0.8', '4/5']
  explanation: |-
    Inclusion–exclusion: add the singles, subtract the pairs, add the triple:
    $3(0.4) - 3(0.15) + 0.05 = 1.2 - 0.45 + 0.05 = 0.8$.
    Stopping after the pairs gives 0.75, which leaves out the triple region.

- id: ps-m1-r2-q02
  lesson: ps-axioms
  topic: Probability axioms
  type: order
  stem: 'Put the steps of the proof of the complement rule $P(A^c) = 1 - P(A)$ in order.'
  items:
    - '$A$ and $A^c$ are disjoint, and $A \cup A^c = S$'
    - 'Additivity: $P(A \cup A^c) = P(A) + P(A^c)$'
    - 'Axiom 2: $P(A) + P(A^c) = P(S) = 1$'
    - 'Subtract: $P(A^c) = 1 - P(A)$'
  explanation: |-
    Additivity may only be used once we know the two events are disjoint, so that fact comes
    first. Additivity turns $P(A \cup A^c)$ into a sum; since the union is $S$, axiom 2 says the
    sum is 1; and subtracting $P(A)$ gives the rule.

- id: ps-m1-r2-q03
  lesson: ps-axioms
  topic: Sample spaces and events
  type: match
  stem: 'Match each description to the event it describes.'
  pairs:
    - ['Neither $A$ nor $B$ occurs', 'Aᶜ ∩ Bᶜ']
    - ['$A$ occurs but $B$ does not', 'A ∩ Bᶜ']
    - ['Not both $A$ and $B$ occur', 'Aᶜ ∪ Bᶜ']
    - ['At least one of $A$ and $B$ occurs', 'A ∪ B']
  distractors: ['A ∩ B', 'Aᶜ ∩ B']
  explanation: |-
    "At least one" is the union $A \cup B$. "Neither" is its complement, which De Morgan's law
    writes as $A^c \cap B^c$. "Not both" is the complement of $A \cap B$, which is
    $A^c \cup B^c$. "$A$ but not $B$" is the difference $A \cap B^c$.

- id: ps-m1-r2-q04
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  stem: 'Which statements are true for every pair of events $A$ and $B$? Select all that apply.'
  choices: ['$P(A \cap B) \le P(A)$', '$P(A \cup B) \le P(A) + P(B)$', '$P(A \cup B) = P(A) + P(B)$', '$P(A \cap B) = P(A)\,P(B)$', '$P(A \cap B) \ge P(A) + P(B) - 1$']
  answer: [0, 1, 4]
  explanation: |-
    $A \cap B \subseteq A$, so monotonicity gives the first. The union bound is the second, and the
    Bonferroni inequality (from $P(A \cup B) \le 1$) is the last. The plain sum
    $P(A) + P(B)$ equals $P(A \cup B)$ only for disjoint events, and the product rule holds only
    for independent events.

- id: ps-m1-r2-q05
  lesson: ps-axioms
  topic: Sample spaces and events
  type: label
  stem: 'Name each numbered region of the Venn diagram of events $A$, $B$ and $C$.'
  image: {src: images/ps-m1-venn3-blank.svg, alt: 'Three overlapping circles A (top left), B (top right) and C (bottom) inside a rectangle S. Marker 1 is in the center, inside all three circles. Marker 2 is where only A and B overlap, at the top. Marker 3 is where only A and C overlap, at the lower left. Marker 4 is in the part of C outside A and B. Marker 5 is in the rectangle outside all three circles.'}
  labels:
    - {x: 50.0, y: 48.5, text: 'A ∩ B ∩ C'}
    - {x: 50.0, y: 28.9, text: 'A ∩ B ∩ Cᶜ'}
    - {x: 37.0, y: 57.0, text: 'A ∩ Bᶜ ∩ C'}
    - {x: 50.0, y: 80.9, text: 'Aᶜ ∩ Bᶜ ∩ C'}
    - {x: 83.3, y: 89.4, text: 'Aᶜ ∩ Bᶜ ∩ Cᶜ'}
  distractors: ['Aᶜ ∩ B ∩ C', 'A ∩ Bᶜ ∩ Cᶜ']
  explanation: |-
    For each region, ask which circles contain it: an event appears plain if the region is inside
    its circle and with a complement if it is outside. Region 1 is inside all three; region 2 is
    inside $A$ and $B$ but not $C$; region 3 is inside $A$ and $C$ but not $B$; region 4 is only in
    $C$; region 5 is outside every circle, so it is $(A \cup B \cup C)^c = A^c \cap B^c \cap C^c$.

# ---------- Lesson 02: counting ----------
- id: ps-m1-r2-q06
  lesson: ps-counting
  module_quiz: true
  topic: Counting methods
  type: text
  stem: 'From 9 runners, 4 are chosen and assigned to the four legs of a relay (first, second, third, anchor). This can be done in ___ ways. If instead 4 runners are simply chosen as a group, with no legs assigned, there are ___ possible groups.'
  accept:
    - ['3024']
    - ['126']
  explanation: |-
    Assigning legs makes order matter: $9 \cdot 8 \cdot 7 \cdot 6 = 3024$. An unordered group is
    $\binom94 = \dfrac{3024}{4!} = 126$, because each group of 4 can be put in order in
    $4! = 24$ ways.

- id: ps-m1-r2-q07
  lesson: ps-counting
  topic: Counting methods
  type: match
  stem: 'Match each situation to its count.'
  pairs:
    - ['A 5-letter code from 26 letters, repeats allowed', '26^5']
    - ['Gold, silver and bronze winners among 26 runners', '26 × 25 × 24']
    - ['A 3-person committee from 26 people', 'C(26, 3)']
    - ['Distinct arrangements of the letters of BANANA', '6! / (3! 2!)']
  distractors: ['5^26', '6! / 3!']
  explanation: |-
    Order matters with repeats allowed: $26^5$. Ordered without repeats (distinct medals):
    $26 \cdot 25 \cdot 24$. Unordered: $\binom{26}{3}$. BANANA has 6 letters with 3 A's and
    2 N's, so $6!/(3!\,2!) = 60$; dividing only by $3!$ forgets the identical N's.

- id: ps-m1-r2-q08
  lesson: ps-counting
  topic: Counting methods
  stem: 'In which situations does the order of the selected items matter? Select all that apply.'
  choices: ['Electing a president, treasurer and secretary from a club', 'Dealing a 5-card hand', 'Setting a 4-digit PIN', 'Choosing 6 lottery numbers from 49', 'Recording the first three finishers of a race in order']
  answer: [0, 2, 4]
  explanation: |-
    Order matters when positions or roles differ: distinct offices, the digits of a PIN (1234 and
    4321 are different PINs), and finishing places. A card hand and a set of lottery numbers are
    the same no matter the order in which they were drawn.

- id: ps-m1-r2-q09
  lesson: ps-counting
  topic: Counting methods
  type: order
  stem: 'Put these counts in order from smallest to largest.'
  items:
    - '$\binom{8}{3}$'
    - '$8 \cdot 7 \cdot 6$'
    - '$8^3$'
    - '$3^8$'
  explanation: |-
    $\binom83 = 56$, $8 \cdot 7 \cdot 6 = 336$ (which is $3! \times 56$), $8^3 = 512$ (repeats
    allowed adds more), and $3^8 = 6561$.

- id: ps-m1-r2-q10
  lesson: ps-counting
  module_quiz: true
  topic: Birthday and matching problems
  type: text
  stem: 'Three letters are put at random into their three addressed envelopes, one per envelope. The probability that no letter is in its own envelope is ___. Give an exact fraction.'
  accept: ['1/3', '2/6']
  explanation: |-
    Of the $3! = 6$ equally likely assignments, only 2 move every letter (the two cyclic shifts),
    so the probability is $2/6 = 1/3$. The matching formula agrees:
    $P(\text{some match}) = 1 - \tfrac12 + \tfrac16 = \tfrac23$, and $1 - \tfrac23 = \tfrac13$.

# ---------- Lesson 03: conditional probability and Bayes ----------
- id: ps-m1-r2-q11
  lesson: ps-conditional
  module_quiz: true
  topic: Bayes' theorem
  type: text
  stem: 'Of a supplier''s parts, 2% are defective. An inspection flags 90% of defective parts and 10% of good parts. Then $P(\text{flagged}) =$ ___ and $P(\text{defective and flagged}) =$ ___. Give decimals.'
  accept:
    - ['0.116']
    - ['0.018']
  explanation: |-
    The path for defective and flagged is $0.02 \times 0.90 = 0.018$. The path for good and
    flagged is $0.98 \times 0.10 = 0.098$. Total probability: $P(\text{flagged}) = 0.018 + 0.098 = 0.116$.
    (So $P(\text{defective} \mid \text{flagged}) = 0.018/0.116 \approx 0.155$.)

- id: ps-m1-r2-q12
  lesson: ps-conditional
  topic: Bayes' theorem
  type: order
  stem: 'Put the steps for finding a posterior probability $P(B_j \mid A)$ in order.'
  items:
    - 'Draw the tree, with the priors on the first branches and the likelihoods on the second'
    - 'Multiply along each path: $P(B_i)\,P(A \mid B_i)$'
    - 'Add the paths that end in $A$ to get $P(A)$'
    - 'Divide the path through $B_j$ by $P(A)$'
  explanation: |-
    Each step uses the one before it: the path products need the branch probabilities, the total
    $P(A)$ is the sum of the path products, and Bayes' theorem divides one path by that total.

- id: ps-m1-r2-q13
  lesson: ps-conditional
  topic: Bayes' theorem
  type: match
  stem: 'Scenario $B$ and its complement form a partition, and $A$ is the evidence. Match each quantity to its notation.'
  pairs:
    - ['Prior probability of $B$', 'P(B)']
    - ['Likelihood of the evidence under $B$', 'P(A | B)']
    - ['Posterior probability of $B$', 'P(B | A)']
    - ['Probability of the tree path through $B$ that ends in $A$', 'P(A ∩ B)']
  distractors: ['P(A)', 'P(Bᶜ | A)']
  explanation: |-
    The prior is how likely $B$ was before the evidence, $P(B)$. The likelihood is how likely the
    evidence is if $B$ holds, $P(A \mid B)$. The posterior is the updated probability of $B$,
    $P(B \mid A)$. A path's probability is the product $P(B)P(A \mid B) = P(A \cap B)$.

- id: ps-m1-r2-q14
  lesson: ps-conditional
  topic: Conditional probability
  stem: 'For events with positive probabilities, which expressions always equal $P(A \cap B)$? Select all that apply.'
  choices: ['$P(A)\,P(B \mid A)$', '$P(B)\,P(A \mid B)$', '$P(A)\,P(B)$', '$P(A \mid B)\,P(B \mid A)$', '$P(B) - P(A^c \cap B)$']
  answer: [0, 1, 4]
  explanation: |-
    The first two are the multiplication rule, written both ways. The last holds because
    $B$ splits into the disjoint parts $A \cap B$ and $A^c \cap B$. $P(A)P(B)$ is correct only for
    independent events, and the product of the two conditional probabilities has no meaning
    as a rule (with $P(A) = P(B) = 0.5$ and $P(A \cap B) = 0.25$, it gives $0.25$, but with
    $P(A \cap B) = 0.4$ it gives $0.64$).

- id: ps-m1-r2-q15
  lesson: ps-conditional
  module_quiz: true
  topic: Conditional probability
  type: label
  stem: 'Name each numbered part of this probability tree for a scenario $B$ and evidence $A$.'
  image: {src: images/ps-m1-tree-parts-blank.svg, alt: 'A probability tree with no probabilities written. From a starting point, an upper branch leads to node B and a lower branch to a second node. From each of those, branches lead to leaves A (upper) and A complement (lower). Marker 1 is on the branch from the start to B. Marker 2 is on the branch from B to its A leaf. Marker 3 is beside the A leaf reached through B. Marker 4 is beside the A leaf reached through the lower node. Marker 5 is on the lower node itself.'}
  labels:
    - {x: 20.8, y: 35.7, text: 'Prior probability of B'}
    - {x: 51.4, y: 17.1, text: 'Likelihood of A given B'}
    - {x: 77.8, y: 13.1, text: 'P(B ∩ A), a path product'}
    - {x: 77.8, y: 60.7, text: 'P(Bᶜ ∩ A), a path product'}
    - {x: 37.5, y: 73.8, text: 'The other scenario, Bᶜ'}
  distractors: ['Posterior probability of B', 'Likelihood of A given Bᶜ']
  explanation: |-
    First-stage branches carry the priors, so marker 1 is $P(B)$. A second-stage branch carries the
    probability of the evidence given the branch it leaves, so marker 2 is $P(A \mid B)$. Each leaf
    gets the product of its path: marker 3 is $P(B)P(A \mid B) = P(B \cap A)$ and marker 4 is
    $P(B^c \cap A)$. The lower node is $B^c$. The posterior $P(B \mid A)$ is not on the tree; it is
    marker 3 divided by the sum of markers 3 and 4.

# ---------- Lesson 04: independence ----------
- id: ps-m1-r2-q16
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  type: text
  stem: 'Five sensors each detect a leak with probability 0.6, independently. The probability that at least one detects it is ___. Give the exact decimal.'
  accept: ['0.98976']
  explanation: |-
    All five miss with probability $0.4^5 = 0.01024$, so at least one detects it with probability
    $1 - 0.01024 = 0.98976$. Adding $5 \times 0.6 = 3$ is an expected count, not a probability.

- id: ps-m1-r2-q17
  lesson: ps-independence
  topic: Independence
  type: match
  stem: 'Each component works with probability 0.9, independently of the others. Match each system to its reliability.'
  pairs:
    - ['Two components in series', '0.81']
    - ['Two components in parallel', '0.99']
    - ['Three components in series', '0.729']
    - ['Three components in parallel', '0.999']
  distractors: ['0.9', '0.19']
  explanation: |-
    Series: every component must work, $0.9^2 = 0.81$ and $0.9^3 = 0.729$. Parallel: the system
    fails only if all fail, $1 - 0.1^2 = 0.99$ and $1 - 0.1^3 = 0.999$. (0.19 is the chance that at
    least one of two components fails.)

- id: ps-m1-r2-q18
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  stem: '$A$ and $B$ are independent, with $P(A) = 0.5$ and $P(B) = 0.4$. Which statements are true? Select all that apply.'
  choices: ['$P(A \cap B) = 0.2$', '$P(A \cup B) = 0.7$', '$A^c$ and $B$ are independent', '$A$ and $B$ are mutually exclusive', '$P(A \mid B) = 0.4$']
  answer: [0, 1, 2]
  explanation: |-
    Independence gives $P(A \cap B) = 0.5 \times 0.4 = 0.2$, so $P(A \cup B) = 0.5 + 0.4 - 0.2 = 0.7$.
    Complements of independent events are independent. They are not mutually exclusive, because
    their intersection has probability 0.2, not 0. And $P(A \mid B) = P(A) = 0.5$, not 0.4.

- id: ps-m1-r2-q19
  lesson: ps-independence
  topic: Independence
  type: label
  stem: 'In the unit square, $A$ is the strip of width $P(A) = 0.4$ on the left and $B$ is the strip of height $P(B) = 0.3$ at the bottom, for independent events $A$ and $B$. Name each numbered piece and its probability.'
  image: {src: images/ps-m1-indep-square-blank.svg, alt: 'A unit square split by a vertical line, with P(A) = 0.4 marked on the left part and P(A complement) = 0.6 on the right, and by a horizontal line, with P(B) = 0.3 marked on the bottom part and P(B complement) = 0.7 on the top. Markers: 1 bottom left, 2 top left, 3 bottom right, 4 top right.'}
  labels:
    - {x: 35.8, y: 74.2, text: 'A ∩ B: 0.12'}
    - {x: 35.8, y: 36.7, text: 'A ∩ Bᶜ: 0.28'}
    - {x: 64.8, y: 74.2, text: 'Aᶜ ∩ B: 0.18'}
    - {x: 64.8, y: 36.7, text: 'Aᶜ ∩ Bᶜ: 0.42'}
  distractors: ['A ∩ B: 0.7', 'Aᶜ ∩ Bᶜ: 0.3']
  explanation: |-
    Each piece is a rectangle, so its probability is width times height: $0.4 \times 0.3 = 0.12$
    (bottom left), $0.4 \times 0.7 = 0.28$ (top left), $0.6 \times 0.3 = 0.18$ (bottom right) and
    $0.6 \times 0.7 = 0.42$ (top right). The four add to 1. Adding the widths and heights (0.7, or
    $1 - 0.7$) is not how the areas work.

- id: ps-m1-r2-q20
  lesson: ps-independence
  topic: Independence
  type: order
  stem: 'Each component works with probability 0.8, independently. Put these systems in order from least reliable to most reliable.'
  items:
    - 'Three components in series'
    - 'Two components in series'
    - 'One component'
    - 'Two components in parallel'
  explanation: |-
    Reliabilities: $0.8^3 = 0.512$, $0.8^2 = 0.64$, $0.8$, and $1 - 0.2^2 = 0.96$. Each extra
    component in series lowers reliability; a parallel backup raises it.

# ---------- Honors 04h1: first-step analysis and the gambler's ruin ----------
- id: ps-m1-r2-h01
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  stem: 'Ann and Ben take turns tossing a fair coin, Ann first. The first person to toss heads wins. What is the probability that Ann wins?'
  choices: ['$\tfrac12$', '$\tfrac23$', '$\tfrac34$', '$\tfrac13$']
  answer: 1
  explanation: |-
    First-step analysis on a round: Ann wins at once with probability $\tfrac12$, and both miss
    with probability $\tfrac14$, which restarts the game. So $a = \tfrac12 + \tfrac14 a$, giving
    $a = \tfrac23$. Going first is worth a lot: Ben wins only $\tfrac13$ of the time.

- id: ps-m1-r2-h02
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  type: text
  stem: 'Ann and Ben take turns, Ann first. On each of her turns Ann succeeds with probability $\tfrac14$; on each of his, Ben succeeds with probability $\tfrac13$. The first to succeed wins. The probability that Ann wins is ___.'
  accept: ['1/2', '0.5']
  explanation: |-
    Condition on a full round: $a = \tfrac14 + \tfrac34 \cdot \tfrac23\, a = \tfrac14 + \tfrac12 a$, so
    $a = \tfrac12$. Or use $a = p/(p + r - pr) = \tfrac14 / \bigl(\tfrac14 + \tfrac13 - \tfrac1{12}\bigr) = \tfrac14/\tfrac12$.
    Going first exactly makes up for Ann's lower success rate.

- id: ps-m1-r2-h03
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  stem: 'In craps, the point is 6. What is the probability that the shooter rolls a 6 before a 7?'
  choices: ['$\tfrac{5}{11}$', '$\tfrac{5}{36}$', '$\tfrac12$', '$\tfrac{6}{11}$']
  answer: 0
  explanation: |-
    Only the race between 6 and 7 matters: $P(6) = \tfrac5{36}$ and $P(7) = \tfrac6{36}$, so
    $w_6 = \dfrac{5}{5 + 6} = \tfrac5{11}$. $\tfrac5{36}$ is the chance of a 6 on a single roll,
    and $\tfrac6{11}$ is the chance that the 7 comes first.

- id: ps-m1-r2-h04
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  stem: 'Once a point $k$ is set in craps, why can the rolls that are neither $k$ nor 7 be ignored?'
  choices: ['They are less likely than $k$ and 7 combined', 'They count as half a win each', 'After such a roll the situation is exactly as before, so they do not change the chance of winning', 'The rules say they are rerolled with a different pair of dice']
  answer: 2
  explanation: |-
    First-step analysis: after a roll that is neither $k$ nor 7, the game is in the same state as
    before, so $w_k = P(k) + (1 - P(k) - P(7))w_k$. Solving gives $w_k = P(k)/(P(k) + P(7))$,
    the conditional probability of $k$ given that the roll is $k$ or 7. (Other sums are in fact
    more likely than $k$ and 7 combined, so the first choice is false as well as irrelevant.)

- id: ps-m1-r2-h05
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'A gambler with \$30 makes fair \$1 bets until she has \$50 or nothing. What is the probability that she goes broke?'
  choices: ['0.6', '0.4', '0.3', '0.5']
  answer: 1
  explanation: |-
    In a fair game $P_i = i/N$, so she reaches \$50 with probability $30/50 = 0.6$ and goes broke
    with probability $1 - 0.6 = 0.4$. Choosing 0.6 answers the wrong question, and 0.5 ignores
    where she starts.

- id: ps-m1-r2-h06
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  type: text
  stem: 'In a fair game of \$1 bets, a gambler starts with \$3 and stops at \$10 or \$0. The probability that she reaches \$10 is ___.'
  accept: ['0.3', '3/10']
  explanation: |-
    Fair game: $P_i = i/N = 3/10 = 0.3$.

- id: ps-m1-r2-h07
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'A gambler wins each \$1 bet with probability 0.4. She starts with \$2 and stops at \$4 or \$0. What is the probability that she reaches \$4?'
  choices: ['$\tfrac25$', '$\tfrac12$', '$\tfrac{4}{25}$', '$\tfrac{4}{13}$']
  answer: 3
  explanation: |-
    $\rho = q/p = 0.6/0.4 = 1.5$, so $P_2 = \dfrac{1 - 1.5^2}{1 - 1.5^4} = \dfrac{-1.25}{-4.0625} = \dfrac{4}{13} \approx 0.308$.
    Check by first-step analysis: $P_2 = 0.4P_3 + 0.6P_1$, $P_1 = 0.4P_2$, $P_3 = 0.4 + 0.6P_2$,
    so $P_2 = 0.16 + 0.48P_2$ and $P_2 = 0.16/0.52 = 4/13$. $\tfrac12$ is the fair-game answer and
    $\tfrac4{25} = 0.4^2$ counts only winning the next two bets.

- id: ps-m1-r2-h08
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'Which statements about the gambler''s ruin with target $N$ are true? Select all that apply.'
  choices: ['In a fair game, $P_i = i/N$', 'The states 0 and $N$ are absorbing', 'The recursion $P_i = pP_{i+1} + qP_{i-1}$ alone determines $P_i$', 'If $p < \tfrac12$ and the opponent has unlimited money, ruin is certain', 'In the roulette example (\$20, goal \$40), \$1 bets give a better chance of reaching the goal than one bold bet']
  answer: [0, 1, 3]
  explanation: |-
    The fair-game formula, the absorbing ends and certain ruin against an unlimited opponent when
    $p \le \tfrac12$ are all results of the lesson. The recursion needs the boundary conditions
    $P_0 = 0$, $P_N = 1$ to pick one solution. In the roulette example, timid play reaches \$40 with
    probability about 0.108 and bold play about 0.474.

- id: ps-m1-r2-h09
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  type: order
  stem: 'Put the steps for solving the gambler''s ruin in order.'
  items:
    - 'Condition on the first bet: $P_i = pP_{i+1} + qP_{i-1}$'
    - 'Rewrite it as $p(P_{i+1} - P_i) = q(P_i - P_{i-1})$'
    - 'Conclude that the steps grow geometrically: $d_i = \rho^{i-1} d_1$'
    - 'Add the steps, using $P_0 = 0$: $P_i = d_1(1 + \rho + \cdots + \rho^{i-1})$'
    - 'Use $P_N = 1$ to find $d_1$'
  explanation: |-
    The recursion comes from the first bet; splitting $P_i$ as $pP_i + qP_i$ turns it into a
    statement about consecutive differences, which therefore form a geometric sequence. Adding the
    differences from $P_0 = 0$ gives $P_i$ in terms of $d_1$, and the other boundary condition
    $P_N = 1$ fixes $d_1$.

- id: ps-m1-r2-h10
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  type: label
  stem: 'This picture shows the gambler''s ruin with target $N = 6$ as a random walk. Name each numbered part.'
  image: {src: images/ps-m1-h-random-walk-blank.svg, alt: 'Seven circles in a row for the states 0 to 6, with right arrows on top and left arrows below between neighbors. The two end circles are double circles. Marker 1 is on the left end circle, marker 2 on the right end circle, marker 3 on a right-pointing arrow, marker 4 on a left-pointing arrow, and marker 5 on the highlighted circle for state 2.'}
  labels:
    - {x: 10.5, y: 52.0, text: 'Absorbing state: ruin'}
    - {x: 89.5, y: 52.0, text: 'Absorbing state: target reached'}
    - {x: 56.6, y: 46.4, text: 'Win a bet, probability p'}
    - {x: 69.7, y: 57.6, text: 'Lose a bet, probability q'}
    - {x: 36.8, y: 52.0, text: 'Starting fortune i'}
  distractors: ['Win a bet, probability q', 'Lose a bet, probability p']
  explanation: |-
    The walk moves right (up one dollar) with probability $p$ and left with probability
    $q = 1 - p$. It stops for good at 0 (ruin) and at $N = 6$ (the target), which is why those are
    drawn as double circles with no arrows leaving them. The highlighted state is where the
    gambler starts.

- id: ps-m1-r2-h11
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'A gambler wins each \$1 bet with probability 0.6 and plays against an opponent with unlimited money. Starting with \$3, what is the probability that she is never ruined?'
  choices: ['$\tfrac{8}{27}$', '$\tfrac35$', '$\tfrac{19}{27}$', '$1$']
  answer: 2
  explanation: |-
    With $p > \tfrac12$, $P(\text{never ruined}) = 1 - (q/p)^i = 1 - (0.4/0.6)^3 = 1 - \tfrac{8}{27} = \tfrac{19}{27} \approx 0.704$.
    $\tfrac{8}{27}$ is the probability that she is eventually ruined.

- id: ps-m1-r2-h12
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  stem: 'A match between equally skilled players is interrupted when A needs 1 more win and B needs 3. What fraction of the stake should A get?'
  choices: ['$\tfrac78$', '$\tfrac34$', '$\tfrac12$', '$\tfrac14$']
  answer: 0
  explanation: |-
    B wins the match only by winning the next 3 rounds in a row, with probability
    $(\tfrac12)^3 = \tfrac18$. So A's share is $1 - \tfrac18 = \tfrac78$. Fermat's method agrees:
    A needs at least 1 win in $1 + 3 - 1 = 3$ rounds.

- id: ps-m1-r2-h13
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  stem: 'Player A wins each round with probability 0.6. The first to win 2 more rounds takes the stake, and each player needs 2. What is the probability that A wins the match?'
  choices: ['0.6', '0.36', '0.5', '0.648']
  answer: 3
  explanation: |-
    The match is decided within $2 + 2 - 1 = 3$ rounds. A wins if she wins at least 2 of 3:
    $3(0.6)^2(0.4) + 0.6^3 = 0.432 + 0.216 = 0.648$. 0.36 counts only winning the next two
    rounds, and 0.5 ignores A's edge.

- id: ps-m1-r2-h14
  lesson: ps-m1-h-first-step
  topic: First-step analysis
  type: match
  stem: 'Match each problem to its first-step equation ($q = 1 - p$).'
  pairs:
    - ['Alternating race, success $p$ for the first player and $r$ for the second', 'a = p + (1 − p)(1 − r)·a']
    - ['Gambler''s ruin from fortune $i$', 'P(i) = p·P(i + 1) + q·P(i − 1)']
    - ['Craps once the point $k$ is set', 'w = P(k) + (1 − P(k) − P(7))·w']
    - ['Problem of points, A needs $a$ and B needs $b$', 'W(a, b) = p·W(a − 1, b) + q·W(a, b − 1)']
  distractors: ['P(i) = p·P(i − 1) + q·P(i + 1)']
  explanation: |-
    Each equation conditions on the next step. In the race, a full round with two misses restarts
    the game. In the ruin problem a win (probability $p$) moves the fortune up to $i + 1$; the
    distractor has the moves backwards. In craps a roll that is neither $k$ nor 7 leaves things
    unchanged. In the problem of points, a round won by A lowers the number A needs.

- id: ps-m1-r2-h15
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'A roulette player (red wins with probability $18/38$) has \$20 and wants \$40. Which strategy gives the better chance, and roughly what are the chances?'
  choices: ['\$1 bets: about 0.47, against about 0.11 for one \$20 bet', 'One \$20 bet: about 0.47, against about 0.11 for \$1 bets', 'They are equal, since every bet has the same odds', '\$1 bets, because small bets average out the losses']
  answer: 1
  explanation: |-
    One bold bet wins with probability $18/38 \approx 0.474$. Timid play has
    $\rho = 10/9$ and $P_{20} = \dfrac{1 - (10/9)^{20}}{1 - (10/9)^{40}} \approx 0.108$. In an
    unfavorable game, many small bets give the house edge many chances to act.

- id: ps-m1-r2-h16
  lesson: ps-m1-h-first-step
  topic: Gambler's ruin
  stem: 'For a fair game, which sequences satisfy the recursion $P_i = \tfrac12 P_{i+1} + \tfrac12 P_{i-1}$ for $1 \le i \le N - 1$?'
  choices: ['Only $P_i = i/N$', 'Only constant sequences', 'Every sequence of the form $P_i = c_1 + c_2 i$', 'Only $P_i = 2^i$']
  answer: 2
  explanation: |-
    The recursion says each value is the average of its neighbors, which holds exactly for
    sequences that change by the same amount at each step: $P_i = c_1 + c_2 i$. That is why the
    boundary conditions $P_0 = 0$ and $P_N = 1$ are needed; they force $c_1 = 0$ and $c_2 = 1/N$.
    ($2^i$ fails: $\tfrac12(2^{i+1} + 2^{i-1}) = 1.25 \cdot 2^i$.)

# ---------- Honors 04h2: paradoxes of conditioning ----------
- id: ps-m1-r2-h17
  lesson: ps-m1-h-paradoxes
  topic: Simpson's paradox
  type: text
  stem: 'A treatment works in 18 of 20 mild cases and 30 of 80 severe cases. Its overall success rate is ___%. Give the percent.'
  accept: ['48', '48%']
  explanation: |-
    Combine the counts: $(18 + 30)/(20 + 80) = 48/100 = 48\%$. Averaging the two rates,
    $(90\% + 37.5\%)/2 \approx 63.8\%$, is wrong because the groups have different sizes; the overall
    rate weights each group by its share of the cases.

- id: ps-m1-r2-h18
  lesson: ps-m1-h-paradoxes
  topic: Simpson's paradox
  stem: 'Drug P cures 60 of 80 men and 10 of 20 women. Drug Q cures 16 of 20 men and 48 of 80 women. Which statement is correct?'
  choices: ['Q has the higher cure rate among men and among women, but P has the higher overall rate', 'P has the higher cure rate among men, among women and overall', 'Q has the higher cure rate among men, among women and overall', 'The two drugs have the same overall cure rate']
  answer: 0
  explanation: |-
    Men: P $75\%$, Q $80\%$. Women: P $50\%$, Q $60\%$. Overall: P $70/100 = 70\%$, Q
    $64/100 = 64\%$. Q wins in each group and loses overall: Simpson's paradox.

- id: ps-m1-r2-h19
  lesson: ps-m1-h-paradoxes
  topic: Simpson's paradox
  stem: 'In the previous drug example (P: 60 of 80 men, 10 of 20 women cured; Q: 16 of 20 men, 48 of 80 women cured), what explains the reversal?'
  choices: ['Drug Q has side effects that the table does not show', 'The samples are too small for percentages to mean anything', 'Drug P works better on average for each patient', 'Most of P''s patients were men, who were cured more often with either drug']
  answer: 3
  explanation: |-
    Each overall rate is a weighted average of the group rates. P's weights are $0.8$ on men and
    $0.2$ on women; Q's are the reverse. Men are cured more often with either drug, so P's overall
    rate is pulled up by its mix of patients, not by being the better drug in either group.

- id: ps-m1-r2-h20
  lesson: ps-m1-h-paradoxes
  topic: Simpson's paradox
  stem: 'Which statements about Simpson''s paradox are true? Select all that apply.'
  choices: ['Each overall rate is a weighted average of its group rates', 'It cannot happen if both treatments have the same mix of groups', 'It shows that the law of total probability can fail', 'The combined table is always the right one to use', 'Assigning treatments at random makes a reversal unlikely']
  answer: [0, 1, 4]
  explanation: |-
    The law of total probability makes each overall rate a weighted average, and it is exactly
    this law that explains the paradox, so it does not fail. With equal mixes the weights match,
    and no reversal is possible; randomization makes the mixes alike on average. Whether to use
    the combined or the split table depends on how the groups arose.

- id: ps-m1-r2-h21
  lesson: ps-m1-h-paradoxes
  topic: Simpson's paradox
  type: label
  stem: 'The chart shows success rates for two repair methods: Method A fixed 90% of small faults, 50% of large faults and 60% of all faults; Method B fixed 80%, 40% and 70%. The legend and values have been removed. Name each numbered bar.'
  image: {src: images/ps-m1-h-simpson-blank.svg, alt: 'A bar chart with a percent axis from 0% to 100% and three groups of two bars, labeled small faults, large faults and all faults. Marker 1 is on the left bar of the small faults group, about 90% tall. Marker 2 is on the right bar of the large faults group, about 40% tall. Marker 3 is on the left bar of the all faults group, about 60% tall. Marker 4 is on the right bar of the all faults group, about 70% tall.'}
  labels:
    - {x: 21.4, y: 53.5, text: 'Method A, small faults'}
    - {x: 58.3, y: 71.0, text: 'Method B, large faults'}
    - {x: 74.5, y: 64.0, text: 'Method A, all faults'}
    - {x: 84.8, y: 60.5, text: 'Method B, all faults'}
  distractors: ['Method B, small faults', 'Method A, large faults']
  explanation: |-
    Read the heights against the axis: bar 1 reaches 90% (A on small faults), bar 2 reaches 40%
    (B on large faults), bar 3 reaches 60% (A overall) and bar 4 reaches 70% (B overall). The left
    bar of each group is A: A is taller in both fault groups, but B is taller overall.

- id: ps-m1-r2-h22
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'A prize goes to every applicant with a high score ($H$) or a strong essay ($E$). Among all applicants $P(H) = 0.4$, $P(E) = 0.25$, independently. What is $P(H \mid \text{winner})$?'
  choices: ['$0.4$', '$0.55$', '$\tfrac{8}{11} \approx 0.727$', '$0.1$']
  answer: 2
  explanation: |-
    $P(\text{winner}) = P(H \cup E) = 0.4 + 0.25 - 0.1 = 0.55$. Every high scorer wins, so
    $P(H \mid \text{winner}) = 0.4/0.55 = 8/11 \approx 0.727$. 0.4 is the rate among all
    applicants, and 0.55 is $P(\text{winner})$ itself.

- id: ps-m1-r2-h23
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'In the same prize example ($P(H) = 0.4$, $P(E) = 0.25$, independent, winners are $H \cup E$), what is $P(H \mid \text{winner with a strong essay})$?'
  choices: ['$0.4$', '$\tfrac{8}{11}$', '$1$', '$0.25$']
  answer: 0
  explanation: |-
    Every strong essay wins, so "winner with a strong essay" is just $E$, and
    $P(H \mid E) = P(H) = 0.4$ by independence. Among winners, a strong essay lowers the chance of a
    high score from $8/11$ to $0.4$ (and among winners with a weak essay it is 1): selection has
    created a negative association.

- id: ps-m1-r2-h24
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'Two diseases are independent in the general population, but among hospital patients, people with one disease are less likely to have the other. What is the most likely explanation?'
  choices: ['One disease protects against the other', 'Either disease can put a person in the hospital, so looking only at patients selects on a common effect', 'Hospitals misdiagnose the second disease', 'Independence in a population always reverses in a subgroup']
  answer: 1
  explanation: |-
    This is Berkson's original example. Patients are selected because they have one disease or
    the other (or something else), and conditioning on a common effect of two independent causes
    makes them negatively associated, as in the scholarship example. No biological link is needed.

- id: ps-m1-r2-h25
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'A parent of two children answers yes to "Do you have at least one daughter?" Assuming each child is independently a girl or a boy with probability $\tfrac12$, what is the probability that both children are girls?'
  choices: ['$\tfrac12$', '$\tfrac14$', '$\tfrac13$', '$\tfrac23$']
  answer: 2
  explanation: |-
    The condition leaves $GG$, $GB$, $BG$, equally likely, and only one of them is $GG$:
    $\tfrac{1/4}{3/4} = \tfrac13$. The answer $\tfrac12$ would be right if we had learned that one
    particular child (say the older) is a girl.

- id: ps-m1-r2-h26
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  type: text
  stem: 'A family has two children, each independently a girl or a boy with probability $\tfrac12$. You learn that the older child is a girl. The probability that both are girls is ___.'
  accept: ['1/2', '0.5']
  explanation: |-
    The condition leaves $GG$ and $GB$ (older first), equally likely, so the answer is $\tfrac12$:
    the younger child's sex is independent of the older child's.

- id: ps-m1-r2-h27
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'Three cards: one red on both sides, one white on both sides, one red on one side and white on the other. A card is picked at random and laid down with a random side up. The side showing is red. What is the probability that the other side is red?'
  choices: ['$\tfrac12$', '$\tfrac23$', '$\tfrac13$', '$\tfrac34$']
  answer: 1
  explanation: |-
    This is Bertrand's box in another form. Likelihood of showing red: 1 for the red–red card,
    $\tfrac12$ for the mixed card, 0 for the white card. So
    $P(\text{red–red} \mid \text{red showing}) = \dfrac{\tfrac13}{\tfrac13 + \tfrac16} = \tfrac23$. Counting
    sides: three red sides are equally likely to be showing, and two of them are on the red–red
    card.

- id: ps-m1-r2-h28
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  type: match
  stem: 'Match each situation to the idea it illustrates.'
  pairs:
    - ['A comparison that holds in every group reverses when the groups are combined', 'Simpson''s paradox']
    - ['Traits that are independent in the population look related among those selected', 'Berkson''s paradox']
    - ['A gold coin is drawn, which makes the gold–gold box more likely than the mixed box', 'Bertrand''s box']
    - ['A variable affects both which treatment is chosen and the outcome', 'Confounding']
  distractors: ['Gambler''s ruin', 'Problem of points']
  explanation: |-
    Simpson's paradox is the reversal on combining groups; Berkson's paradox is association created
    by selection on a common effect; Bertrand's box shows that scenarios must be weighted by how
    likely they were to produce the evidence; a confounder influences both the treatment and the
    outcome.

- id: ps-m1-r2-h29
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  type: order
  stem: 'Put these conditional probabilities from the lesson in order from smallest to largest (two children, each a boy or girl with probability $\tfrac12$).'
  items:
    - '$P(BB \mid \text{at least one boy})$'
    - '$P(BB \mid \text{at least one boy born on a Tuesday})$'
    - '$P(BB \mid \text{the older child is a boy})$'
    - '$P(\text{other coin is gold} \mid \text{gold drawn})$ in Bertrand''s box'
  explanation: |-
    The values are $\tfrac13 \approx 0.333$, $\tfrac{13}{27} \approx 0.481$, $\tfrac12$ and
    $\tfrac23$. The Tuesday detail nearly singles out one child, so its answer lies between the
    "at least one" answer and the "particular child" answer.

- id: ps-m1-r2-h30
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'Each child is independently a boy or a girl with probability $\tfrac12$ and born on any of the 7 weekdays with probability $\tfrac17$. A family has two children, and at least one is a boy born on a Tuesday. What is the probability that both are boys?'
  choices: ['$\tfrac{13}{27}$', '$\tfrac13$', '$\tfrac12$', '$\tfrac{1}{14}$']
  answer: 0
  explanation: |-
    Use 14 equally likely types per child, so $196$ ordered pairs. Pairs with no Tuesday boy:
    $13^2 = 169$, so $27$ pairs have at least one. Both are boys in $7^2 - 6^2 = 13$ of them
    (boy–boy pairs minus those with no Tuesday boy). The answer is $\tfrac{13}{27} \approx 0.48$.

- id: ps-m1-r2-h31
  lesson: ps-m1-h-paradoxes
  topic: Paradoxes of conditioning
  stem: 'Which statement correctly contrasts conditioning on a common cause with conditioning on a common effect?'
  choices: ['Both always make events independent', 'Both always make events dependent', 'Conditioning on a common effect can remove a dependence; conditioning on a common cause can create one', 'Conditioning on a common cause can remove a dependence; conditioning on a common effect can create one']
  answer: 3
  explanation: |-
    In lesson 4 the two tosses were dependent because of the unknown coin (a common cause); given the
    coin, they were independent. In Berkson's paradox, independent traits share a common effect
    (winning); given the effect, they become dependent.
