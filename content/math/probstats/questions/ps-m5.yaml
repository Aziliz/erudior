# Module 5 — Limit theorems (lessons 21–22)
# ---- Lesson 21: Markov, Chebyshev, law of large numbers
- id: ps-q-2101
  lesson: ps-lln
  module_quiz: true
  topic: Probability inequalities
  stem: 'A nonnegative random variable has mean 5. What upper bound does Markov''s inequality give for $P(X \ge 20)$?'
  choices: ['$0.20$', '$0.25$', '$0.75$', '$0.0625$']
  answer: 1
  explanation: |-
    Markov: $P(X \ge a) \le E[X]/a = 5/20 = 0.25$. 0.75 is the complementary bound on $P(X < 20)$, which Markov
    states as at least 0.75; 0.0625 squares the ratio as if it were Chebyshev.

- id: ps-q-2102
  lesson: ps-lln
  topic: Probability inequalities
  stem: 'A measurement has mean 50 and standard deviation 4, with unknown distribution. What is the best lower bound Chebyshev gives for $P(42 < X < 58)$?'
  choices: ['$0.95$', '$0.25$', '$0.75$', '$0.50$']
  answer: 2
  explanation: |-
    The interval is $\mu \pm 2\sigma$, so $k = 2$ and $P(|X - \mu| \ge 2\sigma) \le \tfrac14$. Hence $P(42 < X < 58) \ge 1 - \tfrac14 = 0.75$.
    0.95 is the normal-distribution value, which needs the shape; 0.25 is the bound on the outside.

- id: ps-q-2103
  lesson: ps-lln
  topic: Probability inequalities
  stem: 'For any distribution with finite variance, at most what fraction of the probability lies 3 or more standard deviations from the mean?'
  choices: ['$\tfrac19$', '$\tfrac13$', '$0.003$', '$\tfrac1{27}$']
  answer: 0
  explanation: |-
    Chebyshev with $k = 3$: $P(|X - \mu| \ge 3\sigma) \le 1/k^2 = \tfrac19$. 0.003 is the figure for a normal
    distribution only; $\tfrac13$ would come from Markov-style $1/k$.

- id: ps-q-2104
  lesson: ps-lln
  topic: Probability inequalities
  stem: '$X$ takes values between $-10$ and $10$ and has mean 1. Why can''t Markov''s inequality be used to bound $P(X \ge 5)$ by $1/5$?'
  choices: ['Because $X$ can be negative, and the proof needs $X \ge a\,\mathbf{1}\{X \ge a\}$, which requires $X \ge 0$', 'Because the mean is too small', 'Because Markov only applies to discrete variables', 'Because $X$ is bounded']
  answer: 0
  explanation: |-
    The proof compares $X$ with $a\,\mathbf{1}\{X \ge a\}$; when $X$ can be negative that comparison fails. For
    example, $X = -10$ or $10$ with probabilities 0.45 and 0.55 has mean 1 but $P(X \ge 5) = 0.55 > 0.2$.

- id: ps-q-2105
  lesson: ps-lln
  topic: Probability inequalities
  stem: '$X$ is exponential with mean 3. Compare the Markov bound for $P(X \ge 12)$ with the exact value.'
  choices: ['Bound $0.0625$; exact $e^{-4} \approx 0.018$', 'Bound $0.25$; exact $e^{-4} \approx 0.018$', 'Bound $0.25$; exact $e^{-12} \approx 0.000006$', 'Bound $0.25$; exact $0.25$']
  answer: 1
  explanation: |-
    Markov: $3/12 = 0.25$. Exact: $P(X \ge 12) = e^{-12/3} = e^{-4} \approx 0.018$. The bound is valid but loose because
    it uses only the mean. $e^{-12}$ forgets to divide 12 by the mean 3.

- id: ps-q-2106
  lesson: ps-lln
  module_quiz: true
  topic: Law of large numbers
  stem: 'What does it mean for a sequence $Y_n$ to converge in probability to a constant $c$?'
  choices: ['$E[Y_n] = c$ for every $n$', '$Y_n = c$ for all large $n$', 'For every $\varepsilon > 0$, $P(|Y_n - c| \ge \varepsilon) \to 0$ as $n \to \infty$', 'The cdf of $Y_n$ equals the cdf of $c$ for every $n$']
  answer: 2
  explanation: |-
    Convergence in probability: whatever tolerance $\varepsilon$ you choose, the chance of missing $c$ by at least $\varepsilon$
    shrinks to 0. It doesn't require $Y_n$ to equal $c$ ever, and an unbiased $Y_n$ need not converge.

- id: ps-q-2107
  lesson: ps-lln
  topic: Law of large numbers
  stem: 'An iid sample of size 100 comes from a population with standard deviation 10. Using Chebyshev, what is the bound on $P(|\bar X - \mu| \ge 2)$?'
  choices: ['$0.05$', '$0.50$', '$2.5$', '$0.25$']
  answer: 3
  explanation: |-
    $\operatorname{Var}(\bar X) = \sigma^2/n = 100/100 = 1$, so $P(|\bar X - \mu| \ge 2) \le 1/2^2 = 0.25$. 2.5 omits the division by $n$ (and is
    useless as a probability bound).

- id: ps-q-2108
  lesson: ps-lln
  module_quiz: true
  topic: Law of large numbers
  stem: 'A population has $\sigma = 5$. Using Chebyshev''s inequality, how large must $n$ be to guarantee $P(|\bar X - \mu| \ge 1) \le 0.05$?'
  choices: ['$n \ge 97$', '$n \ge 25$', '$n \ge 100$', '$n \ge 500$']
  answer: 3
  explanation: |-
    Chebyshev: $P(|\bar X - \mu| \ge 1) \le \dfrac{\sigma^2}{n\varepsilon^2} = \dfrac{25}{n}$. Requiring $25/n \le 0.05$ gives $n \ge 500$. About 97 is
    what the CLT normal approximation suggests, which is an approximation rather than a guarantee.

- id: ps-q-2109
  lesson: ps-lln
  topic: Law of large numbers
  stem: 'A fair coin has landed tails 8 times in a row. Which statement agrees with the law of large numbers?'
  choices: ['Heads is now more likely, so the proportion can return to 0.5', 'The next flip is still 50–50; the early excess of tails is diluted by many later flips, not cancelled', 'The number of heads minus tails will return to 0 within a few flips', 'The coin must be biased, since the law of large numbers forbids long runs']
  answer: 1
  explanation: |-
    Flips are independent, so the next one is 50–50. The proportion of heads tends to 0.5 because the
    fixed early deviation becomes a smaller fraction of a growing total. The count difference itself
    typically grows like $\sqrt n$.

- id: ps-q-2110
  lesson: ps-lln
  topic: Probability inequalities
  stem: '$X$ equals $-2$, $0$, $2$ with probabilities $\tfrac18$, $\tfrac34$, $\tfrac18$ (so $\mu = 0$, $\sigma = 1$). Compare $P(|X| \ge 2)$ with the Chebyshev bound for $k = 2$.'
  choices: ['Exact $\tfrac14$, bound $\tfrac14$: the bound is attained', 'Exact $\tfrac18$, bound $\tfrac14$', 'Exact $\tfrac14$, bound $\tfrac12$', 'Exact $\tfrac34$, bound $\tfrac14$']
  answer: 0
  explanation: |-
    $P(|X| \ge 2) = \tfrac18 + \tfrac18 = \tfrac14$, and Chebyshev gives $1/k^2 = \tfrac14$. This distribution shows the
    inequality cannot be improved without more information. $\tfrac18$ counts only one tail.

- id: ps-q-2111
  lesson: ps-lln
  topic: Law of large numbers
  stem: '$U_1, U_2, \dots$ are iid Uniform(0, 1). By the law of large numbers, $\tfrac1n\sum_{i=1}^n U_i^2$ converges in probability to what value?'
  choices: ['$\tfrac12$', '$\tfrac14$', '$1$', '$\tfrac13$']
  answer: 3
  explanation: |-
    The average of iid copies of $U^2$ converges to $E[U^2] = \int_0^1 u^2\,du = \tfrac13$. This is Monte Carlo
    integration of $u^2$. $\tfrac14$ is $(E[U])^2$, which is not the same thing.

- id: ps-q-2112
  lesson: ps-lln
  module_quiz: true
  topic: Probability inequalities
  stem: 'With $n = 2500$ Bernoulli trials and unknown $p$, Chebyshev''s inequality with $p(1 - p) \le \tfrac14$ bounds $P(|\hat p - p| \ge 0.02)$ by what?'
  choices: ['$0.05$', '$0.0001$', '$0.25$', '$0.50$']
  answer: 2
  explanation: |-
    $P(|\hat p - p| \ge 0.02) \le \dfrac{p(1-p)}{n(0.02)^2} \le \dfrac{0.25}{2500 \times 0.0004} = 0.25$. The value 0.0001 is $\operatorname{Var}(\hat p)$ at
    $p = \tfrac12$, not a probability bound.

# ---- Lesson 22: Central Limit Theorem
- id: ps-q-2201
  lesson: ps-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'Which is a correct statement of the Central Limit Theorem for iid $X_1, X_2, \dots$ with mean $\mu$ and finite variance $\sigma^2 > 0$?'
  choices: ['$\dfrac{\bar X_n - \mu}{\sigma/\sqrt n}$ converges in distribution to $N(0, 1)$', 'The data $X_1, \dots, X_n$ become normally distributed as $n$ grows', '$\bar X_n$ converges in distribution to $N(\mu, \sigma^2)$', '$\bar X_n$ equals $\mu$ for large $n$']
  answer: 0
  explanation: |-
    The CLT is about the standardized mean (or sum). The data keep their own distribution, and
    $\bar X_n$ itself concentrates at $\mu$ with spread $\sigma/\sqrt n$, not spread $\sigma$.

- id: ps-q-2202
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'Fifty iid variables each have mean 2 and variance 3. Using the CLT, approximate $P(S_{50} > 110)$.'
  choices: ['$0.4734$', '$0.3187$', '$0.2071$', '$0.0228$']
  answer: 2
  explanation: |-
    $S_{50}$ has mean 100 and variance $50 \times 3 = 150$, SD $\approx 12.25$. $z = 10/12.25 \approx 0.816$, so $P \approx 0.2071$.
    0.4734 divides by the variance instead of the SD, and 0.3187 uses $\sqrt{50} \times 3$ as if 3 were the SD.

- id: ps-q-2203
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: '$X \sim \text{Bin}(200, 0.3)$. With a continuity correction, $P(X \ge 70)$ is approximated by which normal probability (mean 60, SD $\sqrt{42}$)?'
  choices: ['$P(Z \ge (70.5 - 60)/\sqrt{42})$', '$P(Z \ge (69.5 - 60)/\sqrt{42})$', '$P(Z \ge (70 - 60)/42)$', '$P(Z \le (69.5 - 60)/\sqrt{42})$']
  answer: 1
  explanation: |-
    The integer 70 occupies $[69.5, 70.5]$, and "at least 70" includes it, so start at 69.5. Using 70.5 drops
    the value 70; dividing by 42 uses the variance instead of the SD.

- id: ps-q-2204
  lesson: ps-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: '$X \sim \text{Bin}(100, 0.5)$. Use the normal approximation with continuity correction to estimate $P(X \le 45)$.'
  choices: ['$0.1587$', '$0.2119$', '$0.1841$', '$0.8159$']
  answer: 2
  explanation: |-
    Mean 50, SD 5. $z = (45.5 - 50)/5 = -0.9$, giving 0.1841 (the exact binomial value is 0.1841 too). 0.1587 skips
    the correction ($z = -1$), and 0.8159 is the complement.

- id: ps-q-2205
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'Service times are exponential with mean 4 minutes. For a random sample of 64 service times, approximate $P(\bar X > 4.5)$.'
  choices: ['$0.4503$', '$0.0228$', '$0.8413$', '$0.1587$']
  answer: 3
  explanation: |-
    An exponential with mean 4 has SD 4, so $\operatorname{SD}(\bar X) = 4/\sqrt{64} = 0.5$. $z = (4.5 - 4)/0.5 = 1$, and $P(Z > 1) \approx 0.1587$.
    0.4503 uses the SD of a single time, and 0.8413 is the left tail.

- id: ps-q-2206
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'In the MGF proof of the CLT, $M_{Z_n}(t) = \big[M_Y(t/\sqrt n)\big]^n$ with $M_Y(s) = 1 + s^2/2 + r(s)$. Why does the limit not depend on the population?'
  choices: ['Because every population has the same MGF', 'Because $M_Y(0) = 0$ for standardized variables', 'Because the population must be normal for the expansion to hold', 'Because only the mean 0 and variance 1 enter the leading terms; the remainder $r(t/\sqrt n)$ is negligible compared with $1/n$']
  answer: 3
  explanation: |-
    After standardizing, every population contributes $1 + t^2/(2n)$ plus a remainder that is $o(1/n)$, so
    $(1 + t^2/(2n) + o(1/n))^n \to e^{t^2/2}$. Skewness and tail shape live in the remainder and vanish in the limit.
    ($M_Y(0) = 1$, not 0.)

- id: ps-q-2207
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'The average of $n$ iid Cauchy random variables has the same Cauchy distribution for every $n$. Why doesn''t this contradict the CLT?'
  choices: ['The Cauchy distribution has no finite variance (or mean), so the CLT''s hypotheses fail', 'Cauchy variables are not independent', 'The CLT needs $n \ge 30$, and Cauchy samples are small', 'The Cauchy distribution is discrete']
  answer: 0
  explanation: |-
    The CLT requires a finite variance. The Cauchy distribution's tails are so heavy that its mean and
    variance do not exist, and averaging does not tame it.

- id: ps-q-2208
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'A sequence $Y_n$ with cdfs $F_n$ converges in distribution to $Y$ with cdf $F$ when'
  choices: ['$Y_n = Y$ for all large $n$', '$F_n(y) \to F(y)$ at every $y$ where $F$ is continuous', '$E[Y_n] \to E[Y]$', '$P(|Y_n - Y| \ge \varepsilon) \to 0$ for every $\varepsilon > 0$']
  answer: 1
  explanation: |-
    Convergence in distribution is about probabilities: the cdfs approach the limiting cdf at its
    continuity points. $P(|Y_n - Y| \ge \varepsilon) \to 0$ describes convergence in probability, a stronger notion.

- id: ps-q-2209
  lesson: ps-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'Forty-eight amounts are each rounded to the nearest unit, with iid rounding errors uniform on $(-0.5, 0.5)$. Approximate the probability that the total rounding error exceeds 3 in absolute value.'
  choices: ['$0.0668$', '$0.1336$', '$0.8664$', '$0.4533$']
  answer: 1
  explanation: |-
    Each error has variance $\tfrac1{12}$, so the total has variance $48/12 = 4$, SD 2. $P(|S| > 3) \approx P(|Z| > 1.5) = 2(0.0668) = 0.1336$.
    0.0668 counts only one tail, and 0.8664 is the probability of staying within 3.

- id: ps-q-2210
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: 'Household incomes are strongly right-skewed. A researcher takes a random sample of 1,000 households. Which statement is correct?'
  choices: ['A histogram of the 1,000 incomes will look roughly normal by the CLT', 'Neither the data nor the sample mean will be approximately normal', 'The sample mean has an approximately normal sampling distribution, while the histogram of incomes stays right-skewed', 'The population becomes normal once $n \ge 30$']
  answer: 2
  explanation: |-
    The CLT describes the distribution of $\bar X$ over repeated samples. A large sample is a faithful picture
    of the population, so its histogram stays skewed.

- id: ps-q-2211
  lesson: ps-clt
  topic: Central Limit Theorem
  stem: '$X \sim \text{Poisson}(100)$. Using the normal approximation with continuity correction, estimate $P(X \ge 120)$.'
  choices: ['$0.0228$', '$0.0202$', '$0.9744$', '$0.0256$']
  answer: 3
  explanation: |-
    Mean 100, SD 10. $P(X \ge 120) \approx P(Z \ge (119.5 - 100)/10) = P(Z \ge 1.95) \approx 0.0256$. 0.0228 skips the correction, and
    0.0202 corrects in the wrong direction (120.5). (The exact value is about 0.028.)

- id: ps-q-2212
  lesson: ps-clt
  module_quiz: true
  topic: Central Limit Theorem
  stem: 'A population has $\sigma = 5$. Using the CLT, about how large must $n$ be so that $P(|\bar X - \mu| < 0.5) \approx 0.95$?'
  choices: ['$385$', '$20$', '$2000$', '$196$']
  answer: 0
  explanation: |-
    Need $1.96 \cdot 5/\sqrt n = 0.5$, so $\sqrt n = 19.6$ and $n = 384.16$; round up to 385. 2000 is the Chebyshev
    guarantee $25/(0.25 \times 0.05)$, and 20 forgets to square.
