# Round 2, module ps-m4 (Joint distributions): new question types for the core lessons 15-20
# (ps-m4-r2-q01..q30) and the honors lessons 20h1, 20h2 (ps-m4-r2-h01..h28).

# ---- Lesson 15: joint distributions and marginals
- id: ps-m4-r2-q01
  lesson: ps-joint-dist
  type: text
  module_quiz: true
  topic: Joint distributions
  stem: 'The function $f(x, y) = c\,xy^2$ for $0 < x < 1$, $0 < y < 1$ (zero elsewhere) is a joint density. Then $c =$ ___. Give only the number.'
  accept: ['6']
  explanation: |-
    The total volume must be 1: $\int_0^1\!\int_0^1 c\,xy^2\,dy\,dx = c \cdot \tfrac12 \cdot \tfrac13 = \tfrac{c}{6}$, so $c = 6$.

- id: ps-m4-r2-q02
  lesson: ps-joint-dist
  type: order
  topic: Joint distributions
  stem: 'Put the steps for finding $P((X, Y) \in A)$ from a joint density in order.'
  items:
    - 'Sketch the support, where $f(x, y) > 0$'
    - 'Shade the part of the support that lies in the event $A$'
    - 'Choose the order of integration and read off the limits from the shaded region'
    - 'Evaluate the inner integral'
    - 'Evaluate the outer integral and check the answer is between 0 and 1'
  explanation: |-
    You can only shade the part of the support inside $A$ after drawing the support. The limits come from the
    shaded region, the inner integral must be done before the outer one, and the final check comes last.

- id: ps-m4-r2-q03
  lesson: ps-joint-dist
  topic: Joint distributions
  stem: 'Which statements are true for every joint density $f(x, y)$ of a continuous pair $(X, Y)$? Select all that apply.'
  choices: ['$f(x, y) \ge 0$ for all $x, y$', '$f(x, y) \le 1$ for all $x, y$', '$\iint_{\mathbb{R}^2} f(x, y)\,dA = 1$', '$f(x, y) = f_X(x)\,f_Y(y)$', '$f_X(x) = \int_{-\infty}^{\infty} f(x, y)\,dy$']
  answer: [0, 2, 4]
  explanation: |-
    A joint density is nonnegative and has total volume 1, and integrating out $y$ gives the marginal density of $X$.
    It can exceed 1 (the lesson's $8xy$ is 5.76 at $(0.9, 0.8)$), and it equals the product of the marginals only when
    $X$ and $Y$ are independent.

- id: ps-m4-r2-q04
  lesson: ps-joint-dist
  type: label
  module_quiz: true
  topic: Joint distributions
  stem: 'The picture shows the support $0 < y < x < 1$ of the density $8xy$ from the lesson and the event $X + Y < 1$. Name the numbered parts.'
  image: {src: images/ps-m4-joint-region-blank.svg, alt: 'A right triangle with corners at (0, 0), (1, 0) and (1, 1). A dashed line runs from (0, 1) to (1, 0) and crosses the triangle''s slanted edge at the point (1/2, 1/2). The part of the triangle below the dashed line is shaded, and a thin horizontal strip lies across the shaded part.'}
  labels:
    - {x: 62.5, y: 32.9, text: 'Line y = x (edge of the support)'}
    - {x: 30.0, y: 29.5, text: 'Line x + y = 1'}
    - {x: 47.7, y: 61.6, text: 'Region where 0 < y < x and x + y < 1'}
    - {x: 35.9, y: 70.5, text: 'Strip for one y: x runs from y to 1 − y'}
    - {x: 47.7, y: 50.0, text: 'Corner (1/2, 1/2)'}
  distractors: ['Line y = 1 − 2x', 'Strip for one x: y runs from 0 to x']
  explanation: |-
    1 is the slanted edge of the support, the line $y = x$. 2 is the dashed line $x + y = 1$. 3 is the shaded part of
    the support below that line, the event. 4 is a horizontal strip (fixed $y$), along which $x$ goes from the
    diagonal $x = y$ to the line $x = 1 - y$. 5 is where the two lines meet, $(\tfrac12, \tfrac12)$, which sets the outer limit
    $y < \tfrac12$.

- id: ps-m4-r2-q05
  lesson: ps-joint-dist
  type: match
  topic: Joint distributions
  stem: 'A joint pmf is given as a table with rows $x = 0, 1, 2$ and columns $y = 0, 1$. Match each probability to how it is read from the table.'
  pairs:
    - ['$P(X = 1)$', Add the cells across the row x = 1]
    - ['$P(Y = 0)$', Add the cells down the column y = 0]
    - ['$P(X = 1, Y = 0)$', Read the single cell in row 1 and column 0]
    - ['$P(X + Y \le 1)$', 'Add the cells (0, 0), (0, 1) and (1, 0)']
  distractors: [Multiply the row total by the column total]
  explanation: |-
    Marginal probabilities add along a row (for $X$) or a column (for $Y$); a joint probability is one cell; an event
    about the pair adds the cells in the event. Multiplying a row total by a column total gives the joint probability
    only under independence.

# ---- Lesson 16: conditional distributions and independence
- id: ps-m4-r2-q06
  lesson: ps-conditional-indep
  type: text
  topic: Conditional distributions
  stem: |-
    In the inspection table

    $$\begin{array}{c|cc} & y = 0 & y = 1 \\ \hline x = 0 & 0.30 & 0.10 \\ x = 1 & 0.20 & 0.15 \\ x = 2 & 0.10 & 0.15 \end{array}$$

    $P(Y = 0 \mid X = 0) =$ ___. Give the exact value as a decimal or fraction.
  accept: ['0.75']
  explanation: |-
    Take the row $x = 0$, which is $(0.30, 0.10)$ with total $0.40$, and divide: $0.30/0.40 = 0.75$.

- id: ps-m4-r2-q07
  lesson: ps-conditional-indep
  module_quiz: true
  topic: Independence of random variables
  stem: 'For which joint densities (each zero outside the region shown) are $X$ and $Y$ independent? Select all that apply.'
  choices: ['$6xy^2$ on $0 < x < 1,\ 0 < y < 1$', '$8xy$ on $0 < y < x < 1$', '$e^{-x-y}$ on $x > 0,\ y > 0$', '$x + y$ on $0 < x < 1,\ 0 < y < 1$', '$2e^{-x-y}$ on $0 < x < y$']
  answer: [0, 2]
  explanation: |-
    $6xy^2 = (2x)(3y^2)$ and $e^{-x-y} = e^{-x}e^{-y}$ factor on rectangles, so those pairs are independent. $8xy$ and
    $2e^{-x-y}$ live on triangles, so knowing $X$ restricts $Y$: dependent. $x + y$ is on a square but cannot be written
    as $g(x)h(y)$ (its marginals are $x + \tfrac12$ and $y + \tfrac12$, whose product is not $x + y$).

- id: ps-m4-r2-q08
  lesson: ps-conditional-indep
  type: match
  topic: Conditional distributions
  stem: 'Match each idea to its rule.'
  pairs:
    - ['$f_{Y \mid X}(y \mid x)$', 'f(x, y) divided by fX(x)']
    - [Multiplication rule, 'f(x, y) = fX(x) times f(y | x)']
    - [Independence of X and Y, Joint density equals the product of the marginals everywhere]
    - ['$P(X < Y)$ for independent exponentials with rates $a$ and $b$', 'a/(a + b)']
  distractors: ['f(x, y) divided by fY(y)', 'b/(a + b)']
  explanation: |-
    The conditional density of $Y$ given $X$ divides by the marginal of $X$ (dividing by $f_Y$ gives $f_{X \mid Y}$).
    Rearranging gives the multiplication rule. Independence means the joint factors into the marginals everywhere.
    In a race of independent exponentials, $X$ wins with probability proportional to its own rate, $a/(a + b)$.

- id: ps-m4-r2-q09
  lesson: ps-conditional-indep
  type: order
  topic: Conditional distributions
  stem: 'A model is described by a story: first $X$ is drawn, then $Y$ given $X$. Put the steps for finding $P(Y < c)$ in order.'
  items:
    - 'Write the marginal density $f_X(x)$ from the story'
    - 'Write the conditional density $f_{Y \mid X}(y \mid x)$ from the story'
    - 'Multiply them to get the joint density $f(x, y)$'
    - 'Integrate out $x$ to get the marginal density $f_Y(y)$'
    - 'Integrate $f_Y$ from the bottom of its range up to $c$'
  explanation: |-
    This is the cable example: the story gives $X$ first and then $Y$ given $X$; the multiplication rule builds the
    joint; integrating out $x$ gives $f_Y$ (there $-\ln y$); and the probability is an integral of $f_Y$.

- id: ps-m4-r2-q10
  lesson: ps-conditional-indep
  type: text
  module_quiz: true
  topic: Independence of random variables
  stem: 'A sensor fails after an exponential time $X$ with rate 0.2 per year, and its battery after an independent exponential time $Y$ with rate 0.3 per year. $P(X < Y) =$ ___. Give the exact decimal.'
  accept: ['0.4']
  explanation: |-
    For independent exponentials, $P(X < Y) = \dfrac{a}{a + b} = \dfrac{0.2}{0.2 + 0.3} = 0.4$. (0.6 is the chance the battery fails first.)

# ---- Lesson 17: covariance and correlation
- id: ps-m4-r2-q11
  lesson: ps-covariance
  type: text
  module_quiz: true
  topic: Covariance and correlation
  stem: '$\operatorname{Var}(X) = 4$, $\operatorname{Var}(Y) = 1$ and $\operatorname{Cov}(X, Y) = -1$. Then $\operatorname{Var}(X - 2Y) =$ ___.'
  accept: ['12']
  explanation: |-
    With $a = 1$, $b = -2$: $\operatorname{Var}(X - 2Y) = 4 + (-2)^2(1) + 2(1)(-2)(-1) = 4 + 4 + 4 = 12$.
    The covariance term is positive because both $b$ and the covariance are negative.

- id: ps-m4-r2-q12
  lesson: ps-covariance
  type: label
  module_quiz: true
  topic: Covariance and correlation
  stem: 'The picture explains the sign of the covariance. Name the numbered parts.'
  image: {src: images/ps-m4-cov-quadrants-blank.svg, alt: 'A scatter of points rising to the right. A dashed vertical line and a dashed horizontal line cross at an open circle. A green rectangle joins the open circle to a dark point up and to the right; a red rectangle joins it to a dark point up and to the left.'}
  labels:
    - {x: 50.0, y: 50.0, text: 'Mean point (μX, μY)'}
    - {x: 50.0, y: 85.7, text: 'Vertical line x = μX'}
    - {x: 13.5, y: 50.0, text: 'Horizontal line y = μY'}
    - {x: 78.8, y: 23.8, text: Point with a positive product of deviations}
    - {x: 23.1, y: 33.3, text: Point with a negative product of deviations}
  distractors: [Regression line, Point with zero covariance]
  explanation: |-
    The dashed lines go through the mean point and split the plane into quadrants. Point 4 is above both means, so
    $(x - \mu_X)(y - \mu_Y) > 0$; point 5 has $x$ below its mean and $y$ above, so the product is negative. The
    covariance averages these signed products; here the points mostly sit in the positive quadrants.

- id: ps-m4-r2-q13
  lesson: ps-covariance
  topic: Covariance and correlation
  stem: 'Each statement below is about random variables $X$ and $Y$ with finite variances. Which ones guarantee $\operatorname{Cov}(X, Y) = 0$? Select all that apply.'
  choices: ['$X$ and $Y$ are independent', '$E[XY] = E[X]\,E[Y]$', '$\operatorname{Var}(X + Y) = \operatorname{Var}(X) + \operatorname{Var}(Y)$', '$Y = 3 - 2X$', '$\operatorname{Var}(X - Y) > \operatorname{Var}(X) + \operatorname{Var}(Y)$']
  answer: [0, 1, 2]
  explanation: |-
    Independence gives $E[XY] = E[X]E[Y]$, which is exactly covariance 0. $\operatorname{Var}(X + Y) = \operatorname{Var}X + \operatorname{Var}Y + 2\operatorname{Cov}$, so
    the third statement also forces covariance 0. $Y = 3 - 2X$ gives $\operatorname{Cov} = -2\operatorname{Var}(X)$, not 0 (unless $X$ is constant),
    and $\operatorname{Var}(X - Y) > \operatorname{Var}X + \operatorname{Var}Y$ means $-2\operatorname{Cov} > 0$, a negative covariance.

- id: ps-m4-r2-q14
  lesson: ps-covariance
  type: match
  topic: Covariance and correlation
  stem: 'Match each quantity to an equal expression.'
  pairs:
    - ['$\operatorname{Cov}(3X + 1,\ 2Y - 5)$', '6 Cov(X, Y)']
    - ['$\operatorname{Cov}(X, X)$', 'Var(X)']
    - ['$\operatorname{Var}(X + Y)$', 'Var(X) + Var(Y) + 2 Cov(X, Y)']
    - ['$\operatorname{Var}(X - Y)$', 'Var(X) + Var(Y) − 2 Cov(X, Y)']
  distractors: ['Var(X) − Var(Y)', '6 Cov(X, Y) − 5']
  explanation: |-
    Shifts do not change covariance and scale factors multiply, so the first is $3 \cdot 2\operatorname{Cov}(X, Y)$. The covariance of
    a variable with itself is its variance. Sums and differences both add the variances; only the sign of the
    covariance term changes.

- id: ps-m4-r2-q15
  lesson: ps-covariance
  type: order
  topic: Covariance and correlation
  stem: '$X$ and $Y$ have SDs 3 and 4. Put the correlations in order from the smallest $\operatorname{SD}(X + Y)$ to the largest.'
  items: ['$\rho = -0.5$', '$\rho = 0$', '$\rho = 0.5$', '$\rho = 1$']
  explanation: |-
    $\operatorname{Var}(X + Y) = 9 + 16 + 2\rho(3)(4) = 25 + 24\rho$: 13, 25, 37 and 49, so the SDs are about 3.61, 5, 6.08 and 7.
    The larger the correlation, the more the errors reinforce each other.

# ---- Lesson 18: sums of independent random variables
- id: ps-m4-r2-q16
  lesson: ps-sums
  type: text
  topic: Sums of random variables
  stem: 'Independent counts $X \sim$ Poisson(2) and $Y \sim$ Poisson(3) add to $X + Y \sim$ Poisson(___). Give only the number.'
  accept: ['5']
  explanation: |-
    Independent Poisson counts add to a Poisson count whose mean is the sum of the means: $2 + 3 = 5$. The MGF
    product $e^{2(e^t - 1)}e^{3(e^t - 1)} = e^{5(e^t - 1)}$ shows it.

- id: ps-m4-r2-q17
  lesson: ps-sums
  type: match
  module_quiz: true
  topic: Sums of random variables
  stem: 'All terms are independent. Match each sum to its distribution.'
  pairs:
    - ['Poisson$(\lambda_1)$ + Poisson$(\lambda_2)$', 'Poisson with mean λ1 + λ2']
    - ['Binomial$(n_1, p)$ + Binomial$(n_2, p)$', 'Binomial with n1 + n2 trials and success probability p']
    - ['$N(\mu_1, \sigma_1^2) + N(\mu_2, \sigma_2^2)$', 'Normal with mean μ1 + μ2 and variance σ1² + σ2²']
    - ['Sum of $n$ exponentials, each with mean $\theta$', 'Gamma with shape n and scale θ']
  distractors: ['Normal with mean μ1 + μ2 and SD σ1 + σ2', 'Exponential with mean nθ']
  explanation: |-
    These are the closure rules from the MGF method. For normals the variances add, not the SDs, and a sum of
    $n$ exponentials is gamma (shape $n$), not exponential.

- id: ps-m4-r2-q18
  lesson: ps-sums
  topic: Sums of random variables
  stem: 'Each pair of terms is independent. For which pairs is the sum in the same family as the terms? Select all that apply.'
  choices: ['Binomial(5, 0.3) and Binomial(8, 0.3)', 'Binomial(5, 0.3) and Binomial(5, 0.6)', 'Gamma(shape 2, scale 3) and Gamma(shape 4, scale 3)', 'Gamma(shape 2, scale 3) and Gamma(shape 2, scale 5)', 'Uniform(0, 1) and Uniform(0, 1)', '$N(1, 4)$ and $N(-2, 9)$']
  answer: [0, 2, 5]
  explanation: |-
    Binomials with the same $p$ add to Binomial(13, 0.3); gammas with the same scale add to Gamma(shape 6, scale 3);
    normals add to $N(-1, 13)$. Different $p$ or different scales break the MGF pattern, and two uniforms give a
    triangular density, not a uniform one.

- id: ps-m4-r2-q19
  lesson: ps-sums
  type: order
  topic: Sums of random variables
  stem: 'Put the steps of the MGF method for the distribution of $X + Y$ ($X$, $Y$ independent) in order.'
  items:
    - 'Write down $M_X(t)$ and $M_Y(t)$'
    - 'Multiply them: $M_{X+Y}(t) = M_X(t)M_Y(t)$, using independence'
    - 'Simplify the product'
    - 'Recognize the simplified product as the MGF of a known distribution'
    - 'Conclude by uniqueness that $X + Y$ has that distribution'
  explanation: |-
    The product rule needs both MGFs and independence; you can only recognize a product once it is simplified; and the
    uniqueness of MGFs (near $t = 0$) is what turns "same MGF" into "same distribution".

- id: ps-m4-r2-q20
  lesson: ps-sums
  type: text
  module_quiz: true
  topic: Sums of random variables
  stem: '$X_1$ and $X_2$ are iid with variance 9. Then $\operatorname{Var}(X_1 + X_2) =$ ___ and $\operatorname{Var}(2X_1) =$ ___.'
  accept:
    - ['18']
    - ['36']
  explanation: |-
    Variances of independent terms add: $9 + 9 = 18$. Doubling one variable multiplies its variance by $2^2$: $4 \times 9 = 36$.
    Two independent observations partly cancel each other's errors; one observation counted twice does not.

# ---- Lesson 19: conditional expectation
- id: ps-m4-r2-q21
  lesson: ps-cond-expectation
  type: text
  module_quiz: true
  topic: Conditional expectation
  stem: '$E[Y \mid X] = 3X + 1$ and $E[X] = 2$. Then $E[Y] =$ ___.'
  accept: ['7']
  explanation: |-
    By the law of total expectation, $E[Y] = E\big[E[Y \mid X]\big] = E[3X + 1] = 3(2) + 1 = 7$.

- id: ps-m4-r2-q22
  lesson: ps-cond-expectation
  type: text
  topic: Conditional expectation
  stem: 'The number of orders $N$ in a day is Poisson with mean 4. Each order''s size has mean 10 and SD 3, independently of each other and of $N$. For the total $T$, $\operatorname{Var}(T) =$ ___.'
  accept: ['436']
  explanation: |-
    Random sum: $\operatorname{Var}(T) = \sigma^2E[N] + \mu^2\operatorname{Var}(N) = 9(4) + 100(4) = 436$ (a Poisson count has variance equal to its
    mean). Forgetting the second term gives 36.

- id: ps-m4-r2-q23
  lesson: ps-cond-expectation
  type: match
  topic: Conditional expectation
  stem: 'Match each expression to what it is.'
  pairs:
    - ['$E[\operatorname{Var}(Y \mid X)]$', The average spread within each condition]
    - ['$\operatorname{Var}(E[Y \mid X])$', The spread of the conditional means]
    - ['$E\big[E[Y \mid X]\big]$', The overall mean of Y]
    - ['$E[Y \mid X]$', 'A random variable: a function of X']
  distractors: [The SD of Y, 'A single number that does not depend on X']
  explanation: |-
    The law of total variance splits $\operatorname{Var}(Y)$ into the within part $E[\operatorname{Var}(Y \mid X)]$ and the between part
    $\operatorname{Var}(E[Y \mid X])$. Averaging the conditional mean gives $E[Y]$. $E[Y \mid X]$ itself is random, because it depends on
    the value of $X$; only $E[Y \mid X = x]$ for a fixed $x$ is a number.

- id: ps-m4-r2-q24
  lesson: ps-cond-expectation
  module_quiz: true
  topic: Conditional expectation
  stem: 'Which statements are true for any random variables $X$ and $Y$ with finite variances? Select all that apply.'
  choices: ['$E[Y \mid X]$ is a random variable', '$\operatorname{Var}(Y) \ge E[\operatorname{Var}(Y \mid X)]$', '$\operatorname{Var}(Y) = E[\operatorname{Var}(Y \mid X)]$', '$E[Y \mid X]$ minimizes $E[(Y - h(X))^2]$ over all functions $h$', 'In a two-group mixture, the SD of $Y$ is the weighted average of the group SDs']
  answer: [0, 1, 3]
  explanation: |-
    $E[Y \mid X]$ depends on $X$, so it is random. Total variance adds the nonnegative between part
    $\operatorname{Var}(E[Y \mid X])$ to $E[\operatorname{Var}(Y \mid X)]$, so $\operatorname{Var}(Y)$ is at least the within part, with equality only when the
    conditional means do not vary. $E[Y \mid X]$ is the best mean-squared-error predictor. Averaging SDs in a
    mixture ignores the between part (and averages the wrong quantity).

- id: ps-m4-r2-q25
  lesson: ps-cond-expectation
  type: text
  topic: Conditional expectation
  stem: 'Half of a population is in group A (mean 10, variance 3) and half in group B (mean 14, variance 5). For a randomly chosen member, $\operatorname{Var}(Y) =$ ___.'
  accept: ['8']
  explanation: |-
    Within part: $0.5(3) + 0.5(5) = 4$. Overall mean 12, so the between part is $0.5(10 - 12)^2 + 0.5(14 - 12)^2 = 4$.
    Total variance $4 + 4 = 8$. Stopping at the within part gives 4.

# ---- Lesson 20: bivariate normal and order statistics
- id: ps-m4-r2-q26
  lesson: ps-bivariate-normal
  type: label
  module_quiz: true
  topic: Bivariate normal
  stem: 'The picture shows a density contour of a bivariate normal pair with $\rho = 0.6$, drawn in standard units. Name the numbered parts.'
  image: {src: images/ps-m4-bvn-lines-blank.svg, alt: 'An ellipse tilted up to the right with its centre marked. Three straight lines pass through the centre: a dashed line along the long axis of the ellipse, a flatter solid line, and a steeper dotted line.'}
  labels:
