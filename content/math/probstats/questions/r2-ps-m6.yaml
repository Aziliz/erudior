# Round 2, module ps-m6 (Estimation): new question types for core lessons 23-29 and three honors lessons.
# ---------------------------------------------------------------- Lesson 23: sampling distributions
- id: ps-m6-r2-q01
  lesson: ps-sampling-normal
  module_quiz: true
  topic: Sampling distributions
  type: label
  stem: 'Each numbered panel shows one density on its own axes. Name the distribution in each panel.'
  image: {src: images/ps-m6-families-blank.svg, alt: 'Four density curves in separate panels. Panel 1: right-skewed on 0 to 16, peaking near 3 at height about 0.15. Panel 2: right-skewed on 0 to 4, peaking below 1 at height about 0.7. Panel 3: a symmetric bell on minus 4 to 4 with peak about 0.35 and tails that stay visibly above the axis at plus and minus 4. Panel 4: a symmetric bell on minus 4 to 4 with peak about 0.40 and tails that reach the axis by plus and minus 3.'}
  labels:
    - {x: 16.2, y: 10.9, text: Chi-square with 5 df}
    - {x: 66.2, y: 10.8, text: F with 5 and 10 df}
    - {x: 27.1, y: 58.6, text: t with 2 df}
    - {x: 77.1, y: 54.9, text: Standard normal}
  distractors: [Exponential with mean 1, Uniform on 0 to 1]
  explanation: |-
    Chi-square and $F$ live on the positive axis and are right-skewed. A $\chi^2_\nu$ variable has mean $\nu$, so the curve spread over 0 to 16 and centered near 4 or 5 is chi-square with 5 df (1); an $F$ ratio of two chi-squares each divided by its df is centered near 1, so the curve on 0 to 4 is $F$ (2). Of the two bells, the $t$ has the lower peak (about 0.35 for 2 df) and heavier tails (3); the standard normal peaks at $1/\sqrt{2\pi} \approx 0.40$ and its tails die out by $\pm 3$ (4). An exponential density would be highest at 0, and a uniform one flat.

- id: ps-m6-r2-q02
  lesson: ps-sampling-normal
  topic: Sampling distributions
  type: text
  stem: 'If $T \sim t_9$, then $T^2$ has an $F$ distribution with ___ numerator degrees of freedom and ___ denominator degrees of freedom.'
  accept:
    - ['1']
    - ['9']
  explanation: |-
    $T = Z/\sqrt{V/9}$ with $V \sim \chi^2_9$, so $T^2 = \dfrac{Z^2/1}{V/9}$. Since $Z^2 \sim \chi^2_1$, this is a ratio of independent chi-squares each divided by its df: $F_{1, 9}$, numerator df first.

- id: ps-m6-r2-q03
  lesson: ps-sampling-normal
  topic: Sampling distributions
  type: match
  stem: '$Z, Z_1, Z_2, \dots$ are iid standard normal, and $U \sim \chi^2_3$ and $V \sim \chi^2_6$ are independent of each other and of the $Z$s. Match each quantity to its distribution.'
  pairs:
    - ['$Z_1^2 + Z_2^2 + \cdots + Z_6^2$', 'Chi-square, 6 df']
    - ['$Z/\sqrt{V/6}$', 't, 6 df']
    - ['$\dfrac{U/3}{V/6}$', 'F, 3 and 6 df']
    - ['$9S^2/\sigma^2$ for a normal sample of size 10', 'Chi-square, 9 df']
    - ['$(\bar X - \mu)/(S/\sqrt 7)$ for a normal sample of size 7', 't, 6 df']
  distractors: ['Chi-square, 10 df', 'F, 6 and 3 df']
  explanation: |-
    A sum of 6 squared standard normals is $\chi^2_6$. $Z$ over the root of an independent chi-square divided by its df is $t$ with that df. The ratio of chi-squares over their df is $F$ with numerator df first ($F_{3,6}$, not $F_{6,3}$). For a normal sample, $(n-1)S^2/\sigma^2 \sim \chi^2_{n-1}$ (9 df, not 10), and the studentized mean is $t_{n-1} = t_6$.

- id: ps-m6-r2-q04
  lesson: ps-sampling-normal
  topic: Sampling distributions
  stem: 'For a random sample of size $n \ge 2$ from $N(\mu, \sigma^2)$, which statements are true? Select all that apply.'
  choices: ['$\bar X$ and $S^2$ are independent', '$E[S^2] = \sigma^2$', '$(n-1)S^2/\sigma^2 \sim \chi^2_n$', '$\operatorname{Var}(S^2) = 2\sigma^4/(n-1)$', '$(\bar X - \mu)/(S/\sqrt n)$ is standard normal']
  answer: [0, 1, 3]
  explanation: |-
    For normal data $\bar X$ and $S^2$ are independent, and $(n-1)S^2/\sigma^2 \sim \chi^2_{n-1}$ (not $n$ df: one df is used up by $\bar X$). From the chi-square mean $n-1$ and variance $2(n-1)$: $E[S^2] = \sigma^2$ and $\operatorname{Var}(S^2) = \frac{\sigma^4}{(n-1)^2}\cdot 2(n-1) = \frac{2\sigma^4}{n-1}$. Replacing $\sigma$ by $S$ gives $t_{n-1}$, not the standard normal.

- id: ps-m6-r2-q05
  lesson: ps-sampling-normal
  module_quiz: true
  topic: Sampling distributions
  type: order
  stem: 'Order these tail probabilities from smallest to largest.'
  items: ['$P(Z > 2)$, $Z$ standard normal', '$P(t_{15} > 2)$', '$P(t_5 > 2)$', '$P(t_2 > 2)$']
  explanation: |-
    The fewer the degrees of freedom, the heavier the $t$ tail: $P(Z > 2) \approx 0.023$, $P(t_{15} > 2) \approx 0.032$, $P(t_5 > 2) \approx 0.051$ and $P(t_2 > 2) \approx 0.092$. As the df grow, $t$ approaches the normal from above in the tails.

# ---------------------------------------------------------------- Lesson 24: point estimators
- id: ps-m6-r2-q06
  lesson: ps-point-estimators
  module_quiz: true
  topic: Properties of estimators
  type: label
  stem: 'Each target''s bullseye is the true parameter, and each dot is the estimate from one sample. Describe each numbered estimator.'
  image: {src: images/ps-m6-targets-blank.svg, alt: 'Four targets with nine dots each. Target 1: the dots are tightly clustered on the bullseye. Target 2: the dots are widely scattered but centered on the bullseye. Target 3: the dots are tightly clustered up and to the right of the bullseye. Target 4: the dots are widely scattered and centered up and to the right of the bullseye.'}
  labels:
    - {x: 11.2, y: 8.5, text: 'Low bias, low variance'}
    - {x: 58.4, y: 8.5, text: 'Low bias, high variance'}
    - {x: 11.2, y: 55.1, text: 'High bias, low variance'}
    - {x: 58.4, y: 55.1, text: 'High bias, high variance'}
  explanation: |-
    Bias is how far the center of the cloud sits from the bullseye; variance is how spread out the cloud is. Targets 1 and 2 are centered on the bullseye (low bias), 3 and 4 are centered off it (high bias). Targets 1 and 3 are tight (low variance), 2 and 4 are spread out (high variance). Note that target 3 may well have a smaller MSE than target 2.

- id: ps-m6-r2-q07
  lesson: ps-point-estimators
  topic: Properties of estimators
  type: text
  stem: 'An estimator has bias $0.3$ and variance $0.16$. Its mean squared error is ___.'
  accept: ['0.25', '1/4']
  explanation: |-
    $\operatorname{MSE} = \operatorname{Var} + \operatorname{Bias}^2 = 0.16 + 0.3^2 = 0.16 + 0.09 = 0.25$. (Adding the bias without squaring gives 0.46.)

- id: ps-m6-r2-q08
  lesson: ps-point-estimators
  topic: Properties of estimators
  stem: 'Which of these estimators are unbiased for the parameter named? Select all that apply.'
  choices: ['$\bar X$ for $\mu$', '$S^2$ for $\sigma^2$', '$S$ for $\sigma$', '$\frac1n\sum(X_i - \bar X)^2$ for $\sigma^2$', '$X_1$ alone for $\mu$', '$2\bar X$ for $\theta$, when the data are Uniform$(0, \theta)$']
  answer: [0, 1, 4, 5]
  explanation: |-
    $E[\bar X] = \mu$ and $E[S^2] = \sigma^2$. $E[X_1] = \mu$ too: unbiased, though not consistent. For Uniform$(0, \theta)$, $E[\bar X] = \theta/2$, so $E[2\bar X] = \theta$. Dividing by $n$ gives mean $\frac{n-1}{n}\sigma^2$, biased low; and $S$ is biased low for $\sigma$ because $(E[S])^2 = E[S^2] - \operatorname{Var}(S) < \sigma^2$.

- id: ps-m6-r2-q09
  lesson: ps-point-estimators
  module_quiz: true
  topic: Properties of estimators
  type: match
  stem: 'Match each term to its meaning.'
  pairs:
    - [Bias, Mean of the estimator minus the parameter]
    - [Mean squared error, Variance plus squared bias]
    - [Consistent, Converges in probability to the parameter as n grows]
    - [Relative efficiency, Ratio of the variances of two unbiased estimators]
    - [Standard error, Standard deviation of the estimator's sampling distribution]
  distractors: [Probability that the estimate equals the parameter]
  explanation: |-
    Bias is $E[\hat\theta] - \theta$; MSE is $E[(\hat\theta - \theta)^2] = \operatorname{Var} + \operatorname{Bias}^2$; consistency is $\hat\theta_n \xrightarrow{P} \theta$; relative efficiency of $\hat\theta_1$ to $\hat\theta_2$ is $\operatorname{Var}(\hat\theta_2)/\operatorname{Var}(\hat\theta_1)$; the standard error is the SD of the sampling distribution. For a continuous estimator the probability of hitting $\theta$ exactly is 0, so that description fits nothing.

- id: ps-m6-r2-q10
  lesson: ps-point-estimators
  topic: Properties of estimators
  type: text
  stem: 'For a sample of $n = 25$ Poisson$(\lambda)$ observations with $\lambda = 4$, the Cramér–Rao lower bound on the variance of an unbiased estimator of $\lambda$ is ___.'
  accept: ['0.16', '4/25']
  explanation: |-
    For the Poisson, $I(\lambda) = 1/\lambda$, so the bound is $\dfrac{1}{nI(\lambda)} = \dfrac{\lambda}{n} = \dfrac{4}{25} = 0.16$. The sample mean has exactly this variance, so it is efficient.

# ---------------------------------------------------------------- Lesson 25: method of moments and MLE
- id: ps-m6-r2-q11
  lesson: ps-mle
  module_quiz: true
  topic: Maximum likelihood
  type: order
  stem: 'Put the steps for finding the MLE of the mean lifetime $1/\lambda$ from exponential data in order.'
  items: ['Write $L(\lambda) = \lambda^n e^{-\lambda\sum x_i}$', 'Take logs: $\ell(\lambda) = n\ln\lambda - \lambda\sum x_i$', 'Differentiate: $\ell''(\lambda) = n/\lambda - \sum x_i$', 'Solve $\ell''(\lambda) = 0$: $\hat\lambda = n/\sum x_i$', 'Use invariance: the MLE of $1/\lambda$ is $\bar x$']
  explanation: |-
    Each step uses the result of the one before: the likelihood is the product of $\lambda e^{-\lambda x_i}$, its log is easier to differentiate, setting the derivative to zero gives $\hat\lambda = 1/\bar x$, and invariance turns that into the MLE $1/\hat\lambda = \bar x$ of the mean lifetime.

- id: ps-m6-r2-q12
  lesson: ps-mle
  topic: Maximum likelihood
  type: text
  stem: 'Daily counts $3, 1, 4, 0, 2$ are modeled as Poisson$(\lambda)$. The MLE of $\lambda$ is ___, and by invariance the MLE of $P(X = 0) = e^{-\lambda}$, to 3 decimal places, is ___.'
  accept:
    - ['2']
    - ['0.135', 'e^-2', 'e^(-2)']
  explanation: |-
    The Poisson MLE is $\hat\lambda = \bar x = 10/5 = 2$. The MLE of $e^{-\lambda}$ is $e^{-\hat\lambda} = e^{-2} \approx 0.135$.

- id: ps-m6-r2-q13
  lesson: ps-mle
  topic: Maximum likelihood
  stem: 'For which models must the MLE be found from the shape of $L(\theta)$ rather than by solving $\ell''(\theta) = 0$, because the support depends on $\theta$? Select all that apply.'
  choices: ['Uniform$(0, \theta)$', 'Shifted exponential, $f(x) = e^{-(x - \theta)}$ for $x \ge \theta$', 'Uniform$(-\theta, \theta)$', 'Normal with unknown mean $\theta$ and known variance', 'Poisson$(\theta)$', 'Exponential with rate $\theta$']
  answer: [0, 1, 2]
  explanation: |-
    When the support depends on $\theta$, $L$ is zero for impossible $\theta$ and jumps at a boundary. Uniform$(0, \theta)$: $L = \theta^{-n}$ for $\theta \ge \max x_i$, decreasing, so $\hat\theta = \max x_i$. Shifted exponential: $L = e^{-\sum(x_i - \theta)}$ for $\theta \le \min x_i$, increasing, so $\hat\theta = \min x_i$. Uniform$(-\theta, \theta)$: $L = (2\theta)^{-n}$ for $\theta \ge \max|x_i|$, so $\hat\theta = \max|x_i|$. The normal, Poisson and exponential models have fixed supports and smooth likelihoods solved by calculus.

- id: ps-m6-r2-q14
  lesson: ps-mle
  module_quiz: true
  topic: Maximum likelihood
  type: match
  stem: 'Match each parameter to its maximum likelihood estimator.'
  pairs:
    - ['$\lambda$ in Poisson$(\lambda)$', Sample mean]
    - ['$\mu$ in $N(\mu, \sigma^2)$', Sample mean]
    - ['Rate $\lambda$ of an exponential', One over the sample mean]
    - ['$\theta$ in Uniform$(0, \theta)$', Sample maximum]
    - ['$\sigma^2$ in $N(\mu, \sigma^2)$, both unknown', Average squared deviation from the sample mean (divide by n)]
  distractors: [Sample median, Sample variance S² (divide by n − 1), Twice the sample mean]
  explanation: |-
    Poisson and normal means: $\bar x$. Exponential rate: $1/\bar x$. Uniform$(0, \theta)$: the maximum, since $L$ decreases on $[\max x_i, \infty)$ ($2\bar x$ is the method-of-moments estimator). Normal variance: $\frac1n\sum(x_i - \bar x)^2$, which divides by $n$, not $n - 1$.

- id: ps-m6-r2-q15
  lesson: ps-mle
  topic: Method of moments
  type: text
  stem: 'Five readings from Uniform$(0, \theta)$ are $1.0, 2.6, 0.8, 3.1, 1.5$. The method-of-moments estimate of $\theta$ is ___ and the MLE is ___.'
  accept:
    - ['3.6']
    - ['3.1']
  explanation: |-
    MoM: $E[X] = \theta/2 = \bar x = 9/5 = 1.8$, so $\tilde\theta = 3.6$. MLE: the largest observation, $3.1$. Here the MoM estimate is plausible; with other data (as in the lesson) it can fall below the maximum, which is impossible.

# ---------------------------------------------------------------- Lesson 26: Rao-Blackwell and MVUE
- id: ps-m6-r2-q16
  lesson: ps-mvue
  module_quiz: true
  topic: Minimum-variance unbiased estimation
  type: order
  stem: 'Put the steps for finding the MVUE of $e^{-\lambda}$ from $n$ Poisson counts in order.'
  items: ['Find a sufficient statistic: $T = \sum X_i$', 'Find the conditional distribution of $X_1$ given $T = t$: Binomial$(t, 1/n)$', 'Rao–Blackwellize $1\{X_1 = 0\}$: $E[1\{X_1 = 0\} \mid T] = (1 - 1/n)^T$', 'Use completeness of $T$ (Lehmann–Scheffé): $(1 - 1/n)^T$ is the unique MVUE']
  explanation: |-
    The conditional distribution needs $T$; the conditional expectation needs that distribution; and Lehmann–Scheffé applies to the resulting unbiased function of the complete sufficient statistic.

- id: ps-m6-r2-q17
  lesson: ps-mvue
  topic: Minimum-variance unbiased estimation
  type: text
  stem: 'Ten Bernoulli trials give $T = 4$ successes. The MVUE of $p^2$ is $\dfrac{T(T-1)}{n(n-1)}$; here its value is ___ (as a fraction, or a decimal to 3 places).'
  accept: ['2/15', '12/90', '0.133']
  explanation: |-
    $\dfrac{4 \cdot 3}{10 \cdot 9} = \dfrac{12}{90} = \dfrac{2}{15} \approx 0.133$. The plug-in $\hat p^2 = 0.16$ is biased upward.

- id: ps-m6-r2-q18
  lesson: ps-mvue
  topic: Minimum-variance unbiased estimation
  stem: 'Which statistics are complete and sufficient for the model given? Select all that apply.'
  choices: ['$\sum X_i$ for an iid Poisson$(\lambda)$ sample', '$\sum X_i$ for an iid Bernoulli$(p)$ sample', '$X_{(n)}$ for an iid Uniform$(0, \theta)$ sample', 'The pair $(X_1, X_2)$ for two Poisson$(\lambda)$ observations', '$X_1$ alone for an iid Poisson$(\lambda)$ sample of size 5', '$(\bar X, S^2)$ for an iid $N(\mu, \sigma^2)$ sample, both unknown']
  answer: [0, 1, 2, 5]
  explanation: |-
    Poisson and Bernoulli are exponential families, so $\sum X_i$ is complete sufficient; the uniform maximum and the normal pair $(\bar X, S^2)$ are complete sufficient too. The full pair $(X_1, X_2)$ is sufficient but not complete: $X_1 - X_2$ has mean zero without being zero. $X_1$ alone is not sufficient: the other four counts carry information about $\lambda$.

- id: ps-m6-r2-q19
  lesson: ps-mvue
  module_quiz: true
  topic: Minimum-variance unbiased estimation
  type: match
  stem: 'Match each result to what it says.'
  pairs:
    - [Rao–Blackwell theorem, Conditioning an unbiased estimator on a sufficient statistic never increases its variance]
    - [Lehmann–Scheffé theorem, An unbiased function of a complete sufficient statistic is the unique MVUE]
    - [Factorization theorem, A statistic is sufficient when the joint density splits into a part depending on the data only through it and a part free of the parameter]
    - [Completeness, The only function of the statistic with mean zero for every parameter value is zero]
    - [Cramér–Rao bound, A floor on the variance of unbiased estimators in regular families]
  distractors: [The MLE is approximately normal for large samples]
  explanation: |-
    These are the four tools of the lesson plus the bound from the point-estimators lesson. The asymptotic normality of the MLE is a separate large-sample result, not one of these.

- id: ps-m6-r2-q20
  lesson: ps-mvue
  topic: Minimum-variance unbiased estimation
  stem: 'Following the recipe chart, which estimator of an exponential rate $\lambda$ from $n \ge 2$ observations is the MVUE, where $T = \sum X_i$?'
  choices: ['$n/T$', '$T/n$', '$(n - 1)/T$', '$(n + 1)/T$']
  answer: 2
  explanation: |-
    $T$ is complete sufficient (exponential family), and $T \sim$ Gamma(shape $n$, scale $1/\lambda$) has $E[1/T] = \lambda/(n-1)$. So $(n-1)/T$ is an unbiased function of $T$, hence the MVUE. The MLE $n/T$ is biased upward; $T/n$ estimates the mean $1/\lambda$, not the rate.

# ---------------------------------------------------------------- Lesson 27: confidence intervals
- id: ps-m6-r2-q21
  lesson: ps-confidence-intervals
  module_quiz: true
  topic: Confidence intervals
  type: label
  stem: 'The picture shows the density of the pivot $T = (\bar X - \mu)/(S/\sqrt n)$ used for a $100(1 - \alpha)\%$ interval. Name each numbered part.'
  image: {src: images/ps-m6-pivot-areas-blank.svg, alt: 'A bell-shaped density centered at 0. Two dashed vertical lines are placed symmetrically left and right of 0. Marker 1 is in the large shaded region between the lines, marker 2 is in the thin shaded tail beyond the right line, marker 3 is below the left line and marker 4 is below the right line.'}
  labels:
    - {x: 50.0, y: 50.2, text: Central area 1 − α}
    - {x: 80.6, y: 76.9, text: Tail area α/2}
    - {x: 25.5, y: 87.9, text: Lower cutoff −t(α/2)}
    - {x: 74.5, y: 87.9, text: Upper cutoff t(α/2)}
  distractors: [Tail area α, The sample mean x̄]
  explanation: |-
    The cutoffs $\pm t_{\alpha/2, n-1}$ leave area $\alpha/2$ in each tail, so the central area is $1 - \alpha$. Rearranging $-t_{\alpha/2} \le T \le t_{\alpha/2}$ gives $\bar X \pm t_{\alpha/2}S/\sqrt n$. Each tail holds $\alpha/2$, not $\alpha$, and the horizontal axis is the pivot's value, not $\bar x$.

- id: ps-m6-r2-q22
  lesson: ps-confidence-intervals
  topic: Confidence intervals
  type: text
  stem: 'A 95% $t$ interval for a mean from $n = 12$ normal observations uses ___ degrees of freedom; a pooled two-sample $t$ interval with sample sizes 10 and 12 uses ___ degrees of freedom.'
  accept:
    - ['11']
    - ['20']
  explanation: |-
    One sample: $n - 1 = 11$. Pooled: $n_1 + n_2 - 2 = 20$, since one df is used for each sample mean.

- id: ps-m6-r2-q23
  lesson: ps-confidence-intervals
  topic: Confidence intervals
  type: order
  stem: 'Put the steps of the pivotal-quantity recipe in order.'
  items: ['Find a pivot $Q$ whose distribution is completely known', 'Choose $a$ and $b$ with $P(a \le Q \le b) = 1 - \alpha$', 'Rearrange $a \le Q \le b$ into $L \le \theta \le U$', 'Plug in the observed data to get numbers for $L$ and $U$']
  explanation: |-
    The cutoffs come from the pivot's distribution; the rearrangement needs the cutoffs; and only the final formulas are evaluated on the data.

- id: ps-m6-r2-q24
  lesson: ps-confidence-intervals
  topic: Confidence intervals
  stem: 'A 95% $t$ interval for a mean $\mu$ is $(45.69, 50.91)$. Which statements are correct? Select all that apply.'
  choices: ['About 95% of intervals built this way, over repeated samples, cover the true $\mu$', 'There is a 95% probability that $\mu$ lies between 45.69 and 50.91', 'A 99% interval from the same data would be wider', 'Quadrupling the sample size would roughly halve the width', 'About 95% of the data values lie between 45.69 and 50.91']
  answer: [0, 2, 3]
  explanation: |-
    Confidence describes the method's long-run coverage; once computed, this interval either contains the fixed $\mu$ or not. Higher confidence needs a larger cutoff, so a wider interval. The width is proportional to $1/\sqrt n$, so $4n$ halves it (roughly, as $s$ and the $t$ cutoff also change a little). The interval is about the mean, not individual values, which are far more spread out.

- id: ps-m6-r2-q25
  lesson: ps-confidence-intervals
  module_quiz: true
  topic: Confidence intervals
  type: match
  stem: 'Match each situation to the confidence interval to use.'
  pairs:
    - [Mean of normal data with known σ, z interval]
    - [Mean of normal data with unknown σ and n = 12, t interval with n − 1 df]
    - [Variance of normal data, Chi-square interval with n − 1 df]
    - [Difference of two normal means with equal variances assumed, Pooled t interval]
    - [Difference of two normal means with variances not assumed equal, Welch's t interval]
  distractors: [F interval for a mean]
  explanation: |-
    Known $\sigma$: the $z$ pivot. Unknown $\sigma$: the $t_{n-1}$ pivot. A variance: $(n-1)S^2/\sigma^2 \sim \chi^2_{n-1}$. Two means: pooled $t$ with $n_1 + n_2 - 2$ df under equal variances, Welch's approximate $t$ otherwise.

# ---------------------------------------------------------------- Lesson 28: bootstrap
- id: ps-m6-r2-q26
  lesson: ps-bootstrap
  module_quiz: true
  topic: Bootstrap and resampling
  type: order
  stem: 'Put the steps for a bootstrap standard error in order.'
  items: ['Draw $n$ values from the data with replacement', 'Compute the statistic on that resample', 'Repeat until there are $B$ replicates', 'Take the standard deviation of the $B$ replicates']
  explanation: |-
    Each replicate comes from one resample; only after all $B$ replicates exist can their standard deviation be taken.

- id: ps-m6-r2-q27
  lesson: ps-bootstrap
  topic: Bootstrap and resampling
  type: text
  stem: 'With $n = 50$ observations, the probability that a particular observation is left out of a bootstrap sample is $(1 - 1/50)^{50} \approx$ ___ (3 decimal places).'
  accept: ['0.364']
  explanation: |-
    $0.98^{50} \approx 0.364$, close to the limit $e^{-1} \approx 0.368$. So a bootstrap sample contains about 64% of the distinct observations.

- id: ps-m6-r2-q28
  lesson: ps-bootstrap
  module_quiz: true
  topic: Bootstrap and resampling
  stem: 'Which statements about resampling are correct? Select all that apply.'
  choices: ['Bootstrap resamples are drawn with replacement', 'Each bootstrap resample has the same size $n$ as the data', 'Increasing $B$ makes the standard error of the statistic smaller', 'The 2.5th and 97.5th percentiles of the replicates give a 95% percentile interval', 'The bootstrap works well for the sample maximum', 'A permutation test reshuffles group labels without replacement']
  answer: [0, 1, 3, 5]
  explanation: |-
    Resamples are size-$n$ draws with replacement, and the percentile interval uses the replicates' 2.5th and 97.5th percentiles. A larger $B$ only reduces Monte Carlo noise in the *estimate* of the SE; the SE itself is set by $n$. The bootstrap fails for the maximum, since a resample reproduces the sample maximum with probability about 0.632. Permutation tests shuffle without replacement.

- id: ps-m6-r2-q29
  lesson: ps-bootstrap
  topic: Bootstrap and resampling
  type: match
  stem: 'Match each situation to the right way to resample.'
  pairs:
    - [Paired before-and-after measurements, Resample the pairs]
    - [Two independent groups, Resample within each group]
    - [Data fitted well by an exponential model, Draw samples from the fitted model (parametric bootstrap)]
    - [Testing whether group labels matter, Shuffle the labels without replacement (permutation test)]
  distractors: [Pool both groups and resample with replacement, ignoring groups]
  explanation: |-
    Resample the way the data were generated: pairs stay together, groups keep their sizes, a trusted model can be resampled directly, and a test of "labels don't matter" reshuffles the labels. Pooling the groups destroys the structure the interval is about.

- id: ps-m6-r2-q30
  lesson: ps-bootstrap
  topic: Bootstrap and resampling
  type: text
  stem: 'For the data $2, 4, 9$, the ideal bootstrap standard error of the mean (as $B \to \infty$) is $\hat\sigma/\sqrt n$, where $\hat\sigma^2$ divides by $n$. Its value, to 2 decimal places, is ___.'
  accept: ['1.70', '1.7']
  explanation: |-
    $\bar x = 5$; squared deviations $9 + 1 + 16 = 26$; $\hat\sigma^2 = 26/3 \approx 8.667$; SE $= \sqrt{8.667/3} = \sqrt{2.889} \approx 1.70$. The usual $s/\sqrt n = \sqrt{13/3} \approx 2.08$ is larger by the factor $\sqrt{n/(n-1)}$.

# ---------------------------------------------------------------- Lesson 29: Bayesian inference
- id: ps-m6-r2-q31
  lesson: ps-bayes-inference
  module_quiz: true
  topic: Bayesian inference
  type: order
  stem: 'Put the steps of a conjugate Bayesian analysis of a defect rate in order.'
  items: ['Before seeing data, choose a prior such as Beta(2, 8)', 'Observe the data and write the likelihood', 'Multiply likelihood by prior and drop factors without $\theta$', 'Recognize the posterior family, such as Beta(5, 25)', 'Report the posterior mean and a credible interval']
  explanation: |-
    The prior expresses beliefs before the data; the posterior is likelihood times prior, identified by its shape; summaries come from the posterior.

- id: ps-m6-r2-q32
  lesson: ps-bayes-inference
  topic: Bayesian inference
  type: text
  stem: 'A Beta(3, 7) prior is updated with 6 successes in 10 trials. The posterior is Beta( ___ , ___ ), with posterior mean ___ .'
  accept:
    - ['9']
    - ['11']
    - ['0.45', '9/20']
  explanation: |-
    Add successes to $a$ and failures to $b$: Beta$(3 + 6,\; 7 + 4) = $ Beta$(9, 11)$. Mean $9/20 = 0.45$, between the prior mean 0.3 and the sample proportion 0.6, with equal weights since $a + b = n = 10$.

- id: ps-m6-r2-q33
  lesson: ps-bayes-inference
  topic: Bayesian inference
  stem: 'In the normal–normal model with known $\sigma$, which statements are true? Select all that apply.'
  choices: ['Posterior precision = prior precision + $n/\sigma^2$', 'The posterior mean is a precision-weighted average of $\mu_0$ and $\bar x$', 'The posterior variance can exceed the prior variance', 'As $\tau_0 \to \infty$, the 95% credible interval approaches $\bar x \pm 1.96\sigma/\sqrt n$', 'The posterior mean is the simple average of $\mu_0$ and $\bar x$']
  answer: [0, 1, 3]
  explanation: |-
    Precisions add, so the posterior variance $\tau_n^2$ is smaller than both $\tau_0^2$ and $\sigma^2/n$. The posterior mean weights $\mu_0$ and $\bar x$ by their precisions, not equally. With a flat prior ($\tau_0 \to \infty$) the data precision dominates and the credible interval matches the $z$ confidence interval numerically.

- id: ps-m6-r2-q34
  lesson: ps-bayes-inference
  module_quiz: true
  topic: Bayesian inference
  type: match
  stem: 'Match each Bayesian term to its description.'
  pairs:
    - [Prior distribution, Beliefs about the parameter before the data]
    - [Likelihood, Probability of the observed data as a function of the parameter]
    - [Posterior distribution, Beliefs after the data; proportional to likelihood times prior]
    - [MAP estimate, Where the posterior density is highest]
    - [Credible interval, An interval with a stated posterior probability of containing the parameter]
  distractors: [Long-run fraction of intervals that cover the parameter]
  explanation: |-
    These are the pieces of the updating cycle. The long-run coverage of a procedure is the frequentist meaning of a confidence level, not a Bayesian quantity.

- id: ps-m6-r2-q35
  lesson: ps-bayes-inference
  topic: Bayesian inference
  stem: 'Two analysts start with priors Beta(2, 8) and Beta(8, 2), whose means differ by 0.6. Both then observe 30 successes in 100 trials. By about how much do their posterior means differ?'
  choices: ['0.6', '0.05', '0.3', '0']
  answer: 1
  explanation: |-
    The posteriors are Beta(32, 78) and Beta(38, 72), with means $32/110 \approx 0.291$ and $38/110 \approx 0.345$: a difference of about 0.05. Each prior is worth 10 observations against 100 from the data, so the prior weight is $10/110$ and the original gap of 0.6 shrinks to $0.6 \times 10/110 \approx 0.055$. It does not vanish entirely.

# ================================================================ Honors 1: numerical MLEs and information
- id: ps-m6-r2-h01
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'At the true parameter value, what are the mean and variance of the score $U(\theta) = \ell''(\theta)$ for an iid sample of size $n$?'
  choices: ['Mean 0, variance $nI(\theta)$', 'Mean 0, variance $1/(nI(\theta))$', 'Mean $\theta$, variance $nI(\theta)$', 'Mean $nI(\theta)$, variance 0']
  answer: 0
  explanation: |-
    Each term $\partial_\theta \ln f(X_i; \theta)$ has mean 0 (differentiate $\int f = 1$) and variance $I(\theta)$, so the sum has mean 0 and variance $nI(\theta)$. The reciprocal $1/(nI)$ is the approximate variance of the MLE, not of the score.

- id: ps-m6-r2-h02
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'Which is the Newton update for maximizing a log-likelihood?'
  choices: ['$\theta_{k+1} = \theta_k + \ell''(\theta_k)\,\ell''''(\theta_k)$', '$\theta_{k+1} = \theta_k - \ell(\theta_k)/\ell''(\theta_k)$', '$\theta_{k+1} = \theta_k - \ell''(\theta_k)/\ell''''(\theta_k)$', '$\theta_{k+1} = \theta_k - \ell''''(\theta_k)/\ell''(\theta_k)$']
  answer: 2
  explanation: |-
    Newton's method finds a zero of the score $\ell'$: follow its tangent line, $\ell'(\theta_k) + \ell''(\theta_k)(\theta - \theta_k) = 0$, to get $\theta_{k+1} = \theta_k - \ell'(\theta_k)/\ell''(\theta_k)$. Dividing $\ell$ by $\ell'$ would look for a zero of $\ell$ itself, which is not the goal.

- id: ps-m6-r2-h03
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'At $\theta_0 = 2$ a log-likelihood has $\ell''(2) = 3$ and $\ell''''(2) = -6$. Where does one Newton step land?'
  choices: ['1.5', '2.5', '20', '2']
  answer: 1
  explanation: |-
    $\theta_1 = 2 - \dfrac{3}{-6} = 2 + 0.5 = 2.5$. The score is positive, so the log-likelihood is still rising and the step goes up; 1.5 comes from a sign slip.

- id: ps-m6-r2-h04
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'An MLE is $\hat\theta = 3.2$ with observed information $J(\hat\theta) = 25$. What is the 95% Wald interval?'
  choices: ['$(3.192,\; 3.208)$', '$(-6.6,\; 13.0)$', '$(2.416,\; 3.984)$', '$(2.808,\; 3.592)$']
  answer: 3
  explanation: |-
    $\text{SE} = 1/\sqrt{J} = 1/5 = 0.2$, so the interval is $3.2 \pm 1.96 \times 0.2 = 3.2 \pm 0.392$. Using $1/J = 0.04$ as the SE gives the first (too narrow) choice; using $\sqrt J = 5$ as the SE gives the second; doubling the margin gives the third.

- id: ps-m6-r2-h05
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'In the sketch of why $\sqrt n(\hat\theta - \theta)$ is approximately normal, which result makes the denominator $-U''(\theta)/n$ close to $I(\theta)$?'
  choices: ['The Central Limit Theorem', 'The law of large numbers', 'The invariance property', 'The Cramér–Rao bound']
  answer: 1
  explanation: |-
    $-U'(\theta)/n = -\frac1n\sum \partial^2_\theta \ln f(X_i; \theta)$ is an average of iid terms with mean $I(\theta)$, so the LLN makes it close to $I(\theta)$. The CLT handles the numerator $U(\theta)/\sqrt n$.

- id: ps-m6-r2-h06
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'Fisher scoring replaces $-\ell''''(\theta_k)$ by $nI(\theta_k)$ in the Newton step. Why does this often make the early steps steadier?'
  choices: ['$nI(\theta_k)$ is always zero', '$nI(\theta_k)$ never needs to be computed', '$nI(\theta_k)$ is always positive, so each step points uphill', '$nI(\theta_k)$ makes every step land exactly on the MLE']
  answer: 2
  explanation: |-
    Away from the peak, $\ell''$ can be close to zero or even positive, sending Newton far off or toward a minimum. The expected information is positive, so the scoring step always has the sign of $\ell'$, the uphill direction. In Example 1, scoring went $1.5 \to 0.912 \to 0.874$ without overshooting.

- id: ps-m6-r2-h07
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'For two parameters, the information matrix of the whole sample is $\begin{pmatrix} 40 & 12 \\ 12 & 5 \end{pmatrix}$. What is the approximate standard error of the first estimate?'
  choices: ['0.299', '0.158', '0.089', '0.447']
  answer: 0
  explanation: |-
    The covariance matrix is the inverse: determinant $40 \cdot 5 - 12^2 = 56$, so the first diagonal entry is $5/56 \approx 0.0893$ and the SE is $\sqrt{0.0893} \approx 0.299$. $1/\sqrt{40} = 0.158$ ignores the second parameter, 0.089 forgets the square root, and $1/\sqrt 5$ uses the wrong entry.

- id: ps-m6-r2-h08
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'For $N(\mu, \sigma^2)$ the information per observation for $\sigma^2$ is $1/(2\sigma^4)$, and $\hat\mu$ and $\hat\sigma^2$ are asymptotically uncorrelated. With $n = 50$ and $\hat\sigma^2 = 4$, what is the approximate standard error of $\hat\sigma^2$?'
  choices: ['0.4', '0.283', '1.6', '0.8']
  answer: 3
  explanation: |-
    $\operatorname{Var}(\hat\sigma^2) \approx \dfrac{1}{nI} = \dfrac{2\sigma^4}{n} = \dfrac{2 \times 16}{50} = 0.64$, so SE $\approx 0.8$. Because the matrix is diagonal, the reciprocal of the single entry is correct here.

- id: ps-m6-r2-h09
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'How does the likelihood interval $\{\theta: 2[\ell(\hat\theta) - \ell(\theta)] \le 3.84\}$ differ from the Wald interval?'
  choices: ['It always has exact 95% coverage', 'It need not be symmetric about $\hat\theta$, and follows the shape of the log-likelihood', 'It is always narrower', 'It uses only $\ell''''(\hat\theta)$']
  answer: 1
  explanation: |-
    The Wald interval uses only the curvature at the peak and is symmetric by construction. The likelihood interval follows the whole curve, so it can be lopsided, as in Example 2: $(0.326, 1.773)$ against Wald's $(0.151, 1.597)$. Both are large-sample approximations.

- id: ps-m6-r2-h10
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  type: text
  stem: 'Exponential lifetimes with $n = 20$ and $\sum x_i = 50$ give $\hat\lambda =$ ___ and observed information $J(\hat\lambda) = n/\hat\lambda^2 =$ ___.'
  accept:
    - ['0.4', '2/5']
    - ['125']
  explanation: |-
    $\hat\lambda = n/\sum x_i = 20/50 = 0.4$. Since $\ell''(\lambda) = -n/\lambda^2$, $J = 20/0.16 = 125$, so SE $= 1/\sqrt{125} \approx 0.089$.

- id: ps-m6-r2-h11
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  type: order
  stem: 'Put the steps of fitting a model by Newton''s method and reporting a Wald interval in order.'
  items: ['Choose a starting value $\theta_0$', 'Compute $\ell''(\theta_k)$ and $\ell''''(\theta_k)$', 'Update $\theta_{k+1} = \theta_k - \ell''(\theta_k)/\ell''''(\theta_k)$', 'Stop when the steps are negligible: this is $\hat\theta$', 'Compute $\text{SE} = 1/\sqrt{-\ell''''(\hat\theta)}$', 'Report $\hat\theta \pm 1.96\,\text{SE}$']
  explanation: |-
    The derivatives are evaluated at the current guess, the update uses them, iteration stops at convergence, and only then is the curvature at $\hat\theta$ turned into a standard error and an interval.

- id: ps-m6-r2-h12
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  type: match
  stem: 'Match each term to its meaning.'
  pairs:
    - [Score function, First derivative of the log-likelihood]
    - [Observed information, Minus the second derivative of the log-likelihood at the MLE]
    - [Expected information, n times the Fisher information per observation]
    - [Fisher scoring, Newton's method with the expected information in place of the curvature]
    - [Wald interval, Estimate plus or minus z times the standard error]
  distractors: [Product of the densities of the observations]
  explanation: |-
    The score is $\ell'$; observed information is $J(\hat\theta) = -\ell''(\hat\theta)$; expected information is $nI(\theta)$; scoring uses $nI$ in the Newton step; the Wald interval is $\hat\theta \pm z_{\alpha/2}\text{SE}$. The product of densities is the likelihood itself.

- id: ps-m6-r2-h13
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'Which can happen when Newton''s method is applied to a score equation from a poor starting value? Select all that apply.'
  choices: ['It overshoots the MLE', 'It converges to a minimum of the log-likelihood', 'It steps outside the parameter space, such as a negative rate', 'It is guaranteed to reach the global maximum in one step', 'It requires $\ell''''$ to be positive at every step']
  answer: [0, 1, 2]
  explanation: |-
    Newton only seeks a zero of $\ell'$, so it can overshoot (Example 1 went from 1.5 to 0.53), land on a minimum, or leave the allowed range. One-step convergence happens only when $\ell$ is exactly quadratic (as for a normal mean). Near a maximum $\ell'' < 0$, not $> 0$.

- id: ps-m6-r2-h14
  lesson: ps-m6-h-numerical-mle
  topic: Likelihood computation
  stem: 'In the gamma example ($n = 50$, $\hat\alpha = 2$, $\hat\theta = 2$), which statements are correct? Select all that apply.'
  choices: ['Standard errors come from the diagonal of the inverse of $nI$', '$1/\sqrt{32.247} \approx 0.176$ understates the standard error of $\hat\alpha$', '$\hat\alpha$ and $\hat\theta$ are strongly negatively correlated', 'Knowing $\theta$ exactly would not change the standard error of $\hat\alpha$']
  answer: [0, 1, 2]
  explanation: |-
    Inverting $nI$ gives $\operatorname{SE}(\hat\alpha) \approx 0.371$, about twice the naive 0.176, and a correlation of about $-0.88$. The naive value is the SE when $\theta$ is known; not knowing $\theta$ more than doubles the uncertainty about $\alpha$.

# ================================================================ Honors 2: decision theory and shrinkage
- id: ps-m6-r2-h15
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'Under squared-error loss, the risk function of an estimator is the same as its:'
  choices: ['Variance', 'Mean squared error', 'Bias', 'Bayes risk']
  answer: 1
  explanation: |-
    $R(\theta, \delta) = E_\theta[(\delta(X) - \theta)^2]$, which is the MSE, variance plus squared bias. It equals the variance only for unbiased estimators. The Bayes risk averages it over a prior.

- id: ps-m6-r2-h16
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'Which estimator minimizes the posterior expected loss under absolute-error loss $|\theta - a|$?'
  choices: ['The posterior mean', 'The posterior mode', 'The posterior median', 'The MLE']
  answer: 2
  explanation: |-
    Moving $a$ up by $h$ changes the expected absolute error by about $h[P(\theta < a) - P(\theta > a)]$, which balances at the median. Squared error gives the mean; zero–one loss gives the mode.

- id: ps-m6-r2-h17
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'For $X \sim$ Binomial$(36, p)$ under squared-error loss, which estimator is minimax?'
  choices: ['$(X + 6)/48$', '$(X + 1)/38$', '$(X + 18)/72$', '$(X + 3)/42$']
  answer: 3
  explanation: |-
    The minimax estimator is $(X + \sqrt n/2)/(n + \sqrt n)$; with $\sqrt{36} = 6$ this is $(X + 3)/42$, the Bayes rule for a Beta(3, 3) prior, whose risk is constant. $(X + 1)/38$ is the Bayes rule for the uniform prior.

- id: ps-m6-r2-h18
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'With $n = 36$, what is the (constant) risk of the minimax estimator of $p$, and how does it compare with the worst-case risk of $X/36$?'
  choices: ['About 0.0051, below the MLE''s worst case of about 0.0069', 'About 0.0069, equal to the MLE''s worst case', 'About 0.0051, above the MLE''s worst case of about 0.0026', 'About 0.0278, above the MLE''s worst case of about 0.0069']
  answer: 0
  explanation: |-
    Minimax risk: $\dfrac{1}{4(1 + \sqrt n)^2} = \dfrac{1}{4 \cdot 49} \approx 0.0051$. The MLE's risk $p(1-p)/36$ is largest at $p = 0.5$: $0.25/36 \approx 0.0069$.

- id: ps-m6-r2-h19
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'With $\bar X \sim N(\theta, 4)$, the Bayes estimator $\delta_B = 0.8\bar X + 20$ has risk $0.64 \times 4 + 0.04(\theta - 100)^2$. What is its risk when the true $\theta = 105$?'
  choices: ['2.56', '4.00', '3.56', '4.56']
  answer: 2
  explanation: |-
    $2.56 + 0.04 \times 5^2 = 2.56 + 1.00 = 3.56$, still below the risk 4 of $\bar X$, since $|105 - 100| < 6$. 2.56 is the variance part alone.
- id: ps-m6-r2-h20
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'For a normal mean with known variance and squared-error loss, which estimator is minimax?'
  choices: ['The Bayes estimator for a $N(100, 16)$ prior', '$\bar X$', 'The constant guess 100', '$0.5\bar X$']
  answer: 1
  explanation: |-
    $\bar X$ has constant risk $v = \sigma^2/n$, and the Bayes risks $\tau^2v/(\tau^2 + v)$ of ever flatter normal priors approach $v$, so no estimator can have a smaller maximum risk. Any estimator that shrinks toward a fixed point has a risk that grows without bound as $\theta$ moves away from that point.
- id: ps-m6-r2-h21
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'Why is $S^2$ inadmissible for $\sigma^2$ with normal data under squared-error loss?'
  choices: ['It is biased', 'Its variance exceeds the Cramér–Rao bound', 'It is not a function of a sufficient statistic', 'Dividing the sum of squares by $n + 1$ instead gives smaller MSE for every $\sigma$']
  answer: 3
  explanation: |-
    $\operatorname{MSE}(S^2) = 2\sigma^4/(n-1)$, while dividing by $n + 1$ gives MSE $2\sigma^4/(n+1)$, smaller for every $\sigma$: $S^2$ is dominated. $S^2$ is unbiased and a function of the sufficient statistic; its variance being above the bound does not by itself make it inadmissible.

- id: ps-m6-r2-h22
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'An estimator $\delta$ is the Bayes estimator for some prior and has constant risk $0.02$. What follows?'
  choices: ['$\delta$ is minimax', '$\delta$ is unbiased', '$\delta$ dominates every other estimator', '$\delta$ is the MLE']
  answer: 0
  explanation: |-
    If some $\delta'$ had maximum risk below 0.02, its Bayes risk would also be below 0.02, beating the Bayes estimator, which is impossible. So no estimator has a smaller worst case. Nothing forces $\delta$ to be unbiased (the binomial minimax estimator is biased), and a constant guess still beats it at one point.

- id: ps-m6-r2-h23
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  type: text
  stem: '$\bar X \sim N(\theta, 9)$ and the prior is $\theta \sim N(50, 18)$. The Bayes estimator is $c\bar X + (1 - c)50$ with $c =$ ___, and its Bayes risk is ___.'
  accept:
    - ['2/3', '0.667', '0.6667']
    - ['6']
  explanation: |-
    $c = \tau^2/(\tau^2 + v) = 18/27 = 2/3$, and the Bayes risk is $cv = \frac23 \times 9 = 6$, which is also the posterior variance $1/(1/18 + 1/9)$.
- id: ps-m6-r2-h24
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  type: text
  stem: 'For $X \sim$ Binomial$(16, p)$, the MLE $X/16$ has smaller squared-error risk than $(X + 2)/20$ when $p <$ ___ or $p >$ ___.'
  accept:
    - ['0.2', '1/5']
    - ['0.8', '4/5']
  explanation: |-
    $p(1-p)/16 < 0.01 \iff p(1-p) < 0.16 \iff p < 0.2$ or $p > 0.8$ (the roots of $p^2 - p + 0.16 = 0$).

- id: ps-m6-r2-h25
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  type: match
  stem: 'Match each loss function to its Bayes estimator.'
  pairs:
    - [Squared error, Posterior mean]
    - [Absolute error, Posterior median]
    - [Zero–one loss with a small tolerance, Posterior mode]
  distractors: [Prior mean, Sample maximum]
  explanation: |-
    Squared error is minimized at the mean, absolute error at the median, and zero–one loss (with a vanishing tolerance) at the point of highest posterior density.

- id: ps-m6-r2-h26
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  type: match
  stem: 'Match each decision-theory term to its meaning.'
  pairs:
    - [Risk function, Expected loss as a function of the parameter]
    - [Bayes risk, Risk averaged over a prior]
    - [Minimax estimator, Smallest possible worst-case risk]
    - [Inadmissible estimator, Dominated by some other estimator]
    - [Admissible estimator, Not dominated by any other estimator]
  distractors: [Unbiased with the smallest variance]
  explanation: |-
    Risk is $E_\theta[L]$; Bayes risk averages it over $\pi$; minimax minimizes $\max_\theta R$; dominated rules are inadmissible, and undominated ones admissible. "Unbiased with the smallest variance" describes an MVUE.

- id: ps-m6-r2-h27
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  stem: 'Let $\delta_c = c\bar X + (1 - c)\mu_0$ with $0 < c < 1$ and $\bar X \sim N(\theta, v)$. Which statements are true? Select all that apply.'
  choices: ['It is biased unless $\theta = \mu_0$', 'Its variance is smaller than that of $\bar X$', 'It has smaller risk than $\bar X$ for every $\theta$', 'It is the Bayes estimator for some normal prior centered at $\mu_0$', 'It is dominated by $\bar X$']
  answer: [0, 1, 3]
  explanation: |-
    Bias $(1 - c)(\mu_0 - \theta)$ is zero only at $\theta = \mu_0$; variance $c^2v < v$. Its risk $c^2v + (1-c)^2(\theta - \mu_0)^2$ beats $v$ only near $\mu_0$, so neither estimator dominates the other. It is the posterior mean for the prior $N(\mu_0, \tau^2)$ with $\tau^2 = cv/(1 - c)$, and as a unique Bayes estimator it is admissible.
- id: ps-m6-r2-h28
  lesson: ps-m6-h-decision-shrinkage
  topic: Decision theory
  type: order
  stem: 'For $X \sim$ Binomial$(16, p)$ with true $p = 0.5$, order these estimators by their squared-error risk, smallest first.'
  items: ['The constant guess $0.5$', '$(X + 2)/20$', '$(X + 1)/18$', '$X/16$']
  explanation: |-
    At $p = 0.5$: the constant guess has risk 0; $(X + 2)/20$ has constant risk $0.01$; $(X + 1)/18$ is unbiased at $p = 0.5$ with variance $16(0.25)/324 \approx 0.0123$; $X/16$ has $0.25/16 \approx 0.0156$. Shrinking toward 0.5 helps most when the truth is 0.5.

# ================================================================ Honors 3: intervals for a proportion
- id: ps-m6-r2-h29
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'A test of $n = 25$ parts finds no failures. What is the 95% Wald interval for the failure probability?'
  choices: ['$[0, 0.12]$', '$[0, 0]$', '$[0, 0.04]$', '$[-0.04, 0.04]$']
  answer: 1
  explanation: |-
    With $\hat p = 0$ the estimated variance $\hat p(1 - \hat p)/n$ is 0, so the Wald "interval" is the single point 0. It can never contain a positive $p$, which is why its coverage collapses near 0. The rule of three gives an upper bound of about $3/25 = 0.12$.

- id: ps-m6-r2-h30
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'For $x = 2$ successes in $n = 20$ trials, where is the center of the 95% Wilson interval?'
  choices: ['0.100', '0.167', '0.192', '0.164']
  answer: 3
  explanation: |-
    Center $= \dfrac{\hat p + z^2/(2n)}{1 + z^2/n} = \dfrac{0.1 + 3.8415/40}{1 + 3.8415/20} = \dfrac{0.1960}{1.1921} \approx 0.164$. 0.100 is $\hat p$ (the Wald center); 0.167 is the Agresti–Coull center $4/24$; 0.192 is $z^2/n$.

- id: ps-m6-r2-h31
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'With $x = 5$ successes in $n = 36$ trials, what is the Agresti–Coull center $\tilde p$ for a 95% interval?'
  choices: ['0.139', '0.175', '0.125', '0.179']
  answer: 1
  explanation: |-
    Add two successes and two failures: $\tilde p = (5 + 2)/(36 + 4) = 7/40 = 0.175$. 0.139 is $\hat p = 5/36$; 0.125 is $5/40$ (adding only to $n$); 0.179 is $7/39$.

- id: ps-m6-r2-h32
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'A component passes all 150 tests. By the rule of three, what is an approximate 95% upper bound for its failure probability?'
  choices: ['0.0067', '0.003', '0.02', '0.05']
  answer: 2
  explanation: |-
    After $n$ trials with no events, the one-sided 95% upper bound is about $3/n = 3/150 = 0.02$ (exactly $1 - 0.05^{1/150} \approx 0.0198$). $1/150 \approx 0.0067$ is one event per 150.

- id: ps-m6-r2-h33
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'What does the Clopper–Pearson 95% interval guarantee about its coverage?'
  choices: ['Exactly 95% for every $p$', 'About 95% on average over $p$, sometimes far less', 'At least 95% for every $p$', 'At least 95% only when $np \ge 10$']
  answer: 2
  explanation: |-
    It inverts exact one-sided binomial tests, so its coverage is never below the nominal level, for any $n$ and $p$. "Exact" refers to its construction; its actual coverage is usually above 95%, so the intervals are wider than necessary.

- id: ps-m6-r2-h34
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'For $n = 4$ and true $p = 0.5$, the 95% Wald interval contains 0.5 when $x = 1, 2$ or $3$, but not when $x = 0$ or $4$ (it collapses to a point). What is its exact coverage?'
  choices: ['0.875', '0.95', '0.625', '0.75']
  answer: 0
  explanation: |-
    $P(X = 0) = P(X = 4) = 1/16$, so the coverage is $1 - 2/16 = 0.875$. (Checking $x = 1$: $0.25 \pm 1.96\sqrt{0.1875/4} = 0.25 \pm 0.424$ reaches 0.674, so it contains 0.5.) 0.625 counts only $x = 1$ and $x = 2$, and 0.95 is the nominal level, not the actual coverage.

- id: ps-m6-r2-h35
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'Why does the Wald interval cover especially poorly when $p$ is near 0?'
  choices: ['Small $p$ makes the binomial symmetric', 'The $z$ cutoff is too large for small $p$', 'It uses the true $p$ in the standard error', '$\hat p$ is often 0 or very small, so the plug-in standard error is far too small']
  answer: 3
  explanation: |-
    Near 0, $\hat p$ is frequently 0 or tiny, making $\sqrt{\hat p(1 - \hat p)/n}$ much smaller than the true SE; in addition the binomial is right-skewed there while the interval is symmetric. Keeping the true $p$ in the SE is what the Wilson interval does, and it fixes much of the problem.

- id: ps-m6-r2-h36
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'How is the Jeffreys interval for a proportion computed?'
  choices: ['From quantiles of the Beta$(x + \tfrac12,\; n - x + \tfrac12)$ posterior', 'By adding two successes and two failures', 'By solving the pivot inequality for $p$', 'From quantiles of Beta$(x,\; n - x + 1)$ and Beta$(x + 1,\; n - x)$']
  answer: 0
  explanation: |-
    It is the equal-tailed credible interval from the Beta$(\tfrac12, \tfrac12)$ (Jeffreys) prior, whose posterior after $x$ of $n$ is Beta$(x + \tfrac12, n - x + \tfrac12)$. The other choices describe Agresti–Coull, Wilson and Clopper–Pearson.

- id: ps-m6-r2-h37
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  type: text
  stem: 'There are $x = 0$ failures in $n = 60$ trials. The exact one-sided 95% upper bound $1 - 0.05^{1/60}$ is ___ (3 decimal places), and the rule of three gives ___.'
  accept:
    - ['0.049']
    - ['0.05', '3/60', '1/20']
  explanation: |-
    $0.05^{1/60} = e^{\ln(0.05)/60} = e^{-0.04993} \approx 0.9513$, so the bound is $\approx 0.049$. The rule of three gives $3/60 = 0.05$, very close.

- id: ps-m6-r2-h38
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  type: text
  stem: 'For $n = 5$ and true $p = 0.5$, the 95% Wald intervals contain 0.5 exactly when $x = 1, 2, 3$ or $4$. The exact coverage is ___.'
  accept: ['0.9375', '15/16', '30/32']
  explanation: |-
    Only $x = 0$ and $x = 5$ miss, each with probability $1/32$, so the coverage is $1 - 2/32 = 30/32 = 0.9375$. (For $x = 1$: $0.2 \pm 1.96\sqrt{0.16/5} = 0.2 \pm 0.351$, up to 0.551.)

- id: ps-m6-r2-h39
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  type: order
  stem: 'For $x = 2$ successes in $n = 20$ trials, order these 95% intervals by their upper endpoint, smallest first.'
  items: ['Wald', 'Jeffreys', 'Wilson', 'Agresti–Coull']
  explanation: |-
    Upper endpoints: Wald 0.231, Jeffreys 0.284, Wilson 0.301, Agresti–Coull 0.316 (Example 2). The Wald interval is symmetric about 0.1 and so reaches least far up; the others stretch upward to match the right skew of the binomial.

- id: ps-m6-r2-h40
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  type: match
  stem: 'Match each interval for a proportion to the idea behind it.'
  pairs:
    - [Wald, Estimate plus or minus z times the plug-in standard error]
    - [Wilson, Solve the pivot inequality for p without substituting the estimate]
    - [Agresti–Coull, Add two successes and two failures and then use the Wald formula]
    - [Clopper–Pearson, Invert two exact one-sided binomial tests]
    - [Jeffreys, 'Equal-tailed posterior interval under the Beta(1/2, 1/2) prior']
  distractors: [Resample the data with replacement]
  explanation: |-
    Each method fixes a different weakness of the Wald interval: Wilson keeps $p$ in the SE, Agresti–Coull imitates Wilson's center, Clopper–Pearson works with exact binomial tails, and Jeffreys is a Bayesian interval with good coverage. Resampling describes the bootstrap.

- id: ps-m6-r2-h41
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'Which properties does the Wilson interval have? Select all that apply.'
  choices: ['Its endpoints always lie between 0 and 1', 'It has positive width even when $x = 0$', 'Its center is pulled from $\hat p$ toward $\tfrac12$', 'Its coverage is at least 95% for every $p$', 'It is symmetric about $\hat p$']
  answer: [0, 1, 2]
  explanation: |-
    The endpoints are roots of a quadratic that keeps them in $[0, 1]$, and with $x = 0$ the upper root is positive. The center $(\hat p + z^2/2n)/(1 + z^2/n)$ lies between $\hat p$ and $\tfrac12$, so the interval is not symmetric about $\hat p$. Its coverage hovers around 95% and dips below it for some $p$; only Clopper–Pearson guarantees at least 95%.

- id: ps-m6-r2-h42
  lesson: ps-m6-h-proportion-intervals
  topic: Intervals for a proportion
  stem: 'For which data does the 95% Wald interval have an endpoint outside $[0, 1]$? Select all that apply.'
  choices: ['$x = 2$, $n = 20$', '$x = 1$, $n = 10$', '$x = 12$, $n = 40$', '$x = 19$, $n = 20$', '$x = 10$, $n = 20$']
  answer: [0, 1, 3]
  explanation: |-
    $2/20$: $0.1 \pm 0.131$, lower end $-0.031$. $1/10$: $0.1 \pm 0.186$, lower end $-0.086$. $19/20$: $0.95 \pm 0.096$, upper end $1.046$. $12/40$: $0.3 \pm 0.142$, inside. $10/20$: $0.5 \pm 0.219$, inside.
