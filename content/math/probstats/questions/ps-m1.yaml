# Module 1 — Probability foundations
# ---- Lesson 01: sample spaces, events, axioms
- id: ps-q-0101
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  stem: 'Suppose $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.15$. Find $P(A \cup B)$.'
  choices: ['0.90', '0.60', '0.75', '0.35']
  answer: 2
  explanation: |-
    Addition rule: $P(A \cup B) = 0.5 + 0.4 - 0.15 = 0.75$. Adding without subtracting the
    overlap gives 0.90, which counts $A \cap B$ twice.

- id: ps-q-0102
  lesson: ps-axioms
  topic: Probability axioms
  stem: 'With $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.15$, what is the probability that exactly one of $A$ and $B$ occurs?'
  choices: ['0.60', '0.75', '0.45', '0.90']
  answer: 0
  explanation: |-
    Exactly one means $A \cup B$ minus the overlap: $0.75 - 0.15 = 0.60$. Equivalently,
    $P(A \cap B^c) + P(A^c \cap B) = 0.35 + 0.25 = 0.60$.

- id: ps-q-0103
  lesson: ps-axioms
  topic: Probability axioms
  stem: 'With $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.15$, find $P(A^c \cap B^c)$.'
  choices: ['0.30', '0.85', '0.10', '0.25']
  answer: 3
  explanation: |-
    By De Morgan, $A^c \cap B^c = (A \cup B)^c$, so the probability is $1 - 0.75 = 0.25$.
    The value 0.30 multiplies $P(A^c)P(B^c)$, which is only valid for independent events, and
    0.85 is $1 - P(A \cap B)$, the probability that not both occur.

- id: ps-q-0104
  lesson: ps-axioms
  topic: Sample spaces and events
  stem: 'Which event is the complement of "at least one of $A$ and $B$ occurs"?'
  choices: ['$A^c \cup B^c$', '$A^c \cap B^c$', '$A \cap B$', '$(A \cap B)^c$']
  answer: 1
  explanation: |-
    "At least one" is $A \cup B$, and De Morgan's law gives $(A \cup B)^c = A^c \cap B^c$:
    neither occurs. $A^c \cup B^c = (A \cap B)^c$ is the complement of "both occur."

- id: ps-q-0105
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  stem: 'Which statement can fail for some events $A$ and $B$?'
  choices: ['$P(A \cup B) \le P(A) + P(B)$', '$P(A \cap B) \ge P(A) + P(B) - 1$', '$P(A \cup B) = P(A) + P(B)$', 'If $A \subseteq B$ then $P(A) \le P(B)$']
  answer: 2
  explanation: |-
    $P(A \cup B) = P(A) + P(B) - P(A \cap B)$, so the plain sum is correct only when
    $P(A \cap B) = 0$. The other three are always true: the union bound, the Bonferroni
    inequality (from $P(A \cup B) \le 1$), and monotonicity.

- id: ps-q-0106
  lesson: ps-axioms
  topic: Probability axioms
  stem: 'Events $A$, $B$, $C$ each have probability 0.3, each pair has intersection probability 0.1, and $P(A \cap B \cap C) = 0.05$. Find $P(A \cup B \cup C)$.'
  choices: ['0.60', '0.55', '0.90', '0.65']
  answer: 3
  explanation: |-
    Inclusion–exclusion: $0.9 - 0.3 + 0.05 = 0.65$. Stopping after the pair terms gives 0.60;
    the triple intersection was subtracted three times and added three times, so it must be
    added back once.

- id: ps-q-0107
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  stem: 'An integer is chosen at random from $1, 2, \ldots, 100$. What is the probability that it is divisible by 4 or by 6?'
  choices: ['0.33', '0.41', '0.37', '0.25']
  answer: 0
  explanation: |-
    Multiples of 4: 25. Multiples of 6: 16. Divisible by both means divisible by
    $\operatorname{lcm}(4, 6) = 12$: 8 numbers. Count $25 + 16 - 8 = 33$, probability 0.33.
    Using $4 \times 6 = 24$ for the overlap (4 numbers) gives 0.37; no overlap correction gives 0.41.

- id: ps-q-0108
  lesson: ps-axioms
  topic: Probability axioms
  stem: '$P(A) = 0.85$ and $P(B) = 0.75$, and nothing is known about how $A$ and $B$ are related. What is the smallest possible value of $P(A \cap B)$?'
  choices: ['0', '0.6375', '0.60', '0.75']
  answer: 2
  explanation: |-
    $P(A \cap B) = P(A) + P(B) - P(A \cup B) \ge 0.85 + 0.75 - 1 = 0.60$ (Bonferroni), with
    equality when $A \cup B = S$. The product 0.6375 assumes independence; 0.75 is the
    largest possible value (when $B \subseteq A$).

- id: ps-q-0109
  lesson: ps-axioms
  module_quiz: true
  topic: Sample spaces and events
  stem: 'Three fair coins are tossed. Which sample space has equally likely outcomes?'
  choices: ['$\{0, 1, 2, 3\}$, the number of heads', 'The 8 ordered sequences such as $HHT$ and $THH$', '$\{\text{all same}, \text{not all same}\}$', 'The 4 unordered results such as "two heads, one tail"']
  answer: 1
  explanation: |-
    Each of the $2^3 = 8$ ordered sequences has probability $\tfrac18$. Head counts are not
    equally likely ($P(1 \text{ head}) = \tfrac38$ but $P(0) = \tfrac18$), and neither are the
    coarser descriptions.

- id: ps-q-0110
  lesson: ps-axioms
  topic: Sample spaces and events
  stem: 'A sample space has 5 outcomes. How many different events (subsets of $S$, including $\varnothing$ and $S$) are there?'
  choices: ['25', '5', '10', '32']
  answer: 3
  explanation: |-
    Each outcome is either in or out of an event, so there are $2^5 = 32$ subsets, including
    the impossible event $\varnothing$ and the certain event $S$.

- id: ps-q-0111
  lesson: ps-axioms
  topic: Probability axioms
  stem: 'Which reasoning proves the complement rule $P(A^c) = 1 - P(A)$ from the axioms?'
  choices: ['$A$ and $A^c$ are disjoint with union $S$, so additivity and $P(S) = 1$ give $P(A) + P(A^c) = 1$', 'Probabilities are nonnegative, so $P(A^c) \ge 0$ forces $P(A^c) = 1 - P(A)$', 'Every event is independent of its complement, so $P(A)P(A^c) = 0$', 'Any two events satisfy $P(A) + P(B) = 1$']
  answer: 0
  explanation: |-
    Additivity applies because $A \cap A^c = \varnothing$, and $A \cup A^c = S$ has probability 1
    by the second axiom. Nonnegativity alone says nothing about the sum, and an event is
    generally not independent of its complement.

- id: ps-q-0112
  lesson: ps-axioms
  topic: Sample spaces and events
  stem: 'Two fair dice are rolled. Find the probability that at least one die shows a 6 or the sum is 10.'
  choices: ['$\tfrac{7}{18}$', '$\tfrac{1}{3}$', '$\tfrac{11}{36}$', '$\tfrac{13}{36}$']
  answer: 1
  explanation: |-
    At least one 6: $36 - 25 = 11$ outcomes. Sum 10: $(4,6), (5,5), (6,4)$, 3 outcomes. Both:
    $(4,6)$ and $(6,4)$. So the union has $11 + 3 - 2 = 12$ outcomes, probability
    $12/36 = \tfrac13$. Forgetting the overlap gives $\tfrac{14}{36} = \tfrac{7}{18}$.

- id: ps-q-0113
  lesson: ps-axioms
  module_quiz: true
  topic: Probability axioms
  stem: 'Twenty sensors each fail on a given day with probability 0.002. Nothing is known about whether failures are related. What can be said about the probability that at least one sensor fails?'
  choices: ['It is exactly $1 - 0.998^{20}$', 'It is exactly 0.04', 'It is at least 0.04', 'It is at most 0.04']
  answer: 3
  explanation: |-
    Boole's inequality gives $P(\bigcup A_i) \le \sum P(A_i) = 20 \times 0.002 = 0.04$ with no
    assumptions about overlaps. The value $1 - 0.998^{20}$ would require independence, and
    equality with 0.04 would require the failures to be mutually exclusive.

# ---- Lesson 02: counting
- id: ps-q-0201
  lesson: ps-counting
  module_quiz: true
  topic: Counting methods
  stem: 'In how many ways can a president, a vice president and a secretary be chosen from 12 club members, if no one holds two offices?'
  choices: ['220', '1728', '1320', '36']
  answer: 2
  explanation: |-
    The offices are distinct, so order matters: $12 \cdot 11 \cdot 10 = 1320$. $\binom{12}{3} = 220$
    ignores the roles, and $12^3$ allows one person to hold several offices.

- id: ps-q-0202
  lesson: ps-counting
  topic: Counting methods
  stem: 'A crew of 4 is chosen from 10 workers; all crew members have the same job. How many different crews are possible?'
  choices: ['210', '5040', '10,000', '40']
  answer: 0
  explanation: |-
    Unordered selection: $\binom{10}{4} = \dfrac{10 \cdot 9 \cdot 8 \cdot 7}{4!} = 210$. The value
    5040 counts ordered lists; each crew appears $4! = 24$ times among them.

- id: ps-q-0203
  lesson: ps-counting
  module_quiz: true
  topic: Counting methods
  stem: 'Five cards are dealt from a well-shuffled 52-card deck. What is the probability of exactly 2 hearts?'
  choices: ['0.2637', '0.0815', '0.3670', '0.2743']
  answer: 3
  explanation: |-
    $\dfrac{\binom{13}{2}\binom{39}{3}}{\binom{52}{5}} = \dfrac{78 \times 9139}{2{,}598{,}960} \approx 0.2743$.
    The value 0.2637 treats the cards as independent draws with probability $\tfrac14$ (with
    replacement); 0.3670 is the probability of at least 2 hearts, and 0.0815 is exactly 3.

- id: ps-q-0204
  lesson: ps-counting
  topic: Counting methods
  stem: 'How many distinct arrangements are there of the letters in STATISTICS?'
  choices: ['100,800', '50,400', '25,200', '3,628,800']
  answer: 1
  explanation: |-
    Ten letters with S three times, T three times, I twice, A and C once:
    $\dfrac{10!}{3!\,3!\,2!} = \dfrac{3{,}628{,}800}{72} = 50{,}400$. Forgetting the repeated I gives
    100,800.

- id: ps-q-0205
  lesson: ps-counting
  topic: Counting methods
  stem: 'Twelve trainees are split into three teams of 4, to be sent to three different depots. How many ways can this be done?'
  choices: ['5775', '495', '1728', '34,650']
  answer: 3
  explanation: |-
    The teams are labeled by depot, so use the multinomial coefficient
    $\dfrac{12!}{4!\,4!\,4!} = 34{,}650$. If the teams were unlabeled, divide by $3! = 6$ to get 5775.

- id: ps-q-0206
  lesson: ps-counting
  module_quiz: true
  topic: Birthday and matching problems
  stem: 'Four people each have a birth month that is equally likely to be any of the 12 months, independently. What is the probability that at least two share a birth month?'
  choices: ['0.4271', '0.5729', '0.2297', '0.5000']
  answer: 0
  explanation: |-
    $P(\text{all different}) = \dfrac{12 \cdot 11 \cdot 10 \cdot 9}{12^4} = \dfrac{11880}{20736} \approx 0.5729$,
    so $P(\text{some match}) \approx 0.4271$. The value $1 - (11/12)^3 \approx 0.2297$ is the
    chance that one of the others shares a particular person's month.

- id: ps-q-0207
  lesson: ps-counting
  topic: Birthday and matching problems
  stem: 'Which fact best explains why a shared birthday is more likely than not among only 23 people?'
  choices: ['Birthdays cluster in certain months', 'Each person has a $\tfrac{23}{365}$ chance of matching someone', 'There are 253 pairs of people, and each pair could match', 'The probability of a match is $\tfrac{23}{365} \times 23$']
  answer: 2
  explanation: |-
    The number of pairs, $\binom{23}{2} = 253$, is what grows quickly. Each pair matches with
    probability $\tfrac{1}{365}$, and with that many chances a match becomes likely. The
    calculation assumes uniform birthdays, so clustering is not the reason.

- id: ps-q-0208
  lesson: ps-counting
  topic: Birthday and matching problems
  stem: 'Five letters are placed at random into their five addressed envelopes, one per envelope. What is the exact probability that no letter is in its correct envelope?'
  choices: ['$\tfrac{19}{30}$', '$\tfrac{11}{30}$', '$\tfrac{1}{5}$', '$\tfrac{4}{5}$']
  answer: 1
  explanation: |-
    $P(\text{at least one match}) = 1 - \tfrac12 + \tfrac16 - \tfrac{1}{24} + \tfrac{1}{120} = \tfrac{76}{120} = \tfrac{19}{30}$,
    so $P(\text{no match}) = \tfrac{11}{30} \approx 0.367$. Equivalently, 44 of the 120
    arrangements leave every letter out of place.

- id: ps-q-0209
  lesson: ps-counting
  module_quiz: true
  topic: Birthday and matching problems
  stem: 'In the matching problem with $n$ letters and envelopes, what happens to $P(\text{at least one match})$ as $n$ grows?'
  choices: ['It approaches $1 - e^{-1} \approx 0.632$', 'It approaches 1', 'It approaches 0', 'It approaches $\tfrac12$']
  answer: 0
  explanation: |-
    Inclusion–exclusion gives $\sum_{k=1}^{n} (-1)^{k+1}/k!$, the partial sums of the series for
    $1 - e^{-1}$. More letters mean more chances to match, but each chance is smaller, and the
    two effects balance.

- id: ps-q-0210
  lesson: ps-counting
  topic: Counting methods
  stem: 'A committee of 3 is chosen at random from 10 people. What is the probability that it consists of three particular people, Ana, Ben and Cho?'
  choices: ['$\tfrac{1}{720}$', '$\tfrac{3}{10}$', '$\tfrac{1}{1000}$', '$\tfrac{1}{120}$']
  answer: 3
  explanation: |-
    There are $\binom{10}{3} = 120$ equally likely committees and one of them is $\{A, B, C\}$.
    The value $\tfrac{1}{720}$ counts one particular ordered selection among $10 \cdot 9 \cdot 8$; the
    three orders of selecting these three people are all favorable, so it is too small by $3! = 6$.

- id: ps-q-0211
  lesson: ps-counting
  topic: Counting methods
  stem: 'A 6-digit code is formed with each digit chosen uniformly from 0–9, independently. What is the probability that all six digits are different?'
  choices: ['0.1512', '0.5314', '0.8488', '0.0002']
  answer: 0
  explanation: |-
    Ordered with replacement in the denominator ($10^6$) and ordered without replacement in the
    numerator: $\dfrac{10 \cdot 9 \cdot 8 \cdot 7 \cdot 6 \cdot 5}{10^6} = 0.1512$. The value $0.9^6 \approx 0.5314$
    wrongly uses the same factor for every digit.

- id: ps-q-0212
  lesson: ps-counting
  topic: Counting methods
  stem: 'Which identity is proved by fixing one person and sorting committees into those that include that person and those that do not?'
  choices: ['$\binom{n}{r} = \binom{n}{n-r}$', '$\binom{n}{r} = \binom{n-1}{r-1} + \binom{n-1}{r}$', '$\sum_{r=0}^n \binom{n}{r} = 2^n$', '$\binom{n}{r} r! = \dfrac{n!}{(n-r)!}$']
  answer: 1
  explanation: |-
    Committees containing the person: choose the other $r - 1$ from $n - 1$. Committees without
    the person: choose all $r$ from $n - 1$. Adding the disjoint cases gives Pascal's rule. The
    symmetry identity comes from choosing who is left out instead.

- id: ps-q-0213
  lesson: ps-counting
  topic: Counting methods
  stem: 'Seven flags — 3 red, 2 blue, 2 green, identical within each color — are hung in a random order. What is the probability that the three red flags are all adjacent?'
  choices: ['$\tfrac{1}{35}$', '$\tfrac{3}{7}$', '$\tfrac{1}{7}$', '$\tfrac{1}{5}$']
  answer: 2
  explanation: |-
    All displays: $\dfrac{7!}{3!\,2!\,2!} = 210$. Treat the reds as one block, leaving 5 items
    (block, 2 blue, 2 green): $\dfrac{5!}{2!\,2!} = 30$. Probability $30/210 = \tfrac17$.

# ---- Lesson 03: conditional probability and Bayes
- id: ps-q-0301
  lesson: ps-conditional
  module_quiz: true
  topic: Conditional probability
  stem: '$P(A) = 0.4$, $P(B) = 0.5$ and $P(A \cap B) = 0.1$. Find $P(A \mid B)$.'
  choices: ['0.25', '0.05', '0.20', '0.80']
  answer: 2
  explanation: |-
    $P(A \mid B) = P(A \cap B)/P(B) = 0.1/0.5 = 0.2$. Dividing by $P(A)$ instead gives
    $P(B \mid A) = 0.25$.

- id: ps-q-0302
  lesson: ps-conditional
  topic: Conditional probability
  stem: 'Two fair dice are rolled and at least one shows a 6. What is the probability that the sum is at least 10?'
  choices: ['$\tfrac{5}{11}$', '$\tfrac{5}{36}$', '$\tfrac{1}{6}$', '$\tfrac{6}{11}$']
  answer: 0
  explanation: |-
    The condition leaves 11 equally likely outcomes. Those with sum at least 10 are
    $(4,6), (5,6), (6,6), (6,4), (6,5)$: 5 of them. So the probability is $\tfrac{5}{11}$. Using
    all 36 outcomes as the denominator ignores the information.

- id: ps-q-0303
  lesson: ps-conditional
  topic: Conditional probability
  stem: 'Three cards are drawn without replacement from a standard deck. What is the probability all three are aces?'
  choices: ['$\tfrac{1}{2197}$', '$\tfrac{1}{5525}$', '$\tfrac{3}{52}$', '$\tfrac{1}{221}$']
  answer: 1
  explanation: |-
    Chain rule: $\tfrac{4}{52} \cdot \tfrac{3}{51} \cdot \tfrac{2}{50} = \tfrac{24}{132600} = \tfrac{1}{5525}$.
    $\left(\tfrac{1}{13}\right)^3 = \tfrac{1}{2197}$ would be drawing with replacement, and $\tfrac{1}{221}$ is
    the chance of two aces in two draws.

- id: ps-q-0304
  lesson: ps-conditional
  module_quiz: true
  topic: Conditional probability
  stem: 'Three shifts make 50%, 30% and 20% of a plant''s output, with defect rates 2%, 3% and 5%. What fraction of all output is defective?'
  choices: ['0.0333', '0.100', '0.019', '0.029']
  answer: 3
  explanation: |-
    Law of total probability: $0.5(0.02) + 0.3(0.03) + 0.2(0.05) = 0.010 + 0.009 + 0.010 = 0.029$.
    The plain average of the rates, 0.0333, ignores how much each shift produces.

- id: ps-q-0305
  lesson: ps-conditional
  topic: Bayes' theorem
  stem: 'For the plant with shifts making 50%, 30%, 20% of output at defect rates 2%, 3%, 5%, a randomly chosen item is defective. What is the probability it came from the third shift?'
  choices: ['0.050', '0.345', '0.200', '0.290']
  answer: 1
  explanation: |-
    Bayes: $\dfrac{0.2 \times 0.05}{0.029} = \dfrac{0.010}{0.029} \approx 0.345$. The prior was 0.20;
    the higher defect rate raises it. The value 0.05 is $P(\text{defective} \mid \text{third shift})$,
    the reverse conditional.

- id: ps-q-0306
  lesson: ps-conditional
  module_quiz: true
  topic: Bayes' theorem
  stem: 'A condition has prevalence 0.5%. A test detects it 99% of the time and gives a false positive 2% of the time. Given a positive result, what is the probability of the condition?'
  choices: ['0.990', '0.801', '0.199', '0.025']
  answer: 2
  explanation: |-
    $P(+) = 0.005(0.99) + 0.995(0.02) = 0.00495 + 0.0199 = 0.02485$. Then
    $P(D \mid +) = 0.00495/0.02485 \approx 0.199$. The value 0.990 is the sensitivity
    $P(+ \mid D)$, and 0.025 is $P(+)$.

- id: ps-q-0307
  lesson: ps-conditional
  topic: Bayes' theorem
  stem: 'The prior odds of a hypothesis are 1 to 4. Evidence arrives whose likelihood ratio (in favor of the hypothesis) is 6. What is the posterior probability of the hypothesis?'
  choices: ['0.20', '0.86', '0.40', '0.60']
  answer: 3
  explanation: |-
    Posterior odds $= \tfrac14 \times 6 = \tfrac32$, i.e. 3 to 2. Probability $= \dfrac{3}{3 + 2} = 0.60$.
    The value 0.86 is $6/7$, which uses the likelihood ratio alone as the odds.

- id: ps-q-0308
  lesson: ps-conditional
  topic: Bayes' theorem
  stem: 'In a city, 70% of reported crashes involve a car less than 10 years old. Which additional fact is needed to judge whether newer cars are more likely to crash?'
  choices: ['The proportion of all cars on the road that are less than 10 years old', 'The number of crashes per year', 'The proportion of crashes that cause injuries', 'Nothing; 70% already shows newer cars crash more']
  answer: 0
  explanation: |-
    The data give $P(\text{new} \mid \text{crash})$. Comparing crash risk needs
    $P(\text{crash} \mid \text{new})$ versus $P(\text{crash} \mid \text{old})$, and Bayes' theorem
    shows that requires the base rate $P(\text{new})$. If 80% of cars are new, 70% of crashes
    would mean new cars crash less often.

- id: ps-q-0309
  lesson: ps-conditional
  topic: Bayes' theorem
  stem: 'In the three-door game you pick door 1, but this host opens one of the other two doors at random, without knowing where the prize is. He opens door 3 and it happens to be empty. What is the probability the prize is behind door 2?'
  choices: ['$\tfrac13$', '$\tfrac23$', '$\tfrac12$', '$1$']
  answer: 2
  explanation: |-
    Likelihood of "opens door 3 and it is empty": $\tfrac12$ if the prize is behind door 1,
    $\tfrac12$ if behind door 2, 0 if behind door 3. Posterior for door 2:
    $\dfrac{\frac13 \cdot \frac12}{\frac13 \cdot \frac12 + \frac13 \cdot \frac12} = \tfrac12$. The $\tfrac23$
    answer applies only when the host knowingly avoids the prize.

- id: ps-q-0310
  lesson: ps-conditional
  topic: Conditional probability
  stem: 'Which formula is correct for any events with positive probabilities?'
  choices: ['$P(A \cap B \cap C) = P(A)P(B \mid A)P(C \mid B)$', '$P(A \cap B \cap C) = P(A)P(B)P(C)$', '$P(A \cap B \cap C) = P(A)P(B \mid A)P(C \mid A \cap B)$', '$P(A \cap B \cap C) = P(C \mid A \cap B)/P(A \cap B)$']
  answer: 2
  explanation: |-
    The chain rule conditions each factor on everything before it:
    $P(A \cap B) = P(A)P(B \mid A)$, then multiply by $P(C \mid A \cap B)$. Conditioning only on
    $B$ in the last factor is wrong in general, and the plain product requires independence.

- id: ps-q-0311
  lesson: ps-conditional
  topic: Conditional probability
  stem: 'Given $P(B) = 0.6$ and $P(A \mid B) = 0.3$, find $P(A^c \cap B)$.'
  choices: ['0.18', '0.70', '0.28', '0.42']
  answer: 3
  explanation: |-
    Conditional probabilities obey the complement rule: $P(A^c \mid B) = 0.7$. Then
    $P(A^c \cap B) = P(B)P(A^c \mid B) = 0.6 \times 0.7 = 0.42$. The value 0.18 is $P(A \cap B)$.

- id: ps-q-0312
  lesson: ps-conditional
  module_quiz: true
  topic: Conditional probability
  stem: 'A box has 12 parts, 4 defective. Two are drawn without replacement. What is the probability that the second part drawn is defective?'
  choices: ['$\tfrac{3}{11}$', '$\tfrac{1}{3}$', '$\tfrac{4}{11}$', '$\tfrac{1}{11}$']
  answer: 1
  explanation: |-
    Total probability over the first draw:
    $\tfrac{4}{12} \cdot \tfrac{3}{11} + \tfrac{8}{12} \cdot \tfrac{4}{11} = \tfrac{12 + 32}{132} = \tfrac{44}{132} = \tfrac13$.
    Without knowing the first draw, the second is just as likely to be defective as the first.
    $\tfrac{3}{11}$ and $\tfrac{4}{11}$ are the conditional values given the first draw.

- id: ps-q-0313
  lesson: ps-conditional
  topic: Bayes' theorem
  stem: 'Box I holds 3 red and 2 blue balls; box II holds 1 red and 4 blue. A box is chosen by a fair coin toss and a ball drawn from it is red. What is the probability that box I was chosen?'
  choices: ['0.60', '0.50', '0.30', '0.75']
  answer: 3
  explanation: |-
    $P(\text{red}) = 0.5(0.6) + 0.5(0.2) = 0.4$, and
    $P(\text{I} \mid \text{red}) = 0.5(0.6)/0.4 = 0.75$. The value 0.60 is
    $P(\text{red} \mid \text{I})$.

# ---- Lesson 04: independence
- id: ps-q-0401
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  stem: '$A$ and $B$ are independent with $P(A) = 0.3$ and $P(B) = 0.6$. Find $P(A \cup B)$.'
  choices: ['0.90', '0.18', '0.72', '0.82']
  answer: 2
  explanation: |-
    $P(A \cap B) = 0.3 \times 0.6 = 0.18$, so $P(A \cup B) = 0.3 + 0.6 - 0.18 = 0.72$.
    Equivalently, $1 - P(A^c)P(B^c) = 1 - 0.7 \times 0.4 = 0.72$.

- id: ps-q-0402
  lesson: ps-independence
  topic: Independence
  stem: '$P(A) = 0.5$, $P(B) = 0.4$ and $P(A \cap B) = 0.25$. Which statement is correct?'
  choices: ['$A$ and $B$ are independent because $P(A \cap B) > 0$', '$A$ and $B$ are dependent, and $P(A \mid B) = 0.625$', '$A$ and $B$ are mutually exclusive', '$A$ and $B$ are dependent, and $P(A \mid B) = 0.5$']
  answer: 1
  explanation: |-
    $P(A)P(B) = 0.2 \ne 0.25$, so they are dependent. $P(A \mid B) = 0.25/0.4 = 0.625$, higher
    than $P(A) = 0.5$: learning $B$ makes $A$ more likely. They are not mutually exclusive since
    the intersection has positive probability.

- id: ps-q-0403
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  stem: 'Events $A$ and $B$ are mutually exclusive with $P(A) = 0.2$ and $P(B) = 0.3$. Are they independent?'
  choices: ['Yes, because $P(A \cap B) = 0$', 'Yes, because disjoint events never influence each other', 'Only if $P(A \cup B) = 0.5$', 'No, because $P(A \cap B) = 0$ but $P(A)P(B) = 0.06$']
  answer: 3
  explanation: |-
    Independence requires $P(A \cap B) = P(A)P(B) = 0.06$, but disjoint events have
    $P(A \cap B) = 0$. Knowing $A$ occurred tells you $B$ did not, which is strong dependence.

- id: ps-q-0404
  lesson: ps-independence
  topic: Independence
  stem: 'Two fair coins are tossed. $A$ = first is heads, $B$ = second is heads, $C$ = the coins show different faces. Which statement is true?'
  choices: ['$A$, $B$, $C$ are mutually independent', '$A$, $B$, $C$ are pairwise independent but not mutually independent', 'No two of $A$, $B$, $C$ are independent', '$A$ and $B$ are independent, but $C$ is dependent on each of them']
  answer: 1
  explanation: |-
    Each event has probability $\tfrac12$ and each pairwise intersection is a single outcome,
    probability $\tfrac14$: pairwise independent. But $A \cap B \cap C = \varnothing$, so
    $P(A \cap B \cap C) = 0 \ne \tfrac18$.

- id: ps-q-0405
  lesson: ps-independence
  topic: Independence
  stem: '$A$ and $B$ are independent with $P(A) = 0.7$ and $P(B) = 0.2$. Find the probability that neither occurs.'
  choices: ['0.24', '0.10', '0.14', '0.76']
  answer: 0
  explanation: |-
    Complements of independent events are independent: $P(A^c \cap B^c) = 0.3 \times 0.8 = 0.24$.
    The value 0.10 comes from $1 - (0.7 + 0.2)$, which ignores the overlap $0.14$.

- id: ps-q-0406
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  stem: 'Each of three independent inspections finds a given crack with probability 0.6. What is the probability that at least one inspection finds it?'
  choices: ['0.216', '0.784', '0.064', '0.936']
  answer: 3
  explanation: |-
    All three miss with probability $0.4^3 = 0.064$, so at least one finds it with probability
    $1 - 0.064 = 0.936$. The value 0.216 is the chance that all three find it.

- id: ps-q-0407
  lesson: ps-independence
  topic: Independence
  stem: 'Each independent attempt succeeds with probability 0.05. What is the smallest number of attempts that gives at least a 90% chance of at least one success?'
  choices: ['18', '44', '45', '20']
  answer: 2
  explanation: |-
    Need $1 - 0.95^n \ge 0.9$, i.e. $0.95^n \le 0.1$, so $n \ge \ln 0.1 / \ln 0.95 \approx 44.9$.
    The smallest whole number is 45 ($0.95^{44} \approx 0.105$ is not small enough). The value 18
    comes from $0.9/0.05$, treating probabilities as if they add.

- id: ps-q-0408
  lesson: ps-independence
  topic: Independence
  stem: 'A series system has 5 independent components, each working with probability 0.98. What is the system reliability?'
  choices: ['0.904', '0.900', '0.980', '0.999']
  answer: 0
  explanation: |-
    All five must work: $0.98^5 \approx 0.904$. The value 0.900 comes from subtracting the five
    failure probabilities, $1 - 5(0.02)$, which is only a bound (Bonferroni), not the exact value.

- id: ps-q-0409
  lesson: ps-independence
  topic: Independence
  stem: 'Three pumps work in parallel; each works with probability 0.8, independently. What is the probability the system works?'
  choices: ['0.512', '0.800', '0.992', '0.488']
  answer: 2
  explanation: |-
    The system fails only if all three fail: $0.2^3 = 0.008$. Reliability $= 1 - 0.008 = 0.992$.
    The value 0.512 is the series reliability $0.8^3$.

- id: ps-q-0410
  lesson: ps-independence
  topic: Independence
  stem: 'Two components with reliability 0.9 each are connected in series, and this pair is connected in parallel with a third component of reliability 0.8. All fail independently. Find the system reliability.'
  choices: ['0.648', '0.962', '0.810', '0.998']
  answer: 1
  explanation: |-
    Series pair: $0.9^2 = 0.81$. Parallel with 0.8: $1 - (1 - 0.81)(1 - 0.8) = 1 - 0.19 \times 0.2 = 0.962$.
    The value 0.648 treats all three as a series system.

- id: ps-q-0411
  lesson: ps-independence
  module_quiz: true
  topic: Independence
  stem: 'A bag holds a fair coin and a two-headed coin. One is picked at random and tossed twice. Given that the first toss is heads, what is the probability the second toss is heads?'
  choices: ['$\tfrac34$', '$\tfrac12$', '$\tfrac{9}{16}$', '$\tfrac56$']
  answer: 3
  explanation: |-
    $P(H_1) = \tfrac12 \cdot \tfrac12 + \tfrac12 \cdot 1 = \tfrac34$ and
    $P(H_1 \cap H_2) = \tfrac12 \cdot \tfrac14 + \tfrac12 \cdot 1 = \tfrac58$, so
    $P(H_2 \mid H_1) = \tfrac{5/8}{3/4} = \tfrac56$. The tosses are independent given the coin but
    not unconditionally: a head is evidence for the two-headed coin.

- id: ps-q-0412
  lesson: ps-independence
  topic: Independence
  stem: 'Which conditions together define mutual independence of three events $A$, $B$, $C$?'
  choices: ['$P(A \cap B \cap C) = P(A)P(B)P(C)$ only', 'The three pairwise product rules only', 'The three pairwise product rules and $P(A \cap B \cap C) = P(A)P(B)P(C)$', '$P(A \cup B \cup C) = P(A) + P(B) + P(C)$']
  answer: 2
  explanation: |-
    Every subcollection of two or more events must satisfy the product rule: three pairs plus
    the triple. Neither the pair conditions nor the triple condition implies the other.

- id: ps-q-0413
  lesson: ps-independence
  topic: Independence
  stem: 'A fair die is rolled 6 times. What is the probability of at least one six?'
  choices: ['0.665', '1', '0.335', '0.167']
  answer: 0
  explanation: |-
    $1 - (5/6)^6 \approx 1 - 0.335 = 0.665$. Reasoning "six rolls times $\tfrac16$ each" gives 1,
    which is the expected number of sixes, not a probability.
