# Round 2 notecards for module ps-m8 (honors lessons 36h1 and 36h2).
- {front: 'Multiple regression in matrix form', back: '$\mathbf{Y} = \mathbf{X}\boldsymbol\beta + \boldsymbol\varepsilon$, $\boldsymbol\varepsilon \sim N(\mathbf{0}, \sigma^2\mathbf{I})$; $\mathbf{X}$ is $n \times p$ with a column of ones and $p = k + 1$.', topic: Multiple regression}
- {front: 'Normal equations (matrix form)', back: '$\mathbf{X}^\top\mathbf{X}\mathbf{b} = \mathbf{X}^\top\mathbf{y}$, so $\mathbf{b} = (\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top\mathbf{y}$; equivalently $\mathbf{X}^\top\mathbf{e} = \mathbf{0}$.', topic: Multiple regression}
- {front: 'Hat matrix', back: '$\mathbf{H} = \mathbf{X}(\mathbf{X}^\top\mathbf{X})^{-1}\mathbf{X}^\top$; $\hat{\mathbf{y}} = \mathbf{H}\mathbf{y}$, $\mathbf{e} = (\mathbf{I} - \mathbf{H})\mathbf{y}$; symmetric, idempotent, trace $p$.', topic: Multiple regression}
- {front: 'Least squares as a projection', back: '$\hat{\mathbf{y}}$ is the orthogonal projection of $\mathbf{y}$ onto the column space of $\mathbf{X}$; the residual vector is perpendicular to every column.', topic: Multiple regression}
- {front: 'Covariance of the least squares coefficients', back: '$\operatorname{Cov}(\mathbf{b}) = \sigma^2(\mathbf{X}^\top\mathbf{X})^{-1}$, so $\operatorname{Var}(b_j) = \sigma^2c_{jj}$.', topic: Multiple regression}
- {front: 't test for one coefficient', back: '$t = b_j/(s\sqrt{c_{jj}})$ on $n - p$ df, with $s^2 = \text{SSE}/(n - p)$.', topic: Multiple regression}
- {front: 'Adjusted R-squared', back: '$R^2_{\text{adj}} = 1 - \dfrac{\text{SSE}/(n - p)}{\text{SST}/(n - 1)}$; plain $R^2$ never falls when a predictor is added.', topic: Multiple regression}
- {front: 'Overall F test in multiple regression', back: '$F = \dfrac{\text{SSR}/(p - 1)}{\text{SSE}/(n - p)} \sim F_{p-1,\,n-p}$ under $H_0: \beta_1 = \cdots = \beta_k = 0$.', topic: Multiple regression}
- {front: 'Variance inflation factor', back: '$\text{VIF}_j = 1/(1 - R_j^2)$; with two predictors $\operatorname{Var}(b_1) = \sigma^2/[S_{11}(1 - r_{12}^2)]$.', topic: Multiple regression}
- {front: 'Leverage', back: '$h_{ii}$ = diagonal of $\mathbf{H}$; $\sum h_{ii} = p$; $\operatorname{Var}(e_i) = \sigma^2(1 - h_{ii})$; flag $h_{ii} > 2p/n$. Simple regression: $h_{ii} = 1/n + (x_i - \bar x)^2/S_{xx}$.', topic: Multiple regression}
- {front: 'Meaning of a multiple regression coefficient', back: 'The change in mean response per unit of $x_j$ with the other predictors held fixed; it can differ from the simple-regression slope when predictors are correlated.', topic: Multiple regression}
- {front: 'Gauss–Markov proof idea (matrix form)', back: 'Another linear unbiased estimator is $(\mathbf{A} + \mathbf{D})\mathbf{Y}$ with $\mathbf{D}\mathbf{X} = \mathbf{0}$; its covariance is $\sigma^2(\mathbf{X}^\top\mathbf{X})^{-1} + \sigma^2\mathbf{D}\mathbf{D}^\top$.', topic: Multiple regression}
- {front: 'Randomized block design: decomposition', back: 'SST = SSTr + SSB + SSE with df $kb - 1 = (k - 1) + (b - 1) + (k - 1)(b - 1)$; $\text{SSTr} = b\sum(\bar y_{i\cdot} - \bar y)^2$, $\text{SSB} = k\sum(\bar y_{\cdot j} - \bar y)^2$.', topic: Two-way ANOVA}
- {front: 'Randomized block F test', back: '$F = \text{MSTr}/\text{MSE} \sim F_{k-1,\,(k-1)(b-1)}$ under $H_0$: all treatment effects zero.', topic: Two-way ANOVA}
- {front: 'Why block?', back: 'Block-to-block variation moves out of the error into SSB, so MSE shrinks; the cost is fewer error df ($(k - 1)(b - 1)$ instead of $kb - k$).', topic: Two-way ANOVA}
- {front: 'Block design with two treatments', back: 'It is the paired $t$ test: the block-design $F$ equals $t^2$.', topic: Two-way ANOVA}
- {front: 'Two-way factorial model', back: '$Y_{ijl} = \mu + \alpha_i + \beta_j + (\alpha\beta)_{ij} + \varepsilon_{ijl}$, $l = 1, \dots, r$; effects sum to zero over each index.', topic: Two-way ANOVA}
- {front: 'Two-way ANOVA degrees of freedom (balanced)', back: 'A: $a - 1$; B: $b - 1$; AB: $(a - 1)(b - 1)$; error: $ab(r - 1)$; total: $abr - 1$.', topic: Two-way ANOVA}
- {front: 'Interaction sum of squares', back: '$\text{SS}_{AB} = r\sum_i\sum_j(\bar y_{ij\cdot} - \bar y_{i\cdot\cdot} - \bar y_{\cdot j\cdot} + \bar y)^2$.', topic: Two-way ANOVA}
- {front: 'Reading a two-way ANOVA', back: 'Test the interaction first. If it is significant, describe each factor''s effect at each level of the other (interaction plot); if not, interpret the main effects.', topic: Two-way ANOVA}
- {front: 'Why interaction needs replication', back: 'With one observation per cell there is no within-cell error, so interaction cannot be separated from error; the block design assumes additivity instead.', topic: Two-way ANOVA}
