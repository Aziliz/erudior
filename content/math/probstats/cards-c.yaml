# Notecards for modules ps-m7 (hypothesis testing) and ps-m8 (regression, ANOVA, nonparametric methods).
- {front: 'Type I and Type II errors', back: 'Type I: reject $H_0$ when it is true (probability at most $\alpha$). Type II: fail to reject $H_0$ when $H_1$ is true (probability $\beta(\theta) = 1 - \pi(\theta)$).', topic: Hypothesis testing framework}
- {front: 'Power function of a test', back: '$\pi(\theta) = P_\theta(\text{reject } H_0)$ for every $\theta$. On $\Omega_0$ it gives Type I error probabilities; on $\Omega_1$ it gives the power.', topic: Power}
- {front: 'Size of a test with a composite null', back: '$\alpha = \sup_{\theta \in \Omega_0}\pi(\theta)$, the worst-case Type I error probability. For monotone power functions it is attained at the boundary $\theta_0$.', topic: Hypothesis testing framework}
- {front: 'Definition of the p-value', back: 'The probability, computed under $H_0$, of a test statistic at least as extreme as the one observed. Reject at level $\alpha$ exactly when $p \le \alpha$.', topic: Hypothesis testing framework}
- {front: 'Distribution of the p-value under $H_0$', back: 'Uniform(0, 1), for a continuous test statistic and simple $H_0$, by the probability integral transform. So $P(p \le \alpha) = \alpha$.', topic: Hypothesis testing framework}
- {front: 'What a p-value is not', back: 'It is not $P(H_0 \text{ true} \mid \text{data})$, and $1 - p$ is not the probability that $H_1$ is true.', topic: Hypothesis testing framework}
- {front: 'Power of the upper-tailed $z$ test at $\mu$', back: '$\pi(\mu) = 1 - \Phi\!\left(z_\alpha - \dfrac{\mu - \mu_0}{\sigma/\sqrt n}\right)$', topic: Power}
- {front: 'Sample size for a one-sided $z$ test with power $1 - \beta$ at $\mu_0 + \delta$', back: '$n \ge \left(\dfrac{(z_\alpha + z_\beta)\sigma}{\delta}\right)^2$, rounded up. For a two-sided test use $z_{\alpha/2}$.', topic: Power}
- {front: 'What increases power?', back: 'Larger $n$, larger $\alpha$, a true parameter farther from $H_0$, smaller $\sigma$ (less noise, pairing), and a correctly chosen one-sided alternative.', topic: Power}
- {front: 'Duality of tests and confidence intervals', back: 'A two-sided level-$\alpha$ test rejects $\theta = \theta_0$ exactly when $\theta_0$ is outside the $1 - \alpha$ confidence interval (for the usual $z$ and $t$ procedures).', topic: Hypothesis testing framework}
- {front: 'Exact binomial test', back: 'For $X \sim \text{Bin}(n, p)$ and $H_1: p > p_0$, the p-value is $P_{p_0}(X \ge x)$. With discrete data, choose the largest achievable size not above $\alpha$.', topic: Hypothesis testing framework}
- {front: 'One-sample $t$ statistic', back: '$T = \dfrac{\bar X - \mu_0}{S/\sqrt n} \sim t_{n-1}$ under $H_0$ for a normal sample.', topic: Tests for normal means}
- {front: 'Why the one-sample $T$ is exactly $t_{n-1}$', back: '$T = Z/\sqrt{V/(n-1)}$ with $Z = (\bar X - \mu)/(\sigma/\sqrt n) \sim N(0,1)$, $V = (n-1)S^2/\sigma^2 \sim \chi^2_{n-1}$, and $\bar X$ independent of $S^2$.', topic: Tests for normal means}
- {front: 'Pooled two-sample $t$ test', back: '$T = \dfrac{\bar X - \bar Y - \Delta_0}{S_p\sqrt{1/m + 1/n}} \sim t_{m+n-2}$, with $S_p^2 = \dfrac{(m-1)S_1^2 + (n-1)S_2^2}{m+n-2}$. Assumes $\sigma_1 = \sigma_2$.', topic: Tests for normal means}
- {front: 'Welch''s $t$ test', back: '$T = \dfrac{\bar X - \bar Y}{\sqrt{S_1^2/m + S_2^2/n}}$, approximately $t_\nu$ with $\nu = \dfrac{(S_1^2/m + S_2^2/n)^2}{\frac{(S_1^2/m)^2}{m-1} + \frac{(S_2^2/n)^2}{n-1}}$.', topic: Tests for normal means}
- {front: 'Paired $t$ test', back: 'Take differences $D_i = X_i - Y_i$ and run a one-sample $t$ test: $T = \bar D/(S_D/\sqrt n)$ on $n - 1$ df.', topic: Tests for normal means}
- {front: 'Why pairing helps', back: '$\operatorname{Var}(X - Y) = \sigma_1^2 + \sigma_2^2 - 2\rho\sigma_1\sigma_2$: positive correlation within pairs removes unit-to-unit variation.', topic: Tests for normal means}
- {front: 'Chi-square test for one variance', back: '$\chi^2 = (n-1)S^2/\sigma_0^2 \sim \chi^2_{n-1}$ under $H_0: \sigma^2 = \sigma_0^2$. Two-sided critical values are not symmetric.', topic: Tests for variances}
- {front: '$F$ test for two variances', back: '$F = S_1^2/S_2^2 \sim F_{m-1,\,n-1}$ under $H_0: \sigma_1^2 = \sigma_2^2$. Lower critical value: $F_{1-\alpha/2,\,m-1,\,n-1} = 1/F_{\alpha/2,\,n-1,\,m-1}$.', topic: Tests for variances}
- {front: 'Robustness of normal-theory tests', back: '$t$ tests for means are fairly robust to non-normality (CLT). Chi-square and $F$ tests for variances are not, even in large samples.', topic: Tests for variances}
- {front: 'Neyman–Pearson lemma', back: 'For simple $H_0: \theta_0$ vs simple $H_1: \theta_1$, rejecting when $L(\theta_0)/L(\theta_1) \le k$ (with size $\alpha$) is most powerful among tests of size at most $\alpha$.', topic: Neyman–Pearson lemma}
- {front: 'Uniformly most powerful (UMP) test', back: 'One test that is most powerful against every alternative in $H_1$. Exists for one-sided alternatives under a monotone likelihood ratio; usually not for two-sided alternatives.', topic: Neyman–Pearson lemma}
- {front: 'MP test for a normal mean, $\mu_1 > \mu_0$, $\sigma$ known', back: 'The likelihood ratio is decreasing in $\sum x_i$, so reject when $\bar x \ge \mu_0 + z_\alpha\sigma/\sqrt n$; the region does not depend on $\mu_1$, so it is UMP.', topic: Neyman–Pearson lemma}
- {front: 'MP test for an exponential rate, $H_1: \lambda_1 < \lambda_0$', back: 'Reject when $\sum x_i \ge c$, using $2\lambda_0\sum X_i \sim \chi^2_{2n}$ under $H_0$: $c = \chi^2_{\alpha,2n}/(2\lambda_0)$.', topic: Neyman–Pearson lemma}
- {front: 'Generalized likelihood ratio', back: '$\Lambda = \dfrac{\sup_{\Omega_0}L(\theta)}{\sup_{\Omega}L(\theta)} = \dfrac{L(\hat\theta_0)}{L(\hat\theta)} \in (0, 1]$; reject $H_0$ when $\Lambda$ is small.', topic: Likelihood ratio tests}
- {front: 'Wilks'' theorem', back: 'Under $H_0$ and regularity conditions, $-2\ln\Lambda \approx \chi^2_r$ for large $n$, with $r = \dim\Omega - \dim\Omega_0$.', topic: Likelihood ratio tests}
- {front: 'LRT for a normal mean with $\sigma$ unknown', back: '$\Lambda = (1 + t^2/(n-1))^{-n/2}$, a decreasing function of $\lvert t\rvert$: the LRT is the two-sided $t$ test.', topic: Likelihood ratio tests}
- {front: '$-2\ln\Lambda$ for a Poisson mean', back: '$2n\left[\bar x\ln(\bar x/\lambda_0) - (\bar x - \lambda_0)\right]$, compared with $\chi^2_1$.', topic: Likelihood ratio tests}
- {front: '$-2\ln\Lambda$ for a binomial proportion', back: '$2\left[x\ln\dfrac{x}{np_0} + (n - x)\ln\dfrac{n - x}{n(1 - p_0)}\right]$, compared with $\chi^2_1$.', topic: Likelihood ratio tests}
- {front: 'One-proportion $z$ test', back: '$Z = \dfrac{\hat p - p_0}{\sqrt{p_0(1 - p_0)/n}}$; the standard error uses $p_0$ because it is computed under $H_0$. Needs $np_0, n(1-p_0) \ge 10$.', topic: Tests for proportions}
- {front: 'Two-proportion $z$ test', back: '$Z = \dfrac{\hat p_1 - \hat p_2}{\sqrt{\hat p(1 - \hat p)(1/n_1 + 1/n_2)}}$ with pooled $\hat p = (X_1 + X_2)/(n_1 + n_2)$.', topic: Tests for proportions}
- {front: 'Pearson''s chi-square statistic', back: '$X^2 = \sum\dfrac{(O - E)^2}{E}$ over all cells; reject $H_0$ for large values.', topic: Chi-square tests}
- {front: 'Goodness-of-fit degrees of freedom', back: '$k - 1 - m$, for $k$ categories and $m$ parameters estimated from the data.', topic: Chi-square tests}
- {front: 'Expected counts in a two-way table', back: '$E_{ij} = R_iC_j/n$ (row total times column total over grand total).', topic: Chi-square tests}
- {front: 'Degrees of freedom for independence', back: '$(r - 1)(c - 1)$ = $(rc - 1) - [(r - 1) + (c - 1)]$, the free parameters of the full model minus those under independence.', topic: Chi-square tests}
- {front: 'Why $X^2$ is approximately chi-square', back: 'With two categories $X^2 = Z^2$. In general $X^2 \approx G^2 = -2\ln\Lambda$, so Wilks gives $\chi^2$ with df = number of free probabilities fixed by $H_0$.', topic: Chi-square tests}
- {front: 'Rule of thumb for chi-square tests', back: 'Every expected count at least about 5. Otherwise combine categories or use an exact test.', topic: Chi-square tests}
- {front: 'Independence vs homogeneity', back: 'Independence: one sample classified two ways. Homogeneity: separate samples (fixed row totals), testing whether they share one column distribution. Same $X^2$, same df.', topic: Chi-square tests}
- {front: 'Simple linear regression model', back: '$Y_i = \beta_0 + \beta_1x_i + \varepsilon_i$, $x_i$ fixed, $\varepsilon_i$ i.i.d. $N(0, \sigma^2)$.', topic: Simple linear regression}
- {front: 'Least squares estimates', back: '$b_1 = S_{xy}/S_{xx}$, $b_0 = \bar y - b_1\bar x$. Also the MLEs under normal errors.', topic: Simple linear regression}
- {front: 'Normal equations for a line', back: '$\sum(y_i - b_0 - b_1x_i) = 0$ and $\sum x_i(y_i - b_0 - b_1x_i) = 0$, i.e. $\sum e_i = 0$, $\sum x_ie_i = 0$.', topic: Simple linear regression}
- {front: 'Sampling distribution of $b_1$', back: '$b_1 \sim N(\beta_1, \sigma^2/S_{xx})$, since $b_1 = \sum c_iY_i$ with $c_i = (x_i - \bar x)/S_{xx}$.', topic: Simple linear regression}
- {front: 'Variance of $b_0$', back: '$\operatorname{Var}(b_0) = \sigma^2\left(\dfrac1n + \dfrac{\bar x^2}{S_{xx}}\right)$', topic: Simple linear regression}
- {front: 'Estimate of $\sigma^2$ in regression', back: '$s^2 = \text{SSE}/(n-2)$, unbiased; $\text{SSE}/\sigma^2 \sim \chi^2_{n-2}$. Shortcut: $\text{SSE} = S_{yy} - b_1S_{xy}$.', topic: Simple linear regression}
- {front: '$t$ test for the slope', back: '$T = \dfrac{b_1 - \beta_1}{s/\sqrt{S_{xx}}} \sim t_{n-2}$. Interval: $b_1 \pm t_{\alpha/2,n-2}\,s/\sqrt{S_{xx}}$.', topic: Simple linear regression}
- {front: 'Confidence interval for the mean response at $x_0$', back: '$\hat y_0 \pm t_{\alpha/2,n-2}\,s\sqrt{\dfrac1n + \dfrac{(x_0 - \bar x)^2}{S_{xx}}}$', topic: Simple linear regression}
- {front: 'Prediction interval for a new $Y$ at $x_0$', back: '$\hat y_0 \pm t_{\alpha/2,n-2}\,s\sqrt{1 + \dfrac1n + \dfrac{(x_0 - \bar x)^2}{S_{xx}}}$. The extra 1 is the new error; it never shrinks to zero.', topic: Simple linear regression}
- {front: 'Regression sum of squares decomposition', back: '$\text{SST} = \text{SSR} + \text{SSE}$; $r^2 = \text{SSR}/\text{SST} = 1 - \text{SSE}/\text{SST}$; $F = \text{SSR}/s^2 = t^2$.', topic: Simple linear regression}
- {front: 'Reading residual plots', back: 'Curve: mean not linear. Funnel: variance not constant. Isolated far point: outlier. Want a patternless horizontal band.', topic: Simple linear regression}
- {front: 'One-way ANOVA model and hypotheses', back: '$Y_{ij} = \mu_i + \varepsilon_{ij}$, $\varepsilon_{ij}$ i.i.d. $N(0, \sigma^2)$. $H_0$: all $\mu_i$ equal; $H_1$: not all equal.', topic: One-way ANOVA}
- {front: 'ANOVA sums of squares', back: '$\text{SSTr} = \sum n_i(\bar y_{i\cdot} - \bar y_{\cdot\cdot})^2$ ($k - 1$ df); $\text{SSE} = \sum(n_i - 1)s_i^2$ ($N - k$ df); $\text{SST} = \text{SSTr} + \text{SSE}$ ($N - 1$ df).', topic: One-way ANOVA}
- {front: 'ANOVA $F$ statistic', back: '$F = \dfrac{\text{SSTr}/(k-1)}{\text{SSE}/(N-k)} \sim F_{k-1,\,N-k}$ under $H_0$; reject for large $F$ (upper tail only).', topic: One-way ANOVA}
- {front: 'Expected mean squares in ANOVA', back: '$E(\text{MSE}) = \sigma^2$; $E(\text{MSTr}) = \sigma^2 + \dfrac{\sum n_i(\mu_i - \bar\mu)^2}{k-1}$.', topic: One-way ANOVA}
- {front: 'ANOVA with two groups', back: '$F = t^2$ for the pooled two-sample $t$ statistic; the tests are equivalent.', topic: One-way ANOVA}
- {front: 'ANOVA assumptions', back: 'Independent observations, normal populations (fairly robust), equal variances (rule of thumb: largest $s_i \le 2\times$ smallest).', topic: One-way ANOVA}
- {front: 'Familywise error rate with $m$ independent tests', back: '$1 - (1 - \alpha)^m$; for 10 tests at 0.05 about 0.40.', topic: One-way ANOVA}
- {front: 'Bonferroni correction', back: 'Run each of $m$ comparisons at $\alpha/m$; the union bound keeps the familywise error rate at most $\alpha$.', topic: One-way ANOVA}
- {front: 'Bonferroni pairwise interval after ANOVA', back: '$\bar y_i - \bar y_j \pm t_{\alpha/(2m),\,N-k}\sqrt{\text{MSE}(1/n_i + 1/n_j)}$', topic: One-way ANOVA}
- {front: 'Sign test', back: 'Count positive differences (drop zeros): $B \sim \text{Bin}(n, 1/2)$ under $H_0$: median $= 0$. Assumes only independence and continuity.', topic: Nonparametric tests}
- {front: 'Wilcoxon signed-rank statistic', back: 'Rank $\lvert D_i\rvert$; $W^+$ = sum of ranks of positive $D_i$. $E(W^+) = n(n+1)/4$, $\operatorname{Var}(W^+) = n(n+1)(2n+1)/24$. Assumes symmetry.', topic: Nonparametric tests}
- {front: 'Wilcoxon rank-sum statistic', back: 'Rank all $N = m + n$ values; $W$ = sum of the first sample''s ranks. $E(W) = m(N+1)/2$, $\operatorname{Var}(W) = mn(N+1)/12$.', topic: Nonparametric tests}
- {front: 'Mann–Whitney $U$', back: '$U = W - m(m+1)/2$ = number of pairs with $X_i > Y_j$; ranges from 0 to $mn$; $U/(mn)$ estimates $P(X > Y)$.', topic: Nonparametric tests}
- {front: 'Permutation test', back: 'Under $H_0$ all relabelings of the data are equally likely; the p-value is the fraction of relabelings whose statistic is at least as extreme as observed.', topic: Nonparametric tests}
- {front: 'Parametric test and its rank-based alternative', back: 'Paired / one sample $t$: sign or signed-rank test. Two-sample $t$: rank-sum (Mann–Whitney). One-way ANOVA: Kruskal–Wallis.', topic: Nonparametric tests}
- {front: 'Asymptotic relative efficiency', back: 'Wilcoxon vs $t$ under normality: $3/\pi \approx 0.955$ (never below 0.864). Sign test vs $t$: $2/\pi \approx 0.64$. Heavy tails can favor rank tests.', topic: Nonparametric tests}
