# Glossary for modules ps-m1 (probability foundations), ps-m2 (discrete random variables)
# and ps-m3 (continuous random variables).
- term: sample space
  aliases: [sample spaces]
  definition: 'The set $S$ of all possible outcomes of a random experiment.'
  topic: Sample spaces and events
- term: outcome
  aliases: [outcomes]
  definition: 'A single element of the sample space: one complete result of the experiment.'
  topic: Sample spaces and events
- term: event
  aliases: [events]
  definition: 'A subset of the sample space. The event $A$ occurs when the actual outcome belongs to $A$.'
  topic: Sample spaces and events
- term: union
  definition: '$A \cup B$, the event that $A$ occurs, $B$ occurs, or both.'
  topic: Sample spaces and events
- term: intersection
  definition: '$A \cap B$, the event that both $A$ and $B$ occur.'
  topic: Sample spaces and events
- term: complement
  definition: '$A^c$, the event that $A$ does not occur; $P(A^c) = 1 - P(A)$.'
  topic: Sample spaces and events
- term: mutually exclusive
  aliases: [disjoint, disjoint events, mutually exclusive events]
  definition: 'Events that cannot occur together: $A \cap B = \varnothing$, so $P(A \cap B) = 0$.'
  topic: Sample spaces and events
- term: partition
  definition: 'A collection of pairwise disjoint events whose union is the whole sample space, so exactly one of them occurs.'
  topic: Sample spaces and events
- term: De Morgan's laws
  definition: '$(A \cup B)^c = A^c \cap B^c$ and $(A \cap B)^c = A^c \cup B^c$: "not (A or B)" is "neither", and "not both" is "at least one fails".'
  topic: Sample spaces and events
- term: probability measure
  definition: 'A rule assigning a number $P(A)$ to each event so that the three axioms of probability hold.'
  topic: Probability axioms
- term: axioms of probability
  aliases: [Kolmogorov's axioms, probability axioms]
  definition: '(1) $P(A) \ge 0$; (2) $P(S) = 1$; (3) for pairwise disjoint events, $P(\bigcup A_i) = \sum P(A_i)$. Every other rule of probability is derived from these.'
  topic: Probability axioms
- term: countable additivity
  definition: 'The third axiom: the probability of a union of countably many pairwise disjoint events is the sum of their probabilities.'
  topic: Probability axioms
- term: complement rule
  definition: '$P(A^c) = 1 - P(A)$, because $A$ and $A^c$ are disjoint with union $S$.'
  topic: Probability axioms
- term: addition rule
  definition: '$P(A \cup B) = P(A) + P(B) - P(A \cap B)$; the overlap is subtracted because the sum counts it twice.'
  topic: Probability axioms
- term: inclusion–exclusion principle
  aliases: [inclusion-exclusion principle, inclusion–exclusion, inclusion-exclusion]
  definition: 'The probability of a union equals the sum of single probabilities, minus the sum over pairs of intersections, plus the sum over triples, and so on with alternating signs.'
  topic: Probability axioms
- term: Boole's inequality
  aliases: [union bound]
  definition: '$P(\bigcup A_i) \le \sum P(A_i)$ for any events; it needs no information about overlaps.'
  topic: Probability axioms
- term: Bonferroni inequality
  definition: '$P(A \cap B) \ge P(A) + P(B) - 1$, a lower bound for an intersection that holds however the events are related.'
  topic: Probability axioms
- term: equally likely outcomes
  definition: 'A finite sample space in which every outcome has probability $1/|S|$, so $P(A) = |A|/|S|$.'
  topic: Sample spaces and events
- term: multiplication principle
  definition: 'If a procedure has stages with $n_1, n_2, \ldots, n_k$ choices (the count at each stage not depending on earlier choices), it can be done in $n_1 n_2 \cdots n_k$ ways.'
  topic: Counting methods
- term: permutation
  aliases: [permutations]
  definition: 'An ordered arrangement. There are $n!$ orderings of $n$ distinct objects and $n!/(n-r)!$ ordered selections of $r$ of them.'
  topic: Counting methods
- term: combination
  aliases: [combinations]
  definition: 'An unordered selection. The number of $r$-element subsets of an $n$-element set is $\binom{n}{r}$.'
  topic: Counting methods
- term: binomial coefficient
  aliases: [binomial coefficients]
  definition: '$\binom{n}{r} = \dfrac{n!}{r!\,(n-r)!}$, the number of ways to choose $r$ objects from $n$ when order does not matter.'
  topic: Counting methods
- term: binomial theorem
  definition: '$(x + y)^n = \sum_{r=0}^{n}\binom{n}{r}x^r y^{n-r}$.'
  topic: Counting methods
- term: multinomial coefficient
  aliases: [multinomial coefficients]
  definition: '$\dfrac{n!}{n_1!\,n_2!\cdots n_k!}$, the number of ways to divide $n$ objects into labeled groups of sizes $n_1, \ldots, n_k$ (or to arrange $n$ objects with identical copies).'
  topic: Counting methods
- term: birthday problem
  definition: 'The chance that at least two of $n$ people share a birthday, $1 - \prod_{i=0}^{n-1}(1 - i/365)$; it passes 50% at $n = 23$.'
  topic: Birthday and matching problems
- term: matching problem
  definition: 'The chance that a random permutation of $n$ items fixes at least one item, $\sum_{k=1}^{n}(-1)^{k+1}/k!$, which tends to $1 - 1/e \approx 0.632$.'
  topic: Birthday and matching problems
- term: conditional probability
  definition: '$P(A \mid B) = P(A \cap B)/P(B)$ for $P(B) > 0$: the probability of $A$ once we know $B$ occurred.'
  topic: Conditional probability
- term: multiplication rule
  definition: '$P(A \cap B) = P(B)\,P(A \mid B) = P(A)\,P(B \mid A)$.'
  topic: Conditional probability
- term: chain rule
  definition: '$P(A_1 \cap \cdots \cap A_n) = P(A_1)P(A_2 \mid A_1)\cdots P(A_n \mid A_1 \cap \cdots \cap A_{n-1})$.'
  topic: Conditional probability
- term: law of total probability
  aliases: [total probability]
  definition: 'For a partition $B_1, \ldots, B_k$: $P(A) = \sum_i P(B_i)\,P(A \mid B_i)$.'
  topic: Conditional probability
- term: Bayes' theorem
  aliases: [Bayes theorem, Bayes rule]
  definition: '$P(B_j \mid A) = \dfrac{P(B_j)P(A \mid B_j)}{\sum_i P(B_i)P(A \mid B_i)}$: it reverses a conditional probability.'
  topic: Bayes' theorem
- term: prior probability
  aliases: [prior]
  definition: 'The probability of a hypothesis or scenario before the evidence is taken into account.'
  topic: Bayes' theorem
- term: posterior probability
  aliases: [posterior]
  definition: 'The probability of a hypothesis or scenario after updating on the evidence with Bayes'' theorem.'
  topic: Bayes' theorem
- term: likelihood
  aliases: [likelihoods]
  definition: 'In Bayes'' theorem, the probability $P(A \mid B_i)$ of the observed evidence under each scenario.'
  topic: Bayes' theorem
- term: odds
  definition: 'The ratio $P(B)/P(B^c)$. Odds of $o$ correspond to the probability $o/(1 + o)$.'
  topic: Bayes' theorem
- term: likelihood ratio
  definition: '$P(A \mid B)/P(A \mid B^c)$, the factor by which evidence $A$ multiplies the odds on $B$: posterior odds = prior odds × likelihood ratio.'
  topic: Bayes' theorem
- term: base rate
  definition: 'The prior probability of a condition in the population; ignoring it is the most common error in Bayes problems.'
  topic: Bayes' theorem
- term: sensitivity
  definition: 'For a test, $P(\text{positive} \mid \text{condition present})$.'
  topic: Bayes' theorem
- term: specificity
  definition: 'For a test, $P(\text{negative} \mid \text{condition absent})$; one minus it is the false-positive rate.'
  topic: Bayes' theorem
- term: independent
  aliases: [independent events, independence]
  definition: 'Events with $P(A \cap B) = P(A)P(B)$; when $P(B) > 0$ this means $P(A \mid B) = P(A)$.'
  topic: Independence
- term: mutually independent
  aliases: [mutual independence]
  definition: 'Events such that every subcollection of two or more satisfies the product rule for its intersection.'
  topic: Independence
- term: pairwise independent
  aliases: [pairwise independence]
  definition: 'Events in which every pair is independent. This is weaker than mutual independence.'
  topic: Independence
- term: independent trials
  definition: 'Repetitions of an experiment in which events determined by different trials are mutually independent.'
  topic: Independence
- term: conditionally independent
  aliases: [conditional independence]
  definition: '$A$ and $B$ are conditionally independent given $C$ if $P(A \cap B \mid C) = P(A \mid C)\,P(B \mid C)$.'
  topic: Independence
- term: reliability
  definition: 'The probability that a component or system works.'
  topic: Independence
- term: series system
  definition: 'A system that works only if every component works; with independent components its reliability is $\prod p_i$.'
  topic: Independence
- term: parallel system
  definition: 'A system that works if at least one component works; with independent components its reliability is $1 - \prod(1 - p_i)$.'
  topic: Independence
- term: gambler's fallacy
  definition: 'The mistaken belief that a run of failures in independent trials makes a success more likely next time.'
  topic: Geometric distribution
- term: random variable
  aliases: [random variables]
  definition: 'A function $X : S \to \mathbb{R}$ that assigns a number to each outcome of an experiment.'
  topic: Random variables and pmfs
- term: discrete random variable
  aliases: [discrete random variables]
  definition: 'A random variable whose possible values form a finite or countably infinite list.'
  topic: Random variables and pmfs
- term: indicator variable
  aliases: [indicator, indicators, indicator variables]
  definition: '$I_A = 1$ if $A$ occurs and 0 otherwise; $E(I_A) = P(A)$. Counts are sums of indicators.'
  topic: Random variables and pmfs
- term: probability mass function
  aliases: [pmf, pmfs]
  definition: 'For a discrete random variable, $p(x) = P(X = x)$; it is nonnegative and sums to 1.'
  topic: Random variables and pmfs
- term: cumulative distribution function
  aliases: [cdf, cdfs, distribution function]
  definition: '$F(x) = P(X \le x)$. It is nondecreasing, right-continuous, and rises from 0 to 1.'
  topic: Random variables and pmfs
- term: step function
  definition: 'A function that is constant between jumps; the cdf of a discrete random variable jumps by $p(x_i)$ at each value $x_i$.'
  topic: Random variables and pmfs
- term: expected value
  aliases: [expectation, mean, expected values]
  definition: 'The probability-weighted average $E(X) = \sum x\,p(x)$ (discrete) or $\int x f(x)\,dx$ (continuous), when it converges absolutely.'
  topic: Expectation and variance
- term: law of the unconscious statistician
  aliases: [LOTUS]
  definition: '$E[g(X)] = \sum g(x)p(x)$ or $\int g(x)f(x)\,dx$: the mean of a function of $X$ without finding its distribution.'
  topic: Expectation and variance
- term: variance
  definition: '$\operatorname{Var}(X) = E[(X - \mu)^2] = E(X^2) - \mu^2$, the mean squared distance from the mean.'
  topic: Expectation and variance
- term: standard deviation
  aliases: [SD]
  definition: 'The square root of the variance, measured in the units of $X$.'
  topic: Expectation and variance
- term: computing formula
  definition: 'The variance shortcut $\operatorname{Var}(X) = E(X^2) - [E(X)]^2$.'
  topic: Expectation and variance
- term: moment
  aliases: [moments]
  definition: 'The $k$-th moment of $X$ is $E(X^k)$; the mean is the first moment.'
  topic: Moment generating functions
- term: Bernoulli trial
  aliases: [Bernoulli trials]
  definition: 'An experiment with two outcomes, success (with probability $p$) and failure.'
  topic: Binomial distribution
- term: Bernoulli distribution
  definition: 'The distribution of a 0–1 variable with $P(X = 1) = p$; mean $p$, variance $p(1-p)$.'
  topic: Binomial distribution
- term: binomial distribution
  definition: 'The number of successes in $n$ independent trials with success probability $p$: $P(X = k) = \binom{n}{k}p^k(1-p)^{n-k}$; mean $np$, variance $np(1-p)$.'
  topic: Binomial distribution
- term: factorial moment
  definition: '$E[X(X-1)]$ (and higher analogues), often easier to compute for discrete distributions; $\operatorname{Var}(X) = E[X(X-1)] + E(X) - [E(X)]^2$.'
  topic: Binomial distribution
- term: mode
  definition: 'The most likely value of a discrete distribution (or the peak of a density). For $\text{Bin}(n, p)$ it is $\lfloor (n+1)p \rfloor$.'
  topic: Binomial distribution
- term: hypergeometric distribution
  definition: 'The number of successes in a sample of $n$ drawn without replacement from $N$ items containing $K$ successes: $\binom{K}{k}\binom{N-K}{n-k}/\binom{N}{n}$; mean $nK/N$.'
  topic: Hypergeometric distribution
- term: finite population correction
  definition: 'The factor $(N - n)/(N - 1)$ that shrinks the variance when sampling without replacement from a finite population.'
  topic: Hypergeometric distribution
- term: geometric distribution
  definition: 'The number of independent trials up to and including the first success: $P(X = k) = (1-p)^{k-1}p$; mean $1/p$, variance $(1-p)/p^2$.'
  topic: Geometric distribution
- term: tail-sum formula
  aliases: [tail formula]
  definition: 'For a variable with values in $\{0, 1, 2, \ldots\}$, $E(X) = \sum_{k \ge 0}P(X > k)$; for a nonnegative continuous variable, $E(X) = \int_0^\infty P(X > x)\,dx$.'
  topic: Geometric distribution
- term: memoryless property
  aliases: [memoryless, memorylessness]
  definition: '$P(X > s + t \mid X > s) = P(X > t)$: having waited $s$ does not change the distribution of the remaining wait. The geometric (discrete) and exponential (continuous) distributions are the only ones with it.'
  topic: Exponential distribution
- term: negative binomial distribution
  definition: 'The number of independent trials needed for the $r$-th success: $P(X = k) = \binom{k-1}{r-1}p^r(1-p)^{k-r}$; mean $r/p$, variance $r(1-p)/p^2$.'
  topic: Negative binomial distribution
- term: coupon collector problem
  definition: 'Collecting all $n$ equally likely types takes on average $n(1 + \tfrac12 + \cdots + \tfrac1n)$ draws, a sum of geometric waiting times.'
  topic: Geometric distribution
- term: Poisson distribution
  definition: 'The count of rare events in a fixed interval: $P(X = k) = e^{-\lambda}\lambda^k/k!$; mean and variance both $\lambda$.'
  topic: Poisson distribution
- term: Poisson process
  definition: 'Events in time with independent, stationary increments and no simultaneous events; the count in time $t$ is Poisson$(\lambda t)$ and the gaps are exponential.'
  topic: Poisson process
- term: rate
  definition: 'In a Poisson process or exponential distribution, the parameter $\lambda$: the expected number of events per unit time.'
  topic: Poisson process
- term: overdispersion
  definition: 'Count data whose variance is clearly larger than its mean, a sign that a Poisson model is inadequate (events cluster or the rate varies).'
  topic: Poisson distribution
- term: moment generating function
  aliases: [MGF, MGFs, moment generating functions]
  definition: '$M_X(t) = E(e^{tX})$. Its derivatives at 0 are the moments, it determines the distribution, and $M_{X+Y} = M_X M_Y$ for independent $X, Y$.'
  topic: Moment generating functions
- term: uniqueness theorem for MGFs
  definition: 'If two MGFs exist and agree on an open interval around 0, the two distributions are identical.'
  topic: Moment generating functions
- term: continuous random variable
  aliases: [continuous random variables]
  definition: 'A random variable with a density $f$ such that $P(a \le X \le b) = \int_a^b f(x)\,dx$; every single value has probability 0.'
  topic: Densities and cdfs
- term: probability density function
  aliases: [pdf, pdfs, density, densities]
  definition: 'A function $f \ge 0$ with total integral 1 whose areas give probabilities; $f(x)$ is probability per unit length, not a probability.'
  topic: Densities and cdfs
- term: quantile
  aliases: [quantiles]
  definition: 'The quantile of order $p$ is the value $x_p$ with $F(x_p) = p$.'
  topic: Densities and cdfs
- term: percentile
  aliases: [percentiles]
  definition: 'The $100p$-th percentile is the quantile of order $p$.'
  topic: Densities and cdfs
- term: median
  definition: 'The value $m$ with $F(m) = \tfrac12$, which splits the probability in half.'
  topic: Densities and cdfs
- term: Pareto distribution
  definition: 'A heavy-tailed distribution with $P(X > x) = (\theta/x)^{\alpha}$ for $x \ge \theta$; its mean is finite only for $\alpha > 1$ and its variance only for $\alpha > 2$.'
  topic: Continuous expectation
- term: Cauchy distribution
  definition: 'The density $1/[\pi(1 + x^2)]$, symmetric about 0 but with no mean, because $\int |x| f(x)\,dx$ diverges.'
  topic: Continuous expectation
- term: uniform distribution
  definition: '$\text{U}(a, b)$ has constant density $1/(b - a)$ on $[a, b]$; mean $(a+b)/2$, variance $(b-a)^2/12$.'
  topic: Uniform distribution
- term: standard uniform
  definition: 'The uniform distribution on $(0, 1)$, from which computers simulate other distributions.'
  topic: Uniform distribution
- term: exponential distribution
  definition: 'Density $\lambda e^{-\lambda x}$ for $x \ge 0$, with $P(X > x) = e^{-\lambda x}$; mean $1/\lambda$, variance $1/\lambda^2$; memoryless.'
  topic: Exponential distribution
- term: survival function
  definition: '$P(X > x) = 1 - F(x)$, the probability of lasting beyond $x$.'
  topic: Exponential distribution
- term: hazard rate
  aliases: [failure rate]
  definition: '$h(x) = f(x)/P(X > x)$, the instantaneous failure rate among items that have survived to $x$; constant for the exponential.'
  topic: Exponential distribution
- term: normal distribution
  aliases: [Gaussian distribution, normal]
  definition: '$\text{N}(\mu, \sigma^2)$ has density $\dfrac{1}{\sigma\sqrt{2\pi}}e^{-(x-\mu)^2/(2\sigma^2)}$, a bell curve with mean $\mu$ and variance $\sigma^2$.'
  topic: Normal distribution
- term: standard normal
  definition: 'The normal distribution with mean 0 and variance 1; its cdf is written $\Phi$ and its density $\phi$.'
  topic: Normal distribution
- term: z-score
  aliases: [z-scores, standardizing]
  definition: '$z = (x - \mu)/\sigma$, the number of standard deviations from the mean; it turns any normal variable into a standard normal one.'
  topic: Normal distribution
- term: continuity correction
  definition: 'Widening each integer value of a discrete variable to the interval $[k - 0.5, k + 0.5]$ when approximating it by a continuous (usually normal) distribution.'
  topic: Normal approximation
- term: gamma function
  definition: '$\Gamma(\alpha) = \int_0^\infty x^{\alpha-1}e^{-x}\,dx$; $\Gamma(\alpha + 1) = \alpha\Gamma(\alpha)$, $\Gamma(n) = (n-1)!$, $\Gamma(\tfrac12) = \sqrt\pi$.'
  topic: Gamma distribution
- term: gamma distribution
  definition: 'Density $x^{\alpha-1}e^{-x/\beta}/[\Gamma(\alpha)\beta^\alpha]$ for $x > 0$; mean $\alpha\beta$, variance $\alpha\beta^2$, MGF $(1 - \beta t)^{-\alpha}$.'
  topic: Gamma distribution
- term: shape parameter
  definition: 'A parameter that changes the form of a density (for the gamma distribution, $\alpha$), not just its location or spread.'
  topic: Gamma distribution
- term: scale parameter
  definition: 'A parameter that stretches a distribution along the axis (for the gamma distribution, $\beta$; the rate is $1/\beta$).'
  topic: Gamma distribution
- term: Erlang distribution
  definition: 'A gamma distribution with integer shape $k$: the time of the $k$-th event in a Poisson process.'
  topic: Gamma distribution
- term: chi-square distribution
  aliases: [chi-square]
  definition: '$\chi^2(\nu) = \text{Gamma}(\nu/2, 2)$, the distribution of a sum of $\nu$ independent squared standard normals; mean $\nu$, variance $2\nu$.'
  topic: Gamma distribution
- term: degrees of freedom
  definition: 'The parameter $\nu$ of a chi-square distribution (and later of $t$ and $F$ distributions).'
  topic: Gamma distribution
- term: beta function
  definition: '$B(a, b) = \int_0^1 x^{a-1}(1-x)^{b-1}\,dx = \Gamma(a)\Gamma(b)/\Gamma(a + b)$.'
  topic: Beta distribution
- term: beta distribution
  definition: 'Density $x^{a-1}(1-x)^{b-1}/B(a, b)$ on $(0, 1)$; mean $a/(a + b)$, variance $ab/[(a+b)^2(a+b+1)]$. Used for proportions and as a prior for $p$.'
  topic: Beta distribution
- term: cdf method
  definition: 'Finding the distribution of $Y = g(X)$ by writing $F_Y(y) = P(g(X) \le y)$ as a probability about $X$ and differentiating.'
  topic: Functions of a random variable
- term: change-of-variables formula
  definition: 'For strictly monotone $g$: $f_Y(y) = f_X(g^{-1}(y))\,\left|\dfrac{d}{dy}g^{-1}(y)\right|$.'
  topic: Functions of a random variable
- term: Jacobian
  definition: 'The derivative factor $|dx/dy|$ (in higher dimensions, the absolute determinant of the derivative matrix) that rescales a density under a change of variables.'
  topic: Functions of a random variable
- term: lognormal distribution
  aliases: [lognormal]
  definition: 'The distribution of $e^X$ when $X$ is normal; its median is $e^\mu$ and its mean is $e^{\mu + \sigma^2/2}$.'
  topic: Functions of a random variable
- term: probability integral transform
  definition: 'If $X$ is continuous with cdf $F$, then $F(X)$ is uniform on $(0, 1)$.'
  topic: Functions of a random variable
- term: inverse transform sampling
  definition: 'Simulating $X$ with cdf $F$ as $F^{-1}(U)$, where $U$ is a standard uniform random number.'
  topic: Functions of a random variable
- term: Weibull distribution
  definition: 'A lifetime distribution with $P(X > x) = e^{-(x/s)^k}$; $k = 1$ is the exponential, and $k > 1$ gives an increasing hazard rate (wear-out).'
  topic: Functions of a random variable
