# Round 2 glossary for module ps-m2 (honors lessons 09h1, 09h2)
- term: probability generating function
  aliases: [PGF, PGFs, probability generating functions]
  definition: 'For $X$ with values $0, 1, 2, \ldots$, the function $G_X(s) = E(s^X) = \sum_k P(X = k)s^k$; its coefficients are the pmf, and $G_X''(1) = E(X)$.'
  topic: Probability generating functions
- term: thinning
  aliases: [thinned, Poisson thinning]
  definition: 'Keeping each event of a count independently with probability $p$. Thinning a Poisson$(\lambda)$ count gives a Poisson$(\lambda p)$ count.'
  topic: Probability generating functions
- term: offspring distribution
  aliases: [offspring law]
  definition: 'In a branching process, the distribution $p_0, p_1, p_2, \ldots$ of the number of children of each individual.'
  topic: Branching processes
- term: branching process
  aliases: [branching processes, Galton–Watson process, Galton-Watson process]
  definition: 'A population model in which each individual of a generation independently has a random number of children (with the offspring distribution), and those children form the next generation.'
  topic: Branching processes
- term: supercritical
  definition: 'Describes a branching process whose mean offspring number $m$ exceeds 1; its line survives forever with positive probability.'
  topic: Branching processes
- term: subcritical
  definition: 'Describes a branching process whose mean offspring number $m$ is less than 1; it dies out with probability 1.'
  topic: Branching processes
- term: critical
  definition: 'Describes a branching process whose mean offspring number is exactly 1; unless every individual has exactly one child, it still dies out with probability 1.'
  topic: Branching processes
- term: extinction probability
  definition: 'The probability $q$ that a branching process eventually has an empty generation; it is the smallest root of $f(s) = s$ in $[0, 1]$, where $f$ is the offspring PGF.'
  topic: Branching processes
- term: total variation distance
  aliases: [total variation, TV distance]
  definition: 'The largest difference between the probabilities two distributions give to the same event, $d_{TV} = \max_A |P(X \in A) - P(Y \in A)|$; for counts it equals $\tfrac12\sum_k |P(X = k) - P(Y = k)|$.'
  topic: Poisson approximation
- term: Poisson binomial distribution
  definition: 'The distribution of a sum of independent Bernoulli indicators whose success probabilities $p_i$ may differ.'
  topic: Poisson approximation
- term: Le Cam's inequality
  aliases: [Le Cam inequality, Le Cam's theorem, Le Cam's bound]
  definition: 'For independent indicators with probabilities $p_i$, the total variation distance between their sum and Poisson$(\sum p_i)$ is at most $\sum p_i^2$ (Lucien Le Cam, 1960).'
  topic: Poisson approximation
- term: coupling
  aliases: [couplings]
  definition: 'A construction of two random variables on one sample space with the right marginal distributions, chosen so that they are usually equal; then $d_{TV} \le P(S \ne T)$.'
  topic: Poisson approximation
- term: Poisson paradigm
  definition: 'The rule of thumb that the number of many rare, weakly dependent events that occur is approximately Poisson with mean equal to the sum of their probabilities. A heuristic, not a theorem.'
  topic: Poisson approximation
