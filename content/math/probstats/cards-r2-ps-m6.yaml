# Round 2 notecards for module ps-m6 (honors lessons 29h1-29h3).
- {front: 'Two facts about the score at the true $\theta$', back: '$E[U(\theta)] = 0$ and $\operatorname{Var}(U(\theta)) = nI(\theta)$, so $U(\theta)/\sqrt n \approx N(0, I(\theta))$ by the CLT.', topic: Likelihood computation}
- {front: 'Why the MLE is approximately normal (sketch)', back: '$0 = U(\hat\theta) \approx U(\theta) + U''(\theta)(\hat\theta - \theta)$; CLT for $U(\theta)/\sqrt n$, LLN for $-U''(\theta)/n \to I(\theta)$; so $\hat\theta \approx N(\theta, 1/(nI(\theta)))$.', topic: Likelihood computation}
- {front: 'Newton step for an MLE', back: '$\theta_{k+1} = \theta_k - \ell''(\theta_k)/\ell''''(\theta_k)$. Fast near the answer; can overshoot or find a minimum from a poor start.', topic: Likelihood computation}
- {front: 'Fisher scoring step', back: '$\theta_{k+1} = \theta_k + \ell''(\theta_k)/(nI(\theta_k))$: Newton with expected information; always steps uphill.', topic: Likelihood computation}
- {front: 'Standard error from observed information', back: '$\text{SE} = 1/\sqrt{J(\hat\theta)}$ with $J(\hat\theta) = -\ell''''(\hat\theta)$; Wald interval $\hat\theta \pm z_{\alpha/2}\text{SE}$.', topic: Likelihood computation}
- {front: 'Exponential rate: MLE, information, SE', back: '$\hat\lambda = n/\sum x_i$, $J(\hat\lambda) = n/\hat\lambda^2$, $\text{SE} = \hat\lambda/\sqrt n$.', topic: Likelihood computation}
- {front: 'Zero-truncated Poisson likelihood equation', back: '$\bar x = \lambda/(1 - e^{-\lambda})$; no closed form, solve numerically (fault data: $\bar x = 1.5$ gives $\hat\lambda \approx 0.874$).', topic: Likelihood computation}
- {front: 'Several parameters: standard errors', back: 'Covariance $\approx (nI)^{-1}$; SE of $\hat\eta_j$ = square root of the $j$th diagonal entry of the inverse, not $1/\sqrt{nI_{jj}}$.', topic: Likelihood computation}
- {front: 'Inverse of a 2 × 2 information matrix', back: '$\begin{pmatrix} a & b \\ b & d\end{pmatrix}^{-1} = \dfrac{1}{ad - b^2}\begin{pmatrix} d & -b \\ -b & a\end{pmatrix}$; SEs $\sqrt{d/(ad - b^2)}$ and $\sqrt{a/(ad - b^2)}$.', topic: Likelihood computation}
- {front: 'Normal information matrix for $(\mu, \sigma^2)$', back: 'Per observation $\operatorname{diag}(1/\sigma^2,\; 1/(2\sigma^4))$: $\hat\mu$ and $\hat\sigma^2$ asymptotically uncorrelated, $\text{SE}(\hat\sigma^2) \approx \sigma^2\sqrt{2/n}$.', topic: Likelihood computation}
- {front: 'Wald interval vs likelihood interval', back: 'Wald: symmetric, uses curvature at the peak. Likelihood: $2[\ell(\hat\theta) - \ell(\theta)] \le 3.84$, follows the shape of $\ell$; better for small $n$.', topic: Likelihood computation}
- {front: 'Risk function', back: '$R(\theta, \delta) = E_\theta[L(\theta, \delta(X))]$; under squared-error loss it is the MSE.', topic: Decision theory}
- {front: 'Bayes estimator for each loss', back: 'Squared error: posterior mean. Absolute error: posterior median. Zero–one (small tolerance): posterior mode.', topic: Decision theory}
- {front: 'Bayes risk', back: '$r(\pi, \delta) = \int R(\theta, \delta)\pi(\theta)\,d\theta$; the Bayes estimator minimizes it.', topic: Decision theory}
- {front: 'Minimax estimator', back: 'Minimizes $\max_\theta R(\theta, \delta)$. A Bayes estimator with constant risk is minimax.', topic: Decision theory}
- {front: 'Minimax estimator of a binomial $p$', back: '$\dfrac{X + \sqrt n/2}{n + \sqrt n}$ (Bayes for Beta$(\sqrt n/2, \sqrt n/2)$), constant risk $\dfrac{1}{4(1 + \sqrt n)^2}$.', topic: Decision theory}
- {front: 'Dominated and inadmissible', back: '$\delta''$ dominates $\delta$ if its risk is never larger and sometimes smaller; a dominated estimator is inadmissible. Example: $S^2$ for normal $\sigma^2$ (divide by $n + 1$ instead).', topic: Decision theory}
- {front: 'Why a unique Bayes estimator is admissible', back: 'A dominating estimator would have Bayes risk no larger, so it would also be Bayes; uniqueness makes it the same estimator.', topic: Decision theory}
- {front: 'Risk of linear shrinkage $c\bar X + (1-c)\mu_0$', back: '$c^2v + (1 - c)^2(\theta - \mu_0)^2$ with $v = \sigma^2/n$; beats $\bar X$ when $(\theta - \mu_0)^2 < \frac{1+c}{1-c}v$.', topic: Decision theory}
- {front: 'Normal prior: Bayes estimator and Bayes risk', back: 'Prior $N(\mu_0, \tau^2)$: $c = \tau^2/(\tau^2 + v)$, Bayes risk $cv$ (the posterior variance). $\bar X$ is minimax.', topic: Decision theory}
- {front: 'Exact coverage for binomial data', back: '$C(p) = \sum_{x=0}^n \mathbf 1\{p \in \text{interval}(x)\}\binom nx p^x(1-p)^{n-x}$, a jagged function of $p$.', topic: Intervals for a proportion}
- {front: 'Why the Wald interval for $p$ fails', back: 'Plug-in SE is too small when $\hat p$ is near 0 or 1 (zero width at $x = 0$); symmetric although the binomial is skewed; coverage erratic in $n$.', topic: Intervals for a proportion}
- {front: 'Wilson interval', back: 'Solve $|\hat p - p| \le z\sqrt{p(1-p)/n}$ for $p$: center $\dfrac{\hat p + z^2/2n}{1 + z^2/n}$, half-width $\dfrac{z}{1 + z^2/n}\sqrt{\dfrac{\hat p(1-\hat p)}{n} + \dfrac{z^2}{4n^2}}$.', topic: Intervals for a proportion}
- {front: 'Agresti–Coull interval (95%)', back: '$\tilde p = (x + 2)/(n + 4)$, then $\tilde p \pm 1.96\sqrt{\tilde p(1 - \tilde p)/(n + 4)}$.', topic: Intervals for a proportion}
- {front: 'Clopper–Pearson interval', back: 'Invert exact one-sided tests: $P(X \ge x; p_L) = \alpha/2$, $P(X \le x; p_U) = \alpha/2$. Coverage always at least $1 - \alpha$; wide.', topic: Intervals for a proportion}
- {front: 'Jeffreys interval', back: 'Equal-tailed quantiles of Beta$(x + \tfrac12,\; n - x + \tfrac12)$ (Jeffreys prior Beta$(\tfrac12, \tfrac12)$); coverage close to nominal.', topic: Intervals for a proportion}
- {front: 'Zero events in $n$ trials', back: 'Exact one-sided upper bound $1 - \alpha^{1/n}$; for 95%, about $3/n$ (rule of three).', topic: Intervals for a proportion}
- {front: 'Which proportion interval to use', back: 'Small $n$ (up to about 40): Wilson or Jeffreys. Larger $n$: Agresti–Coull is fine. Guaranteed coverage: Clopper–Pearson. Avoid plain Wald.', topic: Intervals for a proportion}
