<rect x="380" y="158" width="145" height="70" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="452.5" y="201" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1c2833" text-anchor="middle">C</text>
