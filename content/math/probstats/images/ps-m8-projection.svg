<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img">
<title>Least squares as a projection onto the column space of X</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2833"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b03a2e"/></marker></defs>
<rect x="0" y="0" width="720" height="430" fill="#ffffff"/>
<polygon points="60,340 470,400 670,250 260,190" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<line x1="180" y1="320" x2="447" y2="94" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="180" y1="320" x2="446" y2="281" stroke="#1c2833" stroke-width="3" marker-end="url(#ah)"/>
<line x1="450" y1="90" x2="450" y2="276" stroke="#b03a2e" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ar)"/>
<polyline points="450,262 434.2,264.3 434.2,280.3" fill="none" stroke="#1c2833" stroke-width="1.8"/>
<circle cx="180" cy="320" r="5" fill="#1c2833"/>
<circle cx="450" cy="280" r="5" fill="#1c2833"/>
<circle cx="450" cy="90" r="5" fill="#1c2833"/>
<text x="166" y="344" font-family="sans-serif" font-size="16" fill="#1c2833">O</text>
<text x="462" y="88" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2833">y (data)</text>
<text x="462" y="306" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1c2833">ŷ = Hy (fitted)</text>
<text x="462" y="190" font-family="sans-serif" font-size="18" font-weight="bold" fill="#b03a2e">e = y − ŷ (residual)</text>
<text x="300" y="380" font-family="sans-serif" font-size="16" fill="#1c2833">column space of X</text>
<text x="300" y="400" font-family="sans-serif" font-size="14" fill="#1c2833">(all vectors Xb)</text>
<text x="36" y="40" font-family="sans-serif" font-size="16" fill="#1c2833">e is at right angles to the plane,</text>
<text x="36" y="62" font-family="sans-serif" font-size="16" fill="#1c2833">so ŷ is the closest point to y</text>
</svg>