<text x="222.0" y="438" font-size="15" text-anchor="middle">P(A) = 0.4</text>
<text x="402.0" y="438" font-size="15" text-anchor="middle">P(Aᶜ) = 0.6</text>
<text x="140" y="361.0" font-size="15" text-anchor="end">P(B) = 0.3</text>
<text x="140" y="181.0" font-size="15" text-anchor="end">P(Bᶜ) = 0.7</text>
<text x="330" y="470" font-size="14" text-anchor="middle" font-style="italic">whole square: area 1 = P(S)</text>
<text x="330" y="30" font-size="17" text-anchor="middle" font-weight="bold">Independent events: areas multiply</text>
<text x="222.0" y="352.0" font-size="16" text-anchor="middle" font-weight="bold">A ∩ B</text>
<text x="222.0" y="374.0" font-size="14" text-anchor="middle">0.4 × 0.3 = 0.12</text>
<text x="222.0" y="172.0" font-size="16" text-anchor="middle" font-weight="bold">A ∩ Bᶜ</text>
<text x="222.0" y="194.0" font-size="14" text-anchor="middle">0.4 × 0.7 = 0.28</text>
<text x="402.0" y="352.0" font-size="16" text-anchor="middle" font-weight="bold">Aᶜ ∩ B</text>
<text x="402.0" y="374.0" font-size="14" text-anchor="middle">0.6 × 0.3 = 0.18</text>
<text x="402.0" y="172.0" font-size="16" text-anchor="middle" font-weight="bold">Aᶜ ∩ Bᶜ</text>
<text x="402.0" y="194.0" font-size="14" text-anchor="middle">0.6 × 0.7 = 0.42</text>
