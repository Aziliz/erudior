# Round 2 glossary for module ps-m7 (honors lessons 33h1 and 33h2).
- term: score function
  aliases: [score, scores]
  definition: 'The derivative of the log-likelihood, $U(\theta) = \ell''(\theta)$. At the true parameter it has mean 0 and variance $nI(\theta)$ for $n$ independent observations.'
  topic: Wald, score and likelihood ratio tests
- term: observed information
  aliases: [observed Fisher information]
  definition: 'The negative second derivative of the log-likelihood, $J(\theta) = -\ell''''(\theta)$: the curvature of the log-likelihood. In large samples $J(\theta)/n$ is close to the Fisher information $I(\theta)$.'
  topic: Wald, score and likelihood ratio tests
- term: Wald test
  aliases: [Wald tests, Wald statistic, Wald z test]
  definition: 'A large-sample test using $W = (\hat\theta - \theta_0)^2\,nI(\hat\theta)$, the squared distance from the MLE to the null value with the variance estimated at the MLE; approximately $\chi^2_1$ under $H_0$. Not invariant to reparametrization.'
  topic: Wald, score and likelihood ratio tests
- term: score test
  aliases: [score tests, score statistic, Rao score test, Rao's score test, Lagrange multiplier test, LM test]
  definition: 'A large-sample test using $S = U(\theta_0)^2/nI(\theta_0)$, the squared score at the null value divided by its null variance; approximately $\chi^2_1$ under $H_0$ and needs only the null fit. The one-proportion z test and Pearson''s chi-square are score tests.'
  topic: Wald, score and likelihood ratio tests
- term: sequential test
  aliases: [sequential tests, sequential testing, sequential analysis]
  definition: 'A test that examines observations as they arrive and after each one decides to reject $H_0$, accept it, or take another observation, so the sample size is random.'
  topic: Sequential tests
- term: sequential probability ratio test
  aliases: [SPRT, SPRTs, Wald's sequential probability ratio test]
  definition: 'Wald''s sequential test of two simple hypotheses: add $\ln[f(X_i;\theta_1)/f(X_i;\theta_0)]$ after each observation, reject $H_0$ when the sum reaches $b = \ln\frac{1-\beta}{\alpha}$ and accept it when the sum falls to $a = \ln\frac{\beta}{1-\alpha}$.'
  topic: Sequential tests
- term: continuation region
  aliases: [continuation band]
  definition: 'In a sequential test, the set of values of the running statistic (for the SPRT, the interval $(a, b)$) for which another observation is taken.'
  topic: Sequential tests
- term: overshoot
  aliases: [overshoots, excess over the boundary]
  definition: 'The amount by which a sequential test statistic jumps past a boundary when it stops; it makes the true error probabilities and sample sizes differ from Wald''s approximations.'
  topic: Sequential tests
- term: average sample number
  aliases: [ASN, expected sample size]
  definition: 'The expected number of observations a sequential test uses, $E_\theta(N)$; for the SPRT it is approximated with Wald''s identity.'
  topic: Sequential tests
- term: Wald's identity
  aliases: [Wald identity, Wald's equation]
  definition: 'For a sum of independent identically distributed terms $Z_i$ stopped at a time $N$ that depends only on the terms seen so far, with $E(N)$ finite: $E\big(\sum_{i=1}^N Z_i\big) = E(N)\,E(Z)$.'
  topic: Sequential tests
- term: group sequential design
  aliases: [group sequential designs, group sequential trial, interim analysis, interim analyses]
  definition: 'A study plan with a few planned looks at accumulating data, using boundaries (such as Pocock or O''Brien–Fleming) chosen so the overall Type I error stays at the target level.'
  topic: Sequential tests
