# Round 2 notecards for module ps-m7 (honors lessons 33h1 and 33h2).
- {front: 'Score function and its null distribution', back: '$U(\theta) = \ell''(\theta)$. At the true $\theta$: mean 0, variance $nI(\theta)$, so $U(\theta_0) \approx N(0, nI(\theta_0))$ under $H_0$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Observed information', back: '$J(\theta) = -\ell''''(\theta)$, the curvature of the log-likelihood; $J(\theta)/n \to I(\theta)$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Wald statistic (one parameter)', back: '$W = (\hat\theta - \theta_0)^2\,nI(\hat\theta)$: variance at the MLE; needs only the unrestricted fit; approximately $\chi^2_1$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Score statistic (one parameter)', back: '$S = U(\theta_0)^2/nI(\theta_0)$: everything evaluated at $\theta_0$; needs only the null fit; approximately $\chi^2_1$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Likelihood ratio statistic (one parameter)', back: '$\text{LR} = 2[\ell(\hat\theta) - \ell(\theta_0)] = -2\ln\Lambda$: needs both fits; approximately $\chi^2_1$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Geometry of the three tests', back: 'On the graph of $\ell$: Wald uses the horizontal gap $\hat\theta - \theta_0$, score the slope at $\theta_0$, LR the vertical drop from the peak.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'When the three tests coincide exactly', back: 'When the log-likelihood is exactly quadratic, e.g. a normal mean with $\sigma$ known: all equal $n(\bar x - \mu_0)^2/\sigma^2$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Binomial: score vs Wald', back: 'Score: $\dfrac{(\hat p - p_0)^2}{p_0(1-p_0)/n}$ (the one-proportion $z$ test, squared). Wald: $\dfrac{(\hat p - p_0)^2}{\hat p(1-\hat p)/n}$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Poisson: Wald, score, LR', back: 'Wald $\dfrac{(\bar x - \lambda_0)^2}{\bar x/n}$; score $\dfrac{(\bar x - \lambda_0)^2}{\lambda_0/n}$; LR $2n[\bar x\ln(\bar x/\lambda_0) - (\bar x - \lambda_0)]$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Invariance to reparametrization', back: 'LR and score tests give the same result for $p$ or $\ln\frac{p}{1-p}$; the Wald test does not.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Multinomial statistics as the trinity', back: 'Pearson $X^2 = \sum(O-E)^2/E$: score. $G^2$: likelihood ratio. Neyman $\sum(O-E)^2/O$: Wald.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'Intervals from the three tests (proportion)', back: 'Wald: $\hat p \pm z\sqrt{\hat p(1-\hat p)/n}$ (can leave $[0,1]$, poor coverage). Score: Wilson interval. LR: $\{p: 2[\ell(\hat p) - \ell(p)] \le \chi^2_{\alpha,1}\}$.', topic: 'Wald, score and likelihood ratio tests'}
- {front: 'SPRT log likelihood ratio sum', back: '$S_n = \sum_{i=1}^n \ln\dfrac{f(X_i;\theta_1)}{f(X_i;\theta_0)}$; large values favor $H_1$ (reciprocal of the Neyman–Pearson ratio).', topic: Sequential tests}
- {front: 'Wald''s SPRT boundaries', back: 'Reject when $S_n \ge b = \ln\frac{1-\beta}{\alpha}$; accept $H_0$ when $S_n \le a = \ln\frac{\beta}{1-\alpha}$; otherwise continue.', topic: Sequential tests}
- {front: 'True error rates of an SPRT', back: 'Because of overshoot they differ from $\alpha, \beta$, but $\alpha'' \le \alpha/(1-\beta)$, $\beta'' \le \beta/(1-\alpha)$ and $\alpha'' + \beta'' \le \alpha + \beta$.', topic: Sequential tests}
- {front: 'SPRT for a Bernoulli defect rate', back: 'Defective adds $\ln(p_1/p_0)$, good item adds $\ln\frac{1-p_1}{1-p_0}$. In the (items $n$, defectives $d$) plane the boundaries are parallel lines $d = h_1 + sn$ and $d = -h_0 + sn$.', topic: Sequential tests}
- {front: 'SPRT increment for a normal mean ($\sigma$ known)', back: '$Z_i = \dfrac{\mu_1 - \mu_0}{\sigma^2}\left(X_i - \dfrac{\mu_0 + \mu_1}{2}\right)$.', topic: Sequential tests}
- {front: 'Wald''s identity', back: '$E(S_N) = E(N)\,E(Z)$ for an i.i.d. sum stopped at a time that depends only on the past (with $E(N)$ finite).', topic: Sequential tests}
- {front: 'Average sample number of an SPRT', back: '$E_0(N) \approx \dfrac{(1-\alpha)a + \alpha b}{E_0(Z)}$, $E_1(N) \approx \dfrac{\beta a + (1-\beta)b}{E_1(Z)}$ (overshoot ignored).', topic: Sequential tests}
- {front: 'Optimality of the SPRT (Wald and Wolfowitz, 1948)', back: 'No test with error probabilities at most the SPRT''s has a smaller expected sample size under $H_0$ or under $H_1$.', topic: Sequential tests}
- {front: 'Why not just peek at a fixed-sample test?', back: 'Testing at 5% after every observation and stopping at the first rejection inflates the Type I error (about 0.37 with 100 looks). Sequential and group sequential designs use boundaries built for repeated looks.', topic: Sequential tests}
