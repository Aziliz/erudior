# Round 2 glossary for module ps-m6 (honors lessons 29h1-29h3).
- term: expected information
  aliases: [expected Fisher information]
  definition: 'The Fisher information of the whole sample, $nI(\theta)$, the mean of $-\ell''''(\theta)$. Evaluated at the MLE it gives the standard error $1/\sqrt{nI(\hat\theta)}$.'
  topic: Likelihood computation
- term: Wald interval
  aliases: [Wald intervals, Wald confidence interval]
  definition: 'The large-sample interval $\hat\theta \pm z_{\alpha/2}\,\widehat{\text{SE}}$, with the standard error from the information at the MLE. For a proportion it is $\hat p \pm z_{\alpha/2}\sqrt{\hat p(1 - \hat p)/n}$, which can cover far less often than its nominal level.'
  topic: Likelihood computation
- term: Newton's method
  aliases: [Newton–Raphson method, Newton-Raphson method, Newton–Raphson, Newton-Raphson]
  definition: 'An iterative way to solve the score equation $\ell''(\theta) = 0$: follow the tangent line of $\ell''$ to the axis, $\theta_{k+1} = \theta_k - \ell''(\theta_k)/\ell''''(\theta_k)$. Fast near the answer; can overshoot from a poor start.'
  topic: Likelihood computation
- term: Fisher scoring
  aliases: [method of scoring, scoring]
  definition: 'Newton''s method for an MLE with the expected information $nI(\theta_k)$ in place of $-\ell''''(\theta_k)$: $\theta_{k+1} = \theta_k + \ell''(\theta_k)/(nI(\theta_k))$. Each step points uphill.'
  topic: Likelihood computation
- term: zero-truncated Poisson distribution
  aliases: [zero-truncated Poisson, truncated Poisson]
  definition: 'A Poisson distribution with the value 0 removed: $P(X = k) = e^{-\lambda}\lambda^k/(k!\,(1 - e^{-\lambda}))$ for $k = 1, 2, \dots$; a model for counts recorded only when at least one event happens.'
  topic: Likelihood computation
- term: likelihood interval
  aliases: [likelihood intervals, likelihood-ratio interval, likelihood ratio interval]
  definition: 'The set of parameter values whose log-likelihood is within a set drop of the maximum, such as $2[\ell(\hat\theta) - \ell(\theta)] \le 3.84$ for about 95%. Unlike a Wald interval it follows the shape of the log-likelihood.'
  topic: Likelihood computation
- term: Fisher information matrix
  aliases: [information matrix, information matrices]
  definition: 'For several parameters, the matrix with entries $I_{jk} = -E[\partial^2 \ln f/\partial\eta_j\partial\eta_k]$. The MLE is approximately normal with covariance matrix $(nI)^{-1}$; standard errors are square roots of its diagonal.'
  topic: Likelihood computation
- term: decision theory
  aliases: [statistical decision theory]
  definition: 'The framework that treats an estimator as a decision rule, assigns a cost (loss) to each error, and compares rules by their expected loss (risk). Developed largely by Abraham Wald.'
  topic: Decision theory
- term: loss function
  aliases: [loss functions, squared-error loss, absolute-error loss]
  definition: 'The cost $L(\theta, a)$ of reporting $a$ when the truth is $\theta$, such as squared error $(\theta - a)^2$ or absolute error $|\theta - a|$.'
  topic: Decision theory
- term: dominates
  aliases: [dominate, dominated, dominating]
  definition: 'An estimator dominates another if its risk is no larger for every parameter value and strictly smaller for some. A dominated estimator is inadmissible.'
  topic: Decision theory
- term: Bayes risk
  definition: 'The risk function averaged over a prior, $r(\pi, \delta) = \int R(\theta, \delta)\,\pi(\theta)\,d\theta$: one number summarizing an estimator.'
  topic: Decision theory
- term: Bayes estimator
  aliases: [Bayes estimators, Bayes estimate]
  definition: 'The estimator with the smallest Bayes risk for a given prior; found by minimizing posterior expected loss for each data set. Squared error gives the posterior mean, absolute error the posterior median.'
  topic: Decision theory
- term: minimax estimator
  aliases: [minimax, minimax estimators]
  definition: 'An estimator whose largest risk over all parameter values is as small as possible. A Bayes estimator with constant risk is minimax.'
  topic: Decision theory
- term: coverage probability
  aliases: [coverage, actual coverage]
  definition: 'The probability, for a given true parameter value, that an interval procedure contains it. For binomial data it is $\sum_x \mathbf 1\{p \in \text{interval}(x)\}P(X = x)$, a jagged function of $p$.'
  topic: Intervals for a proportion
- term: conservative interval
  aliases: [conservative]
  definition: 'An interval procedure whose coverage probability is at least its nominal level for every parameter value, usually at the cost of extra width.'
  topic: Intervals for a proportion
- term: Agresti–Coull interval
  aliases: [Agresti-Coull interval, Agresti–Coull, Agresti-Coull, plus-four interval]
  definition: 'For 95%: add 2 successes and 2 failures, $\tilde p = (x + 2)/(n + 4)$, then use $\tilde p \pm 1.96\sqrt{\tilde p(1 - \tilde p)/(n + 4)}$. Proposed by Agresti and Coull (1998).'
  topic: Intervals for a proportion
- term: Clopper–Pearson interval
  aliases: [Clopper-Pearson interval, Clopper–Pearson, Clopper-Pearson, exact binomial interval]
  definition: 'The interval for a proportion obtained by inverting two exact one-sided binomial tests; its endpoints are beta quantiles. Its coverage is always at least the nominal level.'
  topic: Intervals for a proportion
- term: Jeffreys interval
  definition: 'The equal-tailed credible interval from the Beta$(\tfrac12, \tfrac12)$ prior: quantiles of Beta$(x + \tfrac12,\; n - x + \tfrac12)$. Its frequentist coverage is close to nominal.'
  topic: Intervals for a proportion
- term: rule of three
  definition: 'After $n$ independent trials with no events, $3/n$ is an approximate 95% upper confidence bound for the event probability (from $1 - 0.05^{1/n} \approx -\ln(0.05)/n$).'
  topic: Intervals for a proportion
