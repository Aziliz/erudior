# Round 2 glossary for module ps-m1 (honors lessons 04h1 and 04h2).
- term: first-step analysis
  aliases: [first step analysis]
  definition: 'Finding a probability by conditioning on the first step of a process and noticing that afterward the process is a copy of the original problem (or a related one); this turns the probability into the solution of an equation with boundary conditions.'
  topic: First-step analysis
- term: random walk
  aliases: [random walks]
  definition: 'A process that moves up or down by steps at random, for example a fortune that goes up \$1 with probability $p$ and down \$1 with probability $q = 1 - p$ on each bet.'
  topic: Gambler's ruin
- term: absorbing state
  aliases: [absorbing states]
  definition: 'A state that a process never leaves once it gets there, such as a fortune of 0 or of the target $N$ in the gambler''s ruin.'
  topic: Gambler's ruin
- term: boundary conditions
  aliases: [boundary condition]
  definition: 'The known values at the ends of a recursion, such as $P_0 = 0$ and $P_N = 1$ in the gambler''s ruin; they pick out the one solution of the recursion that fits the problem.'
  topic: Gambler's ruin
- term: gambler's ruin
  definition: 'The problem of finding the chance that a gambler betting one unit at a time reaches a target before going broke. With win probability $p$, $q = 1 - p$ and $\rho = q/p$, starting from $i$ with target $N$: $P_i = i/N$ if $p = \tfrac12$, otherwise $P_i = (1 - \rho^i)/(1 - \rho^N)$.'
  topic: Gambler's ruin
- term: problem of points
  definition: 'How to divide the stake of an interrupted match when one player needs $a$ more wins and the other needs $b$. Pascal and Fermat (1654) divided it by each player''s chance of winning had play continued: the chance of at least $a$ wins in $a + b - 1$ rounds.'
  topic: First-step analysis
- term: bold play
  definition: 'Betting as much as is needed (or all you have) to reach a goal in as few bets as possible. In an unfavorable game it reaches a fixed goal more often than many small bets.'
  topic: Gambler's ruin
- term: timid play
  definition: 'Betting the smallest unit each time. In an unfavorable game it gives the house edge many chances to act, so it reaches a fixed goal less often than bold play.'
  topic: Gambler's ruin
- term: Simpson's paradox
  aliases: [Simpson paradox]
  definition: 'A comparison that holds within every group reverses when the groups are combined. It happens because each overall rate is a weighted average of group rates, and the weights (the mix of groups) differ.'
  topic: Simpson's paradox
- term: confounding variable
  aliases: [confounding variables, confounder, confounders, confounding]
  definition: 'A variable that affects both which treatment (or group) a case ends up in and the outcome, so that it can distort a comparison unless it is held fixed.'
  topic: Simpson's paradox
- term: Berkson's paradox
  aliases: [Berkson paradox, Berkson's bias]
  definition: 'Independent traits appear associated (usually negatively) within a group selected because it has one trait or the other; conditioning on a common effect creates the dependence.'
  topic: Paradoxes of conditioning
- term: selection bias
  definition: 'Distortion that arises when the cases observed are chosen in a way related to the variables being studied, so that relationships inside the observed group differ from those in the whole population.'
  topic: Paradoxes of conditioning
