# Notecards for the gap material added 2026-10-17 (lessons 18, 26 and 28).
# Kept in a separate file, after cards-a/b/c, so existing card ids (numbered in file order) do not change.
- {front: 'Two-variable change of variables', back: '$f_{U,V}(u, v) = f_{X,Y}(x(u, v), y(u, v))\,\lvert J\rvert$, where $J = \det\dfrac{\partial(x, y)}{\partial(u, v)}$ comes from the *inverse* map. For a linear map with determinant $D$, $\lvert J\rvert = 1/\lvert D\rvert$.', topic: 'Sums of random variables'}
- {front: 'Minimum-variance unbiased estimator (MVUE)', back: 'Unbiased for $\tau(\theta)$, with variance no larger than any other unbiased estimator for every $\theta$. It need not attain the Cramér–Rao bound.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Rao–Blackwell theorem', back: '$W$ unbiased, $T$ sufficient: $\phi(T) = E[W \mid T]$ is unbiased and $\operatorname{Var}(\phi(T)) \le \operatorname{Var}(W)$ (law of total variance). Sufficiency makes $\phi$ free of $\theta$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Complete statistic', back: '$E_\theta[g(T)] = 0$ for all $\theta$ implies $g(T) = 0$ with probability 1. Then at most one function of $T$ is unbiased for a given $\tau(\theta)$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Lehmann–Scheffé theorem', back: 'An unbiased function of a complete sufficient statistic is the unique MVUE. Recipe: find complete sufficient $T$, then any unbiased $\phi(T)$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Exponential family and complete sufficiency', back: '$f(x; \theta) = h(x)c(\theta)e^{w(\theta)t(x)}$: $\sum t(X_i)$ is complete sufficient if $w(\theta)$ fills an interval. Bernoulli, Poisson, exponential, normal with known $\sigma^2$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Bernoulli MVUEs from $T = \sum X_i$', back: '$p$: $T/n$. $p^2$: $\dfrac{T(T-1)}{n(n-1)}$. $p(1-p)$: $\dfrac{T(n-T)}{n(n-1)}$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Poisson MVUE of $P(X = 0) = e^{-\lambda}$', back: '$(1 - 1/n)^T$ with $T = \sum X_i$, from $X_1 \mid T \sim \text{Bin}(T, 1/n)$. The MLE $e^{-\bar X}$ is biased.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Normal and uniform MVUEs', back: '$N(\mu, \sigma^2)$: $\bar X$ for $\mu$, $S^2$ for $\sigma^2$, $\bar X^2 - S^2/n$ for $\mu^2$. Uniform$(0, \theta)$: $\tfrac{n+1}{n}X_{(n)}$. Exponential rate: $(n-1)/\sum X_i$.', topic: 'Minimum-variance unbiased estimation'}
- {front: 'Bootstrap sample', back: '$n$ draws *with replacement* from the observed data (the empirical distribution). A given point is left out with probability $(1 - 1/n)^n \approx 0.368$.', topic: 'Bootstrap and resampling'}
- {front: 'Bootstrap standard error and bias', back: 'SE: the SD of the $B$ replicates $\hat\theta^*_b$. Bias estimate: $\bar\theta^* - \hat\theta$. Larger $B$ cuts Monte Carlo noise, not the SE.', topic: 'Bootstrap and resampling'}
- {front: 'Ideal bootstrap SE of a mean', back: '$\hat\sigma/\sqrt n$ with $\hat\sigma^2 = \tfrac1n\sum(x_i - \bar x)^2$, which is $\sqrt{(n-1)/n}\;s/\sqrt n$.', topic: 'Bootstrap and resampling'}
- {front: 'Bootstrap percentile interval', back: '$100(1-\alpha)\%$: the $\alpha/2$ and $1 - \alpha/2$ quantiles of the replicates (for $B = 2000$ and 95%, about the 50th and 1950th smallest).', topic: 'Bootstrap and resampling'}
- {front: 'When the bootstrap fails or needs care', back: 'Extremes such as the maximum (the resample keeps $X_{(n)}$ with probability $\approx 0.632$), very small $n$, and dependent data; resample the way the data were sampled (pairs, groups).', topic: 'Bootstrap and resampling'}
- {front: 'Bootstrap versus permutation test', back: 'Bootstrap: resample *with* replacement to mimic sampling variability (SEs, intervals). Permutation: reshuffle labels *without* replacement under $H_0$ (p-values).', topic: 'Bootstrap and resampling'}
