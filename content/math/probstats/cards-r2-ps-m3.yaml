# Round 2 cards for ps-m3 honors lessons
- {front: 'Hazard in terms of the survival function', back: '$h(x) = \dfrac{f(x)}{S(x)} = -\dfrac{d}{dx}\ln S(x)$; $h(x)\,\Delta x \approx P(\text{fail in the next } \Delta x \mid \text{alive at } x)$.', topic: Hazard functions}
- {front: 'Survival from the hazard', back: '$H(x) = \int_0^x h(t)\,dt$ and $S(x) = e^{-H(x)}$, $f(x) = h(x)e^{-H(x)}$.', topic: Hazard functions}
- {front: 'When is a function a valid hazard?', back: '$h \ge 0$ and $\int_0^\infty h(t)\,dt = \infty$, so that $S(x) \to 0$.', topic: Hazard functions}
- {front: 'Weibull$(k, s)$ survival and hazard', back: '$S(x) = e^{-(x/s)^k}$, $h(x) = \dfrac{k}{s}\left(\dfrac{x}{s}\right)^{k-1}$: decreasing for $k < 1$, constant for $k = 1$, increasing for $k > 1$.', topic: Lifetime distributions}
- {front: 'Weibull mean and variance', back: '$E(X) = s\,\Gamma(1 + 1/k)$, $\operatorname{Var}(X) = s^2[\Gamma(1 + 2/k) - \Gamma(1 + 1/k)^2]$.', topic: Lifetime distributions}
- {front: 'Weibull percentiles and characteristic life', back: '$x_p = s[-\ln(1 - p)]^{1/k}$; B10 life $= s(-\ln 0.9)^{1/k}$; $F(s) = 1 - e^{-1} \approx 0.632$ for every $k$.', topic: Lifetime distributions}
- {front: 'Independent components in series', back: 'Survival functions multiply and hazards add: $h_T = \sum h_i$. $n$ iid Weibull$(k, s)$ give Weibull$(k, s\,n^{-1/k})$.', topic: Lifetime distributions}
- {front: 'Bathtub curve', back: 'Falling hazard (early failures), flat hazard (random failures), rising hazard (wear-out). An idealization; burn-in targets the first phase.', topic: Hazard functions}
- {front: 'Mean residual life', back: '$m(t) = E(X - t \mid X > t) = \dfrac{1}{S(t)}\int_t^\infty S(x)\,dx$; constant $1/\lambda$ for the exponential, $(L - t)/2$ for U$(0, L)$.', topic: Hazard functions}
- {front: 'Gompertz hazard', back: '$h(x) = a\,e^{bx}$: the hazard doubles every $\ln 2/b$ time units; a classic model of adult mortality.', topic: Lifetime distributions}
- {front: 'Properties of every cdf', back: 'Nondecreasing, right-continuous, $F(-\infty) = 0$, $F(\infty) = 1$; a jump at $a$ has size $P(X = a) = F(a) - F(a^-)$.', topic: Mixed random variables}
- {front: 'Mean of a mixed random variable', back: '$E(X) = \sum_{\text{atoms}} a\,P(X = a) + \int x\,F''(x)\,dx$; for $X \ge 0$ simply $\int_0^\infty P(X > x)\,dx$.', topic: Mixed random variables}
- {front: 'Capped variable $\min(X, c)$', back: 'Point mass $S(c)$ at $c$; $E[\min(X, c)] = \int_0^c S(x)\,dx$ (limited expected value).', topic: Censoring and deductibles}
- {front: 'Payment with deductible $d$', back: '$(X - d)^+$ has a point mass $F(d)$ at 0 and $E[(X - d)^+] = \int_d^\infty S(x)\,dx$; $E[\min(X, d)] + E[(X - d)^+] = E(X)$.', topic: Censoring and deductibles}
- {front: 'Censored life test', back: 'An item still running at the end time $c$ is recorded as "longer than $c$"; averaging $\min(X, c)$ as if it were the lifetime underestimates the mean.', topic: Censoring and deductibles}
- {front: 'General quantile function', back: '$F^{-1}(u) = \min\{x : F(x) \ge u\}$; then $F^{-1}(U)$ has cdf $F$ for every distribution, but $F(X)$ is uniform only when $F$ is continuous.', topic: Mixed random variables}
- {front: 'Exponential claims with a deductible', back: 'For losses exponential with mean $\theta$: $E[(X - d)^+] = \theta e^{-d/\theta}$, and given a payment the excess is again exponential with mean $\theta$ (memoryless).', topic: Censoring and deductibles}
- {front: 'Simulating from a cdf with a jump', back: 'Draw $U$; if $U$ falls within the jump at $a$ (between $F(a^-)$ and $F(a)$), return $a$; otherwise solve $F(x) = U$ on the continuous part.', topic: Mixed random variables}
