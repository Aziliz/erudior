# Round 2 notecards for module ps-m1 (honors lessons 04h1 and 04h2).
# First-step analysis and the gambler's ruin
- {front: 'First-step analysis', back: 'Condition on the first step; if the process afterward is a copy of the original problem, the unknown probability appears on both sides of the law of total probability. Solve the equation, using the boundary conditions.', topic: First-step analysis}
- {front: 'Alternating race: first player succeeds with $p$ per turn, second with $r$', back: '$a = p + (1-p)(1-r)\,a$, so $a = \dfrac{p}{p + r - pr}$. A fair die, first six wins: $6/11$.', topic: First-step analysis}
- {front: 'Why the alternating race ends with probability 1', back: '"Never ends" is contained in "no success in the first $2n$ turns," whose probability $[(1-p)(1-r)]^n \to 0$; by monotonicity $P(\text{never ends}) = 0$.', topic: First-step analysis}
- {front: 'Craps: chance of making point $k$', back: 'Only the race between $k$ and 7 matters: $w_k = \dfrac{P(k)}{P(k) + P(7)}$. Points 4/10: $1/3$; 5/9: $2/5$; 6/8: $5/11$.', topic: First-step analysis}
- {front: 'Probability of winning at craps (pass line)', back: '$\tfrac{8}{36} + \tfrac{134}{495} = \tfrac{244}{495} \approx 0.493$.', topic: First-step analysis}
- {front: 'Gambler''s ruin: recursion and boundary conditions', back: '$P_i = p\,P_{i+1} + q\,P_{i-1}$ for $1 \le i \le N-1$, with $P_0 = 0$ and $P_N = 1$.', topic: Gambler's ruin}
- {front: 'Gambler''s ruin: solution', back: 'Fair ($p = \tfrac12$): $P_i = i/N$. Otherwise, with $\rho = q/p$: $P_i = \dfrac{1 - \rho^i}{1 - \rho^N}$.', topic: Gambler's ruin}
- {front: 'Gambler''s ruin against an unlimited opponent', back: 'If $p \le \tfrac12$, ruin is certain. If $p > \tfrac12$, $P(\text{never ruined}) = 1 - (q/p)^i$.', topic: Gambler's ruin}
- {front: 'Bold versus timid play in an unfavorable game', back: 'Bold play reaches a fixed goal more often. Roulette, \$20 to \$40: one bet $\approx 0.474$, \$1 bets $\approx 0.108$.', topic: Gambler's ruin}
- {front: 'Problem of points (Pascal and Fermat, 1654)', back: 'If A needs $a$ wins and B needs $b$, A''s fair share is $P(\text{at least } a \text{ wins in } a + b - 1 \text{ rounds})$. Recursion: $W(a,b) = pW(a-1,b) + qW(a,b-1)$.', topic: First-step analysis}
# Paradoxes of conditioning
- {front: 'Simpson''s paradox', back: 'A comparison that holds in every group reverses when the groups are combined, because each overall rate is a weighted average of group rates with different weights.', topic: Simpson's paradox}
- {front: 'Overall rate as a weighted average', back: '$P(S \mid A) = \sum_g P(g \mid A)\,P(S \mid A, g)$, by the law of total probability within $A$.', topic: Simpson's paradox}
- {front: 'When Simpson''s paradox cannot happen', back: 'When both treatments have the same mix of groups (same weights). Randomization makes the mixes alike on average.', topic: Simpson's paradox}
- {front: 'Split or combine the table?', back: 'Hold a confounder (a cause of both treatment choice and outcome) fixed by splitting on it; do not split on a result of the treatment. The numbers alone cannot decide.', topic: Simpson's paradox}
- {front: 'Berkson''s paradox', back: 'Selecting on a common effect (e.g. "has trait H or trait E") makes independent traits negatively associated in the selected group.', topic: Paradoxes of conditioning}
- {front: 'Common cause versus common effect', back: 'Conditioning on a common cause can remove a dependence (lesson 4''s coin); conditioning on a common effect can create one (Berkson).', topic: Paradoxes of conditioning}
- {front: 'Two-child problem', back: '$P(BB \mid \text{at least one boy}) = \tfrac13$; $P(BB \mid \text{older is a boy}) = \tfrac12$; $P(BB \mid \text{a randomly met child is a boy}) = \tfrac12$; with a Tuesday boy, $\tfrac{13}{27}$.', topic: Paradoxes of conditioning}
- {front: 'Bertrand''s box (1889)', back: 'Boxes GG, SS, GS; a random coin from a random box is gold. $P(\text{other is gold}) = \tfrac23$, because GG was twice as likely as GS to produce a gold coin.', topic: Paradoxes of conditioning}
