# Round 2, module a2-m8: cards for the honors lessons and new core figures
- {front: Venn diagram for "A or B", back: 'The two circles together. Adding the circles counts the overlap twice, so $P(A \text{ or } B) = P(A) + P(B) - P(A \text{ and } B)$.', topic: Probability rules}
- {front: Choosing a counting method, back: 'Order doesn''t matter: $_nC_r$. Order matters with repeats allowed: multiply the slot options. Order matters, no repeats: $_nP_r$. All $n$ items with identical groups: $n!$ divided by each group''s factorial.', topic: Permutations and combinations}

- {front: Random variable, back: 'A number determined by the outcome of a chance experiment, such as the sum of two dice.', topic: Expected value}
- {front: Valid probability distribution, back: 'Every probability is between 0 and 1, and the probabilities add to 1.', topic: Expected value}
- {front: Expected value $E(X)$, back: '$E(X) = \sum x\,P(X = x)$: each value times its probability, added up. It is the long-run average per trial.', topic: Expected value}
- {front: 'Why $E(X) = \sum x\,P(X = x)$', back: 'In $N$ trials, value $x_i$ shows up about $p_iN$ times, so the average result is about $\sum x_i p_i N / N = \sum x_i p_i$.', topic: Expected value}
- {front: Law of large numbers, back: 'Over many independent trials the average result approaches $E(X)$. It does not make any single outcome "due".', topic: Expected value}
- {front: Fair game, back: 'Expected net gain is 0. The fair price to play equals the expected prize.', topic: Expected value}
- {front: Expected prize vs expected net gain, back: 'Expected net gain = expected prize − cost to play.', topic: Expected value}
- {front: Standard deviation of a random variable, back: '$\sigma_X = \sqrt{\sum (x - \mu_X)^2\,P(X = x)}$: measures how far results typically fall from the mean (the risk).', topic: Expected value}
- {front: '$E(aX + b)$', back: '$aE(X) + b$. Also $E(X + Y) = E(X) + E(Y)$ for any $X$ and $Y$, independent or not.', topic: Expected value}
- {front: Guessing with a $\tfrac14$-point penalty on 5-choice questions, back: '$E = \tfrac15(1) + \tfrac45\left(-\tfrac14\right) = 0$: blind guessing is a fair game. Ruling out one choice makes $E = \tfrac{1}{16} > 0$.', topic: Expected value}

- {front: Binomial setting (BINS), back: 'Binary outcomes, Independent trials, fixed Number of trials $n$, Same success probability $p$.', topic: Binomial distribution}
- {front: Binomial probability formula, back: '$P(X = k) = {}_nC_k\,p^k(1 - p)^{n - k}$', topic: Binomial distribution}
- {front: Why $_nC_k$ in the binomial formula, back: 'Each order of $k$ successes and $n - k$ failures has probability $p^k(1 - p)^{n - k}$, and there are $_nC_k$ such orders.', topic: Binomial distribution}
- {front: Why binomial probabilities add to 1, back: 'They are the terms of $\big((1 - p) + p\big)^n = 1^n = 1$ (binomial theorem).', topic: Binomial distribution}
- {front: Mean and SD of a binomial count, back: '$\mu = np$, $\sigma = \sqrt{np(1 - p)}$', topic: Binomial distribution}
- {front: '"At least $k$" for a binomial $X$', back: '$P(X \ge k) = 1 - P(X \le k - 1)$; for at least one, $1 - (1 - p)^n$.', topic: Binomial distribution}
- {front: binompdf vs binomcdf, back: 'binompdf(n, p, k) gives $P(X = k)$; binomcdf(n, p, k) gives $P(X \le k)$.', topic: Binomial distribution}
- {front: Normal approximation to the binomial, back: 'Normal with mean $np$ and SD $\sqrt{np(1 - p)}$; rule of thumb: $np \ge 10$ and $n(1 - p) \ge 10$.', topic: Binomial distribution}
- {front: Not binomial, back: 'No fixed number of trials (waiting for the first success), or dependent trials (drawing without replacement from a small group).', topic: Binomial distribution}

- {front: Law of total probability, back: '$P(D) = P(A)\,P(D \mid A) + P(B)\,P(D \mid B)$ when $A$ and $B$ split all the possibilities: add every path to $D$.', topic: Bayes' theorem}
- {front: Bayes' theorem, back: '$P(A \mid D) = \dfrac{P(A)\,P(D \mid A)}{P(D)}$: the path through $A$ over all paths to $D$.', topic: Bayes' theorem}
- {front: Sensitivity, back: '$P(\text{positive} \mid \text{disease})$', topic: Bayes' theorem}
- {front: Specificity, back: '$P(\text{negative} \mid \text{no disease})$; the false positive rate is 1 minus the specificity.', topic: Bayes' theorem}
- {front: Natural frequencies, back: 'Imagine 10,000 people, split them by the prevalence, count positives in each part, then divide true positives by all positives.', topic: Bayes' theorem}
- {front: 'Prevalence 1%, sensitivity 90%, specificity 91%: $P(\text{disease} \mid +)$', back: '$\tfrac{90}{90 + 891} = \tfrac{90}{981} \approx 0.092$, only about 9%.', topic: Bayes' theorem}
- {front: Prior and posterior, back: 'Prior: probability before the evidence. Posterior: probability after it. The posterior becomes the prior for the next piece of evidence.', topic: Bayes' theorem}
- {front: Base rate fallacy, back: 'Ignoring how rare a condition is, for example taking a 90% sensitive test''s positive result as a 90% chance of disease.', topic: Bayes' theorem}
- {front: Prosecutor's fallacy, back: '$P(\text{match} \mid \text{innocent})$ is not $P(\text{innocent} \mid \text{match})$: 1 in 10,000 among a million people still leaves about 100 innocent matches.', topic: Bayes' theorem}
