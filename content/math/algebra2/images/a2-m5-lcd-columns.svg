<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300" font-family="Helvetica, Arial, sans-serif">
<rect width="520" height="300" fill="#ffffff"/>
<text x="260" y="40" font-size="15" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="italic">Each denominator factored, matching factors in the same column</text>
<text x="175" y="96" font-size="17" fill="#1c2833" text-anchor="end" font-weight="normal" font-style="normal">x² − 9</text>
<rect x="190.0" y="67.0" width="80" height="46" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/>
<text x="230" y="96" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x − 3</text>
<rect x="280.0" y="67.0" width="80" height="46" rx="8" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/>
<text x="320" y="96" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x + 3</text>
<rect x="370.0" y="67.0" width="80" height="46" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="175" y="156" font-size="17" fill="#1c2833" text-anchor="end" font-weight="normal" font-style="normal">x² + 6x + 9</text>
<rect x="190.0" y="127.0" width="80" height="46" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect x="280.0" y="127.0" width="80" height="46" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/>
<text x="320" y="156" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x + 3</text>
<rect x="370.0" y="127.0" width="80" height="46" rx="8" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/>
<text x="410" y="156" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x + 3</text>
<text x="175" y="242" font-size="17" fill="#1c2833" text-anchor="end" font-weight="bold" font-style="normal">LCD</text>
<rect x="190.0" y="213.0" width="80" height="46" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="230" y="242" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x − 3</text>
<rect x="280.0" y="213.0" width="80" height="46" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="320" y="242" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x + 3</text>
<rect x="370.0" y="213.0" width="80" height="46" rx="8" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="410" y="242" font-size="17" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">x + 3</text>
<line x1="70" y1="190" x2="460" y2="190" stroke="#1c2833" stroke-width="2"/>
<text x="260" y="285" font-size="14" fill="#1c2833" text-anchor="middle" font-weight="normal" font-style="normal">Take each factor the most times it appears in any one denominator: (x − 3)(x + 3)²</text>
</svg>