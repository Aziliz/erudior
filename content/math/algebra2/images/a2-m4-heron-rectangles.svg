<svg xmlns="http://www.w3.org/2000/svg" width="810" height="270" viewBox="0 0 810 270" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1c2833">
<rect x="0" y="0" width="810" height="270" fill="#ffffff"/>
<text x="405" y="28" text-anchor="middle" font-size="16" font-weight="bold">Heron's method for √10: average the two sides</text>
<rect x="30.0" y="120.0" width="200.0" height="80.0" fill="#dde8f3" stroke="#1c2833" stroke-width="2"/>
<text x="130.0" y="224" text-anchor="middle">Start: x = 5</text>
<text x="130.0" y="165.0" text-anchor="middle">area 10</text>
<text x="236.0" y="165.0" text-anchor="start">10/x = 2</text>
<rect x="330.0" y="85.7" width="140.0" height="114.3" fill="#dcf0e3" stroke="#1c2833" stroke-width="2"/>
<text x="400.0" y="224" text-anchor="middle">Next: x = 3.5</text>
<text x="400.0" y="147.9" text-anchor="middle">area 10</text>
<text x="476.0" y="147.9" text-anchor="start">10/x ≈ 2.86</text>
<rect x="570.0" y="74.2" width="127.1" height="125.8" fill="#f7ebcf" stroke="#1c2833" stroke-width="2"/>
<rect x="570.0" y="73.5" width="126.5" height="126.5" fill="none" stroke="#1c2833" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="633.6" y="224" text-anchor="middle">Next: x ≈ 3.18</text>
<text x="633.6" y="142.1" text-anchor="middle">area 10</text>
<text x="703.1" y="142.1" text-anchor="start">10/x ≈ 3.15</text>
<text x="405" y="258" text-anchor="middle">Dashed square: side √10 ≈ 3.162</text>
</svg>