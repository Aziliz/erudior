<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" font-family="sans-serif">
<rect width="720" height="350" fill="#ffffff"/>
<text x="360.0" y="32.0" font-size="18" text-anchor="middle" fill="#1c2833" font-weight="bold">Pick a or b from each factor of (a + b)(a + b)(a + b)</text>
<text x="100.0" y="72.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="bold">no b</text>
<rect x="50.0" y="86.0" width="100.0" height="34.0" rx="6" fill="#dde8f3" stroke="#1c2833" stroke-width="1.5"/>
<text x="100" y="109" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3">aaa</text>
<text x="100.0" y="248.0" font-size="16" text-anchor="middle" fill="#1c2833">1 way</text>
<text x="100.0" y="284.0" font-size="22" text-anchor="middle" fill="#1c2833" font-weight="bold">a³</text>
<text x="273.0" y="72.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="bold">one b</text>
<rect x="223.0" y="86.0" width="100.0" height="34.0" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/>
<text x="273" y="109" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3"><tspan font-weight="bold">b</tspan>aa</text>
<rect x="223.0" y="130.0" width="100.0" height="34.0" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/>
<text x="273" y="153" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3">a<tspan font-weight="bold">b</tspan>a</text>
<rect x="223.0" y="174.0" width="100.0" height="34.0" rx="6" fill="#dcf0e3" stroke="#1c2833" stroke-width="1.5"/>
<text x="273" y="197" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3">aa<tspan font-weight="bold">b</tspan></text>
<text x="273.0" y="248.0" font-size="16" text-anchor="middle" fill="#1c2833">3 ways</text>
<text x="273.0" y="284.0" font-size="22" text-anchor="middle" fill="#1c2833" font-weight="bold">3a²b</text>
<text x="446.0" y="72.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="bold">two b's</text>
<rect x="396.0" y="86.0" width="100.0" height="34.0" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="446" y="109" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3"><tspan font-weight="bold">b</tspan><tspan font-weight="bold">b</tspan>a</text>
<rect x="396.0" y="130.0" width="100.0" height="34.0" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="446" y="153" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3"><tspan font-weight="bold">b</tspan>a<tspan font-weight="bold">b</tspan></text>
<rect x="396.0" y="174.0" width="100.0" height="34.0" rx="6" fill="#f7ebcf" stroke="#1c2833" stroke-width="1.5"/>
<text x="446" y="197" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3">a<tspan font-weight="bold">b</tspan><tspan font-weight="bold">b</tspan></text>
<text x="446.0" y="248.0" font-size="16" text-anchor="middle" fill="#1c2833">3 ways</text>
<text x="446.0" y="284.0" font-size="22" text-anchor="middle" fill="#1c2833" font-weight="bold">3ab²</text>
<text x="619.0" y="72.0" font-size="16" text-anchor="middle" fill="#1c2833" font-weight="bold">three b's</text>
<rect x="569.0" y="86.0" width="100.0" height="34.0" rx="6" fill="#f8e1dc" stroke="#1c2833" stroke-width="1.5"/>
<text x="619" y="109" font-size="18" text-anchor="middle" fill="#1c2833" letter-spacing="3"><tspan font-weight="bold">b</tspan><tspan font-weight="bold">b</tspan><tspan font-weight="bold">b</tspan></text>
<text x="619.0" y="248.0" font-size="16" text-anchor="middle" fill="#1c2833">1 way</text>
<text x="619.0" y="284.0" font-size="22" text-anchor="middle" fill="#1c2833" font-weight="bold">b³</text>
<line x1="30.0" y1="302.0" x2="690.0" y2="302.0" stroke="#9aa5b1" stroke-width="1"/>
<text x="360.0" y="330.0" font-size="16" text-anchor="middle" fill="#1c2833">(a + b)³ = a³ + 3a²b + 3ab² + b³, coefficients 1, 3, 3, 1</text>
</svg>
