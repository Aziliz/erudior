# Round 2 glossary for a2-m7 (honors lessons 24h1 and 24h2)
- term: finite differences
  aliases: [finite difference]
  definition: 'The differences between consecutive terms of a sequence, $a_{n+1} - a_n$, and the differences of those differences, and so on.'
  topic: Finite differences
- term: first differences
  aliases: [first difference]
  definition: 'The differences between consecutive terms of a sequence, $a_{n+1} - a_n$. They are constant exactly when the sequence is arithmetic.'
  topic: Finite differences
- term: second differences
  aliases: [second difference]
  definition: 'The differences between consecutive first differences. They are constant, equal to $2A$, exactly when the sequence is a quadratic $An^2 + Bn + C$.'
  topic: Finite differences
- term: difference table
  aliases: [difference tables]
  definition: 'A table with the terms of a sequence in one row and its first, second, third, … differences in the rows beneath.'
  topic: Finite differences
- term: recurrence relation
  aliases: [recurrence, recurrences, recurrence relations]
  definition: 'A rule that gives each term of a sequence from earlier terms, such as $a_n = 0.3a_{n-1} + 200$.'
  topic: Recurrence relations
- term: fixed point
  aliases: [fixed points, equilibrium]
  definition: 'A value $L$ that a recurrence leaves unchanged. For $a_n = ra_{n-1} + c$ with $r \ne 1$, $L = \dfrac{c}{1 - r}$; the terms approach it when $|r| < 1$.'
  topic: Recurrence relations
- term: annuity
  aliases: [annuities]
  definition: 'A series of equal payments made at equal time intervals, such as monthly deposits into savings or monthly loan payments.'
  topic: Annuities and loans
- term: future value
  aliases: [FV]
  definition: 'The total an annuity is worth right after its last payment. For $n$ end-of-period payments of $P$ at rate $i$ per period, $FV = P\cdot\dfrac{(1 + i)^n - 1}{i}$.'
  topic: Annuities and loans
- term: amortized loan
  aliases: [amortized, amortization, amortized loans]
  definition: 'A loan repaid by equal periodic payments, each covering that period''s interest plus part of the balance. The payment is $M = \dfrac{A_0 i}{1 - (1 + i)^{-n}}$.'
  topic: Annuities and loans
- term: amortization schedule
  aliases: [amortization table]
  definition: 'A table that splits each loan payment into interest and principal and shows the balance after each payment.'
  topic: Annuities and loans
