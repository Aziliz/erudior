# Glossary for honors module a2-h1 (Toward precalculus and beyond), round 2
- term: conic section
  aliases: [conic sections, conic, conics]
  definition: 'A curve formed where a plane cuts a double cone: a circle, ellipse, parabola or hyperbola. Each has an equation of degree 2 in $x$ and $y$.'
  topic: Conic sections
- term: degenerate conics
  aliases: [degenerate conic]
  definition: 'The point, single line or pair of crossing lines formed when the plane cutting a double cone passes through its tip. An equation of a conic can also turn out to have no points at all.'
  topic: Conic sections
- term: ellipse
  aliases: [ellipses]
  definition: 'The set of points whose distances to two fixed points (the foci) have a constant sum $2a$. Centered at the origin with a horizontal major axis: $\tfrac{x^2}{a^2} + \tfrac{y^2}{b^2} = 1$, with $c^2 = a^2 - b^2$.'
  topic: Conic sections
- term: parabola
  aliases: [parabolas]
  definition: 'The set of points equally far from a fixed point (the focus) and a fixed line (the directrix). With vertex at the origin: $x^2 = 4py$, focus $(0, p)$, directrix $y = -p$.'
  topic: Conic sections
- term: hyperbola
  aliases: [hyperbolas]
  definition: 'The set of points where the difference of the distances to two foci is a constant $2a$. Centered at the origin, opening left and right: $\tfrac{x^2}{a^2} - \tfrac{y^2}{b^2} = 1$, with $c^2 = a^2 + b^2$ and asymptotes $y = \pm\tfrac{b}{a}x$.'
  topic: Conic sections
- term: focus
  aliases: [foci]
  definition: 'A fixed point used to define a conic (plural foci). A parabola has one focus; an ellipse and a hyperbola have two, each $c$ units from the center.'
  topic: Conic sections
- term: directrix
  aliases: [directrices]
  definition: 'The fixed line in the definition of a parabola: every point on the parabola is as far from the directrix as from the focus.'
  topic: Conic sections
- term: co-vertices
  aliases: [co-vertex, covertices, covertex]
  definition: 'The two endpoints of the minor axis of an ellipse, $b$ units from the center.'
  topic: Conic sections
- term: major axis
  definition: 'The longer axis of symmetry of an ellipse: the segment between the two vertices, of length $2a$. The foci lie on it.'
  topic: Conic sections
- term: minor axis
  definition: 'The shorter axis of symmetry of an ellipse: the segment between the two co-vertices, of length $2b$.'
  topic: Conic sections
- term: eccentricity
  definition: 'For an ellipse, $e = \tfrac{c}{a}$, a number from 0 (a circle) up to but not including 1 (long and thin). A parabola has $e = 1$ and a hyperbola $e > 1$.'
  topic: Conic sections
- term: general form
  aliases: [general form of a conic]
  definition: 'A conic written as $Ax^2 + Cy^2 + Dx + Ey + F = 0$ (no $xy$ term). The coefficients $A$ and $C$ identify the type; completing the square gives the standard form.'
  topic: Conic sections
- term: parametric equations
  aliases: [parametric equation, parametric curve, parametrization, parametrize]
  definition: 'A pair of equations $x = f(t)$, $y = g(t)$ that give the coordinates of a point in terms of a third variable $t$, called the parameter (often time).'
  topic: Parametric equations
- term: orientation
  definition: 'The direction in which a parametric curve is traced as the parameter increases, usually shown with arrows.'
  topic: Parametric equations
- term: eliminate the parameter
  aliases: [eliminating the parameter]
  definition: 'To combine parametric equations into one equation in $x$ and $y$, by solving for $t$ and substituting or by using an identity such as $\cos^2 t + \sin^2 t = 1$.'
  topic: Parametric equations
- term: cycloid
  aliases: [cycloids]
  definition: 'The curve traced by a point on the rim of a rolling wheel. For radius 1: $x = t - \sin t$, $y = 1 - \cos t$.'
  topic: Parametric equations
- term: argument
  aliases: [arguments, argument of a complex number]
  definition: 'An angle from the positive real axis to the arrow representing a complex number, measured counterclockwise. Adding $360^\circ$ gives another argument of the same number.'
  topic: Polar form of complex numbers
- term: polar form
  aliases: [trigonometric form]
  definition: 'A complex number written as $r(\cos\theta + i\sin\theta)$, where $r$ is its modulus and $\theta$ an argument.'
  topic: Polar form of complex numbers
- term: cis
  definition: 'Short for $\cos\theta + i\sin\theta$, so $r\,\text{cis}\,\theta = r(\cos\theta + i\sin\theta)$.'
  topic: Polar form of complex numbers
- term: angle-sum formulas
  aliases: [angle-sum formula, angle addition formulas]
  definition: '$\cos(\alpha + \beta) = \cos\alpha\cos\beta - \sin\alpha\sin\beta$ and $\sin(\alpha + \beta) = \sin\alpha\cos\beta + \cos\alpha\sin\beta$.'
  topic: Polar form of complex numbers
- term: De Moivre's theorem
  aliases: [De Moivre’s theorem, De Moivre's formula]
  definition: 'For every positive integer $n$, $(r\,\text{cis}\,\theta)^n = r^n\,\text{cis}(n\theta)$.'
  topic: Powers and roots of complex numbers
- term: roots of unity
  aliases: [root of unity, nth roots of unity]
  definition: 'The $n$ solutions of $z^n = 1$: $\text{cis}\tfrac{360^\circ k}{n}$ for $k = 0, 1, \dots, n - 1$, the corners of a regular $n$-gon on the unit circle.'
  topic: Powers and roots of complex numbers
- term: average rate of change
  aliases: [average rates of change]
  definition: 'For $f$ from $x = a$ to $x = b$: $\tfrac{f(b) - f(a)}{b - a}$, the slope of the secant line through the two points.'
  topic: Average rate of change
- term: secant line
  aliases: [secant lines]
  definition: 'A line through two points of a graph. Its slope is the average rate of change between them.'
  topic: Average rate of change
- term: difference quotient
  aliases: [difference quotients]
  definition: '$\tfrac{f(x + h) - f(x)}{h}$ with $h \ne 0$: the average rate of change of $f$ from $x$ to $x + h$.'
  topic: Difference quotients
- term: instantaneous rate of change
  definition: 'The value the difference quotient approaches as $h$ shrinks toward 0: the rate of change at a single point, and the slope of the tangent line there.'
  topic: Difference quotients
- term: tangent line
  aliases: [tangent lines]
  definition: 'The line that just touches a smooth curve at a point, with slope equal to the instantaneous rate of change there.'
  topic: Difference quotients
- term: derivative
  aliases: [derivatives]
  definition: 'The instantaneous rate of change of $f$ as a function of $x$, written $f''(x) = \lim_{h \to 0} \tfrac{f(x + h) - f(x)}{h}$. The central idea of calculus.'
  topic: Difference quotients
