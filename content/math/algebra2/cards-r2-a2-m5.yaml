# Round 2 cards for a2-m5 (honors lessons 19h1 and 19h2)
- {front: 'Proper vs improper rational function', back: 'Proper: numerator degree less than denominator degree. Improper: numerator degree greater than or equal to it.', topic: Slant asymptotes}
- {front: 'Dividing an improper rational function', back: '$\dfrac{P}{Q} = q + \dfrac{r}{Q}$ with $\deg r < \deg Q$: a polynomial quotient plus a proper remainder piece.', topic: Slant asymptotes}
- {front: 'End behavior of a rational function', back: 'For large $|x|$ the remainder piece fades, so $f(x)$ approaches the quotient $q(x)$.', topic: Slant asymptotes}
- {front: 'When is there a slant asymptote?', back: 'When the numerator''s degree is exactly one more than the denominator''s. The asymptote is the linear quotient $y = mx + b$.', topic: Slant asymptotes}
- {front: 'Finding a slant asymptote', back: 'Divide (long or synthetic division). The asymptote is the quotient alone; drop the remainder.', topic: Slant asymptotes}
- {front: 'Above or below the asymptote?', back: 'Look at the sign of the remainder piece $\dfrac{r(x)}{Q(x)}$: positive means above, negative means below.', topic: Slant asymptotes}
- {front: 'Where a graph crosses its horizontal or slant asymptote', back: 'At the zeros of the remainder $r(x)$ (where $Q(x) \ne 0$). A graph never crosses a vertical asymptote.', topic: Slant asymptotes}
- {front: 'Numerator degree two or more above the denominator''s', back: 'No line asymptote; the graph follows the quotient polynomial, e.g. $\dfrac{x^3 + 1}{x} = x^2 + \dfrac1x$ hugs $y = x^2$.', topic: Slant asymptotes}
- {front: 'Average cost', back: '$A(x) = \dfrac{C(x)}{x}$. With fixed costs it has a vertical asymptote at $x = 0$; a quadratic cost gives a slant asymptote.', topic: Average cost}
- {front: 'AM–GM inequality', back: 'For $a, b \ge 0$: $a + b \ge 2\sqrt{ab}$, with equality exactly when $a = b$. Proof: $(\sqrt a - \sqrt b)^2 \ge 0$.', topic: Average cost}
- {front: 'Minimum of $px + \dfrac{q}{x}$ for $x > 0$ ($p, q > 0$)', back: '$2\sqrt{pq}$, reached at $x = \sqrt{q/p}$, where the two terms are equal.', topic: Average cost}
- {front: 'Partial fraction decomposition', back: 'Writing a proper rational expression as a sum of simple fractions, one group per factor of the denominator. It reverses adding fractions.', topic: Partial fractions}
- {front: 'Partial fraction term for a linear factor $x - r$ (appearing once)', back: '$\dfrac{A}{x - r}$', topic: Partial fractions}
- {front: 'Partial fraction terms for $(x - r)^k$', back: 'One term for each power: $\dfrac{A_1}{x - r} + \dfrac{A_2}{(x - r)^2} + \cdots + \dfrac{A_k}{(x - r)^k}$.', topic: Partial fractions}
- {front: 'Partial fraction term for an irreducible quadratic', back: 'A linear numerator: $\dfrac{Bx + C}{ax^2 + bx + c}$.', topic: Partial fractions}
- {front: 'Partial fractions of an improper fraction', back: 'Divide first, then decompose only the proper remainder fraction.', topic: Partial fractions}
- {front: 'How many unknowns in a partial fraction decomposition?', back: 'As many as the degree of the denominator.', topic: Partial fractions}
- {front: 'Cover-up method', back: 'For a factor $x - r$ that appears once: cover it in the original fraction and evaluate the rest at $x = r$ to get its numerator.', topic: Partial fractions}
- {front: 'Finding unknowns that cover-up can''t reach', back: 'Clear denominators and match the coefficients of like powers of $x$ (or substitute any other convenient $x$).', topic: Partial fractions}
- {front: '$\dfrac{1}{k(k + 1)}$ in partial fractions', back: '$\dfrac1k - \dfrac{1}{k + 1}$, so $\displaystyle\sum_{k=1}^{n} \frac{1}{k(k + 1)} = 1 - \frac{1}{n + 1} = \frac{n}{n + 1}$.', topic: Partial fractions}
- {front: 'Telescoping sum', back: 'A sum where each term cancels part of a later one, leaving only a few pieces at the ends.', topic: Partial fractions}
