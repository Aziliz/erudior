# ---------- Lesson 25: counting ----------
- id: a2-m8-r2-q01
  lesson: a2-counting
  type: text
  topic: Permutations and combinations
  stem: 'The number of distinguishable arrangements of the letters in MISSISSIPPI is ___. Give only the number.'
  accept: ['34650', '34,650']
  explanation: |-
    MISSISSIPPI has 11 letters: one M, four I's, four S's and two P's. Divide $11!$ by the factorial of each repeated group: $\dfrac{11!}{4!\,4!\,2!} = \dfrac{39{,}916{,}800}{24 \cdot 24 \cdot 2} = 34{,}650$.
- id: a2-m8-r2-q02
  lesson: a2-counting
  type: match
  module_quiz: true
  topic: Permutations and combinations
  stem: 'Match each expression to its value.'
  pairs:
    - ['$_5P_2$', '20']
    - ['$_5C_2$', '10']
    - ['$5!$', '120']
    - ['$0!$', '1']
  distractors: ['0', '25']
  explanation: |-
    $_5P_2 = 5 \cdot 4 = 20$ (ordered pairs). $_5C_2 = \tfrac{20}{2!} = 10$ (each pair counted once). $5! = 5 \cdot 4 \cdot 3 \cdot 2 \cdot 1 = 120$. $0! = 1$ by definition, not 0. 25 would be $5^2$, which allows repeats.
- id: a2-m8-r2-q03
  lesson: a2-counting
  type: order
  topic: Permutations and combinations
  stem: 'Put these counts in order from smallest to largest.'
  items: ['$_6C_3$', '$_6P_3$', '$6^3$', '$6!$']
  explanation: |-
    $_6C_3 = 20$, $_6P_3 = 6 \cdot 5 \cdot 4 = 120$, $6^3 = 216$ and $6! = 720$. Choosing 3 from 6 without order gives the fewest; ordering them multiplies by $3! = 6$; allowing repeats ($6^3$) gives more still; arranging all six is the most.
- id: a2-m8-r2-q04
  lesson: a2-counting
  module_quiz: true
  topic: Permutations and combinations
  stem: 'Which of these should be counted with combinations, because order does not matter? Select all that apply.'
  choices:
    - 'The number of 5-card hands that can be dealt from a deck'
    - 'The number of ways to elect a president and a vice president from a club'
    - 'The number of ways to choose 3 of 10 books to take on a trip'
    - 'The number of possible 4-digit locker codes'
  answer: [0, 2]
  explanation: |-
    A hand of cards and a set of books are unordered groups: combinations. President and vice president are different roles, so order matters (a permutation). A locker code is ordered and digits can repeat, so it uses the counting principle ($10^4$).
- id: a2-m8-r2-q05
  lesson: a2-counting
  type: text
  topic: Counting principle
  stem: 'A password is 2 letters followed by 3 digits. The two letters must be different; digits may repeat. The number of possible passwords is ___. Give only the number.'
  accept: ['650000', '650,000']
  explanation: |-
    Fill the slots: 26 choices for the first letter, 25 for the second (it must differ), and 10 for each digit. By the counting principle, $26 \cdot 25 \cdot 10 \cdot 10 \cdot 10 = 650{,}000$.

# ---------- Lesson 26: binomial theorem ----------
- id: a2-m8-r2-q06
  lesson: a2-binomial
  type: label
  module_quiz: true
  topic: Pascal's triangle
  stem: 'Rows 0 to 7 of Pascal''s triangle are shown with four entries missing. Choose the number that belongs in each numbered circle.'
  image: {src: images/a2-m8-pascal-blank.svg, alt: 'Pascal''s triangle, rows 0 to 7, drawn as circles with numbers. Four circles are empty and numbered: the third entry of row 5, the middle entry of row 6, and the third and fourth entries of row 7.'}
  labels:
    - {x: 48.5, y: 67.4, text: '10'}
    - {x: 52.8, y: 78.9, text: '20'}
    - {x: 39.9, y: 90.5, text: '21'}
    - {x: 48.5, y: 90.5, text: '35'}
  distractors: ['28', '30']
  explanation: |-
    Each entry is the sum of the two above it, or entry $k$ of row $n$ is $_nC_k$. (1) Row 5, entry 2: $4 + 6 = 10$. (2) Row 6, entry 3: $10 + 10 = 20$. (3) Row 7, entry 2: $6 + 15 = 21$. (4) Row 7, entry 3: $15 + 20 = 35$. 28 is $_8C_2$, from row 8, and 30 is $15 + 15$, adding two entries that aren't side by side.
- id: a2-m8-r2-q07
  lesson: a2-binomial
  type: text
  topic: Binomial theorem
  stem: 'In the expansion of $(x + 1)^6$, the coefficient of $x^2$ is ___.'
  accept: ['15']
  explanation: |-
    With $a = x$, $b = 1$, the power of $x$ is $6 - k$, so $x^2$ needs $k = 4$: $_6C_4\,x^2\,(1)^4 = 15x^2$. (By symmetry, $_6C_4 = {}_6C_2 = 15$.)
- id: a2-m8-r2-q08
  lesson: a2-binomial
  type: order
  topic: Binomial theorem
  stem: 'Put the steps for finding the coefficient of $x^5$ in $(x - 2)^8$ in order.'
  items:
    - 'Identify $a = x$, $b = -2$ and $n = 8$'
    - 'Write the general term $_8C_k\,x^{8-k}(-2)^k$'
    - 'Set $8 - k = 5$, so $k = 3$'
    - 'Compute $_8C_3\,(-2)^3 = 56(-8) = -448$'
  explanation: |-
    You need $a$, $b$ and $n$ before you can write the general term; the general term shows the power of $x$, which tells you $k$; and only with $k$ can you compute the coefficient, $-448$.
- id: a2-m8-r2-q09
  lesson: a2-binomial
  topic: Binomial theorem
  stem: 'Which statements about the expansion of $(a + b)^7$ are true? Select all that apply.'
  choices:
    - 'It has 8 terms.'
    - 'Its coefficients add up to 128.'
    - 'The coefficient of $a^4b^3$ is 35.'
    - 'The coefficient of $a^6b$ is 6.'
  answer: [0, 1, 2]
  explanation: |-
    $(a + b)^n$ has $n + 1 = 8$ terms. Setting $a = b = 1$ gives $2^7 = 128$ for the sum of the coefficients. The coefficient of $a^4b^3$ is $_7C_3 = 35$. The coefficient of $a^6b$ is $_7C_1 = 7$, not 6.
- id: a2-m8-r2-q10
  lesson: a2-binomial
  type: match
  module_quiz: true
  topic: Binomial theorem
  stem: 'The sum of the coefficients of a polynomial is its value at $x = 1$. Match each power to the sum of the coefficients in its expansion.'
  pairs:
    - ['$(x + 1)^5$', '32']
    - ['$(x + 2)^3$', '27']
    - ['$(x - 1)^4$', '0']
    - ['$(2x + 1)^2$', '9']
  distractors: ['16', '1']
  explanation: |-
    Put $x = 1$ before expanding: $(1 + 1)^5 = 32$, $(1 + 2)^3 = 27$, $(1 - 1)^4 = 0$ and $(2 + 1)^2 = 9$. For instance, $(x - 1)^4 = x^4 - 4x^3 + 6x^2 - 4x + 1$, and $1 - 4 + 6 - 4 + 1 = 0$.

# ---------- Lesson 27: probability ----------
- id: a2-m8-r2-q11
  lesson: a2-probability
  type: label
  topic: Probability rules
  stem: 'This Venn diagram sorts a standard 52-card deck by two events: "the card is a heart" and "the card is a face card". Name each numbered region.'
  image: {src: images/a2-m8-venn-cards-blank.svg, alt: 'A rectangle labeled all 52 cards containing two overlapping circles labeled Hearts and Face cards. Region 1 is in the Hearts circle only, region 2 is the overlap, region 3 is in the Face cards circle only, and region 4 is outside both circles.'}
  labels:
    - {x: 31.2, y: 53.8, text: 'Hearts that are not face cards'}
    - {x: 50.0, y: 53.8, text: 'Heart face cards'}
    - {x: 68.8, y: 53.8, text: 'Face cards that are not hearts'}
    - {x: 86.1, y: 86.2, text: 'Neither hearts nor face cards'}
  distractors: ['Cards that are hearts or face cards']
  explanation: |-
    Region 1, in the Hearts circle only, holds the ace through 10 of hearts (10 cards). Region 2, the overlap, holds the jack, queen and king of hearts (3 cards). Region 3 holds the other 9 face cards. Region 4, outside both circles, holds the remaining 30 cards. "Hearts or face cards" is not one region: it is regions 1, 2 and 3 together (22 cards).
- id: a2-m8-r2-q12
  lesson: a2-probability
  type: text
  module_quiz: true
  topic: Probability rules
  stem: 'One card is drawn from a standard 52-card deck. The probability that it is neither a heart nor a face card is ___. Give a fraction.'
  accept: ['15/26', '30/52']
  explanation: |-
    $P(\text{heart or face}) = \tfrac{13}{52} + \tfrac{12}{52} - \tfrac{3}{52} = \tfrac{22}{52}$. "Neither" is its complement: $1 - \tfrac{22}{52} = \tfrac{30}{52} = \tfrac{15}{26}$. In the Venn diagram these are the 30 cards outside both circles.
- id: a2-m8-r2-q13
  lesson: a2-probability
  type: match
  topic: Conditional probability
  stem: 'Match each probability to the way to compute it.'
  pairs:
    - ['$P(\text{not } A)$', 'Subtract P(A) from 1']
    - ['$P(A \text{ or } B)$ when $A$ and $B$ overlap', 'Add P(A) and P(B), then subtract P(A and B)']
    - ['$P(A \text{ and } B)$ when $A$ and $B$ are independent', 'Multiply P(A) by P(B)']
    - ['$P(B \mid A)$', 'Divide P(A and B) by P(A)']
  distractors: ['Divide P(A) by P(A and B)']
  explanation: |-
    The complement rule gives "not". The addition rule gives "or", subtracting the overlap that would otherwise be counted twice. For independent events, "and" is a product. A conditional probability divides the joint probability by the probability of the condition, $P(B \mid A) = \tfrac{P(A \text{ and } B)}{P(A)}$; dividing the other way gives a number of at least 1, which can't be a probability.
- id: a2-m8-r2-q14
  lesson: a2-probability
  module_quiz: true
  topic: Conditional probability
  stem: 'Which pairs of events are independent? Select all that apply.'
  choices:
    - 'From a bag of 4 red and 6 blue marbles, drawing red first and red second, with replacement'
    - 'From a bag of 4 red and 6 blue marbles, drawing red first and red second, without replacement'
    - 'Rolling a 6 on a die and getting heads on a coin flip'
    - 'One card drawn from a deck is a heart, and the same card is a spade'
  answer: [0, 2]
  explanation: |-
    With replacement the bag is the same for the second draw, so the first draw doesn't change the chance of red ($\tfrac{4}{10}$ both times). Without replacement, red first leaves $\tfrac39$ red, not $\tfrac{4}{10}$: dependent. A die and a coin don't affect each other. Heart and spade are mutually exclusive, so knowing one happened makes the other impossible: not independent.
- id: a2-m8-r2-q15
  lesson: a2-probability
  type: order
  topic: Probability rules
  stem: 'One card is drawn from a standard 52-card deck. Put these probabilities in order from smallest to largest.'
  items:
    - '$P(\text{king of hearts})$'
    - '$P(\text{king})$'
    - '$P(\text{heart})$'
    - '$P(\text{heart or king})$'
    - '$P(\text{not a king})$'
  explanation: |-
    $P(\text{king of hearts}) = \tfrac{1}{52}$, $P(\text{king}) = \tfrac{4}{52}$, $P(\text{heart}) = \tfrac{13}{52}$, $P(\text{heart or king}) = \tfrac{13 + 4 - 1}{52} = \tfrac{16}{52}$ and $P(\text{not a king}) = 1 - \tfrac{4}{52} = \tfrac{48}{52}$.

# ---------- Lesson 28: normal distribution and sampling ----------
- id: a2-m8-r2-q16
  lesson: a2-normal
  type: label
  module_quiz: true
  topic: Normal distribution
  stem: 'By the 68–95–99.7 rule, what percent of the area under a normal curve lies in each numbered region?'
  image: {src: images/a2-m8-normal-blank.svg, alt: 'A normal curve with tick marks at the mean and at 1, 2 and 3 standard deviations on each side. Region 1 is between the mean and 1 SD above it, region 2 between 1 and 2 SD above, region 3 between 2 and 3 SD above, and region 4 is the tail beyond 3 SD above the mean.'}
  labels:
    - {x: 55.7, y: 60.8, text: '34%'}
    - {x: 67.1, y: 77.0, text: '13.5%'}
    - {x: 81.2, y: 50.7, text: '2.35%'}
    - {x: 93.5, y: 32.1, text: '0.15%'}
  distractors: ['68%', '5%']
  explanation: |-
    Halve each part of the rule. 68% lies within 1 SD, so 34% is between $\mu$ and $\mu + \sigma$. 95% lies within 2 SD, so $47.5\% - 34\% = 13.5\%$ is between $\mu + \sigma$ and $\mu + 2\sigma$. 99.7% lies within 3 SD, so $49.85\% - 47.5\% = 2.35\%$ is between $\mu + 2\sigma$ and $\mu + 3\sigma$, and $50\% - 49.85\% = 0.15\%$ is beyond $\mu + 3\sigma$.
- id: a2-m8-r2-q17
  lesson: a2-normal
  type: text
  topic: Normal distribution
  stem: 'Test scores are normally distributed with mean 72 and standard deviation 6. A score of 63 has a z-score of ___. Give only the number.'
  accept: ['-1.5']
  explanation: |-
    $z = \dfrac{x - \mu}{\sigma} = \dfrac{63 - 72}{6} = \dfrac{-9}{6} = -1.5$. The score is 1.5 standard deviations below the mean, so the z-score is negative.
- id: a2-m8-r2-q18
  lesson: a2-normal
  type: match
  module_quiz: true
  topic: Sampling and surveys
  stem: 'A school has 640 seniors. A random sample of 80 seniors is surveyed, and 35% of them say they will go to prom. Match each term to what it is in this survey.'
  pairs:
    - ['Population', 'All 640 seniors at the school']
    - ['Sample', 'The 80 seniors who were surveyed']
    - ['Statistic', 'The 35% of the 80 surveyed who will go']
    - ['Parameter', 'The true percent of all 640 seniors who will go']
  distractors: ['The seniors who did not answer']
  explanation: |-
    The population is the whole group of interest (640 seniors), and the sample is the part actually surveyed (80). A statistic is a number computed from the sample (35%); the parameter is the matching number for the whole population, which is usually unknown and is what the survey estimates.
- id: a2-m8-r2-q19
  lesson: a2-normal
  type: order
  topic: Normal distribution
  stem: 'Put the steps for finding $P(X > a)$ with a standard normal table in order.'
  items:
    - 'Compute $z = \dfrac{a - \mu}{\sigma}$'
    - 'Read the area to the left of $z$ from the table'
    - 'Subtract that area from 1'
  explanation: |-
    The table is in terms of $z$, so convert first. The table gives the area to the left of $z$, which is $P(X < a)$. "Greater than" is the complement, so subtract from 1.
- id: a2-m8-r2-q20
  lesson: a2-normal
  topic: Sampling and surveys
  stem: 'Which of these survey plans are likely to be biased? Select all that apply.'
  choices:
    - 'Posting an online poll that anyone can choose to answer'
    - 'Asking shoppers at one mall on a Saturday about a citywide issue'
    - 'Choosing 200 names at random from the complete list of registered voters'
    - 'Asking fans entering a basketball game how much students at the school like basketball'
  answer: [0, 1, 3]
  explanation: |-
    A voluntary online poll overrepresents people with strong opinions. Mall shoppers on a Saturday are a convenience sample, not the whole city. Basketball fans are far more likely than other students to like basketball. A simple random sample from the complete voter list gives every voter the same chance, so it is not biased (though it still has a margin of error).

# ---------- Honors: random variables and expected value ----------
- id: a2-m8-r2-h01
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A random variable $X$ takes the values 0, 1 and 2. Which list of probabilities $P(X = 0), P(X = 1), P(X = 2)$ is a valid probability distribution?'
  choices: ['$0.3, 0.3, 0.3$', '$0.5, 0.6, -0.1$', '$0.2, 0.5, 0.3$', '$0.4, 0.4, 0.4$']
  answer: 2
  explanation: |-
    Every probability must be between 0 and 1 and the probabilities must add to 1. Only $0.2 + 0.5 + 0.3 = 1$ works. $0.3 + 0.3 + 0.3 = 0.9$ and $0.4 \cdot 3 = 1.2$ have the wrong totals, and $-0.1$ is not a probability even though that list adds to 1.
- id: a2-m8-r2-h02
  lesson: a2-h-expected-value
  topic: Expected value
  stem: '$X$ takes the values 1, 2, 3 and 4 with probabilities 0.1, 0.2, 0.3 and 0.4. Find $E(X)$.'
  choices: ['$2.5$', '$3$', '$10$', '$0.25$']
  answer: 1
  explanation: |-
    $E(X) = 1(0.1) + 2(0.2) + 3(0.3) + 4(0.4) = 0.1 + 0.4 + 0.9 + 1.6 = 3$. 2.5 is the plain average of the values, which ignores that the larger values are more likely; 10 is the sum of the values.
- id: a2-m8-r2-h03
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A game costs \$2. You roll a fair die and win \$6 if it shows a 6, and nothing otherwise. What is your expected net gain per game?'
  choices: ['Lose \$1 per game', 'Win \$4 per game', 'Lose \$1.67 per game', 'Break even']
  answer: 0
  explanation: |-
    Net gains: $6 - 2 = 4$ dollars with probability $\tfrac16$, and $-2$ dollars with probability $\tfrac56$. $E = 4 \cdot \tfrac16 - 2 \cdot \tfrac56 = \tfrac{4 - 10}{6} = -1$. (Shortcut: expected prize $6 \cdot \tfrac16 = 1$, minus the \$2 cost.) Winning \$4 ignores the probabilities, and $-1.67$ counts only the losing outcome.
- id: a2-m8-r2-h04
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A game pays \$20 with probability 0.15, pays \$5 with probability 0.30, and pays nothing otherwise. What price to play would make it a fair game?'
  choices: ['\$12.50', '\$25.00', '\$3.00', '\$4.50']
  answer: 3
  explanation: |-
    A game is fair when the price equals the expected prize: $20(0.15) + 5(0.30) + 0(0.55) = 3 + 1.5 = 4.50$ dollars. \$12.50 is the plain average of the two prizes, \$25 their sum, and \$3 counts only the big prize.
- id: a2-m8-r2-h05
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A roulette player has lost 10 spins in a row on red. Which statement is correct?'
  choices: ['By the law of large numbers, red is now more likely than usual', 'Each spin is independent, so red has the same probability as on any other spin', 'The losses must be made up within the next few spins', 'The expected value guarantees the player will break even eventually']
  answer: 1
  explanation: |-
    The wheel has no memory: each spin is independent. The law of large numbers says the long-run average approaches the expected value; it doesn't make a win "due" (that's the gambler's fallacy), and it guarantees nothing about breaking even. In fact roulette has a negative expected value for the player.
- id: a2-m8-r2-h06
  lesson: a2-h-expected-value
  type: text
  topic: Expected value
  stem: 'A prize $X$ is \$10 with probability 0.2 and \$0 with probability 0.8, so $E(X) = 2$. The standard deviation of $X$ is ___ dollars. Give only the number.'
  accept: ['4']
  explanation: |-
    $\sigma = \sqrt{(10 - 2)^2(0.2) + (0 - 2)^2(0.8)} = \sqrt{64(0.2) + 4(0.8)} = \sqrt{12.8 + 3.2} = \sqrt{16} = 4$. Forgetting the square root gives 16, the variance.
- id: a2-m8-r2-h07
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A food truck sells $X$ meals in an hour, with $E(X) = 12$. Its profit for the hour, in dollars, is $Y = 5X - 8$. Find $E(Y)$.'
  choices: ['$52$', '$60$', '$4$', '$12$']
  answer: 0
  explanation: |-
    $E(aX + b) = aE(X) + b$, so $E(Y) = 5(12) - 8 = 52$. 60 forgets to subtract 8; 4 subtracts 8 from 12 without multiplying.
- id: a2-m8-r2-h08
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'An insurer charges \$300 a year for a policy. With probability 0.002 it pays a \$100,000 claim; otherwise it pays nothing. What is the insurer''s expected profit per policy (ignoring other costs)?'
  choices: ['\$299.80', '\$200', '\$100', 'A loss of \$99,700']
  answer: 2
  explanation: |-
    Expected payout: $100{,}000(0.002) = 200$ dollars. Expected profit: $300 - 200 = 100$ dollars per policy. \$200 is the expected payout itself, \$299.80 subtracts the probability instead of the expected payout, and a loss of \$99,700 is what happens on the rare policy that has a claim.
- id: a2-m8-r2-h09
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'Why can an insurance company count on its average payout per policy being close to the expected payout?'
  choices: ['Because the expected payout is the most likely payout on each policy', 'Because every policy pays out exactly the expected value', 'Because the standard deviation of one policy''s payout is zero', 'Because it sells many independent policies, so the law of large numbers applies']
  answer: 3
  explanation: |-
    One policy is very unpredictable (usually 0, occasionally huge), but the average over thousands of independent policies settles close to the expected value. The most likely payout on a single policy is usually 0, not the expected value.
- id: a2-m8-r2-h10
  lesson: a2-h-expected-value
  type: text
  topic: Expected value
  stem: 'The expected value of one roll of a fair six-sided die is ___. Give only the number.'
  accept: ['3.5', '7/2']
  explanation: |-
    $E = \tfrac{1 + 2 + 3 + 4 + 5 + 6}{6} = \tfrac{21}{6} = 3.5$. The expected value doesn't have to be a value the die can show; it is the long-run average.
- id: a2-m8-r2-h11
  lesson: a2-h-expected-value
  type: match
  topic: Expected value
  stem: 'Match each game to its expected net gain per play.'
  pairs:
    - ['Pay \$1; win \$2 with probability $\tfrac12$', '0 dollars (fair)']
    - ['Pay \$1; win \$5 with probability $\tfrac14$', '+0.25 dollars']
    - ['Pay \$2; win \$3 with probability $\tfrac12$', '−0.50 dollars']
    - ['Pay \$1; win \$4 with probability $\tfrac12$', '+1 dollar']
  distractors: ['−1 dollar']
  explanation: |-
    Expected net gain = expected prize − cost. $2 \cdot \tfrac12 - 1 = 0$; $5 \cdot \tfrac14 - 1 = 0.25$; $3 \cdot \tfrac12 - 2 = -0.5$; $4 \cdot \tfrac12 - 1 = 1$.
- id: a2-m8-r2-h12
  lesson: a2-h-expected-value
  type: order
  topic: Expected value
  stem: 'Put the steps for finding the expected net gain of a game in order.'
  items:
    - 'List every possible net gain, including losses'
    - 'Find the probability of each net gain'
    - 'Multiply each net gain by its probability'
    - 'Add the products'
  explanation: |-
    You need the values and their probabilities (the distribution) before you can weight each value, and the weighted values are added last: $E(X) = \sum x\,P(X = x)$.
- id: a2-m8-r2-h13
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'Which statements about expected value are true? Select all that apply.'
  choices:
    - '$E(X + Y) = E(X) + E(Y)$, even when $X$ and $Y$ are not independent.'
    - 'The expected value must be one of the values $X$ can take.'
    - 'A game whose expected net gain is 0 is called a fair game.'
    - 'Two games with the same expected value always carry the same risk.'
  answer: [0, 2]
  explanation: |-
    Expected values always add, independent or not. A fair game has expected net gain 0. The expected value need not be a possible value (one die averages 3.5). Games with the same mean can have very different standard deviations, so they can carry very different risks.
- id: a2-m8-r2-h14
  lesson: a2-h-expected-value
  topic: Expected value
  stem: 'A test gives 1 point for a right answer, takes away $\tfrac13$ point for a wrong answer, and gives 0 for a blank. Each question has 4 choices. What is the expected score from guessing at random on one question?'
  choices: ['$\tfrac14$', '$0$', '$-\tfrac{1}{12}$', '$\tfrac{1}{12}$']
  answer: 1
  explanation: |-
    $E = 1 \cdot \tfrac14 + \left(-\tfrac13\right) \cdot \tfrac34 = \tfrac14 - \tfrac14 = 0$. The penalty is exactly the one that makes blind guessing a fair game. $\tfrac14$ ignores the penalty.

# ---------- Honors: the binomial distribution ----------
- id: a2-m8-r2-h15
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'Which random variable has a binomial distribution?'
  choices: ['The number of heads in 20 flips of a fair coin', 'The number of flips needed to get the first head', 'The number of aces in a 5-card hand dealt from one deck', 'The total of the numbers on 3 dice']
  answer: 0
  explanation: |-
    Coin flips are independent, there are a fixed 20 of them, each is head or not, and $p = 0.5$ every time. The number of flips until the first head has no fixed number of trials. Cards dealt from one deck are dependent (drawn without replacement from a small deck). The total of 3 dice is a sum of values, not a count of successes.
- id: a2-m8-r2-h16
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'A fair coin is flipped 5 times. What is the probability of exactly 2 heads?'
  choices: ['$\tfrac{1}{32}$', '$\tfrac25$', '$\tfrac{5}{16}$', '$\tfrac14$']
  answer: 2
  explanation: |-
    $P(X = 2) = {}_5C_2\left(\tfrac12\right)^2\left(\tfrac12\right)^3 = \tfrac{10}{32} = \tfrac{5}{16}$. $\tfrac{1}{32}$ is the probability of one particular order (it leaves out $_5C_2$); $\tfrac25$ treats "2 out of 5" as a probability.
- id: a2-m8-r2-h17
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'Each part from a machine is defective with probability 0.2, independently. In a sample of 4 parts, what is the probability that exactly 1 is defective?'
  choices: ['$0.1024$', '$0.4096$', '$0.2$', '$0.0256$']
  answer: 1
  explanation: |-
    $P(X = 1) = {}_4C_1\,(0.2)^1(0.8)^3 = 4(0.2)(0.512) = 0.4096$. $0.1024$ leaves out $_4C_1$; $0.0256 = 4(0.2)^3(0.8)$ swaps the exponents.
- id: a2-m8-r2-h18
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: '$X$ is binomial with $n = 50$ and $p = 0.4$. Find its mean and standard deviation.'
  choices: ['$\mu = 20$, $\sigma = 12$', '$\mu = 30$, $\sigma \approx 3.46$', '$\mu = 20$, $\sigma \approx 4.47$', '$\mu = 20$, $\sigma \approx 3.46$']
  answer: 3
  explanation: |-
    $\mu = np = 50(0.4) = 20$ and $\sigma = \sqrt{np(1 - p)} = \sqrt{50(0.4)(0.6)} = \sqrt{12} \approx 3.46$. $\sigma = 12$ forgets the square root, $\mu = 30$ uses $1 - p$, and $\sqrt{20}$ leaves out the factor $1 - p$.
- id: a2-m8-r2-h19
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'A seed sprouts with probability 0.1, independently. If 6 seeds are planted, what is the probability that at least one sprouts?'
  choices: ['$0.6$', '$0.3543$', '$0.4686$', '$0.5314$']
  answer: 2
  explanation: |-
    Use the complement: $P(\text{none}) = 0.9^6 \approx 0.5314$, so $P(\text{at least one}) = 1 - 0.5314 = 0.4686$. $0.3543$ is $P(\text{exactly one}) = 6(0.1)(0.9)^5$; 0.6 adds $0.1$ six times, which can't be right in general (with 11 seeds it would exceed 1).
- id: a2-m8-r2-h20
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: '$X$ is binomial with $n = 10$. Which expression equals $P(X \ge 4)$?'
  choices: ['$1 - P(X \le 4)$', '$1 - P(X \le 3)$', '$1 - P(X \ge 3)$', '$P(X \le 4)$']
  answer: 1
  explanation: |-
    "At least 4" means 4, 5, …, 10. Its complement is 0, 1, 2, 3, which is $X \le 3$. $1 - P(X \le 4)$ would also remove $X = 4$, giving $P(X \ge 5)$.
- id: a2-m8-r2-h21
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'Using the rule of thumb $np \ge 10$ and $n(1 - p) \ge 10$, which binomial distribution is close enough to normal to use a normal approximation?'
  choices: ['$n = 40$, $p = 0.1$', '$n = 200$, $p = 0.02$', '$n = 15$, $p = 0.6$', '$n = 60$, $p = 0.5$']
  answer: 3
  explanation: |-
    $60(0.5) = 30$ and $60(0.5) = 30$, both at least 10. The others fail: $40(0.1) = 4$, $200(0.02) = 4$, and $15(0.6) = 9$ with $15(0.4) = 6$. A small expected count of successes means a skewed histogram.
- id: a2-m8-r2-h22
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'A student guesses on all 100 questions of a test with 4 choices per question. About how many standard deviations above the mean is a score of 40 correct?'
  choices: ['About 0.8', 'About 3.5', 'About 15', 'About 1.6']
  answer: 1
  explanation: |-
    $\mu = 100(0.25) = 25$ and $\sigma = \sqrt{100(0.25)(0.75)} = \sqrt{18.75} \approx 4.33$. So $z = \tfrac{40 - 25}{4.33} \approx 3.5$: very unlikely by guessing alone. 15 is the distance in questions, not in standard deviations; 0.8 divides by the variance instead of the SD.
- id: a2-m8-r2-h23
  lesson: a2-h-binomial-dist
  type: text
  topic: Binomial distribution
  stem: 'A fair coin is flipped 6 times. The probability of exactly 4 heads is ___. Give a fraction.'
  accept: ['15/64']
  explanation: |-
    $P(X = 4) = {}_6C_4\left(\tfrac12\right)^4\left(\tfrac12\right)^2 = \tfrac{15}{64}$. Each of the $2^6 = 64$ sequences is equally likely, and 15 of them have exactly 4 heads.
- id: a2-m8-r2-h24
  lesson: a2-h-binomial-dist
  type: text
  topic: Binomial distribution
  stem: 'A binomial random variable has $n = 80$ and $p = 0.25$. Its mean is ___.'
  accept: ['20']
  explanation: |-
    $\mu = np = 80(0.25) = 20$. On average a quarter of the 80 trials are successes.
- id: a2-m8-r2-h25
  lesson: a2-h-binomial-dist
  type: match
  topic: Binomial distribution
  stem: 'In $P(X = k) = {}_nC_k\,p^k(1 - p)^{n - k}$, match each piece to its job.'
  pairs:
    - ['$_nC_k$', 'Counts the orders of k successes and n − k failures']
    - ['$p^k$', 'Probability that the k successes happen']
    - ['$(1 - p)^{n - k}$', 'Probability that the n − k failures happen']
  distractors: ['Expected number of successes']
  explanation: |-
    One particular order has probability $p^k(1 - p)^{n - k}$ (multiply, since trials are independent), and there are $_nC_k$ orders, which can't happen together, so multiply by that count. The expected number of successes is $np$, which isn't a piece of this formula.
- id: a2-m8-r2-h26
  lesson: a2-h-binomial-dist
  type: order
  topic: Binomial distribution
  stem: 'A player makes 70% of her free throws, independently, and shoots 5. $X$ is the number she makes. Put these probabilities in order from smallest to largest.'
  items: ['$P(X = 0)$', '$P(X = 1)$', '$P(X = 2)$', '$P(X = 5)$', '$P(X = 3)$', '$P(X = 4)$']
  explanation: |-
    From the formula: $P(0) = 0.00243$, $P(1) = 0.02835$, $P(2) = 0.1323$, $P(5) = 0.16807$, $P(3) = 0.3087$, $P(4) = 0.36015$. The distribution peaks at 4 (close to the mean $np = 3.5$) and has a long tail toward 0.
- id: a2-m8-r2-h27
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'Which of these are required for a binomial setting? Select all that apply.'
  choices:
    - 'A fixed number of trials'
    - 'The same probability of success on every trial'
    - 'A success probability of exactly 0.5'
    - 'Trials that are independent'
  answer: [0, 1, 3]
  explanation: |-
    BINS: two outcomes, independent trials, a fixed number of trials, and the same success probability each time. $p$ can be any value between 0 and 1; it doesn't have to be 0.5.
- id: a2-m8-r2-h28
  lesson: a2-h-binomial-dist
  topic: Binomial distribution
  stem: 'Why do the binomial probabilities $P(X = 0), P(X = 1), \ldots, P(X = n)$ always add to 1?'
  choices: ['Because they are the terms of $\big((1 - p) + p\big)^n = 1^n = 1$', 'Because the values $_nC_k$ in each row add to $n$', 'Because each single term has $p + (1 - p) = 1$', 'Because the mean of the distribution is $np$']
  answer: 0
  explanation: |-
    By the binomial theorem, $\big((1 - p) + p\big)^n = \sum_{k=0}^{n} {}_nC_k\,p^k(1 - p)^{n - k}$, and the left side is $1^n = 1$. A row of Pascal's triangle adds to $2^n$, not $n$.

# ---------- Honors: Bayes' theorem ----------
- id: a2-m8-r2-h29
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'A store gets 70% of its light bulbs from supplier X and 30% from supplier Y. 3% of X''s bulbs and 8% of Y''s bulbs are defective. What fraction of all the bulbs are defective?'
  choices: ['$0.045$', '$0.11$', '$0.055$', '$0.024$']
  answer: 0
  explanation: |-
    Law of total probability: $0.70(0.03) + 0.30(0.08) = 0.021 + 0.024 = 0.045$. 0.11 just adds the two rates; 0.055 averages them without weighting by the suppliers' shares; 0.024 is only Y's path.
- id: a2-m8-r2-h30
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'In the same store (70% of bulbs from X with 3% defective, 30% from Y with 8% defective), a bulb is found to be defective. What is the probability it came from supplier Y?'
  choices: ['About 0.08', 'About 0.30', 'About 0.53', 'About 0.024']
  answer: 2
  explanation: |-
    Bayes: $P(Y \mid D) = \dfrac{0.30(0.08)}{0.045} = \dfrac{0.024}{0.045} \approx 0.53$. Y supplies only 30% of the bulbs but over half of the defective ones. 0.08 is $P(D \mid Y)$, the reverse conditional; 0.30 is the prior $P(Y)$.
- id: a2-m8-r2-h31
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'The sensitivity of a medical test is'
  choices: ['$P(\text{disease} \mid \text{positive})$', '$P(\text{negative} \mid \text{no disease})$', '$P(\text{disease})$', '$P(\text{positive} \mid \text{disease})$']
  answer: 3
  explanation: |-
    Sensitivity is the fraction of people with the disease who test positive. $P(\text{negative} \mid \text{no disease})$ is the specificity, $P(\text{disease})$ is the prevalence, and $P(\text{disease} \mid \text{positive})$ is what Bayes' theorem computes from all three.
- id: a2-m8-r2-h32
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'A condition affects 2% of a population. A test has sensitivity 95% and specificity 90%. About what is the probability that a person who tests positive has the condition?'
  choices: ['About 95%', 'About 16%', 'About 90%', 'About 2%']
  answer: 1
  explanation: |-
    Out of 10,000 people: 200 have it and 190 test positive; 9,800 don't and 10% of them, 980, test positive. $P = \tfrac{190}{190 + 980} = \tfrac{190}{1170} \approx 0.16$. 95% is the sensitivity (the reverse conditional), and 2% is the prior before the test.
- id: a2-m8-r2-h33
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'The same test (sensitivity 95%, specificity 90%) is used in a clinic where 30% of the patients have the condition. How does $P(\text{condition} \mid \text{positive})$ there compare with the 16% found when the prevalence is 2%?'
  choices: ['It is the same, because the test has not changed', 'It is lower, because more patients are sick', 'It is higher, about 80%, because the condition is more common', 'It equals the sensitivity, 95%']
  answer: 2
  explanation: |-
    $\dfrac{0.30(0.95)}{0.30(0.95) + 0.70(0.10)} = \dfrac{0.285}{0.355} \approx 0.80$. The test is the same, but the prior is much higher, so far fewer of the positives are false positives. What a result means depends on the base rate.
- id: a2-m8-r2-h34
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'A test has specificity 97%. What is its false positive rate, $P(\text{positive} \mid \text{no disease})$?'
  choices: ['97%', '0%', '3%', 'It can''t be found without the sensitivity']
  answer: 2
  explanation: |-
    Among people without the disease, every result is negative or positive, so $P(+ \mid \text{no disease}) = 1 - 0.97 = 0.03$. The sensitivity describes people who have the disease, so it isn't needed.
- id: a2-m8-r2-h35
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'A DNA profile matches about 1 in 100,000 people at random. In a region of 2,000,000 people, about how many people other than the true source would be expected to match?'
  choices: ['About 1', 'None', 'About 200', 'About 20']
  answer: 3
  explanation: |-
    $\tfrac{2{,}000{,}000}{100{,}000} = 20$. So a match alone, with no other evidence, points to about 21 people, and $P(\text{match} \mid \text{innocent}) = \tfrac{1}{100{,}000}$ is not the probability that a person who matches is innocent. Confusing the two is the prosecutor's fallacy.
- id: a2-m8-r2-h36
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'Of 1,000 people, 50 have a condition. A test is positive for 40 of those 50 and for 95 of the 950 people without it. What is the probability that a person who tests positive has the condition?'
  choices: ['$\tfrac{40}{135} \approx 0.30$', '$\tfrac{40}{50} = 0.80$', '$\tfrac{40}{1000} = 0.04$', '$\tfrac{95}{135} \approx 0.70$']
  answer: 0
  explanation: |-
    All positives: $40 + 95 = 135$. Of those, 40 have the condition: $\tfrac{40}{135} \approx 0.30$. $\tfrac{40}{50}$ is the sensitivity, $\tfrac{40}{1000}$ is $P(\text{condition and positive})$, and $\tfrac{95}{135}$ is the chance a positive is false.
- id: a2-m8-r2-h37
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'After one positive test, a patient''s probability of having a disease is 0.2. A second test has sensitivity 0.9 and false positive rate 0.1, and its result is independent of the first once disease status is known. If the second test is also positive, what is the new probability?'
  choices: ['About 0.90', 'About 0.69', 'About 0.20', 'About 0.18']
  answer: 1
  explanation: |-
    The old posterior, 0.2, is the new prior. $\dfrac{0.2(0.9)}{0.2(0.9) + 0.8(0.1)} = \dfrac{0.18}{0.26} \approx 0.69$. 0.18 is only the numerator (the true-positive path), and 0.90 is the sensitivity.
- id: a2-m8-r2-h38
  lesson: a2-h-bayes
  type: label
  topic: Bayes' theorem
  stem: 'This tree follows 10,000 people through a screening test. Name each numbered group of results.'
  image: {src: images/a2-m8-bayes-tree-blank.svg, alt: 'A tree starting from 10,000 people. 1% (100) have the disease and 99% (9,900) do not. The 100 split into 90 who test positive and 10 who test negative; the 9,900 split into 891 who test positive and 9,009 who test negative. Each of the four final groups has a numbered empty box beside it, from 1 at the top to 4 at the bottom.'}
  labels:
    - {x: 89.2, y: 11.2, text: 'True positive'}
    - {x: 89.2, y: 32.8, text: 'False negative'}
    - {x: 89.2, y: 67.2, text: 'False positive'}
    - {x: 89.2, y: 88.8, text: 'True negative'}
  distractors: ['Prior probability', 'Sensitivity']
  explanation: |-
    "True" or "false" says whether the result is correct; "positive" or "negative" is the result itself. (1) Sick and positive: true positive. (2) Sick but negative: false negative. (3) Healthy but positive: false positive. (4) Healthy and negative: true negative. Prior probability (1%) and sensitivity (90%) are rates on the branches, not groups of people.
- id: a2-m8-r2-h39
  lesson: a2-h-bayes
  type: text
  topic: Bayes' theorem
  stem: 'In the lesson''s tree of 10,000 people, 90 sick people and 891 healthy people test positive. $P(\text{disease} \mid \text{positive})$ is 90 divided by ___. Give only the number.'
  accept: ['981']
  explanation: |-
    The denominator is everyone who tested positive: $90 + 891 = 981$. Using 100 (only the sick people) would give the sensitivity, $P(\text{positive} \mid \text{disease})$, instead.
- id: a2-m8-r2-h40
  lesson: a2-h-bayes
  type: match
  topic: Bayes' theorem
  stem: 'Match each term to its meaning for a medical test.'
  pairs:
    - ['Prevalence', 'Fraction of the population that has the disease']
    - ['Sensitivity', 'Fraction of sick people who test positive']
    - ['Specificity', 'Fraction of healthy people who test negative']
    - ['Posterior probability', 'Chance of disease after seeing the test result']
  distractors: ['Fraction of healthy people who test positive']
  explanation: |-
    Prevalence is the prior, before any test. Sensitivity and specificity describe the test on sick and on healthy people. The posterior is the updated probability that Bayes' theorem gives. The fraction of healthy people who test positive is the false positive rate, $1 - \text{specificity}$.
- id: a2-m8-r2-h41
  lesson: a2-h-bayes
  type: order
  topic: Bayes' theorem
  stem: 'Put the steps for finding $P(\text{disease} \mid \text{positive})$ with natural frequencies in order.'
  items:
    - 'Imagine a large group, such as 10,000 people'
    - 'Use the prevalence to split the group into sick and healthy'
    - 'Use the sensitivity and the false positive rate to count the positives in each part'
    - 'Add the two counts of positives'
    - 'Divide the true positives by all the positives'
  explanation: |-
    Each step needs the one before: you can't split a group you haven't imagined, count positives in parts you haven't formed, or divide by a total you haven't added up.
- id: a2-m8-r2-h42
  lesson: a2-h-bayes
  topic: Bayes' theorem
  stem: 'Which statements are true? Select all that apply.'
  choices:
    - '$P(A \mid B)$ and $P(B \mid A)$ are usually different numbers.'
    - 'For a rare disease, most positive results from a fairly accurate test can be false positives.'
    - 'If a test is 90% sensitive, a positive result means a 90% chance of disease.'
    - 'The denominator in Bayes'' theorem includes every path that leads to the evidence.'
  answer: [0, 1, 3]
  explanation: |-
    The two conditionals have different denominators, so they usually differ. With a rare disease the healthy group is so large that its few errors outnumber the true positives (891 to 90 in the lesson). Sensitivity is $P(+ \mid \text{disease})$, not $P(\text{disease} \mid +)$; confusing them is the base rate fallacy. The denominator $P(D)$ comes from the law of total probability, adding every path to the evidence.
