# Probability and statistics
- id: a2-q-2201
  lesson: a2-counting
  module_quiz: true
  topic: Counting principle
  stem: 'A diner offers 4 appetizers, 6 entrées and 3 desserts. How many meals of one appetizer, one entrée and one dessert are possible?'
  choices: ['$13$', '$72$', '$36$', '$216$']
  answer: 1
  explanation: |-
    By the fundamental counting principle, multiply the options at each step: $4 \cdot 6 \cdot 3 = 72$. Adding ($4 + 6 + 3 = 13$) counts single choices, not complete meals.
- id: a2-q-2202
  lesson: a2-counting
  topic: Counting principle
  stem: 'Evaluate $\dfrac{7!}{5!}$.'
  choices: ['$2$', '$5040$', '$\tfrac75$', '$42$']
  answer: 3
  explanation: |-
    Cancel instead of multiplying out: $\dfrac{7!}{5!} = \dfrac{7 \cdot 6 \cdot 5!}{5!} = 7 \cdot 6 = 42$. The answer 2 comes from treating it as $(7 - 5)!$; 5040 is $7!$ alone.
- id: a2-q-2203
  lesson: a2-counting
  module_quiz: true
  topic: Permutations and combinations
  stem: 'Which situation should be counted with a permutation rather than a combination?'
  choices: ['Awarding first, second and third prizes to 3 of 20 entries', 'Choosing 4 toppings from 12 for a pizza', 'Dealing a 5-card hand from a deck', 'Picking 3 of 20 students to help at an event']
  answer: 0
  explanation: |-
    Order matters only when the positions are different. First, second and third prizes are distinct, so swapping two winners gives a new outcome: a permutation. Toppings, card hands and a helper group are unordered selections: combinations.
- id: a2-q-2204
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'Eight swimmers are in a final. In how many ways can the gold, silver and bronze medals be awarded (no ties)?'
  choices: ['$56$', '$512$', '$336$', '$24$']
  answer: 2
  explanation: |-
    The medals differ, so order matters: $_8P_3 = 8 \cdot 7 \cdot 6 = 336$. $_8C_3 = 56$ ignores order; $8^3 = 512$ lets one swimmer win several medals.
- id: a2-q-2205
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'A pizzeria offers 12 toppings. How many different 4-topping pizzas (four different toppings) can be made?'
  choices: ['$11{,}880$', '$48$', '$495$', '$20{,}736$']
  answer: 2
  explanation: |-
    Order of toppings doesn't matter: $_{12}C_4 = \dfrac{12 \cdot 11 \cdot 10 \cdot 9}{4 \cdot 3 \cdot 2 \cdot 1} = 495$. $11{,}880 = {}_{12}P_4$ counts each pizza $4! = 24$ times; $12^4 = 20{,}736$ allows repeats.
- id: a2-q-2206
  lesson: a2-counting
  module_quiz: true
  topic: Counting principle
  stem: 'A phone PIN is 4 digits (0–9), and digits may repeat. How many PINs are possible?'
  choices: ['$10{,}000$', '$5040$', '$210$', '$40$']
  answer: 0
  explanation: |-
    Each of the 4 positions has 10 options, repeats allowed: $10^4 = 10{,}000$. $5040 = {}_{10}P_4$ forbids repeats; 210 is $_{10}C_4$.
- id: a2-q-2207
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'How many distinguishable arrangements are there of the letters in LEVEL?'
  choices: ['$120$', '$60$', '$15$', '$30$']
  answer: 3
  explanation: |-
    Five letters with two E's and two L's: $\dfrac{5!}{2!\,2!} = \dfrac{120}{4} = 30$. Dividing by only one $2!$ gives 60; 120 treats all letters as different.
- id: a2-q-2208
  lesson: a2-counting
  module_quiz: true
  topic: Permutations and combinations
  stem: 'A committee is formed with 2 of 5 teachers and 3 of 7 students. How many committees are possible?'
  choices: ['$45$', '$350$', '$792$', '$4200$']
  answer: 1
  explanation: |-
    Choose the teachers ($_5C_2 = 10$) and then the students ($_7C_3 = 35$), and multiply: $10 \cdot 35 = 350$. Adding gives 45; $_{12}C_5 = 792$ ignores the 2-and-3 requirement; 4200 uses permutations ($20 \cdot 210$).
- id: a2-q-2209
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'Evaluate $_{20}C_{18}$.'
  choices: ['$190$', '$380$', '$20$', '$36$']
  answer: 0
  explanation: |-
    Choosing 18 to take is the same as choosing 2 to leave out: $_{20}C_{18} = {}_{20}C_2 = \dfrac{20 \cdot 19}{2} = 190$. 380 is $_{20}P_2$ (forgot to divide by $2!$).
- id: a2-q-2210
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'A student counts the 3-person committees that can be formed from 9 people as $9 \cdot 8 \cdot 7 = 504$. What is wrong?'
  choices: ['Repeats were not allowed; the answer is $9^3 = 729$', 'Nothing; $504$ is correct', 'Each committee was counted $3! = 6$ times; the answer is $84$', 'The factors should be added; the answer is $24$']
  answer: 2
  explanation: |-
    $9 \cdot 8 \cdot 7$ counts ordered selections (permutations). A committee has no order, so each group of 3 was listed in all $3! = 6$ orders: $504 / 6 = 84 = {}_9C_3$.
- id: a2-q-2211
  lesson: a2-counting
  topic: Counting principle
  stem: 'Six friends sit in a row of 6 seats, and two of them, Ana and Ben, insist on sitting next to each other. How many seatings are possible?'
  choices: ['$120$', '$240$', '$720$', '$48$']
  answer: 1
  explanation: |-
    Glue Ana and Ben into one block. Then 5 units (the block and 4 others) can be ordered in $5! = 120$ ways, and inside the block Ana and Ben can sit in 2 orders: $120 \cdot 2 = 240$. 120 forgets the 2 orders; 720 ignores the condition.
- id: a2-q-2212
  lesson: a2-counting
  topic: Permutations and combinations
  stem: 'Why does $_{10}C_3$ equal $\dfrac{_{10}P_3}{3!}$?'
  choices: ['There are $3!$ ways to choose which 3 objects to leave out', 'Permutations allow repetition, and $3!$ removes the repeats', 'Combinations are always $6$ times larger than permutations', 'Each group of 3 appears in $3!$ different orders among the permutations']
  answer: 3
  explanation: |-
    $_{10}P_3$ lists ordered selections. Any one group of 3 people can be ordered in $3! = 6$ ways, so it appears 6 times in that list. Dividing by $3!$ counts each group once.
- id: a2-q-2301
  lesson: a2-probability
  topic: Probability rules
  stem: 'Two fair dice are rolled. What is the probability that the sum is 8?'
  choices: ['$\tfrac{1}{11}$', '$\tfrac{5}{36}$', '$\tfrac16$', '$\tfrac29$']
  answer: 1
  explanation: |-
    There are $6 \cdot 6 = 36$ equally likely outcomes, and 5 give a sum of 8: $(2,6), (3,5), (4,4), (5,3), (6,2)$. So $P = \tfrac{5}{36}$. The 11 possible sums are not equally likely, so $\tfrac{1}{11}$ is wrong.
- id: a2-q-2302
  lesson: a2-probability
  module_quiz: true
  topic: Probability rules
  stem: 'A fair coin is flipped 4 times. What is the probability of getting at least one head?'
  choices: ['$\tfrac12$', '$\tfrac14$', '$\tfrac{1}{16}$', '$\tfrac{15}{16}$']
  answer: 3
  explanation: |-
    Use the complement. "No heads" is the single outcome TTTT, with probability $\left(\tfrac12\right)^4 = \tfrac{1}{16}$. So $P(\text{at least one head}) = 1 - \tfrac{1}{16} = \tfrac{15}{16}$.
- id: a2-q-2303
  lesson: a2-probability
  module_quiz: true
  topic: Probability rules
  stem: 'For events $A$ and $B$, $P(A) = 0.5$, $P(B) = 0.4$ and $P(A \text{ and } B) = 0.2$. Find $P(A \text{ or } B)$.'
  choices: ['$0.7$', '$0.9$', '$0.2$', '$0.5$']
  answer: 0
  explanation: |-
    Addition rule: $P(A \text{ or } B) = 0.5 + 0.4 - 0.2 = 0.7$. Just adding gives 0.9, which counts the overlap twice.
- id: a2-q-2304
  lesson: a2-probability
  topic: Probability rules
  stem: 'One card is drawn from a standard 52-card deck. What is the probability it is a king or a club?'
  choices: ['$\tfrac{17}{52}$', '$\tfrac14$', '$\tfrac{4}{13}$', '$\tfrac{1}{52}$']
  answer: 2
  explanation: |-
    $P = \tfrac{4}{52} + \tfrac{13}{52} - \tfrac{1}{52} = \tfrac{16}{52} = \tfrac{4}{13}$. The king of clubs is in both groups, so subtract it once; forgetting gives $\tfrac{17}{52}$.
- id: a2-q-2305
  lesson: a2-probability
  topic: Probability rules
  stem: 'One card is drawn from a standard deck. Which pair of events is mutually exclusive?'
  choices: ['"The card is a heart" and "the card is a king"', '"The card is red" and "the card is a heart"', '"The card is a heart" and "the card is a spade"', '"The card is a face card" and "the card is a queen"']
  answer: 2
  explanation: |-
    Mutually exclusive events can't happen together. No card is both a heart and a spade. The other pairs overlap: the king of hearts, any heart (which is red), and any queen (which is a face card).
- id: a2-q-2306
  lesson: a2-probability
  module_quiz: true
  topic: Conditional probability
  stem: |-
    A café surveyed 120 customers:

    $$\begin{array}{l|cc|c} & \text{Coffee} & \text{Tea} & \text{Total} \\ \hline \text{Under 30} & 20 & 30 & 50 \\ \text{30 and over} & 55 & 15 & 70 \\ \hline \text{Total} & 75 & 45 & 120 \end{array}$$

    Find $P(\text{tea} \mid \text{under 30})$.
  choices: ['$\tfrac35$', '$\tfrac23$', '$\tfrac14$', '$\tfrac38$']
  answer: 0
  explanation: |-
    The condition "under 30" limits you to that row: 30 of its 50 people drink tea, so $\tfrac{30}{50} = \tfrac35$. $\tfrac23 = \tfrac{30}{45}$ is $P(\text{under 30} \mid \text{tea})$, the reverse; $\tfrac14 = \tfrac{30}{120}$ is $P(\text{tea and under 30})$.
- id: a2-q-2307
  lesson: a2-probability
  topic: Conditional probability
  stem: |-
    A café surveyed 120 customers:

    $$\begin{array}{l|cc|c} & \text{Coffee} & \text{Tea} & \text{Total} \\ \hline \text{Under 30} & 20 & 30 & 50 \\ \text{30 and over} & 55 & 15 & 70 \\ \hline \text{Total} & 75 & 45 & 120 \end{array}$$

    Are "drinks tea" and "under 30" independent?
  choices: ['Yes, because both events contain 30 people', 'Yes, because the table totals add to 120', 'No, because they are mutually exclusive', 'No, because $P(\text{tea} \mid \text{under 30}) = 0.6$ but $P(\text{tea}) = 0.375$']
  answer: 3
  explanation: |-
    Independent would mean knowing the age group doesn't change the chance of tea. Overall $P(\text{tea}) = \tfrac{45}{120} = 0.375$, but among under-30s it is $\tfrac{30}{50} = 0.6$. They differ, so the events are dependent. They are not mutually exclusive: 30 people are in both.
- id: a2-q-2308
  lesson: a2-probability
  topic: Conditional probability
  stem: 'Events $A$ and $B$ are independent, with $P(A) = 0.3$ and $P(B) = 0.6$. Find $P(A \text{ and } B)$.'
  choices: ['$0.9$', '$0.18$', '$0.72$', '$0.3$']
  answer: 1
  explanation: |-
    For independent events, multiply: $0.3 \cdot 0.6 = 0.18$. Adding gives 0.9; 0.72 is $P(A \text{ or } B) = 0.9 - 0.18$.
- id: a2-q-2309
  lesson: a2-probability
  module_quiz: true
  topic: Conditional probability
  stem: 'Two cards are drawn from a standard deck without replacement. What is the probability both are aces?'
  choices: ['$\tfrac{1}{221}$', '$\tfrac{1}{169}$', '$\tfrac{2}{13}$', '$\tfrac{1}{2652}$']
  answer: 0
  explanation: |-
    First ace: $\tfrac{4}{52}$. Given that, 3 aces remain among 51 cards: $\tfrac{3}{51}$. Multiply: $\tfrac{4}{52} \cdot \tfrac{3}{51} = \tfrac{12}{2652} = \tfrac{1}{221}$. $\tfrac{1}{169} = \left(\tfrac{4}{52}\right)^2$ treats the draws as independent (with replacement).
- id: a2-q-2310
  lesson: a2-probability
  topic: Conditional probability
  stem: 'If $P(A) = 0.4$ and $P(A \text{ and } B) = 0.1$, what is $P(B \mid A)$?'
  choices: ['$0.04$', '$0.5$', '$0.25$', '$0.3$']
  answer: 2
  explanation: |-
    $P(B \mid A) = \dfrac{P(A \text{ and } B)}{P(A)} = \dfrac{0.1}{0.4} = 0.25$. Multiplying instead of dividing gives 0.04.
- id: a2-q-2311
  lesson: a2-probability
  module_quiz: true
  topic: Probability rules
  stem: 'A box has 10 light bulbs, 4 of them defective. Three are chosen at random. What is the probability that none of the three is defective?'
  choices: ['$\tfrac{27}{125}$', '$\tfrac16$', '$\tfrac35$', '$\tfrac{1}{20}$']
  answer: 1
  explanation: |-
    Count combinations: there are $_{10}C_3 = 120$ ways to choose 3 bulbs and $_6C_3 = 20$ ways to choose 3 good ones, so $P = \tfrac{20}{120} = \tfrac16$. (Tree check: $\tfrac{6}{10} \cdot \tfrac59 \cdot \tfrac48 = \tfrac16$.) $\left(\tfrac35\right)^3 = \tfrac{27}{125}$ wrongly treats the picks as independent.
- id: a2-q-2312
  lesson: a2-probability
  topic: Probability rules
  stem: 'Events $A$ and $B$ are mutually exclusive, with $P(A) = 0.3$ and $P(B) = 0.4$. Which statement is true?'
  choices: ['$P(A \text{ and } B) = 0.12$', '$A$ and $B$ are independent', '$P(A \text{ or } B) = 0.58$', '$P(A \text{ or } B) = 0.7$']
  answer: 3
  explanation: |-
    Mutually exclusive means $P(A \text{ and } B) = 0$, so $P(A \text{ or } B) = 0.3 + 0.4 = 0.7$. They are not independent: if $A$ happens, $B$ can't, so $P(B \mid A) = 0 \ne 0.4$. The values 0.12 and 0.58 come from wrongly multiplying.
- id: a2-q-2401
  lesson: a2-normal
  topic: Normal distribution
  stem: 'Find the (population) standard deviation of $2, 4, 6, 8, 10$.'
  choices: ['$8$', '$\sqrt8 \approx 2.83$', '$\sqrt{10} \approx 3.16$', '$6$']
  answer: 1
  explanation: |-
    Mean $\mu = 6$. Squared deviations: $16, 4, 0, 4, 16$, total 40. Divide by $n = 5$: variance 8, so $\sigma = \sqrt8 \approx 2.83$. 8 is the variance (forgot the square root); $\sqrt{10}$ divides by $n - 1$, the sample SD; 6 is the mean.
- id: a2-q-2402
  lesson: a2-normal
  module_quiz: true
  topic: Normal distribution
  stem: 'IQ scores are approximately normal with mean 100 and standard deviation 15. About what percent of scores are between 70 and 130?'
  choices: ['$68\%$', '$99.7\%$', '$47.5\%$', '$95\%$']
  answer: 3
  explanation: |-
    $70 = 100 - 2(15)$ and $130 = 100 + 2(15)$: within 2 standard deviations, about 95% by the 68–95–99.7 rule.
- id: a2-q-2403
  lesson: a2-normal
  topic: Normal distribution
  stem: 'IQ scores are approximately normal with mean 100 and standard deviation 15. About what percent of scores are above 115?'
  choices: ['$16\%$', '$34\%$', '$32\%$', '$84\%$']
  answer: 0
  explanation: |-
    $115 = \mu + \sigma$. Half the scores are above the mean and 34% lie between $\mu$ and $\mu + \sigma$, so $50\% - 34\% = 16\%$ are above 115. 84% is the share below 115.
- id: a2-q-2404
  lesson: a2-normal
  topic: Normal distribution
  stem: 'IQ scores are approximately normal with mean 100 and standard deviation 15. About what percent of scores are between 85 and 130?'
  choices: ['$95\%$', '$68\%$', '$81.5\%$', '$47.5\%$']
  answer: 2
  explanation: |-
    $85 = \mu - \sigma$ and $130 = \mu + 2\sigma$. Add the pieces: $34\% + 34\% + 13.5\% = 81.5\%$.
- id: a2-q-2405
  lesson: a2-normal
  module_quiz: true
  topic: Normal distribution
  stem: 'A distribution has mean 50 and standard deviation 8. What is the z-score of $x = 62$?'
  choices: ['$12$', '$-1.5$', '$1.5$', '$0.67$']
  answer: 2
  explanation: |-
    $z = \dfrac{x - \mu}{\sigma} = \dfrac{62 - 50}{8} = 1.5$: 62 is 1.5 standard deviations above the mean. 12 forgets to divide by $\sigma$; $-1.5$ subtracts in the wrong order.
- id: a2-q-2406
  lesson: a2-normal
  topic: Normal distribution
  stem: 'Which test score is the best performance relative to its class?'
  choices: ['85 on a test with mean 75 and SD 5', '90 on a test with mean 84 and SD 4', '70 on a test with mean 60 and SD 8', '95 on a test with mean 90 and SD 10']
  answer: 0
  explanation: |-
    Compare z-scores: $\tfrac{85 - 75}{5} = 2$, $\tfrac{90 - 84}{4} = 1.5$, $\tfrac{70 - 60}{8} = 1.25$, $\tfrac{95 - 90}{10} = 0.5$. The 85 is the most standard deviations above its mean.
- id: a2-q-2407
  lesson: a2-normal
  topic: Normal distribution
  stem: 'SAT section scores are approximately normal with mean 500 and standard deviation 100. Find the probability that a score is below 650.'
  choices: ['$0.0668$', '$0.4332$', '$0.8664$', '$0.9332$']
  answer: 3
  explanation: |-
    $z = \dfrac{650 - 500}{100} = 1.5$. The area to the left of $z = 1.5$ is $0.9332$ (or normalcdf(-1E99, 650, 500, 100) on a calculator). $0.0668$ is the area to the right; $0.4332$ is only the part between the mean and 650.
- id: a2-q-2408
  lesson: a2-normal
  module_quiz: true
  topic: Normal distribution
  stem: 'Battery lifetimes are normal with mean 40 hours and standard deviation 5 hours. What is the probability a battery lasts more than 47 hours?'
  choices: ['$0.9192$', '$0.0808$', '$0.4192$', '$0.16$']
  answer: 1
  explanation: |-
    $z = \dfrac{47 - 40}{5} = 1.4$. The area left of $z = 1.4$ is $0.9192$, so the area to the right is $1 - 0.9192 = 0.0808$. Reporting $0.9192$ answers "less than 47".
- id: a2-q-2409
  lesson: a2-normal
  topic: Normal distribution
  stem: 'Which statement about every normal curve is true?'
  choices: ['The total area under the curve is 1', 'The curve touches the $x$-axis at $\mu \pm 3\sigma$', 'A larger standard deviation makes the curve taller and narrower', 'About 68% of values are more than one standard deviation from the mean']
  answer: 0
  explanation: |-
    Probabilities are areas, and the total probability is 1. The curve never touches the axis (it only gets very close), a larger $\sigma$ makes it shorter and wider, and 68% of values are within one standard deviation.
- id: a2-q-2410
  lesson: a2-normal
  module_quiz: true
  topic: Sampling and surveys
  stem: 'A school with 640 seniors randomly selects 80 seniors and asks them about prom. In this survey, the 640 seniors are the'
  choices: ['sample', 'statistic', 'population', 'margin of error']
  answer: 2
  explanation: |-
    The population is the whole group you want to learn about: all 640 seniors. The 80 who were asked are the sample, and a number computed from their answers is a statistic.
- id: a2-q-2411
  lesson: a2-normal
  topic: Sampling and surveys
  stem: 'A random sample of 400 people is surveyed. Using margin of error $\approx \dfrac{1}{\sqrt n}$, about how large is the margin of error?'
  choices: ['$\pm 2.5\%$', '$\pm 5\%$', '$\pm 0.25\%$', '$\pm 20\%$']
  answer: 1
  explanation: |-
    $\dfrac{1}{\sqrt{400}} = \dfrac{1}{20} = 0.05 = 5\%$. $\pm 0.25\%$ comes from $\tfrac{1}{400}$ without the square root; 20 is $\sqrt{400}$ itself.
- id: a2-q-2412
  lesson: a2-normal
  module_quiz: true
  topic: Sampling and surveys
  stem: 'A principal wants to estimate the average nightly sleep of the school''s 1,500 students. Which plan is least likely to be biased?'
  choices: ['Ask the first 100 students who arrive at 7 a.m.', 'Post an online poll and use whoever responds', 'Survey the 100 students on sports teams', 'Randomly select 100 students from the full school roster']
  answer: 3
  explanation: |-
    A simple random sample from the whole roster gives every student the same chance to be picked. Early arrivals, volunteers and athletes are groups whose sleep habits may differ systematically from everyone else's: those plans are biased.
- id: a2-q-2413
  lesson: a2-normal
  topic: Sampling and surveys
  stem: 'A poll of 1,000 voters has a margin of error of about 3%. To cut the margin of error to about 1.5%, roughly how many voters are needed?'
  choices: ['$2000$', '$1500$', '$4000$', '$1{,}000{,}000$']
  answer: 2
  explanation: |-
    The margin of error is about $\dfrac{1}{\sqrt n}$. Halving it means doubling $\sqrt n$, which means multiplying $n$ by 4: about $4000$ voters. Doubling $n$ only shrinks the margin by a factor of $\sqrt2$.
