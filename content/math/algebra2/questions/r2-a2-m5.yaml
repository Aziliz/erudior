# Round 2 questions for a2-m5: core lessons 15-19 (q) and honors lessons 19h1, 19h2 (h)

# 15 Simplifying, multiplying, and dividing rational expressions
- id: a2-m5-r2-q01
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  type: text
  stem: 'The values excluded from the domain of $\dfrac{x + 1}{x^2 - 7x + 10}$ are $x =$ ___ and $x =$ ___ (smaller one first).'
  accept:
    - ['2']
    - ['5']
  explanation: |-
    The denominator factors as $(x - 2)(x - 5)$, which is 0 at $x = 2$ and $x = 5$. The numerator's zero, $x = -1$, is allowed: there the expression is $\tfrac{0}{18} = 0$, a perfectly good value.
- id: a2-m5-r2-q02
  lesson: alg-rational-simplify
  topic: Rational expressions
  type: text
  stem: 'For $x \ne 3$, the expression $\dfrac{6 - 2x}{x - 3}$ simplifies to the constant ___.'
  accept: ['-2']
  explanation: |-
    $6 - 2x = -2(x - 3)$, so $\dfrac{-2(x - 3)}{x - 3} = -2$. The minus sign comes from the opposite factors $3 - x$ and $x - 3$.
- id: a2-m5-r2-q03
  lesson: alg-rational-simplify
  topic: Rational expressions
  type: match
  stem: 'Match each expression to its simplified form (for the values of $x$ where the expression is defined).'
  pairs:
    - ['$\dfrac{x^2 - 4}{x + 2}$', 'x − 2']
    - ['$\dfrac{2 - x}{x - 2}$', '−1']
    - ['$\dfrac{x^2 + 2x}{x}$', 'x + 2']
    - ['$\dfrac{x + 2}{x^2 + 4x + 4}$', '1/(x + 2)']
  distractors: ['x', '1']
  explanation: |-
    $\dfrac{(x - 2)(x + 2)}{x + 2} = x - 2$. $2 - x = -(x - 2)$, so the second is $-1$. $\dfrac{x(x + 2)}{x} = x + 2$. $\dfrac{x + 2}{(x + 2)^2} = \dfrac{1}{x + 2}$.
- id: a2-m5-r2-q04
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Which expressions can be simplified by cancelling a common factor? Select all that apply.'
  choices: ['$\dfrac{x^2 - 9}{x + 3}$', '$\dfrac{x + 9}{x + 3}$', '$\dfrac{4x + 8}{6}$', '$\dfrac{x^2 + 1}{x + 1}$']
  answer: [0, 2]
  explanation: |-
    $x^2 - 9 = (x - 3)(x + 3)$ shares the factor $x + 3$, leaving $x - 3$. $4x + 8 = 4(x + 2)$ and 6 share the factor 2, leaving $\dfrac{2(x + 2)}{3}$. In $\dfrac{x + 9}{x + 3}$ the 9 and the 3 are terms, not factors. $x^2 + 1$ is 2 (not 0) at $x = -1$, so $x + 1$ is not a factor of it.
- id: a2-m5-r2-q05
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'A student says $\dfrac{x^2 + 5x + 6}{x^2 + 3x}$ and $\dfrac{x + 2}{x}$ are equal. Which statement is accurate?'
  choices: ['They agree everywhere except $x = -3$, where only $\dfrac{x + 2}{x}$ has a value', 'They agree for every real number $x$', 'They never agree, because terms were cancelled', 'They agree everywhere except $x = -2$, where only the original is 0']
  answer: 0
  explanation: |-
    Factor: $\dfrac{(x + 2)(x + 3)}{x(x + 3)}$. Cancelling the common factor $x + 3$ is legal, so the two agree wherever both are defined. At $x = 0$ neither has a value. At $x = -3$ the original is $\tfrac00$, undefined, while $\dfrac{x + 2}{x} = \tfrac13$, so the simplified form needs the restriction $x \ne -3$. At $x = -2$ both equal 0.

# 16 Adding and subtracting rational expressions; complex fractions
- id: a2-m5-r2-q06
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  type: text
  stem: 'Write $\dfrac{3}{x - 1} - \dfrac{3}{x + 1}$ as one fraction with denominator $x^2 - 1$. The numerator is ___.'
  accept: ['6']
  explanation: |-
    The LCD is $(x - 1)(x + 1) = x^2 - 1$. The numerator is $3(x + 1) - 3(x - 1) = 3x + 3 - 3x + 3 = 6$, so the difference is $\dfrac{6}{x^2 - 1}$. Forgetting to distribute the minus sign gives $3x + 3 - 3x - 3 = 0$.
- id: a2-m5-r2-q07
  lesson: alg-rational-add
  topic: Rational expressions
  type: order
  stem: 'Put the steps for adding $\dfrac{2}{x^2 - x} + \dfrac{3}{x^2 - 1}$ in order.'
  items:
    - 'Factor each denominator: $x(x - 1)$ and $(x - 1)(x + 1)$'
    - 'Build the LCD $x(x - 1)(x + 1)$'
    - 'Rewrite each fraction over the LCD'
    - 'Add the numerators: $2(x + 1) + 3x = 5x + 2$'
    - 'Check the numerator for a factor to cancel (none here)'
  explanation: |-
    The LCD can't be built until the denominators are factored, the fractions can't be rewritten until the LCD is known, and the numerators can only be added once they share a denominator. Simplifying comes last: $\dfrac{5x + 2}{x(x - 1)(x + 1)}$ has nothing to cancel.
- id: a2-m5-r2-q08
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  stem: 'Which of these are common denominators (not necessarily the least) for $\dfrac{1}{x^2 - 4}$ and $\dfrac{1}{x + 2}$? Select all that apply.'
  choices: ['$(x - 2)(x + 2)$', '$(x - 2)(x + 2)^2$', '$x + 2$', '$(x + 2)(x - 1)$']
  answer: [0, 1]
  explanation: |-
    A common denominator must be a multiple of both $x^2 - 4 = (x - 2)(x + 2)$ and $x + 2$. $(x - 2)(x + 2)$ is the least one; $(x - 2)(x + 2)^2$ also works, with an extra factor to cancel at the end. $x + 2$ is missing the factor $x - 2$, and $(x + 2)(x - 1)$ has $x - 1$ where $x - 2$ is needed.
- id: a2-m5-r2-q09
  lesson: alg-rational-add
  topic: Complex fractions
  stem: 'Simplify $\dfrac{\dfrac{1}{x} - \dfrac{1}{3}}{x - 3}$.'
  choices: ['$\dfrac{1}{3x}$', '$-\dfrac{1}{3x}$', '$\dfrac{x - 3}{3x}$', '$-3x$']
  answer: 1
  explanation: |-
    Multiply the top and bottom by $3x$: the top becomes $3 - x$ and the bottom $3x(x - 3)$. Since $3 - x = -(x - 3)$, the result is $-\dfrac{1}{3x}$ (for $x \ne 0, 3$). Missing the opposite factors gives $\dfrac{1}{3x}$, and $\dfrac{x - 3}{3x}$ comes from simplifying only the top and forgetting to divide by $x - 3$.
- id: a2-m5-r2-q10
  lesson: alg-rational-add
  topic: Rational expressions
  type: match
  stem: 'Match each sum or difference to its simplified result.'
  pairs:
    - ['$\dfrac{1}{x} + \dfrac{1}{y}$', '(x + y)/(xy)']
    - ['$\dfrac{2}{x} - \dfrac{1}{2x}$', '3/(2x)']
    - ['$\dfrac{x}{x - 1} - \dfrac{1}{x - 1}$', '1']
    - ['$\dfrac{1}{x - 2} + \dfrac{1}{2 - x}$', '0']
  distractors: ['2/(x + y)', '1/x']
  explanation: |-
    $\dfrac1x + \dfrac1y = \dfrac{y + x}{xy}$ (adding the denominators to get $\dfrac{2}{x + y}$ is the classic mistake). $\dfrac{4}{2x} - \dfrac{1}{2x} = \dfrac{3}{2x}$. $\dfrac{x - 1}{x - 1} = 1$ for $x \ne 1$. $\dfrac{1}{2 - x} = -\dfrac{1}{x - 2}$, so the last sum is 0 for $x \ne 2$.

# 17 Rational equations and applications
- id: a2-m5-r2-q11
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  type: text
  stem: 'Solve $\dfrac{6}{x} - \dfrac{1}{2} = \dfrac{2}{x}$. Give only the number: $x =$ ___'
  accept: ['8']
  explanation: |-
    The excluded value is $x = 0$ and the LCD is $2x$. Multiply every term by $2x$: $12 - x = 4$, so $x = 8$. Check: $\tfrac68 - \tfrac12 = \tfrac14$ and $\tfrac28 = \tfrac14$.
- id: a2-m5-r2-q12
  lesson: alg-rational-eq
  topic: Rational equations
  type: order
  stem: 'Put the steps for solving a rational equation in order.'
  items:
    - 'Factor the denominators and list the excluded values'
    - 'Multiply every term on both sides by the LCD'
    - 'Solve the polynomial equation that results'
    - 'Reject any solution that is an excluded value, and check the rest'
  explanation: |-
    Factoring gives both the excluded values and the LCD. Multiplying by the LCD clears the fractions, leaving a polynomial equation to solve. Only then are there solutions to screen: any that make an original denominator 0 are extraneous.
- id: a2-m5-r2-q13
  lesson: alg-rational-eq
  topic: Work and rate
  type: match
  stem: 'Match each situation to the equation that models it.'
  pairs:
    - ['Two pipes fill a tank alone in 3 h and in 6 h; together they take $T$ hours', '1/3 + 1/6 = 1/T']
    - ['A boat goes 30 km downstream and 18 km upstream in equal times; the current is 4 km/h and the boat''s still-water speed is $b$', '30/(b + 4) = 18/(b − 4)']
    - ['3 cups of flour make 24 cookies, and $f$ cups make 40 cookies', '3/24 = f/40']
  distractors: ['3 + 6 = T', '30/(b − 4) = 18/(b + 4)']
  explanation: |-
    Work: the rates $\tfrac13$ and $\tfrac16$ tank per hour add to $\tfrac1T$ (adding the times is the common mistake). Motion: time is distance over speed, and the current helps downstream, so the downstream time is $\dfrac{30}{b + 4}$. Recipe: flour per cookie is the same in both batches, a proportion.
- id: a2-m5-r2-q14
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  stem: 'Which statements about the equation $\dfrac{x}{x - 2} = \dfrac{2}{x - 2} + x$ are true? Select all that apply.'
  choices: ['Multiplying every term by $x - 2$ and rearranging gives $x^2 - 3x + 2 = 0$', '$x = 2$ is an extraneous solution', '$x = 1$ is a solution', 'The equation has no solution']
  answer: [0, 1, 2]
  explanation: |-
    Multiplying by $x - 2$: $x = 2 + x(x - 2)$, so $x = 2 + x^2 - 2x$ and $x^2 - 3x + 2 = 0$, which factors as $(x - 1)(x - 2) = 0$. The value 2 is excluded (it makes both denominators 0), so it is extraneous. $x = 1$ works: the left side is $\tfrac{1}{-1} = -1$ and the right side is $\tfrac{2}{-1} + 1 = -1$. So the equation does have a solution.
- id: a2-m5-r2-q15
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'Working together, two printers finish a job in 2 hours. One printer alone takes 3 hours. How long does the other take alone?'
  choices: ['1 hour', '5 hours', '6 hours', '2.5 hours']
  answer: 2
  explanation: |-
    Rates add: $\dfrac13 + \dfrac1t = \dfrac12$, so $\dfrac1t = \dfrac12 - \dfrac13 = \dfrac16$ and $t = 6$ hours. Subtracting the times ($3 - 2 = 1$) or adding them ($5$) treats times like rates, and 2.5 is their average.

# 18 Graphing rational functions
- id: a2-m5-r2-q16
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Rational functions
  type: label
  stem: 'This is the graph of $f(x) = \dfrac{2x^2 + 4x - 16}{x^2 + 5x + 4}$. Name the numbered features.'
  image: {src: images/a2-m5-rational-features-blank.svg, alt: 'Graph of a rational function with two branches, a dashed vertical line, a dashed horizontal line, an open circle on the left branch, and two solid points where the right branch meets the axes. Five features are numbered.'}
  labels:
    - {x: 47.9, y: 20.6, text: Vertical asymptote}
    - {x: 63.0, y: 42.0, text: Horizontal asymptote}
    - {x: 29.9, y: 31.3, text: Hole}
    - {x: 66.0, y: 52.7, text: x-intercept}
    - {x: 54.0, y: 74.1, text: y-intercept}
  distractors: [Slant asymptote, Vertex]
  explanation: |-
    $f(x) = \dfrac{2(x - 2)(x + 4)}{(x + 1)(x + 4)}$. The cancelled factor $x + 4$ gives the hole (the open circle at $(-4, 4)$). The factor $x + 1$ that remains gives the vertical asymptote $x = -1$. Equal degrees give the horizontal asymptote $y = \tfrac21 = 2$. The graph meets the $x$-axis at $(2, 0)$ and the $y$-axis at $(0, -4)$. A rational function like this has no vertex, and its asymptotes are not slanted.
- id: a2-m5-r2-q17
  lesson: a2-rational-graphs
  topic: Rational functions
  type: text
  stem: 'The horizontal asymptote of $f(x) = \dfrac{6x^2 + 1}{3x^2 - 2x}$ is $y =$ ___. Give only the number.'
  accept: ['2']
  explanation: |-
    The degrees are equal (2 and 2), so the horizontal asymptote is the ratio of the leading coefficients: $y = \tfrac63 = 2$.
- id: a2-m5-r2-q18
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Rational functions
  type: match
  stem: 'Match each function to its horizontal asymptote.'
  pairs:
    - ['$\dfrac{4x - 1}{x^2 + 1}$', 'y = 0']
    - ['$\dfrac{4x^2 - 1}{2x^2 + 1}$', 'y = 2']
    - ['$\dfrac{4x^3}{x^2 + 1}$', 'No horizontal asymptote']
    - ['$\dfrac{5 - x}{3x}$', 'y = −1/3']
  distractors: ['y = 4', 'y = 1/3']
  explanation: |-
    Degree 1 over degree 2: $y = 0$. Equal degrees: $y = \tfrac42 = 2$. Degree 3 over degree 2: no horizontal asymptote. Equal degrees with leading coefficients $-1$ and $3$: $y = -\tfrac13$ (the leading coefficient of $5 - x$ is $-1$, not 5).
- id: a2-m5-r2-q19
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'Which statements about $g(x) = \dfrac{x^2 - 4}{x^2 - x - 2}$ are true? Select all that apply.'
  choices: ['The graph has a hole at $x = 2$', 'The line $x = -1$ is a vertical asymptote', 'The graph crosses the $x$-axis at $x = 2$', 'The horizontal asymptote is $y = 0$']
  answer: [0, 1]
  explanation: |-
    $g(x) = \dfrac{(x - 2)(x + 2)}{(x - 2)(x + 1)}$. The factor $x - 2$ cancels, so there is a hole at $x = 2$ (at height $\tfrac43$), not an intercept. The factor $x + 1$ remains: vertical asymptote $x = -1$. The only $x$-intercept is $x = -2$. Equal degrees give the horizontal asymptote $y = 1$.
- id: a2-m5-r2-q20
  lesson: a2-rational-graphs
  topic: Inverse variation
  type: text
  stem: 'If $y$ varies inversely with $x$, and $y = 9$ when $x = 4$, then $y =$ ___ when $x = 6$.'
  accept: ['6']
  explanation: |-
    Inverse variation keeps the product constant: $k = 4 \cdot 9 = 36$. Then $y = \tfrac{36}{6} = 6$.

# 19 Polynomial and rational inequalities
- id: a2-m5-r2-q21
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  type: text
  stem: 'The solution of $(x - 1)(x - 6) < 0$ is $a < x < b$, where $a =$ ___ and $b =$ ___.'
  accept:
    - ['1']
    - ['6']
  explanation: |-
    The critical values are 1 and 6. Between them one factor is positive and the other negative (test $x = 2$: $(1)(-4) < 0$), and outside them both factors have the same sign. So the product is negative exactly for $1 < x < 6$.
- id: a2-m5-r2-q22
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Rational inequalities
  type: order
  stem: 'Put the steps for solving $\dfrac{x + 4}{x - 2} \ge 3$ in order.'
  items:
    - 'Subtract 3 so the right side is 0'
    - 'Combine into one fraction: $\dfrac{-2x + 10}{x - 2} \ge 0$'
    - 'Find the critical values 5 and 2'
    - 'Test the sign of the fraction on each interval'
    - 'Keep the positive interval, include 5 and exclude 2: $(2, 5]$'
  explanation: |-
    The sign method needs 0 on one side and a single fraction, whose numerator and denominator zeros are the critical values. The signs are tested between them, and the endpoints are decided last: 5 makes the fraction 0 (allowed by $\ge$), and 2 makes it undefined.
- id: a2-m5-r2-q23
  lesson: a2-poly-rational-ineq
  topic: Rational inequalities
  type: match
  stem: 'Match each inequality to its solution.'
  pairs:
    - ['$\dfrac{x - 2}{x + 1} \le 0$', '(−1, 2]']
    - ['$\dfrac{x - 2}{x + 1} \ge 0$', '(−∞, −1) ∪ [2, ∞)']
    - ['$(x - 2)(x + 1) \le 0$', '[−1, 2]']
    - ['$(x - 2)(x + 1) > 0$', '(−∞, −1) ∪ (2, ∞)']
  distractors: ['[−1, 2)', '(−1, 2)']
  explanation: |-
    All four expressions are negative between $-1$ and 2 and positive outside. For the fractions, $-1$ is a zero of the denominator, so it is never included, while 2 is included with $\le$ or $\ge$. For the products, both critical values are zeros, so both are included with $\le$ and neither with $>$.
- id: a2-m5-r2-q24
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Rational inequalities
  stem: 'Which numbers are solutions of $\dfrac{x + 3}{x - 2} \ge 0$? Select all that apply.'
  choices: ['$-3$', '$2$', '$0$', '$5$']
  answer: [0, 3]
  explanation: |-
    The solution is $(-\infty, -3] \cup (2, \infty)$. At $x = -3$ the fraction is 0, which satisfies $\ge 0$. At $x = 2$ it is undefined. At $x = 0$ it is $\tfrac{3}{-2} < 0$. At $x = 5$ it is $\tfrac83 > 0$.
- id: a2-m5-r2-q25
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  stem: 'Solve $(x + 2)^2(x - 3) < 0$.'
  choices: ['$(-2, 3)$', '$(-\infty, 3)$', '$(-\infty, -2) \cup (3, \infty)$', '$(-\infty, -2) \cup (-2, 3)$']
  answer: 3
  explanation: |-
    $(x + 2)^2$ is positive except at $x = -2$, where it is 0, so the product has the sign of $x - 3$ everywhere else: negative for $x < 3$. At $x = -2$ the product is 0, which is not $< 0$, so $-2$ is left out. Assuming the signs alternate at $-2$ leads to $(-2, 3)$; forgetting to remove $-2$ gives $(-\infty, 3)$.

# 19h1 Honors: Slant asymptotes and end behavior
- id: a2-m5-r2-h01
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'What is the slant asymptote of $f(x) = \dfrac{x^2 + 3x + 1}{x + 1}$?'
  choices: ['$y = x + 2$', '$y = x + 3$', '$y = x$', '$y = x + 1$']
  answer: 0
  explanation: |-
    Synthetic division by $x + 1$ (use $-1$) on $1, 3, 1$: bring down 1; $3 + (-1) = 2$; $1 + (-2) = -1$. So $f(x) = x + 2 - \dfrac{1}{x + 1}$, and the slant asymptote is $y = x + 2$. Dividing only the leading terms gives $y = x$, which has the right slope but misses the $+2$.
- id: a2-m5-r2-h02
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Which function has a slant asymptote?'
  choices: ['$\dfrac{x^2 + 1}{x^2 - 1}$', '$\dfrac{2x^2 - 5}{x + 3}$', '$\dfrac{x^3 - 1}{x - 2}$', '$\dfrac{x + 4}{x^2 + 1}$']
  answer: 1
  explanation: |-
    A slant asymptote needs the top degree to be exactly one more than the bottom degree: only $\dfrac{2x^2 - 5}{x + 3}$ (degrees 2 and 1). Equal degrees give a horizontal asymptote ($y = 1$), a top degree two more gives a parabola-shaped end behavior, and a smaller top degree gives $y = 0$.
- id: a2-m5-r2-h03
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  type: text
  stem: 'The slant asymptote of $f(x) = \dfrac{3x^2 + 2x - 1}{x - 1}$ is $y = 3x + b$, where $b =$ ___.'
  accept: ['5']
  explanation: |-
    Synthetic division by $x - 1$ on $3, 2, -1$: bring down 3; $2 + 3 = 5$; $-1 + 5 = 4$. So $f(x) = 3x + 5 + \dfrac{4}{x - 1}$ and the slant asymptote is $y = 3x + 5$.
- id: a2-m5-r2-h04
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  type: text
  stem: 'The graph of $f(x) = \dfrac{3x^2 + 2x - 1}{x^2 + 1}$ crosses its horizontal asymptote at $x =$ ___. Give only the number.'
  accept: ['2']
  explanation: |-
    Equal degrees: the horizontal asymptote is $y = 3$. Set $f(x) = 3$: $3x^2 + 2x - 1 = 3x^2 + 3$, so $2x = 4$ and $x = 2$. Check: $f(2) = \tfrac{12 + 4 - 1}{5} = 3$.
- id: a2-m5-r2-h05
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Which statements about $f(x) = \dfrac{x^2 + x - 6}{x + 1}$ are true? Select all that apply.'
  choices: ['Its slant asymptote is $y = x$', 'For $x > -1$ the graph is above its slant asymptote', 'The line $x = -1$ is a vertical asymptote', 'It has a horizontal asymptote']
  answer: [0, 2]
  explanation: |-
    $x^2 + x - 6 = x(x + 1) - 6$, so $f(x) = x - \dfrac{6}{x + 1}$: slant asymptote $y = x$. For $x > -1$ the piece $-\dfrac{6}{x + 1}$ is negative, so the graph is below the line there, not above. The numerator at $x = -1$ is $-6 \ne 0$, so $x = -1$ is a vertical asymptote. A function with a slant asymptote has no horizontal one.
- id: a2-m5-r2-h06
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  type: match
  stem: 'Match each function to its end behavior.'
  pairs:
    - ['$\dfrac{x^2 + 1}{x^2 - 4}$', 'Horizontal asymptote y = 1']
    - ['$\dfrac{x^2 + 1}{x - 2}$', 'Slant asymptote y = x + 2']
    - ['$\dfrac{x^3 + 1}{x}$', 'Follows the parabola y = x²']
    - ['$\dfrac{x + 1}{x^2 - 4}$', 'Horizontal asymptote y = 0']
  distractors: ['Slant asymptote y = x − 2', 'Horizontal asymptote y = 2']
  explanation: |-
    Equal degrees: $y = \tfrac11 = 1$. Dividing, $x^2 + 1 = (x + 2)(x - 2) + 5$, so the second has slant asymptote $y = x + 2$ (not $y = x - 2$, the denominator). $\dfrac{x^3 + 1}{x} = x^2 + \dfrac1x$ follows $y = x^2$. A smaller top degree gives $y = 0$.
- id: a2-m5-r2-h07
  lesson: a2-m5-h-slant-asymptotes
  topic: Average cost
  type: order
  stem: 'Put the steps of the proof of the AM–GM inequality $a + b \ge 2\sqrt{ab}$ (for $a, b \ge 0$) in order.'
  items:
    - 'A square is never negative, so $(\sqrt a - \sqrt b)^2 \ge 0$'
    - 'Expand the square: $a - 2\sqrt{ab} + b \ge 0$'
    - 'Add $2\sqrt{ab}$ to both sides: $a + b \ge 2\sqrt{ab}$'
  explanation: |-
    The proof starts from a fact that is always true, a square is at least 0, and each step rewrites the previous one. Equality holds exactly when the square is 0, that is, when $a = b$.
- id: a2-m5-r2-h08
  lesson: a2-m5-h-slant-asymptotes
  topic: Average cost
  stem: 'A company''s cost to make $x$ units is $C(x) = 0.05x^2 + 4x + 500$ dollars. At what production level is the average cost per unit least?'
  choices: ['10 units', '50 units', '100 units', '200 units']
  answer: 2
  explanation: |-
    $A(x) = \dfrac{C(x)}{x} = 0.05x + 4 + \dfrac{500}{x}$. The product $0.05x \cdot \dfrac{500}{x} = 25$ is constant, so by AM–GM the minimum is where $0.05x = \dfrac{500}{x}$: $x^2 = 10{,}000$ and $x = 100$. There $A(100) = 5 + 4 + 5 = \$14$ per unit, while $A(50) = 16.5$ and $A(200) = 16.5$.
- id: a2-m5-r2-h09
  lesson: a2-m5-h-slant-asymptotes
  topic: Average cost
  stem: 'A product''s average cost is $A(x) = 0.02x + 3 + \dfrac{200}{x}$ dollars per item, for $x > 0$ items. What is the least average cost?'
  choices: ['\$3 per item', '\$4 per item', '\$5 per item', '\$7 per item']
  answer: 3
  explanation: |-
    By AM–GM, $0.02x + \dfrac{200}{x} \ge 2\sqrt{0.02 \cdot 200} = 2\sqrt4 = 4$, with equality at $0.02x = \dfrac{200}{x}$, that is, $x = 100$. So the least average cost is $3 + 4 = \$7$ per item. Answering \$4 forgets the constant 3; answering \$3 forgets the other two terms.
- id: a2-m5-r2-h10
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Where does the graph of $f(x) = \dfrac{x^3 - x + 2}{x^2 + 1}$ cross its slant asymptote?'
  choices: ['At $x = 1$', 'At $x = -1$', 'At $x = 2$', 'It never crosses it']
  answer: 0
  explanation: |-
    Divide: $x^3 - x + 2 = x(x^2 + 1) + (-2x + 2)$, so $f(x) = x + \dfrac{-2x + 2}{x^2 + 1}$ with slant asymptote $y = x$. The graph meets the line where the remainder $-2x + 2$ is 0: $x = 1$. Check: $f(1) = \tfrac22 = 1$, on the line $y = x$.
- id: a2-m5-r2-h11
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Which statement about the asymptotes of rational functions is true?'
  choices: ['A graph can never cross any of its asymptotes', 'A graph can cross a horizontal or slant asymptote, but never a vertical one', 'A graph can cross a vertical asymptote at a hole', 'A graph crosses its slant asymptote at every zero of its denominator']
  answer: 1
  explanation: |-
    The function has no value on a vertical asymptote, so the graph can't touch it. Horizontal and slant asymptotes describe only the far ends, and the graph can cross them at the zeros of the remainder. A hole and a vertical asymptote can't occur at the same $x$, and the zeros of the denominator are where the graph has no value at all.
- id: a2-m5-r2-h12
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Which rational function is proper?'
  choices: ['$\dfrac{x^2}{x^2 + 1}$', '$\dfrac{4x}{2x + 1}$', '$\dfrac{x + 5}{x^2 - 3}$', '$\dfrac{x^3}{x - 1}$']
  answer: 2
  explanation: |-
    Proper means the numerator's degree is less than the denominator's: only $\dfrac{x + 5}{x^2 - 3}$ (1 less than 2). Equal degrees, as in $\dfrac{x^2}{x^2 + 1}$ and $\dfrac{4x}{2x + 1}$, count as improper.
- id: a2-m5-r2-h13
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'Dividing gives $f(x) = x + 3 + \dfrac{2}{x - 1}$. For large positive $x$, where is the graph?'
  choices: ['Slightly below the line $y = x + 3$', 'Exactly on the line $y = x + 3$', 'Close to the line $y = 0$', 'Slightly above the line $y = x + 3$']
  answer: 3
  explanation: |-
    $f(x) - (x + 3) = \dfrac{2}{x - 1}$, which is positive and shrinking toward 0 for large positive $x$. So the graph is slightly above its slant asymptote $y = x + 3$, getting closer as $x$ grows.
- id: a2-m5-r2-h14
  lesson: a2-m5-h-slant-asymptotes
  topic: Slant asymptotes
  stem: 'For very large $|x|$, the graph of $f(x) = \dfrac{2x^3 + 1}{x}$ is close to which curve?'
  choices: ['$y = 2x$', '$y = 2$', '$y = 2x^2$', '$y = 0$']
  answer: 2
  explanation: |-
    $f(x) = 2x^2 + \dfrac1x$, and $\dfrac1x$ fades for large $|x|$, so the graph hugs the parabola $y = 2x^2$. The top degree is two more than the bottom, so there is no line asymptote.

# 19h2 Honors: Partial fraction decomposition
- id: a2-m5-r2-h15
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Decompose $\dfrac{x + 7}{(x - 1)(x + 3)}$.'
  choices: ['$\dfrac{-1}{x - 1} + \dfrac{2}{x + 3}$', '$\dfrac{2}{x - 1} + \dfrac{1}{x + 3}$', '$\dfrac{8}{x - 1} + \dfrac{4}{x + 3}$', '$\dfrac{2}{x - 1} - \dfrac{1}{x + 3}$']
  answer: 3
  explanation: |-
    Cover-up: over $x - 1$, $\dfrac{1 + 7}{1 + 3} = 2$; over $x + 3$, $\dfrac{-3 + 7}{-3 - 1} = -1$. So the decomposition is $\dfrac{2}{x - 1} - \dfrac{1}{x + 3}$. Check: $2(x + 3) - (x - 1) = x + 7$. The choice with 8 and 4 forgets to divide by the uncovered factor.
- id: a2-m5-r2-h16
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  type: text
  stem: 'If $\dfrac{4x + 7}{(x - 2)(x + 3)} = \dfrac{A}{x - 2} + \dfrac{B}{x + 3}$, then $A =$ ___ and $B =$ ___.'
  accept:
    - ['3']
    - ['1']
  explanation: |-
    Clear denominators: $4x + 7 = A(x + 3) + B(x - 2)$. At $x = 2$: $15 = 5A$, so $A = 3$. At $x = -3$: $-5 = -5B$, so $B = 1$. Check: $3(x + 3) + (x - 2) = 4x + 7$.
- id: a2-m5-r2-h17
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Which is the correct form for decomposing $\dfrac{x^2 + 1}{x(x - 2)^2}$?'
  choices: ['$\dfrac{A}{x} + \dfrac{B}{x - 2} + \dfrac{C}{(x - 2)^2}$', '$\dfrac{A}{x} + \dfrac{B}{(x - 2)^2}$', '$\dfrac{A}{x} + \dfrac{B}{x - 2}$', '$\dfrac{A}{x^2} + \dfrac{B}{(x - 2)^2}$']
  answer: 0
  explanation: |-
    The denominator has degree 3, so the form needs 3 unknowns. The factor $x$ appears once and gets $\dfrac{A}{x}$; the repeated factor $(x - 2)^2$ gets a term for each power, $\dfrac{B}{x - 2} + \dfrac{C}{(x - 2)^2}$. Keeping only the highest power, or only the first power, leaves too few unknowns.
- id: a2-m5-r2-h18
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Which is the correct form for decomposing $\dfrac{5x^2 + 3}{(x + 1)(x^2 + 4)}$?'
  choices: ['$\dfrac{A}{x + 1} + \dfrac{B}{x^2 + 4}$', '$\dfrac{A}{x + 1} + \dfrac{Bx + C}{x^2 + 4}$', '$\dfrac{A}{x + 1} + \dfrac{B}{x + 2} + \dfrac{C}{x - 2}$', '$\dfrac{Ax + B}{x + 1} + \dfrac{C}{x^2 + 4}$']
  answer: 1
  explanation: |-
    $x^2 + 4$ has no real roots, so it is an irreducible quadratic and gets a linear numerator $Bx + C$. It does not factor as $(x + 2)(x - 2)$; that is $x^2 - 4$. A linear factor such as $x + 1$ gets only a constant numerator.
- id: a2-m5-r2-h19
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Which of these must be divided before you set up partial fractions? Select all that apply.'
  choices: ['$\dfrac{x^3 + 2}{x^2 - 1}$', '$\dfrac{x^2}{x^2 - 4}$', '$\dfrac{3x + 1}{x^2 - x}$', '$\dfrac{5}{x(x + 1)}$']
  answer: [0, 1]
  explanation: |-
    Division is needed when the fraction is improper, meaning the top degree is at least the bottom degree: degree 3 over 2, and degree 2 over 2. The other two are proper (degree 1 over 2 and degree 0 over 2) and can be decomposed directly.
- id: a2-m5-r2-h20
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  type: order
  stem: 'Put the steps for decomposing a proper fraction such as $\dfrac{x^2 + 2x + 5}{x(x - 1)^2}$ in order.'
  items:
    - 'Factor the denominator completely'
    - 'Write the terms, with unknown numerators, that each factor needs'
    - 'Multiply both sides by the original denominator'
    - 'Find the unknowns by substituting roots and matching coefficients'
  explanation: |-
    The terms depend on the factors, so factoring comes first. Clearing the denominators turns the equation into a polynomial identity, and only then can roots be substituted or coefficients matched.
- id: a2-m5-r2-h21
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  type: match
  stem: 'Match each factor of a denominator to the partial fraction term or terms it needs.'
  pairs:
    - ['$x - 4$', 'A/(x − 4)']
    - ['$(x + 1)^2$', 'A/(x + 1) + B/(x + 1)²']
    - ['$x^2 + 9$', '(Ax + B)/(x² + 9)']
    - ['$x^2 - 9$', 'A/(x − 3) + B/(x + 3)']
  distractors: ['A/(x² + 9)', 'A/(x + 1)²']
  explanation: |-
    A single linear factor gets one constant numerator. A repeated factor gets a term for each power. $x^2 + 9$ has no real roots, so it is irreducible and needs a linear numerator. $x^2 - 9$ is not irreducible: it factors as $(x - 3)(x + 3)$, two linear factors.
- id: a2-m5-r2-h22
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  type: text
  stem: 'Use partial fractions to find $\dfrac{1}{1 \cdot 2} + \dfrac{1}{2 \cdot 3} + \cdots + \dfrac{1}{49 \cdot 50}$. Give an exact fraction: ___'
  accept: ['49/50']
  explanation: |-
    $\dfrac{1}{k(k + 1)} = \dfrac1k - \dfrac{1}{k + 1}$, so the sum telescopes: $\left(1 - \tfrac12\right) + \left(\tfrac12 - \tfrac13\right) + \cdots + \left(\tfrac{1}{49} - \tfrac{1}{50}\right) = 1 - \tfrac{1}{50} = \tfrac{49}{50}$.
- id: a2-m5-r2-h23
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'What is $\displaystyle\sum_{k=1}^{10} \frac{2}{k(k + 2)}$?'
  choices: ['$\dfrac{10}{11}$', '$\dfrac{3}{2}$', '$\dfrac{175}{132}$', '$\dfrac{20}{11}$']
  answer: 2
  explanation: |-
    $\dfrac{2}{k(k + 2)} = \dfrac1k - \dfrac{1}{k + 2}$. Each negative piece cancels a positive piece two terms later, so $1 + \tfrac12$ survives at the start and $-\tfrac{1}{11} - \tfrac{1}{12}$ at the end: $\tfrac32 - \tfrac{1}{11} - \tfrac{1}{12} = \tfrac{198 - 12 - 11}{132} = \tfrac{175}{132}$. $\tfrac32$ is the sum with infinitely many terms, and $\tfrac{10}{11}$ is the answer for the gap-of-one sum $\sum \tfrac{1}{k(k+1)}$.
- id: a2-m5-r2-h24
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Use the cover-up method on $\dfrac{3x + 5}{(x - 1)(x + 2)} = \dfrac{A}{x - 1} + \dfrac{B}{x + 2}$. What is $A$?'
  choices: ['$\tfrac13$', '$8$', '$-\tfrac13$', '$\tfrac83$']
  answer: 3
  explanation: |-
    Cover up $x - 1$ and put $x = 1$ into what is left: $A = \dfrac{3 + 5}{1 + 2} = \dfrac83$. The value $\tfrac13$ is $B$ (cover up $x + 2$: $\dfrac{-6 + 5}{-3} = \tfrac13$), and 8 forgets to divide by $x + 2$.
- id: a2-m5-r2-h25
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Decompose $\dfrac{x^2 + 1}{x^2 - 1}$.'
  choices: ['$1 + \dfrac{1}{x - 1} - \dfrac{1}{x + 1}$', '$\dfrac{1}{x - 1} - \dfrac{1}{x + 1}$', '$1 + \dfrac{1}{x - 1} + \dfrac{1}{x + 1}$', '$\dfrac{1}{x - 1} + \dfrac{1}{x + 1}$']
  answer: 0
  explanation: |-
    Equal degrees make it improper, so divide first: $x^2 + 1 = 1 \cdot (x^2 - 1) + 2$, giving $1 + \dfrac{2}{(x - 1)(x + 1)}$. Cover-up: over $x - 1$, $\tfrac22 = 1$; over $x + 1$, $\tfrac{2}{-2} = -1$. The choices without the 1 skip the division.
- id: a2-m5-r2-h26
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'If $\dfrac{2x + 3}{(x + 1)^2} = \dfrac{A}{x + 1} + \dfrac{B}{(x + 1)^2}$, what are $A$ and $B$?'
  choices: ['$A = 1$, $B = 2$', '$A = 2$, $B = 1$', '$A = 2$, $B = 3$', '$A = 3$, $B = 2$']
  answer: 1
  explanation: |-
    Clear denominators: $2x + 3 = A(x + 1) + B$. At $x = -1$: $1 = B$. Matching the $x$ terms: $A = 2$. Check: $2(x + 1) + 1 = 2x + 3$.
- id: a2-m5-r2-h27
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Why does the term for the factor $x^2 + 4$ need the numerator $Bx + C$ instead of a constant?'
  choices: ['Because $x^2 + 4$ has two real roots', 'Because the cover-up method only works on linear numerators', 'Because a factor of degree 2 needs two unknowns to match every possible numerator', 'Because the numerator must have the same degree as the denominator']
  answer: 2
  explanation: |-
    The number of unknowns must equal the degree of the denominator, and a quadratic factor contributes degree 2, so it needs two unknowns, $B$ and $C$. $x^2 + 4$ has no real roots, and each term is proper, with numerator degree less than its denominator's.
- id: a2-m5-r2-h28
  lesson: a2-m5-h-partial-fractions
  topic: Partial fractions
  stem: 'Clearing denominators in $\dfrac{5x + 1}{(x - 1)(x + 2)} = \dfrac{A}{x - 1} + \dfrac{B}{x + 2}$ gives $5x + 1 = A(x + 2) + B(x - 1)$. Why is it legitimate to substitute $x = 1$, an excluded value of the original fraction?'
  choices: ['Because excluded values only matter in the final answer', 'Because the new equation is between polynomials, so it holds for every $x$', 'Because $x = 1$ makes the left side 0', 'It isn''t; you must match coefficients instead']
  answer: 1
  explanation: |-
    The cleared equation holds for every $x$ except possibly 1 and $-2$. Two polynomials that agree at infinitely many points are identical, so it holds at $x = 1$ and $x = -2$ too. (At $x = 1$ the left side is 6, not 0.) Matching coefficients also works, but it isn't required.
