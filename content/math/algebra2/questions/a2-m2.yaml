# Complex numbers, quadratics, and systems
- id: alg-q-2901
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Simplify $\sqrt{-49}$.'
  choices: ['$\pm 7$', '$-7$', '$7i$', '$49i$']
  answer: 2
  explanation: |-
    $\sqrt{-49} = i\sqrt{49} = 7i$. Check: $(7i)^2 = 49i^2 = -49$.
- id: alg-q-2902
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Simplify $(3 - 2i) + (-5 + 6i)$.'
  choices: ['$2i$', '$8 - 8i$', '$-2 - 8i$', '$-2 + 4i$']
  answer: 3
  explanation: |-
    Real parts: $3 - 5 = -2$. Imaginary parts: $-2 + 6 = 4$. So $-2 + 4i$.
- id: alg-q-2903
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Multiply $(4 + i)(2 - 3i)$.'
  choices: ['$11 - 10i$', '$5 - 10i$', '$8 - 3i$', '$11 - 14i$']
  answer: 0
  explanation: |-
    FOIL: $8 - 12i + 2i - 3i^2 = 8 - 10i + 3 = 11 - 10i$. Treating $-3i^2$ as $-3$ gives $5 - 10i$.
- id: alg-q-2904
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Simplify $i^{27}$.'
  choices: ['$-i$', '$i$', '$-1$', '$1$']
  answer: 0
  explanation: |-
    $27 = 4 \cdot 6 + 3$, so $i^{27} = i^3 = -i$.
- id: alg-q-2905
  lesson: alg-complex
  topic: Complex numbers
  stem: 'What is the complex conjugate of $-3 + 5i$?'
  choices: ['$5 - 3i$', '$3 - 5i$', '$3 + 5i$', '$-3 - 5i$']
  answer: 3
  explanation: |-
    The conjugate keeps the real part and changes the sign of the imaginary part: $-3 - 5i$.
- id: alg-q-2906
  lesson: alg-complex
  module_quiz: true
  topic: Complex numbers
  stem: 'Write $\dfrac{2 + 3i}{1 - i}$ in the form $a + bi$.'
  choices: ['$\tfrac52 + \tfrac52 i$', '$2 - 3i$', '$-\tfrac12 + \tfrac52 i$', '$-1 + 5i$']
  answer: 2
  explanation: |-
    Multiply by $\tfrac{1 + i}{1 + i}$: the numerator is $2 + 2i + 3i + 3i^2 = -1 + 5i$ and the denominator is $1 + 1 = 2$. Result: $-\tfrac12 + \tfrac52 i$.
- id: alg-q-2907
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Solve $x^2 + 25 = 0$.'
  choices: ['$x = \pm 5i$', '$x = \pm 5$', '$x = -5$', 'No solution of any kind']
  answer: 0
  explanation: |-
    $x^2 = -25$, so $x = \pm\sqrt{-25} = \pm 5i$. There are no real solutions, but there are two complex ones.
- id: alg-q-2908
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Solve $x^2 + 2x + 5 = 0$.'
  choices: ['$x = -2 \pm 4i$', '$x = 1 \pm 2i$', '$x = -1 \pm 4i$', '$x = -1 \pm 2i$']
  answer: 3
  explanation: |-
    $D = 4 - 20 = -16$, $\sqrt{-16} = 4i$. $x = \dfrac{-2 \pm 4i}{2} = -1 \pm 2i$.
- id: alg-q-2909
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Evaluate $\sqrt{-4} \cdot \sqrt{-9}$.'
  choices: ['$-6$', '$6$', '$6i$', '$-6i$']
  answer: 0
  explanation: |-
    Convert first: $(2i)(3i) = 6i^2 = -6$. Multiplying under one root, $\sqrt{36} = 6$, is invalid for two negative radicands.
- id: alg-q-2910
  lesson: alg-complex
  topic: Complex numbers
  stem: 'Compute $(3 + 4i)(3 - 4i)$.'
  choices: ['$25$', '$-7$', '$9 - 16i$', '$7$']
  answer: 0
  explanation: |-
    $(a + bi)(a - bi) = a^2 + b^2 = 9 + 16 = 25$. Using $-16$ for $-16i^2$ gives $-7$.
- id: alg-q-2911
  lesson: alg-complex
  topic: Complex numbers
  stem: 'What is the imaginary part of $6 - 2i$?'
  choices: ['$-2i$', '$-2$', '$6$', '$2$']
  answer: 1
  explanation: |-
    For $a + bi$, the imaginary part is the real number $b$. Here $b = -2$.

- id: alg-q-1601
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'Is $(1, -1, 2)$ a solution of $x + y + z = 2$, $2x - y + z = 5$, $x + 2y - z = -3$?'
  choices: ['No, it fails the second equation', 'Yes', 'No, it fails the third equation', 'No, it fails the first equation']
  answer: 1
  explanation: |-
    $1 - 1 + 2 = 2$, $2 + 1 + 2 = 5$, and $1 - 2 - 2 = -3$. All three hold, so it is a solution.
- id: alg-q-1602
  lesson: alg-three-var
  module_quiz: true
  topic: Three-variable systems
  stem: 'Solve: $x + y + z = 6$, $x - y + z = 2$, $2x + y - z = 1$.'
  choices: ['$(1, 3, 2)$', '$(3, 2, 1)$', '$(2, 1, 3)$', '$(1, 2, 3)$']
  answer: 3
  explanation: |-
    Subtract the second from the first: $2y = 4$, so $y = 2$. Add the first and third: $3x + 2y = 7$, so $x = 1$. Then $z = 6 - 1 - 2 = 3$. Check the third: $2 + 2 - 3 = 1$.
- id: alg-q-1603
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'You have eliminated $z$ using equations (1) and (2). What should you do next?'
  choices: ['Solve equation (3) for $z$ and stop', 'Eliminate $x$ using equations (1) and (2)', 'Eliminate $z$ again, using equations (1) and (2)', 'Eliminate $z$ again, using a pair that includes equation (3)']
  answer: 3
  explanation: |-
    You need a second equation in $x$ and $y$ only, and it must use the third equation's information. Eliminating a different variable would give equations in different unknowns.
- id: alg-q-1604
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'While solving a three-variable system, you reach $0 = 5$. What does this mean?'
  choices: ['The solution is $(0, 0, 5)$', 'The system has infinitely many solutions', 'The solution has $z = 5$', 'The system has no solution']
  answer: 3
  explanation: |-
    A false statement means the equations contradict each other: the system is inconsistent, so no triple satisfies all three.
- id: alg-q-1605
  lesson: alg-three-var
  module_quiz: true
  topic: Three-variable systems
  stem: 'Which parabola $y = ax^2 + bx + c$ passes through $(0, 1)$, $(1, 4)$ and $(-1, 0)$?'
  choices: ['$y = 2x^2 + x + 1$', '$y = x^2 + 2x + 1$', '$y = x^2 + 3x$', '$y = -x^2 + 2x + 1$']
  answer: 1
  explanation: |-
    $(0, 1)$ gives $c = 1$. Then $a + b + 1 = 4$ and $a - b + 1 = 0$, so $a + b = 3$ and $a - b = -1$, giving $a = 1$, $b = 2$. Check: $y(-1) = 1 - 2 + 1 = 0$.
- id: alg-q-1606
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'Solve: $x + 2y - z = 4$, $2x - y + z = 3$, $3x + y + 2z = 7$.'
  choices: ['$(2, 1, 1)$', '$(1, 2, 0)$', '$(2, 1, 0)$', '$(0, 1, 2)$']
  answer: 2
  explanation: |-
    Add the first two: $3x + y = 7$. Twice the first plus the third: $5x + 5y = 15$, so $x + y = 3$. Subtract: $2x = 4$, $x = 2$, $y = 1$. Then $2 + 2 - z = 4$ gives $z = 0$.
- id: alg-q-1607
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'A museum sold 50 tickets: child ($5), adult ($10) and senior ($7), for $370 in all. Twice as many adult tickets as senior tickets were sold. How many senior tickets were sold?'
  choices: ['$15$', '$20$', '$10$', '$12$']
  answer: 2
  explanation: |-
    $c + a + s = 50$, $5c + 10a + 7s = 370$, $a = 2s$. Substituting: $c + 3s = 50$ and $5c + 27s = 370$. Then $5(50 - 3s) + 27s = 370$, so $12s = 120$ and $s = 10$ (with $a = 20$, $c = 20$).
- id: alg-q-1608
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'Geometrically, what does a single linear equation $ax + by + cz = d$ represent?'
  choices: ['A line in the plane', 'A plane in three-dimensional space', 'A single point', 'A circle']
  answer: 1
  explanation: |-
    In three dimensions a linear equation describes a flat plane. Three planes can meet in a point, a line, a plane, or not at all.
- id: alg-q-1609
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'Two equations of a system are $x + y + z = 3$ and $x - y + 2z = 1$. Which third equation makes the system dependent, with infinitely many solutions?'
  choices: ['$x + z = 4$', '$2x + 3z = 5$', '$2x + 2y + 3z = 4$', '$2x + 3z = 4$']
  answer: 3
  explanation: |-
    $2x + 3z = 4$ is exactly the sum of the first two equations, so it adds no new information. $2x + 3z = 5$ would contradict that sum, making the system inconsistent.
- id: alg-q-1610
  lesson: alg-three-var
  topic: Three-variable systems
  stem: 'Solve: $x = 2y$, $y = 3z$, $x + y + z = 20$.'
  choices: ['$(12, 6, 2)$', '$(6, 3, 1)$', '$(2, 6, 12)$', '$(10, 5, 5)$']
  answer: 0
  explanation: |-
    Write everything in terms of $z$: $y = 3z$ and $x = 6z$. Then $6z + 3z + z = 20$, so $z = 2$, $y = 6$, $x = 12$.

- id: a2-q-0601
  lesson: a2-complex-quadratics
  module_quiz: true
  topic: Quadratics with complex solutions
  stem: 'Solve $x^2 - 6x + 10 = 0$.'
  choices: ['$x = -3 \pm i$', '$x = 6 \pm 2i$', '$x = 3 \pm i$', '$x = 3 \pm 2i$']
  answer: 2
  explanation: |-
    Discriminant: $36 - 40 = -4$, and $\sqrt{-4} = 2i$. So $x = \dfrac{6 \pm 2i}{2} = 3 \pm i$. Not dividing by 2 gives $6 \pm 2i$; dividing only the 6 gives $3 \pm 2i$.
- id: a2-q-0602
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'What kind of solutions does $3x^2 - 2x + 4 = 0$ have?'
  choices: ['Two non-real complex solutions', 'Two different real solutions', 'One real double root', 'One real solution and one non-real solution']
  answer: 0
  explanation: |-
    $b^2 - 4ac = 4 - 48 = -44 < 0$, so there are two non-real solutions, which are complex conjugates. A quadratic with real coefficients can never have exactly one non-real solution.
- id: a2-q-0603
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'Solve $(x - 4)^2 + 9 = 0$.'
  choices: ['$x = -4 \pm 3i$', '$x = 4 \pm 9i$', '$x = 1$ and $x = 7$', '$x = 4 \pm 3i$']
  answer: 3
  explanation: |-
    $(x - 4)^2 = -9$, so $x - 4 = \pm 3i$ and $x = 4 \pm 3i$. Getting $1$ and $7$ means solving $(x - 4)^2 = 9$, which drops the minus sign.
- id: a2-q-0604
  lesson: a2-complex-quadratics
  module_quiz: true
  topic: Quadratics with complex solutions
  stem: 'Solve $2x^2 + 2x + 1 = 0$.'
  choices: ['$x = -1 \pm \tfrac12 i$', '$x = -\tfrac12 \pm \tfrac12 i$', '$x = -\tfrac12 \pm 2i$', '$x = -1 \pm i$']
  answer: 1
  explanation: |-
    $b^2 - 4ac = 4 - 8 = -4$, so $\sqrt{-4} = 2i$ and $x = \dfrac{-2 \pm 2i}{4}$. Divide both terms by 4: $-\tfrac12 \pm \tfrac12 i$. Dividing by $2$ instead of $2a = 4$ gives $-1 \pm i$.
- id: a2-q-0605
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'A quadratic equation with real coefficients has $5 + 2i$ as one solution. What is the other solution?'
  choices: ['$-5 + 2i$', '$5 - 2i$', '$-5 - 2i$', '$2 + 5i$']
  answer: 1
  explanation: |-
    Non-real solutions of a real quadratic come in conjugate pairs $-\tfrac{b}{2a} \pm qi$: same real part, opposite imaginary part. So the other is $5 - 2i$.
- id: a2-q-0606
  lesson: a2-complex-quadratics
  module_quiz: true
  topic: Quadratics with complex solutions
  stem: 'Which quadratic has leading coefficient 1 and roots $1 \pm 4i$?'
  choices: ['$x^2 + 2x + 17$', '$x^2 - 2x - 15$', '$x^2 - 2x + 5$', '$x^2 - 2x + 17$']
  answer: 3
  explanation: |-
    Roots $p \pm qi$ come from $(x - p)^2 + q^2 = (x - 1)^2 + 16 = x^2 - 2x + 17$. Check: the roots add to $2$ ($= -b$) and multiply to $1 + 16 = 17$ ($= c$). Using $-16$ gives $x^2 - 2x - 15$, whose roots are real.
- id: a2-q-0607
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'The graph of $y = a(x - h)^2 + k$ opens downward and has its vertex at $(2, 5)$. What kind of solutions does $a(x - h)^2 + k = 0$ have?'
  choices: ['Two real solutions', 'Two complex conjugate solutions', 'One real double root', 'It depends on the value of $h$']
  answer: 0
  explanation: |-
    The vertex is above the $x$-axis and the parabola opens down, so it must cross the axis twice: two real solutions. Algebraically, $a < 0$ and $k = 5 > 0$ have opposite signs, so $-\tfrac ka > 0$ and $\sqrt{-k/a}$ is real.
- id: a2-q-0608
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'Solve $x^2 + 4x + 7 = 0$ by completing the square.'
  choices: ['$x = 2 \pm i\sqrt3$', '$x = -2 \pm 3i$', '$x = -2 \pm i\sqrt3$', '$x = -2 \pm \sqrt3$']
  answer: 2
  explanation: |-
    $x^2 + 4x + 4 + 3 = (x + 2)^2 + 3$, so $(x + 2)^2 = -3$ and $x + 2 = \pm i\sqrt3$. Then $x = -2 \pm i\sqrt3$.
- id: a2-q-0609
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'What is the product of the two solutions of $3x^2 - 12x + 15 = 0$?'
  choices: ['$15$', '$-5$', '$4$', '$5$']
  answer: 3
  explanation: |-
    The product of the roots is $\tfrac ca = \tfrac{15}{3} = 5$. (The solutions are $2 \pm i$, and $(2 + i)(2 - i) = 4 + 1 = 5$.) Their sum, $-\tfrac ba = 4$, is the other common answer.
- id: a2-q-0610
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: |-
    A student solves $x^2 - 2x + 5 = 0$:

    Step 1: $b^2 - 4ac = 4 - 20 = -16$. Step 2: $\sqrt{-16} = 4i$. Step 3: $x = \dfrac{2 \pm 4i}{2}$. Step 4: $x = 1 \pm 4i$.

    Which statement is correct?
  choices: ['Step 1 is wrong: the discriminant is $4 + 20 = 24$', 'Step 4 is wrong: both terms must be divided by 2, giving $1 \pm 2i$', 'Step 2 is wrong: $\sqrt{-16} = -4$', 'Step 3 is wrong: the numerator should be $-2 \pm 4i$']
  answer: 1
  explanation: |-
    Steps 1 through 3 are right ($-b = 2$). In Step 4, $\dfrac{2 \pm 4i}{2} = 1 \pm 2i$. Check: $(1 + 2i)^2 - 2(1 + 2i) + 5 = -3 + 4i - 2 - 4i + 5 = 0$.
- id: a2-q-0611
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'Which quadratic has leading coefficient 3 and roots $\pm 2i$?'
  choices: ['$3x^2 - 12$', '$x^2 + 12$', '$3x^2 + 12$', '$3x^2 + 4$']
  answer: 2
  explanation: |-
    $(x - 2i)(x + 2i) = x^2 - 4i^2 = x^2 + 4$. Multiply by 3: $3x^2 + 12$. The version $3x^2 - 12$ has the real roots $\pm 2$, and $3x^2 + 4$ forgot to multiply the constant by 3.
- id: a2-q-0612
  lesson: a2-complex-quadratics
  topic: Quadratics with complex solutions
  stem: 'For which values of $c$ does $x^2 + 6x + c = 0$ have non-real solutions?'
  choices: ['$c > 9$', '$c < 9$', '$c > 36$', '$c > 3$']
  answer: 0
  explanation: |-
    Non-real solutions need $b^2 - 4ac < 0$: $36 - 4c < 0$, so $c > 9$. Graphically, $y = (x + 3)^2 + (c - 9)$ has its vertex above the $x$-axis exactly when $c > 9$.

- id: a2-q-nls-01
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'Solve the system $y = x^2$ and $y = x + 6$.'
  choices: ['$(3, 9)$ and $(-2, 4)$', '$(2, 8)$ and $(-3, 3)$', '$(3, 9)$ only', '$(9, 3)$ and $(4, -2)$']
  answer: 0
  explanation: |-
    Set the right sides equal: $x^2 = x + 6$, so $x^2 - x - 6 = (x - 3)(x + 2) = 0$ and $x = 3$ or $x = -2$. Partners from the line: $(3, 9)$ and $(-2, 4)$. Factoring as $(x + 3)(x - 2)$ gives $(2, 8)$ and $(-3, 3)$, which aren't on $y = x^2$. Keeping only the positive root misses $(-2, 4)$, and $(9, 3)$, $(4, -2)$ has the coordinates written in the wrong order.
- id: a2-q-nls-02
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'Solve the system $x^2 + y^2 = 10$ and $y = 3x$.'
  choices: ['$(1, 3)$ only', '$(1, 3)$ and $(-1, 3)$', '$(1, 3)$ and $(-1, -3)$', '$(\pm 1, \pm 3)$, four points']
  answer: 2
  explanation: |-
    Substitute: $x^2 + 9x^2 = 10$, so $x^2 = 1$ and $x = \pm 1$. Get each partner from the line $y = 3x$: $(1, 3)$ and $(-1, -3)$. The point $(-1, 3)$ is on the circle but not on the line, so listing all four sign combinations (or pairing $x = -1$ with $y = 3$) is the mistake of finding $y$ from $y^2 = 9$. Stopping at $(1, 3)$ forgets $x = -1$.
- id: a2-q-nls-03
  lesson: a2-nonlinear-systems
  module_quiz: true
  topic: Nonlinear systems
  stem: 'How many points do the graphs of $y = x^2 + 1$ and $y = 2x - 3$ have in common?'
  choices: ['Two', 'None', 'One', 'Infinitely many']
  answer: 1
  explanation: |-
    Substitute: $x^2 + 1 = 2x - 3$, so $x^2 - 2x + 4 = 0$. The discriminant is $(-2)^2 - 4(1)(4) = -12 < 0$, so there are no real roots and the line misses the parabola. Answering "two" counts the two complex roots, which aren't points on the graphs; "one" would need a discriminant of exactly 0.
- id: a2-q-nls-04
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'For which value of $k$ is the line $y = x + k$ tangent to the parabola $y = x^2$ (touching it at exactly one point)?'
  choices: ['$k = 0$', '$k = \tfrac14$', '$k = -1$', '$k = -\tfrac14$']
  answer: 3
  explanation: |-
    Substitute: $x^2 = x + k$, so $x^2 - x - k = 0$. One point means the discriminant is 0: $(-1)^2 - 4(1)(-k) = 1 + 4k = 0$, so $k = -\tfrac14$. Getting $\tfrac14$ is a sign slip with $-4ac$; $k = -1$ leaves out the factor 4; and $k = 0$ gives $x^2 - x = 0$, which has two roots, 0 and 1.
- id: a2-q-nls-05
  lesson: a2-nonlinear-systems
  module_quiz: true
  topic: Nonlinear systems
  stem: 'Solve the system $x^2 + y^2 = 20$ and $x^2 - y^2 = 12$.'
  choices: ['$(4, 2)$ only', '$(4, 2)$ and $(-4, -2)$', '$(\pm 4, \pm 2)$: four solutions', '$(\pm 16, \pm 4)$: four solutions']
  answer: 2
  explanation: |-
    Add the equations: $2x^2 = 32$, so $x^2 = 16$. Then $y^2 = 20 - 16 = 4$. So $x = \pm 4$ and $y = \pm 2$, and all four combinations work because only $x^2$ and $y^2$ appear: $(4, 2)$, $(4, -2)$, $(-4, 2)$, $(-4, -2)$. Stopping at one or two of these misses solutions, and $(\pm 16, \pm 4)$ gives the values of $x^2$ and $y^2$ instead of $x$ and $y$.
- id: a2-q-nls-06
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'To solve $x^2 + y^2 = 4$ and $y = x - 2$, a student substitutes and writes $x^2 + x^2 + 4 = 4$. What went wrong?'
  choices: ['$(x - 2)^2$ was squared term by term; it should be $x^2 - 4x + 4$', 'Substitution can''t be used when one graph is a circle', 'The student should have substituted $x = y - 2$', 'Nothing; the only solution is $x = 0$']
  answer: 0
  explanation: |-
    $(x - 2)^2 = x^2 - 4x + 4$, not $x^2 + 4$. Correctly: $2x^2 - 4x + 4 = 4$, so $2x(x - 2) = 0$, $x = 0$ or $x = 2$, giving $(0, -2)$ and $(2, 0)$. Substitution works for any system, the line solved for $x$ is $x = y + 2$ (not $y - 2$), and the student's equation loses the solution $x = 2$.
- id: a2-q-nls-07
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'A rectangle has area 12 cm² and perimeter 14 cm. What are its dimensions?'
  choices: ['2 cm by 6 cm', '1 cm by 12 cm', '2 cm by 5 cm', '3 cm by 4 cm']
  answer: 3
  explanation: |-
    $LW = 12$ and $2L + 2W = 14$, so $L + W = 7$. Then $L(7 - L) = 12$, so $L^2 - 7L + 12 = (L - 3)(L - 4) = 0$: the sides are 3 and 4. Both 2 by 6 and 1 by 12 have area 12 but perimeters 16 and 26, and 2 by 5 has perimeter 14 but area 10. Each satisfies only one equation.
- id: a2-q-nls-08
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'How many points can a line and a circle have in common?'
  choices: ['Exactly 2', '0, 1 or 2', '0, 1, 2, 3 or 4', 'Always at least 1']
  answer: 1
  explanation: |-
    Substituting the line into the circle gives a quadratic, which has two, one or no real roots. So the line crosses the circle twice, is tangent to it, or misses it. Up to four intersections is possible for two quadratic curves (such as a circle and a hyperbola), not for a line; and a line far from the circle meets it nowhere.
- id: a2-q-nls-09
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'Solve the system $y = x^2 - 3$ and $y = -x^2 + 5$.'
  choices: ['$(2, 1)$ and $(-2, 1)$', '$(2, 1)$ only', '$(4, 13)$ and $(-4, 13)$', '$(2, 1)$ and $(-2, -1)$']
  answer: 0
  explanation: |-
    Set them equal: $x^2 - 3 = -x^2 + 5$, so $2x^2 = 8$, $x^2 = 4$ and $x = \pm 2$. Both give $y = 4 - 3 = 1$, so the points are $(2, 1)$ and $(-2, 1)$. Stopping at $x = 2$ loses a point; using $x = \pm 4$ treats $x^2 = 4$ as $x = 4$; and $(-2, -1)$ isn't on either parabola, since $y$ depends only on $x^2$.
- id: a2-q-nls-10
  lesson: a2-nonlinear-systems
  module_quiz: true
  topic: Nonlinear systems
  stem: 'Substituting a line into a parabola gives $4x^2 - 12x + 9 = 0$. What does this tell you about the graphs?'
  choices: ['They cross at two points', 'They don''t meet', 'They are the same curve', 'They touch at exactly one point']
  answer: 3
  explanation: |-
    The discriminant is $(-12)^2 - 4(4)(9) = 144 - 144 = 0$, so there is one (double) root, $x = \tfrac32$: the line is tangent to the parabola. Two crossings would need a positive discriminant and no meeting a negative one. A line and a parabola can never be the same curve.
- id: a2-q-nls-11
  lesson: a2-nonlinear-systems
  topic: Nonlinear systems
  stem: 'Solve the system $xy = 6$ and $x + y = 5$.'
  choices: ['$(2, 3)$ only', '$(1, 6)$ and $(6, 1)$', '$(2, 3)$ and $(3, 2)$', '$(-2, -3)$ and $(-3, -2)$']
  answer: 2
  explanation: |-
    From the second equation $y = 5 - x$, so $x(5 - x) = 6$, $x^2 - 5x + 6 = 0$ and $x = 2$ or $x = 3$. The partners are $y = 3$ and $y = 2$. Both points must be listed. The pairs $(1, 6)$ and $(6, 1)$ have product 6 but sum 7, and the negative pairs come from the sign error $x^2 + 5x + 6 = 0$; their sum is $-5$.
- id: a2-q-nls-12
  lesson: a2-nonlinear-systems
  module_quiz: true
  topic: Nonlinear systems
  stem: 'Solve the system $x^2 + y^2 = 25$ and $x + y = 7$.'
  choices: ['$(3, 4)$ only', '$(3, 4)$ and $(4, 3)$', '$(-3, -4)$ and $(-4, -3)$', '$(0, 7)$ and $(7, 0)$']
  answer: 1
  explanation: |-
    Substitute $y = 7 - x$: $x^2 + 49 - 14x + x^2 = 25$, so $2x^2 - 14x + 24 = 0$, $x^2 - 7x + 12 = 0$, and $x = 3$ or $x = 4$. Partners: $(3, 4)$ and $(4, 3)$. The negative pair satisfies the circle but has $x + y = -7$ (a sign error), and $(0, 7)$, $(7, 0)$ are the line's intercepts, which aren't on the circle.

- id: a2-q-mat-01
  lesson: a2-matrices
  topic: Matrices
  stem: 'What are the dimensions of $\begin{bmatrix} 1 & 0 & -2 & 4 \\ 3 & 5 & 1 & 0 \end{bmatrix}$?'
  choices: ['$4 \times 2$', '$2 \times 4$', '$8$', '$2 \times 3$']
  answer: 1
  explanation: |-
    Dimensions are rows $\times$ columns: 2 rows and 4 columns, so $2 \times 4$. Writing $4 \times 2$ puts columns first, 8 is the number of entries, and $2 \times 3$ leaves out a column.
- id: a2-q-mat-02
  lesson: a2-matrices
  topic: Matrices
  stem: 'Which is the augmented matrix of the system $x + 2y = 3$, $y - z = 4$, $2x + z = -1$?'
  choices: ['$\left[\begin{array}{cc|c} 1 & 2 & 3 \\ 1 & -1 & 4 \\ 2 & 1 & -1 \end{array}\right]$', '$\left[\begin{array}{ccc|c} 1 & 2 & 0 & 3 \\ 0 & 1 & 1 & 4 \\ 2 & 0 & 1 & -1 \end{array}\right]$', '$\left[\begin{array}{ccc|c} 1 & 2 & 0 & 3 \\ 1 & -1 & 0 & 4 \\ 2 & 1 & 0 & -1 \end{array}\right]$', '$\left[\begin{array}{ccc|c} 1 & 2 & 0 & 3 \\ 0 & 1 & -1 & 4 \\ 2 & 0 & 1 & -1 \end{array}\right]$']
  answer: 3
  explanation: |-
    Use columns $x$, $y$, $z$ in that order and put 0 for each missing variable: row 1 is $1, 2, 0 \mid 3$; row 2 is $0, 1, -1 \mid 4$; row 3 is $2, 0, 1 \mid -1$. Leaving out the zeros shifts coefficients into the wrong columns (both the two-column matrix and the one with all zeros on the right do this), and the matrix with $+1$ in row 2 dropped the minus sign on $z$.
- id: a2-q-mat-03
  lesson: a2-matrices
  module_quiz: true
  topic: Matrices
  stem: 'Apply $R_2 - 3R_1 \to R_2$ to $\left[\begin{array}{cc|c} 1 & 2 & 4 \\ 3 & 5 & 7 \end{array}\right]$. What is the new row 2?'
  choices: ['$[\,0 \;\; -1 \mid -5\,]$', '$[\,0 \;\; -1 \mid 7\,]$', '$[\,0 \;\; 1 \mid 5\,]$', '$[\,6 \;\; 11 \mid 19\,]$']
  answer: 0
  explanation: |-
    Subtract 3 times row 1, entry by entry: $3 - 3(1) = 0$, $5 - 3(2) = -1$, $7 - 3(4) = -5$. Leaving the constant as 7 forgets to apply the operation after the bar; $[\,0 \;\; 1 \mid 5\,]$ is $3R_1 - R_2$, the opposite subtraction; and $[\,6 \;\; 11 \mid 19\,]$ adds $3R_1$ instead of subtracting it.
- id: a2-q-mat-04
  lesson: a2-matrices
  topic: Matrices
  stem: 'Which of these is NOT a valid row operation?'
  choices: ['Swap rows 1 and 3', 'Replace row 2 by $R_2 + 4R_1$', 'Multiply row 2 by 0', 'Multiply row 1 by $-\tfrac12$']
  answer: 2
  explanation: |-
    Scaling a row is allowed only by a nonzero number. Multiplying by 0 turns the row into zeros, erasing an equation, and can't be undone. Swapping rows, scaling by $-\tfrac12$, and adding a multiple of another row all produce equivalent systems.
- id: a2-q-mat-05
  lesson: a2-matrices
  topic: Matrices
  stem: 'A system in $x$, $y$, $z$ row-reduces to $\left[\begin{array}{ccc|c} 1 & 0 & 0 & -2 \\ 0 & 1 & 0 & 5 \\ 0 & 0 & 1 & 0 \end{array}\right]$. What is the solution?'
  choices: ['$(1, 1, 1)$', '$(-2, 5)$ with $z$ free', '$(0, 5, -2)$', '$(-2, 5, 0)$']
  answer: 3
  explanation: |-
    Each row of the RREF is one equation: $x = -2$, $y = 5$, $z = 0$. The ones on the diagonal are coefficients, not values; reading the last column bottom to top gives $(0, 5, -2)$; and the third row is $z = 0$, a real equation, so $z$ is not free.
- id: a2-q-mat-06
  lesson: a2-matrices
  module_quiz: true
  topic: Matrices
  stem: 'While row-reducing a system in $x$, $y$, $z$, you get the row $[\,0 \;\; 0 \;\; 0 \mid 4\,]$. What does it mean?'
  choices: ['$z = 4$', 'The system has no solution', 'The system has infinitely many solutions', 'The solution is $(0, 0, 4)$']
  answer: 1
  explanation: |-
    The row says $0x + 0y + 0z = 4$, that is $0 = 4$, which is false, so the system is inconsistent. It isn't $z = 4$ (that row would be $[\,0 \;\; 0 \;\; 1 \mid 4\,]$), and infinitely many solutions come from a row that reads $0 = 0$.
- id: a2-q-mat-07
  lesson: a2-matrices
  topic: Matrices
  stem: 'Solve the system whose row echelon form is $\left[\begin{array}{ccc|c} 1 & -1 & 2 & 5 \\ 0 & 1 & 3 & 7 \\ 0 & 0 & 1 & 2 \end{array}\right]$.'
  choices: ['$(5, 7, 2)$', '$(0, 1, 2)$', '$(2, 1, 2)$', '$(2, 13, 2)$']
  answer: 2
  explanation: |-
    Back-substitute from the bottom: $z = 2$; then $y + 3(2) = 7$, so $y = 1$; then $x - 1 + 2(2) = 5$, so $x = 2$. Reading the last column as the answer gives $(5, 7, 2)$; $x = 0$ comes from subtracting $y$ instead of adding it back; $y = 13$ adds 6 instead of subtracting it.
- id: a2-q-mat-08
  lesson: a2-matrices
  topic: Matrices
  stem: 'Find the determinant of $\begin{bmatrix} 4 & 3 \\ 2 & 5 \end{bmatrix}$.'
  choices: ['$14$', '$26$', '$-14$', '$2$']
  answer: 0
  explanation: |-
    $\det = ad - bc = 4(5) - 3(2) = 20 - 6 = 14$. Adding the products gives 26, subtracting in the other order gives $-14$, and multiplying along the rows ($4 \cdot 3 - 2 \cdot 5$) gives 2.
- id: a2-q-mat-09
  lesson: a2-matrices
  module_quiz: true
  topic: Matrices
  stem: 'Find the inverse of $A = \begin{bmatrix} 3 & 1 \\ 5 & 2 \end{bmatrix}$.'
  choices: ['$\begin{bmatrix} 3 & -1 \\ -5 & 2 \end{bmatrix}$', '$\begin{bmatrix} 2 & -1 \\ -5 & 3 \end{bmatrix}$', '$\begin{bmatrix} 2 & 1 \\ 5 & 3 \end{bmatrix}$', '$\begin{bmatrix} -2 & 1 \\ 5 & -3 \end{bmatrix}$']
  answer: 1
  explanation: |-
    $\det A = 3(2) - 1(5) = 1$. Swap the diagonal entries, negate the other two, and divide by 1: $\begin{bmatrix} 2 & -1 \\ -5 & 3 \end{bmatrix}$. Check: the top row times the first column of $A$ is $2(3) - 1(5) = 1$. The other matrices forget to swap 3 and 2, forget to negate 1 and 5, or divide by $-1$ instead of the determinant 1.
- id: a2-q-mat-10
  lesson: a2-matrices
  topic: Matrices
  stem: 'The coefficient matrix of $3x + y = 5$, $5x + 2y = 9$ has inverse $\begin{bmatrix} 2 & -1 \\ -5 & 3 \end{bmatrix}$. Use it to solve the system.'
  choices: ['$x = 1$, $y = 2$', '$x = 2$, $y = 1$', '$x = 24$, $y = 43$', '$x = 6$, $y = -7$']
  answer: 0
  explanation: |-
    $X = A^{-1}B$: $x = 2(5) - 1(9) = 1$ and $y = -5(5) + 3(9) = 2$. Check: $3 + 2 = 5$ and $5 + 4 = 9$. Multiplying by $A$ itself instead of $A^{-1}$ gives 24 and 43, using an inverse with the diagonal not swapped gives 6 and $-7$, and $x = 2$, $y = 1$ swaps the values (it gives $3(2) + 1 = 7$, not 5).
- id: a2-q-mat-11
  lesson: a2-matrices
  topic: Matrices
  stem: 'The coefficient matrix $A$ of a system of two equations has $\det A = 0$. Which statement is true?'
  choices: ['The solution is $x = 0$, $y = 0$', 'Find $A^{-1}$ by dividing by 1 instead of 0', 'The system has exactly one solution', '$A$ has no inverse, and the system does not have exactly one solution']
  answer: 3
  explanation: |-
    The formula for $A^{-1}$ divides by $\det A$, so with $\det A = 0$ there is no inverse. Then the system has either no solution or infinitely many (the lines are parallel or the same). A zero determinant says nothing about the solution being $(0, 0)$, and you can't replace the 0 with 1.
- id: a2-q-mat-12
  lesson: a2-matrices
  module_quiz: true
  topic: Matrices
  stem: 'Solve $x - 3y = -7$, $2x + y = 7$ by row reduction.'
  choices: ['$(-7, 7)$', '$(3, 2)$', '$(2, 3)$', '$(2, -3)$']
  answer: 2
  explanation: |-
    $R_2 - 2R_1 \to R_2$ turns $[\,2 \;\; 1 \mid 7\,]$ into $[\,0 \;\; 7 \mid 21\,]$, so $y = 3$. Then row 1: $x - 9 = -7$, so $x = 2$. Check: $2(2) + 3 = 7$. The constants $(-7, 7)$ aren't the solution, $(3, 2)$ swaps $x$ and $y$, and $(2, -3)$ has a sign error in $y$.
