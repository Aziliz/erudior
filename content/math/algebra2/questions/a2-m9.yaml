# Introduction to trigonometry
- id: a2-q-2501
  lesson: a2-unit-circle
  module_quiz: true
  topic: Angles and radians
  stem: 'Convert $225^\circ$ to radians.'
  choices: ['$\dfrac{4\pi}{5}$', '$\dfrac{5\pi}{4}$', '$\dfrac{5\pi}{8}$', '$\dfrac{5}{4}$']
  answer: 1
  explanation: |-
    $225^\circ \cdot \dfrac{\pi}{180^\circ} = \dfrac{225\pi}{180} = \dfrac{5\pi}{4}$. Dropping the $\pi$ gives $\tfrac54$, which is a different angle (about $71.6^\circ$).
- id: a2-q-2502
  lesson: a2-unit-circle
  topic: Angles and radians
  stem: 'Convert $\dfrac{7\pi}{6}$ radians to degrees.'
  choices: ['$105^\circ$', '$420^\circ$', '$\dfrac{7\pi^2}{1080}$', '$210^\circ$']
  answer: 3
  explanation: |-
    $\dfrac{7\pi}{6} \cdot \dfrac{180^\circ}{\pi} = 7 \cdot 30^\circ = 210^\circ$. Multiplying by $\tfrac{\pi}{180}$ instead (the wrong conversion) gives the expression with $\pi^2$.
- id: a2-q-2503
  lesson: a2-unit-circle
  topic: Angles and radians
  stem: 'Which angle is coterminal with $100^\circ$?'
  choices: ['$460^\circ$', '$260^\circ$', '$-100^\circ$', '$280^\circ$']
  answer: 0
  explanation: |-
    Coterminal angles differ by a multiple of $360^\circ$: $100^\circ + 360^\circ = 460^\circ$. ($-260^\circ$ would also work.) $-100^\circ$ is the reflection across the $x$-axis, not the same terminal side.
- id: a2-q-2504
  lesson: a2-unit-circle
  module_quiz: true
  topic: Angles and radians
  stem: 'What is the reference angle of $300^\circ$?'
  choices: ['$30^\circ$', '$120^\circ$', '$60^\circ$', '$240^\circ$']
  answer: 2
  explanation: |-
    $300^\circ$ is in quadrant IV, so the reference angle is $360^\circ - 300^\circ = 60^\circ$. $30^\circ$ measures to the $y$-axis instead of the $x$-axis.
- id: a2-q-2505
  lesson: a2-unit-circle
  topic: Angles and radians
  stem: 'What is the reference angle of $\dfrac{5\pi}{6}$?'
  choices: ['$\dfrac{\pi}{3}$', '$\dfrac{5\pi}{6}$', '$\dfrac{\pi}{6}$', '$\dfrac{7\pi}{6}$']
  answer: 2
  explanation: |-
    $\tfrac{5\pi}{6}$ ($150^\circ$) is in quadrant II, so the reference angle is $\pi - \tfrac{5\pi}{6} = \tfrac{\pi}{6}$ ($30^\circ$).
- id: a2-q-2506
  lesson: a2-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'Find the exact value of $\sin 150^\circ$.'
  choices: ['$\tfrac12$', '$-\tfrac12$', '$\tfrac{\sqrt3}{2}$', '$-\tfrac{\sqrt3}{2}$']
  answer: 0
  explanation: |-
    $150^\circ$ is in quadrant II with reference angle $30^\circ$. Sine (the $y$-coordinate) is positive in quadrant II, so $\sin 150^\circ = \sin 30^\circ = \tfrac12$. $-\tfrac{\sqrt3}{2}$ is $\cos 150^\circ$.
- id: a2-q-2507
  lesson: a2-unit-circle
  topic: Unit circle
  stem: 'Find the exact value of $\cos\dfrac{4\pi}{3}$.'
  choices: ['$\tfrac12$', '$-\tfrac{\sqrt3}{2}$', '$\tfrac{\sqrt3}{2}$', '$-\tfrac12$']
  answer: 3
  explanation: |-
    $\tfrac{4\pi}{3} = 240^\circ$, in quadrant III with reference angle $60^\circ$. Cosine is negative in quadrant III, so $\cos\tfrac{4\pi}{3} = -\cos 60^\circ = -\tfrac12$.
- id: a2-q-2508
  lesson: a2-unit-circle
  topic: Unit circle
  stem: 'If $\cos\theta < 0$ and $\sin\theta > 0$, in which quadrant is the terminal side of $\theta$?'
  choices: ['Quadrant I', 'Quadrant II', 'Quadrant III', 'Quadrant IV']
  answer: 1
  explanation: |-
    On the unit circle, $\cos\theta$ is the $x$-coordinate and $\sin\theta$ the $y$-coordinate. Negative $x$ and positive $y$ means quadrant II.
- id: a2-q-2509
  lesson: a2-unit-circle
  module_quiz: true
  topic: Unit circle
  stem: 'If $\sin\theta = -\tfrac{5}{13}$ and $\theta$ is in quadrant IV, find $\cos\theta$.'
  choices: ['$\tfrac{12}{13}$', '$-\tfrac{12}{13}$', '$\tfrac{8}{13}$', '$-\tfrac{5}{12}$']
  answer: 0
  explanation: |-
    $\cos^2\theta = 1 - \tfrac{25}{169} = \tfrac{144}{169}$, so $\cos\theta = \pm\tfrac{12}{13}$. Cosine is positive in quadrant IV: $\tfrac{12}{13}$. $\tfrac{8}{13}$ comes from $1 - \tfrac{5}{13}$ without squaring; $-\tfrac{5}{12}$ is $\tan\theta$.
- id: a2-q-2510
  lesson: a2-unit-circle
  topic: Angles and radians
  stem: 'A circle has radius 6 cm. How long is the arc cut off by a central angle of $\dfrac{2\pi}{3}$?'
  choices: ['$720$ cm', '$9\pi$ cm', '$4\pi$ cm', '$\dfrac{\pi}{9}$ cm']
  answer: 2
  explanation: |-
    With the angle in radians, $s = r\theta = 6 \cdot \tfrac{2\pi}{3} = 4\pi \approx 12.6$ cm. 720 uses the degree measure ($6 \cdot 120$) in the formula, which only works in radians.
- id: a2-q-2511
  lesson: a2-unit-circle
  topic: Unit circle
  stem: 'What are the coordinates of the point on the unit circle at angle $\dfrac{3\pi}{4}$?'
  choices: ['$\left(\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\right)$', '$\left(-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\right)$', '$\left(-\tfrac12, \tfrac{\sqrt3}{2}\right)$', '$\left(-\tfrac{\sqrt2}{2}, -\tfrac{\sqrt2}{2}\right)$']
  answer: 1
  explanation: |-
    $\tfrac{3\pi}{4} = 135^\circ$ is in quadrant II with reference angle $45^\circ$, so the point is $(\cos\theta, \sin\theta) = \left(-\tfrac{\sqrt2}{2}, \tfrac{\sqrt2}{2}\right)$.
- id: a2-q-2512
  lesson: a2-unit-circle
  topic: Unit circle
  stem: 'A student''s calculator says $\sin 30 = -0.988$. What is the most likely explanation?'
  choices: ['Sine is negative for every angle over $0^\circ$', 'The calculator found $\cos 30^\circ$ instead', '$30^\circ$ is in quadrant IV', 'The calculator is in radian mode, so it found the sine of 30 radians']
  answer: 3
  explanation: |-
    $\sin 30^\circ = 0.5$. In radian mode the calculator reads 30 as 30 radians (about $1719^\circ$), whose sine is about $-0.988$. Set degree mode, or enter $\tfrac{\pi}{6}$.
- id: a2-q-2601
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Sinusoid graphs
  stem: 'What are the amplitude and period of $y = 4\sin(3x)$?'
  choices: ['Amplitude 3, period $\dfrac{2\pi}{4}$', 'Amplitude 4, period $\dfrac{2\pi}{3}$', 'Amplitude 4, period 3', 'Amplitude 8, period $6\pi$']
  answer: 1
  explanation: |-
    Amplitude $|a| = 4$; period $\dfrac{2\pi}{b} = \dfrac{2\pi}{3}$. Taking $b = 3$ itself as the period, or multiplying $2\pi \cdot 3$, are the usual slips.
- id: a2-q-2602
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'What is the midline of $y = 2\cos x - 5$?'
  choices: ['$y = 2$', '$y = -3$', '$y = 5$', '$y = -5$']
  answer: 3
  explanation: |-
    The vertical shift $k = -5$ moves the middle of the wave to $y = -5$. The wave runs from $-5 - 2 = -7$ to $-5 + 2 = -3$, so $-3$ is the maximum, not the midline.
- id: a2-q-2603
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'What is the period of $y = \cos\left(\dfrac{\pi}{6}x\right)$?'
  choices: ['$12$', '$\dfrac{\pi}{6}$', '$6$', '$\dfrac{\pi^2}{3}$']
  answer: 0
  explanation: |-
    Period $= \dfrac{2\pi}{b} = \dfrac{2\pi}{\pi/6} = 2\pi \cdot \dfrac{6}{\pi} = 12$. $\tfrac{\pi^2}{3}$ multiplies by $b$ instead of dividing.
- id: a2-q-2604
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'What are the maximum and minimum values of $y = -3\sin x + 1$?'
  choices: ['Maximum 1, minimum $-3$', 'Maximum $-2$, minimum 4', 'Maximum 4, minimum $-2$', 'Maximum 3, minimum $-3$']
  answer: 2
  explanation: |-
    Amplitude $|-3| = 3$ about the midline $y = 1$: maximum $1 + 3 = 4$, minimum $1 - 3 = -2$. The negative $a$ flips the wave over its midline but doesn't change these values.
- id: a2-q-2605
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Sinusoid graphs
  stem: 'What is the phase shift of $y = \sin\left(2x - \dfrac{\pi}{3}\right)$?'
  choices: ['$\dfrac{\pi}{3}$ to the right', '$\dfrac{\pi}{6}$ to the left', '$\dfrac{\pi}{6}$ to the right', '$\dfrac{2\pi}{3}$ to the right']
  answer: 2
  explanation: |-
    Factor out $b$: $\sin\left(2\left(x - \tfrac{\pi}{6}\right)\right)$, so the shift is $\tfrac{\pi}{6}$ to the right. Check: the inside is 0 when $2x = \tfrac{\pi}{3}$, at $x = \tfrac{\pi}{6}$. Reading $\tfrac{\pi}{3}$ directly forgets to divide by $b = 2$.
- id: a2-q-2606
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Sinusoid graphs
  stem: 'A sinusoid has a maximum at $(0, 7)$, and the next minimum is at $(3, 1)$. Which equation fits?'
  choices: ['$y = 3\cos\left(\dfrac{\pi}{3}x\right) + 4$', '$y = 3\cos\left(\dfrac{\pi}{6}x\right) + 4$', '$y = 6\cos\left(\dfrac{\pi}{3}x\right) + 4$', '$y = 3\sin\left(\dfrac{\pi}{3}x\right) + 4$']
  answer: 0
  explanation: |-
    Midline $\tfrac{7 + 1}{2} = 4$, amplitude $\tfrac{7 - 1}{2} = 3$. Max to the next min is half a cycle, so the period is 6 and $b = \tfrac{2\pi}{6} = \tfrac{\pi}{3}$. The graph starts at a maximum, so use cosine. Using 3 as the full period gives the wrong $b$; 6 as the amplitude uses the full height.
- id: a2-q-2607
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Periodic models
  stem: 'A rider''s height on a Ferris wheel is $h(t) = -15\cos\left(\dfrac{\pi}{4}t\right) + 18$ meters, with $t$ in minutes. How long is one revolution, and what is the greatest height?'
  choices: ['4 minutes; 33 m', '8 minutes; 18 m', '$\dfrac{\pi}{4}$ minutes; 15 m', '8 minutes; 33 m']
  answer: 3
  explanation: |-
    Period $= \dfrac{2\pi}{\pi/4} = 8$ minutes. Greatest height = midline + amplitude $= 18 + 15 = 33$ m. 18 m is the height of the center.
- id: a2-q-2608
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'A tuning-fork model is $y = \sin(4\pi x)$, with $x$ in milliseconds. How many complete cycles happen per millisecond?'
  choices: ['$\tfrac12$', '$2$', '$4\pi$', '$4$']
  answer: 1
  explanation: |-
    The period is $\dfrac{2\pi}{4\pi} = \tfrac12$ ms, so the frequency (cycles per unit) is its reciprocal: $\dfrac{b}{2\pi} = 2$ cycles per millisecond. $\tfrac12$ is the period, not the frequency.
- id: a2-q-2609
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'Which equation has the same graph as $y = \cos x$?'
  choices: ['$y = \sin\left(x + \dfrac{\pi}{2}\right)$', '$y = \sin\left(x - \dfrac{\pi}{2}\right)$', '$y = -\sin x$', '$y = \sin(x + \pi)$']
  answer: 0
  explanation: |-
    The cosine graph is the sine graph shifted $\tfrac{\pi}{2}$ to the left, which is $\sin\left(x + \tfrac{\pi}{2}\right)$. Check $x = 0$: $\sin\tfrac{\pi}{2} = 1 = \cos 0$. Shifting right gives $-\cos x$ instead.
- id: a2-q-2610
  lesson: a2-trig-graphs
  topic: Periodic models
  stem: 'In a northern city, daylight lasts about 15 hours on the longest day and 9 hours on the shortest. For a sinusoid model of daylight hours, what are the amplitude and midline?'
  choices: ['Amplitude 6, midline 12', 'Amplitude 3, midline 9', 'Amplitude 3, midline 12', 'Amplitude 6, midline 15']
  answer: 2
  explanation: |-
    Midline $= \tfrac{15 + 9}{2} = 12$ hours, amplitude $= \tfrac{15 - 9}{2} = 3$ hours. 6 is the full max-to-min distance, twice the amplitude.
- id: a2-q-2611
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  stem: 'A student says the period of $y = 5\sin(\pi x)$ is $\pi$. What is the correct period?'
  choices: ['$\pi$', '$2$', '$5$', '$2\pi^2$']
  answer: 1
  explanation: |-
    Period $= \dfrac{2\pi}{b} = \dfrac{2\pi}{\pi} = 2$. The student read $b = \pi$ as the period; the amplitude 5 does not affect the period.
- id: a2-q-2612
  lesson: a2-trig-graphs
  topic: Periodic models
  stem: 'The depth of water at a dock is $d(t) = 4\sin\left(\dfrac{\pi}{6}t\right) + 10$ feet, $t$ hours after midnight. What is the depth at 9 a.m.?'
  choices: ['$14$ ft', '$10$ ft', '$10.3$ ft', '$6$ ft']
  answer: 3
  explanation: |-
    $d(9) = 4\sin\left(\tfrac{9\pi}{6}\right) + 10 = 4\sin\tfrac{3\pi}{2} + 10 = 4(-1) + 10 = 6$ ft, the low tide. 14 ft would be high tide, at $t = 3$; 10.3 ft comes from evaluating $\sin 4.71$ with the calculator in degree mode.
