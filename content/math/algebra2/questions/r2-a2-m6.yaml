# Round 2, module a2-m6 (Exponential and logarithmic functions): new question types for the
# core lessons and the questions for the two honors lessons.

# ---------- Lesson 20: exponential functions ----------
- id: a2-m6-r2-q01
  lesson: alg-exp-functions
  type: label
  module_quiz: true
  topic: Exponential functions
  stem: 'The picture shows the graphs of $y = 2^x$ and $y = \left(\tfrac12\right)^x$. Name the numbered parts.'
  image: {src: images/a2-m6-exp-graph-blank.svg, alt: 'Two exponential curves on one set of axes: a solid curve rising to the right and a dashed curve falling to the right. They cross on the y-axis at height 1. A red dashed line runs along the x-axis. Four numbered markers point to the crossing point, the red dashed line, the rising curve and the falling curve.'}
  labels:
    - {x: 51.6, y: 70.2, text: 'y-intercept (0, 1)'}
    - {x: 70.8, y: 81.7, text: Horizontal asymptote y = 0}
    - {x: 79.3, y: 25.0, text: Exponential growth curve}
    - {x: 23.8, y: 25.0, text: Exponential decay curve}
  distractors: [Vertical asymptote x = 0, 'x-intercept (1, 0)']
  explanation: |-
    Both curves pass through $(0, 1)$ because $b^0 = 1$ (1). Both get closer and closer to the $x$-axis without touching it, since $b^x > 0$: the line $y = 0$ is a horizontal asymptote (2). The curve rising to the right is $2^x$, growth (3); the one falling to the right is $\left(\tfrac12\right)^x$, decay (4). Neither graph has an $x$-intercept or a vertical asymptote.
- id: a2-m6-r2-q02
  lesson: alg-exp-functions
  type: text
  topic: Exponential functions
  stem: 'A population grows by 7% per year. Each year it is multiplied by the growth factor ___. Give the number as a decimal.'
  accept: ['1.07', '107%']
  explanation: |-
    Growing by 7% means keeping 100% and adding 7%: multiply by $1 + 0.07 = 1.07$. (Multiplying by $0.07$ would leave only 7% of the population, and $7$ would be 600% growth.)
- id: a2-m6-r2-q03
  lesson: alg-exp-functions
  type: match
  topic: Exponential functions
  stem: 'Match each model ($t$ in years) to the description it fits.'
  pairs:
    - ['$A = 500(1.04)^t$', Grows 4% per year]
    - ['$A = 500(0.96)^t$', Shrinks 4% per year]
    - ['$A = 500\left(\tfrac12\right)^{t/4}$', Has a half-life of 4 years]
    - ['$A = 500 \cdot 2^{t/4}$', Has a doubling time of 4 years]
    - ['$A = 500e^{0.04t}$', Compounds continuously at a 4% rate]
  distractors: [Grows by 4 units per year]
  explanation: |-
    $1.04 = 1 + 0.04$ is 4% growth and $0.96 = 1 - 0.04$ is 4% decay. In $\left(\tfrac12\right)^{t/4}$ and $2^{t/4}$ the exponent counts 4-year periods, so the amount halves or doubles every 4 years. $e^{rt}$ is continuous compounding. Growing by 4 units per year would be linear, $A = 500 + 4t$.
- id: a2-m6-r2-q04
  lesson: alg-exp-functions
  topic: Exponential functions
  stem: 'Which statements are true for every function $f(x) = b^x$ with $b > 0$ and $b \ne 1$? Select all that apply.'
  choices:
    - 'Its graph passes through $(0, 1)$.'
    - 'Its range is all positive real numbers.'
    - 'Its graph has the horizontal asymptote $y = 0$.'
    - 'It is an increasing function.'
  answer: [0, 1, 2]
  explanation: |-
    $b^0 = 1$ for every allowed base, $b^x$ is always positive and takes every positive value, and the graph approaches $y = 0$ on one side. But the function is increasing only when $b > 1$; for $0 < b < 1$, such as $\left(\tfrac12\right)^x$, it is decreasing.
- id: a2-m6-r2-q05
  lesson: alg-exp-functions
  type: order
  module_quiz: true
  topic: Compound interest
  stem: 'You invest \$1,000 at 6% per year for 10 years. Put the ways of paying interest in order from the smallest final balance to the largest.'
  items:
    - 'Simple interest (6% of \$1,000 each year, no compounding)'
    - 'Compounded annually'
    - 'Compounded monthly'
    - 'Compounded continuously'
  explanation: |-
    Simple interest gives $1000 + 10(60) = 1600$ dollars. Compounding earns interest on interest: annually $1000(1.06)^{10} \approx 1790.85$, monthly $1000(1.005)^{120} \approx 1819.40$, and continuously $1000e^{0.6} \approx 1822.12$. More frequent compounding always earns more, but the gains shrink toward the continuous limit.

# ---------- Lesson 21: logarithms ----------
- id: a2-m6-r2-q06
  lesson: alg-logs
  type: label
  module_quiz: true
  topic: Logarithms
  stem: 'The picture shows $\log_2 8 = 3$ and the same fact in exponential form. Name the numbered parts of the logarithm.'
  image: {src: images/a2-m6-log-parts-blank.svg, alt: 'Left box: log with a small subscript 2, then 8, equals 3. Right box: 2 to the power 3 equals 8. Lines lead down from the subscript 2, from the 8 and from the 3 in the left box to numbered markers.'}
  labels:
    - {x: 25.0, y: 63.7, text: Base}
    - {x: 30.6, y: 76.2, text: Argument}
    - {x: 42.8, y: 88.8, text: 'Value of the log (the exponent)'}
  distractors: [Coefficient, Common logarithm]
  explanation: |-
    In $\log_2 8 = 3$ the small 2 is the base (1), 8 is the argument (2), and 3 is the value of the logarithm (3). The exponential form $2^3 = 8$ keeps the same base, uses the log's value as the exponent, and makes the argument the result. There is no coefficient here, and a common logarithm would have base 10.
- id: a2-m6-r2-q07
  lesson: alg-logs
  type: text
  topic: Logarithms
  stem: 'Evaluate exactly: $\log_2 \tfrac18 =$ ___ and $\log_{25} 5 =$ ___.'
  accept:
    - ['-3', '−3']
    - ['1/2', '0.5']
  explanation: |-
    $\tfrac18 = 2^{-3}$, so $\log_2 \tfrac18 = -3$. $25^{1/2} = \sqrt{25} = 5$, so $\log_{25} 5 = \tfrac12$.
- id: a2-m6-r2-q08
  lesson: alg-logs
  type: match
  topic: Logarithms
  stem: 'Match each identity (for $M, N, x > 0$) to its name.'
  pairs:
    - ['$\log_b(MN) = \log_b M + \log_b N$', Product rule]
    - ['$\log_b \dfrac{M}{N} = \log_b M - \log_b N$', Quotient rule]
    - ['$\log_b(M^k) = k\log_b M$', Power rule]
    - ['$\log_b x = \dfrac{\ln x}{\ln b}$', Change-of-base formula]
    - ['$b^{\log_b x} = x$', Inverse property]
  distractors: [Sum rule]
  explanation: |-
    The product, quotient and power rules mirror the exponent rules $b^mb^n = b^{m+n}$, $b^m/b^n = b^{m-n}$ and $(b^m)^k = b^{mk}$. Change of base lets a calculator's $\ln$ key evaluate any logarithm, and $b^{\log_b x} = x$ says that $\log_b$ and $b^x$ undo each other. There is no "sum rule": $\log_b(M + N)$ does not simplify.
- id: a2-m6-r2-q09
  lesson: alg-logs
  module_quiz: true
  topic: Logarithms
  stem: 'Which equations are true for all $x > 0$ and $y > 0$? Select all that apply.'
  choices:
    - '$\ln(xy) = \ln x + \ln y$'
    - '$\ln(x + y) = \ln x + \ln y$'
    - '$\ln(x^3) = 3\ln x$'
    - '$(\ln x)^2 = 2\ln x$'
  answer: [0, 2]
  explanation: |-
    The product rule gives the first and the power rule gives the third. There is no rule for the log of a sum: with $x = y = 1$, $\ln 2 \ne 0$. And the power rule needs the exponent on the argument: with $x = e^3$, $(\ln x)^2 = 9$ but $2\ln x = 6$.
- id: a2-m6-r2-q10
  lesson: alg-logs
  type: order
  topic: Logarithms
  stem: 'Put these values in order from smallest to largest.'
  items: ['$\log_2 \tfrac12$', '$\log_9 3$', '$\ln 5$', '$\log_3 10$', '$\log_2 9$']
  explanation: |-
    $\log_2 \tfrac12 = -1$ and $\log_9 3 = \tfrac12$ exactly. $\ln 5 \approx 1.61$ (between 1 and 2, since $e < 5 < e^2$). $\log_3 10 \approx 2.10$ (since $9 < 10 < 27$) and $\log_2 9 \approx 3.17$ (since $8 < 9 < 16$).

# ---------- Lesson 22: exponential and logarithmic equations ----------
- id: a2-m6-r2-q11
  lesson: alg-exp-log-eq
  type: order
  topic: Exponential equations
  stem: 'Put the steps for solving $4 \cdot 5^{x} + 3 = 51$ in order.'
  items:
    - '$4 \cdot 5^{x} = 48$'
    - '$5^{x} = 12$'
    - '$\ln 5^{x} = \ln 12$'
    - '$x\ln 5 = \ln 12$'
    - '$x = \dfrac{\ln 12}{\ln 5} \approx 1.544$'
  explanation: |-
    Isolate the power first (subtract 3, then divide by 4), then take $\ln$ of both sides, use the power rule to bring $x$ down, and divide by $\ln 5$. Taking the log before isolating would leave $\ln(4 \cdot 5^x + 3)$, which can't be split.
- id: a2-m6-r2-q12
  lesson: alg-exp-log-eq
  type: text
  topic: Logarithmic equations
  stem: 'Solve $\log_5(x - 2) = 2$. Give only the number: $x =$ ___'
  accept: ['27']
  explanation: |-
    Exponential form: $x - 2 = 5^2 = 25$, so $x = 27$. Check: the argument $27 - 2 = 25$ is positive and $\log_5 25 = 2$.
- id: a2-m6-r2-q13
  lesson: alg-exp-log-eq
  type: match
  module_quiz: true
  topic: Exponential equations
  stem: 'Match each equation to the best first step for solving it.'
  pairs:
    - ['$9^{x} = 27^{x - 1}$', Write both sides as powers of 3]
    - ['$7^{x} = 40$', Take ln of both sides]
    - ['$e^{2x} - 7e^{x} + 10 = 0$', Substitute u = e^x]
    - ['$\log_2 x + \log_2(x + 2) = 3$', Combine the logs with the product rule]
    - ['$\ln(2x + 1) = \ln(x + 5)$', Set the arguments equal]
  distractors: [Square both sides]
  explanation: |-
    $9 = 3^2$ and $27 = 3^3$ share a base. 40 is not a power of 7, so take a logarithm. $e^{2x} = (e^x)^2$ makes the third a quadratic in $u = e^x$. The fourth needs one logarithm before converting to exponential form, and in the fifth, logs are one-to-one, so the arguments must be equal (then check that they are positive). Squaring is for radical equations.
- id: a2-m6-r2-q14
  lesson: alg-exp-log-eq
  topic: Exponential equations
  stem: 'Which equations have no real solution? Select all that apply.'
  choices:
    - '$2^{x} = -4$'
    - '$e^{x} = 0$'
    - '$\log x = -3$'
    - '$3^{x} = 0.2$'
  answer: [0, 1]
  explanation: |-
    An exponential $b^x$ is always positive, so it can never equal $-4$ or $0$. A logarithm can be negative: $\log x = -3$ gives $x = 10^{-3} = 0.001$. And $3^x = 0.2$ has the solution $x = \dfrac{\ln 0.2}{\ln 3} \approx -1.46$.
- id: a2-m6-r2-q15
  lesson: alg-exp-log-eq
  type: text
  topic: Exponential equations
  stem: 'Money earns 6% interest compounded continuously. It doubles in about ___ years. Give the answer to 1 decimal place.'
  accept: ['11.6', '11.55']
  explanation: |-
    Solve $e^{0.06t} = 2$: $0.06t = \ln 2$, so $t = \dfrac{\ln 2}{0.06} \approx 11.55$, or 11.6 years to 1 decimal place.

# ---------- Honors: continuous growth rates, e and effective yield ----------
- id: a2-m6-r2-h01
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'A population grows 4% per year. What is its continuous growth rate $k$, so that $P = P_0e^{kt}$?'
  choices: ['About 4.08%', 'Exactly 4%', 'About 3.92%', 'About 1.04%']
  answer: 2
  explanation: |-
    The yearly growth factor is $1.04$, so $k = \ln 1.04 \approx 0.0392$, about 3.92%. A continuous rate compounds all year, so it needs to be a little less than 4%. (4.08% is $e^{0.04} - 1$, the conversion in the other direction.)
- id: a2-m6-r2-h02
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'A quantity follows $A = 300e^{0.09t}$, with $t$ in years. By what percent does it grow each year?'
  choices: ['About 9.42%', 'Exactly 9%', 'About 8.62%', 'About 109.4%']
  answer: 0
  explanation: |-
    The yearly factor is $e^{0.09} \approx 1.0942$, so it grows about 9.42% per year. 8.62% is $\ln 1.09$ (the wrong direction), and 109.4% confuses the factor with the rate.
- id: a2-m6-r2-h03
  lesson: a2-m6-h-continuous-growth
  topic: Effective rates
  stem: 'A savings account pays a nominal 6% per year, compounded monthly. What is its annual percentage yield (APY)?'
  choices: ['6.00%', '0.50%', '72.00%', 'About 6.17%']
  answer: 3
  explanation: |-
    Each month multiplies by $1 + \tfrac{0.06}{12} = 1.005$, so a year multiplies by $1.005^{12} \approx 1.0617$: an effective rate of about 6.17%. 6.00% ignores compounding, 0.50% is the monthly rate, and 72% multiplies the yearly rate by 12.
- id: a2-m6-r2-h04
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'Using the rule of 72, about how long does money take to double at 9% per year?'
  choices: ['About 7.7 years', 'About 8 years', 'About 9 years', 'About 11 years']
  answer: 1
  explanation: |-
    $72 \div 9 = 8$ years. The exact doubling time with yearly compounding is $\dfrac{\ln 2}{\ln 1.09} \approx 8.04$ years, so the rule is very close here. 7.7 years is $69.3 \div 9$, which slightly underestimates for yearly compounding.
- id: a2-m6-r2-h05
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'A quantity grows as $A = A_0e^{kt}$ with $k > 0$. What is its doubling time exactly?'
  choices: ['$\dfrac{2}{k}$', '$\dfrac{k}{\ln 2}$', '$\dfrac{\ln 2}{k}$', '$\dfrac{72}{k}$']
  answer: 2
  explanation: |-
    Doubling means $e^{kt} = 2$, so $kt = \ln 2$ and $t = \dfrac{\ln 2}{k} \approx \dfrac{0.693}{k}$. $\tfrac{k}{\ln 2}$ is upside down (a faster rate must give a shorter time), and $72/R$ is only an approximation, with $R$ a percentage.
- id: a2-m6-r2-h06
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'A bone has 40% of the carbon-14 found in living bone. Using a half-life of 5,730 years, about how old is it?'
  choices: ['About 7,570 years', 'About 4,220 years', 'About 3,440 years', 'About 2,290 years']
  answer: 0
  explanation: |-
    $\lambda = \dfrac{\ln 2}{5730}$, and $e^{-\lambda t} = 0.40$ gives $t = \dfrac{5730\ln 0.40}{-\ln 2} \approx 7{,}570$ years. Check: 40% is between 50% (5,730 years) and 25% (11,460 years). 4,220 years is the age if 60% remained; 3,440 and 2,290 come from multiplying 5,730 by 0.6 or 0.4, as if decay were linear.
- id: a2-m6-r2-h07
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'An investment grows from \$2,000 to \$3,500 in 6 years. Assuming continuous exponential growth, what is the continuous rate $k$?'
  choices: ['About 9.78%', 'About 12.5%', 'About 4.05%', 'About 9.33%']
  answer: 3
  explanation: |-
    $3500 = 2000e^{6k}$ gives $e^{6k} = 1.75$, so $k = \dfrac{\ln 1.75}{6} \approx 0.0933$. 9.78% is the effective yearly rate $1.75^{1/6} - 1$, 12.5% treats the growth as linear ($75\% \div 6$), and 4.05% uses $\log$ (base 10) instead of $\ln$.
- id: a2-m6-r2-h08
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'What value does $\left(1 + \dfrac{0.05}{n}\right)^n$ approach as $n$ grows without bound?'
  choices: ['$1$', '$e^{0.05}$', '$1.05$', 'It grows without bound']
  answer: 1
  explanation: |-
    With $m = n/0.05$, the expression is $\left[\left(1 + \tfrac1m\right)^m\right]^{0.05}$, which approaches $e^{0.05} \approx 1.05127$. This is the yearly factor for continuous compounding at 5%. It is a little more than $1.05$ (the value at $n = 1$) and the values level off rather than growing forever.
- id: a2-m6-r2-h09
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'Which describe the same model as $A = 100(1.5)^t$? Select all that apply.'
  choices:
    - '$A = 100e^{(\ln 1.5)t}$'
    - '$A = 100e^{0.5t}$'
    - 'It grows by 50% each period.'
    - 'It doubles about every 1.71 periods.'
  answer: [0, 2, 3]
  explanation: |-
    $1.5 = e^{\ln 1.5}$, so $1.5^t = e^{(\ln 1.5)t}$, with $\ln 1.5 \approx 0.405$, not 0.5 ($e^{0.5t}$ grows about 64.9% per period). A factor of 1.5 is 50% growth, and the doubling time is $\dfrac{\ln 2}{\ln 1.5} \approx 1.71$ periods.
- id: a2-m6-r2-h10
  lesson: a2-m6-h-continuous-growth
  type: text
  topic: Continuous growth
  stem: 'A medicine leaves the body as $A = A_0e^{-0.0866t}$, with $t$ in hours. Its half-life is about ___ hours. Give a whole number.'
  accept: ['8']
  explanation: |-
    The half-life is $\dfrac{\ln 2}{\lambda} = \dfrac{0.6931}{0.0866} \approx 8.0$ hours.
- id: a2-m6-r2-h11
  lesson: a2-m6-h-continuous-growth
  type: match
  topic: Effective rates
  stem: 'An account follows $A = 1000e^{0.07t}$ ($t$ in years). Match each quantity to its value.'
  pairs:
    - [Continuous rate, 7%]
    - [Growth factor per year, 1.0725]
    - [Effective annual rate (APY), 7.25%]
    - [Doubling time, About 9.9 years]
  distractors: [About 14.3 years]
  explanation: |-
    The continuous rate is the 0.07 in the exponent. The yearly factor is $e^{0.07} \approx 1.0725$, so the APY is about 7.25%. The doubling time is $\dfrac{\ln 2}{0.07} \approx 9.9$ years; 14.3 years is $1/0.07$, which forgets the $\ln 2$.
- id: a2-m6-r2-h12
  lesson: a2-m6-h-continuous-growth
  type: order
  topic: Effective rates
  stem: 'Put these accounts in order from the lowest effective annual rate to the highest.'
  items:
    - '5.00% compounded annually'
    - '4.90% compounded continuously'
    - '4.95% compounded monthly'
    - '5.00% compounded continuously'
  explanation: |-
    Effective rates: 5.00% annually is 5.000%; $e^{0.049} - 1 \approx 5.022\%$; $\left(1 + \tfrac{0.0495}{12}\right)^{12} - 1 \approx 5.064\%$; $e^{0.05} - 1 \approx 5.127\%$. A lower nominal rate can beat a higher one if it compounds more often.
- id: a2-m6-r2-h13
  lesson: a2-m6-h-continuous-growth
  type: text
  topic: Effective rates
  stem: 'The effective annual rate of 8% compounded continuously is ___%. Give the percent to 2 decimal places.'
  accept: ['8.33']
  explanation: |-
    $e^{0.08} - 1 \approx 0.08329$, which is 8.33%.
- id: a2-m6-r2-h14
  lesson: a2-m6-h-continuous-growth
  topic: Continuous growth
  stem: 'The exact rule for continuous growth would be "divide 69.3 by the percent rate." Why do people use 72 instead for yearly compounding?'
  choices:
    - '72 is exact for every rate, and 69.3 is only an estimate.'
    - '72 makes the answer come out in months instead of years.'
    - 'With yearly compounding the true doubling time is a bit longer than 69.3/R near typical rates, and 72 divides easily by many numbers.'
    - 'The number $e$ is about 2.72, and 72 comes from its digits.'
  answer: 2
  explanation: |-
    With yearly compounding, $T = \dfrac{\ln 2}{\ln(1 + r)}$, and $\ln(1 + r) < r$, so $T$ is longer than $69.3/R$. Near 8%, the exact product $R \cdot T$ is about 72. And 72 divides evenly by 2, 3, 4, 6, 8, 9 and 12. It is still only a rule of thumb, not exact for every rate.

# ---------- Honors: logarithmic scales and fitting models to data ----------
- id: a2-m6-r2-h15
  lesson: a2-m6-h-log-scales
  type: label
  topic: Logarithmic scales
  stem: 'This logarithmic scale runs from 1 to 1,000. Which number belongs at each numbered mark?'
  image: {src: images/a2-m6-log-scale-blank.svg, alt: 'A logarithmic scale with 1, 10, 100 and 1,000 labeled at equal spacing and unlabeled tick marks between them that crowd toward the right in each section. Four numbered markers sit above four of the unlabeled marks.'}
  labels:
    - {x: 16.1, y: 42.0, text: '2'}
    - {x: 27.3, y: 42.0, text: '5'}
    - {x: 44.4, y: 42.0, text: '20'}
    - {x: 77.6, y: 42.0, text: '300'}
  distractors: ['50', '200']
  explanation: |-
    Position is proportional to $\log x$. Marker 1 is the first mark after 1, about 30% of the way to 10 ($\log 2 \approx 0.30$). Marker 2 is the fourth mark after 1, about 70% of the way ($\log 5 \approx 0.70$). Marker 3 is the first mark after 10, so it is 20. Marker 4 is the second mark after 100, so it is 300 (about 48% of the way, $\log 3 \approx 0.48$).
- id: a2-m6-r2-h16
  lesson: a2-m6-h-log-scales
  topic: Logarithmic scales
  stem: 'One sound has 1,000 times the intensity of another. How much higher is its sound level?'
  choices: ['1,000 dB', '3 dB', '300 dB', '30 dB']
  answer: 3
  explanation: |-
    $L = 10\log\dfrac{I}{I_0}$, so multiplying $I$ by $1000 = 10^3$ adds $10\log 10^3 = 30$ dB. Each factor of 10 adds 10 dB.
- id: a2-m6-r2-h17
  lesson: a2-m6-h-log-scales
  topic: Logarithmic scales
  stem: 'A sound has intensity $10^{-4}$ W/m². Using $L = 10\log\dfrac{I}{10^{-12}}$, what is its sound level?'
  choices: ['80 dB', '8 dB', '40 dB', '160 dB']
  answer: 0
  explanation: |-
    $\dfrac{10^{-4}}{10^{-12}} = 10^{8}$, and $10\log 10^8 = 10 \cdot 8 = 80$ dB. 8 forgets the factor 10, 40 uses the exponent $-4$ alone, and 160 adds the exponents instead of subtracting.
- id: a2-m6-r2-h18
  lesson: a2-m6-h-log-scales
  topic: Logarithmic scales
  stem: 'On the moment magnitude scale, each step of 1 means about $10^{1.5} \approx 32$ times the energy. About how many times more energy does a magnitude 6 earthquake release than a magnitude 4?'
  choices: ['About 64 times', 'About 1,000 times', 'About 100 times', 'About 2 times']
  answer: 1
  explanation: |-
    Two steps multiply the energy by $(10^{1.5})^2 = 10^3 = 1000$. 64 adds the factors instead of multiplying them, 100 uses a factor of 10 per step (that's the amplitude rule of Richter's original scale), and 2 treats the scale as linear.
- id: a2-m6-r2-h19
  lesson: a2-m6-h-log-scales
  type: text
  topic: Logarithmic scales
  stem: 'Doubling the intensity of a sound raises its level by about ___ dB. Give a whole number.'
  accept: ['3', '3.01']
  explanation: |-
    $10\log(2I/I_0) = 10\log 2 + 10\log(I/I_0)$, and $10\log 2 \approx 3.01$. So two equal sources together are about 3 dB louder than one, not twice the decibels.
- id: a2-m6-r2-h20
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'Data plotted as $\log y$ against $x$ fall on the line $\log y = 1 + 0.3x$. Which model fits the data?'
  choices: ['$y = 1 + 0.3x$', '$y = 10x^{0.3}$', '$y \approx 10(2.0)^x$', '$y = 0.3^x$']
  answer: 2
  explanation: |-
    Undo the log: $y = 10^{1 + 0.3x} = 10^1 \cdot (10^{0.3})^x \approx 10(1.995)^x$. A straight semi-log graph means an exponential model, with $a = 10^{\text{intercept}}$ and $b = 10^{\text{slope}}$. $y = 10x^{0.3}$ would need $\log x$ on the horizontal axis.
- id: a2-m6-r2-h21
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'Which exponential model $y = ab^x$ passes through $(1, 6)$ and $(4, 162)$?'
  choices: ['$y = 6 \cdot 3^x$', '$y = 3 \cdot 2^x$', '$y = 52x - 46$', '$y = 2 \cdot 3^x$']
  answer: 3
  explanation: |-
    Divide: $\dfrac{ab^4}{ab} = \dfrac{162}{6}$, so $b^3 = 27$ and $b = 3$. Then $3a = 6$, so $a = 2$. Check: $2 \cdot 3^4 = 162$. $y = 52x - 46$ is the line through the points, not an exponential, and $6 \cdot 3^x$ uses 6 as the value at $x = 0$ instead of $x = 1$.
- id: a2-m6-r2-h22
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'On a log-log graph, data fall on the line $\log y = 0.3 + 1.5\log x$. Which model fits?'
  choices: ['$y \approx 2x^{1.5}$', '$y \approx 2(1.5)^x$', '$y = 0.3x^{1.5}$', '$y \approx 2(31.6)^x$']
  answer: 0
  explanation: |-
    $y = 10^{0.3} \cdot 10^{1.5\log x} = 10^{0.3}x^{1.5} \approx 2x^{1.5}$. A straight log-log graph means a power function, and the slope is the exponent. The exponential choices would be straight on a semi-log graph instead, and $0.3x^{1.5}$ forgets to undo the log of the coefficient.
- id: a2-m6-r2-h23
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'By Kepler''s third law, $T^2 = a^3$ ($T$ in years, $a$ in AU). An asteroid orbits at an average distance of 4 AU. What is its period?'
  choices: ['16 years', '8 years', '6 years', 'About 2.5 years']
  answer: 1
  explanation: |-
    $T = a^{3/2} = 4^{1.5} = (\sqrt4)^3 = 8$ years. 16 is $a^2$, 6 is $1.5a$, and about 2.5 is $4^{2/3}$, which has the exponent upside down.
- id: a2-m6-r2-h24
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'Each data set gives $y$ at $x = 0, 1, 2, 3$. Which would lie on a straight line on a semi-log graph ($\log y$ against $x$)? Select all that apply.'
  choices:
    - '3, 6, 12, 24'
    - '5, 10, 15, 20'
    - '80, 40, 20, 10'
    - '1, 4, 9, 16'
  answer: [0, 2]
  explanation: |-
    A semi-log graph is straight when $y$ has a constant ratio for each step in $x$: 3, 6, 12, 24 doubles and 80, 40, 20, 10 halves. 5, 10, 15, 20 has a constant difference (linear), and 1, 4, 9, 16 are squares, $(x + 1)^2$, whose ratios shrink (4, 2.25, 1.78).
- id: a2-m6-r2-h25
  lesson: a2-m6-h-log-scales
  type: match
  topic: Fitting models to data
  stem: 'Match each pattern in a table of data to the model it suggests. (A model can be used more than once.)'
  pairs:
    - [Equal steps in x give equal differences in y, Linear]
    - [Equal steps in x give equal ratios in y, Exponential]
    - [The graph of log y against x is a straight line, Exponential]
    - [The graph of log y against log x is a straight line, Power]
  distractors: [Logarithmic]
  explanation: |-
    Constant differences mean a linear model. Constant ratios mean an exponential model, which is the same as a straight semi-log graph, since $\log y = \log a + x\log b$. A straight log-log graph means a power model, $\log y = \log a + p\log x$.
- id: a2-m6-r2-h26
  lesson: a2-m6-h-log-scales
  type: order
  topic: Fitting models to data
  stem: 'Put the steps for fitting $y = ab^x$ to data with a semi-log graph in order.'
  items:
    - 'Take the logarithm of each y-value'
    - 'Plot log y against x'
    - 'Find the slope m and intercept c of the straight line'
    - 'Back-transform: b = 10 to the m and a = 10 to the c'
  explanation: |-
    You need the logs before you can plot them, the plot before you can read the line, and the line's slope and intercept before you can undo the logarithms. Since $\log y = \log a + x\log b$, the slope is $\log b$ and the intercept is $\log a$.
- id: a2-m6-r2-h27
  lesson: a2-m6-h-log-scales
  type: text
  topic: Logarithmic scales
  stem: 'On a logarithmic scale, 1 and 10 are 5 cm apart. The number 100 is ___ cm from 1. Give only the number.'
  accept: ['10']
  explanation: |-
    Each factor of 10 takes the same distance, 5 cm. From 1 to 100 is two factors of 10, so 10 cm.
- id: a2-m6-r2-h28
  lesson: a2-m6-h-log-scales
  topic: Fitting models to data
  stem: 'For the planets, $\log T$ against $\log a$ is a straight line through $(0, 0)$ with slope 1.5. What does this show?'
  choices:
    - 'The period grows exponentially with distance: $T = 1.5^a$.'
    - 'The period is proportional to distance: $T = 1.5a$.'
    - 'The period grows by 1.5 years for each AU.'
    - 'The period is a power of distance: $T = a^{1.5}$, so $T^2 = a^3$.'
  answer: 3
  explanation: |-
    A straight log-log graph means a power law, $\log T = \log(\text{coefficient}) + 1.5\log a$. The intercept 0 makes the coefficient $10^0 = 1$, so $T = a^{1.5}$; squaring gives Kepler's third law, $T^2 = a^3$. The other choices describe exponential or linear models, which would not be straight on a log-log graph.
