# Round 2 questions for module a2-m4 (Radicals and rational exponents)
# Core lessons: a2-m4-r2-q01 … q12. Honors lessons: a2-m4-r2-h01 … h28.

# ---- Lesson 13: Radicals and rational exponents (alg-radicals) ----
- id: a2-m4-r2-q01
  lesson: alg-radicals
  type: text
  module_quiz: true
  topic: Rational exponents
  stem: 'Evaluate without a calculator: $16^{3/4} =$ ___ and $16^{-1/2} =$ ___.'
  accept:
    - ['8']
    - ['1/4', '0.25']
  explanation: |-
    The denominator is the root. $\sqrt[4]{16} = 2$, so $16^{3/4} = 2^3 = 8$. For the second, $\sqrt{16} = 4$, and the negative exponent means a reciprocal: $16^{-1/2} = \tfrac14$.
- id: a2-m4-r2-q02
  lesson: alg-radicals
  type: label
  module_quiz: true
  topic: Rational exponents
  stem: 'Name the numbered parts of $5\sqrt[3]{2x}$ (left) and $8^{2/3}$ (right).'
  image: {src: images/a2-m4-radical-parts-blank.svg, alt: 'Left panel, radical form: 5 times the cube root of 2x. Right panel, rational exponent form: 8 to the power two thirds, followed by "= (cube root of 8) squared = 4". Six parts are numbered: the 5, the small 3 on the radical sign, the 2x under the radical, the 8, and the top and bottom numbers of the fraction exponent.'}
  labels:
    - {x: 8.5, y: 66, text: Coefficient}
    - {x: 16.5, y: 40, text: Index of the radical}
    - {x: 35.3, y: 68, text: Radicand}
    - {x: 65.6, y: 68.5, text: Base}
    - {x: 69, y: 28.5, text: Numerator of the exponent (the power)}
    - {x: 69, y: 44, text: Denominator of the exponent (the root)}
  distractors: [Conjugate, Like radical]
  explanation: |-
    1: the 5 multiplies the radical, so it is the coefficient. 2: the small 3 is the index (a cube root). 3: $2x$, under the radical sign, is the radicand. 4: in $8^{2/3}$ the 8 is the base. 5 and 6: in the exponent $\tfrac23$, the numerator 2 is the power and the denominator 3 is the root, so $8^{2/3} = \left(\sqrt[3]{8}\right)^2 = 4$.
- id: a2-m4-r2-q03
  lesson: alg-radicals
  type: match
  topic: Rational exponents
  stem: 'Match each expression to its value.'
  pairs:
    - ['$27^{2/3}$', '9']
    - ['$32^{-2/5}$', '1/4']
    - ['$(-27)^{1/3}$', '−3']
    - ['$(-16)^{1/4}$', 'Not a real number']
  distractors: ['−9', '4']
  explanation: |-
    $27^{2/3} = \left(\sqrt[3]{27}\right)^2 = 3^2 = 9$. $32^{-2/5} = \dfrac{1}{\left(\sqrt[5]{32}\right)^2} = \dfrac{1}{2^2} = \tfrac14$. An odd root of a negative is real: $(-27)^{1/3} = -3$. An even root of a negative is not real, so $(-16)^{1/4}$ is not a real number. $-9$ would come from treating the exponent $\tfrac23$ as making the answer negative, and 4 from $32^{2/5}$ without the reciprocal.
- id: a2-m4-r2-q04
  lesson: alg-radicals
  topic: Radicals
  stem: 'Which of these can be combined with $\sqrt3$ into a single term after simplifying? Select all that apply.'
  choices: ['$\sqrt{12}$', '$\sqrt{18}$', '$\sqrt{75}$', '$\sqrt{30}$', '$\sqrt[3]{3}$']
  answer: [0, 2]
  explanation: |-
    Like radicals need the same index and the same radicand after simplifying. $\sqrt{12} = 2\sqrt3$ and $\sqrt{75} = 5\sqrt3$ are like $\sqrt3$. $\sqrt{18} = 3\sqrt2$ has radicand 2, $\sqrt{30}$ has no square factor to remove, and $\sqrt[3]{3}$ has index 3, so none of those combine with $\sqrt3$.
- id: a2-m4-r2-q05
  lesson: alg-radicals
  type: order
  topic: Radicals
  stem: 'Put these numbers in order from smallest to largest.'
  items: ['$\sqrt[3]{20}$', '$\sqrt{8}$', '$\sqrt[4]{81}$', '$\sqrt{10}$', '$16^{3/4}$']
  explanation: |-
    $\sqrt[4]{81} = 3$ exactly and $16^{3/4} = 2^3 = 8$. Since $8 < 9 < 10$, $\sqrt8 < 3 < \sqrt{10}$. To compare $\sqrt[3]{20}$ with $\sqrt8$, raise both to the 6th power: $\left(\sqrt[3]{20}\right)^6 = 20^2 = 400$ and $\left(\sqrt8\right)^6 = 8^3 = 512$, so $\sqrt[3]{20}$ is smaller. Order: $\sqrt[3]{20} \approx 2.71$, $\sqrt8 \approx 2.83$, $3$, $\sqrt{10} \approx 3.16$, $8$.
- id: a2-m4-r2-q06
  lesson: alg-radicals
  topic: Radicals
  stem: 'To rationalize the denominator of $\dfrac{5}{\sqrt[3]{2}}$, multiply the top and bottom by which number?'
  choices: ['$\sqrt[3]{2}$', '$\sqrt{2}$', '$\sqrt[3]{4}$', '$\sqrt[3]{8}$']
  answer: 2
  explanation: |-
    The denominator needs to become a perfect cube under the cube root: $\sqrt[3]{2} \cdot \sqrt[3]{4} = \sqrt[3]{8} = 2$, giving $\dfrac{5\sqrt[3]{4}}{2}$. Multiplying by $\sqrt[3]{2}$ only gives $\sqrt[3]{4}$, still irrational. $\sqrt2$ has the wrong index, and $\sqrt[3]{8} = 2$ is just a whole number, so multiplying by it leaves $2\sqrt[3]{2}$ in the denominator.

# ---- Lesson 14: Radical equations (alg-radical-eq) ----
- id: a2-m4-r2-q07
  lesson: alg-radical-eq
  type: order
  module_quiz: true
  topic: Radical equations
  stem: 'Put the steps for solving $\sqrt{x + 7} - 1 = x$ in order.'
  items:
    - 'Add 1 to both sides: $\sqrt{x + 7} = x + 1$'
    - 'Square both sides: $x + 7 = x^2 + 2x + 1$'
    - 'Rearrange: $x^2 + x - 6 = 0$'
    - 'Factor to get the candidates $x = -3$ and $x = 2$'
    - 'Check both in the original equation and reject $x = -3$'
  explanation: |-
    Isolate the radical first, then square, solve, and check. At $x = 2$: $\sqrt9 - 1 = 2$, true. At $x = -3$: $\sqrt4 - 1 = 1 \ne -3$, so $-3$ is extraneous.
- id: a2-m4-r2-q08
  lesson: alg-radical-eq
  type: text
  topic: Radical equations
  stem: 'Solve $\sqrt{2x + 7} = x + 2$. It has one solution. Give only the number: $x =$ ___'
  accept: ['1']
  explanation: |-
    Square: $2x + 7 = x^2 + 4x + 4$, so $x^2 + 2x - 3 = 0$ and $(x + 3)(x - 1) = 0$. Check $x = 1$: $\sqrt9 = 3 = 1 + 2$, true. Check $x = -3$: $\sqrt1 = 1$ but $-3 + 2 = -1$, so $-3$ is extraneous. The solution is $x = 1$.
- id: a2-m4-r2-q09
  lesson: alg-radical-eq
  type: label
  module_quiz: true
  topic: Radical equations
  stem: 'The picture shows the graphs used to solve $\sqrt{x + 7} = x + 1$, together with the lower half of the same sideways parabola. Name the numbered parts.'
  image: {src: images/a2-m4-extraneous-blank.svg, alt: 'A coordinate grid with a sideways parabola opening to the right from (−7, 0): its upper half is solid and its lower half is dashed. A straight line with slope 1 crosses the solid upper half at (2, 3) and the dashed lower half at (−3, −2). Five places are numbered: a point on the solid curve, a point on the dashed curve, a point on the line, and the two crossing points.'}
  labels:
    - {x: 33.3, y: 38.6, text: Graph of y = √(x + 7)}
    - {x: 66.7, y: 73.7, text: Graph of y = −√(x + 7)}
    - {x: 83.3, y: 17.3, text: Graph of y = x + 1}
    - {x: 73.3, y: 28.8, text: 'The solution, x = 2'}
    - {x: 40, y: 67.3, text: 'The extraneous value, x = −3'}
  distractors: [Vertex of the parabola, y-intercept of the line]
  explanation: |-
    A principal square root is never negative, so $y = \sqrt{x + 7}$ is the solid upper half (1) and $y = -\sqrt{x + 7}$ the dashed lower half (2). The straight line is $y = x + 1$ (3). The line meets the upper half at $(2, 3)$, the true solution (4). Squaring also finds where it meets the lower half, at $(-3, -2)$: that value solves $-\sqrt{x + 7} = x + 1$, not the original, so it is extraneous (5).
- id: a2-m4-r2-q10
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'Which of these equations have no real solution? Select all that apply.'
  choices: ['$\sqrt{x - 2} = -1$', '$\sqrt[3]{x - 2} = -1$', '$x^{4/3} = -16$', '$\sqrt{x + 1} + 3 = 1$', '$x^{3/2} = 8$']
  answer: [0, 2, 3]
  explanation: |-
    A principal square root can't be negative, so $\sqrt{x - 2} = -1$ has no solution, and neither does $\sqrt{x + 1} + 3 = 1$ (it says $\sqrt{x + 1} = -2$). $x^{4/3} = \left(\sqrt[3]{x}\right)^4$ is an even power, never negative, so it can't equal $-16$. A cube root can be negative: $\sqrt[3]{x - 2} = -1$ gives $x - 2 = -1$, $x = 1$. And $x^{3/2} = 8$ gives $x = 8^{2/3} = 4$.
- id: a2-m4-r2-q11
  lesson: alg-radical-eq
  type: match
  topic: Radical equations
  stem: 'Match each equation to the best first move.'
  pairs:
    - ['$\sqrt{x} + 4 = 9$', 'Subtract 4 from both sides']
    - ['$\sqrt[3]{2x + 1} = 3$', 'Cube both sides']
    - ['$(x - 1)^{3/4} = 8$', 'Raise both sides to the power 4/3']
    - ['$x^{2/3} = 9$', 'Write it as (cube root of x)² = 9, so the cube root of x is ±3']
  distractors: ['Square both sides']
  explanation: |-
    Isolate the radical before raising to a power: subtract 4 first in $\sqrt x + 4 = 9$ (then $x = 25$). A cube root is undone by cubing: $2x + 1 = 27$, $x = 13$. For $(x - 1)^{3/4} = 8$, the numerator 3 is odd, so the reciprocal power works: $x - 1 = 8^{4/3} = 16$, $x = 17$. For $x^{2/3} = 9$ the numerator is even, so keep both signs: $\sqrt[3]{x} = \pm 3$ and $x = \pm 27$. Squaring first in $\sqrt x + 4 = 9$ would leave a radical in the cross term.
- id: a2-m4-r2-q12
  lesson: alg-radical-eq
  topic: Radical equations
  stem: 'A student squares both sides of $\sqrt{x + 1} = x - 5$ and gets the candidates $x = 3$ and $x = 8$. What is the solution set of the original equation?'
  choices: ['$x = 3$ only', '$x = 8$ only', '$x = 3$ and $x = 8$', 'No solution']
  answer: 1
  explanation: |-
    Check each: at $x = 8$, $\sqrt9 = 3$ and $8 - 5 = 3$, true. At $x = 3$, $\sqrt4 = 2$ but $3 - 5 = -2$, false. A faster sign check: the right side must be at least 0, so $x \ge 5$, which rules out 3 at once. Only $x = 8$ works.

# ---- Honors: Irrational roots, proof and approximation (a2-m4-h-irrational-roots) ----
- id: a2-m4-r2-h01
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'Which number is irrational?'
  choices: ['$\sqrt{49}$', '$\sqrt[3]{64}$', '$\sqrt{50}$', '$0.\overline{12}$']
  answer: 2
  explanation: |-
    50 is not a perfect square, so $\sqrt{50} = 5\sqrt2$ is irrational. $\sqrt{49} = 7$ and $\sqrt[3]{64} = 4$ are integers, and the repeating decimal $0.\overline{12} = \tfrac{12}{99} = \tfrac{4}{33}$ is rational.
- id: a2-m4-r2-h02
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'Which of these numbers are rational? Select all that apply.'
  choices: ['$\sqrt[3]{-27}$', '$\sqrt{18}$', '$\sqrt{2} \cdot \sqrt{8}$', '$\sqrt[4]{16}$', '$\sqrt2 + \sqrt8$']
  answer: [0, 2, 3]
  explanation: |-
    $\sqrt[3]{-27} = -3$, $\sqrt2 \cdot \sqrt8 = \sqrt{16} = 4$ and $\sqrt[4]{16} = 2$ are integers, so rational. $\sqrt{18} = 3\sqrt2$ is irrational, and so is $\sqrt2 + \sqrt8 = \sqrt2 + 2\sqrt2 = 3\sqrt2$. A product of irrationals can be rational; here the sum is not.
- id: a2-m4-r2-h03
  lesson: a2-m4-h-irrational-roots
  type: order
  topic: Irrational numbers
  stem: 'Put the steps of the proof that $\sqrt2$ is irrational in order.'
  items:
    - 'Assume $\sqrt2 = \tfrac{a}{b}$, a fraction in lowest terms'
    - 'Square and clear the fraction: $a^2 = 2b^2$'
    - 'Conclude that $a$ is even and write $a = 2c$'
    - 'Substitute to get $b^2 = 2c^2$, so $b$ is even'
    - 'Note that $a$ and $b$ share the factor 2, contradicting lowest terms'
  explanation: |-
    A proof by contradiction starts from the assumption, then each step uses the one before: $a^2 = 2b^2$ shows $a^2$ is even, so $a$ is even; substituting $a = 2c$ shows $b$ is even; both even contradicts "lowest terms", so the assumption is false.
- id: a2-m4-r2-h04
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'In the proof that $\sqrt2$ is irrational, $a^2 = 2b^2$ leads to "$a$ is even". Which fact justifies that step?'
  choices: ['If $a$ is even, then $a^2$ is even', 'If $a^2$ is even, then $a$ is even', 'Every fraction can be reduced to lowest terms', 'The decimal $1.414\ldots$ never repeats']
  answer: 1
  explanation: |-
    We know $a^2$ is even and want to conclude about $a$, so we need "if $a^2$ is even, then $a$ is even" (true, because an odd number squared is odd). The statement "if $a$ is even, then $a^2$ is even" goes the wrong direction. Reducing fractions is used at the start, not here, and a calculator decimal proves nothing.
- id: a2-m4-r2-h05
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'Why does the argument that proves $\sqrt3$ irrational fail when you try it on $\sqrt4$?'
  choices: ['Because $\sqrt4$ is itself irrational', 'Because $a^2 = 4b^2$ has no whole-number solutions', 'Because the argument only works for odd numbers', 'Because $4 \mid a^2$ does not force $4 \mid a$, since 4 is not prime']
  answer: 3
  explanation: |-
    The key step "a prime that divides $a^2$ divides $a$" needs a prime. With 4, $a = 2$ gives $4 \mid a^2$ but $4 \nmid a$, so the chain breaks. In fact $a^2 = 4b^2$ has solutions ($a = 2$, $b = 1$), because $\sqrt4 = 2$ is rational. The method also works for $\sqrt2$, so it isn't limited to odd numbers.
- id: a2-m4-r2-h06
  lesson: a2-m4-h-irrational-roots
  type: text
  topic: Irrational numbers
  stem: 'Exactly one whole number $k$ from 10 to 20 makes $\sqrt[4]{k}$ rational. Give only the number: $k =$ ___'
  accept: ['16']
  explanation: |-
    $\sqrt[n]{k}$ is rational exactly when $k$ is a perfect $n$th power. The fourth powers are $1, 16, 81, \ldots$, and only 16 lies between 10 and 20: $\sqrt[4]{16} = 2$. Every other $k$ in that range gives an irrational fourth root.
- id: a2-m4-r2-h07
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'By the rational root theorem, the only possible rational roots of $x^3 - 6 = 0$ are $\pm1, \pm2, \pm3, \pm6$. What does this show about $\sqrt[3]{6}$?'
  choices: ['It equals 2, the closest candidate', 'It is rational but not a whole number', 'It is irrational, since no candidate cubes to 6', 'Nothing, because the theorem only lists candidates']
  answer: 2
  explanation: |-
    $\sqrt[3]{6}$ is a root of $x^3 - 6 = 0$. If it were rational it would be on the list, but $1^3 = 1$, $2^3 = 8$, $3^3 = 27$, $6^3 = 216$ (and the negatives give negative cubes), so none equals 6. Since the list contains every possible rational root, $\sqrt[3]{6}$ is irrational. $2^3 = 8 \ne 6$, so it isn't 2.
- id: a2-m4-r2-h08
  lesson: a2-m4-h-irrational-roots
  topic: Irrational numbers
  stem: 'To prove $\sqrt3 + \sqrt5$ is irrational, suppose it equals a rational number $r$ and square both sides. Which radical can then be isolated and shown to be irrational?'
  choices: ['$\sqrt{8}$', '$\sqrt{15}$', '$\sqrt{2}$', '$\sqrt{34}$']
  answer: 1
  explanation: |-
    $r^2 = 3 + 2\sqrt{15} + 5 = 8 + 2\sqrt{15}$, so $\sqrt{15} = \dfrac{r^2 - 8}{2}$ would be rational. But 15 is not a perfect square, so $\sqrt{15}$ is irrational, a contradiction. $\sqrt8$ comes from adding the radicands, which isn't how squaring works.
- id: a2-m4-r2-h09
  lesson: a2-m4-h-irrational-roots
  type: text
  topic: Approximating roots
  stem: 'Do one step of Heron''s method for $\sqrt{30}$, starting from $x = 5$. The next guess is ___.'
  accept: ['5.5']
  explanation: |-
    $\tfrac{30}{5} = 6$, and the average of the two sides is $\tfrac12(5 + 6) = 5.5$. (The true value is $\sqrt{30} \approx 5.4772$.)
- id: a2-m4-r2-h10
  lesson: a2-m4-h-irrational-roots
  topic: Approximating roots
  stem: 'Continue Heron''s method for $\sqrt{30}$ from the guess $x = 5.5$. To 4 decimal places, the next guess is:'
  choices: ['$5.4773$', '$5.4545$', '$5.5000$', '$17.7500$']
  answer: 0
  explanation: |-
    $\tfrac{30}{5.5} = 5.4545\ldots$, and $\tfrac12(5.5 + 5.4545\ldots) = 5.4773$ (to 4 decimal places); $\sqrt{30} = 5.47723\ldots$. $5.4545$ is the other side of the rectangle, not the average, and $17.75$ averages $5.5$ with 30 itself.
- id: a2-m4-r2-h11
  lesson: a2-m4-h-irrational-roots
  type: match
  topic: Approximating roots
  stem: 'Match each iteration to the number its guesses approach.'
  pairs:
    - ['$x \to \tfrac12\left(x + \tfrac{7}{x}\right)$', 'Square root of 7']
    - ['$x \to \tfrac13\left(2x + \tfrac{7}{x^2}\right)$', 'Cube root of 7']
    - ['$x \to \tfrac12\left(x + \tfrac{49}{x}\right)$', '7']
    - ['$x \to \tfrac13\left(2x + \tfrac{8}{x^2}\right)$', '2']
  distractors: ['3.5']
  explanation: |-
    Heron's method $\tfrac12\left(x + \tfrac{n}{x}\right)$ approaches $\sqrt n$, and $\tfrac13\left(2x + \tfrac{n}{x^2}\right)$ approaches $\sqrt[3]{n}$. So the iterations approach $\sqrt7$, $\sqrt[3]{7}$, $\sqrt{49} = 7$ and $\sqrt[3]{8} = 2$. 3.5 is $\tfrac72$, half of 7, which is not a root of 7 at all.
- id: a2-m4-r2-h12
  lesson: a2-m4-h-irrational-roots
  topic: Approximating roots
  stem: 'A Heron''s-method guess for $\sqrt{n}$ is about 3 and is off by about $0.002$. About how large is the error after one more step?'
  choices: ['About $0.001$', 'About $0.000004$', 'About $0.0006$', 'About $0.0000007$']
  answer: 3
  explanation: |-
    The new error is $\dfrac{e^2}{2x} \approx \dfrac{(0.002)^2}{2 \cdot 3} = \dfrac{0.000004}{6} \approx 0.0000007$. $0.000004$ squares the error but forgets to divide by $2x$, and $0.001$ just halves it. The error is squared, not cut by a fixed fraction.
- id: a2-m4-r2-h13
  lesson: a2-m4-h-irrational-roots
  topic: Approximating roots
  stem: 'Which statements about Heron''s method for $\sqrt{n}$, with $n$ a positive whole number, are true? Select all that apply.'
  choices:
    - 'After the first step, every guess is greater than or equal to $\sqrt n$'
    - 'Once a guess is close, the number of correct digits roughly doubles with each step'
    - 'If the starting guess is rational, every guess is rational'
    - 'The guesses alternate between too big and too small'
    - 'For $n = 2$, enough steps give the exact decimal value of $\sqrt2$'
  answer: [0, 1, 2]
  explanation: |-
    The lesson showed $\left(\tfrac{x + n/x}{2}\right)^2 - n = \left(\tfrac{x - n/x}{2}\right)^2 \ge 0$, so every guess after the first is at least $\sqrt n$; they don't alternate. The error formula $\tfrac{e^2}{2x}$ makes the correct digits roughly double. Adding, dividing and halving rational numbers gives rational numbers, so every guess is a fraction, which is why no finite number of steps can produce the irrational $\sqrt2$ exactly.
- id: a2-m4-r2-h14
  lesson: a2-m4-h-irrational-roots
  topic: Approximating roots
  stem: 'Use one step of $x \to \tfrac13\left(2x + \tfrac{n}{x^2}\right)$ to estimate $\sqrt[3]{20}$, starting from $x = 3$. To 4 decimal places, the result is:'
  choices: ['$2.7407$', '$4.2222$', '$4.1111$', '$2.6111$']
  answer: 0
  explanation: |-
    $\tfrac{20}{3^2} = 2.2222$, and $\tfrac13(3 + 3 + 2.2222) = \tfrac{8.2222}{3} = 2.7407$. The true value is $\sqrt[3]{20} \approx 2.7144$. $4.2222$ uses $\tfrac{20}{x}$ instead of $\tfrac{20}{x^2}$, $4.1111$ divides by 2 instead of 3, and $2.6111$ averages only $x$ and $\tfrac{20}{x^2}$.

# ---- Honors: Power functions and power laws (a2-m4-h-power-laws) ----
- id: a2-m4-r2-h15
  lesson: a2-m4-h-power-laws
  topic: Power functions
  stem: 'What is the domain of $f(x) = x^{3/4}$?'
  choices: ['$x \ge 0$', 'All real numbers', '$x > 0$', '$x \ne 0$']
  answer: 0
  explanation: |-
    $x^{3/4} = \left(\sqrt[4]{x}\right)^3$. The denominator 4 is even, so $x$ can't be negative. The exponent is positive, so $x = 0$ is allowed ($0^{3/4} = 0$). The domain is $x \ge 0$.
- id: a2-m4-r2-h16
  lesson: a2-m4-h-power-laws
  type: match
  topic: Power functions
  stem: 'Match each function to its domain.'
  pairs:
    - ['$f(x) = x^{2/5}$', 'All real numbers']
    - ['$f(x) = x^{5/2}$', 'x ≥ 0']
    - ['$f(x) = x^{-1/3}$', 'All real numbers except 0']
    - ['$f(x) = x^{-3/4}$', 'x > 0']
  distractors: ['x ≤ 0']
  explanation: |-
    Look at the denominator, then the sign. $x^{2/5}$: odd denominator, positive exponent, so every real $x$. $x^{5/2}$: even denominator, so $x \ge 0$. $x^{-1/3}$: odd denominator, but a negative exponent means a reciprocal, so $x \ne 0$. $x^{-3/4}$: even denominator and negative exponent, so $x > 0$.
- id: a2-m4-r2-h17
  lesson: a2-m4-h-power-laws
  topic: Power functions
  stem: 'Following this course''s rule of reducing the exponent first, what is $(-8)^{2/6}$?'
  choices: ['$2$', '$-2$', 'Not a real number', '$4$']
  answer: 1
  explanation: |-
    Reduce $\tfrac26 = \tfrac13$, so $(-8)^{2/6} = (-8)^{1/3} = -2$. Squaring first, $\left((-8)^2\right)^{1/6} = 64^{1/6} = 2$, gives a different answer, which is exactly why the exponent must be in lowest terms when the base is negative. Taking the sixth root first would give "not a real number". $4$ is $(-8)^{2/3}$.
- id: a2-m4-r2-h18
  lesson: a2-m4-h-power-laws
  type: text
  topic: Power functions
  stem: 'Evaluate $(x^2)^{1/2}$ at $x = -5$. Give only the number: ___'
  accept: ['5']
  explanation: |-
    $\left((-5)^2\right)^{1/2} = 25^{1/2} = 5$. In general $(x^2)^{1/2} = \sqrt{x^2} = |x|$, the nonnegative number whose square is $x^2$. The shortcut $(x^2)^{1/2} = x^{2 \cdot 1/2} = x$ would give $-5$, which is wrong because the power rule needs a positive base.
- id: a2-m4-r2-h19
  lesson: a2-m4-h-power-laws
  topic: Power functions
  stem: 'Which expressions equal $|x|^3$ for every real number $x$? Select all that apply.'
  choices: ['$(x^6)^{1/2}$', '$x^3$', '$|x^3|$', '$\sqrt[3]{x^9}$']
  answer: [0, 2]
  explanation: |-
    $(x^6)^{1/2} = \sqrt{(x^3)^2} = |x^3| = |x|^3$. $x^3$ and $\sqrt[3]{x^9} = x^3$ are negative when $x$ is negative (an odd root keeps the sign), so they differ from $|x|^3$ there: at $x = -1$ they give $-1$, not $1$.
- id: a2-m4-r2-h20
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'A planet orbits the Sun at an average distance of $a = 4$ AU. By Kepler''s third law, $T = a^{3/2}$, what is its period?'
  choices: ['$6$ years', '$64$ years', '$2.5$ years', '$8$ years']
  answer: 3
  explanation: |-
    $4^{3/2} = \left(\sqrt4\right)^3 = 2^3 = 8$ years. $6$ multiplies 4 by $\tfrac32$, $64$ is $4^3$ without the square root, and about $2.5$ is $4^{2/3}$, the reciprocal power.
- id: a2-m4-r2-h21
  lesson: a2-m4-h-power-laws
  type: text
  topic: Power laws
  stem: 'An asteroid takes 27 years to orbit the Sun. By Kepler''s third law its average distance is $a = T^{2/3} =$ ___ AU.'
  accept: ['9']
  explanation: |-
    $27^{2/3} = \left(\sqrt[3]{27}\right)^2 = 3^2 = 9$ AU. Check: $9^{3/2} = 3^3 = 27$ years.
- id: a2-m4-r2-h22
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'Mars orbits at about $1.52$ AU. By $T = a^{3/2}$, its period is closest to:'
  choices: ['$1.3$ years', '$2.3$ years', '$1.9$ years', '$3.5$ years']
  answer: 2
  explanation: |-
    $1.52^{3/2} = \sqrt{1.52}^{\,3} \approx 1.233^3 \approx 1.87$, so about $1.9$ years (the measured Martian year is about 687 days). $1.3$ is $1.52^{2/3}$, $2.3$ is $1.52^2$, and $3.5$ is $1.52^3$.
- id: a2-m4-r2-h23
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'A statue is copied at a larger size with every length 4 times as long. How many times as much paint (surface area) and bronze (volume) does the copy need?'
  choices: ['4 and 16 times', '16 and 64 times', '8 and 64 times', '16 and 48 times']
  answer: 1
  explanation: |-
    By the square–cube law, areas scale by $4^2 = 16$ and volumes by $4^3 = 64$. "4 and 16" scales area like length, and 48 comes from $16 \cdot 3$ instead of $4^3$.
- id: a2-m4-r2-h24
  lesson: a2-m4-h-power-laws
  type: order
  topic: Power functions
  stem: 'Let $x = 0.25$. Put these values in order from smallest to largest.'
  items: ['$x^{3}$', '$x^{3/2}$', '$x$', '$x^{1/2}$', '$x^{1/4}$']
  explanation: |-
    For $0 < x < 1$, a larger exponent gives a smaller value. $0.25^3 = 0.015625$, $0.25^{3/2} = 0.5^3 = 0.125$, $0.25$, $0.25^{1/2} = 0.5$ and $0.25^{1/4} = \sqrt{0.5} \approx 0.707$.
- id: a2-m4-r2-h25
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'In $y = kx^p$, multiplying $x$ by 8 multiplies $y$ by 4. What is $p$?'
  choices: ['$\tfrac32$', '$\tfrac12$', '$\tfrac23$', '$-\tfrac23$']
  answer: 2
  explanation: |-
    Scaling gives $8^p = 4$. As powers of 2: $2^{3p} = 2^2$, so $3p = 2$ and $p = \tfrac23$. $\tfrac32$ would be the answer if $x$ were multiplied by 4 and $y$ by 8, and $\tfrac12$ is $\tfrac48$, dividing the factors.
- id: a2-m4-r2-h26
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'In $y = kx^{3/2}$, multiplying $x$ by 9 multiplies $y$ by:'
  choices: ['$13.5$', '$3$', '$81$', '$27$']
  answer: 3
  explanation: |-
    The factor is $9^{3/2} = \left(\sqrt9\right)^3 = 3^3 = 27$, whatever $x$ and $k$ are. $13.5$ is $9 \cdot \tfrac32$, $3$ is only the square root, and $81 = 9^2$.
- id: a2-m4-r2-h27
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'By the approximate rule $P \approx kM^{3/4}$ (Kleiber''s law), an animal with 81 times the mass of another uses about how many times as much energy at rest?'
  choices: ['$27$ times', '$60.75$ times', '$9$ times', '$243$ times']
  answer: 0
  explanation: |-
    $81^{3/4} = \left(\sqrt[4]{81}\right)^3 = 3^3 = 27$. Per kilogram, that's $\tfrac{27}{81} = \tfrac13$ as much. $60.75$ is $81 \cdot \tfrac34$, $9$ is $81^{1/2}$, and $243$ is $81^{5/4}$. Remember the exponent $\tfrac34$ is an empirical approximation.
- id: a2-m4-r2-h28
  lesson: a2-m4-h-power-laws
  topic: Power laws
  stem: 'Which statements are true? Select all that apply.'
  choices:
    - 'In $y = kx^p$, multiplying $x$ by $c$ multiplies $y$ by $c^p$, whatever $x$ is'
    - 'The exponent $\tfrac34$ in Kleiber''s law is an approximate value found from data'
    - 'For solids of the same shape, surface area is proportional to volume to the $\tfrac23$ power'
    - 'Doubling the input of $y = x^{3/2}$ doubles the output'
    - 'Kepler''s third law says a planet''s period is proportional to its distance from the Sun'
  answer: [0, 1, 2]
  explanation: |-
    $k(cx)^p = c^p kx^p$ for every $x$. Kleiber's $\tfrac34$ is empirical and still debated. For similar solids, $A \propto L^2$ and $V \propto L^3$, so $A \propto V^{2/3}$. Doubling the input of $x^{3/2}$ multiplies the output by $2^{3/2} \approx 2.83$, not 2, and Kepler's law is $T \propto a^{3/2}$, not $T \propto a$.
