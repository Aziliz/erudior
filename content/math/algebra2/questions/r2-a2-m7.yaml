  stem: 'The fixed point of $a_n = 0.75\,a_{n-1} + 30$ is $L =$ ___'
  accept: ['120']
  explanation: |-
    $L = 0.75L + 30$ gives $0.25L = 30$, so $L = 120$. Check: $0.75(120) + 30 = 120$.
- id: a2-m7-r2-h28
  lesson: a2-m7-h-loans
  topic: Recurrence relations
  stem: 'A lake has 3000 fish. Each year the population grows by 5% and then 200 fish are caught, so $a_n = 1.05\,a_{n-1} - 200$ with $a_0 = 3000$. What happens in this model?'
  choices:
    - 'The population falls, faster and faster, until the fish are gone'
    - 'The population rises toward 4000'
    - 'The population stays at 3000'
    - 'The population levels off at 2000'
  answer: 0
  explanation: |-
    The fixed point is $L = \dfrac{-200}{1 - 1.05} = 4000$. Since $r = 1.05 > 1$, the distance from 4000 grows: $a_n = 4000 - 1000(1.05)^n$. Starting below 4000, the population drops, and it reaches 0 when $1.05^n = 4$, that is, $n = \dfrac{\ln 4}{\ln 1.05} \approx 28.4$, during year 29.
