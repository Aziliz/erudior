# Round 2: sequences and series (a2-m7). Core lessons 23-24 (q), honors lessons 24h1-24h2 (h).

# ---------- Lesson 23: arithmetic sequences ----------
- id: a2-m7-r2-q01
  lesson: alg-arith-seq
  type: text
  module_quiz: true
  topic: Arithmetic sequences
  stem: 'The 100th term of the arithmetic sequence $6, 10, 14, 18, \ldots$ is ___. (Give only the number.)'
  accept: ['402']
  explanation: |-
    $a_1 = 6$ and $d = 4$, so $a_{100} = 6 + 99(4) = 402$. Using $100d$ instead of $99d$ gives 406, which is one step too many.
- id: a2-m7-r2-q02
  lesson: alg-arith-seq
  type: order
  topic: Arithmetic sequences
  stem: 'An arithmetic sequence has $a_4 = 17$ and $a_{11} = 45$. Put the steps for finding $a_{20}$ in order.'
  items:
    - 'Count the steps from term 4 to term 11: there are 7'
    - 'Divide the change in value, 28, by 7 to get $d = 4$'
    - 'Work back from $a_4$: $a_1 = 17 - 3(4) = 5$'
    - 'Use $a_{20} = a_1 + 19d$ to get 81'
  explanation: |-
    You need the number of steps before you can find $d$, you need $d$ to work back to $a_1$, and the term formula needs both $a_1$ and $d$. This is Example 3 in the lesson.
- id: a2-m7-r2-q03
  lesson: alg-arith-seq
  module_quiz: true
  topic: Arithmetic sequences
  stem: 'Which of these sequences are arithmetic? Select all that apply.'
  choices:
    - '$a_n = 5 - 2n$'
    - '$a_1 = 3$, $a_n = a_{n-1} + 7$'
    - '$2, 4, 8, 16, \ldots$'
    - '$a_n = n^2 + 1$'
  answer: [0, 1]
  explanation: |-
    $a_n = 5 - 2n$ is linear in $n$, so consecutive terms differ by $-2$ ($3, 1, -1, \ldots$). The recursive rule adds 7 every time, so $d = 7$. The doubling sequence has differences $2, 4, 8$ (it is geometric), and $n^2 + 1$ gives $2, 5, 10, 17$ with differences $3, 5, 7$.
- id: a2-m7-r2-q04
  lesson: alg-arith-seq
  type: label
  topic: Arithmetic sequences
  stem: 'This picture shows why $1 + 2 + 3 + 4 + 5 = \dfrac{5 \cdot 6}{2}$. Name the numbered parts.'
  image: {src: images/a2-m7-staircase-blank.svg, alt: 'Five rows of squares forming a rectangle. A blue staircase has 1, 2, 3, 4 and 5 squares in its rows from top to bottom, and a yellow staircase with 5, 4, 3, 2 and 1 squares fills the rest. A measuring line runs along the top edge and another along the left edge.'}
  labels:
    - {x: 38.97, y: 62.2, text: 'The staircase 1 + 2 + 3 + 4 + 5'}
    - {x: 61.03, y: 37.8, text: 'A second copy of the staircase, turned around'}
    - {x: 50, y: 14.15, text: 'Width: n + 1 = 6 squares'}
    - {x: 24.41, y: 50, text: 'Height: n = 5 rows'}
  distractors: ['Width: n = 5 squares', 'The staircase 1 + 2 + 3 + 4 + 5 + 6']
  explanation: |-
    The blue rows hold 1, 2, 3, 4, 5 squares (1). The yellow rows hold 5, 4, 3, 2, 1: the same staircase turned around (2). Every row then has $n + 1 = 6$ squares (3), and there are $n = 5$ rows (4). Two copies make $5 \times 6 = 30$ squares, so one copy is 15, which is $\dfrac{n(a_1 + a_n)}{2}$.
- id: a2-m7-r2-q05
  lesson: alg-arith-seq
  type: match
  topic: Arithmetic sequences
  stem: 'Match each sum to its value.'
  pairs:
    - ['$\sum_{k=1}^{4} (2k + 1)$', '24']
    - ['$1 + 2 + \cdots + 10$', '55']
    - ['$\sum_{k=1}^{5} 3$', '15']
    - ['$\sum_{k=1}^{6} k$', '21']
  distractors: ['3', '45']
  explanation: |-
    $\sum_{k=1}^{4}(2k + 1) = 3 + 5 + 7 + 9 = 24$. $1 + \cdots + 10 = \tfrac{10 \cdot 11}{2} = 55$. $\sum_{k=1}^{5} 3$ adds five 3s, giving 15 (not 3). $\sum_{k=1}^{6} k = \tfrac{6 \cdot 7}{2} = 21$. 45 is $1 + \cdots + 9$.
- id: a2-m7-r2-q06
  lesson: alg-arith-seq
  type: text
  topic: Arithmetic sequences
  stem: 'The sum of the first 15 odd numbers, $1 + 3 + 5 + \cdots + 29$, is ___.'
  accept: ['225']
  explanation: |-
    The odd numbers form an arithmetic sequence with $a_1 = 1$, $d = 2$ and $a_{15} = 29$. So $S_{15} = \dfrac{15(1 + 29)}{2} = 225 = 15^2$. In general the first $n$ odd numbers add up to $n^2$.

# ---------- Lesson 24: geometric sequences ----------
- id: a2-m7-r2-q07
  lesson: alg-geom-seq
  type: text
  topic: Series
  stem: 'Written as a fraction, the repeating decimal $0.\overline{45} = 0.454545\ldots$ equals ___.'
  accept: ['5/11', '45/99']
  explanation: |-
    $0.45 + 0.0045 + 0.000045 + \cdots$ is geometric with $a_1 = 0.45$ and $r = 0.01$, so $S = \dfrac{0.45}{0.99} = \dfrac{45}{99} = \dfrac{5}{11}$.
- id: a2-m7-r2-q08
  lesson: alg-geom-seq
  type: order
  topic: Series
  stem: 'Put these infinite series in order from the smallest sum to the largest.'
  items:
    - '$0.9 + 0.09 + 0.009 + \cdots$'
    - '$1 + \tfrac13 + \tfrac19 + \cdots$'
    - '$1 + \tfrac12 + \tfrac14 + \cdots$'
    - '$4 - 2 + 1 - \tfrac12 + \cdots$'
  explanation: |-
    Use $S = \dfrac{a_1}{1 - r}$. $\dfrac{0.9}{0.9} = 1$; $\dfrac{1}{2/3} = 1.5$; $\dfrac{1}{1/2} = 2$; and with $r = -\tfrac12$, $\dfrac{4}{3/2} = \tfrac83 \approx 2.67$.
- id: a2-m7-r2-q09
  lesson: alg-geom-seq
  module_quiz: true
  topic: Series
  stem: 'Which of these infinite geometric series have a finite sum? Select all that apply.'
  choices:
    - '$8 + 4 + 2 + \cdots$'
    - '$1 - 1 + 1 - 1 + \cdots$'
    - '$5 - 4 + 3.2 - \cdots$'
    - '$0.1 + 0.2 + 0.4 + \cdots$'
  answer: [0, 2]
  explanation: |-
    A geometric series converges only when $|r| < 1$. $8 + 4 + 2 + \cdots$ has $r = \tfrac12$ (sum 16), and $5 - 4 + 3.2 - \cdots$ has $r = -0.8$ (sum $\tfrac{5}{1.8} = \tfrac{25}{9}$). $1 - 1 + 1 - \cdots$ has $r = -1$: its partial sums jump between 1 and 0 forever. $0.1 + 0.2 + 0.4 + \cdots$ has $r = 2$ and grows without bound, even though it starts small.
- id: a2-m7-r2-q10
  lesson: alg-geom-seq
  type: label
  topic: Series
  stem: 'A square of area 1 is cut in half, then the leftover piece is cut in half, and so on. What is the area of each numbered piece?'
  image: {src: images/a2-m7-halving-blank.svg, alt: 'A square divided into pieces: the whole left half, the upper right quarter, then a tall piece below it, a smaller piece beside that, and still smaller pieces in the bottom right corner. Each piece is half the size of the one before.'}
  labels:
    - {x: 38.24, y: 45.24, text: '1/2'}
    - {x: 61.76, y: 26.19, text: '1/4'}
    - {x: 55.88, y: 64.29, text: '1/8'}
    - {x: 67.65, y: 54.76, text: '1/16'}
  distractors: ['1/3', '1/6']
  explanation: |-
    The left half has area $\tfrac12$. The right half is cut into a top quarter ($\tfrac14$) and a bottom quarter, which is cut into $\tfrac18$ and another $\tfrac18$; that one is cut into $\tfrac1{16}$ and so on. The pieces fill the square, so $\tfrac12 + \tfrac14 + \tfrac18 + \cdots = 1$.
- id: a2-m7-r2-q11
  lesson: alg-geom-seq
  type: match
  topic: Geometric sequences
  stem: 'Match each sequence to its type.'
  pairs:
    - ['$3, 6, 12, 24, \ldots$', 'Geometric with r = 2']
    - ['$3, 6, 9, 12, \ldots$', 'Arithmetic with d = 3']
    - ['$24, 12, 6, 3, \ldots$', 'Geometric with r = 1/2']
    - ['$1, 3, 6, 10, \ldots$', 'Neither arithmetic nor geometric']
  distractors: ['Arithmetic with d = 2']
  explanation: |-
    Doubling gives $r = 2$; adding 3 gives $d = 3$; halving gives $r = \tfrac12$ (not $r = 2$: divide each term by the one before). $1, 3, 6, 10$ has differences $2, 3, 4$ and ratios $3, 2, \tfrac53$, so neither is constant.
- id: a2-m7-r2-q12
  lesson: alg-geom-seq
  type: text
  module_quiz: true
  topic: Series
  stem: 'The sum of the infinite geometric series $6 + 4 + \tfrac83 + \cdots$ is ___.'
  accept: ['18']
  explanation: |-
    $r = \tfrac46 = \tfrac23$, and $|r| < 1$, so $S = \dfrac{6}{1 - \frac23} = \dfrac{6}{\frac13} = 18$.

# ---------- Honors 24h1: finite differences and sums of powers ----------
- id: a2-m7-r2-h01
  lesson: a2-m7-h-differences
  topic: Finite differences
  stem: 'The sequence $2, 5, 10, 17, 26, \ldots$ has first differences $3, 5, 7, 9$. What do the second differences tell you?'
  choices:
    - 'They are all 2, so the formula is quadratic with leading coefficient 1'
    - 'They are all 2, so the formula is quadratic with leading coefficient 2'
    - 'They are all 2, so the sequence is arithmetic with $d = 2$'
    - 'They are not constant, so there is no polynomial formula'
  answer: 0
  explanation: |-
    The second differences are $2, 2, 2$. For $An^2 + Bn + C$ the second difference is $2A$, so $A = 1$; in fact $a_n = n^2 + 1$. Constant first differences would mean arithmetic.
- id: a2-m7-r2-h02
  lesson: a2-m7-h-differences
  type: text
  topic: Finite differences
  stem: 'Every second difference of the sequence $3, 7, 13, 21, 31, \ldots$ equals ___.'
  accept: ['2']
  explanation: |-
    First differences: $4, 6, 8, 10$. Second differences: $2, 2, 2$.
- id: a2-m7-r2-h03
  lesson: a2-m7-h-differences
  topic: Finite differences
  stem: 'Which quadratic formula gives $3, 7, 13, 21, 31, \ldots$?'
  choices: ['$a_n = n^2 + 3n - 1$', '$a_n = 2n^2 + 1$', '$a_n = n^2 + 2n$', '$a_n = n^2 + n + 1$']
  answer: 3
  explanation: |-
    The second differences are 2, so $A = 1$. Subtracting $n^2$ leaves $2, 3, 4, 5$, which is $n + 1$. So $a_n = n^2 + n + 1$. Each other choice gives $a_1 = 3$ but the wrong $a_2$ (9, 9 and 8).
- id: a2-m7-r2-h04
  lesson: a2-m7-h-differences
  type: text
  topic: Sums of powers
  stem: '$1^2 + 2^2 + 3^2 + \cdots + 12^2 =$ ___'
  accept: ['650']
  explanation: |-
    $\dfrac{n(n + 1)(2n + 1)}{6} = \dfrac{12 \cdot 13 \cdot 25}{6} = 650$.
- id: a2-m7-r2-h05
  lesson: a2-m7-h-differences
  topic: Sums of powers
  stem: 'Evaluate $1^3 + 2^3 + 3^3 + 4^3 + 5^3$.'
  choices: ['$55$', '$225$', '$125$', '$3375$']
  answer: 1
  explanation: |-
    $\left(\dfrac{5 \cdot 6}{2}\right)^2 = 15^2 = 225$, the square of $1 + 2 + \cdots + 5$. 55 is the sum of the squares, 125 is only $5^3$, and 3375 is $15^3$.
- id: a2-m7-r2-h06
  lesson: a2-m7-h-differences
  topic: Sums of powers
  stem: 'Which statements are true for all sequences $a_k$, $b_k$ and every constant $c$? Select all that apply.'
  choices:
    - '$\sum_{k=1}^{n} (a_k + b_k) = \sum_{k=1}^{n} a_k + \sum_{k=1}^{n} b_k$'
    - '$\sum_{k=1}^{n} c\,a_k = c\sum_{k=1}^{n} a_k$'
    - '$\sum_{k=1}^{n} a_kb_k = \left(\sum_{k=1}^{n} a_k\right)\left(\sum_{k=1}^{n} b_k\right)$'
    - '$\sum_{k=1}^{n} c = nc$'
  answer: [0, 1, 3]
  explanation: |-
    Sums can be split and constants factored out, and adding $c$ to itself $n$ times gives $nc$. Products don't split: with $a_k = b_k = k$ and $n = 2$, $\sum a_kb_k = 1 + 4 = 5$ but $(1 + 2)(1 + 2) = 9$.
- id: a2-m7-r2-h07
  lesson: a2-m7-h-differences
  type: order
  topic: Sums of powers
  stem: 'Put the steps of the telescoping derivation of $\sum_{k=1}^{n} k^2$ in order.'
  items:
    - 'Expand $(k + 1)^3 - k^3 = 3k^2 + 3k + 1$'
    - 'Add both sides of that identity from $k = 1$ to $k = n$'
    - 'Simplify: the left side collapses to $(n + 1)^3 - 1$, and $\sum k = \tfrac{n(n + 1)}{2}$'
    - 'Solve the resulting equation for $\sum k^2$'
  explanation: |-
    The identity comes first; summing it over $k$ creates the telescoping sum; the known sums simplify both sides; and only then can you solve for the unknown sum, which turns out to be $\dfrac{n(n + 1)(2n + 1)}{6}$.
- id: a2-m7-r2-h08
  lesson: a2-m7-h-differences
  topic: Sums of powers
  stem: 'Evaluate $\displaystyle\sum_{k=1}^{49} \frac{1}{k(k + 1)}$.'
  choices: ['$\tfrac{50}{49}$', '$\tfrac{1}{50}$', '$\tfrac{49}{50}$', '$1$']
  answer: 2
  explanation: |-
    Each term is $\tfrac1k - \tfrac{1}{k + 1}$, so the sum telescopes to $1 - \tfrac{1}{50} = \tfrac{49}{50}$. The sum gets close to 1 only as the number of terms grows without bound; $\tfrac{1}{50}$ is the piece that is subtracted.
- id: a2-m7-r2-h09
  lesson: a2-m7-h-differences
  type: text
  topic: Sums of powers
  stem: '$\displaystyle\sum_{k=1}^{9} \left(\frac1k - \frac{1}{k + 1}\right) =$ ___ (as a fraction or decimal)'
  accept: ['9/10']
  explanation: |-
    Everything cancels except the first and last pieces: $1 - \tfrac{1}{10} = \tfrac{9}{10} = 0.9$.
- id: a2-m7-r2-h10
  lesson: a2-m7-h-differences
  type: match
  topic: Finite differences
  stem: 'Match each sequence to the first level of differences that is constant.'
  pairs:
    - ['$2, 5, 8, 11, 14, \ldots$', 'First differences']
    - ['$1, 4, 9, 16, 25, \ldots$', 'Second differences']
    - ['$1, 8, 27, 64, 125, \ldots$', 'Third differences']
    - ['$1, 2, 4, 8, 16, \ldots$', 'No level is ever constant']
  distractors: ['Fourth differences']
  explanation: |-
    $2, 5, 8, \ldots$ is linear (differences 3). The squares have differences $3, 5, 7, 9$ and second differences 2. The cubes have differences $7, 19, 37, 61$, then $12, 18, 24$, then $6, 6$: third differences, equal to $3! = 6$ times the leading coefficient 1. Powers of 2 reproduce themselves at every level, so no level is constant.
- id: a2-m7-r2-h11
  lesson: a2-m7-h-differences
  topic: Sums of powers
  stem: 'Cannonballs are stacked in a square pyramid with layers of $1, 4, 9, \ldots$ balls and a $10 \times 10$ bottom layer. How many cannonballs are there?'
  choices: ['$385$', '$55$', '$100$', '$3025$']
  answer: 0
  explanation: |-
    $\sum_{k=1}^{10} k^2 = \dfrac{10 \cdot 11 \cdot 21}{6} = 385$. 55 is $1 + 2 + \cdots + 10$, 100 is just the bottom layer, and 3025 is $55^2$, which treats $\sum k^2$ as $\left(\sum k\right)^2$.
- id: a2-m7-r2-h12
  lesson: a2-m7-h-differences
  topic: Finite differences
  stem: 'Ana counts $1, 2, 4, 8, 16$ for the first five terms of a pattern and says the sixth must be 32. Which response is best?'
  choices:
    - 'She is right: five terms that double fix the pattern'
    - 'She is right, because the differences $1, 2, 4, 8$ are also doubling'
    - 'Five terms can''t prove a rule; the circle-regions pattern starts $1, 2, 4, 8, 16$ and then gives 31'
    - 'She is wrong: the sixth term must be 31 for every pattern that starts this way'
  answer: 2
  explanation: |-
    Many rules fit any finite list of terms. Doubling gives 32, but the regions formed by chords between points on a circle give $1, 2, 4, 8, 16, 31$. A formula found from a few terms is a conjecture until it is proved from the rule that makes the sequence. That also rules out "must be 31 for every pattern".
- id: a2-m7-r2-h13
  lesson: a2-m7-h-differences
  topic: Sums of powers
  stem: 'Evaluate $11 + 12 + 13 + \cdots + 20$.'
  choices: ['$144$', '$210$', '$155$', '$165$']
  answer: 2
  explanation: |-
    Subtract the sum up to 10 from the sum up to 20: $\dfrac{20 \cdot 21}{2} - \dfrac{10 \cdot 11}{2} = 210 - 55 = 155$. Subtracting the sum up to 11 (66) gives 144, which wrongly removes the 11; subtracting the sum up to 9 (45) gives 165, which wrongly keeps the 10.
- id: a2-m7-r2-h14
  lesson: a2-m7-h-differences
  topic: Finite differences
  stem: 'A sequence is given by a cubic polynomial in $n$, and its third differences are all 12. What is the coefficient of $n^3$?'
  choices: ['$12$', '$6$', '$4$', '$2$']
  answer: 3
  explanation: |-
    For a cubic $An^3 + \cdots$ the third differences equal $3! \cdot A = 6A$. So $6A = 12$ and $A = 2$. (Dividing by 2 or 3 instead of $3! = 6$ gives the wrong answers 6 and 4.)

# ---------- Honors 24h2: recurrences, savings plans and loans ----------
- id: a2-m7-r2-h15
  lesson: a2-m7-h-loans
  topic: Recurrence relations
  stem: 'What is the fixed point of the recurrence $a_n = 0.4\,a_{n-1} + 12$?'
  choices: ['$\tfrac{60}{7}$', '$20$', '$30$', '$-20$']
  answer: 1
  explanation: |-
    Solve $L = 0.4L + 12$: $0.6L = 12$, so $L = 20$. Check: $0.4(20) + 12 = 20$. $\tfrac{12}{0.4} = 30$ divides by $r$ instead of $1 - r$, and $\tfrac{12}{1.4} = \tfrac{60}{7}$ uses $1 + r$.
- id: a2-m7-r2-h16
  lesson: a2-m7-h-loans
  type: text
  topic: Recurrence relations
  stem: 'A sequence has $a_1 = 20$ and $a_n = 0.5\,a_{n-1} + 6$. Then $a_3 =$ ___'
  accept: ['14']
  explanation: |-
    $a_2 = 0.5(20) + 6 = 16$ and $a_3 = 0.5(16) + 6 = 14$. The terms are heading toward the fixed point $\tfrac{6}{0.5} = 12$.
- id: a2-m7-r2-h17
  lesson: a2-m7-h-loans
  topic: Recurrence relations
  stem: 'A patient takes 100 mg of a medicine each day, and 20% of the amount in the body remains one day later. In the long run, about how much is in the body just after a dose?'
  choices: ['$100$ mg', '$120$ mg', '$125$ mg', '$500$ mg']
  answer: 2
  explanation: |-
    The rule is $a_n = 0.2\,a_{n-1} + 100$, with fixed point $L = \dfrac{100}{1 - 0.2} = 125$ mg; since $|r| = 0.2 < 1$ the amounts approach it. 120 mg is only the amount after the second dose, and 500 mg comes from $\tfrac{100}{0.2}$.
- id: a2-m7-r2-h18
  lesson: a2-m7-h-loans
  topic: Recurrence relations
  stem: 'For which recurrences do the terms approach a single limit from every starting value? Select all that apply.'
  choices:
    - '$a_n = 0.9\,a_{n-1} + 5$'
    - '$a_n = -0.5\,a_{n-1} + 3$'
    - '$a_n = 1.2\,a_{n-1} - 10$'
    - '$a_n = a_{n-1} + 2$'
  answer: [0, 1]
  explanation: |-
    The distance from the fixed point is multiplied by $r$ each step, so the terms settle down when $|r| < 1$: $r = 0.9$ (limit 50) and $r = -0.5$ (limit 2, approached from alternating sides). With $r = 1.2$ the terms run away from the fixed point 50 unless they start exactly there, and $a_{n-1} + 2$ is arithmetic and grows forever.
- id: a2-m7-r2-h19
  lesson: a2-m7-h-loans
  type: match
  topic: Recurrence relations
  stem: 'For the recurrence $a_n = r\,a_{n-1} + c$, match each case to what happens.'
  pairs:
    - ['$r = 1$, $c \ne 0$', 'An arithmetic sequence']
    - ['$c = 0$', 'A geometric sequence']
    - ['$|r| < 1$', 'The terms approach the fixed point']
    - ['$|r| > 1$, $a_1$ not the fixed point', 'The terms move away from the fixed point']
  distractors: ['The terms stay at the fixed point']
  explanation: |-
    With $r = 1$ the rule just adds $c$; with $c = 0$ it just multiplies by $r$. Otherwise the distance from $L = \tfrac{c}{1 - r}$ is multiplied by $r$ each step, so it shrinks when $|r| < 1$ and grows when $|r| > 1$. The terms stay put only if they start exactly at $L$.
- id: a2-m7-r2-h20
  lesson: a2-m7-h-loans
  type: order
  topic: Annuities and loans
  stem: 'Put the steps for one month of a loan with monthly payments in order, as a lender computes them.'
  items:
    - 'Start with the balance owed at the beginning of the month'
    - 'Compute the month''s interest: the monthly rate $i$ times the balance'
    - 'Find the principal part: the payment minus that interest'
    - 'Subtract the principal part from the balance'
    - 'Use the result as the next month''s starting balance'
  explanation: |-
    This is how each row of an amortization schedule is built. The interest depends on the starting balance, the principal part depends on the interest, and the new balance depends on the principal part. In symbols, $B_k = B_{k-1} - (M - iB_{k-1}) = (1 + i)B_{k-1} - M$, and the result starts the next month.
- id: a2-m7-r2-h21
  lesson: a2-m7-h-loans
  topic: Annuities and loans
  stem: 'You deposit 100 dollars at the end of every month for 10 years into an account paying 4.8% a year, compounded monthly. To the nearest dollar, how much is in the account at the end?'
  choices: ['$12{,}000$ dollars', '$15{,}363$ dollars', '$15{,}425$ dollars', '$19{,}374$ dollars']
  answer: 1
  explanation: |-
    $i = \tfrac{0.048}{12} = 0.004$ and $n = 120$: $FV = 100 \cdot \dfrac{1.004^{120} - 1}{0.004} \approx 15{,}363$ dollars. 12,000 is just the deposits. 15,425 assumes each deposit is made at the start of the month, and 19,374 is what 12,000 dollars would grow to if all of it were deposited on day one.
- id: a2-m7-r2-h22
  lesson: a2-m7-h-loans
  type: text
  topic: Annuities and loans
  stem: 'A loan charges 7.2% a year, compounded monthly. As a decimal, its monthly rate is $i =$ ___'
  accept: ['0.006']
  explanation: |-
    Divide the yearly rate by 12: $\tfrac{0.072}{12} = 0.006$, which is 0.6% a month.
- id: a2-m7-r2-h23
  lesson: a2-m7-h-loans
  topic: Annuities and loans
  stem: 'A 15,000-dollar car loan at 4.8% a year (compounded monthly) is repaid in 48 equal monthly payments. What is the payment?'
  choices: ['$312.50$ dollars', '$372.50$ dollars', '$60.00$ dollars', '$344.08$ dollars']
  answer: 3
  explanation: |-
    $i = 0.004$, $n = 48$: $M = \dfrac{15000(0.004)}{1 - 1.004^{-48}} \approx 344.08$ dollars. 312.50 ignores interest; 372.50 charges simple interest on the full 15,000 for all 4 years, even though the balance shrinks; 60.00 is only the first month's interest.
- id: a2-m7-r2-h24
  lesson: a2-m7-h-loans
  topic: Annuities and loans
  stem: 'A 200,000-dollar mortgage at 6% a year (monthly rate 0.005) has a payment of 1,199.10 dollars. How much of the first payment reduces the balance?'
  choices: ['$1{,}000.00$ dollars', '$199.10$ dollars', '$555.56$ dollars', '$1{,}199.10$ dollars']
  answer: 1
  explanation: |-
    The first month's interest is $0.005 \times 200{,}000 = 1000$ dollars, so only $1199.10 - 1000 = 199.10$ dollars goes to principal. That is why a long loan's balance falls so slowly at first. 555.56 is $\tfrac{200000}{360}$, which ignores interest.
- id: a2-m7-r2-h25
  lesson: a2-m7-h-loans
  topic: Annuities and loans
  stem: 'An 18,000-dollar loan at 4.8% a year (compounded monthly) has 36 monthly payments of 537.86 dollars. About how much interest is paid in total?'
  choices: ['$2{,}592$ dollars', '$864$ dollars', '$19{,}363$ dollars', '$1{,}363$ dollars']
  answer: 3
  explanation: |-
    Total paid: $36 \times 537.86 = 19{,}362.96$ dollars, so the interest is about $19{,}363 - 18{,}000 = 1{,}363$ dollars. 2,592 charges 4.8% on the full 18,000 for 3 years, but the balance shrinks; 864 is one year of that; 19,363 is the total paid, not the interest.
