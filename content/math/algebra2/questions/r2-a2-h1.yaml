# Honors module a2-h1 (Toward precalculus and beyond), round 2
# Lesson 90: conic sections
- id: a2-h1-r2-h01
  lesson: a2-h1-conics
  module_quiz: true
  topic: Conic sections
  stem: 'A plane slices a double cone. Which slice gives a parabola?'
  choices: ['A plane perpendicular to the axis', 'A plane parallel to a side of the cone', 'A steep plane that cuts both halves of the cone', 'A slightly tilted plane that cuts all the way around one half']
  answer: 1
  explanation: |-
    A plane parallel to a side (a generator line) of the cone cuts one half and never closes up: a parabola. Perpendicular to the axis gives a circle, a slight tilt gives an ellipse, and a plane steep enough to cut both halves gives a hyperbola.
- id: a2-h1-r2-h02
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Find the focus and directrix of the parabola $x^2 = 12y$.'
  choices: ['Focus $(0, 3)$, directrix $y = -3$', 'Focus $(0, 12)$, directrix $y = -12$', 'Focus $(3, 0)$, directrix $x = -3$', 'Focus $(0, -3)$, directrix $y = 3$']
  answer: 0
  explanation: |-
    Match $x^2 = 4py$: $4p = 12$, so $p = 3$. The parabola opens up, with focus $(0, p) = (0, 3)$ and directrix $y = -p = -3$. Using $12$ itself forgets to divide by 4, and $(3, 0)$ with $x = -3$ belongs to $y^2 = 12x$, which opens to the right.
- id: a2-h1-r2-h03
  lesson: a2-h1-conics
  type: text
  topic: Conic sections
  stem: 'The parabola $y = \tfrac{1}{16}x^2$ has its focus at the point (0, ___). Give only the number.'
  accept: ['4']
  explanation: |-
    Multiply by 16: $x^2 = 16y$. Then $4p = 16$, so $p = 4$ and the focus is $(0, 4)$ (with directrix $y = -4$). Check with $(8, 4)$ on the curve: it is 8 from the focus and 8 from the directrix.
- id: a2-h1-r2-h04
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Where are the foci of the ellipse $\dfrac{x^2}{49} + \dfrac{y^2}{25} = 1$?'
  choices: ['$(\pm\sqrt{74}, 0)$', '$(0, \pm 2\sqrt6)$', '$(\pm 2\sqrt6, 0)$', '$(\pm 24, 0)$']
  answer: 2
  explanation: |-
    The larger denominator, 49, is under $x^2$, so the major axis is horizontal with $a = 7$ and $b = 5$. For an ellipse $c^2 = a^2 - b^2 = 49 - 25 = 24$, so $c = \sqrt{24} = 2\sqrt6$ and the foci are $(\pm 2\sqrt6, 0)$. Adding instead ($\sqrt{74}$) is the hyperbola relation; $(\pm 24, 0)$ forgets the square root; the foci are on the major axis, not the $y$-axis.
- id: a2-h1-r2-h05
  lesson: a2-h1-conics
  module_quiz: true
  topic: Conic sections
  stem: 'Which equation describes the ellipse centered at the origin with vertices $(0, \pm 6)$ and co-vertices $(\pm 4, 0)$?'
  choices: ['$\dfrac{x^2}{36} + \dfrac{y^2}{16} = 1$', '$\dfrac{x^2}{4} + \dfrac{y^2}{6} = 1$', '$\dfrac{x^2}{16} - \dfrac{y^2}{36} = 1$', '$\dfrac{x^2}{16} + \dfrac{y^2}{36} = 1$']
  answer: 3
  explanation: |-
    The ellipse reaches $\pm 4$ on the $x$-axis and $\pm 6$ on the $y$-axis, so the denominators are $4^2 = 16$ under $x^2$ and $6^2 = 36$ under $y^2$: $\tfrac{x^2}{16} + \tfrac{y^2}{36} = 1$ (a tall ellipse). Swapping the denominators gives a wide ellipse, using 4 and 6 without squaring gives intercepts $\pm2$ and $\pm\sqrt6$, and the minus sign makes a hyperbola.
- id: a2-h1-r2-h06
  lesson: a2-h1-conics
  type: text
  topic: Conic sections
  stem: 'For the hyperbola $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$, the foci are at (±___, 0) and the asymptotes are $y = \pm mx$ with $m =$ ___.'
  accept:
    - ['5']
    - ['4/3', '1 1/3', '1.33', '1.333']
  explanation: |-
    Here $a = 3$ and $b = 4$. For a hyperbola $c^2 = a^2 + b^2 = 9 + 16 = 25$, so $c = 5$ and the foci are $(\pm 5, 0)$. The asymptotes are $y = \pm\tfrac{b}{a}x = \pm\tfrac43 x$.
- id: a2-h1-r2-h07
  lesson: a2-h1-conics
  module_quiz: true
  type: match
  topic: Conic sections
  stem: 'Match each equation to the conic it describes.'
  pairs:
    - ['$x^2 + y^2 - 4x = 5$', Circle]
    - ['$3x^2 + 5y^2 = 15$', Ellipse]
    - ['$y^2 - 4x^2 = 4$', Hyperbola]
    - ['$y = 2x^2 - 3x$', Parabola]
  distractors: [Single line]
  explanation: |-
    Look at the squared terms. $x^2 + y^2$ with equal coefficients: a circle (completing the square gives $(x - 2)^2 + y^2 = 9$). $3x^2 + 5y^2$, same sign but different coefficients: an ellipse ($\tfrac{x^2}{5} + \tfrac{y^2}{3} = 1$). $y^2 - 4x^2$, opposite signs: a hyperbola ($\tfrac{y^2}{4} - x^2 = 1$). Only $x$ squared: a parabola.
- id: a2-h1-r2-h08
  lesson: a2-h1-conics
  type: order
  topic: Conic sections
  stem: 'Put the steps for writing $4x^2 + 9y^2 - 16x + 18y - 11 = 0$ in standard form in order.'
  items:
    - 'Move the constant to the right side and group the $x$ terms and the $y$ terms'
    - 'Factor 4 out of the $x$ group and 9 out of the $y$ group'
    - 'Complete the square in each group, adding $4 \cdot 4$ and $9 \cdot 1$ to the right side'
    - 'Divide both sides by 36 so the right side is 1'
    - 'Read off the center $(2, -1)$, $a = 3$ and $b = 2$'
  explanation: |-
    $4x^2 - 16x + 9y^2 + 18y = 11$; then $4(x^2 - 4x) + 9(y^2 + 2y) = 11$; then $4(x - 2)^2 + 9(y + 1)^2 = 11 + 16 + 9 = 36$; then $\tfrac{(x - 2)^2}{9} + \tfrac{(y + 1)^2}{4} = 1$. Only now can you read off the center and $a$, $b$. You can't factor out of a group before forming it, and the coefficients must be factored out before completing the square.
- id: a2-h1-r2-h09
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Which statements about the ellipse $\dfrac{x^2}{25} + \dfrac{y^2}{16} = 1$ are true? Select all that apply.'
  choices: ['Its major axis is horizontal.', 'Its foci are 3 units from the center.', 'Its vertices are $(0, \pm 4)$.', 'Its eccentricity is $\tfrac35$.', 'Its foci are $(\pm\sqrt{41}, 0)$.']
  answer: [0, 1, 3]
  explanation: |-
    The larger denominator (25) is under $x^2$, so the major axis is horizontal with $a = 5$, $b = 4$. Then $c^2 = 25 - 16 = 9$, so $c = 3$ and $e = \tfrac{c}{a} = \tfrac35$. The points $(0, \pm 4)$ are the co-vertices, not the vertices (the vertices are $(\pm 5, 0)$), and $\sqrt{41}$ comes from adding $25 + 16$, which is the hyperbola rule.
- id: a2-h1-r2-h10
  lesson: a2-h1-conics
  module_quiz: true
  type: label
  topic: Conic sections
  stem: 'This ellipse has its major axis horizontal. Name the numbered parts.'
  image: {src: images/a2-h1-ellipse-parts-blank.svg, alt: 'An ellipse with a horizontal axis segment and a vertical axis segment crossing at its center. Dots mark the two ends of each axis segment, the center, and two points on the horizontal axis inside the ellipse. Six places are numbered.'}
  labels:
    - {x: 18.75, y: 50, text: Vertex}
    - {x: 50, y: 15.9, text: Co-vertex}
    - {x: 75, y: 50, text: Focus}
    - {x: 50, y: 50, text: Center}
    - {x: 37.5, y: 50, text: Major axis}
    - {x: 50, y: 68.2, text: Minor axis}
  distractors: [Directrix, Asymptote]
  explanation: |-
    The long horizontal segment is the major axis, and its ends are the vertices. The short vertical segment is the minor axis, with the co-vertices at its ends. The axes cross at the center, and the foci are the two points on the major axis inside the ellipse, $c$ units from the center. Directrices and asymptotes belong to parabolas and hyperbolas.
- id: a2-h1-r2-h11
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Find the focus of the parabola $y^2 - 4y - 8x + 20 = 0$.'
  choices: ['$(4, 2)$', '$(2, 4)$', '$(0, 2)$', '$(2, 2)$']
  answer: 0
  explanation: |-
    Only $y$ is squared, so complete the square in $y$: $y^2 - 4y = 8x - 20$, then $(y - 2)^2 = 8x - 16 = 8(x - 2)$. This is $y^2 = 4px$ shifted to the vertex $(2, 2)$, with $4p = 8$, so $p = 2$ and it opens to the right. The focus is 2 units right of the vertex: $(4, 2)$. $(0, 2)$ is on the directrix $x = 0$, $(2, 2)$ is the vertex, and $(2, 4)$ moves the wrong way.
- id: a2-h1-r2-h12
  lesson: a2-h1-conics
  module_quiz: true
  topic: Conic sections
  stem: 'Identify the conic $9x^2 - 4y^2 - 18x - 16y - 43 = 0$ and find its center.'
  choices: ['Ellipse, center $(1, -2)$', 'Hyperbola, center $(1, -2)$', 'Hyperbola, center $(-1, 2)$', 'Ellipse, center $(-1, 2)$']
  answer: 1
  explanation: |-
    $A = 9$ and $C = -4$ have opposite signs, so it is a hyperbola. Group and factor: $9(x^2 - 2x) - 4(y^2 + 4y) = 43$. Completing the squares adds $9 \cdot 1 = 9$ and $-4 \cdot 4 = -16$: $9(x - 1)^2 - 4(y + 2)^2 = 43 + 9 - 16 = 36$, so $\tfrac{(x - 1)^2}{4} - \tfrac{(y + 2)^2}{9} = 1$. The center is $(1, -2)$; reading $(x - 1)$ and $(y + 2)$ with the wrong signs gives $(-1, 2)$.
- id: a2-h1-r2-h13
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Earth''s orbit is an ellipse with eccentricity about 0.017. What does that tell you?'
  choices: ['The orbit is a long, thin ellipse with the Sun at its center.', 'The orbit is a parabola, so Earth will eventually leave the Sun.', 'The orbit is a hyperbola with the Sun at one vertex.', 'The orbit is nearly a circle, and the Sun, at one focus, is very close to the center.']
  answer: 3
  explanation: |-
    $e = \tfrac{c}{a}$ near 0 means the foci are very close to the center, so the ellipse is almost a circle. Kepler showed that the Sun sits at one focus, not the center. A parabola has $e = 1$ and a hyperbola $e > 1$; neither is an ellipse.
- id: a2-h1-r2-h14
  lesson: a2-h1-conics
  topic: Conic sections
  stem: 'Which equation is a circle?'
  choices: ['$x^2 + 2y^2 - 4x = 1$', '$x^2 - y^2 + 6y = 4$', '$2x^2 + 2y^2 - 8x + 4y = 1$', '$x^2 + 6x - 2y = 3$']
  answer: 2
  explanation: |-
    A circle needs $x^2$ and $y^2$ with the same coefficient. Dividing $2x^2 + 2y^2 - 8x + 4y = 1$ by 2 and completing the squares gives $(x - 2)^2 + (y + 1)^2 = \tfrac{11}{2}$, a circle with center $(2, -1)$. Unequal coefficients with the same sign give an ellipse, opposite signs a hyperbola, and only one squared variable a parabola.
# Lesson 91: parametric equations
- id: a2-h1-r2-h15
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'Eliminate the parameter: $x = t + 2$, $y = t^2 - 1$.'
  choices: ['$y = (x + 2)^2 - 1$', '$y = x^2 - 3$', '$y = (x - 2)^2 - 1$', '$y = (x - 2)^2 + 1$']
  answer: 2
  explanation: |-
    Solve the linear equation for $t$: $t = x - 2$. Substitute: $y = (x - 2)^2 - 1$, a parabola with vertex $(2, -1)$. Writing $t = x + 2$ reverses the sign of the shift.
- id: a2-h1-r2-h16
  lesson: a2-h1-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'What curve do $x = 4\cos t$, $y = 4\sin t$, $0 \le t \le 2\pi$, trace?'
  choices: ['The circle of radius 4 centered at the origin', 'The circle of radius 16 centered at the origin', 'The ellipse $\tfrac{x^2}{16} + y^2 = 1$', 'The line $y = x$']
  answer: 0
  explanation: |-
    $\cos t = \tfrac{x}{4}$ and $\sin t = \tfrac{y}{4}$, so $\tfrac{x^2}{16} + \tfrac{y^2}{16} = 1$, that is $x^2 + y^2 = 16$: the circle of radius $\sqrt{16} = 4$. (Radius 16 confuses $r$ with $r^2$.)
- id: a2-h1-r2-h17
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'Describe the motion of $x = \cos t$, $y = -\sin t$ as $t$ goes from $0$ to $2\pi$.'
  choices: ['Once around the unit circle counterclockwise, starting at $(1, 0)$', 'Once around the unit circle counterclockwise, starting at $(0, -1)$', 'Back and forth along the segment from $(-1, 0)$ to $(1, 0)$', 'Once around the unit circle clockwise, starting at $(1, 0)$']
  answer: 3
  explanation: |-
    $x^2 + y^2 = \cos^2 t + \sin^2 t = 1$, so it is the unit circle. At $t = 0$ the point is $(1, 0)$; at $t = \tfrac{\pi}{2}$ it is $(0, -1)$, below the start. Going from $(1, 0)$ down to $(0, -1)$ is clockwise.
- id: a2-h1-r2-h18
  lesson: a2-h1-parametric
  module_quiz: true
  type: text
  topic: Parametric equations
  stem: 'The segment from $(2, 5)$ to $(10, 1)$ is $x = 2 + 8t$, $y = 5 - 4t$, $0 \le t \le 1$. The point at $t = \tfrac34$ is (___, ___).'
  accept:
    - ['8']
    - ['2']
  explanation: |-
    $x = 2 + 8 \cdot \tfrac34 = 2 + 6 = 8$ and $y = 5 - 4 \cdot \tfrac34 = 5 - 3 = 2$. The point $(8, 2)$ is three quarters of the way from $(2, 5)$ to $(10, 1)$.
- id: a2-h1-r2-h19
  lesson: a2-h1-parametric
  type: text
  topic: Parametric equations
  stem: 'Eliminating the parameter from $x = 3t + 1$, $y = 6t - 4$ gives a line with slope ___ and $y$-intercept ___.'
  accept:
    - ['2']
    - ['-6', '−6']
  explanation: |-
    $t = \tfrac{x - 1}{3}$, so $y = 6 \cdot \tfrac{x - 1}{3} - 4 = 2(x - 1) - 4 = 2x - 6$. Slope 2 (the ratio $\tfrac{6}{3}$ of the $t$-coefficients), $y$-intercept $-6$.
- id: a2-h1-r2-h20
  lesson: a2-h1-parametric
  module_quiz: true
  type: match
  topic: Parametric equations
  stem: 'Match each pair of parametric equations ($0 \le t \le 2\pi$ for the trig ones) to the curve or motion it describes.'
  pairs:
    - ['$x = \cos t$, $y = \sin t$', Unit circle traced counterclockwise]
    - ['$x = \cos t$, $y = -\sin t$', Unit circle traced clockwise]
    - ['$x = 3\cos t$, $y = 2\sin t$', Ellipse x²/9 + y²/4 = 1]
    - ['$x = t$, $y = t^2$', Parabola y = x²]
    - ['$x = 1 + 2t$, $y = 3 - t$', Line with slope −1/2]
  distractors: [Hyperbola x² − y² = 1]
  explanation: |-
    $\cos t$ and $\sin t$ give the unit circle, counterclockwise from $(1, 0)$; negating $y$ reverses the direction. $\tfrac{x}{3} = \cos t$ and $\tfrac{y}{2} = \sin t$ give $\tfrac{x^2}{9} + \tfrac{y^2}{4} = 1$. $x = t$ makes $y = x^2$ directly. For the line, $t = \tfrac{x - 1}{2}$ gives $y = 3 - \tfrac{x - 1}{2}$, with slope $-\tfrac12$.
- id: a2-h1-r2-h21
  lesson: a2-h1-parametric
  type: order
  topic: Parametric equations
  stem: 'A ball is thrown at a known speed and angle. Put the steps for finding how far away it lands in order.'
  items:
    - 'Split the launch speed into horizontal and vertical components'
    - 'Write $x(t)$ and $y(t)$ using those components'
    - 'Solve $y(t) = 0$ for the landing time'
    - 'Substitute the landing time into $x(t)$'
  explanation: |-
    The equations $x = (v_0\cos\theta)t$ and $y = h_0 + (v_0\sin\theta)t - 16t^2$ need the components first. The landing time comes from the vertical equation alone, and only then can the horizontal equation turn that time into a distance.
- id: a2-h1-r2-h22
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'Which parametric equations trace all or part of the unit circle $x^2 + y^2 = 1$? Select all that apply.'
  choices: ['$x = \sin t$, $y = \cos t$', '$x = \cos 2t$, $y = \sin 2t$', '$x = \cos t$, $y = \sin 2t$', '$x = t$, $y = \sqrt{1 - t^2}$, $-1 \le t \le 1$', '$x = 2\cos t$, $y = 2\sin t$']
  answer: [0, 1, 3]
  explanation: |-
    Check $x^2 + y^2$. $\sin^2 t + \cos^2 t = 1$ and $\cos^2 2t + \sin^2 2t = 1$, so both lie on the unit circle. $t^2 + (1 - t^2) = 1$ too, giving the upper half. But $\cos^2 t + \sin^2 2t$ is not always 1 (at $t = \tfrac{\pi}{4}$ it is $\tfrac12 + 1$), and $4\cos^2 t + 4\sin^2 t = 4$ is the circle of radius 2.
- id: a2-h1-r2-h23
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'A ball is kicked from the ground at 96 ft/s, $30^\circ$ above the horizontal. Ignoring air resistance, how long is it in the air?'
  choices: ['6 s', '3 s', '1.5 s', 'about 5.2 s']
  answer: 1
  explanation: |-
    The vertical component is $96\sin 30^\circ = 48$ ft/s, so $y = 48t - 16t^2 = 16t(3 - t)$. It is 0 again at $t = 3$ s. 1.5 s is the time to the top, 6 s uses the full 96 ft/s vertically, and 5.2 s uses the horizontal component $96\cos 30^\circ \approx 83.1$ in place of the vertical one.
- id: a2-h1-r2-h24
  lesson: a2-h1-parametric
  module_quiz: true
  topic: Parametric equations
  stem: 'For the same ball ($y = 48t - 16t^2$ feet), what is its greatest height?'
  choices: ['72 ft', '144 ft', '36 ft', '48 ft']
  answer: 2
  explanation: |-
    The vertex of $y = -16t^2 + 48t$ is at $t = -\tfrac{48}{2(-16)} = 1.5$ s, where $y = 48(1.5) - 16(2.25) = 72 - 36 = 36$ ft. 72 ft forgets the $-16t^2$ term, 48 ft forgets to square $t$ ($72 - 16 \cdot 1.5$), and 144 ft comes from using 96 ft/s as the vertical speed.
- id: a2-h1-r2-h25
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'What does $x = t^2$, $y = 2t^2 + 1$ trace as $t$ runs over all real numbers?'
  choices: ['The ray (half-line) of $y = 2x + 1$ starting at $(0, 1)$', 'The whole line $y = 2x + 1$', 'The parabola $y = 2x^2 + 1$', 'The ray of $y = 2x + 1$ starting at $(1, 3)$']
  answer: 0
  explanation: |-
    Substituting $t^2 = x$ gives $y = 2x + 1$, a line. But $x = t^2$ is never negative, so only the part with $x \ge 0$ is reached: the ray starting at $(0, 1)$ (reached at $t = 0$). The point moves in toward $(0, 1)$ and back out along the same ray.
- id: a2-h1-r2-h26
  lesson: a2-h1-parametric
  module_quiz: true
  type: label
  topic: Parametric equations
  stem: 'This picture shows the path of a thrown ball. Name the numbered parts.'
  image: {src: images/a2-h1-projectile-blank.svg, alt: 'A dashed arc from a launch point on top of a small block to a landing point on the ground. An arrow leaves the launch point along the path, an arc marks the angle between it and a horizontal dashed line, a double arrow runs from the ground up to the highest point of the arc, a small double arrow shows the height of the block, and a double arrow under the ground spans from launch to landing. Five places are numbered.'}
  labels:
    - {x: 17.5, y: 74.0, text: Launch height}
    - {x: 29.9, y: 52.9, text: Initial velocity}
    - {x: 32.8, y: 61.9, text: Launch angle}
    - {x: 57.5, y: 49.0, text: Maximum height}
    - {x: 59.3, y: 92.5, text: Horizontal distance (range)}
  distractors: [Horizontal speed, Acceleration due to gravity]
  explanation: |-
    The ball starts at the launch height $h_0$ above the ground. The arrow is the initial velocity $v_0$, and the angle it makes with the horizontal is the launch angle $\theta$. The tall double arrow measures the maximum height at the top of the arc, and the long one along the ground is the horizontal distance traveled.
- id: a2-h1-r2-h27
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'On the cycloid $x = t - \sin t$, $y = 1 - \cos t$, $0 \le t \le 2\pi$, which point is highest?'
  choices: ['$(2\pi, 0)$', '$(\pi, 1)$', '$(2, \pi)$', '$(\pi, 2)$']
  answer: 3
  explanation: |-
    $y = 1 - \cos t$ is largest when $\cos t = -1$, at $t = \pi$, where $y = 2$ and $x = \pi - \sin\pi = \pi$. The dot is then at the top of the wheel. $(\pi, 1)$ is the wheel's center at that moment, and $(2\pi, 0)$ is where the dot touches the ground again.
- id: a2-h1-r2-h28
  lesson: a2-h1-parametric
  topic: Parametric equations
  stem: 'Which equations trace the segment from $(-1, 4)$ to $(5, 1)$, starting at $(-1, 4)$ when $t = 0$ and ending at $(5, 1)$ when $t = 1$?'
  choices: ['$x = 5 - 6t$, $y = 1 + 3t$', '$x = -1 + 6t$, $y = 4 - 3t$', '$x = -1 + 5t$, $y = 4 + t$', '$x = -1 + 6t$, $y = 4 + 3t$']
  answer: 1
  explanation: |-
    Start at $(-1, 4)$ and add $t$ times the change $(5 - (-1), 1 - 4) = (6, -3)$: $x = -1 + 6t$, $y = 4 - 3t$. The equations starting at $5$ and $1$ trace the same segment backward; using the endpoint $(5, 1)$ itself as the change, or the wrong sign on $-3$, misses $(5, 1)$ at $t = 1$.
# Lesson 92: complex numbers in polar form
- id: a2-h1-r2-h29
  lesson: a2-h1-polar-complex
  module_quiz: true
  topic: Polar form of complex numbers
  stem: 'Find the modulus and argument ($0^\circ \le \theta < 360^\circ$) of $-1 + i$.'
  choices: ['$\sqrt2$ and $135^\circ$', '$\sqrt2$ and $315^\circ$', '$2$ and $135^\circ$', '$\sqrt2$ and $45^\circ$']
  answer: 0
  explanation: |-
    $r = \sqrt{(-1)^2 + 1^2} = \sqrt2$. The point $(-1, 1)$ is in quadrant II with reference angle $45^\circ$, so $\theta = 180^\circ - 45^\circ = 135^\circ$. $315^\circ$ is what a calculator's $\tan^{-1}(-1) = -45^\circ$ suggests, but that points into quadrant IV. A modulus of 2 forgets the square root.
- id: a2-h1-r2-h30
  lesson: a2-h1-polar-complex
  type: text
  topic: Polar form of complex numbers
  stem: 'The modulus $|5 - 12i|$ is ___.'
  accept: ['13']
  explanation: |-
    $|5 - 12i| = \sqrt{5^2 + (-12)^2} = \sqrt{25 + 144} = \sqrt{169} = 13$.
- id: a2-h1-r2-h31
  lesson: a2-h1-polar-complex
  topic: Polar form of complex numbers
  stem: 'What is the argument of $-\sqrt3 - i$, with $0^\circ \le \theta < 360^\circ$?'
  choices: ['$30^\circ$', '$150^\circ$', '$330^\circ$', '$210^\circ$']
  answer: 3
  explanation: |-
    The point $(-\sqrt3, -1)$ is in quadrant III. Its reference angle satisfies $\tan = \tfrac{1}{\sqrt3}$, so it is $30^\circ$, and $\theta = 180^\circ + 30^\circ = 210^\circ$. A calculator's $\tan^{-1}\tfrac{-1}{-\sqrt3} = 30^\circ$ is in quadrant I, off by $180^\circ$.
- id: a2-h1-r2-h32
  lesson: a2-h1-polar-complex
  topic: Polar form of complex numbers
  stem: 'Write $6\,\text{cis}\,240^\circ$ in rectangular form.'
  choices: ['$-3\sqrt3 - 3i$', '$-3 - 3\sqrt3\,i$', '$3 - 3\sqrt3\,i$', '$-3 + 3\sqrt3\,i$']
  answer: 1
  explanation: |-
    $240^\circ$ is in quadrant III with reference angle $60^\circ$: $\cos 240^\circ = -\tfrac12$ and $\sin 240^\circ = -\tfrac{\sqrt3}{2}$. So $6\left(-\tfrac12 - \tfrac{\sqrt3}{2}i\right) = -3 - 3\sqrt3\,i$. Swapping the sine and cosine values gives $-3\sqrt3 - 3i$.
- id: a2-h1-r2-h33
  lesson: a2-h1-polar-complex
  module_quiz: true
  topic: Polar form of complex numbers
  stem: 'Multiply: $(3\,\text{cis}\,40^\circ)(5\,\text{cis}\,110^\circ)$.'
  choices: ['$8\,\text{cis}\,150^\circ$', '$15\,\text{cis}\,70^\circ$', '$15\,\text{cis}\,150^\circ$', '$15\,\text{cis}\,4400^\circ$']
  answer: 2
  explanation: |-
    Multiply the moduli and add the arguments: $3 \cdot 5 = 15$ and $40^\circ + 110^\circ = 150^\circ$. Adding the moduli gives 8, subtracting the angles gives $70^\circ$ (that is division), and multiplying the angles gives $4400^\circ$.
- id: a2-h1-r2-h34
  lesson: a2-h1-polar-complex
  type: text
  topic: Polar form of complex numbers
  stem: 'Write $\dfrac{8\,\text{cis}\,200^\circ}{2\,\text{cis}\,50^\circ}$ in polar form: ___ cis ___°. Give only the numbers.'
  accept:
    - ['4']
    - ['150', '150°', '150 degrees']
  explanation: |-
    Divide the moduli and subtract the arguments: $\tfrac82 = 4$ and $200^\circ - 50^\circ = 150^\circ$, so the quotient is $4\,\text{cis}\,150^\circ$.
- id: a2-h1-r2-h35
  lesson: a2-h1-polar-complex
  module_quiz: true
  topic: Powers and roots of complex numbers
  stem: 'Use De Moivre''s theorem to compute $(\sqrt3 + i)^6$.'
  choices: ['$64$', '$64i$', '$-64i$', '$-64$']
  answer: 3
  explanation: |-
    $\sqrt3 + i$ has $r = \sqrt{3 + 1} = 2$ and $\theta = 30^\circ$. So $(\sqrt3 + i)^6 = 2^6\,\text{cis}(6 \cdot 30^\circ) = 64\,\text{cis}\,180^\circ = 64(-1 + 0i) = -64$.
- id: a2-h1-r2-h36
  lesson: a2-h1-polar-complex
  topic: Polar form of complex numbers
  stem: 'What does multiplying a complex number $z$ by $i$ do to its point in the complex plane?'
  choices: ['Reflects it across the real axis', 'Rotates it $90^\circ$ counterclockwise about the origin, keeping its distance from 0', 'Rotates it $90^\circ$ clockwise about the origin, keeping its distance from 0', 'Doubles its distance from 0 without turning it']
  answer: 1
  explanation: |-
    $i = 1\,\text{cis}\,90^\circ$, so multiplying by $i$ multiplies the modulus by 1 (no change) and adds $90^\circ$ to the argument: a quarter turn counterclockwise. Reflecting across the real axis is taking the conjugate.
- id: a2-h1-r2-h37
  lesson: a2-h1-polar-complex
  module_quiz: true
  topic: Powers and roots of complex numbers
  stem: 'Which statements are true? Select all that apply.'
  choices: ['$|z_1 z_2| = |z_1|\,|z_2|$ for all complex numbers $z_1$, $z_2$', 'An argument of $z_1 z_2$ is (an argument of $z_1$) times (an argument of $z_2$)', 'The equation $z^5 = 1$ has exactly five complex solutions', 'The three cube roots of a nonzero complex number are $120^\circ$ apart', 'Every nonzero complex number has exactly one argument']
  answer: [0, 2, 3]
  explanation: |-
    Moduli multiply, so the first is true, but arguments add, so the second is false. $z^5 = 1$ has five different solutions, the fifth roots of unity. The $n$ roots of a nonzero number are $\tfrac{360^\circ}{n}$ apart, which is $120^\circ$ for cube roots. Arguments are not unique: adding $360^\circ$ gives another.
- id: a2-h1-r2-h38
  lesson: a2-h1-polar-complex
  type: order
  topic: Polar form of complex numbers
  stem: 'Put these complex numbers in order of their arguments, smallest first ($0^\circ \le \theta < 360^\circ$).'
  items: ['$3 + i$', '$-1 + 2i$', '$-4 - i$', '$-1 - 3i$', '$2 - 5i$']
  explanation: |-
    Plot each point. $3 + i$ is in quadrant I (about $18^\circ$); $-1 + 2i$ is in quadrant II (about $117^\circ$); $-4 - i$ is just past $180^\circ$ in quadrant III (about $194^\circ$); $-1 - 3i$ is deeper in quadrant III, near the negative imaginary axis (about $252^\circ$); $2 - 5i$ is in quadrant IV (about $292^\circ$).
- id: a2-h1-r2-h39
  lesson: a2-h1-polar-complex
  type: match
  topic: Polar form of complex numbers
  stem: 'Match each number to its polar form.'
  pairs:
    - ['$2i$', 2 cis 90°]
    - ['$-5$', 5 cis 180°]
    - ['$1 - i$', √2 cis 315°]
    - ['$-\sqrt3 + i$', 2 cis 150°]
  distractors: [2 cis 30°, √2 cis 45°]
  explanation: |-
    $2i$ is 2 units up the imaginary axis: $2\,\text{cis}\,90^\circ$. $-5$ is 5 units left: $5\,\text{cis}\,180^\circ$. $1 - i$ has modulus $\sqrt2$ and lies in quadrant IV at $315^\circ$. $-\sqrt3 + i$ has modulus 2 and lies in quadrant II with reference angle $30^\circ$, so $150^\circ$.
- id: a2-h1-r2-h40
  lesson: a2-h1-polar-complex
  module_quiz: true
  type: label
  topic: Polar form of complex numbers
  stem: 'The point is $z = a + bi$ in the complex plane. Name the numbered parts.'
  image: {src: images/a2-h1-polar-form-blank.svg, alt: 'Two perpendicular axes with arrowheads. An arrow runs from where they cross to a point up and to the right, an arc marks the angle between the arrow and the horizontal axis, a dashed vertical segment drops from the point to the horizontal axis, and a double arrow below the horizontal axis spans from the origin to the foot of the dashed segment. Six places are numbered.'}
  labels:
    - {x: 90.6, y: 80.4, text: Real axis}
    - {x: 23.4, y: 15.2, text: Imaginary axis}
    - {x: 47.8, y: 56.7, text: Modulus r}
    - {x: 33.9, y: 75.9, text: Argument θ}
    - {x: 46.9, y: 87.0, text: Real part a}
    - {x: 70.3, y: 57.6, text: Imaginary part b}
  distractors: [Complex conjugate, Unit circle]
  explanation: |-
    The horizontal axis is the real axis and the vertical one the imaginary axis. The arrow's length is the modulus $r = \sqrt{a^2 + b^2}$ and its angle from the positive real axis is the argument $\theta$. The horizontal distance is the real part $a = r\cos\theta$ and the vertical one the imaginary part $b = r\sin\theta$.
- id: a2-h1-r2-h41
  lesson: a2-h1-polar-complex
  topic: Powers and roots of complex numbers
  stem: 'What are the fourth roots of 81 (all solutions of $z^4 = 81$)?'
  choices: ['$\pm 3$ and $\pm 3i$', '$\pm 3$ only', '$\pm 9$ and $\pm 9i$', '$\pm\tfrac{3\sqrt2}{2} \pm \tfrac{3\sqrt2}{2}i$']
  answer: 0
  explanation: |-
    $81 = 81\,\text{cis}\,0^\circ$, so the roots have modulus $\sqrt[4]{81} = 3$ and arguments $\tfrac{0^\circ + 360^\circ k}{4} = 0^\circ, 90^\circ, 180^\circ, 270^\circ$: $3, 3i, -3, -3i$. Check: $(3i)^4 = 81i^4 = 81$. Stopping at $\pm 3$ misses two roots; $\pm 9$ are square roots; the last choice is the fourth roots of $-81$.
- id: a2-h1-r2-h42
  lesson: a2-h1-polar-complex
  topic: Powers and roots of complex numbers
  stem: 'The fifth roots of $32\,\text{cis}\,100^\circ$ all have modulus 2. Which list gives their arguments?'
  choices: ['$20^\circ, 40^\circ, 60^\circ, 80^\circ, 100^\circ$', '$100^\circ, 172^\circ, 244^\circ, 316^\circ, 28^\circ$', '$20^\circ, 92^\circ, 164^\circ, 236^\circ, 308^\circ$', '$20^\circ, 110^\circ, 200^\circ, 290^\circ$']
  answer: 2
  explanation: |-
    The arguments are $\tfrac{100^\circ + 360^\circ k}{5} = 20^\circ + 72^\circ k$ for $k = 0, 1, 2, 3, 4$: $20^\circ, 92^\circ, 164^\circ, 236^\circ, 308^\circ$. Starting at $100^\circ$ forgets to divide by 5, steps of $20^\circ$ forget the $360^\circ k$, and four roots $90^\circ$ apart would be fourth roots.
# Lesson 93: rates of change
- id: a2-h1-r2-h43
  lesson: a2-h1-rates
  module_quiz: true
  topic: Average rate of change
  stem: 'Find the average rate of change of $f(x) = x^3$ from $x = 1$ to $x = 3$.'
  choices: ['$26$', '$13$', '$12$', '$6.5$']
  answer: 1
  explanation: |-
    $\dfrac{f(3) - f(1)}{3 - 1} = \dfrac{27 - 1}{2} = 13$. 26 is the change in $f$ without dividing by the change in $x$; 6.5 divides by 4; 12 is the slope at $x = 2$, not the average.
- id: a2-h1-r2-h44
  lesson: a2-h1-rates
  type: text
  topic: Average rate of change
  stem: 'A stone is dropped from a 100-ft cliff, so its height is $h(t) = 100 - 16t^2$ feet after $t$ seconds. Its average velocity from $t = 1$ to $t = 2$ is ___ ft/s. Include the sign.'
  accept: ['-48', '−48']
  explanation: |-
    $h(1) = 84$ and $h(2) = 36$, so the average velocity is $\tfrac{36 - 84}{2 - 1} = -48$ ft/s. It is negative because the height is decreasing.
- id: a2-h1-r2-h45
  lesson: a2-h1-rates
  topic: Average rate of change
  stem: 'The average rate of change of $f$ from $x = a$ to $x = b$ is the slope of which line?'
  choices: ['The tangent line at $(a, f(a))$', 'The line through the origin and $(b, f(b))$', 'The horizontal line $y = f(b) - f(a)$', 'The secant line through $(a, f(a))$ and $(b, f(b))$']
  answer: 3
  explanation: |-
    $\tfrac{f(b) - f(a)}{b - a}$ is rise over run between the two points on the graph, so it is the slope of the secant line through them. The tangent line's slope is the instantaneous rate at a single point.
- id: a2-h1-r2-h46
  lesson: a2-h1-rates
  module_quiz: true
  type: match
  topic: Average rate of change
  stem: 'Compute each function''s average rates of change over $[0, 1]$, $[1, 2]$ and $[2, 3]$, and match the function to the pattern.'
  pairs:
    - ['$f(x) = 5x - 2$', The rates stay the same]
    - ['$g(x) = x^2$', The rates go up by the same amount each step]
    - ['$k(x) = 3^x$', The rates are multiplied by the same factor each step]
    - ['$m(x) = 4 - x^2$', The rates go down by the same amount each step]
  distractors: [The rates are all zero]
  explanation: |-
    $f$: $5, 5, 5$ (constant, like any line). $g$: $1, 3, 5$ (up by 2 each step). $k$: $2, 6, 18$ (each 3 times the last). $m$: $-1, -3, -5$ (down by 2 each step, as for any quadratic opening downward). All-zero rates would need a constant function, which none of these is.
- id: a2-h1-r2-h47
  lesson: a2-h1-rates
  module_quiz: true
  topic: Difference quotients
  stem: 'Simplify the difference quotient $\dfrac{f(x + h) - f(x)}{h}$ for $f(x) = x^2 + 4x$.'
  choices: ['$2x + h + 4$', '$2x + 4$', '$1$', '$2x + h$']
  answer: 0
  explanation: |-
    $f(x + h) = x^2 + 2xh + h^2 + 4x + 4h$. Subtracting $f(x)$ leaves $2xh + h^2 + 4h$, and dividing by $h$ gives $2x + h + 4$. $2x + 4$ is what this approaches as $h \to 0$, not the quotient itself; $1$ comes from writing $f(x + h)$ as $f(x) + h$; $2x + h$ drops the $4h$.
- id: a2-h1-r2-h48
  lesson: a2-h1-rates
  type: order
  topic: Difference quotients
  stem: 'Put the steps for finding the instantaneous rate of change of $f(x) = \dfrac1x$ in order.'
  items:
    - 'Write $\dfrac{1}{x + h} - \dfrac1x$ over the common denominator $x(x + h)$'
    - 'Simplify the numerator to $-h$'
    - 'Divide by $h$, cancelling the factor $h$, to get $-\dfrac{1}{x(x + h)}$'
    - 'Let $h$ shrink toward 0 to get $-\dfrac{1}{x^2}$'
  explanation: |-
    The numerator of the difference quotient is $\tfrac{1}{x + h} - \tfrac1x = \tfrac{x - (x + h)}{x(x + h)} = \tfrac{-h}{x(x + h)}$. Dividing by $h$ cancels the $h$, and only after that can $h$ be allowed to approach 0 (before, it would give $\tfrac00$).
- id: a2-h1-r2-h49
  lesson: a2-h1-rates
  type: text
  topic: Difference quotients
  stem: 'The instantaneous rate of change of $f(x) = 5x^2 - 3x$ at $x = 2$ is ___.'
  accept: ['17']
  explanation: |-
    $f(x + h) - f(x) = 10xh + 5h^2 - 3h$, so the difference quotient is $10x + 5h - 3$. As $h$ shrinks to 0 this approaches $10x - 3$, which is $20 - 3 = 17$ at $x = 2$.
- id: a2-h1-r2-h50
  lesson: a2-h1-rates
  topic: Difference quotients
  stem: 'Which expressions are equal to the difference quotient of $f(x) = \sqrt x$ for every $h \ne 0$ (and $x > 0$, $x + h > 0$)? Select all that apply.'
  choices: ['$\dfrac{1}{\sqrt{x + h} + \sqrt x}$', '$\dfrac{\sqrt{x + h} - \sqrt x}{h}$', '$\dfrac{\sqrt h}{h}$', '$\dfrac{1}{2\sqrt x}$', '$\dfrac{h}{h\left(\sqrt{x + h} + \sqrt x\right)}$']
  answer: [0, 1, 4]
  explanation: |-
    $\tfrac{\sqrt{x + h} - \sqrt x}{h}$ is the definition. Multiplying top and bottom by the conjugate gives $\tfrac{h}{h(\sqrt{x + h} + \sqrt x)}$, which simplifies to $\tfrac{1}{\sqrt{x + h} + \sqrt x}$. $\tfrac{\sqrt h}{h}$ comes from the false step $\sqrt{x + h} = \sqrt x + \sqrt h$, and $\tfrac{1}{2\sqrt x}$ is the value the quotient approaches as $h \to 0$, not equal to it for $h \ne 0$.
- id: a2-h1-r2-h51
  lesson: a2-h1-rates
  module_quiz: true
  topic: Difference quotients
  stem: 'A ball''s height is $h(t) = 64t - 16t^2$ feet, and its velocity at time $t$ is $64 - 32t$ ft/s. What is its velocity at $t = 3$?'
  choices: ['$-16$ ft/s', '$32$ ft/s', '$-32$ ft/s', '$48$ ft/s']
  answer: 2
  explanation: |-
    $64 - 32(3) = -32$ ft/s: the ball is coming down at 32 ft/s. $-16$ ft/s is the average velocity over $[2, 3]$, and 48 is the height in feet at $t = 3$, not a velocity.
- id: a2-h1-r2-h52
  lesson: a2-h1-rates
  module_quiz: true
  type: label
  topic: Difference quotients
  stem: 'Name the numbered parts of this picture of a difference quotient.'
  image: {src: images/a2-h1-secant-blank.svg, alt: 'A rising curve with two points on it. A solid line passes through both points, a dashed line touches the curve at the left point, and dotted lines run horizontally from the left point and then vertically up to the right point. Six places are numbered.'}
  labels:
    - {x: 31.9, y: 80.2, text: 'Point (x, f(x))'}
    - {x: 73.6, y: 46.8, text: 'Point (x + h, f(x + h))'}
    - {x: 52.8, y: 80.2, text: Run h}
    - {x: 73.6, y: 72.0, text: Rise f(x + h) − f(x)}
    - {x: 87.2, y: 35.9, text: Secant line}
    - {x: 90.3, y: 56.8, text: Tangent line}
  distractors: [Directrix, Asymptote]
  explanation: |-
    The difference quotient is rise over run for the two points $(x, f(x))$ and $(x + h, f(x + h))$: the run is $h$ and the rise is $f(x + h) - f(x)$, so it is the slope of the secant line through them. The dashed line touching the curve at the first point is the tangent line, whose slope the secant slopes approach as $h$ shrinks.
- id: a2-h1-r2-h53
  lesson: a2-h1-rates
  topic: Difference quotients
  stem: 'Why can''t you find an instantaneous rate by putting $h = 0$ straight into $\dfrac{f(x + h) - f(x)}{h}$?'
  choices: ['It gives $\tfrac00$, which is undefined, so you must simplify first', 'Because $f(x + 0)$ is undefined', 'Because the secant line would be vertical', 'Because $h$ must always be negative']
  answer: 0
  explanation: |-
    With $h = 0$ the numerator is $f(x) - f(x) = 0$ and the denominator is 0, and $\tfrac00$ has no value. Simplifying first cancels the factor $h$, leaving an expression you can evaluate as $h$ approaches 0. $f(x + 0) = f(x)$ is perfectly defined, and $h$ can be positive or negative.
- id: a2-h1-r2-h54
  lesson: a2-h1-rates
  topic: Difference quotients
  stem: 'The instantaneous rate of change of $x^2$ at $x$ is $2x$. What is the tangent line to $y = x^2$ at $(-2, 4)$?'
  choices: ['$y = 4x + 12$', '$y = -4x + 4$', '$y = -2x$', '$y = -4x - 4$']
  answer: 3
  explanation: |-
    The slope at $x = -2$ is $2(-2) = -4$. Point-slope form: $y - 4 = -4(x + 2)$, so $y = -4x - 4$. Check: $-4(-2) - 4 = 4$. $y = 4x + 12$ passes through the point but has the wrong sign of slope, and $y = -4x + 4$ has the right slope but misses the point.
- id: a2-h1-r2-h55
  lesson: a2-h1-rates
  topic: Average rate of change
  stem: 'Find the average rate of change of $k(x) = 2^x$ from $x = 3$ to $x = 5$.'
  choices: ['$24$', '$16$', '$12$', '$6$']
  answer: 2
  explanation: |-
    $\dfrac{2^5 - 2^3}{5 - 3} = \dfrac{32 - 8}{2} = 12$. 24 forgets to divide by the change in $x$, 6 divides by 4, and 16 is $k(4)$, the function's value at the midpoint, not a rate.
- id: a2-h1-r2-h56
  lesson: a2-h1-rates
  topic: Average rate of change
  stem: '$C(t)$ is the cost of a service in dollars, $t$ years after 2020. What are the units of the average rate of change of $C$ from 2020 to 2025?'
  choices: ['Years per dollar', 'Dollars per year', 'Dollars', 'Dollar-years']
  answer: 1
  explanation: |-
    The average rate of change is $\tfrac{\Delta C}{\Delta t}$: dollars divided by years, so dollars per year. It is in units of the output per unit of the input.
