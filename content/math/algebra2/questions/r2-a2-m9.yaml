# Round 2: new question types for a2-m9 (core lessons 29-30) and its honors lessons 30h1-30h2
# ---------- a2-unit-circle (core) ----------
- id: a2-m9-r2-q01
  lesson: a2-unit-circle
  module_quiz: true
  topic: Unit circle
  type: label
  stem: 'The picture shows the unit circle and a point at angle $\theta$. Name the numbered parts.'
  image: {src: images/a2-m9-unit-triangle-blank.svg, alt: 'The unit circle with a point on it in quadrant I, joined to the origin, with a right triangle drawn down to the x-axis. Five parts are numbered: the point, the horizontal leg, the vertical leg, the slanted side and the angle at the origin.'}
  labels:
    - {x: 63.3, y: 24.9, text: 'Point (cos θ, sin θ)'}
    - {x: 56.6, y: 54.5, text: 'Leg of length cos θ'}
    - {x: 63.3, y: 39.7, text: 'Leg of length sin θ'}
    - {x: 51.7, y: 38.4, text: 'Radius of length 1'}
    - {x: 47.5, y: 51.7, text: 'The angle θ'}
  distractors: ['Point (sin θ, cos θ)', 'Leg of length tan θ']
  explanation: |-
    The slanted side runs from the center to the circle, so it is a radius of length 1. The point where it meets the circle is $(\cos\theta, \sin\theta)$: cosine is the $x$-coordinate (the horizontal leg) and sine is the $y$-coordinate (the vertical leg). The angle $\theta$ is at the origin, measured from the positive $x$-axis. Swapping sine and cosine is the usual mistake.
- id: a2-m9-r2-q02
  lesson: a2-unit-circle
  topic: Unit circle
  type: text
  stem: 'On the unit circle, the point at angle $\theta$ has coordinates ( ___ $\theta$, ___ $\theta$ ). Type the name of the function in each blank.'
  accept:
    - [cos, cosine]
    - [sin, sine]
  explanation: |-
    The $x$-coordinate is $\cos\theta$ and the $y$-coordinate is $\sin\theta$, so the point is $(\cos\theta, \sin\theta)$. For an acute angle this matches the right-triangle ratios, because the hypotenuse is 1.
- id: a2-m9-r2-q03
  lesson: a2-unit-circle
  topic: Angles and radians
  type: text
  stem: 'Convert $\dfrac{5\pi}{6}$ radians to degrees. Give only the number of degrees: ___'
  accept: ['150', '150°']
  explanation: |-
    Multiply by $\dfrac{180^\circ}{\pi}$: $\dfrac{5\pi}{6} \cdot \dfrac{180^\circ}{\pi} = 5 \cdot 30^\circ = 150^\circ$.
- id: a2-m9-r2-q04
  lesson: a2-unit-circle
  topic: Unit circle
  type: order
  stem: 'To find $\cos 480^\circ$ exactly, put these steps in order.'
  items:
    - 'Subtract $360^\circ$ to get the coterminal angle $120^\circ$'
    - 'Note that $120^\circ$ is in quadrant II'
    - 'Find the reference angle: $180^\circ - 120^\circ = 60^\circ$'
    - 'Use the quadrant I value $\cos 60^\circ = \tfrac12$'
    - 'Attach the quadrant II sign: $\cos 480^\circ = -\tfrac12$'
  explanation: |-
    First bring the angle into $0^\circ$ to $360^\circ$ ($480^\circ - 360^\circ = 120^\circ$). The quadrant decides which reference-angle formula to use, the reference angle gives the quadrant I value, and the quadrant's sign is attached last: cosine is negative in quadrant II, so $\cos 480^\circ = -\tfrac12$.
- id: a2-m9-r2-q05
  lesson: a2-unit-circle
  topic: Angles and radians
  type: match
  stem: 'Match each angle in standard position to where its terminal side lies.'
  pairs:
    - ['$200^\circ$', Quadrant III]
    - ['$-30^\circ$', Quadrant IV]
    - ['$\dfrac{5\pi}{6}$', Quadrant II]
    - ['$400^\circ$', Quadrant I]
    - ['$\dfrac{3\pi}{2}$', On an axis (quadrantal)]
  explanation: |-
    $200^\circ$ is between $180^\circ$ and $270^\circ$: quadrant III. $-30^\circ$ is coterminal with $330^\circ$: quadrant IV. $\tfrac{5\pi}{6} = 150^\circ$: quadrant II. $400^\circ - 360^\circ = 40^\circ$: quadrant I. $\tfrac{3\pi}{2} = 270^\circ$ lies on the negative $y$-axis, so it is a quadrantal angle and in no quadrant.
- id: a2-m9-r2-q06
  lesson: a2-unit-circle
  module_quiz: true
  topic: Angles and radians
  stem: 'Which angles are coterminal with $60^\circ$? Select all that apply.'
  choices: ['$420^\circ$', '$-300^\circ$', '$300^\circ$', '$\dfrac{7\pi}{3}$', '$-60^\circ$']
  answer: [0, 1, 3]
  explanation: |-
    Coterminal angles differ by a whole number of full turns. $60^\circ + 360^\circ = 420^\circ$; $60^\circ - 360^\circ = -300^\circ$; $\tfrac{7\pi}{3} = 420^\circ$. But $300^\circ$ and $-60^\circ$ are the same angle as each other, the reflection of $60^\circ$ across the $x$-axis (quadrant IV), and they differ from $60^\circ$ by $240^\circ$ and $120^\circ$, which are not multiples of $360^\circ$.
# ---------- a2-trig-graphs (core) ----------
- id: a2-m9-r2-q07
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Sinusoid graphs
  type: label
  stem: 'Name the numbered parts of this sinusoid.'
  image: {src: images/a2-m9-sinusoid-parts-blank.svg, alt: 'A wave above the x-axis with a dashed horizontal line through its middle. Five parts are numbered: a vertical double arrow from the dashed line up to a peak, a horizontal double arrow from one peak to the next, the dashed line, a peak, and a low point.'}
  labels:
    - {x: 83.8, y: 33.3, text: Amplitude}
    - {x: 52.2, y: 12.2, text: Period}
    - {x: 71.0, y: 47.2, text: Midline}
    - {x: 23.2, y: 19.4, text: Maximum}
    - {x: 52.2, y: 75.0, text: Minimum}
  distractors: [Phase shift, Frequency]
  explanation: |-
    The amplitude is the distance from the midline up to a maximum (half the full height). The period is the horizontal length of one full cycle, here from one maximum to the next. The midline is the horizontal line through the middle of the wave; the maximum and minimum are the highest and lowest points. The phase shift is a horizontal shift and the frequency is a number of cycles per unit; neither is a part you can point to on this picture.
- id: a2-m9-r2-q08
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  type: text
  stem: 'For $y = 3\sin\left(\dfrac{\pi}{5}x\right) - 2$: the amplitude is ___, the period is ___, and the midline is $y =$ ___. Give numbers only.'
  accept:
    - ['3']
    - ['10']
    - ['-2', '−2']
  explanation: |-
    Amplitude $|a| = 3$. Period $\dfrac{2\pi}{b} = \dfrac{2\pi}{\pi/5} = 2\pi \cdot \dfrac{5}{\pi} = 10$. The vertical shift $k = -2$ gives the midline $y = -2$.
- id: a2-m9-r2-q09
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  type: order
  stem: 'Start at $x = 0$ and move right through one full period of $y = -\sin x$. Put the places the graph passes through in order.'
  items:
    - 'Start: on the midline, heading down'
    - 'Minimum'
    - 'On the midline, heading up'
    - 'Maximum'
    - 'End of the cycle: back on the midline'
  explanation: |-
    $y = -\sin x$ is $\sin x$ flipped over its midline. Sine starts on the midline going up, so $-\sin x$ starts on the midline going down. It reaches its minimum $-1$ at $\tfrac{\pi}{2}$, crosses the midline going up at $\pi$, reaches its maximum $1$ at $\tfrac{3\pi}{2}$, and is back on the midline at $2\pi$.
- id: a2-m9-r2-q10
  lesson: a2-trig-graphs
  topic: Sinusoid graphs
  type: match
  stem: 'Match each function to its period.'
  pairs:
    - ['$y = \sin(2x)$', π]
    - ['$y = \cos\left(\dfrac{x}{2}\right)$', 4π]
    - ['$y = 5\sin(\pi x)$', '2']
    - ['$y = 3\cos(4x) + 1$', π/2]
  distractors: ['4', 2π]
  explanation: |-
    Period $= \dfrac{2\pi}{b}$ in each case: $\dfrac{2\pi}{2} = \pi$; $\dfrac{2\pi}{1/2} = 4\pi$; $\dfrac{2\pi}{\pi} = 2$; $\dfrac{2\pi}{4} = \dfrac{\pi}{2}$. The amplitude and the vertical shift never change the period. The distractor 4 is what you get by reading $b = 4$ as the period.
- id: a2-m9-r2-q11
  lesson: a2-trig-graphs
  module_quiz: true
  topic: Sinusoid graphs
  stem: 'Which statements about $y = -3\cos(2x) + 1$ are true? Select all that apply.'
  choices: ['The amplitude is 3.', 'The period is $\pi$.', 'The maximum value is 4.', 'The graph is at a maximum at $x = 0$.', 'The midline is $y = -3$.']
  answer: [0, 1, 2]
  explanation: |-
    Amplitude $|-3| = 3$; period $\dfrac{2\pi}{2} = \pi$; midline $y = 1$, so the maximum is $1 + 3 = 4$ and the minimum $1 - 3 = -2$. At $x = 0$, $y = -3\cos 0 + 1 = -2$, the minimum: the negative $a$ flips cosine so it starts at a minimum. $-3$ is $a$, not the midline.
- id: a2-m9-r2-q12
  lesson: a2-trig-graphs
  topic: Periodic models
  type: text
  stem: 'In a city the average daily high temperature peaks at 90°F in July and bottoms out at 50°F in January. In a sinusoid model, the midline is ___ °F and the amplitude is ___ °F. Give numbers only.'
  accept:
    - ['70']
    - ['20']
  explanation: |-
    Midline $= \dfrac{90 + 50}{2} = 70$; amplitude $= \dfrac{90 - 50}{2} = 20$. The full swing of 40°F is twice the amplitude.
# ---------- a2-m9-h-tangent (honors) ----------
- id: a2-m9-r2-h01
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Find the exact value of $\tan 300^\circ$.'
  choices: ['$-\sqrt3$', '$\sqrt3$', '$-\dfrac{\sqrt3}{3}$', '$-\dfrac12$']
  answer: 0
  explanation: |-
    $300^\circ$ is in quadrant IV with reference angle $60^\circ$: $\cos 300^\circ = \tfrac12$, $\sin 300^\circ = -\tfrac{\sqrt3}{2}$. So $\tan 300^\circ = \dfrac{-\sqrt3/2}{1/2} = -\sqrt3$. Tangent is negative in quadrant IV. $-\tfrac{\sqrt3}{3}$ is $\cot 300^\circ$, and $-\tfrac12$ uses a reference angle of $30^\circ$ for sine alone.
- id: a2-m9-r2-h02
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Why is the period of $y = \tan x$ equal to $\pi$ rather than $2\pi$?'
  choices: ['Because $\tan x$ has twice the amplitude of $\sin x$', 'Because the point at angle $x + \pi$ is the opposite point $(-\cos x, -\sin x)$, and the ratio $\tfrac{y}{x}$ is unchanged', 'Because $\tan x$ is undefined at $\pi$', 'Because $\tan x = \sin x \cdot \cos x$, which repeats twice as fast']
  answer: 1
  explanation: |-
    Adding $\pi$ moves to the opposite point of the circle, where both coordinates change sign. The quotient $\dfrac{-y}{-x} = \dfrac{y}{x}$ is the same: both points are on the same line through the origin, with the same slope. Tangent has no amplitude, is $0$ (not undefined) at $\pi$, and is a quotient, not a product.
- id: a2-m9-r2-h03
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Find the exact value of $\sec 135^\circ$.'
  choices: ['$\sqrt2$', '$-\dfrac{\sqrt2}{2}$', '$-1$', '$-\sqrt2$']
  answer: 3
  explanation: |-
    $\cos 135^\circ = -\tfrac{\sqrt2}{2}$ (quadrant II, reference angle $45^\circ$), so $\sec 135^\circ = \dfrac{1}{-\sqrt2/2} = -\dfrac{2}{\sqrt2} = -\sqrt2$. Secant keeps the sign of cosine. $\sqrt2$ is $\csc 135^\circ$ and $-1$ is $\tan 135^\circ$.
- id: a2-m9-r2-h04
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Find the exact value of $\csc\dfrac{7\pi}{6}$.'
  choices: ['$-\dfrac12$', '$-2$', '$2$', '$-\dfrac{2\sqrt3}{3}$']
  answer: 1
  explanation: |-
    $\tfrac{7\pi}{6} = 210^\circ$ is in quadrant III with reference angle $30^\circ$, so $\sin\tfrac{7\pi}{6} = -\tfrac12$ and $\csc\tfrac{7\pi}{6} = \dfrac{1}{-1/2} = -2$. $-\tfrac{2\sqrt3}{3}$ is $\sec\tfrac{7\pi}{6}$ (cosecant and secant swapped), and $-\tfrac12$ is the sine itself.
- id: a2-m9-r2-h05
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'If $\tan\theta = -\tfrac34$ and $\theta$ is in quadrant II, find $\sec\theta$.'
  choices: ['$\dfrac54$', '$-\dfrac53$', '$-\dfrac54$', '$-\dfrac45$']
  answer: 2
  explanation: |-
    $\sec^2\theta = 1 + \tan^2\theta = 1 + \tfrac{9}{16} = \tfrac{25}{16}$, so $\sec\theta = \pm\tfrac54$. Cosine is negative in quadrant II, and secant has the sign of cosine: $\sec\theta = -\tfrac54$. $-\tfrac45$ is $\cos\theta$, and $-\tfrac53$ is $\csc\theta$ with the wrong sign (it is $+\tfrac53$).
- id: a2-m9-r2-h06
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Where are the vertical asymptotes of $y = \tan(2x)$? ($k$ is any integer.)'
  choices: ['$x = \dfrac{\pi}{2} + k\pi$', '$x = \dfrac{k\pi}{2}$', '$x = \pi + 2k\pi$', '$x = \dfrac{\pi}{4} + \dfrac{k\pi}{2}$']
  answer: 3
  explanation: |-
    Tangent is undefined where its input is $\tfrac{\pi}{2} + k\pi$. Set $2x = \tfrac{\pi}{2} + k\pi$, so $x = \tfrac{\pi}{4} + \tfrac{k\pi}{2}$. $\tfrac{\pi}{2} + k\pi$ is for $\tan x$ (forgetting the 2), and $\tfrac{k\pi}{2}$ gives the zeros, not the asymptotes.
- id: a2-m9-r2-h07
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'A line has slope $-1$. What is its angle of inclination?'
  choices: ['$135^\circ$', '$45^\circ$', '$-45^\circ$', '$315^\circ$']
  answer: 0
  explanation: |-
    The slope is $\tan\alpha$ with $0^\circ \le \alpha < 180^\circ$. $\tan\alpha = -1$ needs a quadrant II angle with reference angle $45^\circ$: $\alpha = 135^\circ$. $-45^\circ$ and $315^\circ$ also have tangent $-1$, but they are outside the range used for angles of inclination; $45^\circ$ gives slope $+1$.
- id: a2-m9-r2-h08
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Which identity do you get by dividing every term of $\sin^2\theta + \cos^2\theta = 1$ by $\cos^2\theta$?'
  choices: ['$1 + \cot^2\theta = \csc^2\theta$', '$\tan^2\theta + 1 = \csc^2\theta$', '$\tan^2\theta + 1 = \sec^2\theta$', '$\tan^2\theta - 1 = \sec^2\theta$']
  answer: 2
  explanation: |-
    $\dfrac{\sin^2\theta}{\cos^2\theta} = \tan^2\theta$, $\dfrac{\cos^2\theta}{\cos^2\theta} = 1$ and $\dfrac{1}{\cos^2\theta} = \sec^2\theta$, so $\tan^2\theta + 1 = \sec^2\theta$. Dividing by $\sin^2\theta$ instead gives $1 + \cot^2\theta = \csc^2\theta$.
- id: a2-m9-r2-h09
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'What is the range of $y = \sec x$?'
  choices: ['$[-1, 1]$', 'All real numbers', '$(-\infty, -1] \cup [1, \infty)$', '$[1, \infty)$']
  answer: 2
  explanation: |-
    $\cos x$ takes values in $[-1, 1]$ (never 0 where secant is defined), so its reciprocal has absolute value at least 1. Where $\cos x$ is negative, $\sec x \le -1$, so the range includes both pieces: $(-\infty, -1] \cup [1, \infty)$. All real numbers is the range of tangent.
- id: a2-m9-r2-h10
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  type: text
  stem: 'The period of $y = 4\tan\left(\dfrac{\pi}{3}x\right)$ is ___. Give only the number.'
  accept: ['3']
  explanation: |-
    For $y = a\tan(bx)$ the period is $\dfrac{\pi}{b} = \dfrac{\pi}{\pi/3} = 3$. Using $\dfrac{2\pi}{b}$ (the sine and cosine rule) would give 6.
- id: a2-m9-r2-h11
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  type: match
  stem: 'Match each function to where it is undefined.'
  pairs:
    - ['$\tan x$', Where cos x = 0]
    - ['$\sec x$', Where cos x = 0]
    - ['$\csc x$', Where sin x = 0]
    - ['$\cot x$', Where sin x = 0]
  distractors: [Nowhere, Where tan x = 0]
  explanation: |-
    $\tan x = \dfrac{\sin x}{\cos x}$ and $\sec x = \dfrac{1}{\cos x}$ have $\cos x$ in the denominator; $\csc x = \dfrac{1}{\sin x}$ and $\cot x = \dfrac{\cos x}{\sin x}$ have $\sin x$ there. Each fails exactly where its denominator is 0.
- id: a2-m9-r2-h12
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  stem: 'Which of these values are undefined? Select all that apply.'
  choices: ['$\tan 90^\circ$', '$\sec 270^\circ$', '$\cot 0^\circ$', '$\csc 90^\circ$', '$\sec 180^\circ$']
  answer: [0, 1, 2]
  explanation: |-
    $\cos 90^\circ = 0$ makes $\tan 90^\circ$ undefined; $\cos 270^\circ = 0$ makes $\sec 270^\circ$ undefined; $\sin 0^\circ = 0$ makes $\cot 0^\circ$ undefined. But $\csc 90^\circ = \tfrac{1}{1} = 1$ and $\sec 180^\circ = \tfrac{1}{-1} = -1$ are defined.
- id: a2-m9-r2-h13
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  type: label
  stem: 'The dashed vertical line is $x = 1$, tangent to the unit circle at $(1, 0)$. The terminal side of $\theta$ is extended to meet it. Name the numbered parts.'
  image: {src: images/a2-m9-tangent-line-blank.svg, alt: 'The unit circle with a dashed vertical line touching it on the right. A line from the origin at an angle crosses the circle and continues to the dashed line. Five parts are numbered: where the slanted line crosses the circle, where it meets the dashed line, the thick vertical segment on the dashed line, the vertical segment from the circle point to the x-axis, and the angle at the origin.'}
  labels:
    - {x: 58.6, y: 39.9, text: 'Point (cos θ, sin θ)'}
    - {x: 65.4, y: 33.5, text: 'Point (1, tan θ)'}
    - {x: 65.4, y: 47.2, text: 'Segment of length tan θ'}
    - {x: 58.6, y: 54.7, text: 'Segment of length sin θ'}
    - {x: 41.2, y: 58.9, text: 'The angle θ'}
  distractors: ['Point (1, sin θ)', 'Segment of length cos θ']
  explanation: |-
    The terminal side crosses the circle at $(\cos\theta, \sin\theta)$; the vertical drop from there to the $x$-axis has length $\sin\theta$. The small triangle (legs $\cos\theta$ and $\sin\theta$) and the big one (legs 1 and the height of the far point) are similar, so that height is $\dfrac{\sin\theta}{\cos\theta} = \tan\theta$: the far point is $(1, \tan\theta)$ and the thick segment on the tangent line has length $\tan\theta$.
- id: a2-m9-r2-h14
  lesson: a2-m9-h-tangent
  topic: Tangent and reciprocal functions
  type: order
  stem: 'Put these values in order from smallest to largest.'
  items: ['$\tan 100^\circ$', '$\tan 170^\circ$', '$\tan 10^\circ$', '$\tan 50^\circ$', '$\tan 85^\circ$']
  explanation: |-
    Tangent is the slope of the terminal side. $100^\circ$ is just past vertical, a steep negative slope (about $-5.67$); $170^\circ$ is a gentle negative slope (about $-0.18$); $10^\circ$ a gentle positive one (about $0.18$); $50^\circ$ is a bit steeper than $45^\circ$ (about $1.19$); and $85^\circ$ is nearly vertical (about $11.4$).
# ---------- a2-m9-h-trig-equations (honors) ----------
- id: a2-m9-r2-h15
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Find the exact value of $\arcsin\left(-\dfrac{\sqrt2}{2}\right)$.'
  choices: ['$\dfrac{5\pi}{4}$', '$-\dfrac{\pi}{4}$', '$\dfrac{7\pi}{4}$', '$-\dfrac{\pi}{3}$']
  answer: 1
  explanation: |-
    The answer must be in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$. Sine is $-\tfrac{\sqrt2}{2}$ at reference angle $\tfrac{\pi}{4}$ in quadrant IV, so the principal value is $-\tfrac{\pi}{4}$. $\tfrac{5\pi}{4}$ and $\tfrac{7\pi}{4}$ also have that sine, but they are outside the range of arcsin.
- id: a2-m9-r2-h16
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Find the exact value of $\arccos\left(-\dfrac{\sqrt3}{2}\right)$.'
  choices: ['$-\dfrac{\pi}{6}$', '$\dfrac{7\pi}{6}$', '$\dfrac{2\pi}{3}$', '$\dfrac{5\pi}{6}$']
  answer: 3
  explanation: |-
    The answer must be in $[0, \pi]$. A negative cosine there means quadrant II; the reference angle with cosine $\tfrac{\sqrt3}{2}$ is $\tfrac{\pi}{6}$, so the answer is $\pi - \tfrac{\pi}{6} = \tfrac{5\pi}{6}$. $\tfrac{7\pi}{6}$ has the same cosine but is out of range; $\tfrac{2\pi}{3}$ has cosine $-\tfrac12$.
- id: a2-m9-r2-h17
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Find the exact value of $\arctan\left(-\sqrt3\right)$.'
  choices: ['$-\dfrac{\pi}{3}$', '$\dfrac{2\pi}{3}$', '$-\dfrac{\pi}{6}$', '$\dfrac{5\pi}{3}$']
  answer: 0
  explanation: |-
    $\tan\tfrac{\pi}{3} = \sqrt3$, and arctan answers in $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$, so a negative value means $-\tfrac{\pi}{3}$. $\tfrac{2\pi}{3}$ and $\tfrac{5\pi}{3}$ also have tangent $-\sqrt3$ but are outside the range; $\tan\left(-\tfrac{\pi}{6}\right) = -\tfrac{\sqrt3}{3}$.
- id: a2-m9-r2-h18
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Why is the domain of sine restricted to $\left[-\dfrac{\pi}{2}, \dfrac{\pi}{2}\right]$ before taking its inverse?'
  choices: ['Sine is undefined outside that interval', 'On that interval sine is one-to-one and still takes every value from $-1$ to $1$', 'That interval is one full period of sine', 'Sine is positive on that interval']
  answer: 1
  explanation: |-
    A function needs to be one-to-one to have an inverse. On $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ sine rises steadily from $-1$ to $1$, so each output comes from exactly one input and no output is lost. Sine is defined everywhere; the interval is half a period; and sine is negative on the left half.
- id: a2-m9-r2-h19
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'What is $\arcsin(1.5)$?'
  choices: ['About $0.98$ radians', 'About $56.4^\circ$', 'Undefined, because no angle has a sine greater than 1', '$\dfrac{\pi}{2} + 0.5$']
  answer: 2
  explanation: |-
    The domain of arcsin is $[-1, 1]$, because sine only takes values in that range. There is no angle with $\sin\theta = 1.5$, so $\arcsin 1.5$ is undefined, and a calculator gives an error.
- id: a2-m9-r2-h20
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Solve $2\cos x - \sqrt3 = 0$ on $[0, 2\pi)$.'
  choices: ['$x = \dfrac{\pi}{6}$ only', '$x = \dfrac{\pi}{6}$ or $x = \dfrac{5\pi}{6}$', '$x = \dfrac{\pi}{3}$ or $x = \dfrac{5\pi}{3}$', '$x = \dfrac{\pi}{6}$ or $x = \dfrac{11\pi}{6}$']
  answer: 3
  explanation: |-
    $\cos x = \tfrac{\sqrt3}{2}$, so $x = \pm\tfrac{\pi}{6} + 2\pi k$. In $[0, 2\pi)$: $\tfrac{\pi}{6}$ and $-\tfrac{\pi}{6} + 2\pi = \tfrac{11\pi}{6}$. The pair $\tfrac{\pi}{6}, \tfrac{5\pi}{6}$ uses the sine rule $\pi - \alpha$, which is wrong for cosine ($\cos\tfrac{5\pi}{6} = -\tfrac{\sqrt3}{2}$). $\tfrac{\pi}{3}, \tfrac{5\pi}{3}$ solve $\cos x = \tfrac12$.
- id: a2-m9-r2-h21
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'How many solutions does $\sin(3x) = 0.4$ have on $[0, 2\pi)$?'
  choices: ['2', '3', '6', 'Infinitely many']
  answer: 2
  explanation: |-
    With $u = 3x$, $u$ runs over $[0, 6\pi)$: three full turns. $\sin u = 0.4$ has two solutions in each turn (0.4 is strictly between $-1$ and $1$), so there are $3 \times 2 = 6$ values of $u$, and dividing each by 3 gives 6 solutions for $x$.
- id: a2-m9-r2-h22
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Solve $\cos x = -0.4$ for $0^\circ \le x < 360^\circ$, to the nearest tenth of a degree.'
  choices: ['$113.6^\circ$ and $246.4^\circ$', '$113.6^\circ$ and $66.4^\circ$', '$66.4^\circ$ and $293.6^\circ$', '$23.6^\circ$ and $156.4^\circ$']
  answer: 0
  explanation: |-
    $\arccos(-0.4) \approx 113.6^\circ$ (degree mode). The other solution is $-113.6^\circ$, coterminal with $360^\circ - 113.6^\circ = 246.4^\circ$. $66.4^\circ$ and $293.6^\circ$ solve $\cos x = +0.4$, and $23.6^\circ$, $156.4^\circ$ solve $\sin x = 0.4$.
- id: a2-m9-r2-h23
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'A rider''s height on a Ferris wheel is $h(t) = -20\cos\left(\dfrac{\pi}{5}t\right) + 25$ meters, $t$ minutes after boarding. During the first revolution, when is the rider first 15 m above the ground?'
  choices: ['$t = \dfrac{5}{3} \approx 1.67$ min', '$t = \dfrac{10}{3} \approx 3.33$ min', '$t = \dfrac{5}{6} \approx 0.83$ min', '$t = \dfrac{25}{3} \approx 8.33$ min']
  answer: 0
  explanation: |-
    $-20\cos\left(\tfrac{\pi}{5}t\right) + 25 = 15$ gives $\cos\left(\tfrac{\pi}{5}t\right) = \tfrac12$, so $\tfrac{\pi}{5}t = \tfrac{\pi}{3}$ (first time) and $t = \tfrac53 \approx 1.67$ min. The other solution in the first revolution, $\tfrac{\pi}{5}t = \tfrac{5\pi}{3}$, gives $t = \tfrac{25}{3}$, when the rider comes back down through 15 m. $\tfrac{10}{3}$ is when the rider reaches 35 m.
- id: a2-m9-r2-h24
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Which expression equals $\csc x$?'
  choices: ['$\sin^{-1} x$', '$\arcsin x$', '$(\sin x)^{-1}$', '$\sin(x^{-1})$']
  answer: 2
  explanation: |-
    $(\sin x)^{-1} = \dfrac{1}{\sin x} = \csc x$. But $\sin^{-1} x$ is another name for $\arcsin x$, the inverse function, not the reciprocal. $\sin(x^{-1}) = \sin\tfrac1x$ is something else again.
- id: a2-m9-r2-h25
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  type: text
  stem: 'In degrees, $\arccos\left(\tfrac12\right) =$ ___ and $\arcsin\left(-1\right) =$ ___. Give numbers only.'
  accept:
    - ['60', '60°']
    - ['-90', '−90', '-90°', '−90°']
  explanation: |-
    $\cos 60^\circ = \tfrac12$ and $60^\circ$ is in $[0^\circ, 180^\circ]$, the range of arccos. $\sin(-90^\circ) = -1$ and $-90^\circ$ is in $[-90^\circ, 90^\circ]$, the range of arcsin. ($270^\circ$ also has sine $-1$, but it is out of range.)
- id: a2-m9-r2-h26
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  type: order
  stem: 'Put the steps for finding all solutions of $3\sin x - 1 = 0$ in order.'
  items:
    - 'Isolate the sine: $\sin x = \tfrac13$'
    - 'Find the principal value: $x = \arcsin\tfrac13 \approx 0.340$'
    - 'Find the second solution in the cycle: $x = \pi - 0.340 \approx 2.802$'
    - 'Add $2\pi k$ to each solution'
  explanation: |-
    The inverse function only works once $\sin x$ is alone, so isolate first. The principal value comes from arcsin; the second solution in the same cycle is $\pi$ minus it (needs the first); and the full solution set adds whole turns to both: $x \approx 0.340 + 2\pi k$ or $x \approx 2.802 + 2\pi k$.
- id: a2-m9-r2-h27
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  type: match
  stem: 'Match each inverse function to its range of outputs (its principal values).'
  pairs:
    - ['$\arcsin x$', From −π/2 to π/2 including both ends]
    - ['$\arccos x$', From 0 to π including both ends]
    - ['$\arctan x$', Strictly between −π/2 and π/2]
  distractors: [From 0 to 2π, From −π to π]
  explanation: |-
    Arcsin uses the piece of sine on $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ and arccos the piece of cosine on $[0, \pi]$, endpoints included. Arctan uses $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$ without the ends, because tangent is undefined at $\pm\tfrac{\pi}{2}$.
- id: a2-m9-r2-h28
  lesson: a2-m9-h-trig-equations
  topic: Inverse trig and equations
  stem: 'Which values are solutions of $2\sin^2 x - \sin x - 1 = 0$ on $[0, 2\pi)$? Select all that apply.'
  choices: ['$\dfrac{\pi}{2}$', '$\dfrac{7\pi}{6}$', '$\dfrac{11\pi}{6}$', '$\dfrac{\pi}{6}$', '$\dfrac{3\pi}{2}$']
  answer: [0, 1, 2]
  explanation: |-
    Factor: $(2\sin x + 1)(\sin x - 1) = 0$, so $\sin x = -\tfrac12$ or $\sin x = 1$. $\sin x = 1$ at $\tfrac{\pi}{2}$; $\sin x = -\tfrac12$ at $\tfrac{7\pi}{6}$ and $\tfrac{11\pi}{6}$. At $\tfrac{\pi}{6}$, $\sin x = \tfrac12$ gives $2 \cdot \tfrac14 - \tfrac12 - 1 = -1 \ne 0$; at $\tfrac{3\pi}{2}$, $\sin x = -1$ gives $2 + 1 - 1 = 2 \ne 0$.
