# Sequences and series
- id: alg-q-3901
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'What is the common difference of $7, 3, -1, -5, \ldots$?'
  choices: ['$-\tfrac37$', '$4$', '$-4$', '$-1$']
  answer: 2
  explanation: |-
    Each term minus the one before: $3 - 7 = -4$, $-1 - 3 = -4$, and so on. Subtracting in the other order gives $+4$.
- id: alg-q-3902
  lesson: alg-arith-seq
  module_quiz: true
  topic: Arithmetic sequences
  stem: 'Which explicit formula gives $2, 9, 16, 23, \ldots$?'
  choices: ['$a_n = 5n + 2$', '$a_n = 7n + 2$', '$a_n = 2n + 7$', '$a_n = 7n - 5$']
  answer: 3
  explanation: |-
    $a_n = a_1 + (n - 1)d = 2 + 7(n - 1) = 7n - 5$. Check: $a_1 = 2$, $a_2 = 9$. $7n + 2$ forgets the $n - 1$.
- id: alg-q-3903
  lesson: alg-arith-seq
  module_quiz: true
  topic: Arithmetic sequences
  stem: 'Find the 30th term of $11, 8, 5, \ldots$'
  choices: ['$-73$', '$-79$', '$98$', '$-76$']
  answer: 3
  explanation: |-
    $a_{30} = 11 + 29(-3) = -76$. Using 30 steps instead of 29 gives $-79$.
- id: alg-q-3904
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'An arithmetic sequence has $a_3 = 10$ and $a_9 = 34$. What is $a_1$?'
  choices: ['$-2$', '$2$', '$6$', '$4$']
  answer: 1
  explanation: |-
    Six steps from term 3 to term 9: $6d = 24$, so $d = 4$. Then $a_1 = a_3 - 2d = 10 - 8 = 2$.
- id: alg-q-3905
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'What is $1 + 2 + 3 + \cdots + 200$?'
  choices: ['$40{,}200$', '$20{,}100$', '$20{,}000$', '$10{,}050$']
  answer: 1
  explanation: |-
    $S = \dfrac{n(a_1 + a_n)}{2} = \dfrac{200 \cdot 201}{2} = 20{,}100$. Forgetting to divide by 2 gives 40,200.
- id: alg-q-3906
  lesson: alg-arith-seq
  module_quiz: true
  topic: Arithmetic sequences
  stem: 'Find the sum of the first 20 terms of $5, 9, 13, \ldots$'
  choices: ['$81$', '$1{,}720$', '$860$', '$900$']
  answer: 2
  explanation: |-
    $a_{20} = 5 + 19(4) = 81$, so $S_{20} = \dfrac{20(5 + 81)}{2} = 860$. 81 is just the 20th term.
- id: alg-q-3907
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'Evaluate $\displaystyle\sum_{k=1}^{10} (3k + 2)$.'
  choices: ['$185$', '$32$', '$165$', '$370$']
  answer: 0
  explanation: |-
    The terms run from 5 to 32 in steps of 3: $S = \dfrac{10(5 + 32)}{2} = 185$. 32 is only the last term.
- id: alg-q-3908
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'A sequence has $a_1 = 4$ and $a_n = a_{n-1} - 3$. What is $a_4$?'
  choices: ['$-8$', '$-5$', '$-2$', '$13$']
  answer: 1
  explanation: |-
    $a_2 = 1$, $a_3 = -2$, $a_4 = -5$.
- id: alg-q-3909
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'Which term of $7, 12, 17, \ldots$ is 102?'
  choices: ['The 19th', 'The 20th', 'The 21st', 'The 95th']
  answer: 1
  explanation: |-
    $7 + 5(n - 1) = 102$, so $5(n - 1) = 95$, $n - 1 = 19$ and $n = 20$.
- id: alg-q-3910
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'Which sequence is arithmetic?'
  choices: ['$-2, 1, 4, 7, \ldots$', '$1, 4, 9, 16, \ldots$', '$3, 6, 12, 24, \ldots$', '$1, -1, 1, -1, \ldots$']
  answer: 0
  explanation: |-
    $-2, 1, 4, 7$ has constant difference 3. The squares have differences 3, 5, 7; doubling is geometric; and the alternating sequence has differences $-2, 2, -2$.
- id: alg-q-3911
  lesson: alg-arith-seq
  topic: Arithmetic sequences
  stem: 'An auditorium has 15 seats in the first row and 3 more in each following row. How many seats are in 12 rows?'
  choices: ['$378$', '$48$', '$396$', '$189$']
  answer: 0
  explanation: |-
    $a_{12} = 15 + 11(3) = 48$. $S_{12} = \dfrac{12(15 + 48)}{2} = 378$. 48 is the number in the last row.

- id: alg-q-4001
  lesson: alg-geom-seq
  topic: Geometric sequences
  stem: 'What is the common ratio of $81, 27, 9, 3, \ldots$?'
  choices: ['$\tfrac13$', '$3$', '$-54$', '$-\tfrac13$']
  answer: 0
  explanation: |-
    Divide each term by the previous: $\tfrac{27}{81} = \tfrac13$. Subtracting ($-54$) gives a difference, not a ratio.
- id: alg-q-4002
  lesson: alg-geom-seq
  module_quiz: true
  topic: Geometric sequences
  stem: 'Find the 7th term of $2, 6, 18, \ldots$'
  choices: ['$4{,}374$', '$1{,}458$', '$486$', '$46{,}656$']
  answer: 1
  explanation: |-
    $a_7 = 2 \cdot 3^{6} = 2 \cdot 729 = 1458$. Using $3^7$ gives 4,374; $(2 \cdot 3)^6$ gives 46,656.
- id: alg-q-4003
  lesson: alg-geom-seq
  topic: Geometric sequences
  stem: 'Which formula gives $5, -10, 20, -40, \ldots$?'
  choices: ['$a_n = 5 - 15(n - 1)$', '$a_n = 5(2)^{n-1}$', '$a_n = (-10)^{n-1}$', '$a_n = 5(-2)^{n-1}$']
  answer: 3
  explanation: |-
    $a_1 = 5$ and $r = -2$ (the signs alternate). $a_n = a_1r^{n-1}$.
- id: alg-q-4004
  lesson: alg-geom-seq
  topic: Geometric sequences
  stem: 'A geometric sequence has $a_3 = 18$ and $a_6 = 486$. What is $a_1$?'
  choices: ['$\tfrac23$', '$6$', '$2$', '$54$']
  answer: 2
  explanation: |-
    Three multiplications: $r^3 = \tfrac{486}{18} = 27$, so $r = 3$. Then $a_1 = \tfrac{18}{3^2} = 2$.
- id: alg-q-4005
  lesson: alg-geom-seq
  module_quiz: true
  topic: Series
  stem: 'Find the sum of the first 6 terms of $4, 12, 36, \ldots$'
  choices: ['$972$', '$2{,}916$', '$1{,}456$', '$728$']
  answer: 2
  explanation: |-
    $S_6 = \dfrac{4(1 - 3^6)}{1 - 3} = \dfrac{4(-728)}{-2} = 1456$. 972 is the 6th term.
- id: alg-q-4006
  lesson: alg-geom-seq
  topic: Series
  stem: 'Find the sum of the infinite series $10 + 5 + 2.5 + \cdots$'
  choices: ['$17.5$', '$15$', '$20$', 'It has no finite sum']
  answer: 2
  explanation: |-
    $r = \tfrac12$, so $S = \dfrac{10}{1 - \tfrac12} = 20$.
- id: alg-q-4007
  lesson: alg-geom-seq
  module_quiz: true
  topic: Series
  stem: 'What is the sum of the infinite series $3 + 6 + 12 + \cdots$?'
  choices: ['$-3$', 'It has no finite sum, because $|r| \ge 1$', '$21$', '$6$']
  answer: 1
  explanation: |-
    $r = 2$, so the terms grow and the series diverges. Blindly using $\tfrac{a_1}{1 - r}$ gives the meaningless $-3$.
- id: alg-q-4008
  lesson: alg-geom-seq
  topic: Series
  stem: 'Find the sum of $8 - 4 + 2 - 1 + \cdots$'
  choices: ['$\tfrac83$', '$16$', '$5$', '$\tfrac{16}{3}$']
  answer: 3
  explanation: |-
    $r = -\tfrac12$: $S = \dfrac{8}{1 - (-\frac12)} = \dfrac{8}{1.5} = \dfrac{16}{3}$. Using $r = +\tfrac12$ gives 16.
- id: alg-q-4009
  lesson: alg-geom-seq
  topic: Series
  stem: 'Write $0.\overline{7} = 0.777\ldots$ as a fraction.'
  choices: ['$\tfrac79$', '$\tfrac{7}{10}$', '$\tfrac{7}{99}$', '$\tfrac{77}{100}$']
  answer: 0
  explanation: |-
    $0.7 + 0.07 + 0.007 + \cdots$ has $a_1 = 0.7$ and $r = 0.1$: $S = \dfrac{0.7}{0.9} = \dfrac79$.
- id: alg-q-4010
  lesson: alg-geom-seq
  topic: Geometric sequences
  stem: 'Which sequence is geometric?'
  choices: ['$5, 15, 45, 135, \ldots$', '$5, 10, 15, 20, \ldots$', '$1, 4, 9, 16, \ldots$', '$2, 4, 8, 14, \ldots$']
  answer: 0
  explanation: |-
    Each term of $5, 15, 45, 135$ is 3 times the previous. $5, 10, 15, 20$ is arithmetic, and $1, 4, 9, 16$ and $2, 4, 8, 14$ have neither constant differences nor constant ratios.
- id: alg-q-4011
  lesson: alg-geom-seq
  topic: Series
  stem: 'A ball is dropped from 10 m and each bounce reaches 60% of the previous height. What total vertical distance does it travel?'
  choices: ['30 m', '25 m', '16 m', '40 m']
  answer: 3
  explanation: |-
    The first drop is 10 m. Then each bounce goes up and down: $2(6 + 3.6 + 2.16 + \cdots) = 2 \cdot \dfrac{6}{1 - 0.6} = 30$. Total $10 + 30 = 40$ m.
- id: alg-q-4012
  lesson: alg-geom-seq
  topic: Series
  stem: 'Evaluate $\displaystyle\sum_{k=1}^{5} 2 \cdot 3^{k-1}$.'
  choices: ['$162$', '$726$', '$242$', '$484$']
  answer: 2
  explanation: |-
    $2 + 6 + 18 + 54 + 162 = 242$, or $\dfrac{2(1 - 3^5)}{1 - 3} = 242$. 162 is just the last term.
