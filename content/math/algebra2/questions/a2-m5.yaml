# Rational expressions and functions
- id: alg-q-3001
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x^2 - 9}{x^2 + x - 6}$.'
  choices: ['$\dfrac{x - 3}{x + 2}$', '$\dfrac{x + 3}{x - 2}$', '$\dfrac{-9}{x - 6}$', '$\dfrac{x - 3}{x - 2}$']
  answer: 3
  explanation: |-
    $\dfrac{(x - 3)(x + 3)}{(x + 3)(x - 2)} = \dfrac{x - 3}{x - 2}$, with $x \ne -3, 2$. Cancelling the $x^2$ terms gives the meaningless $\tfrac{-9}{x - 6}$.
- id: alg-q-3002
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Which values are excluded from the domain of $\dfrac{x + 1}{x^2 - 5x + 6}$?'
  choices: ['$x = 2$ and $x = 3$', '$x = -1$', '$x = -2$ and $x = -3$', '$x = 6$']
  answer: 0
  explanation: |-
    The denominator $(x - 2)(x - 3)$ is zero at 2 and 3. A zero numerator ($x = -1$) is allowed.
- id: alg-q-3003
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x + 6}{x + 3}$.'
  choices: ['$\dfrac{x + 2}{x + 1}$', '$2$', '$x + 2$', 'It is already in lowest terms']
  answer: 3
  explanation: |-
    There are no common factors; $x$ and 6 are terms, not factors. At $x = 1$ the expression is $\tfrac74$, not 2.
- id: alg-q-3004
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Simplify $\dfrac{5 - x}{x - 5}$.'
  choices: ['$-1$', '$1$', '$0$', '$x - 5$']
  answer: 0
  explanation: |-
    $5 - x = -(x - 5)$, so the quotient is $-1$ (for $x \ne 5$).
- id: alg-q-3005
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{2x^2 - 8}{4x + 8}$.'
  choices: ['$\dfrac{x + 2}{2}$', '$\dfrac{x - 2}{4}$', '$\dfrac{2x - 1}{4}$', '$\dfrac{x - 2}{2}$']
  answer: 3
  explanation: |-
    $\dfrac{2(x - 2)(x + 2)}{4(x + 2)} = \dfrac{x - 2}{2}$, with $x \ne -2$.
- id: alg-q-3006
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Multiply $\dfrac{x^2 - 4}{3x} \cdot \dfrac{6x^2}{x + 2}$.'
  choices: ['$2x(x + 2)$', '$\dfrac{x - 2}{2x}$', '$2x(x - 2)$', '$6x(x - 2)$']
  answer: 2
  explanation: |-
    $\dfrac{(x - 2)(x + 2)}{3x} \cdot \dfrac{6x^2}{x + 2}$: cancel $(x + 2)$ and $3x$ from $6x^2$, leaving $2x(x - 2)$.
- id: alg-q-3007
  lesson: alg-rational-simplify
  module_quiz: true
  topic: Rational expressions
  stem: 'Divide $\dfrac{x^2 - 1}{x + 3} \div \dfrac{x - 1}{x^2 + 3x}$.'
  choices: ['$x + 1$', '$\dfrac{x + 1}{x}$', '$\dfrac{(x - 1)^2(x + 1)}{x(x + 3)^2}$', '$x(x + 1)$']
  answer: 3
  explanation: |-
    Multiply by the reciprocal: $\dfrac{(x - 1)(x + 1)}{x + 3} \cdot \dfrac{x(x + 3)}{x - 1} = x(x + 1)$. Multiplying without flipping gives $\dfrac{(x - 1)(x + 1)}{x + 3} \cdot \dfrac{x - 1}{x(x + 3)} = \dfrac{(x - 1)^2(x + 1)}{x(x + 3)^2}$.
- id: alg-q-3008
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'The graph of $f(x) = \dfrac{x^2 - 1}{x - 1}$ looks like the line $y = x + 1$ except for what?'
  choices: ['A hole at $(-1, 0)$', 'A vertical asymptote at $x = 1$', 'A hole at $(1, 2)$', 'Nothing; it is exactly the line']
  answer: 2
  explanation: |-
    $f(x) = \dfrac{(x - 1)(x + 1)}{x - 1} = x + 1$ for $x \ne 1$. The factor cancels, so there's a hole, not an asymptote, at $x = 1$, where the line would have $y = 2$.
- id: alg-q-3009
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'A student simplifies $\dfrac{x + 5}{5}$ to $x$. What is wrong?'
  choices: ['The answer should be 1', 'Nothing; the answer is $x$', 'The answer should be $x + 1$', 'Only common factors cancel; 5 is a term of the numerator, not a factor']
  answer: 3
  explanation: |-
    $\dfrac{x + 5}{5} = \dfrac{x}{5} + 1$. Test $x = 5$: the original is 2, not 5.
- id: alg-q-3010
  lesson: alg-rational-simplify
  topic: Rational expressions
  stem: 'Which values must be excluded in $\dfrac{x}{x + 4} \div \dfrac{x - 2}{x + 1}$?'
  choices: ['$-4$ and $2$ only', '$-4$ and $-1$ only', '$-4$, $-1$ and $2$', '$0$ and $2$']
  answer: 2
  explanation: |-
    Both original denominators can't be zero ($-4$, $-1$), and the divisor can't be zero, which happens when its numerator $x - 2 = 0$.

- id: alg-q-3101
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{2x + 3}{x - 1} - \dfrac{x + 4}{x - 1}$.'
  choices: ['$\dfrac{3x + 7}{x - 1}$', '$1$', '$\dfrac{x + 7}{x - 1}$', '$\dfrac{x - 1}{2x - 2}$']
  answer: 1
  explanation: |-
    $\dfrac{(2x + 3) - (x + 4)}{x - 1} = \dfrac{x - 1}{x - 1} = 1$ for $x \ne 1$. Not distributing the minus gives $\tfrac{x + 7}{x - 1}$.
- id: alg-q-3102
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'What is the least common denominator of $\dfrac{1}{x^2 - 4}$ and $\dfrac{1}{x^2 + 4x + 4}$?'
  choices: ['$(x - 2)(x + 2)^2$', '$(x^2 - 4)(x^2 + 4x + 4)$', '$(x - 2)(x + 2)$', '$(x + 2)^2$']
  answer: 0
  explanation: |-
    The denominators are $(x - 2)(x + 2)$ and $(x + 2)^2$. Take each factor to its highest power: $(x - 2)(x + 2)^2$. The full product works but is not least.
- id: alg-q-3103
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac1x + \dfrac1y$.'
  choices: ['$\dfrac{2}{x + y}$', '$\dfrac{x + y}{xy}$', '$\dfrac{1}{x + y}$', '$\dfrac{2}{xy}$']
  answer: 1
  explanation: |-
    LCD $xy$: $\dfrac{y}{xy} + \dfrac{x}{xy} = \dfrac{x + y}{xy}$. Denominators never add.
- id: alg-q-3104
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{3}{x} - \dfrac{2}{x + 1}$.'
  choices: ['$\dfrac{1}{x(x + 1)}$', '$\dfrac{x + 3}{x(x + 1)}$', '$\dfrac{5x + 3}{x(x + 1)}$', '$\dfrac{x - 3}{x(x + 1)}$']
  answer: 1
  explanation: |-
    $\dfrac{3(x + 1) - 2x}{x(x + 1)} = \dfrac{x + 3}{x(x + 1)}$. Subtracting only the numerators ($3 - 2$) skips the conversion to the LCD.
- id: alg-q-3105
  lesson: alg-rational-add
  module_quiz: true
  topic: Rational expressions
  stem: 'Simplify $\dfrac{x}{x^2 - 9} - \dfrac{1}{x - 3}$.'
  choices: ['$\dfrac{3}{(x - 3)(x + 3)}$', '$\dfrac{-3}{(x - 3)(x + 3)}$', '$\dfrac{x - 1}{x^2 - 9}$', '$\dfrac{2x + 3}{(x - 3)(x + 3)}$']
  answer: 1
  explanation: |-
    $\dfrac{1}{x - 3} = \dfrac{x + 3}{(x - 3)(x + 3)}$. Then $\dfrac{x - (x + 3)}{(x - 3)(x + 3)} = \dfrac{-3}{(x - 3)(x + 3)}$. Dropping the parentheses gives $+3$.
- id: alg-q-3106
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'Simplify $\dfrac{4}{x - 2} + \dfrac{1}{2 - x}$.'
  choices: ['$\dfrac{3}{x - 2}$', '$\dfrac{5}{x - 2}$', '$\dfrac{3}{2 - x}$', '$\dfrac{5}{(x - 2)(2 - x)}$']
  answer: 0
  explanation: |-
    $\dfrac{1}{2 - x} = \dfrac{-1}{x - 2}$, so the sum is $\dfrac{4 - 1}{x - 2} = \dfrac{3}{x - 2}$.
- id: alg-q-3107
  lesson: alg-rational-add
  module_quiz: true
  topic: Complex fractions
  stem: 'Simplify $\dfrac{1 + \dfrac1x}{1 - \dfrac{1}{x^2}}$.'
  choices: ['$\dfrac{1}{x - 1}$', '$\dfrac{x + 1}{x - 1}$', '$x$', '$\dfrac{x}{x - 1}$']
  answer: 3
  explanation: |-
    Multiply top and bottom by $x^2$: $\dfrac{x^2 + x}{x^2 - 1} = \dfrac{x(x + 1)}{(x - 1)(x + 1)} = \dfrac{x}{x - 1}$.
- id: alg-q-3108
  lesson: alg-rational-add
  topic: Complex fractions
  stem: 'Simplify $\dfrac{\tfrac12 + \tfrac13}{\tfrac14}$.'
  choices: ['$\tfrac85$', '$\tfrac{5}{24}$', '$\tfrac{10}{3}$', '$\tfrac12$']
  answer: 2
  explanation: |-
    The top is $\tfrac56$. Dividing by $\tfrac14$ means multiplying by 4: $\tfrac{20}{6} = \tfrac{10}{3}$. Multiplying by $\tfrac14$ instead gives $\tfrac{5}{24}$.
- id: alg-q-3109
  lesson: alg-rational-add
  topic: Complex fractions
  stem: 'Two resistors of 6 and 3 ohms in parallel have resistance $R = \dfrac{1}{\tfrac16 + \tfrac13}$. What is $R$?'
  choices: ['$4.5$ ohms', '$9$ ohms', '$2$ ohms', '$\tfrac12$ ohm']
  answer: 2
  explanation: |-
    $\tfrac16 + \tfrac13 = \tfrac12$, and its reciprocal is 2. Equivalently $\tfrac{R_1R_2}{R_1 + R_2} = \tfrac{18}{9} = 2$.
- id: alg-q-3110
  lesson: alg-rational-add
  topic: Rational expressions
  stem: 'A student writes $\dfrac{x}{x - 2} - \dfrac{x + 1}{x - 2} = \dfrac{x - x + 1}{x - 2} = \dfrac{1}{x - 2}$. What is the error?'
  choices: ['The result should be $\dfrac{2x + 1}{x - 2}$', 'Nothing is wrong', 'The denominators should be subtracted too', 'The minus sign must apply to all of $x + 1$; the result is $\dfrac{-1}{x - 2}$']
  answer: 3
  explanation: |-
    $x - (x + 1) = -1$, so the difference is $\dfrac{-1}{x - 2}$.

- id: alg-q-3201
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve $\dfrac{4}{x} + \dfrac13 = \dfrac{7}{x}$.'
  choices: ['$x = 33$', '$x = 3$', '$x = \tfrac94$', '$x = 9$']
  answer: 3
  explanation: |-
    Multiply by $3x$: $12 + x = 21$, so $x = 9$. Check: $\tfrac49 + \tfrac39 = \tfrac79$.
- id: alg-q-3202
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  stem: 'Solve $\dfrac{x}{x - 4} = \dfrac{4}{x - 4} + 3$.'
  choices: ['$x = 0$', '$x = 4$', 'No solution', '$x = -4$']
  answer: 2
  explanation: |-
    Multiply by $x - 4$: $x = 4 + 3(x - 4)$, so $-2x = -8$ and $x = 4$. But 4 makes the denominators zero, so it's extraneous and there's no solution.
- id: alg-q-3203
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve $\dfrac{2}{x + 1} = \dfrac{3}{x - 2}$.'
  choices: ['$x = 1$', '$x = 7$', '$x = -\tfrac15$', '$x = -7$']
  answer: 3
  explanation: |-
    Cross products: $2(x - 2) = 3(x + 1)$, so $2x - 4 = 3x + 3$ and $x = -7$. Check: $\tfrac{2}{-6} = \tfrac{3}{-9} = -\tfrac13$.
- id: alg-q-3204
  lesson: alg-rational-eq
  module_quiz: true
  topic: Rational equations
  stem: 'Solve $\dfrac{x}{x + 3} + \dfrac{2}{x - 3} = 1$.'
  choices: ['$x = -15$', '$x = 15$', '$x = 3$', '$x = 9$']
  answer: 1
  explanation: |-
    Multiply by $(x + 3)(x - 3)$: $x(x - 3) + 2(x + 3) = x^2 - 9$, so $-x + 6 = -9$ and $x = 15$. Check: $\tfrac{15}{18} + \tfrac{2}{12} = \tfrac56 + \tfrac16 = 1$.
- id: alg-q-3205
  lesson: alg-rational-eq
  module_quiz: true
  topic: Work and rate
  stem: 'One pipe fills a tank in 4 hours and another in 12 hours. How long do they take together?'
  choices: ['4 hours', '8 hours', '16 hours', '3 hours']
  answer: 3
  explanation: |-
    $\tfrac14 + \tfrac1{12} = \tfrac{4}{12} = \tfrac13$ tank per hour, so 3 hours. Averaging the times gives the wrong 8 hours.
- id: alg-q-3206
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'Two people together finish a job in 6 hours. One of them alone takes 10 hours. How long does the other take alone?'
  choices: ['16 hours', '4 hours', '15 hours', '8 hours']
  answer: 2
  explanation: |-
    $\tfrac1{10} + \tfrac1t = \tfrac16$, so $\tfrac1t = \tfrac16 - \tfrac1{10} = \tfrac{1}{15}$ and $t = 15$ hours. Subtracting the times (4) is a common error.
- id: alg-q-3207
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'A boat goes 24 km downstream in the same time it goes 16 km upstream. The current is 2 km/h. What is the boat''s speed in still water?'
  choices: ['20 km/h', '8 km/h', '12 km/h', '10 km/h']
  answer: 3
  explanation: |-
    $\dfrac{24}{b + 2} = \dfrac{16}{b - 2}$, so $24b - 48 = 16b + 32$ and $b = 10$. Check: $\tfrac{24}{12} = \tfrac{16}{8} = 2$ hours.
- id: alg-q-3208
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Solve the proportion $\dfrac{3}{8} = \dfrac{x}{20}$.'
  choices: ['$x = 53.3$', '$x = 7.5$', '$x = 10.7$', '$x = 15$']
  answer: 1
  explanation: |-
    Cross products: $8x = 60$, so $x = 7.5$.
- id: alg-q-3209
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'Why must solutions of rational equations be checked?'
  choices: ['Multiplying by the LCD can introduce values that make an original denominator zero', 'The LCD is always negative', 'Rational equations never have real solutions', 'Cross products always change the sign of the answer']
  answer: 0
  explanation: |-
    The LCD is zero at the excluded values, and multiplying by zero can create false solutions. Any candidate that is an excluded value must be rejected.
- id: alg-q-3210
  lesson: alg-rational-eq
  topic: Rational equations
  stem: 'A recipe uses 3 cups of flour for 24 cookies. How much flour is needed for 40 cookies?'
  choices: ['5 cups', '6 cups', '4 cups', '8 cups']
  answer: 0
  explanation: |-
    $\dfrac{3}{24} = \dfrac{f}{40}$, so $24f = 120$ and $f = 5$ cups.
- id: alg-q-3211
  lesson: alg-rational-eq
  topic: Work and rate
  stem: 'A driver covers 120 miles at speed $r$ and then 150 miles at $r + 10$, spending equal time on each part. What is $r$?'
  choices: ['40 mph', '50 mph', '30 mph', '12 mph']
  answer: 0
  explanation: |-
    $\dfrac{120}{r} = \dfrac{150}{r + 10}$, so $120r + 1200 = 150r$ and $r = 40$. Each part takes 3 hours.

- id: a2-q-1601
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'Describe the breaks in the graph of $f(x) = \dfrac{x - 2}{x^2 - 4}$.'
  choices: ['Vertical asymptotes $x = 2$ and $x = -2$', 'A hole at $x = 2$ and a vertical asymptote $x = -2$', 'A hole at $x = -2$ and a vertical asymptote $x = 2$', 'A vertical asymptote $x = -2$ and no hole']
  answer: 1
  explanation: |-
    Factor: $\dfrac{x - 2}{(x - 2)(x + 2)} = \dfrac{1}{x + 2}$ for $x \ne 2$. The cancelled factor $(x - 2)$ gives a hole at $x = 2$ (at height $\tfrac14$); the remaining $(x + 2)$ gives a vertical asymptote $x = -2$.
- id: a2-q-1602
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'What is the horizontal asymptote of $f(x) = \dfrac{4x^2 - 1}{2x^2 + 3x}$?'
  choices: ['$y = 0$', '$y = 4$', '$y = -\tfrac13$', '$y = 2$']
  answer: 3
  explanation: |-
    The degrees are equal (2 and 2), so the asymptote is the ratio of leading coefficients: $y = \tfrac42 = 2$.
- id: a2-q-1603
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'What is the horizontal asymptote of $f(x) = \dfrac{5x + 3}{x^2 + 1}$?'
  choices: ['$y = 0$', '$y = 5$', '$y = 3$', 'There is no horizontal asymptote']
  answer: 0
  explanation: |-
    The numerator has lower degree (1) than the denominator (2), so for large $|x|$ the denominator wins and $f(x) \to 0$: the asymptote is $y = 0$.
- id: a2-q-1604
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Rational functions
  stem: 'Where is the hole in the graph of $g(x) = \dfrac{x^2 + x - 6}{x - 2}$?'
  choices: ['$(2, 0)$', '$(-3, 0)$', '$(2, 5)$', '$(5, 2)$']
  answer: 2
  explanation: |-
    $\dfrac{(x + 3)(x - 2)}{x - 2} = x + 3$ for $x \ne 2$. The hole is at $x = 2$, and its height comes from the simplified form: $2 + 3 = 5$. So the graph is the line $y = x + 3$ with the point $(2, 5)$ missing. The point $(-3, 0)$ is the $x$-intercept.
- id: a2-q-1605
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'What are the $x$-intercepts of $f(x) = \dfrac{x^2 - 1}{x^2 - 3x + 2}$?'
  choices: ['$x = 1$ and $x = -1$', '$x = 1$ only', '$x = 1$ and $x = 2$', '$x = -1$ only']
  answer: 3
  explanation: |-
    $\dfrac{(x - 1)(x + 1)}{(x - 1)(x - 2)}$: the factor $(x - 1)$ cancels, so $x = 1$ is a hole, not an intercept. The simplified numerator $x + 1$ is zero at $x = -1$, the only $x$-intercept. ($x = 2$ is a vertical asymptote.)
- id: a2-q-1606
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'What is the $y$-intercept of $f(x) = \dfrac{3x - 6}{x + 4}$?'
  choices: ['$2$', '$-\tfrac32$', '$-6$', '$3$']
  answer: 1
  explanation: |-
    $f(0) = \dfrac{-6}{4} = -\tfrac32$. The value 2 is the $x$-intercept (where $3x - 6 = 0$), and 3 is the horizontal asymptote.
- id: a2-q-1607
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'What are the asymptotes of $y = \dfrac{3}{x + 1} - 4$?'
  choices: ['$x = 1$ and $y = -4$', '$x = -1$ and $y = 3$', '$x = -1$ and $y = -4$', '$x = -4$ and $y = -1$']
  answer: 2
  explanation: |-
    This is $y = \tfrac1x$ stretched by 3, shifted left 1 and down 4. The asymptotes $x = 0$ and $y = 0$ move with it to $x = -1$ and $y = -4$.
- id: a2-q-1608
  lesson: a2-rational-graphs
  module_quiz: true
  topic: Inverse variation
  stem: '$y$ varies inversely with $x$, and $y = 6$ when $x = 4$. Find $y$ when $x = 8$.'
  choices: ['$3$', '$12$', '$2$', '$\tfrac43$']
  answer: 0
  explanation: |-
    $k = xy = 4 \cdot 6 = 24$, so $y = \tfrac{24}{8} = 3$. Doubling $x$ halves $y$. The answer 12 treats it as direct variation.
- id: a2-q-1609
  lesson: a2-rational-graphs
  topic: Inverse variation
  stem: 'At a constant temperature, the pressure of a gas varies inversely with its volume. At 2 L the pressure is 300 kPa. What is the pressure at 5 L?'
  choices: ['$120$ kPa', '$750$ kPa', '$1500$ kPa', '$60$ kPa']
  answer: 0
  explanation: |-
    $k = PV = 300 \cdot 2 = 600$, so $P = \tfrac{600}{5} = 120$ kPa. A larger volume gives a smaller pressure; 750 kPa comes from direct variation.
- id: a2-q-1610
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'Which statement about $f(x) = \dfrac{x}{x^2 + 1}$ is true?'
  choices: ['It has vertical asymptotes $x = 1$ and $x = -1$', 'It has no horizontal asymptote', 'It crosses its horizontal asymptote $y = 0$ at the origin', 'Its horizontal asymptote is $y = 1$']
  answer: 2
  explanation: |-
    The denominator $x^2 + 1$ is never zero, so there are no vertical asymptotes. Degree 1 over degree 2 gives the asymptote $y = 0$, and $f(0) = 0$, so the graph crosses it at the origin. A horizontal asymptote only describes the far ends.
- id: a2-q-1611
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'How does the graph of $f(x) = \dfrac{1}{(x - 3)^2}$ behave near $x = 3$?'
  choices: ['It rises on the left and falls on the right', 'Both sides rise toward $+\infty$', 'Both sides fall toward $-\infty$', 'It has a hole at $x = 3$']
  answer: 1
  explanation: |-
    $x = 3$ is a vertical asymptote (nothing cancels). The squared denominator is positive on both sides, so $f(x)$ is large and positive on both sides: the factor appears an even number of times.
- id: a2-q-1612
  lesson: a2-rational-graphs
  topic: Rational functions
  stem: 'Which function has vertical asymptote $x = 2$ and horizontal asymptote $y = 3$?'
  choices: ['$f(x) = \dfrac{3x - 3}{x + 2}$', '$f(x) = \dfrac{x - 3}{x - 2}$', '$f(x) = \dfrac{3x - 6}{x - 2}$', '$f(x) = \dfrac{3x - 3}{x - 2}$']
  answer: 3
  explanation: |-
    $\dfrac{3x - 3}{x - 2}$: the denominator is zero at 2 and the numerator isn't (it's 3), so $x = 2$ is a vertical asymptote; equal degrees give $y = \tfrac31 = 3$. $\dfrac{3x - 3}{x + 2}$ has its vertical asymptote at $x = -2$, $\dfrac{x - 3}{x - 2}$ has horizontal asymptote $y = 1$, and $\dfrac{3x - 6}{x - 2}$ simplifies to $3$ with a hole at $x = 2$.

- id: a2-q-ineq-01
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  stem: 'Solve $x^2 - 9 < 0$.'
  choices: ['$(-\infty, -3) \cup (3, \infty)$', '$x < 3$', '$(-3, 3)$', '$[-3, 3]$']
  answer: 2
  explanation: |-
    $(x - 3)(x + 3) < 0$ has critical values $-3$ and $3$. A test value of 0 gives $-9 < 0$, and values outside give positive results, so the solution is $(-3, 3)$. The two outer rays are where the expression is positive; $x < 3$ comes from "taking the square root" of $x^2 < 9$ and loses the left end; and the endpoints give 0, which is not $< 0$.
- id: a2-q-ineq-02
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Polynomial inequalities
  stem: 'Solve $x^2 + 2x - 8 \ge 0$.'
  choices: ['$(-\infty, -4] \cup [2, \infty)$', '$[-4, 2]$', '$(-\infty, -2] \cup [4, \infty)$', '$(-\infty, -4) \cup (2, \infty)$']
  answer: 0
  explanation: |-
    $(x + 4)(x - 2) \ge 0$. Test values: $x = -5$ gives $7$, $x = 0$ gives $-8$, $x = 3$ gives $7$. Keep the positive intervals and, because of $\ge$, the zeros: $(-\infty, -4] \cup [2, \infty)$. The interval $[-4, 2]$ is where it's negative, the critical values $-2$ and $4$ come from factoring as $(x - 4)(x + 2)$, and open endpoints leave out the zeros that $\ge$ allows.
- id: a2-q-ineq-03
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  stem: 'Solve $(x + 1)(x - 2)(x - 5) > 0$.'
  choices: ['$(-\infty, -1) \cup (2, 5)$', '$(5, \infty)$', '$(-1, 5)$', '$(-1, 2) \cup (5, \infty)$']
  answer: 3
  explanation: |-
    Critical values $-1$, $2$, $5$. Signs: $x < -1$ gives $(-)(-)(-) = -$; $-1 < x < 2$ gives $(+)(-)(-) = +$; $2 < x < 5$ gives $(+)(+)(-) = -$; $x > 5$ gives $+$. Keep the positive intervals: $(-1, 2) \cup (5, \infty)$. The intervals $(-\infty, -1) \cup (2, 5)$ are the negative ones, $(5, \infty)$ misses the middle positive interval, and $(-1, 5)$ wrongly includes $(2, 5)$, where the product is negative.
- id: a2-q-ineq-04
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  stem: 'Solve $(x - 2)^2(x + 1) \le 0$.'
  choices: ['$(-\infty, -1]$', '$(-\infty, -1] \cup \{2\}$', '$[-1, 2]$', '$[-1, \infty)$']
  answer: 1
  explanation: |-
    $(x - 2)^2 \ge 0$ always, so the product has the sign of $x + 1$, except that it equals 0 at $x = 2$. Negative or zero: $x \le -1$, plus the single point $x = 2$. Leaving out $\{2\}$ forgets that $\le$ allows 0; $[-1, 2]$ comes from assuming the signs alternate at the double zero; and $[-1, \infty)$ is where the product is $\ge 0$.
- id: a2-q-ineq-05
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Polynomial inequalities
  stem: 'A student solves $x^2 > 4x$ by dividing both sides by $x$, getting $x > 4$. What is the complete solution?'
  choices: ['$(-\infty, 0) \cup (4, \infty)$', '$(4, \infty)$', '$(0, 4)$', '$(-\infty, 4)$']
  answer: 0
  explanation: |-
    Dividing by $x$ is unsafe: $x$ might be negative (which flips the symbol) or zero. Instead, $x^2 - 4x > 0$, so $x(x - 4) > 0$, with critical values 0 and 4. The product is positive for $x < 0$ and $x > 4$. The student's $(4, \infty)$ misses the negative numbers (try $x = -1$: $1 > -4$), $(0, 4)$ is where the product is negative, and $(-\infty, 4)$ mixes the two.
- id: a2-q-ineq-06
  lesson: a2-poly-rational-ineq
  topic: Polynomial inequalities
  stem: 'A ball''s height is $h = -16t^2 + 48t + 4$ feet after $t$ seconds. When is it at least 36 feet high?'
  choices: ['$0 \le t \le 3$', '$t \le 1$ or $t \ge 2$', '$1 \le t \le 2$', '$t \ge 2$']
  answer: 2
  explanation: |-
    $-16t^2 + 48t + 4 \ge 36$ gives $-16t^2 + 48t - 32 \ge 0$. Divide by $-16$ and flip: $t^2 - 3t + 2 \le 0$, so $(t - 1)(t - 2) \le 0$ and $1 \le t \le 2$. Forgetting to flip gives the outside intervals, $t \ge 2$ keeps only one boundary, and $0 \le t \le 3$ uses the roots of $-16t^2 + 48t = 0$, where the height is 4 feet, not 36.
- id: a2-q-ineq-07
  lesson: a2-poly-rational-ineq
  topic: Rational inequalities
  stem: 'Solve $\dfrac{x - 4}{x + 2} < 0$.'
  choices: ['$[-2, 4]$', '$(-\infty, -2) \cup (4, \infty)$', '$(-4, 2)$', '$(-2, 4)$']
  answer: 3
  explanation: |-
    Critical values: 4 (numerator) and $-2$ (denominator). Test $x = 0$: $\tfrac{-4}{2} < 0$; outside the interval the fraction is positive. The symbol is strict and $-2$ makes the fraction undefined, so the solution is $(-2, 4)$. Closed brackets include an undefined point and a zero; the outer rays are where the fraction is positive; and $(-4, 2)$ uses the opposite signs of the critical values.
- id: a2-q-ineq-08
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Rational inequalities
  stem: 'Solve $\dfrac{x + 3}{x - 1} \ge 0$.'
  choices: ['$(-\infty, -3] \cup [1, \infty)$', '$(-\infty, -3] \cup (1, \infty)$', '$[-3, 1)$', '$(-\infty, -3) \cup (1, \infty)$']
  answer: 1
  explanation: |-
    Critical values $-3$ (numerator) and $1$ (denominator). Test values: $x = -4$ gives $\tfrac{-1}{-5} > 0$, $x = 0$ gives $-3 < 0$, $x = 2$ gives $5 > 0$. Keep the positive intervals; include $-3$ (the fraction is 0 there) but never $1$ (undefined). Including 1 is the denominator mistake, excluding $-3$ forgets that $\ge$ allows 0, and $[-3, 1)$ is where the fraction is $\le 0$.
- id: a2-q-ineq-09
  lesson: a2-poly-rational-ineq
  topic: Rational inequalities
  stem: 'What are the critical values of $\dfrac{x^2 - 4}{x + 5} \le 0$?'
  choices: ['$2$ and $-5$', '$-2$ and $2$ only', '$-5$, $-2$ and $2$', '$4$ and $-5$']
  answer: 2
  explanation: |-
    Critical values are the zeros of the numerator, $x^2 - 4 = (x - 2)(x + 2)$, so $\pm 2$, and of the denominator, $-5$. Missing $-2$ forgets the negative square root, leaving out $-5$ ignores the denominator, and 4 is the value of $x^2$, not of $x$.
- id: a2-q-ineq-10
  lesson: a2-poly-rational-ineq
  module_quiz: true
  topic: Rational inequalities
  stem: 'Solve $\dfrac{2x}{x - 3} \le 1$.'
  choices: ['$x \le -3$', '$(-3, 3]$', '$(-\infty, -3] \cup (3, \infty)$', '$[-3, 3)$']
  answer: 3
  explanation: |-
    Subtract 1: $\dfrac{2x - (x - 3)}{x - 3} = \dfrac{x + 3}{x - 3} \le 0$. Critical values $-3$ (included) and 3 (excluded); test $x = 0$: $\tfrac{3}{-3} < 0$. So $[-3, 3)$. Cross-multiplying gives $2x \le x - 3$, or $x \le -3$, which is wrong because $x - 3$ is negative for some $x$ (for example $x = 0$ works but isn't $\le -3$). $(-3, 3]$ swaps which end is included, and the outer rays are where the fraction is positive.
- id: a2-q-ineq-11
  lesson: a2-poly-rational-ineq
  topic: Rational inequalities
  stem: 'Why shouldn''t you multiply both sides of $\dfrac{x + 2}{x - 1} > 3$ by $x - 1$?'
  choices: ['The sign of $x - 1$ is unknown, so you can''t tell whether to flip the symbol', 'Multiplying an inequality by a binomial is never allowed', 'It would create a hole in the graph', 'It would turn the inequality into an equation']
  answer: 0
  explanation: |-
    Multiplying an inequality by a positive number keeps the symbol and by a negative number flips it. Here $x - 1$ is positive for some $x$ and negative for others, so one multiplication can't be right for all of them. Subtract 3 and use a sign chart instead. The other reasons are false: multiplying by an expression of known sign is fine, and nothing about holes or equations is involved.
- id: a2-q-ineq-12
  lesson: a2-poly-rational-ineq
  topic: Rational inequalities
  stem: 'Solve $\dfrac{x - 2}{(x + 1)(x - 4)} > 0$.'
  choices: ['$(-\infty, -1) \cup (2, 4)$', '$(-1, 2) \cup (4, \infty)$', '$(-1, 2] \cup (4, \infty)$', '$(2, \infty)$']
  answer: 1
  explanation: |-
    Critical values $-1$, $2$, $4$. Signs: $x < -1$ gives $\tfrac{-}{(-)(-)} = -$; $-1 < x < 2$ gives $\tfrac{-}{(+)(-)} = +$; $2 < x < 4$ gives $\tfrac{+}{(+)(-)} = -$; $x > 4$ gives $+$. So $(-1, 2) \cup (4, \infty)$. The intervals $(-\infty, -1) \cup (2, 4)$ are the negative ones, including 2 is wrong for a strict $>$ (the fraction is 0 there), and $(2, \infty)$ looks only at the numerator.
