# Polynomial functions
- id: alg-q-3301
  lesson: alg-poly-functions
  module_quiz: true
  topic: Polynomial functions
  stem: 'Describe the end behavior of $f(x) = -3x^4 + x$.'
  choices: ['Both ends go down', 'Both ends go up', 'Up on the left, down on the right', 'Down on the left, up on the right']
  answer: 0
  explanation: |-
    Even degree means the ends match; the negative leading coefficient points them down, like $-x^2$.
- id: alg-q-3302
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'Describe the end behavior of $f(x) = 2x^5 - x^2$.'
  choices: ['Up on the left, down on the right', 'Down on the left, up on the right', 'Both ends go up', 'Both ends go down']
  answer: 1
  explanation: |-
    Odd degree with a positive leading coefficient behaves like $x^3$: as $x \to -\infty$, $f \to -\infty$, and as $x \to \infty$, $f \to \infty$.
- id: alg-q-3303
  lesson: alg-poly-functions
  module_quiz: true
  topic: Polynomial functions
  stem: 'Describe the end behavior of $f(x) = 7 + 2x - x^3$.'
  choices: ['Up on the left, down on the right', 'Down on the left, up on the right', 'Both ends go up', 'Both ends go down']
  answer: 0
  explanation: |-
    The leading term is $-x^3$ (not the first term written). Odd degree, negative coefficient: up on the left, down on the right.
- id: alg-q-3304
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'What are the zeros of $f(x) = (x - 4)(x + 1)^2$ and their multiplicities?'
  choices: ['$4$ with multiplicity 1 and $-1$ with multiplicity 2', '$-4$ with multiplicity 1 and $1$ with multiplicity 2', '$4$ and $-1$, each with multiplicity 1', '$4$ with multiplicity 2 and $-1$ with multiplicity 1']
  answer: 0
  explanation: |-
    $(x - 4)$ gives the zero 4 once; $(x + 1)^2$ gives the zero $-1$ twice.
- id: alg-q-3305
  lesson: alg-poly-functions
  module_quiz: true
  topic: Polynomial functions
  stem: 'What does the graph of $f(x) = (x - 4)(x + 1)^2$ do at $x = -1$?'
  choices: ['Touches the $x$-axis and turns back', 'Crosses the $x$-axis', 'Has a vertical asymptote', 'Has a hole']
  answer: 0
  explanation: |-
    $-1$ has even multiplicity (2), so $f$ doesn't change sign there: the graph touches the axis and turns around.
- id: alg-q-3306
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'What is the greatest number of turning points the graph of a degree-5 polynomial can have?'
  choices: ['$4$', '$5$', '$6$', '$2$']
  answer: 0
  explanation: |-
    A degree-$n$ polynomial has at most $n - 1$ turning points: here 4.
- id: alg-q-3307
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'What is the degree of $f(x) = (x + 2)^3(x - 1)^2$?'
  choices: ['$2$', '$6$', '$5$', '$3$']
  answer: 2
  explanation: |-
    Add the multiplicities: $3 + 2 = 5$. Multiplying them gives the wrong 6.
- id: alg-q-3308
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'Which cubic has zeros $-2$, $1$ and $3$ and passes through $(0, 12)$?'
  choices: ['$f(x) = 2(x + 2)(x - 1)(x - 3)$', '$f(x) = (x + 2)(x - 1)(x - 3)$', '$f(x) = 2(x - 2)(x + 1)(x + 3)$', '$f(x) = 12(x + 2)(x - 1)(x - 3)$']
  answer: 0
  explanation: |-
    $f(x) = a(x + 2)(x - 1)(x - 3)$ and $f(0) = a(2)(-1)(-3) = 6a = 12$, so $a = 2$.
- id: alg-q-3309
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'A polynomial $f$ has $f(1) = -2$ and $f(2) = 3$. What can you conclude?'
  choices: ['$f(1.5) = 0.5$', '$f$ has no zeros', '$f$ has a zero between 1 and 2', '$f$ has a zero at $x = 1$']
  answer: 2
  explanation: |-
    The graph is continuous and goes from below the axis to above it, so it must cross in between (Intermediate Value Theorem). Nothing says the values are linear.
- id: alg-q-3310
  lesson: alg-poly-functions
  module_quiz: true
  topic: Polynomial functions
  stem: 'A polynomial graph touches the $x$-axis at $x = 2$ and crosses it (without flattening) at $x = -1$ and $x = 4$. What is the smallest possible degree?'
  choices: ['$3$', '$4$', '$2$', '$6$']
  answer: 1
  explanation: |-
    Touching needs even multiplicity, at least 2; each simple crossing needs 1. Minimum degree $2 + 1 + 1 = 4$.
- id: alg-q-3311
  lesson: alg-poly-functions
  topic: Polynomial functions
  stem: 'Which could be the graph of a polynomial function?'
  choices: ['A curve with a hole', 'A curve with a sharp corner', 'A smooth, unbroken curve', 'A curve with a vertical asymptote']
  answer: 2
  explanation: |-
    Polynomial graphs are continuous (no holes or asymptotes) and smooth (no corners). Holes and asymptotes belong to rational functions; corners to things like $|x|$.

- id: alg-q-3401
  lesson: alg-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'Divide $x^3 + 2x^2 - 5x - 6$ by $x - 2$.'
  choices: ['$x^2 + 4x + 3$, remainder 2', '$x^2 + 4x + 3$, remainder 0', '$x^3 + 4x^2 + 3x$, remainder 0', '$x^2 + 3$, remainder 0']
  answer: 1
  explanation: |-
    Synthetic division with 2 on coefficients $1, 2, -5, -6$ gives $1, 4, 3$ and remainder 0. The quotient has degree one less than the dividend.
- id: alg-q-3402
  lesson: alg-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'What is the remainder when $x^4 - 3x + 5$ is divided by $x + 1$?'
  choices: ['$9$', '$3$', '$7$', '$1$']
  answer: 0
  explanation: |-
    Remainder Theorem: the remainder is $f(-1) = 1 + 3 + 5 = 9$. Using $f(1) = 3$ is the sign mistake.
- id: alg-q-3403
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'Is $x - 3$ a factor of $f(x) = x^3 - 2x^2 - 5x + 6$?'
  choices: ['No, because $f(3) = 6$', 'No, because $f(-3) \ne 0$', 'Yes, because 6 is divisible by 3', 'Yes, because $f(3) = 0$']
  answer: 3
  explanation: |-
    $f(3) = 27 - 18 - 15 + 6 = 0$, so by the Factor Theorem $x - 3$ is a factor. The test uses $f(3)$, not $f(-3)$.
- id: alg-q-3404
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'To divide by $x + 4$ using synthetic division, which number goes in the box?'
  choices: ['$\tfrac14$', '$4$', '$-4$', '$1$']
  answer: 2
  explanation: |-
    Synthetic division divides by $x - c$, and $x + 4 = x - (-4)$, so $c = -4$.
- id: alg-q-3405
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'Divide $2x^3 + 3x - 4$ by $x - 1$.'
  choices: ['$2x^2 + 5x + 1$, remainder 0', '$2x^2 + 2x + 5$, remainder 1', '$2x^2 + 3x - 1$, remainder $-3$', '$2x^2 + 2x + 5$, remainder $-1$']
  answer: 1
  explanation: |-
    Include the missing $x^2$ term: coefficients $2, 0, 3, -4$. Synthetic division with 1 gives $2, 2, 5$ and remainder 1. Check: $f(1) = 2 + 3 - 4 = 1$.
- id: alg-q-3406
  lesson: alg-poly-division
  module_quiz: true
  topic: Polynomial division
  stem: 'For what value of $k$ is $x - 2$ a factor of $x^3 + kx - 4$?'
  choices: ['$k = 2$', '$k = -2$', '$k = 6$', '$k = -6$']
  answer: 1
  explanation: |-
    Need $f(2) = 0$: $8 + 2k - 4 = 0$, so $k = -2$.
- id: alg-q-3407
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'Divide $x^2 + 5x + 7$ by $x + 2$.'
  choices: ['$x + 3$', '$x + 3 + \dfrac{1}{x + 2}$', '$x + 7 + \dfrac{21}{x + 2}$', '$x + 3 + \dfrac{1}{x - 2}$']
  answer: 1
  explanation: |-
    $x^2 + 5x + 7 = (x + 2)(x + 3) + 1$. Using $c = 2$ instead of $-2$ gives $x + 7$ with remainder 21.
- id: alg-q-3408
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'If $f(x) = (x - 1)(x^2 + 2) + 5$, what is $f(1)$?'
  choices: ['$3$', '$0$', '$5$', '$8$']
  answer: 2
  explanation: |-
    At $x = 1$ the first product is 0, leaving the remainder 5. That's the Remainder Theorem in action.
- id: alg-q-3409
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'A student divides $x^3 - 8$ by $x - 2$ synthetically using only the coefficients $1, -8$. What should change?'
  choices: ['Nothing; the quotient is $x - 6$', 'Synthetic division can''t be used for this divisor', 'The box should hold $-2$', 'Missing terms need zero coefficients: use $1, 0, 0, -8$; the quotient is $x^2 + 2x + 4$']
  answer: 3
  explanation: |-
    Every power from $x^3$ down needs a place. With $1, 0, 0, -8$ and $c = 2$: $1, 2, 4$, remainder 0. This matches the difference of cubes.
- id: alg-q-3410
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'Given that 3 is a zero of $x^3 - 7x - 6$, factor it completely.'
  choices: ['$(x + 3)(x + 1)(x + 2)$', '$(x - 3)(x - 1)(x - 2)$', '$(x - 3)(x + 1)(x + 2)$', '$(x - 3)(x^2 + 2)$']
  answer: 2
  explanation: |-
    Divide by $x - 3$ (coefficients $1, 0, -7, -6$): quotient $x^2 + 3x + 2 = (x + 1)(x + 2)$.
- id: alg-q-3411
  lesson: alg-poly-division
  topic: Polynomial division
  stem: 'A degree-5 polynomial is divided by $x - c$. What is the degree of the quotient?'
  choices: ['$1$', '$5$', '$6$', '$4$']
  answer: 3
  explanation: |-
    Dividing by a degree-1 divisor lowers the degree by 1.

- id: alg-q-3501
  lesson: alg-rational-roots
  module_quiz: true
  topic: Rational root theorem
  stem: 'Which list gives all possible rational zeros of $3x^3 - 2x + 4$?'
  choices: ['$1, 2, 4, \tfrac13, \tfrac23, \tfrac43$', '$\pm1, \pm3, \pm\tfrac14, \pm\tfrac34, \pm\tfrac12, \pm\tfrac32$', '$\pm1, \pm2, \pm4$ only', '$\pm1, \pm2, \pm4, \pm\tfrac13, \pm\tfrac23, \pm\tfrac43$']
  answer: 3
  explanation: |-
    $p$ divides the constant 4 ($\pm1, \pm2, \pm4$) and $q$ divides the leading coefficient 3 ($\pm1, \pm3$). The list with $\pm\tfrac14$ and $\pm\tfrac34$ puts them upside down, and the list without $\pm$ signs forgets the negative candidates.
- id: alg-q-3502
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Which number cannot be a rational zero of $2x^3 - 5x + 6$?'
  choices: ['$\tfrac13$', '$\tfrac32$', '$-6$', '$\tfrac12$']
  answer: 0
  explanation: |-
    Denominators must divide 2, so $\tfrac13$ is impossible. The others have numerators dividing 6 and denominators dividing 2.
- id: alg-q-3503
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Find all zeros of $x^3 - 6x^2 + 11x - 6$.'
  choices: ['$2, 3, 6$', '$-1, -2, -3$', '$1, 6$', '$1, 2, 3$']
  answer: 3
  explanation: |-
    $f(1) = 0$. Divide: $x^2 - 5x + 6 = (x - 2)(x - 3)$. Zeros 1, 2, 3.
- id: alg-q-3504
  lesson: alg-rational-roots
  module_quiz: true
  topic: Rational root theorem
  stem: 'Find all zeros of $x^3 + x^2 - 4x - 4$.'
  choices: ['$1, 2, -2$', '$-1, 2, -2$', '$-1, 4, -4$', '$-1$ and $2$ only']
  answer: 1
  explanation: |-
    Grouping: $x^2(x + 1) - 4(x + 1) = (x + 1)(x - 2)(x + 2)$.
- id: alg-q-3505
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Given that 3 is a zero of $x^3 - x^2 - 7x + 3$, find the other two zeros.'
  choices: ['$1 \pm \sqrt2$', '$-1 \pm \sqrt2$', '$-1 \pm 2i$', '$-2 \pm \sqrt2$']
  answer: 1
  explanation: |-
    Synthetic division by 3 gives $x^2 + 2x - 1$. The quadratic formula: $x = \dfrac{-2 \pm \sqrt{8}}{2} = -1 \pm \sqrt2$.
- id: alg-q-3506
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'How many complex zeros, counting multiplicity, does a polynomial of degree 6 have?'
  choices: ['At least 7', 'At most 5', 'Exactly 6', 'It depends on the coefficients']
  answer: 2
  explanation: |-
    By the Fundamental Theorem of Algebra, a degree-$n$ polynomial has exactly $n$ complex zeros counting multiplicity. Only the number of real zeros varies.
- id: alg-q-3507
  lesson: alg-rational-roots
  module_quiz: true
  topic: Rational root theorem
  stem: 'A polynomial with real coefficients has $2 - 3i$ as a zero. Which number must also be a zero?'
  choices: ['$2 + 3i$', '$-2 + 3i$', '$-2 - 3i$', '$3 - 2i$']
  answer: 0
  explanation: |-
    Non-real zeros of real polynomials come in conjugate pairs: $a - bi$ comes with $a + bi$.
- id: alg-q-3508
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Why must every cubic polynomial with real coefficients have at least one real zero?'
  choices: ['Its leading coefficient is real', 'Every cubic crosses the $y$-axis', 'Non-real zeros come in conjugate pairs, so they can''t account for all three zeros', 'The Rational Root Theorem guarantees a rational zero']
  answer: 2
  explanation: |-
    There are three zeros in all. Non-real ones come two at a time, so at most two are non-real, leaving at least one real zero. (The odd-degree end behavior shows the same thing.)
- id: alg-q-3509
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Which polynomial of lowest degree with real coefficients has zeros 1 and $2i$?'
  choices: ['$x^2 + 4$', '$x^2 - (1 + 2i)x + 2i$', '$x^3 - x^2 - 4x + 4$', '$x^3 - x^2 + 4x - 4$']
  answer: 3
  explanation: |-
    $-2i$ must be a zero too. $(x - 1)(x - 2i)(x + 2i) = (x - 1)(x^2 + 4) = x^3 - x^2 + 4x - 4$. $x^2 - (1 + 2i)x + 2i$ has non-real coefficients, and $x^2 + 4$ is missing the zero 1.
- id: alg-q-3510
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Find all zeros of $x^3 - 2x^2 + 9x - 18$.'
  choices: ['$2$ only', '$2, 3, -3$', '$-2, 3i, -3i$', '$2, 3i, -3i$']
  answer: 3
  explanation: |-
    $x^2(x - 2) + 9(x - 2) = (x - 2)(x^2 + 9)$. Then $x^2 = -9$ gives $\pm 3i$. Three zeros for degree 3.
- id: alg-q-3511
  lesson: alg-rational-roots
  topic: Rational root theorem
  stem: 'Find all zeros of $2x^3 - 3x^2 - 3x + 2$.'
  choices: ['$1, -1, 2$', '$-2, -\tfrac12, 1$', '$2, 1, -\tfrac12$', '$2, \tfrac12, -1$']
  answer: 3
  explanation: |-
    $f(2) = 16 - 12 - 6 + 2 = 0$. Dividing by $x - 2$ leaves $2x^2 + x - 1 = (2x - 1)(x + 1)$, so the zeros are $2$, $\tfrac12$, $-1$.
