# Round 2, module a2-m1 (honors lessons)
- {front: Even function, back: '$f(-x) = f(x)$ for all $x$; graph symmetric about the $y$-axis. Examples: $x^2$, $x^4 - 3x^2$, $\lvert x \rvert$.', topic: Symmetry}
- {front: Odd function, back: '$f(-x) = -f(x)$ for all $x$; graph symmetric about the origin. Examples: $x^3$, $x^5 - 4x$, $\tfrac1x$.', topic: Symmetry}
- {front: How to test whether a function is even or odd, back: 'Simplify $f(-x)$ and compare it with $f(x)$ and $-f(x)$. One input can disprove parity, but only the algebra with a general $x$ proves it.', topic: Symmetry}
- {front: 'Value at 0 of an odd function defined there', back: '$0$, since $f(0) = -f(0)$. So $x^3 + 1$ is not odd.', topic: Symmetry}
- {front: Parity of products, back: 'even·even = even, odd·odd = even, even·odd = odd (like the sign rule).', topic: Symmetry}
- {front: Even and odd parts of f, back: '$E(x) = \tfrac12\big(f(x) + f(-x)\big)$ and $O(x) = \tfrac12\big(f(x) - f(-x)\big)$; $f = E + O$.', topic: Symmetry}
- {front: 'Point rule for $y = a f(b(x - h)) + k$', back: '$(x, y) \to \left(\tfrac{x}{b} + h,\; ay + k\right)$', topic: Transformations}
- {front: 'Reading $f(bx - c)$', back: 'Factor first: $f\big(b(x - \tfrac{c}{b})\big)$. Compress by $\tfrac1b$, then shift right $\tfrac{c}{b}$ (or shift right $c$ first, then compress).', topic: Transformations}
- {front: Symmetry of a transformed graph, back: 'For $a f(x - h) + k$: if $f$ is even, symmetric about the line $x = h$; if $f$ is odd, symmetric about the point $(h, k)$.', topic: Symmetry}
- {front: Inverse of a composition, back: '$(f \circ g)^{-1} = g^{-1} \circ f^{-1}$: undo the last step first (socks and shoes).', topic: Inverse functions}
- {front: Strictly increasing implies, back: 'one-to-one, so the function has an inverse, even when no formula for the inverse is available.', topic: Monotonic functions}
- {front: Combining monotonic functions, back: 'Increasing + increasing is increasing. Composing two increasing or two decreasing functions gives an increasing one; mixing gives a decreasing one.', topic: Monotonic functions}
- {front: Inverting a piecewise function, back: 'Each piece must be one-to-one and the pieces'' ranges must not overlap. Invert each piece; its range becomes the new condition.', topic: Inverse functions}
- {front: Self-inverse function, back: '$f(f(x)) = x$; the graph is symmetric about $y = x$. Examples: $c - x$, $\tfrac{k}{x}$, $\tfrac{ax + b}{cx - a}$.', topic: Inverse functions}
- {front: 'Inverse of $\dfrac{ax + b}{cx + d}$', back: '$\dfrac{dx - b}{-cx + a}$ (when $ad - bc \ne 0$)', topic: Inverse functions}
- {front: Where f meets its inverse (f increasing), back: 'Only on $y = x$: solve $f(x) = x$. Not true for decreasing functions, e.g. $-x^3$ meets $-\sqrt[3]{x}$ at $(1, -1)$.', topic: Monotonic functions}
