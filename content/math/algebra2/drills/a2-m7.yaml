# Sequences and series drills
- id: alg-d-arith-nth
  title: nth term of an arithmetic sequence
  topic: Arithmetic sequences
  vars:
    a1: {min: -20, max: 30}
    d: {min: -9, max: 9}
    n: {min: 10, max: 80}
  calc:
    a2: a1 + d
    a3: a1 + 2*d
    an: a1 + (n - 1)*d
    nm: n - 1
  where: ['d != 0']
  prompt: 'For the arithmetic sequence ${a1}, {a2}, {a3}, \ldots$, find the term $a_{{n}}$.'
  answers:
    - {name: an, label: '$a_{{n}} =$'}
  solution: |-
    $a_1 = {a1}$ and $d = {a2} - ({a1}) = {d}$. So $a_{{n}} = a_1 + ({n} - 1)d = {a1} + {nm}({d}) =$ **{an}**.

- id: alg-d-arith-sum
  title: Sum of an arithmetic series
  topic: Arithmetic sequences
  vars:
    c: {min: -6, max: 9}
    k0: {min: -10, max: 15}
    n: {min: 8, max: 40}
  calc:
    first: c + k0
    last: c*n + k0
    S: n*(c + k0 + c*n + k0)/2
  where: ['c != 0', 'k0 != 0']
  prompt: 'Evaluate $\displaystyle\sum_{k=1}^{{n}} ({c:coef}k {k0:signed})$.'
  answers:
    - {name: S, label: 'Sum'}
  solution: |-
    The terms form an arithmetic sequence from $a_1 = {first}$ to $a_{{n}} = {last}$, with {n} terms.
    $S = \dfrac{n(a_1 + a_n)}{2} = \dfrac{{n}({first} + ({last}))}{2} =$ **{S}**.

- id: alg-d-arith-find
  title: Arithmetic sequence from two terms
  topic: Arithmetic sequences
  vars:
    a1: {min: -15, max: 20}
    d: {min: -7, max: 7}
    p: {min: 2, max: 6}
    q: {min: 8, max: 15}
  calc:
    ap: a1 + (p - 1)*d
    aq: a1 + (q - 1)*d
    steps: q - p
    diff: aq - ap
  where: ['d != 0']
  prompt: 'An arithmetic sequence has $a_{{p}} = {ap}$ and $a_{{q}} = {aq}$. Find the common difference and the first term.'
  answers:
    - {name: d, label: '$d =$'}
    - {name: a1, label: '$a_1 =$'}
  solution: |-
    From term {p} to term {q} is {steps} steps: ${steps}d = {aq} - ({ap}) = {diff}$, so $d =$ **{d}**.
    Then $a_1 = a_{{p}} - ({p} - 1)d$, which gives $a_1 =$ **{a1}**.

- id: alg-d-geom-nth
  title: nth term of a geometric sequence
  topic: Geometric sequences
  vars:
    a1: {choices: [1, 2, 3, 4, 5, -2, -3]}
    r: {choices: [2, 3, -2, -3, 0.5]}
    n: {min: 4, max: 9}
  calc:
    a2: a1*r
    a3: a1*r^2
    an: a1*r^(n - 1)
    nm: n - 1
  where: ['abs(an) <= 100000']
  prompt: 'For the geometric sequence ${a1}, {a2}, {a3}, \ldots$, find the term $a_{{n}}$ (exact fraction if needed).'
  answers:
    - {name: an, kind: fraction, lowestTerms: true, label: '$a_{{n}} =$'}
  solution: |-
    $r = \dfrac{{a2}}{{a1}} = {r}$. So $a_{{n}} = a_1 r^{n-1} = {a1}({r})^{{nm}} =$ **${an:texfrac}$**.

- id: alg-d-geom-sum
  title: Sum of a geometric series
  topic: Series
  vars:
    a1: {min: 1, max: 6}
    r: {choices: [2, 3, -2, -3, 4]}
    n: {min: 4, max: 8}
  calc:
    rn: r^n
    S: a1*(1 - r^n)/(1 - r)
    omr: 1 - r
  where: ['abs(S) <= 200000']
  prompt: 'Find the sum of the first {n} terms of the geometric sequence with $a_1 = {a1}$ and $r = {r}$.'
  answers:
    - {name: S, label: '$S_{{n}} =$'}
  solution: |-
    $S_n = \dfrac{a_1(1 - r^n)}{1 - r} = \dfrac{{a1}(1 - ({rn:dp0}))}{{omr}} =$ **{S}**.

- id: alg-d-geom-infinite
  title: Infinite geometric series
  topic: Series
  vars:
    a1: {min: 2, max: 30}
    p: {choices: [-2, -1, 1, 2, 3]}
    q: {choices: [3, 4, 5]}
  calc:
    r: p/q
    a2: a1*p/q
    S: a1/(1 - p/q)
    omr: 1 - p/q
  where: ['gcd(abs(p), q) == 1']
  prompt: 'Find the sum of the infinite geometric series ${a1} + \left({a2:texfrac}\right) + \cdots$ with ratio $r = {r:texfrac}$. (Exact fraction.)'
  answers:
    - {name: S, kind: fraction, lowestTerms: true, label: '$S =$'}
  solution: |-
    $|r| < 1$, so the series converges: $S = \dfrac{a_1}{1 - r} = \dfrac{{a1}}{{omr:texfrac}} =$ **${S:texfrac}$**.
