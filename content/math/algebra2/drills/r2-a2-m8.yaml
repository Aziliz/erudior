# Round 2, module a2-m8: drills for the honors lessons
- id: a2-m8-r2-expected-value
  title: Expected net gain of a game
  topic: Expected value
  vars:
    c: {choices: [1, 2, 3, 4, 5, 10]}
    w1: {choices: [20, 25, 40, 50, 100]}
    p1: {min: 1, max: 10}
    w2: {choices: [2, 4, 5, 8, 10]}
    p2: {min: 10, max: 40, step: 5}
  calc:
    P1: p1/100
    P2: p2/100
    Q: (100 - p1 - p2)/100
    e1: w1*p1/100
    e2: w2*p2/100
    eprize: (w1*p1 + w2*p2)/100
    ans: (w1*p1 + w2*p2)/100 - c
  prompt: 'A carnival game costs \${c} to play. You win \${w1} with probability {p1}%, win \${w2} with probability {p2}%, and win nothing otherwise. What is your expected net gain per game, in dollars? (Give a loss as a negative number, to the nearest cent.)'
  answers:
    - {name: ans, label: 'Expected net gain (dollars):', tolerance: 0.005}
  solution: |-
    Expected prize: $E(\text{prize}) = {w1}({P1}) + {w2}({P2}) + 0({Q}) = {e1} + {e2} = {eprize:num2}$ dollars.
    You pay {c} dollars whatever happens, so the expected net gain is ${eprize:num2} - {c} =$ **{ans:num2}** dollars per game.

- id: a2-m8-r2-fair-price
  title: Fair price of a raffle ticket
  topic: Expected value
  vars:
    N: {choices: [200, 250, 400, 500, 1000]}
    A: {choices: [100, 200, 250, 500, 1000]}
    k: {min: 2, max: 5}
    B: {choices: [10, 20, 25, 50]}
    T: {choices: [2, 3, 5, 10]}
  where: ['mod(100*(A + k*B), N) == 0', '(A + k*B)/N < T']
  calc:
    kB: k*B
    tot: A + k*B
    fair: (A + k*B)/N
    net: (A + k*B)/N - T
  prompt: 'A club sells {N} raffle tickets. One ticket wins \${A} and {k} other tickets win \${B} each. (a) What ticket price would make the raffle a fair game? (b) The club charges \${T} per ticket. What is a buyer''s expected net gain per ticket? Give dollars to the nearest cent (a loss is negative).'
  answers:
    - {name: fair, label: '(a) Fair price (dollars):', tolerance: 0.005}
    - {name: net, label: '(b) Expected net gain (dollars):', tolerance: 0.005}
  solution: |-
    Total prize money: ${A} + {k} \times {B} = {tot}$ dollars, shared over {N} tickets. The expected prize per ticket is $\dfrac{{tot}}{{N}} = {fair:num2}$ dollars, so the fair price is **{fair:num2}** dollars.
    At a price of {T} dollars, the expected net gain is ${fair:num2} - {T} =$ **{net:num2}** dollars per ticket.

- id: a2-m8-r2-binom-exact
  title: Binomial probability of exactly k successes
  topic: Binomial distribution
  vars:
    n: {min: 4, max: 10}
    pp: {choices: [10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90]}
    k: {min: 0, max: 10}
  where: ['k <= n', 'binompdf(n, pp/100, k) >= 0.001']
  calc:
    p: pp/100
    q: (100 - pp)/100
    nk: n - k
    C: nCr(n, k)
    pk: (pp/100)^k
    qk: ((100 - pp)/100)^(n - k)
    ans: binompdf(n, pp/100, k)
  prompt: 'Each part from a machine passes inspection with probability {p}, independently of the others. In a batch of {n} parts, what is the probability that exactly {k} pass? Give 4 decimal places.'
  answers:
    - {name: ans, label: '$P(X = {k}) =$', tolerance: 0.00006, format: dp4}
  solution: |-
    The number that pass is binomial with $n = {n}$ and $p = {p}$, so
    $P(X = {k}) = {}_{{n}}C_{{k}}\,({p})^{{k}}({q})^{{nk}}$.
    Here $_{{n}}C_{{k}} = {C}$, $({p})^{{k}} \approx {pk:sig3}$ and $({q})^{{nk}} \approx {qk:sig3}$.
    Multiply: $P(X = {k}) \approx$ **{ans:dp4}**. (Calculator: binompdf({n}, {p}, {k}).)

- id: a2-m8-r2-binom-atleast
  title: Binomial probability of at least k successes
  topic: Binomial distribution
  vars:
    n: {min: 4, max: 12}
    pp: {choices: [5, 10, 15, 20, 25, 30, 40, 50]}
    k: {choices: [1, 2]}
  calc:
    p: pp/100
    q: (100 - pp)/100
    n1: n - 1
    km: k - 1
    P0: binompdf(n, pp/100, 0)
    P1: binompdf(n, pp/100, 1)
    below: binomcdf(n, pp/100, k - 1)
    ans: 1 - binomcdf(n, pp/100, k - 1)
  prompt: 'Each customer who enters a shop makes a purchase with probability {p}, independently. Of the next {n} customers, what is the probability that at least {k} make a purchase? Give 4 decimal places.'
  answers:
    - {name: ans, label: '$P(X \ge {k}) =$', tolerance: 0.00006, format: dp4}
  solution: |-
    $X$ is binomial with $n = {n}$, $p = {p}$. "At least {k}" is the complement of "at most {km}", so $P(X \ge {k}) = 1 - P(X \le {km})$.
    The small cases: $P(X = 0) = ({q})^{{n}} \approx {P0:dp4}$ and $P(X = 1) = {n}({p})({q})^{{n1}} \approx {P1:dp4}$.
    $P(X \le {km})$ adds the cases from 0 to {km}: about {below:dp4}. So $P(X \ge {k}) \approx 1 - {below:dp4} =$ **{ans:dp4}**.
    (Calculator: 1 − binomcdf({n}, {p}, {km}).)

- id: a2-m8-r2-binom-mean-sd
  title: Mean and standard deviation of a binomial count
  topic: Binomial distribution
  vars:
    n: {choices: [20, 30, 40, 50, 60, 80, 100, 120, 150, 200, 250, 400, 500]}
    pp: {choices: [10, 20, 25, 30, 40, 50, 60, 75, 80]}
  calc:
    p: pp/100
    q: (100 - pp)/100
    mu: n*pp/100
    v2: n*pp*(100 - pp)/10000
    sd: sqrt(n*pp*(100 - pp)/10000)
  prompt: 'In a large city, {pp}% of adults say "yes" to a survey question. In a random sample of {n} adults, let $X$ be the number who say yes. Find the mean of $X$ and its standard deviation (to 2 decimal places).'
  answers:
    - {name: mu, label: 'Mean:', tolerance: 0.001}
    - {name: sd, label: 'Standard deviation:', tolerance: 0.006}
  solution: |-
    $X$ is (very nearly) binomial with $n = {n}$ and $p = {p}$, since the sample is a tiny part of the city.
    Mean: $\mu = np = {n}({p}) =$ **{mu}**.
    Standard deviation: $\sigma = \sqrt{np(1 - p)} = \sqrt{{n}({p})({q})} = \sqrt{{v2}} \approx$ **{sd:num2}**.

- id: a2-m8-r2-total-prob
  title: Total probability and Bayes with two machines
  topic: Bayes' theorem
  vars:
    a: {min: 30, max: 80, step: 5}
    da: {min: 1, max: 6}
    db: {min: 2, max: 9}
  where: ['da != db']
  calc:
    bb: 100 - a
    PA: a/100
    PB: (100 - a)/100
    DA: da/100
    DB: db/100
    ja: a*da/10000
    jb: (100 - a)*db/10000
    PD: (a*da + (100 - a)*db)/10000
    ans: (100 - a)*db/(a*da + (100 - a)*db)
  prompt: 'Machine A makes {a}% of a factory''s parts, and {da}% of its parts are defective. Machine B makes the other {bb}%, and {db}% of its parts are defective. (a) What fraction of all parts are defective? (b) A part is found to be defective. What is the probability that it came from machine B? Give both as decimals to 4 places.'
  answers:
    - {name: PD, label: '(a) $P(\text{defective}) =$', tolerance: 0.00006, format: dp4}
    - {name: ans, label: '(b) $P(B \mid \text{defective}) =$', tolerance: 0.00006, format: dp4}
  solution: |-
    (a) Add the two paths to "defective" (law of total probability):
    $P(D) = {PA}({DA}) + {PB}({DB}) = {ja:dp4} + {jb:dp4} =$ **{PD:dp4}**.
    (b) Bayes' theorem: B's path divided by all paths,
    $P(B \mid D) = \dfrac{{jb:dp4}}{{PD:dp4}} \approx$ **{ans:dp4}**.

- id: a2-m8-r2-bayes-test
  title: Positive screening test (natural frequencies)
  topic: Bayes' theorem
  vars:
    prev: {choices: [1, 2, 4, 5, 10, 20]}
    sens: {min: 80, max: 99}
    spec: {min: 85, max: 99}
  calc:
    sick: 100*prev
    well: 10000 - 100*prev
    fpr: 100 - spec
    tp: prev*sens
    fp: (100 - prev)*(100 - spec)
    pos: prev*sens + (100 - prev)*(100 - spec)
    ans: prev*sens/(prev*sens + (100 - prev)*(100 - spec))
  prompt: 'A disease affects {prev}% of a population. A screening test has sensitivity {sens}% and specificity {spec}%. Imagine 10,000 people from this population are tested. (a) How many true positives would you expect? (b) How many false positives? (c) What is the probability that a person who tests positive has the disease? Give (c) as a decimal to 4 places.'
  answers:
    - {name: tp, label: '(a) True positives:', tolerance: 0.001}
    - {name: fp, label: '(b) False positives:', tolerance: 0.001}
    - {name: ans, label: '(c) $P(\text{disease} \mid \text{positive}) =$', tolerance: 0.00006, format: dp4}
  solution: |-
    Of 10,000 people, {prev}% = {sick} have the disease and {well} do not.
    (a) {sens}% of the {sick} sick people test positive: **{tp}** true positives.
    (b) The specificity is {spec}%, so {fpr}% of the {well} healthy people test positive anyway: **{fp}** false positives.
    (c) There are ${tp} + {fp} = {pos}$ positives in all, and {tp} of them have the disease: $\dfrac{{tp}}{{pos}} \approx$ **{ans:dp4}**.
