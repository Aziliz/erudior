# Radicals and rational exponents drills
- id: alg-d-simplify-sqrt
  title: Simplify a square root
  topic: Radicals
  vars:
    a: {min: 2, max: 9}
    b: {choices: [2, 3, 5, 6, 7, 10, 11, 13, 14, 15]}
  calc:
    n: a^2*b
    a2: a^2
  prompt: 'Write $\sqrt{{n}}$ in simplest radical form $a\sqrt{\,b}$.'
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
  solution: |-
    The largest perfect-square factor of {n} is {a2}: $\sqrt{{n}} = \sqrt{{a2} \cdot {b}} = \sqrt{{a2}}\sqrt{{b}} =$ **${a}\sqrt{{b}}$**.

- id: alg-d-rational-exp
  title: Evaluate a rational exponent
  topic: Rational exponents
  vars:
    r: {min: 2, max: 5}
    q: {choices: [2, 3]}
    p: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    base: r^q
    val: r^p
  where: ['base <= 125', 'abs(p) != q', 'abs(val) <= 125']
  prompt: 'Evaluate $\;{base}^{{p}/{q}}$. Give an exact answer (a fraction if needed).'
  answers:
    - {name: val, kind: fraction, lowestTerms: true, label: 'Value'}
  solution: |-
    The denominator {q} is the root: $\sqrt[{q}]{{base}} = {r}$. Then raise to the power {p}: ${r}^{{p}} =$ **${val:texfrac}$**.

- id: alg-d-rationalize
  title: Rationalize with a conjugate
  topic: Radicals
  vars:
    a: {min: 1, max: 6}
    b: {choices: [2, 3, 5, 6, 7, 10, 11]}
    m: {choices: [-3, -2, -1, 1, 2, 3]}
  calc:
    den: a^2 - b
    c: m*den
    p: m*a
    q: -m
  where: ['den != 0', 'abs(den) <= 10']
  prompt: 'Rationalize the denominator and write $\dfrac{{c}}{{a} + \sqrt{{b}}}$ in the form $p + q\sqrt{{b}}$.'
  answers:
    - {name: p, label: '$p =$'}
    - {name: q, label: '$q =$'}
  solution: |-
    Multiply top and bottom by the conjugate ${a} - \sqrt{{b}}$. The denominator becomes ${a}^2 - {b} = {den}$.
    So the expression is $\dfrac{{c}({a} - \sqrt{{b}})}{{den}} = {m}({a} - \sqrt{{b}})$, giving $p =$ **{p}** and $q =$ **{q}**.

- id: alg-d-radical-eq
  title: Solve a radical equation
  topic: Radical equations
  vars:
    a: {min: 1, max: 6}
    b: {min: -10, max: 10}
    c: {min: 1, max: 9}
    k: {min: -5, max: 5}
  calc:
    rhs: c + k
    c2: c^2
    xs: (c^2 - b)/a
    cb: c^2 - b
  where: ['b != 0', 'k != 0', 'rhs > 0']
  prompt: 'Solve $\;\sqrt{{a:coef}x {b:signed}} {k:signed} = {rhs}$. Give an exact answer.'
  answers:
    - {name: xs, kind: fraction, lowestTerms: true, label: '$x =$'}
  solution: |-
    Isolate the radical: $\sqrt{{a:coef}x {b:signed}} = {c}$. Square both sides: ${a:coef}x {b:signed} = {c2}$.
    So ${a:coef}x = {cb}$ and $x =$ **${xs:texfrac}$**. Check: the radicand is ${c2}$ and its root is ${c}$, as required.

- id: alg-d-radical-extraneous
  title: Radical equation with an extraneous root
  topic: Radical equations
  vars:
    q: {min: -4, max: 4}
    s: {min: -3, max: 8}
  calc:
    e: 1 - 2*q - s
    p: q^2 - s*(1 - 2*q - s)
    B: 2*q - 1
    C: q^2 - p
    sq: s + q
    eq: e + q
  where: ['s + q >= 0', 'e + q < 0', 'p != 0', 'q != 0', 's != e', 'q^2 - p != 0']
  prompt: 'Solve $\;\sqrt{x {p:signed}} = x {q:signed}$. Enter the valid solution and the extraneous value that squaring produces.'
  answers:
    - {name: s, label: 'Valid solution'}
    - {name: e, label: 'Extraneous value'}
  solution: |-
    Square both sides: $x {p:signed} = (x {q:signed})^2$, which rearranges to $x^2 {B:signedcoef}x {C:signed} = 0$, with roots ${s}$ and ${e}$.
    Check: at $x = {s}$ the right side is ${sq} \ge 0$ and matches the root, so **{s}** is valid. At $x = {e}$ the right side is ${eq} < 0$, but a square root can't be negative, so **{e}** is extraneous.


- id: a2-d-even-exp
  title: Rational exponent with an even numerator
  topic: Radical equations
  vars:
    m: {choices: [2, 4]}
    r: {min: 1, max: 4}
    h: {min: -9, max: 9}
  calc:
    c: r^m
    r3: r^3
    nr3: -r^3
    nr: -r
    nh: -h
    s1: -h - r^3
    s2: -h + r^3
  where: ['h != 0', 'c <= 100']
  prompt: 'Solve $(x {h:signed})^{{m}/3} = {c}$. Enter both solutions, smaller first.'
  answers:
    - {name: s1, label: 'Smaller solution'}
    - {name: s2, label: 'Larger solution'}
  solution: |-
    Write the power with a cube root: $\left(\sqrt[3]{x {h:signed}}\right)^{{m}} = {c}$. The numerator {m} of the exponent is even, so undoing it gives both signs: $\sqrt[3]{x {h:signed}} = \pm {r}$.
    Cube: $x {h:signed} = \pm {r3}$. So $x = {nh} - {r3} =$ **{s1}** or $x = {nh} + {r3} =$ **{s2}**.
    Both check, since $({nr3})^{{m}/3} = ({nr})^{{m}} = {c}$ and $({r3})^{{m}/3} = {r}^{{m}} = {c}$. Raising both sides to the power $\tfrac{3}{{m}}$ alone would find only {s2}.
