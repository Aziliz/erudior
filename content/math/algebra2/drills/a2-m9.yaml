# Introduction to trigonometry drills
- id: a2-d-deg-rad
  title: Converting degrees and radians
  topic: Angles and radians
  vars:
    deg: {choices: [30, 45, 60, 90, 120, 135, 150, 210, 225, 240, 270, 300, 315, 330, -45, -60, -120, -150, 390, 420, 540]}
    rnum: {min: -11, max: 11}
    rden: {choices: [2, 3, 4, 6, 12]}
  where: ['rnum != 0', 'gcd(abs(rnum), rden) == 1']
  calc:
    k: deg/180
    rad: deg*pi/180
    dd: rnum*180/rden
  prompt: 'Convert ${deg}^\circ$ to radians (exact: type pi for $\pi$), and convert $\dfrac{{rnum:coef}\pi}{{rden}}$ radians to degrees.'
  answers:
    - {name: rad, label: 'Radians:', tolerance: 0.0005, format: num4}
    - {name: dd, label: 'Degrees:', tolerance: 0.01}
  solution: |-
    Degrees to radians: multiply by $\dfrac{\pi}{180^\circ}$. ${deg}^\circ \cdot \dfrac{\pi}{180^\circ} = {k:texfrac}\pi$, so the answer is **${k:texfrac}\pi$** (about {rad:num2}).
    Radians to degrees: multiply by $\dfrac{180^\circ}{\pi}$. The $\pi$'s cancel: $\dfrac{{rnum:coef}\pi}{{rden}} \cdot \dfrac{180^\circ}{\pi} = \dfrac{{rnum} \cdot 180^\circ}{{rden}} =$ **{dd}°**.

- id: a2-d-coterminal-ref
  title: Coterminal and reference angles
  topic: Angles and radians
  vars:
    th: {min: -700, max: 1070, step: 5}
  where: ['mod(th, 90) != 0', 'th < 0 or th >= 360']
  calc:
    co: th - 360*floor(th/360)
    adj: co - th
    quad: floor(co/90) + 1
    ref: if(co < 90, co, if(co < 180, 180 - co, if(co < 270, co - 180, 360 - co)))
  prompt: 'Find the angle between $0^\circ$ and $360^\circ$ that is coterminal with ${th}^\circ$, and give its reference angle in degrees.'
  answers:
    - {name: co, label: 'Coterminal angle (degrees):'}
    - {name: ref, label: 'Reference angle (degrees):'}
  solution: |-
    Add or subtract full turns of $360^\circ$ until the angle lands in $[0^\circ, 360^\circ)$: ${th}^\circ {adj:signed}^\circ =$ **{co}°**.
    {co}° is in quadrant {quad}. The reference angle is the acute angle between the terminal side and the $x$-axis
    (quadrant 1: $\theta$; 2: $180^\circ - \theta$; 3: $\theta - 180^\circ$; 4: $360^\circ - \theta$), which here is **{ref}°**.

- id: a2-d-unit-circle
  title: Sine and cosine of special angles
  topic: Unit circle
  vars:
    ang:
      choices:
      - {label: '$30^\circ$ is in quadrant I with reference angle $30^\circ$, where $\sin 30^\circ = \tfrac12$ and $\cos 30^\circ = \tfrac{\sqrt3}{2}$. In quadrant I both are positive, so $\sin\theta = \tfrac12$ and $\cos\theta = \tfrac{\sqrt3}{2}$.', value: 30}
      - {label: '$45^\circ$ is in quadrant I with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant I both are positive, so $\sin\theta = \tfrac{\sqrt2}{2}$ and $\cos\theta = \tfrac{\sqrt2}{2}$.', value: 45}
      - {label: '$60^\circ$ is in quadrant I with reference angle $60^\circ$, where $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\cos 60^\circ = \tfrac12$. In quadrant I both are positive, so $\sin\theta = \tfrac{\sqrt3}{2}$ and $\cos\theta = \tfrac12$.', value: 60}
      - {label: '$90^\circ$ is a quadrantal angle; its terminal side meets the unit circle at $(0, 1)$, so $\sin\theta = 1$ and $\cos\theta = 0$.', value: 90}
      - {label: '$120^\circ$ is in quadrant II with reference angle $60^\circ$, where $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\cos 60^\circ = \tfrac12$. In quadrant II sine is positive and cosine is negative, so $\sin\theta = \tfrac{\sqrt3}{2}$ and $\cos\theta = -\tfrac12$.', value: 120}
      - {label: '$135^\circ$ is in quadrant II with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant II sine is positive and cosine is negative, so $\sin\theta = \tfrac{\sqrt2}{2}$ and $\cos\theta = -\tfrac{\sqrt2}{2}$.', value: 135}
      - {label: '$150^\circ$ is in quadrant II with reference angle $30^\circ$, where $\sin 30^\circ = \tfrac12$ and $\cos 30^\circ = \tfrac{\sqrt3}{2}$. In quadrant II sine is positive and cosine is negative, so $\sin\theta = \tfrac12$ and $\cos\theta = -\tfrac{\sqrt3}{2}$.', value: 150}
      - {label: '$210^\circ$ is in quadrant III with reference angle $30^\circ$, where $\sin 30^\circ = \tfrac12$ and $\cos 30^\circ = \tfrac{\sqrt3}{2}$. In quadrant III both are negative, so $\sin\theta = -\tfrac12$ and $\cos\theta = -\tfrac{\sqrt3}{2}$.', value: 210}
      - {label: '$225^\circ$ is in quadrant III with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant III both are negative, so $\sin\theta = -\tfrac{\sqrt2}{2}$ and $\cos\theta = -\tfrac{\sqrt2}{2}$.', value: 225}
      - {label: '$240^\circ$ is in quadrant III with reference angle $60^\circ$, where $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\cos 60^\circ = \tfrac12$. In quadrant III both are negative, so $\sin\theta = -\tfrac{\sqrt3}{2}$ and $\cos\theta = -\tfrac12$.', value: 240}
      - {label: '$270^\circ$ is a quadrantal angle; its terminal side meets the unit circle at $(0, -1)$, so $\sin\theta = -1$ and $\cos\theta = 0$.', value: 270}
      - {label: '$300^\circ$ is in quadrant IV with reference angle $60^\circ$, where $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\cos 60^\circ = \tfrac12$. In quadrant IV sine is negative and cosine is positive, so $\sin\theta = -\tfrac{\sqrt3}{2}$ and $\cos\theta = \tfrac12$.', value: 300}
      - {label: '$315^\circ$ is in quadrant IV with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant IV sine is negative and cosine is positive, so $\sin\theta = -\tfrac{\sqrt2}{2}$ and $\cos\theta = \tfrac{\sqrt2}{2}$.', value: 315}
      - {label: '$330^\circ$ is in quadrant IV with reference angle $30^\circ$, where $\sin 30^\circ = \tfrac12$ and $\cos 30^\circ = \tfrac{\sqrt3}{2}$. In quadrant IV sine is negative and cosine is positive, so $\sin\theta = -\tfrac12$ and $\cos\theta = \tfrac{\sqrt3}{2}$.', value: 330}
      - {label: '$-60^\circ$ is coterminal with $300^\circ$. $300^\circ$ is in quadrant IV with reference angle $60^\circ$, where $\sin 60^\circ = \tfrac{\sqrt3}{2}$ and $\cos 60^\circ = \tfrac12$. In quadrant IV sine is negative and cosine is positive, so $\sin\theta = -\tfrac{\sqrt3}{2}$ and $\cos\theta = \tfrac12$.', value: -60}
      - {label: '$-135^\circ$ is coterminal with $225^\circ$. $225^\circ$ is in quadrant III with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant III both are negative, so $\sin\theta = -\tfrac{\sqrt2}{2}$ and $\cos\theta = -\tfrac{\sqrt2}{2}$.', value: -135}
      - {label: '$405^\circ$ is coterminal with $45^\circ$. $45^\circ$ is in quadrant I with reference angle $45^\circ$, where $\sin 45^\circ = \tfrac{\sqrt2}{2}$ and $\cos 45^\circ = \tfrac{\sqrt2}{2}$. In quadrant I both are positive, so $\sin\theta = \tfrac{\sqrt2}{2}$ and $\cos\theta = \tfrac{\sqrt2}{2}$.', value: 405}
  calc:
    k: ang/180
    s: sind(ang)
    c: cosd(ang)
  prompt: 'Find the exact values of $\sin\theta$ and $\cos\theta$ for $\theta = {ang:int}^\circ = {k:texfrac}\pi$. Type roots like sqrt(3)/2.'
  answers:
    - {name: s, label: '$\sin\theta =$', tolerance: 0.001, format: num4}
    - {name: c, label: '$\cos\theta =$', tolerance: 0.001, format: num4}
  solution: |-
    {ang}
    The point on the unit circle is $(\cos\theta, \sin\theta) \approx ({c:dp3}, {s:dp3})$.

- id: a2-d-sinusoid-features
  title: Amplitude, period and midline from an equation
  topic: Sinusoid graphs
  vars:
    a: {choices: [-4, -3, -2, 2, 3, 4, 5, 0.5]}
    bb: {choices: [{label: '2\pi', value: 1}, {label: '\pi', value: 2}, {label: '\tfrac{2\pi}{3}', value: 3}, {label: '\tfrac{\pi}{2}', value: 4}, {label: '4\pi', value: 0.5}]}
    kk: {min: -4, max: 4}
    fn: {choices: [{label: '\sin', value: 1}, {label: '\cos', value: 0}]}
  where: ['kk != 0']
  calc:
    amp: abs(a)
    per: 2*pi/bb
    mx: kk + abs(a)
    mn: kk - abs(a)
  prompt: 'For $y = {a:coef}{fn}({bb:coef}x) {kk:signed}$, find the amplitude, the period (type pi for $\pi$), the midline $y = k$, and the maximum and minimum values.'
  answers:
    - {name: amp, label: 'Amplitude'}
    - {name: per, label: 'Period', tolerance: 0.001, format: num4}
    - {name: kk, label: 'Midline: $y =$'}
    - {name: mx, label: 'Maximum'}
    - {name: mn, label: 'Minimum'}
  solution: |-
    Compare with $y = a{fn}(bx) + k$: $a = {a}$, $b = {bb:num4}$, $k = {kk}$.
    Amplitude $|a| =$ **{amp}**. Period $\dfrac{2\pi}{b} = \dfrac{2\pi}{{bb:num4}} =$ **${bb}$** (about {per:num2}). Midline $y =$ **{kk}**.
    Maximum $= k + |a| = {kk} + {amp} =$ **{mx}**; minimum $= k - |a| = {kk} - {amp} =$ **{mn}**.

- id: a2-d-sinusoid-from-graph
  title: Equation of a sinusoid from its graph
  topic: Sinusoid graphs
  vars:
    A: {min: 1, max: 5}
    P: {choices: [4, 6, 8, 12]}
    kk: {min: -3, max: 4}
    sgn: {choices: [{label: 'maximum, which is how cosine starts, so the graph is not flipped:', value: 1}, {label: 'minimum, so the cosine graph is flipped:', value: -1}]}
  calc:
    av: sgn*A
    bv: 2*pi/P
    bk: 2/P
    hp: P/2
    y0: kk + sgn*A
    y1: kk - sgn*A
    mxv: kk + A
    mnv: kk - A
  prompt: 'The graph shows a sinusoid $y = a\cos(bx) + k$. Find $a$, $b$ (type pi for $\pi$) and $k$.'
  figure:
    type: plot
    x: [-0.5, '2*P + 0.5']
    y: ['kk - A - 1.5', 'kk + A + 1.5']
    functions:
      - {f: 'sgn*A*cos(2*pi*x/P) + kk'}
    points:
      - {at: [0, y0], label: '(0, {y0})'}
      - {at: [hp, y1], label: '({hp}, {y1})'}
      - {at: [P, y0], label: '({P}, {y0})'}
  answers:
    - {name: av, label: '$a =$'}
    - {name: bv, label: '$b =$', tolerance: 0.001, format: num4}
    - {name: kk, label: '$k =$'}
  solution: |-
    The highest value is {mxv} and the lowest is {mnv}. Midline: $k = \dfrac{{mxv} + ({mnv})}{2} =$ **{kk}**. Amplitude: $\dfrac{{mxv} - ({mnv})}{2} = {A}$.
    The graph returns to its starting value at $x = {P}$, so the period is {P} and $b = \dfrac{2\pi}{{P}} =$ **${bk:texfrac}\pi$**.
    At $x = 0$ the graph is at a {sgn} $a =$ **{av}**.

- id: a2-d-periodic-model
  title: Ferris wheel model
  topic: Periodic models
  vars:
    D: {min: 20, max: 80, step: 2}
    plat: {min: 1, max: 5}
    T: {choices: [4, 5, 6, 8, 10, 12]}
    t: {min: 1, max: 11}
  where: ['t < T', 'mod(4*t, T) != 0']
  calc:
    R: D/2
    c: D/2 + plat
    am: -D/2
    bv: 2*pi/T
    bk: 2/T
    h: -D/2*cos(2*pi*t/T) + D/2 + plat
    top: D + plat
  prompt: 'A Ferris wheel {D} m across has its center {c} m above the ground and turns once every {T} minutes. You board at the bottom at $t = 0$. Model your height as $h(t) = a\cos(bt) + k$: find $a$, $b$ (type pi for $\pi$), $k$, and your height after {t} minutes (to 0.1 m).'
  figure:
    type: plot
    x: [0, '1.5*T']
    y: [0, 'top + 4']
    xLabel: 't (min)'
    yLabel: 'h (m)'
    functions:
      - {f: '-R*cos(2*pi*x/T) + c'}
  answers:
    - {name: am, label: '$a =$'}
    - {name: bv, label: '$b =$', tolerance: 0.001, format: num4}
    - {name: c, label: '$k =$'}
    - {name: h, label: 'Height (m)', tolerance: 0.1, format: num1}
  solution: |-
    The radius {R} m is the amplitude, and the center height {c} m is the midline, so $k =$ **{c}**.
    You start at the lowest point, which is how $-\cos$ starts, so $a =$ **{am}**.
    One turn takes {T} minutes, so $b = \dfrac{2\pi}{{T}} =$ **${bk:texfrac}\pi$**.
    $h({t}) = {am}\cos\left({bk:texfrac}\pi \cdot {t}\right) + {c} \approx$ **{h:num1}** m (calculator in radian mode).
