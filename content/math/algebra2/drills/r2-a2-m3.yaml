# Round 2 drills for module a2-m3 (honors lessons)

- id: a2-m3-r2-descartes
  title: Descartes' rule of signs
  topic: Locating real zeros
  vars:
    a4: {min: 1, max: 4}
    a3: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    a2: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    a1: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    a0: {choices: [-9, -7, -5, -3, -2, -1, 1, 2, 3, 5, 7, 9]}
  calc:
    vp: (a4*a3 < 0) + (a3*a2 < 0) + (a2*a1 < 0) + (a1*a0 < 0)
    vn: (a4*a3 > 0) + (a3*a2 > 0) + (a2*a1 > 0) + (a1*a0 > 0)
    b3: -a3
    b1: -a1
  prompt: 'For $f(x) = {a4:coef}x^4 {a3:signedcoef}x^3 {a2:signedcoef}x^2 {a1:signedcoef}x {a0:signed}$, what is the greatest number of positive real zeros that Descartes'' rule of signs allows? The greatest number of negative real zeros?'
  answers:
    - {name: vp, label: 'Positive zeros, at most', format: integer}
    - {name: vn, label: 'Negative zeros, at most', format: integer}
  solution: |-
    Read the signs of the coefficients of $f(x)$ from left to right and count the switches: **{vp}** sign changes, so at most {vp} positive zeros (or fewer by an even number).
    For negative zeros, change the signs of the odd-power terms: $f(-x) = {a4:coef}x^4 {b3:signedcoef}x^3 {a2:signedcoef}x^2 {b1:signedcoef}x {a0:signed}$, which has **{vn}** sign changes, so at most {vn} negative zeros.

- id: a2-m3-r2-upper-bound
  title: Upper bound test
  topic: Locating real zeros
  vars:
    b: {min: -6, max: 3}
    d: {min: -12, max: 12}
    k: {min: -20, max: 20}
  funcs:
    ok(x): (b + x >= 0) and (d + x*(b + x) >= 0) and (k + x*(d + x*(b + x)) >= 0)
  calc:
    cmin: if(ok(1), 1, if(ok(2), 2, if(ok(3), 3, if(ok(4), 4, if(ok(5), 5, if(ok(6), 6, 7))))))
    cp: cmin - 1
    r1: b + cmin
    r2: d + cmin*r1
    r3: k + cmin*r2
    s1: b + cp
    s2: d + cp*s1
    s3: k + cp*s2
  where: ['b != 0', 'd != 0', 'k != 0', 'cmin >= 2', 'cmin <= 6']
  prompt: 'Let $f(x) = x^3 {b:signedcoef}x^2 {d:signedcoef}x {k:signed}$. What is the smallest positive integer $c$ for which the upper bound test (synthetic division by $x - c$, bottom row with no negative entries) shows that $c$ is an upper bound for the real zeros of $f$?'
  answer: cmin
  format: integer
  solution: |-
    Divide synthetically by $x - c$ for $c = 1, 2, 3, \ldots$ until the bottom row has no negative entries.
    With $c = {cp}$ the bottom row is $1, {s1}, {s2}, {s3}$, which has a negative entry, so the test fails there.
    With $c = {cmin}$ the bottom row is $1, {r1}, {r2}, {r3}$, with no negative entries, so no real zero is greater than {cmin}. Answer: **{cmin}**.

- id: a2-m3-r2-bisection
  title: Three steps of bisection
  topic: Locating real zeros
  vars:
    p: {min: 1, max: 5}
    q: {min: -20, max: 20}
  funcs:
    f(x): x^3 + p*x + q
  calc:
    root: solve(f, -5, 5)
    lo: floor(root)
    hi: lo + 1
    m1: lo + 0.5
    f1: f(m1)
    L1: if(f1 > 0, lo, m1)
    R1: L1 + 0.5
    m2: L1 + 0.25
    f2: f(m2)
    L2: if(f2 > 0, L1, m2)
    R2: L2 + 0.25
    m3: L2 + 0.125
    f3: f(m3)
    L3: if(f3 > 0, L2, m3)
    R3: L3 + 0.125
  where: ['q != 0', 'abs(root*8 - round(root*8)) > 0.01']
  prompt: '$f(x) = x^3 {p:signedcoef}x {q:signed}$ is always increasing, so it has exactly one real zero, and $f({lo}) < 0 < f({hi})$. Starting from the interval from {lo} to {hi}, do three steps of bisection. Between which two numbers is the zero after the third step?'
  answers:
    - {name: L3, label: 'Left endpoint', format: num4, tolerance: 0.0001}
    - {name: R3, label: 'Right endpoint', format: num4, tolerance: 0.0001}
  solution: |-
    Since $f$ is increasing, a positive $f(m)$ means the zero is to the left of $m$, and a negative one means it's to the right.
    Step 1: $f({m1:num4}) \approx {f1:dp3}$, so the zero is between {L1:num4} and {R1:num4}.
    Step 2: $f({m2:num4}) \approx {f2:dp3}$, so the zero is between {L2:num4} and {R2:num4}.
    Step 3: $f({m3:num4}) \approx {f3:dp3}$, so the zero is between **{L3:num4}** and **{R3:num4}**.

- id: a2-m3-r2-vieta
  title: Vieta's formulas for a cubic
  topic: Vieta's formulas
  vars:
    A: {min: 1, max: 4}
    B: {choices: [-9, -7, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 7, 9]}
    C: {choices: [-9, -7, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 7, 9]}
    D: {choices: [-9, -7, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 7, 9]}
  calc:
    S1: -B/A
    S2: C/A
    S3: -D/A
  prompt: 'Let $r$, $s$, $t$ be the roots of ${A:coef}x^3 {B:signedcoef}x^2 {C:signedcoef}x {D:signed}$. Without solving, find $r + s + t$, $rs + rt + st$ and $rst$. (Fractions are fine.)'
  answers:
    - {name: S1, label: '$r + s + t =$', format: fraction, tolerance: 0.005}
    - {name: S2, label: '$rs + rt + st =$', format: fraction, tolerance: 0.005}
    - {name: S3, label: '$rst =$', format: fraction, tolerance: 0.005}
  solution: |-
    For $ax^3 + bx^2 + cx + d$, Vieta's formulas give $r + s + t = -\tfrac ba$, $rs + rt + st = \tfrac ca$ and $rst = -\tfrac da$.
    Here: $r + s + t = -\tfrac{{B}}{{A}} =$ **${S1:texfrac}$**, $rs + rt + st = \tfrac{{C}}{{A}} =$ **${S2:texfrac}$**, $rst = -\tfrac{{D}}{{A}} =$ **${S3:texfrac}$**.

- id: a2-m3-r2-symmetric
  title: Sum of squares and reciprocals of the roots
  topic: Vieta's formulas
  vars:
    b: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    c: {choices: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6]}
    d: {choices: [-8, -6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 6, 8]}
  calc:
    e1: -b
    e2: c
    e3: -d
    sq: b^2 - 2*c
    rec: -c/d
  prompt: 'Let $r$, $s$, $t$ be the roots of $x^3 {b:signedcoef}x^2 {c:signedcoef}x {d:signed}$. Find $r^2 + s^2 + t^2$ and $\tfrac1r + \tfrac1s + \tfrac1t$. (Fractions are fine.)'
  answers:
    - {name: sq, label: '$r^2 + s^2 + t^2 =$'}
    - {name: rec, label: '$\tfrac1r + \tfrac1s + \tfrac1t =$', format: fraction, tolerance: 0.005}
  solution: |-
    Vieta: $r + s + t = {e1}$, $rs + rt + st = {e2}$, $rst = {e3}$.
    $r^2 + s^2 + t^2 = (r + s + t)^2 - 2(rs + rt + st) = ({e1})^2 - 2({e2}) =$ **{sq}**.
    $\tfrac1r + \tfrac1s + \tfrac1t = \tfrac{rs + rt + st}{rst} = \tfrac{{e2}}{{e3}} =$ **${rec:texfrac}$**.

- id: a2-m3-r2-missing-root
  title: Third root from the sum of the roots
  topic: Vieta's formulas
  vars:
    r: {min: -6, max: 6}
    s: {min: -6, max: 6}
    t: {min: -6, max: 6}
  calc:
    B: -(r + s + t)
    C: r*s + r*t + s*t
    D: -r*s*t
    nB: r + s + t
    nD: r*s*t
  where: ['r < s', 'r != t', 's != t', 'r != 0', 's != 0', 't != 0', 'B != 0', 'C != 0']
  prompt: 'Two of the zeros of $x^3 {B:signedcoef}x^2 {C:signedcoef}x {D:signed}$ are ${r}$ and ${s}$. Use the sum of the roots to find the third zero.'
  answer: t
  format: integer
  solution: |-
    By Vieta's formulas the three zeros add up to $-\tfrac{{B}}{1} = {nB}$. So the third zero is ${nB} - ({r}) - ({s}) =$ **{t}**.
    Check with the product: the zeros should multiply to $-({D}) = {nD}$, and $({r})({s})({t}) = {nD}$. ✓
