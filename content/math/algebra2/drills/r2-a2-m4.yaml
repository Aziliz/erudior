# Round 2 drills for module a2-m4 (honors lessons)
- id: a2-m4-r2-heron-step
  title: Two steps of Heron's method
  topic: Approximating roots
  vars:
    n: {min: 3, max: 99}
  calc:
    x0: round(sqrt(n))
    q0: n/x0
    x1: (x0 + n/x0)/2
    q1: n/x1
    x2: (x1 + n/x1)/2
    r: sqrt(n)
  where: ['round(sqrt(n))^2 != n']
  prompt: 'Approximate $\sqrt{{n}}$ with Heron''s method, $x \to \tfrac12\left(x + \tfrac{{n}}{x}\right)$, starting from $x_0 = {x0}$. Give $x_1$ and $x_2$ to 4 decimal places.'
  answers:
    - {name: x1, label: '$x_1 =$', format: num4, tolerance: 0.0001}
    - {name: x2, label: '$x_2 =$', format: num4, tolerance: 0.0001}
  solution: |-
    The other side of the rectangle is $\tfrac{{n}}{{x0}} = {q0:num4}$, so $x_1 = \tfrac12({x0} + {q0:num4}) =$ **{x1:num4}**.
    Again: $\tfrac{{n}}{x_1} = {q1:num4}$, so $x_2 = \tfrac12({x1:num4} + {q1:num4}) =$ **{x2:num4}**.
    For comparison, a calculator gives $\sqrt{{n}} = {r:num4}$ (to 4 decimal places).

- id: a2-m4-r2-cube-newton
  title: One step toward a cube root
  topic: Approximating roots
  vars:
    n: {min: 3, max: 200}
  calc:
    x0: round(cbrt(n))
    sq: x0^2
    q0: n/x0^2
    x1: (2*x0 + n/x0^2)/3
    r: cbrt(n)
  where: ['round(cbrt(n))^3 != n']
  prompt: 'Approximate $\sqrt[3]{{n}}$ with one step of $x \to \tfrac13\left(2x + \tfrac{{n}}{x^2}\right)$, starting from $x_0 = {x0}$. Give $x_1$ to 4 decimal places.'
  answers:
    - {name: x1, label: '$x_1 =$', format: num4, tolerance: 0.0001}
  solution: |-
    The third side of the box is $\tfrac{{n}}{{x0}^2} = \tfrac{{n}}{{sq}} = {q0:num4}$.
    Average the three sides: $x_1 = \tfrac13({x0} + {x0} + {q0:num4}) =$ **{x1:num4}**.
    For comparison, a calculator gives $\sqrt[3]{{n}} = {r:num4}$ (to 4 decimal places).

- id: a2-m4-r2-kepler
  title: Kepler's third law
  topic: Power laws
  vars:
    dist: {min: 0.5, max: 20, step: 0.1}
    per: {min: 2, max: 150}
  calc:
    Tans: dist^(3/2)
    rt: sqrt(dist)
    aans: per^(2/3)
    cr: cbrt(per)
  prompt: 'Use Kepler''s third law, $T = a^{3/2}$ ($T$ in years, $a$ in AU). (1) Find the period of an object orbiting the Sun at an average distance of {dist:num1} AU. (2) Find the average distance of an object whose period is {per} years. Give both to 2 decimal places.'
  answers:
    - {name: Tans, label: '(1) Period (years)', format: num2, tolerance: 0.01}
    - {name: aans, label: '(2) Distance (AU)', format: num2, tolerance: 0.01}
  solution: |-
    (1) $T = {dist:num1}^{3/2} = \left(\sqrt{{dist:num1}}\right)^3 \approx {rt:num4}^3 \approx$ **{Tans:num2}** years.
    (2) Raise both sides of $T = a^{3/2}$ to the reciprocal power $\tfrac23$: $a = T^{2/3} = {per}^{2/3} = \left(\sqrt[3]{{per}}\right)^2 \approx {cr:num4}^2 \approx$ **{aans:num2}** AU.

- id: a2-m4-r2-scale-factor
  title: Scaling a power law
  topic: Power laws
  vars:
    r: {min: 2, max: 5}
    m: {choices: [2, 3, 4, 5]}
    q: {choices: [2, 3, 4]}
  calc:
    c: r^q
    ans: r^m
  where: ['gcd(m, q) == 1', 'm != q', 'c <= 256', 'ans <= 1000']
  prompt: 'In the power law $y = kx^{{m}/{q}}$, the input $x$ is multiplied by {c}. By what factor is $y$ multiplied?'
  answers:
    - {name: ans, label: 'Factor', format: integer}
  solution: |-
    Multiplying $x$ by $c$ multiplies $y$ by $c^{{m}/{q}}$, whatever $x$ and $k$ are.
    Here ${c}^{{m}/{q}} = \left(\sqrt[{q}]{{c}}\right)^{{m}} = {r}^{{m}} =$ **{ans}**.

- id: a2-m4-r2-find-exponent
  title: Find the exponent of a power law
  topic: Power laws
  vars:
    b: {choices: [2, 3, 5]}
    s: {min: 2, max: 4}
    t: {min: 1, max: 5}
  calc:
    cx: b^s
    cy: b^t
    p: t/s
  where: ['t != s', 'cx <= 256', 'cy <= 1000']
  prompt: 'In $y = kx^p$, multiplying $x$ by {cx} multiplies $y$ by {cy}. Give $p$ as a fraction in lowest terms (or a whole number).'
  answers:
    - {name: p, kind: fraction, lowestTerms: true, label: '$p =$'}
  solution: |-
    Scaling gives ${cx}^p = {cy}$. Write both sides as powers of {b}: ${b}^{{s:coef}p} = {b}^{{t}}$.
    Equal powers of the same base have equal exponents, so ${s:coef}p = {t}$ and $p =$ **${p:texfrac}$**.
