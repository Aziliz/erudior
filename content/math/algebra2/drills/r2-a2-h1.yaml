# Honors module a2-h1 (Toward precalculus and beyond), round 2 drills
- id: a2-h1-r2-circle-center
  title: Center and radius of a circle in general form
  topic: Conic sections
  vars:
    hc: {min: -6, max: 6}
    kc: {min: -6, max: 6}
    r: {min: 1, max: 8}
  where: ['hc != 0', 'kc != 0', 'hc*hc + kc*kc - r*r != 0']
  calc:
    D: -2*hc
    E: -2*kc
    F: hc*hc + kc*kc - r*r
    negF: -F
    h2: hc*hc
    k2: kc*kc
    r2: r*r
    nh: -hc
    nk: -kc
  prompt: 'Find the center $(h, k)$ and radius $r$ of the circle $x^2 + y^2 {D:signedcoef}x {E:signedcoef}y {F:signed} = 0$.'
  answers:
    - {name: hc, label: '$h =$'}
    - {name: kc, label: '$k =$'}
    - {name: r, label: '$r =$'}
  solution: |-
    Move the constant and group: $(x^2 {D:signedcoef}x) + (y^2 {E:signedcoef}y) = {negF}$.
    Complete each square by adding the square of half the coefficient, $\left(\tfrac{{D}}{2}\right)^2 = {h2}$ and $\left(\tfrac{{E}}{2}\right)^2 = {k2}$, to both sides:
    $(x {nh:signed})^2 + (y {nk:signed})^2 = {negF} + {h2} + {k2} = {r2}$.
    So the center is **$({hc}, {kc})$** and the radius is $\sqrt{{r2}} =$ **{r}**.

- id: a2-h1-r2-parabola-focus
  title: Focus and directrix of a parabola
  topic: Conic sections
  vars:
    hv: {min: -5, max: 5}
    kv: {min: -5, max: 5}
    p: {choices: [-3, -2, -1, 1, 2, 3]}
  where: ['hv != 0', 'kv != 0']
  calc:
    c4: 4*p
    nh: -hv
    nk: -kv
    fy: kv + p
    dy: kv - p
  prompt: 'The parabola $(x {nh:signed})^2 = {c4}(y {nk:signed})$ has vertex $({hv}, {kv})$. Find its focus $(x_F, y_F)$ and the $y$-value of its directrix $y = d$.'
  answers:
    - {name: hv, label: '$x_F =$'}
    - {name: fy, label: '$y_F =$'}
    - {name: dy, label: '$d =$'}
  solution: |-
    This is $x^2 = 4py$ shifted to the vertex $({hv}, {kv})$, with $4p = {c4}$, so $p = {p}$.
    The focus is $p$ units from the vertex along the axis (up if $p > 0$, down if $p < 0$): **$({hv}, {fy})$**.
    The directrix is $p$ units on the other side: $y = {kv} - ({p}) =$ **{dy}**.

- id: a2-h1-r2-ellipse-foci
  title: Axes and foci of an ellipse
  topic: Conic sections
  vars:
    a: {min: 3, max: 9}
    b: {min: 2, max: 8}
    flip:
      choices:
        - {label: 'horizontal (the larger denominator is under $x^2$), so the vertices are $(\pm a, 0)$ and the foci $(\pm c, 0)$', value: 0}
        - {label: 'vertical (the larger denominator is under $y^2$), so the vertices are $(0, \pm a)$ and the foci $(0, \pm c)$', value: 1}
  where: ['a > b']
  calc:
    A: if(flip == 1, b*b, a*a)
    B: if(flip == 1, a*a, b*b)
    a2: a*a
    b2: b*b
    c2: a*a - b*b
    c: sqrt(a*a - b*b)
  prompt: 'For the ellipse $\dfrac{x^2}{{A}} + \dfrac{y^2}{{B}} = 1$, find $a$ (half the major axis), $b$ (half the minor axis) and $c$ (the distance from the center to each focus). Type roots like sqrt(7).'
  answers:
    - {name: a, label: '$a =$'}
    - {name: b, label: '$b =$'}
    - {name: c, label: '$c =$', tolerance: 0.001, format: num4}
  solution: |-
    $a$ goes with the larger denominator: $a^2 = {a2}$, so $a =$ **{a}**, and $b^2 = {b2}$, so $b =$ **{b}**. The major axis is {flip}.
    For an ellipse $c^2 = a^2 - b^2 = {a2} - {b2} = {c2}$, so $c = \sqrt{{c2}} \approx$ **{c:num4}**.

- id: a2-h1-r2-param-line
  title: A point on a parametrized segment
  topic: Parametric equations
  vars:
    x1: {min: -6, max: 6}
    y1: {min: -6, max: 6}
    x2: {min: -6, max: 6}
    y2: {min: -6, max: 6}
    tt:
      choices:
        - {label: '\tfrac14', value: 0.25}
        - {label: '\tfrac12', value: 0.5}
        - {label: '\tfrac34', value: 0.75}
        - {label: '\tfrac13', value: 0.3333333333333333}
        - {label: '\tfrac23', value: 0.6666666666666666}
  where: ['x2 != x1', 'y2 != y1']
  calc:
    dx: x2 - x1
    dy: y2 - y1
    px: x1 + dx*tt
    py: y1 + dy*tt
  prompt: 'Parametrize the segment from $P({x1}, {y1})$ to $Q({x2}, {y2})$ so that $t = 0$ gives $P$ and $t = 1$ gives $Q$. Find the point at $t = {tt}$. Exact fractions or 3 decimal places.'
  answers:
    - {name: px, label: '$x =$', tolerance: 0.001, format: num4}
    - {name: py, label: '$y =$', tolerance: 0.001, format: num4}
  solution: |-
    The changes from $P$ to $Q$ are $\Delta x = {x2} - ({x1}) = {dx}$ and $\Delta y = {y2} - ({y1}) = {dy}$, so
    $x = {x1} {dx:signedcoef}t$ and $y = {y1} {dy:signedcoef}t$, for $0 \le t \le 1$.
    At $t = {tt}$: $x = {x1} + ({dx})\left({tt}\right) =$ **{px:frac}** and $y = {y1} + ({dy})\left({tt}\right) =$ **{py:frac}**.

- id: a2-h1-r2-param-eliminate
  title: Eliminate the parameter (line)
  topic: Parametric equations
  vars:
    a: {min: -5, max: 5}
    b: {min: -6, max: 6}
    c: {min: -6, max: 6}
    d: {min: -6, max: 6}
  where: ['a != 0', 'c != 0', 'b != 0', 'd != 0', 'abs(a) != 1 or abs(c) != 1']
  calc:
    m: c/a
    k: d - c*b/a
    nb: -b
  prompt: 'Eliminate the parameter from $x = {a:coef}t {b:signed}$, $y = {c:coef}t {d:signed}$, and write the result as $y = mx + k$. Give $m$ and $k$ as whole numbers or fractions in lowest terms.'
  answers:
    - {name: m, label: '$m =$', kind: fraction, lowestTerms: true}
    - {name: k, label: '$k =$', kind: fraction, lowestTerms: true}
  solution: |-
    Solve the first equation for $t$: $t = \dfrac{x {nb:signed}}{{a}}$.
    Substitute into the second: $y = {c} \cdot \dfrac{x {nb:signed}}{{a}} {d:signed}$.
    Distribute: the slope is $\dfrac{{c}}{{a}}$, so $m =$ **${m:texfrac}$**, and the constant is ${d} - \dfrac{({c})({b})}{{a}}$, so $k =$ **${k:texfrac}$**.

- id: a2-h1-r2-projectile
  title: Projectile height, time and range
  topic: Parametric equations
  vars:
    v: {min: 40, max: 120, step: 8}
    ang: {choices: [30, 45, 60]}
    h0: {min: 2, max: 10}
  calc:
    vx: v*cosd(ang)
    vy: v*sind(ang)
    tt: vy/32
    H: h0 + vy*vy/64
    T: (vy + sqrt(vy*vy + 64*h0))/32
    R: vx*T
  prompt: 'A ball is thrown from {h0} ft above the ground at {v} ft/s, ${ang}^\circ$ above the horizontal. With $x = (v_0\cos\theta)t$ and $y = h_0 + (v_0\sin\theta)t - 16t^2$ (feet, no air resistance), find its greatest height and the time when it lands (both to 2 decimal places), and how far away it lands (to the nearest foot). Round only at the end.'
  answers:
    - {name: H, label: 'Greatest height (ft):', tolerance: 0.02, format: num2}
    - {name: T, label: 'Landing time (s):', tolerance: 0.006, format: num2}
    - {name: R, label: 'Distance (ft):', tolerance: 1, format: int}
  solution: |-
    Components: $v_0\cos\theta = {v}\cos {ang}^\circ \approx {vx:num4}$ ft/s and $v_0\sin\theta = {v}\sin {ang}^\circ \approx {vy:num4}$ ft/s.
    Greatest height: the vertex of $y = {h0} + {vy:num4}t - 16t^2$ is at $t = \tfrac{{vy:num4}}{32} \approx {tt:num4}$ s, where $y \approx$ **{H:num2} ft**.
    Landing: solve $-16t^2 + {vy:num4}t + {h0} = 0$; the positive root of the quadratic formula is $t \approx$ **{T:num2} s**.
    Distance: $x \approx {vx:num4} \times {T:num4} \approx {R:num1}$, which rounds to **{R:int} ft**.

- id: a2-h1-r2-modulus-argument
  title: Modulus and argument of a complex number
  topic: Polar form of complex numbers
  vars:
    a: {min: -9, max: 9}
    b: {min: -9, max: 9}
  where: ['a != 0', 'b != 0']
  calc:
    r2: a*a + b*b
    r: sqrt(a*a + b*b)
    ref: atand(abs(b/a))
    quad: if(a > 0, if(b > 0, 1, 4), if(b > 0, 2, 3))
    th: mod(atan2d(b, a), 360)
  prompt: 'Find the modulus $r$ and the argument $\theta$ ($0^\circ \le \theta < 360^\circ$) of $z = {a} {b:signedcoef}i$. Give $r$ exactly (like sqrt(34)) or to 2 decimal places, and $\theta$ to the nearest tenth of a degree.'
  answers:
    - {name: r, label: '$r =$', tolerance: 0.006, format: num4}
    - {name: th, label: '$\theta =$', tolerance: 0.06, format: num1}
  solution: |-
    $r = \sqrt{{r2}} \approx$ **{r:num2}**.
    The point $({a}, {b})$ is in quadrant {quad}. Its reference angle is $\tan^{-1}\left|\tfrac{{b}}{{a}}\right| \approx {ref:num1}^\circ$.
    Place it in the quadrant (quadrant 1: $\theta$ = reference angle; 2: $180^\circ -$ ref; 3: $180^\circ +$ ref; 4: $360^\circ -$ ref): $\theta \approx$ **{th:num1}°**.

- id: a2-h1-r2-polar-multiply
  title: Multiply and divide in polar form
  topic: Polar form of complex numbers
  vars:
    r1: {min: 2, max: 9}
    r2: {min: 2, max: 9}
    t1: {min: 10, max: 350, step: 10}
    t2: {min: 10, max: 350, step: 10}
  where: ['t1 != t2']
  calc:
    pm: r1*r2
    pa: mod(t1 + t2, 360)
    qm: r1/r2
    qa: mod(t1 - t2, 360)
    sa: t1 + t2
    da: t1 - t2
  prompt: 'Let $z_1 = {r1}\,\text{cis}\,{t1}^\circ$ and $z_2 = {r2}\,\text{cis}\,{t2}^\circ$. Write $z_1 z_2$ and $\dfrac{z_1}{z_2}$ in polar form, with arguments between $0^\circ$ and $360^\circ$. Give the quotient''s modulus as a fraction or to 2 decimal places.'
  answers:
    - {name: pm, label: '$|z_1 z_2| =$'}
    - {name: pa, label: 'Argument of $z_1 z_2$ (degrees):'}
    - {name: qm, label: '$\left|\tfrac{z_1}{z_2}\right| =$', tolerance: 0.006, format: num4}
    - {name: qa, label: 'Argument of $\tfrac{z_1}{z_2}$ (degrees):'}
  solution: |-
    Multiply the moduli and add the arguments: ${r1} \cdot {r2} =$ **{pm}** and ${t1}^\circ + {t2}^\circ = {sa}^\circ$, which is coterminal with **{pa}°**.
    Divide the moduli and subtract the arguments: $\tfrac{{r1}}{{r2}} =$ **{qm:frac}** $\approx {qm:num2}$ and ${t1}^\circ - {t2}^\circ = {da}^\circ$, which is coterminal with **{qa}°**.

- id: a2-h1-r2-de-moivre
  title: Powers with De Moivre's theorem
  topic: Powers and roots of complex numbers
  vars:
    z:
      choices:
        - {label: '1 + i', value: 1045}
        - {label: '1 - i', value: 1315}
        - {label: '-1 + i', value: 1135}
        - {label: '1 + \sqrt3\,i', value: 2060}
        - {label: '\sqrt3 + i', value: 2030}
        - {label: '-1 + \sqrt3\,i', value: 2120}
        - {label: '-\sqrt3 - i', value: 2210}
        - {label: '2 + 2i', value: 3045}
    n: {min: 2, max: 8}
  calc:
    kk: floor(z/1000)
    th: mod(z, 1000)
    r: if(kk == 1, sqrt(2), if(kk == 2, 2, 2*sqrt(2)))
    R: r^n
    nth: n*th
    A: mod(n*th, 360)
  prompt: 'Use De Moivre''s theorem to find the modulus and the argument ($0^\circ \le \theta < 360^\circ$) of $({z})^{n}$. Give the modulus exactly (like 8sqrt(2)) or to 2 decimal places.'
  answers:
    - {name: R, label: 'Modulus:', tolerance: 0.006, format: num4}
    - {name: A, label: 'Argument (degrees):'}
  solution: |-
    First write ${z}$ in polar form: its modulus is $r \approx {r:num4}$ and its argument is ${th}^\circ$.
    De Moivre: $(r\,\text{cis}\,\theta)^{n} = r^{n}\,\text{cis}({n}\theta)$. The modulus is $r^{n} \approx$ **{R:num4}**.
    The argument is ${n} \cdot {th}^\circ = {nth}^\circ$, which is coterminal with **{A}°**.

- id: a2-h1-r2-avg-rate
  title: Average rate of change of a quadratic
  topic: Average rate of change
  vars:
    a: {min: -4, max: 4}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    p: {min: -5, max: 4}
    d: {min: 1, max: 5}
  where: ['a != 0', 'b != 0', 'c != 0']
  calc:
    q: p + d
    fp: a*p*p + b*p + c
    fq: a*q*q + b*q + c
    df: fq - fp
    m: (fq - fp)/(q - p)
  prompt: 'Find the average rate of change of $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$ from $x = {p}$ to $x = {q}$.'
  answer: m
  format: integer
  solution: |-
    $f({p}) = {fp}$ and $f({q}) = {fq}$.
    Average rate of change $= \dfrac{f({q}) - f({p})}{{q} - ({p})} = \dfrac{{df}}{{d}} =$ **{m}**.

- id: a2-h1-r2-diff-quotient
  title: Simplify a difference quotient
  topic: Difference quotients
  vars:
    a: {min: -5, max: 5}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
  where: ['a != 0', 'b != 0', 'c != 0']
  calc:
    a2: 2*a
  prompt: 'Simplify the difference quotient $\dfrac{f(x + h) - f(x)}{h}$ for $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$. Type your answer in terms of $x$ and $h$.'
  answers:
    - {kind: expression, expression: '2*a*x + a*h + b', variables: [x, h], label: 'Difference quotient:', show: '${a2:coef}x {a:signedcoef}h {b:signed}$'}
  solution: |-
    Replace every $x$ by $(x + h)$: $f(x + h) = {a:coef}(x + h)^2 {b:signedcoef}(x + h) {c:signed} = {a:coef}x^2 {a2:signedcoef}xh {a:signedcoef}h^2 {b:signedcoef}x {b:signedcoef}h {c:signed}$.
    Subtract $f(x)$: the ${a:coef}x^2$, ${b:coef}x$ and ${c}$ cancel, leaving ${a2:coef}xh {a:signedcoef}h^2 {b:signedcoef}h$.
    Divide by $h$: **${a2:coef}x {a:signedcoef}h {b:signed}$**.

- id: a2-h1-r2-instant-rate
  title: Instantaneous rate of change and tangent line
  topic: Difference quotients
  vars:
    a: {min: -4, max: 4}
    b: {min: -9, max: 9}
    c: {min: -9, max: 9}
    x0: {min: -4, max: 4}
  where: ['a != 0', 'b != 0', 'c != 0', 'x0 != 0']
  calc:
    a2: 2*a
    f0: a*x0*x0 + b*x0 + c
    m: 2*a*x0 + b
    k: f0 - m*x0
  prompt: 'For $f(x) = {a:coef}x^2 {b:signedcoef}x {c:signed}$, find the instantaneous rate of change at $x = {x0}$ (simplify the difference quotient, then let $h$ shrink to 0), and the $y$-intercept $k$ of the tangent line $y = mx + k$ at that point.'
  answers:
    - {name: m, label: 'Rate $m =$'}
    - {name: k, label: '$k =$'}
  solution: |-
    The difference quotient simplifies to ${a2:coef}x {a:signedcoef}h {b:signed}$. As $h$ shrinks to 0 it approaches ${a2:coef}x {b:signed}$.
    At $x = {x0}$: $m = {a2}({x0}) {b:signed} =$ **{m}**.
    The tangent line passes through $({x0}, f({x0})) = ({x0}, {f0})$: $y = {f0} + ({m})(x - ({x0}))$, so $k = {f0} - ({m})({x0}) =$ **{k}**.
