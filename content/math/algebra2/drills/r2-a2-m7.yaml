# Round 2 drills for a2-m7 (honors lessons 24h1 and 24h2)
- id: a2-m7-r2-quadratic-seq
  title: Quadratic formula from a difference table
  topic: Finite differences
  vars:
    A: {choices: [1, 2, 3, -1, -2]}
    B: {min: -6, max: 6}
    C: {min: -8, max: 8}
  where: ['B != 0', 'C != 0']
  calc:
    t1: A + B + C
    t2: 4*A + 2*B + C
    t3: 9*A + 3*B + C
    t4: 16*A + 4*B + C
    d1: t2 - t1
    d2: t3 - t2
    d3: t4 - t3
    sd: 2*A
    r1: B + C
    r2: 2*B + C
    r3: 3*B + C
    r4: 4*B + C
  prompt: 'The sequence ${t1}, {t2}, {t3}, {t4}, \ldots$ has constant second differences. Find a quadratic formula for $a_n$.'
  answers:
    - {kind: expression, expression: A*n^2 + B*n + C, variables: [n], label: '$a_n =$', show: '${A:coef}n^2 {B:signedcoef}n {C:signed}$'}
  solution: |-
    First differences: ${d1}, {d2}, {d3}$. Second differences: all ${sd}$, so $A = \tfrac{{sd}}{2} = {A}$.
    Subtract ${A:coef}n^2$ from each term: ${r1}, {r2}, {r3}, {r4}$. That is arithmetic with difference ${B}$ and first term ${r1}$, so it equals ${B:coef}n {C:signed}$.
    So $a_n =$ **${A:coef}n^2 {B:signedcoef}n {C:signed}$**.

- id: a2-m7-r2-power-sum
  title: Sum of a quadratic expression
  topic: Sums of powers
  vars:
    p: {min: 1, max: 4}
    q: {min: -5, max: 5}
    c: {min: -9, max: 9}
    n: {min: 6, max: 20}
  where: ['q != 0', 'c != 0']
  calc:
    n1: n + 1
    n2: 2*n + 1
    s2: n*(n + 1)*(2*n + 1)/6
    s1: n*(n + 1)/2
    cn: c*n
    S: p*s2 + q*s1 + c*n
  prompt: 'Evaluate $\displaystyle\sum_{k=1}^{{n}} \left({p:coef}k^2 {q:signedcoef}k {c:signed}\right)$.'
  answers:
    - {name: S, label: 'Sum', tolerance: 0}
  solution: |-
    Split the sum and use the power-sum formulas with $n = {n}$:
    $\sum k^2 = \dfrac{{n}({n1})({n2})}{6} = {s2:dp0}$, $\sum k = \dfrac{{n}({n1})}{2} = {s1:dp0}$, and the constant adds up to ${n} \cdot ({c}) = {cn:dp0}$.
    Total: ${p}({s2:dp0}) + ({q})({s1:dp0}) + ({cn:dp0}) =$ **{S}**.

- id: a2-m7-r2-power-range
  title: Sum of powers over a range
  topic: Sums of powers
  vars:
    pw: {choices: [1, 2, 3]}
    m: {min: 3, max: 12}
    cnt: {min: 4, max: 15}
  calc:
    n: m + cnt
    mm: m - 1
    Sn: if(pw == 1, n*(n + 1)/2, if(pw == 2, n*(n + 1)*(2*n + 1)/6, (n*(n + 1)/2)^2))
    Sm: if(pw == 1, mm*(mm + 1)/2, if(pw == 2, mm*(mm + 1)*(2*mm + 1)/6, (mm*(mm + 1)/2)^2))
    S: Sn - Sm
  prompt: 'Evaluate $\displaystyle\sum_{k={m}}^{{n}} k^{{pw}}$.'
  answers:
    - {name: S, label: 'Sum', tolerance: 0}
  solution: |-
    Take the sum from 1 to {n} and subtract the sum from 1 to {mm} (not to {m}, because the $k = {m}$ term must stay in).
    With the formula for $\sum k^{{pw}}$: the sum to {n} is ${Sn:dp0}$ and the sum to {mm} is ${Sm:dp0}$.
    So the sum is ${Sn:dp0} - {Sm:dp0} =$ **{S}**.

- id: a2-m7-r2-fixed-point
  title: Fixed point of a multiply-then-add recurrence
  topic: Recurrence relations
  vars:
    r: {choices: [0.2, 0.25, 0.4, 0.5, 0.6, 0.75, 0.8]}
    L: {min: 20, max: 400, step: 20}
    a1: {min: 0, max: 500, step: 10}
  where: ['a1 != L']
  calc:
    c: round(L*(1 - r), 6)
    dist: a1 - L
    a4: L + (a1 - L)*r^3
  prompt: 'A sequence has $a_1 = {a1}$ and $a_n = {r}\,a_{n-1} {c:signed}$. Find its fixed point $L$ and the term $a_4$ (to 2 decimal places if needed).'
  answers:
    - {name: L, label: '$L =$', tolerance: 0.001}
    - {name: a4, label: '$a_4 =$', tolerance: 0.006}
  solution: |-
    Solve $L = {r}L {c:signed}$: $L = \dfrac{{c}}{1 - {r}} =$ **{L}**.
    The distance from $L$ is multiplied by ${r}$ each step, so $a_n = L + (a_1 - L)r^{n-1}$ and $a_4 = {L} + ({dist})({r})^3 \approx$ **{a4:num2}**.

- id: a2-m7-r2-annuity-fv
  title: Future value of monthly deposits
  topic: Annuities and loans
  vars:
    P: {min: 50, max: 500, step: 25}
    apr: {choices: [3, 3.6, 4.2, 4.8, 5.4, 6, 7.2]}
    yrs: {min: 5, max: 40, step: 5}
  calc:
    mr: apr/1200
    n: 12*yrs
    FV: P*((1 + mr)^n - 1)/mr
    dep: P*n
  prompt: 'You deposit {P:money0} at the end of every month for {yrs} years into an account that pays {apr}% a year, compounded monthly. How much is in the account right after the last deposit? (Nearest dollar.)'
  answer: FV
  format: money0
  tolerance: 1
  solution: |-
    Monthly rate $i = \tfrac{{apr}\%}{12} = {mr:num4}$ and $n = 12 \cdot {yrs} = {n}$ deposits.
    $FV = P\cdot\dfrac{(1 + i)^n - 1}{i} = {P}\cdot\dfrac{(1 + {mr:num4})^{{n}} - 1}{{mr:num4}} \approx$ **{FV:money0}**. (You deposited {dep:money0}; the rest is interest.)

- id: a2-m7-r2-loan-payment
  title: Monthly loan payment and total interest
  topic: Annuities and loans
  vars:
    A0: {min: 5000, max: 40000, step: 1000}
    apr: {choices: [3, 3.6, 4.2, 4.8, 5.4, 6, 7.2]}
    yrs: {choices: [2, 3, 4, 5, 6]}
  calc:
    mr: apr/1200
    n: 12*yrs
    M: A0*mr/(1 - (1 + mr)^(-n))
    tot: n*M
    I: n*M - A0
  prompt: 'A loan of {A0:money0} at {apr}% a year, compounded monthly, is repaid in equal monthly payments over {yrs} years. Find the monthly payment (nearest cent) and the total interest paid (nearest dollar).'
  answers:
    - {name: M, label: 'Payment (dollars)', tolerance: 0.01}
    - {name: I, label: 'Total interest (dollars)', tolerance: 1}
  solution: |-
    $i = \tfrac{{apr}\%}{12} = {mr:num4}$ and $n = {n}$ payments.
    $M = \dfrac{A_0\,i}{1 - (1 + i)^{-n}} = \dfrac{{A0:dp0}({mr:num4})}{1 - (1 + {mr:num4})^{-{n}}} \approx {M:dp2}$, so the payment is **{M:money}**.
    Total paid: {n} payments of about {M:money}, which is about {tot:money} using the unrounded payment, so the interest is about **{I:money0}**.
