# Round 2 drills for a2-m5 (honors lessons 19h1 and 19h2)
- id: a2-m5-r2-slant
  title: Slant and vertical asymptotes
  topic: Slant asymptotes
  vars:
    a: {choices: [1, 2, 3, -1, -2]}
    b: {min: -8, max: 8}
    c: {min: -12, max: 12}
    d: {min: -5, max: 5}
  calc:
    k: b + a*d
    ad: a*d
    dk: d*k
    R: c + d*k
    nd: -d
  where: ['d != 0', 'b != 0', 'c != 0', 'k != 0', 'R != 0']
  prompt: 'Find the slant asymptote and the vertical asymptote of $f(x) = \dfrac{{a:coef}x^2 {b:signedcoef}x {c:signed}}{x {nd:signed}}$.'
  answers:
    - kind: expression
      expression: a*x + k
      variables: [x]
      label: 'Slant asymptote $y =$'
      show: '${a:coef}x {k:signed}$'
    - {name: d, label: 'Vertical asymptote $x =$'}
  solution: |-
    Divide by $x {nd:signed}$ with synthetic division, using {d} on the coefficients {a}, {b}, {c}. Bring down {a}. Then ${a} \cdot ({d}) = {ad}$ and ${b} + ({ad}) = {k}$. Then ${k} \cdot ({d}) = {dk}$ and ${c} + ({dk}) = {R}$.
    So $f(x) = {a:coef}x {k:signed} + \dfrac{{R}}{x {nd:signed}}$. The remainder piece fades as $|x|$ grows, so the slant asymptote is **$y = {a:coef}x {k:signed}$**.
    The remainder {R} is not 0, so the numerator isn't 0 at $x = {d}$ and nothing cancels: vertical asymptote **$x = {d}$**.

- id: a2-m5-r2-cross-ha
  title: Where a graph crosses its horizontal asymptote
  topic: Slant asymptotes
  vars:
    a: {choices: [1, 2, 3, -1, -2]}
    b: {min: -6, max: 6}
    e: {min: -6, max: 6}
    g: {min: -9, max: 9}
    xc: {min: -6, max: 6}
  calc:
    bm: b - a*e
    c: a*g - xc*bm
    cm: c - a*g
    den: xc^2 + e*xc + g
  where: ['b != 0', 'e != 0', 'g != 0', 'xc != 0', 'c != 0', 'bm != 0', 'den != 0', 'abs(c) <= 40']
  prompt: 'The graph of $f(x) = \dfrac{{a:coef}x^2 {b:signedcoef}x {c:signed}}{x^2 {e:signedcoef}x {g:signed}}$ crosses its horizontal asymptote once. Find the horizontal asymptote and the $x$-coordinate of the crossing.'
  answers:
    - {name: a, label: 'Horizontal asymptote $y =$'}
    - {name: xc, label: 'Crosses at $x =$'}
  solution: |-
    The degrees are equal, so the horizontal asymptote is the ratio of the leading coefficients: **$y = {a}$**.
    Set $f(x) = {a}$ and multiply by the denominator: ${a:coef}x^2 {b:signedcoef}x {c:signed} = {a:coef}(x^2 {e:signedcoef}x {g:signed})$.
    The $x^2$ terms cancel, leaving ${bm:coef}x {cm:signed} = 0$, so $x = {xc}$. The denominator there is {den}, not 0, so the graph really crosses the asymptote at **$x = {xc}$**.

- id: a2-m5-r2-avg-cost
  title: Least average cost
  topic: Average cost
  vars:
    p: {choices: [0.01, 0.02, 0.04, 0.05, 0.1, 0.25]}
    xm: {choices: [20, 30, 40, 50, 60, 80, 100, 120, 150, 200]}
    b: {min: 2, max: 15}
  calc:
    F: round(p*xm^2, 6)
    xs: xm^2
    tw: round(2*p*xm, 6)
    Amin: b + tw
  where: ['F == round(F)', 'F >= 100', 'F <= 5000']
  prompt: 'A shop''s weekly cost to make $x$ items is $C(x) = {p}x^2 + {b}x + {F:dp0}$ dollars. How many items give the least average cost per item, and what is that least average cost?'
  answers:
    - {name: xm, label: 'Number of items'}
    - {name: Amin, format: money, label: 'Least average cost per item'}
  solution: |-
    Average cost: $A(x) = \dfrac{C(x)}{x} = {p}x + {b} + \dfrac{{F:dp0}}{x}$.
    The product of ${p}x$ and $\dfrac{{F:dp0}}{x}$ is ${p} \cdot {F:dp0}$, a constant, so by the AM–GM inequality ${p}x + \dfrac{{F:dp0}}{x} \ge 2\sqrt{{p} \cdot {F:dp0}} = {tw}$.
    Equality holds when ${p}x = \dfrac{{F:dp0}}{x}$, so $x^2 = {xs:dp0}$ and the best level is **{xm}** items.
    The least average cost is ${b} + {tw}$, or **{Amin:money}** per item.

- id: a2-m5-r2-partial
  title: Partial fractions with two linear factors
  topic: Partial fractions
  vars:
    aa: {min: -6, max: 6}
    bb: {min: -6, max: 6}
    r: {min: -6, max: 6}
    s: {min: -6, max: 6}
  calc:
    p: aa + bb
    q: -(aa*s + bb*r)
    nr: -r
    ns: -s
    numA: p*r + q
    numB: p*s + q
    rs: r - s
    sr: s - r
  where: ['aa != 0', 'bb != 0', 'r != 0', 's != 0', 'r != s', 'p != 0', 'q != 0']
  prompt: 'Find $A$ and $B$ so that $\dfrac{{p:coef}x {q:signed}}{(x {nr:signed})(x {ns:signed})} = \dfrac{A}{x {nr:signed}} + \dfrac{B}{x {ns:signed}}$.'
  answers:
    - {name: aa, label: '$A =$'}
    - {name: bb, label: '$B =$'}
  solution: |-
    Cover up $(x {nr:signed})$ and put $x = {r}$ into what is left: $A = \dfrac{{p:coef}({r}) {q:signed}}{{r} {ns:signed}} = \dfrac{{numA}}{{rs}} =$ **{aa}**.
    Cover up $(x {ns:signed})$ and put $x = {s}$: $B = \dfrac{{p:coef}({s}) {q:signed}}{{s} {nr:signed}} = \dfrac{{numB}}{{sr}} =$ **{bb}**.
    Check by recombining: ${aa:coef}(x {ns:signed}) {bb:signedcoef}(x {nr:signed}) = {p:coef}x {q:signed}$.

- id: a2-m5-r2-telescope
  title: Telescoping sum
  topic: Partial fractions
  vars:
    d: {choices: [1, 2]}
    n: {min: 5, max: 40}
  calc:
    first: if(d == 1, 1, 1.5)
    last: if(d == 1, 1/(n + 1), 1/(n + 1) + 1/(n + 2))
    S: first - last
    nd: n + d
    n1: n + 1
  prompt: 'Find the exact value of $\displaystyle\sum_{k=1}^{{n}} \frac{{d}}{k(k + {d})}$ as a fraction in lowest terms.'
  answers:
    - {name: S, kind: fraction, lowestTerms: true, label: 'Sum'}
  solution: |-
    By partial fractions, $\dfrac{{d}}{k(k + {d})} = \dfrac{1}{k} - \dfrac{1}{k + {d}}$.
    In the sum, each negative piece $-\dfrac{1}{k + {d}}$ cancels the positive piece of the term {d} place(s) later. The positive pieces that survive are the first {d} ($\tfrac1k$ for $k = 1$ to {d}), which add to ${first:texfrac}$. The negative pieces that survive are the last {d} ($\tfrac1j$ for $j = {n1}$ to {nd}), which add to ${last:texfrac}$.
    The sum is ${first:texfrac} - {last:texfrac} =$ **${S:texfrac}$**.
