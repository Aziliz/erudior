# Round 2, module a2-m1 (honors lessons)
- term: even function
  aliases: [even functions]
  definition: 'A function with $f(-x) = f(x)$ for every $x$ in its (symmetric) domain. Its graph is symmetric about the $y$-axis. Example: $x^2$.'
  topic: Symmetry
- term: odd function
  aliases: [odd functions]
  definition: 'A function with $f(-x) = -f(x)$ for every $x$ in its (symmetric) domain. Its graph is symmetric about the origin. Example: $x^3$.'
  topic: Symmetry
- term: symmetric about the origin
  aliases: [origin symmetry, symmetry about the origin]
  definition: 'A graph is symmetric about the origin if whenever $(a, b)$ is on it, so is $(-a, -b)$; a half turn about the origin leaves it unchanged.'
  topic: Symmetry
- term: even part
  definition: 'For a function $f$ on a symmetric domain, the even function $E(x) = \tfrac12\big(f(x) + f(-x)\big)$. Together with the odd part it adds up to $f$.'
  topic: Symmetry
- term: odd part
  definition: 'For a function $f$ on a symmetric domain, the odd function $O(x) = \tfrac12\big(f(x) - f(-x)\big)$. Together with the even part it adds up to $f$.'
  topic: Symmetry
- term: strictly increasing
  definition: 'A function is strictly increasing on an interval if $a < b$ always gives $f(a) < f(b)$ there: larger inputs give larger outputs.'
  topic: Monotonic functions
- term: strictly decreasing
  definition: 'A function is strictly decreasing on an interval if $a < b$ always gives $f(a) > f(b)$ there: larger inputs give smaller outputs.'
  topic: Monotonic functions
- term: monotonic
  aliases: [monotonic function, monotonic functions, monotone]
  definition: 'Strictly increasing or strictly decreasing on an interval. A function that is monotonic on its domain is one-to-one, so it has an inverse.'
  topic: Monotonic functions
- term: self-inverse
  aliases: [self-inverse function, involution]
  definition: 'A function that is its own inverse: $f(f(x)) = x$ for every $x$ in its domain. Its graph is symmetric about $y = x$. Examples: $-x$, $c - x$, $\tfrac1x$.'
  topic: Inverse functions
