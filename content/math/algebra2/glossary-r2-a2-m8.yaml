# Round 2, module a2-m8: terms bolded in the honors lessons and the new core figures
- term: Venn diagram
  aliases: [Venn diagrams]
  definition: 'A picture of events as overlapping circles inside a rectangle that stands for the whole sample space; the overlap holds the outcomes in both events.'
  topic: Probability rules
- term: random variable
  aliases: [random variables, discrete random variable]
  definition: 'A quantity whose numerical value is determined by the outcome of a chance experiment, such as the sum of two dice or the amount won in a game.'
  topic: Expected value
- term: probability distribution
  aliases: [probability distributions]
  definition: 'A list or table of every value a random variable can take together with its probability; the probabilities are between 0 and 1 and add to 1.'
  topic: Expected value
- term: expected value
  aliases: [expected values, expectation]
  definition: 'The probability-weighted average of a random variable, $E(X) = \sum x\,P(X = x)$; the long-run average result per trial.'
  topic: Expected value
- term: law of large numbers
  definition: 'As the number of independent trials grows, the average result gets closer and closer to the expected value (it still wanders, but less and less). It says nothing about any single trial.'
  topic: Expected value
- term: fair game
  aliases: [fair games]
  definition: 'A game whose expected net gain is 0, so that in the long run neither the player nor the house gains.'
  topic: Expected value
- term: fair price
  definition: 'The price to play a game that makes it fair: the expected value of the prize.'
  topic: Expected value
- term: Bernoulli trial
  aliases: [Bernoulli trials]
  definition: 'A chance experiment with exactly two outcomes, called success and failure.'
  topic: Binomial distribution
- term: binomial setting
  definition: 'A fixed number $n$ of independent trials, each with two outcomes and the same probability of success $p$ (remembered as BINS).'
  topic: Binomial distribution
- term: binomial distribution
  aliases: [binomial distributions, binomial random variable]
  definition: 'The distribution of the number of successes in a binomial setting with $n$ trials and success probability $p$; its mean is $np$ and its standard deviation is $\sqrt{np(1 - p)}$.'
  topic: Binomial distribution
- term: binomial probability formula
  definition: 'For a binomial random variable, $P(X = k) = {}_nC_k\,p^k(1 - p)^{n - k}$: the number of orders times the probability of one order.'
  topic: Binomial distribution
- term: normal approximation to the binomial
  aliases: [normal approximation]
  definition: 'Using a normal curve with mean $np$ and standard deviation $\sqrt{np(1 - p)}$ for a binomial distribution; a common rule of thumb asks for $np \ge 10$ and $n(1 - p) \ge 10$.'
  topic: Binomial distribution
- term: law of total probability
  definition: 'If events $A_1, A_2, \ldots$ are mutually exclusive and cover every possibility, then $P(D) = \sum P(A_i)\,P(D \mid A_i)$: add the probabilities of all paths leading to $D$.'
  topic: Bayes' theorem
- term: Bayes' theorem
  aliases: ['Bayes’ theorem', "Bayes' rule", 'Bayes’ rule']
  definition: '$P(A \mid D) = \dfrac{P(A)\,P(D \mid A)}{P(D)}$; it turns a conditional probability around, giving the probability of a cause once the evidence is known.'
  topic: Bayes' theorem
- term: sensitivity
  definition: 'For a test, $P(\text{positive} \mid \text{disease})$: the fraction of people with the condition whom the test correctly flags.'
  topic: Bayes' theorem
- term: specificity
  definition: 'For a test, $P(\text{negative} \mid \text{no disease})$: the fraction of people without the condition whom the test correctly clears. The false positive rate is $1 - \text{specificity}$.'
  topic: Bayes' theorem
- term: true positive
  aliases: [true positives]
  definition: 'A positive test result for someone who does have the condition.'
  topic: Bayes' theorem
- term: false positive
  aliases: [false positives]
  definition: 'A positive test result for someone who does not have the condition.'
  topic: Bayes' theorem
- term: false negative
  aliases: [false negatives]
  definition: 'A negative test result for someone who does have the condition.'
  topic: Bayes' theorem
- term: prevalence
  aliases: [base rate]
  definition: 'The fraction of a population that has a condition; in a Bayes calculation it is the prior probability before any test.'
  topic: Bayes' theorem
- term: natural frequencies
  aliases: [natural frequency]
  definition: 'Counts in an imagined group (such as 10,000 people) used in place of probabilities, which make Bayes calculations easier to follow.'
  topic: Bayes' theorem
- term: prior probability
  aliases: [prior probabilities, prior]
  definition: 'The probability of an event before a new piece of evidence is taken into account.'
  topic: Bayes' theorem
- term: posterior probability
  aliases: [posterior probabilities, posterior]
  definition: 'The updated probability of an event after the evidence is taken into account, found with Bayes'' theorem.'
  topic: Bayes' theorem
- term: base rate fallacy
  aliases: [base-rate fallacy]
  definition: 'Ignoring how common a condition is (its base rate) when judging evidence, for example treating a test''s sensitivity as the chance that a positive result is correct.'
  topic: Bayes' theorem
