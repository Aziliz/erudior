# Round 2 glossary for a2-m9 honors lessons
- term: secant
  aliases: [sec, secant function]
  definition: 'The reciprocal of cosine: $\sec\theta = \dfrac{1}{\cos\theta}$. It is undefined where $\cos\theta = 0$, and its values are never strictly between $-1$ and $1$.'
  topic: Tangent and reciprocal functions
- term: cosecant
  aliases: [csc, cosecant function]
  definition: 'The reciprocal of sine: $\csc\theta = \dfrac{1}{\sin\theta}$. It is undefined where $\sin\theta = 0$, and its values are never strictly between $-1$ and $1$.'
  topic: Tangent and reciprocal functions
- term: cotangent
  aliases: [cot, cotangent function]
  definition: 'The reciprocal of tangent: $\cot\theta = \dfrac{\cos\theta}{\sin\theta}$. It is undefined where $\sin\theta = 0$ and has period $\pi$.'
  topic: Tangent and reciprocal functions
- term: angle of inclination
  aliases: [angles of inclination, inclination]
  definition: 'The angle $\alpha$ from the positive $x$-direction up to a line, with $0^\circ \le \alpha < 180^\circ$. The slope of the line is $m = \tan\alpha$.'
  topic: Tangent and reciprocal functions
- term: inverse sine
  aliases: [arcsin, arcsine, sin⁻¹]
  definition: 'The function $\arcsin x$ (also written $\sin^{-1} x$): the angle in $\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ whose sine is $x$, defined for $-1 \le x \le 1$. Not the reciprocal $\tfrac{1}{\sin x}$.'
  topic: Inverse trig and equations
- term: inverse cosine
  aliases: [arccos, arccosine, cos⁻¹]
  definition: 'The function $\arccos x$ (also written $\cos^{-1} x$): the angle in $[0, \pi]$ whose cosine is $x$, defined for $-1 \le x \le 1$.'
  topic: Inverse trig and equations
- term: inverse tangent
  aliases: [arctan, arctangent, tan⁻¹]
  definition: 'The function $\arctan x$ (also written $\tan^{-1} x$): the angle strictly between $-\tfrac{\pi}{2}$ and $\tfrac{\pi}{2}$ whose tangent is $x$, defined for every real $x$.'
  topic: Inverse trig and equations
- term: principal value
  aliases: [principal values]
  definition: 'The one value an inverse trig function picks out of the infinitely many angles with a given sine, cosine or tangent: the one in its restricted range ($\left[-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right]$ for arcsin, $[0, \pi]$ for arccos, $\left(-\tfrac{\pi}{2}, \tfrac{\pi}{2}\right)$ for arctan).'
  topic: Inverse trig and equations
