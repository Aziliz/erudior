# Round 2 cards for a2-m7 (honors lessons 24h1 and 24h2)
- {front: 'Constant first differences mean…', back: 'An arithmetic sequence (a linear formula $a_n = a_1 + (n - 1)d$).', topic: Finite differences}
- {front: 'Constant second differences mean…', back: 'A quadratic formula $An^2 + Bn + C$, with $A$ = half the second difference.', topic: Finite differences}
- {front: 'Constant $m$th differences', back: 'A polynomial of degree $m$; the $m$th difference equals $m! \cdot A$ (cubic: $6A$).', topic: Finite differences}
- {front: 'Finding a quadratic formula from a table', back: 'Take $A$ = half the second difference, subtract $An^2$ from each term, and read off the linear part $Bn + C$.', topic: Finite differences}
- {front: 'Do a few terms prove a pattern?', back: 'No. Points on a circle give $1, 2, 4, 8, 16$ regions, then 31. A formula from a table is a conjecture until proved.', topic: Finite differences}
- {front: 'Sigma rules', back: '$\sum(a_k + b_k) = \sum a_k + \sum b_k$, $\sum ca_k = c\sum a_k$, $\sum_{k=1}^{n} c = nc$. Products do not split.', topic: Sums of powers}
- {front: '$1^2 + 2^2 + \cdots + n^2$', back: '$\dfrac{n(n + 1)(2n + 1)}{6}$', topic: Sums of powers}
- {front: '$1^3 + 2^3 + \cdots + n^3$', back: '$\left(\dfrac{n(n + 1)}{2}\right)^2$, the square of $1 + 2 + \cdots + n$.', topic: Sums of powers}
- {front: '$\sum_{k=1}^{n} \dfrac{1}{k(k + 1)}$', back: '$\dfrac{n}{n + 1}$, by telescoping: $\dfrac{1}{k(k + 1)} = \dfrac1k - \dfrac{1}{k + 1}$.', topic: Sums of powers}
- {front: '$\sum_{k=m}^{n} a_k$ from partial sums', back: '$S_n - S_{m-1}$ (subtract the sum up to $m - 1$, not up to $m$).', topic: Sums of powers}
- {front: 'Fixed point of $a_n = ra_{n-1} + c$', back: '$L = \dfrac{c}{1 - r}$ ($r \ne 1$), from solving $L = rL + c$.', topic: Recurrence relations}
- {front: 'Explicit formula for $a_n = ra_{n-1} + c$', back: '$a_n = L + (a_1 - L)r^{n-1}$: the distance from the fixed point is geometric.', topic: Recurrence relations}
- {front: 'When does $a_n = ra_{n-1} + c$ settle down?', back: 'When $|r| < 1$: the terms approach $L$ from any start. If $|r| > 1$ they move away from $L$.', topic: Recurrence relations}
- {front: 'Future value of an annuity', back: '$FV = P\cdot\dfrac{(1 + i)^n - 1}{i}$ for $n$ end-of-period deposits of $P$ at rate $i$ per period.', topic: Annuities and loans}
- {front: 'Loan payment formula', back: '$M = \dfrac{A_0\,i}{1 - (1 + i)^{-n}}$ for a loan of $A_0$, rate $i$ per period, $n$ payments.', topic: Annuities and loans}
- {front: 'Loan balance after $k$ payments', back: '$B_k = A_0(1 + i)^k - M\cdot\dfrac{(1 + i)^k - 1}{i}$', topic: Annuities and loans}
- {front: 'Monthly rate and number of payments', back: '$i = \dfrac{\text{yearly rate}}{12}$, $n = 12 \times$ years.', topic: Annuities and loans}
- {front: 'Why loan balances fall slowly at first', back: 'Early payments go mostly to interest on the large balance; the principal share grows each month.', topic: Annuities and loans}
- {front: 'Steady state of a daily dose $D$ with fraction $f$ remaining', back: 'Just after a dose: $L = \dfrac{D}{1 - f}$ (simplified model).', topic: Recurrence relations}
