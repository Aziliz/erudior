id: math-algebra2
title: Algebra 2
description: >-
  High school Algebra 2: function transformations, composition and inverses, complex numbers, systems in three variables, polynomial functions, radicals and rational exponents, rational expressions and functions, exponentials and logarithms, sequences and series, probability and the normal distribution, and an introduction to the unit circle and trig graphs. Every lesson teaches with worked examples and graphs, and every skill has generated practice problems.
