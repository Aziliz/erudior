id: math-algebra2
title: Algebra 2
description: >-
  High school Algebra 2: function transformations, composition and inverses, complex numbers, nonlinear systems, systems in three variables and matrices, polynomial functions, radicals and rational exponents, rational expressions and functions, polynomial and rational inequalities, exponentials and logarithms, sequences and series, counting and the binomial theorem, probability and the normal distribution, and an introduction to the unit circle and trig graphs. Every lesson teaches with worked examples and graphs, and every skill has generated practice problems.
revision: 4
released: true
changelog: Honors lessons for every module, pictures and diagrams in every lesson, and new question types (fill in the blank, matching, labeling, ordering); corrections from a second full review of every lesson, question and drill; clearer graphs; answers shown at the precision each problem asks for.
