# Round 2 cards for module a2-m4
- {front: 'Rational vs irrational number', back: 'Rational: a fraction of integers (decimal ends or repeats). Irrational: a real number that is not rational (decimal never ends or repeats).', topic: Irrational numbers}
- {front: 'Proof by contradiction', back: 'Assume the opposite, reason to something impossible, conclude the assumption was false.', topic: Irrational numbers}
- {front: 'Key step in the proof that $\sqrt2$ is irrational', back: '$a^2 = 2b^2$ makes $a$ even, then $b$ even, so $\tfrac ab$ was not in lowest terms.', topic: Irrational numbers}
- {front: 'If $a^2$ is even, then …', back: '$a$ is even (an odd number squared is odd).', topic: Irrational numbers}
- {front: 'When is $\sqrt[n]{k}$ rational ($k$ a positive integer)?', back: 'Exactly when $k$ is a perfect $n$th power; otherwise it is irrational (rational root theorem on $x^n - k = 0$).', topic: Irrational numbers}
- {front: 'Is $\sqrt2 + \sqrt3$ rational?', back: 'No. If it were $r$, then $\sqrt6 = \tfrac{r^2 - 5}{2}$ would be rational.', topic: Irrational numbers}
- {front: 'Heron''s method for $\sqrt n$', back: '$x \to \tfrac12\left(x + \tfrac{n}{x}\right)$: average the sides of a rectangle of area $n$.', topic: Approximating roots}
- {front: 'Error after one Heron step', back: '$\dfrac{e^2}{2x}$, where $e$ is the current error: correct digits roughly double.', topic: Approximating roots}
- {front: 'Iteration for $\sqrt[3]{n}$', back: '$x \to \tfrac13\left(2x + \tfrac{n}{x^2}\right)$: average the sides $x$, $x$, $\tfrac{n}{x^2}$ of a box of volume $n$.', topic: Approximating roots}
- {front: 'YBC 7289', back: 'An Old Babylonian tablet (about 1800–1600 BCE) with $\sqrt2 \approx 1.41421296$, within a millionth.', topic: Approximating roots}
- {front: 'Domain of $x^{m/n}$ ($\tfrac mn$ in lowest terms)', back: 'Even $n$: $x \ge 0$. Odd $n$: all real $x$. A negative exponent also excludes $x = 0$.', topic: Power functions}
- {front: '$(x^2)^{1/2}$', back: '$|x|$, not $x$.', topic: Power functions}
- {front: '$(-8)^{1/3}$ vs $(-8)^{2/6}$', back: 'Reduce first: both are $-2$. Squaring first gives $64^{1/6} = 2$, so negative bases need lowest-terms exponents.', topic: Power functions}
- {front: 'Comparing $x^p$ for $0 < x < 1$', back: 'A larger exponent gives a smaller value: $0.25^{1/2} = 0.5$, $0.25^{3/2} = 0.125$.', topic: Power functions}
- {front: 'Scaling a power law $y = kx^p$', back: 'Multiplying $x$ by $c$ multiplies $y$ by $c^p$.', topic: Power laws}
- {front: 'Kepler''s third law', back: '$T = a^{3/2}$ ($T$ in years, $a$ in AU), so $a = T^{2/3}$.', topic: Power laws}
- {front: 'Square–cube law', back: 'Scale lengths by $c$: areas $\times c^2$, volumes $\times c^3$; so $A \propto V^{2/3}$.', topic: Power laws}
- {front: 'Kleiber''s law', back: 'Resting metabolic rate $\approx kM^{3/4}$ (empirical; exponent debated). 16 times the mass: about 8 times the energy.', topic: Power laws}
- {front: 'Find $p$ when $x \times 4$ gives $y \times 8$', back: '$4^p = 8$, so $2^{2p} = 2^3$ and $p = \tfrac32$.', topic: Power laws}
