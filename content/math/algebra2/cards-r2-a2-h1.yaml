# Notecards for honors module a2-h1 (Toward precalculus and beyond), round 2
# Lesson 90: conic sections
- {front: 'The four conic sections', back: 'Circle, ellipse, parabola, hyperbola: the curves where a plane cuts a double cone (level, tilted, parallel to a side, steep enough to cut both halves).', topic: Conic sections}
- {front: 'Parabola: definition', back: 'Points equally far from a focus and a directrix.', topic: Conic sections}
- {front: 'Focus and directrix of $x^2 = 4py$', back: 'Focus $(0, p)$, directrix $y = -p$; opens up if $p > 0$, down if $p < 0$.', topic: Conic sections}
- {front: 'Focus of $y = ax^2$', back: '$(0, \tfrac{1}{4a})$, since $p = \tfrac{1}{4a}$.', topic: Conic sections}
- {front: 'Ellipse: definition', back: 'Points whose distances to two foci add to a constant $2a$.', topic: Conic sections}
- {front: 'Ellipse $\tfrac{x^2}{a^2} + \tfrac{y^2}{b^2} = 1$ ($a > b$)', back: 'Vertices $(\pm a, 0)$, co-vertices $(0, \pm b)$, foci $(\pm c, 0)$ with $c^2 = a^2 - b^2$.', topic: Conic sections}
- {front: 'Hyperbola: definition', back: 'Points where the difference of the distances to two foci is a constant $2a$.', topic: Conic sections}
- {front: 'Hyperbola $\tfrac{x^2}{a^2} - \tfrac{y^2}{b^2} = 1$', back: 'Vertices $(\pm a, 0)$, foci $(\pm c, 0)$ with $c^2 = a^2 + b^2$, asymptotes $y = \pm\tfrac{b}{a}x$.', topic: Conic sections}
- {front: 'Eccentricity', back: '$e = \tfrac{c}{a}$. Circle 0, ellipse between 0 and 1, parabola 1, hyperbola more than 1.', topic: Conic sections}
- {front: 'Identify $Ax^2 + Cy^2 + Dx + Ey + F = 0$', back: '$A = C$: circle. Same sign, $A \ne C$: ellipse. Opposite signs: hyperbola. Only one variable squared: parabola. (Check for degenerate cases.)', topic: Conic sections}
- {front: 'Ellipse vs hyperbola: which $c$ relation?', back: 'Ellipse $c^2 = a^2 - b^2$ (foci inside, $c < a$); hyperbola $c^2 = a^2 + b^2$ (foci outside the vertices, $c > a$).', topic: Conic sections}
# Lesson 91: parametric equations
- {front: 'Parametric equations', back: '$x = f(t)$, $y = g(t)$: a point''s position given by a third variable, the parameter $t$.', topic: Parametric equations}
- {front: 'Orientation of a parametric curve', back: 'The direction the point moves as $t$ increases; check two or three $t$-values.', topic: Parametric equations}
- {front: 'Eliminating the parameter', back: 'Solve one equation for $t$ and substitute, or use $\cos^2 t + \sin^2 t = 1$. Then check which $x$ and $y$ are actually reached.', topic: Parametric equations}
- {front: 'Circle with center $(h, k)$, radius $r$, parametrically', back: '$x = h + r\cos t$, $y = k + r\sin t$, $0 \le t \le 2\pi$ (counterclockwise).', topic: Parametric equations}
- {front: 'Ellipse $\tfrac{x^2}{a^2} + \tfrac{y^2}{b^2} = 1$ parametrically', back: '$x = a\cos t$, $y = b\sin t$.', topic: Parametric equations}
- {front: 'Segment from $(x_1, y_1)$ to $(x_2, y_2)$', back: '$x = x_1 + (x_2 - x_1)t$, $y = y_1 + (y_2 - y_1)t$, $0 \le t \le 1$.', topic: Parametric equations}
- {front: 'Projectile motion (feet, no air resistance)', back: '$x = (v_0\cos\theta)t$, $y = h_0 + (v_0\sin\theta)t - 16t^2$. In meters use $4.9t^2$.', topic: Parametric equations}
- {front: '$x = t^2$, $y = t^2 + 1$', back: 'Only the ray of $y = x + 1$ with $x \ge 0$, since $t^2 \ge 0$.', topic: Parametric equations}
- {front: 'Cycloid', back: 'Path of a point on a rolling wheel: $x = t - \sin t$, $y = 1 - \cos t$ for radius 1.', topic: Parametric equations}
# Lesson 92: complex numbers in polar form
- {front: 'Modulus of $a + bi$', back: '$|a + bi| = \sqrt{a^2 + b^2}$, the distance from 0.', topic: Polar form of complex numbers}
- {front: 'Argument of $a + bi$', back: 'The angle from the positive real axis. Use the reference angle $\tan^{-1}\left|\tfrac ba\right|$ and the quadrant of $(a, b)$; a calculator''s $\tan^{-1}$ is off by $180^\circ$ when $a < 0$.', topic: Polar form of complex numbers}
- {front: 'Polar form', back: '$z = r(\cos\theta + i\sin\theta) = r\,\text{cis}\,\theta$, with $a = r\cos\theta$, $b = r\sin\theta$.', topic: Polar form of complex numbers}
- {front: 'Multiplying in polar form', back: '$(r_1\,\text{cis}\,\alpha)(r_2\,\text{cis}\,\beta) = r_1 r_2\,\text{cis}(\alpha + \beta)$: multiply moduli, add arguments.', topic: Polar form of complex numbers}
- {front: 'Dividing in polar form', back: '$\dfrac{r_1\,\text{cis}\,\alpha}{r_2\,\text{cis}\,\beta} = \dfrac{r_1}{r_2}\,\text{cis}(\alpha - \beta)$.', topic: Polar form of complex numbers}
- {front: 'Multiplying by $i$', back: 'A $90^\circ$ counterclockwise rotation about 0, since $i = 1\,\text{cis}\,90^\circ$.', topic: Polar form of complex numbers}
- {front: 'De Moivre''s theorem', back: '$(r\,\text{cis}\,\theta)^n = r^n\,\text{cis}(n\theta)$ for positive integers $n$.', topic: Powers and roots of complex numbers}
- {front: '$(1 + i)^8$', back: '$(\sqrt2)^8\,\text{cis}\,360^\circ = 16$.', topic: Powers and roots of complex numbers}
- {front: 'The $n$th roots of $R\,\text{cis}\,\varphi$', back: '$\sqrt[n]{R}\,\text{cis}\dfrac{\varphi + 360^\circ k}{n}$, $k = 0, 1, \dots, n - 1$: $n$ roots, $\tfrac{360^\circ}{n}$ apart.', topic: Powers and roots of complex numbers}
- {front: 'Cube roots of 8', back: '$2$, $-1 + \sqrt3\,i$, $-1 - \sqrt3\,i$ (an equilateral triangle on the circle of radius 2).', topic: Powers and roots of complex numbers}
- {front: 'Euler''s formula (preview)', back: '$e^{i\theta} = \cos\theta + i\sin\theta$ ($\theta$ in radians); so $e^{i\pi} = -1$.', topic: Powers and roots of complex numbers}
# Lesson 93: rates of change
- {front: 'Average rate of change of $f$ on $[a, b]$', back: '$\dfrac{f(b) - f(a)}{b - a}$: the slope of the secant line; units of output per unit of input.', topic: Average rate of change}
- {front: 'Rates over equal steps: linear, quadratic, exponential', back: 'Linear: constant. Quadratic: change by a constant amount. Exponential: multiplied by a constant factor.', topic: Average rate of change}
- {front: 'Average velocity of $h(t) = 64t - 16t^2$ on $[0, 4]$', back: '0 ft/s: the ball went up and came back, so the net change is 0.', topic: Average rate of change}
- {front: 'Difference quotient', back: '$\dfrac{f(x + h) - f(x)}{h}$, $h \ne 0$: the slope of the secant through $(x, f(x))$ and $(x + h, f(x + h))$.', topic: Difference quotients}
- {front: 'Difference quotient of $x^2$', back: '$2x + h$; it approaches $2x$ as $h \to 0$.', topic: Difference quotients}
- {front: 'Difference quotient of $\tfrac1x$', back: '$-\dfrac{1}{x(x + h)}$; it approaches $-\dfrac{1}{x^2}$.', topic: Difference quotients}
- {front: 'Difference quotient of $\sqrt x$', back: 'Multiply by the conjugate: $\dfrac{1}{\sqrt{x + h} + \sqrt x}$; it approaches $\dfrac{1}{2\sqrt x}$.', topic: Difference quotients}
- {front: 'Why simplify before letting $h \to 0$?', back: 'Putting $h = 0$ into the unsimplified quotient gives $\tfrac00$, which is undefined.', topic: Difference quotients}
- {front: 'Instantaneous rate of change', back: 'What the simplified difference quotient approaches as $h$ shrinks to 0: the slope of the tangent line, called the derivative $f''(x)$.', topic: Difference quotients}
- {front: 'Tangent line to $y = x^2$ at $(3, 9)$', back: 'Slope $2 \cdot 3 = 6$: $y = 6x - 9$.', topic: Difference quotients}
