# Round 2 cards for the a2-m2 honors lessons
- {front: 'Modulus of $a + bi$', back: '$|a + bi| = \sqrt{a^2 + b^2}$, the distance from 0 in the complex plane', topic: Complex plane geometry}
- {front: 'Distance between complex numbers $z$ and $w$', back: '$|z - w|$, the modulus of their difference (the distance formula in disguise)', topic: Complex plane geometry}
- {front: '$z\bar z$', back: '$|z|^2 = a^2 + b^2$ for $z = a + bi$, a nonnegative real number', topic: Complex plane geometry}
- {front: 'Reciprocal of a nonzero complex number $z$', back: '$\dfrac1z = \dfrac{\bar z}{|z|^2}$', topic: Complex plane geometry}
- {front: 'Geometric meaning of adding complex numbers', back: 'Arrows add head to tail: $0$, $z$, $w$ and $z + w$ form a parallelogram', topic: Complex plane geometry}
- {front: 'Triangle inequality', back: '$|z + w| \le |z| + |w|$, with equality only when $z$ and $w$ point the same way (or one is 0)', topic: Complex plane geometry}
- {front: 'Multiplying by $i$ (geometrically)', back: 'Rotates every point $90°$ counterclockwise about 0: $(a, b) \to (-b, a)$', topic: Complex plane geometry}
- {front: 'Taking the conjugate (geometrically)', back: 'Reflects the point across the real axis; $|\bar z| = |z|$', topic: Complex plane geometry}
- {front: 'Modulus of a product', back: '$|zw| = |z|\,|w|$ (moduli multiply, but they do not add)', topic: Complex plane geometry}
- {front: 'Brahmagupta–Fibonacci identity', back: '$(a^2 + b^2)(c^2 + d^2) = (ac - bd)^2 + (ad + bc)^2$', topic: Complex plane geometry}
- {front: 'Square roots of $p + qi$', back: '$\pm(x + yi)$ with $x^2 - y^2 = p$, $x^2 + y^2 = \sqrt{p^2 + q^2}$, and $xy$ having the sign of $q$', topic: Complex plane geometry}
- {front: 'When do non-real roots of a quadratic come in conjugate pairs?', back: 'When all the coefficients are real. With a non-real coefficient they need not.', topic: Complex plane geometry}
- {front: 'Adding or subtracting matrices', back: 'Entry by entry; the matrices must have the same dimensions', topic: Matrix operations}
- {front: 'Scalar multiplication $kA$', back: 'Multiply every entry of $A$ by $k$', topic: Matrix operations}
- {front: 'Entry $(i, j)$ of $AB$', back: 'Row $i$ of $A$ times column $j$ of $B$: multiply matching entries and add', topic: Matrix operations}
- {front: 'Dimensions of a product', back: '$(m \times n)(n \times p) = m \times p$; the inner dimensions must match', topic: Matrix operations}
- {front: 'Is matrix multiplication commutative?', back: 'No: usually $AB \ne BA$, and one order may not even be defined. It is associative: $(AB)C = A(BC)$.', topic: Matrix operations}
- {front: 'Inverse of a product $(AB)^{-1}$', back: '$B^{-1}A^{-1}$ (reverse the order)', topic: Matrix operations}
- {front: 'Finding $A^{-1}$ by row reduction', back: 'Row-reduce $[\,A \mid I\,]$ to $[\,I \mid A^{-1}\,]$', topic: Matrix operations}
- {front: 'Singular matrix', back: 'A square matrix with no inverse (determinant 0); row-reducing $[\,A \mid I\,]$ gives a zero row on the left', topic: Matrix operations}
- {front: 'Why use $A^{-1}$ to solve $AX = B$?', back: 'Once $A^{-1}$ is known, every new right side $B$ is solved by one multiplication, $X = A^{-1}B$', topic: Matrix operations}
- {front: 'Cramer''s rule (2 × 2)', back: '$x = \dfrac{D_x}{D}$, $y = \dfrac{D_y}{D}$, where $D_x$ and $D_y$ replace the $x$- or $y$-column of the coefficient matrix by the constants; needs $D \ne 0$', topic: Determinants and Cramer's rule}
- {front: 'Where $ad - bc$ comes from', back: 'Eliminating a variable from $ax + by = e$, $cx + dy = f$ gives $(ad - bc)x = ed - bf$', topic: Determinants and Cramer's rule}
- {front: 'Determinant as area', back: '$|ad - bc|$ is the area of the parallelogram spanned by the columns $(a, c)$ and $(b, d)$', topic: Determinants and Cramer's rule}
- {front: 'Cramer''s rule gives $D = 0$. What then?', back: 'There is no unique solution: either none or infinitely many. Use row reduction to decide.', topic: Determinants and Cramer's rule}
- {front: 'Minor and cofactor of an entry', back: 'Minor: the determinant left after deleting the entry''s row and column. Cofactor: the minor with its checkerboard sign.', topic: Determinants and Cramer's rule}
- {front: '$3 \times 3$ determinant along row 1', back: '$a_1(b_2c_3 - c_2b_3) - b_1(a_2c_3 - c_2a_3) + c_1(a_2b_3 - b_2a_3)$', topic: Determinants and Cramer's rule}
- {front: 'Rule of Sarrus', back: 'Diagonal shortcut for $3 \times 3$ determinants only: three products down to the right minus three products up to the right', topic: Determinants and Cramer's rule}
- {front: 'Area of a triangle from its vertices', back: '$\tfrac12\left|\det\begin{bmatrix} x_1 & y_1 & 1 \\ x_2 & y_2 & 1 \\ x_3 & y_3 & 1 \end{bmatrix}\right|$; a zero determinant means the points are collinear', topic: Determinants and Cramer's rule}
- {front: 'Cramer''s rule or elimination for a big system?', back: 'Elimination: cofactor expansion takes on the order of $n!$ steps, elimination about $\tfrac13 n^3$', topic: Determinants and Cramer's rule}
