name: Admin Studio isolated acceptance
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'worker/**', 'scripts/admin-studio-browser.mjs', 'tests/admin-studio*', 'package*.json', '.github/workflows/admin-studio.yml']
  push:
    branches: [main]
    paths: ['src/**', 'worker/**', 'scripts/admin-studio-browser.mjs', 'tests/admin-studio*', 'package*.json', '.github/workflows/admin-studio.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  admin-studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run test:admin-studio
      - run: npx tsc --noEmit -p worker/tsconfig.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real synthetic admin authoring, approval and presenter workflow
        id: acceptance
        run: node scripts/diagnostic-command.mjs admin-studio-browser -- node scripts/admin-studio-browser.mjs
      - name: Write safe diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: admin-studio
          ERUDIOR_DIAG_STAGES: 'acceptance:${{ steps.acceptance.outcome }}'
        run: node scripts/ci-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-studio-browser
          path: test-results/admin-studio/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-studio-diagnostics
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14
