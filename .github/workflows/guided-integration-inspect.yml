name: Inspect pinned guided-practice integration
on:
  push:
    branches: [inspect/guided-integration-20261105]
    paths: [.github/workflows/guided-integration-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58b83b9759fe504bb8713b3e075dc0c0e4bc5629
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect exact public-source merges without changing repository refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guided-integration"
          export EVIDENCE="$RUNNER_TEMP/guided-integration"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          out=pathlib.Path(os.environ['EVIDENCE'])
          main='58b83b9759fe504bb8713b3e075dc0c0e4bc5629'
          guard='d431a4824a67cceb3313975d5bb40d81b3cfd2b3'
          guided='ab69af14ac328f4ff2975a991afb2a4a9010fda1'
          for ref in (main,guard,guided):
              subprocess.run(['git','cat-file','-e',ref+'^{commit}'],check=True)
          def merge(left,right,name):
              r=subprocess.run(['git','merge-tree','--write-tree',left,right],capture_output=True,text=True)
              (out/(name+'.txt')).write_text(r.stdout+r.stderr)
              if r.returncode not in (0,1): raise RuntimeError('Merge inspection failed')
              tree=r.stdout.splitlines()[0]
              subprocess.run(['git','cat-file','-e',tree+'^{tree}'],check=True)
              return tree,r.returncode
          first,rc=merge(main,guard,'guard-merge')
          if rc: raise RuntimeError('Native guard requires separate conflict resolution')
          env={**os.environ,'GIT_AUTHOR_NAME':'Integration inspection','GIT_AUTHOR_EMAIL':'inspection@example.invalid','GIT_COMMITTER_NAME':'Integration inspection','GIT_COMMITTER_EMAIL':'inspection@example.invalid'}
          combined=subprocess.check_output(['git','commit-tree',first,'-p',main,'-p',guard,'-m','Local inspection only, never pushed'],env=env,text=True).strip()
          tree,rc=merge(combined,guided,'guided-merge')
          entries=subprocess.check_output(['git','ls-tree','-r',tree],text=True)
          (out/'tree.txt').write_text(entries)
          (out/'diagnostic.json').write_text(json.dumps({'scope':'public source merge inspection only, not acceptance','main':main,'nativeGuard':guard,'guided':guided,'guardTree':first,'mergedTree':tree,'hasConflicts':bool(rc),'published':False,'refsModified':False},indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--prefix=merged/','--output='+str(out/'public-merged-source.tar.gz'),tree],check=True)
          PY
          (cd "$EVIDENCE" && sha256sum public-merged-source.tar.gz diagnostic.json tree.txt guided-merge.txt guard-merge.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: guided-integration-inspection
          path: ${{ runner.temp }}/guided-integration/
          retention-days: 7
          if-no-files-found: error
