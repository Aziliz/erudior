name: Inspect pinned guided-practice integration
on:
  push:
    branches: [inspect/guided-integration-20261105]
    paths: [.github/workflows/guided-integration-inspect.yml]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 58b83b9759fe504bb8713b3e075dc0c0e4bc5629
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce reviewed integration and upload Git tree objects only
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guided-integration"
          export EVIDENCE="$RUNNER_TEMP/guided-integration"
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          out=pathlib.Path(os.environ['EVIDENCE'])
          main='58b83b9759fe504bb8713b3e075dc0c0e4bc5629'
          guard='d431a4824a67cceb3313975d5bb40d81b3cfd2b3'
          guided='ab69af14ac328f4ff2975a991afb2a4a9010fda1'
          expected='dcba3cf8bb4cb31dbed218654bcd921920aec87a'
          def git(*args,**kwargs):
              return subprocess.check_output(['git',*args],text=True,**kwargs).strip()
          for ref in (main,guard,guided):
              subprocess.run(['git','cat-file','-e',ref+'^{commit}'],check=True)
          def merge(left,right,name):
              r=subprocess.run(['git','merge-tree','--write-tree',left,right],capture_output=True,text=True)
              (out/(name+'.txt')).write_text(r.stdout+r.stderr)
              if r.returncode not in (0,1): raise RuntimeError('Merge inspection failed')
              tree=r.stdout.splitlines()[0]
              subprocess.run(['git','cat-file','-e',tree+'^{tree}'],check=True)
              return tree,r.returncode
          first,rc=merge(main,guard,'guard-merge')
          if rc: raise RuntimeError('Native guard requires separate conflict resolution')
          env={**os.environ,'GIT_AUTHOR_NAME':'Integration inspection','GIT_AUTHOR_EMAIL':'inspection@example.invalid','GIT_COMMITTER_NAME':'Integration inspection','GIT_COMMITTER_EMAIL':'inspection@example.invalid'}
          combined=git('commit-tree',first,'-p',main,'-p',guard,'-m','Local inspection only, never pushed',env=env)
          tree,rc=merge(combined,guided,'guided-merge')
          if rc != 1: raise RuntimeError('Expected the two reviewed merge conflicts')
          subprocess.run(['git','read-tree',tree],check=True)
          expected_blobs={'src/lib/canonicalAuthoring.ts':'943efe0b9dd8ef6d5e2c48e6273faea8c849c91e','src/pages/Runner.tsx':'ddeabac2987ab9763fb1e1977c77a2e14a17fdca','tests/runner-keyboard.test.mts':'78c33ba8015d8998fc130beef6f2c6b9c3452839'}
          for name,blob in expected_blobs.items():
              source=subprocess.check_output(['git','show',tree+':'+name],text=True)
              if name.startswith('tests/'):
                  anchor='const routes: View[] = [];'
                  assert source.count(anchor)==1
                  result=source.replace(anchor,'// The synthetic course owns its bank, just as normalized app courses do.\ncourse.banks = [bank];\n'+anchor)
              else:
                  matches=list(re.finditer(r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n',source,re.M|re.S))
                  assert len(matches)==1
                  match=matches[0];current,old=match.group(1,2)
                  if name.endswith('canonicalAuthoring.ts'):
                      assert "'documentReviews'" in current and "'assessmentPresentation'" not in current
                      result=current.replace("'readAloud', 'audio'","'readAloud', 'assessmentPresentation', 'audio'")
                      assert result.replace("'documentReviews', ",'')==old
                  else:
                      addition='import { guidedSessionProblem, isGuidedPractice } from "../lib/assessmentPresentation";\n'
                      assert old==addition+'import { useCallback, useEffect, useMemo, useRef, useState } from "react";\n'
                      assert all(s in current for s in ['useEffectEvent','imeFor','FuriganaToggle'])
                      result=addition+current
                  result=source[:match.start()]+result+source[match.end():]
              assert not re.search(r'^(<<<<<<<|=======|>>>>>>>)',result,re.M)
              actual=git('hash-object','-w','--stdin',input=result)
              assert actual==blob,(name,actual)
              subprocess.run(['git','update-index','--cacheinfo','100644,'+blob+','+name],check=True)
          resolved=git('write-tree')
          assert resolved==expected,(resolved,expected)
          # Only materialize Git data objects. This job never creates or updates
          # commits, branches, tags, pull requests, releases or deployment state.
          names=git('diff-tree','--no-commit-id','--name-only','-r',main,resolved).splitlines()
          assert 1<=len(names)<=50
          entries=[]
          for name in names:
              assert '..' not in name.split('/') and not name.startswith(('/', 'samples/', 'account-service/', 'public/'))
              mode,kind,sha=git('ls-tree',resolved,'--',name).split('\t')[0].split()
              assert kind=='blob' and mode in ('100644','100755')
              source=subprocess.check_output(['git','show',resolved+':'+name]).decode('utf-8')
              entries.append({'path':name,'mode':mode,'type':'blob','content':source})
          payload=out/'tree-payload.json'
          payload.write_text(json.dumps({'base_tree':git('rev-parse',main+'^{tree}'),'tree':entries}))
          response=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/Aziliz/erudior/git/trees','--input',str(payload)],text=True))
          assert response['sha']==expected
          payload.unlink()
          (out/'remote-tree.json').write_text(json.dumps({'scope':'reviewed public-source integration; Git objects only, not acceptance or publication','main':main,'nativeGuard':guard,'guided':guided,'tree':response['sha'],'resolvedBlobs':expected_blobs,'changedPaths':names,'refsModified':False,'published':False},indent=2)+'\n')
          print('Verified remote Git tree:',response['sha'])
          PY
          (cd "$EVIDENCE" && sha256sum remote-tree.json guided-merge.txt guard-merge.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: guided-integration-inspection
          path: ${{ runner.temp }}/guided-integration/
          retention-days: 7
          if-no-files-found: error
