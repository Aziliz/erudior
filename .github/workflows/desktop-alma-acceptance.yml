name: Verify desktop AlmaLinux release guests
on:
  push:
    branches: [qa/desktop-alma-0.25.1]
permissions:
  contents: read
jobs:
  guest-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start a clean Debian provider
        shell: bash
        run: |
          set -euo pipefail
          devices=()
          if [[ -c /dev/kvm ]]; then devices+=(--device=/dev/kvm); fi
          if (( $(df -PB1 "$RUNNER_TEMP" | tail -1 | awk '{print $4}') < 26000000000 )); then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
          mkdir -p "$RUNNER_TEMP/alma-acceptance"
          docker run -d --name provider "${devices[@]}" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/alma-acceptance:/lab" -w /repo \
            -e XDG_DATA_HOME=/lab -e PYTHONDONTWRITEBYTECODE=1 debian:trixie-slim sleep infinity
          docker exec provider bash -euc 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -qy --no-install-recommends python3 qemu-system-x86 qemu-utils genisoimage openssh-client ca-certificates > /tmp/lab-tools.log'
      - name: Install the verified AlmaLinux DVD and kit
        id: install
        run: |
          docker exec provider python3 -u -c 'import sys; sys.path.insert(0, "src-tauri/src/vm_lab"); import runner; print("KVM available:",runner.x86_kvm(),flush=True); runner.prepare_alma_base(runner.lab_root()/"images"/runner.AUTO_IMAGE,runner.x86_kvm()); print("Verified base installed from public media",flush=True)'
      - name: RHCSA readiness, grader, and second attempt
        run: docker exec provider python3 -u tests/desktop_guest_acceptance.py rhcsa-rhel10-administration
      - name: RHCE readiness, Ansible, and second attempt
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: docker exec provider python3 -u tests/desktop_guest_acceptance.py rhce-ansible-alma10
      - name: Collect setup logs
        if: failure()
        run: |
          sudo find "$RUNNER_TEMP/alma-acceptance" -name 'alma-*.log' -exec tail -c 3000 '{}' ';' | tr '\r' '\n' | tail -110
