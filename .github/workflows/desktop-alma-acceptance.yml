name: Verify desktop AlmaLinux release guests
on:
  push:
    branches: [qa/desktop-alma-0.25.1]
permissions:
  contents: read
jobs:
  guest-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Boot the installer and both course pairs
        shell: bash
        run: |
          set -euo pipefail
          devices=()
          if [[ -c /dev/kvm ]]; then devices+=(--device=/dev/kvm); fi
          if (( $(df -PB1 "$RUNNER_TEMP" | tail -1 | awk '{print $4}') < 26000000000 )); then
            sudo rm -rf /usr/local/lib/android/sdk
          fi
          mkdir -p "$RUNNER_TEMP/alma-acceptance"
          docker run --rm "${devices[@]}" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP/alma-acceptance:/lab" -w /repo \
            -e XDG_DATA_HOME=/lab -e PYTHONDONTWRITEBYTECODE=1 debian:trixie-slim bash -eu -o pipefail -c '
              apt-get update -qq
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 qemu-system-x86 qemu-utils genisoimage openssh-client ca-certificates > /tmp/lab-tools.log
              python3 -u -c "import sys; sys.path.insert(0, \"src-tauri/src/vm_lab\"); import runner; print(\"KVM available:\",runner.x86_kvm(),flush=True); runner.prepare_alma_base(runner.lab_root()/\"images\"/runner.AUTO_IMAGE,runner.x86_kvm()); print(\"Verified base installed from public media\",flush=True)"
              python3 -u tests/desktop_guest_acceptance.py rhcsa-rhel10-administration
              python3 -u tests/desktop_guest_acceptance.py rhce-ansible-alma10
            '
      - name: Collect setup logs
        if: always()
        run: |
          sudo find "$RUNNER_TEMP/alma-acceptance" -name 'alma-*.log' -exec tail -c 16000 '{}' ';' | tr '\r' '\n' | tail -160
