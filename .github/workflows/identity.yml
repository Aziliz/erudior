name: Erudior identity and regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "tests/**"
      - "scripts/check-product-identity.mjs"
      - ".github/workflows/identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Erudior-only product identity
        run: node scripts/check-product-identity.mjs

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full regression suite
        id: regression
        run: node scripts/diagnostic-command.mjs pr-regression -- npm test
      - name: Production web build
        id: build
        run: node scripts/diagnostic-command.mjs pr-build -- npm run build

      - name: Write safe diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: regression
          ERUDIOR_DIAG_STAGES: "regression:${{ steps.regression.outcome }},build:${{ steps.build.outcome }}"
        run: node scripts/ci-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erudior-diagnostics-regression
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn
