name: Private account protocol and database acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - 'account-service/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/private-accounts.yml'
  push:
    branches: [main]
    paths:
      - 'account-service/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/private-accounts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-account-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erudior_test_admin
          # Disposable runner-only credentials. Never used by an Erudior service.
          POSTGRES_PASSWORD: erudior-synthetic-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U erudior_test_admin -d postgres'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Domain, OIDC and HTTP transport checks
        id: protocol
        run: node scripts/diagnostic-command.mjs private-account-protocol -- npm run test:accounts
      - name: Real PostgreSQL RLS, races and independent HTTP acceptance
        id: database
        env:
          ERUDIOR_ACCOUNT_TEST_ADMIN_URL: postgresql://erudior_test_admin:erudior-synthetic-test-only@127.0.0.1:5432/postgres
        run: node scripts/diagnostic-command.mjs private-account-database -- npm run test:accounts:integration
      - name: Safe diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: private-account-acceptance
          ERUDIOR_DIAG_STAGES: 'protocol:${{ steps.protocol.outcome }},database:${{ steps.database.outcome }}'
        run: node scripts/ci-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erudior-diagnostics-private-accounts
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn
