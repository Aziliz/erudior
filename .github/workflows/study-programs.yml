name: Study programs acceptance
on:
  pull_request:
    branches: [main]
    paths: ['samples/catalog.json', 'samples/math/law-*.json', 'src/lib/studyPrograms.ts', 'src/lib/jdProgram.ts', 'src/lib/learningPathways.ts', 'src/components/StudyProgramCard.tsx', 'src/pages/Programs.tsx', 'src/pages/ProgressPage.tsx', 'src/Site.tsx', 'src/learningProgress.css', 'tests/study-programs.test.mts', 'tests/enrollment-progress-ui.test.mts', 'scripts/study-programs-browser.mjs', '.github/workflows/study-programs.yml']
  push:
    branches: [main]
    paths: ['samples/catalog.json', 'samples/math/law-*.json', 'src/lib/studyPrograms.ts', 'src/lib/jdProgram.ts', 'src/lib/learningPathways.ts', 'src/components/StudyProgramCard.tsx', 'src/pages/Programs.tsx', 'src/pages/ProgressPage.tsx', 'src/Site.tsx', 'src/learningProgress.css', 'tests/study-programs.test.mts', 'tests/enrollment-progress-ui.test.mts', 'scripts/study-programs-browser.mjs', '.github/workflows/study-programs.yml']
permissions:
  contents: read
jobs:
  programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx tests/study-programs.test.mts
      - run: node --import tsx tests/learning-pathways.test.mts
      - run: node --import tsx tests/enrollment-progress-ui.test.mts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/diagnostic-command.mjs study-programs-browser -- node scripts/study-programs-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: study-programs-browser
          path: test-results/study-programs/
          if-no-files-found: warn
