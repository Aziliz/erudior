name: Recover private account dependency lock (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/recover-account-lock.yml'
      - 'account-service/package.json'

permissions:
  contents: read

jobs:
  recover-lock:
    if: github.repository == 'Aziliz/erudior' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/private-account-api-20261030'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct only the account workspace manifest additions
        run: |
          cp package.json "$RUNNER_TEMP/package-before.json"
          cp package-lock.json "$RUNNER_TEMP/lock-before.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const p = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(p.name, 'erudior');
          assert.equal(p.workspaces, undefined);
          assert.ok(p.scripts.test.startsWith('npm run test:accounts && '));
          assert.ok(p.scripts.test.includes('tsx tests/academic-records-ui.test.mts'));
          assert.ok(p.scripts['test:accounts'].endsWith('node --import tsx account-service/test/security-acceptance.test.mts'));
          p.workspaces = ['account-service'];
          p.scripts['test:accounts'] += ' && node --import tsx account-service/test/oidc.test.mts && node --import tsx account-service/test/http-contract.test.mts';
          p.scripts['test:accounts:integration'] = 'node --import tsx account-service/test/store-postgres.test.mts && node --import tsx account-service/test/service-security.test.mts';
          writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Resolve locked additions without executing package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify existing dependencies and test chain are unchanged
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const before = read(process.env.RUNNER_TEMP + '/lock-before.json');
          const after = read('package-lock.json');
          const oldManifest = read(process.env.RUNNER_TEMP + '/package-before.json');
          const newManifest = read('package.json');
          assert.equal(newManifest.scripts.test, oldManifest.scripts.test);
          assert.deepEqual(newManifest.dependencies, oldManifest.dependencies);
          assert.deepEqual(newManifest.devDependencies, oldManifest.devDependencies);
          for (const [name, value] of Object.entries(before.packages)) {
            assert.deepEqual(after.packages[name], name === '' ? { ...value, workspaces: ['account-service'] } : value, 'Unexpected dependency change: ' + name);
          }
          assert.equal(after.packages['account-service'].name, '@erudior/private-accounts');
          console.log('Preserved every existing locked package and the complete application regression chain.');
          console.log('Added lock entries:', Object.keys(after.packages).filter(name => !Object.hasOwn(before.packages, name)));
          NODE
      - name: Store reviewed manifest and lock blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          for (const path of ['package.json', 'package-lock.json']) {
            const content = readFileSync(path, 'utf8');
            const response = await fetch('https://api.github.com/repos/Aziliz/erudior/git/blobs', {
              method: 'POST', headers: { Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify({ content, encoding: 'utf-8' })
            });
            assert.equal(response.status, 201, 'Git blob creation failed');
            const result = await response.json();
            assert.match(result.sha, /^[a-f0-9]{40}$/);
            console.log(JSON.stringify({ path, blob: result.sha, bytes: Buffer.byteLength(content), sha256: createHash('sha256').update(content).digest('hex') }));
          }
          NODE
