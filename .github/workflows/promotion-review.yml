name: Reviewed promotion isolated acceptance
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'worker/**', 'scripts/promotion-review-browser.mjs', 'scripts/verify-promotion-handoff.ts', 'scripts/publish-courses.ts', 'scripts/verify-immutable-release.sh', 'scripts/lib/**', 'tests/promotion*', 'tests/admin-promotions*', 'tests/fixtures/**', 'tests/helpers/**', 'package*.json', '.github/workflows/promotion-review.yml']
  push:
    branches: [main]
    paths: ['src/**', 'worker/**', 'scripts/promotion-review-browser.mjs', 'scripts/verify-promotion-handoff.ts', 'scripts/publish-courses.ts', 'scripts/verify-immutable-release.sh', 'scripts/lib/**', 'tests/promotion*', 'tests/admin-promotions*', 'tests/fixtures/**', 'tests/helpers/**', 'package*.json', '.github/workflows/promotion-review.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: promotion-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  promotion-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix worker
      - name: Review protocol, API, UI and independent publisher contracts
        id: contracts
        run: node scripts/diagnostic-command.mjs promotion-review-contracts -- npm run test:promotion-review
      - name: Existing release-integrity boundaries remain mandatory
        id: integrity
        run: |
          node --import tsx tests/promotion-candidate.test.mts
          node --import tsx tests/course-integrity.test.mts
          node --import tsx tests/course-revision.test.mts
          node --import tsx tests/spreadsheet-release-approval.test.mts
          node --import tsx tests/spreadsheet-lifecycle-integrity.test.mts
          node --import tsx tests/release-transfer.test.mts
          node --import tsx tests/canonical-release-lanes.test.mts
      - run: npx tsc --noEmit -p worker/tsconfig.json
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Real isolated source to reviewed handoff to synthetic publisher pipeline
        id: acceptance
        run: node scripts/diagnostic-command.mjs promotion-review-browser -- node scripts/promotion-review-browser.mjs
      - name: Record exact-head verification scope
        if: always()
        env:
          CONTRACT_RESULT: ${{ steps.contracts.outcome }}
          INTEGRITY_RESULT: ${{ steps.integrity.outcome }}
          BROWSER_RESULT: ${{ steps.acceptance.outcome }}
        run: |
          {
            echo '### Reviewed promotion acceptance'
            echo "- Exact checked-out commit: $(git rev-parse HEAD)"
            echo "- Review contracts: $CONTRACT_RESULT"
            echo "- Existing release-integrity checks: $INTEGRITY_RESULT"
            echo "- Real local Worker/D1/R2 and browser: $BROWSER_RESULT"
            echo '- Desktop/mobile, light/dark automated WCAG 2.2 AA checks and screenshots are retained as artifacts.'
            echo '- Synthetic reviews and ephemeral test signatures do not establish publisher authorization, real source rights or production readiness.'
            echo '- No production credentials, origins, cloud writes, adopted courses or release uploads are used.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Write safe diagnostics
        if: always()
        env:
          ERUDIOR_DIAG_JOB: promotion-review
          ERUDIOR_DIAG_STAGES: 'contracts:${{ steps.contracts.outcome }},integrity:${{ steps.integrity.outcome }},acceptance:${{ steps.acceptance.outcome }}'
        run: node scripts/ci-diagnostics.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-review-browser
          path: test-results/promotion-review/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-review-diagnostics
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          if-no-files-found: warn
          retention-days: 14
