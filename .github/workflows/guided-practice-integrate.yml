name: Integrate exact-base guided-practice branch
on:
  push:
    branches: [work/guided-practice-20261103]
    paths: [scripts/guided-practice-integrate.py, .github/workflows/guided-practice-integrate.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'Aziliz/erudior' && github.ref == 'refs/heads/work/guided-practice-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply inspected source changes only to the feature branch
        run: |
          set -euo pipefail
          python3 scripts/guided-practice-integrate.py
          # Workflow writes use the authorized connector separately, not this runner token.
          git restore -- .github/workflows/community.yml .github/workflows/courses.yml .github/workflows/guided-practice-integrate.yml .github/workflows/guided-practice-workspace.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/guided-practice-integrate.py
          git commit -m 'feat: integrate explicit untimed guided-practice course presentation'
          git push origin HEAD:refs/heads/work/guided-practice-20261103
