name: Publish website and courses

# Publishes the course packages to Cloudflare R2 and the web app (free learning) to
# Cloudflare Pages. One-time setup: docs/HOSTING.md. Runs only once the COURSES_URL
# repository variable is set, so it stays idle until hosting exists.
on:
  workflow_dispatch:
    inputs:
      bootstrap_first_release:
        description: "Initialize first release only if no remote catalog exists"
        type: boolean
        required: true
        default: false
  push:
    branches: [main]
    paths:
      - "samples/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "public/**"
      - "functions/**"
      - "scripts/prerender.mjs"
      - "scripts/publish-courses.ts"
      - "scripts/fetch-previous-courses.ts"
      - "scripts/recheck-course-catalog.ts"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.COURSES_URL != '' }}
    runs-on: ubuntu-latest
    env:
      VITE_COURSES_URL: ${{ vars.COURSES_URL }}
      VITE_COMMUNITY_API: ${{ vars.COMMUNITY_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COURSE_SIGNING_KEY: ${{ secrets.COURSE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the signing key matches the app
        run: npx tsx scripts/check-signing-key.ts

      - name: Fetch and authenticate previous release
        env:
          COURSE_PREVIOUS_URL: ${{ vars.COURSES_URL }}
          COURSE_PREVIOUS_RELEASE_DIR: .course-previous
          COURSE_BOOTSTRAP_FIRST_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_first_release && 'true' || 'false' }}
          COURSE_SIGNING_KEY: ${{ secrets.COURSE_SIGNING_KEY }}
        run: npx tsx scripts/fetch-previous-courses.ts

      - name: Build and sign course packages
        env:
          COURSE_PREVIOUS_RELEASE_DIR: .course-previous
        run: npm run courses:publish

      # Course files are immutable (named by revision): upload only new ones, then the
      # catalog last, so a catalog never points at a file that isn't there yet.
      - name: Upload course packages to R2
        working-directory: dist-courses/v1
        run: |
          for f in *.r*.json states.*.json; do
            # Immutable filenames must never point to different bytes on a later release.
            status=$(curl --silent --show-error --location --output /tmp/erudior-remote-course --write-out '%{http_code}' --max-time 60 "${VITE_COURSES_URL}${f}")
            if [ "$status" = "200" ]; then
              if ! cmp -s "$f" /tmp/erudior-remote-course; then
                echo "::error::Immutable published file differs: $f"; exit 1
              fi
              echo "verified existing $f"; continue
            fi
            if [ "$status" != "404" ]; then
              echo "::error::Cannot verify existing remote file $f (HTTP $status)"; exit 1
            fi
            npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/$f" --file "$f" \
              --content-type application/json --cache-control "public, max-age=31536000, immutable"
          done
          # Re-check the exact authenticated baseline just before committing a new catalog.
          # GitHub's site concurrency group serializes our own publishers; this also
          # detects most out-of-band writes, but is not atomic compare-and-swap.
          COURSE_PREVIOUS_URL="${VITE_COURSES_URL}" \
          COURSE_PREVIOUS_RELEASE_DIR="../../.course-previous" \
          COURSE_BOOTSTRAP_FIRST_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_first_release && 'true' || 'false' }}" \
          npx tsx ../../scripts/recheck-course-catalog.ts
          npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/catalog.json" --file catalog.json \
            --content-type application/json --cache-control "public, max-age=300"
          npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/catalog.json.sig" --file catalog.json.sig \
            --content-type text/plain --cache-control "public, max-age=300"

      - name: Sitemap from the course catalog
        run: node scripts/sitemap.mjs

      - name: Build the web app
        run: npm run build

      # Rendered HTML of the public pages for search engines and link previews (served by
      # functions/_middleware.js). A failure here only means plain pages, so it doesn't block.
      - name: Prerender public pages
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs

      - name: Deploy the web app to Pages
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
