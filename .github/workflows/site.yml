name: Publish website and courses

# Publishes the course packages to Cloudflare R2 and the web app (free learning) to
# Cloudflare Pages. One-time setup: docs/HOSTING.md. Runs only once the COURSES_URL
# repository variable is set, so it stays idle until hosting exists.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "samples/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "public/**"
      - "functions/**"
      - "scripts/prerender.mjs"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.COURSES_URL != '' }}
    runs-on: ubuntu-latest
    env:
      VITE_COURSES_URL: ${{ vars.COURSES_URL }}
      VITE_COMMUNITY_API: ${{ vars.COMMUNITY_API }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COURSE_SIGNING_KEY: ${{ secrets.COURSE_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check the signing key matches the app
        run: npx tsx scripts/check-signing-key.ts

      - name: Build and sign course packages
        run: npm run courses:publish

      # Course files are immutable (named by revision): upload only new ones, then the
      # catalog last, so a catalog never points at a file that isn't there yet.
      - name: Upload course packages to R2
        working-directory: dist-courses/v1
        run: |
          for f in *.r*.json states.*.json; do
            if curl -sfI "${VITE_COURSES_URL}${f}" > /dev/null; then echo "have $f"; continue; fi
            npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/$f" --file "$f" \
              --content-type application/json --cache-control "public, max-age=31536000, immutable"
          done
          npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/catalog.json" --file catalog.json \
            --content-type application/json --cache-control "public, max-age=300"
          npx --yes wrangler@3.114.0 r2 object put "${{ vars.R2_BUCKET }}/v1/catalog.json.sig" --file catalog.json.sig \
            --content-type text/plain --cache-control "public, max-age=300"

      - name: Sitemap from the course catalog
        run: node scripts/sitemap.mjs

      - name: Build the web app
        run: npm run build

      # Rendered HTML of the public pages for search engines and link previews (served by
      # functions/_middleware.js). A failure here only means plain pages, so it doesn't block.
      - name: Prerender public pages
        continue-on-error: true
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs

      - name: Deploy the web app to Pages
        run: npx --yes wrangler@3.114.0 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
