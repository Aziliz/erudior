name: Deploy Erudior website

# Website-only release: Cloudflare Pages, independent of course signing and API migrations.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/site.yml"
      - "scripts/prerender.mjs"
      - "scripts/prerender-browser.mjs"
      - "scripts/startup-splash-browser.mjs"
      - "scripts/webapp-startup-browser.mjs"
      - "src/lib/startupSplash.ts"
      - "src/lib/startupSplashPolicy.ts"
      - "src/startupSplash.css"
      - "src/engineAttribution.css"
      - "src/components/EngineAttribution.tsx"
      - "src/Site.tsx"
      - "src/main.tsx"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "public/**"
      - "functions/**"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - "scripts/prerender.mjs"
      - "scripts/prerender-browser.mjs"
      - "scripts/startup-splash-browser.mjs"
      - "scripts/webapp-startup-browser.mjs"
      - "scripts/sitemap.mjs"
      - ".github/workflows/site.yml"
permissions:
  contents: read

concurrency:
  group: erudior-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  website:
    # Website deployment is independent of slow or failing course R2 verification.
    if: ${{ github.event_name == 'pull_request' || vars.PAGES_PROJECT != '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify Erudior-only product identity
        run: node scripts/check-product-identity.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create public sitemap
        run: node scripts/sitemap.mjs
      - name: Build website
        id: website_build
        run: node scripts/diagnostic-command.mjs website-build -- npm run build
      - name: Prerender public pages
        id: website_prerender
        run: |
          npx playwright install --with-deps chromium
          node scripts/prerender.mjs
      - name: Review splash choreography and lifecycle in browser
        id: splash_browser
        run: node scripts/diagnostic-command.mjs website-splash-browser -- node scripts/startup-splash-browser.mjs
      - name: Upload splash frame review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: startup-splash-visual-evidence
          path: artifacts/startup-splash/
          if-no-files-found: warn
      - name: Verify web-app-only startup and manual footer preview
        id: webapp_startup
        run: node scripts/diagnostic-command.mjs webapp-startup-browser -- node scripts/webapp-startup-browser.mjs
      - name: Upload web app startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-startup-evidence
          path: artifacts/webapp-startup/
          if-no-files-found: warn
      - name: Verify served snapshots clear startup overlays
        id: snapshot_browser
        run: node scripts/diagnostic-command.mjs website-snapshot-browser -- node scripts/prerender-browser.mjs
      - name: Upload snapshot browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerender-browser-evidence
          path: artifacts/prerender-browser/
          if-no-files-found: warn
      - name: Deploy website to Cloudflare Pages
        id: pages_deploy
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_COURSES_URL: ${{ vars.COURSES_URL }}
          VITE_COMMUNITY_API: ${{ vars.COMMUNITY_API }}
        run: node scripts/diagnostic-command.mjs website-deploy -- npx --yes wrangler@3.114.0 pages deploy dist --project-name "${{ vars.PAGES_PROJECT }}" --branch main
      - name: Write safe CI diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: website
          ERUDIOR_DIAG_STAGES: "build:${{ steps.website_build.outcome }},prerender:${{ steps.website_prerender.outcome }},splash-browser:${{ steps.splash_browser.outcome }},webapp-startup:${{ steps.webapp_startup.outcome }},snapshot-browser:${{ steps.snapshot_browser.outcome }},deploy:${{ steps.pages_deploy.outcome }}"
        run: node scripts/ci-diagnostics.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erudior-diagnostics-website
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn
