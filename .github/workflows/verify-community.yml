name: Community creator checks
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/verify-community.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Community regression tests
        run: npx tsx tests/community.test.mts && npx tsx tests/community-modules.test.mts && npx tsx tests/community-promotion.test.mts
      - name: Production build
        run: npm run build
      - name: Complete test suite
        timeout-minutes: 15
        run: npm test
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npx tsc -p .
