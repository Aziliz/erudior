name: Guided-practice course presentation acceptance
on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/guided-practice.test.mts', 'scripts/guided-practice-browser.mjs', 'scripts/reference-reflow-browser.mjs', 'package*.json', '.github/workflows/guided-practice.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/guided-practice.test.mts', 'scripts/guided-practice-browser.mjs', 'scripts/reference-reflow-browser.mjs', 'package*.json', '.github/workflows/guided-practice.yml']
permissions:
  contents: read
concurrency:
  group: guided-practice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guided-practice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --import tsx --test tests/guided-practice.test.mts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: node scripts/guided-practice-browser.mjs
      - name: Reference text reflow without clipping or source-link changes
        run: node scripts/reference-reflow-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-practice-browser
          path: |
            test-results/guided-practice/
            test-results/reference-reflow/
          retention-days: 14
          if-no-files-found: warn
