name: Verify practical grading and course import
on:
  pull_request:
    paths:
      - 'src-tauri/src/vm_lab/**'
      - 'tests/vm_*.py'
      - 'src/lib/vmLab.ts'
      - 'samples/rhcsa-10-administration.json'
      - '.github/workflows/vm-grading.yml'
permissions:
  contents: read
jobs:
  grades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'vm_*_test.py'
      - run: node --import tsx tests/vm-exam.test.mts && node --import tsx tests/rhcsa-editions.test.mts
  real-ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Grade Ansible convergence and six RHCSA tasks on fresh AlmaLinux 10 guests
        run: |
          devices=()
          if [[ -e /dev/kvm ]]; then devices+=(--device /dev/kvm); fi
          docker run --rm "${devices[@]}" -v "$PWD:/project" -w /project debian:trixie bash -euc '
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates python3 qemu-system-x86 qemu-utils genisoimage openssh-client
            sh tests/installed-lab/provider-media.sh
            python3 - <<"PY"
          import sys, zipfile
          from pathlib import Path
          sys.path.insert(0, "src-tauri/src/vm_lab")
          import runner, alma_setup
          directory = runner.lab_root() / "images"
          (directory / runner.AUTO_IMAGE).symlink_to(directory / (runner.SCENARIO + ".qcow2"))
          with Path("public/downloads", alma_setup.KIT_NAME).open("rb") as kit:
              path = alma_setup.cache_medium(directory,"kit",kit)
          with zipfile.ZipFile(path) as archive:
              (directory / "Erudior-setup.iso").write_bytes(archive.read("Erudior-setup.iso"))
          alma_setup.acquire_medium(directory,"dvd")
          PY
            python3 tests/vm_ansible_host.py
            python3 tests/vm_rhcsa_host.py'
      - uses: actions/upload-artifact@v4
        with:
          name: ansible-managed-node-receipt
          path: ansible-guest-receipt.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rhcsa-six-task-receipt
          path: rhcsa-six-guest-receipt.json
          if-no-files-found: error
