name: Verify practical grading and course import
on:
  pull_request:
    paths:
      - 'src-tauri/src/vm_lab/**'
      - 'tests/vm_*.py'
      - 'src/lib/vmLab.ts'
      - 'samples/rhcsa-10-administration.json'
      - '.github/workflows/vm-grading.yml'
permissions:
  contents: read
jobs:
  grades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python3 -m unittest discover -s tests -p 'vm_*_test.py'
      - run: node --import tsx tests/vm-exam.test.mts && node --import tsx tests/rhcsa-editions.test.mts
