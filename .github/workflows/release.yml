name: Build installers

# Push a tag like v0.3.0 to build and publish a GitHub release with every installer:
# Windows (.exe, .msi), Linux (.deb, .rpm, AppImage) and macOS (universal .dmg). The
# website's Download page (app.erudior.com/download) offers the latest release, and the
# Homebrew cask (Aziliz/homebrew-erudior) installs its .dmg under a fixed name.
# In-app updates: tauri-action uploads latest.json and the signed update bundles; installed
# apps (Windows, macOS, AppImage) check it at startup. Needs the TAURI_SIGNING_PRIVATE_KEY
# secret (the key whose public half is in tauri.conf.json; no password).
# Run it by hand from the Actions tab to just build (installers are attached
# to the workflow run as artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: nsis,msi
          - platform: macos-latest
            bundles: dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      # Once course hosting is set up (docs/HOSTING.md), installers download courses from
      # the website instead of bundling them.
      - name: Course download address
        if: ${{ vars.COURSES_URL != '' }}
        shell: bash
        run: |
          echo "VITE_COURSES_URL=${{ vars.COURSES_URL }}" >> "$GITHUB_ENV"
          echo "VITE_COMMUNITY_API=${{ vars.COMMUNITY_API }}" >> "$GITHUB_ENV"

      - name: Build (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Erudior ${{ github.ref_name }}
          releaseBody: Download the installer for your system below.
          releaseDraft: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      - name: Build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      # Homebrew's cask downloads releases/latest/download/Erudior-macOS-universal.dmg, so the
      # .dmg is also attached under that fixed name.
      - name: Attach the .dmg under a fixed name
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Erudior-macOS-universal.dmg
          gh release upload "${{ github.ref_name }}" Erudior-macOS-universal.dmg --clobber

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: erudior-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
