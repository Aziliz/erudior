name: Build installers

# Advance .github/desktop-release on main to publish a new engine with every installer:
# Windows (.exe, .msi), Linux (.deb, .rpm, AppImage) and macOS (universal .dmg). The
# website's Download page (app.erudior.com/download) offers the latest release, and the
# Homebrew cask (Aziliz/homebrew-erudior) installs its .dmg under a fixed name.
# In-app updates: tauri-action uploads latest.json and the signed update bundles; installed
# apps (Windows, macOS, RPM, DEB and AppImage) check it at startup. Needs the TAURI_SIGNING_PRIVATE_KEY
# secret (the key whose public half is in tauri.conf.json; no password).
# Run it by hand from the Actions tab to just build (installers are attached
# to the workflow run as artifacts).
on:
  push:
    branches: [main]
    paths: [".github/desktop-release"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.engine.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check engine inputs since the last desktop release
        id: engine
        run: python3 scripts/desktop-engine-changed.py >> "$GITHUB_OUTPUT"

  build:
    needs: engine
    if: needs.engine.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: nsis,msi
          - platform: macos-latest
            # "app" makes the signed .app.tar.gz the macOS auto-updater downloads.
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Preserve exact repository bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Verify Erudior-only product identity
        run: node scripts/check-product-identity.mjs

      - name: Verify Windows lab onboarding
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/windows-lab-setup.tests.ps1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file

      - name: Provide GNU utilities used by release transport tests
        if: runner.os == 'macOS'
        run: |
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Diagnostic runner tests
        run: node --test tests/diagnostic-command.test.mjs
      - name: Regression tests
        id: regression
        env:
          npm_config_script_shell: bash
        run: node scripts/diagnostic-command.mjs regression -- npm test

      - name: Build signed installers and updater packages
        id: signed_build
        env:
          VITE_COMMUNITY_API: ${{ vars.COMMUNITY_API }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: erudior-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb.sig
            src-tauri/target/release/bundle/rpm/*.rpm.sig
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error
          compression-level: 0
      - name: Write safe CI diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: "installers-${{ matrix.platform }}"
          ERUDIOR_DIAG_STAGES: "regression:${{ steps.regression.outcome }},signed_build:${{ steps.signed_build.outcome }}"
        shell: bash
        run: node scripts/ci-diagnostics.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erudior-diagnostics-installers-${{ matrix.platform }}
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push' || github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: desktop-release-publication
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: erudior-*
          path: installers
      - name: Verify all signed updater packages
        shell: bash
        run: |
          set -euo pipefail
          tag=$(cat .github/desktop-release)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag=$GITHUB_REF_NAME; fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "DESKTOP_TAG=$tag" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/prepare-desktop-release.py installers upload "$tag" "$GITHUB_REPOSITORY"
      - name: Publish the complete desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ref=$(git ls-remote --refs origin "refs/tags/$DESKTOP_TAG" | cut -f1)
          if [[ -z "$ref" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$DESKTOP_TAG" -f sha="$GITHUB_SHA" >/dev/null
          else
            git fetch --quiet origin "refs/tags/$DESKTOP_TAG"
            [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$GITHUB_SHA" ]]
          fi
          if draft=$(gh release view "$DESKTOP_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == true ]]
          else
            gh release create "$DESKTOP_TAG" --draft --verify-tag --title "Erudior $DESKTOP_TAG" \
              --notes "Desktop installers for Windows, macOS and Linux. Erudior offers new versions before downloading and saves verified updates until you choose to install and restart. Includes Windows, macOS, AppImage, RPM and DEB updates. Course authors can offer an AlmaLinux practice terminal and choose a basic, scientific or graphing calculator. Learners can open the tools their course provides."
          fi
          latest=$(gh release view --json tagName --jq .tagName)
          if [[ "$(printf '%s\n' "$latest" "$DESKTOP_TAG" | sort -V | tail -n1)" != "$DESKTOP_TAG" ]]; then
            echo "::error::A newer desktop release already exists."; exit 1
          fi
          gh release upload "$DESKTOP_TAG" upload/* --clobber
          gh release edit "$DESKTOP_TAG" --draft=false --latest
