name: Build installers

# Push a tag like v0.3.0 to build a draft GitHub release with every installer.
# The repo is private, so in-app updates are off; install new versions by hand.
# (To re-enable updates: publish releases to a public repo, set
# includeUpdaterJson: true, and turn updates back on as described in
# src/lib/updates.ts.)
# Run it by hand from the Actions tab to just build (installers are attached
# to the workflow run as artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: nsis,msi
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - run: npm test

      # Once course hosting is set up (docs/HOSTING.md), installers download courses from
      # the website instead of bundling them.
      - name: Course download address
        if: ${{ vars.COURSES_URL != '' }}
        shell: bash
        run: echo "VITE_COURSES_URL=${{ vars.COURSES_URL }}" >> "$GITHUB_ENV"

      - name: Build (tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Examiner ${{ github.ref_name }}
          releaseBody: Download the installer for your system below.
          releaseDraft: true
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

      - name: Build (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: examiner-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
