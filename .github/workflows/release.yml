name: Build installers

# Push a tag like v0.3.0 to build and publish a GitHub release with every installer:
# Windows (.exe, .msi), Linux (.deb, .rpm, AppImage) and macOS (universal .dmg). The
# website's Download page (app.erudior.com/download) offers the latest release, and the
# Homebrew cask (Aziliz/homebrew-erudior) installs its .dmg under a fixed name.
# In-app updates: tauri-action uploads latest.json and the signed update bundles; installed
# apps (Windows, macOS, AppImage) check it at startup. Needs the TAURI_SIGNING_PRIVATE_KEY
# secret (the key whose public half is in tauri.conf.json; no password).
# Run it by hand from the Actions tab to just build (installers are attached
# to the workflow run as artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to rebuild and publish (leave blank for an artifacts-only build)
        required: false
        type: string

env:
  INSTALLER_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,rpm,appimage
          - platform: windows-latest
            bundles: nsis,msi
          - platform: macos-latest
            # "app" makes the signed .app.tar.gz the macOS auto-updater downloads.
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
      - name: Verify the source for a tagged rebuild
        if: inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$INSTALLER_TAG" = "v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          git fetch --no-tags origin "refs/tags/$INSTALLER_TAG:refs/tags/$INSTALLER_TAG"
          # Only the test harness and installer workflow may differ from the
          # published tag. Compile the original tagged tree after regression.
          git diff --exit-code "refs/tags/$INSTALLER_TAG" HEAD -- . \
            ':(exclude).github/workflows/release.yml' ':(exclude)tests/**' \
            ':(exclude)scripts/diagnostic-command.mjs' ':(exclude)scripts/verify-promotion-handoff.ts'
      - name: Verify Erudior-only product identity
        run: node scripts/check-product-identity.mjs

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Diagnostic runner tests
        run: node --test tests/diagnostic-command.test.mjs
      - name: Regression tests
        id: regression
        env:
          # The full npm test script exceeds cmd.exe's command-length limit.
          npm_config_script_shell: bash
        run: node scripts/diagnostic-command.mjs regression -- npm test

      - name: Restore exact release sources for packaging
        if: inputs.release_tag != ''
        shell: bash
        run: git checkout --detach "refs/tags/$INSTALLER_TAG"

      # Once course hosting is set up (docs/HOSTING.md), installers download courses from
      # the website instead of bundling them.
      - name: Course download address
        if: ${{ vars.COURSES_URL != '' }}
        shell: bash
        run: |
          echo "VITE_COURSES_URL=${{ vars.COURSES_URL }}" >> "$GITHUB_ENV"
          echo "VITE_COMMUNITY_API=${{ vars.COMMUNITY_API }}" >> "$GITHUB_ENV"

      - name: Build (tagged release)
        id: tagged_build
        if: env.INSTALLER_TAG != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ env.INSTALLER_TAG }}
          releaseName: Erudior ${{ env.INSTALLER_TAG }}
          releaseBody: Download the installer for your system below.
          releaseDraft: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      - name: Build (manual run)
        id: manual_build
        if: env.INSTALLER_TAG == ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: npx tauri build --bundles ${{ matrix.bundles }}${{ matrix.target && format(' --target {0}', matrix.target) || '' }}

      # Homebrew's cask downloads releases/latest/download/Erudior-macOS-universal.dmg, so the
      # .dmg is also attached under that fixed name.
      - name: Attach the .dmg under a fixed name
        if: runner.os == 'macOS' && env.INSTALLER_TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" Erudior-macOS-universal.dmg
          gh release upload "$INSTALLER_TAG" Erudior-macOS-universal.dmg --clobber

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: erudior-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Write safe CI diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: "installers-${{ matrix.platform }}"
          ERUDIOR_DIAG_STAGES: "regression:${{ steps.regression.outcome }},tagged_build:${{ steps.tagged_build.outcome }},manual_build:${{ steps.manual_build.outcome }}"
        shell: bash
        run: node scripts/ci-diagnostics.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erudior-diagnostics-installers-${{ matrix.platform }}
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn
