name: Deploy community API

# Deploys worker/ (api.erudior.com: community courses on D1 + R2). One-time setup is in
# docs/HOSTING.md; stays idle until the COMMUNITY_API and D1_DATABASE_ID variables are set.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/lib/communityFormat.ts"
      - ".github/workflows/community.yml"

permissions:
  contents: read

concurrency:
  group: community-api
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.COMMUNITY_API != '' && vars.D1_DATABASE_ID != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Erudior-only product identity
        run: node ../scripts/check-product-identity.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        id: typecheck
        run: node ../scripts/diagnostic-command.mjs community-typecheck -- npx tsc -p .

      - name: Point wrangler.toml at the real database
        run: sed -i 's/00000000-0000-0000-0000-000000000000/${{ vars.D1_DATABASE_ID }}/' wrangler.toml

      - name: Apply database migrations
        id: migrations
        run: node ../scripts/diagnostic-command.mjs community-migrations -- npx wrangler d1 migrations apply erudior-community --remote

      - name: Update sign-in secrets (when set)
        env:
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRET" ]; then printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET; fi
          if [ -n "$GITHUB_CLIENT_SECRET" ]; then printf '%s' "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET; fi

      - name: Deploy
        id: deploy
        run: >
          npx wrangler deploy
          --var ADMIN_EMAILS:"${{ vars.ADMIN_EMAILS }}"
          --var GOOGLE_CLIENT_ID:"${{ vars.GOOGLE_CLIENT_ID }}"
          --var GITHUB_CLIENT_ID:"${{ vars.OAUTH_GITHUB_CLIENT_ID }}"
      - name: Write safe CI diagnostic summary
        if: always()
        env:
          ERUDIOR_DIAG_JOB: "community"
          ERUDIOR_DIAG_STAGES: "typecheck:${{ steps.typecheck.outcome }},migrations:${{ steps.migrations.outcome }},deploy:${{ steps.deploy.outcome }}"
        run: node ../scripts/ci-diagnostics.mjs
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erudior-diagnostics-community
          path: ${{ runner.temp }}/erudior-ci-diagnostics/
          retention-days: 30
          if-no-files-found: warn
