# Erudior community course API (api.erudior.com). See docs/HOSTING.md.
name = "erudior-community"
main = "src/index.ts"
compatibility_date = "2025-02-01"
workers_dev = false
routes = [{ pattern = "api.erudior.com", custom_domain = true }]

[vars]
APP_ORIGIN = "https://app.erudior.com"
# Extra origins allowed to call signed-in endpoints (comma separated), e.g. local dev.
ALLOWED_ORIGINS = ""
API_ORIGIN = "https://api.erudior.com"
# Signed-in users with these emails become admins (comma separated).
ADMIN_EMAILS = ""
GOOGLE_CLIENT_ID = ""
GITHUB_CLIENT_ID = ""
# Secrets (wrangler secret put): GOOGLE_CLIENT_SECRET, GITHUB_CLIENT_SECRET

[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

[[d1_databases]]
binding = "DB"
database_name = "erudior-community"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "erudior-community"

# Local development (npm run dev): http://localhost:8787, dev sign-in turned on.
[env.dev]
name = "erudior-community-dev"
routes = []
workers_dev = true
[env.dev.vars]
APP_ORIGIN = "http://localhost:5181"
ALLOWED_ORIGINS = "http://localhost:5181,http://localhost:5179,http://localhost:1420"
API_ORIGIN = "http://localhost:8787"
ADMIN_EMAILS = "admin@example.test"
GOOGLE_CLIENT_ID = ""
GITHUB_CLIENT_ID = ""
DEV_LOGIN = "1"
[[env.dev.durable_objects.bindings]]
name = "LIVE"
class_name = "LiveRoom"
[[env.dev.d1_databases]]
binding = "DB"
database_name = "erudior-community"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
[[env.dev.r2_buckets]]
binding = "FILES"
bucket_name = "erudior-community"
